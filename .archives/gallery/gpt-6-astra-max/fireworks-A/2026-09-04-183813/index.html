<!DOCTYPE html>
<html lang="en">
<head>

<title>Afterglow — Paint the night</title>
<style>
  :root { color-scheme: dark; --paper:#f5eedf; --muted:#9b9ca7; --gold:#e7c18a; --line:rgba(224,221,213,.15); }
  * { box-sizing:border-box; }

  button, select, input { font:inherit; }

  .icon-button:hover { background:rgba(231,193,138,.1); border-color:rgba(231,193,138,.5); }

  .dock { position:fixed; bottom:53px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:0; padding:12px 13px 12px 17px; border:1px solid rgba(219,223,241,.15); border-radius:17px; background:rgba(15,20,33,.84); box-shadow:0 16px 50px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.025); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); }
  .autoplay { border:0; background:transparent; display:flex; align-items:center; gap:11px; text-align:left; padding:7px 16px 7px 0; }
  .play-icon { display:grid; place-items:center; width:35px; height:35px; border-radius:50%; background:#232938; border:1px solid rgba(255,255,255,.06); color:#e5dccb; }

  .control-value { font-size:12px; color:#e4e1dc; white-space:nowrap; }

  .shape-button > svg { width:12px; height:12px; color:#8f94a3; transition:transform .2s; }
  .shape-button[aria-expanded=true] > svg { transform:rotate(180deg); }
  .shape-menu { position:absolute; bottom:calc(100% + 26px); left:5px; width:185px; padding:6px; border-radius:13px; border:1px solid #383b48; background:#111726; box-shadow:0 10px 30px #0006; }
  [hidden] { display:none!important; }
  .shape-option { width:100%; display:flex; justify-content:space-between; align-items:center; border:0; border-radius:7px; background:transparent; padding:12px; color:#bbbfc8; font-size:12px; text-align:left; }

  .swatch::after { content:''; position:absolute; inset:-4px; border:1px solid transparent; border-radius:100%; transition:border-color .2s; }
  .swatch[aria-pressed=true]::after { border-color:#d7ccb8; }

  input[type=range] { appearance:none; width:70px; height:3px; border-radius:10px; margin:4px 0; background:linear-gradient(to right,#c2a67f 50%,#343a48 50%); cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { appearance:none; width:9px; height:9px; border-radius:100%; background:#e3d3b9; }
  input[type=range]::-moz-range-thumb { width:9px; height:9px; border:0; border-radius:100%; background:#e3d3b9; }
  .finale { display:flex; align-items:center; justify-content:center; gap:10px; margin-left:1px; padding:16px 21px; min-width:146px; background:#e3c18d; color:#211d17; border:1px solid #f3d9ab; border-radius:9px; font-size:12px; transition:background .2s,transform .2s; white-space:nowrap; }
  .finale:hover { background:#f3d6a5; transform:translateY(-1px); }
  .finale:active { transform:translateY(1px); }
  .finale:disabled { cursor:default; background:#aa9475; border-color:#aa9475; transform:none; }
  .finale svg { width:17px; height:17px; }
  .footer { position:fixed; left:48px; right:48px; bottom:22px; display:flex; align-items:center; justify-content:space-between; color:#696f80; font-size:9px; letter-spacing:.4px; pointer-events:none; }
  .footer-center { position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .key { padding:2px 4px; border:1px solid #303644; border-radius:3px; font-size:8px; letter-spacing:.3px; }
  .footer-divider { margin:0 5px; color:#373e4c; }
  .counter { font-variant-numeric:tabular-nums; color:#a39b8f; }
  #toast { position:fixed; bottom:145px; left:50%; transform:translate(-50%,8px); background:#161d2be8; border:1px solid #383d49; padding:10px 16px; border-radius:30px; color:#e7d3b4; font-size:11px; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; white-space:nowrap; }
  #toast.visible { opacity:1; transform:translate(-50%,0); }
  @media (min-width:1600px) { .intro { bottom:170px; } }
  @media (max-width:1050px) { .header { padding:26px 29px; } .scene-note { left:30px; top:103px; } .intro { left:30px; bottom:162px; } h1 { font-size:51px; } .launch-hint { right:30px; } .footer { left:30px; right:30px; } .edition { font-size:8px; letter-spacing:2px; } .tempo { display:none; } .dock { bottom:51px; } }
  @media (max-width:700px) { .header { padding:23px 21px; } .brand { font-size:25px; gap:10px; } .brand-mark { width:23px; } .edition { display:none; } .icon-button { width:36px; height:36px; } .header-actions { gap:8px; } .scene-note { top:88px; left:23px; font-size:8px; } .intro { left:23px; bottom:204px; } h1 { font-size:43px; letter-spacing:-1.8px; } .eyebrow { font-size:8px; margin-bottom:13px; } .intro p { font-size:11px; margin-top:14px; } .launch-hint { bottom:198px; right:23px; font-size:0; gap:0; } .launch-hint svg { width:27px; height:27px; } .dock { bottom:47px; width:calc(100% - 32px); max-width:420px; padding:12px; border-radius:15px; flex-wrap:wrap; gap:12px 0; justify-content:space-between; } .autoplay { padding:2px 10px 2px 0; } .autoplay .play-icon { width:30px; height:30px; } .autoplay .control-label { display:none; } .control-value { font-size:11px; } .shape-button { min-width:0; padding:2px 12px; gap:14px; } .shape-button .control-label { display:none; } .palette { padding:2px 7px 2px 12px; } .palette .control-label { display:none; } .swatches { gap:10px; } .swatch { width:13px; height:13px; } .separator { height:22px; } .separator.last { display:none; } .finale { width:100%; margin:0; padding:12px; font-size:11px; } .shape-menu { left:-25px; bottom:calc(100% + 21px); } .footer { left:23px; right:23px; bottom:22px; font-size:8px; } .footer-center { display:none; } #toast { bottom:182px; font-size:10px; } }
  @media (max-height:570px) and (min-width:701px) { .intro { bottom:140px; } h1 { font-size:38px; } .eyebrow { margin-bottom:9px; } .intro p { display:none; } .scene-note { top:86px; } .header { padding-top:21px; } .launch-hint { bottom:143px; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>

<body>
<canvas id="sky" tabindex="0" aria-label="Interactive fireworks display. Click the sky or press Enter to launch a firework. Space pauses the display."></canvas>
<div class="vignette"></div>
<header class="header">
  <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.15" aria-hidden="true"><path d="M16 0v10m0 12v10M0 16h10m12 0h10M4.7 4.7l7.1 7.1m8.4 8.4 7.1 7.1M4.7 27.3l7.1-7.1m8.4-8.4 7.1-7.1M10 1.2l3.1 9.4m5.8 10.8 3.1 9.4M1.2 22l9.4-3.1m10.8-5.8 9.4-3.1M1.2 10l9.4 3.1m10.8 5.8 9.4 3.1M10 30.8l3.1-9.4m5.8-10.8L22 1.2"/></svg>afterglow</div>
  <span class="edition">A LITTLE LIGHT. A LITTLE WONDER.</span>
  <div class="header-actions">
    <button class="icon-button" id="sound" type="button" aria-label="Turn sound on" aria-pressed="false" title="Sound · M"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path id="sound-waves" d="m16 9 5 6m0-6-5 6"/></svg></button>
    <button class="icon-button" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
  </div>
</header>
<div class="scene-note" id="scene-note"><span class="status-dot"></span><span id="scene-status">THE SHOW IS LIVE</span></div>
<section class="intro" aria-label="Welcome">
  <h2 class="eyebrow">FOR THE MOMENT</h2>
  <h1>Paint the<br><em>night.</em></h1>
  <p>Some things are better without a reason.<br>Leave a little color in the dark.</p>
</section>
<div class="launch-hint"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="7" stroke-dasharray="2 3"/><path d="M14 0v5m0 18v5M0 14h5m18 0h5"/><circle cx="14" cy="14" r="1.5" fill="currentColor" stroke="none"/></svg>Click anywhere to launch</div>
<div class="dock" role="toolbar" aria-label="Firework controls">

    <span class="control-text"><span class="control-label">The show</span><span class="control-value" id="play-text">Autoplay</span></span>
  </button>
  <span class="separator"></span>
  <div class="shape-wrap">
    <button type="button" class="shape-button" id="shape-button" aria-haspopup="menu" aria-expanded="false" aria-controls="shape-menu"><span class="control-text"><span class="control-label">Burst style</span><span class="control-value" id="shape-name">Chrysanthemum</span></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
    <div id="shape-menu" class="shape-menu" role="menu" aria-label="Burst style" hidden>
      <button type="button" class="shape-option" role="menuitemradio" aria-checked="true" data-shape="chrysanthemum">Chrysanthemum</button>
      <button type="button" class="shape-option" role="menuitemradio" aria-checked="false" data-shape="willow">Golden willow</button>
      <button type="button" class="shape-option" role="menuitemradio" aria-checked="false" data-shape="ring">Saturn rings</button>
      <button type="button" class="shape-option" role="menuitemradio" aria-checked="false" data-shape="heart">Hearts</button>
    </div>
  </div>
  <span class="separator"></span>
  <div class="palette" role="group" aria-label="Color palette"><span class="control-label">Palette</span><div class="swatches">
    <button class="swatch" type="button" style="--swatch:conic-gradient(#e9b87c,#b998ed,#87c5e4,#e9b87c)" data-palette="festival" aria-label="Festival palette" aria-pressed="true" title="Festival"></button>
    <button class="swatch" type="button" style="--swatch:#ebbd79" data-palette="gold" aria-label="Golden hour palette" aria-pressed="false" title="Golden hour"></button>
    <button class="swatch" type="button" style="--swatch:#b59be9" data-palette="violet" aria-label="Lilac sky palette" aria-pressed="false" title="Lilac sky"></button>
    <button class="swatch" type="button" style="--swatch:#8dbdcd" data-palette="ice" aria-label="Blue moon palette" aria-pressed="false" title="Blue moon"></button>

</div>
<footer class="footer"><span>Made of moments, not things.</span><span class="footer-center"><span class="key">SPACE</span> pause<span class="footer-divider">/</span><span class="key">F</span> finale</span><span><span class="counter" id="counter">000</span> wishes sent skyward</span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha:false });
  const backdrop = document.createElement('canvas');
  const bg = backdrop.getContext('2d');
  const trails = document.createElement('canvas');
  const fx = trails.getContext('2d');
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a,b) => a + Math.random() * (b-a);
  const choose = items => items[Math.floor(Math.random()*items.length)];
  const palettes = { festival:['#efc183','#b5a0ff','#8ed6ee','#f09ba9','#dedaf8'], gold:['#f8d59a','#e6ac68','#fff0cb'], violet:['#bc9fff','#8c92e8','#eed4ff'], ice:['#9ed9f0','#78b7df','#e7f7ff'] };
  let width=0, height=0, dpr=1, horizon=0, time=0, last=0, nextLaunch=0.45;
  let paused=reducedMotion, palette='festival', shape='chrysanthemum', tempo=3, soundOn=false;
  let count=0, audioContext=null, toastTimer, finaleUntil=0, finaleEvents=[];
  const rockets=[], particles=[], flashes=[], ripples=[];
  const sprites=new Map();
  function glowSprite(color) {
    if (sprites.has(color)) return sprites.get(color);
    const c=document.createElement('canvas'); c.width=c.height=48;
    const g=c.getContext('2d'), grad=g.createRadialGradient(24,24,0,24,24,24);
    grad.addColorStop(0,'#ffffff'); grad.addColorStop(.075,'#fff7ea'); grad.addColorStop(.16,color); grad.addColorStop(.38,color+'70'); grad.addColorStop(1,color+'00');
    g.fillStyle=grad;g.fillRect(0,0,48,48);sprites.set(color,c);return c;
  }
  function resize() {
    const oldW=width||innerWidth, oldH=height||innerHeight;
    width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,1.75);horizon=height*.77;
    for(const c of [canvas,backdrop,trails]) { c.width=Math.round(width*dpr);c.height=Math.round(height*dpr); }
    for(const c of [ctx,bg,fx]) c.setTransform(dpr,0,0,dpr,0,0);
    for(const p of [...particles,...rockets]) { p.x*=width/oldW;p.y*=height/oldH;p.px=p.x;p.py=p.y; if(p.tx!==undefined){p.tx*=width/oldW;p.ty*=height/oldH;p.sx*=width/oldW;p.sy=height*.81;} }
    paintBackdrop();
    if(paused) { drawParticles(0);render(); }
  }
  function paintBackdrop() {
    const sky=bg.createLinearGradient(0,0,0,height);
    sky.addColorStop(0,'#060b19');sky.addColorStop(.48,'#0b1223');sky.addColorStop(.76,'#131e2c');sky.addColorStop(.775,'#101624');sky.addColorStop(1,'#070d16');
    bg.fillStyle=sky;bg.fillRect(0,0,width,height);
    const haze=bg.createRadialGradient(width*.63,horizon,0,width*.63,horizon,width*.62);
    haze.addColorStop(0,'#62618112');haze.addColorStop(1,'#292b4200');bg.fillStyle=haze;bg.fillRect(0,0,width,height);
    // Distant stars, painted once so the sky stays still.
    let seed=7241;const random=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
    for(let i=0;i<Math.min(270,width*.21);i++) {
      const x=random()*width,y=random()*horizon*.96,r=random()*.85+.15;
      bg.globalAlpha=(random()*.48+.12)*(1-y/horizon*.65);bg.fillStyle=i%4===0?'#d4bea0':'#b3c4e0';bg.beginPath();bg.arc(x,y,r,0,TAU);bg.fill();
      if(i%33===0){bg.globalAlpha=.1;bg.fillRect(x-2.5,y,5,.5);bg.fillRect(x,y-2.5,.5,5);}
    }
    bg.globalAlpha=1;
    // A low, quiet shoreline gives the fireworks somewhere to reflect.
    for(let layer=0;layer<3;layer++){
      bg.fillStyle=['#0c1422','#090f1a','#070d15'][layer];bg.beginPath();bg.moveTo(0,horizon+8);
      for(let x=0;x<=width+10;x+=9){const hill=Math.sin(x/width*9+layer*1.7)*10+Math.sin(x/width*21+layer)*5;bg.lineTo(x,horizon-12+layer*7-hill);}
      bg.lineTo(width,horizon+20);bg.lineTo(0,horizon+20);bg.fill();
    }
    for(let i=0;i<88;i++){
      const x=random()*width,y=horizon-2+random()*8;
      if(x<width*.21||x>width*.83||random()>.7){bg.globalAlpha=random()*.55+.12;bg.fillStyle='#c4a977';bg.fillRect(x,y,random()*1.8+.5,.7);bg.globalAlpha*=.14;bg.fillRect(x-1,y+7,1.5,random()*13+2);}
    }
    for(let i=0;i<100;i++){
      const y=horizon+10+random()*(height-horizon),x=random()*width;
      bg.globalAlpha=random()*.05;bg.strokeStyle='#a1adca';bg.beginPath();bg.moveTo(x,y);bg.lineTo(x+random()*90+10,y);bg.stroke();
    }
    bg.globalAlpha=1;
  }
  function toast(message) { $('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2400); }
  function addCount(){count++;$('counter').textContent=String(count).padStart(3,'0');}
  function launch(x=rand(width*.27,width*.88),y=rand(height*.15,height*.46),options={}) {
    if(rockets.length>24) return;
    const color=options.color||choose(palettes[palette]);
    const sx=options.sx??rand(width*.35,width*.73),sy=horizon+8;
    rockets.push({x:sx,y:sy,px:sx,py:sy,sx,sy,tx:x,ty:y,t:0,duration:rand(.8,1.25),color,shape:options.shape||shape,scale:options.scale||1,seed:Math.random()*TAU});
  }
  function burst(x,y,color,style='chrysanthemum',scale=1,age=0) {
    addCount();
    flashes.push({x,y,color,life:.55,max:.55,scale});
    const n=style==='willow'?125:style==='heart'?125:style==='ring'?145:175;
    const base=Math.min(width,height)*rand(.18,.24)*scale;
    const angleOffset=rand(0,TAU), ellipse=rand(.28,.54);
    for(let i=0;i<n;i++) {
      let a=rand(0,TAU),speed=base*Math.pow(Math.random(),.22),vx,vy;
      const ring=i<n*.75;
      if(style==='ring'&&ring){a=i/(n*.75)*TAU;speed=base*rand(.98,1.02);const xx=Math.cos(a)*speed,yy=Math.sin(a)*speed*ellipse;vx=xx*Math.cos(angleOffset)-yy*Math.sin(angleOffset);vy=xx*Math.sin(angleOffset)+yy*Math.cos(angleOffset);}
      else if(style==='heart') { a=i/n*TAU;const hx=16*Math.pow(Math.sin(a),3),hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));vx=hx/17*base;vy=hy/17*base; }
      else { if(style==='willow'){a=(i/n)*TAU;speed=base*rand(.8,1.08);} vx=Math.cos(a)*speed;vy=Math.sin(a)*speed; }
      const life=style==='willow'?rand(3.8,5.5):rand(2.25,3.75);
      const c=style==='willow'?choose(palettes.gold):(i%9===0?'#fff0db':color);
      particles.push({x,y,px:x,py:y,vx,vy,life,max:life,color:c,size:rand(.75,1.5),drag:style==='willow'?.42:.66,gravity:style==='willow'?27:20,twinkle:Math.random()>.63,phase:rand(0,TAU),willow:style==='willow'});
    }
    if(particles.length>4800)particles.splice(0,particles.length-4800);
    if(soundOn)playBoom(scale);
    if(age>0) {const start=particles.length-n;for(let i=start;i<particles.length;i++){const p=particles[i],d=Math.exp(-p.drag*age);p.x+=p.vx*(1-d)/p.drag;p.y+=p.vy*(1-d)/p.drag+p.gravity*age*age*.5;p.vx*=d;p.vy=p.vy*d+p.gravity*age;p.life-=age;p.px=p.x-p.vx*.025;p.py=p.y-p.vy*.025;}}
  }
  function drawParticles(dt) {
    fx.globalCompositeOperation='destination-out';fx.globalAlpha=1;
    fx.fillStyle=`rgba(0,0,0,${1-Math.pow(.925,dt*60||1)})`;fx.fillRect(0,0,width,height);
    fx.globalCompositeOperation='lighter';
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];r.px=r.x;r.py=r.y;r.t+=dt;const p=Math.min(r.t/r.duration,1),ease=1-Math.pow(1-p,1.8);
      r.x=r.sx+(r.tx-r.sx)*ease;r.y=r.sy+(r.ty-r.sy)*ease;
      fx.globalAlpha=.75*(1-p*.7);fx.strokeStyle=r.color;fx.lineWidth=1.2;fx.beginPath();fx.moveTo(r.px,r.py);fx.lineTo(r.x,r.y);fx.stroke();
      fx.globalAlpha=.95;fx.drawImage(glowSprite(r.color),r.x-5,r.y-5,10,10);
      if(p>=1){burst(r.tx,r.ty,r.color,r.shape,r.scale);rockets.splice(i,1);}
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}
      p.px=p.x;p.py=p.y;const drag=Math.exp(-p.drag*dt);p.vx*=drag;p.vy=p.vy*drag+p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      const life=p.life/p.max,fade=Math.min(1,life*2.3),flicker=p.twinkle&&life<.6?(.36+.64*Math.pow(Math.sin(time*26+p.phase),2)):1;
      fx.globalAlpha=fade*flicker*.8;fx.strokeStyle=p.color;fx.lineWidth=p.size*.65;
      fx.beginPath();fx.moveTo(p.px,p.py);fx.lineTo(p.x,p.y);fx.stroke();
      const size=p.size*(p.willow?5.2:6.3)*(life*.3+.7);
      fx.globalAlpha=fade*flicker;fx.drawImage(glowSprite(p.color),p.x-size*.5,p.y-size*.5,size,size);
      if(p.willow&&Math.random()<dt*3){fx.globalAlpha=fade*.5;fx.fillStyle='#edc28b';fx.fillRect(p.x+rand(-1,1),p.y-rand(1,9),.8,.8);}
    }
    fx.globalAlpha=1;fx.globalCompositeOperation='source-over';
  }
  function render() {
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(backdrop,0,0,width,height);
    // Reflected trails are sliced into ripples instead of a perfect mirror.
    ctx.save();ctx.beginPath();ctx.rect(0,horizon+10,width,height-horizon);ctx.clip();
    ctx.globalCompositeOperation='screen';
    const lakeHeight=height-horizon;
    for(let y=0;y<lakeHeight;y+=3){
      const sourceY=horizon-y*3.5;if(sourceY<0)break;
      ctx.globalAlpha=.4*Math.pow(1-y/lakeHeight,1.8)*(y%9===0?.5:1);
      const offset=Math.sin(y*.25+time*.8)*(2+y*.025)+Math.sin(y*.8-time*.5)*2;
      ctx.drawImage(trails,0,Math.max(0,sourceY*dpr),trails.width,Math.min(9*dpr,trails.height),offset,horizon+10+y,width,2);
    }
    ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='lighter';ctx.drawImage(trails,0,0,width,height);
    for(const f of flashes){const strength=Math.max(0,f.life/f.max);const radius=Math.min(width,height)*.23*f.scale;
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,radius);g.addColorStop(0,f.color+'19');g.addColorStop(.25,f.color+'08');g.addColorStop(1,f.color+'00');ctx.globalAlpha=strength;ctx.fillStyle=g;ctx.fillRect(f.x-radius,f.y-radius,radius*2,radius*2);
      ctx.globalAlpha=strength*.8;ctx.drawImage(glowSprite(f.color),f.x-12*strength,f.y-12*strength,24*strength,24*strength);
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    for(const r of ripples){ctx.strokeStyle=`rgba(232,199,153,${r.life*.45})`;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(r.x,r.y,(1-r.life)*24+5,0,TAU);ctx.stroke();}
  }
  function frame(stamp) {
    const dt=Math.min((stamp-last)/1000||.016,.034);last=stamp;
    if(!paused&&!document.hidden){
      time+=dt;
      for(let i=flashes.length-1;i>=0;i--){flashes[i].life-=dt;if(flashes[i].life<=0)flashes.splice(i,1);}
      for(let i=ripples.length-1;i>=0;i--){ripples[i].life-=dt*1.8;if(ripples[i].life<=0)ripples.splice(i,1);}
      if(finaleUntil>0){
        while(finaleEvents.length&&time>=finaleEvents[0].at){const event=finaleEvents.shift();launch(event.x,event.y,event.options);}
        if(time>=finaleUntil){finaleUntil=0;$('finale').disabled=false;$('finale-text').textContent='Grand finale';}
      }
      if(time>=nextLaunch){launch();if(Math.random()<.26)launch(rand(width*.35,width*.85),rand(height*.2,height*.46),{scale:.7});nextLaunch=time+(2.4-tempo*.32)*rand(.8,1.2);}
      drawParticles(dt);render();
    }
    requestAnimationFrame(frame);
  }
  function updatePlay() {
    $('autoplay').setAttribute('aria-pressed',String(!paused));$('autoplay').setAttribute('aria-label',paused?'Play the show':'Pause the show');
    $('play-text').textContent=paused?'Paused':'Autoplay';$('play-path').setAttribute('d',paused?'m9 5 10 7-10 7V5Z':'M9 6v12M15 6v12');
    $('scene-note').classList.toggle('paused',paused);$('scene-status').textContent=paused?'A MOMENT OF STILLNESS':'THE SHOW IS LIVE';
  }
  function togglePlay(){paused=!paused;last=performance.now();updatePlay();}
  function finale() {
    if(finaleUntil)return;
    if(paused){paused=false;updatePlay();}
    finaleUntil=time+8.5;finaleEvents=[];$('finale').disabled=true;$('finale-text').textContent='Enjoy the moment';
    for(let i=0;i<24;i++){
      const wave=Math.floor(i/6),x=width*(.22+(i%6)*.12),y=height*(.22+Math.sin(i*1.5)*.07+wave*.025);
      finaleEvents.push({at:time+wave*1.35+(i%6)*.09,x,y,options:{color:choose(palettes[palette]),shape:wave===3?'willow':shape,scale:wave===3?1.1:.8,sx:width*(.25+(i%6)*.1)}});
    }
    toast('Here’s to being here.');
  }
  async function toggleSound(){
    try{
      if(!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('Audio unavailable');audioContext=new Audio();}
      if(!soundOn)await audioContext.resume();soundOn=!soundOn;
      $('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on');
      $('sound-waves').setAttribute('d',soundOn?'M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14':'m16 9 5 6m0-6-5 6');
      toast(soundOn?'Sound on · let the night in':'Sound off');
    }catch{toast('Sound is unavailable in this browser');}
  }
  function playBoom(scale) {
    if(!audioContext||audioContext.state!=='running')return;
    const ac=audioContext,t=ac.currentTime,duration=1.25;
    const buffer=ac.createBuffer(1,Math.floor(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/ac.sampleRate*4.4);
    const source=ac.createBufferSource();source.buffer=buffer;
    const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.setValueAtTime(520,t);filter.frequency.exponentialRampToValueAtTime(75,t+1);
    const gain=ac.createGain();gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.2*scale,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    source.connect(filter);filter.connect(gain);gain.connect(ac.destination);source.start(t);source.stop(t+duration);
    source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};
  }
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const x=Math.max(30,Math.min(width-30,e.clientX)),y=Math.max(height*.12,Math.min(horizon-75,e.clientY));
    if(paused){paused=false;updatePlay();}
    launch(x,y);ripples.push({x,y,life:1});
  });
  $('autoplay').addEventListener('click',togglePlay);
  $('finale').addEventListener('click',finale);
  $('sound').addEventListener('click',toggleSound);
  $('tempo').addEventListener('input',e=>{tempo=Number(e.target.value);e.target.style.background=`linear-gradient(to right,#c2a67f ${(tempo-1)*25}%,#343a48 ${(tempo-1)*25}%)`;nextLaunch=Math.min(nextLaunch,time+.5);});
  function closeMenu(){ $('shape-menu').hidden=true;$('shape-button').setAttribute('aria-expanded','false'); }
  $('shape-button').addEventListener('click',()=>{const open=$('shape-menu').hidden;$('shape-menu').hidden=!open;$('shape-button').setAttribute('aria-expanded',String(open));if(open)$('shape-menu').querySelector('[aria-checked=true]').focus();});
  document.querySelectorAll('[data-shape]').forEach(button=>button.addEventListener('click',()=>{
    shape=button.dataset.shape;$('shape-name').textContent=button.textContent;document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-checked',String(b===button)));closeMenu();$('shape-button').focus();
  }));
  $('shape-menu').addEventListener('keydown',e=>{const options=[...document.querySelectorAll('[data-shape]')],index=options.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();options[(index+(e.key==='ArrowDown'?1:3))%4].focus();}if(e.key==='Escape'){closeMenu();$('shape-button').focus();}if(e.key==='Tab')closeMenu();});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.shape-wrap'))closeMenu();});
  document.querySelectorAll('[data-palette]').forEach(button=>button.addEventListener('click',()=>{palette=button.dataset.palette;document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));toast(button.title);if(!paused)launch();}));
  $('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Fullscreen is unavailable in this browser');}catch{toast('Fullscreen is unavailable here');}});
  document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');});
  document.addEventListener('keydown',e=>{
    if(e.target instanceof HTMLInputElement||e.target instanceof HTMLButtonElement||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.code==='Space'){e.preventDefault();togglePlay();}else if(e.key.toLowerCase()==='f')finale();else if(e.key.toLowerCase()==='m')toggleSound();else if(e.key==='Enter'){if(paused){paused=false;updatePlay();}launch();}
  });
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  window.addEventListener('resize',resize);
  resize();
  // Open in the middle of a display, with new rockets already on their way.
  burst(width*.54,height*.29,'#e9bf81','chrysanthemum',1.02,.85);
  burst(width*.79,height*.34,'#b7a0f6','chrysanthemum',.79,.6);
  burst(width*.34,height*.2,'#a0d4ee','ring',.56,.7);
  for(let i=0;i<26;i++){drawParticles(.016);time+=.016;}
  render();updatePlay();requestAnimationFrame(frame);
})();
</script>
