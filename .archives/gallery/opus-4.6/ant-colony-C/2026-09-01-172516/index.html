<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ant Colony Simulation</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #1a1817;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #simCanvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #e0d8d3;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        z-index: 10;
    }
    h1 {
        margin: 0 0 5px 0;
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    p {
        margin: 0;
        font-size: 14px;
        opacity: 0.7;
    }
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
        pointer-events: none;
        z-index: 5;
    }
</style>
</head>
<body>

<canvas id="simCanvas"></canvas>
<div class="vignette"></div>
<div id="ui">
    <h1>Colony</h1>
    <p>Simulating swarm intelligence</p>
    <p id="stats">Ants: 0 | Food Collected: 0</p>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initGrids();
}
window.addEventListener('resize', resize);

const ANT_COUNT = 800;
const SENSOR_OFFSET_DIST = 20;
const SENSOR_ANGLE_SPACING = Math.PI / 4;
const SENSOR_RADIUS = 3;
const TURN_SPEED = 0.25;
const SPEED = 1.5;
const CELL_SIZE = 4;
const DECAY_RATE = 0.99;
const DEPOSIT_AMOUNT = 60;
const PHEROMONE_MAX = 255;

let cols, rows;
let nestPheromone;
let foodPheromone;
let nestPos;
let foodSources = [];
let ants = [];
let foodCollected = 0;
const statsEl = document.getElementById('stats');

function initGrids() {
    cols = Math.ceil(width / CELL_SIZE);
    rows = Math.ceil(height / CELL_SIZE);
    nestPheromone = new Float32Array(cols * rows);
    foodPheromone = new Float32Array(cols * rows);
    nestPos = { x: width / 2, y: height / 2 };
}

class Ant {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.angle = Math.random() * Math.PI * 2;
        this.hasFood = false;
    }

    update() {
        let grid = this.hasFood ? nestPheromone : foodPheromone;
        
        let leftScore = this.sense(grid, this.angle - SENSOR_ANGLE_SPACING);
        let forwardScore = this.sense(grid, this.angle);
        let rightScore = this.sense(grid, this.angle + SENSOR_ANGLE_SPACING);
        
        let wander = (Math.random() - 0.5) * 0.4;
        
        if (forwardScore > leftScore && forwardScore > rightScore) {
            this.angle += wander * 0.1;
        } else if (forwardScore < leftScore && forwardScore < rightScore) {
            this.angle += (Math.random() > 0.5 ? TURN_SPEED : -TURN_SPEED);
        } else if (leftScore > rightScore) {
            this.angle -= TURN_SPEED;
        } else if (rightScore > leftScore) {
            this.angle += TURN_SPEED;
        } else {
            this.angle += wander;
        }
        
        this.x += Math.cos(this.angle) * SPEED;
        this.y += Math.sin(this.angle) * SPEED;
        
        if (this.x < 10 || this.x > width - 10) {
            this.angle = Math.PI - this.angle;
            this.x = Math.max(10, Math.min(width - 10, this.x));
        }
        if (this.y < 10 || this.y > height - 10) {
            this.angle = -this.angle;
            this.y = Math.max(10, Math.min(height - 10, this.y));
        }
        
        let cx = Math.floor(this.x / CELL_SIZE);
        let cy = Math.floor(this.y / CELL_SIZE);
        if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
            let idx = cy * cols + cx;
            if (this.hasFood) {
                foodPheromone[idx] = Math.min(PHEROMONE_MAX, foodPheromone[idx] + DEPOSIT_AMOUNT);
            } else {
                nestPheromone[idx] = Math.min(PHEROMONE_MAX, nestPheromone[idx] + DEPOSIT_AMOUNT);
            }
        }
        
        let distToNest = Math.hypot(this.x - nestPos.x, this.y - nestPos.y);
        if (this.hasFood && distToNest < 20) {
            this.hasFood = false;
            this.angle += Math.PI; 
            foodCollected++;
            statsEl.innerText = `Ants: ${ANT_COUNT} | Food Collected: ${foodCollected}`;
        } else if (!this.hasFood) {
            for (let i = 0; i < foodSources.length; i++) {
                let f = foodSources[i];
                if (f.amount > 0 && Math.hypot(this.x - f.x, this.y - f.y) < f.radius) {
                    this.hasFood = true;
                    f.amount--;
                    this.angle += Math.PI; 
                    if (f.amount <= 0) {
                        foodSources.splice(i, 1);
                    }
                    break;
                }
            }
        }
    }
    
    sense(grid, angle) {
        let sx = this.x + Math.cos(angle) * SENSOR_OFFSET_DIST;
        let sy = this.y + Math.sin(angle) * SENSOR_OFFSET_DIST;
        let cx = Math.floor(sx / CELL_SIZE);
        let cy = Math.floor(sy / CELL_SIZE);
        let sum = 0;
        
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                let nx = cx + dx;
                let ny = cy + dy;
                if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                    sum += grid[ny * cols + nx];
                }
            }
        }
        return sum;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        ctx.fillStyle = this.hasFood ? '#ffaa00' : 'rgba(210, 210, 210, 0.9)';
        
        ctx.beginPath();
        ctx.arc(2, 0, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(-2, 0, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        if (this.hasFood) {
            ctx.fillStyle = '#a8ff3e';
            ctx.beginPath();
            ctx.arc(4, 0, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.restore();
    }
}

function spawnFood() {
    if (foodSources.length < 4) {
        let fx = Math.random() * (width - 100) + 50;
        let fy = Math.random() * (height - 100) + 50;
        if (Math.hypot(fx - nestPos.x, fy - nestPos.y) > 150) {
            foodSources.push({
                x: fx,
                y: fy,
                amount: 300,
                radius: 25
            });
        }
    }
}

function init() {
    resize();
    for (let i = 0; i < ANT_COUNT; i++) {
        ants.push(new Ant(nestPos.x, nestPos.y));
    }
    statsEl.innerText = `Ants: ${ANT_COUNT} | Food Collected: ${foodCollected}`;
    
    for(let i=0; i<4; i++) spawnFood();
    
    requestAnimationFrame(loop);
}

let pheromoneImageData;
let pCanvas = document.createElement('canvas');
let pCtx = pCanvas.getContext('2d');

function loop() {
    ctx.fillStyle = '#181614';
    ctx.fillRect(0, 0, width, height);

    if (!pheromoneImageData || pheromoneImageData.width !== cols || pheromoneImageData.height !== rows) {
        pheromoneImageData = new ImageData(cols, rows);
        pCanvas.width = cols;
        pCanvas.height = rows;
    }
    
    let data = pheromoneImageData.data;
    for (let i = 0; i < cols * rows; i++) {
        nestPheromone[i] *= DECAY_RATE;
        foodPheromone[i] *= DECAY_RATE;
        
        let n = nestPheromone[i];
        let f = foodPheromone[i];
        
        let idx = i * 4;
        data[idx] = Math.min(255, f * 1.5);
        data[idx + 1] = Math.min(255, n * 0.2); 
        data[idx + 2] = Math.min(255, n * 1.5);
        data[idx + 3] = Math.min(255, (n + f) * 2);
    }
    
    pCtx.putImageData(pheromoneImageData, 0, 0);
    
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.8;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(pCanvas, 0, 0, width, height);
    ctx.restore();

    let nGrad = ctx.createRadialGradient(nestPos.x, nestPos.y, 0, nestPos.x, nestPos.y, 45);
    nGrad.addColorStop(0, '#0a0908');
    nGrad.addColorStop(0.5, 'rgba(10,9,8,0.8)');
    nGrad.addColorStop(1, 'rgba(10,9,8,0)');
    ctx.fillStyle = nGrad;
    ctx.beginPath();
    ctx.arc(nestPos.x, nestPos.y, 45, 0, Math.PI * 2);
    ctx.fill();

    for (let f of foodSources) {
        let fGrad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
        fGrad.addColorStop(0, `rgba(168, 255, 62, ${Math.min(0.8, f.amount/100)})`);
        fGrad.addColorStop(1, 'rgba(168, 255, 62, 0)');
        ctx.fillStyle = fGrad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#c4ff75';
        let crumbCount = Math.min(20, f.amount / 5);
        for(let j=0; j<crumbCount; j++) {
            let a = (j * 1.618) * Math.PI * 2; // pseudo random dist
            let r = (j / crumbCount) * f.radius * 0.7;
            ctx.fillRect(f.x + Math.cos(a)*r, f.y + Math.sin(a)*r, 1.5, 1.5);
        }
    }

    for (let ant of ants) {
        ant.update();
        ant.draw(ctx);
    }
    
    if (Math.random() < 0.002) {
        spawnFood();
    }

    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
