<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ant Colony Simulation</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
  canvas { background-color: #ecf0f1; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
  <h2>Ant Colony</h2>
  <p>Green: Food | Purple: Nest | Dark: Ant (Red when carrying food)</p>
</div>
<canvas id="simCanvas"></canvas>
<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  
  canvas.width = window.innerWidth * 0.9;
  canvas.height = window.innerHeight * 0.9;
  
  const width = canvas.width;
  const height = canvas.height;
  
  const ants = [];
  const foodSources = [];
  const nest = { x: width / 2, y: height / 2, radius: 20 };
  
  class Ant {
    constructor() {
      this.x = nest.x;
      this.y = nest.y;
      this.angle = Math.random() * Math.PI * 2;
      this.speed = 2;
      this.hasFood = false;
    }
    
    update() {
      if (this.hasFood) {
        const dx = nest.x - this.x;
        const dy = nest.y - this.y;
        this.angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.5;
        
        if (Math.hypot(dx, dy) < nest.radius) {
          this.hasFood = false;
          this.angle += Math.PI;
        }
      } else {
        let foundFood = false;
        for (let f of foodSources) {
          const dx = f.x - this.x;
          const dy = f.y - this.y;
          if (Math.hypot(dx, dy) < f.radius + 5 && f.amount > 0) {
            this.hasFood = true;
            f.amount--;
            this.angle = Math.atan2(nest.y - this.x, nest.x - this.y);
            foundFood = true;
            break;
          }
        }
        
        if (!foundFood) {
          this.angle += (Math.random() - 0.5) * 0.5;
        }
      }
      
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      
      if (this.x < 0) { this.x = 0; this.angle += Math.PI; }
      if (this.x > width) { this.x = width; this.angle += Math.PI; }
      if (this.y < 0) { this.y = 0; this.angle += Math.PI; }
      if (this.y > height) { this.y = height; this.angle += Math.PI; }
    }
    
    draw() {
      ctx.fillStyle = this.hasFood ? '#e74c3c' : '#34495e';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  for (let i = 0; i < 300; i++) ants.push(new Ant());
  
  for (let i = 0; i < 8; i++) {
    foodSources.push({
      x: Math.random() * (width - 40) + 20,
      y: Math.random() * (height - 40) + 20,
      radius: 15,
      amount: 1000
    });
  }
  
  function loop() {
    ctx.clearRect(0, 0, width, height);
    
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath();
    ctx.arc(nest.x, nest.y, nest.radius, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#2ecc71';
    for (let i = foodSources.length - 1; i >= 0; i--) {
      let f = foodSources[i];
      if (f.amount > 0) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, Math.max(5, f.radius * (f.amount / 1000)), 0, Math.PI * 2);
        ctx.fill();
      } else {
        foodSources.splice(i, 1);
      }
    }
    
    for (let ant of ants) {
      ant.update();
      ant.draw();
    }
    
    requestAnimationFrame(loop);
  }
  
  loop();
</script>
</body>
</html>
