<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080c18"><title>Nocturne — A sky of your own</title>
<style>
:root{color-scheme:dark;--ink:#f6efdf;--muted:#a3a7b8;--gold:#e8c58c}*{box-sizing:border-box}body{margin:0;background:#080c18;color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:6px}header{position:fixed;top:35px;left:42px;right:42px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;gap:13px;align-items:center;font-size:12px;letter-spacing:.25em;font-weight:600}.spark{color:var(--gold);font-size:30px;font-weight:normal}.edition{font-size:10px;letter-spacing:.2em;color:var(--muted)}.top-actions{display:flex;gap:10px;pointer-events:auto}.icon{border:1px solid #ffffff20;background:#0b11214d;border-radius:50%;height:40px;width:40px;display:grid;place-items:center;transition:background .2s,border-color .2s}.icon:hover{background:#ffffff10;border-color:#ffffff55}.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}.sound-on .muted-line{display:none}.intro{position:fixed;left:44px;bottom:145px;pointer-events:none}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:25px;height:1px;background:var(--gold)}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(38px,5vw,66px);font-weight:normal;letter-spacing:-.045em;line-height:1.1;margin:15px 0 13px}h1 em{font-weight:normal;color:#d0b995}.intro p{font-size:12px;line-height:1.8;color:#aeb1be;margin:0}.hint{position:fixed;right:44px;bottom:155px;color:#aeb1be;font-size:10px;letter-spacing:.06em;display:flex;align-items:center;gap:10px}.hint span{width:20px;height:20px;border:1px solid #aeb1be70;border-radius:50%;display:grid;place-items:center;font-size:16px}.dock{position:fixed;bottom:31px;left:42px;right:42px;border-top:1px solid #ffffff20;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:24px}.control-group{display:flex;align-items:center;gap:20px}.label{font-size:9px;letter-spacing:.18em;color:var(--muted)}.palettes{display:flex;gap:13px}.swatch{width:24px;height:24px;border:0;border-radius:50%;position:relative;padding:0;background:var(--swatch)}.swatch:after{content:'';position:absolute;inset:-5px;border:1px solid transparent;border-radius:50%;transition:border-color .2s}.swatch[aria-pressed=true]:after{border-color:#ede5d0}.swatch:hover:after{border-color:#ffffff70}.divider{height:25px;width:1px;background:#ffffff1a}.play{background:none;border:0;font-size:11px;display:flex;align-items:center;gap:8px;padding:9px 0;min-width:66px}.status{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.15em;color:#a3a7b8}.status-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px #e8c58c55}.finale{padding:13px 20px;background:var(--gold);border:1px solid var(--gold);border-radius:3px;color:#191820;display:flex;align-items:center;gap:20px;font-size:11px;transition:background .2s}.finale:hover{background:#f7dbad}.finale:disabled{opacity:.65;cursor:default}.finale span{font-size:16px}.toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);padding:10px 18px;border:1px solid #ffffff20;background:#0b1121c9;border-radius:30px;font-size:11px;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:650px){header{left:24px;right:24px;top:22px}.edition{display:none}.brand{font-size:10px}.intro{left:24px;bottom:165px}h1{font-size:43px}.intro p{font-size:11px}.hint{right:24px;bottom:144px;font-size:9px}.dock{left:24px;right:24px;bottom:23px;gap:16px;flex-wrap:wrap;padding-top:17px}.status{display:none}.control-group{gap:16px}.control-group>.label{display:none}.finale{padding:11px 13px;gap:10px}.palettes{gap:12px}.swatch{width:19px;height:19px}.play{font-size:10px;min-width:51px}.divider{display:none}}
</style>
</head>
<body>
<canvas id="sky" aria-label="An animated fireworks display over a quiet waterfront. Click or tap the sky to launch a firework."></canvas>
<header><div class="brand"><span class="spark">✳</span> NOCTURNE <span class="edition"> / &nbsp; AFTER HOURS, VOL. 01</span></div><div class="top-actions"><button class="icon" id="sound" aria-label="Enable sound" aria-pressed="false" title="Sound"><svg viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5Z M15 8q5 4 0 8"/><path class="muted-line" d="m3 3 18 18"/></svg></button><button class="icon" id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></header>
<section class="intro"><div class="eyebrow">A little wonder, after dark</div><h1>A sky of <em>your own.</em></h1><p>Let the night unfold.<br>Or touch the sky and leave a little light.</p></section>
<div class="hint"><span>+</span> Click anywhere to make a wish</div>
<footer class="dock"><div class="control-group"><span class="label">THE PALETTE</span><div class="palettes" aria-label="Firework palette"><button class="swatch" style="--swatch:linear-gradient(135deg,#fff0ba,#bc763e)" data-palette="0" aria-label="Champagne palette" aria-pressed="true" title="Champagne"></button><button class="swatch" style="--swatch:linear-gradient(135deg,#ffacae,#9876d6)" data-palette="1" aria-label="Rose palette" aria-pressed="false" title="Rose"></button><button class="swatch" style="--swatch:linear-gradient(135deg,#c4faf4,#438fcc)" data-palette="2" aria-label="Glacier palette" aria-pressed="false" title="Glacier"></button><button class="swatch" style="--swatch:conic-gradient(#ffb778,#e97faf,#929aff,#84ded4,#ffb778)" data-palette="3" aria-label="Prismatic palette" aria-pressed="false" title="Prismatic"></button></div><span class="divider"></span><button class="play" id="play" aria-label="Pause display"><span id="play-icon">Ⅱ</span><span id="play-label">Pause</span></button></div><div class="status"><span class="status-dot"></span><span id="status">THE NIGHT IS YOURS</span></div><button class="finale" id="finale">Grand finale <span>↗</span></button></footer>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),layer=document.createElement('canvas'),fx=layer.getContext('2d');let w,h,dpr,horizon,stars=[],rockets=[],particles=[],palette=0,paused=false,sound=false,audio=null,last=0,elapsed=0,nextLaunch=.35,finaleUntil=0,toastTimer;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;paused=reduced;
const palettes=[[38,43,32,48],[345,325,275,20],[175,192,209,160],[8,42,168,210,275,325]];
const random=(a,b)=>a+Math.random()*(b-a);
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);horizon=h*.76;for(const c of [canvas,layer]){c.width=w*dpr;c.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);fx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/5500)},()=>({x:Math.random()*w,y:Math.random()*horizon,r:random(.3,1),a:random(.12,.5)}));}addEventListener('resize',resize);resize();
function boom(x,power){if(!sound||!audio)return;const len=audio.sampleRate*.9,buf=audio.createBuffer(1,len,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.15));const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),pan=audio.createStereoPanner();source.buffer=buf;filter.type='lowpass';filter.frequency.value=420;gain.gain.value=.13*power;pan.pan.value=Math.max(-1,Math.min(1,x/w*2-1));source.connect(filter).connect(gain).connect(pan).connect(audio.destination);source.start();}
function launch(x=random(w*.2,w*.82),y=random(h*.15,h*.43),large=false){rockets.push({x:random(w*.3,w*.7),y:horizon+10,tx:x,ty:y,age:0,duration:random(.8,1.3),sx:0,sy:horizon+10,hue:palettes[palette][Math.floor(Math.random()*palettes[palette].length)],large});rockets.at(-1).sx=rockets.at(-1).x;}
function burst(r){const n=r.large?165:105,kind=Math.random(),scale=Math.min(w/1050,1)*.45+.55;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+random(-.015,.015),speed=(kind<.22?random(125,143):random(28,160))*(r.large?1.3:1)*scale;particles.push({x:r.tx,y:r.ty,px:r.tx,py:r.ty,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:random(1.5,3.3),age:0,hue:r.hue+random(-6,6),twinkle:Math.random()>.65,size:random(.7,1.65)});}boom(r.tx,r.large?1:.7);}
function update(dt){elapsed+=dt;if(elapsed>nextLaunch){launch(undefined,undefined,elapsed<finaleUntil);if(elapsed<finaleUntil){launch();nextLaunch=elapsed+random(.17,.3)}else nextLaunch=elapsed+random(.85,1.55)}if(finaleUntil&&elapsed>=finaleUntil){finaleUntil=0;document.querySelector('#finale').disabled=false;document.querySelector('#status').textContent='THE NIGHT IS YOURS';}
fx.globalCompositeOperation='destination-out';fx.fillStyle=`rgba(0,0,0,${1-Math.pow(.035,dt)})`;fx.fillRect(0,0,w,h);fx.globalCompositeOperation='lighter';
for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];const px=r.x,py=r.y;r.age+=dt;const t=Math.min(1,r.age/r.duration),ease=1-Math.pow(1-t,1.5);r.x=r.sx+(r.tx-r.sx)*ease;r.y=r.sy+(r.ty-r.sy)*ease;fx.strokeStyle=`hsla(${r.hue},85%,75%,.7)`;fx.lineWidth=1.2;fx.beginPath();fx.moveTo(px,py);fx.lineTo(r.x,r.y);fx.stroke();fx.fillStyle='#fff6df';fx.fillRect(r.x-1,r.y-1,2,3);if(t>=1){burst(r);rockets.splice(i,1)}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue}p.px=p.x;p.py=p.y;const drag=Math.pow(.58,dt);p.vx*=drag;p.vy=p.vy*drag+27*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;let alpha=Math.pow(1-p.age/p.life,.75);if(p.twinkle&&p.age>1)alpha*=.35+.65*Math.abs(Math.sin(p.age*22));fx.strokeStyle=`hsla(${p.hue},85%,${70+alpha*20}%,${alpha})`;fx.lineWidth=p.size;fx.beginPath();fx.moveTo(p.px,p.py);fx.lineTo(p.x,p.y);fx.stroke();if(p.age<.1){fx.fillStyle=`hsla(${p.hue},90%,80%,.09)`;fx.beginPath();fx.arc(p.x,p.y,5,0,7);fx.fill()}}if(particles.length>4500)particles.splice(0,particles.length-4500);
}
function render(){ctx.globalCompositeOperation='source-over';const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#080b17');bg.addColorStop(.55,'#101426');bg.addColorStop(.76,'#202030');bg.addColorStop(1,'#090e19');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(const s of stars){ctx.fillStyle=`rgba(224,225,255,${s.a*(.85+.15*Math.sin(elapsed*.5+s.x))})`;ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.35;ctx.filter='blur(7px)';ctx.drawImage(layer,0,0,w,h);ctx.filter='none';ctx.globalAlpha=1;ctx.drawImage(layer,0,0,w,h);ctx.restore();
ctx.fillStyle='#0b101b';ctx.fillRect(0,horizon,w,h-horizon);ctx.save();ctx.beginPath();ctx.rect(0,horizon,w,h-horizon);ctx.clip();ctx.translate(0,horizon*1.65);ctx.scale(1,-.65);ctx.globalAlpha=.23;ctx.filter='blur(3px)';ctx.drawImage(layer,0,0,w,h);ctx.restore();for(let i=0;i<35;i++){const y=horizon+4+i*i*.26;ctx.strokeStyle=`rgba(6,12,22,${.25+i*.01})`;ctx.lineWidth=1+i*.05;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#070c16';for(let i=0;i<60;i++){const x=i*w/60,hh=3+Math.sin(i*7.9)**2*10;ctx.fillRect(x,horizon-hh,w/60+1,hh)}ctx.fillStyle='#d4a46470';for(let i=0;i<31;i++)ctx.fillRect((i*.033*w+Math.sin(i)*17+w)%w,horizon-2,1.5,1);const shade=ctx.createLinearGradient(0,h*.6,0,h);shade.addColorStop(0,'#080c1800');shade.addColorStop(1,'#080c18e8');ctx.fillStyle=shade;ctx.fillRect(0,h*.6,w,h*.4);}
function frame(t){const dt=Math.min((t-last)/1000||.016,.04);last=t;if(!paused)update(dt);render();requestAnimationFrame(frame)}
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function setPaused(value){paused=value;document.querySelector('#play-icon').textContent=paused?'▷':'Ⅱ';document.querySelector('#play-label').textContent=paused?'Play':'Pause';document.querySelector('#play').setAttribute('aria-label',paused?'Play display':'Pause display');}
canvas.addEventListener('pointerdown',e=>{if(paused)setPaused(false);launch(e.clientX,Math.max(75,Math.min(e.clientY,horizon-65)),true)});
document.querySelector('#play').onclick=()=>setPaused(!paused);
document.querySelectorAll('[data-palette]').forEach(button=>button.onclick=()=>{palette=Number(button.dataset.palette);document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));notify(button.title+' selected');if(!paused)launch()});
document.querySelector('#finale').onclick=()=>{setPaused(false);finaleUntil=elapsed+8;nextLaunch=elapsed;document.querySelector('#finale').disabled=true;document.querySelector('#status').textContent='MAKE IT A NIGHT TO REMEMBER';notify('For all the wishes yet to come.')};
document.querySelector('#sound').onclick=async()=>{try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();sound=!sound;const b=document.querySelector('#sound');b.classList.toggle('sound-on',sound);b.setAttribute('aria-pressed',String(sound));b.setAttribute('aria-label',sound?'Mute sound':'Enable sound');notify(sound?'Sound on':'Sound off')}catch{notify('Sound is unavailable in this browser')}};
document.querySelector('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Fullscreen is unavailable in this browser')}};
document.addEventListener('fullscreenchange',()=>document.querySelector('#fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen'));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();setPaused(!paused)}});document.addEventListener('visibilitychange',()=>{last=performance.now()});
// Open on a composed pair of blooms, so the first moment is already alive.
burst({tx:w*.62,ty:h*.28,hue:42,large:true});burst({tx:w*.36,ty:h*.38,hue:34,large:false});for(let i=0;i<32;i++){update(.016)}setPaused(reduced);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
