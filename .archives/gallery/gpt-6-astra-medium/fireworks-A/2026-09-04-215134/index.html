<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>After Dark — A Fireworks Display</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;color:#f4ede4;background:#080b14}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.shell{position:relative;z-index:2;height:100svh;min-height:420px;padding:36px 46px;display:flex;flex-direction:column;pointer-events:none}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.24em;display:flex;gap:13px;align-items:center}.spark{font-size:27px;color:#edc592}.tag{font-size:10px;letter-spacing:.16em;color:#aaa6ae;border:1px solid #ffffff20;padding:9px 13px;border-radius:20px}.title{margin-top:10vh;max-width:500px}.eyebrow{font-size:10px;letter-spacing:.26em;color:#d4b68d;display:flex;align-items:center;gap:12px}.eyebrow:before{content:"";width:24px;height:1px;background:#d4b68d}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(58px,7.5vw,108px);letter-spacing:-.055em;line-height:.94;margin:22px 0}h1 em{font-weight:400;color:#e9c291}p{font-size:13px;line-height:1.7;color:#b1aeb9;max-width:275px}.hint{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;color:#ddd3c2;white-space:nowrap;opacity:.65}.hint span{display:block;text-align:center;font-size:26px;margin-bottom:10px;font-weight:200}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.controls{pointer-events:auto;background:#13141cc9;backdrop-filter:blur(20px);border:1px solid #ffffff1a;border-radius:14px;padding:17px 20px;display:flex;gap:22px;align-items:center;box-shadow:0 12px 40px #0004}.field{display:flex;flex-direction:column;gap:10px}.label{font-size:9px;color:#96939f;letter-spacing:.18em}.swatches{display:flex;gap:9px}.swatch{border:0;width:17px;height:17px;border-radius:50%;cursor:pointer;padding:0;position:relative;background:var(--color)}.swatch[aria-pressed=true]:after{content:"";position:absolute;inset:-4px;border:1px solid #e9ded2;border-radius:50%}.divider{width:1px;height:35px;background:#ffffff1a}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #f7d1a5;outline-offset:5px}.auto{background:transparent;border:0;padding:0;display:flex;gap:8px;align-items:center;font-size:11px}.switch{width:26px;height:15px;background:#706451;border-radius:20px;padding:3px}.switch:before{content:"";display:block;width:9px;height:9px;background:#fce3bc;border-radius:50%;transform:translateX(11px);transition:transform .2s}.auto[aria-pressed=false] .switch{background:#3a3943}.auto[aria-pressed=false] .switch:before{transform:translateX(0)}.launch{background:#eac598;border:1px solid #ffe0b4;color:#27211e;border-radius:7px;font-size:11px;padding:13px 18px;white-space:nowrap}.launch:hover{background:#ffdfb6}.footer{text-align:right;font-size:10px;line-height:1.9;color:#96919f;letter-spacing:.06em}.footer b{color:#d3c2ab;font-weight:400}.pause{pointer-events:auto;background:none;border:1px solid #ffffff26;border-radius:50%;width:34px;height:34px;margin-left:12px;font-size:11px}.right{display:flex;align-items:center}.quiet{opacity:0;transition:opacity 1s} @media(max-width:650px){.shell{padding:24px}.title{margin-top:8vh}h1{font-size:66px}.bottom{align-items:stretch;flex-direction:column;gap:15px}.controls{gap:16px;padding:16px;justify-content:space-between}.footer{text-align:center;font-size:9px}.tag{display:none}.hint{top:58%}.launch{padding:12px}.divider{display:none}.right .tag{display:none}}@media(max-height:600px){.title{margin-top:20px}h1{font-size:58px}p{display:none}.hint{top:50%}}
</style>
</head>
<body>
<canvas id="sky" aria-label="Animated fireworks above a night-time waterfront. Click or tap the sky to launch a firework."></canvas>
<main class="shell">
<header><div class="brand"><span class="spark">✳</span> AFTER DARK</div><div class="right"><span class="tag">AN INTERACTIVE NIGHT SKY</span><button class="pause" id="pause" aria-label="Pause animation">Ⅱ</button></div></header>
<section class="title"><div class="eyebrow">A LITTLE WONDER, ON DEMAND</div><h1>Light up<br>the <em>night.</em></h1><p>A fleeting spark. A sky full of possibility.<br>Make a moment worth looking up for.</p></section>
<div class="hint" id="hint"><span>＋</span>CLICK ANYWHERE TO MAKE A WISH</div>
<div class="bottom"><div class="controls"><div class="field"><span class="label">PALETTE</span><div class="swatches"><button class="swatch" style="--color:#eec38c" data-palette="0" aria-label="Champagne palette" aria-pressed="true"></button><button class="swatch" style="--color:#e5a2bf" data-palette="1" aria-label="Rose palette" aria-pressed="false"></button><button class="swatch" style="--color:#91cbd3" data-palette="2" aria-label="Glacier palette" aria-pressed="false"></button><button class="swatch" style="--color:conic-gradient(#e9b184,#bfa0ee,#8dd2d9,#e9b184)" data-palette="3" aria-label="Multicolor palette" aria-pressed="false"></button></div></div><div class="divider"></div><div class="field"><span class="label">LET IT UNFOLD</span><button class="auto" id="auto" aria-pressed="true"><span class="switch"></span>Autoplay</button></div><button class="launch" id="finale">Grand finale ↗</button></div><div class="footer"><b>EVERY BURST, A BRIEF INFINITY.</b><br>Made for the moment. Stay a while.</div></div>
</main>
<script>
(()=>{'use strict';const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,dpr,particles=[],rockets=[],stars=[],palette=0,autoplay=true,paused=false,last=0,next=0,finale=0,flash=0;const palettes=[[36,42,48],[330,345,15],[178,192,215],[25,165,280,325]];const random=(a,b)=>a+Math.random()*(b-a);function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/7000)},()=>({x:Math.random()*w,y:Math.random()*h*.77,r:random(.4,1.1),a:random(.15,.6)}))}addEventListener('resize',resize);resize();function hue(){const p=palettes[palette];return p[Math.floor(Math.random()*p.length)]+random(-6,6)}function launch(x=random(w*.42,w*.92),y=random(h*.12,h*.48)){if(rockets.length>25)return;rockets.push({x:random(w*.25,w*.85),y:h*.86,tx:x,ty:y,hue:hue(),trail:[],speed:random(440,640)})}function burst(r){flash=.045;const ring=Math.random()<.27;const n=ring?115:160;for(let i=0;i<n;i++){const angle=ring?i/n*Math.PI*2:random(0,Math.PI*2),speed=ring?random(115,145):Math.pow(Math.random(),.36)*random(90,185);particles.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:random(1.2,2.8),max:2.8,hue:r.hue+random(-9,9),bright:random(65,92),size:random(.7,1.8),trail:[]})}if(particles.length>6500)particles.splice(0,particles.length-6500)}function background(t){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#080b15');g.addColorStop(.65,'#141320');g.addColorStop(.85,'#22202a');g.addColorStop(1,'#090e17');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const s of stars){ctx.globalAlpha=s.a*(.7+.3*Math.sin(t*.0005+s.x));ctx.fillStyle='#e3dde9';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;const horizon=h*.84;ctx.fillStyle='#090d16';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=w+12;x+=12){ctx.lineTo(x,horizon-5-Math.sin(x*.015)*6-Math.abs(Math.sin(x*.12))*9)}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle='#c8a570';for(let x=10;x<w;x+=27){ctx.globalAlpha=.18+.15*Math.sin(x);ctx.fillRect(x,horizon+3,2,1)}ctx.globalAlpha=1;ctx.strokeStyle='#bbc1d608';for(let i=0;i<24;i++){const y=horizon+15+i*i*.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.035)||.016;last=t;if(paused)return;background(t);if(autoplay){next-=dt;if(next<=0){launch();next=random(.65,1.4)}}if(finale>0){finale-=dt;if(Math.random()<dt*16)launch(random(w*.18,w*.94),random(h*.12,h*.54))}ctx.globalCompositeOperation='lighter';for(let i=rockets.length-1;i>=0;i--){const r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,dist=Math.hypot(dx,dy);if(dist<r.speed*dt){r.x=r.tx;r.y=r.ty;burst(r);rockets.splice(i,1);continue}r.trail.push({x:r.x,y:r.y});if(r.trail.length>16)r.trail.shift();r.x+=dx/dist*r.speed*dt;r.y+=dy/dist*r.speed*dt;ctx.beginPath();r.trail.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=`hsla(${r.hue},80%,75%,.5)`;ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff6d7';ctx.fillRect(r.x-1,r.y-1,2,3)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.px=p.x;p.py=p.y;p.vx*=Math.exp(-.7*dt);p.vy=p.vy*Math.exp(-.4*dt)+39*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=Math.min(1,p.life*.9);ctx.strokeStyle=`hsla(${p.hue},85%,${p.bright}%,${a})`;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.045,p.y-p.vy*.045);ctx.stroke();if(p.life>.7){ctx.fillStyle=`hsla(${p.hue},85%,90%,${a*.7})`;ctx.fillRect(p.x,p.y,1.2,1.2)}const reflectY=h*.84+(h*.84-p.y)*.2;if(reflectY<h){ctx.fillStyle=`hsla(${p.hue},70%,65%,${a*.045})`;ctx.fillRect(p.x+Math.sin(t*.002+p.y)*4,reflectY,random(2,9),1)}}ctx.globalCompositeOperation='source-over';if(flash>0){ctx.fillStyle=`rgba(255,212,168,${flash})`;ctx.fillRect(0,0,w,h);flash*=.8;if(flash<.001)flash=0}}
canvas.addEventListener('pointerdown',e=>{if(paused)togglePause();launch(e.clientX,Math.min(e.clientY,h*.76));document.getElementById('hint').classList.add('quiet')});document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{palette=Number(b.dataset.palette);document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));launch()}));document.getElementById('auto').addEventListener('click',e=>{autoplay=!autoplay;e.currentTarget.setAttribute('aria-pressed',String(autoplay));next=0});document.getElementById('finale').addEventListener('click',()=>{if(paused)togglePause();finale=4;document.getElementById('hint').classList.add('quiet')});function togglePause(){paused=!paused;const b=document.getElementById('pause');b.textContent=paused?'▶':'Ⅱ';b.setAttribute('aria-label',paused?'Resume animation':'Pause animation')}document.getElementById('pause').addEventListener('click',togglePause);addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();launch()}});if(matchMedia('(prefers-reduced-motion: reduce)').matches){autoplay=false;document.getElementById('auto').setAttribute('aria-pressed','false')}launch(w*.72,h*.29);launch(w*.52,h*.46);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
