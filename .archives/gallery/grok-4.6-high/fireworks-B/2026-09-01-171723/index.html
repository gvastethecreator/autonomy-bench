<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vesper Bay — Night of Embers</title>
  <style>
    :root {
      --cream: #f4e6c8;
      --gold: #e8b86a;
      --ink: #07080f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--cream);
      font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #gate, #chrome, #act {
      position: fixed;
      z-index: 2;
      pointer-events: none;
    }
    #gate {
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 38%, rgba(10,14,28,0.18), rgba(4,5,12,0.55) 62%);
      transition: opacity 1.4s ease, visibility 1.4s ease;
    }
    #gate.gone {
      opacity: 0;
      visibility: hidden;
    }
    #gate h1, #watermark h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight: 400;
      letter-spacing: 0.46em;
      text-indent: 0.46em;
      font-size: clamp(1.6rem, 5vw, 3.4rem);
      text-shadow: 0 0 42px rgba(232, 184, 106, 0.28);
    }
    #gate p {
      margin: 1rem 0 2.2rem;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
      text-transform: uppercase;
      font-size: 0.72rem;
      opacity: 0.72;
    }
    #begin {
      pointer-events: auto;
      appearance: none;
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(232, 184, 106, 0.55);
      padding: 0.85rem 1.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.68rem;
      cursor: pointer;
      border-radius: 999px;
      text-indent: 0.28em;
      transition: background 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
    }
    #begin:hover, #begin:focus-visible {
      background: rgba(232, 184, 106, 0.14);
      box-shadow: 0 0 28px rgba(232, 184, 106, 0.22);
      color: #fff6e0;
      outline: none;
    }
    #watermark {
      position: fixed;
      top: 6vh;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 2s ease;
    }
    #watermark.show { opacity: 0.28; }
    #watermark h1 {
      font-size: clamp(0.9rem, 2.4vw, 1.3rem);
      letter-spacing: 0.5em;
      text-indent: 0.5em;
    }
    #chrome {
      left: max(1rem, env(safe-area-inset-left));
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(0.9rem, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #chrome.show { opacity: 1; pointer-events: auto; }
    #chrome p, #act {
      margin: 0;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.62;
    }
    #act {
      left: 50%;
      top: 11.5vh;
      transform: translateX(-50%);
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-size: 0.7rem;
    }
    #act.show { opacity: 0.7; }
    #mute {
      pointer-events: auto;
      appearance: none;
      background: transparent;
      color: inherit;
      border: 0;
      padding: 0.4rem 0.2rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.68rem;
      cursor: pointer;
      opacity: 0.7;
    }
    #mute:hover, #mute:focus-visible {
      opacity: 1;
      outline: none;
      color: var(--gold);
    }
    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: rgba(244, 230, 200, 0.08);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #bar.show { opacity: 1; }
    #bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c4843a, #f4e6c8);
    }
    @media (prefers-reduced-motion: reduce) {
      #gate, #watermark, #chrome, #act { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="Fireworks over Vesper Bay"></canvas>
  <div id="watermark"><h1>VESPER BAY</h1></div>
  <div id="act" aria-live="polite"></div>
  <div id="gate">
    <h1>VESPER BAY</h1>
    <p>Night of Embers · Harbor Festival</p>
    <button id="begin" type="button">Begin the night</button>
  </div>
  <div id="chrome">
    <p>Click the sky to launch · Space skips to finale</p>
    <button id="mute" type="button">Sound on</button>
  </div>
  <div id="bar"><span></span></div>
  <script>
    (() => {
      const TAU = Math.PI * 2;
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d", { alpha: false });
      const fx = document.createElement("canvas");
      const fxCtx = fx.getContext("2d");
      const city = document.createElement("canvas");
      const cityCtx = city.getContext("2d");
      const gate = document.getElementById("gate");
      const begin = document.getElementById("begin");
      const muteBtn = document.getElementById("mute");
      const chrome = document.getElementById("chrome");
      const watermark = document.getElementById("watermark");
      const actEl = document.getElementById("act");
      const barFill = document.querySelector("#bar > span");
      const bar = document.getElementById("bar");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      const PAL = {
        gold: { h: [255, 236, 186], t: [232, 124, 48] },
        ember: { h: [255, 214, 170], t: [196, 48, 36] },
        crimson: { h: [255, 196, 206], t: [176, 28, 52] },
        violet: { h: [236, 210, 255], t: [92, 36, 180] },
        sapphire: { h: [210, 232, 255], t: [36, 82, 196] },
        ice: { h: [240, 252, 255], t: [72, 168, 220] },
        emerald: { h: [210, 255, 230], t: [16, 128, 92] },
        coral: { h: [255, 224, 196], t: [220, 84, 48] },
        magenta: { h: [255, 214, 236], t: [176, 28, 110] },
        white: { h: [255, 252, 245], t: [186, 196, 214] }
      };
      const PAL_LIST = Object.values(PAL);
      const TYPES = ["peony", "chrysanthemum", "willow", "kamuro", "ring", "palm", "heart", "crackle", "crossette", "glitter", "pistil", "waterfall"];

      const rand = (a, b) => a + Math.random() * (b - a);
      const irand = (a, b) => (Math.random() * (b - a) | 0) + a;
      const pick = (arr) => arr[(Math.random() * arr.length) | 0];
      const lerp = (a, b, t) => a + (b - a) * t;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      function mulberry32(a) {
        return () => {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          let t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      let w = 0, h = 0, dpr = 1, horizon = 0;
      let playing = false, paused = false, showTime = 0, lastTs = 0;
      let actName = "";
      let shake = 0, skyFlash = [0, 0, 0, 0];
      let wind = 0;
      const mobile = matchMedia("(max-width: 720px)").matches;
      const BUDGET = mobile ? 1600 : reduced ? 1200 : 3800;

      const barges = [];
      const sparks = [];
      const rockets = [];
      const flashes = [];
      const smoke = [];
      const stars = [];
      const windows = [];
      const timers = [];
      const meteors = [];

      function alloc() {
        for (let i = 0; i < sparks.length; i++) if (!sparks[i].alive) return sparks[i];
        if (sparks.length >= BUDGET) return null;
        const s = { alive: false, trail: null };
        sparks.push(s);
        return s;
      }

      function spawn(x, y, vx, vy, opt) {
        const s = alloc();
        if (!s) return null;
        s.alive = true;
        s.x = x; s.y = y; s.vx = vx; s.vy = vy;
        s.life = 1;
        s.decay = opt.decay;
        s.g = opt.g;
        s.drag = opt.drag ?? 0.986;
        s.size = opt.size;
        s.hr = opt.hr; s.hg = opt.hg; s.hb = opt.hb;
        s.tr = opt.tr; s.tg = opt.tg; s.tb = opt.tb;
        s.alpha = opt.alpha ?? 1;
        s.sparkle = opt.sparkle ?? 0;
        s.kind = opt.kind || "spark";
        s.gen = opt.gen ?? 0;
        s.crackle = !!opt.crackle;
        s.cracked = false;
        if (opt.trail) {
          if (!s.trail) s.trail = [];
          else s.trail.length = 0;
        } else s.trail = null;
        return s;
      }

      const audio = {
        ctx: null, master: null, muted: false, lastBoom: 0, noise: null,
        ensure() {
          if (this.ctx) {
            if (this.ctx.state === "suspended") this.ctx.resume();
            return;
          }
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.2;
          this.master.connect(this.ctx.destination);
          const n = this.ctx.sampleRate;
          const buf = this.ctx.createBuffer(1, n, n);
          const d = buf.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
          this.noise = buf;
        },
        boom(power = 1) {
          if (this.muted || !this.ctx) return;
          const t = this.ctx.currentTime;
          if (t - this.lastBoom < 0.065) return;
          this.lastBoom = t;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noise;
          const f = this.ctx.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.value = 160 + power * 260;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.32 * power, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32 + power * 0.28);
          src.connect(f); f.connect(g); g.connect(this.master);
          src.start(t); src.stop(t + 0.9);
          const osc = this.ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(62 + power * 18, t);
          osc.frequency.exponentialRampToValueAtTime(24, t + 0.42);
          const og = this.ctx.createGain();
          og.gain.setValueAtTime(0.38 * power, t);
          og.gain.exponentialRampToValueAtTime(0.0001, t + 0.48);
          osc.connect(og); og.connect(this.master);
          osc.start(t); osc.stop(t + 0.5);
        },
        whistle() {
          if (this.muted || !this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(420, t);
          osc.frequency.exponentialRampToValueAtTime(1180, t + 0.55);
          osc.frequency.exponentialRampToValueAtTime(380, t + 0.95);
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.045, t + 0.12);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
          osc.connect(g); g.connect(this.master);
          osc.start(t); osc.stop(t + 1.05);
        },
        crackle() {
          if (this.muted || !this.ctx) return;
          const t = this.ctx.currentTime;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noise;
          const f = this.ctx.createBiquadFilter();
          f.type = "highpass";
          f.frequency.value = 1800;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.12, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          src.connect(f); f.connect(g); g.connect(this.master);
          src.start(t); src.stop(t + 0.06);
        }
      };

      function placeBarges() {
        barges.length = 0;
        const xs = [0.13, 0.31, 0.5, 0.69, 0.86];
        for (const x of xs) barges.push({ x: w * x, y: horizon + Math.min(28, h * 0.036) });
      }

      function makeStars() {
        stars.length = 0;
        const n = mobile ? 140 : 240;
        for (let i = 0; i < n; i++) {
          const along = Math.random();
          const milky = Math.random() < 0.45;
          const x = milky ? w * (0.15 + along * 0.8) + rand(-40, 40) : rand(0, w);
          const y = milky ? h * (0.08 + along * 0.32) + rand(-30, 30) : rand(0, horizon * 0.92);
          stars.push({
            x, y,
            r: milky ? rand(0.4, 1.35) : rand(0.3, 1.1),
            a: milky ? rand(0.22, 0.7) : rand(0.15, 0.55),
            tw: rand(0.4, 2.2),
            ph: rand(0, TAU)
          });
        }
      }

      function buildCity() {
        city.width = Math.max(1, Math.floor(w * dpr));
        city.height = Math.max(1, Math.floor(h * dpr));
        cityCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cityCtx.clearRect(0, 0, w, h);
        const rng = mulberry32(20260901);
        windows.length = 0;

        const spit = w * 0.11;
        cityCtx.fillStyle = "#0a0c14";
        cityCtx.beginPath();
        cityCtx.moveTo(0, h);
        cityCtx.lineTo(0, horizon + 8);
        cityCtx.lineTo(spit, horizon - 6);
        cityCtx.lineTo(w * 0.2, horizon + 10);
        cityCtx.lineTo(w, horizon + 18);
        cityCtx.lineTo(w, h);
        cityCtx.closePath();
        cityCtx.fill();

        const lx = w * 0.125;
        const base = horizon;
        cityCtx.fillStyle = "#08090f";
        cityCtx.fillRect(lx - 10, base - 118, 20, 118);
        cityCtx.fillRect(lx - 16, base - 128, 32, 12);
        cityCtx.beginPath();
        cityCtx.moveTo(lx - 12, base - 128);
        cityCtx.lineTo(lx, base - 168);
        cityCtx.lineTo(lx + 12, base - 128);
        cityCtx.closePath();
        cityCtx.fill();
        windows.push({ x: lx, y: base - 150, s: 3, warm: 1 });

        let x = w * 0.2;
        while (x < w * 0.96) {
          const bw = 16 + rng() * 62;
          const isTower = rng() < 0.08;
          const bh = (isTower ? 150 : 36) + rng() * (isTower ? 90 : 130);
          const top = base - bh;
          cityCtx.fillStyle = rng() < 0.5 ? "#080910" : "#0b0d16";
          cityCtx.fillRect(x, top, bw, bh + 6);
          if (rng() < 0.2) {
            cityCtx.fillRect(x + bw * 0.3, top - 18, 4, 18);
          }
          if (isTower) {
            cityCtx.fillRect(x + bw * 0.42, top - 28, bw * 0.16, 28);
            cityCtx.beginPath();
            cityCtx.moveTo(x + bw * 0.3, top - 28);
            cityCtx.lineTo(x + bw * 0.5, top - 52);
            cityCtx.lineTo(x + bw * 0.7, top - 28);
            cityCtx.fill();
          }
          const cols = Math.max(2, Math.floor(bw / 9));
          const rows = Math.max(3, Math.floor(bh / 12));
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (rng() < 0.55) continue;
              windows.push({
                x: x + 4 + c * (bw - 6) / cols,
                y: top + 8 + r * (bh - 14) / rows,
                s: 1.6 + rng() * 1.4,
                warm: rng()
              });
            }
          }
          x += bw + rng() * 10;
        }

        const tx = w * 0.57;
        cityCtx.fillStyle = "#07080e";
        cityCtx.fillRect(tx - 22, base - 210, 44, 216);
        cityCtx.fillRect(tx - 28, base - 222, 56, 14);
        cityCtx.beginPath();
        cityCtx.moveTo(tx - 20, base - 222);
        cityCtx.lineTo(tx, base - 268);
        cityCtx.lineTo(tx + 20, base - 222);
        cityCtx.fill();
        cityCtx.fillStyle = "#1a140c";
        cityCtx.fillRect(tx - 10, base - 200, 20, 18);
        windows.push({ x: tx, y: base - 191, s: 5, warm: 0.2 });

        cityCtx.fillStyle = "#090b12";
        cityCtx.fillRect(w * 0.02, horizon + 2, w * 0.22, 7);
        for (let i = 0; i < 8; i++) {
          cityCtx.fillRect(w * 0.03 + i * w * 0.026, horizon - 10, 2, 18);
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        w = innerWidth;
        h = innerHeight;
        horizon = h * 0.705;
        canvas.width = Math.max(1, Math.floor(w * dpr));
        canvas.height = Math.max(1, Math.floor(h * dpr));
        fx.width = canvas.width;
        fx.height = canvas.height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        placeBarges();
        makeStars();
        buildCity();
      }

      function tone(pal, k) {
        return {
          hr: lerp(255, pal.h[0], k),
          hg: lerp(255, pal.h[1], k),
          hb: lerp(248, pal.h[2], k),
          tr: pal.t[0], tg: pal.t[1], tb: pal.t[2]
        };
      }

      function ringBurst(x, y, pal, n, speed, jitter, g, decay, size, trail, extra) {
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU + rand(-0.03, 0.03);
          const sp = speed * rand(1 - jitter, 1 + jitter);
          spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, {
            ...tone(pal, rand(0.15, 1)),
            decay, g, size: size * rand(0.7, 1.25),
            trail, drag: extra?.drag, sparkle: extra?.sparkle,
            crackle: extra?.crackle, kind: extra?.kind, gen: extra?.gen ?? 0
          });
        }
      }

      function sphereBurst(x, y, pal, n, speed, g, decay, size, trail, extra) {
        for (let i = 0; i < n; i++) {
          const a = rand(0, TAU);
          const r = Math.sqrt(Math.random()) * speed;
          spawn(x, y, Math.cos(a) * r, Math.sin(a) * r * 0.88, {
            ...tone(pal, rand(0.1, 1)),
            decay: decay * rand(0.85, 1.2),
            g, size: size * rand(0.65, 1.3),
            trail, drag: extra?.drag, sparkle: extra?.sparkle,
            crackle: extra?.crackle, kind: extra?.kind, gen: extra?.gen ?? 0,
            alpha: extra?.alpha
          });
        }
      }

      function burst(x, y, type, pal) {
        const power = type === "kamuro" || type === "willow" || type === "multibreak" ? 1.15 : type === "palm" ? 0.7 : 1;
        audio.boom(power);
        flashes.push({ x, y, r: type === "palm" ? 18 : 34, life: 1, pal });
        skyFlash[0] = Math.min(1, skyFlash[0] + pal.h[0] / 255 * 0.22);
        skyFlash[1] = Math.min(1, skyFlash[1] + pal.h[1] / 255 * 0.18);
        skyFlash[2] = Math.min(1, skyFlash[2] + pal.h[2] / 255 * 0.16);
        skyFlash[3] = Math.min(0.55, skyFlash[3] + 0.18);
        shake = Math.max(shake, type === "multibreak" ? 7 : 3.2);
        smoke.push({ x, y, r: 10, life: 1, vx: rand(-0.15, 0.15), vy: -0.12 });

        const nMul = mobile || reduced ? 0.62 : 1;

        if (type === "peony") {
          sphereBurst(x, y, pal, (90 * nMul) | 0, 3.4, 0.027, 0.011, 1.7, false);
        } else if (type === "chrysanthemum") {
          sphereBurst(x, y, pal, (100 * nMul) | 0, 3.2, 0.03, 0.009, 1.55, true);
        } else if (type === "willow") {
          sphereBurst(x, y, pal, (110 * nMul) | 0, 2.35, 0.046, 0.0058, 1.35, true, { drag: 0.992 });
        } else if (type === "kamuro") {
          sphereBurst(x, y, PAL.gold, (150 * nMul) | 0, 2.55, 0.05, 0.0048, 1.4, true, { drag: 0.993 });
        } else if (type === "ring") {
          ringBurst(x, y, pal, (72 * nMul) | 0, 3.7, 0.04, 0.018, 0.01, 1.6, false);
          if (Math.random() < 0.4) ringBurst(x, y, PAL.white, (40 * nMul) | 0, 2.1, 0.03, 0.02, 0.012, 1.2, false);
        } else if (type === "palm") {
          const n = (18 * nMul) | 0;
          for (let i = 0; i < n; i++) {
            const a = -Math.PI / 2 + rand(-0.9, 0.9);
            const sp = rand(3.4, 5.4);
            spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, {
              ...tone(pal, rand(0.3, 1)), decay: 0.0065, g: 0.055,
              size: rand(2.1, 3.2), trail: true, drag: 0.99
            });
          }
        } else if (type === "heart") {
          const n = (90 * nMul) | 0;
          for (let i = 0; i < n; i++) {
            const t = (i / n) * TAU;
            const hx = 16 * Math.sin(t) ** 3;
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            const sc = 0.22;
            spawn(x, y, hx * sc, hy * sc, {
              ...tone(pal, rand(0.2, 1)), decay: 0.0095, g: 0.03,
              size: rand(1.3, 2), trail: true, drag: 0.988
            });
          }
        } else if (type === "crackle") {
          sphereBurst(x, y, pal, (70 * nMul) | 0, 3.0, 0.03, 0.008, 1.5, false, { crackle: true });
        } else if (type === "crossette") {
          sphereBurst(x, y, pal, (36 * nMul) | 0, 2.8, 0.028, 0.01, 1.8, true, { kind: "crossette", gen: 0 });
        } else if (type === "glitter") {
          sphereBurst(x, y, pal, (80 * nMul) | 0, 2.4, 0.034, 0.0065, 1.1, false, { sparkle: 0.85, alpha: 0.65 });
        } else if (type === "pistil") {
          sphereBurst(x, y, pal, (88 * nMul) | 0, 3.5, 0.026, 0.011, 1.55, false);
          sphereBurst(x, y, pick([PAL.gold, PAL.white, pal]), (40 * nMul) | 0, 1.55, 0.022, 0.014, 1.3, false);
        } else if (type === "waterfall") {
          const n = (90 * nMul) | 0;
          for (let i = 0; i < n; i++) {
            spawn(x + rand(-28, 28), y, rand(-0.4, 0.4), rand(0.6, 2.4), {
              ...tone(pal, rand(0.2, 1)), decay: 0.0048, g: 0.05,
              size: rand(1.1, 1.8), trail: true, drag: 0.994
            });
          }
        } else if (type === "multibreak") {
          sphereBurst(x, y, PAL.white, (40 * nMul) | 0, 1.8, 0.02, 0.016, 1.2, false);
          const inner = pick(PAL_LIST);
          for (let k = 0; k < 5; k++) {
            const a = (k / 5) * TAU + rand(-0.1, 0.1);
            const d = rand(46, 78);
            timers.push({
              t: 0.28 + k * 0.04,
              fn: () => burst(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.7, pick(["peony", "pistil", "ring", "crackle"]), k % 2 ? pal : inner)
            });
          }
        } else {
          sphereBurst(x, y, pal, (80 * nMul) | 0, 3.2, 0.028, 0.011, 1.6, false);
        }
      }

      function launch(bx, type, pal, apex) {
        const b = barges.length ? barges.reduce((p, c) => Math.abs(c.x - bx) < Math.abs(p.x - bx) ? c : p, barges[0]) : { x: bx, y: horizon };
        const x = b.x + rand(-10, 10);
        const y = b.y;
        rockets.push({
          x, y, ox: x, oy: y,
          vx: (bx - x) * 0.01 + rand(-0.22, 0.22),
          vy: rand(-12.2, -8.6),
          g: 0.085,
          target: apex ?? rand(h * 0.14, h * 0.4),
          age: 0,
          pal, type,
          alive: true
        });
        audio.whistle();
        for (let i = 0; i < 10; i++) {
          spawn(x, y, rand(-0.8, 0.8), rand(-2.2, -0.2), {
            ...tone(pal, 0.6), decay: 0.04, g: 0.05, size: rand(0.8, 1.4), trail: false
          });
        }
      }

      function userLaunch(cx, cy) {
        const pal = pick(PAL_LIST);
        const type = pick(TYPES);
        const apex = clamp(cy, 40, horizon - 80);
        launch(cx, type, pal, apex);
      }

      const SHOW = 102;
      const ACTS = [
        { name: "First Light", from: 0, to: 11, rate: 0.38, types: ["willow", "kamuro"], pals: [PAL.gold] },
        { name: "Harbor Voices", from: 11, to: 24, rate: 0.72, types: ["peony", "palm", "chrysanthemum"], pals: [PAL.gold, PAL.ember, PAL.crimson, PAL.coral] },
        { name: "Coral & Ice", from: 24, to: 40, rate: 1.05, types: ["ring", "pistil", "heart", "peony", "glitter"], pals: [PAL.ice, PAL.sapphire, PAL.coral, PAL.magenta, PAL.violet] },
        { name: "The Quiet", from: 40, to: 50, rate: 0.22, types: ["kamuro", "willow"], pals: [PAL.gold, PAL.white] },
        { name: "Crown Fire", from: 50, to: 66, rate: 1.35, types: ["crackle", "crossette", "pistil", "chrysanthemum", "palm"], pals: PAL_LIST },
        { name: "Emberwake", from: 66, to: 86, rate: 3.4, types: ["peony", "pistil", "ring", "crackle", "multibreak", "heart", "kamuro"], pals: PAL_LIST },
        { name: "Afterglow", from: 86, to: SHOW, rate: 0.28, types: ["willow", "kamuro", "glitter"], pals: [PAL.gold, PAL.ember, PAL.white] }
      ];

      let accLaunch = 0;
      let finaleStamp = false;
      let quietMeteors = 0;

      function director(dt) {
        if (showTime >= SHOW) {
          showTime = 0;
          finaleStamp = false;
          quietMeteors = 0;
        }
        const act = ACTS.find((a) => showTime >= a.from && showTime < a.to) || ACTS[0];
        if (act.name !== actName) {
          actName = act.name;
          actEl.textContent = actName;
          actEl.classList.add("show");
        }
        barFill.style.width = (showTime / SHOW * 100).toFixed(2) + "%";

        let rate = act.rate;
        if (reduced) rate *= 0.55;
        accLaunch += rate * dt;
        while (accLaunch >= 1) {
          accLaunch -= 1;
          const b = pick(barges);
          launch(b.x + rand(-30, 30), pick(act.types), pick(act.pals));
        }

        if (act.name === "The Quiet" && quietMeteors < 3 && Math.random() < 0.008) {
          quietMeteors++;
          meteors.push({
            x: rand(w * 0.1, w * 0.8), y: rand(20, horizon * 0.3),
            vx: rand(3.5, 6), vy: rand(1.4, 2.4), life: 1
          });
        }

        if (act.name === "Emberwake" && !finaleStamp && showTime > 74) {
          finaleStamp = true;
          barges.forEach((b, i) => {
            timers.push({
              t: 0.12 * i,
              fn: () => launch(b.x, "kamuro", PAL.gold, h * 0.22)
            });
            timers.push({
              t: 0.7 + 0.1 * i,
              fn: () => launch(b.x, "multibreak", pick([PAL.crimson, PAL.violet, PAL.ice, PAL.gold]), h * 0.28)
            });
          });
        }
      }

      function splitCrossette(s) {
        if (s.gen > 0) return;
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * TAU + rand(-0.2, 0.2);
          const sp = rand(1.6, 2.6);
          spawn(s.x, s.y, Math.cos(a) * sp, Math.sin(a) * sp, {
            hr: s.hr, hg: s.hg, hb: s.hb, tr: s.tr, tg: s.tg, tb: s.tb,
            decay: 0.018, g: 0.04, size: s.size * 0.7, trail: true, kind: "crossette", gen: 1
          });
        }
      }

      function update(dt) {
        wind = Math.sin(showTime * 0.17) * 0.014;
        const frame = dt * 60;

        for (let i = timers.length - 1; i >= 0; i--) {
          timers[i].t -= dt;
          if (timers[i].t <= 0) {
            const fn = timers[i].fn;
            timers.splice(i, 1);
            fn();
          }
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.age += dt;
          r.vy += r.g * frame;
          r.x += r.vx * frame;
          r.y += r.vy * frame;
          if (Math.random() < 0.9) {
            spawn(r.x + rand(-1.2, 1.2), r.y + 2, r.vx * 0.2 + rand(-0.15, 0.15), -r.vy * 0.05 + rand(0.1, 0.6), {
              ...tone(r.pal, 0.4), decay: 0.05, g: 0.02, size: rand(0.7, 1.3), trail: false, alpha: 0.8
            });
          }
          const due = r.age > 0.45 && (r.y <= r.target || r.vy > -0.45 || r.y < 36);
          if (due || r.y > horizon + 40) {
            if (r.y < horizon - 40) burst(r.x, r.y, r.type, r.pal);
            rockets.splice(i, 1);
          }
        }

        for (let i = 0; i < sparks.length; i++) {
          const s = sparks[i];
          if (!s.alive) continue;
          s.vy += s.g * frame;
          s.vx += wind * frame;
          const drag = Math.pow(s.drag, frame);
          s.vx *= drag;
          s.vy *= drag;
          s.x += s.vx * frame;
          s.y += s.vy * frame;
          s.life -= s.decay * frame;
          if (s.trail) {
            s.trail.push(s.x, s.y);
            const cap = s.kind === "crossette" ? 16 : 22;
            if (s.trail.length > cap * 2) s.trail.splice(0, s.trail.length - cap * 2);
          }
          if (s.crackle && !s.cracked && s.life < 0.48) {
            s.cracked = true;
            if (Math.random() < 0.55) audio.crackle();
            for (let k = 0; k < 3; k++) {
              spawn(s.x, s.y, rand(-1.4, 1.4), rand(-1.4, 1.2), {
                hr: 255, hg: 250, hb: 230, tr: 255, tg: 220, tb: 160,
                decay: 0.04, g: 0.03, size: 0.9, trail: false
              });
            }
          }
          if (s.life <= 0) {
            if (s.kind === "crossette") splitCrossette(s);
            s.alive = false;
          }
        }

        for (let i = flashes.length - 1; i >= 0; i--) {
          flashes[i].life -= dt * 2.8;
          flashes[i].r += dt * 70;
          if (flashes[i].life <= 0) flashes.splice(i, 1);
        }
        for (let i = smoke.length - 1; i >= 0; i--) {
          const m = smoke[i];
          m.life -= dt * 0.35;
          m.r += dt * 28;
          m.x += m.vx * frame;
          m.y += m.vy * frame;
          if (m.life <= 0) smoke.splice(i, 1);
        }
        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.x += m.vx * frame;
          m.y += m.vy * frame;
          m.life -= dt * 0.55;
          if (m.life <= 0) meteors.splice(i, 1);
        }

        skyFlash[3] *= Math.pow(0.92, frame);
        shake *= Math.pow(0.86, frame);
      }

      function drawSky() {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#050714");
        g.addColorStop(0.45, "#0b1230");
        g.addColorStop(0.72, "#151a38");
        g.addColorStop(1, "#1a1730");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        if (skyFlash[3] > 0.01) {
          ctx.fillStyle = `rgba(${(skyFlash[0] * 255) | 0},${(skyFlash[1] * 255) | 0},${(skyFlash[2] * 255) | 0},${skyFlash[3] * 0.35})`;
          ctx.fillRect(0, 0, w, horizon);
        }

        const milky = ctx.createLinearGradient(0, 0, w, horizon * 0.7);
        milky.addColorStop(0, "rgba(180,190,220,0)");
        milky.addColorStop(0.45, "rgba(200,210,240,0.05)");
        milky.addColorStop(1, "rgba(180,190,220,0)");
        ctx.fillStyle = milky;
        ctx.save();
        ctx.translate(w * 0.1, h * 0.02);
        ctx.rotate(-0.42);
        ctx.fillRect(0, 0, w * 1.1, h * 0.18);
        ctx.restore();

        for (const s of stars) {
          const tw = 0.55 + 0.45 * Math.sin(showTime * s.tw + s.ph);
          ctx.fillStyle = `rgba(230,236,255,${s.a * tw})`;
          ctx.fillRect(s.x, s.y, s.r, s.r);
        }

        const mx = w * 0.82, my = h * 0.16, mr = Math.min(w, h) * 0.046;
        const mg = ctx.createRadialGradient(mx - mr * 0.25, my - mr * 0.3, mr * 0.2, mx, my, mr);
        mg.addColorStop(0, "#fff6de");
        mg.addColorStop(0.45, "#e8d8b0");
        mg.addColorStop(1, "rgba(180,160,110,0)");
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mx, my, mr * 1.8, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#f2e6c4";
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(190,170,130,0.25)";
        ctx.beginPath(); ctx.arc(mx + mr * 0.22, my + mr * 0.1, mr * 0.22, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(mx - mr * 0.28, my + mr * 0.18, mr * 0.12, 0, TAU); ctx.fill();

        const lx = w * 0.125, ly = horizon - 150;
        const ang = showTime * 0.28;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, horizon);
        ctx.clip();
        ctx.translate(lx, ly);
        ctx.rotate(ang);
        const beam = ctx.createLinearGradient(0, 0, w * 0.42, 0);
        beam.addColorStop(0, "rgba(255,236,190,0.16)");
        beam.addColorStop(1, "rgba(255,236,190,0)");
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(w * 0.48, -26);
        ctx.lineTo(w * 0.48, 26);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#ffe9b0";
        ctx.globalAlpha = 0.8 + 0.2 * Math.sin(showTime * 2);
        ctx.beginPath();
        ctx.arc(lx, ly, 3.2, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawFx() {
        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fxCtx.clearRect(0, 0, w, h);
        fxCtx.globalCompositeOperation = "lighter";

        for (const f of flashes) {
          const g = fxCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
          g.addColorStop(0, `rgba(255,252,240,${0.85 * f.life})`);
          g.addColorStop(0.25, `rgba(${f.pal.h[0]},${f.pal.h[1]},${f.pal.h[2]},${0.35 * f.life})`);
          g.addColorStop(1, "rgba(0,0,0,0)");
          fxCtx.fillStyle = g;
          fxCtx.beginPath();
          fxCtx.arc(f.x, f.y, f.r, 0, TAU);
          fxCtx.fill();
        }

        for (const r of rockets) {
          const g = fxCtx.createLinearGradient(r.x, r.y, r.x, r.y + 18);
          g.addColorStop(0, "rgba(255,255,240,0.95)");
          g.addColorStop(1, `rgba(${r.pal.h[0]},${r.pal.h[1]},${r.pal.h[2]},0)`);
          fxCtx.strokeStyle = g;
          fxCtx.lineWidth = 2;
          fxCtx.beginPath();
          fxCtx.moveTo(r.x, r.y);
          fxCtx.lineTo(r.x - r.vx * 2, r.y - r.vy * 1.4);
          fxCtx.stroke();
          fxCtx.fillStyle = "#fff";
          fxCtx.beginPath();
          fxCtx.arc(r.x, r.y, 1.8, 0, TAU);
          fxCtx.fill();
        }

        for (const s of sparks) {
          if (!s.alive) continue;
          const hot = s.life > 0.78 ? (s.life - 0.78) / 0.22 : 0;
          const r = lerp(s.tr, lerp(s.hr, 255, hot), s.life);
          const g = lerp(s.tg, lerp(s.hg, 252, hot), s.life);
          const b = lerp(s.tb, lerp(s.hb, 240, hot), s.life);
          let a = s.life * s.alpha;
          if (s.sparkle) a *= 0.35 + 0.65 * Math.abs(Math.sin(s.x * 0.2 + showTime * 18 + s.y));
          if (a < 0.02) continue;
          if (s.trail && s.trail.length > 3) {
            fxCtx.strokeStyle = `rgba(${r | 0},${g | 0},${b | 0},${a * 0.28})`;
            fxCtx.lineWidth = Math.max(0.6, s.size * 0.75);
            fxCtx.lineCap = "round";
            fxCtx.beginPath();
            fxCtx.moveTo(s.trail[0], s.trail[1]);
            for (let i = 2; i < s.trail.length; i += 2) fxCtx.lineTo(s.trail[i], s.trail[i + 1]);
            fxCtx.stroke();
          }
          const sz = s.size * (0.45 + s.life * 0.7);
          fxCtx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${a})`;
          if (sz < 1.15) {
            fxCtx.fillRect(s.x, s.y, 1.4, 1.4);
          } else {
            fxCtx.beginPath();
            fxCtx.arc(s.x, s.y, sz, 0, TAU);
            fxCtx.fill();
            fxCtx.fillStyle = `rgba(255,252,240,${a * 0.75})`;
            fxCtx.beginPath();
            fxCtx.arc(s.x, s.y, sz * 0.32, 0, TAU);
            fxCtx.fill();
          }
        }

        fxCtx.globalCompositeOperation = "source-over";
        for (const m of meteors) {
          fxCtx.strokeStyle = `rgba(255,248,230,${m.life})`;
          fxCtx.lineWidth = 1.4;
          fxCtx.beginPath();
          fxCtx.moveTo(m.x, m.y);
          fxCtx.lineTo(m.x - m.vx * 6, m.y - m.vy * 6);
          fxCtx.stroke();
        }
      }

      function drawWaterAndCity(ox, oy) {
        const waterH = h - horizon;
        const wg = ctx.createLinearGradient(0, horizon, 0, h);
        wg.addColorStop(0, "#0c1224");
        wg.addColorStop(0.4, "#080d1a");
        wg.addColorStop(1, "#04060d");
        ctx.fillStyle = wg;
        ctx.fillRect(0, horizon, w, waterH);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, horizon, w, waterH);
        ctx.clip();
        const strips = Math.max(18, Math.min(48, (waterH / 7) | 0));
        const sh = waterH / strips;
        for (let i = 0; i < strips; i++) {
          const srcY = horizon - (i + 1) * sh * 1.05;
          if (srcY < 0) continue;
          const destY = horizon + i * sh;
          const wobble = Math.sin(showTime * 1.35 + i * 0.31) * (1.1 + i * 0.05);
          ctx.globalAlpha = 0.42 * (1 - i / strips);
          ctx.drawImage(
            fx,
            0, srcY * dpr,
            fx.width, Math.max(1, sh * dpr),
            wobble + ox, destY + oy,
            w, sh
          );
        }
        ctx.globalAlpha = 0.22;
        ctx.save();
        ctx.translate(0, horizon * 2 + 12);
        ctx.scale(1, -0.55);
        ctx.drawImage(city, 0, 0, city.width, city.height, 0, 0, w, h);
        ctx.restore();
        ctx.restore();
        ctx.globalAlpha = 1;

        for (const m of smoke) {
          ctx.fillStyle = `rgba(40,44,58,${0.1 * m.life})`;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, TAU);
          ctx.fill();
        }

        ctx.drawImage(fx, 0, 0, fx.width, fx.height, ox, oy, w, h);
        ctx.drawImage(city, 0, 0, city.width, city.height, 0, 0, w, h);

        for (const win of windows) {
          const flick = 0.55 + 0.45 * Math.sin(showTime * (0.7 + win.warm) + win.x * 0.02);
          if (flick < 0.42) continue;
          const warm = win.warm;
          ctx.fillStyle = `rgba(${(255) | 0},${(200 + warm * 40) | 0},${(120 + warm * 40) | 0},${0.55 * flick})`;
          ctx.fillRect(win.x, win.y, win.s, win.s * 1.15);
        }

        for (const b of barges) {
          ctx.fillStyle = "#05060c";
          ctx.beginPath();
          ctx.moveTo(b.x - 18, b.y);
          ctx.lineTo(b.x + 18, b.y);
          ctx.lineTo(b.x + 14, b.y + 6);
          ctx.lineTo(b.x - 14, b.y + 6);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255, 214, 140, 0.75)";
          ctx.fillRect(b.x - 1, b.y - 5, 2, 5);
          ctx.beginPath();
          ctx.arc(b.x, b.y - 6, 1.6, 0, TAU);
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(180, 190, 220, 0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, horizon + 0.5);
        ctx.lineTo(w, horizon + 0.5);
        ctx.stroke();

        for (let i = 0; i < 14; i++) {
          const yy = horizon + 8 + i * (waterH / 14);
          ctx.strokeStyle = `rgba(210,220,255,${0.03 + 0.02 * Math.sin(showTime * 1.6 + i)})`;
          ctx.beginPath();
          ctx.moveTo(0, yy + Math.sin(showTime * 0.8 + i) * 1.4);
          ctx.lineTo(w, yy + Math.sin(showTime * 0.8 + i + 1.2) * 1.4);
          ctx.stroke();
        }

        const vig = ctx.createRadialGradient(w * 0.5, h * 0.42, h * 0.2, w * 0.5, h * 0.5, h * 0.82);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.42)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, w, h);
      }

      function frame(ts) {
        requestAnimationFrame(frame);
        if (!lastTs) lastTs = ts;
        let dt = (ts - lastTs) / 1000;
        lastTs = ts;
        if (dt > 0.05) dt = 0.05;
        if (paused) return;

        if (playing) {
          showTime += dt;
          director(dt);
        } else {
          showTime += dt * 0.35;
        }
        update(dt);
        drawSky();
        drawFx();
        const ox = shake ? (Math.random() - 0.5) * shake : 0;
        const oy = shake ? (Math.random() - 0.5) * shake : 0;
        drawWaterAndCity(ox, oy);
      }

      function startNight() {
        if (playing) return;
        playing = true;
        audio.ensure();
        gate.classList.add("gone");
        chrome.classList.add("show");
        watermark.classList.add("show");
        bar.classList.add("show");
        showTime = 0;
        accLaunch = 0;
        finaleStamp = false;
        launch(barges[2].x, "kamuro", PAL.gold, h * 0.26);
      }

      begin.addEventListener("click", startNight);
      canvas.addEventListener("pointerdown", (e) => {
        if (!playing) {
          startNight();
          return;
        }
        const rect = canvas.getBoundingClientRect();
        userLaunch(e.clientX - rect.left, e.clientY - rect.top);
      });
      muteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        audio.ensure();
        audio.muted = !audio.muted;
        muteBtn.textContent = audio.muted ? "Sound off" : "Sound on";
      });
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!playing) startNight();
          else {
            showTime = 66;
            finaleStamp = false;
            accLaunch = 0;
          }
        } else if (e.key === "m" || e.key === "M") {
          audio.ensure();
          audio.muted = !audio.muted;
          muteBtn.textContent = audio.muted ? "Sound off" : "Sound on";
        }
      });
      document.addEventListener("visibilitychange", () => {
        paused = document.hidden;
        if (!paused) lastTs = 0;
      });
      window.addEventListener("resize", resize);

      resize();
      requestAnimationFrame(frame);
    })();
