<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0a08">
  <title>Formica rufa — a woodland colony</title>
  <style>
    :root {
      --ink: #f0e6d4;
      --mute: #b5a58c;
      --line: rgba(240, 230, 212, 0.16);
      --panel: rgba(12, 10, 8, 0.78);
      --accent: #e2b36a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0c0a08;
      color: var(--ink);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header, footer {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.1rem;
      background: var(--panel);
      border-color: var(--line);
      z-index: 2;
    }
    header {
      border-bottom: 1px solid var(--line);
    }
    footer {
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font: italic 600 1.05rem/1.15 Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
      letter-spacing: 0.02em;
    }
    .tag {
      margin: 0.15rem 0 0;
      color: var(--mute);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stats {
      display: flex;
      gap: 1.25rem;
      font-variant-numeric: tabular-nums;
    }
    .stats div { text-align: right; }
    .stats b {
      display: block;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
    }
    .stats span {
      color: var(--mute);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #14100c;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    #hint {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
      max-width: 22rem;
      margin: 0;
      padding: 0.65rem 0.8rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #hint.hide { opacity: 0; }
    #paused {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 6, 4, 0.35);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--ink);
      pointer-events: none;
      opacity: 0;
    }
    #paused.on { opacity: 1; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }
    button {
      appearance: none;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      font: 600 0.72rem/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { border-color: rgba(240, 230, 212, 0.4); }
    button[aria-pressed="true"] {
      background: var(--ink);
      color: #16110c;
      border-color: var(--ink);
    }
    .pace {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.4rem;
      color: var(--mute);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }
    input[type="range"] {
      width: 7rem;
      accent-color: var(--accent);
    }
    .swatches {
      display: flex;
      gap: 0.85rem;
      color: var(--mute);
      font-size: 0.72rem;
    }
    .swatches i {
      display: inline-block;
      width: 0.55rem;
      height: 0.55rem;
      margin-right: 0.35rem;
      border-radius: 50%;
      vertical-align: -1px;
    }
    .gold { background: #e2b36a; }
    .teal { background: #6aa8a0; }
    @media (max-width: 720px) {
      .tag, .swatches { display: none; }
      header, footer { padding: 0.55rem 0.7rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>Formica rufa</h1>
        <p class="tag">Red wood ant · oak floor at dusk</p>
      </div>
      <div class="stats">
        <div><b id="larder">0</b><span>Larder</span></div>
        <div><b id="hill">0</b><span>Hill</span></div>
        <div><b id="hauls">0</b><span>Hauls</span></div>
      </div>
    </header>
    <div id="stage">
      <canvas id="c" aria-label="Ant colony on the forest floor"></canvas>
      <p id="hint">Click the floor to drop seeds. Right-click to set stones. Gold scent leads to food; the hill learns the shorter path.</p>
      <div id="paused">Paused</div>
    </div>
    <footer>
      <div class="tools">
        <button id="btnSeeds" aria-pressed="true" type="button" title="1">Seeds</button>
        <button id="btnStones" aria-pressed="false" type="button" title="2">Stones</button>
        <button id="btnPause" type="button" title="Space">Pause</button>
        <label class="pace">Pace <input id="pace" type="range" min="0.5" max="4" step="0.5" value="1"></label>
        <button id="btnScatter" type="button">Scatter</button>
        <button id="btnReset" type="button" title="R">New hill</button>
      </div>
      <div class="swatches">
        <span><i class="gold"></i>to food</span>
        <span><i class="teal"></i>to nest</span>
      </div>
    </footer>
  </div>
  <script>
    (() => {
      const TAU = Math.PI * 2;
      const CELL = 4;
      const MAX_ANTS = 220;
      const COLORS = ["#4a2818", "#5c2e1a", "#3a1e14", "#6b341c", "#2e1810", "#7a3d22"];
      const canvas = document.getElementById("c");
      const stage = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const pCan = document.createElement("canvas");
      const pctx = pCan.getContext("2d");
      const gCan = document.createElement("canvas");
      const gctx = gCan.getContext("2d");
      const hint = document.getElementById("hint");
      const pausedEl = document.getElementById("paused");
      const btnSeeds = document.getElementById("btnSeeds");
      const btnStones = document.getElementById("btnStones");
      const btnPause = document.getElementById("btnPause");
      const btnScatter = document.getElementById("btnScatter");
      const btnReset = document.getElementById("btnReset");
      const paceEl = document.getElementById("pace");
      const larderEl = document.getElementById("larder");
      const hillEl = document.getElementById("hill");
      const haulsEl = document.getElementById("hauls");

      let dpr = 1, cssW = 0, cssH = 0, cols = 0, rows = 0;
      let foodP, homeP, tmpP, pImg;
      let nestX = 0, nestY = 0, stored = 0, hauls = 0;
      let ants = [], rocks = [], piles = [], particles = [], motes = [], leaves = [];
      let tool = "seeds", running = true, pace = 1;
      let pointer = null, frame = 0, t = 0, acc = 0;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
      function dist(ax, ay, bx, by) {
        const dx = ax - bx, dy = ay - by;
        return Math.hypot(dx, dy);
      }
      function angDiff(a, b) {
        let d = b - a;
        while (d > Math.PI) d -= TAU;
        while (d < -Math.PI) d += TAU;
        return d;
      }
      function turnToward(a, b, max) {
        return a + clamp(angDiff(a, b), -max, max);
      }
      function idx(x, y) { return y * cols + x; }

      function blocked(x, y) {
        if (x < 6 || y < 6 || x > cssW - 6 || y > cssH - 6) return true;
        for (let i = 0; i < rocks.length; i++) {
          const r = rocks[i];
          if (dist(x, y, r.x, r.y) < r.r + 2) return true;
        }
        return false;
      }

      function sample(grid, x, y) {
        if (blocked(x, y)) return -0.35;
        const gx = x / CELL | 0;
        const gy = y / CELL | 0;
        if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) return 0;
        return grid[idx(gx, gy)];
      }

      function deposit(grid, x, y, amt) {
        const gx = x / CELL | 0;
        const gy = y / CELL | 0;
        for (let oy = -1; oy <= 1; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            const xx = gx + ox, yy = gy + oy;
            if (xx < 0 || yy < 0 || xx >= cols || yy >= rows) continue;
            const w = ox || oy ? 0.32 : 1;
            const i = idx(xx, yy);
            grid[i] = Math.min(1.6, grid[i] + amt * w);
          }
        }
      }

      function diffuse(arr) {
        const tbuf = tmpP;
        const w = cols, h = rows;
        tbuf.set(arr);
        for (let y = 1; y < h - 1; y++) {
          const row = y * w;
          for (let x = 1; x < w - 1; x++) {
            const i = row + x;
            tbuf[i] = arr[i] * 0.7 + (arr[i - 1] + arr[i + 1] + arr[i - w] + arr[i + w]) * 0.075;
          }
        }
        arr.set(tbuf);
      }

      function layout() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cssW = Math.max(1, rect.width);
        cssH = Math.max(1, rect.height);
        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.max(8, Math.ceil(cssW / CELL));
        rows = Math.max(8, Math.ceil(cssH / CELL));
        foodP = new Float32Array(cols * rows);
        homeP = new Float32Array(cols * rows);
        tmpP = new Float32Array(cols * rows);
        pCan.width = cols;
        pCan.height = rows;
        pImg = pctx.createImageData(cols, rows);
        gCan.width = Math.floor(cssW * dpr);
        gCan.height = Math.floor(cssH * dpr);
        gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        paintGround();
      }

      function paintGround() {
        const w = cssW, h = cssH;
        gctx.fillStyle = "#16110d";
        gctx.fillRect(0, 0, w, h);
        const moss = gctx.createRadialGradient(w * 0.7, h * 0.35, 20, w * 0.7, h * 0.35, w * 0.45);
        moss.addColorStop(0, "rgba(52, 64, 40, 0.28)");
        moss.addColorStop(1, "rgba(52, 64, 40, 0)");
        gctx.fillStyle = moss;
        gctx.fillRect(0, 0, w, h);
        const duff = gctx.createRadialGradient(w * 0.2, h * 0.6, 10, w * 0.2, h * 0.6, w * 0.4);
        duff.addColorStop(0, "rgba(72, 48, 28, 0.35)");
        duff.addColorStop(1, "rgba(72, 48, 28, 0)");
        gctx.fillStyle = duff;
        gctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 9000; i++) {
          const v = Math.random();
          gctx.fillStyle = v > 0.55 ? "rgba(90, 68, 42, 0.16)" : "rgba(0, 0, 0, 0.22)";
          gctx.fillRect(Math.random() * w, Math.random() * h, v > 0.92 ? 2 : 1, 1);
        }
        gctx.save();
        for (let i = 0; i < 18; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const rot = Math.random() * TAU;
          const len = 8 + Math.random() * 22;
          gctx.translate(x, y);
          gctx.rotate(rot);
          gctx.fillStyle = i % 3 ? "rgba(74, 52, 28, 0.28)" : "rgba(58, 72, 40, 0.22)";
          gctx.beginPath();
          gctx.ellipse(0, 0, len, len * 0.32, 0, 0, TAU);
          gctx.fill();
          gctx.strokeStyle = "rgba(30, 20, 10, 0.25)";
          gctx.lineWidth = 0.6;
          gctx.beginPath();
          gctx.moveTo(-len, 0);
          gctx.lineTo(len, 0);
          gctx.stroke();
          gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        gctx.restore();
        drawRoot(gctx, w * 0.02, h * 0.7, w * 0.28, h * 0.5, "#2a1c14");
        drawRoot(gctx, w * 0.0, h * 0.48, w * 0.22, h * 0.62, "#23180f");
        const vig = gctx.createRadialGradient(w * 0.5, h * 0.52, h * 0.18, w * 0.5, h * 0.52, h * 0.78);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.42)");
        gctx.fillStyle = vig;
        gctx.fillRect(0, 0, w, h);
      }

      function drawRoot(c, x0, y0, x1, y1, color) {
        c.strokeStyle = color;
        c.lineWidth = 14;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(x0, y0);
        c.bezierCurveTo(x0 + 40, y0 - 30, x1 - 30, y1 + 40, x1, y1);
        c.stroke();
        c.lineWidth = 7;
        c.beginPath();
        c.moveTo((x0 + x1) * 0.5, (y0 + y1) * 0.5);
        c.quadraticCurveTo(x1, y0, x1 + 30, y1 - 40);
        c.stroke();
      }

      function spawnAnt(fromNest) {
        const a = Math.random() * TAU;
        const spread = fromNest ? 14 + Math.random() * 10 : 0;
        ants.push({
          x: nestX + Math.cos(a) * spread,
          y: nestY + Math.sin(a) * spread * 0.75,
          a,
          state: 0,
          speed: 1.15 + Math.random() * 0.45,
          size: 2.6 + Math.random() * 1.35,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          carry: "#d4a24c",
          phase: Math.random() * TAU,
          trip: 1,
          sd: 13 + Math.random() * 10,
          sa: 0.42 + Math.random() * 0.28
        });
      }

      function addRock(x, y, r, seed) {
        if (dist(x, y, nestX, nestY) < 58) return;
        for (let i = 0; i < rocks.length; i++) {
          if (dist(x, y, rocks[i].x, rocks[i].y) < r * 0.45) return;
        }
        rocks.push({ x, y, r, seed: seed == null ? Math.random() * 99 : seed });
      }

      function addFood(x, y, amt, kind) {
        if (blocked(x, y) || dist(x, y, nestX, nestY) < 50) return;
        for (let i = 0; i < piles.length; i++) {
          const p = piles[i];
          if (dist(x, y, p.x, p.y) < 30) {
            p.amount = Math.min(420, p.amount + amt);
            p.max = Math.max(p.max, p.amount);
            return;
          }
        }
        piles.push({
          x, y,
          amount: amt,
          max: amt,
          seed: Math.random() * 1000,
          kind: kind == null ? (Math.random() < 0.5 ? 0 : 1) : kind
        });
      }

      function resetWorld() {
        ants = [];
        rocks = [];
        piles = [];
        particles = [];
        stored = 8;
        hauls = 0;
        if (foodP) { foodP.fill(0); homeP.fill(0); }
        nestX = cssW * 0.22;
        nestY = cssH * 0.56;
        const rx = cssW * 0.52;
        for (let i = 0; i < 11; i++) {
          const tpos = i / 10;
          const y = cssH * (0.14 + tpos * 0.74);
          if (y > cssH * 0.36 && y < cssH * 0.5) continue;
          addRock(rx + Math.sin(i * 2.3) * 20, y, 20 + (i % 3) * 7, i * 13.7);
        }
        addRock(cssW * 0.34, cssH * 0.28, 18, 4);
        addRock(cssW * 0.7, cssH * 0.78, 24, 8);
        addRock(cssW * 0.88, cssH * 0.3, 16, 2);
        piles.push(
          { x: cssW * 0.37, y: cssH * 0.78, amount: 170, max: 170, seed: 11, kind: 1 },
          { x: cssW * 0.81, y: cssH * 0.57, amount: 300, max: 300, seed: 22, kind: 0 },
          { x: cssW * 0.64, y: cssH * 0.17, amount: 210, max: 210, seed: 33, kind: 1 }
        );
        for (let i = 0; i < 108; i++) spawnAnt(true);
        motes = Array.from({ length: 36 }, () => ({
          x: Math.random() * cssW,
          y: Math.random() * cssH,
          s: 0.5 + Math.random() * 1.4,
          v: 0.04 + Math.random() * 0.12,
          drift: Math.random() * TAU
        }));
        leaves = Array.from({ length: reduced ? 0 : 5 }, () => resetLeaf({}));
        frame = 0;
      }

      function resetLeaf(L) {
        L.x = Math.random() * cssW;
        L.y = -20 - Math.random() * 80;
        L.r = Math.random() * TAU;
        L.s = 6 + Math.random() * 10;
        L.vy = 0.15 + Math.random() * 0.22;
        L.vr = (Math.random() - 0.5) * 0.02;
        L.c = Math.random() < 0.5 ? "rgba(110, 62, 28, 0.35)" : "rgba(72, 86, 42, 0.32)";
        return L;
      }

      function scaleWorld(sx, sy) {
        nestX *= sx; nestY *= sy;
        const sr = (sx + sy) * 0.5;
        for (const a of ants) { a.x *= sx; a.y *= sy; }
        for (const r of rocks) { r.x *= sx; r.y *= sy; r.r *= sr; }
        for (const p of piles) { p.x *= sx; p.y *= sy; }
      }

      function sensorSteer(ant, grid) {
        const d = ant.sd, ang = ant.sa, a = ant.a;
        const l = sample(grid, ant.x + Math.cos(a - ang) * d, ant.y + Math.sin(a - ang) * d);
        const f = sample(grid, ant.x + Math.cos(a) * d, ant.y + Math.sin(a) * d);
        const r = sample(grid, ant.x + Math.cos(a + ang) * d, ant.y + Math.sin(a + ang) * d);
        if (f >= l && f >= r) return 0;
        if (l > r) return -ang;
        if (r > l) return ang;
        return 0;
      }

      function avoid(ant) {
        const look = 11;
        const ax = ant.x + Math.cos(ant.a) * look;
        const ay = ant.y + Math.sin(ant.a) * look;
        if (!blocked(ax, ay)) return 0;
        const left = !blocked(ant.x + Math.cos(ant.a - 0.9) * look, ant.y + Math.sin(ant.a - 0.9) * look);
        const right = !blocked(ant.x + Math.cos(ant.a + 0.9) * look, ant.y + Math.sin(ant.a + 0.9) * look);
        if (left && !right) return -0.55;
        if (right && !left) return 0.55;
        return (Math.random() < 0.5 ? -1 : 1) * 0.7;
      }

      function pickupColor(kind) {
        return kind === 0 ? "#e2b36a" : "#c47a48";
      }

      function stepAnt(ant) {
        ant.trip += 1;
        ant.phase += ant.speed * 0.35;
        let steer = avoid(ant) + (Math.random() - 0.5) * 0.16;
        const nestAng = Math.atan2(nestY - ant.y, nestX - ant.x);
        const nestD = dist(ant.x, ant.y, nestX, nestY);

        if (ant.state === 0) {
          steer += sensorSteer(ant, foodP);
          if (nestD < 42) ant.a = turnToward(ant.a, nestAng + Math.PI, 0.18);
          deposit(homeP, ant.x, ant.y, 0.035);
          for (let i = 0; i < piles.length; i++) {
            const p = piles[i];
            const rad = 9 + Math.sqrt(p.amount) * 0.7;
            if (p.amount > 0 && dist(ant.x, ant.y, p.x, p.y) < rad) {
              p.amount -= 1;
              ant.state = 1;
              ant.carry = pickupColor(p.kind);
              deposit(foodP, ant.x, ant.y, 0.22);
              if (!reduced) burst(ant.x, ant.y, ant.carry, 4);
              break;
            }
          }
        } else {
          steer += sensorSteer(ant, homeP) * 0.85;
          ant.a = turnToward(ant.a, nestAng, 0.12);
          const q = clamp(28 / ant.trip, 0.04, 0.16);
          deposit(foodP, ant.x, ant.y, q);
          if (nestD < 16) {
            ant.state = 0;
            stored += 1;
            hauls += 1;
            ant.trip = 1;
            ant.a = nestAng + Math.PI + (Math.random() - 0.5) * 0.8;
            if (!reduced) burst(nestX, nestY, "#e2b36a", 6);
          }
        }

        ant.a += steer * 0.65;
        ant.a += Math.sin(ant.phase * 0.35 + ant.size) * 0.012;
        let nx = ant.x + Math.cos(ant.a) * ant.speed;
        let ny = ant.y + Math.sin(ant.a) * ant.speed;
        if (blocked(nx, ny)) {
          ant.a += 0.8 + Math.random() * 0.6;
          nx = ant.x + Math.cos(ant.a) * ant.speed * 0.5;
          ny = ant.y + Math.sin(ant.a) * ant.speed * 0.5;
          if (blocked(nx, ny)) return;
        }
        ant.x = nx;
        ant.y = ny;
      }

      function burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * TAU;
          const s = 0.3 + Math.random() * 1.1;
          particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
        }
      }

      function step() {
        frame++;
        for (let i = 0; i < foodP.length; i++) {
          foodP[i] *= 0.9935;
          homeP[i] *= 0.9955;
        }
        if (frame % 2 === 0) {
          diffuse(foodP);
          diffuse(homeP);
        }
        for (let i = 0; i < ants.length; i++) stepAnt(ants[i]);
        if (stored >= 22 && ants.length < MAX_ANTS) {
          stored -= 12;
          spawnAnt(true);
        }
        piles = piles.filter((p) => p.amount > 0.5);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.life -= 0.03;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (const m of motes) {
          m.y += m.v;
          m.x += Math.sin(t * 0.001 + m.drift) * 0.12;
          if (m.y > cssH) { m.y = 0; m.x = Math.random() * cssW; }
        }
        for (const L of leaves) {
          L.y += L.vy;
          L.x += Math.sin(t * 0.001 + L.r) * 0.35;
          L.r += L.vr;
          if (L.y > cssH + 20) resetLeaf(L);
        }
      }

      function renderPheromones() {
        const data = pImg.data;
        const n = foodP.length;
        for (let i = 0; i < n; i++) {
          const f = foodP[i] > 1 ? 1 : foodP[i];
          const h = homeP[i] > 1 ? 1 : homeP[i];
          const o = i * 4;
          data[o] = 226 * f + 70 * h;
          data[o + 1] = 165 * f + 155 * h;
          data[o + 2] = 55 * f + 145 * h;
          data[o + 3] = Math.min(230, Math.pow(f, 0.55) * 210 + Math.pow(h, 0.55) * 95);
        }
        pctx.putImageData(pImg, 0, 0);
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(pCan, 0, 0, cssW, cssH);
        ctx.restore();
      }

      function drawRock(r) {
        ctx.beginPath();
        const n = 8;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU + r.seed * 0.05;
          const rad = r.r * (0.78 + ((Math.sin(r.seed + i * 1.7) + 1) * 0.16));
          const x = r.x + Math.cos(a) * rad;
          const y = r.y + Math.sin(a) * rad * 0.86;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = "#3a3734";
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(r.x - r.r * 0.18, r.y - r.r * 0.22, r.r * 0.35, r.r * 0.18, -0.4, 0, TAU);
        ctx.fillStyle = "rgba(210, 205, 195, 0.08)";
        ctx.fill();
      }

      function drawPile(p) {
        const n = Math.max(4, Math.min(36, p.amount / 5 | 0));
        const rad = 8 + Math.sqrt(p.amount) * 0.65;
        for (let i = 0; i < n; i++) {
          const u = Math.sin(p.seed + i * 12.1) * 0.5 + 0.5;
          const v = Math.cos(p.seed + i * 7.3) * 0.5 + 0.5;
          const a = u * TAU;
          const rr = Math.sqrt(v) * rad;
          const x = p.x + Math.cos(a) * rr;
          const y = p.y + Math.sin(a) * rr * 0.72;
          ctx.beginPath();
          if (p.kind === 0) {
            ctx.fillStyle = i % 2 ? "#e2b36a" : "#c9924a";
            ctx.ellipse(x, y, 2.1, 1.5, a, 0, TAU);
          } else {
            ctx.fillStyle = i % 2 ? "#c47a48" : "#8a4a2a";
            ctx.ellipse(x, y, 1.7, 2.4, a * 0.4, 0, TAU);
          }
          ctx.fill();
        }
      }

      function drawNest() {
        const glow = Math.min(0.55, 0.12 + stored / 700);
        const g = ctx.createRadialGradient(nestX, nestY, 6, nestX, nestY, 64);
        g.addColorStop(0, `rgba(226, 179, 106, ${glow})`);
        g.addColorStop(0.4, "rgba(58, 40, 24, 0.9)");
        g.addColorStop(1, "rgba(22, 17, 13, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(nestX, nestY + 4, 58, 40, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#2a1d14";
        ctx.beginPath();
        ctx.ellipse(nestX, nestY + 2, 36, 24, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#0a0806";
        ctx.beginPath();
        ctx.ellipse(nestX, nestY, 12, 8, 0, 0, TAU);
        ctx.fill();
        const inner = ctx.createRadialGradient(nestX, nestY, 0, nestX, nestY, 12);
        inner.addColorStop(0, `rgba(226, 163, 92, ${0.25 + glow})`);
        inner.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = inner;
        ctx.beginPath();
        ctx.ellipse(nestX, nestY, 12, 8, 0, 0, TAU);
        ctx.fill();
      }

      function drawAnt(ant) {
        const s = ant.size;
        ctx.save();
        ctx.translate(ant.x, ant.y);
        ctx.rotate(ant.a);
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.beginPath();
        ctx.ellipse(0, 0.9, s * 1.55, s * 0.55, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = ant.color;
        ctx.strokeStyle = ant.color;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.ellipse(-s * 0.95, 0, s * 1.02, s * 0.58, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(s * 0.12, 0, s * 0.52, s * 0.44, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(s * 0.88, 0, s * 0.4, s * 0.36, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(s * 1.1, -0.12 * s);
        ctx.quadraticCurveTo(s * 1.55, -s * 1.05, s * 1.75, -s * 1.15);
        ctx.moveTo(s * 1.1, 0.12 * s);
        ctx.quadraticCurveTo(s * 1.65, s * 0.35, s * 1.85, s * 0.18);
        ctx.stroke();
        const gait = Math.sin(ant.phase);
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const ox = -0.75 * s + i * 0.58 * s;
          const swing = gait * (i % 2 ? 1 : -1) * 0.32 * s;
          ctx.moveTo(ox, 0);
          ctx.lineTo(ox - 0.15 * s + swing, s * 1.12);
          ctx.moveTo(ox, 0);
          ctx.lineTo(ox - 0.15 * s - swing, -s * 1.12);
        }
        ctx.stroke();
        if (ant.state === 1) {
          ctx.fillStyle = ant.carry;
          ctx.beginPath();
          ctx.ellipse(s * 1.32, 0, s * 0.28, s * 0.26, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function draw() {
        ctx.drawImage(gCan, 0, 0, cssW, cssH);
        renderPheromones();
        for (const r of rocks) drawRock(r);
        for (const p of piles) drawPile(p);
        drawNest();
        for (const L of leaves) {
          ctx.save();
          ctx.translate(L.x, L.y);
          ctx.rotate(L.r);
          ctx.fillStyle = L.c;
          ctx.beginPath();
          ctx.ellipse(0, 0, L.s, L.s * 0.34, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        for (const m of motes) {
          ctx.fillStyle = "rgba(240, 230, 212, 0.12)";
          ctx.fillRect(m.x, m.y, m.s, m.s);
        }
        for (let i = 0; i < ants.length; i++) drawAnt(ants[i]);
        for (const p of particles) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.4, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        larderEl.textContent = String(stored | 0);
        hillEl.textContent = String(ants.length);
        haulsEl.textContent = String(hauls);
      }

      function loop(now) {
        t = now;
        if (foodP && cssW > 1) {
          if (running) {
            acc += pace;
            while (acc >= 1) {
              step();
              acc -= 1;
            }
          }
          draw();
        }
        requestAnimationFrame(loop);
      }

      function pointerPos(e) {
        const r = canvas.getBoundingClientRect();
        const src = e.touches ? e.touches[0] : e;
        return { x: src.clientX - r.left, y: src.clientY - r.top };
      }

      function hideHint() { hint.classList.add("hide"); }

      canvas.addEventListener("pointerdown", (e) => {
        pointer = pointerPos(e);
        const stone = e.button === 2 || tool === "stones";
        if (stone) addRock(pointer.x, pointer.y, 16 + Math.random() * 10);
        else addFood(pointer.x, pointer.y, 90, Math.random() < 0.45 ? 0 : 1);
        hideHint();
        e.preventDefault();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (pointer == null) return;
        const p = pointerPos(e);
        if (dist(p.x, p.y, pointer.x, pointer.y) > 10) {
          const stone = e.buttons === 2 || tool === "stones";
          if (stone) addRock(p.x, p.y, 14 + Math.random() * 8);
          else addFood(p.x, p.y, 14, Math.random() < 0.45 ? 0 : 1);
          pointer = p;
        }
      });
      window.addEventListener("pointerup", () => { pointer = null; });
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      function syncTools() {
        btnSeeds.setAttribute("aria-pressed", String(tool === "seeds"));
        btnStones.setAttribute("aria-pressed", String(tool === "stones"));
        canvas.style.cursor = tool === "stones" ? "cell" : "crosshair";
      }
      function setTool(next) { tool = next; syncTools(); }
      function togglePause() {
        running = !running;
        btnPause.textContent = running ? "Pause" : "Resume";
        pausedEl.classList.toggle("on", !running);
      }

      btnSeeds.addEventListener("click", () => setTool("seeds"));
      btnStones.addEventListener("click", () => setTool("stones"));
      btnPause.addEventListener("click", togglePause);
      btnScatter.addEventListener("click", () => {
        for (let i = 0; i < 7; i++) {
          addFood(40 + Math.random() * (cssW - 80), 40 + Math.random() * (cssH - 80), 70);
        }
        hideHint();
      });
      btnReset.addEventListener("click", resetWorld);
      paceEl.addEventListener("input", () => { pace = parseFloat(paceEl.value); });

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") { e.preventDefault(); togglePause(); }
        else if (e.key === "1") setTool("seeds");
        else if (e.key === "2") setTool("stones");
        else if (e.key === "r" || e.key === "R") resetWorld();
      });

      let first = true, oldW = 0, oldH = 0;
      const ro = new ResizeObserver(() => {
        oldW = cssW; oldH = cssH;
        layout();
        if (first) { resetWorld(); first = false; return; }
        if (oldW > 10 && oldH > 10) scaleWorld(cssW / oldW, cssH / oldH);
      });
      ro.observe(stage);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
