<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05060f">
  <meta name="description" content="Last Light, a one-minute fireworks show over a quiet harbor.">
  <title>Last Light — Harbor Fireworks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='2.4' fill='%23e8c888'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #05060f;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
    }
    #view {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .titles {
      position: fixed;
      z-index: 2;
      left: max(22px, env(safe-area-inset-left));
      top: max(18px, env(safe-area-inset-top));
      max-width: min(28rem, calc(100% - 36px));
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
      transition: opacity 1.8s ease;
    }
    .titles.settled { opacity: 0.82; }
    .eyebrow {
      margin: 0 0 0.35rem;
      font-family: "Segoe UI", "Avenir Next", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(240, 214, 170, 0.8);
    }
    h1 {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 4.6vw, 3.7rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      color: #f6f0e6;
    }
    h1::after {
      content: "";
      display: block;
      width: 2.75rem;
      height: 1px;
      margin-top: 0.75rem;
      background: rgba(232, 190, 122, 0.92);
    }
    .lede, .hint {
      margin: 0.85rem 0 0;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 1.02rem;
      line-height: 1.45;
      color: rgba(246, 240, 230, 0.8);
    }
    .hint {
      margin-top: 0.35rem;
      color: rgba(246, 240, 230, 0.58);
      font-size: 0.95rem;
    }
    .transient {
      overflow: hidden;
      max-height: 8.5rem;
      transition: opacity 1.8s ease, max-height 1.5s ease, margin 1.5s ease;
    }
    .titles.settled .transient {
      opacity: 0;
      max-height: 0;
      margin-top: 0;
    }
    .controls {
      position: fixed;
      z-index: 3;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      max-width: min(34rem, calc(100% - 24px));
    }
    .safety {
      margin: 0 6px 0 0;
      font-family: "Segoe UI", "Avenir Next", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(244, 239, 228, 0.62);
    }
    button {
      font-family: "Segoe UI", "Avenir Next", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f4efe4;
      background: rgba(8, 10, 18, 0.74);
      border: 1px solid rgba(244, 239, 228, 0.34);
      border-radius: 999px;
      padding: 0.65rem 0.95rem;
      min-height: 44px;
      cursor: pointer;
    }
    button:hover { background: rgba(244, 239, 228, 0.14); }
    button:active { transform: translateY(1px); }
    button:focus-visible {
      outline: 2px solid #f0d7a2;
      outline-offset: 3px;
    }
    .vh {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-height: 540px) {
      .transient { display: none; }
      h1 { font-size: 1.8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .titles, .transient, button { transition: none; }
      button:active { transform: none; }
    }
    @media (prefers-contrast: more) {
      button { border-color: #fff; background: #000; }
      h1, .eyebrow, .safety { color: #fff; }
    }
  </style>
</head>
<body>

    <p class="hint transient" id="hint">Click the sky to send your own shell.</p>
  </header>

    <p class="safety">Flashing lights</p>
    <button type="button" id="pause" aria-pressed="false" title="Pause (Space)">Pause</button>
    <button type="button" id="replay" title="Replay from the first shell (R)">Replay</button>
    <button type="button" id="sound" aria-pressed="false" title="Toggle sound (M)">Play sound</button>
  </div>
  <p id="help" class="vh">Activate the sky to launch a shell. Pause, Replay, and Play sound are buttons. Space pauses, M toggles sound, and R replays.</p>

    ];
    const QUIET = [
      { t: 1.0, bell: true },
      { t: 1.5, x: 0.52, y: 0.34, p: 'peony', c: 'ivory', s: 0.75 },
      { t: 12, x: 0.36, y: 0.3, p: 'ring', c: 'gold', s: 0.72 },
      { t: 23, x: 0.66, y: 0.32, p: 'peony', c: 'violet', s: 0.72 },
      { t: 34, x: 0.5, y: 0.3, p: 'peony', c: 'rose', s: 0.78 },
      { t: 45, x: 0.42, y: 0.32, p: 'saturn', c: 'amber', s: 0.7 },
      { t: 56, x: 0.58, y: 0.3, p: 'ring', c: 'ivory', s: 0.7 },
      { t: 66, x: 0.5, y: 0.33, p: 'peony', c: 'ivory', s: 0.66 },
      { t: 67.2, say: 'The quiet show closes on one shell.' }
    ];
    const USER_FULL = [
      ['peony', 'gold'],
      ['chrys', 'violet'],
      ['ring', 'ice'],
      ['willow', 'marigold'],
      ['palm', 'coral'],
      ['saturn', 'amber'],
      ['crackle', 'rose'],
      ['crossette', 'teal'],
      ['heart', 'rose'],
      ['kamuro', 'gold']
    ];
    const USER_QUIET = [
      ['peony', 'gold'],
      ['ring', 'ivory'],
      ['peony', 'rose'],
      ['saturn', 'amber']
    ];

    const view = document.getElementById('view');
    const titles = document.getElementById('titles');
    const lede = document.getElementById('lede');
    const hint = document.getElementById('hint');
    const pauseBtn = document.getElementById('pause');
    const replayBtn = document.getElementById('replay');
    const soundBtn = document.getElementById('sound');
    const statusEl = document.getElementById('status');
    const viewCtx = view.getContext('2d', { alpha: false });
    const skyCanvas = document.createElement('canvas');
    const skyCtx = skyCanvas.getContext('2d', { alpha: false });
    const shoreCanvas = document.createElement('canvas');
    const shoreCtx = shoreCanvas.getContext('2d', { alpha: true });
    const fx = document.createElement('canvas');
    const fxCtx = fx.getContext('2d', { alpha: true });

    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    let reduce = motionQuery.matches;
    let modeLatch = reduce;
    let width = 1;
    let height = 1;
    let dpr = 1;
    let horizon = 1;
    let grav = 400;
    let moonX = 0;
    let moonY = 0;
    let moonR = 20;
    let vignette = null;
    let wall = 0;
    let breeze = 0;
    let load = 1;
    let showT = 0;
    let cueIndex = 0;
    let paused = false;
    let last = 0;
    let lastPointer = 0;
    let userN = 0;
    let recentBooms = 0;
    let tickGate = 0;
    let skyFlash = 0;
    let skyTint = '255, 214, 170';
    let soundOn = false;
    let audioCtx = null;
    let master = null;
    let noiseBuf = null;
    let resizeTimer = 0;

    const shells = [];
    const ghosts = [];
    const flashes = [];
    const P = [];
    const pool = [];
    const stars = [];
    const barges = [
      { x: 0.22, flash: 0 },
      { x: 0.5, flash: 0 },
      { x: 0.79, flash: 0 }
    ];
    let flickers = [];
    let lamps = [];
    const inkCache = new Map();

    function rand(a, b) { return a + Math.random() * (b - a); }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function makeRng(seed) {
      let s = seed >>> 0;
      return function () {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function ink(hue, sat, lit, alpha) {
      let H = hue | 0;
      H = ((H % 360) + 360) % 360;
      const S = Math.max(0, Math.min(100, sat | 0));
      const L = Math.max(0, Math.min(100, lit | 0));
      const A = Math.max(0, Math.min(31, (alpha * 31 + 0.5) | 0));
      const key = (H << 21) | (S << 14) | (L << 7) | A;
      const cached = inkCache.get(key);
      if (cached) return cached;
      const value = 'hsla(' + H + ',' + S + '%,' + L + '%,' + (A / 31).toFixed(3) + ')';
      if (inkCache.size > 8000) inkCache.clear();
      inkCache.set(key, value);
      return value;
    }
    function activeScore() { return reduce ? QUIET : FULL; }
    function activeEnd() { return reduce ? 74 : 71; }
    function density() {
      return Math.max(0.42, Math.min(1.12, Math.sqrt((width * height) / (1280 * 720))));
    }
    function countOf(base) {
      const motion = reduce ? 0.55 : 1;
      const pressure = load > 1.45 ? 0.72 : 1;
      return Math.max(7, Math.round(base * density() * motion * pressure));
    }
    function hardCap() {
      return Math.round((reduce ? 1400 : 3400) * density() / Math.min(load, 2));
    }
    function pistilName(name) {
      if (name === 'gold' || name === 'marigold' || name === 'amber' || name === 'ivory') return 'ivory';
      return 'gold';
    }

    function take() {
      const p = pool.pop();
      if (p) {
        p.moteRate = 0;
        p.crackleAt = 0;
        p.splitAt = 0;
        p.age = 0;
        p.phase = 0;
        p.tw = 0;
        p.sway = 1;
        p.glow = true;
        p.kind = 'spark';
        p.alpha = 1;
        p.streak = 6;
        return p;
      }
      return {
        moteRate: 0, crackleAt: 0, splitAt: 0, age: 0, phase: 0, tw: 0,
        sway: 1, glow: true, kind: 'spark', alpha: 1, streak: 6
      };
    }
    function spawn(fields) {
      const cap = hardCap();
      if (P.length >= cap) {
        if (fields.kind === 'mote') return;
        let dumped = false;
        for (let i = 0; i < P.length; i++) {
          if (P[i].kind === 'mote') {
            pool.push(P[i]);
            P.splice(i, 1);
            dumped = true;
            break;
          }
        }
        if (!dumped) return;
      }
      const p = take();
      Object.assign(p, fields);
      P.push(p);
    }

    function fitBitmap(canvas) {
      canvas.width = Math.max(1, Math.round(width * dpr));
      canvas.height = Math.max(1, Math.round(height * dpr));
    }
    function clearFx() {
      fxCtx.setTransform(1, 0, 0, 1, 0, 0);
      fxCtx.clearRect(0, 0, fx.width, fx.height);
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fxCtx.globalCompositeOperation = 'lighter';
      fxCtx.lineCap = 'round';
      fxCtx.lineJoin = 'round';
    }

    function buildStars() {
      const rng = makeRng(11);
      stars.length = 0;
      const count = Math.round(Math.min(210, 80 + (width * height) / 15000));
      let crosses = 0;
      for (let i = 0; i < count; i++) {
        const x = rng() * width;
        const y = rng() * horizon * 0.9;
        const dx = x - moonX;
        const dy = y - moonY;
        if (dx * dx + dy * dy < (moonR * 3.4) * (moonR * 3.4)) continue;
        const bright = rng() > 0.93;
        const cross = bright && crosses < 2 && rng() > 0.35;
        if (cross) crosses += 1;
        stars.push({
          x: x,
          y: y,
          r: bright ? 1.55 : 0.55 + rng() * 0.75,
          base: bright ? 0.9 : 0.22 + rng() * 0.45,
          phase: rng() * TAU,
          sp: 0.35 + rng() * 1.5,
          warm: rng() > 0.84,
          cross: cross
        });
      }
    }

    function paintSky() {
      const ctx = skyCtx;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#05060f');
      sky.addColorStop(0.42, '#0b1222');
      sky.addColorStop(0.78, '#17182c');
      sky.addColorStop(1, '#2a1b22');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, horizon);

      ctx.save();
      ctx.translate(width * 0.64, horizon * 0.4);
      ctx.rotate(-0.55);
      const band = ctx.createRadialGradient(0, 0, 10, 0, 0, width * 0.48);
      band.addColorStop(0, 'rgba(198, 206, 255, 0.09)');
      band.addColorStop(1, 'rgba(198, 206, 255, 0)');
      ctx.fillStyle = band;
      ctx.fillRect(-width, -height, width * 2, height * 2);
      ctx.restore();

      const haze = ctx.createLinearGradient(0, horizon - height * 0.24, 0, horizon);
      haze.addColorStop(0, 'rgba(70, 36, 32, 0)');
      haze.addColorStop(1, 'rgba(96, 48, 36, 0.5)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon - height * 0.24, width, height * 0.24);

      const glow = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, moonR * 4.4);
      glow.addColorStop(0, 'rgba(244, 232, 206, 0.28)');
      glow.addColorStop(1, 'rgba(244, 232, 206, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR * 4.4, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#f3ead7';
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, TAU);
      ctx.arc(moonX + moonR * 0.46, moonY - moonR * 0.08, moonR * 0.84, 0, TAU, true);
      ctx.fill('evenodd');

      const water = ctx.createLinearGradient(0, horizon, 0, height);
      water.addColorStop(0, '#1a2433');
      water.addColorStop(0.2, '#101826');
      water.addColorStop(1, '#07090f');
      ctx.fillStyle = water;
      ctx.fillRect(0, horizon, width, height - horizon);
      ctx.fillStyle = 'rgba(255, 214, 180, 0.2)';
      ctx.fillRect(0, horizon, width, 1);
    }

    function rectBuilding(ctx, rng, x, y, bw, bh) {
      const shade = 9 + ((rng() * 7) | 0);
      ctx.fillStyle = 'rgb(' + shade + ',' + (shade + 1) + ',' + (shade + 7) + ')';
      ctx.fillRect(x, y, bw, bh);
      ctx.fillStyle = '#161b27';
      ctx.fillRect(x + bw - Math.max(2, bw * 0.08), y, Math.max(2, bw * 0.08), bh);
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      ctx.fillRect(x, y, bw, 1);
    }
    function windows(ctx, rng, x, top, bw, bh) {
      if (bh < 28 || bw < 12) return;
      const gap = Math.max(6, Math.min(11, bw * 0.22));
      for (let yy = top + 5; yy < top + bh - 5; yy += gap) {
        for (let xx = x + 3; xx < x + bw - 5; xx += gap) {
          const roll = rng();
          if (roll < 0.64) continue;
          const cool = rng() > 0.82;
          if (roll > 0.92) {
            flickers.push({
              x: xx, y: yy, w: 2, h: 2, cool: cool,
              phase: rng() * TAU, sp: 0.5 + rng() * 2.4
            });
          } else {
            ctx.fillStyle = cool ? 'rgba(168, 204, 228, 0.72)' : 'rgba(255, 188, 122, 0.8)';
            ctx.fillRect(xx, yy, 2, 2);
          }
        }
      }
    }
    function paintShore() {
      const ctx = shoreCtx;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      flickers = [];
      lamps = [];
      const rng = makeRng(9);
      const skyMax = Math.min(158, height * 0.2);
      const sc = Math.max(0.72, Math.min(1.3, width / 1200));

      ctx.fillStyle = '#090c14';
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      ctx.quadraticCurveTo(width * 0.12, horizon - Math.min(42, height * 0.05), width * 0.3, horizon);
      ctx.lineTo(0, horizon);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(width * 0.76, horizon);
      ctx.quadraticCurveTo(width * 0.9, horizon - Math.min(52, height * 0.06), width, horizon);
      ctx.lineTo(width * 0.76, horizon);
      ctx.fill();

      for (let i = 0; i < FORMS.length; i++) {
        const f = FORMS[i];
        const x = f.x * width;
        const bw = Math.max(8, f.w * width);
        const bh = Math.max(16, f.h * skyMax);
        if (f.k === 'block') {
          rectBuilding(ctx, rng, x, horizon - bh, bw, bh);
          windows(ctx, rng, x, horizon - bh, bw, bh);
        } else if (f.k === 'step') {
          rectBuilding(ctx, rng, x, horizon - bh * 0.62, bw, bh * 0.62);
          rectBuilding(ctx, rng, x, horizon - bh, bw * 0.46, bh);
          windows(ctx, rng, x, horizon - bh * 0.62, bw, bh * 0.62);
          windows(ctx, rng, x, horizon - bh, bw * 0.46, bh * 0.45);
        } else if (f.k === 'spire') {
          const body = bh * 0.7;
          rectBuilding(ctx, rng, x, horizon - body, bw, body);
          ctx.fillStyle = '#0c1018';
          ctx.beginPath();
          ctx.moveTo(x - 1, horizon - body);
          ctx.lineTo(x + bw * 0.5, horizon - bh);
          ctx.lineTo(x + bw + 1, horizon - body);
          ctx.fill();
          windows(ctx, rng, x, horizon - body, bw, body);
        } else if (f.k === 'tower') {
          rectBuilding(ctx, rng, x, horizon - bh, bw, bh);
          ctx.fillStyle = '#121722';
          ctx.fillRect(x + bw * 0.45, horizon - bh - bh * 0.14, 1.4, bh * 0.14);
          windows(ctx, rng, x, horizon - bh, bw, bh);
        } else if (f.k === 'wharf') {
          const deck = bh * 0.62;
          rectBuilding(ctx, rng, x, horizon - deck, bw, deck * 0.7);
          ctx.fillStyle = '#121722';
          const piles = Math.max(3, (bw / 16) | 0);
          for (let p = 0; p < piles; p++) {
            const px = x + 3 + p * ((bw - 6) / piles);
            ctx.fillRect(px, horizon - deck * 0.35, 2, deck * 0.35);
          }
          windows(ctx, rng, x, horizon - deck, bw, deck * 0.7);
        } else if (f.k === 'crane') {
          ctx.strokeStyle = '#1a2030';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, horizon);
          ctx.lineTo(x, horizon - bh);
          ctx.lineTo(x + bw * 4.2, horizon - bh);
          ctx.moveTo(x, horizon - bh);
          ctx.lineTo(x - bw * 1.4, horizon - bh * 0.68);
          ctx.stroke();
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + bw * 2.6, horizon - bh);
          ctx.lineTo(x + bw * 2.6, horizon - bh * 0.42);
          ctx.stroke();
        } else if (f.k === 'light') {
          ctx.fillStyle = '#121722';
          ctx.fillRect(x, horizon - bh * 0.78, bw, bh * 0.78);
          ctx.fillStyle = '#1c2433';
          for (let s = 0; s < 4; s++) ctx.fillRect(x, horizon - bh * 0.78 + s * (bh * 0.16), bw, bh * 0.05);
          ctx.fillStyle = '#c9a36a';
          ctx.fillRect(x - bw * 0.2, horizon - bh * 0.78 - 8, bw * 1.4, 8);
          ctx.beginPath();
          ctx.moveTo(x - bw * 0.35, horizon - bh * 0.78 - 8);
          ctx.lineTo(x + bw * 0.5, horizon - bh);
          ctx.lineTo(x + bw * 1.35, horizon - bh * 0.78 - 8);
          ctx.fill();
          lamps.push({
            x: x + bw * 0.5,
            y: horizon - bh * 0.78 - 4,
            r: 3.1,
            sp: 1.25,
            phase: 0.4
          });
        }
      }

      const bx = width * 0.455;
      const bw = width * 0.09;
      ctx.fillStyle = '#0c111a';
      ctx.fillRect(bx, horizon - 8, bw, 8);
      ctx.fillRect(bx + 8, horizon, 2, 12);
      ctx.fillRect(bx + bw - 10, horizon, 2, 12);
      lamps.push({ x: bx + bw * 0.5, y: horizon - 12, r: 2.1, sp: 0.7, phase: 1.1 });

      ctx.fillStyle = '#141820';
      ctx.fillRect(width * 0.605, horizon + height * 0.05, 2, Math.max(18, height * 0.045));

      for (let i = 0; i < barges.length; i++) {
        const x = barges[i].x * width;
        const y = horizon + 8 * sc;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(x, y + 16 * sc, 32 * sc, 4.5 * sc, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#10141e';
        ctx.beginPath();
        ctx.moveTo(x - 36 * sc, y);
        ctx.lineTo(x + 36 * sc, y);
        ctx.lineTo(x + 26 * sc, y + 12 * sc);
        ctx.lineTo(x - 26 * sc, y + 12 * sc);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#161c28';
        ctx.fillRect(x - 9 * sc, y - 11 * sc, 18 * sc, 11 * sc);
        ctx.fillRect(x + 16 * sc, y - 24 * sc, 1.5, 24 * sc);
        ctx.fillStyle = '#ffbf7a';
        ctx.fillRect(x - 4 * sc, y - 7 * sc, 2.2 * sc, 2.2 * sc);
      }
    }

    function resize() {

      dpr = Math.min(window.devicePixelRatio || 1, width < 800 ? 1.25 : 1.5);

    function setupAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      master = audioCtx.createGain();
      master.gain.value = 0.34;
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 22;
      comp.ratio.value = 6;
      comp.attack.value = 0.004;
      comp.release.value = 0.28;
      master.connect(comp);
      comp.connect(audioCtx.destination);
      const len = Math.floor(audioCtx.sampleRate * 3);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 380;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.018;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      src.start();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function canHear() {
      return !!(soundOn && audioCtx && master && !paused);
    }
    function tone(freq, dur, gain) {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(Math.max(36, freq), t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.5), t + dur);
      amp.gain.setValueAtTime(Math.max(0.0001, gain), t);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(amp);
      amp.connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.03);
    }
    function noiseBurst(gain, dur, freq) {
      const t = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = freq;
      filter.Q.value = 0.62;
      const amp = audioCtx.createGain();
      amp.gain.setValueAtTime(Math.max(0.0001, gain), t);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter);
      filter.connect(amp);
      amp.connect(master);
      src.start(t, Math.random() * 0.4, dur);
      src.stop(t + dur + 0.02);
    }
    function harborBell() {
      if (!canHear()) return;
      const notes = [392, 587.33];
      for (let i = 0; i < notes.length; i++) {
        const t = audioCtx.currentTime + i * 0.22;
        const osc = audioCtx.createOscillator();
        const amp = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = notes[i];
        amp.gain.setValueAtTime(0.0001, t);
        amp.gain.exponentialRampToValueAtTime(0.065, t + 0.02);
        amp.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
        osc.connect(amp);
        amp.connect(master);
        osc.start(t);
        osc.stop(t + 2.7);
      }
    }
    function playLaunch(scale) {
      if (!canHear()) return;
      const t = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.7;
      filter.frequency.setValueAtTime(180, t);
      filter.frequency.exponentialRampToValueAtTime(1400, t + 0.28);
      const amp = audioCtx.createGain();
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.exponentialRampToValueAtTime(0.07 * scale, t + 0.03);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      src.connect(filter);
      filter.connect(amp);
      amp.connect(master);
      src.start(t, Math.random() * 0.2, 0.34);
      src.stop(t + 0.36);
      tone(110, 0.2, 0.035 * scale);
    }
    function playBurst(scale, pattern) {
      if (!canHear()) return;
      const damp = 1 / (1 + recentBooms * 0.65);
      recentBooms += 1;
      const deep = pattern === 'kamuro' || pattern === 'willow';
      const freq = pattern === 'heart' ? rand(90, 130) : deep ? rand(48, 68) : rand(76, 128);
      const dur = (pattern === 'heart' ? 0.7 : deep ? 0.95 : 0.4) * (0.8 + scale * 0.25);
      const gain = (pattern === 'heart' ? 0.11 : deep ? 0.24 : 0.18) * Math.min(1.25, scale) * damp;
      tone(freq, dur, gain);
      noiseBurst(deep ? 0.06 * damp : 0.1 * damp, deep ? 0.32 : 0.13, deep ? 800 : 2100);
    }

    function nearestBarge(xFrac) {
      let best = barges[0];
      let bestD = 99;
      for (let i = 0; i < barges.length; i++) {
        const d = Math.abs(barges[i].x - xFrac);
        if (d < bestD) {
          bestD = d;
          best = barges[i];
        }
      }
      return best;
    }

      const rise = Math.max(64, originY - targetY);
      const flight = Math.sqrt(2 * rise / grav);
      const speed = grav * flight;
      shells.push({
        x: originX,
        y: originY,
        px: originX,
        py: originY,
        vx: (targetX - originX) / flight,
        vy: -speed,
        pattern: cue.p,
        color: cue.c,

      }
    }
    function emit(x, y, pattern, colorName, scale, flashAmt) {
      const col = COLORS[colorName] || COLORS.gold;
      let flashPower = flashAmt || 0;
      if (pattern === 'heart') flashPower = Math.max(flashPower, 0.55);
      else if (pattern === 'kamuro') flashPower = Math.max(flashPower, 0.8);
      else if (pattern === 'chrys' || pattern === 'willow') flashPower = Math.max(flashPower, 0.26);
      else flashPower = Math.max(flashPower, 0.16);
      skyFlash = Math.max(skyFlash, flashPower);
      skyTint = pattern === 'heart' ? '255, 150, 176' : '255, 214, 170';
      flashes.push({
        x: x, y: y,
        r: (pattern === 'kamuro' ? 64 : pattern === 'heart' ? 42 : 26) * Math.max(0.7, scale),
        life: 0.2, max: 0.2, h: col[0], s: col[1]
      });
      playBurst(scale, pattern);
      if (pattern === 'heart') {
        burstHeart(x, y, scale);
        return;
      }
      if (pattern === 'ring') {
        burstRing(x, y, col, scale);
        return;
      }
      if (pattern === 'saturn') {
        burstRing(x, y, col, scale * 1.04);
        burstRadial(x, y, 'peony', 'ivory', scale * 0.55);
        return;
      }
      burstRadial(x, y, pattern, colorName, scale);
    }
    function detonate(shell) {
      if (shell.pattern === 'double') {
        emit(shell.x, shell.y, 'peony', shell.color, shell.scale * 0.75, (shell.flash || 0.2) * 0.6);
        ghosts.push({
          x: shell.x, y: shell.y, vx: rand(-16, 16), vy: 28, life: 0.34,
          pattern: 'chrys', color: shell.color, scale: shell.scale * 1.08,
          flash: Math.max(shell.flash || 0, 0.45), spark: 0
        });
        return;
      }
      emit(shell.x, shell.y, shell.pattern, shell.color, shell.scale, shell.flash || 0);
    }
    function popCrackle(p) {
      flashes.push({ x: p.x, y: p.y, r: 10, life: 0.07, max: 0.07, h: 45, s: 30 });
      playTick();
      for (let k = 0; k < 6; k++) {
        const ang = Math.random() * TAU;
        const sp = rand(40, 130) * (height / 800);
        const life = rand(0.18, 0.36);
        spawn({
          x: p.x, y: p.y, px: p.x, py: p.y,
          vx: Math.cos(ang) * sp + p.vx * 0.2,
          vy: Math.sin(ang) * sp + p.vy * 0.2,
          life: life, maxLife: life, age: 0,
          drag: 2.4, g: grav * 0.7, size: 0.75, streak: 3,
          hue: rand(30, 50), sat: 40, lit: 92, alpha: 1,
          glow: true, kind: 'spark', moteRate: 0, crackleAt: 0, splitAt: 0, sway: 0.5, tw: 0, phase: 0
        });
      }
    }
    function splitSpark(p) {
      for (let k = 0; k < 6; k++) {
        const ang = (k / 6) * TAU + rand(-0.12, 0.12);
        const sp = height * 0.042;
        const life = rand(0.5, 0.7);
        spawn({
          x: p.x, y: p.y, px: p.x, py: p.y,
          vx: p.vx * 0.3 + Math.cos(ang) * sp,
          vy: p.vy * 0.3 + Math.sin(ang) * sp,
          life: life, maxLife: life, age: 0,
          drag: 1.05, g: grav * 0.95, size: 1.1, streak: 7,
          hue: p.hue + rand(-8, 8), sat: p.sat, lit: p.lit, alpha: 1,
          glow: true, kind: 'spark', moteRate: 2, crackleAt: 0, splitAt: 0, sway: 1, tw: 0, phase: 0
        });
      }
    }

    function fireCue(cue) {
      if (cue.say) statusEl.textContent = cue.say;
      if (cue.bell) harborBell();
      if (cue.shoot && !reduce) {
        spawnShooter(cue.shoot[0] * width, cue.shoot[1] * horizon, cue.shoot[2] * width, cue.shoot[3] * horizon);
        playStreak();
      }
      if (cue.p) launchShell(cue);
    }
    function consumeCues() {
      if (modeLatch !== reduce) {
        modeLatch = reduce;
        cueIndex = 0;
        const switched = activeScore();
        while (cueIndex < switched.length && switched[cueIndex].t <= showT) cueIndex += 1;
        return;
      }
      const score = activeScore();
      while (cueIndex < score.length && score[cueIndex].t <= showT) {
        fireCue(score[cueIndex]);
        cueIndex += 1;
      }
      if (showT >= activeEnd()) {
        showT = 0;
        cueIndex = 0;
        statusEl.textContent = 'The show begins again.';
      }
    }

    function stepShells(dt) {
      for (let i = shells.length - 1; i >= 0; i--) {
        const s = shells[i];
        s.px = s.x;
        s.py = s.y;
        s.vy += grav * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.spark -= dt;
        if (s.spark <= 0) {
          s.spark = 0.022;
          spawnTrail(s);
        }
        if (s.vy >= 0 || s.y <= 18) {
          detonate(s);
          shells.splice(i, 1);
          continue;
        }
        if (s.x < -120 || s.x > width + 120) shells.splice(i, 1);
      }
    }
    function stepGhosts(dt) {
      for (let i = ghosts.length - 1; i >= 0; i--) {
        const g = ghosts[i];
        g.life -= dt;
        g.vy += grav * dt;
        g.x += g.vx * dt;
        g.y += g.vy * dt;
        g.spark -= dt;
        if (g.spark <= 0) {
          g.spark = 0.03;
          const life = 0.24;
          spawn({
            x: g.x, y: g.y, px: g.x, py: g.y,
            vx: rand(-10, 10), vy: rand(0, 20),
            life: life, maxLife: life, age: 0,
            drag: 1.5, g: grav * 0.6, size: 1.25, streak: 5,
            hue: 42, sat: 70, lit: 82, alpha: 1,
            glow: true, kind: 'spark', moteRate: 0, crackleAt: 0, splitAt: 0, sway: 0.4, tw: 0, phase: 0
          });
        }
        if (g.life <= 0) {
          emit(g.x, g.y, g.pattern, g.color, g.scale, g.flash || 0);
          ghosts.splice(i, 1);
        }
      }
    }
    function stepParticle(p, dt) {
      p.life -= dt;
      if (p.life <= 0) return false;
      p.age += dt;
      p.px = p.x;
      p.py = p.y;
      p.vy += p.g * dt;
      p.vx += breeze * p.sway * dt;
      const damp = Math.exp(-p.drag * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.moteRate > 0 && p.kind !== 'mote') {
        let chance = p.moteRate * dt;
        if (load > 1.3) chance /= load;
        if (P.length > hardCap() * 0.8) chance *= 0.2;
        if (Math.random() < chance) spawnMote(p);
      }
      if (p.crackleAt > 0 && p.age >= p.crackleAt) {
        p.crackleAt = 0;
        popCrackle(p);
      }
      if (p.splitAt > 0 && p.age >= p.splitAt) {
        splitSpark(p);
        return false;
      }
      return p.y < height + 50 && p.x > -90 && p.x < width + 90;
    }
    function stepParticles(dt) {
      breeze = Math.sin(wall * 0.17) * 14 + Math.sin(wall * 0.05) * 6;
      for (let i = P.length - 1; i >= 0; i--) {
        if (!stepParticle(P[i], dt)) {
          pool.push(P[i]);
          P.splice(i, 1);
        }
      }
    }
    function stepFlashes(dt) {
      for (let i = flashes.length - 1; i >= 0; i--) {
        flashes[i].life -= dt;
        if (flashes[i].life <= 0) flashes.splice(i, 1);
      }
    }
    function fadeFx(dt) {
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fxCtx.globalCompositeOperation = 'destination-out';
      fxCtx.globalAlpha = 1;
      const k = reduce ? 3.5 : 2.35;
      fxCtx.fillStyle = 'rgba(0,0,0,' + Math.min(0.4, k * dt) + ')';
      fxCtx.fillRect(0, 0, width, height);
      fxCtx.globalCompositeOperation = 'lighter';
      fxCtx.lineCap = 'round';
      fxCtx.lineJoin = 'round';
    }
    function drawParticles() {
      const skipHalo = load > 1.8;
      for (let pass = 0; pass < 2; pass++) {
        if (pass === 0 && skipHalo) continue;
        for (let i = 0; i < P.length; i++) {
          const p = P[i];
          if (pass === 0 && !p.glow) continue;
          const lifeT = p.life / p.maxLife;
          if (lifeT <= 0) continue;
          let alpha = Math.pow(lifeT, 0.52) * p.alpha;
          if (p.tw) alpha *= 0.55 + 0.45 * Math.sin(wall * p.tw + p.phase);
          if (p.y > horizon - 22) alpha *= Math.max(0, (horizon - p.y) / 22);
          if (alpha < 0.02) continue;
          const age = 1 - lifeT;
          const hot = lifeT * lifeT;
          let hue = p.hue;
          if (hue < 90) hue -= age * 12;
          const lit = Math.max(24, Math.min(98, p.lit * (0.6 + 0.4 * lifeT) + hot * 34));
          const sat = Math.max(0, p.sat * (1 - hot * 0.8));
          const sp = Math.hypot(p.vx, p.vy);
          if (p.kind === 'mote' || sp < 10) {
            if (pass === 0) continue;
            fxCtx.fillStyle = ink(hue, sat, lit, alpha);
            fxCtx.beginPath();
            fxCtx.arc(p.x, p.y, Math.max(0.4, p.size * (0.4 + lifeT * 0.55)), 0, TAU);
            fxCtx.fill();
            continue;
          }
          const len = Math.min(p.streak, Math.max(1.4, sp * 0.02));
          const inv = 1 / sp;
          fxCtx.beginPath();
          fxCtx.moveTo(p.x - p.vx * inv * len, p.y - p.vy * inv * len);
          fxCtx.lineTo(p.x, p.y);
          if (pass === 0) {
            fxCtx.lineWidth = p.size * (3.1 + hot);
            fxCtx.strokeStyle = ink(hue, sat, lit, alpha * 0.16);
          } else {
            fxCtx.lineWidth = Math.max(0.6, p.size * (0.42 + lifeT * 0.55));
            fxCtx.strokeStyle = ink(hue, sat * 0.45, Math.min(98, lit + 12), alpha);
          }
          fxCtx.stroke();
        }
      }
    }
    function drawHeads() {
      for (let i = 0; i < shells.length; i++) {
        const s = shells[i];
        fxCtx.strokeStyle = 'rgba(255, 244, 220, 0.92)';
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.moveTo(s.px, s.py);
        fxCtx.lineTo(s.x, s.y);
        fxCtx.stroke();
        fxCtx.fillStyle = 'rgba(255, 252, 245, 1)';
        fxCtx.beginPath();
        fxCtx.arc(s.x, s.y, 1.7, 0, TAU);
        fxCtx.fill();
      }
    }
    function drawFlashes() {
      for (let i = 0; i < flashes.length; i++) {
        const f = flashes[i];
        const a = Math.max(0, f.life / f.max);
        const rad = f.r * (1.2 - a * 0.35);
        const g = fxCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
        g.addColorStop(0, ink(f.h, 35, 96, a * 0.95));
        g.addColorStop(0.38, ink(f.h, f.s, 68, a * 0.32));
        g.addColorStop(1, ink(f.h, f.s, 60, 0));
        fxCtx.fillStyle = g;
        fxCtx.beginPath();
        fxCtx.arc(f.x, f.y, rad, 0, TAU);
        fxCtx.fill();
      }
    }
    function drawStars(ctx) {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const tw = s.base * (0.7 + 0.3 * Math.sin(wall * s.sp + s.phase));
        ctx.fillStyle = s.warm ? 'rgba(255, 228, 190,' + tw + ')' : 'rgba(236, 242, 255,' + tw + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, TAU);
        ctx.fill();
        if (!s.cross) continue;
        ctx.strokeStyle = 'rgba(236, 242, 255,' + (tw * 0.45) + ')';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(s.x - 5, s.y);
        ctx.lineTo(s.x + 5, s.y);
        ctx.moveTo(s.x, s.y - 5);
        ctx.lineTo(s.x, s.y + 5);
        ctx.stroke();
      }
    }
    function drawReflection(ctx) {
      const waterH = height - horizon;
      const strips = 18;
      const span = Math.min(horizon * 0.92, waterH);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, horizon, width, waterH);
      ctx.clip();
      for (let i = 0; i < strips; i++) {
        const srcH = span / strips;
        const srcY = horizon - (i + 1) * srcH;
        if (srcY < 0) break;
        const destH = (waterH * 0.88) / strips;
        const destY = horizon + i * ((waterH * 0.9) / strips);
        const wob = Math.sin(wall * 1.05 + i * 0.68) * (0.6 + i * 0.18);
        ctx.globalAlpha = 0.4 * Math.pow(1 - i / strips, 1.2);
        ctx.drawImage(fx, 0, Math.max(0, srcY * dpr), fx.width, Math.max(1, srcH * dpr), wob, destY, width, destH + 0.6);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(6, 10, 18, 0.25)';
      ctx.fillRect(0, horizon, width, waterH);
    }
    function drawShimmer(ctx) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, horizon, width, height - horizon);
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 4; i++) {
        const y = horizon + 14 + i * ((height - horizon) * 0.12);
        ctx.strokeStyle = 'rgba(190, 210, 230,' + (0.018 + i * 0.006) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const amp = 1.2 + i * 0.35;
        const speed = 0.55 + i * 0.12;
        for (let x = 0; x <= width; x += 10) {
          const yy = y + Math.sin(x * 0.018 + wall * speed + i * 1.3) * amp;
          if (x === 0) ctx.moveTo(x, yy);
          else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    function drawMoonWake(ctx) {
      const reach = Math.min(height - horizon - 16, height * 0.22);
      for (let i = 0; i < 12; i++) {
        const t = i / 12;
        const y = horizon + 12 + t * reach;
        const wob = Math.sin(wall * 1.35 + i * 0.9) * (2 + i * 0.35);
        const ww = (1 - t) * moonR * 0.55 + 1;
        ctx.fillStyle = 'rgba(243, 234, 214,' + ((1 - t) * 0.16) + ')';
        ctx.fillRect(moonX + wob - ww, y, ww * 2, 1.5);
      }
    }
    function drawLive(ctx) {
      const sc = Math.max(0.72, Math.min(1.25, width / 1200));
      for (let i = 0; i < barges.length; i++) {
        const b = barges[i];
        if (b.flash <= 0) continue;
        ctx.fillStyle = 'rgba(255, 226, 186,' + (b.flash * 0.8) + ')';
        ctx.beginPath();
        ctx.arc(b.x * width, horizon + 4 * sc, (4 + 10 * b.flash) * sc, 0, TAU);
        ctx.fill();
      }
      for (let i = 0; i < lamps.length; i++) {
        const lamp = lamps[i];
        const pulse = 0.35 + 0.25 * Math.sin(wall * lamp.sp + lamp.phase);
        ctx.fillStyle = 'rgba(255, 196, 130,' + pulse + ')';
        ctx.beginPath();
        ctx.arc(lamp.x, lamp.y, lamp.r, 0, TAU);
        ctx.fill();
      }
      for (let i = 0; i < flickers.length; i++) {
        const win = flickers[i];
        if (Math.sin(wall * win.sp + win.phase) <= -0.15) continue;
        ctx.fillStyle = win.cool ? 'rgba(176, 210, 232, 0.8)' : 'rgba(255, 196, 140, 0.85)';
        ctx.fillRect(win.x, win.y, win.w, win.h);
      }
      const blink = Math.sin(wall * 2.2) > 0.2;
      ctx.fillStyle = blink ? 'rgba(255, 84, 84, 0.95)' : 'rgba(255, 84, 84, 0.22)';
      ctx.fillRect(width * 0.604, horizon + height * 0.085, 3.2, 3.2);
    }
    function composite() {
      const ctx = viewCtx;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(skyCanvas, 0, 0, width, height);
      drawStars(ctx);
      if (skyFlash > 0.01 && !reduce) {
        ctx.fillStyle = 'rgba(' + skyTint + ',' + (skyFlash * 0.11) + ')';
        ctx.fillRect(0, 0, width, horizon);
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, width, horizon);
      ctx.clip();
      ctx.drawImage(fx, 0, 0, width, height);
      ctx.restore();
      drawReflection(ctx);
      drawShimmer(ctx);
      drawMoonWake(ctx);
      if (vignette) {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);
      }
      ctx.drawImage(shoreCanvas, 0, 0, width, height);
      drawLive(ctx);
    }

    function wipeBursts() {
      for (let i = 0; i < P.length; i++) pool.push(P[i]);
      P.length = 0;
      shells.length = 0;
      ghosts.length = 0;
      flashes.length = 0;
      skyFlash = 0;
      clearFx();
    }
    function syncPause() {
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
    }
    function syncSound() {
      soundBtn.textContent = soundOn ? 'Mute' : 'Play sound';
      soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    }
    function togglePause() {
      paused = !paused;
      if (audioCtx) {
        if (paused) audioCtx.suspend();
        else if (soundOn && audioCtx.state === 'suspended') audioCtx.resume();
      }
      syncPause();
      statusEl.textContent = paused ? 'Paused.' : 'Playing.';
    }
    function toggleSound() {
      try {
        if (!audioCtx) {
          setupAudio();
          soundOn = true;
        } else {
          soundOn = !soundOn;
        }
        master.gain.setTargetAtTime(soundOn ? 0.34 : 0, audioCtx.currentTime, 0.04);
        if (soundOn && !paused && audioCtx.state === 'suspended') audioCtx.resume();
        if (soundOn && !paused) harborBell();
        statusEl.textContent = soundOn ? 'Sound on.' : 'Sound off.';
      } catch (err) {
        soundOn = false;
        statusEl.textContent = 'Sound could not start in this browser.';
      }
      syncSound();
    }
    function replay() {
      if (paused) {
        paused = false;
        if (audioCtx && soundOn && audioCtx.state === 'suspended') audioCtx.resume();
        syncPause();
      }
      wipeBursts();
      showT = 0;
      cueIndex = 0;
      statusEl.textContent = 'The show starts from the first shell.';
      composite();
    }
    function onPointer(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const nowMs = performance.now();
      if (nowMs - lastPointer < 130) return;
      lastPointer = nowMs;
      const rect = view.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const yPx = ((e.clientY - rect.top) / rect.height) * height;
      const yFrac = yPx < horizon ? clamp(yPx / horizon, 0.16, 0.55) : 0.3;
      const list = reduce ? USER_QUIET : USER_FULL;
      const choice = list[userN % list.length];
      userN += 1;
      launchShell({
        x: clamp(x, 0.08, 0.92),
        y: yFrac,
        p: choice[0],
        c: choice[1],
        s: 1,
        user: true,
        flash: 0.22
      });
      if (!titles.classList.contains('settled')) titles.classList.add('settled');
    }

    function frame(now) {
      const raw = last ? (now - last) / 1000 : 0.016;
      last = now;
      const dt = Math.min(0.034, Math.max(0.001, raw));
      wall = now * 0.001;
      if (raw > 0.042) load = Math.min(2.6, load + 0.03);
      else load = Math.max(1, load - 0.012);
      if (!paused) {
        showT += dt;
        recentBooms = Math.max(0, recentBooms - dt * 3.2);
        tickGate = Math.max(0, tickGate - dt * 14);
        skyFlash = Math.max(0, skyFlash - dt * 0.5);
        for (let i = 0; i < barges.length; i++) barges[i].flash = Math.max(0, barges[i].flash - dt * 1.8);
        consumeCues();
        stepShells(dt);
        stepGhosts(dt);
        stepParticles(dt);
        stepFlashes(dt);
        fadeFx(dt);
        drawParticles();
        drawHeads();
        drawFlashes();
        const settleAt = reduce ? 4 : 7.5;
        if (showT > settleAt && !titles.classList.contains('settled')) titles.classList.add('settled');
      }
      composite();
      requestAnimationFrame(frame);
    }

    if (reduce) {
      lede.textContent = 'A quieter harbor night, with a few slow shells and no rapid flashes.';
    }
    if (window.matchMedia('(pointer: coarse)').matches) {
      hint.textContent = 'Tap the sky to send your own shell.';
    }
    motionQuery.addEventListener('change', function (e) {
      reduce = e.matches;
    });
    pauseBtn.addEventListener('click', togglePause);
    replayBtn.addEventListener('click', replay);
    soundBtn.addEventListener('click', toggleSound);
    view.addEventListener('pointerdown', onPointer, { passive: false });
    document.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
      if (e.code === 'Space' && !onButton) {
        e.preventDefault();
        togglePause();
      } else if ((e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        toggleSound();
      } else if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        replay();
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (!audioCtx || !soundOn || paused) return;
      if (document.hidden) audioCtx.suspend();
      else if (audioCtx.state === 'suspended') audioCtx.resume();
    });
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 80);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 80);
      });
    }

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
