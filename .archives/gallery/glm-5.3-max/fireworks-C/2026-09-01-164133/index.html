<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#05070f"/>
<title>Midnight Bloom · a fireworks reverie</title>
<style>
  html,body{height:100%;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;position:fixed;inset:0;overflow:hidden;background:#020409;
    font-family:Georgia,'Times New Roman',serif;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;touch-action:none;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;}
  body.idle{cursor:none;}

  /* ---------- title card ---------- */
  #title{
    position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transform:translateY(6px) scale(.985);
    transition:opacity 2s ease,transform 2.6s ease,filter 2s ease;filter:blur(5px);
  }
  #title.in{opacity:1;transform:none;filter:blur(0);}
  #title.out{opacity:0;transform:scale(1.03);filter:blur(4px);transition:opacity 1.8s ease,transform 2.6s ease,filter 1.8s ease;}
  #title .orn{font-size:12px;letter-spacing:.9em;text-indent:.9em;color:#8fa3d4;}
  #title h1{
    margin:16px 0 12px;font-weight:400;color:#eaeffa;
    font-size:clamp(28px,6vw,62px);line-height:1.08;
    letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;
    text-shadow:0 0 34px rgba(130,165,255,.4),0 0 90px rgba(110,150,255,.22);
  }
  #title .sub{margin:0;font-style:italic;font-size:clamp(13px,1.7vw,17px);color:#a9b9dc;letter-spacing:.3em;text-indent:.3em;}

  /* ---------- act caption ---------- */
  #caption{
    position:absolute;left:26px;bottom:24px;z-index:5;display:flex;align-items:center;gap:12px;
    opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease;pointer-events:none;
  }
  #caption.show{opacity:1;transform:none;}
  #caption .cap-num{
    font-size:11px;letter-spacing:.32em;text-indent:.32em;color:#93a7d8;text-transform:uppercase;
    border:1px solid rgba(147,167,216,.38);padding:5px 7px 4px 11px;border-radius:2px;background:rgba(6,10,22,.35);
  }
  #caption .cap-rule{width:34px;height:1px;background:linear-gradient(90deg,rgba(160,182,235,.65),transparent);}
  #caption .cap-name{font-style:italic;font-size:17px;letter-spacing:.14em;color:#e2eafb;text-shadow:0 1px 12px rgba(0,0,0,.6);}
  #caption .cap-num:empty{display:none;}

  /* ---------- hint ---------- */
  #hint{
    position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:5;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7f8fb4;
    opacity:0;transition:opacity 1.4s ease;pointer-events:none;white-space:nowrap;
  }
  #hint.show{opacity:.9;}
  #hint b{font-weight:400;color:#c6d5f5;}

  /* ---------- controls ---------- */
  #controls{position:absolute;right:22px;bottom:22px;z-index:7;display:flex;gap:10px;transition:opacity .45s ease;}
  body.idle #controls,body.idle #caption,body.idle #hint{opacity:0;}
  #controls button{
    width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;
    border:1px solid rgba(160,182,235,.22);background:rgba(9,15,29,.55);
    color:#c9d8f6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:border-color .25s,background .25s,box-shadow .25s,transform .18s;
  }
  #controls button:hover{border-color:rgba(195,214,255,.6);background:rgba(18,29,54,.78);box-shadow:0 4px 22px rgba(110,150,255,.28);transform:translateY(-2px);}
  #controls button:active{transform:scale(.93);}
  #controls svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .hidden{display:none !important;}

  @media (max-width:680px){
    #caption{left:18px;bottom:86px;}
    #hint{display:none;}
    #controls{right:16px;bottom:18px;}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Fireworks display over a night river"></canvas>

<div id="title" aria-hidden="true">
  <div class="orn">· ✦ ·</div>
  <h1>Midnight Bloom</h1>
  <p class="sub">a fireworks reverie</p>
</div>

<div id="caption" aria-live="polite">
  <span class="cap-num"></span><span class="cap-rule"></span><span class="cap-name"></span>
</div>

<div id="hint">tap the sky to launch · <b>space</b> barrage · <b>f</b> finale · <b>s</b> sound · <b>p</b> pause</div>

<div id="controls">
  <button id="btnPause" aria-label="Pause the show" title="Pause (P)">
    <span class="ic-pause"><svg viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></svg></span>
    <span class="ic-play hidden"><svg viewBox="0 0 24 24"><path d="M8.5 5.5l10 6.5-10 6.5z"/></svg></span>
  </button>
  <button id="btnSound" aria-label="Enable sound" aria-pressed="false" title="Sound (S)">
    <span class="ic-off"><svg viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.2l4.8 3.8V5.7L7.7 9.5H4.5z"/><path d="M16.5 9.7l4.6 4.6M21.1 9.7l-4.6 4.6"/></svg></span>
    <span class="ic-on hidden"><svg viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.2l4.8 3.8V5.7L7.7 9.5H4.5z"/><path d="M16 9.3a4.1 4.1 0 010 5.4M18.6 7a7.4 7.4 0 010 10"/></svg></span>
  </button>
  <button id="btnFinale" aria-label="Start the grand finale" title="Finale (F)">
    <svg viewBox="0 0 24 24"><path d="M12 3.4v3.7M12 16.9v3.7M3.4 12h3.7M16.9 12h3.7M5.9 5.9l2.6 2.6M15.5 15.5l2.6 2.6M18.1 5.9l-2.6 2.6M8.5 15.5l-2.6 2.6"/></svg>
  </button>
</div>

<noscript><p style="position:absolute;inset:0;display:grid;place-items:center;color:#9fb0d8;font-family:Georgia,serif;">This display needs JavaScript.</p></noscript>

<script>
'use strict';
(() => {

/* ============================================================
   helpers
============================================================ */
const TAU = Math.PI * 2;
const rand  = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rgba  = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   DOM & canvases
============================================================ */
const stage = document.getElementById('stage');
const ctx   = stage.getContext('2d');
const sceneC = document.createElement('canvas'); const sctx = sceneC.getContext('2d');
const pC     = document.createElement('canvas'); const pctx = pC.getContext('2d');
const skyC   = document.createElement('canvas'); const skctx = skyC.getContext('2d');
const fgC    = document.createElement('canvas'); const fgx  = fgC.getContext('2d');
const vigC   = document.createElement('canvas'); const vgx  = vigC.getContext('2d');

const titleEl  = document.getElementById('title');
const capEl    = document.getElementById('caption');
const capNum   = capEl.querySelector('.cap-num');
const capName  = capEl.querySelector('.cap-name');
const hintEl   = document.getElementById('hint');
const btnPause = document.getElementById('btnPause');
const btnSound = document.getElementById('btnSound');
const btnFin   = document.getElementById('btnFinale');

/* ============================================================
   palette & glow sprites
============================================================ */
const PALETTE = [
  { n:'gold',    c:[255,205,112] },
  { n:'amber',   c:[255,168,76]  },
  { n:'red',     c:[255,94,80]   },
  { n:'rose',    c:[255,124,186] },
  { n:'magenta', c:[226,96,255]  },
  { n:'violet',  c:[152,112,255] },
  { n:'blue',    c:[98,162,255]  },
  { n:'cyan',    c:[112,240,255] },
  { n:'teal',    c:[94,230,198]  },
  { n:'green',   c:[130,255,140] },
  { n:'lime',    c:[208,255,124] },
  { n:'peach',   c:[255,180,124] },
  { n:'white',   c:[255,246,226] },
];
const GOLD = 0, AMBER = 1, RED = 2, WHITE = 12;

function makeGlow(c){
  const s = 64, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  rg.addColorStop(0.00, 'rgba(255,255,255,0.95)');
  rg.addColorStop(0.18, rgba(c, 0.85));
  rg.addColorStop(0.45, rgba(c, 0.30));
  rg.addColorStop(1.00, rgba(c, 0));
  g.fillStyle = rg;
  g.fillRect(0, 0, s, s);
  return cv;
}
const glow = PALETTE.map(p => makeGlow(p.c));
function drawGlow(c, spr, x, y, r, a){
  c.globalAlpha = a;
  c.drawImage(spr, x - r, y - r, r * 2, r * 2);
}

/* curated color pairings */
const THEMES = [[0,2],[0,12],[5,7],[6,12],[3,0],[8,9],[4,7],[1,12],[2,3],[10,9],[11,0],[7,5],[6,3],[0,7]];
const RICH = ['peony','chrys','willow','ring','crossette','palm','strobe','double','crackle'];

/* ============================================================
   global state
============================================================ */
let W = 0, H = 0, S = 1, SC = 1, hy = 0, waterH = 0;
let qual = 1;
let paused = false;
let tGlobal = 0, hFlash = 0, windNow = 0;
let flyLevel = 0;
const MAXP = 3400;

const particles = [];
const rockets = [];
const pending = [];            // staged launches {d, spec}
let shooting = null, shootT = rand(6, 14);
const fireflies = [];
let twinks = [], glints = [], clouds = [], ridgeFarY = null;
const moon = { x: 0, y: 0, r: 20 };
const BARGES = [{ fx: 0.30 }, { fx: 0.74 }];

/* ============================================================
   audio (synthesised, opt-in)
============================================================ */
const SND = {
  on: false, ctx: null, master: null, noise: null,
  ensure(){
    try{
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 6;
        comp.connect(this.ctx.destination);
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.65;
        this.master.connect(comp);
        const len = Math.floor(this.ctx.sampleRate * 1.2);
        this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return true;
    }catch(e){ return false; }
  },
  pan(x){
    if (this.ctx.createStereoPanner){
      const p = this.ctx.createStereoPanner();
      p.pan.value = clamp((x / W) * 2 - 1, -1, 1) * 0.7;
      p.connect(this.master);
      return p;
    }
    return this.master;
  },
  ok(){ return this.on && this.ctx; },
  boom(size, x){
    if (!this.ok()) return;
    try{
      const c = this.ctx, t = c.currentTime + 0.015, out = this.pan(x);
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150 + 70 * size, t);
      o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16 + 0.2 * size, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.7);
      const n = c.createBufferSource(); n.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(1200, t);
      f.frequency.exponentialRampToValueAtTime(180, t + 0.4);
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.09 + 0.13 * size, t + 0.02);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      n.connect(f); f.connect(ng); ng.connect(out);
      n.start(t); n.stop(t + 0.5);
    }catch(e){}
  },
  whoosh(x){
    if (!this.ok()) return;
    try{
      const c = this.ctx, t = c.currentTime, out = this.pan(x);
      const n = c.createBufferSource(); n.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
      f.frequency.setValueAtTime(320, t);
      f.frequency.exponentialRampToValueAtTime(1500, t + 0.5);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.16);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      n.connect(f); f.connect(g); g.connect(out);
      n.start(t); n.stop(t + 0.65);
    }catch(e){}
  },
  crackle(n, x, dur = 0.9){
    if (!this.ok()) return;
    try{
      const c = this.ctx, t0 = c.currentTime + 0.06, out = this.pan(x);
      for (let i = 0; i < n; i++){
        const t = t0 + Math.random() * dur;
        const s = c.createBufferSource(); s.buffer = this.noise;
        s.playbackRate.value = 0.8 + Math.random() * 0.7;
        const f = c.createBiquadFilter(); f.type = 'bandpass';
        f.frequency.value = 2400 + Math.random() * 3800; f.Q.value = 6;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.015 + Math.random() * 0.03, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
        s.connect(f); f.connect(g); g.connect(out);
        s.start(t); s.stop(t + 0.07);
      }
    }catch(e){}
  }
};

/* ============================================================
   static scenery
============================================================ */
function buildRidge(g, baseY, amp, seed, color, step){
  const rr = mulberry32(seed);
  const p = [rr() * TAU, rr() * TAU, rr() * TAU, rr() * TAU];
  const f = [0.0021, 0.0053, 0.0117, 0.0271];
  const ys = new Array(Math.ceil(W / step) + 2);
  for (let i = 0, x = 0; x <= W + step; x += step, i++){
    const v = Math.sin(x * f[0] + p[0]) * 0.5 + Math.sin(x * f[1] + p[1]) * 0.27
            + Math.sin(x * f[2] + p[2]) * 0.15 + Math.sin(x * f[3] + p[3]) * 0.08;
    ys[i] = baseY - amp * (v + 1) / 2;
  }
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, ys[0]);
  for (let i = 1; i < ys.length; i++) g.lineTo(i * step, ys[i]);
  g.lineTo(W + step, hy + 6); g.lineTo(0, hy + 6);
  g.closePath(); g.fill();
  return x => {
    const i = clamp(Math.floor(x / step), 0, ys.length - 2);
    const t = (x - i * step) / step;
    return ys[i] + (ys[i + 1] - ys[i]) * t;
  };
}

function buildCloudSprite(seed){
  const rr = mulberry32(seed);
  const cv = document.createElement('canvas');
  cv.width = 440; cv.height = 150;
  const g = cv.getContext('2d');
  for (let i = 0; i < 16; i++){
    const x = 40 + rr() * 360, y = 45 + rr() * 60, r = 26 + rr() * 46;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(215,228,255,${0.05 + rr() * 0.07})`);
    rg.addColorStop(1, 'rgba(215,228,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.ellipse(x, y, r * 1.6, r * 0.55, 0, 0, TAU); g.fill();
  }
  return cv;
}

function buildSky(){
  const g = skctx;
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, W, H);
  const grad = g.createLinearGradient(0, 0, 0, hy + 4);
  grad.addColorStop(0.00, '#02040c');
  grad.addColorStop(0.38, '#050b1e');
  grad.addColorStop(0.68, '#0a1633');
  grad.addColorStop(0.88, '#12224a');
  grad.addColorStop(1.00, '#1d3057');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, hy + 4);

  /* faint nebulae */
  const rr = mulberry32(99);
  for (let i = 0; i < 4; i++){
    const x = rr() * W, y = rr() * hy * 0.6, r = (0.2 + rr() * 0.3) * W;
    const col = [[70,90,180],[60,140,170],[110,80,190]][i % 3];
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rgba(col, 0.05));
    rg.addColorStop(1, rgba(col, 0));
    g.fillStyle = rg;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* stars (static) */
  const rs = mulberry32(20260901);
  const n = Math.round(120 + rs() * 70) + 60;
  for (let i = 0; i < n; i++){
    const x = rs() * W;
    const y = Math.pow(rs(), 1.22) * (hy - 24);
    const sz = 0.4 + Math.pow(rs(), 2) * 1.5;
    const a = 0.25 + rs() * 0.6;
    g.fillStyle = `rgba(${rs() < 0.12 ? '255,224,190' : rs() < 0.24 ? '190,214,255' : '235,242,255'},${a})`;
    g.fillRect(x, y, sz, sz);
    if (sz > 1.55 && rs() < 0.5){
      g.fillStyle = `rgba(235,242,255,${a * 0.35})`;
      g.fillRect(x - sz * 2.2, y + sz * 0.25, sz * 5.4, 0.6);
      g.fillRect(x + sz * 0.25, y - sz * 2.2, 0.6, sz * 5.4);
    }
  }

  /* twinklers (dynamic) */
  twinks = [];
  for (let i = 0; i < 44; i++){
    twinks.push({ x: rs() * W, y: Math.pow(rs(), 1.3) * (hy - 40), r: 0.8 + rs() * 1.1,
                  a: 0.3 + rs() * 0.6, ph: rs() * TAU, sp: 0.6 + rs() * 2.2 });
  }

  /* moon */
  moon.r = clamp(Math.min(W, H) / 34, 14, 30);
  moon.x = W * 0.76; moon.y = H * 0.15;
  const mg = g.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 5.2);
  mg.addColorStop(0, 'rgba(245,240,222,0.30)');
  mg.addColorStop(0.35, 'rgba(230,230,255,0.10)');
  mg.addColorStop(1, 'rgba(230,230,255,0)');
  g.fillStyle = mg;
  g.fillRect(moon.x - moon.r * 5.2, moon.y - moon.r * 5.2, moon.r * 10.4, moon.r * 10.4);
  g.fillStyle = '#f1ecd9';
  g.beginPath(); g.arc(moon.x, moon.y, moon.r, 0, TAU); g.fill();
  g.fillStyle = 'rgba(190,188,170,0.35)';
  g.beginPath(); g.arc(moon.x - moon.r * 0.3, moon.y + moon.r * 0.2, moon.r * 0.22, 0, TAU); g.fill();
  g.beginPath(); g.arc(moon.x + moon.r * 0.25, moon.y - moon.r * 0.35, moon.r * 0.14, 0, TAU); g.fill();
  /* waning crescent shadow */
  g.fillStyle = 'rgba(6,11,28,0.93)';
  g.beginPath(); g.arc(moon.x + moon.r * 0.42, moon.y - moon.r * 0.12, moon.r * 0.94, 0, TAU); g.fill();

  /* ridges + town lights */
  ridgeFarY = buildRidge(g, hy - 4, 30 * SC, 4242, '#0c1730', 6);
  buildRidge(g, hy + 1, 46 * SC, 8484, '#060d1d', 6);
  const rl = mulberry32(1717);
  const warm = ['#ffb45e', '#ffd9a1', '#ffe9c9', '#9fc0ff'];
  for (let i = 0; i < 52; i++){
    const x = rl() * W;
    const y = ridgeFarY(x) - 1 - rl() * 3;
    if (y < hy - 60 && rl() < 0.6) continue;
    g.globalAlpha = 0.25 + rl() * 0.6;
    g.fillStyle = warm[(rl() * warm.length) | 0];
    g.fillRect(x, y, 0.8 + rl() * 1.1, 0.8 + rl() * 1.1);
  }
  g.globalAlpha = 1;

  /* clouds */
  clouds = [];
  for (let i = 0; i < 3; i++){
    clouds.push({
      spr: buildCloudSprite(31 + i * 7),
      x0: rand(0, W + 500), y: rand(0.05, 0.42) * hy,
      s: rand(1.1, 2.4), sp: rand(2.2, 6), a: rand(0.05, 0.1)
    });
  }

  /* moon glints */
  glints = [];
  for (let i = 0; i < 15; i++){
    glints.push({ d: (i + 1) / 16, len: rand(24, 86), a: rand(0.025, 0.06),
                  ph: rand(TAU), sp: rand(0.4, 1.4) });
  }
}

function qPoint(p0, cp, p1, t){
  const u = 1 - t;
  return { x: u * u * p0.x + 2 * u * t * cp.x + t * t * p1.x,
           y: u * u * p0.y + 2 * u * t * cp.y + t * t * p1.y };
}

function buildFG(){
  const g = fgx;
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, W, H);
  const r = mulberry32(777);
  const col = '#04070f';

  /* reeds — bottom left */
  for (let i = 0; i < 16; i++){
    const x0 = 8 + r() * W * 0.1;
    const bend = (r() - 0.5) * 70;
    const top = H - 70 - r() * 130;
    g.strokeStyle = col; g.lineWidth = 1 + r() * 1.5;
    g.beginPath(); g.moveTo(x0, H + 4);
    g.quadraticCurveTo(x0 + bend * 0.4, (H + top) / 2, x0 + bend, top);
    g.stroke();
    if (r() < 0.4){
      g.fillStyle = col;
      g.save(); g.translate(x0 + bend, top); g.rotate(bend * 0.01);
      g.beginPath(); g.ellipse(0, -6, 2.4, 7.5, 0, 0, TAU); g.fill();
      g.restore();
    }
  }
  /* reeds — bottom right */
  for (let i = 0; i < 13; i++){
    const x0 = W - 8 - r() * W * 0.11;
    const bend = (r() - 0.5) * 70;
    const top = H - 60 - r() * 110;
    g.strokeStyle = col; g.lineWidth = 1 + r() * 1.4;
    g.beginPath(); g.moveTo(x0, H + 4);
    g.quadraticCurveTo(x0 + bend * 0.4, (H + top) / 2, x0 + bend, top);
    g.stroke();
  }
  /* sparse grass, bottom center */
  for (let i = 0; i < 9; i++){
    const x0 = W * (0.3 + r() * 0.4);
    g.strokeStyle = 'rgba(5,9,18,0.85)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, H + 3);
    g.quadraticCurveTo(x0 + (r() - 0.5) * 30, H - 24, x0 + (r() - 0.5) * 46, H - 30 - r() * 34);
    g.stroke();
  }

  /* hanging branch — top left (and a smaller echo top right) */
  function branch(p0, cp, p1, twigs){
    const path = t => qPoint(p0, cp, p1, t);
    let prev = p0;
    for (let t = 0.08; t <= 1.001; t += 0.08){
      const pt = path(t);
      g.strokeStyle = col;
      g.lineWidth = Math.max(1, 7 * (1 - t) + 1);
      g.beginPath(); g.moveTo(prev.x, prev.y); g.lineTo(pt.x, pt.y); g.stroke();
      prev = pt;
    }
    for (let i = 0; i < twigs; i++){
      const t = 0.2 + r() * 0.75;
      const pt = path(t);
      const ang = Math.PI / 2 + (r() - 0.5) * 1.4;
      const len = 26 + r() * 62;
      const ex = pt.x + Math.cos(ang) * len, ey = pt.y + Math.sin(ang) * len;
      g.strokeStyle = col; g.lineWidth = 1 + r();
      g.beginPath(); g.moveTo(pt.x, pt.y);
      g.quadraticCurveTo(pt.x + (r() - 0.5) * 26, pt.y + len * 0.4, ex, ey);
      g.stroke();
      const leaves = 2 + (r() * 3 | 0);
      for (let k = 0; k < leaves; k++){
        const lt = 0.3 + r() * 0.7;
        const lp = qPoint(pt, { x: pt.x + (r() - 0.5) * 26, y: pt.y + len * 0.4 }, { x: ex, y: ey }, lt);
        g.save(); g.translate(lp.x, lp.y);
        g.rotate((r() - 0.5) * 2.4);
        g.fillStyle = col;
        g.beginPath(); g.ellipse(0, 0, 2.5 + r() * 2.4, 6 + r() * 8, 0, 0, TAU); g.fill();
        g.restore();
      }
    }
  }
  branch({ x: -30, y: -16 }, { x: W * 0.07, y: 84 + r() * 30 }, { x: W * 0.235, y: 34 + r() * 26 }, 12);
  branch({ x: W + 24, y: -12 }, { x: W * 0.93, y: 64 + r() * 24 }, { x: W * 0.845, y: 26 + r() * 20 }, 8);

  /* fireflies live near the reeds */
  fireflies.length = 0;
  for (let i = 0; i < 12; i++){
    fireflies.push({
      rx: i < 6 ? rand(0.02, 0.2) : rand(0.8, 0.97),
      ry: rand(0.8, 0.94),
      ph: rand(TAU), sp: rand(0.5, 1.5), amp: rand(9, 24)
    });
  }
}

function buildVig(){
  const g = vgx;
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, W, H);
  const rg = g.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.34, W / 2, H * 0.46, Math.hypot(W, H) * 0.62);
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(1, 'rgba(0,0,0,0.4)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  let lg = g.createLinearGradient(0, 0, 0, H * 0.16);
  lg.addColorStop(0, 'rgba(0,0,0,0.3)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H * 0.16);
  lg = g.createLinearGradient(0, H * 0.88, 0, H);
  lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,0.32)');
  g.fillStyle = lg; g.fillRect(0, H * 0.88, W, H * 0.12);
}

/* ============================================================
   particles & bursts
============================================================ */
function guard(n){
  if (particles.length > MAXP * 0.8) return Math.max(6, (n * 0.35) | 0);
  return n | 0;
}
function star(x, y, vx, vy, o){
  particles.push({
    kind: 'star', x, y, vx, vy,
    ci: o.ci ?? WHITE, life: o.life ?? 1.2, age: 0,
    size: o.size ?? 1.6, g: o.g ?? 160 * SC, drag: o.drag ?? 1.5,
    fp: o.fp ?? 1.5, a: o.a ?? 1,
    trail: !!o.trail, flick: !!o.flick, glit: o.glit ?? 0,
    split: o.split ?? 0, child: o.child ?? null,
    seed: Math.random() * 100
  });
}
function flashP(x, y, size, life = 0.24){
  particles.push({ kind: 'flash', x, y, vx: 0, vy: 0, size, life, age: 0, ci: GOLD, a: 1 });
}
function ringP(x, y, size){
  if (RM) return;
  particles.push({ kind: 'ring', x, y, vx: 0, vy: 0, size, life: 0.5, age: 0, ci: WHITE, a: 1 });
}

function sphereDir(){
  const th = rand(TAU);
  return { x: Math.cos(th), y: Math.sin(th) };
}

function burst(x, y, sp){
  const size = sp.size, spd = SC * (150 + 155 * size);
  const type = RM && sp.type === 'strobe' ? 'chrys' : sp.type;
  flashP(x, y, (70 + 120 * size) * SC);
  ringP(x, y, (115 + 140 * size) * SC);
  hFlash = Math.min(1.25, hFlash + 0.13 + 0.2 * size);
  SND.boom(size, x);
  if (type === 'crackle') SND.crackle(Math.round(16 + 22 * size), x);

  const q = qual;
  if (type === 'peony' || type === 'chrys'){
    const n = guard((78 + 55 * size) * q);
    const life = type === 'chrys' ? rand(1.6, 2.1) : rand(1.2, 1.7);
    for (let i = 0; i < n; i++){
      const d = sphereDir();
      const s = spd * (Math.random() < 0.7 ? rand(0.82, 1.05) : rand(0.3, 0.8));
      star(x, y, d.x * s, d.y * s, {
        ci: sp.ci, life: life * rand(0.85, 1.1), size: 1.35 + 0.8 * size,
        g: 150 * SC, drag: type === 'chrys' ? 1.2 : 1.6,
        trail: type === 'chrys', fp: type === 'chrys' ? 2 : 1.5
      });
    }
  }
  else if (type === 'willow'){
    const n = guard((68 + 42 * size) * q);
    const ci = sp.ci === WHITE ? GOLD : (Math.random() < 0.8 ? GOLD : AMBER);
    for (let i = 0; i < n; i++){
      const d = sphereDir();
      const s = spd * rand(0.45, 0.95) * 0.85;
      star(x, y, d.x * s, d.y * s, {
        ci, life: rand(2.7, 3.6), size: 1.25 + 0.5 * size,
        g: 225 * SC, drag: 1.05, fp: 2.6, glit: 0.5
      });
    }
    SND.crackle(Math.round(8 + 8 * size), x, 1.4);
  }
  else if (type === 'palm'){
    const n = guard(9 + 4 * size);
    for (let i = 0; i < n; i++){
      const th = (i / n) * TAU + rand(-0.1, 0.1);
      const s = spd * rand(0.95, 1.25);
      star(x, y, Math.cos(th) * s, Math.sin(th) * s, {
        ci: GOLD, life: rand(2.1, 2.6), size: 2.6 + size,
        g: 235 * SC, drag: 0.8, fp: 2.2, trail: true
      });
    }
    for (let i = 0; i < guard(26 * q); i++){
      const d = sphereDir(), s = spd * rand(0.2, 0.6);
      star(x, y, d.x * s, d.y * s, { ci: AMBER, life: rand(0.8, 1.4), size: 1.1, g: 190 * SC, drag: 1.2 });
    }
  }
  else if (type === 'ring'){
    const n = guard((58 + 26 * size) * q);
    const a0 = rand(TAU), sq = rand(0.28, 0.62);
    const ca = Math.cos(a0), sa = Math.sin(a0);
    for (let i = 0; i < n; i++){
      const th = (i / n) * TAU + rand(-0.03, 0.03);
      const s = spd * rand(0.96, 1.04);
      const dx = Math.cos(th), dy = Math.sin(th) * sq;
      const ux = dx * ca - dy * sa, uy = dx * sa + dy * ca;
      star(x, y, ux * s, uy * s, {
        ci: sp.ci, life: rand(1.25, 1.5), size: 1.5 + 0.6 * size,
        g: 130 * SC, drag: 1.55, fp: 1.6
      });
    }
    if (Math.random() < 0.6){
      const n2 = guard(24 * q);
      for (let i = 0; i < n2; i++){
        const d = sphereDir(), s = spd * rand(0.1, 0.42);
        star(x, y, d.x * s, d.y * s, { ci: sp.ci2 ?? WHITE, life: rand(0.9, 1.2), size: 1.2, g: 150 * SC, drag: 1.4 });
      }
    }
  }
  else if (type === 'crossette'){
    const n = guard(11 + 3 * size);
    for (let i = 0; i < n; i++){
      const th = (i / n) * TAU + rand(-0.08, 0.08);
      const s = spd * rand(0.9, 1.15);
      star(x, y, Math.cos(th) * s, Math.sin(th) * s, {
        ci: sp.ci, life: rand(1.0, 1.2), size: 3 + size,
        g: 170 * SC, drag: 1.4, fp: 1.4, split: rand(0.42, 0.58)
      });
    }
  }
  else if (type === 'strobe'){
    const n = guard((42 + 22 * size) * q);
    const cols = [WHITE, 7, 3, 5];
    for (let i = 0; i < n; i++){
      const d = sphereDir(), s = spd * rand(0.55, 1.0);
      star(x, y, d.x * s, d.y * s, {
        ci: pick(cols), life: rand(1.9, 2.4), size: 1.7 + 0.5 * size,
        g: 105 * SC, drag: 1.5, fp: 1.3, flick: true, a: 0.9
      });
    }
  }
  else if (type === 'double'){
    const n = guard((62 + 38 * size) * q);
    for (let i = 0; i < n; i++){
      const d = sphereDir(), s = spd * rand(0.75, 1.05);
      const carrier = i < 5;
      star(x, y, d.x * s, d.y * s, {
        ci: sp.ci, life: rand(1.1, 1.35), size: 1.5 + 0.7 * size,
        g: 150 * SC, drag: 1.5, fp: 1.4,
        split: carrier ? rand(0.5, 0.75) : 0,
        child: carrier ? { size: 0.62, ci: sp.ci2 ?? WHITE } : null
      });
    }
  }
  else if (type === 'crackle'){
    const n = guard((88 + 45 * size) * q);
    for (let i = 0; i < n; i++){
      const d = sphereDir(), s = spd * rand(0.55, 1.1);
      star(x, y, d.x * s, d.y * s, {
        ci: Math.random() < 0.7 ? GOLD : AMBER, life: rand(1.3, 1.8),
        size: 1.4 + 0.5 * size, g: 140 * SC, drag: 1.5, fp: 1.6, glit: 1
      });
    }
  }
  else { /* peony fallback */
    const n = guard(70 * q);
    for (let i = 0; i < n; i++){
      const d = sphereDir(), s = spd * rand(0.4, 1.0);
      star(x, y, d.x * s, d.y * s, { ci: sp.ci, life: rand(1.1, 1.5), size: 1.5, g: 150 * SC, drag: 1.5 });
    }
  }
}

function childBurst(x, y, ch){
  flashP(x, y, 42 * SC, 0.2);
  const spd = SC * (135 + 100 * ch.size);
  const n = guard(34 * qual);
  for (let i = 0; i < n; i++){
    const d = sphereDir(), s = spd * rand(0.6, 1.05);
    star(x, y, d.x * s, d.y * s, { ci: ch.ci, life: rand(0.9, 1.2), size: 1.3, g: 150 * SC, drag: 1.5, fp: 1.4 });
  }
  SND.boom(0.35, x);
  SND.crackle(8, x, 0.5);
}

/* ---------- rockets ---------- */
const G_R = () => 330 * SC;

function launchNow(spec){
  const tx = clamp(spec.tx, W * 0.05, W * 0.95);
  const ty = clamp(spec.ty, H * 0.08, hy - 80);
  let x0;
  if (Math.random() < 0.55){
    const b = Math.abs(tx - BARGES[0].fx * W) < Math.abs(tx - BARGES[1].fx * W) ? BARGES[0] : BARGES[1];
    x0 = b.fx * W + rand(-8, 8);
  } else {
    x0 = rand(0.08, 0.92) * W;
  }
  const y0 = hy + 8;
  const rise = y0 - ty;
  const vy = -Math.sqrt(2 * G_R() * rise) * rand(1.0, 1.05);
  const vx = (tx - x0) / Math.max(0.5, (-vy) / G_R()) * 0.95;
  rockets.push({ x: x0, y: y0, vx, vy, ty, age: 0, delay: spec.delay || 0, launched: false, spec });
}
function launch(spec){
  spec.delay = spec.delay || 0;
  if (spec.delay > 0){ pending.push({ d: spec.delay, spec }); }
  else launchNow(spec);
}

function autoSpec(ph){
  const wide = ph.fin ? [0.07, 0.93] : [0.16, 0.84];
  const theme = pick(THEMES);
  let type = pick(ph.types);
  if (RM && type === 'strobe') type = 'chrys';
  return {
    tx: rand(wide[0], wide[1]) * W,
    ty: rand(H * 0.1, H * 0.42),
    size: rand(ph.sz[0], ph.sz[1]),
    type, ci: theme[0], ci2: theme[1]
  };
}

/* ============================================================
   the show director
============================================================ */
const PHASES = [
  { n:'I',   name:'Overture',       dur:24, iv:[2.3, 3.3], salvo:[1,1], sz:[0.8, 1.05], types:['peony','chrys','ring','peony'] },
  { n:'II',  name:'River of Gold',  dur:30, iv:[1.6, 2.4], salvo:[1,2], sz:[0.9, 1.2],  types:['willow','palm','chrys','crackle','willow'] },
  { n:'III', name:'Radiance',       dur:32, iv:[1.05,1.7], salvo:[1,2], sz:[1.0, 1.4],  types:['peony','ring','crossette','strobe','double','chrys','peony'] },
  { n:'IV',  name:'Grand Finale',   dur:26, iv:[0.35,0.7], salvo:[1,3], sz:[1.05,1.55], types:['peony','willow','double','crossette','ring','palm','crackle'], fin:true },
  { n:'',    name:'Repose',         dur:15, iv:[5.0, 6.5], salvo:[1,1], sz:[0.8, 1.0],  types:['willow'], rest:true },
];
const FINALE_IDX = 3;
let phIdx = 0, phT = 0, spawnT = 1.15, megaDone = false;
let capTimer = null;

function setCaption(ph){
  capNum.textContent = ph.n;
  capName.textContent = ph.name;
  capEl.classList.add('show');
  clearTimeout(capTimer);
  capTimer = setTimeout(() => capEl.classList.remove('show'), 5200);
}

function directorUpdate(dt){
  const ph = PHASES[phIdx];
  phT += dt;
  if (ph.fin && !megaDone && phT > ph.dur - 4.6){
    megaDone = true;
    const xs = [0.26, 0.5, 0.74];
    xs.forEach((fx, i) => launch({
      tx: fx * W, ty: H * (0.16 + i * 0.05), size: rand(1.8, 2.05),
      type: 'willow', ci: GOLD, ci2: AMBER, delay: i * 0.32
    }));
    launch({ tx: W * 0.38, ty: H * 0.24, size: 1.4, type: 'double', ci: WHITE, ci2: 6, delay: 1.15 });
    launch({ tx: W * 0.63, ty: H * 0.2, size: 1.35, type: 'ring', ci: GOLD, ci2: WHITE, delay: 1.5 });
  }
  if (phT > ph.dur){
    phIdx = (phIdx + 1) % PHASES.length;
    phT = 0; megaDone = false; spawnT = rand(0.4, 0.9);
    setCaption(PHASES[phIdx]);
  }
  spawnT -= dt;
  if (spawnT <= 0){
    const p2 = PHASES[phIdx];
    const cnt = randInt(p2.salvo[0], p2.salvo[1]);
    for (let i = 0; i < cnt; i++){
      if (rockets.length > (p2.fin ? 16 : 10)) break;
      launch(Object.assign(autoSpec(p2), { delay: i * rand(0.1, 0.22) }));
    }
    spawnT = rand(p2.iv[0], p2.iv[1]) * (RM ? 1.5 : 1);
  }
  /* staged launches */
  for (let i = pending.length - 1; i >= 0; i--){
    pending[i].d -= dt;
    if (pending[i].d <= 0){ launchNow(pending[i].spec); pending.splice(i, 1); }
  }
}
function forceFinale(){
  phIdx = FINALE_IDX; phT = 0; megaDone = false; spawnT = 0.25;
  setCaption(PHASES[FINALE_IDX]);
}

/* ============================================================
   update + draw (particle layer)
============================================================ */
function updateRockets(dt){
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    if (r.delay > 0){
      r.delay -= dt;
      if (r.delay <= 0){
        r.launched = true;
        SND.whoosh(r.x);
        flashP(r.x, r.y, 26 * SC, 0.16);
      }
      continue;
    }
    r.age += dt;
    r.vy += G_R() * dt;
    r.x += r.vx * dt + Math.sin(r.age * 18) * 14 * dt;
    r.y += r.vy * dt;
    const k = qual > 0.65 ? 2 : 1;
    for (let j = 0; j < k; j++){
      star(r.x + rand(-1.5, 1.5), r.y + rand(0, 3),
           r.vx * 0.2 + rand(-26, 26), r.vy * 0.15 + rand(30, 90),
           { ci: GOLD, life: rand(0.22, 0.5), size: 0.8, g: 260 * SC, drag: 0.6, a: 0.9 });
    }
    if (r.y <= r.ty || r.vy > -70){
      burst(r.x, r.y, r.spec);
      rockets.splice(i, 1);
    }
  }
}

function updateParticlesAndDraw(dt){
  /* fade pass — leaves motion trails */
  pctx.globalCompositeOperation = 'destination-out';
  pctx.globalAlpha = 1 - Math.pow(1 - (RM ? 0.3 : 0.2), dt * 60);
  pctx.fillStyle = '#000';
  pctx.fillRect(0, 0, W, H);
  pctx.globalCompositeOperation = 'lighter';

  if (particles.length === 0 && rockets.length === 0 && !shooting){
    pctx.clearRect(0, 0, W, H);
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;

    if (p.age >= p.life){
      if (p.child) childBurst(p.x, p.y, p.child);
      particles.splice(i, 1);
      continue;
    }
    if (p.split && p.age >= p.split){
      /* crossette — split into a cross of sparks */
      SND.crackle(5, p.x, 0.3);
      for (let k = 0; k < 4; k++){
        const a = (k / 4) * TAU + rand(-0.2, 0.2);
        star(p.x, p.y, Math.cos(a) * 135 * SC, Math.sin(a) * 135 * SC - 30,
             { ci: p.ci, life: rand(0.4, 0.65), size: 1.5, g: 200 * SC, drag: 2, glit: 0.7 });
      }
      particles.splice(i, 1);
      continue;
    }

    if (p.kind === 'star'){
      const dr = Math.exp(-p.drag * dt);
      p.vx = p.vx * dr + windNow * dt;
      p.vy = p.vy * dr + p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const t = p.age / p.life;
      let a = Math.pow(1 - t, p.fp) * p.a;
      if (p.flick){
        const s = Math.sin(p.age * 30 + p.seed);
        a *= s > 0.1 ? 1 : 0.15;
      }
      if (p.glit && t > 0.35){
        a *= Math.random() < 0.3 + 0.4 * p.glit ? 1 : 0.3;
      }
      const rr = p.size * (p.trail ? 3.3 : 2.15);
      drawGlow(pctx, glow[p.ci], p.x, p.y, rr, a);
      if (a > 0.25){
        pctx.globalAlpha = Math.min(1, a * 1.3);
        pctx.fillStyle = '#fff';
        const cs = Math.max(0.8, p.size * 0.55);
        pctx.fillRect(p.x - cs / 2, p.y - cs / 2, cs, cs);
      }
    }
    else if (p.kind === 'flash'){
      const t = p.age / p.life;
      const a = Math.pow(1 - t, 2) * 0.9;
      drawGlow(pctx, glow[p.ci], p.x, p.y, p.size * (0.55 + 0.45 * (1 - t)), a);
    }
    else if (p.kind === 'ring'){
      const t = p.age / p.life;
      const r = Math.pow(t, 0.6) * p.size;
      pctx.globalAlpha = 0.55 * (1 - t);
      pctx.strokeStyle = 'rgba(240,246,255,1)';
      pctx.lineWidth = 2.6 * (1 - t) + 0.35;
      pctx.beginPath();
      pctx.arc(p.x, p.y, r, 0, TAU);
      pctx.stroke();
    }
  }

  /* rocket heads */
  for (const r of rockets){
    if (r.delay > 0) continue;
    drawGlow(pctx, glow[WHITE], r.x, r.y, 4.6 * SC, 0.95);
    drawGlow(pctx, glow[GOLD], r.x, r.y, 2.6 * SC, 0.9);
  }

  /* shooting star */
  if (shooting){
    const s = shooting;
    s.age += dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.age > s.life){ shooting = null; }
    else {
      const a = Math.sin((s.age / s.life) * Math.PI) * 0.9;
      pctx.globalAlpha = a;
      pctx.strokeStyle = 'rgba(225,238,255,1)';
      pctx.lineWidth = 1.3;
      pctx.beginPath();
      pctx.moveTo(s.x, s.y);
      pctx.lineTo(s.x - s.vx * 0.085, s.y - s.vy * 0.085);
      pctx.stroke();
      drawGlow(pctx, glow[WHITE], s.x, s.y, 3, a);
    }
  }
  pctx.globalAlpha = 1;
  pctx.globalCompositeOperation = 'source-over';
}

function updateShooting(dt){
  shootT -= dt;
  if (shootT <= 0 && !shooting && !RM){
    const rest = PHASES[phIdx].rest;
    shootT = rest ? rand(5, 11) : rand(11, 24);
    const dir = Math.random() < 0.5 ? 1 : -1;
    shooting = {
      x: rand(0.12, 0.8) * W, y: rand(0.05, 0.3) * hy,
      vx: rand(420, 640) * dir, vy: rand(110, 210),
      age: 0, life: rand(0.7, 1.1)
    };
  }
}

function update(dt){
  windNow = Math.sin(tGlobal * 0.06) * 7 * SC;
  directorUpdate(dt);
  updateRockets(dt);
  updateParticlesAndDraw(dt);
  updateShooting(dt);
}

/* ============================================================
   render
============================================================ */
function waterPass(t){
  const sw = sceneC.width;
  const slice = 3;
  const slicePx = Math.max(1, Math.round(slice * S));
  for (let y = 0; y < waterH; y += slice){
    const srcY = hy - (y + slice);
    if (srcY < 0) break;
    const dpt = y / waterH;
    const sway = (Math.sin(t * 1.25 + y * 0.05) * (0.5 + y * 0.016)
               + Math.sin(t * 0.5 + y * 0.021) * 2.3 * (dpt + 0.12)) * (0.55 + SC * 0.5);
    ctx.globalAlpha = 0.5 * (1 - dpt * 0.55);
    ctx.drawImage(sceneC, 0, Math.round(srcY * S), sw, slicePx, sway, hy + y, W, slice + 0.75);
  }
  ctx.globalAlpha = 1;

  const g = ctx.createLinearGradient(0, hy, 0, H);
  g.addColorStop(0, 'rgba(4,9,20,0.28)');
  g.addColorStop(0.5, 'rgba(3,6,14,0.5)');
  g.addColorStop(1, 'rgba(1,3,9,0.82)');
  ctx.fillStyle = g;
  ctx.fillRect(0, hy, W, waterH);

  /* horizon sheen */
  ctx.fillStyle = 'rgba(150,180,235,0.16)';
  ctx.fillRect(0, hy - 0.5, W, 1);
  ctx.fillStyle = 'rgba(255,190,130,0.08)';
  ctx.fillRect(0, hy - 1.5, W, 1);

  /* moon glint */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const gl of glints){
    const yy = hy + gl.d * waterH;
    const pulse = Math.sin(t * gl.sp + gl.ph) * 0.5 + 0.5;
    const a = gl.a * (0.35 + 0.65 * pulse * pulse);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe9ff';
    const wob = Math.sin(t * 0.7 + gl.ph) * 7 * gl.d;
    ctx.fillRect(moon.x - gl.len * (0.6 + gl.d) * 0.5 + wob, yy, gl.len * (0.6 + gl.d), 1.1);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBarges(t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < BARGES.length; i++){
    const x = BARGES[i].fx * W;
    const y = hy + 2.5 + Math.sin(t * 1.6 + i * 2) * 1.2;
    const blink = Math.sin(t * 2.4 + i) > 0.3 ? 0.85 : 0.22;
    drawGlow(ctx, glow[RED], x, y, 5, blink);
    ctx.globalAlpha = blink;
    ctx.fillStyle = '#ff6a5a';
    ctx.fillRect(x - 0.8, y - 0.8, 1.6, 1.6);
    drawGlow(ctx, glow[WHITE], x + 8, y, 3.6, 0.5);
    /* reflection streak */
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#ff8a7a';
    ctx.fillRect(x - 0.7, y + 3, 1.4, 8);
    ctx.fillStyle = '#e8f0ff';
    ctx.fillRect(x + 7.3, y + 3, 1.4, 7);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawFireflies(t){
  if (flyLevel < 0.02) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies){
    const x = f.rx * W + Math.sin(t * 0.5 * f.sp + f.ph) * f.amp;
    const y = f.ry * H + Math.sin(t * 0.7 * f.sp + f.ph * 2) * f.amp * 0.5;
    const tw = Math.max(0, Math.sin(t * 2.2 + f.ph * 3));
    const a = flyLevel * (0.15 + 0.85 * tw * tw * tw);
    if (a < 0.03) continue;
    drawGlow(ctx, glow[GOLD], x, y, 3.4, a);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9b0';
    ctx.fillRect(x - 0.6, y - 0.6, 1.2, 1.2);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function render(){
  const t = tGlobal;

  /* --- scene canvas --- */
  sctx.setTransform(S, 0, 0, S, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  sctx.globalAlpha = 1;
  sctx.drawImage(skyC, 0, 0, W, H);

  for (const c of clouds){
    const cw = 440 * c.s;
    const x = ((c.x0 + t * c.sp) % (W + cw + 260)) - cw - 130;
    sctx.globalAlpha = c.a;
    sctx.drawImage(c.spr, x, c.y, cw, 150 * c.s);
  }

  sctx.globalCompositeOperation = 'lighter';
  sctx.fillStyle = '#e8f0ff';
  for (const tw of twinks){
    const a = tw.a * (0.3 + 0.7 * Math.max(0, Math.sin(t * tw.sp + tw.ph)));
    sctx.globalAlpha = a;
    sctx.fillRect(tw.x, tw.y, tw.r, tw.r);
  }
  sctx.globalAlpha = 1;
  if (hFlash > 0.004){
    const g = sctx.createRadialGradient(W * 0.5, hy, 0, W * 0.5, hy, W * 0.55);
    g.addColorStop(0, `rgba(255,196,130,${0.2 * Math.min(1, hFlash)})`);
    g.addColorStop(1, 'rgba(255,196,130,0)');
    sctx.globalAlpha = 1;
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, W, hy + 2);
  }
  sctx.globalAlpha = 1;
  sctx.drawImage(pC, 0, 0, W, H);
  sctx.globalCompositeOperation = 'source-over';

  /* --- main canvas --- */
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(sceneC, 0, 0, W, H);

  waterPass(t);
  drawBarges(t);

  ctx.drawImage(fgC, 0, 0, W, H);
  drawFireflies(t);
  ctx.drawImage(vigC, 0, 0, W, H);
}

/* ============================================================
   input & UI
============================================================ */
let lastActive = performance.now();
let hintDone = false;
function poke(){
  lastActive = performance.now();
  document.body.classList.remove('idle');
}
function dismissHint(){
  if (hintDone) return;
  hintDone = true;
  hintEl.classList.remove('show');
}
setTimeout(() => titleEl.classList.add('in'), 450);
setTimeout(() => titleEl.classList.add('out'), 5200);
setTimeout(() => { if (!hintDone) hintEl.classList.add('show'); }, 1800);
setTimeout(dismissHint, 13000);

function setPaused(v){
  paused = v;
  btnPause.setAttribute('aria-label', v ? 'Resume the show' : 'Pause the show');
  btnPause.querySelector('.ic-pause').classList.toggle('hidden', v);
  btnPause.querySelector('.ic-play').classList.toggle('hidden', !v);
}
function setSound(v){
  SND.on = v;
  if (v) SND.ensure();
  btnSound.setAttribute('aria-pressed', String(v));
  btnSound.setAttribute('aria-label', v ? 'Mute sound' : 'Enable sound');
  btnSound.querySelector('.ic-on').classList.toggle('hidden', !v);
  btnSound.querySelector('.ic-off').classList.toggle('hidden', v);
}

function manualLaunch(x, y){
  const theme = pick(THEMES);
  launch({
    tx: x, ty: clamp(y, H * 0.07, hy - 70),
    size: rand(0.95, 1.4), type: pick(RICH),
    ci: theme[0], ci2: theme[1]
  });
  dismissHint();
}
function barrage(){
  for (let i = 0; i < 6; i++){
    const theme = pick(THEMES);
    launch(Object.assign(autoSpec({ fin:true, types: RICH, sz: [0.9, 1.3] }), { delay: i * 0.11 }));
  }
  dismissHint();
}

window.addEventListener('pointerdown', e => {
  poke();
  if (e.target.closest('#controls') || e.target.closest('button')) return;
  manualLaunch(e.clientX, e.clientY);
});
window.addEventListener('pointermove', poke);
window.addEventListener('keydown', e => {
  poke();
  if (e.code === 'Space'){ e.preventDefault(); barrage(); }
  else if (e.code === 'KeyF'){ forceFinale(); dismissHint(); }
  else if (e.code === 'KeyS'){ setSound(!SND.on); }
  else if (e.code === 'KeyP' || e.code === 'Escape'){ setPaused(!paused); }
});

btnPause.addEventListener('click', () => setPaused(!paused));
btnSound.addEventListener('click', () => setSound(!SND.on));
btnFin.addEventListener('click', () => { forceFinale(); dismissHint(); });

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastFrame = performance.now();
});

/* ============================================================
   sizing
============================================================ */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  let px = Math.min(window.devicePixelRatio || 1, 1.75);
  const area = W * H * px * px;
  if (area > 2.75e6) px = Math.sqrt(2.75e6 / (W * H));
  S = px;
  for (const c of [stage, sceneC, pC, skyC, fgC, vigC]){
    c.width = Math.max(1, Math.round(W * S));
    c.height = Math.max(1, Math.round(H * S));
  }
  ctx.setTransform(S, 0, 0, S, 0, 0);
  sctx.setTransform(S, 0, 0, S, 0, 0);
  pctx.setTransform(S, 0, 0, S, 0, 0);
  hy = Math.round(H * 0.66);
  waterH = H - hy;
  SC = clamp(Math.min(W, H) / 820, 0.62, 1.2) * clamp(Math.sqrt(W * H) / 1150, 0.75, 1.1);
  qual = clamp(Math.sqrt(1.15e6 / (W * H)), 0.58, 1) * (RM ? 0.55 : 1);
  buildSky();
  buildFG();
  buildVig();
  particles.length = 0;
  rockets.length = 0;
  pending.length = 0;
  shooting = null;
}
let rsT = null;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(resize, 120);
});

/* ============================================================
   main loop
============================================================ */
let lastFrame = performance.now();
let fpsAcc = 0, fpsN = 0;

function frame(now){
  requestAnimationFrame(frame);
  let rdt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (rdt > 0.1) rdt = 0.1;
  tGlobal += rdt;
  hFlash *= Math.exp(-rdt * 3.1);
  const rest = PHASES[phIdx].rest;
  flyLevel += ((rest ? 1 : 0) - flyLevel) * Math.min(1, rdt * 0.7);

  if (!paused) update(rdt);
  render();

  if (now - lastActive > 3800) document.body.classList.add('idle');

  fpsAcc += rdt; fpsN++;
  if (fpsN >= 110){
    const avg = fpsAcc / fpsN;
    if (avg > 0.027 && qual > 0.45) qual *= 0.85;
    else if (avg < 0.017 && qual < 1) qual = Math.min(1, qual * 1.06);
    fpsAcc = 0; fpsN = 0;
  }
}

resize();
setCaption(PHASES[0]);
requestAnimationFrame(frame);

})();
</script>
