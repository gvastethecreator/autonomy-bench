<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030711">
  <title>Afterlight — An Electric Nocturne</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f0e6;
      --muted: rgba(226, 232, 240, 0.58);
      --line: rgba(255, 255, 255, 0.15);
      --glass: rgba(4, 9, 19, 0.42);
      --accent: #f2c777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030711;
    }

    body {
      font-family: "Aptos", "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button {
      font: inherit;
    }

    #experience {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background:
        radial-gradient(circle at 78% 16%, rgba(69, 89, 132, 0.13), transparent 31%),
        #030711;
    }

    #sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .grain,
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .grain {
      opacity: 0.075;
      mix-blend-mode: soft-light;
      background-image:
        repeating-radial-gradient(circle at 17% 31%, transparent 0, rgba(255,255,255,.22) .55px, transparent 1px, transparent 3px),
        repeating-radial-gradient(circle at 83% 68%, transparent 0, rgba(255,255,255,.14) .45px, transparent 1px, transparent 4px);
      background-size: 7px 7px, 11px 11px;
      animation: grain-shift 0.7s steps(2) infinite;
    }

    .vignette {
      background:
        linear-gradient(to bottom, rgba(0,0,0,.22), transparent 18%, transparent 72%, rgba(0,0,0,.52)),
        radial-gradient(ellipse at center, transparent 40%, rgba(0, 2, 9, .42) 100%);
    }

    @keyframes grain-shift {
      0% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(-1px, 1px, 0); }
      66% { transform: translate3d(1px, -1px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        max(22px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .topbar,
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .monogram {
      position: relative;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 50%;
    }

    .monogram::before,
    .monogram::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 9px rgba(242, 199, 119, 0.58);
    }

    .monogram::before {
      width: 10px;
      height: 1px;
    }

    .monogram::after {
      width: 1px;
      height: 10px;
    }

    .identity-copy {
      display: grid;
      gap: 2px;
      line-height: 1;
    }

    .identity-copy strong,
    .show-state,
    .eyebrow,
    .hint,
    .keyline,
    .control {
      text-transform: uppercase;
      letter-spacing: 0.19em;
    }

    .identity-copy strong {
      font-size: 10px;
      font-weight: 650;
      color: rgba(255, 255, 255, 0.89);
    }

    .identity-copy span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      font-style: italic;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .control {
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.72);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(125%);
      -webkit-backdrop-filter: blur(14px) saturate(125%);
      font-size: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: color .25s ease, background .25s ease, border-color .25s ease, transform .2s ease;
    }

    .control:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(11, 18, 32, 0.62);
    }

    .control:active {
      transform: scale(.96);
    }

    .control:focus-visible {
      outline: 2px solid rgba(242, 199, 119, 0.88);
      outline-offset: 3px;
    }

    .control .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.36);
      box-shadow: none;
      transition: background .25s ease, box-shadow .25s ease;
    }

    .control[aria-pressed="true"] .status-dot {
      background: var(--accent);
      box-shadow: 0 0 7px rgba(242, 199, 119, .72);
    }

    .pause-icon {
      position: relative;
      width: 7px;
      height: 9px;
      flex: 0 0 auto;
    }

    .pause-icon::before,
    .pause-icon::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 1px;
      background: currentColor;
      transition: transform .2s ease;
    }

    .pause-icon::before { left: 0; }
    .pause-icon::after { right: 0; }

    .control[aria-pressed="true"] .pause-icon::before {
      transform: translateX(2px) rotate(-31deg) scaleY(.72);
      transform-origin: bottom;
    }

    .control[aria-pressed="true"] .pause-icon::after {
      transform: translateX(-1px) rotate(31deg) scaleY(.72);
      transform-origin: top;
    }

    .intro {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
      animation: intro-sequence 8s cubic-bezier(.22,.72,.2,1) both;
    }

    .intro-inner {
      transform: translateY(-1.5vh);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: rgba(244, 240, 230, 0.62);
      font-size: clamp(8px, .75vw, 11px);
      font-weight: 650;
    }

    .title {
      position: relative;
      margin: 0;
      font-family: "Arial Narrow", "Aptos Display", "Segoe UI", sans-serif;
      font-size: clamp(62px, 14.2vw, 214px);
      font-stretch: condensed;
      font-weight: 200;
      line-height: .75;
      letter-spacing: -.055em;
      color: rgba(249, 248, 243, .93);
      text-shadow:
        0 0 40px rgba(206, 222, 255, .12),
        0 3px 40px rgba(0,0,0,.48);
    }

    .title .after,
    .title .light {
      display: block;
    }

    .title .light {
      margin-left: .49em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(244, 240, 230, .68);
    }

    .title-rule {
      width: min(420px, 46vw);
      height: 1px;
      margin: 27px auto 0;
      background: linear-gradient(90deg, transparent, rgba(242,199,119,.85), transparent);
      box-shadow: 0 0 12px rgba(242,199,119,.22);
      transform-origin: center;
    }

    @keyframes intro-sequence {
      0% { opacity: 0; filter: blur(7px); transform: scale(.985); }
      12% { opacity: 1; filter: blur(0); transform: scale(1); }
      54% { opacity: 1; filter: blur(0); transform: scale(1); }
      78% { opacity: .7; }
      100% { opacity: 0; visibility: hidden; filter: blur(3px); transform: scale(1.02); }
    }

    .show-state {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 176px;
      color: rgba(255,255,255,.56);
      font-size: 8px;
      font-weight: 650;
      white-space: nowrap;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff9273;
      box-shadow: 0 0 10px rgba(255, 116, 85, .82);
      animation: live-pulse 1.9s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: .45; transform: scale(.72); }
      50% { opacity: 1; transform: scale(1); }
    }

    .timeline {
      position: relative;
      width: min(28vw, 340px);
      height: 1px;
      overflow: hidden;
      background: rgba(255,255,255,.14);
    }

    .timeline-fill {
      position: absolute;
      inset: 0;
      width: 0;
      transform-origin: left;
      background: linear-gradient(90deg, rgba(242,199,119,.25), rgba(242,199,119,.95));
      box-shadow: 0 0 8px rgba(242,199,119,.52);
    }

    .hint {
      color: rgba(255,255,255,.5);
      font-size: 8px;
      font-weight: 650;
      text-align: right;
      transition: opacity .7s ease, transform .7s ease;
      animation: hint-arrive 1s 7.5s both;
    }

    .hint::before {
      content: "";
      display: inline-block;
      width: 18px;
      height: 1px;
      margin: 0 10px 2px 0;
      background: rgba(255,255,255,.34);
    }

    .hint.dismissed {
      opacity: 0;
      transform: translateY(5px);
    }

    @keyframes hint-arrive {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 680px) {
      .chrome {
        padding:
          max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }

      .identity-copy span,
      .control .control-label {
        display: none;
      }

      .control {
        width: 34px;
        justify-content: center;
        padding: 0;
      }

      .timeline {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: max(52px, calc(env(safe-area-inset-bottom) + 43px));
        width: auto;
      }

      .show-state {
        min-width: 0;
        max-width: 48vw;
        overflow: hidden;
      }

      .hint {
        max-width: 42vw;
        line-height: 1.6;
      }

      .title {
        font-size: clamp(60px, 20vw, 112px);
      }

      .title-rule {
        width: 56vw;
        margin-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain,
      .live-dot {
        animation: none;
      }

      .intro {
        animation-duration: 4s;
      }

      .hint {
        animation-delay: 3.5s;
      }
    }
  </style>
</head>
<body>
  <main id="experience">
    <canvas id="sky" role="img" aria-label="An interactive, choreographed fireworks display above a moonlit waterfront"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="intro" aria-hidden="true">
      <div class="intro-inner">
        <p class="eyebrow">An electric nocturne · Study no. 01</p>
        <h1 class="title">
          <span class="after">After</span>
          <span class="light">Light</span>
        </h1>
        <div class="title-rule"></div>
      </div>
    </section>

    <div class="chrome">
      <div class="topbar">
        <div class="identity" aria-label="Afterlight, an electric nocturne">
          <span class="monogram" aria-hidden="true"></span>
          <span class="identity-copy">
            <strong>Afterlight</strong>
            <span>an electric nocturne</span>
          </span>
        </div>

        <div class="toolbar">
          <button class="control" id="soundButton" type="button" aria-pressed="false" aria-label="Turn sound on">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="control-label">Sound off</span>
          </button>
          <button class="control" id="pauseButton" type="button" aria-pressed="false" aria-label="Pause the display">
            <span class="pause-icon" aria-hidden="true"></span>
            <span class="control-label">Pause</span>
          </button>
        </div>
      </div>

      <div class="bottombar">
        <div class="show-state">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="actLabel">Act I · Ignition</span>
        </div>
        <div class="timeline" aria-hidden="true">
          <span class="timeline-fill" id="timelineFill"></span>
        </div>
        <div class="hint" id="hint">Tap the sky to compose</div>
      </div>
    </div>

    <p class="sr-only" id="announcer" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("sky");
      var ctx = canvas.getContext("2d", { alpha: false });
      var soundButton = document.getElementById("soundButton");
      var pauseButton = document.getElementById("pauseButton");
      var hint = document.getElementById("hint");
      var actLabel = document.getElementById("actLabel");
      var timelineFill = document.getElementById("timelineFill");
      var announcer = document.getElementById("announcer");

      var TAU = Math.PI * 2;
      var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var W = 0;
      var H = 0;
      var DPR = 1;
      var waterline = 0;
      var lastFrame = performance.now();
      var showClock = 0;
      var showIndex = 0;
      var paused = false;
      var soundOn = false;
      var audioContext = null;
      var noiseBuffer = null;
      var lastUiUpdate = 0;
      var pointerBursts = 0;

      var stars = [];
      var ridges = [];
      var buildings = [];
      var rockets = [];
      var particles = [];
      var flashes = [];
      var smoke = [];
      var ripples = [];

      var palettes = {
        gold: [34, 41, 48, 53],
        coral: [2, 9, 17, 28],
        aqua: [169, 181, 193, 205],
        violet: [252, 269, 286, 316],
        ice: [190, 204, 218, 44],
        festival: [8, 42, 173, 205, 274, 324]
      };

      var showEvents = [
        { t: .35,  x: .50, y: .28, type: "willow", p: "gold",     s: 1.04 },
        { t: 1.85, x: .27, y: .39, type: "peony",  p: "coral",    s: .82 },
        { t: 2.42, x: .73, y: .36, type: "peony",  p: "aqua",     s: .85 },
        { t: 3.72, x: .50, y: .32, type: "ring",   p: "violet",   s: 1.02 },
        { t: 5.02, x: .34, y: .43, type: "palm",   p: "gold",     s: .9 },
        { t: 5.56, x: .67, y: .42, type: "palm",   p: "coral",    s: .9 },
        { t: 6.96, x: .50, y: .39, type: "heart",  p: "coral",    s: .88 },
        { t: 8.46, x: .18, y: .29, type: "dahlia", p: "ice",      s: .94 },
        { t: 8.82, x: .50, y: .38, type: "dahlia", p: "violet",   s: .84 },
        { t: 9.18, x: .82, y: .30, type: "dahlia", p: "aqua",     s: .94 },
        { t: 10.75,x: .38, y: .31, type: "spiral", p: "festival", s: .96 },
        { t: 11.42,x: .68, y: .37, type: "ring",   p: "gold",     s: .8 },
        { t: 12.82,x: .25, y: .33, type: "willow", p: "gold",     s: .87 },
        { t: 13.28,x: .75, y: .31, type: "willow", p: "gold",     s: .87 },
        { t: 14.88,x: .42, y: .43, type: "peony",  p: "coral",    s: .78 },
        { t: 15.08,x: .58, y: .42, type: "peony",  p: "aqua",     s: .78 },
        { t: 16.32,x: .14, y: .38, type: "palm",   p: "violet",   s: .76 },
        { t: 16.55,x: .86, y: .37, type: "palm",   p: "coral",    s: .76 },
        { t: 17.02,x: .50, y: .25, type: "dahlia", p: "festival", s: 1.16 },
        { t: 18.78,x: .30, y: .28, type: "ring",   p: "ice",      s: .9 },
        { t: 18.94,x: .70, y: .28, type: "ring",   p: "violet",   s: .9 },
        { t: 20.05,x: .10, y: .43, type: "peony",  p: "gold",     s: .7 },
        { t: 20.20,x: .30, y: .36, type: "dahlia", p: "coral",    s: .85 },
        { t: 20.35,x: .50, y: .28, type: "dahlia", p: "festival", s: 1.06 },
        { t: 20.50,x: .70, y: .36, type: "dahlia", p: "aqua",     s: .85 },
        { t: 20.65,x: .90, y: .43, type: "peony",  p: "gold",     s: .7 },
        { t: 21.66,x: .22, y: .27, type: "willow", p: "gold",     s: 1.0 },
        { t: 21.86,x: .50, y: .23, type: "willow", p: "gold",     s: 1.12 },
        { t: 22.06,x: .78, y: .27, type: "willow", p: "gold",     s: 1.0 },
        { t: 23.05,x: .38, y: .36, type: "spiral", p: "coral",    s: .83 },
        { t: 23.18,x: .62, y: .35, type: "spiral", p: "aqua",     s: .83 }
      ];

      var SHOW_DURATION = 29;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, amount) {
        return a + (b - a) * amount;
      }

      function mulberry32(seed) {
        return function () {
          var t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function hsla(h, s, l, a) {
        h = ((h % 360) + 360) % 360;
        return "hsla(" + h.toFixed(1) + "," + s + "%," + l + "%," + clamp(a, 0, 1).toFixed(3) + ")";
      }

      function choose(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function buildScene() {
        var random = mulberry32(44721 + Math.round(W));
        stars = [];
        buildings = [];
        ridges = [];

        var starCount = Math.round(clamp(W * H / 6200, 85, 260));
        for (var i = 0; i < starCount; i++) {
          stars.push({
            x: random() * W,
            y: random() * waterline * .75,
            size: .25 + Math.pow(random(), 3) * 1.45,
            alpha: .2 + random() * .62,
            phase: random() * TAU,
            speed: .35 + random() * 1.1,
            warmth: random() > .84
          });
        }

        var ridgeSettings = [
          { base: .585, amp: .085, color: "#091120", seed: 19, step: 72 },
          { base: .655, amp: .064, color: "#070d18", seed: 31, step: 54 },
          { base: .704, amp: .036, color: "#040912", seed: 47, step: 40 }
        ];

        for (var r = 0; r < ridgeSettings.length; r++) {
          var cfg = ridgeSettings[r];
          var ridgeRandom = mulberry32(cfg.seed + Math.round(W * .1));
          var points = [];
          var x = -cfg.step;
          while (x <= W + cfg.step) {
            var peakNoise = .25 + ridgeRandom() * .75;
            points.push({
              x: x,
              y: H * cfg.base - H * cfg.amp * peakNoise
            });
            x += cfg.step * (.68 + ridgeRandom() * .62);
          }
          ridges.push({ points: points, base: waterline + 3, color: cfg.color });
        }

        var buildingRandom = mulberry32(9713 + Math.round(W));
        var bx = -8;
        while (bx < W + 10) {
          var bw = 8 + buildingRandom() * 22;
          var bh = 10 + Math.pow(buildingRandom(), 2.05) * Math.min(76, H * .095);
          var building = {
            x: bx,
            w: bw,
            h: bh,
            cap: buildingRandom(),
            lights: []
          };
          var columns = Math.max(1, Math.floor((bw - 5) / 6));
          var rows = Math.max(1, Math.floor((bh - 5) / 8));
          for (var cy = 0; cy < rows; cy++) {
            for (var cx = 0; cx < columns; cx++) {
              if (buildingRandom() > .86) {
                building.lights.push({
                  x: 3 + cx * 6,
                  y: 5 + cy * 8,
                  alpha: .25 + buildingRandom() * .5,
                  warm: buildingRandom() > .22
                });
              }
            }
          }
          buildings.push(building);
          bx += bw + 1 + buildingRandom() * 2;
        }
      }

      function resize() {
        W = Math.max(1, window.innerWidth);
        H = Math.max(1, window.innerHeight);
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        waterline = H * (W < 650 ? .76 : .735);
        buildScene();
      }

      function drawSky(now) {
        var sky = ctx.createLinearGradient(0, 0, 0, waterline);
        sky.addColorStop(0, "#02040c");
        sky.addColorStop(.42, "#071020");
        sky.addColorStop(.77, "#0b1b2e");
        sky.addColorStop(1, "#142438");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, waterline + 1);

        var coolGlow = ctx.createRadialGradient(W * .78, H * .14, 0, W * .78, H * .14, Math.min(W, H) * .48);
        coolGlow.addColorStop(0, "rgba(83, 108, 164, .13)");
        coolGlow.addColorStop(.46, "rgba(37, 59, 103, .05)");
        coolGlow.addColorStop(1, "rgba(6, 12, 27, 0)");
        ctx.fillStyle = coolGlow;
        ctx.fillRect(0, 0, W, waterline);

        var horizonGlow = ctx.createLinearGradient(0, waterline - H * .17, 0, waterline);
        horizonGlow.addColorStop(0, "rgba(20, 48, 76, 0)");
        horizonGlow.addColorStop(1, "rgba(46, 72, 92, .18)");
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(0, waterline - H * .18, W, H * .18);

        ctx.save();
        for (var i = 0; i < stars.length; i++) {
          var star = stars[i];
          var twinkle = .68 + Math.sin(now * .001 * star.speed + star.phase) * .32;
          var alpha = star.alpha * twinkle;
          ctx.fillStyle = star.warm
            ? "rgba(255, 231, 188, " + alpha.toFixed(3) + ")"
            : "rgba(218, 232, 255, " + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, TAU);
          ctx.fill();
          if (star.size > 1.1) {
            ctx.globalAlpha = alpha * .38;
            ctx.fillRect(star.x - star.size * 3, star.y - .35, star.size * 6, .7);
            ctx.fillRect(star.x - .35, star.y - star.size * 3, .7, star.size * 6);
            ctx.globalAlpha = 1;
          }
        }
        ctx.restore();

        drawMoon();
        drawClouds(now);
      }

      function drawMoon() {
        var mx = W * (W < 650 ? .79 : .82);
        var my = H * .145;
        var radius = clamp(Math.min(W, H) * .037, 18, 34);
        var halo = ctx.createRadialGradient(mx, my, radius * .35, mx, my, radius * 4.5);
        halo.addColorStop(0, "rgba(225, 233, 240, .17)");
        halo.addColorStop(.28, "rgba(193, 210, 228, .08)");
        halo.addColorStop(1, "rgba(146, 173, 205, 0)");
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(mx, my, radius * 4.5, 0, TAU);
        ctx.fill();

        var disc = ctx.createRadialGradient(mx - radius * .28, my - radius * .3, radius * .08, mx, my, radius);
        disc.addColorStop(0, "rgba(251, 247, 224, .96)");
        disc.addColorStop(.72, "rgba(220, 226, 218, .89)");
        disc.addColorStop(1, "rgba(167, 184, 190, .72)");
        ctx.fillStyle = disc;
        ctx.beginPath();
        ctx.arc(mx, my, radius, 0, TAU);
        ctx.fill();

        ctx.fillStyle = "rgba(99, 118, 127, .11)";
        ctx.beginPath();
        ctx.arc(mx + radius * .24, my - radius * .12, radius * .19, 0, TAU);
        ctx.arc(mx - radius * .31, my + radius * .22, radius * .13, 0, TAU);
        ctx.arc(mx + radius * .02, my + radius * .37, radius * .1, 0, TAU);
        ctx.fill();
      }

      function drawClouds(now) {
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        var drift = Math.sin(now * .00007) * W * .012;

        var cloud = ctx.createLinearGradient(0, H * .21, 0, H * .36);
        cloud.addColorStop(0, "rgba(97, 122, 157, 0)");
        cloud.addColorStop(.5, "rgba(97, 122, 157, .026)");
        cloud.addColorStop(1, "rgba(97, 122, 157, 0)");
        ctx.fillStyle = cloud;
        ctx.beginPath();
        ctx.ellipse(W * .26 + drift, H * .28, W * .24, H * .026, -.05, 0, TAU);
        ctx.ellipse(W * .62 - drift * .7, H * .42, W * .29, H * .032, .02, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawLandscape() {
        for (var r = 0; r < ridges.length; r++) {
          var ridge = ridges[r];
          ctx.fillStyle = ridge.color;
          ctx.beginPath();
          ctx.moveTo(ridge.points[0].x, ridge.base);
          for (var i = 0; i < ridge.points.length; i++) {
            var point = ridge.points[i];
            if (i === 0) {
              ctx.lineTo(point.x, point.y);
            } else {
              var prev = ridge.points[i - 1];
              var midX = (prev.x + point.x) * .5;
              ctx.quadraticCurveTo(prev.x, prev.y, midX, (prev.y + point.y) * .5);
            }
          }
          ctx.lineTo(W + 10, ridge.base);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawWater(now) {
        var water = ctx.createLinearGradient(0, waterline, 0, H);
        water.addColorStop(0, "#0a1725");
        water.addColorStop(.28, "#07121f");
        water.addColorStop(1, "#02060c");
        ctx.fillStyle = water;
        ctx.fillRect(0, waterline, W, H - waterline);

        var reflectedSky = ctx.createRadialGradient(W * .79, waterline, 0, W * .79, waterline, W * .34);
        reflectedSky.addColorStop(0, "rgba(87, 111, 145, .065)");
        reflectedSky.addColorStop(1, "rgba(7, 13, 24, 0)");
        ctx.fillStyle = reflectedSky;
        ctx.fillRect(0, waterline, W, H - waterline);

        ctx.save();
        for (var i = 0; i < 18; i++) {
          var yy = waterline + 7 + i * (H - waterline) / 18;
          var offset = Math.sin(now * .00045 + i * 1.73) * 16;
          var alpha = .035 + (1 - i / 18) * .025;
          ctx.strokeStyle = "rgba(139, 170, 196, " + alpha.toFixed(3) + ")";
          ctx.lineWidth = .6;
          ctx.setLineDash([18 + (i % 3) * 9, 25 + (i % 4) * 11]);
          ctx.lineDashOffset = offset;
          ctx.beginPath();
          ctx.moveTo(-30, yy);
          ctx.lineTo(W + 30, yy);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();

        drawCityReflections(now);
      }

      function drawCityReflections(now) {
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (var i = 0; i < buildings.length; i++) {
          var building = buildings[i];
          for (var j = 0; j < building.lights.length; j++) {
            var light = building.lights[j];
            if (j % 2 !== 0) continue;
            var lx = building.x + light.x;
            var pulse = .7 + Math.sin(now * .001 + lx) * .3;
            var length = 8 + light.alpha * 25;
            var gradient = ctx.createLinearGradient(lx, waterline, lx, waterline + length);
            var tone = light.warm ? "235, 186, 99" : "126, 190, 211";
            gradient.addColorStop(0, "rgba(" + tone + "," + (.1 * pulse).toFixed(3) + ")");
            gradient.addColorStop(1, "rgba(" + tone + ",0)");
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(lx, waterline + 1);
            ctx.lineTo(lx + Math.sin(lx) * 1.5, waterline + length);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawSkyline(now) {
        ctx.save();
        ctx.fillStyle = "#02050a";
        for (var i = 0; i < buildings.length; i++) {
          var b = buildings[i];
          var top = waterline - b.h;
          ctx.fillRect(b.x, top, b.w, b.h + 3);

          if (b.cap > .91) {
            ctx.fillRect(b.x + b.w * .45, top - 8, 1, 8);
            ctx.fillStyle = "rgba(255, 103, 76, .65)";
            ctx.fillRect(b.x + b.w * .45, top - 9, 1, 1);
            ctx.fillStyle = "#02050a";
          } else if (b.cap < .07 && b.w > 15) {
            ctx.beginPath();
            ctx.moveTo(b.x, top);
            ctx.lineTo(b.x + b.w * .5, top - 5);
            ctx.lineTo(b.x + b.w, top);
            ctx.closePath();
            ctx.fill();
          }

          for (var j = 0; j < b.lights.length; j++) {
            var light = b.lights[j];
            var shimmer = .8 + Math.sin(now * .0007 + i * 2.1 + j) * .2;
            ctx.fillStyle = light.warm
              ? "rgba(247, 194, 102, " + (light.alpha * shimmer).toFixed(3) + ")"
              : "rgba(126, 199, 223, " + (light.alpha * .75 * shimmer).toFixed(3) + ")";
            ctx.fillRect(b.x + light.x, top + light.y, 1.4, 1.2);
          }
        }

        ctx.strokeStyle = "rgba(122, 164, 191, .16)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, waterline + .5);
        ctx.lineTo(W, waterline + .5);
        ctx.stroke();

        ctx.fillStyle = "rgba(1, 4, 8, .9)";
        ctx.beginPath();
        ctx.moveTo(0, waterline + 2);
        ctx.quadraticCurveTo(W * .15, waterline - 3, W * .34, waterline + 2);
        ctx.quadraticCurveTo(W * .58, waterline + 7, W, waterline + 1);
        ctx.lineTo(W, waterline + 8);
        ctx.lineTo(0, waterline + 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawBackground(now) {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, W, H);
        drawSky(now);
        drawLandscape();
        drawWater(now);
        drawSkyline(now);
      }

      function addParticle(x, y, vx, vy, hue, options) {
        options = options || {};
        particles.push({
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          hue: hue,
          sat: options.sat === undefined ? 92 : options.sat,
          light: options.light === undefined ? 66 : options.light,
          age: 0,
          life: options.life || 1700,
          drag: options.drag || .986,
          gravity: options.gravity === undefined ? 82 : options.gravity,
          size: options.size || 1.15,
          trailMax: options.trail || 8,
          trail: [],
          trailClock: 0,
          twinkle: options.twinkle || 0,
          phase: Math.random() * TAU,
          crackle: !!options.crackle,
          cracked: false,
          wobble: options.wobble || 0,
          micro: !!options.micro
        });
      }

      function addFlash(x, y, hue, scale) {
        flashes.push({
          x: x,
          y: y,
          hue: hue,
          age: 0,
          life: 560,
          radius: 18 * scale,
          scale: scale
        });
        ripples.push({
          x: x,
          hue: hue,
          age: 0,
          life: 1200,
          power: scale
        });
      }

      function addSmoke(x, y, scale) {
        var count = reducedMotion ? 1 : 3;
        for (var i = 0; i < count; i++) {
          smoke.push({
            x: x + (Math.random() - .5) * 18 * scale,
            y: y + (Math.random() - .5) * 12 * scale,
            vx: -3 + Math.random() * 9,
            vy: -6 - Math.random() * 6,
            age: 0,
            life: 4100 + Math.random() * 1800,
            radius: (20 + Math.random() * 22) * scale,
            phase: Math.random() * TAU
          });
        }
      }

      function radialBurst(x, y, count, minSpeed, maxSpeed, palette, scale, options) {
        options = options || {};
        var rotation = options.rotation || 0;
        var ellipse = options.ellipse || 1;
        for (var i = 0; i < count; i++) {
          var angle = options.ordered ? rotation + i / count * TAU : rotation + Math.random() * TAU;
          var distribution = options.evenSpeed ? .84 + Math.random() * .16 : Math.pow(Math.random(), .28);
          var speed = lerp(minSpeed, maxSpeed, distribution) * scale;
          var vx = Math.cos(angle) * speed;
          var vy = Math.sin(angle) * speed * ellipse;
          addParticle(x, y, vx, vy, choose(palette) + (Math.random() - .5) * 5, {
            life: (options.life || 1700) * (.82 + Math.random() * .34),
            drag: options.drag || .986,
            gravity: options.gravity === undefined ? 82 : options.gravity,
            size: (options.size || 1.2) * (.72 + Math.random() * .58),
            trail: options.trail || 8,
            twinkle: options.twinkle || 0,
            crackle: options.crackle && Math.random() < options.crackle,
            light: options.light || 66,
            sat: options.sat || 92,
            wobble: options.wobble || 0
          });
        }
      }

      function burst(x, y, type, paletteName, scale) {
        var palette = palettes[paletteName] || palettes.gold;
        var quality = reducedMotion ? .38 : (W < 680 ? .72 : 1);
        var coreHue = choose(palette);
        addFlash(x, y, coreHue, scale);
        addSmoke(x, y, scale);
        boomSound(scale);

        if (type === "willow") {
          radialBurst(x, y, Math.round(190 * scale * quality), 105, 305, palettes.gold, scale, {
            life: 3150,
            drag: .992,
            gravity: 78,
            trail: 17,
            size: 1.05,
            twinkle: .28,
            crackle: .09,
            light: 69,
            sat: 86
          });
          radialBurst(x, y, Math.round(34 * quality), 70, 170, [46, 51], scale, {
            life: 1180,
            drag: .982,
            gravity: 62,
            trail: 6,
            size: 1.4,
            light: 82,
            sat: 72
          });
        } else if (type === "ring") {
          var rings = scale > .95 ? 2 : 1;
          for (var ring = 0; ring < rings; ring++) {
            radialBurst(x, y, Math.round((96 + ring * 34) * quality), 242 + ring * 48, 252 + ring * 52, palette, scale, {
              ordered: true,
              evenSpeed: true,
              rotation: Math.random() * TAU,
              ellipse: .82,
              life: 1780 + ring * 150,
              drag: .986,
              gravity: 62,
              trail: 8,
              size: ring ? .95 : 1.35,
              twinkle: .22,
              light: ring ? 64 : 74
            });
          }
          radialBurst(x, y, Math.round(34 * quality), 55, 145, [45, 48, 52], scale, {
            life: 980,
            trail: 4,
            size: 1.15,
            light: 83,
            sat: 60
          });
        } else if (type === "palm") {
          var branches = Math.round(16 * quality);
          for (var b = 0; b < branches; b++) {
            var branchAngle = b / branches * TAU + (Math.random() - .5) * .06;
            var branchHue = choose(palette);
            var pieces = 8;
            for (var k = 0; k < pieces; k++) {
              var branchSpeed = (105 + k * 27 + Math.random() * 12) * scale;
              addParticle(x, y,
                Math.cos(branchAngle) * branchSpeed,
                Math.sin(branchAngle) * branchSpeed,
                branchHue + (Math.random() - .5) * 3, {
                  life: 1580 + k * 95 + Math.random() * 270,
                  drag: .989,
                  gravity: 88,
                  trail: 11,
                  size: 1.55 - k * .055,
                  twinkle: .16,
                  crackle: k > 5,
                  light: 70
                });
            }
          }
        } else if (type === "heart") {
          var heartCount = Math.round(138 * quality);
          var tilt = (Math.random() - .5) * .12;
          for (var h = 0; h < heartCount; h++) {
            var t = h / heartCount * TAU;
            var hx = 16 * Math.pow(Math.sin(t), 3);
            var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            var heartVx = hx * 17.5 * scale;
            var heartVy = -hy * 17.5 * scale;
            var rotatedX = heartVx * Math.cos(tilt) - heartVy * Math.sin(tilt);
            var rotatedY = heartVx * Math.sin(tilt) + heartVy * Math.cos(tilt);
            addParticle(x, y, rotatedX, rotatedY, choose(palette) + Math.random() * 8, {
              life: 2200 + Math.random() * 260,
              drag: .989,
              gravity: 48,
              trail: 9,
              size: 1.25,
              twinkle: .24,
              light: 69
            });
          }
          radialBurst(x, y, Math.round(35 * quality), 55, 125, [42, 48], scale, {
            life: 900,
            trail: 4,
            light: 86,
            sat: 55
          });
        } else if (type === "spiral") {
          var spiralCount = Math.round(164 * quality);
          for (var s = 0; s < spiralCount; s++) {
            var arm = s % 5;
            var progress = s / spiralCount;
            var spiralAngle = arm / 5 * TAU + progress * TAU * 2.2;
            var spiralSpeed = (90 + progress * 245) * scale;
            addParticle(x, y,
              Math.cos(spiralAngle) * spiralSpeed,
              Math.sin(spiralAngle) * spiralSpeed,
              palette[(arm + Math.floor(progress * palette.length)) % palette.length], {
                life: 1850 + Math.random() * 420,
                drag: .988,
                gravity: 70,
                trail: 10,
                size: 1.16,
                twinkle: .3,
                wobble: .45,
                light: 69
              });
          }
        } else if (type === "dahlia") {
          radialBurst(x, y, Math.round(178 * scale * quality), 105, 325, palette, scale, {
            life: 2050,
            drag: .988,
            gravity: 76,
            trail: 10,
            size: 1.15,
            twinkle: .2,
            crackle: .12,
            light: 67
          });
          radialBurst(x, y, Math.round(74 * quality), 85, 182, [42, 48, 54], scale, {
            life: 1260,
            drag: .984,
            gravity: 58,
            trail: 7,
            size: 1.38,
            twinkle: .18,
            light: 85,
            sat: 52
          });
        } else {
          radialBurst(x, y, Math.round(145 * scale * quality), 130, 292, palette, scale, {
            life: 1750,
            drag: .987,
            gravity: 82,
            trail: 8,
            size: 1.25,
            twinkle: .18,
            crackle: .09,
            light: 68
          });
          radialBurst(x, y, Math.round(38 * quality), 60, 150, [44, 49], scale, {
            life: 920,
            trail: 5,
            light: 84,
            sat: 58
          });
        }

        if (particles.length > 3900) {
          particles.splice(0, particles.length - 3900);
        }
      }

      function Rocket(targetX, targetY, type, palette, scale) {
        this.startX = clamp(targetX + (Math.random() - .5) * W * .12, 22, W - 22);
        this.startY = waterline + 24 + Math.random() * 18;
        this.controlX = lerp(this.startX, targetX, .52) + (Math.random() - .5) * 42;
        this.controlY = lerp(this.startY, targetY, .54);
        this.targetX = targetX;
        this.targetY = targetY;
        this.x = this.startX;
        this.y = this.startY;
        this.lastX = this.x;
        this.lastY = this.y;
        this.type = type;
        this.palette = palette;
        this.scale = scale;
        this.hue = choose(palettes[palette] || palettes.gold);
        this.age = 0;
        this.duration = clamp(720 + (this.startY - targetY) * .42 + Math.random() * 180, 760, 1260);
        this.trail = [];
        this.sparkClock = 0;
        launchSound();
      }

      Rocket.prototype.update = function (dt) {
        this.age += dt;
        this.sparkClock += dt;
        var raw = clamp(this.age / this.duration, 0, 1);
        var t = 1 - Math.pow(1 - raw, 1.22);
        var inv = 1 - t;
        this.lastX = this.x;
        this.lastY = this.y;
        this.x = inv * inv * this.startX + 2 * inv * t * this.controlX + t * t * this.targetX;
        this.y = inv * inv * this.startY + 2 * inv * t * this.controlY + t * t * this.targetY;

        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > 18) this.trail.pop();

        if (this.sparkClock > 32 && raw < .94) {
          this.sparkClock = 0;
          addParticle(this.x, this.y,
            (Math.random() - .5) * 24,
            32 + Math.random() * 45,
            this.hue + (Math.random() - .5) * 6, {
              life: 300 + Math.random() * 220,
              drag: .968,
              gravity: 50,
              trail: 3,
              size: .75,
              twinkle: .25,
              light: 76,
              micro: true
            });
        }

        if (raw >= 1) {
          burst(this.targetX, this.targetY, this.type, this.palette, this.scale);
          return false;
        }
        return true;
      };

      Rocket.prototype.draw = function () {
        var alpha = 1 - Math.pow(clamp(this.age / this.duration, 0, 1), 6) * .42;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        if (this.trail.length > 1) {
          var tail = ctx.createLinearGradient(this.x, this.y, this.trail[this.trail.length - 1].x, this.trail[this.trail.length - 1].y);
          tail.addColorStop(0, hsla(this.hue, 82, 88, alpha));
          tail.addColorStop(.22, hsla(this.hue, 88, 66, alpha * .74));
          tail.addColorStop(1, hsla(this.hue, 90, 54, 0));
          ctx.strokeStyle = tail;
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          for (var i = 1; i < this.trail.length; i++) {
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
          }
          ctx.stroke();
        }
        ctx.shadowColor = hsla(this.hue, 94, 70, .9);
        ctx.shadowBlur = 14;
        ctx.fillStyle = "rgba(255, 250, 226, " + alpha.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.65, 0, TAU);
        ctx.fill();
        ctx.restore();
      };

      function launchNormalized(nx, ny, type, palette, scale) {
        var targetX = clamp(nx * W, 28, W - 28);
        var targetY = clamp(ny * H, H * .09, waterline - 70);
        rockets.push(new Rocket(targetX, targetY, type, palette, scale));
      }

      function launchAt(x, y) {
        var types = ["dahlia", "ring", "peony", "spiral", "willow", "palm", "heart"];
        var paletteNames = ["gold", "coral", "aqua", "violet", "ice", "festival"];
        var type = types[pointerBursts % types.length];
        var palette = paletteNames[(pointerBursts * 3 + 1) % paletteNames.length];
        pointerBursts++;
        var targetX = clamp(x, 26, W - 26);
        var targetY = clamp(y, H * .1, waterline - 72);
        rockets.push(new Rocket(targetX, targetY, type, palette, .78 + Math.random() * .24));
      }

      function updateShow(dt) {
        showClock += dt / 1000;
        while (showIndex < showEvents.length && showEvents[showIndex].t <= showClock) {
          var event = showEvents[showIndex];
          launchNormalized(event.x, event.y, event.type, event.p, event.s);
          showIndex++;
        }
        if (showClock >= SHOW_DURATION) {
          showClock = 0;
          showIndex = 0;
        }
      }

      function updateParticles(dt) {
        var seconds = dt / 1000;
        var frameScale = dt / 16.6667;
        var survivors = [];
        var crackles = [];

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.age += dt;
          if (p.age >= p.life) continue;

          p.trailClock += dt;
          if (p.trailClock >= 24) {
            p.trailClock = 0;
            p.trail.unshift({ x: p.x, y: p.y });
            if (p.trail.length > p.trailMax) p.trail.pop();
          }

          var drag = Math.pow(p.drag, frameScale);
          p.vx *= drag;
          p.vy *= drag;
          if (p.wobble) {
            p.vx += Math.sin(p.age * .011 + p.phase) * p.wobble * frameScale;
          }
          p.vy += p.gravity * seconds;
          p.x += p.vx * seconds;
          p.y += p.vy * seconds;

          if (p.crackle && !p.cracked && p.age > p.life * .72) {
            p.cracked = true;
            var crackCount = reducedMotion ? 1 : 3;
            for (var c = 0; c < crackCount; c++) {
              crackles.push({
                x: p.x,
                y: p.y,
                vx: (Math.random() - .5) * 82,
                vy: (Math.random() - .5) * 82,
                hue: p.hue
              });
            }
          }
          survivors.push(p);
        }
        particles = survivors;

        for (var k = 0; k < crackles.length && particles.length < 3900; k++) {
          var crack = crackles[k];
          addParticle(crack.x, crack.y, crack.vx, crack.vy, crack.hue, {
            life: 360 + Math.random() * 260,
            drag: .958,
            gravity: 85,
            trail: 2,
            size: .62,
            twinkle: .7,
            light: 84,
            sat: 68,
            micro: true
          });
        }
      }

      function updateAtmosphere(dt) {
        for (var i = flashes.length - 1; i >= 0; i--) {
          flashes[i].age += dt;
          if (flashes[i].age >= flashes[i].life) flashes.splice(i, 1);
        }
        for (var s = smoke.length - 1; s >= 0; s--) {
          var puff = smoke[s];
          puff.age += dt;
          puff.x += puff.vx * dt / 1000;
          puff.y += puff.vy * dt / 1000;
          puff.radius += dt * .009;
          if (puff.age >= puff.life) smoke.splice(s, 1);
        }
        for (var r = ripples.length - 1; r >= 0; r--) {
          ripples[r].age += dt;
          if (ripples[r].age >= ripples[r].life) ripples.splice(r, 1);
        }
      }

      function drawSmoke() {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, waterline);
        ctx.clip();
        ctx.globalCompositeOperation = "screen";
        for (var i = 0; i < smoke.length; i++) {
          var puff = smoke[i];
          var life = 1 - puff.age / puff.life;
          var alpha = Math.sin(Math.min(1, puff.age / 500) * Math.PI * .5) * life * .08;
          var radius = puff.radius;
          var gradient = ctx.createRadialGradient(puff.x, puff.y, 0, puff.x, puff.y, radius);
          gradient.addColorStop(0, "rgba(129, 145, 164, " + alpha.toFixed(3) + ")");
          gradient.addColorStop(.45, "rgba(86, 104, 128, " + (alpha * .55).toFixed(3) + ")");
          gradient.addColorStop(1, "rgba(43, 59, 80, 0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(puff.x, puff.y, radius, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFlashes() {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, waterline);
        ctx.clip();
        ctx.globalCompositeOperation = "lighter";
        for (var i = 0; i < flashes.length; i++) {
          var flash = flashes[i];
          var progress = flash.age / flash.life;
          var alpha = Math.pow(1 - progress, 3);
          var radius = flash.radius + progress * 88 * flash.scale;
          var glow = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, radius);
          glow.addColorStop(0, "rgba(255,255,246," + (.93 * alpha).toFixed(3) + ")");
          glow.addColorStop(.08, hsla(flash.hue, 86, 76, .65 * alpha));
          glow.addColorStop(.34, hsla(flash.hue, 82, 58, .16 * alpha));
          glow.addColorStop(1, hsla(flash.hue, 80, 45, 0));
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(flash.x, flash.y, radius, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawReflections(now) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, waterline + 1, W, H - waterline);
        ctx.clip();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";

        for (var i = 0; i < ripples.length; i++) {
          var ripple = ripples[i];
          var progress = ripple.age / ripple.life;
          var alpha = Math.pow(1 - progress, 2) * .24 * ripple.power;
          var maxBands = 11;
          for (var b = 0; b < maxBands; b++) {
            var yy = waterline + 5 + b * (H - waterline) / 15;
            var spread = 5 + b * 3.2 + progress * 20;
            var shimmer = Math.sin(now * .018 + b * 2.7 + ripple.x) * (2 + b * .45);
            ctx.strokeStyle = hsla(ripple.hue, 82, 64, alpha * (1 - b / maxBands));
            ctx.lineWidth = Math.max(.5, 1.5 - b * .07);
            ctx.beginPath();
            ctx.moveTo(ripple.x - spread + shimmer, yy);
            ctx.lineTo(ripple.x + spread + shimmer, yy);
            ctx.stroke();
          }
        }

        for (var r = 0; r < rockets.length; r++) {
          var rocket = rockets[r];
          if (rocket.y > waterline) continue;
          var reflectedY = waterline + (waterline - rocket.y) * .16;
          ctx.strokeStyle = hsla(rocket.hue, 85, 66, .13);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(rocket.x - 5, reflectedY);
          ctx.lineTo(rocket.x + 5, reflectedY);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawParticles() {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, waterline + 1);
        ctx.clip();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var progress = p.age / p.life;
          var envelope = Math.min(1, p.age / 70) * Math.pow(1 - progress, p.micro ? 1.45 : .72);
          var twinkle = p.twinkle
            ? lerp(1, .32 + Math.abs(Math.sin(p.age * .025 + p.phase)) * .68, p.twinkle)
            : 1;
          var alpha = envelope * twinkle;

          if (p.trail.length > 0) {
            ctx.strokeStyle = hsla(p.hue, p.sat, p.light, alpha * .44);
            ctx.lineWidth = Math.max(.45, p.size * (1 - progress * .42));
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            for (var t = 0; t < p.trail.length; t++) {
              ctx.lineTo(p.trail[t].x, p.trail[t].y);
            }
            ctx.stroke();
          }

          ctx.fillStyle = hsla(p.hue, Math.max(38, p.sat - 15), Math.min(91, p.light + 15), alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(.35, p.size * (1 - progress * .28)), 0, TAU);
          ctx.fill();

          if (p.size > 1.3 && alpha > .42) {
            ctx.fillStyle = "rgba(255,255,247," + (alpha * .46).toFixed(3) + ")";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * .36, 0, TAU);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawRockets() {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, waterline + 1);
        ctx.clip();
        for (var i = 0; i < rockets.length; i++) rockets[i].draw();
        ctx.restore();
      }

      function updateUi(now) {
        if (now - lastUiUpdate < 100) return;
        lastUiUpdate = now;
        var label;
        if (showClock < 7.4) label = "Act I · Ignition";
        else if (showClock < 15.8) label = "Act II · Bloom";
        else if (showClock < 24.2) label = "Act III · Afterlight";
        else label = "Interlude · Embers";
        actLabel.textContent = paused ? "Display paused" : label;
        timelineFill.style.width = (showClock / SHOW_DURATION * 100).toFixed(2) + "%";
      }

      function frame(now) {
        var dt = Math.min(34, Math.max(0, now - lastFrame));
        lastFrame = now;

        if (!paused) {
          updateShow(dt);
          rockets = rockets.filter(function (rocket) { return rocket.update(dt); });
          updateParticles(dt);
          updateAtmosphere(dt);
        }

        drawBackground(now);
        drawReflections(now);
        drawSmoke();
        drawFlashes();
        drawRockets();
        drawParticles();
        updateUi(now);
        requestAnimationFrame(frame);
      }

      function ensureAudio() {
        if (!audioContext) {
          var AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return null;
          audioContext = new AudioCtor();
        }
        if (audioContext.state === "suspended") audioContext.resume();
        return audioContext;
      }

      function getNoiseBuffer() {
        var ac = ensureAudio();
        if (!ac) return null;
        if (noiseBuffer) return noiseBuffer;
        noiseBuffer = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        var channel = noiseBuffer.getChannelData(0);
        var last = 0;
        for (var i = 0; i < channel.length; i++) {
          var white = Math.random() * 2 - 1;
          last = last * .985 + white * .15;
          channel[i] = last;
        }
        return noiseBuffer;
      }

      function launchSound() {
        if (!soundOn) return;
        var ac = ensureAudio();
        if (!ac) return;
        var now = ac.currentTime;
        var oscillator = ac.createOscillator();
        var gain = ac.createGain();
        var filter = ac.createBiquadFilter();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(185 + Math.random() * 45, now);
        oscillator.frequency.exponentialRampToValueAtTime(58, now + .72);
        filter.type = "lowpass";
        filter.frequency.value = 950;
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.022, now + .05);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .74);
        oscillator.connect(filter).connect(gain).connect(ac.destination);
        oscillator.start(now);
        oscillator.stop(now + .76);
      }

      function boomSound(scale) {
        if (!soundOn) return;
        var ac = ensureAudio();
        var buffer = getNoiseBuffer();
        if (!ac || !buffer) return;
        var now = ac.currentTime;

        var noise = ac.createBufferSource();
        var filter = ac.createBiquadFilter();
        var gain = ac.createGain();
        noise.buffer = buffer;
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(680 + Math.random() * 280, now);
        filter.frequency.exponentialRampToValueAtTime(90, now + 1.25);
        gain.gain.setValueAtTime(.12 * Math.min(scale, 1.1), now);
        gain.gain.exponentialRampToValueAtTime(.0001, now + 1.38);
        noise.connect(filter).connect(gain).connect(ac.destination);
        noise.start(now, Math.random() * .25);
        noise.stop(now + 1.42);

        var bass = ac.createOscillator();
        var bassGain = ac.createGain();
        bass.type = "sine";
        bass.frequency.setValueAtTime(74 + Math.random() * 16, now);
        bass.frequency.exponentialRampToValueAtTime(29, now + .62);
        bassGain.gain.setValueAtTime(.0001, now);
        bassGain.gain.exponentialRampToValueAtTime(.11 * Math.min(scale, 1.1), now + .012);
        bassGain.gain.exponentialRampToValueAtTime(.0001, now + .7);
        bass.connect(bassGain).connect(ac.destination);
        bass.start(now);
        bass.stop(now + .74);
      }

      function toggleSound() {
        soundOn = !soundOn;
        if (soundOn) ensureAudio();
        soundButton.setAttribute("aria-pressed", String(soundOn));
        soundButton.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
        soundButton.querySelector(".control-label").textContent = soundOn ? "Sound on" : "Sound off";
        announcer.textContent = soundOn ? "Sound on" : "Sound off";
      }

      function togglePause() {
        paused = !paused;
        pauseButton.setAttribute("aria-pressed", String(paused));
        pauseButton.setAttribute("aria-label", paused ? "Resume the display" : "Pause the display");
        pauseButton.querySelector(".control-label").textContent = paused ? "Resume" : "Pause";
        announcer.textContent = paused ? "Fireworks paused" : "Fireworks resumed";
      }

      soundButton.addEventListener("click", toggleSound);
      pauseButton.addEventListener("click", togglePause);

      canvas.addEventListener("pointerdown", function (event) {
        if (paused) return;
        launchAt(event.clientX, event.clientY);
        hint.classList.add("dismissed");
      });

      window.addEventListener("keydown", function (event) {
        if (event.code === "Space") {
          event.preventDefault();
          if (!paused) {
            launchAt(W * (.2 + Math.random() * .6), H * (.18 + Math.random() * .34));
            hint.classList.add("dismissed");
          }
        } else if (event.key.toLowerCase() === "p") {
          togglePause();
        } else if (event.key.toLowerCase() === "m") {
          toggleSound();
        }
      });

      document.addEventListener("visibilitychange", function () {
        lastFrame = performance.now();
      });

      var resizeTimer = 0;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 100);
      });

      resize();
      requestAnimationFrame(frame);
    }());
  </script>
</body>
</html>
