<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ant Colony Simulation</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #f0e4d8; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="simCanvas"></canvas>
<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Simulation parameters
  const ANT_COUNT = 150;
  const ANT_SPEED = 2.5;
  const WANDER_STRENGTH = 0.6;

  const nest = { x: canvas.width / 2, y: canvas.height / 2, radius: 25 };
  const foods = [];
  
  // Add some random food
  for (let i = 0; i < 8; i++) {
    foods.push({
      x: 50 + Math.random() * (canvas.width - 100),
      y: 50 + Math.random() * (canvas.height - 100),
      radius: 10 + Math.random() * 25,
      amount: 1000
    });
  }

  const ants = [];
  for (let i = 0; i < ANT_COUNT; i++) {
    ants.push({
      x: nest.x,
      y: nest.y,
      vx: (Math.random() - 0.5) * ANT_SPEED,
      vy: (Math.random() - 0.5) * ANT_SPEED,
      hasFood: false
    });
  }

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw nest
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.arc(nest.x, nest.y, nest.radius, 0, Math.PI * 2);
    ctx.fill();

    // Draw food
    ctx.fillStyle = '#228B22';
    for (let f of foods) {
      if (f.amount > 0) {
        ctx.beginPath();
        const currentRadius = f.radius * Math.max(0.2, (f.amount / 1000));
        ctx.arc(f.x, f.y, currentRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Update and draw ants
    for (let ant of ants) {
      if (ant.hasFood) {
        // Go home
        const dx = nest.x - ant.x;
        const dy = nest.y - ant.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < nest.radius) {
          ant.hasFood = false;
        } else {
          ant.vx += (dx / dist) * 0.15;
          ant.vy += (dy / dist) * 0.15;
        }
      } else {
        // Find food
        let smellingFood = false;
        for (let f of foods) {
          if (f.amount > 0) {
            const dx = f.x - ant.x;
            const dy = f.y - ant.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const currentRadius = f.radius * Math.max(0.2, (f.amount / 1000));
            if (dist < currentRadius) {
              ant.hasFood = true;
              f.amount -= 5;
              break;
            } else if (dist < 150) {
              ant.vx += (dx / dist) * 0.1;
              ant.vy += (dy / dist) * 0.1;
              smellingFood = true;
            }
          }
        }
      }

      // Wander
      ant.vx += (Math.random() - 0.5) * WANDER_STRENGTH;
      ant.vy += (Math.random() - 0.5) * WANDER_STRENGTH;

      // Normalize speed
      const speed = Math.sqrt(ant.vx*ant.vx + ant.vy*ant.vy);
      if (speed > 0) {
        ant.vx = (ant.vx / speed) * ANT_SPEED;
        ant.vy = (ant.vy / speed) * ANT_SPEED;
      }

      // Update position
      ant.x += ant.vx;
      ant.y += ant.vy;

      // Boundaries
      if (ant.x < 0 || ant.x > canvas.width) { ant.vx *= -1; ant.x = Math.max(0, Math.min(canvas.width, ant.x)); }
      if (ant.y < 0 || ant.y > canvas.height) { ant.vy *= -1; ant.y = Math.max(0, Math.min(canvas.height, ant.y)); }

      // Draw ant
      ctx.fillStyle = ant.hasFood ? '#FF4500' : '#000000';
      ctx.fillRect(ant.x - 1.5, ant.y - 1.5, 3, 3);
    }

    requestAnimationFrame(update);
  }

  update();
</script>
</body>
</html>
