<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Colony Simulation</title>
    <style>
        :root {
            --bg-color: #050507;
            --accent-color: #c9aa88;
            --text-main: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 2;
        }

        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            background: rgba(10, 10, 12, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(0);
            animation: slideIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        header h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
        }

        .controls-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-hint::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #6ee7b7;
            box-shadow: 0 0 8px #6ee7b7;
        }
        
        #interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    
    <div id="ui">
        <header>
            <h1>Myrmidon</h1>
            <p>Emergent swarm intelligence exploring pheromone-based pathfinding.</p>
        </header>
        <div class="stat-grid">
            <div class="stat">
                <span class="stat-label">Population</span>
                <span class="stat-value" id="val-pop">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Resources</span>
                <span class="stat-value" id="val-food">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Efficiency</span>
                <span class="stat-value" id="val-eff">0/s</span>
            </div>
            <div class="stat">
                <span class="stat-label">Cycle</span>
                <span class="stat-value" id="val-cycle">0</span>
            </div>
        </div>
        <div class="controls-hint">
            Click anywhere to drop resource clusters
        </div>
    </div>

    <canvas id="simCanvas"></canvas>
    <div id="interaction-layer"></div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const interactionLayer = document.getElementById('interaction-layer');
        
        let width, height;
        let dpr = window.devicePixelRatio || 1;
        
        const SIM = {
            numAnts: 1200,
            antSpeed: 1.8,
            antTurnSpeed: 0.2,
            sensorDist: 25,
            sensorAngle: Math.PI / 4,
            sensorSize: 3,
            wanderStrength: 0.3,
            pheromoneDecay: 0.992,
            gridSize: 6,
            nestRadius: 40,
            foodRadiusMax: 60,
        };

        let cycle = 0;
        let totalFoodCollected = 0;
        let foodHistory = [];
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            initGrid();
        }
        window.addEventListener('resize', resize);

        let cols, rows;
        let pHome;
        let pFood;

        function initGrid() {
            cols = Math.ceil(width / SIM.gridSize);
            rows = Math.ceil(height / SIM.gridSize);
            const totalCells = cols * rows;
            pHome = new Float32Array(totalCells);
            pFood = new Float32Array(totalCells);
        }
        
        function getGridIndex(x, y) {
            const c = (x / SIM.gridSize) | 0;
            const r = (y / SIM.gridSize) | 0;
            if (c < 0 || c >= cols || r < 0 || r >= rows) return -1;
            return r * cols + c;
        }

        const nest = {
            x: 0,
            y: 0,
            energy: 0
        };

        let foods = [];

        class Ant {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.hasFood = false;
                this.speed = SIM.antSpeed * (0.9 + Math.random() * 0.2); 
                this.wanderAngle = 0;
            }

            sense(pheromoneArray) {
                const leftAngle = this.angle - SIM.sensorAngle;
                const rightAngle = this.angle + SIM.sensorAngle;
                
                const senseForward = this.readSensor(this.angle, pheromoneArray);
                const senseLeft = this.readSensor(leftAngle, pheromoneArray);
                const senseRight = this.readSensor(rightAngle, pheromoneArray);

                if (senseForward > senseLeft && senseForward > senseRight) {
                    this.wanderAngle += (Math.random() - 0.5) * 0.1;
                } else if (senseForward < senseLeft && senseForward < senseRight) {
                    this.angle += (Math.random() > 0.5 ? 1 : -1) * SIM.antTurnSpeed;
                } else if (senseLeft > senseRight) {
                    this.angle -= SIM.antTurnSpeed;
                } else if (senseRight > senseLeft) {
                    this.angle += SIM.antTurnSpeed;
                }
            }
            
            readSensor(angle, array) {
                const sx = this.x + Math.cos(angle) * SIM.sensorDist;
                const sy = this.y + Math.sin(angle) * SIM.sensorDist;
                
                let sum = 0;
                let count = 0;
                
                const offsets = [[0,0], [1,0], [-1,0], [0,1], [0,-1]];
                
                for(let off of offsets) {
                    const idx = getGridIndex(sx + off[0]*SIM.gridSize, sy + off[1]*SIM.gridSize);
                    if (idx !== -1) {
                        sum += array[idx];
                        count++;
                    }
                }
                
                return count > 0 ? sum / count : 0;
            }

            update() {
                this.wanderAngle += (Math.random() - 0.5) * SIM.wanderStrength;
                this.angle += this.wanderAngle * 0.1;
                
                const idx = getGridIndex(this.x, this.y);

                if (this.hasFood) {
                    const dx = nest.x - this.x;
                    const dy = nest.y - this.y;
                    const distToNestSq = dx*dx + dy*dy;
                    
                    if (distToNestSq < SIM.nestRadius * SIM.nestRadius) {
                        this.hasFood = false;
                        this.angle += Math.PI;
                        totalFoodCollected++;
                        nest.energy = Math.min(1.0, nest.energy + 0.05);
                    } else if (distToNestSq < 40000) {
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle += this.getAngleDiff(targetAngle) * 0.1;
                    } else {
                        this.sense(pHome);
                    }
                    
                    if (idx !== -1) {
                        pFood[idx] = Math.min(255, pFood[idx] + 80);
                    }
                    
                } else {
                    let foundFood = false;
                    
                    for (let i = foods.length - 1; i >= 0; i--) {
                        let f = foods[i];
                        if (f.amount <= 0) continue;
                        
                        const dx = f.x - this.x;
                        const dy = f.y - this.y;
                        const distSq = dx*dx + dy*dy;
                        const rSq = f.radius * f.radius;
                        
                        if (distSq < rSq) {
                            this.hasFood = true;
                            this.angle += Math.PI;
                            f.amount -= 2;
                            foundFood = true;
                            f.pulse = 1.0;
                            break;
                        } else if (distSq < rSq + 20000) {
                            const targetAngle = Math.atan2(dy, dx);
                            this.angle += this.getAngleDiff(targetAngle) * 0.15;
                        }
                    }
                    
                    if (!foundFood) {
                        this.sense(pFood);
                        
                        if (idx !== -1) {
                            pHome[idx] = Math.min(255, pHome[idx] + 5);
                        }
                    }
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                const margin = 5;
                if (this.x < margin || this.x > width - margin || this.y < margin || this.y > height - margin) {
                    this.angle += Math.PI * 0.5 + Math.random() * Math.PI;
                    this.x = Math.max(margin, Math.min(width - margin, this.x));
                    this.y = Math.max(margin, Math.min(height - margin, this.y));
                }
            }
            
            getAngleDiff(target) {
                let diff = target - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                return diff;
            }
        }

        let ants = [];

        function setup() {
            resize();
            
            nest.x = width / 2;
            nest.y = height / 2;
            
            ants = [];
            for (let i = 0; i < SIM.numAnts; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = Math.random() * SIM.nestRadius;
                ants.push(new Ant(nest.x + Math.cos(a)*r, nest.y + Math.sin(a)*r));
            }
            
            spawnFood(width * 0.2, height * 0.2, 3000);
            spawnFood(width * 0.8, height * 0.3, 4000);
            spawnFood(width * 0.7, height * 0.8, 5000);
            spawnFood(width * 0.3, height * 0.7, 2000);

            document.getElementById('val-pop').textContent = SIM.numAnts.toLocaleString();
        }

        function spawnFood(x, y, amount) {
            foods.push({
                x: x,
                y: y,
                amount: amount,
                maxAmount: amount,
                radius: SIM.foodRadiusMax * (Math.min(1, amount/5000)),
                pulse: 0
            });
        }

        interactionLayer.addEventListener('click', (e) => {
            const rect = interactionLayer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            spawnFood(x, y, 4000 + Math.random() * 2000);
        });

        function updatePheromones() {
            for (let i = 0; i < pHome.length; i++) {
                pHome[i] *= SIM.pheromoneDecay;
                pFood[i] *= SIM.pheromoneDecay;
                
                if (pHome[i] < 0.1) pHome[i] = 0;
                if (pFood[i] < 0.1) pFood[i] = 0;
            }
        }

        function drawPheromones() {
            ctx.globalCompositeOperation = 'screen';
            const gs = SIM.gridSize;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    const h = pHome[idx];
                    const f = pFood[idx];
                    
                    if (h > 1 || f > 1) {
                        const hNorm = Math.min(1, h / 100);
                        const fNorm = Math.min(1, f / 150);
                        
                        const rCol = Math.floor(hNorm * 80 + fNorm * 20);
                        const gCol = Math.floor(hNorm * 60 + fNorm * 220);
                        const bCol = Math.floor(hNorm * 180 + fNorm * 100);
                        const aCol = Math.max(hNorm * 0.4, fNorm * 0.8);
                        
                        ctx.fillStyle = `rgba(${rCol}, ${gCol}, ${bCol}, ${aCol})`;
                        ctx.fillRect(c * gs, r * gs, gs, gs);
                    }
                }
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawNest() {
            const rad = SIM.nestRadius * 1.5 + (nest.energy * 20);
            const grad = ctx.createRadialGradient(nest.x, nest.y, 0, nest.x, nest.y, rad);
            grad.addColorStop(0, 'rgba(212, 140, 80, 0.4)');
            grad.addColorStop(0.4, 'rgba(180, 90, 40, 0.2)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(nest.x, nest.y, rad, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#110a05';
            ctx.beginPath();
            ctx.arc(nest.x, nest.y, SIM.nestRadius * 0.6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(212, 140, 80, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            nest.energy *= 0.95;
        }

        function drawFood() {
            ctx.globalCompositeOperation = 'screen';
            
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                if (f.amount <= 0) {
                    foods.splice(i, 1);
                    continue;
                }
                
                f.radius = SIM.foodRadiusMax * Math.sqrt(f.amount / f.maxAmount);
                
                const glowRad = f.radius * (1.5 + f.pulse * 0.5);
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glowRad);
                grad.addColorStop(0, `rgba(110, 231, 183, ${0.4 + f.pulse*0.4})`);
                grad.addColorStop(0.5, 'rgba(16, 185, 129, 0.1)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, glowRad, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalCompositeOperation = 'source-over';
                
                const chunks = Math.ceil(f.amount / 500);
                for(let j=0; j<chunks; j++) {
                    const angle = (j * 137.5) * Math.PI / 180;
                    const dist = Math.sqrt(j / chunks) * f.radius * 0.8;
                    const px = f.x + Math.cos(angle) * dist;
                    const py = f.y + Math.sin(angle) * dist;
                    
                    ctx.fillStyle = '#a7f3d0';
                    ctx.beginPath();
                    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                f.pulse *= 0.9;
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawAnts() {
            ctx.beginPath();
            
            for (let ant of ants) {
                const cosA = Math.cos(ant.angle);
                const sinA = Math.sin(ant.angle);
                
                ctx.fillStyle = ant.hasFood ? '#6ee7b7' : 'rgba(200, 180, 160, 0.8)';
                
                const drawCircle = (ox, oy, r) => {
                    const px = ant.x + (ox * cosA - oy * sinA);
                    const py = ant.y + (ox * sinA + oy * cosA);
                    ctx.moveTo(px + r, py);
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                };
                
                drawCircle(3, 0, 1.2);
                drawCircle(0, 0, 1.0);
                
                const abX = ant.x + (-2.5 * cosA);
                const abY = ant.y + (-2.5 * sinA);
                ctx.moveTo(abX, abY);
                ctx.ellipse(abX, abY, 2.2, 1.5, ant.angle, 0, Math.PI*2);
                
                if (ant.hasFood) {
                    ctx.fillStyle = '#a7f3d0';
                    const fx = ant.x + (5 * cosA);
                    const fy = ant.y + (5 * sinA);
                    ctx.moveTo(fx+2, fy);
                    ctx.arc(fx, fy, 2, 0, Math.PI*2);
                }
            }
            ctx.fill();
        }

        function updateUI() {
            if (cycle % 10 === 0) {
                document.getElementById('val-food').textContent = totalFoodCollected.toLocaleString();
                document.getElementById('val-cycle').textContent = cycle.toLocaleString();
                
                foodHistory.push(totalFoodCollected);
                if (foodHistory.length > 6) {
                    foodHistory.shift();
                }
                
                if (foodHistory.length >= 2) {
                    const diff = foodHistory[foodHistory.length - 1] - foodHistory[0];
                    const rate = Math.round((diff / 50) * 60); 
                    document.getElementById('val-eff').textContent = `${rate}/s`;
                }
            }
        }

        function loop() {
            cycle++;
            
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            updatePheromones();
            for (let ant of ants) {
                ant.update();
            }
            
            drawPheromones();
            drawNest();
            drawFood();
            drawAnts();
            
            updateUI();

            requestAnimationFrame(loop);
        }

        setup();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
