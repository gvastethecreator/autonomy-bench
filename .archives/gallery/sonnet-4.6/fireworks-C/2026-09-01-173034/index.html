<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: opacity 2s ease-out;
        }
        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">Click to launch</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let fireworks = [];
        let particles = [];
        let stars = [];
        
        const GRAVITY = 0.05;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createStars();
        }
        
        window.addEventListener('resize', resize);
        
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5;
                this.blinkSpeed = Math.random() * 0.02 + 0.005;
                this.alpha = Math.random();
            }
            draw() {
                this.alpha += this.blinkSpeed;
                if (this.alpha > 1 || this.alpha < 0) {
                    this.blinkSpeed = -this.blinkSpeed;
                }
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha) * 0.4})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function createStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push(new Star());
            }
        }
        
        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                
                const angle = Math.atan2(targetY - startY, targetX - startX);
                const speed = 4 + Math.random() * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.coordinates = [];
                this.coordinateCount = 3;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                
                this.hue = Math.random() * 360;
                this.brightness = Math.random() * 20 + 60;
                
                this.wobble = Math.random() * 0.1;
                this.wobbleSpeed = Math.random() * 0.2;
            }
            
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                
                this.vx += Math.sin(this.wobble += this.wobbleSpeed) * 0.1;
                this.vy += GRAVITY * 0.5;
                
                const vx = this.vx;
                const vy = this.vy;
                
                this.distanceTraveled = Math.hypot(this.x - (this.x - vx), this.y - (this.y - vy)) + this.distanceTraveled;
                
                if (this.distanceTraveled >= this.distanceToTarget || this.vy >= 0) {
                    createParticles(this.targetX, this.targetY, this.hue);
                    fireworks.splice(index, 1);
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (Math.random() > 0.4) {
                        const spark = new Particle(this.x, this.y, this.hue);
                        spark.life = 10 + Math.random() * 10;
                        spark.decay = 0.05 + Math.random() * 0.05;
                        spark.vx = (Math.random() - 0.5) * 1;
                        spark.vy = (Math.random() - 0.5) * 1 + this.vy * 0.5;
                        particles.push(spark);
                    }
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }
        }
        
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 5 + Math.floor(Math.random() * 4);
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.friction = 0.95;
                this.gravity = 0.08;
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.hue = hue + (Math.random() * 40 - 20);
                this.brightness = Math.random() * 30 + 50;
                
                this.flicker = Math.random() > 0.8;
            }
            
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.alpha -= this.decay;
                
                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                
                let currentAlpha = this.alpha;
                if (this.flicker && Math.random() > 0.5) {
                    currentAlpha *= 0.5;
                }
                
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${currentAlpha})`;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }
        
        function createParticles(x, y, baseHue) {
            const particleCount = 120 + Math.random() * 80;
            const type = Math.random(); 
            
            if (type > 0.6) {
                // Willow
                for (let i = 0; i < particleCount; i++) {
                    const p = new Particle(x, y, baseHue);
                    p.gravity = 0.03;
                    p.decay = Math.random() * 0.005 + 0.002;
                    p.friction = 0.98;
                    const speed = Math.random() * 4 + 1;
                    const angle = Math.random() * Math.PI * 2;
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                    p.brightness = 70 + Math.random() * 30;
                    if (Math.random() > 0.5) p.hue = 45; // Gold/Silver tone
                    particles.push(p);
                }
            } else if (type > 0.3) {
                // Ring
                const baseAngle = Math.random() * Math.PI * 2;
                for (let i = 0; i < particleCount; i++) {
                    const p = new Particle(x, y, baseHue);
                    const angle = baseAngle + (i / particleCount) * Math.PI * 2;
                    const speed = 5 + Math.random() * 2;
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                    particles.push(p);
                }
            } else {
                // Normal burst
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(x, y, baseHue));
                }
            }
            
            // Core flash
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${baseHue}, 100%, 80%, 0.5)`;
            ctx.fill();
        }
        
        let autoLaunchTimer = 0;
        
        function loop() {
            requestAnimationFrame(loop);
            
            // Trail fade effect
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(4, 6, 12, 0.15)'; 
            ctx.fillRect(0, 0, width, height);
            
            ctx.globalCompositeOperation = 'lighter';
            
            stars.forEach(star => star.draw());
            
            // Background auto launch
            autoLaunchTimer++;
            if (autoLaunchTimer >= 70) {
                autoLaunchTimer = Math.random() * 40;
                if (Math.random() < 0.6) {
                    const startX = width / 2 + (Math.random() * width * 0.8 - width * 0.4);
                    const startY = height;
                    const targetX = startX + (Math.random() * 200 - 100);
                    const targetY = height * 0.1 + Math.random() * height * 0.4;
                    fireworks.push(new Firework(startX, startY, targetX, targetY));
                }
            }
            
            let i = fireworks.length;
            while (i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }
            
            i = particles.length;
            while (i--) {
                particles[i].draw();
                particles[i].update(i);
            }
        }

        let uiFaded = false;
        function handleLaunch(clientX, clientY) {
            if (!uiFaded) {
                document.getElementById('ui').classList.add('fade-out');
                uiFaded = true;
            }
            let startX = width / 2;
            if (clientX < width * 0.3) startX = width * 0.2;
            else if (clientX > width * 0.7) startX = width * 0.8;
            else startX = clientX + (Math.random() * 100 - 50);
            
            fireworks.push(new Firework(startX, height, clientX, clientY));
        }
        
        canvas.addEventListener('mousedown', (e) => handleLaunch(e.clientX, e.clientY));
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<e.touches.length; i++) {
                handleLaunch(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, {passive: false});
        
        resize();
        
        // Initial grand opening launch
        setTimeout(() => {
            fireworks.push(new Firework(width / 2 - 50, height, width / 2 - 100, height * 0.3));
            fireworks.push(new Firework(width / 2 + 50, height, width / 2 + 100, height * 0.35));
        }, 800);
        
        requestAnimationFrame(loop);
    </script>
</body>
</html>
