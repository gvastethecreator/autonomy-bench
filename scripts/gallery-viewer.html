<!DOCTYPE html>
<html lang="en" data-level="A">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autonomy Bench</title>
  <meta name="description" content="Same prompt. Different models. Live HTML takes from frozen Autonomy Bench runs.">
  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Departure Mono";
      src: url("fonts/DepartureMono-Regular.woff2") format("woff2"),
           url("fonts/DepartureMono-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #0c0c0c;
      --bg-raise: #1e1e1e;
      --ink: #DDD;
      --mute: #8A8A8A;
      --edge: rgba(221, 221, 221, 0.10);
      --edge-strong: rgba(221, 221, 221, 0.28);
      --ok: #8FCB9B;
      --warn: #C8B87A;
      --bad: #D4897A;
      --gold: #E6C35C;
      --level-a: oklch(0.730 0.230 20);
      --level-b: oklch(0.730 0.230 120);
      --level-c: oklch(0.730 0.230 230);
      --font: "Departure Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --type: clamp(10px, 0.22vw + 9px, 13px);
      --mark: clamp(16px, 0.55vw + 14px, 34px);
      --control: clamp(32px, 0.45vw + 30px, 44px);
      --gap: clamp(6px, 0.35vw + 4px, 12px);
      --pad-x: clamp(12px, 1.1vw + 8px, 40px);
      --pad-y: clamp(8px, 0.35vw + 6px, 20px);
      --frame-min: clamp(200px, 14vw, 360px);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease: var(--ease-out);
      --move: 320ms;
      --move-out: 240ms;
      --snap: 160ms;
      --drawer: clamp(280px, 28vw, 520px);
      --fit-w: 1280px;
      --fit-h: 800px;
      --radius: 2px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { color-scheme: dark; }
    body {
      font: var(--type)/1.45 var(--font);
      font-synthesis: none;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    a { color: var(--ink); text-decoration-thickness: from-font; text-underline-position: from-font; }
    a:hover { color: #fff; }
    button, select {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
      transition-property: color, background-color, border-color, scale, opacity;
      transition-duration: var(--snap);
      transition-timing-function: var(--ease);
    }
    button:active { scale: 0.96; }
    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      scale: 1;
    }
    button:focus-visible,
    a:focus-visible,
    summary:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    ::selection { background: var(--ink); color: var(--bg); }
    button, select, .skip, .frame, .frame .port, .frame .tag, .badge, .unshot,
    .drawer-inner, .source, .toast, .flags p, .pick select, details.raw pre {
      border-radius: var(--radius);
    }
    .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: block;
      overflow: visible;
      fill: none;
      stroke: currentColor;
    }
    .skip {
      position: absolute;
      inset-inline-start: -999px;
      top: 8px;
      z-index: 20;
      background: var(--ink);
      color: var(--bg);
      padding: 8px 12px;
      border: 2px solid var(--ink);
    }
    .skip:focus { inset-inline-start: 8px; }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
    }
    .mast {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-column: 1 / -1;
      gap: var(--gap) calc(var(--gap) * 2);
      align-items: center;
      padding: max(var(--pad-y), env(safe-area-inset-top)) max(var(--pad-x), env(safe-area-inset-right)) calc(var(--pad-y) + 2px) max(var(--pad-x), env(safe-area-inset-left));
      background: var(--bg);
      border-bottom: 2px solid var(--edge);
      z-index: 4;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .mark {
      display: flex;
      align-items: center;
      gap: 0.35em;
      margin: 0;
      font: var(--mark)/1.1 var(--font);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-wrap: balance;
    }
    .mark-emoji {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: content-box;
      width: 1.15em;
      min-width: 1.15em;
      height: 1em;
      overflow: hidden;
      white-space: nowrap;
      line-height: 1;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      font-size: 0.9em;
      letter-spacing: 0;
      text-transform: none;
      filter: grayscale(1) contrast(0.88);
      opacity: 0.72;
    }
    .mark-text { min-width: 0; }
    .repo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      color: var(--mute);
      text-decoration: none;
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }
    .repo:hover,
    .repo:focus-visible {
      color: var(--ink);
    }
    .repo .icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      fill: currentColor;
      stroke: none;
    }
    .repo-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mast-tools {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      justify-content: end;
      align-items: center;
    }
    .picks { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; }
    .pick {
      position: relative;
      display: flex;
      min-width: 0;
    }
    .pick-native {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
      padding: 0;
      pointer-events: none;
    }
    .pick-btn {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
      min-height: var(--control);
      max-width: 280px;
      padding: 0 10px;
      color: var(--mute);
      background: var(--bg-raise);
      border: 2px solid var(--edge);
      white-space: nowrap;
      text-align: start;
    }
    .pick-lead {
      flex-shrink: 0;
      display: inline-flex;
    }
    .pick-lead .icon {
      width: 16px;
      height: 16px;
    }
    .pick-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: start;
    }
    .pick-mark {
      flex-shrink: 0;
      line-height: 1;
      filter: grayscale(1) contrast(0.88);
      opacity: 0.72;
    }
    .pick-caret {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-inline-start: auto;
      transition: rotate var(--snap) var(--ease);
    }
    .pick-btn[aria-expanded="true"] .pick-caret { rotate: 180deg; }
    .pick-btn:hover,
    .pick-btn[aria-expanded="true"] {
      color: var(--ink);
      border-color: var(--edge-strong);
    }
    .pick-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .pick-caret .icon { width: 16px; height: 16px; }
    .pick-list {
      position: fixed;
      z-index: 24;
      margin: 0;
      padding: 4px;
      list-style: none;
      border-radius: var(--radius);
      min-width: 10rem;
      max-width: min(320px, calc(100vw - 16px));
      max-height: min(320px, 50vh);
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--bg-raise);
      border: 2px solid var(--edge-strong);
      color: var(--ink);
      scrollbar-width: thin;
      scrollbar-color: var(--edge-strong) transparent;
    }
    .pick-list[hidden] { display: none !important; }
    .pick-list [role="option"],
    .menu-list [role="option"] {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-height: var(--control);
      padding: 0 10px;
      color: var(--mute);
      cursor: pointer;
      text-align: start;
      white-space: nowrap;
    }
    .pick-list [role="option"] .icon,
    .menu-list [role="option"] .icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .pick-list [role="option"]:hover,
    .pick-list [role="option"]:focus-visible,
    .menu-list [role="option"]:hover,
    .menu-list [role="option"]:focus-visible {
      color: var(--ink);
      outline: none;
    }
    .pick-list [role="option"][aria-selected="true"],
    .menu-list [role="option"][aria-selected="true"] {
      color: var(--bg);
      background: var(--ink);
    }
    .pick-panel {
      position: fixed;
      z-index: 24;
      margin: 0;
      padding: 6px;
      min-width: 12rem;
      max-width: min(320px, calc(100vw - 16px));
      max-height: min(420px, 70vh);
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--bg-raise);
      border: 2px solid var(--edge-strong);
      color: var(--ink);
      scrollbar-width: thin;
      scrollbar-color: var(--edge-strong) transparent;
    }
    .pick-panel[hidden] { display: none !important; }
    .menu-group { min-width: 0; }
    .menu-group + .menu-group {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 2px solid var(--edge);
    }
    .menu-label {
      margin: 0;
      padding: 6px 10px 2px;
      color: var(--mute);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .pick-count {
      flex: 0 0 auto;
      margin-inline-start: auto;
      font-variant-numeric: tabular-nums;
      color: var(--mute);
      opacity: 0.8;
    }
    .pick-btn > .pick-count {
      margin-inline-start: 0;
      font-size: 11px;
    }
    .film-pick .pick-btn > .pick-count {
      display: none;
    }
    .pick-list [role="option"][aria-selected="true"] .pick-count {
      color: inherit;
      opacity: 0.72;
    }
    .frame-prompt {
      flex: 1 1 0;
      min-width: 0;
      margin: 0;
      font-size: 10px;
      line-height: 1.25;
      letter-spacing: 0.01em;
      color: var(--mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .frame-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      width: 100%;
    }
    .frames.mode-models.arrange-grid .frame-bar,
    .frames.mode-models.arrange-columns .frame-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      min-height: 0;
      padding: 6px 8px 4px;
    }
    .frames.mode-models.arrange-grid .frame-prompt,
    .frames.mode-models.arrange-columns .frame-prompt {
      flex: 0 0 auto;
      width: 100%;
    }
    .frame-status {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 22px;
      padding: 0 8px 6px;
      color: var(--mute);
      background: var(--bg);
      border-bottom: 2px solid var(--edge);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    .frame-status .stat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      color: var(--mute);
    }
    .frame-status .stat .icon,
    .frame-status .stat .brand-icon {
      width: 12px;
      height: 12px;
    }
    .frame-status .stat-who {
      margin-inline-start: auto;
    }
    .frame-status a { color: inherit; text-decoration: none; }
    .frame-status .stat-who img {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-raise);
      display: block;
    }
    .levels, .html-switch { display: flex; gap: var(--gap); }
    .levels button,
    .evidence button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--control);
      padding: 0 10px;
      color: var(--mute);
      background: var(--bg-raise);
      border: 2px solid var(--edge);
      white-space: nowrap;
    }
    .evidence button.active {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
    }
    .levels button {
      flex: 1 1 0;
      min-width: 0;
      padding: 0;
    }
    .levels [data-level="A"]:hover:not(:disabled):not(.active),
    .levels [data-level="A"]:focus-visible { color: var(--level-a); border-color: var(--level-a); }
    .levels [data-level="B"]:hover:not(:disabled):not(.active),
    .levels [data-level="B"]:focus-visible { color: var(--level-b); border-color: var(--level-b); }
    .levels [data-level="C"]:hover:not(:disabled):not(.active),
    .levels [data-level="C"]:focus-visible { color: var(--level-c); border-color: var(--level-c); }
    .levels [data-level="A"]:focus-visible { outline-color: var(--level-a); }
    .levels [data-level="B"]:focus-visible { outline-color: var(--level-b); }
    .levels [data-level="C"]:focus-visible { outline-color: var(--level-c); }
    .levels [data-level="A"].active {
      color: var(--bg);
      background: var(--level-a);
      border-color: var(--level-a);
    }
    .levels [data-level="B"].active {
      color: var(--bg);
      background: var(--level-b);
      border-color: var(--level-b);
    }
    .levels [data-level="C"].active {
      color: var(--bg);
      background: var(--level-c);
      border-color: var(--level-c);
    }
    .stage {
      position: relative;
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      gap: 0;
      padding: var(--gap);
      background: var(--bg);
    }
    .stage-port {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }
    .frames {
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: var(--gap);
      background: var(--bg);
    }
    .frames.mode-single { grid-template-columns: minmax(0, 1fr); }
    .frames.mode-table {
      display: block;
      overflow: auto;
      background: var(--bg);
    }
    .matrix {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 100%;
      font-size: 10px;
    }
    .matrix th,
    .matrix td {
      border: 1px solid var(--edge);
      padding: 0;
      background: var(--bg);
    }
    .matrix thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg-raise);
      color: var(--mute);
      font-weight: 400;
      text-align: center;
      vertical-align: bottom;
      height: 72px;
      min-width: 28px;
      max-width: 36px;
    }
    .matrix thead th.matrix-corner {
      left: 0;
      z-index: 3;
      min-width: 132px;
      max-width: 180px;
      text-align: start;
      padding: 0 8px;
      vertical-align: end;
    }
    .matrix thead th.matrix-model span {
      display: inline-block;
      transform: rotate(-56deg);
      transform-origin: left bottom;
      white-space: nowrap;
      max-width: 88px;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }
    .matrix tbody th {
      position: sticky;
      left: 0;
      z-index: 1;
      min-width: 132px;
      max-width: 180px;
      text-align: start;
      padding: 0 8px;
      color: var(--ink);
      background: var(--bg-raise);
      white-space: nowrap;
    }
    .matrix tbody th .matrix-bench {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: var(--control);
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      justify-content: flex-start;
    }
    .matrix tbody th .matrix-bench:hover { color: #fff; }
    .matrix-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: var(--control);
      min-width: 28px;
      margin: 0 auto;
      padding: 0;
      color: var(--mute);
      background: transparent;
      border: 0;
    }
    .matrix-cell.is-hit {
      color: var(--ok);
      cursor: pointer;
    }
    .matrix-cell.is-miss {
      color: var(--edge-strong);
      cursor: default;
    }
    .matrix-cell.is-hit:hover { color: var(--ink); }
    .matrix-dot {
      width: 8px;
      height: 8px;
      border-radius: 1px;
      background: currentColor;
    }
    .matrix-cell.is-miss .matrix-dot {
      width: 7px;
      height: 7px;
      background: transparent;
      border: 1px solid currentColor;
    }
    .matrix-cell .vote-crown,
    .matrix-cell .pick-star {
      position: absolute;
      width: 10px;
      height: 10px;
      color: var(--gold);
    }
    .matrix-cell .vote-crown { inset: 2px 2px auto auto; }
    .matrix-cell .pick-star { inset: auto 2px 2px auto; }
    .matrix-cell .vote-crown .icon,
    .matrix-cell .pick-star .icon {
      width: 10px;
      height: 10px;
    }
    .matrix-cell .vote-crown .icon { fill: currentColor; }
    .frames.arrange-columns {
      grid-template-columns: repeat(var(--n, 1), minmax(var(--frame-min), 1fr));
      overflow-x: auto;
    }
    .frames.mode-single.arrange-columns { grid-template-columns: minmax(0, 1fr); overflow: hidden; }
    .frames.arrange-grid {
      grid-template-columns: repeat(auto-fit, minmax(var(--frame-min), 1fr));
      grid-auto-rows: minmax(220px, 1fr);
      overflow: auto;
    }
    .frames.arrange-rows {
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: minmax(220px, 1fr);
      overflow-y: auto;
    }
    .frame {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      border: 2px solid var(--edge-strong);
      overflow: hidden;
      container-type: inline-size;
    }
    .frame .port {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: inherit;
    }
    .frames.scale-fill iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0a0a0a;
    }
    .frames.scale-fit iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--fit-w);
      height: var(--fit-h);
      border: 0;
      background: #0a0a0a;
      transform-origin: 0 0;
    }
    .frame .port iframe {
      display: block;
      border: 0;
      background: #0a0a0a;
    }
    .frame-loader,
    .source-loader {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      pointer-events: auto;
    }
    .source-loader { background: var(--bg); }
    .source-loader .frame-loader-text {
      font: 11px/1.2 var(--font);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .frame-loader-copy,
    .stage-loader-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
      text-align: center;
    }
    .frame-loader-copy { padding: 12px 14px; min-width: 0; }
    .stage-loader-copy {
      gap: 10px;
      padding: 24px;
      max-width: min(40rem, 92%);
    }
    .frame-loader-text,
    .frame-loader-model {
      margin: 0;
      width: 100%;
      max-width: 100%;
      color: var(--mute);
      overflow-wrap: break-word;
      text-wrap: balance;
    }
    .frame-loader-text {
      font: clamp(11px, 6cqi, 16px)/1.25 var(--font);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .frame-loader-model {
      font: clamp(10px, 4.6cqi, 13px)/1.3 var(--font);
      letter-spacing: 0.02em;
    }
    .frame .tag {
      position: absolute;
      top: 8px;
      inset-inline-start: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100% - 16px);
      min-width: 0;
      padding: 4px 8px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border: 2px solid var(--edge-strong);
      pointer-events: none;
    }
    .tag-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

      state.promptRevision = maxRevision(state.experiment, state.level);
      state.date = '';
      render();
    }
    function stepExperiment(delta) {
      const ids = (CATALOG.experiments || []).map(e => e.id).filter(Boolean);
      if (ids.length < 2) return;
      const i = Math.max(0, ids.indexOf(state.experiment));
      onExperiment(ids[(i + delta + ids.length) % ids.length]);
    }
    function stepView(delta) {
      const ids = VIEW_MODES.map(m => m.value);
      if (ids.length < 2) return;
      const i = Math.max(0, ids.indexOf(state.mode));
      onMode(ids[(i + delta + ids.length) % ids.length]);
    }
    function onLevel(level) {
      state.level = level;
      state.promptRevision = maxRevision(state.experiment, state.level);
      state.date = '';
      render();
    }
    function onMode(mode) {
      state.mode = mode;
      state.htmlOpen = [];
      state.receiptOpenKeys = [];
      applyModeDefaults(mode, true);
      render();
    }
    paintIcons();
    document.addEventListener('click', e => {
      const matrixCell = e.target.closest('[data-matrix-cell]');
      if (matrixCell) {
        state.experiment = matrixCell.dataset.experiment;
        state.model = matrixCell.dataset.model;
        state.mode = 'single';
        state.promptRevision = maxRevision(state.experiment, state.level);
        state.date = '';
        applyModeDefaults('single', true);
        render();
        return;
      }
      const pickRow = e.target.closest('[data-open-pick]');
      if (pickRow) {
        openStaffPick(pickRow.dataset.openPick);
        return;
      }
      const step = e.target.closest('.pick-step');
      if (step) {
        if (openPick) closePick(openPick);
        if (!step.disabled) {
          const dir = Number(step.dataset.dir) || 0;
          if (step.dataset.step === 'view') stepView(dir);
          else stepExperiment(dir);
        }
        return;
      }
      const opt = e.target.closest('.pick [role="option"]');
      if (opt) {
        choosePick(opt.closest('.pick'), opt.dataset.value, opt.closest('[data-bind], .menu-list, .pick-list'));
        return;
      }
      const btn = e.target.closest('.pick-btn');
      if (btn) {
        const pick = btn.closest('.pick');
        if (pick.classList.contains('is-open')) closePick(pick);
        else openPickMenu(pick);
        return;
      }
      if (openPick && openPick.contains(e.target)) return;
      if (openPick) closePick(openPick);
    });
    document.addEventListener('keydown', e => {
      if (!openPick && !(e.target && e.target.closest && e.target.closest('.pick-btn'))) return;
      const pick = openPick || (e.target && e.target.closest('.pick'));
      if (!pick) return;
      const options = pickOptions(pick);
      const current = document.activeElement && options.includes(document.activeElement)
        ? document.activeElement
        : options.find(o => o.getAttribute('aria-selected') === 'true') || options[0];
      const idx = options.indexOf(current);
      if (e.key === 'Escape') {
        e.preventDefault();
        closePick(pick);
        const btn = pick.querySelector('.pick-btn');
        if (btn) btn.focus();
        return;
      }
      if (!openPick && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        openPickMenu(pick);
        return;
      }
      if (!openPick) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        (options[Math.min(idx + 1, options.length - 1)] || options[0]).focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        (options[Math.max(idx - 1, 0)] || options[0]).focus();
      } else if (e.key === 'Home') {
        e.preventDefault();
        if (options[0]) options[0].focus();
      } else if (e.key === 'End') {
        e.preventDefault();
        if (options.length) options[options.length - 1].focus();
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (current) choosePick(pick, current.dataset.value, current.closest('[data-bind], .menu-list, .pick-list'));
      } else if (e.key === 'Tab') {
        closePick(pick);
      }
    });
    window.addEventListener('resize', () => { if (openPick) closePick(openPick); hideTip(true); });
    document.addEventListener('pointerover', e => {
      if (e.pointerType === 'touch') return;
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (t) showTip(t);
    });
    document.addEventListener('pointerout', e => {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (!t) return;
      const next = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]');
      if (next && tipGroup(next) === tipGroup(t)) {
        showTip(next);
        return;
      }
      clearTimeout(tipHideTimer);
      tipHideTimer = setTimeout(() => hideTip(), 80);
    });
    document.addEventListener('focusin', e => {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (t) showTip(t, true);
    });
    document.addEventListener('focusout', e => {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (!t) return;
      const next = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]');
      if (next && tipGroup(next) === tipGroup(t)) return;
      hideTip();
    });
    document.addEventListener('pointerdown', e => {
      if (e.target.closest && e.target.closest('[data-tip]')) hideTip(true);
    });
    document.addEventListener('scroll', () => hideTip(true), true);
    applyFilmCompact();
    drawerOverlay.addEventListener('change', () => {
      ['stack-html', 'stack-receipt'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        stopMotion(el);
        clearDrawerInline(el);
      });
    });
    document.getElementById('film-toggle').addEventListener('click', () => {
      state.filmCompact = !state.filmCompact;
      applyFilmCompact();
      syncUrl();
    });
    document.getElementById('experiments').addEventListener('change', e => {
      onExperiment(e.target.value);
    });
    document.getElementById('models').addEventListener('click', e => {
      const b = e.target.closest('[data-model]'); if (!b) return;
      if (state.mode === 'models') toggleModelVisibility(b.dataset.model);
      else state.model = b.dataset.model;
      render();
    });
    document.querySelector('.levels').addEventListener('click', e => {
      const b = e.target.closest('[data-level]'); if (!b) return;
      onLevel(b.dataset.level);
    });
    document.getElementById('view-mode').addEventListener('change', e => {
      onMode(e.target.value);
    });
    document.getElementById('view-arrange').addEventListener('change', e => {
      state.arrange = e.target.value;
      render();
    });
    document.getElementById('view-scale').addEventListener('change', e => {
      state.scale = e.target.value;
      render();
    });
    document.getElementById('prompt-version').addEventListener('change', e => {
      state.promptRevision = Number(e.target.value) || 1;
      state.date = '';
      render();
    });
    document.getElementById('run-month').addEventListener('change', e => {
      state.month = e.target.value;
      state.date = '';
      render();
    });
    document.getElementById('run-pick').addEventListener('change', e => {
      state.date = e.target.value;
      render();
    });
    document.getElementById('frames').addEventListener('click', e => {
      const frame = e.target.closest('.frame');
      const act = e.target.closest('.frame-act');
      if (frame && frame.dataset.model) state.model = frame.dataset.model;
      if (!act || act.disabled) return;
      const key = act.dataset.stack || stackKey(act.dataset.model || state.model, act.dataset.level || state.level);
      const cell = cellForKey(key);
      if (act.dataset.act === 'full') {
        if (act.dataset.model) state.model = act.dataset.model;
        if (act.dataset.level) state.level = act.dataset.level;
        onMode('single');
        return;
      }
      if (act.dataset.act === 'prompt') {
        copyText(cell && cell.prompt, act, 'Prompt copied');
        return;
      }
      if (act.dataset.act === 'vote') {
        if (!cell || !cell.src) return;
        const promptId = currentPromptVoteId(act.dataset.level);
        const modelId = act.dataset.model;
        const rec = voteRecord(act.dataset.level);
        submitVote(promptId, modelId, Boolean(rec.mine && rec.mine === modelId));
        return;
      }
      if (act.dataset.act === 'html') {
        if (!cell || !cell.src) return;
        if (state.htmlOpen.includes(key)) state.htmlOpen = state.htmlOpen.filter(k => k !== key);
        else state.htmlOpen.push(key);
        renderStacks();
        return;
      }
      if (act.dataset.act === 'receipt') {
        if (!cell || !cell.receipt) return;
        if (state.receiptOpenKeys.includes(key)) state.receiptOpenKeys = state.receiptOpenKeys.filter(k => k !== key);
        else state.receiptOpenKeys.push(key);
        renderStacks();
      }
    });
    document.getElementById('stacks').addEventListener('click', e => {
      const panel = e.target.closest('.panel');
      if (!panel) return;
      if (e.target.closest('.panel-close')) {
        const key = panel.dataset.stack;
        if (panel.dataset.kind === 'html') state.htmlOpen = state.htmlOpen.filter(k => k !== key);
        else state.receiptOpenKeys = state.receiptOpenKeys.filter(k => k !== key);
        renderStacks();
        return;
      }
      const copyBtn = e.target.closest('.panel-copy');
      if (copyBtn) copyText(panel.dataset.raw || '', copyBtn, 'Source copied');
    });
    document.addEventListener('keydown', e => {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.target && e.target.closest && (e.target.closest('.pick-btn') || e.target.closest('.pick-list') || e.target.closest('.pick-panel'))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') {
        if (tipAnchor) { hideTip(true); e.preventDefault(); return; }
        if (closePick() || closeLastDrawer()) e.preventDefault();
        return;
      }
      if (e.key === '1') { e.preventDefault(); onLevel('A'); }
      if (e.key === '2') { e.preventDefault(); onLevel('B'); }
      if (e.key === '3') { e.preventDefault(); onLevel('C'); }
      if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        const cell = currentCell();
        const btn = document.querySelector('.frame-act[data-act="prompt"][data-stack="' + CSS.escape(stackKey(state.model, state.level)) + '"]');
        copyText(cell && cell.prompt, btn, 'Prompt copied');
      }
      if (e.key === 'h' || e.key === 'H') {
        const cell = currentCell();
        if (!cell || !cell.src) return;
        e.preventDefault();
        setDrawer('source', !state.htmlOpen.includes(stackKey(state.model, state.level)));
      }
      if (e.key === 'r' || e.key === 'R') {
        const cell = currentCell();
        if (!cell || !cell.receipt) return;
        e.preventDefault();
        setDrawer('receipt', !state.receiptOpenKeys.includes(stackKey(state.model, state.level)));
      }
      if (e.key === '[') {
        e.preventDefault();
        state.filmCompact = !state.filmCompact;
        applyFilmCompact();
        syncUrl();
      }
    });
    applyModeDefaults(state.mode, !q.get('arrange') && !q.get('scale'));
    if (q.get('arrange')) state.arrange = q.get('arrange');
    if (q.get('scale')) state.scale = q.get('scale');
    fetch('catalog.json')
      .then(res => {
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      })
      .then(data => {
        CATALOG = data;
        state.experiment = q.get('experiment') || (CATALOG.experiments[0] || {}).id || '';
        state.model = q.get('model') || (CATALOG.models.find(m => m.playable || m.playable) || CATALOG.models[0] || {}).id || '';
        if (!state.promptRevision) state.promptRevision = maxRevision(state.experiment, state.level);
        snapFilters();
        render();
      })
      .catch(() => {
        document.getElementById('frames').innerHTML = '<p class="empty">Could not load catalog.json.</p>';
        hideLoader(++stageToken);
      });
  </script>
</body>
</html>
