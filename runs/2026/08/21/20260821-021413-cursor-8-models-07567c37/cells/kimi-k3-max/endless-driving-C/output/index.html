<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307090f'/%3E%3Ccircle cx='22' cy='9' r='5' fill='%23e8eeff'/%3E%3Cpath d='M6 32 L14 10 L18 10 L26 32 Z' fill='%23222733'/%3E%3Cpath d='M15.4 32 L15.8 12 L16.2 12 L16.6 32 Z' fill='%23cfd6e4'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060c; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #dfe6f2; }
  canvas { position: fixed; inset: 0; display: block; }

  .overlay { position: fixed; inset: 0; pointer-events: none; }

  #vignette {
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,.38) 82%, rgba(0,0,0,.72) 100%);
  }
  #dmgvin {
    background: radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(255,26,26,.55) 100%);
    opacity: 0; transition: opacity .25s linear;
  }
  #flash { background: radial-gradient(ellipse at 50% 55%, rgba(255,235,220,.95), rgba(255,60,40,.75) 70%); opacity: 0; }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  #hud.on { opacity: 1; }
  #speed {
    position: absolute; left: 34px; top: 26px; line-height: .9;
    text-shadow: 0 2px 18px rgba(80,140,255,.25);
  }
  #speed b { font-size: 62px; font-weight: 200; letter-spacing: -2px; }
  #speed small { display: block; font-size: 11px; letter-spacing: 4px; opacity: .55; margin-top: 6px; }
  #stats { position: absolute; right: 34px; top: 30px; text-align: right; font-size: 13px; letter-spacing: 2px; }
  #stats div { margin-bottom: 7px; opacity: .85; }
  #stats .lbl { opacity: .45; font-size: 10px; letter-spacing: 3px; }
  #dmgwrap {
    position: absolute; left: 34px; bottom: 30px; width: 130px;
    font-size: 9px; letter-spacing: 3px; opacity: .8;
  }
  #dmgtrack { height: 3px; background: rgba(255,255,255,.12); margin-top: 6px; border-radius: 2px; overflow: hidden; }
  #dmgbar { height: 100%; width: 0%; background: linear-gradient(90deg,#ffb13c,#ff3c2a); transition: width .3s ease; }

  #nearmiss {
    position: fixed; left: 50%; top: 24%; transform: translateX(-50%);
    font-size: 22px; font-weight: 300; letter-spacing: 6px; color: #9fd8ff;
    text-shadow: 0 0 22px rgba(120,200,255,.8); opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #nearmiss.pop { animation: pop 1.15s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.85); }
    18% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.04); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-26px) scale(1); }
  }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, rgba(3,5,11,.62) 0%, rgba(3,5,11,.34) 45%, rgba(3,5,11,.88) 100%);
    transition: opacity .7s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen h1 {
    margin: 0; font-size: clamp(44px, 9vw, 110px); font-weight: 100; letter-spacing: .28em;
    text-indent: .28em; color: #eef3ff;
    text-shadow: 0 0 44px rgba(110,160,255,.45), 0 0 120px rgba(255,150,80,.18);
  }
  .screen h1 em { font-style: normal; color: #ffb46b; text-shadow: 0 0 44px rgba(255,150,80,.55); }
  .tag { margin: 14px 0 0; font-size: 13px; letter-spacing: .62em; text-indent: .62em; opacity: .5; text-transform: uppercase; }
  .controls {
    margin-top: 54px; font-size: 12px; letter-spacing: 2px; line-height: 2.1; opacity: .62;
  }
  .controls b { color: #ffb46b; font-weight: 600; }
  .prompt { margin-top: 46px; font-size: 14px; letter-spacing: 5px; color: #cfe0ff; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  #over h1 { color: #ff5a44; text-shadow: 0 0 44px rgba(255,60,40,.5); }
  #overstats { margin-top: 26px; font-size: 15px; letter-spacing: 3px; line-height: 2.2; opacity: .85; }
  #overstats b { color: #ffb46b; font-weight: 500; }
  #newbest { margin-top: 10px; font-size: 12px; letter-spacing: 4px; color: #9fd8ff; opacity: 0; }
  #newbest.on { opacity: 1; animation: blink 1.4s ease-in-out infinite; }
  #paused h1 { font-size: clamp(28px, 4.5vw, 52px); }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<div class="overlay" id="vignette"></div>
<div class="overlay" id="dmgvin"></div>
<div class="overlay" id="flash"></div>
<div id="nearmiss"></div>

<div id="hud">
  <div id="speed"><b id="spd">0</b><small>KM/H</small></div>
  <div id="stats">
    <div><span class="lbl">DIST&nbsp;&nbsp;</span><span id="dist">0.0 KM</span></div>
    <div><span class="lbl">SCORE&nbsp;&nbsp;</span><span id="score">0</span></div>
    <div><span class="lbl">BEST&nbsp;&nbsp;</span><span id="best">0</span></div>
  </div>
  <div id="dmgwrap">HULL<div id="dmgtrack"><div id="dmgbar"></div></div></div>
</div>

<div class="screen" id="title">
  <h1>NIGHT<em>DRIVE</em></h1>
  <p class="tag">an endless highway</p>
  <div class="controls">
    <b>&larr; &rarr;</b> / <b>A D</b> change lane &nbsp;&middot;&nbsp; <b>W</b> / <b>&uarr;</b> push it &nbsp;&middot;&nbsp; <b>S</b> / <b>&darr;</b> brake<br>
    <b>M</b> sound &nbsp;&middot;&nbsp; <b>P</b> pause &nbsp;&middot;&nbsp; thread the traffic, keep the hull intact
  </div>
  <p class="prompt">CLICK OR PRESS ENTER</p>
</div>

<div class="screen hidden" id="over">
  <h1>WRECKED</h1>
  <div id="overstats"></div>
  <div id="newbest">NEW BEST</div>
  <p class="prompt">PRESS R TO DRIVE AGAIN</p>
</div>

<div class="screen hidden" id="paused">
  <h1>PAUSED</h1>
  <p class="prompt">P TO RESUME</p>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= renderer / scene ================= */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070e);
scene.fog = new THREE.Fog(0x070a14, 50, 340);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 1400);
camera.position.set(0, 4.1, 8.6);

scene.add(new THREE.HemisphereLight(0x2a3a5f, 0x0a0c12, 0.55));
const moonLight = new THREE.DirectionalLight(0x8fa8ff, 0.4);
moonLight.position.set(-60, 90, -120);
scene.add(moonLight);

/* ================= canvas textures ================= */

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function asphalt(g, w, h) {
  g.fillStyle = '#161922'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2400; i++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * 0.3})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
}

// tile covers 12 m of road length; dashes 3 m
const roadTex = canvasTex(256, 512, (g, w, h) => {
  asphalt(g, w, h);
  const xOf = mx => (mx + 5.4) / 10.8 * w;
  g.fillStyle = 'rgba(205,215,232,0.8)';
  [-1.8, 1.8].forEach(mx => g.fillRect(xOf(mx) - 2, h * 0.08, 4, h * 0.34));
  g.fillStyle = 'rgba(200,210,228,0.65)'; g.fillRect(xOf(5.0) - 2, 0, 4, h);
  g.fillStyle = 'rgba(255,190,90,0.75)'; g.fillRect(xOf(-5.0) - 2, 0, 4, h);
});
roadTex.repeat.set(1, 25);

const onTex = canvasTex(256, 512, (g, w, h) => {
  asphalt(g, w, h);
  const xOf = mx => (mx + 14.6) / 7.6 * w;
  g.fillStyle = 'rgba(205,215,232,0.8)';
  g.fillRect(xOf(-10.8) - 2, h * 0.08, 4, h * 0.34);
  g.fillStyle = 'rgba(200,210,228,0.65)'; g.fillRect(xOf(-14.2) - 2, 0, 4, h);
  g.fillStyle = 'rgba(255,190,90,0.75)'; g.fillRect(xOf(-7.4) - 2, 0, 4, h);
});
onTex.repeat.set(1, 25);

const glowTex = canvasTex(128, 128, g => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.22, 'rgba(255,255,255,0.5)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
});

const skyTex = canvasTex(64, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#03050c');
  gr.addColorStop(0.55, '#0a0f22');
  gr.addColorStop(0.82, '#141230');
  gr.addColorStop(1, '#1d1330');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

function ridgeTex(seed, base, col) {
  return canvasTex(1024, 256, (g, w, h) => {
    g.beginPath(); g.moveTo(0, h);
    let y = h * base;
    g.lineTo(0, y);
    for (let x = 0; x <= w; x += 14) {
      y = h * base
        + Math.sin(x * 0.008 + seed) * h * 0.13
        + Math.sin(x * 0.023 + seed * 2.7) * h * 0.06
        + (Math.random() - 0.5) * h * 0.045;
      g.lineTo(x, Math.max(h * 0.12, Math.min(h * 0.95, y)));
    }
    g.lineTo(w, h); g.closePath();
    g.fillStyle = col; g.fill();
  });
}

const cityTex = canvasTex(1024, 256, (g, w, h) => {
  let x = 0;
  while (x < w) {
    const bw = 18 + Math.random() * 46;
    const bh = h * (0.22 + Math.random() * 0.62);
    g.fillStyle = '#0a0e1c';
    g.fillRect(x, h - bh, bw, bh);
    for (let wy = h - bh + 5; wy < h - 8; wy += 11) {
      for (let wx = x + 4; wx < x + bw - 5; wx += 8) {
        if (Math.random() < 0.24) {
          g.fillStyle = Math.random() < 0.78 ? 'rgba(255,196,110,0.85)' : 'rgba(150,195,255,0.8)';
          g.fillRect(wx, wy, 3, 4);
        }
      }
    }
    x += bw + 3;
  }
});

/* ================= environment ================= */

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(700, 24, 16),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })
);
sky.renderOrder = -2;
scene.add(sky);

{
  const N = 900;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const e = 0.06 + Math.random() * Math.PI * 0.44;
    const r = 640;
    pos[i * 3] = r * Math.cos(a) * Math.cos(e);
    pos[i * 3 + 1] = r * Math.sin(e);
    pos[i * 3 + 2] = r * Math.sin(a) * Math.cos(e);
    const b = 0.25 + Math.random() * 0.75;
    col[i * 3] = b;
    col[i * 3 + 1] = b;
    col[i * 3 + 2] = b * (0.85 + Math.random() * 0.15);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.6, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.9, fog: false, depthWrite: false
  }));
  stars.renderOrder = -1;
  scene.add(stars);
}

function addSprite(color, scale, opacity, x, y, z) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  s.scale.set(scale, scale, 1);
  s.position.set(x, y, z);
  scene.add(s);
  return s;
}
addSprite(0xe8eeff, 34, 0.95, -150, 130, -420);
addSprite(0x9fb4ff, 110, 0.22, -150, 130, -420);

function farPlane(w, h, tex, x, y, z, opacity) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, fog: false, depthWrite: false })
  );
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
farPlane(900, 110, ridgeTex(1.7, 0.42, '#10162c'), -40, 34, -380, 0.9);
farPlane(900, 85, ridgeTex(4.2, 0.5, '#0a0e20'), 60, 24, -330, 0.95);
const city = farPlane(380, 72, cityTex, 130, 20, -300, 0.95);
city.rotation.y = -0.12;

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.06;
scene.add(ground);

/* ================= road ================= */

const ROAD_LEN = 300, ROAD_FRONT = -260, ROAD_BACK = 40;

function flatPlane(w, len, mat, x, y) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, (ROAD_FRONT + ROAD_BACK) / 2);
  scene.add(m);
  return m;
}

flatPlane(10.8, ROAD_LEN, new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.94 }), 0, 0);
flatPlane(7.6, ROAD_LEN, new THREE.MeshStandardMaterial({ map: onTex, roughness: 0.94 }), -10.8, 0);
flatPlane(1.6, ROAD_LEN, new THREE.MeshStandardMaterial({ color: 0x10131b, roughness: 1 }), -6.2, 0.005);
flatPlane(1.6, ROAD_LEN, new THREE.MeshStandardMaterial({ color: 0x11141d, roughness: 1 }), 6.2, 0.005);
flatPlane(1.2, ROAD_LEN, new THREE.MeshStandardMaterial({ color: 0x11141d, roughness: 1 }), -15.2, 0.005);

/* recycled world chunks */
const recyclers = [];

function makeRecycler(count, spacing, make, zOffset) {
  const items = [];
  for (let i = 0; i < count; i++) {
    const obj = make(i);
    obj.position.z = ROAD_FRONT + 20 + i * spacing + (zOffset || 0);
    scene.add(obj);
    items.push(obj);
  }
  recyclers.push({ items, span: count * spacing, limit: ROAD_BACK + 10 });
}

const railMat = new THREE.MeshStandardMaterial({ color: 0x39404e, metalness: 0.7, roughness: 0.4 });
const barrierMat = new THREE.MeshStandardMaterial({ color: 0x1c212c, roughness: 0.9 });
const railGeo = new THREE.BoxGeometry(0.08, 0.34, 40);
const barrierGeo = new THREE.BoxGeometry(0.36, 0.85, 40);

makeRecycler(7, 40, () => { const m = new THREE.Mesh(railGeo, railMat); m.position.set(6.55, 0.62, 0); return m; });
makeRecycler(7, 40, () => { const m = new THREE.Mesh(barrierGeo, barrierMat); m.position.set(-6.2, 0.43, 0); return m; });
makeRecycler(7, 40, () => { const m = new THREE.Mesh(railGeo, railMat); m.position.set(-15.0, 0.62, 0); return m; });

function reflector(x, y, color) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s.scale.set(0.55, 0.55, 1);
  s.position.set(x, y, 0);
  return s;
}
makeRecycler(20, 15, () => reflector(6.35, 0.78, 0xff9a3c));
makeRecycler(20, 15, () => reflector(-6.0, 0.98, 0xcfd8ea), 7.5);
makeRecycler(20, 15, () => reflector(-14.8, 0.78, 0xff9a3c), 3.5);

const poleMat = new THREE.MeshStandardMaterial({ color: 0x232833, roughness: 0.8 });
const lampMat = new THREE.MeshBasicMaterial({ color: 0xffc98a });

function lampAssembly(parent, lx) {
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), lampMat);
  lamp.position.set(lx, 6.82, 0);
  parent.add(lamp);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffa64d, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.scale.set(2.8, 2.8, 1);
  glow.position.set(lx, 6.82, 0);
  parent.add(glow);
  const pool = new THREE.Mesh(
    new THREE.PlaneGeometry(6.5, 12),
    new THREE.MeshBasicMaterial({
      map: glowTex, color: 0xff9a3c, transparent: true, opacity: 0.26,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false
    })
  );
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(lx, 0.03, 0);
  parent.add(pool);
}

function makePole(arms) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, 7.2, 6), poleMat);
  pole.position.y = 3.6;
  g.add(pole);
  for (const lx of arms) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(lx), 0.07, 0.07), poleMat);
    arm.position.set(lx / 2, 6.95, 0);
    g.add(arm);
    lampAssembly(g, lx);
  }
  return g;
}
makeRecycler(8, 30, () => { const g = makePole([3.2, -3.3]); g.position.x = -6.2; return g; });
makeRecycler(8, 30, () => { const g = makePole([-1.9]); g.position.x = 6.6; return g; }, 15);

/* ================= cars ================= */

const glassMat = new THREE.MeshStandardMaterial({ color: 0x0b1018, metalness: 0.9, roughness: 0.12 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.95 });
const wheelGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.26, 14);
wheelGeo.rotateZ(Math.PI / 2);

function addWheels(g) {
  for (const [x, z] of [[-0.82, -1.45], [0.82, -1.45], [-0.82, 1.45], [0.82, 1.45]]) {
    const w = new THREE.Mesh(wheelGeo, tireMat);
    w.position.set(x, 0.34, z);
    g.add(w);
  }
}

function carGlow(g, color, scale, x, y, z) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  s.scale.set(scale, scale, 1);
  s.position.set(x, y, z);
  g.add(s);
  return s;
}

function makePlayerCar() {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0x8a1420, metalness: 0.65, roughness: 0.35 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.84, 0.52, 4.4), paint);
  body.position.y = 0.56;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.48, 2.2), glassMat);
  cabin.position.set(0, 1.02, 0.15);
  g.add(cabin);
  addWheels(g);

  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff3cf });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
  for (const sx of [-1, 1]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.12, 0.06), headMat);
    h.position.set(sx * 0.62, 0.66, -2.21);
    g.add(h);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.13, 0.06), tailMat);
    t.position.set(sx * 0.58, 0.72, 2.21);
    g.add(t);
    carGlow(g, 0xfff3cf, 0.55, sx * 0.62, 0.66, -2.3);
  }
  const tailGlowL = carGlow(g, 0xff2a2a, 1.05, -0.58, 0.72, 2.32);
  const tailGlowR = carGlow(g, 0xff2a2a, 1.05, 0.58, 0.72, 2.32);
  const rearLight = new THREE.PointLight(0xff2a2a, 5, 7, 1.6);
  rearLight.position.set(0, 0.8, 2.7);
  g.add(rearLight);

  for (const sx of [-1, 1]) {
    const spot = new THREE.SpotLight(0xfff2cf, 320, 85, 0.44, 0.55, 1.4);
    spot.position.set(sx * 0.62, 0.8, -2.0);
    spot.target.position.set(sx * 1.5, 0, -34);
    g.add(spot); g.add(spot.target);
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(2.4, 17, 20, 1, true),
      new THREE.MeshBasicMaterial({
        color: 0xffe9b8, transparent: true, opacity: 0.05,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide
      })
    );
    cone.geometry.rotateX(Math.PI / 2);
    cone.position.set(sx * 0.62, 0.62, -10.6);
    g.add(cone);
  }
  scene.add(g);
  return { g, tailMat, tailGlowL, tailGlowR };
}

const player = makePlayerCar();

const trafficPalette = [0x2a4a6a, 0x5a5f6e, 0x6a2a2a, 0x2a5a3a, 0x4a3a5e, 0x6e6a55, 0x39424e];

function makeTrafficCar(oncoming) {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({
    color: trafficPalette[Math.floor(Math.random() * trafficPalette.length)],
    metalness: 0.5, roughness: 0.5
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.55, 4.3), paint);
  body.position.y = 0.55;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.5, 2.1), glassMat);
  cabin.position.set(0, 1.04, 0.1);
  g.add(cabin);
  addWheels(g);
  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff6d8 });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2020 });
  for (const sx of [-1, 1]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.12, 0.06), headMat);
    h.position.set(sx * 0.6, 0.64, -2.16);
    g.add(h);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.12, 0.06), tailMat);
    t.position.set(sx * 0.58, 0.7, 2.16);
    g.add(t);
  }
  carGlow(g, 0xff2a2a, 1.05, -0.58, 0.7, 2.28);
  carGlow(g, 0xff2a2a, 1.05, 0.58, 0.7, 2.28);
  carGlow(g, 0xfff6d8, 1.7, -0.6, 0.64, -2.3);
  carGlow(g, 0xfff6d8, 1.7, 0.6, 0.64, -2.3);
  if (oncoming) g.rotation.y = Math.PI;
  g.visible = false;
  scene.add(g);
  return { g, active: false, speed: 20, lane: 0, x: 0, prevZ: 0, invuln: 0 };
}

const LANES = [-3.6, 0, 3.6];
const ON_LANES = [-8.9, -12.7];
const traffic = Array.from({ length: 12 }, () => makeTrafficCar(false));
const oncoming = Array.from({ length: 10 }, () => makeTrafficCar(true));

/* ================= audio ================= */

let AC = null, master, engOsc1, engOsc2, engFilter, engGain, subOsc, subGain, windGain, windFilter, muted = false;

function noiseBuffer(seconds) {
  const buf = AC.createBuffer(1, AC.sampleRate * seconds, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function initAudio() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = 0.4;
  master.connect(AC.destination);

  engFilter = AC.createBiquadFilter();
  engFilter.type = 'lowpass'; engFilter.frequency.value = 320;
  engGain = AC.createGain(); engGain.gain.value = 0.05;
  engOsc1 = AC.createOscillator(); engOsc1.type = 'sawtooth'; engOsc1.frequency.value = 60;
  engOsc2 = AC.createOscillator(); engOsc2.type = 'sawtooth'; engOsc2.frequency.value = 60.5;
  engOsc1.connect(engFilter); engOsc2.connect(engFilter);
  engFilter.connect(engGain); engGain.connect(master);
  engOsc1.start(); engOsc2.start();

  subGain = AC.createGain(); subGain.gain.value = 0.05;
  subOsc = AC.createOscillator(); subOsc.type = 'sine'; subOsc.frequency.value = 30;
  subOsc.connect(subGain); subGain.connect(master);
  subOsc.start();

  windFilter = AC.createBiquadFilter();
  windFilter.type = 'bandpass'; windFilter.frequency.value = 700; windFilter.Q.value = 0.7;
  windGain = AC.createGain(); windGain.gain.value = 0;
  const wind = AC.createBufferSource();
  wind.buffer = noiseBuffer(2); wind.loop = true;
  wind.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
  wind.start();
}

function updateAudio(speed, gas) {
  if (!AC) return;
  const rpm = 52 + speed * 3.1;
  const t = AC.currentTime;
  engOsc1.frequency.setTargetAtTime(rpm, t, 0.06);
  engOsc2.frequency.setTargetAtTime(rpm * 1.008 + 2.5, t, 0.06);
  engFilter.frequency.setTargetAtTime(240 + speed * 17, t, 0.1);
  engGain.gain.setTargetAtTime(0.04 + (speed / 45) * 0.05 + (gas ? 0.025 : 0), t, 0.1);
  subOsc.frequency.setTargetAtTime(rpm / 2, t, 0.06);
  subGain.gain.setTargetAtTime(0.03 + (speed / 45) * 0.04, t, 0.1);
  windGain.gain.setTargetAtTime(Math.pow(speed / 45, 2) * 0.24, t, 0.15);
  windFilter.frequency.setTargetAtTime(480 + speed * 30, t, 0.15);
}

function crashSound() {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuffer(0.5);
  const f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 260;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.7, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.5);
}

function pingSound() {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(990, t);
  o.frequency.exponentialRampToValueAtTime(1485, t + 0.12);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.2);
}

/* ================= game state ================= */

const $ = id => document.getElementById(id);
const hudEl = $('hud'), titleEl = $('title'), overEl = $('over'), pausedEl = $('paused');
const nmEl = $('nearmiss'), flashEl = $('flash'), dmgvinEl = $('dmgvin');

let state = 'title'; // title | drive | paused | over
let speed = 0, carX = 0, laneIdx = 1, targetX = 0;
let dist = 0, score = 0, damage = 0, best = +(localStorage.getItem('nightdrive.best') || 0);
let flash = 0, shake = 0, playerInvuln = 0;
let trafficTimer = 1.5, oncomingTimer = 0.5, hudTimer = 0, elapsed = 0;
let gas = false, braking = false;

$('best').textContent = Math.floor(best);

function cruiseSpeed() { return 27 + Math.min(7, dist / 1000 * 0.5); }
function spawnInterval() { return Math.max(0.95, 2.3 - dist / 1000 * 0.12); }

function resetRun() {
  speed = 20; carX = 0; laneIdx = 1; targetX = 0;
  dist = 0; score = 0; damage = 0; flash = 0; shake = 0; playerInvuln = 0;
  trafficTimer = 1.5;
  for (const c of traffic) { c.active = false; c.g.visible = false; }
  for (const c of oncoming) { c.active = false; c.g.visible = false; }
  $('dmgbar').style.width = '0%';
}

function startDrive() {
  initAudio();
  resetRun();
  state = 'drive';
  titleEl.classList.add('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.add('on');
}

function gameOver() {
  state = 'over';
  const isBest = score > best;
  if (isBest) { best = score; localStorage.setItem('nightdrive.best', Math.floor(best)); }
  $('overstats').innerHTML =
    `${(dist / 1000).toFixed(2)} KM DRIVEN<br>SCORE <b>${Math.floor(score)}</b> &nbsp;&middot;&nbsp; BEST <b>${Math.floor(best)}</b>`;
  $('newbest').classList.toggle('on', isBest);
  $('best').textContent = Math.floor(best);
  setTimeout(() => overEl.classList.remove('hidden'), 650);
}

function nearMiss() {
  score += 250;
  nmEl.textContent = 'NEAR MISS +250';
  nmEl.classList.remove('pop');
  void nmEl.offsetWidth;
  nmEl.classList.add('pop');
  pingSound();
}

function crash(car) {
  damage = Math.min(100, damage + 34);
  speed = Math.max(9, car.speed * 0.55);
  car.speed = speed + 14;
  car.invuln = 3;
  playerInvuln = 1.2;
  flash = 0.9; shake = 1;
  crashSound();
  $('dmgbar').style.width = damage + '%';
  if (damage >= 100) gameOver();
}

/* ================= input ================= */

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();

  if (state === 'title' && (k === 'enter' || k === ' ')) { startDrive(); return; }
  if (state === 'over' && k === 'r') { startDrive(); return; }
  if (k === 'm') {
    muted = !muted;
    if (AC) master.gain.setTargetAtTime(muted ? 0 : 0.4, AC.currentTime, 0.05);
    return;
  }
  if (k === 'p' && (state === 'drive' || state === 'paused')) {
    state = state === 'drive' ? 'paused' : 'drive';
    pausedEl.classList.toggle('hidden', state === 'drive');
    if (AC) state === 'paused' ? AC.suspend() : AC.resume();
    return;
  }
  if (state !== 'drive' || e.repeat) return;

  if (k === 'arrowleft' || k === 'a') laneIdx = Math.max(0, laneIdx - 1);
  if (k === 'arrowright' || k === 'd') laneIdx = Math.min(2, laneIdx + 1);
  targetX = LANES[laneIdx];
  if (k === 'arrowup' || k === 'w') gas = true;
  if (k === 'arrowdown' || k === 's') braking = true;
});

addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') gas = false;
  if (k === 'arrowdown' || k === 's') braking = false;
});

addEventListener('pointerdown', () => { if (state === 'title') startDrive(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'drive') {
    state = 'paused';
    pausedEl.classList.remove('hidden');
    if (AC) AC.suspend();
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= traffic spawning ================= */

function laneClear(list, lanes, lane, zMin, gap) {
  for (const c of list) {
    if (c.active && c.lane === lane && Math.abs(c.g.position.z - zMin) < gap) return false;
  }
  return true;
}

function spawnTraffic() {
  const free = [0, 1, 2].filter(l => laneClear(traffic, LANES, l, -250, 34));
  if (!free.length) return;
  // never let the spawn band become a solid wall across all three lanes
  const band = new Set();
  for (const c of traffic) if (c.active && c.g.position.z < -190) band.add(c.lane);
  const choices = free.filter(l => !band.has(l));
  if (band.size >= 2 && choices.length === 0) return;
  const lane = choices.length ? choices[Math.floor(Math.random() * choices.length)] : free[0];
  const c = traffic.find(c => !c.active);
  if (!c) return;
  c.active = true; c.lane = lane; c.x = LANES[lane];
  c.speed = 16 + Math.random() * 9;
  c.invuln = 0;
  c.g.position.set(c.x, 0, -250);
  c.prevZ = -250;
  c.g.visible = true;
}

function spawnOncoming() {
  const lane = Math.floor(Math.random() * 2);
  if (!laneClear(oncoming, ON_LANES, lane, -260, 45)) return;
  const c = oncoming.find(c => !c.active);
  if (!c) return;
  c.active = true; c.lane = lane; c.x = ON_LANES[lane];
  c.speed = 20 + Math.random() * 10;
  c.g.position.set(c.x, 0, -260);
  c.g.visible = true;
}

/* ================= main loop ================= */

const clock = new THREE.Clock();
const lookTarget = new THREE.Vector3();

function update(dt) {
  elapsed += dt;
  const driving = state === 'drive';
  const worldSpeed = state === 'title' ? 20 : speed;

  if (driving) {
    const target = braking ? 12 : gas ? 45 : cruiseSpeed();
    speed += (target - speed) * Math.min(1, dt * (braking ? 2.6 : 0.8));
    dist += speed * dt;
    score += speed * dt;
    playerInvuln = Math.max(0, playerInvuln - dt);

    carX += (targetX - carX) * Math.min(1, dt * 6);
    player.g.position.x = carX;
    player.g.rotation.z = THREE.MathUtils.clamp((targetX - carX) * -0.05, -0.09, 0.09);
    player.g.rotation.x = THREE.MathUtils.clamp((target - speed) * 0.0028, -0.035, 0.035);

    const brakingNow = braking || state === 'over';
    player.tailMat.color.setHex(brakingNow ? 0xff6a5a : 0xff2222);
    const tg = brakingNow ? 1.55 : 1.05;
    player.tailGlowL.scale.set(tg, tg, 1);
    player.tailGlowR.scale.set(tg, tg, 1);

    trafficTimer -= dt;
    if (trafficTimer <= 0) {
      trafficTimer = spawnInterval() * (0.7 + Math.random() * 0.6);
      spawnTraffic();
    }
  }
  if (state === 'over') {
    speed += (0 - speed) * Math.min(1, dt * 1.2);
    player.g.rotation.x *= 0.95;
    player.g.rotation.z *= 0.95;
  }

  oncomingTimer -= dt;
  if (oncomingTimer <= 0) {
    oncomingTimer = 0.7 + Math.random() * 1.1;
    spawnOncoming();
  }

  // scroll road markings
  roadTex.offset.y += worldSpeed * dt / 12;
  onTex.offset.y += worldSpeed * dt / 12;

  // recycle rails / reflectors / poles
  for (const r of recyclers) {
    for (const o of r.items) {
      o.position.z += worldSpeed * dt;
      if (o.position.z > r.limit) o.position.z -= r.span;
    }
  }

  // same-direction traffic
  for (const c of traffic) {
    if (!c.active) continue;
    c.prevZ = c.g.position.z;
    c.g.position.z += (worldSpeed - c.speed) * dt;
    c.invuln = Math.max(0, c.invuln - dt);
    const z = c.g.position.z;
    if (z > 25 || z < -270) { c.active = false; c.g.visible = false; continue; }
    if (driving) {
      const dx = Math.abs(c.x - carX), dz = Math.abs(z);
      if (c.invuln <= 0 && playerInvuln <= 0 && dz < 4.0 && dx < 1.75) {
        crash(c);
      } else if (c.prevZ < 0 && z >= 0 && dx >= 1.75 && dx < 2.7) {
        nearMiss();
      }
    }
  }

  // oncoming traffic
  for (const c of oncoming) {
    if (!c.active) continue;
    c.g.position.z += (worldSpeed + c.speed) * dt;
    if (c.g.position.z > 30) { c.active = false; c.g.visible = false; }
  }

  // camera
  shake = Math.max(0, shake - dt * 1.8);
  const spdShake = (worldSpeed / 45) * 0.05 + shake * 0.35;
  const sx = (Math.sin(elapsed * 13.7) + Math.sin(elapsed * 7.3)) * 0.5 * spdShake;
  const sy = (Math.sin(elapsed * 11.1) + Math.sin(elapsed * 5.9)) * 0.5 * spdShake * 0.6;
  let camX = carX * 0.55;
  if (state === 'title') camX = Math.sin(elapsed * 0.12) * 1.6;
  camera.position.set(camX + sx, 4.1 + sy, 8.6);
  lookTarget.set(carX * 0.8, 1.0, -14);
  camera.lookAt(lookTarget);
  const targetFov = state === 'title' ? 62 : 60 + (speed / 45) * 16;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();

  // overlays
  flash = Math.max(0, flash - dt * 2.6);
  flashEl.style.opacity = flash * 0.85;
  dmgvinEl.style.opacity = (damage / 100) * 0.55 + flash * 0.25;

  updateAudio(worldSpeed, gas);

  hudTimer -= dt;
  if (hudTimer <= 0 && driving) {
    hudTimer = 0.1;
    $('spd').textContent = Math.round(speed * 3.6);
    $('dist').textContent = (dist / 1000).toFixed(1) + ' KM';
    $('score').textContent = Math.floor(score);
    if (score > best) {
      best = score;
      localStorage.setItem('nightdrive.best', Math.floor(best));
      $('best').textContent = Math.floor(best);
    }
  }
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state !== 'paused') update(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
