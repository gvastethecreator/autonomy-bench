<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First-Person Rollercoaster</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #87b5d6;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #hud {
    position: fixed;
    top: 16px;
    left: 18px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
    user-select: none;
    pointer-events: none;
  }
  #hud .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.95;
  }
  #hud .sub {
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.75;
    margin-top: 2px;
  }
  #speed {
    margin-top: 10px;
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #speed small {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.75;
    margin-left: 4px;
    letter-spacing: 0.1em;
  }
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    opacity: 0.7;
    user-select: none;
    pointer-events: none;
  }
  #progress {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.25);
  }
  #bar {
    height: 100%;
    width: 0%;
    background: #fff;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: #22303c;
    font-size: 15px;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="title">Rollercoaster</div>
  <div class="sub">first-person &middot; continuous loop</div>
  <div id="speed">0<small>km/h</small></div>
</div>
<div id="hint">drag to look around</div>
<div id="progress"><div id="bar"></div></div>
<div id="fallback">Could not start WebGL or load Three.js.<br />Check your connection and try a WebGL-capable browser.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var fallback = document.getElementById('fallback');
  if (!window.THREE) {
    fallback.style.display = 'flex';
    return;
  }

  // ---------------------------------------------------------------- renderer

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    fallback.style.display = 'flex';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('app').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var SKY = new THREE.Color(0x87b5d6);
  scene.background = SKY;
  scene.fog = new THREE.Fog(SKY.getHex(), 130, 430);

  var camera = new THREE.PerspectiveCamera(
    72, window.innerWidth / window.innerHeight, 0.1, 1200);

  var hemi = new THREE.HemisphereLight(0xd6ecff, 0x3d6b35, 0.85);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
  sun.position.set(90, 140, 50);
  scene.add(sun);

  // ------------------------------------------------------------- track curve

  var control = [
    [  0,  9,  62],
    [ 38, 10,  50],
    [ 58, 16,  18],
    [ 52, 34, -22],
    [ 22, 12, -52],
    [-18,  9, -58],
    [-50, 15, -34],
    [-62, 24,   2],
    [-52, 12,  40],
    [-18,  8,  56],
    [ 16, 20,  30],
    [  6, 26,  -6],
    [-22, 14,   8],
    [-14, 10,  40]
  ].map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });

  var curve = new THREE.CatmullRomCurve3(control, true, 'centripetal');
  var trackLength = curve.getLength();

  // ------------------------------------------------- sampled oriented frames

  var N = 2048;
  var WORLD_UP = new THREE.Vector3(0, 1, 0);
  var frames = [];
  var i, k;

  for (i = 0; i < N; i++) {
    var u = i / N;
    frames.push({
      pos: curve.getPointAt(u),
      tan: curve.getTangentAt(u).normalize(),
      right: new THREE.Vector3(),
      up: new THREE.Vector3(),
      rollRaw: 0,
      roll: 0
    });
  }

  for (i = 0; i < N; i++) {
    var f = frames[i];
    var r = new THREE.Vector3().crossVectors(f.tan, WORLD_UP);
    if (r.lengthSq() < 1e-8) {
      r.copy(frames[(i - 1 + N) % N].right);
    } else {
      r.normalize();
    }
    f.right.copy(r);
    f.up.crossVectors(r, f.tan).normalize();
  }

  // Lateral curvature per sample -> banked roll, smoothed over a wide window.
  for (i = 0; i < N; i++) {
    var t0 = frames[i].tan;
    var t1 = frames[(i + 1) % N].tan;
    frames[i].rollRaw = (t1.x - t0.x) * frames[i].right.x +
                        (t1.y - t0.y) * frames[i].right.y +
                        (t1.z - t0.z) * frames[i].right.z;
  }
  var W = 42;
  for (i = 0; i < N; i++) {
    var acc = 0;
    for (k = -W; k <= W; k++) acc += frames[(i + k + N) % N].rollRaw;
    frames[i].roll = THREE.MathUtils.clamp((acc / (2 * W + 1)) * 45, -0.55, 0.55);
  }
  for (i = 0; i < N; i++) {
    var q = new THREE.Quaternion().setFromAxisAngle(frames[i].tan, frames[i].roll);
    frames[i].up.applyQuaternion(q);
    frames[i].right.applyQuaternion(q);
  }

  var hMax = 0;
  for (i = 0; i < N; i++) hMax = Math.max(hMax, frames[i].pos.y);

  // ------------------------------------------------------------------- rails

  var GAUGE = 1.05;
  var railMat = new THREE.MeshStandardMaterial({
    color: 0xc23b2e, metalness: 0.55, roughness: 0.35
  });

  [-1, 1].forEach(function (side) {
    var pts = [];
    for (var j = 0; j < N; j += 4) {
      var fr = frames[j];
      pts.push(fr.pos.clone()
        .addScaledVector(fr.right, side * GAUGE * 0.5)
        .addScaledVector(fr.up, 0.14));
    }
    var railCurve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
    var railGeo = new THREE.TubeGeometry(railCurve, 1400, 0.07, 8, true);
    scene.add(new THREE.Mesh(railGeo, railMat));
  });

  // -------------------------------------------------------------------- ties

  var tieCount = 430;
  var tieGeo = new THREE.BoxGeometry(GAUGE + 0.55, 0.09, 0.5);
  var tieMat = new THREE.MeshStandardMaterial({ color: 0x4e3b31, roughness: 0.9 });
  var ties = new THREE.InstancedMesh(tieGeo, tieMat, tieCount);
  var dummy = new THREE.Object3D();
  var basis = new THREE.Matrix4();

  for (i = 0; i < tieCount; i++) {
    var tf = frames[Math.floor(i / tieCount * N)];
    basis.makeBasis(tf.right, tf.up, tf.tan);
    dummy.position.copy(tf.pos).addScaledVector(tf.up, 0.03);
    dummy.quaternion.setFromRotationMatrix(basis);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    ties.setMatrixAt(i, dummy.matrix);
  }
  scene.add(ties);

  // ---------------------------------------------------------------- supports

  var supMat = new THREE.MeshStandardMaterial({
    color: 0x8a8f94, metalness: 0.4, roughness: 0.6
  });
  var supGeo = new THREE.CylinderGeometry(0.14, 0.18, 1, 8);
  supGeo.translate(0, 0.5, 0); // base at origin so Y-scale grows upward
  var supEvery = 64;
  var supMax = Math.ceil(N / supEvery);
  var supports = new THREE.InstancedMesh(supGeo, supMat, supMax);
  var supCount = 0;
  dummy.quaternion.identity();
  for (i = 0; i < N; i += supEvery) {
    var sp = frames[i].pos;
    var h = sp.y - 0.1;
    if (h < 3.5) continue;
    dummy.position.set(sp.x, -0.2, sp.z);
    dummy.scale.set(1, h + 0.2, 1);
    dummy.updateMatrix();
    supports.setMatrixAt(supCount++, dummy.matrix);
  }
  supports.count = supCount;
  scene.add(supports);

  // ----------------------------------------------------------------- scenery

  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(520, 64),
    new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  function seededRandom(seed) {
    var s = seed;
    return function () {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }
  var rand = seededRandom(20260821);

  var TREE_COUNT = 170;
  var trunkGeo = new THREE.CylinderGeometry(0.22, 0.34, 2.2, 6);
  trunkGeo.translate(0, 1.1, 0);
  var leafGeo = new THREE.ConeGeometry(1.9, 5.0, 8);
  leafGeo.translate(0, 4.6, 0);
  var trunks = new THREE.InstancedMesh(trunkGeo,
    new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 1 }), TREE_COUNT);
  var leaves = new THREE.InstancedMesh(leafGeo,
    new THREE.MeshStandardMaterial({ color: 0x2f6b2f, roughness: 1 }), TREE_COUNT);

  for (i = 0; i < TREE_COUNT; i++) {
    var ang = rand() * Math.PI * 2;
    var rad = 88 + rand() * 130;
    var sc = 0.8 + rand() * 1.1;
    dummy.position.set(Math.cos(ang) * rad, 0, Math.sin(ang) * rad);
    dummy.quaternion.setFromAxisAngle(WORLD_UP, rand() * Math.PI * 2);
    dummy.scale.set(sc, sc * (0.85 + rand() * 0.5), sc);
    dummy.updateMatrix();
    trunks.setMatrixAt(i, dummy.matrix);
    leaves.setMatrixAt(i, dummy.matrix);
  }
  scene.add(trunks);
  scene.add(leaves);

  var BUSH_COUNT = 60;
  var bushGeo = new THREE.SphereGeometry(1, 10, 8);
  var bushes = new THREE.InstancedMesh(bushGeo,
    new THREE.MeshStandardMaterial({ color: 0x3c7a34, roughness: 1 }), BUSH_COUNT);
  for (i = 0; i < BUSH_COUNT; i++) {
    var ba = rand() * Math.PI * 2;
    var br = 15 + rand() * 60;
    var bs = 0.7 + rand() * 1.3;
    dummy.position.set(Math.cos(ba) * br, bs * 0.45, Math.sin(ba) * br);
    dummy.quaternion.identity();
    dummy.scale.set(bs, bs * 0.7, bs);
    dummy.updateMatrix();
    bushes.setMatrixAt(i, dummy.matrix);
  }
  scene.add(bushes);

  // Distant mountain ring on the horizon.
  var mtnMat = new THREE.MeshStandardMaterial({ color: 0x5b7386, roughness: 1 });
  for (i = 0; i < 14; i++) {
    var ma = (i / 14) * Math.PI * 2 + rand() * 0.3;
    var mr = 300 + rand() * 110;
    var mh = 45 + rand() * 70;
    var mtn = new THREE.Mesh(new THREE.ConeGeometry(40 + rand() * 35, mh, 6), mtnMat);
    mtn.position.set(Math.cos(ma) * mr, mh * 0.5 - 2, Math.sin(ma) * mr);
    mtn.rotation.y = rand() * Math.PI;
    scene.add(mtn);
  }

  // Low-poly clouds drifting slowly.
  var cloudMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92
  });
  var clouds = [];
  for (i = 0; i < 11; i++) {
    var cloud = new THREE.Group();
    var puffs = 3 + Math.floor(rand() * 3);
    for (k = 0; k < puffs; k++) {
      var pr = 4 + rand() * 6;
      var puff = new THREE.Mesh(new THREE.SphereGeometry(pr, 10, 8), cloudMat);
      puff.position.set((k - puffs / 2) * pr * 1.1, rand() * 2.5, rand() * 4 - 2);
      puff.scale.y = 0.55;
      cloud.add(puff);
    }
    var ca = rand() * Math.PI * 2;
    var cr = 90 + rand() * 180;
    cloud.position.set(Math.cos(ca) * cr, 70 + rand() * 45, Math.sin(ca) * cr);
    scene.add(cloud);
    clouds.push({ group: cloud, speed: 0.6 + rand() * 0.9 });
  }

  // -------------------------------------------------------------- ride state

  var GRAVITY = 21.6;      // scene-scaled m/s^2
  var V_TOP = 7;           // speed over the highest crest
  var V_MIN = 5;
  var V_MAX = 40;
  var EYE = 1.6;

  var dist = 0;            // arc-length distance travelled
  var speed = 12;

  var sPos = new THREE.Vector3();
  var sTan = new THREE.Vector3();
  var sUp = new THREE.Vector3();
  var lookTarget = new THREE.Vector3();

  function sampleFrame(u) {
    u = ((u % 1) + 1) % 1;
    var x = u * N;
    var i0 = Math.floor(x) % N;
    var i1 = (i0 + 1) % N;
    var a = x - Math.floor(x);
    var f0 = frames[i0];
    var f1 = frames[i1];
    sPos.copy(f0.pos).lerp(f1.pos, a);
    sTan.copy(f0.tan).lerp(f1.tan, a).normalize();
    sUp.copy(f0.up).lerp(f1.up, a).normalize();
  }

  // ------------------------------------------------------------- mouse look

  var dragging = false;
  var lastX = 0;
  var lastY = 0;
  var yaw = 0, pitch = 0, yawTarget = 0, pitchTarget = 0;
  var el = renderer.domElement;

  el.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    yawTarget = THREE.MathUtils.clamp(yawTarget - (e.clientX - lastX) * 0.0032, -1.3, 1.3);
    pitchTarget = THREE.MathUtils.clamp(pitchTarget - (e.clientY - lastY) * 0.0032, -0.7, 0.7);
    lastX = e.clientX;
    lastY = e.clientY;
  });
  function endDrag() { dragging = false; }
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);

  // -------------------------------------------------------------------- HUD

  var speedEl = document.getElementById('speed');
  var barEl = document.getElementById('bar');
  var hudTimer = 0;

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // -------------------------------------------------------------------- loop

  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);

    // Coaster physics: speed trades against height, like a real gravity ride.
    sampleFrame(dist / trackLength);
    var target = Math.sqrt(Math.max(
      2 * GRAVITY * (hMax - sPos.y) + V_TOP * V_TOP,
      V_MIN * V_MIN
    ));
    target = Math.min(target, V_MAX);
    speed += (target - speed) * Math.min(1, dt * 1.9);
    dist += speed * dt;

    var u = (dist / trackLength) % 1;
    sampleFrame(u);

    camera.position.copy(sPos).addScaledVector(sUp, EYE);
    camera.up.copy(sUp);
    lookTarget.copy(camera.position).addScaledVector(sTan, 14);
    camera.lookAt(lookTarget);

    // Free-look offset that recenters when released.
    if (!dragging) {
      yawTarget *= Math.max(0, 1 - dt * 1.6);
      pitchTarget *= Math.max(0, 1 - dt * 1.6);
    }
    yaw += (yawTarget - yaw) * Math.min(1, dt * 10);
    pitch += (pitchTarget - pitch) * Math.min(1, dt * 10);
    camera.rotateY(yaw);
    camera.rotateX(pitch);

    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      cl.group.position.x += cl.speed * dt;
      if (cl.group.position.x > 320) cl.group.position.x = -320;
    }

    hudTimer += dt;
    if (hudTimer > 0.12) {
      hudTimer = 0;
      speedEl.innerHTML = Math.round(speed * 3.6) + '<small>km/h</small>';
      barEl.style.width = (u * 100).toFixed(2) + '%';
    }

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
