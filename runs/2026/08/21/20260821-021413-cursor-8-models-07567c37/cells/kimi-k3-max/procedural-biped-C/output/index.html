<script type="importmap">

<script type="module">
import * as THREE from 'three';

const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);
const DOWN = new THREE.Vector3(0, -1, 0);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const wrapPI = (a) => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;

const errBox = document.getElementById('err');
window.addEventListener('error', (e) => {
  errBox.style.display = 'block';
  errBox.textContent = 'something went wrong — ' + (e.message || 'failed to load');
});

/* ============================================================
   Audio — tiny synthesized footsteps, hops and thuds
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.16;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.25);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  noise(dur, freq, gain) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  tone(f0, f1, dur, type, gain) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  step(speed) { this.noise(0.09, 280 + speed * 70, 0.5); this.tone(95, 52, 0.1, 'sine', 0.3); },
  jump() { this.tone(230, 540, 0.18, 'triangle', 0.28); },
  land() { this.noise(0.15, 210, 0.85); this.tone(82, 38, 0.17, 'sine', 0.5); }
};

/* ============================================================
   Renderer / scene / atmosphere
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xe8986e);
scene.fog = new THREE.Fog(HORIZON.getHex(), 26, 150);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1600);
camera.position.set(0, 3.4, -7);

const SUN_DIR = new THREE.Vector3(-0.45, 0.30, 0.84).normalize();

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(760, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x27335c) },
      horizon: { value: HORIZON },
      sunDir: { value: SUN_DIR },
      sunColor: { value: new THREE.Color(0xffd9a0) }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top; uniform vec3 horizon; uniform vec3 sunDir; uniform vec3 sunColor;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float h = clamp(d.y, 0.0, 1.0);
        vec3 col = mix(horizon, top, pow(h, 0.55));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += sunColor * (pow(s, 380.0) * 1.3 + pow(s, 22.0) * 0.22);
        col = mix(col, horizon * 0.82, smoothstep(0.0, -0.22, d.y));
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
sky.renderOrder = -10;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xffd9b0, 0x33473c, 0.68);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffb36b, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);

const rim = new THREE.DirectionalLight(0x8fa1d9, 0.4);
rim.position.set(30, 24, -40);
scene.add(rim);

/* ============================================================
   Ground — canvas-textured disc, snapped to its tile grid
   ============================================================ */
function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#55705a';
  g.fillRect(0, 0, 256, 256);
  const tones = ['#5d7a62', '#4c6650', '#62825f', '#4f6b54'];
  for (let i = 0; i < 1100; i++) {
    g.fillStyle = tones[(Math.random() * tones.length) | 0];
    g.globalAlpha = rand(0.12, 0.4);
    const s = rand(1, 3);
    g.fillRect(rand(256), rand(256), s, s);
  }
  g.globalAlpha = 1;
  g.strokeStyle = 'rgba(28, 44, 34, 0.4)';
  g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) {
    const p = i * 64;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 256); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(256, p); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(34, 34);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const TILE = 10; // 340 / 34
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(170, 56),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Scenery — recycled trees, rocks, crystals and tufts
   ============================================================ */
const MAT = {
  trunk: new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.9 }),
  pine: new THREE.MeshStandardMaterial({ color: 0x2f5d46, roughness: 0.85 }),
  pineLight: new THREE.MeshStandardMaterial({ color: 0x3a6b50, roughness: 0.85 }),
  rock: new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.95, flatShading: true }),
  crystal: new THREE.MeshStandardMaterial({ color: 0x0e2a26, emissive: 0x5eead4, emissiveIntensity: 1.5, roughness: 0.3 }),
  tuft: new THREE.MeshStandardMaterial({ color: 0x476b48, roughness: 1 })
};

function shadowed(mesh) { mesh.castShadow = true; return mesh; }

function makeTree() {
  const g = new THREE.Group();
  const trunk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 0.8, 7), MAT.trunk));
  trunk.position.y = 0.4;
  const c1 = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.1, 8), MAT.pine));
  c1.position.y = 1.15;
  const c2 = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.44, 0.85, 8), MAT.pineLight));
  c2.position.y = 1.8;
  g.add(trunk, c1, c2);
  g.scale.setScalar(rand(0.8, 1.7));
  return g;
}
function makeRock() {
  const r = shadowed(new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.3, 0.75), 0), MAT.rock));
  r.scale.y = 0.6;
  r.position.y = 0.12;
  const g = new THREE.Group();
  g.add(r);
  return g;
}
function makeCrystal() {
  const g = new THREE.Group();
  const base = shadowed(new THREE.Mesh(new THREE.DodecahedronGeometry(0.3, 0), MAT.rock));
  base.scale.y = 0.5;
  const c = shadowed(new THREE.Mesh(new THREE.OctahedronGeometry(rand(0.22, 0.4), 0), MAT.crystal));
  c.position.y = 0.45;
  c.rotation.z = rand(-0.25, 0.25);
  g.add(base, c);
  return g;
}
function makeTuft() {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.06, rand(0.25, 0.45), 5), MAT.tuft);
    blade.position.set(rand(-0.12, 0.12), 0.14, rand(-0.12, 0.12));
    blade.rotation.z = rand(-0.3, 0.3);
    g.add(blade);
  }
  return g;
}

const scenery = [];
const sceneryGroup = new THREE.Group();
scene.add(sceneryGroup);
for (let i = 0; i < 42; i++) {
  const roll = Math.random();
  const obj = roll < 0.42 ? makeTree() : roll < 0.66 ? makeRock() : roll < 0.82 ? makeCrystal() : makeTuft();
  sceneryGroup.add(obj);
  scenery.push(obj);
}

/* ============================================================
   Fireflies
   ============================================================ */
const FF_COUNT = 90;
const ffBase = new Float32Array(FF_COUNT * 3);
const ffPhase = new Float32Array(FF_COUNT);
for (let i = 0; i < FF_COUNT; i++) {
  ffBase[i * 3] = rand(-40, 40);
  ffBase[i * 3 + 1] = rand(0.3, 6.5);
  ffBase[i * 3 + 2] = rand(-40, 40);
  ffPhase[i] = rand(TAU);
}
const ffGeo = new THREE.BufferGeometry();
ffGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(FF_COUNT * 3), 3));
const fireflies = new THREE.Points(ffGeo, new THREE.PointsMaterial({
  color: 0xffd27f, size: 0.16, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
fireflies.frustumCulled = false;
scene.add(fireflies);

/* ============================================================
   Dust puffs
   ============================================================ */
function makePuffTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const puffTex = makePuffTexture();
const puffs = [];
for (let i = 0; i < 26; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: puffTex, color: 0xd9c8a9, transparent: true, opacity: 0, depthWrite: false
  }));
  s.visible = false;
  scene.add(s);
  puffs.push({ sprite: s, life: 0, max: 0.6, scale0: 0.3, rise: 0.6 });
}
function spawnPuff(pos, strength = 1) {
  const p = puffs.find((p) => p.life <= 0);
  if (!p) return;
  p.max = rand(0.45, 0.7);
  p.life = p.max;
  p.scale0 = rand(0.2, 0.34) * strength;
  p.rise = rand(0.4, 0.9);
  p.sprite.position.set(pos.x + rand(-0.12, 0.12), Math.max(pos.y, 0) + 0.08, pos.z + rand(-0.12, 0.12));
  p.sprite.visible = true;
}
function updatePuffs(dt) {
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.sprite.visible = false; p.sprite.material.opacity = 0; continue; }
    const t = 1 - p.life / p.max;
    const sc = p.scale0 * (0.6 + t * 1.9);
    p.sprite.scale.set(sc, sc, 1);
    p.sprite.material.opacity = (1 - t) * 0.45;
    p.sprite.position.y += p.rise * dt;
  }
}

/* ============================================================
   The creature
   ============================================================ */
const CREAM = new THREE.MeshStandardMaterial({ color: 0xf2e6cf, roughness: 0.55 });
const ACCENT = new THREE.MeshStandardMaterial({ color: 0xff6b4a, roughness: 0.5 });
const ACCENT_GLOW = new THREE.MeshStandardMaterial({ color: 0x40160c, emissive: 0xff6b4a, emissiveIntensity: 1.4, roughness: 0.4 });
const DARK = new THREE.MeshStandardMaterial({ color: 0x39404d, roughness: 0.7 });
const SOCKET = new THREE.MeshStandardMaterial({ color: 0x20262f, roughness: 0.35 });
const EYE = new THREE.MeshBasicMaterial({ color: 0xa5f3fc });

const HIP_W = 0.17;
const L1 = 0.5, L2 = 0.52;
const ANKLE_H = 0.12;
const FOOT_H = 0.10;
const STAND_H = 1.02;

const rootPos = new THREE.Vector3(0, 0, 0);
let rootY = 0, vy = 0, grounded = true;
let yaw = 0, speed = 0, targetSpeed = 2.2;
const forward = new THREE.Vector3(0, 0, 1);
const right = new THREE.Vector3(1, 0, 0);
const vel = new THREE.Vector3();

const bodyGroup = new THREE.Group();
bodyGroup.rotation.order = 'YXZ';
scene.add(bodyGroup);

const torso = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.42, 6, 18), CREAM));
torso.position.y = 0.34;
torso.scale.set(1, 1, 0.92);
bodyGroup.add(torso);

const belly = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 14), ACCENT));
belly.scale.set(0.9, 1.05, 0.55);
belly.position.set(0, 0.26, 0.24);
bodyGroup.add(belly);

const pack = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.34, 0.16), ACCENT));
pack.position.set(0, 0.4, -0.36);
bodyGroup.add(pack);
const packFlap = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.1, 0.18), DARK));
packFlap.position.set(0, 0.55, -0.36);
bodyGroup.add(packFlap);

const headGroup = new THREE.Group();
headGroup.position.y = 0.95;
bodyGroup.add(headGroup);

const head = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 18), CREAM));
head.scale.set(1, 0.92, 0.95);
headGroup.add(head);

const eyeGroups = [];
for (const side of [-1, 1]) {
  const eg = new THREE.Group();
  eg.position.set(side * 0.12, 0.03, 0.24);
  const socket = new THREE.Mesh(new THREE.SphereGeometry(0.08, 14, 10), SOCKET);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 8), EYE);
  glow.position.z = 0.045;
  eg.add(socket, glow);
  headGroup.add(eg);
  eyeGroups.push(eg);
}

const antennae = [];
for (const side of [-1, 1]) {
  const ag = new THREE.Group();
  ag.position.set(side * 0.1, 0.24, 0);
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.3, 6), DARK);
  stalk.geometry.translate(0, 0.15, 0);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 8), ACCENT_GLOW);
  bulb.position.y = 0.31;
  ag.add(stalk, bulb);
  headGroup.add(ag);
  antennae.push({ group: ag, ax: 0, az: 0, vx: 0, vz: 0 });
}

const shoulders = [];
for (const side of [-1, 1]) {
  const sg = new THREE.Group();
  sg.position.set(side * 0.37, 0.6, 0);
  const arm = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.26, 4, 10), DARK));
  arm.geometry.translate(0, -0.16, 0);
  const hand = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), ACCENT));
  hand.position.y = -0.36;
  sg.add(arm, hand);
  bodyGroup.add(sg);
  shoulders.push(sg);
}

/* Legs — world-space meshes driven by two-bone IK */
function makeLimb(radius, len) {
  const m = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(radius, len, 4, 10), DARK));
  m.geometry.translate(0, -len / 2, 0);
  scene.add(m);
  return m;
}
const legMeshes = [];
for (const side of [-1, 1]) {
  const thigh = makeLimb(0.085, L1);
  const shin = makeLimb(0.068, L2);
  const knee = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.088, 12, 10), DARK));
  const hip = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), DARK));
  const foot = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), DARK));
  foot.scale.set(1.05, 0.62, 1.6);
  scene.add(knee, hip, foot);
  legMeshes.push({ thigh, shin, knee, hip, foot });
}

const legs = [-1, 1].map((side) => ({
  side,
  foot: new THREE.Vector3(side * HIP_W, 0, side * 0.06),
  from: new THREE.Vector3(),
  to: new THREE.Vector3(),
  ankle: new THREE.Vector3(),
  swinging: false,
  t: 0
}));

/* ============================================================
   Input
   ============================================================ */
const input = { steer: 0, userYaw: 0, userPitch: 0, dragging: false, lx: 0, ly: 0 };
const keys = {};

window.addEventListener('pointerdown', (e) => {
  AudioSys.ensure();
  input.dragging = true;
  input.lx = e.clientX; input.ly = e.clientY;
});
window.addEventListener('pointermove', (e) => {
  if (!input.dragging) return;
  const dx = e.clientX - input.lx, dy = e.clientY - input.ly;
  input.lx = e.clientX; input.ly = e.clientY;
  input.userYaw -= dx * 0.0052;
  input.userPitch = clamp(input.userPitch + dy * 0.0038, -0.15, 1.0);
});
window.addEventListener('pointerup', () => { input.dragging = false; });
window.addEventListener('pointercancel', () => { input.dragging = false; });
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetSpeed = clamp(targetSpeed - e.deltaY * 0.0022, 0, 5.6);
}, { passive: false });
window.addEventListener('keydown', (e) => {
  AudioSys.ensure();
  if (e.code === 'Space') {
    e.preventDefault();
    doJump();
  } else if (e.code === 'KeyM') {
    AudioSys.muted = !AudioSys.muted;
  } else {
    keys[e.code] = true;
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('dblclick', () => { AudioSys.ensure(); doJump(); });

function doJump() {
  if (!grounded) return;
  grounded = false;
  vy = 5.4;
  AudioSys.jump();
  for (const a of antennae) a.vx -= 3;
}

/* ============================================================
   Gait + body kinematics
   ============================================================ */
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _hip = new THREE.Vector3(), _hipGround = new THREE.Vector3();
const _knee = new THREE.Vector3(), _feetMid = new THREE.Vector3();

let bodyY = STAND_H, pitch = 0, roll = 0;
let squash = 0, squashV = 0;
let blinkT = rand(2, 4), blinkPhase = -1;
let headYaw = 0, headPitch = 0;
const prevVel = new THREE.Vector3();
const bodyAcc = new THREE.Vector3();

function hipWorld(side, out) {
  out.set(side * HIP_W, 0.02, 0);
  return bodyGroup.localToWorld(out);
}

function solveKnee(hip, ankle, out) {
  const d = _v1.copy(ankle).sub(hip);
  let dist = d.length();
  const maxD = L1 + L2 - 0.002;
  if (dist > maxD) { d.multiplyScalar(maxD / dist); dist = maxD; }
  if (dist < 0.12) { d.setLength(0.12); dist = 0.12; }
  const dir = d.normalize();
  const a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
  const bend = _v2.copy(forward).addScaledVector(dir, -forward.dot(dir));
  if (bend.lengthSq() < 1e-6) bend.set(0, 0, 1); else bend.normalize();
  out.copy(hip).addScaledVector(dir, a).addScaledVector(bend, h);
}

function aim(mesh, from, to) {
  mesh.position.copy(from);
  _v3.copy(to).sub(from).normalize();
  mesh.quaternion.setFromUnitVectors(DOWN, _v3);
}

function onPlant(leg) {
  const n = 2 + Math.round(speed * 0.8);
  for (let i = 0; i < n; i++) spawnPuff(leg.foot, 0.7 + speed * 0.12);
  AudioSys.step(speed);
  if (speed > 3.5) squashV -= 0.35;
}

function onLand() {
  AudioSys.land();
  squashV -= 2.6;
  for (const a of antennae) a.vx += 5;
  for (let i = 0; i < 10; i++) {
    _v3.set(rootPos.x + rand(-0.5, 0.5), 0, rootPos.z + rand(-0.5, 0.5));
    spawnPuff(_v3, 1.6);
  }
  for (const leg of legs) {
    leg.swinging = false;
    hipWorld(leg.side, _hipGround).y = 0;
    leg.foot.set(_hipGround.x, 0, _hipGround.z).addScaledVector(forward, leg.side * -0.05);
  }
}

function updateGait(dt, t) {
  const swingTime = clamp(0.38 - speed * 0.045, 0.16, 0.38);
  const stepThresh = 0.3 + speed * 0.075;
  const stepH = 0.12 + speed * 0.03;

  for (let i = 0; i < 2; i++) {
    const leg = legs[i];
    const other = legs[1 - i];
    hipWorld(leg.side, _hip);
    _hipGround.set(_hip.x, 0, _hip.z);

    if (!grounded) {
      _v3.copy(rootPos)
        .addScaledVector(right, leg.side * HIP_W * 1.15)
        .addScaledVector(forward, 0.12);
      _v3.y = Math.max(rootY * 0.5, 0.12) + 0.06;
      leg.foot.lerp(_v3, 1 - Math.exp(-10 * dt));
      leg.swinging = false;
      continue;
    }

    if (leg.swinging) {
      leg.t += dt / swingTime;
      leg.to.copy(_hipGround).addScaledVector(vel, swingTime * 0.55).addScaledVector(forward, 0.08);
      leg.to.y = 0;
      if (leg.t >= 1) {
        leg.foot.copy(leg.to);
        leg.swinging = false;
        onPlant(leg);
      } else {
        leg.foot.lerpVectors(leg.from, leg.to, leg.t);
        leg.foot.y = Math.sin(leg.t * Math.PI) * stepH;
      }
    } else if (!other.swinging && leg.foot.distanceTo(_hipGround) > stepThresh) {
      leg.swinging = true;
      leg.t = 0;
      leg.from.copy(leg.foot);
    }
  }
}

function updateBody(dt, t) {
  speed = damp(speed, targetSpeed, 3, dt);
  const steer = (keys.KeyA ? 1 : 0) - (keys.KeyD ? 1 : 0);
  yaw += steer * dt * (1.5 + speed * 0.12);
  forward.set(Math.sin(yaw), 0, Math.cos(yaw));
  right.crossVectors(UP, forward);
  vel.copy(forward).multiplyScalar(speed);
  rootPos.addScaledVector(vel, dt);

  if (!grounded) {
    rootY += vy * dt;
    vy -= 14 * dt;
    if (rootY <= 0) { rootY = 0; vy = 0; grounded = true; onLand(); }
  }

  bodyAcc.copy(vel).sub(prevVel).divideScalar(Math.max(dt, 1e-4));
  prevVel.copy(vel);

  _feetMid.addVectors(legs[0].foot, legs[1].foot).multiplyScalar(0.5);
  const spread = legs[0].foot.distanceTo(legs[1].foot);
  const idleBob = Math.sin(t * 1.9) * 0.012 * (1 - clamp(speed, 0, 1));
  const yTarget = STAND_H - spread * 0.1 + rootY + idleBob;
  bodyY = damp(bodyY, yTarget, 12, dt);

  squashV += (-120 * squash - 10 * squashV) * dt;
  squash += squashV * dt;

  _v3.copy(_feetMid).sub(rootPos); _v3.y = 0;
  const pitchT = clamp(_v3.dot(forward) * 0.35, -0.2, 0.2) + speed * 0.028 + (grounded ? 0 : -vy * 0.02);
  const rollT = clamp(-_v3.dot(right) * 0.5, -0.25, 0.25) - steer * speed * 0.02;
  pitch = damp(pitch, pitchT, 8, dt);
  roll = damp(roll, rollT, 8, dt);

  bodyGroup.position.set(rootPos.x, bodyY, rootPos.z);
  bodyGroup.rotation.set(pitch, yaw, roll);
  torso.scale.set(1 - squash * 0.22, 1 + squash * 0.32, 0.92 - squash * 0.22);

  // head: wander while walking, watch the camera when idle
  const idle = 1 - clamp(speed * 1.5, 0, 1);
  const wanderYaw = Math.sin(t * 0.4) * 0.35 + Math.sin(t * 0.13 + 2) * 0.25;
  const camYawRel = wrapPI(Math.atan2(camera.position.x - rootPos.x, camera.position.z - rootPos.z) - yaw);
  const headYawT = wanderYaw * (1 - idle) + clamp(camYawRel, -1.05, 1.05) * idle;
  headYaw = damp(headYaw, headYawT, 4, dt);
  headPitch = damp(headPitch, Math.sin(t * 0.27) * 0.12 + 0.05 - speed * 0.015, 4, dt);
  headGroup.rotation.set(headPitch, headYaw, 0);

  // blink
  blinkT -= dt;
  if (blinkT <= 0 && blinkPhase < 0) { blinkPhase = 0; blinkT = rand(2.2, 5); }
  if (blinkPhase >= 0) {
    blinkPhase += dt;
    const bt = blinkPhase / 0.16;
    const s = bt < 0.5 ? 1 - bt * 2 * 0.92 : 0.08 + (bt - 0.5) * 2 * 0.92;
    for (const eg of eyeGroups) eg.scale.y = clamp(s, 0.08, 1);
    if (bt >= 1) { blinkPhase = -1; for (const eg of eyeGroups) eg.scale.y = 1; }
  }

  // antennae springs
  const accF = clamp(bodyAcc.dot(forward), -30, 30);
  const accR = clamp(bodyAcc.dot(right), -30, 30);
  for (const a of antennae) {
    a.vx += (-90 * a.ax - 7 * a.vx) * dt - accF * dt * 0.9;
    a.vz += (-90 * a.az - 7 * a.vz) * dt - accR * dt * 0.9;
    a.ax += a.vx * dt;
    a.az += a.vz * dt;
    a.group.rotation.set(clamp(a.ax, -0.9, 0.9), 0, clamp(a.az, -0.9, 0.9));
  }

  // arms swing opposite to same-side legs
  for (let i = 0; i < 2; i++) {
    const leg = legs[1 - i];
    _v3.copy(leg.foot).sub(rootPos);
    const swing = clamp(_v3.dot(forward) * 1.2, -0.75, 0.75);
    const raise = grounded ? 0 : 0.9;
    shoulders[i].rotation.x = damp(shoulders[i].rotation.x, -swing - raise, 10, dt);
    shoulders[i].rotation.z = damp(shoulders[i].rotation.z, (i === 0 ? -1 : 1) * (0.22 + speed * 0.02 + raise * 0.5), 10, dt);
  }
}

function updateLegMeshes() {
  for (let i = 0; i < 2; i++) {
    const leg = legs[i];
    const meshes = legMeshes[i];
    hipWorld(leg.side, _hip);
    leg.ankle.copy(leg.foot);
    leg.ankle.y += ANKLE_H;
    solveKnee(_hip, leg.ankle, _knee);
    aim(meshes.thigh, _hip, _knee);
    aim(meshes.shin, _knee, leg.ankle);
    meshes.knee.position.copy(_knee);
    meshes.hip.position.copy(_hip);
    meshes.foot.position.set(leg.foot.x, leg.foot.y + FOOT_H * 0.6, leg.foot.z).addScaledVector(forward, 0.05);
    meshes.foot.rotation.set(leg.swinging ? -Math.sin(leg.t * Math.PI) * 0.45 : 0, yaw, 0);
  }
}

/* ============================================================
   World upkeep
   ============================================================ */
function placeScenery(obj, initial) {
  const ahead = initial ? rand(-40, 150) : rand(90, 150);
  const side = Math.random() < 0.5 ? -1 : 1;
  obj.position.copy(rootPos)
    .addScaledVector(forward, ahead)
    .addScaledVector(right, side * rand(7, 48));
  obj.rotation.y = rand(TAU);
}
for (const obj of scenery) placeScenery(obj, true);

function updateWorld(dt, t) {
  const sx = Math.round(rootPos.x / TILE) * TILE;
  const sz = Math.round(rootPos.z / TILE) * TILE;
  ground.position.set(sx, 0, sz);
  sky.position.set(rootPos.x, 0, rootPos.z);

  const lx = Math.round(rootPos.x * 2) / 2;
  const lz = Math.round(rootPos.z * 2) / 2;
  sun.position.set(lx + SUN_DIR.x * 60, SUN_DIR.y * 60, lz + SUN_DIR.z * 60);
  sun.target.position.set(lx, 0, lz);
  sun.target.updateMatrixWorld();

  for (const obj of scenery) {
    _v3.copy(obj.position).sub(rootPos);
    if (_v3.dot(forward) < -15) placeScenery(obj, false);
  }

  const pos = ffGeo.attributes.position.array;
  for (let i = 0; i < FF_COUNT; i++) {
    const ph = ffPhase[i];
    const bx = ffBase[i * 3] + Math.sin(t * 0.4 + ph) * 2.2;
    const by = ffBase[i * 3 + 1] + Math.sin(t * 0.7 + ph * 1.7) * 0.6;
    const bz = ffBase[i * 3 + 2] + Math.cos(t * 0.33 + ph) * 2.2;
    pos[i * 3] = camera.position.x + ((((bx - camera.position.x) % 80) + 80) % 80) - 40;
    pos[i * 3 + 1] = ((by % 8) + 8) % 8 + 0.2;
    pos[i * 3 + 2] = camera.position.z + ((((bz - camera.position.z) % 80) + 80) % 80) - 40;
  }
  ffGeo.attributes.position.needsUpdate = true;
  fireflies.material.opacity = 0.6 + Math.sin(t * 2.1) * 0.2;
}

/* ============================================================
   Camera
   ============================================================ */
const camPos = new THREE.Vector3(0, 3.4, -7);
function updateCamera(dt) {
  const dist = 5.9 + speed * 0.22;
  const cy = yaw + Math.PI + input.userYaw;
  const cp = clamp(0.34 + input.userPitch, -0.05, 1.25);
  _v3.set(
    Math.sin(cy) * Math.cos(cp),
    Math.sin(cp),
    Math.cos(cy) * Math.cos(cp)
  ).multiplyScalar(dist);
  _v3.add(rootPos);
  _v3.y += 1.0 + rootY * 0.4;
  camPos.x = damp(camPos.x, _v3.x, 6, dt);
  camPos.y = damp(camPos.y, _v3.y, 6, dt);
  camPos.z = damp(camPos.z, _v3.z, 6, dt);
  camera.position.copy(camPos);
  camera.lookAt(rootPos.x, rootY + 1.35, rootPos.z);
}

/* ============================================================
   HUD + main loop
   ============================================================ */
const paceVal = document.getElementById('paceval');
const paceFill = document.getElementById('pacefill');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let elapsed = 0;
let introDone = false;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateBody(dt, elapsed);
  updateGait(dt, elapsed);
  updateLegMeshes();
  updateWorld(dt, elapsed);
  updatePuffs(dt);
  updateCamera(dt);

  paceVal.textContent = targetSpeed.toFixed(1);
  paceFill.style.width = (targetSpeed / 5.6) * 100 + '%';

  renderer.render(scene, camera);

  if (!introDone) {
    introDone = true;
    setTimeout(() => document.getElementById('intro').classList.add('gone'), 700);
  }
}
frame();
</script>
</body>
</html>
