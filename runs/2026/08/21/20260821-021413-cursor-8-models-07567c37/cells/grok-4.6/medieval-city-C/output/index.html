<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eldermere — A Living Medieval City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1410;
      --parchment: #e8dcc4;
      --gold: #c4a574;
      --ember: #d4784a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0a0c; }
    canvas { display: block; width: 100%; height: 100%; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at 50% 42%, transparent 40%, rgba(8,6,10,0.55) 100%);
    }
    #grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: 0.07;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    }
    #ui {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      color: var(--parchment);
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    #title {
      position: absolute; left: 48px; top: 42px;
      transition: opacity 1.4s ease, transform 1.4s ease;
    }
    #title.settled { opacity: 0.92; transform: translateY(0); }
    .kicker {
      font-family: Cinzel, serif; letter-spacing: 0.42em; font-size: 10px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
    }
    h1 {
      font-family: Cinzel, serif; font-weight: 700; font-size: clamp(36px, 5vw, 64px);
      line-height: 0.92; letter-spacing: 0.04em; text-shadow: 0 2px 24px rgba(0,0,0,0.55);
    }
    .sub {
      margin-top: 10px; font-size: 18px; font-style: italic; opacity: 0.78; letter-spacing: 0.04em;
    }
    #hud {
      position: absolute; right: 36px; top: 36px; text-align: right;
      font-size: 15px; letter-spacing: 0.04em; opacity: 0.88;
    }
    #hud .row { margin: 3px 0; }
    #hud .label {
      font-family: Cinzel, serif; font-size: 9px; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 2px;
    }
    #look {
      position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
      font-family: Cinzel, serif; font-size: 11px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--gold); opacity: 0; transition: opacity 0.35s ease;
      text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    }
    #look.show { opacity: 1; }
    #hint {
      position: absolute; left: 48px; bottom: 36px;
      font-size: 14px; opacity: 0.7; max-width: 70vw; line-height: 1.45;
    }
    #hint kbd {
      font-family: Cinzel, serif; font-size: 10px; letter-spacing: 0.12em;
      border: 1px solid rgba(196,165,116,0.45); padding: 1px 6px; border-radius: 3px;
      color: var(--gold);
    }
    #clockbar {
      position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
      width: min(280px, 40vw); height: 3px; background: rgba(232,220,196,0.18); border-radius: 2px;
    }
    #clockfill {
      height: 100%; width: 35%; background: linear-gradient(90deg, #3a4a7a, #e8b86d, #d4784a, #1a1428);
      border-radius: 2px;
    }
    #fade {
      position: fixed; inset: 0; z-index: 6; background: #0b0a0c;
      animation: rise 1.8s ease forwards; pointer-events: none;
    }
    @keyframes rise { to { opacity: 0; } }
  </style>
</head>
<body>
  <div id="fade"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="ui">
    <div id="title">
      <div class="kicker">Free borough of the river vale</div>
      <h1 id="cityName">Eldermere</h1>
      <div class="sub" id="citySub">walled market town, year of the high harvest</div>
    </div>
    <div id="hud">
      <div class="row"><span class="label">Hour</span><span id="hourLabel">Dusk</span></div>
      <div class="row"><span class="label">Souls</span><span id="popLabel">—</span></div>
      <div class="row"><span class="label">Seed</span><span id="seedLabel">—</span></div>
    </div>
    <div id="look"></div>
    <div id="hint">
      Drag to orbit · scroll to approach · <kbd>R</kbd> new borough · <kbd>Space</kbd> hold the hour · <kbd>[</kbd> <kbd>]</kbd> turn the sun
    </div>
    <div id="clockbar"><div id="clockfill"></div></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const PREFIX = ["Elder","Raven","Mill","Stone","Haw","Dun","Whit","Ash","Thorn","Oak","Grey","Bramble","Fen","Hart","Willow"];
    const SUFFIX = ["mere","ford","wick","burgh","haven","stead","by","hall","gate","wald","hurst","combe"];
    const MOTTO = [
      "walled market town, year of the high harvest",
      "where the mill-race meets the king's road",
      "kept by the river and the old wall",
      "borough of bakers, bells, and watchfires",
      "under the spire and the evening banners"
    ];

    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const smooth = (t) => t * t * (3 - 2 * t);

    const hashSeed = () => {
      const h = new URLSearchParams(location.hash.replace(/^#/, ""));
      const s = h.get("seed");
      if (s && /^\d+$/.test(s)) return Number(s);
      return (Math.random() * 0xffffffff) >>> 0;
    };

    function boxAt(w, h, d, x, y, z, ry = 0) {
      const g = new THREE.BoxGeometry(w, h, d);
      g.translate(0, h / 2, 0);
      if (ry) g.rotateY(ry);
      g.translate(x, y, z);
      return g;
    }
    function coneAt(r, h, seg, x, y, z, ry = 0, sx = 1, sz = 1) {
      const g = new THREE.ConeGeometry(r, h, seg);
      g.translate(0, h / 2, 0);
      g.scale(sx, 1, sz);
      if (ry) g.rotateY(ry);
      g.translate(x, y, z);
      return g;
    }
    function cylAt(rt, rb, h, seg, x, y, z, ry = 0) {
      const g = new THREE.CylinderGeometry(rt, rb, h, seg);
      g.translate(0, h / 2, 0);
      if (ry) g.rotateY(ry);
      g.translate(x, y, z);
      return g;
    }
    function merge(list) {
      const clean = list.filter(Boolean);
      if (!clean.length) return null;
      const m = mergeGeometries(clean, false);
      clean.forEach((g) => g.dispose());
      return m;
    }
    function mat(color, opts = {}) {
      return new THREE.MeshStandardMaterial({
        color, roughness: opts.roughness ?? 0.82, metalness: opts.metalness ?? 0.04,
        emissive: new THREE.Color(opts.emissive ?? 0x000000),
        emissiveIntensity: opts.emissiveIntensity ?? 0,
        flatShading: !!opts.flat,
        side: opts.side ?? THREE.FrontSide
      });
    }

    const skyVert = `
      varying vec3 vW;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`;
    const skyFrag = `
      uniform vec3 uSun;
      uniform float uT;
      varying vec3 vW;
      void main() {
        vec3 dir = normalize(vW);
        float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
        float sun = pow(max(dot(dir, normalize(uSun)), 0.0), 32.0);
        float day = smoothstep(-0.15, 0.25, uSun.y);
        vec3 nightZen = vec3(0.03, 0.04, 0.10);
        vec3 nightHor = vec3(0.06, 0.05, 0.10);
        vec3 dayZen = vec3(0.35, 0.55, 0.82);
        vec3 dayHor = vec3(0.78, 0.84, 0.90);
        vec3 duskZen = vec3(0.18, 0.12, 0.32);
        vec3 duskHor = vec3(0.92, 0.52, 0.28);
        float dusk = 1.0 - abs(uSun.y) * 2.2;
        dusk = clamp(dusk, 0.0, 1.0);
        vec3 zen = mix(nightZen, dayZen, day);
        vec3 hor = mix(nightHor, dayHor, day);
        zen = mix(zen, duskZen, dusk * 0.85);
        hor = mix(hor, duskHor, dusk);
        vec3 col = mix(hor, zen, pow(h, 0.85));
        col += vec3(1.0, 0.78, 0.45) * sun * (0.25 + day * 0.55);
        float star = 0.0;
        if (day < 0.35) {
          float n = fract(sin(dot(dir.xy, vec2(12.9898,78.233))) * 43758.5453);
          star = step(0.992, n) * (1.0 - day / 0.35);
        }
        col += vec3(0.85, 0.9, 1.0) * star * 0.65;
        gl_FragColor = vec4(col, 1.0);
      }`;

    const waterVert = `
      uniform float uTime;
      varying vec2 vUv;
      varying float vLift;
      void main() {
        vUv = uv;
        vec3 p = position;
        vLift = sin(p.x * 0.35 + uTime * 1.35) * 0.07 + sin(p.z * 0.55 + uTime * 0.95) * 0.05;
        p.y += vLift;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;
    const waterFrag = `
      uniform vec3 uDeep;
      uniform vec3 uLite;
      uniform float uNight;
      varying vec2 vUv;
      varying float vLift;
      void main() {
        vec3 col = mix(uDeep, uLite, vUv.y * 0.4 + vLift * 2.0 + 0.35);
        col = mix(col, col * 0.35, uNight);
        gl_FragColor = vec4(col, 0.92);
      }`;

    const flagVert = `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 p = position;
        float k = uv.x;
        p.z += sin(uTime * 3.2 + uv.x * 7.0) * 0.16 * k;
        p.y += sin(uTime * 2.4 + uv.x * 5.0) * 0.05 * k;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;
    const flagFrag = `
      uniform vec3 uColor;
      varying vec2 vUv;
      void main() {
        float stripe = step(0.5, fract(vUv.y * 3.0));
        vec3 col = mix(uColor, uColor * 0.55, stripe);
        gl_FragColor = vec4(col, 1.0);
      }`;

    const winVert = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        #ifdef USE_INSTANCING
          vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        #else
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
        #endif
        gl_Position = projectionMatrix * mv;
      }`;
    const winFrag = `
      uniform float uNight;
      uniform vec3 uOn;
      varying vec2 vUv;
      void main() {
        float pane = step(0.12, vUv.x) * step(vUv.x, 0.88) * step(0.12, vUv.y) * step(vUv.y, 0.88);
        vec3 dark = vec3(0.12, 0.10, 0.08);
        vec3 col = mix(dark, uOn, uNight);
        gl_FragColor = vec4(col, 1.0) * pane;
      }`;

    class Borough {
      constructor(seed) {
        this.seed = seed >>> 0;
        this.rng = mulberry32(this.seed);
        this.group = new THREE.Group();
        this.paths = [];
        this.chimneys = [];
        this.torches = [];
        this.labels = [];
        this.flags = [];
        this.npcs = null;
        this.carts = [];
        this.birds = null;
        this.smoke = null;
        this.windows = null;
        this.water = null;
        this.millSails = null;
        this.fountainSpray = null;
        this.name = pick(this.rng, PREFIX) + pick(this.rng, SUFFIX);
        this.motto = pick(this.rng, MOTTO);
        this.pop = 180 + Math.floor(this.rng() * 220);
        this.build();
      }

      roadKind(x, z) {
        const r = Math.hypot(x, z);
        const a = Math.atan2(z, x);
        if (r < 7.4) return "plaza";
        const gates = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2];
        for (const g of gates) {
          let da = Math.abs(a - g);
          da = Math.min(da, Math.PI * 2 - da);
          if (r > 6.5 && r < 47 && da * r < 1.85) return "radial";
        }
        for (const rr of [15.5, 27.5, 38.5]) {
          if (Math.abs(r - rr) < 1.35 && r > 8) return "ring";
        }
        return null;
      }

      build() {
        const { rng, group } = this;
        const buckets = { stone: [], plaster: [], plasterW: [], timber: [], clay: [], slate: [], thatch: [], dark: [], trim: [] };
        const WALL_R = 46;

        this.makeGround(rng);
        this.makeRiver(rng);
        this.makeWalls(rng, buckets, WALL_R);
        this.makeCathedral(buckets);
        this.makeKeep(buckets);
        this.makeMarket(rng, buckets);
        this.makeHouses(rng, buckets, WALL_R);
        this.makeBridge(buckets);
        this.makeWindmill(rng, buckets);
        this.makeFountain(buckets);
        this.flush(buckets);
        this.makeTrees(rng, WALL_R);
        this.makeFarms(rng);
        this.makeWindows(rng);
        this.makeFlags(rng);
        this.makePaths();
        this.makePeople(rng);
        this.makeCarts(rng);
        this.makeBirds();
        this.makeSmoke();
        this.makeTorches();

        this.labels.push({ name: "High Cathedral", pos: new THREE.Vector3(0, 8, -2.5), r: 7 });
        this.labels.push({ name: "Lord's Keep", pos: new THREE.Vector3(-22, 7, 18), r: 8 });
        this.labels.push({ name: "Market Square", pos: new THREE.Vector3(0, 2, 0), r: 8 });
        this.labels.push({ name: "River Gate", pos: new THREE.Vector3(0, 4, 46), r: 6 });
        this.labels.push({ name: "The Old Wall", pos: new THREE.Vector3(46, 6, 0), r: 5 });
      }

      makeGround(rng) {
        const geo = new THREE.PlaneGeometry(320, 320, 96, 96);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        const col = new Float32Array(pos.count * 3);
        const cGrass = new THREE.Color("#3f5c38");
        const cGrass2 = new THREE.Color("#4d6a42");
        const cDirt = new THREE.Color("#6b5538");
        const cCobble = new THREE.Color("#7a7164");
        const cPlaza = new THREE.Color("#8a8172");
        const cFarm = new THREE.Color("#6b7a3a");
        const cSand = new THREE.Color("#8a7a58");
        const tmp = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const r = Math.hypot(x, z);
          const n = Math.sin(x * 0.07) * Math.cos(z * 0.06) + Math.sin(x * 0.21 + z * 0.13) * 0.45;
          let y = 0;
          if (r > 50) y = n * 2.4 * Math.min(1, (r - 50) / 40);
          if (r > 120) y += (r - 120) * 0.04;
          const riverZ = 58 + Math.sin(x * 0.045) * 10;
          const riverW = 9 + Math.sin(x * 0.02) * 2;
          if (Math.abs(z - riverZ) < riverW) y = -0.55;
          pos.setY(i, y);
          const road = this.roadKind(x, z);
          if (Math.abs(z - riverZ) < riverW) tmp.copy(cSand);
          else if (road === "plaza") tmp.copy(cPlaza);
          else if (road) tmp.copy(cCobble);
          else if (r < 47) tmp.copy(cDirt).lerp(cCobble, 0.35);
          else if (r > 58 && r < 95 && z < 20 && (Math.floor(x / 12) + Math.floor(z / 10)) % 3 !== 0) tmp.copy(cFarm);
          else tmp.copy(cGrass).lerp(cGrass2, (n + 1) * 0.5);
          const j = (rng() - 0.5) * 0.06;
          col[i * 3] = clamp(tmp.r + j, 0, 1);
          col[i * 3 + 1] = clamp(tmp.g + j, 0, 1);
          col[i * 3 + 2] = clamp(tmp.b + j, 0, 1);
        }
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
          vertexColors: true, roughness: 0.95, metalness: 0
        }));
        mesh.receiveShadow = true;
        mesh.userData.label = "The Vale";
        this.group.add(mesh);
      }

      makeRiver(rng) {
        const geo = new THREE.PlaneGeometry(220, 18, 80, 10);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const bend = Math.sin(x * 0.045) * 10;
          pos.setZ(i, z + 58 + bend);
          pos.setY(i, 0.12);
        }
        geo.computeVertexNormals();
        const matW = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uDeep: { value: new THREE.Color("#1c3a44") },
            uLite: { value: new THREE.Color("#4a7a78") },
            uNight: { value: 0 }
          },
          vertexShader: waterVert,
          fragmentShader: waterFrag,
          transparent: true
        });
        const water = new THREE.Mesh(geo, matW);
        water.userData.label = "Mill Race";
        this.water = water;
        this.group.add(water);
      }

      makeWalls(rng, b, R) {
        const segs = 56;
        for (let i = 0; i < segs; i++) {
          const a0 = (i / segs) * Math.PI * 2;
          const a1 = ((i + 1) / segs) * Math.PI * 2;
          const mid = (a0 + a1) / 2;
          const isGate = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2].some((g) => {
            let d = Math.abs(mid - g);
            d = Math.min(d, Math.PI * 2 - d);
            return d < 0.12;
          });
          const x = Math.cos(mid) * R;
          const z = Math.sin(mid) * R;
          const ry = -mid + Math.PI / 2;
          const len = (2 * Math.PI * R) / segs + 0.15;
          if (isGate) {
            b.stone.push(boxAt(4.2, 9.2, 3.4, x, 0, z, ry));
            b.stone.push(boxAt(1.3, 9.2, 3.4, x + Math.cos(mid) * 0.2 - Math.sin(mid) * 2.2, 0, z + Math.sin(mid) * 0.2 + Math.cos(mid) * 2.2, ry));
            b.stone.push(boxAt(1.3, 9.2, 3.4, x + Math.cos(mid) * 0.2 + Math.sin(mid) * 2.2, 0, z + Math.sin(mid) * 0.2 - Math.cos(mid) * 2.2, ry));
            b.slate.push(coneAt(2.6, 3.2, 4, x, 9.2, z, ry + Math.PI / 4));
            continue;
          }
          b.stone.push(boxAt(len, 6.2, 2.15, x, 0, z, ry));
          const merlons = 2;
          for (let m = 0; m < merlons; m++) {
            const t = (m + 0.35) / merlons - 0.5;
            const mx = x + Math.sin(mid) * t * len;
            const mz = z - Math.cos(mid) * t * len;
            b.stone.push(boxAt(0.55, 0.85, 2.25, mx, 6.2, mz, ry));
          }
        }
        const towers = 8;
        for (let i = 0; i < towers; i++) {
          const a = (i / towers) * Math.PI * 2 + Math.PI / 8;
          const x = Math.cos(a) * (R + 0.4);
          const z = Math.sin(a) * (R + 0.4);
          b.stone.push(cylAt(2.35, 2.55, 10.5, 8, x, 0, z));
          b.slate.push(coneAt(2.7, 4.4, 8, x, 10.5, z));
          b.trim.push(cylAt(2.5, 2.5, 0.35, 8, x, 10.15, z));
          this.chimneys.push(new THREE.Vector3(x, 14.6, z));
          this.torches.push(new THREE.Vector3(x, 8.4, z));
        }
      }

      makeCathedral(b) {
        const x = 0, z = -3.2;
        b.stone.push(boxAt(8.4, 7.2, 14.5, x, 0, z));
        b.stone.push(boxAt(14.2, 5.4, 5.2, x, 0, z));
        b.slate.push(coneAt(6.4, 4.2, 4, x, 7.2, z, Math.PI / 4, 0.55, 1.15));
        b.slate.push(coneAt(4.2, 3.2, 4, x, 5.4, z, Math.PI / 4, 1.4, 0.55));
        b.stone.push(boxAt(3.6, 16.5, 3.6, x, 0, z - 6.4));
        b.slate.push(coneAt(2.5, 8.5, 4, x, 16.5, z - 6.4, Math.PI / 4));
        b.stone.push(boxAt(1.1, 3.2, 1.1, x, 16.2, z - 6.4));
        for (const s of [-1, 1]) {
          b.stone.push(boxAt(0.7, 5.5, 0.7, x + s * 5.2, 0, z - 2, 0.4 * s));
          b.stone.push(boxAt(0.7, 5.5, 0.7, x + s * 5.2, 0, z + 2, -0.4 * s));
        }
        b.trim.push(boxAt(1.6, 0.25, 8, x, 4.4, z - 7.15));
      }

      makeKeep(b) {
        const x = -22, z = 18;
        b.stone.push(boxAt(11, 9.5, 11, x, 0, z));
        b.slate.push(coneAt(8.2, 3.4, 4, x, 9.5, z, Math.PI / 4));
        const c = [[-4.6, -4.6], [4.6, -4.6], [-4.6, 4.6], [4.6, 4.6]];
        for (const [dx, dz] of c) {
          b.stone.push(cylAt(1.6, 1.7, 12.2, 8, x + dx, 0, z + dz));
          b.slate.push(coneAt(1.9, 3.6, 8, x + dx, 12.2, z + dz));
        }
        b.timber.push(boxAt(2.2, 3.4, 0.4, x, 1.2, z + 5.6));
        this.torches.push(new THREE.Vector3(x, 7.5, z + 6));
      }

      makeMarket(rng, b) {
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2 + 0.2;
          const r = 4.4 + rng() * 0.5;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          const ry = a + Math.PI / 2;
          const w = 1.5 + rng() * 0.4;
          const d = 1.1 + rng() * 0.25;
          b.timber.push(boxAt(w, 1.15, d, x, 0, z, ry));
          const awn = boxAt(w + 0.25, 0.08, d + 0.2, x, 1.15, z, ry);
          (i % 3 === 0 ? b.clay : i % 3 === 1 ? b.thatch : b.trim).push(awn);
        }
        b.stone.push(cylAt(1.35, 1.5, 0.45, 12, 0, 0, 0));
      }

      makeHouses(rng, b, WALL_R) {
        const spots = [];
        for (let ring = 10; ring < WALL_R - 5; ring += 3.7) {
          const n = Math.floor((2 * Math.PI * ring) / 4.4);
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2 + rng() * 0.08;
            const rr = ring + (rng() - 0.5) * 1.1;
            const x = Math.cos(a) * rr;
            const z = Math.sin(a) * rr;
            if (this.roadKind(x, z)) continue;
            if (Math.hypot(x, z + 3.2) < 10.5) continue;
            if (Math.hypot(x + 22, z - 18) < 10) continue;
            if (Math.hypot(x, z) < 8.5) continue;
            spots.push({ x, z, a });
          }
        }
        for (const s of spots) {
          const w = 2.3 + rng() * 1.8;
          const d = 2.1 + rng() * 1.5;
          const stories = rng() > 0.55 ? (rng() > 0.7 ? 3 : 2) : 1;
          const h = 2.15 * stories + rng() * 0.4;
          const ry = s.a + Math.PI / 2 + (rng() - 0.5) * 0.15;
          const plaster = rng() > 0.38;
          const body = boxAt(w, h, d, s.x, 0, s.z, ry);
          if (!plaster) b.stone.push(body);
          else if (rng() > 0.5) b.plaster.push(body);
          else b.plasterW.push(body);
          if (plaster && stories >= 2) {
            b.timber.push(boxAt(w + 0.06, 0.12, d + 0.06, s.x, h * 0.48, s.z, ry));
            b.timber.push(boxAt(0.12, h, d + 0.04, s.x, 0, s.z, ry));
          }
          const roofH = 1.15 + rng() * 0.55;
          const roof = coneAt(0.82, roofH, 4, s.x, h, s.z, ry + Math.PI / 4, w * 0.78, d * 0.78);
          const rt = rng();
          if (rt < 0.62) b.clay.push(roof);
          else if (rt < 0.86) b.slate.push(roof);
          else b.thatch.push(roof);
          if (rng() > 0.45) {
            const side = rng() > 0.5 ? 1 : -1;
            const cx = s.x + Math.cos(ry) * (w * 0.28 * side);
            const cz = s.z + Math.sin(ry) * (w * 0.28 * side);
            b.stone.push(boxAt(0.38, 0.95, 0.38, cx, h + roofH * 0.35, cz, ry));
            this.chimneys.push(new THREE.Vector3(cx, h + roofH * 0.35 + 0.95, cz));
          }
          b.dark.push(boxAt(0.55, 1.15, 0.12, s.x, 0, s.z + Math.cos(ry) * (d * 0.51), ry));
        }
      }

      makeBridge(b) {
        const z = 50;
        b.stone.push(boxAt(4.2, 0.7, 14, 0, 0.2, z));
        b.stone.push(boxAt(0.45, 1.3, 0.45, -1.8, 0.7, z - 5));
        b.stone.push(boxAt(0.45, 1.3, 0.45, 1.8, 0.7, z - 5));
        b.stone.push(boxAt(0.45, 1.3, 0.45, -1.8, 0.7, z + 5));
        b.stone.push(boxAt(0.45, 1.3, 0.45, 1.8, 0.7, z + 5));
      }

      makeWindmill(rng, b) {
        const x = 62, z = -28;
        b.stone.push(cylAt(2.4, 3.1, 9.2, 10, x, 0, z));
        b.slate.push(coneAt(3.2, 3.8, 8, x, 9.2, z));
        const sails = new THREE.Group();
        sails.position.set(x + 2.5, 7.6, z);
        sails.rotation.y = Math.PI / 2;
        const sailMat = mat(0xe8dcc4, { roughness: 0.9 });
        for (let i = 0; i < 4; i++) {
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 7.4, 1.15), sailMat);
          arm.position.y = 0;
          arm.rotation.z = (i * Math.PI) / 2;
          arm.position.set(Math.cos(arm.rotation.z) * 0, 0, 0);
          sails.add(arm);
        }
        sails.traverse((c) => { if (c.isMesh) { c.castShadow = true; } });
        this.millSails = sails;
        this.group.add(sails);
        this.labels.push({ name: "West Mill", pos: new THREE.Vector3(x, 8, z), r: 7 });
      }

      makeFountain(b) {
        b.stone.push(cylAt(2.1, 2.3, 0.55, 16, 0, 0, 0));
        b.stone.push(cylAt(0.35, 0.4, 2.1, 8, 0, 0.55, 0));
        b.stone.push(cylAt(0.7, 0.7, 0.2, 12, 0, 2.4, 0));
        const geo = new THREE.BufferGeometry();
        const n = 80;
        const pos = new Float32Array(n * 3);
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({
          color: 0xb8dce0, size: 0.08, transparent: true, opacity: 0.75
        }));
        pts.position.set(0, 2.5, 0);
        this.fountainSpray = pts;
        this.group.add(pts);
      }

      flush(buckets) {
        const specs = [
          ["stone", mat(0x8a7d6c, { roughness: 0.92, flat: true })],
          ["plaster", mat(0xd9cbb0, { roughness: 0.88 })],
          ["plasterW", mat(0xcbb896, { roughness: 0.88 })],
          ["timber", mat(0x3a2618, { roughness: 0.78 })],
          ["clay", mat(0x8b3e2c, { roughness: 0.86, flat: true })],
          ["slate", mat(0x4a5560, { roughness: 0.74, flat: true })],
          ["thatch", mat(0x9a8458, { roughness: 0.95, flat: true })],
          ["dark", mat(0x241810, { roughness: 0.7 })],
          ["trim", mat(0x6e2e22, { roughness: 0.7 })]
        ];
        for (const [key, material] of specs) {
          const g = merge(buckets[key]);
          if (!g) continue;
          const m = new THREE.Mesh(g, material);
          m.castShadow = true;
          m.receiveShadow = true;
          m.userData.label = key === "stone" ? "Hewn Stone" : "The Borough";
          this.group.add(m);
        }
      }

      makeTrees(rng, WALL_R) {
        const geo = new THREE.ConeGeometry(1.6, 4.2, 6);
        geo.translate(0, 3.4, 0);
        const trunk = new THREE.CylinderGeometry(0.22, 0.3, 1.4, 5);
        trunk.translate(0, 0.7, 0);
        const leafMat = mat(0x2f4a30, { flat: true, roughness: 0.9 });
        const trunkMat = mat(0x3a2a1c, { roughness: 0.85 });
        const N = 140;
        const leaves = new THREE.InstancedMesh(geo, leafMat, N);
        const trunks = new THREE.InstancedMesh(trunk, trunkMat, N);
        leaves.castShadow = true;
        trunks.castShadow = true;
        const dummy = new THREE.Object3D();
        let placed = 0;
        let guard = 0;
        while (placed < N && guard < 800) {
          guard++;
          const a = rng() * Math.PI * 2;
          const r = 52 + rng() * 70;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (Math.abs(z - (58 + Math.sin(x * 0.045) * 10)) < 12) continue;
          if (Math.hypot(x - 62, z + 28) < 8) continue;
          const s = 0.7 + rng() * 0.9;
          dummy.position.set(x, 0, z);
          dummy.scale.set(s, s * (0.85 + rng() * 0.4), s);
          dummy.rotation.y = rng() * Math.PI;
          dummy.updateMatrix();
          leaves.setMatrixAt(placed, dummy.matrix);
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          trunks.setMatrixAt(placed, dummy.matrix);
          placed++;
        }
        leaves.count = placed;
        trunks.count = placed;
        this.group.add(leaves, trunks);
      }

      makeFarms(rng) {
        const matC = mat(0x7a8a3e, { roughness: 1, flat: true });
        const geos = [];
        for (let k = 0; k < 18; k++) {
          const x = -70 + (k % 6) * 14 + rng() * 3;
          const z = -8 - Math.floor(k / 6) * 12 - rng() * 4;
          if (Math.hypot(x, z) < 52) continue;
          for (let r = 0; r < 5; r++) {
            geos.push(boxAt(8.5, 0.18, 0.18, x, 0, z + r * 1.15));
          }
        }
        const g = merge(geos);
        if (g) {
          const m = new THREE.Mesh(g, matC);
          this.group.add(m);
        }
      }

      makeWindows(rng) {
        const geo = new THREE.PlaneGeometry(0.42, 0.62);
        const material = new THREE.ShaderMaterial({
          uniforms: { uNight: { value: 0 }, uOn: { value: new THREE.Color("#ffc56a") } },
          vertexShader: winVert,
          fragmentShader: winFrag,
          transparent: true,
          depthWrite: false
        });
        const N = 220;
        const mesh = new THREE.InstancedMesh(geo, material, N);
        const dummy = new THREE.Object3D();
        let n = 0;
        for (let i = 0; i < N; i++) {
          const a = rng() * Math.PI * 2;
          const r = 10 + rng() * 32;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (this.roadKind(x, z)) continue;
          dummy.position.set(x, 1.4 + rng() * 3.2, z);
          dummy.lookAt(0, dummy.position.y, 0);
          dummy.updateMatrix();
          mesh.setMatrixAt(n++, dummy.matrix);
        }
        mesh.count = Math.max(n, 1);
        this.windows = mesh;
        this.group.add(mesh);
      }

      makeFlags(rng) {
        const colors = [0x6e2e22, 0x2d4a6e, 0x6a5a22, 0x3d2a4a];
        const poles = [new THREE.Vector3(0, 0, 46), new THREE.Vector3(-22, 0, 24), new THREE.Vector3(0, 0, -9.6), new THREE.Vector3(46, 0, 0)];
        for (let i = 0; i < poles.length; i++) {
          const p = poles[i];
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 7.2, 6), mat(0x3a2a1c));
          pole.position.set(p.x, 3.6, p.z);
          this.group.add(pole);
          const flagMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(colors[i]) } },
            vertexShader: flagVert,
            fragmentShader: flagFrag,
            side: THREE.DoubleSide
          });
          const flag = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.15, 8, 2), flagMat);
          flag.position.set(p.x + 1.2, 6.6, p.z);
          this.flags.push(flag);
          this.group.add(flag);
        }
      }

      makePaths() {
        const rings = [15.5, 27.5, 38.5];
        for (const r of rings) {
          const pts = [];
          for (let i = 0; i <= 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
          }
          this.paths.push(pts);
        }
        for (const g of [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2]) {
          const pts = [];
          for (let i = 0; i <= 24; i++) {
            const r = 7 + (i / 24) * 39;
            pts.push(new THREE.Vector3(Math.cos(g) * r, 0, Math.sin(g) * r));
          }
          this.paths.push(pts);
        }
        const plaza = [];
        for (let i = 0; i <= 32; i++) {
          const a = (i / 32) * Math.PI * 2;
          plaza.push(new THREE.Vector3(Math.cos(a) * 5.2, 0, Math.sin(a) * 5.2));
        }
        this.paths.push(plaza);
      }

      makePeople(rng) {
        const geo = new THREE.CapsuleGeometry(0.13, 0.38, 3, 6);
        const material = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05 });
        const N = 52;
        const mesh = new THREE.InstancedMesh(geo, material, N);
        mesh.castShadow = true;
        const pal = [0x6e3b2e, 0x2f4a3a, 0x3a3f5c, 0x6a5a3a, 0x4a2e3a, 0xcbb896, 0x2a2420];
        this.npcData = [];
        for (let i = 0; i < N; i++) {
          mesh.setColorAt(i, new THREE.Color(pick(rng, pal)));
          const path = this.paths[Math.floor(rng() * this.paths.length)];
          this.npcData.push({
            path,
            t: rng(),
            speed: 0.04 + rng() * 0.06,
            dir: rng() > 0.5 ? 1 : -1
          });
        }
        mesh.instanceColor.needsUpdate = true;
        this.npcs = mesh;
        this.group.add(mesh);
      }

      makeCarts(rng) {
        const geo = new THREE.BoxGeometry(1.5, 0.7, 0.9);
        const matC = mat(0x5a3a22, { roughness: 0.75 });
        for (let i = 0; i < 3; i++) {
          const mesh = new THREE.Mesh(geo, matC);
          mesh.castShadow = true;
          const path = this.paths[3 + i];
          this.carts.push({ mesh, path, t: rng(), speed: 0.025 + rng() * 0.01 });
          this.group.add(mesh);
        }
      }

      makeBirds() {
        const geo = new THREE.ConeGeometry(0.12, 0.38, 3);
        geo.rotateX(Math.PI / 2);
        const mesh = new THREE.InstancedMesh(geo, mat(0x1a1814, { flat: true }), 18);
        this.birdData = Array.from({ length: 18 }, (_, i) => ({
          a: (i / 18) * Math.PI * 2,
          r: 6 + (i % 5),
          y: 18 + (i % 4) * 1.4,
          s: 0.35 + (i % 3) * 0.08
        }));
        this.birds = mesh;
        this.group.add(mesh);
      }

      makeSmoke() {
        const n = Math.min(this.chimneys.length, 48) * 6;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(n * 3);
        const ages = [];
        let k = 0;
        for (let i = 0; i < Math.min(this.chimneys.length, 48); i++) {
          const c = this.chimneys[i];
          for (let j = 0; j < 6; j++) {
            pos[k * 3] = c.x;
            pos[k * 3 + 1] = c.y + j * 0.35;
            pos[k * 3 + 2] = c.z;
            ages.push({ i: i, age: j / 6, c });
            k++;
          }
        }
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({
          color: 0xb8b0a4, size: 0.55, transparent: true, opacity: 0.28, depthWrite: false
        }));
        this.smoke = { pts, ages };
        this.group.add(pts);
      }

      makeTorches() {
        const geo = new THREE.SphereGeometry(0.12, 6, 6);
        const material = new THREE.MeshStandardMaterial({
          color: 0xffaa55, emissive: 0xff8020, emissiveIntensity: 1.4
        });
        for (const t of this.torches) {
          const m = new THREE.Mesh(geo, material);
          m.position.copy(t);
          this.group.add(m);
        }
      }

      pathPoint(path, t) {
        const u = ((t % 1) + 1) % 1;
        const f = u * (path.length - 1);
        const i = Math.floor(f);
        const k = Math.min(i + 1, path.length - 1);
        const p = new THREE.Vector3().lerpVectors(path[i], path[k], f - i);
        p.y = 0.55;
        return p;
      }

      update(dt, time, night) {
        const dummy = Borough._d || (Borough._d = new THREE.Object3D());
        if (this.npcs && this.npcData) {
          for (let i = 0; i < this.npcData.length; i++) {
            const n = this.npcData[i];
            n.t += dt * n.speed * n.dir;
            const p = this.pathPoint(n.path, n.t);
            const p2 = this.pathPoint(n.path, n.t + 0.01 * n.dir);
            dummy.position.copy(p);
            dummy.position.y += Math.abs(Math.sin(n.t * 40)) * 0.04;
            dummy.lookAt(p2.x, p.y, p2.z);
            dummy.updateMatrix();
            this.npcs.setMatrixAt(i, dummy.matrix);
          }
          this.npcs.instanceMatrix.needsUpdate = true;
        }
        for (const c of this.carts) {
          c.t += dt * c.speed;
          const p = this.pathPoint(c.path, c.t);
          const p2 = this.pathPoint(c.path, c.t + 0.012);
          c.mesh.position.set(p.x, 0.55, p.z);
          c.mesh.lookAt(p2.x, 0.55, p2.z);
        }
        if (this.birds) {
          for (let i = 0; i < this.birdData.length; i++) {
            const b = this.birdData[i];
            b.a += dt * b.s;
            dummy.position.set(Math.cos(b.a) * b.r, b.y + Math.sin(time * 1.4 + i) * 0.4, Math.sin(b.a) * b.r - 3);
            dummy.lookAt(dummy.position.x - Math.sin(b.a), dummy.position.y, dummy.position.z + Math.cos(b.a));
            dummy.updateMatrix();
            this.birds.setMatrixAt(i, dummy.matrix);
          }
          this.birds.instanceMatrix.needsUpdate = true;
        }
        if (this.smoke) {
          const pos = this.smoke.pts.geometry.attributes.position;
          for (let i = 0; i < this.smoke.ages.length; i++) {
            const a = this.smoke.ages[i];
            a.age += dt * 0.18;
            if (a.age > 1) a.age = 0;
            pos.setXYZ(i, a.c.x + Math.sin(time * 0.7 + i) * 0.35 * a.age, a.c.y + a.age * 3.2, a.c.z + Math.cos(time * 0.5 + i) * 0.25 * a.age);
          }
          pos.needsUpdate = true;
        }
        if (this.fountainSpray) {
          const pos = this.fountainSpray.geometry.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const t = (time * 0.9 + i * 0.17) % 1;
            const ang = i * 0.7;
            pos.setXYZ(i, Math.cos(ang) * t * 0.9, t * 1.4 - t * t * 1.6, Math.sin(ang) * t * 0.9);
          }
          pos.needsUpdate = true;
        }
        for (const f of this.flags) f.material.uniforms.uTime.value = time;
        if (this.water) {
          this.water.material.uniforms.uTime.value = time;
          this.water.material.uniforms.uNight.value = night;
        }
        if (this.windows) this.windows.material.uniforms.uNight.value = night;
        if (this.millSails) this.millSails.rotation.z += dt * 0.55;
      }

      dispose() {
        this.group.traverse((c) => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) {
            if (Array.isArray(c.material)) c.material.forEach((m) => m.dispose());
            else c.material.dispose();
          }
        });
      }
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.2, 600);
    camera.position.set(38, 28, 62);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 12;
    controls.maxDistance = 140;
    controls.target.set(0, 4, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    const hemi = new THREE.HemisphereLight(0x9eb6d4, 0x3a2e22, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffe2b0, 1.35);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 220;
    sun.shadow.camera.left = -80;
    sun.shadow.camera.right = 80;
    sun.shadow.camera.top = 80;
    sun.shadow.camera.bottom = -80;
    sun.shadow.bias = -0.0003;
    scene.add(sun);
    scene.add(sun.target);
    const fill = new THREE.DirectionalLight(0x6a7aaa, 0.25);
    scene.add(fill);
    const torchLights = [];
    for (let i = 0; i < 6; i++) {
      const p = new THREE.PointLight(0xff7a33, 0, 18, 2);
      scene.add(p);
      torchLights.push(p);
    }

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(280, 24, 16),
      new THREE.ShaderMaterial({
        uniforms: { uSun: { value: new THREE.Vector3(0.4, 0.5, 0.2) }, uT: { value: 0 } },
        vertexShader: skyVert,
        fragmentShader: skyFrag,
        side: THREE.BackSide,
        depthWrite: false
      })
    );
    scene.add(sky);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.5, 0.82);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    let seed = hashSeed();
    let city = null;
    let worldTime = 0.62;
    let paused = false;
    let intro = 0;

    function mountCity() {
      if (city) {
        scene.remove(city.group);
        city.dispose();
      }
      city = new Borough(seed);
      scene.add(city.group);
      location.hash = "seed=" + city.seed;
      document.getElementById("cityName").textContent = city.name;
      document.getElementById("citySub").textContent = city.motto;
      document.getElementById("seedLabel").textContent = String(city.seed);
      document.getElementById("popLabel").textContent = city.pop.toLocaleString() + " in the walls";
      document.title = city.name + " — A Living Medieval City";
      torchLights[0].position.set(0, 6, 46);
      torchLights[1].position.set(-22, 8, 24);
      torchLights[2].position.set(0, 5, 0);
      torchLights[3].position.set(46, 8, 0);
      torchLights[4].position.set(-46, 8, 0);
      torchLights[5].position.set(0, 9, -46);
    }
    mountCity();

    const hourEl = document.getElementById("hourLabel");
    const lookEl = document.getElementById("look");
    const clockFill = document.getElementById("clockfill");
    const ray = new THREE.Raycaster();
    const pointer = new THREE.Vector2(2, 2);

    function hourName(t) {
      const u = ((t % 1) + 1) % 1;
      if (u < 0.18) return "Night watch";
      if (u < 0.28) return "False dawn";
      if (u < 0.38) return "Morning market";
      if (u < 0.55) return "High day";
      if (u < 0.68) return "Afternoon";
      if (u < 0.78) return "Vespers";
      if (u < 0.88) return "Dusk";
      return "Night of lamps";
    }

    addEventListener("pointermove", (e) => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    });
    addEventListener("pointerdown", () => { controls.autoRotate = false; });
    addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        seed = (Math.random() * 0xffffffff) >>> 0;
        mountCity();
      } else if (e.code === "Space") {
        e.preventDefault();
        paused = !paused;
      } else if (e.key === "[") worldTime -= 0.04;
      else if (e.key === "]") worldTime += 0.04;
    });
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    const sunDir = new THREE.Vector3();
    let lookTick = 0;

    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      intro += dt;
      if (!paused) worldTime += dt * 0.012;
      const u = ((worldTime % 1) + 1) % 1;
      const ang = u * Math.PI * 2 - 0.2;
      sunDir.set(Math.cos(ang) * 0.85, Math.sin(ang), Math.sin(ang * 0.5) * 0.4).normalize();
      sun.position.copy(sunDir).multiplyScalar(90);
      sun.target.position.set(0, 0, 0);
      fill.position.set(-sunDir.x * 40, 30, -sunDir.z * 40);

      const day = smooth(clamp((sunDir.y + 0.12) / 0.5, 0, 1));
      const night = 1 - day;
      const dusk = clamp(1 - Math.abs(sunDir.y) * 2.4, 0, 1);
      sun.color.setRGB(lerp(1, 1, dusk), lerp(0.82, 0.55, dusk), lerp(0.62, 0.32, dusk));
      sun.intensity = lerp(0.12, 1.45, day) + dusk * 0.25;
      hemi.intensity = lerp(0.12, 0.6, day);
      hemi.color.set(day > 0.4 ? 0x9eb6d4 : 0x3a3a66);
      renderer.toneMappingExposure = lerp(0.72, 1.12, day);
      bloom.strength = lerp(0.18, 0.55, night);
      scene.fog = new THREE.FogExp2(dusk > 0.4 ? 0x6a3a2a : (day > 0.45 ? 0x9aa7b0 : 0x121018), lerp(0.011, 0.007, day));
      sky.material.uniforms.uSun.value.copy(sunDir);
      for (const p of torchLights) p.intensity = night * 3.6;

      city.update(dt, clock.elapsedTime, night);
      controls.update();

      if (intro < 6) {
        const k = 1 - Math.exp(-intro * 0.35);
        camera.position.lerp(new THREE.Vector3(32, 22, 48), 0.015 * k);
      }

      hourEl.textContent = hourName(u) + (paused ? " · held" : "");
      clockFill.style.width = (u * 100).toFixed(1) + "%";

      lookTick += dt;
      if (lookTick > 0.12) {
        lookTick = 0;
        ray.setFromCamera(pointer, camera);
        const hits = ray.intersectObjects(city.group.children, true);
        let name = "";
        if (hits[0]) {
          const p = hits[0].point;
          let best = 99, lab = hits[0].object.userData.label || "";
          for (const L of city.labels) {
            const d = p.distanceTo(L.pos);
            if (d < L.r && d < best) { best = d; lab = L.name; }
          }
          name = lab;
        }
        lookEl.textContent = name;
        lookEl.classList.toggle("show", !!name);
      }

      composer.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
