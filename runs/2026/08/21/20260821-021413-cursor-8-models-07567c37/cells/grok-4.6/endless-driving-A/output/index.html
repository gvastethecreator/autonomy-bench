<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Night Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(220, 236, 255, 0.82);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(80, 160, 255, 0.35);
    }
    #hud span { color: #9fd4ff; }
  </style>
</head>
<body>
  <div id="hud">Night drive &nbsp;·&nbsp; <span id="speed">0</span> km/h &nbsp;·&nbsp; arrows / WASD</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const ROAD_HALF = 7.2;
    const LANE_W = 3.6;
    const SEGMENT = 28;
    const SEGMENTS = 18;
    const WORLD_LEN = SEGMENT * SEGMENTS;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050c);
    scene.fog = new THREE.FogExp2(0x050914, 0.018);

    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 600);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x1a2740, 0.55));
    const hemi = new THREE.HemisphereLight(0x3a5080, 0x08060a, 0.35);
    scene.add(hemi);

    const moonLight = new THREE.DirectionalLight(0xb8c8ff, 0.22);
    moonLight.position.set(-40, 80, -20);
    scene.add(moonLight);

    function asphaltTexture() {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#1a1c22";
      g.fillRect(0, 0, 256, 512);
      for (let i = 0; i < 8000; i++) {
        const n = 18 + Math.random() * 22;
        g.fillStyle = `rgba(${n},${n},${n + 4},${0.35 + Math.random() * 0.4})`;
        g.fillRect(Math.random() * 256, Math.random() * 512, 1 + Math.random() * 2, 1);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 8);
      tex.anisotropy = 8;
      return tex;
    }

    function dashTexture(color) {
      const c = document.createElement("canvas");
      c.width = 8;
      c.height = 64;
      const g = c.getContext("2d");
      g.fillStyle = "rgba(0,0,0,0)";
      g.fillRect(0, 0, 8, 64);
      g.fillStyle = color;
      g.fillRect(0, 0, 8, 28);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 40);
      return tex;
    }

    const roadMat = new THREE.MeshStandardMaterial({
      map: asphaltTexture(),
      roughness: 0.92,
      metalness: 0.04,
      color: 0x888888
    });
    const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF * 2 + 1.4, WORLD_LEN), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -WORLD_LEN * 0.35;
    road.receiveShadow = true;
    scene.add(road);

    const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x121418, roughness: 1 });
    for (const side of [-1, 1]) {
      const sh = new THREE.Mesh(new THREE.PlaneGeometry(18, WORLD_LEN), shoulderMat);
      sh.rotation.x = -Math.PI / 2;
      sh.position.set(side * (ROAD_HALF + 10), -0.02, -WORLD_LEN * 0.35);
      scene.add(sh);
    }

    const centerLine = new THREE.Mesh(
      new THREE.PlaneGeometry(0.12, WORLD_LEN),
      new THREE.MeshBasicMaterial({ color: 0xc9a227 })
    );
    centerLine.rotation.x = -Math.PI / 2;
    centerLine.position.set(0, 0.02, -WORLD_LEN * 0.35);
    scene.add(centerLine);

    const dashMatL = new THREE.MeshBasicMaterial({
      map: dashTexture("#e8eef8"),
      transparent: true,
      depthWrite: false
    });
    const dashMatR = dashMatL.clone();
    dashMatR.map = dashTexture("#e8eef8");
    for (const [x, mat] of [[-LANE_W, dashMatL], [LANE_W, dashMatR]]) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.1, WORLD_LEN), mat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(x, 0.025, -WORLD_LEN * 0.35);
      scene.add(dash);
    }

    const edgeMat = new THREE.MeshBasicMaterial({ color: 0xdde6f4 });
    for (const x of [-ROAD_HALF + 0.18, ROAD_HALF - 0.18]) {
      const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.08, WORLD_LEN), edgeMat);
      edge.rotation.x = -Math.PI / 2;
      edge.position.set(x, 0.021, -WORLD_LEN * 0.35);
      scene.add(edge);
    }

    const starsGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(1800 * 3);
    for (let i = 0; i < 1800; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 500;
      starPos[i * 3 + 1] = 40 + Math.random() * 180;
      starPos[i * 3 + 2] = -Math.random() * 420 - 20;
    }
    starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({
      color: 0xcdd8ff,
      size: 0.55,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.85
    })));

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(6, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xdfe8ff })
    );
    moon.position.set(-70, 78, -160);
    scene.add(moon);
    const moonGlow = new THREE.Mesh(
      new THREE.SphereGeometry(9, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x8899cc, transparent: true, opacity: 0.18 })
    );
    moonGlow.position.copy(moon.position);
    scene.add(moonGlow);

    function makeCar(bodyColor, accent) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.7, 0.42, 3.5),
        new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.35, metalness: 0.55 })
      );
      body.position.y = 0.48;
      body.castShadow = true;
      g.add(body);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.38, 1.5),
        new THREE.MeshStandardMaterial({ color: 0x11151c, roughness: 0.2, metalness: 0.3 })
      );
      cabin.position.set(0, 0.82, -0.15);
      cabin.castShadow = true;
      g.add(cabin);

      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(1.42, 0.28, 1.2),
        new THREE.MeshStandardMaterial({
          color: 0x6aa4d8,
          roughness: 0.08,
          metalness: 0.7,
          transparent: true,
          opacity: 0.45
        })
      );
      glass.position.set(0, 0.86, -0.12);
      g.add(glass);

      const hood = new THREE.Mesh(
        new THREE.BoxGeometry(1.62, 0.12, 1.1),
        new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.32, metalness: 0.6 })
      );
      hood.position.set(0, 0.62, -1.15);
      g.add(hood);

      const bumper = new THREE.Mesh(
        new THREE.BoxGeometry(1.72, 0.22, 0.28),
        new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.6, metalness: 0.4 })
      );
      bumper.position.set(0, 0.34, -1.72);
      g.add(bumper);

      for (const x of [-0.55, 0.55]) {
        const lamp = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.12, 0.08),
          new THREE.MeshBasicMaterial({ color: 0xfff4d0 })
        );
        lamp.position.set(x, 0.42, -1.78);
        g.add(lamp);
        const tail = new THREE.Mesh(
          new THREE.BoxGeometry(0.32, 0.1, 0.06),
          new THREE.MeshBasicMaterial({ color: accent })
        );
        tail.position.set(x, 0.5, 1.76);
        g.add(tail);
      }

      const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 12);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
      for (const [x, z] of [[-0.78, -1.1], [0.78, -1.1], [-0.78, 1.15], [0.78, 1.15]]) {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(x, 0.32, z);
        w.castShadow = true;
        g.add(w);
      }
      return g;
    }

    const player = makeCar(0xc23b2e, 0xff2a22);
    player.position.set(LANE_W * 0.5, 0, 0);
    scene.add(player);

    const headL = new THREE.SpotLight(0xfff2d4, 6.5, 48, 0.38, 0.45, 1.1);
    const headR = new THREE.SpotLight(0xfff2d4, 6.5, 48, 0.38, 0.45, 1.1);
    headL.castShadow = true;
    headL.shadow.mapSize.set(512, 512);
    for (const [light, x] of [[headL, -0.5], [headR, 0.5]]) {
      light.position.set(x, 0.55, -1.7);
      light.target.position.set(x * 0.4, 0.1, -18);
      player.add(light);
      player.add(light.target);
    }

    const lamps = [];
    const lampMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.6, metalness: 0.4 });
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffe6b0 });
    for (let i = 0; i < 22; i++) {
      const pole = new THREE.Group();
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 6.2, 6), lampMat);
      post.position.y = 3.1;
      pole.add(post);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.08), lampMat);
      arm.position.set(-0.7, 6.05, 0);
      pole.add(arm);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), glowMat);
      bulb.position.set(-1.5, 5.9, 0);
      pole.add(bulb);
      const light = new THREE.PointLight(0xffd9a0, 2.4, 22, 2);
      light.position.copy(bulb.position);
      pole.add(light);
      const side = i % 2 === 0 ? 1 : -1;
      pole.position.set(side * (ROAD_HALF + 1.6), 0, -i * 22);
      pole.scale.x = side;
      scene.add(pole);
      lamps.push(pole);
    }

    const trees = [];
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2a1c12 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x0c1a12, roughness: 0.95 });
    for (let i = 0; i < 40; i++) {
      const t = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 2.4, 5), trunkMat);
      trunk.position.y = 1.2;
      t.add(trunk);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.4 + Math.random() * 0.6, 3.4, 6), leafMat);
      crown.position.y = 3.4;
      t.add(crown);
      const side = i % 2 === 0 ? 1 : -1;
      t.position.set(side * (14 + Math.random() * 10), 0, -i * 14 - Math.random() * 8);
      scene.add(t);
      trees.push(t);
    }

    const traffic = [];
    const palette = [0x2c5aa0, 0x1f1f24, 0xd8d4cc, 0x245c3a, 0x6b3fa0];
    for (let i = 0; i < 8; i++) {
      const car = makeCar(palette[i % palette.length], 0xff3311);
      const lane = i % 2 === 0 ? -LANE_W * 0.5 : LANE_W * 0.5;
      car.position.set(lane, 0, -40 - i * 38);
      car.userData.speed = 18 + (i % 3) * 6;
      if (lane < 0) {
        car.rotation.y = Math.PI;
        car.userData.speed = 22 + (i % 4) * 4;
      }
      scene.add(car);
      traffic.push(car);
    }

    const rails = [];
    const railMat = new THREE.MeshStandardMaterial({ color: 0x6a7380, metalness: 0.7, roughness: 0.35 });
    for (let i = 0; i < 24; i++) {
      for (const side of [-1, 1]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.08), railMat);
        post.position.set(side * (ROAD_HALF + 0.55), 0.35, -i * 18);
        scene.add(post);
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 18), railMat);
        bar.position.set(side * (ROAD_HALF + 0.55), 0.58, -i * 18 - 9);
        scene.add(bar);
        rails.push(post, bar);
      }
    }

    const keys = Object.create(null);
    addEventListener("keydown", (e) => { keys[e.code] = true; });
    addEventListener("keyup", (e) => { keys[e.code] = false; });

    let speed = 28;
    let steer = 0;
    const speedEl = document.getElementById("speed");
    const clock = new THREE.Clock();
    const camOffset = new THREE.Vector3(0, 2.15, 6.4);
    const lookAt = new THREE.Vector3();

    function wrapZ(obj, ahead) {
      if (obj.position.z > 18) obj.position.z -= ahead;
      if (obj.position.z < -WORLD_LEN * 0.75) obj.position.z += WORLD_LEN * 0.7;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      const throttle = (keys.ArrowUp || keys.KeyW) ? 1 : (keys.ArrowDown || keys.KeyS) ? -0.7 : 0;
      const wantSteer = (keys.ArrowLeft || keys.KeyA) ? 1 : (keys.ArrowRight || keys.KeyD) ? -1 : 0;
      speed += (throttle * 18 - (speed - 26) * 0.35) * dt;
      speed = THREE.MathUtils.clamp(speed, 8, 52);
      steer = THREE.MathUtils.damp(steer, wantSteer * 0.12, 8, dt);

      player.position.x = THREE.MathUtils.clamp(player.position.x + wantSteer * 6.5 * dt, -ROAD_HALF + 1.1, ROAD_HALF - 1.1);
      player.rotation.y = steer * 0.9;
      player.rotation.z = -steer * 0.35;
      player.position.y = Math.sin(clock.elapsedTime * 22) * 0.012;

      const travel = speed * dt;
      roadMat.map.offset.y -= travel * 0.012;
      dashMatL.map.offset.y -= travel * 0.055;
      dashMatR.map.offset.y -= travel * 0.055;

      for (const lamp of lamps) {
        lamp.position.z += travel;
        wrapZ(lamp, 22 * lamps.length);
      }
      for (const t of trees) {
        t.position.z += travel;
        wrapZ(t, 14 * trees.length);
      }
      for (const r of rails) {
        r.position.z += travel;
        if (r.position.z > 22) r.position.z -= 18 * 12;
      }
      for (const car of traffic) {
        const rel = car.userData.speed - speed;
        car.position.z += rel * dt;
        if (car.position.z > 24) car.position.z -= 40 + Math.random() * 90;
        if (car.position.z < -220) car.position.z += 180 + Math.random() * 40;
        car.position.x += Math.sin(clock.elapsedTime * 0.4 + car.position.z * 0.01) * 0.002;
      }

      const shake = speed * 0.0008;
      camera.position.x = player.position.x * 0.85 + camOffset.x + Math.sin(clock.elapsedTime * 11) * shake;
      camera.position.y = camOffset.y + Math.sin(clock.elapsedTime * 17) * shake * 0.4;
      camera.position.z = player.position.z + camOffset.z;
      lookAt.set(player.position.x - steer * 4, 0.7, player.position.z - 14);
      camera.lookAt(lookAt);

      speedEl.textContent = String(Math.round(speed * 3.6));
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
