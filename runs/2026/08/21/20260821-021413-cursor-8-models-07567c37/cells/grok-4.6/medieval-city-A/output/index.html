<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living Procedural Medieval City</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 16px; bottom: 16px; z-index: 2;
      color: #f4e6c8; font: 13px/1.45 Georgia, "Times New Roman", serif;
      text-shadow: 0 1px 2px #000; pointer-events: none;
      background: rgba(18, 12, 8, 0.45); padding: 10px 14px; border: 1px solid rgba(212, 175, 108, 0.35);
    }
    #hud b { color: #e8c56b; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div><b>Living Medieval City</b></div>
    <div>Drag to orbit · scroll to zoom · seed <span id="seedLabel"></span></div>
    <div>Townsfolk, carts, flags, smoke, and the sun keep moving.</div>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const SEED = (Math.random() * 1e9) | 0;
    document.getElementById("seedLabel").textContent = String(SEED);

    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(SEED);
    const rnd = (a = 0, b = 1) => a + rand() * (b - a);
    const rint = (a, b) => (a + rand() * (b - a + 1)) | 0;
    const pick = (arr) => arr[(rand() * arr.length) | 0];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a0c0);
    scene.fog = new THREE.FogExp2(0x87a0c0, 0.0062);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.2, 600);
    camera.position.set(78, 42, 92);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6, 0);
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 18;
    controls.maxDistance = 180;
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    const hemi = new THREE.HemisphereLight(0xc8d8f0, 0x4a3a28, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff1d0, 1.35);
    sun.position.set(60, 80, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 260;
    sun.shadow.camera.left = -110;
    sun.shadow.camera.right = 110;
    sun.shadow.camera.top = 110;
    sun.shadow.camera.bottom = -110;
    sun.shadow.bias = -0.0004;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8aa4c8, 0.18);
    fill.position.set(-40, 20, -50);
    scene.add(fill);

    const shared = {
      timber: new THREE.MeshLambertMaterial({ color: 0x3a2414 }),
      stone: new THREE.MeshLambertMaterial({ color: 0x8a8174 }),
      stoneDark: new THREE.MeshLambertMaterial({ color: 0x6b6358 }),
      stoneLight: new THREE.MeshLambertMaterial({ color: 0xb7aea0 }),
      thatch: new THREE.MeshLambertMaterial({ color: 0x9a7a3a }),
      tile: new THREE.MeshLambertMaterial({ color: 0x8b3a2a }),
      slate: new THREE.MeshLambertMaterial({ color: 0x4a5560 }),
      plaster: [
        new THREE.MeshLambertMaterial({ color: 0xe8d9b8 }),
        new THREE.MeshLambertMaterial({ color: 0xdcc4a0 }),
        new THREE.MeshLambertMaterial({ color: 0xc9b089 }),
        new THREE.MeshLambertMaterial({ color: 0xd4c4b0 }),
        new THREE.MeshLambertMaterial({ color: 0xb89b78 }),
        new THREE.MeshLambertMaterial({ color: 0xc9a07a }),
      ],
      wood: new THREE.MeshLambertMaterial({ color: 0x6b4423 }),
      door: new THREE.MeshLambertMaterial({ color: 0x4a2c18 }),
      window: new THREE.MeshLambertMaterial({ color: 0x1a2430, emissive: 0x22180c, emissiveIntensity: 0.15 }),
      gold: new THREE.MeshLambertMaterial({ color: 0xc9a227 }),
      banner: [
        new THREE.MeshLambertMaterial({ color: 0x8b1e1e, side: THREE.DoubleSide }),
        new THREE.MeshLambertMaterial({ color: 0x1e3a6b, side: THREE.DoubleSide }),
        new THREE.MeshLambertMaterial({ color: 0x2d6b3a, side: THREE.DoubleSide }),
        new THREE.MeshLambertMaterial({ color: 0x6b2d6b, side: THREE.DoubleSide }),
      ],
      cloth: [
        0x6b2d2d, 0x2d4a6b, 0x3d5a2d, 0x6b5a2d, 0x4a3a5a, 0x8a6a4a, 0x3a3a3a, 0x7a3a2a,
      ].map((c) => new THREE.MeshLambertMaterial({ color: c })),
      skin: new THREE.MeshLambertMaterial({ color: 0xc4a07a }),
      water: new THREE.MeshLambertMaterial({ color: 0x2a5a62, transparent: true, opacity: 0.82 }),
      cobble: new THREE.MeshLambertMaterial({ color: 0x6e6558 }),
      dirt: new THREE.MeshLambertMaterial({ color: 0x6b5a3e }),
      grass: new THREE.MeshLambertMaterial({ color: 0x4a6b3a }),
      leaf: new THREE.MeshLambertMaterial({ color: 0x2f5a28 }),
      trunk: new THREE.MeshLambertMaterial({ color: 0x4a321c }),
      straw: new THREE.MeshLambertMaterial({ color: 0xc2a45a }),
      torch: new THREE.MeshLambertMaterial({ color: 0xffaa44, emissive: 0xff7722, emissiveIntensity: 1.2 }),
      smoke: new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.28, depthWrite: false }),
    };

    function box(mat, w, h, d, x, y, z, shadow = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = shadow;
      m.receiveShadow = true;
      return m;
    }

    function gableRoof(w, d, rise, overhang, mat) {
      const hw = w / 2 + overhang;
      const hd = d / 2 + overhang;
      const g = new THREE.BufferGeometry();
      const v = new Float32Array([
        -hw, 0, -hd, hw, 0, -hd, 0, rise, -hd,
        -hw, 0, hd, 0, rise, hd, hw, 0, hd,
        -hw, 0, -hd, -hw, 0, hd, 0, rise, hd, -hw, 0, -hd, 0, rise, hd, 0, rise, -hd,
        hw, 0, -hd, 0, rise, -hd, 0, rise, hd, hw, 0, -hd, 0, rise, hd, hw, 0, hd,
        -hw, 0, -hd, hw, 0, -hd, hw, 0, hd, -hw, 0, -hd, hw, 0, hd, -hw, 0, hd,
      ]);
      g.setAttribute("position", new THREE.BufferAttribute(v, 3));
      g.computeVertexNormals();
      const m = new THREE.Mesh(g, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    function addTimberFrame(group, w, h, d, inset = 0.04) {
      const t = 0.09;
      const faces = [
        [0, 0, d / 2 + inset, w, h, "z"],
        [0, 0, -d / 2 - inset, w, h, "z"],
        [w / 2 + inset, 0, 0, d, h, "x"],
        [-w / 2 - inset, 0, 0, d, h, "x"],
      ];
      for (const [x, , z, span, hh, axis] of faces) {
        const posts = 2 + rint(0, 2);
        for (let i = 0; i <= posts; i++) {
          const u = -span / 2 + (i / posts) * span;
          const p = axis === "z"
            ? box(shared.timber, t, hh, t, x + (axis === "z" ? u : 0), hh / 2, z)
            : box(shared.timber, t, hh, t, x, hh / 2, z + u);
          if (axis === "z") p.position.x = u;
          else p.position.z = u;
          p.position.x = axis === "z" ? u : x;
          p.position.z = axis === "z" ? z : u;
          group.add(p);
        }
        group.add(axis === "z"
          ? box(shared.timber, span, t, t, x, hh * 0.12, z)
          : box(shared.timber, t, t, span, x, hh * 0.12, z));
        group.add(axis === "z"
          ? box(shared.timber, span, t, t, x, hh * 0.55, z)
          : box(shared.timber, t, t, span, x, hh * 0.55, z));
        group.add(axis === "z"
          ? box(shared.timber, span, t, t, x, hh - t, z)
          : box(shared.timber, t, t, span, x, hh - t, z));
      }
    }

    function makeWindows(group, w, h, d, floors) {
      const ww = 0.28, wh = 0.38;
      for (let f = 0; f < floors; f++) {
        const y = 0.7 + f * (h / floors) * 0.75;
        const nx = Math.max(1, Math.floor(w / 1.15));
        for (let i = 0; i < nx; i++) {
          const x = -w / 2 + 0.45 + (i * (w - 0.9)) / Math.max(1, nx - 1 || 1);
          if (nx === 1) group.add(box(shared.window, ww, wh, 0.06, 0, y, d / 2 + 0.03, false));
          else group.add(box(shared.window, ww, wh, 0.06, x, y, d / 2 + 0.03, false));
        }
        const nz = Math.max(1, Math.floor(d / 1.25));
        for (let i = 0; i < nz; i++) {
          const z = -d / 2 + 0.4 + (i * (d - 0.8)) / Math.max(1, nz - 1 || 1);
          group.add(box(shared.window, 0.06, wh, ww, w / 2 + 0.03, y, nz === 1 ? 0 : z, false));
        }
      }
    }

    function makeHouse(w, d, h, roofKind) {
      const g = new THREE.Group();
      const plaster = pick(shared.plaster);
      const body = box(plaster, w, h, d, 0, h / 2, 0);
      g.add(body);
      addTimberFrame(g, w, h, d);
      const floors = Math.max(1, Math.round(h / 2.4));
      makeWindows(g, w, h, d, floors);
      const doorW = 0.55, doorH = 1.05;
      g.add(box(shared.door, doorW, doorH, 0.08, rnd(-0.4, 0.4) * (w > 2.2 ? 1 : 0), doorH / 2, d / 2 + 0.04, false));
      const roofMat = roofKind === "thatch" ? shared.thatch : roofKind === "slate" ? shared.slate : shared.tile;
      const rise = rnd(0.9, 1.6);
      const roof = gableRoof(w, d, rise, 0.18, roofMat);
      roof.position.y = h;
      g.add(roof);
      if (rand() > 0.35) {
        const ch = box(shared.stoneDark, 0.32, rnd(0.6, 1.1), 0.32, rnd(-w * 0.28, w * 0.28), h + rise * 0.35, -d * 0.22);
        g.add(ch);
        chimneys.push({ x: 0, y: h + rise * 0.9, z: -d * 0.22, node: g });
      }
      return g;
    }

    function makeStoneHall(w, d, h) {
      const g = new THREE.Group();
      g.add(box(shared.stone, w, h, d, 0, h / 2, 0));
      g.add(box(shared.stoneDark, w + 0.15, 0.25, d + 0.15, 0, h + 0.05, 0));
      makeWindows(g, w, h, d, 2);
      g.add(box(shared.door, 0.8, 1.4, 0.1, 0, 0.7, d / 2 + 0.05, false));
      const arch = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.12, 10, 1, false, 0, Math.PI), shared.stoneLight);
      arch.rotation.z = Math.PI / 2;
      arch.position.set(0, 1.4, d / 2 + 0.06);
      g.add(arch);
      const roof = gableRoof(w, d, 1.8, 0.2, shared.slate);
      roof.position.y = h;
      g.add(roof);
      return g;
    }

    function crenellations(group, w, d, y, cx = 0, cz = 0) {
      const t = 0.28, h = 0.42;
      const edges = [
        { alongX: true, z: cz + d / 2, x0: cx },
        { alongX: true, z: cz - d / 2, x0: cx },
        { alongX: false, x: cx + w / 2, z0: cz },
        { alongX: false, x: cx - w / 2, z0: cz },
      ];
      for (const e of edges) {
        const len = e.alongX ? w : d;
        const n = Math.max(3, Math.floor(len / 0.5));
        for (let i = 0; i < n; i++) {
          const u = -len / 2 + 0.15 + i * (len / n);
          group.add(e.alongX
            ? box(shared.stoneLight, t, h, t, e.x0 + u, y + h / 2, e.z)
            : box(shared.stoneLight, t, h, t, e.x, y + h / 2, e.z0 + u));
        }
      }
    }

    function makeKeep() {
      const g = new THREE.Group();
      const w = 14, d = 12, h = 16;
      g.add(box(shared.stone, w, h, d, 0, h / 2, 0));
      crenellations(g, w, d, h);
      for (const [x, z] of [[-6.2, -5.2], [6.2, -5.2], [-6.2, 5.2], [6.2, 5.2]]) {
        const th = 20 + rnd(-1, 2);
        g.add(box(shared.stoneDark, 3.2, th, 3.2, x, th / 2, z));
        crenellations(g, 3.2, 3.2, th, x, z);
        const pole = box(shared.wood, 0.08, 3.2, 0.08, x, th + 1.6, z, false);
        g.add(pole);
        const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.7, 8, 2), pick(shared.banner));
        flag.position.set(x + 0.95, th + 2.6, z);
        flag.castShadow = true;
        g.add(flag);
        flags.push(flag);
      }
      g.add(box(shared.door, 1.6, 2.4, 0.2, 0, 1.2, d / 2 + 0.1, false));
      const roof = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4.5, 4), shared.tile);
      roof.rotation.y = Math.PI / 4;
      roof.position.set(0, h + 2.2, 0);
      roof.castShadow = true;
      g.add(roof);
      for (let i = 0; i < 3; i++) {
        g.add(box(shared.window, 0.7, 1.1, 0.08, -3 + i * 3, 8, d / 2 + 0.05, false));
        g.add(box(shared.window, 0.7, 1.1, 0.08, -3 + i * 3, 12, d / 2 + 0.05, false));
      }
      return g;
    }

    function makeCathedral() {
      const g = new THREE.Group();
      g.add(box(shared.stoneLight, 8, 9, 18, 0, 4.5, 0));
      g.add(box(shared.stone, 16, 7, 6, 0, 3.5, 0));
      const naveRoof = gableRoof(8, 18, 4.2, 0.25, shared.slate);
      naveRoof.position.y = 9;
      g.add(naveRoof);
      const transeptRoof = gableRoof(16, 6, 3.2, 0.2, shared.slate);
      transeptRoof.position.y = 7;
      g.add(transeptRoof);
      const tower = box(shared.stone, 4.2, 16, 4.2, 0, 8, -7);
      g.add(tower);
      const spire = new THREE.Mesh(new THREE.ConeGeometry(2.6, 9, 4), shared.slate);
      spire.rotation.y = Math.PI / 4;
      spire.position.set(0, 20.5, -7);
      spire.castShadow = true;
      g.add(spire);
      g.add(box(shared.gold, 0.12, 1.4, 0.12, 0, 25.4, -7, false));
      const crossArm = box(shared.gold, 0.7, 0.12, 0.12, 0, 25.1, -7, false);
      g.add(crossArm);
      crenellations(g, 4.2, 4.2, 16, 0, -7);
      g.add(box(shared.door, 1.4, 2.6, 0.15, 0, 1.3, 9.1, false));
      for (let i = 0; i < 4; i++) {
        const z = -6 + i * 4;
        const arch = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.2, 12, 1, false, 0, Math.PI), shared.window);
        arch.rotation.z = Math.PI / 2;
        arch.position.set(4.05, 3.2, z);
        g.add(arch);
      }
      return g;
    }

    function makeStall(w, d) {
      const g = new THREE.Group();
      g.add(box(shared.wood, w, 0.12, d, 0, 0.7, 0, false));
      g.add(box(shared.wood, 0.08, 0.7, 0.08, -w / 2, 0.35, -d / 2, false));
      g.add(box(shared.wood, 0.08, 0.7, 0.08, w / 2, 0.35, -d / 2, false));
      g.add(box(shared.wood, 0.08, 0.7, 0.08, -w / 2, 0.35, d / 2, false));
      g.add(box(shared.wood, 0.08, 0.7, 0.08, w / 2, 0.35, d / 2, false));
      const cloth = pick(shared.banner);
      const awn = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.2, d + 0.2), cloth);
      awn.rotation.x = -Math.PI / 2.4;
      awn.position.set(0, 1.35, 0.05);
      g.add(awn);
      g.add(box(pick(shared.cloth), w * 0.4, 0.25, d * 0.3, rnd(-0.3, 0.3), 0.9, 0, false));
      return g;
    }

    function makeTree() {
      const g = new THREE.Group();
      const th = rnd(1.8, 3.4);
      g.add(box(shared.trunk, 0.28, th, 0.28, 0, th / 2, 0, false));
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(rnd(1.3, 2.1), 7, 6), shared.leaf);
      leaf.position.y = th + 0.6;
      leaf.castShadow = true;
      g.add(leaf);
      return g;
    }

    function makeWell() {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 0.9, 12), shared.stone));
      g.children[0].position.y = 0.45;
      g.children[0].castShadow = true;
      g.add(box(shared.wood, 0.08, 1.8, 0.08, -0.9, 1.4, 0, false));
      g.add(box(shared.wood, 0.08, 1.8, 0.08, 0.9, 1.4, 0, false));
      g.add(box(shared.wood, 2, 0.08, 0.08, 0, 2.25, 0, false));
      const roof = gableRoof(2.4, 1.6, 0.7, 0.05, shared.tile);
      roof.position.y = 2.3;
      g.add(roof);
      return g;
    }

    function makePerson() {
      const g = new THREE.Group();
      const cloth = pick(shared.cloth);
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.55, 3, 6), cloth);
      body.position.y = 0.55;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), shared.skin);
      head.position.y = 1.02;
      g.add(head);
      if (rand() > 0.55) g.add(box(shared.timber, 0.22, 0.12, 0.22, 0, 1.14, 0, false));
      g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      return g;
    }

    function makeCart() {
      const g = new THREE.Group();
      g.add(box(shared.wood, 1.6, 0.45, 0.95, 0, 0.55, 0));
      for (const x of [-0.55, 0.55]) {
        for (const z of [-0.55, 0.55]) {
          const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.12, 10), shared.timber);
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(x, 0.28, z);
          g.add(wheel);
        }
      }
      g.add(box(shared.straw, 1.2, 0.35, 0.7, 0, 0.95, 0, false));
      return g;
    }

    function makeBird() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.28, 4), shared.timber);
      body.rotation.x = Math.PI / 2;
      g.add(body);
      const wing = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.12), shared.stoneDark);
      wing.rotation.x = Math.PI;
      g.add(wing);
      g.userData.wing = wing;
      return g;
    }

    const CITY_R = 62;
    const flags = [];
    const chimneys = [];
    const walkers = [];
    const carts = [];
    const birds = [];
    const smokes = [];
    const torches = [];
    const waterMesh = { t: 0 };

    function wallRadius(a) {
      return CITY_R + Math.sin(a * 3 + 0.4) * 3.5 + Math.cos(a * 5) * 2.2;
    }

    function insideWalls(x, z) {
      const a = Math.atan2(z, x);
      return Math.hypot(x, z) < wallRadius(a) - 3.2;
    }

    function onRiver(x, z) {
      const c = z - Math.sin(x * 0.045) * 8 + 38;
      return Math.abs(c) < 5.5 && x > -80 && x < 80;
    }

    function onRoad(x, z) {
      const r = Math.hypot(x, z);
      const a = Math.atan2(z, x);
      const rings = [16, 32, 48];
      for (const ring of rings) {
        if (Math.abs(r - ring) < 2.1) return true;
      }
      const radials = 8;
      for (let i = 0; i < radials; i++) {
        const aa = (i / radials) * Math.PI * 2 + 0.18;
        let da = Math.abs(Math.atan2(Math.sin(a - aa), Math.cos(a - aa)));
        if (da < 0.085 && r < CITY_R - 4 && r > 6) return true;
      }
      if (r < 9) return true;
      return false;
    }

    function occupiedKeep(x, z) {
      return x > -12 && x < 12 && z > -48 && z < -28;
    }
    function occupiedChurch(x, z) {
      return x > 10 && x < 28 && z > -10 && z < 12;
    }

    const groundCanvas = document.createElement("canvas");
    groundCanvas.width = groundCanvas.height = 1024;
    const gtx = groundCanvas.getContext("2d");
    gtx.fillStyle = "#4d6b38";
    gtx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 8000; i++) {
      gtx.fillStyle = rand() > 0.5 ? "#557544" : "#466433";
      gtx.fillRect(rand() * 1024, rand() * 1024, 4, 4);
    }
    const worldToUv = (x, z) => [(x + 110) / 220 * 1024, (z + 110) / 220 * 1024];
    for (let x = -105; x <= 105; x += 0.6) {
      for (let z = -105; z <= 105; z += 0.6) {
        const [u, v] = worldToUv(x, z);
        if (onRiver(x, z)) {
          gtx.fillStyle = "#2a5e66";
          gtx.fillRect(u, v, 4, 4);
        } else if (insideWalls(x, z)) {
          if (onRoad(x, z)) {
            gtx.fillStyle = rand() > 0.5 ? "#6a6156" : "#5c554b";
            gtx.fillRect(u, v, 3, 3);
          } else {
            gtx.fillStyle = rand() > 0.5 ? "#7a6b52" : "#6e6148";
            gtx.fillRect(u, v, 3, 3);
          }
        }
      }
    }
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    groundTex.colorSpace = THREE.SRGBColorSpace;
    groundTex.anisotropy = 8;
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(220, 220, 1, 1),
      new THREE.MeshLambertMaterial({ map: groundTex })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const waterGeo = new THREE.PlaneGeometry(170, 12, 48, 6);
    waterGeo.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(waterGeo, shared.water);
    water.position.set(0, 0.12, 38);
    scene.add(water);
    waterMesh.mesh = water;

    const city = new THREE.Group();
    scene.add(city);

    const keep = makeKeep();
    keep.position.set(0, 0, -38);
    city.add(keep);

    const bailey = box(shared.stoneDark, 28, 3.4, 0.7, 0, 1.7, -26);
    city.add(bailey);
    crenellations(city, 28, 0.7, 3.4, 0, -26);
    city.add(box(shared.stone, 0.8, 4.2, 4, -8, 2.1, -26));
    city.add(box(shared.stone, 0.8, 4.2, 4, 8, 2.1, -26));

    const cathedral = makeCathedral();
    cathedral.position.set(18, 0, 0);
    city.add(cathedral);

    const well = makeWell();
    well.position.set(-1.5, 0, 1.2);
    city.add(well);

    for (let i = 0; i < 14; i++) {
      const stall = makeStall(rnd(1.6, 2.4), rnd(1.2, 1.8));
      const a = (i / 14) * Math.PI * 2 + 0.2;
      stall.position.set(Math.cos(a) * 6.5, 0, Math.sin(a) * 6.5);
      stall.rotation.y = a + Math.PI;
      city.add(stall);
    }

    const wallGroup = new THREE.Group();
    city.add(wallGroup);
    const SEG = 56;
    for (let i = 0; i < SEG; i++) {
      const a0 = (i / SEG) * Math.PI * 2;
      const a1 = ((i + 1) / SEG) * Math.PI * 2;
      const r0 = wallRadius(a0);
      const r1 = wallRadius(a1);
      const x0 = Math.cos(a0) * r0, z0 = Math.sin(a0) * r0;
      const x1 = Math.cos(a1) * r1, z1 = Math.sin(a1) * r1;
      const mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
      if (Math.hypot(mx, mz - 38) < 10) continue;
      const len = Math.hypot(x1 - x0, z1 - z0);
      const wall = box(shared.stone, len + 0.15, 5.2, 1.35, mx, 2.6, mz);
      wall.rotation.y = Math.atan2(x0 - x1, z0 - z1);
      wallGroup.add(wall);
      const walk = box(shared.stoneDark, len, 0.18, 1.1, mx, 5.25, mz);
      walk.rotation.y = wall.rotation.y;
      wallGroup.add(walk);
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + 0.12;
      const r = wallRadius(a);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (onRiver(x, z)) continue;
      const th = 9.5;
      const tower = box(shared.stoneDark, 4.2, th, 4.2, x, th / 2, z);
      wallGroup.add(tower);
      crenellations(wallGroup, 4.2, 4.2, th, x, z);
      const pole = box(shared.wood, 0.07, 2.6, 0.07, x, th + 1.3, z, false);
      wallGroup.add(pole);
      if (i % 2 === 0) {
        const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.55, 8, 2), pick(shared.banner));
        flag.position.set(x + 0.8, th + 2.1, z);
        wallGroup.add(flag);
        flags.push(flag);
      }
      const torch = box(shared.torch, 0.12, 0.18, 0.12, x * 0.96, 4.2, z * 0.96, false);
      wallGroup.add(torch);
      const light = new THREE.PointLight(0xff9944, 0, 12, 2);
      light.position.set(x * 0.96, 4.4, z * 0.96);
      scene.add(light);
      torches.push({ mesh: torch, light });
    }

    const gateA = 0.55;
    const gr = wallRadius(gateA);
    const gx = Math.cos(gateA) * gr, gz = Math.sin(gateA) * gr;
    const gate = new THREE.Group();
    gate.add(box(shared.stone, 3.2, 8, 3.6, -3.4, 4, 0));
    gate.add(box(shared.stone, 3.2, 8, 3.6, 3.4, 4, 0));
    gate.add(box(shared.stoneDark, 10, 2.2, 3.8, 0, 9.1, 0));
    crenellations(gate, 10, 3.8, 10.2);
    const port = box(shared.timber, 3.4, 4.2, 0.2, 0, 2.2, 0.4, false);
    gate.add(port);
    gate.position.set(gx, 0, gz);
    gate.lookAt(0, 0, 0);
    city.add(gate);

    const lots = [];
    for (let r = 12; r < CITY_R - 8; r += 5.4) {
      const n = Math.floor((Math.PI * 2 * r) / 6.2);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rnd(-0.04, 0.04);
        const rr = r + rnd(-0.8, 0.8);
        const x = Math.cos(a) * rr;
        const z = Math.sin(a) * rr;
        if (!insideWalls(x, z)) continue;
        if (onRoad(x, z) || onRiver(x, z)) continue;
        if (occupiedKeep(x, z) || occupiedChurch(x, z)) continue;
        if (Math.hypot(x, z) < 11) continue;
        lots.push({ x, z, a });
      }
    }
    lots.sort((p, q) => rand() - 0.5);

    for (const lot of lots) {
      if (rand() < 0.12) continue;
      const w = rnd(2.2, 4.4);
      const d = rnd(2.0, 3.8);
      const h = rnd(2.4, 5.8);
      let b;
      if (rand() < 0.12) b = makeStoneHall(w + 0.8, d + 0.4, h + 0.6);
      else b = makeHouse(w, d, h, pick(["tile", "tile", "thatch", "slate"]));
      b.position.set(lot.x, 0, lot.z);
      b.rotation.y = lot.a + Math.PI + rnd(-0.15, 0.15);
      const dx = Math.cos(lot.a) * 0.2, dz = Math.sin(lot.a) * 0.2;
      b.position.x -= dx;
      b.position.z -= dz;
      city.add(b);
    }

    for (let i = 0; i < 70; i++) {
      const a = rnd(0, Math.PI * 2);
      const r = CITY_R + rnd(8, 42);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (onRiver(x, z)) continue;
      const t = makeTree();
      t.position.set(x, 0, z);
      t.rotation.y = rnd(0, 6);
      scene.add(t);
    }

    const mill = new THREE.Group();
    mill.add(box(shared.stone, 3.4, 7, 3.4, 0, 3.5, 0));
    const cap = gableRoof(3.8, 3.8, 1.6, 0.1, shared.thatch);
    cap.position.y = 7;
    mill.add(cap);
    const hub = new THREE.Group();
    hub.position.set(1.9, 5.6, 0);
    for (let i = 0; i < 4; i++) {
      const blade = box(shared.wood, 0.18, 5.4, 0.7, 0, 2.5, 0, false);
      blade.rotation.z = (i * Math.PI) / 2;
      hub.add(blade);
    }
    mill.add(hub);
    mill.position.set(-78, 0, -18);
    scene.add(mill);
    mill.userData.hub = hub;

    const bridge = box(shared.wood, 12, 0.28, 3.2, 8, 0.55, 38);
    scene.add(bridge);
    scene.add(box(shared.wood, 0.18, 1.4, 0.18, 3, 0.9, 36.5, false));
    scene.add(box(shared.wood, 0.18, 1.4, 0.18, 13, 0.9, 36.5, false));
    scene.add(box(shared.wood, 0.18, 1.4, 0.18, 3, 0.9, 39.5, false));
    scene.add(box(shared.wood, 0.18, 1.4, 0.18, 13, 0.9, 39.5, false));

    const waypoints = [];
    for (const ring of [16, 32, 48]) {
      const n = Math.floor(ring * 1.6);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const x = Math.cos(a) * ring, z = Math.sin(a) * ring;
        if (insideWalls(x, z) && !onRiver(x, z)) waypoints.push(new THREE.Vector3(x, 0, z));
      }
    }
    for (let i = 0; i < 8; i++) {
      const aa = (i / 8) * Math.PI * 2 + 0.18;
      for (let r = 8; r < CITY_R - 6; r += 3) {
        const x = Math.cos(aa) * r, z = Math.sin(aa) * r;
        if (insideWalls(x, z) && !onRiver(x, z)) waypoints.push(new THREE.Vector3(x, 0, z));
      }
    }

    function nearestWaypoints(p, exclude) {
      let best = null, bestD = 1e9, second = null, secondD = 1e9;
      for (const w of waypoints) {
        if (w === exclude) continue;
        const d = p.distanceToSquared(w);
        if (d < bestD) { second = best; secondD = bestD; best = w; bestD = d; }
        else if (d < secondD) { second = w; secondD = d; }
      }
      return [best, second];
    }

    for (let i = 0; i < 48; i++) {
      const p = makePerson();
      const start = pick(waypoints);
      const [n1] = nearestWaypoints(start);
      p.position.copy(start);
      city.add(p);
      walkers.push({
        mesh: p,
        from: start.clone(),
        to: (n1 || start).clone(),
        t: rand(),
        speed: rnd(0.9, 1.7),
      });
    }

    for (let i = 0; i < 6; i++) {
      const c = makeCart();
      const start = pick(waypoints);
      c.position.copy(start);
      city.add(c);
      carts.push({
        mesh: c,
        from: start.clone(),
        to: nearestWaypoints(start)[0].clone(),
        t: rand(),
        speed: rnd(0.55, 0.95),
      });
    }

    for (let i = 0; i < 18; i++) {
      const b = makeBird();
      scene.add(b);
      birds.push({
        mesh: b,
        r: rnd(20, 70),
        y: rnd(14, 28),
        a: rnd(0, Math.PI * 2),
        s: rnd(0.25, 0.7),
        tilt: rnd(-0.2, 0.2),
      });
    }

    const smokeGeo = new THREE.SphereGeometry(0.28, 6, 6);
    for (let i = 0; i < 90; i++) {
      const s = new THREE.Mesh(smokeGeo, shared.smoke.clone());
      s.visible = false;
      scene.add(s);
      smokes.push({ mesh: s, life: 0, max: 1, vx: 0, vz: 0 });
    }
    let smokeCursor = 0;
    function emitSmoke(wx, wy, wz) {
      const s = smokes[smokeCursor++ % smokes.length];
      s.mesh.position.set(wx + rnd(-0.1, 0.1), wy, wz + rnd(-0.1, 0.1));
      s.mesh.visible = true;
      s.mesh.material.opacity = 0.32;
      s.life = 0;
      s.max = rnd(2.2, 4.2);
      s.vx = rnd(-0.15, 0.25);
      s.vz = rnd(-0.15, 0.15);
    }

    const clock = new THREE.Clock();
    let day = 0.22;
    const tmp = new THREE.Vector3();

    function stepAgent(agent, dt, bob, wheel) {
      agent.t += dt * agent.speed * 0.35;
      if (agent.t >= 1) {
        agent.t = 0;
        agent.from.copy(agent.to);
        const opts = nearestWaypoints(agent.to, null);
        let next = pick(opts.filter(Boolean));
        if (!next || next.distanceToSquared(agent.to) < 0.01) {
          next = pick(waypoints);
        }
        agent.to.copy(next);
      }
      tmp.lerpVectors(agent.from, agent.to, agent.t);
      agent.mesh.position.x = tmp.x;
      agent.mesh.position.z = tmp.z;
      const ang = Math.atan2(agent.to.x - agent.from.x, agent.to.z - agent.from.z);
      agent.mesh.rotation.y = ang;
      if (bob) agent.mesh.position.y = Math.abs(Math.sin(clock.elapsedTime * 8 * agent.speed + agent.t * 12)) * 0.05;
      if (wheel) {
        agent.mesh.children.forEach((ch) => {
          if (ch.geometry && ch.geometry.type === "CylinderGeometry") ch.rotation.x += dt * 6;
        });
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      day += dt * 0.018;
      const sunA = day;
      const elev = Math.sin(sunA);
      const skyDay = new THREE.Color(0x87a0c0);
      const skyDusk = new THREE.Color(0xc07848);
      const skyNight = new THREE.Color(0x0b1220);
      let sky;
      if (elev > 0.15) sky = skyDay;
      else if (elev > -0.05) sky = skyDay.clone().lerp(skyDusk, 1 - (elev + 0.05) / 0.2);
      else if (elev > -0.25) sky = skyDusk.clone().lerp(skyNight, 1 - (elev + 0.25) / 0.2);
      else sky = skyNight;
      scene.background.copy(sky);
      scene.fog.color.copy(sky);
      sun.position.set(Math.cos(sunA) * 90, Math.max(elev, 0.02) * 110, Math.sin(sunA * 0.7) * 70);
      sun.intensity = THREE.MathUtils.clamp(elev * 1.8, 0.08, 1.4);
      hemi.intensity = THREE.MathUtils.clamp(0.2 + elev * 0.5, 0.12, 0.65);
      renderer.toneMappingExposure = THREE.MathUtils.clamp(0.55 + elev * 0.7, 0.45, 1.15);
      const torchOn = elev < 0.12;
      for (const t of torches) {
        t.light.intensity = torchOn ? 1.6 + Math.sin(clock.elapsedTime * 9 + t.light.id) * 0.35 : 0;
        t.mesh.material.emissiveIntensity = torchOn ? 1.4 : 0.15;
      }
      shared.window.emissiveIntensity = torchOn ? 0.85 : 0.12;

      const t = clock.elapsedTime;
      for (const f of flags) {
        const pos = f.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = f.geometry.parameters ? (i % 9) / 8 : pos.getX(i);
          const u = pos.getX(i);
          const v = pos.getY(i);
          pos.setZ(i, Math.sin(t * 3.2 + u * 4.5 + v) * 0.12 * (u + 0.9));
        }
        pos.needsUpdate = true;
        f.geometry.computeVertexNormals();
      }

      mill.userData.hub.rotation.z += dt * 0.7;

      const wpos = water.geometry.attributes.position;
      for (let i = 0; i < wpos.count; i++) {
        const x = wpos.getX(i);
        const z = wpos.getZ(i);
        wpos.setY(i, Math.sin(x * 0.35 + t * 1.6) * 0.08 + Math.cos(z * 0.8 + t) * 0.05);
      }
      wpos.needsUpdate = true;
      water.geometry.computeVertexNormals();

      for (const w of walkers) stepAgent(w, dt, true, false);
      for (const c of carts) stepAgent(c, dt, false, true);

      for (const b of birds) {
        b.a += dt * b.s;
        b.mesh.position.set(Math.cos(b.a) * b.r, b.y + Math.sin(t * 2 + b.a) * 0.6, Math.sin(b.a) * b.r * 0.7);
        b.mesh.rotation.y = -b.a + Math.PI / 2;
        b.mesh.userData.wing.rotation.z = Math.sin(t * 10 + b.a) * 0.5;
      }

      if (rand() < dt * 8 && chimneys.length) {
        const ch = pick(chimneys);
        ch.node.updateWorldMatrix(true, false);
        tmp.set(ch.x, ch.y, ch.z);
        ch.node.localToWorld(tmp);
        emitSmoke(tmp.x, tmp.y, tmp.z);
      }
      for (const s of smokes) {
        if (!s.mesh.visible) continue;
        s.life += dt;
        s.mesh.position.y += dt * 0.85;
        s.mesh.position.x += s.vx * dt;
        s.mesh.position.z += s.vz * dt;
        s.mesh.scale.setScalar(1 + s.life * 0.5);
        s.mesh.material.opacity = Math.max(0, 0.32 * (1 - s.life / s.max));
        if (s.life > s.max) s.mesh.visible = false;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
