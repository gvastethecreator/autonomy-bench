<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Biped</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: #d8e4f0;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.04em;
      opacity: 0.72;
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">procedural gait · drag to orbit · scroll to zoom</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);
    scene.fog = new THREE.Fog(0x0b0e14, 12, 38);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(4.6, 2.6, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 3;
    controls.maxDistance = 16;

    scene.add(new THREE.HemisphereLight(0x9ec4ff, 0x2a1a10, 0.55));

    const sun = new THREE.DirectionalLight(0xfff1d6, 1.35);
    sun.position.set(6, 10, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 28;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x6ea8ff, 0.45);
    rim.position.set(-5, 3, -6);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(18, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2230, roughness: 0.92, metalness: 0.04 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(18, 18, 0x3a4a62, 0x243044);
    grid.position.y = 0.002;
    grid.material.transparent = true;
    grid.material.opacity = 0.35;
    scene.add(grid);

    const skin = new THREE.MeshStandardMaterial({
      color: 0xc47a4a,
      roughness: 0.48,
      metalness: 0.08,
    });
    const hide = new THREE.MeshStandardMaterial({
      color: 0x6b3d2a,
      roughness: 0.62,
      metalness: 0.06,
    });
    const joint = new THREE.MeshStandardMaterial({
      color: 0x2c211c,
      roughness: 0.4,
      metalness: 0.18,
    });
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0x1c1010,
      emissive: 0xff7a3a,
      emissiveIntensity: 0.55,
      roughness: 0.25,
    });
    const accent = new THREE.MeshStandardMaterial({
      color: 0xe8c089,
      roughness: 0.35,
      metalness: 0.12,
    });

    function limb(radius, length, mat = skin) {
      const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 6, 12), mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.y = -length / 2 - radius * 0.15;
      return mesh;
    }

    function ball(radius, mat = joint) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function node() {
      return new THREE.Object3D();
    }

    const root = node();
    scene.add(root);

    const pelvis = node();
    pelvis.position.y = 1.42;
    root.add(pelvis);
    const hips = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), hide);
    hips.scale.set(1.35, 0.85, 1.05);
    hips.castShadow = true;
    pelvis.add(hips);

    const spine = node();
    spine.position.y = 0.12;
    pelvis.add(spine);
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.42, 8, 14), skin);
    torso.scale.set(1.15, 1, 0.9);
    torso.position.y = 0.38;
    torso.castShadow = true;
    spine.add(torso);

    const chestPlate = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 16, 12),
      accent
    );
    chestPlate.scale.set(1.15, 0.7, 0.55);
    chestPlate.position.set(0, 0.42, 0.16);
    chestPlate.castShadow = true;
    spine.add(chestPlate);

    const neck = node();
    neck.position.y = 0.72;
    spine.add(neck);
    neck.add(limb(0.07, 0.12, hide));

    const head = node();
    head.position.y = 0.22;
    neck.add(head);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 16), skin);
    skull.scale.set(0.95, 1.08, 1.05);
    skull.castShadow = true;
    head.add(skull);
    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 10), hide);
    snout.scale.set(0.7, 0.55, 1.15);
    snout.position.set(0, -0.04, 0.16);
    snout.castShadow = true;
    head.add(snout);
    const crest = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 8), accent);
    crest.position.set(0, 0.22, -0.02);
    crest.rotation.z = Math.PI;
    crest.castShadow = true;
    head.add(crest);

    for (const side of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), eyeMat);
      eye.position.set(0.07 * side, 0.04, 0.15);
      head.add(eye);
    }

    function makeArm(sign) {
      const shoulder = node();
      shoulder.position.set(0.38 * sign, 0.58, 0);
      spine.add(shoulder);
      shoulder.add(ball(0.08));

      const upper = node();
      upper.position.y = -0.02;
      shoulder.add(upper);
      upper.add(limb(0.065, 0.34, hide));

      const elbow = node();
      elbow.position.y = -0.4;
      upper.add(elbow);
      elbow.add(ball(0.055));

      const forearm = node();
      elbow.add(forearm);
      forearm.add(limb(0.05, 0.3, skin));

      const wrist = node();
      wrist.position.y = -0.36;
      forearm.add(wrist);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), hide);
      hand.scale.set(0.85, 1.1, 0.7);
      hand.castShadow = true;
      wrist.add(hand);

      return { shoulder, upper, elbow, forearm, wrist };
    }

    function makeLeg(sign) {
      const hip = node();
      hip.position.set(0.16 * sign, -0.04, 0);
      pelvis.add(hip);
      hip.add(ball(0.09));

      const thigh = node();
      hip.add(thigh);
      thigh.add(limb(0.09, 0.42, hide));

      const knee = node();
      knee.position.y = -0.5;
      thigh.add(knee);
      knee.add(ball(0.07));

      const shin = node();
      knee.add(shin);
      shin.add(limb(0.07, 0.4, skin));

      const ankle = node();
      ankle.position.y = -0.48;
      shin.add(ankle);
      ankle.add(ball(0.055, hide));

      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.06, 0.28),
        hide
      );
      foot.position.set(0, -0.04, 0.08);
      foot.castShadow = true;
      ankle.add(foot);

      const toe = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), skin);
      toe.scale.set(1.4, 0.7, 1.6);
      toe.position.set(0, -0.04, 0.22);
      toe.castShadow = true;
      ankle.add(toe);

      return { hip, thigh, knee, shin, ankle };
    }

    const leftArm = makeArm(-1);
    const rightArm = makeArm(1);
    const leftLeg = makeLeg(-1);
    const rightLeg = makeLeg(1);

    const tail = node();
    tail.position.set(0, 0.02, -0.12);
    pelvis.add(tail);
    const tailMesh = limb(0.05, 0.55, hide);
    tailMesh.rotation.x = Math.PI / 2.4;
    tailMesh.position.set(0, -0.08, -0.28);
    tail.add(tailMesh);

    const WALK = {
      hz: 1.15,
      hipSwing: 0.58,
      hipYaw: 0.1,
      kneeLift: 1.05,
      ankle: 0.38,
      armSwing: 0.55,
      elbow: 0.42,
      bob: 0.055,
      sway: 0.07,
      twist: 0.14,
      lean: 0.06,
    };

    function poseLeg(leg, phase) {
      const swing = Math.sin(phase);
      const lift = Math.max(0, Math.sin(phase + Math.PI * 0.92));
      leg.hip.rotation.x = swing * WALK.hipSwing - 0.06;
      leg.hip.rotation.y = swing * WALK.hipYaw * 0.35;
      leg.knee.rotation.x = lift * WALK.kneeLift;
      leg.ankle.rotation.x = -swing * WALK.ankle - lift * 0.22 + 0.12;
    }

    function poseArm(arm, phase, sign) {
      const swing = Math.sin(phase);
      arm.shoulder.rotation.x = swing * WALK.armSwing + 0.18;
      arm.shoulder.rotation.z = 0.18 * sign + swing * 0.04 * sign;
      arm.elbow.rotation.x = 0.28 + Math.max(0, -swing) * WALK.elbow;
      arm.wrist.rotation.x = swing * 0.12;
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const phase = t * WALK.hz * Math.PI * 2;
      const left = phase;
      const right = phase + Math.PI;

      poseLeg(leftLeg, left);
      poseLeg(rightLeg, right);
      poseArm(leftArm, right, -1);
      poseArm(rightArm, left, 1);

      const bob = Math.abs(Math.sin(phase * 2)) * WALK.bob;
      pelvis.position.y = 1.42 + bob;
      pelvis.rotation.z = Math.sin(phase) * WALK.sway;
      pelvis.rotation.y = Math.sin(phase) * WALK.twist * 0.35;
      spine.rotation.y = -Math.sin(phase) * WALK.twist;
      spine.rotation.x = WALK.lean + Math.sin(phase * 2) * 0.03;
      neck.rotation.y = Math.sin(phase) * 0.08;
      head.rotation.x = -0.08 + Math.sin(phase * 2) * 0.04;
      tail.rotation.x = 0.35 + Math.sin(phase * 2) * 0.08;
      tail.rotation.y = Math.sin(phase) * 0.18;

      root.position.z = ((t * 1.15) % 12) - 6;

      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
