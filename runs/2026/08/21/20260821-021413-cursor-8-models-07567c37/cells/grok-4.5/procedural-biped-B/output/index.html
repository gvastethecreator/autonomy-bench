<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Biped Walk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: #c8d4e8;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      opacity: 0.75;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="hud">procedural biped · click-drag orbit · scroll zoom</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    scene.fog = new THREE.Fog(0x0b1220, 12, 42);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.2, 2.6, 5.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 2.5;
    controls.maxDistance = 16;

    const hemi = new THREE.HemisphereLight(0xb8d0ff, 0x2a1f14, 0.55);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2dd, 1.35);
    sun.position.set(5, 10, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x6a8cff, 0.35);
    fill.position.set(-4, 3, -5);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(18, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2333, roughness: 0.92, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(18, 36, 0x334466, 0x1e2a3d);
    grid.position.y = 0.002;
    scene.add(grid);

    // --- Materials ---
    const skin = new THREE.MeshStandardMaterial({
      color: 0xd4a574,
      roughness: 0.55,
      metalness: 0.08,
    });
    const cloth = new THREE.MeshStandardMaterial({
      color: 0x3d5a80,
      roughness: 0.7,
      metalness: 0.05,
    });
    const accent = new THREE.MeshStandardMaterial({
      color: 0xe07a5f,
      roughness: 0.45,
      metalness: 0.12,
    });
    const jointMat = new THREE.MeshStandardMaterial({
      color: 0x2b2d42,
      roughness: 0.4,
      metalness: 0.25,
    });

    function box(w, h, d, mat, cast = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.castShadow = cast;
      m.receiveShadow = true;
      return m;
    }

    function sphere(r, mat, cast = true) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), mat);
      m.castShadow = cast;
      m.receiveShadow = true;
      return m;
    }

    // --- Biped hierarchy ---
    // Root walks forward in place with bob; limbs driven by procedural IK-ish angles.
    const root = new THREE.Group();
    scene.add(root);

    const pelvis = new THREE.Group();
    pelvis.position.y = 1.05;
    root.add(pelvis);

    const torso = box(0.42, 0.55, 0.28, cloth);
    torso.position.y = 0.42;
    pelvis.add(torso);

    const chestAccent = box(0.38, 0.12, 0.3, accent);
    chestAccent.position.set(0, 0.58, 0.02);
    pelvis.add(chestAccent);

    const neck = box(0.12, 0.12, 0.12, skin);
    neck.position.y = 0.78;
    pelvis.add(neck);

    const head = sphere(0.2, skin);
    head.position.y = 0.98;
    pelvis.add(head);

    const snout = box(0.14, 0.1, 0.16, skin);
    snout.position.set(0, 0.94, 0.16);
    pelvis.add(snout);

    const eyeL = sphere(0.035, jointMat, false);
    eyeL.position.set(-0.08, 1.02, 0.16);
    pelvis.add(eyeL);
    const eyeR = sphere(0.035, jointMat, false);
    eyeR.position.set(0.08, 1.02, 0.16);
    pelvis.add(eyeR);

    function makeArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.28, 0.62, 0);
      pelvis.add(shoulder);

      const joint = sphere(0.07, jointMat);
      shoulder.add(joint);

      const upper = box(0.1, 0.32, 0.1, skin);
      upper.position.y = -0.18;
      shoulder.add(upper);

      const elbow = new THREE.Group();
      elbow.position.y = -0.36;
      shoulder.add(elbow);

      const elbowBall = sphere(0.055, jointMat);
      elbow.add(elbowBall);

      const lower = box(0.09, 0.3, 0.09, skin);
      lower.position.y = -0.16;
      elbow.add(lower);

      const hand = box(0.1, 0.08, 0.1, accent);
      hand.position.y = -0.34;
      elbow.add(hand);

      return { shoulder, elbow };
    }

    function makeLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.14, 0, 0);
      pelvis.add(hip);

      const hipBall = sphere(0.08, jointMat);
      hip.add(hipBall);

      const thigh = box(0.14, 0.38, 0.16, cloth);
      thigh.position.y = -0.22;
      hip.add(thigh);

      const knee = new THREE.Group();
      knee.position.y = -0.42;
      hip.add(knee);

      const kneeBall = sphere(0.065, jointMat);
      knee.add(kneeBall);

      const shin = box(0.12, 0.36, 0.14, skin);
      shin.position.y = -0.2;
      knee.add(shin);

      const ankle = new THREE.Group();
      ankle.position.y = -0.4;
      knee.add(ankle);

      const foot = box(0.14, 0.07, 0.26, accent);
      foot.position.set(0, -0.02, 0.05);
      ankle.add(foot);

      return { hip, knee, ankle };
    }

    const leftArm = makeArm(-1);
    const rightArm = makeArm(1);
    const leftLeg = makeLeg(-1);
    const rightLeg = makeLeg(1);

    // Walk parameters
    const walk = {
      speed: 2.6,       // cycles per second scale
      stride: 0.55,     // hip swing amplitude (rad)
      kneeAmp: 0.95,    // knee bend amplitude
      armAmp: 0.5,
      elbowAmp: 0.55,
      bob: 0.06,
      sway: 0.05,
      lean: 0.08,
    };

    const clock = new THREE.Clock();

    function animateLimb(leg, arm, phase, dtSign) {
      // phase in radians; opposite limbs use phase + PI
      const swing = Math.sin(phase);
      const lift = Math.max(0, Math.sin(phase)); // stance vs swing approx

      leg.hip.rotation.x = swing * walk.stride;
      leg.knee.rotation.x = lift * walk.kneeAmp;
      leg.ankle.rotation.x = -leg.hip.rotation.x * 0.35 - leg.knee.rotation.x * 0.25;

      arm.shoulder.rotation.x = -swing * walk.armAmp;
      arm.elbow.rotation.x = (0.35 + Math.max(0, -swing) * walk.elbowAmp) * dtSign;
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    function tick() {
      const t = clock.getElapsedTime();
      const phase = t * walk.speed * Math.PI * 2;

      // Body motion
      root.position.y = Math.abs(Math.sin(phase * 2)) * walk.bob;
      pelvis.rotation.y = Math.sin(phase) * walk.sway;
      pelvis.rotation.z = Math.sin(phase) * walk.sway * 0.6;
      pelvis.rotation.x = walk.lean + Math.sin(phase * 2) * 0.03;

      // Head look bob
      head.rotation.y = Math.sin(phase * 0.5) * 0.08;
      snout.rotation.y = head.rotation.y;

      animateLimb(leftLeg, rightArm, phase, 1);
      animateLimb(rightLeg, leftArm, phase + Math.PI, 1);

      // Slight forward shuffle illusion via root Z oscillation (in place)
      root.position.z = Math.sin(phase) * 0.04;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
