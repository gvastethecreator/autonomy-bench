<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Night Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: rgba(200, 220, 255, 0.7);
      font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.04em;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(80, 140, 255, 0.4);
    }
  </style>
</head>
<body>
  <div id="hud">ENDLESS NIGHT · ARROWS / WASD · SPACE BOOST</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

const ROAD_WIDTH = 12;
const SEGMENT_LENGTH = 40;
const SEGMENT_COUNT = 28;
const LANE_MARK_SPACING = 8;
const TREE_SPACING = 18;
const LIGHT_SPACING = 36;

const started = performance.now();
const clock = new THREE.Clock();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);
scene.fog = new THREE.FogExp2(0x070a14, 0.018);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 2.2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// --- Lights ---
const ambient = new THREE.AmbientLight(0x1a2035, 0.55);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0xa8b8ff, 0.35);
moon.position.set(-40, 80, -20);
scene.add(moon);

const headlightL = new THREE.SpotLight(0xfff2d6, 4.5, 55, Math.PI / 7, 0.45, 1.2);
const headlightR = new THREE.SpotLight(0xfff2d6, 4.5, 55, Math.PI / 7, 0.45, 1.2);
headlightL.position.set(-0.55, 0.85, -1.1);
headlightR.position.set(0.55, 0.85, -1.1);
scene.add(headlightL, headlightR);
scene.add(headlightL.target, headlightR.target);

// --- Stars ---
{
  const count = 1800;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 180 + Math.random() * 120;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1) * 0.45;
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 20;
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 40;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xc8d6ff,
    size: 0.55,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
  });
  scene.add(new THREE.Points(geo, mat));
}

// --- Moon disc ---
{
  const moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(8, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xdde6ff })
  );
  moonMesh.position.set(-55, 70, -90);
  scene.add(moonMesh);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(14, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x8899cc, transparent: true, opacity: 0.12 })
  );
  glow.position.copy(moonMesh.position);
  scene.add(glow);
}

// --- Player car (simple low-poly) ---
const car = new THREE.Group();
{
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a2740, metalness: 0.6, roughness: 0.35 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.55 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.4, roughness: 0.45 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.55, 4.2), bodyMat);
  body.position.y = 0.55;
  car.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.5, 2.0), glassMat);
  cabin.position.set(0, 1.05, -0.15);
  car.add(cabin);

  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.18, 1.1), bodyMat);
  hood.position.set(0, 0.78, -1.35);
  car.add(hood);

  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.08, 0.35), accentMat);
  spoiler.position.set(0, 1.05, 1.85);
  car.add(spoiler);

  const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.28, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.85 });
  const wheelPositions = [
    [-0.95, 0.32, -1.25],
    [0.95, 0.32, -1.25],
    [-0.95, 0.32, 1.3],
    [0.95, 0.32, 1.3],
  ];
  for (const [x, y, z] of wheelPositions) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, y, z);
    car.add(w);
  }

  const lampGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff5d0 });
  const lampL = new THREE.Mesh(lampGeo, lampMat);
  const lampR = new THREE.Mesh(lampGeo, lampMat);
  lampL.position.set(-0.55, 0.7, -2.15);
  lampR.position.set(0.55, 0.7, -2.15);
  car.add(lampL, lampR);

  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
  const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.08), tailMat);
  const tailR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.08), tailMat);
  tailL.position.set(-0.65, 0.7, 2.12);
  tailR.position.set(0.65, 0.7, 2.12);
  car.add(tailL, tailR);
}
car.position.set(0, 0, 0);
scene.add(car);

// --- Road world (recycled segments) ---
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1a1c22, roughness: 0.95, metalness: 0.05 });
const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x2a2e28, roughness: 1 });
const lineMat = new THREE.MeshBasicMaterial({ color: 0xe8e0a8 });
const dashMat = new THREE.MeshBasicMaterial({ color: 0xd8d0a0 });
const barrierMat = new THREE.MeshStandardMaterial({ color: 0x55585f, metalness: 0.3, roughness: 0.7 });
const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1 });
const treeFoliageMat = new THREE.MeshStandardMaterial({ color: 0x0d1f14, roughness: 1 });
const lightPoleMat = new THREE.MeshStandardMaterial({ color: 0x33363e, metalness: 0.5, roughness: 0.5 });

const roadSegments = [];
const laneMarks = [];
const decorations = [];

function makeRoadSegment(z) {
  const group = new THREE.Group();
  group.position.z = z;

  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH), asphaltMat);
  road.rotation.x = -Math.PI / 2;
  group.add(road);

  const leftShoulder = new THREE.Mesh(new THREE.PlaneGeometry(4, SEGMENT_LENGTH), shoulderMat);
  leftShoulder.rotation.x = -Math.PI / 2;
  leftShoulder.position.x = -(ROAD_WIDTH / 2 + 2);
  group.add(leftShoulder);

  const rightShoulder = leftShoulder.clone();
  rightShoulder.position.x = ROAD_WIDTH / 2 + 2;
  group.add(rightShoulder);

  const leftLine = new THREE.Mesh(new THREE.PlaneGeometry(0.12, SEGMENT_LENGTH), lineMat);
  leftLine.rotation.x = -Math.PI / 2;
  leftLine.position.set(-ROAD_WIDTH / 2 + 0.4, 0.01, 0);
  group.add(leftLine);

  const rightLine = leftLine.clone();
  rightLine.position.x = ROAD_WIDTH / 2 - 0.4;
  group.add(rightLine);

  const leftBarrier = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, SEGMENT_LENGTH), barrierMat);
  leftBarrier.position.set(-(ROAD_WIDTH / 2 + 0.5), 0.28, 0);
  group.add(leftBarrier);

  const rightBarrier = leftBarrier.clone();
  rightBarrier.position.x = ROAD_WIDTH / 2 + 0.5;
  group.add(rightBarrier);

  roadGroup.add(group);
  roadSegments.push(group);
}

function makeLaneDash(z) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 3.2), dashMat);
  dash.rotation.x = -Math.PI / 2;
  dash.position.set(0, 0.015, z);
  roadGroup.add(dash);
  laneMarks.push(dash);
}

function makeTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 2.2, 6), treeTrunkMat);
  trunk.position.y = 1.1;
  g.add(trunk);
  const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.2, 7), treeFoliageMat);
  foliage.position.y = 3.2;
  g.add(foliage);
  const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.4, 7), treeFoliageMat);
  foliage2.position.y = 4.4;
  g.add(foliage2);
  g.position.set(x, 0, z);
  roadGroup.add(g);
  decorations.push(g);
}

function makeStreetLight(x, z, side) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5.5, 6), lightPoleMat);
  pole.position.y = 2.75;
  g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.08), lightPoleMat);
  arm.position.set(side * 0.7, 5.4, 0);
  g.add(arm);
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffe8b0 })
  );
  bulb.position.set(side * 1.35, 5.2, 0);
  g.add(bulb);
  const light = new THREE.PointLight(0xffd9a0, 1.8, 28, 2);
  light.position.copy(bulb.position);
  g.add(light);
  g.position.set(x, 0, z);
  roadGroup.add(g);
  decorations.push(g);
}

// Build world strip
const worldLength = SEGMENT_COUNT * SEGMENT_LENGTH;
for (let i = 0; i < SEGMENT_COUNT; i++) {
  makeRoadSegment(-i * SEGMENT_LENGTH);
}
for (let z = 0; z > -worldLength; z -= LANE_MARK_SPACING) {
  makeLaneDash(z);
}
for (let z = 0; z > -worldLength; z -= TREE_SPACING) {
  makeTree(-(ROAD_WIDTH / 2 + 5 + Math.random() * 3), z + Math.random() * 4);
  makeTree(ROAD_WIDTH / 2 + 5 + Math.random() * 3, z + Math.random() * 4);
  if (Math.random() > 0.45) {
    makeTree(-(ROAD_WIDTH / 2 + 9 + Math.random() * 6), z - 6);
    makeTree(ROAD_WIDTH / 2 + 9 + Math.random() * 6, z - 6);
  }
}
for (let z = 0; z > -worldLength; z -= LIGHT_SPACING) {
  makeStreetLight(-(ROAD_WIDTH / 2 + 1.2), z, 1);
  makeStreetLight(ROAD_WIDTH / 2 + 1.2, z - LIGHT_SPACING / 2, -1);
}

// Distant hills silhouette
{
  const hillGeo = new THREE.CylinderGeometry(80, 90, 18, 6, 1, false);
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x0a1018, roughness: 1, flatShading: true });
  for (let i = 0; i < 6; i++) {
    const h = new THREE.Mesh(hillGeo, hillMat);
    const side = i % 2 === 0 ? -1 : 1;
    h.position.set(side * (55 + (i % 3) * 18), -4, -40 - i * 45);
    h.rotation.y = Math.random() * Math.PI;
    h.scale.set(0.6 + Math.random() * 0.5, 0.7 + Math.random() * 0.6, 1);
    scene.add(h);
  }
}

// --- Controls ---
const keys = Object.create(null);
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

let speed = 28;
let lateral = 0;
let lateralVel = 0;
let distance = 0;
let steer = 0;

function recycleAlongZ(obj, length) {
  while (obj.position.z > car.position.z + SEGMENT_LENGTH) {
    obj.position.z -= length;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  const boost = keys['Space'] ? 1.55 : 1;
  const targetSpeed = 26 * boost + (keys['ArrowUp'] || keys['KeyW'] ? 12 : 0) - (keys['ArrowDown'] || keys['KeyS'] ? 10 : 0);
  speed += (Math.max(8, targetSpeed) - speed) * Math.min(1, dt * 2.5);

  let steerInput = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) steerInput -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) steerInput += 1;
  lateralVel += steerInput * 18 * dt;
  lateralVel *= Math.pow(0.08, dt);
  lateral += lateralVel * dt;
  lateral = THREE.MathUtils.clamp(lateral, -ROAD_WIDTH / 2 + 1.4, ROAD_WIDTH / 2 - 1.4);
  steer = THREE.MathUtils.lerp(steer, -steerInput * 0.18 - lateralVel * 0.02, 1 - Math.pow(0.001, dt));

  const move = speed * dt;
  distance += move;
  car.position.z -= move;
  car.position.x = lateral;
  car.rotation.y = steer;
  car.rotation.z = -steer * 0.35;
  car.position.y = Math.sin(t * 14) * 0.015 * (speed / 30);

  // Recycle world
  for (const seg of roadSegments) recycleAlongZ(seg, worldLength);
  for (const mark of laneMarks) recycleAlongZ(mark, worldLength);
  for (const dec of decorations) recycleAlongZ(dec, worldLength);

  // Camera chase
  const camTarget = new THREE.Vector3(
    car.position.x * 0.85,
    2.4 + Math.sin(t * 0.7) * 0.05,
    car.position.z + 7.2
  );
  camera.position.lerp(camTarget, 1 - Math.pow(0.0008, dt));
  camera.lookAt(car.position.x, 1.2, car.position.z - 8);

  // Headlights follow car
  headlightL.position.set(car.position.x - 0.55, car.position.y + 0.85, car.position.z - 1.1);
  headlightR.position.set(car.position.x + 0.55, car.position.y + 0.85, car.position.z - 1.1);
  headlightL.target.position.set(car.position.x - 1.2, 0.2, car.position.z - 28);
  headlightR.target.position.set(car.position.x + 1.2, 0.2, car.position.z - 28);
  headlightL.target.updateMatrixWorld();
  headlightR.target.updateMatrixWorld();

  // Subtle speed-based exposure
  renderer.toneMappingExposure = 1.0 + Math.min(0.2, (speed - 26) * 0.01);

  renderer.render(scene, camera);

  const hud = document.getElementById('hud');
  if (hud) {
    hud.textContent = `ENDLESS NIGHT · ${Math.round(speed)} km/h · ${Math.round(distance)} m · ARROWS/WASD · SPACE BOOST`;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

// Touch / click focus so keyboard works after load
window.addEventListener('pointerdown', () => renderer.domElement.focus?.());
console.info('Endless night drive ready in', Math.round(performance.now() - started), 'ms');
  </script>
</body>
</html>
