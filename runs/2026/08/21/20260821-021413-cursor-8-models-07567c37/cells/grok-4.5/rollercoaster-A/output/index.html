<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First-Person Rollercoaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: rgba(255, 255, 255, 0.85);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div id="hud">First-person rollercoaster · continuous loop</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b8e8);
    scene.fog = new THREE.Fog(0x87b8e8, 80, 320);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const sun = new THREE.DirectionalLight(0xfff2d6, 1.15);
    sun.position.set(60, 120, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 300;
    sun.shadow.camera.left = -120;
    sun.shadow.camera.right = 120;
    sun.shadow.camera.top = 120;
    sun.shadow.camera.bottom = -120;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x9ec9ff, 0x4a7a3a, 0.35));

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x3d8f4a, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Decorative hills
    const hillMat = new THREE.MeshStandardMaterial({ color: 0x2f7a3c, roughness: 1 });
    for (let i = 0; i < 18; i++) {
      const r = 8 + Math.random() * 22;
      const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), hillMat);
      const ang = (i / 18) * Math.PI * 2;
      const dist = 90 + Math.random() * 80;
      hill.position.set(Math.cos(ang) * dist, r * 0.25, Math.sin(ang) * dist);
      hill.scale.y = 0.35 + Math.random() * 0.25;
      hill.castShadow = true;
      hill.receiveShadow = true;
      scene.add(hill);
    }

    // Closed rollercoaster path (loop)
    const controlPoints = [
      new THREE.Vector3(0, 8, 40),
      new THREE.Vector3(35, 12, 28),
      new THREE.Vector3(50, 28, 0),
      new THREE.Vector3(35, 42, -30),
      new THREE.Vector3(0, 55, -45),
      new THREE.Vector3(-30, 48, -25),
      new THREE.Vector3(-45, 30, 5),
      new THREE.Vector3(-38, 18, 30),
      new THREE.Vector3(-15, 10, 48),
      new THREE.Vector3(10, 6, 52),
      new THREE.Vector3(25, 14, 38),
      new THREE.Vector3(40, 35, 10),
      new THREE.Vector3(20, 50, -20),
      new THREE.Vector3(-10, 38, -40),
      new THREE.Vector3(-40, 22, -15),
      new THREE.Vector3(-25, 12, 20),
    ];
    const curve = new THREE.CatmullRomCurve3(controlPoints, true, 'catmullrom', 0.45);
    const trackLen = curve.getLength();

    // Tube track body
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 400, 0.28, 10, true),
      new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.55, roughness: 0.35 })
    );
    tube.castShadow = true;
    tube.receiveShadow = true;
    scene.add(tube);

    // Twin rails
    const railOffset = 0.55;
    const railMat = new THREE.MeshStandardMaterial({ color: 0xdfe6e9, metalness: 0.85, roughness: 0.25 });
    function buildRail(side) {
      const pts = [];
      const N = 300;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const p = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const binormal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        if (binormal.lengthSq() < 1e-6) binormal.set(1, 0, 0);
        pts.push(p.clone().add(binormal.multiplyScalar(side * railOffset)).add(up.multiplyScalar(0.15)));
      }
      const railCurve = new THREE.CatmullRomCurve3(pts, true);
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(railCurve, 300, 0.08, 6, true),
        railMat
      );
      mesh.castShadow = true;
      scene.add(mesh);
    }
    buildRail(-1);
    buildRail(1);

    // Supports
    const supportMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.4, roughness: 0.6 });
    for (let i = 0; i < 40; i++) {
      const t = i / 40;
      const p = curve.getPointAt(t);
      if (p.y < 4) continue;
      const h = p.y;
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.28, h, 8),
        supportMat
      );
      post.position.set(p.x, h / 2, p.z);
      post.castShadow = true;
      scene.add(post);
    }

    // Simple cart frame (visible in peripheral FOV / reflections of structure)
    const cart = new THREE.Group();
    const seat = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.35, 1.4),
      new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.3, roughness: 0.7 })
    );
    seat.position.y = -0.55;
    cart.add(seat);
    scene.add(cart);

    // Ride parameters — continuous loop
    const SPEED = 18; // world units per second along curve
    let distance = 0;
    const clock = new THREE.Clock();
    const lookAhead = 2.5;
    const eyeHeight = 0.85;

    const tmpUp = new THREE.Vector3(0, 1, 0);
    const tmpBinormal = new THREE.Vector3();
    const tmpNormal = new THREE.Vector3();

    function placeOnTrack(dist, outPos, outLook) {
      const t = ((dist % trackLen) + trackLen) % trackLen / trackLen;
      const tLook = ((dist + lookAhead) % trackLen) / trackLen;
      outPos.copy(curve.getPointAt(t));
      outLook.copy(curve.getPointAt(tLook));

      const tangent = curve.getTangentAt(t).normalize();
      tmpBinormal.crossVectors(tangent, tmpUp).normalize();
      if (tmpBinormal.lengthSq() < 1e-6) tmpBinormal.set(1, 0, 0);
      tmpNormal.crossVectors(tmpBinormal, tangent).normalize();

      // Bank slightly into turns
      const bank = tmpBinormal.clone().multiplyScalar(0);
      outPos.add(tmpNormal.multiplyScalar(eyeHeight)).add(bank);
    }

    const camPos = new THREE.Vector3();
    const lookPos = new THREE.Vector3();
    const cartPos = new THREE.Vector3();
    const cartLook = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      distance += SPEED * dt;

      placeOnTrack(distance, camPos, lookPos);
      camera.position.copy(camPos);
      camera.lookAt(lookPos);
      // Keep horizon roughly upright
      camera.up.set(0, 1, 0);

      placeOnTrack(distance - 0.4, cartPos, cartLook);
      cart.position.copy(cartPos).add(new THREE.Vector3(0, -eyeHeight + 0.2, 0));
      cart.lookAt(cartLook);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
