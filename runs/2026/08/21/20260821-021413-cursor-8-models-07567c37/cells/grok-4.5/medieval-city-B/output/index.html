<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living Procedural Medieval City</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c12; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 16px; bottom: 16px; z-index: 2;
      font: 12px/1.45 "Segoe UI", system-ui, sans-serif;
      color: #e8dcc8; background: rgba(18, 14, 10, 0.72);
      border: 1px solid rgba(196, 160, 96, 0.35);
      padding: 10px 14px; border-radius: 6px; pointer-events: none;
      max-width: min(320px, calc(100vw - 32px));
    }
    #hud strong { color: #f0c674; font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Living Medieval City</strong><br />
    Seed <span id="seedLabel">—</span> · drag to orbit · scroll to zoom<br />
    Townsfolk wander · smoke · birds · day cycle
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SEED = (Math.floor(Date.now() / 60000) % 900000) + 100000;
document.getElementById('seedLabel').textContent = String(SEED);

function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const randRange = (a, b) => a + rand() * (b - a);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87a0b8, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
camera.position.set(42, 28, 48);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 12;
controls.maxDistance = 120;
controls.target.set(0, 2, 0);

const hemi = new THREE.HemisphereLight(0xb8d0f0, 0x3a2a18, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d0, 1.35);
sun.position.set(40, 55, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 5;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -70;
sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70;
sun.shadow.camera.bottom = -70;
sun.shadow.bias = -0.0003;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8899bb, 0.25);
fill.position.set(-30, 20, -40);
scene.add(fill);

const ambLamp = new THREE.PointLight(0xffaa55, 0, 18, 2);
ambLamp.position.set(0, 4, 0);
scene.add(ambLamp);

const CITY_R = 38;
const ROAD_W = 3.2;

function makeMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.85,
    metalness: opts.metalness ?? 0.05,
    flatShading: opts.flat ?? false,
  });
}

const mats = {
  grass: makeMat(0x3d6b3a, { roughness: 1 }),
  dirt: makeMat(0x6b5340, { roughness: 1 }),
  cobble: makeMat(0x6e6860, { roughness: 0.95 }),
  stone: makeMat(0x8a8680, { roughness: 0.9 }),
  darkStone: makeMat(0x5a564f, { roughness: 0.88 }),
  plaster: makeMat(0xd8cbb0, { roughness: 0.92 }),
  timber: makeMat(0x5c3a22, { roughness: 0.8 }),
  thatch: makeMat(0x9a7a3a, { roughness: 1 }),
  tile: makeMat(0x7a3a2e, { roughness: 0.75 }),
  slate: makeMat(0x4a5560, { roughness: 0.7 }),
  wood: makeMat(0x7a5530, { roughness: 0.8 }),
  water: new THREE.MeshStandardMaterial({ color: 0x2a6a8a, roughness: 0.15, metalness: 0.35 }),
  cloth: makeMat(0xc44a3a, { roughness: 0.95 }),
  gold: makeMat(0xc9a227, { roughness: 0.4, metalness: 0.6 }),
};

const groundGeo = new THREE.CircleGeometry(CITY_R + 8, 64);
const ground = new THREE.Mesh(groundGeo, mats.grass);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const dirtRing = new THREE.Mesh(
  new THREE.RingGeometry(CITY_R - 1.5, CITY_R + 2.5, 64),
  mats.dirt
);
dirtRing.rotation.x = -Math.PI / 2;
dirtRing.position.y = 0.01;
dirtRing.receiveShadow = true;
scene.add(dirtRing);

function addBox(w, h, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function addCone(r, h, seg, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function addCyl(rt, rb, h, seg, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// --- Roads: radial + ring + market square ---
const roadGroup = new THREE.Group();
scene.add(roadGroup);

function roadStrip(len, width, x, z, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, len), mats.cobble);
  m.rotation.x = -Math.PI / 2;
  m.rotation.z = rotY;
  m.position.set(x, 0.02, z);
  m.receiveShadow = true;
  roadGroup.add(m);
}

for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const len = CITY_R - 2;
  roadStrip(len, ROAD_W, Math.cos(a) * len * 0.5, Math.sin(a) * len * 0.5, -a);
}

for (const r of [12, 24, 34]) {
  const segs = 48;
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2;
    const a1 = ((i + 1) / segs) * Math.PI * 2;
    const mid = (a0 + a1) * 0.5;
    const chord = 2 * r * Math.sin((a1 - a0) * 0.5);
    roadStrip(chord + 0.3, ROAD_W * 0.85, Math.cos(mid) * r, Math.sin(mid) * r, -mid + Math.PI / 2);
  }
}

const plaza = new THREE.Mesh(new THREE.CircleGeometry(7.5, 32), mats.cobble);
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 0.025;
plaza.receiveShadow = true;
scene.add(plaza);

const fountainBase = addCyl(2.2, 2.4, 0.6, 16, mats.stone, 0, 0.35, 0);
addCyl(0.35, 0.4, 1.8, 8, mats.stone, 0, 1.4, 0);
const water = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 0.15, 24), mats.water);
water.position.set(0, 0.72, 0);
scene.add(water);

// --- City wall & gates ---
const wallGroup = new THREE.Group();
scene.add(wallGroup);
const wallR = CITY_R;
const wallSegs = 48;
for (let i = 0; i < wallSegs; i++) {
  const a = (i / wallSegs) * Math.PI * 2;
  if (i % 6 === 0) continue; // gate gaps
  const x = Math.cos(a) * wallR;
  const z = Math.sin(a) * wallR;
  const ang = a + Math.PI / 2;
  const seg = addBox(4.2, 4.2, 1.6, mats.darkStone, x, 2.1, z, wallGroup);
  seg.rotation.y = -ang + Math.PI / 2;
  if (i % 2 === 0) {
    const merlon = addBox(1.1, 1.0, 1.7, mats.stone, x, 4.7, z, wallGroup);
    merlon.rotation.y = seg.rotation.y;
  }
}

for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const x = Math.cos(a) * wallR;
  const z = Math.sin(a) * wallR;
  addCyl(1.6, 1.8, 7.5, 8, mats.darkStone, x, 3.75, z, wallGroup);
  addCone(2.0, 2.2, 8, mats.tile, x, 8.6, z, wallGroup);
}

// --- Keep / castle on north rise ---
const keep = new THREE.Group();
keep.position.set(0, 0, -18);
scene.add(keep);
addBox(14, 8, 12, mats.darkStone, 0, 4, 0, keep);
addBox(16, 1.2, 14, mats.stone, 0, 8.5, 0, keep);
for (const [dx, dz] of [[-6.5, -5.5], [6.5, -5.5], [-6.5, 5.5], [6.5, 5.5]]) {
  addCyl(2.2, 2.4, 12, 8, mats.darkStone, dx, 6, dz, keep);
  addCone(2.8, 3.2, 8, mats.slate, dx, 13.5, dz, keep);
}
addBox(5, 4, 3, mats.stone, 0, 10.5, -2, keep);
addCone(4, 4, 4, mats.slate, 0, 14.5, -2, keep);
addBox(3.2, 4.5, 0.4, mats.timber, 0, 2.2, 6.2, keep);

const bannerPole = addCyl(0.08, 0.08, 4, 6, mats.timber, 0, 12, 6.5, keep);
const banner = new THREE.Mesh(
  new THREE.PlaneGeometry(1.6, 2.2, 4, 6),
  new THREE.MeshStandardMaterial({ color: 0xb83228, side: THREE.DoubleSide, roughness: 0.9 })
);
banner.position.set(0.85, 12.2, 6.5);
banner.geometry.attributes.position.original = Float32Array.from(banner.geometry.attributes.position.array);
keep.add(banner);

// --- Cathedral ---
const cath = new THREE.Group();
cath.position.set(14, 0, 8);
scene.add(cath);
addBox(8, 7, 14, mats.stone, 0, 3.5, 0, cath);
addBox(10, 0.5, 16, mats.slate, 0, 7.2, 0, cath);
const roofL = addBox(5.5, 0.4, 16, mats.slate, -2.5, 9.2, 0, cath);
roofL.rotation.z = 0.45;
const roofR = addBox(5.5, 0.4, 16, mats.slate, 2.5, 9.2, 0, cath);
roofR.rotation.z = -0.45;
addBox(5, 10, 5, mats.stone, 0, 5, -8, cath);
addCone(4.2, 8, 4, mats.slate, 0, 14, -8, cath);
addBox(2.5, 4, 0.35, mats.timber, 0, 2, 7.2, cath);
for (let i = -2; i <= 2; i++) {
  if (i === 0) continue;
  addBox(1.2, 2.2, 0.2, mats.gold, i * 1.6, 3.5, 7.05, cath);
}

// --- Market stalls ---
const stalls = new THREE.Group();
scene.add(stalls);
const stallColors = [0xc44a3a, 0x3a6ac4, 0xd4a017, 0x3a8a4a, 0x8a3a8a];
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2 + 0.2;
  const r = 9.5;
  const g = new THREE.Group();
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  g.rotation.y = -a + Math.PI;
  addBox(2.4, 0.15, 1.6, mats.wood, 0, 1.1, 0, g);
  addBox(0.12, 1.1, 0.12, mats.timber, -1.0, 0.55, -0.6, g);
  addBox(0.12, 1.1, 0.12, mats.timber, 1.0, 0.55, -0.6, g);
  addBox(0.12, 1.1, 0.12, mats.timber, -1.0, 0.55, 0.6, g);
  addBox(0.12, 1.1, 0.12, mats.timber, 1.0, 0.55, 0.6, g);
  const cloth = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 1.8),
    new THREE.MeshStandardMaterial({ color: stallColors[i % stallColors.length], side: THREE.DoubleSide, roughness: 0.95 })
  );
  cloth.rotation.x = -0.85;
  cloth.position.set(0, 1.9, 0);
  g.add(cloth);
  stalls.add(g);
}

// --- Houses (procedural parcels) ---
const cityRoot = new THREE.Group();
scene.add(cityRoot);
const occupied = [];
const chimneys = [];
const smokeParticles = [];

function overlaps(x, z, w, d, pad = 1.2) {
  const hw = w * 0.5 + pad;
  const hd = d * 0.5 + pad;
  for (const o of occupied) {
    if (Math.abs(x - o.x) < hw + o.hw && Math.abs(z - o.z) < hd + o.hd) return true;
  }
  const dist = Math.hypot(x, z);
  if (dist < 9) return true;
  if (dist > CITY_R - 4) return true;
  if (Math.hypot(x, z + 18) < 12) return true;
  if (Math.hypot(x - 14, z - 8) < 10) return true;
  // keep off main roads (approximate)
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const px = x * Math.cos(a) + z * Math.sin(a);
    const py = -x * Math.sin(a) + z * Math.cos(a);
    if (Math.abs(py) < ROAD_W * 0.85 && px > 2 && px < CITY_R - 2) return true;
  }
  for (const rr of [12, 24, 34]) {
    if (Math.abs(dist - rr) < ROAD_W * 0.7) return true;
  }
  return false;
}

function buildHouse(x, z, rot) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  const w = randRange(3.2, 5.5);
  const d = randRange(3.0, 5.0);
  const floors = rand() > 0.55 ? 2 : 1;
  const h = floors * randRange(2.6, 3.2);
  const wallMat = rand() > 0.45 ? mats.plaster : mats.timber;
  const roofMat = pick([mats.thatch, mats.tile, mats.slate]);
  addBox(w, h, d, wallMat, 0, h * 0.5, 0, g);
  // timber framing accents
  if (wallMat === mats.plaster) {
    addBox(w + 0.05, 0.18, d + 0.05, mats.timber, 0, h * 0.33, 0, g);
    if (floors > 1) addBox(w + 0.05, 0.18, d + 0.05, mats.timber, 0, h * 0.66, 0, g);
  }
  // roof
  const roofH = randRange(1.6, 2.6);
  const roof = addBox(w * 1.15, roofH, d * 1.15, roofMat, 0, h + roofH * 0.35, 0, g);
  roof.scale.set(1, 0.55, 1);
  // door
  addBox(0.9, 1.6, 0.15, mats.wood, 0, 0.8, d * 0.5 + 0.05, g);
  // windows
  const winMat = makeMat(0x1a2030, { roughness: 0.3, metalness: 0.2 });
  addBox(0.7, 0.9, 0.1, winMat, -w * 0.28, h * 0.55, d * 0.5 + 0.04, g);
  addBox(0.7, 0.9, 0.1, winMat, w * 0.28, h * 0.55, d * 0.5 + 0.04, g);
  if (floors > 1) {
    addBox(0.7, 0.8, 0.1, winMat, 0, h * 0.78, d * 0.5 + 0.04, g);
  }
  // chimney
  const cx = randRange(-w * 0.25, w * 0.25);
  const chim = addBox(0.55, 1.4, 0.55, mats.darkStone, cx, h + 1.5, -d * 0.15, g);
  chimneys.push({ mesh: chim, world: new THREE.Vector3() });
  cityRoot.add(g);
  occupied.push({ x, z, hw: w * 0.5, hd: d * 0.5 });
}

let attempts = 0;
while (occupied.length < 55 && attempts < 800) {
  attempts++;
  const a = rand() * Math.PI * 2;
  const r = randRange(10, CITY_R - 5);
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;
  const w = 5, d = 5;
  if (overlaps(x, z, w, d)) continue;
  buildHouse(x, z, a + Math.PI + randRange(-0.3, 0.3));
}

// trees outside wall
for (let i = 0; i < 40; i++) {
  const a = rand() * Math.PI * 2;
  const r = randRange(CITY_R + 4, CITY_R + 14);
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;
  addCyl(0.25, 0.35, 1.8, 6, mats.timber, x, 0.9, z);
  const foliage = addCone(randRange(1.2, 2.2), randRange(2.5, 4), 7, mats.grass, x, 3.2, z);
  foliage.material = makeMat(pick([0x2f5e2c, 0x3d6b3a, 0x4a7a40]), { roughness: 1 });
}

// smoke system
const smokeGeo = new THREE.SphereGeometry(0.35, 6, 6);
const smokeMat = new THREE.MeshStandardMaterial({
  color: 0x999999,
  transparent: true,
  opacity: 0.35,
  roughness: 1,
  depthWrite: false,
});
for (let i = 0; i < 80; i++) {
  const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
  p.visible = false;
  p.userData = { life: 0, max: 1, vx: 0, vy: 0, vz: 0 };
  scene.add(p);
  smokeParticles.push(p);
}
let smokeCursor = 0;
function emitSmoke(x, y, z) {
  const p = smokeParticles[smokeCursor % smokeParticles.length];
  smokeCursor++;
  p.visible = true;
  p.position.set(x + randRange(-0.1, 0.1), y, z + randRange(-0.1, 0.1));
  p.scale.setScalar(randRange(0.6, 1.1));
  p.material.opacity = 0.4;
  p.userData.life = 0;
  p.userData.max = randRange(2.5, 4.5);
  p.userData.vx = randRange(-0.15, 0.15);
  p.userData.vy = randRange(0.4, 0.7);
  p.userData.vz = randRange(-0.15, 0.15);
}

// --- Townsfolk ---
const people = [];
function makePerson(hue) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.22, 0.55, 4, 8),
    makeMat(new THREE.Color().setHSL(hue, 0.45, 0.4).getHex(), { roughness: 0.9 })
  );
  body.position.y = 0.85;
  body.castShadow = true;
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), makeMat(0xc4a07a));
  head.position.y = 1.45;
  head.castShadow = true;
  g.add(head);
  return g;
}

function roadSample() {
  if (rand() < 0.35) {
    const a = rand() * Math.PI * 2;
    const r = 9.5 + randRange(-0.8, 0.8);
    return new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
  }
  if (rand() < 0.5) {
    const a = (Math.floor(rand() * 8) / 8) * Math.PI * 2;
    const t = randRange(4, CITY_R - 3);
    return new THREE.Vector3(Math.cos(a) * t, 0, Math.sin(a) * t);
  }
  const ring = pick([12, 24, 34]);
  const a = rand() * Math.PI * 2;
  return new THREE.Vector3(Math.cos(a) * ring, 0, Math.sin(a) * ring);
}

for (let i = 0; i < 28; i++) {
  const p = makePerson(rand());
  const start = roadSample();
  p.position.copy(start);
  p.position.y = 0;
  scene.add(p);
  people.push({
    mesh: p,
    target: roadSample(),
    speed: randRange(0.9, 1.8),
    phase: rand() * Math.PI * 2,
  });
}

// --- Birds ---
const birds = [];
const birdGeo = new THREE.ConeGeometry(0.15, 0.5, 3);
for (let i = 0; i < 14; i++) {
  const b = new THREE.Mesh(birdGeo, makeMat(0x222228));
  b.rotation.x = Math.PI / 2;
  scene.add(b);
  birds.push({
    mesh: b,
    radius: randRange(18, 36),
    height: randRange(12, 22),
    speed: randRange(0.3, 0.7),
    offset: rand() * Math.PI * 2,
  });
}

// --- Torches near gates ---
const torches = [];
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const x = Math.cos(a) * (wallR - 1.5);
  const z = Math.sin(a) * (wallR - 1.5);
  addCyl(0.1, 0.12, 1.8, 6, mats.timber, x, 0.9, z);
  const light = new THREE.PointLight(0xff8844, 0, 12, 2);
  light.position.set(x, 2.2, z);
  scene.add(light);
  const flame = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xffaa44 })
  );
  flame.position.copy(light.position);
  scene.add(flame);
  torches.push({ light, flame });
}

// sky
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x6ea8d8) },
      bottomColor: { value: new THREE.Color(0xd8e8f5) },
      offset: { value: 8 },
      exponent: { value: 0.6 },
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld + vec3(0.0, offset, 0.0)).y;
        float t = max(pow(max(h, 0.0), exponent), 0.0);
        gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);
      }
    `,
  })
);
scene.add(sky);

const clock = new THREE.Clock();
let smokeTimer = 0;
const started = performance.now();

function updateBanner(t) {
  const pos = banner.geometry.attributes.position;
  const orig = banner.geometry.attributes.position.original;
  for (let i = 0; i < pos.count; i++) {
    const x = orig[i * 3];
    const y = orig[i * 3 + 1];
    const wave = Math.sin(t * 3 + y * 4 + x) * 0.12 * Math.max(0, x);
    pos.setXYZ(i, x + wave, y, orig[i * 3 + 2] + Math.sin(t * 2.5 + y * 3) * 0.08 * Math.max(0, x));
  }
  pos.needsUpdate = true;
  banner.geometry.computeVertexNormals();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // day cycle
  const day = (t * 0.02) % (Math.PI * 2);
  const sunH = Math.sin(day);
  const dayAmt = THREE.MathUtils.clamp(sunH * 0.5 + 0.5, 0.08, 1);
  sun.intensity = 0.25 + dayAmt * 1.2;
  hemi.intensity = 0.15 + dayAmt * 0.5;
  sun.position.set(Math.cos(day) * 55, Math.max(sunH, 0.05) * 60, Math.sin(day) * 35);
  const skyTop = new THREE.Color().setHSL(0.58, 0.45, 0.15 + dayAmt * 0.4);
  const skyBot = new THREE.Color().setHSL(0.1, 0.25, 0.2 + dayAmt * 0.55);
  sky.material.uniforms.topColor.value.copy(skyTop);
  sky.material.uniforms.bottomColor.value.copy(skyBot);
  scene.fog.color.copy(skyBot);
  renderer.setClearColor(skyBot);
  const night = 1 - dayAmt;
  ambLamp.intensity = night * 1.2;
  ambLamp.position.set(0, 3, 0);
  for (const tr of torches) {
    tr.light.intensity = night * (1.4 + Math.sin(t * 8 + tr.light.position.x) * 0.3);
    tr.flame.scale.setScalar(0.7 + Math.sin(t * 12 + tr.flame.position.z) * 0.2);
    tr.flame.visible = night > 0.25;
  }

  updateBanner(t);
  water.position.y = 0.72 + Math.sin(t * 1.5) * 0.03;

  // people
  for (const person of people) {
    const m = person.mesh;
    const to = person.target.clone().sub(m.position);
    to.y = 0;
    const dist = to.length();
    if (dist < 0.4) {
      person.target = roadSample();
    } else {
      to.normalize();
      m.position.addScaledVector(to, person.speed * dt);
      m.rotation.y = Math.atan2(to.x, to.z);
      m.position.y = Math.abs(Math.sin(t * person.speed * 4 + person.phase)) * 0.06;
    }
  }

  // birds
  for (const b of birds) {
    const a = t * b.speed + b.offset;
    b.mesh.position.set(
      Math.cos(a) * b.radius,
      b.height + Math.sin(a * 2) * 1.2,
      Math.sin(a) * b.radius
    );
    b.mesh.rotation.y = -a + Math.PI / 2;
    b.mesh.rotation.z = Math.sin(t * 8 + b.offset) * 0.4;
  }

  // smoke
  smokeTimer += dt;
  if (smokeTimer > 0.12) {
    smokeTimer = 0;
    for (const c of chimneys) {
      if (rand() > 0.55) continue;
      c.mesh.getWorldPosition(c.world);
      emitSmoke(c.world.x, c.world.y + 0.5, c.world.z);
    }
  }
  for (const p of smokeParticles) {
    if (!p.visible) continue;
    p.userData.life += dt;
    const u = p.userData.life / p.userData.max;
    if (u >= 1) {
      p.visible = false;
      continue;
    }
    p.position.x += p.userData.vx * dt;
    p.position.y += p.userData.vy * dt;
    p.position.z += p.userData.vz * dt;
    p.scale.setScalar(0.6 + u * 1.8);
    p.material.opacity = 0.4 * (1 - u);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

console.info(`Medieval city seed=${SEED} houses=${occupied.length} boot=${(performance.now() - started).toFixed(0)}ms`);
  </script>
</body>
