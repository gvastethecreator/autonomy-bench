<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stride — Procedural Biped</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --ink: #0e1218;
      --fog: #c8d4e0;
      --accent: #e8a05c;
      --mint: #7ec8a3;
      --panel: rgba(14, 18, 24, 0.72);
      --line: rgba(200, 212, 224, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--fog);
      font-family: 'Syne', system-ui, sans-serif;
    }

    #canvas-host {
      position: fixed;
      inset: 0;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, transparent 40%, rgba(8, 10, 14, 0.55) 100%),
        linear-gradient(to top, rgba(8, 10, 14, 0.5) 0%, transparent 28%);
      z-index: 2;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 1.4rem 1.75rem 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .brand h1 {
      font-size: clamp(1.6rem, 3.2vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #f2f6fa;
    }

    .brand h1 span {
      color: var(--accent);
    }

    .brand p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    .status-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 2px;
      pointer-events: none;
    }

    .status-pill .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      margin-right: 0.45rem;
      box-shadow: 0 0 8px var(--mint);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    aside {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      z-index: 5;
      width: min(320px, calc(100vw - 3rem));
      padding: 1.1rem 1.15rem 1.2rem;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      border-radius: 4px;
      pointer-events: auto;
    }

    aside h2 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    aside .hint {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      line-height: 1.45;
      opacity: 0.6;
      margin-bottom: 1rem;
    }

    .control {
      display: grid;
      grid-template-columns: 72px 1fr 40px;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.65rem;
    }

    .control label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .control output {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      text-align: right;
      color: var(--accent);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: rgba(200, 212, 224, 0.22);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }

    button {
      flex: 1;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      background: rgba(232, 160, 92, 0.12);
      color: var(--fog);
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background: rgba(232, 160, 92, 0.28);
      border-color: rgba(232, 160, 92, 0.55);
      color: #fff;
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--ink);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 5;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      opacity: 0.45;
      text-align: right;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      header { padding: 1rem 1rem 0; }
      aside { left: 1rem; right: 1rem; width: auto; bottom: 1rem; }
      footer { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-host"></div>
  <div class="veil"></div>

  <header>
    <div class="brand">
      <h1>Stride<span>.</span></h1>
      <p>Procedural biped locomotion</p>
    </div>
    <div class="status-pill"><span class="dot"></span><span id="phase-label">WALK CYCLE</span></div>
  </header>

  <aside>
    <h2>Gait controls</h2>
    <p class="hint">Drag to orbit · Scroll to zoom · Click canvas to focus</p>

    <div class="control">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0.2" max="2.4" step="0.05" value="1.0" />
      <output id="speed-out">1.00×</output>
    </div>
    <div class="control">
      <label for="stride">Stride</label>
      <input id="stride" type="range" min="0.4" max="1.6" step="0.05" value="1.0" />
      <output id="stride-out">1.00</output>
    </div>
    <div class="control">
      <label for="bounce">Bounce</label>
      <input id="bounce" type="range" min="0" max="1.5" step="0.05" value="0.85" />
      <output id="bounce-out">0.85</output>
    </div>

    <div class="row">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-follow" type="button" class="active">Follow</button>
      <button id="btn-reset" type="button">Reset</button>
    </div>
  </aside>

  <footer>
    THREE.JS · PROCEDURAL IK GAIT<br />
    NO KEYFRAMES
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const started = performance.now();

    // ── Scene setup ──────────────────────────────────────────────
    const host = document.getElementById('canvas-host');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2430);
    scene.fog = new THREE.FogExp2(0x1a2430, 0.028);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(4.2, 2.8, 5.6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.2;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(0, 1.1, 0);

    // ── Lighting & environment ───────────────────────────────────
    const hemi = new THREE.HemisphereLight(0xb8d0e8, 0x3a2a18, 0.85);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe2c0, 2.1);
    sun.position.set(6, 12, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 40;
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -12;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x6aa8ff, 0.55);
    rim.position.set(-5, 3, -6);
    scene.add(rim);

    const fill = new THREE.PointLight(0xe8a05c, 0.6, 18, 2);
    fill.position.set(-2, 2.5, 3);
    scene.add(fill);

    // Ground
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x2a3544,
      roughness: 0.92,
      metalness: 0.05,
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(28, 64), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Subtle ring markings
    const ringGeo = new THREE.RingGeometry(3.2, 3.28, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x4a5a6a, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    const ring2 = ring.clone();
    ring2.scale.setScalar(1.55);
    ring2.material = ringMat.clone();
    ring2.material.opacity = 0.2;
    scene.add(ring2);

    // Soft particles / dust motes
    const moteCount = 80;
    const motePos = new Float32Array(moteCount * 3);
    for (let i = 0; i < moteCount; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * 18;
      motePos[i * 3 + 1] = Math.random() * 5 + 0.3;
      motePos[i * 3 + 2] = (Math.random() - 0.5) * 18;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const motes = new THREE.Points(
      moteGeo,
      new THREE.PointsMaterial({ color: 0xc8d8e8, size: 0.04, transparent: true, opacity: 0.35, depthWrite: false })
    );
    scene.add(motes);

    // ── Materials ────────────────────────────────────────────────
    const skin = new THREE.MeshStandardMaterial({
      color: 0xd4a574,
      roughness: 0.55,
      metalness: 0.08,
    });
    const skinDark = new THREE.MeshStandardMaterial({
      color: 0xb8845c,
      roughness: 0.6,
      metalness: 0.06,
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: 0xe8a05c,
      roughness: 0.35,
      metalness: 0.25,
      emissive: 0x3a2010,
      emissiveIntensity: 0.25,
    });
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0x1a1e28,
      roughness: 0.2,
      metalness: 0.4,
    });
    const glowMat = new THREE.MeshStandardMaterial({
      color: 0x7ec8a3,
      roughness: 0.3,
      metalness: 0.2,
      emissive: 0x2a6048,
      emissiveIntensity: 0.6,
    });

    function part(geo, mat, cast = true) {
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = cast;
      m.receiveShadow = true;
      return m;
    }

    // ── Biped hierarchy ──────────────────────────────────────────
    const biped = new THREE.Group();
    biped.position.set(0, 0, 0);
    scene.add(biped);

    // Hip / pelvis
    const hips = new THREE.Group();
    hips.position.y = 1.05;
    biped.add(hips);

    const pelvis = part(new THREE.BoxGeometry(0.42, 0.18, 0.28), skinDark);
    hips.add(pelvis);

    // Torso
    const torsoPivot = new THREE.Group();
    torsoPivot.position.y = 0.1;
    hips.add(torsoPivot);

    const chest = part(new THREE.CapsuleGeometry(0.22, 0.38, 6, 12), skin);
    chest.position.y = 0.38;
    torsoPivot.add(chest);

    const collar = part(new THREE.TorusGeometry(0.2, 0.035, 10, 24), accentMat);
    collar.rotation.x = Math.PI / 2;
    collar.position.y = 0.58;
    torsoPivot.add(collar);

    // Head
    const neck = part(new THREE.CylinderGeometry(0.07, 0.09, 0.14, 10), skinDark);
    neck.position.y = 0.68;
    torsoPivot.add(neck);

    const head = new THREE.Group();
    head.position.y = 0.9;
    torsoPivot.add(head);

    const skull = part(new THREE.SphereGeometry(0.2, 24, 18), skin);
    skull.scale.set(1, 1.08, 0.95);
    head.add(skull);

    const snout = part(new THREE.CapsuleGeometry(0.07, 0.08, 4, 10), skinDark);
    snout.rotation.z = Math.PI / 2;
    snout.position.set(0, -0.02, 0.16);
    snout.scale.set(0.7, 1, 1);
    head.add(snout);

    const eyeL = part(new THREE.SphereGeometry(0.045, 12, 10), eyeMat, false);
    eyeL.position.set(-0.08, 0.04, 0.15);
    head.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.08;
    head.add(eyeR);

    const pupilL = part(new THREE.SphereGeometry(0.018, 8, 8), glowMat, false);
    pupilL.position.set(-0.08, 0.045, 0.185);
    head.add(pupilL);
    const pupilR = pupilL.clone();
    pupilR.position.x = 0.08;
    head.add(pupilR);

    const antenna = part(new THREE.CylinderGeometry(0.012, 0.02, 0.22, 8), accentMat);
    antenna.position.set(0, 0.28, -0.02);
    antenna.rotation.x = 0.15;
    head.add(antenna);
    const tip = part(new THREE.SphereGeometry(0.04, 12, 10), glowMat);
    tip.position.set(0, 0.4, -0.04);
    head.add(tip);

    // Arms
    function makeArm(side) {
      const root = new THREE.Group();
      root.position.set(side * 0.28, 0.52, 0);
      torsoPivot.add(root);

      const shoulder = part(new THREE.SphereGeometry(0.08, 12, 10), skinDark);
      root.add(shoulder);

      const upper = new THREE.Group();
      upper.position.y = -0.02;
      root.add(upper);

      const upperMesh = part(new THREE.CapsuleGeometry(0.055, 0.22, 4, 10), skin);
      upperMesh.position.y = -0.14;
      upper.add(upperMesh);

      const elbow = new THREE.Group();
      elbow.position.y = -0.28;
      upper.add(elbow);

      const elbowBall = part(new THREE.SphereGeometry(0.05, 10, 8), skinDark);
      elbow.add(elbowBall);

      const forearm = part(new THREE.CapsuleGeometry(0.045, 0.2, 4, 10), skin);
      forearm.position.y = -0.14;
      elbow.add(forearm);

      const hand = part(new THREE.SphereGeometry(0.055, 10, 8), accentMat);
      hand.position.y = -0.28;
      elbow.add(hand);

      return { root, upper, elbow };
    }

    const armL = makeArm(-1);
    const armR = makeArm(1);

    // Legs
    function makeLeg(side) {
      const root = new THREE.Group();
      root.position.set(side * 0.12, 0, 0);
      hips.add(root);

      const hipBall = part(new THREE.SphereGeometry(0.09, 12, 10), skinDark);
      root.add(hipBall);

      const thigh = new THREE.Group();
      root.add(thigh);

      const thighMesh = part(new THREE.CapsuleGeometry(0.08, 0.32, 5, 12), skin);
      thighMesh.position.y = -0.22;
      thigh.add(thighMesh);

      const knee = new THREE.Group();
      knee.position.y = -0.42;
      thigh.add(knee);

      const kneeBall = part(new THREE.SphereGeometry(0.065, 10, 8), skinDark);
      knee.add(kneeBall);

      const shin = part(new THREE.CapsuleGeometry(0.06, 0.3, 5, 12), skin);
      shin.position.y = -0.2;
      knee.add(shin);

      const ankle = new THREE.Group();
      ankle.position.y = -0.4;
      knee.add(ankle);

      const foot = part(new THREE.BoxGeometry(0.12, 0.06, 0.22), accentMat);
      foot.position.set(0, -0.02, 0.04);
      ankle.add(foot);

      const toe = part(new THREE.BoxGeometry(0.1, 0.04, 0.08), skinDark);
      toe.position.set(0, -0.01, 0.16);
      ankle.add(toe);

      return { root, thigh, knee, ankle, foot };
    }

    const legL = makeLeg(-1);
    const legR = makeLeg(1);

    // Footstep dust bursts (simple pooled sprites)
    const dustPool = [];
    const dustGeo = new THREE.SphereGeometry(0.08, 6, 6);
    const dustMat = new THREE.MeshBasicMaterial({ color: 0xa8b8c8, transparent: true, opacity: 0.4 });
    for (let i = 0; i < 12; i++) {
      const d = new THREE.Mesh(dustGeo, dustMat.clone());
      d.visible = false;
      scene.add(d);
      dustPool.push({ mesh: d, life: 0, max: 0.6, vx: 0, vy: 0, vz: 0 });
    }

    function spawnDust(x, z) {
      for (let i = 0; i < 3; i++) {
        const slot = dustPool.find((d) => d.life <= 0);
        if (!slot) break;
        slot.life = slot.max = 0.45 + Math.random() * 0.25;
        slot.vx = (Math.random() - 0.5) * 0.6;
        slot.vy = 0.3 + Math.random() * 0.4;
        slot.vz = (Math.random() - 0.5) * 0.6;
        slot.mesh.visible = true;
        slot.mesh.position.set(x + (Math.random() - 0.5) * 0.1, 0.05, z + (Math.random() - 0.5) * 0.1);
        slot.mesh.scale.setScalar(0.6 + Math.random() * 0.5);
        slot.mesh.material.opacity = 0.45;
      }
    }

    // ── Procedural gait ──────────────────────────────────────────
    const params = {
      speed: 1.0,
      stride: 1.0,
      bounce: 0.85,
      paused: false,
      follow: true,
    };

    let phase = 0;
    let worldX = 0;
    let worldZ = 0;
    let facing = 0;
    let pathAngle = 0;
    let lastLeftDown = false;
    let lastRightDown = false;

    const THIGH_LEN = 0.42;
    const SHIN_LEN = 0.4;

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function easeContact(t) {
      // Smoothstep contact curve
      const x = clamp(t, 0, 1);
      return x * x * (3 - 2 * x);
    }

    /**
     * Two-bone IK: returns thigh & knee pitch (radians) for a target foot offset
     * relative to hip, in the sagittal plane (x ignored for simplicity; use local z,y).
     */
    function solveLeg(hipWorldY, targetLocalY, targetLocalZ) {
      let dx = targetLocalZ;
      let dy = targetLocalY - 0; // relative to hip local
      let dist = Math.hypot(dx, dy);
      const maxReach = THIGH_LEN + SHIN_LEN - 0.02;
      const minReach = Math.abs(THIGH_LEN - SHIN_LEN) + 0.02;
      dist = clamp(dist, minReach, maxReach);

      const cosKnee = clamp(
        (THIGH_LEN * THIGH_LEN + SHIN_LEN * SHIN_LEN - dist * dist) / (2 * THIGH_LEN * SHIN_LEN),
        -1,
        1
      );
      const kneeAngle = Math.PI - Math.acos(cosKnee); // interior bend forward

      const cosHip = clamp(
        (THIGH_LEN * THIGH_LEN + dist * dist - SHIN_LEN * SHIN_LEN) / (2 * THIGH_LEN * dist),
        -1,
        1
      );
      const hipOffset = Math.acos(cosHip);
      const targetAngle = Math.atan2(dx, -dy); // 0 = straight down
      const thighAngle = targetAngle - hipOffset;

      return { thigh: thighAngle, knee: kneeAngle };
    }

    function footTarget(legPhase, strideAmp, liftAmp) {
      // legPhase 0..1; stance first half-ish with continuous sinusoid
      const swing = Math.sin(legPhase * Math.PI * 2);
      const vertical = Math.max(0, Math.sin(legPhase * Math.PI * 2)); // lift on forward swing
      // More lift only during swing (when sin > 0 going forward)
      const liftGate = Math.max(0, Math.sin(legPhase * Math.PI * 2));
      const z = swing * 0.38 * strideAmp;
      const y = -1.05 + liftGate * 0.22 * liftAmp;
      return { y, z };
    }

    function updateGait(dt) {
      if (!params.paused) {
        const cadence = 2.35 * params.speed;
        phase += dt * cadence;
        pathAngle += dt * 0.22 * params.speed;
      }

      // Walk a gentle figure path
      const pathR = 3.4;
      worldX = Math.sin(pathAngle) * pathR;
      worldZ = Math.sin(pathAngle * 2) * pathR * 0.45;
      facing = Math.atan2(
        Math.cos(pathAngle) * pathR,
        Math.cos(pathAngle * 2) * pathR * 0.45 * 2
      );

      biped.position.x = worldX;
      biped.position.z = worldZ;
      biped.rotation.y = facing;

      const strideAmp = params.stride;
      const bounceAmp = params.bounce;

      // Hip bob & sway
      const bob = Math.abs(Math.sin(phase * Math.PI * 2)) * 0.045 * bounceAmp;
      const sway = Math.sin(phase * Math.PI * 2) * 0.035;
      hips.position.y = 1.05 + bob;
      hips.position.x = sway;
      hips.rotation.z = -sway * 1.2;
      hips.rotation.x = Math.sin(phase * Math.PI * 2) * 0.04 * bounceAmp;

      // Torso counter-rotate
      torsoPivot.rotation.y = Math.sin(phase * Math.PI * 2) * 0.12;
      torsoPivot.rotation.z = sway * 0.5;
      chest.rotation.x = Math.sin(phase * Math.PI * 2 + 0.4) * 0.05;

      // Head look / bob
      head.rotation.y = Math.sin(phase * Math.PI * 2 + 0.6) * -0.1;
      head.rotation.x = Math.sin(phase * Math.PI) * 0.04;
      tip.position.y = 0.4 + Math.sin(phase * Math.PI * 4) * 0.015;

      // Legs — opposite phase
      const pL = phase;
      const pR = phase + 0.5;

      const tL = footTarget(pL, strideAmp, bounceAmp);
      const tR = footTarget(pR, strideAmp, bounceAmp);

      const ikL = solveLeg(0, tL.y, tL.z);
      const ikR = solveLeg(0, tR.y, tR.z);

      legL.thigh.rotation.x = ikL.thigh;
      legL.knee.rotation.x = ikL.knee;
      legR.thigh.rotation.x = ikR.thigh;
      legR.knee.rotation.x = ikR.knee;

      // Foot plant angle
      const plantL = Math.cos(pL * Math.PI * 2);
      const plantR = Math.cos(pR * Math.PI * 2);
      legL.ankle.rotation.x = clamp(-ikL.thigh - ikL.knee + plantL * 0.25, -0.6, 0.5);
      legR.ankle.rotation.x = clamp(-ikR.thigh - ikR.knee + plantR * 0.25, -0.6, 0.5);

      // Arms swing opposite to legs
      const armSwing = 0.55 * strideAmp;
      armL.upper.rotation.x = Math.sin(pR * Math.PI * 2) * armSwing;
      armR.upper.rotation.x = Math.sin(pL * Math.PI * 2) * armSwing;
      armL.elbow.rotation.x = -0.35 - Math.max(0, Math.sin(pR * Math.PI * 2)) * 0.45;
      armR.elbow.rotation.x = -0.35 - Math.max(0, Math.sin(pL * Math.PI * 2)) * 0.45;
      armL.root.rotation.z = 0.12;
      armR.root.rotation.z = -0.12;

      // Footfall detection (when foot near ground at end of swing)
      const leftDown = tL.y < -1.0 && Math.sin(pL * Math.PI * 2) < 0 && Math.cos(pL * Math.PI * 2) > 0.85;
      const rightDown = tR.y < -1.0 && Math.sin(pR * Math.PI * 2) < 0 && Math.cos(pR * Math.PI * 2) > 0.85;

      if (leftDown && !lastLeftDown) {
        const wx = worldX + Math.sin(facing) * tL.z * 0.15 - Math.cos(facing) * 0.12;
        const wz = worldZ + Math.cos(facing) * tL.z * 0.15 - Math.sin(facing) * 0.12;
        spawnDust(biped.position.x - Math.cos(facing) * 0.12, biped.position.z - Math.sin(facing) * 0.12);
      }
      if (rightDown && !lastRightDown) {
        spawnDust(biped.position.x + Math.cos(facing) * 0.12, biped.position.z + Math.sin(facing) * 0.12);
      }
      lastLeftDown = leftDown;
      lastRightDown = rightDown;

      // Phase label
      const cycle = ((phase % 1) + 1) % 1;
      let label = 'WALK CYCLE';
      if (params.paused) label = 'PAUSED';
      else if (cycle < 0.25) label = 'LEFT SWING';
      else if (cycle < 0.5) label = 'LEFT PLANT';
      else if (cycle < 0.75) label = 'RIGHT SWING';
      else label = 'RIGHT PLANT';
      document.getElementById('phase-label').textContent = label;
    }

    function updateDust(dt) {
      for (const d of dustPool) {
        if (d.life <= 0) continue;
        d.life -= dt;
        d.mesh.position.x += d.vx * dt;
        d.mesh.position.y += d.vy * dt;
        d.mesh.position.z += d.vz * dt;
        d.vy -= 0.8 * dt;
        const t = d.life / d.max;
        d.mesh.material.opacity = t * 0.4;
        d.mesh.scale.multiplyScalar(1 + dt * 1.2);
        if (d.life <= 0) d.mesh.visible = false;
      }
    }

    // ── UI wiring ────────────────────────────────────────────────
    const speedEl = document.getElementById('speed');
    const strideEl = document.getElementById('stride');
    const bounceEl = document.getElementById('bounce');
    const speedOut = document.getElementById('speed-out');
    const strideOut = document.getElementById('stride-out');
    const bounceOut = document.getElementById('bounce-out');
    const btnPause = document.getElementById('btn-pause');
    const btnFollow = document.getElementById('btn-follow');
    const btnReset = document.getElementById('btn-reset');

    speedEl.addEventListener('input', () => {
      params.speed = parseFloat(speedEl.value);
      speedOut.textContent = params.speed.toFixed(2) + '×';
    });
    strideEl.addEventListener('input', () => {
      params.stride = parseFloat(strideEl.value);
      strideOut.textContent = params.stride.toFixed(2);
    });
    bounceEl.addEventListener('input', () => {
      params.bounce = parseFloat(bounceEl.value);
      bounceOut.textContent = params.bounce.toFixed(2);
    });

    btnPause.addEventListener('click', () => {
      params.paused = !params.paused;
      btnPause.textContent = params.paused ? 'Play' : 'Pause';
      btnPause.classList.toggle('active', params.paused);
    });

    btnFollow.addEventListener('click', () => {
      params.follow = !params.follow;
      btnFollow.classList.toggle('active', params.follow);
    });

    btnReset.addEventListener('click', () => {
      phase = 0;
      pathAngle = 0;
      params.speed = 1;
      params.stride = 1;
      params.bounce = 0.85;
      params.paused = false;
      speedEl.value = 1;
      strideEl.value = 1;
      bounceEl.value = 0.85;
      speedOut.textContent = '1.00×';
      strideOut.textContent = '1.00';
      bounceOut.textContent = '0.85';
      btnPause.textContent = 'Pause';
      btnPause.classList.remove('active');
      camera.position.set(4.2, 2.8, 5.6);
      controls.target.set(0, 1.1, 0);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ──────────────────────────────────────────────
    const clock = new THREE.Clock();

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.05);

      updateGait(dt);
      updateDust(dt);

      motes.rotation.y += dt * 0.02;

      if (params.follow) {
        const ideal = new THREE.Vector3(
          biped.position.x + Math.sin(facing + 0.9) * 4.5,
          2.6,
          biped.position.z + Math.cos(facing + 0.9) * 4.5
        );
        camera.position.lerp(ideal, 1 - Math.exp(-2.2 * dt));
        controls.target.lerp(
          new THREE.Vector3(biped.position.x, 1.15 + bobSafe(), biped.position.z),
          1 - Math.exp(-3 * dt)
        );
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function bobSafe() {
      return Math.abs(Math.sin(phase * Math.PI * 2)) * 0.04 * params.bounce;
    }

    frame();

    // Warm intro: gentle camera settle already handled by follow
    console.info('Stride ready in', Math.round(performance.now() - started), 'ms');
  </script>
</body>
</html>
