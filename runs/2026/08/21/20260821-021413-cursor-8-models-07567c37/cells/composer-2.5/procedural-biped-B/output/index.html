<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Biped Walker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      color: #c8d6e5;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div id="hud">Procedural biped · drag to orbit · scroll to zoom</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);
    scene.fog = new THREE.Fog(0x0a0e14, 12, 40);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(4.5, 3.2, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.minDistance = 3;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    scene.add(new THREE.AmbientLight(0x445566, 0.55));
    const sun = new THREE.DirectionalLight(0xfff0dd, 1.35);
    sun.position.set(5, 10, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 30;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x6aa8ff, 0.35);
    rim.position.set(-4, 3, -6);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(18, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2430, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(18, 36, 0x2a3a4a, 0x182028);
    grid.position.y = 0.001;
    scene.add(grid);

    const matBody = new THREE.MeshStandardMaterial({ color: 0x4ecdc4, roughness: 0.55, metalness: 0.15 });
    const matJoint = new THREE.MeshStandardMaterial({ color: 0x2d8a82, roughness: 0.45, metalness: 0.2 });
    const matHead = new THREE.MeshStandardMaterial({ color: 0xffe066, roughness: 0.4, metalness: 0.1 });
    const matEye = new THREE.MeshStandardMaterial({ color: 0x111820, roughness: 0.2, metalness: 0.0, emissive: 0x000000 });
    const matFoot = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.85, metalness: 0.05 });

    function limb(radiusTop, radiusBottom, height, material) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 10), material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function joint(radius, material) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 12, 10), material);
      mesh.castShadow = true;
      return mesh;
    }

    const biped = new THREE.Group();
    scene.add(biped);

    const hips = new THREE.Group();
    hips.position.y = 1.05;
    biped.add(hips);

    const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.22, 0.32), matBody);
    pelvis.castShadow = true;
    hips.add(pelvis);

    const torsoPivot = new THREE.Group();
    torsoPivot.position.y = 0.18;
    hips.add(torsoPivot);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.36), matBody);
    torso.position.y = 0.36;
    torso.castShadow = true;
    torsoPivot.add(torso);

    const chest = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.28, 0.34), matBody);
    chest.position.y = 0.62;
    chest.castShadow = true;
    torsoPivot.add(chest);

    const neck = limb(0.09, 0.11, 0.14, matJoint);
    neck.position.y = 0.86;
    torsoPivot.add(neck);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 14), matHead);
    head.position.y = 1.02;
    head.castShadow = true;
    torsoPivot.add(head);

    const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
    const eyeL = new THREE.Mesh(eyeGeo, matEye);
    eyeL.position.set(-0.08, 1.04, 0.17);
    torsoPivot.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.08;
    torsoPivot.add(eyeR);

    function makeLeg(side) {
      const root = new THREE.Group();
      root.position.set(side * 0.16, -0.05, 0);
      hips.add(root);

      const hipJoint = joint(0.11, matJoint);
      root.add(hipJoint);

      const upper = limb(0.1, 0.09, 0.42, matBody);
      upper.position.y = -0.21;
      root.add(upper);

      const kneePivot = new THREE.Group();
      kneePivot.position.y = -0.42;
      root.add(kneePivot);

      const knee = joint(0.09, matJoint);
      kneePivot.add(knee);

      const lower = limb(0.08, 0.07, 0.4, matBody);
      lower.position.y = -0.2;
      kneePivot.add(lower);

      const footPivot = new THREE.Group();
      footPivot.position.y = -0.4;
      kneePivot.add(footPivot);

      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.32), matFoot);
      foot.position.set(0, -0.04, 0.06);
      foot.castShadow = true;
      footPivot.add(foot);

      return { root, kneePivot, footPivot };
    }

    function makeArm(side) {
      const root = new THREE.Group();
      root.position.set(side * 0.38, 0.58, 0);
      torsoPivot.add(root);

      const shoulder = joint(0.09, matJoint);
      root.add(shoulder);

      const upper = limb(0.07, 0.06, 0.34, matBody);
      upper.position.y = -0.17;
      root.add(upper);

      const elbowPivot = new THREE.Group();
      elbowPivot.position.y = -0.34;
      root.add(elbowPivot);

      const elbow = joint(0.07, matJoint);
      elbowPivot.add(elbow);

      const lower = limb(0.06, 0.05, 0.3, matBody);
      lower.position.y = -0.15;
      elbowPivot.add(lower);

      return { root, elbowPivot };
    }

    const legL = makeLeg(-1);
    const legR = makeLeg(1);
    const armL = makeArm(-1);
    const armR = makeArm(1);

    const walk = {
      speed: 4.2,
      stride: 0.55,
      bob: 0.045,
      sway: 0.08,
      hipSwing: 0.42,
      kneeLift: 0.65,
      armSwing: 0.55,
      elbowBend: 0.35,
      footLift: 0.12,
      lean: 0.06,
    };

    const clock = new THREE.Clock();
    let phase = 0;

    function animateWalk(t, dt) {
      phase += dt * walk.speed;
      const s = Math.sin(phase);
      const c = Math.cos(phase);
      const absS = Math.abs(s);

      biped.position.x = t * 0.35;
      biped.position.z = Math.sin(t * 0.18) * 0.25;

      hips.position.y = 1.05 + Math.abs(Math.sin(phase * 2)) * walk.bob;
      hips.rotation.y = Math.sin(phase) * walk.sway * 0.35;
      hips.rotation.z = Math.sin(phase) * walk.sway * 0.25;

      torsoPivot.rotation.x = walk.lean + Math.sin(phase * 2) * 0.02;
      torsoPivot.rotation.z = -Math.sin(phase) * walk.sway * 0.15;

      const leftForward = s;
      const rightForward = -s;

      legL.root.rotation.x = leftForward * walk.hipSwing;
      legR.root.rotation.x = rightForward * walk.hipSwing;

      const leftKnee = walk.kneeLift * Math.max(0, s) + 0.15;
      const rightKnee = walk.kneeLift * Math.max(0, -s) + 0.15;
      legL.kneePivot.rotation.x = leftKnee;
      legR.kneePivot.rotation.x = rightKnee;

      legL.footPivot.rotation.x = -legL.root.rotation.x - legL.kneePivot.rotation.x + walk.footLift * Math.max(0, s);
      legR.footPivot.rotation.x = -legR.root.rotation.x - legR.kneePivot.rotation.x + walk.footLift * Math.max(0, -s);

      armL.root.rotation.x = -rightForward * walk.armSwing;
      armR.root.rotation.x = -leftForward * walk.armSwing;
      armL.elbowPivot.rotation.x = walk.elbowBend + absS * 0.25;
      armR.elbowPivot.rotation.x = walk.elbowBend + absS * 0.25;

      head.rotation.y = Math.sin(phase * 0.5) * 0.08;
      head.rotation.z = Math.sin(phase) * 0.04;
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    let elapsed = 0;
    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;
      animateWalk(elapsed, dt);
      controls.update();
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
