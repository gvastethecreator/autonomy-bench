<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Maze</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(12, 18, 32, 0.92) 0%, rgba(4, 6, 14, 0.98) 100%);
      color: #e8eaf0; text-align: center; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    #overlay h1 {
      font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 300; letter-spacing: 0.35em;
      text-transform: uppercase; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #c8d4ff 0%, #7a9fff 50%, #b8a0ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #overlay .subtitle { font-size: 0.95rem; color: #8892aa; letter-spacing: 0.12em; margin-bottom: 2.5rem; }

    #start-btn {
      padding: 14px 48px; font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
      background: linear-gradient(135deg, rgba(100, 140, 255, 0.25), rgba(140, 100, 255, 0.25));
      border: 1px solid rgba(160, 180, 255, 0.4); border-radius: 2px; color: #dce4ff;
      cursor: pointer; transition: all 0.25s ease;
    }
    #start-btn:hover {
      background: linear-gradient(135deg, rgba(100, 140, 255, 0.45), rgba(140, 100, 255, 0.45));
      border-color: rgba(180, 200, 255, 0.7); transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(80, 120, 255, 0.25);
    }

    .controls { margin-top: 2.5rem; display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
    .control-group { text-align: center; }
    .control-group .keys {
      display: inline-flex; gap: 4px; margin-bottom: 6px;
    }
    .key {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 32px; height: 32px; padding: 0 8px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; font-size: 0.75rem; color: #aab4cc;
    }
    .control-group .label { font-size: 0.7rem; color: #667088; letter-spacing: 0.08em; text-transform: uppercase; }

    #hud {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      opacity: 0; transition: opacity 0.5s ease;
    }
    #hud.visible { opacity: 1; }

    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(200, 210, 240, 0.35);
    }
    #crosshair::before { width: 1px; height: 14px; top: 3px; left: 50%; transform: translateX(-50%); }
    #crosshair::after { width: 14px; height: 1px; top: 50%; left: 3px; transform: translateY(-50%); }

    #minimap-wrap {
      position: absolute; bottom: 24px; right: 24px;
      width: 140px; height: 140px;
      border: 1px solid rgba(160, 180, 255, 0.2);
      border-radius: 4px; background: rgba(8, 12, 24, 0.75);
      backdrop-filter: blur(8px); overflow: hidden;
    }
    #minimap { width: 100%; height: 100%; }

    #stats {
      position: absolute; top: 20px; left: 24px;
      font-size: 0.72rem; letter-spacing: 0.06em; color: rgba(160, 175, 210, 0.55);
      line-height: 1.7;
    }

    #hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: rgba(140, 155, 190, 0.4); transition: opacity 1s ease;
    }
    #hint.fade { opacity: 0; }

    #vignette {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,8,0.55) 100%);
      opacity: 0; transition: opacity 0.8s ease;
    }
    #vignette.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Infinite Maze</h1>
    <p class="subtitle">A procedurally generated labyrinth with no end</p>
    <button id="start-btn">Enter the Maze</button>
    <div class="controls">
      <div class="control-group">
        <div class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></div>
        <div class="label">Move</div>
      </div>
      <div class="control-group">
        <div class="keys"><span class="key">Mouse</span></div>
        <div class="label">Look</div>
      </div>
      <div class="control-group">
        <div class="keys"><span class="key">Shift</span></div>
        <div class="label">Sprint</div>
      </div>
      <div class="control-group">
        <div class="keys"><span class="key">Esc</span></div>
        <div class="label">Release</div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="stats">
      <div id="stat-pos">—</div>
      <div id="stat-chunks">—</div>
    </div>
    <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
    <div id="hint">Find your way through the endless corridors</div>
  </div>
  <div id="vignette"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ─── Config ───────────────────────────────────────────────────────────────
    const CELL = 4;
    const WALL_H = 3.6;
    const WALL_T = 0.35;
    const CHUNK = 12;
    const VIEW_RADIUS = 3;
    const EYE_H = 1.65;
    const MOVE_SPEED = 4.2;
    const SPRINT_MULT = 1.85;
    const MOUSE_SENS = 0.0022;
    const PLAYER_R = 0.35;

    // ─── Seeded RNG (Mulberry32) ──────────────────────────────────────────────
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function hash2(x, z) {
      let h = x * 374761393 + z * 668265263;
      h = (h ^ (h >>> 13)) * 1274126177;
      return (h ^ (h >>> 16)) >>> 0;
    }

    // ─── Maze chunk generator (recursive backtracker) ─────────────────────────
    class MazeChunk {
      constructor(cx, cz) {
        this.cx = cx;
        this.cz = cz;
        this.size = CHUNK;
        this.walls = new Uint8Array(CHUNK * CHUNK * 4);
        this._generate();
      }

      _idx(x, z) { return z * CHUNK + x; }

      _setWall(x, z, dir, val) {
        if (x < 0 || x >= CHUNK || z < 0 || z >= CHUNK) return;
        const i = this._idx(x, z) * 4 + dir;
        this.walls[i] = val ? 1 : 0;
      }

      _getWall(x, z, dir) {
        if (x < 0 || x >= CHUNK || z < 0 || z >= CHUNK) return 1;
        return this.walls[this._idx(x, z) * 4 + dir];
      }

      _generate() {
        for (let i = 0; i < this.walls.length; i++) this.walls[i] = 1;

        const rng = mulberry32(hash2(this.cx, this.cz));
        const visited = new Uint8Array(CHUNK * CHUNK);
        const stack = [[0, 0]];
        visited[0] = 1;
        this._setWall(0, 0, 0, 0);
        this._setWall(0, 0, 1, 0);
        this._setWall(0, 0, 2, 0);
        this._setWall(0, 0, 3, 0);

        const dirs = [[0, -1, 0], [1, 0, 1], [0, 1, 2], [-1, 0, 3]];
        const opposite = [2, 3, 0, 1];

        while (stack.length) {
          const [x, z] = stack[stack.length - 1];
          const neighbors = [];
          for (let d = 0; d < 4; d++) {
            const [dx, dz, dir] = dirs[d];
            const nx = x + dx, nz = z + dz;
            if (nx >= 0 && nx < CHUNK && nz >= 0 && nz < CHUNK && !visited[this._idx(nx, nz)]) {
              neighbors.push([nx, nz, dir]);
            }
          }
          if (neighbors.length === 0) { stack.pop(); continue; }
          const pick = neighbors[Math.floor(rng() * neighbors.length)];
          const [nx, nz, dir] = pick;
          this._setWall(x, z, dir, 0);
          this._setWall(nx, nz, opposite[dir], 0);
          visited[this._idx(nx, nz)] = 1;
          stack.push([nx, nz]);
        }

        this._stitchBorder(0, -1, 2, 0);
        this._stitchBorder(CHUNK - 1, 0, 1, 3);
        this._stitchBorder(0, 0, 3, 1);
        this._stitchBorder(0, 0, 0, 2);
      }

      _stitchBorder(lx, lz, ldir, rdir) {
        const ncx = this.cx + (ldir === 1 ? 1 : ldir === 3 ? -1 : 0);
        const ncz = this.cz + (ldir === 2 ? 1 : ldir === 0 ? -1 : 0);
        const neighbor = mazeStore.get(ncx, ncz);
        if (!neighbor) return;

        for (let i = 0; i < CHUNK; i++) {
          let ax, az, bx, bz;
          if (ldir === 0) { ax = i; az = 0; bx = i; bz = 0; }
          else if (ldir === 2) { ax = i; az = CHUNK - 1; bx = i; bz = CHUNK - 1; }
          else if (ldir === 1) { ax = CHUNK - 1; az = i; bx = CHUNK - 1; bz = i; }
          else { ax = 0; az = i; bx = 0; bz = i; }

          const open = neighbor._getWall(bx, bz, rdir) === 0;
          this._setWall(ax, az, ldir, !open);
        }
      }

      hasWall(gx, gz, dir) {
        const lx = ((gx % CHUNK) + CHUNK) % CHUNK;
        const lz = ((gz % CHUNK) + CHUNK) % CHUNK;
        return this._getWall(lx, lz, dir) === 1;
      }
    }

    class MazeStore {
      constructor() {
        this.chunks = new Map();
      }

      key(cx, cz) { return cx + ',' + cz; }

      get(cx, cz) {
        const k = this.key(cx, cz);
        if (!this.chunks.has(k)) {
          const chunk = new MazeChunk(cx, cz);
          this.chunks.set(k, chunk);
          chunk._stitchBorder(0, 0, 0, 2);
          chunk._stitchBorder(0, 0, 2, 0);
          chunk._stitchBorder(CHUNK - 1, 0, 1, 3);
          chunk._stitchBorder(0, 0, 3, 1);
        }
        return this.chunks.get(k);
      }

      chunkCoord(g) { return Math.floor(g / CHUNK); }

      hasWall(gx, gz, dir) {
        const cx = this.chunkCoord(gx);
        const cz = this.chunkCoord(gz);
        return this.get(cx, cz).hasWall(gx, gz, dir);
      }

      prune(playerCx, playerCz) {
        for (const [k] of this.chunks) {
          const [cx, cz] = k.split(',').map(Number);
          if (Math.abs(cx - playerCx) > VIEW_RADIUS + 1 || Math.abs(cz - playerCz) > VIEW_RADIUS + 1) {
            this.chunks.delete(k);
          }
        }
      }
    }

    const mazeStore = new MazeStore();

    // ─── Textures (procedural canvas) ─────────────────────────────────────────
    function makeWallTexture(seed) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const rng = mulberry32(seed);
      const base = 28 + Math.floor(rng() * 18);
      ctx.fillStyle = `rgb(${base}, ${base + 4}, ${base + 12})`;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 800; i++) {
        const x = rng() * 256, y = rng() * 256;
        const s = rng() * 3 + 0.5;
        const v = Math.floor(rng() * 30);
        ctx.fillStyle = `rgba(${base + v}, ${base + v + 2}, ${base + v + 8}, ${0.15 + rng() * 0.25})`;
        ctx.fillRect(x, y, s, s);
      }

      for (let y = 0; y < 256; y += 32) {
        ctx.strokeStyle = `rgba(0,0,0,${0.08 + rng() * 0.06})`;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      }
      for (let x = 0; x < 256; x += 32) {
        ctx.strokeStyle = `rgba(0,0,0,${0.06 + rng() * 0.05})`;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeFloorTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1a1e2a';
      ctx.fillRect(0, 0, 512, 512);

      for (let y = 0; y < 512; y += 64) {
        for (let x = 0; x < 512; x += 64) {
          const v = 22 + ((x + y) / 64 % 2) * 4;
          ctx.fillStyle = `rgb(${v}, ${v + 2}, ${v + 6})`;
          ctx.fillRect(x + 1, y + 1, 62, 62);
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.strokeRect(x, y, 64, 64);
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeCeilingTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 180);
      grad.addColorStop(0, '#1e2438');
      grad.addColorStop(1, '#0e1220');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 60; i++) {
        const x = Math.random() * 256, y = Math.random() * 256;
        ctx.fillStyle = `rgba(120, 160, 255, ${0.02 + Math.random() * 0.04})`;
        ctx.beginPath(); ctx.arc(x, y, Math.random() * 8 + 2, 0, Math.PI * 2); ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ─── Scene setup ──────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c18);
    scene.fog = new THREE.FogExp2(0x0a1020, 0.045);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 80);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    document.body.appendChild(renderer.domElement);

    const wallMatBase = new THREE.MeshStandardMaterial({
      map: makeWallTexture(42),
      roughness: 0.88,
      metalness: 0.04,
    });

    const floorMat = new THREE.MeshStandardMaterial({
      map: makeFloorTexture(),
      roughness: 0.92,
      metalness: 0.02,
    });

    const ceilMat = new THREE.MeshStandardMaterial({
      map: makeCeilingTexture(),
      roughness: 0.95,
      metalness: 0,
      side: THREE.BackSide,
    });

    const trimMat = new THREE.MeshStandardMaterial({
      color: 0x3a5070,
      roughness: 0.6,
      metalness: 0.15,
      emissive: 0x1a2840,
      emissiveIntensity: 0.35,
    });

    scene.add(new THREE.AmbientLight(0x304060, 0.35));
    const hemi = new THREE.HemisphereLight(0x6080c0, 0x101820, 0.4);
    scene.add(hemi);

    const chunkMeshes = new Map();
    const lightPool = [];
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const wallGeoH = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
    const wallGeoV = new THREE.BoxGeometry(WALL_T, WALL_H, CELL);
    const floorGeo = new THREE.PlaneGeometry(CELL * CHUNK, CELL * CHUNK);
    const ceilGeo = new THREE.PlaneGeometry(CELL * CHUNK, CELL * CHUNK);
    floorGeo.rotateX(-Math.PI / 2);
    ceilGeo.rotateX(Math.PI / 2);

    function worldPos(gx, gz) {
      return [(gx + 0.5) * CELL, 0, (gz + 0.5) * CELL];
    }

    function buildChunk(cx, cz) {
      const key = cx + ',' + cz;
      if (chunkMeshes.has(key)) return;

      const chunk = mazeStore.get(cx, cz);
      const group = new THREE.Group();
      group.position.set(cx * CHUNK * CELL, 0, cz * CHUNK * CELL);

      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.set(CHUNK * CELL / 2, 0, CHUNK * CELL / 2);
      floor.receiveShadow = true;
      group.add(floor);

      const ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.position.set(CHUNK * CELL / 2, WALL_H, CHUNK * CELL / 2);
      group.add(ceil);

      const wallMat = wallMatBase.clone();
      wallMat.map = wallMatBase.map.clone();
      wallMat.map.repeat.set(1, 1);
      wallMat.map.offset.set((hash2(cx, cz) % 100) / 100, 0);

      for (let lx = 0; lx < CHUNK; lx++) {
        for (let lz = 0; lz < CHUNK; lz++) {
          const gx = cx * CHUNK + lx;
          const gz = cz * CHUNK + lz;
          const [wx, , wz] = worldPos(gx, gz);

          if (chunk.hasWall(gx, gz, 0)) {
            const m = new THREE.Mesh(wallGeoH, wallMat);
            m.position.set(lx * CELL + CELL / 2, WALL_H / 2, lz * CELL);
            m.castShadow = true; m.receiveShadow = true;
            group.add(m);
          }
          if (chunk.hasWall(gx, gz, 1)) {
            const m = new THREE.Mesh(wallGeoV, wallMat);
            m.position.set(lx * CELL + CELL, WALL_H / 2, lz * CELL + CELL / 2);
            m.castShadow = true; m.receiveShadow = true;
            group.add(m);
          }
          if (chunk.hasWall(gx, gz, 2)) {
            const m = new THREE.Mesh(wallGeoH, wallMat);
            m.position.set(lx * CELL + CELL / 2, WALL_H / 2, lz * CELL + CELL);
            m.castShadow = true; m.receiveShadow = true;
            group.add(m);
          }
          if (chunk.hasWall(gx, gz, 3)) {
            const m = new THREE.Mesh(wallGeoV, wallMat);
            m.position.set(lx * CELL, WALL_H / 2, lz * CELL + CELL / 2);
            m.castShadow = true; m.receiveShadow = true;
            group.add(m);
          }

          if ((lx + lz + hash2(gx, gz) % 7) % 11 === 0) {
            const trim = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, CELL * 0.9), trimMat);
            trim.position.set(lx * CELL + CELL / 2, WALL_H - 0.15, lz * CELL + CELL / 2);
            group.add(trim);
          }
        }
      }

      const rng = mulberry32(hash2(cx + 7, cz + 13));
      const lightCount = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < lightCount; i++) {
        const lx = 1 + Math.floor(rng() * (CHUNK - 2));
        const lz = 1 + Math.floor(rng() * (CHUNK - 2));
        const gx = cx * CHUNK + lx;
        const gz = cz * CHUNK + lz;
        if (chunk.hasWall(gx, gz, 0) && chunk.hasWall(gx, gz, 2)) continue;
        if (chunk.hasWall(gx, gz, 1) && chunk.hasWall(gx, gz, 3)) continue;

        const hue = 0.08 + rng() * 0.06;
        const color = new THREE.Color().setHSL(hue, 0.5, 0.55);
        const light = new THREE.PointLight(color, 2.2, CELL * 5, 1.8);
        light.position.set(lx * CELL + CELL / 2, WALL_H - 0.4, lz * CELL + CELL / 2);
        light.castShadow = i === 0;
        if (light.castShadow) {
          light.shadow.mapSize.set(512, 512);
          light.shadow.bias = -0.002;
        }
        group.add(light);

        const fixture = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.18, 0.08, 8),
          trimMat
        );
        fixture.position.copy(light.position);
        group.add(fixture);

        lightPool.push({ light, base: 2.2, phase: rng() * Math.PI * 2 });
      }

      worldGroup.add(group);
      chunkMeshes.set(key, group);
    }

    function unloadChunk(cx, cz) {
      const key = cx + ',' + cz;
      const g = chunkMeshes.get(key);
      if (!g) return;
      worldGroup.remove(g);
      g.traverse(o => {
        if (o.geometry && o.geometry !== wallGeoH && o.geometry !== wallGeoV &&
            o.geometry !== floorGeo && o.geometry !== ceilGeo) o.geometry.dispose();
      });
      chunkMeshes.delete(key);
    }

    function updateChunks(px, pz) {
      const pcx = mazeStore.chunkCoord(Math.floor(px / CELL));
      const pcz = mazeStore.chunkCoord(Math.floor(pz / CELL));

      for (let dx = -VIEW_RADIUS; dx <= VIEW_RADIUS; dx++) {
        for (let dz = -VIEW_RADIUS; dz <= VIEW_RADIUS; dz++) {
          buildChunk(pcx + dx, pcz + dz);
        }
      }

      for (const [k] of chunkMeshes) {
        const [cx, cz] = k.split(',').map(Number);
        if (Math.abs(cx - pcx) > VIEW_RADIUS || Math.abs(cz - pcz) > VIEW_RADIUS) {
          unloadChunk(cx, cz);
        }
      }

      mazeStore.prune(pcx, pcz);
      return { pcx, pcz };
    }

    // ─── Collision ────────────────────────────────────────────────────────────
    function collides(x, z) {
      const margin = PLAYER_R;
      const checks = [
        [x - margin, z - margin], [x + margin, z - margin],
        [x - margin, z + margin], [x + margin, z + margin],
        [x, z - margin], [x, z + margin], [x - margin, z], [x + margin, z],
      ];

      for (const [cx, cz] of checks) {
        const gx = Math.floor(cx / CELL);
        const gz = Math.floor(cz / CELL);
        const lx = cx - gx * CELL;
        const lz = cz - gz * CELL;

        if (lz < margin && mazeStore.hasWall(gx, gz, 0)) return true;
        if (lx > CELL - margin && mazeStore.hasWall(gx, gz, 1)) return true;
        if (lz > CELL - margin && mazeStore.hasWall(gx, gz, 2)) return true;
        if (lx < margin && mazeStore.hasWall(gx, gz, 3)) return true;
      }
      return false;
    }

    function tryMove(pos, dx, dz) {
      const nx = pos.x + dx, nz = pos.z + dz;
      if (!collides(nx, pos.z)) pos.x = nx;
      if (!collides(pos.x, nz)) pos.z = nz;
    }

    // ─── Player & input ───────────────────────────────────────────────────────
    const player = { x: CELL * 1.5, z: CELL * 1.5, yaw: 0, pitch: 0 };
    const keys = {};
    let locked = false;
    let bobPhase = 0;

    addEventListener('keydown', e => { keys[e.code] = true; });
    addEventListener('keyup', e => { keys[e.code] = false; });
    addEventListener('mousemove', e => {
      if (!locked) return;
      player.yaw -= e.movementX * MOUSE_SENS;
      player.pitch -= e.movementY * MOUSE_SENS;
      player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
    });

    const overlay = document.getElementById('overlay');
    const hud = document.getElementById('hud');
    const vignette = document.getElementById('vignette');
    const hint = document.getElementById('hint');
    const startBtn = document.getElementById('start-btn');

    startBtn.addEventListener('click', () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === renderer.domElement;
      if (locked) {
        overlay.classList.add('hidden');
        hud.classList.add('visible');
        vignette.classList.add('visible');
        setTimeout(() => hint.classList.add('fade'), 6000);
      } else {
        overlay.classList.remove('hidden');
        hud.classList.remove('visible');
        vignette.classList.remove('visible');
      }
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ─── Minimap ──────────────────────────────────────────────────────────────
    const miniCanvas = document.getElementById('minimap');
    const miniCtx = miniCanvas.getContext('2d');
    const MINI_R = 18;

    function drawMinimap() {
      miniCanvas.width = 140;
      miniCanvas.height = 140;
      const w = 140, h = 140;
      miniCtx.fillStyle = 'rgba(8,12,24,0.9)';
      miniCtx.fillRect(0, 0, w, h);

      const pgx = Math.floor(player.x / CELL);
      const pgz = Math.floor(player.z / CELL);

      for (let dz = -MINI_R; dz <= MINI_R; dz++) {
        for (let dx = -MINI_R; dx <= MINI_R; dx++) {
          const gx = pgx + dx, gz = pgz + dz;
          const sx = (dx + MINI_R) * (w / (MINI_R * 2 + 1));
          const sy = (dz + MINI_R) * (h / (MINI_R * 2 + 1));
          const sw = w / (MINI_R * 2 + 1);

          miniCtx.fillStyle = '#1a2030';
          miniCtx.fillRect(sx, sy, sw - 0.5, sw - 0.5);

          if (mazeStore.hasWall(gx, gz, 0)) {
            miniCtx.fillStyle = '#5a7098';
            miniCtx.fillRect(sx, sy, sw, 1.5);
          }
          if (mazeStore.hasWall(gx, gz, 1)) {
            miniCtx.fillStyle = '#5a7098';
            miniCtx.fillRect(sx + sw - 1.5, sy, 1.5, sw);
          }
          if (mazeStore.hasWall(gx, gz, 2)) {
            miniCtx.fillStyle = '#5a7098';
            miniCtx.fillRect(sx, sy + sw - 1.5, sw, 1.5);
          }
          if (mazeStore.hasWall(gx, gz, 3)) {
            miniCtx.fillStyle = '#5a7098';
            miniCtx.fillRect(sx, sy, 1.5, sw);
          }
        }
      }

      const cx = w / 2, cy = h / 2;
      miniCtx.save();
      miniCtx.translate(cx, cy);
      miniCtx.rotate(-player.yaw);
      miniCtx.fillStyle = '#80aaff';
      miniCtx.beginPath();
      miniCtx.moveTo(0, -5);
      miniCtx.lineTo(4, 5);
      miniCtx.lineTo(0, 3);
      miniCtx.lineTo(-4, 5);
      miniCtx.closePath();
      miniCtx.fill();
      miniCtx.restore();
    }

    // ─── Boot: find open spawn ────────────────────────────────────────────────
    (function initSpawn() {
      mazeStore.get(0, 0);
      for (let r = 0; r < 6; r++) {
        for (let dx = -r; dx <= r; dx++) {
          for (let dz = -r; dz <= r; dz++) {
            const gx = CHUNK / 2 + dx, gz = CHUNK / 2 + dz;
            if (!mazeStore.hasWall(gx, gz, 0) || !mazeStore.hasWall(gx, gz, 1)) {
              player.x = (gx + 0.5) * CELL;
              player.z = (gz + 0.5) * CELL;
              return;
            }
          }
        }
      }
    })();

    updateChunks(player.x, player.z);

    // ─── Loop ─────────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    let frame = 0;
    const statPos = document.getElementById('stat-pos');
    const statChunks = document.getElementById('stat-chunks');

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      frame++;

      if (locked) {
        let speed = MOVE_SPEED;
        if (keys['ShiftLeft'] || keys['ShiftRight']) speed *= SPRINT_MULT;

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);

        let mx = 0, mz = 0;
        if (keys['KeyW'] || keys['ArrowUp']) { mx += forward.x; mz += forward.z; }
        if (keys['KeyS'] || keys['ArrowDown']) { mx -= forward.x; mz -= forward.z; }
        if (keys['KeyA'] || keys['ArrowLeft']) { mx -= right.x; mz -= right.z; }
        if (keys['KeyD'] || keys['ArrowRight']) { mx += right.x; mz += right.z; }

        const len = Math.hypot(mx, mz);
        if (len > 0) {
          mx = (mx / len) * speed * dt;
          mz = (mz / len) * speed * dt;
          tryMove(player, mx, mz);
          bobPhase += dt * (keys['ShiftLeft'] || keys['ShiftRight'] ? 11 : 7);
        }
      }

      const bob = locked && (keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD']) ? Math.sin(bobPhase) * 0.035 : 0;

      camera.position.set(player.x, EYE_H + bob, player.z);
      camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

      const { pcx, pcz } = updateChunks(player.x, player.z);

      const t = clock.elapsedTime;
      for (const { light, base, phase } of lightPool) {
        light.intensity = base + Math.sin(t * 3.5 + phase) * 0.15 + Math.sin(t * 7.1 + phase * 2) * 0.06;
      }

      if (frame % 12 === 0) {
        statPos.textContent = `Sector ${Math.floor(player.x / CELL)}, ${Math.floor(player.z / CELL)}`;
        statChunks.textContent = `${chunkMeshes.size} regions loaded`;
        drawMinimap();
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
