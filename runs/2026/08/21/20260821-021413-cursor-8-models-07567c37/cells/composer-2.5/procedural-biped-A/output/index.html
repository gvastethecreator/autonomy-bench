<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Biped Walker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; }
    canvas { display: block; }
    #info {
      position: fixed;
      bottom: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.55);
      font: 13px/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">Procedural biped walk · drag to orbit</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);
    scene.fog = new THREE.Fog(0x0a0e17, 12, 28);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.4, 5.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.minDistance = 2.5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.update();

    scene.add(new THREE.AmbientLight(0x334466, 0.55));
    const sun = new THREE.DirectionalLight(0xfff0dd, 1.35);
    sun.position.set(4, 9, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 20;
    sun.shadow.camera.left = -6;
    sun.shadow.camera.right = 6;
    sun.shadow.camera.top = 6;
    sun.shadow.camera.bottom = -6;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x6688cc, 0.35);
    fill.position.set(-5, 3, -4);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2438, roughness: 0.92, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(14, 28, 0x2a3858, 0x182030);
    grid.position.y = 0.001;
    scene.add(grid);

    function makePart(w, h, d, color, y = 0) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.08 })
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.y = y;
      return mesh;
    }

    function makeLimb(thighLen, shinLen, footLen, color, side) {
      const root = new THREE.Group();
      root.position.x = side * 0.22;

      const hip = new THREE.Group();
      hip.position.y = 0.95;
      root.add(hip);

      const thigh = makePart(0.16, thighLen, 0.16, color, -thighLen * 0.5);
      hip.add(thigh);

      const knee = new THREE.Group();
      knee.position.y = -thighLen;
      hip.add(knee);

      const shin = makePart(0.13, shinLen, 0.13, color, -shinLen * 0.5);
      knee.add(shin);

      const ankle = new THREE.Group();
      ankle.position.y = -shinLen;
      knee.add(ankle);

      const foot = makePart(footLen, 0.07, 0.18, 0x2a3344, -0.035);
      foot.position.z = footLen * 0.25;
      ankle.add(foot);

      return { root, hip, knee, ankle };
    }

    function makeArm(upperLen, lowerLen, color, side) {
      const root = new THREE.Group();
      root.position.set(side * 0.38, 1.55, 0);

      const shoulder = new THREE.Group();
      root.add(shoulder);

      const upper = makePart(0.11, upperLen, 0.11, color, -upperLen * 0.5);
      shoulder.add(upper);

      const elbow = new THREE.Group();
      elbow.position.y = -upperLen;
      shoulder.add(elbow);

      const lower = makePart(0.09, lowerLen, 0.09, color, -lowerLen * 0.5);
      elbow.add(lower);

      const hand = makePart(0.08, 0.08, 0.08, 0xe8a87c, -lowerLen - 0.04);
      elbow.add(hand);

      return { root, shoulder, elbow };
    }

    const biped = new THREE.Group();
    scene.add(biped);

    const pelvis = new THREE.Group();
    pelvis.position.y = 1.0;
    biped.add(pelvis);

    const torso = makePart(0.42, 0.55, 0.24, 0x4a7cff, 0.28);
    pelvis.add(torso);

    const chest = new THREE.Group();
    chest.position.y = 0.55;
    pelvis.add(chest);

    const rib = makePart(0.46, 0.38, 0.26, 0x5a8cff, 0.19);
    chest.add(rib);

    const neck = makePart(0.12, 0.12, 0.12, 0xe8a87c, 0.44);
    chest.add(neck);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0xe8a87c, roughness: 0.65 })
    );
    head.castShadow = true;
    head.position.y = 0.62;
    chest.add(head);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111822, roughness: 0.3 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeMat);
    eyeL.position.set(-0.08, 0.66, 0.17);
    chest.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.08;
    chest.add(eyeR);

    const legL = makeLimb(0.42, 0.44, 0.22, 0x3d5a99, -1);
    const legR = makeLimb(0.42, 0.44, 0.22, 0x3d5a99, 1);
    pelvis.add(legL.root, legR.root);

    const armL = makeArm(0.32, 0.30, 0x4a7cff, -1);
    const armR = makeArm(0.32, 0.30, 0x4a7cff, 1);
    chest.add(armL.root, armR.root);

    const walk = {
      speed: 3.8,
      stride: 0.42,
      kneeBend: 0.55,
      armSwing: 0.55,
      bodyBob: 0.04,
      hipSway: 0.06,
      torsoTwist: 0.08,
    };

    const clock = new THREE.Clock();
    let t = 0;

    function animateWalk(time) {
      const phase = time * walk.speed;
      const sin = Math.sin(phase);
      const cos = Math.cos(phase);
      const absSin = Math.abs(sin);

      legL.hip.rotation.x = sin * walk.stride;
      legR.hip.rotation.x = -sin * walk.stride;

      legL.knee.rotation.x = Math.max(0, -sin) * walk.kneeBend + absSin * 0.12;
      legR.knee.rotation.x = Math.max(0, sin) * walk.kneeBend + absSin * 0.12;

      legL.ankle.rotation.x = -legL.hip.rotation.x * 0.35 - legL.knee.rotation.x * 0.25;
      legR.ankle.rotation.x = -legR.hip.rotation.x * 0.35 - legR.knee.rotation.x * 0.25;

      armL.shoulder.rotation.x = -sin * walk.armSwing;
      armR.shoulder.rotation.x = sin * walk.armSwing;
      armL.elbow.rotation.x = 0.25 + absSin * 0.18;
      armR.elbow.rotation.x = 0.25 + absSin * 0.18;

      pelvis.position.y = 1.0 + absSin * walk.bodyBob;
      pelvis.rotation.y = sin * walk.hipSway * 0.3;
      pelvis.rotation.z = sin * walk.hipSway * 0.15;

      chest.rotation.y = -sin * walk.torsoTwist;
      chest.rotation.x = absSin * 0.03;

      biped.position.x = Math.sin(time * 0.35) * 0.6;
      biped.rotation.y = Math.sin(time * 0.35) * 0.25;
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function tick() {
      requestAnimationFrame(tick);
      t = clock.getElapsedTime();
      animateWalk(t);
      controls.update();
      renderer.render(scene, camera);
    }

    tick();
  </script>
</body>
</html>
