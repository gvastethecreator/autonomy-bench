<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-Person Rollercoaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10;
    }
    #hud h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em; opacity: 0.95; }
    #hud p { font-size: 0.75rem; opacity: 0.7; margin-top: 4px; }
    #speed {
      position: fixed; bottom: 24px; right: 24px; color: #fff;
      font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9); pointer-events: none; z-index: 10;
    }
    #speed span { font-size: 0.9rem; font-weight: 400; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>THRILL RIDE</h1>
    <p>Continuous loop — hold on tight</p>
  </div>
  <div id="speed">0 <span>km/h</span></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const SPEED = 0.045;
    const TRACK_RADIUS = 0.55;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b8e8);
    scene.fog = new THREE.Fog(0x87b8e8, 80, 420);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 600);

    const hemi = new THREE.HemisphereLight(0xb8d4ff, 0x3a5a2a, 0.55);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4d6, 1.4);
    sun.position.set(60, 120, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 300;
    sun.shadow.camera.left = -120;
    sun.shadow.camera.right = 120;
    sun.shadow.camera.top = 120;
    sun.shadow.camera.bottom = -120;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(800, 800),
      new THREE.MeshStandardMaterial({ color: 0x3d6b3d, roughness: 0.95, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2;
    ground.receiveShadow = true;
    scene.add(ground);

    function addTrees(count) {
      const trunkGeo = new THREE.CylinderGeometry(0.3, 0.45, 3, 6);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 });
      const crownGeo = new THREE.ConeGeometry(2.2, 5, 7);
      const crownMat = new THREE.MeshStandardMaterial({ color: 0x2d6b2d, roughness: 0.85 });

      for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * 360;
        const z = (Math.random() - 0.5) * 360;
        if (Math.hypot(x, z) < 35) continue;

        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.set(x, 1.5, z);
        trunk.castShadow = true;
        scene.add(trunk);

        const crown = new THREE.Mesh(crownGeo, crownMat);
        crown.position.set(x, 5, z);
        crown.castShadow = true;
        scene.add(crown);
      }
    }
    addTrees(180);

    const controlPoints = [
      new THREE.Vector3(0, 8, 0),
      new THREE.Vector3(30, 14, 20),
      new THREE.Vector3(55, 28, 0),
      new THREE.Vector3(40, 38, -35),
      new THREE.Vector3(0, 42, -50),
      new THREE.Vector3(-45, 32, -35),
      new THREE.Vector3(-60, 18, 0),
      new THREE.Vector3(-45, 10, 40),
      new THREE.Vector3(-10, 6, 55),
      new THREE.Vector3(25, 12, 45),
      new THREE.Vector3(50, 22, 25),
      new THREE.Vector3(35, 8, -15),
      new THREE.Vector3(10, 4, -25),
      new THREE.Vector3(-15, 6, -10),
      new THREE.Vector3(0, 8, 0),
    ];

    const curve = new THREE.CatmullRomCurve3(controlPoints, true, 'centripetal', 0.5);
    curve.arcLengthDivisions = 800;

    const trackGroup = new THREE.Group();
    scene.add(trackGroup);

    const railMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, metalness: 0.6, roughness: 0.35 });
    const tieMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.3, roughness: 0.7 });
    const supportMat = new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.5, roughness: 0.5 });

    const railGeo = new THREE.BoxGeometry(0.35, 0.18, 1.2);
    const tieGeo = new THREE.BoxGeometry(2.8, 0.12, 0.35);
    const supportGeo = new THREE.CylinderGeometry(0.18, 0.22, 1, 8);

    const samples = 520;
    const up = new THREE.Vector3(0, 1, 0);
    const tempTangent = new THREE.Vector3();
    const tempNormal = new THREE.Vector3();
    const tempBinormal = new THREE.Vector3();
    const tempPos = new THREE.Vector3();
    const tempMatrix = new THREE.Matrix4();
    const tempQuat = new THREE.Quaternion();

    for (let i = 0; i < samples; i++) {
      const t = i / samples;
      curve.getPointAt(t, tempPos);
      curve.getTangentAt(t, tempTangent).normalize();

      tempNormal.crossVectors(up, tempTangent);
      if (tempNormal.lengthSq() < 0.001) tempNormal.set(1, 0, 0);
      tempNormal.normalize();
      tempBinormal.crossVectors(tempTangent, tempNormal).normalize();

      tempMatrix.makeBasis(tempNormal, tempBinormal, tempTangent);
      tempQuat.setFromRotationMatrix(tempMatrix);

      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.copy(tempPos).addScaledVector(tempNormal, -TRACK_RADIUS);
      leftRail.quaternion.copy(tempQuat);
      leftRail.castShadow = true;
      trackGroup.add(leftRail);

      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.copy(tempPos).addScaledVector(tempNormal, TRACK_RADIUS);
      rightRail.quaternion.copy(tempQuat);
      rightRail.castShadow = true;
      trackGroup.add(rightRail);

      if (i % 3 === 0) {
        const tie = new THREE.Mesh(tieGeo, tieMat);
        tie.position.copy(tempPos);
        tie.quaternion.copy(tempQuat);
        tie.castShadow = true;
        trackGroup.add(tie);
      }

      if (i % 8 === 0 && tempPos.y > 3) {
        const height = tempPos.y - 1.5;
        const support = new THREE.Mesh(supportGeo, supportMat);
        support.scale.y = height;
        support.position.set(tempPos.x, height / 2, tempPos.z);
        support.castShadow = true;
        trackGroup.add(support);
      }
    }

    const station = new THREE.Group();
    const platform = new THREE.Mesh(
      new THREE.BoxGeometry(12, 0.4, 8),
      new THREE.MeshStandardMaterial({ color: 0x666677, roughness: 0.6 })
    );
    platform.position.set(0, 7.6, -6);
    platform.receiveShadow = true;
    station.add(platform);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(14, 0.3, 10),
      new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.7 })
    );
    roof.position.set(0, 11, -6);
    station.add(roof);
    scene.add(station);

    let progress = 0;
    let lastTime = performance.now();
    let displaySpeed = 0;

    const camPos = new THREE.Vector3();
    const camTarget = new THREE.Vector3();
    const camTangent = new THREE.Vector3();
    const camNormal = new THREE.Vector3();
    const camBinormal = new THREE.Vector3();
    const camUp = new THREE.Vector3();

    const speedEl = document.getElementById('speed');

    function updateCamera() {
      curve.getPointAt(progress, camPos);
      curve.getTangentAt(progress, camTangent).normalize();

      camNormal.crossVectors(up, camTangent);
      if (camNormal.lengthSq() < 0.001) camNormal.set(1, 0, 0);
      camNormal.normalize();
      camBinormal.crossVectors(camTangent, camNormal).normalize();

      camera.position.copy(camPos).addScaledVector(camBinormal, 0.15);

      camTarget.copy(camPos).addScaledVector(camTangent, 3);
      camUp.copy(camBinormal);
      camera.lookAt(camTarget);
      camera.up.copy(camUp);
    }

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      const prevT = progress;
      progress = (progress + SPEED * dt) % 1;

      updateCamera();

      const ds = Math.min(Math.abs(progress - prevT), Math.abs(progress - prevT + 1), Math.abs(progress - prevT - 1));
      const speedMs = ds * curve.getLength() / dt;
      displaySpeed += (speedMs * 3.6 - displaySpeed) * 0.08;
      speedEl.innerHTML = Math.round(displaySpeed) + ' <span>km/h</span>';

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateCamera();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
