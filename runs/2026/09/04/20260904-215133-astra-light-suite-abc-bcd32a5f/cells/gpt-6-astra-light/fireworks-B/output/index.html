<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afterglow — A little wonder after dark</title>
<style>

:root{color-scheme:dark;--cream:#f3e8d5;--muted:#aaa5ab;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:#070c19;color:var(--cream);font-family:'DM Sans',sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;left:4.6vw;right:4.6vw;top:34px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font-family:'Italiana',Georgia,serif;font-size:30px;letter-spacing:-1px}.brand span{color:#d4ad76;font-size:24px;margin-right:10px}.edition{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:#b5acaa}.edition i{display:inline-block;background:#dbbb84;width:5px;height:5px;border-radius:50%;margin-right:10px;box-shadow:0 0 12px #dbbb84}main{position:fixed;left:4.6vw;top:23%;pointer-events:none;max-width:365px}.eyebrow{color:#d4b485;letter-spacing:3px;text-transform:uppercase;font-size:10px;margin-bottom:20px}h1{font-family:'Italiana',Georgia,serif;font-size:clamp(48px,5.8vw,86px);font-weight:400;line-height:.99;letter-spacing:-2px;margin:0 0 23px}h1 em{font-weight:400;color:#d8af85}main p{color:#aaaab8;font-size:13px;line-height:1.8;max-width:250px;margin:0}.gesture{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:1px;margin-top:29px;color:#d6c8b6}.cross{font-size:22px;font-weight:400;color:#d5b488}.bottom{position:fixed;bottom:29px;left:4.6vw;right:4.6vw;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.now{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#9b9cae;line-height:2}.now strong{color:#e1d3c0;font-size:11px;letter-spacing:1px;font-weight:400}.controls{background:#111522b8;border:1px solid #ffffff24;border-radius:15px;padding:15px 17px;display:flex;align-items:center;gap:22px;backdrop-filter:blur(18px);box-shadow:0 15px 50px #0003}.label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:2px;color:#92929d;margin-bottom:8px}.palettes{display:flex;gap:7px}.swatch{width:21px;height:21px;border-radius:50%;padding:3px;border:1px solid transparent;background:none}.swatch:before{content:'';display:block;width:13px;height:13px;background:var(--color);border-radius:50%}.swatch[aria-pressed=true]{border-color:#e5d6c3}.divider{height:32px;width:1px;background:var(--line)}.toggle{background:none;border:0;padding:0;display:flex;gap:8px;align-items:center;font-size:11px}.switch{width:25px;height:14px;border-radius:10px;background:#655441;padding:3px}.switch:after{content:'';display:block;border-radius:50%;width:8px;height:8px;background:#ebd5af;transform:translateX(11px);transition:transform .2s}.toggle[aria-pressed=false] .switch{background:#343741}.toggle[aria-pressed=false] .switch:after{transform:translateX(0)}.finale{border:1px solid #d6b48a65;background:#d2b386;color:#15161c;border-radius:7px;padding:12px 17px;font-size:11px;white-space:nowrap}.finale:hover{background:#ecd3a9}.finale:active{transform:translateY(1px)}.sound{width:35px;height:35px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%;color:#b9adb0}.sound svg{width:15px}.sound[aria-pressed=true]{color:#e7c895;border-color:#e7c895}.hint{position:fixed;right:4.6vw;top:100px;font-size:9px;color:#838799;letter-spacing:1px;opacity:0;transition:opacity .3s}.hint.show{opacity:1}button:focus-visible{outline:2px solid #f3ddb6;outline-offset:5px}@media(max-width:700px){header{top:24px}.edition{font-size:8px;letter-spacing:1px}main{top:17%;max-width:200px}h1{font-size:52px}main p{font-size:11px;max-width:165px}.gesture{font-size:8px;margin-top:17px}.bottom{bottom:20px;display:block}.now{margin-bottom:15px}.controls{gap:14px;padding:13px;justify-content:space-between}.sound{display:none}.divider{height:28px}.finale{padding:11px}.label{font-size:7px}.brand{font-size:25px}}@media(prefers-reduced-motion:reduce){.switch:after{transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-label="Interactive fireworks over a quiet mountain lake. Click or tap the sky to launch a firework."></canvas>
<header><div class="brand"><span>✳</span>afterglow</div><div class="edition"><i></i>A night worth staying up for</div></header>
<main><div class="eyebrow">An open sky. All yours.</div><h1>Let the night<br>feel <em>alive.</em></h1><p>A little light. A fleeting moment.<br>Make something beautiful disappear.</p><div class="gesture"><span class="cross">＋</span> CLICK ANYWHERE TO MAKE A WISH</div></main>
<div class="hint" id="hint" role="status"></div>
<footer class="bottom"><div class="now">Tonight’s canvas<br><strong>01 / STILL WATER, INFINITE SKY</strong></div><div class="controls"><div><span class="label">Color story</span><div class="palettes"><button class="swatch" style="--color:#eac386" data-palette="0" aria-label="Golden hour palette" aria-pressed="true"></button><button class="swatch" style="--color:#ed9dc2" data-palette="1" aria-label="Rose quartz palette" aria-pressed="false"></button><button class="swatch" style="--color:#99d1db" data-palette="2" aria-label="Northern lights palette" aria-pressed="false"></button><button class="swatch" style="--color:linear-gradient(135deg,#d997cc,#91cfd7,#eac386)" data-palette="3" aria-label="All colors palette" aria-pressed="false"></button></div></div><div class="divider"></div><div><span class="label">Let it unfold</span><button class="toggle" id="auto" aria-pressed="true"><span class="switch"></span>Autoplay</button></div><button class="sound" id="sound" aria-label="Enable firework sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h4l5-4v14l-5-4H4zM17 8q5 4 0 8"/></svg></button><button class="finale" id="finale">Grand finale ↗</button></div></footer>
<script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let w,h,dpr,horizon,stars=[],rockets=[],particles=[],flashes=[],last=0,elapsed=0,next=500,palette=0,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,audio=null,sound=false,finaleUntil=0;
const palettes=[['#f3c779','#ffe5af','#e99c59'],['#eda1ca','#f8d2e6','#b7a0e1'],['#a1e5dc','#b8d0ff','#69b6dd'],['#fac97b','#e99bc4','#9edbd5','#b5a0e6']];
const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);horizon=h*.78;stars=Array.from({length:Math.floor(w*h/6000)},()=>({x:Math.random()*w,y:Math.random()*horizon,s:rnd(.35,1.15),a:rnd(.1,.65),p:rnd(0,6)}))}addEventListener('resize',resize);resize();
function launch(x=rnd(w*.4,w*.91),y=rnd(h*.12,h*.48)){const cols=palettes[palette];rockets.push({x:rnd(w*.43,w*.86),y:horizon+5,tx:x,ty:Math.min(y,horizon-65),color:cols[Math.floor(Math.random()*cols.length)],trail:[],speed:rnd(290,400)});}
function boom(r){let count=w<700?95:150;const size=rnd(80,155),shape=Math.random();for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,force=shape<.22?size:rnd(.2,1)**.3*size;particles.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(angle)*force,vy:Math.sin(angle)*force,color:i%9===0?'#fff8df':r.color,life:rnd(1.3,2.7),max:2.7,twinkle:Math.random(),width:rnd(.6,1.6)});}flashes.push({x:r.x,y:r.y,life:.25,color:r.color});if(sound)noise();}
function noise(){if(!audio)return;let buffer=audio.createBuffer(1,audio.sampleRate*.55,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.11));let src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=600;gain.gain.value=.22;src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start();}
function background(t){let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#080e20');g.addColorStop(.63,'#141827');g.addColorStop(.78,'#272331');g.addColorStop(1,'#0a111c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);stars.forEach(s=>{ctx.globalAlpha=s.a*(.75+.25*Math.sin(t*.0007+s.p));ctx.fillStyle='#d3d8ef';ctx.fillRect(s.x,s.y,s.s,s.s)});ctx.globalAlpha=1;ctx.fillStyle='#e5d5b5';ctx.shadowColor='#f6dcb6';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(w*.87,h*.16,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
for(let layer=0;layer<3;layer++){ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=w+20;x+=20){let y=horizon-30-layer*7-Math.sin(x/w*12+layer*2)*21-Math.sin(x/w*28+layer)*12;ctx.lineTo(x,y)}ctx.lineTo(w,horizon+10);ctx.lineTo(0,horizon+10);ctx.fillStyle=['#202331','#161c29','#0c1420'][layer];ctx.fill()}ctx.fillStyle='#0a1220';ctx.fillRect(0,horizon,w,h-horizon);for(let i=0;i<25;i++){let yy=horizon+5+i*i*.27;ctx.strokeStyle=`rgba(112,126,155,${.035+(i%3)*.012})`;ctx.beginPath();ctx.moveTo(w*.3+Math.sin(i*18)*w*.2,yy);ctx.lineTo(w*.85+Math.cos(i*14)*w*.1,yy);ctx.stroke()}}
function frame(t){let dt=Math.min((t-last)/1000||.016,.04);last=t;elapsed+=dt*1000;background(t);if(auto||elapsed<finaleUntil){next-=dt*1000;if(next<0){launch();next=elapsed<finaleUntil?rnd(100,220):rnd(1100,2000)}}ctx.lineCap='round';for(let i=rockets.length-1;i>=0;i--){let r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,dist=Math.hypot(dx,dy);r.trail.push([r.x,r.y]);if(r.trail.length>18)r.trail.shift();if(dist<r.speed*dt){r.x=r.tx;r.y=r.ty;boom(r);rockets.splice(i,1);continue}r.x+=dx/dist*r.speed*dt;r.y+=dy/dist*r.speed*dt;for(let j=1;j<r.trail.length;j++){ctx.globalAlpha=j/r.trail.length*.6;ctx.strokeStyle=r.color;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(...r.trail[j-1]);ctx.lineTo(...r.trail[j]);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle='#fff3ce';ctx.fillRect(r.x-1,r.y-2,2,3)}
ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.px=p.x;p.py=p.y;p.vx*=Math.exp(-.8*dt);p.vy=p.vy*Math.exp(-.8*dt)+27*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;let a=Math.min(1,p.life*.85);if(p.life<.6)a*=.5+.5*Math.sin(t*.04+p.twinkle*80);ctx.globalAlpha=a;ctx.strokeStyle=p.color;ctx.lineWidth=p.width;ctx.beginPath();ctx.moveTo(p.px-p.vx*.025,p.py-p.vy*.025);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.x>0&&p.x<w){let ry=horizon+(horizon-p.y)*.26;if(ry<h){ctx.globalAlpha=a*.16;ctx.lineWidth=.7;ctx.beginPath();let jitter=Math.sin(ry*.4+t*.002)*4;ctx.moveTo(p.x+jitter-2,ry);ctx.lineTo(p.x+jitter+3,ry);ctx.stroke()}}}for(let i=flashes.length-1;i>=0;i--){let f=flashes[i];f.life-=dt;if(f.life<0){flashes.splice(i,1);continue}ctx.globalAlpha=f.life*.65;let glow=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,120);glow.addColorStop(0,f.color);glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(f.x-120,f.y-120,240,240)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>launch(e.clientX,e.clientY));document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{palette=+b.dataset.palette;document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',s===b));launch()});const autoBtn=document.querySelector('#auto');autoBtn.setAttribute('aria-pressed',auto);autoBtn.onclick=()=>{auto=!auto;autoBtn.setAttribute('aria-pressed',auto);next=0};document.querySelector('#sound').onclick=async function(){sound=!sound;if(sound){audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume()}this.setAttribute('aria-pressed',sound);this.setAttribute('aria-label',sound?'Mute firework sound':'Enable firework sound')};let hintTimer;document.querySelector('#finale').onclick=()=>{finaleUntil=elapsed+7000;next=0;const hint=document.querySelector('#hint');hint.textContent='YOUR MOMENT. TURNED UP.';hint.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),7000)};launch(w*.64,h*.27);launch(w*.82,h*.4);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
