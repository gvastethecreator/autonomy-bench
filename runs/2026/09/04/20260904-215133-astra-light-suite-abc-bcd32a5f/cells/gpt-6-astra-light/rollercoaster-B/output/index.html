<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURORA — Alpine coaster</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#141d26;color:#fff;font-family:'DM Sans',sans-serif}canvas{display:block}button{font:inherit;color:inherit;cursor:pointer}header{position:absolute;top:32px;left:38px;right:38px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-family:'Space Grotesk',sans-serif;font-size:23px;letter-spacing:6px;font-weight:600}.brand i{color:#e8ff97;font-style:normal}.eyebrow{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:#c3cbd0}.tag{border:1px solid #ffffff40;border-radius:30px;padding:11px 16px;font-size:11px;letter-spacing:1.5px;background:#18212835}.tag b{display:inline-block;width:6px;height:6px;background:#d8f392;border-radius:50%;margin-right:9px;box-shadow:0 0 12px #d8f392}.intro{position:absolute;top:119px;left:38px;pointer-events:none}.intro h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,3.5vw,53px);font-weight:400;line-height:1.06;letter-spacing:-2px;margin:12px 0}.intro p{font-size:12px;color:#d3d8da;line-height:1.7;margin:16px 0}.line{width:36px;height:2px;background:#d8f392;margin-bottom:20px}.bottom{position:absolute;bottom:28px;left:38px;right:38px;display:flex;align-items:end;justify-content:space-between;gap:20px}.panel{padding:20px 24px;background:#14212bc9;backdrop-filter:blur(14px);border:1px solid #ffffff24;border-radius:15px;display:flex;gap:32px;align-items:center}.number{font:400 32px 'Space Grotesk',sans-serif;letter-spacing:-1px;margin-top:7px}.number small{font:10px 'DM Sans';letter-spacing:1px;color:#a7b5bc;margin-left:5px}.label{font-size:9px;color:#a7b5bc;letter-spacing:1.5px}.divider{width:1px;height:40px;background:#ffffff20}.controls{display:flex;gap:9px;align-items:center}button{height:44px;border-radius:50%;width:44px;background:#1b2937bd;border:1px solid #ffffff40;font-size:18px;transition:.2s}button:hover{background:#52636e}#pause{background:#dcf69a;color:#1a2924;border:0}#map{width:152px;height:96px;margin-bottom:10px}.route{text-align:right}.route-name{font-size:10px;letter-spacing:1.5px}.hint{font-size:10px;color:#c4cdd3;position:absolute;bottom:35px;left:50%;transform:translateX(-50%)}.progress{position:absolute;bottom:0;left:0;height:3px;background:#dcf69a;box-shadow:0 0 12px #dcf69a;width:0}.vignette{pointer-events:none;position:absolute;inset:0;background:linear-gradient(#0a152638,transparent 35%,transparent 65%,#07152360)}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#182633;z-index:5;text-align:center;font-family:'Space Grotesk';letter-spacing:4px;transition:opacity 1s}#loading small{display:block;font:11px 'DM Sans';letter-spacing:2px;margin-top:16px;color:#d8f392}@media(max-width:700px){header{left:20px;right:20px;top:22px}.intro{left:20px;top:90px}.intro p{display:none}.bottom{left:20px;right:20px;bottom:25px}.panel{padding:14px;gap:16px}.number{font-size:25px}.route{display:none}.hint{display:none}.brand{font-size:18px}.tag{font-size:9px}.controls{gap:5px}button{width:37px;height:37px}}
</style></head><body><div id="loading">AURORA<small>PREPARING YOUR ASCENT</small></div><div class="vignette"></div><header><div class="brand"><i>⩓</i> AURORA</div><div class="tag"><b></b>LIVE EXPERIENCE</div></header><div class="intro"><div class="line"></div><div class="eyebrow">01 / The alpine circuit</div><h1>Let the mountain<br>take you.</h1><p>A little altitude. A lot of adrenaline.<br>Your front-row seat above the clouds.</p></div><div class="bottom"><div class="panel"><div><div class="label">VELOCITY</div><div class="number"><span id="speed">0</span><small>KM/H</small></div></div><div class="divider"></div><div><div class="label">ALTITUDE</div><div class="number"><span id="altitude">0</span><small>M</small></div></div><div class="controls"><button id="pause" title="Pause ride" aria-label="Pause ride">Ⅱ</button><button id="sound" title="Enable sound" aria-label="Enable sound">♪</button><button id="full" title="Fullscreen" aria-label="Fullscreen">⛶</button></div></div><div class="route"><canvas id="map" width="304" height="192"></canvas><div class="route-name">SUMMIT LOOP <span style="color:#d8f392">↻</span></div></div></div><div class="hint">SPACE TO PAUSE &nbsp;·&nbsp; DRAG TO LOOK AROUND</div><div class="progress" id="progress"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b7cbd4');scene.fog=new THREE.FogExp2('#b7cbd4',.0017);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setClearColor('#b7cbd4');renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.15,2500);scene.add(new THREE.HemisphereLight('#e2f3ff','#5b6750',2.5));const sun=new THREE.DirectionalLight('#fff0c7',3.2);sun.position.set(-250,400,-350);scene.add(sun);
const points=[[-220,70,180],[-250,125,60],[-210,175,-100],[-130,195,-230],[0,170,-270],[130,70,-230],[210,43,-120],[240,88,0],[160,135,110],[50,98,90],[-10,42,20],[-85,46,-10],[-125,90,75],[-65,108,185],[55,60,245],[155,38,290],[130,56,380],[-30,76,365],[-155,49,280]].map(p=>new THREE.Vector3(...p));const curve=new THREE.CatmullRomCurve3(points,true,'centripetal');const len=curve.getLength(),N=1600,frames=curve.computeFrenetFrames(N,true);const steel=new THREE.MeshStandardMaterial({color:'#344f54',metalness:.6,roughness:.4});const railmat=new THREE.MeshStandardMaterial({color:'#ddecdb',metalness:.7,roughness:.27});const yellow=new THREE.MeshStandardMaterial({color:'#d1e97f',metalness:.3,roughness:.45});
function basis(t){let pos=curve.getPointAt(t),tan=curve.getTangentAt(t);let right=new THREE.Vector3().crossVectors(tan,new THREE.Vector3(0,1,0)).normalize();let up=new THREE.Vector3().crossVectors(right,tan).normalize();return {pos,tan,right,up}}
for(let side of [-1,1]){let ps=[];for(let i=0;i<=N;i++){let b=basis(i/N);ps.push(b.pos.addScaledVector(b.right,side*1.5))}scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ps),N,.16,6,false),railmat))}
const beamGeo=new THREE.CylinderGeometry(.23,.23,1,6);function beam(a,b,r,mat=steel){let m=new THREE.Mesh(beamGeo,mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());m.scale.set(r,a.distanceTo(b),r);scene.add(m)}
for(let i=0;i<600;i++){let b=basis(i/600);beam(b.pos.clone().addScaledVector(b.right,-1.85),b.pos.clone().addScaledVector(b.right,1.85),.6,yellow)}for(let i=0;i<95;i++){let b=basis(i/95);for(let s of [-1,1]){let top=b.pos.clone().addScaledVector(b.right,s*1.5).addScaledVector(b.up,-.8);let base=top.clone().addScaledVector(b.right,s*4);base.y=-12;beam(base,top,3);if(i%2===0){let next=basis((i+1)/95);beam(base,next.pos.clone().addScaledVector(next.right,s*1.5).addScaledVector(next.up,-1),1)}}}
let seed=27;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:'#607e71',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-16;scene.add(ground);
// Faceted alpine peaks form a quiet amphitheatre around the track.
for(let i=0;i<60;i++){let a=i/60*Math.PI*2,r=650+random()*650,h=150+random()*520;let geo=new THREE.ConeGeometry(160+random()*220,h,5+Math.floor(random()*3));let m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.47+random()*.06,.12,.36+random()*.19),flatShading:true}));m.position.set(Math.cos(a)*r,h/2-30,Math.sin(a)*r);m.rotation.y=random()*6;scene.add(m);if(h>350){let snow=new THREE.Mesh(new THREE.ConeGeometry(60,h*.29,6),new THREE.MeshStandardMaterial({color:'#e1e7df',flatShading:true}));snow.position.copy(m.position);snow.position.y=h*.85-30;scene.add(snow)}}
const treeGeo=new THREE.ConeGeometry(5,23,5),treeMat=new THREE.MeshStandardMaterial({color:'#2d554c',flatShading:true});const trees=new THREE.InstancedMesh(treeGeo,treeMat,1700);const dummy=new THREE.Object3D();for(let i=0;i<1700;i++){dummy.position.set((random()-.5)*1800,-5,(random()-.5)*1800);let scale=.6+random()*1.7;dummy.scale.set(scale,scale,scale);dummy.rotation.y=random()*6;dummy.updateMatrix();trees.setMatrixAt(i,dummy.matrix)}scene.add(trees);
const lake=new THREE.Mesh(new THREE.CircleGeometry(155,80),new THREE.MeshStandardMaterial({color:'#73afba',metalness:.5,roughness:.22}));lake.rotation.x=-Math.PI/2;lake.scale.set(1.2,.6,1);lake.position.set(40,-14,190);scene.add(lake);
// The visible nose of the lead car anchors the first-person perspective.
const car=new THREE.Group();const hood=new THREE.Mesh(new THREE.BoxGeometry(2.4,.5,1.6),new THREE.MeshStandardMaterial({color:'#b7d779',metalness:.35,roughness:.38}));hood.position.set(0,-1.22,-1.5);car.add(hood);const bar=new THREE.Mesh(new THREE.TorusGeometry(.85,.065,8,32,Math.PI),steel);bar.rotation.x=.45;bar.position.set(0,-1,-1.3);car.add(bar);camera.add(car);scene.add(camera);
let t=.015,paused=false,sounding=false,audio,gain,osc,lookX=0,lookY=0,drag=false,lastX=0,lastY=0;const pause=document.querySelector('#pause');function toggle(){paused=!paused;pause.textContent=paused?'▶':'Ⅱ';pause.setAttribute('aria-label',paused?'Resume ride':'Pause ride')}pause.onclick=toggle;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};document.querySelector('#sound').onclick=()=>{if(!audio){audio=new AudioContext();let buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.25;let noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;let filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=650;gain=audio.createGain();gain.gain.value=0;noise.connect(filter).connect(gain).connect(audio.destination);noise.start()}audio.resume();sounding=!sounding;document.querySelector('#sound').style.color=sounding?'#d8f392':'white';document.querySelector('#sound').setAttribute('aria-label',sounding?'Mute sound':'Enable sound')};renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){lookX=Math.max(-.8,Math.min(.8,lookX-(e.clientX-lastX)*.003));lookY=Math.max(-.4,Math.min(.4,lookY-(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=false);
const map=document.querySelector('#map'),ctx=map.getContext('2d');function drawMap(){ctx.clearRect(0,0,304,192);ctx.lineWidth=2;ctx.strokeStyle='#ffffff65';ctx.beginPath();for(let i=0;i<=300;i++){let p=curve.getPointAt(i/300),x=(p.x+270)*.48+12,y=(p.z+280)*.25+10;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();let p=curve.getPointAt(t);ctx.fillStyle='#ddf99b';ctx.shadowColor='#ddf99b';ctx.shadowBlur=12;ctx.beginPath();ctx.arc((p.x+270)*.48+12,(p.z+280)*.25+10,5,0,7);ctx.fill();ctx.shadowBlur=0}
let previous=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-previous)/1000,.05);previous=now;let b=basis(t);let velocity=16+Math.sqrt(Math.max(0,195-b.pos.y)*3.5);if(!paused)t=(t+velocity*dt/len)%1;b=basis(t);camera.position.copy(b.pos).addScaledVector(b.up,1.65);let ahead=basis((t+.0025)%1);camera.up.copy(b.up);camera.lookAt(ahead.pos.clone().addScaledVector(ahead.up,1.65));camera.rotateY(lookX);camera.rotateX(lookY);let bend=b.tan.clone().cross(ahead.tan).y;camera.rotateZ(THREE.MathUtils.clamp(-bend*12,-.13,.13));if(!drag){lookX*=Math.exp(-dt*2);lookY*=Math.exp(-dt*2)}if(gain)gain.gain.setTargetAtTime(sounding&&!paused?.12+velocity*.002:0,audio.currentTime,.15);document.querySelector('#speed').textContent=paused?'0':Math.round(velocity*3.6);document.querySelector('#altitude').textContent=Math.round(1200+b.pos.y);document.querySelector('#progress').style.width=t*100+'%';drawMap();renderer.render(scene,camera)}requestAnimationFrame(animate);const loading=document.querySelector('#loading');loading.style.opacity=0;setTimeout(()=>loading.remove(),1000);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
