<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#182e39;color:#fff;font-family:'DM Sans',sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,31,38,.38),transparent 24%,transparent 68%,rgba(9,23,28,.72))}header{position:absolute;top:36px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:center}.brand{font:700 22px 'Space Grotesk',sans-serif;letter-spacing:5px}.brand span{color:#edb870}.edition{font-size:10px;letter-spacing:3px;margin-top:8px;color:#e0e4df}.live{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:2px;border:1px solid #ffffff40;border-radius:30px;padding:11px 17px;background:#15313e35}.dot{height:6px;width:6px;background:#c5e2ab;border-radius:50%;box-shadow:0 0 13px #bce79d}.left{position:absolute;bottom:48px;left:42px} .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:#e5c397;margin-bottom:13px}h1{font:500 clamp(30px,4vw,54px)/1.04 'Space Grotesk',sans-serif;letter-spacing:-2px;margin:0 0 12px} .subtitle{font-size:12px;letter-spacing:.3px;color:#c5d0d0}.stats{display:flex;gap:32px;margin-top:29px}.stat b{font:400 28px 'Space Grotesk',sans-serif}.stat span{font-size:10px;color:#b6c6c8;margin-left:5px}.stat label{display:block;font-size:9px;letter-spacing:2px;margin-top:7px;color:#b3c1c5}.right{position:absolute;right:42px;bottom:46px;width:228px}.route{border-bottom:1px solid #ffffff25;padding-bottom:17px;margin-bottom:16px}.route-head{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:#cfdbdc;margin-bottom:13px}#map{width:220px;height:110px;overflow:visible}.controls{display:flex;gap:8px;pointer-events:auto}button{font-family:inherit;color:#f0f3ec;background:#ffffff0e;border:1px solid #ffffff40;border-radius:5px;height:38px;cursor:pointer;font-size:10px;letter-spacing:1px;transition:.2s}button:hover{background:#ffffff28}button:focus-visible{outline:2px solid #f8ca8e;outline-offset:4px}#pause{flex:1}#sound,#full{width:39px;font-size:17px}.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:3px;opacity:0;transition:opacity .4s;pointer-events:none}.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#182e39;z-index:10;letter-spacing:4px;font-size:12px;transition:opacity .6s}.loading.out{opacity:0;pointer-events:none}.center-bottom{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#c6d2d4}.key{border:1px solid #ffffff40;padding:4px 7px;border-radius:3px;margin-right:7px}@media(max-width:650px){header{top:23px;left:23px;right:23px}.brand{font-size:17px;letter-spacing:3px}.edition{font-size:8px;letter-spacing:2px}.live{font-size:8px;padding:9px 10px}.left{left:23px;bottom:27px}.right{right:23px;bottom:27px;width:128px}.route{display:none}.center-bottom{display:none}.stats{gap:15px;margin-top:18px}.stat b{font-size:22px}.subtitle{font-size:10px;max-width:180px}h1{font-size:34px}.controls{flex-wrap:wrap}#pause{flex-basis:100%}#sound,#full{width:60px}.stat label{font-size:8px;letter-spacing:1px}}

<body>
<div id="loading" class="loading">PREPARING YOUR ASCENT</div>
<div class="hud">
 <header><div><div class="brand">AFTER<span>GLOW</span></div><div class="edition">AN ALPINE COASTER EXPERIENCE</div></div><div class="live"><i class="dot"></i><span id="status">LIVE RIDE · FIRST PERSON</span></div></header>
 <div class="left"><div class="eyebrow" id="section">01 / THE ASCENT</div><h1>Chase the horizon.</h1><div class="subtitle">Above the pines. Beyond the ordinary.</div><div class="stats"><div class="stat"><b id="speed">0</b><span>km/h</span><label>VELOCITY</label></div><div class="stat"><b id="height">0</b><span>m</span><label>ELEVATION</label></div><div class="stat"><b id="lap">01</b><label>LAP</label></div></div></div>
 <div class="right"><div class="route"><div class="route-head"><span>THE RIDGELINE</span><span id="progress">0%</span></div><svg id="map" viewBox="0 0 220 110"><path id="mapPath" fill="none" stroke="#d4dfd54d" stroke-width="2"/><circle id="mapDot" r="4" fill="#f4bc78" stroke="#fff" stroke-width="1.5"/></svg></div><div class="controls"><button id="pause" aria-label="Pause ride">Ⅱ &nbsp; PAUSE</button><button id="sound" aria-label="Enable ambient audio" title="Ambient audio">♪</button><button id="full" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button></div></div>
 <div class="center-bottom"><span class="key">SPACE</span> PAUSE &nbsp; / &nbsp; DRAG TO LOOK</div><div id="hint" class="hint">RIDE PAUSED</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color('#aec5c6');scene.fog=new THREE.FogExp2('#aec5c6',.00175);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,2400);
scene.add(new THREE.HemisphereLight('#eff2df','#395653',2.35));const sun=new THREE.DirectionalLight('#ffd1a0',3.3);sun.position.set(-240,330,-360);scene.add(sun);
const mat=(c,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color:c,roughness,metalness});
const green=mat('#567569'),dark=mat('#293e3c'),railmat=mat('#ded7bd',.25,.7),crossmat=mat('#b06039',.6,.3),supportmat=mat('#4b6260',.68,.3);
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o;}
// A complete closed circuit, parameterized by distance for uninterrupted playback.
const points=[[-170,30,120],[-205,53,35],[-180,95,-80],[-90,120,-180],[20,80,-180],[90,25,-100],[45,15,0],[125,45,95],[220,83,20],[200,60,-140],[80,36,-240],[-50,56,-265],[-165,78,-220],[-265,45,-110],[-285,25,65],[-235,20,165],[-130,40,220],[-20,55,180],[-40,35,100],[-105,24,85]].map(p=>new THREE.Vector3(...p));
const curve=new THREE.CatmullRomCurve3(points,true,'centripetal');curve.arcLengthDivisions=5000;const length=curve.getLength();
function frame(t){t=(t%1+1)%1;const p=curve.getPointAt(t),f=curve.getTangentAt(t).normalize(),r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();const u=new THREE.Vector3().crossVectors(r,f).normalize();const f2=curve.getTangentAt((t+.002)%1);const turn=new THREE.Vector3().crossVectors(f,f2).y;const bank=THREE.MathUtils.clamp(-turn*10,-.46,.46);r.applyAxisAngle(f,bank);u.applyAxisAngle(f,bank);return{p,f,r,u};}
const frames=Array.from({length:1801},(_,i)=>frame(i/1800));
for(const side of [-1,1]){const path=new THREE.CatmullRomCurve3(frames.slice(0,-1).map(q=>q.p.clone().addScaledVector(q.r,side*1.08)),true);mesh(new THREE.TubeGeometry(path,1800,.105,7,true),railmat);}
function bar(a,b,r,m){const d=b.clone().sub(a);const o=mesh(new THREE.CylinderGeometry(r,r,d.length(),6),m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o;}
const tiegeo=new THREE.BoxGeometry(2.85,.18,.28);for(let i=0;i<850;i++){const q=frame(i/850),o=mesh(tiegeo,crossmat);o.position.copy(q.p).addScaledVector(q.u,-.13);o.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(q.r,q.u,q.f.clone().negate()));}
for(let i=0;i<120;i++){const q=frame(i/120);for(const side of [-1,1]){const a=q.p.clone().addScaledVector(q.r,side*1.3).addScaledVector(q.u,-.3),b=new THREE.Vector3(a.x+side*2,-5,a.z);bar(a,b,.34,supportmat);}if(i%2===0){const a=q.p.clone().addScaledVector(q.r,-1.3),b=q.p.clone().addScaledVector(q.r,1.3);bar(a,b,.24,supportmat);}}
// Broad valley, low-poly alpine ridges, lake, and a dense evergreen canopy.
mesh(new THREE.PlaneGeometry(6000,6000),mat('#81947d')).rotation.x=-Math.PI/2;
const lake=mesh(new THREE.CircleGeometry(225,96),new THREE.MeshStandardMaterial({color:'#588d96',roughness:.19,metalness:.38}),70,.25,15);lake.rotation.x=-Math.PI/2;lake.scale.set(.72,1.33,1);
let seed=391;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const rockmats=['#718981','#8d9b8a','#6c8680','#82958b'].map(c=>mat(c));
for(let i=0;i<55;i++){const a=i/55*Math.PI*2,dist=560+rand()*550,h=100+rand()*340;const o=mesh(new THREE.ConeGeometry(120+rand()*210,h,5+Math.floor(rand()*3)),rockmats[i%4],Math.cos(a)*dist,h*.40,Math.sin(a)*dist);o.rotation.y=rand()*6.28;if(h>270){const snow=mesh(new THREE.ConeGeometry(33,h*.19,6),mat('#d6ddd0'),o.position.x,h*.91,o.position.z);snow.rotation.y=o.rotation.y;}}
const treeCount=1750,trunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.45,.75,7,5),dark,treeCount),crowns=new THREE.InstancedMesh(new THREE.ConeGeometry(5,19,6),green,treeCount),crowns2=new THREE.InstancedMesh(new THREE.ConeGeometry(3.8,13,5),mat('#426358'),treeCount);const dummy=new THREE.Object3D();let count=0;for(let i=0;i<treeCount*3&&count<treeCount;i++){let x=(rand()-.5)*1400,z=(rand()-.5)*1400;if((x-70)**2/170**2+(z-15)**2/310**2<1.08)continue;let scale=.6+rand()*.85;dummy.position.set(x,3*scale,z);dummy.scale.setScalar(scale);dummy.rotation.y=rand()*6.28;dummy.updateMatrix();trunks.setMatrixAt(count,dummy.matrix);dummy.position.y=13*scale;dummy.updateMatrix();crowns.setMatrixAt(count,dummy.matrix);dummy.position.y=21*scale;dummy.updateMatrix();crowns2.setMatrixAt(count,dummy.matrix);count++;}trunks.count=crowns.count=crowns2.count=count;scene.add(trunks,crowns,crowns2);
// Sun disk and slow drifting clouds soften the silhouettes.
mesh(new THREE.SphereGeometry(24,24,16),new THREE.MeshBasicMaterial({color:'#ffe5b5'}),-590,380,-1050);
const cloudmat=new THREE.MeshBasicMaterial({color:'#e8e5d8',transparent:true,opacity:.34,depthWrite:false});for(let i=0;i<24;i++){const c=mesh(new THREE.SphereGeometry(1,12,8),cloudmat,(rand()-.5)*2000,320+rand()*170,(rand()-.5)*2000);c.scale.set(60+rand()*110,8+rand()*12,22+rand()*40);}
// An open steel arch passage gives a close-range sense of speed.
for(let i=0;i<13;i++){const q=frame(.264+i*.0024);const a=q.p.clone().addScaledVector(q.r,-3.9).addScaledVector(q.u,-1),b=a.clone().addScaledVector(q.u,7),c=q.p.clone().addScaledVector(q.r,3.9).addScaledVector(q.u,6),d=c.clone().addScaledVector(q.u,-7);bar(a,b,.13,crossmat);bar(b,c,.13,crossmat);bar(c,d,.13,crossmat);}
const car=new THREE.Group();camera.add(car);scene.add(camera);const body=new THREE.Mesh(new THREE.BoxGeometry(2.8,.38,1.8),mat('#b66c44',.4,.4));body.position.set(0,-1.5,-1);car.add(body);const nose=new THREE.Mesh(new THREE.BoxGeometry(2.75,.26,.25),mat('#233e42',.32,.6));nose.position.set(0,-1.25,-1.78);car.add(nose);const safety=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,2.35,10),railmat);safety.rotation.z=Math.PI/2;safety.position.set(0,-.94,-.8);car.add(safety);
const $=id=>document.getElementById(id);let svg='';for(let i=0;i<=200;i++){const p=curve.getPointAt(i/200);svg+=(i?'L':'M')+(15+(p.x+300)/540*190).toFixed(1)+','+(8+(p.z+280)/520*94).toFixed(1);} $('mapPath').setAttribute('d',svg);
let t=.005,laps=1,paused=false,velocity=13;const clock=new THREE.Clock();let yaw=0,pitch=0,drag=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw=THREE.MathUtils.clamp(yaw-(e.clientX-px)*.003,-.8,.8);pitch=THREE.MathUtils.clamp(pitch-(e.clientY-py)*.003,-.4,.45);px=e.clientX;py=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
function pause(){paused=!paused;$('pause').textContent=paused?'▶  RESUME':'Ⅱ  PAUSE';$('pause').setAttribute('aria-label',paused?'Resume ride':'Pause ride');$('hint').style.opacity=paused?1:0;$('status').textContent=paused?'RIDE PAUSED':'LIVE RIDE · FIRST PERSON';} $('pause').onclick=pause;window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();pause()}});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})};
let audio,windGain,sound=false; $('sound').onclick=async()=>{if(!audio){audio=new AudioContext();const b=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const src=audio.createBufferSource();src.buffer=b;src.loop=true;const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=550;windGain=audio.createGain();windGain.gain.value=0;src.connect(filter).connect(windGain).connect(audio.destination);src.start();}await audio.resume();sound=!sound;$('sound').style.background=sound?'#be895a80':'';$('sound').setAttribute('aria-label',sound?'Mute ambient audio':'Enable ambient audio');};
const orient=new THREE.Matrix4(),lookq=new THREE.Quaternion();let ui=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!paused){const h=curve.getPointAt(t).y;const target=Math.max(10,Math.sqrt(Math.max(100,2*7.8*(131-h))));velocity=THREE.MathUtils.lerp(velocity,target,1-Math.exp(-dt*1.5));t+=velocity*dt/length;if(t>=1){t%=1;laps++;}}const q=frame(t);camera.position.copy(q.p).addScaledVector(q.u,1.7);orient.makeBasis(q.r,q.u,q.f.clone().negate());lookq.setFromRotationMatrix(orient);camera.quaternion.copy(lookq);if(!drag){yaw*=Math.exp(-dt*2);pitch*=Math.exp(-dt*2)}camera.rotateY(yaw);camera.rotateX(pitch);camera.fov=76+(velocity-10)*.13;camera.updateProjectionMatrix();if(windGain)windGain.gain.setTargetAtTime(sound&&!paused?.035+velocity*.0015:0,audio.currentTime,.2);ui+=dt;if(ui>.12){ui=0;$('speed').textContent=Math.round(paused?0:velocity*3.6);$('height').textContent=Math.round(q.p.y);$('lap').textContent=String(laps).padStart(2,'0');$('progress').textContent=Math.floor(t*100)+'%';$('mapDot').setAttribute('cx',15+(q.p.x+300)/540*190);$('mapDot').setAttribute('cy',8+(q.p.z+280)/520*94);$('section').textContent=t<.17?'01 / THE ASCENT':t<.32?'02 / INTO THE VALLEY':t<.52?'03 / THE RIDGELINE':t<.76?'04 / THROUGH THE PINES':'05 / HOMEWARD BOUND';}renderer.render(scene,camera);}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;renderer.setSize(innerWidth,innerHeight);camera.updateProjectionMatrix()});$('loading').classList.add('out');animate();
</script>
<script>window.addEventListener('error',()=>{const el=document.getElementById('loading');if(el&&!el.classList.contains('out'))el.textContent='Unable to load the ride. Please check your connection.';});</script>
