<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#060d18">
  <title>Nightfall — A little wonder, after dark</title>
  <style>
    :root{color-scheme:dark;--cream:#f2e8d5;--muted:#a1abb6;--line:rgba(215,225,234,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060d18}
    body{font-family:Arial,Helvetica,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:2px solid #eed6a9;outline-offset:5px}
    button:disabled{cursor:default}
    button svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    #experience{position:relative;width:100%;height:100%;isolation:isolate}
    #sky{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:crosshair}
    .vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,8,15,.28),transparent 24%,transparent 59%,rgba(3,8,15,.25)),radial-gradient(ellipse at 52% 39%,transparent 25%,rgba(1,5,11,.26));z-index:1}
    .header{position:absolute;inset:31px 42px auto;display:flex;align-items:center;justify-content:space-between;z-index:3;pointer-events:none}
    .brand{display:flex;align-items:center;gap:13px;user-select:none}
    .brand-mark{width:33px;height:33px;color:#e8c593}
    .brand-name{font-size:15px;letter-spacing:.3em;font-weight:600;line-height:1.2}
    .brand-subtitle{font-size:8px;letter-spacing:.24em;color:#a2a7af;margin-top:7px}
    .header-tools{display:flex;gap:12px;align-items:center;pointer-events:auto}
    .sound-button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:12px 10px;color:#bbc1c8;font-size:10px;letter-spacing:.1em}
    .sound-button:hover{color:var(--cream)}
    .sound-button svg{width:16px;height:16px}
    .icon-button{display:grid;place-items:center;width:39px;height:39px;background:rgba(10,18,29,.25);border:1px solid var(--line);border-radius:50%;transition:background .2s,color .2s}
    .icon-button:hover{background:rgba(255,255,255,.08);color:#fff}
    .sound-on{display:none}
    .sound-button[aria-pressed=true] .sound-on{display:block}
    .sound-button[aria-pressed=true] .sound-off{display:none}
    .intro{position:absolute;left:43px;bottom:151px;z-index:2;pointer-events:none}
    .eyebrow{font-size:9px;letter-spacing:.21em;color:#b9b1a2;margin-bottom:18px;display:flex;align-items:center;gap:11px}
    .eyebrow:before{content:"";height:1px;width:25px;background:#b49a73}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(38px,4.05vw,64px);line-height:1.04;font-weight:400;letter-spacing:-.045em;margin:0;text-shadow:0 2px 30px #050c18}
    h1 em{font-weight:400;color:#e4c69b}
    .intro p{font-size:11px;color:#aab2ba;letter-spacing:.025em;margin:18px 0 0}
    .act{position:absolute;right:44px;bottom:153px;z-index:2;text-align:right;pointer-events:none}
    .act-index{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:36px;color:#c1b599;line-height:1;margin-bottom:13px}
    .act-name{font-size:9px;letter-spacing:.19em;color:#bbc0c6}
    .act-line{margin:17px 0 0 auto;height:1px;width:93px;background:rgba(238,228,204,.18);overflow:hidden}
    .act-progress{height:1px;width:0;background:#d9bc8d;transition:width .35s linear}
    .dock{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:21px;padding:10px 11px 10px 15px;border:1px solid rgba(227,232,237,.16);border-radius:18px;background:rgba(13,23,35,.76);box-shadow:0 16px 45px #0004,inset 0 1px 0 #ffffff04;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
    .play-wrap{display:flex;align-items:center;gap:11px;min-width:105px}
    .play{width:38px;height:38px;background:rgba(243,234,215,.08);border:1px solid rgba(240,229,211,.18);border-radius:50%;display:grid;place-items:center;transition:background .2s}
    .play:hover{background:rgba(243,234,215,.17)}
    .play svg{width:15px;height:15px}
    .play-symbol{display:none}
    .play[aria-pressed=true] .pause-symbol{display:none}
    .play[aria-pressed=true] .play-symbol{display:block}
    .play-label{font-size:10px;font-weight:500;letter-spacing:.025em;white-space:nowrap}
    .live{font-size:8px;letter-spacing:.08em;color:#8e9da8;margin-top:6px;display:flex;gap:5px;align-items:center}
    .live-dot{display:block;width:4px;height:4px;background:#d4b887;border-radius:50%;box-shadow:0 0 7px #e4c79188}
    .is-paused .live-dot{background:#8993a0;box-shadow:none}
    .divider{height:31px;width:1px;background:var(--line);flex-shrink:0}
    .palette-section{display:flex;align-items:center;gap:14px}
    .palette-copy{width:64px;flex-shrink:0}
    .palette-kicker{font-size:8px;letter-spacing:.07em;color:#8795a4;margin-bottom:6px;white-space:nowrap}
    .palette-name{font-size:10px;white-space:nowrap}
    .palettes{display:flex;gap:10px}
    .palette{width:23px;height:23px;position:relative;padding:0;border:3px solid #15202c;border-radius:50%;outline:1px solid transparent;transition:outline-color .2s,transform .2s}
    .palette:hover{transform:scale(1.12)}
    .palette[aria-pressed=true]{outline-color:#e0d2b9}
    .palette[data-palette=gold]{background:linear-gradient(135deg,#fff1bc 0%,#dfa666 60%,#69ada7 100%)}
    .palette[data-palette=rose]{background:linear-gradient(135deg,#f8babc,#e17591 50%,#aea0df 100%)}
    .palette[data-palette=aurora]{background:linear-gradient(135deg,#a6edd1,#64c0d1 45%,#a38ce6)}
    .finale{border:1px solid #ead5b5;background:#e8d5b7;color:#212322;border-radius:10px;display:flex;align-items:center;gap:20px;height:41px;padding:0 15px;font-size:11px;white-space:nowrap;font-weight:600;transition:background .2s,transform .2s}
    .finale:hover{background:#f8e7cc;transform:translateY(-1px)}
    .finale:active{transform:translateY(0)}
    .finale svg{width:15px;height:15px;stroke-width:1.6}
    .finale[disabled]{background:#c4b294;border-color:#c4b294;transform:none}
    .footer{position:absolute;bottom:18px;left:43px;right:43px;display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:2;color:#63717d;font-size:8px;letter-spacing:.14em;pointer-events:none}
    .footer-center{display:flex;align-items:center;gap:7px;position:absolute;left:50%;transform:translateX(-50%);color:#8d9ca7;white-space:nowrap;font-size:8px;letter-spacing:.11em}
    .footer-center svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.2}
    .keyboard-hint{letter-spacing:.06em}
    .toast{position:absolute;top:102px;left:50%;transform:translate(-50%,-8px);z-index:6;background:rgba(19,30,43,.88);border:1px solid var(--line);border-radius:30px;padding:11px 18px;color:#e1d5c2;font-size:11px;letter-spacing:.03em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px)}
    .toast.visible{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.header{inset:23px 23px auto}.brand-name{font-size:12px}.brand-subtitle{font-size:7px}.brand-mark{width:28px;height:28px}.sound-button{padding:8px 0}.sound-copy{display:none}.header-tools{gap:14px}.intro{left:25px;bottom:157px}.intro h1{font-size:44px}.eyebrow{font-size:8px;margin-bottom:14px}.intro p{font-size:10px;margin-top:14px}.act{right:25px;bottom:160px}.act-index{font-size:29px}.act-name{font-size:7px;letter-spacing:.1em}.act-line{width:55px}.dock{bottom:55px;gap:13px;padding:10px 10px 10px 12px;max-width:calc(100% - 36px)}.play-wrap{min-width:37px}.play-copy{display:none}.palette-section{gap:10px}.palette-copy{width:57px}.palettes{gap:7px}.palette{width:21px;height:21px}.finale{padding:0 12px;gap:11px;font-size:10px}.footer{left:25px;right:25px;bottom:23px}.footer>span{display:none}.footer-center{font-size:7px;letter-spacing:.08em}.divider{height:25px}}
    @media(max-width:420px){.palette-copy{display:none}.dock{gap:12px}.intro h1{font-size:38px}.intro{bottom:151px}.intro p{max-width:200px;line-height:1.6}.act{bottom:154px}.eyebrow{letter-spacing:.12em}.finale{gap:9px}.header{inset:20px 21px auto}}
    @media(max-height:570px) and (min-width:761px){.header{top:21px}.intro{bottom:115px}.intro h1{font-size:37px}.eyebrow{margin-bottom:10px}.intro p{margin-top:10px}.act{bottom:118px}.dock{bottom:37px}.footer{bottom:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
<main id="experience" aria-label="Nightfall interactive fireworks display">
  <canvas id="sky" role="img" aria-label="Fireworks illuminating a starry night above a quiet bay. Click or tap the sky to launch a firework."></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header class="header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.15"><path d="M18 1v10M18 25v10M1 18h10M25 18h10M6 6l7 7M23 23l7 7M6 30l7-7M23 13l7-7M11.5 2.5l3.9 9.4M20.6 24.1l3.9 9.4M2.5 24.5l9.4-3.9M24.1 15.4l9.4-3.9M2.5 11.5l9.4 3.9M24.1 20.6l9.4 3.9M11.5 33.5l3.9-9.4M20.6 11.9l3.9-9.4"/></g><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>
      <div><div class="brand-name">NIGHTFALL</div><div class="brand-subtitle">A LITTLE WONDER, AFTER DARK</div></div>
    </div>
    <div class="header-tools">
      <button class="sound-button" id="sound" aria-label="Turn sound on" aria-pressed="false" title="Toggle sound (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><g class="sound-off"><path d="m16 9 6 6m0-6-6 6"/></g><g class="sound-on"><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></g></svg><span class="sound-copy" id="sound-label">SOUND OFF</span></button>
      <button class="icon-button" id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
    </div>
  </header>
  <div class="intro"><div class="eyebrow">AN OPEN INVITATION TO LOOK UP</div><h1>A moment.<br><em>A little magic.</em></h1><p>Touch the sky. Leave a little light.</p></div>
  <div class="act" aria-hidden="true"><div class="act-index" id="act-index">01</div><div class="act-name" id="act-name">THE FIRST LIGHT</div><div class="act-line"><div class="act-progress" id="act-progress"></div></div></div>
  <div class="dock" role="group" aria-label="Fireworks controls">
    <div class="play-wrap"><button class="play" id="play" aria-label="Pause show" aria-pressed="false" title="Play or pause (Space)"><svg class="pause-symbol" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10m6-10v10" stroke-width="2.5"/></svg><svg class="play-symbol" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6V4Z" fill="currentColor" stroke="none"/></svg></button><div class="play-copy"><div class="play-label" id="play-label">Enjoy the show</div><div class="live"><span class="live-dot"></span><span id="live-label">UNFOLDING LIVE</span></div></div></div>
    <div class="divider" aria-hidden="true"></div>
    <div class="palette-section"><div class="palette-copy"><div class="palette-kicker">COLOR STORY</div><div class="palette-name" id="palette-name">Golden hour</div></div><div class="palettes" role="group" aria-label="Color story"><button class="palette" data-palette="gold" aria-label="Golden hour colors" aria-pressed="true" title="Golden hour"></button><button class="palette" data-palette="rose" aria-label="Rose quartz colors" aria-pressed="false" title="Rose quartz"></button><button class="palette" data-palette="aurora" aria-label="Northern lights colors" aria-pressed="false" title="Northern lights"></button></div></div>
    <div class="divider" aria-hidden="true"></div>
    <button class="finale" id="finale" title="Launch a grand finale (F)"><span id="finale-label">Grand finale</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15 15 4M5 4h10v10"/></svg></button>
  </div>
  <footer class="footer"><span>EST. AT DUSK</span><div class="footer-center"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 1 9 7-5 1-2 5-2-13Zm5 9 3 4"/></svg>CLICK ANYWHERE IN THE SKY TO LAUNCH</div><span class="keyboard-hint">SPACE TO PAUSE &nbsp;·&nbsp; F FOR FINALE</span></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha: false });
  const trails = document.createElement('canvas');
  const fx = trails.getContext('2d');
  const backdrop = document.createElement('canvas');
  const bg = backdrop.getContext('2d');
  const playButton = document.getElementById('play');
  const soundButton = document.getElementById('sound');
  const finaleButton = document.getElementById('finale');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const palettes = {
    gold: { name: 'Golden hour', colors: [[255,211,139],[255,234,181],[116,218,202],[240,161,103]] },
    rose: { name: 'Rose quartz', colors: [[255,149,175],[244,207,202],[194,163,255],[255,190,140]] },
    aurora: { name: 'Northern lights', colors: [[128,247,204],[111,203,255],[191,155,255],[218,245,237]] }
  };
  let W=0,H=0,DPR=1,horizon=0,stars=[],rockets=[],sparks=[],smoke=[],flashes=[];
  let clock=0,lastTime=0,nextLaunch=1.2,paused=reduceMotion,hidden=false,frame=0;
  let palette='gold',shotNumber=0,finaleEnd=0,nextFinale=0,finaleStep=0;
  let audioContext=null,master=null,soundEnabled=false,noiseBuffer=null;
  let toastTimer=0,lastAct=-1,lastProgress=-1;
  const TAU=Math.PI*2;
  const rand=(min,max)=>min+Math.random()*(max-min);
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const rgba=(col,a)=>`rgba(${col[0]},${col[1]},${col[2]},${a})`;
  const colorFor=(n=shotNumber)=>palettes[palette].colors[n%palettes[palette].colors.length];

  function resize(){
    const oldW=W,oldH=H;
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.7);horizon=H*.815;
    for(const surface of [canvas,trails,backdrop]){surface.width=Math.round(W*DPR);surface.height=Math.round(H*DPR)}
    ctx.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0);bg.setTransform(DPR,0,0,DPR,0,0);
    if(oldW&&oldH){for(const list of [sparks,smoke,flashes])for(const p of list){p.x*=W/oldW;p.y*=H/oldH}for(const r of rockets){r.x*=W/oldW;r.y*=H/oldH;r.sx*=W/oldW;r.sy*=H/oldH;r.tx*=W/oldW;r.ty*=H/oldH}}
    stars=Array.from({length:Math.floor(W*H/5700)},()=>({x:rand(0,W),y:rand(H*.06,horizon*.9),r:rand(.35,1.1),a:rand(.13,.52),phase:rand(0,TAU)}));
    makeBackdrop();
    if(paused)render(0);
  }

  function makeBackdrop(){
    const sky=bg.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#040a13');sky.addColorStop(.48,'#091627');sky.addColorStop(.81,'#122431');sky.addColorStop(1,'#050e17');bg.fillStyle=sky;bg.fillRect(0,0,W,H);
    let haze=bg.createRadialGradient(W*.58,horizon*.9,0,W*.58,horizon*.9,W*.7);haze.addColorStop(0,'#18354345');haze.addColorStop(.5,'#10233510');haze.addColorStop(1,'#10233500');bg.fillStyle=haze;bg.fillRect(0,0,W,horizon);
    const mx=W*.83,my=H*.17,mr=Math.max(1.8,W*.0025);
    let moonGlow=bg.createRadialGradient(mx,my,1,mx,my,40);moonGlow.addColorStop(0,'#dee6d51b');moonGlow.addColorStop(1,'#b3c9d000');bg.fillStyle=moonGlow;bg.fillRect(mx-40,my-40,80,80);bg.fillStyle='#dddcd2';bg.beginPath();bg.arc(mx,my,mr,0,TAU);bg.fill();bg.fillStyle='#070f1b';bg.beginPath();bg.arc(mx+mr*.65,my-mr*.25,mr*.95,0,TAU);bg.fill();
    // Distant hills, islands, and a few amber windows give the light a place to land.
    for(let layer=0;layer<3;layer++){
      bg.fillStyle=['#0b1b28','#081722','#06121b'][layer];bg.beginPath();bg.moveTo(0,horizon+2);
      for(let x=0;x<=W+20;x+=15){const hill=Math.sin(x/W*10+layer*1.9)*Math.sin(x/W*4.5+layer)*H*.018;bg.lineTo(x,horizon-8-layer*3-hill-Math.sin(x*.004+layer)*H*.008)}bg.lineTo(W,horizon+4);bg.closePath();bg.fill();
    }
    bg.fillStyle='#06121c';
    for(let i=0;i<55;i++){let x=rand(0,W),width=rand(2,9),height=rand(2,10);bg.fillRect(x,horizon-height-1,width,height+3);if(i%4===0){bg.fillStyle='#dca76966';bg.fillRect(x+1,horizon-3,1.2,.8);bg.fillStyle='#06121c'}}
    bg.fillStyle='#71888717';bg.fillRect(0,horizon,W,.6);
    const water=bg.createLinearGradient(0,horizon,0,H);water.addColorStop(0,'#0c1b25');water.addColorStop(.5,'#08131e');water.addColorStop(1,'#050e17');bg.fillStyle=water;bg.fillRect(0,horizon+1,W,H-horizon);
    for(let i=0;i<100;i++){const y=rand(horizon+2,H);bg.strokeStyle=`rgba(84,117,135,${rand(.02,.07)})`;bg.lineWidth=.55;let x=rand(0,W);bg.beginPath();bg.moveTo(x,y);bg.lineTo(x+rand(8,90),y);bg.stroke()}
  }

  function launch(tx,ty,style,scale=1,color){
    if(rockets.length>26||sparks.length>2600)return;
    const sx=clamp(tx+rand(-W*.11,W*.11),W*.06,W*.94);
    rockets.push({sx,sy:horizon+3,tx:clamp(tx,W*.06,W*.94),ty:clamp(ty,H*.12,horizon-H*.08),x:sx,y:horizon+3,age:0,duration:rand(.82,1.23),style:style||(['peony','willow','peony','ring'][shotNumber%4]),scale,color:color||colorFor(),seed:rand(0,50)});
    shotNumber++;
  }

  function burst(x,y,style,scale,col,initial=false){
    const base=Math.min(W,H)*.20*scale;
    const count=Math.floor((style==='willow'?122:style==='ring'?115:132)*Math.min(1,W/850+.35));
    const velocity=base/(style==='willow'?1.1:.9);
    const secondary=style==='ring'?colorFor(shotNumber+1):col;
    for(let i=0;i<count;i++){
      let angle=rand(0,TAU),speed;
      if(style==='ring'){angle=i/count*TAU;speed=velocity*rand(.83,.98)}
      else if(style==='willow')speed=velocity*Math.pow(Math.random(),.34)*rand(.82,1.06);
      else speed=velocity*(i%4===0?rand(.2,.58):rand(.76,1.06));
      let life=style==='willow'?rand(2.1,3.5):rand(1.25,2.45);
      const c=style==='willow'?[255,205+Math.floor(rand(0,25)),133]:i%6===0?[255,239,206]:secondary;
      const vx=Math.cos(angle)*speed,vy=Math.sin(angle)*speed*(style==='ring'?.61:1);
      sparks.push({x,y,px:x,py:y,vx,vy,age:initial?rand(.12,.22):0,life,color:c,size:rand(.65,1.5),drag:style==='willow'?.79:.64,gravity:style==='willow'?28:36,twinkle:Math.random(),seed:rand(0,TAU),style});
    }
    // A dense, short-lived heart makes the break feel hot instead of hollow.
    for(let i=0;i<20;i++){let a=rand(0,TAU),v=rand(12,65);sparks.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rand(.35,.85),color:[255,241,214],size:rand(.65,1.2),drag:.5,gravity:30,twinkle:0,seed:0,style:'core'})}
    flashes.push({x,y,age:0,life:.38,color:col,r:base*.9});
    smoke.push({x,y,age:0,life:rand(5,8),r:base*.28,color:col});
    if(smoke.length>26)smoke.shift();
    if(!initial)explosionSound(scale);
  }

  function update(dt){
    clock+=dt;
    if(finaleEnd>clock){
      if(clock>nextFinale){
        const x=W*(.16+(finaleStep%6)*.136),y=H*(.21+Math.sin(finaleStep*1.7)*.07);
        launch(x,y,finaleStep%4===0?'willow':'peony',rand(.72,1.03));
        nextFinale=clock+.22;finaleStep++;
      }
    }else{
      if(finaleEnd){finaleEnd=0;finaleButton.disabled=false;document.getElementById('finale-label').textContent='Grand finale';nextLaunch=clock+2.4;toast('A little wonder goes a long way.')}
      if(clock>nextLaunch){
        const stage=Math.floor(clock/24)%3;
        const shots=stage===2?2:1;
        for(let i=0;i<shots;i++){
          const x=W*(.29+Math.random()*.45),y=H*rand(.22,.43);
          launch(x,y,undefined,rand(.8,1.12));
        }
        if(shotNumber%5===0){launch(W*.19,H*.37,'willow',.66);launch(W*.83,H*.39,'willow',.66)}
        nextLaunch=clock+rand(stage===2?1.0:1.4,stage===0?2.6:1.85);
      }
    }
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];r.age+=dt;let t=Math.min(1,r.age/r.duration),ease=1-Math.pow(1-t,1.45);r.px=r.x;r.py=r.y;r.x=r.sx+(r.tx-r.sx)*t;r.y=r.sy+(r.ty-r.sy)*ease;
      if(t>=1){burst(r.tx,r.ty,r.style,r.scale,r.color);rockets.splice(i,1)}
    }
    for(let i=sparks.length-1;i>=0;i--){
      const p=sparks[i];p.age+=dt;if(p.age>=p.life){sparks.splice(i,1);continue}
      p.px=p.x;p.py=p.y;const drag=Math.pow(p.drag,dt);p.vx*=drag;p.vy=p.vy*drag+p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    for(let i=smoke.length-1;i>=0;i--){let s=smoke[i];s.age+=dt;s.x+=dt*4;s.y-=dt*3;if(s.age>s.life)smoke.splice(i,1)}
    for(let i=flashes.length-1;i>=0;i--){flashes[i].age+=dt;if(flashes[i].age>flashes[i].life)flashes.splice(i,1)}
    updateAct();
  }

  function paintTrails(dt){
    fx.globalCompositeOperation='destination-out';fx.fillStyle=`rgba(0,0,0,${1-Math.exp(-dt*4.8)})`;fx.fillRect(0,0,W,H);fx.globalCompositeOperation='lighter';fx.lineCap='round';
    for(const r of rockets){
      const glow=fx.createRadialGradient(r.x,r.y,0,r.x,r.y,9);glow.addColorStop(0,'#fff8d8c0');glow.addColorStop(.2,'#efc58738');glow.addColorStop(1,'#efc58700');fx.fillStyle=glow;fx.fillRect(r.x-9,r.y-9,18,18);
      fx.strokeStyle='#f2c18dc0';fx.lineWidth=1.15;fx.beginPath();fx.moveTo(r.px??r.x,r.py??r.y);fx.lineTo(r.x,r.y);fx.stroke();
      for(let i=0;i<2;i++){fx.fillStyle=rgba([255,203,139],rand(.12,.45));fx.fillRect(r.x+rand(-1.9,1.9),r.y+rand(2,21),.8,rand(1,3))}
    }
    for(const p of sparks){
      let remaining=1-p.age/p.life;let alpha=Math.min(1,remaining*2.2);
      if(p.twinkle>.62&&p.age>p.life*.45)alpha*=.28+.72*Math.pow(Math.sin(p.age*25+p.seed),2);
      fx.strokeStyle=rgba(p.color,alpha*.72);fx.lineWidth=p.size*(.25+remaining*.6);
      fx.beginPath();fx.moveTo(p.px,p.py);fx.lineTo(p.x,p.y);fx.stroke();
      if(p.twinkle>.8||p.age<.09){fx.fillStyle=rgba(p.color,alpha*.11);fx.beginPath();fx.arc(p.x,p.y,p.size*3.6,0,TAU);fx.fill()}
      fx.fillStyle=rgba(p.age<.12?[255,249,232]:p.color,alpha);fx.fillRect(p.x-p.size*.4,p.y-p.size*.4,p.size*.8,p.size*.8);
    }
    fx.globalCompositeOperation='source-over';
  }

  function render(dt){
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(backdrop,0,0,W,H);
    for(const s of stars){ctx.fillStyle=`rgba(183,207,223,${s.a*(.75+.25*Math.sin(clock*.6+s.phase))})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
    for(const s of smoke){
      const size=s.r*(1+s.age*.35),opacity=Math.sin(Math.min(1,s.age/s.life)*Math.PI)*.045;
      const cloud=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,size);cloud.addColorStop(0,rgba(s.color,opacity));cloud.addColorStop(.45,rgba(s.color,opacity*.5));cloud.addColorStop(1,rgba(s.color,0));ctx.fillStyle=cloud;ctx.fillRect(s.x-size,s.y-size,size*2,size*2);
    }
    for(const f of flashes){const a=Math.pow(1-f.age/f.life,2)*.12;const glow=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);glow.addColorStop(0,rgba(f.color,a));glow.addColorStop(1,rgba(f.color,0));ctx.fillStyle=glow;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)}
    if(dt>0)paintTrails(dt);
    ctx.drawImage(trails,0,0,W,H);
    // Reflect the actual light in narrow, drifting strips across the bay.
    ctx.save();ctx.beginPath();ctx.rect(0,horizon+2,W,H-horizon-2);ctx.clip();
    for(let y=2;y<H-horizon;y+=3){
      const sourceY=horizon-y*5.8;if(sourceY<0)break;
      ctx.globalAlpha=.37*(1-y/(H-horizon)*.55)*(.65+.35*Math.sin(y*1.8+clock*1.3));
      const drift=Math.sin(y*.2+clock*1.2)*(1+y*.035)+Math.sin(y*.91-clock)*2;
      ctx.drawImage(trails,0,sourceY*DPR,W*DPR,Math.min(10*DPR,trails.height-sourceY*DPR),drift,horizon+y,W,2);
    }
    ctx.restore();ctx.globalAlpha=1;
  }

  function updateAct(){
    const act=finaleEnd>clock?3:Math.floor(clock/24)%3;
    if(act!==lastAct){document.getElementById('act-index').textContent=act===3?'✦':`0${act+1}`;document.getElementById('act-name').textContent=['THE FIRST LIGHT','A SKY IN BLOOM','LET IT LINGER','ONE LAST FLOURISH'][act];lastAct=act}
    const progress=act===3?Math.floor((1-(finaleEnd-clock)/8)*100):Math.floor((clock%24)/24*100);
    if(progress!==lastProgress){document.getElementById('act-progress').style.width=`${clamp(progress,0,100)}%`;lastProgress=progress}
  }

  function loop(now){
    const dt=Math.min(.035,(now-lastTime)/1000||.016);lastTime=now;
    if(!paused&&!hidden){update(dt);render(dt)}
    frame=requestAnimationFrame(loop);
  }

  function toast(message){
    const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2600);
  }

  function setPaused(value,announce=true){
    paused=value;playButton.setAttribute('aria-pressed',String(paused));playButton.setAttribute('aria-label',paused?'Play show':'Pause show');document.getElementById('play-label').textContent=paused?'Take a moment':'Enjoy the show';document.getElementById('live-label').textContent=paused?'SHOW PAUSED':'UNFOLDING LIVE';document.body.classList.toggle('is-paused',paused);
    if(audioContext&&master)master.gain.setTargetAtTime(soundEnabled&&!paused?.3:0,audioContext.currentTime,.1);
    if(announce)toast(paused?'The sky can wait.':'Let there be a little light.');
  }

  function grandFinale(){
    if(finaleEnd>clock)return;
    if(paused)setPaused(false,false);
    finaleEnd=clock+8;nextFinale=clock;finaleStep=0;finaleButton.disabled=true;document.getElementById('finale-label').textContent='Look up…';toast('For the next few seconds, just look up.');
  }

  async function toggleSound(){
    try{
      if(!audioContext){
        const Audio=window.AudioContext;if(!Audio){toast('Sound is unavailable in this browser.');return}
        audioContext=new Audio();master=audioContext.createGain();master.gain.value=0;master.connect(audioContext.destination);
        noiseBuffer=audioContext.createBuffer(1,audioContext.sampleRate*2.5,audioContext.sampleRate);let data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
      }
      await audioContext.resume();soundEnabled=!soundEnabled;master.gain.setTargetAtTime(soundEnabled&&!paused?.3:0,audioContext.currentTime,.1);soundButton.setAttribute('aria-pressed',String(soundEnabled));soundButton.setAttribute('aria-label',soundEnabled?'Turn sound off':'Turn sound on');document.getElementById('sound-label').textContent=soundEnabled?'SOUND ON':'SOUND OFF';
    }catch{toast('Sound could not start. Try again.');}
  }

  function explosionSound(scale){
    if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
    const t=audioContext.currentTime+.13;
    const noise=audioContext.createBufferSource();noise.buffer=noiseBuffer;
    const filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.setValueAtTime(1000,t);filter.frequency.exponentialRampToValueAtTime(100,t+1.8);
    const gain=audioContext.createGain();gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.29*scale,t+.014);gain.gain.exponentialRampToValueAtTime(.001,t+1.8);noise.connect(filter);filter.connect(gain);gain.connect(master);noise.start(t);noise.stop(t+2);
    const rumble=audioContext.createOscillator();rumble.type='sine';rumble.frequency.setValueAtTime(75,t);rumble.frequency.exponentialRampToValueAtTime(28,t+.5);const envelope=audioContext.createGain();envelope.gain.setValueAtTime(.17*scale,t);envelope.gain.exponentialRampToValueAtTime(.001,t+.85);rumble.connect(envelope);envelope.connect(master);rumble.start(t);rumble.stop(t+1);
    noise.onended=()=>{noise.disconnect();filter.disconnect();gain.disconnect()};rumble.onended=()=>{rumble.disconnect();envelope.disconnect()};
  }

  canvas.addEventListener('pointerdown',event=>{
    const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;
    if(y>horizon-25){toast('Aim a little higher — the sky is yours.');return}
    if(paused)setPaused(false,false);
    launch(x,y,undefined,rand(.9,1.12));nextLaunch=Math.max(nextLaunch,clock+1.8);
  });
  playButton.addEventListener('click',()=>setPaused(!paused));
  soundButton.addEventListener('click',toggleSound);
  finaleButton.addEventListener('click',grandFinale);
  document.querySelectorAll('.palette').forEach(button=>button.addEventListener('click',()=>{
    palette=button.dataset.palette;document.getElementById('palette-name').textContent=palettes[palette].name;
    document.querySelectorAll('.palette').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    if(paused)setPaused(false,false);
    launch(W*.49,H*.29,'peony',1.08,colorFor(0));launch(W*.68,H*.39,'peony',.7,colorFor(2));nextLaunch=clock+2.5;
  }));
  document.getElementById('fullscreen').addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Fullscreen is unavailable in this browser.')}catch{toast('Fullscreen is unavailable in this browser.')}
  });
  document.addEventListener('fullscreenchange',()=>{const b=document.getElementById('fullscreen');b.setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');b.title=document.fullscreenElement?'Exit fullscreen':'Fullscreen'});
  document.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
    if(event.code==='Space'&&event.target.tagName!=='BUTTON'){event.preventDefault();setPaused(!paused)}
    else if(event.key.toLowerCase()==='f')grandFinale();else if(event.key.toLowerCase()==='m')toggleSound();
  });
  document.addEventListener('visibilitychange',()=>{hidden=document.hidden;if(master&&audioContext)master.gain.setTargetAtTime(soundEnabled&&!paused&&!hidden?.3:0,audioContext.currentTime,.1)});
  window.addEventListener('resize',resize);
  resize();
  // Open on a living composition, then let the pacing breathe.
  burst(W*.51,H*.28,'willow',1.10,palettes.gold.colors[0],true);
  burst(W*.72,H*.36,'peony',.76,palettes.gold.colors[2],true);
  for(let i=0;i<28;i++){update(.016);paintTrails(.016)}
  launch(W*.32,H*.36,'peony',.9,palettes.gold.colors[1]);
  render(0);setPaused(paused,false);
  if(reduceMotion)toast('Motion is paused. Press play whenever you’re ready.');
  frame=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
