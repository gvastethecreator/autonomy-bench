<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>Red Raven</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07060c;
    overflow: hidden;
    color: #f6efe4;
  }
  body {
    min-height: 100dvh;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #vignette, #rush {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #vignette {
    background:
      radial-gradient(ellipse at center, transparent 46%, rgba(0, 0, 0, 0.42) 100%),
      linear-gradient(to top, rgba(0, 0, 0, 0.38), transparent 24%);
  }
  #rush {
    background: radial-gradient(ellipse at center, transparent 40%, rgba(70, 16, 18, 0.55) 100%);
    opacity: 0;
  }
  #hud {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-right)) 22px max(22px, env(safe-area-inset-left));
    pointer-events: none;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
  }
  #brand strong {
    display: block;
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  #brand span {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.72;
  }
  #readout { text-align: right; font-variant-numeric: tabular-nums; }
  #spd { font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
  #readout small { font-size: 12px; letter-spacing: 0.12em; opacity: 0.75; }
  #lap { margin-top: 4px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%);
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.8;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    animation: fadehint 8s ease forwards;
  }
  @keyframes fadehint {
    0%, 50% { opacity: 0.78; }
    100% { opacity: 0; }
  }
  #sound {
    position: fixed;
    left: 50%;
    bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    border: 1px solid rgba(255, 236, 214, 0.38);
    background: rgba(10, 8, 14, 0.62);
    color: #fff6ea;
    font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 13px 18px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: opacity 0.6s ease;
  }
  #sound.is-on { opacity: 0; pointer-events: none; }
  #fail {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 24px;
    text-align: center;
    font: 18px/1.5 Georgia, serif;
    background: #07060c;
  }
  #fail[hidden] { display: none; }
  @media (max-width: 640px) {
    #brand span { display: none; }
    #spd { font-size: 22px; }
    #hint { bottom: 108px; }
  }
</style>
</head>
<body>
<div id="vignette" aria-hidden="true"></div>
<div id="rush" aria-hidden="true"></div>
<div id="hud">
  <div id="brand">
    <strong>Red Raven</strong>
    <span>Continuous night ride</span>
  </div>
  <div id="readout">
    <div><b id="spd">24</b><small> km/h</small></div>
    <div id="lap">Lap 1</div>
  </div>
</div>
<p id="hint">Drag to look around</p>
<button id="sound" type="button">Enable sound</button>
<p id="fail" hidden>This ride needs WebGL and the Three.js library from the network.</p>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  const fail = document.getElementById('fail');
  if (!window.THREE) {
    fail.hidden = false;
    return;
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = Math.min(window.innerWidth, window.innerHeight) < 780;
  const shadows = !small;

  const CREST = 68;
  const TRACK_Y = 9;
  const TURN_R = 60;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoother(t) { return t * t * (3 - 2 * t); }
  function smoothstep(e0, e1, x) {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function graded(t) {
    const k = 0.82;
    return t - (k * Math.sin(Math.PI * 2 * t)) / (Math.PI * 2);
  }
  function bankProfile(t, amount) {
    const edge = 0.16;
    let k = 1;
    if (t < edge) k = smoother(t / edge);
    else if (t > 1 - edge) k = smoother((1 - t) / edge);
    return amount * k;
  }
  function dropY(t, y0) {
    const y1 = 6.2;
    let k;
    if (t < 0.12) {
      const u = t / 0.12;
      k = 0.045 * u * u;
    } else if (t < 0.66) {
      const u = (t - 0.12) / 0.54;
      k = 0.045 + 0.89 * u;
    } else {
      const u = (t - 0.66) / 0.34;
      k = 0.935 + 0.065 * smoother(u);
    }
    return y0 + (y1 - y0) * k;
  }
  function hash2(ix, iz) {
    let n = Math.imul(ix, 374761393) + Math.imul(iz, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, z) {
    const ix = Math.floor(x);
    const iz = Math.floor(z);
    const fx = x - ix;
    const fz = z - iz;
    const ux = smoother(fx);
    const uz = smoother(fz);
    const a = hash2(ix, iz);
    const b = hash2(ix + 1, iz);
    const c = hash2(ix, iz + 1);
    const d = hash2(ix + 1, iz + 1);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uz);
  }
  function fbm(x, z) {
    let v = 0;
    let a = 0.5;
    let f = 1;
    for (let i = 0; i < 4; i++) {
      v += a * vnoise(x * f, z * f);
      f *= 2;
      a *= 0.5;
    }
    return v;
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
  } catch (err) {
    fail.hidden = false;
    return;
  }

  renderer.setClearColor(0x1c2436, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.shadowMap.enabled = shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const FOG = new THREE.Color(0x1c2436);
  scene.fog = new THREE.FogExp2(FOG, 0.0044);

  const camera = new THREE.PerspectiveCamera(67, 1, 0.12, 2200);
  scene.add(camera);

  function resize() {
    const w = window.innerWidth;
    const h = Math.max(1, window.innerHeight);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.25 : 1.5));
    renderer.setSize(w, h, false);
  }
  resize();
  window.addEventListener('resize', resize);

  const moonDir = new THREE.Vector3(-0.34, 0.47, 0.74).normalize();

  function makeEnv() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 128;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 128);
    grd.addColorStop(0, '#070914');
    grd.addColorStop(0.34, '#243456');
    grd.addColorStop(0.48, '#f0a06a');
    grd.addColorStop(0.56, '#1a3048');
    grd.addColorStop(1, '#0c0e14');
    g.fillStyle = grd;
    g.fillRect(0, 0, 256, 128);
    g.fillStyle = '#fff4d2';
    g.beginPath();
    g.arc(168, 40, 7, 0, Math.PI * 2);
    g.fill();
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose();
    tex.dispose();
    return env;
  }
  scene.environment = makeEnv();

  const hemi = new THREE.HemisphereLight(0x8ea4dc, 0x3a2a22, 0.62);
  scene.add(hemi);
  scene.add(new THREE.AmbientLight(0x223048, 0.18));

  const moon = new THREE.DirectionalLight(0xd5e2ff, 3.7);
  moon.position.copy(moonDir).multiplyScalar(160);
  moon.castShadow = shadows;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.near = 20;
  moon.shadow.camera.far = 320;
  moon.shadow.camera.left = -90;
  moon.shadow.camera.right = 90;
  moon.shadow.camera.top = 90;
  moon.shadow.camera.bottom = -90;
  moon.shadow.bias = -0.0002;
  moon.shadow.normalBias = 0.04;
  scene.add(moon);
  scene.add(moon.target);

  const fill = new THREE.DirectionalLight(0xffb184, 0.55);
  fill.position.set(70, 24, -50);
  scene.add(fill);

  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x070914) },
      midColor: { value: new THREE.Color(0x1a2b4a) },
      horColor: { value: new THREE.Color(0xe08a55) },
      fogColor: { value: FOG.clone() },
      moonDir: { value: moonDir.clone() }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vDir = world.xyz - cameraPosition;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      precision highp float;
      varying vec3 vDir;
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 horColor;
      uniform vec3 fogColor;
      uniform vec3 moonDir;
      float starField(vec3 dir) {
        vec3 p = dir * 170.0;
        vec3 id = floor(p);
        vec3 f = fract(p) - 0.5;
        float n = fract(sin(dot(id, vec3(127.1, 311.7, 74.7))) * 43758.5453);
        float spark = step(0.992, n);
        float s = smoothstep(0.045, 0.008, length(f));
        return spark * s * smoothstep(0.02, 0.28, dir.y);
      }
      void main() {
        vec3 dir = normalize(vDir);
        float h = dir.y;
        vec3 col = mix(horColor, midColor, smoothstep(0.0, 0.22, h));
        col = mix(col, topColor, smoothstep(0.16, 0.75, h));
        col = mix(fogColor, col, smoothstep(-0.12, 0.05, h));
        float moon = dot(dir, normalize(moonDir));
        col += vec3(1.0, 0.94, 0.82) * smoothstep(0.9985, 0.99955, moon);
        col += vec3(1.0, 0.72, 0.42) * pow(max(moon, 0.0), 28.0) * 0.42;
        col += vec3(1.0, 0.82, 0.6) * pow(max(moon, 0.0), 6.0) * 0.12;
        col += starField(dir) * vec3(0.85, 0.9, 1.0);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1600, 32, 20), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);

  const matTrack = new THREE.MeshStandardMaterial({
    color: 0xb4162c, roughness: 0.46, metalness: 0.42, envMapIntensity: 0.7
  });
  const matRail = new THREE.MeshStandardMaterial({
    color: 0xd2d7e1, roughness: 0.22, metalness: 0.74, envMapIntensity: 1
  });
  const matTie = new THREE.MeshStandardMaterial({
    color: 0x2c261f, roughness: 0.88, metalness: 0.06
  });
  const matSteel = new THREE.MeshStandardMaterial({
    color: 0x727b86, roughness: 0.58, metalness: 0.5, envMapIntensity: 0.45
  });
  const matWood = new THREE.MeshStandardMaterial({
    color: 0x5a4032, roughness: 0.86, metalness: 0.04
  });
  const matBuilding = new THREE.MeshStandardMaterial({
    color: 0x2a2428, roughness: 0.92, metalness: 0.05
  });
  const matLeaf = new THREE.MeshStandardMaterial({ color: 0x1b2b19, roughness: 0.92 });
  const matTrunk = new THREE.MeshStandardMaterial({ color: 0x2e241c, roughness: 0.94 });
  const matRock = new THREE.MeshStandardMaterial({ color: 0x3a342f, roughness: 0.94, metalness: 0.05 });
  const matMount = new THREE.MeshStandardMaterial({ color: 0x171c2c, roughness: 1 });
  const matTunnelIn = new THREE.MeshStandardMaterial({
    color: 0x100e0c, roughness: 1, side: THREE.DoubleSide
  });
  const matTunnelOut = new THREE.MeshStandardMaterial({
    color: 0x322a26, roughness: 0.96, side: THREE.DoubleSide
  });
  const matDog = new THREE.MeshStandardMaterial({
    color: 0xf0c14a, emissive: 0xc48a18, emissiveIntensity: 0.4, roughness: 0.45, metalness: 0.2
  });
  const matBeacon = new THREE.MeshStandardMaterial({
    color: 0xff3344, emissive: 0xff2233, emissiveIntensity: 1.45, roughness: 0.35
  });
  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0xfff1d4, emissive: 0xffc27a, emissiveIntensity: 1.25, roughness: 0.32
  });
  const stripMat = new THREE.MeshStandardMaterial({
    color: 0xffe2b0, emissive: 0xffb15c, emissiveIntensity: 0.9, roughness: 0.4
  });
  const matIvory = new THREE.MeshStandardMaterial({
    color: 0xf3efe4, roughness: 0.42, metalness: 0.18, envMapIntensity: 0.45
  });
  const matCherry = new THREE.MeshStandardMaterial({
    color: 0xc31224, roughness: 0.4, metalness: 0.22, envMapIntensity: 0.4
  });
  const matDark = new THREE.MeshStandardMaterial({
    color: 0x1a1718, roughness: 0.55, metalness: 0.35
  });
  const matBar = new THREE.MeshStandardMaterial({
    color: 0xcfd3d8, roughness: 0.25, metalness: 0.72, envMapIntensity: 0.8
  });
  const matCab = new THREE.MeshStandardMaterial({
    color: 0xf4efe2, roughness: 0.5, metalness: 0.12
  });
  const winMat = new THREE.MeshStandardMaterial({
    color: 0xffd2a2, emissive: 0xffb060, emissiveIntensity: 0.95, roughness: 0.4
  });

  const pts = [];
  const zones = [];
  const banks = [];
  const rolls = [];
  let x = 0, y = TRACK_Y, z = 0, H = 0;

  function pushPoint(zone, bank, roll) {
    const p = new THREE.Vector3(x, y, z);
    if (pts.length && p.distanceTo(pts[pts.length - 1]) < 0.08) return;
    pts.push(p);
    zones.push(zone);
    banks.push(bank);
    rolls.push(roll);
  }

  function straight(len, yFn, zone) {
    const steps = Math.max(2, Math.round(len / 2));
    const x0 = x, y0 = y, z0 = z;
    const hx = Math.sin(H);
    const hz = Math.cos(H);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      x = x0 + hx * len * t;
      z = z0 + hz * len * t;
      y = yFn(t, y0);
      pushPoint(zone, 0, 0);
    }
  }

  function turnRight(angle, radius, yFn, zone, bankAmount) {
    const steps = Math.max(16, Math.round((Math.abs(angle) * radius) / 1.8));
    const H0 = H;
    const y0 = y;
    const rightX = Math.cos(H0);
    const rightZ = -Math.sin(H0);
    const cx = x + rightX * radius;
    const cz = z + rightZ * radius;
    const ox0 = x - cx;
    const oz0 = z - cz;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const phi = angle * t;
      const cos = Math.cos(phi);
      const sin = Math.sin(phi);
      x = cx + ox0 * cos + oz0 * sin;
      z = cz + (-ox0 * sin + oz0 * cos);
      H = H0 + phi;
      y = yFn(t, y0);
      pushPoint(zone, bankProfile(t, bankAmount), 0);
    }
  }

  // r = r0 + a cos(theta). Keep a/r0 near 0.6 so the loop stays open.
  function verticalLoop(r0, a) {
    const steps = 160;
    const entryX = x, entryY = y, entryZ = z;
    const fx = Math.sin(H);
    const fz = Math.cos(H);
    for (let i = 1; i <= steps; i++) {
      const th = (i / steps) * Math.PI * 2;
      const sn = Math.sin(th);
      const cs = Math.cos(th);
      const f = r0 * sn + (a / 2) * th + (a / 4) * Math.sin(2 * th);
      const u = r0 * (1 - cs) + (a / 2) * sn * sn;
      x = entryX + fx * f;
      z = entryZ + fz * f;
      y = entryY + u;
      pushPoint('loop', 0, 0);
    }
  }

  function corkscrew(len, yEnd) {
    const steps = Math.max(28, Math.round(len / 1.35));
    const x0 = x, y0 = y, z0 = z;
    const hx = Math.sin(H);
    const hz = Math.cos(H);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      x = x0 + hx * len * t;
      z = z0 + hz * len * t;
      y = lerp(y0, yEnd, smoother(t));
      pushPoint('coast', 0, -Math.PI * 2 * smoother(t));
    }
  }

  function closeBrake() {
    const sx = pts[0].x, sy = pts[0].y, sz = pts[0].z;
    const x0 = x, y0 = y, z0 = z;
    const dx = Math.sin(H), dz = Math.cos(H);
    const dist = Math.hypot(sx - x0, sz - z0);
    if (dist < 1) return;
    const steps = Math.max(8, Math.round(dist / 2));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const t2 = t * t;
      const t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1;
      const h10 = t3 - 2 * t2 + t;
      const h01 = -2 * t3 + 3 * t2;
      const h11 = t3 - t2;
      x = h00 * x0 + h10 * dx * dist + h01 * sx;
      z = h00 * z0 + h10 * dz * dist + h01 * sz + h11 * dist;
      y = y0 + (sy - y0) * smoother(t);
      pushPoint('brake', 0, 0);
    }
    x = sx;
    y = sy;
    z = sz;
    H = 0;
  }

  pushPoint('station', 0, 0);
  straight(38, function () { return TRACK_Y; }, 'station');
  straight(150, function (t, y0) { return lerp(y0, CREST, graded(t)); }, 'lift');
  straight(16, function () { return CREST; }, 'coast');
  straight(102, dropY, 'coast');
  turnRight(Math.PI, TURN_R, function (t, y0) {
    return lerp(y0, 6.5, t) - Math.sin(Math.PI * t) * 4.85;
  }, 'lake', 1.0);
  straight(24, function (t, y0) { return lerp(y0, 6.6, t); }, 'coast');
  straight(92, function (t, y0) {
    return lerp(y0, 6.6, t) + Math.pow(Math.sin(Math.PI * t), 0.72) * 16.5;
  }, 'coast');
  straight(74, function (t, y0) { return lerp(y0, 7.1, t); }, 'tunnel');
  straight(18, function (t, y0) { return y0; }, 'coast');
  verticalLoop(13.2, 7.92);
  straight(16, function (t, y0) { return y0; }, 'coast');
  corkscrew(68, 12);
  straight(56, function (t, y0) {
    const hump = Math.pow(Math.max(0, Math.sin(t * Math.PI * 4)), 0.85);
    return lerp(y0, 7.6, smoother(t)) + hump * 4.5;
  }, 'coast');
  turnRight(Math.PI, TURN_R, function (t, y0) { return lerp(y0, 8.6, t); }, 'coast', 0.82);
  closeBrake();

  const n = pts.length;
  const tangents = [];
  for (let i = 0; i < n; i++) {
    const prev = pts[(i - 1 + n) % n];
    const next = pts[(i + 1) % n];
    const t = next.clone().sub(prev);
    if (t.lengthSq() < 1e-8) t.set(Math.sin(0), 0, 1);
    tangents.push(t.normalize());
  }

  const ups = new Array(n);
  let upCarry = new THREE.Vector3(0, 1, 0);
  if (Math.abs(upCarry.dot(tangents[0])) > 0.9) upCarry.set(1, 0, 0);
  upCarry.addScaledVector(tangents[0], -upCarry.dot(tangents[0])).normalize();
  for (let i = 0; i < n; i++) {
    if (i > 0) {
      const a = tangents[i - 1];
      const b = tangents[i];
      const axis = new THREE.Vector3().crossVectors(a, b);
      const sin = axis.length();
      const cos = clamp(a.dot(b), -1, 1);
      if (sin > 1e-5) {
        axis.multiplyScalar(1 / sin);
        upCarry.applyAxisAngle(axis, Math.atan2(sin, cos));
      }
    }
    upCarry.addScaledVector(tangents[i], -upCarry.dot(tangents[i])).normalize();
    ups[i] = upCarry.clone();
  }
  {
    let upEnd = ups[n - 1].clone();
    const a = tangents[n - 1];
    const b = tangents[0];
    const axis = new THREE.Vector3().crossVectors(a, b);
    const sin = axis.length();
    const cos = clamp(a.dot(b), -1, 1);
    if (sin > 1e-5) {
      axis.multiplyScalar(1 / sin);
      upEnd.applyAxisAngle(axis, Math.atan2(sin, cos));
    }
    upEnd.addScaledVector(b, -upEnd.dot(b)).normalize();
    const crs = new THREE.Vector3().crossVectors(upEnd, ups[0]);
    const sAng = Math.atan2(crs.dot(b), clamp(upEnd.dot(ups[0]), -1, 1));
    if (Math.abs(sAng) > 1e-4) {
      for (let i = 0; i < n; i++) {
        ups[i].applyAxisAngle(tangents[i], -sAng * (i / n));
        ups[i].addScaledVector(tangents[i], -ups[i].dot(tangents[i])).normalize();
      }
    }
  }
  for (let i = 0; i < n; i++) {
    const extra = banks[i] + rolls[i];
    if (Math.abs(extra) > 1e-5) {
      ups[i].applyAxisAngle(tangents[i], -extra);
      ups[i].addScaledVector(tangents[i], -ups[i].dot(tangents[i])).normalize();
    }
  }
  const rights = [];
  for (let i = 0; i < n; i++) {
    rights.push(new THREE.Vector3().crossVectors(ups[i], tangents[i]).normalize());
  }

  const cum = new Float32Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + pts[i].distanceTo(pts[i - 1]);
  const total = cum[n - 1] + pts[n - 1].distanceTo(pts[0]);

  function locate(dist) {
    dist = ((dist % total) + total) % total;
    let lo = 0;
    let hi = n - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (cum[mid] <= dist) lo = mid;
      else hi = mid - 1;
    }
    const i = lo;
    const j = (i + 1) % n;
    const startD = cum[i];
    const endD = j === 0 ? total : cum[j];
    const seg = endD - startD;
    const f = seg > 1e-5 ? (dist - startD) / seg : 0;
    return { i: i, j: j, f: f };
  }

  function heightAt(dist) {
    const loc = locate(dist);
    return lerp(pts[loc.i].y, pts[loc.j].y, loc.f);
  }

  const poseRight = new THREE.Vector3();
  const poseUp = new THREE.Vector3();
  const poseTan = new THREE.Vector3();
  const posePos = new THREE.Vector3();
  function pose(dist) {
    const loc = locate(dist);
    posePos.copy(pts[loc.i]).lerp(pts[loc.j], loc.f);
    poseUp.copy(ups[loc.i]).lerp(ups[loc.j], loc.f);
    poseTan.copy(pts[loc.j]).sub(pts[loc.i]);
    if (poseTan.lengthSq() < 1e-8) poseTan.copy(tangents[loc.i]);
    poseTan.normalize();
    poseUp.addScaledVector(poseTan, -poseUp.dot(poseTan));
    if (poseUp.lengthSq() < 1e-6) poseUp.copy(ups[loc.i]);
    poseUp.normalize();
    poseRight.crossVectors(poseUp, poseTan);
    if (poseRight.lengthSq() < 1e-8) poseRight.set(1, 0, 0);
    else poseRight.normalize();
    const zone = loc.f < 0.5 ? zones[loc.i] : zones[loc.j];
    return {
      pos: posePos.clone(),
      tangent: poseTan.clone(),
      up: poseUp.clone(),
      right: poseRight.clone(),
      zone: zone,
      i: loc.i
    };
  }

  let lake = { x: 60, z: 280, r: 70 };
  {
    let lx = 0, lz = 0, lc = 0, maxD = 0;
    for (let i = 0; i < n; i++) {
      if (zones[i] !== 'lake') continue;
      lx += pts[i].x;
      lz += pts[i].z;
      lc++;
    }
    if (lc) {
      lx /= lc;
      lz /= lc;
      for (let i = 0; i < n; i++) {
        if (zones[i] !== 'lake') continue;
        maxD = Math.max(maxD, Math.hypot(pts[i].x - lx, pts[i].z - lz));
      }
      lake = { x: lx, z: lz, r: maxD + 24 };
    }
  }

  const G = 180;
  const G0 = -520;
  const GS = (G - 1) / 1040;
  const flatGrid = new Float32Array(G * G);
  function stamp(wx, wz, radius, weight) {
    const cx = Math.round((wx - G0) * GS);
    const cz = Math.round((wz - G0) * GS);
    const rad = Math.ceil(radius * GS);
    for (let iz = cz - rad; iz <= cz + rad; iz++) {
      if (iz < 0 || iz >= G) continue;
      for (let ix = cx - rad; ix <= cx + rad; ix++) {
        if (ix < 0 || ix >= G) continue;
        const sx = G0 + ix / GS;
        const sz = G0 + iz / GS;
        const d = Math.hypot(sx - wx, sz - wz);
        if (d >= radius) continue;
        const k = weight * (1 - smoothstep(radius * 0.42, radius, d));
        const idx = iz * G + ix;
        if (k > flatGrid[idx]) flatGrid[idx] = k;
      }
    }
  }
  function flattenAt(wx, wz) {
    const gx = (wx - G0) * GS;
    const gz = (wz - G0) * GS;
    const ix = Math.floor(gx);
    const iz = Math.floor(gz);
    if (ix < 0 || iz < 0 || ix >= G - 1 || iz >= G - 1) return 0;
    const fx = gx - ix;
    const fz = gz - iz;
    const i00 = iz * G + ix;
    return lerp(
      lerp(flatGrid[i00], flatGrid[i00 + 1], fx),
      lerp(flatGrid[i00 + G], flatGrid[i00 + G + 1], fx),
      fz
    );
  }
  for (let i = 0; i < n; i += 1) stamp(pts[i].x, pts[i].z, 16, 1);
  stamp(0, 20, 28, 1);
  stamp(lake.x, lake.z, lake.r * 0.92, 1);

  function groundHeight(wx, wz) {
    let h = (fbm(wx * 0.011, wz * 0.011) - 0.5) * 8.2;
    h *= 1 - flattenAt(wx, wz);
    const ld = Math.hypot(wx - lake.x, wz - lake.z);
    if (ld < lake.r + 12) {
      const k = 1 - smoothstep(lake.r - 8, lake.r + 12, ld);
      h = lerp(h, -0.45, k);
    }
    if (flattenAt(wx, wz) < 0.15 && h > 4.5) h = 4.5;
    return h;
  }

  function farFromTrack(wx, wz, minD) {
    const minD2 = minD * minD;
    for (let i = 0; i < n; i += 2) {
      const dx = pts[i].x - wx;
      const dz = pts[i].z - wz;
      if (dx * dx + dz * dz < minD2) return false;
    }
    return true;
  }

  const groundGeo = new THREE.PlaneGeometry(1040, 1040, small ? 90 : 140, small ? 90 : 140);
  groundGeo.rotateX(-Math.PI / 2);
  const gPos = groundGeo.attributes.position;
  const gColors = new Float32Array(gPos.count * 3);
  const tint = new THREE.Color();
  const grass = new THREE.Color(0x243226);
  const grassDark = new THREE.Color(0x141c14);
  const sand = new THREE.Color(0x4a4032);
  const mud = new THREE.Color(0x2a241c);
  for (let i = 0; i < gPos.count; i++) {
    const wx = gPos.getX(i);
    const wz = gPos.getZ(i);
    const h = groundHeight(wx, wz);
    gPos.setY(i, h);
    const noise = fbm(wx * 0.02, wz * 0.02);
    tint.copy(grass).lerp(grassDark, clamp(noise, 0, 1) * 0.65);
    const shore = 1 - smoothstep(lake.r - 2, lake.r + 18, Math.hypot(wx - lake.x, wz - lake.z));
    tint.lerp(sand, shore * 0.82);
    if (h < 0.05) tint.lerp(mud, 0.45);
    gColors[i * 3] = tint.r;
    gColors[i * 3 + 1] = tint.g;
    gColors[i * 3 + 2] = tint.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(gColors, 3));
  groundGeo.computeVertexNormals();
  const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.94, metalness: 0.02, envMapIntensity: 0.18
  }));
  ground.receiveShadow = shadows;
  scene.add(ground);

  const waterMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      time: { value: 0 },
      moon: { value: moonDir.clone() },
      deepColor: { value: new THREE.Color(0x0b333c) },
      shallowColor: { value: new THREE.Color(0x1d6d74) }
    },
    vertexShader: `
      uniform float time;
      varying vec3 vW;
      varying vec3 vN;
      void main() {
        vec3 p = position;
        float wx = sin(p.x * 0.16 + time * 1.35) * 0.14 + cos(p.y * 0.21 - time * 0.95) * 0.1;
        p.z += wx;
        vec4 wpos = modelMatrix * vec4(p, 1.0);
        vW = wpos.xyz;
        vec3 n = normalize(vec3(
          -0.0224 * cos(p.x * 0.16 + time * 1.35),
          0.021 * sin(p.y * 0.21 - time * 0.95),
          1.0
        ));
        vN = normalize(mat3(modelMatrix) * n);
        gl_Position = projectionMatrix * viewMatrix * wpos;
      }
    `,
    fragmentShader: `
      precision highp float;
      varying vec3 vW;
      varying vec3 vN;
      uniform vec3 moon;
      uniform vec3 deepColor;
      uniform vec3 shallowColor;
      void main() {
        vec3 n = normalize(vN);
        vec3 view = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(0.0, dot(n, view)), 2.5);
        vec3 col = mix(deepColor, shallowColor, fres);
        vec3 ref = reflect(-view, n);
        float spec = pow(max(0.0, dot(normalize(ref), normalize(moon))), 70.0);
        col += vec3(1.0, 0.86, 0.68) * spec * 0.9;
        gl_FragColor = vec4(col, 0.62 + fres * 0.28);
      }
    `
  });
  const water = new THREE.Mesh(new THREE.CircleGeometry(lake.r, 72), waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(lake.x, 0.62, lake.z);
  scene.add(water);

  function railPoints(side) {
    const arr = [];
    for (let i = 0; i < n; i++) {
      arr.push(pts[i].clone()
        .addScaledVector(rights[i], side * 0.58)
        .addScaledVector(ups[i], -0.2));
    }
    return arr;
  }
  function addRail(side) {
    const curve = new THREE.CatmullRomCurve3(railPoints(side), true, 'centripetal', 0.5);
    const geo = new THREE.TubeGeometry(curve, n, 0.075, 6, true);
    const mesh = new THREE.Mesh(geo, matRail);
    mesh.castShadow = shadows;
    mesh.receiveShadow = shadows;
    scene.add(mesh);
  }
  addRail(1);
  addRail(-1);

  const dummy = new THREE.Object3D();
  const q = new THREE.Quaternion();
  const basis = new THREE.Matrix4();
  function orient(xAxis, yAxis, zAxis) {
    basis.makeBasis(xAxis, yAxis, zAxis);
    q.setFromRotationMatrix(basis);
    return q;
  }
  function addInstances(geo, mat, cap) {
    const mesh = new THREE.InstancedMesh(geo, mat, cap);
    mesh.frustumCulled = false;
    mesh.castShadow = shadows;
    mesh.receiveShadow = shadows;
    mesh.count = 0;
    scene.add(mesh);
    return mesh;
  }
  const tieMesh = addInstances(new THREE.BoxGeometry(1, 1, 1), matTie, 900);
  const spineMesh = addInstances(new THREE.BoxGeometry(1, 1, 1), matTrack, 900);
  const supportMesh = addInstances(new THREE.BoxGeometry(1, 1, 1), matSteel, 700);
  const catMesh = addInstances(new THREE.BoxGeometry(1, 1, 1), matSteel, 120);
  const dogMesh = addInstances(new THREE.BoxGeometry(1, 1, 1), matDog, 220);
  let tieN = 0, spineN = 0, supportN = 0, catN = 0, dogN = 0;
  let nextTie = 0.3, nextSupport = 3, nextCat = 2, nextDog = 0.4, nextLamp = 6, nextBeacon = 12;
  const lampSpots = [];
  const beaconSpots = [];

  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const a = pts[i];
    const b = pts[j];
    const segLen = a.distanceTo(b);
    if (segLen < 0.05) continue;
    const mid = a.clone().lerp(b, 0.5);
    const tan = b.clone().sub(a).normalize();
    const upv = ups[i].clone().lerp(ups[j], 0.5).normalize();
    upv.addScaledVector(tan, -upv.dot(tan)).normalize();
    const right = new THREE.Vector3().crossVectors(upv, tan).normalize();
    const dist = cum[i] + segLen * 0.5;
    const zone = zones[i];

    if (spineN < 900) {
      const pos = mid.clone().addScaledVector(upv, -0.55);
      orient(right, upv, tan);
      dummy.position.copy(pos);
      dummy.quaternion.copy(q);
      dummy.scale.set(0.36, 0.4, segLen * 1.04);
      dummy.updateMatrix();
      spineMesh.setMatrixAt(spineN++, dummy.matrix);
    }

    if (dist >= nextTie && tieN < 900) {
      nextTie += 2.35;
      orient(right, upv, tan);
      dummy.position.copy(mid).addScaledVector(upv, -0.18);
      dummy.quaternion.copy(q);
      dummy.scale.set(1.48, 0.08, 0.28);
      dummy.updateMatrix();
      tieMesh.setMatrixAt(tieN++, dummy.matrix);
    }

    if (zone === 'lift' && dist >= nextDog && dogN < 220) {
      nextDog += 1.05;
      orient(right, upv, tan);
      dummy.position.copy(mid).addScaledVector(upv, -0.02);
      dummy.quaternion.copy(q);
      dummy.scale.set(0.16, 0.05, 0.26);
      dummy.updateMatrix();
      dogMesh.setMatrixAt(dogN++, dummy.matrix);
    }

    if (zone === 'lift' && dist >= nextCat && catN < 120) {
      nextCat += 3.1;
      orient(right, upv, tan);
      dummy.position.copy(mid).addScaledVector(right, 1.72).addScaledVector(upv, -0.22);
      dummy.quaternion.copy(q);
      dummy.scale.set(0.62, 0.06, 2.4);
      dummy.updateMatrix();
      catMesh.setMatrixAt(catN++, dummy.matrix);
    }

    if (dist >= nextSupport && zone !== 'tunnel' && upv.y > 0.42 && supportN < 680) {
      nextSupport += zone === 'lift' ? 5.2 : 8.5;
      const spine = mid.clone().addScaledVector(upv, -0.62);
      const gh = groundHeight(spine.x, spine.z);
      const h = spine.y - gh;
      if (h > 1.2) {
        dummy.position.set(spine.x, gh + h / 2, spine.z);
        dummy.quaternion.identity();
        dummy.scale.set(0.24, h, 0.24);
        dummy.updateMatrix();
        supportMesh.setMatrixAt(supportN++, dummy.matrix);
        if (zone === 'lift' && h > 8 && supportN < 690) {
          for (const s of [-1, 1]) {
            const px = spine.x + right.x * s * 2.25;
            const pz = spine.z + right.z * s * 2.25;
            const gh2 = groundHeight(px, pz);
            const h2 = spine.y - gh2;
            if (h2 > 2 && supportN < 690) {
              dummy.position.set(px, gh2 + h2 / 2, pz);
              dummy.quaternion.identity();
              dummy.scale.set(0.16, h2, 0.16);
              dummy.updateMatrix();
              supportMesh.setMatrixAt(supportN++, dummy.matrix);
            }
          }
        }
        if (zone === 'lift' && h > 24 && dist >= nextBeacon) {
          nextBeacon += 18;
          beaconSpots.push(new THREE.Vector3(spine.x, spine.y + 0.4, spine.z));
        }
      }
    }

    if (zone === 'lift' && dist >= nextLamp) {
      nextLamp += 11;
      lampSpots.push(mid.clone().addScaledVector(right, 1.15).addScaledVector(upv, 0.42));
    }
  }
  tieMesh.count = tieN;
  spineMesh.count = spineN;
  supportMesh.count = supportN;
  catMesh.count = catN;
  dogMesh.count = dogN;
  tieMesh.instanceMatrix.needsUpdate = true;
  spineMesh.instanceMatrix.needsUpdate = true;
  supportMesh.instanceMatrix.needsUpdate = true;
  catMesh.instanceMatrix.needsUpdate = true;
  dogMesh.instanceMatrix.needsUpdate = true;

  const beaconGeo = new THREE.SphereGeometry(0.2, 8, 8);
  for (let i = 0; i < beaconSpots.length; i++) {
    const m = new THREE.Mesh(beaconGeo, matBeacon);
    m.position.copy(beaconSpots[i]);
    scene.add(m);
  }
  const bulbGeo = new THREE.SphereGeometry(0.16, 8, 8);
  for (let i = 0; i < lampSpots.length; i++) {
    const m = new THREE.Mesh(bulbGeo, bulbMat);
    m.position.copy(lampSpots[i]);
    scene.add(m);
    if (i % 3 === 0) {
      const light = new THREE.PointLight(0xffb16a, 360, 32, 2);
      light.position.copy(lampSpots[i]);
      scene.add(light);
    }
  }

  function buildShell(i0, i1, halfW, down, upH, mat) {
    const positions = [];
    const indices = [];
    const section = [
      [-halfW, -down],
      [halfW, -down],
      [halfW, upH],
      [-halfW, upH]
    ];
    const count = i1 - i0 + 1;
    for (let k = 0; k < count; k++) {
      const i = i0 + k;
      for (let c = 0; c < 4; c++) {
        const p = pts[i].clone()
          .addScaledVector(rights[i], section[c][0])
          .addScaledVector(ups[i], section[c][1]);
        positions.push(p.x, p.y, p.z);
      }
    }
    for (let k = 0; k < count - 1; k++) {
      for (let c = 0; c < 4; c++) {
        const c2 = (c + 1) % 4;
        const a = k * 4 + c;
        const b = k * 4 + c2;
        const d = (k + 1) * 4 + c;
        const e = (k + 1) * 4 + c2;
        indices.push(a, d, b, b, d, e);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    return mesh;
  }

  let tunnelStart = -1;
  for (let i = 0; i < n; i++) {
    if (zones[i] === 'tunnel' && tunnelStart < 0) tunnelStart = i;
    const endZone = i === n - 1 || zones[i] !== 'tunnel';
    if (endZone && tunnelStart >= 0) {
      const tunnelEnd = zones[i] === 'tunnel' ? i : i - 1;
      if (tunnelEnd > tunnelStart + 2) {
        buildShell(tunnelStart, tunnelEnd, 3.5, 1.8, 4.0, matTunnelIn);
        buildShell(tunnelStart, tunnelEnd, 4.8, 2.8, 5.3, matTunnelOut);
        const span = tunnelEnd - tunnelStart;
        for (let k = 1; k <= 4; k++) {
          const idx = tunnelStart + Math.round(span * (k / 5));
          const p = pts[idx].clone().addScaledVector(ups[idx], 3.35);
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 1.4), stripMat);
          box.position.copy(p);
          const tan = tangents[idx];
          const upv = ups[idx];
          const right = rights[idx];
          orient(right, upv, tan);
          box.quaternion.copy(q);
          scene.add(box);
          const pl = new THREE.PointLight(0xffb067, 220, 18, 2);
          pl.position.copy(p);
          scene.add(pl);
        }
        const mouth = pts[tunnelEnd].clone().addScaledVector(ups[tunnelEnd], 1.4);
        const exitBulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), matBeacon);
        exitBulb.position.copy(mouth);
        scene.add(exitBulb);
        const midI = Math.floor((tunnelStart + tunnelEnd) / 2);
        const base = pts[midI];
        const side = rights[midI];
        const fwd = tangents[midI];
        const rocks = [
          [18, 0, 16, 22],
          [-18, 0, 15, 20],
          [12, 16, 11, 16],
          [-14, -18, 12, 18],
          [8, 28, 9, 14]
        ];
        for (let r = 0; r < rocks.length; r++) {
          const spec = rocks[r];
          const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 7), matRock);
          cone.scale.set(spec[2], spec[3], spec[2]);
          cone.position.set(
            base.x + side.x * spec[0] + fwd.x * spec[1],
            spec[3] / 2 - 1.5,
            base.z + side.z * spec[0] + fwd.z * spec[1]
          );
          cone.castShadow = shadows;
          scene.add(cone);
        }
      }
      tunnelStart = -1;
    }
  }

  function addStrut(x1, y1, z1, x2, y2, z2, thick) {
    const a = new THREE.Vector3(x1, y1, z1);
    const b = new THREE.Vector3(x2, y2, z2);
    const dir = b.clone().sub(a);
    const len = dir.length();
    if (len < 0.01) return;
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(thick, thick, 1, 6), matSteel);
    mesh.position.copy(a).add(b).multiplyScalar(0.5);
    mesh.scale.y = len;
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    mesh.castShadow = shadows;
    scene.add(mesh);
  }

  let stMin = Infinity, stMax = -Infinity, stY = TRACK_Y;
  for (let i = 0; i < n; i++) {
    if (zones[i] !== 'station') continue;
    stMin = Math.min(stMin, pts[i].z);
    stMax = Math.max(stMax, pts[i].z);
    stY = pts[i].y;
  }
  if (stMax > stMin) {
    const stLen = stMax - stMin;
    const stMid = (stMin + stMax) / 2;
    for (const side of [-1, 1]) {
      const plat = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.32, stLen * 0.82), matWood);
      plat.position.set(side * 3.15, stY - 0.72, stMid);
      plat.castShadow = shadows;
      plat.receiveShadow = shadows;
      scene.add(plat);
    }
    const roof = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.22, stLen * 0.72), matWood);
    roof.position.set(0, stY + 3.7, stMid - 2);
    roof.castShadow = shadows;
    roof.receiveShadow = shadows;
    scene.add(roof);
    for (let k = 0; k < 6; k++) {
      for (const side of [-1, 1]) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 3.5, 6), matSteel);
        col.position.set(side * 3.8, stY + 1.7, stMin + 4 + k * (stLen * 0.62 / 5));
        col.castShadow = shadows;
        scene.add(col);
      }
    }
    const roofLight = new THREE.PointLight(0xffb56a, 700, 28, 2);
    roofLight.position.set(0, stY + 3.2, stMid);
    scene.add(roofLight);
    for (let k = 0; k < 12; k++) {
      const bulb = new THREE.Mesh(bulbGeo, bulbMat);
      bulb.position.set(-4 + (k % 6) * 1.6, stY + 3.45, stMin + 6 + Math.floor(k / 6) * (stLen * 0.4));
      scene.add(bulb);
    }
  }

  let liftGate = null;
  for (let i = 1; i < n; i++) {
    if (zones[i] === 'lift' && zones[i - 1] === 'station') {
      liftGate = pts[i].clone();
      break;
    }
  }
  if (!liftGate) liftGate = new THREE.Vector3(0, TRACK_Y, 40);
  const signCanvas = document.createElement('canvas');
  signCanvas.width = 1024;
  signCanvas.height = 256;
  const sg = signCanvas.getContext('2d');
  sg.fillStyle = '#14080c';
  sg.fillRect(0, 0, 1024, 256);
  sg.strokeStyle = '#e23b4c';
  sg.lineWidth = 10;
  sg.strokeRect(18, 18, 988, 220);
  sg.fillStyle = '#ff3142';

    if (!drag && !keying) {
      const k = 1 - Math.exp(-2.4 * dt);
      yaw += (0 - yaw) * k;
      pitch += (0 - pitch) * k;
    }

    const lookAhead = reduced ? 9 : 6.2 + Math.min(11, v * 0.24);
    const ahead = pose(s + lookAhead);
    const amp = reduced ? 0 : Math.min(0.026, Math.max(0, v - 12) * 0.00046);
    eye.copy(here.pos).addScaledVector(here.up, 0.98 + air);
    eye.addScaledVector(here.right, Math.sin(tSec * 23 + travel * 0.35) * amp);
    eye.addScaledVector(here.up, Math.sin(tSec * 31 + travel * 0.22) * amp * 0.65);
    lookTarget.copy(ahead.pos).addScaledVector(ahead.up, 0.12);
    lookTarget.addScaledVector(here.right, yaw * 8);
    lookTarget.addScaledVector(here.up, pitch * 5.5);
    if (lookTarget.distanceTo(eye) < 0.8) lookTarget.addScaledVector(here.tangent, 2);
    camera.up.copy(here.up);
    camera.position.copy(eye);
    camera.lookAt(lookTarget);

    const fov = 67 + (reduced ? 0 : Math.min(12, Math.max(0, v - 12) * 0.34));
    if (Math.abs(camera.fov - fov) > 0.2) {
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }

    const airTarget = (here.pos.y > hA + 0.25 && here.pos.y > hB + 0.25 && v > 16 && zone === 'coast') ? 0.11 : 0;
    air += (airTarget - air) * (1 - Math.exp(-3 * dt));
    tunnelAmt += ((zone === 'tunnel' ? 1 : 0) - tunnelAmt) * (1 - Math.exp(-3.8 * dt));

    moon.position.copy(camera.position).addScaledVector(moonDir, 150);
    moon.target.position.copy(camera.position);
    waterMat.uniforms.time.value = tSec;
    spin.rotation.z = tSec * (reduced ? 0.05 : 0.16);
    for (let i = 0; i < gondolas.length; i++) gondolas[i].rotation.z = -spin.rotation.z;
    bulbMat.emissiveIntensity = 1.15 + Math.sin(tSec * 2.2) * 0.12;
    stripMat.emissiveIntensity = 0.75 + Math.sin(tSec * 9) * 0.1 + Math.sin(tSec * 23) * 0.06;
    renderer.toneMappingExposure = 1.05 + Math.min(0.1, v * 0.0016) - tunnelAmt * 0.32;
    rushEl.style.opacity = String(Math.min(0.62, Math.max(0, (v - 16) / 42) + tunnelAmt * 0.28));

    const kmh = Math.round(v * 3.6);
    if (kmh !== lastKmh) {
      spdEl.textContent = String(kmh);
      lastKmh = kmh;
    }
    const lapNow = Math.floor(travel / total) + 1;
    if (lapNow !== lastLap) {
      lapEl.textContent = 'Lap ' + lapNow;
      lastLap = lapNow;
    }

    for (let i = 0; i < FLY_N; i++) {
      const p = flyBase[i];
      flyPos[i * 3] = p.x + Math.sin(tSec * 0.6 + p.phase) * p.r;
      flyPos[i * 3 + 1] = p.y0 + Math.sin(tSec * 1.25 + p.phase) * 0.55;
      flyPos[i * 3 + 2] = p.z + Math.cos(tSec * 0.45 + p.phase) * p.r;
    }
    flyGeo.attributes.position.needsUpdate = true;

    if (zone === 'lake' && v > 16 && !reduced) {
      if (Math.random() < dt * 22) burstSplash(here.pos, here.tangent, v);
      if (!wet && audioNodes) audioNodes.playSplash();
      wet = true;
    } else if (zone !== 'lake') wet = false;

    let splashBusy = false;
    for (let i = 0; i < SPLASH_N; i++) {
      if (splashLife[i] <= 0) continue;
      splashBusy = true;
      splashLife[i] -= dt;
      splashVel[i].y -= 9.8 * dt;
      splashPos[i * 3] += splashVel[i].x * dt;
      splashPos[i * 3 + 1] += splashVel[i].y * dt;
      splashPos[i * 3 + 2] += splashVel[i].z * dt;
      if (splashLife[i] <= 0 || splashPos[i * 3 + 1] < 0.62) {
        splashLife[i] = 0;
        splashPos[i * 3 + 1] = -30;
      }
    }
    if (splashBusy) splashGeo.attributes.position.needsUpdate = true;

    if (audioNodes) {
      const ctx = audioNodes.ctx;
      const nowT = ctx.currentTime;
      const wind = Math.min(0.2, 0.01 + v * v * 0.0001) * (1 - tunnelAmt * 0.4);
      audioNodes.windGain.gain.setTargetAtTime(wind, nowT, 0.06);
      audioNodes.windFilter.frequency.setTargetAtTime(
        Math.max(90, lerp(360, 1500, Math.min(1, v / 34)) * (1 - tunnelAmt * 0.62)),
        nowT, 0.06
      );
      audioNodes.clackFilter.frequency.setTargetAtTime(lerp(2400, 420, tunnelAmt), nowT, 0.05);
      audioNodes.send.gain.setTargetAtTime(tunnelAmt * 0.55, nowT, 0.08);
      const rumbleAmt = zone === 'lift' ? 0.028 : Math.min(0.02, 0.004 + v * 0.00035);
      audioNodes.rumbleGain.gain.setTargetAtTime(rumbleAmt, nowT, 0.08);
      audioNodes.rumble.frequency.setTargetAtTime(zone === 'lift' ? 38 : 34 + v * 0.35, nowT, 0.08);
      audioNodes.carn.gain.setTargetAtTime(0.02 + Math.sin(tSec * 0.7) * 0.004, nowT, 0.2);
      const listener = ctx.listener;
      if (listener.positionX) {
        listener.positionX.value = eye.x;
        listener.positionY.value = eye.y;
        listener.positionZ.value = eye.z;
        listener.forwardX.value = here.tangent.x;
        listener.forwardY.value = here.tangent.y;
        listener.forwardZ.value = here.tangent.z;
        listener.upX.value = here.up.x;
        listener.upY.value = here.up.y;
        listener.upZ.value = here.up.z;
      }
      const spacing = (zone === 'lift' || zone === 'station') ? 0.92 : 2.45;
      let guardClack = 0;
      while (travel >= nextClack && guardClack < 6) {
        audioNodes.playClack(v, zone);
        nextClack += spacing;
        guardClack++;
      }
      if (slope < -0.48 && v > 18 && travel - whooshAt > 9) {
        audioNodes.playWhoosh();
        whooshAt = travel;
      }
      if (zone === 'station') {
        if (stationArmed && !inStation) audioNodes.playDing();
        inStation = true;
      } else {
        inStation = false;
        stationArmed = true;
      }
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
