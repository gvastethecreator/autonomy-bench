<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ant Colony Simulation</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #2c3e50;
    color: white;
    font-family: sans-serif;
  }
  canvas {
    display: block;
  }
  #controls {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0, 0, 0, 0.5);
    padding: 15px;
    border-radius: 8px;
    pointer-events: none;
  }
  h3 {
    margin: 0 0 5px 0;
  }
  p {
    margin: 0;
    font-size: 14px;
    color: #bdc3c7;
  }
</style>
</head>
<body>
<div id="controls">
  <h3>Ant Colony</h3>
  <p>Click anywhere to add food.</p>
</div>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const nest = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 40
  };

  const ants = [];
  const foodSources = [];
  const numAnts = 300;

  class Ant {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      this.speed = 2.5;
      this.hasFood = false;
      this.wanderStrength = 0.8;
    }

    update() {
      // Random wandering
      this.vx += (Math.random() - 0.5) * this.wanderStrength;
      this.vy += (Math.random() - 0.5) * this.wanderStrength;

      // Towards food or nest
      if (this.hasFood) {
        const dx = nest.x - this.x;
        const dy = nest.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < nest.radius) {
          this.hasFood = false;
        } else {
          this.vx += (dx / dist) * 0.8;
          this.vy += (dy / dist) * 0.8;
        }
      } else {
        let closestFood = null;
        let closestDist = Infinity;

        for (const food of foodSources) {
          const dx = food.x - this.x;
          const dy = food.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < closestDist) {
            closestDist = dist;
            closestFood = food;
          }
        }

        if (closestFood) {
          if (closestDist < closestFood.radius) {
            this.hasFood = true;
            closestFood.amount--;
            if (closestFood.amount <= 0) {
              const index = foodSources.indexOf(closestFood);
              foodSources.splice(index, 1);
            }
          } else {
            const dx = closestFood.x - this.x;
            const dy = closestFood.y - this.y;
            this.vx += (dx / closestDist) * 0.4;
            this.vy += (dy / closestDist) * 0.4;
          }
        }
      }

      // Normalize speed
      const length = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (length > 0) {
        this.vx = (this.vx / length) * this.speed;
        this.vy = (this.vy / length) * this.speed;
      }

      // Border collision
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      
      this.x = Math.max(0, Math.min(canvas.width, this.x));
      this.y = Math.max(0, Math.min(canvas.height, this.y));

      this.x += this.vx;
      this.y += this.vy;
    }

    draw() {
      const angle = Math.atan2(this.vy, this.vx);
      
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(angle);
      
      // Draw ant body
      ctx.fillStyle = this.hasFood ? '#e74c3c' : '#bdc3c7';
      ctx.beginPath();
      // Head
      ctx.arc(3, 0, 1.5, 0, Math.PI * 2);
      // Thorax
      ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
      // Abdomen
      ctx.arc(-4, 0, 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw food item if carrying
      if (this.hasFood) {
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(5, 0, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // Initialize ants
  for (let i = 0; i < numAnts; i++) {
    ants.push(new Ant(nest.x, nest.y));
  }

  // Initial food sources
  const numInitialFood = 3;
  for (let i = 0; i < numInitialFood; i++) {
    foodSources.push({
      x: 100 + Math.random() * (canvas.width - 200),
      y: 100 + Math.random() * (canvas.height - 200),
      radius: 20,
      amount: 200
    });
  }

  // Add food on click
  window.addEventListener('click', (e) => {
    foodSources.push({
      x: e.clientX,
      y: e.clientY,
      radius: 20,
      amount: 200
    });
  });

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    nest.x = canvas.width / 2;
    nest.y = canvas.height / 2;
  });

  function animate() {
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw nest
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath();
    ctx.arc(nest.x, nest.y, nest.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9b59b6';
    ctx.beginPath();
    ctx.arc(nest.x, nest.y, nest.radius * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a252f';
    ctx.beginPath();
    ctx.arc(nest.x, nest.y, nest.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Draw food
    ctx.fillStyle = '#f1c40f';
    for (const food of foodSources) {
      // Draw food particles based on amount
      const numParticles = Math.min(food.amount, 50);
      for(let i=0; i<numParticles; i++) {
        const angle = (i / numParticles) * Math.PI * 2;
        const r = (food.radius * 0.8) * Math.sqrt(i / numParticles);
        ctx.beginPath();
        ctx.arc(food.x + Math.cos(angle)*r, food.y + Math.sin(angle)*r, 2, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Update and draw ants
    for (const ant of ants) {
      ant.update();
      ant.draw();
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
