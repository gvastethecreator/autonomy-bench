<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks Display</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<script>
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.radius = Math.random() * 2 + 1;
      this.velocity = {
        x: (Math.random() - 0.5) * 8,
        y: (Math.random() - 0.5) * 8
      };
      this.alpha = 1;
      this.decay = Math.random() * 0.015 + 0.015;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
    }
    update() {
      this.draw();
      this.velocity.y += 0.05; // gravity
      this.x += this.velocity.x;
      this.y += this.velocity.y;
      this.alpha -= this.decay;
    }
  }

  class Firework {
    constructor(x, y, targetX, targetY) {
      this.x = x;
      this.y = y;
      this.startX = x;
      this.startY = y;
      this.targetX = targetX;
      this.targetY = targetY;
      this.distanceToTarget = Math.hypot(targetX - x, targetY - y);
      this.distanceTraveled = 0;
      this.coordinates = [];
      this.coordinateCount = 3;
      while(this.coordinateCount--) {
        this.coordinates.push([this.x, this.y]);
      }
      this.angle = Math.atan2(targetY - y, targetX - x);
      this.speed = 2;
      this.acceleration = 1.05;
      this.brightness = Math.random() * 50 + 50;
      this.targetRadius = 1;
    }
    update(index, fireworks) {
      this.coordinates.pop();
      this.coordinates.unshift([this.x, this.y]);
      
      this.speed *= this.acceleration;
      
      const vx = Math.cos(this.angle) * this.speed;
      const vy = Math.sin(this.angle) * this.speed;
      this.distanceTraveled = Math.hypot(this.x + vx - this.startX, this.y + vy - this.startY);
      
      if(this.distanceTraveled >= this.distanceToTarget) {
        fireworks.splice(index, 1);
        return true;
      } else {
        this.x += vx;
        this.y += vy;
        return false;
      }
    }
    draw() {
      ctx.beginPath();
      ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
      ctx.lineTo(this.x, this.y);
      ctx.strokeStyle = `hsl(${Math.random() * 360}, 100%, ${this.brightness}%)`;
      ctx.stroke();
    }
  }

  let particles = [];
  let fireworks = [];
  
  function createParticles(x, y) {
    const particleCount = 100;
    const hue = Math.random() * 360;
    for(let i = 0; i < particleCount; i++) {
      const color = `hsl(${hue}, 100%, 50%)`;
      particles.push(new Particle(x, y, color));
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    for(let i = fireworks.length - 1; i >= 0; i--) {
      fireworks[i].draw();
      if(fireworks[i].update(i, fireworks)) {
        createParticles(fireworks[i].targetX, fireworks[i].targetY);
      }
    }
    
    for(let i = particles.length - 1; i >= 0; i--) {
      if(particles[i].alpha <= 0) {
        particles.splice(i, 1);
      } else {
        particles[i].update();
      }
    }
    
    if(Math.random() < 0.05) {
      const startX = canvas.width / 2;
      const startY = canvas.height;
      const targetX = Math.random() * canvas.width;
      const targetY = Math.random() * canvas.height / 2;
      fireworks.push(new Firework(startX, startY, targetX, targetY));
    }
  }
  
  animate();
</script>
</body>
</html>
