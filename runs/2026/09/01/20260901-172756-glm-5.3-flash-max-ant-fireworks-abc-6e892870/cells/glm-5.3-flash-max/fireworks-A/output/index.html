<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fireworks</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: crosshair;
  }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  let stars = [];
  function makeStars() {
    stars = [];
    const n = Math.floor((W * H) / 6000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.9,
        r: Math.random() * 1.1 + 0.2,
        tw: Math.random() * TAU,
        sp: rand(0.5, 2)
      });
    }
  }
  makeStars();
  window.addEventListener('resize', makeStars);

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#04040f');
    g.addColorStop(0.6, '#0a0a1e');
    g.addColorStop(1, '#140a1e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const a = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.sp + s.tw));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#cfd8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const glow = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, H * 0.55);
    glow.addColorStop(0, 'rgba(40, 20, 60, 0.35)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  const particles = [];
  const shells = [];

  function addParticle(p) {
    if (particles.length > 3500) particles.splice(0, 300);
    particles.push(p);
  }

  const PALETTES = [
    h => `hsl(${h}, 100%, 62%)`,
    h => `hsl(${h}, 95%, 55%)`,
    h => `hsl(${(h + 40) % 360}, 90%, 68%)`
  ];

  function burst(x, y, hue) {
    const styleRoll = Math.random();
    const speed = rand(3.4, 5.6);
    let count;

    if (styleRoll < 0.35) {
      count = Math.floor(rand(70, 100));
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * TAU + rand(-0.05, 0.05);
        const sp = speed * rand(0.6, 1.05);
        addParticle({
          x, y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: rand(0.9, 1.5),
          age: 0,
          hue: hue + rand(-14, 14),
          g: 0.055,
          drag: 0.982,
          size: rand(1.4, 2.4),
          flicker: Math.random() < 0.25,
          willow: false,
          glow: 10
        });
      }
    } else if (styleRoll < 0.6) {
      const rings = Math.random() < 0.5 ? 1 : 2;
      for (let r = 0; r < rings; r++) {
        const rc = Math.floor(rand(44, 60));
        const rs = speed * (r === 0 ? 1 : 0.55);
        for (let i = 0; i < rc; i++) {
          const ang = (i / rc) * TAU;
          addParticle({
            x, y,
            vx: Math.cos(ang) * rs,
            vy: Math.sin(ang) * rs,
            life: rand(1.1, 1.6),
            age: 0,
            hue: hue + r * 130,
            g: 0.05,
            drag: 0.985,
            size: rand(1.3, 2.1),
            flicker: false,
            willow: false,
            glow: 10
          });
        }
      }
    } else if (styleRoll < 0.82) {
      count = Math.floor(rand(60, 80));
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * TAU;
        const sp = speed * Math.pow(Math.random(), 0.5);
        addParticle({
          x, y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp * 0.75 - 0.4,
          life: rand(1.6, 2.6),
          age: 0,
          hue: hue + rand(-10, 10),
          g: 0.02,
          drag: 0.97,
          size: rand(1.6, 2.8),
          flicker: false,
          willow: true,
          glow: 12
        });
      }
    } else {
      count = Math.floor(rand(50, 70));
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * TAU;
        const sp = speed * rand(0.3, 1);
        addParticle({
          x, y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: rand(0.7, 1.3),
          age: 0,
          hue: hue + rand(-20, 20),
          g: 0.07,
          drag: 0.975,
          size: rand(1.2, 2),
          flicker: true,
          willow: false,
          glow: 14,
          crackle: true
        });
      }
    }

    for (let i = 0; i < 24; i++) {
      const ang = Math.random() * TAU;
      const sp = rand(0.2, 1.2);
      addParticle({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: rand(0.25, 0.6),
        age: 0,
        hue: 45,
        sat: '100%',
        lit: 90,
        g: 0.01,
        drag: 0.94,
        size: rand(0.8, 1.8),
        flicker: true,
        willow: false,
        glow: 8
      });
    }
  }

  function launch(tx, ty) {
    const sx = tx !== undefined ? tx : rand(W * 0.15, W * 0.85);
    const sy = H + 10;
    const ex = tx !== undefined ? tx : sx + rand(-W * 0.06, W * 0.06);
    const ey = ty !== undefined ? ty : rand(H * 0.12, H * 0.45);
    const hue = Math.floor(rand(0, 360));

    const dist = sy - ey;
    const vy = -Math.sqrt(2 * 0.18 * dist);
    shells.push({
      x: sx, y: sy,
      vx: (ex - sx) / (dist / Math.abs(vy)) * 0.98,
      vy,
      ey,
      hue,
      trailT: 0
    });
  }

  function updateAndDraw(dt, t) {
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i];
      s.vy += 0.18 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.trailT += dt;

      if (s.trailT > 0.02) {
        s.trailT = 0;
        addParticle({
          x: s.x + rand(-1, 1),
          y: s.y + rand(-1, 1),
          vx: rand(-0.2, 0.2),
          vy: rand(0.2, 0.8),
          life: rand(0.2, 0.45),
          age: 0,
          hue: s.hue,
          lit: 75,
          g: 0.005,
          drag: 0.96,
          size: rand(0.9, 1.7),
          flicker: true,
          willow: false,
          glow: 6
        });
      }

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 8);
      grad.addColorStop(0, `hsla(${s.hue}, 100%, 80%, 0.9)`);
      grad.addColorStop(1, `hsla(${s.hue}, 100%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 8, 0, TAU);
      ctx.fill();
      ctx.restore();

      if (s.vy >= -0.5 || s.y <= s.ey) {
        shells.splice(i, 1);
        burst(s.x, s.y, s.hue);
      }
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt / 60;
      if (p.age >= p.life) {
        particles.splice(i, 1);
        continue;
      }

      p.vy += p.g * dt;
      p.vx *= Math.pow(p.drag, dt);
      p.vy *= Math.pow(p.drag, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const k = 1 - p.age / p.life;
      const alpha = k * k;
      let lit = p.lit !== undefined ? p.lit : 62;
      if (p.flicker && Math.random() < 0.12) lit = Math.max(30, lit - 25);
      if (p.willow) lit = 55 + 20 * k;

      let size = p.size;
      if (p.crackle && Math.random() < 0.3) size *= rand(0.4, 2);

      const r = Math.max(0.2, size * (0.4 + 0.6 * k));

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * p.glow);
      grad.addColorStop(0, `hsla(${p.hue}, 100%, ${Math.min(lit + 18, 95)}%, ${alpha})`);
      grad.addColorStop(0.35, `hsla(${p.hue}, 100%, ${lit}%, ${alpha * 0.6})`);
      grad.addColorStop(1, `hsla(${p.hue}, 100%, ${lit}%, 0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * p.glow, 0, TAU);
      ctx.fill();

      ctx.fillStyle = `hsla(${p.hue}, 100%, ${Math.min(lit + 25, 96)}%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.55, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  let last = performance.now();
  let nextAuto = 400;

  function frame(now) {
    let dt = (now - last) / 16.667;
    last = now;
    dt = Math.min(dt, 3);

    drawSky(now);

    nextAuto -= (now - (frame._prev || now));
    frame._prev = now;
    if (nextAuto <= 0) {
      nextAuto = rand(700, 1800);
      const n = Math.random() < 0.18 ? 2 : 1;
      for (let i = 0; i < n; i++) launch();
    }

    updateAndDraw(dt, now);
    requestAnimationFrame(frame);
  }
  frame._prev = performance.now();
  requestAnimationFrame(frame);

  window.addEventListener('pointerdown', e => {
    for (let i = 0; i < 2; i++) launch(e.clientX, e.clientY);
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      for (let i = 0; i < 5; i++) setTimeout(() => launch(), i * 120);
    }
  });

  setTimeout(() => { for (let i = 0; i < 3; i++) setTimeout(() => launch(), i * 300); }, 300);
})();
</script>
</body>
</html>
