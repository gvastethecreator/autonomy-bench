<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Person Rollercoaster</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Light
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(100, 200, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Ground
        const groundGeo = new THREE.PlaneGeometry(2000, 2000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -50;
        scene.add(ground);

        // Scenery: Some boxes
        const boxGeo = new THREE.BoxGeometry(10, 20, 10);
        const boxMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        for (let i = 0; i < 50; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(
                (Math.random() - 0.5) * 400,
                -40,
                (Math.random() - 0.5) * 400
            );
            box.rotation.y = Math.random() * Math.PI;
            scene.add(box);
        }

        // Curve path for rollercoaster
        const points = [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(50, 20, 50),
            new THREE.Vector3(100, -10, 100),
            new THREE.Vector3(150, 50, 0),
            new THREE.Vector3(100, 30, -100),
            new THREE.Vector3(0, -20, -150),
            new THREE.Vector3(-100, 20, -100),
            new THREE.Vector3(-150, 60, 0),
            new THREE.Vector3(-100, -10, 50),
            new THREE.Vector3(-50, 10, 100)
        ];
        
        const curve = new THREE.CatmullRomCurve3(points, true); // true for closed curve

        // Tube geometry for track
        const tubeGeo = new THREE.TubeGeometry(curve, 200, 2, 8, true);
        const tubeMat = new THREE.MeshLambertMaterial({ color: 0xff0000, wireframe: false });
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tube);

        // Animation variables
        const loopTime = 15000; // time in ms to complete one loop
        
        function animate(time) {
            requestAnimationFrame(animate);

            // Calculate progress 0 to 1
            const t = (time % loopTime) / loopTime;

            // Get position and tangent from curve
            const pos = curve.getPointAt(t);
            const tangent = curve.getTangentAt(t);

            // Position camera slightly above the track
            camera.position.copy(pos).add(new THREE.Vector3(0, 3, 0));

            // Look ahead along the tangent
            const lookAtTarget = new THREE.Vector3().copy(pos).add(tangent);
            camera.lookAt(lookAtTarget);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
