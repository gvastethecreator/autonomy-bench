<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Rollercoaster</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 100;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">First-Person Rollercoaster</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.Fog(0x87ceeb, 50, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Environment (Ground)
        const groundGeo = new THREE.PlaneGeometry(2000, 2000);
        const groundMat = new THREE.MeshPhongMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -50;
        scene.add(ground);

        // Rollercoaster Track Path
        const points = [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(50, 20, -50),
            new THREE.Vector3(100, -10, -100),
            new THREE.Vector3(50, 40, -150),
            new THREE.Vector3(-50, 10, -100),
            new THREE.Vector3(-100, 30, -50),
            new THREE.Vector3(-50, -20, 50),
            new THREE.Vector3(0, 50, 100),
            new THREE.Vector3(50, 10, 50)
        ];
        
        const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.5);

        // Track Geometry
        const tubularSegments = 400;
        const radialSegments = 8;
        const radius = 2;
        const trackGeometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, true);
        const trackMaterial = new THREE.MeshPhongMaterial({ color: 0xff4500, wireframe: false });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        scene.add(track);

        // Supports
        const supportMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
        const supportGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);
        for (let i = 0; i < 1; i += 0.05) {
            const point = curve.getPointAt(i);
            if (point.y > -45) {
                const h = point.y + 50; // Distance to ground
                const mesh = new THREE.Mesh(supportGeo, supportMat);
                mesh.position.set(point.x, -50 + h/2, point.z);
                mesh.scale.y = h;
                scene.add(mesh);
            }
        }

        // Animation Loop Variables
        const clock = new THREE.Clock();
        let progress = 0;
        const speed = 0.05; // Base speed
        const up = new THREE.Vector3(0, 1, 0);
        const axis = new THREE.Vector3();

        // Extra elements for visual interest
        const boxGeo = new THREE.BoxGeometry(5, 5, 5);
        for (let i = 0; i < 20; i++) {
            const boxMat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 200
            );
            scene.add(box);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            // Adjust speed based on height to simulate gravity
            const currentPoint = curve.getPointAt(progress);
            const heightFactor = Math.max(0, (50 - currentPoint.y) / 100);
            const currentSpeed = speed + heightFactor * 0.05;

            progress += currentSpeed * delta;
            progress = progress % 1; // Loop

            // Get points for camera positioning
            const camPos = curve.getPointAt(progress);
            const lookAtPos = curve.getPointAt((progress + 0.01) % 1);

            // Move camera slightly above the track
            const tangent = curve.getTangentAt(progress);
            const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
            const binormal = new THREE.Vector3().crossVectors(normal, tangent).normalize();
            
            const offset = 3;
            camPos.add(binormal.clone().multiplyScalar(offset));

            camera.position.copy(camPos);
            
            // Look ahead
            lookAtPos.add(binormal.clone().multiplyScalar(offset));
            camera.lookAt(lookAtPos);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
