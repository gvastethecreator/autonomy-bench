<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Midnight Flourish — Fireworks</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #05070f;
    --mist: rgba(180, 210, 255, 0.55);
    --gold: #ffd38a;
    --rose: #ff7eb6;
    --cyan: #7ef0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #e8eefc;
    -webkit-font-smoothing: antialiased;
  }

  body {
    cursor: crosshair;
    user-select: none;
    touch-action: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 90% 55% at 50% 118%, rgba(40, 55, 95, 0.45), transparent 58%),
      radial-gradient(ellipse 40% 30% at 78% 18%, rgba(120, 140, 220, 0.08), transparent 70%),
      linear-gradient(180deg, transparent 62%, rgba(2, 4, 12, 0.55) 100%);
    z-index: 2;
  }

  .hud {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    padding: clamp(1rem, 3vw, 1.75rem);
    pointer-events: none;
  }

  .brand {
    max-width: min(28rem, 70vw);
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
  }

  .brand .eyebrow {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(200, 220, 255, 0.55);
    margin-bottom: 0.45rem;
  }

  .brand h1 {
    font-weight: 500;
    font-size: clamp(1.35rem, 3.2vw, 2rem);
    letter-spacing: 0.02em;
    line-height: 1.15;
    text-shadow: 0 8px 40px rgba(0, 0, 0, 0.65);
  }

  .brand p {
    margin-top: 0.45rem;
    font-size: 0.9rem;
    color: rgba(210, 222, 245, 0.62);
    max-width: 26rem;
    line-height: 1.45;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    justify-content: flex-end;
    pointer-events: auto;
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
  }

  button {
    appearance: none;
    border: 1px solid rgba(180, 205, 255, 0.18);
    background: rgba(10, 14, 28, 0.55);
    color: rgba(230, 238, 255, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 999px;
    padding: 0.65rem 1.05rem;
    font: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  }

  button:hover {
    border-color: rgba(210, 230, 255, 0.42);
    background: rgba(22, 30, 55, 0.72);
    transform: translateY(-1px);
  }

  button:active { transform: translateY(0); }

  button.active {
    border-color: rgba(255, 210, 140, 0.55);
    box-shadow: 0 0 0 1px rgba(255, 190, 110, 0.18), 0 10px 30px rgba(0, 0, 0, 0.28);
    color: #ffe8c2;
  }

  .hint {
    position: fixed;
    top: clamp(1rem, 3vw, 1.75rem);
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 5;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(210, 225, 255, 0.42);
    pointer-events: none;
    opacity: 0;
    animation: hintIn 1.2s ease 1.2s forwards, hintOut 1.2s ease 6.5s forwards;
    white-space: nowrap;
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 40%), rgba(255, 245, 220, 0.28), transparent 42%);
    opacity: 0;
    mix-blend-mode: screen;
  }

  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes hintIn {
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes hintOut {
    to { opacity: 0; transform: translateX(-50%) translateY(-6px); }
  }

  @media (max-width: 640px) {
    .hud { flex-direction: column; align-items: flex-start; }
    .controls { width: 100%; justify-content: flex-start; }
    .brand p { display: none; }
    .hint { font-size: 0.68rem; letter-spacing: 0.1em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .controls, .hint { animation: none !important; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <canvas id="stage" aria-label="Interactive fireworks night sky"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="hint">Click or tap the sky · space for finale</div>
  <div class="hud">
    <div class="brand">
      <div class="eyebrow">Night Gallery</div>
      <h1>Midnight Flourish</h1>
      <p>A self-running aerial ballet — peonies, willows, and chrysanthemums over a quiet harbor.</p>
    </div>
    <div class="controls">
      <button type="button" id="btnShow" class="active" aria-pressed="true">Auto Show</button>
      <button type="button" id="btnFinale">Finale</button>
      <button type="button" id="btnMute" aria-pressed="false">Sound Off</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });
  const flashEl = document.getElementById("flash");
  const btnShow = document.getElementById("btnShow");
  const btnFinale = document.getElementById("btnFinale");
  const btnMute = document.getElementById("btnMute");

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1;
  let stars = [];
  let rockets = [];
  let sparks = [];
  let trails = [];
  let smoke = [];
  let glitter = [];
  let autoShow = !reduced;
  let muted = true;
  let audioCtx = null;
  let masterGain = null;
  let time = 0;
  let last = performance.now();
  let showClock = 0;
  let nextCue = 0.8;
  let finaleUntil = 0;
  let shake = 0;
  let ambientHue = 220;
  let skyPulse = 0;

  const PALETTES = [
    ["#ff6b9d", "#ffd166", "#fff1c1"],
    ["#7ef0ff", "#a78bfa", "#e0e7ff"],
    ["#ff9f43", "#ff6b6b", "#ffeaa7"],
    ["#5efc8d", "#7ef0ff", "#f8ffd6"],
    ["#ff4d6d", "#c77dff", "#ffd6ff"],
    ["#f9c74f", "#f9844a", "#fff3b0"],
    ["#90e0ef", "#48cae4", "#caf0f8"],
    ["#ff8fab", "#ffb3c1", "#ffffff"],
  ];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seedStars();
  }

  function seedStars() {
    const count = Math.floor((W * H) / 14000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.72,
      r: Math.random() * 1.35 + 0.2,
      a: Math.random() * 0.55 + 0.15,
      tw: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 1.4,
    }));
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function ensureAudio() {
    if (muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur, type, vol, when = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + when;
    const o = ac.createOscillator();
    const g = ac.createGain();
    const f = ac.createBiquadFilter();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    f.type = "lowpass";
    f.frequency.setValueAtTime(freq * 4, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noiseBurst(dur, vol, when = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const g = ac.createGain();
    const f = ac.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 900 + Math.random() * 1200;
    f.Q.value = 0.7;
    const t0 = ac.currentTime + when;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t0);
  }

  function playLaunch() {
    tone(180 + Math.random() * 40, 0.45, "sine", 0.05);
    tone(90, 0.35, "triangle", 0.03, 0.02);
    noiseBurst(0.18, 0.04);
  }

  function playBoom(size) {
    noiseBurst(0.35 + size * 0.2, 0.08 + size * 0.06);
    tone(60 + Math.random() * 30, 0.6, "sine", 0.07 + size * 0.04);
    tone(140, 0.25, "triangle", 0.03, 0.04);
  }

  function playCrackle(n = 6) {
    for (let i = 0; i < n; i++) {
      noiseBurst(0.06, 0.025, 0.05 + i * 0.04 + Math.random() * 0.03);
    }
  }

  function launch(x, y, opts = {}) {
    const targetY = opts.targetY ?? rand(H * 0.12, H * 0.42);
    const palette = opts.palette || pick(PALETTES);
    const kind = opts.kind || pick(["peony", "chrysanthemum", "willow", "ring", "palm", "crackle", "brocade"]);
    const rocket = {
      x, y,
      vx: opts.vx ?? rand(-0.35, 0.35),
      vy: opts.vy ?? rand(-11.5, -8.2),
      targetY,
      life: 1,
      trail: [],
      palette,
      kind,
      hueShift: Math.random() * 40,
      size: opts.size ?? rand(0.85, 1.25),
      sparkTimer: 0,
    };
    rockets.push(rocket);
    playLaunch();
  }

  function burst(x, y, palette, kind, size = 1) {
    const countMap = {
      peony: 90,
      chrysanthemum: 120,
      willow: 70,
      ring: 64,
      palm: 48,
      crackle: 55,
      brocade: 100,
    };
    const n = Math.floor((countMap[kind] || 80) * size * (reduced ? 0.55 : 1));
    const baseSpeed = (kind === "willow" ? 3.2 : kind === "palm" ? 5.5 : 4.4) * size;
    skyPulse = Math.min(1, skyPulse + 0.18 * size);
    shake = Math.min(10, shake + 2.2 * size);
    ambientHue = (ambientHue + 18 + Math.random() * 40) % 360;
    flash(x, y, 0.35 + size * 0.25);

    playBoom(size);
    if (kind === "crackle") playCrackle(8);

    for (let i = 0; i < n; i++) {
      let angle, speed;
      if (kind === "ring") {
        angle = (i / n) * Math.PI * 2 + rand(-0.04, 0.04);
        speed = baseSpeed * rand(0.92, 1.08);
      } else if (kind === "palm") {
        angle = -Math.PI / 2 + rand(-0.85, 0.85);
        speed = baseSpeed * rand(0.7, 1.25);
      } else {
        angle = rand(0, Math.PI * 2);
        speed = baseSpeed * Math.pow(Math.random(), kind === "chrysanthemum" ? 0.55 : 0.75) * rand(0.55, 1.15);
      }

      const color = palette[(i + (Math.random() * 3) | 0) % palette.length];
      sparks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: rand(0.008, 0.016) * (kind === "willow" ? 0.55 : 1) / size,
        color,
        size: rand(1.2, 2.6) * size,
        kind,
        drag: kind === "willow" ? 0.985 : 0.978,
        gravity: kind === "willow" ? 0.028 : kind === "palm" ? 0.055 : 0.038,
        twinkle: Math.random(),
        secondary: kind === "crackle" || kind === "brocade",
        cracked: false,
      });
    }

    // bright core flash particles
    for (let i = 0; i < 12 * size; i++) {
      glitter.push({
        x: x + rand(-6, 6),
        y: y + rand(-6, 6),
        vx: rand(-1.5, 1.5),
        vy: rand(-1.5, 1.5),
        life: 1,
        decay: rand(0.04, 0.08),
        r: rand(1, 3) * size,
      });
    }

    // soft smoke puff
    for (let i = 0; i < 5; i++) {
      smoke.push({
        x: x + rand(-10, 10),
        y: y + rand(-8, 8),
        vx: rand(-0.2, 0.2),
        vy: rand(-0.35, -0.05),
        life: 1,
        decay: rand(0.004, 0.008),
        r: rand(18, 42) * size,
      });
    }
  }

  function flash(x, y, strength) {
    flashEl.style.setProperty("--fx", (x / W * 100) + "%");
    flashEl.style.setProperty("--fy", (y / H * 100) + "%");
    flashEl.style.opacity = String(clamp(strength, 0, 0.7));
    clearTimeout(flash._t);
    flash._t = setTimeout(() => { flashEl.style.opacity = "0"; }, 90);
  }

  function spawnCue(intensity = 1) {
    const finale = performance.now() < finaleUntil;
    const bursts = finale
      ? (2 + (Math.random() * 3) | 0)
      : intensity > 0.8
        ? (1 + (Math.random() * 2) | 0)
        : 1;

    for (let i = 0; i < bursts; i++) {
      const x = rand(W * 0.12, W * 0.88);
      const delay = i * rand(120, 280);
      setTimeout(() => {
        launch(x, H + 10, {
          size: finale ? rand(1.05, 1.45) : rand(0.8, 1.2),
          kind: finale
            ? pick(["peony", "chrysanthemum", "brocade", "ring", "willow", "crackle"])
            : undefined,
        });
      }, delay);
    }
  }

  function triggerFinale() {
    finaleUntil = performance.now() + 7800;
    nextCue = 0.15;
    // opening volley
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        launch(rand(W * 0.15, W * 0.85), H + 10, {
          size: rand(1.1, 1.5),
          kind: pick(["chrysanthemum", "peony", "brocade", "ring"]),
        });
      }, i * 180);
    }
    // mid crown
    setTimeout(() => {
      const cx = W * 0.5;
      for (let i = 0; i < 7; i++) {
        launch(cx + (i - 3) * W * 0.07, H + 10, {
          size: 1.2 + Math.abs(i - 3) * 0.05,
          kind: i === 3 ? "chrysanthemum" : pick(["peony", "ring", "brocade"]),
          targetY: H * (0.18 + Math.abs(i - 3) * 0.03),
        });
      }
    }, 2200);
    // closing willow curtain
    setTimeout(() => {
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          launch(rand(W * 0.18, W * 0.82), H + 10, {
            kind: "willow",
            size: rand(1.1, 1.4),
            palette: pick([PALETTES[0], PALETTES[5], PALETTES[7]]),
          });
        }, i * 160);
      }
    }, 4800);
  }

  function drawSky(dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const pulse = skyPulse * 0.08;
    g.addColorStop(0, `hsl(${ambientHue}, 35%, ${4 + pulse * 10}%)`);
    g.addColorStop(0.45, `hsl(${ambientHue + 20}, 30%, ${7 + pulse * 6}%)`);
    g.addColorStop(0.78, `hsl(230, 28%, ${9 + pulse * 3}%)`);
    g.addColorStop(1, "#070a14");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // distant aurora wash
    const ag = ctx.createRadialGradient(W * 0.3, H * 0.15, 0, W * 0.3, H * 0.15, W * 0.55);
    ag.addColorStop(0, `hsla(${ambientHue}, 60%, 55%, ${0.035 + skyPulse * 0.04})`);
    ag.addColorStop(1, "transparent");
    ctx.fillStyle = ag;
    ctx.fillRect(0, 0, W, H);

    const ag2 = ctx.createRadialGradient(W * 0.75, H * 0.22, 0, W * 0.75, H * 0.22, W * 0.4);
    ag2.addColorStop(0, `hsla(${(ambientHue + 80) % 360}, 55%, 60%, ${0.03 + skyPulse * 0.03})`);
    ag2.addColorStop(1, "transparent");
    ctx.fillStyle = ag2;
    ctx.fillRect(0, 0, W, H);

    // moon
    const mx = W * 0.82, my = H * 0.16, mr = Math.min(W, H) * 0.035;
    const mg = ctx.createRadialGradient(mx - mr * 0.25, my - mr * 0.3, mr * 0.2, mx, my, mr * 2.8);
    mg.addColorStop(0, "rgba(230, 235, 255, 0.55)");
    mg.addColorStop(0.25, "rgba(200, 210, 240, 0.18)");
    mg.addColorStop(1, "transparent");
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mx, my, mr * 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e8ecf8";
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(5, 8, 18, 0.18)";
    ctx.beginPath();
    ctx.arc(mx + mr * 0.35, my - mr * 0.1, mr * 0.92, 0, Math.PI * 2);
    ctx.fill();

    // stars
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(time * s.sp + s.tw);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = "#dce6ff";
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // horizon haze
    const hz = ctx.createLinearGradient(0, H * 0.72, 0, H);
    hz.addColorStop(0, "transparent");
    hz.addColorStop(0.45, "rgba(20, 30, 55, 0.35)");
    hz.addColorStop(1, "rgba(4, 8, 18, 0.85)");
    ctx.fillStyle = hz;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    // water reflection band
    drawHarbor();
  }

  function drawHarbor() {
    const base = H * 0.86;
    ctx.fillStyle = "#050810";
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, base + 8);
    // soft skyline
    const buildings = [
      [0.02, 0.06, 0.07], [0.09, 0.04, 0.05], [0.15, 0.08, 0.1],
      [0.24, 0.05, 0.06], [0.32, 0.1, 0.12], [0.42, 0.045, 0.055],
      [0.5, 0.07, 0.09], [0.58, 0.05, 0.065], [0.66, 0.09, 0.11],
      [0.76, 0.04, 0.05], [0.82, 0.075, 0.09], [0.9, 0.055, 0.07],
    ];
    for (const [px, pw, ph] of buildings) {
      const x = W * px;
      const w = W * pw;
      const h = H * ph;
      ctx.rect(x, base - h + 8, w, h + 4);
    }
    ctx.lineTo(W, base + 8);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // tiny windows
    ctx.fillStyle = "rgba(255, 210, 140, 0.22)";
    for (const [px, pw, ph] of buildings) {
      const x = W * px;
      const w = W * pw;
      const h = H * ph;
      const cols = Math.max(1, Math.floor(w / 8));
      const rows = Math.max(1, Math.floor(h / 10));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.random() > 0.55) continue;
          ctx.globalAlpha = 0.15 + Math.random() * 0.35;
          ctx.fillRect(x + 3 + c * (w / cols), base - h + 12 + r * (h / rows), 2, 2);
        }
      }
    }
    ctx.globalAlpha = 1;

    // pier lights
    for (let i = 0; i < 9; i++) {
      const lx = W * (0.08 + i * 0.1);
      const ly = base + 4;
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 18);
      lg.addColorStop(0, "rgba(255, 200, 120, 0.35)");
      lg.addColorStop(1, "transparent");
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(lx, ly, 18, 0, Math.PI * 2);
      ctx.fill();
    }

    // water
    const water = ctx.createLinearGradient(0, base, 0, H);
    water.addColorStop(0, "rgba(12, 20, 40, 0.95)");
    water.addColorStop(1, "#02040a");
    ctx.fillStyle = water;
    ctx.fillRect(0, base + 6, W, H - base);

    // shimmer reflections from active sparks
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, base + 6, W, H - base);
    ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    const sample = Math.min(sparks.length, 40);
    for (let i = 0; i < sample; i++) {
      const s = sparks[(i * 7) % sparks.length];
      if (!s || s.y > base) continue;
      const ry = base + 10 + (base - s.y) * 0.18;
      ctx.globalAlpha = s.life * 0.12;
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x - 6, ry, 12, 1.5);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function update(dt) {
    const finale = performance.now() < finaleUntil;
    showClock += dt;
    skyPulse = Math.max(0, skyPulse - dt * 0.35);
    shake = Math.max(0, shake - dt * 14);

    if (autoShow && showClock >= nextCue) {
      const intensity = finale ? 1 : 0.35 + 0.65 * Math.abs(Math.sin(time * 0.15));
      spawnCue(intensity);
      nextCue = showClock + (finale ? rand(0.28, 0.55) : rand(0.9, 2.1));
    }

    // rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx * dt * 60;
      r.y += r.vy * dt * 60;
      r.vy += 0.085 * dt * 60;
      r.trail.push({ x: r.x, y: r.y, life: 1 });
      if (r.trail.length > 14) r.trail.shift();
      for (const t of r.trail) t.life -= dt * 3.5;

      r.sparkTimer -= dt;
      if (r.sparkTimer <= 0) {
        r.sparkTimer = 0.02;
        trails.push({
          x: r.x + rand(-1.5, 1.5),
          y: r.y + rand(0, 4),
          vx: rand(-0.4, 0.4),
          vy: rand(0.5, 1.5),
          life: 1,
          decay: rand(0.04, 0.08),
          color: pick(r.palette),
        });
      }

      if (r.vy >= -1.2 || r.y <= r.targetY) {
        burst(r.x, r.y, r.palette, r.kind, r.size);
        rockets.splice(i, 1);
      }
    }

    // ascent sparks
    for (let i = trails.length - 1; i >= 0; i--) {
      const t = trails[i];
      t.x += t.vx;
      t.y += t.vy;
      t.life -= t.decay * dt * 60;
      if (t.life <= 0) trails.splice(i, 1);
    }

    // main sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.vx *= s.drag;
      s.vy = s.vy * s.drag + s.gravity * dt * 60;
      s.x += s.vx * dt * 60;
      s.y += s.vy * dt * 60;
      s.life -= s.decay * dt * 60;

      if (s.secondary && !s.cracked && s.life < 0.55 && Math.random() < 0.04) {
        s.cracked = true;
        const n = 5 + (Math.random() * 5) | 0;
        for (let k = 0; k < n; k++) {
          const a = rand(0, Math.PI * 2);
          const sp = rand(1.2, 2.8);
          sparks.push({
            x: s.x, y: s.y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            life: 0.7,
            decay: rand(0.02, 0.04),
            color: s.color,
            size: rand(0.8, 1.4),
            kind: "ember",
            drag: 0.96,
            gravity: 0.05,
            twinkle: Math.random(),
            secondary: false,
            cracked: true,
          });
        }
        if (!muted && Math.random() < 0.2) noiseBurst(0.04, 0.015);
      }

      // willow drip trails
      if (s.kind === "willow" && Math.random() < 0.35) {
        trails.push({
          x: s.x, y: s.y,
          vx: 0, vy: 0.2,
          life: s.life * 0.8,
          decay: 0.05,
          color: s.color,
        });
      }

      if (s.life <= 0 || s.y > H + 40) sparks.splice(i, 1);
    }

    for (let i = glitter.length - 1; i >= 0; i--) {
      const g = glitter[i];
      g.x += g.vx;
      g.y += g.vy;
      g.life -= g.decay * dt * 60;
      if (g.life <= 0) glitter.splice(i, 1);
    }

    for (let i = smoke.length - 1; i >= 0; i--) {
      const s = smoke[i];
      s.x += s.vx * dt * 60;
      s.y += s.vy * dt * 60;
      s.r += 8 * dt;
      s.life -= s.decay * dt * 60;
      if (s.life <= 0) smoke.splice(i, 1);
    }

    // soft cap for performance
    if (sparks.length > 1800) sparks.splice(0, sparks.length - 1800);
    if (trails.length > 800) trails.splice(0, trails.length - 800);
  }

  function draw() {
    const sx = (Math.random() - 0.5) * shake * 0.35;
    const sy = (Math.random() - 0.5) * shake * 0.35;
    ctx.save();
    ctx.translate(sx, sy);

    drawSky(0);

    // smoke behind
    ctx.globalCompositeOperation = "source-over";
    for (const s of smoke) {
      ctx.globalAlpha = s.life * 0.08;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      g.addColorStop(0, "rgba(180, 190, 220, 0.5)");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = "lighter";

    // rocket bodies + trails
    for (const r of rockets) {
      for (let i = 0; i < r.trail.length; i++) {
        const t = r.trail[i];
        ctx.globalAlpha = Math.max(0, t.life) * 0.65;
        ctx.fillStyle = r.palette[0];
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1.5 + i * 0.12, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff6e0";
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const t of trails) {
      ctx.globalAlpha = Math.max(0, t.life) * 0.7;
      ctx.fillStyle = t.color;
      ctx.fillRect(t.x, t.y, 1.6, 1.6);
    }

    for (const s of sparks) {
      const tw = 0.7 + 0.3 * Math.sin(time * 18 + s.twinkle * 20);
      ctx.globalAlpha = Math.max(0, s.life) * tw;
      ctx.fillStyle = s.color;
      const r = s.size * (0.6 + s.life * 0.5);
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();
      // hot core
      if (s.life > 0.45) {
        ctx.globalAlpha = s.life * 0.5;
        ctx.fillStyle = "#fff8e8";
        ctx.beginPath();
        ctx.arc(s.x, s.y, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const g of glitter) {
      ctx.globalAlpha = g.life;
      ctx.fillStyle = "#fffaf0";
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * g.life, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    time += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function pointerLaunch(clientX, clientY) {
    ensureAudio();
    const x = clientX;
    const y = H + 8;
    const targetY = clamp(clientY, H * 0.1, H * 0.55);
    launch(x, y, {
      targetY,
      vx: (x - W / 2) / W * 1.2,
      size: rand(0.95, 1.3),
    });
  }

  canvas.addEventListener("pointerdown", (e) => {
    pointerLaunch(e.clientX, e.clientY);
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      ensureAudio();
      triggerFinale();
    } else if (e.key === "m" || e.key === "M") {
      btnMute.click();
    } else if (e.key === "a" || e.key === "A") {
      btnShow.click();
    }
  });

  btnShow.addEventListener("click", () => {
    autoShow = !autoShow;
    btnShow.classList.toggle("active", autoShow);
    btnShow.setAttribute("aria-pressed", String(autoShow));
    btnShow.textContent = autoShow ? "Auto Show" : "Auto Paused";
    if (autoShow) {
      showClock = 0;
      nextCue = 0.4;
    }
  });

  btnFinale.addEventListener("click", () => {
    ensureAudio();
    triggerFinale();
  });

  btnMute.addEventListener("click", () => {
    muted = !muted;
    btnMute.textContent = muted ? "Sound Off" : "Sound On";
    btnMute.classList.toggle("active", !muted);
    btnMute.setAttribute("aria-pressed", String(!muted));
    if (!muted) ensureAudio();
    else if (audioCtx) audioCtx.suspend();
  });

  window.addEventListener("resize", resize);
  resize();

  // opening beat
  setTimeout(() => {
    launch(W * 0.5, H + 10, { kind: "chrysanthemum", size: 1.25, palette: PALETTES[1], targetY: H * 0.28 });
  }, 600);
  setTimeout(() => {
    launch(W * 0.32, H + 10, { kind: "peony", size: 1.0, palette: PALETTES[0], targetY: H * 0.34 });
    launch(W * 0.68, H + 10, { kind: "ring", size: 1.05, palette: PALETTES[2], targetY: H * 0.3 });
  }, 1400);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
