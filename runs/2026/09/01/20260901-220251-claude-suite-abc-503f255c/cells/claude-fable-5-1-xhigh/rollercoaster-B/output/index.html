<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duskline</title>
<meta name="description" content="Duskline: a continuous first-person rollercoaster ride over a twilight lake, built with Three.js in a single file.">
<style>
  :root {
    --ink: #f4efe9;
    --ink-dim: rgba(244, 239, 233, 0.62);
    --accent: #ffb27a;
    --shadow: 0 1px 2px rgba(0,0,0,0.55), 0 0 18px rgba(0,0,0,0.35);
  }
  html, body { margin: 0; height: 100%; background: #1a1630; overflow: hidden; }
  body {
    font-family: "Inter", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #c.dragging { cursor: grabbing; }

  .hud { position: fixed; pointer-events: none; text-shadow: var(--shadow); transition: opacity 0.9s ease; }
  body.hide-ui .hud, body.hide-ui #sound { opacity: 0 !important; pointer-events: none; }

  #title {
    inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; opacity: 0; transition: opacity 1.6s ease;
  }
  #title.show { opacity: 1; }
  #title h1 {
    margin: 0; font-weight: 300; font-size: clamp(44px, 9vw, 112px); letter-spacing: 0.32em;
    text-indent: 0.32em; line-height: 1;
  }
  #title p {
    margin: 18px 0 0; font-size: clamp(12px, 1.4vw, 15px); letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  #title .rule { width: 56px; height: 1px; background: var(--accent); margin-top: 22px; opacity: 0.8; }

  #section {
    top: max(22px, env(safe-area-inset-top)); left: max(26px, env(safe-area-inset-left));
    font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-dim); opacity: 0;
  }
  #section.show { opacity: 1; }
  #section strong { display: block; margin-top: 6px; font-weight: 400; font-size: 22px; letter-spacing: 0.08em; text-transform: none; color: var(--ink); }

  #stats {
    left: max(26px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom));
    display: flex; gap: 26px; font-variant-numeric: tabular-nums;
  }
  #stats div { display: flex; flex-direction: column; }
  #stats span { font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 4px; }
  #stats b { font-weight: 400; font-size: 26px; line-height: 1; }
  #stats small { font-size: 12px; color: var(--ink-dim); margin-left: 3px; }

  #hint {
    left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.14em; color: var(--ink-dim); white-space: nowrap; opacity: 0;
  }
  #hint.show { opacity: 1; }

  #sound {
    position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom));
    background: rgba(20, 16, 40, 0.42); color: var(--ink); border: 1px solid rgba(244,239,233,0.28);
    border-radius: 999px; padding: 9px 16px 9px 13px; font: inherit; font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 9px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: opacity 0.9s ease, border-color 0.3s;
  }
  #sound:hover { border-color: var(--accent); }
  #sound i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-dim); display: inline-block; }
  #sound.on i { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  #fail {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 40px; line-height: 1.6; color: var(--ink);
  }
  #fail.show { display: flex; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(8,6,20,0.55) 100%);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="title" class="hud">
  <h1>DUSKLINE</h1>
  <div class="rule"></div>
  <p>A continuous first-person ride</p>
</div>
<div id="section" class="hud"><span id="sectionKicker">Now riding</span><strong id="sectionName">Station</strong></div>
<div id="stats" class="hud">
  <div><span>Speed</span><b><span id="speed" style="font-size:inherit;letter-spacing:0;text-transform:none;color:inherit;margin:0">0</span><small>km/h</small></b></div>
  <div><span>Force</span><b><span id="gforce" style="font-size:inherit;letter-spacing:0;text-transform:none;color:inherit;margin:0">1.0</span><small>g</small></b></div>
  <div><span>Height</span><b><span id="height" style="font-size:inherit;letter-spacing:0;text-transform:none;color:inherit;margin:0">5</span><small>m</small></b></div>
</div>
<div id="hint" class="hud">Drag to look around &nbsp;·&nbsp; M sound &nbsp;·&nbsp; H interface</div>
<button id="sound" type="button" aria-pressed="false"><i></i><span id="soundLabel">Sound off</span></button>
<div id="fail"><div>This ride needs WebGL.<br>Please open it in a current desktop or mobile browser with hardware acceleration enabled.</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="tracklib">
/* ------------------------------------------------------------------
   TrackLib: pure geometry and physics. No DOM, no WebGL.
   Builds the closed coaster circuit, rider frames, banking, the
   speed profile and the terrain the circuit is graded into.
------------------------------------------------------------------- */
const TrackLib = (function () {
  const V3 = THREE.Vector3;
  const G = 9.81;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const DEG = Math.PI / 180;

  // ---- deterministic noise -----------------------------------------
  function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123; return s - Math.floor(s); }
  function hash1(n) { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
  function vnoise(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, z, oct) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f + 17.3 * i, z * f - 9.1 * i); norm += amp; amp *= 0.5; f *= 2.07; }
    return s / norm;
  }

  // ---- terrain -----------------------------------------------------
  // Gaussian land masses over a lake floor at -5 m. Water surface is y = 0.
  const BLOBS = [
    // x, z, rx, rz, height
    [-20, -40, 130, 75, 8.5],      // station shore
    [70, -45, 70, 50, 9.0],        // ridge behind the lift hill
    [45, 105, 95, 75, 7.5],        // north-west land under the tunnel hill
    [72, 75, 26, 24, 50.0],        // the tunnel mountain
    [-330, 420, 220, 160, 9.0],    // village shore
    [380, 260, 120, 90, 6.0],      // small island east
    // far ranges
    [-200, 850, 260, 180, 240], [250, 900, 300, 200, 300], [700, 800, 240, 170, 200], [-700, 750, 280, 190, 210],
    [1100, 100, 300, 300, 90], [1000, -400, 260, 220, 120],
    [0, -700, 400, 200, 150], [500, -800, 300, 200, 180], [-500, -650, 300, 180, 130],
    [-900, 200, 250, 250, 180], [-1000, -300, 300, 220, 160]
  ];
  function terrainRaw(x, z) {
    let h = -5;
    for (let i = 0; i < BLOBS.length; i++) {
      const b = BLOBS[i];
      const dx = (x - b[0]) / b[2], dz = (z - b[1]) / b[3];
      const q = dx * dx + dz * dz;
      if (q < 9) h += b[4] * Math.exp(-q);
    }
    const n = fbm(x * 0.012, z * 0.012, 4) - 0.5;
    h += n * (3.5 + 0.28 * Math.max(0, h));
    return h;
  }

  // ---- control points ----------------------------------------------
  // Heading +X out of the station along z = 0, returning along z = 75.
  const points = [];
  const markers = {};                       // name -> control point index
  function add(x, y, z, name) { if (name) markers[name] = points.length; points.push(new V3(x, y, z)); }

  // Brake run and station (y = 5)
  add(-58, 5, 0, 'brakeStart');
  add(-46, 5, 0);
  add(-34, 5, 0);
  add(-22, 5, 0, 'stationStart');
  add(-12, 5, 0, 'stationStop');
  add(-2, 5, 0);
  // Lift hill
  add(8, 5.4, 0, 'liftStart');
  add(20, 10, 0);
  add(34, 18, 0);
  add(50, 28, 0);
  add(66, 38, 0);
  add(82, 48, 0);
  add(98, 57, 0);
  add(110, 61.5, 0);
  add(120, 62, 0, 'crest');
  // First drop: steepening to 61 degrees, then a 40 m radius pull-out
  add(128, 60, 0, 'dropStart');
  add(134, 53, 0);
  add(140, 42, 0);
  add(146, 31, 0);
  add(149.4, 25, 0);
  add(155.7, 16.7, 0);
  add(164, 10.4, 0);
  add(173.6, 6.4, 0);
  add(184, 5, 0, 'hillStart');
  // Airtime hill: 40 m valley arcs, 37 degree flanks and a 36 m crest radius, generated as a smooth profile
  add(190, 5.45, 0);
  add(198, 7.53, 0);
  add(206, 11.59, 0);
  add(214, 17.50, 0);
  add(222, 22.83, 0);
  add(230, 26.43, 0);
  add(238, 28.26, 0);
  add(246, 28.30, 0);
  add(254, 26.57, 0);
  add(262, 23.05, 0);
  add(269.2, 18.38, 0);
  add(277, 13.80, 0);
  add(285, 11.22, 0);
  add(293.2, 10.38, 0);
  add(303, 11.6, 0);
  add(313, 13, 0, 'loopStart');
  // Vertical loop: curvature blends from a 22 m radius at the base to 8 m over the top,
  // with short transitions in and out, integrated along the arc; it drifts 5.5 m
  // sideways so the exit clears the entry.
  let loopExitX = 0;
  {
    const Rb = 22, Rt = 8, step = 0.05;
    const half = [];                       // entry half, integrated along the arc up to the top
    let x = 313, y = 13, phi = 0, travelled = 0, sinceLast = 0;
    while (phi < Math.PI) {
      const R = Rt + (Rb - Rt) * (1 + Math.cos(phi)) / 2;
      const k = (1 / R) * smoothstep(0, 4, travelled);
      phi += k * step;
      x += Math.cos(phi) * step; y += Math.sin(phi) * step;
      travelled += step; sinceLast += step;
      if (sinceLast >= 2.5) { half.push([x, y]); sinceLast = 0; }
    }
    const topX = x;
    const full = half.slice();
    if (half.length && topX - half[half.length - 1][0] > 1) full.push([topX, y]);
    for (let j = half.length - 1; j >= 0; j--) full.push([2 * topX - half[j][0], half[j][1]]);   // mirrored exit half
    loopExitX = 2 * topX - 313;
    full.forEach((pt, j) => add(pt[0], pt[1], -5.5 * smoothstep(0, 1, (j + 1) / (full.length + 1))));
    add(loopExitX, 13, -5.5, 'loopEnd');
  }
  const ex = loopExitX;
  add(ex + 14, 13, -5.5);
  add(ex + 26, 10.5, -5.5);
  add(ex + 38, 8.5, -5.5, 'turnStart');
  // Rising banked turn over the water (180 degrees, radius 40.25), smooth start and finish
  const turnCX = ex + 52;
  {
    const cz = 34.75, r = 40.25;
    for (let k = 0; k <= 8; k++) {
      const s = k / 8;
      const ph = (-90 + 180 * s) * DEG;
      const lift = Math.sin(Math.PI * s);
      add(turnCX + r * Math.cos(ph), 8 + 17 * lift * lift, cz + r * Math.sin(ph), k === 8 ? 'hillsStart' : undefined);
    }
  }
  // Camelback (36 m crest radius) and a bunny hop, heading -X along z = 75
  {
    const camel = [8.2, 9.2, 12.5, 17.5, 21.1, 22.5, 21.1, 17.5, 12.5, 9.2, 8.2];
    camel.forEach((y, k) => add(turnCX - 11 - 10 * k, y, 75));
    add(turnCX - 121, 8.5, 75);
    const hop = [11, 14.7, 16.2, 14.7, 11, 8.5];
    hop.forEach((y, k) => add(turnCX - 131 - 10 * k, y, 75));
    const runFrom = turnCX - 193;
    for (let x = runFrom; x > 118; x -= 14) add(x, lerp(8.5, 10, (runFrom - x) / (runFrom - 118)), 75);
  }
  add(104, 10, 75, 'tunnelStart');
  // Tunnel straight through the mountain
  add(90, 10, 75);
  add(76, 10, 75);
  add(62, 10, 75);
  add(48, 10, 75);
  add(34, 10, 75, 'tunnelEnd');
  // Lakeside slalom
  add(22, 10, 75, 'slalomStart');
  add(10, 10.5, 72);
  add(-2, 11.5, 67);
  add(-14, 11.5, 66);
  add(-26, 10.5, 70);
  add(-38, 9.5, 75.5);
  add(-48, 8.8, 75.5);
  add(-58, 8, 75, 'finalStart');
  // Descending final turn back to the brake run (180 degrees, radius 37.5)
  {
    const cx = -70, cz = 37.5, r = 37.5;
    for (let k = 1; k <= 7; k++) {
      const s = k / 8;
      const ph = (90 + 180 * s) * DEG;
      add(cx + r * Math.cos(ph), 8 - 3 * s, cz + r * Math.sin(ph));
    }
  }
  // k = 8 lands on (-70, 5, 0); the closed spline then continues into brakeStart at (-58, 5, 0).
  add(-70, 5, 0);

  // ---- sample the closed spline by arc length ----------------------
  const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal');
  curve.arcLengthDivisions = 6000;
  const length = curve.getLength();
  const N = Math.round(length / 0.5);
  const ds = length / N;
  const pos = new Array(N), tan = new Array(N);
  for (let i = 0; i < N; i++) pos[i] = curve.getPointAt(i / N);
  for (let i = 0; i < N; i++) tan[i] = pos[(i + 1) % N].clone().sub(pos[(i - 1 + N) % N]).normalize();

  // control-point markers -> nearest sample index
  const idx = {};
  for (const name in markers) {
    const p = points[markers[name]];
    let best = 0, bd = Infinity;
    for (let i = 0; i < N; i++) { const d = pos[i].distanceToSquared(p); if (d < bd) { bd = d; best = i; } }
    idx[name] = best;
  }
  // the chain releases the train at the highest point of the lift
  {
    let best = idx.liftStart, by = -Infinity;
    for (let i = idx.liftStart; i <= idx.dropStart; i++) if (pos[i].y > by) { by = pos[i].y; best = i; }
    idx.crest = best;
  }
  const inRange = (i, a, b) => (a <= b) ? (i >= a && i < b) : (i >= a || i < b);   // circular [a, b)

  // ---- rider frames: parallel transport relaxed toward gravity ------
  const up = new Array(N);
  {
    const u = new V3(0, 1, 0), proj = new V3();
    u.addScaledVector(tan[0], -u.dot(tan[0])).normalize();
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < N; i++) {
        const t = tan[i];
        u.addScaledVector(t, -u.dot(t)).normalize();
        const wVert = 1 - Math.abs(t.y);                 // no reference when the track is vertical
        const wUpright = smoothstep(-0.35, 0.35, u.y);   // stay inverted through the loop
        const w = 0.05 * wVert * wVert * wUpright;
        if (w > 0) {
          proj.set(0, 1, 0).addScaledVector(t, -t.y).normalize();
          u.lerp(proj, w).normalize();
          u.addScaledVector(t, -u.dot(t)).normalize();
        }
        if (pass === 1) up[i] = u.clone();
      }
    }
    // close the seam: distribute any residual twist around the circuit
    const uEnd = up[N - 1].clone(); uEnd.addScaledVector(tan[0], -uEnd.dot(tan[0])).normalize();
    const cr = new V3().crossVectors(uEnd, up[0]);
    const delta = Math.atan2(cr.dot(tan[0]), uEnd.dot(up[0]));
    for (let i = 0; i < N; i++) {
      const th = delta * i / N, c = Math.cos(th), s = Math.sin(th);
      const t = tan[i], v = up[i];
      const tv = new V3().crossVectors(t, v);
      up[i] = v.multiplyScalar(c).addScaledVector(tv, s).normalize();
    }
  }
  const right = up.map((u, i) => new V3().crossVectors(tan[i], u).normalize());

  // ---- speed profile -----------------------------------------------
  const ZONE = { COAST: 0, LAUNCH: 1, LIFT: 2, BRAKE: 3, APPROACH: 4 };
  const CHAIN = 4.5, VMIN = 1.0, VSTATION = 1.5, VBRAKE = 6.0;
  const zone = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    if (inRange(i, idx.brakeStart, idx.stationStart)) zone[i] = ZONE.BRAKE;
    else if (inRange(i, idx.stationStart, idx.stationStop)) zone[i] = ZONE.APPROACH;
    else if (inRange(i, idx.stationStop, idx.liftStart)) zone[i] = ZONE.LAUNCH;
    else if (inRange(i, idx.liftStart, idx.crest)) zone[i] = ZONE.LIFT;
    else zone[i] = ZONE.COAST;
  }
  const speed = new Float32Array(N);
  {
    let v = VSTATION;
    for (let k = 0; k < N; k++) {
      const i = (idx.stationStop + k) % N;
      speed[i] = v;
      const z = zone[i];
      if (z === ZONE.LAUNCH) v = Math.min(CHAIN, Math.sqrt(v * v + 2 * 1.4 * ds));
      else if (z === ZONE.LIFT) v = CHAIN;
      else if (z === ZONE.BRAKE) v = Math.max(VBRAKE, Math.sqrt(Math.max(0, v * v - 2 * 8.5 * ds)));
      else if (z === ZONE.APPROACH) v = Math.max(VSTATION, Math.sqrt(Math.max(0, v * v - 2 * 1.9 * ds)));
      else {
        const a = -G * tan[i].y - 0.006 * G - 0.00045 * v * v;   // gravity, rolling resistance, air drag
        v = Math.sqrt(Math.max(VMIN * VMIN, v * v + 2 * a * ds));
      }
    }
  }

  // ---- banking from lateral acceleration, then smoothed ------------
  function boxSmooth(arr, radius, passes) {
    let src = Float32Array.from(arr);
    for (let p = 0; p < passes; p++) {
      const out = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        let s = 0;
        for (let k = -radius; k <= radius; k++) s += src[(i + k + N) % N];
        out[i] = s / (2 * radius + 1);
      }
      src = out;
    }
    return src;
  }
  const curv = new Array(N);
  for (let i = 0; i < N; i++) curv[i] = tan[(i + 1) % N].clone().sub(tan[(i - 1 + N) % N]).multiplyScalar(1 / (2 * ds));
  let bank = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const aLat = speed[i] * speed[i] * curv[i].dot(right[i]);
    bank[i] = clamp(Math.atan2(aLat, G), -80 * DEG, 80 * DEG);
  }
  bank = boxSmooth(bank, 18, 2);
  const upB = new Array(N), rightB = new Array(N);
  for (let i = 0; i < N; i++) {
    upB[i] = up[i].clone().multiplyScalar(Math.cos(bank[i])).addScaledVector(right[i], Math.sin(bank[i])).normalize();
    rightB[i] = new V3().crossVectors(tan[i], upB[i]).normalize();
  }

  // ---- forces felt by the rider ------------------------------------
  let gVert = new Float32Array(N), gLat = new Float32Array(N);
  {
    const felt = new V3();
    for (let i = 0; i < N; i++) {
      const v2 = speed[i] * speed[i];
      const vp = speed[(i + 1) % N], vm = speed[(i - 1 + N) % N];
      const aTan = (vp * vp - vm * vm) / (4 * ds);
      felt.copy(curv[i]).multiplyScalar(v2).addScaledVector(tan[i], aTan);
      felt.y += G;
      gVert[i] = felt.dot(upB[i]) / G;
      gLat[i] = felt.dot(rightB[i]) / G;
    }
    gVert = boxSmooth(gVert, 6, 2);
    gLat = boxSmooth(gLat, 6, 2);
  }

  // ---- tunnel portals: where the mountain genuinely swallows the track
  const tunnel = { iIn: -1, iOut: -1, iSwallowIn: -1, iSwallowOut: -1 };
  for (let i = idx.hillsStart; i <= idx.finalStart; i++) {
    const p = pos[i], h = terrainRaw(p.x, p.z);
    if (h > p.y - 3.2) { if (tunnel.iSwallowIn < 0) tunnel.iSwallowIn = i; tunnel.iSwallowOut = i; }
    if (h > p.y + 0.8) { if (tunnel.iIn < 0) tunnel.iIn = i; tunnel.iOut = i; }
  }
  const inTunnel = i => i >= tunnel.iIn - 12 && i <= tunnel.iOut + 12;
  // the tube runs 6 m beyond each hill face; the ground beneath it is slotted so no hillside cuts through the bore
  tunnel.a = pos[tunnel.iIn].clone().addScaledVector(tan[tunnel.iIn], -6);
  tunnel.b = pos[tunnel.iOut].clone().addScaledVector(tan[tunnel.iOut], 6);
  tunnel.y = pos[tunnel.iIn].y;
  function tunnelSlot(x, z) {
    const ax = tunnel.a.x, az = tunnel.a.z, bx = tunnel.b.x, bz = tunnel.b.z;
    const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / L2, 0, 1);
    const px = ax + t * dx, pz = az + t * dz;
    return Math.hypot(x - px, z - pz) < 7.5;
  }

  // ---- grade the ground away from the track ------------------------
  const GRID = { x0: -420, z0: -380, cell: 4, nx: 260, nz: 220 };
  const limit = new Float32Array(GRID.nx * GRID.nz).fill(1e9);
  {
    const R = 7, cells = Math.ceil(R / GRID.cell);
    for (let i = 0; i < N; i++) {
      if (inTunnel(i)) continue;
      const p = pos[i];

  // ---- sound: synthesised wind, rumble, chain and chimes -----------------------
  const audio = { ctx: null, on: false, chainDist: 0 };
  function initAudio() {
    if (audio.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain(); master.gain.value = 0;
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 16000;
    const echo = ctx.createDelay(0.5); echo.delayTime.value = 0.11;
    const echoFb = ctx.createGain(); echoFb.gain.value = 0.42;
    const echoWet = ctx.createGain(); echoWet.gain.value = 0;
    tone.connect(master); tone.connect(echo); echo.connect(echoFb); echoFb.connect(echo); echo.connect(echoWet); echoWet.connect(master);
    master.connect(ctx.destination);
    const noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    function noiseVoice(type, freq, q) {
      const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(f).connect(g).connect(tone); src.start();
      return { f, g };
    }
    const wind = noiseVoice('bandpass', 500, 0.7);
    const hiss = noiseVoice('highpass', 2400, 0.5);
    const rumble = noiseVoice('lowpass', 110, 0.9);
    const click = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
    const cd = click.getChannelData(0);
    for (let i = 0; i < cd.length; i++) { const t = i / ctx.sampleRate; cd[i] = (Math.random() * 2 - 1) * Math.exp(-t * 120) * 0.6 + Math.sin(t * 2 * Math.PI * 1500) * Math.exp(-t * 90) * 0.4; }
    Object.assign(audio, { ctx, master, tone, echoWet, wind, hiss, rumble, click });
  }
  function playClick(vol, rate) {
    const a = audio; if (!a.ctx || !a.on) return;
    const s = a.ctx.createBufferSource(); s.buffer = a.click; s.playbackRate.value = rate;
    const g = a.ctx.createGain(); g.gain.value = vol;
    s.connect(g).connect(a.tone); s.start();
  }
  function chime() {
    const a = audio; if (!a.ctx || !a.on) return;
    [[660, 0], [880, 0.22]].forEach(([f, dt]) => {
      const o = a.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = a.ctx.createGain(); const t0 = a.ctx.currentTime + dt;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      o.connect(g).connect(a.master); o.start(t0); o.stop(t0 + 0.55);
    });
  }

    }
  }

  // ---- the ride ------------------------------------------------------------------
  const frame = T.makeFrame(), ahead = T.makeFrame();
  const stopS = T.idx.stationStop * T.ds;
  const ride = { s: stopS + 0.01, hold: 3.5, chimed: false, time: 0, sinceStats: 0 };
  const localAhead = V(), tmpV = V(), invQ = new THREE.Quaternion(), shakeOff = V();
  function advance(dt) {
    if (ride.hold > 0) {
      ride.hold -= dt;
      if (!ride.chimed && ride.hold < 1.2) { ride.chimed = true; chime(); }
      return;
    }
    T.frameAt(ride.s, frame);
    const prev = ride.s;
    let next = prev + frame.speed * dt;
    if (prev < stopS && next >= stopS) { next = stopS + 0.01; ride.hold = 3.4; ride.chimed = false; }
    ride.s = next % T.length;
  }
  function placeRider(dt) {
    T.frameAt(ride.s, frame);
    T.frameAt(ride.s + 9, ahead);
    rig.position.copy(frame.pos);
    negT.copy(frame.tan).negate();
    M4.makeBasis(frame.right, frame.up, negT);
    rig.quaternion.setFromRotationMatrix(M4);
    // riders look a little way down the track, with a lag when it bends
    invQ.copy(rig.quaternion).invert();
    localAhead.copy(ahead.tan).applyQuaternion(invQ);
    const aheadYaw = Math.atan2(-localAhead.x, -localAhead.z), aheadPitch = Math.asin(T.clamp(localAhead.y, -1, 1));
    // look-around: follow the drag, then drift back to centre
    if (!look.dragging) { look.idle += dt; if (look.idle > 0.8) { const k = Math.exp(-dt * 1.4); look.tYaw *= k; look.tPitch *= k; } }
    const kf = 1 - Math.exp(-dt * 9);
    look.yaw += (look.tYaw - look.yaw) * kf;
    look.pitch += (look.tPitch - look.pitch) * kf;
    // vibration grows with speed; the chain adds a slow judder on the lift
    const v = frame.speed, k = Math.min(1, v / 33);
    const t = ride.time;
    const amp = 0.0035 + 0.02 * k * k + (frame.zone === T.ZONE.LIFT ? 0.006 : 0);
    shakeOff.set(
      Math.sin(t * 37.1) * 0.6 + Math.sin(t * 23.7 + 1.3) * 0.4,
      Math.sin(t * 41.3 + 0.7) * 0.5 + Math.sin(t * 19.1) * 0.5 + (frame.zone === T.ZONE.LIFT ? Math.max(0, Math.sin(t * 25)) * 0.8 : 0),
      0).multiplyScalar(amp);
    const sink = -0.05 * T.clamp(frame.gVert - 1, -1.2, 3.5);
    camera.position.set(shakeOff.x - 0.03 * frame.gLat, 1.22 + sink + shakeOff.y, 0);
    camera.rotation.set(aheadPitch * 0.35 + look.pitch + shakeOff.y * 0.4, aheadYaw * 0.4 + look.yaw, shakeOff.x * 0.3);
    const fov = 72 + 11 * k * k;
    if (Math.abs(fov - camera.fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }
  let last = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    tick(dt);
  }
  function tick(dt) {
    ride.time += dt;
    advance(dt);
    placeRider(dt);
    const inTunnel = frame.index >= T.tunnel.iIn && frame.index <= T.tunnel.iOut;
    updateAudio(frame, dt, inTunnel);
    showSection(sectionAt(ride.s));
    ride.sinceStats += dt;
    if (ride.sinceStats > 0.12) {
      ride.sinceStats = 0;
      const v = ride.hold > 0 ? 0 : frame.speed;
      ui.speed.textContent = Math.round(v * 3.6);
      ui.g.textContent = (ride.hold > 0 ? 1 : frame.gVert).toFixed(1);
      ui.h.textContent = Math.round(frame.pos.y);
    }
    waterMat.uniforms.time.value = ride.time;
    camera.getWorldPosition(tmpV);
    sky.position.copy(tmpV);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
  Object.assign(window.DUSKLINE, { scene, camera, renderer, T, frame, ride, look, audio, setSound, tick });
})();
</script>
