<style>

  body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; }

<script>
// ===== TRACK BUILDER (pure JS, no Three.js dependency) =====
// Produces a closed, uniformly-sampled track with banked frames and a physically-integrated speed profile.
function buildTrack() {
  const G = 9.81;
  const STEP = 0.5;

  // Horizontal plan: [horizontal length (m), total yaw change (deg, + = right)]
  const PLAN = [
    [30, 0],       // station
    [100, 0],      // lift hill
    [65, 0],       // first drop
    [130, 170],    // climbing turnaround
    [60, 0],       // lakeside skim
    [70, 0],       // camelback
    [40, 0],       // loop approach (loop inserted at u=490)
    [30, 0],       // rise out of loop
    [183.8, 405],  // descending helix, r = 26 m
    [45, 0],       // trim brakes
    [40, -35],     // bend into tunnel
    [85, 0],       // launch tunnel
    [70, 0],       // top hat climb
    [122, 180],    // sunset turn
    [185, 0],      // bunny hops + brake run
  ];

  // Height profile keyframes [u, y] along turtle horizontal distance.
  // Crests / valleys are sampled from parabolas / circles sized for the expected speed.
  const PROFILE = [
    [0, 3], [35, 3], [43, 3.8], [111, 56], [119, 59], [125, 59.5],
    [131, 58.4], [137, 54.5], [147.7, 26.3], [155.8, 14], [166.4, 6.7], [175.6, 3.76], [182, 3.2],
    [191.6, 4.46], [203.2, 9.9], [230, 27.1], [250, 30], [270, 27.1],
    [292, 17], [315, 7.56], [324.6, 3.56], [335, 2.2], [379, 2.2],
    [388.6, 3.46], [397.5, 7.2], [419, 21.3], [434, 24], [449, 21.3], [464, 13], [468.3, 9.6], [478.6, 4.3], [490, 2.5],
    [499.6, 3.76], [508.5, 7.46], [522, 15.5], [532, 19], [545, 20], [560, 19.3], [695, 6.5], [710, 5],
    [760, 3.8], [800, 3.5], [880, 3.5],
    [892.7, 5.73], [903.8, 12.2], [913.5, 24.9], [916.2, 30.6], [922.8, 39.15], [930.3, 43.5], [938.9, 45],
    [947.5, 43.5], [955, 39.15], [961.6, 30.6], [964.3, 24.9], [974, 12.2], [985.1, 5.73], [997.8, 3.5],
    [1020, 8], [1065, 5],
    [1077, 4.5], [1085, 5.9], [1091.4, 8.77], [1099.4, 10], [1107.4, 8.77], [1113.8, 5.9], [1121.8, 4.5],
    [1129.8, 5.9], [1136.2, 8.27], [1144.2, 9.5], [1152.2, 8.27], [1158.6, 5.4], [1166.6, 4],
    [1174.6, 5.4], [1181, 7.77], [1189, 9], [1197, 7.77], [1203.4, 4.9], [1211.4, 3.5],
    [1230, 3], [1500, 3],
  ];

  const LOOPS = [{ u: 490, R0: 17, k: 0.45, w: 3.8 }];

  // Sections: [uStart, name, type, target speed, decel]
  const SECTIONS = [
    [0, 'Station', 'station', 4.5],
    [30, 'Lift Hill', 'lift', 6.5],
    [125, 'First Drop', 'free'],
    [192, 'Sky Turn', 'free'],
    [330, 'Lakeside', 'free'],
    [385, 'Camelback', 'free'],
    [472, 'Vertical Loop', 'free'],
    [524, 'Helix', 'free'],
    [712, 'Trim Brakes', 'brake', 9, 5.5],
    [785, 'Launch Tunnel', 'brake', 9, 5.5],
    [800, 'Launch Tunnel', 'launch', 33],
    [850, 'Launch Tunnel', 'free'],
    [881, 'Top Hat', 'free'],
    [980, 'Sunset Turn', 'free'],
    [1045, 'Sunset Turn', 'brake', 21, 9],
    [1075, 'Bunny Hops', 'free'],
    [1215, 'Brake Run', 'brake', 8, 6],
    [1310, 'Station', 'station', 4.5],
  ];
  const TUNNEL_U = [798, 881];

  // ---- profile interpolation (monotone cubic, PCHIP) ----
  const px = PROFILE.map(p => p[0]), py = PROFILE.map(p => p[1]);
  const n = px.length, h = [], d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) { h[i] = px[i + 1] - px[i]; d[i] = (py[i + 1] - py[i]) / h[i]; }
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
  }
  function profileY(u) {
    if (u <= px[0]) return py[0];
    if (u >= px[n - 1]) return py[n - 1];
    let i = 0; while (px[i + 1] < u) i++;
    const t = (u - px[i]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * py[i] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * py[i + 1] + (t3 - t2) * h[i] * m[i + 1];
  }
  function sectionIndexAt(u) { let s = 0; for (let i = 0; i < SECTIONS.length; i++) if (u >= SECTIONS[i][0]) s = i; return s; }

  // ---- yaw rate per step, smoothed so curvature ramps in (easement curves) ----
  const totalU = PLAN.reduce((a, p) => a + p[0], 0);
  const N = Math.round(totalU / STEP);
  let rate = new Float64Array(N);
  { let i = 0; for (const [len, turn] of PLAN) { const k = Math.round(len / STEP), r = turn * Math.PI / 180 / k; for (let j = 0; j < k && i < N; j++) rate[i++] = r; } }
  for (let pass = 0; pass < 3; pass++) {
    const W = 24, out = new Float64Array(N);
    for (let i = 0; i < N; i++) { let s = 0, c = 0; for (let j = -W; j <= W; j++) { const q = i + j; if (q >= 0 && q < N) { s += rate[q]; c++; } } out[i] = s / c; }
    rate = out;
  }

  // ---- turtle walk ----
  const pts = [];
  let x = 0, z = 0, yaw = 0, ox = 0, oz = 0;
  const loopsLeft = LOOPS.slice();
  for (let i = 0; i <= N; i++) {
    const u = i * STEP;
    const y = profileY(u);
    pts.push({ x: x + ox, y, z: z + oz, up: null, loop: false, u });
    if (loopsLeft.length && u >= loopsLeft[0].u) {
      const L = loopsLeft.shift();
      const f = [Math.cos(yaw), 0, Math.sin(yaw)], r = [-Math.sin(yaw), 0, Math.cos(yaw)];
      const bx = x + ox, by = y, bz = z + oz;
      const LM = 900;
      for (let j = 1; j < LM; j++) {
        const p = j / LM * Math.PI * 2;
        const lx = L.R0 * (Math.sin(p) + L.k * (p / 2 + Math.sin(2 * p) / 4));
        const ly = L.R0 * (1 - Math.cos(p) + L.k * Math.sin(p) ** 2 / 2);
        const ll = L.w * (p - Math.sin(p)) / (Math.PI * 2);
        pts.push({
          x: bx + f[0] * lx + r[0] * ll, y: by + ly, z: bz + f[2] * lx + r[2] * ll,
          up: [-f[0] * Math.sin(p), Math.cos(p), -f[2] * Math.sin(p)], loop: true, u,
        });
      }
      const Lx = L.R0 * L.k * Math.PI;
      ox += f[0] * Lx + r[0] * L.w; oz += f[2] * Lx + r[2] * L.w;
      pts.push({ x: x + ox, y, z: z + oz, up: null, loop: false, u });
    }
    if (i < N) { yaw += rate[i] * STEP; x += Math.cos(yaw) * STEP; z += Math.sin(yaw) * STEP; }
  }

  // ---- closure: flat Hermite curve back into the station ----
  {
    const e = pts[pts.length - 1];
    const dist = Math.hypot(e.x, e.z);
    const t0 = [Math.cos(yaw) * dist, Math.sin(yaw) * dist], t1 = [dist, 0];
    const K = Math.max(2, Math.ceil(dist / 0.25));
    for (let j = 1; j < K; j++) {
      const t = j / K, t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h11 = t3 - t2;
      pts.push({ x: h00 * e.x + h10 * t0[0] + h11 * t1[0], y: e.y + (py[0] - e.y) * (3 * t2 - 2 * t3), z: h00 * e.z + h10 * t0[1] + h11 * t1[1], up: null, loop: false, u: totalU + t * dist });
    }
  }

  // ---- resample closed polyline at uniform arc length ----
  function resample(src, spacing) {
    const cum = [0];
    for (let i = 1; i <= src.length; i++) {
      const a = src[i - 1], b = src[i % src.length];
      cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z));
    }
    const total = cum[src.length], cnt = Math.round(total / spacing), out = [];
    let j = 0;
    for (let i = 0; i < cnt; i++) {
      const s = i * total / cnt;
      while (cum[j + 1] < s) j++;
      const a = src[j], b = src[(j + 1) % src.length], t = (s - cum[j]) / Math.max(1e-9, cum[j + 1] - cum[j]);
      const nn = t < 0.5 ? a : b;
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t, up: nn.up, loop: a.loop && b.loop, u: nn.u });
    }
    return out;
  }
  function smooth(arr, sigma) {
    const W = Math.ceil(sigma * 3), w = [];
    let ws = 0; for (let j = -W; j <= W; j++) { const v = Math.exp(-j * j / (2 * sigma * sigma)); w.push(v); ws += v; }
    const cnt = arr.length;
    return arr.map((p, i) => {
      let sx = 0, sy = 0, sz = 0;
      for (let j = -W; j <= W; j++) { const q = arr[(i + j + cnt) % cnt], k = w[j + W]; sx += q.x * k; sy += q.y * k; sz += q.z * k; }
      return { ...p, x: sx / ws, y: sy / ws, z: sz / ws };
    });
  }
  let P = resample(pts, 0.5);
  P = smooth(P, 4);
  P = resample(P, 0.5);
  P = smooth(P, 3);
  P = resample(P, 0.5);

  // Rotate indices so that sample 0 is the point nearest the station centre (origin).
  {
    let best = 0, bd = 1e9;
    for (let i = 0; i < P.length; i++) { const q = P[i]; const dd = q.x * q.x + q.z * q.z + (q.u > 200 && q.u < totalU ? 1e6 : 0); if (dd < bd) { bd = dd; best = i; } }
    P = P.slice(best).concat(P.slice(0, best));
  }

  // ---- per-sample data ----
  const M = P.length;
  const pos = new Float32Array(M * 3), tan = new Float32Array(M * 3), nor = new Float32Array(M * 3), rig = new Float32Array(M * 3);
  const sArr = new Float32Array(M + 1), vel = new Float32Array(M), gV = new Float32Array(M), gL = new Float32Array(M);
  const secIdx = new Uint8Array(M), uArr = new Float32Array(M), loopFlag = new Uint8Array(M);
  for (let i = 0; i < M; i++) { pos[i * 3] = P[i].x; pos[i * 3 + 1] = P[i].y; pos[i * 3 + 2] = P[i].z; uArr[i] = P[i].u; loopFlag[i] = P[i].loop ? 1 : 0; }
  for (let i = 1; i <= M; i++) {
    const a = P[i - 1], b = P[i % M];
    sArr[i] = sArr[i - 1] + Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
  }
  const LEN = sArr[M];
  const T = [];
  for (let i = 0; i < M; i++) {
    const a = P[(i - 1 + M) % M], b = P[(i + 1) % M];
    const tx = b.x - a.x, ty = b.y - a.y, tz = b.z - a.z, l = Math.hypot(tx, ty, tz);
    T.push([tx / l, ty / l, tz / l]);
  }
  for (let i = 0; i < M; i++) secIdx[i] = sectionIndexAt(P[i].u);

  // ---- speed profile: energy integration with rolling friction, drag and drives ----
  const MU = 0.012, CD = 0.00022, VMIN = 1.2;
  let stalls = 0;
  function integrate(v0) {
    let v = v0;
    stalls = 0;
    for (let i = 0; i < M; i++) {
      vel[i] = v;
      const ds = sArr[i + 1] - sArr[i];
      const sec = SECTIONS[secIdx[i]], type = sec[2], vt = sec[3];
      let a = -G * T[i][1] - (MU * G + CD * v * v);
      if (type === 'lift') { if (v < vt) a = 2.0; else { v = vt; a = 0; } }
      else if (type === 'station') a = Math.max(-3, Math.min(1.5, (vt - v) * 1.2));
      else if (type === 'brake') { if (v > vt) a = -sec[4]; else if (v < vt * 0.8) a = 1.5; }
      else if (type === 'launch') { if (v < vt) a = 11.5; }
      let v2 = v * v + 2 * a * ds;
      if (v2 < VMIN * VMIN) { if (type === 'free') stalls++; v2 = VMIN * VMIN; }
      v = Math.sqrt(v2);
      if (type === 'lift' && v > vt) v = vt;
    }
    return v;
  }
  integrate(integrate(4.5));

  // ---- frames with physically-motivated (heartline-style) banking ----
  const U0 = [], R0 = [];
  for (let i = 0; i < M; i++) {
    const t = T[i];
    let u = P[i].up ? P[i].up.slice() : [0, 1, 0];
    const dt = u[0] * t[0] + u[1] * t[1] + u[2] * t[2];
    u = [u[0] - dt * t[0], u[1] - dt * t[1], u[2] - dt * t[2]];
    const l = Math.hypot(u[0], u[1], u[2]); u = [u[0] / l, u[1] / l, u[2] / l];
    U0.push(u);
    R0.push([t[1] * u[2] - t[2] * u[1], t[2] * u[0] - t[0] * u[2], t[0] * u[1] - t[1] * u[0]]);
  }
  const kap = [];
  for (let i = 0; i < M; i++) {
    const a = T[(i - 2 + M) % M], b = T[(i + 2) % M], ds = 4 * LEN / M;
    kap.push([(b[0] - a[0]) / ds, (b[1] - a[1]) / ds, (b[2] - a[2]) / ds]);
  }
  let bank = new Float64Array(M);
  for (let i = 0; i < M; i++) {
    if (P[i].loop) continue;
    const v2 = vel[i] * vel[i], k = kap[i];
    const F = [v2 * k[0], v2 * k[1] + G, v2 * k[2]];
    const lat = F[0] * R0[i][0] + F[1] * R0[i][1] + F[2] * R0[i][2];
    const ver = F[0] * U0[i][0] + F[1] * U0[i][1] + F[2] * U0[i][2];
    bank[i] = Math.max(-1.35, Math.min(1.35, Math.atan2(lat, Math.max(ver, 4))));
  }
  for (let pass = 0; pass < 2; pass++) {
    const sigma = 14, W = 42, out = new Float64Array(M), w = [];
    let ws = 0; for (let j = -W; j <= W; j++) { const q = Math.exp(-j * j / (2 * sigma * sigma)); w.push(q); ws += q; }
    for (let i = 0; i < M; i++) { let s = 0; for (let j = -W; j <= W; j++) s += bank[(i + j + M) % M] * w[j + W]; out[i] = s / ws; }
    bank = out;
  }
  for (let i = 0; i < M; i++) {
    const c = Math.cos(bank[i]), s = Math.sin(bank[i]), t = T[i];
    let nn = [U0[i][0] * c + R0[i][0] * s, U0[i][1] * c + R0[i][1] * s, U0[i][2] * c + R0[i][2] * s];
    let rr = [t[1] * nn[2] - t[2] * nn[1], t[2] * nn[0] - t[0] * nn[2], t[0] * nn[1] - t[1] * nn[0]];

  camera.rotation.set(autoPitch + userPitch + shx, autoYaw + userYaw, roll + shz, 'YXZ');
  const fovT = 70 + Math.min(12, st.v * 0.3) + (sec.type === 'launch' && accel > 2 ? 5 : 0);
  fov += (fovT - fov) * (1 - Math.exp(-dt * 2.5));
  camera.fov = fov; camera.updateProjectionMatrix();

  // ---- environment follow ----
  rig.updateMatrixWorld(true);
  camera.getWorldPosition(_a);
  sky.position.copy(_a);
  sun.position.copy(_a).addScaledVector(sunDir, 400);
  sun.target.position.copy(_a);
  const inT = inTunnel[st.i] ? 1 : 0;
  tunnelF += (inT - tunnelF) * (1 - Math.exp(-dt * (inT ? 3.5 : 1.8)));
  hemi.intensity = HEM0 * (1 - 0.85 * tunnelF);
  sun.intensity = SUN0 * (1 - 0.9 * tunnelF);
  scene.environmentIntensity = ENV0 * (1 - 0.8 * tunnelF);
  renderer.toneMappingExposure = 1.0 + 0.25 * tunnelF;

  // tunnel ring chase lights
  if (rings) {
    const launching = sec.type === 'launch';
    for (let k = 0; k < ringS.length; k++) {
      let d = ringS[k] - sRide; if (d > LEN / 2) d -= LEN; if (d < -LEN / 2) d += LEN;
      const wave = Math.pow(0.5 + 0.5 * Math.sin(d * 0.55 - time * (launching ? 16 : 7)), 12);
      const near = Math.exp(-Math.abs(d) / 60);
      const I = 0.35 + wave * 3.5 * (0.4 + near);
      ringCol.setRGB(0.45 * I, 0.85 * I, 1.25 * I);
      rings.setColorAt(k, ringCol);
    }
    rings.instanceColor.needsUpdate = true;
    tunnelLight.position.copy(st.p).addScaledVector(st.n, 2.2).addScaledVector(st.t, 3);
    tunnelLight.intensity = tunnelF * (18 + 22 * Math.pow(0.5 + 0.5 * Math.sin(time * (launching ? 30 : 9)), 4));
  }

  // trailing cars
  for (let k = 0; k < trailCars.length; k++) {
    sample(sRide - 2.35 * (k + 1) - 0.9, tmpS);
    negT.copy(tmpS.t).negate();
    basis.makeBasis(tmpS.r, tmpS.n, negT);
    trailCars[k].quaternion.setFromRotationMatrix(basis);
    trailCars[k].position.copy(tmpS.p).addScaledVector(tmpS.n, 0.1);
  }
  updateWheel(time);
  waterTex.offset.set(time * 0.006, time * 0.004);

  // ---- audio ----
  audio.update(st, sec, accel, paused ? 0 : dt, tunnelF);

  // ---- HUD ----
  if (sec.name !== lastName) {
    const fromBrake = lastName === 'Brake Run';
    if (lastName !== '' || time > 0) {
      const num = String(ORDER.indexOf(sec.name) + 1).padStart(2, '0') + ' / ' + String(ORDER.length).padStart(2, '0');
      showCaption(sec.name, sec.name === 'Station' && fromBrake ? `Lap ${lap + 1} coming up · Stay seated` : SUBS[sec.name] || '', num);
    }
    lastName = sec.name;
  }
  if (capTimer > 0) { capTimer -= dt; if (capTimer <= 0 && !paused) capEl.classList.remove('show'); }
  hudT -= dt;
  if (hudT <= 0) {
    hudT = 0.08;
    spdEl.textContent = Math.round(st.v * 3.6);
    altEl.textContent = Math.max(0, st.p.y - groundAtCached(st.i)).toFixed(0);
    gvEl.textContent = st.gv.toFixed(1);
    const mm = Math.floor(lapTime / 60), ss = Math.floor(lapTime % 60);
    lapEl.textContent = `${lap} · ${mm}:${String(ss).padStart(2, '0')}`;
    progEl.style.width = (sRide / LEN * 100).toFixed(1) + '%';
  }
  const vT = 0.32 + Math.max(0, st.gv - 2.6) * 0.18 + tunnelF * 0.25;
  vign += (Math.min(0.85, vT) - vign) * (1 - Math.exp(-dt * 3));
  vigEl.style.opacity = vign.toFixed(3);
  drawMap(st);

  composer.render();
}
const groundCache = new Float32Array(M).fill(NaN);
function groundAtCached(i) { if (isNaN(groundCache[i])) groundCache[i] = Math.max(WATER_Y, groundAt(P[i * 3], P[i * 3 + 2])); return groundCache[i]; }

frame();
$('loadmsg').textContent = 'Click anywhere for sound';
setTimeout(() => $('loader').classList.add('gone'), 1100);
setTimeout(() => { $('hint').style.opacity = 0; }, 14000);
</script>
</body>
</html>
