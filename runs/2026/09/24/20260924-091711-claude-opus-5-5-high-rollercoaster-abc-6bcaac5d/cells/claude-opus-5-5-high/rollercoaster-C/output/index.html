<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLSTICE — a twilight coaster</title>
<style>
  :root {
    --ink: #fff7ee;
    --dim: rgba(255, 244, 232, .58);
    --faint: rgba(255, 244, 232, .22);
    --gold: #ffc27a;
    --coral: #ff7a6b;
    --rose: #ff6f9e;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060b; color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  #fade { position: fixed; inset: 0; background: #07060b; z-index: 30; pointer-events: none; transition: opacity 2.6s ease; }
  #fade.gone { opacity: 0; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 12; }

  .bar { position: fixed; left: 0; right: 0; height: 10.5vh; background: #07060b; z-index: 8; pointer-events: none;
    transition: transform 1.8s cubic-bezier(.75, 0, .2, 1); }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }
  body.running .bar.top { transform: translateY(-101%); }
  body.running .bar.bottom { transform: translateY(101%); }

  #title { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; z-index: 9;
    pointer-events: none; transition: opacity 1.4s ease, transform 2s ease, filter 1.4s ease; }
  body.running #title { opacity: 0; transform: translateY(-58%); filter: blur(6px); }
  #title .glyph { width: 54px; height: 27px; margin: 0 auto 22px; border-radius: 54px 54px 0 0;
    background: linear-gradient(180deg, #ffe1a8, #ff8a5c 70%, #ff5f8f); box-shadow: 0 0 40px rgba(255, 150, 90, .65);
    position: relative; }
  #title .glyph::after { content: ""; position: absolute; left: -22px; right: -22px; bottom: -3px; height: 1px; background: rgba(255, 230, 200, .8); }
  #title h1 { margin: 0; font-weight: 200; font-size: clamp(42px, 8.4vw, 118px); letter-spacing: .5em; padding-left: .5em;
    text-shadow: 0 0 50px rgba(255, 150, 90, .45); }
  #title p { margin: 14px 0 0; font-size: clamp(11px, 1.1vw, 14px); letter-spacing: .42em; text-transform: uppercase; color: var(--dim); padding-left: .42em; }
  #title .count { margin-top: 34px; height: 22px; font-size: 13px; letter-spacing: .38em; text-transform: uppercase; color: var(--gold); padding-left: .38em; }

  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; transition: opacity .8s ease; text-shadow: 0 1px 12px rgba(0, 0, 0, .35); }
  body.nohud #hud { opacity: 0; }

  #brand { position: absolute; left: 30px; top: 26px; display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .34em; }
  #brand .dot { width: 18px; height: 9px; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, #ffe1a8, #ff7a6b); box-shadow: 0 0 14px rgba(255, 140, 90, .8); }
  #brand b { font-weight: 600; }
  #brand span { color: var(--dim); letter-spacing: .24em; }

  #section { position: absolute; right: 30px; top: 24px; text-align: right; min-width: 280px; }
  #section .idx { font-size: 11px; letter-spacing: .34em; color: var(--gold); font-variant-numeric: tabular-nums; }
  #section .name { margin-top: 6px; font-size: clamp(22px, 2.5vw, 34px); font-weight: 250; letter-spacing: .2em; }
  #section .sub { margin-top: 6px; font-size: 12px; letter-spacing: .14em; color: var(--dim); }
  #section.swap .name, #section.swap .sub, #section.swap .idx { animation: swapIn 1.1s cubic-bezier(.2, .7, .2, 1) both; }
  #section.swap .sub { animation-delay: .12s; }
  @keyframes swapIn { from { opacity: 0; transform: translateY(10px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  #gauges { position: absolute; left: 30px; bottom: 26px; }
  #gauges .speed { display: flex; align-items: baseline; gap: 10px; }
  #spd { font-size: clamp(46px, 5.4vw, 76px); font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1; min-width: 2.2ch; }
  #gauges .unit { font-size: 12px; letter-spacing: .3em; color: var(--dim); }
  #gauges .stats { display: flex; gap: 22px; margin-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
  #gauges .stats label { display: block; font-size: 9.5px; letter-spacing: .32em; color: var(--dim); margin-bottom: 4px; }
  #gbar { position: relative; width: 150px; height: 3px; background: var(--faint); margin-top: 14px; border-radius: 2px; }
  #gbar i { position: absolute; top: -3px; width: 2px; height: 9px; background: var(--ink); border-radius: 1px; transition: left .08s linear; }
  #gbar em { position: absolute; left: 20%; top: -1px; width: 1px; height: 5px; background: var(--dim); }

  #profile { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(560px, 44vw); }
  #profile svg { width: 100%; height: 58px; display: block; overflow: visible; }
  #profile .lbl { display: flex; justify-content: space-between; margin-top: 8px; font-size: 9.5px; letter-spacing: .3em; color: var(--dim); }

  #hint { position: absolute; right: 30px; bottom: 28px; font-size: 11px; letter-spacing: .12em; color: var(--dim); text-align: right; line-height: 1.9; transition: opacity 1.5s ease; }
  #hint b { color: var(--ink); font-weight: 600; border: 1px solid var(--faint); border-radius: 4px; padding: 0 5px; margin: 0 2px; }
  #hint.quiet { opacity: .35; }

  #sound { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 11; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 30px; background: rgba(20, 14, 28, .45); border: 1px solid var(--faint); backdrop-filter: blur(6px); color: var(--dim);
    pointer-events: none; transition: opacity 1s ease; }
  #sound.gone { opacity: 0; }
  #paused { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 11; font-size: 12px; letter-spacing: .5em; padding-left: .5em;
    color: var(--ink); opacity: 0; transition: opacity .4s; pointer-events: none; }
  body.paused #paused { opacity: .85; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; z-index: 40; color: var(--dim); font-size: 14px; letter-spacing: .1em; line-height: 1.8; padding: 20px; }

  @media (max-width: 720px) {
    #profile, #hint { display: none; }
    #section { min-width: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar top"></div>
<div class="bar bottom"></div>

<div id="title">
  <div class="glyph"></div>
  <h1>SOLSTICE</h1>
  <p id="titleSub">A twilight coaster · Solstice Ridge</p>
  <div class="count" id="count"></div>
</div>

<div id="hud">
  <div id="brand"><div class="dot"></div><b>SOLSTICE</b><span id="lap">LAP 1</span></div>
  <div id="section">
    <div class="idx" id="secIdx">00 / 10</div>
    <div class="name" id="secName">STATION</div>
    <div class="sub" id="secSub">Boarding</div>
  </div>
  <div id="gauges">
    <div class="speed"><span id="spd">0</span><span class="unit">KM/H</span></div>
    <div class="stats">
      <div><label>HEIGHT</label><span id="alt">0</span> m</div>
      <div><label>FORCE</label><span id="gval">1.0</span> g</div>
      <div><label>AIRTIME</label><span id="air">0.0</span> s</div>
      <div><label>TOP</label><span id="top">0</span></div>
    </div>
    <div id="gbar"><em></em><i id="gdot"></i></div>
  </div>
  <div id="profile">
    <svg viewBox="0 0 600 60" preserveAspectRatio="none">
      <defs>
        <linearGradient id="pg" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#ffd59a"/><stop offset=".5" stop-color="#ff7a6b"/><stop offset="1" stop-color="#c78bff"/>
        </linearGradient>
        <linearGradient id="pf" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#ff9a6b" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a6b" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="pclip"><rect id="pclipRect" x="0" y="-10" width="0" height="80"/></clipPath>
      </defs>
      <g id="pticks"></g>
      <path id="pAll" fill="none" stroke="rgba(255,244,232,.25)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <g clip-path="url(#pclip)">
        <path id="pFill" fill="url(#pf)" stroke="none"/>
        <path id="pDone" fill="none" stroke="url(#pg)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </g>
      <circle id="pDot" r="3.2" fill="#fff" />
    </svg>
    <div class="lbl"><span>STATION</span><span id="profNow">ELEVATION PROFILE</span><span>HOME</span></div>
  </div>
  <div id="hint">Drag to look around<br><b>H</b> hide HUD &nbsp; <b>M</b> sound &nbsp; <b>Space</b> pause</div>
</div>

<div id="sound">Click anywhere for sound</div>
<div id="paused">PAUSED</div>
<div id="flash"></div>
<div id="fade"></div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
window.__solstice = true;

/* =====================================================================================
   0. Small utilities
   ===================================================================================== */
const DEG = Math.PI / 180;
const G = 9.81;
const HEART = 1.15;                                   // rider heartline above the rail centre
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth01 = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const smoothstep = (a, b, x) => smooth01((x - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => b + (a - b) * Math.exp(-k * dt);

let seed = 20260924;
function rng() {
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rand = (a = 0, b = 1) => a + (b - a) * rng();

function hash2(ix, iz) {
  let h = (Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return (a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz) * 2 - 1;
}
function fbm(x, z, oct = 5) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}
function ridged(x, z, oct = 5) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { let n = 1 - Math.abs(vnoise(x * f + i * 7.1, z * f - i * 3.3)); s += a * n * n; f *= 2.1; a *= 0.5; }
  return s;
}

/* =====================================================================================
   1. Track — a heartline "turtle" that is steered by yaw / pitch / roll channels, each
      eased so curvature and bank ramp in and out smoothly. The course closes itself with
      a Hermite connector into the station, then everything is resampled at 0.5 m.
   ===================================================================================== */
function rateProfile(n, r) {
  const w = new Float64Array(n + 1), W = new Float64Array(n + 1);
  let wmax = 0;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    w[i] = r <= 0 ? 1 : smooth01(t / r) * smooth01((1 - t) / r);
    if (w[i] > wmax) wmax = w[i];
  }
  let acc = 0;
  for (let i = 1; i <= n; i++) { acc += (w[i] + w[i - 1]) * 0.5; W[i] = acc; }
  for (let i = 1; i <= n; i++) W[i] /= acc;
  return { w, W, wmax: wmax || 1, mean: acc / n / (wmax || 1) };
}

function upOf(yaw, pitch, roll) {
  const sy = Math.sin(yaw), cy = Math.cos(yaw), sp = Math.sin(pitch), cp = Math.cos(pitch);
  const c = Math.cos(roll), s = Math.sin(roll);
  return [-sy * sp * c - cy * s, cp * c, -cy * sp * c + sy * s];
}

function buildTrack() {
  const RAW_DS = 0.5;
  const st = { x: 0, y: 5, z: 0, yaw: 0, pitch: 0, roll: 0 };
  const raw = [];
  const marks = [], zones = [];
  const push = s => { const u = upOf(s.yaw, s.pitch, s.roll); raw.push([s.x, s.y, s.z, u[0], u[1], u[2]]); };
  push(st);

  // out: true = record samples, false = dry run, function = per-step callback (dry run)
  function runSeg(s, len, o, out) {
    const n = Math.max(2, Math.round(len / RAW_DS));
    const ds = len / n;
    const py = rateProfile(n, o.ramp ?? 0.3);
    const pp = rateProfile(n, o.pramp ?? o.ramp ?? 0.5);
    const pr = rateProfile(n, o.rramp ?? 0.5);
    const yaw0 = s.yaw, pitch0 = s.pitch, roll0 = s.roll;
    const dYaw = (o.yaw || 0) * DEG, dPitch = (o.pitch || 0) * DEG;
    const spin = (o.spin || 0) * DEG, bank0 = (o.bank || 0) * DEG;
    const bank1 = o.bankEnd !== undefined ? o.bankEnd * DEG : bank0;
    const lat = o.lateral || 0;
    let pY = yaw0, pP = pitch0;
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      const yaw = yaw0 + dYaw * py.W[i];
      const pitch = pitch0 + dPitch * pp.W[i];
      let roll = roll0 + spin * pr.W[i] + lerp(bank0, bank1, t) * (py.w[i] / py.wmax);
      if (o.roll !== undefined) roll += (o.roll * DEG - roll0) * smooth01(t);
      const my = (yaw + pY) * 0.5, mp = (pitch + pP) * 0.5, cp = Math.cos(mp);
      s.x += Math.sin(my) * cp * ds; s.y += Math.sin(mp) * ds; s.z += Math.cos(my) * cp * ds;
      if (lat) { const dl = lat * (smooth01(t) - smooth01((i - 1) / n)); s.x -= Math.cos(my) * dl; s.z += Math.sin(my) * dl; }
      s.yaw = yaw; s.pitch = pitch; s.roll = roll;
      if (out === true) push(s); else if (typeof out === 'function') out(s);
      pY = yaw; pP = pitch;
    }
    if (o.roll === undefined && o.spin) s.roll = roll0 + spin;
  }
  const seg = (len, o = {}) => runSeg(st, len, o, true);
  const straight = len => { if (len > 0.25) seg(len, {}); };
  const turnLen = (deg, radius, ramp) => Math.abs(deg * DEG) * radius / rateProfile(200, ramp).mean;
  const turn = (deg, radius, bank = 0, o = {}) => {
    const ramp = o.ramp ?? 0.3;
    const sgn = -Math.sign(deg);
    seg(o.len ?? turnLen(deg, radius, ramp), {
      ...o, ramp, yaw: deg, bank: sgn * bank,
      bankEnd: o.bankEnd !== undefined ? sgn * o.bankEnd : undefined,
    });
  };
  const pitchTo = (deg, len, o = {}) => seg(len, { ...o, pitch: deg - st.pitch / DEG });
  // go straight along the current pitch so that the following pitch-out ends at targetY
  const straightUntil = (targetY, len, o) => {
    const dry = { ...st };
    runSeg(dry, len, { ...o, pitch: o.pitchTo - st.pitch / DEG }, false);
    const dy = dry.y - st.y;
    const sp = Math.sin(st.pitch);
    let x = Math.abs(sp) > 1e-3 ? (targetY - st.y - dy) / sp : 0;
    if (x < 0) { x = 0; if (Math.abs(dy) > 1e-3) len = clamp(len * (targetY - st.y) / dy, len * 0.55, len); }
    straight(x);
    pitchTo(o.pitchTo, len, o);
  };
  // go straight so that the following crest peaks at peakY
  const crestAt = (peakY, len, toDeg, o = {}) => {
    const dry = { ...st };
    let gain = -1e9;
    const y0 = st.y;
    runSeg(dry, len, { ...o, pitch: toDeg - st.pitch / DEG }, s => { gain = Math.max(gain, s.y - y0); });
    const sp = Math.sin(st.pitch);
    straight(sp > 1e-3 ? Math.max(0, (peakY - st.y - gain) / sp) : 0);
    seg(len, { ...o, pitch: toDeg - st.pitch / DEG });
  };
  const idx = () => raw.length - 1;
  const mark = name => marks.push({ name, i: idx() });
  const zoneStart = (type, p = {}) => { const z = { type, ...p, i0: idx(), i1: idx() }; zones.push(z); return z; };
  const zoneEnd = z => { z.i1 = idx(); };

  // ------------------------------------------------------------------------ the course
  mark('STATION');
  const station = zoneStart('station');
  straight(56);
  zoneEnd(station);
  const tires = zoneStart('tires', { speed: 6, acc: 1.4 });
  turn(90, 24, 12);
  straight(6);
  zoneEnd(tires);

  mark('LIFT HILL');
  const lift = zoneStart('lift', { speed: 8, acc: 2 });
  pitchTo(34, 24);
  straightUntil(64, 26, { pitchTo: 0 });
  straight(4);
  zoneEnd(lift);

  mark('FIRST DROP');
  pitchTo(-65, 24);
  straightUntil(6.5, 76, { pitchTo: 0 });
  straight(10);

  mark('OVERBANK');
  pitchTo(18, 28);
  turn(90, 42, 100, { ramp: 0.45, pitch: -36, pramp: 0.5 });
  straightUntil(5, 40, { pitchTo: 0 });
  straight(20);

  mark('VERTICAL LOOP');
  seg(150, { pitch: 360, pramp: 0.5, lateral: 8 });
  straight(18);

  mark('AIRTIME HILLS');
  pitchTo(34, 30);
  pitchTo(-34, 80, { pramp: 0.5 });
  straightUntil(5, 32, { pitchTo: 0 });
  straight(6);
  pitchTo(26, 24);
  pitchTo(-26, 50, { pramp: 0.5 });
  straightUntil(5, 26, { pitchTo: 0 });
  turn(90, 40, 60);
  straight(8);

  mark('LAUNCH TUNNEL');
  const tunnel = zoneStart('tunnel');
  const trim = zoneStart('brake', { speed: 8, dec: 7.5 });
  straight(54);
  zoneEnd(trim);
  const launch = zoneStart('launch', { speed: 36, acc: 8 });
  straight(84);
  zoneEnd(launch);
  straight(22);
  zoneEnd(tunnel);

  mark('TOP HAT');
  pitchTo(72, 30);
  crestAt(56, 70, -72);
  straightUntil(6, 64, { pitchTo: 0 });
  straight(10);

  mark('HELIX');
  pitchTo(3, 16);
  turn(450, 38, 64, { ramp: 0.2, bankEnd: 40 });

  mark('ZERO-G ROLL');
  pitchTo(20, 22);
  seg(64, { spin: 360, pitch: -40, pramp: 0.5, rramp: 0.5 });
  pitchTo(0, 22);

  mark('HOMECOMING');
  pitchTo(-16, 24);
  straightUntil(5, 34, { pitchTo: 0 });
  const brake = zoneStart('brake', { speed: 7.5, dec: 7 });
  straight(Math.max(40, -95 - st.z));

  // ------------------------------------------------------------------------ connector home
  const P0 = [st.x, st.y, st.z], P1 = [0, 5, 0];
  const F0 = [Math.sin(st.yaw) * Math.cos(st.pitch), Math.sin(st.pitch), Math.cos(st.yaw) * Math.cos(st.pitch)];
  const F1 = [0, 0, 1];
  const dist = Math.hypot(P1[0] - P0[0], P1[1] - P0[1], P1[2] - P0[2]);
  const k = dist * 1.15;
  const NC = Math.max(40, Math.round(dist * 4));
  const cStart = raw.length;
  const conn = [];
  for (let i = 1; i < NC; i++) {
    const t = i / NC, t2 = t * t, t3 = t2 * t;
    const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
    conn.push([0, 1, 2].map(a => h00 * P0[a] + h10 * k * F0[a] + h01 * P1[a] + h11 * k * F1[a]));
  }
  for (let i = 0; i < conn.length; i++) {
    const a = conn[Math.max(0, i - 1)], b = conn[Math.min(conn.length - 1, i + 1)];
    raw.push([conn[i][0], conn[i][1], conn[i][2], 0, 1, 0, Math.atan2(b[0] - a[0], b[2] - a[2])]);
  }
  for (let i = cStart; i < raw.length; i++) {
    const a = raw[Math.max(cStart, i - 6)], b = raw[Math.min(raw.length - 1, i + 6)];
    let dy = b[6] - a[6]; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    const dl = Math.hypot(b[0] - a[0], b[2] - a[2]) || 1;
    const t = (i - cStart) / (raw.length - cStart);
    const w = smooth01(t / 0.2) * smooth01((1 - t) / 0.2);
    const roll = clamp(-Math.atan((dy / dl) * 64 / G), -0.6, 0.6) * w;
    const u = upOf(raw[i][6], 0, roll);
    raw[i][3] = u[0]; raw[i][4] = u[1]; raw[i][5] = u[2];
  }
  zoneEnd(brake);

  // ------------------------------------------------------------------------ resample
  const S = new Float64Array(raw.length + 1);
  for (let i = 1; i <= raw.length; i++) {
    const a = raw[i - 1], b = raw[i % raw.length];
    S[i] = S[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  }
  const L = S[raw.length];
  const N = Math.round(L / 0.5);
  const ds = L / N;
  const pos = new Float32Array(N * 3), up = new Float32Array(N * 3), fwd = new Float32Array(N * 3), right = new Float32Array(N * 3);
  let j = 0;
  for (let i = 0; i < N; i++) {
    const s = i * ds;
    while (j < raw.length - 1 && S[j + 1] < s) j++;
    const a = raw[j], b = raw[(j + 1) % raw.length];
    const t = (s - S[j]) / ((S[j + 1] - S[j]) || 1);
    for (let c = 0; c < 3; c++) {
      pos[i * 3 + c] = a[c] + (b[c] - a[c]) * t;
      up[i * 3 + c] = a[c + 3] + (b[c + 3] - a[c + 3]) * t;
    }
  }
  for (let pass = 0; pass < 2; pass++) {             // soften micro-kinks at joins
    const cp = pos.slice();
    for (let i = 0; i < N; i++) for (let c = 0; c < 3; c++) {
      let acc = 0;
      for (let q = -3; q <= 3; q++) acc += cp[((i + q + N) % N) * 3 + c];
      pos[i * 3 + c] = acc / 7;
    }
  }
  for (let i = 0; i < N; i++) {
    const a = ((i - 1 + N) % N) * 3, b = ((i + 1) % N) * 3;
    let fx = pos[b] - pos[a], fy = pos[b + 1] - pos[a + 1], fz = pos[b + 2] - pos[a + 2];
    const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
    let ux = up[i * 3], uy = up[i * 3 + 1], uz = up[i * 3 + 2];
    const dd = ux * fx + uy * fy + uz * fz;
    ux -= fx * dd; uy -= fy * dd; uz -= fz * dd;
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
    fwd.set([fx, fy, fz], i * 3);
    up.set([ux, uy, uz], i * 3);
    right.set([fy * uz - fz * uy, fz * ux - fx * uz, fx * uy - fy * ux], i * 3);
  }
  const sOf = i => S[i];
  return {
    N, ds, L, pos, up, fwd, right,
    marks: marks.map(m => ({ name: m.name, s: sOf(m.i) })),
    zones: zones.map(z => ({ ...z, s0: sOf(z.i0), s1: z.i1 >= raw.length - 1 ? L : sOf(z.i1) })),
  };
}

function trackSample(T, s, out) {
  s = ((s % T.L) + T.L) % T.L;
  const f = s / T.ds, i = Math.floor(f) % T.N, j = (i + 1) % T.N, t = f - Math.floor(f);
  for (const k of ['pos', 'up', 'fwd', 'right']) {
    const A = T[k], o = out[k];
    o[0] = A[i * 3] + (A[j * 3] - A[i * 3]) * t;
    o[1] = A[i * 3 + 1] + (A[j * 3 + 1] - A[i * 3 + 1]) * t;
    o[2] = A[i * 3 + 2] + (A[j * 3 + 2] - A[i * 3 + 2]) * t;
  }
  return out;
}
function zoneAt(T, s, type) {
  for (const z of T.zones) if (z.type === type && s >= z.s0 && s < z.s1) return z;
  return null;
}

/* ------------------------------------------------------------------ ride dynamics */
function makeRide(T) {
  const st = T.zones.find(z => z.type === 'station');
  return { s: st.s0 + 24, v: 0, state: 'dwell', timer: 7.5, lap: 1, stop: st.s0 + 24, stationEnd: st.s1, armed: false, arrived: false, dispatched: false };
}
function stepRide(T, R, dt, tmp) {
  if (R.state === 'dwell') {
    R.timer -= dt;
    if (R.timer <= 0) { R.state = 'run'; R.armed = false; R.dispatched = true; }
    return;
  }
  const s = R.s;
  trackSample(T, s, tmp);
  let v = R.v;
  const toStop = ((R.stop - s) % T.L + T.L) % T.L;
  const past = ((s - R.stop) % T.L + T.L) % T.L;
  if (!R.armed && past > 6 && past < T.L * 0.5) R.armed = true;
  const lift = zoneAt(T, s, 'lift'), tires = zoneAt(T, s, 'tires');
  if (lift || tires) {
    const z = lift || tires;
    v += clamp(z.speed - v, -z.acc * dt, z.acc * dt);
  } else if (R.armed && toStop < 70) {
    const target = Math.min(7.5, Math.sqrt(2 * 1.1 * toStop));
    v = v > target ? Math.max(target, v - 6 * dt) : Math.min(target, v + 1.5 * dt);
    if (toStop < 0.03 || v * dt >= toStop) {
      R.s = R.stop; R.v = 0; R.state = 'dwell'; R.timer = 4.5; R.lap++; R.arrived = true;
      return;
    }
  } else if (!R.armed) {
    v += clamp(6 - v, -1.2 * dt, 1.2 * dt);            // station drive tyres
  } else {
    const launch = zoneAt(T, s, 'launch'), brake = zoneAt(T, s, 'brake');
    const a = -G * tmp.fwd[1] - (0.05 + 0.00032 * v * v);
    let nv = v + a * dt;
    if (launch && v < launch.speed) nv = Math.min(launch.speed, nv + launch.acc * dt);
    if (brake && v > brake.speed) nv = Math.max(brake.speed, nv - brake.dec * dt);
    v = Math.max(nv, 2.2);
  }
  R.v = v;
  R.s = (R.s + v * dt) % T.L;
}

const T = buildTrack();

  o.r.crossVectors(o.f, o.u).normalize();
  o.u.crossVectors(o.r, o.f).normalize();

}

  glow: '#ffc27a', belt: '#ff9fb8', core: '#fff4dc', ground: '#2a2233', clDark: '#4a3558', clLit: '#ffae84',

#ifndef SOL_COMMON
#define SOL_COMMON

const vec3 SOL_HZS = ${glc(PAL.hzSun)};

const NOISE_GLSL = /* glsl */`
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn2(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);

function makeSkyMaterial(env) {

      const vec3 CLD = ${glc(PAL.clDark)}; const vec3 CLL = ${glc(PAL.clLit)};

const TG = { cell: 16, map: new Map(), pts: [] };

{
  const inZone = (s, type, pad = 0) => T.zones.some(z => z.type === type && s > z.s0 - pad && s < z.s1 + pad);
  const legs = [], feet = [];
  const fr = newFrame();
  const top = new THREE.Vector3(), base = new THREE.Vector3(), base2 = new THREE.Vector3();
  for (let s = 5; s < T.L; s += 9) {
    frameAt(s, fr);
    if (fr.u.y < 0.55) continue;
    if (inZone(s, 'station', 3) || inZone(s, 'tunnel', 3)) continue;
    top.copy(fr.p).addScaledVector(fr.u, -2.0);
    const gy = Math.max(groundAt(top.x, top.z), -6);
    const h = top.y - gy;
    if (h < 0.8) continue;
    let blocked = false;
    nearTrack(top.x, top.z, 4.5, p => {
      let dsd = Math.abs(p.s - s); dsd = Math.min(dsd, T.L - dsd);
      if (dsd > 18 && p.y < top.y && p.y > gy - 1) blocked = true;
    });
    if (blocked) continue;
    const r = 0.26 + Math.min(h, 60) * 0.006;
    if (h > 16) {           // A-frame for tall bents
      const spread = 1.2 + h * 0.07;
      const rh = _v.set(fr.r.x, 0, fr.r.z).normalize().clone();
      base.copy(top).addScaledVector(rh, -spread); base.y = groundAt(base.x, base.z);
      base2.copy(top).addScaledVector(rh, spread); base2.y = groundAt(base2.x, base2.z);
      legs.push(segmentMatrix(base, top, r).clone(), segmentMatrix(base2, top, r).clone());
      for (let y = 7; y < h - 4; y += 9) {
        const k = y / h;
        const a = base.clone().lerp(top, k), b = base2.clone().lerp(top, Math.min(1, k + 6 / h));
        legs.push(segmentMatrix(a, b, r * 0.45).clone());
      }
      feet.push(base.clone(), base2.clone());
    } else {
      base.set(top.x, gy, top.z);
      legs.push(segmentMatrix(base, top, r).clone());
      feet.push(base.clone());
    }
  }
  const legMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 10), MAT.support, legs.length);
  legs.forEach((m, i) => legMesh.setMatrixAt(i, m));

}

  const step = 3, per = Math.floor(T.L / step), count = per * 2;

  const c = new THREE.Color();
  for (let i = 0; i < per; i++) {
    const s = i * step;
    frameAt(s, fr);
    const t = (s / T.L) * (stops.length - 1), k = Math.floor(t);
    c.copy(stops[k]).lerp(stops[Math.min(k + 1, stops.length - 1)], t - k);

const GLOW_VS = /* glsl */`
  attribute vec4 aColor; attribute float aSize; uniform float uScale; varying vec4 vColor;
  void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(aSize * uScale / -mv.z, 1.5, 256.0);
    gl_Position = projectionMatrix * mv; vColor = aColor; }`;
const GLOW_FS = /* glsl */`
  varying vec4 vColor;
  void main(){ float r = length(gl_PointCoord - 0.5) * 2.0; if (r > 1.0) discard;
    float a = exp(-r * r * 4.5) * 0.8 + exp(-r * r * 40.0) * 0.6; a *= 1.0 - smoothstep(0.75, 1.0, r);
    gl_FragColor = vec4(vColor.rgb, vColor.a * a); }`;
function makeGlow(count) {
  const g = new THREE.BufferGeometry();
  const P = new Float32Array(count * 3), Cc = new Float32Array(count * 4), Sz = new Float32Array(count);
  g.setAttribute('position', new THREE.BufferAttribute(P, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(Cc, 4));
  g.setAttribute('aSize', new THREE.BufferAttribute(Sz, 1));
  const m = new THREE.ShaderMaterial({ uniforms: { uScale: glowScale }, vertexShader: GLOW_VS, fragmentShader: GLOW_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  const api = {
    pts, P, Cc, Sz, n: 0,
    add(p, c, size, a = 1) { const i = api.n++; P.set([p.x, p.y, p.z], i * 3); Cc.set([c.r, c.g, c.b, a], i * 4); Sz[i] = size; return i; },
    commit() { g.setDrawRange(0, api.n); g.attributes.position.needsUpdate = true; g.attributes.aColor.needsUpdate = true; g.attributes.aSize.needsUpdate = true; },
  };
  return api;
}

const AUDIO = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) { this.ctx.resume(); return; }

    this.master = ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.85;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(ctx.destination);
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    const loop = () => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 2); return s; };
    const chain = (...nodes) => { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); return nodes[nodes.length - 1]; };
    const filt = (type, f, q = 0.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
    const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    this.windF = filt('bandpass', 500, 0.6); this.windG = gain(0);
    chain(loop(), this.windF, this.windG, this.master);
    this.roarF = filt('lowpass', 150); this.roarG = gain(0);
    chain(loop(), this.roarF, this.roarG, this.master);
    this.hum = ctx.createOscillator(); this.hum.type = 'sawtooth'; this.hum.frequency.value = 40;
    this.humG = gain(0); chain(this.hum, filt('lowpass', 240), this.humG, this.master); this.hum.start();
    this.lsm = ctx.createOscillator(); this.lsm.type = 'sawtooth'; this.lsm.frequency.value = 80;
    this.lsmG = gain(0); chain(this.lsm, filt('lowpass', 1400), this.lsmG, this.master); this.lsm.start();
    this.pad = gain(0); const padF = filt('lowpass', 900);

    padF.connect(this.pad); this.pad.connect(this.master);
  },
  set(p, v, tc = 0.12) { p.setTargetAtTime(v, this.ctx.currentTime, tc); },
  update(v, info) {
    if (!this.ctx) return;
    const k = v / 36;

    this.set(this.windF.frequency, 260 + v * 48);
    this.set(this.roarG.gain, 0.42 * Math.min(1, k * 1.3) * (info.tunnel ? 1.6 : 1));
    this.set(this.roarF.frequency, 90 + v * 7);
    this.set(this.hum.frequency, 28 + v * 2.4);
    this.set(this.humG.gain, 0.07 * Math.min(1, k * 1.5));
    this.set(this.lsmG.gain, info.launch ? 0.1 : 0, 0.08);
    this.set(this.lsm.frequency, 60 + v * 16);
    this.set(this.pad.gain, info.station ? 0.05 : 0.016, 1.2);
  },
  burst(t0, dur, type, f, vol, q = 0.8) {
    const ctx = this.ctx, s = ctx.createBufferSource(); s.buffer = this.noise;
    const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  },
  click() { if (this.ctx) { const t = this.ctx.currentTime; this.burst(t, 0.05, 'bandpass', 2600, 0.35, 3); this.burst(t + 0.012, 0.09, 'lowpass', 400, 0.25); } },
  chime() {

  const subs = {
    'STATION': 'Boarding · Solstice Ridge Park',
    'LIFT HILL': `${Math.round(liftTop)} m chain lift into the sunset`,
    'FIRST DROP': `${Math.round(Math.asin(-minPitch) / DEG)}° into the valley`,
    'OVERBANK': `Banked ${Math.round(bankMax / DEG)}° — past vertical`,
    'VERTICAL LOOP': `${Math.round(loopTop)} m over Mirror Lake`,
    'AIRTIME HILLS': 'Floater · then ejector',
    'LAUNCH TUNNEL': 'Hold… linear motors to 130 km/h',
    'TOP HAT': `${Math.round(hatTop)} m crest above the ridge`,
    'HELIX': '450° climbing through the pines',
    'ZERO-G ROLL': 'Heartline inversion',
    'HOMECOMING': 'Magnetic brakes · welcome back',
  };
  return T.marks.map((m, i) => ({ ...m, i, sub: subs[m.name] || '' }));
})();
function sectionAt(s) { let cur = SECTIONS[0]; for (const m of SECTIONS) if (s >= m.s) cur = m; return cur; }

const PROFILE = (() => {
  const W = 600, H = 60, n = 300;
  let minY = 1e9, maxY = -1e9; const ys = [];
  const fr = newFrame();
  for (let i = 0; i <= n; i++) { const y = frameAt(i / n * T.L, fr).p.y; ys.push(y); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const Y = y => H - 4 - (y - minY) / (maxY - minY) * (H - 12);
  let d = '';
  ys.forEach((y, i) => { d += (i ? 'L' : 'M') + (i / n * W).toFixed(1) + ',' + Y(y).toFixed(1); });
  $('pAll').setAttribute('d', d); $('pDone').setAttribute('d', d);
  $('pFill').setAttribute('d', d + `L${W},${H}L0,${H}Z`);
  const ticks = $('pticks');
  for (const m of SECTIONS.slice(1)) {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const x = (m.s / T.L * W).toFixed(1);
    l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', 0); l.setAttribute('y2', H);
    l.setAttribute('stroke', 'rgba(255,244,232,.12)'); l.setAttribute('vector-effect', 'non-scaling-stroke');
    ticks.appendChild(l);
  }
  return { W, H, Y };
})();

/* =====================================================================================
   13. Input
   ===================================================================================== */
const look = { yaw: 0, pitch: 0, drag: false, lx: 0, ly: 0, released: 0 };
let paused = false;
function unlockAudio() {
  AUDIO.init();
  $('sound').classList.add('gone');
}
canvas.addEventListener('pointerdown', e => { look.drag = true; look.lx = e.clientX; look.ly = e.clientY; canvas.setPointerCapture(e.pointerId); unlockAudio(); });
canvas.addEventListener('pointermove', e => {
  if (!look.drag) return;
  look.yaw = clamp(look.yaw + (e.clientX - look.lx) * 0.0042, -2.6, 2.6);
  look.pitch = clamp(look.pitch + (e.clientY - look.ly) * 0.0036, -1.1, 1.1);
  look.lx = e.clientX; look.ly = e.clientY;
});
const endDrag = () => { look.drag = false; look.released = performance.now() / 1000; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  unlockAudio();
  if (e.code === 'KeyH') document.body.classList.toggle('nohud');
  else if (e.code === 'KeyM') AUDIO.toggle();
  else if (e.code === 'Space') { paused = !paused; document.body.classList.toggle('paused', paused); e.preventDefault(); }
});
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  finalPass.uniforms.uRes.value.set(innerWidth, innerHeight);
  updateGlowScale();
}
addEventListener('resize', onResize);
updateGlowScale();

/* =====================================================================================
   14. The loop
   ===================================================================================== */
const ride = makeRide(T);
const tmpS = { pos: [0, 0, 0], up: [0, 0, 0], fwd: [0, 0, 0], right: [0, 0, 0] };
const fr = newFrame(), frA = newFrame(), frB = newFrame(), frC = newFrame();
const basisM = new THREE.Matrix4(), invQ = new THREE.Quaternion(), dirV = new THREE.Vector3(), accV = new THREE.Vector3();
const la = { yaw: 0, pitch: 0 };
const st = { gv: 1, glat: 0, along: 0, vPrev: 0, air: 0, top: 0, raise: 0, hold: 0, fov: 70, shake: 0, chainAcc: 0, flash: 0, lastSec: -1, hudTick: 0 };
const crossed = (a, b, x) => b >= a ? (x > a && x <= b) : (x > a || x <= b);
const hatPeakS = (() => { let best = markS('TOP HAT'), by = -1e9; for (let s = markS('TOP HAT'); s < markS('HELIX'); s += 1) { const y = frameAt(s, fr).p.y; if (y > by) { by = y; best = s; } } return best; })();

let simT = 0, last = performance.now() / 1000;
const tStart = last;
setTimeout(() => $('fade').classList.add('gone'), 150);
setTimeout(() => $('hint').classList.add('quiet'), 14000);

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - last); last = now;
  const sdt = paused ? 0 : dt;
  simT += sdt;

  // ---- physics
  const sPrev = ride.s, vPrev = ride.v;
  for (let i = 0; i < 4; i++) stepRide(T, ride, sdt / 4, tmpS);
  const s = ride.s, v = ride.v;
  if (sdt > 0) st.along = damp(st.along, (v - vPrev) / sdt, 8, sdt);

  // ---- events
  if (ride.dispatched) {
    ride.dispatched = false;
    document.body.classList.add('running');
    AUDIO.chime();
    st.air = 0; st.top = 0;
  }
  if (ride.arrived) {
    ride.arrived = false;
    document.body.classList.remove('running');
    $('titleSub').textContent = `Lap ${ride.lap - 1} complete · riding again`;
    $('lap').textContent = `LAP ${ride.lap}`;
  }
  if (ride.state === 'dwell') {
    const c = Math.ceil(ride.timer);
    $('count').textContent = ride.timer < 3.2 ? (c > 0 ? `Dispatch in ${c}` : '') : 'Keep your hands inside the car';
  }
  if (sdt > 0 && s !== sPrev) {
    if (crossed(sPrev, s, PHOTO.s)) st.flash = 1;
    if (crossed(sPrev, s, hatPeakS - 30)) FW.volley(7);
    if (crossed(sPrev, s, markS('HOMECOMING'))) FW.volley(9);
    if (crossed(sPrev, s, markS('VERTICAL LOOP'))) FW.volley(3);
    if (zoneAt(T, s, 'lift')) {
      st.chainAcc += v * sdt;
      if (st.chainAcc > 0.9) { st.chainAcc = 0; AUDIO.click(); }
    }
  }
  st.flash = Math.max(0, st.flash - dt * 5);
  PHOTO.boxM.color.setScalar(0.4 + st.flash * 30);
  $('flash').style.opacity = (st.flash * 0.55).toFixed(3);

  // ---- rig follows the heartline
  frameAt(s, fr);
  rig.position.copy(fr.p).addScaledVector(fr.f, 0.05);
  basisM.makeBasis(fr.r, fr.u, _negF.copy(fr.f).negate());
  rig.quaternion.setFromRotationMatrix(basisM);

  // g-forces from the path curvature
  frameAt(s - 1, frA); frameAt(s + 1, frB);
  accV.subVectors(frB.f, frA.f).multiplyScalar(0.5 * v * v).addScaledVector(fr.f, ride.state === 'dwell' ? 0 : st.along);
  accV.y += G;
  st.gv = damp(st.gv, accV.dot(fr.u) / G, 7, dt);
  st.glat = damp(st.glat, accV.dot(fr.r) / G, 7, dt);
  if (st.gv < 0.3 && ride.state !== 'dwell') st.air += sdt;
  st.top = Math.max(st.top, v * 3.6);

  // riders look where they're going
  frameAt(s + 8 + v * 0.3, frC);
  dirV.subVectors(frC.p, fr.p).normalize();
  invQ.copy(rig.quaternion).invert();
  dirV.applyQuaternion(invQ);
  const ly = clamp(Math.atan2(-dirV.x, -dirV.z) * 0.55, -0.45, 0.45), lp = clamp(Math.asin(clamp(dirV.y, -1, 1)) * 0.5, -0.32, 0.32);
  la.yaw = damp(la.yaw, ly, 3.5, dt); la.pitch = damp(la.pitch, lp, 3.5, dt);
  if (!look.drag && now - look.released > 1.4) { look.yaw = damp(look.yaw, 0, 2.2, dt); look.pitch = damp(look.pitch, 0, 2.2, dt); }
  // rattle and body sway
  const rattle = (paused ? 0 : 1) * Math.pow(clamp(v / 34, 0, 1), 1.6);
  const n1 = Math.sin(simT * 37.1) * Math.sin(simT * 23.7 + 1.3), n2 = Math.sin(simT * 31.3 + 2.1) * Math.sin(simT * 19.9);
  camera.position.set(-st.glat * 0.035 + n2 * 0.004 * rattle, clamp(-(st.gv - 1) * 0.022, -0.06, 0.05) + n1 * 0.006 * rattle, 0);
  camera.rotation.set(la.pitch + look.pitch + n1 * 0.0035 * rattle, la.yaw + look.yaw + n2 * 0.003 * rattle, -st.glat * 0.03);
  st.fov = damp(st.fov, 68 + clamp(v / 36, 0, 1.1) * 14, 2.5, dt);
  if (Math.abs(camera.fov - st.fov) > 0.02) { camera.fov = st.fov; camera.updateProjectionMatrix(); updateGlowScale(); }
  finalPass.uniforms.uBlur.value = damp(finalPass.uniforms.uBlur.value, clamp((v - 16) / 20, 0, 1), 3, dt);
  finalPass.uniforms.uTime.value = now - tStart;
  finalPass.uniforms.uFlash.value = st.flash * 0.25;

  // ---- hands up!
  const sec = ride.state === 'dwell' ? SECTIONS[0] : sectionAt(s);
  const calm = ride.state === 'dwell' || zoneAt(T, s, 'lift') || zoneAt(T, s, 'tunnel') || zoneAt(T, s, 'tires') || sec.name === 'STATION';
  const thrill = !calm && (st.gv < 0.35 || (v > 22 && fr.f.y < -0.4) || sec.name === 'TOP HAT' && fr.f.y < -0.2);
  if (thrill) st.hold = 1.3; else st.hold = Math.max(0, st.hold - dt);
  const want = !calm && st.hold > 0 ? 1 : 0;
  st.raise = damp(st.raise, want, want ? 5 : 2.2, dt);
  const r = smooth01(st.raise);
  myArms.forEach(a => { const side = a.userData.side; a.rotation.set(lerp(1.42, 2.15, r), side * lerp(0.0, -0.12, r), side * lerp(0.0, 0.34, r)); });

  // ---- train cars
  cars.forEach((c, k) => {
    frameAt(s - (k + 1) * CAR_GAP, frA);
    c.matrix.makeBasis(frA.r, frA.u, _negF.copy(frA.f).negate());
    c.matrix.setPosition(frA.p.x - frA.u.x * HEART, frA.p.y - frA.u.y * HEART, frA.p.z - frA.u.z * HEART);
    c.matrixWorldNeedsUpdate = true;
    for (const a of c.userData.arms) {
      const tgt = a.userData.brave ? want : 0;
      a.userData.raise = damp(a.userData.raise, tgt, tgt ? 3.5 - a.userData.delay * 3 : 2, dt);
      const rr = smooth01(a.userData.raise), side = a.userData.side;
      a.rotation.set(lerp(1.05, 2.75, rr) + Math.sin(simT * 3 + a.userData.delay * 9) * 0.08 * rr, 0, side * lerp(0.05, 0.3, rr));
    }
  });

  // ---- world
  const inTunnel = zoneAt(T, s, 'tunnel');
  const launchZ = zoneOf('launch');
  {
    const c = TUNNEL.ringMesh, tmp = new THREE.Color();
    const launching = s >= launchZ.s0 - 2 && s < tunZ.s1 + 5;
    TUNNEL.S.forEach((rs, i) => {
      let d = rs - s;
      if (launching) {
        const stripe = 0.5 + 0.5 * Math.sin((rs - simT * 90) * 0.18);
        const k = (1.5 + 5 * stripe) * clamp(v / 30, 0.4, 1.2);
        tmp.setRGB(0.55 * k, 0.85 * k, 1.0 * k);
      } else {
        const breathe = 0.6 + 0.4 * Math.sin(simT * 2.2 - rs * 0.08);
        const near = Math.exp(-(((d - 10) / 18) ** 2)) * 1.2;
        tmp.setRGB(1.0 * (breathe + near) * 1.5, 0.45 * (breathe + near) * 1.5, 0.16 * (breathe + near) * 1.5);
      }
      c.setColorAt(i, tmp);
    });
    c.instanceColor.needsUpdate = true;
    const want = inTunnel ? (launching ? 90 : 45) : 0;
    tunnelLight.intensity = damp(tunnelLight.intensity, want, 6, dt);
    tunnelLight.color.setRGB(launching ? 0.6 : 1, launching ? 0.85 : 0.55, launching ? 1 : 0.3);
    tunnelLight.position.copy(fr.p).addScaledVector(fr.f, 5).addScaledVector(fr.u, 1.5);
  }
  { // running lights: a pulse travels just ahead of the train
    const cArr = LED.mesh.instanceColor.array;
    const breathe = 0.85 + 0.15 * Math.sin(simT * 1.7);
    for (let i = 0; i < LED.count; i++) {
      let d = LED.S[i] - s;
      if (d < -T.L / 2) d += T.L; else if (d > T.L / 2) d -= T.L;
      const k = 1.3 * breathe + 4.5 * Math.exp(-(((d - 16) / 11) ** 2)) + 1.4 * Math.exp(-(((d + 6) / 6) ** 2));
      const b = LED.base[i];
      cArr[i * 3] = b.r * k; cArr[i * 3 + 1] = b.g * k; cArr[i * 3 + 2] = b.b * k;
    }
    LED.mesh.instanceColor.needsUpdate = true;
  }
  chainTex.offset.y = (chainTex.offset.y - (zoneAt(T, s, 'lift') ? v : 8) * sdt / 0.6) % 1;
  WHEEL_OBJ.update(simT);
  BALLOONS.update(simT);
  BIRDS.update(simT);
  FW.update(sdt, simT);
  for (const b of FW.popPending()) AUDIO.boom(rig.position.distanceTo(_v.set(b.x, b.y, b.z)));
  water.material.uniforms.uTime.value = simT;
  skyMat.uniforms.uTime.value = simT;
  skyGroup.position.copy(rig.position);

  // shadow frustum follows the rider, snapped to texels to avoid shimmer
  {
    const tex = 190 / 2048;
    const center = _v.copy(rig.position).addScaledVector(fr.f, 40);
    center.y = Math.max(0, center.y * 0.5);
    const lx = new THREE.Vector3().crossVectors(Y_UP, SUN).normalize(), lyv = new THREE.Vector3().crossVectors(SUN, lx);
    const a = Math.round(center.dot(lx) / tex) * tex, b = Math.round(center.dot(lyv) / tex) * tex, cz = center.dot(SUN);
    center.copy(lx).multiplyScalar(a).addScaledVector(lyv, b).addScaledVector(SUN, cz);
    sunLight.target.position.copy(center);
    sunLight.position.copy(center).addScaledVector(SUN, 450);
  }

  // ---- sound
  AUDIO.update(v, { tunnel: !!inTunnel, launch: !!zoneAt(T, s, 'launch') && v < 35.5, station: ride.state === 'dwell' });

  // ---- HUD
  if (sec.i !== st.lastSec) {
    st.lastSec = sec.i;
    const el = $('section');
    $('secIdx').textContent = `${String(sec.i).padStart(2, '0')} / ${String(SECTIONS.length - 1).padStart(2, '0')}`;
    $('secName').textContent = sec.name;
    $('secSub').textContent = sec.sub;
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
    $('profNow').textContent = sec.name;
  }
  if ((st.hudTick = (st.hudTick + 1) % 3) === 0) {
    const ground = Math.max(groundAt(fr.p.x, fr.p.z), 0.25);
    $('spd').textContent = Math.round(v * 3.6);
    $('alt').textContent = Math.max(0, Math.round(fr.p.y - ground));
    $('gval').textContent = st.gv.toFixed(1);
    $('air').textContent = st.air.toFixed(1);
    $('top').textContent = Math.round(st.top);
    $('gdot').style.left = `${clamp((st.gv + 1) / 5, 0, 1) * 100}%`;
    const px = s / T.L * PROFILE.W;
    $('pclipRect').setAttribute('width', px.toFixed(1));
    $('pDot').setAttribute('cx', px.toFixed(1));
    $('pDot').setAttribute('cy', PROFILE.Y(fr.p.y).toFixed(1));
  }

  composer.render();
}
onResize();
frame();
</script>
<script>
  // if the CDN module never arrives, say so instead of showing a black screen
  setTimeout(function () {
    if (window.__solstice) return;
    var e = document.getElementById('err');
    e.style.display = 'flex';
    e.innerHTML = 'Three.js could not be loaded from the CDN.<br>Check your connection and reload the page.';
    document.getElementById('fade').classList.add('gone');
  }, 15000);
</script>
</body>
</html>
