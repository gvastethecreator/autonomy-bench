<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a29">
  <title>Solstice — The Ridgeline</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2e6d1;
      --muted: rgba(242, 230, 209, .58);
      --line: rgba(242, 230, 209, .19);
      --gold: #f1bd79;
      --deep: #101a29;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--deep); }
    body { color: var(--ink); }
    canvas { display: block; width: 100%; height: 100%; }
    .wash {
      position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8, 15, 27, .42) 0%, rgba(8, 15, 27, .07) 24%, transparent 48%),
        linear-gradient(0deg, rgba(7, 13, 23, .60) 0%, rgba(7, 13, 23, .16) 23%, transparent 49%),
        radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(7, 13, 23, .2) 100%);
    }
    .hud { position: fixed; inset: 0; pointer-events: none; padding: max(28px, env(safe-area-inset-top)) max(34px, env(safe-area-inset-right)) max(25px, env(safe-area-inset-bottom)) max(34px, env(safe-area-inset-left)); }
    .masthead { display: flex; align-items: flex-start; justify-content: space-between; }
    .identity { display: flex; align-items: flex-start; gap: 14px; }
    .sigil { position: relative; width: 34px; height: 34px; border: 1px solid rgba(241,189,121,.82); border-radius: 50%; margin-top: 1px; }
    .sigil::before, .sigil::after { content: ""; position: absolute; background: var(--gold); }
    .sigil::before { width: 1px; height: 20px; top: 6px; left: 16px; }
    .sigil::after { height: 1px; width: 20px; left: 6px; top: 16px; }
    .eyebrow, .micro { font-size: 9px; font-weight: 650; letter-spacing: .24em; text-transform: uppercase; }
    .eyebrow { color: var(--gold); margin: 2px 0 7px; }
    h1 { margin: 0; font-size: clamp(21px, 2.1vw, 29px); line-height: 1; letter-spacing: .13em; font-weight: 460; }
    .subline { margin-top: 8px; color: var(--muted); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .speed { text-align: right; display: flex; align-items: flex-start; gap: 8px; }
    .speed-value { font-variant-numeric: tabular-nums; font-size: 30px; line-height: .95; font-weight: 350; letter-spacing: -.04em; min-width: 54px; }
    .speed-unit { color: var(--gold); font-size: 9px; letter-spacing: .22em; padding-top: 4px; }
    .speed-label { display: block; margin-top: 7px; color: var(--muted); font-size: 8px; letter-spacing: .22em; }
    .bottom { position: absolute; left: max(34px, env(safe-area-inset-left)); right: max(34px, env(safe-area-inset-right)); bottom: max(25px, env(safe-area-inset-bottom)); display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .caption { max-width: 310px; }
    .caption .micro { color: var(--gold); }
    .caption p { margin: 9px 0 0; color: rgba(242,230,209,.8); font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-style: italic; letter-spacing: .01em; }
    .ride-controls { width: min(390px, 47vw); }
    .ride-topline { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 8px; letter-spacing: .19em; text-transform: uppercase; }
    .phase { color: var(--ink); }
    .trackline { position: relative; height: 2px; margin: 11px 0 13px; background: rgba(242,230,209,.2); overflow: hidden; }
    .trackline-fill { width: 0; height: 100%; background: var(--gold); box-shadow: 0 0 12px rgba(241,189,121,.72); transition: width .12s linear; }
    .controls-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
    .control {
      pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-width: 37px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 2px;
      color: var(--ink); background: rgba(14,24,37,.35); cursor: pointer; backdrop-filter: blur(8px);
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }
    .control:hover, .control:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; background: rgba(14,24,37,.68); }
    .control span { font: 600 8px "Avenir Next", Avenir, sans-serif; letter-spacing: .15em; }
    .control svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    .control .filled { fill: currentColor; stroke: none; }
    .pause-state { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0; visibility: hidden; background: rgba(9,16,27,.28); backdrop-filter: blur(2px); transition: opacity .25s ease, visibility .25s; }
    .pause-state.visible { opacity: 1; visibility: visible; }
    .pause-card { text-align: center; padding: 24px 34px; border-top: 1px solid rgba(241,189,121,.55); border-bottom: 1px solid rgba(241,189,121,.28); background: rgba(13,22,35,.45); }
    .pause-card strong { display: block; font-size: 12px; font-weight: 500; letter-spacing: .35em; }
    .pause-card small { display: block; margin-top: 9px; color: var(--muted); font-size: 8px; letter-spacing: .2em; }
    @media (max-width: 640px) {
      .hud { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
      .sigil { width: 28px; height: 28px; }
      .sigil::before { left: 13px; top: 4px; height: 18px; }
      .sigil::after { left: 4px; top: 13px; width: 18px; }
      .identity { gap: 10px; }
      .subline { font-size: 8px; }
      .speed-value { font-size: 25px; }
      .bottom { left: max(20px, env(safe-area-inset-left)); right: max(20px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); align-items: stretch; flex-direction: column; gap: 15px; }
      .caption p { font-size: 15px; margin-top: 5px; }
      .ride-controls { width: 100%; }
      .controls-row { position: absolute; right: 0; bottom: 39px; }
      .ride-topline { padding-right: 104px; }
      .trackline { margin-right: 104px; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="ride" aria-label="First-person view from a rollercoaster above a mountain valley"></canvas>
  <div class="wash" aria-hidden="true"></div>
  <div class="hud">
    <header class="masthead">
      <div class="identity">
        <div class="sigil" aria-hidden="true"></div>
        <div>
          <div class="eyebrow">Valley Line &nbsp; / &nbsp; No. 04</div>
          <h1>SOLSTICE</h1>
          <div class="subline">The Ridgeline &nbsp; · &nbsp; Open-air night service</div>
        </div>
      </div>
      <div class="speed" aria-live="off">
        <div><span class="speed-value" id="speed">00</span><span class="speed-label">Current pace</span></div>
        <span class="speed-unit">KM/H</span>
      </div>
    </header>
    <div class="bottom">
      <div class="caption">
        <div class="micro">Above the waking valley</div>
        <p>Follow the last light over the ridgeline.</p>
      </div>
      <div class="ride-controls">
        <div class="ride-topline"><span class="phase" id="phase">Departure</span><span id="distance">Circuit 01 &nbsp; · &nbsp; 00%</span></div>
        <div class="trackline"><div class="trackline-fill" id="progress"></div></div>
        <div class="controls-row">
          <button class="control" id="sound" type="button" aria-label="Turn wind ambience on" title="Wind ambience: off">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 7.2a4 4 0 0 1 0 5.6"/></svg><span id="sound-label">SOUND OFF</span>
          </button>
          <button class="control" id="restart" type="button" aria-label="Restart the ride" title="Restart">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6.5 6.5 0 1 1-.2 3"/><path d="M4 4v4h4"/></svg>
          </button>
          <button class="control" id="play" type="button" aria-label="Pause the ride" title="Pause">
            <svg id="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path class="filled" d="M6 4.5h3v11H6zM11 4.5h3v11h-3z"/></svg>
            <span id="play-label">PAUSE</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="pause-state" id="pause-state" aria-hidden="true"><div class="pause-card"><strong>THE RIDGELINE</strong><small>RIDE PAUSED &nbsp;·&nbsp; RESUME WHEN READY</small></div></div>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("ride");
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xa8b7b2, 0.00225);
    const camera = new THREE.PerspectiveCamera(79, window.innerWidth / window.innerHeight, 0.08, 900);
    scene.add(camera);

    const hemi = new THREE.HemisphereLight(0xd8e2d5, 0x172a37, 1.12);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xffcf9a, 3.1);
    sunLight.position.set(-86, 104, 38);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -135;
    sunLight.shadow.camera.right = 135;
    sunLight.shadow.camera.top = 135;
    sunLight.shadow.camera.bottom = -135;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 320;
    sunLight.shadow.bias = -0.00028;
    sunLight.shadow.normalBias = 0.025;
    scene.add(sunLight);

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(520, 40, 24),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: "varying vec3 vDirection; void main(){ vDirection=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
        fragmentShader: "varying vec3 vDirection; void main(){ vec3 d=normalize(vDirection); float h=d.y; vec3 low=vec3(0.25,0.34,0.39); vec3 amber=vec3(0.93,0.61,0.39); vec3 blue=vec3(0.075,0.13,0.24); vec3 c=mix(low,amber,smoothstep(-0.16,0.07,h)); c=mix(c,blue,smoothstep(0.09,0.82,h)); float haze=exp(-abs(h)*10.0); c+=vec3(0.11,0.045,0.018)*haze; gl_FragColor=vec4(c,1.0); }"
      })
    );
    scene.add(sky);

    function makeGlowTexture() {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const ctx = c.getContext("2d");
      const grad = ctx.createRadialGradient(64, 64, 1, 64, 64, 64);
      grad.addColorStop(0, "rgba(255,247,220,1)");
      grad.addColorStop(0.1, "rgba(255,215,160,.95)");
      grad.addColorStop(0.32, "rgba(255,170,100,.37)");
      grad.addColorStop(1, "rgba(255,155,80,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const glowTexture = makeGlowTexture();
    const sunPosition = new THREE.Vector3(-105, 77, 165);
    const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(5.6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe5bd, toneMapped: false }));
    sunDisc.position.copy(sunPosition);
    scene.add(sunDisc);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture, color: 0xffb36d, transparent: true, opacity: 0.67, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    sunGlow.position.copy(sunPosition);
    sunGlow.scale.set(100, 100, 1);
    scene.add(sunGlow);

    const controlPoints = [
      [0, 7.2, -70], [-2, 8.5, -43], [0, 20, -19], [4, 31, 0], [4, 32, 13],
      [-2, 24, 27], [-9, 12, 38], [-14, 8, 53], [-12, 7.4, 66], [0, 8.4, 74],
      [14, 9, 64], [21, 8, 48], [20, 6.2, 29], [14, 10.5, 12], [8, 21, -4],
      [10, 22, -18], [20, 13, -32], [23, 7.4, -49], [15, 6.4, -64], [4, 7, -77]
    ].map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });
    const trackPath = new THREE.CatmullRomCurve3(controlPoints, true, "catmullrom", 0.42);
    const trackLength = trackPath.getLength();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function frameAt(u) {
      const t = ((u % 1) + 1) % 1;
      const tangent = trackPath.getTangentAt(t).normalize();
      let side = new THREE.Vector3().crossVectors(worldUp, tangent);
      if (side.lengthSq() < 0.0001) side.set(1, 0, 0);
      side.normalize();
      const up = new THREE.Vector3().crossVectors(tangent, side).normalize();
      const before = trackPath.getTangentAt((t - 0.0015 + 1) % 1).normalize();
      const after = trackPath.getTangentAt((t + 0.0015) % 1).normalize();
      const turn = before.z * after.x - before.x * after.z;
      const bank = THREE.MathUtils.clamp(turn * 30, -0.22, 0.22);
      side.applyAxisAngle(tangent, bank);
      up.applyAxisAngle(tangent, bank);
      return { point: trackPath.getPointAt(t), tangent: tangent, side: side, up: up, bank: bank };
    }

    function terrainHeight(x, z) {
      function mound(cx, cz, radius, height) {
        const dx = x - cx;
        const dz = z - cz;
        return height * Math.exp(-(dx * dx + dz * dz) / (radius * radius));
      }
      return -7.5
        + 1.55 * Math.sin(x * 0.037 + z * 0.014) * Math.cos(z * 0.032 - x * 0.009)
        + 0.85 * Math.sin(x * 0.081) * Math.sin(z * 0.063)
        + mound(-83, 28, 49, 34)
        + mound(82, 43, 45, 38)
        + mound(-72, -93, 58, 23)
        + mound(76, -104, 63, 25)
        + mound(1, 177, 72, 21)
        + mound(-180, 157, 96, 12)
        + mound(176, 174, 100, 15);
    }

    const terrainSize = 480;
    const terrainSegments = 224;
    const terrainGeometry = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegments, terrainSegments);
    terrainGeometry.rotateX(-Math.PI / 2);
    const terrainPositions = terrainGeometry.attributes.position;
    const terrainColors = [];
    const groundDark = new THREE.Color(0x172e3a);
    const groundMid = new THREE.Color(0x34545a);
    const ridgeColor = new THREE.Color(0x78877d);
    const snowColor = new THREE.Color(0xb8b8a5);
    for (let i = 0; i < terrainPositions.count; i++) {
      const x = terrainPositions.getX(i);
      const z = terrainPositions.getZ(i);
      const h = terrainHeight(x, z);
      terrainPositions.setY(i, h);
      const blend = THREE.MathUtils.clamp((h + 11) / 28, 0, 1);
      const col = groundDark.clone().lerp(groundMid, blend);
      if (h > 8) col.lerp(ridgeColor, THREE.MathUtils.clamp((h - 8) / 28, 0, 0.8));
      if (h > 29) col.lerp(snowColor, THREE.MathUtils.clamp((h - 29) / 19, 0, 0.7));
      terrainColors.push(col.r, col.g, col.b);
    }
    terrainGeometry.setAttribute("color", new THREE.Float32BufferAttribute(terrainColors, 3));
    terrainGeometry.computeVertexNormals();
    const terrain = new THREE.Mesh(terrainGeometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0.02 }));
    terrain.position.y = -0.15;
    terrain.receiveShadow = true;
    scene.add(terrain);

    const treeAvoidPoints = [];
    for (let i = 0; i < 260; i++) treeAvoidPoints.push(trackPath.getPointAt(i / 260));
    function nearTrack(x, z, limit) {
      const limitSq = limit * limit;
      for (let i = 0; i < treeAvoidPoints.length; i++) {
        const dx = x - treeAvoidPoints[i].x;
        const dz = z - treeAvoidPoints[i].z;
        if (dx * dx + dz * dz < limitSq) return true;
      }
      return false;
    }

    function pineGeometry() {
      const positions = [];
      const colors = [];
      const indices = [];
      function ringCone(y0, y1, r0, r1, sides, color) {
        const base = positions.length / 3;
        const c = new THREE.Color(color);
        for (let ring = 0; ring < 2; ring++) {
          const y = ring ? y1 : y0;
          const r = ring ? r1 : r0;
          for (let s = 0; s < sides; s++) {
            const a = (s / sides) * Math.PI * 2;
            positions.push(Math.cos(a) * r, y, Math.sin(a) * r);
            const shade = 0.78 + 0.22 * Math.sin(a * 2.1 + y * 12);
            colors.push(c.r * shade, c.g * shade, c.b * shade);
          }
        }
        for (let s = 0; s < sides; s++) {
          const n = (s + 1) % sides;
          indices.push(base + s, base + sides + n, base + n, base + s, base + sides + s, base + sides + n);
        }
      }
      ringCone(0.12, 0.53, 0.31, 0.015, 7, 0x315b56);
      ringCone(0.34, 0.76, 0.235, 0.012, 7, 0x3e6a60);
      ringCone(0.56, 0.99, 0.15, 0.004, 7, 0x54796a);
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      g.setIndex(indices);
      g.computeVertexNormals();
      return g;
    }

    let seed = 49017;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    const pineGeo = pineGeometry();
    const pineMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.93 });
    const forestCount = 1850;
    const forest = new THREE.InstancedMesh(pineGeo, pineMat, forestCount);
    forest.castShadow = false;
    forest.receiveShadow = true;
    const dummy = new THREE.Object3D();
    const treeRecords = [];
    let placed = 0;
    let attempts = 0;
    while (placed < forestCount && attempts < forestCount * 5) {
      attempts++;
      const x = (random() - 0.5) * 360;
      const z = (random() - 0.47) * 370;
      const y = terrainHeight(x, z) - 0.12;
      if (nearTrack(x, z, 10.5)) continue;
      if (y > 28 && random() < 0.45) continue;
      const height = 4.4 + random() * 6.8;
      const scale = height * (0.78 + random() * 0.34);
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, random() * Math.PI * 2, 0);
      dummy.scale.set(scale * (0.72 + random() * 0.16), scale, scale * (0.72 + random() * 0.16));
      dummy.updateMatrix();
      forest.setMatrixAt(placed, dummy.matrix);
      const tint = 0.76 + random() * 0.45;
      forest.setColorAt(placed, new THREE.Color(tint, tint * (0.98 + random() * 0.05), tint * (0.92 + random() * 0.12)));
      treeRecords.push({ x: x, y: y, z: z, scale: scale, yaw: dummy.rotation.y });
      placed++;
    }
    forest.count = placed;
    scene.add(forest);

    const trunkGeo = new THREE.CylinderGeometry(0.055, 0.09, 1, 5, 1);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x463840, roughness: 1 });
    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, placed);
    trunks.castShadow = false;
    const trunkDummy = new THREE.Object3D();
    for (let trunkIndex = 0; trunkIndex < treeRecords.length; trunkIndex++) {
      const tree = treeRecords[trunkIndex];
      trunkDummy.position.set(tree.x, tree.y + tree.scale * 0.095, tree.z);
      trunkDummy.rotation.set(0, tree.yaw, 0);
      trunkDummy.scale.set(1, tree.scale * 0.22, 1);
      trunkDummy.updateMatrix();
      trunks.setMatrixAt(trunkIndex, trunkDummy.matrix);
    }
    trunks.count = treeRecords.length;
    scene.add(trunks);

    const railMaterial = new THREE.MeshStandardMaterial({ color: 0xd4a06b, metalness: 0.72, roughness: 0.28, emissive: 0x3e1f10, emissiveIntensity: 0.28 });
    const railSampleCount = 920;
    const railPointsLeft = [];
    const railPointsRight = [];
    for (let i = 0; i < railSampleCount; i++) {
      const f = frameAt(i / railSampleCount);
      railPointsLeft.push(f.point.clone().addScaledVector(f.side, -1.18).addScaledVector(f.up, 0.13));
      railPointsRight.push(f.point.clone().addScaledVector(f.side, 1.18).addScaledVector(f.up, 0.13));
    }
    const leftRailCurve = new THREE.CatmullRomCurve3(railPointsLeft, true, "centripetal");
    const rightRailCurve = new THREE.CatmullRomCurve3(railPointsRight, true, "centripetal");
    const leftRail = new THREE.Mesh(new THREE.TubeGeometry(leftRailCurve, 1900, 0.19, 10, true), railMaterial);
    const rightRail = new THREE.Mesh(new THREE.TubeGeometry(rightRailCurve, 1900, 0.19, 10, true), railMaterial);
    leftRail.castShadow = rightRail.castShadow = true;
    leftRail.receiveShadow = rightRail.receiveShadow = true;
    scene.add(leftRail, rightRail);

    const sleeperSpacing = 0.88;
    const sleeperCount = Math.ceil(trackLength / sleeperSpacing);
    const sleeperGeometry = new THREE.BoxGeometry(2.92, 0.17, 0.38);
    const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x343541, roughness: 0.77, metalness: 0.18 });
    const sleepers = new THREE.InstancedMesh(sleeperGeometry, sleeperMaterial, sleeperCount);
    sleepers.castShadow = true;
    sleepers.receiveShadow = true;
    const matrix = new THREE.Matrix4();
    const basis = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const scale = new THREE.Vector3(1, 1, 1);
    for (let i = 0; i < sleeperCount; i++) {
      const f = frameAt((i * sleeperSpacing) / trackLength);
      basis.makeBasis(f.side, f.up, f.tangent);
      q.setFromRotationMatrix(basis);
      matrix.compose(f.point.clone().addScaledVector(f.up, -0.02), q, scale);
      sleepers.setMatrixAt(i, matrix);
    }
    scene.add(sleepers);

    const supportGeometry = new THREE.BoxGeometry(1, 1, 1);
    const supportMaterial = new THREE.MeshStandardMaterial({ color: 0x46525a, metalness: 0.61, roughness: 0.48 });
    const supportMatrices = [];
    const crossbeamMatrices = [];
    const supportColors = [];
    for (let d = 5; d < trackLength; d += 7.4) {
      const f = frameAt(d / trackLength);
      const groundY = terrainHeight(f.point.x, f.point.z) - 0.12;
      const bottom = groundY + 0.3;
      const height = f.point.y - bottom - 0.45;
      if (height < 1.8) continue;
      for (const sign of [-1, 1]) {
        const at = f.point.clone().addScaledVector(f.side, sign * 1.62);
        const pos = new THREE.Vector3(at.x, bottom + height / 2, at.z);
        const sc = new THREE.Vector3(0.23, height, 0.23);
        supportMatrices.push(new THREE.Matrix4().compose(pos, new THREE.Quaternion(), sc));
        supportColors.push(new THREE.Color(sign < 0 ? 0x86918b : 0x566872));
      }
      const beamPos = f.point.clone().addScaledVector(f.up, -0.47);
      const beamScale = new THREE.Vector3(3.55, 0.22, 0.28);
      const beamQ = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.side, f.up, f.tangent));
      crossbeamMatrices.push(new THREE.Matrix4().compose(beamPos, beamQ, beamScale));
    }
    const supportPosts = new THREE.InstancedMesh(supportGeometry, supportMaterial, supportMatrices.length);
    supportMatrices.forEach(function (m, i) { supportPosts.setMatrixAt(i, m); supportPosts.setColorAt(i, supportColors[i]); });
    supportPosts.castShadow = supportPosts.receiveShadow = true;
    scene.add(supportPosts);
    const crossbeams = new THREE.InstancedMesh(supportGeometry, supportMaterial, crossbeamMatrices.length);
    crossbeamMatrices.forEach(function (m, i) { crossbeams.setMatrixAt(i, m); });
    crossbeams.castShadow = crossbeams.receiveShadow = true;
    scene.add(crossbeams);

    const gateMaterial = new THREE.MeshStandardMaterial({ color: 0xf2bf7d, metalness: 0.53, roughness: 0.32, emissive: 0x9a4a23, emissiveIntensity: 0.58 });
    const gateCoolMaterial = new THREE.MeshStandardMaterial({ color: 0x91c8c0, metalness: 0.42, roughness: 0.31, emissive: 0x1b7779, emissiveIntensity: 0.7 });
    const gateGlowMaterial = new THREE.SpriteMaterial({ map: glowTexture, color: 0xffc486, transparent: true, opacity: 0.27, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
    const gatePositions = [0.12, 0.28, 0.46, 0.68, 0.88];
    gatePositions.forEach(function (u, i) {
      const f = frameAt(u);
      const center = f.point.clone().addScaledVector(f.up, 3.35);
      const gate = new THREE.Mesh(new THREE.TorusGeometry(1, 0.075, 8, 64), i === 2 ? gateCoolMaterial : gateMaterial);
      gate.scale.set(5.15, 3.45, 1);
      gate.position.copy(center);
      gate.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.side, f.up, f.tangent));
      gate.castShadow = true;
      scene.add(gate);
      const glow = new THREE.Sprite(gateGlowMaterial.clone());
      glow.position.copy(center);
      glow.scale.set(19, 19, 1);
      scene.add(glow);
    });

    const fireflyPositions = [];
    for (let i = 0; i < 560; i++) {
      const x = (random() - 0.5) * 118;
      const z = (random() - 0.5) * 188;
      if (nearTrack(x, z, 5)) continue;
      fireflyPositions.push(x, terrainHeight(x, z) + 0.5 + random() * 5.5, z);
    }
    const fireflyGeometry = new THREE.BufferGeometry();
    fireflyGeometry.setAttribute("position", new THREE.Float32BufferAttribute(fireflyPositions, 3));
    const fireflies = new THREE.Points(fireflyGeometry, new THREE.PointsMaterial({ color: 0xffd391, size: 0.42, map: glowTexture, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, toneMapped: false }));
    scene.add(fireflies);
    const fireflyBase = new Float32Array(fireflyPositions);

    const cockpit = new THREE.Group();
    const cockpitShell = new THREE.Mesh(
      new THREE.BoxGeometry(1.55, 0.18, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x243341, metalness: 0.58, roughness: 0.34, emissive: 0x0b1820, emissiveIntensity: 0.26 })
    );
    cockpitShell.position.set(0, -1.55, -2.35);
    cockpit.add(cockpitShell);
    const cockpitInset = new THREE.Mesh(
      new THREE.BoxGeometry(1.22, 0.035, 0.88),
      new THREE.MeshStandardMaterial({ color: 0x5a4a41, metalness: 0.54, roughness: 0.3, emissive: 0x8a4826, emissiveIntensity: 0.22 })
    );
    cockpitInset.position.set(0, -1.44, -2.35);
    cockpit.add(cockpitInset);
    const restraintPath = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.69, -1.22, -1.72), new THREE.Vector3(-0.62, -0.72, -2.03),
      new THREE.Vector3(0, -0.59, -2.14), new THREE.Vector3(0.62, -0.72, -2.03),
      new THREE.Vector3(0.69, -1.22, -1.72)
    ]);
    const restraint = new THREE.Mesh(new THREE.TubeGeometry(restraintPath, 40, 0.038, 8, false), railMaterial);
    cockpit.add(restraint);
    camera.add(cockpit);

    const phases = [
      [0, "Departure"], [0.055, "The ascent"], [0.14, "Last light"], [0.22, "Over the crest"],
      [0.33, "Valley flight"], [0.48, "The far ridge"], [0.63, "Through the pines"], [0.78, "Homeward"], [0.92, "The station"]
    ];
    const speedProfile = [
      [0, 9], [0.045, 13], [0.12, 21], [0.19, 39], [0.25, 43], [0.36, 28],
      [0.48, 31], [0.59, 38], [0.71, 27], [0.82, 34], [0.93, 20], [1, 9]
    ];
    function sampleProfile(profile, u) {
      for (let i = 1; i < profile.length; i++) {
        if (u <= profile[i][0]) {
          const a = profile[i - 1];
          const b = profile[i];
          const t = (u - a[0]) / (b[0] - a[0]);
          return THREE.MathUtils.lerp(a[1], b[1], t);
        }
      }
      return profile[profile.length - 1][1];
    }
    function phaseAt(u) {
      let label = phases[0][1];
      for (let i = 1; i < phases.length; i++) {
        if (u < phases[i][0]) break;
        label = phases[i][1];
      }
      return label;
    }

    let progress = 0;
    let elapsed = 0;
    let playing = true;
    let circuit = 1;
    let lastPhase = "";
    const clock = new THREE.Clock();
    const speedNode = document.getElementById("speed");
    const progressNode = document.getElementById("progress");
    const phaseNode = document.getElementById("phase");
    const distanceNode = document.getElementById("distance");
    const playButton = document.getElementById("play");
    const playIcon = document.getElementById("play-icon");
    const playLabel = document.getElementById("play-label");
    const pauseState = document.getElementById("pause-state");
    let audioContext = null;
    let audioGain = null;
    let windGain = null;
    let soundEnabled = false;

    function setSound(on) {
      soundEnabled = on;
      if (on && !audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
          audioGain = audioContext.createGain();
          audioGain.gain.value = 0;
          audioGain.connect(audioContext.destination);
          const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 3, audioContext.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.35;
          const noise = audioContext.createBufferSource();
          noise.buffer = noiseBuffer;
          noise.loop = true;
          const filter = audioContext.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 650;
          const wind = audioContext.createGain();
          wind.gain.value = 0.24;
          noise.connect(filter);
          filter.connect(wind);
          wind.connect(audioGain);
          noise.start();
          windGain = audioGain.gain;
          const low = audioContext.createOscillator();
          const lowGain = audioContext.createGain();
          low.type = "sine";
          low.frequency.value = 54;
          lowGain.gain.value = 0.018;
          low.connect(lowGain);
          lowGain.connect(audioGain);
          low.start();
        }
      }
      if (audioContext && audioGain) {
        if (audioContext.state === "suspended") audioContext.resume();
        audioGain.gain.cancelScheduledValues(audioContext.currentTime);
        audioGain.gain.setTargetAtTime(on ? 0.62 : 0, audioContext.currentTime, 0.34);
      }
      document.getElementById("sound-label").textContent = on ? "SOUND ON" : "SOUND OFF";
      document.getElementById("sound").setAttribute("aria-label", on ? "Turn wind ambience off" : "Turn wind ambience on");
      document.getElementById("sound").title = "Wind ambience: " + (on ? "on" : "off");
    }

    document.getElementById("sound").addEventListener("click", function () { setSound(!soundEnabled); });
    playButton.addEventListener("click", function () {
      playing = !playing;
      playLabel.textContent = playing ? "PAUSE" : "RESUME";
      playButton.setAttribute("aria-label", playing ? "Pause the ride" : "Resume the ride");
      playButton.title = playing ? "Pause" : "Resume";
      playIcon.innerHTML = playing
        ? '<path class="filled" d="M6 4.5h3v11H6zM11 4.5h3v11h-3z"/>'
        : '<path class="filled" d="M7 4.5 15 10l-8 5.5z"/>';
      pauseState.classList.toggle("visible", !playing);
      pauseState.setAttribute("aria-hidden", playing ? "true" : "false");
    });
    document.getElementById("restart").addEventListener("click", function () {
      progress = 0;
      elapsed = 0;
      circuit = 1;
      if (!playing) playButton.click();
    });

    function updateCamera(dt) {
      const u = progress;
      const f = frameAt(u);
      const bob = playing ? Math.sin(elapsed * 8.7) * 0.018 + Math.sin(elapsed * 3.1) * 0.022 : 0;
      camera.position.copy(f.point).addScaledVector(f.up, 1.22 + bob).addScaledVector(f.tangent, 0.16);
      const right = f.tangent.clone().cross(f.up).normalize();
      const back = f.tangent.clone().negate();
      const cameraBasis = new THREE.Matrix4().makeBasis(right, f.up, back);
      camera.quaternion.setFromRotationMatrix(cameraBasis);
      const phase = phaseAt(u);
      if (phase !== lastPhase) {
        phaseNode.textContent = phase;
        lastPhase = phase;
      }
      const pace = sampleProfile(speedProfile, u);
      speedNode.textContent = String(Math.round(pace * 3.6)).padStart(2, "0");
      progressNode.style.width = (u * 100).toFixed(2) + "%";
      distanceNode.textContent = "Circuit " + String(circuit).padStart(2, "0") + " \u00b7 " + String(Math.floor(u * 100)).padStart(2, "0") + "%";
      if (audioContext && audioGain && soundEnabled) {
        const desired = 0.47 + pace / 100;
        audioGain.gain.setTargetAtTime(desired, audioContext.currentTime, 0.5);
      }
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.04);
      if (playing) {
        elapsed += dt;
        const pace = sampleProfile(speedProfile, progress);
        const previous = progress;
        progress = (progress + (pace * dt) / trackLength) % 1;
        if (progress < previous) circuit++;
      }
      updateCamera(dt);
      const positions = fireflyGeometry.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        positions.setY(i, fireflyBase[i * 3 + 1] + Math.sin(elapsed * 0.7 + i * 0.37) * 0.18);
      }
      positions.needsUpdate = true;
      renderer.render(scene, camera);
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", resize, { passive: true });
    updateCamera(0);
    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
