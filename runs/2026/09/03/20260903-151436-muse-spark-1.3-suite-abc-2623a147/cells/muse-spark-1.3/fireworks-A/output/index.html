<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fireworks Display</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#050510; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #sky { position:fixed; inset:0; display:block; cursor:crosshair; }
  .overlay {
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 22px; pointer-events:none; z-index:10;
  }
  .title h1 {
    color:#fff; font-size:22px; letter-spacing:3px; font-weight:800;
    text-shadow:0 0 18px rgba(255,150,200,.6), 0 0 40px rgba(120,150,255,.4);
  }
  .title p { color:rgba(255,255,255,.65); font-size:13px; margin-top:4px; letter-spacing:.5px; }
  .panel {
    pointer-events:auto;
    background:rgba(15,15,30,.62); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    color:#fff; font-size:13px;
  }
  .panel button {
    background:linear-gradient(135deg,#ff5fa2,#7a5cff);
    border:none; color:#fff; font-weight:700; font-size:13px;
    padding:8px 14px; border-radius:999px; cursor:pointer;
    box-shadow:0 2px 16px rgba(255,95,162,.4);
  }
  .panel button.ghost { background:rgba(255,255,255,.12); box-shadow:none; }
  .panel button:hover { filter:brightness(1.15); }
  .panel label { display:flex; align-items:center; gap:6px; opacity:.9; }
  #hint {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.55); font-size:13px; letter-spacing:.4px;
    background:rgba(0,0,0,.35); padding:8px 16px; border-radius:999px;
    border:1px solid rgba(255,255,255,.12); pointer-events:none; z-index:10;
    white-space:nowrap;
  }
  #city {
    position:fixed; bottom:0; left:0; right:0; height:110px; pointer-events:none; z-index:5;
    background:
      linear-gradient(to top, rgba(5,5,16,1) 0%, rgba(5,5,16,0) 100%);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="city"></div>
<div class="overlay">
  <div class="title">
    <h1>✦ FIREWORKS ✦</h1>
    <p>Click / tap anywhere to launch • auto show running</p>
  </div>
  <div class="panel">
    <button id="burstBtn">Grand Finale</button>
    <button id="autoBtn" class="ghost">Auto: ON</button>
    <label><input type="checkbox" id="trailChk" checked /> Trails</label>
  </div>
</div>
<div id="hint">Click sky to launch &nbsp;•&nbsp; F = finale &nbsp;•&nbsp; A = toggle auto</div>

<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  // static starfield
  const stars = Array.from({length: 160}, () => ({
    x: Math.random(), y: Math.random()*0.75,
    r: Math.random()*1.4+0.3, tw: Math.random()*Math.PI*2, sp: 0.5+Math.random()*1.5
  }));
  function drawStars(t){
    for(const s of stars){
      const a = 0.35 + 0.35*Math.sin(t*0.001*s.sp + s.tw);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath();
      ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // moon
    const mx = W*0.84, my = H*0.16;
    const g = ctx.createRadialGradient(mx,my,5,mx,my,70);
    g.addColorStop(0,'rgba(240,244,255,.95)');
    g.addColorStop(0.18,'rgba(220,230,255,.9)');
    g.addColorStop(0.25,'rgba(180,200,255,.25)');
    g.addColorStop(1,'rgba(180,200,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mx,my,70,0,Math.PI*2); ctx.fill();
  }

  // city silhouette
  function drawCity(){
    ctx.fillStyle = '#070714';
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,H-40);
    let x=0;
    // deterministic pseudo buildings
    const seed = [50,90,60,110,45,80,120,55,95,70,105,48,85,62,100,58,78,92,52,110,66,88];
    let i=0;
    while(x < W){
      const bw = 40+((seed[i%seed.length]*7)%70);
      const bh = seed[i%seed.length]+10;
      ctx.lineTo(x,H-bh);
      // antenna
      if(i%5===0){ ctx.lineTo(x+bw/2,H-bh-14); ctx.lineTo(x+bw/2+3,H-bh-14); ctx.lineTo(x+bw/2+3,H-bh); }
      ctx.lineTo(x+bw,H-bh);
      ctx.lineTo(x+bw,H-30-((i*13)%25));
      x+=bw; i++;
    }
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();
    // windows
    ctx.fillStyle = 'rgba(255,210,120,.55)';
    for(let wx=12; wx<W; wx+=26){
      for(let wy=H-88; wy<H-12; wy+=18){
        if((wx*7+wy*13)%11 < 3){
          ctx.fillRect(wx,wy,3,5);
        }
      }
    }
  }

  const rockets = [];
  const particles = [];
  let auto = true;
  let trails = true;
  let flash = 0;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pickHue(){ return Math.floor(Math.random()*360); }

  function launch(tx, ty, opts={}){
    const sx = tx!==undefined ? tx : rand(W*0.15, W*0.85);
    const startY = H + 10;
    const targetY = ty!==undefined ? ty : rand(H*0.12, H*0.48);
    rockets.push({
      x: sx + rand(-20,20), y: startY,
      tx: sx, ty: targetY,
      vy: -rand(9,12.5), vx: rand(-0.6,0.6),
      hue: opts.hue ?? pickHue(),
      type: opts.type ?? pickType(),
      power: opts.power ?? rand(70,130),
      trail: []
    });
  }

  function pickType(){
    const r = Math.random();
    if(r<0.34) return 'peony';
    if(r<0.52) return 'ring';
    if(r<0.68) return 'willow';
    if(r<0.82) return 'strobe';
    if(r<0.93) return 'double';
    return 'crackle';
  }

  function explode(r){
    flash = Math.min(0.28, flash + 0.12);
    const hue = r.hue;
    const n = Math.floor(r.power * (r.type==='double'?1.4:1));
    const mk = (angle, speed, h, life, size, extra={}) => {
      particles.push({
        x:r.x, y:r.y,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
        hue:h, sat:90, light:60,
        life:1, decay: rand(0.004,0.009)*(extra.slow?0.55:1) + (1/(life||100)),
        gravity: extra.gravity ?? 0.035,
        drag: extra.drag ?? 0.985,
        size: size ?? rand(1.4,2.6),
        twinkle: extra.twinkle||false,
        strobe: extra.strobe||false,
        flick: Math.random()*Math.PI*2
      });
    };
    if(r.type==='peony'){
      for(let i=0;i<n+60;i++){
        const a = (i/(n+60))*Math.PI*2 + rand(-0.05,0.05);
        const sp = rand(1,6.5);
        mk(a, sp, hue+rand(-18,18), 100, rand(1.5,2.8));
      }
    } else if(r.type==='ring'){
      const rings = 2;
      for(let k=0;k<rings;k++){
        const count = 46 - k*8;
        const sp = 4.6 - k*1.1;
        const h2 = hue + k*30;
        for(let i=0;i<count;i++){
          const a = (i/count)*Math.PI*2;
          mk(a, sp+rand(-0.15,0.15), h2, 120, 2.2, {gravity:0.02});
        }
      }
    } else if(r.type==='willow'){
      for(let i=0;i<n+40;i++){
        const a = (i/(n+40))*Math.PI*2;
        const sp = rand(1.5,5.5);
        mk(a, sp, hue+rand(-10,25), 160, rand(1.4,2.2),
          {gravity:0.055, drag:0.978, slow:true, twinkle:true});
      }
    } else if(r.type==='strobe'){
      for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2;
        const sp = rand(0.5,6);
        mk(a, sp, hue+rand(-25,25), 130, 2.4, {strobe:true, gravity:0.03});
      }
    } else if(r.type==='double'){
      for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2;
        mk(a, rand(1,6.2), hue, 100, 2.2);
        if(i%2===0) mk(a, rand(1,3.2), (hue+140)%360, 120, 1.9, {gravity:0.025});
      }
    } else { // crackle
      for(let i=0;i<n+30;i++){
        const a = Math.random()*Math.PI*2;
        mk(a, rand(1,6.8), Math.random()<0.5?hue:rand(40,60), 90, 2.0, {twinkle:true});
      }
    }
  }

  function finale(){
    for(let i=0;i<10;i++){
      setTimeout(()=>launch(rand(W*0.08,W*0.92), rand(H*0.1,H*0.45),
        {hue: Math.floor(rand(0,360)), type:pickType(), power:rand(90,150)}), i*180);
    }
  }

  // input
  canvas.addEventListener('pointerdown', e => {
    launch(e.clientX, e.clientY*0.9);
  });
  document.getElementById('burstBtn').addEventListener('click', finale);
  const autoBtn = document.getElementById('autoBtn');
  function setAuto(v){ auto=v; autoBtn.textContent = 'Auto: '+(v?'ON':'OFF'); autoBtn.classList.toggle('ghost', !v); }
  autoBtn.addEventListener('click', ()=>setAuto(!auto));
  document.getElementById('trailChk').addEventListener('change', e=>{ trails=e.target.checked; });
  window.addEventListener('keydown', e=>{
    if(e.key==='f'||e.key==='F') finale();
    if(e.key==='a'||e.key==='A') setAuto(!auto);
  });

  // auto scheduler
  let nextAuto = 0;
  function scheduleAuto(t){
    if(!auto) return;
    if(t >= nextAuto){
      launch();
      if(Math.random()<0.25) setTimeout(()=>launch(), 250);
      nextAuto = t + rand(450, 1400);
    }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(33, now-last)/16.666; last = now;
    // fade with trails
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = trails ? 'rgba(5,5,16,0.22)' : 'rgba(5,5,16,0.55)';
    ctx.fillRect(0,0,W,H);
    drawStars(now);

    // flash
    if(flash>0.002){
      ctx.fillStyle = `rgba(200,210,255,${flash.toFixed(3)})`;
      ctx.fillRect(0,0,W,H);
      flash *= 0.88;
    }

    // rockets
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.trail.push({x:r.x,y:r.y});
      if(r.trail.length>12) r.trail.shift();
      r.x += r.vx*dt; r.y += r.vy*dt;
      r.vy += 0.08*dt;
      // trail spark
      ctx.globalCompositeOperation = 'lighter';
      for(let t=0;t<r.trail.length;t++){
        const p = r.trail[t];
        ctx.globalAlpha = t/r.trail.length*0.7;
        ctx.fillStyle = `hsl(${r.hue},95%,65%)`;
        ctx.beginPath(); ctx.arc(p.x,p.y,1.3,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(r.x,r.y,2.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsl(${r.hue},100%,60%)`;
      ctx.beginPath(); ctx.arc(r.x,r.y,4.5,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(r.x,r.y,8,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      if(r.y <= r.ty || r.vy >= -1.5){
        rockets.splice(i,1);
        explode(r);
      }
    }

    // particles
    ctx.globalCompositeOperation = 'lighter';
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.flick += 0.25*dt;
      p.vx *= Math.pow(p.drag, dt);
      p.vy = p.vy*Math.pow(p.drag, dt) + p.gravity*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.life -= p.decay*dt;
      if(p.life<=0 || p.y>H+20){ particles.splice(i,1); continue; }
      let alpha = Math.max(0, Math.min(1, p.life*1.4));
      if(p.strobe) alpha *= (Math.sin(p.flick*1.4)>0?1:0.08);
      else if(p.twinkle) alpha *= (0.55+0.45*Math.sin(p.flick));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `hsl(${p.hue},${p.sat}%,${p.light}%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    drawCity();
    scheduleAuto(now);
    requestAnimationFrame(frame);
  }

  // init background
  ctx.fillStyle = '#050510'; ctx.fillRect(0,0,W,H);
  drawStars(0); drawCity();

  // opening volley
  launch(W*0.3, H*0.3, {hue:210});
  setTimeout(()=>launch(W*0.7, H*0.25, {hue:320}), 400);
  setTimeout(()=>launch(W*0.5, H*0.2, {hue:45}), 900);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
