<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireworks Display</title>
  <style>
    :root {
      --bg-a: #05070f;
      --bg-b: #10142c;
      --text: #f8fbff;
      --accent: #6dd8ff;
      --panel: rgba(6, 10, 24, 0.7);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(120% 120% at 50% 90%, var(--bg-b) 0%, var(--bg-a) 55%);
      font-family: "Trebuchet MS", "Trebuchet", "Segoe UI", sans-serif;
      color: var(--text);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      pointer-events: auto;
      backdrop-filter: blur(5px);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      max-width: min(320px, calc(100vw - 100px));
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .panel p {
      margin: 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(11, 18, 38, 0.75);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    button:hover {
      background: rgba(17, 34, 68, 0.8);
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Animated fireworks display"></canvas>
  <div id="hud">
    <section class="panel">
      <h1>Fireworks</h1>
      <p id="status">Auto loop running. Click / tap to trigger a burst.</p>
    </section>
    <section class="panel">
      <p id="counter">Bursts launched: 0</p>
      <div class="controls">
        <button id="burstBtn">Launch</button>
        <button id="pauseBtn">Pause</button>
        <button id="clearBtn">Clear</button>
      </div>
    </section>
  </div>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const statusEl = document.getElementById('status');
    const counterEl = document.getElementById('counter');
    const burstBtn = document.getElementById('burstBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const clearBtn = document.getElementById('clearBtn');

    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let width = 0;
    let height = 0;
    let raf = 0;
    let running = true;
    let burstCount = 0;
    let lastAuto = 0;

    let particles = [];
    let stars = [];

    const palette = [
      '#ff7f8e', '#8cffc5', '#7fb2ff', '#ffd57a', '#dba5ff', '#7fffff', '#ffffff'
    ];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      statusEl.textContent = `Canvas: ${width}×${height}. Auto loop running.`;
    }

    window.addEventListener('resize', resize);
    resize();

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function createBurst(x, y) {
      const hueBase = Math.floor(Math.random() * palette.length);
      const shellColor = palette[hueBase];
      const shellCount = Math.floor(rand(100, 210));
      const speed = rand(1.8, 3.2);
      const radius = rand(36, 56);

      for (let i = 0; i < shellCount; i++) {
        const angle = (Math.PI * 2 * i) / shellCount + Math.random() * 0.12;
        const jitter = rand(0.75, 1.5);
        const vx = Math.cos(angle) * speed * jitter * rand(0.4, 1.5);
        const vy = Math.sin(angle) * speed * jitter * rand(0.4, 1.5);
        const lifetime = rand(650, 1250);

        particles.push({
          x,
          y,
          vx,
          vy: vy - rand(0.2, 0.5),
          size: rand(1.2, 3.1),
          life: lifetime,
          maxLife: lifetime,
          gravity: rand(0.006, 0.028),
          hueShift: Math.random() * 2,
          alpha: rand(0.35, 0.95),
          color: shellColor,
          tail: [],
          trailDecay: rand(0.18, 0.35),
        });
      }

      burstCount++;
      counterEl.textContent = `Bursts launched: ${burstCount}`;
    }

    function createStarfield() {
      stars = Array.from({ length: 1100 }, () => ({
        x: rand(0, width),
        y: rand(0, height),
        r: rand(0.3, 1.8),
        tw: rand(0.15, 1.1),
        t: rand(0, Math.PI * 2),
      }));
    }

    function spawnAutoBurst() {
      const now = performance.now();
      const elapsed = now - lastAuto;
      if (running && elapsed > 900) {
        lastAuto = now;
        createBurst(rand(width * 0.12, width * 0.88), rand(height * 0.08, height * 0.65));
      }
    }

    function paintBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#080c1e');
      grad.addColorStop(1, '#060a16');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      for (const star of stars) {
        star.t += 0.02;
        const alpha = 0.4 + Math.sin(star.t) * star.tw * 0.25;
        ctx.fillStyle = `rgba(230, 245, 255, ${Math.max(0.02, Math.min(1, alpha))})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticle(p) {
      const progress = 1 - p.life / p.maxLife;
      const trailLength = 4 + Math.floor(10 * (1 - progress));
      p.tail.push({ x: p.x, y: p.y });
      if (p.tail.length > trailLength) p.tail.shift();

      if (p.tail.length > 1) {
        for (let i = 0; i < p.tail.length - 1; i++) {
          const a = p.tail[i];
          const b = p.tail[i + 1];
          const alpha = (i / p.tail.length) * p.alpha * 0.45 * (1 - progress);
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      const glow = 8 + (1 - progress) * 18;
      const tone = p.color;
      const hueShift = `hsl(${(progress * 60 + p.hueShift * 140) % 360}, 80%, 65%)`;
      const core = `rgba(255,255,255,${0.25 * (1 - progress)})`;
      const burst = `rgba(255,255,255,${0.12 * (1 - progress)})`;

      ctx.beginPath();
      ctx.fillStyle = core;
      ctx.shadowColor = tone;
      ctx.shadowBlur = glow;
      ctx.arc(p.x, p.y, p.size * (1 + (1 - progress) * 0.55), 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = burst;
      ctx.shadowColor = hueShift;
      ctx.shadowBlur = glow * 0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.72, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      p.vy += p.gravity * (1 + progress);
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 16;
    }

    function render(now = 0) {
      paintBackground();
      spawnAutoBurst();

      particles = particles.filter((p) => {
        if (p.life <= 0) return false;
        if (p.y > height + 40) return false;
        if (p.x < -80 || p.x > width + 80) return false;
        if (p.y < -80) return false;
        drawParticle(p);
        return true;
      });

      if (!running && raf) {
        return;
      }
      raf = requestAnimationFrame(render);
    }

    function launchAtPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const x = (event.changedTouches ? event.changedTouches[0].clientX : event.clientX) - rect.left;
      const y = (event.changedTouches ? event.changedTouches[0].clientY : event.clientY) - rect.top;
      if (Number.isFinite(x) && Number.isFinite(y)) createBurst(x, y);
      if (!running) {
        running = true;
        pauseBtn.textContent = 'Pause';
        statusEl.textContent = 'Auto loop running. Click / tap to trigger a burst.';
        raf = requestAnimationFrame(render);
      }
    }

    burstBtn.addEventListener('click', () => createBurst(rand(width * 0.15, width * 0.85), rand(height * 0.18, height * 0.72)));
    clearBtn.addEventListener('click', () => {
      particles = [];
      statusEl.textContent = 'Canvas cleared.';
    });
    pauseBtn.addEventListener('click', () => {
      running = !running;
      if (running) {
        pauseBtn.textContent = 'Pause';
        statusEl.textContent = 'Auto loop running. Click / tap to trigger a burst.';
        raf = requestAnimationFrame(render);
      } else {
        pauseBtn.textContent = 'Resume';
        statusEl.textContent = 'Paused. Press Resume or click to relaunch.';
      }
    });

    canvas.addEventListener('click', launchAtPointer);
    canvas.addEventListener('touchstart', launchAtPointer, { passive: true });

    createStarfield();
    lastAuto = performance.now();
    raf = requestAnimationFrame(render);
  </script>
</body>
</html>
