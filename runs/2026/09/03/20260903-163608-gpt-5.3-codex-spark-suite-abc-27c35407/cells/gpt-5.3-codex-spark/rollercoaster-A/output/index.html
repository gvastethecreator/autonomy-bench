<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rollercoaster A</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05070d;
        overflow: hidden;
        color: #e7ecff;
      }

      canvas {
        display: block;
      }

      #status {
        position: fixed;
        left: 0;
        top: 0;
        padding: 10px 12px;
        font: 12px/1.4 Inter, Arial, sans-serif;
        color: #c6d5ff;
        z-index: 2;
        opacity: 0.82;
      }

      a {
        color: #91b1ff;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.min.js"></script>
  </head>
  <body>
    <div id="status">Giro continuo en primera persona · Three.js</div>
    <script>
      const config = {
        speed: 0.16,
        railHeight: 0.7,
        railOffset: 2.0,
        segmentCount: 320,
        trackRadius: 1.8,
        loopScale: 38
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020714);
      scene.fog = new THREE.Fog(0x020714, 20, 220);

      const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 500);
      camera.fov = 72;
      camera.position.set(0, 2.1, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.AmbientLight(0xa8c5ff, 0.35);
      scene.add(light);

      const sun = new THREE.DirectionalLight(0xc2e7ff, 1.25);
      sun.position.set(22, 34, 12);
      sun.castShadow = false;
      scene.add(sun);

      scene.add(new THREE.AmbientLight(0x2a2f40, 0.22));

      const floorGeo = new THREE.PlaneGeometry(260, 520, 48, 64);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x0b1326,
        roughness: 0.88,
        metalness: 0.05,
        emissive: new THREE.Color(0x05070f)
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -3.6;
      scene.add(floor);

      function buildTrackPoints() {
        const points = [];
        for (let i = 0; i <= config.segmentCount; i++) {
          const t = (i / config.segmentCount) * Math.PI * 8;
          const loop = t % (Math.PI * 2);
          const amp = 6 + 1.8 * Math.sin(t * 0.5);
          const x = Math.cos(loop) * amp;
          const z = Math.sin(loop) * amp + Math.sin(t * 0.3) * 16;
          const y = 3.6 + Math.sin(t * 1.3) * 3.5 + Math.sin(t * 0.18) * 1.4 + Math.sin(loop * 2.9) * 1.9;
          points.push(new THREE.Vector3(x, y, z));
        }
        const final = points[points.length - 1].clone();
        points.push(points[0].clone().add(new THREE.Vector3(0, 0, config.loopScale / 14)));
        return points;
      }

      const basePoints = buildTrackPoints();
      const trackCurve = new THREE.CatmullRomCurve3(basePoints, true, 'centripetal', 0.55);

      const frenet = trackCurve.computeFrenetFrames(900, true);
      const railPoints = (offset) => {
        const pts = [];
        for (let i = 0; i <= 900; i++) {
          const t = i / 900;
          const p = trackCurve.getPointAt(t);
          const normal = frenet.normals[i].clone().multiplyScalar(offset);
          pts.push(p.clone().add(normal));
        }
        return new THREE.CatmullRomCurve3(pts, false);
      };

      const rail1Geo = new THREE.TubeGeometry(railPoints(config.railOffset), 900, 0.13, 10, false);
      const rail2Geo = new THREE.TubeGeometry(railPoints(-config.railOffset), 900, 0.13, 10, false);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xddd2b2, metalness: 0.5, roughness: 0.35 });
      scene.add(new THREE.Mesh(rail1Geo, railMat));
      scene.add(new THREE.Mesh(rail2Geo, railMat));

      const centerGeo = new THREE.TubeGeometry(trackCurve, 900, 0.06, 12, true);
      const centerMat = new THREE.MeshStandardMaterial({ color: 0x95a8ff, roughness: 0.55, metalness: 0.25 });
      scene.add(new THREE.Mesh(centerGeo, centerMat));

      const supportGeo = new THREE.CylinderGeometry(0.25, 0.25, 4, 12, 1);
      const supportMat = new THREE.MeshStandardMaterial({ color: 0x5e6f7f, roughness: 0.72 });

      for (let i = 0; i < 40; i++) {
        const p = trackCurve.getPointAt(i / 40);
        const support = new THREE.Mesh(supportGeo, supportMat);
        support.position.set(p.x, -1.4, p.z);
        support.rotation.z = Math.PI / 2 + Math.sin(i);
        support.scale.set(1, Math.abs(p.y + 3.6) / 4, 1);
        support.position.y = p.y * 0.5;
        scene.add(support);
      }

      const stars = new THREE.BufferGeometry();
      const count = 900;
      const starPositions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        starPositions[i * 3 + 0] = (Math.random() - 0.5) * 300;
        starPositions[i * 3 + 1] = Math.random() * 120 + 15;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 300;
      }
      stars.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xe5f1ff, size: 0.9, transparent: true, opacity: 0.85 });
      const starField = new THREE.Points(stars, starMat);
      scene.add(starField);

      const cockpit = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.5, 0.7, 20, 1),
        new THREE.MeshStandardMaterial({ color: 0x13253f, emissive: 0x081624, roughness: 0.6, metalness: 0.95 })
      );
      scene.add(cockpit);

      const clock = new THREE.Clock();
      let cursor = 0;

      function resize() {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      }
      addEventListener('resize', resize);

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        cursor = (cursor + delta * config.speed) % 1;

        const pos = trackCurve.getPointAt(cursor);
        const ahead = trackCurve.getPointAt((cursor + 0.02) % 1);
        camera.position.copy(pos).add(new THREE.Vector3(0, config.railHeight, 0));
        camera.lookAt(ahead);
        camera.position.y += 0.45;
        cockpit.position.copy(pos).add(new THREE.Vector3(0, config.railHeight - 0.15, 0));

        const t = cursor * Math.PI * 2 + performance.now() * 0.00005;
        starField.rotation.y = Math.sin(t) * 0.1;
        starField.rotation.z = Math.cos(t) * 0.06;

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
