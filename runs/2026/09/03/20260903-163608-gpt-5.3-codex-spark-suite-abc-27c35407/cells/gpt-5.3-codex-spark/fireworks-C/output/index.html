<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireworks Display</title>
  <style>
    :root {
      --bg-top: #02040e;
      --bg-mid: #071029;
      --bg-bottom: #140b23;
      --panel: rgba(6, 12, 28, 0.46);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 80%, #0b1b43 0%, var(--bg-bottom) 58%, var(--bg-top) 100%);
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: #f5f7ff;
    }

    #sky {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      transform: translateZ(0);
      background:
        radial-gradient(circle at 20% 12%, rgba(122, 185, 255, 0.08), transparent 42%),
        radial-gradient(circle at 80% 22%, rgba(255, 190, 255, 0.07), transparent 38%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 60%, var(--bg-bottom));
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(163, 210, 255, 0.3);
      border-radius: 14px;
      padding: 10px 16px 12px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 30px rgba(0, 14, 38, 0.55);
      pointer-events: none;
      letter-spacing: 0.04em;
    }

    #hud h1 {
      margin: 0;
      font-size: clamp(14px, 2.3vw, 18px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    #hud p {
      margin: 6px 0 0;
      font-size: 12px;
      opacity: 0.84;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div id="hud">
    <h1>Nocturnal Firework Garden</h1>
    <p>Layered fountains • cascading bloom • soft lens glow</p>
  </div>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    function resizeCanvas() {
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const rockets = [];
    const particles = [];
    const palette = [
      '#ffe6c7', '#ffa9a3', '#ffdb65', '#a7ecff', '#ffc6ea', '#9ef0b8', '#b7a2ff', '#fca1ff'
    ];

    function hexToRgba(hex, alpha) {
      const clean = hex.replace('#', '');
      const full = clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean;
      const r = parseInt(full.slice(0, 2), 16);
      const g = parseInt(full.slice(2, 4), 16);
      const b = parseInt(full.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
    }

    class Rocket {
      constructor() {
        this.x = Math.random() * innerWidth;
        this.y = innerHeight + Math.random() * 120;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = - (12 + Math.random() * 5);
        this.explodeHeight = innerHeight * (0.15 + Math.random() * 0.45);
        this.life = 0;
        this.maxLife = 150 + Math.random() * 90;
        this.trail = [];
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.size = 2.7;
      }
      update() {
        this.life++;
        this.vy += 0.04 * dpr;
        this.vx *= 0.996;
        this.x += this.vx;
        this.y += this.vy;
        this.trail.push({ x: this.x, y: this.y, a: 0.9 });
        if (this.trail.length > 12) this.trail.shift();
        this.trail.forEach((t) => (t.a *= 0.76));
        if (this.y <= this.explodeHeight || this.life >= this.maxLife) {
          this.explode();
          return true;
        }
        return false;
      }
      draw() {
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const alpha = t.a * (i / this.trail.length);
          ctx.beginPath();
          ctx.fillStyle = hexToRgba(this.color, alpha * 0.4);
          ctx.arc(t.x, t.y, this.size * (i / this.trail.length + 0.3), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      explode() {
        const spread = 55 + Math.random() * 60;
        const count = 170 + Math.floor(Math.random() * 130);
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + Math.random() * 0.2;
          const speed = Math.random() * spread / 120;
          particles.push(new Particle(this.x, this.y, a, speed, this.color));
        }
        const ringCount = 40;
        const ringColor = '#ffffff';
        for (let i = 0; i < ringCount; i++) {
          const a = (i / ringCount) * Math.PI * 2;
          particles.push(new Particle(this.x, this.y, a, 0.8 + Math.random() * 0.3, ringColor, true));
        }
      }
    }

    class Particle {
      constructor(x, y, angle, speed, color, ring = false) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * (speed * 4.8 + (Math.random() * 0.4 - 0.2));
        this.vy = Math.sin(angle) * (speed * 4.8 + (Math.random() * 0.4 - 0.2));
        this.alpha = 1;
        this.fade = ring ? (0.015 + Math.random() * 0.012) : (0.012 + Math.random() * 0.008);
        this.color = color;
        this.radius = ring ? 1.8 : (2 + Math.random() * 2);
        this.gravity = 0.022 + Math.random() * 0.014;
        this.glow = 16 + Math.random() * 35;
        this.twinkle = ring ? 0.12 : 0.04;
      }
      update() {
        this.vy += this.gravity;
        this.vx *= 0.995;
        this.vy *= 0.993;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.fade;
        this.radius *= 0.995;
        return this.alpha <= 0 || this.radius < 0.15;
      }
      draw() {
        const pulse = Math.sin(performance.now() / 120 + this.x * 0.02) * this.twinkle;
        const glow = Math.max(1, this.glow * (0.35 + this.alpha) + pulse);
        ctx.beginPath();
        ctx.fillStyle = `${this.color}`;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = glow;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.arc(this.x, this.y, Math.max(0.5, this.radius), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    let nextLaunch = 0;
    function spawnRocket(force = false) {
      if (rockets.length < 12 && (force || performance.now() > nextLaunch)) {
        rockets.push(new Rocket());
        const base = 560;
        const jitter = 280;
        nextLaunch = performance.now() + base + Math.random() * jitter;
      }
    }

    function softStarLayer() {
      const starCount = 130;
      for (let i = 0; i < starCount; i++) {
        const x = Math.random() * innerWidth;
        const y = Math.random() * innerHeight * 0.68;
        const r = Math.random() * 1.1;
        const a = Math.random() * 0.8;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGroundGlow() {
      const grad = ctx.createLinearGradient(0, innerHeight * 0.86, 0, innerHeight);
      grad.addColorStop(0, 'rgba(7,16,48,0.01)');
      grad.addColorStop(1, 'rgba(18, 31, 72, 0.42)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, innerHeight * 0.86, innerWidth, innerHeight * 0.15);
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      drawGroundGlow();
      softStarLayer();

      spawnRocket();
      if (Math.random() < 0.002) spawnRocket(true);

      rockets.forEach((r, idx) => {
        if (r.update()) rockets.splice(idx, 1);
        else r.draw();
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.update()) {
          particles.splice(i, 1);
        } else {
          p.draw();
        }
      }
    }

    for (let i = 0; i < 3; i++) spawnRocket(true);
    animate();
  </script>
</body>
</html>
