<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Serpent — First-Person Coaster</title>
<style>
  :root{--fg:#ffe9d2;--dim:rgba(255,233,210,.6);--acc:#ff8a4c}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#0b0710;overflow:hidden;color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c.drag{cursor:grabbing}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%);opacity:.3;transition:opacity .15s}
  #hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
  #hud.off{opacity:0}
  #sec{position:absolute;top:9vh;left:0;right:0;text-align:center;font-size:clamp(22px,4vw,44px);font-weight:600;letter-spacing:.32em;text-transform:uppercase;text-shadow:0 2px 24px rgba(0,0,0,.6);opacity:0}
  #sec.show{animation:sec 3.6s ease-out}
  @keyframes sec{0%{opacity:0;transform:translateY(10px);letter-spacing:.5em}15%{opacity:1;transform:none;letter-spacing:.32em}75%{opacity:1}100%{opacity:0}}
  #gauge{position:absolute;left:max(16px,3vw);bottom:max(16px,3vh);text-shadow:0 1px 12px rgba(0,0,0,.6)}
  #gauge .big{font-size:clamp(40px,7vw,76px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
  #gauge .big small{font-size:.28em;letter-spacing:.2em;margin-left:.6em;color:var(--dim)}
  #gauge .row{display:flex;gap:1.6em;margin-top:.5em;font-size:13px;letter-spacing:.18em;color:var(--dim);font-variant-numeric:tabular-nums}
  #gauge .row b{color:var(--fg);font-weight:600;letter-spacing:.05em}
  #mapw{position:absolute;right:max(16px,3vw);bottom:max(16px,3vh);text-align:right}
  #map{width:min(240px,42vw);height:auto;display:block;opacity:.9}
  #lap{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-top:6px}
  #snd{position:fixed;top:max(14px,2vh);right:max(14px,2vw);pointer-events:auto;background:rgba(20,10,20,.45);color:var(--fg);border:1px solid rgba(255,233,210,.3);border-radius:99px;padding:8px 16px;font:600 12px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
  #snd:hover,#snd:focus-visible{border-color:var(--acc);outline:none}
  #snd.pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,138,76,.0);border-color:var(--acc)}0%{box-shadow:0 0 0 0 rgba(255,138,76,.5)}}
  #hint{position:absolute;bottom:max(10px,1.5vh);left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  @media (max-width:640px){#hint{display:none}}
  #intro{position:fixed;inset:0;background:#0b0710;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 2.6s ease 1.8s}
  #intro.gone{opacity:0}
  #intro h1{font-weight:200;letter-spacing:.5em;font-size:clamp(26px,6vw,68px);padding-left:.5em;text-align:center}
  #intro p{margin-top:1.2em;letter-spacing:.4em;font-size:12px;color:var(--dim);text-transform:uppercase}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b0710}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud">
  <div id="sec"></div>
  <div id="gauge">
    <div class="big"><span id="spd">0</span><small>KM/H</small></div>
    <div class="row"><span>HEIGHT <b id="alt">0</b> M</span><span>G-FORCE <b id="gf">1.0</b></span></div>
  </div>
  <div id="mapw"><canvas id="map" width="480" height="180"></canvas><div id="lap">LAP 1</div></div>
  <div id="hint">Drag to look around · M sound · Space pause · H hide HUD</div>
</div>
<button id="snd" class="pulse" aria-pressed="false">Sound off</button>
<div id="intro"><h1>SUNSET SERPENT</h1><p>Keep your hands inside the car</p></div>
<div id="err">This experience needs WebGL and internet access to load Three.js.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').style.display='flex';return;}
const V3=THREE.Vector3;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const params=new URLSearchParams(location.search);

/* ------------------------------------------------------------------ renderer */
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});}
catch(e){$('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const FOG=new THREE.Color(0.75,0.42,0.3);
renderer.setClearColor(FOG);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(FOG,0.0016);
const camera=new THREE.PerspectiveCamera(70,1,0.08,4000);
scene.add(camera);

/* ------------------------------------------------------------------ noise */
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function fbm(x,y){let a=.5,s=0;for(let i=0;i<5;i++){s+=a*vnoise(x,y);x=x*2.03+17;y=y*2.03+9;a*=.5;}return s;}

/* ------------------------------------------------------------------ track layout */
const cp=[];
const add=(x,y,z,tag)=>cp.push({p:new V3(x,y,z),tag});
add(0,2,0,'Station');
add(20,2,0);
add(40,3,0,'Lift Hill');
add(65,11,0);add(90,26,0);add(112,43,0);add(130,57,0);
add(146,65,0,'crest');
add(160,65.5,0,'First Drop');
add(170,58,-2);add(178,42,-7);add(186,24,-16);add(194,9,-25);add(203,4.5,-29);add(214,3,-30);
{ // vertical loop, slightly helical so entry and exit clear each other
  const R=20,K=10,DZ=10,X0=225,Y0=3,Z0=-30,LN=22;
  for(let k=0;k<=LN;k++){const th=k/LN*Math.PI*2;
    add(X0+R*Math.sin(th)+K*th,Y0+R*(1-Math.cos(th)),Z0+DZ*th/(2*Math.PI),k===0?'The Serpent Loop':k===LN?'Airtime Hill':undefined);}
}
add(310,5,-20);add(335,16,-20);add(355,21,-20);add(370,15,-20);
add(385,10,-20,'Banked Turn');add(412.6,9,-8.6);add(424,8,19);add(412.6,8,46.6);
add(385,9,58,'Camelbacks');
add(350,12,58);add(310,22,58);add(270,12,58);add(230,22,58);add(190,12,58);
add(150,8,58);add(105,10,58);add(60,8,58);add(25,8,58);
add(0,8,58,'Homeward Helix');
add(-20.5,7,49.5);add(-29,5,29);add(-20.5,3,8.5);

const curve=new THREE.CatmullRomCurve3(cp.map(c=>c.p),true,'centripetal');
curve.arcLengthDivisions=8000;
const N=2600;
const P=curve.getSpacedPoints(N);P.pop();
let L=0;for(let i=0;i<N;i++)L+=P[i].distanceTo(P[(i+1)%N]);
const ds=L/N;
const anchors={};
cp.forEach(c=>{if(!c.tag)return;let best=0,bd=1e9;for(let i=0;i<N;i++){const d=P[i].distanceToSquared(c.p);if(d<bd){bd=d;best=i;}}anchors[c.tag]=best;});
const SECTIONS=['Station','Lift Hill','First Drop','The Serpent Loop','Airtime Hill','Banked Turn','Camelbacks','Homeward Helix']
  .map(n=>({name:n,idx:anchors[n]})).sort((a,b)=>a.idx-b.idx);

/* frames: tangent, parallel-transported up, closure-corrected */
const T=[],U=[],R=[],dT=[];
for(let i=0;i<N;i++)T[i]=P[(i+1)%N].clone().sub(P[(i-1+N)%N]).normalize();
for(let i=0;i<N;i++)dT[i]=T[(i+1)%N].clone().sub(T[(i-1+N)%N]).multiplyScalar(1/(2*ds));
{
  const up=new V3(0,1,0);
  U[0]=up.clone().addScaledVector(T[0],-up.dot(T[0])).normalize();
  const q=new THREE.Quaternion();
  for(let i=1;i<N;i++){q.setFromUnitVectors(T[i-1],T[i]);U[i]=U[i-1].clone().applyQuaternion(q).normalize();}
  q.setFromUnitVectors(T[N-1],T[0]);
  const ue=U[N-1].clone().applyQuaternion(q);
  const ang=Math.atan2(ue.clone().cross(U[0]).dot(T[0]),ue.dot(U[0]));
  for(let i=0;i<N;i++){U[i].applyAxisAngle(T[i],ang*i/N);R[i]=new V3().crossVectors(T[i],U[i]);}
}

/* energy-based speed profile with a slow lift and station brake */
const G=9.8;
let maxY=0;for(const p of P)maxY=Math.max(maxY,p.y);
const V=new Float32Array(N);
{
  const H=maxY+1,GE=4.9,VMIN=5.5;
  const liftA=anchors['Lift Hill']*ds,liftB=anchors['crest']*ds;
  for(let i=0;i<N;i++){
    const s=i*ds,E=Math.sqrt(VMIN*VMIN+2*GE*(H-P[i].y));
    const wl=smooth(liftA-20,liftA+15,s)*(1-smooth(liftB-8,liftB+20,s));
    const wb=Math.max(smooth(L-120,L-40,s),1-smooth(liftA+10,liftA+40,s));
    V[i]=lerp(lerp(E,8,wb),6.5,wl);
  }
}
/* banking from lateral load, smoothed */
{
  const phi=new Float32Array(N),out=new Float32Array(N),K=24;
  for(let i=0;i<N;i++)phi[i]=Math.atan(V[i]*V[i]*dT[i].dot(R[i])/G)*.9;
  const w=[];let ws=0;for(let k=-K;k<=K;k++){const x=Math.exp(-(k*k)/(2*(K/2.2)**2));w.push(x);ws+=x;}
  for(let i=0;i<N;i++){let a=0;for(let k=-K;k<=K;k++)a+=phi[(i+k+N)%N]*w[k+K];out[i]=clamp(a/ws,-1.15,1.15);}
  for(let i=0;i<N;i++){const c=Math.cos(out[i]),s=Math.sin(out[i]);
    const u=U[i].clone().multiplyScalar(c).addScaledVector(R[i],s);
    const r=R[i].clone().multiplyScalar(c).addScaledVector(U[i],-s);
    U[i]=u;R[i]=r;}
}
const GN=new Float32Array(N),GL=new Float32Array(N);
for(let i=0;i<N;i++){const a=dT[i].clone().multiplyScalar(V[i]*V[i]);GN[i]=(a.dot(U[i])+G*U[i].y)/G;GL[i]=a.dot(R[i])/G;}

const tmpP=new V3(),tmpT=new V3(),tmpU=new V3(),tmpR=new V3();
const FR={g:1,gl:0,v:0,i:0};
function frameAt(s){
  s=((s%L)+L)%L;const f=s/ds,i0=Math.floor(f)%N,i1=(i0+1)%N,t=f-Math.floor(f);
  tmpP.lerpVectors(P[i0],P[i1],t);tmpT.lerpVectors(T[i0],T[i1],t).normalize();
  tmpU.lerpVectors(U[i0],U[i1],t);tmpU.addScaledVector(tmpT,-tmpU.dot(tmpT)).normalize();
  tmpR.crossVectors(tmpT,tmpU);
  FR.v=lerp(V[i0],V[i1],t);FR.g=lerp(GN[i0],GN[i1],t);FR.gl=lerp(GL[i0],GL[i1],t);FR.i=i0;
  return FR;
}

/* ------------------------------------------------------------------ glow points shader */
function glowTexture(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.18,'rgba(255,255,255,.85)');g.addColorStop(.5,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);return t;}
const glowMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uScale:{value:500},uFog:{value:.0016},uTex:{value:glowTexture()}},
  vertexShader:`attribute vec3 aCol;attribute float aSize;varying vec3 vC;uniform float uScale;uniform float uFog;
    void main(){vec4 mv=modelViewMatrix*vec4(position,1.);float d=-mv.z;gl_PointSize=clamp(aSize*uScale/max(d,.01),1.,70.);
    float f=exp(-pow(d*uFog,2.));float n=smoothstep(2.,10.,d);vC=aCol*f*n;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D uTex;varying vec3 vC;void main(){float a=texture2D(uTex,gl_PointCoord).r;gl_FragColor=vec4(vC*a,1.);}`
});
function makeGlow(pos,col,size){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aCol',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  const p=new THREE.Points(g,glowMat);p.frustumCulled=false;return p;
}

/* ------------------------------------------------------------------ sky */
const sky=new THREE.Mesh(new THREE.SphereGeometry(1800,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{uTime:{value:0}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vD;uniform float uTime;
    float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
    float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+7.;a*=.5;}return s;}
    void main(){
      vec3 d=normalize(vD);float h=d.y;
      vec3 hor=vec3(.75,.42,.3),mid=vec3(.36,.22,.42),zen=vec3(.04,.06,.2);
      vec3 col=mix(hor,mid,smoothstep(0.,.22,h));col=mix(col,zen,smoothstep(.12,.75,h));
      vec3 S=normalize(vec3(.55,.05,-.83));float sd=max(dot(d,S),0.);
      col+=vec3(1.,.5,.2)*pow(sd,6.)*.55+vec3(1.,.72,.4)*pow(sd,60.)*.8+vec3(1.,.9,.7)*pow(sd,900.)*3.;
      col=mix(col,hor*.85,smoothstep(0.,-.12,h));
      float st=step(.9965,h21(floor(d.xz/(abs(d.y)+.25)*140.)))*smoothstep(.22,.55,h);
      col+=vec3(.9,.9,1.)*st*.8;
      vec2 cp=d.xz/(h+.12)*1.4+vec2(uTime*.004,0.);
      float c=smoothstep(.48,.85,fb(cp))*smoothstep(.015,.14,h);
      vec3 cc=mix(vec3(1.,.42,.28),vec3(.22,.16,.34),smoothstep(0.,.45,h));cc+=vec3(.6,.3,.1)*pow(sd,3.)*.7;
      col=mix(col,cc,c*.75);
      gl_FragColor=vec4(col,1.);
    }`
}));
sky.renderOrder=-10;scene.add(sky);

/* lights */
scene.add(new THREE.HemisphereLight(new THREE.Color(.5,.5,.85),new THREE.Color(.3,.18,.14),1.0));
const sun=new THREE.DirectionalLight(new THREE.Color(1,.62,.36),1.5);
sun.position.set(.55,.12,-.83).multiplyScalar(500);scene.add(sun);
scene.add(new THREE.AmbientLight(0x554466,.35));

/* ------------------------------------------------------------------ terrain */
const coarse=[];for(let i=0;i<N;i+=8)coarse.push(P[i]);
function distTrack(x,z){let m=1e9;for(let k=0;k<coarse.length;k++){const dx=coarse[k].x-x,dz=coarse[k].z-z,d=dx*dx+dz*dz;if(d<m)m=d;}return Math.sqrt(m);}
function groundH(x,z,d){if(d===undefined)d=distTrack(x,z);const f=smooth(30,170,d);return f*(fbm(x*.0035+3,z*.0035+7)*110-30);}
{
  const CX=200,CZ=15,SZ=2600,SG=260;
  const g=new THREE.PlaneGeometry(SZ,SZ,SG,SG);g.rotateX(-Math.PI/2);
  const pos=g.attributes.position,col=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i)+CX,z=pos.getZ(i)+CZ,h=groundH(x,z);pos.setY(i,h);
    const n=vnoise(x*.06,z*.06)*.5+vnoise(x*.4,z*.4)*.5,k=.75+.5*n;
    let r=.15*k,gg=.26*k,b=.09*k;
    if(h<-.9){const t=smooth(-.9,-4,h);r=lerp(r,.34,t);gg=lerp(gg,.28,t);b=lerp(b,.2,t);}
    if(h>38){const t=smooth(38,60,h);r=lerp(r,.32,t);gg=lerp(gg,.28,t);b=lerp(b,.28,t);}
    if(h>70){const t=smooth(70,92,h);r=lerp(r,.8,t);gg=lerp(gg,.72,t);b=lerp(b,.78,t);}
    col[i*3]=r;col[i*3+1]=gg;col[i*3+2]=b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));m.position.set(CX,0,CZ);scene.add(m);
  const w=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000).rotateX(-Math.PI/2),
    new THREE.MeshPhongMaterial({color:new THREE.Color(.12,.17,.3),specular:new THREE.Color(1,.6,.35),shininess:120,transparent:true,opacity:.93}));
  w.position.set(CX,-4,CZ);scene.add(w);
}
/* trees */
{
  const cone=new THREE.ConeGeometry(2.4,9,7).translate(0,6.5,0),trunk=new THREE.CylinderGeometry(.35,.5,3,5).translate(0,1.5,0);
  const cnt=2200,tc=new THREE.InstancedMesh(cone,new THREE.MeshLambertMaterial({color:0xffffff}),cnt),tt=new THREE.InstancedMesh(trunk,new THREE.MeshLambertMaterial({color:0x3a2a22}),cnt);
  const o=new THREE.Object3D(),c=new THREE.Color();let n=0,tries=0;
  while(n<cnt&&tries<9000){tries++;
    const x=-200+Math.random()*840,z=-260+Math.random()*560,d=distTrack(x,z);
    if(d<16)continue;
    if(x>60&&x<190&&z>85&&z<155)continue; // ferris wheel plaza
    if(x>20&&x<130&&z<-28&&z>-85)continue; // midway
    const h=groundH(x,z,d);if(h<-1.5||h>50)continue;
    const s=.8+Math.random()*1.1;o.position.set(x,h-.3,z);o.rotation.set(0,Math.random()*6,0);o.scale.set(s,s*(.9+Math.random()*.5),s);o.updateMatrix();
    tc.setMatrixAt(n,o.matrix);tt.setMatrixAt(n,o.matrix);
    c.setRGB(.05+Math.random()*.05,.13+Math.random()*.1,.06+Math.random()*.04);tc.setColorAt(n,c);n++;}
  tc.count=tt.count=n;tc.instanceColor.needsUpdate=true;scene.add(tc,tt);
}

/* ------------------------------------------------------------------ track geometry */
const railMat=new THREE.MeshPhongMaterial({color:0xe2472c,specular:0xffc9a0,shininess:60});
const steelMat=new THREE.MeshPhongMaterial({color:0x2c303c,specular:0x665544,shininess:20});
const suppMat=new THREE.MeshLambertMaterial({color:0x9ea6b6});
function sweep(offset,radius,seg,step,mat){
  const rings=N/step,vc=(rings+1)*(seg+1),pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),idx=[];
  const c=new V3(),nv=new V3();
  for(let j=0;j<=rings;j++){const i=(j*step)%N;offset(i,c);
    for(let m=0;m<=seg;m++){const a=m/seg*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);
      nv.set(0,0,0).addScaledVector(R[i],ca).addScaledVector(U[i],sa);
      const k=(j*(seg+1)+m)*3;pos[k]=c.x+nv.x*radius;pos[k+1]=c.y+nv.y*radius;pos[k+2]=c.z+nv.z*radius;nor[k]=nv.x;nor[k+1]=nv.y;nor[k+2]=nv.z;}}
  for(let j=0;j<rings;j++)for(let m=0;m<seg;m++){const a=j*(seg+1)+m,b=a+seg+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,mat);m.frustumCulled=false;scene.add(m);
}
sweep((i,c)=>c.copy(P[i]).addScaledVector(R[i],.65),.09,6,1,railMat);
sweep((i,c)=>c.copy(P[i]).addScaledVector(R[i],-.65),.09,6,1,railMat);
sweep((i,c)=>c.copy(P[i]).addScaledVector(U[i],-.45),.2,8,2,steelMat);
{ // ties and posts
  const step=4,cnt=N/step,tie=new THREE.InstancedMesh(new THREE.BoxGeometry(1.7,.07,.16),steelMat,cnt),post=new THREE.InstancedMesh(new THREE.BoxGeometry(.07,.45,.07),steelMat,cnt);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new V3(),sc=new V3(1,1,1);
  for(let j=0;j<cnt;j++){const i=j*step;m.makeBasis(R[i],U[i],T[i]);q.setFromRotationMatrix(m);
    p.copy(P[i]).addScaledVector(U[i],-.03);tie.setMatrixAt(j,new THREE.Matrix4().compose(p,q,sc));

  // HUD (10Hz)
  hudT+=dt;if(hudT>.1){hudT=0;
    spd.textContent=Math.round(v*3.6);alt.textContent=Math.max(0,Math.round(tmpP.y-2));
    gfEl.textContent=clamp(gSm,-9,9).toFixed(1);drawMap(tmpP);}
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
