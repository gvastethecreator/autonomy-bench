<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Iron Raven — First-Person Coaster</title>
  <style>
    :root {
      color-scheme: dark;
      --amber: #ffb238;
      --cream: #fff2d1;
      --ink: #071015;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071015;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      color: var(--cream);
      text-transform: uppercase;
    }

    .brand {
      position: absolute;
      top: max(22px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: .15em;
      font-size: 11px;
      font-weight: 750;
      text-shadow: 0 2px 16px rgba(0,0,0,.45);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255,178,56,.75);
      transform: rotate(45deg);
      display: grid;
      place-items: center;
      background: rgba(7,16,21,.25);
      box-shadow: 0 0 22px rgba(255,178,56,.18);
    }

    .brand-mark::after {
      content: "";
      width: 9px;
      height: 9px;
      border: 2px solid var(--amber);
    }

    .brand-copy { line-height: 1.25; }
    .brand-copy strong { display: block; font-size: 12px; }
    .brand-copy span { opacity: .55; font-size: 8px; letter-spacing: .26em; }

    .telemetry {
      position: absolute;
      top: max(26px, env(safe-area-inset-top));
      right: max(26px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 14px;
      align-items: end;
      text-align: right;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 18px rgba(0,0,0,.5);
    }

    #speed {
      grid-row: span 2;
      font-size: clamp(36px, 5vw, 66px);
      font-weight: 250;
      line-height: .8;
      letter-spacing: -.06em;
    }

    .unit {
      color: var(--amber);
      letter-spacing: .22em;
      font-size: 9px;
      font-weight: 800;
    }

    #altitude {
      margin-top: 5px;
      letter-spacing: .16em;
      font-size: 9px;
      opacity: .62;
    }

    .status {
      position: absolute;
      left: max(25px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .16em;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 14px var(--amber);
      animation: blink 1.8s ease-in-out infinite;
    }

    #hint {
      position: absolute;
      right: max(25px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      font-size: 8px;
      letter-spacing: .17em;
      opacity: .45;
    }

    #ride-progress {
      position: absolute;
      left: 50%;
      bottom: max(26px, env(safe-area-inset-bottom));
      width: min(26vw, 310px);
      height: 2px;
      transform: translateX(-50%);
      background: rgba(255,255,255,.18);
      overflow: hidden;
    }

    #ride-progress::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: var(--progress, 0%);
      height: 100%;
      background: var(--amber);
      box-shadow: 0 0 12px var(--amber);
    }

    #intro {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      background: radial-gradient(circle at center, transparent 20%, rgba(2,8,12,.34) 100%);
      animation: introOut 5.2s 1.2s ease forwards;
    }

    #intro .eyebrow {
      color: var(--amber);
      letter-spacing: .48em;
      font-size: 9px;
      font-weight: 850;
      margin-bottom: 12px;
    }

    #intro h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 10vw, 132px);
      font-weight: 500;
      line-height: .78;
      letter-spacing: -.075em;
      text-shadow: 0 5px 35px rgba(0,0,0,.38);
    }

    #intro .sub {
      margin-top: 18px;
      letter-spacing: .28em;
      font-size: 9px;
      opacity: .72;
    }

    #pause-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(3,8,12,.22);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity .25s ease;
    }

    #pause-card.visible { opacity: 1; }
    #pause-card span {
      border: 1px solid rgba(255,255,255,.35);
      padding: 13px 18px;
      font-size: 9px;
      letter-spacing: .28em;
      background: rgba(5,12,17,.56);
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 130px 25px rgba(0,4,8,.45);
      background: linear-gradient(to bottom, rgba(4,9,12,.18), transparent 24%, transparent 74%, rgba(4,9,12,.32));
    }

    .speed-lines {
      position: fixed;
      inset: -20%;
      z-index: 1;
      pointer-events: none;
      opacity: var(--rush, .08);
      background:
        repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 5deg, rgba(255,242,209,.18) 5.05deg 5.12deg, transparent 5.18deg 10deg);
      mask-image: radial-gradient(circle, transparent 0 28%, #000 72%, transparent 95%);
      animation: rush .32s linear infinite;
    }

    @keyframes blink { 50% { opacity: .35; } }
    @keyframes rush { to { transform: scale(1.05) rotate(.25deg); } }
    @keyframes introOut {
      0%, 55% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    @media (max-width: 640px) {
      .brand-copy span, #hint { display: none; }
      #ride-progress { width: 34vw; }
      .telemetry { top: 28px; }
    }
  </style>
</head>
<body>
  <div class="speed-lines"></div>
  <div class="vignette"></div>

  <div id="hud">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-copy"><strong>Iron Raven</strong><span>Mountain circuit 01</span></div>
    </div>

    <div class="telemetry">
      <div id="speed">000</div>
      <div class="unit">km/h</div>
      <div id="altitude">ALT 000 M</div>
    </div>

    <div class="status"><span class="live-dot"></span><span id="ride-state">Auto ride active</span></div>
    <div id="ride-progress"></div>
    <div id="hint">Space pause · R restart</div>

    <div id="intro">
      <div class="eyebrow">Front row experience</div>
      <h1>Iron<br>Raven</h1>
      <div class="sub">The mountain never lets go</div>
    </div>

    <div id="pause-card"><span>Ride paused</span></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js';

    // Core scene — r185 WebGLRenderer / PerspectiveCamera pattern.
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x83a9bc);
    scene.fog = new THREE.FogExp2(0x7898a2, 0.0041);

    const camera = new THREE.PerspectiveCamera(76, innerWidth / innerHeight, 0.06, 620);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute('aria-label', 'Continuous first-person rollercoaster ride');
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xc9e6ef, 0x30402d, 1.85);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe3b3, 3.25);
    sun.position.set(-110, 170, 75);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -150;
    sun.shadow.camera.right = 150;
    sun.shadow.camera.top = 150;
    sun.shadow.camera.bottom = -150;
    sun.shadow.camera.near = 30;
    sun.shadow.camera.far = 400;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    // Sky dome with a low golden horizon and cool upper atmosphere.
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(480, 32, 18),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x386981) },
          horizonColor: { value: new THREE.Color(0xe7b779) },
          groundColor: { value: new THREE.Color(0x718a83) }
        },
        vertexShader: `varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
        fragmentShader: `
          uniform vec3 topColor; uniform vec3 horizonColor; uniform vec3 groundColor; varying vec3 vWorld;
          void main(){
            float h = normalize(vWorld).y;
            vec3 low = mix(groundColor, horizonColor, smoothstep(-0.18, 0.08, h));
            vec3 col = mix(low, topColor, smoothstep(0.02, 0.78, h));
            gl_FragColor = vec4(col, 1.0);
          }`
      })
    );
    scene.add(sky);

    // Closed centerline: station, lift hill, crest, long drop, and two sweeping returns.
    const controlPoints = [
      [0, 9, 75], [35, 11, 70], [68, 23, 45], [90, 63, 5],
      [72, 100, -38], [30, 96, -75], [-18, 55, -92], [-66, 14, -72],
      [-93, 10, -30], [-87, 18, 25], [-60, 38, 68], [-15, 58, 93],
      [35, 43, 82], [74, 20, 55], [92, 13, 12], [78, 28, -38],
      [44, 49, -68], [4, 31, -62], [-20, 16, -30], [-30, 11, 12], [-18, 9, 48]
    ].map(([x, y, z]) => new THREE.Vector3(x, y, z));

    const track = new THREE.CatmullRomCurve3(controlPoints, true, 'centripetal', 0.42);
    const trackLength = track.getLength();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function trackFrame(t) {
      const point = track.getPointAt(THREE.MathUtils.euclideanModulo(t, 1));
      const tangent = track.getTangentAt(THREE.MathUtils.euclideanModulo(t, 1)).normalize();
      let right = new THREE.Vector3().crossVectors(tangent, worldUp);
      if (right.lengthSq() < 0.001) right.set(1, 0, 0);
      right.normalize();
      const up = new THREE.Vector3().crossVectors(right, tangent).normalize();
      return { point, tangent, right, up };
    }

    class RailCurve extends THREE.Curve {
      constructor(offset) { super(); this.offset = offset; }
      getPoint(t, target = new THREE.Vector3()) {
        const f = trackFrame(t);
        return target.copy(f.point).addScaledVector(f.right, this.offset);
      }
    }

    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0xf59b23,
      metalness: 0.72,
      roughness: 0.3,
      emissive: 0x2d1200,
      emissiveIntensity: 0.3
    });
    const spineMaterial = new THREE.MeshStandardMaterial({ color: 0x172229, metalness: 0.68, roughness: 0.42 });
    const tieMaterial = new THREE.MeshStandardMaterial({ color: 0x29363b, metalness: 0.62, roughness: 0.45 });

    for (const offset of [-1.12, 1.12]) {
      const rail = new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(offset), 900, 0.22, 7, true), railMaterial);
      rail.castShadow = true;
      rail.receiveShadow = true;
      scene.add(rail);
    }

    const centerSpine = new THREE.Mesh(new THREE.TubeGeometry(track, 900, 0.31, 7, true), spineMaterial);
    centerSpine.castShadow = true;
    centerSpine.receiveShadow = true;
    scene.add(centerSpine);

    // Cross ties follow the tangent frame and make speed legible from the front row.
    const tieGeometry = new THREE.BoxGeometry(3.25, 0.16, 0.48);
    const tieCount = 230;
    const ties = new THREE.InstancedMesh(tieGeometry, tieMaterial, tieCount);
    ties.castShadow = true;
    ties.receiveShadow = true;
    const dummy = new THREE.Object3D();
    for (let i = 0; i < tieCount; i++) {
      const f = trackFrame(i / tieCount);
      const basis = new THREE.Matrix4().makeBasis(f.right, f.up, f.tangent);
      dummy.position.copy(f.point).addScaledVector(f.up, -0.12);
      dummy.quaternion.setFromRotationMatrix(basis);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      ties.setMatrixAt(i, dummy.matrix);
    }
    scene.add(ties);

    function groundHeight(x, z) {
      return -1.8 + Math.sin(x * 0.027) * 2.2 + Math.cos(z * 0.022) * 2.5 + Math.sin((x + z) * 0.014) * 1.7;
    }

    const terrainGeometry = new THREE.PlaneGeometry(600, 600, 120, 120);
    terrainGeometry.rotateX(-Math.PI / 2);
    const terrainPos = terrainGeometry.attributes.position;
    const terrainColors = [];
    const lowGreen = new THREE.Color(0x344e39);
    const highGreen = new THREE.Color(0x637052);
    for (let i = 0; i < terrainPos.count; i++) {
      const x = terrainPos.getX(i);
      const z = terrainPos.getZ(i);
      const y = groundHeight(x, z);
      terrainPos.setY(i, y);
      const mix = THREE.MathUtils.clamp((y + 7) / 14, 0, 1);
      const c = lowGreen.clone().lerp(highGreen, mix);
      terrainColors.push(c.r, c.g, c.b);
    }
    terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(terrainColors, 3));
    terrainGeometry.computeVertexNormals();
    const terrain = new THREE.Mesh(terrainGeometry, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.96,
      metalness: 0
    }));
    terrain.receiveShadow = true;
    scene.add(terrain);

    // Steel columns, with wider A-frame feet for the signature tall sections.
    const supportMat = new THREE.MeshStandardMaterial({ color: 0x15272c, metalness: 0.52, roughness: 0.5 });
    const supportGeometry = new THREE.CylinderGeometry(0.24, 0.4, 1, 7);
    const supportSamples = [];
    for (let i = 0; i < 55; i++) {
      const t = i / 55;
      const f = trackFrame(t);
      const floor = groundHeight(f.point.x, f.point.z) + 0.1;
      if (f.point.y - floor > 5.5) supportSamples.push({ f, floor });
    }
    const supports = new THREE.InstancedMesh(supportGeometry, supportMat, supportSamples.length * 2);
    supports.castShadow = true;
    supports.receiveShadow = true;
    let supportIndex = 0;
    for (const { f, floor } of supportSamples) {
      const height = f.point.y - floor - 0.35;
      for (const side of [-1, 1]) {
        dummy.position.copy(f.point).addScaledVector(f.right, side * 1.05);
        dummy.position.y = floor + height * 0.5;
        dummy.quaternion.identity();
        dummy.scale.set(1, height, 1);
        dummy.updateMatrix();
        supports.setMatrixAt(supportIndex++, dummy.matrix);
      }
    }
    scene.add(supports);

    // Deterministic forest, kept clear of the track's horizontal footprint.
    function randomFactory(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let n = Math.imul(seed ^ seed >>> 15, 1 | seed);
        n = n + Math.imul(n ^ n >>> 7, 61 | n) ^ n;
        return ((n ^ n >>> 14) >>> 0) / 4294967296;
      };
    }
    const random = randomFactory(58023);
    const trackFootprint = Array.from({ length: 150 }, (_, i) => track.getPointAt(i / 150));
    const treesData = [];
    let attempts = 0;
    while (treesData.length < 330 && attempts++ < 2000) {
      const x = (random() - 0.5) * 500;
      const z = (random() - 0.5) * 500;
      const tooClose = trackFootprint.some(p => (p.x - x) ** 2 + (p.z - z) ** 2 < 85);
      if (tooClose || x * x + z * z > 250 ** 2) continue;
      treesData.push({ x, z, scale: 0.7 + random() * 1.4, turn: random() * Math.PI * 2 });
    }

    const trunks = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(0.22, 0.35, 3.4, 6),
      new THREE.MeshStandardMaterial({ color: 0x4b3426, roughness: 1 }),
      treesData.length
    );
    const crowns = new THREE.InstancedMesh(
      new THREE.ConeGeometry(2.15, 7.2, 7),
      new THREE.MeshStandardMaterial({ color: 0x173d30, roughness: 0.9 }),
      treesData.length
    );
    trunks.castShadow = crowns.castShadow = true;
    trunks.receiveShadow = crowns.receiveShadow = true;
    treesData.forEach((tree, i) => {
      const y = groundHeight(tree.x, tree.z);
      dummy.position.set(tree.x, y + 1.65 * tree.scale, tree.z);
      dummy.rotation.set(0, tree.turn, 0);
      dummy.scale.set(tree.scale, tree.scale, tree.scale);
      dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);
      dummy.position.y = y + 5.1 * tree.scale;
      dummy.updateMatrix();
      crowns.setMatrixAt(i, dummy.matrix);
    });
    scene.add(trunks, crowns);

    // Low-poly mountain ring gives the high crest a large sense of scale.
    const mountainMat = new THREE.MeshStandardMaterial({ color: 0x506466, roughness: 1, flatShading: true });
    for (let i = 0; i < 20; i++) {
      const angle = i / 20 * Math.PI * 2;
      const radius = 245 + Math.sin(i * 2.47) * 24;
      const height = 45 + (i % 5) * 9;
      const mountain = new THREE.Mesh(new THREE.ConeGeometry(34 + (i % 3) * 8, height, 6), mountainMat);
      mountain.position.set(Math.cos(angle) * radius, height * 0.47 - 4, Math.sin(angle) * radius);
      mountain.rotation.y = angle + 0.4;
      mountain.receiveShadow = true;
      scene.add(mountain);
    }

    // Station architecture at the lowest part of the circuit.
    const station = new THREE.Group();
    const stationFloor = new THREE.Mesh(
      new THREE.BoxGeometry(17, 0.8, 34),
      new THREE.MeshStandardMaterial({ color: 0x2f3b3e, metalness: 0.35, roughness: 0.6 })
    );
    stationFloor.position.set(0, 6.8, 75);
    stationFloor.receiveShadow = true;
    station.add(stationFloor);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x8d2f26, metalness: 0.35, roughness: 0.48 });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(20, 0.6, 28), roofMat);
    roof.position.set(0, 15.3, 75);
    roof.rotation.z = -0.045;
    roof.castShadow = true;
    station.add(roof);
    const beamMat = new THREE.MeshStandardMaterial({ color: 0x182226, metalness: 0.45, roughness: 0.5 });
    for (const x of [-8, 8]) for (const z of [64, 86]) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.7, 8.2, 0.7), beamMat);
      beam.position.set(x, 11, z);
      beam.castShadow = true;
      station.add(beam);
    }
    scene.add(station);

    // Front-row car elements remain in the rider's peripheral vision.
    const cockpit = new THREE.Group();
    camera.add(cockpit);
    scene.add(camera);
    const shellMat = new THREE.MeshStandardMaterial({ color: 0x9d241d, metalness: 0.65, roughness: 0.24 });
    const barMat = new THREE.MeshStandardMaterial({ color: 0x11191c, metalness: 0.88, roughness: 0.2 });
    const nose = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.55, 2.3), shellMat);
    nose.position.set(0, -1.36, -1.55);
    nose.rotation.x = -0.08;
    cockpit.add(nose);
    const noseStripe = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 2.05), new THREE.MeshStandardMaterial({ color: 0xf1a62e, emissive: 0x5c2800, emissiveIntensity: 0.7 }));
    noseStripe.position.set(0, -1.055, -1.58);
    cockpit.add(noseStripe);
    const lapBar = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 2.05, 10), barMat);
    lapBar.rotation.z = Math.PI / 2;
    lapBar.position.set(0, -0.72, -0.8);
    cockpit.add(lapBar);
    for (const x of [-0.92, 0.92]) {
      const edge = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.7, 8), barMat);
      edge.rotation.x = Math.PI / 2;
      edge.position.set(x, -1.05, -1.4);
      cockpit.add(edge);
    }

    // A trailing train reinforces that this is a coaster, not a flying camera.
    const train = new THREE.Group();
    const carGeo = new THREE.BoxGeometry(2.45, 0.8, 2.7);
    const seatGeo = new THREE.BoxGeometry(2.0, 1.15, 0.42);
    for (let i = 0; i < 4; i++) {
      const car = new THREE.Group();
      const shell = new THREE.Mesh(carGeo, shellMat);
      shell.position.y = 0.18;
      shell.castShadow = true;
      const seat = new THREE.Mesh(seatGeo, barMat);
      seat.position.set(0, 0.85, 0.75);
      seat.castShadow = true;
      car.add(shell, seat);
      car.userData.offset = 0.006 + i * 0.0062;
      train.add(car);
    }
    scene.add(train);

    const speedEl = document.querySelector('#speed');
    const altitudeEl = document.querySelector('#altitude');
    const stateEl = document.querySelector('#ride-state');
    const pauseCard = document.querySelector('#pause-card');
    const progressEl = document.querySelector('#ride-progress');
    const rootStyle = document.documentElement.style;

    const clock = new THREE.Clock();
    let progress = 0.002;
    let speed = 15.5;
    let paused = false;
    let cameraReady = false;
    const targetPosition = new THREE.Vector3();
    const targetQuaternion = new THREE.Quaternion();
    const lookMatrix = new THREE.Matrix4();
    const lookTarget = new THREE.Vector3();
    const bankedUp = new THREE.Vector3();

    function placeTrainCar(car, t) {
      const f = trackFrame(t);
      const ahead = track.getTangentAt(THREE.MathUtils.euclideanModulo(t + 0.001, 1)).normalize();
      const turn = new THREE.Vector3().crossVectors(f.tangent, ahead).dot(worldUp);
      const bank = THREE.MathUtils.clamp(-turn * 22, -0.42, 0.42);
      const up = f.up.clone().applyAxisAngle(f.tangent, bank);
      const right = new THREE.Vector3().crossVectors(f.tangent, up).normalize();
      const basis = new THREE.Matrix4().makeBasis(right, up, f.tangent);
      car.position.copy(f.point).addScaledVector(up, 0.55);
      car.quaternion.setFromRotationMatrix(basis);
    }

    function updateRide(delta, elapsed) {
      const current = trackFrame(progress);
      const downhill = Math.max(0, -current.tangent.y);
      const uphill = Math.max(0, current.tangent.y);
      const desiredSpeed = THREE.MathUtils.clamp(15.5 + downhill * 44 - uphill * 6, 10.5, 39);
      speed = THREE.MathUtils.damp(speed, desiredSpeed, downhill > 0.08 ? 1.9 : 1.15, delta);
      if (!paused) progress = THREE.MathUtils.euclideanModulo(progress + (speed / trackLength) * delta, 1);

      const f = trackFrame(progress);
      const aheadT = THREE.MathUtils.euclideanModulo(progress + 0.0024, 1);
      const aheadTangent = track.getTangentAt(aheadT).normalize();
      const turn = new THREE.Vector3().crossVectors(f.tangent, aheadTangent).dot(worldUp);
      const bank = THREE.MathUtils.clamp(-turn * 19, -0.5, 0.5);
      bankedUp.copy(f.up).applyAxisAngle(f.tangent, bank);

      const vibration = THREE.MathUtils.clamp((speed - 12) / 28, 0, 1);
      const bob = Math.sin(elapsed * (9 + speed * 0.18)) * 0.012 * vibration;
      targetPosition.copy(f.point).addScaledVector(bankedUp, 1.47 + bob).addScaledVector(f.right, Math.sin(elapsed * 13) * 0.006 * vibration);
      lookTarget.copy(targetPosition).addScaledVector(f.tangent, 14).addScaledVector(bankedUp, -0.08);
      lookMatrix.lookAt(targetPosition, lookTarget, bankedUp);
      targetQuaternion.setFromRotationMatrix(lookMatrix);

      if (!cameraReady) {
        camera.position.copy(targetPosition);
        camera.quaternion.copy(targetQuaternion);
        cameraReady = true;
      } else {
        const posBlend = 1 - Math.exp(-delta * 18);
        const rotBlend = 1 - Math.exp(-delta * 13);
        camera.position.lerp(targetPosition, posBlend);
        camera.quaternion.slerp(targetQuaternion, rotBlend);
      }

      camera.fov = THREE.MathUtils.damp(camera.fov, 74 + vibration * 8, 4, delta);
      camera.updateProjectionMatrix();

      train.children.forEach(car => placeTrainCar(car, progress - car.userData.offset));

      speedEl.textContent = String(Math.round(speed * 3.6)).padStart(3, '0');
      altitudeEl.textContent = `ALT ${String(Math.max(0, Math.round(f.point.y))).padStart(3, '0')} M`;
      progressEl.style.setProperty('--progress', `${progress * 100}%`);
      rootStyle.setProperty('--rush', (0.025 + vibration * 0.12).toFixed(3));
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      updateRide(delta, elapsed);
      renderer.render(scene, camera);
    }

    addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        paused = !paused;
        stateEl.textContent = paused ? 'Ride suspended' : 'Auto ride active';
        pauseCard.classList.toggle('visible', paused);
      }
      if (event.code === 'KeyR') {
        progress = 0.002;
        speed = 15.5;
        cameraReady = false;
        paused = false;
        stateEl.textContent = 'Auto ride active';
        pauseCard.classList.remove('visible');
      }
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
