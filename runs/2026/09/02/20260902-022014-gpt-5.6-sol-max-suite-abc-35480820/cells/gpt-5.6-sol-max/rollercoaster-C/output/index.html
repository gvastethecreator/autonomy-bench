<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07141d" />
  <title>Aurelia Ridge Run</title>
  <style>
    :root {
      color-scheme: dark;
      --cream: #f8edcf;
      --gold: #ffc968;
      --cyan: #73e7ef;
      --ink: #061018;
      --line: rgba(233, 248, 242, 0.2);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07141d;
      color: var(--cream);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    body { user-select: none; }

    #stage,
    #stage canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #stage canvas { outline: none; }

    .vignette,
    .grain,
    .grade,
    #rush,
    #hud,
    #intro {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .grade {
      background:
        linear-gradient(180deg, rgba(4, 15, 25, 0.08), transparent 36%, rgba(5, 10, 15, 0.18)),
        radial-gradient(circle at 74% 35%, rgba(255, 173, 84, 0.045), transparent 45%);
      mix-blend-mode: screen;
    }

    .vignette {
      z-index: 4;
      box-shadow: inset 0 0 18vmax rgba(0, 5, 10, 0.55);
      background: radial-gradient(circle at 50% 48%, transparent 48%, rgba(2, 7, 11, 0.12) 69%, rgba(1, 4, 7, 0.52) 120%);
    }

    .grain {
      z-index: 5;
      opacity: 0.13;
      background-image:
        repeating-radial-gradient(circle at 15% 35%, transparent 0, rgba(255,255,255,.28) .35px, transparent .75px, transparent 3px),
        repeating-radial-gradient(circle at 70% 65%, transparent 0, rgba(255,255,255,.16) .4px, transparent .8px, transparent 4px);
      background-size: 6px 7px, 9px 8px;
      mix-blend-mode: soft-light;
      animation: grainShift .2s steps(2) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(1px, 1px); }
      100% { transform: translate(0, 0); }
    }

    #rush {
      z-index: 3;
      overflow: hidden;
      opacity: 0;
      transition: opacity .35s ease;
      -webkit-mask-image: radial-gradient(circle, transparent 0 30%, #000 64%, #000 85%, transparent 100%);
      mask-image: radial-gradient(circle, transparent 0 30%, #000 64%, #000 85%, transparent 100%);
      mix-blend-mode: screen;
    }

    #rush i {
      --a: 0deg;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11vmin;
      height: 1px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(196, 243, 237, .5));
      transform-origin: 0 50%;
      animation: streak var(--d, .75s) linear var(--delay, 0s) infinite;
    }

    @keyframes streak {
      0% { opacity: 0; transform: rotate(var(--a)) translateX(24vmin) scaleX(.15); }
      22% { opacity: .45; }
      100% { opacity: 0; transform: rotate(var(--a)) translateX(69vmin) scaleX(1.7); }
    }

    #hud {
      z-index: 6;
      padding: clamp(20px, 3.2vw, 46px);
      display: grid;
      grid-template: auto 1fr auto / 1fr 1fr;
      letter-spacing: .08em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .62);
      transition: opacity .35s ease;
    }

    #hud.hidden { opacity: 0; }

    .brand {
      grid-column: 1;
      align-self: start;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 201, 104, .52);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      font: 600 12px/1 Georgia, serif;
      box-shadow: inset 0 0 18px rgba(255, 201, 104, .08), 0 0 24px rgba(255, 201, 104, .08);
    }

    .brand-copy strong {
      display: block;
      color: var(--cream);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .26em;
    }

    .brand-copy span {
      display: block;
      margin-top: 5px;
      color: rgba(219, 237, 229, .58);
      font-size: 8px;
      letter-spacing: .22em;
    }

    .live {
      grid-column: 2;
      justify-self: end;
      align-self: start;
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(230, 243, 236, .68);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .2em;
    }

    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 13px var(--cyan);
      animation: livePulse 1.8s ease-in-out infinite;
    }

    @keyframes livePulse { 50% { opacity: .35; transform: scale(.72); } }

    .reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      opacity: .35;
    }

    .reticle::before,
    .reticle::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(228, 246, 239, .3);
      border-radius: 50%;
      clip-path: polygon(0 0, 38% 0, 38% 12%, 62% 12%, 62% 0, 100% 0, 100% 38%, 88% 38%, 88% 62%, 100% 62%, 100% 100%, 62% 100%, 62% 88%, 38% 88%, 38% 100%, 0 100%, 0 62%, 12% 62%, 12% 38%, 0 38%);
    }

    .reticle::after {
      inset: 19px;
      background: rgba(255, 213, 130, .75);
      border: 0;
      box-shadow: 0 0 10px rgba(255, 201, 104, .7);
    }

    .telemetry {
      grid-column: 1 / -1;
      align-self: end;
      display: grid;
      grid-template-columns: minmax(220px, 1.35fr) repeat(3, minmax(74px, .36fr));
      gap: clamp(12px, 2.2vw, 32px);
      align-items: end;
      width: min(780px, 100%);
    }

    .route-block { min-width: 0; }

    .eyebrow,
    .stat label {
      display: block;
      color: rgba(221, 239, 232, .52);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    #sector {
      display: block;
      overflow: hidden;
      margin-top: 8px;
      color: #fff6db;
      font: italic 500 clamp(17px, 2.15vw, 28px)/1 Georgia, serif;
      letter-spacing: .025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-progress {
      position: relative;
      width: 100%;
      height: 2px;
      margin-top: 15px;
      overflow: hidden;
      background: rgba(226, 240, 234, .14);
    }

    #progress-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--gold), #fff0bb 58%, var(--cyan));
      box-shadow: 0 0 10px rgba(255, 201, 104, .48);
    }

    .stat {
      min-height: 52px;
      padding-left: clamp(10px, 1.4vw, 18px);
      border-left: 1px solid var(--line);
    }

    .stat-output {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-top: 7px;
      color: #fff8e7;
      font-size: clamp(17px, 2vw, 25px);
      font-weight: 300;
      letter-spacing: -.02em;
    }

    .stat-output small {
      color: rgba(220, 237, 230, .52);
      font-size: 7px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    .hint {
      position: absolute;
      right: clamp(20px, 3.2vw, 46px);
      bottom: clamp(20px, 3.2vw, 46px);
      color: rgba(221, 237, 231, .34);
      font-size: 7px;
      letter-spacing: .18em;
    }

    #intro {
      z-index: 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #07131c;
    }

    #intro::before {
      content: "";
      position: absolute;
      width: min(74vw, 820px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 204, 111, .12);
      border-radius: 50%;
      box-shadow: 0 0 110px rgba(66, 199, 208, .06), inset 0 0 110px rgba(255, 191, 91, .03);
      animation: introOrbit 12s linear infinite;
    }

    #intro::after {
      content: "";
      position: absolute;
      width: 1px;
      height: 42vh;
      left: 50%;
      top: -45vh;
      background: linear-gradient(transparent, var(--gold), transparent);
      box-shadow: 0 0 18px rgba(255, 201, 104, .8);
    }

    @keyframes introOrbit { to { transform: rotate(360deg); } }

    .intro-copy {
      position: relative;
      text-align: center;
      transform: translateY(-2vh);
    }

    .intro-kicker {
      color: rgba(224, 240, 233, .55);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .45em;
    }

    .intro-title {
      margin: 17px 0 13px;
      color: #fff2cf;
      font: italic 400 clamp(48px, 10vw, 126px)/.78 Georgia, serif;
      letter-spacing: -.07em;
      text-shadow: 0 0 70px rgba(255, 195, 92, .12);
    }

    .intro-subtitle {
      color: var(--gold);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .52em;
      text-transform: uppercase;
    }

    .loading-line {
      position: relative;
      width: min(270px, 54vw);
      height: 1px;
      margin: 42px auto 0;
      overflow: hidden;
      background: rgba(255, 255, 255, .1);
    }

    .loading-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), transparent);
      animation: loadSweep 1.5s ease-in-out infinite;
    }

    @keyframes loadSweep {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    body.loaded #intro {
      animation: curtainAway 2.2s cubic-bezier(.72, 0, .22, 1) 1.35s forwards;
    }

    body.loaded #intro::after {
      animation: lightCut 1.45s cubic-bezier(.2, .8, .2, 1) .75s forwards;
    }

    @keyframes lightCut {
      0% { transform: translateY(0) scaleY(1); }
      80% { transform: translateY(145vh) scaleY(3); opacity: 1; }
      100% { transform: translateY(145vh) scaleY(3); opacity: 0; }
    }

    @keyframes curtainAway {
      0% { opacity: 1; transform: scale(1); }
      70% { opacity: 0; transform: scale(1.045); }
      100% { opacity: 0; visibility: hidden; transform: scale(1.045); }
    }

    #fatal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      background: #07131c;
      color: #f9eac8;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: .08em;
    }

    @media (max-width: 700px) {
      #hud { padding: 20px; }
      .telemetry { grid-template-columns: 1fr repeat(3, 58px); gap: 8px; }
      .stat { padding-left: 8px; }
      .stat-output { font-size: 16px; }
      .stat-output small { display: none; }
      .hint { display: none; }
      #sector { font-size: 16px; }
      .brand-copy span { display: none; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Continuous first-person rollercoaster experience"></main>

  <div class="grade"></div>
  <div id="rush" aria-hidden="true"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <section id="hud" aria-label="Ride telemetry">
    <div class="brand">
      <div class="brand-mark">AR</div>
      <div class="brand-copy">
        <strong>AURELIA</strong>
        <span>RIDGE TRANSIT / CIRCUIT 01</span>
      </div>
    </div>
    <div class="live">CONTINUOUS FEED · LAP <span id="lap">01</span></div>
    <div class="reticle" aria-hidden="true"></div>

    <div class="telemetry">
      <div class="route-block">
        <span class="eyebrow">Now entering</span>
        <span id="sector">Dawn Gate</span>
        <div class="track-progress"><div id="progress-fill"></div></div>
      </div>
      <div class="stat">
        <label>Velocity</label>
        <div class="stat-output"><span id="speed">000</span><small>KM/H</small></div>
      </div>
      <div class="stat">
        <label>Clearance</label>
        <div class="stat-output"><span id="altitude">00</span><small>M</small></div>
      </div>
      <div class="stat">
        <label>Load</label>
        <div class="stat-output"><span id="gforce">1.0</span><small>G</small></div>
      </div>
    </div>

    <div class="hint">PRESS H · HIDE INTERFACE</div>
  </section>

  <section id="intro" aria-label="Aurelia Ridge Run">
    <div class="intro-copy">
      <div class="intro-kicker">ONE LINE · NO CUTS · ALWAYS MOVING</div>
      <h1 class="intro-title">Aurelia</h1>
      <div class="intro-subtitle">Ridge Run</div>
      <div class="loading-line"></div>
    </div>
  </section>

  <div id="fatal">This experience needs WebGL and a modern browser.<br />Please enable hardware acceleration and reload.</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    const stage = document.querySelector("#stage");
    const fatal = document.querySelector("#fatal");

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    } catch (error) {
      fatal.style.display = "grid";
      throw error;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x081a26);
    scene.fog = new THREE.FogExp2(0x102634, 0.0041);

    const camera = new THREE.PerspectiveCamera(67, window.innerWidth / window.innerHeight, 0.04, 520);
    scene.add(camera);

    const clock = new THREE.Clock();
    const worldUp = new THREE.Vector3(0, 1, 0);
    const tmpMatrix = new THREE.Matrix4();
    const tmpQuaternion = new THREE.Quaternion();
    const tmpPosition = new THREE.Vector3();
    const tmpScale = new THREE.Vector3();

    let randomSeed = 42691;
    const random = () => {
      randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
      return randomSeed / 4294967296;
    };

    const wrap = value => ((value % 1) + 1) % 1;
    const clamp = THREE.MathUtils.clamp;

    function terrainHeight(x, z) {
      const broad = Math.sin(x * 0.031) * 2.2 + Math.cos(z * 0.043) * 1.9;
      const detail = Math.sin((x + z) * 0.082) * 0.85 + Math.cos((x - z) * 0.067) * 0.65;
      const rim = Math.max(0, Math.hypot(x, z) - 76) * 0.047;
      const riverCut = -3.6 * Math.exp(-Math.pow(z + x * 0.28, 2) / 150);
      return -8.4 + broad + detail + rim + riverCut;
    }

    const controlPoints = [
      [0, 34, 72], [26, 35, 62], [50, 39, 42], [66, 49, 12],
      [64, 56, -18], [50, 58, -42], [26, 48, -62], [3, 20, -72],
      [-28, 7, -65], [-57, 9, -43], [-72, 17, -10], [-68, 30, 24],
      [-48, 45, 48], [-24, 60, 62], [3, 72, 52], [30, 54, 38],
      [46, 25, 18], [50, 12, -8], [39, 11, -31], [18, 19, -42],
      [-2, 31, -38], [-15, 38, -19], [-10, 30, 3], [9, 22, 19],
      [28, 25, 36], [31, 31, 57]
    ].map(point => new THREE.Vector3(...point));

    const track = new THREE.CatmullRomCurve3(controlPoints, true, "catmullrom", 0.48);
    track.arcLengthDivisions = 2200;
    const trackLength = track.getLength();

    function frameAt(t) {
      const u = wrap(t);
      const tangent = track.getTangentAt(u).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, worldUp).normalize();
      const up = new THREE.Vector3().crossVectors(right, tangent).normalize();
      const before = track.getTangentAt(wrap(u - 0.006)).normalize();
      const after = track.getTangentAt(wrap(u + 0.006)).normalize();
      const turn = new THREE.Vector3().crossVectors(before, after).dot(worldUp);
      const bank = clamp(-turn * 12.5, -0.7, 0.7);
      right.applyAxisAngle(tangent, bank);
      up.applyAxisAngle(tangent, bank);
      return { tangent, right, up, bank };
    }

    // Sky dome, stars, and the low sunset source.
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(440, 40, 24),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        vertexShader: `
          varying vec3 vDirection;
          void main() {
            vDirection = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vDirection;
          void main() {
            float h = vDirection.y;
            vec3 low = vec3(0.24, 0.20, 0.24);
            vec3 horizon = vec3(0.58, 0.33, 0.24);
            vec3 high = vec3(0.025, 0.095, 0.16);
            vec3 color = mix(low, horizon, smoothstep(-0.25, 0.02, h));
            color = mix(color, high, smoothstep(0.04, 0.78, h));
            vec3 sunDirection = normalize(vec3(-0.72, 0.2, -0.64));
            float sun = max(dot(vDirection, sunDirection), 0.0);
            color += vec3(1.0, 0.47, 0.16) * pow(sun, 42.0) * 0.38;
            color += vec3(1.0, 0.72, 0.37) * pow(sun, 360.0) * 2.1;
            gl_FragColor = vec4(color, 1.0);
          }
        `
      })
    );
    scene.add(sky);

    const starPositions = [];
    for (let i = 0; i < 620; i++) {
      const theta = random() * Math.PI * 2;
      const y = 35 + random() * 320;
      const radius = 410;
      const horizontal = Math.sqrt(Math.max(0, radius * radius - y * y));
      starPositions.push(Math.cos(theta) * horizontal, y, Math.sin(theta) * horizontal);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({
      color: 0xd9eeef,
      size: 0.72,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.62,
      depthWrite: false,
      fog: false
    })));

    function radialTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 256;
      const context = canvas.getContext("2d");
      const gradient = context.createRadialGradient(128, 128, 2, 128, 128, 128);
      gradient.addColorStop(0, "rgba(255,248,213,1)");
      gradient.addColorStop(.08, "rgba(255,205,105,.95)");
      gradient.addColorStop(.32, "rgba(255,132,54,.3)");
      gradient.addColorStop(1, "rgba(255,96,32,0)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, 256, 256);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const sun = new THREE.Sprite(new THREE.SpriteMaterial({
      map: radialTexture(),
      transparent: true,
      depthWrite: false,
      fog: false,
      blending: THREE.AdditiveBlending
    }));
    sun.position.set(-245, 72, -220);
    sun.scale.set(92, 92, 1);
    scene.add(sun);

    // Cinematic light rig.
    scene.add(new THREE.HemisphereLight(0x80b5c5, 0x251b19, 1.5));
    const sunsetLight = new THREE.DirectionalLight(0xffb76b, 3.1);
    sunsetLight.position.set(-90, 135, -95);
    sunsetLight.castShadow = true;
    sunsetLight.shadow.mapSize.set(1536, 1536);
    sunsetLight.shadow.camera.left = -125;
    sunsetLight.shadow.camera.right = 125;
    sunsetLight.shadow.camera.top = 125;
    sunsetLight.shadow.camera.bottom = -125;
    sunsetLight.shadow.camera.near = 10;
    sunsetLight.shadow.camera.far = 330;
    sunsetLight.shadow.bias = -0.00015;
    scene.add(sunsetLight, sunsetLight.target);

    const coolFill = new THREE.DirectionalLight(0x5fc9d5, 0.68);
    coolFill.position.set(80, 45, 60);
    scene.add(coolFill);

    // Terrain.
    const terrainGeometry = new THREE.PlaneGeometry(430, 430, 74, 74);
    terrainGeometry.rotateX(-Math.PI / 2);
    const terrainPositions = terrainGeometry.attributes.position;
    const terrainColors = [];
    const lowColor = new THREE.Color(0x102d2f);
    const highColor = new THREE.Color(0x614f3b);
    const vertexColor = new THREE.Color();
    for (let i = 0; i < terrainPositions.count; i++) {
      const x = terrainPositions.getX(i);
      const z = terrainPositions.getZ(i);
      const y = terrainHeight(x, z);
      terrainPositions.setY(i, y);
      const mix = clamp((y + 13) / 19, 0, 1) * 0.72 + ((Math.sin(x * .2) + 1) * .035);
      vertexColor.copy(lowColor).lerp(highColor, mix);
      terrainColors.push(vertexColor.r, vertexColor.g, vertexColor.b);
    }
    terrainGeometry.setAttribute("color", new THREE.Float32BufferAttribute(terrainColors, 3));
    terrainGeometry.computeVertexNormals();
    const terrain = new THREE.Mesh(terrainGeometry, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 1,
      metalness: 0,
      flatShading: true
    }));
    terrain.receiveShadow = true;
    scene.add(terrain);

    const waterMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: { time: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float time;
        void main() {
          float a = sin(vUv.x * 72.0 + time * 1.4 + sin(vUv.y * 14.0) * 2.0);
          float b = sin(vUv.x * 31.0 - time * 0.85);
          float glint = smoothstep(0.76, 1.0, a * 0.58 + b * 0.42);
          vec3 base = mix(vec3(0.025, 0.22, 0.27), vec3(0.12, 0.48, 0.52), vUv.y);
          base += vec3(0.62, 0.55, 0.36) * glint * 0.38;
          gl_FragColor = vec4(base, 0.8);
        }
      `
    });
    const river = new THREE.Mesh(new THREE.PlaneGeometry(430, 17), waterMaterial);
    river.rotation.x = -Math.PI / 2;
    river.rotation.z = -0.275;
    river.position.y = -11.35;
    scene.add(river);

    // Distant faceted peaks.
    const peakGeometry = new THREE.ConeGeometry(1, 1, 7, 3);
    peakGeometry.translate(0, 0.5, 0);
    const peakMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });
    const peaks = new THREE.InstancedMesh(peakGeometry, peakMaterial, 74);
    peaks.receiveShadow = true;
    const peakPalette = [0x263b39, 0x34453e, 0x4c4c3f, 0x27383a, 0x5a4a3b];
    for (let i = 0; i < 74; i++) {
      const angle = random() * Math.PI * 2;
      const distance = 98 + random() * 103;
      const x = Math.cos(angle) * distance;
      const z = Math.sin(angle) * distance;
      const height = 19 + random() * 68 + Math.max(0, distance - 145) * .22;
      const width = 7 + random() * 15;
      tmpPosition.set(x, terrainHeight(x, z) - .6, z);
      tmpQuaternion.setFromAxisAngle(worldUp, random() * Math.PI);
      tmpScale.set(width, height, width * (.75 + random() * .55));
      tmpMatrix.compose(tmpPosition, tmpQuaternion, tmpScale);
      peaks.setMatrixAt(i, tmpMatrix);
      peaks.setColorAt(i, new THREE.Color(peakPalette[Math.floor(random() * peakPalette.length)]));
    }
    peaks.instanceMatrix.needsUpdate = true;
    if (peaks.instanceColor) peaks.instanceColor.needsUpdate = true;
    scene.add(peaks);

    const pathSamplesXZ = Array.from({ length: 100 }, (_, index) => track.getPointAt(index / 100));
    function distanceSqToPath(x, z) {
      let distance = Infinity;
      for (const point of pathSamplesXZ) {
        const dx = x - point.x;
        const dz = z - point.z;
        distance = Math.min(distance, dx * dx + dz * dz);
      }
      return distance;
    }

    // Dark pines near the line make the low sections feel fast.
    const pineGeometry = new THREE.ConeGeometry(1, 2.4, 6, 2);
    pineGeometry.translate(0, 1.15, 0);
    const pines = new THREE.InstancedMesh(
      pineGeometry,
      new THREE.MeshStandardMaterial({ color: 0x123634, roughness: .94, flatShading: true }),
      235
    );
    let pineCount = 0;
    let attempts = 0;
    while (pineCount < 235 && attempts++ < 1500) {
      const x = (random() - .5) * 205;
      const z = (random() - .5) * 205;
      const ground = terrainHeight(x, z);
      const distanceSq = distanceSqToPath(x, z);
      if (ground < -10.2 || distanceSq < 30 || distanceSq > 1250) continue;
      const size = 1.7 + random() * 3.4;
      tmpPosition.set(x, ground, z);
      tmpQuaternion.setFromAxisAngle(worldUp, random() * Math.PI);
      tmpScale.set(size * .48, size, size * .48);
      tmpMatrix.compose(tmpPosition, tmpQuaternion, tmpScale);
      pines.setMatrixAt(pineCount++, tmpMatrix);
    }
    pines.count = pineCount;
    pines.castShadow = true;
    pines.receiveShadow = true;
    pines.instanceMatrix.needsUpdate = true;
    scene.add(pines);

    // Volumetric-looking cloud clusters made only from soft geometry.
    const clouds = [];
    const cloudMaterial = new THREE.MeshBasicMaterial({
      color: 0xd6d6ca,
      transparent: true,
      opacity: .1,
      depthWrite: false,
      fog: true
    });
    for (let c = 0; c < 11; c++) {
      const cloud = new THREE.Group();
      const angle = random() * Math.PI * 2;
      const distance = 105 + random() * 120;
      cloud.position.set(Math.cos(angle) * distance, 58 + random() * 54, Math.sin(angle) * distance);
      cloud.userData.phase = random() * Math.PI * 2;
      cloud.userData.drift = 1.2 + random() * 1.8;
      for (let p = 0; p < 5; p++) {
        const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), cloudMaterial);
        puff.position.set((p - 2) * (4 + random() * 2), (random() - .5) * 3, (random() - .5) * 5);
        puff.scale.set(7 + random() * 5, 2.8 + random() * 3.6, 5 + random() * 4);
        cloud.add(puff);
      }
      clouds.push(cloud);
      scene.add(cloud);
    }

    // Banked twin rails.
    const leftRailPoints = [];
    const rightRailPoints = [];
    const guidePoints = [];
    const railSamples = 480;
    for (let i = 0; i < railSamples; i++) {
      const t = i / railSamples;
      const point = track.getPointAt(t);
      const frame = frameAt(t);
      leftRailPoints.push(point.clone().addScaledVector(frame.right, -.69).addScaledVector(frame.up, .05));
      rightRailPoints.push(point.clone().addScaledVector(frame.right, .69).addScaledVector(frame.up, .05));
      guidePoints.push(point.clone().addScaledVector(frame.up, -.04));
    }

    const leftRailCurve = new THREE.CatmullRomCurve3(leftRailPoints, true, "catmullrom", .5);
    const rightRailCurve = new THREE.CatmullRomCurve3(rightRailPoints, true, "catmullrom", .5);
    const guideCurve = new THREE.CatmullRomCurve3(guidePoints, true, "catmullrom", .5);

    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8b879,
      emissive: 0x3c260b,
      emissiveIntensity: 1.2,
      metalness: .86,
      roughness: .22
    });
    const leftRail = new THREE.Mesh(new THREE.TubeGeometry(leftRailCurve, 1280, .105, 8, true), railMaterial);
    const rightRail = new THREE.Mesh(new THREE.TubeGeometry(rightRailCurve, 1280, .105, 8, true), railMaterial);
    leftRail.castShadow = rightRail.castShadow = true;
    leftRail.receiveShadow = rightRail.receiveShadow = true;
    scene.add(leftRail, rightRail);

    const spine = new THREE.Mesh(
      new THREE.TubeGeometry(guideCurve, 1000, .12, 6, true),
      new THREE.MeshStandardMaterial({ color: 0x17252a, metalness: .72, roughness: .38 })
    );
    spine.castShadow = true;
    scene.add(spine);

    const energyLineMaterial = new THREE.MeshBasicMaterial({ color: 0x7debf0 });
    const energyLine = new THREE.Mesh(new THREE.TubeGeometry(guideCurve, 1000, .027, 5, true), energyLineMaterial);
    scene.add(energyLine);

    // Sleepers lock to the banked frame.
    const sleeperCount = 260;
    const sleeperGeometry = new THREE.BoxGeometry(1.72, .11, .34);
    const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x263239, metalness: .62, roughness: .48 });
    const sleepers = new THREE.InstancedMesh(sleeperGeometry, sleeperMaterial, sleeperCount);
    sleepers.castShadow = true;
    sleepers.receiveShadow = true;
    for (let i = 0; i < sleeperCount; i++) {
      const t = i / sleeperCount;
      const point = track.getPointAt(t);
      const frame = frameAt(t);
      tmpMatrix.makeBasis(frame.right, frame.up, frame.tangent);
      tmpMatrix.setPosition(point.clone().addScaledVector(frame.up, -.09));
      sleepers.setMatrixAt(i, tmpMatrix);
    }
    sleepers.instanceMatrix.needsUpdate = true;
    scene.add(sleepers);

    // Structural columns, two beneath every selected sleeper.
    const supportMatrices = [];
    const columnGeometry = new THREE.CylinderGeometry(1, 1, 1, 7, 1);
    function cylinderMatrixBetween(start, end, radius) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      const midpoint = start.clone().add(end).multiplyScalar(.5);
      const quaternion = new THREE.Quaternion().setFromUnitVectors(worldUp, direction.normalize());
      return new THREE.Matrix4().compose(midpoint, quaternion, new THREE.Vector3(radius, length, radius));
    }

    for (let i = 0; i < 46; i++) {
      const t = wrap(i / 46 + .006);
      const point = track.getPointAt(t);
      const frame = frameAt(t);
      for (const side of [-.56, .56]) {
        const top = point.clone().addScaledVector(frame.right, side).addScaledVector(frame.up, -.43);
        const groundY = terrainHeight(top.x, top.z) + .15;
        if (top.y - groundY < 2.2) continue;
        const base = new THREE.Vector3(top.x, groundY, top.z);
        supportMatrices.push(cylinderMatrixBetween(base, top, .095));
      }
    }
    const supports = new THREE.InstancedMesh(
      columnGeometry,
      new THREE.MeshStandardMaterial({ color: 0x20363a, metalness: .68, roughness: .48 }),
      supportMatrices.length
    );
    supportMatrices.forEach((matrix, index) => supports.setMatrixAt(index, matrix));
    supports.instanceMatrix.needsUpdate = true;
    supports.castShadow = true;
    supports.receiveShadow = true;
    scene.add(supports);

    // Side beacons define the route even through fog.
    const beaconGeometry = new THREE.SphereGeometry(.075, 7, 5);
    const beaconMaterial = new THREE.MeshBasicMaterial({ color: 0xffd077 });
    const beaconCount = 96;
    const beacons = new THREE.InstancedMesh(beaconGeometry, beaconMaterial, beaconCount);
    for (let i = 0; i < beaconCount; i++) {
      const t = i / (beaconCount / 2);
      const point = track.getPointAt(wrap(t));
      const frame = frameAt(wrap(t));
      const side = i % 2 ? -1 : 1;
      tmpMatrix.makeTranslation(
        point.x + frame.right.x * side * .96 + frame.up.x * .15,
        point.y + frame.right.y * side * .96 + frame.up.y * .15,
        point.z + frame.right.z * side * .96 + frame.up.z * .15
      );
      beacons.setMatrixAt(i, tmpMatrix);
    }
    beacons.instanceMatrix.needsUpdate = true;
    scene.add(beacons);

    function orientPortal(object, t) {
      const point = track.getPointAt(wrap(t));
      const tangent = track.getTangentAt(wrap(t)).normalize();
      object.position.copy(point);
      object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent);
    }

    // The Lumen Tunnel: a sequence of luminous frames around the fastest inner pass.
    const tunnelGroup = new THREE.Group();
    const tunnelMaterialA = new THREE.MeshStandardMaterial({
      color: 0x263b40,
      emissive: 0x26a7b2,
      emissiveIntensity: 1.5,
      metalness: .72,
      roughness: .25
    });
    const tunnelMaterialB = new THREE.MeshStandardMaterial({
      color: 0x4b3425,
      emissive: 0xb45b20,
      emissiveIntensity: 1.15,
      metalness: .68,
      roughness: .3
    });
    for (let i = 0; i < 25; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(3.2 + Math.sin(i * .55) * .08, .085, 7, 42),
        i % 5 === 0 ? tunnelMaterialB : tunnelMaterialA
      );
      orientPortal(ring, .61 + i * .00375);
      ring.castShadow = true;
      tunnelGroup.add(ring);
    }
    scene.add(tunnelGroup);

    for (let i = 0; i < 4; i++) {
      const t = .62 + i * .021;
      const point = track.getPointAt(t);
      const frame = frameAt(t);
      const light = new THREE.PointLight(i % 2 ? 0xff904c : 0x55e9ee, 2.8, 15, 2);
      light.position.copy(point).addScaledVector(frame.up, 2.1);
      scene.add(light);
    }

    // Dawn Gate station hoops and title plate at the seamless lap point.
    const gateGroup = new THREE.Group();
    const gateMaterial = new THREE.MeshStandardMaterial({
      color: 0x6d5837,
      emissive: 0xe18632,
      emissiveIntensity: .92,
      metalness: .8,
      roughness: .24
    });
    for (let i = 0; i < 8; i++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(3.75, .115, 8, 48), gateMaterial);
      orientPortal(ring, wrap(.958 + i * .0105));
      ring.castShadow = true;
      gateGroup.add(ring);
    }
    scene.add(gateGroup);

    function makeTitlePlate() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 220;
      const context = canvas.getContext("2d");
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "rgba(7, 20, 26, .88)";
      context.fillRect(18, 18, 988, 184);
      context.strokeStyle = "rgba(255, 207, 119, .78)";
      context.lineWidth = 3;
      context.strokeRect(24, 24, 976, 172);
      context.textAlign = "center";
      context.fillStyle = "#fff0ca";
      context.font = "italic 70px Georgia";
      context.fillText("Aurelia", 512, 111);
      context.fillStyle = "#7ce3e8";
      context.font = "600 20px Arial";
      context.letterSpacing = "8px";
      context.fillText("RIDGE RUN  ·  GATE 01", 512, 157);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const plate = new THREE.Mesh(
        new THREE.PlaneGeometry(8.6, 1.85),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide })
      );
      const t = .989;
      const point = track.getPointAt(t);
      const frame = frameAt(t);
      plate.position.copy(point).addScaledVector(frame.up, 3.15);
      plate.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), frame.tangent);
      return plate;
    }
    scene.add(makeTitlePlate());

    // Suspended pollen and crystalline motes add scale in the valley.
    const motePositions = [];
    const moteColors = [];
    const gold = new THREE.Color(0xffbf61);
    const blue = new THREE.Color(0x75e3e4);
    for (let i = 0; i < 520; i++) {
      const t = random();
      const point = track.getPointAt(t);
      const radius = 6 + random() * 22;
      const angle = random() * Math.PI * 2;
      motePositions.push(
        point.x + Math.cos(angle) * radius,
        terrainHeight(point.x, point.z) + 3 + random() * 34,
        point.z + Math.sin(angle) * radius
      );
      const color = gold.clone().lerp(blue, random());
      moteColors.push(color.r, color.g, color.b);
    }
    const moteGeometry = new THREE.BufferGeometry();
    moteGeometry.setAttribute("position", new THREE.Float32BufferAttribute(motePositions, 3));
    moteGeometry.setAttribute("color", new THREE.Float32BufferAttribute(moteColors, 3));
    const motes = new THREE.Points(moteGeometry, new THREE.PointsMaterial({
      vertexColors: true,
      size: .105,
      transparent: true,
      opacity: .68,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    scene.add(motes);

    // A restrained nose and safety bar anchor the view inside the vehicle.
    const cockpit = new THREE.Group();
    const noseMaterial = new THREE.MeshStandardMaterial({
      color: 0x172a2f,
      metalness: .8,
      roughness: .22,
      emissive: 0x071316,
      emissiveIntensity: .5
    });
    const trimMaterial = new THREE.MeshStandardMaterial({
      color: 0xd4a757,
      metalness: .9,
      roughness: .18,
      emissive: 0x432407,
      emissiveIntensity: .8
    });
    const nose = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI * .58), noseMaterial);
    nose.scale.set(.9, .38, 1.5);
    nose.rotation.x = Math.PI;
    nose.position.set(0, -.99, -1.72);
    cockpit.add(nose);

    const safetyBar = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, 1.42, 12), trimMaterial);
    safetyBar.rotation.z = Math.PI / 2;
    safetyBar.position.set(0, -.64, -1.08);
    cockpit.add(safetyBar);

    for (const side of [-1, 1]) {
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(.065, .065, .5, 10), noseMaterial);
      grip.rotation.x = Math.PI / 2;
      grip.position.set(side * .57, -.65, -1.03);
      cockpit.add(grip);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(.045, 10, 7), new THREE.MeshBasicMaterial({ color: 0x7eeef1 }));
      lamp.position.set(side * .72, -.77, -1.42);
      cockpit.add(lamp);
    }
    camera.add(cockpit);

    // Edge streaks are generated once and driven by actual ride speed.
    const rush = document.querySelector("#rush");
    for (let i = 0; i < 28; i++) {
      const streak = document.createElement("i");
      streak.style.setProperty("--a", `${(i / 28) * 360 + random() * 7}deg`);
      streak.style.setProperty("--d", `${.48 + random() * .48}s`);
      streak.style.setProperty("--delay", `${-random()}s`);
      rush.appendChild(streak);
    }

    const speedOutput = document.querySelector("#speed");
    const altitudeOutput = document.querySelector("#altitude");
    const gforceOutput = document.querySelector("#gforce");
    const progressFill = document.querySelector("#progress-fill");
    const sectorOutput = document.querySelector("#sector");
    const lapOutput = document.querySelector("#lap");
    const hud = document.querySelector("#hud");

    const sectors = [
      { until: .085, name: "Dawn Gate" },
      { until: .245, name: "Solar Ascent" },
      { until: .37, name: "Sunfall Drop" },
      { until: .52, name: "Raven's Arc" },
      { until: .61, name: "Needle Dive" },
      { until: .715, name: "Lumen Tunnel" },
      { until: .86, name: "Cloudbreak Rise" },
      { until: 1, name: "Homeward Ridge" }
    ];

    window.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "h") hud.classList.toggle("hidden");
    });

    let progress = .947;
    let speed = 18;
    let elapsed = 0;
    let lap = 1;
    let firstFrame = true;
    let telemetryTimer = 0;

    function updateCamera(dt) {
      const samplePoint = track.getPointAt(progress);
      const targetSpeed = clamp(18 + (63 - samplePoint.y) * .54, 15, 48);
      speed += (targetSpeed - speed) * (1 - Math.exp(-dt * .9));

      const previous = progress;
      progress = wrap(progress + speed * dt / trackLength);
      if (progress < previous) {
        lap += 1;
        lapOutput.textContent = String(lap).padStart(2, "0");
      }

      const point = track.getPointAt(progress);
      const frame = frameAt(progress);
      const speedRatio = clamp((speed - 16) / 31, 0, 1);
      const wheelTexture = Math.sin(elapsed * (10 + speed * .24) + progress * 110) * .012 * speedRatio;
      const lateralTexture = Math.sin(elapsed * 4.2 + progress * 58) * .009 * speedRatio;

      camera.position.copy(point)
        .addScaledVector(frame.up, 1.03 + wheelTexture)
        .addScaledVector(frame.right, lateralTexture);

      tmpMatrix.makeBasis(frame.right, frame.up, frame.tangent.clone().negate());
      tmpQuaternion.setFromRotationMatrix(tmpMatrix);
      if (firstFrame) {
        camera.quaternion.copy(tmpQuaternion);
        firstFrame = false;
      } else {
        camera.quaternion.slerp(tmpQuaternion, 1 - Math.exp(-dt * 11.5));
      }

      const desiredFov = 66 + speedRatio * 9;
      camera.fov += (desiredFov - camera.fov) * (1 - Math.exp(-dt * 3.2));
      camera.updateProjectionMatrix();

      cockpit.position.y = -wheelTexture * 1.8;
      cockpit.rotation.z = -lateralTexture * 2.2;
      rush.style.opacity = String(.03 + speedRatio * .5);

      telemetryTimer += dt;
      if (telemetryTimer > .08) {
        telemetryTimer = 0;
        const before = track.getTangentAt(wrap(progress - .0025));
        const after = track.getTangentAt(wrap(progress + .0025));
        const bend = before.angleTo(after);
        const localArc = trackLength * .005;
        const curvature = bend / Math.max(localArc, .001);
        const gForce = clamp(.82 + speed * speed * curvature / 9.81, .25, 4.8);
        const clearance = Math.max(0, point.y - terrainHeight(point.x, point.z));

        speedOutput.textContent = String(Math.round(speed * 4.2)).padStart(3, "0");
        altitudeOutput.textContent = String(Math.round(clearance)).padStart(2, "0");
        gforceOutput.textContent = gForce.toFixed(1);
        progressFill.style.transform = `scaleX(${progress})`;
        sectorOutput.textContent = sectors.find(sector => progress < sector.until)?.name || sectors[0].name;
      }
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), .05);
      elapsed += dt;
      updateCamera(dt);

      waterMaterial.uniforms.time.value = elapsed;
      motes.rotation.y = Math.sin(elapsed * .035) * .05;
      tunnelMaterialA.emissiveIntensity = 1.35 + Math.sin(elapsed * 3.1) * .28;
      tunnelMaterialB.emissiveIntensity = 1.05 + Math.sin(elapsed * 2.2 + 1) * .22;
      railMaterial.emissiveIntensity = 1.05 + Math.sin(elapsed * 1.5) * .13;

      for (const cloud of clouds) {
        cloud.position.x += dt * cloud.userData.drift * .25;
        cloud.position.y += Math.sin(elapsed * .12 + cloud.userData.phase) * dt * .04;
        if (cloud.position.x > 235) cloud.position.x = -235;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(animate);
    requestAnimationFrame(() => document.body.classList.add("loaded"));
  </script>
</body>
</html>
