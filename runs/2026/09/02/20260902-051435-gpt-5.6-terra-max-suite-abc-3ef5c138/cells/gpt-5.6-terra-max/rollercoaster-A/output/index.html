<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Skyline Coaster</title>
  <style>
    :root {
      color-scheme: dark;
      --ice: #d7ecff;
      --cyan: #4ee9ff;
      --sun: #ff9e64;
      --ink: #06101e;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071426;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette,
    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
    }

    .vignette {
      z-index: 2;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(1, 7, 17, .16) 70%, rgba(1, 7, 17, .68) 100%),
        linear-gradient(180deg, rgba(2, 10, 23, .26), transparent 17%, transparent 74%, rgba(2, 10, 23, .42));
    }

    .grain {
      z-index: 3;
      opacity: .2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .hud {
      position: fixed;
      z-index: 4;
      inset: 0;
      padding: clamp(18px, 3vw, 42px);
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--ice);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .8);
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      border: 1px solid rgba(142, 235, 255, .75);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 16px rgba(78, 233, 255, .38), inset 0 0 12px rgba(78, 233, 255, .16);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
    }

    .brand-mark::before {
      left: 6px;
      right: 6px;
      top: 14px;
      height: 1px;
      transform: rotate(-28deg);
    }

    .brand-mark::after {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      left: 13px;
      top: 13px;
    }

    .brand-copy strong,
    .brand-copy span {
      display: block;
    }

    .brand-copy strong {
      font-size: 10px;
      font-weight: 700;
      color: #f2fbff;
    }

    .brand-copy span {
      margin-top: 3px;
      color: rgba(204, 232, 251, .68);
      font-size: 8px;
    }

    .readout {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 17px;
      row-gap: 6px;
      padding: 10px 0 0 20px;
      border-left: 1px solid rgba(150, 216, 246, .32);
      text-align: right;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .8);
    }

    .readout dt {
      color: rgba(201, 231, 249, .58);
      font-size: 8px;
    }

    .readout dd {
      margin: 0;
      min-width: 53px;
      color: #eaf7ff;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .lower {
      position: fixed;
      z-index: 4;
      left: clamp(18px, 3vw, 42px);
      right: clamp(18px, 3vw, 42px);
      bottom: clamp(17px, 2.8vw, 37px);
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: .13em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .8);
    }

    .ride-state {
      color: rgba(224, 244, 255, .75);
      font-size: 8px;
      line-height: 1.6;
    }

    .ride-state b {
      color: #bff7ff;
      font-weight: 700;
    }

    .route {
      width: min(29vw, 230px);
    }

    .route-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: rgba(224, 244, 255, .7);
      font-size: 8px;
    }

    .route-track {
      height: 2px;
      background: rgba(190, 225, 244, .24);
      box-shadow: 0 0 12px rgba(78, 233, 255, .14);
      position: relative;
    }

    .route-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 34%;
      background: linear-gradient(90deg, var(--cyan), #d4f9ff);
      box-shadow: 0 0 10px var(--cyan);
    }

    .route-progress::after {
      content: "";
      position: absolute;
      right: -4px;
      top: -3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #effdff;
      box-shadow: 0 0 13px 3px rgba(78, 233, 255, .82);
    }

    @media (max-width: 550px) {
      .hud { padding: 18px; }
      .lower { left: 18px; right: 18px; bottom: 18px; }
      .readout { column-gap: 9px; padding-left: 10px; }
      .route { width: 38vw; }
      .brand-copy span { display: none; }
    }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="hud" aria-label="Ride telemetry">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-copy">
        <strong>Skyline Coaster</strong>
        <span>Night Circuit / 06</span>
      </div>
    </div>
    <dl class="readout">
      <dt>Velocity</dt><dd id="speed">087 km/h</dd>
      <dt>Altitude</dt><dd id="altitude">0128 m</dd>
      <dt>Track</dt><dd>Online</dd>
    </dl>
  </div>

  <div class="lower">
    <div class="ride-state"><b>Auto-ride engaged</b><br>Keep arms inside the vehicle</div>
    <div class="route">
      <div class="route-label"><span>Loop progress</span><span id="lap">00:14</span></div>
      <div class="route-track"><div class="route-progress" id="progress"></div></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1728, 0.0105);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.19;
    document.body.prepend(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(76, window.innerWidth / window.innerHeight, 0.08, 950);
    scene.add(camera);

    const clock = new THREE.Clock();
    const worldUp = new THREE.Vector3(0, 1, 0);
    const scratch = {
      point: new THREE.Vector3(),
      tangent: new THREE.Vector3(),
      side: new THREE.Vector3(),
      up: new THREE.Vector3(),
      eye: new THREE.Vector3(),
      target: new THREE.Vector3(),
      matrix: new THREE.Matrix4(),
      quat: new THREE.Quaternion()
    };

    function hash(n) {
      const v = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
      return v - Math.floor(v);
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function makeSky() {
      const material = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x061126) },
          horizonColor: { value: new THREE.Color(0x466078) },
          glowColor: { value: new THREE.Color(0xffaa79) }
        },
        vertexShader: [
          "varying vec3 vPosition;",
          "void main() {",
          "  vPosition = position;",
          "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
          "}"
        ].join("\\n"),
        fragmentShader: [
          "uniform vec3 topColor;",
          "uniform vec3 horizonColor;",
          "uniform vec3 glowColor;",
          "varying vec3 vPosition;",
          "void main() {",
          "  float h = normalize(vPosition).y * 0.5 + 0.5;",
          "  vec3 sky = mix(horizonColor, topColor, smoothstep(0.30, 0.90, h));",
          "  float dusk = pow(max(0.0, 1.0 - abs(h - 0.38) * 3.3), 2.0);",
          "  sky += glowColor * dusk * 0.20;",
          "  gl_FragColor = vec4(sky, 1.0);",
          "}"
        ].join("\\n")
      });
      const sky = new THREE.Mesh(new THREE.SphereGeometry(620, 40, 22), material);
      scene.add(sky);
    }

    makeSky();

    const hemi = new THREE.HemisphereLight(0x82c8ff, 0x07100d, 1.5);
    scene.add(hemi);

    const moonlight = new THREE.DirectionalLight(0xb9e6ff, 2.4);
    moonlight.position.set(-90, 95, 30);
    scene.add(moonlight);

    const sunset = new THREE.DirectionalLight(0xff9d70, 1.4);
    sunset.position.set(-60, 30, -170);
    scene.add(sunset);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1200, 1200, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x071b1d, roughness: 0.98, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.65;
    scene.add(ground);

    const grid = new THREE.GridHelper(700, 70, 0x173d42, 0x102a30);
    grid.position.y = -0.58;
    grid.material.transparent = true;
    grid.material.opacity = 0.26;
    scene.add(grid);

    const starPositions = [];
    const starColors = [];
    for (let i = 0; i < 650; i++) {
      const theta = hash(i * 2.3) * Math.PI * 2;
      const phi = Math.acos(0.12 + hash(i * 7.1) * 0.88);
      const radius = 470 + hash(i * 3.7) * 55;
      starPositions.push(
        Math.sin(phi) * Math.cos(theta) * radius,
        Math.cos(phi) * radius,
        Math.sin(phi) * Math.sin(theta) * radius
      );
      const tint = 0.7 + hash(i * 9.2) * 0.3;
      starColors.push(tint, tint, 1);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    starGeometry.setAttribute("color", new THREE.Float32BufferAttribute(starColors, 3));
    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({ size: 1.35, vertexColors: true, transparent: true, opacity: 0.78, sizeAttenuation: false })
    );
    scene.add(stars);

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(11, 28, 20),
      new THREE.MeshBasicMaterial({ color: 0xffb06d, transparent: true, opacity: 0.9, fog: false })
    );
    sun.position.set(-88, 48, -246);
    scene.add(sun);

    const sunHalo = new THREE.Sprite(
      new THREE.SpriteMaterial({ color: 0xff9b67, transparent: true, opacity: 0.3, depthWrite: false, fog: false })
    );
    sunHalo.scale.set(72, 72, 1);
    sunHalo.position.copy(sun.position);
    scene.add(sunHalo);

    const mountainMaterial = new THREE.MeshStandardMaterial({
      color: 0x102f36,
      roughness: 0.93,
      metalness: 0.03,
      flatShading: true
    });
    const snowMaterial = new THREE.MeshStandardMaterial({
      color: 0x3b6871,
      roughness: 0.88,
      flatShading: true
    });

    for (let i = 0; i < 44; i++) {
      const angle = (i / 44) * Math.PI * 2 + 0.16;
      const radius = 142 + hash(i * 4.1) * 165;
      const height = 18 + hash(i * 8.3) * 66;
      const width = 13 + hash(i * 5.9) * 23;
      const mountain = new THREE.Mesh(new THREE.ConeGeometry(width, height, 7), mountainMaterial);
      mountain.position.set(Math.cos(angle) * radius, height * 0.5 - 0.55, Math.sin(angle) * radius - 75);
      mountain.rotation.y = hash(i * 3.3) * Math.PI;
      scene.add(mountain);

      if (height > 50) {
        const snow = new THREE.Mesh(new THREE.ConeGeometry(width * 0.38, height * 0.23, 7), snowMaterial);
        snow.position.copy(mountain.position);
        snow.position.y += height * 0.39;
        snow.rotation.y = mountain.rotation.y;
        scene.add(snow);
      }
    }

    const treeGeometry = new THREE.ConeGeometry(1, 5, 7);
    const treeMaterial = new THREE.MeshStandardMaterial({ color: 0x0a3830, roughness: 0.93, flatShading: true });
    for (let i = 0; i < 280; i++) {
      const angle = hash(i * 13.8) * Math.PI * 2;
      const radius = 35 + hash(i * 5.1) * 225;
      const scale = 0.55 + hash(i * 6.9) * 1.6;
      const tree = new THREE.Mesh(treeGeometry, treeMaterial);
      tree.position.set(Math.cos(angle) * radius, scale * 2.5 - 0.55, Math.sin(angle) * radius - 80);
      tree.scale.setScalar(scale);
      tree.rotation.y = hash(i * 10.1) * Math.PI;
      scene.add(tree);
    }

    const buildings = new THREE.Group();
    const buildingMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x132f42, roughness: 0.72, metalness: 0.25 }),
      new THREE.MeshStandardMaterial({ color: 0x183f4b, roughness: 0.68, metalness: 0.22 }),
      new THREE.MeshStandardMaterial({ color: 0x1a354c, roughness: 0.74, metalness: 0.16 })
    ];
    const windowMaterial = new THREE.MeshBasicMaterial({ color: 0xffbd72, transparent: true, opacity: 0.72 });
    for (let i = 0; i < 42; i++) {
      const angle = -0.28 + (i / 41) * 0.88;
      const radius = 170 + hash(i * 5.7) * 95;
      const height = 13 + hash(i * 2.9) * 48;
      const width = 5 + hash(i * 7.9) * 12;
      const depth = 6 + hash(i * 8.5) * 10;
      const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), buildingMaterials[i % buildingMaterials.length]);
      building.position.set(Math.sin(angle) * radius, height / 2 - 0.52, -160 + Math.cos(angle) * radius);
      building.rotation.y = angle * 0.7 + hash(i * 2.7);
      buildings.add(building);

      const windows = new THREE.Mesh(new THREE.BoxGeometry(width * 0.73, height * 0.65, 0.03), windowMaterial);
      windows.position.copy(building.position);
      windows.position.z += depth / 2 + 0.025;
      windows.rotation.y = building.rotation.y;
      buildings.add(windows);
    }
    scene.add(buildings);

    const controlPoints = [
      new THREE.Vector3(-4, 4, 18),
      new THREE.Vector3(-2, 7, -6),
      new THREE.Vector3(1, 15, -35),
      new THREE.Vector3(-8, 29, -68),
      new THREE.Vector3(5, 48, -98),
      new THREE.Vector3(25, 51, -116),
      new THREE.Vector3(34, 35, -138),
      new THREE.Vector3(18, 7, -161),
      new THREE.Vector3(-9, 2.5, -172),
      new THREE.Vector3(-41, 9, -163),
      new THREE.Vector3(-62, 29, -132),
      new THREE.Vector3(-59, 44, -98),
      new THREE.Vector3(-35, 37, -72),
      new THREE.Vector3(-7, 12, -82),
      new THREE.Vector3(13, 13, -111),
      new THREE.Vector3(12, 35, -144),
      new THREE.Vector3(-5, 52, -156),
      new THREE.Vector3(-25, 55, -135),
      new THREE.Vector3(-20, 37, -107),
      new THREE.Vector3(10, 18, -94),
      new THREE.Vector3(45, 15, -72),
      new THREE.Vector3(61, 25, -37),
      new THREE.Vector3(44, 35, -5),
      new THREE.Vector3(13, 21, 10)
    ];
    const rideCurve = new THREE.CatmullRomCurve3(controlPoints, true, "centripetal", 0.36);
    const curveLength = rideCurve.getLength();

    function getFrame(u, result) {
      const point = rideCurve.getPointAt(u);
      const tangent = rideCurve.getTangentAt(u).normalize();
      const baseSide = new THREE.Vector3().crossVectors(worldUp, tangent);
      if (baseSide.lengthSq() < 0.001) baseSide.set(1, 0, 0);
      baseSide.normalize();
      const baseUp = new THREE.Vector3().crossVectors(tangent, baseSide).normalize();
      const bank = Math.sin(u * Math.PI * 6.0 + 0.25) * 0.36
        + Math.sin(u * Math.PI * 12.0 - 0.2) * 0.12;
      const c = Math.cos(bank);
      const s = Math.sin(bank);
      result.point.copy(point);
      result.tangent.copy(tangent);
      result.side.copy(baseSide).multiplyScalar(c).addScaledVector(baseUp, s).normalize();
      result.up.copy(baseUp).multiplyScalar(c).addScaledVector(baseSide, -s).normalize();
      return result;
    }

    const railLeft = [];
    const railRight = [];
    const railGlowLeft = [];
    const railGlowRight = [];
    const trackSamples = 680;
    for (let i = 0; i < trackSamples; i++) {
      const frame = getFrame(i / trackSamples, scratch);
      railLeft.push(frame.point.clone().addScaledVector(frame.side, -1.06).addScaledVector(frame.up, -0.08));
      railRight.push(frame.point.clone().addScaledVector(frame.side, 1.06).addScaledVector(frame.up, -0.08));
      railGlowLeft.push(frame.point.clone().addScaledVector(frame.side, -1.06).addScaledVector(frame.up, -0.26));
      railGlowRight.push(frame.point.clone().addScaledVector(frame.side, 1.06).addScaledVector(frame.up, -0.26));
    }

    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0xc2daee,
      emissive: 0x173b57,
      emissiveIntensity: 0.45,
      metalness: 0.92,
      roughness: 0.16
    });
    const glowRailMaterial = new THREE.MeshStandardMaterial({
      color: 0x3ccfe8,
      emissive: 0x16b9d6,
      emissiveIntensity: 2.25,
      metalness: 0.5,
      roughness: 0.22
    });
    const railCurveLeft = new THREE.CatmullRomCurve3(railLeft, true, "centripetal", 0.1);
    const railCurveRight = new THREE.CatmullRomCurve3(railRight, true, "centripetal", 0.1);
    const glowCurveLeft = new THREE.CatmullRomCurve3(railGlowLeft, true, "centripetal", 0.1);
    const glowCurveRight = new THREE.CatmullRomCurve3(railGlowRight, true, "centripetal", 0.1);
    const railGeometryL = new THREE.TubeGeometry(railCurveLeft, 900, 0.105, 7, true);
    const railGeometryR = new THREE.TubeGeometry(railCurveRight, 900, 0.105, 7, true);
    const glowGeometryL = new THREE.TubeGeometry(glowCurveLeft, 900, 0.036, 5, true);
    const glowGeometryR = new THREE.TubeGeometry(glowCurveRight, 900, 0.036, 5, true);
    scene.add(new THREE.Mesh(railGeometryL, railMaterial));
    scene.add(new THREE.Mesh(railGeometryR, railMaterial));
    scene.add(new THREE.Mesh(glowGeometryL, glowRailMaterial));
    scene.add(new THREE.Mesh(glowGeometryR, glowRailMaterial));

    const sleeperGeometry = new THREE.BoxGeometry(2.72, 0.13, 0.31);
    const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x142231, metalness: 0.77, roughness: 0.36 });
    const spineGeometry = new THREE.BoxGeometry(0.22, 0.19, 0.39);
    const spineMaterial = new THREE.MeshStandardMaterial({ color: 0x28526c, metalness: 0.88, roughness: 0.25 });
    const supportMaterial = new THREE.MeshStandardMaterial({ color: 0x173a4d, metalness: 0.85, roughness: 0.23 });

    function orientObject(object, frame, position) {
      scratch.matrix.makeBasis(frame.side, frame.up, frame.tangent);
      object.quaternion.setFromRotationMatrix(scratch.matrix);
      object.position.copy(position);
    }

    for (let i = 0; i < 280; i++) {
      const u = i / 280;
      const frame = getFrame(u, scratch);
      const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
      orientObject(sleeper, frame, frame.point.clone().addScaledVector(frame.up, -0.25));
      scene.add(sleeper);

      const spine = new THREE.Mesh(spineGeometry, spineMaterial);
      orientObject(spine, frame, frame.point.clone().addScaledVector(frame.up, -0.54));
      scene.add(spine);

      if (i % 14 === 0 && frame.point.y > 4) {
        const height = frame.point.y + 0.16;
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.21, height, 8), supportMaterial);
        pole.position.set(frame.point.x, height / 2 - 0.58, frame.point.z);
        scene.add(pole);

        const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.78, 0.18, 12), sleeperMaterial);
        foot.position.set(frame.point.x, -0.54, frame.point.z);
        scene.add(foot);
      }
    }

    const gateMaterial = new THREE.MeshStandardMaterial({
      color: 0x95edff,
      emissive: 0x35d8ff,
      emissiveIntensity: 2.1,
      metalness: 0.48,
      roughness: 0.17
    });
    const gates = [];
    const gatePositions = [0.042, 0.153, 0.302, 0.443, 0.58, 0.708, 0.84, 0.946];
    for (let i = 0; i < gatePositions.length; i++) {
      const u = gatePositions[i];
      const frame = getFrame(u, scratch);
      const gate = new THREE.Group();
      const ring = new THREE.Mesh(new THREE.TorusGeometry(3.35, 0.055, 7, 44), gateMaterial);
      gate.add(ring);
      const innerRing = new THREE.Mesh(
        new THREE.TorusGeometry(2.73, 0.018, 5, 32),
        new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffb472 : 0x76efff, transparent: true, opacity: 0.78 })
      );
      gate.add(innerRing);
      scratch.matrix.makeBasis(frame.side, frame.up, frame.tangent);
      gate.quaternion.setFromRotationMatrix(scratch.matrix);
      gate.position.copy(frame.point).addScaledVector(frame.up, 1.25);
      scene.add(gate);
      gates.push(gate);
    }

    const beaconMaterial = new THREE.MeshBasicMaterial({ color: 0xff8f5d });
    for (let i = 0; i < 70; i++) {
      const u = i / 70;
      const frame = getFrame(u, scratch);
      const side = i % 2 ? -1 : 1;
      const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), beaconMaterial);
      beacon.position.copy(frame.point).addScaledVector(frame.side, side * 1.48).addScaledVector(frame.up, 0.02);
      scene.add(beacon);
    }

    const windGeometry = new THREE.BufferGeometry();
    const windPositions = new Float32Array(330 * 3);
    const windSeeds = [];
    for (let i = 0; i < 330; i++) {
      windSeeds.push({
        angle: hash(i * 2.4) * Math.PI * 2,
        distance: 4 + hash(i * 8.1) * 42,
        height: -5 + hash(i * 5.3) * 20,
        drift: hash(i * 1.2)
      });
    }
    windGeometry.setAttribute("position", new THREE.BufferAttribute(windPositions, 3));
    const wind = new THREE.Points(
      windGeometry,
      new THREE.PointsMaterial({ color: 0xcdfaff, size: 0.07, transparent: true, opacity: 0.68, depthWrite: false })
    );
    scene.add(wind);

    const car = new THREE.Group();
    const carBodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x172638,
      metalness: 0.92,
      roughness: 0.2,
      emissive: 0x07111c,
      emissiveIntensity: 0.6
    });
    const carAccentMaterial = new THREE.MeshStandardMaterial({
      color: 0x48e9ff,
      emissive: 0x1ebfd8,
      emissiveIntensity: 2.3,
      metalness: 0.5,
      roughness: 0.17
    });
    const hood = new THREE.Mesh(new THREE.BoxGeometry(2.18, 0.26, 2.78), carBodyMaterial);
    hood.position.set(0, -1.2, -2.23);
    car.add(hood);
    const dash = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.045, 0.1), carAccentMaterial);
    dash.position.set(0, -0.99, -3.2);
    car.add(dash);
    const leftFin = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.25, 1.15), carBodyMaterial);
    leftFin.position.set(-1.16, -1.08, -2.4);
    car.add(leftFin);
    const rightFin = leftFin.clone();
    rightFin.position.x *= -1;
    car.add(rightFin);
    camera.add(car);

    const speedEl = document.getElementById("speed");
    const altitudeEl = document.getElementById("altitude");
    const progressEl = document.getElementById("progress");
    const lapEl = document.getElementById("lap");

    let rideU = 0.004;
    let elapsed = 0;

    function updateWind(time) {
      const array = windGeometry.attributes.position.array;
      for (let i = 0; i < windSeeds.length; i++) {
        const seed = windSeeds[i];
        const phase = (time * (0.36 + seed.drift * 0.7) + seed.drift * 3.0) % 1;
        const distance = seed.distance + phase * 28;
        array[i * 3] = camera.position.x + Math.cos(seed.angle) * distance;
        array[i * 3 + 1] = camera.position.y + seed.height + Math.sin(time * 1.4 + i) * 0.2;
        array[i * 3 + 2] = camera.position.z + Math.sin(seed.angle) * distance;
      }
      windGeometry.attributes.position.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.06);
      elapsed += delta;
      const frame = getFrame(rideU, scratch);
      const downhill = clamp(-frame.tangent.y * 0.7 + 0.32, 0, 1);
      const speed = 25 + downhill * 42 + Math.sin(elapsed * 0.85) * 1.1;
      rideU = (rideU + (speed * delta) / curveLength) % 1;

      const nextFrame = getFrame(rideU, scratch);
      camera.position.copy(nextFrame.point)
        .addScaledVector(nextFrame.up, 1.04)
        .addScaledVector(nextFrame.tangent, -0.58);
      camera.up.copy(nextFrame.up);
      camera.lookAt(
        scratch.target.copy(nextFrame.point)
          .addScaledVector(nextFrame.tangent, 19)
          .addScaledVector(nextFrame.up, 1.14)
      );

      car.rotation.z = Math.sin(elapsed * 5.1) * 0.008;
      car.rotation.x = Math.sin(elapsed * 3.4) * 0.006;
      stars.rotation.y += delta * 0.0014;
      sunHalo.material.opacity = 0.24 + Math.sin(elapsed * 1.3) * 0.035;
      gates.forEach(function(gate, index) {
        gate.children[0].material.emissiveIntensity = 1.65 + Math.sin(elapsed * 2.3 + index) * 0.55;
      });

      updateWind(elapsed);
      const displayedSpeed = Math.round(speed * 3.6);
      const displayedAltitude = Math.max(0, Math.round(nextFrame.point.y * 7.7));
      speedEl.textContent = String(displayedSpeed).padStart(3, "0") + " km/h";
      altitudeEl.textContent = String(displayedAltitude).padStart(4, "0") + " m";
      progressEl.style.width = (rideU * 100).toFixed(1) + "%";
      const seconds = Math.floor(elapsed % 60);
      lapEl.textContent = "00:" + String(seconds).padStart(2, "0");

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
