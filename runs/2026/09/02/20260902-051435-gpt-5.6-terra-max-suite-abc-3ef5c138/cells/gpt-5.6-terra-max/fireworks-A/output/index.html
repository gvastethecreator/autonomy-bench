<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Midnight Fireworks</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #050714;
      --surface: rgba(10, 14, 34, 0.72);
      --surface-strong: rgba(14, 19, 45, 0.91);
      --line: rgba(218, 229, 255, 0.16);
      --ink: #f8f3df;
      --ink-muted: #bdc4dc;
      --primary: #84f1dd;
      --primary-deep: #38c7b0;
      --spark: #ffd58a;
      --radius: 16px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --surface: rgba(246, 241, 227, 0.77);
      --surface-strong: rgba(253, 250, 240, 0.93);
      --line: rgba(35, 42, 77, 0.18);
      --ink: #19203d;
      --ink-muted: #505a7c;
      --primary: #087c74;
      --primary-deep: #07645d;
      --spark: #9b5f11;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
    }

    button, input { font: inherit; }

    .sky {
      position: relative;
      min-height: 100dvh;
      isolation: isolate;
      overflow: hidden;
      background: #050714;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      outline: none;
    }

    canvas:focus-visible { outline: 3px solid var(--primary); outline-offset: -8px; }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(rgba(255,255,255,.22) .45px, transparent .65px);
      background-size: 4px 4px;
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: clamp(22px, 4vw, 46px);
      pointer-events: none;
    }

    .brand { pointer-events: auto; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.45rem, 3vw, 2.35rem);
      font-weight: 660;
      letter-spacing: -.05em;
      line-height: 1;
      text-wrap: balance;
    }

    .hint {
      max-width: 25rem;
      margin: 11px 0 0;
      color: var(--ink-muted);
      font-size: .84rem;
      line-height: 1.45;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .icon-button:hover { transform: translateY(-2px); border-color: var(--primary); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

    .controls {
      position: absolute;
      z-index: 3;
      right: clamp(16px, 4vw, 46px);
      bottom: clamp(16px, 4vw, 40px);
      width: min(25rem, calc(100vw - 32px));
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      backdrop-filter: blur(18px) saturate(1.15);
    }

    .control-row { display: flex; align-items: center; gap: 9px; }
    .control-row + .control-row { margin-top: 14px; }

    .launch {
      flex: 1;
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), #a1d8ff);
      color: #062128;
      cursor: pointer;
      font-size: .91rem;
      font-weight: 780;
      letter-spacing: .01em;
      transition: transform .2s ease, filter .2s ease;
    }

    .launch:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .launch:active { transform: translateY(1px) scale(.99); }

    .small-button {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
      color: var(--ink);
      cursor: pointer;
      font-size: .79rem;
      font-weight: 650;
      transition: border-color .2s ease, background .2s ease;
    }

    .small-button:hover, .small-button[aria-pressed="true"] {
      border-color: var(--primary);
      background: rgba(132, 241, 221, .12);
    }

    .separator {
      width: 1px;
      height: 25px;
      background: var(--line);
    }

    .label {
      min-width: 66px;
      color: var(--ink-muted);
      font-size: .7rem;
      font-weight: 720;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .palette { display: flex; gap: 7px; }

    .swatch {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 13px var(--swatch);
      cursor: pointer;
    }

    .swatch[aria-pressed="true"] { border-color: var(--ink); transform: scale(1.13); }

    .range-wrap { flex: 1; display: flex; align-items: center; gap: 9px; }
    input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
    output { min-width: 26px; color: var(--ink); font-size: .78rem; font-variant-numeric: tabular-nums; text-align: right; }

    .status {
      position: absolute;
      z-index: 2;
      left: clamp(18px, 4vw, 46px);
      bottom: clamp(19px, 4vw, 42px);
      max-width: 21rem;
      color: var(--ink-muted);
      font-size: .75rem;
      letter-spacing: .02em;
      line-height: 1.4;
      pointer-events: none;
    }

    .status strong { color: var(--spark); font-weight: 720; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 620px) {
      .topbar { padding: 25px 22px; }
      .hint { max-width: 16rem; font-size: .76rem; }
      .controls { right: 16px; bottom: 16px; padding: 13px; }
      .control-row + .control-row { margin-top: 10px; }
      .status { display: none; }
      .small-button { padding: 0 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <main class="sky" aria-label="Interactive fireworks display">
    <canvas id="sky" tabindex="0" role="img" aria-label="An animated night sky with fireworks. Click in the sky or press space to launch a firework."></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">A night over the river</p>
        <h1>Midnight fireworks</h1>
        <p class="hint">Choose a color, then click anywhere in the sky to paint it with light.</p>
      </div>
      <button class="icon-button" id="theme" type="button" aria-label="Use light interface" title="Toggle interface theme">◐</button>
    </header>

    <section class="controls" aria-label="Fireworks controls">
      <div class="control-row">
        <button class="launch" id="finale" type="button">Launch finale</button>
        <button class="small-button" id="pause" type="button" aria-pressed="false">Pause</button>
        <button class="small-button" id="auto" type="button" aria-pressed="true">Auto</button>
      </div>
      <div class="control-row">
        <span class="label">Color</span>
        <div class="palette" aria-label="Firework color">
          <button class="swatch" type="button" data-palette="0" aria-label="Spectrum colors" aria-pressed="true" style="--swatch: conic-gradient(#ff5370, #ffd166, #8cffc1, #6ab7ff, #c084fc, #ff5370)"></button>
          <button class="swatch" type="button" data-palette="1" aria-label="Gold colors" aria-pressed="false" style="--swatch: #ffc857"></button>
          <button class="swatch" type="button" data-palette="2" aria-label="Rose colors" aria-pressed="false" style="--swatch: #ff6f91"></button>
          <button class="swatch" type="button" data-palette="3" aria-label="Ocean colors" aria-pressed="false" style="--swatch: #70d6ff"></button>
        </div>
        <span class="separator" aria-hidden="true"></span>
        <label class="label" for="intensity">Burst</label>
        <div class="range-wrap">
          <input id="intensity" type="range" min="1" max="3" value="2" step="1" aria-label="Burst intensity">
          <output id="intensity-value" for="intensity">2</output>
        </div>
      </div>
    </section>

    <p class="status" id="status" aria-live="polite"><strong>Auto show on</strong> · click the sky to launch a firework</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');
      const finaleButton = document.getElementById('finale');
      const pauseButton = document.getElementById('pause');
      const autoButton = document.getElementById('auto');
      const intensityInput = document.getElementById('intensity');
      const intensityValue = document.getElementById('intensity-value');
      const themeButton = document.getElementById('theme');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      const palettes = [
        [350, 16, 45, 77, 118, 202, 270, 312],
        [31, 39, 47, 52],
        [334, 348, 358, 15],
        [172, 193, 208, 223]
      ];

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        paused: false,
        auto: !reducedMotion.matches,
        intensity: 2,
        palette: 0,
        lastAuto: 0,
        nextAuto: 900,
        lastTime: performance.now(),
        rockets: [],
        particles: [],
        rings: [],
        queued: [],
        stars: Array.from({ length: 98 }, () => ({
          x: Math.random(), y: Math.random() * .77, size: .3 + Math.random() * 1.45,
          pulse: Math.random() * Math.PI * 2, glow: .32 + Math.random() * .68
        }))
      };

      const choose = (items) => items[Math.floor(Math.random() * items.length)];
      const between = (min, max) => min + Math.random() * (max - min);
      const signed = value => (Math.random() < .5 ? -1 : 1) * value;
      const hueFor = () => choose(palettes[state.palette]);

      function resize() {
        const rect = canvas.getBoundingClientRect();
        state.width = rect.width;
        state.height = rect.height;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function setStatus(text, emphasis) {
        status.innerHTML = `<strong>${emphasis}</strong> · ${text}`;
      }

      function launch(targetX, targetY, kind) {
        const x = Math.max(state.width * .1, Math.min(state.width * .9, targetX));
        const y = Math.max(state.height * .12, Math.min(state.height * .66, targetY));
        state.rockets.push({
          x: state.width * (.19 + Math.random() * .62),
          y: state.height + 16,
          targetX: x,
          targetY: y,
          vx: 0,
          vy: between(-8.5, -7.1),
          hue: hueFor(),
          kind: kind || choose(['chrysanthemum', 'ring', 'willow', 'palm']),
          trail: [],
          age: 0
        });
      }

      function sparkle(x, y, hue, speed, angle, life, gravity, size, trailLength) {
        state.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hue,
          life,
          age: 0,
          gravity,
          size,
          friction: between(.975, .988),
          twinkle: Math.random() * Math.PI * 2,
          trail: [],
          trailLength,
          flicker: Math.random() < .25
        });
      }

      function explode(x, y, hue, kind) {
        const power = state.intensity;
        const count = Math.round((kind === 'willow' ? 72 : kind === 'palm' ? 38 : 105) * (0.65 + power * .28));
        const baseHue = kind === 'willow' ? 42 : hue;

        state.rings.push({ x, y, age: 0, life: 420, hue: baseHue, radius: 6 });

        for (let i = 0; i < count; i += 1) {
          let angle;
          let speed;
          let particleHue = baseHue;
          let life = between(1050, 1770);
          let gravity = .033;
          let size = between(1.05, 2.25);
          let trailLength = 8;

          if (kind === 'ring') {
            angle = (Math.PI * 2 * i) / count + signed(between(0, .025));
            speed = between(2.1, 3.4);
            life = between(1120, 1510);
            particleHue = i % 3 === 0 ? (baseHue + 38) % 360 : baseHue;
          } else if (kind === 'willow') {
            angle = Math.PI * 2 * i / count + signed(between(0, .07));
            speed = between(1.35, 3.5) * (i % 5 === 0 ? 1.2 : 1);
            life = between(1550, 2500);
            gravity = .047;
            size = between(1.1, 2.1);
            trailLength = 16;
          } else if (kind === 'palm') {
            angle = (Math.PI * 2 * i) / count + signed(between(0, .06));
            speed = between(2.3, 4.7);
            life = between(1600, 2350);
            gravity = .042;
            particleHue = i % 2 ? baseHue : 50;
            size = between(1.2, 2.5);
            trailLength = 18;
          } else {
            angle = Math.random() * Math.PI * 2;
            speed = Math.pow(Math.random(), .37) * 4.2 + .55;
            life = between(1050, 1800);
            particleHue = Math.random() < .16 ? (baseHue + 32) % 360 : baseHue;
          }
          sparkle(x, y, particleHue, speed, angle, life, gravity, size, trailLength);
        }

        const crackles = Math.round(10 * power);
        for (let i = 0; i < crackles; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          sparkle(x, y, 48, between(.5, 2.8), angle, between(420, 820), .018, between(.6, 1.3), 3);
        }
      }

      function startFinale() {
        const kinds = ['ring', 'chrysanthemum', 'willow', 'palm', 'chrysanthemum', 'ring', 'willow'];
        kinds.forEach((kind, index) => {
          state.queued.push({
            wait: index * 145,
            x: state.width * (.16 + (index / (kinds.length - 1)) * .68),
            y: state.height * between(.22, .47),
            kind
          });
        });
        setStatus('seven rockets are rising', 'Finale launched');
      }

      function update(delta) {
        for (let i = state.queued.length - 1; i >= 0; i -= 1) {
          const queued = state.queued[i];
          queued.wait -= delta;
          if (queued.wait <= 0) {
            launch(queued.x, queued.y, queued.kind);
            state.queued.splice(i, 1);
          }
        }

        for (let i = state.rockets.length - 1; i >= 0; i -= 1) {
          const rocket = state.rockets[i];
          rocket.age += delta;
          const frame = delta / 16.667;
          rocket.vx += (rocket.targetX - rocket.x) * .00042 * frame;
          rocket.vx *= .994;
          rocket.x += rocket.vx * frame;
          rocket.y += rocket.vy * frame;
          rocket.vy += .028 * frame;
          rocket.trail.push({ x: rocket.x, y: rocket.y });
          if (rocket.trail.length > 12) rocket.trail.shift();

          if (rocket.y <= rocket.targetY || rocket.vy >= -.45) {
            explode(rocket.x, rocket.y, rocket.hue, rocket.kind);
            state.rockets.splice(i, 1);
          }
        }

        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const particle = state.particles[i];
          const frame = delta / 16.667;
          particle.age += delta;
          particle.vx *= Math.pow(particle.friction, frame);
          particle.vy = particle.vy * Math.pow(particle.friction, frame) + particle.gravity * frame;
          particle.x += particle.vx * frame;
          particle.y += particle.vy * frame;
          particle.trail.push({ x: particle.x, y: particle.y });
          if (particle.trail.length > particle.trailLength) particle.trail.shift();
          if (particle.age >= particle.life) state.particles.splice(i, 1);
        }

        for (let i = state.rings.length - 1; i >= 0; i -= 1) {
          state.rings[i].age += delta;
          state.rings[i].radius += delta * .12;
          if (state.rings[i].age >= state.rings[i].life) state.rings.splice(i, 1);
        }

        if (state.auto) {
          state.lastAuto += delta;
          if (state.lastAuto >= state.nextAuto) {
            launch(state.width * between(.18, .82), state.height * between(.2, .5));
            state.lastAuto = 0;
            state.nextAuto = between(760, 1550);
          }
        }
      }

      function drawBackground(time) {
        const { width: w, height: h } = state;
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#050717');
        sky.addColorStop(.48, '#101c45');
        sky.addColorStop(.76, '#39235a');
        sky.addColorStop(1, '#11122d');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(w * .72, h * .35, 0, w * .72, h * .35, Math.max(w, h) * .56);
        glow.addColorStop(0, 'rgba(94, 114, 255, .17)');
        glow.addColorStop(1, 'rgba(94, 114, 255, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        state.stars.forEach(star => {
          const alpha = star.glow * (.52 + Math.sin(time * .0013 + star.pulse) * .28);
          ctx.fillStyle = `rgba(235, 243, 255, ${Math.max(.08, alpha)})`;
          ctx.beginPath();
          ctx.arc(star.x * w, star.y * h, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();

        const moonX = w * .16;
        const moonY = h * .19;
        const moonGlow = ctx.createRadialGradient(moonX, moonY, 1, moonX, moonY, Math.min(w, h) * .14);
        moonGlow.addColorStop(0, 'rgba(255, 240, 203, .17)');
        moonGlow.addColorStop(1, 'rgba(255, 240, 203, 0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, moonY, Math.min(w, h) * .14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff0cc';
        ctx.beginPath();
        ctx.arc(moonX, moonY, Math.max(10, Math.min(w, h) * .027), 0, Math.PI * 2);
        ctx.fill();

        const horizon = h * .78;
        ctx.fillStyle = '#0c1030';
        ctx.beginPath();
        ctx.moveTo(0, horizon + 18);
        for (let x = 0; x <= w + 40; x += 40) {
          ctx.lineTo(x, horizon - 10 - Math.sin(x * .025) * 15 - Math.random() * 0);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#060817';
        let x = 0;
        let building = 0;
        while (x < w) {
          const bw = 25 + ((building * 17) % 42);
          const bh = 24 + ((building * 37) % 90);
          ctx.fillRect(x, h - bh, bw, bh);
          if (building % 2 === 0) {
            ctx.fillStyle = 'rgba(255, 207, 109, .22)';
            const rows = Math.max(1, Math.floor(bh / 16));
            for (let r = 0; r < rows; r += 1) {
              if ((r + building) % 3 !== 0) ctx.fillRect(x + 7, h - bh + 8 + r * 13, 3, 4);
            }
            ctx.fillStyle = '#060817';
          }
          x += bw + 5;
          building += 1;
        }

        const water = ctx.createLinearGradient(0, horizon, 0, h);
        water.addColorStop(0, 'rgba(17, 27, 72, .24)');
        water.addColorStop(1, 'rgba(2, 3, 14, .65)');
        ctx.fillStyle = water;
        ctx.fillRect(0, h - 38, w, 38);
      }

      function trace(history, color, lineWidth) {
        if (history.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(history[0].x, history[0].y);
        for (let i = 1; i < history.length; i += 1) ctx.lineTo(history[i].x, history[i].y);
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      function drawFireworks() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        state.rings.forEach(ring => {
          const alpha = Math.max(0, 1 - ring.age / ring.life);
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${ring.hue}, 100%, 78%, ${alpha * .36})`;
          ctx.lineWidth = 1.6;
          ctx.shadowColor = `hsl(${ring.hue}, 100%, 70%)`;
          ctx.shadowBlur = 16;
          ctx.stroke();
        });

        state.rockets.forEach(rocket => {
          trace(rocket.trail, `hsla(${rocket.hue}, 100%, 83%, .53)`, 1.3);
          ctx.fillStyle = `hsl(${rocket.hue}, 100%, 86%)`;
          ctx.shadowColor = `hsl(${rocket.hue}, 100%, 75%)`;
          ctx.shadowBlur = 19;
          ctx.beginPath();
          ctx.arc(rocket.x, rocket.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        });

        state.particles.forEach(particle => {
          const p = particle.age / particle.life;
          const fade = Math.max(0, 1 - p * p);
          const twinkle = particle.flicker ? .45 + Math.sin(particle.twinkle + particle.age * .024) * .45 : 1;
          trace(particle.trail, `hsla(${particle.hue}, 100%, ${67 + fade * 24}%, ${fade * .38 * twinkle})`, particle.size * .72);
          if (fade < .04) return;
          ctx.fillStyle = `hsla(${particle.hue}, 100%, ${67 + fade * 26}%, ${fade * twinkle})`;
          ctx.shadowColor = `hsl(${particle.hue}, 100%, 74%)`;
          ctx.shadowBlur = 8 + particle.size * 5;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size * (.5 + fade * .55), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function draw(time) {
        ctx.clearRect(0, 0, state.width, state.height);
        drawBackground(time);
        drawFireworks();
      }

      function frame(time) {
        const delta = Math.min(45, Math.max(0, time - state.lastTime));
        state.lastTime = time;
        if (!state.paused) update(delta);
        draw(time);
        requestAnimationFrame(frame);
      }

      function launchAtEvent(event) {
        const rect = canvas.getBoundingClientRect();
        launch(event.clientX - rect.left, event.clientY - rect.top);
        setStatus('a new burst is on its way', 'Firework launched');
      }

      function seedShow() {
        launch(state.width * .29, state.height * .39, 'willow');
        state.queued.push({ wait: 390, x: state.width * .61, y: state.height * .32, kind: 'ring' });
        state.queued.push({ wait: 720, x: state.width * .76, y: state.height * .48, kind: 'chrysanthemum' });
      }

      canvas.addEventListener('pointerdown', launchAtEvent);
      canvas.addEventListener('keydown', event => {
        if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          launch(state.width * between(.2, .8), state.height * between(.22, .5));
          setStatus('keyboard launch in the night sky', 'Firework launched');
        }
      });

      finaleButton.addEventListener('click', startFinale);
      pauseButton.addEventListener('click', () => {
        state.paused = !state.paused;
        pauseButton.textContent = state.paused ? 'Resume' : 'Pause';
        pauseButton.setAttribute('aria-pressed', String(state.paused));
        setStatus(state.paused ? 'the sky is holding its breath' : 'the show is moving again', state.paused ? 'Paused' : 'Resumed');
      });
      autoButton.addEventListener('click', () => {
        state.auto = !state.auto;
        autoButton.setAttribute('aria-pressed', String(state.auto));
        setStatus(state.auto ? 'new bursts will arrive on their own' : 'launch whenever you are ready', state.auto ? 'Auto show on' : 'Auto show off');
      });
      intensityInput.addEventListener('input', () => {
        state.intensity = Number(intensityInput.value);
        intensityValue.value = String(state.intensity);
        intensityValue.textContent = String(state.intensity);
      });
      document.querySelectorAll('.swatch').forEach(button => {
        button.addEventListener('click', () => {
          state.palette = Number(button.dataset.palette);
          document.querySelectorAll('.swatch').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
          setStatus(`${button.getAttribute('aria-label')} selected`, 'Color ready');
        });
      });
      themeButton.addEventListener('click', () => {
        const root = document.documentElement;
        const light = root.dataset.theme !== 'light';
        root.dataset.theme = light ? 'light' : 'dark';
        themeButton.setAttribute('aria-label', light ? 'Use dark interface' : 'Use light interface');
        try { localStorage.setItem('midnight-fireworks-theme', light ? 'light' : 'dark'); } catch (error) { /* preference remains for this view */ }
      });
      try {
        const storedTheme = localStorage.getItem('midnight-fireworks-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
          themeButton.setAttribute('aria-label', storedTheme === 'light' ? 'Use dark interface' : 'Use light interface');
        }
      } catch (error) { /* storage is optional */ }

      reducedMotion.addEventListener('change', event => {
        if (event.matches) {
          state.auto = false;
          autoButton.setAttribute('aria-pressed', 'false');
          setStatus('automatic launches are paused for reduced motion', 'Motion reduced');
        }
      });
      window.addEventListener('resize', resize, { passive: true });

      resize();
      seedShow();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
