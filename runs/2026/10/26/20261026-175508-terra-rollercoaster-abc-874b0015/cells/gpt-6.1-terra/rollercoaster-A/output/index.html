<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyline Run — a rollercoaster ride</title>
<style>
  * { box-sizing: border-box } html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#a6dce3; font-family:system-ui,-apple-system,sans-serif }
  canvas { display:block; width:100%; height:100% }
  .hud { position:absolute; inset:0; pointer-events:none; color:white; text-shadow:0 2px 12px #153b4899 }
  .top { position:absolute; top:30px; left:34px; display:flex; align-items:center; gap:13px }
  .badge { width:38px; height:38px; border:1px solid #ffffffa8; border-radius:50%; display:grid; place-items:center; font-size:20px }
  .brand { font-size:11px; letter-spacing:.27em; font-weight:750; text-transform:uppercase }
  .brand span { display:block; font-size:10px; letter-spacing:.12em; font-weight:400; opacity:.8; margin-top:3px }
  .bottom { position:absolute; bottom:33px; left:34px }
  .eyebrow { font-size:10px; letter-spacing:.25em; font-weight:700; opacity:.85 }
  h1 { margin:7px 0 2px; font-size:clamp(32px,5vw,62px); line-height:1; letter-spacing:-.05em; font-weight:600 }
  .sub { font-size:12px; letter-spacing:.08em; opacity:.85; margin-top:10px }
  .right { position:absolute; bottom:38px; right:34px; text-align:right; font-size:10px; letter-spacing:.2em; font-weight:700 }
  .right strong { display:block; font-size:30px; letter-spacing:-.04em; margin-top:4px }
  .progress { width:120px; height:2px; background:#ffffff55; margin-top:9px; margin-left:auto }
  .progress i { display:block; height:100%; width:0; background:#fff }
  .hint { position:absolute; top:37px; right:34px; font-size:10px; letter-spacing:.16em; opacity:.9 }
  @media(max-width:600px){ .top{top:20px;left:20px}.hint{top:27px;right:20px;font-size:9px}.bottom{left:20px;bottom:24px}.right{right:20px;bottom:26px}.sub{font-size:10px}.progress{width:75px} }
</style>
</head>
<body>
<div class="hud"><div class="top"><div class="badge">↝</div><div class="brand">Skyline Run<span>THE ENDLESS RIDE</span></div></div><div class="hint">SOUND OFF · JUST ENJOY THE VIEW</div><div class="bottom"><div class="eyebrow">YOU'RE IN THE FRONT ROW</div><h1>Take the long way.</h1><div class="sub">A little escape, on repeat.</div></div><div class="right">LAP <strong id="lap">01</strong><div class="progress"><i id="progress"></i></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9dae2); scene.fog = new THREE.Fog(0xb4dce0, 100, 340);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .1, 600);
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12; document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f8ff,0x6a7854,2.2));
const sun=new THREE.DirectionalLight(0xffedcf,2.6); sun.position.set(-70,120,-60); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),new THREE.MeshStandardMaterial({color:0x8eaa79,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.y=-.2; scene.add(ground);
// A closed, gently banked course with a lift, a drop, and sweeping turns.
const points=[[-105,10,0],[-88,17,-53],[-45,31,-78],[2,57,-77],[46,48,-65],[83,15,-36],[99,10,9],[75,19,53],[32,28,71],[-12,14,55],[-48,8,31],[-80,8,28]].map(p=>new THREE.Vector3(...p));
const curve=new THREE.CatmullRomCurve3(points,true,'centripetal');
const samples=1000;
function frame(t){ const p=curve.getPointAt((t%1+1)%1); const f=curve.getTangentAt((t%1+1)%1).normalize(); let right=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize(); let up=new THREE.Vector3().crossVectors(right,f).normalize(); return {p,f,right,up}; }
const railMat=new THREE.MeshStandardMaterial({color:0xe54e39,metalness:.45,roughness:.35});
const tieMat=new THREE.MeshStandardMaterial({color:0xf8d2aa,metalness:.2,roughness:.55});
const supportMat=new THREE.MeshStandardMaterial({color:0x34595b,metalness:.35,roughness:.65});
function beam(a,b,r,mat){const d=new THREE.Vector3().subVectors(b,a); const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),6),mat); mesh.position.copy(a).add(b).multiplyScalar(.5); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()); scene.add(mesh);}
function rail(offset){const pts=[];for(let i=0;i<=samples;i++){const q=frame(i/samples);pts.push(q.p.clone().addScaledVector(q.right,offset));} const line=new THREE.CatmullRomCurve3(pts); const mesh=new THREE.Mesh(new THREE.TubeGeometry(line,samples,.22,7,false),railMat);scene.add(mesh)}
rail(-1.75); rail(1.75);
for(let i=0;i<250;i++){const q=frame(i/250); const a=q.p.clone().addScaledVector(q.right,-2),b=q.p.clone().addScaledVector(q.right,2);beam(a,b,.115,tieMat)}
for(let i=0;i<70;i++){const q=frame(i/70); for(const side of [-1,1]){const top=q.p.clone().addScaledVector(q.right,side*1.75); const foot=top.clone().addScaledVector(q.right,side*2.5);foot.y=0;beam(top,foot,.13,supportMat)} if(i%2===0){const top=q.p.clone();const foot=top.clone();foot.y=0;beam(top,foot,.11,supportMat)}}
// Distant, low-poly hills and an orchard of simple pines make motion easy to read.
const hillMat=new THREE.MeshStandardMaterial({color:0x779a80,roughness:1});
for(let i=0;i<26;i++){const a=i/26*Math.PI*2;const radius=235+(i%3)*30;const hill=new THREE.Mesh(new THREE.ConeGeometry(40+(i%4)*12,45+(i%5)*11,5),hillMat);hill.position.set(Math.cos(a)*radius,15,Math.sin(a)*radius);hill.rotation.y=i;scene.add(hill)}
let seed=7592; function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const trunkMat=new THREE.MeshStandardMaterial({color:0x7d624b});const leaves=[0x3d765e,0x52866a,0x6c9270].map(color=>new THREE.MeshStandardMaterial({color,roughness:1}));
for(let i=0;i<360;i++){let x=(random()-.5)*410,z=(random()-.5)*410;if(Math.abs(x)<115&&Math.abs(z)<100)continue;const h=4+random()*7;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,h*.4,5),trunkMat);trunk.position.set(x,h*.2,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(h*.28,h*.8,6),leaves[i%3]);crown.position.set(x,h*.65,z);scene.add(crown)}
// The front edge of the car is attached to the camera for a clear first-person view.
const car=new THREE.Group();camera.add(car);scene.add(camera);
const carMat=new THREE.MeshStandardMaterial({color:0xf1b85b,metalness:.35,roughness:.35});const darkMat=new THREE.MeshStandardMaterial({color:0x263f43,metalness:.45,roughness:.4});
const nose=new THREE.Mesh(new THREE.BoxGeometry(2.9,.42,1.2),carMat);nose.position.set(0,-1.18,-2.05);car.add(nose);
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,2.7,10),darkMat);bar.rotation.z=Math.PI/2;bar.position.set(0,-.77,-2);car.add(bar);
for(const x of [-1.25,1.25]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.5,8),darkMat);post.position.set(x,-1,-2);car.add(post)}
let distance=0, last=performance.now(), lap=1;
const lapEl=document.getElementById('lap'), progress=document.getElementById('progress');
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;let t=distance%1;const q=frame(t); // Speed responds to slope, while remaining continuously forward.
const speed=THREE.MathUtils.clamp(0.014-q.f.y*.009,.008,.023);distance+=dt*speed;t=distance%1;const v=frame(t);const look=frame(t+.004);camera.position.copy(v.p).addScaledVector(v.up,2.1);camera.up.copy(v.up);camera.lookAt(look.p.clone().addScaledVector(look.up,1.8));lap=Math.floor(distance)+1;lapEl.textContent=String(lap).padStart(2,'0');progress.style.width=(t*100)+'%';renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
