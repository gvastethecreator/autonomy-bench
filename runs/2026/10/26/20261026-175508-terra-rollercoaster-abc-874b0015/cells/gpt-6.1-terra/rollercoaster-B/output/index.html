</head><body><div id="scene"></div><header><div class="brand"><div class="mark">✳</div><div><strong>AFTERLIGHT</strong><small>THE INFINITE RIDE</small></div></div><div class="meta"><span class="live">LIVE EXPERIENCE</span><br>EST. 2026 · SOMEWHERE ELSE</div></header><div class="intro"><div class="eyebrow">01 / THE NIGHT SHIFT</div><h1>Chase<br><span>the horizon.</span></h1><p>A little escape above the clouds. Sit back, look ahead, and let the ride take you.</p></div><div class="bottom"><div class="status"><div class="metric"><label>Velocity</label><strong id="speed">84 <small>KM/H</small></strong></div><div class="divider"></div><div class="metric"><label>Elevation</label><strong id="height">120 <small>M</small></strong></div></div><div class="center-label"><b>✳</b> &nbsp; KEEP YOUR EYES ON THE HORIZON</div><div class="control"><div class="hint">SPACE TO PAUSE<br>ENJOY THE RIDE</div><button id="toggle" aria-label="Pause ride" title="Pause ride">Ⅱ</button></div></div><div class="progress"><i id="progress"></i></div>

<script type="module">
import * as THREE from 'three';
const container=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;container.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101c31);scene.fog=new THREE.FogExp2(0x192a40,.0021);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,2500);
scene.add(new THREE.HemisphereLight(0xb7d6f5,0x293337,2.1));const sunLight=new THREE.DirectionalLight(0xffbf8d,2.5);sunLight.position.set(-250,200,-400);scene.add(sunLight);
// A long, closed circuit allows the ride to play forever without a visible reset.
const points=[[-70,96,0],[-100,118,-150],[-60,162,-320],[80,182,-440],[260,105,-480],[410,48,-380],[430,68,-200],[360,126,-30],[190,150,80],[30,85,165],[-80,55,330],[-10,92,490],[170,155,530],[340,190,430],[420,135,260],[350,80,105],[200,70,-15],[60,93,-65]].map(p=>new THREE.Vector3(...p));
const curve=new THREE.CatmullRomCurve3(points,true,'catmullrom',.38);const segments=1600;const frames=curve.computeFrenetFrames(segments,true);
const trackMaterial=new THREE.MeshStandardMaterial({color:0xf5e5bd,metalness:.62,roughness:.3});const tieMat=new THREE.MeshStandardMaterial({color:0x61717a,metalness:.6,roughness:.4});const glowMat=new THREE.MeshBasicMaterial({color:0xc5ffa0});
function rail(offset, material, radius){const arr=[];for(let i=0;i<=segments;i++){const u=i/segments;arr.push(curve.getPointAt(u).addScaledVector(frames.binormals[i],offset));}const path=new THREE.CatmullRomCurve3(arr,true);const mesh=new THREE.Mesh(new THREE.TubeGeometry(path,segments,radius,7,true),material);scene.add(mesh)}
rail(-2.1,trackMaterial,.3);rail(2.1,trackMaterial,.3);rail(-1.73,glowMat,.045);rail(1.73,glowMat,.045);
const tieGeo=new THREE.BoxGeometry(5.2,.19,.38);for(let i=0;i<segments;i+=5){let p=curve.getPointAt(i/segments);let m=new THREE.Mesh(tieGeo,tieMat);const basis=new THREE.Matrix4().makeBasis(frames.binormals[i],frames.normals[i],frames.tangents[i]);m.quaternion.setFromRotationMatrix(basis);m.position.copy(p);scene.add(m)}
// Supports descend into the haze, grounding the impossible track.
const supportMat=new THREE.MeshStandardMaterial({color:0x425c68,metalness:.6,roughness:.6});for(let i=0;i<segments;i+=34){const p=curve.getPointAt(i/segments);if(p.y<8)continue;const h=p.y+12;const pole=new THREE.Mesh(new THREE.CylinderGeometry(.32,.8,h,6),supportMat);pole.position.set(p.x,-12+h/2,p.z);scene.add(pole);}
// Atmospheric sunset and a field of distant islands.
const skyGeo=new THREE.SphereGeometry(1800,32,16);const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{},vertexShader:'varying vec3 v; void main(){v=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 v; void main(){float h=normalize(v).y; vec3 horizon=vec3(.62,.40,.39); vec3 top=vec3(.025,.065,.14); vec3 low=vec3(.12,.19,.24); vec3 c=mix(horizon,top,smoothstep(-.02,.65,h)); c=mix(low,c,smoothstep(-.2,.02,h)); gl_FragColor=vec4(c,1.);}' });scene.add(new THREE.Mesh(skyGeo,skyMat));
const sun=new THREE.Mesh(new THREE.SphereGeometry(48,32,24),new THREE.MeshBasicMaterial({color:0xffb389}));sun.position.set(-750,80,-1100);scene.add(sun);
const water=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.MeshStandardMaterial({color:0x263e49,roughness:.9,metalness:.15}));water.rotation.x=-Math.PI/2;water.position.y=-27;scene.add(water);
let seed=37;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const islandMat=new THREE.MeshStandardMaterial({color:0x384b50,flatShading:true,roughness:1});for(let i=0;i<90;i++){let a=rand()*Math.PI*2,r=550+rand()*1450;let mesh=new THREE.Mesh(new THREE.ConeGeometry(40+rand()*130,40+rand()*140,5),islandMat);mesh.position.set(Math.cos(a)*r,-27,Math.sin(a)*r);mesh.rotation.y=rand()*6;scene.add(mesh)}
// Flecks in the distance make the scene feel alive without obscuring the track.
const stars=[];for(let i=0;i<300;i++){let a=rand()*Math.PI*2, y=100+rand()*700,r=900+rand()*650;stars.push(Math.cos(a)*r,y,Math.sin(a)*r)}const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffe4bd,size:2,sizeAttenuation:true})));
// The nose of the car is fixed in view, keeping the perspective unmistakably first-person.
const cockpit=new THREE.Group();camera.add(cockpit);scene.add(camera);const carMat=new THREE.MeshStandardMaterial({color:0x172b34,metalness:.65,roughness:.35});const nose=new THREE.Mesh(new THREE.BoxGeometry(6.4,.6,2),carMat);nose.position.set(0,-2.5,-4.5);cockpit.add(nose);const bar=new THREE.Mesh(new THREE.TorusGeometry(2.4,.15,8,40,Math.PI),trackMaterial);bar.position.set(0,-2.3,-4.1);bar.rotation.z=Math.PI;cockpit.add(bar);
let t=0,playing=true,last=performance.now(),speed=24;const clockLabel=document.getElementById('speed'),heightLabel=document.getElementById('height'),progress=document.getElementById('progress'),button=document.getElementById('toggle');function toggle(){playing=!playing;button.textContent=playing?'Ⅱ':'▶';button.setAttribute('aria-label',playing?'Pause ride':'Resume ride');button.title=playing?'Pause ride':'Resume ride';last=performance.now()}button.addEventListener('click',toggle);window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}});
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(playing){const ahead=curve.getTangentAt(t);const target=THREE.MathUtils.clamp(26-ahead.y*25,16,40);speed+= (target-speed)*dt*.5;t=(t+speed*dt/curve.getLength())%1}const idx=Math.floor(t*segments);const p=curve.getPointAt(t);const tangent=curve.getTangentAt(t);const up=frames.normals[idx].clone();if(up.y<0)up.negate();camera.position.copy(p).addScaledVector(up,2.4);camera.up.lerp(up,.035).normalize();const look=curve.getPointAt((t+.008)%1).addScaledVector(up,1.5);camera.lookAt(look);clockLabel.innerHTML=Math.round(speed*3.6)+' <small>KM/H</small>';heightLabel.innerHTML=Math.round(p.y+27)+' <small>M</small>';progress.style.width=(t*100)+'%';renderer.render(scene,camera)}requestAnimationFrame(animate);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
