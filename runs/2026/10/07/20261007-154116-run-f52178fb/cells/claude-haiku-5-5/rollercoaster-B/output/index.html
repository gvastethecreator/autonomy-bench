<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyline Run</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f22;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif;color:#f4efe6}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:16px;bottom:14px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000a}
  #speed{font-size:44px;font-weight:700;letter-spacing:-1px}
  #speed small{font-size:16px;font-weight:500;opacity:.7;margin-left:6px}
  #stats{font-size:13px;opacity:.75;margin-top:2px}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:#ff8a5b;width:0}
  #title{position:fixed;top:12%;width:100%;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:300;letter-spacing:.3em;text-transform:uppercase;transition:opacity 2s;pointer-events:none;text-shadow:0 2px 12px #000a}
  #title span{display:block;font-size:.35em;letter-spacing:.4em;opacity:.7;margin-top:.4em}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#2a1638aa,#0b0f22ee);cursor:pointer;z-index:2}
  #start div{border:1px solid #ffffff55;padding:18px 34px;border-radius:999px;letter-spacing:.25em;text-transform:uppercase;font-size:14px;background:#0b0f2288}
  #start:hover div{border-color:#ff8a5b;color:#ff8a5b}
  #mute{position:fixed;right:14px;bottom:12px;opacity:.6;font-size:12px;letter-spacing:.1em}
  .hide{opacity:0 !important;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="title" class="hide">Skyline Run<span>first person · continuous</span></div>
<div id="hud"><div id="speed">0<small>km/h</small></div><div id="stats"></div></div>
<div id="mute">M · mute</div>
<div id="bar"></div>
<div id="start"><div>Click to ride</div></div>
<script type="module">
import * as THREE from 'three';

// ---------- Track definition (plan x/z, height y, metres) ----------
const GAUGE = 1.5;
const LOOP_R = 15;
const LOOP_W = 5.5;     // lateral drift across the loop so the track does not cross itself
const SAMPLES = 6000;

const base = [
  [0, 2, -40], [0, 2, -14], [0, 2, 4],
  // station flat
  [0, 2.2, 22],
  // lift hill
  [0, 14, 38], [0, 30, 52], [0, 48, 66], [0, 64, 80],
  // crest and drop
  [0, 72, 92], [0, 62, 102], [0, 42, 116], [0, 20, 128], [0, 6, 138],
  // camelback
  [0, 16, 150], [0, 28, 162], [0, 22, 174], [0, 8, 184],
  // turn right toward +x
  [8, 6, 194], [22, 6, 201], [36, 6, 203],
];
const LOOP_AT = [36, 6, 203];
const LOOP_DIR = new THREE.Vector3(1, 0, 0);
const UP = new THREE.Vector3(0, 1, 0);
const LAT = new THREE.Vector3(0, 0, 1);

const pts = base.map(p => new THREE.Vector3(...p));
const P0 = new THREE.Vector3(...LOOP_AT);
const LOOP_N = 24;
for (let k = 1; k <= LOOP_N; k++) {
  const th = (k / LOOP_N) * Math.PI * 2;
  const p = P0.clone()
    .addScaledVector(LOOP_DIR, LOOP_R * Math.sin(th))
    .addScaledVector(UP, LOOP_R * (1 - Math.cos(th)))
    .addScaledVector(LAT, LOOP_W * th / (Math.PI * 2));
  pts.push(p);
}
// exit (after loop) continues heading +x, offset laterally
const exit = [
  [56, 6, 209], [78, 8, 212], [92, 14, 200], [96, 16, 170],
  [98, 14, 120], [98, 10, 60], [96, 6, 10], [92, 4, -18],
  [78, 2, -34], [60, 2, -40], [30, 2, -42], [8, 2, -44], [0, 2, -40],
];
exit.forEach(p => pts.push(new THREE.Vector3(...p)));
// closed loop: drop the duplicate closing point
pts.pop();

const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
const L = curve.getLength();

// ---------- Sampling, parallel-transport frames ----------
const pos = [], tan = [], nrm = [], bin = [];
const tmp = new THREE.Vector3();
for (let i = 0; i < SAMPLES; i++) {
  const u = i / SAMPLES;
  pos.push(curve.getPointAt(u));
  tan.push(curve.getTangentAt(u));
}
let n0 = new THREE.Vector3().crossVectors(tan[0], UP).normalize();
let n = n0.clone();
const frames = [];
for (let i = 0; i < SAMPLES; i++) {
  n.addScaledVector(tan[i], -n.dot(tan[i])).normalize();
  frames.push(n.clone());
}
// close holonomy: rotate each frame about its tangent so the transported normal meets the start
{
  const nEnd = frames[SAMPLES - 1];
  const a = Math.atan2(tmp.crossVectors(nEnd, n0).dot(tan[0]), nEnd.dot(n0));
  for (let i = 0; i < SAMPLES; i++) {
    const phi = a * i / SAMPLES;
    const t = tan[i], f = frames[i];
    frames[i] = f.clone().multiplyScalar(Math.cos(phi)).addScaledVector(tmp.crossVectors(t, f), Math.sin(phi)).normalize();
  }
}
for (let i = 0; i < SAMPLES; i++) {
  nrm.push(frames[i]);
  bin.push(new THREE.Vector3().crossVectors(tan[i], frames[i]).normalize());
}

// heading rate for banking
const yawRate = new Float32Array(SAMPLES);
for (let i = 0; i < SAMPLES; i++) {
  const a = tan[(i - 1 + SAMPLES) % SAMPLES], b = tan[(i + 1) % SAMPLES];
  yawRate[i] = (Math.atan2(b.x, b.z) - Math.atan2(a.x, a.z) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
}
const bank = new Float32Array(SAMPLES);
for (let i = 0; i < SAMPLES; i++) {
  let s = 0, c = 0;
  for (let k = -30; k <= 30; k++) { s += yawRate[(i + k + SAMPLES) % SAMPLES]; c++; }
  bank[i] = THREE.MathUtils.clamp(-(s / c) * 45, -0.9, 0.9);
}

// ---------- Speed profile (energy with chain lift and brake run) ----------
const seg = L / SAMPLES;
const G = 9.8;
const speed = new Float32Array(SAMPLES);
const nearest = p => {
  let best = 0, bd = Infinity;
  for (let i = 0; i < SAMPLES; i++) {
    const d = pos[i].distanceToSquared(p);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
};
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const liftStart = nearest(V(0, 2.2, 22)), liftEnd = nearest(V(0, 64, 80));
const brakeStart = nearest(V(98, 14, 120)), brakeEnd = nearest(V(92, 4, -18));
const liftLen = (liftEnd - liftStart + SAMPLES) % SAMPLES;
{
  let v2 = 25;
  const start = liftStart;
  for (let j = 0; j < SAMPLES; j++) {
    const i = (start + j) % SAMPLES;
    const inLift = j <= liftLen;
    if (inLift) { speed[i] = 5; v2 = 25; continue; }
    const iNext = (i + 1) % SAMPLES;
    const dh = pos[iNext].y - pos[i].y;
    v2 = Math.max(4, v2 - 2 * G * dh - 0.002 * v2 * seg);
    let v = Math.sqrt(v2);
    if (i >= brakeStart && i <= brakeEnd) v = Math.min(v, 12);
    speed[i] = v;
    if (i >= brakeStart && i <= brakeEnd) v2 = v * v;
  }
}
// smooth speed to avoid jumps at the brake and lift boundaries
{
  const sm = new Float32Array(SAMPLES);
  for (let i = 0; i < SAMPLES; i++) {
    let s = 0;
    for (let k = -40; k <= 40; k++) s += speed[(i + k + SAMPLES) % SAMPLES];
    sm[i] = s / 81;
  }
  speed.set(sm);
}

// ---------- Three.js scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY_TOP = new THREE.Color('#1a1f4a'), SKY_HORIZON = new THREE.Color('#ff9a6b');
scene.fog = new THREE.Fog(0x2a2640, 180, 900);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1400, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: SKY_TOP }, hor: { value: SKY_HORIZON } },
    vertexShader: 'varying vec3 vp; void main(){ vp = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying vec3 vp; void main(){ float h = clamp(normalize(vp).y*2.2,0.,1.); gl_FragColor = vec4(mix(hor, top, pow(h,0.6)),1.); }',
  })
);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{
  const arr = new Float32Array(900 * 3);
  for (let i = 0; i < 900; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.9);
    arr.set([Math.sin(ph) * Math.cos(th) * 1300, Math.cos(ph) * 1300, Math.sin(ph) * Math.sin(th) * 1300], i * 3);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
}
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.8 })));

const moon = new THREE.Mesh(new THREE.SphereGeometry(40, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe6c4, fog: false }));
moon.position.set(-500, 380, -700);
scene.add(moon);

scene.add(new THREE.HemisphereLight(0xffb48a, 0x1a2a2e, 0.9));
const sun = new THREE.DirectionalLight(0xffd7b0, 1.1);
sun.position.set(-300, 400, -200);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(1200, 64), new THREE.MeshStandardMaterial({ color: 0x1d3b34, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// rails
const railMat = new THREE.MeshStandardMaterial({ color: 0xdfe6ee, metalness: 0.7, roughness: 0.35 });
for (const side of [-1, 1]) {
  const rp = [];
  for (let i = 0; i < SAMPLES; i++) rp.push(pos[i].clone().addScaledVector(bin[i], side * GAUGE / 2));
  const rc = new THREE.CatmullRomCurve3(rp, true, 'centripetal');
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(rc, SAMPLES, 0.08, 6, true), railMat));
}

// ties
const TIES = Math.floor(SAMPLES / 40);
const tieMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(GAUGE + 1.2, 0.14, 0.35), new THREE.MeshStandardMaterial({ color: 0x6b4b32, roughness: 0.9 }), TIES);
const m4 = new THREE.Matrix4(), tieM = new THREE.Matrix4();
for (let k = 0; k < TIES; k++) {
  const i = k * 40;
  const t = tan[i], b = bin[i];
  const up = new THREE.Vector3().crossVectors(b, t);
  m4.makeBasis(b, up, t).setPosition(pos[i].clone().addScaledVector(up, -0.12));
  tieMesh.setMatrixAt(k, m4);
}
scene.add(tieMesh);

// supports
const colMat = new THREE.MeshStandardMaterial({ color: 0xe0573a, roughness: 0.6 });
const colList = [];
for (let i = 0; i < SAMPLES; i += 30) if (pos[i].y > 2.5) colList.push(i);
const colMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 1, 0.5), colMat, colList.length);
colList.forEach((i, k) => {
  const h = pos[i].y - 0.2;
  m4.makeScale(1, h, 1).setPosition(pos[i].x, h / 2, pos[i].z);
  colMesh.setMatrixAt(k, m4);
});
scene.add(colMesh);

// trees
{
  const trees = [];
  let guard = 0;
  while (trees.length < 500 && guard++ < 20000) {
    const x = (Math.random() - 0.5) * 900, z = (Math.random() - 0.5) * 900;
    let near = Infinity;
    for (let i = 0; i < SAMPLES; i += 20) {
      const d = Math.hypot(pos[i].x - x, pos[i].z - z);
      if (d < near) near = d;
    }
    if (near > 14) trees.push([x, z, 0.8 + Math.random() * 1.1]);
  }
  const tg = new THREE.ConeGeometry(3, 9, 6).translate(0, 4.5, 0);
  const tm = new THREE.InstancedMesh(tg, new THREE.MeshStandardMaterial({ color: 0x14503f, roughness: 1 }), trees.length);
  trees.forEach(([x, z, s], k) => { m4.makeScale(s, s, s).setPosition(x, 0, z); tm.setMatrixAt(k, m4); });
  scene.add(tm);
}

// ---------- Ride: camera, speed streaks, audio ----------
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 2000);
const SEAT = 1.25;
const streakGeo = new THREE.BufferGeometry();
const STREAKS = 500;
const streakArr = new Float32Array(STREAKS * 3);
for (let i = 0; i < STREAKS; i++) streakArr.set([(Math.random() - 0.5) * 60, (Math.random() - 0.5) * 30, -Math.random() * 120], i * 3);
streakGeo.setAttribute('position', new THREE.BufferAttribute(streakArr, 3));
const streaks = new THREE.Points(streakGeo, new THREE.PointsMaterial({ color: 0xfff1d6, size: 0.12, transparent: true, opacity: 0.45 }));
scene.add(streaks);

// lap bar in view
const bar = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.05, 8, 24, Math.PI), new THREE.MeshStandardMaterial({ color: 0xff8a5b, roughness: 0.5 }));
bar.rotation.z = Math.PI;
bar.position.set(0, -0.35, -0.9);
camera.add(bar);
scene.add(camera);

// audio
let ctx = null, windGain = null, muted = false;
function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
  windGain = ctx.createGain(); windGain.gain.value = 0;
  src.connect(bp).connect(windGain).connect(ctx.destination);
  src.start();
}
function clack() {
  if (!ctx || muted) return;
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.03, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.15));
  const s = ctx.createBufferSource(); s.buffer = buf;
  const g = ctx.createGain(); g.gain.value = 0.25;
  s.connect(g).connect(ctx.destination); s.start();
}
addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') muted = !muted; });

// ---------- Main loop ----------
const startEl = document.getElementById('start');
const titleEl = document.getElementById('title');
const speedEl = document.getElementById('speed');
const statsEl = document.getElementById('stats');
const barEl = document.getElementById('bar');
let started = false, dist = 0, lastClackDist = 0, laps = 0, lastIdx = 0;
let fovCur = 70, lookYaw = 0, lookPitch = 0, dragging = false, lx = 0, ly = 0;

startEl.addEventListener('click', () => {
  startEl.classList.add('hide');
  if (!ctx) initAudio();
  started = true;
  titleEl.classList.remove('hide');
  setTimeout(() => titleEl.classList.add('hide'), 5000);
});
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  lookYaw = THREE.MathUtils.clamp(lookYaw - (e.clientX - lx) * 0.004, -1.6, 1.6);
  lookPitch = THREE.MathUtils.clamp(lookPitch - (e.clientY - ly) * 0.004, -0.8, 0.8);
  lx = e.clientX; ly = e.clientY;
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

function sampleAt(d) {
  const f = (d / L) % 1 * SAMPLES;
  const i0 = Math.floor(f) % SAMPLES, i1 = (i0 + 1) % SAMPLES, a = f - Math.floor(f);
  return { i0, i1, a };
}
const P = new THREE.Vector3(), T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
const eye = new THREE.Vector3(), look = new THREE.Vector3();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let v = 0;
  if (started) {
    const { i0, i1, a } = sampleAt(dist);
    v = speed[i0] + (speed[i1] - speed[i0]) * a;
    dist += v * dt;
    if (dist >= L) dist -= L;
    if (dist - lastClackDist > 1.6 && v < 9) { clack(); lastClackDist = dist; }
    if (dist < lastClackDist) lastClackDist = dist;
    const cur = Math.floor(dist / L * 3);
    if (cur !== lastIdx) { lastIdx = cur; }
  }
  const { i0, i1, a } = sampleAt(dist);
  P.lerpVectors(pos[i0], pos[i1], a);
  T.lerpVectors(tan[i0], tan[i1], a).normalize();
  N.lerpVectors(nrm[i0], nrm[i1], a).normalize();
  B.crossVectors(T, N).normalize();
  const bk = bank[i0] + (bank[i1] - bank[i0]) * a;
  const rN = N.clone().multiplyScalar(Math.cos(bk)).addScaledVector(B, Math.sin(bk));
  const rB = new THREE.Vector3().crossVectors(T, rN);

  eye.copy(P).addScaledVector(rN, SEAT);
  look.copy(eye).addScaledVector(T, 10);
  const dir = look.clone().sub(eye).normalize();
  const basis = new THREE.Matrix4().makeBasis(rB, rN, dir.clone().negate());
  const q = new THREE.Quaternion().setFromRotationMatrix(basis);
  const lookQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ'));
  lookYaw *= 0.97; lookPitch *= 0.97;
  q.multiply(lookQ);
  camera.position.copy(eye).addScaledVector(rN, Math.sin(now / 240) * 0.02);
  camera.quaternion.copy(q);
  const sp = v / 35;
  fovCur += (70 + sp * 14 - fovCur) * 0.08;
  camera.fov = fovCur; camera.updateProjectionMatrix();

  const sArr = streakGeo.attributes.position.array;
  for (let i = 0; i < STREAKS; i++) {
    sArr[i * 3 + 2] += v * dt * 1.4 + 0.0;
    if (sArr[i * 3 + 2] > 2) sArr[i * 3 + 2] -= 120;
  }
  streakGeo.attributes.position.needsUpdate = true;
  streaks.position.copy(eye);
  streaks.quaternion.copy(camera.quaternion);
  streaks.material.opacity = Math.min(0.5, sp * 0.5);

  if (windGain) windGain.gain.value = muted ? 0 : Math.min(0.35, 0.02 + v * 0.008);

  const kmh = Math.round(v * 3.6);
  speedEl.firstChild.nodeValue = kmh;
  statsEl.textContent = `height ${P.y.toFixed(0)} m · lap ${Math.floor(dist / L) + 1}`;
  barEl.style.width = (dist / L * 100) + '%';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
