<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101c">
  <title>Nightfall Run — First-Person Coaster</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8f6fb;
      --muted: #9bb6c4;
      --line: rgba(203, 240, 246, .24);
      --panel: rgba(4, 13, 23, .52);
      --signal: #f6b568;
      --aqua: #8be3df;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #06101a; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .025em;
    }

    main { width: 100%; height: 100%; position: relative; isolation: isolate; }
    canvas { display: block; width: 100%; height: 100%; }

    .grain, .vignette { position: absolute; inset: 0; pointer-events: none; }
    .grain {
      opacity: .14;
      mix-blend-mode: soft-light;
      background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px);
    }
    .vignette {
      background: radial-gradient(ellipse at center, transparent 32%, rgba(0, 5, 10, .14) 68%, rgba(0, 4, 9, .72) 125%);
    }

    .hud { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
    .brand {
      position: absolute; top: clamp(18px, 3.2vw, 48px); left: clamp(18px, 4vw, 64px);
      padding-left: 14px; border-left: 2px solid var(--signal);
      text-shadow: 0 2px 14px rgba(0,0,0,.45);
    }
    .eyebrow, .label, .status-label {
      margin: 0; color: var(--aqua); font-size: 10px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase;
    }
    h1 { margin: 4px 0 0; font-size: clamp(19px, 2.25vw, 32px); font-weight: 680; line-height: 1; letter-spacing: .09em; }
    .brand small { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }

    .telemetry {
      position: absolute; top: clamp(18px, 3.2vw, 48px); right: clamp(18px, 4vw, 64px);
      display: grid; grid-template-columns: auto auto; gap: 0 20px;
      padding: 12px 14px; min-width: 150px;
      border: 1px solid var(--line); border-radius: 3px;
      background: linear-gradient(135deg, rgba(6, 18, 31, .68), rgba(6, 18, 31, .18));
      box-shadow: 0 10px 36px rgba(0,0,0,.16); backdrop-filter: blur(7px);
    }
    .telemetry p { margin: 0; }
    .telemetry .label { align-self: end; color: var(--muted); font-size: 9px; }
    .telemetry strong { grid-column: 2; justify-self: end; color: #fff3db; font-size: 22px; font-weight: 540; letter-spacing: .015em; line-height: 1; }
    .telemetry .unit { grid-column: 2; justify-self: end; margin-top: 4px; color: var(--signal); font-size: 9px; font-weight: 700; letter-spacing: .14em; }

    .ride-card {
      position: absolute; left: clamp(18px, 4vw, 64px); bottom: clamp(22px, 4.6vw, 68px);
      display: flex; align-items: center; gap: 12px; max-width: min(430px, calc(100vw - 44px));
      padding: 13px 15px 13px 13px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--panel); box-shadow: 0 12px 42px rgba(0,0,0,.22); backdrop-filter: blur(9px);
    }
    .pulse {
      width: 8px; height: 8px; flex: 0 0 auto; border-radius: 999px; background: var(--signal);
      box-shadow: 0 0 0 0 rgba(246,181,104,.55); animation: pulse 1.8s infinite;
    }
    .ride-card p { margin: 0; }
    .ride-card .status-label { font-size: 9px; color: var(--muted); }
    #sector { margin-top: 3px; color: #f6fbfc; font-size: clamp(12px, 1.25vw, 15px); font-weight: 650; letter-spacing: .11em; text-transform: uppercase; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(246,181,104,0); } 100% { box-shadow: 0 0 0 0 rgba(246,181,104,0); } }

    .controls {
      position: absolute; right: clamp(18px, 4vw, 64px); bottom: clamp(22px, 4.6vw, 68px);
      display: flex; gap: 8px; pointer-events: auto;
    }
    button {
      min-width: 90px; padding: 11px 13px; border: 1px solid rgba(219, 244, 247, .34); border-radius: 3px;
      color: var(--ink); background: rgba(4, 13, 23, .58); box-shadow: 0 8px 28px rgba(0,0,0,.18);
      font: 750 10px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease; backdrop-filter: blur(9px);
    }
    button:hover { transform: translateY(-2px); border-color: var(--signal); background: rgba(14, 31, 42, .78); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 2px solid #fff1c9; outline-offset: 3px; }
    #pause { border-color: rgba(246,181,104,.58); color: #fff1dc; }

    .hint {
      position: absolute; left: 50%; bottom: clamp(22px, 4.6vw, 68px); transform: translateX(-50%);
      margin: 0; color: rgba(226,244,248,.66); font-size: 9px; font-weight: 600; letter-spacing: .13em; text-align: center;
      text-shadow: 0 1px 6px rgba(0,0,0,.8);
    }
    .reticle {
      position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); opacity: .48;
    }
    .reticle::before, .reticle::after { content: ""; position: absolute; background: rgba(231,252,255,.8); }
    .reticle::before { width: 1px; height: 18px; left: 8px; top: 0; }
    .reticle::after { width: 18px; height: 1px; left: 0; top: 8px; }

    @media (max-width: 640px) {
      .telemetry { min-width: 118px; padding: 9px 10px; gap: 0 10px; }
      .telemetry strong { font-size: 18px; }
      .hint { display: none; }
      .controls { gap: 6px; }
      button { min-width: 70px; padding: 10px 9px; font-size: 9px; }
      .ride-card { bottom: 18px; left: 18px; padding: 10px 11px; }
      .controls { right: 18px; bottom: 18px; }
    }
  </style>
</head>
<body>
  <main aria-label="Nightfall Run first-person rollercoaster">
    <canvas id="ride" aria-label="Animated first-person view from a rollercoaster racing through a sunset valley"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="hud" aria-label="Ride information">
      <header class="brand">
        <p class="eyebrow">Spectrum Railways / 09</p>
        <h1>NIGHTFALL RUN</h1>
        <small>FIRST-PERSON CONTINUOUS FLIGHT</small>
      </header>

      <div class="telemetry" aria-live="polite">
        <p class="label">Velocity</p>
        <strong id="speed">074</strong>
        <span class="unit">KM / H</span>
      </div>

      <div class="reticle" aria-hidden="true"></div>

      <div class="ride-card" aria-live="polite">
        <span class="pulse" aria-hidden="true"></span>
        <div>
          <p class="status-label">Entering sector</p>
          <p id="sector">Amber Rise</p>
        </div>
      </div>

      <p class="hint">SPACE TO PAUSE &nbsp; / &nbsp; MOVE TO LOOK AROUND</p>

      <nav class="controls" aria-label="Ride controls">
        <button id="pace" type="button" aria-label="Change ride pace">PACE 1×</button>
        <button id="pause" type="button" aria-pressed="false">PAUSE</button>
      </nav>
    </section>
  </main>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("ride");
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const speedReadout = document.getElementById("speed");
    const sectorReadout = document.getElementById("sector");
    const pauseButton = document.getElementById("pause");
    const paceButton = document.getElementById("pace");

    /*
      A small in-file Three.js-shaped scene core keeps the cell completely
      self-contained: vector math, a spline route, and a perspective camera are
      the same building blocks used by a conventional Three.js coaster scene.
    */
    const THREE = (() => {
      class Vector3 {
        constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
        set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
        copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; return this; }
        clone() { return new Vector3(this.x, this.y, this.z); }
        add(v) { this.x += v.x; this.y += v.y; this.z += v.z; return this; }
        sub(v) { this.x -= v.x; this.y -= v.y; this.z -= v.z; return this; }
        addScaledVector(v, s) { this.x += v.x * s; this.y += v.y * s; this.z += v.z * s; return this; }
        subVectors(a, b) { this.x = a.x - b.x; this.y = a.y - b.y; this.z = a.z - b.z; return this; }
        multiplyScalar(s) { this.x *= s; this.y *= s; this.z *= s; return this; }
        dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
        crossVectors(a, b) {
          const x = a.y * b.z - a.z * b.y;
          const y = a.z * b.x - a.x * b.z;
          const z = a.x * b.y - a.y * b.x;
          return this.set(x, y, z);
        }
        length() { return Math.hypot(this.x, this.y, this.z); }
        normalize() { const l = this.length() || 1; return this.multiplyScalar(1 / l); }
      }
      class CatmullRomCurve3 {
        getPoint(t) { return routePoint(t); }
        getTangent(t) { return routePoint(t + .2).sub(routePoint(t - .2)).normalize(); }
      }
      class PerspectiveCamera {
        constructor(fov) { this.fov = fov; this.position = new Vector3(); }
      }
      return { Vector3, CatmullRomCurve3, PerspectiveCamera };
    })();

    const worldUp = new THREE.Vector3(0, 1, 0);
    const route = new THREE.CatmullRomCurve3();
    const camera = new THREE.PerspectiveCamera(78);
    const pacing = [0.72, 1, 1.32];
    const sectors = ["AMBER RISE", "RAVEN HELIX", "LUCID DROP", "SOLAR VAULT", "NIGHTFALL RUN"];
    let paceIndex = 1;
    let paused = false;
    let progress = 105;
    let lastFrame = performance.now();
    let width = 0;
    let height = 0;
    let dpr = 1;
    let focal = 720;
    let lookX = 0;
    let lookY = 0;

    function routePoint(t) {
      return new THREE.Vector3(
        40 * Math.sin(t * .031) + 21 * Math.sin(t * .0107 + .8) + 9 * Math.sin(t * .096),
        37 + 16 * Math.sin(t * .053 - .55) + 11 * Math.sin(t * .0185 + 2.1) + 4 * Math.sin(t * .142),
        t
      );
    }

    function frameAt(t) {
      const center = route.getPoint(t);
      const forward = route.getTangent(t);
      const flatRight = new THREE.Vector3().crossVectors(forward, worldUp);
      if (flatRight.length() < .01) flatRight.set(1, 0, 0);
      flatRight.normalize();
      const flatUp = new THREE.Vector3().crossVectors(flatRight, forward).normalize();
      const roll = .56 * Math.sin(t * .031 + .7) + .24 * Math.sin(t * .079 - .3);
      const c = Math.cos(roll);
      const s = Math.sin(roll);
      const right = flatRight.clone().multiplyScalar(c).addScaledVector(flatUp, s).normalize();
      const up = flatUp.clone().multiplyScalar(c).addScaledVector(flatRight, -s).normalize();
      const eye = center.clone().addScaledVector(up, 2.25).addScaledVector(forward, .45);
      return { center, forward, right, up, eye, roll };
    }

    function pointOnRail(t, lateral, lift = 0) {
      const f = frameAt(t);
      return f.center.addScaledVector(f.right, lateral).addScaledVector(f.up, lift);
    }

    function project(point, frame) {
      const dx = point.x - frame.eye.x;
      const dy = point.y - frame.eye.y;
      const dz = point.z - frame.eye.z;
      const z = dx * frame.forward.x + dy * frame.forward.y + dz * frame.forward.z;
      if (z < .44) return null;
      const x = dx * frame.right.x + dy * frame.right.y + dz * frame.right.z;
      const y = dx * frame.up.x + dy * frame.up.y + dz * frame.up.z;
      const scale = focal / z;
      return {
        x: width * .5 + x * scale + lookX * Math.min(22, z * .035),
        y: height * .525 - y * scale + lookY * Math.min(13, z * .02),
        z, scale
      };
    }

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function fract(value) { return value - Math.floor(value); }
    function hash(value) { return fract(Math.sin(value * 12.9898 + 78.233) * 43758.5453); }
    function signedHash(value) { return hash(value) * 2 - 1; }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      focal = height / (2 * Math.tan((78 * Math.PI / 180) / 2));
    }

    function drawSky(time, frame) {
      const grade = ctx.createLinearGradient(0, 0, 0, height);
      grade.addColorStop(0, "#020918");
      grade.addColorStop(.32, "#0d2941");
      grade.addColorStop(.56, "#6d5961");
      grade.addColorStop(.69, "#ef9d70");
      grade.addColorStop(.79, "#c37255");
      grade.addColorStop(1, "#172a2b");
      ctx.fillStyle = grade;
      ctx.fillRect(0, 0, width, height);

      const sunX = width * (.72 + .055 * Math.sin(progress * .0032));
      const sunY = height * (.30 + .025 * Math.cos(progress * .005));
      const glow = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, Math.min(width, height) * .28);
      glow.addColorStop(0, "rgba(255,246,196,.97)");
      glow.addColorStop(.09, "rgba(255,206,137,.78)");
      glow.addColorStop(.42, "rgba(245,140,96,.12)");
      glow.addColorStop(1, "rgba(245,140,96,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "rgba(255,244,202,.95)";
      ctx.beginPath();
      ctx.arc(sunX, sunY, Math.max(8, Math.min(width, height) * .017), 0, Math.PI * 2);
      ctx.fill();

      // Sparse stars still visible in the blue upper atmosphere.
      ctx.fillStyle = "rgba(229,246,255,.55)";
      for (let i = 0; i < 42; i++) {
        const x = hash(i * 17.4) * width;
        const y = hash(i * 31.8 + 9) * height * .39;
        const r = hash(i * 7.7) > .82 ? 1.2 : .65;
        ctx.globalAlpha = .26 + hash(i * 12) * .48;
        ctx.fillRect(x, y, r, r);
      }
      ctx.globalAlpha = 1;

      for (let i = 0; i < 8; i++) {
        const drift = (progress * (.12 + i * .017) + i * 187) % (width + 360);
        const x = drift - 180;
        const y = height * (.12 + hash(i * 13) * .29);
        const cloud = ctx.createRadialGradient(x + 112, y + 14, 6, x + 112, y + 14, 170);
        cloud.addColorStop(0, "rgba(245,221,216,.135)");
        cloud.addColorStop(.45, "rgba(236,202,205,.055)");
        cloud.addColorStop(1, "rgba(236,202,205,0)");
        ctx.fillStyle = cloud;
        ctx.beginPath();
        ctx.ellipse(x + 105, y, 128, 22 + (i % 3) * 8, -.08, 0, Math.PI * 2);
        ctx.fill();
      }

      const horizon = height * (.59 + frame.roll * .015);
      drawMountainLayer(horizon + 64, "#1b3141", 60, 180, .055, progress * .18);
      drawMountainLayer(horizon + 92, "#173239", 86, 106, .09, progress * .33);
      drawMountainLayer(horizon + 134, "#102b2c", 92, 62, .14, progress * .56);

      const fog = ctx.createLinearGradient(0, horizon - 38, 0, horizon + 170);
      fog.addColorStop(0, "rgba(255,181,131,.18)");
      fog.addColorStop(1, "rgba(19,42,39,0)");
      ctx.fillStyle = fog;
      ctx.fillRect(0, horizon - 38, width, 230);

      const speedLines = clamp((pacing[paceIndex] - .7) * .85 + Math.abs(Math.sin(progress * .055)) * .18, 0, .66);
      if (speedLines > .12) {
        ctx.lineCap = "round";
        for (let i = 0; i < 17; i++) {
          const a = (i / 17) * Math.PI * 2 + progress * .006;
          const radius = Math.max(width, height) * (.40 + hash(i * 19) * .36);
          const x1 = width * .5 + Math.cos(a) * radius;
          const y1 = height * .52 + Math.sin(a) * radius;
          const x2 = width * .5 + Math.cos(a) * (radius + 26 + hash(i) * 45);
          const y2 = height * .52 + Math.sin(a) * (radius + 26 + hash(i) * 45);
          ctx.strokeStyle = "rgba(255,231,194," + (speedLines * (.07 + hash(i * 4) * .1)) + ")";
          ctx.lineWidth = .8;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
      }
    }

    function drawMountainLayer(base, color, amplitude, wavelength, roughness, offset) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-8, height + 8);
      for (let x = -8; x <= width + 12; x += 18) {
        const n = x + offset;
        const y = base - Math.abs(Math.sin(n / wavelength)) * amplitude
          - Math.sin(n / (wavelength * .44)) * amplitude * roughness
          - Math.sin(n / (wavelength * 1.9)) * amplitude * .24;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width + 12, height + 8);
      ctx.closePath();
      ctx.fill();
    }

    function drawPine(t, side, seed, frame) {
      const path = route.getPoint(t);
      const distance = 22 + hash(seed * 3.17) * 55;
      const ground = new THREE.Vector3(path.x + side * distance, -13 - hash(seed * 8) * 4, t + signedHash(seed * 4) * 8);
      const treeHeight = 13 + hash(seed * 11.7) * 22;
      const top = ground.clone().addScaledVector(worldUp, treeHeight);
      const a = project(ground, frame);
      const b = project(top, frame);
      if (!a || !b || a.z > 410 || a.y < -120 || b.y > height + 100) return;
      const treeWidth = clamp((a.scale + b.scale) * (.45 + hash(seed) * .28), 1.2, 48);
      ctx.save();
      ctx.globalAlpha = clamp(.85 - a.z / 1100, .18, .72);
      ctx.fillStyle = hash(seed * 4.3) > .5 ? "#0d3030" : "#173936";
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(a.x - treeWidth, a.y);
      ctx.lineTo(a.x + treeWidth, a.y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(225,157,101,.12)";
      ctx.lineWidth = Math.max(.5, treeWidth * .12);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.restore();
    }

    function drawForest(frame) {
      const far = Math.floor((progress + 390) / 13) * 13;
      const near = Math.floor((progress + 13) / 13) * 13;
      for (let t = far; t >= near; t -= 13) {
        const id = Math.floor(t / 13);
        drawPine(t + 4, -1, id * 2 + 1, frame);
        if (hash(id * 1.91) > .18) drawPine(t - 2, 1, id * 2 + 2, frame);
      }
    }

    function drawSupport(t, frame) {
      const f = frameAt(t);
      const leftTop = f.center.clone().addScaledVector(f.right, -2.2).addScaledVector(f.up, -.65);
      const rightTop = f.center.clone().addScaledVector(f.right, 2.2).addScaledVector(f.up, -.65);
      const leftFoot = new THREE.Vector3(f.center.x - 5.6, -14, f.center.z);
      const rightFoot = new THREE.Vector3(f.center.x + 5.6, -14, f.center.z);
      const lt = project(leftTop, frame);
      const rt = project(rightTop, frame);
      const lf = project(leftFoot, frame);
      const rf = project(rightFoot, frame);
      if (!lt || !rt || !lf || !rf || lt.z > 430) return;
      const thickness = clamp((lt.scale + rt.scale) * .09, .5, 7);
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(6,20,27,.65)";
      ctx.lineWidth = thickness * 2.5;
      ctx.beginPath(); ctx.moveTo(lt.x, lt.y); ctx.lineTo(lf.x, lf.y); ctx.moveTo(rt.x, rt.y); ctx.lineTo(rf.x, rf.y); ctx.stroke();
      ctx.strokeStyle = "rgba(89,164,158,.52)";
      ctx.lineWidth = thickness;
      ctx.beginPath(); ctx.moveTo(lt.x, lt.y); ctx.lineTo(lf.x, lf.y); ctx.moveTo(rt.x, rt.y); ctx.lineTo(rf.x, rf.y); ctx.stroke();
      ctx.globalAlpha = .45;
      ctx.strokeStyle = "#e4af78";
      ctx.lineWidth = Math.max(.45, thickness * .2);
      ctx.beginPath(); ctx.moveTo(lt.x, lt.y); ctx.lineTo(lf.x, lf.y); ctx.moveTo(rt.x, rt.y); ctx.lineTo(rf.x, rf.y); ctx.stroke();
      ctx.restore();
    }

    function drawSupports(frame) {
      const far = Math.floor((progress + 350) / 18) * 18;
      const near = Math.floor((progress + 12) / 18) * 18;
      for (let t = far; t >= near; t -= 18) drawSupport(t, frame);
    }

    function line(a, b, color, widthValue) {
      if (!a || !b) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = widthValue;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    function drawTrack(frame) {
      const samples = [];
      const start = 2.25;
      const end = 360;
      const step = 2.8;
      for (let d = end; d >= start; d -= step) {
        const t = progress + d;
        const shape = frameAt(t);
        samples.push({
          left: project(shape.center.clone().addScaledVector(shape.right, -2.35), frame),
          right: project(shape.center.clone().addScaledVector(shape.right, 2.35), frame),
          spine: project(shape.center.clone().addScaledVector(shape.up, -.72), frame),
          scale: focal / Math.max(d, 1)
        });
      }

      ctx.save();
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // The dark spine is painted first, from the far horizon toward the car.
      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        if (!a.left || !a.right || !b.left || !b.right) continue;
        ctx.fillStyle = "rgba(5,14,20,.78)";
        ctx.beginPath();
        ctx.moveTo(a.left.x, a.left.y); ctx.lineTo(a.right.x, a.right.y);
        ctx.lineTo(b.right.x, b.right.y); ctx.lineTo(b.left.x, b.left.y);
        ctx.closePath(); ctx.fill();
        if (a.spine && b.spine) line(a.spine, b.spine, "rgba(15,37,42,.9)", clamp((a.scale + b.scale) * .28, .5, 19));
      }

      // Cross ties establish the coaster's speed and rhythm.
      const farTie = Math.floor((progress + end) / 7) * 7;
      for (let t = farTie; t > progress + 3; t -= 7) {
        const shape = frameAt(t);
        const left = project(shape.center.clone().addScaledVector(shape.right, -3.12).addScaledVector(shape.up, -.16), frame);
        const right = project(shape.center.clone().addScaledVector(shape.right, 3.12).addScaledVector(shape.up, -.16), frame);
        if (!left || !right) continue;
        const w = clamp((left.scale + right.scale) * .40, .55, 13);
        line(left, right, "rgba(3,11,16,.88)", w * 2.2);
        line(left, right, "rgba(129,91,61,.86)", w);
        line(left, right, "rgba(242,180,112,.3)", Math.max(.45, w * .16));
      }

      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        if (!a.left || !a.right || !b.left || !b.right) continue;
        const outer = clamp((a.scale + b.scale) * .32, .8, 18);
        for (const side of ["left", "right"]) {
          line(a[side], b[side], "rgba(0,8,14,.9)", outer * 2.8);
          line(a[side], b[side], "#527a7b", outer * 1.48);
          line(a[side], b[side], "rgba(221,253,244,.88)", Math.max(.62, outer * .38));
          line(a[side], b[side], "rgba(255,188,108,.8)", Math.max(.36, outer * .10));
        }
      }
      ctx.restore();
    }

    function drawCockpit(frame) {
      const y = height;
      const nose = ctx.createLinearGradient(0, y * .78, 0, y);
      nose.addColorStop(0, "rgba(12,31,39,0)");
      nose.addColorStop(.32, "rgba(5,16,24,.45)");
      nose.addColorStop(1, "rgba(1,6,12,.96)");
      ctx.fillStyle = nose;
      ctx.beginPath();
      ctx.moveTo(0, y); ctx.lineTo(width * .28, y); ctx.lineTo(width * .41, y * .86);
      ctx.quadraticCurveTo(width * .5, y * .81, width * .59, y * .86);
      ctx.lineTo(width * .72, y); ctx.lineTo(width, y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(143,227,219,.23)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(width * .41, y * .86); ctx.quadraticCurveTo(width * .5, y * .81, width * .59, y * .86); ctx.stroke();
      ctx.fillStyle = "rgba(245,180,108,.72)";
      ctx.beginPath(); ctx.arc(width * .5, y * .895, 2.2, 0, Math.PI * 2); ctx.fill();

      const bankGlow = clamp(Math.abs(frame.roll) * .23, 0, .14);
      const sideGlow = ctx.createLinearGradient(0, 0, width, 0);
      sideGlow.addColorStop(0, "rgba(103,230,215," + bankGlow + ")");
      sideGlow.addColorStop(.28, "rgba(103,230,215,0)");
      sideGlow.addColorStop(.72, "rgba(246,181,104,0)");
      sideGlow.addColorStop(1, "rgba(246,181,104," + bankGlow + ")");
      ctx.fillStyle = sideGlow;
      ctx.fillRect(0, 0, width, height);
    }

    function draw(frameTime) {
      const now = frameTime || performance.now();
      const elapsed = Math.min((now - lastFrame) / 1000, .06);
      lastFrame = now;
      if (!paused) progress += elapsed * (17.5 + 4.5 * Math.sin(progress * .059)) * pacing[paceIndex];

      const frame = frameAt(progress);
      camera.position.copy(frame.eye);
      ctx.clearRect(0, 0, width, height);
      drawSky(now, frame);
      drawForest(frame);
      drawSupports(frame);
      drawTrack(frame);
      drawCockpit(frame);

      const rideSpeed = Math.round((64 + pacing[paceIndex] * 20 + Math.abs(Math.sin(progress * .059)) * 19));
      speedReadout.textContent = String(rideSpeed).padStart(3, "0");
      sectorReadout.textContent = sectors[Math.floor(progress / 145) % sectors.length];
      requestAnimationFrame(draw);
    }

    function togglePause() {
      paused = !paused;
      pauseButton.textContent = paused ? "RESUME" : "PAUSE";
      pauseButton.setAttribute("aria-pressed", String(paused));
      pauseButton.setAttribute("aria-label", paused ? "Resume the ride" : "Pause the ride");
    }

    pauseButton.addEventListener("click", togglePause);
    paceButton.addEventListener("click", () => {
      paceIndex = (paceIndex + 1) % pacing.length;
      paceButton.textContent = "PACE " + pacing[paceIndex].toFixed(2).replace(".00", "") + "×";
    });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") { event.preventDefault(); togglePause(); }
      if (event.key.toLowerCase() === "r") progress = 105;
    });
    window.addEventListener("pointermove", (event) => {
      lookX += ((event.clientX / width - .5) * 2 - lookX) * .035;
      lookY += ((event.clientY / height - .5) * 2 - lookY) * .035;
    }, { passive: true });
    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => { lastFrame = performance.now(); });

    resize();
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
