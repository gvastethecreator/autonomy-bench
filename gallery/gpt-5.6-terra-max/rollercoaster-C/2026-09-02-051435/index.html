<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050a13" />
  <title>Nightfall — Skyline Coaster</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eaf7ff;
      --muted: #8fa7ba;
      --cyan: #74f4ff;
      --lime: #d9ff83;
      --line: rgba(184, 235, 255, .2);
      --panel: rgba(4, 12, 24, .45);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030611;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #hud, #loading, #vignette, #grain {
      position: fixed;
      inset: 0;
    }

    #hud {
      z-index: 2;
      pointer-events: none;
      color: var(--ink);
    }

    #loading {
      z-index: 5;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 43%, rgba(33, 85, 128, .22), #030611 68%);
      transition: opacity .8s ease, visibility .8s ease;
    }

    #loading.done {
      opacity: 0;
      visibility: hidden;
    }

    .loader-card {
      display: grid;
      gap: 14px;
      text-align: center;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: 10px;
      color: #a8c9dc;
    }

    .loader-mark {
      width: 42px;
      height: 42px;
      margin: 0 auto;
      border: 1px solid rgba(159, 244, 255, .75);
      border-top-color: transparent;
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(91, 235, 255, .45);
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .topbar {
      position: absolute;
      top: clamp(18px, 3vw, 38px);
      left: clamp(18px, 4vw, 58px);
      right: clamp(18px, 4vw, 58px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 13px;
      text-transform: uppercase;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
    }

    .wordmark strong {
      font-size: clamp(17px, 2vw, 26px);
      line-height: 1;
      letter-spacing: .24em;
      font-weight: 800;
    }

    .wordmark span {
      padding-left: 12px;
      border-left: 1px solid var(--line);
      font-size: 9px;
      letter-spacing: .18em;
      color: var(--muted);
      white-space: nowrap;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b8d4e5;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .signal i {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 13px var(--lime);
      animation: blink 2.4s ease-in-out infinite;
    }

    @keyframes blink { 50% { opacity: .42; box-shadow: 0 0 4px var(--lime); } }

    .ride-card {
      position: absolute;
      left: clamp(18px, 4vw, 58px);
      bottom: clamp(18px, 4vw, 46px);
      width: min(278px, calc(100vw - 36px));
      padding: 16px 17px 14px;
      border: 1px solid var(--line);
      border-left-color: rgba(116, 244, 255, .65);
      background: linear-gradient(135deg, rgba(12, 26, 43, .7), rgba(3, 9, 18, .28));
      box-shadow: 0 12px 34px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(12px);
    }

    .eyebrow, .card-label, .readout-label {
      color: #9bb7ca;
      font-size: 9px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .ride-name {
      margin-top: 7px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .ride-track {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
      color: #d8f7ff;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .progress {
      flex: 1;
      height: 2px;
      overflow: hidden;
      background: rgba(215, 245, 255, .16);
    }

    .progress span {
      display: block;
      width: 42%;
      height: 100%;
      transform-origin: 0 50%;
      background: linear-gradient(90deg, #78f3ff, #d9ff83);
      box-shadow: 0 0 10px rgba(116, 244, 255, .8);
    }

    .readouts {
      position: absolute;
      right: clamp(18px, 4vw, 58px);
      bottom: clamp(18px, 4vw, 46px);
      display: grid;
      grid-template-columns: repeat(2, minmax(84px, 1fr));
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--line);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .18);
    }

    .readout {
      min-width: 98px;
      padding: 12px 14px;
      background: rgba(4, 12, 24, .68);
      backdrop-filter: blur(10px);
    }

    .readout-value {
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      line-height: 1;
      letter-spacing: .04em;
      color: #f1fbff;
    }

    .readout-value small { font-size: 9px; color: #91b2c7; margin-left: 2px; }

    #focusButton {
      position: absolute;
      left: 50%;
      bottom: clamp(20px, 3.2vw, 42px);
      transform: translateX(-50%);
      padding: 10px 13px;
      border: 1px solid rgba(177, 236, 255, .34);
      border-radius: 999px;
      color: #dffaff;
      background: rgba(5, 16, 29, .55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 20px rgba(0,0,0,.18);
      font: 600 9px/1 Inter, ui-sans-serif, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      transition: background .25s ease, border-color .25s ease, color .25s ease;
    }

    #focusButton:hover, #focusButton:focus-visible {
      outline: none;
      border-color: rgba(116, 244, 255, .9);
      color: white;
      background: rgba(13, 44, 61, .75);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 74px;
      transform: translateX(-50%);
      color: rgba(212, 242, 255, .54);
      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity .8s ease;
    }

    #vignette {
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 39%, rgba(0, 0, 0, .12) 70%, rgba(0, 0, 0, .56) 120%),
        linear-gradient(180deg, rgba(3, 8, 20, .20), transparent 28%, transparent 70%, rgba(1, 5, 12, .22));
    }

    #grain {
      z-index: 3;
      pointer-events: none;
      opacity: .12;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    #flash {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 65% 30%, rgba(183, 244, 255, .24), transparent 38%);
      transition: opacity .12s ease;
    }

    @media (max-width: 650px) {
      .topbar { align-items: center; }
      .wordmark span, .signal span { display: none; }
      .ride-card { bottom: 18px; width: 210px; padding: 12px; }
      .ride-name { font-size: 15px; }
      .readouts { right: 18px; bottom: 18px; }
      .readout { min-width: 70px; padding: 10px; }
      .readout-value { font-size: 14px; }
      #focusButton { bottom: 86px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="loader-card"><div class="loader-mark"></div><span>Synchronizing track telemetry</span></div>
  </div>
  <div id="vignette"></div>
  <div id="hud">
    <header class="topbar">
      <div class="wordmark"><strong>Nightfall</strong><span>Skyline coaster</span></div>
      <div class="signal"><i></i><span>Auto-ride live</span></div>
    </header>
    <section class="ride-card" aria-label="Ride information">
      <div class="eyebrow">Aerolight park / 07</div>
      <div class="ride-name">Vector Run</div>
      <div class="ride-track"><span>Course</span><div class="progress"><span id="progressFill"></span></div><span id="sector">01/12</span></div>
    </section>
    <section class="readouts" aria-label="Ride telemetry">
      <div class="readout"><div class="readout-label">Velocity</div><div class="readout-value"><span id="speed">000</span><small>km/h</small></div></div>
      <div class="readout"><div class="readout-label">Load</div><div class="readout-value"><span id="force">0.0</span><small>g</small></div></div>
    </section>
    <div class="hint" id="hint">Move pointer to lean · space for cinematic view</div>
    <button id="focusButton" type="button" aria-pressed="false">Cinematic view</button>
    <div id="flash"></div>
  </div>
  <div id="grain"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const $ = (id) => document.getElementById(id);
    const loading = $('loading');
    const speedReadout = $('speed');
    const forceReadout = $('force');
    const progressFill = $('progressFill');
    const sector = $('sector');
    const hint = $('hint');
    const flash = $('flash');
    const focusButton = $('focusButton');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06101d, 0.0105);

    const camera = new THREE.PerspectiveCamera(76, innerWidth / innerHeight, 0.05, 560);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.65));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.42;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.72, 0.18);
    composer.addPass(bloom);

    const clock = new THREE.Clock();
    const world = new THREE.Group();
    scene.add(world);

    const rideRig = new THREE.Group();
    world.add(rideRig);
    rideRig.add(camera);
    camera.position.set(0, 0.72, 0.14);

    const palette = {
      rail: new THREE.MeshStandardMaterial({ color: 0x16293a, metalness: 0.94, roughness: 0.2, emissive: 0x0d3e70, emissiveIntensity: 1.45 }),
      spine: new THREE.MeshStandardMaterial({ color: 0x0a101b, metalness: 0.86, roughness: 0.25, emissive: 0x08203b, emissiveIntensity: 0.42 }),
      tie: new THREE.MeshStandardMaterial({ color: 0x203040, metalness: 0.58, roughness: 0.43 }),
      support: new THREE.MeshStandardMaterial({ color: 0x101b29, metalness: 0.72, roughness: 0.34 }),
      glowCyan: new THREE.MeshBasicMaterial({ color: 0x79f6ff, transparent: true, opacity: 0.94 }),
      glowLime: new THREE.MeshBasicMaterial({ color: 0xd9ff83, transparent: true, opacity: 0.92 }),
      canopy: new THREE.MeshPhysicalMaterial({ color: 0x133a57, metalness: 0.72, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.15, emissive: 0x0b2541, emissiveIntensity: 0.75 })
    };

    function seededRandom(seed) {
      let state = seed >>> 0;
      return () => {
        state += 0x6D2B79F5;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = seededRandom(71932);

    function addSky() {
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(470, 40, 24),
        new THREE.ShaderMaterial({
          side: THREE.BackSide,
          depthWrite: false,
          uniforms: { uTime: { value: 0 } },
          vertexShader: `varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            uniform float uTime; varying vec3 vWorld;
            void main(){
              float h = normalize(vWorld).y * .5 + .5;
              vec3 horizon = vec3(.018, .050, .115);
              vec3 zenith = vec3(.012, .020, .080);
              vec3 c = mix(horizon, zenith, smoothstep(.10, .88, h));
              float band = exp(-pow((h - .35) * 5.0, 2.0));
              c += vec3(.025, .035, .075) * band;
              float pulse = .5 + .5 * sin(uTime * .035 + vWorld.x * .01);
              c += vec3(.005, .012, .025) * pulse * (1.0 - h);
              gl_FragColor = vec4(c, 1.0);
            }`
        })
      );
      scene.add(sky);
      return sky.material;
    }
    const skyMaterial = addSky();

    function addWater() {
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(620, 620, 128, 128),
        new THREE.ShaderMaterial({
          transparent: false,
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            uniform float uTime; varying float vWave; varying vec3 vWorld;
            void main(){
              vec3 p = position;
              float a = sin(p.x * .065 + uTime * .42) * .42;
              float b = cos(p.y * .082 - uTime * .33) * .27;
              float c = sin((p.x + p.y) * .031 + uTime * .25) * .58;
              p.z += a + b + c;
              vWave = p.z;
              vec4 w = modelMatrix * vec4(p, 1.0); vWorld = w.xyz;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            }`,
          fragmentShader: `
            varying float vWave; varying vec3 vWorld;
            void main(){
              vec3 deep = vec3(.006, .024, .051);
              vec3 sheen = vec3(.018, .105, .165);
              float crest = smoothstep(.28, 1.0, vWave);
              float horizon = smoothstep(40.0, 250.0, length(vWorld.xz));
              vec3 c = mix(deep, sheen, crest * .72 + horizon * .18);
              c += vec3(.01, .045, .07) * max(vWave, 0.0);
              gl_FragColor = vec4(c, 1.0);
            }`
        })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = -3.25;
      water.receiveShadow = true;
      world.add(water);
      return water.material;
    }
    const waterMaterial = addWater();

    const hemi = new THREE.HemisphereLight(0x8caeff, 0x06101b, 1.25);
    scene.add(hemi);
    const moonLight = new THREE.DirectionalLight(0x92bdff, 2.4);
    moonLight.position.set(-58, 80, -78);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(1024, 1024);
    moonLight.shadow.camera.left = -110;
    moonLight.shadow.camera.right = 110;
    moonLight.shadow.camera.top = 110;
    moonLight.shadow.camera.bottom = -110;
    scene.add(moonLight);
    const cyanFill = new THREE.PointLight(0x55dcff, 32, 95, 2.1);
    cyanFill.position.set(16, 24, 38);
    scene.add(cyanFill);
    const limeFill = new THREE.PointLight(0xdfff88, 18, 72, 2);
    limeFill.position.set(-44, 18, -10);
    scene.add(limeFill);

    function addMoonAndStars() {
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(7.4, 32, 24),
        new THREE.MeshStandardMaterial({ color: 0xc7e6ff, emissive: 0x7bb6ff, emissiveIntensity: 1.35, roughness: 0.78 })
      );
      moon.position.set(-83, 68, -156);
      scene.add(moon);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(10.3, .055, 8, 96),
        new THREE.MeshBasicMaterial({ color: 0x83dbff, transparent: true, opacity: .62 })
      );
      ring.position.copy(moon.position);
      ring.rotation.x = .72;
      ring.rotation.y = .28;
      scene.add(ring);

      const count = 1700;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const angle = rand() * Math.PI * 2;
        const radius = 90 + rand() * 330;
        const elevation = 11 + Math.pow(rand(), .55) * 210;
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = elevation;
        positions[i * 3 + 2] = Math.sin(angle) * radius - 35;
        const warmth = rand();
        colors[i * 3] = .55 + warmth * .45;
        colors[i * 3 + 1] = .72 + warmth * .25;
        colors[i * 3 + 2] = 1;
      }
      const stars = new THREE.Points(
        new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(positions, 3)).setAttribute('color', new THREE.BufferAttribute(colors, 3)),
        new THREE.PointsMaterial({ size: .42, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: .9, depthWrite: false })
      );
      scene.add(stars);
    }
    addMoonAndStars();

    function createBeam(start, end, radius = .14, material = palette.support) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(radius * .75, radius, 1, 8), material);
      beam.position.copy(start).addScaledVector(direction, .5);
      beam.scale.y = length;
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      beam.castShadow = true;
      beam.receiveShadow = true;
      world.add(beam);
      return beam;
    }

    function addIslandsAndHorizon() {
      const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x142234, roughness: .92, metalness: .05 });
      const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x133839, roughness: .85, metalness: .05, emissive: 0x061515, emissiveIntensity: .45 });
      const accentMaterials = [
        new THREE.MeshStandardMaterial({ color: 0x1e3855, emissive: 0x0a294b, emissiveIntensity: 1.3, metalness: .45, roughness: .35 }),
        new THREE.MeshStandardMaterial({ color: 0x243147, emissive: 0x24174a, emissiveIntensity: 1.1, metalness: .5, roughness: .34 }),
        new THREE.MeshStandardMaterial({ color: 0x294434, emissive: 0x224c2a, emissiveIntensity: 1.15, metalness: .36, roughness: .44 })
      ];
      const rockGeo = new THREE.IcosahedronGeometry(1, 1);
      const capGeo = new THREE.ConeGeometry(1, .85, 7);
      const towerGeo = new THREE.BoxGeometry(1, 1, 1);
      const beaconGeo = new THREE.SphereGeometry(.23, 12, 8);
      const beaconMaterials = [palette.glowCyan, palette.glowLime, new THREE.MeshBasicMaterial({ color: 0xd791ff })];

      const islandPositions = [
        [-84, -69, 17], [-92, 38, 23], [-75, 82, 12], [83, -72, 18], [88, 53, 11], [44, 88, 9], [-17, -102, 13], [32, -116, 10]
      ];
      islandPositions.forEach(([x, z, scale], index) => {
        const island = new THREE.Group();
        island.position.set(x, -4.2, z);
        const base = new THREE.Mesh(rockGeo, rockMaterial);
        base.scale.set(scale * 1.8, scale * .56, scale * 1.45);
        base.rotation.set(rand() * 2, rand() * 2, rand() * 2);
        base.castShadow = true;
        island.add(base);
        const cap = new THREE.Mesh(capGeo, grassMaterial);
        cap.scale.set(scale * 1.3, scale * .85, scale * 1.1);
        cap.position.y = scale * .2;
        cap.castShadow = true;
        island.add(cap);
        for (let j = 0; j < 8; j++) {
          const rock = new THREE.Mesh(rockGeo, rockMaterial);
          rock.scale.setScalar(.7 + rand() * 1.8);
          rock.position.set((rand() - .5) * scale * 2.1, scale * .32 + rand() * 2.5, (rand() - .5) * scale * 1.7);
          rock.rotation.set(rand() * 2, rand() * 2, rand() * 2);
          rock.castShadow = true;
          island.add(rock);
        }
        world.add(island);
      });

      for (let i = 0; i < 115; i++) {
        const angle = rand() * Math.PI * 2;
        const r = 112 + rand() * 135;
        const h = 4 + rand() * 33;
        const tower = new THREE.Mesh(towerGeo, accentMaterials[i % accentMaterials.length]);
        tower.position.set(Math.cos(angle) * r, h * .5 - 3.2, Math.sin(angle) * r - 28);
        tower.scale.set(2 + rand() * 4, h, 2 + rand() * 4);
        tower.castShadow = true;
        world.add(tower);
        if (i % 2 === 0) {
          const beacon = new THREE.Mesh(beaconGeo, beaconMaterials[i % beaconMaterials.length]);
          beacon.position.set(tower.position.x, h - 2.8, tower.position.z);
          world.add(beacon);
        }
      }
    }
    addIslandsAndHorizon();

    function addFerrisWheel() {
      const ferris = new THREE.Group();
      ferris.position.set(-52, 11, 35);
      ferris.rotation.y = -.34;
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x103654, metalness: .7, roughness: .22, emissive: 0x0c7ca2, emissiveIntensity: 1.55 });
      const spokeMat = new THREE.MeshStandardMaterial({ color: 0x213144, metalness: .78, roughness: .28, emissive: 0x104468, emissiveIntensity: .8 });
      const wheel = new THREE.Mesh(new THREE.TorusGeometry(13, .23, 8, 96), ringMat);
      ferris.add(wheel);
      const hub = new THREE.Mesh(new THREE.SphereGeometry(1.05, 16, 12), palette.glowLime);
      ferris.add(hub);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2;
        const spoke = createLocalBeam(new THREE.Vector3(0, 0, 0), new THREE.Vector3(Math.cos(a) * 12.5, Math.sin(a) * 12.5, 0), .075, spokeMat);
        ferris.add(spoke);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.15, .75, 1.15), i % 2 ? palette.glowCyan : palette.glowLime);
        cabin.position.set(Math.cos(a) * 13, Math.sin(a) * 13, 0);
        ferris.add(cabin);
      }
      const legA = createLocalBeam(new THREE.Vector3(-4.6, -13.2, 0), new THREE.Vector3(0, -1.2, 0), .22, spokeMat);
      const legB = createLocalBeam(new THREE.Vector3(4.6, -13.2, 0), new THREE.Vector3(0, -1.2, 0), .22, spokeMat);
      ferris.add(legA, legB);
      world.add(ferris);
      return ferris;
    }
    function createLocalBeam(start, end, radius, material) {
      const direction = end.clone().sub(start);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius * .72, radius, 1, 8), material);
      mesh.position.copy(start).addScaledVector(direction, .5);
      mesh.scale.y = direction.length();
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return mesh;
    }
    const ferrisWheel = addFerrisWheel();

    function labelTexture(label, sublabel) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      grad.addColorStop(0, '#72eefa');
      grad.addColorStop(.6, '#d5f9ff');
      grad.addColorStop(1, '#d9ff83');
      ctx.fillStyle = 'rgba(3, 14, 28, .82)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(150, 241, 255, .65)';
      ctx.lineWidth = 5;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
      ctx.fillStyle = grad;
      ctx.font = '700 86px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '10px';
      ctx.fillText(label, 512, 115);
      ctx.fillStyle = '#afcddd';
      ctx.font = '600 23px Arial, sans-serif';
      ctx.fillText(sublabel, 512, 178);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    function addStation() {
      const station = new THREE.Group();
      station.position.set(1, 3.5, 77);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x11263a, metalness: .82, roughness: .26, emissive: 0x0b4263, emissiveIntensity: 1.0 });
      const roof = new THREE.Mesh(new THREE.BoxGeometry(34, 1.0, 13), frameMat);
      roof.position.y = 11.5;
      roof.castShadow = true;
      station.add(roof);
      for (const x of [-14, -7, 0, 7, 14]) {
        const column = new THREE.Mesh(new THREE.CylinderGeometry(.32, .45, 11, 8), frameMat);
        column.position.set(x, 5.5, 0);
        station.add(column);
      }
      const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 5),
        new THREE.MeshBasicMaterial({ map: labelTexture('NIGHTFALL', 'AEROLIGHT PARK  ·  VECTOR RUN'), transparent: true })
      );
      sign.position.set(0, 9.1, -6.6);
      station.add(sign);
      const deck = new THREE.Mesh(new THREE.BoxGeometry(31, .55, 15), palette.tie);
      deck.position.y = .1;
      station.add(deck);
      world.add(station);
    }
    addStation();

    const trackPoints = [
      new THREE.Vector3(-7, 8, 65), new THREE.Vector3(-1, 9, 49), new THREE.Vector3(0, 18, 31),
      new THREE.Vector3(-1, 34, 12), new THREE.Vector3(0, 52, -8), new THREE.Vector3(4, 58, -22),
      new THREE.Vector3(14, 43, -43), new THREE.Vector3(37, 16, -58), new THREE.Vector3(61, 9, -46),
      new THREE.Vector3(70, 17, -22), new THREE.Vector3(63, 28, 4), new THREE.Vector3(47, 33, 20),
      new THREE.Vector3(27, 25, 27), new THREE.Vector3(9, 14, 16), new THREE.Vector3(-9, 7, -2),
      new THREE.Vector3(-30, 11, 1), new THREE.Vector3(-51, 29, -12), new THREE.Vector3(-57, 42, -35),
      new THREE.Vector3(-43, 32, -55), new THREE.Vector3(-21, 18, -65), new THREE.Vector3(2, 8, -49),
      new THREE.Vector3(7, 7, -25), new THREE.Vector3(-11, 10, -6), new THREE.Vector3(-29, 24, 13),
      new THREE.Vector3(-35, 42, 37), new THREE.Vector3(-25, 50, 56), new THREE.Vector3(-5, 39, 67),
      new THREE.Vector3(15, 20, 61), new THREE.Vector3(8, 9, 66)
    ];
    const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');
    trackCurve.arcLengthDivisions = 3600;
    const trackLength = trackCurve.getLength();
    const frameCount = 960;
    const frames = trackCurve.computeFrenetFrames(frameCount, true);
    const frameMatrix = new THREE.Matrix4();
    const tempVector = new THREE.Vector3();

    function getTrackFrame(progress) {
      const u = ((progress % 1) + 1) % 1;
      const t = trackCurve.getUtoTmapping(u);
      const f = Math.max(0, Math.min(frameCount, Math.round(t * frameCount)));
      const point = trackCurve.getPointAt(u);
      const tangent = trackCurve.getTangentAt(u).normalize();
      const side = frames.binormals[f].clone().normalize();
      const up = frames.normals[f].clone().normalize();
      return { point, tangent, side, up, t, index: f };
    }

    const decorativeRings = [];
    function buildTrack() {
      const leftRail = [];
      const rightRail = [];
      const spinePath = [];
      for (let i = 0; i < frameCount; i++) {
        const t = i / frameCount;
        const point = trackCurve.getPoint(t);
        const side = frames.binormals[i].clone().normalize();
        const up = frames.normals[i].clone().normalize();
        leftRail.push(point.clone().addScaledVector(side, -1.12).addScaledVector(up, .06));
        rightRail.push(point.clone().addScaledVector(side, 1.12).addScaledVector(up, .06));
        spinePath.push(point.clone().addScaledVector(up, -.5));
      }
      const makeTube = (points, radius, material, segments = 850) => new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points, true, 'centripetal'), segments, radius, 8, true), material
      );
      const railA = makeTube(leftRail, .15, palette.rail);
      const railB = makeTube(rightRail, .15, palette.rail);
      const spine = makeTube(spinePath, .19, palette.spine);
      railA.castShadow = railB.castShadow = spine.castShadow = true;
      world.add(railA, railB, spine);

      const tieCount = Math.ceil(frameCount / 5);
      const ties = new THREE.InstancedMesh(new THREE.BoxGeometry(2.85, .16, .42), palette.tie, tieCount);
      ties.castShadow = true;
      ties.receiveShadow = true;
      for (let n = 0, i = 0; i < frameCount; i += 5, n++) {
        const point = trackCurve.getPoint(i / frameCount);
        const side = frames.binormals[i].clone().normalize();
        const up = frames.normals[i].clone().normalize();
        const tangent = frames.tangents[i].clone().normalize();
        frameMatrix.makeBasis(side, up, tangent.clone().negate());
        frameMatrix.setPosition(point.addScaledVector(up, -.23));
        ties.setMatrixAt(n, frameMatrix);
      }
      ties.instanceMatrix.needsUpdate = true;
      world.add(ties);

      const jointGeo = new THREE.SphereGeometry(.23, 10, 8);
      for (let i = 0; i < frameCount; i += 18) {
        const point = trackCurve.getPoint(i / frameCount);
        const side = frames.binormals[i].clone().normalize();
        const up = frames.normals[i].clone().normalize();
        for (const direction of [-1, 1]) {
          const joint = new THREE.Mesh(jointGeo, direction === 1 ? palette.glowCyan : palette.glowLime);
          joint.position.copy(point).addScaledVector(side, direction * 1.13).addScaledVector(up, .04);
          world.add(joint);
        }
      }

      for (let i = 8; i < frameCount; i += 27) {
        const point = trackCurve.getPoint(i / frameCount);
        const up = frames.normals[i].clone().normalize();
        const side = frames.binormals[i].clone().normalize();
        if (point.y < 5.4) continue;
        const anchor = point.clone().addScaledVector(up, -.46);
        const base = new THREE.Vector3(point.x, -3.0, point.z);
        createBeam(base.clone().addScaledVector(side, -.7), anchor.clone().addScaledVector(side, -.64), .19);
        createBeam(base.clone().addScaledVector(side, .7), anchor.clone().addScaledVector(side, .64), .19);
        const braceHeight = Math.max(-1.2, anchor.y * .42 - 2);
        createBeam(new THREE.Vector3(point.x - 1.6, braceHeight, point.z), anchor.clone().addScaledVector(side, -.64), .09, palette.tie);
        createBeam(new THREE.Vector3(point.x + 1.6, braceHeight, point.z), anchor.clone().addScaledVector(side, .64), .09, palette.tie);
      }

      const gatePositions = [.078, .152, .255, .372, .517, .658, .805, .918];
      gatePositions.forEach((u, i) => {
        const frame = getTrackFrame(u);
        const group = new THREE.Group();
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(i % 3 === 0 ? 5.8 : 4.65, .105, 8, 72),
          i % 2 ? palette.glowCyan : palette.glowLime
        );
        const inner = new THREE.Mesh(
          new THREE.TorusGeometry(i % 3 === 0 ? 5.3 : 4.15, .027, 5, 64),
          new THREE.MeshBasicMaterial({ color: 0xa4eaff, transparent: true, opacity: .68 })
        );
        frameMatrix.makeBasis(frame.side, frame.up, frame.tangent.clone().negate());
        group.quaternion.setFromRotationMatrix(frameMatrix);
        group.position.copy(frame.point).addScaledVector(frame.up, .45);
        group.add(ring, inner);
        world.add(group);
        decorativeRings.push({ group, phase: i * .67, baseScale: i % 3 === 0 ? 1.18 : 1 });
      });
    }
    buildTrack();

    function buildRideCar() {
      const car = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.84, .48, 2.75), palette.canopy);
      body.position.set(0, -.58, -2.05);
      body.castShadow = true;
      car.add(body);
      const nose = new THREE.Mesh(new THREE.CylinderGeometry(.55, .92, 1.45, 5), palette.canopy);
      nose.rotation.x = Math.PI / 2;
      nose.rotation.z = Math.PI / 5;
      nose.position.set(0, -.51, -3.53);
      car.add(nose);
      const dash = new THREE.Mesh(new THREE.BoxGeometry(1.18, .08, .65), palette.glowCyan);
      dash.position.set(0, -.28, -2.95);
      car.add(dash);
      for (const side of [-1, 1]) {
        const wing = new THREE.Mesh(new THREE.BoxGeometry(.5, .1, 1.45), palette.glowLime);
        wing.position.set(side * 1.06, -.6, -2.15);
        wing.rotation.z = side * -.2;
        car.add(wing);
      }
      const headLamp = new THREE.PointLight(0x7df7ff, 5.6, 20, 2.6);
      headLamp.position.set(0, -.1, -3.1);
      car.add(headLamp);
      rideRig.add(car);
    }
    buildRideCar();

    const cloudCount = 180;
    const cloudPositions = new Float32Array(cloudCount * 3);
    const cloudSeeds = [];
    for (let i = 0; i < cloudCount; i++) {
      const a = rand() * Math.PI * 2;
      const r = 24 + rand() * 105;
      cloudPositions[i * 3] = Math.cos(a) * r;
      cloudPositions[i * 3 + 1] = 1 + rand() * 31;
      cloudPositions[i * 3 + 2] = Math.sin(a) * r;
      cloudSeeds.push(rand() * Math.PI * 2);
    }
    const cloudGeometry = new THREE.BufferGeometry();
    cloudGeometry.setAttribute('position', new THREE.BufferAttribute(cloudPositions, 3));
    const clouds = new THREE.Points(cloudGeometry, new THREE.PointsMaterial({ color: 0x7ddcff, size: 1.4, transparent: true, opacity: .23, depthWrite: false, blending: THREE.AdditiveBlending }));
    world.add(clouds);

    const lightning = new THREE.PointLight(0xb8f4ff, 0, 180, 1.8);
    lightning.position.set(42, 58, -35);
    scene.add(lightning);
    let nextFlash = 9;

    let progress = .002;
    let velocity = 24;
    let cinematic = false;
    let pointerX = 0;
    let pointerY = 0;
    let smoothPointerX = 0;
    let smoothPointerY = 0;

    function toggleCinematic() {
      cinematic = !cinematic;
      focusButton.setAttribute('aria-pressed', String(cinematic));
      focusButton.textContent = cinematic ? 'Immersive view' : 'Cinematic view';
      hint.style.opacity = cinematic ? '.15' : '1';
    }
    focusButton.addEventListener('click', toggleCinematic);
    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        toggleCinematic();
      }
    });
    window.addEventListener('pointermove', (event) => {
      pointerX = (event.clientX / innerWidth - .5) * 2;
      pointerY = (event.clientY / innerHeight - .5) * 2;
    }, { passive: true });

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.65));
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', onResize);

    function updateRide(delta, elapsed) {
      const before = getTrackFrame(progress);
      const downhill = Math.max(0, -before.tangent.y);
      const climbing = Math.max(0, before.tangent.y);
      const targetVelocity = THREE.MathUtils.clamp(27 + downhill * 83 - climbing * 11, 16, 91);
      velocity = THREE.MathUtils.damp(velocity, targetVelocity, 1.45, delta);
      progress = (progress + velocity * delta / trackLength) % 1;
      const frame = getTrackFrame(progress);
      const cornerPulse = Math.abs(Math.sin(frame.t * Math.PI * 12));
      const rideRoll = (Math.sin(frame.t * Math.PI * 8) * .065 + Math.sin(elapsed * 2.1) * .009) * (0.45 + downhill);
      frameMatrix.makeBasis(frame.side, frame.up, frame.tangent.clone().negate());
      rideRig.quaternion.setFromRotationMatrix(frameMatrix);
      rideRig.rotateZ(rideRoll);
      rideRig.position.copy(frame.point).addScaledVector(frame.up, .37);

      smoothPointerX = THREE.MathUtils.damp(smoothPointerX, pointerX, 4.2, delta);
      smoothPointerY = THREE.MathUtils.damp(smoothPointerY, pointerY, 4.2, delta);
      camera.rotation.set(-smoothPointerY * .018 + Math.sin(elapsed * 14) * .0025, -smoothPointerX * .032, 0);
      camera.position.x = smoothPointerX * .034;
      camera.position.y = .72 + Math.cos(elapsed * 16) * .006 * (velocity / 90);
      const fov = cinematic ? 63 : 74 + velocity * .075;
      camera.fov = THREE.MathUtils.damp(camera.fov, fov, 4, delta);
      camera.updateProjectionMatrix();

      const displayKmh = Math.round(velocity * 3.6);
      speedReadout.textContent = String(displayKmh).padStart(3, '0');
      forceReadout.textContent = (1.0 + downhill * 1.5 + cornerPulse * .55).toFixed(1);
      progressFill.style.transform = `scaleX(${.07 + progress * .93})`;
      sector.textContent = `${String(Math.floor(progress * 12) + 1).padStart(2, '0')}/12`;
    }

    function updateAtmosphere(elapsed) {
      skyMaterial.uniforms.uTime.value = elapsed;
      waterMaterial.uniforms.uTime.value = elapsed;
      ferrisWheel.rotation.z = Math.sin(elapsed * .12) * .018;
      decorativeRings.forEach(({ group, phase, baseScale }, i) => {
        const pulse = 1 + Math.sin(elapsed * 2.4 + phase) * .035;
        group.scale.setScalar(baseScale * pulse);
        group.rotation.z += .00075 * (i % 2 ? -1 : 1);
      });
      const positions = clouds.geometry.attributes.position.array;
      for (let i = 0; i < cloudCount; i++) {
        positions[i * 3 + 1] += Math.sin(elapsed * .36 + cloudSeeds[i]) * .0015;
      }
      clouds.geometry.attributes.position.needsUpdate = true;
      cyanFill.intensity = 27 + Math.sin(elapsed * 1.7) * 5;
      limeFill.intensity = 16 + Math.cos(elapsed * 1.2) * 3;
      if (elapsed > nextFlash) {
        nextFlash = elapsed + 9 + rand() * 13;
        lightning.intensity = 80;
        flash.style.opacity = '.85';
        setTimeout(() => { lightning.intensity = 0; flash.style.opacity = '0'; }, 75);
      }
    }

    function animate() {
      const delta = Math.min(clock.getDelta(), .05);
      const elapsed = clock.elapsedTime;
      updateRide(delta, elapsed);
      updateAtmosphere(elapsed);
      composer.render();
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(() => {
      loading.classList.add('done');
      setTimeout(() => { hint.style.opacity = '.55'; }, 7500);
      animate();
    });
  </script>
</body>
</html>
