<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050718">
  <title>Firework Nocturne</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef5ff;
      --muted: #a4b1cf;
      --glass: rgba(9, 12, 35, 0.42);
      --line: rgba(205, 223, 255, 0.19);
      --accent: #ffe29a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #040617;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    body {
      color: var(--ink);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .vignette,
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .vignette {
      z-index: 1;
      background:
        radial-gradient(circle at 50% 40%, transparent 12%, rgba(1, 2, 12, 0.12) 57%, rgba(1, 2, 10, 0.7) 100%),
        linear-gradient(180deg, rgba(1, 3, 19, 0.06), rgba(1, 2, 13, 0.42));
    }

    .grain {
      z-index: 2;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .masthead {
      position: fixed;
      z-index: 3;
      top: clamp(22px, 5vw, 58px);
      left: clamp(22px, 6vw, 90px);
      right: clamp(22px, 6vw, 90px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      pointer-events: none;
    }

    .brand {
      max-width: 440px;
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.7);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 13px;
      color: #d3e3ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: #ffd47b;
      box-shadow: 0 0 0 0 rgba(255, 212, 123, 0.72);
      animation: beacon 2.2s infinite;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 6.4vw, 88px);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .brand p {
      margin: 19px 0 0;
      max-width: 350px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .show-card {
      min-width: 155px;
      padding: 13px 15px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--glass);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: right;
    }

    .show-card span {
      display: block;
      color: #aebcdd;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .show-card strong {
      display: block;
      margin-top: 5px;
      color: #fff6dc;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 400;
    }

    .controls {
      position: fixed;
      z-index: 4;
      right: clamp(22px, 6vw, 90px);
      bottom: clamp(22px, 5vw, 58px);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hint {
      position: fixed;
      z-index: 3;
      left: clamp(22px, 6vw, 90px);
      bottom: clamp(25px, 5vw, 58px);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #bac6df;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 12px #000;
      pointer-events: none;
    }

    .key {
      display: inline-grid;
      min-width: 22px;
      height: 20px;
      place-items: center;
      padding: 0 5px;
      border: 1px solid rgba(216, 232, 255, 0.35);
      border-bottom-color: rgba(216, 232, 255, 0.56);
      border-radius: 5px;
      background: rgba(12, 17, 44, 0.48);
      color: #eef4ff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0;
    }

    button {
      appearance: none;
      min-width: 41px;
      height: 41px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(9, 12, 35, 0.52);
      color: #f6f8ff;
      font: 600 11px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 7px 26px rgba(0, 0, 0, 0.23);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button:hover {
      border-color: rgba(255, 235, 181, 0.68);
      background: rgba(32, 34, 69, 0.7);
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 2px solid #ffe29a;
      outline-offset: 3px;
    }

    #pauseButton {
      display: grid;
      place-items: center;
      padding: 0;
    }

    #pauseButton::before {
      width: 8px;
      height: 12px;
      content: "";
      border-right: 2px solid currentColor;
      border-left: 2px solid currentColor;
    }

    #pauseButton.is-paused::before {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid currentColor;
      border-right: 0;
    }

    .announcement {
      position: fixed;
      z-index: 5;
      bottom: 104px;
      left: 50%;
      transform: translate(-50%, 10px);
      opacity: 0;
      padding: 9px 13px;
      border: 1px solid rgba(219, 232, 255, 0.2);
      border-radius: 99px;
      background: rgba(8, 11, 30, 0.58);
      color: #f1f6ff;
      font-size: 11px;
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      backdrop-filter: blur(12px);
    }

    .announcement.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @keyframes beacon {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 212, 123, 0.6); }
      44% { box-shadow: 0 0 0 7px rgba(255, 212, 123, 0); }
    }

    @media (max-width: 640px) {
      .masthead {
        align-items: stretch;
      }

      .show-card {
        min-width: 0;
        padding: 10px 11px;
      }

      .show-card strong {
        font-size: 15px;
      }

      .brand p {
        max-width: 245px;
      }

      .hint {
        max-width: 160px;
        line-height: 1.4;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="An animated fireworks display. Click anywhere to launch a firework."></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <header class="masthead">
    <div class="brand">
      <div class="eyebrow"><i class="pulse"></i> A small sky ritual</div>
      <h1>Firework<br>Nocturne</h1>
      <p>A slow, hand-lit celebration above the sleeping city. Choose a place in the sky and send one up.</p>
    </div>
    <aside class="show-card" aria-label="Show information">
      <span>Tonight's sequence</span>
      <strong id="sequenceName">Opening bloom</strong>
    </aside>
  </header>

  <div class="hint"><span class="key">click</span><span>Place a firework anywhere</span></div>
  <div class="controls">
    <button id="pauseButton" type="button" aria-label="Pause the display" title="Pause the display"></button>
    <button id="launchButton" type="button">Launch one</button>
  </div>
  <div id="announcement" class="announcement" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d", { alpha: false });
      const pauseButton = document.getElementById("pauseButton");
      const launchButton = document.getElementById("launchButton");
      const sequenceName = document.getElementById("sequenceName");
      const announcement = document.getElementById("announcement");

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const palette = [
        { hue: 348, name: "Rose chorus" },
        { hue: 42, name: "Gold rain" },
        { hue: 200, name: "Blue hour" },
        { hue: 280, name: "Violet bloom" },
        { hue: 118, name: "Green spark" },
        { hue: 18, name: "Ember fan" }
      ];
      const styles = ["peony", "chrysanthemum", "willow", "palm", "crossette"];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let stars = [];
      let skyline = [];
      let rockets = [];
      let particles = [];
      let rings = [];
      let flashes = [];
      let paused = false;
      let lastFrame = performance.now();
      let nextAutoLaunch = 550;
      let autoClock = 0;
      let nextPalette = 0;
      let announcementTimer = 0;

      const random = (min, max) => min + Math.random() * (max - min);
      const pick = (items) => items[Math.floor(Math.random() * items.length)];
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const hsla = (hue, saturation, lightness, alpha) =>
        "hsla(" + hue + "," + saturation + "%," + lightness + "%," + alpha + ")";

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        stars = Array.from({ length: Math.max(55, Math.floor(width * height / 11500)) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height * 0.68,
          r: Math.random() * 1.25 + 0.15,
          alpha: random(0.18, 0.78),
          phase: Math.random() * Math.PI * 2
        }));

        skyline = [];
        let x = -10;
        while (x < width + 30) {
          const buildingWidth = random(26, 85);
          const buildingHeight = random(height * 0.055, height * 0.2);
          const windows = [];
          for (let wx = x + 8; wx < x + buildingWidth - 6; wx += 11) {
            for (let wy = height - buildingHeight + 12; wy < height - 8; wy += 14) {
              if (Math.random() > 0.61) {
                windows.push({ x: wx, y: wy, warm: Math.random() > 0.42 });
              }
            }
          }
          skyline.push({ x, width: buildingWidth, height: buildingHeight, windows });
          x += buildingWidth + random(2, 8);
        }
      }

      function drawBase(time) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#070a26");
        sky.addColorStop(0.48, "#07112e");
        sky.addColorStop(0.78, "#0b1330");
        sky.addColorStop(1, "#020411");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(width * 0.68, height * 0.2, 8, width * 0.68, height * 0.2, width * 0.52);
        glow.addColorStop(0, "rgba(76, 106, 190, 0.17)");
        glow.addColorStop(1, "rgba(15, 20, 55, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        const moonX = width * 0.76;
        const moonY = Math.max(110, height * 0.2);
        const moonRadius = clamp(width * 0.032, 18, 39);
        const moonGlow = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.3, moonX, moonY, moonRadius * 4.7);
        moonGlow.addColorStop(0, "rgba(239, 245, 255, 0.24)");
        moonGlow.addColorStop(0.28, "rgba(204, 222, 255, 0.08)");
        moonGlow.addColorStop(1, "rgba(168, 193, 255, 0)");
        ctx.fillStyle = moonGlow;
        ctx.fillRect(moonX - moonRadius * 5, moonY - moonRadius * 5, moonRadius * 10, moonRadius * 10);
        ctx.fillStyle = "#dfeaff";
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(142, 165, 213, 0.18)";
        ctx.beginPath();
        ctx.arc(moonX - moonRadius * 0.28, moonY - moonRadius * 0.12, moonRadius * 0.15, 0, Math.PI * 2);
        ctx.arc(moonX + moonRadius * 0.28, moonY + moonRadius * 0.2, moonRadius * 0.23, 0, Math.PI * 2);
        ctx.fill();

        stars.forEach((star) => {
          const twinkle = 0.75 + Math.sin(time * 0.0014 + star.phase) * 0.25;
          ctx.fillStyle = "rgba(218,231,255," + star.alpha * twinkle + ")";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawCity() {
        const haze = ctx.createLinearGradient(0, height * 0.62, 0, height);
        haze.addColorStop(0, "rgba(38, 61, 123, 0)");
        haze.addColorStop(1, "rgba(2, 4, 13, 0.58)");
        ctx.fillStyle = haze;
        ctx.fillRect(0, height * 0.62, width, height * 0.38);

        skyline.forEach((building, index) => {
          const y = height - building.height;
          const shade = 7 + (index % 3) * 2;
          ctx.fillStyle = "rgb(" + shade + "," + (shade + 5) + "," + (shade + 18) + ")";
          ctx.fillRect(building.x, y, building.width, building.height + 1);
          ctx.fillStyle = "rgba(168,190,255,0.035)";
          ctx.fillRect(building.x + 2, y, 2, building.height);
          building.windows.forEach((windowLight) => {
            ctx.fillStyle = windowLight.warm ? "rgba(255,196,105,0.34)" : "rgba(137,184,255,0.24)";
            ctx.fillRect(windowLight.x, windowLight.y, 2.2, 4.1);
          });
        });

        const foreground = ctx.createLinearGradient(0, height * 0.82, 0, height);
        foreground.addColorStop(0, "rgba(1, 3, 12, 0)");
        foreground.addColorStop(1, "rgba(0, 1, 7, 0.88)");
        ctx.fillStyle = foreground;
        ctx.fillRect(0, height * 0.8, width, height * 0.2);
      }

      function addParticle(options) {
        if (particles.length > 1850) {
          particles.splice(0, particles.length - 1850);
        }
        particles.push({
          x: options.x,
          y: options.y,
          vx: options.vx || 0,
          vy: options.vy || 0,
          gravity: options.gravity ?? 34,
          drag: options.drag ?? 0.985,
          life: options.life ?? 1.45,
          maxLife: options.life ?? 1.45,
          hue: options.hue ?? 48,
          saturation: options.saturation ?? 94,
          lightness: options.lightness ?? 62,
          size: options.size ?? 1.6,
          trail: [],
          trailLength: options.trailLength ?? 5,
          twinkle: options.twinkle ?? 0,
          splitAt: options.splitAt,
          splitCount: options.splitCount,
          dead: false
        });
      }

      function launchRocket(targetX, targetY, selection) {
        const chosen = selection || palette[nextPalette++ % palette.length];
        const launchX = clamp(targetX + random(-width * 0.16, width * 0.16), 30, width - 30);
        const startY = height + 20;
        const destinationY = clamp(targetY, height * 0.13, height * 0.64);
        const duration = random(0.78, 1.12);
        rockets.push({
          x: launchX,
          y: startY,
          vx: (targetX - launchX) / duration,
          vy: (destinationY - startY) / duration,
          targetX,
          targetY: destinationY,
          duration,
          age: 0,
          hue: chosen.hue,
          style: pick(styles),
          name: chosen.name,
          trailClock: 0
        });
      }

      function burst(x, y, hue, style) {
        rings.push({ x, y, radius: 4, life: 0.62, maxLife: 0.62, hue });
        flashes.push({ x, y, radius: random(22, 38), life: 0.14, maxLife: 0.14, hue });

        if (style === "willow") {
          for (let i = 0; i < 115; i++) {
            const angle = (Math.PI * 2 * i) / 115 + random(-0.03, 0.03);
            const speed = random(42, 165) * (0.52 + Math.random() * 0.68);
            addParticle({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed * 0.86,
              gravity: random(39, 54),
              drag: 0.989,
              life: random(1.55, 2.42),
              hue: hue + random(-6, 8),
              saturation: random(75, 98),
              lightness: random(58, 77),
              size: random(1.2, 2.3),
              trailLength: 9,
              twinkle: 1
            });
          }
          return;
        }

        if (style === "palm") {
          const arms = 13;
          for (let arm = 0; arm < arms; arm++) {
            const angle = (Math.PI * 2 * arm) / arms + random(-0.08, 0.08);
            for (let i = 0; i < 12; i++) {
              const speed = random(60, 175) * (0.85 + i * 0.032);
              addParticle({
                x: x + random(-2, 2),
                y: y + random(-2, 2),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed * 0.74,
                gravity: 34,
                drag: 0.987,
                life: random(1.15, 1.72),
                hue: hue + random(-3, 5),
                saturation: 95,
                lightness: random(55, 69),
                size: random(1.35, 2.35),
                trailLength: 8,
                twinkle: 0.45
              });
            }
          }
          return;
        }

        const count = style === "chrysanthemum" ? 150 : style === "crossette" ? 70 : 122;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + random(-0.027, 0.027);
          const speed = style === "chrysanthemum"
            ? random(82, 218)
            : style === "crossette"
              ? random(78, 158)
              : random(58, 194);
          addParticle({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: style === "chrysanthemum" ? 28 : 34,
            drag: style === "chrysanthemum" ? 0.988 : 0.982,
            life: style === "chrysanthemum" ? random(1.35, 2.05) : random(1.08, 1.72),
            hue: hue + random(-12, 12),
            saturation: random(78, 100),
            lightness: random(54, 72),
            size: random(1.2, 2.5),
            trailLength: style === "chrysanthemum" ? 8 : 5,
            twinkle: style === "chrysanthemum" ? 0.65 : 0.28,
            splitAt: style === "crossette" ? random(0.42, 0.58) : null,
            splitCount: style === "crossette" ? 4 : 0
          });
        }
      }

      function splitParticle(particle) {
        const children = particle.splitCount || 4;
        for (let i = 0; i < children; i++) {
          const angle = (Math.PI * 2 * i) / children + random(-0.16, 0.16);
          const speed = random(45, 82);
          addParticle({
            x: particle.x,
            y: particle.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 40,
            drag: 0.978,
            life: random(0.55, 0.86),
            hue: particle.hue + random(-6, 6),
            saturation: 96,
            lightness: 70,
            size: random(1.05, 1.75),
            trailLength: 4,
            twinkle: 0.8
          });
        }
        rings.push({
          x: particle.x,
          y: particle.y,
          radius: 3,
          life: 0.2,
          maxLife: 0.2,
          hue: particle.hue
        });
      }

      function update(dt) {
        rockets = rockets.filter((rocket) => {
          rocket.age += dt;
          rocket.x += rocket.vx * dt;
          rocket.y += rocket.vy * dt;
          rocket.trailClock += dt;

          if (rocket.trailClock > 0.025) {
            rocket.trailClock = 0;
            addParticle({
              x: rocket.x + random(-1, 1),
              y: rocket.y + random(-1, 1),
              vx: random(-7, 7),
              vy: random(4, 18),
              gravity: 15,
              drag: 0.92,
              life: random(0.24, 0.44),
              hue: rocket.hue,
              saturation: 95,
              lightness: 72,
              size: random(0.8, 1.65),
              trailLength: 2,
              twinkle: 0.6
            });
          }

          if (rocket.age >= rocket.duration || rocket.y <= rocket.targetY) {
            burst(rocket.x, rocket.y, rocket.hue, rocket.style);
            sequenceName.textContent = rocket.name;
            return false;
          }
          return true;
        });

        particles = particles.filter((particle) => {
          const previousRatio = particle.life / particle.maxLife;
          particle.life -= dt;
          if (particle.life <= 0 || particle.dead) return false;

          particle.trail.unshift({ x: particle.x, y: particle.y });
          if (particle.trail.length > particle.trailLength) particle.trail.pop();

          particle.vx *= Math.pow(particle.drag, dt * 60);
          particle.vy *= Math.pow(particle.drag, dt * 60);
          particle.vy += particle.gravity * dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;

          const currentRatio = particle.life / particle.maxLife;
          if (particle.splitAt && previousRatio > particle.splitAt && currentRatio <= particle.splitAt) {
            splitParticle(particle);
          }
          return particle.y < height + 55 && particle.x > -55 && particle.x < width + 55;
        });

        rings = rings.filter((ring) => {
          ring.life -= dt;
          ring.radius += (145 + ring.radius * 0.55) * dt;
          return ring.life > 0;
        });

        flashes = flashes.filter((flash) => {
          flash.life -= dt;
          flash.radius += 380 * dt;
          return flash.life > 0;
        });
      }

      function renderEffects() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        flashes.forEach((flash) => {
          const alpha = Math.pow(flash.life / flash.maxLife, 2) * 0.35;
          const radial = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, flash.radius);
          radial.addColorStop(0, hsla(flash.hue, 100, 88, alpha));
          radial.addColorStop(0.25, hsla(flash.hue, 100, 74, alpha * 0.23));
          radial.addColorStop(1, hsla(flash.hue, 100, 70, 0));
          ctx.fillStyle = radial;
          ctx.beginPath();
          ctx.arc(flash.x, flash.y, flash.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        rings.forEach((ring) => {
          const alpha = Math.pow(ring.life / ring.maxLife, 1.4) * 0.42;
          ctx.strokeStyle = hsla(ring.hue, 96, 76, alpha);
          ctx.lineWidth = Math.max(0.65, ring.life * 2.6);
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
          ctx.stroke();
        });

        rockets.forEach((rocket) => {
          const flame = ctx.createRadialGradient(rocket.x, rocket.y, 0, rocket.x, rocket.y, 9);
          flame.addColorStop(0, "rgba(255,255,239,1)");
          flame.addColorStop(0.2, hsla(rocket.hue, 100, 76, 0.88));
          flame.addColorStop(1, hsla(rocket.hue, 100, 65, 0));
          ctx.fillStyle = flame;
          ctx.beginPath();
          ctx.arc(rocket.x, rocket.y, 9, 0, Math.PI * 2);
          ctx.fill();
        });

        particles.forEach((particle) => {
          const ratio = particle.life / particle.maxLife;
          const alpha = Math.pow(ratio, 0.82) * (particle.twinkle ? 0.58 + Math.sin(performance.now() * 0.018 + particle.x) * 0.36 : 0.92);
          const trail = particle.trail;
          if (trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(particle.x, particle.y);
            for (let i = 0; i < trail.length; i++) {
              ctx.lineTo(trail[i].x, trail[i].y);
            }
            ctx.strokeStyle = hsla(particle.hue, particle.saturation, particle.lightness, alpha * 0.38);
            ctx.lineWidth = Math.max(0.55, particle.size * ratio);
            ctx.stroke();
          }

          const glowRadius = particle.size * (3.2 + ratio * 2.4);
          const glow = ctx.createRadialGradient(particle.x, particle.y, 0, particle.x, particle.y, glowRadius);
          glow.addColorStop(0, hsla(particle.hue, 100, 92, alpha));
          glow.addColorStop(0.16, hsla(particle.hue, particle.saturation, particle.lightness, alpha));
          glow.addColorStop(0.55, hsla(particle.hue, particle.saturation, particle.lightness, alpha * 0.22));
          glow.addColorStop(1, hsla(particle.hue, particle.saturation, particle.lightness, 0));
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, glowRadius, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        drawBase(now);

        if (!paused) {
          autoClock += dt * 1000;
          if (autoClock >= nextAutoLaunch) {
            const targetX = random(width * 0.16, width * 0.84);
            const targetY = random(height * 0.15, height * 0.49);
            launchRocket(targetX, targetY);
            nextAutoLaunch = autoClock + random(reduceMotion ? 2100 : 780, reduceMotion ? 3300 : 1500);
          }
          update(dt);
        }

        renderEffects();
        drawCity();
        requestAnimationFrame(frame);
      }

      function showAnnouncement(text) {
        announcement.textContent = text;
        announcement.classList.add("show");
        window.clearTimeout(announcementTimer);
        announcementTimer = window.setTimeout(() => announcement.classList.remove("show"), 1450);
      }

      function manualLaunch(x, y) {
        if (paused) return;
        launchRocket(x, y, pick(palette));
        showAnnouncement("A new bloom is on its way");
      }

      canvas.addEventListener("pointerdown", (event) => {
        manualLaunch(event.clientX, event.clientY);
      });

      launchButton.addEventListener("click", () => {
        manualLaunch(random(width * 0.2, width * 0.8), random(height * 0.18, height * 0.5));
      });

      pauseButton.addEventListener("click", () => {
        paused = !paused;
        pauseButton.classList.toggle("is-paused", paused);
        pauseButton.setAttribute("aria-label", paused ? "Resume the display" : "Pause the display");
        pauseButton.title = paused ? "Resume the display" : "Pause the display";
        showAnnouncement(paused ? "The sky is holding its breath" : "The show continues");
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === " " && document.activeElement.tagName !== "BUTTON") {
          event.preventDefault();
          manualLaunch(random(width * 0.2, width * 0.8), random(height * 0.18, height * 0.5));
        }
        if (event.key.toLowerCase() === "p") {
          pauseButton.click();
        }
      });

      window.addEventListener("resize", resize);
      resize();

      // The first few launches are composed deliberately, then the show becomes generative.
      window.setTimeout(() => launchRocket(width * 0.3, height * 0.35, palette[0]), 240);
      window.setTimeout(() => launchRocket(width * 0.66, height * 0.29, palette[2]), 940);
      window.setTimeout(() => launchRocket(width * 0.49, height * 0.21, palette[1]), 1700);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
