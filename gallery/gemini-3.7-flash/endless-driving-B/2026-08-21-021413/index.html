<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacific Twilight — Coastal Highway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050b14; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud-panel {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .glass-ui {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .top-deck {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .bottom-deck {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(56, 189, 248, 0.25); border-color: #38bdf8; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud-panel">
    <div class="top-deck">
      <div class="glass-ui">
        <div style="font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.1em;">Coastal Highway 1</div>
        <div style="font-size: 14px; font-weight: 800;">PACIFIC TWILIGHT • 80s GT</div>
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="glass-ui" style="text-align: right; min-width: 90px;">
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Speed</div>
          <div class="stat-val"><span id="speed-num">105</span> <span style="font-size: 11px; color: #94a3b8;">KM/H</span></div>
        </div>
        <div class="glass-ui" style="text-align: right; min-width: 90px;">
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Trip</div>
          <div class="stat-val"><span id="trip-num">0.0</span> <span style="font-size: 11px; color: #94a3b8;">KM</span></div>
        </div>
      </div>
    </div>

    <div class="bottom-deck">
      <div style="display: flex; gap: 8px; pointer-events: auto;">
        <button id="btn-radio" class="btn">📻 Radio: Synthwave</button>
        <button id="btn-cam" class="btn">🎥 Cam: Low Chase</button>
        <button id="btn-lights" class="btn">💡 Pop-up Lights: Up</button>
      </div>
      <div class="glass-ui" style="font-size: 11px; color: #94a3b8;">
        <b>W/S</b> Throttle & Brake • <b>A/D</b> Steer
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Synth Audio Engine
    let audioCtx = null;
    let engineOsc = null;
    let synthChordGain = null;
    let isRadioOn = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Engine tone
      engineOsc = audioCtx.createOscillator();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.value = 60;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 160;

      const engineGain = audioCtx.createGain();
      engineGain.gain.value = 0.08;

      engineOsc.connect(filter);
      filter.connect(engineGain);
      engineGain.connect(audioCtx.destination);
      engineOsc.start();

      // Synth Chords (Fmaj7 -> G -> Em)
      const freqs = [174.61, 220.00, 261.63, 329.63];
      synthChordGain = audioCtx.createGain();
      synthChordGain.gain.value = 0.05;

      freqs.forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(synthChordGain);
        osc.start();
      });
      synthChordGain.connect(audioCtx.destination);
      isRadioOn = true;
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060c18);
    scene.fog = new THREE.FogExp2(0x060c18, 0.0075);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Twilight Hemisphere & Directional Sunset Glow
    const hemi = new THREE.HemisphereLight(0x38bdf8, 0x020617, 0.6);
    scene.add(hemi);

    const sunsetLight = new THREE.DirectionalLight(0xf43f5e, 1.2);
    sunsetLight.position.set(-200, 40, -400);
    scene.add(sunsetLight);

    // Ocean on Left Side & Rocky Cliffs on Right Side
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 1200),
      new THREE.MeshStandardMaterial({ color: 0x071e3d, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.85 })
    );
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.set(-260, -2, 0);
    scene.add(ocean);

    // Lighthouse on Ocean Promontory
    const lighthouseGroup = new THREE.Group();
    const lhBase = new THREE.Mesh(new THREE.CylinderGeometry(4, 7, 35, 12), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
    lhBase.position.y = 17.5;
    lighthouseGroup.add(lhBase);

    const lhLight = new THREE.SpotLight(0xfef08a, 40, 400, Math.PI / 8, 0.2);
    lhLight.position.set(0, 36, 0);
    lighthouseGroup.add(lhLight);
    lighthouseGroup.add(lhLight.target);
    lighthouseGroup.position.set(-280, 0, -500);
    scene.add(lighthouseGroup);

    // Coastal Highway Chunks (3 Lanes with Cliff Wall on Right)
    const roadWidth = 16;
    const chunkLength = 120;
    const numChunks = 7;
    const roadChunks = [];

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.75, metalness: 0.3 });
    const cliffMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const yellowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

    for (let c = 0; c < numChunks; c++) {
      const chunk = new THREE.Group();

      // Road deck
      const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, chunkLength), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.receiveShadow = true;
      chunk.add(road);

      // Cliff wall on the right
      const cliff = new THREE.Mesh(new THREE.BoxGeometry(20, 25, chunkLength), cliffMat);
      cliff.position.set(roadWidth / 2 + 10, 12.5, 0);
      chunk.add(cliff);

      // Ocean guardrail on the left
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.0, chunkLength), new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8 }));
      rail.position.set(-roadWidth / 2 - 0.2, 0.5, 0);
      chunk.add(rail);

      // Lane dividers (3 lanes)
      for (let x of [-roadWidth / 6, roadWidth / 6]) {
        for (let z = -chunkLength / 2 + 6; z < chunkLength / 2; z += 12) {
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 5), dashMat);
          dash.rotation.x = -Math.PI / 2;
          dash.position.set(x, 0.02, z);
          chunk.add(dash);
        }
      }

      // Yellow line left
      const yellowLine = new THREE.Mesh(new THREE.PlaneGeometry(0.3, chunkLength), yellowMat);
      yellowLine.rotation.x = -Math.PI / 2;
      yellowLine.position.set(-roadWidth / 2 + 0.6, 0.02, 0);
      chunk.add(yellowLine);

      chunk.position.z = -c * chunkLength;
      scene.add(chunk);
      roadChunks.push(chunk);
    }

    // Player 80s Japanese Grand Tourer Coupe
    const car = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.25 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.1 });

    const lowerChassis = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.7, 4.6), bodyMat);
    lowerChassis.position.y = 0.55;
    car.add(lowerChassis);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.65, 2.3), glassMat);
    cabin.position.set(0, 1.15, -0.2);
    car.add(cabin);

    // Pop-up Headlights
    const popLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.4), bodyMat);
    popLeft.position.set(-0.75, 0.95, -2.0);
    car.add(popLeft);

    const popRight = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.4), bodyMat);
    popRight.position.set(0.75, 0.95, -2.0);
    car.add(popRight);

    // Headlights
    const hlLeft = new THREE.SpotLight(0xfff7ed, 30, 130, Math.PI / 6, 0.35);
    hlLeft.position.set(-0.75, 0.95, -2.1);
    hlLeft.target.position.set(-0.75, 0, -50);
    car.add(hlLeft);
    car.add(hlLeft.target);

    const hlRight = new THREE.SpotLight(0xfff7ed, 30, 130, Math.PI / 6, 0.35);
    hlRight.position.set(0.75, 0.95, -2.1);
    hlRight.target.position.set(0.75, 0, -50);
    car.add(hlRight);
    car.add(hlRight.target);

    // Rear Light Strip
    const tailLight = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xff1e56 }));
    tailLight.position.set(0, 0.68, 2.31);
    car.add(tailLight);

    scene.add(car);

    // Traffic Cars
    const traffic = [];
    const carColors = [0xd946ef, 0x10b981, 0xf59e0b, 0x64748b];
    for (let i = 0; i < 5; i++) {
      const ai = new THREE.Group();
      const aiBody = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.7, 4.3), new THREE.MeshStandardMaterial({ color: carColors[i % carColors.length], metalness: 0.6 }));
      aiBody.position.y = 0.55;
      ai.add(aiBody);

      const aiTail = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
      aiTail.position.set(0, 0.65, 2.16);
      ai.add(aiTail);

      const lane = (i % 3 - 1) * (roadWidth / 3.4);
      ai.position.set(lane, 0, -100 - i * 90);
      scene.add(ai);
      traffic.push({ group: ai, speed: 65 + Math.random() * 25 });
    }

    // Input state
    const keys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    // UI Buttons
    let camMode = 'chase';
    const btnCam = document.getElementById('btn-cam');
    btnCam.onclick = () => {
      camMode = camMode === 'chase' ? 'hood' : 'chase';
      btnCam.textContent = camMode === 'chase' ? '🎥 Cam: Low Chase' : '🎥 Cam: Hood Cam';
    };

    const btnRadio = document.getElementById('btn-radio');
    btnRadio.onclick = () => {
      initAudio();
      isRadioOn = !isRadioOn;
      if (synthChordGain) synthChordGain.gain.value = isRadioOn ? 0.05 : 0;
      btnRadio.textContent = isRadioOn ? '📻 Radio: Synthwave' : '🔇 Radio: Muted';
    };

    const btnLights = document.getElementById('btn-lights');
    let lightsUp = true;
    btnLights.onclick = () => {
      lightsUp = !lightsUp;
      popLeft.visible = popRight.visible = lightsUp;
      hlLeft.intensity = hlRight.intensity = lightsUp ? 30 : 0;
      btnLights.textContent = lightsUp ? '💡 Pop-up Lights: Up' : '💡 Pop-up Lights: Down';
    };

    // Physics State
    let kmh = 105;
    let posX = 0;
    let steerVelocity = 0;
    let trip = 0;
    let lastTime = performance.now();

    const speedNum = document.getElementById('speed-num');
    const tripNum = document.getElementById('trip-num');

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Throttle & Brake
      if (keys.w) kmh = Math.min(180, kmh + 45 * delta);
      else if (keys.s) kmh = Math.max(30, kmh - 80 * delta);
      else kmh += (105 - kmh) * delta * 0.4;

      // Steering
      let targetSteer = 0;
      if (keys.a) targetSteer -= 1;
      if (keys.d) targetSteer += 1;
      steerVelocity += (targetSteer * 10 - steerVelocity) * delta * 8;
      posX += steerVelocity * delta * (kmh / 95);
      posX = Math.max(-roadWidth / 2 + 1.6, Math.min(roadWidth / 2 - 1.6, posX));

      car.position.x = posX;
      car.rotation.y = -steerVelocity * 0.04;
      car.rotation.z = -steerVelocity * 0.02;

      // Road scroll
      const speedScale = kmh * 0.7;
      const totalLen = numChunks * chunkLength;
      for (const chunk of roadChunks) {
        chunk.position.z += speedScale * delta;
        if (chunk.position.z > chunkLength) {
          chunk.position.z -= totalLen;
        }
      }

      // Lighthouse beam sweeping
      const lhAngle = now * 0.0012;
      lhLight.target.position.set(-280 + Math.sin(lhAngle) * 300, 0, -500 + Math.cos(lhAngle) * 300);

      // Traffic
      for (const t of traffic) {
        t.group.position.z += (speedScale - t.speed * 0.7) * delta;
        if (t.group.position.z > 30) {
          t.group.position.z -= 550;
          t.group.position.x = (Math.floor(Math.random() * 3) - 1) * (roadWidth / 3.4);
        }
      }

      // Camera
      if (camMode === 'chase') {
        camera.position.set(posX * 0.5, 3.2, 8.0);
        camera.lookAt(posX * 0.8, 1.3, -40);
      } else {
        camera.position.set(posX, 1.4, -0.6);
        camera.lookAt(posX, 1.2, -60);
      }

      // Telemetry
      trip += (kmh / 3600) * delta;
      speedNum.textContent = Math.round(kmh);
      tripNum.textContent = trip.toFixed(2);

      if (engineOsc && audioCtx) {
        engineOsc.frequency.setTargetAtTime(45 + (kmh / 180) * 80, audioCtx.currentTime, 0.05);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
