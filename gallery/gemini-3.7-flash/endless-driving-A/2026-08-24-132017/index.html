<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Night Driving</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: sans-serif;
      user-select: none;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui {
      position: absolute;
      bottom: 24px;
      left: 24px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-family: monospace;
      font-size: 16px;
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-family: sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="instructions">Use A / D or LEFT / RIGHT to Steer · W / S or UP / DOWN to Accelerate / Brake</div>
  <div id="ui">
    <div>SPEED: <span id="speedVal">0</span> MPH</div>
    <div>DIST: <span id="distVal">0.0</span> MI</div>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.0035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Ambient night lighting
    const ambientLight = new THREE.AmbientLight(0x1a2035, 0.6);
    scene.add(ambientLight);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for (let i = 0; i < 600; i++) {
      starCoords.push((Math.random() - 0.5) * 1500, Math.random() * 400 + 40, (Math.random() - 0.5) * 1500);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 });
    scene.add(new THREE.Points(starGeo, starMat));

    // Car Body / Cockpit representation
    const car = new THREE.Group();
    const carMat = new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.3, metalness: 0.8 });
    const hood = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 3.2), carMat);
    hood.position.set(0, 0.4, 1.2);
    car.add(hood);

    // Headlights
    const headlightLeft = new THREE.SpotLight(0xfff5e6, 5.0, 180, Math.PI / 5, 0.4);
    headlightLeft.position.set(-0.7, 0.6, 2.6);
    const targetLeft = new THREE.Object3D();
    targetLeft.position.set(-0.7, 0.2, 40);
    car.add(headlightLeft);
    car.add(targetLeft);
    headlightLeft.target = targetLeft;

    const headlightRight = new THREE.SpotLight(0xfff5e6, 5.0, 180, Math.PI / 5, 0.4);
    headlightRight.position.set(0.7, 0.6, 2.6);
    const targetRight = new THREE.Object3D();
    targetRight.position.set(0.7, 0.2, 40);
    car.add(headlightRight);
    car.add(targetRight);
    headlightRight.target = targetRight;

    scene.add(car);

    // Procedural Road Segments
    const ROAD_WIDTH = 14;
    const SEGMENT_LENGTH = 20;
    const NUM_SEGMENTS = 50;
    const roadSegments = [];

    const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH);
    roadGeo.rotateX(-Math.PI / 2);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x151518, roughness: 0.9 });

    const stripeGeo = new THREE.PlaneGeometry(0.3, SEGMENT_LENGTH * 0.4);
    stripeGeo.rotateX(-Math.PI / 2);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

    const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.4);
    const postMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const reflectorMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });

    for (let i = 0; i < NUM_SEGMENTS; i++) {
      const segGroup = new THREE.Group();

      const roadMesh = new THREE.Mesh(roadGeo, roadMat);
      segGroup.add(roadMesh);

      const stripeMesh = new THREE.Mesh(stripeGeo, stripeMat);
      stripeMesh.position.y = 0.02;
      segGroup.add(stripeMesh);

      // Roadside markers
      const postL = new THREE.Mesh(postGeo, postMat);
      postL.position.set(-ROAD_WIDTH / 2 - 0.8, 0.7, 0);
      const refL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.15), reflectorMat);
      refL.position.set(-ROAD_WIDTH / 2 - 0.8, 1.2, 0);
      segGroup.add(postL);
      segGroup.add(refL);

      const postR = new THREE.Mesh(postGeo, postMat);
      postR.position.set(ROAD_WIDTH / 2 + 0.8, 0.7, 0);
      const refR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.15), reflectorMat);
      refR.position.set(ROAD_WIDTH / 2 + 0.8, 1.2, 0);
      segGroup.add(postR);
      segGroup.add(refR);

      segGroup.position.z = i * SEGMENT_LENGTH;
      scene.add(segGroup);
      roadSegments.push(segGroup);
    }

    // Controls
    const keys = { left: false, right: false, up: false, down: false };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = false;
    });

    let speed = 60; // MPH
    let carX = 0;
    let distance = 0;
    let curveOffset = 0;

    const speedVal = document.getElementById('speedVal');
    const distVal = document.getElementById('distVal');
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      // Speed handling
      if (keys.up) speed = Math.min(speed + 30 * dt, 120);
      else if (keys.down) speed = Math.max(speed - 40 * dt, 15);
      else speed = Math.max(speed - 5 * dt, 55);

      // Steering
      if (keys.left) carX = Math.max(carX - 8 * dt, -ROAD_WIDTH / 2 + 1.5);
      if (keys.right) carX = Math.min(carX + 8 * dt, ROAD_WIDTH / 2 - 1.5);

      car.position.x = carX;
      car.rotation.y = (keys.left ? 0.04 : (keys.right ? -0.04 : 0));

      // Move road
      const moveDistance = (speed * 0.447) * dt * 4.0;
      distance += (speed * dt) / 3600;

      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const seg = roadSegments[i];
        seg.position.z -= moveDistance;
        if (seg.position.z < -SEGMENT_LENGTH) {
          seg.position.z += NUM_SEGMENTS * SEGMENT_LENGTH;
        }
      }

      // Camera positioned inside/above car
      camera.position.set(carX * 0.8, 1.4, -0.2);
      camera.lookAt(carX * 0.5, 1.2, 35);

      speedVal.textContent = Math.round(speed);
      distVal.textContent = distance.toFixed(1);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
