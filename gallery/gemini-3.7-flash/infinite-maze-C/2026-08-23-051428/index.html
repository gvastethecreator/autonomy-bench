<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHRONO LABYRINTH — The Eternal Depths</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030408; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }

    .glass-panel {
      background: rgba(11, 15, 28, 0.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .compass-pill {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .compass-dial {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.1em;
      min-width: 60px;
      text-align: center;
    }

    .stat-cluster {
      display: flex;
      gap: 12px;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .bottom-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .controls-strip {
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-action:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    #radar-map {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.5);
      background: rgba(8, 12, 22, 0.85);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 8px #38bdf8;
    }

    .start-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 32px 48px;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 30;
      transition: all 0.4s ease;
    }
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -40%);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="crosshair"></div>

  <div id="hud">
    <div class="top-header">
      <div class="glass-panel compass-pill">
        <span style="font-size: 24px;">🧭</span>
        <div>
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Heading</div>
          <div id="heading-txt" class="compass-dial">NORTH</div>
        </div>
      </div>

      <div class="stat-cluster">
        <div class="glass-panel" style="text-align: right; min-width: 100px;">
          <div style="font-size: 10px; font-weight: 700; color: #f59e0b; text-transform: uppercase;">Relics Found</div>
          <div class="stat-val"><span id="relic-val">0</span> / 4 🏺</div>
        </div>
        <div class="glass-panel" style="text-align: right; min-width: 100px;">
          <div style="font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase;">Depth Explored</div>
          <div class="stat-val"><span id="depth-val">0</span> m</div>
        </div>
      </div>
    </div>

    <div class="bottom-footer">
      <div class="controls-strip glass-panel">
        <button id="btn-audio" class="btn-action">🎵 Ambience: Subterranean</button>
        <button id="btn-lantern" class="btn-action">🏮 Lantern: Amber Gold</button>
        <button id="btn-marker" class="btn-action">✨ Place Rune Marker (Space)</button>
      </div>
      <canvas id="radar-map" width="140" height="140"></canvas>
    </div>
  </div>

  <div id="start-modal" class="start-screen glass-panel">
    <div style="font-size: 38px; margin-bottom: 8px;">🗝️</div>
    <div style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">ENTER CHRONO LABYRINTH</div>
    <div style="font-size: 13px; color: #94a3b8;">Click to lock mouse & explore infinite procedural subterranean ruins</div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    let audioCtx = null;
    let droneGain, chimeGain;
    let isSoundOn = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const droneOsc = audioCtx.createOscillator();
      droneOsc.type = 'sawtooth';
      droneOsc.frequency.value = 52;

      const droneFilter = audioCtx.createBiquadFilter();
      droneFilter.type = 'lowpass';
      droneFilter.frequency.value = 110;

      droneGain = audioCtx.createGain();
      droneGain.gain.value = 0.08;

      droneOsc.connect(droneFilter);
      droneFilter.connect(droneGain);
      droneGain.connect(audioCtx.destination);
      droneOsc.start();

      isSoundOn = true;
    }

    function playRelicChime() {
      if (!isSoundOn || !audioCtx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0.18, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.3);
        }, i * 120);
      });
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03050c);
    scene.fog = new THREE.FogExp2(0x03050c, 0.065);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 140);
    camera.position.set(0, 1.7, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    const lantern = new THREE.PointLight(0xf59e0b, 4.8, 24, 1.6);
    lantern.castShadow = true;
    lantern.shadow.mapSize.set(1024, 1024);
    camera.add(lantern);
    scene.add(camera);

    const ambientLight = new THREE.AmbientLight(0x0e172a, 0.45);
    scene.add(ambientLight);

    const dustCount = 800;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = [];
    for (let i = 0; i < dustCount; i++) {
      dustPos.push((Math.random() - 0.5) * 50, Math.random() * 4, (Math.random() - 0.5) * 50);
    }
    dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
    const dustParticles = new THREE.Points(
      dustGeo,
      new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.08, transparent: true, opacity: 0.6 })
    );
    scene.add(dustParticles);

    function hash(gx, gz) {
      let n = Math.sin(gx * 43.19 + gz * 89.47) * 43758.5453;
      return n - Math.floor(n);
    }

    function isWall(gx, gz) {
      if (Math.abs(gx) <= 1 && Math.abs(gz) <= 1) return false;
      if (gx % 2 === 0 && gz % 2 === 0) return true;
      return hash(gx, gz) < 0.38;
    }

    function hasAncientRelic(gx, gz) {
      if (isWall(gx, gz)) return false;
      return hash(gx + 200, gz + 200) < 0.035;
    }

    const cellSize = 5.0;
    const viewRadius = 8;
    const activeChunks = new Map();
    const discoveredRelics = new Set();
    const markers = [];

    const wallGeo = new THREE.BoxGeometry(cellSize, 4.2, cellSize);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.85 });
    const ceilMat = new THREE.MeshStandardMaterial({ color: 0x070b14, roughness: 0.95 });
    const relicMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.9, metalness: 0.8 });
    const relicGeo = new THREE.DodecahedronGeometry(0.5);

    function updateDungeon(px, pz) {
      const pGridX = Math.round(px / cellSize);
      const pGridZ = Math.round(pz / cellSize);
      const currentKeys = new Set();

      for (let dx = -viewRadius; dx <= viewRadius; dx++) {
        for (let dz = -viewRadius; dz <= viewRadius; dz++) {
          const gx = pGridX + dx;
          const gz = pGridZ + dz;
          const key = `${gx},${gz}`;
          currentKeys.add(key);

          if (!activeChunks.has(key)) {
            const group = new THREE.Group();
            const posX = gx * cellSize;
            const posZ = gz * cellSize;

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, cellSize), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(posX, 0, posZ);
            group.add(floor);

            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, cellSize), ceilMat);
            ceil.rotation.x = Math.PI / 2;
            ceil.position.set(posX, 4.2, posZ);
            group.add(ceil);

            if (isWall(gx, gz)) {
              const wall = new THREE.Mesh(wallGeo, wallMat);
              wall.position.set(posX, 2.1, posZ);
              wall.castShadow = wall.receiveShadow = true;
              group.add(wall);
            } else if (hasAncientRelic(gx, gz) && !discoveredRelics.has(key)) {
              const relic = new THREE.Mesh(relicGeo, relicMat);
              relic.position.set(posX, 1.6, posZ);
              group.add(relic);

              const glow = new THREE.PointLight(0xf59e0b, 2.5, 10);
              glow.position.set(posX, 1.6, posZ);
              group.add(glow);
            }

            scene.add(group);
            activeChunks.set(key, { group, gx, gz, isWall: isWall(gx, gz) });
          }
        }
      }

      for (const [k, c] of activeChunks.entries()) {
        if (!currentKeys.has(k)) {
          scene.remove(c.group);
          activeChunks.delete(k);
        }
      }
    }

    const startModal = document.getElementById('start-modal');
    startModal.addEventListener('click', () => {
      initAudio();
      document.body.requestPointerLock();
    });

    let isLocked = false;
    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      startModal.classList.toggle('hidden', isLocked);
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0022;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch - e.movementY * 0.0022));
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    function placeMarker() {
      const marker = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.35, 0.06, 12),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      marker.position.set(camera.position.x, 0.06, camera.position.z);
      scene.add(marker);
      markers.push(marker);
    }

    const keys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
      if (e.code === 'Space') placeMarker();
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    document.getElementById('btn-marker').onclick = () => { placeMarker(); };

    const btnLantern = document.getElementById('btn-lantern');
    let lanternMode = 0;
    btnLantern.onclick = () => {
      lanternMode = (lanternMode + 1) % 3;
      if (lanternMode === 0) {
        lantern.color.set(0xf59e0b);
        btnLantern.textContent = '🏮 Lantern: Amber Gold';
      } else if (lanternMode === 1) {
        lantern.color.set(0x38bdf8);
        btnLantern.textContent = '🏮 Lantern: Mystic Cyan';
      } else {
        lantern.color.set(0xec4899);
        btnLantern.textContent = '🏮 Lantern: Ethereal Pink';
      }
    };

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.onclick = () => {
      initAudio();
      isSoundOn = !isSoundOn;
      if (droneGain) droneGain.gain.value = isSoundOn ? 0.08 : 0;
      btnAudio.textContent = isSoundOn ? '🎵 Ambience: Subterranean' : '🔇 Audio: Muted';
    };

    function canPass(nx, nz) {
      const gx = Math.round(nx / cellSize);
      const gz = Math.round(nz / cellSize);
      if (isWall(gx, gz)) {
        const minX = gx * cellSize - cellSize * 0.5 - 0.45;
        const maxX = gx * cellSize + cellSize * 0.5 + 0.45;
        const minZ = gz * cellSize - cellSize * 0.5 - 0.45;
        const maxZ = gz * cellSize + cellSize * 0.5 + 0.45;
        if (nx > minX && nx < maxX && nz > minZ && nz < maxZ) return false;
      }
      return true;
    }

    const radarCanvas = document.getElementById('radar-map');
    const radarCtx = radarCanvas.getContext('2d');

    function renderRadar(px, pz) {
      radarCtx.clearRect(0, 0, 140, 140);
      const cx = 70, cy = 70;

      radarCtx.fillStyle = 'rgba(56, 189, 248, 0.08)';
      radarCtx.beginPath();
      radarCtx.arc(cx, cy, 65, 0, Math.PI * 2);
      radarCtx.fill();

      const pGridX = Math.round(px / cellSize);
      const pGridZ = Math.round(pz / cellSize);

      radarCtx.fillStyle = '#334155';
      for (let dx = -4; dx <= 4; dx++) {
        for (let dz = -4; dz <= 4; dz++) {
          const gx = pGridX + dx;
          const gz = pGridZ + dz;
          if (isWall(gx, gz)) {
            const rx = cx + (gx * cellSize - px) * 2.5;
            const ry = cy + (gz * cellSize - pz) * 2.5;
            radarCtx.fillRect(rx - 5, ry - 5, 10, 10);
          }
        }
      }

      radarCtx.fillStyle = '#38bdf8';
      radarCtx.beginPath();
      radarCtx.arc(cx, cy, 4, 0, Math.PI * 2);
      radarCtx.fill();

      radarCtx.strokeStyle = '#38bdf8';
      radarCtx.lineWidth = 2.5;
      radarCtx.beginPath();
      radarCtx.moveTo(cx, cy);
      radarCtx.lineTo(cx - Math.sin(yaw) * 14, cy - Math.cos(yaw) * 14);
      radarCtx.stroke();
    }

    const headingTxt = document.getElementById('heading-txt');
    const relicVal = document.getElementById('relic-val');
    const depthVal = document.getElementById('depth-val');
    let relicCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      lantern.intensity = 4.6 + Math.sin(now * 0.015) * 0.35 + (Math.random() - 0.5) * 0.2;

      const speed = 7.0;
      const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const m = new THREE.Vector3();

      if (keys.w) m.add(fwd);
      if (keys.s) m.sub(fwd);
      if (keys.d) m.add(rgt);
      if (keys.a) m.sub(rgt);

      if (m.lengthSq() > 0) {
        m.normalize().multiplyScalar(speed * delta);
        if (canPass(camera.position.x + m.x, camera.position.z)) camera.position.x += m.x;
        if (canPass(camera.position.x, camera.position.z + m.z)) camera.position.z += m.z;
      }

      const cgx = Math.round(camera.position.x / cellSize);
      const cgz = Math.round(camera.position.z / cellSize);
      const key = `${cgx},${cgz}`;
      if (hasAncientRelic(cgx, cgz) && !discoveredRelics.has(key)) {
        discoveredRelics.add(key);
        relicCount++;
        relicVal.textContent = relicCount;
        playRelicChime();
        const ch = activeChunks.get(key);
        if (ch) {
          scene.remove(ch.group);
          activeChunks.delete(key);
        }
      }

      const dPos = dustGeo.attributes.position;
      for (let i = 0; i < dustCount; i++) {
        dPos.setY(i, (dPos.getY(i) + 0.15 * delta) % 4);
      }
      dustGeo.attributes.position.needsUpdate = true;
      dustParticles.position.set(camera.position.x, 0, camera.position.z);

      updateDungeon(camera.position.x, camera.position.z);
      renderRadar(camera.position.x, camera.position.z);

      const deg = (((-yaw * 180 / Math.PI) % 360) + 360) % 360;
      let card = 'NORTH';
      if (deg >= 45 && deg < 135) card = 'EAST';
      else if (deg >= 135 && deg < 225) card = 'SOUTH';
      else if (deg >= 225 && deg < 315) card = 'WEST';
      headingTxt.textContent = card;

      const distFromOrigin = Math.round(Math.hypot(camera.position.x, camera.position.z));
      depthVal.textContent = distFromOrigin;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
