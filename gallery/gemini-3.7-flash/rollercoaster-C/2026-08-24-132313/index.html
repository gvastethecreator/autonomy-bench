<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpine Crest · Showcase Rollercoaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; }
    #canvas { width: 100vw; height: 100vh; display: block; }

    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0);
      transition: box-shadow 0.15s ease-out;
      z-index: 5;
    }

    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 28px 32px;
    }

    .glass {
      background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
      padding: 12px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); pointer-events: auto;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .title-box h1 {
      font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #f59e0b 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .title-box p { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }

    .telemetry { display: flex; gap: 20px; }
    .stat-card { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-val { font-size: 26px; font-weight: 800; font-family: monospace; color: #38bdf8; line-height: 1; }
    .stat-val.gold { color: #f59e0b; }
    .stat-lbl { font-size: 9px; text-transform: uppercase; color: #64748b; margin-top: 3px; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
    .btn-group { display: flex; gap: 8px; }
    .btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
    .btn.active { background: rgba(56, 189, 248, 0.35); border-color: #38bdf8; color: #fff; }

    #start-card {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; cursor: pointer;
    }
    .card {
      background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8; border-radius: 16px;
      padding: 28px 42px; text-align: center; box-shadow: 0 0 50px rgba(56, 189, 248, 0.3);
    }
    .card h2 { font-size: 22px; color: #38bdf8; margin-bottom: 6px; letter-spacing: 2px; }
    .card p { font-size: 13px; color: #94a3b8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="vignette"></div>

  <div id="start-card" onclick="initExperience()">
    <div class="card">
      <h2>ALPINE CREST EXPEDITION</h2>
      <p>Click anywhere to start presentation coaster & sound engine</p>
    </div>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="glass title-box">
        <h1>ALPINE CREST</h1>
        <p>Showcase Mountain Coaster Experience</p>
      </div>

      <div class="glass telemetry">
        <div class="stat-card">
          <div class="stat-val" id="speedVal">0</div>
          <div class="stat-lbl">Speed (MPH)</div>
        </div>
        <div class="stat-card">
          <div class="stat-val gold" id="gVal">1.0</div>
          <div class="stat-lbl">G-Force</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="altVal">180</div>
          <div class="stat-lbl">Altitude (FT)</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="glass btn-group">
        <button class="btn active" id="btnCam" onclick="cycleCamera()">🎥 Camera: <span id="camText">Front Seat 1P</span></button>
        <button class="btn" id="btnAudio" onclick="toggleAudio()">🔊 Audio: <span id="audioText">ON</span></button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* Procedural Sound Engine */
    let actx = null, soundInit = false, muted = false;
    let windGain = null, windFilter = null, chainInterval = null;

    function initExperience() {
      if (soundInit) return;
      soundInit = true;
      document.getElementById('start-card').style.display = 'none';

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();

        const bSize = actx.sampleRate * 2;
        const nBuf = actx.createBuffer(1, bSize, actx.sampleRate);
        const out = nBuf.getChannelData(0);
        for (let i = 0; i < bSize; i++) out[i] = (Math.random() * 2 - 1) * 0.35;

        const noise = actx.createBufferSource();
        noise.buffer = nBuf; noise.loop = true;

        windFilter = actx.createBiquadFilter();
        windFilter.type = 'lowpass'; windFilter.frequency.value = 260;
        windGain = actx.createGain(); windGain.gain.value = 0.035;

        noise.connect(windFilter); windFilter.connect(windGain); windGain.connect(actx.destination);
        noise.start();
      } catch (e) {}
    }

    function playClick() {
      if (!actx || muted || !soundInit) return;
      try {
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130 + Math.random() * 25, actx.currentTime);
        g.gain.setValueAtTime(0.045, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.06);
        osc.connect(g); g.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.07);
      } catch (e) {}
    }

    function toggleAudio() {
      muted = !muted;
      document.getElementById('audioText').textContent = muted ? "OFF" : "ON";
      if (windGain) windGain.gain.value = muted ? 0 : 0.035;
    }

    /* Three.js Mountain Coaster Scene */
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfde047);
    scene.fog = new THREE.FogExp2(0xf59e0b, 0.0018);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3500);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    scene.add(new THREE.AmbientLight(0xffedd5, 0.8));
    const sun = new THREE.DirectionalLight(0xffedd5, 1.8);
    sun.position.set(300, 450, 200);
    scene.add(sun);

    // Alpine Mountain Terrain
    const terrGeo = new THREE.PlaneGeometry(3000, 3000, 64, 64).rotateX(-Math.PI / 2);
    const pAttr = terrGeo.attributes.position;
    for (let i = 0; i < pAttr.count; i++) {
      const x = pAttr.getX(i), z = pAttr.getZ(i);
      const y = Math.sin(x * 0.004) * Math.cos(z * 0.004) * 55 + Math.sin(x * 0.01) * 20;
      pAttr.setY(i, Math.max(y, 0));
    }
    terrGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(terrGeo, new THREE.MeshStandardMaterial({ color: 0x1e3a29, roughness: 0.9 })));

    // Track Spline
    const splinePoints = [
      new THREE.Vector3(0, 30, 0),
      new THREE.Vector3(25, 45, 90),
      new THREE.Vector3(60, 95, 200),
      new THREE.Vector3(100, 160, 320), // Summit (160m)
      new THREE.Vector3(135, 140, 400),
      new THREE.Vector3(160, 28, 480),  // Mountain Chasm Dive
      new THREE.Vector3(210, 85, 540),  // Camelback Airtime
      new THREE.Vector3(275, 120, 520),
      new THREE.Vector3(330, 75, 450),
      new THREE.Vector3(370, 32, 350),
      new THREE.Vector3(380, 80, 240),  // Overbanked Turn
      new THREE.Vector3(340, 95, 140),
      new THREE.Vector3(260, 55, 60),
      new THREE.Vector3(160, 28, 10),
      new THREE.Vector3(60, 30, -20)
    ];

    const trackCurve = new THREE.CatmullRomCurve3(splinePoints, true, 'centripetal', 0.5);

    // Track Mesh
    const SEGS = 1000;
    const trackPts = trackCurve.getSpacedPoints(SEGS);
    const trackGroup = new THREE.Group();

    const railMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.2 });
    const spineMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7, roughness: 0.4 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });

    const lPts = [], rPts = [], sPts = [];
    const rOff = 1.1;

    for (let i = 0; i <= SEGS; i++) {
      const t = i / SEGS;
      const pt = trackPts[i];
      const tang = trackCurve.getTangentAt(t).normalize();
      let up = new THREE.Vector3(0, 1, 0);

      if (t > 0.35 && t < 0.55) {
        up.applyAxisAngle(tang, Math.sin(((t - 0.35) / 0.2) * Math.PI) * Math.PI);
      } else if (t > 0.65 && t < 0.85) {
        up.applyAxisAngle(tang, 0.7);
      }

      const binorm = new THREE.Vector3().crossVectors(tang, up).normalize();
      const norm = new THREE.Vector3().crossVectors(binorm, tang).normalize();

      lPts.push(pt.clone().addScaledVector(binorm, -rOff));
      rPts.push(pt.clone().addScaledVector(binorm, rOff));
      sPts.push(pt.clone().addScaledVector(norm, -0.45));

      if (i % 14 === 0 && pt.y > 4) {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, pt.y, 8), woodMat);
        pillar.position.set(pt.x, pt.y / 2, pt.z);
        trackGroup.add(pillar);
      }
    }

    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lPts, true), 700, 0.16, 6, true), railMat));
    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rPts, true), 700, 0.16, 6, true), railMat));
    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sPts, true), 700, 0.28, 6, true), spineMat));
    scene.add(trackGroup);

    // Train Object
    const train = new THREE.Group();
    const trainBody = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.7, 3.4), new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8 }));
    trainBody.position.y = 0.45;
    train.add(trainBody);
    scene.add(train);

    // Animation & Playback
    let progress = 0.0, camMode = 0;
    const clock = new THREE.Clock();

    function cycleCamera() {
      camMode = (camMode + 1) % 3;
      document.getElementById('camText').textContent = ["Front Seat 1P", "Chase Cam 3P", "Drone Flyby"][camMode];
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      const pt = trackCurve.getPointAt(progress);
      const tang = trackCurve.getTangentAt(progress).normalize();

      const isLift = progress < 0.26;
      let speed = 0;
      if (isLift) {
        speed = 18;
        if (!chainInterval) chainInterval = setInterval(playClick, 180);
      } else {
        if (chainInterval) { clearInterval(chainInterval); chainInterval = null; }
        speed = Math.max(Math.sqrt(Math.max(160 - pt.y, 4)) * 7.5, 28);
      }

      const pDelta = (speed * 0.447) / trackCurve.getLength() * dt;
      progress = (progress + pDelta) % 1.0;

      let up = new THREE.Vector3(0, 1, 0);
      if (progress > 0.35 && progress < 0.55) {
        up.applyAxisAngle(tang, Math.sin(((progress - 0.35) / 0.2) * Math.PI) * Math.PI);
      } else if (progress > 0.65 && progress < 0.85) {
        up.applyAxisAngle(tang, 0.7);
      }

      const binorm = new THREE.Vector3().crossVectors(tang, up).normalize();
      const norm = new THREE.Vector3().crossVectors(binorm, tang).normalize();

      train.position.copy(pt);
      train.rotation.setFromRotationMatrix(new THREE.Matrix4().makeBasis(binorm, norm, tang));

      if (camMode === 0) {
        const eye = pt.clone().addScaledVector(norm, 1.25);
        camera.position.copy(eye);
        camera.up.copy(norm);
        camera.lookAt(eye.clone().addScaledVector(tang, 16));
      } else if (camMode === 1) {
        camera.position.set(pt.x - tang.x * 9 + norm.x * 3.5, pt.y - tang.y * 9 + norm.y * 3.5, pt.z - tang.z * 9 + norm.z * 3.5);
        camera.up.copy(norm);
        camera.lookAt(pt.clone().addScaledVector(tang, 12));
      } else {
        const t = clock.getElapsedTime() * 0.2;
        camera.position.set(pt.x + Math.sin(t) * 25, pt.y + 12, pt.z + Math.cos(t) * 25);
        camera.lookAt(pt);
      }

      // Vignette effect for speed
      const vig = Math.min(Math.max((speed - 40) / 50, 0), 1) * 110;
      document.getElementById('vignette').style.boxShadow = `inset 0 0 ${vig}px rgba(0,0,0,0.8)`;

      if (windFilter && windGain && actx) {
        windFilter.frequency.setTargetAtTime(200 + (speed / 90) * 1800, actx.currentTime, 0.05);
        windGain.gain.setTargetAtTime(0.02 + (speed / 90) * 0.1, actx.currentTime, 0.05);
      }

      document.getElementById('speedVal').textContent = Math.round(speed);
      document.getElementById('gVal').textContent = (isLift ? 1.0 : (1.0 + (160 - pt.y) * 0.015 + Math.abs(tang.y) * 0.8)).toFixed(1);
      document.getElementById('altVal').textContent = Math.round(pt.y * 3.28);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
