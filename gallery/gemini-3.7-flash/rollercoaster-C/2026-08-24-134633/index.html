<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Apex Velocity - Ultra 3D First-Person Rollercoaster</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Start Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(5, 8, 17, 0.98) 100%);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }
    #start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff0844 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
      text-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
    }
    .hero-subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    .start-btn {
      padding: 1.1rem 3.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ff0844 0%, #ff4e50 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(255, 8, 68, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .start-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 15px 45px rgba(255, 8, 68, 0.65), 0 0 0 2px rgba(255, 255, 255, 0.4);
    }
    .start-btn:active {
      transform: translateY(1px) scale(0.98);
    }
    .tip-list {
      margin-top: 2.5rem;
      display: flex;
      gap: 24px;
      font-size: 0.85rem;
      color: #64748b;
    }
    .tip-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .key-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: monospace;
    }

    /* HUD Dashboard */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      box-sizing: border-box;
      transition: opacity 0.4s ease;
    }
    #hud.hud-hidden {
      opacity: 0;
    }
    .interactive {
      pointer-events: auto;
    }

    /* Top HUD Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .coaster-brand {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .coaster-brand h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #38bdf8;
    }
    .coaster-brand .track-status {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .top-controls {
      display: flex;
      gap: 10px;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .hud-btn:hover {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }
    .hud-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Center Element Flash Banner */
    .element-banner {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      opacity: 0;
      transition: opacity 0.5s, transform 0.5s;
      pointer-events: none;
    }
    .element-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Telemetry Cluster */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }
    .telemetry-cluster {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 18px;
      border-radius: 16px;
      min-width: 110px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }
    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
    .metric-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .metric-value {
      font-size: 1.9rem;
      font-weight: 900;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .metric-unit {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      margin-left: 3px;
    }

    /* Speed Gauge */
    .speed-gauge-card {
      min-width: 150px;
    }
    .speed-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .speed-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #f43f5e);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    /* Camera Switcher */
    .cam-cluster {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px;
      border-radius: 16px;
      display: flex;
      gap: 6px;
    }
    .cam-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cam-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .cam-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
    }

    /* Crosshair in 1st person */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* Speed Wind Streaks Canvas Overlay */
    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .top-controls .hud-btn:not(.primary) {
        display: none;
      }
      .metric-card {
        padding: 8px 12px;
        min-width: 80px;
      }
      .metric-value {
        font-size: 1.3rem;
      }
      .cam-cluster {
        scale: 0.85;
        transform-origin: right bottom;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <canvas id="fx-canvas"></canvas>

  <!-- Start Overlay Screen -->
  <div id="start-overlay">
    <div class="hero-title">APEX VELOCITY</div>
    <div class="hero-subtitle">Hyper-Coaster Experience</div>
    <button class="start-btn interactive" id="btn-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Board Coaster
    </button>
    <div class="tip-list">
      <div class="tip-item"><span class="key-badge">Mouse</span> Look Around</div>
      <div class="tip-item"><span class="key-badge">C</span> Change View</div>
      <div class="tip-item"><span class="key-badge">H</span> Toggle HUD</div>
      <div class="tip-item"><span class="key-badge">M</span> Audio</div>
    </div>
  </div>

  <!-- HUD Overlay -->
  <div id="hud">
    <div class="crosshair"></div>
    <div class="element-banner" id="element-banner">FIRST DROP - 85° PLUNGE</div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="coaster-brand interactive">
        <h1>APEX HYPERCOASTER</h1>
        <div class="track-status">
          <div class="status-dot"></div>
          <span id="zone-text">CHAIN LIFT HILL</span>
        </div>
      </div>

      <div class="top-controls interactive">
        <button class="hud-btn" id="btn-tod">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span id="tod-text">Sunset</span>
        </button>
        <button class="hud-btn" id="btn-sound">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"/></svg>
          <span id="sound-text">Mute</span>
        </button>
        <button class="hud-btn primary" id="btn-hud-toggle">HUD (H)</button>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="telemetry-cluster interactive">
        <div class="metric-card speed-gauge-card">
          <div class="metric-label">Velocity</div>
          <div>
            <span class="metric-value" id="val-speed">0</span>
            <span class="metric-unit">KM/H</span>
          </div>
          <div class="speed-bar-container">
            <div class="speed-bar-fill" id="bar-speed"></div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-label">G-Force</div>
          <div>
            <span class="metric-value" id="val-gforce">1.0</span>
            <span class="metric-unit">G</span>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-label">Altitude</div>
          <div>
            <span class="metric-value" id="val-alt">25</span>
            <span class="metric-unit">M</span>
          </div>
        </div>
      </div>

      <div class="cam-cluster interactive">
        <button class="cam-btn active" data-cam="0">Front Seat</button>
        <button class="cam-btn" data-cam="1">Bumper</button>
        <button class="cam-btn" data-cam="2">Chase Cam</button>
        <button class="cam-btn" data-cam="3">Drone Orbit</button>
      </div>
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    /* =========================================================================
       APEX VELOCITY - 3D FIRST-PERSON ROLLERCOASTER ENGINE
       ========================================================================= */

    // --- Global Configuration ---
    const CONFIG = {
      coasterColor: 0xff1744,
      spineColor: 0xd50000,
      railColor: 0xf8fafc,
      tiesColor: 0x1e293b,
      supportColor: 0x475569,
      trackSamples: 2400,
      gravity: 9.81,
      friction: 0.00035,
      liftSpeed: 6.5,     // m/s (~23 km/h)
      minSpeed: 4.5,
      maxFov: 92,
      minFov: 62
    };

    // --- State Variables ---
    let isStarted = false;
    let isAudioEnabled = true;
    let cameraMode = 0; // 0: Front Seat, 1: Bumper, 2: Chase, 3: Orbit
    let timeOfDayIndex = 1; // 0: Day, 1: Sunset, 2: Cyber Night
    let currentDist = 0;
    let currentSpeed = CONFIG.liftSpeed;
    let currentZone = "LIFT";
    let lastElementIndex = -1;

    // Mouse look offset
    let mouseX = 0, mouseY = 0;
    let targetLookX = 0, targetLookY = 0;
    let isMouseDown = false;
    let lastMouseX = 0, lastMouseY = 0;

    // --- Setup Scene, Renderer, Camera ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd97706, 0.0018);

    const camera = new THREE.PerspectiveCamera(CONFIG.minFov, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Speed FX 2D Canvas
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    function resizeFx() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    resizeFx();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeFx();
    });

    // --- PROCEDURAL AUDIO ENGINE (Web Audio API) ---
    class CoasterAudioEngine {
      constructor() {
        this.ctx = null;
        this.initialized = false;
      }
      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        // 1. Steel Wheel Roar (Filtered White Noise)
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        this.wheelNoise = this.ctx.createBufferSource();
        this.wheelNoise.buffer = noiseBuffer;
        this.wheelNoise.loop = true;

        this.wheelFilter = this.ctx.createBiquadFilter();
        this.wheelFilter.type = 'bandpass';
        this.wheelFilter.frequency.value = 400;
        this.wheelFilter.Q.value = 1.2;

        this.wheelGain = this.ctx.createGain();
        this.wheelGain.gain.value = 0.0;

        this.wheelNoise.connect(this.wheelFilter);
        this.wheelFilter.connect(this.wheelGain);
        this.wheelGain.connect(this.ctx.destination);
        this.wheelNoise.start(0);

        // 2. Wind Rush Synth (High-pass filtered noise)
        this.windNoise = this.ctx.createBufferSource();
        this.windNoise.buffer = noiseBuffer;
        this.windNoise.loop = true;

        this.windFilter = this.ctx.createBiquadFilter();
        this.windFilter.type = 'highpass';
        this.windFilter.frequency.value = 800;

        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = 0.0;

        this.windNoise.connect(this.windFilter);
        this.windFilter.connect(this.windGain);
        this.windGain.connect(this.ctx.destination);
        this.windNoise.start(0);

        // 3. Sub-bass Track G-Force Resonance
        this.rumbleOsc = this.ctx.createOscillator();
        this.rumbleOsc.type = 'triangle';
        this.rumbleOsc.frequency.value = 45;

        this.rumbleGain = this.ctx.createGain();
        this.rumbleGain.gain.value = 0.0;

        this.rumbleOsc.connect(this.rumbleGain);
        this.rumbleGain.connect(this.ctx.destination);
        this.rumbleOsc.start();

        // 4. Chain Lift Ratchet Clack System
        this.nextClackTime = 0;
        this.initialized = true;
      }

      triggerClack() {
        if (!this.ctx || !isAudioEnabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.045);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      update(speedKmH, isLift, gForce) {
        if (!this.ctx || !this.initialized || !isAudioEnabled) {
          if (this.wheelGain) this.wheelGain.gain.value = 0;
          if (this.windGain) this.windGain.gain.value = 0;
          if (this.rumbleGain) this.rumbleGain.gain.value = 0;
          return;
        }

        const now = this.ctx.currentTime;
        const normSpeed = Math.min(speedKmH / 140, 1.2);

        // Wheel Roar
        const targetWheelFreq = 250 + normSpeed * 1800;
        this.wheelFilter.frequency.setTargetAtTime(targetWheelFreq, now, 0.05);
        this.wheelGain.gain.setTargetAtTime(0.04 + normSpeed * 0.45, now, 0.05);

        // Wind Rush
        const windVolume = Math.pow(normSpeed, 2.2) * 0.55;
        this.windGain.gain.setTargetAtTime(windVolume, now, 0.08);
        this.windFilter.frequency.setTargetAtTime(600 + normSpeed * 2200, now, 0.08);

        // Rumble
        const rumbleVol = Math.max(0, (gForce - 1.0) * 0.15) + (normSpeed * 0.08);
        this.rumbleGain.gain.setTargetAtTime(rumbleVol, now, 0.05);

        // Ratchet clack on chain lift
        if (isLift && now > this.nextClackTime) {
          this.triggerClack();
          this.nextClackTime = now + 0.28; // ~3.5 clacks per second
        }
      }
    }
    const audio = new CoasterAudioEngine();

    // --- TRACK SPLINE & ELEMENT DEFINITION ---
    // Crafted thrilling layout: Station -> Lift -> 85° Drop -> Immelmann Loop -> Airtime Hill -> Zero-G Roll -> Canyon Dive -> Overbanked Helix -> Brake Run
    const trackControlPoints = [
      // Station & Lead-in
      new THREE.Vector3(0, 18, 0),
      new THREE.Vector3(0, 18, 60),
      new THREE.Vector3(20, 20, 100),
      
      // Chain Lift Hill climbing up to 118m height
      new THREE.Vector3(25, 38, 140),
      new THREE.Vector3(25, 75, 220),
      new THREE.Vector3(25, 115, 300),
      new THREE.Vector3(25, 120, 340), // Peak Crest

      // 85-degree 100-meter Plunge Drop
      new THREE.Vector3(20, 100, 390),
      new THREE.Vector3(0, 22, 450),
      new THREE.Vector3(-40, 16, 490), // Bottom of Drop (Valley)

      // Huge Immelmann Loop (Climb, invert at top, half-twist dive)
      new THREE.Vector3(-90, 48, 510),
      new THREE.Vector3(-120, 85, 480),
      new THREE.Vector3(-100, 75, 420),
      new THREE.Vector3(-70, 30, 380),

      // Giant High-G Camelback Airtime Hill
      new THREE.Vector3(-80, 20, 310),
      new THREE.Vector3(-100, 68, 220),
      new THREE.Vector3(-110, 20, 140),

      // Zero-G Roll Parabolic Corkscrew Section
      new THREE.Vector3(-90, 35, 60),
      new THREE.Vector3(-60, 48, -20),
      new THREE.Vector3(-20, 35, -80),

      // Canyon Dive & Rock Tunnel S-Curves
      new THREE.Vector3(40, 14, -130),
      new THREE.Vector3(110, 10, -170),
      new THREE.Vector3(170, 24, -140),
      new THREE.Vector3(210, 14, -80),

      // High-Speed Overbanked 540-degree Helix over Ocean
      new THREE.Vector3(240, 38, 0),
      new THREE.Vector3(210, 52, 80),
      new THREE.Vector3(140, 36, 120),
      new THREE.Vector3(90, 20, 60),
      new THREE.Vector3(120, 16, -10),
      new THREE.Vector3(160, 28, -60),

      // Low Ground-Hugging S-Turns & Flyby
      new THREE.Vector3(140, 18, -110),
      new THREE.Vector3(80, 16, -90),
      new THREE.Vector3(30, 18, -60),

      // Final Brake Run & Turn into Station
      new THREE.Vector3(0, 18, -30)
    ];

    // Bank angles / Roll angles per control zone (in radians)
    const trackRollAngles = [
      0, 0, 0.2,                                   // Station
      0, 0, 0, 0,                                  // Lift Hill
      0.1, 0, -0.3,                                // Drop
      -0.8, -Math.PI, -2.4, -0.6,                  // Immelmann Loop (Inversion)
      0.1, 0, -0.2,                                // Airtime Hill
      -1.2, -Math.PI * 2, -3.8,                    // Zero-G Roll
      0.8, -0.7, 0.9, -0.8,                        // Canyon S-Curves
      1.1, 1.2, 1.0, 0.8, 0.5, 0.9,                // Helix
      -0.6, 0.5, 0,                                // Final curves
      0                                            // Brakes
    ];

    // Element Announcement Zones for dynamic HUD
    const trackElements = [
      { tStart: 0.03, tEnd: 0.16, name: "CHAIN LIFT HILL", zone: "LIFT" },
      { tStart: 0.17, tEnd: 0.25, name: "MEGA DROP (85° / 100M)", zone: "DROP" },
      { tStart: 0.26, tEnd: 0.38, name: "IMMELMANN INVERSION", zone: "LOOP" },
      { tStart: 0.39, tEnd: 0.48, name: "CAMELBACK AIRTIME HILL", zone: "AIRTIME" },
      { tStart: 0.49, tEnd: 0.60, name: "ZERO-G CORKSCREW ROLL", zone: "ROLL" },
      { tStart: 0.61, tEnd: 0.74, name: "CANYON ROCK TUNNEL", zone: "CANYON" },
      { tStart: 0.75, tEnd: 0.89, name: "OVERBANKED OCEAN HELIX", zone: "HELIX" },
      { tStart: 0.90, tEnd: 0.99, name: "MAGNETIC BRAKE RUN", zone: "BRAKE" }
    ];

    // Create Smooth Closed Spline Curve
    const trackCurve = new THREE.CatmullRomCurve3(trackControlPoints, true, 'centripetal', 0.25);
    const totalTrackLength = trackCurve.getLength();

    // Precompute sample positions, tangents, and Rotation-Minimizing Frames (RMF / Bishop Frame)
    const SAMPLE_COUNT = CONFIG.trackSamples;
    const trackFrames = [];

    (function computeTrackFrames() {
      // Step 1: Uniform tangents and positions along spline
      const points = trackCurve.getSpacedPoints(SAMPLE_COUNT);
      const tangents = [];
      for (let i = 0; i <= SAMPLE_COUNT; i++) {
        const t = i / SAMPLE_COUNT;
        tangents.push(trackCurve.getTangentAt(t).normalize());
      }

      // Step 2: Parallel Transport Frame generation
      const normals = [new THREE.Vector3(0, 1, 0)];
      // Ensure initial normal is orthogonal to tangent[0]
      const initialTangent = tangents[0];
      if (Math.abs(initialTangent.dot(normals[0])) > 0.9) {
        normals[0].set(1, 0, 0);
      }
      normals[0].sub(initialTangent.clone().multiplyScalar(initialTangent.dot(normals[0]))).normalize();

      for (let i = 0; i < SAMPLE_COUNT; i++) {
        const v1 = tangents[i];
        const v2 = tangents[i + 1];
        const axis = new THREE.Vector3().crossVectors(v1, v2);
        const norm = normals[i].clone();

        if (axis.lengthSq() > 1e-7) {
          axis.normalize();
          const angle = Math.acos(THREE.MathUtils.clamp(v1.dot(v2), -1, 1));
          norm.applyAxisAngle(axis, angle);
        }
        normals.push(norm.normalize());
      }

      // Step 3: Close the loop holonomy twist seamlessly
      const endAngle = Math.acos(THREE.MathUtils.clamp(normals[0].dot(normals[SAMPLE_COUNT]), -1, 1));
      const cross = new THREE.Vector3().crossVectors(normals[0], normals[SAMPLE_COUNT]);
      const sign = cross.dot(tangents[0]) > 0 ? 1 : -1;
      const twistCorrection = (sign * endAngle) / SAMPLE_COUNT;

      for (let i = 0; i <= SAMPLE_COUNT; i++) {
        const t = i / SAMPLE_COUNT;
        const baseNorm = normals[i].clone().applyAxisAngle(tangents[i], -twistCorrection * i);
        const baseBinorm = new THREE.Vector3().crossVectors(tangents[i], baseNorm).normalize();

        // Interpolate banking angle from trackRollAngles
        const cpIndex = t * trackRollAngles.length;
        const idx0 = Math.floor(cpIndex) % trackRollAngles.length;
        const idx1 = (idx0 + 1) % trackRollAngles.length;
        const alpha = cpIndex - Math.floor(cpIndex);
        // Smooth hermite blend for roll
        const smoothAlpha = alpha * alpha * (3 - 2 * alpha);
        const roll = THREE.MathUtils.lerp(trackRollAngles[idx0], trackRollAngles[idx1], smoothAlpha);

        // Apply roll rotation
        const finalNorm = baseNorm.clone().applyAxisAngle(tangents[i], roll);
        const finalBinorm = new THREE.Vector3().crossVectors(tangents[i], finalNorm).normalize();

        trackFrames.push({
          t: t,
          pos: points[i],
          tangent: tangents[i],
          normal: finalNorm,
          binormal: finalBinorm,
          roll: roll
        });
      }
    })();

    // Helper: interpolate frame at exact distance
    function getTrackFrameAtDist(dist) {
      let t = (dist % totalTrackLength) / totalTrackLength;
      if (t < 0) t += 1;
      const indexFloat = t * SAMPLE_COUNT;
      const i0 = Math.floor(indexFloat) % SAMPLE_COUNT;
      const i1 = (i0 + 1) % SAMPLE_COUNT;
      const alpha = indexFloat - Math.floor(indexFloat);

      const f0 = trackFrames[i0];
      const f1 = trackFrames[i1];

      return {
        t: t,
        pos: new THREE.Vector3().lerpVectors(f0.pos, f1.pos, alpha),
        tangent: new THREE.Vector3().lerpVectors(f0.tangent, f1.tangent, alpha).normalize(),
        normal: new THREE.Vector3().lerpVectors(f0.normal, f1.normal, alpha).normalize(),
        binormal: new THREE.Vector3().lerpVectors(f0.binormal, f1.binormal, alpha).normalize()
      };
    }

    // --- PROCEDURAL 3D TRACK MESH GENERATION ---
    function createTrackMeshes() {
      const trackGroup = new THREE.Group();

      // Materials
      const spineMat = new THREE.MeshStandardMaterial({
        color: CONFIG.spineColor,
        metalness: 0.85,
        roughness: 0.25
      });
      const railMat = new THREE.MeshStandardMaterial({
        color: CONFIG.railColor,
        metalness: 0.95,
        roughness: 0.12
      });
      const tiesMat = new THREE.MeshStandardMaterial({
        color: CONFIG.tiesColor,
        metalness: 0.6,
        roughness: 0.4
      });
      const supportMat = new THREE.MeshStandardMaterial({
        color: CONFIG.supportColor,
        metalness: 0.7,
        roughness: 0.35
      });

      const railGauge = 0.65; // half-width of rail distance
      const railHeight = 0.22; // height offset above spine

      // Tube Rail Curves
      const leftRailPoints = [];
      const rightRailPoints = [];
      const spinePoints = [];

      for (let i = 0; i <= SAMPLE_COUNT; i++) {
        const frame = trackFrames[i];
        spinePoints.push(frame.pos.clone());

        const leftPos = frame.pos.clone()
          .add(frame.binormal.clone().multiplyScalar(-railGauge))
          .add(frame.normal.clone().multiplyScalar(railHeight));
        leftRailPoints.push(leftPos);

        const rightPos = frame.pos.clone()
          .add(frame.binormal.clone().multiplyScalar(railGauge))
          .add(frame.normal.clone().multiplyScalar(railHeight));
        rightRailPoints.push(rightPos);
      }

      // 1. Central Backbone Spine Tube (radius 0.32m)
      const spineCurve = new THREE.CatmullRomCurve3(spinePoints, true);
      const spineGeo = new THREE.TubeGeometry(spineCurve, SAMPLE_COUNT, 0.30, 8, true);
      const spineMesh = new THREE.Mesh(spineGeo, spineMat);
      spineMesh.castShadow = true;
      spineMesh.receiveShadow = true;
      trackGroup.add(spineMesh);

      // 2. Left and Right Steel Running Rails (radius 0.12m)
      const leftCurve = new THREE.CatmullRomCurve3(leftRailPoints, true);
      const leftGeo = new THREE.TubeGeometry(leftCurve, SAMPLE_COUNT, 0.11, 7, true);
      const leftMesh = new THREE.Mesh(leftGeo, railMat);
      leftMesh.castShadow = true;
      trackGroup.add(leftMesh);

      const rightCurve = new THREE.CatmullRomCurve3(rightRailPoints, true);
      const rightGeo = new THREE.TubeGeometry(rightCurve, SAMPLE_COUNT, 0.11, 7, true);
      const rightMesh = new THREE.Mesh(rightGeo, railMat);
      rightMesh.castShadow = true;
      trackGroup.add(rightMesh);

      // 3. Cross-Ties (Triangular Sleepers) connecting Spine to Rails
      const tiesCount = 1400;
      const tieGeo = new THREE.BoxGeometry(0.1, 0.1, railGauge * 2.2);
      const tieInstMesh = new THREE.InstancedMesh(tieGeo, tiesMat, tiesCount);
      const dummy = new THREE.Object3D();

      for (let i = 0; i < tiesCount; i++) {
        const dist = (i / tiesCount) * totalTrackLength;
        const frame = getTrackFrameAtDist(dist);

        const tieCenter = frame.pos.clone().add(frame.normal.clone().multiplyScalar(railHeight * 0.6));
        dummy.position.copy(tieCenter);

        const rotMatrix = new THREE.Matrix4().makeBasis(frame.tangent, frame.normal, frame.binormal);
        dummy.rotation.setFromRotationMatrix(rotMatrix);
        dummy.updateMatrix();

        tieInstMesh.setMatrixAt(i, dummy.matrix);
      }
      tieInstMesh.castShadow = true;
      trackGroup.add(tieInstMesh);

      // 4. Structural Vertical Trestle Pillars down to Terrain/Ocean
      const supportInterval = 12; // meters between supports
      const supportCount = Math.floor(totalTrackLength / supportInterval);
      const supportInstances = [];

      for (let i = 0; i < supportCount; i++) {
        const dist = i * supportInterval;
        const frame = getTrackFrameAtDist(dist);
        
        // Find terrain height under this coordinate
        const groundY = getTerrainHeight(frame.pos.x, frame.pos.z);
        const height = frame.pos.y - groundY;

        if (height > 1.5) {
          supportInstances.push({
            pos: new THREE.Vector3(frame.pos.x, groundY + height / 2, frame.pos.z),
            height: height
          });
        }
      }

      // Create support cylinder instanced meshes
      const pillarGeo = new THREE.CylinderGeometry(0.38, 0.55, 1, 8);
      const pillarInstMesh = new THREE.InstancedMesh(pillarGeo, supportMat, supportInstances.length);
      
      for (let i = 0; i < supportInstances.length; i++) {
        const s = supportInstances[i];
        dummy.position.copy(s.pos);
        dummy.scale.set(1, s.height, 1);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        pillarInstMesh.setMatrixAt(i, dummy.matrix);
      }
      pillarInstMesh.castShadow = true;
      pillarInstMesh.receiveShadow = true;
      trackGroup.add(pillarInstMesh);

      // 5. Chain Lift Catwalk & Guardrails
      const liftPoints = trackFrames.filter(f => f.t >= 0.035 && f.t <= 0.155);
      if (liftPoints.length > 0) {
        const catwalkGeo = new THREE.BoxGeometry(0.8, 0.08, 1.2);
        const catwalkMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.5 });
        const catwalkInst = new THREE.InstancedMesh(catwalkGeo, catwalkMat, liftPoints.length);

        for (let i = 0; i < liftPoints.length; i++) {
          const f = liftPoints[i];
          const cPos = f.pos.clone().add(f.binormal.clone().multiplyScalar(railGauge + 0.65));
          dummy.position.copy(cPos);
          const mat = new THREE.Matrix4().makeBasis(f.tangent, f.normal, f.binormal);
          dummy.rotation.setFromRotationMatrix(mat);
          dummy.updateMatrix();
          catwalkInst.setMatrixAt(i, dummy.matrix);
        }
        trackGroup.add(catwalkInst);
      }

      scene.add(trackGroup);
    }

    // --- PROCEDURAL ENVIRONMENT (Islands, Mountain Ranges, Water, Foliage) ---
    function getTerrainHeight(x, z) {
      // Simplex-style layered multi-octave harmonic landscape
      const d1 = Math.sin(x * 0.004) * Math.cos(z * 0.004) * 35;
      const d2 = Math.sin(x * 0.012 + 1.2) * Math.cos(z * 0.012 + 0.8) * 18;
      const d3 = Math.sin(x * 0.03) * Math.sin(z * 0.03) * 6;

      // Mountain peaks near loop and helix
      const distPeak1 = Math.hypot(x - (-100), z - 450);
      const m1 = Math.max(0, 1 - distPeak1 / 220) * 85;

      const distCanyon = Math.hypot(x - 120, z - (-120));
      const canyon = Math.max(0, 1 - distCanyon / 180) * -12; // deep canyon ravine

      const height = Math.max(-5, d1 + d2 + d3 + m1 + canyon + 2);
      return height;
    }

    function createEnvironment() {
      // 1. Terrain Mesh with dynamic vertex coloring
      const terrainSize = 2200;
      const terrainSegments = 160;
      const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegments, terrainSegments);
      terrainGeo.rotateX(-Math.PI / 2);

      const posAttr = terrainGeo.attributes.position;
      const colors = [];
      const colorSand = new THREE.Color(0xd4a373);
      const colorGrass = new THREE.Color(0x2d6a4f);
      const colorRock = new THREE.Color(0x52525b);
      const colorSnow = new THREE.Color(0xf8fafc);

      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        const y = getTerrainHeight(x, z);
        posAttr.setY(i, y);

        // Biome vertex coloring
        const vColor = new THREE.Color();
        if (y < 2) {
          vColor.copy(colorSand);
        } else if (y < 35) {
          vColor.lerpColors(colorGrass, colorRock, (y - 2) / 33);
        } else if (y < 70) {
          vColor.lerpColors(colorRock, colorSnow, (y - 35) / 35);
        } else {
          vColor.copy(colorSnow);
        }
        colors.push(vColor.r, vColor.g, vColor.b);
      }
      terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.85,
        metalness: 0.1
      });
      const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
      terrainMesh.receiveShadow = true;
      scene.add(terrainMesh);

      // 2. Reflective Ocean Water Surface
      const oceanGeo = new THREE.PlaneGeometry(3000, 3000, 32, 32);
      oceanGeo.rotateX(-Math.PI / 2);
      const oceanMat = new THREE.MeshStandardMaterial({
        color: 0x0284c7,
        roughness: 0.1,
        metalness: 0.85,
        transparent: true,
        opacity: 0.88
      });
      const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
      oceanMesh.position.y = 1.0;
      scene.add(oceanMesh);

      // 3. Dense Pine Trees (Instanced)
      const treeCount = 1800;
      const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 3, 5);
      const foliageGeo = new THREE.ConeGeometry(2.2, 7, 5);
      foliageGeo.translate(0, 4.5, 0);

      // Merge into single tree geometry
      const treeGroup = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
      const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.7 });

      const foliageInst = new THREE.InstancedMesh(foliageGeo, foliageMat, treeCount);
      const dummy = new THREE.Object3D();

      let placed = 0;
      for (let i = 0; i < treeCount * 2 && placed < treeCount; i++) {
        const rx = (Math.random() - 0.5) * 1600;
        const rz = (Math.random() - 0.5) * 1600;
        const ry = getTerrainHeight(rx, rz);

        // Keep trees away from water level and not on ultra-high peaks
        if (ry > 3.5 && ry < 65) {
          dummy.position.set(rx, ry, rz);
          const s = 0.6 + Math.random() * 0.9;
          dummy.scale.set(s, s * (0.8 + Math.random() * 0.4), s);
          dummy.rotation.y = Math.random() * Math.PI * 2;
          dummy.updateMatrix();
          foliageInst.setMatrixAt(placed, dummy.matrix);
          placed++;
        }
      }
      foliageInst.castShadow = true;
      scene.add(foliageInst);

      // 4. Canyon Rock Arches & Glowing Crystals inside Tunnel
      createCanyonTunnelFeatures();
      createSkyAtmosphere();
    }

    // Canyon Tunnel Glowing Crystal Pillars
    function createCanyonTunnelFeatures() {
      const crystalCount = 45;
      const crystalGeo = new THREE.OctahedronGeometry(1.8, 0);
      const crystalMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 1.8,
        roughness: 0.2,
        metalness: 0.9
      });
      const crystalInst = new THREE.InstancedMesh(crystalGeo, crystalMat, crystalCount);
      const dummy = new THREE.Object3D();

      // Tunnel center is around points (110, 10, -170)
      for (let i = 0; i < crystalCount; i++) {
        const angle = (i / crystalCount) * Math.PI * 2;
        const dist = 14 + Math.random() * 12;
        dummy.position.set(
          110 + Math.cos(angle) * dist,
          getTerrainHeight(110, -170) + 1 + Math.random() * 15,
          -170 + Math.sin(angle) * dist
        );
        dummy.scale.set(0.8 + Math.random(), 1.5 + Math.random() * 2, 0.8 + Math.random());
        dummy.rotation.set(Math.random(), Math.random(), Math.random());
        dummy.updateMatrix();
        crystalInst.setMatrixAt(i, dummy.matrix);
      }
      scene.add(crystalInst);
    }

    function createSkyAtmosphere() {
      const cloudGroup = new THREE.Group();
      const cloudGeo = new THREE.DodecahedronGeometry(22, 1);
      const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1.0,
        metalness: 0.0,

      });

      for (let i = 0; i < 40; i++) {

        const cx = (Math.random() - 0.5) * 2000;
        const cy = 160 + Math.random() * 80;
        const cz = (Math.random() - 0.5) * 2000;

        for (let p = 0; p < 5; p++) {

          puff.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 35);

          puff.scale.set(s * 1.5, s * 0.7, s * 1.2);
          cloudCluster.add(puff);
        }

        cloudGroup.add(cloudCluster);
      }
      scene.add(cloudGroup);
    }

    function drawSpeedWindOverlay(speedKmH) {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (speedKmH < 40) return;

      const intensity = Math.min((speedKmH - 40) / 90, 1.0);
      const cx = fxCanvas.width / 2;
      const cy = fxCanvas.height / 2;

      fxCtx.lineWidth = 1.8 * intensity;
      fxCtx.strokeStyle = `rgba(255, 255, 255, ${0.45 * intensity})`;

      for (let p of windParticles) {
        // Radiate outward from screen center
        const dx = p.x - cx;
        const dy = p.y - cy;
        const angle = Math.atan2(dy, dx);
        const dist = Math.hypot(dx, dy);

        fxCtx.beginPath();
        fxCtx.moveTo(p.x, p.y);
        fxCtx.lineTo(
          p.x + Math.cos(angle) * (p.len * intensity * 2.5),
          p.y + Math.sin(angle) * (p.len * intensity * 2.5)
        );
        fxCtx.stroke();

        // Move particle outward
        p.x += Math.cos(angle) * (p.speed * intensity * 1.5);
        p.y += Math.sin(angle) * (p.speed * intensity * 1.5);

        // Reset if out of screen bounds
        if (p.x < 0 || p.x > fxCanvas.width || p.y < 0 || p.y > fxCanvas.height) {
          p.x = cx + (Math.random() - 0.5) * (fxCanvas.width * 0.5);
          p.y = cy + (Math.random() - 0.5) * (fxCanvas.height * 0.5);
        }
      }
    }

    // --- PHYSICS KINEMATICS & TRAIN UPDATE LOOP ---
    const peakHeight = 120; // top of lift hill
    let currentGForce = 1.0;
    let cameraShake = 0;

    function updateCoasterPhysics(delta) {
      const frame = getTrackFrameAtDist(currentDist);
      const h = frame.pos.y;
      const t = frame.t;

      // 1. Identify Zone and Dynamic Speed
      let isLift = false;
      let isBrake = false;

      // Detect current element
      let activeElement = null;
      for (let i = 0; i < trackElements.length; i++) {
        const el = trackElements[i];
        if (t >= el.tStart && t <= el.tEnd) {
          activeElement = el;
          if (i !== lastElementIndex) {
            lastElementIndex = i;
            triggerElementBanner(el.name);
          }
          break;
        }
      }

      currentZone = activeElement ? activeElement.zone : "TRACK";
      document.getElementById('zone-text').textContent = activeElement ? activeElement.name : "HIGH-SPEED RUN";

      if (currentZone === "LIFT") {
        isLift = true;
        currentSpeed = CONFIG.liftSpeed; // Constant mechanical climb
      } else if (currentZone === "BRAKE") {
        isBrake = true;
        currentSpeed = THREE.MathUtils.lerp(currentSpeed, 8.0, delta * 2.5); // Smooth magnetic braking
      } else {
        // Real Kinetic Energy Conversion: v = sqrt(2 * g * (h_peak - h) + v0^2)
        const potentialDrop = Math.max(0, peakHeight - h);
        const gravityTargetSpeed = Math.sqrt(2 * CONFIG.gravity * potentialDrop + 36);
        currentSpeed = THREE.MathUtils.lerp(currentSpeed, gravityTargetSpeed, delta * 4.0);
      }

      currentSpeed = Math.max(currentSpeed, CONFIG.minSpeed);

      // Advance distance along track
      currentDist += currentSpeed * delta;
      if (currentDist >= totalTrackLength) currentDist -= totalTrackLength;

      // Calculate Real G-Force (Centripetal Acceleration + Gravity Vector)
      const nextFrame = getTrackFrameAtDist(currentDist + 1.2);
      const tangentDiff = nextFrame.tangent.clone().sub(frame.tangent);
      const curvature = tangentDiff.length() / 1.2;
      const centripetalAcc = (currentSpeed * currentSpeed) * curvature;
      const verticalG = (centripetalAcc / CONFIG.gravity) * frame.normal.y + (frame.normal.y);
      currentGForce = THREE.MathUtils.lerp(currentGForce, Math.max(0.2, Math.abs(verticalG)), delta * 6);

      // 2. Position and Orient Train Carriage
      if (trainCartMesh) {
        trainCartMesh.position.copy(frame.pos);
        const basisMat = new THREE.Matrix4().makeBasis(frame.binormal, frame.normal, frame.tangent);
        trainCartMesh.rotation.setFromRotationMatrix(basisMat);

        // Add subtle physics suspension wobble
        const wobble = Math.sin(Date.now() * 0.02) * (currentSpeed * 0.0008);
        trainCartMesh.rotateZ(wobble);
      }

      // 3. Camera Positioning & Inertia Modes
      updateCamera(frame, delta);

      // 4. Dynamic Field of View based on velocity (62° on lift -> 90° at 130 km/h)
      const speedRatio = Math.min((currentSpeed * 3.6) / 140, 1.0);
      const targetFov = THREE.MathUtils.lerp(CONFIG.minFov, CONFIG.maxFov, speedRatio);
      camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, delta * 3.0);
      camera.updateProjectionMatrix();

      // 5. Update Telemetry HUD & Audio
      const speedKmH = currentSpeed * 3.6;
      document.getElementById('val-speed').textContent = Math.round(speedKmH);
      document.getElementById('bar-speed').style.width = `${Math.min((speedKmH / 140) * 100, 100)}%`;
      document.getElementById('val-gforce').textContent = currentGForce.toFixed(1);
      document.getElementById('val-alt').textContent = Math.round(h);

      audio.update(speedKmH, isLift, currentGForce);
      drawSpeedWindOverlay(speedKmH);
    }

    // --- CAMERA RIG SYSTEM ---
    function updateCamera(frame, delta) {
      // Smooth interactive mouse look damping
      targetLookX = THREE.MathUtils.lerp(targetLookX, mouseX * 0.55, delta * 8);
      targetLookY = THREE.MathUtils.lerp(targetLookY, mouseY * 0.45, delta * 8);

      // Speed vibration / head rattle
      const shakeIntensity = Math.pow(currentSpeed / 38, 2.5) * 0.04;
      const shakeX = (Math.random() - 0.5) * shakeIntensity;
      const shakeY = (Math.random() - 0.5) * shakeIntensity;

      if (cameraMode === 0) {
        // Mode 0: 1st Person Front Seat Cockpit
        const eyePos = frame.pos.clone()
          .add(frame.normal.clone().multiplyScalar(0.72 + shakeY))
          .add(frame.binormal.clone().multiplyScalar(shakeX))
          .add(frame.tangent.clone().multiplyScalar(0.15));

        camera.position.copy(eyePos);

        const lookTarget = frame.pos.clone()
          .add(frame.tangent.clone().multiplyScalar(15))
          .add(frame.normal.clone().multiplyScalar(0.65))
          .add(frame.binormal.clone().multiplyScalar(targetLookX * 12))
          .add(frame.normal.clone().multiplyScalar(targetLookY * 8));

        camera.up.copy(frame.normal);
        camera.lookAt(lookTarget);

        if (trainCartMesh) trainCartMesh.visible = true;

      } else if (cameraMode === 1) {
        // Mode 1: Front Bumper Cam (Pure uninhibited rail sensation)
        const bumperPos = frame.pos.clone()
          .add(frame.normal.clone().multiplyScalar(0.25))
          .add(frame.tangent.clone().multiplyScalar(1.6));

        camera.position.copy(bumperPos);
        const lookTarget = bumperPos.clone().add(frame.tangent.clone().multiplyScalar(20));
        camera.up.copy(frame.normal);
        camera.lookAt(lookTarget);

        if (trainCartMesh) trainCartMesh.visible = false;

      } else if (cameraMode === 2) {
        // Mode 2: Cinematic Third-Person Chase Cam
        const chasePos = frame.pos.clone()
          .add(frame.tangent.clone().multiplyScalar(-6.5))
          .add(frame.normal.clone().multiplyScalar(2.8));

        camera.position.lerp(chasePos, delta * 12);
        const lookTarget = frame.pos.clone().add(frame.tangent.clone().multiplyScalar(8));
        camera.up.copy(frame.normal);
        camera.lookAt(lookTarget);

        if (trainCartMesh) trainCartMesh.visible = true;

      } else if (cameraMode === 3) {
        // Mode 3: Dynamic Orbit Flyby Drone Cam
        const time = Date.now() * 0.001;
        const orbitOffset = new THREE.Vector3(
          Math.sin(time * 0.6) * 16,
          6 + Math.cos(time * 0.4) * 4,
          Math.cos(time * 0.6) * 16
        );
        camera.position.copy(frame.pos.clone().add(orbitOffset));
        camera.up.set(0, 1, 0);
        camera.lookAt(frame.pos);

        if (trainCartMesh) trainCartMesh.visible = true;
      }
    }

    // --- UI BANNER TRIGGER ---
    let bannerTimeout = null;
    function triggerElementBanner(text) {
      const banner = document.getElementById('element-banner');
      banner.textContent = text;
      banner.classList.add('show');
      if (bannerTimeout) clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => {
        banner.classList.remove('show');
      }, 3500);
    }

    // --- EVENT LISTENERS & INTERACTION ---
    // Start Ride Interaction
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('start-overlay').classList.add('hidden');
      isStarted = true;
      audio.init();
    });

    // Mouse / Touch Look Controls
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.interactive')) return;
      isMouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) {
        // Subtle parallax when just hovering
        mouseX = (e.clientX / window.innerWidth - 0.5) * 1.2;
        mouseY = -(e.clientY / window.innerHeight - 0.5) * 1.2;
      } else {
        const dx = (e.clientX - lastMouseX) * 0.003;
        const dy = (e.clientY - lastMouseY) * 0.003;
        mouseX = THREE.MathUtils.clamp(mouseX + dx, -1.8, 1.8);
        mouseY = THREE.MathUtils.clamp(mouseY - dy, -1.2, 1.2);
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }
    });

    // Touch support
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        mouseY = -(e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'c' || e.key === 'C') {
        cycleCameraMode();
      } else if (e.key === 'h' || e.key === 'H') {
        toggleHUD();
      } else if (e.key === 'm' || e.key === 'M') {
        toggleSound();
      } else if (e.key === 't' || e.key === 'T') {
        cycleTimeOfDay();
      }
    });

    // Camera Mode Switcher Buttons
    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cameraMode = parseInt(btn.dataset.cam);
      });
    });

    function cycleCameraMode() {
      cameraMode = (cameraMode + 1) % 4;
      document.querySelectorAll('.cam-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.cam) === cameraMode);
      });
    }

    // Time of Day Toggle
    document.getElementById('btn-tod').addEventListener('click', cycleTimeOfDay);
    function cycleTimeOfDay() {
      timeOfDayIndex = (timeOfDayIndex + 1) % TOD_CONFIGS.length;
      applyTimeOfDay(timeOfDayIndex);
    }

    // Audio Toggle
    document.getElementById('btn-sound').addEventListener('click', toggleSound);
    function toggleSound() {
      isAudioEnabled = !isAudioEnabled;
      if (isAudioEnabled && !audio.initialized) audio.init();
      document.getElementById('sound-text').textContent = isAudioEnabled ? "Sound On" : "Muted";
      document.getElementById('btn-sound').classList.toggle('active', isAudioEnabled);
    }

    // HUD Visibility Toggle
    document.getElementById('btn-hud-toggle').addEventListener('click', toggleHUD);
    function toggleHUD() {
      document.getElementById('hud').classList.toggle('hud-hidden');
    }

    // --- INITIALIZE SCENE OBJECTS ---
    createTrackMeshes();
    createEnvironment();
    createCoasterTrain();
    setupLighting();

    // --- MAIN ANIMATION RENDER LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      if (isStarted) {
        updateCoasterPhysics(delta);
      } else {
        // Idle camera sweep in start screen
        const idleTime = Date.now() * 0.0003;
        camera.position.set(
          Math.sin(idleTime) * 120 + 25,
          85 + Math.cos(idleTime * 0.7) * 20,
          Math.cos(idleTime) * 120 + 260
        );
        camera.up.set(0, 1, 0);
        camera.lookAt(25, 60, 260);
      }

      renderer.render(scene, camera);
    }

    // Begin Animation Loop
    animate();
  </script>
</body>
