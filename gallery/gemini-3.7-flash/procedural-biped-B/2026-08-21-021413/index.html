<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELOX-09 — Digitigrade Saurian Biped</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070913; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud-panel {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .tech-card {
      background: rgba(13, 19, 36, 0.76);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .controls-deck {
      pointer-events: auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ctrl-slider {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .ctrl-slider input[type="range"] {
      width: 100px;
      accent-color: #0284c7;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(14, 165, 233, 0.3); border-color: #0ea5e9; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud-panel">
    <div class="top-bar">
      <div class="tech-card" style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">🦖</span>
        <div>
          <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.06em;">VELOX-09 // SAURIAN STRIDER</div>
          <div style="font-size: 11px; color: #38bdf8;">DIGITIGRADE INVERSE KINEMATICS & TAIL EQUILIBRIUM</div>
        </div>
      </div>

      <div class="tech-card" style="display: flex; gap: 14px; text-align: right;">
        <div>
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Locomotion</div>
          <div style="font-size: 16px; font-weight: 800; color: #38bdf8;" id="loco-text">Predatory Trot</div>
        </div>
        <div>
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Step Rate</div>
          <div style="font-size: 16px; font-weight: 800;"><span id="step-rate">125</span> BPM</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="tech-card controls-deck">
        <div class="ctrl-slider">
          <span>Pace: <b id="speed-disp">1.0x</b></span>
          <input type="range" id="speed-slider" min="0.3" max="2.2" step="0.1" value="1.0">
        </div>
        <button id="btn-mode" class="btn">⚡ Mode: Trot</button>
        <button id="btn-audio" class="btn">🔊 Audio: Active</button>
      </div>
      <div class="tech-card" style="font-size: 11px; color: #94a3b8;">
        Digitigrade 3-joint leg kinematics • Dynamic tail sway • Drag to Orbit
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Step Impact Audio Synthesizer
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playStepImpact() {
      if (!isSoundOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.14);

      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070913);
    scene.fog = new THREE.FogExp2(0x070913, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(5, 4.2, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Dynamic Studio Lighting
    const hemi = new THREE.HemisphereLight(0x0284c7, 0x0f172a, 0.6);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffedd5, 2.0);
    keyLight.position.set(12, 18, 14);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x06b6d4, 1.4);
    rimLight.position.set(-12, 10, -12);
    scene.add(rimLight);

    // Treadmill Runway Grid Floor
    const grid = new THREE.GridHelper(80, 40, 0x0284c7, 0x1e293b);
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.6, metalness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Materials Palette
    const carbonMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.2 });
    const tealSinew = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.6, roughness: 0.3 });
    const goldJoint = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.25 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

    // Saurian Biped Hierarchy
    const creature = new THREE.Group();
    scene.add(creature);

    // Pelvis Core (Angled forward for predatory stance)
    const pelvis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.0, 1.6), carbonMat);
    pelvis.position.y = 3.2;
    pelvis.castShadow = true;
    creature.add(pelvis);

    // Forward-Canted Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.6, 2.4), carbonMat);
    torso.position.set(0, 0.8, 0.8);
    torso.rotation.x = -0.35; // Raptor forward crouch
    torso.castShadow = true;
    pelvis.add(torso);

    // Raptor Snout / Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 2.0), carbonMat);
    head.position.set(0, 0.6, 1.8);
    head.castShadow = true;
    torso.add(head);

    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.6), eyeMat);
    eyeL.position.set(-0.61, 0.1, 0.3);
    head.add(eyeL);

    const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.6), eyeMat);
    eyeR.position.set(0.61, 0.1, 0.3);
    head.add(eyeR);

    // Articulated Multi-Segment Counterbalance Tail
    const tailSegments = [];
    let prevTail = pelvis;
    for (let t = 0; t < 5; t++) {
      const segGroup = new THREE.Group();
      segGroup.position.set(0, -0.1, -1.0);

      const size = 1.0 - t * 0.15;
      const seg = new THREE.Mesh(new THREE.BoxGeometry(size * 0.9, size * 0.8, 1.4), carbonMat);
      seg.position.z = -0.6;
      seg.castShadow = true;
      segGroup.add(seg);

      prevTail.add(segGroup);
      tailSegments.push(segGroup);
      prevTail = segGroup;
    }

    // Digitigrade Leg Builder (Hip -> Thigh -> Knee (forward) -> Shin -> Ankle (backward) -> Metatarsus -> Claws)
    function buildDigitigradeLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 1.0, -0.2, 0);

      const hipCap = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), goldJoint);
      hip.add(hipCap);

      // Thigh (angles forward)
      const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.5, 0.7), carbonMat);
      thigh.position.set(0, -0.7, 0.2);
      thigh.rotation.x = -0.3;
      thigh.castShadow = true;
      hip.add(thigh);

      // Main Knee
      const knee = new THREE.Group();
      knee.position.set(0, -1.4, 0.4);
      const kneeJoint = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.7, 10), goldJoint);
      kneeJoint.rotation.z = Math.PI / 2;
      knee.add(kneeJoint);
      hip.add(knee);

      // Backward Shin (Digitigrade)
      const shin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.6, 0.5), tealSinew);
      shin.position.set(0, -0.7, -0.3);
      shin.rotation.x = 0.55;
      shin.castShadow = true;
      knee.add(shin);

      // Ankle Joint
      const ankle = new THREE.Group();
      ankle.position.set(0, -1.4, -0.6);
      const ankleJoint = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), goldJoint);
      ankle.add(ankleJoint);
      knee.add(ankle);

      // Gripping Foot / Claws
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 1.5), carbonMat);
      foot.position.set(0, -0.15, 0.5);
      foot.castShadow = true;
      ankle.add(foot);

      return { hip, knee, ankle };
    }

    const leftLeg = buildDigitigradeLeg(-1);
    const rightLeg = buildDigitigradeLeg(1);
    pelvis.add(leftLeg.hip);
    pelvis.add(rightLeg.hip);

    // UI Input Handling
    let paceMult = 1.0;
    let gaitMode = 0; // 0: Trot, 1: Sprint, 2: Stalk
    const speedSlider = document.getElementById('speed-slider');
    const speedDisp = document.getElementById('speed-disp');
    const btnMode = document.getElementById('btn-mode');
    const btnAudio = document.getElementById('btn-audio');
    const locoText = document.getElementById('loco-text');
    const stepRate = document.getElementById('step-rate');

    speedSlider.oninput = (e) => {
      paceMult = parseFloat(e.target.value);
      speedDisp.textContent = paceMult.toFixed(1) + 'x';
      stepRate.textContent = Math.round(125 * paceMult);
    };

    btnMode.onclick = () => {
      gaitMode = (gaitMode + 1) % 3;
      if (gaitMode === 0) {
        locoText.textContent = 'Predatory Trot';
        btnMode.textContent = '⚡ Mode: Trot';
      } else if (gaitMode === 1) {
        locoText.textContent = 'High-Speed Sprint';
        btnMode.textContent = '⚡ Mode: Sprint';
      } else {
        locoText.textContent = 'Low Stalk';
        btnMode.textContent = '⚡ Mode: Stalk';
      }
    };

    btnAudio.onclick = () => {
      initAudio();
      isSoundOn = !isSoundOn;
      btnAudio.textContent = isSoundOn ? '🔊 Audio: Active' : '🔇 Audio: Muted';
    };

    // Orbit Camera
    let isMouseDown = false;
    let prevMouse = { x: 0, y: 0 };
    let sph = { r: 10, phi: Math.PI / 2.7, theta: 0.4 };

    window.addEventListener('mousedown', (e) => {
      initAudio();
      isMouseDown = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      sph.theta -= dx * 0.006;
      sph.phi = Math.max(0.1, Math.min(Math.PI / 2.05, sph.phi - dy * 0.006));
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('wheel', (e) => {
      sph.r = Math.max(4, Math.min(22, sph.r + e.deltaY * 0.01));
    });

    // Gait Simulation Loop
    let walkCycle = 0;
    let lastStepSign = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const cadence = 4.0 * paceMult * (gaitMode === 1 ? 1.4 : (gaitMode === 2 ? 0.65 : 1.0));
      walkCycle += delta * cadence;

      // Pelvis bobbing & predatory tilt
      const bob = Math.abs(Math.sin(walkCycle * 2)) * 0.3;
      pelvis.position.y = 3.2 - bob;
      pelvis.rotation.y = Math.sin(walkCycle) * 0.12;
      pelvis.rotation.z = Math.cos(walkCycle) * 0.06;

      // Tail equilibrium harmonic wave
      for (let t = 0; t < tailSegments.length; t++) {
        tailSegments[t].rotation.y = Math.sin(walkCycle - t * 0.5) * 0.16;
        tailSegments[t].rotation.x = 0.08 + Math.sin(walkCycle * 2 - t * 0.3) * 0.06;
      }

      // Left Digitigrade Leg (Phase 0)
      const lSin = Math.sin(walkCycle);
      leftLeg.hip.rotation.x = lSin * 0.7;
      leftLeg.knee.rotation.x = lSin < 0 ? Math.abs(lSin) * 0.9 : -0.1;
      leftLeg.ankle.rotation.x = -leftLeg.hip.rotation.x - leftLeg.knee.rotation.x;

      // Right Digitigrade Leg (Phase PI)
      const rSin = Math.sin(walkCycle + Math.PI);
      rightLeg.hip.rotation.x = rSin * 0.7;
      rightLeg.knee.rotation.x = rSin < 0 ? Math.abs(rSin) * 0.9 : -0.1;
      rightLeg.ankle.rotation.x = -rightLeg.hip.rotation.x - rightLeg.knee.rotation.x;

      // Impact sound on touchdown
      const currentSign = Math.sign(lSin);
      if (currentSign !== lastStepSign && currentSign !== 0) {
        playStepImpact();
        lastStepSign = currentSign;
      }

      // Runway Grid Scrolling
      grid.position.z = (grid.position.z + delta * paceMult * 6.5) % 2;

      // Camera
      camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
      camera.position.y = sph.r * Math.cos(sph.phi) + 2.2;
      camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
      camera.lookAt(0, 2.5, 0);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
