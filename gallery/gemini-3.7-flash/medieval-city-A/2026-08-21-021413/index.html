<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Procedural Medieval City</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #93c5fd; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">Living Medieval City • Drag to Orbit • Scroll to Zoom</div>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x93c5fd);
    scene.fog = new THREE.Fog(0x93c5fd, 60, 300);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Sunlight & Ambient
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.4);
    sun.position.set(70, 100, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // Green Landscape Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 400),
      new THREE.MeshLambertMaterial({ color: 0x4d7c0f })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Materials
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
    const plasterMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.6 });

    // Fortified Stone Wall Perimeter
    const wallRadius = 50;
    const numTowers = 8;
    for (let i = 0; i < numTowers; i++) {
      const angle = (i / numTowers) * Math.PI * 2;
      const x = Math.cos(angle) * wallRadius;
      const z = Math.sin(angle) * wallRadius;

      // Tower
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.8, 12, 12), stoneMat);
      tower.position.set(x, 6, z);
      tower.castShadow = tower.receiveShadow = true;
      scene.add(tower);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 4, 12), roofMat);
      roof.position.set(x, 14, z);
      roof.castShadow = true;
      scene.add(roof);

      // Connecting Wall
      const nextAngle = ((i + 1) / numTowers) * Math.PI * 2;
      const nx = Math.cos(nextAngle) * wallRadius;
      const nz = Math.sin(nextAngle) * wallRadius;

      if (i !== 0) {
        const len = Math.hypot(nx - x, nz - z);
        const ang = Math.atan2(nz - z, nx - x);
        const wall = new THREE.Mesh(new THREE.BoxGeometry(len, 7, 1.8), stoneMat);
        wall.position.set((x + nx) / 2, 3.5, (z + nz) / 2);
        wall.rotation.y = -ang;
        wall.castShadow = wall.receiveShadow = true;
        scene.add(wall);
      }
    }

    // Central Keep
    const keep = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 14), stoneMat);
    keep.position.set(0, 9, 0);
    keep.castShadow = keep.receiveShadow = true;
    scene.add(keep);

    const keepRoof = new THREE.Mesh(new THREE.ConeGeometry(11, 7, 4), roofMat);
    keepRoof.position.set(0, 21.5, 0);
    keepRoof.rotation.y = Math.PI / 4;
    keepRoof.castShadow = true;
    scene.add(keepRoof);

    // Procedural Houses Inside Wall
    for (let r = -5; r <= 5; r++) {
      for (let c = -5; c <= 5; c++) {
        const hx = c * 8 + (Math.random() - 0.5) * 1.5;
        const hz = r * 8 + (Math.random() - 0.5) * 1.5;
        const d = Math.hypot(hx, hz);

        if (d > 12 && d < wallRadius - 6 && Math.abs(hx) > 3 && Math.abs(hz) > 3) {
          const house = new THREE.Group();
          const w = 4 + Math.random() * 1.5;
          const len = 4 + Math.random() * 1.5;
          const h = 4 + Math.random() * 2;

          const base = new THREE.Mesh(new THREE.BoxGeometry(w, h, len), plasterMat);
          base.position.y = h / 2;
          base.castShadow = base.receiveShadow = true;
          house.add(base);

          const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, len) * 0.8, 3, 4), roofMat);
          roof.position.y = h + 1.5;
          roof.rotation.y = Math.PI / 4;
          roof.castShadow = true;
          house.add(roof);

          house.position.set(hx, 0, hz);
          house.rotation.y = (Math.random() - 0.5) * 0.5;
          scene.add(house);
        }
      }
    }

    // Living Citizens Walking along streets
    const citizens = [];
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 });
    const headMat = new THREE.MeshLambertMaterial({ color: 0xfbbf24 });

    for (let i = 0; i < 20; i++) {
      const npc = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 1.1, 8), bodyMat);
      body.position.y = 0.55;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), headMat);
      head.position.y = 1.3;
      npc.add(body);
      npc.add(head);

      const pathAng = Math.random() * Math.PI * 2;
      const radius = 8 + Math.random() * 30;
      npc.position.set(Math.cos(pathAng) * radius, 0, Math.sin(pathAng) * radius);
      scene.add(npc);

      citizens.push({
        group: npc,
        angle: pathAng,
        radius,
        speed: 0.2 + Math.random() * 0.3,
        step: Math.random() * 10
      });
    }

    // Orbit Camera Controls
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let sph = { r: 100, phi: Math.PI / 3, theta: Math.PI / 4 };

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      sph.theta -= dx * 0.005;
      sph.phi = Math.max(0.2, Math.min(Math.PI / 2.1, sph.phi - dy * 0.005));
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('wheel', (e) => {
      sph.r = Math.max(25, Math.min(220, sph.r + e.deltaY * 0.1));
    });

    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (!isDragging) sph.theta += 0.04 * delta;

      camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
      camera.position.y = sph.r * Math.cos(sph.phi);
      camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
      camera.lookAt(0, 5, 0);

      // Villagers walking
      for (const c of citizens) {
        c.angle += (c.speed / c.radius) * delta * 5;
        c.group.position.x = Math.cos(c.angle) * c.radius;
        c.group.position.z = Math.sin(c.angle) * c.radius;
        c.group.rotation.y = -c.angle - Math.PI / 2;
        c.step += delta * 8;
        c.group.position.y = Math.abs(Math.sin(c.step)) * 0.1;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
