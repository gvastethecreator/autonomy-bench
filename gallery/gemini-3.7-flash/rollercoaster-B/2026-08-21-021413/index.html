<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mojave Gorge — First-Person Coaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1105; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .brass-card {
      background: rgba(42, 17, 5, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
      padding: 10px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .telemetry-row {
      display: flex;
      gap: 12px;
    }

    .stat-box {
      text-align: right;
      min-width: 90px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .btn {
      pointer-events: auto;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fef3c7;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(245, 158, 11, 0.35);
      border-color: #f59e0b;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div class="brass-card">
        <div style="font-size: 11px; font-weight: 700; color: #f59e0b; letter-spacing: 0.1em;">MOJAVE GORGE EXPEDITION</div>
        <div style="font-weight: 600; font-size: 13px; color: #fde68a;">Canyon Run • Loop 1</div>
      </div>
      <div class="telemetry-row">
        <div class="brass-card stat-box">
          <div class="stat-label">Velocity</div>
          <div class="stat-val"><span id="speed-val">0</span> <span style="font-size: 11px; color: #94a3b8;">MPH</span></div>
        </div>
        <div class="brass-card stat-box">
          <div class="stat-label">Elevation</div>
          <div class="stat-val"><span id="alt-val">80</span> <span style="font-size: 11px; color: #94a3b8;">FT</span></div>
        </div>
        <div class="brass-card stat-box">
          <div class="stat-label">G-Force</div>
          <div class="stat-val"><span id="g-val">1.0</span> <span style="font-size: 11px; color: #94a3b8;">G</span></div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div style="display: flex; gap: 8px; pointer-events: auto;">
        <button id="btn-audio" class="btn">🔊 Audio: Off</button>
        <button id="btn-cam" class="btn">🎥 Cam: Front Seat</button>
      </div>
      <div class="brass-card" style="font-size: 11px; color: #cbd5e1;">
        Energy-conserving physics • Desert canyon procedural terrain
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Audio synthesis for coaster clack & wind
    let audioCtx = null;
    let windGain = null;
    let clackGain = null;
    let isSoundOn = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Wind white noise
      const bSize = audioCtx.sampleRate * 2;
      const b = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < bSize; i++) d[i] = Math.random() * 2 - 1;

      const src = audioCtx.createBufferSource();
      src.buffer = b;
      src.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 450;

      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;

      src.connect(filter);
      filter.connect(windGain);
      windGain.connect(audioCtx.destination);
      src.start();

      // Mechanical Clacking
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = 50;
      clackGain = audioCtx.createGain();
      clackGain.gain.value = 0.0;
      osc.connect(clackGain);
      clackGain.connect(audioCtx.destination);
      osc.start();
    }

    // 3D Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfb923c);
    scene.fog = new THREE.FogExp2(0xfb923c, 0.0035);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // Warm Sunset Light
    const hemi = new THREE.HemisphereLight(0xffedd5, 0x7c2d12, 0.7);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffedd5, 2.0);
    sun.position.set(150, 120, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 600;
    sun.shadow.camera.left = -250;
    sun.shadow.camera.right = 250;
    sun.shadow.camera.top = 250;
    sun.shadow.camera.bottom = -250;
    scene.add(sun);

    // Red Sandstone Canyon Terrain
    const canyonGeo = new THREE.PlaneGeometry(1000, 1000, 80, 80);
    const pos = canyonGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      // Canyon Ravine in middle
      const distFromCanyon = Math.abs(x - y * 0.3);
      let elev = Math.sin(x * 0.015) * Math.cos(y * 0.015) * 22;
      if (distFromCanyon > 40) {
        elev += (distFromCanyon - 40) * 0.45; // Canyon walls
      }
      pos.setZ(i, elev);
    }
    canyonGeo.computeVertexNormals();

    const canyonMat = new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.85, metalness: 0.1 });
    const canyon = new THREE.Mesh(canyonGeo, canyonMat);
    canyon.rotation.x = -Math.PI / 2;
    canyon.receiveShadow = true;
    scene.add(canyon);

    // Canyon River at bottom of gorge
    const river = new THREE.Mesh(
      new THREE.PlaneGeometry(1000, 1000),
      new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.7 })
    );
    river.rotation.x = -Math.PI / 2;
    river.position.y = -2;
    scene.add(river);

    // Canyon Rollercoaster Spline (Desert drops, canyon dives)
    const splinePoints = [
      new THREE.Vector3(0, 15, 0),
      new THREE.Vector3(25, 45, 50),
      new THREE.Vector3(60, 95, 100),  // High Butte Lift
      new THREE.Vector3(90, 10, 160),  // Deep Canyon Drop
      new THREE.Vector3(120, 40, 120),
      new THREE.Vector3(140, 80, 60),  // Butte Ridge Bank
      new THREE.Vector3(110, 20, 0),
      new THREE.Vector3(60, 60, -60),
      new THREE.Vector3(0, 85, -110),  // Second Peak
      new THREE.Vector3(-40, 15, -140),// Low Water Skim
      new THREE.Vector3(-90, 50, -80),
      new THREE.Vector3(-110, 75, -20),
      new THREE.Vector3(-80, 20, 40),
      new THREE.Vector3(-30, 10, 20)
    ];

    const trackSpline = new THREE.CatmullRomCurve3(splinePoints, true, 'centripetal', 0.5);
    const numSubdivisions = 800;
    const trackGauge = 1.1;

    const leftRailPts = [];
    const rightRailPts = [];
    const spinePts = [];
    const tiesGroup = new THREE.Group();
    const pillarsGroup = new THREE.Group();

    const tieMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.6 });
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x78716c, metalness: 0.7, roughness: 0.3 });

    for (let i = 0; i < numSubdivisions; i++) {
      const u = i / numSubdivisions;
      const pt = trackSpline.getPointAt(u);
      const tangent = trackSpline.getTangentAt(u).normalize();
      const nextTan = trackSpline.getTangentAt((u + 0.004) % 1).normalize();

      const curvature = new THREE.Vector3().crossVectors(tangent, nextTan).y;
      const bank = curvature * 26;

      let up = new THREE.Vector3(0, 1, 0);
      up.applyAxisAngle(tangent, bank);
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      const binormal = new THREE.Vector3().crossVectors(normal, tangent).normalize();

      leftRailPts.push(pt.clone().add(normal.clone().multiplyScalar(-trackGauge)));
      rightRailPts.push(pt.clone().add(normal.clone().multiplyScalar(trackGauge)));
      spinePts.push(pt.clone().add(binormal.clone().multiplyScalar(-0.4)));

      if (i % 2 === 0) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(trackGauge * 2.3, 0.16, 0.35), tieMat);
        tie.position.copy(pt);
        tie.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(normal, binormal, tangent));
        tiesGroup.add(tie);
      }

      if (i % 16 === 0 && pt.y > 0) {
        const pHeight = pt.y + 2;
        const pMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, pHeight, 8), pillarMat);
        pMesh.position.set(pt.x, (pt.y - 2) / 2, pt.z);
        pMesh.castShadow = true;
        pillarsGroup.add(pMesh);
      }
    }

    scene.add(tiesGroup);
    scene.add(pillarsGroup);

    const railMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.8, roughness: 0.25 });
    const spineMaterial = new THREE.MeshStandardMaterial({ color: 0x292524, metalness: 0.8, roughness: 0.4 });

    const leftRail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(leftRailPts, true), 600, 0.12, 8, true), railMaterial);
    const rightRail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rightRailPts, true), 600, 0.12, 8, true), railMaterial);
    const spineRail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spinePts, true), 600, 0.2, 8, true), spineMaterial);

    scene.add(leftRail);
    scene.add(rightRail);
    scene.add(spineRail);

    // Front Coaster Frame for Cockpit
    const cartGroup = new THREE.Group();
    const cartNose = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.45, 1.6),
      new THREE.MeshStandardMaterial({ color: 0xb45309, metalness: 0.7, roughness: 0.3 })
    );
    cartNose.position.set(0, -0.35, 0.8);
    cartGroup.add(cartNose);
    scene.add(cartGroup);

    // UI Buttons
    let camMode = 'front';
    const btnCam = document.getElementById('btn-cam');
    btnCam.onclick = () => {
      camMode = camMode === 'front' ? 'chase' : 'front';
      btnCam.textContent = camMode === 'front' ? '🎥 Cam: Front Seat' : '🎥 Cam: Third Person';
    };

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.onclick = () => {
      initAudio();
      isSoundOn = !isSoundOn;
      btnAudio.textContent = isSoundOn ? '🔊 Audio: Active' : '🔇 Audio: Muted';
    };

    // Telemetry references
    const speedVal = document.getElementById('speed-val');
    const altVal = document.getElementById('alt-val');
    const gVal = document.getElementById('g-val');

    // Simulation Physics State
    let progress = 0;
    let mph = 25;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const pos = trackSpline.getPointAt(progress);
      const nextPos = trackSpline.getPointAt((progress + 0.002) % 1);
      const tangent = trackSpline.getTangentAt(progress).normalize();

      // Gravity acceleration
      const drop = pos.y - nextPos.y;
      const targetMph = Math.max(20, Math.min(95, 30 + drop * 750 + (95 - pos.y) * 0.6));
      mph += (targetMph - mph) * delta * 2.2;

      const step = (mph / 3600) * delta * 2.2;
      progress = (progress + step) % 1;

      // Banking angle
      const nextTan = trackSpline.getTangentAt((progress + 0.005) % 1).normalize();
      const curvature = new THREE.Vector3().crossVectors(tangent, nextTan).y;
      const bank = curvature * 28;

      let up = new THREE.Vector3(0, 1, 0);
      up.applyAxisAngle(tangent, bank);
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      const binormal = new THREE.Vector3().crossVectors(normal, tangent).normalize();

      cartGroup.position.copy(pos);
      cartGroup.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(normal, binormal, tangent));

      if (camMode === 'front') {
        camera.position.copy(pos).add(binormal.clone().multiplyScalar(0.9)).add(tangent.clone().multiplyScalar(0.2));
        camera.lookAt(nextPos.clone().add(binormal.clone().multiplyScalar(0.9)));
        camera.up.copy(binormal);
      } else {
        const chasePos = pos.clone().add(binormal.clone().multiplyScalar(2.6)).add(tangent.clone().multiplyScalar(-5.5));
        camera.position.lerp(chasePos, 0.18);
        camera.lookAt(pos.clone().add(binormal.clone().multiplyScalar(0.8)));
      }

      // Telemetry
      speedVal.textContent = Math.round(mph);
      altVal.textContent = Math.round(pos.y);
      const gForce = (1.0 + Math.abs(curvature) * mph * 0.08 + (drop * 6)).toFixed(1);
      gVal.textContent = Math.max(0.6, gForce);

      // Sound update
      if (isSoundOn && audioCtx && windGain && clackGain) {
        windGain.gain.setTargetAtTime(Math.min(0.4, (mph / 90) * 0.35), audioCtx.currentTime, 0.1);
        clackGain.gain.setTargetAtTime(Math.min(0.2, (mph / 60) * 0.15), audioCtx.currentTime, 0.1);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
