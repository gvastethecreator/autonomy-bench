<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEO-STRIDER — Bio-Mechanical Biped Synthesizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030610; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }

    .glass-hud {
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 14px 22px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 0 24px rgba(6, 182, 212, 0.5);
    }

    .telemetry-row {
      display: flex;
      gap: 14px;
    }
    .tele-box {
      text-align: right;
      min-width: 100px;
    }
    .tele-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .tele-num {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .controls-deck {
      pointer-events: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hud-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35);
    }

    .start-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 30px 48px;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 30;
      transition: all 0.4s ease;
    }
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -40%);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud-overlay">
    <div class="top-bar">
      <div class="glass-hud brand-cluster">
        <div class="brand-icon">🧬</div>
        <div>
          <div style="font-size: 16px; font-weight: 800; letter-spacing: 0.08em;">NEO-STRIDER // GEN-4</div>
          <div style="font-size: 11px; color: #06b6d4; font-weight: 600;">SYNTHETIC BIO-MECHANICAL BIPED</div>
        </div>
      </div>

      <div class="telemetry-row">
        <div class="glass-hud tele-box">
          <div class="tele-label">Cadence</div>
          <div class="tele-num"><span id="cadence-txt">120</span> <span style="font-size: 12px; color: #94a3b8;">BPM</span></div>
        </div>
        <div class="glass-hud tele-box">
          <div class="tele-label">Gait Symmetry</div>
          <div class="tele-num" style="color: #10b981;">99.4%</div>
        </div>
        <div class="glass-hud tele-box">
          <div class="tele-label">Core Pulse</div>
          <div class="tele-num" style="color: #06b6d4;">NOMINAL</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="glass-hud controls-deck">
        <button id="btn-gait" class="hud-btn">⚡ Gait: Predatory Stride</button>
        <button id="btn-env" class="hud-btn">🌐 Lab: Cyber Testing Grid</button>
        <button id="btn-cam" class="hud-btn">🎥 Cam: Dynamic Orbit</button>
        <button id="btn-audio" class="hud-btn">🔊 Bio-Audio: Active</button>
      </div>

      <div class="glass-hud" style="font-size: 12px; color: #94a3b8;">
        Mouse looks around • Head tracks gaze • Drag to Orbit
      </div>
    </div>
  </div>

  <div id="start-modal" class="start-screen glass-hud">
    <div style="font-size: 36px; margin-bottom: 8px;">🧬</div>
    <div style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">INITIALIZE NEO-STRIDER</div>
    <div style="font-size: 13px; color: #94a3b8;">Click to activate Bio-Mechanical Audio Synthesis & Procedural IK Simulation</div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    let audioCtx = null;
    let pulseGain = null;
    let isSoundActive = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const pulseOsc = audioCtx.createOscillator();
      pulseOsc.type = 'sine';
      pulseOsc.frequency.value = 48;

      pulseGain = audioCtx.createGain();
      pulseGain.gain.value = 0.06;

      pulseOsc.connect(pulseGain);
      pulseGain.connect(audioCtx.destination);
      pulseOsc.start();

      isSoundActive = true;
    }

    function playStepImpact() {
      if (!isSoundActive || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.14);

      g.gain.setValueAtTime(0.16, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030610);
    scene.fog = new THREE.FogExp2(0x030610, 0.018);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(4, 4.5, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0x06b6d4, 0x0f172a, 0.6);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfffaed, 2.2);
    keyLight.position.set(15, 24, 18);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const cyanRim = new THREE.DirectionalLight(0x06b6d4, 1.8);
    cyanRim.position.set(-15, 15, -15);
    scene.add(cyanRim);

    const magentaRim = new THREE.DirectionalLight(0xec4899, 1.2);
    magentaRim.position.set(15, 8, -15);
    scene.add(magentaRim);

    const gridHelper = new THREE.GridHelper(100, 50, 0x06b6d4, 0x1e293b);
    scene.add(gridHelper);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x050914, roughness: 0.2, metalness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const creatureRoot = new THREE.Group();
    scene.add(creatureRoot);

    const exoMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.95, roughness: 0.15 });
    const sinewMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.5, roughness: 0.3, emissive: 0x083344, emissiveIntensity: 0.4 });
    const jointGold = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.2 });
    const eyeLaserMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });

    const pelvis = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.0, 1.5), exoMat);
    pelvis.position.y = 3.6;
    pelvis.castShadow = true;
    creatureRoot.add(pelvis);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.0, 1.9), exoMat);
    torso.position.set(0, 1.5, 0);
    torso.castShadow = true;
    pelvis.add(torso);

    const coreMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.25, 16), eyeLaserMat);
    coreMesh.rotation.x = Math.PI / 2;
    coreMesh.position.set(0, 0.3, 0.96);
    torso.add(coreMesh);

    const coreGlow = new THREE.PointLight(0x06b6d4, 4, 8);
    coreGlow.position.set(0, 0.3, 1.2);
    torso.add(coreGlow);

    const neck = new THREE.Group();
    neck.position.set(0, 1.4, 0.2);
    torso.add(neck);

    const head = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.9, 1.5), exoMat);
    head.position.set(0, 0.4, 0.3);
    head.castShadow = true;
    neck.add(head);

    const eyeStrip = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.18, 0.1), eyeLaserMat);
    eyeStrip.position.set(0, 0.1, 0.81);
    head.add(eyeStrip);

    function buildBioLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 1.0, -0.2, 0);

      const hipSphere = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), jointGold);
      hip.add(hipSphere);

      const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.7, 0.7), exoMat);
      thigh.position.y = -0.85;
      thigh.castShadow = true;
      hip.add(thigh);

      const knee = new THREE.Group();
      knee.position.set(0, -1.7, 0);
      const kneeRing = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.85, 12), jointGold);
      kneeRing.rotation.z = Math.PI / 2;
      knee.add(kneeRing);
      hip.add(knee);

      const shin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.7, 0.6), sinewMat);
      shin.position.y = -0.85;
      shin.castShadow = true;
      knee.add(shin);

      const ankle = new THREE.Group();
      ankle.position.set(0, -1.7, 0);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.35, 1.7), exoMat);
      foot.position.set(0, -0.18, 0.35);
      foot.castShadow = true;
      ankle.add(foot);
      knee.add(ankle);

      return { hip, knee, ankle };
    }

    function buildBioArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 1.6, 0.7, 0);

      const shoulderCap = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), jointGold);
      shoulder.add(shoulderCap);

      const bicep = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), exoMat);
      bicep.position.y = -0.7;
      bicep.castShadow = true;
      shoulder.add(bicep);

      const elbow = new THREE.Group();
      elbow.position.set(0, -1.4, 0);
      const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.48, 1.3, 0.48), sinewMat);
      forearm.position.y = -0.65;
      forearm.castShadow = true;
      elbow.add(forearm);
      shoulder.add(elbow);

      return { shoulder, elbow };
    }

    const leftLeg = buildBioLeg(-1);
    const rightLeg = buildBioLeg(1);
    pelvis.add(leftLeg.hip);
    pelvis.add(rightLeg.hip);

    const leftArm = buildBioArm(-1);
    const rightArm = buildBioArm(1);
    torso.add(leftArm.shoulder);
    torso.add(rightArm.shoulder);

    const startModal = document.getElementById('start-modal');
    startModal.onclick = () => {
      initAudio();
      startModal.classList.add('hidden');
    };

    let gaitIdx = 0;
    const btnGait = document.getElementById('btn-gait');
    btnGait.onclick = () => {
      gaitIdx = (gaitIdx + 1) % 3;
      const names = ['⚡ Gait: Predatory Stride', '⚡ Gait: High-Speed Sprint', '⚡ Gait: Heavy Prowl'];
      btnGait.textContent = names[gaitIdx];
    };

    let envIdx = 0;
    const btnEnv = document.getElementById('btn-env');
    btnEnv.onclick = () => {
      envIdx = (envIdx + 1) % 3;
      if (envIdx === 0) {
        scene.background.set(0x030610);
        scene.fog.color.set(0x030610);
        cyanRim.color.set(0x06b6d4);
        btnEnv.textContent = '🌐 Lab: Cyber Testing Grid';
      } else if (envIdx === 1) {
        scene.background.set(0x031c14);
        scene.fog.color.set(0x031c14);
        cyanRim.color.set(0x10b981);
        btnEnv.textContent = '🌿 Lab: Bioluminescent Jungle';
      } else {
        scene.background.set(0x1c070e);
        scene.fog.color.set(0x1c070e);
        cyanRim.color.set(0xf43f5e);
        btnEnv.textContent = '🌋 Lab: Obsidian Abyss';
      }
    };

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.onclick = () => {
      initAudio();
      isSoundActive = !isSoundActive;
      btnAudio.textContent = isSoundActive ? '🔊 Bio-Audio: Active' : '🔇 Bio-Audio: Muted';
    };

    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let sph = { r: 12, phi: Math.PI / 2.7, theta: 0.35 };
    let mouseNorm = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      initAudio();
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      mouseNorm.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNorm.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (!isDragging) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      sph.theta -= dx * 0.006;
      sph.phi = Math.max(0.1, Math.min(Math.PI / 2.05, sph.phi - dy * 0.006));
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('wheel', (e) => {
      sph.r = Math.max(4, Math.min(28, sph.r + e.deltaY * 0.012));
    });

    let gaitCycle = 0;
    let lastStep = 0;
    let lastStamp = performance.now();
    const cadenceTxt = document.getElementById('cadence-txt');

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastStamp) / 1000, 0.1);
      lastStamp = now;

      const gaitSpeed = gaitIdx === 1 ? 5.5 : (gaitIdx === 2 ? 2.4 : 3.8);
      gaitCycle += delta * gaitSpeed;
      cadenceTxt.textContent = Math.round(gaitSpeed * 32);

      const bob = Math.abs(Math.sin(gaitCycle * 2)) * 0.32;
      pelvis.position.y = 3.6 - bob;
      pelvis.rotation.y = Math.sin(gaitCycle) * 0.15;
      pelvis.rotation.z = Math.cos(gaitCycle) * 0.09;

      torso.rotation.y = -Math.sin(gaitCycle) * 0.12;
      torso.rotation.x = 0.14 + Math.sin(gaitCycle * 2) * 0.06;

      neck.rotation.y = THREE.MathUtils.lerp(neck.rotation.y, mouseNorm.x * 0.6, 0.1);
      neck.rotation.x = THREE.MathUtils.lerp(neck.rotation.x, -mouseNorm.y * 0.4, 0.1);

      const lSin = Math.sin(gaitCycle);
      const lThigh = lSin * 0.75;
      leftLeg.hip.rotation.x = lThigh;
      leftLeg.knee.rotation.x = lSin < 0 ? Math.abs(lSin) * 1.15 : 0.06;
      leftLeg.ankle.rotation.x = -leftLeg.hip.rotation.x - leftLeg.knee.rotation.x;

      const rSin = Math.sin(gaitCycle + Math.PI);
      const rThigh = rSin * 0.75;
      rightLeg.hip.rotation.x = rThigh;
      rightLeg.knee.rotation.x = rSin < 0 ? Math.abs(rSin) * 1.15 : 0.06;
      rightLeg.ankle.rotation.x = -rightLeg.hip.rotation.x - rightLeg.knee.rotation.x;

      const currentSign = Math.sign(lSin);
      if (currentSign !== lastStep && currentSign !== 0) {
        playStepImpact();
        lastStep = currentSign;
      }

      leftArm.shoulder.rotation.x = -lSin * 0.65;
      leftArm.elbow.rotation.x = -0.4 - Math.max(0, lSin) * 0.55;

      rightArm.shoulder.rotation.x = -rSin * 0.65;
      rightArm.elbow.rotation.x = -0.4 - Math.max(0, rSin) * 0.55;

      gridHelper.position.z = (gridHelper.position.z + delta * gaitSpeed * 2.2) % 2;

      camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
      camera.position.y = sph.r * Math.cos(sph.phi) + 2.5;
      camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
      camera.lookAt(0, 2.8, 0);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
