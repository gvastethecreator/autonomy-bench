<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apex Tactile — The Ultimate Satisfying Button</title>
  <style>
    :root {
      --bg-dark: #08090d;
      --bg-surface: #10121a;
      --bg-glass: rgba(22, 26, 38, 0.7);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent-rgb: 0, 242, 254;
      --accent: rgb(var(--accent-rgb));
      --accent-glow: rgba(var(--accent-rgb), 0.4);
      --text-main: #f1f5f9;
      --text-muted: #8e9bb0;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* Ambient Background Effects */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .bg-gradient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(8, 9, 13, 0) 70%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      transition: background 0.6s ease, opacity 0.3s ease, transform 0.1s ease-out;
      filter: blur(40px);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    /* App Layout */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Header & Badges */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff007a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-val {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .stat-val.accent {
      color: var(--accent);
    }

    /* Mode Navigation Bar */
    .mode-selector-wrapper {
      position: absolute;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px;
    }
    .mode-selector-wrapper::-webkit-scrollbar { display: none; }

    .mode-selector {
      display: flex;
      gap: 0.4rem;
      background: rgba(14, 17, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0.35rem;
      border-radius: 999px;
      border: 1px solid var(--border-glass);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .mode-btn.active {
      color: #000;
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .mode-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Main Center Button Stage */
    .stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1200px;
    }

    /* Tactile Stage Floor / Platform */
    .stage-pedestal {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 70%);
      border: 1px dashed rgba(255, 255, 255, 0.06);
      pointer-events: none;
      transform: rotateX(60deg) translateZ(-40px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
    }

    .pedestal-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), 0.15);
      animation: spinSlow 30s linear infinite;
    }
    .pedestal-ring.r1 { width: 340px; height: 340px; border-style: dotted; }
    .pedestal-ring.r2 { width: 260px; height: 260px; border-color: rgba(var(--accent-rgb), 0.25); }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 3D Button Chassis & Assembly */
    .button-rig {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 0.08s ease-out;
    }

    /* Safety Guard Cover for Nuclear Mode */
    .safety-cover-cage {
      position: absolute;
      width: 310px;
      height: 310px;
      z-index: 40;
      pointer-events: auto;
      transform-origin: 50% 10%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: none;
    }

    .safety-cover-cage.open {
      transform: rotateX(-115deg) translateY(-30px);
    }

    .safety-glass {
      width: 100%;
      height: 100%;
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(255, 50, 50, 0.2), rgba(20, 20, 20, 0.6));
      border: 3px solid rgba(255, 60, 60, 0.6);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.3), 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .safety-stripes {
      position: absolute;
      top: 10px;
      width: 80%;
      height: 16px;
      background: repeating-linear-gradient(45deg, #f59e0b, #f59e0b 10px, #111 10px, #111 20px);
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.5);
    }

    .safety-label {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #ff4757;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
      margin-top: 20px;
      text-align: center;
    }
    .safety-hint {
      font-size: 0.65rem;
      font-weight: 600;
      color: #f1f5f9;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* Core Button Outer Housing (Base) */
    .button-base {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 60px;
      background: #151821;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.9),
        0 10px 20px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(255, 255, 255, 0.15),
        inset 0 -8px 15px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dynamic LED Ring / Light Bezel */
    .led-bezel {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 52px;
      background: #0d0f14;
      box-shadow: 
        inset 0 3px 6px rgba(0, 0, 0, 0.9),
        0 0 0 2px rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .led-glow-ring {
      position: absolute;
      inset: -4px;
      border-radius: 54px;
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent), inset 0 0 15px var(--accent-glow);
      opacity: 0.5;
      transition: opacity 0.2s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* The Moving Plunger / Cap (Squash & Spring Element) */
    .button-cap {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 44px;
      background: linear-gradient(145deg, #242938, #181b26);
      box-shadow: 
        0 18px 25px -4px rgba(0, 0, 0, 0.7),
        0 8px 10px -4px rgba(0, 0, 0, 0.5),
        inset 0 2px 3px rgba(255, 255, 255, 0.35),
        inset 0 -4px 8px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transform: translateY(-16px) translateZ(20px);
      transition: transform 0.06s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.08s ease, background 0.4s ease;
      will-change: transform;
    }

    /* Button Surface Texture & Specular Highlight */
    .cap-specular {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 55%;
      border-radius: 44px 44px 100px 100px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    .cap-icon {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      filter: drop-shadow(0 0 10px var(--accent-glow));
      transition: all 0.3s ease;
      transform: translateZ(10px);
    }

    .cap-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .cap-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e2e8f0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      transform: translateZ(10px);
      transition: color 0.3s ease;
    }

    .charge-meter-bar {
      position: absolute;
      bottom: 14px;
      width: 70px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .charge-meter-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.05s linear;
    }

    /* Pressed Physical State */
    .button-rig.active .button-cap {
      transform: translateY(2px) translateZ(0px) scale(0.96);
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.8),
        inset 0 2px 4px rgba(0, 0, 0, 0.8),
        inset 0 -1px 2px rgba(255, 255, 255, 0.1);
    }

    .button-rig.active .led-glow-ring {
      opacity: 1;
      box-shadow: 0 0 40px var(--accent), inset 0 0 25px var(--accent);
    }

    .button-rig.active .cap-icon {
      transform: translateZ(5px) scale(0.92);
      filter: drop-shadow(0 0 20px var(--accent));
    }

    /* Spring Rebound Animation Class */
    .spring-release {
      animation: springJiggle 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes springJiggle {
      0% { transform: translateY(2px) scale(0.96); }
      35% { transform: translateY(-22px) scale(1.04, 0.96); }
      60% { transform: translateY(-13px) scale(0.98, 1.02); }
      80% { transform: translateY(-17px) scale(1.01, 0.99); }
      100% { transform: translateY(-16px) scale(1, 1); }
    }

    /* Distinct Mode Themes */
    /* Mode: Mechanical */
    .theme-mechanical {
      --accent-rgb: 0, 229, 255;
    }
    .theme-mechanical .button-base {
      border-radius: 36px;
      background: #1c202a;
    }
    .theme-mechanical .led-bezel {
      border-radius: 28px;
    }
    .theme-mechanical .button-cap {
      border-radius: 24px;
      background: linear-gradient(145deg, #2a3142, #181d28);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Mode: Cyber Reactor */
    .theme-reactor {
      --accent-rgb: 0, 255, 170;
    }
    .theme-reactor .button-base {
      border-radius: 50%;
      background: radial-gradient(circle, #10241b, #09120e);
      border: 2px solid rgba(0, 255, 170, 0.2);
    }
    .theme-reactor .led-bezel {
      border-radius: 50%;
    }
    .theme-reactor .button-cap {
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1d4334, #081710);
      border: 2px solid rgba(0, 255, 170, 0.4);
    }

    /* Mode: Jelly ASMR */
    .theme-jelly {
      --accent-rgb: 255, 0, 140;
    }
    .theme-jelly .button-base {
      border-radius: 50%;
      background: #1f0b18;
    }
    .theme-jelly .led-bezel {
      border-radius: 50%;
    }
    .theme-jelly .button-cap {
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff3b9a, #99004d);
      box-shadow: 
        0 18px 30px rgba(255, 0, 128, 0.3),
        inset 0 4px 12px rgba(255, 255, 255, 0.6),
        inset 0 -8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Mode: Nuclear */
    .theme-nuclear {
      --accent-rgb: 255, 42, 42;
    }
    .theme-nuclear .button-base {
      border-radius: 30px;
      background: #2b1111;
      border: 2px solid #5a1919;
    }
    .theme-nuclear .led-bezel {
      border-radius: 22px;
    }
    .theme-nuclear .button-cap {
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff3333, #990000);
      box-shadow: 
        0 20px 30px rgba(0,0,0,0.8),
        inset 0 3px 6px rgba(255, 255, 255, 0.4),
        inset 0 -6px 12px rgba(0, 0, 0, 0.8);
    }

    /* Mode: Prism Crystal */
    .theme-crystal {
      --accent-rgb: 216, 180, 254;
    }
    .theme-crystal .button-base {
      border-radius: 60px;
      background: #161224;
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .theme-crystal .led-bezel {
      border-radius: 52px;
    }
    .theme-crystal .button-cap {
      border-radius: 44px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(147, 51, 234, 0.2)), rgba(20, 15, 35, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 20px 40px rgba(147, 51, 234, 0.25),
        inset 0 0 25px rgba(255, 255, 255, 0.2);
    }

    /* Mode: Bubble Wrap Fidget */
    .theme-bubble {
      --accent-rgb: 56, 189, 248;
    }

    /* Mode: Marshmallow Cloud */
    .theme-cloud {
      --accent-rgb: 254, 215, 170;
    }
    .theme-cloud .button-base {
      border-radius: 70px;
      background: #25201b;
    }
    .theme-cloud .led-bezel {
      border-radius: 62px;
    }
    .theme-cloud .button-cap {
      border-radius: 54px;
      background: linear-gradient(145deg, #fff7ed, #fed7aa);
      box-shadow: 
        0 20px 30px rgba(0, 0, 0, 0.5),
        inset 0 4px 8px rgba(255, 255, 255, 0.9),
        inset 0 -6px 12px rgba(180, 120, 80, 0.3);
    }
    .theme-cloud .cap-label {
      color: #7c2d12;
    }
    .theme-cloud .cap-icon {
      color: #ea580c;
    }

    /* Floating Combo & Shockwave Text */
    .floating-feedback {
      position: absolute;
      pointer-events: none;
      font-family: var(--font-mono);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 12px var(--accent);
      z-index: 50;
      animation: floatUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.6);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -20px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -70px) scale(0.9);
      }
    }

    /* Bubble Matrix Mode Overlay */
    .bubble-matrix-stage {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      z-index: 30;
      pointer-events: auto;
    }

    .bubble-cell {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7);
      box-shadow: 
        0 6px 12px rgba(0, 0, 0, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.6),
        inset 0 -4px 8px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bubble-cell.popped {
      transform: scale(0.85);
      background: radial-gradient(circle at 50% 50%, #0369a1, #082f49);
      box-shadow: 
        inset 0 3px 6px rgba(0, 0, 0, 0.8),
        0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* Bottom Control Bar & Customization Dock */
    .bottom-dock {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 20;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .dock-btn.active-toggle {
      background: rgba(var(--accent-rgb), 0.2);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .dock-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Slider Controls */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .custom-slider {
      -webkit-appearance: none;
      width: 90px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;

          gain.connect(analyser);

          osc.start(now);
          osc.stop(now + 0.025);
        },

        // Cyber Core Plasma Laser / Overdrive Boom
        reactorBlast(chargeLevel = 1.0) {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          // 1. Sub Bass Detonation
          const sub = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          sub.type = 'sawtooth';
          sub.frequency.setValueAtTime(180 * (1 + chargeLevel), now);
          sub.frequency.exponentialRampToValueAtTime(30, now + 0.4);

          subGain.gain.setValueAtTime(0.8, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          const subFilter = audioCtx.createBiquadFilter();
          subFilter.type = 'lowpass';
          subFilter.frequency.setValueAtTime(800, now);
          subFilter.frequency.exponentialRampToValueAtTime(80, now + 0.4);

          sub.connect(subFilter);
          subFilter.connect(subGain);
          subGain.connect(analyser);

          sub.start(now);
          sub.stop(now + 0.45);

          // 2. High-Voltage Laser Zap
          const laser = audioCtx.createOscillator();
          const laserGain = audioCtx.createGain();
          laser.type = 'sawtooth';
          laser.frequency.setValueAtTime(3200, now);
          laser.frequency.exponentialRampToValueAtTime(150, now + 0.15);

          laserGain.gain.setValueAtTime(0.5, now);
          laserGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          laser.connect(laserGain);
          laserGain.connect(analyser);

          laser.start(now);
          laser.stop(now + 0.2);
        },

        // Organic Jelly / Slime ASMR Squelch
        jellySquish(pitchMod = 1.0) {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(450 * pitchMod, now);
          osc.frequency.exponentialRampToValueAtTime(850 * pitchMod, now + 0.04);
          osc.frequency.exponentialRampToValueAtTime(220 * pitchMod, now + 0.12);

          filter.type = 'bandpass';
          filter.Q.setValueAtTime(4.0, now);
          filter.frequency.setValueAtTime(700, now);
          filter.frequency.exponentialRampToValueAtTime(1800, now + 0.05);
          filter.frequency.exponentialRampToValueAtTime(300, now + 0.12);

          gain.gain.setValueAtTime(0.65, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(analyser);

          osc.start(now);
          osc.stop(now + 0.15);
        },

        // Industrial Nuclear Klaxon & Hydraulic Detonation
        nuclearDetonation() {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          // Hydraulic Clank + Heavy Bass Boom
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'square';
          osc1.frequency.setValueAtTime(90, now);
          osc1.frequency.exponentialRampToValueAtTime(25, now + 0.5);

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(350, now);

          gain1.gain.setValueAtTime(0.9, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          osc1.connect(filter);
          filter.connect(gain1);
          gain1.connect(analyser);

          osc1.start(now);
          osc1.stop(now + 0.6);

          // Pneumatic Air Hiss (Noise Buffer)
          const bufferSize = audioCtx.sampleRate * 0.15;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = 'bandpass';
          noiseFilter.frequency.setValueAtTime(1400, now);
          noiseFilter.Q.setValueAtTime(2.0, now);

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.setValueAtTime(0.4, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(analyser);

          noise.start(now);
          noise.stop(now + 0.16);
        },

        safetyCoverFlip() {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

          osc.connect(gain);
          gain.connect(analyser);

          osc.start(now);
          osc.stop(now + 0.1);
        },

        // Crystalline Harmonic Chimes (Pentatonic Scale Sequence)
        crystalChime(comboCount = 0) {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          // Pentatonic scale base frequencies
          const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
          const freq = scale[comboCount % scale.length];

          const osc = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2.76, now); // Metallic non-harmonic shimmer

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(analyser);

          osc.start(now);
          osc2.start(now);
          osc.stop(now + 0.65);
          osc2.stop(now + 0.65);
        },

        // Bubble Wrap Silicone Pop
        bubblePop(pitchMod = 1.0) {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime((600 + Math.random() * 300) * pitchMod, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.04);

          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          osc.connect(gain);
          gain.connect(analyser);

          osc.start(now);
          osc.stop(now + 0.06);
        },

        // Soft Marshmallow Cloud ASMR Puff
        cloudPuff() {
          if (!state.soundEnabled || !audioCtx) return;
          const now = audioCtx.currentTime;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260 + Math.random() * 60, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(analyser);

          osc.start(now);
          osc.stop(now + 0.14);
        }
      };

      // --- HAPTIC FEEDBACK (VIBRATION API) ---
      function triggerHaptics(pattern = 15) {
        if ('vibrate' in navigator) {
          try {
            navigator.vibrate(pattern);
          } catch (e) {}
        }
      }

      // --- 2D CANVAS PARTICLE & SHOCKWAVE SYSTEM ---
      const canvas = dom.ambientCanvas;
      const ctx = canvas.getContext('2d');
      let particles = [];
      let shockwaves = [];
      let screenShake = { x: 0, y: 0, trauma: 0 };

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor(x, y, color, type = 'spark') {
          this.x = x;
          this.y = y;
          this.color = color;
          this.type = type;
          this.life = 1.0;
          this.decay = (0.015 + Math.random() * 0.02) * (state.slowMo ? 0.25 : 1.0);

          const angle = Math.random() * Math.PI * 2;
          const speed = (2 + Math.random() * 9) * (state.slowMo ? 0.35 : 1.0);
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = (type === 'jelly' || type === 'cloud') ? (10 + Math.random() * 16) : (2 + Math.random() * 4);
          this.gravity = (type === 'spark' || type === 'jelly') ? 0.15 : -0.05;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += this.gravity * (state.slowMo ? 0.25 : 1.0);
          this.vx *= 0.96;
          this.vy *= 0.96;
          this.life -= this.decay;
        }

        draw(context) {
          context.save();
          context.globalAlpha = Math.max(0, this.life);

          if (this.type === 'spark') {
            context.fillStyle = this.color;
            context.shadowBlur = 10;
            context.shadowColor = this.color;
            context.beginPath();
            context.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
            context.fill();
          } else if (this.type === 'ring') {
            context.strokeStyle = this.color;
            context.lineWidth = 2;
            context.shadowBlur = 12;
            context.shadowColor = this.color;
            context.beginPath();
            context.arc(this.x, this.y, this.size * (2 - this.life), 0, Math.PI * 2);
            context.stroke();
          } else if (this.type === 'jelly') {
            context.fillStyle = this.color;
            context.shadowBlur = 15;
            context.shadowColor = this.color;
            context.beginPath();
            context.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
            context.fill();
          } else if (this.type === 'crystal') {
            context.fillStyle = '#ffffff';
            context.shadowBlur = 12;
            context.shadowColor = this.color;
            context.save();
            context.translate(this.x, this.y);
            context.rotate(this.life * 5);
            context.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            context.restore();
          } else if (this.type === 'cloud') {
            context.fillStyle = 'rgba(255, 245, 235, ' + (this.life * 0.7) + ')';
            context.shadowBlur = 20;
            context.shadowColor = this.color;
            context.beginPath();
            context.arc(this.x, this.y, this.size * (1.5 - this.life * 0.5), 0, Math.PI * 2);
            context.fill();
          }
          context.restore();
        }
      }

      class Shockwave {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.radius = 10;
          this.maxRadius = Math.min(window.innerWidth, window.innerHeight) * 0.45;
          this.life = 1.0;
          this.speed = 14 * (state.slowMo ? 0.25 : 1.0);
        }

        update() {
          this.radius += this.speed;
          this.life = 1 - (this.radius / this.maxRadius);
        }

        draw(context) {
          if (this.life <= 0) return;
          context.save();
          context.globalAlpha = Math.max(0, this.life * 0.6);
          context.lineWidth = 4 * this.life;
          context.strokeStyle = this.color;
          context.shadowBlur = 20;
          context.shadowColor = this.color;
          context.beginPath();
          context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          context.stroke();
          context.restore();
        }
      }

      function spawnParticles(x, y, countMultiplier = 1) {
        const count = Math.floor(16 * state.fxDensity * countMultiplier);
        const modeInfo = MODES[state.mode];
        const particleType = 
          state.mode === 'jelly' ? 'jelly' :
          state.mode === 'crystal' ? 'crystal' :
          state.mode === 'cloud' ? 'cloud' :
          state.mode === 'reactor' ? 'ring' : 'spark';

        for (let i = 0; i < count; i++) {
          particles.push(new Particle(x, y, modeInfo.accent, particleType));
        }
        shockwaves.push(new Shockwave(x, y, modeInfo.accent));

        // Screen Shake Trauma
        screenShake.trauma = Math.min(1.0, screenShake.trauma + 0.35 * countMultiplier);
      }

      function createFloatingText(x, y, text) {
        const span = document.createElement('div');
        span.className = 'floating-feedback';
        span.style.left = `${x}px`;
        span.style.top = `${y}px`;
        span.textContent = text;
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 700);
      }

      // --- RENDER LOOP (ANIMATION & OSCILLOSCOPE) ---
      function animate() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        // Apply Screen Shake
        if (screenShake.trauma > 0) {
          const shakeMag = Math.pow(screenShake.trauma, 2) * 16;
          screenShake.x = (Math.random() * 2 - 1) * shakeMag;
          screenShake.y = (Math.random() * 2 - 1) * shakeMag;
          screenShake.trauma = Math.max(0, screenShake.trauma - (state.slowMo ? 0.015 : 0.05));
          dom.buttonRig.style.transform = `translate(${screenShake.x}px, ${screenShake.y}px)`;
        } else {
          dom.buttonRig.style.transform = '';
        }

        // Draw Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          shockwaves[i].update();
          shockwaves[i].draw(ctx);
          if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
        }

        // Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw(ctx);
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        // Mini Audio Waveform Oscilloscope Render
        if (analyser && dom.audioViz) {
          const vizCtx = dom.audioViz.getContext('2d');
          vizCtx.clearRect(0, 0, dom.audioViz.width, dom.audioViz.height);
          analyser.getByteTimeDomainData(vizDataArray);

          vizCtx.lineWidth = 2;
          vizCtx.strokeStyle = MODES[state.mode].accent;
          vizCtx.beginPath();

          const sliceWidth = dom.audioViz.width * 1.0 / analyser.frequencyBinCount;
          let vx = 0;

          for (let i = 0; i < analyser.frequencyBinCount; i++) {
            const v = vizDataArray[i] / 128.0;
            const vy = v * (dom.audioViz.height / 2);

            if (i === 0) vizCtx.moveTo(vx, vy);
            else vizCtx.lineTo(vx, vy);

            vx += sliceWidth;
          }

          vizCtx.lineTo(dom.audioViz.width, dom.audioViz.height / 2);
          vizCtx.stroke();
        }

        // Handle Charge Meter Charging
        if (state.isCharging) {
          const elapsed = Date.now() - state.pressStartTime;
          state.charge = Math.min(1.0, elapsed / 1000);
          dom.chargeMeter.style.width = `${state.charge * 100}%`;
          state.force = (state.charge * 85 + 15).toFixed(1);
          dom.statForce.textContent = `${state.force} N`;

          if (state.charge > 0.3) {
            triggerHaptics(10);
          }
        }

        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      // --- STATS & COMBO TRACKING ---
      function updateStats() {
        const now = Date.now();
        state.recentClickTimestamps.push(now);
        state.recentClickTimestamps = state.recentClickTimestamps.filter(t => now - t <= 1000);
        state.cps = state.recentClickTimestamps.length;

        // Combo Multiplier
        if (now - state.lastClickTime < 600) {
          state.combo++;
        } else {
          state.combo = 1;
        }
        state.lastClickTime = now;

        state.clicks++;
        const multiplier = Math.min(10, Math.floor(state.combo / 4) + 1);
        const points = 10 * multiplier;
        state.score += points;

        dom.statClicks.textContent = state.clicks.toLocaleString();
        dom.statScore.textContent = state.score.toLocaleString();
        dom.statCps.textContent = `${state.cps.toFixed(1)} CPS`;

        return { points, multiplier };
      }

      // --- BUTTON ACTION TRIGGER (PRESS / RELEASE / CHARGE) ---
      function handleButtonDown(e) {
        if (e) e.preventDefault();
        ensureAudioUnlocked();

        // Nuclear Safety check
        if (state.mode === 'nuclear' && !state.nuclearCoverOpen) {
          SoundFX.safetyCoverFlip();
          return;
        }

        if (state.isPressed) return;
        state.isPressed = true;
        state.isCharging = true;
        state.pressStartTime = Date.now();
        state.charge = 0;

        dom.buttonRig.classList.add('active');
        dom.buttonCap.classList.remove('spring-release');

        // Play initial mechanical click contact
        if (state.mode === 'mechanical') {
          SoundFX.mechanicalPress();
          triggerHaptics(20);
        } else if (state.mode === 'jelly') {
          SoundFX.jellySquish();
          triggerHaptics(25);
        } else if (state.mode === 'bubble') {
          SoundFX.bubblePop();
          triggerHaptics(15);
        } else if (state.mode === 'cloud') {
          SoundFX.cloudPuff();
          triggerHaptics(10);
        }
      }

      function handleButtonUp(e) {
        if (!state.isPressed) return;
        state.isPressed = false;
        state.isCharging = false;
        dom.buttonRig.classList.remove('active');

        // Reset charge meter
        dom.chargeMeter.style.width = '0%';

        // Dynamic Spring Bounciness based on slider
        const bounciness = state.springBounciness;
        dom.buttonCap.classList.add('spring-release');
        dom.buttonCap.style.animationDuration = `${0.6 - (bounciness * 0.03)}s`;

        const rect = dom.buttonCap.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const { points, multiplier } = updateStats();

        // Mode Specific Audio & FX Detonation
        if (state.mode === 'mechanical') {
          SoundFX.mechanicalRelease();
          spawnParticles(centerX, centerY, 1.0);
        } else if (state.mode === 'reactor') {
          SoundFX.reactorBlast(state.charge);
          spawnParticles(centerX, centerY, 1.2 + state.charge * 2.0);
          triggerHaptics([40, 20, 60]);
        } else if (state.mode === 'jelly') {
          SoundFX.jellySquish(1.3);
          spawnParticles(centerX, centerY, 1.2);
        } else if (state.mode === 'nuclear') {
          SoundFX.nuclearDetonation();
          spawnParticles(centerX, centerY, 2.5);
          triggerHaptics([60, 30, 80]);
        } else if (state.mode === 'crystal') {
          SoundFX.crystalChime(state.combo);
          spawnParticles(centerX, centerY, 1.1);
        } else if (state.mode === 'bubble') {
          SoundFX.bubblePop(1.2);
          spawnParticles(centerX, centerY, 0.8);
        } else if (state.mode === 'cloud') {
          SoundFX.cloudPuff();
          spawnParticles(centerX, centerY, 0.9);
        }

        // Floating Combo / Score Text
        let feedbackStr = `+${points}`;
        if (multiplier > 1) feedbackStr = `COMBO x${multiplier} (+${points})`;
        if (state.charge > 0.8) feedbackStr = `MAX CHARGE! +${points * 3}`;
        createFloatingText(centerX, centerY - 20, feedbackStr);

        state.force = '0.0';
        dom.statForce.textContent = '0.0 N';
      }

      // --- SAFETY COVER (NUCLEAR MODE) ---
      dom.safetyCover.addEventListener('click', (e) => {
        e.stopPropagation();
        ensureAudioUnlocked();
        state.nuclearCoverOpen = !state.nuclearCoverOpen;
        SoundFX.safetyCoverFlip();
        if (state.nuclearCoverOpen) {
          dom.safetyCover.classList.add('open');
        } else {
          dom.safetyCover.classList.remove('open');
        }
      });

      // --- 3D PARALLAX & TILT ON HOVER ---
      dom.buttonRig.addEventListener('mousemove', (e) => {
        const rect = dom.buttonRig.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const tiltX = (y / (rect.height / 2)) * -12;
        const tiltY = (x / (rect.width / 2)) * 12;
        dom.buttonCap.style.transform = `translateY(-16px) translateZ(20px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      });

      dom.buttonRig.addEventListener('mouseleave', () => {
        if (!state.isPressed) {
          dom.buttonCap.style.transform = 'translateY(-16px) translateZ(20px) rotateX(0deg) rotateY(0deg)';
        }
      });

      // Pointer / Touch Events on Button Rig
      dom.buttonRig.addEventListener('pointerdown', handleButtonDown);
      window.addEventListener('pointerup', handleButtonUp);
      window.addEventListener('pointercancel', handleButtonUp);

      // --- POP-IT BUBBLE MATRIX MODE ---
      function initBubbleMatrix() {
        dom.bubbleMatrix.innerHTML = '';
        for (let i = 0; i < 16; i++) {
          const bubble = document.createElement('div');
          bubble.className = 'bubble-cell';
          bubble.dataset.index = i;
          bubble.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            ensureAudioUnlocked();
            const isPopped = bubble.classList.toggle('popped');
            SoundFX.bubblePop(isPopped ? 1.0 + (i * 0.05) : 0.8);
            triggerHaptics(12);
            const rect = bubble.getBoundingClientRect();
            spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, 0.4);
            updateStats();
            createFloatingText(rect.left + rect.width/2, rect.top, '+10');
          });
          dom.bubbleMatrix.appendChild(bubble);
        }
      }
      initBubbleMatrix();

      // --- MODE SWITCHING SYSTEM ---
      function setMode(modeKey) {
        if (!MODES[modeKey]) return;
        state.mode = modeKey;
        const modeInfo = MODES[modeKey];

        // Update Theme Classes
        document.body.className = modeInfo.themeClass;
        dom.modeName.textContent = modeInfo.name;
        dom.capLabel.textContent = modeInfo.label;
        dom.capIcon.innerHTML = modeInfo.iconSvg;
        dom.bgGlow.style.background = `radial-gradient(circle, ${modeInfo.glow} 0%, rgba(8, 9, 13, 0) 70%)`;

        // Update active nav button
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === modeKey);
        });

        // Nuclear Safety Cover visibility
        if (modeKey === 'nuclear') {
          dom.safetyCover.style.display = 'block';
          state.nuclearCoverOpen = false;
          dom.safetyCover.classList.remove('open');
        } else {
          dom.safetyCover.style.display = 'none';
        }

        // Bubble Matrix Stage vs Main Button
        if (modeKey === 'bubble') {
          dom.bubbleMatrix.style.display = 'grid';
          dom.buttonRig.style.display = 'none';
        } else {
          dom.bubbleMatrix.style.display = 'none';
          dom.buttonRig.style.display = 'flex';
        }
      }

      // Mode Selector Click Handlers
      dom.modeSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('.mode-btn');
        if (btn && btn.dataset.mode) {
          ensureAudioUnlocked();
          setMode(btn.dataset.mode);
        }
      });

      // --- DOCK CONTROLS (AUDIO, SLIDERS, AUTOTAP, SLOWMO) ---
      dom.btnSound.addEventListener('click', () => {
        ensureAudioUnlocked();
        state.soundEnabled = !state.soundEnabled;
        dom.btnSound.classList.toggle('active-toggle', state.soundEnabled);
        dom.soundText.textContent = state.soundEnabled ? 'Audio HD' : 'Muted';
      });
      dom.btnSound.classList.add('active-toggle');

      dom.sliderSpring.addEventListener('input', (e) => {
        state.springBounciness = parseInt(e.target.value, 10);
      });

      dom.sliderFx.addEventListener('input', (e) => {
        state.fxDensity = parseInt(e.target.value, 10);
      });

      // Slow-Mo Toggle
      dom.btnSlowmo.addEventListener('click', () => {
        state.slowMo = !state.slowMo;
        dom.btnSlowmo.classList.toggle('active-toggle', state.slowMo);
        createFloatingText(window.innerWidth / 2, window.innerHeight / 2, state.slowMo ? 'TIME-WARP: 0.25x' : 'REALTIME: 1.0x');
      });

      // ASMR Auto-Tapper
      dom.btnAutotap.addEventListener('click', () => {
        ensureAudioUnlocked();
        state.autoTap = !state.autoTap;
        dom.btnAutotap.classList.toggle('active-toggle', state.autoTap);

        if (state.autoTap) {
          if (state.mode === 'nuclear' && !state.nuclearCoverOpen) {
            state.nuclearCoverOpen = true;
            dom.safetyCover.classList.add('open');
          }
          state.autoTapInterval = setInterval(() => {
            if (state.mode === 'bubble') {
              const bubbles = dom.bubbleMatrix.querySelectorAll('.bubble-cell');
              const randomBubble = bubbles[Math.floor(Math.random() * bubbles.length)];
              randomBubble.dispatchEvent(new PointerEvent('pointerdown'));
            } else {
              handleButtonDown();
              setTimeout(handleButtonUp, 90);
            }
          }, 240);
        } else {
          clearInterval(state.autoTapInterval);
        }
      });

      // Reset Stats
      dom.btnReset.addEventListener('click', () => {
        state.clicks = 0;
        state.score = 0;
        state.combo = 0;
        state.cps = 0;
        dom.statClicks.textContent = '0';
        dom.statScore.textContent = '0';
        dom.statCps.textContent = '0.0 CPS';
        createFloatingText(window.innerWidth / 2, window.innerHeight / 2, 'STATS RESET');
      });

      // --- KEYBOARD SHORTCUTS ---
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        ensureAudioUnlocked();

        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          if (state.mode === 'nuclear' && !state.nuclearCoverOpen) {
            state.nuclearCoverOpen = true;
            dom.safetyCover.classList.add('open');
            SoundFX.safetyCoverFlip();
          } else {
            handleButtonDown();
          }
        } else if (e.key >= '1' && e.key <= '7') {
          const keys = Object.keys(MODES);
          const index = parseInt(e.key, 10) - 1;
          if (keys[index]) setMode(keys[index]);
        } else if (e.code === 'KeyS') {
          dom.btnSlowmo.click();
        } else if (e.code === 'KeyA') {
          dom.btnAutotap.click();
        } else if (e.code === 'KeyM') {
          dom.btnSound.click();
        } else if (e.code === 'KeyR') {
          dom.btnReset.click();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          handleButtonUp();
        }
      });

    })();
  </script>
</body>
</html>
