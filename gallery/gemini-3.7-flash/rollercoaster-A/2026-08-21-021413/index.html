<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-Person Rollercoaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; }
    canvas { display: block; width: 100%; height: 100%; }
    #info {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="info">Rollercoaster — First-Person Continuous Ride</div>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Sunlight & Ambient
    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.3);
    sun.position.set(100, 150, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // Ground Plane with hills
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(800, 800),
      new THREE.MeshLambertMaterial({ color: 0x438a2e })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Rollercoaster Track Spline
    const trackPoints = [
      new THREE.Vector3(0, 10, 0),
      new THREE.Vector3(20, 25, 30),
      new THREE.Vector3(50, 60, 60),
      new THREE.Vector3(80, 12, 90),
      new THREE.Vector3(100, 35, 60),
      new THREE.Vector3(80, 50, 0),
      new THREE.Vector3(40, 65, -50),
      new THREE.Vector3(0, 20, -80),
      new THREE.Vector3(-40, 45, -60),
      new THREE.Vector3(-70, 25, -10),
      new THREE.Vector3(-50, 10, 20),
      new THREE.Vector3(-20, 8, 10)
    ];

    const curve = new THREE.CatmullRomCurve3(trackPoints, true);
    const segments = 500;
    const gauge = 1.0;

    const leftRailPoints = [];
    const rightRailPoints = [];
    const tiesGroup = new THREE.Group();
    const pillarsGroup = new THREE.Group();

    const tieMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
    const pillarMat = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });

    for (let i = 0; i <= segments; i++) {
      const u = i / segments;
      const pt = curve.getPointAt(u);
      const tangent = curve.getTangentAt(u).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      const binormal = new THREE.Vector3().crossVectors(normal, tangent).normalize();

      leftRailPoints.push(pt.clone().add(normal.clone().multiplyScalar(-gauge)));
      rightRailPoints.push(pt.clone().add(normal.clone().multiplyScalar(gauge)));

      // Cross ties
      if (i % 2 === 0) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(gauge * 2.4, 0.18, 0.35), tieMat);
        tie.position.copy(pt);
        tie.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(normal, binormal, tangent));
        tiesGroup.add(tie);
      }

      // Vertical support pillars
      if (i % 12 === 0 && pt.y > 1) {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, pt.y, 8), pillarMat);
        pillar.position.set(pt.x, pt.y / 2, pt.z);
        pillarsGroup.add(pillar);
      }
    }

    scene.add(tiesGroup);
    scene.add(pillarsGroup);

    const railMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.5, roughness: 0.3 });
    const leftCurve = new THREE.CatmullRomCurve3(leftRailPoints, true);
    const rightCurve = new THREE.CatmullRomCurve3(rightRailPoints, true);

    const leftRail = new THREE.Mesh(new THREE.TubeGeometry(leftCurve, segments, 0.12, 8, true), railMat);
    const rightRail = new THREE.Mesh(new THREE.TubeGeometry(rightCurve, segments, 0.12, 8, true), railMat);
    scene.add(leftRail);
    scene.add(rightRail);

    // Decorative surrounding trees
    const treeTrunkMat = new THREE.MeshLambertMaterial({ color: 0x654321 });
    const treeFoliageMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });

    for (let t = 0; t < 60; t++) {
      const tx = (Math.random() - 0.5) * 300;
      const tz = (Math.random() - 0.5) * 300;
      if (Math.hypot(tx, tz) > 25) {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), treeTrunkMat);
        trunk.position.set(tx, 1.5, tz);
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 6), treeFoliageMat);
        leaves.position.set(tx, 5.5, tz);
        scene.add(trunk);
        scene.add(leaves);
      }
    }

    // Animation Loop
    let progress = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Speed adjusts based on elevation
      const pos = curve.getPointAt(progress);
      const speed = Math.max(0.015, 0.045 * (1.1 - pos.y / 80));
      progress = (progress + delta * speed) % 1;

      const currentPos = curve.getPointAt(progress);
      const lookPos = curve.getPointAt((progress + 0.005) % 1);

      camera.position.copy(currentPos).add(new THREE.Vector3(0, 1.1, 0));
      camera.lookAt(lookPos.clone().add(new THREE.Vector3(0, 1.1, 0)));

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
