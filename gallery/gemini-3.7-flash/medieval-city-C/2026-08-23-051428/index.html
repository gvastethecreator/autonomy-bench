<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citadel of Valenheim — Living Medieval World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1222; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }

    .glass-box {
      background: rgba(12, 18, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px 22px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .citadel-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .crest {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #d97706, #b45309, #78350f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(217, 119, 6, 0.4);
    }

    .town-stats {
      display: flex;
      gap: 14px;
    }
    .stat-pill {
      text-align: right;
      min-width: 100px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #f59e0b;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .bottom-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .ctrl-strip {
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }

    .btn-gold {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-gold:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
    }

    .start-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 28px 44px;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 25;
      transition: all 0.4s ease;
    }
    .start-prompt.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -40%);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud-layer">
    <div class="top-header">
      <div class="glass-box citadel-brand">
        <div class="crest">👑</div>
        <div>
          <div style="font-size: 16px; font-weight: 800; letter-spacing: 0.06em;">VALENHEIM CITADEL</div>
          <div style="font-size: 11px; color: #f59e0b; font-weight: 600;">LIVING PROCEDURAL REALM • ANNO 1284</div>
        </div>
      </div>

      <div class="town-stats">
        <div class="glass-box stat-pill">
          <div class="stat-label">Citizens</div>
          <div class="stat-val">64</div>
        </div>
        <div class="glass-box stat-pill">
          <div class="stat-label">District</div>
          <div class="stat-val" style="font-size: 18px; line-height: 1.4;">Cathedral Hill</div>
        </div>
        <div class="glass-box stat-pill">
          <div class="stat-label">Atmosphere</div>
          <div class="stat-val" id="atmo-val" style="font-size: 18px; line-height: 1.4;">Golden Sun</div>
        </div>
      </div>
    </div>

    <div class="bottom-footer">
      <div class="ctrl-strip glass-box">
        <button id="btn-audio" class="btn-gold">🎵 Lute Melody: Active</button>
        <button id="btn-cam" class="btn-gold">🎥 Tour: Flyover</button>
        <button id="btn-season" class="btn-gold">🍂 Season: Summer</button>
        <button id="btn-regen" class="btn-gold">🎲 Seed Realm</button>
      </div>

      <div class="glass-box" style="font-size: 12px; color: #94a3b8;">
        Click & Drag to rotate • Scroll to zoom • Enjoy the living town
      </div>
    </div>
  </div>

  <div id="start-screen" class="start-prompt glass-box">
    <div style="font-size: 36px; margin-bottom: 8px;">⚔️</div>
    <div style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">ENTER VALENHEIM</div>
    <div style="font-size: 13px; color: #94a3b8;">Click to experience medieval audio ambience & living simulation</div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Medieval Audio Synthesizer
    let audioCtx = null;
    let luteGain = null;
    let waterGain = null;
    let isAudioActive = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      luteGain = audioCtx.createGain();
      luteGain.gain.value = 0.08;
      luteGain.connect(audioCtx.destination);

      const bSize = audioCtx.sampleRate * 2;
      const rBuff = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
      const data = rBuff.getChannelData(0);
      for (let i = 0; i < bSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;

      const waterSrc = audioCtx.createBufferSource();
      waterSrc.buffer = rBuff;
      waterSrc.loop = true;

      const waterFilter = audioCtx.createBiquadFilter();
      waterFilter.type = 'bandpass';
      waterFilter.frequency.value = 800;
      waterFilter.Q.value = 1.0;

      waterGain = audioCtx.createGain();
      waterGain.gain.value = 0.04;

      waterSrc.connect(waterFilter);
      waterFilter.connect(waterGain);
      waterGain.connect(audioCtx.destination);
      waterSrc.start();

      const scale = [220.00, 246.94, 277.18, 329.63, 369.99, 440.00, 493.88];
      function stepLute() {
        if (!isAudioActive || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = scale[Math.floor(Math.random() * scale.length)];

        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);

        osc.connect(g);
        g.connect(luteGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);

        setTimeout(stepLute, 500 + Math.random() * 900);
      }
      stepLute();
      isAudioActive = true;
    }

    // 3D Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfde047);
    scene.fog = new THREE.FogExp2(0xfde047, 0.0035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffedd5, 0x1e293b, 0.65);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff7ed, 1.8);
    sun.position.set(120, 180, 90);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 20;
    sun.shadow.camera.far = 500;
    sun.shadow.camera.left = -160;
    sun.shadow.camera.right = 160;
    sun.shadow.camera.top = 160;
    sun.shadow.camera.bottom = -160;
    scene.add(sun);

    let citizens = [];
    let windmills = [];
    let smokeArray = [];
    let boats = [];
    let banners = [];
    let cityMaster = new THREE.Group();
    scene.add(cityMaster);

    const terrainGeo = new THREE.PlaneGeometry(800, 800, 80, 80);
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      let z = Math.sin(x * 0.01) * Math.cos(y * 0.01) * 8;
      const dCastle = Math.hypot(x + 40, y + 40);
      if (dCastle < 80) z += (80 - dCastle) * 0.35;
      if (x > 100) z -= 8;
      pos.setZ(i, z);
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({ color: 0x365314, roughness: 0.9 });
    const ground = new THREE.Mesh(terrainGeo, terrainMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(280, 800),
      new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.8 })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(240, -1.2, 0);
    scene.add(water);

    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.85, metalness: 0.1 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 });
    const plasterMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.9 });
    const slateRoof = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
    const clayRoof = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.5 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 });

    function generateCitadel() {
      while (cityMaster.children.length > 0) {
        cityMaster.remove(cityMaster.children[0]);
      }
      citizens = [];
      windmills = [];
      smokeArray = [];
      boats = [];
      banners = [];

      const castleGroup = new THREE.Group();
      const keepBody = new THREE.Mesh(new THREE.BoxGeometry(26, 32, 28), stoneMat);
      keepBody.position.set(-40, 32, -40);
      keepBody.castShadow = keepBody.receiveShadow = true;
      castleGroup.add(keepBody);

      const highSpire = new THREE.Mesh(new THREE.ConeGeometry(12, 24, 8), slateRoof);
      highSpire.position.set(-40, 60, -40);
      highSpire.castShadow = true;
      castleGroup.add(highSpire);

      const cathGroup = new THREE.Group();
      const nave = new THREE.Mesh(new THREE.BoxGeometry(18, 22, 40), stoneMat);
      nave.position.set(20, 11, -30);
      nave.castShadow = true;
      cathGroup.add(nave);

      const cathSpire = new THREE.Mesh(new THREE.ConeGeometry(8, 26, 8), goldMat);
      cathSpire.position.set(20, 35, -45);
      cathSpire.castShadow = true;
      cathGroup.add(cathSpire);
      cityMaster.add(cathGroup);

      const wallR = 95;
      const numTowers = 12;
      for (let i = 0; i < numTowers; i++) {
        const ang = (i / numTowers) * Math.PI * 2;
        const x = Math.cos(ang) * wallR - 10;
        const z = Math.sin(ang) * wallR - 10;

        if (x < 110) {
          const tw = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 4.2, 18, 12), stoneMat);
          tw.position.set(x, 9, z);
          tw.castShadow = tw.receiveShadow = true;
          cityMaster.add(tw);

          const twCap = new THREE.Mesh(new THREE.ConeGeometry(4.5, 6, 12), slateRoof);
          twCap.position.set(x, 21, z);
          twCap.castShadow = true;
          cityMaster.add(twCap);

          const banner = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 3.5), new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide }));
          banner.position.set(x, 24, z);
          cityMaster.add(banner);
          banners.push(banner);
        }
      }

      for (let d = -60; d <= 60; d += 40) {
        const pier = new THREE.Mesh(new THREE.BoxGeometry(50, 1, 6), woodMat);
        pier.position.set(130, 0.4, d);
        pier.castShadow = true;
        cityMaster.add(pier);

        const boat = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 16), woodMat);
        hull.position.y = 0.5;
        boat.add(hull);

        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 14, 8), woodMat);
        mast.position.set(0, 7, 0);
        boat.add(mast);

        const sail = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), new THREE.MeshLambertMaterial({ color: 0xf8fafc, side: THREE.DoubleSide }));
        sail.position.set(0, 8, 0.2);
        boat.add(sail);

        boat.position.set(165, 0, d + 8);
        cityMaster.add(boat);
        boats.push({ mesh: boat, baseY: d + 8 });
      }

      for (let r = -8; r <= 8; r++) {
        for (let c = -8; c <= 8; c++) {
          const x = c * 10 + (Math.random() - 0.5) * 2;
          const z = r * 10 + (Math.random() - 0.5) * 2;
          const dist = Math.hypot(x + 10, z + 10);

          if (dist > 22 && dist < wallR - 10 && x < 95) {
            const house = new THREE.Group();
            const w = 5 + Math.random() * 2.5;
            const d = 5 + Math.random() * 2.5;
            const h = 5.5 + Math.random() * 3.5;

            const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), plasterMat);
            bldg.position.y = h / 2;
            bldg.castShadow = bldg.receiveShadow = true;
            house.add(bldg);

            const rf = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.85, 3.8, 4), Math.random() > 0.5 ? clayRoof : slateRoof);
            rf.position.y = h + 1.9;
            rf.rotation.y = Math.PI / 4;
            rf.castShadow = true;
            house.add(rf);

            const chim = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), stoneMat);
            chim.position.set(w * 0.25, h + 2.2, d * 0.25);
            house.add(chim);

            const sm = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.5 }));
            sm.position.set(chim.position.x, chim.position.y + 1.5, chim.position.z);
            house.add(sm);
            smokeArray.push({ mesh: sm, startY: chim.position.y + 1.5 });

            house.position.set(x, 0, z);
            house.rotation.y = (Math.random() - 0.5) * 0.5;
            cityMaster.add(house);
          }
        }
      }

      for (let p of [[-100, -80], [-80, 80]]) {
        const wm = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 5, 16, 10), stoneMat);
        base.position.y = 8;
        wm.add(base);

        const cap = new THREE.Mesh(new THREE.ConeGeometry(4, 4, 10), slateRoof);
        cap.position.y = 18;
        wm.add(cap);

        const bl = new THREE.Group();
        bl.position.set(0, 15, 3.8);
        for (let b = 0; b < 4; b++) {
          const blade = new THREE.Mesh(new THREE.BoxGeometry(1.4, 11, 0.1), woodMat);
          blade.rotation.z = (b * Math.PI) / 2;
          blade.position.y = Math.sin((b * Math.PI) / 2) * 5.5;
          blade.position.x = Math.cos((b * Math.PI) / 2) * 5.5;
          bl.add(blade);
        }
        wm.add(bl);
        wm.position.set(p[0], 0, p[1]);
        cityMaster.add(wm);
        windmills.push(bl);
      }

      const villagerColors = [0x2563eb, 0xd97706, 0x16a34a, 0x9333ea, 0xdc2626];
      for (let i = 0; i < 64; i++) {
        const npc = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8), new THREE.MeshLambertMaterial({ color: villagerColors[i % villagerColors.length] }));
        body.position.y = 0.6;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), new THREE.MeshLambertMaterial({ color: 0xfcd34d }));
        head.position.y = 1.4;
        npc.add(body);
        npc.add(head);

        const ang = Math.random() * Math.PI * 2;
        const dist = 10 + Math.random() * 65;
        npc.position.set(Math.cos(ang) * dist - 10, 0, Math.sin(ang) * dist - 10);
        cityMaster.add(npc);

        citizens.push({
          group: npc,
          ang,
          dist,
          speed: 0.2 + Math.random() * 0.4,
          bob: Math.random() * 10
        });
      }

      cityMaster.add(castleGroup);
    }

    generateCitadel();

    const startScreen = document.getElementById('start-screen');
    startScreen.onclick = () => {
      initAudio();
      startScreen.classList.add('hidden');
    };

    const atmoVal = document.getElementById('atmo-val');
    let seasonIdx = 0;
    const btnSeason = document.getElementById('btn-season');
    btnSeason.onclick = () => {
      seasonIdx = (seasonIdx + 1) % 3;
      if (seasonIdx === 0) {
        scene.background.set(0xfde047);
        scene.fog.color.set(0xfde047);
        sun.color.set(0xfff7ed);
        terrainMat.color.set(0x365314);
        btnSeason.textContent = '🍂 Season: Summer';
        atmoVal.textContent = 'Golden Sun';
      } else if (seasonIdx === 1) {
        scene.background.set(0xfb923c);
        scene.fog.color.set(0xfb923c);
        sun.color.set(0xfed7aa);
        terrainMat.color.set(0x78350f);
        btnSeason.textContent = '🍂 Season: Autumn';
        atmoVal.textContent = 'Amber Harvest';
      } else {
        scene.background.set(0x93c5fd);
        scene.fog.color.set(0x93c5fd);
        sun.color.set(0xe0f2fe);
        terrainMat.color.set(0xf8fafc);
        btnSeason.textContent = '❄️ Season: Winter';
        atmoVal.textContent = 'Winter Frost';
      }
    };

    let camMode = 'flyover';
    const btnCam = document.getElementById('btn-cam');
    btnCam.onclick = () => {
      camMode = camMode === 'flyover' ? 'walk' : 'flyover';
      btnCam.textContent = camMode === 'flyover' ? '🎥 Tour: Flyover' : '🎥 Tour: Street Walk';
    };

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.onclick = () => {
      initAudio();
      isAudioActive = !isAudioActive;
      btnAudio.textContent = isAudioActive ? '🎵 Lute Melody: Active' : '🔇 Audio: Muted';
    };

    document.getElementById('btn-regen').onclick = () => { generateCitadel(); };

    let isMouseDown = false;
    let prevMouse = { x: 0, y: 0 };
    let sph = { r: 180, phi: Math.PI / 3.4, theta: Math.PI / 4 };

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      sph.theta -= dx * 0.005;
      sph.phi = Math.max(0.2, Math.min(Math.PI / 2.1, sph.phi - dy * 0.005));
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('wheel', (e) => {
      sph.r = Math.max(50, Math.min(320, sph.r + e.deltaY * 0.15));
    });

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (!isMouseDown && camMode === 'flyover') {
        sph.theta += 0.035 * delta;
      }

      if (camMode === 'flyover') {
        camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
        camera.position.y = sph.r * Math.cos(sph.phi);
        camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
        camera.lookAt(-10, 12, -10);
      } else {
        const t = now * 0.00035;
        camera.position.set(Math.cos(t) * 45 - 10, 3.8, Math.sin(t) * 45 - 10);
        camera.lookAt(Math.cos(t + 0.1) * 45 - 10, 5.0, Math.sin(t + 0.1) * 45 - 10);
      }

      for (const w of windmills) w.rotation.z += 1.4 * delta;

      for (let i = 0; i < boats.length; i++) {
        const b = boats[i];
        b.mesh.position.y = Math.sin(now * 0.002 + i) * 0.3;
        b.mesh.rotation.z = Math.sin(now * 0.0015 + i) * 0.05;
      }

      for (let i = 0; i < banners.length; i++) {
        banners[i].rotation.y = Math.sin(now * 0.003 + i) * 0.4;
      }

      for (const npc of citizens) {
        npc.ang += (npc.speed / npc.dist) * delta * 4;
        npc.group.position.x = Math.cos(npc.ang) * npc.dist - 10;
        npc.group.position.z = Math.sin(npc.ang) * npc.dist - 10;
        npc.group.rotation.y = -npc.ang - Math.PI / 2;
        npc.bob += delta * 8;
        npc.group.position.y = Math.abs(Math.sin(npc.bob)) * 0.14;
      }

      for (const s of smokeArray) {
        s.mesh.position.y += 0.9 * delta;
        s.mesh.scale.setScalar(1 + (s.mesh.position.y - s.startY) * 0.6);
        if (s.mesh.position.y > s.startY + 4) {
          s.mesh.position.y = s.startY;
          s.mesh.scale.setScalar(1);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
