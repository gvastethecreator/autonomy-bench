<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISO PASS · Night Rain Showcase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #010408; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    
    #cinematic-bars {
      position: absolute; inset: 0; pointer-events: none;
      border-top: 16px solid rgba(2, 6, 12, 0.8);
      border-bottom: 16px solid rgba(2, 6, 12, 0.8);
      z-index: 5;
    }

    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(1, 4, 8, 0.7) 100%);
      z-index: 6;
    }

    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 32px 36px;
    }

    .glass {
      background: rgba(6, 12, 24, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px;
      padding: 12px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); pointer-events: auto;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .title-area h1 {
      font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .title-area p { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }

    .telemetry { display: flex; gap: 20px; }
    .stat-box { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-val { font-size: 26px; font-weight: 800; font-family: monospace; color: #38bdf8; line-height: 1; }
    .stat-lbl { font-size: 9px; text-transform: uppercase; color: #64748b; margin-top: 3px; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
    .btn-group { display: flex; gap: 8px; }
    .action-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(56, 189, 248, 0.25);
      color: #e2e8f0; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
    .action-btn.active { background: rgba(56, 189, 248, 0.35); border-color: #38bdf8; color: #fff; }

    #start-screen {
      position: absolute; inset: 0; background: rgba(1, 4, 8, 0.85); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; cursor: pointer;
    }
    .start-card {
      background: rgba(8, 16, 32, 0.9); border: 1px solid #38bdf8; border-radius: 16px;
      padding: 30px 45px; text-align: center; box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
    }
    .start-card h2 { font-size: 22px; color: #38bdf8; margin-bottom: 8px; letter-spacing: 2px; }
    .start-card p { font-size: 13px; color: #94a3b8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="cinematic-bars"></div>
  <div id="vignette"></div>

  <div id="start-screen" onclick="initExperience()">
    <div class="start-card">
      <h2>KISO PASS EXPEDITION</h2>
      <p>Click anywhere to start rain soundscape & cinematic drive</p>
    </div>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="glass title-area">
        <h1>KISO PASS · TOUGE</h1>
        <p>Showcase Night Driving Experience</p>
      </div>

      <div class="glass telemetry">
        <div class="stat-box">
          <div class="stat-val" id="spdVal">0</div>
          <div class="stat-lbl">Speed (KM/H)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color: #a855f7;" id="altVal">1,240</div>
          <div class="stat-lbl">Altitude (M)</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="glass btn-group">
        <button class="action-btn active" id="btnCam" onclick="cycleCamera()">🎥 Camera: <span id="camText">Cockpit 1P</span></button>
        <button class="action-btn" id="btnRain" onclick="toggleWipers()">🌧️ Wipers: <span id="wiperText">AUTO</span></button>
        <button class="action-btn" id="btnAudio" onclick="toggleAudio()">🔊 Audio: <span id="audioText">ON</span></button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* Procedural Rain Sound & Engine */
    let actx = null, expInit = false, muted = false;
    let engineOsc = null, engineGain = null, rainGain = null;

    function initExperience() {
      if (expInit) return;
      expInit = true;
      document.getElementById('start-screen').style.display = 'none';

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();

        // 1. Engine Rumbling
        engineOsc = actx.createOscillator();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 50;
        const eFilt = actx.createBiquadFilter();
        eFilt.type = 'lowpass'; eFilt.frequency.value = 220;
        engineGain = actx.createGain(); engineGain.gain.value = 0.04;
        engineOsc.connect(eFilt); eFilt.connect(engineGain); engineGain.connect(actx.destination);
        engineOsc.start();

        // 2. Continuous Rain Noise
        const bSize = actx.sampleRate * 2;
        const nBuf = actx.createBuffer(1, bSize, actx.sampleRate);
        const out = nBuf.getChannelData(0);
        for (let i = 0; i < bSize; i++) out[i] = (Math.random() * 2 - 1) * 0.3;
        const noise = actx.createBufferSource();
        noise.buffer = nBuf; noise.loop = true;
        const rFilter = actx.createBiquadFilter();
        rFilter.type = 'bandpass'; rFilter.frequency.value = 1200;
        rainGain = actx.createGain(); rainGain.gain.value = 0.035;
        noise.connect(rFilter); rFilter.connect(rainGain); rainGain.connect(actx.destination);
        noise.start();
      } catch (e) {}
    }

    function toggleAudio() {
      muted = !muted;
      document.getElementById('audioText').textContent = muted ? "OFF" : "ON";
      if (engineGain && rainGain) {
        engineGain.gain.value = muted ? 0 : 0.04;
        rainGain.gain.value = muted ? 0 : 0.035;
      }
    }

    /* Three.js Environment */
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010408, 0.0032);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    scene.add(new THREE.AmbientLight(0x0c192e, 0.8));

    const moonLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    moonLight.position.set(100, 300, 100);
    scene.add(moonLight);

    // Wet Reflective Mountain Road
    const ROAD_W = 16, ROAD_L = 1000, NUM_SEGMENTS = 50, SEG_L = 20;
    const roadSegments = [];

    const asphaltGeo = new THREE.PlaneGeometry(ROAD_W, SEG_L).rotateX(-Math.PI / 2);
    const asphaltMat = new THREE.MeshStandardMaterial({
      color: 0x0a1018, roughness: 0.15, metalness: 0.8
    });

    const guardrailGeo = new THREE.BoxGeometry(0.3, 0.7, SEG_L);
    const guardrailMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.3 });
    const refMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

    for (let i = 0; i < NUM_SEGMENTS; i++) {
      const seg = new THREE.Group();
      seg.add(new THREE.Mesh(asphaltGeo, asphaltMat));

      // Guardrails on both edges
      const gL = new THREE.Mesh(guardrailGeo, guardrailMat); gL.position.set(-ROAD_W / 2, 0.35, 0);
      const gR = new THREE.Mesh(guardrailGeo, guardrailMat); gR.position.set(ROAD_W / 2, 0.35, 0);
      const rL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.4), refMat); rL.position.set(-ROAD_W / 2, 0.6, 0);
      const rR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.4), refMat); rR.position.set(ROAD_W / 2, 0.6, 0);
      seg.add(gL); seg.add(gR); seg.add(rL); seg.add(rR);

      seg.position.z = i * SEG_L;
      scene.add(seg);
      roadSegments.push(seg);
    }

    // Rain particles
    const rainCount = 800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 200;
      rainPos[i + 1] = Math.random() * 50 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 200;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMesh = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.8, transparent: true, opacity: 0.6 }));
    scene.add(rainMesh);

    // Player Sports Car
    const playerCar = new THREE.Group();
    const carBody = new THREE.Mesh(
      new THREE.BoxGeometry(2.3, 0.8, 4.8),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.9 })
    );
    carBody.position.y = 0.55;
    playerCar.add(carBody);

    // Illuminated Cockpit Windshield
    const glass = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 0.55, 2.2),
      new THREE.MeshPhysicalMaterial({ color: 0x0f172a, transmission: 0.8, roughness: 0.1, transparent: true, opacity: 0.7 })
    );
    glass.position.set(0, 1.1, -0.3);
    playerCar.add(glass);

    // Dynamic Projected Headlights
    const hlL = new THREE.SpotLight(0xf8fafc, 5.0, 200, Math.PI / 5, 0.35);
    hlL.position.set(-0.8, 0.65, 2.4);
    const tL = new THREE.Object3D(); tL.position.set(-0.8, 0.2, 45);
    playerCar.add(hlL); playerCar.add(tL); hlL.target = tL;

    const hlR = new THREE.SpotLight(0xf8fafc, 5.0, 200, Math.PI / 5, 0.35);
    hlR.position.set(0.8, 0.65, 2.4);
    const tR = new THREE.Object3D(); tR.position.set(0.8, 0.2, 45);
    playerCar.add(hlR); playerCar.add(tR); hlR.target = tR;

    playerCar.position.set(0, 0, 0);
    scene.add(playerCar);

    // Controls
    const keys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === 'c' || e.key === 'C') cycleCamera();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
    });

    let currentSpeed = 95; // KM/H
    let carX = 0, steer = 0, camMode = 0;

    function cycleCamera() {
      camMode = (camMode + 1) % 3;
      document.getElementById('camText').textContent = ["Cockpit 1P", "Chase 3P", "Cinematic Flyby"][camMode];
    }
    function toggleWipers() {}

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (keys.w) currentSpeed = Math.min(currentSpeed + 35 * dt, 160);
      else if (keys.s) currentSpeed = Math.max(currentSpeed - 50 * dt, 20);
      else currentSpeed = Math.max(currentSpeed - 8 * dt, 80);

      if (keys.a) steer = Math.max(steer - 4.0 * dt, -0.06);
      else if (keys.d) steer = Math.min(steer + 4.0 * dt, 0.06);
      else steer *= 0.82;

      carX += steer * (currentSpeed * 0.075);
      carX = THREE.MathUtils.clamp(carX, -ROAD_W / 2 + 2, ROAD_W / 2 - 2);

      playerCar.position.x = carX;
      playerCar.rotation.y = -steer * 4.0;
      playerCar.rotation.z = steer * 1.5;

      const moveDelta = (currentSpeed * 0.277) * dt * 8.0;
      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const seg = roadSegments[i];
        seg.position.z -= moveDelta;
        if (seg.position.z < -SEG_L) {
          seg.position.z += NUM_SEGMENTS * SEG_L;
        }
      }

      // Rain animation
      const rPos = rainGeom.attributes.position.array;
      for (let i = 1; i < rainCount * 3; i += 3) {
        rPos[i] -= 45 * dt;
        if (rPos[i] < 0) rPos[i] = 50;
      }
      rainGeom.attributes.position.needsUpdate = true;

      // Cameras
      if (camMode === 0) {
        camera.position.set(carX, 1.25, playerCar.position.z + 0.2);
        camera.lookAt(carX, 1.1, playerCar.position.z + 40);
      } else if (camMode === 1) {
        camera.position.set(carX * 0.6, 3.4, playerCar.position.z - 9.0);
        camera.lookAt(carX * 0.85, 1.3, playerCar.position.z + 20);
      } else {
        const t = clock.getElapsedTime() * 0.3;
        camera.position.set(carX + Math.sin(t) * 12, 4.0, playerCar.position.z - 8 + Math.cos(t) * 4);
        camera.lookAt(carX, 1.2, playerCar.position.z + 15);
      }

      document.getElementById('spdVal').textContent = Math.round(currentSpeed);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
