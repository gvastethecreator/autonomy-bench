<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHUTO OVERDRIVE — 4:00 AM Midnight Expressway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020308; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }

    .glass-panel {
      background: rgba(10, 14, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px 22px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 0 24px rgba(236, 72, 153, 0.5);
    }

    .telemetry-cluster {
      display: flex;
      gap: 14px;
    }

    .tele-stat {
      text-align: right;
      min-width: 110px;
    }
    .tele-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .tele-val {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .tele-unit {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-left: 4px;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .ctrl-bar {
      pointer-events: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
    }

    .rpm-gauge {
      width: 140px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .rpm-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b, #ef4444);
      transition: width 0.08s ease-out;
    }

    .start-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 28px 40px;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
      z-index: 30;
      transition: all 0.4s ease;
    }
    .start-prompt.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -40%);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud-overlay">
    <div class="top-nav">
      <div class="glass-panel brand-box">
        <div class="badge-icon">⛩️</div>
        <div>
          <div style="font-size: 15px; font-weight: 800; letter-spacing: 0.08em;">首都高 SHUTO EXPRESSWAY</div>
          <div style="font-size: 11px; color: #ec4899; font-weight: 600;">ROUTE B • WANGAN MIDNIGHT CRUISE</div>
        </div>
      </div>

      <div class="telemetry-cluster">
        <div class="glass-panel tele-stat">
          <div class="tele-label">Speed</div>
          <div class="tele-val"><span id="speed-text">145</span><span class="tele-unit">KM/H</span></div>
        </div>
        <div class="glass-panel tele-stat">
          <div class="tele-label">Engine RPM</div>
          <div class="tele-val"><span id="rpm-text">5,200</span></div>
          <div class="rpm-gauge"><div id="rpm-fill" class="rpm-fill"></div></div>
        </div>
        <div class="glass-panel tele-stat">
          <div class="tele-label">Distance</div>
          <div class="tele-val"><span id="dist-text">0.0</span><span class="tele-unit">KM</span></div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="ctrl-bar glass-panel">
        <button id="btn-audio" class="glass-btn">📻 Radio: Lofi Cyber FM</button>
        <button id="btn-cam" class="glass-btn">🎥 Cam: Low Chase</button>
        <button id="btn-weather" class="glass-btn">🌧️ Weather: Rain Slick</button>
      </div>

      <div class="glass-panel" style="font-size: 12px; color: #94a3b8;">
        <b>W / S</b> Throttle & Turbo Brake • <b>A / D</b> High-Speed Lane Weave
      </div>
    </div>
  </div>

  <div id="start-screen" class="start-prompt glass-panel">
    <div style="font-size: 36px; margin-bottom: 8px;">🌃</div>
    <div style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">ENGAGE SHUTO OVERDRIVE</div>
    <div style="font-size: 13px; color: #94a3b8;">Click anywhere to start Engine Sound, Rain Audio & Neon Cruise</div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Multi-Track Web Audio Engine (Inline-6 Turbo Engine, Rain Ambience, Lofi Pad)
    let audioCtx = null;
    let engineOsc, engineGain, rainGain, radioGain;
    let isSoundOn = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Inline-6 Engine Rumble
      engineOsc = audioCtx.createOscillator();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.value = 65;

      const engineFilter = audioCtx.createBiquadFilter();
      engineFilter.type = 'lowpass';
      engineFilter.frequency.value = 220;

      engineGain = audioCtx.createGain();
      engineGain.gain.value = 0.12;

      engineOsc.connect(engineFilter);
      engineFilter.connect(engineGain);
      engineGain.connect(audioCtx.destination);
      engineOsc.start();

      // Rain Ambience (Pink Noise)
      const bSize = audioCtx.sampleRate * 2;
      const rBuff = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
      const data = rBuff.getChannelData(0);
      for (let i = 0; i < bSize; i++) data[i] = (Math.random() * 2 - 1) * 0.4;

      const rainSource = audioCtx.createBufferSource();
      rainSource.buffer = rBuff;
      rainSource.loop = true;

      const rainFilter = audioCtx.createBiquadFilter();
      rainFilter.type = 'bandpass';
      rainFilter.frequency.value = 1200;
      rainFilter.Q.value = 0.8;

      rainGain = audioCtx.createGain();
      rainGain.gain.value = 0.08;

      rainSource.connect(rainFilter);
      rainFilter.connect(rainGain);
      rainGain.connect(audioCtx.destination);
      rainSource.start();

      // Lofi Chill Chords
      const chords = [146.83, 174.61, 220.00, 261.63]; // Dm7
      radioGain = audioCtx.createGain();
      radioGain.gain.value = 0.06;

      chords.forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(radioGain);
        osc.start();
      });
      radioGain.connect(audioCtx.destination);
      isSoundOn = true;
    }

    // 3D Scene Initialization
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020308);
    scene.fog = new THREE.FogExp2(0x020308, 0.007);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1200);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.appendChild(renderer.domElement);

    // Dynamic Lighting & Neon Sky Reflection
    const hemiLight = new THREE.HemisphereLight(0xd946ef, 0x020617, 0.65);
    scene.add(hemiLight);

    const ambientLight = new THREE.AmbientLight(0x1e1b4b, 0.5);
    scene.add(ambientLight);

    // Distant Neon Megacity with glowing towers
    const skylineGroup = new THREE.Group();
    const towerMat = new THREE.MeshStandardMaterial({ color: 0x070a14, roughness: 0.6 });
    const neonColors = [0xec4899, 0x06b6d4, 0x8b5cf6, 0xf59e0b];

    for (let i = 0; i < 60; i++) {
      const w = 20 + Math.random() * 35;
      const h = 60 + Math.random() * 180;
      const d = 20 + Math.random() * 35;
      const tower = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), towerMat);
      tower.position.set((i - 30) * 32, h / 2 - 10, -700 - Math.random() * 200);
      skylineGroup.add(tower);

      if (i % 3 === 0) {
        const beacon = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.8, 3, d * 0.8),
          new THREE.MeshBasicMaterial({ color: neonColors[i % neonColors.length] })
        );
        beacon.position.set(tower.position.x, h - 8, tower.position.z);
        skylineGroup.add(beacon);
      }
    }
    scene.add(skylineGroup);

    // Multi-Lane Shuto Elevated Expressway Chunks
    const roadWidth = 22;
    const chunkLength = 140;
    const numChunks = 8;
    const roadChunks = [];

    const asphaltMat = new THREE.MeshStandardMaterial({
      color: 0x0e111a,
      roughness: 0.18,
      metalness: 0.75
    });
    const barrierMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.3 });
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const yellowMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });

    for (let c = 0; c < numChunks; c++) {
      const chunk = new THREE.Group();

      const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, chunkLength), asphaltMat);
      road.rotation.x = -Math.PI / 2;
      road.receiveShadow = true;
      chunk.add(road);

      for (let x of [-roadWidth * 0.25, 0, roadWidth * 0.25]) {
        for (let z = -chunkLength / 2 + 6; z < chunkLength / 2; z += 14) {
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 6), dashMat);
          dash.rotation.x = -Math.PI / 2;
          dash.position.set(x, 0.02, z);
          chunk.add(dash);
        }
      }

      for (let side of [-roadWidth / 2 + 0.8, roadWidth / 2 - 0.8]) {
        const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.3, chunkLength), yellowMat);
        stripe.rotation.x = -Math.PI / 2;
        stripe.position.set(side, 0.02, 0);
        chunk.add(stripe);
      }

      for (let side of [-roadWidth / 2 - 0.6, roadWidth / 2 + 0.6]) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3.2, chunkLength), barrierMat);
        wall.position.set(side, 1.6, 0);
        chunk.add(wall);

        const neonStrip = new THREE.Mesh(
          new THREE.PlaneGeometry(0.1, chunkLength),
          new THREE.MeshBasicMaterial({ color: side < 0 ? 0x06b6d4 : 0xec4899 })
        );
        neonStrip.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;
        neonStrip.position.set(side < 0 ? side + 0.3 : side - 0.3, 2.5, 0);
        chunk.add(neonStrip);
      }

      if (c % 3 === 0) {
        const gantry = new THREE.Group();
        const arch = new THREE.Mesh(new THREE.BoxGeometry(roadWidth + 2, 0.8, 1), barrierMat);
        arch.position.set(0, 7.5, 0);
        gantry.add(arch);

        const signMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(6, 2), signMat);
        sign.position.set(-4, 7.5, 0.6);
        gantry.add(sign);

        const signMat2 = new THREE.MeshBasicMaterial({ color: 0xef4444 });
        const sign2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 2), signMat2);
        sign2.position.set(4, 7.5, 0.6);
        gantry.add(sign2);

        chunk.add(gantry);
      }

      chunk.position.z = -c * chunkLength;
      scene.add(chunk);
      roadChunks.push(chunk);
    }

    // High-Detail Player Cyber Car (GT Coupe)
    const playerCar = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      metalness: 0.95,
      roughness: 0.15
    });

    const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 4.8), bodyMat);
    chassis.position.y = 0.55;
    playerCar.add(chassis);

    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.9, 0.65, 2.6),
      new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.05, metalness: 0.9 })
    );
    cabin.position.set(0, 1.15, -0.2);
    playerCar.add(cabin);

    // Front Laser LED Headlights
    const leftHeadlight = new THREE.SpotLight(0xfff7ed, 40, 160, Math.PI / 6, 0.3);
    leftHeadlight.position.set(-0.9, 0.6, -2.4);
    leftHeadlight.target.position.set(-0.9, 0, -60);
    playerCar.add(leftHeadlight);
    playerCar.add(leftHeadlight.target);

    const rightHeadlight = new THREE.SpotLight(0xfff7ed, 40, 160, Math.PI / 6, 0.3);
    rightHeadlight.position.set(0.9, 0.6, -2.4);
    rightHeadlight.target.position.set(0.9, 0, -60);
    playerCar.add(rightHeadlight);
    playerCar.add(rightHeadlight.target);

    // Underglow Neon & Full-Width Taillight Blade
    const underglow = new THREE.PointLight(0x06b6d4, 4, 12);
    underglow.position.set(0, 0.25, 0);
    playerCar.add(underglow);

    const tailBlade = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0044 }));
    tailBlade.position.set(0, 0.72, 2.41);
    playerCar.add(tailBlade);

    scene.add(playerCar);

    // Traffic Cars
    const trafficCars = [];
    for (let i = 0; i < 7; i++) {
      const ai = new THREE.Group();
      const aiColor = [0x3b82f6, 0xef4444, 0x10b981, 0x64748b, 0xf59e0b][i % 5];
      const aiBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 4.4), new THREE.MeshStandardMaterial({ color: aiColor, metalness: 0.7 }));
      aiBody.position.y = 0.55;
      ai.add(aiBody);

      const aiTail = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.12, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0033 }));
      aiTail.position.set(0, 0.65, 2.21);
      ai.add(aiTail);

      const lane = [-roadWidth * 0.35, -roadWidth * 0.12, roadWidth * 0.12, roadWidth * 0.35][i % 4];
      ai.position.set(lane, 0, -120 - i * 80);
      scene.add(ai);
      trafficCars.push({ group: ai, speed: 75 + Math.random() * 35 });
    }

    // Dynamic Rain Particle System
    const rainCount = 4000;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = [];
    for (let i = 0; i < rainCount; i++) {
      rainPos.push((Math.random() - 0.5) * 80, Math.random() * 50, (Math.random() - 0.5) * 120);
    }
    rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(rainPos, 3));
    const rainParticles = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.25, transparent: true, opacity: 0.7 }));
    scene.add(rainParticles);

    // UI Interactive Controls
    const startScreen = document.getElementById('start-screen');
    startScreen.onclick = () => {
      initAudio();
      startScreen.classList.add('hidden');
    };

    let camMode = 0; // 0: Low Chase, 1: Cockpit Hood, 2: Aerial Drone
    const btnCam = document.getElementById('btn-cam');
    btnCam.onclick = () => {
      camMode = (camMode + 1) % 3;
      const names = ['🎥 Cam: Low Chase', '🎥 Cam: Cockpit Hood', '🎥 Cam: Aerial Drone'];
      btnCam.textContent = names[camMode];
    };

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.onclick = () => {
      initAudio();
      isSoundOn = !isSoundOn;
      if (radioGain) radioGain.gain.value = isSoundOn ? 0.06 : 0;
      btnAudio.textContent = isSoundOn ? '📻 Radio: Lofi Cyber FM' : '🔇 Radio: Muted';
    };

    const btnWeather = document.getElementById('btn-weather');
    let isRaining = true;
    btnWeather.onclick = () => {
      isRaining = !isRaining;
      rainParticles.visible = isRaining;
      if (rainGain) rainGain.gain.value = isRaining ? 0.08 : 0;
      btnWeather.textContent = isRaining ? '🌧️ Weather: Rain Slick' : '🌌 Weather: Clear Neon';
    };

    // Driving Controls
    const keys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    let currentSpeed = 145; // km/h
    let posX = 0;
    let steerRate = 0;
    let distanceDriven = 0;
    let lastStamp = performance.now();

    const speedText = document.getElementById('speed-text');
    const rpmText = document.getElementById('rpm-text');
    const rpmFill = document.getElementById('rpm-fill');
    const distText = document.getElementById('dist-text');

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastStamp) / 1000, 0.08);
      lastStamp = now;

      if (keys.w) currentSpeed = Math.min(235, currentSpeed + 60 * delta);
      else if (keys.s) currentSpeed = Math.max(40, currentSpeed - 110 * delta);
      else currentSpeed += (145 - currentSpeed) * delta * 0.5;

      let targetTurn = 0;
      if (keys.a) targetTurn -= 1;
      if (keys.d) targetTurn += 1;
      steerRate += (targetTurn * 12 - steerRate) * delta * 9;
      posX += steerRate * delta * (currentSpeed / 90);
      posX = Math.max(-roadWidth / 2 + 2.0, Math.min(roadWidth / 2 - 2.0, posX));

      playerCar.position.x = posX;
      playerCar.rotation.y = -steerRate * 0.04;
      playerCar.rotation.z = -steerRate * 0.025;

      const speedScale = currentSpeed * 0.75;
      const totalSpan = numChunks * chunkLength;
      for (const chunk of roadChunks) {
        chunk.position.z += speedScale * delta;
        if (chunk.position.z > chunkLength) {
          chunk.position.z -= totalSpan;
        }
      }

      for (const t of trafficCars) {
        t.group.position.z += (speedScale - t.speed * 0.75) * delta;
        if (t.group.position.z > 30) {
          t.group.position.z -= 700;
          const lane = [-roadWidth * 0.35, -roadWidth * 0.12, roadWidth * 0.12, roadWidth * 0.35][Math.floor(Math.random() * 4)];
          t.group.position.x = lane;
        }
      }

      if (isRaining) {
        const rPos = rainGeo.attributes.position;
        for (let i = 0; i < rainCount; i++) {
          let y = rPos.getY(i) - 90 * delta;
          let z = rPos.getZ(i) + speedScale * 0.5 * delta;
          if (y < 0) y = 50;
          if (z > 60) z = -60;
          rPos.setY(i, y);
          rPos.setZ(i, z);
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      if (camMode === 0) {
        camera.position.set(posX * 0.5, 3.2, 7.8);
        camera.lookAt(posX * 0.8, 1.2, -50);
      } else if (camMode === 1) {
        camera.position.set(posX, 1.4, -0.6);
        camera.lookAt(posX, 1.2, -80);
      } else {
        camera.position.set(posX * 0.3, 12.0, 18.0);
        camera.lookAt(posX * 0.7, 1.0, -30);
      }

      distanceDriven += (currentSpeed / 3600) * delta;
      const rpm = Math.round(2200 + (currentSpeed / 240) * 5800);
      speedText.textContent = Math.round(currentSpeed);
      rpmText.textContent = rpm.toLocaleString();
      rpmFill.style.width = Math.min(100, Math.max(10, (rpm / 8000) * 100)) + '%';
      distText.textContent = distanceDriven.toFixed(2);

      if (engineOsc && audioCtx) {
        engineOsc.frequency.setTargetAtTime(50 + (currentSpeed / 240) * 110, audioCtx.currentTime, 0.05);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
