<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spectacular Fireworks Display</title>
  <style>
    /* CSS Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030308;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .title-group {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 30%, #a1c4fd 70%, #c2e9fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    .title-group p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.65);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* Button Styles */
    .btn {
      background: rgba(25, 25, 40, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f0f0f5;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:hover {
      background: rgba(45, 45, 70, 0.85);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      color: #fff;
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.active {
      background: rgba(0, 180, 255, 0.25);
      border-color: #00d2ff;
      color: #00d2ff;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.4);
    }

    .btn-finale {
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
      border: none;
      color: #fff;
      font-weight: 700;
      animation: pulse-glow 2.5s infinite;
    }

    .btn-finale:hover {
      background: linear-gradient(135deg, #ff2a5f 0%, #ffd0c0 100%);
      box-shadow: 0 0 25px rgba(255, 50, 90, 0.7);
      transform: translateY(-2px) scale(1.03);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 20, 80, 0.4); }
      50% { box-shadow: 0 0 22px rgba(255, 100, 50, 0.8); }
    }

    /* Toast Notification / Hint */
    .hint-toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      animation: toast-anim 6s ease forwards;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    @keyframes toast-anim {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      75% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); pointer-events: none; }
    }

    /* Bottom Control Bar */
    .control-panel-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .controls-panel {
      background: rgba(12, 14, 24, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 95vw;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-item label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 700;
    }

    .custom-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f0f0f5;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .custom-select:hover, .custom-select:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .custom-select option {
      background: #121422;
      color: #fff;
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }

    .toggle-wrap input {
      display: none;
    }

    .toggle-switch {
      width: 34px;
      height: 18px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      position: relative;
      transition: background 0.25s;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      top: 2px;
      left: 2px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toggle-wrap input:checked + .toggle-switch {
      background: #00d2ff;
    }

    .toggle-wrap input:checked + .toggle-switch::after {
      transform: translateX(16px);
    }

    /* Range slider */
    .range-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00d2ff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 210, 255, 0.6);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .top-actions {
        justify-content: flex-start;
      }
      .controls-panel {
        gap: 10px;
        padding: 8px 12px;
      }
      .title-group h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Canvas -->
  <div id="canvas-container">
    <canvas id="fireworks-canvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Header -->
    <header class="header-bar">
      <div class="title-group">
        <h1>Celestial Fireworks</h1>
        <p>Interactive Autonomous Night Sky Simulation</p>
      </div>

      <div class="top-actions interactive">
        <button id="btn-sound" class="btn" title="Toggle audio sound effects">
          <span id="sound-icon">🔊</span> <span id="sound-text">Sound: ON</span>
        </button>
        <button id="btn-finale" class="btn btn-finale" title="Trigger a glorious barrage finale">
          ✨ Grand Finale!
        </button>
        <button id="btn-fullscreen" class="btn" title="Toggle fullscreen view">
          ⛶ Fullscreen
        </button>
      </div>
    </header>

    <!-- Hint Toast -->
    <div class="hint-toast">
      💡 Tap or click & drag anywhere on the sky to launch rockets!
    </div>

    <!-- Bottom Controls Panel -->
    <div class="control-panel-wrapper interactive">
      <div class="controls-panel">
        <!-- Auto Launch Toggle -->
        <div class="control-item">
          <label>Auto Show</label>
          <label class="toggle-wrap">
            <input type="checkbox" id="toggle-auto" checked>
            <div class="toggle-switch"></div>
            <span>Auto Launch</span>
          </label>
        </div>

        <!-- Shell Pattern -->
        <div class="control-item">
          <label for="select-shell">Shell Type</label>
          <select id="select-shell" class="custom-select">
            <option value="random">Random Shells</option>
            <option value="peony">Chrysanthemum / Peony</option>
            <option value="willow">Golden Willow (Weeping)</option>
            <option value="ring">Saturn Ring / Orbit</option>
            <option value="heart">Love Heart</option>
            <option value="star">Celestial Star</option>
            <option value="crossette">Crossette (Splitting)</option>
            <option value="strobe">Strobe Glitter</option>
            <option value="spiral">Galaxy Spiral</option>
            <option value="palm">Palm Tree</option>
          </select>
        </div>

        <!-- Color Palette -->
        <div class="control-item">
          <label for="select-palette">Palette</label>
          <select id="select-palette" class="custom-select">
            <option value="vibrant">Vibrant Prism</option>
            <option value="neon">Cyber Neon</option>
            <option value="gold">Imperial Gold & Silver</option>
            <option value="sunset">Sunset Radiance</option>
            <option value="aurora">Aurora Borealis</option>
            <option value="pastel">Pastel Dream</option>
            <option value="fire-ice">Fire & Ice</option>
          </select>
        </div>

        <!-- Scenery Backdrop -->
        <div class="control-item">
          <label for="select-scenery">Scenery</label>
          <select id="select-scenery" class="custom-select">
            <option value="city">City Skyline & Water</option>
            <option value="mountains">Mountain Ridge & Pines</option>
            <option value="ocean">Ocean Reflection</option>
            <option value="minimal">Pure Deep Space</option>
          </select>
        </div>

        <!-- Trail Length Slider -->
        <div class="control-item">
          <label for="slider-trails">Trail Glow</label>
          <div class="range-wrap">
            <input type="range" id="slider-trails" class="range-slider" min="0.05" max="0.35" step="0.01" value="0.18">
          </div>
        </div>

        <!-- Launch Frequency -->
        <div class="control-item">
          <label for="slider-rate">Auto Pace</label>
          <div class="range-wrap">
            <input type="range" id="slider-rate" class="range-slider" min="15" max="80" step="5" value="45">
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /**
     * SPECTACULAR FIREWORKS ENGINE
     * Self-contained canvas particle simulation with synthetic Web Audio API
     */
    (function () {
      'use strict';

      // --- CONFIGURATION & STATE ---
      const canvas = document.getElementById('fireworks-canvas');
      const ctx = canvas.getContext('2d');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const state = {
        autoLaunch: true,
        shellType: 'random',
        palette: 'vibrant',
        scenery: 'city',
        trailOpacity: 0.18,
        launchInterval: 45, // frames between auto rockets
        soundEnabled: true,
        isFinale: false,
        finaleTimer: 0,
        finaleCount: 0
      };

      // Entities
      const rockets = [];
      const particles = [];
      const stars = [];
      const backgroundRays = [];

      let frameCount = 0;
      let isMouseDown = false;
      let lastMousePos = { x: width / 2, y: height / 2 };
      let dragLaunchTimer = 0;

      // Color Palettes
      const PALETTES = {
        vibrant: ['#ff0055', '#ff5500', '#ffcc00', '#00ff66', '#00d2ff', '#9900ff', '#ff00aa'],
        neon: ['#00f0ff', '#ff007f', '#39ff14', '#bc13fe', '#ffe600', '#00ffcc'],
        gold: ['#ffd700', '#fff8dc', '#ffb700', '#ffae19', '#ffffff', '#e6ca65'],
        sunset: ['#ff4e50', '#f9d423', '#e100ff', '#ff6e7f', '#bfe9ff', '#fa709a'],
        aurora: ['#05ffa1', '#00d2ff', '#7000ff', '#00ff87', '#60efff', '#0061ff'],
        pastel: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8c5ff'],
        'fire-ice': ['#ff1e00', '#ff5e00', '#ff9900', '#00d0ff', '#0077ff', '#ffffff']
      };

      // --- WEB AUDIO SYNTHESIS ---
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playLaunchSound() {
        if (!state.soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          
          // Ascending whistle sound
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300 + Math.random() * 200, now);
          osc.frequency.exponentialRampToValueAtTime(700 + Math.random() * 300, now + 0.6);

          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.65);
        } catch (e) {}
      }

      function playExplosionSound(power = 1.0, hasCrackle = false) {
        if (!state.soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;

          // 1. Deep Sub-bass Thump
          const subOsc = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(140 * power, now);
          subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.5 * power);

          subGain.gain.setValueAtTime(0.3 * Math.min(power, 1.2), now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55 * power);

          subOsc.connect(subGain);
          subGain.connect(audioCtx.destination);
          subOsc.start(now);
          subOsc.stop(now + 0.6 * power);

          // 2. White Noise Boom / Burst
          const bufferSize = audioCtx.sampleRate * 0.5;
          const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }

          const noise = audioCtx.createBufferSource();
          noise.buffer = noiseBuffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800 * power, now);
          filter.frequency.exponentialRampToValueAtTime(50, now + 0.45);

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.setValueAtTime(0.25 * power, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);

          noise.start(now);
          noise.stop(now + 0.5);

          // 3. Crackle Pop Sequence
          if (hasCrackle) {
            const crackleCount = Math.floor(6 + Math.random() * 8);
            for (let i = 0; i < crackleCount; i++) {
              const delay = 0.2 + Math.random() * 0.6;
              const popTime = now + delay;
              
              const popOsc = audioCtx.createOscillator();
              const popGain = audioCtx.createGain();
              popOsc.type = 'triangle';
              popOsc.frequency.setValueAtTime(800 + Math.random() * 1200, popTime);
              popGain.gain.setValueAtTime(0.05, popTime);
              popGain.gain.exponentialRampToValueAtTime(0.0001, popTime + 0.04);
              
              popOsc.connect(popGain);
              popGain.connect(audioCtx.destination);
              popOsc.start(popTime);
              popOsc.stop(popTime + 0.05);
            }
          }
        } catch (e) {}
      }

      // --- COLOR HELPERS ---
      function getRandomColor() {
        const palette = PALETTES[state.palette] || PALETTES.vibrant;
        return palette[Math.floor(Math.random() * palette.length)];
      }

      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        let r, g, b;
        if (clean.length === 3) {
          r = parseInt(clean[0] + clean[0], 16);
          g = parseInt(clean[1] + clean[1], 16);
          b = parseInt(clean[2] + clean[2], 16);
        } else {
          r = parseInt(clean.substring(0, 2), 16);
          g = parseInt(clean.substring(2, 4), 16);
          b = parseInt(clean.substring(4, 6), 16);
        }
        return { r, g, b };
      }

      // --- STARFIELD INITIALIZATION ---
      function initStars() {
        stars.length = 0;
        const count = Math.floor((width * height) / 3500);
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * (height * 0.75),
            size: Math.random() * 1.5 + 0.5,
            alpha: Math.random() * 0.8 + 0.2,
            twinkleSpeed: Math.random() * 0.03 + 0.005,
            twinklePhase: Math.random() * Math.PI * 2
          });
        }
      }

      // --- PARTICLE CLASS ---
      class Particle {
        constructor(x, y, vx, vy, color, options = {}) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.color = color;
          this.rgb = hexToRgb(color);
          
          this.alpha = options.alpha !== undefined ? options.alpha : 1;
          this.decay = options.decay || (Math.random() * 0.015 + 0.01);
          this.gravity = options.gravity !== undefined ? options.gravity : 0.045;
          this.friction = options.friction !== undefined ? options.friction : 0.965;
          this.size = options.size !== undefined ? options.size : (Math.random() * 2.5 + 1.5);
          this.trail = [];
          this.trailLength = options.trailLength || (Math.random() > 0.4 ? 4 : 0);
          this.flicker = options.flicker || false;
          this.shimmer = options.shimmer || false;
          this.sparkle = options.sparkle || false;
          this.isSecondary = options.isSecondary || false;
          this.crossetteSplit = options.crossetteSplit || false;
          this.splitTime = options.splitTime || 0;
          this.age = 0;
        }

        update() {
          if (this.trailLength > 0) {
            this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
            if (this.trail.length > this.trailLength) {
              this.trail.shift();
            }
          }

          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;

          this.alpha -= this.decay;
          this.age++;

          // Crossette split into 4 quadrant stars
          if (this.crossetteSplit && this.age === this.splitTime && this.alpha > 0.3) {
            this.splitIntoCross();
          }

          return this.alpha > 0;
        }

        splitIntoCross() {
          const speed = 3.5;
          const angles = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2];
          playExplosionSound(0.5, true);
          angles.forEach(ang => {
            particles.push(new Particle(
              this.x, this.y,
              Math.cos(ang) * speed + (Math.random() - 0.5),
              Math.sin(ang) * speed + (Math.random() - 0.5),
              this.color,
              {
                decay: 0.02,
                friction: 0.94,
                gravity: 0.06,
                size: 2.2,
                trailLength: 5,
                shimmer: true
              }
            ));
          });
          this.alpha = 0; // consume parent
        }

        draw(targetCtx) {
          // Draw trail
          if (this.trail.length > 1) {
            targetCtx.beginPath();
            targetCtx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
              targetCtx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            targetCtx.strokeStyle = `rgba(${this.rgb.r}, ${this.rgb.g}, ${this.rgb.b}, ${this.alpha * 0.4})`;
            targetCtx.lineWidth = this.size * 0.8;
            targetCtx.stroke();
          }

          // Main Particle
          let drawAlpha = this.alpha;
          if (this.flicker && Math.random() > 0.4) {
            drawAlpha *= 0.2;
          }
          if (this.shimmer && Math.sin(this.age * 0.5) < 0) {
            drawAlpha *= 0.5;
          }

          targetCtx.save();
          targetCtx.globalAlpha = Math.max(0, drawAlpha);
          targetCtx.fillStyle = this.color;
          targetCtx.beginPath();
          targetCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          targetCtx.fill();

          // Sparkle star flare
          if (this.sparkle && Math.random() > 0.6) {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(this.x - 1, this.y - 4, 2, 8);
            targetCtx.fillRect(this.x - 4, this.y - 1, 8, 2);
          }

          targetCtx.restore();
        }
      }

      // --- ROCKET CLASS ---
      class Rocket {
        constructor(startX, startY, targetX, targetY, options = {}) {
          this.x = startX;
          this.y = startY;
          this.startX = startX;
          this.startY = startY;
          this.targetX = targetX;
          this.targetY = targetY;

          this.color = options.color || getRandomColor();
          this.rgb = hexToRgb(this.color);
          this.shellType = options.shellType || state.shellType;
          if (this.shellType === 'random') {
            const types = ['peony', 'willow', 'ring', 'heart', 'star', 'crossette', 'strobe', 'spiral', 'palm'];
            this.shellType = types[Math.floor(Math.random() * types.length)];
          }

          const dx = targetX - startX;
          const dy = targetY - startY;
          const distance = Math.hypot(dx, dy);

          this.speed = Math.random() * 3 + 12;
          this.angle = Math.atan2(dy, dx);
          this.vx = Math.cos(this.angle) * this.speed;
          this.vy = Math.sin(this.angle) * this.speed;

          this.trail = [];
          this.maxTrail = 8;
          this.alive = true;
          this.distanceToTarget = distance;
          this.hasWhistled = false;
        }

        update() {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.maxTrail) {
            this.trail.shift();
          }

          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.05; // slight rocket gravity curve

          // Spawn ascent smoke & sparks
          if (Math.random() > 0.25) {
            particles.push(new Particle(
              this.x + (Math.random() - 0.5) * 3,
              this.y + (Math.random() - 0.5) * 3,
              (Math.random() - 0.5) * 1.5 - this.vx * 0.1,
              Math.random() * 1.5 - this.vy * 0.1,
              '#ffaa44',
              {
                alpha: 0.7,
                decay: 0.04,
                size: Math.random() * 1.8 + 1,
                friction: 0.95,
                gravity: 0.02
              }
            ));
          }

          // Check if reached apex / target vicinity or starting to fall
          const distRemaining = Math.hypot(this.targetX - this.x, this.targetY - this.y);
          if (distRemaining < 25 || this.vy >= -0.5 || this.y <= this.targetY) {
            this.explode();
            this.alive = false;
          }

          return this.alive;
        }

        draw(targetCtx) {
          // Trail
          if (this.trail.length > 1) {
            targetCtx.beginPath();
            targetCtx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
              targetCtx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            targetCtx.strokeStyle = `rgba(${this.rgb.r}, ${this.rgb.g}, ${this.rgb.b}, 0.7)`;
            targetCtx.lineWidth = 2.5;
            targetCtx.stroke();
          }

          // Rocket head
          targetCtx.save();
          targetCtx.fillStyle = '#ffffff';
          targetCtx.shadowColor = this.color;
          targetCtx.shadowBlur = 10;
          targetCtx.beginPath();
          targetCtx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.restore();
        }

        explode() {
          const x = this.x;
          const y = this.y;
          const primaryColor = this.color;
          const secondaryColor = getRandomColor();

          switch (this.shellType) {
            case 'peony':
            case 'chrysanthemum': {
              const count = 120 + Math.floor(Math.random() * 50);
              playExplosionSound(1.1);
              for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 1.5;
                const col = Math.random() > 0.25 ? primaryColor : secondaryColor;
                particles.push(new Particle(
                  x, y,
                  Math.cos(angle) * speed,
                  Math.sin(angle) * speed,
                  col,
                  {
                    friction: 0.94,
                    gravity: 0.05,
                    decay: 0.012 + Math.random() * 0.008,
                    size: 2.2,
                    trailLength: 6,
                    shimmer: true
                  }
                ));
              }
              break;
            }

            case 'willow': {
              const count = 90 + Math.floor(Math.random() * 30);
              const goldCol = '#ffd700';
              playExplosionSound(0.9);
              for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                particles.push(new Particle(
                  x, y,
                  Math.cos(angle) * speed,
                  Math.sin(angle) * speed,
                  goldCol,
                  {
                    friction: 0.95,
                    gravity: 0.075, // heavy graceful weeping fall
                    decay: 0.006 + Math.random() * 0.004, // long lasting
                    size: 1.8,
                    trailLength: 8,
                    shimmer: true
                  }
                ));
              }
              break;
            }

            case 'ring': {
              const count = 75;
              playExplosionSound(1.0);
              const tilt = Math.random() * Math.PI;
              const radius = 5.5 + Math.random() * 2;
              for (let i = 0; i < count; i++) {
                const theta = (i / count) * Math.PI * 2;
                // 3D rotated ring projection
                const rx = Math.cos(theta) * radius;
                const ry = Math.sin(theta) * radius * Math.cos(tilt);
                particles.push(new Particle(
                  x, y,
                  rx, ry,
                  primaryColor,
                  {
                    friction: 0.945,
                    gravity: 0.04,
                    decay: 0.013,
                    size: 2.5,
                    trailLength: 5,
                    sparkle: true
                  }
                ));
              }
              // Center jewel
              for (let i = 0; i < 20; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 2;
                particles.push(new Particle(
                  x, y,
                  Math.cos(ang) * spd,
                  Math.sin(ang) * spd,
                  '#ffffff',
                  { friction: 0.92, gravity: 0.03, decay: 0.02, size: 2.5 }
                ));
              }
              break;
            }

            case 'heart': {
              const count = 80;
              playExplosionSound(1.0);
              for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                // Heart curve formula
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                const scale = 0.32;
                particles.push(new Particle(
                  x, y,
                  hx * scale + (Math.random() - 0.5) * 0.4,
                  hy * scale + (Math.random() - 0.5) * 0.4,
                  primaryColor,
                  {
                    friction: 0.935,
                    gravity: 0.045,
                    decay: 0.011,
                    size: 2.6,
                    trailLength: 4,
                    shimmer: true
                  }
                ));
              }
              break;
            }

            case 'star': {
              const points = 5;
              const perPoint = 16;
              playExplosionSound(1.0);
              for (let p = 0; p < points; p++) {
                const baseAng = (p / points) * Math.PI * 2 - Math.PI / 2;
                for (let k = 1; k <= perPoint; k++) {
                  const spd = (k / perPoint) * 6.5;
                  const col = k > perPoint * 0.7 ? '#ffffff' : primaryColor;
                  particles.push(new Particle(
                    x, y,
                    Math.cos(baseAng) * spd + (Math.random() - 0.5) * 0.3,
                    Math.sin(baseAng) * spd + (Math.random() - 0.5) * 0.3,
                    col,
                    {
                      friction: 0.94,
                      gravity: 0.04,
                      decay: 0.012,
                      size: 2.4,
                      trailLength: 5,
                      sparkle: true
                    }
                  ));
                }
              }
              break;
            }

            case 'crossette': {
              const count = 32;
              playExplosionSound(1.0, true);
              for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const speed = Math.random() * 3.5 + 3.5;
                particles.push(new Particle(
                  x, y,
                  Math.cos(angle) * speed,
                  Math.sin(angle) * speed,
                  primaryColor,
                  {
                    friction: 0.95,
                    gravity: 0.04,
                    decay: 0.015,
                    size: 3.0,
                    trailLength: 6,
                    crossetteSplit: true,
                    splitTime: Math.floor(25 + Math.random() * 15)
                  }
                ));
              }
              break;
            }

            case 'strobe': {
              const count = 100;
              playExplosionSound(1.1, true);
              for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6.5 + 1;
                particles.push(new Particle(
                  x, y,
                  Math.cos(angle) * speed,
                  Math.sin(angle) * speed,
                  Math.random() > 0.3 ? '#ffffff' : primaryColor,
                  {
                    friction: 0.935,
                    gravity: 0.04,
                    decay: 0.009 + Math.random() * 0.006,
                    size: 2.2,
                    flicker: true,
                    sparkle: true
                  }
                ));
              }
              break;
            }

            case 'spiral': {
              const arms = 3;
              const countPerArm = 30;
              playExplosionSound(1.0);
              for (let a = 0; a < arms; a++) {
                const armOffset = (a / arms) * Math.PI * 2;
                for (let i = 0; i < countPerArm; i++) {
                  const r = (i / countPerArm) * 6;
                  const angle = armOffset + (i / countPerArm) * Math.PI * 2.5;
                  particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * r,
                    Math.sin(angle) * r,
                    primaryColor,
                    {
                      friction: 0.94,
                      gravity: 0.04,
                      decay: 0.012,
                      size: 2.2,
                      trailLength: 6
                    }
                  ));
                }
              }
              break;
            }

            case 'palm': {
              const branches = 18;
              playExplosionSound(1.2);
              for (let b = 0; b < branches; b++) {
                const angle = (b / branches) * Math.PI * 2;
                const branchColor = Math.random() > 0.5 ? '#ffd700' : '#00ff88';
                for (let j = 0; j < 8; j++) {
                  const speed = 4.5 + j * 0.5;
                  particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed + (Math.random() - 0.5) * 0.5,
                    Math.sin(angle) * speed + (Math.random() - 0.5) * 0.5,
                    branchColor,
                    {
                      friction: 0.95,
                      gravity: 0.07,
                      decay: 0.009,
                      size: 2.5,
                      trailLength: 7,
                      shimmer: true
                    }
                  ));
                }
              }
              break;
            }

            default: {
              // Standard burst
              const count = 100;
              playExplosionSound(1.0);
              for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push(new Particle(
                  x, y,
                  Math.cos(angle) * speed,
                  Math.sin(angle) * speed,
                  primaryColor,
                  {
                    friction: 0.94,
                    gravity: 0.05,
                    decay: 0.015,
                    size: 2.0,
                    trailLength: 5
                  }
                ));
              }
            }
          }
        }
      }

      // --- LAUNCH HELPERS ---
      function launchRocket(targetX, targetY, customShell = null) {
        initAudio();
        const startX = width * 0.2 + Math.random() * (width * 0.6);
        const startY = height + 10;
        const finalTargetX = targetX !== undefined ? targetX : width * 0.15 + Math.random() * (width * 0.7);
        const finalTargetY = targetY !== undefined ? targetY : height * 0.15 + Math.random() * (height * 0.45);

        const rocket = new Rocket(startX, startY, finalTargetX, finalTargetY, {
          shellType: customShell || state.shellType,
          color: getRandomColor()
        });
        rockets.push(rocket);
        playLaunchSound();
      }

      function triggerGrandFinale() {
        initAudio();
        state.isFinale = true;
        state.finaleTimer = 0;
        state.finaleCount = 0;
      }

      // --- SCENERY & BACKGROUND RENDERING ---
      function drawBackground() {
        // Night sky base gradient
        const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
        skyGradient.addColorStop(0, '#020208');
        skyGradient.addColorStop(0.5, '#050714');
        skyGradient.addColorStop(1, '#090d20');

        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, width, height);

        // Twinkling stars
        ctx.save();
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.twinklePhase += s.twinkleSpeed;
          const currentAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.twinklePhase));
          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Moon
        ctx.save();
        const moonX = width * 0.85;
        const moonY = height * 0.18;
        const moonRadius = Math.min(width, height) * 0.035;

        // Moon Glow
        const moonGlow = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.8, moonX, moonY, moonRadius * 3);
        moonGlow.addColorStop(0, 'rgba(255, 250, 220, 0.25)');
        moonGlow.addColorStop(1, 'rgba(255, 250, 220, 0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius * 3, 0, Math.PI * 2);
        ctx.fill();

        // Moon Body
        ctx.fillStyle = '#fffdf0';
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
        ctx.fill();

        // Moon Craters subtle detail
        ctx.fillStyle = 'rgba(210, 210, 200, 0.35)';
        ctx.beginPath();
        ctx.arc(moonX - moonRadius * 0.3, moonY - moonRadius * 0.2, moonRadius * 0.25, 0, Math.PI * 2);
        ctx.arc(moonX + moonRadius * 0.25, moonY + moonRadius * 0.3, moonRadius * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSceneryForeground() {
        const horizon = height * 0.86;

        if (state.scenery === 'city') {
          // Water Reflection Base
          const waterGrad = ctx.createLinearGradient(0, horizon, 0, height);
          waterGrad.addColorStop(0, '#040816');
          waterGrad.addColorStop(1, '#01030a');
          ctx.fillStyle = waterGrad;
          ctx.fillRect(0, horizon, width, height - horizon);

          // Water ripple lines
          ctx.save();
          ctx.strokeStyle = 'rgba(100, 180, 255, 0.08)';
          ctx.lineWidth = 1;
          for (let y = horizon + 5; y < height; y += 8) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }
          ctx.restore();

          // City Skyline Silhouette
          ctx.save();
          ctx.fillStyle = '#050711';
          
          // Generate procedural skyscrapers based on width
          const buildingWidth = 36;
          const totalBuildings = Math.ceil(width / buildingWidth) + 1;
          
          for (let i = 0; i < totalBuildings; i++) {
            const bx = i * buildingWidth;
            // Pseudo-random deterministic heights using sine hashes
            const seed = Math.sin(i * 997.3) * 10000;
            const pseudoRand = seed - Math.floor(seed);
            const bHeight = 40 + pseudoRand * (height * 0.18);
            const by = horizon - bHeight;

            ctx.fillRect(bx, by, buildingWidth + 1, bHeight);

            // Roof antenna / spire on tall towers
            if (pseudoRand > 0.7) {
              ctx.strokeStyle = '#050711';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(bx + buildingWidth / 2, by);
              ctx.lineTo(bx + buildingWidth / 2, by - 16);
              ctx.stroke();

              // Red aviation light blink
              if (Math.sin(frameCount * 0.05 + i) > 0) {
                ctx.fillStyle = 'rgba(255, 30, 30, 0.85)';
                ctx.beginPath();
                ctx.arc(bx + buildingWidth / 2, by - 16, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#050711';
              }
            }

            // Window lights
            const rows = Math.floor(bHeight / 10);
            const cols = 3;
            for (let r = 1; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const winSeed = Math.sin(i * 31 + r * 17 + c * 7);
                if (winSeed > 0.2) {
                  const winAlpha = 0.2 + (winSeed * 0.5);
                  ctx.fillStyle = winSeed > 0.8 ? `rgba(255, 230, 150, ${winAlpha})` : `rgba(150, 200, 255, ${winAlpha})`;
                  ctx.fillRect(bx + 4 + c * 9, by + r * 10, 4, 5);
                }
              }
            }
            ctx.fillStyle = '#050711';
          }
          ctx.restore();
        } else if (state.scenery === 'mountains') {
          // Layered Mountain Ridges
          ctx.save();
          // Back Ridge
          ctx.fillStyle = '#080c1e';
          ctx.beginPath();
          ctx.moveTo(0, horizon);
          for (let x = 0; x <= width; x += 50) {
            const mh = Math.sin(x * 0.003) * 60 + Math.cos(x * 0.007) * 40;
            ctx.lineTo(x, horizon - 80 - mh);
          }
          ctx.lineTo(width, height);
          ctx.lineTo(0, height);
          ctx.closePath();
          ctx.fill();

          // Front Ridge with Pine trees
          ctx.fillStyle = '#03050c';
          ctx.beginPath();
          ctx.moveTo(0, horizon);
          for (let x = 0; x <= width; x += 40) {
            const mh = Math.sin(x * 0.005 + 2) * 40 + Math.cos(x * 0.009) * 25;
            ctx.lineTo(x, horizon - 20 - mh);
          }
          ctx.lineTo(width, height);
          ctx.lineTo(0, height);
          ctx.closePath();
          ctx.fill();

          // Pine Trees
          ctx.fillStyle = '#020308';
          for (let x = 10; x < width; x += 18) {
            const treeHeight = 22 + Math.sin(x * 123.4) * 12;
            const treeBaseY = horizon + 5;
            ctx.beginPath();
            ctx.moveTo(x, treeBaseY - treeHeight);
            ctx.lineTo(x - 7, treeBaseY);
            ctx.lineTo(x + 7, treeBaseY);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        } else if (state.scenery === 'ocean') {
          // Ocean with vast reflective horizon
          const oceanGrad = ctx.createLinearGradient(0, horizon, 0, height);
          oceanGrad.addColorStop(0, '#060d24');
          oceanGrad.addColorStop(1, '#01030a');
          ctx.fillStyle = oceanGrad;
          ctx.fillRect(0, horizon, width, height - horizon);

          // Water surface glow lines
          ctx.save();
          ctx.strokeStyle = 'rgba(120, 190, 255, 0.12)';
          ctx.lineWidth = 1.2;
          for (let y = horizon + 4; y < height; y += 6) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // --- MAIN ANIMATION LOOP ---
      function animate() {
        requestAnimationFrame(animate);
        frameCount++;

        // Fading canvas clear for particle trail bloom effect
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgba(3, 3, 8, ${state.trailOpacity})`;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();

        // Render scenery sky behind bright glows
        if (frameCount % 60 === 0) {
          // Subtle sky refresh prevents trail smearing over time
        }

        // Additive blending for vibrant luminous particle explosions
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        // 1. Update & Draw Rockets
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          if (!r.update()) {
            rockets.splice(i, 1);
          } else {
            r.draw(ctx);
          }
        }

        // 2. Update & Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          if (!p.update()) {
            particles.splice(i, 1);
          } else {
            p.draw(ctx);
          }
        }
        ctx.restore();

        // 3. Render Scenery Foreground (Silhouettes & Horizon)
        drawSceneryForeground();

        // 4. Autonomous Spawning Logic
        if (state.autoLaunch && !state.isFinale) {
          if (frameCount % state.launchInterval === 0) {
            launchRocket();
          }
          // Random simultaneous double/triple launches
          if (Math.random() < 0.015) {
            setTimeout(() => launchRocket(), 150);
          }
        }

        // 5. Grand Finale Mode Handling
        if (state.isFinale) {
          state.finaleTimer++;
          if (state.finaleTimer % 4 === 0 && state.finaleCount < 45) {
            launchRocket(
              width * 0.1 + Math.random() * (width * 0.8),
              height * 0.1 + Math.random() * (height * 0.45)
            );
            state.finaleCount++;
          }
          if (state.finaleCount >= 45 && rockets.length === 0 && particles.length < 10) {
            state.isFinale = false;
          }
        }

        // 6. Continuous Drag Launching
        if (isMouseDown) {
          dragLaunchTimer++;
          if (dragLaunchTimer % 10 === 0) {
            launchRocket(lastMousePos.x, lastMousePos.y);
          }
        }
      }

      // --- RESIZE HANDLER ---
      function handleResize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        initStars();
        drawBackground();
      }

      // --- EVENT LISTENERS & CONTROLS ---
      window.addEventListener('resize', handleResize);

      // Canvas Pointer Events
      function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      canvas.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        dragLaunchTimer = 0;
        const pos = getCanvasCoordinates(e);
        lastMousePos = pos;
        launchRocket(pos.x, pos.y);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (isMouseDown) {
          lastMousePos = getCanvasCoordinates(e);
        }
      });

      window.addEventListener('mouseup', () => {
        isMouseDown = false;
      });

      // Touch Events for Mobile / Tablet
      canvas.addEventListener('touchstart', (e) => {
        isMouseDown = true;
        dragLaunchTimer = 0;
        const pos = getCanvasCoordinates(e);
        lastMousePos = pos;
        launchRocket(pos.x, pos.y);
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (isMouseDown) {
          lastMousePos = getCanvasCoordinates(e);
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        isMouseDown = false;
      });

      // UI Control Bindings
      const toggleAuto = document.getElementById('toggle-auto');
      toggleAuto.addEventListener('change', (e) => {
        state.autoLaunch = e.target.checked;
      });

      const selectShell = document.getElementById('select-shell');
      selectShell.addEventListener('change', (e) => {
        state.shellType = e.target.value;
      });

      const selectPalette = document.getElementById('select-palette');
      selectPalette.addEventListener('change', (e) => {
        state.palette = e.target.value;
      });

      const selectScenery = document.getElementById('select-scenery');
      selectScenery.addEventListener('change', (e) => {
        state.scenery = e.target.value;
      });

      const sliderTrails = document.getElementById('slider-trails');
      sliderTrails.addEventListener('input', (e) => {
        state.trailOpacity = parseFloat(e.target.value);
      });

      const sliderRate = document.getElementById('slider-rate');
      sliderRate.addEventListener('input', (e) => {
        // Inverted so higher slider value = faster pace
        state.launchInterval = 95 - parseInt(e.target.value, 10);
      });

      // Top Action Buttons
      const btnSound = document.getElementById('btn-sound');
      const soundIcon = document.getElementById('sound-icon');
      const soundText = document.getElementById('sound-text');
      btnSound.addEventListener('click', () => {
        initAudio();
        state.soundEnabled = !state.soundEnabled;
        if (state.soundEnabled) {
          soundIcon.textContent = '🔊';
          soundText.textContent = 'Sound: ON';
          btnSound.classList.remove('active');
        } else {
          soundIcon.textContent = '🔇';
          soundText.textContent = 'Sound: OFF';
          btnSound.classList.add('active');
        }
      });

      const btnFinale = document.getElementById('btn-finale');
      btnFinale.addEventListener('click', () => {
        triggerGrandFinale();
      });

      const btnFullscreen = document.getElementById('btn-fullscreen');
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.textContent = '✕ Exit Full';
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
          btnFullscreen.textContent = '⛶ Fullscreen';
        }
      });

      // Initialize Canvas and kick off animation loop
      handleResize();
      animate();

      // Launch an initial welcoming burst after brief delay
      setTimeout(() => {
        launchRocket(width * 0.5, height * 0.3, 'peony');
      }, 400);
      setTimeout(() => {
        launchRocket(width * 0.35, height * 0.25, 'willow');
        launchRocket(width * 0.65, height * 0.28, 'ring');
      }, 1000);

    })();
  </script>
</body>
</html>
