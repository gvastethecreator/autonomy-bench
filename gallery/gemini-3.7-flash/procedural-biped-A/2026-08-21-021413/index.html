<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Biped Walking Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">Procedural Biped • Drag to Orbit • Scroll to Zoom</div>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.Fog(0x0f172a, 30, 100);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 4.5, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Studio Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
    keyLight.position.set(12, 20, 15);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xf43f5e, 0.9);
    rimLight.position.set(-12, 12, -15);
    scene.add(rimLight);

    // Grid Floor
    const grid = new THREE.GridHelper(80, 40, 0x38bdf8, 0x1e293b);
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x070d19, roughness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Materials
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4, metalness: 0.3 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3, metalness: 0.7 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.5 });

    // Biped Skeleton Hierarchy
    const root = new THREE.Group();
    scene.add(root);

    // Pelvis
    const pelvis = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 1.0), bodyMat);
    pelvis.position.y = 3.6;
    pelvis.castShadow = true;
    root.add(pelvis);

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.4, 1.1), bodyMat);
    torso.position.set(0, 1.2, 0);
    torso.castShadow = true;
    pelvis.add(torso);

    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), headMat);
    head.position.set(0, 1.3, 0);
    head.castShadow = true;
    torso.add(head);

    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
    visor.position.set(0, 0.1, 0.46);
    head.add(visor);

    function createLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.7, -0.2, 0);

      const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), bodyMat);
      thigh.position.y = -0.7;
      thigh.castShadow = true;
      hip.add(thigh);

      const knee = new THREE.Group();
      knee.position.set(0, -1.4, 0);
      const kneeCap = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), jointMat);
      knee.add(kneeCap);
      hip.add(knee);

      const calf = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.4, 0.45), bodyMat);
      calf.position.y = -0.7;
      calf.castShadow = true;
      knee.add(calf);

      const foot = new THREE.Group();
      foot.position.set(0, -1.4, 0);
      const footMesh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 1.1), jointMat);
      footMesh.position.set(0, -0.15, 0.25);
      footMesh.castShadow = true;
      foot.add(footMesh);
      knee.add(foot);

      return { hip, knee, foot };
    }

    function createArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 1.1, 0.5, 0);

      const bicep = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), bodyMat);
      bicep.position.y = -0.6;
      bicep.castShadow = true;
      shoulder.add(bicep);

      const elbow = new THREE.Group();
      elbow.position.set(0, -1.2, 0);
      const elbowCap = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), jointMat);
      elbow.add(elbowCap);
      shoulder.add(elbow);

      const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.1, 0.35), bodyMat);
      forearm.position.y = -0.55;
      forearm.castShadow = true;
      elbow.add(forearm);

      return { shoulder, elbow };
    }

    const leftLeg = createLeg(-1);
    const rightLeg = createLeg(1);
    pelvis.add(leftLeg.hip);
    pelvis.add(rightLeg.hip);

    const leftArm = createArm(-1);
    const rightArm = createArm(1);
    torso.add(leftArm.shoulder);
    torso.add(rightArm.shoulder);

    // Orbit Camera
    let isMouseDown = false;
    let prevMouse = { x: 0, y: 0 };
    let sph = { r: 11, phi: Math.PI / 2.6, theta: 0 };

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      sph.theta -= dx * 0.006;
      sph.phi = Math.max(0.1, Math.min(Math.PI / 2.05, sph.phi - dy * 0.006));
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('wheel', (e) => {
      sph.r = Math.max(4, Math.min(25, sph.r + e.deltaY * 0.01));
    });

    let phase = 0;
    const gaitSpeed = 3.5;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      phase += delta * gaitSpeed;

      // Bobbing & Sway
      const bob = Math.abs(Math.sin(phase * 2)) * 0.25;
      pelvis.position.y = 3.5 - bob;
      pelvis.rotation.y = Math.sin(phase) * 0.12;
      pelvis.rotation.z = Math.cos(phase) * 0.06;

      torso.rotation.y = -Math.sin(phase) * 0.1;
      torso.rotation.x = 0.1 + Math.sin(phase * 2) * 0.04;

      // Left Leg
      const lSwing = Math.sin(phase);
      leftLeg.hip.rotation.x = lSwing * 0.65;
      leftLeg.knee.rotation.x = lSwing < 0 ? Math.abs(Math.sin(phase)) * 0.9 : 0.05;
      leftLeg.foot.rotation.x = -leftLeg.hip.rotation.x - leftLeg.knee.rotation.x;

      // Right Leg
      const rSwing = Math.sin(phase + Math.PI);
      rightLeg.hip.rotation.x = rSwing * 0.65;
      rightLeg.knee.rotation.x = rSwing < 0 ? Math.abs(Math.sin(phase + Math.PI)) * 0.9 : 0.05;
      rightLeg.foot.rotation.x = -rightLeg.hip.rotation.x - rightLeg.knee.rotation.x;

      // Arms
      leftArm.shoulder.rotation.x = -lSwing * 0.5;
      leftArm.elbow.rotation.x = -0.3 - Math.max(0, lSwing) * 0.4;

      rightArm.shoulder.rotation.x = -rSwing * 0.5;
      rightArm.elbow.rotation.x = -0.3 - Math.max(0, rSwing) * 0.4;

      camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
      camera.position.y = sph.r * Math.cos(sph.phi) + 2.5;
      camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
      camera.lookAt(0, 2.8, 0);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
