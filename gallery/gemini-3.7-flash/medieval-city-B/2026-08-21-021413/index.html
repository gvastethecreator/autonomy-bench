<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Ravenclaw — Island Canal Fortress</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1527; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    #ui-hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .parchment-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .btn {
      pointer-events: auto;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fef3c7;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(245, 158, 11, 0.35); border-color: #f59e0b; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui-hud">
    <div class="top-bar">
      <div class="parchment-card" style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 24px;">⚓</span>
        <div>
          <div style="font-size: 15px; font-weight: 800; letter-spacing: 0.05em;">PORT RAVENCLAW</div>
          <div style="font-size: 11px; color: #f59e0b;">MEDIEVAL CANAL HARBOR & CITADEL</div>
        </div>
      </div>
      <div class="parchment-card" style="display: flex; gap: 16px; text-align: right;">
        <div>
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Atmosphere</div>
          <div style="font-size: 16px; font-weight: 800;" id="tod-disp">Golden Dusk</div>
        </div>
        <div>
          <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Guild Population</div>
          <div style="font-size: 16px; font-weight: 800;">45 Artisans</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div style="display: flex; gap: 8px; pointer-events: auto;">
        <button id="btn-tod" class="btn">☀️ Time: Advance</button>
        <button id="btn-cam" class="btn">🎥 Cam: Harbor Orbit</button>
        <button id="btn-audio" class="btn">🎵 Lute Melody: Off</button>
        <button id="btn-regen" class="btn">🎲 Re-seed Port</button>
      </div>
      <div class="parchment-card" style="font-size: 11px; color: #cbd5e1;">
        Water canals • Moving sailing skiffs • Working windmill • Animated NPCs
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Medieval Audio Synth
    let audioCtx = null;
    let luteGain = null;
    let isLuteOn = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      luteGain = audioCtx.createGain();
      luteGain.gain.value = 0.08;
      luteGain.connect(audioCtx.destination);

      const notes = [220, 261.63, 293.66, 329.63, 392.00, 440.00];
      function playLute() {
        if (!isLuteOn || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(g);
        g.connect(luteGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.3);
        setTimeout(playLute, 600 + Math.random() * 800);
      }
      playLute();
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfb923c);
    scene.fog = new THREE.FogExp2(0xfb923c, 0.004);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // Sunlight
    const hemi = new THREE.HemisphereLight(0xfde68a, 0x1e293b, 0.65);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffedd5, 1.8);
    sun.position.set(100, 140, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.left = -140;
    sun.shadow.camera.right = 140;
    sun.shadow.camera.top = 140;
    sun.shadow.camera.bottom = -140;
    scene.add(sun);

    // Ocean & Canal Water
    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.8 })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = -0.5;
    scene.add(water);

    // City Master Group
    let cityMaster = new THREE.Group();
    scene.add(cityMaster);

    let citizens = [];
    let windmills = [];
    let boats = [];

    // Materials Palette
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 });
    const plasterMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.9 });
    const redRoof = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.5 });
    const slateRoof = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });

    function buildRavenclaw() {
      while (cityMaster.children.length > 0) {
        cityMaster.remove(cityMaster.children[0]);
      }
      citizens = [];
      windmills = [];
      boats = [];

      // 1. Two Stone Island Districts connected by Stone Arch Bridge
      const islandGeoL = new THREE.BoxGeometry(65, 1.8, 85);
      const islandL = new THREE.Mesh(islandGeoL, stoneMat);
      islandL.position.set(-40, 0.4, 0);
      islandL.receiveShadow = true;
      cityMaster.add(islandL);

      const islandGeoR = new THREE.BoxGeometry(65, 1.8, 85);
      const islandR = new THREE.Mesh(islandGeoR, stoneMat);
      islandR.position.set(40, 0.4, 0);
      islandR.receiveShadow = true;
      cityMaster.add(islandR);

      // Stone Bridge crossing central canal
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(20, 2.2, 10), stoneMat);
      bridge.position.set(0, 1.2, 0);
      bridge.castShadow = bridge.receiveShadow = true;
      cityMaster.add(bridge);

      // 2. High Watchtowers & Citadel Keep on West Island
      const keep = new THREE.Mesh(new THREE.BoxGeometry(18, 26, 18), stoneMat);
      keep.position.set(-45, 13, -20);
      keep.castShadow = keep.receiveShadow = true;
      cityMaster.add(keep);

      const keepSpire = new THREE.Mesh(new THREE.ConeGeometry(9, 14, 8), slateRoof);
      keepSpire.position.set(-45, 33, -20);
      keepSpire.castShadow = true;
      cityMaster.add(keepSpire);

      // 3. Harbor Wharfs & Docks with Boats
      for (let z of [-25, 15]) {
        const pier = new THREE.Mesh(new THREE.BoxGeometry(24, 0.8, 6), woodMat);
        pier.position.set(78, 0.5, z);
        pier.castShadow = true;
        cityMaster.add(pier);

        // Sailing Boat
        const boat = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.2, 12), woodMat);
        hull.position.y = 0.4;
        boat.add(hull);

        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 10, 8), woodMat);
        mast.position.set(0, 5.2, 0);
        boat.add(mast);

        const sail = new THREE.Mesh(new THREE.PlaneGeometry(6, 7), new THREE.MeshLambertMaterial({ color: 0xf1f5f9, side: THREE.DoubleSide }));
        sail.position.set(0, 6, 0.1);
        boat.add(sail);

        boat.position.set(96, 0, z);
        cityMaster.add(boat);
        boats.push(boat);
      }

      // 4. Half-Timbered Town Houses across both Islands
      for (let isl of [-40, 40]) {
        for (let row = -3; row <= 3; row++) {
          for (let col = -2; col <= 2; col++) {
            const hx = isl + col * 12 + (Math.random() - 0.5) * 2;
            const hz = row * 11 + (Math.random() - 0.5) * 2;
            if (Math.hypot(hx - (-45), hz - (-20)) > 14) {
              const house = new THREE.Group();
              const w = 5 + Math.random() * 2;
              const d = 5 + Math.random() * 2;
              const h = 5 + Math.random() * 3;

              const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), plasterMat);
              body.position.y = h / 2 + 0.9;
              body.castShadow = body.receiveShadow = true;
              house.add(body);

              const rf = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.85, 3.5, 4), Math.random() > 0.4 ? redRoof : slateRoof);
              rf.position.y = h + 2.5;
              rf.rotation.y = Math.PI / 4;
              rf.castShadow = true;
              house.add(rf);

              house.position.set(hx, 0, hz);
              cityMaster.add(house);
            }
          }
        }
      }

      // 5. Windmill on North Cliff
      const wmGroup = new THREE.Group();
      const wmBase = new THREE.Mesh(new THREE.CylinderGeometry(3, 4.2, 12, 10), stoneMat);
      wmBase.position.y = 6;
      wmGroup.add(wmBase);

      const wmCap = new THREE.Mesh(new THREE.ConeGeometry(3.5, 3, 10), slateRoof);
      wmCap.position.y = 13.5;
      wmGroup.add(wmCap);

      const blades = new THREE.Group();
      blades.position.set(0, 11, 3.2);
      for (let b = 0; b < 4; b++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(1.0, 8, 0.1), woodMat);
        blade.rotation.z = (b * Math.PI) / 2;
        blade.position.y = Math.sin((b * Math.PI) / 2) * 4;
        blade.position.x = Math.cos((b * Math.PI) / 2) * 4;
        blades.add(blade);
      }
      wmGroup.add(blades);
      wmGroup.position.set(45, 0.9, -32);
      cityMaster.add(wmGroup);
      windmills.push(blades);

      // 6. Citizens / Artisans
      const npcColors = [0x2563eb, 0xd97706, 0x16a34a, 0xdc2626];
      for (let i = 0; i < 45; i++) {
        const npc = new THREE.Group();
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 1.1, 8), new THREE.MeshLambertMaterial({ color: npcColors[i % npcColors.length] }));
        b.position.y = 0.55;
        const hd = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), new THREE.MeshLambertMaterial({ color: 0xfcd34d }));
        hd.position.y = 1.3;
        npc.add(b);
        npc.add(hd);

        const islandPick = Math.random() > 0.5 ? -40 : 40;
        const nx = islandPick + (Math.random() - 0.5) * 45;
        const nz = (Math.random() - 0.5) * 70;
        npc.position.set(nx, 1.3, nz);
        cityMaster.add(npc);

        citizens.push({
          group: npc,
          dir: Math.random() * Math.PI * 2,
          speed: 0.3 + Math.random() * 0.4,
          phase: Math.random() * 10
        });
      }
    }

    buildRavenclaw();

    // Time of Day
    const todDisp = document.getElementById('tod-disp');
    let tod = 0;
    const btnTod = document.getElementById('btn-tod');
    btnTod.onclick = () => {
      tod = (tod + 1) % 3;
      if (tod === 0) {
        scene.background.set(0xfb923c);
        scene.fog.color.set(0xfb923c);
        sun.color.set(0xffedd5);
        todDisp.textContent = 'Golden Dusk';
      } else if (tod === 1) {
        scene.background.set(0x0a1020);
        scene.fog.color.set(0x0a1020);
        sun.color.set(0x38bdf8);
        todDisp.textContent = 'Night Mist';
      } else {
        scene.background.set(0x7dd3fc);
        scene.fog.color.set(0x7dd3fc);
        sun.color.set(0xffffff);
        todDisp.textContent = 'High Noon';
      }
    };

    let camMode = 'orbit';
    const btnCam = document.getElementById('btn-cam');
    btnCam.onclick = () => {
      camMode = camMode === 'orbit' ? 'canal' : 'orbit';
      btnCam.textContent = camMode === 'orbit' ? '🎥 Cam: Harbor Orbit' : '🎥 Cam: Canal Boat';
    };

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.onclick = () => {
      initAudio();
      isLuteOn = !isLuteOn;
      btnAudio.textContent = isLuteOn ? '🎵 Lute Melody: Active' : '🔇 Audio: Muted';
    };

    document.getElementById('btn-regen').onclick = () => { buildRavenclaw(); };

    // Orbit Controls
    let isMouseDown = false;
    let prevMouse = { x: 0, y: 0 };
    let sph = { r: 160, phi: Math.PI / 3.2, theta: Math.PI / 4 };

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      sph.theta -= dx * 0.005;
      sph.phi = Math.max(0.2, Math.min(Math.PI / 2.1, sph.phi - dy * 0.005));
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('wheel', (e) => {
      sph.r = Math.max(40, Math.min(300, sph.r + e.deltaY * 0.12));
    });

    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (!isMouseDown && camMode === 'orbit') {
        sph.theta += 0.035 * delta;
      }

      if (camMode === 'orbit') {
        camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
        camera.position.y = sph.r * Math.cos(sph.phi);
        camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
        camera.lookAt(0, 10, 0);
      } else {
        // Canal tour
        const t = now * 0.0004;
        camera.position.set(0, 3.5, Math.sin(t) * 40);
        camera.lookAt(0, 4, Math.sin(t) * 40 - 15);
      }

      // Windmill rotation
      for (const w of windmills) w.rotation.z += 1.4 * delta;

      // Boats bob
      for (let i = 0; i < boats.length; i++) {
        boats[i].position.y = Math.sin(now * 0.002 + i) * 0.25;
      }

      // NPCs walk
      for (const npc of citizens) {
        npc.group.position.x += Math.cos(npc.dir) * npc.speed * delta * 5;
        npc.group.position.z += Math.sin(npc.dir) * npc.speed * delta * 5;
        npc.group.rotation.y = -npc.dir - Math.PI / 2;
        npc.phase += delta * 8;
        npc.group.position.y = 1.3 + Math.abs(Math.sin(npc.phase)) * 0.12;

        if (Math.abs(npc.group.position.x) > 65 || Math.abs(npc.group.position.z) > 40) {
          npc.dir += Math.PI;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
