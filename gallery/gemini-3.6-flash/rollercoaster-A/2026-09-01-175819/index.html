<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>HyperCoaster 3D - Ultimate First-Person Rollercoaster</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* HUD Overlay */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .hud-element {
      pointer-events: auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .brand-title {
      background: rgba(10, 16, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .brand-title h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #00c6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .brand-title p {
      font-size: 0.72rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* Telemetry Panel */
    .telemetry-card {
      background: rgba(10, 16, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .stat-unit {
      font-size: 0.65rem;
      color: #64748b;
      margin-left: 2px;
    }
    .g-force-meter {
      position: relative;
      width: 44px;
      height: 44px;
    }
    .g-force-meter svg {
      width: 44px;
      height: 44px;
      transform: rotate(-90deg);
    }
    .g-force-meter circle.bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 4;
    }
    .g-force-meter circle.fill {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 4;
      stroke-dasharray: 100;
      stroke-dashoffset: 60;
      transition: stroke-dashoffset 0.1s ease, stroke 0.2s ease;
    }
    .g-meter-val {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      font-weight: bold;
    }

    /* Bottom Controls */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .controls-panel {
      background: rgba(10, 16, 30, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e2e8f0;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .btn.active {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    /* Minimap & Progress */
    .minimap-container {
      background: rgba(10, 16, 30, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #minimap {
      width: 140px;
      height: 100px;
      border-radius: 6px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    #track-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.05s linear;
    }

    /* Crosshair for Look-around */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      opacity: 0.3;
      transition: opacity 0.3s;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: #fff;
    }
    #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
    #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

    /* Audio Banner / Start Prompt */
    #sound-banner {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 165, 233, 0.9);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.6);
      animation: pulse 2s infinite ease-in-out;
      transition: opacity 0.5s, transform 0.5s;
    }
    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }
    #sound-banner.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
      pointer-events: none;
    }

    /* Speed lines overlay (canvas) */
    #speed-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Instructions Modal */
    .hints {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 4px;
      text-align: center;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .brand-title h1 { font-size: 1rem; }
      .telemetry-card { padding: 8px 12px; gap: 10px; }
      .stat-value { font-size: 1.1rem; }
      .controls-panel { flex-wrap: wrap; max-width: 280px; }
      .minimap-container { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <canvas id="speed-canvas"></canvas>

  <div id="hud">
    <!-- Top Bar -->
    <div class="top-bar hud-element">
      <div class="brand-title">
        <h1>Titan Apex 360</h1>
        <p>Giga-Coaster • Height: 95m • Speed: 135 km/h</p>
      </div>

      <div class="telemetry-card">
        <div class="stat-box">
          <span class="stat-label">Velocity</span>
          <div><span id="speed-val" class="stat-value">0</span><span class="stat-unit">KM/H</span></div>
        </div>
        <div class="stat-box">
          <span class="stat-label">Altitude</span>
          <div><span id="alt-val" class="stat-value">15</span><span class="stat-unit">M</span></div>
        </div>
        <div class="stat-box">
          <span class="stat-label">G-Force</span>
          <div class="g-force-meter">
            <svg>
              <circle class="bg" cx="22" cy="22" r="16" />
              <circle id="g-ring" class="fill" cx="22" cy="22" r="16" />
            </svg>
            <span id="g-val" class="g-meter-val">1.0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Center sound prompt -->
    <div id="sound-banner" class="hud-element" onclick="initAudio()">
      <span>🔊 Click anywhere to Enable Audio & Sound FX</span>
    </div>

    <!-- Center crosshair -->
    <div id="crosshair"></div>

    <!-- Bottom Controls -->
    <div class="bottom-bar hud-element">
      <div class="controls-panel">
        <button id="btn-pov" class="btn active" onclick="setCameraMode('pov')">
          <span>🎯 Front POV</span>
        </button>
        <button id="btn-nose" class="btn" onclick="setCameraMode('nose')">
          <span>🚀 Nose Cam</span>
        </button>
        <button id="btn-chase" class="btn" onclick="setCameraMode('chase')">
          <span>🏎️ 3rd Person</span>
        </button>
        <button id="btn-orbit" class="btn" onclick="setCameraMode('orbit')">
          <span>🚁 Free Orbit</span>
        </button>
        <button id="btn-tod" class="btn" onclick="toggleTimeOfDay()">
          <span id="tod-icon">🌅 Sunset</span>
        </button>
        <button id="btn-audio" class="btn" onclick="toggleAudio()">
          <span id="audio-icon">🔇 Audio</span>
        </button>
      </div>

      <div class="minimap-container">
        <canvas id="minimap" width="140" height="100"></canvas>
        <div class="progress-bar-wrap">
          <div id="track-progress"></div>
        </div>
        <div class="hints">Drag mouse to look around • Continuous Loop</div>
      </div>
    </div>
  </div>

  <!-- CDN Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    /* ==========================================================================
       1. TRACK SPLINE & ROLLERCOASTER PATH DESIGN
       ========================================================================== */
    // Coaster Path Control Points (Closed Loop)
    // Coaster layout includes:
    // - Station Platform & Slow Dispatch
    // - High-angle Chain Lift Hill (to ~95m)
    // - Giant 85-degree 1st Drop
    // - Overbanked Wave Turn
    // - Huge Vertical Dive Loop
    // - High-G Camelback Airtime Hill (-0.3G)
    // - 360-degree Barrel / Heartline Roll through Canyon
    // - Water Splashdown Low-Altitude Trench with Fountain Sprays
    // - Dual High-Speed Helix Spirals
    // - Final S-Curve brake run back into Station
    
    const trackPoints = [
      // Station & Dispatch (y: 15)
      new THREE.Vector3(0, 15, 0),
      new THREE.Vector3(25, 15, 0),
      new THREE.Vector3(45, 15, 10),
      new THREE.Vector3(60, 15, 30),
      
      // Chain Lift Hill Base to Peak
      new THREE.Vector3(65, 16, 60),
      new THREE.Vector3(65, 45, 120),
      new THREE.Vector3(65, 75, 180),
      new THREE.Vector3(65, 96, 230),  // Crest Peak (96m)
      
      // Crest and Monster First Drop (Plunge down to y: 6m)
      new THREE.Vector3(65, 94, 255),
      new THREE.Vector3(60, 70, 280),
      new THREE.Vector3(40, 25, 305),
      new THREE.Vector3(15, 6, 315),   // Valley bottom (Speed max: ~135 km/h)
      
      // Overbanked High-G Turn
      new THREE.Vector3(-25, 28, 305),
      new THREE.Vector3(-60, 48, 270),
      new THREE.Vector3(-75, 30, 220),
      
      // Giant Vertical Dive Loop (y reaches 72m)
      new THREE.Vector3(-75, 12, 160),
      new THREE.Vector3(-75, 42, 120),
      new THREE.Vector3(-75, 72, 90),   // Inverted Top of Loop
      new THREE.Vector3(-75, 42, 60),
      new THREE.Vector3(-75, 8, 30),
      
      // Camelback Airtime Hill 1
      new THREE.Vector3(-60, 38, -20),
      new THREE.Vector3(-45, 52, -60),  // Floating airtime crest
      new THREE.Vector3(-30, 14, -100),
      
      // Canyon Heartline Roll / Corkscrew entry
      new THREE.Vector3(-10, 8, -135),
      new THREE.Vector3(20, 16, -165),
      new THREE.Vector3(55, 22, -180),  // 360-roll
      new THREE.Vector3(90, 14, -170),
      
      // Water Splashdown Bay (Skimming low at y: 4.5 over Lake)
      new THREE.Vector3(120, 4.5, -130),
      new THREE.Vector3(135, 4.5, -80),
      new THREE.Vector3(130, 8, -30),
      
      // Ascending Upward Double Helix
      new THREE.Vector3(110, 22, 10),
      new THREE.Vector3(80, 36, 15),
      new THREE.Vector3(60, 46, -15),
      new THREE.Vector3(75, 54, -45),
      new THREE.Vector3(105, 42, -55),
      new THREE.Vector3(120, 28, -25),
      
      // Mid-course Camelback & S-Bends
      new THREE.Vector3(100, 16, 20),
      new THREE.Vector3(65, 26, 40),
      new THREE.Vector3(25, 15, 30),
      new THREE.Vector3(-15, 15, 15),
      new THREE.Vector3(-20, 15, 0),
      new THREE.Vector3(-10, 15, 0)
    ];

    // Build CatmullRom Curve
    const coasterCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal', 0.5);

    // Explicit custom bank angle mapping along the track (sample fractions -> roll angle in radians)
    // Enables authentic banking into turns and full 360 inversions
    const rollKeys = [
      { u: 0.00, roll: 0 },
      { u: 0.08, roll: 0 },       // Lift hill
      { u: 0.20, roll: 0 },       // Crest
      { u: 0.24, roll: 0.2 },     // Drop banking
      { u: 0.31, roll: 1.2 },     // Overbanked Turn
      { u: 0.38, roll: 0.0 },     // Loop base
      { u: 0.42, roll: Math.PI }, // Inversion inside Vertical Loop
      { u: 0.46, roll: 0.0 },     // Loop exit
      { u: 0.52, roll: -0.2 },    // Airtime hill
      { u: 0.58, roll: Math.PI }, // Corkscrew / Heartline roll
      { u: 0.62, roll: Math.PI * 2 }, // Return from roll
      { u: 0.68, roll: 0.7 },     // Water splash bank
      { u: 0.78, roll: -0.9 },    // Helix turn
      { u: 0.85, roll: -0.9 },    // Helix turn 2
      { u: 0.94, roll: 0.3 },     // S-Turn
      { u: 1.00, roll: 0 }        // Station
    ];

    function getCustomRoll(u) {
      u = (u % 1 + 1) % 1;
      // Linear interpolation between roll keys
      for (let i = 0; i < rollKeys.length - 1; i++) {
        if (u >= rollKeys[i].u && u <= rollKeys[i + 1].u) {
          const t = (u - rollKeys[i].u) / (rollKeys[i + 1].u - rollKeys[i].u);
          const smoothT = t * t * (3 - 2 * t);
          return THREE.MathUtils.lerp(rollKeys[i].roll, rollKeys[i + 1].roll, smoothT);
        }
      }
      return 0;
    }

    /* ==========================================================================
       2. THREE.JS SCENE, RENDERER, LIGHTING & ENVIRONMENT
       ========================================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1226);
    scene.fog = new THREE.FogExp2(0x0a1226, 0.002);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Orbit Controls for free camera mode
    const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.05;
    orbitControls.maxDistance = 600;
    orbitControls.minDistance = 2;
    orbitControls.enabled = false;

    // Ambient & Directional Sun Lights
    const hemiLight = new THREE.HemisphereLight(0xb1e1ff, 0x384028, 0.6);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
    sunLight.position.set(200, 300, 150);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 800;
    const d = 250;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Sunset / Night Light state
    let timeOfDay = 'sunset'; // 'day', 'sunset', 'night'
    const skyDomeGeo = new THREE.SphereGeometry(900, 32, 20);
    const skyDomeMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: false, color: 0x224477 });
    const skyDome = new THREE.Mesh(skyDomeGeo, skyDomeMat);
    scene.add(skyDome);

    function updateSkyLighting() {
      if (timeOfDay === 'sunset') {
        scene.background.setHex(0x1a0f2e);
        scene.fog.color.setHex(0x2d1738);
        skyDomeMat.color.setHex(0x381944);
        sunLight.color.setHex(0xffaa55);
        sunLight.intensity = 1.2;
        sunLight.position.set(250, 80, -200);
        hemiLight.color.setHex(0xff9977);
        hemiLight.groundColor.setHex(0x221133);
        hemiLight.intensity = 0.6;
        document.getElementById('tod-icon').innerText = '🌙 Night';
      } else if (timeOfDay === 'night') {
        scene.background.setHex(0x030712);
        scene.fog.color.setHex(0x050b18);
        skyDomeMat.color.setHex(0x040817);
        sunLight.color.setHex(0x4466aa);
        sunLight.intensity = 0.4;
        sunLight.position.set(-100, 150, 100);
        hemiLight.color.setHex(0x223355);
        hemiLight.groundColor.setHex(0x050a14);
        hemiLight.intensity = 0.3;
        document.getElementById('tod-icon').innerText = '☀️ Day';
      } else {
        // Day
        scene.background.setHex(0x4fa8ff);
        scene.fog.color.setHex(0x89c7ff);
        skyDomeMat.color.setHex(0x4296eb);
        sunLight.color.setHex(0xffffff);
        sunLight.intensity = 1.4;
        sunLight.position.set(200, 300, 150);
        hemiLight.color.setHex(0xddeeff);
        hemiLight.groundColor.setHex(0x445533);
        hemiLight.intensity = 0.7;
        document.getElementById('tod-icon').innerText = '🌅 Sunset';
      }
    }
    updateSkyLighting();

    /* ==========================================================================
       3. PROCEDURAL TERRAIN, CANYON, WATER & THEME PARK SCENERY
       ========================================================================== */
    // Terrain height function
    function getTerrainHeight(x, z) {
      // Lake basin near x: 130, z: -100
      const lakeDist = Math.hypot(x - 125, z - 80);
      let h = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 12 +
              Math.sin(x * 0.03 + 1.2) * Math.cos(z * 0.035) * 6 +
              Math.sin(x * 0.005) * 15;
      
      // Mountain ridge to the west
      if (x < -100) {
        h += Math.pow(Math.abs(x + 100) * 0.12, 1.8);
      }
      // Canyon carving near corkscrew
      const canyonDist = Math.hypot(x - 40, z + 160);
      if (canyonDist < 50) {
        h -= (50 - canyonDist) * 0.35;
      }
      // Lake depression
      if (lakeDist < 90) {
        h -= (90 - lakeDist) * 0.25;
      }
      return Math.max(-8, h);
    }

    // Procedural Ground Mesh
    const terrainSize = 900;
    const terrainSegs = 140;
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegs, terrainSegs);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    const colors = new Float32Array(posAttr.count * 3);

    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      const y = getTerrainHeight(x, z);
      posAttr.setY(i, y);

      // Vertex color styling based on elevation & slope
      if (y < 2) {
        // Sand / shoreline
        colors[i * 3] = 0.76;
        colors[i * 3 + 1] = 0.70;
        colors[i * 3 + 2] = 0.50;
      } else if (y > 35) {
        // Mountain rock
        colors[i * 3] = 0.45;
        colors[i * 3 + 1] = 0.42;
        colors[i * 3 + 2] = 0.40;
      } else {
        // Lush green meadow
        const grassVar = (Math.sin(x * 0.1) + Math.cos(z * 0.1)) * 0.04;
        colors[i * 3] = 0.18 + grassVar;
        colors[i * 3 + 1] = 0.48 + grassVar;
        colors[i * 3 + 2] = 0.20 + grassVar;
      }
    }
    terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.85,
      metalness: 0.05,
      flatShading: true
    });
    const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    // Water Surface Plane (Lake)
    const waterGeo = new THREE.PlaneGeometry(350, 350, 32, 32);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x0066aa,
      roughness: 0.1,
      metalness: 0.85,
      transparent: true,
      opacity: 0.85
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);

    /* ==========================================================================
       4. ROLLERCOASTER TRACK 3D MESH GENERATION (TUBULAR STEEL & SLEEPERS)
       ========================================================================== */
    const TRACK_STEPS = 1200;
    const RAIL_GAUGE = 0.85;       // Half distance between left & right rails
    const RAIL_HEIGHT = 0.35;      // Height offset above center spine
    const SPINE_OFFSET = -0.3;     // Center spine vertical offset

    // Compute parallel transport frames along curve with custom banking
    const trackFrames = [];
    const sampleDt = 1.0 / TRACK_STEPS;

    // Initial reference up vector
    let prevUp = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i <= TRACK_STEPS; i++) {
      const u = (i / TRACK_STEPS) % 1.0;
      const point = coasterCurve.getPointAt(u);
      const tangent = coasterCurve.getTangentAt(u).normalize();

      // Parallel transport normal
      let normal = new THREE.Vector3().crossVectors(tangent, prevUp).cross(tangent).normalize();
      if (normal.lengthSq() < 0.001) {
        normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
      }
      let binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      // Apply intentional banking roll
      const roll = getCustomRoll(u);
      if (Math.abs(roll) > 0.001) {
        const cosR = Math.cos(roll);
        const sinR = Math.sin(roll);
        const bankedNormal = normal.clone().multiplyScalar(cosR).add(binormal.clone().multiplyScalar(sinR));
        const bankedBinormal = binormal.clone().multiplyScalar(cosR).sub(normal.clone().multiplyScalar(sinR));
        normal = bankedNormal.normalize();
        binormal = bankedBinormal.normalize();
      }

      prevUp.copy(normal);

      trackFrames.push({
        u,
        point,
        tangent,
        normal,
        binormal
      });
    }

    // Generate Tubular Rails Geometry
    function buildRailCurve(offsetBinormal, offsetNormal) {
      const points = [];
      for (let i = 0; i < TRACK_STEPS; i++) {
        const f = trackFrames[i];
        const p = f.point.clone()
          .addScaledVector(f.binormal, offsetBinormal)
          .addScaledVector(f.normal, offsetNormal);
        points.push(p);
      }
      return new THREE.CatmullRomCurve3(points, true);
    }

    const leftRailCurve = buildRailCurve(-RAIL_GAUGE, RAIL_HEIGHT);
    const rightRailCurve = buildRailCurve(RAIL_GAUGE, RAIL_HEIGHT);
    const spineRailCurve = buildRailCurve(0, SPINE_OFFSET);

    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      metalness: 0.85,
      roughness: 0.25
    });
    const spineMaterial = new THREE.MeshStandardMaterial({

    });

    const railRadius = 0.12;
    const spineRadius = 0.28;
    const leftRailMesh = new THREE.Mesh(new THREE.TubeGeometry(leftRailCurve, TRACK_STEPS, railRadius, 6, true), railMaterial);
    const rightRailMesh = new THREE.Mesh(new THREE.TubeGeometry(rightRailCurve, TRACK_STEPS, railRadius, 6, true), railMaterial);
    const spineMesh = new THREE.Mesh(new THREE.TubeGeometry(spineRailCurve, TRACK_STEPS, spineRadius, 8, true), spineMaterial);

    leftRailMesh.castShadow = true;
    rightRailMesh.castShadow = true;
    spineMesh.castShadow = true;

    scene.add(leftRailMesh);

    // Cross-ties (Ties connecting rails to spine)

    const tieCrossGeo = new THREE.CylinderGeometry(0.06, 0.06, RAIL_GAUGE * 2.1, 5);
    tieCrossGeo.rotateZ(Math.PI / 2);
    const tieVGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 4);

    const tieMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.4 });
    const tieInst = new THREE.InstancedMesh(tieCrossGeo, tieMat, tieCount);
    tieInst.castShadow = true;

    const tieMatrix = new THREE.Matrix4();
    const rotMatrix = new THREE.Matrix4();

    for (let i = 0; i < tieCount; i++) {
      const stepIdx = Math.floor((i / tieCount) * TRACK_STEPS);
      const f = trackFrames[stepIdx];

      const tiePos = f.point.clone().addScaledVector(f.normal, RAIL_HEIGHT * 0.8);
      
      // Orientation matrix: X=binormal, Y=normal, Z=tangent
      rotMatrix.makeBasis(f.binormal, f.normal, f.tangent);
      tieMatrix.makeTranslation(tiePos.x, tiePos.y, tiePos.z);
      tieMatrix.multiply(rotMatrix);

      tieInst.setMatrixAt(i, tieMatrix);
    }
    scene.add(tieInst);

    // Support Pillars (Lattice & Columns anchored down to ground)
    const pillarCount = 75;
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.6, roughness: 0.4 });
    const pillarGroup = new THREE.Group();

    // Neon Light Rings in Canyon Tunnel

    /* ==========================================================================

    const trainGroup = new THREE.Group();

    // Front Lead Cart Cockpit

    /* ==========================================================================
       6. SOUND SYNTHESIS ENGINE (WEB AUDIO API)
       ========================================================================== */
    let audioCtx = null;
    let audioEnabled = false;
    let masterGain = null;
    let liftGain = null;
    let windFilter = null;
    let windGain = null;
    let rumbleFilter = null;
    let rumbleGain = null;
    let lastLiftClickTime = 0;

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        audioEnabled = true;
        updateAudioUI();
        return;
      }

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);

        // 1. Wind Noise Synth (White noise with dynamic low-pass resonance)
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        windFilter = audioCtx.createBiquadFilter();
        windFilter.type = 'bandpass';
        windFilter.frequency.setValueAtTime(400, audioCtx.currentTime);
        windFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);

        windGain = audioCtx.createGain();
        windGain.gain.setValueAtTime(0.01, audioCtx.currentTime);

        whiteNoise.connect(windFilter);
        windFilter.connect(windGain);
        windGain.connect(masterGain);
        whiteNoise.start(0);

        // 2. Track Wheel Rumble Synth (Sub-bass rumble)
        const rumbleNoise = audioCtx.createBufferSource();
        rumbleNoise.buffer = noiseBuffer;
        rumbleNoise.loop = true;

        rumbleFilter = audioCtx.createBiquadFilter();
        rumbleFilter.type = 'lowpass';
        rumbleFilter.frequency.setValueAtTime(120, audioCtx.currentTime);

        rumbleGain = audioCtx.createGain();
        rumbleGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

        rumbleNoise.connect(rumbleFilter);
        rumbleFilter.connect(rumbleGain);
        rumbleGain.connect(masterGain);
        rumbleNoise.start(0);

        audioEnabled = true;
        updateAudioUI();
        document.getElementById('sound-banner').classList.add('hidden');
      } catch (e) {
        console.warn('Web Audio could not be initialized:', e);
      }
    }

    function playLiftClick() {
      if (!audioCtx || !audioEnabled) return;
      const now = audioCtx.currentTime;
      if (now - lastLiftClickTime < 0.12) return;
      lastLiftClickTime = now;

      // Mechanical metallic ratchet sound
      const osc = audioCtx.createOscillator();
      const clickGain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180 + Math.random() * 40, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);

      clickGain.gain.setValueAtTime(0.3, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      osc.connect(clickGain);
      clickGain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.06);
    }

    function playWaterSplash() {
      if (!audioCtx || !audioEnabled) return;
      const now = audioCtx.currentTime;
      const splashOsc = audioCtx.createOscillator();
      const sGain = audioCtx.createGain();
      splashOsc.type = 'sine';
      splashOsc.frequency.setValueAtTime(600, now);
      splashOsc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
      sGain.gain.setValueAtTime(0.2, now);
      sGain.gain.linearRampToValueAtTime(0.0, now + 0.35);
      splashOsc.connect(sGain);
      sGain.connect(masterGain);
      splashOsc.start(now);
      splashOsc.stop(now + 0.36);
    }

    function updateAudio(speedKmh, isLiftHill, isWaterSplash) {
      if (!audioCtx || !audioEnabled) return;

      const normSpeed = Math.min(speedKmh / 140.0, 1.0);

      // Wind modulation
      windFilter.frequency.setTargetAtTime(200 + normSpeed * 1800, audioCtx.currentTime, 0.05);
      windGain.gain.setTargetAtTime(normSpeed * 0.45, audioCtx.currentTime, 0.05);

      // Rumble modulation
      rumbleFilter.frequency.setTargetAtTime(80 + normSpeed * 350, audioCtx.currentTime, 0.05);
      rumbleGain.gain.setTargetAtTime(0.04 + normSpeed * 0.3, audioCtx.currentTime, 0.05);

      if (isLiftHill) {
        playLiftClick();
      }
      if (isWaterSplash) {
        playWaterSplash();
      }
    }

    function toggleAudio() {
      if (!audioCtx) {
        initAudio();
      } else {
        audioEnabled = !audioEnabled;
        if (masterGain) {
          masterGain.gain.setTargetAtTime(audioEnabled ? 0.7 : 0.0, audioCtx.currentTime, 0.05);
        }
        updateAudioUI();
      }
    }

    function updateAudioUI() {
      const btn = document.getElementById('btn-audio');
      const icon = document.getElementById('audio-icon');
      if (audioEnabled) {
        btn.classList.add('active');
        icon.innerText = '🔊 Audio ON';
      } else {
        btn.classList.remove('active');
        icon.innerText = '🔇 Audio OFF';
      }
    }

    /* ==========================================================================
       7. WATER SPLASH & SPEED PARTICLES
       ========================================================================== */
    const speedCanvas = document.getElementById('speed-canvas');
    const speedCtx = speedCanvas.getContext('2d');
    function resizeSpeedCanvas() {
      speedCanvas.width = window.innerWidth;
      speedCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeSpeedCanvas);
    resizeSpeedCanvas();

    // High speed radial streaks
    const speedParticles = [];
    for (let i = 0; i < 40; i++) {
      speedParticles.push({
        x: (Math.random() - 0.5) * window.innerWidth,
        y: (Math.random() - 0.5) * window.innerHeight,
        z: Math.random() * 1000 + 200,
        len: Math.random() * 40 + 20
      });
    }

    function drawSpeedLines(speedKmh) {
      speedCtx.clearRect(0, 0, speedCanvas.width, speedCanvas.height);
      if (speedKmh < 75 || cameraMode !== 'pov') return;

      const alpha = Math.min((speedKmh - 75) / 60.0, 0.6);
      const cx = speedCanvas.width / 2;
      const cy = speedCanvas.height / 2;

      speedCtx.strokeStyle = `rgba(180, 230, 255, ${alpha})`;
      speedCtx.lineWidth = 1.5;

      for (let p of speedParticles) {
        p.z -= speedKmh * 0.35;
        if (p.z <= 10) {
          p.z = 1000;
          p.x = (Math.random() - 0.5) * window.innerWidth * 1.5;
          p.y = (Math.random() - 0.5) * window.innerHeight * 1.5;
        }

        const k = 400 / p.z;
        const px = cx + p.x * k;
        const py = cy + p.y * k;
        const prevK = 400 / (p.z + p.len);
        const prevX = cx + p.x * prevK;
        const prevY = cy + p.y * prevK;

        speedCtx.beginPath();
        speedCtx.moveTo(prevX, prevY);
        speedCtx.lineTo(px, py);
        speedCtx.stroke();
      }
    }

    /* ==========================================================================
       8. PHYSICS SIMULATION & CONTINUOUS MOTION
       ========================================================================== */
    // Coaster Progress Along Closed Loop (0.0 to 1.0)
    let trackProgressU = 0.0;
    const MAX_ALTITUDE = 96.0;
    const GRAVITY = 9.81;
    let currentSpeedKmh = 0.0;
    let currentGForce = 1.0;

    // First Person Look-around Control
    let lookYaw = 0;
    let lookPitch = 0;
    let targetLookYaw = 0;
    let targetLookPitch = 0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.hud-element')) return;
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      initAudio();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || cameraMode === 'orbit') return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      targetLookYaw -= dx * 0.003;
      targetLookPitch -= dy * 0.003;
      targetLookPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetLookPitch));
      targetLookYaw = Math.max(-Math.PI / 1.8, Math.min(Math.PI / 1.8, targetLookYaw));
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.hud-element')) return;
      isDragging = true;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
      initAudio();
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging || cameraMode === 'orbit') return;
      const dx = e.touches[0].clientX - lastMouseX;
      const dy = e.touches[0].clientY - lastMouseY;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
      targetLookYaw -= dx * 0.004;
      targetLookPitch -= dy * 0.004;
      targetLookPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetLookPitch));
      targetLookYaw = Math.max(-Math.PI / 1.8, Math.min(Math.PI / 1.8, targetLookYaw));
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    // Camera Modes
    let cameraMode = 'pov'; // 'pov', 'nose', 'chase', 'orbit'

    function setCameraMode(mode) {
      cameraMode = mode;
      document.querySelectorAll('.controls-panel .btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (mode === 'orbit') {
        orbitControls.enabled = true;
        orbitControls.target.copy(trainGroup.position);
      } else {
        orbitControls.enabled = false;
        targetLookYaw = 0;
        targetLookPitch = 0;
      }
    }

    function toggleTimeOfDay() {
      if (timeOfDay === 'sunset') timeOfDay = 'night';
      else if (timeOfDay === 'night') timeOfDay = 'day';
      else timeOfDay = 'sunset';
      updateSkyLighting();
    }

    // Helper: Interpolate Track Frame at exact u
    function getInterpolatedFrame(u) {
      u = (u % 1.0 + 1.0) % 1.0;
      const exactIndex = u * TRACK_STEPS;
      const idx0 = Math.floor(exactIndex);
      const idx1 = (idx0 + 1) % TRACK_STEPS;
      const fract = exactIndex - idx0;

      const f0 = trackFrames[idx0];
      const f1 = trackFrames[idx1];

      const point = new THREE.Vector3().lerpVectors(f0.point, f1.point, fract);
      const tangent = new THREE.Vector3().lerpVectors(f0.tangent, f1.tangent, fract).normalize();
      const normal = new THREE.Vector3().lerpVectors(f0.normal, f1.normal, fract).normalize();
      const binormal = new THREE.Vector3().lerpVectors(f0.binormal, f1.binormal, fract).normalize();

      return { u, point, tangent, normal, binormal };
    }

    /* ==========================================================================
       9. MINIMAP 2D RENDERING
       ========================================================================== */
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    function drawMinimap(currentU) {
      minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
      minimapCtx.fillStyle = 'rgba(10, 16, 30, 0.9)';
      minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

      // Transform world coords to minimap coords
      const mapMinX = -90, mapMaxX = 160;
      const mapMinZ = -200, mapMaxZ = 330;
      function toMap(x, z) {
        const mx = ((x - mapMinX) / (mapMaxX - mapMinX)) * (minimapCanvas.width - 20) + 10;
        const my = ((z - mapMinZ) / (mapMaxZ - mapMinZ)) * (minimapCanvas.height - 20) + 10;
        return { x: mx, y: my };
      }

      // Draw Track Loop
      minimapCtx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
      minimapCtx.lineWidth = 2.0;
      minimapCtx.beginPath();
      for (let i = 0; i <= TRACK_STEPS; i += 10) {
        const p = trackFrames[i % TRACK_STEPS].point;
        const m = toMap(p.x, p.z);
        if (i === 0) minimapCtx.moveTo(m.x, m.y);
        else minimapCtx.lineTo(m.x, m.y);
      }
      minimapCtx.closePath();
      minimapCtx.stroke();

      // Current Coaster Train Dot
      const currentPoint = coasterCurve.getPointAt(currentU);
      const currentMap = toMap(currentPoint.x, currentPoint.z);

      // Glow effect
      minimapCtx.fillStyle = '#38bdf8';
      minimapCtx.shadowColor = '#00f2fe';
      minimapCtx.shadowBlur = 8;
      minimapCtx.beginPath();
      minimapCtx.arc(currentMap.x, currentMap.y, 4.5, 0, Math.PI * 2);
      minimapCtx.fill();
      minimapCtx.shadowBlur = 0;
    }

    /* ==========================================================================
       10. MAIN ANIMATION & SIMULATION LOOP
       ========================================================================== */
    const clock = new THREE.Clock();
    const trainMatrix = new THREE.Matrix4();
    let prevPoint = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);

      // 1. Physics Speed Calculation
      const currentFrame = getInterpolatedFrame(trackProgressU);
      const currentAltitude = currentFrame.point.y;

      let targetSpeedMs = 0;
      let isLiftHill = false;
      let isWaterSplash = false;

      // Section conditions:
      // Lift hill zone: between u = 0.05 and u = 0.20
      if (trackProgressU >= 0.045 && trackProgressU <= 0.205) {
        isLiftHill = true;
        targetSpeedMs = 4.2; // Steady climb speed (15 km/h)
      } else if (trackProgressU >= 0.96 || trackProgressU <= 0.04) {
        // Station deceleration brake zone
        targetSpeedMs = 6.0;
      } else {
        // Conservation of energy: v = sqrt(2 * g * (H_max - h) + v0^2)
        const heightDrop = Math.max(0, (MAX_ALTITUDE + 2.0) - currentAltitude);
        const frictionCoeff = 0.88; // Aerodynamic drag / mechanical friction
        targetSpeedMs = Math.sqrt(2 * GRAVITY * heightDrop * frictionCoeff + 25.0);
      }

      currentSpeedKmh = targetSpeedMs * 3.6;

      // Check water splash zone
      if (trackProgressU >= 0.65 && trackProgressU <= 0.72 && currentAltitude < 6.0) {
        isWaterSplash = true;
      }

      // Progress integration (ds = v * dt, du = ds / trackLength)
      const trackLength = coasterCurve.getLength();
      const du = (targetSpeedMs * delta) / trackLength;
      trackProgressU = (trackProgressU + du) % 1.0;

      // 2. G-Force Calculation (Centripetal + Gravity component)
      const nextFrame = getInterpolatedFrame(trackProgressU + 0.005);
      const turnRate = currentFrame.tangent.angleTo(nextFrame.tangent) / 0.005;
      const centripetalAcc = (targetSpeedMs * targetSpeedMs * turnRate) / trackLength;
      const verticalAccG = (centripetalAcc + GRAVITY * currentFrame.normal.y) / GRAVITY;
      currentGForce = Math.max(-0.5, Math.min(5.2, verticalAccG));

      // 3. Audio & Sound Update
      updateAudio(currentSpeedKmh, isLiftHill, isWaterSplash);

      // 4. Update Train & Follower Cars Positions & Orientations
      const trainSpacingU = 3.4 / trackLength; // Distance between carts

      // Lead Cart
      trainMatrix.makeBasis(currentFrame.binormal, currentFrame.normal, currentFrame.tangent);
      leadCart.position.copy(currentFrame.point);
      leadCart.quaternion.setFromRotationMatrix(trainMatrix);

      // Follower Carts
      for (let c = 0; c < followerCarts.length; c++) {
        const cartU = trackProgressU - (c + 1) * trainSpacingU;
        const cartFrame = getInterpolatedFrame(cartU);
        const cMat = new THREE.Matrix4().makeBasis(cartFrame.binormal, cartFrame.normal, cartFrame.tangent);
        followerCarts[c].position.copy(cartFrame.point);
        followerCarts[c].quaternion.setFromRotationMatrix(cMat);
      }

      // 5. Camera Positioning based on selected mode
      // Smooth look interpolation
      lookYaw += (targetLookYaw - lookYaw) * 0.1;
      lookPitch += (targetLookPitch - lookPitch) * 0.1;

      // Slight head vibration / bobbing based on speed and G-force
      const headJitter = (Math.random() - 0.5) * (currentSpeedKmh / 140) * 0.03;

      if (cameraMode === 'pov') {
        // First Person Cockpit View (Front row seat)
        const eyeOffset = currentFrame.normal.clone().multiplyScalar(1.25 + headJitter)
          .addScaledVector(currentFrame.tangent, 0.4)
          .addScaledVector(currentFrame.binormal, 0.0);
        camera.position.copy(currentFrame.point).add(eyeOffset);

        // Compute orientation with user look-around
        const lookDir = currentFrame.tangent.clone()
          .applyAxisAngle(currentFrame.normal, lookYaw)
          .applyAxisAngle(currentFrame.binormal, lookPitch);

        const lookTarget = camera.position.clone().add(lookDir.multiplyScalar(20));
        camera.up.copy(currentFrame.normal);
        camera.lookAt(lookTarget);

        // Dynamic FOV for speed sensation
        camera.fov = 70 + (currentSpeedKmh / 140) * 12;
        camera.updateProjectionMatrix();

      } else if (cameraMode === 'nose') {
        // Front Bumper / Track Cam
        const noseOffset = currentFrame.normal.clone().multiplyScalar(0.4)
          .addScaledVector(currentFrame.tangent, 2.2);
        camera.position.copy(currentFrame.point).add(noseOffset);
        camera.up.copy(currentFrame.normal);
        camera.lookAt(camera.position.clone().add(currentFrame.tangent.clone().multiplyScalar(30)));
        camera.fov = 82;
        camera.updateProjectionMatrix();

      } else if (cameraMode === 'chase') {
        // Third-person Chase Cam behind train
        const chaseU = trackProgressU - 12.0 / trackLength;
        const chaseFrame = getInterpolatedFrame(chaseU);
        const chasePos = chaseFrame.point.clone()
          .addScaledVector(chaseFrame.normal, 4.0)
          .subScaledVector(chaseFrame.tangent, 4.0);

        camera.position.lerp(chasePos, 0.2);
        camera.up.lerp(currentFrame.normal, 0.1);
        camera.lookAt(leadCart.position.clone().addScaledVector(currentFrame.normal, 1.0));
        camera.fov = 68;
        camera.updateProjectionMatrix();

      } else if (cameraMode === 'orbit') {
        orbitControls.target.lerp(leadCart.position, 0.1);
        orbitControls.update();
      }

      // 6. Scenery Animation (Ferris Wheel rotation)
      ferrisWheel.rotation.z += 0.003;
      for (let g of gondolas) {
        const currentAngle = g.angleOffset + ferrisWheel.rotation.z;
        g.mesh.position.set(
          Math.cos(currentAngle) * wheelRadius,
          wheelCenterY + Math.sin(currentAngle) * wheelRadius,
          0
        );
        // Keep gondola hanging upright
        g.mesh.rotation.z = -ferrisWheel.rotation.z;
      }

      // 7. Update HUD Telemetry
      document.getElementById('speed-val').innerText = Math.round(currentSpeedKmh);
      document.getElementById('alt-val').innerText = Math.max(0, Math.round(currentAltitude));
      document.getElementById('g-val').innerText = currentGForce.toFixed(1);
      
      // Update G-Force Ring meter
      const gRing = document.getElementById('g-ring');
      const gClamped = Math.max(0, Math.min(5, currentGForce));
      const dashOffset = 100 - (gClamped / 5.0) * 100;
      gRing.style.strokeDashoffset = dashOffset;
      if (currentGForce > 3.5) gRing.style.stroke = '#ef4444';
      else if (currentGForce < 0.2) gRing.style.stroke = '#a855f7';
      else gRing.style.stroke = '#38bdf8';

      // Update Track Progress bar & Minimap
      document.getElementById('track-progress').style.width = `${(trackProgressU * 100).toFixed(1)}%`;
      drawMinimap(trackProgressU);

      // Draw high-speed warp lines
      drawSpeedLines(currentSpeedKmh);

      // Render Scene
      renderer.render(scene, camera);
    }

    // Handle Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Animation Loop
    animate();
  </script>
</body>
</html>
