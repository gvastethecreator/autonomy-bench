<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071418">
  <meta name="description" content="A fireworks nocturne. Stay for a little wonder, or send a spark of your own into the night.">
  <title>Afterlight — a fireworks nocturne</title>
  <style>
    :root{color-scheme:dark;--ivory:#f7efdb;--muted:#9eaaa5;--gold:#d5b781;--line:rgba(231,230,210,.17)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071418}
    body{font-family:Arial,Helvetica,sans-serif;color:var(--ivory);-webkit-font-smoothing:antialiased}
    button,input{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
    button{border:0;background:none}button:disabled{cursor:default;opacity:.4}button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
    .veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,12,15,.4),transparent 24%,transparent 49%,rgba(3,12,15,.05) 64%,rgba(3,12,15,.85));box-shadow:inset 0 0 160px rgba(0,5,9,.3)}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.6' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}
    .shell{position:absolute;inset:0;padding:34px 4.3% 26px;pointer-events:none;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:14px;user-select:none}.brand-symbol{width:34px;height:34px;stroke:var(--gold);stroke-width:1.2;fill:none}
    .wordmark{font-family:Georgia,'Times New Roman',serif;font-size:23px;letter-spacing:5px;line-height:1.1}.brand-caption{font-size:8px;letter-spacing:2.5px;color:var(--muted);margin-top:8px}
    .header-right{display:flex;align-items:center;gap:22px}.edition{font-size:9px;letter-spacing:1.8px;color:var(--muted);margin-right:7px}.edition span{color:var(--gold)}
    .icon-button{pointer-events:auto;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;transition:background .2s,border-color .2s,color .2s}.icon-button:hover{background:rgba(217,206,170,.1);border-color:rgba(231,230,210,.4);color:#fff}.sound-button{position:relative}.sound-button::after{position:absolute;content:'';height:1px;width:24px;background:var(--ivory);transform:rotate(-45deg);transition:opacity .2s}.sound-button[aria-pressed="true"]::after{opacity:0}
    .stage-copy{position:absolute;left:4.3%;bottom:190px;max-width:460px;transition:opacity .6s,transform .6s;pointer-events:none}.stage-copy.changing{opacity:0;transform:translateY(9px)}
    .eyebrow{display:flex;align-items:center;gap:11px;font-size:9px;letter-spacing:2.4px;color:var(--gold);margin-bottom:22px}.eyebrow::before{content:'';width:24px;height:1px;background:var(--gold);opacity:.7}
    h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(40px,4.6vw,72px);line-height:1.07;letter-spacing:-2.5px;margin:0;text-wrap:balance}h1 em{font-weight:400;color:#e6c99b}
    .subline{font-size:12px;line-height:1.7;color:#a5b0aa;margin:19px 0 0;letter-spacing:.2px}
    .sky-note{position:absolute;right:4.4%;bottom:194px;display:flex;align-items:center;gap:13px;color:#a7b6b0;font-size:10px;letter-spacing:.6px;transition:opacity .8s}.sky-note svg{width:27px;height:27px;stroke:#bbac87;stroke-width:.8;fill:none}.sky-note span{display:block}.sky-note small{display:block;font-size:8px;letter-spacing:1.6px;color:#718b85;margin-top:7px;text-transform:uppercase}
    .controls{margin-top:auto;pointer-events:auto;position:relative}.control-top{display:flex;align-items:center;gap:23px;margin-bottom:22px;min-height:45px}.play{border-radius:50%;width:44px;height:44px;border:1px solid rgba(213,183,129,.6);color:#e9cfa2;display:grid;place-items:center;flex-shrink:0;transition:background .2s,transform .2s}.play:hover{background:rgba(213,183,129,.1);transform:scale(1.05)}.play svg{width:14px;height:14px;fill:currentColor;stroke-width:0}.play .play-icon{display:none}.play[aria-label="Play the show"] .play-icon{display:block}.play[aria-label="Play the show"] .pause-icon{display:none}
    .time{font-variant-numeric:tabular-nums;font-size:10px;letter-spacing:1px;white-space:nowrap;color:#c8d0c7;min-width:97px}.time .total{color:#5e756e;margin-left:7px}.score{flex:1;position:relative;height:22px;display:flex;align-items:center;max-width:560px}.track{position:absolute;left:0;right:0;height:1px;background:rgba(203,217,201,.22);pointer-events:none}.track-fill{height:1px;width:0;background:#ddc096;box-shadow:0 0 6px rgba(221,192,150,.25)}.track-tick{position:absolute;top:-2px;width:1px;height:5px;background:#85958a}.track-tick:nth-child(2){left:25%}.track-tick:nth-child(3){left:50%}.track-tick:nth-child(4){left:75%}input[type=range]{position:relative;width:100%;height:22px;margin:0;appearance:none;background:transparent;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{background:transparent;height:1px}input[type=range]::-moz-range-track{background:transparent;height:1px}input[type=range]::-webkit-slider-thumb{appearance:none;width:7px;height:7px;border-radius:50%;background:#ead1a8;margin-top:-3px;box-shadow:0 0 8px #dab58344;transition:transform .2s}input[type=range]::-moz-range-thumb{width:7px;height:7px;border:0;border-radius:50%;background:#ead1a8}input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.55)}
    .restart{color:#718980;padding:8px;transition:color .2s;flex-shrink:0}.restart:hover{color:var(--ivory)}.restart svg{width:16px;height:16px}.finale{margin-left:auto;display:flex;align-items:center;gap:30px;padding:13px 18px;border:1px solid rgba(213,183,129,.36);border-radius:2px;color:#dac29b;font-size:10px;letter-spacing:.5px;white-space:nowrap;transition:background .3s,border-color .3s}.finale:hover{background:rgba(213,183,129,.11);border-color:#9b875f}.finale svg{width:13px;height:13px}
    .footer{border-top:1px solid var(--line);padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:8px;letter-spacing:1.8px;color:#728980;text-transform:uppercase}.live{display:flex;align-items:center;gap:8px}.live-dot{width:4px;height:4px;background:#b9c1a5;border-radius:50%;box-shadow:0 0 8px #b9c1a567}.footer-middle{color:#a4ad9c;letter-spacing:3px}.footer-right{letter-spacing:1.2px;color:#5c756c}.kbd{border:1px solid #42584e;border-radius:2px;padding:2px 5px;font-size:8px;margin-right:5px}
    .toast{position:absolute;top:100px;left:50%;transform:translate(-50%,-8px);padding:10px 17px;background:rgba(11,28,29,.85);border:1px solid #ffffff14;border-radius:25px;color:#d9d5bb;font-size:11px;letter-spacing:.5px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .intro-line{animation:arrive 1.4s .2s both}header{animation:arrive 1.4s both}.controls{animation:arrive 1.4s .4s both}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:1700px){.stage-copy{bottom:220px}.shell{padding:42px 5% 30px}.stage-copy{left:5%}}
    @media(max-width:850px){.shell{padding:24px 6% 22px}.wordmark{font-size:19px;letter-spacing:4px}.brand-symbol{width:27px;height:27px}.brand-caption{font-size:7px;letter-spacing:1.6px}.edition{display:none}.header-right{gap:9px}.icon-button{width:35px;height:35px}.stage-copy{left:6%;bottom:180px;max-width:340px}h1{font-size:48px;letter-spacing:-1.9px}.sky-note{right:6%;bottom:190px;max-width:130px;line-height:1.6}.sky-note svg{display:none}.control-top{gap:15px}.score{max-width:none}.time{min-width:85px;font-size:9px}.finale{gap:12px;padding:13px 12px}.footer-middle{font-size:7px;letter-spacing:1.7px}.footer-right{display:none}}
    @media(max-width:560px){.shell{padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(23px,env(safe-area-inset-bottom))}.brand{gap:9px}.brand-caption{font-size:6px;letter-spacing:1.5px}.wordmark{font-size:17px;letter-spacing:3px}.header-right{gap:8px}.icon-button{width:33px;height:33px}.icon-button svg{width:15px;height:15px}.stage-copy{bottom:185px;max-width:290px}h1{font-size:44px;letter-spacing:-1.7px}.eyebrow{font-size:8px;letter-spacing:2px;margin-bottom:16px}.subline{font-size:10px;margin-top:14px}.sky-note{bottom:146px;left:6%;right:auto;max-width:none;font-size:9px}.sky-note small{display:none}.control-top{flex-wrap:wrap;gap:12px;margin-bottom:17px}.play{width:38px;height:38px}.time{min-width:80px;font-size:8px;letter-spacing:.5px}.score{order:5;flex-basis:100%;height:12px;margin-top:1px}.restart{margin-right:auto}.finale{margin-left:0;font-size:9px;padding:11px 12px;gap:10px}.footer{font-size:6px;letter-spacing:1.1px;padding-top:15px}.footer-middle{font-size:6px;letter-spacing:1.4px}}
    @media(max-height:650px) and (min-width:561px){.shell{padding-top:22px;padding-bottom:18px}.stage-copy{bottom:150px}h1{font-size:42px}.eyebrow{margin-bottom:12px}.subline{margin-top:12px}.sky-note{bottom:155px}.control-top{margin-bottom:12px}.footer{padding-top:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <canvas id="night" tabindex="0" aria-label="Interactive fireworks over a quiet bay. Click the sky or press Enter here to launch a firework."></canvas>
  <div class="veil" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <header>
      <div class="brand" aria-label="Afterlight, a fireworks nocturne">
        <svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2v10m0 16v10M2 20h10m16 0h10M7.3 7.3l7.1 7.1m11.2 11.2 7.1 7.1M7.3 32.7l7.1-7.1m11.2-11.2 7.1-7.1M20 14l1.6 4.4L26 20l-4.4 1.6L20 26l-1.6-4.4L14 20l4.4-1.6z"/><circle cx="20" cy="20" r="16" stroke-opacity=".2"/></svg>
        <div><div class="wordmark">AFTERLIGHT</div><div class="brand-caption">A FIREWORKS NOCTURNE</div></div>
      </div>
      <div class="header-right">
        <div class="edition">OPEN SKY <span> / </span> ENDLESS POSSIBILITY</div>
        <button id="sound" class="icon-button sound-button" aria-label="Turn sound on" aria-pressed="false" title="Sound on / off (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5 5 9H2v6h3l5 4V5ZM14 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
        <button id="fullscreen" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      </div>
    </header>
    <section class="stage-copy intro-line" id="copy" aria-label="Current movement">
      <div class="eyebrow" id="movement">01 — THE FIRST SPARK</div>
      <h1 id="headline">It starts with<br>a little <em>wonder.</em></h1>
      <p class="subline" id="subtitle">No occasion needed. Just look up.</p>
    </section>
    <div class="sky-note"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 1v9m0 10v9M1 15h9m10 0h9"/><circle cx="15" cy="15" r="5"/><circle cx="15" cy="15" r="11" stroke-opacity=".3"/></svg><div><span>Click the sky. Make it yours.</span><small>A spark at your fingertips</small></div></div>
    <div class="controls">
      <div class="control-top">
        <button class="play" id="play" aria-label="Pause the show" title="Play / pause (Space)"><svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3v12H3zM10 2h3v12h-3z"/></svg><svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 1 10 7-10 7z"/></svg></button>
        <div class="time"><span id="elapsed">00:00</span><span class="total">/ 01:24</span></div>
        <div class="score"><div class="track" aria-hidden="true"><div class="track-fill" id="fill"></div><i class="track-tick"></i><i class="track-tick"></i><i class="track-tick"></i></div><input id="progress" type="range" min="0" max="84" step="0.1" value="0" aria-label="Show progress" aria-valuetext="0 seconds of 84 seconds"></div>
        <button id="restart" class="restart" aria-label="Restart the show" title="Start again (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
        <button class="finale" id="finale">Skip to the finale<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13 3M4 3h9v9"/></svg></button>
      </div>
      <div class="footer"><div class="live"><span class="live-dot"></span><span id="status">THE NIGHT IS YOURS</span></div><div class="footer-middle">FOUR MOVEMENTS · ONE OPEN SKY</div><div class="footer-right"><span class="kbd">SPACE</span> TO PAUSE</div></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('night');
    const ctx = canvas.getContext('2d', { alpha: false });
    const trails = document.createElement('canvas'), fx = trails.getContext('2d');
    const scenery = document.createElement('canvas'), bg = scenery.getContext('2d');
    const bloom = document.createElement('canvas'), glow = bloom.getContext('2d');
    const $ = id => document.getElementById(id);
    const TAU = Math.PI * 2, duration = 84;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let width = 0, height = 0, dpr = 1, horizon = 0, scale = 1;
    let particles = [], rockets = [], flashes = [], smoke = [], ripples = [], pending = [];
    let showTime = 0, sceneTime = 0, nextLaunch = .35, lastTime = 0, paused = reducedMotion.matches;
    let stage = 0, lastUiSecond = -1, frameCount = 0, pointerDown = false, lastPointerLaunch = 0, copyTimer, toastTimer;
    let seed = 29197;
    const rand = () => {seed = (seed * 1664525 + 1013904223) >>> 0;return seed / 4294967296;};
    const between = (a,b) => a + rand() * (b-a);
    const clamp = (n,a,b) => Math.min(b,Math.max(a,n));
    const colors = {
      gold:[235,184,101], ivory:[248,224,177], mint:[111,215,190], ice:[159,217,225],
      coral:[241,145,131], rose:[222,126,155], silver:[211,227,220]
    };
    const movements = [
      {label:'01 — THE FIRST SPARK',title:'It starts with<br>a little <em>wonder.</em>',sub:'No occasion needed. Just look up.'},
      {label:'02 — IN FULL BLOOM',title:'Let the night<br><em>come alive.</em>',sub:'Every spark has a story to tell.'},
      {label:'03 — SUSPENDED IN TIME',title:'A moment,<br><em>suspended.</em>',sub:'Some things are better when you slow down.'},
      {label:'04 — THE AFTERGLOW',title:'Stay for<br>the <em>afterglow.</em>',sub:'A sky full of things worth remembering.'}
    ];
    function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
    function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}

    function resize(){
      const oldW=width,oldH=height;
      width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);horizon=height*.785;scale=Math.min(width/1400,height/850);
      for(const c of [canvas,trails,scenery]){c.width=Math.round(width*dpr);c.height=Math.round(height*dpr);}
      bloom.width=Math.ceil(width*.3);bloom.height=Math.ceil(height*.3);
      ctx.setTransform(dpr,0,0,dpr,0,0);fx.setTransform(dpr,0,0,dpr,0,0);bg.setTransform(dpr,0,0,dpr,0,0);
      if(oldW){for(const p of particles){p.x*=width/oldW;p.y*=height/oldH;p.px=p.x;p.py=p.y;}for(const r of rockets){r.x*=width/oldW;r.sx*=width/oldW;r.tx*=width/oldW;r.y*=height/oldH;r.sy*=height/oldH;r.ty*=height/oldH;}}
      drawScenery();
    }
    function drawScenery(){
      const sky=bg.createLinearGradient(0,0,0,height);sky.addColorStop(0,'#061117');sky.addColorStop(.48,'#0b2024');sky.addColorStop(.76,'#20342e');sky.addColorStop(.79,'#1b2a26');sky.addColorStop(.8,'#0b1b1c');sky.addColorStop(1,'#08171a');bg.fillStyle=sky;bg.fillRect(0,0,width,height);
      const haze=bg.createRadialGradient(width*.67,height*.55,0,width*.67,height*.55,width*.65);haze.addColorStop(0,'rgba(77,118,99,.14)');haze.addColorStop(.6,'rgba(39,79,72,.04)');haze.addColorStop(1,'rgba(8,27,30,0)');bg.fillStyle=haze;bg.fillRect(0,0,width,height);
      let starSeed=431;
      const sr=()=>{starSeed=(starSeed*16807)%2147483647;return starSeed/2147483647;};
      for(let i=0;i<180;i++){
        const x=sr()*width,y=sr()*horizon*.88,r=sr();bg.fillStyle=`rgba(192,216,207,${(.12+sr()*.34)*(1-y/horizon*.65)})`;bg.beginPath();bg.arc(x,y,r>.94?1:.35+sr()*.4,0,TAU);bg.fill();
        if(r>.98){bg.fillStyle='rgba(192,216,207,.06)';bg.fillRect(x-4,y-.35,8,.7);bg.fillRect(x-.35,y-4,.7,8);}
      }
      // A quiet crescent, well behind the light of the display.
      const mx=width*.83,my=height*.165,mr=Math.max(8,14*scale);
      const halo=bg.createRadialGradient(mx,my,1,mx,my,mr*6);halo.addColorStop(0,'rgba(215,229,190,.045)');halo.addColorStop(1,'rgba(215,229,190,0)');bg.fillStyle=halo;bg.fillRect(mx-mr*6,my-mr*6,mr*12,mr*12);
      bg.fillStyle='#abb5a0';bg.beginPath();bg.arc(mx,my,mr,0,TAU);bg.fill();bg.fillStyle='#0a191e';bg.beginPath();bg.arc(mx+mr*.48,my-mr*.24,mr*.94,0,TAU);bg.fill();
      // Two irregular shorelines add distance without competing with the sky.
      for(let layer=0;layer<2;layer++){
        bg.fillStyle=layer?'#081716':'rgba(11,28,26,.72)';bg.beginPath();bg.moveTo(0,horizon+4);
        for(let x=0;x<=width+20;x+=14){const u=x/width;const hill=Math.sin(u*17+layer)*8+Math.sin(u*39+2)*5+Math.sin(u*73)*2;const mass=layer?Math.pow(Math.max(0,Math.sin(u*6.8-2.5)),2)*18:12;bg.lineTo(x,horizon-2-(hill+mass)*Math.max(.5,scale));}
        bg.lineTo(width,horizon+12);bg.lineTo(0,horizon+12);bg.fill();
      }
      const lx=width*.875,ly=horizon-12*scale;
      bg.fillStyle='#081514';bg.beginPath();bg.moveTo(lx-3*scale,ly);bg.lineTo(lx-2*scale,ly-26*scale);bg.lineTo(lx+2*scale,ly-26*scale);bg.lineTo(lx+4*scale,ly);bg.fill();bg.fillRect(lx-4*scale,ly-28*scale,8*scale,4*scale);bg.beginPath();bg.moveTo(lx-5*scale,ly-28*scale);bg.lineTo(lx,ly-33*scale);bg.lineTo(lx+5*scale,ly-28*scale);bg.fill();
      bg.fillStyle='#ad9f66';bg.fillRect(lx-2*scale,ly-27*scale,4*scale,2*scale);
      for(let i=0;i<38;i++){const x=width*(.42+sr()*.48),y=horizon+sr()*2;bg.fillStyle=`rgba(199,158,89,${.15+sr()*.37})`;bg.fillRect(x,y,Math.max(.7,sr()*1.7),.8);}
      for(let i=0;i<100;i++){const y=horizon+sr()*(height-horizon),x=sr()*width;bg.strokeStyle=`rgba(106,139,118,${sr()*.055})`;bg.lineWidth=.5;bg.beginPath();bg.moveTo(x,y);bg.lineTo(x+sr()*100+12,y);bg.stroke();}
    }

    function particle(x,y,vx,vy,color,life,size,options={}){
      particles.push({x,y,px:x,py:y,vx,vy,color,life,maxLife:life,size,age:0,drag:options.drag||.984,gravity:options.gravity||30*scale,glitter:options.glitter||false,seed:rand()*TAU,willow:options.willow||false});
    }
    function burst(x,y,kind='peony',color=colors.gold,power=1,quiet=false){
      const base=Math.max(.42,scale)*power;
      flashes.push({x,y,color,life:1.15,maxLife:1.15,power});
      smoke.push({x,y,r:20*base,life:6,maxLife:6,color});
      const count=Math.floor((kind==='willow'?240:kind==='ring'?155:210)*Math.min(1.2,.8+width/2500));
      const angleOffset=rand()*TAU;
      for(let i=0;i<count;i++){
        let angle=i/count*TAU+between(-.01,.01),speed=between(180,230)*base;
        if(kind==='willow')speed=between(170,220)*base;
        if(kind==='palm')angle=Math.round(angle/(TAU/12))*(TAU/12)+between(-.045,.045);
        const depth=kind==='ring'?1:Math.sqrt(Math.max(.03,1-Math.pow(between(-1,1),2)));
        if(kind==='peony')speed*=.9+Math.sin(angle*9+angleOffset)*.1;
        const vx=Math.cos(angle)*speed*depth,vy=Math.sin(angle)*speed*depth;
        const tint=i%6===0?colors.ivory:color;
        particle(x,y,vx,vy,tint,between(kind==='willow'?3.8:2.8,kind==='willow'?5.5:4.3),between(.75,1.2)*Math.max(.65,scale),{gravity:kind==='willow'?29*base:22*base,drag:kind==='willow'?.989:.979,glitter:i%5===0,willow:kind==='willow'});
      }
      if(kind!=='ring')for(let i=0;i<68;i++){const a=rand()*TAU,s=between(30,118)*base;particle(x,y,Math.cos(a)*s,Math.sin(a)*s,colors.ivory,between(.7,1.9),.85*Math.max(.7,scale),{drag:.967,gravity:16*base,glitter:i%3===0});}
      if(kind==='ring')for(let i=0;i<85;i++){const a=i/85*TAU,s=105*base;particle(x,y,Math.cos(a)*s,Math.sin(a)*s,colors.ivory,between(1.7,2.9),.9*Math.max(.7,scale),{drag:.984,gravity:25*base});}
      if(!quiet)audio.boom(x/width,power,kind==='willow');
      if(particles.length>4600)particles.splice(0,particles.length-4600);
    }
    function launch(tx,ty,kind,color,power=1,immediate=false){
      tx=clamp(tx,width*.08,width*.92);ty=clamp(ty,height*.12,horizon*.78);
      const sx=clamp(tx+between(-110,110)*scale,width*.09,width*.95),sy=horizon+3;
      rockets.push({x:sx,y:sy,px:sx,py:sy,sx,sy,tx,ty,age:0,duration:between(1.1,1.5),kind:kind||pickKind(),color:color||pickColor(),power,seed:rand()*TAU});
      if(!immediate)audio.lift(sx/width);
    }
    function pickKind(){const types=stage===2?['willow','willow','palm']:stage===1?['peony','ring','peony','palm']:['peony','willow','peony','ring'];return types[Math.floor(rand()*types.length)];}
    function pickColor(){const options=stage===0?[colors.gold,colors.ivory,colors.gold,colors.mint]:stage===1?[colors.mint,colors.coral,colors.gold,colors.ice]:stage===2?[colors.gold,colors.ice,colors.ivory]:[colors.gold,colors.coral,colors.mint,colors.ivory];return options[Math.floor(rand()*options.length)];}
    function choreograph(){
      const pos=stage===3?between(.21,.87):between(.36,.84);
      const y=between(.2,.46)*height;
      launch(width*pos,y,pickKind(),pickColor(),between(.8,1.18));
      if(stage===1&&rand()>.52)pending.push({at:sceneTime+.32,x:width*(1-pos*.72),y:height*between(.23,.45),color:pickColor(),kind:'peony',power:.72});
      if(stage===3&&showTime<79){pending.push({at:sceneTime+.19,x:width*between(.2,.8),y:height*between(.19,.4),color:pickColor(),kind:pickKind(),power:between(.8,1.12)});}
      nextLaunch=showTime+(stage===0?between(1.4,2.1):stage===1?between(1.2,1.8):stage===2?between(2.3,3):between(.62,1.1));
      if(showTime>78)nextLaunch=86;
    }
    function setStage(next,instant=false){
      if(next===stage&&!instant)return;
      stage=next;clearTimeout(copyTimer);const m=movements[stage];
      const update=()=>{$('movement').textContent=m.label;$('headline').innerHTML=m.title;$('subtitle').textContent=m.sub;$('copy').classList.remove('changing');};
      if(instant)update();else{$('copy').classList.add('changing');copyTimer=setTimeout(update,580);}
      $('finale').innerHTML=stage===3?'Enjoy the afterglow <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>':'Skip to the finale <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13 3M4 3h9v9"/></svg>';
      $('finale').disabled=stage===3;
    }
    function clearEffects(){particles=[];rockets=[];flashes=[];smoke=[];pending=[];ripples=[];fx.clearRect(0,0,width,height);}
    function opening(){
      burst(width*.65,height*.32,'peony',colors.gold,1.2,true);
      burst(width*.37,height*.25,'ring',colors.mint,.77,true);
      burst(width*.83,height*.45,'willow',colors.coral,.66,true);
      for(let i=0;i<38;i++){updateEffects(1/60,false);drawEffects(1/60);}
    }
    function seek(t){
      showTime=clamp(t,0,duration-.01);nextLaunch=showTime+.15;clearEffects();setStage(Math.min(3,Math.floor(showTime/21)),true);
      if(showTime<80)opening();updateUI(true);render();
    }
    function updateEffects(dt,spawnGlitter=true){
      for(let i=pending.length-1;i>=0;i--)if(sceneTime>=pending[i].at){const p=pending[i];launch(p.x,p.y,p.kind,p.color,p.power);pending.splice(i,1);}
      for(let i=rockets.length-1;i>=0;i--){
        const r=rockets[i];r.age+=dt;const t=Math.min(1,r.age/r.duration),ease=1-Math.pow(1-t,1.65);r.px=r.x;r.py=r.y;r.x=r.sx+(r.tx-r.sx)*ease+Math.sin(t*Math.PI)*Math.sin(r.seed)*9*scale;r.y=r.sy+(r.ty-r.sy)*ease;
        if(spawnGlitter&&rand()>.27)particle(r.x,r.y,between(-7,7)*scale,between(18,36)*scale,colors.gold,between(.25,.65),.7*Math.max(.8,scale),{drag:.97,gravity:18*scale});
        if(t===1){burst(r.tx,r.ty,r.kind,r.color,r.power);rockets.splice(i,1);}
      }
      const initialCount=particles.length;
      for(let i=initialCount-1;i>=0;i--){
        const p=particles[i];p.age+=dt;p.life-=dt;if(p.life<=0||p.y>horizon+12){particles.splice(i,1);continue;}
        p.px=p.x;p.py=p.y;const drag=Math.pow(p.drag,dt*60);p.vx*=drag;p.vy=p.vy*drag+p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
        if(spawnGlitter&&p.willow&&p.life>1&&rand()<dt*2.5)particle(p.x,p.y,between(-5,5)*scale,between(-4,4)*scale,colors.ivory,between(.1,.4),.6*Math.max(.7,scale),{gravity:15*scale});
      }
      for(let i=flashes.length-1;i>=0;i--){flashes[i].life-=dt;if(flashes[i].life<=0)flashes.splice(i,1);}
      for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.life-=dt;s.r+=dt*14*scale;s.x+=dt*5*scale;s.y-=dt*1.8*scale;if(s.life<=0)smoke.splice(i,1);}
      for(let i=ripples.length-1;i>=0;i--){ripples[i].age+=dt;if(ripples[i].age>1)ripples.splice(i,1);}
    }
    function drawEffects(dt){
      fx.globalCompositeOperation='destination-out';fx.fillStyle=`rgba(0,0,0,${1-Math.pow(.78,dt*60)})`;fx.fillRect(0,0,width,height);fx.globalCompositeOperation='lighter';
      for(const r of rockets){
        const tail=Math.min(1,r.age/.2);fx.strokeStyle=rgba(colors.gold,.7*tail);fx.lineWidth=1.1*Math.max(.7,scale);fx.beginPath();fx.moveTo(r.x,r.y);fx.lineTo(r.px+(r.px-r.x)*2.5,r.py+(r.py-r.y)*2.5);fx.stroke();
        fx.fillStyle='#fff1d1';fx.beginPath();fx.arc(r.x,r.y,1.5*Math.max(.7,scale),0,TAU);fx.fill();
      }
      for(const p of particles){
        let alpha=Math.min(1,p.life/(p.maxLife*.45))*Math.min(1,p.age*14);
        if(p.glitter&&p.life<p.maxLife*.65)alpha*=.24+.76*Math.pow(Math.max(0,Math.sin(p.age*37+p.seed)),2);
        if(alpha<.018)continue;
        const motion=Math.max(1,Math.min(3.3,p.life>p.maxLife*.65?2.6:1.25));
        fx.strokeStyle=rgba(p.color,alpha*.8);fx.lineWidth=p.size;fx.beginPath();fx.moveTo(p.x,p.y);fx.lineTo(p.x+(p.px-p.x)*motion,p.y+(p.py-p.y)*motion);fx.stroke();
        if(p.glitter||p.age<.14){fx.fillStyle=rgba(colors.ivory,alpha*.8);fx.fillRect(p.x-.6,p.y-.6,1.2,1.2);}
      }
      fx.globalCompositeOperation='source-over';
    }
    function render(){
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(scenery,0,0,width,height);
      ctx.save();ctx.beginPath();ctx.rect(0,0,width,horizon);ctx.clip();
      for(const s of smoke){const age=1-s.life/s.maxLife;const a=Math.sin(age*Math.PI)*.047;const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.7);g.addColorStop(0,rgba(s.color,a));g.addColorStop(.45,rgba(s.color,a*.65));g.addColorStop(1,rgba(s.color,0));ctx.fillStyle=g;ctx.fillRect(s.x-s.r*3,s.y-s.r*3,s.r*6,s.r*6);}
      for(const f of flashes){const p=f.life/f.maxLife,r=(130+(1-p)*80)*Math.max(.65,scale)*f.power;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,rgba(f.color,p*p*.17));g.addColorStop(.15,rgba(f.color,p*p*.065));g.addColorStop(1,rgba(f.color,0));ctx.fillStyle=g;ctx.fillRect(f.x-r,f.y-r,r*2,r*2);}
      ctx.globalCompositeOperation='screen';ctx.drawImage(trails,0,0,width,height);
      // Bloom is isolated to the highlights; the night stays dark.
      glow.clearRect(0,0,bloom.width,bloom.height);glow.filter='blur(1.2px)';glow.drawImage(trails,0,0,bloom.width,bloom.height);glow.filter='none';
      ctx.globalAlpha=.55;ctx.drawImage(bloom,0,0,width,height);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      for(const r of ripples){ctx.strokeStyle=`rgba(235,207,157,${(1-r.age)*.4})`;ctx.lineWidth=.7;ctx.beginPath();ctx.arc(r.x,r.y,7+r.age*29,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(r.x-4,r.y);ctx.lineTo(r.x+4,r.y);ctx.moveTo(r.x,r.y-4);ctx.lineTo(r.x,r.y+4);ctx.stroke();}
      ctx.restore();
      // The bay catches the sky in narrow, shifting ribbons.
      ctx.save();ctx.beginPath();ctx.rect(0,horizon+8,width,height-horizon);ctx.clip();ctx.globalCompositeOperation='screen';
      const reflectScale=.27;
      for(let y=horizon+9;y<height;y+=3){
        const distance=y-horizon,sourceY=horizon-distance/reflectScale;
        if(sourceY<0)break;
        const wave=Math.sin(y*.17+sceneTime*1.2)*2+Math.sin(y*.063-sceneTime*.8)*distance*.034;
        ctx.globalAlpha=(.31+Math.sin(y*1.9+sceneTime*.5)*.1)*(1-distance/(height-horizon)*.45);
        ctx.drawImage(trails,0,sourceY*dpr,trails.width,Math.max(1,2/reflectScale*dpr),wave,y,width,1.4);
      }
      ctx.restore();
      // A slender lighthouse beam moves slowly along the far bank.
      const lx=width*.875,ly=horizon-39*scale,beam=Math.sin(sceneTime*.11);
      ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createLinearGradient(lx,ly,lx+beam*width*.21,ly+5);g.addColorStop(0,'rgba(226,211,151,.055)');g.addColorStop(1,'rgba(226,211,151,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+beam*width*.21,ly-5*scale);ctx.lineTo(lx+beam*width*.21,ly+8*scale);ctx.fill();ctx.restore();
    }
    function updateUI(force=false){
      const second=Math.floor(showTime);
      if(second!==lastUiSecond||force){lastUiSecond=second;$('elapsed').textContent=`${String(Math.floor(second/60)).padStart(2,'0')}:${String(second%60).padStart(2,'0')}`;$('progress').setAttribute('aria-valuetext',`${second} seconds of 84 seconds`);}
      $('progress').value=showTime;
      $('fill').style.width=`${showTime/duration*100}%`;
    }
    function tick(now){
      const dt=lastTime?Math.min((now-lastTime)/1000,.035):1/60;lastTime=now;
      if(!paused&&!document.hidden){
        showTime+=dt;sceneTime+=dt;
        if(showTime>=duration){showTime=0;nextLaunch=.8;setStage(0);}
        setStage(Math.min(3,Math.floor(showTime/21)));
        if(showTime>=nextLaunch&&showTime<79)choreograph();
        updateEffects(dt);drawEffects(dt);render();
        if(++frameCount%3===0)updateUI();
      }
      requestAnimationFrame(tick);
    }
    function setPaused(value){paused=value;$('play').setAttribute('aria-label',paused?'Play the show':'Pause the show');$('status').textContent=paused?'A MOMENT OF STILLNESS':'THE NIGHT IS YOURS';document.querySelector('.live-dot').style.opacity=paused?'.35':'1';if(paused)audio.suspend();else audio.resume();updateUI(true);}

    // Sound is generated locally, and only after an explicit listener gesture.
    const audio={
      context:null,enabled:false,master:null,noise:null,
      async toggle(){
        if(!this.context){
          const Audio=window.AudioContext||window.webkitAudioContext;
          if(!Audio){toast('Sound is not available in this browser.');return;}
          try{this.context=new Audio();this.master=this.context.createGain();this.master.gain.value=.42;const compressor=this.context.createDynamicsCompressor();compressor.threshold.value=-18;compressor.ratio.value=5;this.master.connect(compressor);compressor.connect(this.context.destination);
            this.noise=this.context.createBuffer(1,this.context.sampleRate*2,this.context.sampleRate);const data=this.noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
          }catch{toast('Sound could not be started.');return;}
        }
        this.enabled=!this.enabled;
        try{if(this.enabled&&!paused)await this.context.resume();else await this.context.suspend();}catch{this.enabled=false;}
        $('sound').setAttribute('aria-pressed',String(this.enabled));$('sound').setAttribute('aria-label',this.enabled?'Turn sound off':'Turn sound on');toast(this.enabled?'Sound on. Settle into the night.':'Sound off.');
      },
      suspend(){if(this.context&&this.context.state==='running')this.context.suspend().catch(()=>{});},
      resume(){if(this.enabled&&this.context)this.context.resume().catch(()=>{});},
      noiseVoice(position,frequency,length,volume,delay=0){
        if(!this.enabled||paused||!this.context||this.context.state!=='running')return;
        const ac=this.context,t=ac.currentTime+delay,src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain(),pan=ac.createStereoPanner();src.buffer=this.noise;filter.type='lowpass';filter.frequency.value=frequency;pan.pan.value=clamp((position-.5)*1.4,-.8,.8);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+length);src.connect(filter);filter.connect(gain);gain.connect(pan);pan.connect(this.master);src.start(t);src.stop(t+length);src.onended=()=>{src.disconnect();filter.disconnect();gain.disconnect();pan.disconnect();};
      },
      lift(position){this.noiseVoice(position,1800,.65,.065);},
      boom(position,power,willow){this.noiseVoice(position,260,1.65,.95*power,.16);this.noiseVoice(position,1100,.6,.12*power,.17);if(willow)this.noiseVoice(position,3100,1.4,.04,.8);}
    };
    $('play').addEventListener('click',()=>setPaused(!paused));
    $('sound').addEventListener('click',()=>audio.toggle());
    $('restart').addEventListener('click',()=>{seek(0);toast('One more time, from the first spark.');});
    $('progress').addEventListener('input',event=>seek(Number(event.target.value)));
    $('finale').addEventListener('click',()=>{seek(63);setPaused(false);toast('One last skyful of wonder.');});
    async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Fullscreen is not available in this browser.');}catch{toast('Fullscreen is not available here.');}}
    $('fullscreen').addEventListener('click',fullscreen);
    document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');});
    function userLaunch(x,y){
      if(y>horizon*.82){toast('Aim a little higher. The sky is your canvas.');return;}
      if(paused)setPaused(false);
      launch(x,y,pickKind(),pickColor(),between(.85,1.15));ripples.push({x,y,age:0});lastPointerLaunch=performance.now();
    }
    canvas.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointerDown=true;canvas.setPointerCapture(event.pointerId);userLaunch(event.clientX,event.clientY);});
    canvas.addEventListener('pointermove',event=>{if(pointerDown&&performance.now()-lastPointerLaunch>300)userLaunch(event.clientX,event.clientY);});
    canvas.addEventListener('pointerup',()=>{pointerDown=false;});canvas.addEventListener('pointercancel',()=>{pointerDown=false;});
    canvas.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();userLaunch(width*between(.36,.8),height*between(.2,.42));}});
    document.addEventListener('keydown',event=>{if(event.repeat||event.altKey||event.ctrlKey||event.metaKey)return;const isControl=/INPUT|BUTTON|TEXTAREA|SELECT/.test(event.target.tagName);if(isControl)return;if(event.code==='Space'){event.preventDefault();setPaused(!paused);}else if(event.key.toLowerCase()==='m')audio.toggle();else if(event.key.toLowerCase()==='f')fullscreen();else if(event.key.toLowerCase()==='r'){seek(0);toast('Back to the first spark.');}});
    document.addEventListener('visibilitychange',()=>{lastTime=0;if(document.hidden)audio.suspend();else if(!paused)audio.resume();});
    reducedMotion.addEventListener('change',event=>{if(event.matches){setPaused(true);toast('Motion paused. Play whenever you are ready.');}});
    let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{resize();drawEffects(1/60);render();},100);});
    $('copy').addEventListener('animationend',()=> $('copy').classList.remove('intro-line'),{once:true});
    resize();opening();drawEffects(1/60);render();setPaused(paused);updateUI(true);requestAnimationFrame(tick);
    if(reducedMotion.matches)toast('A still night. Press play to begin the show.');
  })();
  </script>
</body>
