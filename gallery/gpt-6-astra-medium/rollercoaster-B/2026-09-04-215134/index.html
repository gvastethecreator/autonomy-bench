<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headland — An endless coastal ride</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--cream:#f2f0df;--mint:#d6f39a}*{box-sizing:border-box}body{margin:0;background:#779eaa;color:var(--cream);font-family:'DM Sans',sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}button{font:inherit;cursor:pointer;color:inherit}.overlay{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(15,37,39,.34),transparent 24%,transparent 65%,rgba(13,29,30,.57))}.top{position:fixed;top:34px;left:40px;right:40px;display:flex;align-items:start;justify-content:space-between;pointer-events:none}.wordmark{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:600;letter-spacing:-1.4px}.wordmark span{display:inline-block;width:26px;height:23px;margin-right:12px;vertical-align:-4px;background:var(--cream);clip-path:polygon(0 100%,42% 0,60% 43%,75% 15%,100% 100%,78% 100%,72% 64%,63% 85%,44% 36%,23% 100%)}.sub{font-size:10px;letter-spacing:2.3px;text-transform:uppercase;margin-top:9px;opacity:.7}.live{display:flex;gap:9px;align-items:center;border:1px solid #f2f0df44;border-radius:22px;padding:11px 16px;font-size:11px;letter-spacing:1.3px}.dot{width:6px;height:6px;background:var(--mint);border-radius:50%;box-shadow:0 0 10px #d6f39a55}.left{position:fixed;left:40px;bottom:132px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--mint);margin-bottom:12px}.title{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,4vw,54px);font-weight:400;letter-spacing:-2.5px;line-height:1.05}.caption{font-size:12px;opacity:.66;margin-top:12px}.right{position:fixed;bottom:139px;right:40px;display:flex;gap:30px;text-align:right;pointer-events:none}.value{font:400 29px 'Space Grotesk',sans-serif;letter-spacing:-1px}.unit{font:10px 'DM Sans',sans-serif;letter-spacing:0;opacity:.6;margin-left:5px}.label{font-size:9px;letter-spacing:1.7px;opacity:.55;margin-top:5px}.bottom{position:fixed;bottom:27px;left:40px;right:40px;border-top:1px solid #f2f0df38;padding-top:19px;display:flex;align-items:center;justify-content:space-between;gap:24px}.controls{display:flex;gap:9px;align-items:center}.circle{border:1px solid #f2f0df44;background:#17333155;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;backdrop-filter:blur(10px)}.circle:hover,.speed:hover{background:#edf5d82c}.circle.primary{background:var(--cream);color:#20382f;border:0}.circle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}.speed{background:#17333155;border:1px solid #f2f0df44;border-radius:23px;padding:12px 16px;font-size:11px;backdrop-filter:blur(10px)}.route{width:36%;max-width:460px;position:relative}.route-line{height:2px;background:#f2f0df30;position:relative;margin-bottom:10px}.route-fill{height:2px;width:0;background:var(--mint)}.route-dot{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--mint)}.route-labels{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.5px;opacity:.6}.note{font-size:10px;letter-spacing:.4px;opacity:.6}.loader{position:fixed;inset:0;background:#173d3e;display:grid;place-content:center;text-align:center;z-index:5;transition:opacity 1s}.loader p{font-size:11px;letter-spacing:2px;opacity:.6}.loader.hidden{opacity:0;pointer-events:none}.toast{position:fixed;top:98px;right:40px;font-size:11px;background:#173331b0;border:1px solid #ffffff30;border-radius:20px;padding:10px 16px;opacity:0;transition:opacity .3s}.toast.show{opacity:1}button:focus-visible{outline:2px solid var(--mint);outline-offset:4px}@media(max-width:650px){.top{top:23px;left:22px;right:22px}.wordmark{font-size:22px}.sub{font-size:8px}.live{font-size:8px;padding:10px}.left{left:22px;bottom:146px}.right{right:22px;bottom:147px;gap:13px}.title{font-size:34px}.caption{max-width:190px;font-size:10px}.value{font-size:23px}.bottom{left:22px;right:22px;bottom:23px;flex-wrap:wrap;gap:15px}.route{width:100%;order:-1;max-width:none}.note{font-size:9px}.label{font-size:8px}.controls{gap:7px}.circle{width:36px;height:36px}.speed{padding:10px 12px}.eyebrow{font-size:8px}}
</style>
</head>
<body>
<div id="scene"></div><div class="overlay"></div>
<header class="top"><div><div class="wordmark"><span></span>headland</div><div class="sub">An endless coastal ride</div></div><div class="live"><i class="dot"></i><span id="status">LIVE RIDE</span></div></header>
<div class="left"><div class="eyebrow" id="section">01 / THE ASCENT</div><div class="title" id="title">Find your horizon.</div><div class="caption" id="caption">Climb above the coast. Let the world fall away.</div></div>
<div class="right"><div><div class="value"><span id="speedRead">0</span><span class="unit">km/h</span></div><div class="label">VELOCITY</div></div><div><div class="value"><span id="heightRead">0</span><span class="unit">m</span></div><div class="label">ABOVE SEA</div></div></div>
<footer class="bottom"><div class="controls"><button id="pause" class="circle primary" title="Pause ride (Space)" aria-label="Pause ride"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="3"/></svg></button><button id="sound" class="circle" title="Enable ambient sound" aria-label="Enable ambient sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l6 6m0-6-6 6"/></svg></button><button id="rate" class="speed" title="Change ride speed">1× speed</button><button id="full" class="circle" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div><div class="route"><div class="route-line"><div id="fill" class="route-fill"></div><div id="marker" class="route-dot"></div></div><div class="route-labels"><span>ASCENT</span><span>THE DROP</span><span>COASTLINE</span><span>RETURN</span></div></div><div class="note">NO DESTINATION. JUST THE RIDE. ↗</div></footer>
<div class="loader" id="loader"><div class="wordmark">headland</div><p id="loadingText">FINDING YOUR HORIZON</p></div><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color('#c5d9d7');scene.fog=new THREE.FogExp2('#c6d8d4',.0018);
const camera=new THREE.PerspectiveCamera(73,innerWidth/innerHeight,.15,2500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;$('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f4ed,0x4b6053,2.7));const sun=new THREE.DirectionalLight(0xffe2ad,3.5);sun.position.set(-220,320,-400);scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});const dark=mat('#274b47'),railmat=mat('#e9cba0',.33),wood=mat('#a26f4c');
// A closed, arc-length sampled course keeps the ride moving smoothly across every lap.
const course=new THREE.CatmullRomCurve3([
new THREE.Vector3(0,28,160),new THREE.Vector3(-45,55,80),new THREE.Vector3(-58,100,-35),new THREE.Vector3(-12,112,-130),new THREE.Vector3(75,43,-210),new THREE.Vector3(170,17,-155),new THREE.Vector3(225,32,-30),new THREE.Vector3(170,66,65),new THREE.Vector3(105,35,145),new THREE.Vector3(150,22,240),new THREE.Vector3(90,45,300),new THREE.Vector3(-15,52,290),new THREE.Vector3(-62,23,220)
],true,'catmullrom',.35);const length=course.getLength();const UP=new THREE.Vector3(0,1,0);
function frame(u){u=((u%1)+1)%1;const p=course.getPointAt(u),t=course.getTangentAt(u).normalize(),side=new THREE.Vector3().crossVectors(t,UP).normalize(),up=new THREE.Vector3().crossVectors(side,t).normalize();return {p,t,side,up};}
const sampleCount=1500;const railA=[],railB=[];for(let i=0;i<=sampleCount;i++){const f=frame(i/sampleCount);railA.push(f.p.clone().addScaledVector(f.side,1.05));railB.push(f.p.clone().addScaledVector(f.side,-1.05));}
for(const points of [railA,railB]){const c=new THREE.CatmullRomCurve3(points,false);scene.add(new THREE.Mesh(new THREE.TubeGeometry(c,1600,.115,6,false),railmat));}
const ties=new THREE.InstancedMesh(new THREE.BoxGeometry(2.85,.22,.3),wood,1000);const dummy=new THREE.Object3D();for(let i=0;i<1000;i++){const f=frame(i/1000);dummy.position.copy(f.p).addScaledVector(f.up,-.16);dummy.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.side,f.up,f.t.clone().negate()));dummy.updateMatrix();ties.setMatrixAt(i,dummy.matrix);}scene.add(ties);
function beam(a,b,r,material){const d=b.clone().sub(a);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),6),material);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(UP,d.normalize());scene.add(mesh);}
for(let i=0;i<106;i++){const f=frame(i/106);for(const sign of [-1,1]){const a=f.p.clone().addScaledVector(f.side,sign*1.6);a.y-=.6;const b=a.clone().addScaledVector(f.side,sign*2.1);b.y=-2;beam(a,b,.29,dark);if(i%2===0){const c=f.p.clone().addScaledVector(f.side,-sign*1.6);c.y-=1;beam(c,b,.13,dark);}}beam(f.p.clone().addScaledVector(f.side,-1.8).add(new THREE.Vector3(0,-.6,0)),f.p.clone().addScaledVector(f.side,1.8).add(new THREE.Vector3(0,-.6,0)),.22,dark);}
// Quiet water, terraced islands, pines and distant headlands.
const water=new THREE.Mesh(new THREE.PlaneGeometry(6500,6500),new THREE.MeshStandardMaterial({color:'#458e98',roughness:.36,metalness:.24}));water.rotation.x=-Math.PI/2;water.position.y=-3;scene.add(water);
let seed=63;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function island(x,z,r,h){const geo=new THREE.CylinderGeometry(r*.74,r,h,11,3);const a=geo.attributes.position;for(let i=0;i<a.count;i++){const yy=a.getY(i);a.setY(i,yy+(yy>0?(rand()-.5)*h*.28:0));}geo.computeVertexNormals();const rock=new THREE.Mesh(geo,mat('#7b8b78'));rock.position.set(x,h*.5-6,z);scene.add(rock);const top=new THREE.Mesh(new THREE.CylinderGeometry(r*.65,r*.77,2.5,11),mat('#78875c'));top.position.set(x,h-5,z);scene.add(top);return h-3;}
function tree(x,y,z,s){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2*s,.3*s,3*s,5),wood);trunk.position.set(x,y+1.5*s,z);scene.add(trunk);for(let j=0;j<3;j++){const pine=new THREE.Mesh(new THREE.ConeGeometry((2.3-j*.43)*s,(4.4-j*.6)*s,6),mat(j%2?'#426653':'#355b4b'));pine.position.set(x,y+(3+j*1.35)*s,z);scene.add(pine);}}
const lands=[[-120,100,55,14],[-105,-95,40,24],[125,-100,45,8],[95,245,33,10],[15,225,28,9],[265,90,55,17],[-190,315,70,23],[-300,-330,150,80],[300,-550,180,100],[-500,30,150,70],[550,400,130,70]];
for(const [x,z,r,h]of lands){const y=island(x,z,r,h);for(let j=0;j<18;j++){const angle=rand()*Math.PI*2,rr=Math.sqrt(rand())*r*.55;tree(x+Math.cos(angle)*rr,y,z+Math.sin(angle)*rr,.8+rand()*1.2);}}
// The lighthouse provides a recognizable landmark as the course comes home.
const lx=-119,lz=102;const lighthouse=new THREE.Mesh(new THREE.CylinderGeometry(2.2,3.1,20,12),mat('#e9dfc8'));lighthouse.position.set(lx,22,lz);scene.add(lighthouse);for(const y of [18,26]){const band=new THREE.Mesh(new THREE.CylinderGeometry(y===18?2.85:2.5,y===18?2.98:2.65,2.3,12),mat('#bc6444'));band.position.set(lx,y,lz);scene.add(band);}const lantern=new THREE.Mesh(new THREE.CylinderGeometry(3,3,3,12),mat('#314e46'));lantern.position.set(lx,33,lz);scene.add(lantern);const roof=new THREE.Mesh(new THREE.ConeGeometry(3.9,3.5,12),mat('#9e5037'));roof.position.set(lx,36,lz);scene.add(roof);
const sunDisk=new THREE.Mesh(new THREE.SphereGeometry(30,24,16),new THREE.MeshBasicMaterial({color:'#fff1c2'}));sunDisk.position.set(-500,290,-1000);scene.add(sunDisk);
const cloudmat=new THREE.MeshBasicMaterial({color:'#edf1e6',transparent:true,opacity:.35,depthWrite:false});for(let i=0;i<35;i++){const cloud=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),cloudmat);cloud.position.set((rand()-.5)*2400,220+rand()*180,(rand()-.5)*2400);cloud.scale.set(55+rand()*95,8+rand()*12,20+rand()*35);scene.add(cloud);}
const birdGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-2,0,0),new THREE.Vector3(-.7,.3,0),new THREE.Vector3(0,0,0),new THREE.Vector3(.7,.3,0),new THREE.Vector3(2,0,0)]);const birds=[];for(let i=0;i<14;i++){const b=new THREE.Line(birdGeo,new THREE.LineBasicMaterial({color:'#345c62'}));b.position.set(rand()*350-100,110+rand()*50,rand()*400-200);scene.add(b);birds.push(b);}
// A restrained nose and grab bar anchor the viewer inside the front car.
const car=new THREE.Group();camera.add(car);scene.add(camera);const nose=new THREE.Mesh(new THREE.BoxGeometry(1.6,.38,.7),mat('#b65737',.45));nose.position.set(0,-1.08,-1.1);car.add(nose);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.047,.047,1.52,12),mat('#d3c8ac',.3));rim.rotation.z=Math.PI/2;rim.position.set(0,-.82,-1.35);car.add(rim);for(const x of [-.71,.71]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.35,10),dark);post.position.set(x,-.99,-1.35);car.add(post);}
let u=.006,paused=false,multiplier=1,velocity=10,lap=1,clock=new THREE.Clock(),elapsed=0;const rates=[1,1.5,.75];let rateIndex=0,audioContext,gain,soundOn=false;const targetQuat=new THREE.Quaternion();
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2200);}
function togglePause(){paused=!paused;$('status').textContent=paused?'RIDE PAUSED':'LIVE RIDE';$('pause').innerHTML=paused?'<svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z" fill="currentColor" stroke="none"/></svg>':'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="3"/></svg>';$('pause').setAttribute('aria-label',paused?'Resume ride':'Pause ride');$('pause').title=paused?'Resume ride (Space)':'Pause ride (Space)';}
$('pause').onclick=togglePause;$('rate').onclick=()=>{rateIndex=(rateIndex+1)%rates.length;multiplier=rates[rateIndex];$('rate').textContent=multiplier+'× speed';};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Full screen is unavailable in this view.');}};
$('sound').onclick=()=>{if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();const buffer=audioContext.createBuffer(1,audioContext.sampleRate*3,audioContext.sampleRate);const d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const noise=audioContext.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=520;gain=audioContext.createGain();gain.gain.value=0;noise.connect(filter).connect(gain).connect(audioContext.destination);noise.start();}audioContext.resume();soundOn=!soundOn;$('sound').style.color=soundOn?'#d6f39a':'';$('sound').setAttribute('aria-label',soundOn?'Mute ambient sound':'Enable ambient sound');$('sound').innerHTML=soundOn?'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8q5 4 0 8m3-11q8 7 0 14"/></svg>':'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l6 6m0-6-6 6"/></svg>';toast(soundOn?'Coastal ambience on':'Coastal ambience off');};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePause();}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const sections=[['01 / THE ASCENT','Find your horizon.','Climb above the coast. Let the world fall away.'],['02 / THE DROP','Take the long way down.','A little freefall. A whole ocean ahead.'],['03 / COASTLINE','Follow the water.','Sweeping turns, salt air, open sea.'],['04 / THE RETURN','Once more, from the top.','The horizon is never quite the same.']];let current=-1,first=true;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;const f=frame(u);const desired=THREE.MathUtils.clamp(14-f.t.y*36,8,43);velocity=THREE.MathUtils.lerp(velocity,desired,1-Math.exp(-dt*1.5));if(!paused){u+=velocity*multiplier*dt/length;if(u>=1){u%=1;lap++;} }const v=frame(u),ahead=frame(u+.003);camera.position.copy(v.p).addScaledVector(v.up,1.55);const bank=THREE.MathUtils.clamp(v.t.clone().cross(ahead.t).y*-8,-.32,.32);const up=v.up.clone().applyAxisAngle(v.t,bank);const look=course.getPointAt((u+.008)%1).addScaledVector(v.up,1.5);const m=new THREE.Matrix4().lookAt(camera.position,look,up);targetQuat.setFromRotationMatrix(m);if(first){camera.quaternion.copy(targetQuat);first=false;}else camera.quaternion.slerp(targetQuat,1-Math.exp(-dt*9));camera.fov=THREE.MathUtils.lerp(camera.fov,71+velocity*.2,.03);camera.updateProjectionMatrix();for(let i=0;i<birds.length;i++){birds[i].position.x+=dt*(2+i*.08);birds[i].rotation.z=Math.sin(elapsed*1.8+i)*.12;if(birds[i].position.x>400)birds[i].position.x=-250;}water.material.color.setHSL(.52,.34,.39+Math.sin(elapsed*.25)*.007);if(gain)gain.gain.setTargetAtTime(soundOn&&!paused?.025+velocity*.001:0,audioContext.currentTime,.2);$('speedRead').textContent=paused?'0':Math.round(velocity*3.6*multiplier);$('heightRead').textContent=Math.round(v.p.y+3);$('fill').style.width=(u*100)+'%';$('marker').style.left=(u*100)+'%';const idx=u<.25?0:u<.43?1:u<.75?2:3;if(idx!==current){current=idx;[$('section').textContent,$('title').textContent,$('caption').textContent]=sections[idx];}renderer.render(scene,camera);}
animate();$('loader').classList.add('hidden');
</script>
<script>setTimeout(()=>{if(!document.querySelector('canvas'))document.getElementById('loadingText').textContent='Unable to load the ride. Check your connection and reload.'},12000);</script>
</body></html>
