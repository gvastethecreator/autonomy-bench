<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NODE FORGE — Visual Flow Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#070A12;
    --panel:#0F1320;
    --panel2:#151A2E;
    --border:#1E2545;
    --border2:#2A3360;
    --text:#E6E9F5;
    --muted:#8A91B4;
    --accent:#6C5CFF;
    --accent2:#00D9FF;
    --accent3:#FF3B82;
    --ok:#00E5A0;
    --warn:#FFB800;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
  /* Topbar */
  .topbar{
    height:56px;display:flex;align-items:center;gap:16px;
    padding:0 14px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(18,20,38,.95), rgba(12,14,26,.98));
    backdrop-filter: blur(12px);position:relative;z-index:20;
  }
  .logo{display:flex;align-items:center;gap:12px}
  .logo-mark{
    width:36px;height:36px;border-radius:10px;
    background: conic-gradient(from 0deg,#6C5CFF,#00D9FF,#FF3B82,#6C5CFF);
    display:grid;place-items:center;box-shadow:0 0 20px rgba(108,92,255,.5), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .logo-mark span{width:22px;height:22px;background:#0B0E1E;border-radius:7px;display:grid;place-items:center;font:800 11px JetBrains Mono;color:#fff;letter-spacing:.04em}
  .logo h1{font:800 13px/1 Inter;letter-spacing:.14em;margin:0}
  .logo p{margin:0;font:500 10px JetBrains Mono;color:var(--muted);letter-spacing:.08em;margin-top:2px}
  .top-stats{display:flex;gap:8px;align-items:center;margin-left:10px}
  .pill{
    font:700 10px JetBrains Mono;letter-spacing:.08em;padding:6px 9px;border-radius:999px;
    background:#0E1226;border:1px solid var(--border);color:var(--muted);display:flex;gap:6px;align-items:center
  }
  .pill b{color:var(--text)}
  .pill.live{color:#00E5A0;border-color:rgba(0,229,160,.3);background:rgba(0,229,160,.08)}
  .pill.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
  .spacer{flex:1}
  .toolbar{display:flex;gap:8px;align-items:center}
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    font:600 12px Inter;padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;gap:7px;align-items:center;
    transition:.15s;white-space:nowrap
  }
  .btn:hover{border-color:var(--border2);transform:translateY(-1px);background:#1A2040}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,#6C5CFF,#3B82FF);border-color:transparent;box-shadow:0 6px 18px rgba(108,92,255,.35);color:#fff}
  .btn.ghost{background:transparent}
  .btn.small{padding:6px 9px;font-size:11px}
  /* Layout */
  .app{display:grid;grid-template-columns:260px 1fr 280px;grid-template-rows:1fr; height:calc(100% - 56px)}
  @media(max-width:1100px){ .app{grid-template-columns:220px 1fr 260px} }
  @media(max-width:860px){ .app{grid-template-columns:1fr} .panel.left,.panel.right{display:none} }
  .panel{background:linear-gradient(180deg,#0E1226 0%, #0B0F20 100%);border-right:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
  .panel.right{border-right:none;border-left:1px solid var(--border)}
  .panel-head{padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between}
  .panel-head h2{margin:0;font:800 11px JetBrains Mono;letter-spacing:.14em;color:var(--muted)}
  .panel-head .icon-btn{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .search{margin:0 14px 12px;position:relative}
  .search input{
    width:100%;background:#0A0E1E;border:1px solid var(--border);border-radius:10px;
    padding:9px 10px 9px 30px; color:var(--text);font:500 12px Inter;outline:none
  }
  .search input::placeholder{color:#5B638C}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.6}
  .palette{overflow:auto;padding:0 10px 10px;flex:1;scrollbar-width:thin}
  .group{margin-bottom:14px}
  .group h3{margin:8px 4px 8px;font:700 10px JetBrains Mono;letter-spacing:.12em;color:#6B7396}
  .node-btn{
    width:100%;text-align:left;display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.02);
    cursor:pointer;transition:.15s;margin-bottom:6px
  }
  .node-btn:hover{background:#151A33;border-color:var(--border2);transform:translateX(2px)}
  .node-btn .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 11px JetBrains Mono;color:#fff;flex:none}
  .node-btn .txt b{font:600 12px Inter;color:var(--text);display:block}
  .node-btn .txt span{font:500 11px Inter;color:var(--muted);display:block;margin-top:1px}
  /* Canvas */
  .canvas-wrap{position:relative;overflow:hidden;background:var(--bg)}
  #viewport{
    position:absolute;inset:0;overflow:hidden;cursor:grab;
  }
  #viewport.grabbing{cursor:grabbing}
  #viewport.connecting{cursor:crosshair}
  .grid{
    position:absolute;inset:-2000px;
    background:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px),
      radial-gradient(ellipse at 30% 20%, rgba(108,92,255,.15), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(0,217,255,.12), transparent 60%),
      linear-gradient(180deg,#070A12,#0A0F24);
    background-size: 40px 40px, 40px 40px, auto, auto, auto;
  }
  #world{
    position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  }
  svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  svg.wires path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  svg.wires path.hit{pointer-events:stroke;stroke:transparent;stroke-width:18}
  /* Node */
  .node{
    position:absolute;width:220px;background:linear-gradient(180deg,#131836 0%, #0F1330 100%);
    border:1px solid #242E62;border-radius:14px;box-shadow:
      0 10px 30px rgba(0,0,0,.45),
      0 1px 0 rgba(255,255,255,.06) inset,
      0 0 0 1px rgba(255,255,255,.02) inset;
    overflow:hidden;user-select:none;
  }
  .node.selected{border-color:#6C5CFF;box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(108,92,255,.4), 0 0 20px rgba(108,92,255,.25)}
  .node.running{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 18px rgba(0,229,160,.18)}
  .node-head{
    height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0));
    border-bottom:1px solid rgba(255,255,255,.06);cursor:grab;
  }
  .node-head:active{cursor:grabbing}
  .node-head .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 10px JetBrains Mono;color:#fff;flex:none}
  .node-head b{font:700 12px Inter;letter-spacing:.02em}
  .node-head span{margin-left:auto;font:700 9px JetBrains Mono;letter-spacing:.1em;color:var(--muted);background:rgba(255,255,255,.06);padding:4px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
  .node-head .del{width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--muted);display:grid;place-items:center;cursor:pointer;font:700 12px Inter}
  .node-head .del:hover{background:rgba(255,59,130,.15);border-color:rgba(255,59,130,.4);color:#FF8DB6}
  .node-body{padding:10px 10px 11px;display:flex;flex-direction:column;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font:700 9px JetBrains Mono;letter-spacing:.1em;color:#8A91B4}
  .field input[type="range"]{width:100%;accent-color:#6C5CFF}
  .field input[type="number"], .field input[type="text"]{
    background:#0A0E1E;border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:var(--text);font:600 12px JetBrains Mono;outline:none;width:100%
  }
  .field input[type="color"]{width:100%;height:30px;border-radius:8px;border:1px solid var(--border);background:#0A0E1E;padding:2px}
  .preview{
    height:56px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#070A12;overflow:hidden;display:grid;place-items:center;position:relative
  }
  .preview canvas{width:100%;height:100%;display:block}
  .preview .val{position:absolute;inset:auto 8px 6px auto;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);color:#fff;font:700 10px JetBrains Mono;padding:4px 6px;border-radius:999px;backdrop-filter:blur(6px)}
  .bar{height:6px;border-radius:999px;background:#0A0E1E;border:1px solid var(--border);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#6C5CFF,#00D9FF);width:50%}
  .ports{display:flex;justify-content:space-between;gap:6px}
  .port-col{display:flex;flex-direction:column;gap:8px}
  .port{
    display:flex;align-items:center;gap:7px;font:600 11px Inter;color:#C8CEE9;min-height:18px
  }
  .port.in{flex-direction:row}
  .port.out{flex-direction:row-reverse}
  .port .sock{
    width:14px;height:14px;border-radius:50%;border:2px solid #2A3360;background:#0A0E1E;position:relative;cursor:pointer;
    box-shadow:0 0 0 3px rgba(0,0,0,.25);transition:.15s;flex:none
  }
  .port .sock:hover{transform:scale(1.2);border-color:#6C5CFF}
  .port .sock.connected{background:#6C5CFF;border-color:#A99CFF;box-shadow:0 0 10px rgba(108,92,255,.8)}
  .port .sock.number{border-color:#3B82FF}
  .port .sock.number.connected{background:#3B82FF;border-color:#93C5FD;box-shadow:0 0 10px rgba(59,130,246,.8)}
  .port .sock.color{border-color:#FF3B82}
  .port .sock.color.connected{background:#FF3B82;box-shadow:0 0 10px rgba(255,59,130,.8)}
  /* Inspector */
  .inspector{padding:12px 14px;overflow:auto;flex:1}
  .empty{height:100%;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
  .empty .big{width:46px;height:46px;border-radius:12px;background:rgba(108,92,255,.12);border:1px solid rgba(108,92,255,.2);display:grid;place-items:center;margin:0 auto 12px;color:#A99CFF}
  .prop-group{border:1px solid var(--border);background:rgba(255,255,255,.02);border-radius:12px;padding:12px;margin-bottom:10px}
  .prop-group h4{margin:0 0 10px;font:800 10px JetBrains Mono;letter-spacing:.12em;color:var(--muted)}
  .kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06);font:500 12px Inter}
  .kv:last-child{border:none}
  .kv b{font:700 11px JetBrains Mono;color:var(--text)}
  /* Bottom bar */
  .bottom{
    position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;pointer-events:none
  }
  .bottom > *{pointer-events:auto}
  .zoombar{
    display:flex;align-items:center;gap:6px;background:rgba(15,19,38,.9);border:1px solid var(--border);backdrop-filter:blur(10px);
    padding:6px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)
  }
  .zoombar button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;display:grid;place-items:center}
  .zoombar span{font:700 11px JetBrains Mono;min-width:54px;text-align:center;color:var(--muted)}
  .hint{
    background:rgba(15,19,38,.9);border:1px solid var(--border);border-radius:999px;padding:7px 10px;font:500 11px Inter;color:var(--muted);display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px)
  }
  .hint kbd{font:700 10px JetBrains Mono;background:#0A0E1E;border:1px solid var(--border);border-bottom-width:2px;padding:2px 5px;border-radius:6px;color:var(--text)}
  .minimap{
    position:absolute;right:14px;bottom:14px;width:180px;height:120px;
    background:rgba(10,14,30,.92);border:1px solid var(--border);border-radius:12px;overflow:hidden;backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.35)
  }
  .minimap canvas{width:100%;height:100%;display:block}
  .minimap .label{position:absolute;left:8px;top:6px;font:800 9px JetBrains Mono;letter-spacing:.12em;color:var(--muted);background:rgba(255,255,255,.06);padding:3px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
  .viewport-rect{position:absolute;border:1px solid #6C5CFF;background:rgba(108,92,255,.12);border-radius:3px;pointer-events:none}
  /* Context menu */
  .ctx{
    position:fixed;min-width:200px;background:#0F1326;border:1px solid var(--border2);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px;z-index:50;display:none
  }
  .ctx.open{display:block}
  .ctx button{width:100%;text-align:left;padding:9px 10px;border-radius:9px;border:none;background:transparent;color:var(--text);font:500 12px Inter;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .ctx button:hover{background:#1A2040}
  .ctx button span{color:var(--muted);font:700 10px JetBrains Mono}
  .ctx hr{border:none;border-top:1px solid var(--border);margin:6px 0}
  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);
    background:#0F1326;border:1px solid var(--border2);color:var(--text);font:600 12px Inter;
    padding:10px 14px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Wires animation */
  @keyframes dash{to{stroke-dashoffset:-20}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark"><span>◈</span></div>
      <div>
        <h1>NODE FORGE</h1>
        <p>VISUAL FLOW EDITOR • SHOWCASE</p>
      </div>
    </div>
    <div class="top-stats">
      <div class="pill live"><i></i> LIVE</div>
      <div class="pill"><span>NODES</span> <b id="statNodes">0</b></div>
      <div class="pill"><span>WIRES</span> <b id="statWires">0</b></div>
      <div class="pill" id="fpsPill">60 FPS</div>
    </div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button class="btn small" id="btnFit">⟡ Fit View</button>
      <button class="btn small" id="btnAuto">✦ Auto Layout</button>
      <button class="btn small" id="btnClear">Clear</button>
      <button class="btn ghost small" id="btnExport">Export JSON</button>
      <button class="btn ghost small" id="btnImport">Import</button>
      <button class="btn primary" id="btnAddDemo">+ Add Node</button>
    </div>
  </div>

  <div class="app">
    <div class="panel left">
      <div class="panel-head"><h2>PALETTE</h2><button class="icon-btn" id="btnCollapseLeft">−</button></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A91B4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg>
        <input id="search" placeholder="Search nodes…"/>
      </div>
      <div class="palette" id="palette"></div>
      <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px">
        <button class="btn small" style="flex:1" id="btnPlay">▶ Running</button>
        <button class="btn small" id="btnShot">◉ Capture</button>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <div id="viewport">
        <div class="grid" id="grid"></div>
        <div id="world">
          <svg class="wires" id="svgWires" width="3000" height="2000"></svg>
          <div id="nodesLayer"></div>
        </div>
      </div>
      <div class="bottom">
        <div class="zoombar">
          <button id="zOut">−</button>
          <span id="zLabel">100%</span>
          <button id="zIn">+</button>
          <button id="zReset" title="Reset view" style="margin-left:4px">◎</button>
        </div>
        <div class="hint">
          <span><kbd>Drag</kbd> pan</span>
          <span><kbd>Wheel</kbd> zoom</span>
          <span><kbd>Drag</kbd> from port to connect</span>
          <span><kbd>Del</kbd> delete</span>
          <span><kbd>Right-click</kbd> add</span>
        </div>
      </div>
      <div class="minimap" id="minimap">
        <div class="label">MINIMAP</div>
        <canvas id="miniCanvas" width="180" height="120"></canvas>
        <div class="viewport-rect" id="miniRect"></div>
      </div>
    </div>

    <div class="panel right">
      <div class="panel-head"><h2>INSPECTOR</h2><span id="selId" style="font:700 10px JetBrains Mono;color:var(--muted)"></span></div>
      <div class="inspector" id="inspector"></div>
    </div>
  </div>

  <div class="ctx" id="ctxMenu"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileIn" accept=".json" style="display:none"/>

<script>
/* ========== Registry ========== */
const DEF = {
  number: {title:'Number', cat:'Input', color:'#3B82FF', icon:'01', inputs:[], outputs:[{id:'out', name:'value', type:'number'}], defaults:{value:0.65}, desc:'Constant number 0–1'},
  slider: {title:'Slider', cat:'Input', color:'#06B6D4', icon:'SL', inputs:[], outputs:[{id:'out', name:'value', type:'number'}], defaults:{value:0.42}, desc:'Draggable control'},
  time: {title:'Time', cat:'Input', color:'#00E5A0', icon:'◷', inputs:[], outputs:[{id:'out', name:'t', type:'number'}], defaults:{speed:0.45, mode:'loop'}, desc:'Animated 0→1 loop'},
  add: {title:'Add', cat:'Math', color:'#6C5CFF', icon:'+', inputs:[{id:'a', name:'A', type:'number'},{id:'b', name:'B', type:'number'}], outputs:[{id:'out', name:'sum', type:'number'}], defaults:{}, desc:'A + B'},
  multiply: {title:'Multiply', cat:'Math', color:'#7C3AED', icon:'×', inputs:[{id:'a', name:'A', type:'number'},{id:'b', name:'B', type:'number'}], outputs:[{id:'out', name:'out', type:'number'}], defaults:{}, desc:'A × B'},
  sin: {title:'Sine', cat:'Math', color:'#F59E0B', icon:'∿', inputs:[{id:'in', name:'in', type:'number'}], outputs:[{id:'out', name:'sin', type:'number'}], defaults:{freq:1, amp:1}, desc:'sin(in × freq) × amp'},
  mix: {title:'Mix', cat:'Math', color:'#EC4899', icon:'⇄', inputs:[{id:'a', name:'A', type:'number'},{id:'b', name:'B', type:'number'},{id:'t', name:'T', type:'number'}], outputs:[{id:'out', name:'out', type:'number'}], defaults:{}, desc:'lerp(A,B,T)'},
  clamp: {title:'Clamp', cat:'Math', color:'#8B5CF6', icon:'↔', inputs:[{id:'in', name:'in', type:'number'}], outputs:[{id:'out', name:'out', type:'number'}], defaults:{min:0, max:1}, desc:'clamp value'},
  color: {title:'Color', cat:'Output', color:'#FF3B82', icon:'⬢', inputs:[{id:'r', name:'R', type:'number'},{id:'g', name:'G', type:'number'},{id:'b', name:'B', type:'number'}], outputs:[{id:'out', name:'hex', type:'color'}], defaults:{}, desc:'RGB → preview'},
  display: {title:'Display', cat:'Output', color:'#10B981', icon:'◧', inputs:[{id:'in', name:'in', type:'number'}], outputs:[], defaults:{}, desc:'Graph + value'},
  split: {title:'Split / Join', cat:'Utility', color:'#64748B', icon:'⫶', inputs:[{id:'in', name:'in', type:'number'}], outputs:[{id:'x', name:'x1', type:'number'},{id:'y', name:'x2', type:'number'}], defaults:{bias:0.5}, desc:'Fan-out helper'},
};

const CAT_ORDER = ['Input','Math','Output','Utility'];
const CAT_COLOR = {Input:'#3B82FF', Math:'#6C5CFF', Output:'#FF3B82', Utility:'#64748B'};

/* ========== State ========== */
let nodes=[], edges=[], nextId=1, nextEdge=1;
let selectedId=null;
let viewport={x:0,y:0,scale:1};
let isPanning=false, panStart={x:0,y:0}, viewStart={x:0,y:0};
let dragNode=null, dragOff={x:0,y:0};
let connecting=null; // {from:{nodeId,port}, x,y}
let playing=true, t=0;
let hoverEdge=null;

const $ = s=>document.querySelector(s);
const nodesLayer=$('#nodesLayer');
const svgWires=$('#svgWires');
const world=$('#world');
const viewportEl=$('#viewport');
const paletteEl=$('#palette');
const inspectorEl=$('#inspector');
const gridEl=$('#grid');

/* ========== Helpers ========== */
function uid(){ return 'n'+(nextId++) }
function eid(){ return 'e'+(nextEdge++) }
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800);
}
function toWorld(clientX,clientY){
  const r=viewportEl.getBoundingClientRect();
  return { x:(clientX - r.left - viewport.x)/viewport.scale, y:(clientY - r.top - viewport.y)/viewport.scale };
}
function nodeById(id){return nodes.find(n=>n.id===id)}
function portPos(nodeId, portId, isOut){
  const n=nodeById(nodeId); if(!n) return {x:0,y:0};
  const el=document.querySelector(`[data-node="${nodeId}"] [data-port="${portId}"] .sock`);
  if(!el) return {x: n.x + (isOut?220:0), y: n.y+40};
  const r=el.getBoundingClientRect();
  const pr=viewportEl.getBoundingClientRect();
  const p=toWorld(r.left+r.width/2, r.top+r.height/2);
  return p;
}
function evalGraph(){
  // build map nodeId -> outputs
  const out = new Map();
  // helper get input value
  function getInput(node, portId){
    const e=edges.find(ed=>ed.to.nodeId===node.id && ed.to.port===portId);
    if(!e){ // no wire, use default 0 or bias
      // if port has fallback from node data? For most, 0
      return 0;
    }
    const srcOut=out.get(e.from.nodeId);
    if(!srcOut) return 0;
    return srcOut[e.from.port] ?? 0;
  }
  // topological order attempt: simple iterative, 2 passes enough for showcase DAG
  // iterate nodes in current order with multiple passes to propagate; break cycles by cap.
  const nodeMap=new Map(nodes.map(n=>[n.id,n]));
  // first set defaults for constants
  // we need order: do BFS-like relaxed evaluation 8 iterations
  for(let iter=0; iter<8; iter++){
    for(const n of nodes){
      const d=DEF[n.type];
      let res={};
      const data=n.data;
      switch(n.type){
        case 'number': res.out=data.value; break;
        case 'slider': res.out=data.value; break;
        case 'time': {
          let tt = t* (data.speed ?? 0.45);
          if(data.mode==='pingpong') tt = Math.abs((tt%2)-1);
          else tt = tt%1;
          res.out=tt;
          break;
        }
        case 'add': res.out = getInput(n,'a') + getInput(n,'b'); break;
        case 'multiply': res.out = getInput(n,'a') * getInput(n,'b'); break;
        case 'sin': {
          const freq=data.freq??1, amp=data.amp??1;
          res.out = Math.sin(getInput(n,'in') * Math.PI*2 * freq) * amp;
          // map -1..1 to 0..1 for downstream visual niceness? keep -1..1 but clamp visually later, but our graph expects 0..1 so remap:
          res.out = (res.out+1)/2;
          break;
        }
        case 'mix': res.out = lerp(getInput(n,'a'), getInput(n,'b'), clamp(getInput(n,'t'),0,1)); break;
        case 'clamp': res.out = clamp(getInput(n,'in'), data.min??0, data.max??1); break;
        case 'color': {
          const r=clamp(getInput(n,'r'),0,1), g=clamp(getInput(n,'g'),0,1), b=clamp(getInput(n,'b'),0,1);
          const hex='#'+[r,g,b].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
          res.out=hex; res._r=r; res._g=g; res._b=b;
          break;
        }
        case 'display': res.in=getInput(n,'in'); break;
        case 'split': {
          const v=getInput(n,'in'); const bias=data.bias??0.5;
          res.x = v*bias; res.y = v*(1-bias);
          break;
        }
      }
      out.set(n.id,res);
    }
  }
  return out;
}

/* ========== Rendering ========== */
function renderPalette(){
  const q=($('#search').value||'').toLowerCase();
  paletteEl.innerHTML='';
  CAT_ORDER.forEach(cat=>{
    const items=Object.entries(DEF).filter(([k,v])=>v.cat===cat && (!q || k.includes(q) || v.title.toLowerCase().includes(q) || v.desc.toLowerCase().includes(q)));
    if(!items.length) return;
    const g=document.createElement('div'); g.className='group';
    g.innerHTML=`<h3>${cat.toUpperCase()}</h3>`;
    items.forEach(([key,def])=>{
      const b=document.createElement('button'); b.className='node-btn'; b.dataset.type=key;
      b.innerHTML=`<div class="ic" style="background:${def.color};box-shadow:0 4px 12px ${def.color}55">${def.icon}</div><div class="txt"><b>${def.title}</b><span>${def.desc}</span></div>`;
      b.addEventListener('click',()=> addNode(key, 80 + Math.random()*60, 80+Math.random()*60, true));
      g.appendChild(b);
    });
    paletteEl.appendChild(g);
  });
}
function renderNodes(){
  nodesLayer.innerHTML='';
  const outVals = evalGraph();
  nodes.forEach(n=>{
    const def=DEF[n.type];
    const vals=outVals.get(n.id)||{};
    const el=document.createElement('div');
    el.className='node'+(selectedId===n.id?' selected':'') + (playing?' running':'');
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    el.dataset.node=n.id;
    const isSelected = selectedId===n.id;
    // header
    let head=`<div class="node-head" data-drag="${n.id}">
      <div class="dot" style="background:${def.color}">${def.icon}</div>
      <b style="color:${isSelected?'#fff':'#E6E9F5'}">${def.title}</b>
      <span>${def.cat}</span>
      <button class="del" data-del="${n.id}">×</button>
    </div>`;
    // body fields
    let bodyInner='';
    if(n.type==='number' || n.type==='slider'){
      const v=(n.data.value??0).toFixed(2);
      bodyInner+=`<div class="field"><label>VALUE — ${v}</label><input type="range" min="0" max="1" step="0.01" value="${n.data.value}" data-field="value" data-node="${n.id}"/><div class="bar"><i style="width:${n.data.value*100}%"></i></div></div>`;
    } else if(n.type==='time'){
      bodyInner+=`<div class="field"><label>SPEED — ${(n.data.speed??0.45).toFixed(2)}</label><input type="range" min="0" max="2" step="0.05" value="${n.data.speed}" data-field="speed" data-node="${n.id}"/></div>`;
    } else if(n.type==='sin'){
      bodyInner+=`<div class="field"><label>FREQ ${n.data.freq}  •  AMP ${n.data.amp}</label><div style="display:flex;gap:6px"><input type="range" min="0.2" max="4" step="0.2" value="${n.data.freq}" data-field="freq" data-node="${n.id}" style="flex:1"/><input type="range" min="0.2" max="2" step="0.1" value="${n.data.amp}" data-field="amp" data-node="${n.id}" style="flex:1"/></div></div>`;
    } else if(n.type==='clamp'){
      bodyInner+=`<div class="field"><label>RANGE</label><div style="display:flex;gap:6px"><input type="number" step="0.05" value="${n.data.min}" data-field="min" data-node="${n.id}" style="flex:1"/><input type="number" step="0.05" value="${n.data.max}" data-field="max" data-node="${n.id}" style="flex:1"/></div></div>`;
    } else if(n.type==='split'){
      bodyInner+=`<div class="field"><label>BIAS — ${n.data.bias}</label><input type="range" min="0" max="1" step="0.05" value="${n.data.bias}" data-field="bias" data-node="${n.id}"/></div>`;
    } else if(n.type==='color'){
      const hex=vals.out||'#6C5CFF';
      bodyInner+=`<div class="preview" style="background:${hex}"><div class="val">${hex.toUpperCase()}</div></div>`;
    } else if(n.type==='display'){
      const v=vals.in??0;
      const pct=clamp(v,0,1)*100;
      bodyInner+=`<div class="preview" style="background:#070A12"><canvas data-canvas="${n.id}" width="200" height="56"></canvas><div class="val">${v.toFixed(3)}</div></div><div class="bar"><i style="width:${pct}%"></i></div>`;
    } else {
      // generic small hint
      bodyInner+=`<div style="font:500 11px Inter;color:#8A91B4;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:8px;border-radius:9px">${def.desc}</div>`;
    }
    // ports
    let portsHtml=`<div class="ports">`;
    portsHtml+=`<div class="port-col">`;
    def.inputs.forEach(inp=>{
      const connected=edges.some(e=>e.to.nodeId===n.id && e.to.port===inp.id);
      portsHtml+=`<div class="port in" data-port="${inp.id}"><div class="sock ${connected?'connected':''} ${inp.type}" data-sock="${n.id}:${inp.id}:in"></div><span>${inp.name}</span></div>`;
    });
    if(!def.inputs.length) portsHtml+=`<div style="font:700 9px JetBrains Mono;color:#3A4266;letter-spacing:.08em;padding:2px 0">NO INPUTS</div>`;
    portsHtml+=`</div><div class="port-col" style="align-items:flex-end">`;
    def.outputs.forEach(out=>{
      const connected=edges.some(e=>e.from.nodeId===n.id && e.from.port===out.id);
      // show value badge for outputs
      let badge='';
      if(out.type==='number' && vals[out.id]!==undefined) badge=`<span style="font:700 10px JetBrains Mono;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:2px 5px;border-radius:999px;color:#C8CEE9">${Number(vals[out.id]).toFixed(2)}</span>`;
      if(out.type==='color' && vals.out) badge=`<span style="width:10px;height:10px;border-radius:50%;background:${vals.out};border:1px solid rgba(255,255,255,.3);display:inline-block"></span>`;
      portsHtml+=`<div class="port out" data-port="${out.id}">${badge}<span>${out.name}</span><div class="sock ${connected?'connected':''} ${out.type}" data-sock="${n.id}:${out.id}:out"></div></div>`;
    });
    if(!def.outputs.length) portsHtml+=`<div style="font:700 9px JetBrains Mono;color:#3A4266;letter-spacing:.08em">OUTPUT</div>`;
    portsHtml+=`</div></div>`;

    el.innerHTML=head+`<div class="node-body">${bodyInner}${portsHtml}</div>`;
    nodesLayer.appendChild(el);
  });
  // draw displays canvas after append
  nodes.forEach(n=>{
    if(n.type==='display'){
      const c=document.querySelector(`canvas[data-canvas="${n.id}"]`);
      if(c){
        const ctx=c.getContext('2d');
        ctx.clearRect(0,0,c.width,c.height);
        // history
        n._hist=n._hist||[];
        const vals=outVals.get(n.id)||{};
        n._hist.push(vals.in??0);
        if(n._hist.length>60) n._hist.shift();
        // background
        ctx.fillStyle='#070A12'; ctx.fillRect(0,0,c.width,c.height);
        // grid
        ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
        for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(0, i*14+7); ctx.lineTo(c.width, i*14+7); ctx.stroke(); }
        // line
        ctx.strokeStyle='#6C5CFF'; ctx.lineWidth=2; ctx.beginPath();
        n._hist.forEach((v,i)=>{
          const x=i/(59)*c.width;
          const y= 50 - clamp(v,0,1)*36 - 4;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
        // glow
        ctx.strokeStyle='rgba(108,92,255,.25)'; ctx.lineWidth=6; ctx.stroke();
      }
    }
  });
  // delete handlers
  document.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click',e=>{e.stopPropagation(); removeNode(b.dataset.del)}));
  // range/input handlers
  document.querySelectorAll('[data-field]').forEach(inp=>{
    const handler = (e)=>{
      const nid=inp.dataset.node, field=inp.dataset.field;
      const node=nodeById(nid); if(!node) return;
      let v=inp.value;
      if(inp.type==='range' || inp.type==='number') v=parseFloat(v);
      node.data[field]=v;
      renderNodes(); renderWires(); renderInspector();
    };
    inp.addEventListener('input',handler);
    inp.addEventListener('change',handler);
  });
  // sock handlers for connecting
  document.querySelectorAll('[data-sock]').forEach(el=>{
    const [nid,pid,dir]=el.dataset.sock.split(':');
    el.addEventListener('pointerdown',e=>{
      e.stopPropagation(); e.preventDefault();
      const startPos=portPos(nid,pid,dir==='out');
      if(dir==='out'){
        connecting={from:{nodeId:nid,port:pid}, x:startPos.x, y:startPos.y};
      } else {
        // if input already connected, start from its source
        const existing=edges.find(ed=>ed.to.nodeId===nid && ed.to.port===pid);
        if(existing){
          // detach and drag from source
          const src=existing.from;
          connecting={from:src, x:startPos.x, y:startPos.y};
          edges=edges.filter(ed=>ed!==existing);
          renderWires();
        } else {
          // no wire, ignore? allow dragging from input as target search, but our model is out->in, so we set temporary target?
          // Instead, set connecting null and wait for out->in; show toast
          toast('Drag from an output (right side) to an input');
          return;
        }
      }
      viewportEl.classList.add('connecting');
      viewportEl.setPointerCapture(e.pointerId);
    });
  });
  // node selection & dragging
  document.querySelectorAll('.node').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      const nid=el.dataset.node;
      selectedId=nid;
      renderNodes(); renderInspector(); renderWires();
      if(e.target.closest('[data-drag]')){
        dragNode=nodeById(nid);
        const wp=toWorld(e.clientX,e.clientY);
        dragOff={x: wp.x - dragNode.x, y: wp.y - dragNode.y};
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });
  });

  updateStats();
  drawMini();
}

function renderWires(){
  const outVals=evalGraph();
  // size svg to cover world
  svgWires.setAttribute('width',3000);
  svgWires.setAttribute('height',2000);
  svgWires.innerHTML='';
  const defs=`<defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6C5CFF"/><stop offset="100%" stop-color="#00D9FF"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF3B82"/><stop offset="100%" stop-color="#FFB800"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
  svgWires.innerHTML+=defs;
  // draw edges
  edges.forEach(e=>{
    const fromPos=portPos(e.from.nodeId, e.from.port, true);
    const toPos=portPos(e.to.nodeId, e.to.port, false);
    const dx=Math.abs(toPos.x - fromPos.x)*0.5 + 40;
    const path=`M ${fromPos.x} ${fromPos.y} C ${fromPos.x+dx} ${fromPos.y}, ${toPos.x-dx} ${toPos.y}, ${toPos.x} ${toPos.y}`;
    // determine color by type
    const srcNode=nodeById(e.from.nodeId);
    const srcDef=DEF[srcNode?.type];
    const isColor = srcDef?.outputs.find(o=>o.id===e.from.port)?.type==='color';
    const stroke = isColor ? 'url(#g2)' : 'url(#g1)';
    const isActive = playing;
    const w = isColor? 3.5 : 2.8;
    const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',path); hit.setAttribute('class','hit');
    hit.style.cursor='pointer';
    hit.addEventListener('click',()=>{ edges=edges.filter(ed=>ed!==e); renderNodes(); renderWires(); toast('Wire removed');});
    hit.addEventListener('pointerenter',()=>{hoverEdge=e.id; renderWires();});
    hit.addEventListener('pointerleave',()=>{hoverEdge=null; renderWires();});
    svgWires.appendChild(hit);

    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',path);
    p.setAttribute('stroke',stroke);
    p.setAttribute('stroke-width', hoverEdge===e.id ? w+1.5 : w);
    p.setAttribute('opacity', hoverEdge && hoverEdge!==e.id ? 0.35 : 0.95);
    p.style.filter='url(#glow)';
    if(isActive) { p.setAttribute('stroke-dasharray','8 8'); p.style.animation='dash 0.6s linear infinite'; }
    svgWires.appendChild(p);

    // flow dot
    if(isActive && !isColor){
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      const prog = (t*0.9 + (e.id.charCodeAt(1)%10)/10)%1;
      // approximate position along bezier via lerp of bezier roughly
      // For simplicity, linear interpolation with curve offset lerp
      const cx = lerp(lerp(fromPos.x, fromPos.x+dx, prog), lerp(toPos.x-dx, toPos.x, prog), prog);
      const cy = lerp(lerp(fromPos.y, fromPos.y, prog), lerp(toPos.y, toPos.y, prog), prog) + Math.sin(prog*Math.PI)*18 * (fromPos.y < toPos.y ? 1 : -1) * 0.3;
      // better: cubic bezier exact
      const t2=prog, u=1-t2;
      const x = u*u*u*fromPos.x + 3*u*u*t2*(fromPos.x+dx) + 3*u*t2*t2*(toPos.x-dx) + t2*t2*t2*toPos.x;
      const y = u*u*u*fromPos.y + 3*u*u*t2*fromPos.y + 3*u*t2*t2*toPos.y + t2*t2*t2*toPos.y;
      dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('r','3.5'); dot.setAttribute('fill','#fff'); dot.setAttribute('opacity','0.95');
      dot.style.filter='drop-shadow(0 0 6px rgba(255,255,255,.9))';
      svgWires.appendChild(dot);
    }
  });
  // temp connecting wire
  if(connecting){
    const fromPos=portPos(connecting.from.nodeId, connecting.from.port, true);
    const toPos={x:connecting.x, y:connecting.y};
    const dx=Math.abs(toPos.x - fromPos.x)*0.45+40;
    const d=`M ${fromPos.x} ${fromPos.y} C ${fromPos.x+dx} ${fromPos.y}, ${toPos.x-dx} ${toPos.y}, ${toPos.x} ${toPos.y}`;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); p.setAttribute('stroke','#8A91B4'); p.setAttribute('stroke-width','2.5'); p.setAttribute('stroke-dasharray','6 6'); p.setAttribute('opacity','0.8');
    svgWires.appendChild(p);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',toPos.x); c.setAttribute('cy',toPos.y); c.setAttribute('r','5'); c.setAttribute('fill','#6C5CFF'); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','2');
    svgWires.appendChild(c);
  }
}

function renderInspector(){
  if(!selectedId || !nodeById(selectedId)){
    inspectorEl.innerHTML=`<div class="empty"><div><div class="big">◈</div><div style="font:700 13px Inter;color:var(--text)">No selection</div><div style="font:500 12px Inter;margin-top:6px">Click a node to inspect.<br/>Drag ports to wire them.<br/>Right-click canvas to add nodes.</div><div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><span class="pill">TIP: Double-click canvas</span></div></div></div>`;
    $('#selId').textContent='';
    return;
  }
  const n=nodeById(selectedId); const def=DEF[n.type];
  $('#selId').textContent=n.id.toUpperCase();
  const vals=evalGraph().get(n.id)||{};
  let html=`<div class="prop-group"><h4>NODE</h4>
    <div class="kv"><span>Type</span><b>${def.title}</b></div>
    <div class="kv"><span>Category</span><b>${def.cat}</b></div>
    <div class="kv"><span>Position</span><b>${Math.round(n.x)}, ${Math.round(n.y)}</b></div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn small" id="dupBtn">Duplicate</button>
      <button class="btn small" id="delBtn" style="color:#FF8DB6;border-color:rgba(255,59,130,.3)">Delete</button>
    </div>
  </div>`;
  // editable fields
  html+=`<div class="prop-group"><h4>PARAMETERS</h4>`;
  if(n.type==='number' || n.type==='slider'){
    html+=`<div class="field"><label>VALUE</label><input type="range" id="insVal" min="0" max="1" step="0.01" value="${n.data.value}"/><div class="kv"><span>Value</span><b>${Number(n.data.value).toFixed(3)}</b></div></div>`;
  } else if(n.type==='time'){
    html+=`<div class="field"><label>SPEED</label><input type="range" id="insSpeed" min="0" max="2" step="0.05" value="${n.data.speed}"/><div class="kv"><span>Mode</span><b>${n.data.mode}</b></div><button class="btn small" id="toggleMode" style="width:100%;margin-top:6px">Toggle ping-pong</button></div>`;
  } else if(n.type==='sin'){
    html+=`<div class="field"><label>FREQUENCY</label><input type="range" id="insFreq" min="0.2" max="4" step="0.2" value="${n.data.freq}"/></div><div class="field"><label>AMPLITUDE</label><input type="range" id="insAmp" min="0.2" max="2" step="0.1" value="${n.data.amp}"/></div>`;
  } else if(n.type==='clamp'){
    html+=`<div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>MIN</label><input type="number" id="insMin" value="${n.data.min}" step="0.05"/></div><div class="field" style="flex:1"><label>MAX</label><input type="number" id="insMax" value="${n.data.max}" step="0.05"/></div></div>`;
  } else if(n.type==='split'){
    html+=`<div class="field"><label>BIAS</label><input type="range" id="insBias" min="0" max="1" step="0.05" value="${n.data.bias}"/></div>`;
  } else {
    html+=`<div style="font:500 12px Inter;color:var(--muted)">No editable parameters for this node. Wire its inputs to control it.</div>`;
  }
  html+=`</div>`;
  // live values
  html+=`<div class="prop-group"><h4>LIVE VALUES</h4>`;
  Object.entries(vals).forEach(([k,v])=>{
    if(k.startsWith('_')) return;
    const disp = typeof v==='string' ? v : Number(v).toFixed(3);
    const w = typeof v==='number' ? clamp(v,0,1)*100 : 100;
    html+=`<div class="kv"><span>${k}</span><b>${disp}</b></div>`;
    if(typeof v==='number') html+=`<div class="bar" style="margin-bottom:6px"><i style="width:${w}%"></i></div>`;
    if(typeof v==='string' && v.startsWith('#')) html+=`<div style="height:22px;border-radius:8px;background:${v};border:1px solid rgba(255,255,255,.12);margin-bottom:6px"></div>`;
  });
  if(!Object.keys(vals).length) html+=`<div style="font:500 12px Inter;color:var(--muted)">No outputs</div>`;
  html+=`</div>`;
  html+=`<div class="prop-group"><h4>WIRES</h4>`;
  const inEdges=edges.filter(e=>e.to.nodeId===n.id);
  const outEdges=edges.filter(e=>e.from.nodeId===n.id);
  html+=`<div class="kv"><span>Incoming</span><b>${inEdges.length}</b></div><div class="kv"><span>Outgoing</span><b>${outEdges.length}</b></div>`;
  if(inEdges.length) html+= inEdges.map(e=>`<div style="font:500 11px JetBrains Mono;color:var(--muted);padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)">← ${e.from.nodeId}.${e.from.port} → ${e.to.port}</div>`).join('');
  html+=`</div>`;
  inspectorEl.innerHTML=html;
  // bind inspector controls
  const bind=(id,evt,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener(evt,fn)};
  bind('insVal','input',e=>{n.data.value=parseFloat(e.target.value); renderNodes(); renderWires(); renderInspector();});
  bind('insSpeed','input',e=>{n.data.speed=parseFloat(e.target.value); renderInspector();});
  bind('toggleMode','click',()=>{n.data.mode=n.data.mode==='loop'?'pingpong':'loop'; renderInspector();});
  bind('insFreq','input',e=>{n.data.freq=parseFloat(e.target.value); renderNodes(); renderWires();});
  bind('insAmp','input',e=>{n.data.amp=parseFloat(e.target.value); renderNodes(); renderWires();});
  bind('insMin','input',e=>{n.data.min=parseFloat(e.target.value); renderNodes(); renderWires();});
  bind('insMax','input',e=>{n.data.max=parseFloat(e.target.value); renderNodes(); renderWires();});
  bind('insBias','input',e=>{n.data.bias=parseFloat(e.target.value); renderNodes(); renderWires();});
  const dup=document.getElementById('dupBtn'); if(dup) dup.addEventListener('click',()=> duplicateNode(n.id));
  const del=document.getElementById('delBtn'); if(del) del.addEventListener('click',()=> removeNode(n.id));
}

function updateStats(){
  $('#statNodes').textContent=nodes.length;
  $('#statWires').textContent=edges.length;
}
function applyView(){
  world.style.transform=`translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.scale})`;
  gridEl.style.transform=`translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.scale})`;
  // adjust grid offset to keep crispness? simple.
  $('#zLabel').textContent=Math.round(viewport.scale*100)+'%';
  drawMini();
}

/* ========== Minimap ========== */
function drawMini(){
  const c=$('#miniCanvas'); const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#0A0E1E'; ctx.fillRect(0,0,c.width,c.height);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=0.5;
  for(let x=0;x<c.width;x+=18){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,c.height); ctx.stroke(); }
  for(let y=0;y<c.height;y+=18){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y); ctx.stroke(); }
  if(!nodes.length) return;
  // bounds
  let minX=Math.min(...nodes.map(n=>n.x)), minY=Math.min(...nodes.map(n=>n.y));
  let maxX=Math.max(...nodes.map(n=>n.x+220)), maxY=Math.max(...nodes.map(n=>n.y+160));
  let pad=80; minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  let spanX=maxX-minX||800, spanY=maxY-minY||600;
  const scale=Math.min((c.width-10)/spanX, (c.height-10)/spanY);
  const offX=(c.width - spanX*scale)/2 - minX*scale;
  const offY=(c.height - spanY*scale)/2 - minY*scale;
  function tx(x){return x*scale+offX}
  function ty(y){return y*scale+offY}
  // edges
  ctx.strokeStyle='rgba(108,92,255,.6)'; ctx.lineWidth=1;
  edges.forEach(e=>{
    const a=nodeById(e.from.nodeId), b=nodeById(e.to.nodeId);
    if(!a||!b) return;
    ctx.beginPath();
    ctx.moveTo(tx(a.x+220), ty(a.y+36));
    ctx.bezierCurveTo(tx(a.x+260), ty(a.y+36), tx(b.x-40), ty(b.y+36), tx(b.x), ty(b.y+36));
    ctx.stroke();
  });
  // nodes
  nodes.forEach(n=>{
    const def=DEF[n.type];
    ctx.fillStyle=def.color;
    ctx.globalAlpha=0.95;
    ctx.fillRect(tx(n.x), ty(n.y), 220*scale, 28*scale);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(19,24,54,.95)';
    ctx.fillRect(tx(n.x), ty(n.y+28*scale), 220*scale, 22*scale);
    ctx.strokeStyle=n.id===selectedId?'#6C5CFF':'rgba(255,255,255,.12)';
    ctx.lineWidth= n.id===selectedId?1.2:0.6;
    ctx.strokeRect(tx(n.x), ty(n.y), 220*scale, 50*scale);
  });
  // viewport rect
  const vr=viewportEl.getBoundingClientRect();
  const worldTL=toWorld(vr.left, vr.top);
  const worldBR=toWorld(vr.right, vr.bottom);
  const rx=tx(worldTL.x), ry=ty(worldTL.y), rw=(worldBR.x-worldTL.x)*scale, rh=(worldBR.y-worldTL.y)*scale;
  const rectEl=$('#miniRect');
  rectEl.style.left=rx+'px'; rectEl.style.top=ry+'px'; rectEl.style.width=Math.max(8,rw)+'px'; rectEl.style.height=Math.max(8,rh)+'px';
}

/* ========== Node ops ========== */
function addNode(type, x, y, centered){
  const def=DEF[type]; if(!def) return;
  if(centered){
    const wp=toWorld(viewportEl.getBoundingClientRect().left + viewportEl.clientWidth/2, viewportEl.getBoundingClientRect().top + viewportEl.clientHeight/2);
    x=wp.x -110 + (Math.random()*80-40);
    y=wp.y -40 + (Math.random()*80-40);
  }
  const n={id:uid(), type, x:Math.round(x), y:Math.round(y), data:{...def.defaults}};
  nodes.push(n);
  selectedId=n.id;
  renderNodes(); renderWires(); renderInspector();
  toast(`${def.title} added`);
  return n;
}
function removeNode(id){
  nodes=nodes.filter(n=>n.id!==id);
  edges=edges.filter(e=>e.from.nodeId!==id && e.to.nodeId!==id);
  if(selectedId===id) selectedId=null;
  renderNodes(); renderWires(); renderInspector();
  toast('Node removed');
}
function duplicateNode(id){
  const src=nodeById(id); if(!src) return;
  const n={id:uid(), type:src.type, x:src.x+24, y:src.y+24, data:{...src.data}};
  nodes.push(n); selectedId=n.id; renderNodes(); renderWires(); renderInspector();
}

/* ========== Demo graph ========== */
function loadShowcase(){
  nodes=[]; edges=[]; nextId=1; nextEdge=1;
  // layout positions for spectacle
  const nTime = addNode('time',  60,  90, false); nTime.data.speed=0.62;
  const nTime2= addNode('time',  60,  260, false); nTime2.data.speed=0.35;
  const nSin  = addNode('sin',   340, 60, false); nSin.data.freq=1.4; nSin.data.amp=1;
  const nSin2 = addNode('sin',   340, 250, false); nSin2.data.freq=0.8; nSin2.data.amp=1;
  const nAdd  = addNode('add',   600, 140, false);
  const nMix  = addNode('mix',   860, 110, false);
  const nNum  = addNode('slider',860, 300, false); nNum.data.value=0.72;
  const nClr  = addNode('color', 1120, 70, false);
  const nDisp = addNode('display',1120, 300, false);
  const nNum2 = addNode('number',610, 310, false); nNum2.data.value=0.88;
  const nMul  = addNode('multiply',340, 410, false);
  const nDisp2= addNode('display',620, 440, false);
  // helper to connect
  function conn(a,ap,b,bp){ edges.push({id:eid(), from:{nodeId:a,port:ap}, to:{nodeId:b,port:bp}}); }
  conn(nTime.id,'out', nSin.id,'in');
  conn(nTime2.id,'out', nSin2.id,'in');
  conn(nSin.id,'out', nAdd.id,'a');
  conn(nSin2.id,'out', nAdd.id,'b');
  conn(nAdd.id,'out', nMix.id,'a');
  conn(nNum.id,'out', nMix.id,'b');
  conn(nTime.id,'out', nMix.id,'t');
  conn(nMix.id,'out', nClr.id,'r');
  conn(nAdd.id,'out', nClr.id,'g');
  conn(nNum2.id,'out', nClr.id,'b');
  conn(nMix.id,'out', nDisp.id,'in');
  conn(nTime2.id,'out', nMul.id,'a');
  conn(nNum2.id,'out', nMul.id,'b');
  conn(nMul.id,'out', nDisp2.id,'in');
  // fit view
  selectedId=nClr.id;
  viewport={x:30,y:12,scale:0.92};
  applyView(); renderNodes(); renderWires(); renderInspector();
}
function autoLayout(){
  // simple layered layout: assign columns by depth BFS
  const depth=new Map();
  function getDepth(nid, visiting=new Set()){
    if(depth.has(nid)) return depth.get(nid);
    if(visiting.has(nid)) return 0;
    visiting.add(nid);
    const incoming=edges.filter(e=>e.to.nodeId===nid);
    if(!incoming.length){ depth.set(nid,0); return 0; }
    const d=Math.max(...incoming.map(e=> getDepth(e.from.nodeId, visiting)+1));
    depth.set(nid,d); return d;
  }
  nodes.forEach(n=> getDepth(n.id));
  const cols=new Map();
  depth.forEach((d,id)=>{ if(!cols.has(d)) cols.set(d,[]); cols.get(d).push(nodeById(id));});
  const colKeys=[...cols.keys()].sort((a,b)=>a-b);
  colKeys.forEach((c,i)=>{
    const list=cols.get(c);
    list.forEach((n, j)=>{
      n.x= 60 + i*280;
      n.y= 60 + j*180 - (list.length-1)*45;
    });
  });
  renderNodes(); renderWires(); toast('Auto layout applied');
}

/* ========== Viewport interaction ========== */
viewportEl.addEventListener('pointerdown',e=>{
  if(e.target!==viewportEl && e.target!==gridEl && e.target!==world && e.target.closest('.node')) return;
  // background drag / pan
  isPanning=true; panStart={x:e.clientX, y:e.clientY}; viewStart={x:viewport.x,y:viewport.y};
  viewportEl.classList.add('grabbing'); viewportEl.setPointerCapture(e.pointerId);
  // deselect if clicking background
  if(e.button===0 && !e.target.closest('.node')){ selectedId=null; renderNodes(); renderInspector(); renderWires(); }
  // close ctx
  closeCtx();
});
viewportEl.addEventListener('pointermove',e=>{
  if(connecting){
    const wp=toWorld(e.clientX,e.clientY);
    connecting.x=wp.x; connecting.y=wp.y;
    renderWires();
  }
  if(dragNode){
    const wp=toWorld(e.clientX,e.clientY);
    dragNode.x=Math.round(wp.x - dragOff.x);
    dragNode.y=Math.round(wp.y - dragOff.y);
    renderNodes(); renderWires();
  } else if(isPanning){
    viewport.x= viewStart.x + (e.clientX - panStart.x);
    viewport.y= viewStart.y + (e.clientY - panStart.y);
    applyView(); renderWires();
  }
});
viewportEl.addEventListener('pointerup',e=>{
  if(connecting){
    // find drop target input port
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const sock=el?.closest('[data-sock]');
    if(sock){
      const [nid,pid,dir]=sock.dataset.sock.split(':');
      if(dir==='in'){
        // validate: input single connection, replace
        edges=edges.filter(ed=> !(ed.to.nodeId===nid && ed.to.port===pid));
        // prevent self-cycle direct?
        if(nid!==connecting.from.nodeId){
          edges.push({id:eid(), from:{...connecting.from}, to:{nodeId:nid,port:pid}});
          toast('Connected');
        } else toast('Cannot connect to self');
      } else {
        toast('Connect output → input');
      }
    }
    connecting=null; viewportEl.classList.remove('connecting');
    renderNodes(); renderWires();
  }
  isPanning=false; dragNode=null; viewportEl.classList.remove('grabbing');
  drawMini();
});
viewportEl.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta = -e.deltaY;
  const factor = Math.exp(delta*0.001);
  const newScale = clamp(viewport.scale*factor, 0.35, 1.8);
  // zoom towards cursor
  const r=viewportEl.getBoundingClientRect();
  const cx=e.clientX - r.left, cy=e.clientY - r.top;
  const wx=(cx - viewport.x)/viewport.scale, wy=(cy - viewport.y)/viewport.scale;
  viewport.scale=newScale;
  viewport.x= cx - wx*newScale;
  viewport.y= cy - wy*newScale;
  applyView(); renderWires();
},{passive:false});

// double click to add
viewportEl.addEventListener('dblclick',e=>{
  if(e.target.closest('.node')) return;
  const wp=toWorld(e.clientX,e.clientY);
  addNode('add', wp.x-110, wp.y-30, false);
});

// context menu
viewportEl.addEventListener('contextmenu',e=>{
  e.preventDefault();
  openCtx(e.clientX,e.clientY, toWorld(e.clientX,e.clientY));
});
function openCtx(cx,cy, worldPos){
  const menu=$('#ctxMenu');
  menu.innerHTML='';
  const cats=CAT_ORDER;
  menu.innerHTML+=`<div style="font:700 10px JetBrains Mono;letter-spacing:.1em;color:var(--muted);padding:6px 8px">ADD NODE AT CURSOR</div>`;
  Object.entries(DEF).forEach(([k,def])=>{
    const b=document.createElement('button');
    b.innerHTML=`<span style="display:flex;gap:8px;align-items:center"><i style="width:22px;height:22px;border-radius:6px;background:${def.color};display:grid;place-items:center;font:800 9px JetBrains Mono;color:#fff">${def.icon}</i>${def.title}</span><span>${def.cat}</span>`;
    b.addEventListener('click',()=>{ addNode(k, worldPos.x-110, worldPos.y-22,false); closeCtx(); });
    menu.appendChild(b);
  });
  menu.innerHTML+=`<hr/><button id="ctxFit">◎ Fit view</button><button id="ctxClear">Clear graph</button>`;
  menu.style.left=cx+'px'; menu.style.top=cy+'px';
  menu.classList.add('open');
  setTimeout(()=>{
    const addFit=document.getElementById('ctxFit'); if(addFit) addFit.addEventListener('click',()=>{fitView(); closeCtx();});
    const addClear=document.getElementById('ctxClear'); if(addClear) addClear.addEventListener('click',()=>{clearGraph(); closeCtx();});
  },0);
}
function closeCtx(){ $('#ctxMenu').classList.remove('open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('#ctxMenu')) closeCtx(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeCtx();
  if((e.key==='Delete' || e.key==='Backspace') && selectedId && !e.target.matches('input,textarea')){
    e.preventDefault(); removeNode(selectedId);
  }
  if(e.key==='a' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); }
  if(e.key==='d' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); if(selectedId) duplicateNode(selectedId); }
});

/* ========== Toolbar ========== */
$('#zIn').addEventListener('click',()=>{
  viewport.scale=clamp(viewport.scale*1.15,0.35,1.8);
  // keep center
  const r=viewportEl.getBoundingClientRect(); const cx=r.width/2, cy=r.height/2;
  const wx=(cx - viewport.x)/ (viewport.scale/1.15), wy=(cy - viewport.y)/(viewport.scale/1.15);
  viewport.x= cx - wx*viewport.scale; viewport.y= cy - wy*viewport.scale;
  applyView(); renderWires();
});
$('#zOut').addEventListener('click',()=>{
  viewport.scale=clamp(viewport.scale/1.15,0.35,1.8);
  applyView(); renderWires();
});
$('#zReset').addEventListener('click',fitView);
$('#btnFit').addEventListener('click',fitView);
function fitView(){
  if(!nodes.length){ viewport={x:0,y:0,scale:1}; applyView(); renderWires(); return; }
  const minX=Math.min(...nodes.map(n=>n.x)), minY=Math.min(...nodes.map(n=>n.y));
  const maxX=Math.max(...nodes.map(n=>n.x+220)), maxY=Math.max(...nodes.map(n=>n.y+160));
  const pad=40;
  const vr=viewportEl.getBoundingClientRect();
  const spanX=maxX-minX+pad*2, spanY=maxY-minY+pad*2;
  const s=Math.min(vr.width/spanX, vr.height/spanY, 1.2);
  viewport.scale=clamp(s,0.35,1.2);
  viewport.x= (vr.width - spanX*viewport.scale)/2 - minX*viewport.scale + pad*viewport.scale;
  viewport.y= (vr.height - spanY*viewport.scale)/2 - minY*viewport.scale + pad*viewport.scale;
  applyView(); renderWires();
}
$('#btnAuto').addEventListener('click',autoLayout);
$('#btnClear').addEventListener('click',clearGraph);
function clearGraph(){
  if(nodes.length && !confirm('Clear graph?')) return;
  nodes=[]; edges=[]; selectedId=null; renderNodes(); renderWires(); renderInspector(); toast('Cleared');
}
$('#btnAddDemo').addEventListener('click',()=>{
  // cycle random type
  const keys=Object.keys(DEF); const k=keys[Math.floor(Math.random()*keys.length)];
  addNode(k,0,0,true);
});
$('#btnPlay').addEventListener('click',()=>{
  playing=!playing;
  $('#btnPlay').textContent= playing ? '▶ Running' : '⏸ Paused';
  $('#btnPlay').style.color= playing ? '#00E5A0' : 'var(--muted)';
  renderNodes(); renderWires();
});
$('#btnShot').addEventListener('click',()=>{
  // simple capture: serialize canvas? For now toast + download JSON
  doExport();
});
$('#btnExport').addEventListener('click',doExport);
function doExport(){
  const data={nodes, edges, viewport, version:1};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='node-forge-graph.json'; a.click();
  URL.revokeObjectURL(url); toast('Exported JSON');
}
$('#btnImport').addEventListener('click',()=> $('#fileIn').click());
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(data.nodes && data.edges){ nodes=data.nodes; edges=data.edges; nextId=Math.max(0,...nodes.map(n=> parseInt(n.id.slice(1))||0))+1; nextEdge=Math.max(0,...edges.map(ed=> parseInt(ed.id.slice(1))||0))+1; viewport=data.viewport||viewport; applyView(); renderNodes(); renderWires(); renderInspector(); toast('Imported'); }
      else toast('Invalid file');
    }catch{ toast('Import failed'); }
  }; r.readAsText(f); e.target.value='';
});

/* search */
$('#search').addEventListener('input',renderPalette);
$('#btnCollapseLeft').addEventListener('click',()=>{
  document.querySelector('.panel.left').style.display = document.querySelector('.panel.left').style.display==='none' ? 'flex' : 'none';
});

/* ========== Loop ========== */
let last=performance.now(), frames=0, lastFps=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=(now-last)/1000; last=now;
  if(playing) t+= dt;
  // throttle renderWires/nodes for anim nodes every frame
  if(playing){
    renderNodes(); renderWires();
  }
  frames++;
  if(now - lastFps > 600){
    const fps=Math.round(frames*1000/(now-lastFps));
    $('#fpsPill').textContent=fps+' FPS';
    frames=0; lastFps=now;
  }
  // grid parallax
  gridEl.style.backgroundPosition=`${viewport.x}px ${viewport.y}px, ${viewport.x}px ${viewport.y}px, 0 0, 0 0, 0 0`;
}
renderPalette();
loadShowcase();
applyView();
requestAnimationFrame(frame);
window.addEventListener('resize',()=>{applyView(); renderWires();});
</script>
