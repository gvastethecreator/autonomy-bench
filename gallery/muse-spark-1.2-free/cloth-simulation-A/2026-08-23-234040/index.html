<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELA — Cloth Simulation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0B0B12;
    --panel:rgba(18,18,28,0.82);
    --border:rgba(255,255,255,0.08);
    --accent:#FF4D6A;
    --accent2:#7C5CFF;
    --text:#F2F0EC;
    --muted:#9A96A8;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Inter,Arial,sans-serif;overflow:hidden}
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(900px 600px at 18% 8%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(800px 500px at 88% 92%, rgba(255,77,106,0.14), transparent 60%),
      radial-gradient(1200px 800px at 50% -10%, rgba(255,255,255,0.04), transparent 70%),
      linear-gradient(180deg, #0B0B12 0%, #0F0F1A 100%);
    pointer-events:none;z-index:0;
  }
  /* header */
  .header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(16px);
    background:linear-gradient(180deg, rgba(11,11,18,0.92), rgba(11,11,18,0.45));
  }
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:grid;place-items:center;
    font-weight:700;font-size:14px;letter-spacing:-0.02em;
    box-shadow:0 8px 24px rgba(255,77,106,0.3);
  }
  .brand h1{font-size:17px;letter-spacing:-0.03em;font-weight:600;line-height:1}
  .brand h1 span{font-weight:300;color:var(--muted);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;margin-left:8px}
  .brand p{font-size:11px;color:var(--muted);letter-spacing:0.04em;margin-top:2px}
  .header-right{display:flex;align-items:center;gap:10px}
  .badge{
    font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
    padding:7px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,0.03)
  }
  .badge b{color:#7CFF8B}
  .btn-ghost{
    font-family:system-ui,sans-serif;font-size:13px;font-weight:500;
    padding:8px 14px;border-radius:999px;border:1px solid var(--border);
    background:rgba(255,255,255,0.06);color:var(--text);cursor:pointer;transition:.2s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.14)}
  /* canvas area */
  .stage{
    position:fixed;inset:0;top:64px;display:grid;place-items:center;z-index:1;padding:18px 18px 148px 18px;
  }
  #canvas{
    width:min(1120px, 96vw);
    height:min(640px, 62vh);
    max-height:70vh;
    background:
      radial-gradient(600px 400px at 50% 0%, rgba(255,255,255,0.06), transparent 70%),
      linear-gradient(180deg, #141422 0%, #0F1118 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    box-shadow:
      0 32px 64px rgba(0,0,0,0.55),
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 0 0 1px rgba(255,255,255,0.02) inset;
    cursor:grab;
    display:block;
  }
  #canvas:active{cursor:grabbing}
  /* bottom control bar */
  .controls{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;
    width:min(1120px, calc(100vw - 24px));
    background:var(--panel);
    backdrop-filter:blur(20px) saturate(1.2);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    box-shadow:0 24px 48px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.06) inset;
    padding:14px 16px 12px;
    display:grid;gap:12px;
  }
  .controls-top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .controls-top h3{
    font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .controls-top h3 i{width:6px;height:6px;border-radius:50%;background:#7CFF8B;box-shadow:0 0 10px #7CFF8B;display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    font-family:system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:-0.01em;
    padding:9px 14px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:.18s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn-primary{background:var(--text);color:#0B0B12;border-color:var(--text)}
  .btn-primary:hover{background:#fff;transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,255,255,0.15)}
  .btn-dark{background:rgba(255,255,255,0.07);color:var(--text);border-color:rgba(255,255,255,0.10)}
  .btn-dark:hover{background:rgba(255,255,255,0.12)}
  .btn-accent{background:linear-gradient(135deg, var(--accent), var(--accent2));color:white;border-color:transparent;box-shadow:0 8px 20px rgba(124,92,255,0.35)}
  .btn-accent:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .sliders{
    display:grid;grid-template-columns:repeat(5, 1fr);gap:12px;
  }
  @media (max-width:860px){.sliders{grid-template-columns:repeat(2,1fr)}.stage{padding-bottom:220px}#canvas{height:52vh}}
  @media (max-width:560px){.sliders{grid-template-columns:1fr}.header{padding:12px 14px}.brand h1 span{display:none}}
  .field{
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 11px;
  }
  .field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .field-head label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .field-head output{font-family:ui-monospace,monospace;font-size:11px;color:var(--text);background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:6px;min-width:38px;text-align:center}
  input[type="range"]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;background:rgba(255,255,255,0.12);border-radius:999px;outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);border:2px solid #0B0B12;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer;transition:.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:2px solid #0B0B12;cursor:pointer}
  .toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toggle{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);padding:7px 10px;border-radius:999px;cursor:pointer;user-select:none;transition:.15s;
  }
  .toggle input{display:none}
  .toggle i{width:28px;height:18px;background:rgba(255,255,255,0.14);border-radius:999px;position:relative;transition:.2s;display:inline-block}
  .toggle i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;background:white;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,0.25)}
  .toggle:has(input:checked){color:var(--text);border-color:rgba(124,92,255,0.3);background:rgba(124,92,255,0.12)}
  .toggle:has(input:checked) i{background:linear-gradient(135deg, var(--accent), var(--accent2))}
  .toggle:has(input:checked) i::after{transform:translateX(10px)}
  .hint{
    font-size:11px;color:var(--muted);line-height:1.4;display:flex;gap:6px;align-items:center;
  }
  .hint kbd{
    font-family:ui-monospace,monospace;font-size:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.10);border-bottom-color:rgba(255,255,255,0.18);
    padding:2px 5px;border-radius:5px;color:var(--text);
  }
  /* curtain rod visual */
  .rod-hint{
    position:absolute;top:calc(50% - 156px);left:50%;transform:translateX(-50%);
    width:min(1120px, 96vw);height:8px;pointer-events:none;z-index:2;display:flex;justify-content:center;
  }
  @media (max-width:900px){.rod-hint{top:calc(50% - 120px)}}
  /* tooltip */
  .tip{
    position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:5;
    font-size:12px;color:rgba(242,240,236,0.9);background:rgba(18,18,28,0.78);border:1px solid rgba(255,255,255,0.08);
    padding:8px 12px;border-radius:999px;backdrop-filter:blur(12px);
    display:flex;gap:8px;align-items:center;opacity:1;transition:.4s;
  }
  .tip.hidden{opacity:0;transform:translateX(-50%) translateY(-6px);pointer-events:none}
</style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>TELA <span>Cloth Lab — Verlet Physics</span></h1>
        <p>32 × 22 · structural + shear + bend · sphere collision</p>
      </div>
    </div>
    <div class="header-right">
      <span class="badge"><b>●</b> LIVE &nbsp; <span id="fps">60</span> FPS</span>
      <button class="btn-ghost" id="btnPinMode" title="Toggle pin mode">📌 Pins: Top</button>
    </div>
  </header>

  <div class="tip" id="tip">✋ Arrastra la tela · <b>Shift + arrastra</b> para rasgar · Doble click suelta pines</div>

  <div class="stage">
    <canvas id="canvas" width="1120" height="640" aria-label="Cloth simulation canvas"></canvas>
  </div>

  <section class="controls" aria-label="Controls">
    <div class="controls-top">
      <h3><i></i> Physics Controls — showcase-first</h3>
      <div class="actions">
        <button class="btn btn-dark" id="btnReset">↺ Reiniciar</button>
        <button class="btn btn-dark" id="btnWind">💨 Ráfaga</button>
        <button class="btn btn-accent" id="btnDrop">⬢ Soltar esquina</button>
        <button class="btn btn-primary" id="btnPause">⏸ Pausa</button>
      </div>
    </div>

    <div class="sliders">
      <div class="field">
        <div class="field-head"><label>Gravedad</label><output id="outGravity">0.45</output></div>
        <input type="range" id="gravity" min="0" max="1.2" step="0.02" value="0.45">
      </div>
      <div class="field">
        <div class="field-head"><label>Viento</label><output id="outWind">0.35</output></div>
        <input type="range" id="wind" min="0" max="1.5" step="0.02" value="0.35">
      </div>
      <div class="field">
        <div class="field-head"><label>Rigidez</label><output id="outStiff">1.00</output></div>
        <input type="range" id="stiff" min="0.2" max="1" step="0.02" value="1">
      </div>
      <div class="field">
        <div class="field-head"><label>Fricción</label><output id="outDamp">0.97</output></div>
        <input type="range" id="damp" min="0.90" max="0.999" step="0.001" value="0.97">
      </div>
      <div class="field">
        <div class="field-head"><label>Esfera</label><output id="outSphere">ON</output></div>
        <input type="range" id="sphereSize" min="0" max="140" step="1" value="78">
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="chkShear" checked><i></i> Shear</label>
        <label class="toggle"><input type="checkbox" id="chkBend" checked><i></i> Bend</label>
        <label class="toggle"><input type="checkbox" id="chkTear"><i></i> Rasgar (tear)</label>
        <label class="toggle"><input type="checkbox" id="chkWire"><i></i> Wireframe</label>
        <label class="toggle"><input type="checkbox" id="chkShadows" checked><i></i> Sombras</label>
      </div>
      <div class="hint">
        <kbd>Click</kbd> arrastra &nbsp; <kbd>Shift</kbd> + drag corta &nbsp; <kbd>Espacio</kbd> pausa
      </div>
    </div>
  </section>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const fpsEl = document.getElementById('fps');
  const tip = document.getElementById('tip');

  // Controls
  const gravityInput = document.getElementById('gravity');
  const windInput = document.getElementById('wind');
  const stiffInput = document.getElementById('stiff');
  const dampInput = document.getElementById('damp');
  const sphereInput = document.getElementById('sphereSize');
  const outGravity = document.getElementById('outGravity');
  const outWind = document.getElementById('outWind');
  const outStiff = document.getElementById('outStiff');
  const outDamp = document.getElementById('outDamp');
  const outSphere = document.getElementById('outSphere');
  const chkShear = document.getElementById('chkShear');
  const chkBend = document.getElementById('chkBend');
  const chkTear = document.getElementById('chkTear');
  const chkWire = document.getElementById('chkWire');
  const chkShadows = document.getElementById('chkShadows');

  // Responsive canvas sizing with DPR
  let W, H, dpr;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // recenter cloth on resize (keep simulation running, just offset)
    clothOffsetX = (W - (cols-1)*spacing)/2;
    clothOffsetY = 48;
    // update sphere position
    sphere.x = W*0.52;
    sphere.y = H*0.58;
  }

  // Cloth params
  const cols = 32;
  const rows = 22;
  const spacing = 18;
  let clothOffsetX = 0;
  let clothOffsetY = 48;

  let gravity = parseFloat(gravityInput.value);
  let windStrength = parseFloat(windInput.value);
  let stiffness = parseFloat(stiffInput.value);
  let damping = parseFloat(dampInput.value);
  let sphereRadius = parseFloat(sphereInput.value);

  gravityInput.addEventListener('input', e=>{ gravity=parseFloat(e.target.value); outGravity.textContent=gravity.toFixed(2); });
  windInput.addEventListener('input', e=>{ windStrength=parseFloat(e.target.value); outWind.textContent=windStrength.toFixed(2); });
  stiffInput.addEventListener('input', e=>{ stiffness=parseFloat(e.target.value); outStiff.textContent=stiffness.toFixed(2); });
  dampInput.addEventListener('input', e=>{ damping=parseFloat(e.target.value); outDamp.textContent=damping.toFixed(3); });
  sphereInput.addEventListener('input', e=>{ sphereRadius=parseFloat(e.target.value); outSphere.textContent = sphereRadius<8 ? 'OFF' : Math.round(sphereRadius)+'px'; });

  // Sphere obstacle
  const sphere = { x: 560, y: 380, r: 78, vx:0 };

  // Points and constraints
  let points = [];
  let constraints = [];
  let pinMode = 0; // 0 top edge, 1 corners, 2 top + random, 3 free
  const pinModes = ['Top','Esquinas','Diana','Libre'];

  class Point {
    constructor(x,y,pinned){
      this.x=x; this.y=y;
      this.oldx=x; this.oldy=y;
      this.pinned=pinned;
      this.pinX=x; this.pinY=y;
      this.mass=1;
    }
  }

  function makeCloth(){
    points = [];
    constraints = [];
    clothOffsetX = (W - (cols-1)*spacing)/2;
    clothOffsetY = 48;
    // slight fan: add tiny jitter so not perfectly grid locked at start
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        let px = clothOffsetX + x*spacing;
        let py = clothOffsetY + y*spacing;
        // add micro wave to start alive
        py += Math.sin(x*0.32)*1.2 + Math.cos(y*0.5)*0.8;
        let pinned = false;
        if(pinMode===0) pinned = (y===0);
        else if(pinMode===1) pinned = (y===0 && (x===0 || x===cols-1));
        else if(pinMode===2) pinned = (y===0 && x%4===0) || (y===0 && x===cols-1) || (y===0 && x===0);
        // libre: none
        points.push(new Point(px, py, pinned));
      }
    }
    function idx(x,y){ return y*cols+x; }

    // structural
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        if(x<cols-1) addConstraint(idx(x,y), idx(x+1,y), spacing);
        if(y<rows-1) addConstraint(idx(x,y), idx(x,y+1), spacing);
      }
    }
    // shear
    for(let y=0;y<rows-1;y++){
      for(let x=0;x<cols-1;x++){
        addConstraint(idx(x,y), idx(x+1,y+1), Math.sqrt(2)*spacing, 'shear');
        addConstraint(idx(x+1,y), idx(x,y+1), Math.sqrt(2)*spacing, 'shear');
      }
    }
    // bend (distance 2)
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        if(x<cols-2) addConstraint(idx(x,y), idx(x+2,y), spacing*2, 'bend');
        if(y<rows-2) addConstraint(idx(x,y), idx(x,y+2), spacing*2, 'bend');
      }
    }
  }

  function addConstraint(a,b,dist,type='structural'){
    constraints.push({a,b, dist, type, broken:false});
  }

  // Physics
  let time = 0;
  let paused = false;
  let windGust = 0;
  let gustDecay = 0;

  function updatePhysics(dt){
    if(paused) return;
    time += dt*60; // normalized

    // wind gust decay
    if(gustDecay>0){ windGust *= 0.985; gustDecay-=dt; if(gustDecay<=0) windGust=0; }

    // auto wind variation
    const baseWind = windStrength * (0.7 + 0.6*Math.sin(time*0.012) + 0.35*Math.sin(time*0.031 + 1.7));
    const windTurbulence = Math.sin(time*0.07)*0.15 + Math.cos(time*0.043)*0.12;

    for(let i=0;i<points.length;i++){
      const p = points[i];
      if(p.pinned) continue;
      // verlet
      let vx = (p.x - p.oldx) * damping;
      let vy = (p.y - p.oldy) * damping;

      // limit velocity
      const vmax = 12;
      if(vx>vmax) vx=vmax; if(vx<-vmax) vx=-vmax;
      if(vy>vmax) vy=vmax; if(vy<-vmax) vy=-vmax;

      p.oldx = p.x;
      p.oldy = p.y;

      // gravity
      p.y += gravity * 1.2;
      // keep gravity scaled

      p.x += vx;
      p.y += vy;

      // wind: more effect on upper/middle, slight per-point noise
      const windFactor = 0.6 + 0.7 * Math.sin((p.y*0.012) + time*0.02) + (Math.random()-0.5)*0.08;
      // expose area factor: points higher up catch more wind? cloth flutters
      const heightFactor = 0.5 + 0.5 * (1 - (p.y - clothOffsetY)/(rows*spacing));
      const w = (baseWind + windGust + windTurbulence) * windFactor * 0.55;
      // wind pushes x, also slight y lift
      p.x += w * (0.9 + heightFactor*0.35);
      p.y += Math.sin(time*0.015 + p.x*0.01)* windStrength * 0.08;

      // sphere collision
      if(sphereRadius>8){
        const dx = p.x - sphere.x;
        const dy = p.y - sphere.y;
        const dist = Math.hypot(dx,dy);
        const minDist = sphereRadius + 2;
        if(dist < minDist && dist>0.001){
          const nx = dx/dist, ny = dy/dist;
          const push = (minDist - dist) * 1.05;
          p.x += nx*push;
          p.y += ny*push;
          // friction along sphere
          const vx2 = p.x - p.oldx;
          const vy2 = p.y - p.oldy;
          // tangent damping
          const dot = vx2*nx + vy2*ny;
          // remove inward component a bit
          p.oldx += nx*dot*0.35;
          p.oldy += ny*dot*0.35;
        }
      }

      // bounds: keep inside canvas with restitution
      if(p.x<6){ p.x=6; p.oldx = p.x + vx*0.3; }
      if(p.x>W-6){ p.x=W-6; p.oldx = p.x + vx*0.3; }
      // floor
      if(p.y>H-8){ p.y=H-8; p.oldx = p.x + vx*0.7; p.oldy = p.y + vy*-0.25; }
      if(p.y<8){ p.y=8; }
    }

    // satisfy constraints - iterations for stiffness
    // adaptive iterations: more if stiff high
    let iters = stiffness>0.85 ? 16 : stiffness>0.5 ? 12 : 8;
    // allow shear/bend toggles to skip those constraints
    for(let iter=0; iter<iters; iter++){
      const iterStiff = stiffness * (iter < iters-2 ? 1 : 0.85);
      for(let c=0;c<constraints.length;c++){
        const con = constraints[c];
        if(con.broken) continue;
        if(con.type==='shear' && !chkShear.checked) continue;
        if(con.type==='bend' && !chkBend.checked) continue;
        const pa = points[con.a];
        const pb = points[con.b];
        let dx = pb.x - pa.x;
        let dy = pb.y - pa.y;
        let dist = Math.hypot(dx,dy);
        if(dist===0) continue;
        // tear
        if(chkTear.checked && dist > con.dist*2.2){
          // chance to break structural first
          if(con.type==='structural' || Math.random()<0.35){
            con.broken = true;
            continue;
          }
        }
        let diff = (con.dist - dist)/dist;
        // bend weaker
        let k = iterStiff;
        if(con.type==='bend') k *= 0.38;
        if(con.type==='shear') k *= 0.92;
        let offX = dx * diff * 0.5 * k;
        let offY = dy * diff * 0.5 * k;

        if(!pa.pinned){
          pa.x -= offX;
          pa.y -= offY;
        }
        if(!pb.pinned){
          pb.x += offX;
          pb.y += offY;
        }
      }
      // pin correction
      for(let i=0;i<points.length;i++){
        const p=points[i];
        if(p.pinned){ p.x = p.pinX; p.y = p.pinY; p.oldx=p.pinX; p.oldy=p.pinY; }
      }
    }
  }

  // Rendering
  function render(){
    // clear
    ctx.clearRect(0,0,W,H);

    // subtle grid dots background
    ctx.save();
    ctx.globalAlpha=0.04;
    for(let y=20;y<H;y+=28){
      for(let x=20;x<W;x+=28){
        ctx.beginPath(); ctx.arc(x,y,0.9,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
      }
    }
    ctx.restore();

    // curtain rod
    const rodY = clothOffsetY - 14;
    const rodX0 = clothOffsetX - 14;
    const rodX1 = clothOffsetX + (cols-1)*spacing + 14;
    // rod shadow
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.roundRect(rodX0, rodY+3, rodX1-rodX0, 10, 5);
    ctx.fill();
    // rod
    const rg = ctx.createLinearGradient(0,rodY,0,rodY+10);
    rg.addColorStop(0,'#2A2A3A'); rg.addColorStop(0.5,'#4A4A62'); rg.addColorStop(1,'#1E1E2E');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.roundRect(rodX0, rodY, rodX1-rodX0, 10, 5); ctx.fill();
    // highlights
    ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(rodX0+6, rodY+2); ctx.lineTo(rodX1-6, rodY+2); ctx.stroke();
    // pins
    for(let x=0;x<cols;x++){
      const idx = x;
      const p = points[idx];
      if(!p || !p.pinned) continue;
      const px = p.x;
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(px+1, rodY+9, 4.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFD166';
      ctx.shadowColor='rgba(255,209,102,0.6)'; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(px, rodY+7, 3.6,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(px-0.9, rodY+5.6, 1.1,0,Math.PI*2); ctx.fill();
      // string
      ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px, rodY+9); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    ctx.restore();

    // sphere
    if(sphereRadius>8){
      ctx.save();
      // shadow on ground
      ctx.globalAlpha=0.18;
      ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.ellipse(sphere.x, H-8, sphereRadius*0.9, 14, 0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      // sphere body with gradient
      const sg = ctx.createRadialGradient(sphere.x - sphereRadius*0.3, sphere.y - sphereRadius*0.4, sphereRadius*0.2, sphere.x, sphere.y, sphereRadius);
      sg.addColorStop(0,'#8B7CFF'); sg.addColorStop(0.35,'#5A4BD1'); sg.addColorStop(0.72,'#2A2250'); sg.addColorStop(1,'#0E0D1A');
      ctx.fillStyle=sg;
      ctx.beginPath(); ctx.arc(sphere.x, sphere.y, sphereRadius, 0, Math.PI*2); ctx.fill();
      // inner highlight
      ctx.globalAlpha=0.18; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(sphere.x - sphereRadius*0.28, sphere.y - sphereRadius*0.32, sphereRadius*0.42, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.10; ctx.beginPath(); ctx.arc(sphere.x - sphereRadius*0.15, sphere.y - sphereRadius*0.18, sphereRadius*0.28, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      // rim
      ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(sphere.x, sphere.y, sphereRadius, 0, Math.PI*2); ctx.stroke();
      // orbit line hint
      ctx.strokeStyle='rgba(124,92,255,0.14)'; ctx.setLineDash([4,6]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(sphere.x, sphere.y, sphereRadius+14, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }

    // cloth - draw quads with fabric shading
    // first draw drop shadows of cloth (optional)
    if(chkShadows.checked){
      ctx.save();
      ctx.globalAlpha=0.14;
      ctx.fillStyle='#000';
      for(let y=0;y<rows-1;y++){
        for(let x=0;x<cols-1;x++){
          const i = y*cols+x;
          const p1=points[i], p2=points[i+1], p3=points[i+cols+1], p4=points[i+cols];
          if(!p1||!p2||!p3||!p4) continue;
          ctx.beginPath();
          ctx.moveTo(p1.x+4, p1.y+5);
          ctx.lineTo(p2.x+4, p2.y+5);
          ctx.lineTo(p3.x+4, p3.y+5);
          ctx.lineTo(p4.x+4, p4.y+5);
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.restore();
    }

    // fabric quads
    for(let y=0;y<rows-1;y++){
      for(let x=0;x<cols-1;x++){
        const i = y*cols+x;
        const p1=points[i], p2=points[i+1], p3=points[i+cols+1], p4=points[i+cols];
        if(!p1||!p2||!p3||!p4) continue;
        // check if any constraint broken around this quad - skip hole visual (tear)
        // instead just don't draw if structural broken heavily (gap large)
        const dx1 = p2.x-p1.x, dy1=p2.y-p1.y;
        const dx2 = p4.x-p1.x, dy2=p4.y-p1.y;
        const stretch = Math.hypot(dx1,dy1)/spacing;
        const stretchY = Math.hypot(dx2,dy2)/spacing;
        const avgStretch = (stretch+stretchY)/2;

        // shading based on angle to light (top-left light) and stretch
        // compute pseudo-normal via cross of edges
        // light direction approx (-0.3, -0.9)
        // use dot of normal-ish approximated by tilt
        const tilt = (p1.x + p2.x + p3.x + p4.x)/4 - (W/2);
        const depth = (p1.y + p2.y + p3.y + p4.y)/4;
        // base hue: fabric color
        // create subtle weave color variation
        const weave = ((x+y)%2===0) ? 0 : 1;
        // shade
        let shade = 0.55 + 0.35*Math.sin((x*0.4 + y*0.28 + depth*0.005)) + tilt*0.00035;
        // stretch makes fabric lighter (thin)
        shade += (avgStretch-1)*0.22;
        shade = Math.max(0, Math.min(1, shade));

        // color palette: warm off-white fabric with peach/pink shadow
        // map shade to color
        // shade high -> highlight, low -> shadow
        let r,g,b;
        if(weave===0){
          // base #F5EDE2 lighter
          r = 244 + shade*10 - (1-shade)*28;
          g = 235 + shade*12 - (1-shade)*22;
          b = 220 + shade*16 - (1-shade)*18;
        } else {
          r = 238 + shade*12 - (1-shade)*24;
          g = 228 + shade*14 - (1-shade)*20;
          b = 212 + shade*18 - (1-shade)*16;
        }
        // add subtle pink in shadows
        if(shade<0.45){ r+=6; b+=4; }
        // wind ripple highlight
        const ripple = Math.sin(time*0.02 + x*0.6 + y*0.35)*0.04;
        r += ripple*22; g += ripple*18; b += ripple*12;

        r=Math.round(Math.max(0,Math.min(255,r)));
        g=Math.round(Math.max(0,Math.min(255,g)));
        b=Math.round(Math.max(0,Math.min(255,b)));

        // if far stretched, make slightly translucent hole look
        if(chkTear.checked && avgStretch>1.95) continue;

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();

        // inner shade line for weave depth
        if(shade<0.48){
          ctx.strokeStyle='rgba(89, 68, 92, 0.10)';
          ctx.lineWidth=0.7;
          ctx.stroke();
        } else if(shade>0.72){
          ctx.strokeStyle='rgba(255,255,255,0.24)';
          ctx.lineWidth=0.6;
          ctx.stroke();
        }

        // wireframe overlay
        if(chkWire.checked){
          ctx.strokeStyle='rgba(28,18,28,0.10)';
          ctx.lineWidth=0.7;
          ctx.stroke();
        }
      }
    }

    // draw constraints as subtle threads when wireframe
    if(chkWire.checked){
      ctx.save();
      ctx.strokeStyle='rgba(28,18,28,0.18)';
      ctx.lineWidth=0.6;
      for(let c of constraints){
        if(c.broken) continue;
        if(c.type==='bend' && !chkBend.checked) continue;
        if(c.type==='shear' && !chkShear.checked) continue;
        // only draw structural and shear for clarity, skip bend to avoid clutter if many
        if(c.type==='bend') continue;
        const a=points[c.a], b=points[c.b];
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      ctx.restore();
    }

    // pins highlight (dragging)
    if(dragPoint){
      ctx.save();
      ctx.fillStyle='rgba(255,77,106,0.95)';
      ctx.shadowColor='rgba(255,77,106,0.6)'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(dragPoint.x, dragPoint.y, 6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='white'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(dragPoint.x, dragPoint.y, 6,0,Math.PI*2); ctx.stroke();
      // line to cursor
      ctx.strokeStyle='rgba(255,77,106,0.45)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(dragPoint.x, dragPoint.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      ctx.restore();
    }

    // dragged influence radius
    if(isDragging && dragPoint){
      ctx.save();
      ctx.strokeStyle='rgba(124,92,255,0.28)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, dragRadius,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // Mouse interaction
  let mouse = {x:0,y:0, down:false, shift:false};
  let dragPoint = null;
  let isDragging = false;
  let dragRadius = 42;

  function canvasPos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx, y:cy};
  }

  function findClosest(x,y, radius=44){
    let best=null, bestDist=radius;
    for(let p of points){
      const d = Math.hypot(p.x - x, p.y - y);
      if(d < bestDist){ bestDist=d; best=p; }
    }
    return best;
  }

  canvas.addEventListener('pointerdown', e=>{
    canvas.setPointerCapture(e.pointerId);
    mouse.down=true; mouse.shift=e.shiftKey;
    const pos = canvasPos(e);
    mouse.x=pos.x; mouse.y=pos.y;
    const p = findClosest(pos.x,pos.y, 48);
    if(p){
      dragPoint=p;
      isDragging=true;
      // if shift+drag tear mode, immediately break nearby constraints
      if(e.shiftKey || chkTear.checked && e.altKey){
        // will be handled in move
      } else {
        // freeze old position to avoid snap
        p.oldx = p.x; p.oldy = p.y;
      }
      // hide tip
      tip.classList.add('hidden');
    }
    // also allow dragging sphere
    const sd = Math.hypot(pos.x - sphere.x, pos.y - sphere.y);
    if(sd < sphereRadius+14 && !p){
      // drag sphere
      dragPoint=null;
      sphere.dragging=true;
      sphere.dragOffX = sphere.x - pos.x;
      sphere.dragOffY = sphere.y - pos.y;
    }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e=>{
    const pos = canvasPos(e);
    mouse.x=pos.x; mouse.y=pos.y; mouse.shift=e.shiftKey;
    if(sphere.dragging){
      sphere.x = pos.x + sphere.dragOffX;
      sphere.y = pos.y + sphere.dragOffY;
      sphere.x = Math.max(sphereRadius+10, Math.min(W - sphereRadius-10, sphere.x));
      sphere.y = Math.max(clothOffsetY + 80, Math.min(H - 40, sphere.y));
      return;
    }
    if(!isDragging || !dragPoint) return;
    if(e.shiftKey){
      // tear: break constraints near cursor
      for(let c of constraints){
        if(c.broken) continue;
        const a=points[c.a], b=points[c.b];
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        if(Math.hypot(mx - pos.x, my - pos.y) < 22){
          // break with probability based on distance
          c.broken=true;
        }
      }
      // also directly move point to tear visually
      dragPoint.x = pos.x;
      dragPoint.y = pos.y;
    } else {
      // normal drag: move point, but also influence neighbors in radius for natural pull
      const dx = pos.x - dragPoint.x;
      const dy = pos.y - dragPoint.y;
      dragPoint.x = pos.x;
      dragPoint.y = pos.y;
      dragPoint.oldx = dragPoint.x - dx*0.18;
      dragPoint.oldy = dragPoint.y - dy*0.18;
      // soft influence neighbors
      for(let p of points){
        if(p===dragPoint) continue;
        if(p.pinned) continue;
        const d = Math.hypot(p.x - pos.x, p.y - pos.y);
        if(d < dragRadius){
          const inf = (1 - d/dragRadius) * 0.42;
          p.x += dx * inf;
          p.y += dy * inf;
        }
      }
    }
  });
  function endDrag(e){
    mouse.down=false;
    isDragging=false;
    if(sphere.dragging) sphere.dragging=false;
    // keep dragPoint for a moment for visual then clear
    if(dragPoint && !dragPoint.pinned){
      // give velocity
      // already set oldx/oldy
    }
    setTimeout(()=>{ if(!mouse.down) dragPoint=null; }, 120);
    try{ canvas.releasePointerCapture(e.pointerId);}catch{}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', ()=>{ if(sphere.dragging) sphere.dragging=false; });

  canvas.addEventListener('dblclick', e=>{
    const pos = canvasPos(e);
    // toggle pin of closest point
    const p = findClosest(pos.x,pos.y, 30);
    if(p){
      p.pinned = !p.pinned;
      if(p.pinned){ p.pinX=p.x; p.pinY=p.y; }
      // flash
      p.flash = 1;
    }
  });

  // buttons
  document.getElementById('btnReset').addEventListener('click', ()=>{ makeCloth(); windGust=0; });
  document.getElementById('btnWind').addEventListener('click', ()=>{
    windGust = 5 + Math.random()*6;
    gustDecay = 2.2;
    // also puff sphere a bit - moved decrementally before
    sphere.vx = (Math.random()-0.5)*2;
  });
  document.getElementById('btnDrop').addEventListener('click', ()=>{
    // release rightmost top pins progressively
    let count=0;
    for(let x=cols-1;x>=0 && count<5;x--){
      const p = points[x];
      if(p && p.pinned){ p.pinned=false; count++; }
    }
    if(count===0){
      // if already dropped, re-pin randomly
      for(let x=0;x<cols;x+=3){ const p=points[x]; if(p){ p.pinned=true; p.pinX=p.x; p.pinY=p.y; }}
    }
  });
  const btnPause = document.getElementById('btnPause');
  btnPause.addEventListener('click', ()=>{
    paused=!paused;
    btnPause.textContent = paused ? '▶ Reanudar' : '⏸ Pausa';
    btnPause.style.background = paused ? 'linear-gradient(135deg, #FF4D6A, #7C5CFF)' : '';
    btnPause.style.color = paused ? 'white' : '';
  });
  document.getElementById('btnPinMode').addEventListener('click', (e)=>{
    pinMode = (pinMode+1)%4;
    e.target.textContent = '📌 Pins: '+pinModes[pinMode];
    makeCloth();
  });

  // keyboard
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){ e.preventDefault(); btnPause.click(); }
    if(e.key==='r' || e.key==='R'){ makeCloth(); }
    if(e.key==='g' || e.key==='G'){ document.getElementById('btnWind').click(); }
  });

  // fps
  let lastFpsTime=performance.now(), frames=0, fps=60;
  function updateFps(){
    frames++;
    const now=performance.now();
    if(now - lastFpsTime > 500){
      fps = Math.round(frames*1000/(now-lastFpsTime));
      fpsEl.textContent = fps;
      lastFpsTime=now; frames=0;
    }
  }

  // loop
  let last=performance.now();
  function loop(){
    const now=performance.now();
    const dt = Math.min(0.032, (now-last)/1000);
    last=now;
    // substeps for stability
    const steps = 2;
    for(let s=0;s<steps;s++) updatePhysics(dt/steps);
    render();
    updateFps();
    requestAnimationFrame(loop);
  }

  // init
  resize();
  makeCloth();
  // kick initial wind for alive start
  windGust=1.2; gustDecay=1.1;
  // gentle sphere float
  let sphereDir=1;
  function sphereFloat(){
    if(!sphere.dragging && sphereRadius>8){
      sphere.x += Math.sin(time*0.008)*0.12 + sphere.vx*0.02;
      sphere.vx *= 0.98;
      sphere.y += Math.cos(time*0.006)*0.16 * sphereDir;
      if(sphere.y < clothOffsetY+90) sphereDir=1;
      if(sphere.y > H-90) sphereDir=-1;
    }
    requestAnimationFrame(sphereFloat);
  }
  window.addEventListener('resize', ()=>{ resize(); });
  // hide tip after 6s
  setTimeout(()=> tip.classList.add('hidden'), 6200);
  // start
  loop();
  sphereFloat();

  // expose for debug
  window._cloth = {points, constraints, sphere};

})();
</script>
</body>
</html>
