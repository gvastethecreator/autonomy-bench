<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RollerCoaster — First Person</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e19;font-family: ui-sans-system, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif;color:#e8eefc}
  canvas{display:block}
  #hud{
    position:absolute;inset:0;pointer-events:none;
  }
  #topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;
    background: linear-gradient(to bottom, rgba(7,12,25,0.82), rgba(7,12,25,0));
    pointer-events:auto;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:38px;height:38px;border-radius:10px;
    background: radial-gradient(120% 120% at 20% 20%, #7af0ff 0%, #2d7bff 45%, #0b1a4a 100%);
    display:grid;place-items:center;
    box-shadow: 0 6px 18px rgba(45,123,255,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
    font-weight:900;letter-spacing:-0.02em;color:white;font-size:16px;
  }
  .title{line-height:1}
  .title h1{font-size:15px;letter-spacing:0.04em;text-transform:uppercase;font-weight:800}
  .title p{font-size:11px;opacity:0.72;letter-spacing:0.06em;text-transform:uppercase;margin-top:2px}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{
    appearance:none;border:1px solid rgba(255,255,255,0.14);
    background: rgba(18,26,53,0.75);backdrop-filter: blur(12px);
    color:#e8eefc;padding:8px 12px;border-radius:999px;
    font-size:12px;font-weight:600;letter-spacing:0.02em;
    cursor:pointer;transition: all 0.18s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .pill:hover{background: rgba(28,42,88,0.85);border-color: rgba(122,240,255,0.35);transform: translateY(-1px)}
  .pill:active{transform: translateY(0px)}
  .pill.active{background:#2d7bff;border-color:#5aa0ff;color:white;box-shadow:0 4px 16px rgba(45,123,255,0.5)}
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80;animation: pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(0.85)}}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:999px;background:rgba(255,255,255,0.18);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#7af0ff;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);cursor:pointer;
  }
  #bottom{
    position:absolute;left:14px;right:14px;bottom:14px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none;
  }
  .card{
    pointer-events:auto;
    background: rgba(12,18,40,0.78);backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.1);border-radius:16px;
    padding:12px 14px;min-width:0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .metrics{display:flex;gap:14px;align-items:center}
  .metric{min-width:0}
  .metric label{display:block;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.6;font-weight:700}
  .metric strong{display:block;font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-top:1px;font-variant-numeric: tabular-nums}
  .metric span{font-size:11px;opacity:0.7}
  .bar{width:140px;height:6px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background: linear-gradient(90deg,#7af0ff,#2d7bff);width:40%;border-radius:999px;transition: width 0.1s linear}
  .hint{max-width:340px}
  .hint h3{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.9}
  .hint p{font-size:12px;line-height:1.5;opacity:0.72;margin-top:4px}
  .kbd{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.06em;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.14);margin-right:4px}
  @media(max-width:760px){
    #topbar{padding:10px 12px}
    .title h1{font-size:13px}
    .controls{gap:6px}
    .pill{padding:7px 10px;font-size:11px}
    input[type=range]{width:84px}
    #bottom{flex-direction:column;align-items:stretch}
    .metrics{justify-content:space-between}
    .hint{max-width:none}
  }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <div id="topbar">
    <div class="brand">
      <div class="logo">∿</div>
      <div class="title">
        <h1>First-Person Coaster</h1>
        <p>Continuous playback · Show-case</p>
      </div>
    </div>
    <div class="controls">
      <button id="btnPause" class="pill"><span class="dot" id="liveDot"></span><span id="pauseLabel">En marcha</span></button>
      <button id="btnView" class="pill">👁 <span id="viewLabel">POV</span></button>
      <label class="pill" style="gap:10px;">⚡ <span style="opacity:0.8">Velocidad</span> <input id="speed" type="range" min="0.4" max="2.2" step="0.1" value="1.0"/></label>
      <button id="btnAudio" class="pill">🔊 <span id="audioLabel">Viento</span></button>
    </div>
  </div>
  <div id="bottom">
    <div class="card metrics">
      <div class="metric">
        <label>Velocidad</label>
        <strong id="speedVal">72 <span style="font-size:11px;opacity:0.6">km/h</span></strong>
        <div class="bar"><i id="speedBar"></i></div>
      </div>
      <div class="metric">
        <label>Altitud</label>
        <strong id="altVal">24 m</strong>
        <span id="gVal">1.0 G</span>
      </div>
      <div class="metric">
        <label>Recorrido</label>
        <strong id="progVal">0%</strong>
        <span id="lapVal">Vuelta continua</span>
      </div>
    </div>
    <div class="card hint">
      <h3>Experiencia sin fricción</h3>
      <p><span class="kbd">P</span> Pausa &nbsp; <span class="kbd">V</span> Cambiar cámara &nbsp; <span class="kbd">R</span> Reiniciar. Sin clic obligatorio: la montaña rusa arranca sola y gira en bucle infinito.</p>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const canvas = document.createElement('canvas');
document.body.prepend(canvas);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8fc6ff, 160, 820);
scene.background = new THREE.Color(0x87b9ff);

// Renderer
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

// Camera
const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, 0.1, 2000);

// Lights
scene.add(new THREE.HemisphereLight(0xdfefff, 0x2b3322, 1.15));
const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(120, 180, 80);
dir.castShadow = true;
dir.shadow.mapSize.set(2048,2048);
dir.shadow.camera.near = 1; dir.shadow.camera.far = 600;
dir.shadow.camera.left = -260; dir.shadow.camera.right = 260; dir.shadow.camera.top = 260; dir.shadow.camera.bottom = -260;
dir.shadow.bias = -0.0005;
scene.add(dir);
const fill = new THREE.DirectionalLight(0x7af0ff, 0.55);
fill.position.set(-60, 40, -120);
scene.add(fill);

// Ground
const groundGeo = new THREE.PlaneGeometry(2400,2400, 64,64);
const groundMat = new THREE.MeshStandardMaterial({color:0x182a18, roughness:0.95, metalness:0.02});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
// subtle height variation via vertex colors not needed, add second larger plane for distant haze
const farGround = new THREE.Mesh(new THREE.PlaneGeometry(6000,6000), new THREE.MeshStandardMaterial({color:0x1e3520, roughness:1}));
farGround.rotation.x = -Math.PI/2;
farGround.position.y = -0.2;
farGround.receiveShadow = false;
scene.add(farGround);

// Trees / props scattered
const treeGeo = new THREE.ConeGeometry(1.2, 4.5, 7);
const trunkGeo = new THREE.CylinderGeometry(0.18,0.24,2.2,6);
const treeMat = new THREE.MeshStandardMaterial({color:0x12351a, roughness:0.9});
const trunkMat = new THREE.MeshStandardMaterial({color:0x3a2a1a, roughness:0.9});
const trees = new THREE.Group();
for(let i=0;i<280;i++){
  const x = (Math.random()-0.5)*900;
  const z = (Math.random()-0.5)*900;
  // avoid track area roughly: keep distance from track centerline > 18
  // quick cheap: if near center corridor, skip some
  const distToCenter = Math.hypot(x*0.6, z*0.45);
  if(distToCenter < 90 && Math.random()<0.72) continue;
  const scale = 0.7 + Math.random()*1.7;
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.1;
  trunk.castShadow = true;
  const cone = new THREE.Mesh(treeGeo, treeMat);
  cone.position.y = 3.8;
  cone.castShadow = true;
  g.add(trunk); g.add(cone);
  g.position.set(x,0,z);
  g.scale.setScalar(scale);
  g.rotation.y = Math.random()*Math.PI;
  trees.add(g);
}
scene.add(trees);

// Simple mountains in distance (low poly)
const mtnGroup = new THREE.Group();
for(let i=0;i<6;i++){
  const mtn = new THREE.Mesh(new THREE.ConeGeometry(90+Math.random()*80, 110+Math.random()*80, 6), new THREE.MeshStandardMaterial({color:0x2a4a2f, roughness:1}));
  const angle = (i/6)*Math.PI*2;
  const r = 720 + Math.random()*260;
  mtn.position.set(Math.cos(angle)*r, 30, Math.sin(angle)*r);
  mtnGroup.add(mtn);
}
scene.add(mtnGroup);

// Sky dome gradient
const skyGeo = new THREE.SphereGeometry(1800, 32, 22);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms:{
    top:{value:new THREE.Color(0x3a7bff)},
    bottom:{value:new THREE.Color(0xcfe6ff)},
    offset:{value: 120},
    exponent:{value:0.85}
  },
  vertexShader: `varying vec3 vWorld; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; uniform float offset; uniform float exponent; varying vec3 vWorld; void main(){ float h = normalize(vWorld).y; float t = pow(max(0.0, (h+0.25)), exponent); vec3 col = mix(bottom, top, t); // horizon haze
  float fog = smoothstep(0.0, 0.18, h); col = mix(vec3(0.78,0.86,0.98), col, fog); gl_FragColor = vec4(col,1.0); }`
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// --- Track definition ---
// Hand-tuned closed loop with lift hill, drop, vertical loop, helix, airtime hills.
const pts = [
  new THREE.Vector3(0, 11, 78),      // 0 station
  new THREE.Vector3(0, 12.5, 42),    // approach
  new THREE.Vector3(0, 18,  8),      // gentle climb start
  new THREE.Vector3(0, 46, -38),     // LIFT PEAK
  new THREE.Vector3(2, 14, -86),     // steep drop valley
  new THREE.Vector3(0, 9, -118),     // bottom
  new THREE.Vector3(0, 15, -142),    // loop entry
  new THREE.Vector3(0, 30, -154),    // loop left side
  new THREE.Vector3(0, 44, -166),    // loop top  (≈28m diameter loop)
  new THREE.Vector3(0, 30, -178),    // loop right side
  new THREE.Vector3(0, 14, -188),    // loop exit
  new THREE.Vector3(-8, 11, -205),   // pull out
  new THREE.Vector3(-38, 13, -212),  // left sweeper
  new THREE.Vector3(-72, 16, -180),  // turn
  new THREE.Vector3(-88, 22, -132),  // hill before corkscrew
  new THREE.Vector3(-82, 34, -92),   // airtime crest
  new THREE.Vector3(-62, 14, -52),   // dive
  new THREE.Vector3(-32, 10, -10),   // valley
  new THREE.Vector3(18, 12, 12),     // S-turn start
  new THREE.Vector3(58, 18, 38),     // banked high
  new THREE.Vector3(78, 24, 72),     // helix top outer
  new THREE.Vector3(62, 20, 102),    // helix mid
  new THREE.Vector3(22, 13, 118),    // helix exit
  new THREE.Vector3(-6, 11, 108),    // return
  new THREE.Vector3(0, 11, 78),      // close (duplicate for smoothness but closed curve will connect)
];
const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.38);
curve.arcLengthDivisions = 900;

// Tube radius for central spine
const tubularSegments = 560;
const tubeRadius = 0.75;
const tubeGeo = new THREE.TubeGeometry(curve, tubularSegments, tubeRadius, 10, true);
const tubeMat = new THREE.MeshStandardMaterial({color:0x222a36, roughness:0.55, metalness:0.35});
const trackMesh = new THREE.Mesh(tubeGeo, tubeMat);
trackMesh.castShadow = true;
trackMesh.receiveShadow = false;
scene.add(trackMesh);

// Two rails (visually distinct) — create slightly offset tubes by using parallel curves approximation via small offset normals
// Instead of true parallel offset, we create two thin tubes along same curve but visually offset via shader? Simpler: create two lines via Tube with smaller radius and offset using vertex displacement in local normal.
// For performance and visual fidelity, we instead add two ribbons using TubeGeometry duplicated and shifted via position not enough -> we create rail meshes as tubes along offset points sampled and re-curve.
// Build offset curves
function offsetCurve(baseCurve, offsetVecFn, segments=420){
  const points = [];
  for(let i=0;i<=segments;i++){
    const t = i/segments;
    const p = baseCurve.getPoint(t);
    const tgt = baseCurve.getTangent(t);
    const up = new THREE.Vector3(0,1,0);
    let right = new THREE.Vector3().crossVectors(tgt, up).normalize();
    if(right.lengthSq()<0.25) right.set(1,0,0);
    const up2 = new THREE.Vector3().crossVectors(right, tgt).normalize();
    // Banking tilt will be derived later but for rails we use approximate horizontal right
    // Apply offset: left/right of centerline by ~1.1m, and slightly up 0.35
    const off = offsetVecFn(right, up2, tgt, t);
    points.push(p.clone().add(off));
  }
  return new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.28);
}
const railRadius = 0.26;
const leftCurve = offsetCurve(curve, (right, up2)=> right.clone().multiplyScalar(-1.05).add(up2.clone().multiplyScalar(0.18)) );
const rightCurve = offsetCurve(curve, (right, up2)=> right.clone().multiplyScalar(1.05).add(up2.clone().multiplyScalar(0.18)) );
const leftRail = new THREE.Mesh(new THREE.TubeGeometry(leftCurve, 520, railRadius, 8, true), new THREE.MeshStandardMaterial({color:0x7e8aa6, roughness:0.28, metalness:0.72}));
const rightRail = new THREE.Mesh(new THREE.TubeGeometry(rightCurve, 520, railRadius, 8, true), new THREE.MeshStandardMaterial({color:0x7e8aa6, roughness:0.28, metalness:0.72}));
leftRail.castShadow = true; rightRail.castShadow = true;
scene.add(leftRail, rightRail);

// Sleepers / ties
const sleeperCount = 300;
const sleeperGeo = new THREE.BoxGeometry(3.2, 0.14, 0.52);
const sleeperMat = new THREE.MeshStandardMaterial({color:0x3b2e1f, roughness:0.85});
const sleepers = new THREE.InstancedMesh(sleeperGeo, sleeperMat, sleeperCount);
sleepers.castShadow = true; sleepers.receiveShadow = true;
let dummy = new THREE.Object3D();
let dummyMat = new THREE.Matrix4();
for(let i=0;i<sleeperCount;i++){
  const t = i/sleeperCount;
  const p = curve.getPoint(t);
  const tgt = curve.getTangent(t);
  // compute local frame for sleeper (tied to track's horizontal plane mostly)
  const worldUp = new THREE.Vector3(0,1,0);
  let right = new THREE.Vector3().crossVectors(tgt, worldUp).normalize();
  if(right.lengthSq()<0.15) right.set(1,0,0);
  const realUp = new THREE.Vector3().crossVectors(right, tgt).normalize();
  // orientation matrix: basis X=right, Y=realUp, Z=tgt
  const m = new THREE.Matrix4().makeBasis(right, realUp, tgt);
  dummy.position.copy(p);
  dummy.quaternion.setFromRotationMatrix(m);
  // slight drop so sleeper sits just under rails
  dummy.position.addScaledVector(realUp, -0.38);
  dummy.updateMatrix();
  sleepers.setMatrixAt(i, dummy.matrix);
}
sleepers.instanceMatrix.needsUpdate = true;
scene.add(sleepers);

// Supports - pillars every ~12 ties, plus diagonal bracing
const supportMat = new THREE.MeshStandardMaterial({color:0x2e364a, roughness:0.65, metalness:0.25});
const supports = new THREE.Group();
for(let i=0;i<sleeperCount;i+=10){
  const t = i/sleeperCount;
  const p = curve.getPoint(t);
  const h = p.y;
  if(h < 3) continue;
  const cylH = h - 0.15;
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, cylH, 7), supportMat);
  col.position.set(p.x, cylH/2, p.z);
  col.castShadow = true; col.receiveShadow = true;
  supports.add(col);
  // cross beam at top
  const beam = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.28, 0.28), supportMat);
  const worldUp = new THREE.Vector3(0,1,0);
  const tgt = curve.getTangent(t);
  let right = new THREE.Vector3().crossVectors(tgt, worldUp).normalize();
  if(right.lengthSq()<0.1) right.set(1,0,0);
  beam.position.set(p.x, h-0.7, p.z);
  // align beam along right
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), right);
  beam.quaternion.copy(q);
  supports.add(beam);
  // diagonal struts for higher sections
  if(h > 18){
    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14, Math.hypot(3, h*0.35), 6), supportMat);
    strut.position.set(p.x + right.x*1.6, h*0.62, p.z + right.z*1.6);
    strut.lookAt(p.x, h-0.6, p.z);
    strut.rotateX(Math.PI/2);
    supports.add(strut);
    const strut2 = strut.clone();
    strut2.position.set(p.x - right.x*1.6, h*0.62, p.z - right.z*1.6);
    strut2.lookAt(p.x, h-0.6, p.z);
    strut2.rotateX(Math.PI/2);
    supports.add(strut2);
  }
}
scene.add(supports);

// Station platform
const platform = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, 18), new THREE.MeshStandardMaterial({color:0x2b3246, roughness:0.85}));
platform.position.set(0, 8.6, 78);
platform.receiveShadow = true;
platform.castShadow = true;
scene.add(platform);
const roof = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.3, 20), new THREE.MeshStandardMaterial({color:0x3a4a6a, roughness:0.6, metalness:0.15, transparent:true, opacity:0.92}));
roof.position.set(0, 12.4, 78);
scene.add(roof);
for(let z=-7; z<=7; z+=3.5){
  const colS = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,3.6,6), supportMat);
  colS.position.set(4.2,10.4,78+z);
  supports.add(colS);
  const colS2 = colS.clone(); colS2.position.x = -4.2;
  supports.add(colS2);
}

// Decorative flags/bunting at station
for(let i=0;i<6;i++){
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.7), new THREE.MeshBasicMaterial({color: i%2?0x7af0ff:0xff6b7a, side:THREE.DoubleSide}));
  flag.position.set(-4 + i*1.6, 11.2, 68);
  flag.rotation.y = Math.PI/7;
  flag.rotation.z = 0.12*Math.sin(i);
  scene.add(flag);
}

// ---- Ride camera logic ----
const clock = new THREE.Clock();
let t = 0.008; // start near station
let baseSpeed = 0.038; // t per second at 1x (~26s lap)
let speedMult = 1.0;
let paused = false;
let viewMode = 0; // 0 = first-person, 1 = chase, 2 = bird/overview
let transportedUp = new THREE.Vector3(0,1,0);
let prevTangent = curve.getTangent(0).clone();
let curUp = transportedUp.clone();
let desiredRoll = 0;
let curRoll = 0;
let audioEnabled = false;
let windGain, windNode, audioCtx;

// HUD refs
const speedVal = document.getElementById('speedVal');
const altVal = document.getElementById('altVal');
const gVal = document.getElementById('gVal');
const progVal = document.getElementById('progVal');
const speedBar = document.getElementById('speedBar');
const btnPause = document.getElementById('btnPause');
const pauseLabel = document.getElementById('pauseLabel');
const liveDot = document.getElementById('liveDot');
const btnView = document.getElementById('btnView');
const viewLabel = document.getElementById('viewLabel');
const speedSlider = document.getElementById('speed');
const btnAudio = document.getElementById('btnAudio');
const audioLabel = document.getElementById('audioLabel');

speedSlider.addEventListener('input', e=> speedMult = parseFloat(e.target.value));
btnPause.addEventListener('click', ()=> togglePause());
btnView.addEventListener('click', ()=> cycleView());
btnAudio.addEventListener('click', ()=> toggleAudio());
addEventListener('keydown', e=>{
  if(e.code==='Space' || e.key==='p' || e.key==='P') togglePause();
  if(e.key==='v' || e.key==='V') cycleView();
  if(e.key==='r' || e.key==='R') { t = 0.008; transportedUp.set(0,1,0); prevTangent.copy(curve.getTangent(t)); curRoll=0; desiredRoll=0; }
});
function togglePause(){
  paused=!paused;
  pauseLabel.textContent = paused ? 'Pausado' : 'En marcha';
  liveDot.style.background = paused ? '#ff5a3c' : '#4ade80';
  liveDot.style.boxShadow = paused ? '0 0 10px #ff5a3c' : '0 0 10px #4ade80';
}
function cycleView(){
  viewMode = (viewMode+1)%3;
  viewLabel.textContent = viewMode===0 ? 'POV' : viewMode===1 ? 'Chase' : 'Aéreo';
  btnView.classList.toggle('active', viewMode!==0);
}
function toggleAudio(){
  audioEnabled = !audioEnabled;
  audioLabel.textContent = audioEnabled ? 'Viento ON' : 'Viento';
  btnAudio.classList.toggle('active', audioEnabled);
  if(audioEnabled) ensureAudio(); 
  if(windGain) windGain.gain.value = audioEnabled ? 0.18 : 0.0;
}
function ensureAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // wind = filtered white noise
  const bufferSize = 4096;
  const white = audioCtx.createScriptProcessor(bufferSize,1,1);
  // use AudioWorklet fallback? scriptProcessor is deprecated but widely supported for simple wind; keep.
  white.onaudioprocess = e=>{
    const out = e.outputBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) out[i] = (Math.random()*2-1)*0.5;
  };
  const filter = audioCtx.createBiquadFilter();
  filter.type='bandpass'; filter.frequency.value= 950; filter.Q.value=0.7;
  windGain = audioCtx.createGain(); windGain.gain.value = 0.0;
  white.connect(filter); filter.connect(windGain); windGain.connect(audioCtx.destination);
  // smooth ramp in
  windGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime+0.6);
}

// For banking / transport helpers
function angleDiff(a,b){ let d=a-b; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return d; }

let lastPos = curve.getPoint(t);
let lastSpeedKmh = 0;

function updateCamera(dt){
  if(paused) return;
  // advance t by speed along curve; modulate speed slightly by slope (gravity)
  const curPosTmp = curve.getPoint(t);
  const curTgtTmp = curve.getTangent(t);
  // slope factor: downhill accelerates a bit
  const slope = -curTgtTmp.y; // positive when going down (y decreasing forward)
  const gravityBoost = 1 + slope*1.15; // range ~0.2 - 2.0
  const effectiveSpeed = baseSpeed * speedMult * Math.max(0.55, Math.min(1.65, gravityBoost));
  const dtClamped = Math.min(dt, 0.05);
  t = (t + effectiveSpeed * dtClamped) % 1;
  if(t<0) t+=1;

  const pos = curve.getPoint(t);
  const tgt = curve.getTangent(t).clone().normalize();
  const tgtAhead = curve.getPoint((t+0.012)%1);
  // parallel transport up
  if(prevTangent){
    const dot = THREE.MathUtils.clamp(prevTangent.dot(tgt), -1, 1);
    const ang = Math.acos(dot);
    if(ang > 0.0001){
      const axis = new THREE.Vector3().crossVectors(prevTangent, tgt).normalize();
      if(axis.lengthSq()>0.0001){
        const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
        curUp.applyQuaternion(q);
      }
    }
  }
  // re-orthogonalize curUp to be perpendicular to tgt
  curUp.sub( tgt.clone().multiplyScalar(curUp.dot(tgt)) ).normalize();
  // guard against drift
  if(curUp.lengthSq()<0.4) curUp.set(0,1,0);
  // banking due to horizontal curvature
  const t0 = (t - 0.006 + 1)%1;
  const t2 = (t + 0.006)%1;
  const tan0 = curve.getTangent(t0);
  const tan2 = curve.getTangent(t2);
  const h0 = Math.atan2(tan0.x, tan0.z);
  const h2 = Math.atan2(tan2.x, tan2.z);
  const dHeading = angleDiff(h2, h0);
  // Normalize by distance along curve approx dt=0.012 => curvature per unit
  const curvatureSig = dHeading / 0.012; // rad per t
  // desired roll: bank into turn (negative when turning right)
  desiredRoll = THREE.MathUtils.clamp(-curvatureSig * 0.085, -0.95, 0.95); // rad, ~ +/-54deg
  // add subtle extra roll for corkscrew sections? left as is; helix will naturally need strong roll -> value already high.
  // Smooth roll
  curRoll = THREE.MathUtils.lerp(curRoll, desiredRoll, 1 - Math.pow(0.001, dtClamped*60)); // exponential smooth
  // also add slight pitch-linked roll wobble for airtime hills? subtle
  // Apply roll around tgt axis to curUp
  const finalUp = curUp.clone();
  if(Math.abs(curRoll)>0.001){
    const qRoll = new THREE.Quaternion().setFromAxisAngle(tgt, curRoll);
    finalUp.applyQuaternion(qRoll);
  }
  // slight head tilt with G's?
  prevTangent.copy(tgt);

  // Camera positioning
  const eyeHeight = 1.55;
  const eyePos = pos.clone().addScaledVector(finalUp, eyeHeight);
  // forward target
  // look slightly toward actual curve ahead but keep banking
  const lookAheadPos = curve.getPoint((t + 0.018)%1).clone().addScaledVector(finalUp, eyeHeight*0.92);
  const chaseOffset = tgt.clone().multiplyScalar(-7).addScaledVector(finalUp, 3.2);
  let camPos, camTarget, camUp;
  if(viewMode===0){
    camPos = eyePos;
    camTarget = lookAheadPos;
    camUp = finalUp;
    // subtle vibration / rattling at high speed
    const rattle = Math.sin(performance.now()*0.038)*0.03 + Math.cos(performance.now()*0.071)*0.02;
    camPos.addScaledVector(finalUp, rattle*0.4);
    camPos.addScaledVector(new THREE.Vector3().crossVectors(tgt, finalUp).normalize(), rattle*0.22);
  }else if(viewMode===1){
    camPos = pos.clone().add(chaseOffset);
    camTarget = eyePos.clone().addScaledVector(tgt, 6);
    camUp = finalUp.clone().lerp(new THREE.Vector3(0,1,0), 0.35).normalize();
  }else{
    // bird overview: fixed high looking at coaster center, orbit slowly
    const birdT = performance.now()*0.00006;
    const birdR = 210;
    camPos = new THREE.Vector3(Math.cos(birdT)*birdR, 165, Math.sin(birdT)*birdR);
    camTarget = new THREE.Vector3(0,18, -38);
    camUp = new THREE.Vector3(0,1,0);
    // also keep updating metrics even in bird
  }
  camera.position.copy(camPos);
  camera.up.copy(camUp);
  camera.lookAt(camTarget);
  // dynamic FOV: narrow at high speed drops
  const speedKmh = 42 + effectiveSpeed*1850 + Math.abs(slope)*44; // fake but plausible 35-118
  lastSpeedKmh = THREE.MathUtils.lerp(lastSpeedKmh, speedKmh, 0.12);
  const targetFov = 74 + (lastSpeedKmh - 60)*0.18 + Math.abs(dHeading*140);
  camera.fov = THREE.MathUtils.lerp(camera.fov, THREE.MathUtils.clamp(targetFov, 68, 92), 0.06);
  camera.updateProjectionMatrix();

  // HUD metrics
  const alt = pos.y;
  // approximate G-force from curvature & vertical acceleration
  const vertCurve = (tan2.y - tan0.y)/0.012; // vertical curvature
  const lateralG = Math.abs(dHeading)*38 * (effectiveSpeed*22);
  const verticalG = 1 + vertCurve*0.55 + lateralG*0.45;
  const g = THREE.MathUtils.clamp(verticalG, 0.2, 4.2);
  // update DOM throttled per frame fine
  speedVal.innerHTML = Math.round(lastSpeedKmh) + ' <span style="font-size:11px;opacity:0.6">km/h</span>';
  altVal.textContent = Math.round(alt) + ' m';
  gVal.textContent = g.toFixed(1) + ' G';
  progVal.textContent = Math.round(t*100) + '%';
  speedBar.style.width = THREE.MathUtils.clamp(((lastSpeedKmh-30)/90)*100, 6, 100) + '%';
  // audio wind modulation
  if(audioEnabled && windGain && audioCtx){
    const wind = THREE.MathUtils.clamp((lastSpeedKmh-28)/80, 0,1);
    windGain.gain.linearRampToValueAtTime(0.04 + wind*0.26, audioCtx.currentTime + 0.12);
    if(filter) filter.frequency.linearRampToValueAtTime(620 + wind*1100 + g*90, audioCtx.currentTime + 0.12);
  }
  lastPos.copy(pos);
}

// Resize
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// Initial camera placement
{
  const p0 = curve.getPoint(t);
  camera.position.copy(p0).add(new THREE.Vector3(0,3,6));
  camera.lookAt(p0);
}

// Animate
let lastT = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastT)/1000;
  lastT = now;
  updateCamera(dt);
  renderer.render(scene, camera);
}
animate();

// auto audio resume on first interaction (if user enables via button we already handle; but also resume context on any click if audioEnabled)
addEventListener('pointerdown', ()=>{
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  // ensure autoplay starts even if not interacted — no-op
}, {once:false});

// Start wind silently after 1.2s to showcase motion without requiring click, but keep muted until user enables audio button -> actually keep audio off by default per autoplay policy.
// We won't auto-play wind to respect policy; button enables it.

// Page visibility pause? keep running for showcase.

// Ensure renderer canvas fills
renderer.domElement.style.width='100%';
renderer.domElement.style.height='100%';
renderer.domElement.style.display='block';
</script>
