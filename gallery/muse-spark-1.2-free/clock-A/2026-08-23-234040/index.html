<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock — Showcase</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c0e12;
    --card:#14171d;
    --ring:#232836;
    --tick:#2a3042;
    --tick-major:#3b435c;
    --num:#e8eaf0;
    --hour:#f0f2f8;
    --minute:#d6dbe8;
    --second:#ff3b4a;
    --center:#0c0e12;
    --digital:#eef1f8;
    --date:#8b92a8;
    --glow: 0 24px 64px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.06) inset;
  }
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 600px at 50% -10%, #1c2233 0%, transparent 60%),
      radial-gradient(1200px 800px at 80% 100%, #141a2b 0%, transparent 55%),
      var(--bg);
    color:var(--num);
    font-family:ui-sans-system, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:grid;
    place-items:center;
    min-height:100vh;
    padding:32px 16px;
    overflow:hidden;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    width:min(520px, 92vw);
  }
  .clock-wrap{
    position:relative;
    width:min(440px, 84vw);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }
  .clock{
    position:relative;
    width:100%;
    height:100%;
    background:
      radial-gradient(180% 180% at 30% 20%, #1e2536 0%, #13151c 52%, #0d0f14 100%);
    border-radius:50%;
    border:1px solid rgba(255,255,255,.08);
    box-shadow: var(--glow), 0 0 0 8px #0f1218, 0 0 0 9px rgba(255,255,255,.06);
    overflow:hidden;
  }
  .clock::before{
    content:"";
    position:absolute; inset:14px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.04);
    pointer-events:none;
  }
  .clock::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(600px 400px at 35% 22%, rgba(255,255,255,.06), transparent 48%);
    pointer-events:none;
  }
  .ticks{position:absolute; inset:0}
  .tick{
    position:absolute;
    left:50%; top:50%;
    width:1.5px; height:8px;
    background:var(--tick);
    transform-origin:50% 50%;
    border-radius:2px;
  }
  .tick.major{
    width:2px; height:16px;
    background:var(--tick-major);
    box-shadow:0 0 8px rgba(122,136,180,.12);
  }
  .numbers{position:absolute; inset:0; font-variant-numeric:tabular-nums}
  .num{
    position:absolute;
    left:50%; top:50%;
    width:36px; height:36px;
    margin:-18px 0 0 -18px;
    display:grid; place-items:center;
    font-size:15px; font-weight:600; letter-spacing:.02em;
    color:var(--num);
    opacity:.92;
    text-shadow:0 1px 0 rgba(0,0,0,.5);
  }
  .hands{position:absolute; inset:0}
  .hand{
    position:absolute;
    left:50%; bottom:50%;
    transform-origin:50% 100%;
    border-radius:999px;
    will-change:transform;
  }
  .hand.hour{
    width:9px; height:27%;
    margin-left:-4.5px;
    background:linear-gradient(180deg, #fff 0%, var(--hour) 100%);
    box-shadow:0 4px 16px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.7) inset;
    z-index:3;
  }
  .hand.minute{
    width:6px; height:36%;
    margin-left:-3px;
    background:linear-gradient(180deg, #f7f8ff 0%, var(--minute) 100%);
    box-shadow:0 4px 16px rgba(0,0,0,.4);
    z-index:4;
  }
  .hand.second{
    width:2px; height:38.5%;
    margin-left:-1px;
    background:var(--second);
    box-shadow:0 0 10px rgba(255,59,74,.55), 0 0 20px rgba(255,59,74,.25);
    z-index:5;
  }
  .hand.second::after{
    content:"";
    position:absolute; top:100%; left:50%;
    width:11px; height:11px;
    margin:-1px 0 0 -5.5px;
    background:var(--second);
    border:2.5px solid #fff;
    border-radius:50%;
    box-shadow:0 1px 8px rgba(255,59,74,.5);
  }
  .hand.second .counterweight{
    position:absolute;
    bottom:-22px; left:50%;
    width:2px; height:22px;
    margin-left:-1px;
    background:var(--second);
    border-radius:999px;
    opacity:.95;
  }
  .center-dot{
    position:absolute; left:50%; top:50%;
    width:18px; height:18px;
    margin:-9px 0 0 -9px;
    background:#0c0e12;
    border:2px solid #fff;
    border-radius:50%;
    z-index:6;
    box-shadow:0 2px 10px rgba(0,0,0,.5), 0 0 0 6px rgba(255,59,74,.10);
  }
  .center-dot::after{
    content:""; position:absolute; inset:4px;
    background:var(--second); border-radius:50%;
  }
  .digital{
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .time{
    font-size:clamp(36px, 8vw, 54px);
    font-weight:700;
    letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color:var(--digital);
    text-shadow:0 2px 24px rgba(120,140,200,.18);
    display:flex; align-items:baseline; gap:.08em;
  }
  .time .sep{opacity:.28; font-weight:300; animation:blink 1.6s steps(1) infinite}
  .time .ampm{
    font-size:.32em; font-weight:700; letter-spacing:.14em;
    opacity:.55; margin-left:.5em; transform:translateY(-.45em);
  }
  @keyframes blink{0%, 54%{opacity:.28} 55%, 100%{opacity:0}}
  .date{
    font-size:13px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--date);
  }
  .sub{
    font-size:12px; letter-spacing:.08em; color:#5f6986;
    opacity:.9; margin-top:2px;
  }
  .brand{
    font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:#4b5470; margin-top:6px;
  }
  @media (max-width:480px){
    .stage{gap:20px}
    .num{font-size:13px; width:28px; height:28px; margin:-14px 0 0 -14px}
    .num:nth-child(3), .num:nth-child(6), .num:nth-child(9), .num:nth-child(12){font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){
    .time .sep{animation:none; opacity:.28}
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Clock showcase">
    <div class="clock-wrap">
      <div class="clock" id="clock" role="img" aria-label="Analog clock">
        <div class="ticks" id="ticks"></div>
        <div class="numbers" id="numbers"></div>
        <div class="hands">
          <div class="hand hour" id="hourHand" aria-hidden="true"></div>
          <div class="hand minute" id="minuteHand" aria-hidden="true"></div>
          <div class="hand second" id="secondHand" aria-hidden="true"><span class="counterweight"></span></div>
        </div>
        <div class="center-dot" aria-hidden="true"></div>
      </div>
    </div>
    <div class="digital" aria-live="off">
      <div class="time" id="digitalTime">
        <span id="h">00</span><span class="sep">:</span><span id="m">00</span><span class="sep">:</span><span id="s">00</span><span class="ampm" id="ampm">AM</span>
      </div>
      <div class="date" id="date">—</div>
      <div class="sub" id="tz">Local time • sweeping seconds</div>
      <div class="brand">Single File • No Dependencies</div>
    </div>
  </main>
<script>
(function(){
  const ticksEl = document.getElementById('ticks');
  const numbersEl = document.getElementById('numbers');
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const hEl = document.getElementById('h');
  const mEl = document.getElementById('m');
  const sEl = document.getElementById('s');
  const ampmEl = document.getElementById('ampm');
  const dateEl = document.getElementById('date');
  const tzEl = document.getElementById('tz');

  // build ticks (60)
  const frag = document.createDocumentFragment();
  for(let i=0;i<60;i++){
    const t=document.createElement('span');
    t.className='tick'+(i%5===0?' major':'');
    const angle=i*6;
    // radius: distance from center to tick outer edge ~ 47%
    // Use translate trick: rotate then translateY outward
    t.style.transform=`translate(-50%,-50%) rotate(${angle}deg) translateY(-192px)`;
    // responsive tweak via JS on resize
    frag.appendChild(t);
  }
  ticksEl.appendChild(frag);

  // build numbers 1-12
  for(let n=1;n<=12;n++){
    const d=document.createElement('span');
    d.className='num';
    d.textContent=n;
    const angle=n*30;
    d.style.transform=`translate(-50%,-50%) rotate(${angle}deg) translateY(-164px) rotate(${-angle}deg)`;
    numbersEl.appendChild(d);
  }

  function responsiveTicks(){
    const clock=document.getElementById('clock');
    const r=clock.clientWidth/2;
    const tickR=r - 24;
    const numR=r - 52;
    // update existing ticks/numbers quickly
    const ticks=ticksEl.children;
    for(let i=0;i<ticks.length;i++){
      const angle=i*6;
      ticks[i].style.transform=`translate(-50%,-50%) rotate(${angle}deg) translateY(${-tickR}px)`;
    }
    const nums=numbersEl.children;
    for(let i=0;i<nums.length;i++){
      const n=i+1;
      const angle=n*30;
      nums[i].style.transform=`translate(-50%,-50%) rotate(${angle}deg) translateY(${-numR}px) rotate(${-angle}deg)`;
    }
  }
  responsiveTicks();
  window.addEventListener('resize', responsiveTicks);

  // timezone label
  try{
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
    const off = -new Date().getTimezoneOffset()/60;
    const sign = off>=0?'+':'−';
    const abs=Math.abs(off);
    const oh=Math.floor(abs);
    const om=Math.round((abs-oh)*60);
    const offStr = `UTC${sign}${String(oh).padStart(2,'0')}${om?':'+String(om).padStart(2,'0'):''}`;
    tzEl.textContent = tz + ' • ' + offStr + ' • sweeping seconds';
  }catch(e){}

  const dateFmt = new Intl.DateTimeFormat('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  function pad(n){ return String(n).padStart(2,'0'); }

  let rafId;
  function tick(){
    const now=new Date();
    const ms=now.getMilliseconds();
    const s=now.getSeconds() + ms/1000;
    const m=now.getMinutes() + s/60;
    const h=now.getHours() % 12 + m/60;

    const sDeg=s*6;
    const mDeg=m*6;
    const hDeg=h*30;

    // use translateZ(0) hint not needed but transform only
    hourHand.style.transform=`translateX(-50%) rotate(${hDeg}deg)`;
    minuteHand.style.transform=`translateX(-50%) rotate(${mDeg}deg)`;
    secondHand.style.transform=`translateX(-50%) rotate(${sDeg}deg)`;

    // digital
    let hours=now.getHours();
    const ampm=hours>=12?'PM':'AM';
    hours=hours%12; if(hours===0) hours=12;
    hEl.textContent=pad(hours);
    mEl.textContent=pad(now.getMinutes());
    sEl.textContent=pad(now.getSeconds());
    ampmEl.textContent=ampm;

    // date (throttle to seconds)
    if(Math.floor(ms/1000)!==Math.floor((ms-16)/1000) || !dateEl.dataset.init){
      dateEl.textContent=dateFmt.format(now);
      dateEl.dataset.init='1';
    }

    // accessibility live label for analog clock
    if(s%1<0.02){
      const clockEl=document.getElementById('clock');
      clockEl.setAttribute('aria-label', dateFmt.format(now)+' '+pad(hours)+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' '+ampm);
    }

    rafId=requestAnimationFrame(tick);
  }

  // respect reduced motion: if user prefers reduced motion, fall back to 1s tick without ms smoothing
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced){
    function tickReduced(){
      const now=new Date();
      const s=now.getSeconds();
      const m=now.getMinutes() + s/60;
      const h=now.getHours()%12 + m/60;
      hourHand.style.transform=`translateX(-50%) rotate(${h*30}deg)`;
      minuteHand.style.transform=`translateX(-50%) rotate(${m*6}deg)`;
      secondHand.style.transform=`translateX(-50%) rotate(${s*6}deg)`;
      let hours=now.getHours();
      const ampm=hours>=12?'PM':'AM';
      hours=hours%12; if(hours===0) hours=12;
      hEl.textContent=pad(hours);
      mEl.textContent=pad(now.getMinutes());
      sEl.textContent=pad(now.getSeconds());
      ampmEl.textContent=ampm;
      dateEl.textContent=dateFmt.format(now);
    }
    tickReduced();
    setInterval(tickReduced, 1000);
  } else {
    tick();
  }

  // pause when hidden to save power, resume on visible
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ cancelAnimationFrame(rafId); }
    else if(!prefersReduced){ tick(); }
  });
})();
</script>
</body>
</html>
