<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyro Spectacular — Fireworks Display</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060f;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#fff}
  #sky{position:fixed;inset:0;display:block;cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,5,.55) 100%)}
  header{position:fixed;top:22px;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
  header h1{font-size:clamp(20px,3.4vw,34px);font-weight:800;letter-spacing:.35em;text-indent:.35em;
    background:linear-gradient(180deg,#fff 20%,#ffd98a 55%,#ff7a3c 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 28px rgba(255,150,60,.25);opacity:.95}
  header p{margin-top:6px;font-size:12px;letter-spacing:.32em;text-indent:.32em;color:rgba(255,255,255,.55);text-transform:uppercase}
  #hint{position:fixed;top:96px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.18em;color:rgba(255,255,255,.45);pointer-events:none;z-index:5;transition:opacity 1s}
  #panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:10;
    background:rgba(10,14,28,.62);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 10px 8px 16px;backdrop-filter:blur(12px)}
  #panel .dot{width:8px;height:8px;border-radius:50%;background:#ff5d5d;box-shadow:0 0 10px #ff5d5d;animation:blink 1.6s infinite}
  #panel .dot.on{background:#5dff8f;box-shadow:0 0 10px #5dff8f}
  @keyframes blink{50%{opacity:.4}}
  button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .2s}
  button:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
  button.primary{background:linear-gradient(135deg,#ff9a3c,#ff3d68);border:none;box-shadow:0 4px 22px rgba(255,80,80,.45)}
  button.primary:hover{filter:brightness(1.12)}
  #counter{font-size:11px;letter-spacing:.15em;color:rgba(255,255,255,.55);padding:0 8px;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
  @media(max-width:600px){#panel{bottom:12px;flex-wrap:wrap;justify-content:center;border-radius:20px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="vignette"></div>
<header><h1>PYRO SPECTACULAR</h1><p>Harbour Lights &middot; Finale at Midnight</p></header>
<div id="hint">CLICK / TAP ANYWHERE TO LAUNCH &nbsp;&middot;&nbsp; SIT BACK FOR THE AUTO SHOW</div>
<div id="panel">
  <div class="dot on" id="liveDot"></div>
  <button id="autoBtn">Auto: On</button>
  <button id="volleyBtn">Volley</button>
  <button id="finaleBtn" class="primary">&#9733; Finale</button>
  <div id="counter">0 bursts</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,groundY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H*0.86;buildCity();}
addEventListener('resize',resize);

// --- stars ---
let stars=[];
function buildStars(){stars=[];const n=Math.floor(W*H/6500);for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*groundY*0.75,r:Math.random()*1.3+0.2,p:Math.random()*Math.PI*2,s:0.5+Math.random()*2});}
// --- city silhouette ---
let buildings=[],winCache=null;
function buildCity(){buildings=[];let x=-10;while(x<W+20){const w=30+Math.random()*70,h=H*(0.06+Math.random()*0.10);buildings.push({x,w,h,windows:[],antenna:Math.random()<0.25});x+=w+Math.random()*14;}
  buildings.forEach(b=>{const cols=Math.floor(b.w/11),rows=Math.floor(b.h/14);for(let c=0;c<cols;c++)for(let r=0;r<rows;r++)if(Math.random()<0.42)b.windows.push({x:b.x+5+c*11,y:groundY-b.h+8+r*14,warm:Math.random()<0.75,on:Math.random()<0.8,tw:Math.random()*10});});
  winCache=null;}
function drawCity(){ctx.fillStyle='#05070e';ctx.fillRect(0,groundY,W,H-groundY);
  buildings.forEach(b=>{ctx.fillStyle='#0a0e1a';ctx.fillRect(b.x,groundY-b.h,b.w,b.h);
    if(b.antenna){ctx.strokeStyle='#0a0e1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x+b.w/2,groundY-b.h);ctx.lineTo(b.x+b.w/2,groundY-b.h-16);ctx.stroke();
      ctx.fillStyle=`rgba(255,70,70,${0.5+0.5*Math.sin(performance.now()/400)})`;ctx.beginPath();ctx.arc(b.x+b.w/2,groundY-b.h-17,2,0,7);ctx.fill();}
    b.windows.forEach(wd=>{if(!wd.on)return;ctx.fillStyle=wd.warm?'rgba(255,190,90,0.75)':'rgba(150,210,255,0.7)';ctx.fillRect(wd.x,wd.y,4,6);});});
  // water shimmer line
  const g=ctx.createLinearGradient(0,groundY,0,H);g.addColorStop(0,'rgba(80,120,220,0.10)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,groundY,W,H-groundY);}

// --- moon ---
const moon={x:0,y:0};function placeMoon(){moon.x=W*0.82;moon.y=H*0.16;}

// --- particles ---
const rockets=[],parts=[];let bursts=0;const counter=document.getElementById('counter');
const PALETTES=[[0,30,50],[190,210,230],[120,150,320],[45,20,340],[0,350,180],[270,300,60],[15,45,200]];
function pickPalette(){return PALETTES[(Math.random()*PALETTES.length)|0];}
function launch(tx,ty,opts={}){
  const x=tx??(W*0.1+Math.random()*W*0.8);
  const sx=x+(Math.random()-0.5)*30, sy=H+10;
  const ey=ty??(H*(0.15+Math.random()*0.4));
  rockets.push({x:sx,y:sy,px:sx,py:sy,tx:x,ty:ey,vx:(x-sx)*0.012,vy:-Math.sqrt(2*0.045*(sy-ey))*1.0,hue:Math.random()*360,trail:[],power:opts.power??1,type:opts.type??((Math.random()*6)|0),pal:opts.pal??pickPalette(),fuse:0});
}
function explode(r){
  bursts++;counter.textContent=bursts+' bursts';
  const n=Math.floor((90+r.power*70)*(r.type===2?0.5:1));
  const baseSpeed=1+r.power*1.4;
  const mk=(ang,spd,hue,extra={})=>{parts.push({x:r.x,y:r.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,hue,life:1,decay:0.004+Math.random()*0.008,grav:extra.grav??0.018,size:extra.size??2,twinkle:extra.twinkle??false,strobe:extra.strobe??false,flick:Math.random()*10,drag:extra.drag??0.985,trail:extra.trail??false});};
  const P=r.pal;
  if(r.type===0){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=baseSpeed*(0.3+Math.random()*0.9);mk(a,s,P[(Math.random()*P.length)|0],{trail:Math.random()<0.3});}}
  else if(r.type===1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=baseSpeed*(0.4+Math.random()*0.9);mk(a,s,(40+Math.random()*30)|0,{grav:0.035,size:2.2,trail:true,drag:0.975,twinkle:false});}}
  else if(r.type===2){const c=P[(Math.random()*P.length)|0];for(let i=0;i<70;i++){const a=i/70*Math.PI*2;mk(a,baseSpeed*1.7,c,{drag:0.99,decay:0.006,size:2.4});}for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2;mk(a,baseSpeed*0.5,(c+40)%360,{});}}
  else if(r.type===3){const c1=P[0],c2=P[1]??((c1+180)%360);for(let i=0;i<90;i++){const a=i/90*Math.PI*2;mk(a,baseSpeed*1.8,c1,{drag:0.988,decay:0.0055,size:2.2});}for(let i=0;i<60;i++){const a=i/60*Math.PI*2+0.05;mk(a,baseSpeed*1.0,c2,{drag:0.988,decay:0.007,size:2});}mk(0,0,55,{size:3});for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;mk(a,baseSpeed*0.4,55,{});}}
  else if(r.type===4){for(let i=0;i<n+40;i++){const a=Math.random()*Math.PI*2,s=baseSpeed*(0.3+Math.random());mk(a,s,P[(Math.random()*P.length)|0],{strobe:true,size:2.3,drag:0.982});}}
  else{const c=P[(Math.random()*P.length)|0];for(let i=0;i<8;i++){const a=i/8*Math.PI*2;for(let k=0;k<14;k++){const s=baseSpeed*(0.4+k/14*1.1);mk(a+(Math.random()-0.5)*0.12,s,(c+k*4)%360,{drag:0.986,decay:0.006,size:2.1});}}}
  // flash + shockwave ring
  parts.push({x:r.x,y:r.y,vx:0,vy:0,hue:50,life:0.5,decay:0.06,grav:0,size:3,flash:true,drag:1});
  rings.push({x:r.x,y:r.y,r:4,vr:3+r.power*2,life:1});
  shake=Math.min(shake+2+r.power*3,14);
}
const rings=[];let shake=0;

// --- show direction ---
let auto=true,finaleMode=false,finaleUntil=0,nextAuto=0;
function director(t){
  if(!auto&&t>finaleUntil)return;
  if(t<nextAuto)return;
  if(finaleMode||t<finaleUntil){ // barrage
    const k=2+((Math.random()*3)|0);
    for(let i=0;i<k;i++)launch(W*0.08+Math.random()*W*0.84,H*(0.12+Math.random()*0.42),{power:0.8+Math.random()*0.9});
    nextAuto=t+120+Math.random()*220;
  }else{
    const roll=Math.random();
    if(roll<0.12){ // volley of 3-5 synced
      const pal=pickPalette(),type=(Math.random()*6)|0,y=H*(0.18+Math.random()*0.25);
      for(let i=0;i<3+((Math.random()*3)|0);i++)setTimeout(()=>launch(W*0.15+Math.random()*W*0.7,y+Math.random()*40,{pal,type,power:1}),i*140);
      nextAuto=t+2600+Math.random()*1800;
    }else if(roll<0.2){ // double salute
      launch(W*0.3,H*0.25,{power:1.1});setTimeout(()=>launch(W*0.7,H*0.22,{power:1.1}),350);
      nextAuto=t+2400+Math.random()*1500;
    }else{launch();nextAuto=t+700+Math.random()*1600;}
  }
}

canvas.addEventListener('pointerdown',e=>{hideHint();const n=e.shiftKey?5:1;for(let i=0;i<n;i++)launch(e.clientX+(Math.random()-0.5)*20,e.clientY+(Math.random()-0.5)*20,{power:0.9+Math.random()*0.6});});
let hintHidden=false;function hideHint(){if(hintHidden)return;hintHidden=true;document.getElementById('hint').style.opacity=0;}

// buttons
const autoBtn=document.getElementById('autoBtn'),dot=document.getElementById('liveDot');
autoBtn.onclick=()=>{auto=!auto;autoBtn.textContent='Auto: '+(auto?'On':'Off');dot.classList.toggle('on',auto);};
document.getElementById('volleyBtn').onclick=()=>{hideHint();const pal=pickPalette(),type=(Math.random()*6)|0;for(let i=0;i<5;i++)setTimeout(()=>launch(W*0.12+i*W*0.16,H*(0.16+Math.random()*0.25),{pal,type,power:1}),i*160);};
document.getElementById('finaleBtn').onclick=()=>{hideHint();finaleMode=true;finaleUntil=performance.now()+9000;autoBtn.textContent='Auto: On';auto=true;dot.classList.add('on');
  setTimeout(()=>{finaleMode=false;},9000);};

// --- render loop ---
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  director(t);
  // fade trails
  ctx.globalCompositeOperation='source-over';
  const fade=finaleMode?0.16:0.2;
  ctx.fillStyle=`rgba(4,6,15,${fade})`;ctx.fillRect(0,0,W,H);
  // stars
  stars.forEach(s=>{const a=0.35+0.4*Math.sin(t/1000*s.s+s.p);ctx.fillStyle=`rgba(255,255,255,${Math.max(a,0.08)})`;ctx.fillRect(s.x,s.y,s.r,s.r);});
  // moon
  const mg=ctx.createRadialGradient(moon.x,moon.y,4,moon.x,moon.y,70);mg.addColorStop(0,'rgba(240,244,255,0.95)');mg.addColorStop(0.18,'rgba(220,230,255,0.9)');mg.addColorStop(0.3,'rgba(160,190,255,0.18)');mg.addColorStop(1,'rgba(160,190,255,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(moon.x,moon.y,70,0,7);ctx.fill();
  ctx.fillStyle='#eef2ff';ctx.beginPath();ctx.arc(moon.x,moon.y,16,0,7);ctx.fill();
  ctx.fillStyle='rgba(190,200,225,0.6)';ctx.beginPath();ctx.arc(moon.x-5,moon.y-3,3.4,0,7);ctx.fill();ctx.beginPath();ctx.arc(moon.x+4,moon.y+5,2.2,0,7);ctx.fill();

  ctx.save();
  if(shake>0.2){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.88;}
  ctx.globalCompositeOperation='lighter';
  // rockets
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.px=r.x;r.py=r.y;
    r.vy+=0.045;r.x+=r.vx;r.y+=r.vy;r.trail.push({x:r.x,y:r.y});if(r.trail.length>10)r.trail.shift();
    r.trail.forEach((p,k)=>{ctx.fillStyle=`hsla(${r.hue},100%,${50+k*3}%,${k/10})`;ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,7);ctx.fill();});
    ctx.fillStyle=`hsl(${r.hue},100%,75%)`;ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,7);ctx.fill();
    if(r.vy>=-0.6||r.y<=r.ty){rockets.splice(i,1);explode(r);}
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.flash){p.life-=p.decay;if(p.life<=0){parts.splice(i,1);continue;}
      const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,90*p.life+20);g2.addColorStop(0,`rgba(255,255,255,${0.8*p.life})`);g2.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(p.x,p.y,90*p.life+20,0,7);ctx.fill();continue;}
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;p.flick+=0.3;
    if(p.life<=0||p.y>groundY+4){ // splash on ground
      if(p.y>groundY+4&&Math.random()<0.02){ctx.fillStyle=`hsla(${p.hue},90%,60%,0.5)`;ctx.fillRect(p.x,groundY,2,2);}
      parts.splice(i,1);continue;}
    let alpha=Math.max(p.life,0);
    if(p.strobe&&Math.sin(p.flick*2)>0.2)alpha*=0.15;
    if(p.twinkle)alpha*=0.6+0.4*Math.sin(p.flick);
    ctx.fillStyle=`hsla(${p.hue},100%,${p.trail?70:62}%,${alpha})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(0.5+p.life*0.7),0,7);ctx.fill();
    if(p.trail){ctx.strokeStyle=`hsla(${p.hue},100%,65%,${alpha*0.4})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3);ctx.stroke();}
  }
  // rings
  for(let i=rings.length-1;i>=0;i--){const g=rings[i];g.r+=g.vr;g.vr*=0.96;g.life-=0.02;if(g.life<=0){rings.splice(i,1);continue;}
    ctx.strokeStyle=`rgba(255,255,255,${g.life*0.35})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.stroke();}
  ctx.restore();
  // city on top (not additive)
  ctx.globalCompositeOperation='source-over';
  drawCity();
  // reflections of bursts on water
  ctx.globalCompositeOperation='lighter';
  // (cheap: vertical streaks under bright particles near ground already handled); skip heavy pass
  ctx.globalCompositeOperation='source-over';
  // cap particles
  if(parts.length>2600)parts.splice(0,parts.length-2600);
}

// init
resize();buildStars();placeMoon();
// opening: staggered show-start volley
setTimeout(()=>launch(W*0.5,H*0.25,{power:1.2,type:3}),400);
setTimeout(()=>launch(W*0.3,H*0.3,{power:1}),1100);
setTimeout(()=>launch(W*0.7,H*0.28,{power:1}),1600);
setTimeout(hideHint,9000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
