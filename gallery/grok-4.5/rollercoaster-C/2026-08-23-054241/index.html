<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Twilight Ascent — First-Person Coaster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=DM+Sans:wght@400;500&display=swap');
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05040a; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #f2e9d8;
  }
  #title {
    position: absolute; top: 28px; left: 32px;
    opacity: 0; animation: fadeIn 2.4s ease 0.4s forwards;
  }
  #title h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 2.4vw, 28px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow: 0 0 24px rgba(255, 120, 60, 0.45);
  }
  #title p {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  #phase {
    position: absolute; bottom: 36px; left: 32px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    opacity: 0.7;
    transition: opacity 0.6s ease;
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(5,4,10,0.55) 100%);
    pointer-events: none;
  }
  #flash {
    position: absolute; inset: 0;
    background: #fff8e8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  #controls {
    position: absolute; bottom: 32px; right: 32px;
    display: flex; gap: 10px;
    pointer-events: auto;
  }
  button {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #f2e9d8;
    background: rgba(20, 16, 28, 0.65);
    border: 1px solid rgba(242, 233, 216, 0.22);
    padding: 10px 14px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover {
    background: rgba(40, 28, 36, 0.85);
    border-color: rgba(255, 140, 70, 0.5);
  }
  #speed {
    position: absolute; bottom: 36px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    opacity: 0.4;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="title">
    <h1>Twilight Ascent</h1>
    <p>Continuous ride · Autoplay</p>
  </div>
  <div id="phase">Boarding</div>
  <div id="speed">000 km/h</div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="controls">
    <button id="btnMute" type="button" aria-label="Toggle sound">Sound Off</button>
    <button id="btnPause" type="button" aria-label="Pause ride">Pause</button>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const phaseEl = document.getElementById('phase');
const speedEl = document.getElementById('speed');
const flashEl = document.getElementById('flash');
const btnMute = document.getElementById('btnMute');
const btnPause = document.getElementById('btnPause');

let paused = false;
let muted = true;
let audioCtx = null;
let masterGain = null;
let rideOsc = null;
let windGain = null;
let finaleFired = false;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0614, 0.0042);
scene.background = new THREE.Color(0x070510);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.15, 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.55, 0.82);
composer.addPass(bloom);

/* ---------- Track path: departure → climb → drop → helix → finale ---------- */
const trackPts = [
  new THREE.Vector3(0, 4, 40),
  new THREE.Vector3(0, 5, 10),
  new THREE.Vector3(8, 8, -20),
  new THREE.Vector3(18, 22, -55),
  new THREE.Vector3(12, 48, -95),
  new THREE.Vector3(-5, 72, -130),
  new THREE.Vector3(-28, 88, -155),      // summit
  new THREE.Vector3(-42, 78, -175),
  new THREE.Vector3(-48, 42, -200),       // plunge start
  new THREE.Vector3(-40, 12, -230),       // valley
  new THREE.Vector3(-18, 8, -255),
  new THREE.Vector3(15, 18, -275),
  new THREE.Vector3(48, 38, -285),
  new THREE.Vector3(70, 55, -270),        // rise into helix
  new THREE.Vector3(85, 48, -240),
  new THREE.Vector3(72, 35, -210),
  new THREE.Vector3(45, 42, -195),
  new THREE.Vector3(20, 55, -185),
  new THREE.Vector3(-5, 48, -170),
  new THREE.Vector3(-25, 32, -150),
  new THREE.Vector3(-30, 22, -120),
  new THREE.Vector3(-15, 16, -85),
  new THREE.Vector3(10, 20, -50),
  new THREE.Vector3(25, 35, -20),         // launch toward finale arch
  new THREE.Vector3(20, 50, 25),
  new THREE.Vector3(0, 58, 55),           // finale crest / tunnel of light
  new THREE.Vector3(-18, 40, 80),
  new THREE.Vector3(-22, 18, 100),
  new THREE.Vector3(-8, 8, 115),
  new THREE.Vector3(0, 5, 95),
  new THREE.Vector3(0, 4, 60),
  new THREE.Vector3(0, 4, 40),
];

const curve = new THREE.CatmullRomCurve3(trackPts, true, 'catmullrom', 0.35);
const railRadius = 0.12;
const railOffset = 0.55;

function buildRails() {
  const segs = 600;
  const left = [], right = [], center = [];
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t).normalize();
    let side = new THREE.Vector3().crossVectors(tan, up).normalize();
    if (side.lengthSq() < 0.001) side.set(1, 0, 0);
    const binormal = new THREE.Vector3().crossVectors(side, tan).normalize();
    const bank = Math.sin(t * Math.PI * 8) * 0.18;
    side.applyAxisAngle(tan, bank);
    left.push(p.clone().addScaledVector(side, -railOffset).addScaledVector(binormal, 0.05));
    right.push(p.clone().addScaledVector(side, railOffset).addScaledVector(binormal, 0.05));
    center.push(p.clone().addScaledVector(binormal, -0.35));
  }
  const leftCurve = new THREE.CatmullRomCurve3(left, true);
  const rightCurve = new THREE.CatmullRomCurve3(right, true);
  const centerCurve = new THREE.CatmullRomCurve3(center, true);

  const railMat = new THREE.MeshStandardMaterial({
    color: 0xc8b8a0, metalness: 0.92, roughness: 0.28,
    emissive: 0x221810, emissiveIntensity: 0.15
  });
  const tieMat = new THREE.MeshStandardMaterial({
    color: 0x2a1c18, metalness: 0.4, roughness: 0.7
  });

  const leftMesh = new THREE.Mesh(
    new THREE.TubeGeometry(leftCurve, segs, railRadius, 8, true), railMat
  );
  const rightMesh = new THREE.Mesh(
    new THREE.TubeGeometry(rightCurve, segs, railRadius, 8, true), railMat
  );
  const spine = new THREE.Mesh(
    new THREE.TubeGeometry(centerCurve, segs, 0.06, 6, true),
    new THREE.MeshStandardMaterial({ color: 0x1a1210, metalness: 0.6, roughness: 0.5 })
  );
  scene.add(leftMesh, rightMesh, spine);

  const tieGeo = new THREE.BoxGeometry(railOffset * 2.2, 0.08, 0.18);
  for (let i = 0; i < segs; i += 4) {
    const t = i / segs;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t).normalize();
    let side = new THREE.Vector3().crossVectors(tan, up).normalize();
    const binormal = new THREE.Vector3().crossVectors(side, tan).normalize();
    const tie = new THREE.Mesh(tieGeo, tieMat);
    tie.position.copy(p).addScaledVector(binormal, -0.2);
    tie.lookAt(p.clone().add(tan));
    tie.up.copy(binormal);
    scene.add(tie);
  }

  // Support pillars under lower track sections
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0x1e1614, metalness: 0.5, roughness: 0.65 });
  for (let i = 0; i < segs; i += 18) {
    const t = i / segs;
    const p = curve.getPointAt(t);
    if (p.y < 12) continue;
    const h = p.y - 0.5;
    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.32, h, 6),
      pillarMat
    );
    pillar.position.set(p.x, h / 2, p.z);
    scene.add(pillar);
  }
}

buildRails();

/* ---------- World: ground, sky, station, foliage, lights ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(280, 64),
  new THREE.MeshStandardMaterial({
    color: 0x0c1010, roughness: 0.95, metalness: 0.05
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

// Terrain hills
const hillGeo = new THREE.ConeGeometry(40, 18, 7);
const hillMat = new THREE.MeshStandardMaterial({ color: 0x0e1412, roughness: 1 });
[[-90, -60], [110, -140], [-130, 40], [80, 90], [-60, 140]].forEach(([x, z], i) => {
  const h = hillGeo.clone();
  const m = new THREE.Mesh(h, hillMat);
  m.position.set(x, 4 + (i % 3), z);
  m.scale.set(1 + (i % 3) * 0.3, 0.6 + (i % 2) * 0.4, 1);
  scene.add(m);
});

// Station platform
const station = new THREE.Group();
const plat = new THREE.Mesh(
  new THREE.BoxGeometry(14, 0.6, 22),
  new THREE.MeshStandardMaterial({ color: 0x2a2220, roughness: 0.8 })
);
plat.position.set(0, 3.6, 42);
station.add(plat);
const canopy = new THREE.Mesh(
  new THREE.BoxGeometry(16, 0.15, 18),
  new THREE.MeshStandardMaterial({
    color: 0x3a2018, emissive: 0xff6a30, emissiveIntensity: 0.12, roughness: 0.6
  })
);
canopy.position.set(0, 9, 42);
station.add(canopy);
for (let i = -1; i <= 1; i += 2) {
  const col = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.25, 5.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x4a3028, metalness: 0.4, roughness: 0.5 })
  );
  col.position.set(i * 6, 6.3, 42);
  station.add(col);
}
scene.add(station);

// Warm station lamps
[-5, 5].forEach(x => {
  const lamp = new THREE.PointLight(0xff8844, 2.2, 28, 2);
  lamp.position.set(x, 8.5, 42);
  scene.add(lamp);
});

// Ambient + key lighting
scene.add(new THREE.AmbientLight(0x1a1830, 0.55));
const moon = new THREE.DirectionalLight(0xa8b8ff, 0.45);
moon.position.set(-40, 80, 20);
scene.add(moon);
const sunGlow = new THREE.DirectionalLight(0xff7040, 0.35);
sunGlow.position.set(60, 30, -80);
scene.add(sunGlow);

// Horizon glow plane
const horizon = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 80),
  new THREE.MeshBasicMaterial({
    color: 0xff5a28,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
horizon.position.set(0, 18, -200);
horizon.rotation.x = -0.15;
scene.add(horizon);

// Stars
{
  const N = 1800;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 180 + Math.random() * 200;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) + 20;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const stars = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos, 3)),
    new THREE.PointsMaterial({ color: 0xfff5e0, size: 0.55, sizeAttenuation: true, transparent: true, opacity: 0.85 })
  );
  scene.add(stars);
}

// Neon path lights along track
const neonColors = [0xff6b2c, 0xff3d7a, 0x4ecdc4, 0xffc857];
for (let i = 0; i < 48; i++) {
  const t = i / 48;
  const p = curve.getPointAt(t);
  const c = neonColors[i % neonColors.length];
  const pl = new THREE.PointLight(c, 1.1, 22, 2);
  pl.position.copy(p).add(new THREE.Vector3(0, 1.2, 0));
  scene.add(pl);
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshBasicMaterial({ color: c })
  );
  bulb.position.copy(pl.position);
  scene.add(bulb);
}

// Trees / silhouettes
const treeMat = new THREE.MeshStandardMaterial({ color: 0x0a120e, roughness: 1 });
for (let i = 0; i < 70; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rad = 50 + Math.random() * 160;
  const x = Math.cos(ang) * rad;
  const z = Math.sin(ang) * rad;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.4, 4 + Math.random() * 3, 5),
    treeMat
  );
  trunk.position.set(x, 2.5, z);
  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(2 + Math.random() * 2, 6 + Math.random() * 5, 6),
    treeMat
  );
  crown.position.set(x, 7 + Math.random() * 2, z);
  scene.add(trunk, crown);
}

// Finale light tunnel rings at crest (~t=0.78)
const finaleGroup = new THREE.Group();
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xffe0a0, transparent: true, opacity: 0.55, side: THREE.DoubleSide
});
for (let i = 0; i < 12; i++) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(4 + i * 0.15, 0.08, 8, 48), ringMat.clone());
  ring.material.color.setHSL(0.08 + i * 0.02, 0.9, 0.65);
  ring.material.opacity = 0.35 + i * 0.04;
  const t = 0.74 + i * 0.008;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t);
  ring.position.copy(p);
  ring.lookAt(p.clone().add(tan));
  finaleGroup.add(ring);
}
scene.add(finaleGroup);

const finaleCore = new THREE.PointLight(0xfff0c0, 0, 80, 1.5);
finaleCore.position.copy(curve.getPointAt(0.78));
scene.add(finaleCore);

// Floating ember particles
const emberCount = 400;
const emberPos = new Float32Array(emberCount * 3);
const emberVel = [];
for (let i = 0; i < emberCount; i++) {
  emberPos[i * 3] = (Math.random() - 0.5) * 200;
  emberPos[i * 3 + 1] = Math.random() * 80;
  emberPos[i * 3 + 2] = (Math.random() - 0.5) * 200;
  emberVel.push(0.2 + Math.random() * 0.6);
}
const embers = new THREE.Points(
  new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(emberPos, 3)),
  new THREE.PointsMaterial({
    color: 0xff7a40, size: 0.35, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
scene.add(embers);

// Distant city glow cubes
for (let i = 0; i < 40; i++) {
  const w = 2 + Math.random() * 4;
  const h = 4 + Math.random() * 18;
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, w),
    new THREE.MeshStandardMaterial({
      color: 0x12101a,
      emissive: neonColors[i % neonColors.length],
      emissiveIntensity: 0.15 + Math.random() * 0.25
    })
  );
  const ang = -0.4 + Math.random() * 0.8;
  const rad = 160 + Math.random() * 60;
  b.position.set(Math.cos(ang) * rad + 40, h / 2, -180 + Math.sin(ang) * 40);
  scene.add(b);
}

/* ---------- Ride motion ---------- */
const tmpPos = new THREE.Vector3();
const tmpLook = new THREE.Vector3();
const tmpTan = new THREE.Vector3();
const tmpSide = new THREE.Vector3();
const tmpUp = new THREE.Vector3(0, 1, 0);
const camUp = new THREE.Vector3();
const desiredUp = new THREE.Vector3();
const smoothedUp = new THREE.Vector3(0, 1, 0);
const lookTarget = new THREE.Vector3();

let progress = 0.01;
let speedMul = 1;
let shake = 0;
let lastPhase = '';

function phaseName(t) {
  if (t < 0.08) return 'Departure';
  if (t < 0.22) return 'Ascent';
  if (t < 0.32) return 'Summit Hold';
  if (t < 0.42) return 'The Plunge';
  if (t < 0.58) return 'Valley Sweep';
  if (t < 0.72) return 'Helix Climb';
  if (t < 0.86) return 'Light Finale';
  return 'Return';
}

function speedProfile(t) {
  // Slow climb, explosive drop, mid helix, surge through finale
  if (t < 0.08) return 0.035;
  if (t < 0.28) return 0.028 + (t - 0.08) * 0.02;
  if (t < 0.32) return 0.022;
  if (t < 0.42) return 0.095;
  if (t < 0.55) return 0.065;
  if (t < 0.72) return 0.048;
  if (t < 0.82) return 0.078;
  return 0.04;
}

function displaySpeed(t) {
  const sp = speedProfile(t);
  return Math.round(sp * 2200);
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  rideOsc = audioCtx.createOscillator();
  rideOsc.type = 'sawtooth';
  rideOsc.frequency.value = 55;
  const rideFilter = audioCtx.createBiquadFilter();
  rideFilter.type = 'lowpass';
  rideFilter.frequency.value = 280;
  const rideG = audioCtx.createGain();
  rideG.gain.value = 0.08;
  rideOsc.connect(rideFilter);
  rideFilter.connect(rideG);
  rideG.connect(masterGain);
  rideOsc.start();

  const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const nFilter = audioCtx.createBiquadFilter();
  nFilter.type = 'bandpass';
  nFilter.frequency.value = 800;
  windGain = audioCtx.createGain();
  windGain.gain.value = 0.02;
  noise.connect(nFilter);
  nFilter.connect(windGain);
  windGain.connect(masterGain);
  noise.start();
}

function setMuted(m) {
  muted = m;
  btnMute.textContent = muted ? 'Sound Off' : 'Sound On';
  if (!audioCtx) return;
  masterGain.gain.setTargetAtTime(muted ? 0 : 0.55, audioCtx.currentTime, 0.08);
}

btnMute.addEventListener('click', () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setMuted(!muted);
});

btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? 'Resume' : 'Pause';
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let prevT = progress;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    const sp = speedProfile(progress) * speedMul;
    progress = (progress + sp * dt) % 1;

    // Crossed into plunge
    if (prevT < 0.33 && progress >= 0.33) shake = 0.55;
    if (prevT < 0.76 && progress >= 0.76) {
      finaleFired = true;
      flashEl.style.opacity = '0.55';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 180);
      finaleCore.intensity = 18;
    }
    prevT = progress;
  }

  const t = progress;
  const lookAhead = Math.min(0.018 + speedProfile(t) * 0.12, 0.04);
  tmpPos.copy(curve.getPointAt(t));
  tmpTan.copy(curve.getTangentAt(t)).normalize();
  tmpLook.copy(curve.getPointAt((t + lookAhead) % 1));

  tmpSide.crossVectors(tmpTan, tmpUp).normalize();
  if (tmpSide.lengthSq() < 1e-4) tmpSide.set(1, 0, 0);
  desiredUp.crossVectors(tmpSide, tmpTan).normalize();

  // Bank into turns
  const nextTan = curve.getTangentAt((t + 0.01) % 1).normalize();
  const turn = tmpTan.clone().cross(nextTan).y;
  desiredUp.applyAxisAngle(tmpTan, -turn * 3.5);

  smoothedUp.lerp(desiredUp, 1 - Math.pow(0.001, dt));
  smoothedUp.normalize();

  const camHeight = 1.05;
  camera.position.copy(tmpPos).addScaledVector(smoothedUp, camHeight);

  lookTarget.copy(tmpLook).addScaledVector(smoothedUp, 0.85);
  camera.up.copy(smoothedUp);
  camera.lookAt(lookTarget);

  // Speed FOV + shake on drop
  const targetFov = 68 + speedProfile(t) * 180;
  camera.fov += (targetFov - camera.fov) * 0.08;
  camera.updateProjectionMatrix();

  if (shake > 0.01) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.35;
    camera.position.y += (Math.random() - 0.5) * shake * 0.25;
    shake *= 0.94;
  }

  // Embers drift
  const ep = embers.geometry.attributes.position.array;
  for (let i = 0; i < emberCount; i++) {
    ep[i * 3 + 1] += emberVel[i] * dt;
    if (ep[i * 3 + 1] > 90) {
      ep[i * 3 + 1] = 0;
      ep[i * 3] = (Math.random() - 0.5) * 200;
      ep[i * 3 + 2] = (Math.random() - 0.5) * 200;
    }
  }
  embers.geometry.attributes.position.needsUpdate = true;
  embers.rotation.y += dt * 0.02;

  // Finale pulse
  if (finaleFired) {
    finaleCore.intensity = Math.max(0, finaleCore.intensity - dt * 6);
    const pulse = 0.5 + Math.sin(clock.elapsedTime * 6) * 0.25;
    finaleGroup.children.forEach((ring, i) => {
      ring.material.opacity = (0.25 + i * 0.03) * pulse + (t > 0.74 && t < 0.88 ? 0.4 : 0);
      ring.scale.setScalar(1 + Math.sin(clock.elapsedTime * 3 + i) * 0.03);
    });
    if (t > 0.95) finaleFired = false;
  } else {
    finaleGroup.children.forEach((ring, i) => {
      ring.material.opacity = 0.2 + Math.sin(clock.elapsedTime * 2 + i * 0.4) * 0.08;
    });
  }

  bloom.strength = 0.45 + speedProfile(t) * 2.2 + (t > 0.74 && t < 0.86 ? 0.5 : 0);

  const ph = phaseName(t);
  if (ph !== lastPhase) {
    lastPhase = ph;
    phaseEl.textContent = ph;
    phaseEl.style.opacity = '1';
    setTimeout(() => { phaseEl.style.opacity = '0.55'; }, 900);
  }
  speedEl.textContent = String(displaySpeed(t)).padStart(3, '0') + ' km/h';

  if (audioCtx && !muted) {
    const base = 40 + speedProfile(t) * 900;
    rideOsc.frequency.setTargetAtTime(base, audioCtx.currentTime, 0.05);
    windGain.gain.setTargetAtTime(0.015 + speedProfile(t) * 0.35, audioCtx.currentTime, 0.08);
  }

  composer.render();
}

animate();
</script>
