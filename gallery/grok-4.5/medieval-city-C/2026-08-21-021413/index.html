<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alderwick — Living Medieval City</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'IM Fell English', Georgia, serif;
    color: #f3e6c8;
  }
  #title {
    position: absolute; top: 28px; left: 36px;
    text-shadow: 0 2px 18px rgba(0,0,0,.75);
  }
  #title h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 2.6vw, 2.2rem);
    letter-spacing: .12em;
    font-weight: 700;
    color: #f6e7bf;
  }
  #title p {
    margin-top: 6px;
    font-size: .95rem;
    opacity: .78;
    font-style: italic;
    max-width: 28ch;
  }
  #hud {
    position: absolute; bottom: 28px; left: 36px;
    display: flex; gap: 18px; align-items: flex-end;
    font-size: .88rem;
    opacity: .85;
  }
  #hud span {
    background: linear-gradient(180deg, rgba(28,18,10,.55), rgba(12,8,5,.7));
    border: 1px solid rgba(214,176,110,.28);
    padding: 8px 14px;
    border-radius: 2px;
    backdrop-filter: blur(4px);
  }
  #hint {
    position: absolute; bottom: 28px; right: 36px;
    text-align: right;
    font-size: .82rem;
    opacity: .65;
    line-height: 1.55;
  }
  #fade {
    position: fixed; inset: 0;
    background: #0a0c10;
    pointer-events: none;
    transition: opacity 1.6s ease;
    z-index: 10;
  }
  #fade.out { opacity: 0; }
</style>
</head>
<body>
<div id="fade"></div>
<div id="ui">
  <div id="title">
    <h1>ALDERWICK</h1>
    <p>A living city of stone, timber, and twilight smoke.</p>
  </div>
  <div id="hud">
    <span id="clock">Dawn</span>
    <span id="pop">Souls: —</span>
  </div>
  <div id="hint">
    Drag to orbit · Scroll to zoom<br>
    Right-drag to pan · Click a building
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const started = performance.now();
const clockEl = document.getElementById('clock');
const popEl = document.getElementById('pop');

// ——— Seeded RNG ———
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0xA1DE01);

function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function rrange(a, b) { return a + rand() * (b - a); }
function rint(a, b) { return Math.floor(rrange(a, b + 1)); }

// ——— Scene ———
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a0b8);
scene.fog = new THREE.FogExp2(0x87a0b8, 0.012);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(42, 28, 48);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 12;
controls.maxDistance = 120;
controls.target.set(0, 4, 0);

// ——— Lights ———
const hemi = new THREE.HemisphereLight(0xb8d4f0, 0x3a2a18, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d0, 1.35);
sun.position.set(40, 55, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -70;
sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70;
sun.shadow.camera.bottom = -70;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x88aacc, 0.25);
fill.position.set(-30, 20, -40);
scene.add(fill);

const torchLights = [];

// ——— Materials ———
const matStone = new THREE.MeshStandardMaterial({ color: 0x8a8478, roughness: 0.92, metalness: 0.05 });
const matStoneDark = new THREE.MeshStandardMaterial({ color: 0x6a655c, roughness: 0.94, metalness: 0.04 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x5c3a22, roughness: 0.88, metalness: 0.02 });
const matWoodLight = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.85, metalness: 0.02 });
const matPlaster = new THREE.MeshStandardMaterial({ color: 0xd4c4a8, roughness: 0.95, metalness: 0.0 });
const matPlasterWarm = new THREE.MeshStandardMaterial({ color: 0xc9b48a, roughness: 0.95, metalness: 0.0 });
const matRoofRed = new THREE.MeshStandardMaterial({ color: 0x8b3a2a, roughness: 0.9, metalness: 0.05 });
const matRoofDark = new THREE.MeshStandardMaterial({ color: 0x5a2e24, roughness: 0.9, metalness: 0.05 });
const matRoofGreen = new THREE.MeshStandardMaterial({ color: 0x3d5a42, roughness: 0.9, metalness: 0.05 });
const matThatch = new THREE.MeshStandardMaterial({ color: 0x9a8448, roughness: 1, metalness: 0 });
const matCobble = new THREE.MeshStandardMaterial({ color: 0x6e6860, roughness: 0.98, metalness: 0.05 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x4a6b3a, roughness: 0.95, metalness: 0 });
const matWater = new THREE.MeshStandardMaterial({
  color: 0x2a5a6e, roughness: 0.15, metalness: 0.35,
  transparent: true, opacity: 0.82
});
const matBanner = new THREE.MeshStandardMaterial({ color: 0x7a1e1e, roughness: 0.8, metalness: 0.05, side: THREE.DoubleSide });
const matBannerBlue = new THREE.MeshStandardMaterial({ color: 0x1e3a6e, roughness: 0.8, metalness: 0.05, side: THREE.DoubleSide });
const matGold = new THREE.MeshStandardMaterial({ color: 0xc9a44a, roughness: 0.4, metalness: 0.7 });
const matSmoke = new THREE.MeshBasicMaterial({ color: 0xccc8c0, transparent: true, opacity: 0.22, depthWrite: false });

const roofMats = [matRoofRed, matRoofDark, matRoofGreen, matThatch];
const wallMats = [matPlaster, matPlasterWarm, matStone, matWoodLight];

// ——— Ground ———
const ground = new THREE.Mesh(new THREE.CircleGeometry(95, 64), matGrass);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const plaza = new THREE.Mesh(new THREE.CircleGeometry(14, 48), matCobble);
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 0.02;
plaza.receiveShadow = true;
scene.add(plaza);

// Roads as flat boxes
function addRoad(x1, z1, x2, z2, w = 3.2) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, len), matCobble);
  mesh.position.set((x1 + x2) / 2, 0.03, (z1 + z2) / 2);
  mesh.rotation.y = Math.atan2(dx, dz);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// Radial + ring roads
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  addRoad(0, 0, Math.cos(a) * 52, Math.sin(a) * 52, 3.4);
}
for (const r of [18, 32, 46]) {
  const segs = 24;
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2;
    const a1 = ((i + 1) / segs) * Math.PI * 2;
    addRoad(Math.cos(a0) * r, Math.sin(a0) * r, Math.cos(a1) * r, Math.sin(a1) * r, 2.8);
  }
}

// ——— Helpers ———
function box(w, h, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cone(r, h, mat, x, y, z, segs = 4) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, segs), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

function cyl(rT, rB, h, mat, x, y, z, segs = 8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, segs), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

const buildings = [];
const villagers = [];
const birds = [];
const smokes = [];
const banners = [];
const lanternFlickers = [];

function makeHouse(x, z, rot = 0, scale = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;

  const w = rrange(2.4, 3.8) * scale;
  const d = rrange(2.2, 3.4) * scale;
  const h = rrange(2.2, 3.6) * scale;
  const wall = pick(wallMats);
  const roof = pick(roofMats);

  const body = box(w, h, d, wall, 0, h / 2, 0, g);
  // timber frame accents
  if (rand() > 0.35) {
    box(w + 0.05, 0.12, d + 0.05, matWood, 0, h * 0.55, 0, g);
    box(0.12, h, d + 0.04, matWood, -w * 0.25, h / 2, 0, g);
    box(0.12, h, d + 0.04, matWood, w * 0.25, h / 2, 0, g);
  }

  // roof
  const roofH = rrange(1.2, 2.0) * scale;
  const roofMesh = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.78, roofH, 4), roof);
  roofMesh.position.y = h + roofH * 0.45;
  roofMesh.rotation.y = Math.PI / 4;
  roofMesh.castShadow = true;
  g.add(roofMesh);

  // door
  box(0.55 * scale, 1.1 * scale, 0.08, matWood, 0, 0.55 * scale, d / 2 + 0.02, g);

  // windows
  const winMat = new THREE.MeshStandardMaterial({
    color: rand() > 0.45 ? 0xffc866 : 0x2a3540,
    emissive: rand() > 0.45 ? 0xffaa44 : 0x000000,
    emissiveIntensity: rand() > 0.45 ? 0.55 : 0,
    roughness: 0.4
  });
  const winL = new THREE.Mesh(new THREE.PlaneGeometry(0.45 * scale, 0.55 * scale), winMat);
  winL.position.set(-w * 0.28, h * 0.55, d / 2 + 0.03);
  g.add(winL);
  const winR = winL.clone();
  winR.position.x = w * 0.28;
  g.add(winR);

  // chimney + smoke
  if (rand() > 0.4) {
    const ch = box(0.35 * scale, 0.9 * scale, 0.35 * scale, matStoneDark, w * 0.25, h + 0.3, -d * 0.1, g);
    const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), matSmoke.clone());
    smoke.position.set(w * 0.25, h + 1.4, -d * 0.1);
    g.add(smoke);
    smokes.push({ mesh: smoke, baseY: h + 1.4, phase: rand() * Math.PI * 2, speed: rrange(0.4, 1.1) });
  }

  scene.add(g);
  buildings.push({ group: g, name: pick(['Cottage', 'Merchant House', 'Workshop', 'Dwelling', 'Guild Hall']), x, z });
  return g;
}

function makeTower(x, z, height = 10) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const r = rrange(1.6, 2.2);
  cyl(r * 0.95, r, height, matStone, 0, height / 2, 0, 8);
  // battlements
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    box(0.55, 0.7, 0.55, matStoneDark, Math.cos(a) * r * 0.85, height + 0.35, Math.sin(a) * r * 0.85);
  }
  cone(r * 1.05, 2.4, pick([matRoofRed, matRoofDark]), 0, height + 1.8, 0, 8);
  // banner
  if (rand() > 0.3) {
    const pole = box(0.08, 3.2, 0.08, matWood, 0, height + 3.5, 0);
    const ban = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.8), pick([matBanner, matBannerBlue]));
    ban.position.set(0.7, height + 3.2, 0);
    scene.add(ban);
    banners.push({ mesh: ban, phase: rand() * 10 });
  }
  // torch
  const torch = new THREE.PointLight(0xff8844, 0.9, 12, 2);
  torch.position.set(x + r + 0.2, 3.5, z);
  scene.add(torch);
  torchLights.push(torch);
  lanternFlickers.push({ light: torch, base: 0.9, phase: rand() * 10 });

  buildings.push({ group: g, name: 'Watchtower', x, z });
  scene.add(g);
}

function makeCastle() {
  const cx = 0, cz = -38;
  // keep
  box(10, 12, 10, matStone, cx, 6, cz);
  box(11, 1.2, 11, matStoneDark, cx, 12.2, cz);
  for (let i = -1; i <= 1; i++) {
    for (let j = -1; j <= 1; j++) {
      if (Math.abs(i) + Math.abs(j) === 0) continue;
      if (Math.abs(i) === 1 && Math.abs(j) === 1) {
        box(1.4, 1.6, 1.4, matStone, cx + i * 4.5, 13.4, cz + j * 4.5);
      }
    }
  }
  // corner towers
  for (const [dx, dz] of [[-6, -6], [6, -6], [-6, 6], [6, 6]]) {
    cyl(1.8, 2, 14, matStone, cx + dx, 7, cz + dz, 8);
    cone(2.1, 3, matRoofDark, cx + dx, 15.5, cz + dz, 8);
  }
  // gatehouse
  box(8, 7, 4, matStoneDark, cx, 3.5, cz + 8);
  box(2.4, 4.2, 0.3, new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.9 }), cx, 2.1, cz + 10.1);
  // banners
  for (const sx of [-3, 3]) {
    const ban = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.2), matBanner);
    ban.position.set(cx + sx, 8, cz + 10.2);
    scene.add(ban);
    banners.push({ mesh: ban, phase: rand() * 10 });
  }
  // gold finial
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), matGold);
  fin.position.set(cx, 14.2, cz);
  scene.add(fin);

  buildings.push({ group: new THREE.Object3D(), name: 'Castle Keep', x: cx, z: cz });
}

function makeWalls() {
  const R = 54;
  const segs = 40;
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2;
    const a1 = ((i + 1) / segs) * Math.PI * 2;
    // skip gate
    if (i === 0 || i === 1) continue;
    const x = (Math.cos(a0) + Math.cos(a1)) / 2 * R;
    const z = (Math.sin(a0) + Math.sin(a1)) / 2 * R;
    const ang = Math.atan2(
      Math.cos(a1) - Math.cos(a0),
      Math.sin(a1) - Math.sin(a0)
    );
    const len = R * (a1 - a0) * 1.02;
    const wall = box(len, 4.5, 1.4, matStone, x, 2.25, z);
    wall.rotation.y = Math.atan2(Math.cos(a0) * R - x, Math.sin(a0) * R - z) + Math.PI / 2;
    // merlons
    if (i % 2 === 0) {
      box(0.7, 0.9, 1.5, matStoneDark, x, 5, z);
    }
  }
  // gate towers
  makeTower(8, 54, 11);
  makeTower(-8, 54, 11);
  box(14, 5.5, 2.2, matStone, 0, 2.75, 54);
  box(4, 3.5, 0.4, new THREE.MeshStandardMaterial({ color: 0x1a120c }), 0, 1.75, 55.2);
}

function makeMarket() {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + 0.2;
    const r = rrange(5, 10);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const stall = new THREE.Group();
    stall.position.set(x, 0, z);
    stall.rotation.y = a + Math.PI;
    box(2.2, 0.15, 1.4, matWood, 0, 0.9, 0, stall);
    // cloth roof
    const cloth = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 0.08, 1.6),
      new THREE.MeshStandardMaterial({
        color: pick([0xb83a3a, 0x3a5a9a, 0xc9a24a, 0x4a7a4a]),
        roughness: 0.85, side: THREE.DoubleSide
      })
    );
    cloth.position.set(0, 1.7, 0);
    cloth.rotation.x = -0.15;
    stall.add(cloth);
    box(0.1, 1.7, 0.1, matWood, -1, 0.85, -0.6, stall);
    box(0.1, 1.7, 0.1, matWood, 1, 0.85, -0.6, stall);
    scene.add(stall);
  }
  // fountain
  cyl(2.2, 2.4, 0.5, matStone, 0, 0.25, 0, 16);
  cyl(1.4, 1.5, 0.35, matStoneDark, 0, 0.6, 0, 16);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.2, 24), matWater);
  water.position.set(0, 0.72, 0);
  scene.add(water);
  cyl(0.25, 0.3, 1.6, matStone, 0, 1.4, 0, 8);
  const spout = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), matWater);
  spout.position.set(0, 2.3, 0);
  scene.add(spout);
  buildings.push({ group: new THREE.Object3D(), name: 'Market Fountain', x: 0, z: 0 });
}

function makeChurch() {
  const x = 22, z = 8;
  box(6, 5, 10, matStone, x, 2.5, z);
  // nave roof
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.2, 3.5, 4), matRoofDark);
  roof.rotation.y = Math.PI / 4;
  roof.position.set(x, 6.5, z);
  roof.scale.set(1, 1, 1.6);
  roof.castShadow = true;
  scene.add(roof);
  // steeple
  box(2.4, 8, 2.4, matStoneDark, x, 7, z - 4);
  cone(1.8, 4, matRoofDark, x, 13, z - 4, 4);
  const crossV = box(0.12, 1.2, 0.12, matGold, x, 15.2, z - 4);
  const crossH = box(0.7, 0.12, 0.12, matGold, x, 15.5, z - 4);
  buildings.push({ group: new THREE.Object3D(), name: 'Cathedral of St. Alden', x, z });
}

function makeTree(x, z) {
  const trunk = cyl(0.2, 0.35, 2.2, matWood, x, 1.1, z, 6);
  const canopy = new THREE.Mesh(
    new THREE.SphereGeometry(rrange(1.4, 2.2), 8, 8),
    new THREE.MeshStandardMaterial({ color: pick([0x3d6b35, 0x4a7a3a, 0x2f5a28]), roughness: 0.95 })
  );
  canopy.position.set(x, 2.8 + rand(), z);
  canopy.castShadow = true;
  scene.add(canopy);
}

function makeVillager(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const skin = new THREE.MeshStandardMaterial({ color: pick([0xe8c4a0, 0xc48a62, 0xd4a878]), roughness: 0.8 });
  const cloth = new THREE.MeshStandardMaterial({
    color: pick([0x6a2a2a, 0x2a3a6a, 0x3a5a2a, 0x6a5a2a, 0x4a4a5a]),
    roughness: 0.9
  });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.55, 4, 8), cloth);
  body.position.y = 0.75;
  body.castShadow = true;
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), skin);
  head.position.y = 1.28;
  g.add(head);
  scene.add(g);

  const pathR = rrange(6, 48);
  const pathSpeed = rrange(0.15, 0.45) * (rand() > 0.5 ? 1 : -1);
  const pathPhase = rand() * Math.PI * 2;
  const pathType = rand() > 0.4 ? 'circle' : 'wander';
  villagers.push({
    mesh: g,
    pathR, pathSpeed, pathPhase, pathType,
    wx: x, wz: z,
    tx: x + rrange(-8, 8), tz: z + rrange(-8, 8),
    bob: rand() * 10
  });
}

function makeBird() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.08, 0.35, 4),
    new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 })
  );
  body.rotation.z = Math.PI / 2;
  g.add(body);
  const wingL = new THREE.Mesh(
    new THREE.PlaneGeometry(0.35, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
  );
  wingL.position.set(0, 0.02, 0.05);
  g.add(wingL);
  const wingR = wingL.clone();
  wingR.position.z = -0.05;
  g.add(wingR);
  scene.add(g);
  birds.push({
    mesh: g, wingL, wingR,
    r: rrange(20, 55),
    y: rrange(12, 28),
    speed: rrange(0.3, 0.8),
    phase: rand() * Math.PI * 2
  });
}

// ——— Build city ———
makeCastle();
makeWalls();
makeMarket();
makeChurch();

// houses in rings
for (let ring = 0; ring < 3; ring++) {
  const r = 16 + ring * 12;
  const count = 10 + ring * 6;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + ring * 0.2 + rrange(-0.08, 0.08);
    const rr = r + rrange(-2.5, 2.5);
    const x = Math.cos(a) * rr;
    const z = Math.sin(a) * rr;
    // keep clear of castle & gate
    if (z < -28 && Math.abs(x) < 16) continue;
    if (z > 48 && Math.abs(x) < 12) continue;
    makeHouse(x, z, a + Math.PI, rrange(0.85, 1.2));
  }
}

// extra towers on wall
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2 + 0.4;
  if (Math.abs(a - Math.PI / 2) < 0.4) continue;
  makeTower(Math.cos(a) * 54, Math.sin(a) * 54, rrange(9, 13));
}

// trees outside & parks
for (let i = 0; i < 40; i++) {
  const a = rand() * Math.PI * 2;
  const r = rrange(58, 78);
  makeTree(Math.cos(a) * r, Math.sin(a) * r);
}
for (let i = 0; i < 12; i++) {
  const a = rand() * Math.PI * 2;
  makeTree(Math.cos(a) * rrange(12, 40), Math.sin(a) * rrange(12, 40));
}

// villagers
for (let i = 0; i < 36; i++) {
  const a = rand() * Math.PI * 2;
  makeVillager(Math.cos(a) * rrange(4, 45), Math.sin(a) * rrange(4, 45));
}
popEl.textContent = `Souls: ${villagers.length}`;

// birds
for (let i = 0; i < 14; i++) makeBird();

// street lamps
for (let i = 0; i < 16; i++) {
  const a = (i / 16) * Math.PI * 2;
  const r = 14;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  box(0.12, 2.4, 0.12, matWood, x, 1.2, z);
  const lamp = new THREE.PointLight(0xffaa55, 0.55, 10, 2);
  lamp.position.set(x, 2.5, z);
  scene.add(lamp);
  lanternFlickers.push({ light: lamp, base: 0.55, phase: rand() * 10 });
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xffcc66, emissive: 0xff8844, emissiveIntensity: 0.8 })
  );
  bulb.position.set(x, 2.5, z);
  scene.add(bulb);
}

// river arc outside wall
for (let i = 0; i < 30; i++) {
  const t = i / 29;
  const x = -70 + t * 140;
  const z = 62 + Math.sin(t * Math.PI * 2) * 4;
  const w = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 0.15, 12), matWater);
  w.rotation.x = -Math.PI / 2;
  w.position.set(x, 0.08, z);
  scene.add(w);
}

// ——— Interaction ———
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const infoTag = document.createElement('div');
infoTag.style.cssText = `
  position:fixed; top:50%; left:50%; transform:translate(-50%,-120%);
  background:rgba(18,12,8,.82); border:1px solid rgba(214,176,110,.35);
  padding:10px 18px; font-family:'IM Fell English',serif; color:#f3e6c8;
  opacity:0; transition:opacity .35s; pointer-events:none; font-size:.95rem;
  text-shadow:0 1px 8px #000; z-index:5;
`;
document.body.appendChild(infoTag);
let infoTimer = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  // find nearest building by xz
  const hit = new THREE.Vector3();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  raycaster.ray.intersectPlane(plane, hit);
  if (!hit) return;
  let best = null, bestD = 6;
  for (const b of buildings) {
    const d = Math.hypot(b.x - hit.x, b.z - hit.z);
    if (d < bestD) { bestD = d; best = b; }
  }
  if (best) {
    infoTag.textContent = best.name;
    infoTag.style.opacity = '1';
    infoTimer = 2.5;
    controls.target.lerp(new THREE.Vector3(best.x, 3, best.z), 0.35);
  }
});

// ——— Day cycle ———
const dayLabels = [
  [0.0, 'Midnight'], [0.15, 'Before Dawn'], [0.25, 'Dawn'],
  [0.35, 'Morning'], [0.5, 'Midday'], [0.65, 'Afternoon'],
  [0.75, 'Dusk'], [0.85, 'Nightfall'], [0.95, 'Night']
];

function updateDay(t) {
  // t in [0,1) over day
  const elev = Math.sin(t * Math.PI * 2 - Math.PI / 2);
  const az = t * Math.PI * 2;
  const dist = 70;
  sun.position.set(Math.cos(az) * dist, Math.max(elev, 0.05) * 55 + 5, Math.sin(az) * dist * 0.6);
  sun.target.position.set(0, 0, 0);
  sun.target.updateMatrixWorld();

  const dayFactor = THREE.MathUtils.clamp(elev * 0.5 + 0.5, 0, 1);
  sun.intensity = 0.2 + dayFactor * 1.3;
  hemi.intensity = 0.2 + dayFactor * 0.45;

  const dayCol = new THREE.Color(0x87a0b8);
  const duskCol = new THREE.Color(0xc47848);
  const nightCol = new THREE.Color(0x0c1220);
  let sky;
  if (dayFactor > 0.55) sky = dayCol;
  else if (dayFactor > 0.25) sky = duskCol.clone().lerp(dayCol, (dayFactor - 0.25) / 0.3);
  else sky = nightCol.clone().lerp(duskCol, dayFactor / 0.25);

  scene.background.copy(sky);
  scene.fog.color.copy(sky);
  renderer.toneMappingExposure = 0.75 + dayFactor * 0.45;

  const torchBoost = 1 - dayFactor;
  for (const f of lanternFlickers) {
    f.light.intensity = (f.base * 0.25 + f.base * torchBoost * 1.2) *
      (0.85 + 0.15 * Math.sin(performance.now() * 0.008 + f.phase));
  }

  let label = 'Dawn';
  for (const [th, name] of dayLabels) {
    if (t >= th) label = name;
  }
  clockEl.textContent = label;
}

// ——— Animate ———
const t0 = performance.now();
let daySpeed = 1 / 90; // full day ~90s

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const elapsed = (now - t0) / 1000;
  const dt = 0.016;

  const dayT = (elapsed * daySpeed) % 1;
  updateDay(dayT);

  // villagers
  for (const v of villagers) {
    v.bob += dt * 6;
    if (v.pathType === 'circle') {
      const a = v.pathPhase + elapsed * v.pathSpeed;
      const nx = Math.cos(a) * v.pathR;
      const nz = Math.sin(a) * v.pathR;
      const dx = nx - v.mesh.position.x;
      const dz = nz - v.mesh.position.z;
      v.mesh.position.x = nx;
      v.mesh.position.z = nz;
      v.mesh.rotation.y = Math.atan2(dx, dz);
    } else {
      const dx = v.tx - v.mesh.position.x;
      const dz = v.tz - v.mesh.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.4) {
        v.tx = THREE.MathUtils.clamp(v.mesh.position.x + rrange(-10, 10), -48, 48);
        v.tz = THREE.MathUtils.clamp(v.mesh.position.z + rrange(-10, 10), -48, 48);
      } else {
        v.mesh.position.x += (dx / dist) * 0.035 * Math.abs(v.pathSpeed) * 2;
        v.mesh.position.z += (dz / dist) * 0.035 * Math.abs(v.pathSpeed) * 2;
        v.mesh.rotation.y = Math.atan2(dx, dz);
      }
    }
    v.mesh.position.y = Math.abs(Math.sin(v.bob)) * 0.06;
  }

  // birds
  for (const b of birds) {
    const a = b.phase + elapsed * b.speed;
    b.mesh.position.set(Math.cos(a) * b.r, b.y + Math.sin(a * 2) * 1.5, Math.sin(a) * b.r);
    b.mesh.rotation.y = -a + Math.PI / 2;
    const flap = Math.sin(elapsed * 12 + b.phase) * 0.6;
    b.wingL.rotation.x = flap;
    b.wingR.rotation.x = -flap;
  }

  // smoke
  for (const s of smokes) {
    const p = elapsed * s.speed + s.phase;
    s.mesh.position.y = s.baseY + (p % 2.5);
    s.mesh.scale.setScalar(0.6 + (p % 2.5) * 0.5);
    s.mesh.material.opacity = 0.25 * (1 - (p % 2.5) / 2.5);
  }

  // banners
  for (const b of banners) {
    b.mesh.rotation.y = Math.sin(elapsed * 2.2 + b.phase) * 0.25;
    b.mesh.rotation.z = Math.sin(elapsed * 1.7 + b.phase) * 0.08;
  }

  if (infoTimer > 0) {
    infoTimer -= dt;
    if (infoTimer <= 0) infoTag.style.opacity = '0';
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(() => {
  document.getElementById('fade').classList.add('out');
});
animate();

console.log(`Alderwick ready in ${Math.round(performance.now() - started)}ms`);
</script>
</body>
</html>
