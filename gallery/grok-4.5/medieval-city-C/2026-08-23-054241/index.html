<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurelspire — Living Medieval City</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0806; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'IM Fell English', Georgia, serif;
    color: #f3e6c8;
    text-shadow: 0 1px 8px rgba(0,0,0,.85);
  }
  #title {
    position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 1.4s ease;
  }
  #title.visible { opacity: 1; }
  #title h1 {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(1.6rem, 4vw, 3rem);
    letter-spacing: .18em; color: #f5d78a;
  }
  #title p {
    margin-top: .55rem; font-size: clamp(.85rem, 1.6vw, 1.15rem);
    letter-spacing: .08em; font-style: italic; opacity: .92; color: #d8c7a0;
  }
  #chapter {
    position: absolute; bottom: 9%; left: 50%; transform: translateX(-50%);
    text-align: center; min-height: 3.2rem;
    opacity: 0; transition: opacity .9s ease;
  }
  #chapter.visible { opacity: 1; }
  #chapter .label {
    font-family: 'Cinzel', serif; font-size: .72rem; letter-spacing: .28em;
    text-transform: uppercase; color: #c9a45c; margin-bottom: .35rem;
  }
  #chapter .line {
    font-size: clamp(.95rem, 1.8vw, 1.25rem); max-width: 36rem; line-height: 1.45;
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(8,5,2,.72) 100%);
    pointer-events: none;
  }
  #bar {
    position: absolute; bottom: 4.5%; left: 50%; transform: translateX(-50%);
    width: min(340px, 55vw); height: 2px; background: rgba(243,230,200,.18);
    border-radius: 2px; overflow: hidden;
  }
  #bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #8a5a1e, #f0c86a);
    box-shadow: 0 0 10px rgba(240,200,106,.55);
  }
  #hint {
    position: absolute; bottom: 2%; right: 2.2%;
    font-size: .7rem; letter-spacing: .06em; opacity: .45;
  }
</style>
</head>
<body>
<div id="hud">
  <div id="title">
    <h1>AURELSPIRE</h1>
    <p>A city that wakes, works, and watches the walls</p>
  </div>
  <div id="chapter">
    <div class="label" id="chLabel">Dawn</div>
    <div class="line" id="chLine">Mist lifts from the outer gate…</div>
  </div>
  <div id="vignette"></div>
  <div id="bar"><i id="prog"></i></div>
  <div id="hint">drag to look · scroll to linger</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const seed = 77421;
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(seed);
const rand = (a=0, b=1) => a + rnd() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[irand(0, arr.length - 1)];

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x6a7a8c, 0.0085);
scene.background = new THREE.Color(0x6a7a8c);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.2, 420);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* —— palette —— */
const PAL = {
  stone: 0x8a8174, stoneDark: 0x5c554c, timber: 0x5a3a22, plaster: 0xc9b89a,
  roofClay: 0x8b3a2a, roofMoss: 0x4a5a38, roofSlate: 0x4a5058, thatch: 0xa89050,
  gold: 0xd4a84a, banner: 0x6b1f2a, market: 0xc45c28, workshop: 0x3d4a5c,
  home: 0xb89a6a, wall: 0x6e675c, cobble: 0x6a6258, grass: 0x3d5a32,
  water: 0x2a4a5a, fire: 0xff8a3a, lantern: 0xffc878
};

const mats = {
  stone: new THREE.MeshStandardMaterial({ color: PAL.stone, roughness: 0.92, metalness: 0.05 }),
  stoneDark: new THREE.MeshStandardMaterial({ color: PAL.stoneDark, roughness: 0.95 }),
  timber: new THREE.MeshStandardMaterial({ color: PAL.timber, roughness: 0.85 }),
  plaster: new THREE.MeshStandardMaterial({ color: PAL.plaster, roughness: 0.88 }),
  roofClay: new THREE.MeshStandardMaterial({ color: PAL.roofClay, roughness: 0.8 }),
  roofMoss: new THREE.MeshStandardMaterial({ color: PAL.roofMoss, roughness: 0.9 }),
  roofSlate: new THREE.MeshStandardMaterial({ color: PAL.roofSlate, roughness: 0.75 }),
  thatch: new THREE.MeshStandardMaterial({ color: PAL.thatch, roughness: 1 }),
  cobble: new THREE.MeshStandardMaterial({ color: PAL.cobble, roughness: 0.95 }),
  grass: new THREE.MeshStandardMaterial({ color: PAL.grass, roughness: 1 }),
  water: new THREE.MeshStandardMaterial({ color: PAL.water, roughness: 0.15, metalness: 0.35, transparent: true, opacity: 0.85 }),
  gold: new THREE.MeshStandardMaterial({ color: PAL.gold, roughness: 0.35, metalness: 0.7, emissive: 0x332200, emissiveIntensity: 0.15 }),
  banner: new THREE.MeshStandardMaterial({ color: PAL.banner, roughness: 0.7, side: THREE.DoubleSide }),
  fire: new THREE.MeshBasicMaterial({ color: PAL.fire }),
  lantern: new THREE.MeshStandardMaterial({ color: PAL.lantern, emissive: PAL.lantern, emissiveIntensity: 1.2, roughness: 0.4 }),
  smoke: new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.25, depthWrite: false })
};

const city = new THREE.Group();
scene.add(city);
const movers = [];
const lightsDyn = [];
const torches = [];
const smokePuffs = [];
const banners = [];
const marketGoods = [];

/* —— ground —— */
const ground = new THREE.Mesh(new THREE.CircleGeometry(95, 64), mats.grass);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
city.add(ground);

const plaza = new THREE.Mesh(new THREE.CircleGeometry(14, 48), mats.cobble);
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 0.04;
plaza.receiveShadow = true;
city.add(plaza);

/* —— helpers —— */
function box(w, h, d, mat, x=0, y=0, z=0, parent=city) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(r, h, mat, x=0, y=0, z=0, segs=10, parent=city) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

function makeRoof(w, d, h, mat, parent) {
  const geo = new THREE.ConeGeometry(Math.max(w, d) * 0.72, h, 4);
  const m = new THREE.Mesh(geo, mat);
  m.rotation.y = Math.PI / 4;
  m.castShadow = true;
  parent.add(m);
  return m;
}

function addWindow(bldg, lx, ly, lz, lit=false) {
  const frame = box(0.55, 0.7, 0.08, mats.timber, lx, ly, lz, bldg);
  const pane = box(0.4, 0.55, 0.06, lit ? mats.lantern : mats.stoneDark, lx, ly, lz + 0.02, bldg);
  if (lit) {
    const pl = new THREE.PointLight(0xffb060, 0, 6, 2);
    pl.position.set(lx, ly, lz + 0.4);
    bldg.add(pl);
    lightsDyn.push({ light: pl, base: 0.55 + rand(0, 0.35) });
  }
  return pane;
}

function makeHouse(x, z, rot, kind='home') {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  city.add(g);

  const w = rand(3.2, 5.2);
  const d = rand(3.0, 4.8);
  const floors = kind === 'workshop' ? 1 : irand(1, 2);
  const story = rand(2.4, 3.0);
  const h = story * floors + 0.4;
  const bodyMat = kind === 'workshop' ? mats.stoneDark : (rnd() > 0.45 ? mats.plaster : mats.stone);
  const roofMat = kind === 'workshop' ? mats.roofSlate : pick([mats.roofClay, mats.roofMoss, mats.thatch]);

  box(w, h, d, bodyMat, 0, h/2, 0, g);
  // timber beams
  if (bodyMat === mats.plaster) {
    box(w + 0.08, 0.18, 0.18, mats.timber, 0, story, d/2 + 0.02, g);
    box(0.18, h - 0.3, 0.18, mats.timber, -w/2 + 0.15, h/2, d/2 + 0.02, g);
    box(0.18, h - 0.3, 0.18, mats.timber, w/2 - 0.15, h/2, d/2 + 0.02, g);
  }
  const roof = makeRoof(w + 0.5, d + 0.5, rand(1.4, 2.2), roofMat, g);
  roof.position.y = h + 0.7;

  // chimney + smoke
  const chx = rand(-w*0.25, w*0.25);
  cyl(0.28, 1.1, mats.stoneDark, chx, h + 0.9, -d*0.15, 6, g);
  if (rnd() > 0.35) {
    const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), mats.smoke.clone());
    smoke.position.set(chx, h + 1.6, -d*0.15);
    g.add(smoke);
    smokePuffs.push({ mesh: smoke, baseY: smoke.position.y, phase: rand(0, Math.PI*2), speed: rand(0.4, 0.9) });
  }

  // door
  box(0.9, 1.5, 0.12, mats.timber, 0, 0.75, d/2 + 0.05, g);
  if (kind === 'workshop') {
    box(1.6, 1.1, 0.1, mats.timber, 0, 1.8, d/2 + 0.06, g);
    const forge = new THREE.PointLight(0xff6020, 0.9, 8, 2);
    forge.position.set(0, 1.2, 0);
    g.add(forge);
    lightsDyn.push({ light: forge, base: 0.7, flicker: true });
    const glow = box(0.8, 0.35, 0.8, mats.fire, 0, 0.4, -0.2, g);
    torches.push({ mesh: glow, phase: rand(0, 6) });
  } else {
    addWindow(g, -w*0.28, story * 0.55, d/2 + 0.04, rnd() > 0.5);
    if (floors > 1) addWindow(g, w*0.25, story * 1.35, d/2 + 0.04, rnd() > 0.4);
  }

  // hanging sign / awning for market-adjacent
  if (kind === 'market') {
    const awn = box(w * 0.9, 0.08, 1.2, mats.banner, 0, 2.1, d/2 + 0.55, g);
    banners.push({ mesh: awn, phase: rand(0, 5), amp: 0.04 });
    for (let i = 0; i < 3; i++) {
      const crate = box(0.55, 0.45, 0.55, mats.timber, -w*0.3 + i*0.7, 0.22, d/2 + 1.1, g);
      const fruit = box(0.4, 0.2, 0.4, new THREE.MeshStandardMaterial({
        color: pick([0xc43c28, 0xd4a020, 0x4a8a3a, 0x7a3a8a]), roughness: 0.7
      }), crate.position.x, 0.55, crate.position.z, g);
      marketGoods.push(fruit);
    }
  }

  g.userData.kind = kind;
  return g;
}

/* —— streets ring layout —— */
const ringRadii = [10, 22, 36, 50];
const buildings = [];

// central fountain plaza
cyl(2.2, 0.5, mats.stone, 0, 0.25, 0);
cyl(0.9, 1.4, mats.stoneDark, 0, 0.9, 0);
const fountainWater = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.15, 24), mats.water);
fountainWater.position.y = 0.55;
city.add(fountainWater);
const spout = new THREE.PointLight(0x88ccee, 0.35, 10);
spout.position.set(0, 2.2, 0);
city.add(spout);

// market stalls around plaza
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2 + 0.2;
  const r = 8.5;
  const stall = makeHouse(Math.cos(a) * r, Math.sin(a) * r, a + Math.PI, 'market');
  buildings.push(stall);
}

// homes & workshops on rings
for (let ring = 1; ring < ringRadii.length; ring++) {
  const R = ringRadii[ring];
  const count = 8 + ring * 6;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + ring * 0.15;
    const jitter = rand(-1.2, 1.2);
    const rr = R + jitter;
    // leave street gaps
    if (i % 5 === 0) continue;
    const kind = (ring === 2 && i % 4 === 0) ? 'workshop' : 'home';
    const h = makeHouse(Math.cos(a) * rr, Math.sin(a) * rr, a + Math.PI + rand(-0.2, 0.2), kind);
    buildings.push(h);
  }
}

/* —— streets as cobble strips —— */
function streetRing(radius, width) {
  const shape = new THREE.Shape();
  const segs = 64;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const x = Math.cos(a) * (radius + width/2);
    const z = Math.sin(a) * (radius + width/2);
    if (i === 0) shape.moveTo(x, z); else shape.lineTo(x, z);
  }
  const hole = new THREE.Path();
  for (let i = segs; i >= 0; i--) {
    const a = (i / segs) * Math.PI * 2;
    hole.lineTo(Math.cos(a) * (radius - width/2), Math.sin(a) * (radius - width/2));
  }
  shape.holes.push(hole);
  const geo = new THREE.ShapeGeometry(shape);
  const mesh = new THREE.Mesh(geo, mats.cobble);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.03;
  mesh.receiveShadow = true;
  city.add(mesh);
}
streetRing(16, 4.5);
streetRing(30, 4);
streetRing(44, 3.8);

// radial avenues
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const len = 58;
  const road = box(3.6, 0.06, len, mats.cobble, Math.cos(a)*len/2, 0.035, Math.sin(a)*len/2);
  road.rotation.y = -a;
}

/* —— city wall —— */
const wallR = 62;
const wallH = 7.5;
const wallSegs = 48;
for (let i = 0; i < wallSegs; i++) {
  const a0 = (i / wallSegs) * Math.PI * 2;
  const a1 = ((i + 1) / wallSegs) * Math.PI * 2;
  const mid = (a0 + a1) / 2;
  // gate openings at 0 and PI
  const gate = (Math.abs(Math.sin(mid)) < 0.12 && Math.cos(mid) > 0.5) ||
               (Math.abs(Math.sin(mid)) < 0.12 && Math.cos(mid) < -0.5);
  if (gate) continue;
  const x = Math.cos(mid) * wallR;
  const z = Math.sin(mid) * wallR;
  const seg = box(4.2, wallH, 2.2, mats.stone, x, wallH/2, z);
  seg.rotation.y = -mid + Math.PI/2;
  // crenellations
  for (let c = -1; c <= 1; c++) {
    const merlon = box(0.9, 1.1, 1.8, mats.stoneDark, 0, wallH/2 + 0.55, c * 1.1, seg);
  }
  if (i % 4 === 0) {
    const tower = cyl(2.4, wallH + 3.5, mats.stoneDark, x * 1.02, (wallH+3.5)/2, z * 1.02, 8);
    makeRoof(4.5, 4.5, 2.2, mats.roofSlate, tower).position.y = (wallH+3.5)/2 + 1.0;
    const torch = new THREE.PointLight(0xff9030, 0.6, 14, 2);
    torch.position.set(x * 0.98, wallH - 1, z * 0.98);
    city.add(torch);
    lightsDyn.push({ light: torch, base: 0.55, flicker: true });
  }
}

// gatehouses
function gatehouse(angle) {
  const x = Math.cos(angle) * wallR;
  const z = Math.sin(angle) * wallR;
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = -angle + Math.PI/2;
  city.add(g);
  box(10, 9, 5, mats.stone, 0, 4.5, 0, g);
  box(4, 5, 5.2, mats.stoneDark, 0, 2.5, 0, g); // arch void visual
  const arch = box(3.2, 4.2, 5.4, mats.cobble, 0, 2.1, 0, g);
  arch.visible = false;
  makeRoof(11, 6, 2.5, mats.roofSlate, g).position.y = 10.2;
  // banners
  for (const sx of [-3.5, 3.5]) {
    const ban = box(0.08, 2.8, 1.2, mats.banner, sx, 6.5, 2.6, g);
    banners.push({ mesh: ban, phase: rand(0, 4), amp: 0.08 });
  }
  cyl(0.15, 4, mats.timber, -4, 8, 2.8, 5, g);
  cyl(0.15, 4, mats.timber, 4, 8, 2.8, 5, g);
  const gold = box(0.6, 0.6, 0.15, mats.gold, 0, 7.8, 2.55, g);
}
gatehouse(0);
gatehouse(Math.PI);

/* —— cathedral / keep (memorable landmark) —— */
const keep = new THREE.Group();
keep.position.set(-18, 0, -8);
city.add(keep);
box(10, 12, 10, mats.stone, 0, 6, 0, keep);
box(14, 4, 14, mats.stoneDark, 0, 1.8, 0, keep);
const spire = cyl(1.8, 16, mats.stone, 0, 18, 0, 8, keep);
const spireRoof = makeRoof(4, 4, 5, mats.roofSlate, keep);
spireRoof.position.y = 28;
const cross = box(0.15, 1.8, 0.15, mats.gold, 0, 31, 0, keep);
box(1.2, 0.15, 0.15, mats.gold, 0, 30.5, 0, keep);
// stained glow windows
for (let i = 0; i < 4; i++) {
  const a = (i / 4) * Math.PI * 2;
  const wx = Math.cos(a) * 5.1;
  const wz = Math.sin(a) * 5.1;
  const win = box(1.2, 2.8, 0.2, new THREE.MeshStandardMaterial({
    color: pick([0x4a6ad4, 0xd44a4a, 0xd4a020]), emissive: 0x223344, emissiveIntensity: 0.4, roughness: 0.5
  }), wx, 7, wz, keep);
  win.lookAt(0, 7, 0);
}
const keepLight = new THREE.PointLight(0xffd090, 1.2, 40, 2);
keepLight.position.set(0, 14, 0);
keep.add(keepLight);
lightsDyn.push({ light: keepLight, base: 1.0 });

/* —— trees & wells —— */
for (let i = 0; i < 40; i++) {
  const a = rand(0, Math.PI * 2);
  const r = rand(12, 58);
  if (Math.abs(r - wallR) < 6) continue;
  const tx = Math.cos(a) * r, tz = Math.sin(a) * r;
  cyl(0.35, 2.2, mats.timber, tx, 1.1, tz, 6);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(rand(1.4, 2.4), 8, 8), mats.grass);
  canopy.position.set(tx, 3.2, tz);
  canopy.castShadow = true;
  city.add(canopy);
}
for (let i = 0; i < 5; i++) {
  const a = rand(0, Math.PI*2), r = rand(14, 40);
  cyl(1.1, 0.7, mats.stone, Math.cos(a)*r, 0.35, Math.sin(a)*r, 10);
}

/* —— citizens —— */
function makePerson(hue) {
  const g = new THREE.Group();
  const body = box(0.45, 0.85, 0.3, new THREE.MeshStandardMaterial({ color: hue, roughness: 0.8 }), 0, 0.85, 0, g);
  const head = cyl(0.22, 0.35, new THREE.MeshStandardMaterial({ color: 0xc4a07a, roughness: 0.7 }), 0, 1.5, 0, 8, g);
  return g;
}

const paths = [];
// circular walks
for (const R of [9, 16, 30, 44]) {
  paths.push({ type: 'circle', r: R, speed: rand(0.12, 0.28) });
}
// radial walks
for (let i = 0; i < 6; i++) {
  paths.push({ type: 'radial', angle: (i/6)*Math.PI*2, speed: rand(0.15, 0.3), len: 50 });
}

const colors = [0x6b1f2a, 0x2a4a6b, 0x4a6b2a, 0x8a5a20, 0x5a3a6b, 0xc4a060, 0x3a3a3a];
for (let i = 0; i < 55; i++) {
  const p = makePerson(pick(colors));
  const path = paths[i % paths.length];
  const phase = rand(0, Math.PI * 2);
  city.add(p);
  movers.push({ mesh: p, path, phase, bob: rand(0, 3), cart: false });
}

// carts
for (let i = 0; i < 8; i++) {
  const cart = new THREE.Group();
  box(1.6, 0.7, 1.0, mats.timber, 0, 0.55, 0, cart);
  cyl(0.28, 0.12, mats.stoneDark, -0.55, 0.28, 0.55, 8, cart).rotation.z = Math.PI/2;
  cyl(0.28, 0.12, mats.stoneDark, 0.55, 0.28, 0.55, 8, cart).rotation.z = Math.PI/2;
  cyl(0.28, 0.12, mats.stoneDark, -0.55, 0.28, -0.55, 8, cart).rotation.z = Math.PI/2;
  cyl(0.28, 0.12, mats.stoneDark, 0.55, 0.28, -0.55, 8, cart).rotation.z = Math.PI/2;
  city.add(cart);
  movers.push({
    mesh: cart,
    path: paths[i % paths.length],
    phase: rand(0, Math.PI*2),
    bob: 0,
    cart: true
  });
}

/* —— birds —— */
const birds = [];
for (let i = 0; i < 18; i++) {
  const b = box(0.5, 0.06, 0.15, mats.stoneDark, 0, 20, 0);
  birds.push({ mesh: b, r: rand(20, 55), h: rand(18, 35), speed: rand(0.3, 0.7), phase: rand(0, 6) });
}

/* —— lighting day cycle —— */
const hemi = new THREE.HemisphereLight(0xb8d0e8, 0x3a2a18, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.35);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.0003;
scene.add(sun);
const amb = new THREE.AmbientLight(0x405060, 0.25);
scene.add(amb);
const moon = new THREE.DirectionalLight(0x8899cc, 0.15);
moon.position.set(-30, 40, -20);
scene.add(moon);

/* —— sky dome subtle —— */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(200, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x6a90b8) },
      bottomColor: { value: new THREE.Color(0xc8b090) },
      offset: { value: 8 },
      exponent: { value: 0.6 },
      timeOfDay: { value: 0.25 }
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 topColor, bottomColor;
      uniform float offset, exponent, timeOfDay;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld + vec3(0., offset, 0.)).y;
        float f = max(pow(max(h, 0.), exponent), 0.);
        vec3 day = mix(bottomColor, topColor, f);
        vec3 night = mix(vec3(0.02,0.03,0.08), vec3(0.05,0.08,0.18), f);
        vec3 col = mix(night, day, timeOfDay);
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(sky);

/* —— camera tour —— */
const chapters = [
  { t: 0,   label: 'Dawn Gate', line: 'Mist lifts from the outer gate…', look: 'gate' },
  { t: 12,  label: 'Market Square', line: 'Vendors arrange fruit and cloth beneath awnings.', look: 'market' },
  { t: 26,  label: 'Workshop Lane', line: 'The forge wakes — hammer, spark, and soot.', look: 'workshop' },
  { t: 40,  label: 'Homes of Aurelspire', line: 'Timbered houses lean into the morning light.', look: 'homes' },
  { t: 54,  label: 'The Wall', line: 'Sentinels watch the hills beyond the crenels.', look: 'wall' },
  { t: 68,  label: 'Cathedral Spire', line: 'Gold catches the sun — a city held in prayer.', look: 'keep' },
  { t: 84,  label: 'Golden Hour', line: 'Lanterns kindle as day folds into dusk.', look: 'dusk' },
  { t: 100, label: 'Night Vigil', line: 'Aurelspire breathes under starlit banners.', look: 'night' }
];
const TOUR_LEN = 118;

function camPath(t) {
  // t in [0, TOUR_LEN]
  const u = t / TOUR_LEN;
  // piecewise cinematic path
  const pts = [
    { p: new THREE.Vector3(72, 8, 4),   l: new THREE.Vector3(62, 5, 0) },      // gate approach
    { p: new THREE.Vector3(48, 6, 2),   l: new THREE.Vector3(30, 3, 0) },
    { p: new THREE.Vector3(18, 5, 10),  l: new THREE.Vector3(0, 2, 0) },       // market
    { p: new THREE.Vector3(4, 4.5, 14), l: new THREE.Vector3(0, 2, 0) },
    { p: new THREE.Vector3(-8, 5, 28),  l: new THREE.Vector3(-12, 2, 32) },    // workshop ring
    { p: new THREE.Vector3(-22, 4.5, 36), l: new THREE.Vector3(-20, 2, 30) },
    { p: new THREE.Vector3(-35, 7, 15), l: new THREE.Vector3(-25, 3, 10) },    // homes
    { p: new THREE.Vector3(-50, 12, 5), l: new THREE.Vector3(-62, 6, 0) },     // wall
    { p: new THREE.Vector3(-40, 18, -20), l: new THREE.Vector3(-18, 20, -8) }, // keep rise
    { p: new THREE.Vector3(-8, 28, -25), l: new THREE.Vector3(-18, 22, -8) },  // memorable: spire golden
    { p: new THREE.Vector3(20, 22, -40), l: new THREE.Vector3(0, 8, 0) },      // dusk overlook
    { p: new THREE.Vector3(55, 16, -10), l: new THREE.Vector3(10, 6, 0) },     // night sweep
    { p: new THREE.Vector3(70, 10, 8),  l: new THREE.Vector3(40, 5, 0) }       // loop toward gate
  ];
  const n = pts.length - 1;
  const f = u * n;
  const i = Math.min(Math.floor(f), n - 1);
  const s = f - i;
  // smoothstep
  const e = s * s * (3 - 2 * s);
  const p = pts[i].p.clone().lerp(pts[i+1].p, e);
  const l = pts[i].l.clone().lerp(pts[i+1].l, e);
  // gentle sway
  p.y += Math.sin(t * 0.35) * 0.35;
  p.x += Math.sin(t * 0.21) * 0.4;
  return { p, l };
}

/* —— interaction (optional, experience autoplays) —— */
let userYaw = 0, userPitch = 0, userZoom = 0;
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; lx = e.clientX; ly = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', e => {
  dragging = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  userYaw += (e.clientX - lx) * 0.003;
  userPitch += (e.clientY - ly) * 0.002;
  userPitch = Math.max(-0.4, Math.min(0.4, userPitch));
  lx = e.clientX; ly = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  userZoom += e.deltaY * 0.004;
  userZoom = Math.max(-8, Math.min(12, userZoom));
}, { passive: true });

/* —— UI —— */
const titleEl = document.getElementById('title');
const chEl = document.getElementById('chapter');
const chLabel = document.getElementById('chLabel');
const chLine = document.getElementById('chLine');
const prog = document.getElementById('prog');
let currentChapter = -1;

function setChapter(idx) {
  if (idx === currentChapter) return;
  currentChapter = idx;
  chEl.classList.remove('visible');
  setTimeout(() => {
    chLabel.textContent = chapters[idx].label;
    chLine.textContent = chapters[idx].line;
    chEl.classList.add('visible');
  }, 400);
}

setTimeout(() => titleEl.classList.add('visible'), 600);
setTimeout(() => titleEl.classList.remove('visible'), 5200);

/* —— animate —— */
const clock = new THREE.Clock();
let tourT = 0;
let pausedLinger = 0;

function dayFactor(t) {
  // 0 night … 1 day; memorable golden hour around keep
  const u = (t % TOUR_LEN) / TOUR_LEN;
  if (u < 0.08) return THREE.MathUtils.smoothstep(u, 0, 0.08) * 0.55;
  if (u < 0.55) return 0.55 + (u - 0.08) / 0.47 * 0.45;
  if (u < 0.72) return 1.0; // bright for spire moment
  if (u < 0.88) return 1.0 - (u - 0.72) / 0.16 * 0.75;
  return 0.25 * (1 - (u - 0.88) / 0.12);
}

function updateMovers(t) {
  for (const m of movers) {
    const path = m.path;
    let x, z, ang;
    if (path.type === 'circle') {
      const a = m.phase + t * path.speed;
      x = Math.cos(a) * path.r;
      z = Math.sin(a) * path.r;
      ang = a + Math.PI / 2;
    } else {
      const u = (Math.sin(m.phase + t * path.speed) + 1) * 0.5;
      const d = u * path.len;
      x = Math.cos(path.angle) * d;
      z = Math.sin(path.angle) * d;
      ang = path.angle + (Math.cos(m.phase + t * path.speed) > 0 ? 0 : Math.PI);
    }
    m.mesh.position.set(x, m.cart ? 0 : Math.abs(Math.sin(t * 4 + m.bob)) * 0.06, z);
    m.mesh.rotation.y = -ang + Math.PI / 2;
  }
  for (const b of birds) {
    const a = b.phase + t * b.speed;
    b.mesh.position.set(Math.cos(a) * b.r, b.h + Math.sin(t * 2 + b.phase) * 1.5, Math.sin(a) * b.r);
    b.mesh.rotation.y = -a;
    b.mesh.rotation.z = Math.sin(t * 8 + b.phase) * 0.4;
  }
  for (const s of smokePuffs) {
    s.mesh.position.y = s.baseY + Math.sin(t * s.speed + s.phase) * 0.4 + ((t * s.speed * 0.3) % 1.5);
    s.mesh.scale.setScalar(0.8 + (Math.sin(t + s.phase) * 0.5 + 0.5) * 0.8);
    s.mesh.material.opacity = 0.22 * (1 - ((t * s.speed * 0.3) % 1.5) / 1.5);
  }
  for (const b of banners) {
    b.mesh.rotation.z = Math.sin(t * 1.8 + b.phase) * b.amp;
    b.mesh.rotation.x = Math.sin(t * 1.2 + b.phase) * b.amp * 0.5;
  }
  for (const tr of torches) {
    tr.mesh.scale.y = 0.85 + Math.sin(t * 12 + tr.phase) * 0.25;
    tr.mesh.material.opacity = 0.8;
  }
}

function updateDay(df) {
  sun.intensity = 0.15 + df * 1.25;
  hemi.intensity = 0.2 + df * 0.45;
  amb.intensity = 0.12 + df * 0.2;
  moon.intensity = 0.35 * (1 - df);
  sun.color.setHSL(0.1, 0.35, 0.85 + (1 - df) * 0.05);
  // golden hour boost near keep chapter
  const warm = df > 0.7 ? (df - 0.7) / 0.3 : 0;
  sun.color.lerp(new THREE.Color(0xffb060), warm * 0.55);
  renderer.toneMappingExposure = 0.85 + df * 0.35 + warm * 0.25;
  bloom.strength = 0.22 + (1 - df) * 0.45 + warm * 0.55;
  sky.material.uniforms.timeOfDay.value = df;
  const fogCol = new THREE.Color().setHSL(0.58, 0.18, 0.15 + df * 0.35);
  fogCol.lerp(new THREE.Color(0xc48a40), warm * 0.4);
  scene.fog.color.copy(fogCol);
  scene.background.copy(fogCol);
  for (const L of lightsDyn) {
    const flick = L.flicker ? 0.75 + Math.sin(performance.now() * 0.012 + L.base * 10) * 0.25 : 1;
    L.light.intensity = L.base * flick * (0.35 + (1 - df) * 1.4);
  }
  keepLight.intensity = 0.6 + warm * 2.2 + (1 - df) * 0.8;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (pausedLinger > 0) {
    pausedLinger -= dt;
  } else {
    tourT += dt;
  }
  const t = tourT % TOUR_LEN;

  // chapter UI
  let chIdx = 0;
  for (let i = 0; i < chapters.length; i++) {
    if (t >= chapters[i].t) chIdx = i;
  }
  setChapter(chIdx);
  prog.style.width = `${(t / TOUR_LEN) * 100}%`;

  const df = dayFactor(t);
  updateDay(df);
  updateMovers(tourT);

  // memorable moment: when near keep overlook, intensify gold on spire
  if (t > 68 && t < 86) {
    mats.gold.emissiveIntensity = 0.3 + Math.sin(tourT * 2) * 0.15 + (t - 68) / 18 * 0.6;
    cross.scale.setScalar(1 + Math.sin(tourT * 3) * 0.05);
  } else {
    mats.gold.emissiveIntensity = 0.15;
  }

  fountainWater.position.y = 0.55 + Math.sin(tourT * 2) * 0.03;

  const { p, l } = camPath(t);
  // apply mild user look offset
  const look = l.clone();
  const right = new THREE.Vector3().subVectors(p, l).cross(new THREE.Vector3(0,1,0)).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  look.addScaledVector(right, userYaw * 8);
  look.y += userPitch * 10;
  const camPos = p.clone();
  camPos.addScaledVector(new THREE.Vector3().subVectors(p, l).normalize(), userZoom);

  camera.position.lerp(camPos, 0.08);
  const curLook = new THREE.Vector3();
  camera.getWorldDirection(curLook);
  const targetQuat = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().lookAt(camera.position, look, up)
  );
  camera.quaternion.slerp(targetQuat, 0.06);

  // decay user input slowly so tour resumes primacy
  userYaw *= 0.985;
  userPitch *= 0.985;
  userZoom *= 0.992;

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
