<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infinite Maze — Cinematic Journey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #04060c;
    font-family: 'JetBrains Mono', monospace;
    color: #c8d0e0;
  }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 1.4rem 1.6rem; z-index: 10;
  }
  .top {
    display: flex; justify-content: space-between; align-items: flex-start;
    opacity: 0; animation: fadeIn 2.4s ease 0.6s forwards;
  }
  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 600; letter-spacing: 0.08em;
    color: #e8ecf4; text-shadow: 0 2px 24px rgba(0,0,0,0.7);
  }
  .brand span { display: block; font-size: 0.42em; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.28em; text-transform: uppercase; color: #7a8799; margin-top: 0.35rem; font-weight: 400; }
  .region {
    text-align: right; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: #9aa6ba; text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  }
  .region .name {
    font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; letter-spacing: 0.06em;
    color: #f0f3fa; display: block; margin-bottom: 0.25rem; transition: opacity 0.8s ease;
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    opacity: 0; animation: fadeIn 2s ease 1.4s forwards;
  }
  .hint {
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(154,166,186,0.55); max-width: 22rem; line-height: 1.6;
  }
  .meter {
    display: flex; gap: 0.5rem; align-items: center;
    font-size: 0.62rem; letter-spacing: 0.16em; color: #7a8799;
  }
  .meter .bar {
    width: 72px; height: 2px; background: rgba(255,255,255,0.08);
    border-radius: 1px; overflow: hidden;
  }
  .meter .fill {
    height: 100%; width: 0%;     background: linear-gradient(90deg, #6a8cff, #9ec5ff);
    transition: width 0.4s ease;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;

  #reveal {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

  }
  #reveal.show { opacity: 1; }
  #reveal .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    letter-spacing: 0.12em; color: #f4f6fb;

  #reveal .sub {
    display: block; font-family: 'JetBrains Mono', monospace;

  .controls {
    pointer-events: auto; display: flex; gap: 0.4rem;
  }
  button {
    pointer-events: auto; background: rgba(12,16,28,0.55);
    border: 1px solid rgba(180,190,210,0.18);
    color: #a8b4c8; font-family: inherit; font-size: 0.58rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0.45rem 0.7rem; cursor: pointer; backdrop-filter: blur(8px);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  button:hover { background: rgba(30,40,60,0.75); color: #e8ecf4; border-color: rgba(200,210,230,0.35); }
  button.active { color: #9ec5ff; border-color: rgba(110,160,255,0.45); }
  @keyframes fadeIn { to { opacity: 1; } }
  #boot {
    position: fixed; inset: 0; z-index: 20; background: #04060c;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.6s ease;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot p {
    font-family: 'Cormorant Garamond', serif; font-size: 1.5rem;
    letter-spacing: 0.2em; color: #c8d0e0;

</style>

<body>
<div id="boot"><p>Entering the labyrinth…</p></div>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="reveal"><div class="title">Welcome<div class="sub">the path unfolds</div></div></div>
<div id="hud">
  <div class="top">
    <div class="brand">AETHER MAZE<span>endless corridors</span></div>
    <div class="region"><span class="name" id="regionName">Obsidian Threshold</span><span id="regionMeta">sector 01 · dusk</span></div>
  </div>
  <div class="bottom">
    <div class="hint">Journey begins on its own. Optional: pause · speed · look.</div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.7rem;">
      <div class="controls">
        <button id="btnPause" type="button">Pause</button>
        <button id="btnSpeed" type="button">Pace</button>
        <button id="btnLook" type="button">Drift look</button>
      </div>
      <div class="meter"><span>DEPTH</span><div class="bar"><div class="fill" id="depthFill"></div></div><span id="depthNum">0</span></div>
    </div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const CELL = 4;
const WALL_H = 3.2;
const GEN_AHEAD = 28;
const CULL_BEHIND = 18;

const THEMES = [
  {
    id: 'obsidian',
    name: 'Obsidian Threshold',
    meta: 'sector 01 · dusk',
    wall: 0x1a1e2a, floor: 0x0c0e16, ceil: 0x10141e,
    accent: 0x4a6cff, fog: 0x060810, fogNear: 8, fogFar: 42,
    emissive: 0x2a4080, light: 0x6a8cff, ambient: 0x1a2030,
    landmark: 'arch', reveal: 'Threshold of Night'
  },
  {
    id: 'verdigris',
    name: 'Verdigris Cloister',
    meta: 'sector 02 · rainlight',
    wall: 0x1c2a28, floor: 0x0e1614, ceil: 0x14201c,
    accent: 0x3dcbb8, fog: 0x081210, fogNear: 10, fogFar: 46,
    emissive: 0x1a5a4a, light: 0x5ecfba, ambient: 0x152820,
    landmark: 'garden', reveal: 'Cloister of Green Glass'
  },
  {
    id: 'ember',
    name: 'Ember Catacombs',
    meta: 'sector 03 · afterglow',
    wall: 0x2a1814, floor: 0x140c0a, ceil: 0x1c1010,
    accent: 0xff6a3d, fog: 0x100808, fogNear: 7, fogFar: 38,
    emissive: 0x802010, light: 0xff8a50, ambient: 0x281810,
    landmark: 'brazier', reveal: 'Hall of Living Embers'
  },
  {
    id: 'lunar',
    name: 'Lunar Atrium',
    meta: 'sector 04 · pale hour',
    wall: 0x222838, floor: 0x10141c, ceil: 0x181e2a,
    accent: 0xc8d8ff, fog: 0x0a0c14, fogNear: 12, fogFar: 52,
    emissive: 0x405080, light: 0xd0e0ff, ambient: 0x202838,
    landmark: 'moon', reveal: 'Atrium of Pale Light'
  },
  {
    id: 'amber',
    name: 'Amber Library',
    meta: 'sector 05 · hush',
    wall: 0x2a2218, floor: 0x14100c, ceil: 0x1c1810,
    accent: 0xe8b060, fog: 0x0e0a06, fogNear: 9, fogFar: 40,
    emissive: 0x805020, light: 0xffc878, ambient: 0x282018,
    landmark: 'books', reveal: 'Stacks Without End'
  },
  {
    id: 'void',
    name: 'Void Spire',
    meta: 'sector 06 · silence',
    wall: 0x12141c, floor: 0x080a10, ceil: 0x0c0e16,
    accent: 0xa060ff, fog: 0x04050a, fogNear: 6, fogFar: 36,
    emissive: 0x402080, light: 0xb888ff, ambient: 0x141020,
    landmark: 'spire', reveal: 'Spire Into Nothing'
  }
];

function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(x, z) {
  let h = (x * 374761393 + z * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return (h ^ (h >>> 16)) >>> 0;
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060810);
scene.fog = new THREE.Fog(0x060810, 8, 42);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.08, 120);
camera.position.set(CELL * 0.5, 1.55, CELL * 0.5);

const amb = new THREE.AmbientLight(0x1a2030, 0.55);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0x304060, 0x101018, 0.35);
scene.add(hemi);
const key = new THREE.PointLight(0x6a8cff, 1.4, 22, 1.6);
key.position.set(0, 2.4, 0);
key.castShadow = true;
key.shadow.mapSize.set(512, 512);
key.shadow.camera.near = 0.2;
key.shadow.camera.far = 24;
scene.add(key);
const fill = new THREE.PointLight(0xffaa88, 0.35, 14, 2);
fill.position.set(0, 1.2, 0);
scene.add(fill);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.55, 0.82);
composer.addPass(bloom);

const ChromaticShader = {
  uniforms: {
    tDiffuse: { value: null },
    amount: { value: 0.0018 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float amount; varying vec2 vUv;
    void main(){
      vec2 off = (vUv - 0.5) * amount;
      float r = texture2D(tDiffuse, vUv + off).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - off).b;
      gl_FragColor = vec4(r,g,b,1.0);
    }
  `
};
composer.addPass(new ShaderPass(ChromaticShader));

const mazeRoot = new THREE.Group();
scene.add(mazeRoot);

const matCache = new Map();
function themeMats(theme) {
  const k = theme.id;
  if (matCache.has(k)) return matCache.get(k);
  const wall = new THREE.MeshStandardMaterial({
    color: theme.wall, roughness: 0.78, metalness: 0.12,
    flatShading: false
  });
  const floor = new THREE.MeshStandardMaterial({
    color: theme.floor, roughness: 0.9, metalness: 0.05
  });
  const ceil = new THREE.MeshStandardMaterial({
    color: theme.ceil, roughness: 0.85, metalness: 0.08
  });
  const accent = new THREE.MeshStandardMaterial({
    color: theme.accent, emissive: theme.emissive, emissiveIntensity: 0.85,
    roughness: 0.35, metalness: 0.4
  });
  const trim = new THREE.MeshStandardMaterial({
    color: 0x8899aa, roughness: theme.emissive, emissiveIntensity: 0.25,
    roughness: 0.4, metalness: 0.55
  });
  const pack = { wall, floor, ceil, accent, trim };
  matCache.set(k, pack);
  return pack;
}

const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, 0.28);
const floorGeo = new THREE.BoxGeometry(CELL, 0.12, CELL);
const ceilGeo = new THREE.BoxGeometry(CELL, 0.1, CELL);
const pillarGeo = new THREE.CylinderGeometry(0.18, 0.22, WALL_H, 8);
const torchGeo = new THREE.SphereGeometry(0.12, 10, 10);
const archRingGeo = new THREE.TorusGeometry(1.1, 0.08, 8, 24, Math.PI);
const crystalGeo = new THREE.OctahedronGeometry(0.35, 0);
const bookGeo = new THREE.BoxGeometry(0.35, 0.5, 0.12);

const cells = new Map();
const segments = [];
let path = [];
let pathIndex = 0;
let themeIndex = 0;
let cellsAlongTheme = 0;
let themeLength = 14;
let depth = 0;
let paused = false;
let speedMul = 1;
let driftLook = true;
let revealTimer = 0;

function keyOf(x, z) { return `${x},${z}`; }

function themeAtDepth(d) {
  return THEMES[Math.floor(d / 16) % THEMES.length];
}

function openDirs(x, z, prefer) {
  const dirs = [
    { dx: 0, dz: -1, name: 'n' },
    { dx: 1, dz: 0, name: 'e' },
    { dx: 0, dz: 1, name: 's' },
    { dx: -1, dz: 0, name: 'w' }
  ];
  const rng = mulberry32(hash2(x * 17 + 3, z * 31 + 7) ^ (depth * 997));
  const scored = dirs.map(d => {
    const nx = x + d.dx, nz = z + d.dz;
    const exists = cells.has(keyOf(nx, nz));
    let score = rng();
    if (prefer && prefer.dx === d.dx && prefer.dz === d.dz) score += 1.4;
    if (!exists) score += 0.6;
    if (exists && cells.get(keyOf(nx, nz)).blocked) score -= 2;
    return { ...d, score, nx, nz };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored;
}

function ensureCell(x, z, theme, opts = {}) {
  const k = keyOf(x, z);
  if (cells.has(k)) return cells.get(k);
  const group = new THREE.Group();
  group.position.set(x * CELL, 0, z * CELL);
  const mats = themeMats(theme);
  const floor = new THREE.Mesh(floorGeo, mats.floor);
  floor.position.y = 0;
  floor.receiveShadow = true;
  group.add(floor);
  const ceil = new THREE.Mesh(ceilGeo, mats.ceil);
  ceil.position.y = WALL_H;
  group.add(ceil);

  const walls = { n: true, e: true, s: true, w: true };
  if (opts.open) {
    for (const d of opts.open) walls[d] = false;
  }

  const cell = { x, z, theme, group, walls, meshes: [], lights: [], landmark: null, blocked: false };
  cells.set(k, cell);
  mazeRoot.add(group);
  rebuildWalls(cell);
  decorateCell(cell, opts);
  return cell;
}

function rebuildWalls(cell) {
  for (const m of cell.meshes) {
    cell.group.remove(m);
    if (m.geometry && m.geometry !== wallGeo && m.geometry !== pillarGeo) {
      /* shared geos kept */
    }
  }
  cell.meshes = [];
  const mats = themeMats(cell.theme);
  const addWall = (dir) => {
    const w = new THREE.Mesh(wallGeo, mats.wall);
    w.castShadow = true;
    w.receiveShadow = true;
    if (dir === 'n') { w.position.set(0, WALL_H / 2, -CELL / 2); }
    if (dir === 's') { w.position.set(0, WALL_H / 2, CELL / 2); }
    if (dir === 'e') { w.position.set(CELL / 2, WALL_H / 2, 0); w.rotation.y = Math.PI / 2; }
    if (dir === 'w') { w.position.set(-CELL / 2, WALL_H / 2, 0); w.rotation.y = Math.PI / 2; }
    cell.group.add(w);
    cell.meshes.push(w);

    const trim = new THREE.Mesh(new THREE.BoxGeometry(CELL * 0.92, 0.06, 0.08), mats.trim);
    trim.position.copy(w.position);
    trim.position.y = 0.35;
    trim.rotation.copy(w.rotation);
    cell.group.add(trim);
    cell.meshes.push(trim);

    if ((cell.x + cell.z) % 3 === 0) {
      const torch = new THREE.Mesh(torchGeo, mats.accent);
      torch.position.copy(w.position);
      torch.position.y = 2.1;
      const inward = new THREE.Vector3(-w.position.x, 0, -w.position.z).normalize().multiplyScalar(0.2);
      torch.position.add(inward);
      cell.group.add(torch);
      cell.meshes.push(torch);
      const pl = new THREE.PointLight(cell.theme.light, 0.55, 7, 2);
      pl.position.copy(torch.position);
      cell.group.add(pl);
      cell.lights.push(pl);
    }
  };
  for (const d of ['n', 'e', 's', 'w']) {
    if (cell.walls[d]) addWall(d);
  }
  for (const [ox, oz] of [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]]) {
    const p = new THREE.Mesh(pillarGeo, mats.wall);
    p.position.set(ox * CELL * 0.92, WALL_H / 2, oz * CELL * 0.92);
    p.castShadow = true;
    cell.group.add(p);
    cell.meshes.push(p);
  }
}

function decorateCell(cell, opts) {
  const mats = themeMats(cell.theme);
  const rng = mulberry32(hash2(cell.x, cell.z) ^ 0xabc);
  if (opts.landmark || (opts.isReveal && cell.theme.landmark)) {
    const kind = cell.theme.landmark;
    const g = new THREE.Group();
    if (kind === 'arch') {
      const ring = new THREE.Mesh(archRingGeo, mats.accent);
      ring.position.set(0, 1.6, 0);
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.4, 0.3), mats.trim);
      base.position.set(-1.1, 0.7, 0);
      g.add(base.clone());
      const b2 = base.clone(); b2.position.x = 1.1; g.add(b2);
    } else if (kind === 'garden') {
      for (let i = 0; i < 5; i++) {
        const c = new THREE.Mesh(crystalGeo, mats.accent);
        c.position.set((rng() - 0.5) * 1.6, 0.4 + rng() * 0.3, (rng() - 0.5) * 1.6);
        c.rotation.set(rng(), rng(), rng());
        c.scale.setScalar(0.6 + rng() * 0.8);
        g.add(c);
      }
    } else if (kind === 'brazier') {
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.35, 0.35, 10), mats.trim);
      bowl.position.y = 0.5;
      g.add(bowl);
      const flame = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.7, 8), mats.accent);
      flame.position.y = 1.05;
      g.add(flame);
      const pl = new THREE.PointLight(cell.theme.light, 1.8, 12, 1.5);
      pl.position.set(0, 1.4, 0);
      g.add(pl);
      cell.lights.push(pl);
    } else if (kind === 'moon') {
      const moon = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 24), mats.accent);
      moon.position.set(0, 2.2, 0);
      g.add(moon);
      const pl = new THREE.PointLight(0xd0e0ff, 1.2, 16, 1.4);
      pl.position.set(0, 2.2, 0);
      g.add(pl);
      cell.lights.push(pl);
    } else if (kind === 'books') {
      for (let i = 0; i < 8; i++) {
        const b = new THREE.Mesh(bookGeo, i % 2 ? mats.accent : mats.trim);
        b.position.set(-1.4 + (i % 4) * 0.4, 0.9 + Math.floor(i / 4) * 0.6, -1.5);
        b.rotation.y = (rng() - 0.5) * 0.2;
        g.add(b);
      }
      const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.9, 8), mats.wall);
      pedestal.position.set(0, 0.45, 0.4);
      g.add(pedestal);
      const tome = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.4), mats.accent);
      tome.position.set(0, 0.96, 0.4);
      g.add(tome);
    } else if (kind === 'spire') {
      const spire = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.6, 6), mats.accent);
      spire.position.y = 1.5;
      g.add(spire);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.05, 6, 24), mats.trim);
      ring.position.y = 1.8;
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
      const pl = new THREE.PointLight(cell.theme.light, 1.5, 14, 1.5);
      pl.position.set(0, 2.5, 0);
      g.add(pl);
      cell.lights.push(pl);
    }
    cell.group.add(g);
    cell.landmark = g;
  } else if (rng() > 0.72) {
    const ornament = new THREE.Mesh(crystalGeo, mats.trim);
    ornament.position.set((rng() - 0.5) * 1.2, 0.35, (rng() - 0.5) * 1.2);
    ornament.scale.setScalar(0.35 + rng() * 0.3);
    cell.group.add(ornament);
    cell.meshes.push(ornament);
  }

  if (rng() > 0.55) {
    const stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(CELL * 0.35, WALL_H * 0.7),
      mats.accent
    );
    stripe.material = mats.accent.clone();
    stripe.material.transparent = true;
    stripe.material.opacity = 0.15;
    stripe.material.emissiveIntensity = 0.3;
    const side = Math.floor(rng() * 4);
    if (side === 0 && cell.walls.n) { stripe.position.set(0, WALL_H / 2, -CELL / 2 + 0.16); }
    else if (side === 1 && cell.walls.s) { stripe.position.set(0, WALL_H / 2, CELL / 2 - 0.16); stripe.rotation.y = Math.PI; }
    else if (side === 2 && cell.walls.e) { stripe.position.set(CELL / 2 - 0.16, WALL_H / 2, 0); stripe.rotation.y = -Math.PI / 2; }
    else if (side === 3 && cell.walls.w) { stripe.position.set(-CELL / 2 + 0.16, WALL_H / 2, 0); stripe.rotation.y = Math.PI / 2; }
    else return;
    cell.group.add(stripe);
    cell.meshes.push(stripe);
  }
}

function connect(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  if (dx === 1) { a.walls.e = false; b.walls.w = false; }
  else if (dx === -1) { a.walls.w = false; b.walls.e = false; }
  else if (dz === 1) { a.walls.s = false; b.walls.n = false; }
  else if (dz === -1) { a.walls.n = false; b.walls.s = false; }
  rebuildWalls(a);
  rebuildWalls(b);
}

function dirBetween(a, b) {
  return { dx: Math.sign(b.x - a.x), dz: Math.sign(b.z - a.z) };
}

function generateAhead() {
  while (path.length - pathIndex < GEN_AHEAD) {
    const last = path[path.length - 1];
    const prev = path.length > 1 ? path[path.length - 2] : null;
    const prefer = prev ? dirBetween(prev, last) : { dx: 0, dz: -1 };
    const candidates = openDirs(last.x, last.z, prefer);

    let chosen = null;
    for (const c of candidates) {
      const k = keyOf(c.nx, c.nz);
      if (cells.has(k)) {
        const existing = cells.get(k);
        const onPath = path.some(p => p.x === c.nx && p.z === c.nz);
        if (onPath && path.length > 4) continue;
        chosen = c;
        break;
      } else {
        chosen = c;
        break;
      }
    }
    if (!chosen) {
      chosen = candidates[0];
    }

    cellsAlongTheme++;
    let isReveal = false;
    if (cellsAlongTheme >= themeLength) {
      themeIndex = (themeIndex + 1) % THEMES.length;
      cellsAlongTheme = 0;
      themeLength = 12 + Math.floor(mulberry32(themeIndex * 99 + depth)() * 10);
      isReveal = true;
    }
    const theme = THEMES[themeIndex];
    const next = ensureCell(chosen.nx, chosen.nz, theme, {
      isReveal,
      landmark: isReveal
    });
    connect(last, next);

    if (!isReveal && mulberry32(hash2(next.x, next.z))() > 0.82) {
      const side = openDirs(next.x, next.z, null).find(d =>
        !(d.nx === last.x && d.nz === last.z) && !cells.has(keyOf(d.nx, d.nz))
      );
      if (side) {
        const spur = ensureCell(side.nx, side.nz, theme, {});
        connect(next, spur);
        spur.blocked = true;
      }
    }

    path.push(next);
    depth++;
  }
}

function cullBehind() {
  if (pathIndex < CULL_BEHIND) return;
  const keepFrom = pathIndex - CULL_BEHIND;
  for (let i = 0; i < keepFrom; i++) {
    const c = path[i];
    if (!c || c._culled) continue;
    const stillNear = path.slice(pathIndex - 2, pathIndex + GEN_AHEAD).some(
      p => p && Math.abs(p.x - c.x) + Math.abs(p.z - c.z) <= 2
    );
    if (stillNear) continue;
    mazeRoot.remove(c.group);
    cells.delete(keyOf(c.x, c.z));
    c._culled = true;
  }
}

function applyThemeFog(theme, t = 1) {
  scene.background.lerp(new THREE.Color(theme.fog), t);
  scene.fog.color.lerp(new THREE.Color(theme.fog), t);
  scene.fog.near = THREE.MathUtils.lerp(scene.fog.near, theme.fogNear, t);
  scene.fog.far = THREE.MathUtils.lerp(scene.fog.far, theme.fogFar, t);
  amb.color.lerp(new THREE.Color(theme.ambient), t);
  key.color.lerp(new THREE.Color(theme.light), t);
  fill.color.lerp(new THREE.Color(theme.accent), t * 0.5);
}

const startTheme = THEMES[0];
const start = ensureCell(0, 0, startTheme, { open: ['n'], landmark: true });
path = [start];
ensureCell(0, -1, startTheme, {});
connect(start, cells.get(keyOf(0, -1)));
path.push(cells.get(keyOf(0, -1)));
generateAhead();

const camPos = new THREE.Vector3(CELL * 0.5, 1.55, CELL * 0.5);
const camLook = new THREE.Vector3(CELL * 0.5, 1.45, -CELL);
const camTargetLook = new THREE.Vector3();
let yaw = 0;
let targetYaw = 0;
let pitch = 0;
let speed = 0;
let targetSpeed = 1.55;
let bobPhase = 0;
let turnCooldown = 0;
let currentRegion = startTheme;
let lastRevealTheme = null;

function cellCenter(c) {
  return new THREE.Vector3(c.x * CELL + CELL * 0.5, 1.55, c.z * CELL + CELL * 0.5);
}

function yawToDir(y) {
  return new THREE.Vector3(Math.sin(y), 0, -Math.cos(y));
}

function updateRegionUI(theme, forceReveal) {
  document.getElementById('regionName').textContent = theme.name;
  document.getElementById('regionMeta').textContent = theme.meta;
  if (forceReveal || (theme !== lastRevealTheme && theme.reveal)) {
    lastRevealTheme = theme;
    const el = document.getElementById('reveal');
    el.querySelector('.title').innerHTML = `${theme.reveal}<span class="sub">${theme.name}</span>`;
    el.classList.add('show');
    revealTimer = 3.2;
  }
}

updateRegionUI(startTheme, true);

const clock = new THREE.Clock();
let smoothT = 0;

function navigate(dt) {
  if (paused) {
    speed = THREE.MathUtils.damp(speed, 0, 4, dt);
  } else {
    targetSpeed = 1.35 * speedMul + 0.25 * Math.sin(smoothT * 0.15);
    speed = THREE.MathUtils.damp(speed, targetSpeed, 1.8, dt);
  }

  generateAhead();
  cullBehind();

  if (pathIndex >= path.length - 2) return;

  const a = path[pathIndex];
  const b = path[pathIndex + 1];
  const from = cellCenter(a);
  const to = cellCenter(b);
  const seg = to.clone().sub(from);
  const segLen = seg.length();
  const dir = seg.clone().normalize();

  targetYaw = Math.atan2(dir.x, -dir.z);
  let dy = targetYaw - yaw;
  while (dy > Math.PI) dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;

  const turnSharp = Math.abs(dy) > 0.35;
  if (turnSharp) {
    speed = THREE.MathUtils.damp(speed, targetSpeed * 0.45, 3, dt);
    yaw = THREE.MathUtils.damp(yaw, yaw + dy, 3.2, dt);
  } else {
    yaw = THREE.MathUtils.damp(yaw, yaw + dy, 5.5, dt);
  }

  const forward = yawToDir(yaw);
  camPos.addScaledVector(forward, speed * dt);

  const toB = to.clone().sub(camPos);
  toB.y = 0;
  if (toB.dot(dir) < 0.15 || camPos.distanceTo(to) < 0.55) {
    pathIndex++;
    depth = Math.max(depth, pathIndex);
    const theme = path[pathIndex]?.theme || currentRegion;
    if (theme !== currentRegion) {
      currentRegion = theme;
      updateRegionUI(theme, true);
    }
  }

  bobPhase += speed * dt * 2.2;
  const bob = Math.sin(bobPhase) * 0.025 * (speed / 1.5);
  const sway = Math.sin(bobPhase * 0.5) * 0.012;

  camTargetLook.copy(camPos).add(forward.clone().multiplyScalar(4));
  camTargetLook.y = 1.45 + bob * 0.3;

  if (driftLook) {
    pitch = Math.sin(smoothT * 0.35) * 0.04 + Math.sin(smoothT * 0.11) * 0.02;
    camTargetLook.y += pitch * 2;
    camTargetLook.x += Math.sin(smoothT * 0.22) * 0.15;
  }

  camera.position.set(camPos.x + sway, camPos.y + bob, camPos.z);
  camera.lookAt(camTargetLook);

  key.position.set(camPos.x, 2.35, camPos.z);
  fill.position.set(camPos.x - forward.x, 1.3, camPos.z - forward.z);

  applyThemeFog(currentRegion, 1 - Math.pow(0.001, dt));

  document.getElementById('depthNum').textContent = String(pathIndex);
  document.getElementById('depthFill').style.width = `${Math.min(100, (pathIndex % 16) / 16 * 100)}%`;

  bloom.strength = 0.35 + 0.12 * Math.sin(smoothT * 0.4) + (currentRegion.id === 'void' ? 0.15 : 0);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  smoothT += dt;
  navigate(dt);

  if (revealTimer > 0) {
    revealTimer -= dt;
    if (revealTimer <= 0) document.getElementById('reveal').classList.remove('show');
  }

  for (const c of cells.values()) {
    if (c.landmark) {
      c.landmark.rotation.y += dt * 0.25;
      c.landmark.children.forEach((ch, i) => {
        if (ch.isMesh && ch.geometry === crystalGeo) {
          ch.position.y = 0.4 + Math.sin(smoothT * 1.5 + i) * 0.08;
        }
      });
    }
  }

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').classList.toggle('active', paused);
  document.getElementById('btnPause').textContent = paused ? 'Resume' : 'Pause';
});
const speeds = [1, 1.55, 2.2];
let si = 0;
document.getElementById('btnSpeed').addEventListener('click', () => {
  si = (si + 1) % speeds.length;
  speedMul = speeds[si];
  document.getElementById('btnSpeed').classList.toggle('active', si > 0);
  document.getElementById('btnSpeed').textContent = ['Pace', 'Brisk', 'Swift'][si];
});
document.getElementById('btnLook').addEventListener('click', () => {
  driftLook = !driftLook;
  document.getElementById('btnLook').classList.toggle('active', driftLook);
});

setTimeout(() => {
  document.getElementById('boot').classList.add('hide');
  animate();
}, 900);
</script>
</body>
