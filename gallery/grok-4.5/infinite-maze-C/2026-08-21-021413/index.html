<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Labyrinth</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Source+Sans+3:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050408;
      font-family: 'Source Sans 3', sans-serif;
      color: #e8e0d4;
      cursor: none;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
    }

    canvas { display: block; width: 100%; height: 100%; }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, rgba(20, 12, 8, 0.55) 0%, rgba(5, 4, 8, 0.92) 70%),
        linear-gradient(180deg, #0a0810 0%, #1a100c 100%);
      z-index: 20;
      transition: opacity 0.7s ease, visibility 0.7s;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panel {
      text-align: center;
      max-width: 440px;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(196, 160, 100, 0.25);
      background: rgba(12, 8, 10, 0.75);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(180, 120, 60, 0.04);
    }

    .panel h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.18em;
      color: #d4b896;
      text-shadow: 0 0 24px rgba(180, 130, 60, 0.35);
      margin-bottom: 0.6rem;
    }

    .panel .tagline {
      font-weight: 300;
      font-size: 0.95rem;
      color: #a89888;
      letter-spacing: 0.06em;
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }

    .controls-hint {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.45rem 1.2rem;
      text-align: left;
      font-size: 0.85rem;
      color: #b8a898;
      margin-bottom: 2rem;
      padding: 0 0.5rem;
    }

    .controls-hint kbd {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      color: #e0c8a0;
      background: rgba(60, 40, 25, 0.6);
      border: 1px solid rgba(180, 140, 80, 0.3);
      border-radius: 3px;
      padding: 0.1rem 0.45rem;
      font-size: 0.8rem;
      min-width: 2.2rem;
      text-align: center;
    }

    #start-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #1a1008;
      background: linear-gradient(180deg, #e0c090 0%, #b88850 100%);
      border: none;
      padding: 0.85rem 2.4rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 20px rgba(180, 120, 50, 0.35);
    }

    #start-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 6px 28px rgba(180, 120, 50, 0.45);
    }

    #start-btn:active { transform: translateY(1px); }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #hud.visible { opacity: 1; }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(220, 200, 160, 0.55);
    }

    #crosshair::before {
      left: 50%; top: 0; width: 1px; height: 100%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      top: 50%; left: 0; height: 1px; width: 100%;
      transform: translateY(-50%);
    }

    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
    }

    #minimap {
      position: absolute;
      bottom: 28px;
      right: 28px;
      width: 140px;
      height: 140px;
      border: 1px solid rgba(196, 160, 100, 0.35);
      background: rgba(8, 6, 10, 0.72);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      border-radius: 2px;
      overflow: hidden;
    }

    #minimap canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #stats {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: rgba(212, 184, 150, 0.7);
      line-height: 1.7;
    }

    #compass {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 52px;
      height: 52px;
    }

    #compass svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    #pause-hint {
      position: absolute;
      bottom: 28px;
      left: 28px;
      font-size: 0.75rem;
      color: rgba(168, 152, 136, 0.45);
      letter-spacing: 0.08em;
    }

    #pointer-lost {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 4, 8, 0.7);
      z-index: 15;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.15em;
      color: #d4b896;
      font-size: 1rem;
    }

    #pointer-lost.show { display: flex; }

    .fade-edge {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div id="overlay">
    <div class="panel">
      <h1>ENDLESS LABYRINTH</h1>
      <p class="tagline">An infinite stone maze with no exit — only corridors that keep unfolding beneath torchlight and fog.</p>
      <div class="controls-hint">
        <kbd>W A S D</kbd><span>Move</span>
        <kbd>Mouse</kbd><span>Look around</span>
        <kbd>Shift</kbd><span>Walk carefully</span>
        <kbd>Esc</kbd><span>Release cursor</span>
      </div>
      <button id="start-btn" type="button">Enter the Maze</button>
    </div>
  </div>

  <div id="pointer-lost">Click to continue exploring</div>

  <div id="hud">
    <div id="vignette"></div>
    <div class="fade-edge"></div>
    <div id="crosshair"></div>
    <div id="stats">
      <div>DEPTH <span id="depth-val">0</span></div>
      <div>CELLS <span id="cells-val">0</span></div>
    </div>
    <div id="compass">
      <svg viewBox="0 0 52 52" id="compass-svg">
        <circle cx="26" cy="26" r="24" fill="rgba(8,6,10,0.7)" stroke="rgba(196,160,100,0.4)" stroke-width="1"/>
        <polygon id="compass-needle" points="26,8 30,28 26,24 22,28" fill="#c87850"/>
        <text x="26" y="14" text-anchor="middle" fill="#d4b896" font-size="7" font-family="Cinzel,serif">N</text>
      </svg>
    </div>
    <div id="minimap"><canvas id="mmap" width="140" height="140"></canvas></div>
    <div id="pause-hint">ESC to pause · Click to resume</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

/* ─── Config ─────────────────────────────────────────────── */
const CELL = 4;
const WALL_H = 3.4;
const CHUNK = 11;
const VIEW_CHUNKS = 2;
const FOG_NEAR = 4;
const FOG_FAR = 28;
const MOVE_SPEED = 6.2;
const SLOW_MULT = 0.42;
const LOOK_SENS = 0.0022;
const PLAYER_R = 0.38;
const EYE_H = 1.65;

/* ─── Deterministic maze noise ────────────────────────────── */
function hash2(x, y) {
  let n = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function corridorOpen(cx, cy, axis) {
  // axis 0 = east wall of cell, 1 = north wall of cell
  const h = hash2(cx * 3 + axis * 17, cy * 5 + axis * 31);
  // Prefer connectivity: more openings, occasional dead-ends
  if ((cx + cy) % 3 === 0) return h > 0.22;
  return h > 0.38;
}

function isWallSolid(wx, wz) {
  // Grid: even cells are rooms/corridors, odd are potential walls
  const gx = Math.floor(wx);
  const gz = Math.floor(wz);
  if ((gx & 1) === 0 && (gz & 1) === 0) return false; // floor cells
  if ((gx & 1) === 1 && (gz & 1) === 1) return true;  // pillars
  if ((gx & 1) === 1 && (gz & 1) === 0) {
    // Vertical wall (separates cells east-west)
    const cellX = (gx - 1) / 2;
    const cellZ = gz / 2;
    return !corridorOpen(cellX, cellZ, 0);
  }
  // Horizontal wall (separates cells north-south)
  const cellX = gx / 2;
  const cellZ = (gz - 1) / 2;
  return !corridorOpen(cellX, cellZ, 1);
}

function worldToGrid(x, z) {
  return { gx: Math.floor(x / CELL), gz: Math.floor(z / CELL) };
}

function blockedAt(x, z) {
  const { gx, gz } = worldToGrid(x, z);
  return isWallSolid(gx, gz);
}

function collide(nx, nz) {
  const pts = [
    [nx - PLAYER_R, nz - PLAYER_R],
    [nx + PLAYER_R, nz - PLAYER_R],
    [nx - PLAYER_R, nz + PLAYER_R],
    [nx + PLAYER_R, nz + PLAYER_R],
  ];
  for (const [px, pz] of pts) {
    if (blockedAt(px, pz)) return true;
  }
  return false;
}

/* ─── Procedural textures ─────────────────────────────────── */
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

function stoneTexture() {
  const size = 256;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a342e';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 900; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const s = 1 + Math.random() * 3;
    const v = 40 + Math.random() * 50;
    ctx.fillStyle = `rgba(${v},${v - 4},${v - 10},${0.15 + Math.random() * 0.25})`;
    ctx.fillRect(x, y, s, s);
  }

  // Mortar lines
  ctx.strokeStyle = 'rgba(25, 22, 18, 0.55)';
  ctx.lineWidth = 2;
  const brickH = 32;
  for (let row = 0; row < size / brickH; row++) {
    const y = row * brickH;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y);
    ctx.stroke();
    const offset = (row % 2) * 48;
    for (let x = offset; x < size; x += 96) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + brickH);
      ctx.stroke();
    }
  }

  // Subtle moss
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `rgba(45, 70, 40, ${0.08 + Math.random() * 0.12})`;
    ctx.beginPath();
    ctx.ellipse(
      Math.random() * size,
      Math.random() * size,
      8 + Math.random() * 20,
      4 + Math.random() * 10,
      Math.random() * Math.PI,
      0, Math.PI * 2
    );
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function floorTexture() {
  const size = 256;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2a2622';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 1200; i++) {
    const v = 30 + Math.random() * 40;
    ctx.fillStyle = `rgba(${v},${v - 2},${v - 6},${0.2 + Math.random() * 0.3})`;
    ctx.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }

  // Worn path streaks
  for (let i = 0; i < 8; i++) {
    ctx.strokeStyle = `rgba(55, 48, 40, ${0.15 + Math.random() * 0.2})`;
    ctx.lineWidth = 6 + Math.random() * 10;
    ctx.beginPath();
    ctx.moveTo(Math.random() * size, 0);
    ctx.quadraticCurveTo(Math.random() * size, size / 2, Math.random() * size, size);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function ceilingTexture() {
  const size = 128;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1e1a18';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 400; i++) {
    const v = 18 + Math.random() * 25;
    ctx.fillStyle = `rgba(${v},${v},${v - 2},${0.3})`;
    ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ─── Scene setup ────────────────────────────────────────── */
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a080c);
scene.fog = new THREE.FogExp2(0x0c0a0e, 0.048);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 80);
camera.position.set(CELL * 0.5, EYE_H, CELL * 0.5);

const wallTex = stoneTexture();
wallTex.repeat.set(1, WALL_H / CELL);
const floorTex = floorTexture();
floorTex.repeat.set(1, 1);
const ceilTex = ceilingTexture();
ceilTex.repeat.set(1, 1);

const wallMat = new THREE.MeshStandardMaterial({
  map: wallTex,
  roughness: 0.92,
  metalness: 0.04,
  color: 0xc8b8a0,
});
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTex,
  roughness: 0.96,
  metalness: 0.02,
  color: 0xa89888,
});
const ceilMat = new THREE.MeshStandardMaterial({
  map: ceilTex,
  roughness: 1,
  metalness: 0,
  color: 0x888078,
});

const ambient = new THREE.AmbientLight(0x2a2835, 0.35);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x3a3548, 0x1a1208, 0.25);
scene.add(hemi);

const torch = new THREE.PointLight(0xffaa55, 2.8, 16, 1.6);
torch.castShadow = true;
torch.shadow.mapSize.set(1024, 1024);
torch.shadow.camera.near = 0.2;
torch.shadow.camera.far = 18;
torch.shadow.bias = -0.0008;
scene.add(torch);

const torchGlow = new THREE.PointLight(0xff6622, 0.6, 6, 2);
scene.add(torchGlow);

/* Dust motes */
const DUST_N = 180;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 20;
  dustPos[i * 3 + 1] = Math.random() * WALL_H;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xd4c4a0,
  size: 0.035,
  transparent: true,
  opacity: 0.45,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* ─── Chunk mesh builder ─────────────────────────────────── */
const chunks = new Map();
const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
const floorGeo = new THREE.PlaneGeometry(CELL, CELL);
const ceilGeo = new THREE.PlaneGeometry(CELL, CELL);

function chunkKey(cx, cz) {
  return `${cx},${cz}`;
}

function buildChunk(cx, cz) {
  const group = new THREE.Group();
  group.userData = { cx, cz };

  const baseX = cx * CHUNK;
  const baseZ = cz * CHUNK;

  for (let lz = 0; lz < CHUNK; lz++) {
    for (let lx = 0; lx < CHUNK; lx++) {
      const gx = baseX + lx;
      const gz = baseZ + lz;
      const wx = gx * CELL + CELL * 0.5;
      const wz = gz * CELL + CELL * 0.5;

      if (isWallSolid(gx, gz)) {
        const mesh = new THREE.Mesh(wallGeo, wallMat);
        mesh.position.set(wx, WALL_H * 0.5, wz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        // Slight height variation for pillars
        if ((gx & 1) && (gz & 1)) {
          mesh.scale.y = 1.02;
          mesh.position.y = WALL_H * 0.51;
        }
        group.add(mesh);
      } else {
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(wx, 0, wz);
        floor.receiveShadow = true;
        group.add(floor);

        const ceil = new THREE.Mesh(ceilGeo, ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.set(wx, WALL_H, wz);
        group.add(ceil);

        // Occasional wall torch sconce (decorative light pool)
        if (hash2(gx, gz) > 0.94) {
          const sconce = new THREE.PointLight(0xff9944, 0.55, 8, 2);
          sconce.position.set(wx, WALL_H * 0.72, wz);
          group.add(sconce);

          const flameGeo = new THREE.SphereGeometry(0.06, 6, 6);
          const flameMat = new THREE.MeshBasicMaterial({
            color: 0xffaa44,
            transparent: true,
            opacity: 0.7,
          });
          const flame = new THREE.Mesh(flameGeo, flameMat);
          flame.position.copy(sconce.position);
          flame.position.y += 0.08;
          group.add(flame);
        }
      }
    }
  }

  scene.add(group);
  return group;
}

function updateChunks(px, pz) {
  const { gx, gz } = worldToGrid(px, pz);
  const ccx = Math.floor(gx / CHUNK);
  const ccz = Math.floor(gz / CHUNK);
  const needed = new Set();

  for (let dz = -VIEW_CHUNKS; dz <= VIEW_CHUNKS; dz++) {
    for (let dx = -VIEW_CHUNKS; dx <= VIEW_CHUNKS; dx++) {
      const key = chunkKey(ccx + dx, ccz + dz);
      needed.add(key);
      if (!chunks.has(key)) {
        chunks.set(key, buildChunk(ccx + dx, ccz + dz));
      }
    }
  }

  for (const [key, group] of chunks) {
    if (!needed.has(key)) {
      scene.remove(group);
      group.traverse((o) => {
        if (o.isLight) o.dispose?.();
      });
      chunks.delete(key);
    }
  }
}

/* Find open spawn */
function findSpawn() {
  for (let r = 0; r < 40; r++) {
    for (let t = 0; t < 12; t++) {
      const gx = (r === 0 ? 0 : Math.round(Math.cos(t) * r)) * 2;
      const gz = (r === 0 ? 0 : Math.round(Math.sin(t) * r)) * 2;
      if (!isWallSolid(gx, gz)) {
        return { x: gx * CELL + CELL * 0.5, z: gz * CELL + CELL * 0.5 };
      }
    }
  }
  return { x: CELL * 0.5, z: CELL * 0.5 };
}

const spawn = findSpawn();
camera.position.set(spawn.x, EYE_H, spawn.z);
updateChunks(spawn.x, spawn.z);

/* ─── Controls ───────────────────────────────────────────── */
const keys = Object.create(null);
let yaw = 0;
let pitch = 0;
let pointerLocked = false;
let started = false;
let startTime = 0;
let maxDepth = 0;
let visited = new Set();

const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const pointerLost = document.getElementById('pointer-lost');
const startBtn = document.getElementById('start-btn');
const depthVal = document.getElementById('depth-val');
const cellsVal = document.getElementById('cells-val');
const compassNeedle = document.getElementById('compass-needle');
const mmap = document.getElementById('mmap');
const mctx = mmap.getContext('2d');

function lockPointer() {
  renderer.domElement.requestPointerLock();
}

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  hud.classList.add('visible');
  started = true;
  startTime = performance.now();
  lockPointer();
  initAudio();
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  if (started) {
    pointerLost.classList.toggle('show', !pointerLocked);
  }
});

pointerLost.addEventListener('click', lockPointer);
renderer.domElement.addEventListener('click', () => {
  if (started && !pointerLocked) lockPointer();
});

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  yaw -= e.movementX * LOOK_SENS;
  pitch -= e.movementY * LOOK_SENS;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
});

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Escape' && pointerLocked) {
    document.exitPointerLock();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ─── Ambient audio (procedural) ─────────────────────────── */
let audioCtx = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(audioCtx.destination);

    // Low drone
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 55;
    const g = audioCtx.createGain();
    g.gain.value = 0.35;
    osc.connect(g);
    g.connect(masterGain);
    osc.start();

    // Soft noise pad
    const bufLen = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuf;
    noise.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 280;
    const ng = audioCtx.createGain();
    ng.gain.value = 0.2;
    noise.connect(filter);
    filter.connect(ng);
    ng.connect(masterGain);
    noise.start();

    // Occasional drip
    setInterval(() => {
      if (!audioCtx || !started || !pointerLocked) return;
      if (Math.random() > 0.4) return;
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const eg = audioCtx.createGain();
      o.frequency.setValueAtTime(800 + Math.random() * 600, t);
      o.frequency.exponentialRampToValueAtTime(200, t + 0.08);
      eg.gain.setValueAtTime(0.08, t);
      eg.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(eg);
      eg.connect(masterGain);
      o.start(t);
      o.stop(t + 0.3);
    }, 2800);
  } catch (_) { /* audio optional */ }
}

function footstepTick(speed) {
  if (!audioCtx || speed < 0.5) return;
  if (!footstepTick._acc) footstepTick._acc = 0;
  footstepTick._acc += speed * 0.016;
  if (footstepTick._acc < 0.42) return;
  footstepTick._acc = 0;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const eg = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 180 + Math.random() * 80;
  o.type = 'triangle';
  o.frequency.value = 90 + Math.random() * 40;
  eg.gain.setValueAtTime(0.05, t);
  eg.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(f);
  f.connect(eg);
  eg.connect(masterGain);
  o.start(t);
  o.stop(t + 0.15);
}

/* ─── Minimap ────────────────────────────────────────────── */
function drawMinimap() {
  const R = 9;
  const { gx, gz } = worldToGrid(camera.position.x, camera.position.z);
  const scale = mmap.width / (R * 2 + 1);
  mctx.fillStyle = '#0c0a0e';
  mctx.fillRect(0, 0, mmap.width, mmap.height);

  for (let dz = -R; dz <= R; dz++) {
    for (let dx = -R; dx <= R; dx++) {
      const solid = isWallSolid(gx + dx, gz + dz);
      const px = (dx + R) * scale;
      const py = (dz + R) * scale;
      if (solid) {
        mctx.fillStyle = '#3a322c';
      } else {
        const key = `${gx + dx},${gz + dz}`;
        mctx.fillStyle = visited.has(key) ? '#2a4030' : '#1a1816';
      }
      mctx.fillRect(px, py, scale + 0.5, scale + 0.5);
    }
  }

  // Player
  const cx = mmap.width / 2;
  const cy = mmap.height / 2;
  mctx.save();
  mctx.translate(cx, cy);
  mctx.rotate(-yaw);
  mctx.fillStyle = '#e0a860';
  mctx.beginPath();
  mctx.moveTo(0, -5);
  mctx.lineTo(4, 5);
  mctx.lineTo(0, 3);
  mctx.lineTo(-4, 5);
  mctx.closePath();
  mctx.fill();
  mctx.restore();

  mctx.strokeStyle = 'rgba(196,160,100,0.3)';
  mctx.strokeRect(0.5, 0.5, mmap.width - 1, mmap.height - 1);
}

/* ─── Animation loop ─────────────────────────────────────── */
const clock = new THREE.Clock();
let bobPhase = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (started && pointerLocked) {
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const wish = new THREE.Vector3();

    if (keys['KeyW'] || keys['ArrowUp']) wish.add(forward);
    if (keys['KeyS'] || keys['ArrowDown']) wish.sub(forward);
    if (keys['KeyA'] || keys['ArrowLeft']) wish.sub(right);
    if (keys['KeyD'] || keys['ArrowRight']) wish.add(right);

    let speed = MOVE_SPEED;
    if (keys['ShiftLeft'] || keys['ShiftRight']) speed *= SLOW_MULT;

    if (wish.lengthSq() > 0) {
      wish.normalize().multiplyScalar(speed * dt);
      const px = camera.position.x;
      const pz = camera.position.z;

      if (!collide(px + wish.x, pz)) camera.position.x += wish.x;
      if (!collide(camera.position.x, pz + wish.z)) camera.position.z += wish.z;

      bobPhase += dt * speed * 1.8;
      footstepTick(speed);
    }

    const bob = Math.sin(bobPhase) * 0.035 * (wish.lengthSq() > 0 ? 1 : 0.15);
    camera.position.y = EYE_H + bob;

    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    updateChunks(camera.position.x, camera.position.z);

    const { gx, gz } = worldToGrid(camera.position.x, camera.position.z);
    visited.add(`${gx},${gz}`);
    const depth = Math.floor(Math.hypot(gx, gz));
    if (depth > maxDepth) maxDepth = depth;
    depthVal.textContent = String(maxDepth);
    cellsVal.textContent = String(visited.size);
  }

  // Torch follows player
  torch.position.set(
    camera.position.x + Math.sin(yaw) * 0.15,
    camera.position.y + 0.1,
    camera.position.z + Math.cos(yaw) * 0.15
  );
  const flicker = 2.4 + Math.sin(t * 7.3) * 0.25 + Math.sin(t * 13.1) * 0.15;
  torch.intensity = flicker;
  torchGlow.position.copy(torch.position);
  torchGlow.intensity = 0.45 + Math.sin(t * 11) * 0.12;

  // Dust around camera
  dust.position.set(camera.position.x, 0, camera.position.z);
  const dpos = dust.geometry.attributes.position.array;
  for (let i = 0; i < DUST_N; i++) {
    dpos[i * 3 + 1] += Math.sin(t * 0.4 + i) * 0.002;
    if (dpos[i * 3 + 1] > WALL_H) dpos[i * 3 + 1] = 0;
    if (dpos[i * 3 + 1] < 0) dpos[i * 3 + 1] = WALL_H;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Compass
  compassNeedle.setAttribute('transform', `rotate(${(-yaw * 180) / Math.PI} 26 26)`);

  if (started) drawMinimap();

  renderer.render(scene, camera);
}

animate();
  </script>
