<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stride — Procedural Biped</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #e8e4dc;
  }
  #title {
    position: absolute; top: 2.2rem; left: 2.4rem;
    opacity: 0; animation: fadeIn 1.8s 0.4s ease forwards;
  }
  #title h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: clamp(1.6rem, 3.5vw, 2.6rem);
    letter-spacing: -0.03em; line-height: 1;
    background: linear-gradient(135deg, #f0ebe3 0%, #c4b89a 45%, #7eb8a8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p {
    margin-top: 0.45rem; font-size: 0.78rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: #8a8578; font-weight: 500;
  }
  #moment {
    position: absolute; bottom: 2.4rem; left: 50%; transform: translateX(-50%);
    font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.85rem;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #c4b89a; opacity: 0; transition: opacity 1.2s ease;
    text-shadow: 0 0 40px rgba(126,184,168,0.35);
  }
  #moment.show { opacity: 1; }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(6,8,12,0.55) 100%);
    pointer-events: none;
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="hud">
  <div id="title">
    <h1>STRIDE</h1>
    <p>Procedural gait · living balance</p>
  </div>
  <div id="moment">Crest light</div>
  <div id="vignette"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

// ─── Scene ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0c1018, 0.018);
scene.background = new THREE.Color(0x0a0c10);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─── Lighting ────────────────────────────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0x6a8aaa, 0x1a1410, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe8c8, 1.35);
key.position.set(8, 18, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 80;
key.shadow.camera.left = -28;
key.shadow.camera.right = 28;
key.shadow.camera.top = 28;
key.shadow.camera.bottom = -28;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x5eb8c8, 0.55);
rim.position.set(-12, 8, -10);
scene.add(rim);

const fill = new THREE.PointLight(0xc4a878, 0.4, 40, 2);
fill.position.set(0, 6, 8);
scene.add(fill);

const crestLight = new THREE.PointLight(0xa8e8d8, 0, 35, 1.5);
crestLight.position.set(0, 12, 0);
scene.add(crestLight);

// ─── Terrain ─────────────────────────────────────────────────────────────────
function terrainHeight(x, z) {
  const a = Math.sin(x * 0.11) * Math.cos(z * 0.09) * 1.15;
  const b = Math.sin(x * 0.23 + 1.7) * Math.cos(z * 0.19) * 0.45;
  const c = Math.sin(x * 0.05 + z * 0.07) * 0.7;
  const ridge = Math.abs(Math.sin(x * 0.035 + z * 0.02)) * 0.9;
  return a + b + c + ridge * 0.35;
}

function terrainNormal(x, z) {
  const e = 0.15;
  const hL = terrainHeight(x - e, z);
  const hR = terrainHeight(x + e, z);
  const hD = terrainHeight(x, z - e);
  const hU = terrainHeight(x, z + e);
  const n = new THREE.Vector3(hL - hR, 2 * e, hD - hU).normalize();
  return n;
}

const TERRAIN_SIZE = 120;
const TERRAIN_SEG = 160;
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);
const pos = terrainGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  pos.setY(i, terrainHeight(x, z));
}
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  color: 0x2a3228,
  roughness: 0.92,
  metalness: 0.05,
  flatShading: false,
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// Accent patches / moss
const mossGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, 80, 80);
mossGeo.rotateX(-Math.PI / 2);
const mp = mossGeo.attributes.position;
const mossColors = new Float32Array(mp.count * 3);
const cMoss = new THREE.Color(0x3d5a42);
const cRock = new THREE.Color(0x1e2420);
const cSand = new THREE.Color(0x4a4438);
const tmpC = new THREE.Color();
for (let i = 0; i < mp.count; i++) {
  const x = mp.getX(i);
  const z = mp.getZ(i);
  const h = terrainHeight(x, z);
  mp.setY(i, h + 0.02);
  const t = (Math.sin(x * 0.3) + Math.cos(z * 0.25) + 1) * 0.35;
  tmpC.copy(cRock).lerp(cMoss, Math.max(0, Math.min(1, 0.4 + t - h * 0.15)));
  if (h > 1.2) tmpC.lerp(cSand, 0.35);
  mossColors[i * 3] = tmpC.r;
  mossColors[i * 3 + 1] = tmpC.g;
  mossColors[i * 3 + 2] = tmpC.b;
}
mossGeo.setAttribute('color', new THREE.BufferAttribute(mossColors, 3));
mossGeo.computeVertexNormals();
const moss = new THREE.Mesh(mossGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.95, metalness: 0, transparent: true, opacity: 0.85,
}));
moss.receiveShadow = true;
scene.add(moss);

// Scattered stones
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3a3e3c, roughness: 0.88, metalness: 0.1 });
for (let i = 0; i < 48; i++) {
  const sx = (Math.random() - 0.5) * 90;
  const sz = (Math.random() - 0.5) * 90;
  const r = 0.15 + Math.random() * 0.55;
  const g = new THREE.IcosahedronGeometry(r, 0);
  const m = new THREE.Mesh(g, stoneMat);
  m.position.set(sx, terrainHeight(sx, sz) + r * 0.35, sz);
  m.rotation.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
  m.scale.set(1, 0.55 + Math.random() * 0.4, 0.8 + Math.random() * 0.4);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// Soft ground mist particles
const mistCount = 180;
const mistGeo = new THREE.BufferGeometry();
const mistPos = new Float32Array(mistCount * 3);
for (let i = 0; i < mistCount; i++) {
  mistPos[i * 3] = (Math.random() - 0.5) * 70;
  mistPos[i * 3 + 1] = 0.4 + Math.random() * 2.5;
  mistPos[i * 3 + 2] = (Math.random() - 0.5) * 70;
}
mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
const mist = new THREE.Points(mistGeo, new THREE.PointsMaterial({
  color: 0xa8c4c0, size: 0.35, transparent: true, opacity: 0.18,
  depthWrite: false, sizeAttenuation: true,
}));
scene.add(mist);

// Path glow markers (subtle)
const pathGlowMat = new THREE.MeshBasicMaterial({ color: 0x7eb8a8, transparent: true, opacity: 0.12 });
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * TAU;
  const r = 18 + Math.sin(i * 1.7) * 8;
  const px = Math.cos(a) * r;
  const pz = Math.sin(a) * r * 0.7;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), pathGlowMat);
  disc.rotation.x = -Math.PI / 2;
  disc.position.set(px, terrainHeight(px, pz) + 0.05, pz);
  scene.add(disc);
}

// Sky gradient dome
{
  const skyGeo = new THREE.SphereGeometry(100, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x121820) },
      midColor: { value: new THREE.Color(0x1a2430) },
      botColor: { value: new THREE.Color(0x0a0c10) },
      offset: { value: 8 },
      exponent: { value: 0.55 },
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 topColor, midColor, botColor;
      uniform float offset, exponent;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld + vec3(0.0, offset, 0.0)).y;
        float t = max(pow(max(h, 0.0), exponent), 0.0);
        vec3 col = mix(botColor, midColor, smoothstep(0.0, 0.45, t));
        col = mix(col, topColor, smoothstep(0.35, 1.0, t));
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

// Stars
{
  const n = 600;
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * TAU;
    const ph = Math.acos(2 * Math.random() - 1) * 0.45;
    const r = 70 + Math.random() * 25;
    p[i * 3] = r * Math.sin(ph) * Math.cos(th);
    p[i * 3 + 1] = Math.abs(r * Math.cos(ph)) + 5;
    p[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xd8e8f0, size: 0.12, transparent: true, opacity: 0.7, depthWrite: false,
  })));
}

// ─── Biped construction ──────────────────────────────────────────────────────
const palette = {
  body: 0xc4b8a4,
  accent: 0x7eb8a8,
  joint: 0x2a2e2c,
  eye: 0xe8fff8,
  glow: 0xa8e8d8,
};

function makeMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.45, metalness: opts.metalness ?? 0.15,
    emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.emissiveIntensity ?? 0,
  });
}

const bodyMat = makeMat(palette.body, { roughness: 0.4 });
const accentMat = makeMat(palette.accent, { roughness: 0.35, metalness: 0.25, emissive: palette.glow, emissiveIntensity: 0.15 });
const jointMat = makeMat(palette.joint, { roughness: 0.6, metalness: 0.3 });
const eyeMat = makeMat(palette.eye, { roughness: 0.2, metalness: 0.1, emissive: palette.glow, emissiveIntensity: 0.8 });

const root = new THREE.Group();
scene.add(root);

const hips = new THREE.Group();
root.add(hips);

const torso = new THREE.Group();
hips.add(torso);
torso.position.y = 0.55;

const chest = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.45, 6, 12), bodyMat);
chest.castShadow = true;
torso.add(chest);

const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), accentMat);
coreGlow.position.set(0, 0.05, 0.22);
torso.add(coreGlow);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.18, 10), jointMat);
neck.position.y = 0.48;
torso.add(neck);

const head = new THREE.Group();
head.position.y = 0.68;
torso.add(head);

const skull = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 14), bodyMat);
skull.scale.set(1, 1.05, 0.95);
skull.castShadow = true;
head.add(skull);

const jaw = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.08, 4, 8), bodyMat);
jaw.position.set(0, -0.14, 0.06);
jaw.rotation.x = 0.15;
head.add(jaw);

const crest = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.28, 6), accentMat);
crest.position.set(0, 0.22, -0.02);
crest.rotation.x = -0.3;
head.add(crest);

[-0.09, 0.09].forEach((x) => {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), eyeMat);
  eye.position.set(x, 0.04, 0.18);
  head.add(eye);
  const lid = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), jointMat);
  lid.position.set(x, 0.06, 0.16);
  lid.scale.set(1, 0.35, 0.8);
  head.add(lid);
});

// Arms
function makeArm(side) {
  const arm = new THREE.Group();
  arm.position.set(side * 0.36, 0.28, 0);
  torso.add(arm);

  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), jointMat);
  arm.add(shoulder);

  const upper = new THREE.Group();
  arm.add(upper);
  const upperMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.28, 4, 8), bodyMat);
  upperMesh.position.y = -0.22;
  upperMesh.castShadow = true;
  upper.add(upperMesh);

  const elbow = new THREE.Group();
  elbow.position.y = -0.42;
  upper.add(elbow);
  elbow.add(new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 6), jointMat));

  const forearm = new THREE.Group();
  elbow.add(forearm);
  const foreMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.24, 4, 8), bodyMat);
  foreMesh.position.y = -0.18;
  foreMesh.castShadow = true;
  forearm.add(foreMesh);

  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), accentMat);
  hand.position.y = -0.34;
  hand.scale.set(1.1, 0.7, 0.9);
  forearm.add(hand);

  return { arm, upper, elbow, forearm };
}

const leftArm = makeArm(-1);
const rightArm = makeArm(1);

// Legs
function makeLeg(side) {
  const leg = new THREE.Group();
  leg.position.set(side * 0.14, 0, 0);
  hips.add(leg);

  const hipJoint = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), jointMat);
  leg.add(hipJoint);

  const thigh = new THREE.Group();
  leg.add(thigh);
  const thighMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.38, 4, 10), bodyMat);
  thighMesh.position.y = -0.28;
  thighMesh.castShadow = true;
  thigh.add(thighMesh);

  const knee = new THREE.Group();
  knee.position.y = -0.55;
  thigh.add(knee);
  knee.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), jointMat));

  const shin = new THREE.Group();
  knee.add(shin);
  const shinMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.36, 4, 10), bodyMat);
  shinMesh.position.y = -0.26;
  shinMesh.castShadow = true;
  shin.add(shinMesh);

  const ankle = new THREE.Group();
  ankle.position.y = -0.52;
  shin.add(ankle);
  ankle.add(new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), jointMat));

  const foot = new THREE.Group();
  ankle.add(foot);
  const footMesh = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 0.28), bodyMat);
  footMesh.position.set(0, -0.04, 0.06);
  footMesh.castShadow = true;
  foot.add(footMesh);
  const toe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.1), accentMat);
  toe.position.set(0, -0.05, 0.2);
  foot.add(toe);

  return { leg, thigh, knee, shin, ankle, foot };
}

const leftLeg = makeLeg(-1);
const rightLeg = makeLeg(1);

// Soft body trail orbs
const trailCount = 12;
const trails = [];
for (let i = 0; i < trailCount; i++) {
  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0x7eb8a8, transparent: true, opacity: 0 })
  );
  scene.add(orb);
  trails.push({ mesh: orb, life: 0, maxLife: 1.2 + Math.random() * 0.6 });
}

// ─── Procedural gait ─────────────────────────────────────────────────────────
const biped = {
  phase: 0,
  speed: 1.55,
  stride: 1.0,
  x: 0,
  z: -8,
  yaw: 0,
  pathT: 0,
  bob: 0,
  lean: 0,
  sway: 0,
  headingSmooth: 0,
};

function pathPoint(t) {
  const r = 16 + Math.sin(t * 0.7) * 5 + Math.sin(t * 1.3) * 2;
  const x = Math.cos(t * 0.45) * r;
  const z = Math.sin(t * 0.45) * r * 0.75 + Math.sin(t * 0.9) * 3;
  return { x, z };
}

function updateGait(dt) {
  biped.pathT += dt * 0.22 * biped.speed;
  const now = pathPoint(biped.pathT);
  const ahead = pathPoint(biped.pathT + 0.08);
  const targetYaw = Math.atan2(ahead.x - now.x, ahead.z - now.z);
  let dy = targetYaw - biped.yaw;
  while (dy > Math.PI) dy -= TAU;
  while (dy < -Math.PI) dy += TAU;
  biped.yaw += dy * Math.min(1, dt * 3.2);
  biped.headingSmooth += (dy - biped.headingSmooth) * Math.min(1, dt * 4);

  biped.x = now.x;
  biped.z = now.z;

  const groundY = terrainHeight(biped.x, biped.z);
  const n = terrainNormal(biped.x, biped.z);

  // Slope-aware speed & stride
  const slope = 1 - n.y;
  const climb = Math.sign(n.x * Math.sin(biped.yaw) + n.z * Math.cos(biped.yaw)) * slope;
  const gaitSpeed = biped.speed * (1.05 - slope * 0.55 - Math.max(0, climb) * 0.25);
  biped.phase += dt * gaitSpeed * 3.4;

  const p = biped.phase;
  const strideAmp = 0.55 * biped.stride * (1 + slope * 0.2);
  const liftAmp = 0.22 + Math.max(0, climb) * 0.12;

  // Legs — opposite phase
  const L = Math.sin(p);
  const R = Math.sin(p + Math.PI);
  const Lc = Math.cos(p);
  const Rc = Math.cos(p + Math.PI);

  // Thigh swing (X) + slight abduction
  leftLeg.thigh.rotation.x = L * strideAmp;
  rightLeg.thigh.rotation.x = R * strideAmp;
  leftLeg.leg.rotation.z = 0.04 + Math.sin(p * 0.5) * 0.02;
  rightLeg.leg.rotation.z = -0.04 - Math.sin(p * 0.5) * 0.02;

  // Knee flex on swing (when foot rising / forward)
  const leftSwing = Math.max(0, -Lc);
  const rightSwing = Math.max(0, -Rc);
  leftLeg.knee.rotation.x = 0.15 + leftSwing * 1.1 + Math.max(0, -L) * 0.15;
  rightLeg.knee.rotation.x = 0.15 + rightSwing * 1.1 + Math.max(0, -R) * 0.15;

  // Ankle / foot plant
  leftLeg.ankle.rotation.x = -leftLeg.thigh.rotation.x * 0.35 - leftLeg.knee.rotation.x * 0.2 + leftSwing * 0.25;
  rightLeg.ankle.rotation.x = -rightLeg.thigh.rotation.x * 0.35 - rightLeg.knee.rotation.x * 0.2 + rightSwing * 0.25;
  leftLeg.foot.rotation.x = -leftSwing * 0.35 + Math.max(0, L) * 0.1;
  rightLeg.foot.rotation.x = -rightSwing * 0.35 + Math.max(0, R) * 0.1;

  // Hip vertical bob & weight shift
  const contact = Math.max(Math.abs(Math.cos(p)), Math.abs(Math.cos(p + Math.PI)));
  biped.bob = Math.abs(Math.sin(p * 2)) * 0.06 + leftSwing * liftAmp * 0.15 + rightSwing * liftAmp * 0.15;
  biped.sway = Math.sin(p) * 0.06;
  biped.lean = -biped.headingSmooth * 1.8 + climb * 0.35;

  hips.position.y = biped.bob;
  hips.rotation.z = biped.sway;
  hips.rotation.x = biped.lean * 0.15;
  hips.rotation.y = Math.sin(p) * 0.04;

  // Torso counter-rotation & breath
  torso.rotation.y = -Math.sin(p) * 0.12;
  torso.rotation.z = -biped.sway * 0.6;
  torso.rotation.x = biped.lean * 0.2 + Math.sin(p * 2) * 0.02;
  const breath = 1 + Math.sin(performance.now() * 0.0025) * 0.015;
  chest.scale.set(breath, 1 / Math.sqrt(breath), breath);

  // Head look / stabilize
  head.rotation.y = Math.sin(p * 0.5) * 0.08 - biped.headingSmooth * 0.5;
  head.rotation.x = -biped.lean * 0.15 + Math.sin(performance.now() * 0.0018) * 0.03;
  head.rotation.z = -hips.rotation.z * 0.4;

  // Arms opposite to legs
  leftArm.upper.rotation.x = -L * 0.55;
  rightArm.upper.rotation.x = -R * 0.55;
  leftArm.upper.rotation.z = 0.18;
  rightArm.upper.rotation.z = -0.18;
  leftArm.elbow.rotation.x = 0.35 + Math.max(0, L) * 0.45;
  rightArm.elbow.rotation.x = 0.35 + Math.max(0, R) * 0.45;
  leftArm.forearm.rotation.x = Math.max(0, -L) * 0.2;
  rightArm.forearm.rotation.x = Math.max(0, -R) * 0.2;
  leftArm.arm.rotation.y = Math.sin(p) * 0.05;
  rightArm.arm.rotation.y = Math.sin(p + Math.PI) * 0.05;

  // Place on terrain with soft alignment
  root.position.set(biped.x, groundY + 1.05 - biped.bob * 0.3, biped.z);
  root.rotation.y = biped.yaw;

  // Slight pitch/roll to slope
  const targetPitch = Math.atan2(n.z * Math.cos(biped.yaw) + n.x * Math.sin(biped.yaw), n.y) * 0.45;
  const targetRoll = Math.atan2(n.x * Math.cos(biped.yaw) - n.z * Math.sin(biped.yaw), n.y) * 0.4;
  root.rotation.x += (targetPitch - root.rotation.x) * Math.min(1, dt * 4);
  root.rotation.z += (targetRoll - root.rotation.z) * Math.min(1, dt * 4);

  // Foot contact glow pulse
  const pulse = 0.12 + contact * 0.18 + Math.max(0, Math.sin(p * 2)) * 0.1;
  accentMat.emissiveIntensity = pulse;
  eyeMat.emissiveIntensity = 0.6 + Math.sin(performance.now() * 0.004) * 0.25;

  return { groundY, climb, contact };
}

// ─── Camera ──────────────────────────────────────────────────────────────────
const camState = {
  dist: 9.5,
  height: 3.2,
  side: 1.2,
  lookLift: 1.1,
  shake: 0,
};

function updateCamera(dt, climb) {
  const behind = biped.yaw + Math.PI;
  const ox = Math.sin(behind) * camState.dist + Math.cos(behind) * camState.side;
  const oz = Math.cos(behind) * camState.dist - Math.sin(behind) * camState.side;
  const targetPos = new THREE.Vector3(
    root.position.x + ox,
    root.position.y + camState.height + climb * 0.8,
    root.position.z + oz
  );
  camera.position.lerp(targetPos, 1 - Math.pow(0.001, dt));

  const look = new THREE.Vector3(
    root.position.x + Math.sin(biped.yaw) * 1.5,
    root.position.y + camState.lookLift,
    root.position.z + Math.cos(biped.yaw) * 1.5
  );
  camera.lookAt(look);

  // Cinematic push near crest
  if (camState.shake > 0) {
    camera.position.x += (Math.random() - 0.5) * camState.shake * 0.08;
    camera.position.y += (Math.random() - 0.5) * camState.shake * 0.05;
    camState.shake *= 0.92;
  }
}

// ─── Memorable moment: crest light ───────────────────────────────────────────
let crestArmed = true;
let crestActive = 0;
const momentEl = document.getElementById('moment');

function updateMoment(dt, groundY) {
  // Trigger when creature reaches a high ridge
  if (crestArmed && groundY > 2.35) {
    crestArmed = false;
    crestActive = 4.5;
    momentEl.classList.add('show');
    camState.shake = 1.2;
    bloom.strength = 0.95;
    key.intensity = 1.8;
    crestLight.intensity = 4.5;
    setTimeout(() => momentEl.classList.remove('show'), 3200);
  }
  if (crestActive > 0) {
    crestActive -= dt;
    const t = Math.max(0, crestActive / 4.5);
    crestLight.intensity = 4.5 * t;
    crestLight.position.set(root.position.x, root.position.y + 4, root.position.z);
    bloom.strength = 0.45 + 0.5 * t;
    key.intensity = 1.35 + 0.45 * t;
    if (crestActive <= 0) {
      crestArmed = true; // can fire again on next ridge
      bloom.strength = 0.45;
      key.intensity = 1.35;
    }
  }
}

// Trail emission on footfalls
let lastTrailPhase = 0;
function updateTrails(dt) {
  const step = Math.floor(biped.phase / Math.PI);
  if (step !== lastTrailPhase) {
    lastTrailPhase = step;
    const free = trails.find((t) => t.life <= 0);
    if (free) {
      free.life = free.maxLife;
      free.mesh.position.copy(root.position);
      free.mesh.position.y = terrainHeight(biped.x, biped.z) + 0.15;
      free.mesh.position.x += (Math.random() - 0.5) * 0.3;
      free.mesh.material.opacity = 0.55;
      free.mesh.scale.setScalar(1);
    }
  }
  for (const t of trails) {
    if (t.life <= 0) continue;
    t.life -= dt;
    const u = Math.max(0, t.life / t.maxLife);
    t.mesh.material.opacity = u * 0.5;
    t.mesh.position.y += dt * 0.35;
    t.mesh.scale.setScalar(1 + (1 - u) * 2.5);
  }
}

// Mist drift
function updateMist(t) {
  const arr = mist.geometry.attributes.position.array;
  for (let i = 0; i < mistCount; i++) {
    arr[i * 3] += Math.sin(t * 0.15 + i) * 0.004;
    arr[i * 3 + 2] += Math.cos(t * 0.12 + i * 0.7) * 0.004;
    const x = arr[i * 3];
    const z = arr[i * 3 + 2];
    arr[i * 3 + 1] = terrainHeight(x, z) + 0.5 + Math.sin(t * 0.4 + i) * 0.3;
  }
  mist.geometry.attributes.position.needsUpdate = true;
}

// Key light follows slightly
function updateLights() {
  key.target.position.copy(root.position);
  key.target.updateMatrixWorld();
  fill.position.set(root.position.x + 4, root.position.y + 5, root.position.z + 6);
}

// ─── Loop ────────────────────────────────────────────────────────────────────
let last = performance.now();
let elapsed = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  elapsed += dt;

  const { groundY, climb } = updateGait(dt);
  updateCamera(dt, climb);
  updateMoment(dt, groundY);
  updateTrails(dt);
  updateMist(elapsed);
  updateLights();

  // Soft exposure breathe
  renderer.toneMappingExposure = 1.1 + Math.sin(elapsed * 0.3) * 0.04 + (crestActive > 0 ? 0.15 : 0);

  composer.render();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

// Optional polish: click to nudge camera side (not required)
addEventListener('pointerdown', () => {
  camState.side *= -1;
});

requestAnimationFrame(frame);
</script>
</body>
</html>
