<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infinite Maze</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0c; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const CELL = 4;
const WALL_H = 3.2;
const VIEW_R = 8;
const MOVE_SPEED = 2.8;
const TURN_SPEED = 2.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.FogExp2(0x0b0c10, 0.085);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const amb = new THREE.AmbientLight(0x445566, 0.45);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0x8899aa, 0x221100, 0.55);
scene.add(hemi);
const lamp = new THREE.PointLight(0xffcc88, 1.6, 18, 2);
lamp.castShadow = true;
scene.add(lamp);

const floorMat = new THREE.MeshStandardMaterial({
  color: 0x2a2e36, roughness: 0.92, metalness: 0.05
});
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x6a7484, roughness: 0.78, metalness: 0.08
});
const accentMat = new THREE.MeshStandardMaterial({
  color: 0x3d4a5c, roughness: 0.7, metalness: 0.15
});

const floorGeo = new THREE.PlaneGeometry(CELL * 1.02, CELL * 1.02);
const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, 0.28);
const pillarGeo = new THREE.BoxGeometry(0.35, WALL_H, 0.35);

function hash2(x, z) {
  let n = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function passageOpen(ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  if (Math.abs(dx) + Math.abs(dz) !== 1) return false;
  const hx = Math.min(ax, bx), hz = Math.min(az, bz);
  const edge = dx !== 0 ? 0 : 1;
  const r = hash2(hx * 2 + edge, hz * 2 + (1 - edge));
  if ((ax + az) % 2 === 0) return r < 0.62;
  return r < 0.55 || (hash2(ax, az) > 0.35 && hash2(bx, bz) > 0.4);
}

function ensureConnected(cx, cz) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const [dx, dz] of dirs) {
    if (passageOpen(cx, cz, cx + dx, cz + dz)) return true;
  }
  return false;
}

function forceNeighbors(cx, cz) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const open = [];
  for (const [dx, dz] of dirs) {
    if (passageOpen(cx, cz, cx + dx, cz + dz)) open.push([dx, dz]);
  }
  if (open.length) return open;
  const pick = dirs[Math.floor(hash2(cx, cz) * 4) % 4];
  return [pick];
}

const chunks = new Map();
const keyOf = (x, z) => `${x},${z}`;

function worldOf(cx, cz) {
  return new THREE.Vector3(cx * CELL + CELL * 0.5, 0, cz * CELL + CELL * 0.5);
}

function buildChunk(cx, cz) {
  const g = new THREE.Group();
  g.userData = { cx, cz };

  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(cx * CELL + CELL * 0.5, 0, cz * CELL + CELL * 0.5);
  floor.receiveShadow = true;
  g.add(floor);

  const tint = hash2(cx + 17, cz - 9);
  if (tint > 0.72) {
    const accent = new THREE.Mesh(floorGeo, accentMat);
    accent.rotation.x = -Math.PI / 2;
    accent.position.set(cx * CELL + CELL * 0.5, 0.01, cz * CELL + CELL * 0.5);
    accent.scale.set(0.35, 0.35, 1);
    g.add(accent);
  }

  const neighbors = [
    [1, 0, Math.PI / 2, CELL, 0],
    [-1, 0, Math.PI / 2, 0, 0],
    [0, 1, 0, 0, CELL],
    [0, -1, 0, 0, 0]
  ];

  for (const [dx, dz, rot, ox, oz] of neighbors) {
    const open = passageOpen(cx, cz, cx + dx, cz + dz) ||
      (!ensureConnected(cx, cz) && forceNeighbors(cx, cz).some(([a, b]) => a === dx && b === dz));
    if (!open) {
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.rotation.y = rot;
      wall.position.set(
        cx * CELL + ox + (dx === 0 ? CELL * 0.5 : 0),
        WALL_H * 0.5,
        cz * CELL + oz + (dz === 0 ? CELL * 0.5 : 0)
      );
      if (dx !== 0) wall.position.z = cz * CELL + CELL * 0.5;
      if (dz !== 0) wall.position.x = cx * CELL + CELL * 0.5;
      wall.castShadow = true;
      wall.receiveShadow = true;
      g.add(wall);
    }
  }

  const pillar = new THREE.Mesh(pillarGeo, wallMat);
  pillar.position.set(cx * CELL, WALL_H * 0.5, cz * CELL);
  pillar.castShadow = true;
  g.add(pillar);

  scene.add(g);
  chunks.set(keyOf(cx, cz), g);
}

function syncChunks(px, pz) {
  const need = new Set();
  for (let z = pz - VIEW_R; z <= pz + VIEW_R; z++) {
    for (let x = px - VIEW_R; x <= px + VIEW_R; x++) {
      const k = keyOf(x, z);
      need.add(k);
      if (!chunks.has(k)) buildChunk(x, z);
    }
  }
  for (const [k, g] of chunks) {
    if (!need.has(k)) {
      scene.remove(g);
      chunks.delete(k);
    }
  }
}

function canStep(fromX, fromZ, toX, toZ) {
  if (!passageOpen(fromX, fromZ, toX, toZ)) {
    const forced = forceNeighbors(fromX, fromZ);
    return forced.some(([dx, dz]) => fromX + dx === toX && fromZ + dz === toZ) &&
      !ensureConnected(fromX, fromZ);
  }
  return true;
}

function openDirs(cx, cz) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const out = [];
  for (const [dx, dz] of dirs) {
    if (canStep(cx, cz, cx + dx, cz + dz)) out.push([dx, dz]);
  }
  if (!out.length) return forceNeighbors(cx, cz);
  return out;
}

let cellX = 0, cellZ = 0;
let pos = worldOf(cellX, cellZ);
pos.y = 1.55;
camera.position.copy(pos);

let facing = new THREE.Vector3(0, 0, -1);
let targetFacing = facing.clone();
let moving = false;
let moveFrom = pos.clone();
let moveTo = pos.clone();
let moveT = 0;
let turnT = 1;
let turnFrom = facing.clone();
let pathMemory = [];

function pickNext() {
  const options = openDirs(cellX, cellZ);
  const scored = options.map(([dx, dz]) => {
    const nx = cellX + dx, nz = cellZ + dz;
    let score = hash2(nx * 31 + cellX, nz * 17 + cellZ);
    const back = pathMemory.length && pathMemory[pathMemory.length - 1][0] === -dx &&
      pathMemory[pathMemory.length - 1][1] === -dz;
    if (back) score -= 1.2;
    const recent = pathMemory.some(([px, pz], i) =>
      i > pathMemory.length - 6 && px === dx && pz === dz);
    if (recent) score -= 0.35;
    const forwardDot = dx * facing.x + dz * facing.z;
    score += forwardDot * 0.25;
    return { dx, dz, score };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored[0];
}

function beginMove() {
  const next = pickNext();
  const dx = next.dx, dz = next.dz;
  targetFacing.set(dx, 0, dz).normalize();
  turnFrom.copy(facing);
  turnT = 0;
  const nx = cellX + dx, nz = cellZ + dz;
  moveFrom.copy(worldOf(cellX, cellZ));
  moveFrom.y = 1.55;
  moveTo.copy(worldOf(nx, nz));
  moveTo.y = 1.55;
  pathMemory.push([dx, dz]);
  if (pathMemory.length > 24) pathMemory.shift();
  cellX = nx;
  cellZ = nz;
  moving = true;
  moveT = 0;
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

syncChunks(cellX, cellZ);
beginMove();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (turnT < 1) {
    turnT = Math.min(1, turnT + dt * TURN_SPEED);
    const e = easeInOut(turnT);
    facing.lerpVectors(turnFrom, targetFacing, e).normalize();
  }

  if (moving) {
    const dist = moveFrom.distanceTo(moveTo);
    moveT = Math.min(1, moveT + (dt * MOVE_SPEED) / Math.max(dist, 0.001));
    const e = easeInOut(moveT);
    pos.lerpVectors(moveFrom, moveTo, e);
    camera.position.copy(pos);
    camera.position.y = 1.55 + Math.sin(moveT * Math.PI) * 0.03;
    if (moveT >= 1) {
      moving = false;
      pos.copy(moveTo);
      camera.position.copy(pos);
      syncChunks(cellX, cellZ);
      beginMove();
    }
  }

  const look = pos.clone().add(facing);
  look.y = camera.position.y;
  camera.lookAt(look);
  lamp.position.set(camera.position.x, 2.2, camera.position.z);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
