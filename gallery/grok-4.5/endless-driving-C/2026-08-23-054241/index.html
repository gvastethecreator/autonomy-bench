<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nocturne Drive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #02040a;
    font-family: 'Syne', system-ui, sans-serif;
    color: #e8eef8;
  }
  #c { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 80% at 50% 110%, rgba(255,90,40,0.12), transparent 55%),
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(40,80,180,0.18), transparent 50%),
      linear-gradient(to bottom, rgba(2,4,12,0.35) 0%, transparent 18%, transparent 72%, rgba(2,4,12,0.55) 100%);
    z-index: 2;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
  }
  #hud {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(18px, 3vw, 36px);
  }
  .top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  }
  .brand {
    display: flex; flex-direction: column; gap: 4px;
  }
  .brand h1 {
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 800; letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 20%, #9ec5ff 55%, #ff9a5c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(120,160,255,0.25);
  }
  .brand .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(180,200,230,0.55);
  }
  .meta {
    text-align: right;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em;
    color: rgba(180,200,230,0.65);
    line-height: 1.7;
  }
  .meta .val { color: #c8d8f0; }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
  }
  .chapter {
    max-width: 420px;
  }
  .chapter .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(255,154,92,0.75); margin-bottom: 6px;
  }
  .chapter h2 {
    font-size: clamp(18px, 2.4vw, 26px); font-weight: 700;
    letter-spacing: -0.02em; margin-bottom: 4px;
    transition: opacity 0.6s ease;
  }
  .chapter p {
    font-size: 13px; color: rgba(200,214,235,0.55);
    line-height: 1.45; max-width: 36ch;
  }
  .speedo {
    text-align: right;
  }
  .speedo .num {
    font-size: clamp(36px, 5vw, 56px); font-weight: 800;
    letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .speedo .unit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em; color: rgba(180,200,230,0.5);
  }
  #flash {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: #fff; opacity: 0; mix-blend-mode: screen;
  }
  #titlecard {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #02040a;
    transition: opacity 1.4s ease;
  }
  #titlecard.hide { opacity: 0; pointer-events: none; }
  #titlecard .inner { text-align: center; }
  #titlecard h1 {
    font-size: clamp(40px, 8vw, 72px); font-weight: 800;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #fff, #8ab4ff 50%, #ff8a4a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #titlecard p {
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.35em; text-transform: uppercase;
    color: rgba(160,180,210,0.5);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud">
  <div class="top">
    <div class="brand">
      <h1>NOCTURNE</h1>
      <div class="tag">Endless Night Drive</div>
    </div>
    <div class="meta">
      <div>LAT <span class="val" id="lat">34.0522° N</span></div>
      <div>WEATHER <span class="val" id="wx">CLEAR</span></div>
      <div>TIME <span class="val" id="clock">00:00</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="chapter">
      <div class="label">Chapter</div>
      <h2 id="chTitle">City Fringe</h2>
      <p id="chDesc">Neon bleed on wet asphalt. The night has only begun.</p>
    </div>
    <div class="speedo">
      <div class="num" id="spd">118</div>
      <div class="unit">KM/H</div>
    </div>
  </div>
</div>
<div id="titlecard">
  <div class="inner">
    <h1>NOCTURNE</h1>
    <p>A night that never ends</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050814, 0.012);
scene.background = new THREE.Color(0x050814);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
const clock = new THREE.Clock();

// ─── Art palette ───
const COL = {
  asphalt: 0x0c1018,
  lane: 0xd8c8a0,
  neonCyan: 0x44d4ff,
  neonMagenta: 0xff3d9a,
  neonAmber: 0xff9a3c,
  carBody: 0x12161e,
  headlight: 0xfff2d8,
  taillight: 0xff2030,
  building: 0x0a0e16,
  windowWarm: 0xffb060,
  windowCool: 0x6ab0ff,
  tree: 0x0a1a12,
  rain: 0xa8c4e8,
};

// ─── Road ───
const ROAD_W = 14;
const SEG_LEN = 40;
const SEG_COUNT = 28;
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadMat = new THREE.MeshStandardMaterial({
  color: COL.asphalt, roughness: 0.92, metalness: 0.15, roughness: 0.55
});
const shoulderMat = new THREE.MeshStandardMaterial({
  color: 0x141820, roughness: 0.9, metalness: 0.05, roughness: 0.85
});
const laneMat = new THREE.MeshBasicMaterial({ color: COL.lane });
const dashMat = new THREE.MeshBasicMaterial({ color: 0xe8dcc0 });

function makeRoadSegment(z) {
  const g = new THREE.Group();
  g.position.z = z;

  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, SEG_LEN), roadMat);
  road.rotation.x = -Math.PI / 2;
  road.receiveShadow = true;
  g.add(road);

  const left = new THREE.Mesh(new THREE.PlaneGeometry(8, SEG_LEN), shoulderMat);
  left.rotation.x = -Math.PI / 2;
  left.position.x = -(ROAD_W / 2 + 4);
  g.add(left);
  const right = left.clone();
  right.position.x = ROAD_W / 2 + 4;
  g.add(right);

  // edge lines
  for (const side of [-1, 1]) {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.18, SEG_LEN), laneMat);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(side * (ROAD_W / 2 - 0.4), 0.02, 0);
    g.add(edge);
  }

  // dashed center
  const dashCount = 5;
  for (let i = 0; i < dashCount; i++) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 3.2), dashMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(0, 0.025, -SEG_LEN / 2 + 4 + i * (SEG_LEN / dashCount));
    g.add(dash);
  }

  // wet reflection strip (subtle emissive)
  const wet = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_W * 0.9, SEG_LEN),
    new THREE.MeshBasicMaterial({ color: 0x1a2840, transparent: true, opacity: 0.12 })
  );
  wet.rotation.x = -Math.PI / 2;
  wet.position.y = 0.01;
  g.add(wet);

  return g;
}

const segments = [];
for (let i = 0; i < SEG_COUNT; i++) {
  const seg = makeRoadSegment(-i * SEG_LEN);
  roadGroup.add(seg);
  segments.push(seg);
}

// ─── Player car ───
function createCar(opts = {}) {
  const g = new THREE.Group();
  const bodyCol = opts.color ?? COL.carBody;
  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyCol, metalness: 0.75, roughness: 0.35
  });
  const darkMat = new THREE.MeshStandardMaterial({
    color: 0x05070c, metalness: 0.5, roughness: 0.6
  });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x1a2233, metalness: 0.9, roughness: 0.15, transparent: true, opacity: 0.85
  });

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 4.2), bodyMat);
  body.position.y = 0.55;
  g.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.5, 2.0), glassMat);
  cabin.position.set(0, 1.0, -0.15);
  g.add(cabin);

  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.12, 1.1), bodyMat);
  hood.position.set(0, 0.78, 1.2);
  hood.rotation.x = 0.08;
  g.add(hood);

  // wheels
  const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 12);
  for (const [x, z] of [[-0.95, 1.25], [0.95, 1.25], [-0.95, -1.35], [0.95, -1.35]]) {
    const w = new THREE.Mesh(wheelGeo, darkMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, 0.38, z);
    g.add(w);
  }

  // lights
  const headMat = new THREE.MeshBasicMaterial({ color: COL.headlight });
  const tailMat = new THREE.MeshBasicMaterial({ color: COL.taillight });
  for (const x of [-0.65, 0.65]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.18, 0.08), headMat);
    hl.position.set(x, 0.55, 2.12);
    g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.08), tailMat);
    tl.position.set(x, 0.55, -2.12);
    g.add(tl);
  }

  if (opts.headlights) {
    const spotL = new THREE.SpotLight(0xfff0d0, 28, 55, Math.PI / 7, 0.45, 1.4);
    spotL.position.set(-0.5, 0.6, 2.0);
    spotL.target.position.set(-0.5, 0, 30);
    g.add(spotL); g.add(spotL.target);
    const spotR = new THREE.SpotLight(0xfff0d0, 28, 55, Math.PI / 7, 0.45, 1.4);
    spotR.position.set(0.5, 0.6, 2.0);
    spotR.target.position.set(0.5, 0, 30);
    g.add(spotR); g.add(spotR.target);
    g.userData.spots = [spotL, spotR];
  }

  g.userData.speed = 0;
  return g;
}

const player = createCar({ headlights: true, color: 0x1a2230 });
player.position.set(0, 0, 0);
scene.add(player);

// ─── Traffic ───
const traffic = [];
const trafficColors = [0x1a2030, 0x2a1820, 0x182820, 0x201818, 0x181828, 0x252015];

function spawnTraffic(ahead = true) {
  const car = createCar({ color: trafficColors[(Math.random() * trafficColors.length) | 0] });
  const lane = (Math.random() < 0.5 ? -1 : 1) * (2.8 + Math.random() * 1.2);
  const z = ahead
    ? player.position.z - 40 - Math.random() * 200
    : player.position.z + 30 + Math.random() * 80;
  car.position.set(lane, 0, z);
  car.userData.speed = 18 + Math.random() * 22;
  car.userData.lane = lane;
  if (!ahead) car.rotation.y = Math.PI;
  scene.add(car);
  traffic.push(car);
}

for (let i = 0; i < 12; i++) spawnTraffic(true);
for (let i = 0; i < 4; i++) spawnTraffic(false);

// ─── Scenery: buildings, trees, streetlights, neon signs ───
const sceneryPool = [];
const SCENERY_AHEAD = 22;

function makeBuilding(h, w, d) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: COL.building, metalness: 0.2, roughness: 0.9
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.y = h / 2;
  g.add(mesh);

  // windows
  const winCols = [COL.windowWarm, COL.windowCool, 0xff8060, 0x80c0ff];
  const rows = Math.max(2, (h / 3) | 0);
  const cols = Math.max(2, (w / 2.2) | 0);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.35) continue;
      const lit = Math.random() < 0.55;
      const wm = new THREE.MeshBasicMaterial({
        color: lit ? winCols[(Math.random() * winCols.length) | 0] : 0x0a1018,
        transparent: true,
        opacity: lit ? 0.7 + Math.random() * 0.3 : 0.4
      });
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0), wm);
      win.position.set(
        -w / 2 + 1.1 + c * ((w - 2.2) / Math.max(1, cols - 1)),
        1.5 + r * ((h - 3) / Math.max(1, rows - 1)),
        d / 2 + 0.02
      );
      g.add(win);
      const winB = win.clone();
      winB.position.z = -d / 2 - 0.02;
      winB.rotation.y = Math.PI;
      g.add(winB);
    }
  }

  // occasional neon accent
  if (Math.random() < 0.35) {
    const neonC = Math.random() < 0.5 ? COL.neonCyan : COL.neonMagenta;
    const neon = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.6, 0.15, 0.1),
      new THREE.MeshBasicMaterial({ color: neonC })
    );
    neon.position.set(0, h * 0.55, d / 2 + 0.08);
    g.add(neon);
    const glow = new THREE.PointLight(neonC, 2.5, 18, 2);
    glow.position.copy(neon.position);
    g.add(glow);
  }

  return g;
}

function makeTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.22, 2.2, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a1208, roughness: 1 })
  );
  trunk.position.y = 1.1;
  g.add(trunk);
  const foliage = new THREE.Mesh(
    new THREE.ConeGeometry(1.4, 3.5, 7),
    new THREE.MeshStandardMaterial({ color: COL.tree, roughness: 0.95 })
  );
  foliage.position.y = 3.4;
  g.add(foliage);
  return g;
}

function makeStreetlight() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.1, 6.5, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a1e28, metalness: 0.6, roughness: 0.4 })
  );
  pole.position.y = 3.25;
  g.add(pole);
  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.08, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x1a1e28, metalness: 0.6, roughness: 0.4 })
  );
  arm.position.set(0.7, 6.4, 0);
  g.add(arm);
  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffe8c0 })
  );
  lamp.position.set(1.4, 6.25, 0);
  g.add(lamp);
  const light = new THREE.PointLight(0xffd8a0, 4.5, 22, 2);
  light.position.copy(lamp.position);
  g.add(light);
  return g;
}

function makeBillboard() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.15, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x222830 })
  );
  pole.position.y = 4;
  g.add(pole);
  const neonC = [COL.neonCyan, COL.neonMagenta, COL.neonAmber][(Math.random() * 3) | 0];
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(5, 2.4, 0.2),
    new THREE.MeshBasicMaterial({ color: neonC })
  );
  board.position.y = 9;
  g.add(board);
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(5.3, 2.7, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x0a0c12, metalness: 0.5, roughness: 0.4 })
  );
  frame.position.y = 9;
  frame.position.z = -0.08;
  g.add(frame);
  const pl = new THREE.PointLight(neonC, 6, 30, 2);
  pl.position.set(0, 9, 1);
  g.add(pl);
  return g;
}

function recycleScenery(item, z) {
  item.position.z = z;
  const side = Math.random() < 0.5 ? -1 : 1;
  const dist = ROAD_W / 2 + 6 + Math.random() * 22;
  item.position.x = side * dist;
  item.rotation.y = (Math.random() - 0.5) * 0.3;
  item.visible = true;
}

function initScenery() {
  for (let i = 0; i < SCENERY_AHEAD; i++) {
    let obj;
    const r = Math.random();
    if (r < 0.4) {
      obj = makeBuilding(8 + Math.random() * 28, 4 + Math.random() * 8, 4 + Math.random() * 8);
    } else if (r < 0.65) {
      obj = makeTree();
    } else if (r < 0.85) {
      obj = makeStreetlight();
    } else {
      obj = makeBillboard();
    }
    recycleScenery(obj, player.position.z - 20 - i * 28 - Math.random() * 20);
    scene.add(obj);
    sceneryPool.push(obj);
  }
}
initScenery();

// ─── Stars & moon ───
const starGeo = new THREE.BufferGeometry();
const starCount = 1800;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 180 + Math.random() * 200;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1) * 0.45;
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 20;
  starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 80;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({ color: 0xc8d8ff, size: 1.4, sizeAttenuation: true, transparent: true, opacity: 0.85 })
);
scene.add(stars);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(8, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xe8e4d8 })
);
moon.position.set(-60, 70, -120);
scene.add(moon);
const moonGlow = new THREE.PointLight(0xc8d8ff, 1.2, 400, 2);
moonGlow.position.copy(moon.position);
scene.add(moonGlow);

// ─── Ambient lighting ───
scene.add(new THREE.AmbientLight(0x1a2848, 0.55));
const hemi = new THREE.HemisphereLight(0x1a3058, 0x08060a, 0.6);
scene.add(hemi);
const dirMoon = new THREE.DirectionalLight(0xa0b8e0, 0.35);
dirMoon.position.set(-40, 80, -30);
scene.add(dirMoon);

// ─── Rain ───
const RAIN_N = 4000;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_N * 3);
const rainVel = new Float32Array(RAIN_N);
for (let i = 0; i < RAIN_N; i++) {
  rainPos[i * 3] = (Math.random() - 0.5) * 60;
  rainPos[i * 3 + 1] = Math.random() * 40;
  rainPos[i * 3 + 2] = (Math.random() - 0.5) * 80;
  rainVel[i] = 18 + Math.random() * 25;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.Points(
  rainGeo,
  new THREE.PointsMaterial({
    color: COL.rain, size: 0.08, transparent: true, opacity: 0,
    depthWrite: false
  })
);
scene.add(rain);
let rainIntensity = 0;
let targetRain = 0;

// ─── Fog / weather state ───
let fogDensity = 0.012;
let targetFog = 0.012;
let exposureTarget = 1.05;

// ─── Journey / chapters ───
const chapters = [
  {
    title: 'City Fringe',
    desc: 'Neon bleed on wet asphalt. The night has only begun.',
    weather: 'CLEAR', fog: 0.011, rain: 0, exposure: 1.08, speed: 28,
    camera: 'chase', duration: 18
  },
  {
    title: 'Rain Corridor',
    desc: 'Sheets of silver. Headlights carve tunnels through the downpour.',
    weather: 'HEAVY RAIN', fog: 0.022, rain: 1, exposure: 0.92, speed: 24,
    camera: 'hood', duration: 16
  },
  {
    title: 'Tunnel Pulse',
    desc: 'Concrete swallows the sky. Light becomes rhythm.',
    weather: 'TUNNEL', fog: 0.006, rain: 0, exposure: 0.85, speed: 32,
    camera: 'side', duration: 14, special: 'tunnel'
  },
  {
    title: 'Coastal Dark',
    desc: 'The moon rides the horizon. Salt air and empty lanes.',
    weather: 'CLEAR', fog: 0.009, rain: 0.15, exposure: 1.15, speed: 30,
    camera: 'cinematic', duration: 16
  },
  {
    title: 'Neon Storm',
    desc: 'The city blooms. Color floods the windshield.',
    weather: 'STORM', fog: 0.018, rain: 0.85, exposure: 1.0, speed: 26,
    camera: 'low', duration: 18, special: 'neonMoment'
  },
  {
    title: 'Open Night',
    desc: 'Highway infinity. Stars over asphalt. Drive forever.',
    weather: 'CLEAR', fog: 0.01, rain: 0, exposure: 1.12, speed: 34,
    camera: 'drone', duration: 20
  },
];

let chapterIndex = 0;
let chapterTime = 0;
let specialActive = false;
let tunnelMesh = null;
let neonBurstLights = [];

function applyChapter(ch) {
  document.getElementById('chTitle').textContent = ch.title;
  document.getElementById('chDesc').textContent = ch.desc;
  document.getElementById('wx').textContent = ch.weather;
  targetFog = ch.fog;
  targetRain = ch.rain;
  exposureTarget = ch.exposure;
  specialActive = !!ch.special;

  if (ch.special === 'tunnel') enterTunnel();
  else exitTunnel();

  if (ch.special === 'neonMoment') triggerNeonMoment();
}

function enterTunnel() {
  if (tunnelMesh) return;
  const geo = new THREE.CylinderGeometry(9, 9, 120, 24, 1, true);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x0c1018, side: THREE.BackSide, metalness: 0.3, roughness: 0.8
  });
  tunnelMesh = new THREE.Mesh(geo, mat);
  tunnelMesh.rotation.x = Math.PI / 2;
  tunnelMesh.position.set(0, 3, player.position.z - 50);
  scene.add(tunnelMesh);

  // tunnel lights
  for (let i = 0; i < 10; i++) {
    const tl = new THREE.PointLight(0xffcc88, 3, 16, 2);
    tl.position.set(0, 7.5, -i * 12);
    tunnelMesh.add(tl);
  }
}

function exitTunnel() {
  if (tunnelMesh) {
    scene.remove(tunnelMesh);
    tunnelMesh.geometry.dispose();
    tunnelMesh.material.dispose();
    tunnelMesh = null;
  }
}

function triggerNeonMoment() {
  // Memorable beat: cascade of neon rings + flash + camera push
  const flash = document.getElementById('flash');
  flash.style.transition = 'none';
  flash.style.opacity = '0.55';
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity 1.8s ease';
    flash.style.opacity = '0';
  });

  // Spawn orbiting neon rings ahead
  for (let i = 0; i < 6; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(5 + i * 1.5, 0.12, 8, 48),
      new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? COL.neonMagenta : COL.neonCyan,
        transparent: true, opacity: 0.85
      })
    );
    ring.position.set(0, 2.5, player.position.z - 30 - i * 8);
    ring.rotation.x = Math.PI / 2;
    ring.userData.life = 4 + i * 0.3;
    ring.userData.spin = 0.8 + i * 0.15;
    scene.add(ring);
    neonBurstLights.push(ring);

    const pl = new THREE.PointLight(
      i % 2 === 0 ? COL.neonMagenta : COL.neonCyan, 8, 25, 2
    );
    pl.position.copy(ring.position);
    pl.userData.life = ring.userData.life;
    scene.add(pl);
    neonBurstLights.push(pl);
  }
}

applyChapter(chapters[0]);

// ─── Camera system ───
const camState = {
  mode: 'chase',
  pos: new THREE.Vector3(0, 3.2, 9),
  look: new THREE.Vector3(0, 1.2, -20),
  shake: 0,
};
const camModes = {
  chase: { offset: new THREE.Vector3(0, 3.2, 9), lookY: 1.2, lookZ: -25, fov: 55 },
  hood: { offset: new THREE.Vector3(0, 1.35, 1.6), lookY: 1.1, lookZ: -40, fov: 68 },
  side: { offset: new THREE.Vector3(6.5, 2.2, 2), lookY: 1.0, lookZ: -8, fov: 50 },
  cinematic: { offset: new THREE.Vector3(-5, 4.5, 12), lookY: 1.5, lookZ: -30, fov: 48 },
  low: { offset: new THREE.Vector3(0.8, 1.0, 7), lookY: 0.8, lookZ: -20, fov: 62 },
  drone: { offset: new THREE.Vector3(0, 14, 18), lookY: 0, lookZ: -40, fov: 45 },
};

let camBlend = 1;
let camFrom = { ...camModes.chase, offset: camModes.chase.offset.clone() };
let camTo = camModes.chase;

function setCameraMode(name) {
  if (camState.mode === name) return;
  camFrom = {
    offset: camState.pos.clone().sub(player.position),
    lookY: camState.look.y,
    lookZ: camState.look.z - player.position.z,
    fov: camera.fov
  };
  camTo = camModes[name] || camModes.chase;
  camState.mode = name;
  camBlend = 0;
}

// ─── Optional input (functional but not required) ───
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
let laneOffset = 0;
let manualCam = 0;
const camCycle = ['chase', 'hood', 'side', 'cinematic', 'low', 'drone'];
addEventListener('keydown', e => {
  if (e.code === 'KeyC') {
    manualCam = (manualCam + 1) % camCycle.length;
    setCameraMode(camCycle[manualCam]);
  }
});

// ─── Title card ───
setTimeout(() => {
  document.getElementById('titlecard').classList.add('hide');
}, 2200);

// ─── HUD clock ───
let nightMinutes = 23 * 60 + 14;

// ─── Drive loop helpers ───
let roadScroll = 0;
let baseSpeed = 28;
let currentSpeed = 28;
let worldZ = 0;
let swayPhase = 0;

function updateRoad(dt) {
  roadScroll += currentSpeed * dt;
  while (roadScroll >= SEG_LEN) {
    roadScroll -= SEG_LEN;
    const first = segments.shift();
    const last = segments[segments.length - 1];
    first.position.z = last.position.z - SEG_LEN;
    segments.push(first);
  }
}

function updateTraffic(dt) {
  for (const car of traffic) {
    const dir = car.rotation.y > 1 ? 1 : -1; // oncoming vs same
    if (dir < 0) {
      car.position.z -= car.userData.speed * dt;
      // relative to player (player also moves "forward" by world scroll)
    } else {
      car.position.z += car.userData.speed * 0.4 * dt;
    }
    // keep near player corridor
    if (car.position.z > player.position.z + 60) {
      car.position.z = player.position.z - 80 - Math.random() * 160;
      car.position.x = (Math.random() < 0.5 ? -1 : 1) * (2.8 + Math.random() * 1.2);
      car.userData.speed = 18 + Math.random() * 22;
    }
    if (car.position.z < player.position.z - 250) {
      car.position.z = player.position.z - 40 - Math.random() * 100;
    }
  }
}

function updateScenery() {
  for (const item of sceneryPool) {
    if (item.position.z > player.position.z + 30) {
      recycleScenery(item, player.position.z - 180 - Math.random() * 120);
      // regenerate type variety by swapping visibility of children is heavy;
      // instead jitter x and scale
      const s = 0.85 + Math.random() * 0.4;
      item.scale.setScalar(s);
    }
  }
}

function updateRain(dt) {
  rainIntensity += (targetRain - rainIntensity) * Math.min(1, dt * 1.2);
  rain.material.opacity = rainIntensity * 0.55;
  if (rainIntensity < 0.02) return;
  const pos = rain.geometry.attributes.position.array;
  for (let i = 0; i < RAIN_N; i++) {
    pos[i * 3 + 1] -= rainVel[i] * dt * (0.7 + rainIntensity);
    pos[i * 3 + 2] += currentSpeed * dt * 0.35;
    if (pos[i * 3 + 1] < 0) {
      pos[i * 3] = player.position.x + (Math.random() - 0.5) * 50;
      pos[i * 3 + 1] = 15 + Math.random() * 30;
      pos[i * 3 + 2] = player.position.z + (Math.random() - 0.5) * 70 - 20;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;
  rain.position.x = player.position.x;
  rain.position.z = player.position.z;
}

function updateNeonBurst(dt) {
  for (let i = neonBurstLights.length - 1; i >= 0; i--) {
    const obj = neonBurstLights[i];
    obj.userData.life -= dt;
    if (obj.userData.spin) {
      obj.rotation.z += obj.userData.spin * dt;
      obj.position.z += currentSpeed * dt * 0.15;
      if (obj.material) obj.material.opacity = Math.max(0, obj.userData.life / 3);
    }
    if (obj.userData.life <= 0) {
      scene.remove(obj);
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) obj.material.dispose();
      neonBurstLights.splice(i, 1);
    }
  }
}

function updateCamera(dt) {
  const ch = chapters[chapterIndex];
  if (!keys.KeyC) {
    // auto camera from chapter when not manually cycling recently
  }
  setCameraMode(ch.camera);

  camBlend = Math.min(1, camBlend + dt * 0.55);
  const e = camBlend * camBlend * (3 - 2 * camBlend);

  const off = new THREE.Vector3().lerpVectors(
    camFrom.offset instanceof THREE.Vector3 ? camFrom.offset : new THREE.Vector3(0, 3, 9),
    camTo.offset,
    e
  );
  const lookY = THREE.MathUtils.lerp(camFrom.lookY ?? 1.2, camTo.lookY, e);
  const lookZOff = THREE.MathUtils.lerp(camFrom.lookZ ?? -25, camTo.lookZ, e);
  const fov = THREE.MathUtils.lerp(camFrom.fov ?? 55, camTo.fov, e);

  // gentle sway
  swayPhase += dt * 0.7;
  const swayX = Math.sin(swayPhase * 0.9) * 0.15 + laneOffset * 0.3;
  const swayY = Math.sin(swayPhase * 1.3) * 0.08;

  const targetPos = player.position.clone().add(off);
  targetPos.x += swayX;
  targetPos.y += swayY;

  camera.position.lerp(targetPos, 1 - Math.pow(0.001, dt));
  const lookAt = new THREE.Vector3(
    player.position.x + laneOffset * 0.2,
    lookY,
    player.position.z + lookZOff
  );
  camera.lookAt(lookAt);
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();

  // neon moment camera punch
  if (ch.special === 'neonMoment' && chapterTime < 3) {
    camera.fov = fov + Math.sin(chapterTime * 8) * 2;
    camera.updateProjectionMatrix();
  }
}

function updatePlayer(dt, ch) {
  const targetSpd = ch.speed + (keys.ArrowUp || keys.KeyW ? 8 : 0) - (keys.ArrowDown || keys.KeyS ? 10 : 0);
  currentSpeed += (targetSpd - currentSpeed) * Math.min(1, dt * 1.5);
  baseSpeed = currentSpeed;

  // auto gentle lane weave + optional steering
  const autoWeave = Math.sin(clock.elapsedTime * 0.35) * 1.4;
  let steer = 0;
  if (keys.ArrowLeft || keys.KeyA) steer -= 1;
  if (keys.ArrowRight || keys.KeyD) steer += 1;
  laneOffset += ((autoWeave + steer * 3.2) - laneOffset) * Math.min(1, dt * 1.8);
  laneOffset = THREE.MathUtils.clamp(laneOffset, -4.5, 4.5);

  player.position.x = laneOffset;
  player.position.z -= currentSpeed * dt * 0.02; // tiny absolute drift for world feel
  worldZ += currentSpeed * dt;

  // move world relative: push segments/scenery/traffic by translating player back periodically
  if (player.position.z < -200) {
    const shift = 200;
    player.position.z += shift;
    for (const s of segments) s.position.z += shift;
    for (const t of traffic) t.position.z += shift;
    for (const s of sceneryPool) s.position.z += shift;
    if (tunnelMesh) tunnelMesh.position.z += shift;
    for (const n of neonBurstLights) n.position.z += shift;
    stars.position.z += shift * 0.3;
    moon.position.z += shift * 0.15;
  }

  player.rotation.y = -laneOffset * 0.02;
  player.rotation.z = -laneOffset * 0.015;

  // move road under us
  for (const s of segments) {
    s.position.z += currentSpeed * dt;
  }
  // wrap segments
  for (const s of segments) {
    if (s.position.z > player.position.z + SEG_LEN * 2) {
      let minZ = Infinity;
      for (const o of segments) minZ = Math.min(minZ, o.position.z);
      s.position.z = minZ - SEG_LEN;
    }
  }

  // scenery & traffic relative motion
  for (const t of traffic) {
    const oncoming = Math.abs(t.rotation.y) > 1;
    if (oncoming) {
      t.position.z += (currentSpeed + t.userData.speed) * dt;
    } else {
      t.position.z += (currentSpeed - t.userData.speed) * dt;
    }
    if (t.position.z > player.position.z + 40) {
      t.position.z = player.position.z - 60 - Math.random() * 180;
      t.position.x = (Math.random() < 0.5 ? -1 : 1) * (2.6 + Math.random() * 1.5);
      t.rotation.y = Math.random() < 0.25 ? Math.PI : 0;
      t.userData.speed = 16 + Math.random() * 24;
    }
  }

  for (const item of sceneryPool) {
    item.position.z += currentSpeed * dt;
    if (item.position.z > player.position.z + 25) {
      recycleScenery(item, player.position.z - 160 - Math.random() * 140);
    }
  }

  if (tunnelMesh) {
    tunnelMesh.position.z = player.position.z - 40;
    tunnelMesh.position.x = 0;
  }

  stars.position.x = player.position.x * 0.1;
  stars.rotation.y += dt * 0.01;
}

function updateChapters(dt) {
  chapterTime += dt;
  const ch = chapters[chapterIndex];
  if (chapterTime >= ch.duration) {
    chapterTime = 0;
    chapterIndex = (chapterIndex + 1) % chapters.length;
    applyChapter(chapters[chapterIndex]);
  }
}

function updateHUD(dt) {
  nightMinutes += dt * 0.8;
  const m = ((nightMinutes % (24 * 60)) + 24 * 60) % (24 * 60);
  const hh = String(Math.floor(m / 60)).padStart(2, '0');
  const mm = String(Math.floor(m % 60)).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
  document.getElementById('spd').textContent = String(Math.round(90 + currentSpeed * 1.4));
  const lat = 34.0522 + Math.sin(worldZ * 0.0003) * 0.4;
  document.getElementById('lat').textContent = `${lat.toFixed(4)}° N`;
}

function updateAtmosphere(dt) {
  fogDensity += (targetFog - fogDensity) * Math.min(1, dt * 0.8);
  scene.fog.density = fogDensity;
  renderer.toneMappingExposure += (exposureTarget - renderer.toneMappingExposure) * Math.min(1, dt * 0.7);

  // wet road sheen pulses with rain
  roadMat.roughness = 0.55 - rainIntensity * 0.25;
  roadMat.metalness = 0.15 + rainIntensity * 0.25;
}

// ─── Resize ───
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Main loop ───
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const ch = chapters[chapterIndex];

  updateChapters(dt);
  updatePlayer(dt, ch);
  updateRain(dt);
  updateNeonBurst(dt);
  updateCamera(dt);
  updateHUD(dt);
  updateAtmosphere(dt);

  // headlight follow
  if (player.userData.spots) {
    for (const s of player.userData.spots) {
      s.target.position.set(s.position.x, 0, 40);
      s.target.updateMatrixWorld();
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
