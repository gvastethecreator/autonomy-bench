<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afterglow — Endless Night Drive</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02040c; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; color: #eef6ff; }
    .grain { position: absolute; inset: -50%; opacity: .075; mix-blend-mode: screen; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E"); animation: grain .18s steps(2) infinite; }
    @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(2%, -2%); } 50% { transform: translate(-3%, 2%); } 75% { transform: translate(1%, 3%); } 100% { transform: translate(-2%, -1%); } }
    .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 43%, transparent 25%, rgba(0,0,8,.12) 55%, rgba(0,0,9,.76) 100%); }
    .top { position: absolute; top: 26px; left: clamp(20px, 4vw, 62px); right: clamp(20px, 4vw, 62px); display: flex; align-items: flex-start; justify-content: space-between; }
    .brand { display: flex; flex-direction: column; gap: 2px; text-transform: uppercase; letter-spacing: .22em; }
    .brand strong { font-size: 13px; font-weight: 800; color: #ffffff; }
    .brand span { color: #6f849d; font-size: 9px; letter-spacing: .28em; }
    .status { display: flex; align-items: center; gap: 9px; color: #a5b6c8; font-size: 10px; letter-spacing: .16em; font-weight: 700; }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #65e8ff; box-shadow: 0 0 14px #65e8ff; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
    .bottom { position: absolute; left: clamp(20px, 4vw, 62px); right: clamp(20px, 4vw, 62px); bottom: 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
    .readout { display: flex; flex-direction: column; gap: 6px; }
    .readout .label, .readout .unit { color: #8ca0b7; font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .readout .number { color: #f2fbff; font-size: clamp(34px, 5vw, 68px); font-weight: 200; letter-spacing: -.07em; line-height: .8; text-shadow: 0 0 22px rgba(104,223,255,.2); }
    .readout .unit { margin-left: 7px; letter-spacing: .1em; }
    .compass { justify-self: center; text-align: center; color: #ced9e8; font-size: 10px; letter-spacing: .3em; font-weight: 700; line-height: 2; }
    .compass i { display: block; width: 1px; height: 30px; background: linear-gradient(#65e8ff, transparent); margin: 0 auto 4px; box-shadow: 0 0 12px #65e8ff; }
    .info { justify-self: end; text-align: right; display: flex; gap: 26px; }
    .metric { display: grid; gap: 5px; }
    .metric b { font-size: 15px; font-weight: 500; letter-spacing: .04em; }
    .metric span { color: #8596aa; font-size: 9px; font-weight: 700; letter-spacing: .17em; }
    .speedbar { position: absolute; left: clamp(20px, 4vw, 62px); bottom: 135px; width: 145px; }
    .speedbar .line { height: 2px; background: rgba(163,183,207,.22); margin-top: 8px; position: relative; overflow: visible; }
    .speedbar .line::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--progress, 62%); background: linear-gradient(90deg, #baffff, #4bd4ff); box-shadow: 0 0 12px rgba(75,212,255,.9); transition: width .25s ease; }
    .help { position: absolute; top: 50%; right: clamp(20px, 4vw, 62px); transform: translateY(-45%); color: rgba(191,210,228,.6); font-size: 9px; line-height: 2.25; text-align: right; letter-spacing: .13em; text-transform: uppercase; }
    .help kbd { border: 1px solid rgba(184,208,235,.3); border-radius: 3px; color: #dbeaff; padding: 2px 5px; font: inherit; letter-spacing: 0; }
    .intro { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); width: min(440px, calc(100vw - 40px)); text-align: center; transition: opacity 1s ease, transform 1s ease; }
    .intro.hidden { opacity: 0; transform: translate(-50%, -67%); }
    .eyebrow { color: #79dfff; font-size: 10px; letter-spacing: .45em; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(36px, 7vw, 76px); font-weight: 200; letter-spacing: -.07em; line-height: .86; text-shadow: 0 0 38px rgba(114,216,255,.27); }
    .intro p { margin: 17px auto 22px; color: #b3c4d6; font-size: 12px; line-height: 1.7; max-width: 310px; }
    button { pointer-events: auto; appearance: none; border: 1px solid rgba(153,231,255,.68); background: rgba(37,119,150,.23); color: #effcff; padding: 12px 21px; cursor: pointer; font: 700 10px/1 Inter, sans-serif; letter-spacing: .24em; text-transform: uppercase; box-shadow: inset 0 0 18px rgba(113,223,255,.13), 0 0 22px rgba(61,191,255,.12); transition: background .2s, transform .2s; }
    button:hover { background: rgba(57,161,199,.4); transform: translateY(-2px); }
    .flash { position: absolute; inset: 0; background: #b9ecff; opacity: 0; transition: opacity .35s; }
    @media (max-width: 650px) { .top { top: 18px; } .bottom { bottom: 20px; grid-template-columns: 1fr auto; } .compass, .help { display: none; } .info { gap: 12px; } .metric:nth-child(2) { display: none; } .speedbar { bottom: 110px; } }
  </style>
</head>
<body>
  <div id="ui">
    <div class="grain"></div><div class="vignette"></div><div class="flash" id="flash"></div>
    <div class="top"><div class="brand"><strong>Afterglow</strong><span>Night transmission</span></div><div class="status"><i class="pulse"></i>LIVE ROUTE</div></div>
    <div class="speedbar"><div class="label">Velocity</div><div class="line" id="speedLine"></div></div>
    <div class="help"><kbd>←</kbd> <kbd>→</kbd> steer<br><kbd>↑</kbd> <kbd>↓</kbd> cruise<br><kbd>space</kbd> overdrive</div>
    <div class="bottom">
      <div class="readout"><div class="label">Current speed</div><div><span class="number" id="speed">118</span><span class="unit">km/h</span></div></div>
      <div class="compass"><i></i><span id="heading">N  024°</span></div>
      <div class="info"><div class="metric"><b id="distance">024.8</b><span>Distance / km</span></div><div class="metric"><b id="time">02:14</b><span>Night time</span></div></div>
    </div>
    <section class="intro" id="intro"><div class="eyebrow">Mile 024 · Pacific Ridge</div><h1>Make the night<br>yours.</h1><p>An endless ribbon of road, carved through the blue hour.</p><button id="drive">Enter the drive</button></section>
  </div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050e);
    scene.fog = new THREE.FogExp2(0x071025, 0.017);
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 560);
    camera.position.set(0, 5.6, 13.8);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.28;
    document.body.prepend(renderer.domElement);

    const world = new THREE.Group(); scene.add(world);
    const roadGroup = new THREE.Group(); world.add(roadGroup);
    const decorGroup = new THREE.Group(); world.add(decorGroup);
    const trafficGroup = new THREE.Group(); world.add(trafficGroup);
    const laneW = 3.25, roadW = 9.7, segmentL = 36, segCount = 12;
    let speed = 118, targetSpeed = 118, distance = 24.8, playerX = 0, steer = 0, started = false, elapsed = 0;
    const keys = new Set();
    const cyan = new THREE.Color(0x66e7ff), tail = new THREE.Color(0xff294f), warm = new THREE.Color(0xffbc79);

    function mat(color, emissive = 0, emissiveIntensity = 0) { return new THREE.MeshStandardMaterial({ color, roughness: .62, metalness: .14, emissive, emissiveIntensity }); }
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x080d1b, roughness: .88, metalness: .15 });
    const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x111a2a, roughness: .8 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xdbeaff, transparent: true, opacity: .8 });
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x71ddff });

    const hemi = new THREE.HemisphereLight(0x7598ff, 0x071018, 1.7); scene.add(hemi);
    const moonLight = new THREE.DirectionalLight(0x9bb8ff, 2.25); moonLight.position.set(-35, 38, -54); scene.add(moonLight);
    const horizonLight = new THREE.PointLight(0x2786db, 18, 95, 1.8); horizonLight.position.set(0, 8, -45); scene.add(horizonLight);

    // A deep gradient dome gives the sky a bright horizon without a texture.
    const skyGeo = new THREE.SphereGeometry(430, 32, 18);
    const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { top: { value: new THREE.Color(0x01020a) }, mid: { value: new THREE.Color(0x0b1c47) }, low: { value: new THREE.Color(0x4579a9) } }, vertexShader: 'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}', fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){float h=normalize(vP).y; vec3 c=mix(mid,top,smoothstep(.08,.9,h)); c=mix(low,c,smoothstep(-.18,.38,h)); gl_FragColor=vec4(c,1.);}' });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    const stars = new THREE.BufferGeometry(), starPositions = [];
    for (let i = 0; i < 900; i++) { const r = 150 + Math.random() * 180, a = Math.random() * Math.PI * 2, h = 16 + Math.random() * 110; starPositions.push(Math.cos(a)*r, h, Math.sin(a)*r - 110); }
    stars.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    const starField = new THREE.Points(stars, new THREE.PointsMaterial({ color: 0xc7eaff, size: .56, sizeAttenuation: true, transparent: true, opacity: .8 })); scene.add(starField);

    const moon = new THREE.Group();
    const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(9, 48), new THREE.MeshBasicMaterial({ color: 0xd8e6ff, transparent: true, opacity: .97 }));
    moonDisc.position.set(-50, 36, -132); moonDisc.lookAt(camera.position); scene.add(moonDisc);
    const halo = new THREE.Mesh(new THREE.CircleGeometry(13, 48), new THREE.MeshBasicMaterial({ color: 0x759eff, transparent: true, opacity: .1, blending: THREE.AdditiveBlending, depthWrite: false })); halo.position.copy(moonDisc.position); halo.position.z += .05; halo.lookAt(camera.position); scene.add(halo);

    function makeMountainLayer(z, scale, color) {
      const shape = new THREE.Shape(); shape.moveTo(-190, -3);
      for (let x = -190; x <= 190; x += 8) { const peak = (Math.sin(x*.045 + z)*.44 + Math.sin(x*.11-z)*.25 + Math.sin(x*.019)*.7 + .7) * scale; shape.lineTo(x, peak); }
      shape.lineTo(190, -3); shape.closePath();
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .96, depthWrite: false })); mesh.position.set(0, -1, z); scene.add(mesh); return mesh;
    }
    makeMountainLayer(-160, 13, 0x071128); makeMountainLayer(-126, 9, 0x0b1c35); makeMountainLayer(-99, 6, 0x102a4a);

    function addRoadSegment(index) {
      const group = new THREE.Group(); group.position.z = -index * segmentL;
      const slab = new THREE.Mesh(new THREE.BoxGeometry(roadW, .18, segmentL), roadMat); slab.position.y = -.1; group.add(slab);
      const leftShoulder = new THREE.Mesh(new THREE.BoxGeometry(1.05, .1, segmentL), shoulderMat); leftShoulder.position.set(-(roadW+1.05)/2, -.03, 0); group.add(leftShoulder);
      const rightShoulder = leftShoulder.clone(); rightShoulder.position.x *= -1; group.add(rightShoulder);
      for (const x of [-laneW/2, laneW/2]) for (let z = -segmentL/2+2; z < segmentL/2; z += 7) { const dash = new THREE.Mesh(new THREE.BoxGeometry(.12, .018, 3.2), lineMat); dash.position.set(x, .015, z); group.add(dash); }
      for (const x of [-(roadW/2-.32), roadW/2-.32]) { const edge = new THREE.Mesh(new THREE.BoxGeometry(.12, .025, segmentL), lineMat); edge.position.set(x,.02,0); group.add(edge); }
      for (const sign of [-1, 1]) for (let z = -segmentL/2+2; z < segmentL/2; z += 6) {
        const reflector = new THREE.Mesh(new THREE.BoxGeometry(.13,.11,.25), glowMat); reflector.position.set(sign*(roadW/2+.45), .18, z); group.add(reflector);
      }
      roadGroup.add(group); return group;
    }
    const segments = Array.from({length:segCount}, (_,i) => addRoadSegment(i));

    function lamp(x, z, flip=false) {
      const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = flip ? Math.PI : 0;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.035,.055,6.6,7), mat(0x1a2535)); pole.position.y=3.3; g.add(pole);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(1.18,.06,.06), mat(0x1a2535)); arm.position.set(-.55,6.38,0); g.add(arm);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(.16,10,8), new THREE.MeshBasicMaterial({color:0xa9eaff})); bulb.position.set(-1.08,6.28,0); g.add(bulb);
      const light = new THREE.PointLight(0x8edbff, 2.4, 15, 2.3); light.position.copy(bulb.position); g.add(light); return g;
    }
    for(let i=0;i<30;i++){ const side=i%2?1:-1; const l=lamp(side*7.0, -i*14-7, side<0); l.userData.baseZ=l.position.z; decorGroup.add(l); }

    // Sparse silhouetted pines pin the road into the landscape.
    const pineMat = mat(0x081724);
    function pine(x,z,s) { const g=new THREE.Group(); const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.09,.14,s*.45,5),pineMat);trunk.position.y=s*.22;g.add(trunk); for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(s*(.26-i*.05),s*.48,7),pineMat);c.position.y=s*.35+i*s*.22;g.add(c);}g.position.set(x,0,z);decorGroup.add(g);return g; }
    for(let i=0;i<70;i++){ const side=i%2?1:-1, p=pine(side*(11+Math.random()*28),-Math.random()*380,1.8+Math.random()*4.5);p.userData.baseZ=p.position.z; }

    function car(color, isPlayer=false) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.15,.5,4.25), mat(color, color, isPlayer?.15:0)); body.position.y=.48; body.geometry.translate(0,0,0); g.add(body);
      const hood = new THREE.Mesh(new THREE.BoxGeometry(1.92,.24,1.3), mat(color)); hood.position.set(0,.82,-1.16); g.add(hood);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.54,.56,1.75), new THREE.MeshStandardMaterial({color:0x101c32, roughness:.18, metalness:.6, transparent:true, opacity:.94})); cabin.position.set(0,1.02,.34); g.add(cabin);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.35,.08,1.25), mat(color)); roof.position.set(0,1.34,.32); g.add(roof);
      for (const x of [-.83,.83]) for (const z of [-1.35,1.35]) { const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.27,12),mat(0x05070d));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.35,z);g.add(wheel); }
      if(isPlayer){
        for(const x of [-.68,.68]) { const head=new THREE.Mesh(new THREE.BoxGeometry(.34,.15,.08),new THREE.MeshBasicMaterial({color:0xbef7ff}));head.position.set(x,.58,-2.15);g.add(head); const glow=new THREE.PointLight(0x69dfff,5,17,2);glow.position.set(x,.5,-2.05);g.add(glow); }
        const under = new THREE.PointLight(0x277eff,4,8,2);under.position.y=.1;g.add(under);
      } else {
        for(const x of [-.69,.69]) {const lamp=new THREE.Mesh(new THREE.BoxGeometry(.34,.14,.1),new THREE.MeshBasicMaterial({color:0xff405e}));lamp.position.set(x,.57,2.14);g.add(lamp);}
      }
      return g;
    }
    const player = car(0x1571b7,true); player.position.set(0,0,5.6); world.add(player);
    const traffic=[];
    const carColors=[0x983a6a,0x226f9f,0x7864aa,0x477b6d,0xc06e4d];
    for(let i=0;i<9;i++){ const c=car(carColors[i%carColors.length]); c.position.set((Math.random()>.5?1:-1)*laneW/2,0,-25-i*27-Math.random()*25); c.userData.offset=Math.random()*12; traffic.push(c); trafficGroup.add(c); }

    const input = (e, down) => { if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault(); if(down) keys.add(e.key); else keys.delete(e.key); };
    addEventListener('keydown', e=>input(e,true)); addEventListener('keyup', e=>input(e,false));
    document.getElementById('drive').addEventListener('click', () => { started=true; document.getElementById('intro').classList.add('hidden'); setTimeout(()=>document.getElementById('intro').style.display='none',1000); });
    addEventListener('pointerdown', e => { if (e.target === renderer.domElement && !started) { started=true; document.getElementById('intro').classList.add('hidden'); } });
    addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight); });

    const speedEl=document.getElementById('speed'), lineEl=document.getElementById('speedLine'), distEl=document.getElementById('distance'), timeEl=document.getElementById('time'), headEl=document.getElementById('heading'), flash=document.getElementById('flash');
    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.05); elapsed+=dt;
      if(started){
        if(keys.has('ArrowUp')||keys.has('w')) targetSpeed=Math.min(178,targetSpeed+dt*34);
        else if(keys.has('ArrowDown')||keys.has('s')) targetSpeed=Math.max(50,targetSpeed-dt*50);
        else targetSpeed += (118-targetSpeed)*dt*.7;
        if(keys.has(' ')||keys.has('Shift')) targetSpeed=Math.min(214,targetSpeed+dt*72);
        const dir=(keys.has('ArrowLeft')||keys.has('a')?-1:0)+(keys.has('ArrowRight')||keys.has('d')?1:0); steer+=((dir*1.15)-steer)*dt*5.5; playerX=THREE.MathUtils.clamp(playerX+steer*dt*3.4,-3.72,3.72);
      }
      speed+=(targetSpeed-speed)*dt*3.3;
      const flow=(speed/3.6)*dt;
      if(started) distance += flow/1000;
      player.position.x += (playerX-player.position.x)*dt*5.5; player.rotation.z += ((-steer*.09)-player.rotation.z)*dt*4; player.rotation.y += ((-steer*.025)-player.rotation.y)*dt*4;
      segments.forEach(s=>{ s.position.z += flow; if(s.position.z > segmentL*1.5) s.position.z -= segmentL*segCount; });
      decorGroup.children.forEach(d=>{ d.position.z += flow; if(d.position.z > 22) d.position.z -= 420; });
      traffic.forEach((c,i)=>{ c.position.z += flow*(1.08+(i%3)*.1); if(c.position.z>16){ c.position.z=-250-Math.random()*110; c.position.x=(Math.random()>.5?1:-1)*laneW/2; } });
      camera.position.x += ((player.position.x*.34)-camera.position.x)*dt*2.4; camera.position.y=5.55+Math.sin(elapsed*.7)*.025; camera.lookAt(player.position.x*.12, .68, -19);
      starField.rotation.y += dt*.0018; halo.scale.setScalar(1+Math.sin(elapsed*.8)*.035);
      const overdrive=keys.has(' ')||keys.has('Shift'); flash.style.opacity=overdrive&&started?'.045':'0';
      speedEl.textContent=Math.round(speed); lineEl.style.setProperty('--progress', `${Math.round(((speed-45)/170)*100)}%`); distEl.textContent=distance.toFixed(1).padStart(5,'0');
      const mins=2+Math.floor(elapsed/60), secs=14+Math.floor(elapsed%60); timeEl.textContent=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`; headEl.textContent=`N  ${String(24+Math.floor(player.position.x*5)).padStart(3,'0')}°`;
      renderer.render(scene,camera);
    }
    animate();
  </script>
</body>
</html>
