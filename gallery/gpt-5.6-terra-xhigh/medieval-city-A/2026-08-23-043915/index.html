<body>
  <div id="grain"></div>
  <header id="masthead"><div class="eyebrow">Procedural settlement · year 1184</div><h1>ASTERFALL</h1><div id="sub">A living city beneath the mountain pass</div></header>
  <aside id="panel" aria-label="City status"><div class="row"><span>Population</span><span class="value" id="pop">1,284</span></div><div class="row"><span>Structures</span><span class="value" id="buildings">—</span></div><div class="row"><span>Hour</span><span class="value" id="clock">06:18</span></div><div class="row"><span>Season</span><span class="value">Harvestfall</span></div><button id="reroll" type="button">New settlement</button><button id="pause" type="button">Pause dawn</button></aside>
  <div id="map" aria-hidden="true"><i class="map-road" style="transform:rotate(0deg)"></i><i class="map-road" style="transform:rotate(60deg)"></i><i class="map-road" style="transform:rotate(120deg)"></i><i class="map-pin"></i></div>
  <div id="help">DRAG · ORBIT<br>SCROLL · ZOOM<br>CLICK · INSPECT A BUILDING</div>
  <div id="selection"></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

    const canvas = document.createElement('canvas'); document.body.appendChild(canvas);
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene(); scene.background = new THREE.Color('#7da4b1'); scene.fog = new THREE.FogExp2('#7da4b1', .0105);

    const root = new THREE.Group(); scene.add(root);
    const world = new THREE.Group(); root.add(world);
    const hemi = new THREE.HemisphereLight('#d8efff','#28341f', 2.1); scene.add(hemi);
    const sun = new THREE.DirectionalLight('#ffe3a4', 3.3); sun.castShadow=true; sun.shadow.mapSize.set(1536,1536); sun.shadow.camera.left=-95; sun.shadow.camera.right=95; sun.shadow.camera.top=95; sun.shadow.camera.bottom=-95; sun.shadow.bias=-.00022; scene.add(sun);
    const sunTarget = new THREE.Object3D(); scene.add(sunTarget); sun.target=sunTarget;
    const ambient = new THREE.PointLight('#ffb357', 7, 34, 2); ambient.position.set(0,10,0); scene.add(ambient);
    const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
    const interactives=[], walkers=[], birds=[], banners=[], lamps=[];
    const selection = document.querySelector('#selection');
    let citySeed = 1148, paused=false, day=.18, then=performance.now(), clockStart=performance.now();
    let houseCount=0;
    const mats = {
      grass:new THREE.MeshStandardMaterial({color:'#304c32', roughness:1}), dirt:new THREE.MeshStandardMaterial({color:'#6d5a3d', roughness:1}),
      stone:new THREE.MeshStandardMaterial({color:'#8c8170', roughness:.95}), stoneDark:new THREE.MeshStandardMaterial({color:'#5f5a53',roughness:1}),
      wood:new THREE.MeshStandardMaterial({color:'#38251a', roughness:1}), plaster:new THREE.MeshStandardMaterial({color:'#c6b896',roughness:1}),
      plasterWarm:new THREE.MeshStandardMaterial({color:'#b69b73',roughness:1}), roof:new THREE.MeshStandardMaterial({color:'#5b302a',roughness:.92}), roofDark:new THREE.MeshStandardMaterial({color:'#3d2729',roughness:1}),
      metal:new THREE.MeshStandardMaterial({color:'#37343a',metalness:.35,roughness:.62}), water:new THREE.MeshStandardMaterial({color:'#466d75',roughness:.32,metalness:.16}),
      gold:new THREE.MeshStandardMaterial({color:'#cc9b42',metalness:.25,roughness:.55}), leaf:new THREE.MeshStandardMaterial({color:'#36502c',roughness:1}), leafLight:new THREE.MeshStandardMaterial({color:'#56713a',roughness:1}), glow:new THREE.MeshStandardMaterial({color:'#ffbc56',emissive:'#ff861d',emissiveIntensity:2.5,roughness:.5})
    };
    function rng(seed){ let s=seed>>>0; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); }
    let random=rng(citySeed);
    const boxG=new THREE.BoxGeometry(1,1,1), cylG=new THREE.CylinderGeometry(1,1,1,10), sphereG=new THREE.SphereGeometry(1,10,8);
    function mesh(g,m,x=0,y=0,z=0,scale){ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); if(scale) o.scale.set(...scale); o.castShadow=o.receiveShadow=true; world.add(o); return o; }
    function localMesh(group,g,m,x=0,y=0,z=0,scale){ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); if(scale) o.scale.set(...scale); o.castShadow=o.receiveShadow=true; group.add(o); return o; }
    function gableGeometry(w,d,h){
      const x=w/2,z=d/2; const p=[-x,0,-z, x,0,-z, x,0,z, -x,0,z, 0,h,-z, 0,h,z];
      const idx=[0,1,4,1,2,5,1,5,4, 2,3,5,3,0,4,3,4,5, 0,3,2,0,2,1, 4,5,3,4,3,0];
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); g.setIndex(idx); g.computeVertexNormals(); return g;
    }
    function addRoad(points, width=2.9){
      const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],.05,p[1])),false,'catmullrom',.18);
      const r=new THREE.Mesh(new THREE.TubeGeometry(curve,50,width,7,false),mats.dirt); r.receiveShadow=true; world.add(r);
      const edge=new THREE.Mesh(new THREE.TubeGeometry(curve,50,width+.34,7,false),new THREE.MeshStandardMaterial({color:'#514837',roughness:1})); edge.position.y=-.035; edge.receiveShadow=true; world.add(edge);
    }
    function addWallSegment(a,b){
      const ax=Math.cos(a)*70,az=Math.sin(a)*70,bx=Math.cos(b)*70,bz=Math.sin(b)*70; const dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz);
      const w=mesh(boxG,mats.stone,(ax+bx)/2,3.2,(az+bz)/2,[len,6.4,2.15]); w.rotation.y=-Math.atan2(dz,dx); w.userData={name:'The outer wall'};
      for(let t=.12;t<.95;t+=.18){ const c=mesh(boxG,mats.stoneDark,ax+dx*t,6.8,az+dz*t,[1.45,1.05,2.5]); c.rotation.y=w.rotation.y; }
    }
    function addTower(a){ const x=Math.cos(a)*70,z=Math.sin(a)*70; const g=new THREE.Group(); g.position.set(x,0,z); world.add(g); const b=localMesh(g,cylG,mats.stone,0,5.3,0,[4.6,10.6,4.6]); const roof=localMesh(g,new THREE.ConeGeometry(5.65,5.8,6),mats.roofDark,0,13.5,0); roof.rotation.y=.25; for(let i=0;i<5;i++){ const ang=i/5*Math.PI*2; localMesh(g,boxG,mats.stoneDark,Math.cos(ang)*4.25,10.8,Math.sin(ang)*4.25,[1.25,1.35,1.25]); } b.userData={name:'Watchtower'}; interactives.push(b); }
    function addTree(x,z,s=1){ const g=new THREE.Group(); g.position.set(x,0,z); world.add(g); localMesh(g,cylG,mats.wood,0,2*s,0,[.42*s,4*s,.42*s]); const l=localMesh(g,sphereG,random()>.5?mats.leaf:mats.leafLight,0,5.2*s,0,[2.5*s,3.2*s,2.5*s]); l.rotation.y=random()*2; }
    function addHouse(x,z,w,d,h,rot,kind='House'){
      const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot+(random()-.5)*.12; world.add(g);
      const base=localMesh(g,boxG,random()>.48?mats.plaster:mats.plasterWarm,0,h/2+.28,0,[w,h,d]);
      localMesh(g,boxG,mats.stoneDark,0,.28,0,[w+0.18,.55,d+.16]);
      const roof=localMesh(g,gableGeometry(w+0.75,d+0.95,Math.max(1.9,h*.58)),random()>.4?mats.roof:mats.roofDark,0,h+.5,0);
      const beam=0.20;
      for(const sx of [-1,1]) { localMesh(g,boxG,mats.wood,sx*(w/2-.16),h/2+.55,-d/2-.12,[beam,h-.35,beam]); localMesh(g,boxG,mats.wood,sx*(w/2-.16),h/2+.55,d/2+.12,[beam,h-.35,beam]); }
      for(const zf of [-1,1]) { localMesh(g,boxG,mats.wood,0,h*.59,zf*(d/2+.13),[w+.2,beam,beam]); localMesh(g,boxG,mats.wood,0,h*.28,zf*(d/2+.13),[w+.2,beam,beam]); }
      const door=localMesh(g,boxG,mats.wood,0,1.17,-d/2-.18,[.78,1.75,.13]);
      for(const wx of [-w*.28,w*.28]){ const win=localMesh(g,boxG,mats.glow,wx,h*.57,-d/2-.19,[.62,.74,.08]); localMesh(g,boxG,mats.wood,wx,h*.57,-d/2-.24,[.74,.11,.1]); localMesh(g,boxG,mats.wood,wx,h*.57,-d/2-.24,[.11,.87,.1]); }
      if(random()>.37){ const ch=localMesh(g,boxG,mats.stoneDark,w*.27,h+1.5,d*.17,[.78,2.6,.78]); ch.rotation.y=.02; }
      base.userData={name:kind}; interactives.push(base); houseCount++;
    }
    function addMarketStall(x,z,rot,color){ const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;world.add(g); for(const sx of [-1,1]) for(const sz of [-1,1]) localMesh(g,cylG,mats.wood,sx*1.2,1.35,sz*.65,[.08,2.7,.08]); const awn=localMesh(g,boxG,new THREE.MeshStandardMaterial({color,roughness:.85}),0,2.55,0,[2.85,.18,1.75]); awn.rotation.z=.08; localMesh(g,boxG,mats.wood,0,.78,0,[2.4,.3,1.25]); for(let n=-.8;n<.9;n+=.4)localMesh(g,sphereG,mats.gold,n,1.05,-.45,[.14,.14,.14]); }
    function addCathedral(){ const g=new THREE.Group();g.position.set(-2,0,11);g.rotation.y=-.13;world.add(g); const body=localMesh(g,boxG,mats.stone,0,8.1,0,[13,15.5,24]); body.userData={name:'Saint Orla’s cathedral'};interactives.push(body); localMesh(g,gableGeometry(14.3,25.4,6.2),mats.stoneDark,0,16.2,0); for(const sx of [-1,1]) for(let z=-8;z<=8;z+=5){ localMesh(g,cylG,mats.stone,sx*6.8,8,z,[1.4,15.5,1.4]); localMesh(g,new THREE.ConeGeometry(1.8,4.8,6),mats.roofDark,sx*6.8,17.8,z); } const tower=localMesh(g,boxG,mats.stone,0,14,-13,[5.8,27,5.8]); localMesh(g,new THREE.ConeGeometry(4.6,9.5,6),mats.roofDark,0,32,-13); const cross=localMesh(g,boxG,mats.gold,0,37.5,-13,[.3,3.2,.3]); localMesh(g,boxG,mats.gold,0,38,-13,[2.1,.3,.3]); for(let z=-8;z<=8;z+=4)localMesh(g,boxG,mats.glow,0,9.5,z-.2,[1.5,4.5,.18]); }
    function addFountain(){ const basin=mesh(cylG,mats.stone,0,.48,0,[4.8,.9,4.8]); basin.userData={name:'The fountain of three rivers'};interactives.push(basin); mesh(cylG,mats.water,0,.94,0,[3.85,.12,3.85]); mesh(cylG,mats.stone,0,2.2,0,[.55,3.5,.55]); mesh(new THREE.SphereGeometry(.8,12,8),mats.gold,0,4.3,0); }
    function addLamp(x,z){ const p=mesh(cylG,mats.wood,x,2,z,[.11,4,.11]); mesh(new THREE.SphereGeometry(.32,10,8),mats.glow,x,4.2,z); lamps.push({x,z}); return p; }
    function addWalker(path, color, offset=0){ const g=new THREE.Group();world.add(g); const robe=localMesh(g,new THREE.ConeGeometry(.42,1.22,6),new THREE.MeshStandardMaterial({color,roughness:1}),0,.72,0); const head=localMesh(g,new THREE.SphereGeometry(.27,8,7),new THREE.MeshStandardMaterial({color:'#c99069',roughness:1}),0,1.56,0); robe.castShadow=head.castShadow=true; walkers.push({g,path,phase:offset,speed:.03+random()*.025}); }
    function addBird(offset){ const g=new THREE.Group(); const wingMat=new THREE.MeshBasicMaterial({color:'#272f36',side:THREE.DoubleSide}); const left=new THREE.Mesh(new THREE.PlaneGeometry(1.8,.45),wingMat),right=left.clone(); left.position.x=-.9;right.position.x=.9;g.add(left,right);world.add(g);birds.push({g,left,right,phase:offset,r:38+random()*44,y:18+random()*22,speed:.08+random()*.05}); }
    function addBanner(x,z,rot,color){ const pole=mesh(cylG,mats.wood,x,5.2,z,[.11,10.4,.11]); pole.rotation.z=0; const cloth=new THREE.Mesh(new THREE.PlaneGeometry(2.2,3.4,4,5),new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:1}));cloth.position.set(x+Math.cos(rot)*1.05,7.9,z+Math.sin(rot)*1.05);cloth.rotation.y=-rot+Math.PI/2;world.add(cloth);banners.push({cloth,base:cloth.geometry.attributes.position.array.slice(),phase:random()*10}); }
    function buildCity(seed){
      while(world.children.length) world.remove(world.children[0]); interactives.length=walkers.length=birds.length=banners.length=lamps.length=0; houseCount=0; random=rng(seed);
      const ground=mesh(new THREE.CircleGeometry(128,80),mats.grass,0,-.12,0); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true;
      const river=mesh(new THREE.PlaneGeometry(220,17,1,1),mats.water,0,.02,-86,[1,1,1]); river.rotation.x=-Math.PI/2;
      const radial=[0,.95,1.9,2.92,3.83,4.85,5.77]; radial.forEach(a=>addRoad([[0,0],[Math.cos(a)*24,Math.sin(a)*24],[Math.cos(a+.12)*66,Math.sin(a+.12)*66],[Math.cos(a+.2)*84,Math.sin(a+.2)*84]],2.3));
      addRoad([[-59,-17],[-36,-20],[-16,-15],[0,0],[21,10],[48,16],[78,14]],3.1); addRoad([[-31,45],[-19,27],[-6,19],[12,22],[29,38]],2.1);
      const ring=[]; for(let i=0;i<=22;i++){const a=i/22*Math.PI*2; ring.push([Math.cos(a)*35,Math.sin(a)*35]);} addRoad(ring,1.45);
      for(let i=0;i<13;i++){const a=i/13*Math.PI*2;addWallSegment(a+.025,a+Math.PI*2/13-.025); if(i%2===0)addTower(a);}
      for(let r=15;r<61;r+=11){ const slots=Math.floor(r*1.1); for(let i=0;i<slots;i++){ const a=i/slots*Math.PI*2+(r%2)*.13; const roadDistance=Math.min(...radial.map(v=>Math.abs(Math.atan2(Math.sin(a-v),Math.cos(a-v))))); if(roadDistance<.085 || (r<26 && random()>.38))continue; const jitter=(random()-.5)*3.2, rr=r+jitter; const x=Math.cos(a)*rr,z=Math.sin(a)*rr; const w=3.7+random()*2.8,d=4.1+random()*3.3,h=3.4+random()*4.5; addHouse(x,z,w,d,h,a+Math.PI/2,random()>.82?'Guild house':'Town house'); if(random()>.85&&r>31)addTree(x+Math.cos(a)*3.2,z+Math.sin(a)*3.2,.75+random()*.45); } }

      for(let i=0;i<9;i++){const a=i/9*Math.PI*2;addMarketStall(Math.cos(a)*8.8,Math.sin(a)*8.8,a+Math.PI/2,['#8a3f31','#bc8b37','#31555a','#765136'][i%4]);}
      for(let a=0;a<Math.PI*2;a+=Math.PI/3)addBanner(Math.cos(a)*5.8,Math.sin(a)*5.8,a,'#b3452f');
      for(let i=0;i<20;i++){const a=i/20*Math.PI*2;addLamp(Math.cos(a)*18,Math.sin(a)*18);}

      document.querySelector('#pop').textContent=(1120+Math.floor(houseCount*1.27)).toLocaleString('en-US');
    }
    buildCity(citySeed);
    function focus(object){ const p=new THREE.Vector3();object.getWorldPosition(p); focusPoint.copy(p); focusUntil=performance.now()+1300; const name=object.userData.name||'City dwelling';selection.textContent=name.toUpperCase();selection.classList.add('show');clearTimeout(focus.timer);focus.timer=setTimeout(()=>selection.classList.remove('show'),2300); }
    const focusPoint=new THREE.Vector3(), desired=new THREE.Vector3(), cameraTarget=new THREE.Vector3(0,4,0);let focusUntil=0;
    let azimuth=.78, elevation=.53, distance=113, dragging=false, moved=false, lx=0,ly=0;
    function setCamera(){ elevation=THREE.MathUtils.clamp(elevation,.18,1.23);distance=THREE.MathUtils.clamp(distance,38,155); desired.set(Math.cos(azimuth)*Math.cos(elevation)*distance,Math.sin(elevation)*distance,Math.sin(azimuth)*Math.cos(elevation)*distance); camera.position.copy(cameraTarget).add(desired);camera.lookAt(cameraTarget); }
    setCamera();
    canvas.addEventListener('pointerdown',e=>{dragging=true;moved=false;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;azimuth-=dx*.006;elevation+=dy*.005;lx=e.clientX;ly=e.clientY;});
    canvas.addEventListener('pointerup',e=>{dragging=false;if(!moved){pointer.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(interactives,false)[0];if(hit)focus(hit.object);}});
    canvas.addEventListener('wheel',e=>{distance+=e.deltaY*.045;},{passive:true});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    document.querySelector('#reroll').onclick=()=>{citySeed=Math.floor(Math.random()*999999);buildCity(citySeed);selection.textContent='A NEW CITY TAKES SHAPE';selection.classList.add('show');setTimeout(()=>selection.classList.remove('show'),1800);};
    document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume dawn':'Pause dawn';};
    const skyDay=new THREE.Color('#89b7cb'), skyDusk=new THREE.Color('#151b38'), fogDay=new THREE.Color('#789da2'),fogDusk=new THREE.Color('#22213c');
    function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-then)/1000);then=now;if(!paused)day=(day+dt*.006)%1; const solar=Math.sin(day*Math.PI*2)*.5+.5;
      sun.position.set(Math.cos(day*Math.PI*2-.8)*85,12+solar*105,Math.sin(day*Math.PI*2-.8)*48); sun.intensity=.28+solar*3.2; hemi.intensity=.65+solar*1.65; ambient.intensity=.4+solar*6.6;
      scene.background.copy(skyDusk).lerp(skyDay,solar);scene.fog.color.copy(fogDusk).lerp(fogDay,solar);scene.fog.density=.0125-solar*.003; renderer.toneMappingExposure=.68+solar*.52;
      const mins=Math.floor((day*24*60+360)%1440);document.querySelector('#clock').textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
      walkers.forEach(w=>{const t=(now*.00006*w.speed*25+w.phase)%1;const a=w.path.a+w.path.dir*t*Math.PI*2;w.g.position.set(Math.cos(a)*w.path.r,.02,Math.sin(a)*w.path.r);w.g.rotation.y=-a+(w.path.dir>0?0:Math.PI);w.g.position.y=.04+Math.sin(now*.008+w.phase*10)*.04;});
      birds.forEach(b=>{const a=now*.00015*b.speed*24+b.phase;b.g.position.set(Math.cos(a)*b.r,b.y+Math.sin(a*2)*2,Math.sin(a)*b.r);b.g.rotation.y=-a+Math.PI/2;b.left.rotation.z=Math.sin(now*.012+b.phase)*.55;b.right.rotation.z=-Math.sin(now*.012+b.phase)*.55;});
      banners.forEach(b=>{const pos=b.cloth.geometry.attributes.position;for(let i=0;i<pos.count;i++){const x=b.base[i*3],y=b.base[i*3+1];pos.setZ(i,Math.sin(now*.003+y*1.6+b.phase)*(.08+Math.max(x,0)*.16));}pos.needsUpdate=true;});
      if(now<focusUntil)cameraTarget.lerp(focusPoint,.045);else cameraTarget.lerp(new THREE.Vector3(0,4,0),.016);setCamera();renderer.render(scene,camera);
    } requestAnimationFrame(animate);
  </script>
