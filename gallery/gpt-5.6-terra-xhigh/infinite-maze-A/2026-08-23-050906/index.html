<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050809" />
  <title>Infinite Maze — Autopilot</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #040606; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; cursor: none; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 0; pointer-events: none; padding: clamp(18px, 3.5vw, 48px); display: flex; flex-direction: column; justify-content: space-between; }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .brand { color: #d9fff3; letter-spacing: .22em; font-size: 11px; line-height: 1.5; text-shadow: 0 0 18px #39e7b455; }
    .brand strong { display: block; font-size: clamp(22px, 3.5vw, 46px); font-weight: 500; letter-spacing: -.08em; line-height: .96; }
    .status { border: 1px solid #49f1c155; background: #0a1714a8; color: #a9ffe3; padding: 9px 12px; font-size: 10px; letter-spacing: .12em; box-shadow: 0 0 30px #24e1a31c inset; }
    .status i { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #62ffd0; box-shadow: 0 0 13px #62ffd0; animation: pulse 1.4s ease-in-out infinite; }
    .bottomline { display: flex; align-items: end; justify-content: space-between; gap: 20px; color: #8ca59e; font-size: 10px; letter-spacing: .12em; }
    .readout { border-left: 2px solid #42cfa7; padding-left: 11px; line-height: 1.65; text-shadow: 0 1px 12px #000; }
    .hint { text-align: right; max-width: 240px; line-height: 1.6; color: #65837a; }
    .scan { position: fixed; inset: 0; pointer-events: none; opacity: .14; mix-blend-mode: overlay; background: repeating-linear-gradient(0deg, transparent 0 3px, #b9ffeb 4px); }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 24%, #000b 100%); }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.76); } }
    @media (max-width: 600px) { .hint { display: none; } .brand strong { font-size: 27px; } }
  </style>
</head>
<body>
  <div class="hud" aria-hidden="true">
    <div class="topline">
      <div class="brand">UNBOUNDED NAVIGATION<strong>∞ MAZE</strong></div>
      <div class="status"><i></i>AUTOPILOT ENGAGED</div>
    </div>
    <div class="bottomline">
      <div class="readout">SECTOR <span id="sector">0000</span><br />PATH VELOCITY <span id="speed">2.8</span> M/S</div>
      <div class="hint">No controls required.<br />The maze chooses the next turn.</div>
    </div>
  </div>
  <div class="scan"></div><div class="vignette"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

    const CELL = 6;
    const EYE = 1.64;
    const SPEED = 2.8;
    const INITIAL_CELLS = 1800;
    const KEEP_AHEAD = 440;
    const EXTRA_CELLS = 1250;
    const route = [{ x: 0, z: 0 }];
    const occupied = new Set(['0,0']);
    let heading = { x: 1, z: 0 };
    let legLength = 7;
    let legRemaining = legLength;
    let completedLegs = 0;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x030606, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030606);
    scene.fog = new THREE.FogExp2(0x07100e, 0.026);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.04, 170);
    const world = new THREE.Group();
    scene.add(world);
    scene.add(new THREE.HemisphereLight(0x6dc7bb, 0x050706, 1.1));
    const moon = new THREE.DirectionalLight(0x9ceedd, 1.15);
    moon.position.set(-22, 38, 12);
    scene.add(moon);

    function key(x, z) { return `${x},${z}`; }
    function turnLeft(v) { return { x: -v.z, z: v.x }; }

    // The route is a growing square spiral. Wide coils leave real walls between
    // passages and guarantee there is always another unexplored sector ahead.
    function extendRoute(minimumCells) {
      while (route.length < minimumCells) {
        if (legRemaining === 0) {
          heading = turnLeft(heading);
          completedLegs += 1;
          if (completedLegs % 2 === 0) legLength += 6;
          legRemaining = legLength;
        }
        const last = route[route.length - 1];
        const next = { x: last.x + heading.x, z: last.z + heading.z };
        route.push(next);
        occupied.add(key(next.x, next.z));
        legRemaining -= 1;
      }
    }

    function makeMesh(geometry, material, count) {
      const mesh = new THREE.InstancedMesh(geometry, material, count);
      mesh.frustumCulled = false;
      world.add(mesh);
      return mesh;
    }

    function clearWorld() {
      for (const child of [...world.children]) {
        world.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
    }

    function buildWorld() {
      clearWorld();
      const floorGeometry = new THREE.BoxGeometry(CELL - 0.035, 0.16, CELL - 0.035);
      const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x15201e, roughness: 0.9, metalness: 0.12 });
      const floors = makeMesh(floorGeometry, floorMaterial, route.length);
      const wallGeometry = new THREE.BoxGeometry(CELL + 0.08, 4.45, 0.22);
      const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x243531, roughness: 0.76, metalness: 0.27 });
      const boundaries = [];
      const directions = [
        { x: 1, z: 0, angle: Math.PI / 2 }, { x: -1, z: 0, angle: Math.PI / 2 },
        { x: 0, z: 1, angle: 0 }, { x: 0, z: -1, angle: 0 }
      ];
      for (const cell of route) {
        for (const dir of directions) {
          if (!occupied.has(key(cell.x + dir.x, cell.z + dir.z))) {
            boundaries.push({ x: (cell.x + dir.x * .5) * CELL, z: (cell.z + dir.z * .5) * CELL, angle: dir.angle, tag: cell.x * 97 + cell.z * 53 + dir.x * 17 + dir.z * 11 });
          }
        }
      }
      const walls = makeMesh(wallGeometry, wallMaterial, boundaries.length);
      const lampGeometry = new THREE.BoxGeometry(1.35, 0.055, 0.13);
      const lampMaterial = new THREE.MeshBasicMaterial({ color: 0x77ffe0, transparent: true, opacity: 0.95 });
      const lamps = [];
      const matrix = new THREE.Matrix4();
      const rotation = new THREE.Quaternion();
      const position = new THREE.Vector3();
      const scale = new THREE.Vector3(1, 1, 1);
      route.forEach((cell, index) => {
        position.set(cell.x * CELL, -0.1, cell.z * CELL);
        matrix.compose(position, rotation, scale);
        floors.setMatrixAt(index, matrix);
      });
      boundaries.forEach((wall, index) => {
        position.set(wall.x, 2.12, wall.z);
        rotation.setFromAxisAngle(new THREE.Vector3(0, 1, 0), wall.angle);
        matrix.compose(position, rotation, scale);
        walls.setMatrixAt(index, matrix);
        if (Math.abs(wall.tag * 17) % 9 === 0) lamps.push(wall);
      });
      const lampMesh = makeMesh(lampGeometry, lampMaterial, lamps.length);
      lamps.forEach((lamp, index) => {
        const inset = lamp.angle === 0 ? 0.15 : -0.15;
        position.set(lamp.x + (lamp.angle === 0 ? 0 : inset), 3.48, lamp.z + (lamp.angle === 0 ? inset : 0));
        rotation.setFromAxisAngle(new THREE.Vector3(0, 1, 0), lamp.angle);
        matrix.compose(position, rotation, scale);
        lampMesh.setMatrixAt(index, matrix);
      });
      floors.instanceMatrix.needsUpdate = true;
      walls.instanceMatrix.needsUpdate = true;
      lampMesh.instanceMatrix.needsUpdate = true;
    }

    function sampleRoute(distance) {
      const step = Math.max(0, distance / CELL);
      const index = Math.min(route.length - 2, Math.floor(step));
      const blend = step - index;
      const a = route[index];
      const b = route[index + 1];
      return { x: THREE.MathUtils.lerp(a.x, b.x, blend) * CELL, z: THREE.MathUtils.lerp(a.z, b.z, blend) * CELL, index };
    }

    extendRoute(INITIAL_CELLS);
    buildWorld();
    const sector = document.getElementById('sector');
    const start = performance.now();
    function animate(now) {
      const elapsed = (now - start) / 1000;
      const travelled = elapsed * SPEED;
      const current = sampleRoute(travelled);
      if (route.length - current.index < KEEP_AHEAD) {
        extendRoute(route.length + EXTRA_CELLS);
        buildWorld();
      }
      const future = sampleRoute(travelled + CELL * 1.25);
      const bob = Math.sin(elapsed * 7.2) * 0.028;
      camera.position.set(current.x, EYE + bob, current.z);
      camera.lookAt(future.x, EYE - 0.05 + bob, future.z);
      sector.textContent = String(Math.floor(current.index / 36)).padStart(4, '0');
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
