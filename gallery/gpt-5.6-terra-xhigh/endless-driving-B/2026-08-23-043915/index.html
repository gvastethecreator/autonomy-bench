<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nightline — Endless Drive</title>
  <style>
    :root { color-scheme: dark; --ice:#bff7ff; --aqua:#35d8f5; --ink:#02050c; }
    * { box-sizing:border-box; } html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#02050c; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    canvas { display:block; }
    #vignette, #grain { pointer-events:none; position:fixed; inset:0; z-index:3; }
    #vignette { background:radial-gradient(ellipse at center,transparent 36%,rgba(0,0,0,.28) 75%,rgba(0,0,0,.75) 120%); }
    #grain { opacity:.16; mix-blend-mode:soft-light; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"); }
    #hud { position:fixed; inset:0; z-index:4; pointer-events:none; padding:clamp(18px,3vw,42px); color:var(--ice); text-transform:uppercase; letter-spacing:.15em; font-size:10px; font-weight:650; text-shadow:0 0 14px rgba(94,231,255,.9); }
    .top { display:flex; justify-content:space-between; align-items:flex-start; }
    .brand { display:flex; gap:12px; align-items:center; }
    .mark { width:31px; height:31px; border:1px solid rgba(133,244,255,.8); border-radius:50%; display:grid; place-items:center; box-shadow:0 0 18px rgba(60,218,246,.34),inset 0 0 15px rgba(60,218,246,.12); }
    .mark:after { content:""; width:10px; height:10px; border-radius:50%; background:var(--aqua); box-shadow:0 0 14px 4px var(--aqua); }
    h1 { font-size:11px; margin:0; line-height:1.15; letter-spacing:.28em; } h1 span { display:block; color:rgba(190,247,255,.52); font-size:8px; letter-spacing:.22em; margin-top:5px; }
    .status { text-align:right; color:rgba(205,251,255,.72); line-height:1.7; font-size:9px; } .status b { color:#d7fbff; font-weight:700; }
    .bottom { position:absolute; left:clamp(18px,3vw,42px); right:clamp(18px,3vw,42px); bottom:clamp(19px,3.2vw,43px); display:flex; align-items:flex-end; justify-content:space-between; }
    .readout { min-width:174px; } .readout label { color:rgba(191,247,255,.54); display:block; margin-bottom:4px; font-size:8px; }
    #speed { font-size:clamp(43px,7vw,77px); line-height:.8; letter-spacing:-.075em; font-weight:260; text-shadow:0 0 25px rgba(42,216,247,.65); } #speed small { font-size:9px; letter-spacing:.16em; margin-left:8px; color:rgba(199,248,255,.65); }
    .meter { display:flex; gap:3px; margin-top:16px; height:3px; } .meter i { width:14px; background:rgba(143,246,255,.15); box-shadow:0 0 5px transparent; } .meter i.on { background:#6af3ff; box-shadow:0 0 8px #3edfed; }
    .route { text-align:right; padding-bottom:2px; color:rgba(199,248,255,.65); line-height:1.8; font-size:9px; } .route strong { color:#f0feff; font-size:10px; letter-spacing:.2em; }
    #prompt { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; transition:opacity .9s ease, transform .9s ease; } #prompt.hide { opacity:0; transform:translate(-50%,-43%); }
    #prompt .line { width:50px; height:1px; background:var(--aqua); margin:0 auto 15px; box-shadow:0 0 12px var(--aqua); } #prompt strong { display:block; font-size:10px; letter-spacing:.32em; } #prompt span { display:block; margin-top:9px; font-size:8px; color:rgba(201,249,255,.58); letter-spacing:.18em; }
    #cursor { position:fixed; z-index:5; pointer-events:none; left:50%; bottom:25%; transform:translateX(-50%); width:110px; height:24px; border-top:1px solid rgba(120,239,255,.28); border-radius:50%; opacity:.9; }
    #cursor:before,#cursor:after { content:""; position:absolute; top:-4px; width:1px; height:8px; background:#8cf7ff; box-shadow:0 0 7px #51e6f5; } #cursor:before { left:12px; } #cursor:after { right:12px; }
    @media (max-width:620px) { #hud { padding:20px; } .status { display:none; } .route { font-size:8px; } #cursor { bottom:29%; transform:translateX(-50%) scale(.82); } }
  </style>
</head>
<body>
  <div id="vignette"></div><div id="grain"></div>
  <div id="hud">
    <div class="top"><div class="brand"><div class="mark"></div><h1>NIGHTLINE<span>Autonomous road system</span></h1></div><div class="status"><b>02:17:43</b> LOCAL TIME<br><span id="weather">CLEAR / 19°</span><br>LAT 34.08° · W 118.24°</div></div>
    <div id="prompt"><div class="line"></div><strong>Enter the flow</strong><span>Arrow keys / drag to steer · Space to boost</span></div>
    <div class="bottom"><div class="readout"><label>Velocity</label><div id="speed">088<small>KM/H</small></div><div class="meter" id="meter"></div></div><div class="route"><strong>COASTAL 07</strong><br><span id="distance">000.0 KM</span> · NIGHT ROUTE<br>NO DESTINATION SET</div></div>
  </div><div id="cursor"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script>
  (() => {
    const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x030713,1); renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
    const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x050b19,.013);
    const camera=new THREE.PerspectiveCamera(61,innerWidth/innerHeight,.1,430); camera.position.set(0,1.6,4);
    const clock=new THREE.Clock(), root=new THREE.Group(); scene.add(root);
    const hemi=new THREE.HemisphereLight(0x76c8ff,0x02030a,1.3); scene.add(hemi); const moonLight=new THREE.PointLight(0x67d8ff,12,110,1.7); moonLight.position.set(-38,34,-94); scene.add(moonLight);
    const glowMat=new THREE.MeshBasicMaterial({color:0xb9f8ff,transparent:true,opacity:.95});
    const moon=new THREE.Mesh(new THREE.SphereGeometry(9,36,24),new THREE.MeshBasicMaterial({color:0xcff8ff,transparent:true,opacity:.92})); moon.position.set(-37,28,-150); scene.add(moon);
    const moonHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture((()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,5,64,64,64);g.addColorStop(0,'rgba(140,235,255,.38)');g.addColorStop(.25,'rgba(104,196,255,.15)');g.addColorStop(1,'rgba(90,175,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return c})()),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); moonHalo.position.copy(moon.position); moonHalo.scale.set(70,70,1); scene.add(moonHalo);

    // Dense constellations, deliberately layered for a deep parallax sky.
    const stars=[]; for(let i=0;i<1050;i++){const r=120+Math.random()*260,a=Math.random()*Math.PI*2, y=8+Math.pow(Math.random(),.55)*105; stars.push(Math.cos(a)*r,y,Math.sin(a)*r-80);} const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3)); const starMat=new THREE.PointsMaterial({color:0xaeeeff,size:.42,sizeAttenuation:true,transparent:true,opacity:.9}); const starField=new THREE.Points(starGeo,starMat);scene.add(starField);
    const dust=[]; for(let i=0;i<430;i++) dust.push((Math.random()-.5)*58,Math.random()*12-.5,-Math.random()*220); const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dust,3)); const dustPts=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0x58d9ee,size:.075,transparent:true,opacity:.48,blending:THREE.AdditiveBlending}));root.add(dustPts);

    function curve(t){ return Math.sin(t*.0105)*15 + Math.sin(t*.027)*5 + Math.sin(t*.0041)*18; }
    const roadW=10.6, seg=3.2, N=104, roadPositions=new Float32Array(N*6*3), roadColors=new Float32Array(N*6*3), edgePositions=new Float32Array(N*12*3);
    const roadGeo=new THREE.BufferGeometry(); roadGeo.setAttribute('position',new THREE.BufferAttribute(roadPositions,3)); roadGeo.setAttribute('color',new THREE.BufferAttribute(roadColors,3));
    const road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.72,metalness:.08,side:THREE.DoubleSide}));root.add(road);
    const edgeGeo=new THREE.BufferGeometry();edgeGeo.setAttribute('position',new THREE.BufferAttribute(edgePositions,3));const edges=new THREE.Mesh(edgeGeo,new THREE.MeshBasicMaterial({color:0x53ddeb,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));root.add(edges);
    const stripeGeo=new THREE.BoxGeometry(.19,.025,1.48), stripes=[]; for(let i=0;i<29;i++){const m=new THREE.Mesh(stripeGeo,new THREE.MeshBasicMaterial({color:0xd5fbff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));root.add(m);stripes.push(m);}
    const reflectorGeo=new THREE.BoxGeometry(.20,.28,.20), reflectors=[]; for(let i=0;i<56;i++){const m=new THREE.Mesh(reflectorGeo,new THREE.MeshBasicMaterial({color:i%5===0?0xff315c:0x69efff,transparent:true,opacity:.88,blending:THREE.AdditiveBlending}));root.add(m);reflectors.push(m);}
    const poles=[];const poleMat=new THREE.MeshStandardMaterial({color:0x0b2637,metalness:.7,roughness:.34}); for(let i=0;i<21;i++){const g=new THREE.Group(),p=new THREE.Mesh(new THREE.CylinderGeometry(.045,.075,5.4,6),poleMat),head=new THREE.Mesh(new THREE.BoxGeometry(.46,.10,.22),new THREE.MeshBasicMaterial({color:0xbefaff}));head.position.y=2.7;g.add(p,head);root.add(g);poles.push(g);}
    function pos(a,i,x,y,z){a[i]=x;a[i+1]=y;a[i+2]=z;}
    function setQuad(arr,offset,a,b,c,d){pos(arr,offset,...a);pos(arr,offset+3,...b);pos(arr,offset+6,...c);pos(arr,offset+9,...a);pos(arr,offset+12,...c);pos(arr,offset+15,...d);}
    function updateTrack(travel){
      const phase=travel%seg;
      for(let i=0;i<N;i++){const z0=phase-i*seg,z1=z0-seg,t0=-travel-i*seg,t1=t0-seg,x0=curve(t0),x1=curve(t1),dx=x1-x0;const norm=Math.sqrt(dx*dx+seg*seg),ox=seg/norm*(roadW*.5),oz=-dx/norm*(roadW*.5),base=i*18;
        setQuad(roadPositions,base,[x0-ox,0,z0-oz],[x0+ox,0,z0+oz],[x1+ox,0,z1+oz],[x1-ox,0,z1-oz]);
        const c=.032+Math.max(0,1-i/N)*.022; for(let k=0;k<18;k+=3){roadColors[base+k]=c*.48;roadColors[base+k+1]=c*.92;roadColors[base+k+2]=c*1.35;}
        const eb=i*36,w=roadW*.5+.08;const ex0=seg/norm*w,ez0=-dx/norm*w;setQuad(edgePositions,eb,[x0-ex0,.016,z0-ez0],[x0-ex0+seg/norm*.075,.016,z0-ez0-dx/norm*.075],[x1-ex0+seg/norm*.075,.016,z1-ez0-dx/norm*.075],[x1-ex0,.016,z1-ez0]);setQuad(edgePositions,eb+18,[x0+ex0,.016,z0+ez0],[x0+ex0-seg/norm*.075,.016,z0+ez0+dx/norm*.075],[x1+ex0-seg/norm*.075,.016,z1+ez0+dx/norm*.075],[x1+ex0,.016,z1+ez0]);
      } roadGeo.attributes.position.needsUpdate=true; roadGeo.attributes.color.needsUpdate=true;edgeGeo.attributes.position.needsUpdate=true;
      stripes.forEach((m,i)=>{const d=7+i*11,z=phase-d,t=-travel-d,x=curve(t),x2=curve(t-1.5);m.position.set((x+x2)/2,.028,z-.74);m.rotation.y=Math.atan2(x2-x,-1.5);m.visible=z<3;});
      reflectors.forEach((m,i)=>{const d=4+i*5.9,z=phase-d,t=-travel-d,x=curve(t),x2=curve(t-.4),side=i%2?1:-1,angle=Math.atan2(x2-x,-.4),nx=Math.cos(angle),nz=-Math.sin(angle);m.position.set(x+nx*(roadW*.5+.48)*side,.18,z);m.rotation.y=angle;m.visible=z<3;});
      poles.forEach((g,i)=>{const d=18+i*17,z=phase-d,t=-travel-d,x=curve(t),x2=curve(t-.5),angle=Math.atan2(x2-x,-.5),nx=Math.cos(angle),side=i%2?1:-1;g.position.set(x+nx*(roadW*.5+5.8)*side,2.7,z);g.rotation.y=angle;g.visible=z<2;});
    }
    // Horizon skyline: static prisms make the road feel like it has a destination without becoming a city scene.
    const horizon=new THREE.Group();scene.add(horizon); const skylineMat=new THREE.MeshStandardMaterial({color:0x071322,roughness:.82,metalness:.15,emissive:0x02080f}); for(let i=0;i<72;i++){const h=2+Math.random()*13,w=1.5+Math.random()*5,b=new THREE.Mesh(new THREE.BoxGeometry(w,h,2+Math.random()*4),skylineMat);b.position.set((Math.random()-.5)*155,h/2-1,-170-Math.random()*32);horizon.add(b);if(Math.random()>.32){const win=new THREE.Mesh(new THREE.BoxGeometry(.17,.12,.02),glowMat);win.position.set(b.position.x+(Math.random()-.5)*w*.7,b.position.y+(Math.random()-.25)*h*.6,b.position.z-2.05);horizon.add(win);}}
    const mountainGeo=new THREE.BufferGeometry();const mp=[];for(let i=0;i<45;i++){const x=-130+i*6,h=5+Math.random()*23;mp.push(x,0,-126,x+3,h,-139,x+6,0,-126);}mountainGeo.setAttribute('position',new THREE.Float32BufferAttribute(mp,3));mountainGeo.computeVertexNormals();scene.add(new THREE.Mesh(mountainGeo,new THREE.MeshStandardMaterial({color:0x07101f,roughness:1,side:THREE.DoubleSide})));
    const hood=new THREE.Mesh(new THREE.SphereGeometry(11,32,12,0,Math.PI*2,0,.7),new THREE.MeshStandardMaterial({color:0x07101b,metalness:.85,roughness:.22}));hood.scale.set(1.2,.11,.50);hood.position.set(0,-1.58,-.65);camera.add(hood);scene.add(camera); const dashGlow=new THREE.PointLight(0x38d9fa,2.2,7);dashGlow.position.set(0,-.7,2);camera.add(dashGlow);
    let travel=0, player=0, steer=0, boost=0, touched=false, distance=0;const speedEl=document.querySelector('#speed'),distEl=document.querySelector('#distance'),prompt=document.querySelector('#prompt'),meter=document.querySelector('#meter');for(let i=0;i<11;i++){const bit=document.createElement('i');meter.appendChild(bit);}
    function engage(){if(!touched){touched=true;prompt.classList.add('hide');}}
    addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();if(e.code==='ArrowLeft')steer=-1;if(e.code==='ArrowRight')steer=1;if(e.code==='Space')boost=1;engage();});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight')steer=0;if(e.code==='Space')boost=0;});
    let dragStart=null; addEventListener('pointerdown',e=>{dragStart=e.clientX;engage();});addEventListener('pointermove',e=>{if(dragStart!==null){steer=Math.max(-1,Math.min(1,(e.clientX-dragStart)/110));}});addEventListener('pointerup',()=>{dragStart=null;steer=0;});
    function frame(){const dt=Math.min(clock.getDelta(),.045),base=25+(boost?23:0);travel+=base*dt;distance+=base*dt/1000;player+=((steer*3.55)-player)*dt*3.2;const here=curve(-travel),ahead=curve(-travel-58);camera.position.x=here+player;camera.position.y=1.52+Math.sin(travel*.31)*.018;camera.lookAt(ahead+player*.22,1.16,-56);hood.position.x=-player*.10;hood.rotation.z=player*.018;updateTrack(travel);starField.rotation.y=travel*.00017;dustPts.position.z=(travel*2)%5;moonHalo.material.opacity=.18+Math.sin(travel*.08)*.035;
      const sp=Math.round(88+(boost?42:0)+Math.abs(steer)*2);speedEl.firstChild.nodeValue=String(sp).padStart(3,'0');distEl.textContent=distance.toFixed(1).padStart(5,'0')+' KM';[...meter.children].forEach((n,i)=>n.classList.toggle('on',i<(boost?11:7+Math.round(Math.abs(steer)*2))));renderer.render(scene,camera);requestAnimationFrame(frame);}
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}); updateTrack(0);frame();
  })();
  </script>
</body>
</html>
