<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bellwether — A Living Medieval City</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #10151d; font-family: Georgia, 'Times New Roman', serif; }
    canvas { display: block; }
    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(9,12,19,.58) 100%); mix-blend-mode: multiply; }
    #title { position: fixed; left: 30px; top: 26px; color: #f7e5b5; text-shadow: 0 2px 8px #000; letter-spacing: .11em; pointer-events: none; }
    #title small { display:block; color:#d4b86f; font: 11px/1.2 system-ui,sans-serif; letter-spacing:.19em; margin-bottom:5px; }
    #title strong { font-size: 25px; font-weight: normal; }
    #hint { position: fixed; right: 26px; bottom: 22px; color: rgba(247,229,181,.8); font: 11px/1.35 system-ui,sans-serif; letter-spacing:.06em; text-align:right; pointer-events:none; }
    #legend { position: fixed; left: 30px; bottom: 25px; color: #e8d39b; border-left: 1px solid rgba(232,211,155,.55); padding: 3px 0 3px 11px; font: 11px/1.5 system-ui,sans-serif; letter-spacing:.07em; pointer-events:none; }
    #legend b { color:#fff1c4; font-weight:600; }
  </style>
</head>
<body>
  <div id="title"><small>THE KINGDOM OF AURELIA</small><strong>Bellwether</strong></div>
  <div id="legend"><b id="clock">Dawn, 06:18</b><br><span id="population">178 souls awake</span></div>
  <div id="hint">DRAG TO ORBIT &nbsp;•&nbsp; SCROLL TO WANDER<br>the city wakes with the sun</div>
  <div id="vignette"></div>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x819cb1);
    scene.fog = new THREE.FogExp2(0x819cb1, 0.014);
    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 180);
    camera.position.set(24, 23, 29);
    const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
    renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.2, 0); controls.enableDamping = true; controls.dampingFactor = .045;
    controls.minDistance = 12; controls.maxDistance = 62; controls.maxPolarAngle = Math.PI * .47;

    const hemi = new THREE.HemisphereLight(0xcce8ff, 0x483a2e, 2.25); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffd694, 3.1); sun.position.set(-22, 30, 13); sun.castShadow = true;
    sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-30; sun.shadow.camera.right=30; sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30; scene.add(sun);
    const glow = new THREE.PointLight(0xffbc68, 1.7, 30, 2); glow.position.set(-5, 9, 4); scene.add(glow);

    const rnd = (a,b) => a + Math.random()*(b-a);
    const mat = (color, rough=1, metal=0) => new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
    const stone = mat(0x746d63), darkStone = mat(0x4a4744), roofRed = mat(0x663831), roofGold = mat(0x84613c), plaster = mat(0xd3c19b), wood = mat(0x38291f), roadMat = mat(0x786d58), grass = mat(0x536f45), leaf = mat(0x3e5935), water = new THREE.MeshStandardMaterial({color:0x4e8ead, roughness:.18, metalness:.15});
    const windowMat = new THREE.MeshStandardMaterial({color:0xffb552, emissive:0xe97124, emissiveIntensity:1.5, roughness:.4});
    const geometry = { box:new THREE.BoxGeometry(1,1,1), cylinder:new THREE.CylinderGeometry(1,1,1,8), cone:new THREE.ConeGeometry(1,1,4), sphere:new THREE.SphereGeometry(1,10,8) };
    function mesh(g,m,x,y,z,s=[1,1,1], cast=true){ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.scale.set(...s); o.castShadow=cast; o.receiveShadow=true; scene.add(o); return o; }

    // textured earth, deliberately irregular to make the town feel inhabited
    const ground = mesh(new THREE.CircleGeometry(44, 96), grass, 0,-.12,0,[1,1,1],false); ground.receiveShadow=true;
    for(let i=0;i<360;i++) { const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*40; const c=mesh(geometry.sphere, Math.random()>.56?mat(0x68834e):mat(0x445b38), Math.cos(a)*r, .025, Math.sin(a)*r, [rnd(.025,.075),rnd(.015,.04),rnd(.025,.075)],false); c.rotation.y=rnd(0,6); }

    // radial cobbled streets with a ring road
    function road(x,z,w,l,rot){ const r=mesh(geometry.box, roadMat,x,.012,z,[w,.04,l],false); r.rotation.y=rot; for(let i=0;i<Math.floor(l*5);i++){ const u=(i/Math.floor(l*5)-.5)*l, side=rnd(-w*.42,w*.42); const px=x+Math.sin(rot)*u+Math.cos(rot)*side, pz=z+Math.cos(rot)*u-Math.sin(rot)*side; mesh(geometry.box, i%3?mat(0x8c806b):darkStone,px,.06,pz,[rnd(.15,.3),.045,rnd(.1,.22)],false).rotation.y=rnd(0,3); } return r; }
    for(let i=0;i<7;i++){ const a=i*Math.PI*2/7+.09; road(Math.sin(a)*7.5,Math.cos(a)*7.5,1.55,25,a,); }
    const ring = new THREE.RingGeometry(10.5,12.1,96); const ringMesh = new THREE.Mesh(ring,roadMat); ringMesh.rotation.x=-Math.PI/2; ringMesh.position.y=.015; ringMesh.receiveShadow=true; scene.add(ringMesh);
    for(let i=0;i<190;i++){ const a=Math.random()*Math.PI*2, r=rnd(10.7,11.9); mesh(geometry.box, i%4?mat(0x867a65):darkStone,Math.cos(a)*r,.058,Math.sin(a)*r,[rnd(.12,.26),.04,rnd(.09,.22)],false).rotation.y=rnd(0,3); }

    // defensive wall with gates, towers, and pennants
    const wallR=21.5;
    for(let i=0;i<34;i++){ const a=i*Math.PI*2/34, x=Math.cos(a)*wallR,z=Math.sin(a)*wallR; const block=mesh(geometry.box,stone,x,1.8,z,[3.8,2.8,.85]); block.rotation.y=-a; for(let k=0;k<5;k++) { const along=(k-2)*.67; const bx=x+Math.cos(a)*along, bz=z+Math.sin(a)*along; mesh(geometry.box,darkStone,bx,3.35,bz,[.38,.38,.92]); } }
    function tower(a){ const x=Math.cos(a)*wallR,z=Math.sin(a)*wallR; mesh(geometry.cylinder,darkStone,x,2.25,z,[1.6,4.5,1.6]); mesh(geometry.cone,roofRed,x,5.5,z,[2.15,2.9,2.15]); for(let j=0;j<7;j++){ const q=a+j*Math.PI*2/7; mesh(geometry.box,stone,x+Math.cos(q)*1.25,4.65,z+Math.sin(q)*1.25,[.38,.45,.38]); } const pole=mesh(geometry.box,wood,x,7.15,z,[.045,2.8,.045]); const flag=mesh(new THREE.PlaneGeometry(1.6,.8,5,1),mat(0xc59b42),x+.76,7.65,z,[1,1,1],false); flag.rotation.y=-a; flags.push({flag,a,seed:Math.random()*5}); }
    const flags=[]; [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(tower);
    // city gate arch illusion
    for(const a of [0,Math.PI]) { const x=Math.cos(a)*wallR,z=Math.sin(a)*wallR; mesh(geometry.box,darkStone,x,1.45,z,[3.8,2.9,.96]); mesh(geometry.box,mat(0x211a16),x,1.15,z,[1.65,1.55,1.05]); }

    const windows=[];
    function building(x,z,w,d,h,rot,kind=0){
      const g=new THREE.Group(); scene.add(g); g.position.set(x,0,z); g.rotation.y=rot;
      const body=new THREE.Mesh(geometry.box,kind===2?stone:plaster); body.scale.set(w,h,d); body.position.y=h/2; body.castShadow=true; body.receiveShadow=true; g.add(body);
      // timber-frame grid
      if(kind!==2){ for(const yy of [h*.29,h*.61,h*.91]){ const beam=new THREE.Mesh(geometry.box,wood); beam.scale.set(w*1.07,.10,.12); beam.position.set(0,yy,-d*.51); g.add(beam.clone(),beam); } for(let j=-1;j<=1;j+=2){ const beam=new THREE.Mesh(geometry.box,wood); beam.scale.set(.12,h*.98,.12); beam.position.set(j*w*.34,h*.5,-d*.52); g.add(beam); } const diag=new THREE.Mesh(geometry.box,wood); diag.scale.set(.08,h*.72,.1); diag.position.set(0,h*.54,-d*.54); diag.rotation.z=.67; g.add(diag); }
      const roof=new THREE.Mesh(geometry.cone,kind===1?roofGold:roofRed); roof.scale.set(w*.86,Math.max(1.7,h*.48),d*.86); roof.position.y=h+Math.max(.75,h*.24); roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
      const door=new THREE.Mesh(geometry.box,wood); door.scale.set(w*.22,h*.38,.10); door.position.set(0,h*.19,-d*.53); g.add(door);
      for(let j=-1;j<=1;j+=2){ const win=new THREE.Mesh(geometry.box,windowMat); win.scale.set(w*.14,h*.16,.04); win.position.set(j*w*.31,h*.62,-d*.555); g.add(win); windows.push({win,phase:Math.random()*7}); }
      // patched awning on some street-facing homes
      if(kind===1){ const awn=new THREE.Mesh(new THREE.PlaneGeometry(w*.9,.75),mat(0xb24f36)); awn.position.set(0,h*.46,-d*.7); awn.rotation.x=-.45; g.add(awn); }
    }
    const lots=[];
    for(let ringNo=0;ringNo<2;ringNo++) for(let i=0;i<(ringNo?19:12);i++){ const a=i*Math.PI*2/(ringNo?19:12)+ringNo*.16, r=ringNo?16.2:7.4; if(ringNo===0 && (i===0||i===6)) continue; lots.push([Math.cos(a)*r,Math.sin(a)*r,a+Math.PI/2,rnd(1.55,2.35),rnd(1.35,2.1),rnd(2.3,4.1),i%5]); }
    lots.forEach(([x,z,rot,w,d,h,k])=>building(x,z,w,d,h,rot,k===1?1:k===3?2:0));

    // great hall breaks the grid: a city landmark
    building(-4.2,4.4,4.0,2.9,5.8,-.4,2);
    const hallRoof=mesh(geometry.cone,roofGold,-4.2,8.45,4.4,[4.2,3.1,3.2]); hallRoof.rotation.y=Math.PI/4-.4;
    const bellTower=mesh(geometry.box,stone,-4.2,9.4,4.4,[1.15,3,1.15]); mesh(geometry.cone,roofRed,-4.2,11.25,4.4,[1.7,1.65,1.7]); const bell=mesh(geometry.sphere,mat(0xb89047,.3,.7),-4.2,9.3,3.78,[.34,.42,.18]);

    // fountain, market, green life
    mesh(geometry.cylinder,darkStone,0,.28,0,[2.35,.55,2.35]); mesh(geometry.cylinder,water,0,.56,0,[1.78,.07,1.78],false); mesh(geometry.cylinder,stone,0,1.23,0,[.38,1.45,.38]); const spray=mesh(geometry.sphere,mat(0xb9eaff,.12,.1),0,2.13,0,[.25,.35,.25],false);
    for(let i=0;i<8;i++){ const a=i*Math.PI/4+.15, x=Math.cos(a)*5.2,z=Math.sin(a)*5.2; const stall=new THREE.Group(); scene.add(stall); stall.position.set(x,0,z); stall.rotation.y=a+Math.PI/2; const table=new THREE.Mesh(geometry.box,wood); table.scale.set(1.2,.72,.78);table.position.y=.38;stall.add(table); const canopy=new THREE.Mesh(geometry.cone,i%2?mat(0xa74032):mat(0xd3b467)); canopy.scale.set(1.05,.65,.85);canopy.position.y=1.23;canopy.rotation.y=Math.PI/4;stall.add(canopy); const barrel=new THREE.Mesh(geometry.cylinder,mat(0x6f4931));barrel.scale.set(.25,.48,.25);barrel.position.set(.85,.24,0);stall.add(barrel); }
    function tree(x,z,s){ const trunk=mesh(geometry.cylinder,wood,x,s*.7,z,[s*.16,s*1.4,s*.16]); for(let i=0;i<4;i++){ const a=i*1.7; mesh(geometry.sphere,leaf,x+Math.cos(a)*s*.28,s*1.65+(i%2)*s*.18,z+Math.sin(a)*s*.28,[s*.62,s*.72,s*.62]); } }
    for(let i=0;i<37;i++){const a=Math.random()*Math.PI*2,r=rnd(23,34);tree(Math.cos(a)*r,Math.sin(a)*r,rnd(.55,1.25));}

    // small townsfolk permanently orbit through the street network
    const folk=[]; const folkMat=[mat(0x9e4036),mat(0x405c7c),mat(0x6f7438),mat(0x7a5341)];
    for(let i=0;i<22;i++){ const a=Math.random()*Math.PI*2,r=rnd(3,17); const p=new THREE.Group(); scene.add(p); const body=new THREE.Mesh(geometry.cylinder,folkMat[i%4]);body.scale.set(.18,.58,.18);body.position.y=.6;p.add(body);const head=new THREE.Mesh(geometry.sphere,mat(0xe0ac7d));head.scale.set(.14,.16,.14);head.position.y=1.23;p.add(head);folk.push({p, angle:a,r,speed:rnd(.12,.3),lane:rnd(-.7,.7),bob:Math.random()*6}); }
    // smoke uses translucent, drifting spheres
    const smoke=[]; for(const [x,z] of [[-4.2,4.4],[8,-2],[-12,7],[5,14],[-14,-9]]) for(let i=0;i<5;i++){ const puff=mesh(geometry.sphere,new THREE.MeshStandardMaterial({color:0xc9d0d0,transparent:true,opacity:.22,roughness:1}),x,5+i*.48,z,[.38+i*.13,.3+i*.1,.38+i*.13],false);smoke.push({puff,x,z,offset:i*.8}); }
    const birds=[]; for(let i=0;i<13;i++){ const b=new THREE.Group();scene.add(b); for(const side of [-1,1]){const wing=new THREE.Mesh(new THREE.PlaneGeometry(.38,.12),mat(0x1d2630));wing.position.x=side*.19;wing.rotation.z=side*.22;b.add(wing);}birds.push({b,a:Math.random()*6.2,r:rnd(10,27),h:rnd(10,18),speed:rnd(.25,.5),phase:Math.random()*7}); }

    const clock = new THREE.Clock();
    function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime();
      controls.update(); glow.intensity=1.55+Math.sin(t*2.7)*.24; spray.scale.y=1+Math.sin(t*5)*.18;
      windows.forEach(({win,phase})=>win.material.emissiveIntensity=1.25+Math.sin(t*2+phase)*.3);
      flags.forEach(({flag,a,seed})=>{flag.position.x=Math.cos(a)*wallR+.75+Math.sin(t*2+seed)*.07;flag.rotation.z=Math.sin(t*2.5+seed)*.08;});
      folk.forEach(f=>{ f.angle+=f.speed*.0025; f.p.position.set(Math.cos(f.angle)*f.r+Math.cos(f.angle+Math.PI/2)*f.lane,.035,Math.sin(f.angle)*f.r+Math.sin(f.angle+Math.PI/2)*f.lane); f.p.position.y=.04+Math.abs(Math.sin(t*5+f.bob))*.025; f.p.rotation.y=-f.angle; });
      smoke.forEach(s=>{ const y=5+(t*.34+s.offset)%5; s.puff.position.set(s.x+Math.sin(t*.25+s.offset)*.65,y,s.z+Math.cos(t*.2+s.offset)*.38); s.puff.material.opacity=.25*(1-(y-5)/5); });
      birds.forEach(o=>{o.a+=o.speed*.006;o.b.position.set(Math.cos(o.a)*o.r,o.h+Math.sin(t+o.phase)*.6,Math.sin(o.a)*o.r);o.b.rotation.y=-o.a; o.b.children.forEach((w,j)=>w.rotation.z=(j?1:-1)*(.25+Math.sin(t*9+o.phase)*.55));});
      const mins=Math.floor(378+t*2.2)%720, hh=Math.floor(mins/60)+6, mm=String(mins%60).padStart(2,'0'); document.getElementById('clock').textContent=`Dawn, ${String(hh).padStart(2,'0')}:${mm}`; document.getElementById('population').textContent=`${172+Math.floor((Math.sin(t*.7)+1)*9)} souls awake`;
      renderer.render(scene,camera);
    }
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}); animate();
  </script>
</body>
</html>
