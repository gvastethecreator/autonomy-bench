<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142333">
  <title>Solstice — First-Person Coaster</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap');
    :root { color-scheme: dark; font-family: Outfit, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #142333; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; color: #fff9ec; }
    #ui::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(9,27,39,.36), transparent 19%, transparent 69%, rgba(7,22,34,.56)); pointer-events: none; }
    header { position: absolute; left: 42px; right: 42px; top: 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { position: relative; width: 42px; height: 42px; border: 1.5px solid rgba(255,246,223,.85); border-radius: 50%; }
    .brand-mark::before, .brand-mark::after { content: ''; position: absolute; border-radius: 50%; }
    .brand-mark::before { inset: 7px; border: 1px solid rgba(255,246,223,.6); }
    .brand-mark::after { width: 9px; height: 9px; background: #ffb56e; top: 15px; left: 15px; box-shadow: 0 0 16px #ffb56e; }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: .24em; line-height: 1.1; }
    .brand-sub { margin-top: 5px; font: 10px 'DM Mono', monospace; letter-spacing: .18em; color: rgba(255,249,236,.7); }
    .live { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border: 1px solid rgba(255,255,255,.22); border-radius: 30px; background: rgba(12,36,47,.28); backdrop-filter: blur(10px); font: 10px 'DM Mono', monospace; letter-spacing: .17em; }
    .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #9ce8c5; box-shadow: 0 0 12px #9ce8c5; }
    .bottom { position: absolute; left: 42px; right: 42px; bottom: 35px; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .readout { min-width: 190px; }
    .eyebrow { color: rgba(255,249,236,.73); font: 10px 'DM Mono', monospace; letter-spacing: .23em; }
    .number { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 -2px; font-size: clamp(60px, 7vw, 100px); font-weight: 300; line-height: 1; letter-spacing: -.055em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 30px rgba(8,28,40,.3); }
    .unit { font: 11px 'DM Mono', monospace; letter-spacing: .14em; }
    .progress { width: 190px; height: 3px; margin-top: 19px; background: rgba(255,255,255,.35); border-radius: 4px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0; background: #ffbd7b; box-shadow: 0 0 12px #ffbd7b; }
    .right-bottom { display: flex; align-items: end; gap: 20px; }
    .hint { margin-bottom: 11px; font: 10px 'DM Mono', monospace; letter-spacing: .13em; color: rgba(255,249,236,.72); text-align: right; line-height: 1.7; }
    .buttons { display: flex; gap: 8px; pointer-events: auto; }
    button { min-width: 90px; height: 42px; padding: 0 16px; color: #fff9ec; background: rgba(12,36,47,.34); border: 1px solid rgba(255,255,255,.45); border-radius: 5px; backdrop-filter: blur(10px); font: 10px 'DM Mono', monospace; letter-spacing: .14em; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: rgba(255,181,110,.35); transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid #ffbd7b; outline-offset: 3px; }
    #loading { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: #142333; color: #fff2de; font: 12px 'DM Mono', monospace; letter-spacing: .25em; transition: opacity .8s ease; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #error { position: fixed; z-index: 5; left: 50%; bottom: 50px; transform: translateX(-50%); max-width: min(90vw, 470px); display: none; padding: 16px 20px; color: #fff; background: #5f2930; border-radius: 6px; font: 13px system-ui, sans-serif; text-align: center; }
    @media (max-width: 700px) {
      header { left: 20px; right: 20px; top: 20px; }
      .brand-name { font-size: 14px; }
      .brand-sub { font-size: 8px; }
      .live { padding: 10px; font-size: 8px; }
      .bottom { left: 20px; right: 20px; bottom: 24px; align-items: end; }
      .readout, .progress { min-width: 0; width: 142px; }
      .number { font-size: 60px; }
      .hint { display: none; }
      .buttons { flex-direction: column; }
      button { min-width: 74px; height: 36px; padding: 0 10px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status">PREPARING YOUR RIDE</div>
  <div id="error" role="alert"></div>
  <main id="ui" aria-label="Solstice rollercoaster ride">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><div class="brand-name">SOLSTICE</div><div class="brand-sub">A JOURNEY ABOVE THE TREES</div></div></div>
      <div class="live">CONTINUOUS RIDE</div>
    </header>
    <div class="bottom">
      <div class="readout"><div class="eyebrow">CURRENT SPEED</div><div class="number"><span id="speed">094</span><span class="unit">KM/H</span></div><div class="progress" role="progressbar" aria-label="Lap progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div></div>
      <div class="right-bottom"><div class="hint">MOVE CURSOR TO LOOK AROUND<br>SPACE TO PAUSE THE RIDE</div><div class="buttons"><button id="toggle" type="button" aria-label="Pause ride">PAUSE</button><button id="restart" type="button" aria-label="Restart ride">RESTART</button></div></div>
    </div>
  </main>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const TAU = Math.PI * 2;
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd9ad94, 0.00155);
    const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, 0.08, 1350);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;
    document.body.prepend(renderer.domElement);

    const sky = new THREE.Mesh(new THREE.SphereGeometry(1100, 40, 24), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vPos; void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader: 'varying vec3 vPos; void main(){float h=clamp(normalize(vPos).y*.5+.5,0.,1.);vec3 low=vec3(.95,.57,.43);vec3 mid=vec3(.48,.56,.64);vec3 high=vec3(.09,.19,.32);vec3 c=mix(low,mid,smoothstep(.32,.64,h));c=mix(c,high,smoothstep(.60,1.,h));gl_FragColor=vec4(c,1.);}'
    }));
    scene.add(sky);

    scene.add(new THREE.HemisphereLight(0xffdfbf, 0x27495a, 2.6));
    const sunLight = new THREE.DirectionalLight(0xffc089, 2.4);
    sunLight.position.set(-350, 230, -440);
    scene.add(sunLight);
    const sun = new THREE.Mesh(new THREE.SphereGeometry(45, 32, 16), new THREE.MeshBasicMaterial({ color: 0xffd39a, fog: false }));
    sun.position.set(-520, 220, -820);
    scene.add(sun);
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 256;
    const gc = glowCanvas.getContext('2d');
    const gradient = gc.createRadialGradient(128, 128, 9, 128, 128, 128);
    gradient.addColorStop(0, 'rgba(255,210,151,.55)');
    gradient.addColorStop(.35, 'rgba(255,175,122,.20)');
    gradient.addColorStop(1, 'rgba(255,175,122,0)');
    gc.fillStyle = gradient; gc.fillRect(0, 0, 256, 256);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    glow.position.copy(sun.position); glow.scale.set(350, 350, 1); scene.add(glow);

    const terrainHeight = (x, z) => -12 + 2.3 * Math.sin(x * .014) * Math.cos(z * .019) + 1.7 * Math.sin((x + z) * .026) + 1.1 * Math.cos(z * .041);
    const terrainGeo = new THREE.PlaneGeometry(1800, 1800, 110, 110);
    terrainGeo.rotateX(-Math.PI / 2);
    const tp = terrainGeo.attributes.position;
    const terrainColors = [];
    const cLow = new THREE.Color(0x3b655e), cHigh = new THREE.Color(0x7b826d), c = new THREE.Color();
    for (let i = 0; i < tp.count; i++) {
      const x = tp.getX(i), z = tp.getZ(i), h = terrainHeight(x, z);
      tp.setY(i, h);
      c.copy(cLow).lerp(cHigh, THREE.MathUtils.clamp((h + 15) / 9, 0, 1));
      terrainColors.push(c.r, c.g, c.b);
    }
    terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrainColors, 3));
    terrainGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));

    const points = [
      [0, 26, 25], [2, 26, -25], [-1, 43, -95], [-8, 72, -165], [-14, 89, -227],
      [-35, 87, -283], [-88, 50, -350], [-151, 19, -387], [-217, 18, -383],
      [-267, 35, -328], [-268, 70, -258], [-226, 93, -207], [-166, 86, -197],
      [-107, 54, -231], [-45, 24, -271], [35, 18, -289], [113, 27, -251],
      [160, 53, -190], [151, 69, -121], [102, 65, -70], [47, 40, -34]
    ].map(p => new THREE.Vector3(...p));
    const track = new THREE.CatmullRomCurve3(points, true, 'catmullrom', .38);
    track.arcLengthDivisions = 2400;
    const length = track.getLength();
    const worldUp = new THREE.Vector3(0, 1, 0);
    function frameAt(u) {
      u = (u % 1 + 1) % 1;
      const p = track.getPointAt(u), tangent = track.getTangentAt(u).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, worldUp).normalize();
      const t2 = track.getTangentAt((u + .002) % 1);
      const curveAmount = t2.sub(tangent).dot(right);
      const bank = THREE.MathUtils.clamp(-curveAmount * 3.2, -.23, .23);
      const up = new THREE.Vector3().crossVectors(right, tangent).normalize();
      right.applyAxisAngle(tangent, bank);
      up.applyAxisAngle(tangent, bank);
      return { p, tangent, right, up };
    }

    const samples = 720, railL = [], railR = [], railHiL = [], railHiR = [], spine = [];
    for (let i = 0; i < samples; i++) {
      const f = frameAt(i / samples);
      railL.push(f.p.clone().addScaledVector(f.right, -1.62).addScaledVector(f.up, .16));
      railR.push(f.p.clone().addScaledVector(f.right, 1.62).addScaledVector(f.up, .16));
      railHiL.push(f.p.clone().addScaledVector(f.right, -1.62).addScaledVector(f.up, .31));
      railHiR.push(f.p.clone().addScaledVector(f.right, 1.62).addScaledVector(f.up, .31));
      spine.push(f.p.clone().addScaledVector(f.up, -.52));
    }
    function tube(pathPoints, radius, color, metalness, emissive = 0x000000) {
      const curve = new THREE.CatmullRomCurve3(pathPoints, true, 'centripetal');
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1150, radius, 6, true), new THREE.MeshStandardMaterial({ color, roughness: .31, metalness, emissive, emissiveIntensity: .28 }));
      scene.add(mesh);
      return mesh;
    }
    tube(spine, .29, 0x345660, .55);
    tube(railL, .21, 0xf16f53, .5, 0x601b12);
    tube(railR, .21, 0xf16f53, .5, 0x601b12);
    tube(railHiL, .055, 0xffd29f, .8, 0xffa665);
    tube(railHiR, .055, 0xffd29f, .8, 0xffa665);

    const tieCount = Math.floor(length / 3.1);
    const tieMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(4.12, .21, .56), new THREE.MeshStandardMaterial({ color: 0xf1ca9b, roughness: .7, metalness: .12 }), tieCount);
    const matrix = new THREE.Matrix4(), basis = new THREE.Matrix4(), back = new THREE.Vector3(), q = new THREE.Quaternion(), scale = new THREE.Vector3(1, 1, 1);
    for (let i = 0; i < tieCount; i++) {
      const f = frameAt(i / tieCount);
      back.copy(f.tangent).negate();
      basis.makeBasis(f.right, f.up, back);
      q.setFromRotationMatrix(basis);
      matrix.compose(f.p.clone().addScaledVector(f.up, -.13), q, scale);
      tieMesh.setMatrixAt(i, matrix);
    }
    tieMesh.instanceMatrix.needsUpdate = true;
    scene.add(tieMesh);

    const supportMat = new THREE.MeshStandardMaterial({ color: 0xd8aa82, roughness: .7, metalness: .25 });
    const supportGeo = new THREE.CylinderGeometry(.16, .24, 1, 7);
    const braceGeo = new THREE.CylinderGeometry(.085, .085, 1, 6);
    function rodBetween(a, b, geo, mat) {
      const delta = b.clone().sub(a), rod = new THREE.Mesh(geo, mat);
      rod.position.copy(a).addScaledVector(delta, .5);
      rod.quaternion.setFromUnitVectors(worldUp, delta.clone().normalize());
      rod.scale.y = delta.length();
      scene.add(rod);
    }
    const supportCount = Math.floor(length / 16);
    for (let i = 0; i < supportCount; i++) {
      const f = frameAt(i / supportCount);
      const ground = terrainHeight(f.p.x, f.p.z);
      const left = f.p.clone().addScaledVector(f.right, -1.7), right = f.p.clone().addScaledVector(f.right, 1.7);
      const topY = f.p.y - .85;
      const a = new THREE.Vector3(left.x, ground, left.z), b = new THREE.Vector3(right.x, ground, right.z);
      const at = new THREE.Vector3(left.x, topY, left.z), bt = new THREE.Vector3(right.x, topY, right.z);
      rodBetween(a, at, supportGeo, supportMat);
      rodBetween(b, bt, supportGeo, supportMat);
      rodBetween(a, bt, braceGeo, supportMat);
      if (i % 2 === 0) rodBetween(b, at, braceGeo, supportMat);
    }

    let seed = 287514;
    function random() { seed = (1664525 * seed + 1013904223) >>> 0; return seed / 4294967296; }
    const trunkGeo = new THREE.CylinderGeometry(.22, .31, 1, 5);
    const leafGeo = new THREE.ConeGeometry(1, 1, 6);
    const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x514b44, roughness: 1 }), 650);
    const leaves = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({ color: 0x315b57, roughness: 1, flatShading: true }), 650);
    const treeColor = new THREE.Color();
    for (let i = 0; i < 650; i++) {
      const x = -380 + random() * 680, z = -515 + random() * 680;
      const h = 5 + random() * 9, width = 1.6 + random() * 2.4, ground = terrainHeight(x, z);
      matrix.compose(new THREE.Vector3(x, ground + h * .22, z), new THREE.Quaternion().setFromAxisAngle(worldUp, random() * TAU), new THREE.Vector3(1, h * .44, 1));
      trunks.setMatrixAt(i, matrix);
      matrix.compose(new THREE.Vector3(x, ground + h * .75, z), new THREE.Quaternion().setFromAxisAngle(worldUp, random() * TAU), new THREE.Vector3(width, h * .82, width));
      leaves.setMatrixAt(i, matrix);
      treeColor.setHSL(.42 + random() * .065, .20 + random() * .18, .22 + random() * .12);
      leaves.setColorAt(i, treeColor);
    }
    trunks.instanceMatrix.needsUpdate = leaves.instanceMatrix.needsUpdate = true;
    leaves.instanceColor.needsUpdate = true;
    scene.add(trunks, leaves);

    const rockGeo = new THREE.DodecahedronGeometry(1, 0);
    const rocks = new THREE.InstancedMesh(rockGeo, new THREE.MeshStandardMaterial({ color: 0x907b71, roughness: 1, flatShading: true }), 190);
    for (let i = 0; i < 190; i++) {
      const x = -380 + random() * 690, z = -520 + random() * 690, r = 1.2 + random() * 4;
      matrix.compose(new THREE.Vector3(x, terrainHeight(x, z) + r * .35, z), new THREE.Quaternion().setFromAxisAngle(worldUp, random() * TAU), new THREE.Vector3(r, r * (.45 + random() * .5), r));
      rocks.setMatrixAt(i, matrix);
    }
    rocks.instanceMatrix.needsUpdate = true; scene.add(rocks);

    const ringMat = new THREE.MeshStandardMaterial({ color: 0xffd1a2, emissive: 0xe76943, emissiveIntensity: .42, metalness: .42, roughness: .33 });
    for (const u of [.20, .49, .79]) {
      const f = frameAt(u);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(10.5, .3, 8, 72), ringMat);
      ring.position.copy(f.p).addScaledVector(f.up, 1.6);
      ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), f.tangent);
      scene.add(ring);
    }

    const cockpit = new THREE.Group();
    const carMat = new THREE.MeshStandardMaterial({ color: 0xce5b43, roughness: .38, metalness: .45 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xffc795, roughness: .35, metalness: .68 });
    const nose = new THREE.Mesh(new THREE.BoxGeometry(2.4, .37, 1.7), carMat);
    nose.position.set(0, -1.37, -2.25);
    cockpit.add(nose);
    const noseTrim = new THREE.Mesh(new THREE.BoxGeometry(2.52, .075, 1.76), rimMat);
    noseTrim.position.set(0, -1.15, -2.25);
    cockpit.add(noseTrim);
    for (const side of [-1, 1]) {
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(.055, .055, 1.8, 8), rimMat);
      handle.rotation.x = Math.PI / 2;
      handle.position.set(side * 1.08, -.85, -1.8);
      cockpit.add(handle);
    }
    camera.add(cockpit); scene.add(camera);

    const speedLabel = document.getElementById('speed');
    const progress = document.querySelector('.progress');
    const progressFill = document.getElementById('progress-fill');
    const toggle = document.getElementById('toggle');
    const restart = document.getElementById('restart');
    const initialDistance = length * .105;
    let distance = initialDistance, speed = 26, running = true, elapsed = 0;
    let pointerX = 0, pointerY = 0, lookX = 0, lookY = 0;
    function setRunning(value) {
      running = value;
      toggle.textContent = running ? 'PAUSE' : 'RESUME';
      toggle.setAttribute('aria-label', running ? 'Pause ride' : 'Resume ride');
      toggle.setAttribute('aria-pressed', String(!running));
    }
    toggle.addEventListener('click', () => setRunning(!running));
    restart.addEventListener('click', () => { distance = initialDistance; speed = 26; setRunning(true); });
    addEventListener('keydown', event => {
      if (event.code === 'Space' && event.target.tagName !== 'BUTTON') { event.preventDefault(); setRunning(!running); }
    });
    addEventListener('pointermove', event => {
      pointerX = (event.clientX / innerWidth - .5) * 2;
      pointerY = (event.clientY / innerHeight - .5) * 2;
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();
    const lookTarget = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .05);
      if (running) {
        elapsed += dt;
        const t = track.getTangentAt(distance / length);
        const targetSpeed = THREE.MathUtils.clamp(30 - t.y * 48, 21, 53);
        speed += (targetSpeed - speed) * Math.min(1, dt * 1.35);
        distance = (distance + speed * dt) % length;
      }
      const u = distance / length, f = frameAt(u);
      lookX += (pointerX - lookX) * Math.min(1, dt * 1.9);
      lookY += (pointerY - lookY) * Math.min(1, dt * 1.9);
      const bounce = running ? Math.sin(elapsed * 15) * .025 * speed / 35 : 0;
      camera.position.copy(f.p).addScaledVector(f.up, 1.58 + bounce);
      camera.up.copy(f.up);
      lookTarget.copy(track.getPointAt((u + 10 / length) % 1)).addScaledVector(f.up, 1.5 - lookY * 2.6).addScaledVector(f.right, lookX * 4.2);
      camera.lookAt(lookTarget);
      camera.fov += ((76 + speed * .16) - camera.fov) * Math.min(1, dt * 1.5);
      camera.updateProjectionMatrix();
      sky.position.copy(camera.position);
      speedLabel.textContent = String(Math.round(speed * 3.6)).padStart(3, '0');
      const percent = Math.round(u * 100);
      progressFill.style.width = percent + '%';
      progress.setAttribute('aria-valuenow', String(percent));
      renderer.render(scene, camera);
    }
    animate();
    document.getElementById('loading').classList.add('hidden');
  </script>
</body>
</html>
