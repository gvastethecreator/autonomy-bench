<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b21">
  <title>VANTA — First-Person Coaster</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; font-family: "DM Sans", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101b21; }
    body { color: #f5f2e9; }
    #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6,17,23,.58), transparent 22%, transparent 64%, rgba(6,17,23,.67)); }
    .hud { position: fixed; inset: 0; display: flex; flex-direction: column; padding: clamp(18px,3vw,42px); pointer-events: none; }
    .hud button { pointer-events: auto; }
    .top, .bottom { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 13px; text-shadow: 0 2px 15px rgba(0,0,0,.25); }
    .mark { display: grid; place-items: center; width: 36px; height: 36px; border: 2px solid #ffa45d; border-radius: 11px; transform: rotate(-12deg); color: #ffa45d; font: 700 21px "Space Grotesk", sans-serif; }
    .mark span { transform: rotate(12deg); }
    .brand strong { display: block; font: 700 19px/1 "Space Grotesk", sans-serif; letter-spacing: .22em; }
    .brand small { display: block; margin-top: 6px; color: #f6e3ce; font-size: 9px; font-weight: 700; letter-spacing: .26em; }
    .top-right { display: flex; align-items: center; gap: 20px; }
    .live { display: flex; align-items: center; gap: 9px; color: #ffe2c5; font-size: 10px; font-weight: 700; letter-spacing: .22em; white-space: nowrap; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #ff9a54; box-shadow: 0 0 0 5px rgba(255,154,84,.15), 0 0 15px #ff9a54; }
    #pause { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 125px; height: 37px; border: 1px solid rgba(255,255,255,.38); border-radius: 7px; color: #fff; background: rgba(11,27,34,.26); backdrop-filter: blur(15px); font: 700 10px "DM Sans", sans-serif; letter-spacing: .14em; cursor: pointer; transition: background .2s, border-color .2s; }
    #pause:hover, #pause:focus-visible { background: rgba(255,154,84,.22); border-color: #ffa45d; outline: none; }
    #pause svg { width: 12px; height: 12px; fill: currentColor; }
    .mid-label { position: absolute; top: 50%; right: clamp(18px,3vw,42px); transform: translateY(-50%); display: flex; align-items: center; gap: 11px; color: rgba(255,248,235,.85); font-size: 10px; font-weight: 700; letter-spacing: .22em; writing-mode: vertical-rl; }
    .mid-label::before { content: ""; width: 1px; height: 58px; background: linear-gradient(#ffa45d, transparent); }
    .bottom { margin-top: auto; align-items: end; }
    .speed { min-width: 235px; }
    .eyebrow { color: #ffb978; font-size: 10px; font-weight: 700; letter-spacing: .23em; }
    .speed-line { display: flex; align-items: baseline; gap: 11px; margin-top: 3px; }
    #speed { font: 500 clamp(68px,8.5vw,126px)/.95 "Space Grotesk", sans-serif; letter-spacing: -.085em; font-variant-numeric: tabular-nums; text-shadow: 0 4px 30px rgba(0,0,0,.25); }
    .unit { color: #f9e4d1; font: 600 14px "Space Grotesk", sans-serif; letter-spacing: .08em; }
    .speed-foot { width: 238px; height: 2px; margin-top: 15px; background: rgba(255,255,255,.32); }
    .speed-foot span { display: block; height: 100%; width: 50%; background: #ffad67; box-shadow: 0 0 12px #ffad67; transition: width .2s; }
    .ride-data { width: min(330px,36vw); padding: 18px 19px 16px; border: 1px solid rgba(255,255,255,.22); border-radius: 10px; background: rgba(12,27,34,.43); box-shadow: 0 16px 50px rgba(4,10,15,.1); backdrop-filter: blur(18px); }
    .data-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .data-top strong { font: 600 14px "Space Grotesk", sans-serif; letter-spacing: .02em; }
    .data-top small { color: #ffc697; font-size: 10px; font-weight: 700; letter-spacing: .14em; }
    .progress { width: 100%; height: 4px; margin: 17px 0 16px; border-radius: 3px; background: rgba(255,255,255,.21); overflow: hidden; }
    #progress-fill { display: block; width: 0; height: 100%; background: linear-gradient(90deg,#fa854e,#ffd096); border-radius: inherit; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .stat:not(:first-child) { border-left: 1px solid rgba(255,255,255,.19); padding-left: 14px; }
    .stat span { display: block; margin-bottom: 5px; color: #c9cbc5; font-size: 9px; font-weight: 700; letter-spacing: .14em; }
    .stat strong { font: 600 17px "Space Grotesk", sans-serif; font-variant-numeric: tabular-nums; }
    .footer { position: absolute; left: 50%; bottom: clamp(18px,3vw,42px); transform: translateX(-50%); color: rgba(255,247,232,.78); font-size: 10px; font-weight: 700; letter-spacing: .16em; white-space: nowrap; text-align: center; }
    .footer kbd { display: inline-grid; place-items: center; min-width: 24px; height: 22px; margin: 0 5px; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; font: inherit; color: #fff; }
    .crosshair { position: fixed; top: 50%; left: 50%; width: 5px; height: 5px; border: 1px solid rgba(255,255,255,.65); border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; opacity: .65; }
    .loading { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #101b21; transition: opacity .8s ease, visibility .8s ease; }
    .loading.hidden { opacity: 0; visibility: hidden; }
    .loading-inner { text-align: center; }
    .loading-symbol { width: 54px; height: 54px; margin: 0 auto 21px; border: 2px solid rgba(255,164,93,.25); border-top-color: #ffa45d; border-radius: 50%; animation: spin .8s linear infinite; }
    .loading p { margin: 0; color: #ffc193; font-size: 10px; font-weight: 700; letter-spacing: .28em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { max-width: 360px; padding: 30px; color: #fff; line-height: 1.6; text-align: center; }
    .hide-hud .hud, .hide-hud .crosshair { opacity: 0; }
    .hud, .crosshair { transition: opacity .25s; }
    @media (max-width: 700px) {
      .hud { padding: 18px; }
      .top-right { gap: 10px; }
      .live { display: none; }
      #pause { min-width: 94px; height: 34px; font-size: 9px; }
      .mark { width: 31px; height: 31px; }
      .brand strong { font-size: 16px; }
      .brand small { font-size: 8px; }
      .bottom { gap: 14px; align-items: end; }
      .speed { min-width: 0; }
      #speed { font-size: clamp(54px,16vw,85px); }
      .speed-line { gap: 5px; }
      .unit { font-size: 10px; }
      .speed-foot { width: 140px; }
      .ride-data { width: 155px; padding: 12px; }
      .data-top strong { font-size: 11px; }
      .data-top small { font-size: 8px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat:last-child { display: none; }
      .stat strong { font-size: 14px; }
      .stat span { font-size: 8px; }
      .mid-label, .footer { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <div class="crosshair" aria-hidden="true"></div>
  <div class="hud">
    <div class="top">
      <div class="brand"><div class="mark"><span>V</span></div><div><strong>VANTA</strong><small>THE SKYLINE RUN</small></div></div>
      <div class="top-right"><div class="live">NOW RIDING</div><button id="pause" type="button" aria-label="Pause ride" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zm5 0h3v10H7z"/></svg><span>PAUSE RIDE</span></button></div>
    </div>
    <div class="mid-label">FIRST PERSON EXPERIENCE</div>
    <div class="bottom">
      <div class="speed"><div class="eyebrow">CURRENT SPEED</div><div class="speed-line"><span id="speed">000</span><span class="unit">KM/H</span></div><div class="speed-foot"><span id="speed-bar"></span></div></div>
      <div class="ride-data"><div class="data-top"><strong>The Skyline Run</strong><small id="lap-label">LAP 01</small></div><div class="progress"><span id="progress-fill"></span></div><div class="stats"><div class="stat"><span>ALTITUDE</span><strong id="altitude">00 m</strong></div><div class="stat"><span>DISTANCE</span><strong id="distance">0.0 km</strong></div><div class="stat"><span>RIDE TIME</span><strong id="time">00:00</strong></div></div></div>
    </div>
    <div class="footer"><kbd>SPACE</kbd> PAUSE &nbsp;&nbsp; <kbd>H</kbd> HIDE INTERFACE</div>
  </div>
  <div class="loading" id="loading"><div class="loading-inner"><div class="loading-symbol"></div><p>PREPARING YOUR RIDE</p></div></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const canvas = document.getElementById('scene');
    const loading = document.getElementById('loading');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.55;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xd9af8c, 300, 1250);
    const camera = new THREE.PerspectiveCamera(76, window.innerWidth / window.innerHeight, 0.08, 1800);
    scene.add(camera);

    const sky = new THREE.Mesh(new THREE.SphereGeometry(1450, 32, 20), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      vertexShader: 'varying vec3 vWorld; void main(){vWorld=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: 'varying vec3 vWorld; void main(){float h=normalize(vWorld-cameraPosition).y; vec3 low=vec3(0.91,0.55,0.37); vec3 mid=vec3(0.53,0.62,0.67); vec3 high=vec3(0.12,0.27,0.37); vec3 c=mix(low,mid,smoothstep(-0.08,0.31,h)); c=mix(c,high,smoothstep(0.25,0.85,h)); gl_FragColor=vec4(c,1.0);}'
    }));
    scene.add(sky);

    const sun = new THREE.Mesh(new THREE.SphereGeometry(27, 24, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a3, fog: false }));
    sun.position.set(-580, 205, -690);
    scene.add(sun);
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 128;
    const glowContext = glowCanvas.getContext('2d');
    const gradient = glowContext.createRadialGradient(64, 64, 4, 64, 64, 64);
    gradient.addColorStop(0, 'rgba(255,221,155,0.8)');
    gradient.addColorStop(0.3, 'rgba(255,170,96,0.3)');
    gradient.addColorStop(1, 'rgba(255,141,72,0)');
    glowContext.fillStyle = gradient;
    glowContext.fillRect(0, 0, 128, 128);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    glow.position.copy(sun.position);
    glow.scale.set(340, 340, 1);
    scene.add(glow);

    scene.add(new THREE.HemisphereLight(0xffe8cd, 0x344d48, 2.0));
    const sunlight = new THREE.DirectionalLight(0xffc58d, 3.2);
    sunlight.position.set(-290, 360, -420);
    scene.add(sunlight);

    function terrainHeight(x, z) {
      const r = Math.hypot(x, z);
      return -48 + Math.sin(x * .015) * 7 + Math.cos(z * .018) * 8
        + Math.sin((x + z) * .027) * 4 + Math.max(0, r - 245) * .14;
    }
    const terrainGeo = new THREE.PlaneGeometry(1400, 1400, 110, 110);
    terrainGeo.rotateX(-Math.PI / 2);
    const terrainPos = terrainGeo.attributes.position;
    const terrainColors = [];
    const lowColor = new THREE.Color(0x4a5b44);
    const highColor = new THREE.Color(0x83745b);
    const tempColor = new THREE.Color();
    for (let i = 0; i < terrainPos.count; i++) {
      const x = terrainPos.getX(i), z = terrainPos.getZ(i);
      const y = terrainHeight(x, z);
      terrainPos.setY(i, y);
      tempColor.copy(lowColor).lerp(highColor, THREE.MathUtils.clamp((y + 50) / 145, 0, 1));
      const shade = .9 + .1 * Math.sin(x * .061 + z * .04);
      terrainColors.push(tempColor.r * shade, tempColor.g * shade, tempColor.b * shade);
    }
    terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrainColors, 3));
    terrainGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));

    const lake = new THREE.Mesh(new THREE.CircleGeometry(112, 72), new THREE.MeshStandardMaterial({ color: 0x4b8b91, metalness: .25, roughness: .28, transparent: true, opacity: .83 }));
    lake.rotation.x = -Math.PI / 2;
    lake.position.set(28, -45, -22);
    lake.scale.set(1.45, .67, 1);
    scene.add(lake);

    const trackPoints = [
      [0, 55, 135], [56, 69, 121], [112, 109, 72], [147, 123, 12],
      [131, 96, -60], [84, 31, -117], [8, 20, -151], [-65, 29, -150],
      [-134, 63, -108], [-171, 99, -38], [-155, 87, 40], [-106, 43, 105],
      [-48, 34, 135]
    ].map(p => new THREE.Vector3(...p));
    const track = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', .5);
    const trackLength = track.getLength();
    const worldUp = new THREE.Vector3(0, 1, 0);
    function frameAt(u) {
      const t = (u % 1 + 1) % 1;
      const point = track.getPointAt(t);
      const tangent = track.getTangentAt(t).normalize();
      const before = track.getTangentAt((t - .002 + 1) % 1);
      const after = track.getTangentAt((t + .002) % 1);
      const turn = before.x * after.z - before.z * after.x;
      const bank = THREE.MathUtils.clamp(turn * 22, -.54, .54);
      const side = new THREE.Vector3().crossVectors(worldUp, tangent);
      if (side.lengthSq() < .001) side.set(1, 0, 0);
      side.normalize();
      const up = new THREE.Vector3().crossVectors(tangent, side).normalize();
      side.applyAxisAngle(tangent, bank);
      up.applyAxisAngle(tangent, bank);
      return { point, tangent, side, up };
    }

    const railLeft = [], railRight = [], spinePoints = [];
    const samples = 1200;
    for (let i = 0; i < samples; i++) {
      const f = frameAt(i / samples);
      railLeft.push(f.point.clone().addScaledVector(f.side, -1.08).addScaledVector(f.up, -.23));
      railRight.push(f.point.clone().addScaledVector(f.side, 1.08).addScaledVector(f.up, -.23));
      spinePoints.push(f.point.clone().addScaledVector(f.up, -.62));
    }
    const railMaterial = new THREE.MeshStandardMaterial({ color: 0xe8663f, metalness: .56, roughness: .28, emissive: 0x5a180c, emissiveIntensity: .25 });
    const spineMaterial = new THREE.MeshStandardMaterial({ color: 0x334750, metalness: .72, roughness: .34 });
    function tube(points, radius, material) {
      const curve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', .5);
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1400, radius, 7, true), material);
      scene.add(mesh);
      return mesh;
    }
    tube(railLeft, .115, railMaterial);
    tube(railRight, .115, railMaterial);
    tube(spinePoints, .19, spineMaterial);

    const tieCount = Math.ceil(trackLength / 3.4);
    const tieMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(2.72, .15, .46), new THREE.MeshStandardMaterial({ color: 0x263b42, metalness: .55, roughness: .45 }), tieCount);
    const tieMatrix = new THREE.Matrix4();
    const tieBasis = new THREE.Matrix4();
    for (let i = 0; i < tieCount; i++) {
      const f = frameAt(i / tieCount);
      tieBasis.makeBasis(f.side, f.up, f.tangent);
      tieMatrix.copy(tieBasis).setPosition(f.point.clone().addScaledVector(f.up, -.43));
      tieMesh.setMatrixAt(i, tieMatrix);
    }
    tieMesh.instanceMatrix.needsUpdate = true;
    scene.add(tieMesh);

    const supportMaterial = new THREE.MeshStandardMaterial({ color: 0x536361, metalness: .55, roughness: .56 });
    const beamGeometry = new THREE.CylinderGeometry(.27, .4, 1, 7);
    const beamUp = new THREE.Vector3(0, 1, 0);
    function beam(a, b, radius = 1) {
      const direction = b.clone().sub(a);
      const mesh = new THREE.Mesh(beamGeometry, supportMaterial);
      mesh.position.copy(a).add(b).multiplyScalar(.5);
      mesh.quaternion.setFromUnitVectors(beamUp, direction.clone().normalize());
      mesh.scale.set(radius, direction.length(), radius);
      scene.add(mesh);
    }
    for (let i = 0; i < 62; i++) {
      const f = frameAt(i / 62);
      const top = f.point.clone().addScaledVector(f.up, -1.5);
      const ground = new THREE.Vector3(top.x, terrainHeight(top.x, top.z) - 1, top.z);
      beam(ground, top, 1.25);
      if (i % 2 === 0) {
        const footA = ground.clone().addScaledVector(f.side, 4.1);
        const footB = ground.clone().addScaledVector(f.side, -4.1);
        footA.y = terrainHeight(footA.x, footA.z);
        footB.y = terrainHeight(footB.x, footB.z);
        beam(footA, top, .72);
        beam(footB, top, .72);
      }
    }

    let seed = 82461;
    function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
    const treePositions = [];
    for (let i = 0; i < 750 && treePositions.length < 480; i++) {
      const x = (random() - .5) * 950;
      const z = (random() - .5) * 950;
      if (Math.hypot(x, z) < 42) continue;
      let close = false;
      for (let j = 0; j < trackPoints.length; j++) {
        if (Math.hypot(x - trackPoints[j].x, z - trackPoints[j].z) < 15) { close = true; break; }
      }
      if (!close) treePositions.push({ x, z, size: 7 + random() * 11 });
    }
    const trunkMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(.19, .29, 1, 5), new THREE.MeshLambertMaterial({ color: 0x574738 }), treePositions.length);
    const foliageMesh = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 6), new THREE.MeshLambertMaterial({ color: 0x294e42, flatShading: true }), treePositions.length);
    const foliageTopMesh = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 6), new THREE.MeshLambertMaterial({ color: 0x3b6651, flatShading: true }), treePositions.length);
    const object = new THREE.Object3D();
    treePositions.forEach((tree, i) => {
      const y = terrainHeight(tree.x, tree.z);
      object.position.set(tree.x, y + tree.size * .25, tree.z);
      object.scale.set(1, tree.size * .5, 1);
      object.updateMatrix(); trunkMesh.setMatrixAt(i, object.matrix);
      object.position.y = y + tree.size * .54;
      object.scale.set(tree.size * .22, tree.size * .58, tree.size * .22);
      object.updateMatrix(); foliageMesh.setMatrixAt(i, object.matrix);
      object.position.y = y + tree.size * .79;
      object.scale.set(tree.size * .165, tree.size * .44, tree.size * .165);
      object.updateMatrix(); foliageTopMesh.setMatrixAt(i, object.matrix);
    });
    trunkMesh.instanceMatrix.needsUpdate = true;
    foliageMesh.instanceMatrix.needsUpdate = true;
    foliageTopMesh.instanceMatrix.needsUpdate = true;
    scene.add(trunkMesh, foliageMesh, foliageTopMesh);

    const rockCount = 105;
    const rocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0x777b6b, flatShading: true }), rockCount);
    for (let i = 0; i < rockCount; i++) {
      const x = (random() - .5) * 850, z = (random() - .5) * 850;
      const size = 1.4 + random() * 4.4;
      object.position.set(x, terrainHeight(x, z) + size * .25, z);
      object.rotation.set(random() * 2, random() * 6, random() * 2);
      object.scale.set(size, size * (.4 + random() * .6), size * (.6 + random()));
      object.updateMatrix(); rocks.setMatrixAt(i, object.matrix);
    }
    rocks.instanceMatrix.needsUpdate = true;
    scene.add(rocks);

    const noseMaterial = new THREE.MeshStandardMaterial({ color: 0x1c3038, metalness: .62, roughness: .28 });
    const nose = new THREE.Mesh(new THREE.BoxGeometry(1.45, .23, 1.3), noseMaterial);
    nose.position.set(0, -1.54, -2.5);
    camera.add(nose);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(.13, .012, 1.31), new THREE.MeshBasicMaterial({ color: 0xf18953 }));
    stripe.position.set(0, -1.416, -2.5);
    camera.add(stripe);
    const handleMaterial = new THREE.MeshStandardMaterial({ color: 0xc97852, metalness: .6, roughness: .31 });
    function handle(a, b) {
      const d = b.clone().sub(a);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, d.length(), 8), handleMaterial);
      mesh.position.copy(a).add(b).multiplyScalar(.5);
      mesh.quaternion.setFromUnitVectors(beamUp, d.normalize());
      camera.add(mesh);
    }
    handle(new THREE.Vector3(-.75, -1.27, -1.75), new THREE.Vector3(-.83, -1.29, -3.1));
    handle(new THREE.Vector3(.75, -1.27, -1.75), new THREE.Vector3(.83, -1.29, -3.1));

    const speedEl = document.getElementById('speed');
    const speedBar = document.getElementById('speed-bar');
    const altitudeEl = document.getElementById('altitude');
    const distanceEl = document.getElementById('distance');
    const timeEl = document.getElementById('time');
    const lapEl = document.getElementById('lap-label');
    const progressEl = document.getElementById('progress-fill');
    const pauseButton = document.getElementById('pause');
    let paused = false;
    let travelled = trackLength * .27;
    let speed = 38;
    let rideTime = 0;
    let previous = performance.now();
    let lastHud = 0;
    function setPaused(value) {
      paused = value;
      pauseButton.setAttribute('aria-pressed', String(value));
      pauseButton.setAttribute('aria-label', value ? 'Resume ride' : 'Pause ride');
      pauseButton.querySelector('span').textContent = value ? 'RESUME RIDE' : 'PAUSE RIDE';
      pauseButton.querySelector('svg').innerHTML = value
        ? '<path d="M2 1.2v9.6L10 6z"/>'
        : '<path d="M2 1h3v10H2zm5 0h3v10H7z"/>';
    }
    pauseButton.addEventListener('click', () => setPaused(!paused));
    window.addEventListener('keydown', event => {
      if (event.code === 'Space') { event.preventDefault(); setPaused(!paused); }
      if (event.key.toLowerCase() === 'h') document.body.classList.toggle('hide-hud');
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - previous) / 1000, .05);
      previous = now;
      let u = (travelled % trackLength) / trackLength;
      let f = frameAt(u);
      if (!paused) {
        const targetSpeed = THREE.MathUtils.clamp(38 - f.tangent.y * 38, 23, 67);
        speed += (targetSpeed - speed) * Math.min(1, dt * 1.35);
        travelled += speed * dt;
        rideTime += dt;
        u = (travelled % trackLength) / trackLength;
        f = frameAt(u);
      }
      const ahead = frameAt((u + 5.5 / trackLength) % 1);
      camera.position.copy(f.point).addScaledVector(f.up, 1.6);
      camera.up.copy(f.up);
      camera.lookAt(ahead.point.clone().addScaledVector(ahead.up, 1.6));
      camera.fov += ((76 + speed * .11) - camera.fov) * .08;
      camera.updateProjectionMatrix();
      if (now - lastHud > 90) {
        speedEl.textContent = String(Math.round(speed * 3.6)).padStart(3, '0');
        speedBar.style.width = Math.min(100, speed / 68 * 100) + '%';
        altitudeEl.textContent = Math.round(f.point.y) + ' m';
        distanceEl.textContent = (travelled / 1000).toFixed(1) + ' km';
        timeEl.textContent = String(Math.floor(rideTime / 60)).padStart(2, '0') + ':' + String(Math.floor(rideTime % 60)).padStart(2, '0');
        lapEl.textContent = 'LAP ' + String(Math.floor(travelled / trackLength) + 1).padStart(2, '0');
        progressEl.style.width = (u * 100).toFixed(2) + '%';
        lastHud = now;
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
    requestAnimationFrame(() => loading.classList.add('hidden'));
  </script>
</body>
</html>
