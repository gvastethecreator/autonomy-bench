<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e1b">
  <title>Afterglow — A First-Person Coaster</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100e1b; }
    body { color: #fff3df; }
    #ride { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #shade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, transparent 30%, rgba(13, 9, 24, .25) 75%, rgba(7, 6, 14, .68) 100%), linear-gradient(to bottom, rgba(8, 8, 22, .2), transparent 20%, transparent 67%, rgba(9, 7, 18, .52)); }
    #grain { position: fixed; inset: 0; pointer-events: none; opacity: .17; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.66' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); }
    .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 3vw, 48px); }
    .top, .bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 14px; text-shadow: 0 2px 16px #170d21; }
    .brand-mark { width: 29px; height: 29px; transform: rotate(45deg); border: 2px solid #ffc47b; display: grid; place-items: center; box-shadow: 0 0 22px #fa823b77, inset 0 0 13px #ff945b88; }
    .brand-mark::after { content: ""; width: 9px; height: 9px; background: #ffc47b; box-shadow: 0 0 13px #ff9c55; }
    .brand-name { font-weight: 800; font-size: clamp(18px, 2vw, 26px); letter-spacing: .29em; line-height: 1; }
    .brand-sub { margin-top: 7px; font-size: 10px; font-weight: 700; letter-spacing: .34em; color: #ffbd8d; }
    .ride-tag { display: flex; gap: 11px; align-items: center; padding: 11px 15px; border: 1px solid #ffe3b73d; border-radius: 4px; background: #1a122a66; backdrop-filter: blur(10px); font-size: 10px; font-weight: 750; letter-spacing: .24em; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #ffb263; box-shadow: 0 0 11px #ff9c50; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .42; transform: scale(.72); } }
    .bottom { align-items: flex-end; }
    .speed-wrap { min-width: 170px; text-shadow: 0 2px 16px #170d21; }
    .eyebrow { font-size: 10px; font-weight: 750; letter-spacing: .33em; color: #ffc38d; }
    .speed-row { display: flex; align-items: baseline; gap: 10px; line-height: 1; margin-top: 8px; }
    #speed { font-size: clamp(50px, 7.5vw, 96px); font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.075em; }
    .unit { color: #ffcd9b; font-size: 12px; font-weight: 800; letter-spacing: .25em; }
    .progress { height: 2px; width: min(250px, 27vw); background: #ffe8ca3e; margin-top: 15px; overflow: hidden; }
    #progress-bar { width: 0; height: 100%; background: #ffbe7b; box-shadow: 0 0 10px #ffbc75; }
    .lap { display: flex; gap: 13px; align-items: center; margin-top: 11px; color: #fff0d5b5; font-size: 10px; letter-spacing: .19em; font-weight: 700; }
    .lap strong { color: #fff5e6; }
    .actions { display: flex; gap: 8px; pointer-events: auto; }
    button { appearance: none; border: 1px solid #ffe9ce63; background: #171526a8; backdrop-filter: blur(12px); color: #fff1dd; border-radius: 3px; min-height: 43px; padding: 0 16px; font-family: inherit; font-size: 10px; font-weight: 750; line-height: 1; letter-spacing: .18em; cursor: pointer; transition: background .2s, border-color .2s, transform .2s; }
    button:hover { background: #4b3043cc; border-color: #ffc587; transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid #ffbe7b; outline-offset: 3px; }
    .guide { position: fixed; bottom: 49px; left: 50%; transform: translateX(-50%); pointer-events: none; color: #fff2d9a8; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-shadow: 0 2px 10px #130e22; white-space: nowrap; }
    .guide span { color: #fff4e2; border: 1px solid #fff4e28a; padding: 4px 6px; border-radius: 2px; margin: 0 4px 0 11px; }
    @media (max-width: 650px) { .hud { padding: 20px; } .ride-tag { font-size: 9px; padding: 9px; } .brand-name { letter-spacing: .16em; } .brand-sub { letter-spacing: .17em; } .guide { display: none; } .bottom { gap: 10px; } .actions { flex-direction: column; } button { min-height: 37px; padding: 0 10px; } .progress { width: 150px; } }
  </style>
</head>
<body>
  <canvas id="ride" aria-label="Continuous first-person rollercoaster ride through a sunset desert"></canvas>
  <div id="shade"></div><div id="grain"></div>
  <main class="hud">
    <div class="top">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><div class="brand-name">AFTERGLOW</div><div class="brand-sub">CHASE THE LAST LIGHT</div></div></div>
      <div class="ride-tag"><span class="live-dot" aria-hidden="true"></span> LIVE RIDE <span id="lap-top">01</span></div>
    </div>
    <div class="bottom">
      <div class="speed-wrap"><div class="eyebrow">CURRENT VELOCITY</div><div class="speed-row"><span id="speed">000</span><span class="unit">KM/H</span></div><div class="progress"><div id="progress-bar"></div></div><div class="lap">CIRCUIT <strong id="lap-bottom">01</strong><span>·</span> NO END IN SIGHT</div></div>
      <div class="actions"><button id="sound" type="button" aria-pressed="false">SOUND OFF</button><button id="pause" type="button" aria-pressed="false">PAUSE RIDE</button></div>
    </div>
  </main>
  <div class="guide"><span>SPACE</span> PAUSE <span>M</span> SOUND <span>R</span> RESTART</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

    const canvas = document.getElementById('ride');
    const speedEl = document.getElementById('speed');
    const progressEl = document.getElementById('progress-bar');
    const lapTop = document.getElementById('lap-top');
    const lapBottom = document.getElementById('lap-bottom');
    const pauseButton = document.getElementById('pause');
    const soundButton = document.getElementById('sound');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x5c3541, 0.00165);
    const camera = new THREE.PerspectiveCamera(81, innerWidth / innerHeight, 0.04, 1900);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.36;

    let seed = 41073;
    const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    const clamp = THREE.MathUtils.clamp;
    const v = (x, y, z) => new THREE.Vector3(x, y, z);
    const worldUp = v(0, 1, 0);
    const lengthUnit = v(0, 1, 0);
    const gold = new THREE.MeshStandardMaterial({ color: 0x554746, metalness: 0.84, roughness: 0.28, emissive: 0xff7a35, emissiveIntensity: 0.31 });
    const steel = new THREE.MeshStandardMaterial({ color: 0x222d3a, metalness: 0.76, roughness: 0.39 });
    const darkSteel = new THREE.MeshStandardMaterial({ color: 0x161d2b, metalness: 0.65, roughness: 0.47 });
    const glow = new THREE.MeshBasicMaterial({ color: 0xffa65a, toneMapped: false });

    // A closed, hand-shaped route: climb, drop, sweeping turns, then a winding return.
    const route = [
      [0, 31, 222], [0, 37, 178], [0, 51, 122], [0, 68, 67], [0, 70, 28],
      [2, 57, -13], [12, 27, -70], [42, 13, -116], [96, 15, -130], [144, 27, -100],
      [158, 30, -51], [137, 24, -2], [92, 15, 29], [63, 13, 71], [80, 19, 122],
      [126, 18, 158], [177, 21, 200], [175, 33, 256], [132, 46, 289], [85, 35, 267],
      [51, 21, 225], [40, 17, 178], [62, 18, 137], [96, 24, 102], [83, 42, 59],
      [44, 45, 78], [25, 32, 130], [13, 27, 180]
    ].map(p => v(...p));
    const track = new THREE.CatmullRomCurve3(route, true, 'centripetal');
    track.arcLengthDivisions = 3000;
    const trackLength = track.getLength();

    function frameAt(u) {
      u = (u % 1 + 1) % 1;
      const p = track.getPointAt(u);
      const tangent = track.getTangentAt(u).normalize();
      const before = track.getTangentAt((u - 0.003 + 1) % 1);
      const after = track.getTangentAt((u + 0.003) % 1);
      const turn = before.clone().cross(after).y;
      const bank = clamp(turn * 4.6, -0.52, 0.52);
      const levelRight = tangent.clone().cross(worldUp).normalize();
      const levelUp = levelRight.clone().cross(tangent).normalize();
      const right = levelRight.clone().multiplyScalar(Math.cos(bank)).addScaledVector(levelUp, Math.sin(bank));
      const up = levelUp.multiplyScalar(Math.cos(bank)).addScaledVector(levelRight, -Math.sin(bank));
      return { p, tangent, right, up };
    }
    function orientation(f) {
      return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.right, f.up, f.tangent.clone().negate()));
    }
    function rod(a, b, radius, material, sides = 7) {
      const delta = b.clone().sub(a);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, delta.length(), sides), material);
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(lengthUnit, delta.normalize());
      scene.add(mesh);
      return mesh;
    }
    function terrainHeight(x, z) {
      return -17 + Math.sin(x * 0.012) * 4 + Math.sin(z * 0.017 + x * 0.008) * 5 + Math.sin((x - z) * 0.036) * 1.6;
    }

    // The track is built in the same banking frame that carries the camera.
    const leftRail = [], rightRail = [], centerBeam = [], pinstripeL = [], pinstripeR = [];
    for (let i = 0; i < 1000; i++) {
      const f = frameAt(i / 1000);
      leftRail.push(f.p.clone().addScaledVector(f.right, -0.92).addScaledVector(f.up, 0.08));
      rightRail.push(f.p.clone().addScaledVector(f.right, 0.92).addScaledVector(f.up, 0.08));
      pinstripeL.push(f.p.clone().addScaledVector(f.right, -1.02).addScaledVector(f.up, 0.1));
      pinstripeR.push(f.p.clone().addScaledVector(f.right, 1.02).addScaledVector(f.up, 0.1));
      centerBeam.push(f.p.clone().addScaledVector(f.up, -0.42));
    }
    function tube(points, radius, material, radial = 6) {
      const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal');
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1800, radius, radial, true), material);
      scene.add(mesh);
      return mesh;
    }
    tube(leftRail, 0.105, gold);
    tube(rightRail, 0.105, gold);
    tube(centerBeam, 0.17, steel, 5);
    tube(pinstripeL, 0.022, glow, 5);
    tube(pinstripeR, 0.022, glow, 5);

    const sleeperCount = 340;
    const sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(2.8, 0.13, 0.48), darkSteel, sleeperCount);
    for (let i = 0; i < sleeperCount; i++) {
      const f = frameAt(i / sleeperCount);
      const matrix = new THREE.Matrix4().compose(f.p.clone().addScaledVector(f.up, -0.12), orientation(f), v(1, 1, 1));
      sleepers.setMatrixAt(i, matrix);
    }
    sleepers.instanceMatrix.needsUpdate = true;
    scene.add(sleepers);
    for (let i = 0; i < 95; i++) {
      const f = frameAt(i / 95);
      const foot = v(f.p.x, terrainHeight(f.p.x, f.p.z) - 0.2, f.p.z);
      if (f.p.y - foot.y > 12) rod(f.p.clone().addScaledVector(f.up, -0.65), foot, 0.12, darkSteel, 5);
    }

    const groundGeometry = new THREE.PlaneGeometry(1700, 1700, 110, 110);
    groundGeometry.rotateX(-Math.PI / 2);
    const groundPositions = groundGeometry.attributes.position;
    const groundColors = [];
    const groundColorA = new THREE.Color(0x59404b), groundColorB = new THREE.Color(0x99705e);
    for (let i = 0; i < groundPositions.count; i++) {
      const x = groundPositions.getX(i), z = groundPositions.getZ(i);
      const h = terrainHeight(x, z);
      groundPositions.setY(i, h);
      const shade = clamp((h + 26) / 20, 0, 1);
      const c = groundColorA.clone().lerp(groundColorB, shade * 0.58);
      groundColors.push(c.r, c.g, c.b);
    }
    groundGeometry.setAttribute('color', new THREE.Float32BufferAttribute(groundColors, 3));
    groundGeometry.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
    scene.add(ground);

    const rockMaterials = [0x493544, 0x5c4050, 0x73505a, 0x8c5f59].map(color => new THREE.MeshStandardMaterial({ color, roughness: 1, flatShading: true }));
    for (let i = 0; i < 240; i++) {
      const x = -280 + rand() * 700, z = -330 + rand() * 730;
      let nearTrack = false;
      for (let j = 0; j < 80; j++) {
        const p = track.getPointAt(j / 80);
        if ((p.x - x) ** 2 + (p.z - z) ** 2 < 15 ** 2) { nearTrack = true; break; }
      }
      if (nearTrack) continue;
      const height = 5 + rand() ** 2 * 36;
      const radius = 2 + rand() * 7;
      const rock = new THREE.Mesh(new THREE.CylinderGeometry(radius * (0.15 + rand() * 0.4), radius, height, 4 + Math.floor(rand() * 3), 1), rockMaterials[Math.floor(rand() * rockMaterials.length)]);
      rock.position.set(x, terrainHeight(x, z) + height * 0.48, z);
      rock.rotation.y = rand() * Math.PI;
      scene.add(rock);
    }

    const sky = new THREE.Mesh(new THREE.SphereGeometry(1450, 32, 18), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      vertexShader: 'varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vPos; void main(){ float h=normalize(vPos).y; vec3 high=vec3(0.025,0.035,0.085); vec3 dusk=vec3(0.26,0.10,0.17); vec3 horizon=vec3(0.80,0.34,0.22); vec3 c=mix(horizon,dusk,smoothstep(-0.16,0.19,h)); c=mix(c,high,smoothstep(0.06,0.83,h)); gl_FragColor=vec4(c,1.0); }'
    }));
    scene.add(sky);
    const sun = new THREE.Mesh(new THREE.SphereGeometry(33, 32, 20), new THREE.MeshBasicMaterial({ color: 0xffc07a, toneMapped: false, fog: false }));
    sun.position.set(-315, 99, -630);
    scene.add(sun);
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 128;
    const glowContext = glowCanvas.getContext('2d');
    const gradient = glowContext.createRadialGradient(64, 64, 4, 64, 64, 64);
    gradient.addColorStop(0, 'rgba(255,195,116,.75)');
    gradient.addColorStop(.25, 'rgba(255,123,70,.32)');
    gradient.addColorStop(1, 'rgba(255,87,54,0)');
    glowContext.fillStyle = gradient; glowContext.fillRect(0, 0, 128, 128);
    const sunHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCanvas), blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    sunHalo.position.copy(sun.position); sunHalo.scale.set(235, 235, 1); scene.add(sunHalo);
    scene.add(new THREE.HemisphereLight(0xb9b4d8, 0x7b3e36, 2.1));
    const sunlight = new THREE.DirectionalLight(0xffa568, 2.15);
    sunlight.position.set(-350, 210, -550); scene.add(sunlight);

    const starPositions = [];
    for (let i = 0; i < 570; i++) {
      const az = rand() * Math.PI * 2;
      const elevation = .14 + rand() * 1.15;
      const r = 1120;
      starPositions.push(Math.sin(az) * Math.cos(elevation) * r, Math.sin(elevation) * r, Math.cos(az) * Math.cos(elevation) * r);
    }
    const starsGeometry = new THREE.BufferGeometry();
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffe4d4, size: 2.5, transparent: true, opacity: 0.65, depthWrite: false, fog: false })));

    // Open frames and illuminated rings punctuate the route without closing the view.
    for (const u of [0.15, 0.25, 0.35, 0.47, 0.59, 0.70, 0.81, 0.92]) {
      const f = frameAt(u);
      const left = f.p.clone().addScaledVector(f.right, -5.3);
      const right = f.p.clone().addScaledVector(f.right, 5.3);
      const topLeft = left.clone().addScaledVector(f.up, 7.4);
      const topRight = right.clone().addScaledVector(f.up, 7.4);
      rod(left, topLeft, 0.14, steel);
      rod(right, topRight, 0.14, steel);
      rod(topLeft, topRight, 0.13, steel);
      rod(topLeft.clone().addScaledVector(f.up, -0.18), topRight.clone().addScaledVector(f.up, -0.18), 0.025, glow, 5);
    }
    for (const u of [0.29, 0.65, 0.86]) {
      const f = frameAt(u);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(7.8, 0.09, 7, 90), glow);
      ring.position.copy(f.p).addScaledVector(f.up, 2.2);
      ring.quaternion.setFromUnitVectors(v(0, 0, 1), f.tangent);
      scene.add(ring);
      const halo = new THREE.PointLight(0xff8f44, 65, 40, 2);
      halo.position.copy(ring.position); scene.add(halo);
    }

    const dustPositions = [];
    for (let i = 0; i < 650; i++) {
      const f = frameAt(rand());
      const side = (rand() < .5 ? -1 : 1) * (4 + rand() * 36);
      const p = f.p.clone().addScaledVector(f.right, side).addScaledVector(f.up, -2 + rand() * 19);
      dustPositions.push(p.x, p.y, p.z);
    }
    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute('position', new THREE.Float32BufferAttribute(dustPositions, 3));
    scene.add(new THREE.Points(dustGeometry, new THREE.PointsMaterial({ color: 0xffc89c, size: .55, transparent: true, opacity: .55, depthWrite: false })));

    // Small pieces of the front car remain in view, grounding the first-person camera.
    const car = new THREE.Group();
    camera.add(car); scene.add(camera);
    const nose = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.23, 2.1), new THREE.MeshStandardMaterial({ color: 0x252b38, metalness: 0.7, roughness: 0.27 }));
    nose.position.set(0, -0.97, -1.54); nose.rotation.x = -0.075; car.add(nose);
    const hoodStripe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.024, 2.06), new THREE.MeshBasicMaterial({ color: 0xffa464, toneMapped: false }));
    hoodStripe.position.set(0, -0.835, -1.54); hoodStripe.rotation.x = -0.075; car.add(hoodStripe);
    function carBar(a, b, radius, material) {
      const delta = b.clone().sub(a);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, delta.length(), 8), material);
      bar.position.copy(a).add(b).multiplyScalar(.5);
      bar.quaternion.setFromUnitVectors(lengthUnit, delta.normalize());
      car.add(bar);
    }
    const cockpitMetal = new THREE.MeshStandardMaterial({ color: 0x596070, metalness: .85, roughness: .22 });
    for (const side of [-1, 1]) {
      carBar(v(side * 1.01, -1.17, -.48), v(side * 1.21, -.55, -2.08), .065, cockpitMetal);
      carBar(v(side * 1.21, -.55, -2.08), v(side * .88, -.56, -2.55), .058, cockpitMetal);
    }
    carBar(v(-.86, -.58, -2.54), v(.86, -.58, -2.54), .053, cockpitMetal);

    let distance = trackLength * .012;
    let speed = 40;
    let paused = false;
    let lastTime = performance.now();
    let audio, wind, engine, engineGain, windGain;
    function initAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return false;
      audio = new AudioCtx();
      const noise = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      wind = audio.createBufferSource(); wind.buffer = noise; wind.loop = true;
      const filter = audio.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 410;
      windGain = audio.createGain(); windGain.gain.value = 0;
      wind.connect(filter).connect(windGain).connect(audio.destination); wind.start();
      engine = audio.createOscillator(); engine.type = 'sawtooth'; engine.frequency.value = 39;
      engineGain = audio.createGain(); engineGain.gain.value = 0;
      engine.connect(engineGain).connect(audio.destination); engine.start();
      return true;
    }
    function toggleSound() {
      if (!audio && !initAudio()) return;
      const enabling = soundButton.getAttribute('aria-pressed') !== 'true';
      if (enabling) { audio.resume(); soundButton.textContent = 'SOUND ON'; soundButton.setAttribute('aria-pressed', 'true'); }
      else { audio.suspend(); soundButton.textContent = 'SOUND OFF'; soundButton.setAttribute('aria-pressed', 'false'); }
    }
    function togglePause() {
      paused = !paused;
      pauseButton.textContent = paused ? 'RESUME RIDE' : 'PAUSE RIDE';
      pauseButton.setAttribute('aria-pressed', String(paused));
    }
    pauseButton.addEventListener('click', togglePause);
    soundButton.addEventListener('click', toggleSound);
    addEventListener('keydown', event => {
      if (event.target instanceof HTMLButtonElement && (event.code === 'Space' || event.code === 'Enter')) return;
      if (event.code === 'Space') { event.preventDefault(); togglePause(); }
      if (event.code === 'KeyM') toggleSound();
      if (event.code === 'KeyR') { distance = trackLength * .012; speed = 40; }
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    });

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, .05);
      lastTime = now;
      if (!paused) {
        const f0 = frameAt((distance % trackLength) / trackLength);
        const targetSpeed = clamp(42 - f0.tangent.y * 65, 22, 82);
        speed += (targetSpeed - speed) * Math.min(1, dt * 1.45);
        distance += speed * dt;
      }
      const progress = (distance % trackLength) / trackLength;
      const f = frameAt(progress);
      camera.position.copy(f.p).addScaledVector(f.up, 1.42);
      if (!paused) camera.position.addScaledVector(f.right, Math.sin(now * .033) * .009 * (speed / 60));
      camera.quaternion.copy(orientation(f));
      camera.fov += ((78 + speed / 82 * 8) - camera.fov) * .035;
      camera.updateProjectionMatrix();
      const lap = String(Math.floor(distance / trackLength) + 1).padStart(2, '0');
      lapTop.textContent = lap; lapBottom.textContent = lap;
      speedEl.textContent = String(Math.round(speed * 3.2)).padStart(3, '0');
      progressEl.style.width = `${progress * 100}%`;
      if (audio && audio.state === 'running') {
        windGain.gain.setTargetAtTime(.014 + speed / 3800, audio.currentTime, .1);
        engineGain.gain.setTargetAtTime(.004 + speed / 18000, audio.currentTime, .1);
        engine.frequency.setTargetAtTime(28 + speed * .42, audio.currentTime, .1);
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
