<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#02030a"/>
<title>Miniature Solar System</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#c9d4e3;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  #app{position:fixed;inset:0}
  #app canvas{display:block;cursor:grab;touch-action:none}
  #app canvas:active{cursor:grabbing}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(2,3,10,.55) 100%)}
  .hud{position:fixed;z-index:5;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  #brand{top:18px;left:20px;border-left:2px solid #59c2ff;padding-left:12px}
  #brand h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.35em;color:#e8f1fb}
  #brand p{margin:5px 0 0;font-size:10px;letter-spacing:.18em;color:#7f93ad}
  #hint{bottom:20px;left:20px;font-size:10px;letter-spacing:.14em;color:#7f93ad;line-height:1.9}
  #hint b{color:#b9c9dd;font-weight:600}
  #panel{bottom:16px;right:18px;display:flex;gap:8px;align-items:center;pointer-events:auto;
    background:rgba(8,12,22,.55);border:1px solid rgba(255,255,255,.09);border-radius:10px;
    padding:8px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #panel button{font:inherit;font-size:10px;letter-spacing:.12em;color:#cfe0f2;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px}
  #panel button:hover{background:rgba(255,255,255,.13)}
  #speedwrap{display:flex;flex-direction:column;gap:3px;margin:0 4px}
  #speed{width:130px;accent-color:#59c2ff}
  #speedlabel{font-size:9px;letter-spacing:.1em;color:#7f93ad;text-align:right;white-space:nowrap}
  #tip{position:fixed;z-index:9;display:none;pointer-events:none;font-size:10px;letter-spacing:.22em;
    color:#dff0ff;background:rgba(8,14,26,.8);border:1px solid rgba(120,180,255,.35);
    padding:3px 9px;border-radius:99px;transform:translate(-50%,-170%)}
  #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#02030a;color:#6d84a3;font-size:11px;letter-spacing:.3em;transition:opacity .5s}
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>

<div class="hud" id="brand">
  <h1>MINIATURE SOLAR SYSTEM</h1>
  <p>PROCEDURAL THREE.JS &middot; SINGLE FILE</p>
</div>

<div class="hud" id="hint">
  <b>DRAG</b> ORBIT &nbsp;&middot;&nbsp; <b>SCROLL / PINCH</b> ZOOM<br/>
  <b>HOVER</b> IDENTIFY &nbsp;&middot;&nbsp; <b>SPACE</b> PAUSE
</div>

<div class="hud" id="panel">
  <button id="pauseBtn" type="button">PAUSE</button>
  <button id="resetBtn" type="button">RESET VIEW</button>
  <div id="speedwrap">
    <input id="speed" type="range" min="0" max="250" step="5" value="100"/>
    <span id="speedlabel"></span>
  </div>
</div>

<div id="tip"></div>
<div id="loading">LOADING&hellip;</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
  }
}
</script>

<script type="module">
(async () => {
  const loadEl = document.getElementById('loading');
  const fail = (err) => {
    loadEl.textContent = 'FAILED TO LOAD THREE.JS - CHECK NETWORK';
    loadEl.style.color = '#ff8f7a';
    console.error(err);
  };
  let THREE;
  try {
    THREE = await import('three');
  } catch (err1) {
    try {
      THREE = await import('https://unpkg.com/three@0.160.1/build/three.module.js');
    } catch (err2) { fail(err2); return; }
  }
  try { init(THREE, loadEl); } catch (err) { fail(err); }
})();

function init(THREE, loadEl) {
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ---------- deterministic rng ----------
  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- procedural textures ----------
  function canvasTex(w, h, draw) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    draw(cv.getContext('2d'), w, h);
    const tx = new THREE.CanvasTexture(cv);
    tx.colorSpace = THREE.SRGBColorSpace;
    tx.anisotropy = 4;
    return tx;
  }

  function puff(ctx, x, y, r, rgb, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function bandedTexture(colors, opt) {
    opt = opt || {};
    const tx = canvasTex(opt.w || 512, opt.h || 256, function (ctx, w, h) {
        const rand = rng(opt.seed || 7);
        const n = colors.length;
        let y = 0;
        while (y < h) {
          const bh = (h / n) * (0.55 + rand() * 0.9);
          ctx.fillStyle = colors[Math.floor(rand() * n)];
          ctx.fillRect(0, y - 1, w, bh + 2);
          y += bh;
        }
        for (let i = 0; i < (opt.streaks || 70); i++) {
          ctx.fillStyle = 'rgba(' + (rand() < 0.5 ? '255,255,255' : '0,0,10') + ',' + (0.03 + rand() * 0.05) + ')';
          ctx.fillRect(rand() * w, rand() * h, 40 + rand() * 220, 1 + rand() * 2.5);
        }
        for (let i = 0; i < (opt.noise || 260); i++) {
          ctx.fillStyle = 'rgba(' + (rand() < 0.5 ? '255,255,255' : '0,0,10') + ',' + (0.04 + rand() * 0.07) + ')';
          ctx.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1 + rand() * 7);
        }
        if (opt.speckle) {
          for (let i = 0; i < opt.speckle; i++) {
            ctx.fillStyle = 'rgba(' + (rand() < 0.5 ? '20,16,14' : '230,220,205') + ',' + (0.08 + rand() * 0.14) + ')';
            ctx.beginPath();
            ctx.arc(rand() * w, rand() * h, 0.6 + rand() * 1.8, 0, TAU);
            ctx.fill();
          }
        }
        if (opt.storm) {
          puff(ctx, w * 0.68, h * 0.63, 30, '178,74,50', 0.9);
          puff(ctx, w * 0.68, h * 0.63, 14, '212,98,66', 0.9);
        }
      });
      tx.wrapS = THREE.RepeatWrapping;
      return tx;
  }

  function earthTexture() {
    return canvasTex(512, 256, function (ctx, w, h) {
      const rand = rng(33);
      const sea = ctx.createLinearGradient(0, 0, 0, h);
      sea.addColorStop(0, '#2c5f9e'); sea.addColorStop(0.5, '#2a72b8'); sea.addColorStop(1, '#2c5f9e');
      ctx.fillStyle = sea; ctx.fillRect(0, 0, w, h);
      const greens = ['#2f7a3a', '#3f8f43', '#57a04b', '#6b8f3a', '#2e6e46'];
      for (let i = 0; i < 16; i++) {
        const cx = rand() * w, cy = h * (0.18 + rand() * 0.64);
        const rx = 18 + rand() * 58, ry = 9 + rand() * 26;
        ctx.fillStyle = greens[Math.floor(rand() * greens.length)];
        ctx.globalAlpha = 0.85 + rand() * 0.15;
        ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rand() * Math.PI, 0, TAU); ctx.fill();
        for (let j = 0; j < 4; j++) {
          ctx.beginPath();
          ctx.arc(cx + (rand() - 0.5) * rx * 1.6, cy + (rand() - 0.5) * ry * 1.4, 4 + rand() * 12, 0, TAU);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#eef6fc';
      ctx.beginPath(); ctx.ellipse(w / 2, h * 0.03, w * 0.42, h * 0.075, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w / 2, h * 0.985, w * 0.46, h * 0.07, 0, 0, TAU); ctx.fill();
      for (let i = 0; i < 90; i++) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.08 + rand() * 0.14) + ')';
        ctx.beginPath(); ctx.ellipse(rand() * w, rand() * h, 10 + rand() * 46, 2 + rand() * 7, 0, 0, TAU); ctx.fill();
      }
    });
  }

  function sunTexture() {
    return canvasTex(512, 256, function (ctx, w, h) {
      const rand = rng(5);
      ctx.fillStyle = '#f08a1e'; ctx.fillRect(0, 0, w, h);
      const tones = ['255,209,102', '255,166,51', '255,120,20', '255,232,163'];
      for (let i = 0; i < 240; i++) {
        puff(ctx, rand() * w, rand() * h, 6 + rand() * 30, tones[Math.floor(rand() * tones.length)], 0.10 + rand() * 0.16);
      }
      for (let i = 0; i < 50; i++) puff(ctx, rand() * w, rand() * h, 1.5 + rand() * 3, '255,246,207', 0.5 + rand() * 0.4);
      for (let i = 0; i < 26; i++) puff(ctx, rand() * w, rand() * h, 8 + rand() * 20, '196,90,10', 0.10 + rand() * 0.10);
    });
  }

  function glowTexture() {
    return canvasTex(256, 256, function (ctx, w, h) {
      const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      g.addColorStop(0.00, 'rgba(255,236,190,0.85)');
      g.addColorStop(0.25, 'rgba(255,176,84,0.42)');
      g.addColorStop(0.55, 'rgba(255,122,40,0.14)');
      g.addColorStop(1.00, 'rgba(255,110,30,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    });
  }

  function ringTexture() {
    return canvasTex(512, 16, function (ctx, w, h) {
      const bands = [
        [0.00, 0.05, 0.00], [0.05, 0.20, 0.40], [0.20, 0.30, 0.65],
        [0.30, 0.36, 0.30], [0.36, 0.58, 0.85], [0.58, 0.64, 0.06],
        [0.64, 0.84, 0.60], [0.84, 0.92, 0.32], [0.92, 1.00, 0.14]
      ];
      for (const b of bands) {
        ctx.fillStyle = 'rgba(214,199,163,' + b[2] + ')';
        ctx.fillRect(b[0] * w, 0, (b[1] - b[0]) * w + 1, h);
      }
      const rand = rng(12);
      for (let x = 0; x < w; x += 3) {
        if (rand() < 0.5) {
          ctx.fillStyle = 'rgba(255,255,255,' + (0.03 + rand() * 0.05) + ')';
          ctx.fillRect(x, 0, 2, h);
        }
      }
    });
  }

  // ---------- renderer / scene ----------
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02030a);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);

  scene.add(new THREE.AmbientLight(0x8fa3c7, 0.32));
  const sunLight = new THREE.PointLight(0xfff0d8, 3.2, 0, 0);
  scene.add(sunLight);

  // ---------- sun + corona ----------
  const SUN_R = 5;
  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(SUN_R, 48, 32),
    new THREE.MeshBasicMaterial({ map: sunTexture() })
  );
  sun.userData.label = 'Sun';
  scene.add(sun);

  const glowTex = glowTexture();
  function mkGlow(scale, opacity) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: opacity,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    s.material.toneMapped = false;
    s.scale.setScalar(scale);
    scene.add(s);
    return s;
  }
  const glowA = mkGlow(24, 1);
  const glowB = mkGlow(56, 0.55);

  // ---------- starfield ----------
  (function () {
    const N = 2300;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    const rand = rng(777);
    const v = new THREE.Vector3();
    for (let i = 0; i < N; i++) {
      v.set(rand() * 2 - 1, rand() * 2 - 1, rand() * 2 - 1);
      if (v.lengthSq() < 1e-4) v.set(1, 0, 0);
      v.normalize().multiplyScalar(300 + rand() * 280);
      pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
      const t = rand(), b = 0.55 + rand() * 0.45;
      let r, g, bl;
      if (t < 0.7) { r = g = bl = 1; }
      else if (t < 0.88) { r = 0.72; g = 0.82; bl = 1; }
      else { r = 1; g = 0.84; bl = 0.66; }
      col[i * 3] = r * b; col[i * 3 + 1] = g * b; col[i * 3 + 2] = bl * b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({
      size: 1.4, vertexColors: true, sizeAttenuation: true,
      transparent: true, opacity: 0.95, depthWrite: false
    });
    m.toneMapped = false;
    scene.add(new THREE.Points(g, m));
  })();

  // ---------- asteroid belt ----------
  const belt = (function () {
    const N = 1300;
    const pos = new Float32Array(N * 3);
    const rand = rng(2024);
    for (let i = 0; i < N; i++) {
      const a = rand() * TAU;
      const rr = 32 + rand() * 5 + (rand() < 0.15 ? rand() * 2 : 0);
      pos[i * 3] = Math.cos(a) * rr;
      pos[i * 3 + 1] = (rand() - 0.5) * 1.6;
      pos[i * 3 + 2] = Math.sin(a) * rr;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const m = new THREE.PointsMaterial({
      color: 0xa8977a, size: 0.32, sizeAttenuation: true,
      transparent: true, opacity: 0.75
    });
    const p = new THREE.Points(g, m);
    scene.add(p);
    return p;
  })();

  // ---------- planets ----------
  const PLANETS = [
    { name: 'MERCURY', size: 0.55, dist: 11.0, period: 88,    spin: 58,     tilt: 0.03, incl: 7.0, seed: 11, kind: 'rock',
      colors: ['#8a8a8f', '#6e6e73', '#9c9ca1', '#7b7b81', '#5f5f64'] },
    { name: 'VENUS',   size: 0.95, dist: 15.5, period: 225,   spin: -243,   tilt: 177,  incl: 3.4, seed: 22, kind: 'rock',
      colors: ['#e8cfa4', '#d9b47e', '#f0e2ba', '#c9a069'] },
    { name: 'EARTH',   size: 1.00, dist: 21.0, period: 365.25, spin: 1,     tilt: 23.4, incl: 0.0, seed: 33, kind: 'earth' },
    { name: 'MARS',    size: 0.72, dist: 27.0, period: 687,   spin: 1.03,   tilt: 25.2, incl: 1.9, seed: 44, kind: 'rock',
      colors: ['#b5623a', '#8f4a2c', '#c97b4a', '#7a3d23', '#a05531'] },
    { name: 'JUPITER', size: 3.00, dist: 41.0, period: 4333,  spin: 0.41,   tilt: 3.1,  incl: 1.3, seed: 55, kind: 'gas',
      colors: ['#c9a06e', '#a67a4e', '#e3c69b', '#8a5f3c', '#d9b285', '#b98a5a'], storm: true },
    { name: 'SATURN',  size: 2.50, dist: 54.0, period: 10759, spin: 0.45,   tilt: 26.7, incl: 2.5, seed: 66, kind: 'gas',
      colors: ['#e6d2a6', '#d4bb85', '#efe2bf', '#c8ad78', '#dcc494'],
      ring: { inner: 3.1, outer: 5.6 } },
    { name: 'URANUS',  size: 1.70, dist: 66.0, period: 30687, spin: -0.72,  tilt: 97.8, incl: 0.8, seed: 77, kind: 'gas',
      colors: ['#9fd8dd', '#8accd4', '#b5e4e8', '#7fc0c9'],
      ring: { inner: 2.3, outer: 3.3, faint: true } },
    { name: 'NEPTUNE', size: 1.65, dist: 76.0, period: 60190, spin: 0.67,   tilt: 28.3, incl: 1.8, seed: 88, kind: 'gas',
      colors: ['#3b62d9', '#2f4fb8', '#5b7fe8', '#27409a'] }
  ];

  const pickables = [sun];
  const records = [];

  function orbitLine(r) {
    const pts = [];
    for (let i = 0; i <= 160; i++) {
      const a = (i / 160) * TAU;
      pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    return new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x6f87b8, transparent: true, opacity: 0.16 }));
  }

  function makeRing(inner, outer, tex, opacity) {
    const geo = new THREE.RingGeometry(inner, outer, 180, 1);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const t = (v.length() - inner) / (outer - inner);
      uv.setXY(i, t, 0.5);
    }
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: opacity,
      side: THREE.DoubleSide, depthWrite: false
    });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    return m;
  }

  PLANETS.forEach(function (def, i) {
    const grp = new THREE.Group();
    const node = i * 1.1;
    grp.rotation.x = def.incl * DEG * Math.cos(node);
    grp.rotation.z = def.incl * DEG * Math.sin(node);
    scene.add(grp);
    grp.add(orbitLine(def.dist));

    const pivot = new THREE.Group(); grp.add(pivot);
    const anchor = new THREE.Group(); anchor.position.x = def.dist; pivot.add(anchor);
    const tiltH = new THREE.Group(); tiltH.rotation.z = def.tilt * DEG; anchor.add(tiltH);

    let map;
    if (def.kind === 'earth') map = earthTexture();
    else map = bandedTexture(def.colors, { seed: def.seed, storm: def.storm, speckle: def.kind === 'rock' ? 800 : 0 });

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(def.size, 40, 26),
      new THREE.MeshStandardMaterial({ map: map, roughness: def.kind === 'earth' ? 0.75 : 0.95, metalness: 0 })
    );
    mesh.userData.label = def.name;
    tiltH.add(mesh);
    pickables.push(mesh);

    if (def.ring) {
      tiltH.add(makeRing(def.ring.inner, def.ring.outer, ringTexture(), def.ring.faint ? 0.3 : 0.95));
    }

    const rec = {
      name: def.name,
      pivot: pivot,
      mesh: mesh,
      phase: i * 2.4 + 0.6,
      orbitRate: TAU / def.period,
      spinRate: TAU / def.spin,
      spinPhase: def.seed % 7
    };

    if (def.kind === 'earth') {
      tiltH.add(new THREE.Mesh(
        new THREE.SphereGeometry(def.size * 1.07, 40, 26),
        new THREE.MeshBasicMaterial({
          color: 0x3d7fd6, transparent: true, opacity: 0.14,
          side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false
        })
      ));
      const mpivot = new THREE.Group(); mpivot.rotation.x = 5.1 * DEG; anchor.add(mpivot);
      const mmesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 24, 16),
        new THREE.MeshStandardMaterial({
          map: bandedTexture(['#b9b9bd', '#8f8f95', '#a6a6ab', '#7c7c82'], { seed: 99 }),
          roughness: 1
        })
      );
      mmesh.position.x = 2.5;
      mmesh.userData.label = 'MOON';
      mpivot.add(mmesh);
      pickables.push(mmesh);
      rec.moon = { pivot: mpivot, rate: TAU / 27.32, phase: 2.1 };
    }

    records.push(rec);
  });

  // ---------- camera controls (custom orbit) ----------
  const INIT = { theta: 0.9, phi: 1.12, r: 135 };
  const MIN_R = 12, MAX_R = 480;
  const ctl = { theta: INIT.theta, phi: INIT.phi, radius: INIT.r, targetR: INIT.r };

  const el = renderer.domElement;
  const pointers = new Map();
  let lastPinch = 0;

  el.addEventListener('pointerdown', function (e) {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  });
  el.addEventListener('pointerup', function (e) {
    pointers.delete(e.pointerId);
    lastPinch = 0;
  });
  el.addEventListener('pointercancel', function (e) {
    pointers.delete(e.pointerId);
    lastPinch = 0;
  });
  el.addEventListener('pointermove', function (e) {
    onHover(e);
    if (!pointers.has(e.pointerId)) return;
    const p = pointers.get(e.pointerId);
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
      ctl.theta -= dx * 0.005;
      ctl.phi = clamp(ctl.phi - dy * 0.005, 0.05, Math.PI - 0.05);
    } else if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinch > 0) ctl.targetR = clamp(ctl.targetR * (lastPinch / d), MIN_R, MAX_R);
      lastPinch = d;
    }
  });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    ctl.targetR = clamp(ctl.targetR * Math.exp(e.deltaY * 0.0012), MIN_R, MAX_R);
  }, { passive: false });

  // ---------- hover tooltip ----------
  const tip = document.getElementById('tip');
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  function onHover(e) {
    ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    if (hits.length) {
      tip.textContent = hits[0].object.userData.label;
      tip.style.display = 'block';
      tip.style.left = e.clientX + 'px';
      tip.style.top = e.clientY + 'px';
    } else {
      tip.style.display = 'none';
    }
  }

  // ---------- HUD ----------
  const DAYS_PER_SEC = 40;
  let paused = false;
  let speedMul = 1;
  let simDays = 0;
  let tGlobal = 0;

  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedInput = document.getElementById('speed');
  const speedLabel = document.getElementById('speedlabel');

  function setPaused(v) {
    paused = v;
    pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
  }
  pauseBtn.addEventListener('click', function () { setPaused(!paused); });
  resetBtn.addEventListener('click', function () {
    ctl.theta = INIT.theta; ctl.phi = INIT.phi; ctl.targetR = INIT.r;
  });
  function applySpeed() {
    speedMul = Number(speedInput.value) / 100;
    speedLabel.textContent = 'TIME x' + speedMul.toFixed(2) + ' \u00B7 ' +
      Math.round(DAYS_PER_SEC * speedMul) + ' D/S';
  }
  speedInput.addEventListener('input', applySpeed);
  applySpeed();

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      setPaused(!paused);
    }
  });
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animation loop ----------
  function syncBodies() {
    for (const r of records) {
      r.pivot.rotation.y = r.phase + simDays * r.orbitRate;
      r.mesh.rotation.y = r.spinPhase + simDays * r.spinRate;
      if (r.moon) r.moon.pivot.rotation.y = r.moon.phase + simDays * r.moon.rate;
    }
    belt.rotation.y = simDays * TAU / 1700;
  }

  const clock = new THREE.Clock();
  let frameDone = false;

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    tGlobal += dt;
    if (!paused) simDays += dt * DAYS_PER_SEC * speedMul;
    syncBodies();

    ctl.radius += (ctl.targetR - ctl.radius) * Math.min(1, dt * 7);
    camera.position.set(
      ctl.radius * Math.sin(ctl.phi) * Math.sin(ctl.theta),
      ctl.radius * Math.cos(ctl.phi),
      ctl.radius * Math.sin(ctl.phi) * Math.cos(ctl.theta)
    );
    camera.lookAt(0, 0, 0);

    glowA.scale.setScalar(24 + Math.sin(tGlobal * 1.7) * 0.8);
    glowB.scale.setScalar(56 + Math.sin(tGlobal * 1.1 + 1.3) * 1.6);

    renderer.render(scene, camera);

    if (!frameDone) {
      frameDone = true;
      loadEl.style.opacity = '0';
      setTimeout(function () { loadEl.remove(); }, 600);
    }
  }
  tick();
}
</script>
</body>
</html>
