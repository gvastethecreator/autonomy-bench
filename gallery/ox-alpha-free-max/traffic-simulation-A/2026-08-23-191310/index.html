<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MicroCity — Traffic Simulation</title>
<style>
  :root{
    --panel:rgba(13,16,20,.74); --line:rgba(255,255,255,.08);
    --txt:#e8ecf2; --dim:#9aa4af; --accent:#4f8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#101418}
  body{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt)}
  #wrap{position:relative;width:min(1280px,100vw);margin:0 auto}
  canvas{display:block;width:100%}
  .panel{
    position:absolute;background:var(--panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:13px;line-height:1.35;
    pointer-events:auto;user-select:none;
  }
  #title{top:14px;left:14px}
  #title h1{margin:0;font-size:15px;letter-spacing:.4px}
  #title p{margin:3px 0 0;color:var(--dim);font-size:11.5px}
  #ui{top:14px;right:14px;width:216px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:6px}
  button{flex:1;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:#232a33;color:var(--txt);cursor:pointer;font-size:12.5px}
  button:hover{background:#2c3540}
  button.primary{background:var(--accent);border-color:transparent;font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  label{display:flex;flex-direction:column;gap:3px;color:var(--dim);font-size:11.5px}
  label span b{color:var(--txt);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
  #stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:2px;border-top:1px solid var(--line);padding-top:9px}
  #stats div{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  #stats div b{display:block;font-size:15px;color:var(--txt);font-variant-numeric:tabular-nums;margin-bottom:1px}
  #hint{bottom:12px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:11.5px;padding:6px 12px;white-space:nowrap}
  kbd{background:#22282f;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:inherit;font-size:10.5px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div class="panel" id="title">
    <h1>🚦 MicroCity Traffic</h1>
    <p>IDM car-following · signalized grid · emergent jams</p>
  </div>

  <div class="panel" id="ui">
    <div class="row">
      <button id="bPlay" class="primary">⏸ Pause</button>
      <button id="bNight">🌙 Night</button>
      <button id="bReset" title="Reset">↻</button>
    </div>
    <label>Traffic <span><b id="vRate">70</b> veh/min</span>
      <input id="rate" type="range" min="10" max="220" value="70">
    </label>
    <label>Simulation speed <span><b id="vSpeed">1</b>×</span>
      <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1">
    </label>
    <div id="stats">
      <div>Vehicles<b id="sN">0</b></div>
      <div>Avg speed<b id="sV">0 km/h</b></div>
      <div>Inflow<b id="sF">0 /min</b></div>
      <div>Congestion<b id="sC">0%</b></div>
    </div>
  </div>

  <div class="panel" id="hint"><kbd>Space</kbd> pause · <kbd>N</kbd> night · <kbd>R</kbd> reset</div>
</div>

<script>
(() => {
'use strict';

/* ============================== helpers ============================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (a, n) => ((a % n) + n) % n;

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(12345);
const ri = n => Math.floor(rng() * n);
const rr = (a, b) => a + rng() * (b - a);

function rrect(g, x, y, w, h, r){
  if (g.roundRect){ g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(g, x1, y1, x2, y2){ g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }

function segSegDist(p1, p2, p3, p4){
  const d1x = p2.x - p1.x, d1y = p2.y - p1.y;
  const d2x = p4.x - p3.x, d2y = p4.y - p3.y;
  const rx = p3.x - p1.x,  ry = p3.y - p1.y;
  const a = (d1x * d1x + d1y * d1y) || 1e-9;
  const c = (d2x * d2x + d2y * d2y) || 1e-9;
  const b = d1x * d2x + d1y * d2y;
  const d = d1x * rx + d1y * ry;
  const e = d2x * rx + d2y * ry;
  const den = a * c - b * b;
  let s = den ? clamp((b * e - c * d) / den, 0, 1) : 0;
  let t = clamp((b * s + e) / c, 0, 1);
  s = clamp((b * t - d) / a, 0, 1);
  t = clamp((b * s + e) / c, 0, 1);
  return Math.hypot(p1.x + d1x * s - (p3.x + d2x * t),
                    p1.y + d1y * s - (p3.y + d2y * t));
}
function polyClose(A, B, thr){
  for (let i = 0; i < A.length - 1; i++)
    for (let j = 0; j < B.length - 1; j++)
      if (segSegDist(A[i], A[i+1], B[j], B[j+1]) < thr) return true;
  return false;
}

/* ============================== config ============================== */
const DT = 1 / 60;            // fixed physics step (sim seconds)
const PXM = 4;                // pixels per meter (for the speed readout)
const CFG = {
  margin: 70, spacingMin: 140,
  stopPad: 38,                // stop-line distance from intersection center
  roadHalf: 24, laneOff: 13, sidewalk: 9,
  carLen: 17, carWid: 8.6,
  // IDM (pixel units): 56 px/s ≈ 50 km/h
  v0: 56, aMax: 7, bComf: 7.5, bHard: 12,
  minGap: 8, headway: 1.05,
  vTurn: 30, vTurnApp: 34,
  gGreen: 6.5, gYellow: 1.2, gAllRed: 0.8,
  maxCars: 175, prefill: 44,
};
CFG.cycle = 2 * (CFG.gGreen + CFG.gYellow + CFG.gAllRed);
CFG.half  = CFG.gGreen + CFG.gYellow + CFG.gAllRed;

const THEMES = {
  day: {
    bg:'#8ba471', side:'#b9b3a4', park:'#7ca361', asphalt:'#484c52',
    center:'#d9b95c', mark:'#efe9d8',
    bld:['#c8b7a2','#b6a08e','#a89a8a','#cec3ad','#9fa6a8','#c3ac96','#b2a995','#c9beb2'],
    tree:'#4e7a43', treeHi:'#619254', water:'#7fa8bd'
  },
  night: {
    bg:'#20261f', side:'#33383a', park:'#28352a', asphalt:'#2e3136',
    center:'#8f7f4a', mark:'#8a857a',
    bld:['#2a2e33','#26292e','#2d3036','#282b30','#2b2e34'],
    tree:'#2c4429', treeHi:'#374f31', water:'#31424e'
  }
};
const CARCOLORS = ['#d94f45','#3f7fbf','#e2b23c','#58b368','#8a67ab',
                   '#d9772f','#cfd4da','#4a4f57','#7fb3c8','#b8484f'];

/* ============================== state ============================== */
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const stat = document.createElement('canvas');   // pre-rendered static layer
const sctx = stat.getContext('2d');

let W = 0, H = 0, DPR = 1;
let nodes = [], edges = [], conns = [], connById = new Map();
let xs = [], ys = [];
let cars = [];
let tSim = 0, paused = false, speedMul = 1, theme = 'day';
let rate = 70, acc = 0, lastT = 0, statClock = 0;
let trips = 0, flowT = [], spawnAcc = 0;

/* ============================== network ============================== */
function build(){
  rng = mulberry32((Math.random() * 1e9) | 0);
  const M = CFG.margin;

  let cols = Math.max(3, Math.round((W - 2 * M) / CFG.spacingMin) + 1);
  let rows = Math.max(3, Math.round((H - 2 * M) / CFG.spacingMin) + 1);
  cols = Math.min(cols, Math.ceil(W / 110));
  rows = Math.min(rows, Math.ceil(H / 110));

  xs = []; ys = [];
  for (let c = 0; c < cols; c++) xs.push(M + (W - 2 * M) * c / (cols - 1));
  for (let r = 0; r < rows; r++) ys.push(M + (H - 2 * M) * r / (rows - 1));

  nodes = []; edges = []; conns = []; connById.clear();

  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      nodes.push({
        r, c, x: xs[c], y: ys[r],
        off: mod(c * 2.9 + r * 1.1, CFG.cycle),   // diagonal "green wave"
        in: [], out: [], waiting: [],
        active: new Map(),                        // connId -> conn (cars inside box)
        stH: 'R', stV: 'R'
      });

  const nid = (r, c) => r * cols + c;

  function addEdge(a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;      // travel direction
    const rx = -uy, ry = ux;                 // right-hand side
    const SP = CFG.stopPad, LO = CFG.laneOff;
    const e = {
      from: a, to: b, axis: dy === 0 ? 'H' : 'V',
      ux, uy, rx, ry,
      p0: { x: a.x + ux * SP + rx * LO, y: a.y + uy * SP + ry * LO },
      p1: { x: b.x - ux * SP + rx * LO, y: b.y - uy * SP + ry * LO },
      conns: [], len: 0
    };
    e.len = Math.hypot(e.p1.x - e.p0.x, e.p1.y - e.p0.y);
    edges.push(e); a.out.push(e); b.in.push(e);
  }

  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++){
      if (c + 1 < cols){ addEdge(nodes[nid(r,c)], nodes[nid(r,c+1)]); addEdge(nodes[nid(r,c+1)], nodes[nid(r,c)]); }
      if (r + 1 < rows){ addEdge(nodes[nid(r,c)], nodes[nid(r+1,c)]); addEdge(nodes[nid(r+1,c)], nodes[nid(r,c)]); }
    }

  /* Turning connections through each intersection (quadratic bezier). */
  for (const e of edges){
    const B = e.to;
    for (const f of B.out){
      if (f.to === e.from) continue;                       // no U-turns
      const dot = e.ux * f.ux + e.uy * f.uy;
      const turn = Math.abs(dot) < 0.5;
      let cp;
      if (!turn)              cp = { x: (e.p1.x + f.p0.x) / 2, y: (e.p1.y + f.p0.y) / 2 };
      else if (e.axis === 'H') cp = { x: f.p0.x, y: e.p1.y };
      else                     cp = { x: e.p1.x, y: f.p0.y };

      const poly = [{ x: e.p1.x, y: e.p1.y }];
      const cum = [0];
      const N = 14;
      let px = e.p1.x, py = e.p1.y;
      for (let i = 1; i <= N; i++){
        const t = i / N, it = 1 - t;
        const x = it*it*e.p1.x + 2*it*t*cp.x + t*t*f.p0.x;
        const y = it*it*e.p1.y + 2*it*t*cp.y + t*t*f.p0.y;
        poly.push({ x, y });
        cum.push(cum[i-1] + Math.hypot(x - px, y - py));
        px = x; py = y;
      }
      const cn = {
        in: e, out: f, node: B, turn, cp,
        len: cum[N], cum, poly,
        conf: new Set(), id: conns.length
      };
      conns.push(cn); connById.set(cn.id, cn); e.conns.push(cn);
    }
  }

  /* Conflict pairs: two movements may not cross the box at the same time.
     Same-approach movements are exempt (followers handled by car-following). */
  for (const n of nodes){
    const list = [];
    for (const e of n.in) for (const cn of e.conns) list.push(cn);
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++){
        const a = list[i], b = list[j];
        if (a.in === b.in) continue;
        if (polyClose(a.poly, b.poly, 11)){ a.conf.add(b.id); b.conf.add(a.id); }
      }
  }
}

function lightState(node, axis, t){
  const ph = mod(t + node.off, CFG.cycle);
  const p  = axis === 'H' ? ph : mod(ph - CFG.half, CFG.cycle);
  return p < CFG.gGreen ? 'G' : p < CFG.gGreen + CFG.gYellow ? 'Y' : 'R';
}

/* ============================== cars ============================== */
function chooseNext(car){
  const opts = car.edge.conns;
  if (!opts.length){ car.next = null; return; }
  let tot = 0;
  const ws = opts.map(k => {
    const cross = car.edge.ux * k.out.uy - car.edge.uy * k.out.ux;
    const w = k.turn ? (cross > 0 ? 0.24 : 0.21) : 0.55;   // straight-biased
    tot += w; return w;
  });
  let r = rng() * tot;
  for (let i = 0; i < opts.length; i++){
    r -= ws[i];
    if (r <= 0){ car.next = opts[i]; return; }
  }
  car.next = opts[opts.length - 1];
}

function makeCar(edge, s, v){
  const car = {
    edge, s, v, phase: 'road',
    color: CARCOLORS[ri(CARCOLORS.length)],
    wait: 0, commit: false, admitted: false,
    brk: false, next: null, c: 0,
    trip: 5 + ri(9),    // intersections to cross before leaving the network
    dying: 0            // >0: fading out
  };
  chooseNext(car);
  return car;
}

function spawn(){
  if (cars.length >= CFG.maxCars) return;
  for (let att = 0; att < 6; att++){
    const e = edges[ri(edges.length)];
    let ok = true;
    for (const o of cars)
      if (o.phase === 'road' && o.edge === e && o.s < 42){ ok = false; break; }
    if (!ok) continue;
    cars.push(makeCar(e, 0, CFG.v0 * rr(0.7, 0.95)));
    trips++; flowT.push(tSim);
    return;
  }
}

function prefill(){
  let tries = 0;
  while (cars.length < CFG.prefill && tries++ < 800){
    const e = edges[ri(edges.length)];
    const s = rr(6, Math.max(8, e.len - 30));
    let ok = true;
    for (const o of cars)
      if (o.phase === 'road' && o.edge === e && Math.abs(o.s - s) < 30){ ok = false; break; }
    if (ok) cars.push(makeCar(e, s, CFG.v0 * rr(0.6, 0.95)));
  }
}

/* Intelligent-driver model (pixel units). */
function idm(v, v0, gap, dv){
  const free = 1 - Math.pow(v / Math.max(v0, 1), 4);
  if (gap === Infinity || gap > 400) return CFG.aMax * Math.max(free, -1);
  const g = Math.max(gap, 0.5);
  const ss = CFG.minGap + Math.max(0, v * CFG.headway + v * dv / (2 * Math.sqrt(CFG.aMax * CFG.bComf)));
  return clamp(CFG.aMax * (free - Math.pow(ss / g, 2)), -26, CFG.aMax);
}

/* ============================== physics ============================== */
function stepRoad(car, dt){
  const e = car.edge;

  /* nearest leader: same lane, cars spilling out of the box, mergers */
  let gap = Infinity, lv = 0;
  for (const o of cars){
    if (o === car) continue;
    if (o.phase === 'road' && o.edge === e){
      if (o.s > car.s){
        const g = o.s - car.s - CFG.carLen;
        if (g < gap){ gap = g; lv = o.v; }
      }
    } else if (o.phase === 'cross' && o.next.in === e){
      const g = e.len + o.c - car.s - CFG.carLen;
      if (g < gap){ gap = g; lv = o.v; }
    } else if (o.phase === 'cross' && o.next.out === e){
      const pos = o.c - o.next.len;                 // position on my edge once merged
      if (pos > car.s){
        const g = pos - car.s - CFG.carLen;
        if (g < gap){ gap = g; lv = o.v; }
      }
    }
  }

  const dEnd = e.len - car.s;
  if (car.next && dEnd < 70){                        // don't enter a blocked street
    for (const o of cars)
      if (o.phase === 'road' && o.edge === car.next.out){
        const g = dEnd + o.s - CFG.carLen;
        if (g < gap){ gap = g; lv = o.v; }
      }
  }

  let v0 = CFG.v0;
  if (car.next && car.next.turn && dEnd < 46) v0 = CFG.vTurnApp;

  const st = e.axis === 'H' ? e.to.stH : e.to.stV;
  const atLine = car.s >= e.len - 0.01;

  if (atLine){
    if (car.admitted && car.next){                   // enter the intersection
      car.phase = 'cross'; car.c = 0;
      stepCross(car, dt);
      return;
    }
    car.v = 0; car.brk = true; car.wait += dt;
    return;
  }

  if (st === 'Y'){
    const brakeDist = car.v * car.v / (2 * CFG.bHard) + 3;
    if (dEnd < brakeDist) car.commit = true;         // too close to stop: go
  }
  const canStop = dEnd > car.v * car.v / (2 * CFG.bComf);
  const mustStop = (st === 'R' && !car.commit) || (st === 'Y' && canStop && !car.commit);

  let a;
  if (mustStop){
    a = idm(car.v, Math.min(v0, 22), dEnd - CFG.minGap * 0.6, car.v);
  } else {
    a = idm(car.v, v0, gap, car.v - lv);
  }
  car.brk = a < -4.5;
  car.v = clamp(car.v + a * dt, 0, 95);
  car.s += car.v * dt;
  if (car.s >= e.len){ car.s = e.len; if (car.v < 2) car.v = 0; }
}

function stepCross(car, dt){
  const k = car.next, L = k.len;
  let gap = Infinity, lv = 0;
  for (const o of cars){
    if (o === car) continue;
    if (o.phase === 'cross' && o.next.in === k.in && o.c > car.c){
      const g = o.c - car.c - CFG.carLen;
      if (g < gap){ gap = g; lv = o.v; }
    } else if (o.phase === 'road' && o.edge === k.out){
      const g = L - car.c + o.s - CFG.carLen;
      if (g < gap){ gap = g; lv = o.v; }
    }
  }
  const v0 = k.turn ? CFG.vTurn : CFG.v0;
  const a = idm(car.v, v0, gap, car.v - lv);
  car.brk = a < -4.5;
  car.v = clamp(car.v + a * dt, 0, 95);
  car.c += car.v * dt;

  if (car.c >= L){
    k.node.active.delete(k.id);
    car.phase = 'road';
    car.edge = k.out;
    car.s = Math.max(0, car.c - L);
    car.commit = false; car.wait = 0; car.admitted = false;
    car.trip--;
    if (car.trip <= 0 && car.dying === 0) car.dying = 0.7;
    chooseNext(car);
  }
}

function step(dt){
  tSim += dt;

  /* signal states */
  for (const n of nodes){
    n.stH = lightState(n, 'H', tSim);
    n.stV = lightState(n, 'V', tSim);
  }

  /* gather cars held at their stop line */
  for (const n of nodes) n.waiting.length = 0;
  for (const c of cars){
    c.admitted = false;
    if (c.phase === 'road' && c.s >= c.edge.len - 0.01) c.edge.to.waiting.push(c);
  }

  /* intersection admission: fair (longest wait first), conflict-free */
  for (const n of nodes){
    if (!n.waiting.length) continue;
    n.waiting.sort((a, b) => b.wait - a.wait);
    for (const car of n.waiting){
      const e = car.edge;
      const st = e.axis === 'H' ? n.stH : n.stV;
      if (st === 'R' && !car.commit) continue;
      const k = car.next;
      if (!k) continue;
      let free = true;
      for (const [id, other] of n.active){
        if (other.in === k.in) continue;
        if (k.conf.has(id)){ free = false; break; }
      }
      if (!free) continue;
      let blocked = false;                            // room on the exit street?
      for (const o of cars)
        if (o.phase === 'road' && o.edge === k.out && o.s < CFG.carLen + 5){ blocked = true; break; }
      if (blocked) continue;
      car.admitted = true;
      n.active.set(k.id, k);
      car.wait = 0;
    }
  }

  for (const car of cars){
    if (car.phase === 'road') stepRoad(car, dt);
    else stepCross(car, dt);
  }

  /* remove cars that finished their trip (fade-out complete) */
  for (let i = cars.length - 1; i >= 0; i--){
    const c = cars[i];
    if (c.dying > 0){
      c.dying -= dt;
      if (c.dying <= 0){
        if (c.phase === 'cross' && c.next) c.next.node.active.delete(c.next.id);
        cars.splice(i, 1);
      }
    }
  }

  spawnAcc += dt * rate / 60;
  while (spawnAcc >= 1){ spawnAcc -= 1; spawn(); }
}

/* ============================== poses ============================== */
function bezierT(k, c){
  const cum = k.cum, N = cum.length - 1;
  const cc = clamp(c, 0, k.len);
  let i = 1;
  while (i < N && cum[i] < cc) i++;
  const seg = cum[i] - cum[i-1];
  const f = seg > 0 ? (cc - cum[i-1]) / seg : 0;
  return (i - 1 + f) / N;
}
function carPose(car){
  if (car.phase === 'road'){
    const e = car.edge;
    return { x: e.p0.x + e.ux * car.s, y: e.p0.y + e.uy * car.s, h: Math.atan2(e.uy, e.ux) };
  }
  const k = car.next;
  const t = bezierT(k, car.c), it = 1 - t;
  const x = it*it*k.in.p1.x + 2*it*t*k.cp.x + t*t*k.out.p0.x;
  const y = it*it*k.in.p1.y + 2*it*t*k.cp.y + t*t*k.out.p0.y;
  const tx = 2*it*(k.cp.x - k.in.p1.x) + 2*t*(k.out.p0.x - k.cp.x);
  const ty = 2*it*(k.cp.y - k.in.p1.y) + 2*t*(k.out.p0.y - k.cp.y);
  return { x, y, h: Math.atan2(ty, tx) };
}

/* ============================== static layer ============================== */
function tree(g, x, y, r, th){
  g.fillStyle = 'rgba(0,0,0,.16)';
  g.beginPath(); g.ellipse(x + 2, y + 2.5, r * 0.95, r * 0.7, 0, 0, TAU); g.fill();
  g.fillStyle = th.tree;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.fillStyle = th.treeHi;
  g.beginPath(); g.arc(x - r * 0.3, y - r * 0.3, r * 0.55, 0, TAU); g.fill();
}

function splitBld(g, x, y, w, h, d, th){
  if (d < 2 && (w > 110 || h > 110) && rng() < 0.9){
    if (w > h){
      const cut = w * rr(0.38, 0.62);
      splitBld(g, x, y, cut - 2.5, h, d + 1, th);
      splitBld(g, x + cut + 2.5, y, w - cut - 2.5, h, d + 1, th);
    } else {
      const cut = h * rr(0.38, 0.62);
      splitBld(g, x, y, w, cut - 2.5, d + 1, th);
      splitBld(g, x, y + cut + 2.5, w, h - cut - 2.5, d + 1, th);
    }
    return;
  }
  const bw = w - 6, bh = h - 6, bx = x + 3, by = y + 3;
  if (bw < 16 || bh < 16) return;
  g.fillStyle = th.bld[ri(th.bld.length)];
  g.fillRect(bx, by, bw, bh);
  g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(bx, by, bw, 3);
  g.fillStyle = 'rgba(0,0,0,.10)';       g.fillRect(bx, by + bh - 3, bw, 3);

  for (let wx = bx + 4; wx < bx + bw - 5; wx += 9)
    for (let wy = by + 5; wy < by + bh - 6; wy += 9){
      if (theme === 'night'){
        g.fillStyle = rng() < 0.4
          ? `rgba(255,214,130,${rr(0.5, 0.95)})`
          : 'rgba(255,255,255,.045)';
      } else {
        g.fillStyle = 'rgba(30,34,40,.10)';
      }
      g.fillRect(wx, wy, 3.4, 4);
    }
  if (rng() < 0.5){
    g.fillStyle = 'rgba(0,0,0,.12)';
    g.fillRect(bx + rr(4, Math.max(5, bw - 10)), by + rr(4, Math.max(5, bh - 10)), 6, 5);
  }
}

function drawStatic(){
  const th = THEMES[theme], RW = CFG.roadHalf, SW = CFG.sidewalk;
  stat.width = cv.width; stat.height = cv.height;
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  sctx.fillStyle = th.bg;
  sctx.fillRect(0, 0, W, H);

  /* scattered trees on the outskirts */
  const nt = Math.round(W * H / 26000);
  for (let i = 0; i < nt; i++){
    const x = rng() * W, y = rng() * H;
    let ok = true;
    for (const xx of xs) if (Math.abs(x - xx) < RW + SW + 8){ ok = false; break; }
    if (ok) for (const yy of ys) if (Math.abs(y - yy) < RW + SW + 8){ ok = false; break; }
    if (ok) tree(sctx, x, y, rr(5, 9), th);
  }

  /* city blocks between the roads */
  const bx = [[0, xs[0] - RW - SW]];
  for (let i = 0; i < xs.length - 1; i++) bx.push([xs[i] + RW + SW, xs[i+1] - RW - SW]);
  bx.push([xs[xs.length-1] + RW + SW, W]);
  const by = [[0, ys[0] - RW - SW]];
  for (let i = 0; i < ys.length - 1; i++) by.push([ys[i] + RW + SW, ys[i+1] - RW - SW]);
  by.push([ys[ys.length-1] + RW + SW, H]);

  for (const [x0, x1] of bx)
    for (const [y0, y1] of by){
      const bw = x1 - x0, bh = y1 - y0;
      if (bw < 26 || bh < 26) continue;
      sctx.fillStyle = th.side;                     // sidewalk apron
      sctx.fillRect(x0, y0, bw, bh);
      const ix = x0 + SW, iy = y0 + SW, iw = bw - 2*SW, ih = bh - 2*SW;
      if (iw < 18 || ih < 18) continue;
      if (rng() < 0.15 && iw > 70 && ih > 70){      // park block
        sctx.fillStyle = th.park;
        sctx.fillRect(ix, iy, iw, ih);
        if (rng() < 0.35){
          sctx.fillStyle = th.water;
          sctx.beginPath();
          sctx.ellipse(ix + iw*rr(.3,.7), iy + ih*rr(.3,.7),
                       Math.min(iw,ih)*rr(.14,.22), Math.min(iw,ih)*rr(.1,.18), rr(0,3), 0, TAU);
          sctx.fill();
        }
        const n2 = Math.round(iw * ih / 3800);
        for (let k = 0; k < n2; k++)
          tree(sctx, ix + 8 + rng()*(iw-16), iy + 8 + rng()*(ih-16), rr(5, 9), th);
      } else {
        sctx.fillStyle = 'rgba(0,0,0,.07)';
        sctx.fillRect(ix, iy, iw, ih);
        splitBld(sctx, ix, iy, iw, ih, 0, th);
      }
    }

  /* asphalt */
  sctx.fillStyle = th.asphalt;
  for (const yy of ys) sctx.fillRect(0, yy - RW, W, RW * 2);
  for (const xx of xs) sctx.fillRect(xx - RW, 0, RW * 2, H);

  /* center double line + lane edges */
  sctx.strokeStyle = th.center; sctx.lineWidth = 1.3;
  for (const yy of ys){ line(sctx, 0, yy - 1.7, W, yy - 1.7); line(sctx, 0, yy + 1.7, W, yy + 1.7); }
  for (const xx of xs){ line(sctx, xx - 1.7, 0, xx - 1.7, H); line(sctx, xx + 1.7, 0, xx + 1.7, H); }
  sctx.strokeStyle = th.mark; sctx.lineWidth = 1; sctx.globalAlpha = 0.33;
  for (const yy of ys){ line(sctx, 0, yy - RW + 2, W, yy - RW + 2); line(sctx, 0, yy + RW - 2, W, yy + RW - 2); }
  for (const xx of xs){ line(sctx, xx - RW + 2, 0, xx - RW + 2, H); line(sctx, xx + RW - 2, 0, xx + RW - 2, H); }
  sctx.globalAlpha = 1;

  /* clean intersection interiors */
  for (const n of nodes){
    sctx.fillStyle = th.asphalt;
    sctx.fillRect(n.x - RW - 1, n.y - RW - 1, RW * 2 + 2, RW * 2 + 2);
  }

  /* crosswalks + stop lines per approach */
  for (const n of nodes)
    for (const e of n.in){
      sctx.save();
      sctx.translate(n.x, n.y);
      sctx.rotate(Math.atan2(e.uy, e.ux));
      sctx.fillStyle = theme === 'day' ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.38)';
      for (let wy = -RW + 4; wy < RW - 6; wy += 7) sctx.fillRect(-RW - 10, wy, 7, 4);
      sctx.fillRect(-CFG.stopPad - 1.5, 3, 3, RW - 5);
      sctx.restore();
    }
}

/* ============================== dynamic layer ============================== */
function render(){
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(stat, 0, 0, W, H);

  /* signals */
  for (const n of nodes)
    for (const e of n.in){
      const st = e.axis === 'H' ? n.stH : n.stV;
      const col = st === 'G' ? '#3ddc6a' : st === 'Y' ? '#ffc93c' : '#ff5252';
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(Math.atan2(e.uy, e.ux));
      const hx = -CFG.stopPad - 8, hy = CFG.roadHalf + 7;
      ctx.beginPath(); ctx.arc(hx, hy, 5.4, 0, TAU); ctx.fillStyle = '#14171a'; ctx.fill();
      ctx.shadowColor = col; ctx.shadowBlur = 7;
      ctx.beginPath(); ctx.arc(hx, hy, 3, 0, TAU); ctx.fillStyle = col; ctx.fill();
      ctx.restore();
    }

  /* cars */
  const L = CFG.carLen, Wd = CFG.carWid;
  for (const c of cars){
    const p = carPose(c);
    ctx.save();
    ctx.globalAlpha = c.dying > 0 ? clamp(c.dying / 0.7, 0, 1) : 1;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.h);

    ctx.fillStyle = 'rgba(0,0,0,.22)';                       // shadow
    rrect(ctx, -L/2 + 1.2, -Wd/2 + 1.8, L, Wd, 2.6); ctx.fill();
    ctx.fillStyle = c.color;                                 // body
    rrect(ctx, -L/2, -Wd/2, L, Wd, 2.4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';                 // roof
    rrect(ctx, -4.2, -Wd/2 + 1.1, 5.6, Wd - 2.2, 1.4); ctx.fill();
    ctx.fillStyle = 'rgba(18,24,30,.85)';                    // windshield
    rrect(ctx, 1.8, -Wd/2 + 1.1, 3.4, Wd - 2.2, 1.2); ctx.fill();
    ctx.fillStyle = 'rgba(18,24,30,.6)';                     // rear glass
    rrect(ctx, -L/2 + 2.2, -Wd/2 + 1.3, 2.6, Wd - 2.6, 1); ctx.fill();

    if (c.brk){
      ctx.fillStyle = '#ff4438';
      ctx.shadowColor = '#ff3b30'; ctx.shadowBlur = 5;
      ctx.fillRect(-L/2 - 0.6, -Wd/2 + 0.7, 1.8, 2);
      ctx.fillRect(-L/2 - 0.6,  Wd/2 - 2.7, 1.8, 2);
      ctx.shadowBlur = 0;
    }
    if (theme === 'night'){
      ctx.fillStyle = 'rgba(255,240,190,.10)';
      ctx.beginPath();
      ctx.moveTo(L/2, -1.5); ctx.lineTo(L/2 + 26, -5);
      ctx.lineTo(L/2 + 26, 5); ctx.lineTo(L/2, 1.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff6d8';
      ctx.fillRect(L/2 - 1, -Wd/2 + 0.8, 1.6, 1.8);
      ctx.fillRect(L/2 - 1,  Wd/2 - 2.6, 1.6, 1.8);
    }
    ctx.restore();
  }
}

/* ============================== stats ============================== */
const el = id => document.getElementById(id);
const sN = el('sN'), sV = el('sV'), sF = el('sF'), sC = el('sC');

function updStats(rdt){
  statClock -= rdt;
  if (statClock > 0) return;
  statClock = 0.5;
  while (flowT.length && flowT[0] < tSim - 60) flowT.shift();
  let sv = 0, sc = 0;
  for (const c of cars){ sv += c.v; if (c.v < CFG.v0 * 0.3) sc++; }
  const n = cars.length || 1;
  sN.textContent = cars.length;
  sV.textContent = (sv / n / PXM * 3.6).toFixed(0) + ' km/h';
  sF.textContent = flowT.length + ' /min';
  sC.textContent = Math.round(sc / n * 100) + '%';
}

/* ============================== main loop ============================== */
function frame(now){
  const rdt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  if (!paused){
    acc += rdt * speedMul;
    let it = 0;
    while (acc >= DT && it < 8){ step(DT); acc -= DT; it++; }
    if (it === 8) acc = 0;
  }
  render();
  updStats(rdt);
  requestAnimationFrame(frame);
}

/* ============================== lifecycle ============================== */
function resize(){
  const w = Math.round(cv.getBoundingClientRect().width) || 640;
  const h = clamp(Math.round(w * 0.62), 420, 760);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.height = h + 'px';
  cv.width = Math.round(w * DPR);
  cv.height = Math.round(h * DPR);
  W = w; H = h;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  build();
  drawStatic();
}

function resetAll(){
  cars = []; tSim = 0; acc = 0; trips = 0; flowT = []; spawnAcc = 0;
  build(); prefill(); drawStatic();
}

function toggleNight(){
  theme = theme === 'day' ? 'night' : 'day';
  el('bNight').textContent = theme === 'day' ? '🌙 Night' : '☀️ Day';
  drawStatic();
}

el('bPlay').onclick = () => {
  paused = !paused;
  el('bPlay').textContent = paused ? '▶ Play' : '⏸ Pause';
};
el('bNight').onclick = toggleNight;
el('bReset').onclick = resetAll;
el('rate').oninput  = e => { rate = +e.target.value; el('vRate').textContent = rate; };
el('speed').oninput = e => { speedMul = +e.target.value; el('vSpeed').textContent = speedMul; };

addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); el('bPlay').click(); }
  else if (e.key === 'n' || e.key === 'N') toggleNight();
  else if (e.key === 'r' || e.key === 'R') resetAll();
});

let rsT = null;
addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => { resize(); prefill(); }, 180);
});
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });

resize();
prefill();
lastT = performance.now();
requestAnimationFrame(frame);

})();
</script>
</body>
