<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Siege — Tower Defense</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🏰</text></svg>">
<style>
  :root{
    --bg:#0b1017; --panel:#131b27; --panel2:#0f1620; --line:#22304a;
    --ink:#e8eef7; --dim:#8fa1bb; --accent:#3ddc97; --gold:#ffd166;
    --red:#ff5d73; --blue:#6ea8fe;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #121a26 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    display:flex; justify-content:center; padding:14px;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #wrap{width:100%; max-width:1250px; display:flex; flex-direction:column; gap:10px;}

  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:10px 16px;
  }
  h1{font-size:19px; font-weight:800; letter-spacing:1.5px;}
  h1 em{color:var(--accent); font-style:normal;}
  h1 small{display:block; font-size:10px; font-weight:600; letter-spacing:2px; color:var(--dim);}
  .spacer{flex:1;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-weight:700; font-size:14px; min-width:86px; justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .chip .ico{font-size:12px; opacity:.85;}
  .chip.money{color:var(--gold);} .chip.lives{color:var(--red);} .chip.wave{color:var(--blue);}
  .chip.lives.low{animation:pulse .8s infinite;}
  @keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,93,115,.18);}}
  .controls{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    font-family:inherit; font-size:14px; font-weight:700; color:var(--ink);
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:8px 14px; cursor:pointer; transition:transform .05s, background .15s, border-color .15s;
  }
  button:hover:not(:disabled){border-color:#3a5378; background:#16202e;}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button.primary{background:#123529; border-color:#1f6b4c; color:#c8ffe8;}
  button.primary:hover:not(:disabled){background:#164430;}
  button.primary:disabled{background:var(--panel2);}

  main{display:flex; gap:10px; align-items:stretch;}
  #stage{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;}
  #cvbox{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:8px;
  }
  canvas{display:block; width:100%; height:auto; border-radius:8px; cursor:crosshair;}
  #hint{
    text-align:center; font-size:12.5px; color:var(--dim); min-height:18px;
  }
  #hint b{color:var(--ink);}

  aside{
    width:242px; flex:none; display:flex; flex-direction:column; gap:10px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
  }
  .panel h2{
    font-size:11px; font-weight:800; letter-spacing:2px; color:var(--dim);
    text-transform:uppercase; margin-bottom:9px;
  }
  #shopCards{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .card{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:8px 9px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
    position:relative;
  }
  .card:hover{border-color:#3a5378;}
  .card.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(61,220,151,.25);}
  .card.off{opacity:.42; cursor:not-allowed;}
  .card .tname{font-size:13px; font-weight:800;}
  .card .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px;}
  .card .cost{color:var(--gold); font-weight:800; font-size:13px; margin-top:3px;}
  .card .stats{color:var(--dim); font-size:10.5px; margin-top:3px; line-height:1.35;}
  .card kbd{
    position:absolute; top:6px; right:7px; font-family:inherit; font-size:10px;
    color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 4px;
  }
  #nextWave{font-size:12px; color:var(--dim); line-height:1.5;}
  #nextWave b{color:var(--ink);}

  /* selection panel */
  #selBox .empty{color:var(--dim); font-size:12.5px; line-height:1.5;}
  #selBox h3{font-size:15px; margin-bottom:6px;}
  #selBox h3 .lvl{color:var(--accent); font-size:12px; margin-left:6px;}
  .srow{display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0; font-variant-numeric:tabular-numbers;}
  .srow span:first-child{color:var(--dim);}
  .next{font-size:11px; color:var(--dim); margin:6px 0; border-top:1px dashed var(--line); padding-top:6px;}
  .btnrow{display:flex; gap:8px; margin-top:8px;}
  .btnrow button{flex:1; padding:7px 6px; font-size:12.5px;}
  #sellBtn{border-color:#5c2733; color:#ffb3c0;}
  #sellBtn:hover:not(:disabled){background:#2a1420; border-color:#8a3a4c;}
  .modesel{
    width:100%; margin-top:9px; font-family:inherit; font-size:12.5px; font-weight:700;
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:6px;
  }
  .autolabel{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--dim); cursor:pointer;}
  .autolabel input{accent-color:var(--accent); width:15px; height:15px; cursor:pointer;}

  /* overlay */
  #ov{
    position:absolute; inset:8px; border-radius:8px; display:none;
    align-items:center; justify-content:center; z-index:5;
    background:rgba(7,10,15,.78); backdrop-filter:blur(3px);
  }
  #ov.show{display:flex;}
  #ovCard{
    text-align:center; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:30px 40px; max-width:86%;
    box-shadow:0 18px 60px rgba(0,0,0,.55);
  }
  #ovTitle{font-size:26px; font-weight:900; letter-spacing:1px; margin-bottom:8px;}
  #ovSub{color:var(--dim); font-size:14px; line-height:1.6; margin-bottom:18px;}
  #ovActions{display:flex; gap:10px; justify-content:center;}

  @media (max-width:1020px){
    main{flex-direction:column;}
    aside{width:100%; flex-direction:row; flex-wrap:wrap;}
    aside .panel{flex:1; min-width:220px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>CIRCUIT<em>SIEGE</em><small>SINGLE-FILE TOWER DEFENSE</small></h1>
    <div class="spacer"></div>
    <div class="chips">
      <span class="chip money" title="Credits"><span class="ico">$</span><span id="hudMoney">0</span></span>
      <span class="chip lives" title="Base integrity"><span class="ico">♥</span><span id="hudLives">0</span></span>
      <span class="chip wave" title="Wave"><span class="ico">⚔</span><span id="hudWave">1/20</span></span>
      <span class="chip" title="Enemies remaining"><span class="ico">☣</span><span id="hudEn">—</span></span>
    </div>
    <div class="controls">
      <button id="btnStart" class="primary">▶ Start Wave 1</button>
      <button id="btnSpeed" title="Game speed (F)">1×</button>
      <button id="btnPause" title="Pause (P)">⏸</button>
      <button id="btnMute" title="Sound" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <div id="cvbox">
        <canvas id="cv" width="960" height="624"></canvas>
        <div id="ov">
          <div id="ovCard">
            <div id="ovTitle"></div>
            <div id="ovSub"></div>
            <div id="ovActions"></div>
          </div>
        </div>
      </div>
      <div id="hint"></div>
    </div>

    <aside>
      <section class="panel">
        <h2>Build</h2>
        <div id="shopCards"></div>
      </section>
      <section class="panel">
        <h2>Selection</h2>
        <div id="selBox"><div class="empty">Nothing selected.<br>Place or click a tower to inspect, upgrade, or sell it.</div></div>
      </section>
      <section class="panel">
        <h2>Next wave</h2>
        <div id="nextWave">—</div>
      </section>
      <section class="panel">
        <label class="autolabel"><input type="checkbox" id="chkAuto"> Auto-start next wave</label>
      </section>
    </aside>
  </main>
</div>

<script>
'use strict';

/* ---------------- tiny utils ---------------- */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function h32(n) { n |= 0; n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return (n ^ (n >>> 16)) >>> 0; }
function angTo(a, b, maxStep) {
  let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  if (Math.abs(d) <= maxStep) return b;
  return a + Math.sign(d) * maxStep;
}

/* ---------------- config ---------------- */
const TILE = 48, COLS = 20, ROWS = 13;
const W = COLS * TILE, H = ROWS * TILE;
const FINAL_WAVE = 20;
const START_MONEY = 220, START_LIVES = 20;
const SPEEDS = [1, 2, 3];
const SLOW_MULT = 0.55, SLOW_DUR = 1.8;
const SELL_RATIO = 0.7;

const TOWERS = {
  gun:    { name: 'Gunner', cost: 50,  dmg: 9,  rate: 2.4,  range: 115, color: '#4dabf7', kind: 'bullet', pspd: 540, desc: 'Fast shots' },
  frost:  { name: 'Frost',  cost: 60,  dmg: 5,  rate: 1.15, range: 105, color: '#66d9e8', kind: 'frost',  pspd: 430, desc: 'Slows 45%' },
  cannon: { name: 'Cannon', cost: 95,  dmg: 30, rate: 0.62, range: 135, color: '#ffa94d', kind: 'shell',  pspd: 320, splash: 54, desc: 'Splash dmg' },
  sniper: { name: 'Sniper', cost: 125, dmg: 70, rate: 0.5,  range: 235, color: '#e599f7', kind: 'beam',   desc: 'Long range' },
};
const TOWER_KEYS = Object.keys(TOWERS);
const ENEMIES = {
  grunt:  { name: 'Grunt',  hp: 44,   speed: 70,  r: 11, color: '#ff5d73', bounty: 8,   dmg: 1 },
  runner: { name: 'Runner', hp: 26,   speed: 128, r: 8,  color: '#51cf66', bounty: 7,   dmg: 1 },
  tank:   { name: 'Tank',   hp: 210,  speed: 42,  r: 14, color: '#9c7a5b', bounty: 24,  dmg: 2 },
  boss:   { name: 'Boss',   hp: 1600, speed: 33,  r: 20, color: '#b197fc', bounty: 150, dmg: 5 },
};
const MODES = ['first', 'last', 'strong', 'close'];
const MODE_LABEL = { first: 'First', last: 'Last', strong: 'Strongest', close: 'Closest' };

/* ---------------- path geometry ---------------- */
const RAW_WP = [[-1, 2], [3, 2], [3, 10], [8, 10], [8, 2], [13, 2], [13, 10], [17, 10], [17, 6], [21, 6]];
const WP = RAW_WP.map(([c, r]) => ({ x: (c + 0.5) * TILE, y: (r + 0.5) * TILE }));
const pathTiles = new Set();
for (let i = 0; i < RAW_WP.length - 1; i++) {
  let [c, r] = RAW_WP[i];
  const [c2, r2] = RAW_WP[i + 1];
  const sc = Math.sign(c2 - c), sr = Math.sign(r2 - r);
  pathTiles.add(c + ',' + r);
  while (c !== c2 || r !== r2) { c += sc; r += sr; pathTiles.add(c + ',' + r); }
}
const segs = []; let TOTAL = 0;
for (let i = 0; i < WP.length - 1; i++) {
  const a = WP[i], b = WP[i + 1];
  const L = Math.hypot(b.x - a.x, b.y - a.y);
  segs.push({ a, b, L, start: TOTAL });
  TOTAL += L;
}
function posAt(d) {
  d = clamp(d, 0, TOTAL - 0.001);
  for (let i = segs.length - 1; i >= 0; i--) {
    const s = segs[i];
    if (d >= s.start) {
      const t = (d - s.start) / s.L;
      return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t };
    }
  }
  return { x: WP[0].x, y: WP[0].y };
}
const inGrid = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
const keyOf = (c, r) => c + ',' + r;

/* ---------------- audio ---------------- */
let actx = null, master = null, muted = false;
const lastPlay = {};
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
  } catch (e) { actx = null; }
}
document.addEventListener('pointerdown', initAudio);
function tone(f, o = {}) {
  if (!actx || muted) return;
  const { dur = .1, type = 'square', vol = .05, to = f } = o;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(1, f), t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1, to), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g).connect(master);
  osc.start(t0); osc.stop(t0 + dur + .03);
}
function noiseBurst(o = {}) {
  if (!actx || muted) return;
  const { dur = .25, vol = .08, f0 = 1200, f1 = 150 } = o;
  const t0 = actx.currentTime, n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const flt = actx.createBiquadFilter(); flt.type = 'lowpass';
  flt.frequency.setValueAtTime(f0, t0);
  flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  src.connect(flt).connect(g).connect(master);
  src.start(t0);
}
function arp(freqs, opt = {}) {
  freqs.forEach((f, i) => setTimeout(() => tone(f, opt), i * 75));
}
function throttled(name, ms, fn) {
  const now = performance.now();
  if (lastPlay[name] && now - lastPlay[name] < ms) return;
  lastPlay[name] = now; fn();
}
const SFX = {
  shootGun: () => throttled('sg', 45, () => tone(rand(620, 760), { dur: .045, type: 'square', vol: .016, to: 230 })),
  shootFrost: () => throttled('sf', 60, () => tone(920, { dur: .08, type: 'sine', vol: .028, to: 1500 })),
  shootCannon: () => tone(110, { dur: .13, type: 'triangle', vol: .07, to: 50 }),
  shootSniper: () => { tone(1500, { dur: .09, type: 'sawtooth', vol: .035, to: 180 }); noiseBurst({ dur: .05, vol: .02, f0: 4000, f1: 800 }); },
  boom: () => noiseBurst({ dur: .3, vol: .09, f0: 900, f1: 110 }),
  pop: () => throttled('pop', 55, () => tone(rand(860, 1060), { dur: .06, type: 'square', vol: .03, to: 1400 })),
  place: () => tone(330, { dur: .07, type: 'square', vol: .05, to: 540 }),
  err: () => tone(150, { dur: .09, type: 'sawtooth', vol: .04 }),
  coin: () => arp([784, 1175], { dur: .09, type: 'triangle', vol: .045 }),
  leak: () => { tone(220, { dur: .35, type: 'sawtooth', vol: .07, to: 65 }); noiseBurst({ dur: .18, vol: .04 }); },
  waveStart: () => arp([392, 523], { dur: .12, type: 'triangle', vol: .05 }),
  upgrade: () => arp([523, 659, 784], { dur: .08, type: 'square', vol: .035 }),
  sell: () => tone(700, { dur: .12, type: 'triangle', vol: .05, to: 280 }),
  gameOver: () => arp([300, 240, 180, 120], { dur: .22, type: 'sawtooth', vol: .05 }),
  victory: () => arp([523, 659, 784, 1046], { dur: .16, type: 'triangle', vol: .05 }),
};

/* ---------------- state ---------------- */
let money, lives, wave, waveActive, waveT, spawnQ, autoTimer, kills;
let over, victoryShown, endless, paused, speedIdx;
let towers, towerAt, enemies, projs, beams, parts, floats;
let selType, selTower, hoverTower, mouse, shake, coreFlash;
let demo = /[?&]demo/.test(location.search);
let epoch = 0;

function initState() {
  epoch++;
  money = START_MONEY; lives = START_LIVES;
  wave = 0; waveActive = false; waveT = 0; spawnQ = []; autoTimer = 0; kills = 0;
  over = false; victoryShown = false; endless = false; paused = false; speedIdx = 0;
  towers = []; towerAt = new Map();
  enemies = []; projs = []; beams = []; parts = []; floats = [];
  selType = null; selTower = null; hoverTower = null;
  mouse = { x: -999, y: -999, c: -1, r: -1, inside: false };
  shake = 0; coreFlash = 0;
  muted = false;
  if (master) master.gain.value = 0.55;
  $('chkAuto').checked = false;
  $('btnPause').textContent = '⏸';
  $('btnSpeed').textContent = '1×';
  $('btnMute').textContent = '🔊';
  hideOverlay();
}

/* ---------------- entities ---------------- */
function hpScale(w) { return Math.pow(1.135, w - 1); }
function bountyScale(w) { return 1 + 0.05 * (w - 1); }

function spawnEnemy(type, w) {
  const def = ENEMIES[type];
  const hp = Math.round(def.hp * hpScale(w));
  enemies.push({
    type, def, hp, maxHp: hp,
    dist: 0, speed: def.speed, r: def.r,
    bounty: Math.round(def.bounty * bountyScale(w)),
    dmgBase: def.dmg,
    slowT: 0, hitFlash: 0, dead: false,
    x: WP[0].x, y: WP[0].y, ang: 0,
  });
}

function towerStats(t) {
  const m = t.level - 1, d = t.def;
  return {
    dmg: d.dmg * Math.pow(1.6, m),
    rate: d.rate * Math.pow(1.22, m),
    range: d.range * Math.pow(1.1, m),
  };
}
function upCost(t) { return Math.round(t.def.cost * 0.8 * t.level); }
function sellVal(t) { return Math.floor(t.invested * SELL_RATIO); }

function makeTower(type, c, r) {
  const def = TOWERS[type];
  return {
    type, def, c, r,
    x: (c + 0.5) * TILE, y: (r + 0.5) * TILE,
    level: 1, invested: def.cost,
    cool: rand(0, .3), angle: -Math.PI / 2, tarAng: -Math.PI / 2,
    mode: 'first', rec: 0, hasTarget: false,
  };
}

/* ---------------- combat ---------------- */
function floatText(x, y, text, color, big) {
  floats.push({ x, y, text, color, big: !!big, life: big ? 1.5 : 0.9, max: big ? 1.5 : 0.9 });
  if (floats.length > 50) floats.shift();
}
function spark(x, y, color, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(30, spread || 160);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.25, .6), max: .6, size: rand(1.5, 3.5), color });
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}

function damage(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  e.hitFlash = 0.08;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true; kills++;
  money += e.bounty;
  floatText(e.x, e.y - 14, '+' + e.bounty, '#ffd166');
  spark(e.x, e.y, e.def.color, e.type === 'boss' ? 26 : 8, e.type === 'boss' ? 260 : 150);
  if (e.type === 'boss') { SFX.boom(); shake += 6; } else SFX.pop();
}
function explode(x, y, radius, dmg) {
  SFX.boom();
  spark(x, y, '#ffa94d', 14, 220);
  parts.push({ ring: true, x, y, life: .3, max: .3, size: radius, color: '#ffc078' });
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.sqrt(dist2(x, y, e.x, e.y));
    if (d <= radius + e.r) {
      const falloff = 1 - 0.5 * clamp(d / radius, 0, 1);
      damage(e, dmg * falloff);
    }
  }
}
function leak(e) {
  e.dead = true;
  lives -= e.dmgBase;
  coreFlash = 1; shake += 5;
  const p = posAt(TOTAL - 40);
  floatText(p.x, p.y - 20, '-' + e.dmgBase + ' ♥', '#ff5d73');
  SFX.leak();
  if (lives <= 0 && !over) { lives = 0; gameOver(); }
}

/* ---------------- waves ---------------- */
function buildWaveQueue(w) {
  const q = []; let t = 0.6;
  const add = (type, n, gap, pause = 1.0) => {
    for (let i = 0; i < n; i++) { q.push({ type, t }); t += gap; }
    t += pause;
  };
  add('grunt', 6 + Math.floor(w * 1.6), Math.max(0.45, 1.05 - w * 0.028));
  if (w >= 3) add('runner', Math.floor((w - 1) * 1.1), Math.max(0.3, 0.62 - w * 0.01));
  if (w >= 5) add('tank', Math.max(1, Math.floor((w - 3) / 2)), 1.7);
  if (w % 10 === 0) { add('grunt', 4, 0.5); add('boss', Math.floor(w / 10), 5, 1.5); }
  q.sort((a, b) => a.t - b.t);
  return q;
}
function waveSummary(w) {
  const q = buildWaveQueue(w);
  const counts = {};
  for (const s of q) counts[s.type] = (counts[s.type] || 0) + 1;
  return Object.entries(counts).map(([t, n]) =>
    `<b>${n}× ${ENEMIES[t].name}</b>`).join(' · ');
}

function startWave() {
  if (waveActive || over || victoryShown) return;
  wave++;
  spawnQ = buildWaveQueue(wave);
  waveT = 0; waveActive = true; autoTimer = 0;
  SFX.waveStart();
  floatText(W / 2, H / 2 - 40, 'WAVE ' + wave, '#6ea8fe', true);
  syncStartBtn(); syncNextWave();
}
function endWave() {
  waveActive = false; spawnQ = [];
  const bonus = 30 + wave * 6;
  money += bonus;
  floatText(W / 2, H / 2 - 60, 'Wave ' + wave + ' cleared   +$' + bonus, '#3ddc97', true);
  SFX.coin();
  if (wave >= FINAL_WAVE && !endless) {
    if (demo) { endless = true; }
    else { victoryShown = true; showVictory(); SFX.victory(); }
  } else if ($('chkAuto').checked) {
    autoTimer = 2.5;
  }
  syncStartBtn(); syncNextWave();
}
function gameOver() {
  over = true;
  SFX.gameOver();
  showOverlay('💥 BASE DESTROYED',
    'You reached wave <b>' + wave + '</b> and scored <b>' + kills + '</b> kills.',
    [{ label: '↻ Try Again', cls: 'primary', fn: () => { initState(); syncAll(); } }]);
}

/* ---------------- build / upgrade / sell ---------------- */
function tryPlace(type, c, r) {
  const k = keyOf(c, r);
  if (!inGrid(c, r) || pathTiles.has(k)) {
    if (inGrid(c, r)) { floatText(mouse.x, mouse.y, 'blocked', '#ff5d73'); SFX.err(); }
    return false;
  }
  if (towerAt.has(k)) return false;
  const def = TOWERS[type];
  if (money < def.cost) {
    floatText(mouse.x, mouse.y, 'need $' + def.cost, '#ff5d73');
    SFX.err(); return false;
  }
  money -= def.cost;
  const t = makeTower(type, c, r);
  towers.push(t); towerAt.set(k, t);
  SFX.place();
  spark(t.x, t.y, def.color, 8, 90);
  syncShop();
  return true;
}
function doUpgrade() {
  const t = selTower; if (!t || t.level >= 3) return;
  const cost = upCost(t);
  if (money < cost) { SFX.err(); return; }
  money -= cost; t.invested += cost; t.level++;
  SFX.upgrade();
  spark(t.x, t.y, '#3ddc97', 10, 110);
  renderSelPanel();
}
function doSell() {
  const t = selTower; if (!t) return;
  money += sellVal(t);
  floatText(t.x, t.y, '+$' + sellVal(t), '#ffd166');
  towerAt.delete(keyOf(t.c, t.r));
  towers.splice(towers.indexOf(t), 1);
  selTower = null;
  SFX.sell();
  renderSelPanel(); syncShop();
}

/* ---------------- update ---------------- */
function update(dt) {
  // wave spawning
  if (waveActive) {
    waveT += dt;
    while (spawnQ.length && spawnQ[0].t <= waveT) {
      spawnEnemy(spawnQ.shift().type, wave);
    }
  }

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.slowT > 0) e.slowT -= dt;
    const spd = e.speed * (e.slowT > 0 ? SLOW_MULT : 1);
    e.dist += spd * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.dist >= TOTAL) { leak(e); continue; }
    const p = posAt(e.dist);
    e.x = p.x; e.y = p.y;
    const pa = posAt(Math.max(0, e.dist - 6)), pb = posAt(Math.min(TOTAL, e.dist + 6));
    e.ang = Math.atan2(pb.y - pa.y, pb.x - pa.x);
  }
  enemies = enemies.filter(e => !e.dead);

  // wave end check
  if (waveActive && !spawnQ.length && !enemies.length) endWave();

  // auto-start
  if (autoTimer > 0 && !waveActive && !over && !victoryShown) {
    autoTimer -= dt;
    if (autoTimer <= 0) startWave();
  }

  // towers
  for (const t of towers) {
    t.cool -= dt;
    if (t.rec > 0) t.rec = Math.max(0, t.rec - dt * 6);
    const st = towerStats(t);
    const r2 = st.range * st.range;
    // acquire target
    let best = null, bestScore = 0;
    for (const e of enemies) {
      if (e.dead) continue;
      const d2 = dist2(t.x, t.y, e.x, e.y);
      if (d2 > r2) continue;
      let score;
      switch (t.mode) {
        case 'first': score = e.dist; break;
        case 'last': score = -e.dist; break;
        case 'strong': score = e.hp; break;
        case 'close': score = -d2; break;
        default: score = e.dist;
      }
      if (!best || score > bestScore) { best = e; bestScore = score; }
    }
    t.hasTarget = !!best;
    if (best) {
      t.tarAng = Math.atan2(best.y - t.y, best.x - t.x);
      t.angle = angTo(t.angle, t.tarAng, dt * 12);
      if (t.cool <= 0) {
        t.cool = 1 / st.rate;
        fireTower(t, best, st);
      }
    }
  }

  // projectiles
  for (const p of projs) {
    p.life -= dt;
    if (p.life <= 0) { p.gone = true; continue; }
    if (p.tgt && !p.tgt.dead) {
      const dx = p.tgt.x - p.x, dy = p.tgt.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      p.vx = dx / d * p.spd; p.vy = dy / d * p.spd;
    }
    p.px = p.x; p.py = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = e.r + p.r;
      if (dist2(p.x, p.y, e.x, e.y) <= rr * rr) {
        if (p.kind === 'shell') explode(p.x, p.y, p.splash, p.dmg);
        else {
          damage(e, p.dmg);
          if (p.kind === 'frost') { e.slowT = SLOW_DUR; spark(p.x, p.y, '#9de7ff', 4, 70); }
          else spark(p.x, p.y, '#ffe08a', 3, 80);
        }
        p.gone = true;
        break;
      }
    }
    // out of bounds cleanup
    if (p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) p.gone = true;
  }
  projs = projs.filter(p => !p.gone);

  // fx
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b => b.life > 0);
  for (const pt of parts) {
    pt.life -= dt;
    if (pt.ring) continue;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= (1 - 3 * dt); pt.vy *= (1 - 3 * dt);
  }
  parts = parts.filter(pt => pt.life > 0);
  for (const f of floats) { f.life -= dt; f.y -= 26 * dt; }
  floats = floats.filter(f => f.life > 0);

  shake *= Math.exp(-6 * dt);
  coreFlash = Math.max(0, coreFlash - dt * 2.2);
}

function fireTower(t, target, st) {
  t.rec = 1;
  const mx = t.x + Math.cos(t.angle) * 18, my = t.y + Math.sin(t.angle) * 18;
  switch (t.def.kind) {
    case 'bullet':
      projs.push({ x: mx, y: my, px: mx, py: my, tgt: target, spd: t.def.pspd, r: 3, dmg: st.dmg, kind: 'bullet', life: 1.4, vx: 0, vy: 0 });
      SFX.shootGun();
      break;
    case 'frost':
      projs.push({ x: mx, y: my, px: mx, py: my, tgt: target, spd: t.def.pspd, r: 4, dmg: st.dmg, kind: 'frost', life: 1.6, vx: 0, vy: 0 });
      SFX.shootFrost();
      break;
    case 'shell':
      projs.push({ x: mx, y: my, px: mx, py: my, tgt: target, spd: t.def.pspd, r: 5, dmg: st.dmg, kind: 'shell', splash: t.def.splash * (1 + 0.08 * (t.level - 1)), life: 2.2, vx: 0, vy: 0 });
      SFX.shootCannon();
      break;
    case 'beam': {
      beams.push({ x1: mx, y1: my, x2: target.x, y2: target.y, life: .12, max: .12, color: t.def.color });
      damage(target, st.dmg);
      spark(target.x, target.y, t.def.color, 5, 120);
      SFX.shootSniper();
      break;
    }
  }
}

/* ---------------- input ---------------- */
const cvs = $('cv'), ctx = cvs.getContext('2d');
(function setupHiDPI() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();
function evtPos(e) {
  const rect = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * W / rect.width,
    y: (e.clientY - rect.top) * H / rect.height,
  };
}
cvs.addEventListener('mousemove', e => {
  const p = evtPos(e);
  mouse.x = p.x; mouse.y = p.y;
  mouse.c = Math.floor(p.x / TILE); mouse.r = Math.floor(p.y / TILE);
  mouse.inside = true;
  hoverTower = towerAt.get(keyOf(mouse.c, mouse.r)) || null;
  cvs.style.cursor = (selType || hoverTower) ? 'pointer' : 'crosshair';
});
cvs.addEventListener('mouseleave', () => { mouse.inside = false; hoverTower = null; });
cvs.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const p = evtPos(e);
  const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
  const existing = towerAt.get(keyOf(c, r));
  if (selType) {
    if (existing) selectTower(existing);
    else tryPlace(selType, c, r);
  } else {
    if (existing) selectTower(existing);
    else if (selTower) { selTower = null; renderSelPanel(); syncHint(); }
  }
});
cvs.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (selType) selectType(null);
  else if (selTower) { selTower = null; renderSelPanel(); syncHint(); }
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') {
    const tk = TOWER_KEYS[parseInt(k, 10) - 1];
    if (tk) selectType(selType === tk ? null : tk);
    e.preventDefault();
  } else if (k === 'escape') {
    if (selType) selectType(null);
    else if (selTower) { selTower = null; renderSelPanel(); syncHint(); }
  } else if (k === ' ') {
    e.preventDefault();
    if (!waveActive) startWave();
  } else if (k === 'p') {
    togglePause();
  } else if (k === 'f') {
    cycleSpeed();
  } else if (k === 'u') {
    doUpgrade();
  } else if (k === 'x') {
    doSell();
  }
});

$('btnStart').onclick = e => { startWave(); e.target.blur(); };
$('btnSpeed').onclick = e => { cycleSpeed(); e.target.blur(); };
$('btnPause').onclick = e => { togglePause(); e.target.blur(); };
$('btnMute').onclick = e => {

/* ---------------- static background ---------------- */
const bg = document.createElement('canvas');
(function buildBG() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  bg.width = W * dpr; bg.height = H * dpr;
  const b = bg.getContext('2d');
  b.scale(dpr, dpr);
  b.fillStyle = '#141c28';
  b.fillRect(0, 0, W, H);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      b.fillStyle = (c + r) % 2 ? '#182333' : '#151f2d';
      b.fillRect(c * TILE, r * TILE, TILE, TILE);
      const seed = h32(c * 374761393 + r * 668265263);
      if (!pathTiles.has(keyOf(c, r))) {
        if (seed % 9 === 0) {
          const cx = c * TILE + 10 + (seed % 26), cy = r * TILE + 10 + ((seed >> 4) % 26);
          b.fillStyle = '#223047';
          b.beginPath(); b.ellipse(cx, cy, 4.5, 3.2, (seed % 10) / 10, 0, Math.PI * 2); b.fill();
          b.fillStyle = '#2b3c58';
          b.beginPath(); b.ellipse(cx - 1, cy - 1, 2.2, 1.5, 0, 0, Math.PI * 2); b.fill();
        } else if (seed % 13 === 5) {
          const cx = c * TILE + 12 + (seed % 22), cy = r * TILE + 14 + ((seed >> 3) % 20);
          b.strokeStyle = '#243650'; b.lineWidth = 1.5;
          for (let i = -1; i <= 1; i++) {
            b.beginPath();
            b.moveTo(cx + i * 3.4, cy + 4);
            b.lineTo(cx + i * 4.6, cy - 3);
            b.stroke();
          }
        }
      }
    }
  }
  // path: layered strokes along waypoint polyline
  const drawPath = (width, color, dash) => {
    b.beginPath();
    b.moveTo(WP[0].x, WP[0].y);
    for (let i = 1; i < WP.length; i++) b.lineTo(WP[i].x, WP[i].y);
    b.lineWidth = width; b.strokeStyle = color;
    b.lineJoin = 'round'; b.lineCap = 'round';
    if (dash) b.setLineDash(dash); else b.setLineDash([]);
    b.stroke();
    b.setLineDash([]);
  };
  drawPath(TILE * 0.98, '#2a241d');
  drawPath(TILE * 0.88, '#4e4234');
  drawPath(TILE * 0.62, '#5a4c3c');
  drawPath(2, 'rgba(255,255,255,.06)', [10, 14]);
})();

const vig = document.createElement('canvas');
(function buildVignette() {
  vig.width = W; vig.height = H;
  const v = vig.getContext('2d');
  const g = v.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.4)');
  v.fillStyle = g;
  v.fillRect(0, 0, W, H);
})();

/* ---------------- render ---------------- */
function drawTowerShape(c2, t, ghost) {
  const d = t.def;
  c2.save();
  c2.globalAlpha = ghost ? 0.65 : 1;
  // base plate
  c2.fillStyle = '#0e1520';
  c2.strokeStyle = d.color;
  c2.lineWidth = 2;
  c2.beginPath(); c2.roundRect(t.x - 19, t.y - 19, 38, 38, 8); c2.fill(); c2.stroke();
  // hub + barrel
  c2.translate(t.x, t.y);
  c2.rotate(t.angle);
  const rec = t.rec * 4;
  if (d.kind === 'bullet') {
    c2.fillStyle = '#3a4b60';
    c2.fillRect(4 - rec, -3, 17, 6);
    c2.fillStyle = d.color;
    c2.fillRect(15 - rec, -2, 6, 4);
  } else if (d.kind === 'shell') {
    c2.fillStyle = '#3a4b60';
    c2.fillRect(2 - rec, -5, 17, 10);
    c2.fillStyle = d.color;
    c2.fillRect(13 - rec, -5.5, 7, 11);
  } else if (d.kind === 'frost') {
    c2.rotate(performance.now() / 600);
    c2.fillStyle = d.color;
    c2.beginPath();
    c2.moveTo(14 - rec, 0); c2.lineTo(0, -7); c2.lineTo(-8, 0); c2.lineTo(0, 7);
    c2.closePath(); c2.fill();
    c2.fillStyle = 'rgba(255,255,255,.75)';
    c2.beginPath(); c2.arc(0, 0, 3, 0, Math.PI * 2); c2.fill();
  } else if (d.kind === 'beam') {
    c2.fillStyle = '#3a4b60';
    c2.fillRect(2 - rec, -2.5, 25, 5);
    c2.fillStyle = d.color;
    c2.fillRect(22 - rec, -3.5, 6, 7);
  }
  c2.restore();
  // hub circle (unrotated)
  c2.save();
  c2.translate(t.x, t.y);
  c2.fillStyle = d.color;
  c2.beginPath(); c2.arc(0, 0, 6.5, 0, Math.PI * 2); c2.fill();
  c2.fillStyle = 'rgba(0,0,0,.35)';
  c2.beginPath(); c2.arc(0, 0, 2.5, 0, Math.PI * 2); c2.fill();
  // level pips
  for (let i = 0; i < t.level; i++) {
    c2.fillStyle = '#ffd166';
    c2.beginPath(); c2.arc(-12 + i * 8, 14, 2.2, 0, Math.PI * 2); c2.fill();
  }
  c2.restore();
}
function drawRangeCircle(x, y, range, color, fillAlpha) {
  ctx.beginPath();
  ctx.arc(x, y, range, 0, Math.PI * 2);
  ctx.fillStyle = color.replace('ALPHA', fillAlpha);
  ctx.fill();
  ctx.strokeStyle = color.replace('ALPHA', '.45');
  ctx.lineWidth = 1.5;
  ctx.stroke();
}
function drawEnemy(e, tSec) {
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.75, e.r * 0.9, e.r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  // boss aura
  if (e.type === 'boss') {
    ctx.strokeStyle = 'rgba(177,151,252,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 6 + Math.sin(tSec * 4) * 2.5, 0, Math.PI * 2); ctx.stroke();
  }
  // body
  ctx.fillStyle = e.def.color;
  ctx.strokeStyle = 'rgba(0,0,0,.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // eye / heading
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  ctx.arc(e.x + Math.cos(e.ang) * e.r * 0.45, e.y + Math.sin(e.ang) * e.r * 0.45, Math.max(2, e.r * 0.22), 0, Math.PI * 2);
  ctx.fill();
  // slow ring
  if (e.slowT > 0) {
    ctx.strokeStyle = 'rgba(157,231,255,.9)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  // hit flash
  if (e.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (e.hitFlash / 0.08 * 0.55).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }
  // hp bar
  if (e.hp < e.maxHp) {
    const pct = clamp(e.hp / e.maxHp, 0, 1);
    const bw = e.r * 2.2, bx = e.x - bw / 2, by = e.y - e.r - 9;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 5.5);
    ctx.fillStyle = 'hsl(' + Math.round(pct * 115) + ',72%,52%)';
    ctx.fillRect(bx, by, bw * pct, 3.5);
  }
}
function render(tSec) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.15) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  ctx.drawImage(bg, 0, 0, W, H);

  // entrance chevrons
  const march = (tSec * 42) % 26;
  ctx.fillStyle = 'rgba(61,220,151,.75)';
  for (let i = 0; i < 3; i++) {
    const x = WP[0].x + 14 + i * 13 + march;
    if (x > WP[0].x + 60) continue;
    ctx.beginPath();
    ctx.moveTo(x, WP[0].y - 9);
    ctx.lineTo(x + 8, WP[0].y);
    ctx.lineTo(x, WP[0].y + 9);
    ctx.lineTo(x + 3, WP[0].y);
    ctx.closePath(); ctx.fill();
  }
  // exit core
  const core = WP[WP.length - 2];
  const pul = 1 + Math.sin(tSec * 3) * 0.12 + coreFlash * 0.6;
  ctx.save();
  ctx.translate(core.x, core.y);
  ctx.fillStyle = '#2a1420';
  ctx.strokeStyle = 'rgba(255,93,115,.6)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.shadowColor = '#ff5d73'; ctx.shadowBlur = 14 * pul;
  ctx.fillStyle = '#ff5d73';
  ctx.font = 'bold 17px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('♥', 0, 1);
  ctx.restore();
  if (coreFlash > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (coreFlash * .8).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(core.x, core.y, 17 + (1 - coreFlash) * 26, 0, Math.PI * 2); ctx.stroke();
  }

  // range rings under units
  if (hoverTower && hoverTower !== selTower) {
    const st = towerStats(hoverTower);
    drawRangeCircle(hoverTower.x, hoverTower.y, st.range, 'rgba(255,255,255,ALPHA)', '.04');
  }
  if (selTower) {
    const st = towerStats(selTower);
    drawRangeCircle(selTower.x, selTower.y, st.range, 'rgba(109,198,255,ALPHA)', '.07');
    ctx.strokeStyle = 'rgba(109,198,255,.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(selTower.c * TILE + 3, selTower.r * TILE + 3, TILE - 6, TILE - 6);
  }

  // towers
  for (const t of towers) drawTowerShape(ctx, t, false);

  // enemies
  for (const e of enemies) drawEnemy(e, tSec);

  // projectiles
  for (const p of projs) {
    if (p.kind === 'bullet') {
      ctx.strokeStyle = 'rgba(255,224,138,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'shell') {
      ctx.strokeStyle = 'rgba(255,169,77,.4)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = '#ffa94d';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff3bf';
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'frost') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(tSec * 10);
      ctx.fillStyle = '#9de7ff';
      ctx.beginPath();
      ctx.moveTo(0, -5); ctx.lineTo(4, 0); ctx.lineTo(0, 5); ctx.lineTo(-4, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // beams
  for (const b of beams) {
    const a = b.life / b.max;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = b.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.restore();
  }

  // particles
  for (const pt of parts) {
    const a = clamp(pt.life / pt.max, 0, 1);
    if (pt.ring) {
      ctx.strokeStyle = pt.color;
      ctx.globalAlpha = a * .8;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (1.4 - a * .8), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * a + 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // floating text
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = (f.big ? '800 22px' : 'bold 13px') + ' system-ui';
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }

  // placement ghost
  if (selType && mouse.inside && inGrid(mouse.c, mouse.r)) {
    const k = keyOf(mouse.c, mouse.r);
    const ok = !pathTiles.has(k) && !towerAt.has(k) && money >= TOWERS[selType].cost;
    const gx = (mouse.c + .5) * TILE, gy = (mouse.r + .5) * TILE;
    const st = {
      dmg: TOWERS[selType].dmg, rate: TOWERS[selType].rate, range: TOWERS[selType].range,
    };
    drawRangeCircle(gx, gy, st.range, ok ? 'rgba(61,220,151,ALPHA)' : 'rgba(255,93,115,ALPHA)', '.06');
    ctx.fillStyle = ok ? 'rgba(61,220,151,.16)' : 'rgba(255,93,115,.2)';
    ctx.fillRect(mouse.c * TILE + 2, mouse.r * TILE + 2, TILE - 4, TILE - 4);
    ctx.strokeStyle = ok ? 'rgba(61,220,151,.8)' : 'rgba(255,93,115,.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(mouse.c * TILE + 2, mouse.r * TILE + 2, TILE - 4, TILE - 4);
    drawTowerShape(ctx, {
      def: TOWERS[selType], x: gx, y: gy, angle: -Math.PI / 2, level: 1, rec: 0, kind: TOWERS[selType].kind,
    }, true);
  }

  ctx.restore();
  ctx.drawImage(vig, 0, 0, W, H);

  // paused veil
  if (paused && !over) {
    ctx.fillStyle = 'rgba(7,10,15,.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8eef7';
    ctx.font = '800 30px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⏸ PAUSED', W / 2, H / 2);
  }

  syncHUD();
  syncSelAfford();
}

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(ts) {
  requestAnimationFrame(loop);
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.1) dt = 0.1;
  if (!paused && !over && !victoryShown) update(dt * SPEEDS[speedIdx]);
  render(ts / 1000);
}

/* ---------------- boot & demo ---------------- */
function boot() {
  initState();
  buildShop();
  syncAll();
  requestAnimationFrame(loop);
  if (demo) runDemo();
}
function runDemo() {
  const ep = epoch;
  const step = (fn, ms) => setTimeout(() => { if (epoch === ep && !over) fn(); }, ms);
  step(() => { money = 9999; $('chkAuto').checked = true; speedIdx = 2; $('btnSpeed').textContent = '3×'; syncShop(); }, 300);
  const spots = [['gun', 2, 4], ['gun', 4, 9], ['frost', 7, 3], ['cannon', 9, 9], ['sniper', 12, 6]];
  spots.forEach((s, i) => step(() => tryPlace(s[0], s[1], s[2]), 700 + i * 380));
  step(() => { selectType(null); startWave(); }, 700 + spots.length * 380 + 400);
}
boot();
</script>
