<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>STEPWERK — Web Audio step sequencer</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    background:#0b0e13;
    background-image:radial-gradient(1100px 480px at 50% -120px, rgba(56,132,255,.14), transparent 70%);
    color:#dbe2ec;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;justify-content:center;
    padding:28px 18px 44px;
  }
  .app{width:100%;max-width:1020px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

  header{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
  .brand h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.14em;color:#fff}
  .brand h1 span{color:#4cc2ff}
  .brand p{margin:2px 0 0;font-size:12px;color:#8b95a5;letter-spacing:.06em}

  .transport{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#12161d;border:1px solid #212937;border-radius:14px;padding:12px 16px}
  .btn{
    appearance:none;border:1px solid #2a3444;background:#1a2130;color:#dbe2ec;
    font:inherit;font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .btn:hover{background:#222b3d;border-color:#3a4a63}
  .btn.primary{
    background:linear-gradient(180deg,#4cc2ff,#2f9ee6);border-color:transparent;color:#04121d;
    font-weight:700;min-width:112px;
  }
  .btn.primary:hover{background:linear-gradient(180deg,#63cdff,#3fabef)}
  .btn.primary.playing{background:linear-gradient(180deg,#ffb45c,#f28c33);color:#1d0f02}
  .btn.primary.playing:hover{background:linear-gradient(180deg,#ffc078,#f79a45)}

  .ctl{display:flex;flex-direction:column;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8b95a5}
  .ctl b{color:#e8eef6;font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600}
  input[type=range]{accent-color:#4cc2ff;width:112px;cursor:pointer}
  select{background:#1a2130;border:1px solid #2a3444;color:#dbe2ec;border-radius:8px;padding:7px 8px;font:inherit;font-size:13px;cursor:pointer}

  #grid{
    display:grid;
    grid-template-columns:minmax(104px,148px) repeat(16,minmax(24px,1fr));
    gap:5px;margin-top:6px;touch-action:none;
  }
  .stepnum{text-align:center;font:600 10px ui-monospace,Consolas,monospace;color:#48546a;padding:2px 0}
  .stepnum.beat{color:#8fa3bd}
  .stepnum.ph{color:#fff;text-shadow:0 0 8px rgba(76,194,255,.9)}
  .stepnum[data-step="4"],.stepnum[data-step="8"],.stepnum[data-step="12"],
  .cell[data-step="4"],.cell[data-step="8"],.cell[data-step="12"]{margin-left:8px}

  .label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding-right:6px;min-width:0}
  .label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .label .mute{border:none;background:none;color:#3f4b5e;cursor:pointer;font-size:11px;line-height:1;padding:3px 4px;border-radius:5px}
  .label .mute:hover{color:#93a3ba;background:#1a2130}
  .label.is-muted span{opacity:.38}
  .label.is-muted .mute{color:#e2604f}

  .cell{
    height:30px;border-radius:7px;border:1px solid #202938;background:#151b25;
    cursor:pointer;padding:0;transition:background .12s,box-shadow .12s,border-color .12s,transform .06s;
  }
  .cell.beat{background:#182131}
  .cell:hover{border-color:#39465c}
  .cell:focus-visible{outline:2px solid #4cc2ff;outline-offset:-2px}
  .cell:active{transform:scale(.9)}
  .cell.on{
    background:var(--c);border-color:transparent;
    box-shadow:0 0 10px var(--c);
    box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent);
  }
  .cell.on:hover{filter:brightness(1.12)}
  .cell.ph{outline:2px solid rgba(255,255,255,.5);outline-offset:-2px}

  footer{margin-top:16px;text-align:center;color:#5d6b80;font-size:12px}
  kbd{
    background:#1a2130;border:1px solid #2a3444;border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#aebccd;
  }

  @media (max-width:760px){
    header{flex-direction:column;align-items:stretch}
    .brand h1{font-size:20px}
    #grid{grid-template-columns:minmax(72px,96px) repeat(16,minmax(15px,1fr));gap:3px}
    .cell{height:22px;border-radius:5px}
    .stepnum[data-step="4"],.stepnum[data-step="8"],.stepnum[data-step="12"],
    .cell[data-step="4"],.cell[data-step="8"],.cell[data-step="12"]{margin-left:5px}
    .label{font-size:10px}
    input[type=range]{width:96px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>STEP<span>WERK</span></h1>
      <p>a 16-step sequencer · every sound synthesized live with the Web Audio API</p>
    </div>
    <div class="transport">
      <button id="playBtn" class="btn primary" type="button">&#9654; Play</button>
      <div class="ctl">
        <label for="presetSel">Pattern</label>
        <select id="presetSel">
          <option value="demo" selected>Demo groove</option>
          <option value="house">House</option>
          <option value="breaks">Breakbeat</option>
          <option value="techno">Techno</option>
          <option value="empty">Empty grid</option>
        </select>
      </div>
      <div class="ctl">
        <label for="bpm">Tempo <b id="bpmVal">112</b></label>
        <input type="range" id="bpm" min="50" max="200" step="1" value="112">
      </div>
      <div class="ctl">
        <label for="swing">Swing <b id="swingVal">0%</b></label>
        <input type="range" id="swing" min="0" max="100" step="1" value="0">
      </div>
      <div class="ctl">
        <label for="vol">Volume</label>
        <input type="range" id="vol" min="0" max="100" step="1" value="80">
      </div>
      <button id="randBtn" class="btn" type="button">&#127922; Random</button>
      <button id="clearBtn" class="btn" type="button">&#10005; Clear</button>
    </div>
  </header>

  <main>
    <div id="grid" role="group" aria-label="Sequencer grid"></div>
  </main>

  <footer>
    Click cells to program, drag to paint &middot; <kbd>Space</kbd> play/stop &middot; click a track dot to mute it
  </footer>
</div>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------ constants */

  const STEPS = 16;
  const LOOKAHEAD_MS = 25;     // scheduler timer resolution
  const SCHEDULE_AHEAD = 0.12; // seconds of notes kept queued

  const TRACKS = [
    { id:'kick',  name:'Kick',       kind:'drum',  drum:'kick',  color:'#ff5d5d' },
    { id:'snare', name:'Snare',      kind:'drum',  drum:'snare', color:'#ff9e4f' },
    { id:'clap',  name:'Clap',       kind:'drum',  drum:'clap',  color:'#f6c445' },
    { id:'hat',   name:'Hi-hat',     kind:'drum',  drum:'hat',   color:'#a8e05f' },
    { id:'ohat',  name:'Open hat',   kind:'drum',  drum:'ohat',  color:'#59d68b' },
    { id:'bassA', name:'Bass \u00b7 A1', kind:'bass', freq:55.00, color:'#c084fc' },
    { id:'bassE', name:'Bass \u00b7 E2', kind:'bass', freq:82.41, color:'#8b7cf8' },
    { id:'sE5',   name:'Synth \u00b7 E5', kind:'synth', freq:659.25, color:'#38e1c8' },
    { id:'sD5',   name:'Synth \u00b7 D5', kind:'synth', freq:587.33, color:'#3bd4dc' },
    { id:'sC5',   name:'Synth \u00b7 C5', kind:'synth', freq:523.25, color:'#3fc7ee' },
    { id:'sA4',   name:'Synth \u00b7 A4', kind:'synth', freq:440.00, color:'#49b4f5' },
    { id:'sG4',   name:'Synth \u00b7 G4', kind:'synth', freq:392.00, color:'#5aa2f2' },
    { id:'sE4',   name:'Synth \u00b7 E4', kind:'synth', freq:329.63, color:'#6b90ea' },
    { id:'sD4',   name:'Synth \u00b7 D4', kind:'synth', freq:293.66, color:'#7a7fdc' },
    { id:'sC4',   name:'Synth \u00b7 C4', kind:'synth', freq:261.63, color:'#8870cf' }
  ];
  const BY_ID = Object.fromEntries(TRACKS.map(t => [t.id, t]));

  /* 'x' marks an active step; strings must be <= 16 chars */
  const PRESETS = {
    demo: {
      kick:  'x...x...x...x...',
      snare: '....x.......x...',
      hat:   '..x...x...x...x.',
      ohat:  '......x.......x.',
      bassA: 'x.....x.x.....x.',
      bassE: '....x.......x...',
      sE5:   '....x.......x...',
      sC5:   '..x.....x.......',
      sA4:   '......x.......x.',
      sG4:   'x...............'
    },
    house: {
      kick:  'x...x...x...x...',
      clap:  '....x.......x...',
      hat:   'x.x.x.x.x.x.x.x.',
      ohat:  '..x...x...x...x.',
      bassA: 'x..x..x...x..x..',
      sE5:   '......x.......x.',
      sA4:   '..x.....x.......',
      sG4:   'x...............'
    },
    breaks: {
      kick:  'x.........x.....',
      snare: '....x.......x...',
      clap:  '.......x........',
      hat:   'x.x.x.x.x.x.x.x.',
      bassA: 'x......x..x...x.',
      sA4:   '....x.......x...'
    },
    techno: {
      kick:  'x...x...x...x...',
      hat:   'x.x.x.x.x.x.x.x.',
      ohat:  '..x...x...x...x.',
      bassA: 'x.x.x.x.x.x.x.x.',
      sE5:   '..x.....x.....x.',
      sA4:   '........x.......'
    },
    empty: {}
  };

  /* ---------------------------------------------------------------- state */

  const pattern = {};            // trackId -> Uint8Array(STEPS)
  const muted   = {};            // trackId -> bool
  TRACKS.forEach(t => { pattern[t.id] = new Uint8Array(STEPS); muted[t.id] = false; });

  let actx = null;               // AudioContext, created on first play
  let mix, comp, master, drumBus, bassBus, synthBus, delayNode, delayWet, noiseBuf;

  let isPlaying = false;
  let current16th = 0;
  let nextNoteTime = 0;
  let timerID = null;
  const drawQueue = [];          // {step, time} awaiting visual playback
  let lastStepShown = -1;

  let bpm = 112;
  let swingAmt = 0;              // 0..0.33 of a 16th, odd steps late
  let vol = 80;

  /* ------------------------------------------------------------------- dom */

  const $ = id => document.getElementById(id);
  const grid    = $('grid');
  const playBtn = $('playBtn');

  const stepHeaders = [];
  const cells = {};              // trackId -> [HTMLElement]
  TRACKS.forEach(t => { cells[t.id] = []; });

  function buildGrid () {
    const corner = document.createElement('div');
    corner.className = 'corner';
    grid.appendChild(corner);

    for (let s = 0; s < STEPS; s++) {
      const d = document.createElement('div');
      d.className = 'stepnum' + (s % 4 === 0 ? ' beat' : '');
      d.dataset.step = s;
      d.textContent = s % 4 === 0 ? String(s / 4 + 1) : '\u00b7';
      grid.appendChild(d);
      stepHeaders.push(d);
    }

    for (const t of TRACKS) {
      const lab = document.createElement('div');
      lab.className = 'label';
      const mb = document.createElement('button');
      mb.type = 'button';
      mb.className = 'mute';
      mb.title = 'Mute / unmute ' + t.name;
      mb.textContent = '\u25cf';
      mb.addEventListener('click', () => {
        muted[t.id] = !muted[t.id];
        lab.classList.toggle('is-muted', muted[t.id]);
      });
      const nm = document.createElement('span');
      nm.textContent = t.name;
      nm.style.color = t.color;
      lab.append(mb, nm);
      grid.appendChild(lab);

      for (let s = 0; s < STEPS; s++) {
        const c = document.createElement('button');
        c.type = 'button';
        c.className = 'cell' + (s % 4 === 0 ? ' beat' : '');
        c.dataset.track = t.id;
        c.dataset.step = s;
        c.setAttribute('aria-label', t.name + ', step ' + (s + 1));
        c.style.setProperty('--c', t.color);
        grid.appendChild(c);
        cells[t.id].push(c);
      }
    }
  }

  function setCell (trackId, step, on) {
    pattern[trackId][step] = on ? 1 : 0;
    cells[trackId][step].classList.toggle('on', !!on);
  }

  function renderAll () {
    for (const t of TRACKS)
      for (let s = 0; s < STEPS; s++)
        cells[t.id][s].classList.toggle('on', pattern[t.id][s] === 1);
  }

  /* -------------------------------------------------- pointer painting */

  let painting = false;
  let paintVal = 1;

  grid.addEventListener('pointerdown', e => {
    const c = e.target.closest('.cell');
    if (!c) return;
    e.preventDefault();
    painting = true;
    const id = c.dataset.track, s = +c.dataset.step;
    paintVal = pattern[id][s] ? 0 : 1;
    setCell(id, s, paintVal);
  });

  window.addEventListener('pointermove', e => {
    if (!painting) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const c = el && el.closest('.cell');
    if (c) setCell(c.dataset.track, +c.dataset.step, paintVal);
  });
  window.addEventListener('pointerup', () => { painting = false; });
  window.addEventListener('pointercancel', () => { painting = false; });

  /* keyboard toggling on focused cells */
  grid.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') &&
        e.target.classList && e.target.classList.contains('cell')) {
      e.preventDefault();
      e.stopPropagation();
      const id = e.target.dataset.track, s = +e.target.dataset.step;
      setCell(id, s, !pattern[id][s]);
    }
  });

  /* ---------------------------------------------------------------- audio */

  function ensureAudio () {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();

    master = actx.createGain();
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 10;
    comp.ratio.value = 4;
    comp.attack.value = 0.003;
    comp.release.value = 0.24;

    mix = actx.createGain();
    drumBus  = actx.createGain(); drumBus.gain.value  = 0.95;
    bassBus  = actx.createGain(); bassBus.gain.value  = 0.85;
    synthBus = actx.createGain(); synthBus.gain.value = 0.75;

    delayNode = actx.createDelay(1.2);
    delayWet = actx.createGain(); delayWet.gain.value = 0.20;
    const fb = actx.createGain(); fb.gain.value = 0.30;
    synthBus.connect(mix);
    synthBus.connect(delayNode);
    delayNode.connect(fb);  fb.connect(delayNode);
    delayNode.connect(delayWet); delayWet.connect(mix);

    drumBus.connect(mix);
    bassBus.connect(mix);
    mix.connect(comp);
    comp.connect(master);
    master.connect(actx.destination);

    noiseBuf = actx.createBuffer(1, (actx.sampleRate * 2) | 0, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

    applyVolume();
    syncDelay();
  }

  function applyVolume () {
    if (master) master.gain.value = (vol / 100) * (vol / 100);
  }

  function syncDelay () {
    if (delayNode) delayNode.delayTime.value = Math.min(1.1, (60 / bpm) * 0.75);
  }

  function envGain (peak, t, decay) {
    const g = actx.createGain();
    g.gain.setValueAtTime(Math.max(peak, 0.0001), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    return g;
  }

  function noiseSrc (t, dur) {
    const s = actx.createBufferSource();
    s.buffer = noiseBuf;
    s.start(t);
    s.stop(t + dur + 0.03);
    return s;
  }

  function playKick (t) {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(155, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    o.connect(envGain(1.05, t, 0.30)).connect(drumBus);
    o.start(t); o.stop(t + 0.33);

    const n = noiseSrc(t, 0.03);
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1200;
    n.connect(hp).connect(envGain(0.25, t, 0.02)).connect(drumBus);
  }

  function playSnare (t) {
    const o = actx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(196, t);
    o.frequency.exponentialRampToValueAtTime(118, t + 0.07);
    o.connect(envGain(0.55, t, 0.14)).connect(drumBus);
    o.start(t); o.stop(t + 0.16);

    const n = noiseSrc(t, 0.22);
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1500;
    n.connect(hp).connect(envGain(0.70, t, 0.20)).connect(drumBus);
  }

  function playClap (t) {
    const n = noiseSrc(t, 0.32);
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 1.1;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    [[0, 0.50], [0.03, 0.45], [0.06, 0.40]].forEach(([off, v]) => {
      g.gain.setValueAtTime(v, t + off);
      g.gain.exponentialRampToValueAtTime(0.08, t + off + 0.02);
    });
    g.gain.setValueAtTime(0.40, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    n.connect(bp).connect(g).connect(drumBus);
  }

  function playHat (t, open) {
    const dur = open ? 0.40 : 0.06;
    const g = envGain(open ? 0.42 : 0.36, t, dur);
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 10000;
    hp.connect(bp).connect(g).connect(drumBus);
    [263, 400, 421, 474, 587, 845].forEach(f => {
      const o = actx.createOscillator();
      o.type = 'square';
      o.frequency.value = f;
      o.connect(hp);
      o.start(t); o.stop(t + dur + 0.03);
    });
  }

  function playBass (freq, t) {
    const o = actx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = freq;
    const sub = actx.createOscillator();
    sub.type = 'sine'; sub.frequency.value = freq;

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 7;
    lp.frequency.setValueAtTime(Math.min(freq * 14, 2200), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.6, 80), t + 0.18);

    o.connect(lp).connect(envGain(0.50, t, 0.32)).connect(bassBus);
    sub.connect(envGain(0.35, t, 0.30)).connect(bassBus);
    o.start(t); o.stop(t + 0.35);
    sub.start(t); sub.stop(t + 0.33);
  }

  function playSynth (freq, t) {
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.30, t + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 1.2;
    lp.frequency.setValueAtTime(Math.min(freq * 7, 7000), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 2, 300), t + 0.28);

    const o1 = actx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
    const o2 = actx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq;
    o2.detune.value = 7;
    o1.connect(lp); o2.connect(lp);
    lp.connect(g).connect(synthBus);
    o1.start(t); o1.stop(t + 0.36);
    o2.start(t); o2.stop(t + 0.36);
  }

  function trigger (trackId, t) {
    if (muted[trackId]) return;
    const tr = BY_ID[trackId];
    if (tr.kind === 'drum') {
      if (tr.drum === 'kick')  playKick(t);
      else if (tr.drum === 'snare') playSnare(t);
      else if (tr.drum === 'clap')  playClap(t);
      else playHat(t, tr.drum === 'ohat');
    } else if (tr.kind === 'bass') {
      playBass(tr.freq, t);
    } else {
      playSynth(tr.freq, t);
    }
  }

  /* ------------------------------------------------------------ transport */

  function scheduler () {
    const s16 = 60 / bpm / 4;
    while (nextNoteTime < actx.currentTime + SCHEDULE_AHEAD) {
      const t = nextNoteTime + (current16th % 2 === 1 ? swingAmt * s16 : 0);
      for (const tr of TRACKS)
        if (pattern[tr.id][current16th]) trigger(tr.id, t);
      drawQueue.push({ step: current16th, time: t });
      nextNoteTime += s16;
      current16th = (current16th + 1) % STEPS;
    }
  }

  async function start () {
    ensureAudio();
    try { await actx.resume(); } catch (_) { /* already running */ }
    isPlaying = true;
    current16th = 0;
    nextNoteTime = actx.currentTime + 0.08;
    drawQueue.length = 0;
    timerID = setInterval(scheduler, LOOKAHEAD_MS);
    playBtn.innerHTML = '&#9632; Stop';
    playBtn.classList.add('playing');
  }

  function stop () {
    isPlaying = false;
    clearInterval(timerID);
    timerID = null;
    drawQueue.length = 0;
    setPlayhead(-1);
    playBtn.innerHTML = '&#9654; Play';
    playBtn.classList.remove('playing');
  }

  playBtn.addEventListener('click', () => (isPlaying ? stop() : start()));

  /* ------------------------------------------------------- visual playhead */

  let lastPh = -1;
  function setPlayhead (step) {
    if (step === lastPh) return;
    if (lastPh >= 0) {
      stepHeaders[lastPh].classList.remove('ph');
      for (const t of TRACKS) cells[t.id][lastPh].classList.remove('ph');
    }
    if (step >= 0) {
      stepHeaders[step].classList.add('ph');
      for (const t of TRACKS) cells[t.id][step].classList.add('ph');
    }
    lastPh = step;
  }

  function frame () {
    requestAnimationFrame(frame);
    if (!actx || !isPlaying) return;
    const now = actx.currentTime;
    while (drawQueue.length && drawQueue[0].time <= now)
      lastStepShown = drawQueue.shift().step;
    setPlayhead(lastStepShown);
  }

  /* -------------------------------------------------------------- controls */

  $('bpm').addEventListener('input', e => {
    bpm = +e.target.value;
    $('bpmVal').textContent = String(bpm);
    syncDelay();
  });

  $('swing').addEventListener('input', e => {
    swingAmt = (+e.target.value / 100) * 0.33;
    $('swingVal').textContent = e.target.value + '%';
  });

  $('vol').addEventListener('input', e => {
    vol = +e.target.value;
    applyVolume();
  });

  function loadPreset (name) {
    const p = PRESETS[name] || {};
    for (const t of TRACKS) {
      const str = p[t.id] || '';
      for (let s = 0; s < STEPS; s++) setCell(t.id, s, str[s] === 'x');
    }
  }
  $('presetSel').addEventListener('change', e => loadPreset(e.target.value));

  $('randBtn').addEventListener('click', () => {
    const density = { kick: 0.30, snare: 0.14, clap: 0.07, hat: 0.50, ohat: 0.09 };
    for (const t of TRACKS) {
      const p = density[t.id] != null ? density[t.id]
              : t.kind === 'bass' ? 0.22 : 0.14;
      for (let s = 0; s < STEPS; s++)
        setCell(t.id, s, Math.random() < p);
    }
    setCell('kick', 0, 1);
  });

  $('clearBtn').addEventListener('click', () => {
    for (const t of TRACKS)
      for (let s = 0; s < STEPS; s++) setCell(t.id, s, 0);
  });

  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    const el = document.activeElement;
    if (el && el !== document.body && el !== document.documentElement) return;
    e.preventDefault();
    isPlaying ? stop() : start();
  });

  /* ------------------------------------------------------------------ init */

  buildGrid();
  loadPreset('demo');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
