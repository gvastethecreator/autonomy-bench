<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fluid — colorful WebGL flow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04050a; }
  #c {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: crosshair;
  }
  .hint {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    color: #fff; font: 500 12px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05);
    backdrop-filter: blur(6px); pointer-events: none;
    opacity: .6; animation: fade 9s ease forwards;
  }
  @keyframes fade { 0%, 60% { opacity: .6 } 100% { opacity: 0 } }
  #err {
    position: fixed; left: 0; right: 0; top: 45%;
    color: #ffb4b4; background: #1a0d10;
    border-top: 1px solid #5a2330; border-bottom: 1px solid #5a2330;
    padding: 18px; font: 13px/1.6 ui-monospace, Consolas, monospace;
    text-align: center; display: none; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">move to paint&ensp;·&ensp;drag to stir</div>
<div id="err"></div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('c');

const config = {
  SIM_RESOLUTION: 128,
  DYE_RESOLUTION: 1024,
  DENSITY_DISSIPATION: 1.0,
  VELOCITY_DISSIPATION: 0.2,
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 20,
  CURL: 30,
  SPLAT_RADIUS: 0.25,
  SPLAT_FORCE: 6000
};

function fail (msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  throw new Error(msg);
}

/* ---------------- WebGL context ---------------- */

const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
let gl = canvas.getContext('webgl2', params);
const isWebGL2 = !!gl;
if (!gl) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
if (!gl) fail('WebGL is not available in this browser.');

let halfFloat = null;
let supportLinearFiltering = false;
if (isWebGL2) {
  gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('EXT_color_buffer_half_float');
  supportLinearFiltering = true; // 16F filtering is core in WebGL2
} else {
  halfFloat = gl.getExtension('OES_texture_half_float');
  gl.getExtension('EXT_color_buffer_half_float');
  supportLinearFiltering = !!gl.getExtension('OES_texture_half_float_linear');
  if (!halfFloat) fail('Half-float textures are not supported in this browser.');
}
const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;

function supportRenderTextureFormat (internalFormat, format, type) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.deleteFramebuffer(fbo);
  gl.deleteTexture(texture);
  return ok;
}

const formatRGBA = (function () {
  const internalFormat = isWebGL2 ? gl.RGBA16F : gl.RGBA;
  if (supportRenderTextureFormat(internalFormat, gl.RGBA, halfFloatTexType))
    return { internalFormat, format: gl.RGBA };
  return null;
})();
if (!formatRGBA) fail('This device cannot render to floating-point textures.');

/* ---------------- shader plumbing ---------------- */

function compileShader (type, source, keywords) {
  if (keywords) source = keywords.map(k => '#define ' + k + '\n').join('') + source;
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
    fail('Shader compile error:\n' + gl.getShaderInfoLog(shader));
  return shader;
}
function createGLProgram (vs, fs) {
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.bindAttribLocation(program, 0, 'aPosition');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS))
    fail('Program link error:\n' + gl.getProgramInfoLog(program));
  return program;
}
function getUniforms (program) {
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return uniforms;
}
class Program {
  constructor (vs, fsSource, keywords) {
    this.program = createGLProgram(vs, compileShader(gl.FRAGMENT_SHADER, fsSource, keywords));
    this.uniforms = getUniforms(this.program);
  }
  bind () { gl.useProgram(this.program); }
}

const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
    precision highp float;
    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform vec2 texelSize;
    void main () {
        vUv = aPosition * 0.5 + 0.5;
        vL = vUv - vec2(texelSize.x, 0.0);
        vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y);
        vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(aPosition, 0.0, 1.0);
    }
`);

const copyShader = `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    void main () { gl_FragColor = texture2D(uTexture, vUv); }
`;

const clearShader = `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    uniform float value;
    void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
`;

const splatShader = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;
    void main () {
        vec2 p = vUv - point.xy;
        p.x *= aspectRatio;
        vec3 splat = exp(-dot(p, p) / radius) * color;
        vec3 base = texture2D(uTarget, vUv).xyz;
        gl_FragColor = vec4(base + splat, 1.0);
    }
`;

const advectionShader = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 dyeTexelSize;
    uniform float dt;
    uniform float dissipation;
    vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
        vec2 st = uv / tsize - 0.5;
        vec2 iuv = floor(st);
        vec2 fuv = fract(st);
        vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
        vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
        vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
        vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
        return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
    }
    void main () {
#ifdef MANUAL_FILTERING
        vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
        vec4 result = bilerp(uSource, coord, dyeTexelSize);
#else
        vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
        vec4 result = texture2D(uSource, coord);
#endif
        float decay = 1.0 + dissipation * dt;
        gl_FragColor = result / decay;
    }
`;

const divergenceShader = `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uVelocity, vL).x;
        float R = texture2D(uVelocity, vR).x;
        float T = texture2D(uVelocity, vT).y;
        float B = texture2D(uVelocity, vB).y;
        vec2 C = texture2D(uVelocity, vUv).xy;
        if (vL.x < 0.0) { L = -C.x; }
        if (vR.x > 1.0) { R = -C.x; }
        if (vT.y > 1.0) { T = -C.y; }
        if (vB.y < 0.0) { B = -C.y; }
        float div = 0.5 * (R - L + T - B);
        gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }
`;

const curlShader = `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uVelocity, vL).y;
        float R = texture2D(uVelocity, vR).y;
        float T = texture2D(uVelocity, vT).x;
        float B = texture2D(uVelocity, vB).x;
        float vorticity = R - L - T + B;
        gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }
`;

const vorticityShader = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;
    void main () {
        float L = texture2D(uCurl, vL).x;
        float R = texture2D(uCurl, vR).x;
        float T = texture2D(uCurl, vT).x;
        float B = texture2D(uCurl, vB).x;
        float C = texture2D(uCurl, vUv).x;
        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 0.0001;
        force *= curl * C;
        force.y *= -1.0;
        vec2 velocity = texture2D(uVelocity, vUv).xy;
        velocity += force * dt;
        velocity = min(max(velocity, -1000.0), 1000.0);
        gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
`;

const pressureShader = `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uDivergence;
    void main () {
        float L = texture2D(uPressure, vL).x;
        float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x;
        float B = texture2D(uPressure, vB).x;
        float divergence = texture2D(uDivergence, vUv).x;
        float pressure = (L + R + B + T - divergence) * 0.25;
        gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }
`;

const gradientSubtractShader = `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uVelocity;
    void main () {
        float L = texture2D(uPressure, vL).x;
        float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x;
        float B = texture2D(uPressure, vB).x;
        vec2 velocity = texture2D(uVelocity, vUv).xy;
        velocity.xy -= vec2(R - L, T - B);
        gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
`;

const displayShader = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uTexture;
    uniform vec2 texelSize;
    void main () {
        vec3 c = texture2D(uTexture, vUv).rgb;
#ifdef SHADING
        vec3 lc = texture2D(uTexture, vL).rgb;
        vec3 rc = texture2D(uTexture, vR).rgb;
        vec3 tc = texture2D(uTexture, vT).rgb;
        vec3 bc = texture2D(uTexture, vB).rgb;
        float dx = length(rc) - length(lc);
        float dy = length(tc) - length(bc);
        vec3 n = normalize(vec3(dx, dy, length(texelSize)));
        vec3 l = vec3(0.0, 0.0, 1.0);
        float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
        c *= diffuse;
#endif
        gl_FragColor = vec4(c, 1.0);
    }
`;

const copyProgram          = new Program(baseVertexShader, copyShader);
const clearProgram         = new Program(baseVertexShader, clearShader);
const splatProgram         = new Program(baseVertexShader, splatShader);
const advectionProgram     = new Program(baseVertexShader, advectionShader, supportLinearFiltering ? null : ['MANUAL_FILTERING']);
const divergenceProgram    = new Program(baseVertexShader, divergenceShader);
const curlProgram          = new Program(baseVertexShader, curlShader);
const vorticityProgram     = new Program(baseVertexShader, vorticityShader);
const pressureProgram      = new Program(baseVertexShader, pressureShader);
const gradientSubtractProg = new Program(baseVertexShader, gradientSubtractShader);
const displayProgram       = new Program(baseVertexShader, displayShader, ['SHADING']);

/* ---------------- fullscreen quad ---------------- */

const blit = (() => {
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  return target => {
    if (target == null) {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };
})();

/* ---------------- framebuffers ---------------- */

function createFBO (w, h, internalFormat, format, type, param) {
  gl.activeTexture(gl.TEXTURE0);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  return {
    texture, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach (id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    },
    dispose () { gl.deleteTexture(texture); gl.deleteFramebuffer(fbo); }
  };
}

function createDoubleFBO (w, h, internalFormat, format, type, param) {
  let fbo1 = createFBO(w, h, internalFormat, format, type, param);
  let fbo2 = createFBO(w, h, internalFormat, format, type, param);
  return {
    width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read () { return fbo1; }, set read (v) { fbo1 = v; },
    get write () { return fbo2; }, set write (v) { fbo2 = v; },
    swap () { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}

function resizeFBO (target, w, h, internalFormat, format, type, param) {
  const newFBO = createFBO(w, h, internalFormat, format, type, param);
  copyProgram.bind();
  gl.uniform1i(copyProgram.uniforms.uTexture, target.attach(0));
  blit(newFBO);
  target.dispose();
  return newFBO;
}

function resizeDoubleFBO (target, w, h, internalFormat, format, type, param) {
  if (target.width === w && target.height === h) return target;
  target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
  target.write.dispose();
  target.write = createFBO(w, h, internalFormat, format, type, param);
  target.width = w; target.height = h;
  target.texelSizeX = 1 / w; target.texelSizeY = 1 / h;
  return target;
}

function getResolution (resolution) {
  let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
  const min = Math.round(resolution);
  const max = Math.round(resolution * aspectRatio);
  return (gl.drawingBufferWidth > gl.drawingBufferHeight)
    ? { w: max, h: min }
    : { w: min, h: max };
}

let dye, velocity, divergence, curl, pressure;

function initFramebuffers () {
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const texType = halfFloatTexType;
  const rgba = formatRGBA;
  const filtering = supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  gl.disable(gl.BLEND);

  if (!dye) dye = createDoubleFBO(dyeRes.w, dyeRes.h, rgba.internalFormat, rgba.format, texType, filtering);
  else dye = resizeDoubleFBO(dye, dyeRes.w, dyeRes.h, rgba.internalFormat, rgba.format, texType, filtering);

  if (!velocity) velocity = createDoubleFBO(simRes.w, simRes.h, rgba.internalFormat, rgba.format, texType, filtering);
  else velocity = resizeDoubleFBO(velocity, simRes.w, simRes.h, rgba.internalFormat, rgba.format, texType, filtering);

  if (divergence) divergence.dispose();
  if (curl) curl.dispose();
  if (pressure) { pressure.read.dispose(); pressure.write.dispose(); }

  divergence = createFBO(simRes.w, simRes.h, rgba.internalFormat, rgba.format, texType, gl.NEAREST);
  curl       = createFBO(simRes.w, simRes.h, rgba.internalFormat, rgba.format, texType, gl.NEAREST);
  pressure   = createDoubleFBO(simRes.w, simRes.h, rgba.internalFormat, rgba.format, texType, gl.NEAREST);
}

/* ---------------- simulation step ---------------- */

function step (dt) {
  gl.disable(gl.BLEND);

  curlProgram.bind();
  gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  vorticityProgram.bind();
  gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
  gl.uniform1f(vorticityProgram.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  divergenceProgram.bind();
  gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
  blit(pressure.write);
  pressure.swap();

  pressureProgram.bind();
  gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  gradientSubtractProg.bind();
  gl.uniform2f(gradientSubtractProg.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(gradientSubtractProg.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradientSubtractProg.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  advectionProgram.bind();
  gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  const velId = velocity.read.attach(0);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velId);
  gl.uniform1i(advectionProgram.uniforms.uSource, velId);
  gl.uniform1f(advectionProgram.uniforms.dt, dt);
  gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  if (!supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
  blit(dye.write);
  dye.swap();
}

function render () {
  gl.disable(gl.BLEND);
  displayProgram.bind();
  gl.uniform2f(displayProgram.uniforms.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(displayProgram.uniforms.uTexture, dye.read.attach(0));
  blit(null);
}

/* ---------------- splats & color ---------------- */

function HSVtoRGB (h, s, v) {
  let r, g, b;
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    default: r = v; g = p; b = q; break;
  }
  return { r, g, b };
}

function generateColor () {
  const c = HSVtoRGB(Math.random(), 1.0, 1.0);
  c.r *= 0.15; c.g *= 0.15; c.b *= 0.15;
  return c;
}

function correctRadius (radius) {
  const aspectRatio = canvas.width / canvas.height;
  if (aspectRatio > 1) radius *= aspectRatio;
  return radius;
}

function correctDeltaX (delta) {
  const aspectRatio = canvas.width / canvas.height;
  if (aspectRatio < 1) delta *= aspectRatio;
  return delta;
}
function correctDeltaY (delta) {
  const aspectRatio = canvas.width / canvas.height;
  if (aspectRatio > 1) delta /= aspectRatio;
  return delta;
}

function splat (x, y, dx, dy, color, radiusScale) {
  splatProgram.bind();
  gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(splatProgram.uniforms.point, x, y);
  gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
  gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS * (radiusScale || 1.0) / 100.0));
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
  blit(dye.write);
  dye.swap();
}

function splatPointer (p) {
  splat(p.x, p.y, p.dx * config.SPLAT_FORCE, p.dy * config.SPLAT_FORCE, p.color);
}

function multipleSplats (amount) {
  for (let i = 0; i < amount; i++) {
    const color = generateColor();
    color.r *= 10; color.g *= 10; color.b *= 10;
    splat(
      Math.random(), Math.random(),
      1000 * (Math.random() - 0.5), 1000 * (Math.random() - 0.5),
      color, 0.8 + Math.random() * 0.9
    );
  }
}

function ambientSplat () {
  const color = generateColor();
  color.r *= 10; color.g *= 10; color.b *= 10;
  splat(
    0.15 + Math.random() * 0.7, 0.15 + Math.random() * 0.7,
    900 * (Math.random() - 0.5), 900 * (Math.random() - 0.5),
    color, 1.0 + Math.random()
  );
}

/* ---------------- input ---------------- */

const pointers = new Map();
let lastInteraction = performance.now();

function obtainPointer (e) {
  let p = pointers.get(e.pointerId);
  if (!p) {
    p = {
      id: e.pointerId,
      x: 0, y: 0, px: 0, py: 0, dx: 0, dy: 0,
      down: false, moved: false, seeded: false,
      color: generateColor()
    };
    pointers.set(e.pointerId, p);
  }
  return p;
}

function pointerCoords (e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width,
    y: 1 - (e.clientY - rect.top) / rect.height
  };
}

canvas.addEventListener('pointerdown', e => {
  const p = obtainPointer(e);
  const c = pointerCoords(e);
  p.down = true;
  p.seeded = true;
  p.moved = false;
  p.px = p.x = c.x;
  p.py = p.y = c.y;
  p.dx = 0; p.dy = 0;
  p.color = generateColor();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  lastInteraction = performance.now();
});

canvas.addEventListener('pointermove', e => {
  const p = obtainPointer(e);
  const isMouse = e.pointerType === 'mouse';
  if (!isMouse && !p.down) return;           // touch/pen only paints while pressed
  const c = pointerCoords(e);
  if (!p.seeded) {                           // first hover sample: seed, no streak
    p.x = c.x; p.y = c.y;
    p.px = p.x; p.py = p.y;
    p.seeded = true;
    return;
  }
  p.dx = correctDeltaX(c.x - p.x);
  p.dy = correctDeltaY(c.y - p.y);
  p.px = p.x; p.py = p.y;
  p.x = c.x; p.y = c.y;
  if (Math.abs(p.dx) > 0 || Math.abs(p.dy) > 0) p.moved = true;
  lastInteraction = performance.now();
});

function releasePointer (e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.down = false;
}
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

function applyInputs () {
  pointers.forEach(p => {
    if (p.moved) {
      p.moved = false;
      splatPointer(p);
    }
  });
}

/* ---------------- main loop ---------------- */

function scaleByPixelRatio (value) {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  return Math.floor(value * pixelRatio);
}

function resizeCanvas () {
  const width = scaleByPixelRatio(canvas.clientWidth);
  const height = scaleByPixelRatio(canvas.clientHeight);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    return true;
  }
  return false;
}

let lastUpdateTime = performance.now();
let nextAmbient = performance.now() + 2200;

function updateFrame () {
  const now = performance.now();
  let dt = (now - lastUpdateTime) / 1000;
  dt = Math.min(dt, 1 / 60);
  lastUpdateTime = now;

  if (resizeCanvas()) initFramebuffers();

  if (now >= nextAmbient) {                  // keep the scene alive when idle
    nextAmbient = now + 1700 + Math.random() * 1600;
    if (now - lastInteraction > 3500) ambientSplat();
  }

  applyInputs();
  step(dt);
  render();
  requestAnimationFrame(updateFrame);
}

resizeCanvas();
initFramebuffers();
lastUpdateTime = performance.now();
nextAmbient = lastUpdateTime + 2200;
multipleSplats(14);
requestAnimationFrame(updateFrame);

})();
</script>
</body>
</html>
