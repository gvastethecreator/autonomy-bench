<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2D Physics Sandbox</title>
<style>
  :root {
    --accent: #4cc2ff;
    --panel-bg: rgba(14, 19, 31, 0.82);
    --border: rgba(255, 255, 255, 0.09);
    --text: #d7e1ee;
    --text-dim: #8b99ad;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b101b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-user-select: none; user-select: none;
    color-scheme: dark;
  }
  #view { position: fixed; inset: 0; display: block; touch-action: none; }

  .panel {
    position: fixed; top: 12px; left: 12px; width: 236px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 32px rgba(0,0,0,.45);
    z-index: 10; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; cursor: default;
    border-bottom: 1px solid transparent;
  }
  .panel.collapsed .panel-head { border-bottom-color: var(--border); }
  .panel-head .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    flex: none;
  }
  .panel-head b { font-size: 13px; letter-spacing: .3px; }
  .flex { flex: 1; }
  #collapseBtn {
    all: unset; cursor: pointer; width: 22px; height: 22px;
    display: grid; place-items: center; border-radius: 6px;
    color: var(--text-dim); font-size: 14px; line-height: 1;
  }
  #collapseBtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .panel-body { padding: 4px 12px 12px; max-height: calc(100vh - 70px); overflow-y: auto; }
  .panel.collapsed .panel-body { display: none; }

  .lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--text-dim); margin: 10px 0 5px;
  }
  .lbl span { text-transform: none; letter-spacing: 0; color: var(--text); font-variant-numeric: tabular-nums; }

  .row { display: flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }

  button.btn, select {
    appearance: none; -webkit-appearance: none;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.09);
    color: var(--text); border-radius: 8px;
    padding: 5px 8px; font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s;
    font-family: inherit;
  }
  button.btn:hover { background: rgba(255,255,255,.1); }
  button.btn.active {
    background: rgba(76,194,255,.16);
    border-color: rgba(76,194,255,.55);
    color: #cdeaff;
    box-shadow: inset 0 0 0 1px rgba(76,194,255,.12);
  }
  button.btn.wide { width: 100%; }
  select { width: 100%; padding: 6px 8px; }

  input[type="range"] {
    width: 100%; margin: 2px 0; accent-color: var(--accent);
    height: 20px; cursor: pointer;
  }
  label.chk {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; margin: 9px 0 2px; cursor: pointer; color: var(--text);
  }
  label.chk input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  hr.sep { border: none; border-top: 1px solid var(--border); margin: 11px 0 2px; }

  #stats {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    color: var(--text-dim); white-space: nowrap;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #stats b { color: var(--text); font-weight: 600; }

  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10; max-width: min(92vw, 720px);
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 16px; font-size: 12px;
    color: var(--text-dim); text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #hint b { color: var(--text); font-weight: 600; }

  #toast {
    position: fixed; top: 58px; left: 50%; transform: translateX(-50%) translateY(-6px);
    z-index: 20; background: rgba(30, 40, 60, .92); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 7px 15px; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .panel { width: 200px; }
    #hint { font-size: 11px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="panel">
  <div class="panel-head">
    <span class="dot"></span><b>Physics Sandbox</b><span class="flex"></span>
    <button id="collapseBtn" title="Collapse panel">−</button>
  </div>
  <div class="panel-body">
    <div class="row" id="toolRow">
      <button class="btn active" data-tool="spawn" title="Click / drag to throw new bodies">Spawn</button>
      <button class="btn" data-tool="grab" title="Drag bodies around">Grab</button>
      <button class="btn" data-tool="wall" title="Drag to draw a static block">Wall</button>
      <button class="btn" data-tool="erase" title="Click bodies to delete">Erase</button>
    </div>

    <div class="lbl">Shape</div>
    <div class="row" id="shapeRow">
      <button class="btn active" data-shape="circle" title="Circle">●</button>
      <button class="btn" data-shape="box" title="Box">■</button>
      <button class="btn" data-shape="triangle" title="Triangle">▲</button>
      <button class="btn" data-shape="hexagon" title="Hexagon">⬡</button>
      <button class="btn" data-shape="blob" title="Random blob">❋</button>
    </div>

    <div class="lbl">Size <span id="sizeVal">26</span></div>
    <input type="range" id="size" min="10" max="90" step="1" value="26">

    <div class="lbl">Bounciness <span id="bounceVal">0.35</span></div>
    <input type="range" id="bounce" min="0" max="0.98" step="0.01" value="0.35">

    <div class="lbl">Grip (friction) <span id="gripVal">0.50</span></div>
    <input type="range" id="grip" min="0" max="1" step="0.01" value="0.5">

    <div class="lbl">Density</div>
    <select id="density">
      <option value="0.0012">Feather</option>
      <option value="0.002" selected>Normal</option>
      <option value="0.005">Lead</option>
    </select>

    <label class="chk"><input type="checkbox" id="staticChk"> Static body <i style="color:var(--text-dim);font-style:normal">(or hold Shift)</i></label>

    <hr class="sep">
    <div class="lbl">Gravity <span id="gravVal">1000</span></div>
    <input type="range" id="grav" min="-1500" max="1500" step="25" value="1000">
    <div class="row">
      <button class="btn" data-g="1000">↓ 1g</button>
      <button class="btn" data-g="0">0 g</button>
      <button class="btn" data-g="-700">↑ anti</button>
    </div>

    <hr class="sep">
    <div class="row">
      <button class="btn wide" id="pauseBtn">⏸ Pause <span style="color:var(--text-dim)">Space</span></button>
      <button class="btn" id="stepBtn" title="Advance one tick">⏭ Step</button>
    </div>
    <div class="row">
      <button class="btn" id="clearBtn" title="Remove everything">Clear</button>
      <button class="btn" id="resetBtn" title="Rebuild current scene">↺ Reset</button>
      <button class="btn" id="boomBtn" title="Blast at last pointer (E)">💥</button>
      <button class="btn" id="rainBtn" title="Toggle object rain (X)">☔</button>
    </div>

    <hr class="sep">
    <div class="lbl">Scene preset</div>
    <select id="preset">
      <option value="pyramid" selected>Pyramid stack</option>
      <option value="dominoes">Domino run</option>
      <option value="pendulum">Wrecking ball</option>
      <option value="seesaw">Seesaw</option>
      <option value="zerog">Zero-G pool</option>
    </select>

    <label class="chk"><input type="checkbox" id="debugChk"> Debug overlay <i style="color:var(--text-dim);font-style:normal">(D)</i></label>
  </div>
</div>

<div id="stats">…</div>
<div id="hint">…</div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   2D Physics Sandbox — single-file build
   Impulse-based rigid body engine (Box2D-Lite style):
   SAT polygon collision with face clipping, persistent
   contact manifolds with warm starting, revolute joints,
   soft mouse spring, semi-implicit Euler at 120 Hz.
   Units: pixels, seconds. y-axis points DOWN (canvas).
   ============================================================ */

// ---------- tiny math ----------
const TAU = Math.PI * 2;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function dot(ax, ay, bx, by) { return ax * bx + ay * by; }
function cross(a, b) { return a.x * b.y - a.y * b.x; }
function len(x, y) { return Math.sqrt(x * x + y * y); }
// w (scalar) x r  ->  (-w*ry, w*rx)
function crossSV(s, vx, vy, out) { out.x = -s * vy; out.y = s * vx; }
function neg(v) { return { x: -v.x, y: -v.y }; }
function rotVec(R, vx, vy, out) { // local -> world
  out.x = R.c * vx - R.s * vy;
  out.y = R.s * vx + R.c * vy;
}
function rotTVec(R, vx, vy, out) { // world -> local
  out.x = R.c * vx + R.s * vy;
  out.y = -R.s * vx + R.c * vy;
}
function inv2x2(a11, a12, a21, a22) {
  const det = a11 * a22 - a12 * a21;
  if (Math.abs(det) < 1e-12) return [0, 0, 0, 0];
  const id = 1 / det;
  return [a22 * id, -a12 * id, -a21 * id, a11 * id];
}

// ---------- geometry generators ----------
function ensureWinding(verts) { // positive shoelace area => outward normal = perp CW edge
  let area2 = 0;
  for (let i = 0; i < verts.length; i++) {
    const p = verts[i], q = verts[(i + 1) % verts.length];
    area2 += p.x * q.y - q.x * p.y;
  }
  if (area2 < 0) verts.reverse();
  return verts;
}
function recentre(verts) {
  let cx = 0, cy = 0, a2 = 0;
  for (let i = 0; i < verts.length; i++) {
    const p = verts[i], q = verts[(i + 1) % verts.length];
    const d = p.x * q.y - q.x * p.y;
    a2 += d;
    cx += (p.x + q.x) * d; cy += (p.y + q.y) * d;
  }
  if (Math.abs(a2) < 1e-9) return verts;
  cx /= 3 * a2; cy /= 3 * a2;
  for (const v of verts) { v.x -= cx; v.y -= cy; }
  return verts;
}
function boxVerts(hw, hh) {
  return ensureWinding([{ x: -hw, y: -hh }, { x: hw, y: -hh }, { x: hw, y: hh }, { x: -hw, y: hh }]);
}
function regPolyVerts(r, n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * TAU / n;
    pts.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
  }
  return ensureWinding(pts);
}
function convexHull(pts) { // Andrew monotone chain
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const half = (src) => {
    const out = [];
    for (const pt of src) {
      while (out.length >= 2 &&
        (out[out.length - 1].x - out[out.length - 2].x) * (pt.y - out[out.length - 2].y) -
        (out[out.length - 1].y - out[out.length - 2].y) * (pt.x - out[out.length - 2].x) <= 0) out.pop();
      out.push(pt);
    }
    return out;
  };
  const lower = half(p), upper = half(p.reverse());
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function blobVerts(r) {
  const n = 6 + ((Math.random() * 4) | 0);
  const angs = [];
  for (let i = 0; i < n; i++) angs.push((i + (Math.random() * 0.5 - 0.25)) * TAU / n);
  angs.sort((a, b) => a - b);
  const base = r * (0.62 + Math.random() * 0.38);
  const pts = angs.map(a => ({
    x: Math.cos(a) * base * (0.72 + Math.random() * 0.5),
    y: Math.sin(a) * base * (0.72 + Math.random() * 0.5)
  }));
  return ensureWinding(recentre(convexHull(pts)));
}

// ---------- Body ----------
let NEXT_ID = 1;
class Body {
  constructor(shapeDef, x, y, opts) {
    opts = opts || {};
    this.id = NEXT_ID++;
    this.shape = shapeDef;               // {type:'circle',r} | {type:'poly'}
    this.pos = { x, y };
    this.angle = opts.angle || 0;
    this.vel = { x: opts.vx || 0, y: opts.vy || 0 };
    this.angVel = opts.angVel || 0;
    this.friction = opts.friction != null ? opts.friction : 0.5;
    this.restitution = opts.restitution != null ? opts.restitution : 0.35;
    this.isStatic = !!opts.isStatic;
    this.isBound = !!opts.isBound;
    this.color = opts.color || null;     // assigned later by palette
    this.dead = false;

    if (shapeDef.type === 'poly') {
      this.lv = shapeDef.verts;
      this.ln = [];
      const n = this.lv.length;
      for (let i = 0; i < n; i++) {
        const p = this.lv[i], q = this.lv[(i + 1) % n];
        const ex = q.x - p.x, ey = q.y - p.y;
        const l = len(ex, ey) || 1;
        this.ln.push({ x: ey / l, y: -ex / l }); // outward for positive winding
      }
      this.wv = this.lv.map(() => ({ x: 0, y: 0 }));
      this.wn = this.ln.map(() => ({ x: 0, y: 0 }));
    } else {
      this.lv = null; this.ln = null; this.wv = null; this.wn = null;
    }
    this.R = { c: 1, s: 0 };
    this.minX = 0; this.minY = 0; this.maxX = 0; this.maxY = 0;
    this.computeMass(opts.density != null ? opts.density : 0.002);
    this.sync();
  }

  computeMass(density) {
    let m = 0, I = 0;
    if (this.shape.type === 'circle') {
      const r = this.shape.r;
      m = Math.PI * r * r * density;
      I = 0.5 * m * r * r;
    } else {
      let area2 = 0, cx = 0, cy = 0, Iorg = 0;
      const v = this.lv, n = v.length;
      for (let i = 0; i < n; i++) {
        const p1 = v[i], p2 = v[(i + 1) % n];
        const D = p1.x * p2.y - p2.x * p1.y;
        area2 += D;
        cx += (p1.x + p2.x) * D; cy += (p1.y + p2.y) * D;
        Iorg += D * (p1.x * p1.x + p1.x * p2.x + p2.x * p2.x +
                     p1.y * p1.y + p1.y * p2.y + p2.y * p2.y);
      }
      const area = area2 * 0.5;
      if (area < 1) { this.dead = true; }
      m = Math.abs(area) * density;
      I = Math.abs(Iorg) / 12 * density;
      // vertices were generated centred, but be safe:
      if (Math.abs(area2) > 1e-9) {
        cx /= 3 * area2; cy /= 3 * area2;
        I -= m * (cx * cx + cy * cy);
      }
    }
    if (this.isStatic) { this.mass = 0; this.invMass = 0; this.I = 0; this.invI = 0; }
    else {
      this.mass = m; this.invMass = m > 0 ? 1 / m : 0;
      this.I = I; this.invI = I > 0 ? 1 / I : 0;
    }
  }

  sync() {
    this.R.c = Math.cos(this.angle); this.R.s = Math.sin(this.angle);
    if (this.shape.type === 'circle') {
      const r = this.shape.r;
      this.minX = this.pos.x - r; this.minY = this.pos.y - r;
      this.maxX = this.pos.x + r; this.maxY = this.pos.y + r;
    } else {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < this.lv.length; i++) {
        rotVec(this.R, this.lv[i].x, this.lv[i].y, this.wv[i]);
        this.wv[i].x += this.pos.x;
        this.wv[i].y += this.pos.y;
        rotVec(this.R, this.ln[i].x, this.ln[i].y, this.wn[i]);
        const w = this.wv[i];
        if (w.x < minX) minX = w.x; if (w.x > maxX) maxX = w.x;
        if (w.y < minY) minY = w.y; if (w.y > maxY) maxY = w.y;
      }
      this.minX = minX; this.minY = minY; this.maxX = maxX; this.maxY = maxY;
    }
  }

  containsPoint(px, py) {
    if (this.shape.type === 'circle') {
      const dx = px - this.pos.x, dy = py - this.pos.y;
      const r = this.shape.r + 3;
      return dx * dx + dy * dy <= r * r;
    }
    const n = this.wn.length;
    for (let i = 0; i < n; i++) {
      const nn = this.wn[i], vv = this.wv[i];
      if ((px - vv.x) * nn.x + (py - vv.y) * nn.y > 4) return false;
    }
    return true;
  }
}

// ---------- Collision detection ----------
function circleCircle(a, b) {
  const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y;
  const rSum = a.shape.r + b.shape.r;
  const d2 = dx * dx + dy * dy;
  if (d2 >= rSum * rSum) return null;
  const dist = Math.sqrt(d2);
  let nx = 0, ny = -1;
  if (dist > 1e-6) { nx = dx / dist; ny = dy / dist; }
  const sep = dist - rSum;
  // midpoint of overlap
  const px = a.pos.x + nx * (a.shape.r + sep * 0.5);
  const py = a.pos.y + ny * (a.shape.r + sep * 0.5);
  return { nx, ny, points: [{ x: px, y: py, sep, fk: 'c' }] };
}

function polyCircle(P, C) { // normal points P -> C
  const c = C.pos, r = C.shape.r;
  let bestSep = -Infinity, bi = 0;
  for (let i = 0; i < P.wn.length; i++) {
    const n = P.wn[i], v = P.wv[i];
    const s = (c.x - v.x) * n.x + (c.y - v.y) * n.y;
    if (s > r) return null;
    if (s > bestSep) { bestSep = s; bi = i; }
  }
  const v1 = P.wv[bi];
  const idx2 = (bi + 1) % P.wv.length;
  const v2 = P.wv[idx2];
  const n = P.wn[bi];

  if (bestSep < 1e-6) { // centre inside polygon
    const px = c.x - n.x * bestSep, py = c.y - n.y * bestSep;
    return { nx: n.x, ny: n.y, points: [{ x: px, y: py, sep: bestSep - r, fk: bi + ':f' }] };
  }
  const ex = v2.x - v1.x, ey = v2.y - v1.y;
  const u1 = (c.x - v1.x) * ex + (c.y - v1.y) * ey;
  if (u1 <= 0) { // corner region near v1
    const dx = c.x - v1.x, dy = c.y - v1.y;
    const d = len(dx, dy);
    const sep = d - r;
    if (sep > 0) return null;
    const inv = d > 1e-6 ? 1 / d : 0;
    return { nx: dx * inv || n.x, ny: dy * inv || n.y, points: [{ x: v1.x, y: v1.y, sep, fk: bi + ':v1' }] };
  }
  const u2 = (c.x - v2.x) * ex + (c.y - v2.y) * ey;
  if (u2 >= 0) { // corner region near v2
    const dx = c.x - v2.x, dy = c.y - v2.y;
    const d = len(dx, dy);
    const sep = d - r;
    if (sep > 0) return null;
    const inv = d > 1e-6 ? 1 / d : 0;
    return { nx: dx * inv || n.x, ny: dy * inv || n.y, points: [{ x: v2.x, y: v2.y, sep, fk: bi + ':v2' }] };
  }
  // face region
  const sep = bestSep;
  const px = c.x - n.x * sep, py = c.y - n.y * sep;
  return { nx: n.x, ny: n.y, points: [{ x: px, y: py, sep: sep - r, fk: bi + ':f' }] };
}

function findMaxSeparation(A, B) {
  let best = -Infinity, bi = 0;
  const av = A.wv, an = A.wn, bv = B.wv;
  for (let i = 0; i < av.length; i++) {
    const n = an[i], v = av[i];
    let sMin = Infinity;
    for (let j = 0; j < bv.length; j++) {
      const s = (bv[j].x - v.x) * n.x + (bv[j].y - v.y) * n.y;
      if (s < sMin) sMin = s;
    }
    if (sMin > best) { best = sMin; bi = i; }
  }
  return [best, bi];
}

function clipSegment(vIn, nx, ny, offset, clipId) {
  const out = [];
  const d0 = vIn[0].v.x * nx + vIn[0].v.y * ny - offset;
  const d1 = vIn[1].v.x * nx + vIn[1].v.y * ny - offset;
  if (d0 <= 0) out.push(vIn[0]);
  if (d1 <= 0) out.push(vIn[1]);
  if (d0 * d1 < 0) {
    const t = d0 / (d0 - d1);
    const fp = (d0 > 0 ? vIn[0].fp : vIn[1].fp).slice();
    if (d0 > 0) { fp[0] = clipId; fp[2] = -1; }
    else { fp[1] = clipId; fp[3] = -1; }
    out.push({
      v: {
        x: vIn[0].v.x + t * (vIn[1].v.x - vIn[0].v.x),
        y: vIn[0].v.y + t * (vIn[1].v.y - vIn[0].v.y)
      },
      fp
    });
  }
  return out;
}

function polyPoly(A, B) {
  const [sA, eA] = findMaxSeparation(A, B);
  if (sA > 0) return null;
  const [sB, eB] = findMaxSeparation(B, A);
  if (sB > 0) return null;

  let ref, inc, refIdx, flip;
  if (sB > sA + 0.05) { ref = B; inc = A; refIdx = eB; flip = true; }
  else { ref = A; inc = B; refIdx = eA; flip = false; }

  const refN = ref.wn[refIdx]; // outward from reference poly

  // incident edge: the face most ANTI-parallel to the reference normal
  const nl = { x: 0, y: 0 };
  rotTVec(inc.R, refN.x, refN.y, nl);
  let minDot = Infinity, ii = 0;
  for (let i = 0; i < inc.ln.length; i++) {
    const d = inc.ln[i].x * nl.x + inc.ln[i].y * nl.y;
    if (d < minDot) { minDot = d; ii = i; }
  }
  // incident face ii spans vertices [ii -> ii+1]
  const nInc = inc.lv.length;
  const i1 = (ii + 1) % nInc;
  let clipped = [
    { v: { x: inc.wv[ii].x, y: inc.wv[ii].y }, fp: [-1, -1, ii, i1] },
    { v: { x: inc.wv[i1].x, y: inc.wv[i1].y }, fp: [-1, -1, i1, (i1 + 1) % nInc] }
  ];

  // side planes of reference face
  const v11 = ref.wv[refIdx];
  const v12 = ref.wv[(refIdx + 1) % ref.wv.length];
  let snx = v12.x - v11.x, sny = v12.y - v11.y;
  const sl = len(snx, sny) || 1;
  snx /= sl; sny /= sl;

  clipped = clipSegment(clipped, -snx, -sny, -(snx * v11.x + sny * v11.y), refIdx);
  if (clipped.length < 2) return null;
  clipped = clipSegment(clipped, snx, sny, snx * v12.x + sny * v12.y, (refIdx + 1) % ref.wv.length);
  if (clipped.length < 2) return null;

  const points = [];
  for (const cv of clipped) {
    const sep = (cv.v.x - v11.x) * refN.x + (cv.v.y - v11.y) * refN.y;
    if (sep <= 0) points.push({ x: cv.v.x, y: cv.v.y, sep, fk: cv.fp.join('.') });
  }
  if (!points.length) return null;
  return flip
    ? { nx: -refN.x, ny: -refN.y, points }
    : { nx: refN.x, ny: refN.y, points };
}

function collide(a, b) { // requires a.id < b.id ; normal points a -> b
  const ta = a.shape.type, tb = b.shape.type;
  if (ta === 'circle' && tb === 'circle') return circleCircle(a, b);
  if (ta === 'circle') {
    const m = polyCircle(b, a);
    return m ? { nx: -m.nx, ny: -m.ny, points: m.points } : null;
  }
  if (tb === 'circle') return polyCircle(a, b);
  return polyPoly(a, b);
}

// ---------- Contact solver ----------
const ALLOWED_PENETRATION = 0.5;
const BIAS_FACTOR = 0.25;
const RESTITUTION_THRESHOLD = 70; // px/s

class Arbiter {
  constructor(a, b, manifold) {
    this.a = a; this.b = b;
    this.friction = Math.sqrt(a.friction * b.friction);
    this.restitution = Math.sqrt(a.restitution * b.restitution);
    this.normal = { x: manifold.nx, y: manifold.ny };
    this.contacts = [];
    this.merge(manifold);
  }

  merge(manifold) {
    this.normal.x = manifold.nx; this.normal.y = manifold.ny;
    const oldMap = new Map();
    for (const c of this.contacts) oldMap.set(c.fk, c);
    const fresh = [];
    for (const p of manifold.points) {
      const old = oldMap.get(p.fk);
      fresh.push({
        x: p.x, y: p.y, sep: p.sep, fk: p.fk,
        Pn: old ? old.Pn : 0,
        Pt: old ? old.Pt : 0,
        massN: 0, massT: 0, velBias: 0,
        r1x: 0, r1y: 0, r2x: 0, r2y: 0
      });
    }
    this.contacts = fresh;
  }

  preStep(invDt) {
    const A = this.a, B = this.b;
    const n = this.normal;
    const tx = -n.y, ty = n.x;
    for (const c of this.contacts) {
      c.r1x = c.x - A.pos.x; c.r1y = c.y - A.pos.y;
      c.r2x = c.x - B.pos.x; c.r2y = c.y - B.pos.y;

      const rn1 = c.r1x * n.x + c.r1y * n.y;
      const rn2 = c.r2x * n.x + c.r2y * n.y;
      let kn = A.invMass + B.invMass;
      kn += A.invI * ((c.r1x * c.r1x + c.r1y * c.r1y) - rn1 * rn1);
      kn += B.invI * ((c.r2x * c.r2x + c.r2y * c.r2y) - rn2 * rn2);
      c.massN = kn > 0 ? 1 / kn : 0;

      const rt1 = c.r1x * tx + c.r1y * ty;
      const rt2 = c.r2x * tx + c.r2y * ty;
      let kt = A.invMass + B.invMass;
      kt += A.invI * ((c.r1x * c.r1x + c.r1y * c.r1y) - rt1 * rt1);
      kt += B.invI * ((c.r2x * c.r2x + c.r2y * c.r2y) - rt2 * rt2);
      c.massT = kt > 0 ? 1 / kt : 0;

      const bias = -BIAS_FACTOR * invDt * Math.min(0, c.sep + ALLOWED_PENETRATION);

      // restitution from pre-solve approach speed
      let bounce = 0;
      if (this.restitution > 0) {
        const dvx = (B.vel.x - B.angVel * c.r2y) - (A.vel.x - A.angVel * c.r1y);
        const dvy = (B.vel.y + B.angVel * c.r2x) - (A.vel.y + A.angVel * c.r1x);
        const vn = dvx * n.x + dvy * n.y;
        if (vn < -RESTITUTION_THRESHOLD) bounce = -this.restitution * vn;
      }
      c.velBias = bias + bounce;
    }
  }

  applyImpulse() {
    const A = this.a, B = this.b;
    const n = this.normal;
    const tx = -n.y, ty = n.x;
    for (const c of this.contacts) {
      // normal impulse
      let dvx = (B.vel.x - B.angVel * c.r2y) - (A.vel.x - A.angVel * c.r1y);
      let dvy = (B.vel.y + B.angVel * c.r2x) - (A.vel.y + A.angVel * c.r1x);
      const vn = dvx * n.x + dvy * n.y;
      let dPn = c.massN * (c.velBias - vn);
      const oldPn = c.Pn;
      c.Pn = Math.max(oldPn + dPn, 0);
      dPn = c.Pn - oldPn;
      let Px = dPn * n.x, Py = dPn * n.y;
      A.vel.x -= Px * A.invMass; A.vel.y -= Py * A.invMass;
      A.angVel -= (c.r1x * Py - c.r1y * Px) * A.invI;
      B.vel.x += Px * B.invMass; B.vel.y += Py * B.invMass;
      B.angVel += (c.r2x * Py - c.r2y * Px) * B.invI;

      // friction impulse
      dvx = (B.vel.x - B.angVel * c.r2y) - (A.vel.x - A.angVel * c.r1y);
      dvy = (B.vel.y + B.angVel * c.r2x) - (A.vel.y + A.angVel * c.r1x);
      const vt = dvx * tx + dvy * ty;
      let dPt = c.massT * (-vt);
      const maxPt = this.friction * c.Pn;
      const oldPt = c.Pt;
      c.Pt = clamp(oldPt + dPt, -maxPt, maxPt);
      dPt = c.Pt - oldPt;
      Px = dPt * tx; Py = dPt * ty;
      A.vel.x -= Px * A.invMass; A.vel.y -= Py * A.invMass;
      A.angVel -= (c.r1x * Py - c.r1y * Px) * A.invI;
      B.vel.x += Px * B.invMass; B.vel.y += Py * B.invMass;
      B.angVel += (c.r2x * Py - c.r2y * Px) * B.invI;
    }
  }
}

// ---------- Revolute joint ----------
class Joint {
  constructor(a, b, ax, ay) {
    this.a = a; this.b = b;
    const la = { x: 0, y: 0 }, lb = { x: 0, y: 0 };
    rotTVec(a.R, ax - a.pos.x, ay - a.pos.y, la);
    rotTVec(b.R, ax - b.pos.x, ay - b.pos.y, lb);
    this.la = la; this.lb = lb;
    this.M = [0, 0, 0, 0];
    this.biasX = 0; this.biasY = 0;
    this.r1 = { x: 0, y: 0 }; this.r2 = { x: 0, y: 0 };
  }

  preStep(invDt) {
    const A = this.a, B = this.b;
    rotVec(A.R, this.la.x, this.la.y, this.r1);
    rotVec(B.R, this.lb.x, this.lb.y, this.r2);
    const r1 = this.r1, r2 = this.r2;
    const k11 = A.invMass + B.invMass + A.invI * r1.y * r1.y + B.invI * r2.y * r2.y;
    const k12 = -A.invI * r1.x * r1.y - B.invI * r2.x * r2.y;
    const k22 = A.invMass + B.invMass + A.invI * r1.x * r1.x + B.invI * r2.x * r2.x;
    this.M = inv2x2(k11, k12, k12, k22);
    const p1x = A.pos.x + r1.x, p1y = A.pos.y + r1.y;
    const p2x = B.pos.x + r2.x, p2y = B.pos.y + r2.y;
    this.biasX = -0.2 * invDt * (p2x - p1x);
    this.biasY = -0.2 * invDt * (p2y - p1y);
  }

  solve() {
    const A = this.a, B = this.b, r1 = this.r1, r2 = this.r2;
    const dvx = (B.vel.x - B.angVel * r2.y) - (A.vel.x - A.angVel * r1.y);
    const dvy = (B.vel.y + B.angVel * r2.x) - (A.vel.y + A.angVel * r1.x);
    const M = this.M;
    const ix = M[0] * (this.biasX - dvx) + M[1] * (this.biasY - dvy);
    const iy = M[2] * (this.biasX - dvx) + M[3] * (this.biasY - dvy);
    A.vel.x -= ix * A.invMass; A.vel.y -= iy * A.invMass;
    A.angVel -= (r1.x * iy - r1.y * ix) * A.invI;
    B.vel.x += ix * B.invMass; B.vel.y += iy * B.invMass;
    B.angVel += (r2.x * iy - r2.y * ix) * B.invI;
  }
}

// ---------- World ----------
const STEP_DT = 1 / 120;
const VELOCITY_ITERATIONS = 8;
const MAX_BODIES = 520;
const MAX_SPEED = 3800;

class World {
  constructor() {
    this.bodies = [];
    this.joints = [];
    this.arbiters = new Map();
    this.gravity = { x: 0, y: 1000 };
    this.contactCount = 0;
  }

  add(body) { this.bodies.push(body); return body; }

  remove(body) {
    const i = this.bodies.indexOf(body);
    if (i >= 0) this.bodies.splice(i, 1);
    for (const key of [...this.arbiters.keys()]) {
      const arb = this.arbiters.get(key);
      if (arb.a === body || arb.b === body) this.arbiters.delete(key);
    }
    this.joints = this.joints.filter(j => j.a !== body && j.b !== body);
    if (grabbed && grabbed.body === body) grabbed = null;
  }

  clearNonBounds() {
    this.bodies = this.bodies.filter(b => b.isBound);
    this.joints.length = 0;
    this.arbiters.clear();
    grabbed = null;
  }

  jointedDynamicPair(a, b) {
    if (a.isStatic || b.isStatic) return false;
    return this.joints.some(j =>
      (j.a === a && j.b === b) || (j.a === b && j.b === a));
  }

  step(dt) {
    const invDt = 1 / dt;
    const bodies = this.bodies;
    const dynCount = bodies.length;

    // broadphase + narrowphase (O(n^2) AABB sweep)
    for (let i = 0; i < dynCount; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < dynCount; j++) {
        const b = bodies[j];
        if (a.isStatic && b.isStatic) continue;
        const idLo = a.id < b.id ? a.id : b.id;
        const key = idLo * 4096 + (a.id < b.id ? b.id : a.id);
        if (a.minX > b.maxX || b.minX > a.maxX ||
            a.minY > b.maxY || b.minY > a.maxY) {
          this.arbiters.delete(key);
          continue;
        }
        const lo = a.id < b.id ? a : b;
        const hi = a.id < b.id ? b : a;
        if (this.jointedDynamicPair(lo, hi)) { this.arbiters.delete(key); continue; }
        const manifold = collide(lo, hi);
        if (!manifold) { this.arbiters.delete(key); continue; }
        const existing = this.arbiters.get(key);
        if (existing) existing.merge(manifold);
        else this.arbiters.set(key, new Arbiter(lo, hi, manifold));
      }
    }
    this.contactCount = 0;
    for (const arb of this.arbiters.values()) this.contactCount += arb.contacts.length;

    // integrate forces
    const damp = 1 - 0.06 * dt;
    for (const b of bodies) {
      if (b.isStatic) continue;
      b.vel.x += this.gravity.x * dt;
      b.vel.y += this.gravity.y * dt;
      b.vel.x *= damp; b.vel.y *= damp;
      b.angVel *= 1 - 0.12 * dt;
    }

    // mouse spring (soft constraint)
    if (grabbed && !grabbed.body.isStatic) {
      const gb = grabbed.body;
      const r = { x: 0, y: 0 };
      rotVec(gb.R, grabbed.la.x, grabbed.la.y, r);
      const ax = gb.pos.x + r.x, ay = gb.pos.y + r.y;
      const cx = pointer.x - ax, cy = pointer.y - ay;
      const rvx = gb.vel.x - gb.angVel * r.y;
      const rvy = gb.vel.y + gb.angVel * r.x;
      const omega = TAU * 9;              // ~9 Hz spring
      const k = gb.mass * omega * omega;
      const cd = 2 * gb.mass * omega;     // critically damped
      let fx = k * cx - cd * rvx;
      let fy = k * cy - cd * rvy;
      const fMag = len(fx, fy);
      const fMax = gb.mass * 26000;
      if (fMag > fMax) { fx *= fMax / fMag; fy *= fMax / fMag; }
      const ix = fx * dt, iy = fy * dt;
      gb.vel.x += ix * gb.invMass; gb.vel.y += iy * gb.invMass;
      gb.angVel += (r.x * iy - r.y * ix) * gb.invI;
      grabbed.rx = r.x; grabbed.ry = r.y;
    }

    // pre-step + iterative velocity solve
    for (const arb of this.arbiters.values()) arb.preStep(invDt);
    for (const j of this.joints) j.preStep(invDt);
    for (let it = 0; it < VELOCITY_ITERATIONS; it++) {
      for (const arb of this.arbiters.values()) arb.applyImpulse();
      for (const j of this.joints) j.solve();
    }

    // integrate positions
    for (const b of bodies) {
      if (b.isStatic) continue;
      const sp = len(b.vel.x, b.vel.y);
      if (sp > MAX_SPEED) { const s = MAX_SPEED / sp; b.vel.x *= s; b.vel.y *= s; }
      b.pos.x += b.vel.x * dt;
      b.pos.y += b.vel.y * dt;
      b.angle += b.angVel * dt;
      b.sync();
      if (!isFinite(b.pos.x) || !isFinite(b.pos.y)) b.dead = true;
    }

    // purge dead
    for (let i = bodies.length - 1; i >= 0; i--) {
      if (bodies[i].dead) this.remove(bodies[i]);
    }
  }
}

// ---------- Setup ----------
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
let DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

const world = new World();
const state = {
  tool: 'spawn', shape: 'circle', size: 26,
  bounce: 0.35, grip: 0.5, density: 0.002,
  paused: false, stepOnce: false, debug: false, rain: false,
  preset: 'pyramid'
};
const pointer = { x: W / 2, y: H / 2, down: false, samples: [], hoveringBody: null };
let wallStart = null;
let grabbed = null;
const effects = [];       // expanding rings
let shake = 0;
let lastBoom = { x: W / 2, y: H / 2 };
let rainAcc = 0;

const HUES = [188, 208, 264, 288, 330, 158, 28, 96];
function pickColor() {
  const h = HUES[(Math.random() * HUES.length) | 0] + (Math.random() * 14 - 7);
  return `hsl(${h.toFixed(0)}, 62%, 60%)`;
}

function makeShapeVerts(shape, size) {
  switch (shape) {
    case 'box': return boxVerts(size * 0.85, size * 0.62);
    case 'triangle': return regPolyVerts(size, 3);
    case 'hexagon': return regPolyVerts(size * 0.92, 6);
    case 'blob': return blobVerts(size);
    default: return null; // circle
  }
}

function spawnBody(x, y, opts) {
  opts = opts || {};
  const size = opts.size != null ? opts.size : state.size;
  let shapeDef;
  const shapeKind = opts.shape || state.shape;
  if (opts.verts) shapeDef = { type: 'poly', verts: opts.verts };
  else if (shapeKind === 'circle') shapeDef = { type: 'circle', r: size };
  else shapeDef = { type: 'poly', verts: makeShapeVerts(shapeKind, size) };

  const body = new Body(shapeDef, x, y, {
    density: state.density,
    friction: state.grip,
    restitution: state.bounce,
    isStatic: opts.isStatic || false,
    angle: opts.angle != null ? opts.angle : (opts.verts ? 0 : Math.random() * TAU),
    vx: opts.vx || 0, vy: opts.vy || 0
  });
  if (body.dead) return null;
  body.color = opts.color || pickColor();

  // enforce population cap
  const dynamics = world.bodies.filter(b => !b.isBound && !b.isStatic);
  if (dynamics.length >= MAX_BODIES) {
    const victim = dynamics.find(b => !grabbed || grabbed.body !== b);
    if (victim) world.remove(victim);
    toastOnce('Population cap reached — recycling oldest objects');
  }
  return world.add(body);
}

function buildBounds() {
  world.bodies = world.bodies.filter(b => !b.isBound);
  const T = 340;
  const common = { isStatic: true, isBound: true, friction: 0.85, restitution: 0.15 };
  const mk = (x, y, hw, hh) => {
    const b = new Body({ type: 'poly', verts: boxVerts(hw, hh) }, x, y, common);
    b.color = '#39445a';
    world.add(b);
  };
  mk(W / 2, H + T / 2, W / 2 + T, T / 2);   // floor
  mk(W / 2, -T / 2, W / 2 + T, T / 2);      // ceiling
  mk(-T / 2, H / 2, T / 2, H / 2 + T);      // left
  mk(W + T / 2, H / 2, T / 2, H / 2 + T);   // right
}

// ---------- Presets ----------
function baseY() { return H - 2; }

const presets = {
  pyramid() {
    setGravityUI(1000);
    const rows = 7, bw = 52, bh = 28;
    for (let r = 0; r < rows; r++) {
      const count = rows - r;
      const startX = W / 2 - (count * (bw + 5)) / 2 + bw / 2;
      for (let i = 0; i < count; i++) {
        spawnBody(startX + i * (bw + 5), baseY() - bh / 2 - r * (bh + 2), {
          verts: boxVerts(bw / 2, bh / 2),
          friction: 0.55, restitution: 0.1
        });
      }
    }
  },

  dominoes() {
    setGravityUI(1000);
    const dh = 96, dw = 14, gap = 74;
    const n = clamp(Math.floor((W - 240) / gap), 4, 18);
    const startX = W / 2 - (n - 1) * gap / 2;
    for (let i = 0; i < n; i++) {
      const b = new Body({ type: 'poly', verts: boxVerts(dw / 2, dh / 2) },
        startX + i * gap, baseY() - dh / 2, { friction: 0.4, restitution: 0.04 });
      b.color = pickColor();
      world.add(b);
    }
    // cue ball rolling in from the left
    const cue = new Body({ type: 'circle', r: 17 }, startX - 130, baseY() - 150,
      { friction: 0.35, restitution: 0.15, vx: 540, vy: 0 });
    cue.color = '#ffd166';
    world.add(cue);
  },

  pendulum() {
    setGravityUI(1000);
    const anchorPos = { x: W / 2, y: Math.min(110, H * 0.16) };
    const anchor = new Body({ type: 'circle', r: 6 }, anchorPos.x, anchorPos.y, { isStatic: true });
    anchor.color = '#5b6b85';
    world.add(anchor);

    const segLen = 52, links = 6;
    const theta = 0.95; // release angle from vertical
    const dir = { x: Math.sin(theta), y: Math.cos(theta) };
    let prev = anchor;
    for (let i = 0; i < links; i++) {
      const cxp = anchorPos.x + dir.x * segLen * (i + 0.5);
      const cyp = anchorPos.y + dir.y * segLen * (i + 0.5);
      const link = new Body({ type: 'poly', verts: boxVerts(24, 7) }, cxp, cyp,
        { angle: theta, friction: 0.4, restitution: 0.05 });
      link.color = '#9aa7bd';
      world.add(link);
      world.joints.push(new Joint(prev, link, anchorPos.x + dir.x * segLen * i, anchorPos.y + dir.y * segLen * i));
      prev = link;
    }
    const ballR = 34;
    const ball = new Body({ type: 'circle', r: ballR },
      anchorPos.x + dir.x * (segLen * links + ballR),
      anchorPos.y + dir.y * (segLen * links + ballR),
      { density: 0.006, friction: 0.4, restitution: 0.1 });
    ball.color = '#ff8fa3';
    world.add(ball);
    world.joints.push(new Joint(prev, ball, anchorPos.x + dir.x * segLen * links, anchorPos.y + dir.y * segLen * links));

    // tower of blocks under the swing
    const rows = 5, bw = 38, bh = 24;
    for (let r = 0; r < rows; r++) {
      const count = rows - r;
      const startX = W / 2 - (count * (bw + 4)) / 2 + bw / 2;
      for (let i = 0; i < count; i++) {
        const bx = startX + i * (bw + 4);
        const by = baseY() - bh / 2 - r * (bh + 2);
        const b = new Body({ type: 'poly', verts: boxVerts(bw / 2, bh / 2) }, bx, by,
          { friction: 0.5, restitution: 0.08 });
        b.color = pickColor();
        world.add(b);
      }
    }
  },

  seesaw() {
    setGravityUI(1000);
    const cx = W / 2;
    const fulcrumH = 64, fulcrumW = 52;
    const fulcrum = new Body(
      { type: 'poly', verts: ensureWinding([{ x: -fulcrumW, y: 0 }, { x: fulcrumW, y: 0 }, { x: 0, y: -fulcrumH }]) },
      cx, baseY(), { isStatic: true, friction: 0.9 });
    fulcrum.color = '#39445a';
    world.add(fulcrum);

    const plank = new Body({ type: 'poly', verts: boxVerts(175, 9) },
      cx, baseY() - fulcrumH - 14, { friction: 0.6, restitution: 0.05 });
    plank.color = '#c9a227';
    world.add(plank);
    // pin plank to floor body at the pivot
    const floor = world.bodies.find(b => b.isBound);
    if (floor) world.joints.push(new Joint(floor, plank, cx, baseY() - fulcrumH - 14));

    // crates on the left arm
    for (let i = 0; i < 3; i++) {
      const b = new Body({ type: 'poly', verts: boxVerts(21, 16) },
        cx - 140, baseY() - fulcrumH - 34 - i * 36, { friction: 0.55, restitution: 0.1 });
      b.color = pickColor();
      world.add(b);
    }
    // heavy ball drops on the right arm
    const ball = new Body({ type: 'circle', r: 27 }, cx + 150, 140,
      { density: 0.006, friction: 0.4, restitution: 0.12 });
    ball.color = '#ff8fa3';
    world.add(ball);
  },

  zerog() {
    setGravityUI(0);
    for (let i = 0; i < 11; i++) {
      const r = 16 + Math.random() * 18;
      const b = new Body({ type: 'circle', r },
        W * (0.25 + Math.random() * 0.5), H * (0.2 + Math.random() * 0.5),
        { friction: 0.02, restitution: 0.97,
          vx: (Math.random() - 0.5) * 520, vy: (Math.random() - 0.5) * 520,
          angVel: (Math.random() - 0.5) * 6 });
      b.color = pickColor();
      world.add(b);
    }
    const hex = new Body({ type: 'poly', verts: regPolyVerts(42, 6) },
      W / 2, H / 2, { friction: 0.05, restitution: 0.95, angVel: 3 });
    hex.color = '#ffd166';
    world.add(hex);
  }
};

function loadPreset(name) {
  state.preset = name;
  world.clearNonBounds();
  effects.length = 0;
  (presets[name] || presets.pyramid)();
  document.getElementById('preset').value = name;
}

// ---------- Input ----------
function findBodyAt(x, y) {
  for (let i = world.bodies.length - 1; i >= 0; i--) {
    const b = world.bodies[i];
    if (!b.isBound && b.containsPoint(x, y)) return b;
  }
  return null;
}

function flingVelocity() {
  const now = performance.now();
  const recent = pointer.samples.filter(s => now - s.t < 130);
  if (recent.length < 2) return { x: 0, y: 0 };
  const a = recent[0], b = recent[recent.length - 1];
  const dt = (b.t - a.t) / 1000;
  if (dt <= 0) return { x: 0, y: 0 };
  let vx = (b.x - a.x) / dt * 0.95;
  let vy = (b.y - a.y) / dt * 0.95;
  const sp = len(vx, vy);
  if (sp > 2600) { vx *= 2600 / sp; vy *= 2600 / sp; }
  return { x: vx, y: vy };
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.samples = [{ t: performance.now(), x: pointer.x, y: pointer.y }];

  if (e.button === 2) { boomAt(pointer.x, pointer.y); return; }
  if (e.button !== 0) return;
  pointer.down = true;

  const wantStatic = state.staticSpawn || e.shiftKey;

  switch (state.tool) {
    case 'spawn': {
      const hit = findBodyAt(pointer.x, pointer.y);
      if (hit && !hit.isStatic && !wantStatic) {
        grabbed = { body: hit, la: (() => { const l = { x: 0, y: 0 }; rotTVec(hit.R, pointer.x - hit.pos.x, pointer.y - hit.pos.y, l); return l; })() };
      } else if (!hit) {
        const b = spawnBody(pointer.x, pointer.y, { isStatic: wantStatic });
        if (b && !wantStatic) grabbed = { body: b, la: { x: 0, y: 0 } };
      } else if (hit) {
        grabbed = { body: hit, la: { x: 0, y: 0 } };
      }
      break;
    }
    case 'grab': {
      const hit = findBodyAt(pointer.x, pointer.y);
      if (hit && !hit.isStatic) {
        const l = { x: 0, y: 0 };
        rotTVec(hit.R, pointer.x - hit.pos.x, pointer.y - hit.pos.y, l);
        grabbed = { body: hit, la: l };
      }
      break;
    }
    case 'wall':
      wallStart = { x: pointer.x, y: pointer.y };
      break;
    case 'erase':
      eraseAt(pointer.x, pointer.y);
      break;
  }
});

canvas.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (pointer.down) {
    pointer.samples.push({ t: performance.now(), x: pointer.x, y: pointer.y });
    if (pointer.samples.length > 10) pointer.samples.shift();
  }
  pointer.hoveringBody = state.tool === 'erase' ? findBodyAt(pointer.x, pointer.y) : null;
});

function endPointer(e) {
  if (!pointer.down) return;
  pointer.down = false;
  if (grabbed) {
    const fling = flingVelocity();
    if (len(fling.x, fling.y) > 40) {
      grabbed.body.vel.x = fling.x;
      grabbed.body.vel.y = fling.y;
    }
    grabbed = null;
  }
  if (state.tool === 'wall' && wallStart) {
    const x0 = wallStart.x, y0 = wallStart.y;
    const x1 = pointer.x, y1 = pointer.y;
    wallStart = null;
    const hw = Math.abs(x1 - x0) / 2, hh = Math.abs(y1 - y0) / 2;
    if (hw < 6 || hh < 6) return;
    const b = new Body({ type: 'poly', verts: boxVerts(hw, hh) },
      (x0 + x1) / 2, (y0 + y1) / 2, { isStatic: true, friction: 0.8, restitution: 0.15 });
    b.color = '#46536b';
    world.add(b);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const s = document.getElementById('size');
  s.value = clamp(parseInt(s.value, 10) + (e.deltaY < 0 ? 3 : -3), 10, 90);
  s.dispatchEvent(new Event('input'));
}, { passive: false });

function eraseAt(x, y) {
  const b = findBodyAt(x, y);
  if (b) world.remove(b);
}

function boomAt(x, y) {
  lastBoom.x = x; lastBoom.y = y;
  const R = 300;
  for (const b of world.bodies) {
    if (b.isStatic) continue;
    const dx = b.pos.x - x, dy = b.pos.y - y;
    const d = len(dx, dy);
    if (d > R) continue;
    const fall = Math.pow(1 - d / R, 1.3);
    const strength = 820 * fall;
    const inv = d > 1 ? 1 / d : 0;
    b.vel.x += dx * inv * strength;
    b.vel.y += dy * inv * strength - 60 * fall;
    b.angVel += (Math.random() - 0.5) * 14 * fall;
  }
  effects.push({ x, y, t: 0 });
  shake = 11;
}

// ---------- UI wiring ----------
const $ = id => document.getElementById(id);

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.remove('show'), 1800);
}
let lastToastMsg = '', lastToastTime = 0;
function toastOnce(msg) {
  const now = performance.now();
  if (msg !== lastToastMsg || now - lastToastTime > 4000) {
    lastToastMsg = msg; lastToastTime = now;
    toast(msg);
  }
}

function setTool(t) {
  state.tool = t;
  document.querySelectorAll('#toolRow .btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.tool === t));
  canvas.style.cursor = { spawn: 'crosshair', grab: 'grab', wall: 'cell', erase: 'pointer' }[t] || 'default';
  updateHint();
}

function setShape(s) {
  state.shape = s;
  document.querySelectorAll('#shapeRow .btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.shape === s));
}

function setGravityUI(g) {
  state.g = g;
  world.gravity.y = g;
  $('grav').value = clamp(g, -1500, 1500);
  $('gravVal').textContent = Math.round(g);
}

function updateHint() {
  const hints = {
    spawn: '<b>Click</b> drop · <b>Drag</b> aim & throw · <b>Shift</b> static · <b>Wheel</b> size · <b>Right-click</b> blast',
    grab: '<b>Drag</b> bodies · <b>Right-click</b> anywhere to blast',
    wall: '<b>Drag</b> to draw a static block',
    erase: '<b>Click</b> objects to delete them'
  };
  $('hint').innerHTML = `${hints[state.tool]} &nbsp;·&nbsp; <b>Space</b> pause · <b>R</b> reset · <b>C</b> clear · <b>E</b> boom · <b>X</b> rain · <b>D</b> debug`;
}

document.querySelectorAll('#toolRow .btn').forEach(btn =>
  btn.addEventListener('click', () => setTool(btn.dataset.tool)));
document.querySelectorAll('#shapeRow .btn').forEach(btn =>
  btn.addEventListener('click', () => setShape(btn.dataset.shape)));
document.querySelectorAll('[data-g]').forEach(btn =>
  btn.addEventListener('click', () => setGravityUI(parseFloat(btn.dataset.g))));

$('size').addEventListener('input', e => {
  state.size = parseInt(e.target.value, 10);
  $('sizeVal').textContent = state.size;
});
$('bounce').addEventListener('input', e => {
  state.bounce = parseFloat(e.target.value);
  $('bounceVal').textContent = state.bounce.toFixed(2);
});
$('grip').addEventListener('input', e => {
  state.grip = parseFloat(e.target.value);
  $('gripVal').textContent = state.grip.toFixed(2);
});
$('density').addEventListener('change', e => { state.density = parseFloat(e.target.value); });
$('staticChk').addEventListener('change', e => { state.staticSpawn = e.target.checked; });
$('grav').addEventListener('input', e => { setGravityUI(parseFloat(e.target.value)); });
$('preset').addEventListener('change', e => {
  loadPreset(e.target.value);
  toast(`Scene: ${e.target.selectedOptions[0].textContent}`);
});
$('debugChk').addEventListener('change', e => { state.debug = e.target.checked; });

function setPaused(p) {
  state.paused = p;
  $('pauseBtn').innerHTML = p
    ? '▶ Play <span style="color:var(--text-dim)">Space</span>'
    : '⏸ Pause <span style="color:var(--text-dim)">Space</span>';
  $('pauseBtn').classList.toggle('active', p);
}
$('pauseBtn').addEventListener('click', () => setPaused(!state.paused));
$('stepBtn').addEventListener('click', () => { state.stepOnce = true; });
$('clearBtn').addEventListener('click', () => { world.clearNonBounds(); effects.length = 0; toast('Cleared'); });
$('resetBtn').addEventListener('click', () => { loadPreset(state.preset); toast('Scene reset'); });
$('boomBtn').addEventListener('click', () => boomAt(lastBoom.x, lastBoom.y));
$('rainBtn').addEventListener('click', () => {
  state.rain = !state.rain;
  $('rainBtn').classList.toggle('active', state.rain);
  toast(state.rain ? 'Rain on' : 'Rain off');
});
$('collapseBtn').addEventListener('click', () => {
  const p = $('panel');
  p.classList.toggle('collapsed');
  $('collapseBtn').textContent = p.classList.contains('collapsed') ? '+' : '−';
});

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  switch (e.code) {
    case 'Space': e.preventDefault(); setPaused(!state.paused); break;
    case 'KeyS': state.stepOnce = true; break;
    case 'KeyR': loadPreset(state.preset); toast('Scene reset'); break;
    case 'KeyC': world.clearNonBounds(); effects.length = 0; toast('Cleared'); break;
    case 'KeyE': boomAt(lastBoom.x, lastBoom.y); break;
    case 'KeyX': $('rainBtn').click(); break;
    case 'KeyD': state.debug = !state.debug; $('debugChk').checked = state.debug; break;
    case 'Digit1': setShape('circle'); break;
    case 'Digit2': setShape('box'); break;
    case 'Digit3': setShape('triangle'); break;
    case 'Digit4': setShape('hexagon'); break;
    case 'Digit5': setShape('blob'); break;
    case 'KeyG': setGravityUI(world.gravity.y === 0 ? 1000 : 0); break;
  }
});

window.addEventListener('resize', () => {
  applySize();
});

function applySize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  buildBounds();
  gridPattern = null; // rebuild pattern
  for (const b of world.bodies) {
    if (b.isStatic) continue;
    b.pos.x = clamp(b.pos.x, 30, W - 30);
    b.pos.y = clamp(b.pos.y, 30, H - 30);
    b.sync();
  }
}

// ---------- Rendering ----------
let gridPattern = null;
function makeGridPattern() {
  const cell = 40;
  const c = document.createElement('canvas');
  c.width = cell; c.height = cell;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(148,170,205,0.07)';
  g.fillRect(cell / 2 - 0.5, cell / 2 - 0.5, 1.4, 1.4);
  gridPattern = ctx.createPattern(c, 'repeat');
}

function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0c1220');
  bg.addColorStop(1, '#101a2b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  if (!gridPattern) makeGridPattern();
  ctx.fillStyle = gridPattern;
  ctx.fillRect(0, 0, W, H);

  // screen shake
  if (shake > 0.2) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.86;
  } else shake = 0;

  // enclosure border
  ctx.strokeStyle = 'rgba(140,170,220,0.16)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  // wall preview
  if (state.tool === 'wall' && wallStart && pointer.down) {
    ctx.save();
    ctx.setLineDash([7, 5]);
    ctx.fillStyle = 'rgba(120,160,220,0.14)';
    ctx.strokeStyle = 'rgba(140,180,235,0.6)';
    ctx.lineWidth = 1.5;
    const x = Math.min(wallStart.x, pointer.x), y = Math.min(wallStart.y, pointer.y);
    const w = Math.abs(pointer.x - wallStart.x), h = Math.abs(pointer.y - wallStart.y);
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }

  // bodies
  for (const b of world.bodies) {
    if (b.isBound) continue;
    const isGrabbed = grabbed && grabbed.body === b;
    const isHover = pointer.hoveringBody === b;

    ctx.save();
    ctx.translate(b.pos.x, b.pos.y);
    ctx.rotate(b.angle);

    if (b.shape.type === 'circle') {
      const r = b.shape.r;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      ctx.fillStyle = b.color; ctx.fill();
      ctx.lineWidth = isGrabbed ? 2.5 : 1.4;
      ctx.strokeStyle = isGrabbed ? '#ffffff'
        : isHover ? '#ff5d5d' : 'rgba(10,14,22,0.55)';
      if (isGrabbed) { ctx.shadowColor = '#4cc2ff'; ctx.shadowBlur = 14; }
      ctx.stroke();
      ctx.shadowBlur = 0;
      // rotation spoke
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(r * 0.88, 0);
      ctx.strokeStyle = 'rgba(10,14,22,0.45)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, Math.max(1.5, r * 0.09), 0, TAU);
      ctx.fillStyle = 'rgba(10,14,22,0.45)'; ctx.fill();
    } else {
      ctx.beginPath();
      const vs = b.lv;
      ctx.moveTo(vs[0].x, vs[0].y);
      for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
      ctx.closePath();
      ctx.fillStyle = b.color; ctx.fill();
      ctx.lineWidth = isGrabbed ? 2.5 : 1.4;
      ctx.strokeStyle = isGrabbed ? '#ffffff'
        : isHover ? '#ff5d5d' : 'rgba(10,14,22,0.55)';
      if (isGrabbed) { ctx.shadowColor = '#4cc2ff'; ctx.shadowBlur = 14; }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // joints
  ctx.lineWidth = 2;
  for (const j of world.joints) {
    const pa = { x: 0, y: 0 }, pb = { x: 0, y: 0 };
    rotVec(j.a.R, j.la.x, j.la.y, pa); pa.x += j.a.pos.x; pa.y += j.a.pos.y;
    rotVec(j.b.R, j.lb.x, j.lb.y, pb); pb.x += j.b.pos.x; pb.y += j.b.pos.y;
    ctx.strokeStyle = 'rgba(210,225,245,0.4)';
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    for (const p of [pa, pb]) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, TAU);
      ctx.fillStyle = '#dfe9f7'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, TAU);
      ctx.strokeStyle = 'rgba(10,14,22,0.6)'; ctx.lineWidth = 1.2; ctx.stroke();
    }
  }

  // mouse spring visual
  if (grabbed && pointer.down) {
    const gb = grabbed.body;
    const r = { x: grabbed.rx || 0, y: grabbed.ry || 0 };
    const ax = gb.pos.x + r.x, ay = gb.pos.y + r.y;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(pointer.x, pointer.y);
    ctx.strokeStyle = 'rgba(76,194,255,0.5)';
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
    ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 4, 0, TAU);
    ctx.fillStyle = '#4cc2ff'; ctx.fill();
  }

  // effects (blast rings)
  for (let i = effects.length - 1; i >= 0; i--) {
    const ef = effects[i];
    ef.t += 1 / 60;
    const k = ef.t / 0.45;
    if (k >= 1) { effects.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(ef.x, ef.y, 12 + k * 190, 0, TAU);
    ctx.strokeStyle = `rgba(255,190,90,${(0.75 * (1 - k)).toFixed(3)})`;
    ctx.lineWidth = 3 * (1 - k) + 0.5;
    ctx.stroke();
  }

  // debug overlay
  if (state.debug) {
    ctx.save();
    for (const b of world.bodies) {
      if (b.isBound) continue;
      ctx.strokeStyle = 'rgba(80,220,255,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(b.minX, b.minY, b.maxX - b.minX, b.maxY - b.minY);
      // velocity vector
      ctx.beginPath();
      ctx.moveTo(b.pos.x, b.pos.y);
      ctx.lineTo(b.pos.x + b.vel.x / 6, b.pos.y + b.vel.y / 6);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.stroke();
      ctx.fillStyle = '#ff4d4d';
      ctx.fillRect(b.pos.x - 1.5, b.pos.y - 1.5, 3, 3);
    }
    for (const arb of world.arbiters.values()) {
      for (const c of arb.contacts) {
        ctx.beginPath(); ctx.arc(c.x, c.y, 2.6, 0, TAU);
        ctx.fillStyle = '#ffb347'; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + arb.normal.x * 18, c.y + arb.normal.y * 18);
        ctx.strokeStyle = 'rgba(120,255,150,0.85)';
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

// ---------- Main loop ----------
let lastFrame = performance.now();
let acc = 0;
let fpsEMA = 60;
let statTimer = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let frameDt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (frameDt > 0.25) frameDt = 0.25;
  if (frameDt > 0) fpsEMA += ((1 / frameDt) - fpsEMA) * 0.06;

  acc = Math.min(acc + frameDt, 0.1);
  let steps = 0;
  while (acc >= STEP_DT && steps < 6) {
    if (!state.paused || state.stepOnce) {
      world.step(STEP_DT);
      state.stepOnce = false;
    }
    acc -= STEP_DT;
    steps++;
  }

  // rain
  if (state.rain && !state.paused) {
    rainAcc += frameDt;
    while (rainAcc > 0.085) {
      rainAcc -= 0.085;
      const keepDensity = state.density, keepShape = state.shape, keepSize = state.size;
      const r = 6 + Math.random() * 8;
      state.shape = 'circle'; state.size = r;
      const b = spawnBody(30 + Math.random() * (W - 60), 26, {
        friction: 0.3, restitution: 0.35,
        vx: (Math.random() - 0.5) * 80, vy: 60
      });
      state.shape = keepShape; state.size = keepSize; state.density = keepDensity;
      void b;
    }
  } else rainAcc = 0;

  draw(now);

  statTimer += frameDt;
  if (statTimer > 0.25) {
    statTimer = 0;
    const dyn = world.bodies.filter(b => !b.isBound).length;
    $('stats').innerHTML =
      `<b>${fpsEMA.toFixed(0)}</b> fps · <b>${dyn}</b> bodies · <b>${world.contactCount}</b> contacts` +
      (state.paused ? ' · <b>PAUSED</b>' : '');
  }
}

// ---------- Boot ----------
window.__sb = { world, state, pointer, spawnBody, loadPreset, boomAt };
applySize();
loadPreset('pyramid');
setTool('spawn');
setGravityUI(1000);
updateHint();
requestAnimationFrame(frame);
</script>
</body>
</html>
