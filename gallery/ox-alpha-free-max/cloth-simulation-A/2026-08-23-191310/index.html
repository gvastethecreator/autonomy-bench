<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cloth Simulation</title>
<style>
  :root{
    --panel:rgba(16,18,23,.78);
    --line:rgba(255,255,255,.09);
    --txt:#e9e7e2;
    --dim:#9aa0ab;
    --accent:#d94f3d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b0c0f;color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #c{display:block;touch-action:none;cursor:grab}
  .hud{position:fixed;z-index:5}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #title{top:18px;left:20px;padding:12px 16px}
  #title h1{font-size:15px;letter-spacing:.16em;font-weight:650}
  #title p{font-size:11.5px;color:var(--dim);margin-top:3px}
  #controls{top:18px;right:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:236px}
  .row{display:flex;align-items:center;gap:8px}
  .row label{font-size:10.5px;letter-spacing:.12em;color:var(--dim);width:42px;text-transform:uppercase}
  input[type=range]{flex:1;accent-color:var(--accent);height:14px}
  #windVal{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;width:38px;text-align:right}
  button{font:inherit;font-size:12px;color:var(--txt);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;
    transition:background .15s,border-color .15s}
  button:hover{background:rgba(255,255,255,.13)}
  button.on{background:var(--accent);border-color:transparent;color:#fff}
  .grow{flex:1}
  #stats{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;
    color:var(--dim);letter-spacing:.04em}
  #stats b{color:var(--txt);font-weight:600}
  #hints{bottom:16px;left:50%;transform:translateX(-50%);padding:8px 16px;
    font-size:11.5px;color:var(--dim);white-space:nowrap}
  #hints b{color:var(--txt);font-weight:550}
  @media(max-width:700px){
    #hints,#title p{display:none}
    #controls{min-width:0;top:auto;bottom:14px;left:12px;right:12px;flex-direction:row;flex-wrap:wrap;gap:8px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud panel" id="title">
  <h1>CLOTH</h1>
  <p>verlet integration &middot; position-based constraints</p>
</div>

<div class="hud panel" id="controls">
  <div class="row">
    <label>Wind</label>
    <input id="wind" type="range" min="0" max="100" value="35">
    <span id="windVal">35%</span>
  </div>
  <div class="row">
    <label>Tool</label>
    <button id="toolGrab" class="on">Grab</button>
    <button id="toolCut">Cut</button>
    <span class="grow"></span>
  </div>
  <div class="row">
    <label>View</label>
    <button id="viewBtn">Shaded</button>
    <span class="grow"></span>
  </div>
  <div class="row">
    <button id="dropBtn">Release pins</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="stats"><b id="fps">60</b> fps &middot; <b id="links">0</b> links &middot; <b id="torn">0</b> torn</div>
</div>

<div class="hud panel" id="hints">
  <b>drag</b> grab &nbsp;&middot;&nbsp; <b>right-drag</b> cut &nbsp;&middot;&nbsp;
  <b>click point</b> pin/unpin &nbsp;&middot;&nbsp; <b>G</b>/<b>C</b> tool &nbsp;&middot;&nbsp;
  <b>V</b> view &nbsp;&middot;&nbsp; <b>D</b> drop pins &nbsp;&middot;&nbsp;
  <b>space</b> pause &nbsp;&middot;&nbsp; <b>R</b> reset
</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ setup */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const el = {
  wind: $('wind'), windVal: $('windVal'),
  tg: $('toolGrab'), tc: $('toolCut'), vb: $('viewBtn'),
  db: $('dropBtn'), rb: $('resetBtn'),
  fps: $('fps'), lk: $('links'), tr: $('torn'),
};

let W = 0, H = 0, DPR = 1, bg = null;

/* --------------------------------------------------------------- params */
const P = {
  colN: 44,     // columns of cells
  rowN: 34,     // max rows of cells
  g: 1500,      // gravity px/s^2
  damp: .986,   // air damping per frame
  it: 3,        // constraint iterations
  tear: 3.6,    // link snaps beyond rest * tear
  bend: .3,     // stiffness of bend links
  cutR: 14,     // cut tool radius px
  maxV: 36,     // per-step velocity clamp (stability)
  windMax: 1050 // wind accel at 100%
};

let sp = 16, COLS = 0, ROWS = 0, ox = 0;
const oy = 86;
let pts = [], cons = [], fibers = [];
let dead = 0, torn = 0;
let windAmt = .35, tool = 'grab', view = 0, paused = false;
const VIEWS = ['Shaded', 'Wireframe', 'Shaded + wire'];

let grab = null, mx = 0, my = 0, cutting = false, dx0 = 0, dy0 = 0, moved = false, pid = null;
let time = 0, acc = 0, last = performance.now(), fr = 0, ft = last;

/* shade lookup table: dark fold -> bright highlight, crimson hue */
const NL = 64, LUT = [];
for (let i = 0; i < NL; i++)
  LUT.push('hsl(356,60%,' + (9 + (i / (NL - 1)) * 60).toFixed(1) + '%)');

const IX = (i, j) => j * (COLS + 1) + i;

/* -------------------------------------------------------------- canvas */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bg = ctx.createRadialGradient(W * .5, H * .22, 60, W * .5, H * .55, Math.max(W, H) * .85);
  bg.addColorStop(0, '#1a1c23');
  bg.addColorStop(1, '#0a0b0e');
}

/* ---------------------------------------------------------- simulation */
function build() {
  pts = []; cons = []; fibers = [];
  dead = 0; torn = 0; acc = 0;
  const aw = Math.min(W * .68, 940);
  COLS = Math.max(10, Math.min(P.colN, Math.floor(aw / 9)));
  sp = aw / COLS;
  ROWS = Math.max(8, Math.min(P.rowN, Math.floor((H - oy - 30) / sp)));
  ox = Math.round((W - COLS * sp) / 2);

  for (let j = 0; j <= ROWS; j++)
    for (let i = 0; i <= COLS; i++) {
      const jx = j ? (Math.random() - .5) * .8 : 0;   // seed folds
      const jy = j ? (Math.random() - .5) * .8 : 0;
      pts.push({
        x: ox + i * sp + jx, y: oy + j * sp + jy,
        px: ox + i * sp + jx, py: oy + j * sp + jy,
        pin: j === 0
      });
    }

  const L = (a, b, t) => {
    const p = pts[a], q = pts[b];
    cons.push({ a, b, r: Math.hypot(q.x - p.x, q.y - p.y), t, d: false });
  };
  for (let j = 0; j <= ROWS; j++)
    for (let i = 0; i <= COLS; i++) {
      if (i < COLS) L(IX(i, j), IX(i + 1, j), 0);          // structural
      if (j < ROWS) L(IX(i, j), IX(i, j + 1), 0);
      if (i < COLS && j < ROWS) {                          // shear
        L(IX(i, j), IX(i + 1, j + 1), 1);
        L(IX(i + 1, j), IX(i, j + 1), 1);
      }
      if (i < COLS - 1) L(IX(i, j), IX(i + 2, j), 2);      // bend
      if (j < ROWS - 1) L(IX(i, j), IX(i, j + 2), 2);
    }
}

function kill(c, x, y) {
  c.d = true; dead++; torn++;
  if (fibers.length < 240)
    for (let k = 0; k < 2; k++)
      fibers.push({
        x, y,
        vx: (Math.random() - .5) * 90,
        vy: -Math.random() * 70,
        l: .45 + Math.random() * .35
      });
}

function step(h) {
  time += h;
  const h2 = h * h, g = P.g * h2, t = time;
  const gust = .55 + .45 * Math.sin(t * .47) * Math.sin(t * .29 + 1.3);
  const wA = windAmt * gust * P.windMax * h2;

  for (let n = 0; n < pts.length; n++) {
    const p = pts[n];
    if (p.pin) { p.px = p.x; p.py = p.y; continue; }
    let vx = (p.x - p.px) * P.damp, vy = (p.y - p.py) * P.damp;
    const v2 = vx * vx + vy * vy;
    if (v2 > P.maxV * P.maxV) {           // clamp velocity: no explosions
      const s = P.maxV / Math.sqrt(v2);
      vx *= s; vy *= s;
    }
    /* layered-sine wind field with slow gust envelope */
    const ph = t * 2.2 + p.x * .012 + p.y * .008;
    const wx = wA * (Math.sin(ph) * .6 + Math.sin(ph * 2.13 + 1.7) * .3);
    const wy = wA * Math.sin(ph * 1.71 + .6) * .22;
    p.px = p.x; p.py = p.y;
    p.x += vx + wx;
    p.y += vy + g + wy;
    if (!isFinite(p.x) || !isFinite(p.y)) { build(); return; }
  }

  /* floor + walls with friction */
  const fy = H - 26;
  for (let n = 0; n < pts.length; n++) {
    const p = pts[n];
    if (p.pin) continue;
    if (p.y > fy) { p.y = fy; p.px += (p.x - p.px) * .55; }
    if (p.x < 6) { p.x = 6; p.py += (p.y - p.py) * .4; }
    else if (p.x > W - 6) { p.x = W - 6; p.py += (p.y - p.py) * .4; }
  }
}

function relax() {
  for (let k = 0; k < P.it; k++) {
    const first = k === 0;
    for (let ci = 0; ci < cons.length; ci++) {
      const c = cons[ci];
      if (c.d) continue;
      const p = pts[c.a], q = pts[c.b];
      const dx = q.x - p.x, dy = q.y - p.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      if (first && d > c.r * P.tear) {         // tearing checked once per step
        kill(c, (p.x + q.x) * .5, (p.y + q.y) * .5);
        continue;
      }
      const wp = (p.pin || p === grab) ? 0 : 1;
      const wq = (q.pin || q === grab) ? 0 : 1;
      const sw = wp + wq;
      if (!sw) continue;
      const f = (d - c.r) / d * (c.t === 2 ? P.bend : 1) / sw;
      const fx = dx * f, fy = dy * f;
      if (wp) { p.x += fx; p.y += fy; }
      if (wq) { q.x -= fx; q.y -= fy; }
    }
  }
  if (grab) { grab.x = mx; grab.y = my; }
  if (dead > 400) { cons = cons.filter(c => !c.d); dead = 0; }
}

function fibersStep(h) {
  for (let i = fibers.length - 1; i >= 0; i--) {
    const f = fibers[i];
    f.l -= h;
    if (f.l <= 0) {
      fibers[i] = fibers[fibers.length - 1];
      fibers.pop();
      continue;
    }
    f.vy += 900 * h;
    f.vx *= .99;
    f.x += f.vx * h;
    f.y += f.vy * h;
  }
}

/* ------------------------------------------------------------- drawing */
function shadeIdx(u, s) {
  let l = (.10 + .5 * u) * s;              // signed-area "fold lighting"
  l = l < .05 ? .05 : l > .92 ? .92 : l;
  return (l * (NL - 1)) | 0;
}

function drawShaded() {
  const inv = 1 / (sp * sp);
  for (let j = 0; j < ROWS; j++) {
    const s = 1.05 - .16 * (j / ROWS);     // subtle vertical falloff
    for (let i = 0; i < COLS; i++) {
      const a = pts[IX(i, j)], b = pts[IX(i + 1, j)],
            c = pts[IX(i + 1, j + 1)], d = pts[IX(i, j + 1)];
      const ck = ((i + j) & 1) ? .015 : 0; // faint weave checker
      const u1 = ((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x)) * inv;
      const u2 = ((c.x - a.x) * (d.y - a.y) - (c.y - a.y) * (d.x - a.x)) * inv;
      ctx.fillStyle = LUT[shadeIdx(((u1 + u2) * .5) + ck, s)];
      if (u1 - u2 < .18 && u1 - u2 > -.18) {
        /* flat enough: single quad fill, no visible diagonal seam */
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
        ctx.fill();
      } else {
        /* folded: per-triangle shading keeps the crease crisp */
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y);
        ctx.fill();
        ctx.fillStyle = LUT[shadeIdx(u2 + ck, s)];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
        ctx.fill();
      }
    }
  }
}

function drawWire(overlay) {
  ctx.beginPath();
  for (let ci = 0; ci < cons.length; ci++) {
    const c = cons[ci];
    if (c.d || c.t === 2) continue;
    const p = pts[c.a], q = pts[c.b];
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(q.x, q.y);
  }
  ctx.lineWidth = overlay ? .6 : .9;
  ctx.strokeStyle = overlay ? 'rgba(15,8,8,.28)' : 'rgba(232,228,222,.55)';
  ctx.stroke();
}

function drawMarkers() {
  ctx.fillStyle = '#e8b64c';
  for (let n = 0; n < pts.length; n++) {
    const p = pts[n];
    if (!p.pin) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, 6.2832);
    ctx.fill();
  }
  if (grab) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(grab.x, grab.y, 7, 0, 6.2832);
    ctx.stroke();
  }
}

function drawFibers() {
  if (!fibers.length) return;
  ctx.lineWidth = 1;
  for (const f of fibers) {
    ctx.strokeStyle = 'rgba(255,140,110,' + Math.min(1, f.l * 2).toFixed(2) + ')';
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x - f.vx * .03, f.y - f.vy * .03);
    ctx.stroke();
  }
}

function render() {
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 25.5);
  ctx.lineTo(W, H - 25.5);
  ctx.stroke();
  if (view !== 1) drawShaded();
  if (view !== 0) drawWire(view === 2);
  drawFibers();
  drawMarkers();
}

/* -------------------------------------------------------------- pointer */
function nearest(x, y) {
  let best = null, bd = Math.pow(Math.max(20, sp * 1.5), 2);
  for (const p of pts) {
    const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function segDist(px, py, qx, qy, x, y) {
  const ex = qx - px, ey = qy - py;
  const L2 = ex * ex + ey * ey;
  let t = L2 ? ((x - px) * ex + (y - py) * ey) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px + ex * t - x, py + ey * t - y);
}

function cut(x, y) {
  for (const c of cons) {
    if (c.d) continue;
    const p = pts[c.a], q = pts[c.b];
    if (segDist(p.x, p.y, q.x, q.y, x, y) < P.cutR)
      kill(c, x, y);
  }
}

cv.addEventListener('pointerdown', e => {
  if (pid !== null) return;
  pid = e.pointerId;
  try { cv.setPointerCapture(pid); } catch (err) {}
  mx = e.clientX; my = e.clientY;
  dx0 = mx; dy0 = my; moved = false;
  if (e.button === 2 || tool === 'cut') { cutting = true; cut(mx, my); }
  else grab = nearest(mx, my);
});

cv.addEventListener('pointermove', e => {
  if (pid === null || e.pointerId !== pid) return;
  mx = e.clientX; my = e.clientY;
  if (!moved && (mx - dx0) * (mx - dx0) + (my - dy0) * (my - dy0) > 16) moved = true;
  if (cutting) cut(mx, my);
});

const up = e => {
  if (e.pointerId !== pid) return;
  pid = null;
  if (cutting) cutting = false;
  else if (grab) {
    if (!moved) grab.pin = !grab.pin;    // tap = toggle pin
    grab = null;
  }
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* -------------------------------------------------------------------- UI */
function setTool(t) {
  tool = t;
  el.tg.classList.toggle('on', t === 'grab');
  el.tc.classList.toggle('on', t === 'cut');
  cv.style.cursor = t === 'grab' ? 'grab' : 'crosshair';
}
el.tg.onclick = () => { setTool('grab'); el.tg.blur(); };
el.tc.onclick = () => { setTool('cut'); el.tc.blur(); };
el.vb.onclick = () => {
  view = (view + 1) % 3;
  el.vb.textContent = VIEWS[view];
  el.vb.blur();
};
el.rb.onclick = () => { build(); el.rb.blur(); };
el.db.onclick = () => { for (const p of pts) p.pin = false; el.db.blur(); };
el.wind.oninput = () => {
  windAmt = el.wind.value / 100;
  el.windVal.textContent = el.wind.value + '%';
};

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  else if (e.key === 'r' || e.key === 'R') build();
  else if (e.key === 'g' || e.key === 'G') setTool('grab');
  else if (e.key === 'c' || e.key === 'C') setTool('cut');
  else if (e.key === 'v' || e.key === 'V') el.vb.onclick();
  else if (e.key === 'd' || e.key === 'D') el.db.onclick();
});

/* ------------------------------------------------------------------ loop */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .06) dt = .06;
  fibersStep(dt);
  if (!paused) {
    acc += dt;
    const h = 1 / 60;
    let n = 0;
    while (acc >= h && n < 3) { step(h); relax(); n++; acc -= h; }
    if (n === 3) acc = 0;
  } else {
    relax();                               // pose mode: constraints still settle
  }
  render();
  fr++;
  if (now - ft > 500) {
    el.fps.textContent = Math.round(fr * 1000 / (now - ft));
    el.lk.textContent = cons.length - dead;
    el.tr.textContent = torn;
    fr = 0; ft = now;
  }
}

let rt = null;
addEventListener('resize', () => {
  resize();
  clearTimeout(rt);
  rt = setTimeout(build, 180);
});

resize();
build();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
