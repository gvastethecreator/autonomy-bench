<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NOCTURNE CITY — procedural metropolis</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  body{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:#cfd8e6;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{display:block;cursor:grab;}
  canvas:active{cursor:grabbing;}
  .overlay{position:fixed;z-index:10;pointer-events:none;}
  #vignette{inset:0;background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,5,.62) 100%);}
  #brand{top:26px;left:30px;opacity:0;animation:fadein 1.6s .4s ease forwards;}
  #brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.42em;color:#f0a95c;text-shadow:0 0 22px rgba(240,169,92,.45);}
  #brand p{margin:7px 0 0 2px;font-size:10.5px;letter-spacing:.18em;color:#77839a;text-transform:uppercase;}
  #hud{top:26px;right:30px;text-align:right;font-size:10.5px;line-height:1.85;letter-spacing:.14em;color:#6f7c94;opacity:0;animation:fadein 1.6s .8s ease forwards;}
  #hud b{color:#aeb9cd;font-weight:600;}
  #hint{bottom:24px;left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.22em;color:#5d6a82;text-transform:uppercase;opacity:0;animation:fadein 1.6s 1.3s ease forwards;white-space:nowrap;}
  #hint em{font-style:normal;color:#c9924f;}
  @keyframes fadein{to{opacity:1}}
  @media(max-width:640px){#hud{display:none}#brand h1{font-size:14px}#hint{font-size:9px;letter-spacing:.12em}}
  #fail{position:fixed;inset:0;display:none;place-items:center;background:#05060a;color:#c98262;font-size:13px;letter-spacing:.08em;text-align:center;padding:30px;}
</style>
</head>
<body>
<div id="vignette" class="overlay"></div>
<div id="brand" class="overlay"><h1>NOCTURNE&nbsp;CITY</h1><p>procedural metropolis · three.js · seed <span id="seedLabel">—</span></p></div>
<div id="hud" class="overlay">
  <div><b id="fps">--</b> fps</div>
  <div><b id="nBld">-</b> buildings</div>
  <div><b id="nCar">-</b> vehicles</div>
  <div><b id="nWin">-</b> lit windows</div>
</div>
<div id="hint" class="overlay"><em>drag</em>&nbsp;orbit&nbsp;&nbsp;·&nbsp;&nbsp;<em>scroll / pinch</em>&nbsp;zoom&nbsp;&nbsp;·&nbsp;&nbsp;<em>?seed=n</em>&nbsp;new city&nbsp;&nbsp;·&nbsp;&nbsp;idle resumes autopilot</div>
<div id="fail"><div>This piece needs WebGL.<br>Please open it in a modern desktop or mobile browser.</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   NOCTURNE CITY — a living procedural city at night
   Single-file Three.js scene. Everything below is generated:
   street grid, facades, window lights, traffic, neon, beacons.
   ============================================================ */
(function(){
'use strict';

/* ---------- seed ---------- */
var qs = (function(){ try{ return new URLSearchParams(location.search); }catch(e){ return {get:function(){return null;}}; } })();
var seedStr = qs.get('seed');
var SEED = seedStr ? (parseInt(seedStr,10)||1337) : (1+Math.floor(Math.random()*99998));
document.getElementById('seedLabel').textContent = String(SEED);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
var rnd = mulberry32(SEED);
function rr(a,b){ return a+(b-a)*rnd(); }
function ri(a,b){ return Math.floor(rr(a,b+1)); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ---------- renderer / scene ---------- */
var renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
}catch(e){
  document.getElementById('fail').style.display='grid';
  return;
}
var DPR = Math.min(window.devicePixelRatio||1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);
var MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a14, 0.00305);

var camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 4200);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x2a3a5e, 0x05060a, 0.55));
var moonLight = new THREE.DirectionalLight(0x93a7d8, 0.32);
moonLight.position.set(-620, 520, -780);
scene.add(moonLight);

/* ---------- sky dome ---------- */
var sky = new THREE.Mesh(
  new THREE.SphereGeometry(1950, 32, 18),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{
      uZenith:{value:new THREE.Color(0x01030a)},
      uMid:{value:new THREE.Color(0x0a142a)},
      uHorizon:{value:new THREE.Color(0x18223c)},
      uGlow:{value:new THREE.Color(0x58301a)}
    },
    vertexShader:[
      'varying vec3 vW;',
      'void main(){ vW=(modelMatrix*vec4(position,1.)).xyz;',
      ' gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }'
    ].join('\n'),
    fragmentShader:[
      'varying vec3 vW;',
      'uniform vec3 uZenith,uMid,uHorizon,uGlow;',
      'void main(){',
      ' vec3 d=normalize(vW-cameraPosition);',
      ' float h=clamp(d.y,0.,1.);',
      ' vec3 col=mix(uHorizon,uMid,smoothstep(0.,.16,h));',
      ' col=mix(col,uZenith,smoothstep(.10,.55,h));',
      ' float g=pow(max(0.,1.-h),7.5);',
      ' col+=uGlow*g*.75;',
      ' col+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)*(1.6/255.);',
      ' gl_FragColor=vec4(col,1.);}'
    ].join('\n')
  })
);
scene.add(sky);

/* ---------- little canvas-texture helpers ---------- */
function cnv(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function ctex(c, srgb){
  var t=new THREE.CanvasTexture(c);
  t.anisotropy=MAX_ANISO;
  if(srgb!==false) t.encoding=THREE.sRGBEncoding;
  return t;
}
function radialTex(size, stops){
  var c=cnv(size,size), x=c.getContext('2d');
  var g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0],stops[i][1]);
  x.fillStyle=g; x.fillRect(0,0,size,size);
  return ctex(c);
}
var glowTex   = radialTex(128, [[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);
var poolTex   = radialTex(256, [[0,'rgba(255,255,255,.85)'],[0.5,'rgba(255,255,255,.28)'],[1,'rgba(255,255,255,0)']]);
var dotTex    = radialTex(64,  [[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,.8)'],[1,'rgba(255,255,255,0)']]);
var headTex   = radialTex(128, [[0,'rgba(255,255,255,1)'],[0.18,'rgba(255,244,214,.85)'],[0.5,'rgba(255,238,200,.22)'],[1,'rgba(255,238,200,0)']]);
var tailTex   = radialTex(128, [[0,'rgba(255,120,90,1)'],[0.3,'rgba(255,60,40,.6)'],[1,'rgba(255,40,30,0)']]);

/* ---------- geometry merge helper ---------- */
function mergeGeos(list){
  if(list.length===1) return list[0];
  var vc=0, ic=0, i;
  for(i=0;i<list.length;i++){ vc+=list[i].attributes.position.count; ic+=list[i].index.count; }
  var pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uv=new Float32Array(vc*2);
  var idx = vc>65535 ? new Uint32Array(ic) : new Uint16Array(ic);
  var vo=0, io=0;
  for(i=0;i<list.length;i++){
    var g=list[i];
    pos.set(g.attributes.position.array, vo*3);
    nor.set(g.attributes.normal.array, vo*3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array, vo*2);
    var gi=g.index.array;
    for(var j=0;j<gi.length;j++) idx[io+j]=gi[j]+vo;
    vo+=g.attributes.position.count; io+=gi.length;
  }
  var out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}

/* ============================================================
   GROUND — one big canvas-painted plane: asphalt, sidewalks,
   lane dashes, crosswalks, parks, grime.
   ============================================================ */
var GRID=13, BLOCK=30, STREET=12, SIDEWALK=3, PITCH=BLOCK+STREET;
var SIZE=GRID*PITCH+STREET, HALF=SIZE/2;

function buildGroundTexture(){
  var PX=2048, c=cnv(PX,PX), x=c.getContext('2d');
  var s=PX/SIZE;
  function W(v){ return v*s; }                       // world → px
  x.fillStyle='#141519'; x.fillRect(0,0,PX,PX);      // asphalt

  // grime patches
  for(var gp=0; gp<900; gp++){
    x.fillStyle='rgba('+ri(0,30)+','+ri(0,30)+','+ri(5,40)+',0.06)';
    x.beginPath(); x.arc(rnd()*PX, rnd()*PX, rr(3,16)*s*2, 0, 7); x.fill();
  }
  // speckle
  for(var sp=0; sp<5200; sp++){
    var l=rnd()<0.5;
    x.fillStyle=l?'rgba(255,255,255,0.035)':'rgba(0,0,0,0.05)';
    x.fillRect(rnd()*PX, rnd()*PX, rr(1,2.4), rr(1,2.4));
  }

  var parkSet={};
  var nParks=0;
  while(nParks<7){ var pi=ri(0,GRID-1), pj=ri(0,GRID-1);
    var dx=(pi-(GRID-1)/2)/(GRID/2), dz=(pj-(GRID-1)/2)/(GRID/2);
    if(Math.hypot(dx,dz)>0.32 && !parkSet[pi+'_'+pj]){ parkSet[pi+'_'+pj]=true; nParks++; } }
  window.__parks = parkSet;

  // block plates
  for(var i=0;i<GRID;i++) for(var j=0;j<GRID;j++){
    var bx=W(-HALF+STREET+i*PITCH), bz=W(-HALF+STREET+j*PITCH), bs=W(BLOCK);
    if(parkSet[i+'_'+j]){
      x.fillStyle='#0e2016'; x.fillRect(bx,bz,bs,bs);
      x.strokeStyle='rgba(30,60,40,.5)'; x.lineWidth=2; x.strokeRect(bx+2,bz+2,bs-4,bs-4);
      // paths
      x.fillStyle='rgba(70,74,66,.35)';
      x.fillRect(bx, bz+bs/2-W(1.6), bs, W(3.2));
      x.fillRect(bx+bs/2-W(1.6), bz, W(3.2), bs);
    }else{
      x.fillStyle='#212329'; x.fillRect(bx,bz,bs,bs);                 // sidewalk
      x.strokeStyle='rgba(8,9,12,.9)'; x.lineWidth=2.5; x.strokeRect(bx+1,bz+1,bs-2,bs-2); // curb
      x.fillStyle='#16171c';                                          // inner lot
      x.fillRect(bx+W(SIDEWALK),bz+W(SIDEWALK),bs-2*W(SIDEWALK),bs-2*W(SIDEWALK));
    }
  }

  // lane edge lines + dashes
  function streetLines(fixed, horiz){
    var k;
    for(k=0;k<=GRID;k++){
      var cc=W(-HALF+STREET/2+k*PITCH);
      x.strokeStyle='rgba(70,73,82,.4)'; x.lineWidth=1.4; x.setLineDash([]);
      x.beginPath();
      if(horiz){ x.moveTo(W(-HALF),cc-W(STREET/2-1)); x.lineTo(W(HALF),cc-W(STREET/2-1));
                 x.moveTo(W(-HALF),cc+W(STREET/2-1)); x.lineTo(W(HALF),cc+W(STREET/2-1)); }
      else     { x.moveTo(cc-W(STREET/2-1),W(-HALF)); x.lineTo(cc-W(STREET/2-1),W(HALF));
                 x.moveTo(cc+W(STREET/2-1),W(-HALF)); x.lineTo(cc+W(STREET/2-1),W(HALF)); }
      x.stroke();
      // centre dashes between intersections
      x.strokeStyle='rgba(150,138,84,.5)'; x.lineWidth=2; x.setLineDash([W(3),W(4)]);
      for(var b=0;b<GRID;b++){
        var a0=-HALF+STREET+b*PITCH+2.2, a1=a0+BLOCK-4.4;
        x.beginPath();
        if(horiz){ x.moveTo(W(a0),cc); x.lineTo(W(a1),cc); } else { x.moveTo(cc,W(a0)); x.lineTo(cc,W(a1)); }
        x.stroke();
      }
      x.setLineDash([]);
    }
  }
  streetLines(null,true); streetLines(null,false);

  // crosswalks
  x.fillStyle='rgba(168,172,182,.4)';
  for(var ci=0;ci<=GRID;ci++) for(var cj=0;cj<=GRID;cj++){
    var cx=W(-HALF+STREET/2+ci*PITCH), cz=W(-HALF+STREET/2+cj*PITCH), hw=W(STREET/2);
    for(var b2=0;b2<5;b2++){
      var o=-hw+W(1.6)+b2*W(1.9);
      x.fillRect(cx+o, cz-hw-W(2.4), W(1.1), W(2.1));   // north side
      x.fillRect(cx+o, cz+hw+W(0.3), W(1.1), W(2.1));   // south
      x.fillRect(cx-hw-W(2.4), cz+o, W(2.1), W(1.1));   // west
      x.fillRect(cx+hw+W(0.3), cz+o, W(2.1), W(1.1));   // east
    }
  }

  var t=ctex(c); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  return t;
}
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(SIZE,SIZE),
  new THREE.MeshLambertMaterial({map:buildGroundTexture()})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// apron beyond city fading into fog
var apron = new THREE.Mesh(
  new THREE.PlaneGeometry(4200,4200),
  new THREE.MeshBasicMaterial({color:0x05070c})
);
apron.rotation.x=-Math.PI/2; apron.position.y=-0.25;
scene.add(apron);

/* ============================================================
   FACADE MATERIALS — canvas diffuse + emissive pairs.
   A handful of variants are shared; windows toggle at runtime.
   ============================================================ */
var CW=128, CH=256, CELL=16;                    // 8 cols × 16 rows
var COLS=CW/CELL, ROWS=CH/CELL;
var windowVariants=[];

function makeFacade(opt){
  var dc=cnv(CW,CH), ec=cnv(CW,CH);
  var d=dc.getContext('2d'), e=ec.getContext('2d');
  // facade base with faint banding
  d.fillStyle=opt.base; d.fillRect(0,0,CW,CH);
  d.fillStyle='rgba(0,0,0,.28)';
  for(var r=0;r<ROWS;r++) d.fillRect(0,r*CELL+CELL-2,CW,2);
  d.fillStyle='rgba(255,255,255,.03)';
  for(var v=0;v<COLS;v++) d.fillRect(v*CELL,0,1,CH);
  e.fillStyle='#000'; e.fillRect(0,0,CW,CH);

  var cells=[];
  for(var r2=0;r2<ROWS;r2++){
    for(var c2=0;c2<COLS;c2++){
      var px=c2*CELL, py=r2*CELL;
      var lit = rnd()<opt.litProb;
      var col = pick(opt.pal);
      if(lit){ col = shade(col, rr(0.75,1.15)); }
      paintCell(d,e,px,py,opt,lit,col,false);
      cells.push({x:px,y:py,lit:lit,col:col});
    }
  }
  var td=ctex(dc), te=ctex(ec);
  td.wrapS=td.wrapT=THREE.RepeatWrapping; te.wrapS=te.wrapT=THREE.RepeatWrapping;
  var mat=new THREE.MeshLambertMaterial({
    map:td, emissive:new THREE.Color(0xffffff), emissiveMap:te, emissiveIntensity:1.15,
    color:0xbbbbbb
  });
  var vrec={mat:mat, d:d, e:e, cells:cells, td:td, te:te, dc:dc, ec:ec, opt:opt};
  windowVariants.push(vrec);
  return vrec;
}
function shade(hex,k){
  var c=new THREE.Color(hex); c.r=clamp(c.r*k,0,1); c.g=clamp(c.g*k,0,1); c.b=clamp(c.b*k,0,1);
  return '#'+c.getHexString();
}
function paintCell(d,e,px,py,opt,lit,col,forceOff){
  var m=3;
  d.fillStyle='#0d1017'; d.fillRect(px+m,py+m,CELL-2*m,CELL-2*m-1);
  d.fillStyle='rgba(120,140,170,.10)'; d.fillRect(px+m,py+m,CELL-2*m,1);
  if(lit && !forceOff){
    d.fillStyle=col; d.fillRect(px+m,py+m,CELL-2*m,CELL-2*m-1);
    e.fillStyle=col; e.fillRect(px+m,py+m,CELL-2*m,CELL-2*m-1);
  }else{
    e.fillStyle='#000'; e.fillRect(px+m,py+m,CELL-2*m,CELL-2*m-1);
  }
}
var PAL_OFFICE=['#dff1ff','#bcd9ff','#9fc2ef','#f2faff'];
var PAL_MIXED =['#ffd9a3','#ffe9c4','#cfe0ff','#ffce8a'];
var PAL_RES   =['#ffb469','#ffd28a','#f0954a','#ffedb8'];
var variants={
  officeA:  makeFacade({base:'#10151d', pal:PAL_OFFICE, litProb:.60, ws:3.4}),
  officeB:  makeFacade({base:'#0d1219', pal:PAL_OFFICE, litProb:.44, ws:3.4}),
  officeC:  makeFacade({base:'#141a24', pal:PAL_OFFICE, litProb:.52, ws:3.6}),
  mixedA:   makeFacade({base:'#17161a', pal:PAL_MIXED,  litProb:.42, ws:3.0}),
  mixedB:   makeFacade({base:'#1a181c', pal:PAL_MIXED,  litProb:.36, ws:3.0}),
  mixedC:   makeFacade({base:'#12161d', pal:PAL_MIXED,  litProb:.48, ws:3.2}),
  resA:     makeFacade({base:'#1a1512', pal:PAL_RES,    litProb:.26, ws:2.6}),
  resB:     makeFacade({base:'#181310', pal:PAL_RES,    litProb:.20, ws:2.6}),
  resC:     makeFacade({base:'#151217', pal:PAL_RES,    litProb:.30, ws:2.8})
};
function variantFor(h, f){          // f = centrality 0..1
  if(h>=70) return pick([variants.officeA,variants.officeB,variants.officeC]);
  if(h>=34) return rnd()<0.5+f*0.3 ? pick([variants.mixedA,variants.mixedC]) : variants.officeB;
  return rnd()<clamp(f*1.4-0.25,0.12,0.75) ? pick([variants.mixedA,variants.mixedB]) : pick([variants.resA,variants.resB,variants.resC]);
}

/* building box with window-tiled UVs; roof samples a clean facade pixel */
function buildingGeo(w,h,d,ws){
  var g=new THREE.BoxGeometry(w,h,d);
  var ru=Math.max(1,Math.round(w/ws)), rv=Math.max(1,Math.round(h/ws)), rd=Math.max(1,Math.round(d/ws));
  var uv=g.attributes.uv;
  var sc=[[rd,rv],[rd,rv],null,null,[ru,rv],[ru,rv]];
  for(var f=0;f<6;f++) for(var v=0;v<4;v++){
    var i=f*4+v;
    if(sc[f]) uv.setXY(i, uv.getX(i)*sc[f][0], uv.getY(i)*sc[f][1]);
    else      uv.setXY(i, 0.015, 0.985);
  }
  return g;
}

/* ============================================================
   CITY GENERATION
   ============================================================ */
var buckets=new Map();            // variantRec → geometry list
var propsGeos=[], antGeos=[], bulbGeos=[], treeGeos=[];
var beaconPts=[], lampGlow=[], lampPool=[];
var billboards=[], neonStrips=[];
var placements=[];   // populated by addBuilding (billboards / neon / searchlights mount here)
var buildingCount=0, litWindows=0;
var poleGeos=[], armGeos=[];

function pushBuildingGeo(vrec,g){ if(!buckets.has(vrec)) buckets.set(vrec,[]); buckets.get(vrec).push(g); }

function addBuilding(cx,cz,w,h,d,vrec){
  var g=buildingGeo(w,h,d, vrec.opt.ws||3.2);
  g.translate(cx,h/2,cz);
  pushBuildingGeo(vrec,g);
  buildingCount++;
  var litFrac=vrec.opt.litProb;
  litWindows += Math.round(Math.round(w/(vrec.opt.ws||3.2))*Math.round(h/(vrec.opt.ws||3.2))*2*litFrac*0.9);

  // rooftop props
  if(h>=16 && rnd()<0.75){
    var n=ri(1,3);
    for(var k=0;k<n;k++){
      var bw=rr(1.4,3.6), bh=rr(1,2.6), bd=rr(1.4,3);
      var pg=new THREE.BoxGeometry(bw,bh,bd);
      pg.translate(cx+rr(-w/2+2,w/2-2), h+bh/2, cz+rr(-d/2+2,d/2-2));
      propsGeos.push(pg);
    }
  }
  if(h>=16 && h<=46 && rnd()<0.3){
    var tg=new THREE.CylinderGeometry(1.1,1.25,2.6,8);
    tg.translate(cx+rr(-w/2+2.5,w/2-2.5), h+1.3, cz+rr(-d/2+2.5,d/2-2.5));
    propsGeos.push(tg);
  }
  // crown tier
  var topY=h;
  if(h>76 && rnd()<0.65){
    var cw=w*0.66, ch=h*rr(0.14,0.26), cd=d*0.66;
    var cg=buildingGeo(cw,ch,cd, vrec.opt.ws||3.2);
    cg.translate(cx,h+ch/2,cz);
    pushBuildingGeo(vrec,cg);
    topY=h+ch;
  }
  // antenna + aviation beacon
  if(topY>88 || (topY>52 && rnd()<0.35)){
    var ah=rr(6,14);
    var ag=new THREE.CylinderGeometry(0.1,0.16,ah,5);
    ag.translate(cx+rr(-2,2), topY+ah/2, cz+rr(-2,2));
    antGeos.push(ag);
    beaconPts.push(cx, topY+ah+0.5, cz);
  }
  var rec={x:cx,z:cz,w:w,d:d,h:h,topY:topY};

(function generateCity(){
  for(var i=0;i<GRID;i++) for(var j=0;j<GRID;j++){
    var bx=-HALF+STREET+i*PITCH+BLOCK/2;
    var bz=-HALF+STREET+j*PITCH+BLOCK/2;
    var dist=Math.hypot(bx,bz)/HALF;
    var f=Math.pow(clamp(1-dist,0,1),1.7);           // centrality
    if(window.__parks[i+'_'+j]){
      // park trees + lamps
      var nt=ri(4,7);
      for(var tt=0;tt<nt;tt++){
        var tx=bx+rr(-10,10), tz=bz+rr(-10,10), tr=rr(1.4,2.6), th=tr*rr(1.5,2.2);
        var cg=new THREE.SphereGeometry(tr,7,6);

        treeGeos.push(cg);
        var tg2=new THREE.CylinderGeometry(0.22,0.3,th*0.8,5);
        tg2.translate(tx,th*0.4,tz);
        propsGeos.push(tg2);
      }
      addLamp(bx-8,bz,1,0); addLamp(bx+8,bz,-1,0);
      continue;
    }
    var U=BLOCK-2*SIDEWALK;                          // usable 24
    var roll=rnd();
    var pattern;
    if(f>0.55)      pattern = roll<0.7?'tower':(roll<0.9?'dual':'quad');
    else if(f>0.22) pattern = roll<0.4?'tower':(roll<0.75?'dual':'quad');
    else            pattern = roll<0.25?'towerLow':(roll<0.6?'dual':'quad');

    function H(base){ return clamp(base*(0.35+rnd()*0.95), 6.5, 150); }
    var hBase=8+f*132;

    if(pattern==='tower'){
      var big=f>0.6;
      var w=big?rr(13,21):rr(12,U), d=big?rr(13,21):rr(12,U);
      if(big){ var sc=Math.sqrt(clamp(150/Math.max(60,H(hBase)),0.4,1)); w*=sc; d*=sc; }
      var h=big?clamp(H(hBase),46,150):H(hBase*0.75);
      addBuilding(bx+rr(-1.5,1.5), bz+rr(-1.5,1.5), w, h, d, variantFor(h,f));
    }
    else if(pattern==='towerLow'){
      addBuilding(bx+rr(-2,2), bz+rr(-2,2), rr(11,U), H(16), rr(11,U), variantFor(16,f));
    }
    else if(pattern==='dual'){
      var vert=rnd()<0.5;
      for(var s2=0;s2<2;s2++){
        var cw2=vert?(U-3)/2:U-rr(0,4);
        var cd2=vert?U-rr(0,4):(U-3)/2;
        var ox=vert?-U/4+0.75*s2*(U/2):0;
        var oz=vert?0:-U/4+0.75*s2*(U/2);
        var hh=s2===0?H(hBase*0.62):H(hBase*0.5);
        addBuilding(bx+ox+rr(-1,1), bz+oz+rr(-1,1), cw2, hh, cd2, variantFor(hh,f));
      }
    }
    else{ // quad — perimeter shops
      var q=(U-3)/2;
      var offs=[[-q/2-0.75,-q/2-0.75],[q/2+0.75,-q/2-0.75],[-q/2-0.75,q/2+0.75],[q/2+0.75,q/2+0.75]];
      for(var q4=0;q4<4;q4++){

})();

/* ---------- attach billboards & neon strips to captured buildings ---------- */
function mountBillboardsAndNeon(placements){
  var usedBB=0, usedNS=0;
  var shuffled=placements.slice().sort(function(){return rnd()-0.5;});
  for(var i=0;i<shuffled.length;i++){
    var b=shuffled[i];
    if(b.h<24 || b.h>110) continue;
    // billboard on a street-facing wall
    if(usedBB<9 && b.h>=34 && rnd()<0.5){
      usedBB++;
      var word=pick(WORDS), color=pick(NEON);
      var bw=clamp(Math.min(b.w,b.d)*0.8, 6, 14), bh=bw*0.5;
      var side=ri(0,3);
      var nrm=[[0,1],[0,-1],[1,0],[-1,0]][side];
      var px=b.x+nrm[0]*( (nrm[0]? b.w:b.d)/2 +0.25);
      var pz=b.z+nrm[1]*( (nrm[0]? b.w:b.d)/2 +0.25);
      var mesh=new THREE.Mesh(new THREE.PlaneGeometry(bw,bh),
        new THREE.MeshBasicMaterial({map:billboardTexture(word,color)}));
      mesh.position.set(px, b.h*rr(0.5,0.72), pz);
      mesh.rotation.y = nrm[0]===1?Math.PI/2 : nrm[0]===-1?-Math.PI/2 : nrm[1]===1?0:Math.PI;
      scene.add(mesh);
      var mode = rnd()<0.4?'hue':(rnd()<0.6?'flicker':'static');
      billboards.push({mat:mesh.material, base:new THREE.Color(color), mode:mode, off:rnd()*10, on:true, tk:0});
    }
    // vertical neon strip on a corner
    if(usedNS<14 && b.h>=22 && b.h<=70 && rnd()<0.45){
      usedNS++;
      var color2=pick(NEON);
      var sh=b.h*rr(0.55,0.85);
      var sx=b.x+(rnd()<0.5?-1:1)*b.w/2, sz=b.z+(rnd()<0.5?-1:1)*b.d/2;
      var strip=new THREE.Mesh(new THREE.BoxGeometry(0.3,sh,0.3),
        new THREE.MeshBasicMaterial({color:new THREE.Color(color2)}));
      strip.position.set(sx, b.h*0.5+sh*0.06, sz);
      var glow=new THREE.Mesh(new THREE.BoxGeometry(0.9,sh,0.9),
        new THREE.MeshBasicMaterial({color:new THREE.Color(color2), transparent:true, opacity:.22,
          blending:THREE.AdditiveBlending, depthWrite:false}));
      glow.position.copy(strip.position);
      scene.add(strip); scene.add(glow);
      neonStrips.push({core:strip.material, glow:glow.material, base:new THREE.Color(color2),
        sp:rr(1.2,2.6), ph:rnd()*7, flick:rnd()<0.25, on:true, tk:0});
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  T+=dt;
  beaconUniform.uT.value=T;

  /* camera */
  var idleFor=performance.now()-lastPoke;
  if(idleFor>4000) ctl.taz+=dt*0.031;                     // autopilot
  var k=1-Math.exp(-dt*4.2);
  ctl.az+=(ctl.taz-ctl.az)*k; ctl.pol+=(ctl.tpol-ctl.pol)*k; ctl.rad+=(ctl.trad-ctl.rad)*k;
  var cy=Math.max(Math.cos(ctl.pol)*ctl.rad, 7);
  camera.position.set(Math.sin(ctl.pol)*Math.sin(ctl.az)*ctl.rad, cy, Math.sin(ctl.pol)*Math.cos(ctl.az)*ctl.rad);
  camera.lookAt(ctl.tx,ctl.ty,ctl.tz);

  /* cars */
  for(var i=0;i<CAR_N;i++){
    var car=cars[i];
    car.s+=car.v*dt*(0.92+0.08*Math.sin(T*0.7+car.wob));
    if(car.s> HALF+6) car.s=-HALF-6;
    if(car.s<-HALF-6) car.s=HALF+6;
    var x,z,yaw,fx,fz;
    if(car.axis==='x'){ x=car.s; z=car.c-car.dir*2.7; fx=car.dir; fz=0; yaw=car.dir>0?0:Math.PI; }
    else              { x=car.c+car.dir*2.7; z=car.s; fx=0; fz=car.dir; yaw=car.dir>0?-Math.PI/2:Math.PI/2; }
    dummy.position.set(x,0,z); dummy.rotation.set(0,yaw,0);
    dummy.updateMatrix();
    carMesh.setMatrixAt(i,dummy.matrix);
    var sx=fz, sz2=-fx;                                    // lateral
    var hx=x+fx*2.3, hz=z+fz*2.3, tx2=x-fx*2.3, tz2=z-fz*2.3;
    var o=i*6;
    headArr[o]=hx+sx*0.72; headArr[o+1]=0.78; headArr[o+2]=hz+sz2*0.72;
    headArr[o+3]=hx-sx*0.72; headArr[o+4]=0.78; headArr[o+5]=hz-sz2*0.72;
    tailArr[o]=tx2+sx*0.8; tailArr[o+1]=0.8; tailArr[o+2]=tz2+sz2*0.8;
    tailArr[o+3]=tx2-sx*0.8; tailArr[o+4]=0.8; tailArr[o+5]=tz2-sz2*0.8;
  }
  carMesh.instanceMatrix.needsUpdate=true;
  headGeo.attributes.position.needsUpdate=true;
  tailGeo.attributes.position.needsUpdate=true;

  /* living windows */
  toggleAcc+=dt;

    toggleAcc=0;

    var cell=v.cells[ri(0,v.cells.length-1)];

    if(cell.lit) cell.col=shade(pick(v.opt.pal), rr(0.75,1.1));
    paintCell(v.d,v.e,cell.x,cell.y,v.opt,cell.lit,cell.col,false);
    v.td.needsUpdate=true; v.te.needsUpdate=true;
  }

  /* neon strips */
  for(var ns=0;ns<neonStrips.length;ns++){
    var st=neonStrips[ns];
    if(st.flick){ st.tk-=dt; if(st.tk<=0){ st.on=!st.on||rnd()<0.7; st.tk=rr(0.05,0.5);} }
    var w=st.on?(0.55+0.45*Math.sin(T*st.sp+st.ph)):0.04;
    st.core.color.copy(st.base).multiplyScalar(w);
    st.glow.opacity=0.22*w;
  }
  /* billboards */
  for(var bb=0;bb<billboards.length;bb++){
    var b2=billboards[bb];
    if(b2.mode==='hue') b2.mat.color.setHSL((T*0.03+b2.off)%1, 0.85, 0.62);
    else if(b2.mode==='flicker'){
      b2.tk-=dt; if(b2.tk<=0){ b2.on=rnd()>0.18; b2.tk=rr(0.06,0.7); }
      b2.mat.color.copy(b2.base).multiplyScalar(b2.on?1:0.08);
    }
  }
  /* searchlights */
  for(var sl2=0;sl2<searchlights.length;sl2++){
    var s3=searchlights[sl2];
    s3.grp.rotation.y=T*0.34+s3.ph;
    s3.grp.children[0].rotation.z=0.5+0.14*Math.sin(T*0.47+s3.ph*1.7);
  }
  /* airplane */
  var pp=(T%64)/64;
  planeGrp.position.lerpVectors(planeA,planeB,pp);
  planeStrobe.material.opacity=((T*2.4)%1<0.07)?1:0;
  planeSteady.material.opacity=0.5;
  /* stars breathe */
  window.__stars.material.opacity=0.78+0.14*Math.sin(T*0.8);

  renderer.render(scene,camera);

  /* HUD + adaptive DPR */
  frames++; fpsT+=dt;
  if(fpsT>=0.5){
    var fps=Math.round(frames/fpsT); frames=0; fpsT=0;
    fpsEl.textContent=fps;
    if(!dprReduced){
      if(fps<26) lowFpsT+=0.5; else lowFpsT=0;
      if(lowFpsT>=3 && DPR>1){ DPR=1; renderer.setPixelRatio(1); dprReduced=true; }
    }
  }
}
animate();

/* HUD numbers */
document.getElementById('nBld').textContent=buildingCount;
document.getElementById('nCar').textContent=CAR_N;
document.getElementById('nWin').textContent='~'+litWindows.toLocaleString();

console.log('[NOCTURNE CITY] ready — seed '+SEED+', '+buildingCount+' buildings, '+CAR_N+' vehicles, '+lampGlow.length/3+' street lamps.');
window.__city={ready:true, seed:SEED, buildings:buildingCount};
})();
</script>
