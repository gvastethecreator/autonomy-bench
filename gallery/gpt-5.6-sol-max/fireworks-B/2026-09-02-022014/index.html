<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03050d">
  <title>Midnight in Bloom — A Fireworks Nocturne</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3efe5;
      --muted: rgba(232, 231, 225, 0.58);
      --hairline: rgba(255, 255, 255, 0.14);
      --glass: rgba(8, 12, 25, 0.42);
      --gold: #e9c98a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #03050d;
    }

    body {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button { font: inherit; }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 105%, rgba(24, 55, 90, 0.32), transparent 44%),
        linear-gradient(#02040c, #081128 68%, #03040a);
    }

    #sky {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 0;
    }

    .atmosphere,
    .grain,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .atmosphere {
      z-index: 1;
      opacity: .8;
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse at 18% 36%, rgba(92, 67, 168, 0.08), transparent 28%),
        radial-gradient(ellipse at 82% 17%, rgba(40, 97, 156, 0.08), transparent 32%);
    }

    .grain {
      z-index: 2;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
    }

    .vignette {
      z-index: 3;
      box-shadow: inset 0 0 180px 36px rgba(0, 0, 0, .58);
    }

    .chrome {
      position: absolute;
      z-index: 5;
      inset: 0;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: clamp(22px, 4vw, 54px);
      left: clamp(22px, 4.5vw, 72px);
      right: clamp(22px, 4.5vw, 72px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(247, 244, 236, .72);
    }

    .brand,
    .live,
    .clock {
      display: flex;
      align-items: center;
    }

    .brand { gap: 11px; }

    .brand-mark {
      position: relative;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(233, 201, 138, .65);
      border-radius: 50%;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      transform: translate(-50%, -50%);
      box-shadow: 0 -7px 0 -1px var(--gold), 0 7px 0 -1px var(--gold), 7px 0 0 -1px var(--gold), -7px 0 0 -1px var(--gold);
    }

    .brand-mark::after {
      width: 1px;
      height: 1px;
      box-shadow: 5px 5px 0 var(--gold), -5px 5px 0 var(--gold), 5px -5px 0 var(--gold), -5px -5px 0 var(--gold);
    }

    .live { gap: 18px; }

    .live-state {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #edc589;
      box-shadow: 0 0 10px rgba(237, 197, 137, .9);
      animation: breathe 2.4s ease-in-out infinite;
    }

    .clock {
      min-width: 47px;
      justify-content: flex-end;
      font-variant-numeric: tabular-nums;
      color: rgba(247, 244, 236, .42);
    }

    @keyframes breathe {
      0%, 100% { opacity: .38; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .intro {
      position: absolute;
      top: 20%;
      left: clamp(24px, 8vw, 128px);
      width: min(560px, 76vw);
      text-shadow: 0 2px 36px rgba(0, 0, 0, .82);
      transition: opacity 1.8s ease, transform 1.8s cubic-bezier(.2,.7,.2,1);
    }

    .intro.recede {
      opacity: .2;
      transform: translateY(-12px);
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .31em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, rgba(233, 201, 138, .1), var(--gold));
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(58px, 8.1vw, 132px);
      line-height: .77;
      letter-spacing: -.07em;
    }

    h1 span {
      display: block;
      margin-left: .52em;
      font-style: italic;
      color: transparent;
      -webkit-text-stroke: 1px rgba(245, 239, 225, .68);
    }

    .subhead {
      width: min(340px, 70vw);
      margin: 34px 0 0 3px;
      color: rgba(240, 237, 228, .6);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-style: italic;
      line-height: 1.6;
      letter-spacing: .035em;
    }

    .movement {
      position: absolute;
      top: 34%;
      right: clamp(22px, 4.5vw, 72px);
      display: grid;
      grid-template-columns: auto 1px;
      gap: 17px;
      min-height: 110px;
      text-align: right;
      transition: opacity .5s ease;
    }

    .movement-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .movement-label {
      font-size: 8px;
      font-weight: 650;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(239, 233, 221, .38);
    }

    #movementName {
      max-width: 160px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.25;
      color: rgba(247, 241, 229, .82);
    }

    .movement-index {
      color: rgba(233, 201, 138, .58);
      font-size: 9px;
      letter-spacing: .16em;
    }

    .movement-line {
      position: relative;
      width: 1px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }

    .movement-line::after {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: var(--progress, 20%);
      background: linear-gradient(var(--gold), rgba(233, 201, 138, .15));
      transition: height .12s linear;
      box-shadow: 0 0 8px rgba(233, 201, 138, .28);
    }

    .footer {
      position: absolute;
      left: clamp(22px, 4.5vw, 72px);
      right: clamp(22px, 4.5vw, 72px);
      bottom: clamp(22px, 4vw, 48px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
    }

    .prompt {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(244, 240, 229, .42);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .target {
      position: relative;
      width: 23px;
      height: 23px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 50%;
    }

    .target::before,
    .target::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255, 255, 255, .32);
      transform: translate(-50%, -50%);
    }

    .target::before { width: 29px; height: 1px; }
    .target::after { width: 1px; height: 29px; }

    .controls {
      display: flex;
      align-items: stretch;
      pointer-events: auto;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: rgba(7, 10, 20, .55);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .05);
      backdrop-filter: blur(18px) saturate(1.25);
    }

    .control {
      position: relative;
      min-width: 45px;
      height: 42px;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, .09);
      padding: 0 15px;
      background: transparent;
      color: rgba(245, 241, 232, .74);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      transition: color .2s ease, background .2s ease;
    }

    .control:last-child { border-right: 0; }
    .control:hover { color: #fffaf0; background: rgba(255, 255, 255, .07); }
    .control:focus-visible { outline: 1px solid var(--gold); outline-offset: -3px; }

    .control svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .control span {
      font-size: 8px;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    #finaleBtn {
      padding-inline: 18px 20px;
      color: #eacb91;
    }

    .corner {
      position: absolute;
      width: 25px;
      height: 25px;
      opacity: .25;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: #fff;
    }

    .corner::before { width: 25px; height: 1px; }
    .corner::after { width: 1px; height: 25px; }
    .corner.tl { top: 16px; left: 16px; }
    .corner.tr { top: 16px; right: 16px; transform: rotate(90deg); }
    .corner.br { right: 16px; bottom: 16px; transform: rotate(180deg); }
    .corner.bl { left: 16px; bottom: 16px; transform: rotate(270deg); }

    .toast {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: 112px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(5, 8, 18, .64);
      color: rgba(245, 241, 230, .72);
      backdrop-filter: blur(14px);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .15em;
      text-transform: uppercase;
      transform: translate(-50%, 14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 720px) {
      .topbar { top: 25px; }
      .brand-copy { display: none; }
      .live { gap: 10px; }
      .intro { top: 19%; left: 25px; width: calc(100vw - 50px); }
      h1 { font-size: clamp(52px, 19vw, 86px); line-height: .82; }
      .movement { top: 56%; right: 24px; }
      .prompt span { display: none; }
      .control span { display: none; }
      #finaleBtn { padding-inline: 15px; }
      .footer { align-items: center; }
    }

    @media (max-height: 640px) {
      .intro { top: 18%; }
      .subhead { display: none; }
      .movement { top: 31%; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <canvas id="sky" aria-label="Interactive generative fireworks above a moonlit city"></canvas>
    <div class="atmosphere"></div>
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="chrome">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-copy">Nocturne / 01</span>
        </div>
        <div class="live">
          <span class="live-state"><i class="live-dot"></i><span id="liveText">Live performance</span></span>
          <span class="clock" id="clock">00:00</span>
        </div>
      </header>

      <main>
        <section class="intro" id="intro" aria-labelledby="title">
          <p class="kicker">A study in light</p>
          <h1 id="title">Midnight <span>in Bloom</span></h1>
          <p class="subhead">An endless pyrotechnic nocturne — composed in color, gravity, and fleeting light.</p>
        </section>

        <aside class="movement" aria-live="polite">
          <div class="movement-copy">
            <span class="movement-label">Current movement</span>
            <span id="movementName">First Light</span>
            <span class="movement-index" id="movementIndex">I / IV</span>
          </div>
          <span class="movement-line" id="movementLine"></span>
        </aside>
      </main>

      <footer class="footer">
        <div class="prompt"><i class="target"></i><span>Click the sky to paint with light</span></div>
        <nav class="controls" aria-label="Fireworks controls">
          <button class="control" id="pauseBtn" type="button" aria-label="Pause performance" title="Pause / resume (Space)">
            <svg id="pauseIcon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg>
          </button>
          <button class="control" id="soundBtn" type="button" aria-label="Turn sound on" title="Sound on / off (M)">
            <svg id="soundIcon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h2.3L9 3v10l-3.7-3H3zM12 6l3 4M15 6l-3 4"/></svg>
          </button>
          <button class="control" id="finaleBtn" type="button" title="Launch finale (F)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8v4.1M8 10.1v4.1M1.8 8h4.1M10.1 8h4.1M3.6 3.6l2.9 2.9M9.5 9.5l2.9 2.9M12.4 3.6 9.5 6.5M6.5 9.5l-2.9 2.9"/></svg>
            <span>Finale</span>
          </button>
        </nav>
      </footer>

      <i class="corner tl"></i><i class="corner tr"></i><i class="corner br"></i><i class="corner bl"></i>
    </div>
    <div class="toast" id="toast" role="status">Finale sequence</div>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d', { alpha: false });
      const intro = document.getElementById('intro');
      const clockEl = document.getElementById('clock');
      const movementName = document.getElementById('movementName');
      const movementIndex = document.getElementById('movementIndex');
      const movementLine = document.getElementById('movementLine');
      const pauseBtn = document.getElementById('pauseBtn');
      const pauseIcon = document.getElementById('pauseIcon');
      const soundBtn = document.getElementById('soundBtn');
      const soundIcon = document.getElementById('soundIcon');
      const finaleBtn = document.getElementById('finaleBtn');
      const liveText = document.getElementById('liveText');
      const toast = document.getElementById('toast');

      const TAU = Math.PI * 2;
      const SHOW_LENGTH = 48000;
      const palette = [
        { hue: 38,  sat: 92, light: 68 },
        { hue: 188, sat: 91, light: 68 },
        { hue: 328, sat: 88, light: 70 },
        { hue: 258, sat: 84, light: 72 },
        { hue: 8,   sat: 94, light: 68 },
        { hue: 108, sat: 75, light: 65 }
      ];

      const movements = [
        { from: 0,     to: 11500, name: 'First Light', index: 'I / IV' },
        { from: 11500, to: 24500, name: 'Chromatic Orbit', index: 'II / IV' },
        { from: 24500, to: 36500, name: 'Golden Rain', index: 'III / IV' },
        { from: 36500, to: 48000, name: 'Into the Infinite', index: 'IV / IV' }
      ];

      const cues = [
        { t: 250,   x: .72, y: .28, type: 'chrysanthemum', color: 2, size: .94 },
        { t: 1500,  x: .28, y: .34, type: 'peony',          color: 1, size: .78 },
        { t: 3400,  x: .55, y: .22, type: 'ring',           color: 0, size: .72 },
        { t: 5600,  x: .16, y: .28, type: 'palm',           color: 4, size: .76 },
        { t: 7600,  x: .82, y: .36, type: 'willow',         color: 0, size: .86 },
        { t: 9800,  x: .42, y: .27, type: 'peony',          color: 3, size: .84 },
        { t: 11700, x: .68, y: .23, type: 'ring',           color: 2, size: .72 },
        { t: 12800, x: .27, y: .31, type: 'ring',           color: 1, size: .68 },
        { t: 14300, x: .49, y: .19, type: 'chrysanthemum',  color: 3, size: .98 },
        { t: 15800, x: .84, y: .32, type: 'peony',          color: 4, size: .69 },
        { t: 17100, x: .14, y: .25, type: 'heart',          color: 2, size: .74 },
        { t: 18600, x: .64, y: .37, type: 'palm',           color: 1, size: .8 },
        { t: 20400, x: .34, y: .2,  type: 'chrysanthemum',  color: 5, size: .82 },
        { t: 22200, x: .76, y: .22, type: 'peony',          color: 2, size: .91 },
        { t: 24200, x: .47, y: .29, type: 'willow',         color: 0, size: 1.05 },
        { t: 25900, x: .17, y: .26, type: 'willow',         color: 0, size: .88 },
        { t: 27400, x: .78, y: .3,  type: 'willow',         color: 0, size: .92 },
        { t: 29100, x: .38, y: .19, type: 'palm',           color: 0, size: .91 },
        { t: 30700, x: .61, y: .23, type: 'willow',         color: 0, size: 1.02 },
        { t: 32400, x: .25, y: .36, type: 'chrysanthemum',  color: 4, size: .75 },
        { t: 34100, x: .82, y: .22, type: 'chrysanthemum',  color: 1, size: .8 },
        { t: 35900, x: .5,  y: .17, type: 'willow',         color: 0, size: 1.12 },
        { t: 37000, x: .12, y: .38, type: 'peony',          color: 3, size: .68 },
        { t: 37700, x: .88, y: .34, type: 'peony',          color: 2, size: .72 },
        { t: 38500, x: .3,  y: .22, type: 'ring',           color: 1, size: .78 },
        { t: 39100, x: .7,  y: .2,  type: 'ring',           color: 4, size: .79 },
        { t: 40000, x: .5,  y: .13, type: 'chrysanthemum',  color: 0, size: 1.16 },
        { t: 41200, x: .18, y: .3,  type: 'palm',           color: 5, size: .81 },
        { t: 41800, x: .82, y: .29, type: 'palm',           color: 3, size: .82 },
        { t: 42900, x: .36, y: .3,  type: 'chrysanthemum',  color: 2, size: .84 },
        { t: 43400, x: .64, y: .28, type: 'chrysanthemum',  color: 1, size: .86 },
        { t: 44500, x: .22, y: .18, type: 'willow',         color: 0, size: .92 },
        { t: 44800, x: .78, y: .18, type: 'willow',         color: 0, size: .94 },
        { t: 45800, x: .5,  y: .18, type: 'heart',          color: 2, size: .98 },
        { t: 46800, x: .5,  y: .32, type: 'chrysanthemum',  color: 0, size: 1.24 }
      ];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let horizon = 0;
      let startTime = performance.now();
      let lastTime = startTime;
      let showTime = 0;
      let previousShowTime = -1;
      let paused = false;
      let muted = true;
      let audio = null;
      let nextAmbient = 0;
      let introTimer = null;
      let toastTimer = null;
      let lastMovement = -1;
      let finaleQueue = [];

      const rockets = [];
      const particles = [];
      const flashes = [];
      const sparks = [];
      const stars = [];
      const skyline = [];
      const reflections = [];

      const random = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const hsla = (c, alpha, lightShift = 0) => `hsla(${c.hue},${c.sat}%,${clamp(c.light + lightShift, 0, 100)}%,${alpha})`;

      function resize() {
        const oldW = width || innerWidth;
        const oldH = height || innerHeight;
        width = innerWidth;
        height = innerHeight;
        horizon = height * .855;
        dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (oldW && oldH && (oldW !== width || oldH !== height)) {
          const sx = width / oldW;
          const sy = height / oldH;
          for (const item of [...rockets, ...particles, ...sparks, ...flashes]) {
            item.x *= sx;
            item.y *= sy;
            if (item.trail) item.trail.forEach(p => { p.x *= sx; p.y *= sy; });
          }
        }
        createStars();
        createSkyline();
      }

      function seeded(index) {
        const x = Math.sin(index * 9283.31 + 17.17) * 43758.5453;
        return x - Math.floor(x);
      }

      function createStars() {
        stars.length = 0;
        const count = Math.round(clamp(width * height / 8400, 65, 190));
        for (let i = 0; i < count; i++) {
          stars.push({
            x: seeded(i * 3) * width,
            y: seeded(i * 3 + 1) * height * .72,
            r: .25 + seeded(i * 3 + 2) * 1.1,
            a: .18 + seeded(i * 7 + 3) * .55,
            phase: seeded(i * 11 + 5) * TAU,
            speed: .0004 + seeded(i * 13 + 7) * .001
          });
        }
      }

      function createSkyline() {
        skyline.length = 0;
        let x = -8;
        let i = 0;
        while (x < width + 20) {
          const w = 18 + seeded(i * 5 + 1) * 42;
          const h = 20 + Math.pow(seeded(i * 5 + 2), 2) * height * .12;
          skyline.push({
            x, w, h,
            antenna: seeded(i * 5 + 3) > .82,
            cap: seeded(i * 5 + 4),
            seed: i
          });
          x += w + 2 + seeded(i * 7 + 4) * 5;
          i++;
        }
      }

      function drawBackdrop(time) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, '#01030a');
        sky.addColorStop(.44, '#060d21');
        sky.addColorStop(.76, '#10172d');
        sky.addColorStop(1, '#02040b');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const halo = ctx.createRadialGradient(width * .51, height * .73, 0, width * .51, height * .73, width * .48);
        halo.addColorStop(0, 'rgba(40,72,118,.18)');
        halo.addColorStop(.48, 'rgba(29,38,83,.08)');
        halo.addColorStop(1, 'rgba(5,8,20,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        for (const s of stars) {
          const pulse = .68 + Math.sin(time * s.speed + s.phase) * .32;
          ctx.globalAlpha = s.a * pulse;
          ctx.fillStyle = s.r > .95 ? '#dce8ff' : '#f4f0e3';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        const haze = ctx.createLinearGradient(0, height * .68, 0, horizon + 30);
        haze.addColorStop(0, 'rgba(19,29,58,0)');
        haze.addColorStop(.7, 'rgba(48,64,94,.15)');
        haze.addColorStop(1, 'rgba(110,127,150,.08)');
        ctx.fillStyle = haze;
        ctx.fillRect(0, height * .66, width, horizon - height * .66 + 32);

        drawReflections();
        drawCity(time);
      }

      function drawCity(time) {
        ctx.save();
        const cityGradient = ctx.createLinearGradient(0, horizon - height * .14, 0, horizon + 8);
        cityGradient.addColorStop(0, '#080c18');
        cityGradient.addColorStop(1, '#020309');
        ctx.fillStyle = cityGradient;
        ctx.beginPath();
        ctx.moveTo(0, horizon + 6);
        for (const b of skyline) {
          const top = horizon - b.h;
          ctx.lineTo(b.x, top);
          if (b.cap > .88) {
            ctx.lineTo(b.x + b.w * .25, top - 7);
            ctx.lineTo(b.x + b.w * .75, top - 7);
          }
          ctx.lineTo(b.x + b.w, top);
          ctx.lineTo(b.x + b.w, horizon + 6);
        }
        ctx.lineTo(width, horizon + 6);
        ctx.closePath();
        ctx.fill();

        for (const b of skyline) {
          const top = horizon - b.h;
          if (b.antenna) {
            ctx.strokeStyle = 'rgba(134,150,173,.2)';
            ctx.lineWidth = .65;
            ctx.beginPath();
            ctx.moveTo(b.x + b.w * .5, top);
            ctx.lineTo(b.x + b.w * .5, top - 14 - b.cap * 13);
            ctx.stroke();
            if (Math.sin(time * .004 + b.seed) > .45) {
              ctx.fillStyle = 'rgba(235,104,94,.72)';
              ctx.fillRect(b.x + b.w * .5 - .7, top - 15 - b.cap * 13, 1.4, 1.4);
            }
          }
          const cols = Math.max(1, Math.floor((b.w - 8) / 10));
          const rows = Math.max(1, Math.floor((b.h - 8) / 12));
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const on = seeded(b.seed * 131 + row * 17 + col * 3) > .7;
              if (!on) continue;
              const wx = b.x + 5 + col * 10;
              const wy = top + 7 + row * 12;
              ctx.fillStyle = seeded(b.seed * 19 + row + col) > .55 ? 'rgba(239,201,125,.18)' : 'rgba(141,184,211,.13)';
              ctx.fillRect(wx, wy, 2, 3);
            }
          }
        }

        const shore = ctx.createLinearGradient(0, horizon - 1, 0, height);
        shore.addColorStop(0, 'rgba(10,17,29,.96)');
        shore.addColorStop(.18, 'rgba(2,5,12,.98)');
        shore.addColorStop(1, '#010208');
        ctx.fillStyle = shore;
        ctx.fillRect(0, horizon + 1, width, height - horizon);

        const line = ctx.createLinearGradient(0, 0, width, 0);
        line.addColorStop(0, 'rgba(93,120,151,0)');
        line.addColorStop(.5, 'rgba(132,156,177,.2)');
        line.addColorStop(1, 'rgba(93,120,151,0)');
        ctx.fillStyle = line;
        ctx.fillRect(0, horizon + 2, width, 1);
        ctx.restore();
      }

      function drawReflections() {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let i = reflections.length - 1; i >= 0; i--) {
          const r = reflections[i];
          r.life -= .009;
          if (r.life <= 0) {
            reflections.splice(i, 1);
            continue;
          }
          const alpha = r.life * .12;
          const grad = ctx.createLinearGradient(0, horizon, 0, height);
          grad.addColorStop(0, hsla(r.color, alpha));
          grad.addColorStop(1, hsla(r.color, 0));
          ctx.fillStyle = grad;
          const spread = (1 - r.life) * 50;
          ctx.beginPath();
          ctx.moveTo(r.x - 2, horizon);
          ctx.lineTo(r.x + 2, horizon);
          ctx.lineTo(r.x + r.width + spread, height);
          ctx.lineTo(r.x - r.width - spread, height);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      class Rocket {
        constructor(targetX, targetY, type, color, size = 1) {
          this.startX = clamp(targetX + random(-width * .11, width * .11), width * .08, width * .92);
          this.startY = horizon + random(8, 30);
          this.targetX = targetX;
          this.targetY = targetY;
          this.x = this.startX;
          this.y = this.startY;
          this.type = type;
          this.color = color;
          this.size = size;
          this.t = 0;
          this.duration = random(820, 1260);
          this.trail = [];
          this.wobble = random(-10, 10);
        }

        update(dt) {
          this.t += dt / this.duration;
          const t = clamp(this.t, 0, 1);
          const eased = 1 - Math.pow(1 - t, 2.25);
          this.trail.unshift({ x: this.x, y: this.y });
          if (this.trail.length > 15) this.trail.pop();
          this.x = this.startX + (this.targetX - this.startX) * eased + Math.sin(t * Math.PI) * this.wobble;
          this.y = this.startY + (this.targetY - this.startY) * eased;
          if (Math.random() < .38) {
            sparks.push(new Spark(this.x + random(-2, 2), this.y + random(2, 8), this.color, random(.25, .55), random(-.15, .15), random(.15, .55)));
          }
          if (this.t >= 1) {
            explode(this.x, this.y, this.type, this.color, this.size);
            return false;
          }
          return true;
        }

        draw() {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < this.trail.length - 1; i++) {
            const a = (1 - i / this.trail.length) * .5;
            ctx.strokeStyle = hsla(this.color, a, 13);
            ctx.lineWidth = Math.max(.4, 2.1 - i * .12);
            ctx.beginPath();
            ctx.moveTo(this.trail[i].x, this.trail[i].y);
            ctx.lineTo(this.trail[i + 1].x, this.trail[i + 1].y);
            ctx.stroke();
          }
          ctx.fillStyle = '#fff8dc';
          ctx.shadowColor = hsla(this.color, 1);
          ctx.shadowBlur = 13;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 1.65, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      class Particle {
        constructor(x, y, vx, vy, color, options = {}) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.color = color;
          this.life = options.life || random(1050, 1800);
          this.maxLife = this.life;
          this.drag = options.drag || .982;
          this.gravity = options.gravity ?? .038;
          this.size = options.size || random(.75, 1.55);
          this.trailLength = options.trailLength || 7;
          this.trail = [];
          this.twinkle = options.twinkle || 0;
          this.goldShift = options.goldShift || false;
          this.sparkle = options.sparkle ?? true;
          this.delay = options.delay || 0;
        }

        update(dt) {
          if (this.delay > 0) {
            this.delay -= dt;
            return true;
          }
          const step = dt / 16.667;
          this.life -= dt;
          this.trail.unshift({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) this.trail.pop();
          this.vx *= Math.pow(this.drag, step);
          this.vy *= Math.pow(this.drag, step);
          this.vy += this.gravity * step;
          this.x += this.vx * step;
          this.y += this.vy * step;
          if (this.sparkle && this.life < this.maxLife * .48 && Math.random() < .028 * step) {
            sparks.push(new Spark(this.x, this.y, this.goldShift ? palette[0] : this.color, random(.18, .4), random(-.35, .35), random(-.1, .55)));
          }
          return this.life > 0 && this.y < height + 30;
        }

        draw() {
          if (this.delay > 0 || this.trail.length < 2) return;
          const ratio = clamp(this.life / this.maxLife, 0, 1);
          const fade = Math.min(1, ratio * 4);
          const flicker = this.twinkle && ratio < .55 ? (Math.sin(this.life * this.twinkle) > -.15 ? 1 : .18) : 1;
          const c = this.goldShift && ratio < .5 ? palette[0] : this.color;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineCap = 'round';
          for (let i = this.trail.length - 2; i >= 0; i--) {
            const p = this.trail[i];
            const n = this.trail[i + 1];
            const local = 1 - i / this.trail.length;
            ctx.strokeStyle = hsla(c, fade * flicker * local * .73, 5 + local * 8);
            ctx.lineWidth = Math.max(.32, this.size * local);
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          ctx.fillStyle = hsla(c, fade * flicker, 18);
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * .72, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      class Spark {
        constructor(x, y, color, lifeScale = 1, vx = 0, vy = 0) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.color = color;
          this.life = random(240, 580) * lifeScale;
          this.maxLife = this.life;
          this.r = random(.35, 1.05);
        }

        update(dt) {
          const step = dt / 16.667;
          this.life -= dt;
          this.vy += .035 * step;
          this.x += this.vx * step;
          this.y += this.vy * step;
          return this.life > 0;
        }

        draw() {
          const a = clamp(this.life / this.maxLife, 0, 1);
          if (Math.sin(this.life * .08) < -.35) return;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = hsla(this.color, a, 20);
          ctx.fillRect(this.x, this.y, this.r, this.r);
          ctx.restore();
        }
      }

      class Flash {
        constructor(x, y, color, radius) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.radius = radius;
          this.life = 1;
        }

        update(dt) {
          this.life -= dt / 330;
          return this.life > 0;
        }

        draw() {
          const r = this.radius * (1.2 - this.life * .3);
          const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
          g.addColorStop(0, hsla(this.color, this.life * .24, 26));
          g.addColorStop(.16, hsla(this.color, this.life * .12, 10));
          g.addColorStop(1, hsla(this.color, 0));
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(this.x, this.y, r, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      function addParticle(x, y, angle, speed, color, options) {
        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, options));
      }

      function explode(x, y, type, color, size) {
        const scale = clamp(Math.min(width, height) / 760, .72, 1.35) * size;
        const lowPower = width < 640 ? .72 : 1;
        const multiplier = lowPower;
        let count = Math.round(120 * multiplier);

        flashes.push(new Flash(x, y, color, 85 * scale));
        reflections.push({ x, width: 18 * scale, color, life: 1 });
        boom(size, type);

        if (type === 'ring') {
          count = Math.round(96 * multiplier);
          const tilt = random(.62, 1);
          const rotation = random(0, TAU);
          for (let i = 0; i < count; i++) {
            const a = i / count * TAU;
            const rx = Math.cos(a) * 5.35 * scale;
            const ry = Math.sin(a) * 5.35 * scale * tilt;
            const cos = Math.cos(rotation), sin = Math.sin(rotation);
            particles.push(new Particle(x, y, rx * cos - ry * sin, rx * sin + ry * cos, color, {
              life: random(1150, 1550), drag: .987, gravity: .027, trailLength: 6, size: 1.25, twinkle: .035
            }));
          }
          for (let i = 0; i < 24 * multiplier; i++) addParticle(x, y, random(0, TAU), random(.7, 2.5) * scale, palette[0], { life: random(500, 900), gravity: .025, trailLength: 3, size: .65 });
        } else if (type === 'willow') {
          count = Math.round(112 * multiplier);
          for (let i = 0; i < count; i++) {
            const a = i / count * TAU + random(-.025, .025);
            const speed = (3 + Math.pow(Math.random(), .22) * 3.25) * scale;
            addParticle(x, y, a, speed, palette[0], {
              life: random(2000, 2850), drag: .967, gravity: .055, trailLength: 13, size: random(.85, 1.5), twinkle: .022, sparkle: true
            });
          }
        } else if (type === 'palm') {
          count = Math.round(38 * multiplier);
          for (let i = 0; i < count; i++) {
            const a = i / count * TAU + random(-.055, .055);
            const speed = random(3.8, 7.1) * scale;
            addParticle(x, y, a, speed, color, {
              life: random(1500, 2200), drag: .971, gravity: .064, trailLength: 12, size: random(1.2, 2), goldShift: true, sparkle: true
            });
          }
          for (let i = 0; i < 36 * multiplier; i++) addParticle(x, y, random(0, TAU), random(.8, 3.1) * scale, palette[0], { life: random(650, 1100), trailLength: 4, twinkle: .05, size: .75 });
        } else if (type === 'heart') {
          count = Math.round(112 * multiplier);
          for (let i = 0; i < count; i++) {
            const t = i / count * TAU;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            particles.push(new Particle(x, y, hx * .32 * scale, hy * .32 * scale, color, {
              life: random(1300, 1750), drag: .988, gravity: .025, trailLength: 7, size: 1.2, twinkle: .024
            }));
          }
          for (let i = 0; i < 28 * multiplier; i++) addParticle(x, y, random(0, TAU), random(.6, 2.3) * scale, palette[0], { life: random(450, 850), trailLength: 3, size: .7 });
        } else {
          const chrys = type === 'chrysanthemum';
          count = Math.round((chrys ? 168 : 126) * multiplier);
          const offset = random(0, TAU);
          for (let i = 0; i < count; i++) {
            const a = offset + i / count * TAU + random(-.035, .035);
            const edge = chrys ? Math.pow(Math.random(), .13) : Math.pow(Math.random(), .42);
            const speed = (1.1 + edge * (chrys ? 6.8 : 5.8)) * scale;
            const particleColor = chrys && i % 5 === 0 ? palette[0] : color;
            addParticle(x, y, a, speed, particleColor, {
              life: random(chrys ? 1400 : 1050, chrys ? 2100 : 1680),
              drag: chrys ? .982 : .986,
              gravity: chrys ? .045 : .036,
              trailLength: chrys ? 9 : 6,
              size: random(.7, 1.45),
              twinkle: i % 7 === 0 ? .04 : 0,
              goldShift: chrys && i % 4 === 0
            });
          }
        }

        for (let i = 0; i < 36 * multiplier; i++) {
          const a = random(0, TAU);
          const s = random(.6, 3.5) * scale;
          sparks.push(new Spark(x, y, Math.random() > .42 ? color : palette[0], random(.75, 1.4), Math.cos(a) * s, Math.sin(a) * s));
        }
      }

      function launchCue(cue) {
        const margin = width < 600 ? .09 : .05;
        const x = clamp(cue.x, margin, 1 - margin) * width;
        const y = clamp(cue.y, .1, .55) * height;
        rockets.push(new Rocket(x, y, cue.type, palette[cue.color], cue.size));
      }

      function processCues(current, previous) {
        if (previous < 0 || current < previous) {
          for (const cue of cues) {
            if (cue.t <= current) launchCue(cue);
          }
          return;
        }
        for (const cue of cues) {
          if (cue.t > previous && cue.t <= current) launchCue(cue);
        }
      }

      function ambientLaunch(current) {
        if (current < nextAmbient) return;
        const move = movements.findIndex(m => current >= m.from && current < m.to);
        const delay = move === 3 ? random(1300, 2100) : move === 1 ? random(2400, 3600) : random(3900, 5600);
        nextAmbient = current + delay;
        const types = move === 2 ? ['willow', 'palm'] : ['peony', 'ring', 'chrysanthemum'];
        launchCue({
          x: random(.12, .88), y: random(.17, .4),
          type: types[Math.floor(random(0, types.length))],
          color: move === 2 ? 0 : Math.floor(random(0, palette.length)),
          size: random(.62, .88)
        });
      }

      function updateMovement(current) {
        const index = Math.max(0, movements.findIndex(m => current >= m.from && current < m.to));
        const movement = movements[index];
        if (index !== lastMovement) {
          lastMovement = index;
          movementName.style.opacity = '0';
          movementIndex.style.opacity = '0';
          setTimeout(() => {
            movementName.textContent = movement.name;
            movementIndex.textContent = movement.index;
            movementName.style.opacity = '1';
            movementIndex.style.opacity = '1';
          }, 220);
        }
        const progress = (current - movement.from) / (movement.to - movement.from) * 100;
        movementLine.style.setProperty('--progress', `${clamp(progress, 0, 100)}%`);
      }

      function triggerFinale() {
        const now = performance.now();
        const burst = [
          [0, .1, .37, 'peony', 3, .72], [0, .9, .36, 'peony', 2, .72],
          [260, .28, .25, 'ring', 1, .8], [260, .72, .24, 'ring', 4, .8],
          [620, .5, .14, 'chrysanthemum', 0, 1.18],
          [950, .16, .22, 'willow', 0, .88], [950, .84, .22, 'willow', 0, .88],
          [1320, .38, .31, 'chrysanthemum', 2, .85], [1320, .62, .29, 'chrysanthemum', 1, .87],
          [1900, .5, .23, 'heart', 2, 1.03]
        ];
        finaleQueue.push(...burst.map(item => ({ at: now + item[0], cue: { x: item[1], y: item[2], type: item[3], color: item[4], size: item[5] } })));
        showToast('Finale sequence');
      }

      function processFinale(now) {
        for (let i = finaleQueue.length - 1; i >= 0; i--) {
          if (finaleQueue[i].at <= now) {
            launchCue(finaleQueue[i].cue);
            finaleQueue.splice(i, 1);
          }
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
      }

      function initAudio() {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
      }

      function boom(size = 1, type = 'peony') {
        if (muted || !audio) return;
        const now = audio.currentTime;
        const duration = type === 'willow' ? 1.35 : .85;
        const buffer = audio.createBuffer(1, audio.sampleRate * duration, audio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          const t = i / data.length;
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.4) * .72;
        }
        const source = audio.createBufferSource();
        source.buffer = buffer;
        const lowpass = audio.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.setValueAtTime(type === 'ring' ? 420 : 270, now);
        lowpass.frequency.exponentialRampToValueAtTime(75, now + duration);
        const gain = audio.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(.16 * size, now + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        source.connect(lowpass).connect(gain).connect(audio.destination);
        source.start(now);

        const osc = audio.createOscillator();
        const oscGain = audio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(72, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + .35);
        oscGain.gain.setValueAtTime(.08 * size, now);
        oscGain.gain.exponentialRampToValueAtTime(.0001, now + .48);
        osc.connect(oscGain).connect(audio.destination);
        osc.start(now);
        osc.stop(now + .5);
      }

      function setSound(on) {
        muted = !on;
        if (on) initAudio();
        soundBtn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
        soundIcon.innerHTML = on
          ? '<path d="M3 6h2.3L9 3v10l-3.7-3H3zM11.2 5.4a3.7 3.7 0 0 1 0 5.2M13.2 3.6a6.2 6.2 0 0 1 0 8.8"/>'
          : '<path d="M3 6h2.3L9 3v10l-3.7-3H3zM12 6l3 4M15 6l-3 4"/>';
        showToast(on ? 'Sound on' : 'Sound off');
      }

      function setPaused(value) {
        paused = value;
        pauseBtn.setAttribute('aria-label', paused ? 'Resume performance' : 'Pause performance');
        pauseIcon.innerHTML = paused ? '<path d="m5 3 8 5-8 5z"/>' : '<path d="M5 3v10M11 3v10"/>';
        liveText.textContent = paused ? 'Performance paused' : 'Live performance';
        showToast(paused ? 'Performance paused' : 'Performance resumed');
        if (!paused) lastTime = performance.now();
      }

      function updateCollection(collection, dt) {
        for (let i = collection.length - 1; i >= 0; i--) {
          if (!collection[i].update(dt)) collection.splice(i, 1);
        }
      }

      function drawCollection(collection) {
        for (const item of collection) item.draw();
      }

      function frame(now) {
        requestAnimationFrame(frame);
        const dt = clamp(now - lastTime, 0, 34);
        lastTime = now;

        if (!paused) {
          showTime = (showTime + dt) % SHOW_LENGTH;
          if (showTime < previousShowTime) {
            previousShowTime = -1;
            nextAmbient = 0;
          }
          processCues(showTime, previousShowTime);
          ambientLaunch(showTime);
          processFinale(now);
          updateMovement(showTime);
          previousShowTime = showTime;
          updateCollection(rockets, dt);
          updateCollection(particles, dt);
          updateCollection(sparks, dt);
          updateCollection(flashes, dt);
        }

        drawBackdrop(now);
        drawCollection(flashes);
        drawCollection(rockets);
        drawCollection(particles);
        drawCollection(sparks);

        const seconds = Math.floor(showTime / 1000);
        clockEl.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }

      canvas.addEventListener('pointerdown', event => {
        if (event.target !== canvas) return;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        if (y > horizon - 20) return;
        const types = ['peony', 'ring', 'chrysanthemum', 'palm', 'heart'];
        const type = types[Math.floor(random(0, types.length))];
        const color = palette[Math.floor(random(0, palette.length))];
        explode(x, y, type, color, random(.78, 1.04));
      });

      pauseBtn.addEventListener('click', () => setPaused(!paused));
      soundBtn.addEventListener('click', () => setSound(muted));
      finaleBtn.addEventListener('click', triggerFinale);

      addEventListener('keydown', event => {
        if (event.code === 'Space') {
          event.preventDefault();
          setPaused(!paused);
        } else if (event.key.toLowerCase() === 'm') {
          setSound(muted);
        } else if (event.key.toLowerCase() === 'f') {
          triggerFinale();
        }
      });

      addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

      resize();
      introTimer = setTimeout(() => intro.classList.add('recede'), 5600);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
