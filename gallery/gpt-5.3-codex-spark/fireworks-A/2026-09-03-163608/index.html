<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireworks Display</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        background: radial-gradient(circle at 50% 100%, #3a1c55 0%, #08010f 60%, #030004 100%);
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
        color: #f7e8ff;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        padding: 14px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="sky"></canvas>
    <div id="overlay">Autonomous benchmark output - fireworks cell</div>

    <script>
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');
      const DPR = Math.min(2, window.devicePixelRatio || 1);
      const gravity = 0.04;
      const fireworks = [];
      const particles = [];

      function resize() {
        canvas.width = Math.floor(innerWidth * DPR);
        canvas.height = Math.floor(innerHeight * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      class Rocket {
        constructor() {
          this.x = Math.random() * innerWidth;
          this.y = innerHeight + Math.random() * 80;
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = -(Math.random() * 7 + 8);
          this.exploded = false;
          this.hue = Math.floor(Math.random() * 360);
          this.life = 0;
          this.maxLife = Math.floor(Math.random() * 40) + 40;
        }

        step() {
          this.vy += gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life++;

          if (this.vy >= -1 || this.life > this.maxLife) {
            this.explode();
            return false;
          }
          return true;
        }

        draw() {
          ctx.beginPath();
          ctx.fillStyle = `hsl(${this.hue}, 80%, 80%)`;
          ctx.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }

        explode() {
          this.exploded = true;
          const count = Math.floor(Math.random() * 40) + 55;
          for (let i = 0; i < count; i++) {
            particles.push(new Particle(this.x, this.y, this.hue));
          }
        }
      }

      class Particle {
        constructor(x, y, hue) {
          const speed = Math.random() * 5 + 1;
          const angle = Math.random() * Math.PI * 2;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.vy *= 0.9;
          this.hue = hue + (Math.random() * 30 - 15);
          this.alpha = 1;
          this.life = 0;
          this.maxLife = Math.floor(Math.random() * 40) + 30;
          this.radius = Math.random() * 2 + 1.6;
        }

        step() {
          this.vy += gravity * 0.6;
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.985;
          this.vy *= 0.985;
          this.alpha *= 0.97;
          this.life++;
          return this.life < this.maxLife && this.alpha > 0.02;
        }

        draw() {
          ctx.beginPath();
          ctx.fillStyle = `hsla(${this.hue}, 95%, 62%, ${this.alpha})`;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      let tick = 0;
      let raf;

      function frame() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        tick++;

        if (tick % 35 === 0) {
          fireworks.push(new Rocket());
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
          const f = fireworks[i];
          f.draw();
          if (!f.step()) fireworks.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.draw();
          if (!p.step()) particles.splice(i, 1);
        }

        raf = requestAnimationFrame(frame);
      }

      addEventListener('resize', resize);
      addEventListener('click', () => {
        const x = Math.random() * innerWidth;
        const y = innerHeight + 30;
        const rocket = new Rocket();
        rocket.x = x;
        rocket.y = y;
        rocket.vy = -(Math.random() * 8 + 10);
        fireworks.push(rocket);
      });
      addEventListener('keydown', e => {
        if (e.code === 'Space') {
          fireworks.push(new Rocket());
        }
      });

      resize();
      raf = requestAnimationFrame(frame);
    </script>
  </body>
</html>
