<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title>First Person Rollercoaster</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        color: #eaf1ff;
        font-size: 12px;
        letter-spacing: 0.02em;
        background: rgba(8, 10, 18, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 8px 10px;
      }
      #hud strong {
        color: #7ce0ff;
      }
    </style>
  </head>
  <body>
    <div id="hud"><strong>Autonomy Bench</strong> · continuous first-person rollercoaster</div>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

      const canvasParent = document.body;
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x05070d, 30, 250);
      scene.background = new THREE.Color(0x060912);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      canvasParent.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.rotation.order = 'YXZ';

      const ambient = new THREE.AmbientLight(0x98bbff, 0.3);
      scene.add(ambient);
      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(20, 40, 10);
      sun.castShadow = false;
      scene.add(sun);

      const moon = new THREE.PointLight(0x76e2ff, 0.8, 120);
      moon.position.set(-20, 20, -30);
      scene.add(moon);

      const stars = new THREE.BufferGeometry();
      const starCount = 1200;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        starPositions[i * 3 + 0] = (Math.random() - 0.5) * 600;
        starPositions[i * 3 + 1] = Math.random() * 160 + 20;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 600;
      }
      stars.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starField = new THREE.Points(
        stars,
        new THREE.PointsMaterial({ color: 0xaec9ff, size: 1.1, transparent: true, opacity: 0.8 }),
      );
      scene.add(starField);

      const trackPoints = [
        [-80, 7, 0],
        [-50, 8, 10],
        [-20, 16, 8],
        [10, 15, -12],
        [25, 24, -35],
        [45, 18, -70],
        [62, 12, -95],
        [74, 6, -120],
        [60, 4, -160],
        [20, 10, -185],
        [-20, 16, -180],
        [-55, 20, -165],
        [-82, 12, -138],
        [-100, 8, -103],
        [-88, 14, -60],
        [-74, 9, -30],
        [-50, 8, -2],
        [-10, 14, 12],
        [25, 22, 20],
        [70, 14, 8],
        [95, 5, -28],
        [104, 20, -70],
        [82, 17, -113],
        [36, 14, -132],
        [0, 16, -126],
        [-30, 22, -105],
        [-48, 12, -66],
        [-35, 14, -38],
        [-8, 10, -24],
        [32, 12, -44],
        [58, 20, -72],
        [52, 11, -104],
        [30, 16, -130],
        [0, 9, -136],
        [-28, 14, -118],
        [-48, 10, -84],
        [-32, 16, -55],
        [0, 18, -44],
        [30, 22, -52],
        [58, 10, -80],
        [80, 16, -112],
        [64, 8, -148],
        [28, 14, -165],
        [-12, 12, -160],
        [-42, 6, -138],
        [-58, 10, -102],
        [-44, 16, -70],
        [-16, 12, -55],
        [16, 12, -66],
        [42, 20, -82],
        [68, 10, -102],
        [78, 13, -128],
        [52, 14, -152],
        [18, 16, -160],
        [-18, 12, -150],
        [-40, 7, -128],
        [-28, 14, -100],
        [0, 11, -84],
        [34, 14, -72],
        [62, 10, -64],
        [84, 16, -44],
        [70, 24, -14],
        [38, 12, 10],
        [0, 8, 22],
        [-30, 15, 24],
        [-62, 19, 4],
        [-80, 11, -24],
      ].map((p) => new THREE.Vector3(...p));

      trackPoints.push(trackPoints[0].clone());
      const rawCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal', 0.1);
      const tubeSegments = 2400;
      const tube = new THREE.TubeGeometry(rawCurve, tubeSegments, 0.18, 24, true);
      const railMat = new THREE.MeshStandardMaterial({ color: 0x6f6f8b, metalness: 0.9, roughness: 0.2 });
      const rail = new THREE.Mesh(tube, railMat);
      rail.castShadow = false;
      rail.receiveShadow = false;
      scene.add(rail);

      const railMat2 = new THREE.MeshStandardMaterial({ color: 0xd7dde8, emissive: 0x112030, metalness: 0.1, roughness: 0.4 });
      const supportGeo = new THREE.BoxGeometry(2.2, 0.25, 2.2);
      const supportPts = [0, 35, 70, 105, 140, 175, 210, 245, 280, 320];
      for (const u of supportPts) {
        const t = (u % 360) / 360;
        const a = rawCurve.getPointAt(t);
        const b = new THREE.Vector3(0, -18, 0).add(a);
        const post = new THREE.Mesh(supportGeo, railMat2);
        post.position.copy(a).lerp(b, 0.5);
        post.scale.y = 8;
        post.position.y = (a.y + b.y) / 2;
        scene.add(post);
      }

      const coaster = new THREE.Group();
      const hullGeo = new THREE.CylinderGeometry(0.9, 1.1, 2.5, 16);
      const hullMat = new THREE.MeshStandardMaterial({ color: 0xfe4f4a, emissive: 0x2a0f0f, roughness: 0.35, metalness: 0.2 });
      const hull = new THREE.Mesh(hullGeo, hullMat);
      hull.rotation.x = Math.PI / 2;
      coaster.add(hull);
      const seatGeo = new THREE.BoxGeometry(0.9, 0.25, 1.1);
      const seatMat = new THREE.MeshStandardMaterial({ color: 0x1d2a40, emissive: 0x07151f, metalness: 0.4, roughness: 0.55 });
      const seat = new THREE.Mesh(seatGeo, seatMat);
      seat.position.set(0, -0.8, 0.6);
      coaster.add(seat);
      scene.add(coaster);

      const bank = [];
      for (let i = 0; i <= 512; i++) {
        const u = i / 512;
        bank.push(Math.sin(u * Math.PI * 10) * 0.6 + Math.cos(u * 7) * 0.12);
      }

      const curve = rawCurve;
      const frames = curve.computeFrenetFrames(3600, true);
      let progress = 0.0;
      let speed = 0.0012;
      let last = performance.now();

      function tickTrack(now) {
        const delta = now - last;
        last = now;
        progress = (progress + speed * delta) % 1;

        const bankIndex = Math.min(3600, Math.floor(progress * 3600));
        const position = curve.getPointAt(progress);
        const tangent = curve.getTangentAt(progress).normalize();
        const normal = frames.normals[bankIndex];
        const binormal = frames.binormals[bankIndex];
        const incline = new THREE.Vector3().crossVectors(binormal, tangent).normalize();

        const baseOffset = new THREE.Vector3(0.0, 0.25, 0.0);
        const riderOffset = normal.clone().multiplyScalar(1.0).addScaledVector(incline, -0.0);
        const riderPos = position.clone().add(baseOffset).addScaledVector(riderOffset, 1);
        coaster.position.copy(riderPos);

        const bankAmt = bank[bankIndex] || 0;
        coaster.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal.clone().addScaledVector(new THREE.Vector3(0, 0.15, 0), bankAmt).normalize());
        coaster.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(tangent, bankAmt * 0.35));

        const ahead = curve.getPointAt((progress + 0.01) % 1);
        const cameraLook = new THREE.Vector3()
          .subVectors(ahead, position)
          .normalize()
          .add(normal.clone().multiplyScalar(0.09))
          .normalize();

        camera.position.copy(position).add(normal.clone().multiplyScalar(0.18)).addScaledVector(tangent, -0.6).addScaledVector(new THREE.Vector3(0, 1, 0), 0.2);
        camera.up.copy(normal);
        camera.lookAt(position.clone().add(cameraLook.clone().multiplyScalar(20)));
        camera.fov = 70 - Math.max(0, tangent.y * 12);
        camera.updateProjectionMatrix();

        for (let i = 0; i < 8; i++) {
          const flash = i / 8;
          const st = curve.getPointAt((progress + flash * 0.005) % 1);
          const lt = curve.getTangentAt((progress + flash * 0.005) % 1);
          const spark = new THREE.Points(
            new THREE.BufferGeometry().setFromPoints([st, st.clone().addScaledVector(lt, 0.5)]),
            new THREE.PointsMaterial({ color: 0x95f4ff, size: 0.7, transparent: true, opacity: 0.06 + 0.04 * i })
          );
          scene.add(spark);
          setTimeout(() => scene.remove(spark), 0);
        }
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize);

      function animate() {
        tickTrack(performance.now());
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) last = performance.now();
      });
    </script>
  </body>
</html>
