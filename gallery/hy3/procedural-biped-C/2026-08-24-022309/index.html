<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Procedural Biped — Autonomous Walk Cycle</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    color: #cfeaff;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* subtle vignette + grain overlay for cinematic framing */
  #frame {
    position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 240px 40px rgba(2,4,10,0.85);
    background:
      radial-gradient(120% 80% at 50% 38%, rgba(0,0,0,0) 55%, rgba(2,4,10,0.55) 100%);
    mix-blend-mode: normal;
  }

  .label {
    position: fixed; pointer-events: none; user-select: none;
    text-shadow: 0 0 12px rgba(60,200,255,0.35);
  }
  #title {
    left: 28px; bottom: 26px;
    font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase;
    color: #9fe2ff;
  }
  #title .sub {
    display: block; margin-top: 6px;
    font-size: 10.5px; letter-spacing: 1.5px; color: #5c83a8;
    text-transform: none;
  }
  #hint {
    right: 26px; bottom: 26px;
    font-size: 10.5px; letter-spacing: 1.5px; color: #4a6f8f;
    text-align: right;
  }
  #badge {
    left: 28px; top: 24px;
    font-size: 10px; letter-spacing: 3px; color: #3f6f93;
    text-transform: uppercase;
  }
  #badge b { color: #7fd6ff; font-weight: 600; }

  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #ff9b9b; font-size: 14px; text-align: center; padding: 40px;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="frame"></div>
  <div id="badge" class="label">CELL&nbsp;<b>procedural-biped--c--hy3--a01</b></div>
  <div id="title" class="label">
    Procedural Biped
    <span class="sub">autonomous walk cycle · forward kinematics</span>
  </div>
  <div id="hint" class="label">drag to orbit · scroll to zoom</div>
  <div id="err">Could not load the 3D engine (Three.js). Check your network connection and reload.</div>

  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script>
    if (!window.THREE) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>

  <script>
  (function () {
    "use strict";
    if (!window.THREE) {
      document.getElementById("err").style.display = "flex";
      return;
    }

    // ---------------------------------------------------------------------
    // Renderer
    // ---------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if ("outputEncoding" in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById("app").appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x070b16, 16, 64);

    const camera = new THREE.PerspectiveCamera(
      42, window.innerWidth / window.innerHeight, 0.1, 400
    );

    // ---------------------------------------------------------------------
    // Gradient sky (backdrop sphere)
    // ---------------------------------------------------------------------
    const skyGeo = new THREE.SphereGeometry(220, 32, 16);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x0a1430) },
        midColor: { value: new THREE.Color(0x102046) },
        botColor: { value: new THREE.Color(0x05070d) }
      },
      vertexShader: `
        varying vec3 vDir;
        void main(){
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vDir;
        uniform vec3 topColor; uniform vec3 midColor; uniform vec3 botColor;
        void main(){
          float h = vDir.y * 0.5 + 0.5;
          vec3 c = mix(botColor, midColor, smoothstep(0.0, 0.55, h));
          c = mix(c, topColor, smoothstep(0.5, 1.0, h));
          // faint horizon glow
          float glow = pow(1.0 - abs(vDir.y), 6.0) * 0.12;
          c += vec3(0.10, 0.30, 0.45) * glow;
          gl_FragColor = vec4(c, 1.0);
        }
      `
    });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    sky.renderOrder = -1;
    scene.add(sky);

    // ---------------------------------------------------------------------
    // Lighting
    // ---------------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(0x6f8cff, 0x141826, 0.55);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff1e0, 1.25);
    key.position.set(7, 13, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 45;
    key.shadow.camera.left = -14;
    key.shadow.camera.right = 14;
    key.shadow.camera.top = 14;
    key.shadow.camera.bottom = -14;
    key.shadow.bias = -0.0004;
    key.shadow.radius = 4;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x5fd0ff, 0.7);
    rim.position.set(-6, 7, -7);
    scene.add(rim);

    const fill = new THREE.PointLight(0x4488ff, 0.4, 40);
    fill.position.set(0, 4, 9);
    scene.add(fill);

    // ---------------------------------------------------------------------
    // Ground (scrolling grid) + soft glow disc
    // ---------------------------------------------------------------------
    function makeGridTexture() {
      const s = 512;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#070b15";
      ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = "rgba(70,190,255,0.22)";
      ctx.lineWidth = 2;
      const step = 64;
      for (let i = 0; i <= s; i += step) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(s, i); ctx.stroke();
      }
      // brighter center cross
      ctx.strokeStyle = "rgba(120,220,255,0.4)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s / 2, 0); ctx.lineTo(s / 2, s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, s / 2); ctx.lineTo(s, s / 2); ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(48, 48);
      if ("encoding" in tex) tex.encoding = THREE.sRGBEncoding;
      return tex;
    }
    const gridTex = makeGridTexture();
    const groundMat = new THREE.MeshStandardMaterial({
      map: gridTex,
      color: 0x223044,
      roughness: 0.92,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // radial glow disc beneath the creature
    function makeGlowTexture() {
      const s = 256;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
      g.addColorStop(0, "rgba(90,210,255,0.55)");
      g.addColorStop(0.4, "rgba(60,160,255,0.18)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);
      return new THREE.CanvasTexture(c);
    }
    const glowDisc = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 7),
      new THREE.MeshBasicMaterial({
        map: makeGlowTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    glowDisc.rotation.x = -Math.PI / 2;
    glowDisc.position.y = 0.02;
    scene.add(glowDisc);

    // ---------------------------------------------------------------------
    // Materials
    // ---------------------------------------------------------------------
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x3b4d78, roughness: 0.45, metalness: 0.35,
      emissive: 0x0a1428, emissiveIntensity: 0.6
    });
    const limbMat = new THREE.MeshStandardMaterial({
      color: 0x2c3c60, roughness: 0.5, metalness: 0.4
    });
    const jointMat = new THREE.MeshStandardMaterial({
      color: 0x0a1a26, roughness: 0.3, metalness: 0.6,
      emissive: 0x35d6ff, emissiveIntensity: 1.4
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: 0x0a1a26, roughness: 0.3, metalness: 0.6,
      emissive: 0x39e0ff, emissiveIntensity: 1.8
    });
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0x001018, roughness: 0.2, metalness: 0.2,
      emissive: 0x6ff0ff, emissiveIntensity: 2.2
    });

    // ---------------------------------------------------------------------
    // Helpers to build limb segments with joint pivots
    // ---------------------------------------------------------------------
    function segment(len, rTop, rBot, mat) {
      const geo = new THREE.CylinderGeometry(rTop, rBot, len, 18, 1);
      const m = new THREE.Mesh(geo, mat);
      m.position.y = -len / 2;     // top of segment at group origin
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }
    function jointSphere(r, mat) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 18), mat);
      m.castShadow = true;
      return m;
    }

    // ---------------------------------------------------------------------
    // Build the biped
    // ---------------------------------------------------------------------
    const root = new THREE.Group();
    scene.add(root);

    const PELVIS_Y = 2.18;
    const core = new THREE.Group();
    core.position.y = PELVIS_Y;
    root.add(core);

    // pelvis
    const pelvis = jointSphere(0.34, bodyMat);
    pelvis.scale.set(1.25, 0.8, 1.0);
    core.add(pelvis);

    // torso (tapered)
    const torso = segment(1.05, 0.30, 0.40, bodyMat);
    torso.position.y = 0.52;
    core.add(torso);

    // chest plate
    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.42, 22, 18), bodyMat);
    chest.position.y = 1.05;
    chest.scale.set(1.15, 0.95, 1.0);
    chest.castShadow = true;
    core.add(chest);

    // glowing core reactor
    const reactor = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 18), accentMat);
    reactor.position.set(0, 0.78, 0.34);
    core.add(reactor);

    // neck + head
    const neck = segment(0.28, 0.14, 0.16, limbMat);
    neck.position.y = 1.15;
    core.add(neck);

    const headPivot = new THREE.Group();
    headPivot.position.y = 1.42;
    core.add(headPivot);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 26, 22), bodyMat);
    head.position.y = 0.26;
    head.castShadow = true;
    headPivot.add(head);

    // visor
    const visor = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.16, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x05121c, roughness: 0.2, metalness: 0.5, emissive: 0x1c8fb8, emissiveIntensity: 0.8 })
    );
    visor.position.set(0, 0.30, 0.34);
    headPivot.add(visor);

    // eyes
    const eyeGeo = new THREE.SphereGeometry(0.06, 12, 12);
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.13, 0.31, 0.43);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.13, 0.31, 0.43);
    headPivot.add(eyeL, eyeR);

    // antenna
    const ant = segment(0.34, 0.02, 0.05, limbMat);
    ant.position.set(0.12, 0.62, 0);
    ant.rotation.z = 0.18;
    headPivot.add(ant);
    const antTip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), accentMat);
    antTip.position.set(0.19, 0.82, 0);
    headPivot.add(antTip);

    // ---- Legs ----
    const HIP_W = 0.30;
    const THIGH = 1.0, SHIN = 1.0;
    function buildLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * HIP_W, 0, 0);
      core.add(hip);
      hip.add(jointSphere(0.20, jointMat));

      const thigh = segment(THIGH, 0.22, 0.17, limbMat);
      hip.add(thigh);

      const knee = new THREE.Group();
      knee.position.y = -THIGH;
      hip.add(knee);
      knee.add(jointSphere(0.16, jointMat));

      const shin = segment(SHIN, 0.17, 0.12, limbMat);
      knee.add(shin);

      const ankle = new THREE.Group();
      ankle.position.y = -SHIN;
      knee.add(ankle);
      ankle.add(jointSphere(0.13, jointMat));

      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.18, 0.62), limbMat);
      foot.position.set(0, -0.09, 0.16);
      foot.castShadow = true;
      foot.receiveShadow = true;
      ankle.add(foot);

      return { hip: hip, knee: knee, ankle: ankle };
    }
    const leftLeg = buildLeg(1);
    const rightLeg = buildLeg(-1);

    // ---- Arms ----
    const SHOULDER_W = 0.46;
    const UARM = 0.82, FARM = 0.78;
    function buildArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * SHOULDER_W, 1.0, 0);
      core.add(shoulder);
      shoulder.add(jointSphere(0.16, jointMat));

      const upper = segment(UARM, 0.15, 0.12, limbMat);
      shoulder.add(upper);

      const elbow = new THREE.Group();
      elbow.position.y = -UARM;
      shoulder.add(elbow);
      elbow.add(jointSphere(0.12, jointMat));

      const fore = segment(FARM, 0.12, 0.09, limbMat);
      elbow.add(fore);

      const hand = jointSphere(0.13, bodyMat);
      hand.position.y = -FARM;
      elbow.add(hand);

      return { shoulder: shoulder, elbow: elbow };
    }
    const leftArm = buildArm(1);
    const rightArm = buildArm(-1);

    // ---------------------------------------------------------------------
    // Atmospheric dust motes
    // ---------------------------------------------------------------------
    const DUST = 420;
    const dustPos = new Float32Array(DUST * 3);
    const dustSeed = new Float32Array(DUST);
    for (let i = 0; i < DUST; i++) {
      dustPos[i * 3 + 0] = (Math.random() - 0.5) * 40;
      dustPos[i * 3 + 1] = Math.random() * 14;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
      dustSeed[i] = Math.random() * 100;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0x7fd8ff, size: 0.06, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    // ---------------------------------------------------------------------
    // Walk-cycle animation (forward kinematics)
    // ---------------------------------------------------------------------
    let walkPhase = 0;
    const WALK_FREQ = 2.4;          // radians / second
    const LEG_SWING = 0.55;
    const KNEE_BEND = 1.15;
    const ARM_SWING = 0.5;

    function updateWalk(dt) {
      walkPhase += dt * WALK_FREQ;
      const p = walkPhase;

      // Legs alternate. Negative X rotation => leg swings forward (+Z).
      leftLeg.hip.rotation.x  = -Math.sin(p) * LEG_SWING;
      rightLeg.hip.rotation.x = -Math.sin(p + Math.PI) * LEG_SWING;

      // Knees bend while the leg swings forward (foot lift / recovery).
      leftLeg.knee.rotation.x  = -Math.max(0,  Math.sin(p)) * KNEE_BEND;
      rightLeg.knee.rotation.x = -Math.max(0,  Math.sin(p + Math.PI)) * KNEE_BEND;

      // Ankle: small compensatory tilt, foot stays near-parallel to ground.
      leftLeg.ankle.rotation.x  =  Math.max(0,  Math.sin(p)) * 0.35 - 0.08;
      rightLeg.ankle.rotation.x =  Math.max(0,  Math.sin(p + Math.PI)) * 0.35 - 0.08;

      // Arms swing opposite to the legs on the same side.
      leftArm.shoulder.rotation.x  =  Math.sin(p) * ARM_SWING;
      rightArm.shoulder.rotation.x =  Math.sin(p + Math.PI) * ARM_SWING;
      leftArm.elbow.rotation.x  = -0.35 - Math.max(0, -Math.sin(p)) * 0.6;
      rightArm.elbow.rotation.x = -0.35 - Math.max(0, -Math.sin(p + Math.PI)) * 0.6;

      // Body: vertical bob (twice per stride), gentle forward lean + side sway.
      core.position.y = PELVIS_Y + Math.abs(Math.sin(p)) * 0.10 - 0.05;
      core.rotation.z = Math.sin(p) * 0.025;
      core.rotation.x = 0.05 + Math.sin(p * 2) * 0.02;

      // Head counter-bob / scanning.
      headPivot.rotation.y = Math.sin(p * 0.5) * 0.12;
      headPivot.rotation.x = 0.03 + Math.sin(p * 2 + 1.0) * 0.015;

      // Scroll ground to imply forward travel.
      gridTex.offset.y -= dt * 0.55;

      // Pulse the reactor / eyes subtly.
      const pulse = 1.4 + Math.sin(p * 2) * 0.5;
      reactor.material.emissiveIntensity = pulse;
      eyeMat.emissiveIntensity = 1.8 + Math.sin(p * 2 + 0.6) * 0.6;
    }

    // ---------------------------------------------------------------------
    // Camera orbit controls (drag + wheel, with auto-rotate)
    // ---------------------------------------------------------------------
    const target = new THREE.Vector3(0, 2.2, 0);
    let camRadius = 9.5, camTheta = 0.7, camPhi = 1.18;
    let dragging = false, lastX = 0, lastY = 0;
    let autoRotate = true;
    const el = renderer.domElement;

    el.addEventListener("pointerdown", function (e) {
      dragging = true; autoRotate = false; lastX = e.clientX; lastY = e.clientY;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointerup", function (e) {
      dragging = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    });
    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      camTheta -= dx * 0.005;
      camPhi = Math.max(0.35, Math.min(1.45, camPhi - dy * 0.005));
    });
    el.addEventListener("wheel", function (e) {
      e.preventDefault();
      camRadius = Math.max(4.5, Math.min(20, camRadius + e.deltaY * 0.01));
    }, { passive: false });

    function updateCamera(dt) {
      if (autoRotate) camTheta += dt * 0.12;
      const sinPhi = Math.sin(camPhi);
      camera.position.set(
        target.x + camRadius * sinPhi * Math.sin(camTheta),
        target.y + camRadius * Math.cos(camPhi),
        target.z + camRadius * sinPhi * Math.cos(camTheta)
      );
      camera.lookAt(target);
    }

    // ---------------------------------------------------------------------
    // Loop
    // ---------------------------------------------------------------------
    const clock = new THREE.Clock();
    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      updateWalk(dt);

      // dust drift
      const dp = dustGeo.attributes.position.array;
      for (let i = 0; i < DUST; i++) {
        dp[i * 3 + 1] += dt * 0.25 * (0.5 + Math.sin(dustSeed[i] + walkPhase * 0.3) * 0.5);
        dp[i * 3 + 0] += Math.sin(dustSeed[i] + walkPhase * 0.1) * dt * 0.05;
        if (dp[i * 3 + 1] > 14) dp[i * 3 + 1] = 0;
      }
      dustGeo.attributes.position.needsUpdate = true;

      updateCamera(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();

    // ---------------------------------------------------------------------
    // Resize
    // ---------------------------------------------------------------------
    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>
