<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automated Factory — Sim</title>
<style>
  :root{
    --bg0:#0b1020; --bg1:#141b34; --ink:#e8eefc; --dim:#8a98c0;
    --accent:#42e2b8; --accent2:#ffb454; --bad:#ff6b6b; --line:#27314f;
    --panel:rgba(20,27,52,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%,#1c2a52 0%,var(--bg0) 55%) fixed;
    color:var(--ink); overflow:hidden;
  }
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  header{
    display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(20,27,52,.9),rgba(20,27,52,.4));
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:36px;height:36px;border-radius:9px;
    background:conic-gradient(from 210deg,var(--accent),var(--accent2),#7aa2ff,var(--accent));
    box-shadow:0 0 18px rgba(66,226,184,.45);position:relative;
  }
  .logo::after{content:"";position:absolute;inset:8px;border-radius:4px;background:var(--bg0)}
  .title b{font-size:17px;letter-spacing:.5px}
  .title span{display:block;font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
  .spacer{flex:1}
  .stats{display:flex;gap:10px}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:7px 13px;min-width:96px;text-align:right;
  }
  .stat .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11px;color:var(--dim);font-weight:500}
  #stage{position:relative;flex:1;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  footer{
    display:flex;align-items:center;gap:14px;padding:12px 20px;
    border-top:1px solid var(--line);background:rgba(11,16,32,.7);backdrop-filter:blur(6px);
  }
  .btn{
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    padding:9px 16px;border-radius:9px;font-size:13px;cursor:pointer;font-weight:600;
    transition:.15s;display:flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:linear-gradient(180deg,#2bd6a6,#1ba882);color:#04130d;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08);color:#04130d}
  .ctl{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:12px}
  input[type=range]{width:150px;accent-color:var(--accent)}
  .legend{display:flex;gap:16px;margin-left:auto;color:var(--dim);font-size:11px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .pill{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:20px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div class="title"><b>AUTONOMA WORKS</b><span>Automated Factory Sim</span></div>
    </div>
    <div class="spacer"></div>
    <div class="stats">
      <div class="stat"><div class="k">Produced</div><div class="v" id="s-prod">0</div></div>
      <div class="stat"><div class="k">Rate / min</div><div class="v" id="s-rate">0</div></div>
      <div class="stat"><div class="k">In Transit</div><div class="v" id="s-trans">0</div></div>
      <div class="stat"><div class="k">Efficiency</div><div class="v" id="s-eff">100<small>%</small></div></div>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <footer>
    <button class="btn primary" id="b-play">⏸ Pause</button>
    <button class="btn" id="b-spawn">+ Boost Spawn</button>
    <button class="btn" id="b-jam">⚠ Test Jam</button>
    <div class="ctl">Speed <input type="range" id="speed" min="0.3" max="3" step="0.1" value="1"><span id="speed-v">1.0×</span></div>
    <div class="legend">
      <span><i style="background:#ffb454"></i>Ore</span>
      <span><i style="background:#7aa2ff"></i>Ingot</span>
      <span><i style="background:#42e2b8"></i>Gear</span>
      <span><i style="background:#ff6bd6"></i>Crate</span>
    </div>
    <span class="pill" id="clock">T+00:00</span>
  </footer>
</div>
<script>
(()=>{
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const stage=document.getElementById('stage');
  let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  function resize(){
    W=stage.clientWidth; H=stage.clientHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize); resize();

  // ---- Simulation model ---------------------------------------------------
  const TAU=Math.PI*2;
  let running=true, speed=1, t=0, produced=0, jamUntil=0;
  let rateWin=[]; // timestamps of produced items (for rate calc)

  // Stations laid out left -> right. Each belts segment connects them.
  const stations=[
    {id:'source', name:'EXTRACTOR', x:0.10, color:'#ffb454', kind:'source'},
    {id:'smelt',  name:'SMELTER',   x:0.34, color:'#7aa2ff', kind:'smelt'},
    {id:'assemble',name:'ASSEMBLER',x:0.58, color:'#42e2b8', kind:'assemble'},
    {id:'pack',   name:'PACKAGER',  x:0.82, color:'#ff6bd6', kind:'pack'},
  ];
  const items=[]; // {stage, x (0..1 along current belt), kind, born}
  // kind: ore -> ingot -> gear -> crate
  let spawnAcc=0, spawnRate=0.55; // items per second baseline
  let boost=1;

  // belt geometry
  function layout(){
    const beltY=H*0.56, beltH=46, r=Math.min(54,H*0.13);
    stations.forEach(s=>{ s.cx=s.x*W; s.cy=beltY; s.r=r; });
    return {beltY,beltH,r};
  }

  function spawnItem(){
    items.push({stage:0, x:0, kind:'ore', born:t, spin:Math.random()*TAU});
  }

  // advance simulation by dt seconds
  function step(dt){
    t+=dt;
    if(t<jamUntil) return; // jammed: belts frozen
    spawnAcc+=spawnRate*boost*dt;
    while(spawnAcc>=1){ spawnAcc-=1; spawnItem(); }

    const beltLen=0.24*W; // approx visual gap between stations
    const beltSpeed=0.32;  // fraction of belt per second
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.x+=beltSpeed*dt;
      it.spin+=dt*4;
      // station processing windows: item pauses near a station center, gets transformed
      const s=stations[it.stage];
      const arrive=0.92;
      if(it.x>=arrive){
        // transform at station
        if(it.stage<stations.length-1){
          if(it.kind==='ore'&&it.stage===0){ it.kind='ingot'; }
          else if(it.kind==='ingot'&&it.stage===1){ it.kind='gear'; }
          else if(it.kind==='gear'&&it.stage===2){ it.kind='crate'; }
          it.stage++;
          it.x=0; // start next belt
        } else {
          // final output
          produced++; rateWin.push(t);
          items.splice(i,1);
        }
      }
    }
    // prune rate window
    while(rateWin.length && t-rateWin[0]>15) rateWin.shift();
  }

  // ---- Rendering ----------------------------------------------------------
  function drawBelt(y,h){
    ctx.save();
    ctx.fillStyle='#0e1428';
    ctx.fillRect(0,y-h/2,W,h);
    // rails
    ctx.fillStyle='#1b2440';
    ctx.fillRect(0,y-h/2,W,4); ctx.fillRect(0,y+h/2-4,W,4);
    // moving chevrons
    const off=(t*60*speed)%40;
    ctx.strokeStyle='rgba(122,162,255,.25)'; ctx.lineWidth=3;
    for(let x=-40+off;x<W;x+=40){
      ctx.beginPath();
      ctx.moveTo(x,y-h*0.28); ctx.lineTo(x+12,y); ctx.lineTo(x,y+h*0.28);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStation(s,withGlow){
    const r=s.r;
    ctx.save();
    ctx.translate(s.cx,s.cy);
    // base plate
    ctx.fillStyle='#10182f';
    roundRect(-r-14,-r-14,(r+14)*2,(r+14)*2,14); ctx.fill();
    ctx.strokeStyle='var(--line)'; ctx.lineWidth=2; ctx.stroke();
    // glow ring
    if(withGlow){
      const g=ctx.createRadialGradient(0,0,r*0.2,0,0,r*1.5);
      g.addColorStop(0,s.color+'55'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*1.5,0,TAU); ctx.fill();
    }
    // body
    ctx.fillStyle='#16203c';
    roundRect(-r,-r,r*2,r*2,12); ctx.fill();
    ctx.strokeStyle=s.color; ctx.lineWidth=2.5; ctx.stroke();
    // rotating gear motif
    ctx.save();
    ctx.rotate((running&&t<jamUntil)? t*(running?2*speed:0):0);
    drawGear(0,0,r*0.62,s.color);
    ctx.restore();
    // label
    ctx.fillStyle='#cdd8f7'; ctx.font='700 11px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(s.name,0,r+22);
    ctx.restore();
  }

  function drawGear(x,y,R,col){
    const teeth=8;
    ctx.fillStyle=col;
    ctx.beginPath();
    for(let i=0;i<teeth;i++){
      const a=i/teeth*TAU, a2=(i+0.5)/teeth*TAU;
      ctx.lineTo(x+Math.cos(a)*R, y+Math.sin(a)*R);
      ctx.lineTo(x+Math.cos(a2)*R*1.18, y+Math.sin(a2)*R*1.18);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0b1020';
    ctx.beginPath(); ctx.arc(x,y,R*0.4,0,TAU); ctx.fill();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  const KIND={
    ore:{c:'#ffb454',label:'Ore'},
    ingot:{c:'#7aa2ff',label:'Ingot'},
    gear:{c:'#42e2b8',label:'Gear'},
    crate:{c:'#ff6bd6',label:'Crate'},
  };
  function drawItem(it){
    const prev=stations[it.stage];
    const next=stations[Math.min(it.stage+1,stations.length-1)];
    const x0=prev.cx+r_pad(), x1=next.cx-r_pad();
    const x=x0+(x1-x0)*it.x;
    const y=stations[0].cy;
    const k=KIND[it.kind];
    ctx.save(); ctx.translate(x,y);
    if(it.kind==='crate'){
      ctx.fillStyle=k.c; roundRect(-13,-13,26,26,4); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-13,-13);ctx.lineTo(13,13);ctx.moveTo(13,-13);ctx.lineTo(-13,13);ctx.stroke();
    } else if(it.kind==='gear'){
      ctx.rotate(it.spin); drawGear(0,0,11,k.c);
    } else if(it.kind==='ingot'){
      ctx.fillStyle=k.c; roundRect(-12,-7,24,14,4); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)'; roundRect(-12,-7,24,4,3); ctx.fill();
    } else {
      ctx.fillStyle=k.c; ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(0,0,4,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  function r_pad(){ return stations[0].r*0.9; }

  function drawSparkles(){
    // small particles at stations when active
    if(!running||t<jamUntil) return;
    stations.forEach((s,i)=>{
      if((i<s.kind.length)&&Math.random()<0.25*speed){
        // occasional spark
      }
    });
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const {beltY,beltH,r}=layout();
    // floor grid ambiance
    ctx.strokeStyle='rgba(122,162,255,.05)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    drawBelt(beltY,beltH);
    stations.forEach((s,i)=>{
      const active = running && t>=jamUntil && items.some(it=>it.stage===i);
      drawStation(s, active);
    });
    items.forEach(drawItem);
    // jam overlay
    if(t<jamUntil){
      ctx.fillStyle='rgba(255,107,107,.08)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ff6b6b'; ctx.font='700 22px Segoe UI'; ctx.textAlign='center';
      ctx.fillText('⚠ CONVEYOR JAM — RESOLVING', W/2, beltY-beltH);
    }
    drawSparkles();
    // throughput bar
    const maxRate=12;
    const rate=rateWin.length/15*60;
    const bw=220, bx=W-bw-24, by=24;
    ctx.fillStyle='rgba(11,16,32,.6)'; roundRect(bx,by,bw,10,5); ctx.fill();
    ctx.fillStyle='#42e2b8'; roundRect(bx,by,bw*Math.min(1,rate/maxRate),10,5); ctx.fill();
    ctx.fillStyle='#8a98c0'; ctx.font='600 10px Segoe UI'; ctx.textAlign='left';
    ctx.fillText('THROUGHPUT',bx,by-6);
  }

  // ---- UI -----------------------------------------------------------------
  const el=id=>document.getElementById(id);
  el('b-play').onclick=()=>{ running=!running; el('b-play').textContent=running?'⏸ Pause':'▶ Play'; };
  el('b-spawn').onclick=()=>{ boost=boost>=3?1:boost+1; el('b-spawn').textContent='+ Boost ×'+boost; };
  el('b-jam').onclick=()=>{ jamUntil=t+2.2; };
  el('speed').oninput=e=>{ speed=parseFloat(e.target.value); el('speed-v').textContent=speed.toFixed(1)+'×'; };

  function fmtClock(sec){
    const m=Math.floor(sec/60), s=Math.floor(sec%60);
    return 'T+'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  let uiAcc=0;
  function updateUI(dt){
    uiAcc+=dt;
    if(uiAcc<0.2) return; uiAcc=0;
    el('s-prod').textContent=produced;
    const rate=rateWin.length/15*60;
    el('s-rate').textContent=Math.round(rate);
    el('s-trans').textContent=items.length;
    const eff = (jamUntil>t)?0:100;
    el('s-eff').innerHTML=eff+'<small>%</small>';
    el('clock').textContent=fmtClock(t);
  }

  // ---- Loop ---------------------------------------------------------------
  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.1) dt=0.1;
    const sdt=dt*speed;
    if(running) step(sdt);
    render();
    updateUI(dt);
    requestAnimationFrame(loop);
  }
  // seed a few items so the factory looks alive immediately
  for(let i=0;i<5;i++){ t-=i*0.4; spawnItem(); t+=i*0.4; }
  items.forEach((it,i)=>{ it.x=i*0.18; it.stage=Math.min(3,Math.floor(i/2)); });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
