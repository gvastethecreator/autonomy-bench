<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    background: #05060b;
    color: #e8edf6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 2.5s ease;
  }

  /* Atmospheric backdrop that breathes with the time of day */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(120% 90% at 70% 8%, rgba(86,124,196,0.22), transparent 55%),
      radial-gradient(90% 70% at 22% 96%, rgba(40,196,176,0.14), transparent 60%),
      linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    transition: background 3s ease;
  }
  .sky::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1.6px 1.6px at 70% 20%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.4px 1.4px at 45% 60%, rgba(255,255,255,0.6), transparent 60%),
      radial-gradient(2.2px 2.2px at 85% 45%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1.2px 1.2px at 30% 75%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1.8px 1.8px at 60% 85%, rgba(255,255,255,0.6), transparent 60%);
    opacity: var(--star-opacity, 0.2);
    transition: opacity 3s ease;
  }

  /* Soft vignette + grain for depth */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 24px;
  }

  .clock-wrap {
    position: relative;
    width: min(74vmin, 460px);
    height: min(74vmin, 460px);
    border-radius: 50%;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.55));
  }

  /* Brushed-metal bezel */
  .bezel {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        #3a414f, #6c7689, #2c323d, #5a6376, #2a3039, #717c92, #313845, #3a414f);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.25),
      inset 0 -4px 10px rgba(0,0,0,0.6);
    padding: 14px;
  }
  .bezel-inner {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        #20242e, #454d5e, #1a1e27, #404857, #181c24, #4a5365, #1d212a, #20242e);
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,0.8),
      inset 0 -2px 4px rgba(255,255,255,0.12);
    padding: 8px;
  }

  .face {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background:
      radial-gradient(120% 120% at 50% 18%, #1b2230, #0c0f17 70%);
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.9),
      inset 0 0 120px rgba(60,120,200,0.06);
    overflow: hidden;
  }
  /* Glass dome highlight */
  .glass {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(60% 45% at 38% 24%, rgba(255,255,255,0.16), transparent 60%),
      radial-gradient(80% 80% at 70% 88%, rgba(0,0,0,0.35), transparent 65%);
    pointer-events: none;
  }

  svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eaf2ff, #6aa0ff 60%, #1a3b78);
    box-shadow: 0 0 12px rgba(106,160,255,0.9), 0 0 2px #fff;
    z-index: 6;
  }

  .digital {
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    user-select: none;
  }
  .time {
    font-size: clamp(28px, 6vmin, 44px);
    font-weight: 300;
    letter-spacing: 0.12em;
    font-variant-numeric: tabular-nums;
    color: #eaf1ff;
    text-shadow: 0 0 18px rgba(106,160,255,0.45);
  }
  .time b { font-weight: 600; color: #9fc2ff; }
  .meta {
    font-size: clamp(12px, 2.6vmin, 15px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8fa3c4;
  }
  .phase {
    margin-top: 2px;
    font-size: clamp(11px, 2.2vmin, 13px);
    letter-spacing: 0.22em;
    color: #c79bff;
    opacity: 0.85;
  }

  /* Ambient glow pulsing under the clock */
  .glow {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(106,160,255,0.4), transparent);
    filter: blur(8px);
    z-index: 1;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.45; transform: translateX(-50%) scaleX(0.9); }
    50%      { opacity: 0.75; transform: translateX(-50%) scaleX(1.08); }
  }

  .hint {
    position: fixed;
    bottom: 14px;
    width: 100%;
    text-align: center;
    z-index: 4;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(180,196,224,0.35);
  }
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="clock-wrap">
      <div class="bezel"></div>
      <div class="bezel-inner"></div>
      <div class="face">
        <svg id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <div class="glass"></div>
      </div>
      <div class="center-dot"></div>
      <div class="glow"></div>
    </div>

    <div class="digital">
      <div class="time" id="time">--:--:--</div>
      <div class="meta" id="date">—</div>
      <div class="phase" id="phase">—</div>
    </div>
  </div>

  <div class="hint">live · aurora clock</div>

<script>
(function () {
  "use strict";

  var dial = document.getElementById("dial");
  var SVGNS = "http://www.w3.org/2000/svg";
  var CX = 100, CY = 100;

  // Build the dial: minute ticks, hour ticks, numerals, and an aurora arc.
  function buildDial() {
    var frag = document.createDocumentFragment();

    // Outer minute ring
    for (var i = 0; i < 60; i++) {
      var ang = (i / 60) * Math.PI * 2;
      var isHour = i % 5 === 0;
      var rOuter = 92;
      var rInner = isHour ? 80 : 86;
      var x1 = CX + Math.sin(ang) * rOuter;
      var y1 = CY - Math.cos(ang) * rOuter;
      var x2 = CX + Math.sin(ang) * rInner;
      var y2 = CY - Math.cos(ang) * rInner;
      var line = document.createElementNS(SVGNS, "line");
      line.setAttribute("x1", x1.toFixed(2));
      line.setAttribute("y1", y1.toFixed(2));
      line.setAttribute("x2", x2.toFixed(2));
      line.setAttribute("y2", y2.toFixed(2));
      line.setAttribute("stroke", isHour ? "#aeb9d0" : "#46506a");
      line.setAttribute("stroke-width", isHour ? 2.4 : 1);
      line.setAttribute("stroke-linecap", "round");
      frag.appendChild(line);
    }

    // Roman-ish hour numerals
    var labels = ["XII","I","II","III","IIII","V","VI","VII","VIII","IX","X","XI"];
    for (var h = 0; h < 12; h++) {
      var a = (h / 12) * Math.PI * 2;
      var r = 66;
      var tx = CX + Math.sin(a) * r;
      var ty = CY - Math.cos(a) * r + 4;
      var t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", tx.toFixed(2));
      t.setAttribute("y", ty.toFixed(2));
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("fill", "#cdd7ec");
      t.setAttribute("font-size", "11");
      t.setAttribute("font-family", "Georgia, 'Times New Roman', serif");
      t.setAttribute("letter-spacing", "0.5");
      t.setAttribute("opacity", "0.92");
      t.textContent = labels[h];
      frag.appendChild(t);
    }

    // Decorative aurora arc near the top
    var arc = document.createElementNS(SVGNS, "path");
    var d = "M 30 70 Q 100 30 170 70";
    arc.setAttribute("d", d);
    arc.setAttribute("fill", "none");
    arc.setAttribute("stroke", "url(#aurora)");
    arc.setAttribute("stroke-width", "2.2");
    arc.setAttribute("stroke-linecap", "round");
    arc.setAttribute("opacity", "0.55");
    frag.appendChild(arc);

    // Gradient defs
    var defs = document.createElementNS(SVGNS, "defs");
    var grad = document.createElementNS(SVGNS, "linearGradient");
    grad.setAttribute("id", "aurora");
    grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0");
    grad.setAttribute("x2", "1"); grad.setAttribute("y2", "0");
    var stops = [
      ["0%", "#56c4b0"], ["50%", "#6aa0ff"], ["100%", "#c79bff"]
    ];
    stops.forEach(function (s) {
      var st = document.createElementNS(SVGNS, "stop");
      st.setAttribute("offset", s[0]);
      st.setAttribute("stop-color", s[1]);
      grad.appendChild(st);
    });
    defs.appendChild(grad);
    frag.appendChild(defs);

    dial.appendChild(frag);
  }

  // Hand elements
  function makeHand(cls, width, length, color) {
    var g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", cls);
    var rect = document.createElementNS(SVGNS, "rect");
    rect.setAttribute("x", CX - width / 2);
    rect.setAttribute("y", CY - length);
    rect.setAttribute("width", width);
    rect.setAttribute("height", length);
    rect.setAttribute("rx", width / 2);
    rect.setAttribute("fill", color);
    g.appendChild(rect);
    // Tail
    var tail = document.createElementNS(SVGNS, "rect");
    tail.setAttribute("x", CX - width / 3);
    tail.setAttribute("y", CY);
    tail.setAttribute("width", (width * 2) / 3);
    tail.setAttribute("height", length * 0.18);
    tail.setAttribute("rx", width / 3);
    tail.setAttribute("fill", color);
    g.appendChild(tail);
    dial.appendChild(g);
    return g;
  }

  buildDial();
  var hourHand = makeHand("hour", 6, 52, "#e8edf6");
  var minHand  = makeHand("min", 4, 74, "#cdd7ec");
  var secHand  = makeHand("sec", 1.8, 84, "#6aa0ff");
  secHand.style.filter = "drop-shadow(0 0 4px rgba(106,160,255,0.9))";

  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var phaseEl = document.getElementById("phase");
  var sky = document.getElementById("sky");

  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function phaseFor(h) {
    if (h < 5) return ["Late Night", "#3b4a78", "#0a0f1f", 0.55];
    if (h < 8) return ["Dawn", "#9a6db0", "#2a2f4a", 0.30];
    if (h < 12) return ["Morning", "#7fa8d8", "#1a2740", 0.10];
    if (h < 17) return ["Afternoon", "#6aa0ff", "#16223d", 0.06];
    if (h < 20) return ["Evening", "#c79bff", "#241a3a", 0.28];
    if (h < 23) return ["Dusk", "#6d5aa8", "#140d24", 0.45];
    return ["Night", "#3b4a78", "#0a0f1f", 0.55];
  }

  var lastMin = -1;

  function render() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();
    var ms = now.getMilliseconds();

    // Smooth sweeping angles (continuous for second hand)
    var secAngle = (s + ms / 1000) * 6;
    var minAngle = (m + s / 60) * 6;
    var hourAngle = ((h % 12) + m / 60 + s / 3600) * 30;

    hourHand.setAttribute("transform", "rotate(" + hourAngle.toFixed(3) + " 100 100)");
    minHand.setAttribute("transform", "rotate(" + minAngle.toFixed(3) + " 100 100)");
    secHand.setAttribute("transform", "rotate(" + secAngle.toFixed(3) + " 100 100)");

    if (m !== lastMin) {
      lastMin = m;
      var ampm = h < 12 ? "AM" : "PM";
      var h12 = h % 12; if (h12 === 0) h12 = 12;
      timeEl.innerHTML = h12 + "<b>:</b>" + pad(m) + "<b>:</b>" + pad(s) + " " + ampm;
      dateEl.textContent = days[now.getDay()] + " · " + months[now.getMonth()] + " " + now.getDate();
    } else {
      // keep seconds fresh
      var ampm2 = h < 12 ? "AM" : "PM";
      var h12b = h % 12; if (h12b === 0) h12b = 12;
      timeEl.innerHTML = h12b + "<b>:</b>" + pad(m) + "<b>:</b>" + pad(s) + " " + ampm2;
    }

    var ph = phaseFor(h);
    phaseEl.textContent = ph[0];
    sky.style.setProperty("--sky-top", ph[1]);
    sky.style.setProperty("--sky-bottom", ph[2]);
    sky.style.setProperty("--star-opacity", ph[3]);
    sky.style.background =
      "radial-gradient(120% 90% at 70% 8%, rgba(86,124,196,0.22), transparent 55%)," +
      "radial-gradient(90% 70% at 22% 96%, rgba(40,196,176,0.14), transparent 60%)," +
      "linear-gradient(180deg, " + ph[1] + ", " + ph[2] + ")";

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
