<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in the Void</title>
<style>
  :root {
    --bg: #0a0a14;
    --bg2: #12122a;
    --accent: #6c8cff;
    --accent2: #ff6cae;
    --text: #e8eaf6;
    --muted: #8a8fb0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* drifting starfield */
  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.6;
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(0); }
    to   { transform: translateY(120px); }
  }
  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 640px;
  }
  .code {
    font-size: clamp(6rem, 22vw, 14rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.05em;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
    user-select: none;
  }
  /* glitch layers */
  .code::before, .code::after {
    content: "404";
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    clip-path: inset(0 0 0 0);
  }
  .code::before { animation: glitch1 2.6s infinite steps(2); }
  .code::after  { animation: glitch2 3.1s infinite steps(2); }
  @keyframes glitch1 {
    0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
    93% { transform: translate(-4px, 2px); opacity: 0.8; }
    96% { transform: translate(4px, -2px); opacity: 0.6; }
  }
  @keyframes glitch2 {
    0%, 90%, 100% { transform: translate(0,0); opacity: 0; }
    91% { transform: translate(3px, -1px); opacity: 0.7; }
    95% { transform: translate(-3px, 1px); opacity: 0.5; }
  }
  .title {
    font-size: clamp(1.3rem, 4vw, 2rem);
    margin-top: 0.5rem;
    font-weight: 700;
  }
  .sub {
    color: var(--muted);
    margin-top: 0.75rem;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    line-height: 1.5;
  }
  .actions {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  button, .link {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--text);
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    text-decoration: none;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  button:hover, .link:hover {
    transform: translateY(-2px);
    background: rgba(108,140,255,0.15);
    box-shadow: 0 6px 24px rgba(108,140,255,0.25);
  }
  .link {
    border-color: var(--muted);
  }
  .hint {
    margin-top: 1.75rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .hint kbd {
    background: #1c1c38;
    border: 1px solid #34345a;
    border-radius: 6px;
    padding: 0.1rem 0.5rem;
    color: var(--text);
  }
  /* konami / easter egg message */
  .egg {
    position: fixed;
    bottom: 1.2rem;
    left: 50%;
    transform: translateX(-50%);
    color: var(--accent2);
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity .4s ease;
    z-index: 2;
  }
  .egg.show { opacity: 1; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="wrap">
    <div class="code" id="code">404</div>
    <h1 class="title">This page drifted into the void</h1>
    <p class="sub">
      The coordinates you requested don't map to anything here.
      The link may be broken, the page may have moved, or you typed a wish.
    </p>
    <div class="actions">
      <a class="link" href="/">← Take me home</a>
      <button id="randomBtn">Surprise me</button>
    </div>
    <p class="hint">Press <kbd>R</kbd> to roll the dice · try the <kbd>↑ ↑ ↓ ↓</kbd> thing</p>
  </div>

  <div class="egg" id="egg">✦ You found the secret corridor. The void waves back. ✦</div>

<script>
  // Starfield
  const starsEl = document.getElementById('stars');
  const starCount = 70;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    const dur = 4 + Math.random() * 8;
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = (-Math.random() * dur) + 's';
    s.style.opacity = 0.2 + Math.random() * 0.6;
    starsEl.appendChild(s);
  }

  const fun = [
    "Maybe the page is just shy.",
    "A black hole ate it. Probably.",
    "This URL goes nowhere. Like my plans on a Monday.",
    "Lost, but make it aesthetic.",
    "The internet's equivalent of a wrong turn.",
    "HTTP status: confused.",
    "Plot twist: there was never a page here.",
    "It was here a second ago, promise."
  ];
  const subEl = document.querySelector('.sub');
  const originalSub = subEl.textContent;

  function surprise() {
    subEl.style.opacity = 0;
    setTimeout(() => {
      subEl.textContent = fun[Math.floor(Math.random() * fun.length)];
      subEl.style.opacity = 1;
    }, 200);
  }
  subEl.style.transition = 'opacity .2s ease';
  document.getElementById('randomBtn').addEventListener('click', surprise);

  // Press R
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'r') surprise();
  });

  // Konami-ish easter egg
  const eggSeq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown'];
  let eggProg = 0;
  const eggEl = document.getElementById('egg');
  document.addEventListener('keydown', (e) => {
    if (e.key === eggSeq[eggProg]) {
      eggProg++;
      if (eggProg === eggSeq.length) {
        eggEl.classList.add('show');
        document.body.style.boxShadow = 'inset 0 0 120px rgba(255,108,174,0.25)';
        setTimeout(() => eggEl.classList.remove('show'), 3500);
        eggProg = 0;
      }
    } else {
      eggProg = (e.key === eggSeq[0]) ? 1 : 0;
    }
  });
</script>
</body>
</html>
