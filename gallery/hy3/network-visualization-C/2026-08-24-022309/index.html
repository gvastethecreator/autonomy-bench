<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHERNET — Global Network Topology</title>
<style>
  :root {
    --bg0: #04060d;
    --bg1: #0a1020;
    --cyan: #38e1ff;
    --gold: #ffd166;
    --green: #5dffa0;
    --magenta: #ff5d8f;
    --violet: #9d7bff;
    --ink: #cfe3ff;
    --dim: #6f86b3;
    --glass: rgba(14, 22, 40, 0.55);
    --glassline: rgba(120, 170, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg0);
    color: var(--ink);
    font-family: "SF Mono", "JetBrains Mono", "Consolas", ui-monospace, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: block; }

  .panel {
    position: fixed;
    background: var(--glass);
    border: 1px solid var(--glassline);
    border-radius: 14px;
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    pointer-events: auto;
  }

  /* Header */
  #header {
    top: 18px; left: 18px; padding: 14px 18px 13px;
    min-width: 280px;
  }
  #header .kicker {
    font-size: 10px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase;
  }
  #header h1 {
    margin: 4px 0 2px; font-size: 21px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #header .sub { font-size: 11px; color: var(--dim); letter-spacing: 0.5px; }

  /* Stats bar */
  #stats {
    top: 18px; right: 18px; padding: 12px 16px; display: flex; gap: 22px;
  }
  #stats .stat { text-align: center; min-width: 56px; }
  #stats .stat .v { font-size: 18px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }
  #stats .stat .l { font-size: 9px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; margin-top: 2px; }
  #stats .stat.g .v { color: var(--green); }
  #stats .stat.m .v { color: var(--magenta); }

  /* Legend */
  #legend {
    left: 18px; bottom: 18px; padding: 12px 14px; font-size: 11px;
  }
  #legend .title { font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  #legend .row { display: flex; align-items: center; gap: 9px; margin: 5px 0; cursor: pointer; user-select: none; transition: opacity .2s; }
  #legend .row.off { opacity: 0.32; }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 8px currentColor; }
  #legend .row .n { color: var(--ink); }
  #legend .row .c { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* Controls */
  #controls {
    right: 18px; bottom: 18px; padding: 12px 14px; width: 212px;
  }
  #controls .title { font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
  #controls .ctl { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; font-size: 11px; }
  #controls button {
    font-family: inherit; font-size: 11px; color: var(--ink);
    background: rgba(56,225,255,0.08); border: 1px solid var(--glassline);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; transition: all .15s;
  }
  #controls button:hover { background: rgba(56,225,255,0.18); border-color: var(--cyan); }
  #controls button.active { background: rgba(56,225,255,0.28); border-color: var(--cyan); color: #fff; }
  #controls input[type=range] { width: 110px; accent-color: var(--cyan); cursor: pointer; }
  #controls .seg { display: flex; gap: 6px; }
  #controls .seg button { flex: 1; padding: 5px 0; }

  /* Info panel */
  #info {
    right: 18px; top: 130px; width: 240px; padding: 14px 16px; opacity: 0; transform: translateY(-6px);
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  #info.show { opacity: 1; transform: translateY(0); }
  #info .id { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  #info .type { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin: 3px 0 10px; }
  #info .kv { display: flex; justify-content: space-between; font-size: 11px; margin: 5px 0; }
  #info .kv .k { color: var(--dim); }
  #info .kv .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  #info .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 3px; overflow: hidden; }
  #info .bar > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--gold)); }

  /* Tooltip */
  #tip {
    position: fixed; pointer-events: none; padding: 5px 9px; font-size: 11px;
    background: rgba(8,14,28,0.92); border: 1px solid var(--glassline); border-radius: 7px;
    color: var(--ink); transform: translate(-50%, -140%); white-space: nowrap; opacity: 0;
    transition: opacity .12s; z-index: 20; box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  #tip .t { color: var(--dim); font-size: 9px; letter-spacing: 1px; }

  /* Hint */
  #hint {
    left: 50%; bottom: 18px; transform: translateX(-50%); padding: 7px 14px; font-size: 10px;
    color: var(--dim); letter-spacing: 0.5px; border-radius: 20px;
  }
  #hint b { color: var(--ink); font-weight: 600; }

  .pulse-rec { color: var(--green); }
  @media (max-width: 720px) {
    #stats { gap: 12px; padding: 8px 10px; }
    #info { display: none; }
    #header { min-width: 0; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="header" class="panel">
  <div class="kicker">Live Telemetry</div>
  <h1>AETHERNET</h1>
  <div class="sub">Autonomous global routing fabric · 6 tiers · realtime</div>
</div>

<div id="stats" class="panel">
  <div class="stat"><div class="v" id="s-nodes">0</div><div class="l">Nodes</div></div>
  <div class="stat"><div class="v" id="s-links">0</div><div class="l">Links</div></div>
  <div class="stat g"><div class="v" id="s-pkts">0</div><div class="l">In&nbsp;Flight</div></div>
  <div class="stat m"><div class="v" id="s-rate">0</div><div class="l">Pkt&nbsp;/&nbsp;s</div></div>
</div>

<div id="legend" class="panel">
  <div class="title">Node Tiers</div>
  <div id="legend-rows"></div>
</div>

<div id="controls" class="panel">
  <div class="title">Controls</div>
  <div class="ctl"><span>Packets</span><button id="t-pk" class="active">ON</button></div>
  <div class="ctl"><span>Labels</span><button id="t-lb" class="active">ON</button></div>
  <div class="ctl"><span>Pulse</span><button id="t-pl" class="active">ON</button></div>
  <div class="ctl"><span>Flow</span><button id="t-pause">RUN</button></div>
  <div class="ctl"><span>Speed</span><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></div>
  <div class="ctl" style="margin-top:10px"><span>View</span>
    <div class="seg">
      <button id="v-reset">FIT</button>
      <button id="v-rotate">ORBIT</button>
    </div>
  </div>
</div>

<div id="info" class="panel">
  <div class="id" id="i-id">—</div>
  <div class="type" id="i-type">—</div>
  <div class="kv"><span class="k">Tier</span><span class="v" id="i-tier">—</span></div>
  <div class="kv"><span class="k">Links</span><span class="v" id="i-links">—</span></div>
  <div class="kv"><span class="k">Load</span><span class="v" id="i-load">—</span></div>
  <div class="bar"><i id="i-bar" style="width:0%"></i></div>
  <div class="kv" style="margin-top:10px"><span class="k">Throughput</span><span class="v" id="i-thr">—</span></div>
  <div class="kv"><span class="k">Status</span><span class="v pulse-rec" id="i-status">NOMINAL</span></div>
</div>

<div id="tip"><div id="tip-name">—</div><div class="t" id="tip-type">—</div></div>
<div id="hint" class="panel"><b>Hover</b> to inspect · <b>Click</b> to lock · <b>Drag</b> to pan · <b>Scroll</b> to zoom</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // ---------- deterministic PRNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(20260824);
  const rnd = (a, b) => a + (b - a) * rng();
  const pick = (arr) => arr[(rng() * arr.length) | 0];

  // ---------- tier definitions ----------
  const TIERS = [
    { id: 0, key: "core",    name: "Core Router", color: "#ffd166", r: 23, amp: 5,  count: 3,  locs: ["NYC","LDN","TKO"] },
    { id: 1, key: "router",  name: "Edge Router", color: "#38e1ff", r: 14, amp: 8,  count: 9,  locs: ["LAX","FRA","SIN","SAO","SYD","JNB","DXB","PAR","YVR"] },
    { id: 2, key: "server",  name: "Data Node",   color: "#5dffa0", r: 10, amp: 11, count: 16, locs: null },
    { id: 3, key: "switch",  name: "Fabric SW",   color: "#9d7bff", r: 7,  amp: 14, count: 24, locs: null },
    { id: 4, key: "client",  name: "Endpoint",    color: "#ff5d8f", r: 4.5,amp: 18, count: 46, locs: null },
    { id: 5, key: "iot",     name: "IoT Sensor",  color: "#7fb4ff", r: 2.6,amp: 22, count: 34, locs: null },
  ];
  const TRAFFIC = [
    { key: "data",  color: "#38e1ff", w: 1.4 },
    { key: "query", color: "#5dffa0", w: 1.1 },
    { key: "bulk",  color: "#ffd166", w: 1.8 },
    { key: "alert", color: "#ff5d8f", w: 1.6 },
  ];

  let nodes = [];
  let edges = [];
  let adj = []; // adjacency list of edge indices per node
  let maxR = 1;

  function buildNetwork() {
    nodes = []; edges = [];
    const rings = [0, 200, 360, 520, 700, 860];
    let idc = 0;
    const byTier = [];
    // create nodes per tier on concentric rings with clustering
    TIERS.forEach((tier, ti) => {
      const group = [];
      for (let i = 0; i < tier.count; i++) {
        // distribute angularly; outer tiers get more spread
        const baseAng = (i / tier.count) * Math.PI * 2 + rnd(-0.25, 0.25);
        const radius = rings[ti] + rnd(-tier.amp * 1.2, tier.amp * 1.2);
        const x = Math.cos(baseAng) * radius;
        const y = Math.sin(baseAng) * radius * 0.82; // slight oval for composition
        const loc = tier.locs ? tier.locs[i % tier.locs.length] : null;
        const label = tier.locs
          ? `${tier.key.toUpperCase()}-${loc}`
          : `${tier.key.toUpperCase()}-${(i + 1).toString().padStart(2, "0")}`;
        const n = {
          id: idc++, tier: ti, x, y, bx: x, by: y,
          r: tier.r, color: tier.color, label,
          phase: rnd(0, Math.PI * 2), spd: rnd(0.15, 0.4), amp: tier.amp,
          load: rnd(0.2, 0.85), lphase: rnd(0, Math.PI * 2),
          pulse: 0,
        };
        group.push(n); nodes.push(n);
      }
      byTier.push(group);
    });

    function addEdge(a, b, kind) {
      if (a === b) return;
      // avoid duplicates
      for (const e of edges) if ((e.a === a && e.b === b) || (e.a === b && e.b === a)) return;
      const t = TRAFFIC[kind !== undefined ? kind : (rng() * TRAFFIC.length) | 0];
      edges.push({ a, b, color: t.color, w: t.w, flow: rnd(0.4, 1), traffic: t.key });
    }

    // hierarchical connections
    // core fully meshed
    for (let i = 0; i < byTier[0].length; i++)
      for (let j = i + 1; j < byTier[0].length; j++) addEdge(byTier[0][i].id, byTier[0][j].id, 2);

    // routers -> nearest core(s)
    byTier[1].forEach((r) => {
      const cores = byTier[0].slice().sort((p, q) =>
        (p.x - r.x) ** 2 + (p.y - r.y) ** 2 - ((q.x - r.x) ** 2 + (q.y - r.y) ** 2));
      addEdge(r.id, cores[0].id, 2);
      if (rng() < 0.5) addEdge(r.id, cores[1 % cores.length].id, 2);
    });

    // servers -> a router (by nearest angle cluster) + occasional router-router mesh
    byTier[2].forEach((s) => {
      const rs = byTier[1].slice().sort((p, q) =>
        (p.x - s.x) ** 2 + (p.y - s.y) ** 2 - ((q.x - s.x) ** 2 + (q.y - s.y) ** 2));
      addEdge(s.id, rs[0].id, 1);
      if (rng() < 0.25) addEdge(s.id, rs[1 % rs.length].id, 1);
    });
    for (let i = 0; i < byTier[1].length; i++)
      if (rng() < 0.4) addEdge(byTier[1][i].id, byTier[1][(i + 1) % byTier[1].length].id, 0);

    // switches -> server + a peer switch
    byTier[3].forEach((sw) => {
      const ss = byTier[2].slice().sort((p, q) =>
        (p.x - sw.x) ** 2 + (p.y - sw.y) ** 2 - ((q.x - sw.x) ** 2 + (q.y - sw.y) ** 2));
      addEdge(sw.id, ss[0].id, 1);
      if (rng() < 0.6) addEdge(sw.id, ss[(1) % ss.length].id, 1);
    });
    for (let i = 0; i < byTier[3].length; i++)
      if (rng() < 0.3) addEdge(byTier[3][i].id, byTier[3][(i + 3) % byTier[3].length].id, 0);

    // clients -> switch (nearest) + some to servers
    byTier[4].forEach((c) => {
      const sws = byTier[3].slice().sort((p, q) =>
        (p.x - c.x) ** 2 + (p.y - c.y) ** 2 - ((q.x - c.x) ** 2 + (q.y - c.y) ** 2));
      addEdge(c.id, sws[0].id, 0);
      if (rng() < 0.12) addEdge(c.id, sws[1 % sws.length].id, 0);
    });

    // iot -> switch or client
    byTier[5].forEach((d) => {
      const targets = rng() < 0.6 ? byTier[3] : byTier[4];
      const ts = targets.slice().sort((p, q) =>
        (p.x - d.x) ** 2 + (p.y - d.y) ** 2 - ((q.x - d.x) ** 2 + (q.y - d.y) ** 2));
      addEdge(d.id, ts[0].id, 0);
    });

    // build adjacency
    adj = nodes.map(() => []);
    edges.forEach((e, idx) => { adj[e.a].push(idx); adj[e.b].push(idx); });

    // bounding radius
    maxR = 0;
    nodes.forEach((n) => { maxR = Math.max(maxR, Math.hypot(n.x, n.y)); });
    maxR += 60;
  }

  // ---------- camera ----------
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0, zoom: 1, tzoom: 1, rot: 0, torot: 0 };
  let worldAngle = 0; // global orbit rotation (visual only)

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function fitView() {
    const margin = 0.86;
    cam.zoom = cam.tzoom = (Math.min(W, H) * 0.5 * margin) / maxR;
    cam.x = 0; cam.y = 0; cam.rot = cam.torot = 0; worldAngle = 0;
  }

  // world -> screen (apply global orbit rotation for life)
  function worldToScreen(wx, wy) {
    const ca = Math.cos(worldAngle), sa = Math.sin(worldAngle);
    const rx = wx * ca - wy * sa;
    const ry = wx * sa + wy * ca;
    return {
      x: (rx - cam.x) * cam.zoom + W / 2,
      y: (ry - cam.y) * cam.zoom + H / 2,
    };
  }
  function screenToWorld(sx, sy) {
    const wx = (sx - W / 2) / cam.zoom + cam.x;
    const wy = (sy - H / 2) / cam.zoom + cam.y;
    const ca = Math.cos(-worldAngle), sa = Math.sin(-worldAngle);
    return { x: wx * ca - wy * sa, y: wx * sa + wy * ca };
  }

  // ---------- packets ----------
  let packets = [];
  const MAX_PK = 150;
  let packetRateAcc = 0;
  let packetsThisSec = 0, rateDisplay = 0, rateTimer = 0;

  function spawnPacket() {
    if (packets.length >= MAX_PK) return;
    const ei = (rng() * edges.length) | 0;
    const e = edges[ei];
    const dir = rng() < 0.5 ? 1 : -1;
    packets.push({
      e: ei, t: 0, dir,
      spd: rnd(0.18, 0.42) * (0.6 + e.flow * 0.8),
      color: e.color, size: rnd(1.4, 2.6),
    });
    packetsThisSec++;
  }

  // ---------- effects (ripples) ----------
  let ripples = [];
  function addRipple(x, y, color, max) {
    ripples.push({ x, y, color, r: 2, max: max || 36, life: 1 });
  }

  // ---------- interaction state ----------
  let hoverNode = -1, selectedNode = -1;
  let mouse = { x: -1, y: -1, inside: false };
  let dragging = false, dragMoved = false, last = { x: 0, y: 0 };
  const layerOn = [true, true, true, true, true, true];
  let showPackets = true, showLabels = true, showPulse = true, paused = false;
  let speedMul = 1;

  // ---------- helpers ----------
  function bez(a, c, b, t) {
    const u = 1 - t;
    return {
      x: u * u * a.x + 2 * u * t * c.x + t * t * b.x,
      y: u * u * a.y + 2 * u * t * c.y + t * t * b.y,
    };
  }
  function edgeCtrl(e) {
    const A = nodes[e.a], B = nodes[e.b];
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy) || 1;
    const off = Math.min(40, len * 0.16);
    return { x: mx - (dy / len) * off, y: my + (dx / len) * off };
  }

  // ---------- main loop ----------
  let lastT = performance.now();
  let pulseClock = 0;

  function frame(now) {
    let dt = (now - lastT) / 1000; lastT = now;
    if (dt > 0.05) dt = 0.05;
    const sdt = dt * speedMul * (paused ? 0 : 1);

    // smooth camera
    cam.zoom += (cam.tzoom - cam.zoom) * Math.min(1, dt * 6);
    cam.rot += (cam.torot - cam.rot) * Math.min(1, dt * 4);
    if (orbitOn) worldAngle += sdt * 0.06;
    pulseClock += sdt;

    // node drift
    for (const n of nodes) {
      n.x = n.bx + Math.sin(pulseClock * n.spd + n.phase) * n.amp;
      n.y = n.by + Math.cos(pulseClock * n.spd * 0.8 + n.phase) * n.amp;
      if (n.pulse > 0) n.pulse = Math.max(0, n.pulse - dt * 1.6);
      n.load = 0.42 + 0.4 * (0.5 + 0.5 * Math.sin(now * 0.0006 + n.lphase));
    }

    // spawn packets
    if (showPackets && !paused) {
      packetRateAcc += sdt * 26;
      while (packetRateAcc >= 1) { spawnPacket(); packetRateAcc -= 1; }
    }
    // update packets
    for (let i = packets.length - 1; i >= 0; i--) {
      const p = packets[i];
      p.t += p.spd * sdt;
      if (p.t >= 1) {
        if (p.color === "#ff5d8f") {
          const dest = p.dir > 0 ? edges[p.e].b : edges[p.e].a;
          const ds = worldToScreen(nodes[dest].x, nodes[dest].y);
          addRipple(ds.x, ds.y, p.color, 30);
          nodes[dest].pulse = 1;
        }
        packets.splice(i, 1);
      }
    }
    // ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += dt * 42; r.life -= dt * 1.4;
      if (r.life <= 0) ripples.splice(i, 1);
    }

    // rate display
    rateTimer += dt;
    if (rateTimer >= 1) { rateDisplay = packetsThisSec; packetsThisSec = 0; rateTimer = 0; }

    draw();
    updateHUD();
    requestAnimationFrame(frame);
  }

  // ---------- drawing ----------
  function draw() {
    // background
    const g = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#0b1430");
    g.addColorStop(0.5, "#070d1c");
    g.addColorStop(1, "#03050c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    drawBackdrop();

    // compute screen positions
    const sp = nodes.map((n) => worldToScreen(n.x, n.y));

    const hovered = hoverNode >= 0 ? hoverNode : selectedNode;
    const hi = new Set();
    if (hovered >= 0) {
      hi.add(hovered);
      for (const ei of adj[hovered]) {
        const e = edges[ei];
        hi.add(e.a); hi.add(e.b);
      }
    }
    const dim = hovered >= 0;

    // ---- edges ----
    ctx.lineCap = "round";
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (!layerOn[nodes[e.a].tier] || !layerOn[nodes[e.b].tier]) continue;
      const A = sp[e.a], B = sp[e.b];
      const C = bez(A, edgeCtrlScreen(e, sp), B, 0.5);
      const isHi = hovered >= 0 && (e.a === hovered || e.b === hovered);
      const baseA = dim ? (isHi ? 0.55 : 0.05) : (0.10 + e.flow * 0.10);
      ctx.globalCompositeOperation = "lighter";
      // soft wide
      ctx.strokeStyle = hexA(e.color, baseA * 0.5);
      ctx.lineWidth = e.w * cam.zoom * 0.9 + 0.6;
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(C.x, C.y, B.x, B.y); ctx.stroke();
      // bright core
      ctx.strokeStyle = hexA(e.color, baseA + (isHi ? 0.5 : 0));
      ctx.lineWidth = Math.max(0.6, e.w * 0.5);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(C.x, C.y, B.x, B.y); ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }

    // ---- packets ----
    if (showPackets) {
      ctx.globalCompositeOperation = "lighter";
      for (const p of packets) {
        const e = edges[p.e];
        if (!layerOn[nodes[e.a].tier] || !layerOn[nodes[e.b].tier]) continue;
        const A = sp[e.a], B = sp[e.b], C = edgeCtrlScreen(e, sp);
        const tt = p.dir > 0 ? p.t : 1 - p.t;
        const pos = bez(A, C, B, tt);
        const isHi = hovered >= 0 && (e.a === hovered || e.b === hovered);
        const al = dim ? (isHi ? 1 : 0.12) : 1;
        const rr = p.size * cam.zoom * (isHi ? 1.6 : 1) + 1.5;
        const grd = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, rr * 3);
        grd.addColorStop(0, hexA(p.color, 0.95 * al));
        grd.addColorStop(0.4, hexA(p.color, 0.5 * al));
        grd.addColorStop(1, hexA(p.color, 0));
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, rr * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = hexA("#ffffff", 0.9 * al);
        ctx.beginPath(); ctx.arc(pos.x, pos.y, rr * 0.7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }

    // ---- ripples ----
    ctx.globalCompositeOperation = "lighter";
    for (const r of ripples) {
      ctx.strokeStyle = hexA(r.color, Math.max(0, r.life) * 0.5);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";

    // ---- nodes ----
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (!layerOn[n.tier]) continue;
      const s = sp[i];
      const isHi = hi.has(i);
      const isSel = i === selectedNode;
      const al = dim && !isHi ? 0.18 : 1;
      drawNode(n, s, al, isHi, isSel);
    }

    // ---- labels ----
    if (showLabels) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        if (!layerOn[n.tier]) continue;
        const isHi = hi.has(i);
        const al = dim && !isHi ? 0.12 : 1;
        const showName = n.tier <= 1 || isHi || i === selectedNode;
        if (!showName) continue;
        const s = sp[i];
        const fs = Math.max(9, (n.tier === 0 ? 12 : 10) * Math.min(1.3, cam.zoom + 0.5));
        ctx.font = `${n.tier === 0 ? 700 : 600} ${fs}px ui-monospace, monospace`;
        ctx.fillStyle = hexA("#dcebff", 0.9 * al);
        const ly = s.y - n.r * cam.zoom - fs * 0.9;
        ctx.fillText(n.label, s.x, ly);
      }
    }

    drawVignette();
  }

  function edgeCtrlScreen(e, sp) {
    const A = sp[e.a], B = sp[e.b];
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy) || 1;
    const off = Math.min(40 * cam.zoom, len * 0.16);
    return { x: mx - (dy / len) * off, y: my + (dx / len) * off };
  }

  function drawNode(n, s, al, isHi, isSel) {
    const r = n.r * cam.zoom;
    const c = n.color;
    // glow halo
    ctx.globalCompositeOperation = "lighter";
    const halo = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * (isHi ? 4.2 : 3));
    halo.addColorStop(0, hexA(c, 0.4 * al));
    halo.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(s.x, s.y, r * (isHi ? 4.2 : 3), 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    // pulse ring
    if (n.pulse > 0) {
      ctx.strokeStyle = hexA(c, n.pulse * 0.7);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, r + (1 - n.pulse) * 26, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.globalAlpha = al;

    if (n.tier === 0) {
      // core: rotating hex ring + core
      const rot = pulseClock * 0.5 + n.phase;
      ctx.rotate(rot);
      ctx.strokeStyle = hexA(c, 0.95); ctx.lineWidth = 2.4;
      polygon(0, 0, r, 6, 0);
      ctx.strokeStyle = hexA("#fff3c4", 0.5); ctx.lineWidth = 1;
      polygon(0, 0, r * 0.66, 6, Math.PI / 6);
      ctx.rotate(-rot);
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.7);
      cg.addColorStop(0, "#fff8e0"); cg.addColorStop(1, hexA(c, 0.9));
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2); ctx.fill();
    } else if (n.tier === 1) {
      // router: diamond
      ctx.fillStyle = hexA(c, 0.9);
      ctx.strokeStyle = hexA("#dffaff", 0.7); ctx.lineWidth = 1.2;
      diamond(0, 0, r); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hexA("#04121c", 0.9);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, Math.PI * 2); ctx.fill();
    } else if (n.tier === 2) {
      // server: rounded square stack
      roundRect(-r, -r, r * 2, r * 2, r * 0.3);
      ctx.fillStyle = hexA(c, 0.85); ctx.fill();
      ctx.strokeStyle = hexA("#ffffff", 0.45); ctx.lineWidth = 1;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(-r * 0.5, k * r * 0.45);
        ctx.lineTo(r * 0.5, k * r * 0.45); ctx.stroke();
      }
    } else if (n.tier === 3) {
      // switch: square
      roundRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7, r * 0.25);
      ctx.fillStyle = hexA(c, 0.85); ctx.fill();
      ctx.strokeStyle = hexA("#ffffff", 0.4); ctx.lineWidth = 1; ctx.stroke();
    } else {
      // client / iot: circle
      ctx.fillStyle = hexA(c, 0.92);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      if (n.tier === 4) {
        ctx.strokeStyle = hexA("#ffffff", 0.4); ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // selection / hover ring
    if (isSel || isHi) {
      ctx.strokeStyle = isSel ? hexA("#ffffff", 0.95) : hexA(c, 0.8);
      ctx.lineWidth = isSel ? 2 : 1.4;
      ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBackdrop() {
    // faint drifting dot field (background traffic)
    ctx.globalCompositeOperation = "lighter";
    const t = pulseClock * 0.02;
    for (let i = 0; i < 60; i++) {
      const ang = i * 2.39996;
      const rad = 120 + (i * 37) % Math.max(W, H);
      const x = W / 2 + Math.cos(ang + t) * rad * 0.6;
      const y = H / 2 + Math.sin(ang * 1.3 + t * 0.8) * rad * 0.5;
      const a = 0.04 + 0.05 * Math.abs(Math.sin(i + t));
      ctx.fillStyle = hexA("#3a6cff", a);
      ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    // occasional pulse rings from center core
    if (showPulse) {
      const period = 3.2;
      for (let k = 0; k < 3; k++) {
        const ph = ((pulseClock / period) + k / 3) % 1;
        const rr = ph * Math.max(W, H) * 0.5;
        ctx.strokeStyle = hexA("#38e1ff", (1 - ph) * 0.06);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(W / 2, H / 2, rr, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- shape helpers ----------
  function polygon(cx, cy, r, sides, rot) {
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const a = rot + (i / sides) * Math.PI * 2;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  function diamond(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy);
    ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function hexA(hex, a) {
    // hex like #rrggbb
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ---------- HUD ----------
  const el = (id) => document.getElementById(id);
  function updateHUD() {
    el("s-nodes").textContent = nodes.length;
    el("s-links").textContent = edges.length;
    el("s-pkts").textContent = packets.length;
    el("s-rate").textContent = rateDisplay;

    // tooltip
    const tip = el("tip");
    if (hoverNode >= 0 && !dragging) {
      const n = nodes[hoverNode];
      tip.style.opacity = "1";
      tip.style.left = mouse.x + "px";
      tip.style.top = mouse.y + "px";
      el("tip-name").textContent = n.label;
      el("tip-type").textContent = TIERS[n.tier].name;
    } else { tip.style.opacity = "0"; }

    // info panel
    const panel = el("info");
    const idx = selectedNode >= 0 ? selectedNode : hoverNode;
    if (idx >= 0) {
      const n = nodes[idx];
      panel.classList.add("show");
      el("i-id").textContent = n.label;
      el("i-type").textContent = TIERS[n.tier].name;
      el("i-type").style.color = n.color;
      el("i-tier").textContent = "T" + (n.tier + 1);
      el("i-links").textContent = adj[idx].length;
      const load = Math.round(n.load * 100);
      el("i-load").textContent = load + "%";
      el("i-bar").style.width = load + "%";
      el("i-thr").textContent = (n.load * rndSafe(idx) * 9.4 + 0.3).toFixed(1) + " Gb/s";
      const st = el("i-status");
      if (load > 88) { st.textContent = "CONGESTED"; st.style.color = "#ff5d8f"; }
      else if (load > 72) { st.textContent = "ELEVATED"; st.style.color = "#ffd166"; }
      else { st.textContent = "NOMINAL"; st.style.color = "#5dffa0"; }
    } else {
      panel.classList.remove("show");
    }
  }
  function rndSafe(i) { return 0.6 + 0.4 * Math.abs(Math.sin(i * 12.9898)); }

  // ---------- legend ----------
  function buildLegend() {
    const wrap = el("legend-rows");
    wrap.innerHTML = "";
    TIERS.forEach((t) => {
      const row = document.createElement("div");
      row.className = "row" + (layerOn[t.id] ? "" : " off");
      const cnt = nodes.filter((n) => n.tier === t.id).length;
      row.innerHTML = `<span class="dot" style="color:${t.color};background:${t.color}"></span>
        <span class="n">${t.name}</span><span class="c">${cnt}</span>`;
      row.addEventListener("click", () => {
        layerOn[t.id] = !layerOn[t.id];
        row.classList.toggle("off", !layerOn[t.id]);
      });
      wrap.appendChild(row);
    });
  }

  // ---------- events ----------
  function findNode(sx, sy) {
    let best = -1, bestD = 18 * 18;
    for (let i = 0; i < nodes.length; i++) {
      if (!layerOn[nodes[i].tier]) continue;
      const s = worldToScreen(nodes[i].x, nodes[i].y);
      const d = (s.x - sx) ** 2 + (s.y - sy) ** 2;
      const rr = (nodes[i].r * cam.zoom + 8);
      if (d < rr * rr && d < bestD) { best = i; bestD = d; }
    }
    return best;
  }

  canvas.addEventListener("mousemove", (ev) => {
    mouse.x = ev.clientX; mouse.y = ev.clientY; mouse.inside = true;
    if (dragging) {
      const dx = ev.clientX - last.x, dy = ev.clientY - last.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
      cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom;
      last.x = ev.clientX; last.y = ev.clientY;
    } else {
      hoverNode = findNode(ev.clientX, ev.clientY);
      canvas.style.cursor = hoverNode >= 0 ? "pointer" : "grab";
    }
  });
  canvas.addEventListener("mouseleave", () => { mouse.inside = false; hoverNode = -1; });
  canvas.addEventListener("mousedown", (ev) => {
    dragging = true; dragMoved = false; last.x = ev.clientX; last.y = ev.clientY;
    canvas.style.cursor = "grabbing";
  });
  window.addEventListener("mouseup", (ev) => {
    if (dragging && !dragMoved) {
      const n = findNode(ev.clientX, ev.clientY);
      selectedNode = (n === selectedNode) ? -1 : n;
    }
    dragging = false; canvas.style.cursor = "grab";
  });
  canvas.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const before = screenToWorld(ev.clientX, ev.clientY);
    const factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    cam.tzoom = Math.max(0.12, Math.min(4, cam.tzoom * factor));
    // apply immediately for stable pivot
    cam.zoom = cam.tzoom;
    const after = screenToWorld(ev.clientX, ev.clientY);
    cam.x += before.x - after.x; cam.y += before.y - after.y;
  }, { passive: false });

  // touch (basic pan + tap)
  canvas.addEventListener("touchstart", (ev) => {
    if (ev.touches.length === 1) { dragging = true; dragMoved = false; last.x = ev.touches[0].clientX; last.y = ev.touches[0].clientY; }
  }, { passive: true });
  canvas.addEventListener("touchmove", (ev) => {
    if (ev.touches.length === 1 && dragging) {
      const t = ev.touches[0];
      cam.x -= (t.clientX - last.x) / cam.zoom; cam.y -= (t.clientY - last.y) / cam.zoom;
      last.x = t.clientX; last.y = t.clientY; dragMoved = true;
    }
  }, { passive: true });
  canvas.addEventListener("touchend", (ev) => {
    if (!dragMoved) { const n = findNode(last.x, last.y); selectedNode = (n === selectedNode) ? -1 : n; }
    dragging = false;
  });

  // controls
  function toggleBtn(id, getter, setter) {
    const b = el(id);
    b.addEventListener("click", () => { setter(!getter()); b.textContent = getter() ? "ON" : "OFF"; b.classList.toggle("active", getter()); });
  }
  let orbitOn = false;
  toggleBtn("t-pk", () => showPackets, (v) => showPackets = v);
  toggleBtn("t-lb", () => showLabels, (v) => showLabels = v);
  toggleBtn("t-pl", () => showPulse, (v) => showPulse = v);
  el("t-pause").addEventListener("click", () => {
    paused = !paused; const b = el("t-pause"); b.textContent = paused ? "RUN" : "PAUSE"; b.classList.toggle("active", paused);
  });
  el("speed").addEventListener("input", (e) => { speedMul = parseFloat(e.target.value); });
  el("v-reset").addEventListener("click", fitView);
  el("v-rotate").addEventListener("click", () => {
    orbitOn = !orbitOn; el("v-rotate").classList.toggle("active", orbitOn);
  });

  window.addEventListener("resize", () => { resize(); });

  // ---------- boot ----------
  buildNetwork();
  resize();
  fitView();
  buildLegend();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
