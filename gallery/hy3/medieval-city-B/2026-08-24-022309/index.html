<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Aldermere — A Living Medieval City</title>
<style>
  :root { --ink:#f3e9d2; --gold:#d9b25a; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b1020; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #title {
    position:fixed; left:24px; top:20px; z-index:5;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color:var(--ink); text-shadow:0 2px 10px rgba(0,0,0,.7);
    pointer-events:none; user-select:none;
  }
  #title h1 { margin:0; font-size:30px; letter-spacing:2px; font-weight:600; }
  #title h1 .crest { color:var(--gold); }
  #title p { margin:4px 0 0; font-size:13px; opacity:.8; letter-spacing:1px; font-style:italic; }

  #hint {
    position:fixed; left:24px; bottom:20px; z-index:5;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color:#e9dec5; font-size:12px; letter-spacing:.5px; opacity:.0;
    background:rgba(10,14,30,.45); padding:8px 12px; border-radius:8px;
    border:1px solid rgba(217,178,90,.25);
    backdrop-filter: blur(4px);
    transition:opacity 1s ease; pointer-events:none; user-select:none;
  }

  #clock {
    position:fixed; right:24px; top:20px; z-index:5; text-align:right;
    font-family: "Helvetica Neue", Arial, sans-serif; color:var(--ink);
    text-shadow:0 2px 8px rgba(0,0,0,.7); pointer-events:none; user-select:none;
  }
  #clock .phase { font-size:13px; letter-spacing:2px; text-transform:uppercase; opacity:.85; }
  #clock .t { font-family:"Iowan Old Style", Georgia, serif; font-size:22px; color:var(--gold); }

  #loader {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #1a2238, #070a14);
    color:#e9dec5; font-family:"Iowan Old Style", Georgia, serif; letter-spacing:3px;
    transition:opacity .8s ease;
  }
  #loader .ring {
    width:42px; height:42px; margin-right:16px; border-radius:50%;
    border:3px solid rgba(217,178,90,.25); border-top-color:var(--gold);
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #vignette {
    position:fixed; inset:0; z-index:4; pointer-events:none;
    box-shadow: inset 0 0 220px 40px rgba(0,0,0,.55);
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1><span class="crest">&#9884;</span> Aldermere</h1>
  <p>a living city of timber, stone &amp; smoke</p>
</div>

<div id="clock">
  <div class="phase" id="phase">Dawn</div>
  <div class="t" id="time">06:00</div>
</div>

<div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; the city breathes with the day</div>

<div id="vignette"></div>

<div id="loader"><div class="ring"></div> raising the city&hellip;</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer / Scene / Camera
// ---------------------------------------------------------------------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fb4c9, 120, 460);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.5, 2000);
camera.position.set(150, 105, 165);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 10, 0);
controls.minDistance = 50;
controls.maxDistance = 520;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;

// ---------------------------------------------------------------------------
// Lighting (sun + sky that cycle through the day)
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xbfd3ea, 0x4a4334, 0.6);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x3a4a66, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 900;
const S = 230;
sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
sun.shadow.camera.top = S; sun.shadow.camera.bottom = -S;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(sun.target);

// Sun & moon discs
const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(14, 24, 24),
  new THREE.MeshBasicMaterial({ color:0xffe9b0, fog:false })
);
scene.add(sunDisc);
const moonDisc = new THREE.Mesh(
  new THREE.SphereGeometry(10, 24, 24),
  new THREE.MeshBasicMaterial({ color:0xcfd6e6, fog:false })
);
scene.add(moonDisc);

// Stars (visible at night)
const starGeo = new THREE.BufferGeometry();
const starN = 1200;
const starPos = new Float32Array(starN * 3);
for (let i=0;i<starN;i++){
  const r = 700 + Math.random()*300;
  const th = Math.random()*Math.PI*2;
  const ph = Math.random()*Math.PI*0.5; // upper hemisphere
  starPos[i*3]   = r*Math.cos(th)*Math.cos(ph);
  starPos[i*3+1] = r*Math.sin(ph) + 40;
  starPos[i*3+2] = r*Math.sin(th)*Math.cos(ph);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------------------------------------------------------------------------
// Palette & shared materials
// ---------------------------------------------------------------------------
const rng = (a,b)=> a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

const wallPalette = [
  0xe9ddc2, 0xdcc9a2, 0xcebf9c, 0xc4b291, 0x9a958c, 0x8a857c,
  0x6f4f33, 0x7d5a39, 0xb8a07e, 0xd7c4a0
];
const roofPalette = [
  0xb9925a, 0x7a5230, 0x556070, 0x46505e, 0x9c4a3a, 0x8a6a3a, 0x6b4a3a
];

const wallMats = wallPalette.map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.92, metalness:0.0 }));
const roofMats = roofPalette.map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.8, metalness:0.0 }));

// Windows: a single shared material, emissive ramps up at night
const windowMat = new THREE.MeshStandardMaterial({
  color:0x241f15, emissive:0xffcf80, emissiveIntensity:0.0, roughness:0.4
});

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function gableRoof(w, d, h){
  const s = new THREE.Shape();
  s.moveTo(-w/2, 0); s.lineTo(w/2, 0); s.lineTo(0, h); s.lineTo(-w/2, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth:d, bevelEnabled:false });
  g.translate(0, 0, -d/2);
  return g;
}

// chimney tops collected for smoke emission
const chimneyTops = [];

function addWindows(group, w, d, h){
  const mk = (px, pz, ry) => {
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.0), windowMat);
    win.position.set(px, h*0.58, pz);
    win.rotation.y = ry;
    group.add(win);
  };
  // front & back
  mk(0, d/2+0.06, 0);
  mk(0, -d/2-0.06, Math.PI);
  // sides
  mk(w/2+0.06, 0, Math.PI/2);
  mk(-w/2-0.06, 0, -Math.PI/2);
}

function makeHouse(x, z, opts={}){
  const g = new THREE.Group();
  const w = opts.w ?? rng(6, 11);
  const d = opts.d ?? rng(6, 11);
  const h = opts.h ?? rng(5, 9);
  const wall = pick(wallMats);
  const roof = pick(roofMats);

  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wall);
  body.position.y = h/2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  const rh = rng(2.5, 4.5);
  const rmesh = new THREE.Mesh(gableRoof(w+0.8, d+0.8, rh), roof);
  rmesh.position.y = h;
  rmesh.castShadow = true;
  g.add(rmesh);

  // second storey occasionally for taller burgher houses
  if (h > 7.5 && Math.random() < 0.5){
    const w2 = w*0.7, d2 = d*0.7, h2 = rng(2.5,4);
    const body2 = new THREE.Mesh(new THREE.BoxGeometry(w2, h2, d2), wall);
    body2.position.y = h + rh*0.62 + h2/2;
    body2.castShadow = true;
    g.add(body2);
    const r2 = new THREE.Mesh(gableRoof(w2+0.7, d2+0.7, 2.2), roof);
    r2.position.y = h + rh*0.62 + h2;
    r2.castShadow = true;
    g.add(r2);
  }

  addWindows(g, w, d, h);

  // chimney
  if (Math.random() < 0.45){
    const cw = rng(1.0,1.6);
    const ch = rng(2.0,3.4);
    const chim = new THREE.Mesh(new THREE.BoxGeometry(cw, ch, cw), pick(wallMats));
    const cx = rng(-w*0.25, w*0.25);
    chim.position.set(cx, h + rh*0.55 + ch/2, rng(-d*0.2, d*0.2));
    chim.castShadow = true;
    g.add(chim);
    chimneyTops.push(new THREE.Vector3(x+cx, chim.position.y + ch/2, z+chim.position.z));
  }

  g.position.set(x, 0, z);
  g.rotation.y = (Math.floor(Math.random()*4)) * Math.PI/2;
  return g;
}

function makeTower(x, z, h, r, mat){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r*1.12, h, 12), mat);
  body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  // crenellated top (ring of small boxes)
  const crenN = 10;
  for (let i=0;i<crenN;i++){
    const a = (i/crenN)*Math.PI*2;
    const c = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 1.0), mat);
    c.position.set(Math.cos(a)*(r-0.4), h+0.7, Math.sin(a)*(r-0.4));
    c.castShadow = true; g.add(c);
  }
  const roof = new THREE.Mesh(new THREE.ConeGeometry(r*1.15, h*0.5, 12), pick(roofMats));
  roof.position.y = h + h*0.25; roof.castShadow = true; g.add(roof);
  g.position.set(x,0,z);
  return g;
}

// ---------------------------------------------------------------------------
// Ground & plaza
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(420, 64),
  new THREE.MeshStandardMaterial({ color:0x5f6a44, roughness:1.0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// dusty ring road + plaza
const plaza = new THREE.Mesh(
  new THREE.CircleGeometry(34, 48),
  new THREE.MeshStandardMaterial({ color:0x8d8377, roughness:1.0 })
);
plaza.rotation.x = -Math.PI/2; plaza.position.y = 0.05; plaza.receiveShadow = true;
scene.add(plaza);

// ---------------------------------------------------------------------------
// Cathedral (centerpiece)
// ---------------------------------------------------------------------------
function makeCathedral(){
  const g = new THREE.Group();
  const stone = new THREE.MeshStandardMaterial({ color:0xcfc6b4, roughness:0.85 });
  const stoneDark = new THREE.MeshStandardMaterial({ color:0xb3a98f, roughness:0.9 });
  const roofDark = new THREE.MeshStandardMaterial({ color:0x5b6470, roughness:0.7 });

  const base = new THREE.Mesh(new THREE.BoxGeometry(26, 1.4, 40), stoneDark);
  base.position.y = 0.7; base.receiveShadow = true; base.castShadow = true; g.add(base);

  // nave
  const nave = new THREE.Mesh(new THREE.BoxGeometry(16, 14, 40), stone);
  nave.position.y = 8.4; nave.castShadow = true; nave.receiveShadow = true; g.add(nave);
  const naveRoof = new THREE.Mesh(gableRoof(16.6, 40.4, 9), roofDark);
  naveRoof.position.y = 15.4; naveRoof.castShadow = true; g.add(naveRoof);

  // transept
  const tran = new THREE.Mesh(new THREE.BoxGeometry(34, 10, 14), stone);
  tran.position.set(0, 6.4, 0); tran.castShadow = true; tran.receiveShadow = true; g.add(tran);
  const tranRoof = new THREE.Mesh(gableRoof(34.4, 14.4, 6), roofDark);
  tranRoof.position.set(0, 11.4, 0); tranRoof.castShadow = true; g.add(tranRoof);

  // crossing spire
  const spireBase = new THREE.Mesh(new THREE.BoxGeometry(7, 6, 7), stone);
  spireBase.position.set(0, 15.4 + 3, 0); spireBase.castShadow = true; g.add(spireBase);
  const spire = new THREE.Mesh(new THREE.ConeGeometry(5.2, 26, 4), roofDark);
  spire.position.set(0, 15.4 + 6 + 13, 0); spire.rotation.y = Math.PI/4; spire.castShadow = true; g.add(spire);

  // front towers
  for (const sx of [-9.5, 9.5]){
    const t = new THREE.Mesh(new THREE.BoxGeometry(7, 30, 7), stone);
    t.position.set(sx, 15.4 + 0.0 + 15, 18); t.castShadow = true; t.receiveShadow = true; g.add(t);
    // buttress tiers
    const tRoof = new THREE.Mesh(new THREE.ConeGeometry(5.6, 12, 4), roofDark);
    tRoof.position.set(sx, 15.4 + 30 + 6, 18); tRoof.rotation.y = Math.PI/4; tRoof.castShadow = true; g.add(tRoof);
    // little spire cap
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.8, 6, 8), stone);
    cap.position.set(sx, 15.4 + 42 + 2, 18); cap.castShadow = true; g.add(cap);
  }

  // rose window (emissive, turns on at night)
  const rose = new THREE.Mesh(new THREE.CircleGeometry(3.4, 24), windowMat);
  rose.position.set(0, 14, 20.06); g.add(rose);
  const door = new THREE.Mesh(new THREE.BoxGeometry(4, 8, 1), stoneDark);
  door.position.set(0, 4, 20.1); g.add(door);

  // side windows row
  for (let i=-1;i<=1;i++){
    const w = new THREE.Mesh(new THREE.PlaneGeometry(2, 5), windowMat);
    w.position.set(i*6, 9, 20.06); g.add(w);
  }
  g.position.set(0, 0, -4);
  return g;
}
scene.add(makeCathedral());

// central well
(function(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,1.4,16),
    new THREE.MeshStandardMaterial({color:0x8a8276, roughness:1}));
  ring.position.y = 0.7; ring.castShadow=true; g.add(ring);
  const roof = new THREE.Mesh(gableRoof(4,4,2.4), pick(roofMats));
  roof.position.y = 4;
  const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,4,8), pick(wallMats));
  post1.position.set(-1.6,2,0); g.add(post1);
  const post2 = post1.clone(); post2.position.x = 1.6; g.add(post2);
  g.add(roof);
  g.position.set(10, 0, 14);
  scene.add(g);
})();

// ---------------------------------------------------------------------------
// City blocks (grid, streets carved out, cathedral plaza reserved)
// ---------------------------------------------------------------------------
const CITY_R = 138;       // wall ring radius
const BUILD_R = 112;      // building zone radius
const CATH_R  = 32;       // cathedral reserve
const GRID = 14;
const step = (CITY_R*2)/GRID;
const streets = []; // street coordinates (for citizens)
for (let i=0;i<=GRID;i++) if (i%3===0) streets.push(-CITY_R + i*step);

const cityGroup = new THREE.Group();
scene.add(cityGroup);

for (let i=1;i<GRID;i++){
  for (let j=1;j<GRID;j++){
    const cx = -CITY_R + (i+0.5)*step;
    const cz = -CITY_R + (j+0.5)*step;
    const dist = Math.hypot(cx, cz);
    if (dist > BUILD_R) continue;
    if (dist < CATH_R) continue;
    // street cells
    if (i%3===0 || j%3===0) continue;
    // place building with jitter, sometimes two small ones
    const jx = rng(-2.5, 2.5), jz = rng(-2.5, 2.5);
    cityGroup.add(makeHouse(cx+jx, cz+jz));
    if (Math.random() < 0.28 && dist > CATH_R+8){
      cityGroup.add(makeHouse(cx - step*0.35 + jx, cz + step*0.35 + jz, { w:rng(4,6), d:rng(4,6), h:rng(4,7)}));
    }
  }
}

// ---------------------------------------------------------------------------
// City walls + gate towers
// ---------------------------------------------------------------------------
const wallMat = new THREE.MeshStandardMaterial({ color:0xb9b09a, roughness:0.95 });
const R = 132;
const seg = 96;
for (let k=0;k<seg;k++){
  const a = (k/seg)*Math.PI*2;
  // gate gaps at the four cardinal approaches
  let gate = false;
  for (const ga of [0, Math.PI/2, Math.PI, -Math.PI/2]){
    let diff = ((a - ga + Math.PI) % (Math.PI*2)) - Math.PI;
    if (Math.abs(diff) < 0.13) gate = true;
  }
  if (gate) continue;
  const x = Math.cos(a)*R, z = Math.sin(a)*R;
  const wseg = new THREE.Mesh(new THREE.BoxGeometry(2.6, 13, (Math.PI*2*R)/seg*1.15), wallMat);
  wseg.position.set(x, 6.5, z);
  wseg.rotation.y = -a;
  wseg.castShadow = true; wseg.receiveShadow = true;
  cityGroup.add(wseg);
}
// towers along wall + gate towers
for (let k=0;k<=seg;k+=8){
  const a = (k/seg)*Math.PI*2;
  const x = Math.cos(a)*R, z = Math.sin(a)*R;
  cityGroup.add(makeTower(x, z, 20, 4.2, wallMat));
}
// gate towers (flanking each cardinal gap)
for (const ga of [0, Math.PI/2, Math.PI, -Math.PI/2]){
  const off = 0.18;
  for (const s of [1,-1]){
    const a = ga + s*off;
    const x = Math.cos(a)*R, z = Math.sin(a)*R;
    cityGroup.add(makeTower(x, z, 26, 5.2, wallMat));
  }
}

// banners on gate towers (animated flags)
const banners = [];
function makeBanner(x, y, z, color){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,16,8),
    new THREE.MeshStandardMaterial({color:0x3a2c1a}));
  pole.position.y = 8; pole.castShadow=true; g.add(pole);
  // flag as a plane we can wave
  const fw = 6, fh = 4;
  const flagGeo = new THREE.PlaneGeometry(fw, fh, 12, 6);
  const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({
    color, roughness:0.8, side:THREE.DoubleSide
  }));
  flag.position.set(fw/2+0.3, 13, 0);
  g.add(flag);
  g.position.set(x, y, z);
  scene.add(g);
  banners.push({ geo:flagGeo, t:Math.random()*10 });
}
const bannerColors = [0xb23a3a, 0x2f5fa3, 0x2e8b57, 0xb23a3a];
let bi = 0;
for (const ga of [0, Math.PI/2, Math.PI, -Math.PI/2]){
  const off = 0.18;
  for (const s of [1,-1]){
    const a = ga + s*off;
    const x = Math.cos(a)*R, z = Math.sin(a)*R;
    makeBanner(x, 0, z, bannerColors[bi % bannerColors.length]); bi++;
  }
}
// cathedral banners
makeBanner(-9.5, 0, 22, 0xb23a3a);
makeBanner(9.5, 0, 22, 0x2f5fa3);

// torch lights at gates (on at night)
const torches = [];
for (const ga of [0, Math.PI/2, Math.PI, -Math.PI/2]){
  const off = 0.18;
  for (const s of [1,-1]){
    const a = ga + s*off;
    const x = Math.cos(a)*(R-3), z = Math.sin(a)*(R-3);
    const tl = new THREE.PointLight(0xffa244, 0, 40, 2);
    tl.position.set(x, 14, z);
    scene.add(tl); torches.push(tl);
  }
}

// ---------------------------------------------------------------------------
// Citizens wandering the streets
// ---------------------------------------------------------------------------
const citizenColors = [0x6b4a2f, 0x7a2630, 0x2f4a7a, 0x35603f, 0x5a5a5a, 0x8a6a3a, 0x4a2f5a];
const citizens = [];
const CAP = new THREE.CapsuleGeometry(0.55, 1.2, 4, 8);
const HEAD = new THREE.SphereGeometry(0.45, 12, 12);
const nearestStreet = v => streets.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);

function makeCitizen(){
  const g = new THREE.Group();
  const col = pick(citizenColors);
  const bodyMat = new THREE.MeshStandardMaterial({ color:col, roughness:0.9 });
  const body = new THREE.Mesh(CAP, bodyMat); body.position.y = 1.05; g.add(body);
  const head = new THREE.Mesh(HEAD, new THREE.MeshStandardMaterial({ color:0xd9b48a, roughness:0.8 }));
  head.position.y = 2.0; g.add(head);
  scene.add(g);

  const fixedAxis = Math.random()<0.5 ? 'x' : 'z';
  const fixedVal = pick(streets);
  const moveAxis = fixedAxis==='x' ? 'z' : 'x';
  const pos = { x: rng(-110,110), z: rng(-110,110) };
  const c = { g, fixedAxis, fixedVal, moveAxis, pos,
    dir: Math.random()<0.5?1:-1, speed: rng(2.6, 5.4), phase: Math.random()*10 };
  placeCitizen(c);
  citizens.push(c);
}
function placeCitizen(c){
  const x = c.fixedAxis==='x' ? c.fixedVal : c.pos.x;
  const z = c.fixedAxis==='z' ? c.fixedVal : c.pos.z;
  c.g.position.set(x, 0, z);
}
function updateCitizen(c, dt){
  c.pos[c.moveAxis] += c.dir * c.speed * dt;
  const lim = 108;
  if (c.pos[c.moveAxis] > lim){ c.pos[c.moveAxis] = lim; c.dir = -1; }
  if (c.pos[c.moveAxis] < -lim){ c.pos[c.moveAxis] = -lim; c.dir = 1; }
  // occasionally turn at an intersection
  if (Math.random() < 0.5*dt){
    // snap current moving coordinate to nearest street (it's along a street already)
    const nv = nearestStreet(c.pos[c.moveAxis]);
    // switch roles
    const newFixed = c.moveAxis;            // becomes fixed (a street line)
    const newMove = c.fixedAxis;           // becomes moving axis
    c.fixedAxis = newFixed; c.moveAxis = newMove;
    c.fixedVal = nv;
    // snap the now-fixed coordinate to nearest street
    c.pos[c.fixedAxis] = nearestStreet(c.pos[c.fixedAxis]);
  }
  placeCitizen(c);
  // face direction
  if (c.moveAxis==='z') c.g.rotation.y = c.dir>0 ? 0 : Math.PI;
  else c.g.rotation.y = c.dir>0 ? Math.PI/2 : -Math.PI/2;
  // bob
  c.g.position.y = Math.abs(Math.sin(performance.now()*0.004 + c.phase)) * 0.12;
}
for (let i=0;i<60;i++) makeCitizen();

// ---------------------------------------------------------------------------
// Smoke system (shared points cloud, emitted from chimneys)
// ---------------------------------------------------------------------------
function makeSmokeTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); return t;
}
const smokeN = 700;
const smokePos = new Float32Array(smokeN*3);
const smokeAlpha = new Float32Array(smokeN);
const smokeSize = new Float32Array(smokeN);
const smokeVel = [];
const smokeLife = new Float32Array(smokeN);
const smokeMax = new Float32Array(smokeN);
for (let i=0;i<smokeN;i++){ smokeLife[i]=0; smokeAlpha[i]=0; smokeVel.push(new THREE.Vector3()); }

const smokeGeo = new THREE.BufferGeometry();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos,3));
smokeGeo.setAttribute('alpha', new THREE.BufferAttribute(smokeAlpha,1));
smokeGeo.setAttribute('psize', new THREE.BufferAttribute(smokeSize,1));
const smokeMat = new THREE.ShaderMaterial({
  uniforms: { map: { value: makeSmokeTexture() } },
  transparent: true, depthWrite: false, fog: true,
  vertexShader: `
    attribute float alpha; attribute float psize; varying float vA;
    void main(){ vA = alpha; vec4 mv = modelViewMatrix*vec4(position,1.0);
      gl_PointSize = psize * (320.0 / -mv.z); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `
    uniform sampler2D map; varying float vA;
    void main(){ vec4 t = texture2D(map, gl_PointCoord);
      gl_FragColor = vec4(vec3(0.82), t.a * vA); }`
});
const smoke = new THREE.Points(smokeGeo, smokeMat);
smoke.frustumCulled = false;
scene.add(smoke);

function spawnSmoke(i){
  if (chimneyTops.length === 0) return;
  const top = pick(chimneyTops);
  smokePos[i*3] = top.x + rng(-0.6,0.6);
  smokePos[i*3+1] = top.y;
  smokePos[i*3+2] = top.z + rng(-0.6,0.6);
  smokeVel[i].set(rng(-0.5,0.5), rng(2.0,3.6), rng(-0.5,0.5));
  smokeMax[i] = rng(3.5, 7.0);
  smokeLife[i] = smokeMax[i];
}
function updateSmoke(dt){
  for (let i=0;i<smokeN;i++){
    if (smokeLife[i] <= 0){
      // respawn a fraction each frame to keep density steady
      if (Math.random() < 0.04) spawnSmoke(i);
      smokeAlpha[i] = 0; continue;
    }
    smokeLife[i] -= dt;
    smokePos[i*3]   += smokeVel[i].x*dt;
    smokePos[i*3+1] += smokeVel[i].y*dt;
    smokePos[i*3+2] += smokeVel[i].z*dt;
    smokeVel[i].x *= 0.99; smokeVel[i].z += Math.sin(performance.now()*0.001 + i)*0.02*dt*60*0.016;
    const lifeFrac = smokeLife[i]/smokeMax[i];
    smokeAlpha[i] = Math.sin(lifeFrac*Math.PI) * 0.5;
    smokeSize[i] = (1.4 + (1-lifeFrac)*5.0);
  }
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.alpha.needsUpdate = true;
  smokeGeo.attributes.psize.needsUpdate = true;
}
// seed some smoke initially
for (let i=0;i<smokeN;i++) if (Math.random()<0.5) spawnSmoke(i);

// ---------------------------------------------------------------------------
// Day / night cycle
// ---------------------------------------------------------------------------
const clockEl = { phase: document.getElementById('phase'), time: document.getElementById('time') };
const skyDay = new THREE.Color(0x9fb4c9);
const skyNight = new THREE.Color(0x0a1024);
const fogDay = new THREE.Color(0x9fb4c9);
const fogNight = new THREE.Color(0x0a1024);
const sunDay = new THREE.Color(0xfff3da);
const sunLow = new THREE.Color(0xff8a3c);
const hemiSkyDay = new THREE.Color(0xbfd3ea);
const hemiSkyNight = new THREE.Color(0x10182e);

let dayT = 0.18; // start near dawn
const daySpeed = 0.012; // cycles

function updateDay(dt){
  dayT += dt * daySpeed;
  if (dayT > 1) dayT -= 1;
  const ang = dayT * Math.PI * 2 - Math.PI/2; // 0 at sunrise
  const elev = Math.sin(ang);            // -1..1
  const azi = Math.cos(ang);
  const sunDir = new THREE.Vector3(azi, elev, 0.35).normalize();
  sun.position.copy(sunDir).multiplyScalar(420);
  sun.target.position.set(0,0,0);
  sunDisc.position.copy(sunDir).multiplyScalar(560);
  const moonDir = sunDir.clone().multiplyScalar(-1);
  moonDisc.position.copy(moonDir).multiplyScalar(560);

  const day = THREE.MathUtils.clamp((elev+0.18)/0.5, 0, 1);
  const night = 1 - day;

  sun.intensity = 0.15 + day * 1.25;
  sun.color.copy(sunLow).lerp(sunDay, THREE.MathUtils.clamp(elev*1.6,0,1));
  hemi.intensity = 0.18 + day*0.55;
  hemi.color.copy(hemiSkyNight).lerp(hemiSkyDay, day);
  ambient.intensity = 0.12 + day*0.35;

  const sky = skyNight.clone().lerp(skyDay, day);
  scene.background = sky;
  scene.fog.color.copy(fogNight).lerp(fogDay, day);
  renderer.setClearColor(sky);

  // window & torch glow at night
  windowMat.emissiveIntensity = night * 1.4;
  for (const tl of torches) tl.intensity = night * 2.2;
  starMat.opacity = night * 0.9;

  // clock UI
  const totalMin = Math.floor(dayT * 24 * 60);
  const hh = String(Math.floor(totalMin/60)).padStart(2,'0');
  const mm = String(totalMin%60).padStart(2,'0');
  clockEl.time.textContent = `${hh}:${mm}`;
  let ph = 'Night';
  if (dayT>0.0 && dayT<0.12) ph='Dawn';
  else if (dayT>=0.12 && dayT<0.42) ph='Morning';
  else if (dayT>=0.42 && dayT<0.55) ph='Noon';
  else if (dayT>=0.55 && dayT<0.85) ph='Afternoon';
  else if (dayT>=0.85 || dayT<0.0) ph='Dusk';
  if (day<0.05) ph='Night';
  clockEl.phase.textContent = ph;
}

// ---------------------------------------------------------------------------
// Animate flags
// ---------------------------------------------------------------------------
function updateBanners(t){
  for (const b of banners){
    const pos = b.geo.attributes.position;
    for (let i=0;i<pos.count;i++){
      const x = pos.getX(i), y = pos.getY(i);
      const wave = Math.sin(x*0.8 + t*3 + b.t) * 0.5 * (x/6);
      pos.setZ(i, wave);
    }
    pos.needsUpdate = true;
    b.geo.computeVertexNormals();
  }
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateDay(dt);
  updateBanners(t);
  updateSmoke(dt);
  for (const c of citizens) updateCitizen(c, dt);

  controls.update();
  renderer.render(scene, camera);
}

// remove loader once first frame ready
const loader = document.getElementById('loader');
requestAnimationFrame(()=>{
  animate();
  loader.style.opacity = '0';
  setTimeout(()=> loader.remove(), 900);
  const hint = document.getElementById('hint');
  hint.style.opacity = '1';
  setTimeout(()=> hint.style.opacity = '0', 7000);
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
