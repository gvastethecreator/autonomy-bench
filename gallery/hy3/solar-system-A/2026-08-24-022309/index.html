<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miniature Solar System</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000005;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eefc;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    max-width: 280px;
    padding: 14px 16px;
    background: rgba(10, 14, 30, 0.55);
    border: 1px solid rgba(120, 160, 255, 0.25);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-size: 13px;
    line-height: 1.5;
    user-select: none;
    pointer-events: none;
  }
  #hud h1 {
    margin: 0 0 6px;
    font-size: 15px;
    letter-spacing: 0.5px;
    font-weight: 600;
    color: #bcd0ff;
  }
  #hud p { margin: 0 0 8px; color: #9fb0d6; }
  #hud .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #hud .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  #hud label { color: #c5d2ee; }
  #hud input[type="range"] { width: 130px; pointer-events: auto; }

  #controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(10, 14, 30, 0.55);
    border: 1px solid rgba(120, 160, 255, 0.25);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #controls button {
    background: rgba(60, 90, 180, 0.35);
    color: #e8eefc;
    border: 1px solid rgba(120, 160, 255, 0.35);
    padding: 8px 14px;
    border-radius: 9px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #controls button:hover { background: rgba(80, 120, 220, 0.55); }
  #controls button:active { transform: scale(0.96); }

  #label {
    position: fixed;
    pointer-events: none;
    padding: 2px 8px;
    background: rgba(8, 12, 26, 0.8);
    border: 1px solid rgba(120, 160, 255, 0.4);
    border-radius: 7px;
    font-size: 12px;
    color: #dce6ff;
    transform: translate(-50%, -140%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>Miniature Solar System</h1>
  <p>Drag to orbit · scroll to zoom · hover a planet to name it.</p>
  <div class="row">
    <span class="dot" style="background:#ffd66b"></span>
    <label>Sun</label>
  </div>
  <div class="row">
    <span class="dot" style="background:#c9b8a0"></span>
    <label>Mercury · Venus · Earth · Mars</label>
  </div>
  <div class="row">
    <span class="dot" style="background:#e3c08a"></span>
    <label>Jupiter · Saturn · Uranus · Neptune</label>
  </div>
  <div class="row" style="margin-top:10px">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0" max="3" step="0.01" value="1" />
  </div>
</div>

<div id="controls">
  <button id="toggleOrbits">Orbits: On</button>
  <button id="togglePlay">Pause</button>
  <button id="reset">Reset View</button>
</div>

<div id="label"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('app');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 60, 130);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 20;
controls.maxDistance = 600;

// Starfield
function makeStars(count, radius) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = radius * (0.5 + Math.random() * 0.5);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, sizeAttenuation: true, transparent: true, opacity: 0.9 });
  return new THREE.Points(geo, mat);
}
scene.add(makeStars(2500, 900));

// Lighting
scene.add(new THREE.AmbientLight(0x223044, 0.6));
const sunLight = new THREE.PointLight(0xfff2cc, 3.2, 0, 0.6);
scene.add(sunLight);

// Sun
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(8, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xffcc55 })
);
scene.add(sun);

const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(10.5, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xffa030, transparent: true, opacity: 0.25, side: THREE.BackSide })
);
sun.add(sunGlow);

// Planet definitions (scaled for a pleasant miniature, not to real scale)
const PLANETS = [
  { name: 'Mercury', radius: 1.4, dist: 18, color: 0xb0a08c, speed: 1.6, spin: 0.02 },
  { name: 'Venus',   radius: 2.2, dist: 26, color: 0xd9a066, speed: 1.18, spin: 0.015 },
  { name: 'Earth',   radius: 2.4, dist: 35, color: 0x4a8fe0, speed: 1.0, spin: 0.03 },
  { name: 'Mars',    radius: 1.8, dist: 45, color: 0xc1532d, speed: 0.8, spin: 0.028 },
  { name: 'Jupiter', radius: 5.2, dist: 62, color: 0xd9b48a, speed: 0.43, spin: 0.05 },
  { name: 'Saturn',  radius: 4.5, dist: 80, color: 0xe3c08a, speed: 0.32, spin: 0.045, ring: [6, 9.5, 0xcbb27a] },
  { name: 'Uranus',  radius: 3.4, dist: 96, color: 0x9fd8e0, speed: 0.23, spin: 0.035, ring: [4.5, 6, 0x9fd8e0] },
  { name: 'Neptune', radius: 3.3, dist: 110, color: 0x4060d0, speed: 0.18, spin: 0.034 },
];

const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

const planetMeshes = [];
const orbitLines = [];

PLANETS.forEach((p) => {
  const holder = new THREE.Group();
  holder.rotation.y = Math.random() * Math.PI * 2; // random start angle
  orbitGroup.add(holder);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.radius, 32, 32),
    new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.85, metalness: 0.05 })
  );
  mesh.position.x = p.dist;
  mesh.userData = { name: p.name, radius: p.radius };
  holder.add(mesh);

  if (p.ring) {
    const ringGeo = new THREE.RingGeometry(p.ring[0], p.ring[1], 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: p.ring[2], side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.3;
    mesh.add(ring);
  }

  // Orbit ring
  const curve = new THREE.EllipseCurve(0, 0, p.dist, p.dist, 0, Math.PI * 2);
  const pts = curve.getPoints(128).map(pt => new THREE.Vector3(pt.x, 0, pt.y));
  const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const orbitMat = new THREE.LineBasicMaterial({ color: 0x3a4a7a, transparent: true, opacity: 0.5 });
  const orbit = new THREE.LineLoop(orbitGeo, orbitMat);
  orbitGroup.add(orbit);
  orbitLines.push(orbit);

  planetMeshes.push({ holder, mesh, def: p });
});

// Earth's Moon
const earthEntry = planetMeshes.find(e => e.def.name === 'Earth');
if (earthEntry) {
  const moonHolder = new THREE.Group();
  earthEntry.mesh.add(moonHolder);
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 1 })
  );
  moon.position.x = 4.5;
  moonHolder.add(moon);
  planetMeshes.push({ holder: moonHolder, mesh: moon, def: { name: 'Moon', speed: 4.0, spin: 0 } });
}

// Raycasting for hover labels
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
const labelEl = document.getElementById('label');

renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  labelEl.style.left = e.clientX + 'px';
  labelEl.style.top = e.clientY + 'px';
});

// UI controls
let speed = 1;
let playing = true;
let showOrbits = true;

const speedSlider = document.getElementById('speed');
speedSlider.addEventListener('input', () => { speed = parseFloat(speedSlider.value); });

const toggleOrbits = document.getElementById('toggleOrbits');
toggleOrbits.addEventListener('click', () => {
  showOrbits = !showOrbits;
  orbitLines.forEach(o => (o.visible = showOrbits));
  toggleOrbits.textContent = 'Orbits: ' + (showOrbits ? 'On' : 'Off');
});

const togglePlay = document.getElementById('togglePlay');
togglePlay.addEventListener('click', () => {
  playing = !playing;
  togglePlay.textContent = playing ? 'Pause' : 'Play';
});

const resetBtn = document.getElementById('reset');
resetBtn.addEventListener('click', () => {
  camera.position.set(0, 60, 130);
  controls.target.set(0, 0, 0);
  controls.update();
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animation loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (playing) {
    const step = dt * speed;
    planetMeshes.forEach((p) => {
      p.holder.rotation.y += p.def.speed * step * 0.5;
      if (p.def.spin) p.mesh.rotation.y += p.def.spin * step * 4;
    });
    sun.rotation.y += dt * 0.1 * speed;
  }

  // Hover label via raycast
  raycaster.setFromCamera(pointer, camera);
  const targets = planetMeshes.map(p => p.mesh);
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) {
    labelEl.textContent = hits[0].object.userData.name;
    labelEl.style.opacity = '1';
  } else {
    labelEl.style.opacity = '0';
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
