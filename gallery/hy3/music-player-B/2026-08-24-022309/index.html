<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora — Desktop Music Player</title>
<style>
  :root{
    --bg:#0a0c12;
    --panel:#12151f;
    --panel-2:#171b27;
    --line:#222838;
    --text:#e8ecf5;
    --muted:#8a93a8;
    --accent:#7c5cff;
    --accent-2:#34d8c4;
    --shadow:0 30px 80px rgba(0,0,0,.55);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1b2140 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #2a1640 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Desktop window */
  .window{
    width:min(1080px,94vw);
    height:min(680px,92vh);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)) , var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;
    overflow:hidden;
    backdrop-filter:blur(8px);
  }

  /* Title bar */
  .titlebar{
    height:42px;flex:0 0 42px;
    display:flex;align-items:center;gap:14px;
    padding:0 16px;
    background:rgba(255,255,255,.02);
    border-bottom:1px solid var(--line);
    -webkit-app-region:drag;
  }
  .lights{display:flex;gap:8px}
  .light{width:12px;height:12px;border-radius:50%}
  .light.r{background:#ff5f57}.light.y{background:#febc2e}.light.g{background:#28c840}
  .titlebar .name{font-size:13px;color:var(--muted);letter-spacing:.4px;font-weight:600}
  .titlebar .spacer{flex:1}
  .titlebar .tools{display:flex;gap:8px}
  .tbtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    width:30px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;
  }
  .tbtn:hover{color:var(--text);border-color:#33405c}

  /* Body layout */
  .body{flex:1;display:flex;min-height:0}
  .sidebar{
    width:280px;flex:0 0 280px;
    background:var(--panel-2);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .brand{padding:18px 18px 12px;display:flex;align-items:center;gap:12px}
  .logo{
    width:34px;height:34px;border-radius:10px;
    background:conic-gradient(from 200deg,var(--accent),var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
    color:#0a0c12;box-shadow:0 6px 18px rgba(124,92,255,.45);
  }
  .brand h1{font-size:16px;letter-spacing:.3px}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}

  .nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;
  }
  .navitem .ic{width:18px;text-align:center;opacity:.9}
  .navitem:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .navitem.active{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(124,92,255,.04));color:#fff}

  .libhead{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center}
  .libhead span{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .addbtn{
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    width:26px;height:26px;cursor:pointer;font-size:16px;font-weight:700;
  }
  .addbtn:hover{filter:brightness(1.12)}

  .queue{flex:1;overflow-y:auto;padding:4px 10px 14px}
  .track{
    display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;
    cursor:pointer;user-select:none;position:relative;
  }
  .track:hover{background:rgba(255,255,255,.045)}
  .track.playing{background:rgba(124,92,255,.14)}
  .track .cover{
    width:42px;height:42px;border-radius:9px;flex:0 0 42px;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .track .meta{min-width:0;flex:1}
  .track .meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .meta small{color:var(--muted);font-size:11.5px}
  .track .dur{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .track .eq{display:none;gap:2px;height:14px;align-items:flex-end;margin-right:4px}
  .track.playing .eq{display:flex}
  .track.playing .dur{display:none}
  .eq i{width:3px;background:var(--accent-2);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.25s}
  .eq i:nth-child(3){animation-delay:.5s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .stage{
    flex:1;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(600px 400px at 50% 120%, rgba(124,92,255,.18), transparent 60%);
  }
  .stage .glow{
    position:absolute;inset:0;opacity:.5;
    background:radial-gradient(420px 300px at 50% 35%, var(--artglow,#7c5cff), transparent 70%);
    filter:blur(40px);transition:background 1.2s ease;
  }
  .vinyl{
    position:relative;width:230px;height:230px;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #0c0e16 0 2px, #141826 2px 4px);
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;
    animation:spin 8s linear infinite;animation-play-state:paused;
    transition:transform .4s ease;
  }
  .vinyl.spinning{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vinyl .label{
    width:84px;height:84px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--c1,#7c5cff),var(--c2,#34d8c4),var(--c1,#7c5cff));
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 6px rgba(0,0,0,.35);
    position:relative;
  }
  .vinyl .label::after{
    content:"";position:absolute;width:14px;height:14px;border-radius:50%;
    background:#0a0c12;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .vinyl .label span{font-size:11px;font-weight:800;color:#0a0c12;z-index:1;letter-spacing:.5px}

  .canvas-wrap{position:absolute;left:0;right:0;bottom:0;height:120px;opacity:.85}
  #viz{width:100%;height:100%;display:block}

  /* Now playing top info */
  .nowinfo{
    position:absolute;top:18px;left:22px;right:22px;
    display:flex;justify-content:space-between;align-items:flex-start;z-index:3;
  }
  .nowinfo .np{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .nowinfo .ti{font-size:22px;font-weight:700;margin-top:3px}
  .nowinfo .ar{color:var(--muted);font-size:13px;margin-top:1px}
  .nowinfo .right{text-align:right;color:var(--muted);font-size:12px;max-width:240px}
  .badge{
    display:inline-block;padding:3px 9px;border:1px solid var(--line);border-radius:20px;
    font-size:11px;color:var(--muted);margin-top:6px;background:rgba(255,255,255,.03);
  }

  /* Player controls */
  .player{
    flex:0 0 auto;background:rgba(10,12,18,.65);
    border-top:1px solid var(--line);
    padding:12px 22px 16px;
    backdrop-filter:blur(10px);
  }
  .seekrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:center}
  .seek{
    flex:1;height:6px;border-radius:6px;background:#262c3c;position:relative;cursor:pointer;
  }
  .seek .fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    width:0%;
  }
  .seek .knob{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    width:12px;height:12px;border-radius:50%;background:#fff;
    left:0%;box-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .15s;
  }
  .seek:hover .knob{opacity:1}

  .controls{display:flex;align-items:center;gap:18px}
  .ctrls-left{flex:1;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
  .ctrls-mid{display:flex;align-items:center;gap:16px}
  .ctrls-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:10px}

  .ctrl{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .ctrl:hover{color:#fff;background:rgba(255,255,255,.06)}
  .ctrl.small{font-size:15px;width:32px;height:32px}
  .ctrl.active{color:var(--accent-2)}
  .play{
    width:54px;height:54px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#5b3df0);
    color:#fff;font-size:22px;box-shadow:0 8px 22px rgba(124,92,255,.5);
  }
  .play:hover{filter:brightness(1.1);background:linear-gradient(135deg,var(--accent),#5b3df0);color:#fff}

  .vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .volbar{width:84px;height:5px;border-radius:5px;background:#262c3c;position:relative;cursor:pointer}
  .volbar .vfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent-2);width:75%}

  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;opacity:.8}

  /* drag overlay */
  .drop{
    position:absolute;inset:0;background:rgba(10,12,18,.82);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    z-index:20;border:2px dashed var(--accent);border-radius:14px;color:#fff;
  }
  .drop.show{display:flex}
  .drop .big{font-size:30px}
  .drop b{font-size:16px}

  .queue::-webkit-scrollbar{width:8px}
  .queue::-webkit-scrollbar-thumb{background:#2a3142;border-radius:8px}
  .queue::-webkit-scrollbar-track{background:transparent}

  .toast{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;z-index:30;
    box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
      <div class="name">Aurora Music</div>
      <div class="spacer"></div>
      <div class="tools">
        <button class="tbtn" id="minBtn" title="Minimize">–</button>
        <button class="tbtn" id="maxBtn" title="Maximize">▢</button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">A</div>
          <div><h1>Aurora</h1><small>Music Player</small></div>
        </div>
        <nav class="nav">
          <div class="navitem active"><span class="ic">♫</span> Library</div>
          <div class="navitem"><span class="ic">↻</span> Recent</div>
          <div class="navitem"><span class="ic">★</span> Favorites</div>
          <div class="navitem"><span class="ic">⚙</span> Settings</div>
        </nav>
        <div class="libhead">
          <span>Up Next</span>
          <button class="addbtn" id="addBtn" title="Add audio files">+</button>
        </div>
        <div class="queue" id="queue"></div>
      </aside>

      <section class="main">
        <div class="stage">
          <div class="glow" id="glow"></div>
          <div class="nowinfo">
            <div>
              <div class="np">Now Playing</div>
              <div class="ti" id="npTitle">—</div>
              <div class="ar" id="npArtist">—</div>
            </div>
            <div class="right">
              <div id="npExtra">Generative engine</div>
              <span class="badge" id="npBadge">Synth</span>
            </div>
          </div>

          <div class="vinyl" id="vinyl">
            <div class="label" id="vinylLabel"><span id="vinylText">A</span></div>
          </div>

          <div class="canvas-wrap"><canvas id="viz"></canvas></div>

          <div class="drop" id="drop">
            <div class="big">⤓</div>
            <b>Drop audio files to add them</b>
            <div>mp3, wav, ogg, m4a…</div>
          </div>
          <div class="toast" id="toast"></div>
        </div>

        <div class="player">
          <div class="seekrow">
            <div class="time" id="curTime">0:00</div>
            <div class="seek" id="seek">
              <div class="fill" id="seekFill"></div>
              <div class="knob" id="seekKnob"></div>
            </div>
            <div class="time" id="totTime">0:00</div>
          </div>
          <div class="controls">
            <div class="ctrls-left">
              <button class="ctrl small" id="shuffleBtn" title="Shuffle">🔀</button>
              <button class="ctrl small" id="repeatBtn" title="Repeat">🔁</button>
            </div>
            <div class="ctrls-mid">
              <button class="ctrl" id="prevBtn" title="Previous">⏮</button>
              <button class="ctrl play" id="playBtn" title="Play / Pause">▶</button>
              <button class="ctrl" id="nextBtn" title="Next">⏭</button>
            </div>
            <div class="ctrls-right">
              <div class="vol">
                <button class="ctrl small" id="muteBtn" title="Mute">🔊</button>
                <div class="volbar" id="vol"><div class="vfill" id="volFill"></div></div>
              </div>
            </div>
          </div>
          <div class="hint">Tip: press Space to play/pause · drag files anywhere to build your library</div>
        </div>
      </section>
    </div>
  </div>

  <input type="file" id="fileInput" accept="audio/*" multiple hidden />

<script>
(() => {
  "use strict";

  // ---------- Track data ----------
  // Synth tracks are generated live with the Web Audio API.
  const SCALES = {
    minor:  [0,2,3,5,7,8,10],
    major:  [0,2,4,5,7,9,11],
    dorian: [0,2,3,5,7,9,10],
    penta:  [0,3,5,7,10],
  };

  const TRACKS = [
    {
      id:"t1", title:"Midnight Drive", artist:"Synthwave Engine",
      c1:"#ff5f6d", c2:"#ffc371", type:"synth", duration:148,
      bpm:96, root:146.83, scale:"minor", scaleName:"A Minor",
      chords:[[0,2,4],[5,0,3],[3,5,0],[4,1,6]], lead:true, pad:true, sub:true,
    },
    {
      id:"t2", title:"Glass Garden", artist:"Ambient Field",
      c1:"#34d8c4", c2:"#7c5cff", type:"synth", duration:172,
      bpm:72, root:130.81, scale:"dorian", scaleName:"C Dorian",
      chords:[[0,2,4],[3,5,0],[4,1,3],[2,4,6]], lead:true, pad:true, sub:false,
    },
    {
      id:"t3", title:"Neon Pulse", artist:"Arcade Trio",
      c1:"#7c5cff", c2:"#34d8c4", type:"synth", duration:128,
      bpm:124, root:164.81, scale:"minor", scaleName:"E Minor",
      chords:[[0,2,4],[4,6,1],[5,0,2],[3,5,0]], lead:true, pad:true, sub:true,
    },
    {
      id:"t4", title:"Paper Skies", artist:"Lo-Fi Bot",
      c1:"#febc2e", c2:"#ff5f6d", type:"synth", duration:160,
      bpm:84, root:110.00, scale:"major", scaleName:"A Major",
      chords:[[0,2,4],[5,0,3],[1,3,5],[4,6,1]], lead:true, pad:true, sub:false,
    },
  ];

  let state = {
    playlist: TRACKS.map(t => ({...t})),
    index: 0,
    playing: false,
    shuffle: false,
    repeat: false,
    volume: 0.75,
    muted: false,
    position: 0,      // seconds into current track
    startCtxTime: 0,  // ctx time when playback (re)started
    seekDragging: false,
    fileBuffers: {},  // id -> AudioBuffer for loaded files
  };

  // ---------- Audio engine ----------
  let ctx = null, master = null, analyser = null, musicGain = null;
  let synthTimer = null, nextNoteTime = 0, step16 = 0, barCount = 0;
  let fileSource = null;

  function ensureAudio(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    musicGain = ctx.createGain();
    musicGain.gain.value = state.volume;
    musicGain.connect(analyser);
    analyser.connect(master);
    master.connect(ctx.destination);
  }

  function degToFreq(root, scaleArr, deg, octaveShift){
    const n = scaleArr.length;
    const oct = Math.floor(deg / n) + (octaveShift||0);
    const idx = ((deg % n) + n) % n;
    const semi = scaleArr[idx] + 12*oct;
    return root * Math.pow(2, semi/12);
  }

  function playNote(freq, t, dur, type, peak, dest){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.connect(g); g.connect(dest || musicGain);
    const a = 0.012, r = Math.min(0.4, dur*0.6);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t+a);
    g.gain.setValueAtTime(peak, t+Math.max(a, dur-r));
    g.gain.linearRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }

  // Scheduler for generative synth tracks
  function scheduleStep(track, t){
    const sc = SCALES[track.scale];
    const spb = 60 / track.bpm;        // sec per beat
    const stepDur = spb / 4;           // 16th
    const bar = Math.floor(step16 / 16) % track.chords.length;
    const chord = track.chords[bar];
    const inBar = step16 % 16;

    // Pad / chord on beat 0 and 8
    if(track.pad && (inBar === 0 || inBar === 8)){
      chord.forEach(deg => {
        const f = degToFreq(track.root, sc, deg, 0);
        playNote(f, t, spb*2, "sawtooth", 0.05);
        playNote(f*1.005, t, spb*2, "sawtooth", 0.035); // slight detune
      });
    }
    // Sub bass on beats
    if(track.sub && inBar % 4 === 0){
      const bf = degToFreq(track.root, sc, chord[0], -2);
      playNote(bf, t, stepDur*3.6, "sine", 0.22);
    }
    // Bass pulse
    if(inBar % 2 === 0){
      const bf = degToFreq(track.root, sc, chord[0], -1);
      playNote(bf, t, stepDur*1.6, "triangle", 0.14);
    }
    // Lead arpeggio every 16th from chord, walking
    if(track.lead){
      const leadDeg = chord[(inBar) % chord.length] + 1;
      const lf = degToFreq(track.root, sc, leadDeg, 1);
      const vel = (inBar % 4 === 0) ? 0.10 : 0.06;
      playNote(lf, t, stepDur*1.4, "square", vel);
      if(inBar % 4 === 2){
        playNote(lf*2, t, stepDur*1.2, "triangle", 0.04);
      }
    }
    // soft hat
    if(inBar % 2 === 1) playNote(8000, t, 0.03, "square", 0.012);
  }

  function schedulerLoop(){
    if(!state.playing) return;
    const track = state.playlist[state.index];
    if(track.type !== "synth") return;
    const spb = 60 / track.bpm;
    const stepDur = spb / 4;
    while(nextNoteTime < ctx.currentTime + 0.18){
      scheduleStep(track, nextNoteTime);
      nextNoteTime += stepDur;
      step16++;
    }
    synthTimer = setTimeout(schedulerLoop, 60);
  }

  function startSynth(track){
    step16 = 0;
    nextNoteTime = ctx.currentTime + 0.06;
    schedulerLoop();
  }
  function stopSynth(){
    if(synthTimer){ clearTimeout(synthTimer); synthTimer = null; }
  }

  // File playback
  function startFile(track){
    const buf = state.fileBuffers[track.id];
    if(!buf) return;
    fileSource = ctx.createBufferSource();
    fileSource.buffer = buf;
    fileSource.connect(musicGain);
    fileSource.onended = () => {
      if(state.playing && !state.seekDragging) onTrackEnd();
    };
    fileSource.start(0, state.position % buf.duration);
  }
  function stopFile(){
    if(fileSource){ try{fileSource.stop();}catch(e){} fileSource = null; }
  }

  // ---------- Transport ----------
  function loadTrack(i, autoplay){
    stopSynth(); stopFile();
    state.index = (i + state.playlist.length) % state.playlist.length;
    const track = state.playlist[state.index];
    state.position = 0;
    // UI
    document.getElementById("npTitle").textContent = track.title;
    document.getElementById("npArtist").textContent = track.artist;
    document.getElementById("npExtra").textContent = track.type === "synth" ? "Generative engine" : "Your file";
    document.getElementById("npBadge").textContent = track.type === "synth" ? "Synth" : "File";
    document.getElementById("vinylText").textContent = track.title[0];
    document.documentElement.style.setProperty("--artglow", track.c1);
    document.getElementById("vinylLabel").style.setProperty("--c1", track.c1);
    document.getElementById("vinylLabel").style.setProperty("--c2", track.c2);
    const glow = document.getElementById("glow");
    glow.style.setProperty("--artglow", track.c1);
    document.getElementById("totTime").textContent = fmt(track.type === "file" ? (state.fileBuffers[track.id]?.duration||0) : track.duration);
    renderQueue();
    if(autoplay){ play(); } else { updateSeek(); }
  }

  function play(){
    ensureAudio();
    if(ctx.state === "suspended") ctx.resume();
    const track = state.playlist[state.index];
    state.playing = true;
    state.startCtxTime = ctx.currentTime - state.position;
    if(track.type === "synth"){ startSynth(track); }
    else { startFile(track); }
    document.getElementById("playBtn").textContent = "⏸";
    document.getElementById("vinyl").classList.add("spinning");
    if(track.type === "file" && !state.fileBuffers[track.id]){
      toast("Loading file…");
    }
  }

  function pause(){
    const track = state.playlist[state.index];
    state.position = currentPos();
    state.playing = false;
    stopSynth(); stopFile();
    document.getElementById("playBtn").textContent = "▶";
    document.getElementById("vinyl").classList.remove("spinning");
  }

  function togglePlay(){ state.playing ? pause() : play(); }

  function currentPos(){
    const track = state.playlist[state.index];
    if(track.type === "synth"){
      if(!state.playing) return state.position;
      return (ctx.currentTime - state.startCtxTime) % track.duration;
    } else {
      const buf = state.fileBuffers[track.id];
      if(!buf) return state.position;
      if(!state.playing) return state.position;
      return (ctx.currentTime - state.startCtxTime) % buf.duration;
    }
  }

  function onTrackEnd(){
    const track = state.playlist[state.index];
    if(state.repeat){ loadTrack(state.index, true); return; }
    next();
  }

  function next(){
    let i = state.index + 1;
    if(state.shuffle){
      if(state.playlist.length > 1){
        do { i = Math.floor(Math.random()*state.playlist.length); }
        while(i === state.index);
      }
    }
    if(i >= state.playlist.length){ i = 0; }
    loadTrack(i, true);
  }
  function prev(){
    if(currentPos() > 3){ loadTrack(state.index, true); return; }
    let i = state.index - 1;
    if(state.shuffle){
      if(state.playlist.length > 1){
        do { i = Math.floor(Math.random()*state.playlist.length); }
        while(i === state.index);
      }
    }
    if(i < 0) i = state.playlist.length - 1;
    loadTrack(i, true);
  }

  // ---------- UI rendering ----------
  function fmt(s){
    s = Math.max(0, Math.floor(s||0));
    const m = Math.floor(s/60), sec = s%60;
    return m + ":" + String(sec).padStart(2,"0");
  }

  function renderQueue(){
    const q = document.getElementById("queue");
    q.innerHTML = "";
    state.playlist.forEach((track, i) => {
      const el = document.createElement("div");
      el.className = "track" + (i === state.index ? " playing" : "");
      el.innerHTML = `
        <div class="cover" style="background:linear-gradient(135deg,${track.c1},${track.c2})">${track.title[0]}</div>
        <div class="meta"><b>${esc(track.title)}</b><small>${esc(track.artist)}</small></div>
        <div class="eq"><i></i><i></i><i></i></div>
        <div class="dur">${track.type==="file" ? (state.fileBuffers[track.id]?fmt(state.fileBuffers[track.id].duration):"—") : fmt(track.duration)}</div>`;
      el.addEventListener("click", () => {
        if(i === state.index){ togglePlay(); }
        else { loadTrack(i, true); }
      });
      q.appendChild(el);
    });
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function updateSeek(){
    const track = state.playlist[state.index];
    const dur = track.type === "file" ? (state.fileBuffers[track.id]?.duration || 0) : track.duration;
    const pos = state.seekDragging ? state.position : currentPos();
    const pct = dur ? (pos/dur)*100 : 0;
    document.getElementById("seekFill").style.width = pct + "%";
    document.getElementById("seekKnob").style.left = pct + "%";
    document.getElementById("curTime").textContent = fmt(pos);
    if(!state.seekDragging) document.getElementById("totTime").textContent = fmt(dur);
  }

  // ---------- Visualizer ----------
  const canvas = document.getElementById("viz");
  const cctx = canvas.getContext("2d");
  function resizeCanvas(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
  }
  window.addEventListener("resize", resizeCanvas);

  function drawViz(){
    requestAnimationFrame(drawViz);
    const w = canvas.width, h = canvas.height;
    cctx.clearRect(0,0,w,h);
    if(!analyser){
      // idle wave
      cctx.strokeStyle = "rgba(124,92,255,.35)";
      cctx.lineWidth = 2*devicePixelRatio;
      cctx.beginPath();
      for(let x=0;x<w;x+=4){
        const y = h/2 + Math.sin(x*0.02 + performance.now()*0.002)*8*devicePixelRatio;
        x===0?cctx.moveTo(x,y):cctx.lineTo(x,y);
      }
      cctx.stroke();
      updateSeek();
      return;
    }
    const buf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(buf);
    const bars = 64;
    const bw = w / bars;
    const track = state.playlist[state.index];
    const c1 = track.c1, c2 = track.c2;
    for(let i=0;i<bars;i++){
      const v = buf[Math.floor(i/bars * buf.length)] / 255;
      const bh = Math.max(2*devicePixelRatio, v * h * 0.92);
      const x = i*bw;
      const grad = cctx.createLinearGradient(0, h, 0, h-bh);
      grad.addColorStop(0, c1); grad.addColorStop(1, c2);
      cctx.fillStyle = grad;
      cctx.globalAlpha = 0.55 + v*0.4;
      cctx.fillRect(x+1*devicePixelRatio, h-bh, bw-2*devicePixelRatio, bh);
    }
    cctx.globalAlpha = 1;
    updateSeek();
  }

  // ---------- Events ----------
  document.getElementById("playBtn").addEventListener("click", togglePlay);
  document.getElementById("nextBtn").addEventListener("click", next);
  document.getElementById("prevBtn").addEventListener("click", prev);

  document.getElementById("shuffleBtn").addEventListener("click", e => {
    state.shuffle = !state.shuffle; e.currentTarget.classList.toggle("active", state.shuffle);
  });
  document.getElementById("repeatBtn").addEventListener("click", e => {
    state.repeat = !state.repeat; e.currentTarget.classList.toggle("active", state.repeat);
  });

  // Seek
  const seek = document.getElementById("seek");
  function seekFromEvent(e){
    const r = seek.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
    const track = state.playlist[state.index];
    const dur = track.type === "file" ? (state.fileBuffers[track.id]?.duration||0) : track.duration;
    state.position = pct * dur;
    if(state.playing && track.type === "file"){
      stopFile(); startFile(track);
    }
    updateSeek();
  }
  seek.addEventListener("mousedown", e => { state.seekDragging = true; seekFromEvent(e); });
  window.addEventListener("mousemove", e => { if(state.seekDragging) seekFromEvent(e); });
  window.addEventListener("mouseup", () => { state.seekDragging = false; });

  // Volume
  const vol = document.getElementById("vol");
  function volFromEvent(e){
    const r = vol.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
    state.volume = pct; state.muted = false;
    document.getElementById("volFill").style.width = (pct*100)+"%";
    document.getElementById("muteBtn").textContent = pct===0 ? "🔇" : "🔊";
    if(musicGain) musicGain.gain.value = pct;
  }
  vol.addEventListener("mousedown", volFromEvent);
  vol.addEventListener("click", volFromEvent);
  document.getElementById("muteBtn").addEventListener("click", () => {
    state.muted = !state.muted;
    if(musicGain) musicGain.gain.value = state.muted ? 0 : state.volume;
    document.getElementById("muteBtn").textContent = state.muted ? "🔇" : "🔊";
  });

  // Keyboard
  window.addEventListener("keydown", e => {
    if(e.code === "Space"){ e.preventDefault(); togglePlay(); }
    else if(e.code === "ArrowRight"){ next(); }
    else if(e.code === "ArrowLeft"){ prev(); }
  });

  // File loading
  const fileInput = document.getElementById("fileInput");
  document.getElementById("addBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => handleFiles(e.target.files));

  const drop = document.getElementById("drop");
  const stage = document.querySelector(".stage");
  ["dragenter","dragover"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("show"); }));
  ["dragleave","drop"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); if(ev==="drop"||e.target===stage) drop.classList.remove("show"); }));
  stage.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("show");
    if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files){
    ensureAudio();
    let added = 0;
    Array.from(files).forEach(f => {
      if(!f.type.startsWith("audio") && !/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name)) return;
      const reader = new FileReader();
      reader.onload = () => {
        ctx.decodeAudioData(reader.result.slice(0)).then(buf => {
          const id = "f" + Date.now() + Math.random().toString(36).slice(2,6);
          state.fileBuffers[id] = buf;
          const palette = ["#7c5cff","#34d8c4","#ff5f6d","#febc2e","#5b8cff","#ff8ad8"];
          const c1 = palette[state.playlist.length % palette.length];
          const c2 = palette[(state.playlist.length+3) % palette.length];
          const track = {
            id, title: f.name.replace(/\.[^.]+$/,""), artist:"Local File",
            c1, c2, type:"file", duration: buf.duration,
          };
          state.playlist.push(track);
          added++;
          renderQueue();
          if(added === 1 && !state.playing) loadTrack(state.playlist.length-1, false);
          toast("Added " + track.title);
        }).catch(()=> toast("Could not decode " + f.name));
      };
      reader.readAsArrayBuffer(f);
    });
  }

  let toastT = null;
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(()=> t.classList.remove("show"), 2200);
  }

  // Window chrome (cosmetic)
  document.getElementById("minBtn").addEventListener("click", () => toast("Minimize (cosmetic)"));
  document.getElementById("maxBtn").addEventListener("click", () => {
    const w = document.querySelector(".window");
    w.style.height = w.style.height ? "" : "96vh";
    w.style.width = w.style.width ? "" : "98vw";
  });

  // ---------- Boot ----------
  resizeCanvas();
  loadTrack(0, false);
  drawViz();
  renderQueue();
})();
</script>
</body>
</html>
