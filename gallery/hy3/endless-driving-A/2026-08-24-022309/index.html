<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Endless Night Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060d; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed;
    left: 22px;
    bottom: 20px;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: #cfe6ff;
    text-shadow: 0 0 12px rgba(80,160,255,0.6);
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  #hud .speed {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
  }
  #hud .speed small { font-size: 18px; font-weight: 500; opacity: .7; margin-left: 6px; }
  #hud .label { font-size: 13px; letter-spacing: 3px; opacity: .65; text-transform: uppercase; }

  #title {
    position: fixed;
    top: 22px;
    left: 0; right: 0;
    text-align: center;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: #eaf3ff;
    letter-spacing: 6px;
    font-size: 14px;
    text-transform: uppercase;
    opacity: .55;
    text-shadow: 0 0 16px rgba(120,180,255,0.7);
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }

  #help {
    position: fixed;
    right: 22px;
    bottom: 20px;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: #9fc2e6;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: right;
    opacity: .6;
    pointer-events: none;
    user-select: none;
    z-index: 10;
    line-height: 1.7;
  }
  #help b { color: #dff0ff; font-weight: 600; }

  /* vignette + film grain overlay */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(120% 90% at 50% 38%, rgba(0,0,0,0) 45%, rgba(0,0,8,0.55) 100%);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title">Endless Night Drive</div>
<div id="hud">
  <div class="speed" id="speed">0<small>km/h</small></div>
  <div class="label">cruising the empty highway</div>
</div>
<div id="help">
  <div><b>↑ / ↓</b> accelerate · brake</div>
  <div><b>← / →</b> steer</div>
  <div><b>Space</b> toggle lights</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const app = document.getElementById('app');

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

// ---------- Scene & fog ----------
const scene = new THREE.Scene();
const NIGHT = new THREE.Color(0x05070f);
scene.background = NIGHT;
scene.fog = new THREE.Fog(0x070b18, 60, 320);

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4.2, 11);
camera.lookAt(0, 1.5, -30);

// ---------- Lighting (ambient night) ----------
const moonLight = new THREE.DirectionalLight(0x9db8ff, 0.35);
moonLight.position.set(-40, 60, -20);
scene.add(moonLight);

const hemi = new THREE.HemisphereLight(0x223355, 0x05060d, 0.5);
scene.add(hemi);

// ---------- Starfield ----------
function makeStars(count, radius) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    // distribute on a dome around horizon
    const a = Math.random() * Math.PI * 2;
    const r = radius * (0.3 + Math.random() * 0.7);
    const y = Math.abs(Math.random() * radius * 0.9) + 8;
    pos[i*3] = Math.cos(a) * r;
    pos[i*3+1] = y;
    pos[i*3+2] = -Math.abs(Math.sin(a) * r) - 5;
    c.setHSL(0.58 + Math.random()*0.07, 0.5, 0.7 + Math.random()*0.3);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.9 });
  return new THREE.Points(g, m);
}
const stars = makeStars(1400, 400);
scene.add(stars);

// ---------- Ground / desert plane ----------
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a1020, roughness: 1, metalness: 0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

// ---------- Road ----------
// Road is built from repeated segments so it appears endless.
const ROAD_W = 9;
const SEG_LEN = 40;
const SEG_COUNT = 14;
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x11141f, roughness: 0.85, metalness: 0.05 });
const laneMat = new THREE.MeshStandardMaterial({ color: 0xf2d36b, emissive: 0x6b5410, roughness: 0.6 });
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xdfe9ff, emissive: 0x2b3a66, roughness: 0.5 });

const roadSegments = [];
for (let i = 0; i < SEG_COUNT; i++) {
  const seg = new THREE.Group();
  const z = -i * SEG_LEN;

  // asphalt (centered in group; group carries the world offset)
  const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, SEG_LEN), roadMat);
  asphalt.rotation.x = -Math.PI / 2;
  asphalt.position.set(0, 0, 0);
  asphalt.receiveShadow = true;
  seg.add(asphalt);

  // center dashed lane line
  const dashes = 4;
  for (let d = 0; d < dashes; d++) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.28, SEG_LEN/dashes * 0.55), laneMat);
    dash.rotation.x = -Math.PI/2;
    dash.position.set(0, 0.02, (d + 0.5) * (SEG_LEN/dashes) - SEG_LEN/2);
    seg.add(dash);
  }
  // edge lines
  for (const sx of [-ROAD_W/2 + 0.25, ROAD_W/2 - 0.25]) {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.18, SEG_LEN), edgeMat);
    edge.rotation.x = -Math.PI/2;
    edge.position.set(sx, 0.02, 0);
    seg.add(edge);
  }

  seg.position.z = z;
  roadGroup.add(seg);
  roadSegments.push(seg);
}

// ---------- Streetlights (recycled) ----------
const POLE_SPACING = SEG_LEN;       // one pole per segment
const POLE_COUNT = SEG_COUNT;
const poles = [];
const lampGeo = new THREE.SphereGeometry(0.55, 16, 16);
const lampMat = new THREE.MeshStandardMaterial({ color: 0xfff4cf, emissive: 0xffd98a, emissiveIntensity: 1.6, roughness: 0.4 });
const poleMat = new THREE.MeshStandardMaterial({ color: 0x20242e, roughness: 0.9 });
const armMat = poleMat;

function makePole(side) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 8, 8), poleMat);
  pole.position.y = 4;
  g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(side * 2.4, 0.16, 0.16), armMat);
  arm.position.set(side * 1.2, 7.8, 0);
  g.add(arm);
  const lamp = new THREE.Mesh(lampGeo, lampMat);
  lamp.position.set(side * 2.4, 7.7, 0);
  g.add(lamp);

  // glow light from lamp
  const light = new THREE.PointLight(0xffd98a, 8, 70, 2);
  light.position.set(side * 2.4, 7.4, 0);
  g.add(light);
  g.userData.light = light;
  return g;
}

let poleIndex = 0;
for (let i = 0; i < POLE_COUNT; i++) {
  const side = i % 2 === 0 ? 1 : -1;
  const p = makePole(side);
  p.position.z = -i * POLE_SPACING - 8;
  p.position.x = side * (ROAD_W/2 + 1.2);
  scene.add(p);
  poles.push(p);
}

// ---------- Distant glowing city / mountains silhouette ----------
function makeSkyline() {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0x0c1530 });
  const winMat = new THREE.MeshBasicMaterial({ color: 0xffcf6b });
  for (let i = 0; i < 60; i++) {
    const w = 6 + Math.random()*14;
    const h = 20 + Math.random()*120;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 4), mat);
    const x = (Math.random()*2 - 1) * 320;
    b.position.set(x, h/2 - 4, -340 - Math.random()*120);
    g.add(b);
    // a few lit windows
    if (Math.random() < 0.6) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(w*0.7, h*0.6), winMat);
      win.position.set(x, h*0.5, -340 - Math.random()*120 + 2.1);
      win.material = winMat.clone();
      win.material.opacity = 0.18 + Math.random()*0.25;
      win.material.transparent = true;
      g.add(win);
    }
  }
  return g;
}
scene.add(makeSkyline());

// ---------- Player car ----------
const car = new THREE.Group();
scene.add(car);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x10131c, roughness: 0.35, metalness: 0.7 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 0.1, metalness: 0.2 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0x3a0606, emissive: 0xff2222, emissiveIntensity: 2.4, roughness: 0.4 });
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff5e0, emissiveIntensity: 3.0, roughness: 0.3 });

const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 4.3), bodyMat);
body.position.y = 0.75;
body.castShadow = true;
car.add(body);

const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.2), bodyMat);
cabin.position.set(0, 1.25, 0.2);
cabin.castShadow = true;
car.add(cabin);

const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 0.12), glassMat);
windshield.position.set(0, 1.3, -0.95);
windshield.rotation.x = -0.25;
car.add(windshield);

// tail lights
for (const sx of [-0.7, 0.7]) {
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.1), tailMat);
  t.position.set(sx, 0.85, 2.18);
  car.add(t);
}
// head lights
const headLights = [];
for (const sx of [-0.7, 0.7]) {
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.25, 0.1), headMat);
  h.position.set(sx, 0.8, -2.18);
  car.add(h);
  const spot = new THREE.SpotLight(0xfff2d0, 6, 120, Math.PI/5, 0.4, 1.2);
  const target = new THREE.Object3D();
  target.position.set(sx, 0.4, -40);
  car.add(target);
  spot.target = target;
  spot.position.set(sx, 1.0, -2.1);
  car.add(spot);
  headLights.push(spot);
}

// wheels
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050608, roughness: 0.8 });
const wheels = [];
for (const sx of [-1.0, 1.0]) {
  for (const sz of [-1.4, 1.4]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16), wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(sx, 0.5, sz);
    w.castShadow = true;
    car.add(w);
    wheels.push(w);
  }
}

// ---------- Move car + recycle world ----------
let speed = 0;          // forward units/sec
let targetSpeed = 42;
let steer = 0;          // -1..1
let carX = 0;
let carZ = 0;           // we keep car near origin and move world toward +z

const ROLL = 0.0035;    // how much the road recycles

function recycle() {
  // move road segments forward; when one passes behind camera, send it to the far end
  for (const seg of roadSegments) {
    if (seg.position.z > camera.position.z + SEG_LEN) {
      // find current furthest segment
      let minZ = Infinity;
      for (const s of roadSegments) minZ = Math.min(minZ, s.position.z);
      seg.position.z = minZ - SEG_LEN;
    }
  }
  for (const p of poles) {
    if (p.position.z > camera.position.z + 10) {
      let minZ = Infinity;
      for (const q of poles) minZ = Math.min(minZ, q.position.z);
      p.position.z = minZ - POLE_SPACING;
    }
  }
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    const on = headLights[0].intensity > 0;
    headLights.forEach(h => h.intensity = on ? 0 : 6);
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });

// ---------- HUD ----------
const speedEl = document.getElementById('speed');

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Animate ----------
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);

  // speed control
  if (keys['ArrowUp']) targetSpeed = Math.min(120, targetSpeed + 60*dt);
  if (keys['ArrowDown']) targetSpeed = Math.max(0, targetSpeed - 90*dt);
  if (!keys['ArrowUp'] && !keys['ArrowDown']) targetSpeed += (42 - targetSpeed) * 0.4 * dt; // ease back to cruise
  speed += (targetSpeed - speed) * 2.5 * dt;

  // steering
  let steerTarget = 0;
  if (keys['ArrowLeft']) steerTarget = 1;
  if (keys['ArrowRight']) steerTarget = -1;
  steer += (steerTarget - steer) * 4 * dt;
  carX += steer * speed * 0.05 * dt;
  carX = Math.max(-ROAD_W/2 + 1.2, Math.min(ROAD_W/2 - 1.2, carX));
  car.position.x = carX;
  car.rotation.z = -steer * 0.12;
  car.rotation.y = steer * 0.05;

  // move the world toward camera (+z) based on speed
  const move = speed * dt;
  for (const seg of roadSegments) seg.position.z += move;
  for (const p of poles) p.position.z += move;

  recycle();

  // wheel spin
  const spin = move / 0.5;
  for (const w of wheels) w.rotation.x += spin;

  // camera follow: slightly behind & above, eased
  const camTargetX = carX * 0.5;
  camera.position.x += (camTargetX - camera.position.x) * 3 * dt;
  camera.position.y = 4.2 + Math.sin(clock.elapsedTime * 1.6) * 0.03; // subtle bob
  camera.lookAt(carX * 0.4, 1.6, -30);

  // stars slow drift
  stars.rotation.y += 0.0008 * dt * 60 * 0.016;

  // headlight flicker subtlety
  const fl = 1 + Math.sin(clock.elapsedTime * 30) * 0.04;
  headLights.forEach(h => { if (h.intensity > 0) h.intensity = 6 * fl; });

  // HUD
  speedEl.innerHTML = Math.round(speed * 3.0) + '<small>km/h</small>';

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// start a little behind so we ease in
camera.position.set(0, 4.2, 12);
animate();
</script>
</body>
</html>
