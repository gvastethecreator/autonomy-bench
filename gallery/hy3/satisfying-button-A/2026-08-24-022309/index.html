<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satisfying Button</title>
<style>
  :root {
    --bg-1: #1b1d2a;
    --bg-2: #2a2d42;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --shadow: rgba(108, 92, 231, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 38px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    color: #e8e8f0;
    overflow: hidden;
    user-select: none;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .halo {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--shadow), transparent 70%);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }

  .stage.active .halo {
    opacity: 0.9;
    transform: scale(1.15);
  }

  .btn {
    position: relative;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 26px 64px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #fff;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:
      0 10px 30px var(--shadow),
      0 2px 0 rgba(255, 255, 255, 0.25) inset,
      0 -3px 12px rgba(0, 0, 0, 0.25) inset;
    transform: translateY(0) scale(1);
    transition:
      transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.18s ease,
      filter 0.18s ease;
    overflow: hidden;
    isolation: isolate;
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.45) 50%, transparent 80%);
    transform: translateX(-130%) skewX(-18deg);
    transition: transform 0.6s ease;
    z-index: -1;
  }

  .btn:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow:
      0 18px 44px var(--shadow),
      0 2px 0 rgba(255, 255, 255, 0.3) inset,
      0 -3px 12px rgba(0, 0, 0, 0.2) inset;
    filter: saturate(1.1);
  }

  .btn:hover::before {
    transform: translateX(130%) skewX(-18deg);
  }

  .btn:active {
    transform: translateY(2px) scale(0.96);
    box-shadow:
      0 6px 16px var(--shadow),
      0 2px 0 rgba(255, 255, 255, 0.15) inset,
      0 -2px 8px rgba(0, 0, 0, 0.3) inset;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .btn .label {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .btn .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.35); opacity: 1; }
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    transform: scale(0);
    animation: ripple 0.7s ease-out forwards;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes ripple {
    to { transform: scale(3); opacity: 0; }
  }

  .counter {
    font-size: 15px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #9aa0c0;
    min-height: 20px;
    transition: color 0.2s ease;
  }

  .counter b {
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
  }

  .ring {
    position: absolute;
    border-radius: 22px;
    border: 2px solid rgba(162, 155, 254, 0.7);
    opacity: 0;
    pointer-events: none;
  }

  .ring.go {
    animation: ring 0.55s ease-out forwards;
  }

  @keyframes ring {
    0% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.4); }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="halo"></div>
    <button class="btn" id="btn" aria-label="satisfying button">
      <span class="label"><span class="dot"></span>Press Me</span>
    </button>
  </div>
  <div class="counter" id="counter">Taps: <b>0</b></div>

<script>
  const btn = document.getElementById('btn');
  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter').querySelector('b');
  let count = 0;

  function spawnRipple(x, y) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (x - rect.left - size / 2) + 'px';
    r.style.top = (y - rect.top - size / 2) + 'px';
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  function spawnRing() {
    const rect = btn.getBoundingClientRect();
    const ring = document.createElement('span');
    ring.className = 'ring';
    ring.style.left = rect.left + 'px';
    ring.style.top = rect.top + 'px';
    ring.style.width = rect.width + 'px';
    ring.style.height = rect.height + 'px';
    ring.style.position = 'fixed';
    document.body.appendChild(ring);
    requestAnimationFrame(() => ring.classList.add('go'));
    ring.addEventListener('animationend', () => ring.remove());
  }

  function fire(x, y) {
    count++;
    counter.textContent = count;
    spawnRipple(x, y);
    spawnRing();
    stage.classList.add('active');
    clearTimeout(fire._t);
    fire._t = setTimeout(() => stage.classList.remove('active'), 320);
  }

  btn.addEventListener('pointerdown', (e) => {
    fire(e.clientX, e.clientY);
  });

  // Keyboard accessibility: space / enter
  btn.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      const rect = btn.getBoundingClientRect();
      fire(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }
  });
</script>
</body>
</html>
