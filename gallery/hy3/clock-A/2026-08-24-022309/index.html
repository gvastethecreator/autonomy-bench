<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 35%, #1c2541 0%, #0b132b 55%, #04060f 100%);
    color: #e8eef7;
    overflow: hidden;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .clock {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 40%, #20305c 0%, #11192f 70%, #0a1124 100%);
    box-shadow:
      0 0 0 6px #0a1124,
      0 0 0 10px #1c2950,
      0 18px 60px rgba(0,0,0,0.6),
      inset 0 0 40px rgba(0,0,0,0.6);
  }
  .clock::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 1px solid rgba(120,160,255,0.12);
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 12px;
    background: rgba(200,220,255,0.45);
    transform-origin: 50% 0;
  }
  .tick.major {
    width: 4px;
    height: 18px;
    background: rgba(220,235,255,0.85);
  }
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 6px;
    z-index: 5;
  }
  .hour {
    width: 8px;
    height: 78px;
    margin-left: -4px;
    margin-top: -78px;
    background: linear-gradient(#f4f7ff, #cdd8f0);
    box-shadow: 0 0 8px rgba(180,200,255,0.5);
  }
  .minute {
    width: 5px;
    height: 112px;
    margin-left: -2.5px;
    margin-top: -112px;
    background: linear-gradient(#eaf1ff, #aebfe6);
  }
  .second {
    width: 2px;
    height: 128px;
    margin-left: -1px;
    margin-top: -128px;
    background: #ff5c7a;
  }
  .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: #ff5c7a;
    box-shadow: 0 0 10px rgba(255,92,122,0.8);
    z-index: 6;
  }
  .digital {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(120,160,255,0.5);
  }
  .digital .sec { color: #ff5c7a; }
  .date {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8fa6cf;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="clock" id="clock">
      <div class="pin"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
    </div>
    <div class="digital" id="digital">00:00<span class="sec">:00</span></div>
    <div class="date" id="date"></div>
  </div>

<script>
  const clock = document.getElementById('clock');
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg) translateY(-150px)`;
    clock.appendChild(tick);
  }

  const hourH = document.getElementById('hour');
  const minH = document.getElementById('minute');
  const secH = document.getElementById('second');
  const digital = document.getElementById('digital');
  const dateEl = document.getElementById('date');

  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secAngle = (s + ms / 1000) * 6;
    const minAngle = (m + s / 60) * 6;
    const hourAngle = ((h % 12) + m / 60) * 30;

    secH.style.transform = `rotate(${secAngle}deg)`;
    minH.style.transform = `rotate(${minAngle}deg)`;
    hourH.style.transform = `rotate(${hourAngle}deg)`;

    digital.innerHTML = `${pad(h)}:${pad(m)}<span class="sec">:${pad(s)}</span>`;
    dateEl.textContent = `${days[now.getDay()]} ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;

    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
