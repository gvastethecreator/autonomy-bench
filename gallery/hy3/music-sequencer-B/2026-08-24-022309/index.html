<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse — a Web Audio step sequencer</title>
<style>
  :root {
    --bg: #0c0e1a;
    --bg2: #14182b;
    --panel: #1b2036;
    --panel2: #232a45;
    --line: #2c3454;
    --txt: #e7ecff;
    --dim: #8e97c4;
    --accent: #5ce1e6;
    --accent2: #ff6ec7;
    --accent3: #ffd166;
    --glow: 0 0 18px rgba(92,225,230,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,110,199,.10), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(92,225,230,.12), transparent 55%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    color: var(--txt);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
    gap: 22px;
    -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: .5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--dim); margin-top: 6px; max-width: 560px; }
  .stage {
    width: min(960px, 100%);
    background: linear-gradient(180deg, var(--panel), #161b2e);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    padding: 20px;
  }
  .transport {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  button.ctl {
    appearance: none; border: 1px solid var(--line); cursor: pointer;
    background: var(--panel2); color: var(--txt);
    padding: 10px 16px; border-radius: 11px; font-weight: 700; font-size: 14px;
    transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
  }
  button.ctl:hover { background: #2c3556; }
  button.ctl:active { transform: translateY(1px); }
  button.play {
    background: linear-gradient(180deg, var(--accent), #2bb6bc);
    color: #04121a; border-color: transparent; box-shadow: var(--glow);
    min-width: 120px;
  }
  button.play.on { background: linear-gradient(180deg, var(--accent2), #c64a98); color: #1a0011; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .field .val { color: var(--accent3); font-weight: 700; font-size: 13px; }
  input[type=range] { width: 150px; accent-color: var(--accent); }
  select {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; font-weight: 600;
  }
  .spacer { flex: 1; }
  .tracks { display: flex; flex-direction: column; gap: 10px; }
  .track { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; }
  .track .name {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px; user-select: none;
  }
  .swatch { width: 12px; height: 12px; border-radius: 4px; box-shadow: 0 0 10px currentColor; }
  .steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 6px; }
  .step {
    position: relative; aspect-ratio: 1 / 1; border-radius: 8px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line);
    transition: transform .06s ease, box-shadow .12s ease, background .12s ease;
  }
  .step:hover { transform: translateY(-1px); border-color: var(--accent); }
  .step.on { background: var(--c, var(--accent)); border-color: transparent; box-shadow: 0 0 12px var(--c, var(--accent)); }
  .step.beat { background: #1a2138; }
  .step.on.beat { filter: brightness(1.15); }
  .step.playhead { outline: 2px solid #fff; outline-offset: 2px; }
  .step.flash { animation: flash .18s ease; }
  @keyframes flash { from { box-shadow: 0 0 0 4px rgba(255,255,255,.7), 0 0 14px var(--c, var(--accent)); } to {} }
  .step-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: rgba(255,255,255,.0); pointer-events: none;
  }
  .ruler { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; margin-bottom: 8px; }
  .ruler .nums { display: grid; grid-template-columns: repeat(16,1fr); gap: 6px; }
  .ruler .num { text-align: center; color: var(--dim); font-size: 10px; }
  .ruler .num.major { color: var(--txt); font-weight: 700; }
  .hint { color: var(--dim); font-size: 12px; text-align: center; }
  .footer { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .footer button { background: transparent; border: 1px dashed var(--line); color: var(--dim); }
  .footer button:hover { color: var(--txt); border-color: var(--accent); }
  .vu { display: flex; gap: 3px; align-items: flex-end; height: 22px; }
  .vu i { width: 4px; background: var(--accent); border-radius: 2px; height: 3px; opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>PULSE</h1>
  <p>A self-contained step sequencer built entirely on the Web Audio API. No samples — every kick, snare, hat, and note is synthesized live. Press play and watch it breathe.</p>
</header>

<div class="stage">
  <div class="transport">
    <button id="play" class="ctl play">▶ Play</button>
    <div class="field">
      <label>Tempo</label>
      <span class="val"><span id="bpmVal">112</span> BPM</span>
      <input id="bpm" type="range" min="60" max="180" value="112" />
    </div>
    <div class="field">
      <label>Scale</label>
      <select id="scale">
        <option value="minor">A minor</option>
        <option value="major">C major</option>
        <option value="penta">E minor pentatonic</option>
        <option value="dorian">D dorian</option>
      </select>
    </div>
    <div class="field">
      <label>Vibe</label>
      <select id="vibe">
        <option value="house">House groove</option>
        <option value="broken">Broken beat</option>
        <option value="four">Steady four</option>
      </select>
    </div>
    <div class="spacer"></div>
    <div class="field">
      <label>Master</label>
      <input id="vol" type="range" min="0" max="100" value="80" />
    </div>
    <div class="vu" id="vu"></div>
  </div>

  <div class="ruler">
    <div></div>
    <div class="nums" id="ruler"></div>
  </div>

  <div class="tracks" id="tracks"></div>
</div>

<div class="footer">
  <button class="ctl" id="rand">🎲 Randomize</button>
  <button class="ctl" id="clear">✕ Clear</button>
  <button class="ctl" id="demo">★ Demo pattern</button>
</div>
<p class="hint">Click any cell to toggle it. Drums are fixed; the Bass and Lead rows follow the selected scale.</p>

<script>
"use strict";
const STEPS = 16;

/* ---------- Tracks definition ---------- */
const TRACK_DEFS = [
  { id: "kick",  name: "Kick",   color: "#ff6ec7", type: "drum",  synth: "kick"  },
  { id: "snare", name: "Snare",  color: "#ffd166", type: "drum",  synth: "snare" },
  { id: "hat",   name: "Hi-hat", color: "#5ce1e6", type: "drum",  synth: "hat"   },
  { id: "clap",  name: "Clap",   color: "#a78bfa", type: "drum",  synth: "clap"  },
  { id: "bass",  name: "Bass",   color: "#7CFFB2", type: "note",  synth: "bass", base: 41.20 },  // E1
  { id: "lead",  name: "Lead",   color: "#ff9f6e", type: "note",  synth: "lead", base: 164.81 }, // E3
];

/* ---------- Scales (semitone offsets) ---------- */
const SCALES = {
  minor:  [0,2,3,5,7,8,10],
  major:  [0,2,4,5,7,9,11],
  penta:  [0,3,5,7,10],
  dorian: [0,2,3,5,7,9,10],
};

/* ---------- State ---------- */
let pattern = {}; // id -> bool[16]
let scaleName = "minor";
let vibe = "house";
let bpm = 112;
let masterVol = 0.8;
let playing = false;
let currStep = 0;
let nextNoteTime = 0;
let timerId = null;
let audioCtx = null;
let masterGain = null;
let analyser = null;
let stepDurations = []; // per-track per-step element refs

function emptyPattern() {
  const p = {};
  TRACK_DEFS.forEach(t => p[t.id] = new Array(STEPS).fill(false));
  return p;
}
pattern = emptyPattern();

/* ---------- Audio engine ---------- */
function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = masterVol;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
  buildVU();
}

function midiRatio(semi) { return Math.pow(2, semi / 12); }

function freqFromScale(track, stepIndex, base) {
  // pick a scale degree based on position for musical movement
  const sc = SCALES[scaleName];
  // deterministic pseudo-melody from step
  const degree = sc[(stepIndex * 3 + (track.id === "lead" ? 2 : 0)) % sc.length];
  const octave = track.id === "lead" ? 1 : 0;
  return base * midiRatio(degree + octave * 12);
}

/* --- Voices --- */
function playKick(t) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1.0, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.4);
}

function playSnare(t) {
  // noise burst + tone
  const noise = audioCtx.createBufferSource();
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noise.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = "highpass"; bp.frequency.value = 1500;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.7, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  noise.connect(bp); bp.connect(ng); ng.connect(masterGain);
  noise.start(t); noise.stop(t + 0.2);

  const o = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(180, t);
  og.gain.setValueAtTime(0.5, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(og); og.connect(masterGain);
  o.start(t); o.stop(t + 0.13);
}

function playHat(t) {
  const noise = audioCtx.createBufferSource();
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noise.buffer = buf;
  const hp = audioCtx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 7000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  noise.connect(hp); hp.connect(g); g.connect(masterGain);
  noise.start(t); noise.stop(t + 0.06);
}

function playClap(t) {
  const noise = audioCtx.createBufferSource();
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.18, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noise.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = 1200; bp.Q.value = 1.2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  [0, 0.012, 0.024].forEach(off => {
    g.gain.setValueAtTime(0.5, t + off);
    g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.04);
  });
  g.gain.setValueAtTime(0.4, t + 0.036);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  noise.connect(bp); bp.connect(g); g.connect(masterGain);
  noise.start(t); noise.stop(t + 0.2);
}

function playBass(t, freq) {
  const o = audioCtx.createOscillator();
  const o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.setValueAtTime(800, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.25);
  o.type = "sawtooth"; o.frequency.value = freq;
  o2.type = "square"; o2.frequency.value = freq / 2; o2.detune.value = -6;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.55, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.32);
  o2.start(t); o2.stop(t + 0.32);
}

function playLead(t, freq) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 3000;
  o.type = "triangle"; o.frequency.value = freq;
  o.detune.value = 4;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.28, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(lp); lp.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.42);
}

function triggerTrack(track, stepIndex, t) {
  switch (track.synth) {
    case "kick":  playKick(t); break;
    case "snare": playSnare(t); break;
    case "hat":   playHat(t); break;
    case "clap":  playClap(t); break;
    case "bass":  playBass(t, freqFromScale(track, stepIndex, track.base)); break;
    case "lead":  playLead(t, freqFromScale(track, stepIndex, track.base)); break;
  }
}

/* ---------- Scheduler ---------- */
function secondsPerStep() {
  // 16 steps = 4 beats (16th notes)
  return (60 / bpm) / 4;
}

function patternForVibe() {
  // Returns set of step indices that should be "candidates" for a given vibe timing
  return null; // handled in scheduler via probabilities
}

function scheduleStep(step, time) {
  TRACK_DEFS.forEach(track => {
    if (pattern[track.id][step]) {
      triggerTrack(track, step, time);
    }
  });
  // visual
  const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
  setTimeout(() => {
    highlightStep(step);
  }, delay);
}

function highlightStep(step) {
  document.querySelectorAll(".step.playhead").forEach(e => e.classList.remove("playhead"));
  TRACK_DEFS.forEach(track => {
    const el = stepDurations[track.id][step];
    if (!el) return;
    el.classList.add("playhead");
    if (pattern[track.id][step]) {
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
  });
}

function scheduler() {
  while (nextNoteTime < audioCtx.currentTime + 0.1) {
    scheduleStep(currStep, nextNoteTime);
    nextNoteTime += secondsPerStep();
    currStep = (currStep + 1) % STEPS;
  }
  timerId = setTimeout(scheduler, 25);
}

/* ---------- UI build ---------- */
function buildRuler() {
  const r = document.getElementById("ruler");
  r.innerHTML = "";
  for (let i = 0; i < STEPS; i++) {
    const n = document.createElement("div");
    n.className = "num" + (i % 4 === 0 ? " major" : "");
    n.textContent = i + 1;
    r.appendChild(n);
  }
}

function buildTracks() {
  const wrap = document.getElementById("tracks");
  wrap.innerHTML = "";
  stepDurations = {};
  TRACK_DEFS.forEach(track => {
    stepDurations[track.id] = [];
    const row = document.createElement("div");
    row.className = "track";

    const name = document.createElement("div");
    name.className = "name";
    name.innerHTML = `<span class="swatch" style="background:${track.color};color:${track.color}"></span>${track.name}`;
    row.appendChild(name);

    const steps = document.createElement("div");
    steps.className = "steps";
    for (let i = 0; i < STEPS; i++) {
      const s = document.createElement("div");
      s.className = "step" + (i % 4 === 0 ? " beat" : "");
      s.style.setProperty("--c", track.color);
      s.dataset.id = track.id; s.dataset.step = i;
      if (pattern[track.id][i]) s.classList.add("on");
      s.addEventListener("click", () => toggleCell(track.id, i, s));
      steps.appendChild(s);
      stepDurations[track.id].push(s);
    }
    row.appendChild(steps);
    wrap.appendChild(row);
  });
}

function toggleCell(id, step, el) {
  pattern[id][step] = !pattern[id][step];
  el.classList.toggle("on", pattern[id][step]);
  // audition the sound on click
  ensureAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (pattern[id][step]) {
    const tr = TRACK_DEFS.find(t => t.id === id);
    triggerTrack(tr, step, audioCtx.currentTime + 0.01);
  }
}

function syncGrid() {
  TRACK_DEFS.forEach(track => {
    pattern[track.id].forEach((on, i) => {
      stepDurations[track.id][i].classList.toggle("on", on);
    });
  });
}

/* ---------- VU meter ---------- */
function buildVU() {
  const vu = document.getElementById("vu");
  vu.innerHTML = "";
  const bars = [];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement("i");
    vu.appendChild(b); bars.push(b);
  }
  const data = new Uint8Array(analyser.frequencyBinCount);
  function draw() {
    if (!playing) { bars.forEach(b => b.style.height = "3px"); requestAnimationFrame(draw); return; }
    analyser.getByteFrequencyData(data);
    const n = bars.length;
    for (let i = 0; i < n; i++) {
      const v = data[Math.floor(i / n * data.length)] / 255;
      bars[i].style.height = Math.max(3, v * 22) + "px";
      bars[i].style.opacity = 0.5 + v * 0.5;
    }
    requestAnimationFrame(draw);
  }
  draw();
}

/* ---------- Controls ---------- */
const playBtn = document.getElementById("play");
playBtn.addEventListener("click", () => {
  ensureAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();
  playing ? stop() : start();
});

function start() {
  playing = true;
  currStep = 0;
  nextNoteTime = audioCtx.currentTime + 0.06;
  playBtn.textContent = "■ Stop";
  playBtn.classList.add("on");
  scheduler();
}

function stop() {
  playing = false;
  playBtn.textContent = "▶ Play";
  playBtn.classList.remove("on");
  clearTimeout(timerId);
  document.querySelectorAll(".step.playhead").forEach(e => e.classList.remove("playhead"));
}

document.getElementById("bpm").addEventListener("input", e => {
  bpm = +e.target.value;
  document.getElementById("bpmVal").textContent = bpm;
});
document.getElementById("scale").addEventListener("change", e => {
  scaleName = e.target.value;
});
document.getElementById("vibe").addEventListener("change", e => {
  vibe = e.target.value;
  applyVibe(vibe);
});
document.getElementById("vol").addEventListener("input", e => {
  masterVol = e.target.value / 100;
  if (masterGain) masterGain.gain.value = masterVol;
});

document.getElementById("clear").addEventListener("click", () => {
  pattern = emptyPattern();
  syncGrid();
});
document.getElementById("rand").addEventListener("click", () => {
  randomize();
  syncGrid();
});
document.getElementById("demo").addEventListener("click", () => {
  demoPattern();
  syncGrid();
});

/* ---------- Pattern generators ---------- */
function applyVibe(v) {
  // reset note tracks; keep user drums? For simplicity, regenerate a matching groove on drums too.
  pattern = emptyPattern();
  if (v === "four") {
    for (let i = 0; i < STEPS; i += 4) pattern.kick[i] = true;
    pattern.snare[4] = true; pattern.snare[12] = true;
    for (let i = 0; i < STEPS; i += 2) pattern.hat[i] = true;
  } else if (v === "house") {
    pattern.kick[0] = true; pattern.kick[4] = true; pattern.kick[8] = true; pattern.kick[12] = true;
    pattern.kick[14] = true;
    pattern.snare[4] = true; pattern.snare[12] = true;
    for (let i = 2; i < STEPS; i += 2) pattern.hat[i] = true;
    pattern.hat[15] = true;
  } else if (v === "broken") {
    pattern.kick[0] = true; pattern.kick[7] = true; pattern.kick[10] = true;
    pattern.snare[4] = true; pattern.snare[13] = true;
    [0,3,5,6,9,11,14].forEach(i => pattern.hat[i] = true);
    pattern.clap[12] = true;
  }
  // add some notes
  [0,3,6,8,11,14].forEach(i => pattern.bass[i] = true);
  [2,5,7,10,13,15].forEach(i => pattern.lead[i] = true);
}

function demoPattern() {
  pattern = emptyPattern();
  // a polished little loop
  pattern.kick[0] = pattern.kick[4] = pattern.kick[8] = pattern.kick[12] = true;
  pattern.snare[4] = pattern.snare[12] = true;
  for (let i = 2; i < STEPS; i += 2) pattern.hat[i] = true;
  pattern.hat[7] = pattern.hat[15] = true;
  pattern.clap[12] = true;
  pattern.bass[0] = pattern.bass[6] = pattern.bass[10] = true;
  pattern.lead[2] = pattern.lead[5] = pattern.lead[9] = pattern.lead[13] = pattern.lead[15] = true;
}

function randomize() {
  const prob = { kick: 0.28, snare: 0.12, hat: 0.5, clap: 0.08, bass: 0.3, lead: 0.35 };
  TRACK_DEFS.forEach(t => {
    for (let i = 0; i < STEPS; i++) {
      pattern[t.id][i] = Math.random() < prob[t.id];
    }
  });
  // ensure a downbeat
  pattern.kick[0] = true;
  pattern.snare[4] = pattern.snare[12] = true;
}

buildRuler();
buildTracks();
demoPattern();
syncGrid();
