<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>ASTEROIDS — Vector Arcade</title>
<style>
  :root {
    --bg: #05060a;
    --ink: #d7f5ff;
    --accent: #5ad1ff;
    --warn: #ff7b5a;
    --dim: #4a6370;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background:
      radial-gradient(ellipse at 50% 40%, #0a1320 0%, #05060a 70%, #03040700 100%);
    box-shadow: 0 0 80px rgba(90, 209, 255, 0.08), inset 0 0 120px rgba(0,0,0,0.6);
    image-rendering: auto;
  }
  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    letter-spacing: 2px;
    font-size: 14px;
    text-transform: uppercase;
  }
  #hud .score { color: var(--ink); text-shadow: 0 0 10px rgba(90,209,255,0.5); }
  #hud .right { text-align: right; }
  #hud .lvl { color: var(--dim); }
  #lives { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .lifeicon {
    width: 16px; height: 16px;
    border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(90,209,255,0.4);
    clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%);
  }
  /* overlays */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 18px;
    background: radial-gradient(ellipse at center, rgba(5,6,10,0.55), rgba(5,6,10,0.9));
    backdrop-filter: blur(2px);
    transition: opacity .4s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(40px, 9vw, 92px);
    letter-spacing: 14px;
    color: var(--ink);
    text-shadow: 0 0 18px rgba(90,209,255,0.6), 0 0 40px rgba(90,209,255,0.25);
    animation: flicker 4s infinite;
  }
  .sub { color: var(--dim); letter-spacing: 4px; font-size: 13px; }
  .keys {
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 18px;
    font-size: 13px;
    color: var(--ink);
    margin-top: 6px;
  }
  .keys b { color: var(--accent); }
  .btn {
    margin-top: 10px;
    pointer-events: auto;
    cursor: pointer;
    border: 2px solid var(--accent);
    color: var(--accent);
    background: transparent;
    padding: 12px 30px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all .2s ease;
    box-shadow: 0 0 14px rgba(90,209,255,0.15);
  }
  .btn:hover { background: var(--accent); color: #05060a; box-shadow: 0 0 26px rgba(90,209,255,0.5); }
  .big { font-size: clamp(30px, 7vw, 64px); letter-spacing: 8px; }
  .win { color: var(--accent); }
  .lose { color: var(--warn); }
  @keyframes flicker {
    0%, 92%, 96%, 100% { opacity: 1; }
    93% { opacity: .6; }
    95% { opacity: .85; }
  }
  #hint {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--dim);
    pointer-events: none;
  }
  /* mobile controls */
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  .pad {
    position: absolute;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 2px solid rgba(90,209,255,0.35);
    background: rgba(90,209,255,0.06);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 24px;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .pad:active { background: rgba(90,209,255,0.2); }
  #tLeft  { left: 18px;  bottom: 24px; }
  #tRight { left: 120px; bottom: 24px; }
  #tThrust { right: 18px; bottom: 24px; }
  #tFire  { right: 120px; bottom: 34px; }
  body.touch #touch { display: block; }
  body.touch #hint { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="score">SCORE <span id="scoreVal">0</span><div class="lvl">LV <span id="lvVal">1</span> · BEST <span id="bestVal">0</span></div></div>
    <div class="right">LIVES
      <div id="lives"></div>
    </div>
  </div>

  <div id="start" class="overlay">
    <div class="title">ASTEROIDS</div>
    <div class="sub">VECTOR ARCADE</div>
    <div class="keys">
      <span>ROTATE</span><b>← → / A D</b>
      <span>THRUST</span><b>↑ / W</b>
      <span>FIRE</span><b>SPACE</b>
      <span>HYPERSPACE</span><b>SHIFT</b>
    </div>
    <button class="btn" id="startBtn">Launch</button>
  </div>

  <div id="over" class="overlay hidden">
    <div class="big lose" id="overTitle">GAME OVER</div>
    <div class="sub">SCORE <span id="finalScore">0</span></div>
    <button class="btn" id="retryBtn">Play Again</button>
  </div>

  <div id="touch">
    <div class="pad" id="tLeft">⟲</div>
    <div class="pad" id="tRight">⟳</div>
    <div class="pad" id="tThrust">▲</div>
    <div class="pad" id="tFire">●</div>
  </div>

  <div id="hint">MOVE = ARROWS / WASD &nbsp;·&nbsp; FIRE = SPACE &nbsp;·&nbsp; HYPERSPACE = SHIFT</div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---- responsive sizing (keeps a 1:1-ish play area, letterboxed) ----
  let W = 0, H = 0, DPR = 1;
  function resize() {
    const maxW = Math.min(window.innerWidth, 1100);
    const maxH = Math.min(window.innerHeight, 760);
    // keep aspect around 4:3 for that arcade feel
    let w = maxW, h = maxH;
    if (w / h > 4 / 3) w = h * (4 / 3);
    else h = w * (3 / 4);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(w); H = Math.floor(h);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- input ----
  const keys = Object.create(null);
  const pressed = Object.create(null);
  function setKey(code, down) {
    if (down && !keys[code]) pressed[code] = true;
    keys[code] = down;
  }
  window.addEventListener("keydown", (e) => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
    setKey(e.code, true);
  });
  window.addEventListener("keyup", (e) => setKey(e.code, false));

  function bindTouch(id, on) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); on(true); };
    const end = (e) => { e.preventDefault(); on(false); };
    el.addEventListener("touchstart", start, {passive:false});
    el.addEventListener("touchend", end, {passive:false});
    el.addEventListener("touchcancel", end, {passive:false});
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", end);
    el.addEventListener("mouseleave", end);
  }

  // ---- math helpers ----
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  function wrap(o) {
    if (o.x < -o.r) o.x = W + o.r;
    else if (o.x > W + o.r) o.x = -o.r;
    if (o.y < -o.r) o.y = H + o.r;
    else if (o.y > H + o.r) o.y = -o.r;
  }

  // ---- game state ----
  const State = { MENU: 0, PLAY: 1, DEAD: 2, OVER: 3 };
  let state = State.MENU;

  let score = 0;
  let best = Number(localStorage.getItem("ast_best") || 0);
  let level = 1;
  let lives = 3;

  const ship = {
    x: 0, y: 0, vx: 0, vy: 0, a: -Math.PI / 2,
    r: 14, thrust: false, invuln: 0, alive: true, dead: 0,
  };
  let bullets = [];
  let rocks = [];
  let particles = [];
  let shake = 0;
  let respawnTimer = 0;
  let levelClearTimer = 0;

  // ---- starfield (parallax) ----
  const stars = Array.from({ length: 90 }, () => ({
    x: Math.random(), y: Math.random(),
    z: rand(0.3, 1), s: rand(0.4, 1.6),
  }));

  // ---- factories ----
  function makeRock(x, y, size) {
    // size: 3 big, 2 med, 1 small
    const r = { 3: 52, 2: 30, 1: 17 }[size];
    const speed = rand(18, 28 + (3 - size) * 14);
    const ang = rand(0, TAU);
    const verts = randInt(9, 13);
    const shape = [];
    for (let i = 0; i < verts; i++) {
      shape.push(rand(0.7, 1.15));
    }
    return {
      x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      r, size, a: rand(0, TAU), va: rand(-0.9, 0.9),
      shape, verts,
    };
  }

  function spawnLevel(n) {
    rocks = [];
    const count = 3 + n;
    for (let i = 0; i < count; i++) {
      // spawn away from ship
      let x, y, tries = 0;
      do {
        x = rand(0, W); y = rand(0, H); tries++;
      } while (Math.hypot(x - ship.x, y - ship.y) < 160 && tries < 30);
      rocks.push(makeRock(x, y, 3));
    }
  }

  function resetShip(invuln) {
    ship.x = W / 2; ship.y = H / 2;
    ship.vx = 0; ship.vy = 0;
    ship.a = -Math.PI / 2;
    ship.thrust = false;
    ship.invuln = invuln || 0;
    ship.alive = true;
    ship.dead = 0;
  }

  function newGame() {
    score = 0; level = 1; lives = 3;
    bullets = []; particles = [];
    resetShip(2.2);
    spawnLevel(level);
    updateHUD();
    state = State.PLAY;
  }

  // ---- effects ----
  function burst(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU);
      const s = rand(spd * 0.3, spd);
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(0.3, 0.8), max: 0.8, color,
        r: rand(1, 2.4),
      });
    }
  }

  function fire() {
    if (!ship.alive) return;
    if (bullets.length > 5) return;
    const sx = ship.x + Math.cos(ship.a) * ship.r;
    const sy = ship.y + Math.sin(ship.a) * ship.r;
    bullets.push({
      x: sx, y: sy,
      vx: Math.cos(ship.a) * 460 + ship.vx,
      vy: Math.sin(ship.a) * 460 + ship.vy,
      life: 0.85, r: 2,
    });
    // recoil
    ship.vx -= Math.cos(ship.a) * 6;
    ship.vy -= Math.sin(ship.a) * 6;
  }

  function hyperspace() {
    if (!ship.alive) return;
    burst(ship.x, ship.y, "#5ad1ff", 18, 160);
    ship.x = rand(40, W - 40);
    ship.y = rand(40, H - 40);
    ship.vx = rand(-30, 30); ship.vy = rand(-30, 30);
    ship.invuln = 1.2;
    burst(ship.x, ship.y, "#5ad1ff", 18, 160);
  }

  function killShip() {
    if (ship.invuln > 0 || !ship.alive) return;
    ship.alive = false;
    ship.dead = 1.6;
    burst(ship.x, ship.y, "#ff7b5a", 36, 220);
    burst(ship.x, ship.y, "#d7f5ff", 18, 120);
    shake = 22;
    lives--;
    updateHUD();
    if (lives <= 0) {
      setTimeout(() => { state = State.OVER; showOver(); }, 1400);
    } else {
      respawnTimer = 1.6;
    }
  }

  function splitRock(idx) {
    const rk = rocks[idx];
    burst(rk.x, rk.y, "#9fe8ff", 14, 160);
    const pts = { 3: 20, 2: 50, 1: 100 }[rk.size];
    addScore(pts);
    if (rk.size > 1) {
      const newsize = rk.size - 1;
      for (let i = 0; i < 2; i++) {
        const nr = makeRock(rk.x, rk.y, newsize);
        // inherit a little momentum from parent
        nr.vx += rk.vx * 0.4;
        nr.vy += rk.vy * 0.4;
        rocks.push(nr);
      }
    }
    rocks.splice(idx, 1);
  }

  function addScore(p) {
    score += p;
    if (score > best) { best = score; localStorage.setItem("ast_best", best); }
    updateHUD();
  }

  // ---- update ----
  function update(dt) {
    if (state !== State.PLAY) {
      // still animate particles & stars
      updateParticles(dt);
      return;
    }

    // ship control
    if (ship.alive) {
      let turn = 0;
      if (keys.ArrowLeft || keys.KeyA) turn -= 1;
      if (keys.ArrowRight || keys.KeyD) turn += 1;
      ship.a += turn * 3.6 * dt;

      ship.thrust = !!(keys.ArrowUp || keys.KeyW);
      if (ship.thrust) {
        ship.vx += Math.cos(ship.a) * 240 * dt;
        ship.vy += Math.sin(ship.a) * 240 * dt;
        if (Math.random() < 0.6) {
          const ba = ship.a + Math.PI + rand(-0.3, 0.3);
          particles.push({
            x: ship.x + Math.cos(ship.a) * -ship.r,
            y: ship.y + Math.sin(ship.a) * -ship.r,
            vx: Math.cos(ba) * rand(60, 160) + ship.vx,
            vy: Math.sin(ba) * rand(60, 160) + ship.vy,
            life: rand(0.2, 0.5), max: 0.5, color: Math.random() < 0.5 ? "#ffb35a" : "#ff7b5a",
            r: rand(1, 2),
          });
        }
      }

      // friction
      ship.vx *= 0.992;
      ship.vy *= 0.992;
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;
      wrap(ship);

      if (ship.invuln > 0) ship.invuln -= dt;

      // fire (auto-repeat with cadence)
      if (keys.Space) {
        if (!ship._fireCd || ship._fireCd <= 0) { fire(); ship._fireCd = 0.16; }
        else ship._fireCd -= dt;
      } else ship._fireCd = 0;
    } else {
      if (respawnTimer > 0) {
        respawnTimer -= dt;
        if (respawnTimer <= 0) resetShip(2.2);
      }
    }

    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= dt;
      wrap(b);
      if (b.life <= 0) bullets.splice(i, 1);
    }

    // rocks
    for (const rk of rocks) {
      rk.x += rk.vx * dt; rk.y += rk.vy * dt;
      rk.a += rk.va * dt;
      wrap(rk);
    }

    // collisions: bullet vs rock
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = rocks.length - 1; j >= 0; j--) {
        const rk = rocks[j];
        if (Math.hypot(b.x - rk.x, b.y - rk.y) < rk.r) {
          bullets.splice(i, 1);
          splitRock(j);
          break;
        }
      }
    }

    // collisions: ship vs rock
    if (ship.alive && ship.invuln <= 0) {
      for (const rk of rocks) {
        if (Math.hypot(ship.x - rk.x, ship.y - rk.y) < rk.r + ship.r * 0.7) {
          killShip();
          break;
        }
      }
    }

    // level clear
    if (rocks.length === 0) {
      levelClearTimer += dt;
      if (levelClearTimer > 0.8) {
        level++;
        levelClearTimer = 0;
        addScore(100 * level); // clear bonus
        spawnLevel(level);
        resetShip(2.2);
        updateHUD();
      }
    } else {
      levelClearTimer = 0;
    }

    updateParticles(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---- render ----
  function draw() {
    ctx.clearRect(0, 0, W, H);

    let sx = 0, sy = 0;
    if (shake > 0) { sx = rand(-shake, shake); sy = rand(-shake, shake); }
    ctx.save();
    ctx.translate(sx, sy);

    // starfield
    for (const st of stars) {
      const x = st.x * W, y = st.y * H;
      ctx.globalAlpha = 0.25 + st.z * 0.5;
      ctx.fillStyle = "#9fd4e6";
      ctx.fillRect(x, y, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    // rocks
    for (const rk of rocks) drawRock(rk);

    // bullets
    ctx.fillStyle = "#d7f5ff";
    ctx.shadowColor = "#5ad1ff";
    ctx.shadowBlur = 8;
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ship
    if (ship.alive || ship.dead > 0) drawShip();

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // level clear banner
    if (state === State.PLAY && levelClearTimer > 0 && rocks.length === 0) {
      ctx.fillStyle = "#5ad1ff";
      ctx.font = "bold 28px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.shadowColor = "#5ad1ff"; ctx.shadowBlur = 16;
      ctx.fillText("SECTOR CLEAR", W / 2, H / 2);
      ctx.shadowBlur = 0;
      ctx.textAlign = "left";
    }

    ctx.restore();
  }

  function drawShip() {
    // blink while invulnerable
    if (ship.invuln > 0 && Math.floor(ship.invuln * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.a);
    ctx.strokeStyle = "#d7f5ff";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.shadowColor = "#5ad1ff";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(ship.r, 0);
    ctx.lineTo(-ship.r * 0.8, -ship.r * 0.7);
    ctx.lineTo(-ship.r * 0.45, 0);
    ctx.lineTo(-ship.r * 0.8, ship.r * 0.7);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawRock(rk) {
    ctx.save();
    ctx.translate(rk.x, rk.y);
    ctx.rotate(rk.a);
    ctx.strokeStyle = "#a9d9e6";
    ctx.lineWidth = 2;
    ctx.shadowColor = "rgba(90,209,255,0.4)";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i < rk.verts; i++) {
      const ang = (i / rk.verts) * TAU;
      const rr = rk.r * rk.shape[i];
      const px = Math.cos(ang) * rr;
      const py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ---- HUD ----
  const scoreVal = document.getElementById("scoreVal");
  const lvVal = document.getElementById("lvVal");
  const bestVal = document.getElementById("bestVal");
  const livesEl = document.getElementById("lives");
  function updateHUD() {
    scoreVal.textContent = score;
    lvVal.textContent = level;
    bestVal.textContent = best;
    livesEl.innerHTML = "";
    for (let i = 0; i < Math.max(0, lives); i++) {
      const d = document.createElement("div");
      d.className = "lifeicon";
      livesEl.appendChild(d);
    }
  }
  updateHUD();

  // ---- overlays ----
  const startOv = document.getElementById("start");
  const overOv = document.getElementById("over");
  const finalScore = document.getElementById("finalScore");
  function showOver() {
    finalScore.textContent = score;
    overOv.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    startOv.classList.add("hidden");
    newGame();
  });
  document.getElementById("retryBtn").addEventListener("click", () => {
    overOv.classList.add("hidden");
    newGame();
  });

  // hyperspace edge-trigger
  window.addEventListener("keydown", (e) => {
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") {
      if (!e.repeat && state === State.PLAY) hyperspace();
    }
  });

  // ---- touch ----
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
    document.body.classList.add("touch");
    bindTouch("tLeft", (d) => keys.ArrowLeft = d);
    bindTouch("tRight", (d) => keys.ArrowRight = d);
    bindTouch("tThrust", (d) => keys.ArrowUp = d);
    const fireEl = document.getElementById("tFire");
    const fstart = (e) => { e.preventDefault(); keys.Space = true; };
    const fend = (e) => { e.preventDefault(); keys.Space = false; };
    fireEl.addEventListener("touchstart", fstart, {passive:false});
    fireEl.addEventListener("touchend", fend, {passive:false});
    fireEl.addEventListener("mousedown", fstart);
    fireEl.addEventListener("mouseup", fend);
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // draw a faint idle scene behind the menu
  resetShip(99);
  spawnLevel(1);
  state = State.MENU;
})();
</script>
</body>
