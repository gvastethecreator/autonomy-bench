<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Liquid Chroma — Fluid Simulation</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #eef1ff;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #c { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  .hud {
    position: fixed; left: 18px; top: 16px; z-index: 5;
    pointer-events: none; max-width: 60vw;
    text-shadow: 0 1px 14px rgba(0,0,0,.7);
  }
  .hud h1 {
    font-size: clamp(18px, 3.2vw, 30px);
    font-weight: 700; letter-spacing: .5px;
    background: linear-gradient(90deg,#ff5ea2,#7c5cff,#33e0ff,#5dff9b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud p { font-size: 13px; opacity: .72; margin-top: 4px; font-weight: 400; }

  .panel {
    position: fixed; right: 16px; top: 16px; z-index: 6;
    background: rgba(16,18,30,.55);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 14px; padding: 12px 14px;
    width: 220px; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .panel .row { display: flex; align-items: center; justify-content: space-between; margin: 9px 0; font-size: 12px; }
  .panel label { opacity: .8; }
  .panel input[type=range] { width: 110px; accent-color: #7c5cff; }
  .panel .btns { display: flex; gap: 8px; margin-top: 10px; }
  .panel button {
    flex: 1; cursor: pointer; font-size: 12px; font-weight: 600;
    color: #eef1ff; background: rgba(124,92,255,.22);
    border: 1px solid rgba(124,92,255,.45); border-radius: 9px; padding: 7px 4px;
    transition: .15s;
  }
  .panel button:hover { background: rgba(124,92,255,.4); }
  .panel .title { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .5; margin-bottom: 6px; }
  .toggle { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 18px; z-index: 5;
    text-align: center; font-size: 12.5px; opacity: .55; pointer-events: none;
    text-shadow: 0 1px 10px rgba(0,0,0,.8);
  }
  #err {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 30px;
    background: #07080f; color: #ff9bbb; font-size: 15px; line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>Liquid Chroma</h1>
  <p>A living fluid of light. Move to stir, click for color bursts.</p>
</div>

<div class="panel">
  <div class="title">Controls</div>
  <div class="row"><label>Swirl</label><input id="curl" type="range" min="0" max="50" value="30"></div>
  <div class="row"><label>Viscosity</label><input id="diss" type="range" min="0" max="40" value="10"></div>
  <div class="row"><label>Auto paint</label><input id="auto" type="range" min="0" max="100" value="55"></div>
  <div class="row"><label class="toggle"><input id="sound" type="checkbox"> Sound</label></div>
  <div class="btns">
    <button id="splat">Burst</button>
    <button id="clear">Clear</button>
  </div>
</div>

<div class="hint">Drag to paint · Click for a colorful splash · Press <b>Space</b> to reset</div>
<div id="err"></div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById('c');
  const errEl = document.getElementById('err');

  function fail(msg) {
    errEl.style.display = 'flex';
    errEl.textContent = msg;
    throw new Error(msg);
  }

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) fail('WebGL is not available in this browser, so the fluid cannot flow.');

  // ---- float texture support ----
  const halfFloatExt = gl.getExtension('OES_texture_half_float');
  const supportLinear = gl.getExtension('OES_texture_half_float_linear');
  let halfFloat = (halfFloatExt && halfFloatExt.HALF_FLOAT_OES) || null;
  const texType = halfFloat || gl.UNSIGNED_BYTE;

  function addShader(src, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      fail('Shader error: ' + gl.getShaderInfoLog(s));
    }
    return s;
  }
  function makeProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, addShader(vs, gl.VERTEX_SHADER));
    gl.attachShader(p, addShader(fs, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      fail('Link error: ' + gl.getProgramInfoLog(p));
    }
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      uniforms[name] = gl.getUniformLocation(p, name);
    }
    return { program: p, uniforms };
  }

  const baseVert = `
    precision highp float;
    attribute vec2 aPos;
    varying vec2 vUv;
    varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
    uniform vec2 texelSize;
    void main () {
      vUv = aPos * 0.5 + 0.5;
      vL = vUv - vec2(texelSize.x, 0.0);
      vR = vUv + vec2(texelSize.x, 0.0);
      vT = vUv + vec2(0.0, texelSize.y);
      vB = vUv - vec2(0.0, texelSize.y);
      gl_Position = vec4(aPos, 0.0, 1.0);
    }`;

  const clearFrag = `
    precision mediump float; precision mediump sampler2D;
    varying vec2 vUv; uniform sampler2D uTex; uniform float value;
    void main () { gl_FragColor = value * texture2D(uTex, vUv); }`;

  const splatFrag = `
    precision highp float; precision highp sampler2D;
    varying vec2 vUv; uniform sampler2D uTarget;
    uniform float aspectRatio; uniform vec3 color; uniform vec2 point; uniform float radius;
    void main () {
      vec2 p = vUv - point.xy; p.x *= aspectRatio;
      vec3 splat = exp(-dot(p, p) / radius) * color;
      vec3 base = texture2D(uTarget, vUv).xyz;
      gl_FragColor = vec4(base + splat, 1.0);
    }`;

  const advectionFrag = `
    precision highp float; precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uVelocity; uniform sampler2D uSource;
    uniform vec2 texelSize; uniform float dt; uniform float dissipation;
    void main () {
      vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
      vec4 result = texture2D(uSource, coord);
      float decay = 1.0 + dissipation * dt;
      gl_FragColor = result / decay;
    }`;

  const divergenceFrag = `
    precision mediump float; precision mediump sampler2D;
    varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uVelocity, vL).x;
      float R = texture2D(uVelocity, vR).x;
      float T = texture2D(uVelocity, vT).y;
      float B = texture2D(uVelocity, vB).y;
      vec2 C = texture2D(uVelocity, vUv).xy;
      if (vL.x < 0.0) L = -C.x;
      if (vR.x > 1.0) R = -C.x;
      if (vT.y > 1.0) T = -C.y;
      if (vB.y < 0.0) B = -C.y;
      float div = 0.5 * (R - L + T - B);
      gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }`;

  const curlFrag = `
    precision mediump float; precision mediump sampler2D;
    varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uVelocity, vL).y;
      float R = texture2D(uVelocity, vR).y;
      float T = texture2D(uVelocity, vT).x;
      float B = texture2D(uVelocity, vB).x;
      float vorticity = R - L - T + B;
      gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }`;

  const vorticityFrag = `
    precision highp float; precision highp sampler2D;
    varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
    uniform sampler2D uVelocity; uniform sampler2D uCurl;
    uniform float curl; uniform float dt;
    void main () {
      float L = texture2D(uCurl, vL).x;
      float R = texture2D(uCurl, vR).x;
      float T = texture2D(uCurl, vT).x;
      float B = texture2D(uCurl, vB).x;
      float C = texture2D(uCurl, vUv).x;
      vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      force /= length(force) + 0.0001;
      force *= curl * C;
      force.y *= -1.0;
      vec2 vel = texture2D(uVelocity, vUv).xy;
      vel += force * dt;
      vel = min(max(vel, -1000.0), 1000.0);
      gl_FragColor = vec4(vel, 0.0, 1.0);
    }`;

  const pressureFrag = `
    precision mediump float; precision mediump sampler2D;
    varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
    uniform sampler2D uPressure; uniform sampler2D uDivergence;
    void main () {
      float L = texture2D(uPressure, vL).x;
      float R = texture2D(uPressure, vR).x;
      float T = texture2D(uPressure, vT).x;
      float B = texture2D(uPressure, vB).x;
      float divergence = texture2D(uDivergence, vUv).x;
      float pressure = (L + R + B + T - divergence) * 0.25;
      gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }`;

  const gradientFrag = `
    precision mediump float; precision mediump sampler2D;
    varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
    uniform sampler2D uPressure; uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uPressure, vL).x;
      float R = texture2D(uPressure, vR).x;
      float T = texture2D(uPressure, vT).x;
      float B = texture2D(uPressure, vB).x;
      vec2 velocity = texture2D(uVelocity, vUv).xy;
      velocity.xy -= vec2(R - L, T - B);
      gl_FragColor = vec4(velocity, 0.0, 1.0);
    }`;

  const displayFrag = `
    precision highp float; precision highp sampler2D;
    varying vec2 vUv; uniform sampler2D uTexture;
    void main () {
      vec3 c = texture2D(uTexture, vUv).rgb;
      // soft tone + subtle bloom-ish lift so colors glow
      c = c / (1.0 + c) * 1.35;
      float g = max(c.r, max(c.g, c.b));
      c += c * g * 0.25;
      gl_FragColor = vec4(c, 1.0);
    }`;

  const clearProg = makeProgram(baseVert, clearFrag);
  const splatProg = makeProgram(baseVert, splatFrag);
  const advectionProg = makeProgram(baseVert, advectionFrag);
  const divergenceProg = makeProgram(baseVert, divergenceFrag);
  const curlProg = makeProgram(baseVert, curlFrag);
  const vorticityProg = makeProgram(baseVert, vorticityFrag);
  const pressureProg = makeProgram(baseVert, pressureFrag);
  const gradientProg = makeProgram(baseVert, gradientFrag);
  const displayProg = makeProgram(baseVert, displayFrag);

  // full-screen triangle/quad
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  function bindQuad(prog) {
    const loc = gl.getAttribLocation(prog.program, 'aPos');
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  }

  function createFBO(w, h, type, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const clr = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, clr);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);
    const cbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, cbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, clr, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return {
      texture: tex, fbo, width: w, height: h,
      attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, tex); return id; }
    };
  }
  function createDoubleFBO(w, h, type, filter) {
    let fbo1 = createFBO(w, h, type, filter);
    let fbo2 = createFBO(w, h, type, filter);
    return {
      width: w, height: h,
      get read() { return fbo1; },
      get write() { return fbo2; },
      swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
    };
  }

  let simW = 0, simH = 0, dyeW = 0, dyeH = 0;
  let velocity, dye, divergence, curlFBO, pressure;
  const SIM_RES = 128, DYE_RES = 512;

  function initFramebuffers() {
    const filter = supportLinear ? gl.LINEAR : gl.NEAREST;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    simW = SIM_RES; simH = Math.round(SIM_RES * (canvas.height / canvas.width));
    dyeW = DYE_RES; dyeH = Math.round(DYE_RES * (canvas.height / canvas.width));
    velocity = createDoubleFBO(simW, simH, texType, gl.LINEAR);
    dye = createDoubleFBO(dyeW, dyeH, texType, filter);
    divergence = createFBO(simW, simH, texType, gl.NEAREST);
    curlFBO = createFBO(simW, simH, texType, gl.NEAREST);
    pressure = createDoubleFBO(simW, simH, texType, gl.NEAREST);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      initFramebuffers();
    }
  }

  function blit(target) {
    if (target) { gl.viewport(0, 0, target.width, target.height); gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo); }
    else { gl.viewport(0, 0, canvas.width, canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // ---- color helpers ----
  function HSVtoRGB(h, s, v) {
    let r, g, b;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: r = v; g = t; b = p; break;
      case 1: r = q; g = v; b = p; break;
      case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break;
      case 4: r = t; g = p; b = v; break;
      case 5: r = v; g = p; b = q; break;
    }
    return [r, g, b];
  }

  let colorHue = Math.random();
  function nextColor(mult) {
    colorHue = (colorHue + 0.618033988749895) % 1.0;
    const c = HSVtoRGB(colorHue, 0.85, 1.0);
    return [c[0] * mult, c[1] * mult, c[2] * mult];
  }

  // ---- splats / interaction ----
  const pointers = {};
  function splat(x, y, dx, dy, color) {
    // velocity splat
    const sp = splatProg;
    gl.useProgram(sp.program);
    bindQuad(sp);
    gl.uniform2f(sp.uniforms.texelSize, 1 / simW, 1 / simH);
    gl.uniform1i(sp.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(sp.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(sp.uniforms.point, x, y);
    gl.uniform3f(sp.uniforms.color, dx, dy, 0.0);
    gl.uniform1f(sp.uniforms.radius, 0.0009);
    blit(velocity.write); velocity.swap();

    // dye splat
    gl.uniform1i(sp.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(sp.uniforms.color, color[0], color[1], color[2]);
    gl.uniform1f(sp.uniforms.radius, 0.006);
    blit(dye.write); dye.swap();
  }

  function randomSplats(count) {
    for (let i = 0; i < count; i++) {
      const x = Math.random(), y = Math.random();
      const dx = (Math.random() - 0.5) * 800;
      const dy = (Math.random() - 0.5) * 800;
      splat(x, y, dx, dy, nextColor(0.32));
    }
  }

  // ---- simulation step ----
  let curlAmt = 30, dissAmt = 10, autoAmt = 55, soundOn = false;

  function step(dt) {
    gl.disable(gl.BLEND);
    const ts = [1 / simW, 1 / simH];

    // curl
    gl.useProgram(curlProg.program);
    bindQuad(curlProg);
    gl.uniform2f(curlProg.uniforms.texelSize, ts[0], ts[1]);
    gl.uniform1i(curlProg.uniforms.uVelocity, velocity.read.attach(0));
    blit(curlFBO);

    // vorticity
    gl.useProgram(vorticityProg.program);
    bindQuad(vorticityProg);
    gl.uniform2f(vorticityProg.uniforms.texelSize, ts[0], ts[1]);
    gl.uniform1i(vorticityProg.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityProg.uniforms.uCurl, curlFBO.attach(1));
    gl.uniform1f(vorticityProg.uniforms.curl, curlAmt);
    gl.uniform1f(vorticityProg.uniforms.dt, dt);
    blit(velocity.write); velocity.swap();

    // divergence
    gl.useProgram(divergenceProg.program);
    bindQuad(divergenceProg);
    gl.uniform2f(divergenceProg.uniforms.texelSize, ts[0], ts[1]);
    gl.uniform1i(divergenceProg.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    // clear pressure
    gl.useProgram(clearProg.program);
    bindQuad(clearProg);
    gl.uniform1i(clearProg.uniforms.uTex, pressure.read.attach(0));
    gl.uniform1f(clearProg.uniforms.value, 0.8);
    blit(pressure.write); pressure.swap();

    // pressure jacobi iterations
    gl.useProgram(pressureProg.program);
    bindQuad(pressureProg);
    gl.uniform2f(pressureProg.uniforms.texelSize, ts[0], ts[1]);
    gl.uniform1i(pressureProg.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < 20; i++) {
      gl.uniform1i(pressureProg.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write); pressure.swap();
    }

    // gradient subtract
    gl.useProgram(gradientProg.program);
    bindQuad(gradientProg);
    gl.uniform2f(gradientProg.uniforms.texelSize, ts[0], ts[1]);
    gl.uniform1i(gradientProg.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradientProg.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write); velocity.swap();

    // advect velocity
    gl.useProgram(advectionProg.program);
    bindQuad(advectionProg);
    gl.uniform2f(advectionProg.uniforms.texelSize, 1 / simW, 1 / simH);
    gl.uniform1i(advectionProg.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProg.uniforms.uSource, velocity.read.attach(0));
    gl.uniform1f(advectionProg.uniforms.dt, dt);
    gl.uniform1f(advectionProg.uniforms.dissipation, 0.2);
    blit(velocity.write); velocity.swap();

    // advect dye
    gl.uniform1i(advectionProg.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProg.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(advectionProg.uniforms.dissipation, dissAmt * 0.1 + 0.5);
    blit(dye.write); dye.swap();
  }

  function render() {
    gl.useProgram(displayProg.program);
    bindQuad(displayProg);
    gl.uniform1i(displayProg.uniforms.uTexture, dye.read.attach(0));
    blit(null);
  }

  // ---- pointer events ----
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx / r.width, y: 1 - cy / r.height };
  }
  let lastPos = null;
  function down(e) {
    const p = pos(e);
    pointers.active = true;
    lastPos = p;
    const c = nextColor(0.4);
    splat(p.x, p.y, (Math.random() - 0.5) * 600, (Math.random() - 0.5) * 600, c);
  }
  function move(e) {
    if (!pointers.active && !e.buttons && !(e.touches && e.touches.length)) {
      // hover paint lightly? only when dragging
    }
    const dragging = e.buttons === 1 || (e.touches && e.touches.length);
    if (!dragging) return;
    const p = pos(e);
    if (!lastPos) { lastPos = p; return; }
    const dx = (p.x - lastPos.x) * 6000;
    const dy = (p.y - lastPos.y) * 6000;
    const c = nextColor(0.22);
    splat(p.x, p.y, dx, dy, c);
    lastPos = p;
  }
  function up() { pointers.active = false; lastPos = null; }

  canvas.addEventListener('mousedown', down);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); down(e); }, {passive:false});
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); move(e); }, {passive:false});
  window.addEventListener('touchend', up);

  // ---- UI ----
  document.getElementById('curl').addEventListener('input', e => curlAmt = +e.target.value);
  document.getElementById('diss').addEventListener('input', e => dissAmt = +e.target.value);
  document.getElementById('auto').addEventListener('input', e => autoAmt = +e.target.value);
  document.getElementById('sound').addEventListener('change', e => { soundOn = e.target.checked; if (soundOn) startAudio(); else stopAudio(); });
  document.getElementById('splat').addEventListener('click', () => randomSplats(5));
  document.getElementById('clear').addEventListener('click', () => clearAll());
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); clearAll(); } });

  function clearAll() {
    gl.useProgram(clearProg.program);
    bindQuad(clearProg);
    gl.uniform1f(clearProg.uniforms.value, 0.0);
    gl.uniform1i(clearProg.uniforms.uTex, dye.read.attach(0)); blit(dye.write); dye.swap();
    gl.uniform1i(clearProg.uniforms.uTex, velocity.read.attach(0)); blit(velocity.write); velocity.swap();
  }

  // ---- optional audio (ambient drones mapped to motion) ----
  let actx = null, masterGain = null, voices = [];
  function startAudio() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain(); masterGain.gain.value = 0.0; masterGain.connect(actx.destination);
      const notes = [196, 261.6, 329.6, 392, 523.2];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = actx.createGain(); g.gain.value = 0.06;
        const lfo = actx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03;
        const lg = actx.createGain(); lg.gain.value = 0.05;
        lfo.connect(lg); lg.connect(g.gain);
        o.connect(g); g.connect(masterGain);
        o.start(); lfo.start();
        voices.push({ o, g });
      });
      masterGain.gain.linearRampToValueAtTime(0.5, actx.currentTime + 1.5);
    } catch (err) { /* ignore */ }
  }
  function stopAudio() {
    if (!actx) return;
    masterGain.gain.linearRampToValueAtTime(0.0, actx.currentTime + 0.6);
    setTimeout(() => { try { actx.close(); } catch (e) {} actx = null; voices = []; }, 800);
  }

  // ---- main loop ----
  let last = performance.now();
  let autoTimer = 0;
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.033) dt = 0.033;

    // ambient auto-painting based on slider
    if (autoAmt > 0) {
      autoTimer += dt;
      const interval = 0.6 - (autoAmt / 100) * 0.55;
      if (autoTimer > interval) {
        autoTimer = 0;
        const x = Math.random(), y = Math.random();
        const ang = Math.random() * Math.PI * 2;
        const sp = 300 + Math.random() * 500;
        splat(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp, nextColor(0.18 + autoAmt / 200));
      }
    }

    step(dt);
    render();
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);
  randomSplats(12);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
