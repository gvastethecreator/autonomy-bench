<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading</title>
<style>
  :root {
    --bg-0: #06080f;
    --bg-1: #0b1020;
    --accent: #6ee7ff;
    --accent-2: #b388ff;
    --accent-3: #ff8fce;
    --ink: #e8edff;
    --ink-dim: #8593b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 50% 30%, var(--bg-1), var(--bg-0) 70%);
    color: var(--ink);
    overflow: hidden;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient drifting nebula */
  .nebula {
    position: fixed;
    inset: -20%;
    z-index: 0;
    filter: blur(60px);
    opacity: 0.55;
    background:
      radial-gradient(40% 40% at 20% 30%, var(--accent-2), transparent 60%),
      radial-gradient(35% 35% at 80% 25%, var(--accent), transparent 60%),
      radial-gradient(45% 45% at 60% 80%, var(--accent-3), transparent 60%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    50%  { transform: translate3d(3%, -2%, 0) scale(1.08); }
    100% { transform: translate3d(-2%, 3%, 0) scale(1.03); }
  }

  /* Fine grid floor for depth */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 60%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 60%, #000 0%, transparent 75%);
  }

  .stage {
    position: relative;
    z-index: 2;
    width: min(520px, 86vw);
    text-align: center;
  }

  /* Orbital loader */
  .loader {
    position: relative;
    width: 168px;
    height: 168px;
    margin: 0 auto 38px;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .ring.r1 {
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    animation: spin 2.4s cubic-bezier(.6,.1,.3,.9) infinite;
    filter: drop-shadow(0 0 12px rgba(110,231,255,.45));
  }
  .ring.r2 {
    inset: 22px;
    border-bottom-color: var(--accent-2);
    border-left-color: var(--accent-2);
    animation: spin 1.8s cubic-bezier(.6,.1,.3,.9) infinite reverse;
    filter: drop-shadow(0 0 12px rgba(179,136,255,.4));
  }
  .ring.r3 {
    inset: 44px;
    border-top-color: var(--accent-3);
    border-bottom-color: var(--accent-3);
    animation: spin 1.2s linear infinite;
    opacity: .8;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pulsing core */
  .core {
    position: absolute;
    inset: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fff, var(--accent) 45%, var(--accent-2) 100%);
    box-shadow: 0 0 24px rgba(110,231,255,.6), 0 0 60px rgba(179,136,255,.35);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(.82); filter: brightness(.9); }
    50%     { transform: scale(1); filter: brightness(1.25); }
  }

  /* Orbiting dot */
  .orbit {
    position: absolute;
    inset: 0;
    animation: spin 3.6s linear infinite;
  }
  .orbit::after {
    content: "";
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 18px var(--accent);
  }

  /* Wordmark */
  .title {
    font-size: 15px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 10px;
    padding-left: .42em;
  }
  .subtitle {
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: .04em;
    min-height: 18px;
    margin-bottom: 30px;
    transition: opacity .4s ease;
  }

  /* Progress bar */
  .track {
    position: relative;
    height: 4px;
    border-radius: 99px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .fill {
    position: absolute;
    inset: 0 100% 0 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
    box-shadow: 0 0 14px rgba(110,231,255,.5);
    transition: right .25s ease;
  }
  .fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    transform: translateX(-100%);
    animation: sheen 1.6s linear infinite;
  }
  @keyframes sheen { to { transform: translateX(100%); } }

  .readout {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .pct { color: var(--ink); font-weight: 600; }

  .stage.done .core { animation: none; box-shadow: 0 0 30px #fff, 0 0 70px var(--accent-2); }
  .check {
    position: absolute;
    inset: 58px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, #fff, var(--accent) 60%, var(--accent-2) 100%);
    transform: scale(0);
    opacity: 0;
  }
  .stage.done .check { animation: pop .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  .check svg { width: 34px; height: 34px; }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .hint {
    position: fixed;
    bottom: 22px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(133,147,184,.5);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="nebula"></div>
  <div class="grid"></div>

  <div class="stage" id="stage">
    <div class="loader">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="orbit"></div>
      <div class="core"></div>
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06080f" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5 L10 18 L20 6" />
        </svg>
      </div>
    </div>

    <div class="title">Aether</div>
    <div class="subtitle" id="subtitle">Preparing your workspace</div>

    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="readout">
      <span id="status">Loading assets</span>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>

  <div class="hint">Click to reload</div>

<script>
  (function () {
    var fill = document.getElementById('fill');
    var pct = document.getElementById('pct');
    var status = document.getElementById('status');
    var subtitle = document.getElementById('subtitle');
    var stage = document.getElementById('stage');

    var phases = [
      [0,   18,  'Initializing core'],
      [18,  42,  'Loading assets'],
      [42,  67,  'Compiling shaders'],
      [67,  88,  'Warming cache'],
      [88,  100, 'Almost there']
    ];
    var lines = [
      'Preparing your workspace',
      'Calibrating the experience',
      'Spinning up the engine',
      'Tying the last few threads'
    ];

    var progress = 0;
    var raf = null;

    function setProgress(v) {
      progress = Math.max(0, Math.min(100, v));
      fill.style.right = (100 - progress) + '%';
      pct.textContent = Math.round(progress) + '%';
      for (var i = 0; i < phases.length; i++) {
        if (progress >= phases[i][0] && progress < phases[i][1]) {
          status.textContent = phases[i][2];
          break;
        }
      }
      if (progress >= 100) status.textContent = 'Ready';
    }

    function tick() {
      // Eased, slightly irregular progress toward 100.
      var remain = 100 - progress;
      var step = Math.max(0.15, remain * 0.012) * (0.6 + Math.random() * 0.8);
      progress += step;
      if (progress >= 100) {
        progress = 100;
        setProgress(100);
        finish();
        return;
      }
      setProgress(progress);
      raf = setTimeout(tick, 90 + Math.random() * 120);
    }

    function finish() {
      stage.classList.add('done');
      subtitle.style.opacity = '0';
      setTimeout(function () { subtitle.textContent = 'Ready when you are'; subtitle.style.opacity = '1'; }, 200);
    }

    var lineTimer = setInterval(function () {
      if (progress >= 100) { clearInterval(lineTimer); return; }
      subtitle.textContent = lines[Math.floor(Math.random() * lines.length)];
    }, 2600);

    function start() {
      stage.classList.remove('done');
      subtitle.style.opacity = '1';
      subtitle.textContent = 'Preparing your workspace';
      setProgress(0);
      clearTimeout(raf);
      clearInterval(lineTimer);
      lineTimer = setInterval(function () {
        if (progress >= 100) { clearInterval(lineTimer); return; }
        subtitle.textContent = lines[Math.floor(Math.random() * lines.length)];
      }, 2600);
      tick();
    }

    start();
    document.body.addEventListener('click', start);
  })();
</script>
</body>
</html>
