<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
  :root {
    --bg-0: #0a0e1a;
    --bg-1: #121a30;
    --accent: #5b8cff;
    --accent-2: #8a5bff;
    --text: #e6ecff;
    --muted: #7f8bb3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 120% at 50% 0%, var(--bg-1) 0%, var(--bg-0) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* drifting starfield */
  .stars { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: .5;
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(-10vh); }
    to   { transform: translateY(110vh); }
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
    text-align: center;
  }

  .title {
    font-size: 13px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    padding-left: .42em;
  }

  /* orbital spinner */
  .orbit {
    position: relative;
    width: 130px;
    height: 130px;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.07);
  }
  .ring.r1 { inset: 0;   animation: spin 3.2s linear infinite; border-top-color: var(--accent); }
  .ring.r2 { inset: 18px; animation: spin 2.1s linear infinite reverse; border-top-color: var(--accent-2); }
  .ring.r3 { inset: 38px; animation: spin 1.4s linear infinite; border-top-color: #5bffd0; }
  .core {
    position: absolute;
    inset: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 55%, var(--accent-2));
    box-shadow: 0 0 26px rgba(91,140,255,.7), 0 0 60px rgba(138,91,255,.45);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: .9; }
    50%     { transform: scale(1.12); opacity: 1; }
  }

  .pct {
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .bar {
    width: 280px;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(91,140,255,.6);
    transition: width .25s ease;
  }

  .status {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    letter-spacing: .03em;
  }
  .dots::after {
    content: "";
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }

  .done .status { color: #5bffd0; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="stage" id="stage">
    <div class="title">Initializing</div>

    <div class="orbit" aria-hidden="true">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core"></div>
    </div>

    <div class="pct" id="pct">0%</div>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="status dots" id="status">Loading assets</div>
  </div>

<script>
  // starfield
  (function () {
    const wrap = document.getElementById('stars');
    const N = 60;
    let html = '';
    for (let i = 0; i < N; i++) {
      const x = Math.random() * 100;
      const dur = 6 + Math.random() * 12;
      const delay = -Math.random() * dur;
      const size = Math.random() < .2 ? 3 : 2;
      const op = (0.3 + Math.random() * 0.5).toFixed(2);
      html += `<span class="star" style="left:${x}vw;width:${size}px;height:${size}px;opacity:${op};animation-duration:${dur}s;animation-delay:${delay}s"></span>`;
    }
    wrap.innerHTML = html;
  })();

  // simulated loading progress
  const pctEl = document.getElementById('pct');
  const fillEl = document.getElementById('fill');
  const statusEl = document.getElementById('status');
  const stage = document.getElementById('stage');

  const stages = [
    [0,   'Loading assets'],
    [30,  'Compiling shaders'],
    [55,  'Fetching resources'],
    [78,  'Building scene'],
    [92,  'Almost there'],
    [100, 'Ready']
  ];

  let cur = 0;
  let target = 0;
  let si = 0;

  function pickTarget() {
    if (si < stages.length - 1) {
      target = stages[si + 1][0];
      statusEl.textContent = stages[si][1];
      si++;
    }
  }

  function tick() {
    if (cur >= target) {
      if (cur >= 100) { finish(); return; }
      pickTarget();
    }
    cur += Math.max(0.4, (target - cur) * 0.08 + (Math.random() * 1.2));
    if (cur > target) cur = target;
    const v = Math.floor(cur);
    pctEl.textContent = v + '%';
    fillEl.style.width = v + '%';
    setTimeout(tick, 60 + Math.random() * 90);
  }

  function finish() {
    pctEl.textContent = '100%';
    fillEl.style.width = '100%';
    statusEl.textContent = 'Ready';
    stage.classList.add('done');
  }

  setTimeout(tick, 400);
</script>
</body>
</html>
