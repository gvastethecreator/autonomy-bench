<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Satisfying Button</title>
<style>
  :root{
    --bg-0:#0b0f1a;
    --bg-1:#141b2e;
    --accent:#7c5cff;
    --accent-2:#36e0c8;
    --glow:#9b7bff;
    --ink:#eef1ff;
    --ink-soft:#aab1d6;
    --ring:rgba(124,92,255,.55);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 60%);
    color:var(--ink);
    overflow:hidden;
    display:grid;
    place-items:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* ambient drifting orbs */
  .ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:screen}
  .orb.a{width:420px;height:420px;background:radial-gradient(circle,#5b3cff,transparent 70%);top:-120px;left:-80px;animation:drift1 22s var(--ease) infinite alternate}
  .orb.b{width:520px;height:520px;background:radial-gradient(circle,#1fb8c9,transparent 70%);bottom:-180px;right:-120px;animation:drift2 26s var(--ease) infinite alternate}
  .orb.c{width:300px;height:300px;background:radial-gradient(circle,#ff7bd0,transparent 70%);top:40%;left:60%;animation:drift3 19s var(--ease) infinite alternate}
  @keyframes drift1{to{transform:translate(120px,90px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-140px,-80px) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-90px,60px) scale(1.25)}}

  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:42px;padding:24px}

  .header{text-align:center;opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) .15s forwards}
  .header h1{font-size:clamp(22px,4vw,34px);font-weight:600;letter-spacing:.5px;
    background:linear-gradient(120deg,#fff,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .header p{margin-top:10px;color:var(--ink-soft);font-size:14px;letter-spacing:.3px;font-weight:400}

  /* the button */
  .press-wrap{position:relative;display:grid;place-items:center;
    opacity:0;transform:translateY(22px) scale(.96);animation:rise 1s var(--ease) .35s forwards}

  .halo{position:absolute;width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle,var(--ring),transparent 60%);
    opacity:0;transform:scale(.6);transition:opacity .5s var(--ease),transform .5s var(--ease);pointer-events:none}
  .press-wrap.armed .halo{opacity:.55;transform:scale(1.05);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}

  .btn{
    position:relative;
    width:200px;height:200px;border:none;border-radius:50%;
    cursor:pointer;
    background:
      radial-gradient(120% 120% at 30% 25%, #b9a4ff 0%, #7c5cff 38%, #5a3ee0 100%);
    color:var(--ink);
    font-size:20px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    box-shadow:
      0 1px 0 rgba(255,255,255,.35) inset,
      0 -10px 24px rgba(20,8,60,.55) inset,
      0 18px 40px -12px rgba(124,92,255,.75),
      0 40px 80px -30px rgba(124,92,255,.6);
    transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .4s var(--ease);
    -webkit-tap-highlight-color:transparent;
    isolation:isolate;
  }
  .btn::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(80% 60% at 50% 18%,rgba(255,255,255,.45),transparent 60%);
    opacity:.7;pointer-events:none;mix-blend-mode:screen}
  .btn .label{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-2);
    box-shadow:0 0 14px var(--accent-2);transition:transform .4s var(--ease)}
  .btn .count{position:absolute;z-index:3;top:18px;right:24px;font-size:13px;font-weight:700;
    color:rgba(255,255,255,.85);letter-spacing:.5px;font-variant-numeric:tabular-nums}

  .btn:hover{transform:scale(1.04);filter:saturate(1.1) brightness(1.05);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 -10px 24px rgba(20,8,60,.5) inset,
      0 26px 50px -12px rgba(124,92,255,.9),
      0 60px 110px -28px rgba(124,92,255,.7)}
  .btn:active{transform:scale(.93);transition-duration:.12s;
    box-shadow:
      0 1px 0 rgba(255,255,255,.3) inset,
      0 -6px 18px rgba(20,8,60,.6) inset,
      0 10px 22px -10px rgba(124,92,255,.6)}

  /* ripple */
  .ripple{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.8);
    transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none;z-index:2;
    animation:ripple .85s var(--ease) forwards}
  @keyframes ripple{to{transform:translate(-50%,-50%) scale(7);opacity:0}}

  /* particles */
  .spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:1;
    left:50%;top:50%;will-change:transform,opacity}
  @keyframes pop{to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}

  .footer{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) .55s forwards;
    color:var(--ink-soft);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase}
  .footer b{color:var(--accent-2);font-weight:700}

  /* ring progress that fills on hold */
  .ring{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;z-index:0;
    transform:rotate(-90deg);opacity:0;transition:opacity .3s var(--ease)}
  .ring.on{opacity:1}
  .ring circle{fill:none;stroke-width:3;stroke-linecap:round}
  .ring .track{stroke:rgba(255,255,255,.08)}
  .ring .bar{stroke:var(--accent-2);filter:drop-shadow(0 0 6px var(--accent-2));
    transition:stroke-dashoffset .08s linear}

  @keyframes rise{to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
  <div class="ambient">
    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  </div>
  <div class="grain"></div>

  <div class="stage">
    <div class="header">
      <h1>The Satisfying Button</h1>
      <p>Press it. Hold it. Let it breathe.</p>
    </div>

    <div class="press-wrap armed" id="wrap">
      <div class="halo"></div>
      <svg class="ring" id="ring" viewBox="0 0 228 228">
        <circle class="track" cx="114" cy="114" r="112"/>
        <circle class="bar" id="bar" cx="114" cy="114" r="112"/>
      </svg>
      <button class="btn" id="btn" aria-label="Satisfying button">
        <span class="count" id="count">0</span>
        <span class="label"><span class="dot" id="dot"></span>Press</span>
      </button>
    </div>

    <div class="footer">taps · <b id="tapcount">0</b></div>
  </div>

<script>
(() => {
  const btn = document.getElementById('btn');
  const wrap = document.getElementById('wrap');
  const countEl = document.getElementById('count');
  const tapEl = document.getElementById('tapcount');
  const dot = document.getElementById('dot');
  const ring = document.getElementById('ring');
  const bar = document.getElementById('bar');
  const label = btn.querySelector('.label');

  let taps = 0;

  // --- audio: soft, organic click using native Web Audio API (no CDN) ---
  let actx = null;
  function audio(){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    return actx;
  }
  function blip(up){
    const c = audio(); if(!c) return;
    if(c.state === 'suspended') c.resume();
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    const base = up ? 320 : 540;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(up ? 660 : 220, t + 0.18);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + 0.34);
  }

  // --- ripple effect ---
  function ripple(){
    const r = document.createElement('span');
    r.className = 'ripple';
    const sz = 60;
    r.style.width = r.style.height = sz + 'px';
    r.style.left = '50%'; r.style.top = '50%';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 900);
  }

  // --- particle burst ---
  const palette = ['#7c5cff','#36e0c8','#ff7bd0','#ffd166','#9b7bff','#5ad1ff'];
  function burst(){
    const n = 18;
    const rect = btn.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.className = 'spark';
      const size = 5 + Math.random()*9;
      s.style.width = s.style.height = size+'px';
      const col = palette[i % palette.length];
      s.style.background = col;
      s.style.boxShadow = '0 0 12px ' + col;
      const ang = (Math.PI*2*(i/n)) + Math.random()*0.4;
      const dist = 80 + Math.random()*90;
      s.style.setProperty('--tx', Math.cos(ang)*dist + 'px');
      s.style.setProperty('--ty', Math.sin(ang)*dist + 'px');
      s.style.animation = `pop ${0.7 + Math.random()*0.5}s var(--ease) forwards`;
      btn.appendChild(s);
      setTimeout(() => s.remove(), 1300);
    }
  }

  // --- count-up flourish ---
  function bumpCount(){
    taps++;
    tapEl.textContent = taps;
    // animate the badge number
    countEl.textContent = taps;
    countEl.animate(
      [{transform:'scale(1.6)',color:'#fff'},{transform:'scale(1)',color:'rgba(255,255,255,.85)'}],
      {duration:420, easing:'cubic-bezier(.22,1,.36,1)'}
    );
    dot.animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:500,easing:'cubic-bezier(.22,1,.36,1)'});
  }

  // --- press / release with hold ring ---
  let holding = false, holdRAF = null, holdStart = 0;
  const CIRC = 2 * Math.PI * 112;
  bar.style.strokeDasharray = CIRC;
  bar.style.strokeDashoffset = CIRC;

  function startHold(){
    if(holding) return;
    holding = true; holdStart = performance.now();
    ring.classList.add('on');
    blip(true);
    const step = (now) => {
      const p = Math.min((now - holdStart)/900, 1);
      bar.style.strokeDashoffset = CIRC * (1 - p);
      if(p < 1 && holding){ holdRAF = requestAnimationFrame(step); }
    };
    holdRAF = requestAnimationFrame(step);
  }
  function endHold(){
    if(!holding) return;
    holding = false;
    cancelAnimationFrame(holdRAF);
    ring.classList.remove('on');
    bar.style.strokeDashoffset = CIRC;
  }

  // --- core interaction ---
  function press(){
    ripple();
    burst();
    bumpCount();
    wrap.classList.remove('armed'); // stop ambient pulse while engaged
    setTimeout(()=>wrap.classList.add('armed'), 1200);
  }

  btn.addEventListener('pointerdown', (e) => {
    audio() && audio().resume && audio().resume();
    btn.style.transition = 'transform .12s var(--ease)';
    btn.style.transform = 'scale(.93)';
  });
  btn.addEventListener('pointerup', () => {
    btn.style.transition = '';
    btn.style.transform = '';
    blip(false);
    press();
  });
  btn.addEventListener('pointerleave', () => {
    if(btn.style.transform){ btn.style.transition=''; btn.style.transform=''; }
  });

  // keyboard accessibility → same satisfying response
  btn.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); blip(false); press(); }
  });

  // gentle idle "breathing" after a while of no interaction
  let idleTimer = null;
  function resetIdle(){
    wrap.classList.add('armed');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>wrap.classList.add('armed'), 4000);
  }
  ['pointerdown','pointerup','keydown'].forEach(ev=>btn.addEventListener(ev, resetIdle));
})();
</script>
</body>
</html>
