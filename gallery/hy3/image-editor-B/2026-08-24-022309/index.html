<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism — Image Editor</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --line:#2a2f3a;
    --text:#e6e9ef;
    --muted:#8b93a3;
    --accent:#6ea8fe;
    --accent-2:#a78bfa;
    --danger:#f87171;
    --ok:#34d399;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-rows:46px 1fr 26px;
    grid-template-columns:60px 1fr 248px;
    grid-template-areas:
      "top top top"
      "tools stage side"
      "bottom bottom bottom";
    height:100vh;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    grid-area:top;
    display:flex;align-items:center;gap:6px;
    padding:0 12px;
    background:linear-gradient(180deg,#1b1f27,#14171d);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;
    margin-right:10px;
  }
  .brand .dot{
    width:14px;height:14px;border-radius:4px;
    background:conic-gradient(from 0deg,#6ea8fe,#a78bfa,#34d399,#fbbf24,#f87171,#6ea8fe);
  }
  .brand small{font-weight:400;color:var(--muted);margin-left:4px;}
  .topbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
  .btn{
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;cursor:pointer;font-size:12px;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{border-color:#3a4250;background:#252a34;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:600;}
  .btn.primary:hover{filter:brightness(1.07);}
  .btn.icon{padding:6px 8px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .topbar .spacer{flex:1;}
  /* ---------- Tool rail ---------- */
  .tools{
    grid-area:tools;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:8px 0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    overflow-y:auto;
  }
  .tool{
    width:42px;height:42px;border-radius:9px;
    background:var(--panel-2);border:1px solid transparent;
    color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .tool svg{width:20px;height:20px;}
  .tool:hover{border-color:#3a4250;background:#252a34;}
  .tool.active{
    background:linear-gradient(180deg,#26314a,#1d2436);
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 0 1px rgba(110,168,254,.25);
  }
  .tool .tip{
    position:absolute;left:50px;top:50%;transform:translateY(-50%);
    background:#000;color:#fff;padding:4px 8px;border-radius:6px;
    font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .12s;z-index:20;border:1px solid var(--line);
  }
  .tool:hover .tip{opacity:1;}
  .rail-divider{width:30px;height:1px;background:var(--line);margin:4px 0;}
  /* ---------- Stage ---------- */
  .stage{
    grid-area:stage;
    position:relative;
    overflow:auto;
    background:
      linear-gradient(45deg,#23262e 25%,transparent 25%),
      linear-gradient(-45deg,#23262e 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#23262e 75%),
      linear-gradient(-45deg,transparent 75%,#23262e 75%);
    background-size:22px 22px;
    background-position:0 0,0 11px,11px -11px,-11px 0;
    background-color:#1a1d24;
    display:flex;align-items:center;justify-content:center;
  }
  .canvas-wrap{
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    background:#fff;
    margin:40px;
  }
  #board{
    display:block;
    touch-action:none;
    cursor:crosshair;
  }
  /* ---------- Side panel ---------- */
  .side{
    grid-area:side;
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    padding:12px;
  }
  .card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;margin-bottom:12px;
  }
  .card h3{
    margin:0 0 10px;font-size:11px;text-transform:uppercase;
    letter-spacing:.8px;color:var(--muted);font-weight:700;
  }
  .row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .row label{color:var(--muted);flex:0 0 64px;font-size:12px;}
  .row .val{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;font-size:12px;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:#2c313c;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid #0f1115;
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--accent);
    cursor:pointer;border:2px solid #0f1115;
  }
  .swatch-main{
    width:54px;height:54px;border-radius:10px;border:2px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden;
    background:
      linear-gradient(45deg,#2a2f3a 25%,transparent 25%),
      linear-gradient(-45deg,#2a2f3a 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a2f3a 75%),
      linear-gradient(-45deg,transparent 75%,#2a2f3a 75%);
    background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;
  }
  .swatch-main i{position:absolute;inset:0;border-radius:8px;}
  .swatch-secondary{
    width:30px;height:30px;border-radius:7px;border:2px solid var(--line);
    cursor:pointer;position:relative;overflow:hidden;flex:0 0 auto;
    background:
      linear-gradient(45deg,#2a2f3a 25%,transparent 25%),
      linear-gradient(-45deg,#2a2f3a 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a2f3a 75%),
      linear-gradient(-45deg,transparent 75%,#2a2f3a 75%);
    background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;
  }
  .swatch-secondary i{position:absolute;inset:0;border-radius:5px;}
  .swap{
    width:26px;height:26px;border-radius:7px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:13px;
  }
  .swatches-row{display:flex;align-items:flex-end;gap:8px;}
  .recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .recent .r{
    width:18px;height:18px;border-radius:5px;cursor:pointer;border:1px solid rgba(255,255,255,.12);
  }
  .palette{
    display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px;
  }
  .palette .p{aspect-ratio:1;border-radius:5px;cursor:pointer;border:1px solid rgba(255,255,255,.08);}
  .palette .p:hover{transform:scale(1.12);}
  .seg{display:flex;background:#12151b;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{
    flex:1;background:transparent;border:none;color:var(--muted);
    padding:7px 4px;cursor:pointer;font-size:12px;
  }
  .seg button.active{background:var(--accent);color:#0b1220;font-weight:600;}
  .seg button:not(.active):hover{color:var(--text);}
  .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .filter-grid .btn{justify-content:center;padding:8px 4px;font-size:11px;}
  .layers{display:flex;flex-direction:column;gap:6px;}
  .layer{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    background:#12151b;border:1px solid var(--line);cursor:pointer;
  }
  .layer.active{border-color:var(--accent);background:#1c2333;}
  .layer .eye{cursor:pointer;color:var(--muted);font-size:14px;}
  .layer .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer .op{width:54px;}
  .layer .op input{width:100%;}
  .thumb{
    width:30px;height:24px;border-radius:5px;border:1px solid var(--line);
    background:#fff;background-size:cover;
  }
  /* ---------- Bottom status ---------- */
  .statusbar{
    grid-area:bottom;
    display:flex;align-items:center;gap:14px;padding:0 12px;
    background:var(--panel);border-top:1px solid var(--line);
    color:var(--muted);font-size:11px;
  }
  .statusbar .spacer{flex:1;}
  .zoom-ctrl{display:flex;align-items:center;gap:6px;}
  .zoom-ctrl input{width:120px;}
  .toast{
    position:fixed;bottom:38px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#000;color:#fff;padding:9px 16px;border-radius:9px;border:1px solid var(--line);
    opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:12px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .hidden{display:none!important;}
  /* text input overlay */
  #textInput{
    position:absolute;z-index:30;border:1px dashed var(--accent);
    background:rgba(110,168,254,.08);color:#111;outline:none;
    font-family:inherit;padding:2px 4px;border-radius:3px;min-width:40px;
  }
  .kbd{font:11px ui-monospace,monospace;background:#0c0e12;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Prism <small>image editor</small></div>
    <div class="sep"></div>
    <button class="btn" id="btnNew">New</button>
    <button class="btn" id="btnOpen">Open</button>
    <button class="btn" id="btnExport">Export PNG</button>
    <div class="sep"></div>
    <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    <div class="spacer"></div>
    <span class="kbd">draw · shape · text · fill · eyedropper</span>
  </div>

  <!-- TOOL RAIL -->
  <div class="tools" id="toolRail">
    <div class="tool active" data-tool="brush" title="Brush"><span class="tip">Brush (B)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 14.5 4 20s2 1 4-1m9-13a4.5 4.5 0 0 1-6.4 6.4L4 20l3.6-3.6A4.5 4.5 0 0 1 14 10l.5-.5"/></svg>
    </div>
    <div class="tool" data-tool="eraser" title="Eraser"><span class="tip">Eraser (E)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14 14 4l6 6-7 7-6-6z"/><path d="M3 20h12"/></svg>
    </div>
    <div class="rail-divider"></div>
    <div class="tool" data-tool="line" title="Line"><span class="tip">Line (L)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19 19 5"/></svg>
    </div>
    <div class="tool" data-tool="rect" title="Rectangle"><span class="tip">Rectangle (R)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
    </div>
    <div class="tool" data-tool="ellipse" title="Ellipse"><span class="tip">Ellipse (O)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
    </div>
    <div class="rail-divider"></div>
    <div class="tool" data-tool="fill" title="Fill bucket"><span class="tip">Fill (G)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11 14 3l5 5-9 9"/><path d="M4 20h7"/></svg>
    </div>
    <div class="tool" data-tool="text" title="Text"><span class="tip">Text (T)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v13"/></svg>
    </div>
    <div class="tool" data-tool="eyedropper" title="Eyedropper"><span class="tip">Eyedropper (I)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m11 8 5 5m-9 9 3-7 8-8 3 3-8 8-7 3z"/></svg>
    </div>
    <div class="rail-divider"></div>
    <div class="tool" data-tool="move" title="Pan / Move view"><span class="tip">Pan (Space)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3"/></svg>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="board" width="900" height="600"></canvas>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side">
    <div class="card">
      <h3>Color</h3>
      <div class="swatches-row">
        <div class="swatch-main" id="swMain"><i id="swMainFill"></i></div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
          <button class="swap" id="btnSwap" title="Swap colors">⇄</button>
          <div class="swatch-secondary" id="swSec" title="Secondary"><i id="swSecFill"></i></div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <input type="color" id="colorPick" value="#6ea8fe" style="width:100%;height:28px;border:1px solid var(--line);border-radius:7px;background:#12151b;cursor:pointer;">
          <div class="recent" id="recent"></div>
        </div>
      </div>
      <div class="palette" id="palette"></div>
    </div>

    <div class="card">
      <h3>Brush</h3>
      <div class="row">
        <label>Size</label>
        <input type="range" id="sizeRange" min="1" max="120" value="14">
        <span class="val" id="sizeVal">14</span>
      </div>
      <div class="row">
        <label>Opacity</label>
        <input type="range" id="opacityRange" min="1" max="100" value="100">
        <span class="val" id="opacityVal">100%</span>
      </div>
      <div class="row">
        <label>Shape</label>
        <div class="seg" style="flex:1" id="brushShape">
          <button data-shape="round" class="active">Round</button>
          <button data-shape="square">Square</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Shapes</h3>
      <div class="row">
        <label>Fill</label>
        <div class="seg" style="flex:1" id="shapeMode">
          <button data-mode="stroke" class="active">Outline</button>
          <button data-mode="fill">Filled</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Filters</h3>
      <div class="filter-grid">
        <button class="btn" data-filter="grayscale">Grayscale</button>
        <button class="btn" data-filter="sepia">Sepia</button>
        <button class="btn" data-filter="invert">Invert</button>
        <button class="btn" data-filter="saturate">Saturate</button>
        <button class="btn" data-filter="blur">Blur</button>
        <button class="btn" data-filter="sharpen">Sharpen</button>
        <button class="btn" data-filter="bright">Brighten</button>
        <button class="btn" data-filter="contrast">Contrast</button>
        <button class="btn" data-filter="pixelate">Pixelate</button>
        <button class="btn" data-filter="posterize">Posterize</button>
      </div>
    </div>

    <div class="card">
      <h3>Layers</h3>
      <div class="layers" id="layers"></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn" id="btnAddLayer" style="flex:1;justify-content:center;">+ Add</button>
        <button class="btn" id="btnDelLayer" style="flex:1;justify-content:center;">− Delete</button>
      </div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="statusbar">
    <span id="statTool">Brush</span>
    <span id="statPos">x: — y: —</span>
    <span id="statSize">900 × 600</span>
    <div class="spacer"></div>
    <div class="zoom-ctrl">
      <button class="btn icon" id="zoomOut">−</button>
      <input type="range" id="zoomRange" min="10" max="400" value="100">
      <span class="val" id="zoomVal" style="width:42px;">100%</span>
      <button class="btn icon" id="zoomIn">+</button>
      <button class="btn icon" id="zoomFit" title="Fit">⤢</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" class="hidden">
<div class="toast" id="toast"></div>
<input type="text" id="textInput" class="hidden" placeholder="Type…">

<script>
(function(){
"use strict";

// ---------- State ----------
const stage = document.getElementById('stage');
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d', { willReadFrequently:true });
const canvasWrap = document.getElementById('canvasWrap');

let state = {
  tool:'brush',
  color:'#6ea8fe',
  color2:'#111111',
  size:14,
  opacity:1,
  brushShape:'round',
  shapeMode:'stroke',
  zoom:1,
  drawing:false,
  startX:0, startY:0,
  lastX:0, lastY:0,
  snapshot:null,        // committed ImageData for preview
  spaceDown:false,
};

// Layers: each layer is an offscreen canvas
let layers = [];
let activeLayer = 0;
function makeLayer(name){
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  return { name, canvas:c, ctx:c.getContext('2d',{willReadFrequently:true}), visible:true, opacity:1 };
}
function initLayers(){
  layers = [ makeLayer('Background') ];
  activeLayer = 0;
  renderLayers();
}
function activeC(){ return layers[activeLayer].ctx; }

// Compose all visible layers into the display canvas
function composite(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const L of layers){
    if(!L.visible) continue;
    ctx.globalAlpha = L.opacity;
    ctx.drawImage(L.canvas,0,0);
  }
  ctx.globalAlpha = 1;
}

// ---------- History (undo/redo) ----------
let undoStack = [], redoStack = [];
const MAX_HISTORY = 40;
function snapshotDoc(){
  return layers.map(L=>({ name:L.name, visible:L.visible, opacity:L.opacity, data:L.canvas.toDataURL() }));
}
function pushHistory(){
  undoStack.push(snapshotDoc());
  if(undoStack.length>MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}
function restoreDoc(snap){
  layers = snap.map(s=>{
    const L = makeLayer(s.name);
    const img = new Image();
    img.src = s.data;
    // synchronous-ish via onload recompose
    L._pending = img; L.visible=s.visible; L.opacity=s.opacity;
    return L;
  });
  let pending = layers.length;
  layers.forEach((L,i)=>{
    L._pending.onload = ()=>{ L.ctx.drawImage(L._pending,0,0); if(--pending===0){ composite(); renderLayers(); } };
  });
  activeLayer = Math.min(activeLayer, layers.length-1);
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshotDoc());
  restoreDoc(undoStack.pop());
  updateHistoryButtons();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshotDoc());
  restoreDoc(redoStack.pop());
  updateHistoryButtons();
}
function updateHistoryButtons(){
  document.getElementById('btnUndo').disabled = undoStack.length===0;
  document.getElementById('btnRedo').disabled = redoStack.length===0;
}

// ---------- Helpers ----------
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function withAlpha(hex,a){ const c=hexToRgb(hex); return `rgba(${c.r},${c.g},${c.b},${a})`; }
function rgbaToHex(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
  const cx = (e.clientX-rect.left)*sx;
  const cy = (e.clientY-rect.top)*sy;
  return { x:cx, y:cy };
}
function setStatus(){
  document.getElementById('statTool').textContent = state.tool[0].toUpperCase()+state.tool.slice(1);
}

// ---------- Tools ----------
function pointerDown(e){
  if(state.spaceDown || state.tool==='move'){
    stage.dataset.panning='1'; stage._px=e.clientX; stage._py=e.clientY;
    return;
  }
  const p = getPos(e);
  state.drawing = true;
  state.startX = state.lastX = p.x;
  state.startY = state.lastY = p.y;
  const c = activeC();

  if(state.tool==='eyedropper'){
    const d = c.getImageData(Math.round(p.x),Math.round(p.y),1,1).data;
    if(d[3]>0){ state.color = rgbaToHex(d[0],d[1],d[2]); syncColor(); addRecent(state.color); }
    state.drawing=false; return;
  }
  if(state.tool==='fill'){
    floodFill(c, Math.round(p.x), Math.round(p.y), state.color);
    finishStroke(); return;
  }
  if(state.tool==='text'){
    openTextInput(p.x,p.y); state.drawing=false; return;
  }
  if(state.tool==='brush' || state.tool==='eraser'){
    c.lineCap = state.brushShape==='round'?'round':'butt';
    c.lineJoin = 'round';
    c.globalAlpha = state.opacity;
    if(state.tool==='eraser') c.globalCompositeOperation='destination-out';
    else c.globalCompositeOperation='source-over';
    c.strokeStyle = withAlpha(state.color,1);
    c.fillStyle = withAlpha(state.color,1);
    c.lineWidth = state.size;
    c.beginPath();
    c.moveTo(p.x,p.y);
    dotStroke(c,p.x,p.y);
  } else {
    // shape preview base
    state.snapshot = c.getImageData(0,0,canvas.width,canvas.height);
  }
}
function pointerMove(e){
  const p = getPos(e);
  document.getElementById('statPos').textContent = `x: ${Math.round(p.x)} y: ${Math.round(p.y)}`;
  if(stage.dataset.panning){
    stage.scrollLeft -= (e.clientX - (stage._px||e.clientX));
    stage.scrollTop -= (e.clientY - (stage._py||e.clientY));
    stage._px=e.clientX; stage._py=e.clientY;
    return;
  }
  if(!state.drawing) return;
  const c = activeC();
  if(state.tool==='brush'||state.tool==='eraser'){
    c.globalAlpha = state.opacity;
    c.lineTo(p.x,p.y);
    c.stroke();
    state.lastX=p.x; state.lastY=p.y;
  } else if(state.tool==='line'||state.tool==='rect'||state.tool==='ellipse'){
    c.putImageData(state.snapshot,0,0);
    drawShape(c, state.startX, state.startY, p.x, p.y, false);
  }
}
function pointerUp(e){
  if(stage.dataset.panning){ stage.dataset.panning=''; stage._px=null; stage._py=null; return; }
  if(!state.drawing) return;
  const p = getPos(e);
  const c = activeC();
  if(state.tool==='brush'||state.tool==='eraser'){
    c.globalCompositeOperation='source-over';
    c.globalAlpha=1;
    finishStroke();
  } else if(state.tool==='line'||state.tool==='rect'||state.tool==='ellipse'){
    c.putImageData(state.snapshot,0,0);
    drawShape(c, state.startX, state.startY, p.x, p.y, true);
    state.snapshot=null;
    finishStroke();
  }
  state.drawing=false;
}
function finishStroke(){
  composite();
  pushHistory();
  renderLayers();
}
function dotStroke(c,x,y){
  if(state.tool==='eraser') return;
  if(state.brushShape==='round'){
    c.globalAlpha = state.opacity;
    c.fillStyle = withAlpha(state.color,1);
    c.beginPath(); c.arc(x,y,state.size/2,0,Math.PI*2); c.fill();
  } else {
    c.globalAlpha = state.opacity;
    c.fillStyle = withAlpha(state.color,1);
    c.fillRect(x-state.size/2,y-state.size/2,state.size,state.size);
  }
}
function drawShape(c,x0,y0,x1,y1,commit){
  c.save();
  c.globalAlpha = state.opacity;
  c.strokeStyle = withAlpha(state.color,1);
  c.fillStyle = withAlpha(state.color,1);
  c.lineWidth = state.size;
  c.lineCap='round'; c.lineJoin='round';
  if(state.tool==='line'){
    c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke();
  } else if(state.tool==='rect'){
    const rx=Math.min(x0,x1), ry=Math.min(y0,y1), rw=Math.abs(x1-x0), rh=Math.abs(y1-y0);
    if(state.shapeMode==='fill'){ c.fillRect(rx,ry,rw,rh); }
    else c.strokeRect(rx,ry,rw,rh);
  } else if(state.tool==='ellipse'){
    const cxm=(x0+x1)/2, cym=(y0+y1)/2, rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2;
    c.beginPath(); c.ellipse(cxm,cym,rx,ry,0,0,Math.PI*2);
    if(state.shapeMode==='fill') c.fill(); else c.stroke();
  }
  c.restore();
}

// ---------- Flood fill (scanline) ----------
function floodFill(c, x, y, hex){
  x=Math.round(x); y=Math.round(y);
  const W=canvas.width, H=canvas.height;
  const img = c.getImageData(0,0,W,H);
  const d = img.data;
  const idx = (px,py)=>(py*W+px)*4;
  const start = idx(x,y);
  const tr=d[start],tg=d[start+1],tb=d[start+2],ta=d[start+3];
  const col = hexToRgb(hex);
  if(tr===col.r&&tg===col.g&&tb===col.b&&ta===255) return;
  const match=(i)=> d[i]===tr&&d[i+1]===tg&&d[i+2]===tb&&d[i+3]===ta;
  const stack=[[x,y]];
  while(stack.length){
    const [sx,sy]=stack.pop();
    let nx=sx;
    while(nx>=0 && match(idx(nx,sy))) nx--;
    nx++;
    let up=false,down=false;
    while(nx<W && match(idx(nx,sy))){
      const i=idx(nx,sy);
      d[i]=col.r; d[i+1]=col.g; d[i+2]=col.b; d[i+3]=255;
      if(sy>0){ const m=match(idx(nx,sy-1)); if(m&&!up){stack.push([nx,sy-1]);up=true;} else if(!m) up=false; }
      if(sy<H-1){ const m=match(idx(nx,sy+1)); if(m&&!down){stack.push([nx,sy+1]);down=true;} else if(!m) down=false; }
      nx++;
    }
  }
  c.putImageData(img,0,0);
  composite();
}

// ---------- Filters ----------
function applyFilter(name){
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const d = img.data, W=canvas.width, H=canvas.height;
  const px=(x,y)=>(y*W+x)*4;
  const lum=(i)=>0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  switch(name){
    case 'grayscale':
      for(let i=0;i<d.length;i+=4){ const g=lum(i); d[i]=d[i+1]=d[i+2]=g; } break;
    case 'sepia':
      for(let i=0;i<d.length;i+=4){
        const r=d[i],g=d[i+1],b=d[i+2];
        d[i]=Math.min(255,r*0.393+g*0.769+b*0.189);
        d[i+1]=Math.min(255,r*0.349+g*0.686+b*0.168);
        d[i+2]=Math.min(255,r*0.272+g*0.534+b*0.131);
      } break;
    case 'invert':
      for(let i=0;i<d.length;i+=4){ d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2]; } break;
    case 'saturate':
      for(let i=0;i<d.length;i+=4){
        const g=lum(i);
        d[i]=Math.max(0,Math.min(255,g+(d[i]-g)*1.6));
        d[i+1]=Math.max(0,Math.min(255,g+(d[i+1]-g)*1.6));
        d[i+2]=Math.max(0,Math.min(255,g+(d[i+2]-g)*1.6));
      } break;
    case 'bright':
      for(let i=0;i<d.length;i+=4){ d[i]=Math.min(255,d[i]+30);d[i+1]=Math.min(255,d[i+1]+30);d[i+2]=Math.min(255,d[i+2]+30); } break;
    case 'contrast':
      for(let i=0;i<d.length;i+=4){
        d[i]=Math.max(0,Math.min(255,(d[i]-128)*1.3+128));
        d[i+1]=Math.max(0,Math.min(255,(d[i+1]-128)*1.3+128));
        d[i+2]=Math.max(0,Math.min(255,(d[i+2]-128)*1.3+128));
      } break;
    case 'blur':
      boxBlur(d,W,H,2); break;
    case 'sharpen':
      convolve(d,W,H,[-1,-1,-1,-1,9,-1,-1,-1,-1]); break;
    case 'pixelate':
      pixelate(img,16); break;
    case 'posterize':
      for(let i=0;i<d.length;i+=4){
        d[i]=Math.round(d[i]/32)*32;d[i+1]=Math.round(d[i+1]/32)*32;d[i+2]=Math.round(d[i+2]/32)*32;
      } break;
  }
  ctx.putImageData(img,0,0);
  composite(); pushHistory();
  toast('Filter: '+name);
}
function boxBlur(d,W,H,r){
  const out=new Uint8ClampedArray(d.length);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let rr=0,gg=0,bb=0,aa=0,n=0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      const i=(ny*W+nx)*4; rr+=d[i];gg+=d[i+1];bb+=d[i+2];aa+=d[i+3];n++;
    }
    const i=(y*W+x)*4; out[i]=rr/n;out[i+1]=gg/n;out[i+2]=bb/n;out[i+3]=aa/n;
  }
  d.set(out);
}
function convolve(d,W,H,k){
  const out=new Float32Array(d.length);
  const side=Math.round(Math.sqrt(k.length)), half=Math.floor(side/2);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    for(let c=0;c<3;c++){
      let sum=0;
      for(let ky=0;ky<side;ky++)for(let kx=0;kx<side;kx++){
        const nx=x+kx-half, ny=y+ky-half;
        if(nx<0||ny<0||nx>=W||ny>=H) continue;
        const i=(ny*W+nx)*4+c; sum+=d[i]*k[ky*side+kx];
      }
      const i=(y*W+x)*4+c; out[i]=sum;
    }
    out[(y*W+x)*4+3]=d[(y*W+x)*4+3];
  }
  for(let i=0;i<d.length;i++) d[i]=Math.max(0,Math.min(255,out[i]));
}
function pixelate(img,size){
  const d=img.data,W=img.width,H=img.height;
  for(let y=0;y<H;y+=size)for(let x=0;x<W;x+=size){
    let r=0,g=0,b=0,a=0,n=0;
    for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
      const nx=x+dx,ny=y+dy; if(nx>=W||ny>=H)continue;
      const i=(ny*W+nx)*4; r+=d[i];g+=d[i+1];b+=d[i+2];a+=d[i+3];n++;
    }
    r/=n;g/=n;b/=n;a/=n;
    for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
      const nx=x+dx,ny=y+dy; if(nx>=W||ny>=H)continue;
      const i=(ny*W+nx)*4; d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=a;
    }
  }
}

  const el=document.getElementById('layers'); el.innerHTML='';

    row.className='layer'+(i===activeLayer?' active':'');

    eye.onclick=()=>{ L.visible=!L.visible; composite(); renderLayers(); };
    const thumb=document.createElement('div'); thumb.className='thumb';
    thumb.style.backgroundImage=`url(${L.canvas.toDataURL()})`;
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=L.name;
    const op=document.createElement('input'); op.type='range'; op.min=0; op.max=100; op.value=Math.round(L.opacity*100);
    op.title='Layer opacity';
    op.oninput=()=>{ L.opacity=op.value/100; composite(); };
    op.onchange=()=>{ pushHistory(); };
    row.append(eye,thumb,nm,op);
    el.appendChild(row);
  }
}

// ---------- Starter artwork (showcase) ----------
function drawStarter(){

  c.fillStyle=sun; c.beginPath(); c.arc(640,180,120,0,Math.PI*2); c.fill();
  c.restore();
  // mountains
  c.fillStyle='#0e1322';
  c.beginPath(); c.moveTo(0,600);
  c.lineTo(180,360); c.lineTo(330,470); c.lineTo(470,300); c.lineTo(640,500);
  c.lineTo(780,330); c.lineTo(900,470); c.lineTo(900,600); c.closePath(); c.fill();
  c.fillStyle='#161d33';

  c.fillText('Prism — draw, shape, fill, filter', 50, 560);
  composite();
}

buildPalette();
syncColor();
initLayers();
drawStarter();
pushHistory();
setZoom(1); zoomFit();

updateHistoryButtons();

})();
