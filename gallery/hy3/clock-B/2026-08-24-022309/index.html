<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Clock</title>
<style>
  :root {
    --face: #11131a;
    --face-edge: #1c2130;
    --rim: #2b3145;
    --tick: #3a4258;
    --accent: #7aa2ff;
    --accent-soft: #9bb6ff;
    --text: #c9d2e6;
    --text-dim: #6b7693;
    --second: #ff7a7a;
    --glow: rgba(122, 162, 255, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(120% 120% at 50% 0%, #1a2030 0%, #0b0d14 55%, #05060a 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    overflow: hidden;
  }

  /* slow drifting ambient aurora behind the clock */
  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background:
      radial-gradient(40% 40% at 30% 35%, rgba(122,162,255,0.18), transparent 70%),
      radial-gradient(45% 45% at 72% 60%, rgba(255,122,170,0.12), transparent 70%),
      radial-gradient(50% 50% at 55% 80%, rgba(120,255,200,0.10), transparent 70%);
    filter: blur(40px);
    animation: drift 26s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes drift {
    0%   { transform: translate3d(-3%, -2%, 0) scale(1); }
    50%  { transform: translate3d(4%, 3%, 0) scale(1.08); }
    100% { transform: translate3d(-2%, 4%, 0) scale(1.02); }
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 24px;
  }

  .clock {
    position: relative;
    width: min(74vmin, 460px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 38%, #1b2030 0%, #11131a 60%, #0c0e15 100%);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.55),
      inset 0 2px 3px rgba(255,255,255,0.05),
      inset 0 -18px 40px rgba(0,0,0,0.6);
    border: 1px solid var(--rim);
  }

  /* outer metal rim */
  .clock::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: linear-gradient(145deg, #2a3042, #0c0e15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 2px rgba(255,255,255,0.06);
    z-index: -1;
  }

  .ticks { position: absolute; inset: 0; }
  .tick {
    position: absolute;
    left: 50%;
    top: 0;
    width: 0;
    height: 50%;
    transform-origin: bottom center;
  }
  .tick::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 10px;
    background: var(--text-dim);
    border-radius: 2px;
  }
  .tick.major::before { width: 3px; height: 18px; background: var(--accent-soft); }

  .face-text {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    color: var(--text-dim);
    letter-spacing: 0.35em;
    font-size: 0.7rem;
    text-transform: uppercase;
    user-select: none;
  }
  .brand { top: 24%; }
  .sub   { bottom: 24%; letter-spacing: 0.2em; font-size: 0.58rem; color: var(--text); opacity: 0.5; }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 6px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--glow);
    will-change: transform;
  }
  .hand.hour   { width: 8px; height: 26%; background: linear-gradient(var(--accent-soft), var(--accent)); }
  .hand.minute { width: 5px; height: 38%; background: linear-gradient(#aebfff, var(--accent)); }
  .hand.second {
    width: 2px;
    height: 42%;
    background: var(--second);
    box-shadow: 0 0 8px rgba(255,122,122,0.6);
  }
  .hand.second::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: 8px; height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: var(--second);
    box-shadow: 0 0 10px rgba(255,122,122,0.7);
  }

  .pivot {
    position: absolute;
    left: 50%; top: 50%;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #e6ecff, #7aa2ff 60%, #3f5688);
    box-shadow: 0 0 12px var(--glow);
    z-index: 5;
  }

  .readout {
    text-align: center;
    user-select: none;
  }
  .time {
    font-size: clamp(2.2rem, 7vmin, 3.4rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-shadow: 0 0 18px rgba(122,162,255,0.25);
  }
  .time .sep { color: var(--accent); animation: blink 2s steps(1) infinite; }
  .time .sec { font-size: 0.55em; color: var(--text-dim); margin-left: 0.1em; vertical-align: baseline; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.25; } }

  .meta {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 0.95rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .meta .ampm { color: var(--accent-soft); }
</style>
</head>
<body>
  <div class="stage">
    <div class="clock" id="clock" role="img" aria-label="Analog clock">
      <div class="ticks" id="ticks"></div>
      <div class="face-text brand">AURORA</div>
      <div class="face-text sub">HY3</div>
      <div class="hand hour"   id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="pivot"></div>
    </div>

    <div class="readout">
      <div class="time" id="time"><span id="hm">--:--</span><span class="sep" id="sep">:</span><span class="sec" id="sec">--</span></div>
      <div class="meta" id="meta"><span id="date"></span> &middot; <span class="ampm" id="ampm"></span></div>
    </div>
  </div>

<script>
  (function () {
    // Build tick marks around the dial.
    var ticks = document.getElementById("ticks");
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      var tick = document.createElement("div");
      tick.className = "tick" + (major ? " major" : "");
      tick.style.transform = "translateX(-50%) rotate(" + (i * 6) + "deg)";
      ticks.appendChild(tick);
    }

    var hourEl = document.getElementById("hour");
    var minuteEl = document.getElementById("minute");
    var secondEl = document.getElementById("second");
    var hmEl = document.getElementById("hm");
    var secEl = document.getElementById("sec");
    var dateEl = document.getElementById("date");
    var ampmEl = document.getElementById("ampm");

    var days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

    function pad(n) { return (n < 10 ? "0" : "") + n; }

    function tick() {
      var now = new Date();
      var ms = now.getMilliseconds();
      var s = now.getSeconds() + ms / 1000;
      var m = now.getMinutes() + s / 60;
      var h = (now.getHours() % 12) + m / 60;

      // smooth sweeping motion
      secondEl.style.transform = "rotate(" + (s * 6) + "deg)";
      minuteEl.style.transform = "rotate(" + (m * 6) + "deg)";
      hourEl.style.transform = "rotate(" + (h * 30) + "deg)";

      var hh = now.getHours();
      var ampm = hh >= 12 ? "PM" : "AM";
      var hh12 = hh % 12; if (hh12 === 0) hh12 = 12;
      hmEl.textContent = pad(hh12) + ":" + pad(now.getMinutes());
      secEl.textContent = pad(now.getSeconds());

      dateEl.textContent = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()];
      ampmEl.textContent = ampm;

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
