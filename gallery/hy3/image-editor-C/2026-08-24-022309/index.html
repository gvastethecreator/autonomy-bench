<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumen — Image Editor</title>
<style>
  :root{
    --bg-0:#0c0f1c;
    --bg-1:#121627;
    --panel:rgba(255,255,255,.045);
    --panel-2:rgba(255,255,255,.07);
    --stroke:rgba(255,255,255,.09);
    --stroke-2:rgba(255,255,255,.16);
    --text:#e9edf8;
    --muted:#9aa3bd;
    --faint:#69728f;
    --accent:#7c83ff;
    --accent-2:#5ce1ff;
    --accent-grad:linear-gradient(135deg,#5ce1ff,#7c83ff 55%,#b06bff);
    --danger:#ff6b8a;
    --ok:#5cffb0;
    --radius:14px;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--text);
    background:
      radial-gradient(1100px 700px at 12% -10%,rgba(124,131,255,.16),transparent 55%),
      radial-gradient(900px 600px at 110% 10%,rgba(92,225,255,.12),transparent 50%),
      linear-gradient(160deg,var(--bg-0),var(--bg-1));
    background-attachment:fixed;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- App shell ---------- */
  .app{
    height:100vh;
    display:grid;
    grid-template-rows:58px 1fr 30px;
    grid-template-columns:72px 1fr 286px;
    grid-template-areas:
      "top top top"
      "tools stage props"
      "status status status";
  }

  /* ---------- Top bar ---------- */
  .topbar{
    grid-area:top;
    display:flex;align-items:center;gap:18px;
    padding:0 18px;
    border-bottom:1px solid var(--stroke);
    backdrop-filter:blur(14px);
    background:linear-gradient(180deg,rgba(18,22,39,.75),rgba(18,22,39,.35));
  }
  .brand{display:flex;align-items:center;gap:11px;user-select:none;}
  .logo{
    width:30px;height:30px;border-radius:9px;
    background:var(--accent-grad);
    display:grid;place-items:center;
    box-shadow:0 6px 18px -6px rgba(124,131,255,.8);
    position:relative;
  }
  .logo svg{width:18px;height:18px;}
  .brand .name{font-weight:700;letter-spacing:.4px;font-size:15px;}
  .brand .sub{font-size:11px;color:var(--faint);margin-top:1px;letter-spacing:.6px;text-transform:uppercase;}

  .top-actions{display:flex;gap:8px;margin-left:8px;}
  .btn{
    appearance:none;border:1px solid var(--stroke);
    background:var(--panel);color:var(--text);
    height:36px;padding:0 13px;border-radius:10px;
    font:inherit;font-size:13px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    transition:transform .12s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .btn svg{width:15px;height:15px;}
  .btn:hover{background:var(--panel-2);border-color:var(--stroke-2);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}
  .btn.primary{
    background:var(--accent-grad);border-color:transparent;color:#0b0e1a;font-weight:700;
    box-shadow:0 8px 22px -10px rgba(124,131,255,.9);
  }
  .btn.primary:hover{box-shadow:0 12px 28px -10px rgba(124,131,255,1);}
  .btn.icon{width:36px;padding:0;justify-content:center;}
  .spacer{flex:1;}

  /* ---------- Tools rail ---------- */
  .tools{
    grid-area:tools;
    border-right:1px solid var(--stroke);
    background:linear-gradient(180deg,rgba(18,22,39,.4),rgba(18,22,39,.15));
    display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:14px 0;
  }
  .tool{
    width:46px;height:46px;border-radius:12px;
    border:1px solid transparent;background:transparent;
    color:var(--muted);cursor:pointer;
    display:grid;place-items:center;
    transition:all .15s ease;position:relative;
  }
  .tool svg{width:20px;height:20px;transition:transform .15s ease;}
  .tool:hover{background:var(--panel);color:var(--text);}
  .tool.active{
    background:linear-gradient(160deg,rgba(124,131,255,.28),rgba(92,225,255,.16));
    color:#fff;border-color:rgba(124,131,255,.5);
    box-shadow:0 8px 20px -10px rgba(124,131,255,.9);
  }
  .tool.active svg{transform:scale(1.05);}
  .tool .tip{
    position:absolute;left:54px;top:50%;transform:translateY(-50%) translateX(-6px);
    background:#1b2036;border:1px solid var(--stroke-2);color:var(--text);
    padding:5px 9px;border-radius:8px;font-size:11.5px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:40;
    box-shadow:var(--shadow);
  }
  .tool:hover .tip{opacity:1;transform:translateY(-50%) translateX(0);}
  .rail-div{width:30px;height:1px;background:var(--stroke);margin:4px 0;}

  /* ---------- Stage ---------- */
  .stage{
    grid-area:stage;
    position:relative;overflow:hidden;
    display:grid;place-items:center;
    padding:26px;
  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:22px 22px;opacity:.5;pointer-events:none;
  }
  .canvas-wrap{
    position:relative;
    border-radius:12px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06);
    background:
      conic-gradient(#1a1f33 0 25%,#141829 0 50%) 0 0/22px 22px;
    transition:transform .12s ease;
    line-height:0;
  }
  #board{
    display:block;border-radius:12px;
    image-rendering:auto;
    touch-action:none;cursor:crosshair;
  }
  .drop-hint{
    position:absolute;inset:0;display:grid;place-items:center;
    border-radius:12px;
    background:rgba(10,12,22,.6);backdrop-filter:blur(3px);
    color:var(--muted);font-size:14px;letter-spacing:.3px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;
    border:2px dashed rgba(124,131,255,.5);
  }
  .stage.dragging .drop-hint{opacity:1;}

  /* ---------- Props panel ---------- */
  .props{
    grid-area:props;border-left:1px solid var(--stroke);
    background:linear-gradient(180deg,rgba(18,22,39,.4),rgba(18,22,39,.12));
    overflow-y:auto;padding:16px 16px 28px;
  }
  .props::-webkit-scrollbar{width:8px;}
  .props::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
  .section{margin-bottom:18px;}
  .section h3{
    font-size:11px;text-transform:uppercase;letter-spacing:1px;
    color:var(--faint);margin:0 0 10px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .section h3::after{content:"";flex:1;height:1px;background:var(--stroke);}

  .color-row{display:flex;align-items:center;gap:12px;}
  .swatch-main{
    width:62px;height:62px;border-radius:14px;flex:none;
    border:1px solid var(--stroke-2);position:relative;overflow:hidden;
    box-shadow:inset 0 0 0 3px var(--bg-1);
  }
  .swatch-main input[type=color]{
    position:absolute;inset:-6px;width:130%;height:130%;border:none;padding:0;cursor:pointer;background:none;
  }
  .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:13px;}
  .chip{
    aspect-ratio:1;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .chip:hover{transform:scale(1.12);box-shadow:0 4px 12px -4px rgba(0,0,0,.6);}
  .chip.sel{box-shadow:0 0 0 2px var(--bg-1),0 0 0 4px var(--accent-2);transform:scale(1.05);}

  .field{margin-bottom:14px;}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;}
  .field label b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:5px;border-radius:5px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--p,40%),rgba(255,255,255,.12) var(--p,40%));
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);
    box-shadow:0 2px 8px -2px rgba(0,0,0,.7);cursor:pointer;transition:transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}

  .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .filter-btn{
    border:1px solid var(--stroke);background:var(--panel);color:var(--text);
    border-radius:10px;padding:10px 8px;font:inherit;font-size:12px;font-weight:550;
    cursor:pointer;transition:all .14s ease;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .filter-btn:hover{background:var(--panel-2);border-color:var(--stroke-2);transform:translateY(-1px);}
  .filter-btn .fb-ico{width:26px;height:26px;border-radius:7px;background:var(--accent-grad);opacity:.9;}

  .adjust-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .adjust-row span{width:78px;font-size:12px;color:var(--muted);}
  .adjust-row input[type=range]{flex:1;}

  .canvas-ctl{display:flex;gap:8px;}
  .canvas-ctl input{
    width:100%;background:var(--panel);border:1px solid var(--stroke);color:var(--text);
    border-radius:9px;height:34px;padding:0 10px;font:inherit;font-size:13px;
  }
  .canvas-ctl input:focus{outline:none;border-color:var(--accent);}
  .seg{display:flex;gap:6px;margin-top:10px;}
  .seg button{
    flex:1;height:32px;border-radius:8px;border:1px solid var(--stroke);
    background:var(--panel);color:var(--muted);font:inherit;font-size:12px;cursor:pointer;transition:.14s;
  }
  .seg button.on{background:var(--panel-2);color:var(--text);border-color:var(--stroke-2);}

  /* ---------- Status bar ---------- */
  .statusbar{
    grid-area:status;border-top:1px solid var(--stroke);
    display:flex;align-items:center;gap:18px;padding:0 16px;
    font-size:11.5px;color:var(--faint);
    background:rgba(12,15,28,.6);
  }
  .statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .statusbar b{color:var(--muted);font-weight:600;}
  .zoom-ctl{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .zoom-ctl button{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--stroke);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;line-height:1;
  }
  .zoom-ctl button:hover{background:var(--panel-2);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1b2036;border:1px solid var(--stroke-2);color:var(--text);
    padding:11px 18px;border-radius:12px;font-size:13px;font-weight:550;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;
    display:flex;align-items:center;gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .ic{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}

  .hidden-file{display:none;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .props>*,.topbar>*{animation:fadeUp .4s ease both;}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 5.6L20 9.2l-4 4 1 6-5-3-5 3 1-6-4-4 5.8-.6L12 3z" fill="#0b0e1a"/></svg>
      </div>
      <div>
        <div class="name">Lumen</div>
        <div class="sub">Image Studio</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn" id="btnNew" title="New canvas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New
      </button>
      <button class="btn" id="btnOpen" title="Open image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l4-4 4 4 4-6 4 4M4 5h16v14H4z"/></svg>Open
      </button>
      <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 015 5v0"/></svg>
      </button>
      <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 00-5 5v0"/></svg>
      </button>
    </div>

    <div class="spacer"></div>

    <button class="btn primary" id="btnExport" title="Export PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Export
    </button>
    <input type="file" id="fileInput" class="hidden-file" accept="image/*" />
  </header>

  <!-- TOOLS -->
  <nav class="tools" id="toolRail">
    <button class="tool active" data-tool="brush" title="Brush">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 4-2 4-4 0-2-2-3-4-3M14 4l6 6-7 7-6-6 7-7z"/></svg>
      <span class="tip">Brush <b>(B)</b></span>
    </button>
    <button class="tool" data-tool="eraser" title="Eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l7-7 6 6-5 5H7l-3-3zM14 6l4 4"/></svg>
      <span class="tip">Eraser <b>(E)</b></span>
    </button>
    <button class="tool" data-tool="line" title="Line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5"/></svg>
      <span class="tip">Line <b>(L)</b></span>
    </button>
    <button class="tool" data-tool="rect" title="Rectangle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
      <span class="tip">Rectangle <b>(R)</b></span>
    </button>
    <button class="tool" data-tool="ellipse" title="Ellipse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
      <span class="tip">Ellipse <b>(O)</b></span>
    </button>
    <div class="rail-div"></div>
    <button class="tool" data-tool="fill" title="Fill bucket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l6-6 6 6-6 6a4 4 0 01-6 0l-0-0zM5 11l-2 2M11 17l5 5"/></svg>
      <span class="tip">Fill <b>(G)</b></span>
    </button>
    <button class="tool" data-tool="text" title="Text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
      <span class="tip">Text <b>(T)</b></span>
    </button>
    <button class="tool" data-tool="eyedropper" title="Eyedropper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l4 4-8 8-4 1 1-4 7-9zM3 21l3-1"/></svg>
      <span class="tip">Pick color <b>(I)</b></span>
    </button>
  </nav>

  <!-- STAGE -->
  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="board" width="1000" height="700"></canvas>
      <div class="drop-hint">Drop an image to open it</div>
    </div>
  </main>

  <!-- PROPS -->
  <aside class="props">
    <div class="section">
      <h3>Color</h3>
      <div class="color-row">
        <div class="swatch-main"><input type="color" id="colorInput" value="#7c83ff" /></div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5;">
          <div style="color:var(--text);font-weight:600;" id="hexLabel">#7C83FF</div>
          <div>Active paint</div>
        </div>
      </div>
      <div class="palette" id="palette"></div>
    </div>

    <div class="section">
      <h3>Brush</h3>
      <div class="field">
        <label>Size <b id="sizeVal">14 px</b></label>
        <input type="range" id="sizeRange" min="1" max="120" value="14" />
      </div>
      <div class="field">
        <label>Opacity <b id="opVal">100%</b></label>
        <input type="range" id="opRange" min="5" max="100" value="100" />
      </div>
    </div>

    <div class="section">
      <h3>Filters</h3>
      <div class="filter-grid" id="filterGrid">
        <button class="filter-btn" data-filter="grayscale(1)"><span class="fb-ico"></span>Grayscale</button>
        <button class="filter-btn" data-filter="sepia(1)"><span class="fb-ico"></span>Sepia</button>
        <button class="filter-btn" data-filter="invert(1)"><span class="fb-ico"></span>Invert</button>
        <button class="filter-btn" data-filter="blur(2px)"><span class="fb-ico"></span>Blur</button>
      </div>
    </div>

    <div class="section">
      <h3>Adjustments</h3>
      <div class="adjust-row"><span>Brightness</span><input type="range" id="adjBright" min="-100" max="100" value="0"></div>
      <div class="adjust-row"><span>Contrast</span><input type="range" id="adjContrast" min="-100" max="100" value="0"></div>
      <div class="adjust-row"><span>Saturation</span><input type="range" id="adjSat" min="-100" max="100" value="0"></div>
      <div class="adjust-row"><span>Hue</span><input type="range" id="adjHue" min="-180" max="180" value="0"></div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="btn" id="adjApply" style="flex:1;justify-content:center;">Apply</button>
        <button class="btn" id="adjReset" style="flex:1;justify-content:center;">Reset</button>
      </div>
    </div>

    <div class="section">
      <h3>Canvas</h3>
      <div class="canvas-ctl">
        <input type="number" id="cw" value="1000" min="50" max="4000" title="Width">
        <input type="number" id="ch" value="700" min="50" max="4000" title="Height">
      </div>
      <div class="seg" id="bgSeg">
        <button data-bg="transparent" class="on">Transparent</button>
        <button data-bg="#ffffff">White</button>
        <button data-bg="#0c0f1c">Dark</button>
      </div>
      <button class="btn" id="btnResize" style="width:100%;justify-content:center;margin-top:10px;">Create canvas</button>
    </div>
  </aside>

  <!-- STATUS -->
  <footer class="statusbar">
    <span class="dot"></span>
    <span>Ready</span>
    <span>Tool: <b id="stTool">Brush</b></span>
    <span>Size: <b id="stSize">14</b></span>
    <span>Pos: <b id="stPos">—</b></span>
    <div class="zoom-ctl">
      <button id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn">+</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"><span class="ic"></span><span id="toastMsg">Saved</span></div>

<script>
(function(){
  "use strict";
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  let W = board.width, H = board.height;

  const state = {
    tool:'brush',
    color:'#7c83ff',
    size:14,
    opacity:1,
    drawing:false,
    last:null,
    snap:null,
    zoom:1,
    bg:'transparent'
  };

  // ---------- History ----------
  const history = [];
  let histIdx = -1;
  const HIST_MAX = 40;
  function cloneImage(d){ return new ImageData(new Uint8ClampedArray(d.data), d.width, d.height); }
  function pushHistory(){
    // drop redo branch
    if(histIdx < history.length-1) history.length = histIdx+1;
    history.push(cloneImage(ctx.getImageData(0,0,W,H)));
    if(history.length > HIST_MAX){ history.shift(); }
    histIdx = history.length-1;
    updateHistBtns();
  }
  function undo(){
    if(histIdx <= 0) return;
    histIdx--;
    ctx.putImageData(history[histIdx],0,0);
    updateHistBtns();
  }
  function redo(){
    if(histIdx >= history.length-1) return;
    histIdx++;
    ctx.putImageData(history[histIdx],0,0);
    updateHistBtns();
  }
  function updateHistBtns(){
    document.getElementById('btnUndo').disabled = histIdx<=0;
    document.getElementById('btnRedo').disabled = histIdx>=history.length-1;
  }

  // ---------- Helpers ----------
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
    const n = parseInt(hex,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function pos(e){
    const r = board.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    const y = (e.clientY - r.top) * (H / r.height);
    return {x:Math.round(x), y:Math.round(y)};
  }
  function setStatus(){
    document.getElementById('stTool').textContent = state.tool.charAt(0).toUpperCase()+state.tool.slice(1);
    document.getElementById('stSize').textContent = state.size;
  }

  // ---------- Drawing primitives ----------
  function strokeSegment(a,b){
    ctx.save();
    ctx.globalAlpha = state.opacity;
    ctx.strokeStyle = state.color;
    ctx.fillStyle = state.color;
    ctx.lineWidth = state.size;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
    // round cap dot for single clicks
    ctx.beginPath();
    ctx.arc(b.x,b.y,state.size/2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function eraseSegment(a,b){
    ctx.save();
    ctx.globalAlpha = state.opacity;
    ctx.globalCompositeOperation='destination-out';
    ctx.strokeStyle='rgba(0,0,0,1)';
    ctx.lineWidth=state.size;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x,b.y,state.size/2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawLine(a,b){
    ctx.save();
    ctx.globalAlpha=state.opacity;
    ctx.strokeStyle=state.color;
    ctx.lineWidth=state.size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.restore();
  }
  function drawRect(a,b){
    ctx.save();
    ctx.globalAlpha=state.opacity;
    ctx.strokeStyle=state.color;
    ctx.lineWidth=state.size; ctx.lineJoin='round';
    ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));
    ctx.restore();
  }
  function drawEllipse(a,b){
    ctx.save();
    ctx.globalAlpha=state.opacity;
    ctx.strokeStyle=state.color;
    ctx.lineWidth=state.size;
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const rx=Math.abs(b.x-a.x)/2, ry=Math.abs(b.y-a.y)/2;
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function floodFill(sx,sy){
    sx=Math.max(0,Math.min(W-1,sx)); sy=Math.max(0,Math.min(H-1,sy));
    const img=ctx.getImageData(0,0,W,H);
    const d=img.data;
    const at=(x,y)=>(y*W+x)*4;
    const si=at(sx,sy);
    const [fr,fg,fb]=hexToRgb(state.color);
    const fa=Math.round(state.opacity*255);
    const sr=d[si],sg=d[si+1],sb=d[si+2],sa=d[si+3];
    if(sr===fr&&sg===fg&&sb===fb&&sa===fa) return;
    const tol=40;
    const match=(x,y)=>{const i=at(x,y);return Math.abs(d[i]-sr)<=tol&&Math.abs(d[i+1]-sg)<=tol&&Math.abs(d[i+2]-sb)<=tol&&Math.abs(d[i+3]-sa)<=tol;};
    const stack=[[sx,sy]];
    while(stack.length){
      const [x,y]=stack.pop();
      let xl=x; while(xl>=0&&match(xl,y)) xl--; xl++;
      let xr=x; while(xr<W&&match(xr,y)) xr++; xr--;
      for(let i=xl;i<=xr;i++){
        const p=at(i,y);
        d[p]=fr; d[p+1]=fg; d[p+2]=fb; d[p+3]=fa;
        if(y+1<H&&match(i,y+1)) stack.push([i,y+1]);
        if(y-1>=0&&match(i,y-1)) stack.push([i,y-1]);
      }
    }
    ctx.putImageData(img,0,0);
  }
  function drawText(x,y){
    const text = prompt('Enter text:','Lumen');
    if(text===null) return;
    const size = Math.max(12, state.size*2.2);
    ctx.save();
    ctx.globalAlpha=state.opacity;
    ctx.fillStyle=state.color;
    ctx.textBaseline='top';
    ctx.font = '600 '+size+'px Inter, system-ui, sans-serif';
    ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=size*0.06;
    ctx.fillText(text,x,y);
    ctx.restore();
  }

  // ---------- Pointer handling ----------
  function onDown(e){
    if(e.button!==undefined && e.button!==0) return;
    const p=pos(e);
    if(state.tool==='eyedropper'){ pickColor(p); return; }
    if(state.tool==='fill'){ pushHistory(); floodFill(p.x,p.y); return; }
    if(state.tool==='text'){ pushHistory(); drawText(p.x,p.y); return; }

    state.drawing=true;
    board.setPointerCapture(e.pointerId);
    pushHistory();
    state.last=p;
    state.snap = cloneImage(ctx.getImageData(0,0,W,H));
    if(state.tool==='brush') strokeSegment(p,p);
    else if(state.tool==='eraser') eraseSegment(p,p);
  }
  function onMove(e){
    const p=pos(e);
    document.getElementById('stPos').textContent = p.x+', '+p.y;
    if(!state.drawing){
      if(state.tool==='line'||state.tool==='rect'||state.tool==='ellipse'){
        // hover preview not needed
      }
      return;
    }
    if(state.tool==='brush'){ strokeSegment(state.last,p); state.last=p; }
    else if(state.tool==='eraser'){ eraseSegment(state.last,p); state.last=p; }
    else if(state.tool==='line'){ ctx.putImageData(state.snap,0,0); drawLine(state.last,p); }
    else if(state.tool==='rect'){ ctx.putImageData(state.snap,0,0); drawRect(state.last,p); }
    else if(state.tool==='ellipse'){ ctx.putImageData(state.snap,0,0); drawEllipse(state.last,p); }
  }
  function onUp(e){
    if(!state.drawing) return;
    state.drawing=false;
    try{ board.releasePointerCapture(e.pointerId);}catch(_){}
    state.snap=null;
  }
  function pickColor(p){
    const d=ctx.getImageData(p.x,p.y,1,1).data;
    if(d[3]===0){ /* transparent: keep current */ toast('Picked transparent'); return; }
    const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
    setColor(hex);
    toast('Picked '+hex);
  }

  board.addEventListener('pointerdown',onDown);
  board.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  board.addEventListener('pointerleave',()=>{document.getElementById('stPos').textContent='—';});

  // ---------- Color UI ----------
  const palette = ['#ffffff','#0c0f1c','#7c83ff','#5ce1ff','#b06bff','#ff6b8a','#ffb86b','#5cffb0',
                   '#ff4d6d','#ffd166','#06d6a0','#118ab2','#073b4c','#ef476f','#f78c6b','#c0c6e0'];
  const palEl=document.getElementById('palette');
  palette.forEach(c=>{
    const el=document.createElement('div');
    el.className='chip'; el.style.background=c; el.dataset.c=c;
    el.addEventListener('click',()=>setColor(c));
    palEl.appendChild(el);
  });
  const colorInput=document.getElementById('colorInput');
  const hexLabel=document.getElementById('hexLabel');
  function setColor(hex){
    state.color=hex.toLowerCase();
    colorInput.value = state.color.length===7?state.color:'#000000';
    hexLabel.textContent=state.color.toUpperCase();
    [...palEl.children].forEach(ch=>ch.classList.toggle('sel',ch.dataset.c.toLowerCase()===state.color));
  }
  colorInput.addEventListener('input',e=>setColor(e.target.value));
  setColor('#7c83ff');

  // ---------- Size / opacity ----------
  const sizeRange=document.getElementById('sizeRange');
  const opRange=document.getElementById('opRange');
  function syncRange(el){ el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%'); }
  sizeRange.addEventListener('input',e=>{
    state.size=+e.target.value;
    document.getElementById('sizeVal').textContent=state.size+' px';
    syncRange(sizeRange); setStatus();
  });
  opRange.addEventListener('input',e=>{
    state.opacity=(+e.target.value)/100;
    document.getElementById('opVal').textContent=e.target.value+'%';
    syncRange(opRange);
  });
  syncRange(sizeRange); syncRange(opRange);

  // ---------- Tools ----------
  document.getElementById('toolRail').addEventListener('click',e=>{
    const b=e.target.closest('.tool'); if(!b) return;
    selectTool(b.dataset.tool);
  });
  function selectTool(t){
    state.tool=t;
    [...document.querySelectorAll('.tool')].forEach(x=>x.classList.toggle('active',x.dataset.tool===t));
    setStatus();
    board.style.cursor = t==='eyedropper'?'cell':(t==='text'?'text':'crosshair');
  }

  // ---------- Filters ----------
  document.getElementById('filterGrid').addEventListener('click',e=>{
    const b=e.target.closest('.filter-btn'); if(!b) return;
    pushHistory();
    ctx.save();
    ctx.filter=b.dataset.filter;
    ctx.drawImage(board,0,0);
    ctx.restore();
    ctx.filter='none';
    toast('Filter applied');
  });

  // ---------- Adjustments (live preview) ----------
  const adj={bright:document.getElementById('adjBright'),contrast:document.getElementById('adjContrast'),
             sat:document.getElementById('adjSat'),hue:document.getElementById('adjHue')};
  let adjBase=null;
  function adjFilterString(){
    const b=(+adj.bright.value)*1.0; // % -> brightness multiplier approx
    const c=(+adj.contrast.value)*1.0;
    const s=(+adj.sat.value)*1.0;
    const h=+adj.hue.value;
    // map: brightness via brightness(), contrast via contrast(), sat via saturate(), hue via hue-rotate()
    const bright = (100 + b)/100;
    const contrast = (100 + c)/100;
    const sat = (100 + s)/100;
    return `brightness(${bright}) contrast(${contrast}) saturate(${sat}) hue-rotate(${h}deg)`;
  }
  function adjPreview(){
    if(!adjBase) return;
    ctx.putImageData(adjBase,0,0);
    ctx.save();
    ctx.filter=adjFilterString();
    ctx.drawImage(board,0,0);
    ctx.restore();
    ctx.filter='none';
  }
  Object.values(adj).forEach(el=>{ syncRange(el); el.addEventListener('input',()=>{syncRange(el);adjPreview();}); });
  document.getElementById('btnResize'); // noop ref
  document.getElementById('adjApply').addEventListener('click',()=>{
    if(!adjBase) return;
    pushHistory();
    adjBase=null;
    [adj.bright,adj.contrast,adj.sat,adj.hue].forEach(el=>el.value=0);
    Object.values(adj).forEach(syncRange);
    toast('Adjustments applied');
  });
  document.getElementById('adjReset').addEventListener('click',()=>{
    if(!adjBase){ // reset sliders only
      [adj.bright,adj.contrast,adj.sat,adj.hue].forEach(el=>el.value=0);
      Object.values(adj).forEach(syncRange); return;
    }
    ctx.putImageData(adjBase,0,0);
    adjBase=null;
    [adj.bright,adj.contrast,adj.sat,adj.hue].forEach(el=>el.value=0);
    Object.values(adj).forEach(syncRange);
    toast('Adjustments cancelled');
  });
  // capture base when starting an adjustment (lazy on first slider input)
  ['adjBright','adjContrast','adjSat','adjHue'].forEach(id=>{
    document.getElementById(id).addEventListener('pointerdown',()=>{
      if(!adjBase) adjBase = cloneImage(ctx.getImageData(0,0,W,H));
    });
  });

  // ---------- Canvas resize / new ----------
  const bgSeg=document.getElementById('bgSeg');
  bgSeg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    [...bgSeg.children].forEach(x=>x.classList.toggle('on',x===b));
    state.bg=b.dataset.bg;
  });
  function createCanvas(w,h,bg){
    W=w; H=h; board.width=w; board.height=h;
    ctx.clearRect(0,0,W,H);
    if(bg && bg!=='transparent'){ ctx.fillStyle=bg; ctx.fillRect(0,0,W,H); }
    history.length=0; histIdx=-1;
    pushHistory();
    applyZoom();
    toast('Canvas '+w+'×'+h);
  }
  document.getElementById('btnResize').addEventListener('click',()=>{
    const w=Math.max(1,Math.min(4000,+document.getElementById('cw').value||1000));
    const h=Math.max(1,Math.min(4000,+document.getElementById('ch').value||700));
    createCanvas(w,h,state.bg);
  });
  document.getElementById('btnNew').addEventListener('click',()=>{
    document.getElementById('cw').value=1000; document.getElementById('ch').value=700;
    state.bg='transparent';
    [...bgSeg.children].forEach(x=>x.classList.toggle('on',x.dataset.bg==='transparent'));
    createCanvas(1000,700,'transparent');
  });

  // ---------- Open / upload ----------
  const fileInput=document.getElementById('fileInput');
  document.getElementById('btnOpen').addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadFile(f); fileInput.value=''; });
  function loadFile(file){
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      W=img.width; H=img.height; board.width=W; board.height=H;
      ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0);
      document.getElementById('cw').value=W; document.getElementById('ch').value=H;
      history.length=0; histIdx=-1; pushHistory(); applyZoom();
      URL.revokeObjectURL(url);
      toast('Opened '+file.name);
    };
    img.src=url;
  }
  // drag & drop
  const stage=document.getElementById('stage');
  ['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.add('dragging');}));
  ['dragleave','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.remove('dragging');}));
  stage.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f && f.type.startsWith('image/')) loadFile(f); });
  // paste
  window.addEventListener('paste',e=>{
    const item=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));
    if(item) loadFile(item.getAsFile());
  });

  // ---------- Export ----------
  document.getElementById('btnExport').addEventListener('click',()=>{
    const a=document.createElement('a');
    a.download='lumen-'+Date.now()+'.png';
    a.href=board.toDataURL('image/png');
    a.click();
    toast('Exported PNG');
  });

  // ---------- Undo / redo buttons ----------
  document.getElementById('btnUndo').addEventListener('click',undo);
  document.getElementById('btnRedo').addEventListener('click',redo);

  // ---------- Zoom ----------
  const zoomLabel=document.getElementById('zoomLabel');
  function applyZoom(){
    const maxW = stage.clientWidth - 52;
    const maxH = stage.clientHeight - 52;
    // fit if needed
    const fit = Math.min(1, maxW/W, maxH/H);
    const z = Math.min(state.zoom, fit>0? Math.max(state.zoom, fit):state.zoom);
    const dispW = W * z, dispH = H * z;
    board.style.width=dispW+'px';
    board.style.height=dispH+'px';
    zoomLabel.textContent=Math.round(z*100)+'%';
  }
  document.getElementById('zoomIn').addEventListener('click',()=>{ state.zoom=Math.min(4,state.zoom+0.1); applyZoom(); });
  document.getElementById('zoomOut').addEventListener('click',()=>{ state.zoom=Math.max(0.1,state.zoom-0.1); applyZoom(); });
  window.addEventListener('resize',applyZoom);

  // ---------- Keyboard ----------
  window.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT' && e.target.type!=='range') return;
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
    if(e.ctrlKey||e.metaKey) return;
    const map={b:'brush',e:'eraser',l:'line',r:'rect',o:'ellipse',g:'fill',t:'text',i:'eyedropper'};
    if(map[k]) selectTool(map[k]);
  });

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg){
    const t=document.getElementById('toast');
    document.getElementById('toastMsg').textContent=msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
  }

  // ---------- Init ----------
  createCanvas(1000,700,'transparent');
  setStatus();
})();
</script>
</body>
</html>
