<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miniature Solar System</title>
<style>
  :root {
    --panel-bg: rgba(12, 16, 28, 0.72);
    --panel-border: rgba(120, 160, 220, 0.22);
    --text: #d8e2f2;
    --text-dim: #8b9bb8;
    --accent: #7fd0ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04060d;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  #scene { position: fixed; inset: 0; display: block; }

  .hud {
    position: fixed;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    top: 22px;
    left: 26px;
    max-width: 60vw;
  }
  .title h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.6);
  }
  .title p {
    margin: 6px 0 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-dim);
    max-width: 360px;
  }

  .panel {
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  }
  .controls {
    bottom: 22px;
    left: 26px;
    padding: 14px 16px;
    width: 270px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .controls .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
  }
  .controls label { color: var(--text-dim); }
  .controls input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 140px;
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), #33507a);
    outline: none;
  }
  .controls input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #eaf4ff;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .controls input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #eaf4ff;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .controls .btnrow { display: flex; gap: 8px; }
  button.toggle {
    flex: 1;
    pointer-events: auto;
    background: rgba(40, 60, 100, 0.5);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 7px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button.toggle:hover { background: rgba(60, 90, 150, 0.6); }
  button.toggle.active {
    background: rgba(70, 150, 220, 0.45);
    border-color: var(--accent);
  }

  .legend {
    top: 22px;
    right: 26px;
    padding: 12px 14px;
    width: 158px;
    font-size: 11.5px;
  }
  .legend h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .legend ul { margin: 0; padding: 0; list-style: none; }
  .legend li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    cursor: pointer;
    border-radius: 6px;
  }
  .legend li:hover { background: rgba(255,255,255,0.05); }
  .legend li.active { background: rgba(127, 208, 255, 0.12); }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 0 6px currentColor;
  }
  .legend .name { flex: 1; }
  .legend .dist { color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .readout {
    bottom: 22px;
    right: 26px;
    padding: 12px 14px;
    width: 200px;
    font-size: 12px;
    line-height: 1.55;
  }
  .readout .k { color: var(--text-dim); }
  .readout .v { color: var(--text); float: right; font-variant-numeric: tabular-nums; }
  .readout .line { clear: both; margin: 2px 0; }

  #loading {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: #04060d; color: var(--text-dim);
    font-size: 13px; letter-spacing: 0.08em;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 9; color: var(--text-dim); font-size: 11px;
    pointer-events: none; opacity: 0.7;
  }
  @media (max-width: 720px) {
    .legend, .readout { display: none; }
    .title p { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud title">
  <h1>Miniature Solar System</h1>
  <p>Eight planets circle a glowing star. Drag to look around, scroll to zoom, and tune the pace below.</p>
</div>

<div class="hud legend panel">
  <h2>Planets</h2>
  <ul id="legendList"></ul>
</div>

<div class="hud readout panel" id="readout">
  <div class="line"><span class="k">Earth year</span><span class="v" id="rYear">—</span></div>
  <div class="line"><span class="k">Speed</span><span class="v" id="rSpeed">1×</span></div>
  <div class="line"><span class="k">Focus</span><span class="v" id="rFocus">Sun</span></div>
  <div class="line"><span class="k">Orbits</span><span class="v" id="rOrbits">on</span></div>
</div>

<div class="hud controls panel">
  <div class="row">
    <label for="speed">Pace</label>
    <input id="speed" type="range" min="0" max="4" step="0.05" value="1" />
  </div>
  <div class="row">
    <label for="zoom">Zoom</label>
    <input id="zoom" type="range" min="20" max="220" step="1" value="95" />
  </div>
  <div class="btnrow">
    <button class="toggle active" id="btnOrbits">Orbits</button>
    <button class="toggle active" id="btnRotate">Spin</button>
    <button class="toggle" id="btnPause">Pause</button>
  </div>
</div>

<div class="hint">drag · scroll · click a planet</div>
<div id="loading">building the system…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 70, 95);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 18;
controls.maxDistance = 600;
controls.target.set(0, 0, 0);

// ---- Lights ----
const sunLight = new THREE.PointLight(0xfff2d6, 3.2, 0, 1.4);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223044, 0.35));

// ---- Starfield ----
function makeStars(count, radius) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const r = radius * (0.6 + Math.random() * 0.4);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi);
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    const t = Math.random();
    c.setHSL(0.55 + t * 0.1, 0.5, 0.6 + Math.random() * 0.4);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 1.1, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.9 });
  return new THREE.Points(geo, mat);
}
scene.add(makeStars(2600, 1600));

// ---- Sun ----
const sunGroup = new THREE.Group();
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(6.2, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0xffcf66 })
);
sunGroup.add(sun);
// glow shell
const glow = new THREE.Mesh(
  new THREE.SphereGeometry(7.6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffae3a, transparent: true, opacity: 0.22, side: THREE.BackSide })
);
sunGroup.add(glow);
scene.add(sunGroup);

// corona sprite
function makeGlowTexture() {
  const s = 256;
  const cv = document.createElement('canvas'); cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(255,220,140,0.95)');
  g.addColorStop(0.25, 'rgba(255,170,70,0.55)');
  g.addColorStop(0.6, 'rgba(255,120,40,0.18)');
  g.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}
const corona = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
corona.scale.set(34, 34, 1);
sunGroup.add(corona);

// ---- Planets ----
// name, radius, orbit, color, spin, orbitSpeed, tilt, ring?
const PLANETS = [
  { name: 'Mercury', r: 1.0, orbit: 12,  color: 0xa9a09a, spin: 0.004, speed: 1.60, tilt: 0.01 },
  { name: 'Venus',   r: 1.7, orbit: 17,  color: 0xd9a066, spin: 0.002, speed: 1.17, tilt: 0.03 },
  { name: 'Earth',   r: 1.9, orbit: 23,  color: 0x4f8fe0, spin: 0.020, speed: 1.00, tilt: 0.41, moon: true },
  { name: 'Mars',    r: 1.4, orbit: 29,  color: 0xc1543a, spin: 0.018, speed: 0.80, tilt: 0.44 },
  { name: 'Jupiter', r: 4.2, orbit: 40,  color: 0xcaa97a, spin: 0.040, speed: 0.43, tilt: 0.05, bands: true },
  { name: 'Saturn',  r: 3.6, orbit: 52,  color: 0xe2cfa0, spin: 0.038, speed: 0.32, tilt: 0.47, ring: true },
  { name: 'Uranus',  r: 2.7, orbit: 63,  color: 0x9fe0e0, spin: 0.030, speed: 0.23, tilt: 1.70, ring: true, ringColor: 0x9fd0e8 },
  { name: 'Neptune', r: 2.6, orbit: 73,  color: 0x4a6fe0, spin: 0.032, speed: 0.18, tilt: 0.49 },
];

function planetTexture(baseColor, bands) {
  const w = 256, h = 128;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const c = new THREE.Color(baseColor);
  ctx.fillStyle = `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`;
  ctx.fillRect(0, 0, w, h);
  // subtle noise / bands
  for (let i = 0; i < 90; i++) {
    const shade = (Math.random() - 0.5) * 0.28;
    const light = new THREE.Color(baseColor).offsetHSL(0, 0, shade);
    ctx.fillStyle = `rgba(${light.r*255|0},${light.g*255|0},${light.b*255|0},0.5)`;
    if (bands) {
      const y = Math.random() * h;
      ctx.fillRect(0, y, w, 2 + Math.random() * 5);
    } else {
      const x = Math.random() * w, y = Math.random() * h;
      ctx.beginPath(); ctx.arc(x, y, 2 + Math.random() * 8, 0, 7); ctx.fill();
    }
  }
  return new THREE.CanvasTexture(cv);
}

const planetMeshes = [];
const orbitLines = [];

PLANETS.forEach((p, idx) => {
  // orbit pivot rotates around sun
  const pivot = new THREE.Group();
  pivot.rotation.y = Math.random() * Math.PI * 2;
  scene.add(pivot);

  const mat = new THREE.MeshStandardMaterial({
    map: planetTexture(p.color, p.bands),
    roughness: 0.85, metalness: 0.05,
    emissive: new THREE.Color(p.color).multiplyScalar(0.04),
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 48, 48), mat);
  mesh.position.x = p.orbit;
  mesh.rotation.z = p.tilt;
  pivot.add(mesh);

  // ring
  if (p.ring) {
    const ringGeo = new THREE.RingGeometry(p.r * 1.4, p.r * 2.3, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: p.ringColor || 0xcdbb88, side: THREE.DoubleSide,
      transparent: true, opacity: 0.55,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2 - 0.3;
    mesh.add(ring);
  }

  // moon for earth
  if (p.moon) {
    const moonPivot = new THREE.Group();
    mesh.add(moonPivot);
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xcfd2d6, roughness: 1 })
    );
    moon.position.x = p.r + 2.4;
    moonPivot.add(moon);
    p._moonPivot = moonPivot;
  }

  // orbit line
  const seg = 160;
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * p.orbit, 0, Math.sin(a) * p.orbit));
  }
  const og = new THREE.BufferGeometry().setFromPoints(pts);
  const ol = new THREE.LineLoop(og, new THREE.LineBasicMaterial({ color: 0x3a4a66, transparent: true, opacity: 0.5 }));
  scene.add(ol);
  orbitLines.push(ol);

  p._pivot = pivot; p._mesh = mesh;
  planetMeshes.push(mesh);
});

// ---- Interaction state ----
let speedMul = 1;
let spinning = true;
let paused = false;
let showOrbits = true;
let focus = 'Sun';
let simTime = 0;

// legend
const legendList = document.getElementById('legendList');
const items = [{ name: 'Sun', color: '#ffcf66' }].concat(PLANETS.map(p => ({ name: p.name, color: '#' + new THREE.Color(p.color).getHexString() })));
items.forEach((it, i) => {
  const li = document.createElement('li');
  li.dataset.idx = i;
  li.innerHTML = `<span class="dot" style="background:${it.color};color:${it.color}"></span><span class="name">${it.name}</span>`;
  li.addEventListener('click', () => focusOn(i));
  legendList.appendChild(li);
});

function focusOn(idx) {
  focus = idx === 0 ? 'Sun' : PLANETS[idx - 1].name;
  document.getElementById('rFocus').textContent = focus;
  [...legendList.children].forEach((li, j) => li.classList.toggle('active', j === idx));
}

// pick planet by click
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;
canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return; // drag, not click
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects([sun, ...planetMeshes], false);
  if (hits.length) {
    const obj = hits[0].object;
    if (obj === sun) focusOn(0);
    else {
      const idx = planetMeshes.indexOf(obj) + 1;
      focusOn(idx);
    }
  }
});

// controls UI
const speedEl = document.getElementById('speed');
const zoomEl = document.getElementById('zoom');
const btnOrbits = document.getElementById('btnOrbits');
const btnRotate = document.getElementById('btnRotate');
const btnPause = document.getElementById('btnPause');

speedEl.addEventListener('input', () => {
  speedMul = parseFloat(speedEl.value);
  document.getElementById('rSpeed').textContent = speedMul.toFixed(2) + '×';
});
zoomEl.addEventListener('input', () => {
  const d = parseFloat(zoomEl.value);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).add(dir.multiplyScalar(d));
});
btnOrbits.addEventListener('click', () => {
  showOrbits = !showOrbits;
  orbitLines.forEach(o => o.visible = showOrbits);
  btnOrbits.classList.toggle('active', showOrbits);
  document.getElementById('rOrbits').textContent = showOrbits ? 'on' : 'off';
});
btnRotate.addEventListener('click', () => {
  spinning = !spinning;
  btnRotate.classList.toggle('active', spinning);
});
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.classList.toggle('active', paused);
  btnPause.textContent = paused ? 'Play' : 'Pause';
});

// readout
const rYear = document.getElementById('rYear');

// ---- Resize ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- Animate ----
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let focusTarget = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    simTime += dt * speedMul;
    sun.rotation.y += dt * 0.05 * (spinning ? 1 : 0);
    corona.material.rotation += dt * 0.02;
    PLANETS.forEach(p => {
      p._pivot.rotation.y += dt * p.speed * speedMul * 0.18;
      if (spinning) p._mesh.rotation.y += p.spin * (0.4 + speedMul);
      if (p._moonPivot) p._moonPivot.rotation.y += dt * speedMul * 0.9;
    });
  }

  // focus follow
  if (focus !== 'Sun') {
    const p = PLANETS.find(x => x.name === focus);
    if (p) {
      p._mesh.getWorldPosition(tmp);
      focusTarget.copy(tmp);
    }
  } else {
    focusTarget.set(0, 0, 0);
  }

  controls.update();
  renderer.render(scene, camera);
}

// Earth-year readout (1 earth orbit = base)
let baseRate = PLANETS.find(p => p.name === 'Earth').speed * 0.18;
setInterval(() => {
  const years = (simTime * baseRate) / (PLANETS.find(p => p.name === 'Earth').speed * 0.18);
  rYear.textContent = years.toFixed(1);
}, 200);

animate();
document.getElementById('loading').classList.add('hidden');
</script>
</body>
</html>
