<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aldermere — A Living Procedural Medieval City</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0e1a; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; top: 14px; color: #f3e9d2; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.7); user-select: none;
  }
  #hud .title { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  #hud .title small { font-weight: 400; opacity: .75; font-size: 13px; }
  #hud .clock { font-size: 14px; margin-top: 4px; opacity: .9; }
  #hud .hint { font-size: 12px; margin-top: 10px; opacity: .6; max-width: 280px; line-height: 1.45; }
  #panel {
    position: fixed; right: 14px; top: 14px; color: #f3e9d2;
    background: rgba(20,16,28,.55); border: 1px solid rgba(243,233,210,.18);
    border-radius: 10px; padding: 10px 12px; font-size: 12px; backdrop-filter: blur(4px);
    user-select: none; width: 200px;
  }
  #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; cursor: pointer; }
  #panel input[type=range] { width: 100px; }
  #panel .row { margin: 8px 0; }
  #panel button {
    background: #6b4a2f; color: #f3e9d2; border: 1px solid #8a6a45; border-radius: 6px;
    padding: 5px 8px; font-size: 12px; cursor: pointer; width: 100%;
  }
  #panel button:hover { background: #7d5836; }
  #loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #d9c7a0; font-size: 18px; letter-spacing: 2px; background: #0a0e1a; z-index: 10;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="loader">RAISING THE CITY…</div>
<div id="hud">
  <div class="title">ALDERMERE <small>· procedurally raised</small></div>
  <div class="clock" id="clock">— dawn —</div>
  <div class="hint">Drag to orbit · scroll to zoom · right‑drag to pan. The city breathes on its own: smoke rises, torches flicker, villagers walk the lanes, and the sun wheels overhead.</div>
</div>
<div id="panel">
  <div class="row"><label>Time of day <input id="time" type="range" min="0" max="1000" value="250"></label></div>
  <div class="row"><label>Auto cycle <input id="auto" type="checkbox" checked></label></div>
  <div class="row"><label>Villagers <input id="folk" type="checkbox" checked></label></div>
  <div class="row"><label>Smoke <input id="smoke" type="checkbox" checked></label></div>
  <div class="row"><button id="regen">Rebuild the city</button></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) { document.getElementById('loader').textContent = 'Failed to load Three.js (offline?)'; return; }

  // ---------- core ----------
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x9fb0c8, 160, 520);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);

  // ---------- sky dome ----------
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor:    { value: new THREE.Color(0x1a2747) },
      bottomColor: { value: new THREE.Color(0x2a3a5c) },
      sunColor:    { value: new THREE.Color(0xffd9a0) },
      sunPos:      { value: new THREE.Vector3(0, 1, 0) }
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vDir = normalize(wp.xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 topColor; uniform vec3 bottomColor; uniform vec3 sunColor; uniform vec3 sunPos;
      void main(){
        float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(bottomColor, topColor, pow(h, 0.55));
        float s = max(dot(vDir, normalize(sunPos)), 0.0);
        col += sunColor * pow(s, 6.0) * 0.55;
        col += sunColor * pow(s, 220.0) * 1.6;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);
  scene.add(sky);

  // ---------- lights ----------
  const hemi = new THREE.HemisphereLight(0xbcd2ff, 0x4a4030, 0.55);
  scene.add(hemi);
  const ambient = new THREE.AmbientLight(0xffffff, 0.18);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff0d8, 1.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 600;
  sun.shadow.camera.left = -160; sun.shadow.camera.right = 160;
  sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -160;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  scene.add(sun.target);

  // sun disc
  const sunDisc = new THREE.Mesh(
    new THREE.SphereGeometry(22, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xffe7b0, fog: false })
  );
  scene.add(sunDisc);

  // ---------- stars ----------
  const starGeo = new THREE.BufferGeometry();
  const starCount = 1200;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(800);
    if (v.y < 0) v.y = -v.y; // upper hemisphere
    starPos[i*3] = v.x; starPos[i*3+1] = v.y + 40; starPos[i*3+2] = v.z;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0, fog: false });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // ---------- soft sprite textures ----------
  function softCircle() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.4, 'rgba(255,255,255,0.6)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const smokeTex = softCircle();

  function cobbleTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#8d8576'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 1400; i++) {
      const x = Math.random()*256, y = Math.random()*256, r = 1.5 + Math.random()*3;
      const v = 110 + Math.random()*60 | 0;
      g.fillStyle = `rgb(${v},${v-8},${v-22})`;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 14);
    return t;
  }

  // ---------- materials ----------
  const WALL_COLORS = [0xcdb892, 0xb89a72, 0xd8c6a3, 0xa9855c, 0xc2a878, 0x9c7e58];
  const ROOF_COLORS = [0x7a3526, 0x5d4a33, 0x6f6a63, 0x3c5a46, 0x824a2c, 0x4a3b52];

  const cityGroup = new THREE.Group();
  scene.add(cityGroup);

  const chimneySources = [];
  const chimneyMeshes = [];
  const windowMat = new THREE.MeshStandardMaterial({
    color: 0x2a2330, emissive: 0xffb24d, emissiveIntensity: 0.0,
    roughness: 0.6, metalness: 0.0
  });
  const torchMats = []; // emissive spheres toggled at night

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function makeRoof(w, d, h, color, segs) {
    const s = Math.max(w, d) * 1.06;
    const r = s * 0.82;
    const seg = segs || 4;
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(r, h, seg),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.85 })
    );
    if (seg === 4) roof.rotation.y = Math.PI / 4;
    roof.position.y = h / 2;
    roof.castShadow = true;
    return roof;
  }

  function addWindows(group, w, d, h, facing) {
    // a small glowing window on the facing side
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.0), windowMat);
    win.material = windowMat;
    const off = 0.05;
    if (facing === 'z+') { win.position.set(rnd(-w*0.2,w*0.2), h*0.55, d/2 + off); }
    else if (facing === 'z-') { win.position.set(rnd(-w*0.2,w*0.2), h*0.55, -d/2 - off); win.rotation.y = Math.PI; }
    else if (facing === 'x+') { win.position.set(w/2 + off, h*0.55, rnd(-d*0.2,d*0.2)); win.rotation.y = Math.PI/2; }
    else { win.position.set(-w/2 - off, h*0.55, rnd(-d*0.2,d*0.2)); win.rotation.y = -Math.PI/2; }
    group.add(win);
  }

  function house(x, z, opts) {
    opts = opts || {};
    const w = opts.w || rnd(6, 11), d = opts.d || rnd(6, 11), h = opts.h || rnd(5, 12);
    const g = new THREE.Group();
    const wallCol = opts.wall || pick(WALL_COLORS);
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: wallCol, roughness: 0.92 })
    );
    body.position.y = h / 2; body.castShadow = true; body.receiveShadow = true;
    g.add(body);

    // timber frame strip (dark) for medieval look
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 1 });
    const band = new THREE.Mesh(new THREE.BoxGeometry(w*1.005, 0.5, d*1.005), frameMat);
    band.position.y = h * 0.55; g.add(band);

    const roof = makeRoof(w, d, rnd(h*0.5, h*0.8), opts.roof || pick(ROOF_COLORS), 4);
    roof.position.y = h; g.add(roof);

    // windows
    const f = pick(['z+', 'z-', 'x+', 'x-']);
    addWindows(g, w, d, h, f);
    if (Math.random() < 0.5) addWindows(g, w, d, h, pick(['z+','z-','x+','x-']));

    // chimney + smoke source
    if (Math.random() < 0.55) {
      const ch = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 2.2, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x5a5048, roughness: 1 })
      );
      ch.position.set(rnd(-w*0.3, w*0.3), h + roof.geometry.parameters.height*0.35, rnd(-d*0.3, d*0.3));
      ch.castShadow = true; g.add(ch);
      if (chimneyMeshes.length < 70) chimneyMeshes.push(ch);
    }

    g.position.set(x, 0, z);
    g.rotation.y = (Math.random() < 0.5 ? 0 : Math.PI / 2);
    cityGroup.add(g);
    return g;
  }

  function roundTower(x, z, r, h, roofColor, withRoof) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r*1.06, h, 16),
      new THREE.MeshStandardMaterial({ color: 0x9a8c78, roughness: 0.95 })
    );
    body.position.y = h/2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    // merlons
    const merlonMat = new THREE.MeshStandardMaterial({ color: 0x827566, roughness: 1 });
    for (let i = 0; i < 12; i++) {
      const a = (i/12)*Math.PI*2;
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 1.1), merlonMat);
      m.position.set(Math.cos(a)*r, h + 0.7, Math.sin(a)*r); g.add(m);
    }
    if (withRoof) {
      const roof = makeRoof(r*2, r*2, r*2.2, roofColor, 10);
      roof.position.y = h + 1.4; g.add(roof);
    }
    g.position.set(x, 0, z);
    cityGroup.add(g);
    return g;
  }

  function merlonRing(w, d, topY) {
    const grp = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x7d6f5e, roughness: 1 });
    const step = 4, ht = 1.6, th = 1.4;
    for (let xx = -w/2; xx <= w/2; xx += step) {
      if (((xx + w/2) % (step*2)) >= step) continue;
      const m1 = new THREE.Mesh(new THREE.BoxGeometry(th, ht, th), mat); m1.position.set(xx, topY+ht/2, d/2); grp.add(m1);
      const m2 = m1.clone(); m2.position.z = -d/2; grp.add(m2);
    }
    for (let zz = -d/2; zz <= d/2; zz += step) {
      if (((zz + d/2) % (step*2)) >= step) continue;
      const m1 = new THREE.Mesh(new THREE.BoxGeometry(th, ht, th), mat); m1.position.set(w/2, topY+ht/2, zz); grp.add(m1);
      const m2 = m1.clone(); m2.position.x = -w/2; grp.add(m2);
    }
    return grp;
  }

  // ---------- castle ----------
  function buildCastle(cx, cz) {
    const g = new THREE.Group();
    cityGroup.add(g);
    const stone = new THREE.MeshStandardMaterial({ color: 0xb3a48c, roughness: 0.95 });

    // curtain walls (square ring ~ 46)
    const half = 26, wallH = 12, t = 3;
    function wall(px, pz, ww, dd) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(ww, wallH, dd), stone);
      m.position.set(px, wallH/2, pz); m.castShadow = true; m.receiveShadow = true; g.add(m);
      const mr = merlonRing(ww, dd, wallH); mr.position.set(px, 0, pz); g.add(mr);
    }
    wall(0, -half, half*2 + t, t);
    wall(0,  half, half*2 + t, t);
    wall(-half, 0, t, half*2);
    wall( half, 0, t, half*2);

    // corner round towers
    roundTower(-half, -half, 4, 18, 0x7a3526, true);
    roundTower( half, -half, 4, 18, 0x7a3526, true);
    roundTower(-half,  half, 4, 18, 0x7a3526, true);
    roundTower( half,  half, 4, 18, 0x7a3526, true);
    // gate towers (front, +z)
    roundTower(-7, half, 3.5, 16, 0x6f6a63, true);
    roundTower( 7, half, 3.5, 16, 0x6f6a63, true);

    // keep (central tall tower)
    const keepH = 34;
    const keep = new THREE.Mesh(new THREE.BoxGeometry(14, keepH, 14), stone);
    keep.position.set(0, keepH/2, -4); keep.castShadow = true; keep.receiveShadow = true; g.add(keep);
    const km = merlonRing(14, 14, keepH); km.position.set(0, 0, -4); g.add(km);
    const keepRoof = makeRoof(14, 14, 12, 0x5d4a33, 8); keepRoof.position.set(0, keepH + 6, -4); g.add(keepRoof);
    // keep flag
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,8,6), new THREE.MeshStandardMaterial({color:0x333333}));
    pole.position.set(0, keepH + 4, -4); g.add(pole);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(5,3), new THREE.MeshStandardMaterial({color:0xb23b2e, side:THREE.DoubleSide, roughness:1}));
    flag.position.set(2.6, keepH + 6.5, -4); flag.userData.flag = true; g.add(flag);

    // great hall
    const hall = new THREE.Mesh(new THREE.BoxGeometry(20, 9, 10), new THREE.MeshStandardMaterial({color:0xc2a878, roughness:0.9}));
    hall.position.set(0, 4.5, 12); hall.castShadow = true; hall.receiveShadow = true; g.add(hall);
    const hallRoof = makeRoof(20,10,6,0x7a3526,4); hallRoof.position.set(0,9,12); g.add(hallRoof);

    // chapel with spire
    const chapel = new THREE.Mesh(new THREE.BoxGeometry(8,8,12), new THREE.MeshStandardMaterial({color:0xd8c6a3, roughness:0.9}));
    chapel.position.set(-14, 4, 14); chapel.castShadow = true; chapel.receiveShadow = true; g.add(chapel);
    const spire = new THREE.Mesh(new THREE.ConeGeometry(5.5, 20, 8), new THREE.MeshStandardMaterial({color:0x4a3b52, roughness:0.8}));
    spire.position.set(-14, 18, 14); spire.castShadow = true; g.add(spire);

    g.position.set(cx, 0, cz);
    castleFlags.push(flag);
    return g;
  }
  const castleFlags = [];

  // ---------- cathedral (town center) ----------
  function buildCathedral(x, z) {
    const g = new THREE.Group();
    const stone = new THREE.MeshStandardMaterial({ color: 0xe3d8bf, roughness: 0.9 });
    const nave = new THREE.Mesh(new THREE.BoxGeometry(14, 16, 30), stone);
    nave.position.y = 8; nave.castShadow = true; nave.receiveShadow = true; g.add(nave);
    const transept = new THREE.Mesh(new THREE.BoxGeometry(30, 13, 12), stone);
    transept.position.y = 6.5; transept.castShadow = true; transept.receiveShadow = true; g.add(transept);
    // central spire
    const spire = new THREE.Mesh(new THREE.ConeGeometry(6, 34, 8), new THREE.MeshStandardMaterial({color:0x55504a, roughness:0.8}));
    spire.position.y = 16 + 17; spire.castShadow = true; g.add(spire);
    // two side spires
    [-12, 12].forEach(sx => {
      const s = new THREE.Mesh(new THREE.ConeGeometry(3.4, 20, 8), new THREE.MeshStandardMaterial({color:0x55504a, roughness:0.85}));
      s.position.set(sx, 13 + 10, 0); s.castShadow = true; g.add(s);
      const tw = new THREE.Mesh(new THREE.BoxGeometry(5,13,5), stone); tw.position.set(sx, 6.5, 0); tw.castShadow=true; g.add(tw);
    });
    // glowing windows (rose) – emissive
    const rose = new THREE.Mesh(new THREE.CircleGeometry(3.4, 16), windowMat);
    rose.position.set(0, 12, 15.05); g.add(rose);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(4, 7), new THREE.MeshStandardMaterial({color:0x2a1d12, roughness:1}));
    door.position.set(0, 3.5, 15.05); g.add(door);
    g.position.set(x, 0, z);
    cityGroup.add(g);
    return g;
  }

  // ---------- market stalls ----------
  function stall(x, z) {
    const g = new THREE.Group();
    const counter = new THREE.Mesh(new THREE.BoxGeometry(4, 1.6, 2.4), new THREE.MeshStandardMaterial({color:0x6e4a2c, roughness:1}));
    counter.position.y = 0.8; counter.castShadow = true; g.add(counter);
    const postMat = new THREE.MeshStandardMaterial({color:0x4a3320});
    [-1.8,1.8].forEach(px => { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,3,6), postMat); p.position.set(px,2.2,0); g.add(p); });
    const canopy = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.3, 3), new THREE.MeshStandardMaterial({color: pick([0xb23b2e,0x3c5a46,0xc9a227]), roughness:1}));
    canopy.position.y = 3.6; canopy.castShadow = true; g.add(canopy);
    g.position.set(x, 0, z); g.rotation.y = rnd(0, 6.28);
    cityGroup.add(g);
  }

  // ---------- city walls ----------
  function buildCityWalls() {
    const g = new THREE.Group();
    const W = 92, t = 4, H = 11;
    const mat = new THREE.MeshStandardMaterial({ color: 0x8f8268, roughness: 0.96 });
    function seg(px,pz,ww,dd){
      const m = new THREE.Mesh(new THREE.BoxGeometry(ww,H,dd), mat);
      m.position.set(px,H/2,pz); m.castShadow=true; m.receiveShadow=true; g.add(m);
      const mr = merlonRing(ww, dd, H); mr.position.set(px, 0, pz); g.add(mr);
    }
    const gate = 14;
    // north & south with gate gap
    seg(0, -W, W*2, t);
    seg(-(W/2+gate/2), W, W-gate, t);
    seg( (W/2+gate/2), W, W-gate, t);
    seg(-W, 0, t, W*2);
    seg( W, 0, t, W*2);
    // gate towers + torches
    [-gate/2-3, gate/2+3].forEach(tx => {
      const tw = roundTower(tx, W, 3.2, 17, 0x6f6a63, true);
      // torch
      addTorch(tx, 10, W + 3.4);
    });
    // corner towers
    [[-W,-W],[W,-W],[-W,W],[W,W]].forEach(p => roundTower(p[0],p[1],3.6,18,0x7a3526,true));
    cityGroup.add(g);
  }
  function addTorch(x, y, z) {
    const grp = new THREE.Group();
    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,0.6,8), new THREE.MeshStandardMaterial({color:0x222}));
    bowl.position.y = 0; grp.add(bowl);
    const flame = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({color:0xffaa33}));
    flame.position.y = 0.7; grp.add(flame);
    const light = new THREE.PointLight(0xffa030, 1.2, 26, 2);
    light.position.y = 0.9; grp.add(light);
    grp.position.set(x, y, z);
    cityGroup.add(grp);
    torchMats.push({flame, light});
  }

  // ---------- ground ----------
  function buildGround() {
    const grass = new THREE.Mesh(
      new THREE.CircleGeometry(900, 48),
      new THREE.MeshStandardMaterial({ color: 0x4e6b3a, roughness: 1 })
    );
    grass.rotation.x = -Math.PI/2; grass.position.y = -0.05; grass.receiveShadow = true;
    scene.add(grass);

    const inner = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ map: cobbleTexture(), color: 0x9a948a, roughness: 1 })
    );
    inner.rotation.x = -Math.PI/2; inner.position.y = 0.02; inner.receiveShadow = true;
    scene.add(inner);
  }

  // ---------- villagers ----------
  let villagers = [];
  const folkGroup = new THREE.Group();
  scene.add(folkGroup);
  const tunics = [0x9c3b2e,0x2c5a7a,0x4a7a3c,0x7a6a2c,0x6a3c6a,0x8a5a2c];

  function makeVillager() {
    const g = new THREE.Group();
    const tunic = pick(tunics);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.6, 8), new THREE.MeshStandardMaterial({color: tunic, roughness: 1}));
    body.position.y = 1.2; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 10), new THREE.MeshStandardMaterial({color: 0xd9b08a, roughness: 1}));
    head.position.y = 2.25; head.castShadow = true; g.add(head);
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.5, 8), new THREE.MeshStandardMaterial({color: 0x5a4632, roughness:1}));
    hat.position.y = 2.6; g.add(hat);
    return g;
  }

  function buildPaths() {
    // axis-aligned rectangular loops on the street grid
    const lines = [];
    for (let v = -80; v <= 80; v += 16) lines.push(v);
    const paths = [];
    const set = [[-64,-32,64,32],[-64,32,64,-32],[-32,-64,32,64],[-48,48,48,-48]];
    set.forEach(r => {
      const [x0,z0,x1,z1] = r;
      paths.push([ new THREE.Vector3(x0,0,z0), new THREE.Vector3(x1,0,z0), new THREE.Vector3(x1,0,z1), new THREE.Vector3(x0,0,z1) ]);
    });
    return paths;
  }

  function spawnVillagers(n) {
    while (folkGroup.children.length) folkGroup.remove(folkGroup.children[0]);
    villagers = [];
    const paths = buildPaths();
    for (let i = 0; i < n; i++) {
      const v = makeVillager();
      const path = paths[i % paths.length];
      const start = Math.random() * path.length | 0;
      const t = Math.random();
      v.userData = { path, seg: start, t, speed: rnd(0.04, 0.09), phase: Math.random()*6.28 };
      folkGroup.add(v);
      villagers.push(v);
    }
  }

  function updateVillagers(dt) {
    for (const v of villagers) {
      const u = v.userData;
      const a = u.path[u.seg];
      const b = u.path[(u.seg + 1) % u.path.length];
      u.t += dt * u.speed;
      if (u.t >= 1) { u.t -= 1; u.seg = (u.seg + 1) % u.path.length; }
      const p = a.clone().lerp(b, u.t);
      const prev = v.position.clone();
      v.position.set(p.x, 0, p.z);
      v.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
      // little bob
      v.position.y = Math.abs(Math.sin(performance.now()*0.005 + u.phase)) * 0.12;
    }
  }

  // ---------- smoke ----------
  const SMOKE_MAX = 900;
  const smokeGeo = new THREE.BufferGeometry();
  const smokePos = new Float32Array(SMOKE_MAX * 3);
  const smokeAlpha = new Float32Array(SMOKE_MAX);
  const smokeSize = new Float32Array(SMOKE_MAX);
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
  smokeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(smokeAlpha, 1));
  smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(smokeSize, 1));
  const smokeMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: true,
    uniforms: { map: { value: smokeTex }, color: { value: new THREE.Color(0xcfc9c0) } },
    vertexShader: `
      attribute float aAlpha; attribute float aSize; varying float vA;
      void main(){ vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = aSize * (320.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `
      uniform sampler2D map; uniform vec3 color; varying float vA;
      void main(){ vec4 t = texture2D(map, gl_PointCoord); gl_FragColor = vec4(color, t.a * vA); }`
  });
  const smokePoints = new THREE.Points(smokeGeo, smokeMat);
  smokePoints.frustumCulled = false;
  scene.add(smokePoints);
  const smokeP = [];
  for (let i = 0; i < SMOKE_MAX; i++) smokeP.push({ active: false, x:0,y:0,z:0, vx:0,vy:0,vz:0, age:0, life:1, size:1 });

  function spawnSmoke() {
    if (!smokeOn) return;
    if (!chimneySources.length) return;
    const perFrame = 3;
    for (let k = 0; k < perFrame; k++) {
      const s = chimneySources[(Math.random() * chimneySources.length) | 0];
      let slot = -1;
      for (let i = 0; i < SMOKE_MAX; i++) if (!smokeP[i].active) { slot = i; break; }
      if (slot < 0) return;
      const p = smokeP[slot];
      p.active = true; p.x = s.x + rnd(-0.3,0.3); p.y = s.y; p.z = s.z + rnd(-0.3,0.3);
      p.vx = rnd(-0.15,0.15); p.vy = rnd(1.1,1.8); p.vz = rnd(-0.15,0.15);
      p.age = 0; p.life = rnd(3.5, 6.0); p.size = rnd(2, 4);
    }
  }
  function updateSmoke(dt) {
    for (let i = 0; i < SMOKE_MAX; i++) {
      const p = smokeP[i];
      if (p.active) {
        p.age += dt;
        if (p.age >= p.life) { p.active = false; smokeAlpha[i] = 0; continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.vy *= 0.992; p.size += dt * 1.4;
        smokePos[i*3] = p.x; smokePos[i*3+1] = p.y; smokePos[i*3+2] = p.z;
        const f = p.age / p.life;
        smokeAlpha[i] = Math.sin(f * Math.PI) * 0.5;
        smokeSize[i] = p.size;
      } else {
        smokeAlpha[i] = 0; smokePos[i*3+1] = -999;
      }
    }
    smokeGeo.attributes.position.needsUpdate = true;
    smokeGeo.attributes.aAlpha.needsUpdate = true;
    smokeGeo.attributes.aSize.needsUpdate = true;
  }

  // ---------- clouds & birds ----------
  const clouds = [];
  function buildClouds() {
    const tex = softCircle();
    for (let i = 0; i < 14; i++) {
      const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false, fog: false }));
      const s = rnd(40, 90); m.scale.set(s, s*0.55, 1);
      m.position.set(rnd(-400,400), rnd(120, 280), rnd(-400,400));
      scene.add(m); clouds.push({ s: m, spd: rnd(2, 6) });
    }
  }
  const birds = [];
  function buildBirds() {
    const mat = new THREE.MeshBasicMaterial({ color: 0x222018, side: THREE.DoubleSide, fog: false });
    for (let i = 0; i < 10; i++) {
      const g = new THREE.Group();
      const w1 = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.4), mat); w1.position.x = -1.2;
      const w2 = w1.clone(); w2.position.x = 1.2; w2.rotation.y = Math.PI;
      g.add(w1); g.add(w2);
      g.position.set(rnd(-200,200), rnd(60,140), rnd(-200,200));
      g.userData = { w1, w2, a: rnd(0,6), spd: rnd(8,16), rad: rnd(40,120), cx: rnd(-120,120), cz: rnd(-120,120), h: rnd(60,140) };
      scene.add(g); birds.push(g);
    }
  }
  function updateBirds(dt, time) {
    for (const b of birds) {
      const u = b.userData; u.a += dt * u.spd * 0.05;
      b.position.x = u.cx + Math.cos(u.a) * u.rad;
      b.position.z = u.cz + Math.sin(u.a) * u.rad;
      b.position.y = u.h + Math.sin(time*0.5 + u.a) * 6;
      b.rotation.y = -u.a + Math.PI/2;
      const flap = Math.sin(time*8 + u.a) * 0.5;
      u.w1.rotation.z = flap; u.w2.rotation.z = -flap;
    }
  }

  // ---------- build everything ----------
  let smokeOn = true, folkOn = true;
  function buildCity() {
    while (cityGroup.children.length) cityGroup.remove(cityGroup.children[0]);
    chimneySources.length = 0; chimneyMeshes.length = 0; torchMats.length = 0; castleFlags.length = 0;
    buildGround();
    buildCityWalls();
    buildCastle(0, -34);
    buildCathedral(0, 18);
    // houses on jittered grid
    const cell = 16;
    for (let gx = -74; gx <= 74; gx += cell) {
      for (let gz = -74; gz <= 74; gz += cell) {
        const dC = Math.hypot(gx - 0, gz - (-34));
        const dCat = Math.hypot(gx - 0, gz - 18);
        if (dC < 34 || dCat < 22) continue;            // keep clear of castle & cathedral
        if (Math.abs(gx) > 86 || Math.abs(gz) > 86) continue;
        if (Math.random() < 0.16) continue;            // open plazas / lanes
        const jx = gx + rnd(-3, 3), jz = gz + rnd(-3, 3);
        house(jx, jz, {});
      }
    }
    // market stalls in the central plaza (south of cathedral)
    for (let i = 0; i < 10; i++) stall(rnd(-30,30), rnd(34, 60));
    spawnVillagers(34);
    cityGroup.updateMatrixWorld(true);
    const tmpV = new THREE.Vector3();
    for (const ch of chimneyMeshes) { ch.getWorldPosition(tmpV); chimneySources.push(tmpV.clone().add(new THREE.Vector3(0, 1.2, 0))); }
  }

  buildClouds();
  buildBirds();
  buildCity();

  // ---------- day/night ----------
  const DAY_LENGTH = 140; // seconds for full cycle
  let dayT = 0.25; // start at morning
  const clockEl = document.getElementById('clock');
  const cNightTop = new THREE.Color(0x05060f);
  const cNightBot = new THREE.Color(0x0a1024);
  const cDayTop = new THREE.Color(0x2b5ea8);
  const cDayBot = new THREE.Color(0xbcd0ec);
  const cDuskTop = new THREE.Color(0x35506e);
  const cDuskBot = new THREE.Color(0xe89a5a);
  const sunDayCol = new THREE.Color(0xfff2d6);
  const sunDuskCol = new THREE.Color(0xff9a4d);

  function updateSky() {
    const t = dayT * Math.PI * 2;
    const sx = Math.cos(t), sy = Math.sin(t), sz = 0.35;
    const dir = new THREE.Vector3(sx, sy, sz).normalize();
    sun.position.copy(dir).multiplyScalar(220);
    sunDisc.position.copy(dir).multiplyScalar(820);
    skyMat.uniforms.sunPos.value.copy(dir);

    const dayF = Math.max(0, Math.min(1, sy * 1.4 + 0.18));
    const horizon = Math.max(0, 1 - Math.abs(sy) * 3.2); // glow near sunrise/sunset

    const top = cNightTop.clone().lerp(cDayTop, dayF);
    const bot = cNightBot.clone().lerp(cDayBot, dayF);
    top.lerp(cDuskTop, horizon * 0.6);
    bot.lerp(cDuskBot, horizon * 0.7);
    skyMat.uniforms.topColor.value.copy(top);
    skyMat.uniforms.bottomColor.value.copy(bot);
    skyMat.uniforms.sunColor.value.copy(sunDayCol.clone().lerp(sunDuskCol, horizon));

    scene.fog.color.copy(bot);
    sun.intensity = Math.max(0.04, sy) * 1.15 + 0.04;
    sun.color.copy(sunDayCol.clone().lerp(sunDuskCol, horizon));
    hemi.intensity = 0.12 + dayF * 0.55;
    ambient.intensity = 0.06 + dayF * 0.16;

    starMat.opacity = Math.max(0, 1 - dayF * 1.6);
    windowMat.emissiveIntensity = (1 - dayF) * 1.1;

    // clock label
    let label;
    if (sy > 0.5) label = 'midday';
    else if (sy > 0.05) label = (t < Math.PI) ? 'morning' : 'afternoon';
    else if (sy > -0.15) label = (t < Math.PI) ? 'dawn' : 'dusk';
    else label = 'deep night';
    clockEl.textContent = '— ' + label + ' —';
  }

  // ---------- camera controls (custom orbit) ----------
  const target = new THREE.Vector3(0, 6, 0);
  let radius = 150, theta = Math.PI * 0.25, phi = Math.PI * 0.36;
  let dragging = false, panning = false, lastX = 0, lastY = 0, idleRot = true;
  const dom = renderer.domElement;
  dom.addEventListener('mousedown', e => {
    if (e.button === 2 || e.shiftKey) { panning = true; } else { dragging = true; idleRot = false; }
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { dragging = false; panning = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging && !panning) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    if (dragging) { theta -= dx * 0.005; phi = Math.max(0.12, Math.min(1.45, phi - dy * 0.005)); }
    else if (panning) {
      const f = new THREE.Vector3(); camera.getWorldDirection(f);
      const right = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0,1,0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, f).normalize();
      target.addScaledVector(right, -dx * radius * 0.0014);
      target.addScaledVector(up, dy * radius * 0.0014);
    }
  });
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    radius = Math.max(40, Math.min(360, radius + e.deltaY * 0.12));
  }, { passive: false });
  dom.addEventListener('contextmenu', e => e.preventDefault());
  // touch
  let touchMode = 0, tLastX=0, tLastY=0;
  dom.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { touchMode=1; tLastX=e.touches[0].clientX; tLastY=e.touches[0].clientY; idleRot=false; }
    else if (e.touches.length===2){ touchMode=2; }
  });
  dom.addEventListener('touchmove', e => {
    if (touchMode===1 && e.touches.length===1){
      const dx=e.touches[0].clientX-tLastX, dy=e.touches[0].clientY-tLastY;
      theta-=dx*0.006; phi=Math.max(0.12,Math.min(1.45,phi-dy*0.006));
      tLastX=e.touches[0].clientX; tLastY=e.touches[0].clientY;
    }
  }, {passive:true});
  dom.addEventListener('touchend', ()=>{touchMode=0;});

  function updateCamera() {
    if (idleRot) theta += 0.0009;
    const sp = Math.sin(phi);
    camera.position.set(
      target.x + radius * sp * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * sp * Math.cos(theta)
    );
    camera.lookAt(target);
  }

  // ---------- UI ----------
  const timeSlider = document.getElementById('time');
  const autoChk = document.getElementById('auto');
  const folkChk = document.getElementById('folk');
  const smokeChk = document.getElementById('smoke');
  timeSlider.addEventListener('input', () => { dayT = timeSlider.value / 1000; autoChk.checked = false; });
  autoChk.addEventListener('change', () => { if (autoChk.checked) dayT = parseFloat(timeSlider.value)/1000; });
  folkChk.addEventListener('change', () => { folkOn = folkChk.checked; folkGroup.visible = folkOn; });
  smokeChk.addEventListener('change', () => { smokeOn = smokeChk.checked; smokePoints.visible = smokeOn; });
  document.getElementById('regen').addEventListener('click', () => { buildCity(); });

  // ---------- loop ----------
  const clock = new THREE.Clock();
  document.getElementById('loader').style.display = 'none';

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    const time = clock.elapsedTime;

    if (autoChk.checked) {
      dayT = (dayT + dt / DAY_LENGTH) % 1;
      timeSlider.value = Math.round(dayT * 1000);
    }
    updateSky();

    // torches flicker
    for (const t of torchMats) {
      const f = 0.7 + Math.random() * 0.6;
      t.flame.scale.setScalar(0.8 + Math.random()*0.4);
      t.light.intensity = 0.9 * f + (1 - (windowMat.emissiveIntensity)) * 0.0;
    }
    // flags wave
    for (const fl of castleFlags) fl.rotation.y = Math.sin(time*3) * 0.25;

    if (folkOn) updateVillagers(dt);
    if (smokeOn) { spawnSmoke(); updateSmoke(dt); }

    // clouds
    for (const c of clouds) { c.s.position.x += c.spd * dt; if (c.s.position.x > 460) c.s.position.x = -460; }
    updateBirds(dt, time);

    updateCamera();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
