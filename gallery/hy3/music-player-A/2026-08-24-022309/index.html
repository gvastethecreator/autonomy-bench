<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Player</title>
<style>
  :root{
    --bg:#0e0b1a;
    --panel:#171327;
    --panel-2:#1f1833;
    --accent:#8b5cf6;
    --accent-2:#ec4899;
    --text:#f4f1ff;
    --muted:#9a90bd;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#2a1d4d 0%,transparent 60%),
               radial-gradient(900px 500px at -10% 110%,#3b1736 0%,transparent 55%),
               var(--bg);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .desktop{
    width:880px;max-width:100%;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
  }
  .titlebar{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;
    background:rgba(255,255,255,.03);
    border-bottom:1px solid var(--line);
  }
  .dots{display:flex;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .title{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .body{display:flex;gap:0}
  @media(max-width:760px){.body{flex-direction:column}}

  /* Now playing */
  .now{
    flex:1.3;padding:28px;display:flex;flex-direction:column;gap:22px;
  }
  .art-wrap{display:flex;justify-content:center}
  .art{
    position:relative;width:230px;height:230px;border-radius:20px;
    background:conic-gradient(from 140deg,#8b5cf6,#ec4899,#38bdf8,#8b5cf6);
    box-shadow:0 24px 60px rgba(139,92,246,.35);
    display:flex;align-items:center;justify-content:center;
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .art::after{
    content:"";position:absolute;inset:14px;border-radius:14px;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 45%),#120d22;
  }
  .disc{
    position:relative;width:120px;height:120px;border-radius:50%;
    background:repeating-radial-gradient(circle,#0c0a18 0 4px,#1a1430 4px 8px);
    border:6px solid rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
  }
  .disc.spin{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .disc .hole{width:18px;height:18px;border-radius:50%;background:var(--accent)}
  .meta{text-align:center}
  .meta .title-track{font-size:24px;font-weight:700;letter-spacing:.2px}
  .meta .artist{margin-top:4px;color:var(--muted);font-size:14px}

  /* Controls */
  .controls{display:flex;flex-direction:column;gap:14px}
  .progress-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{position:relative;flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.1);cursor:pointer}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%}
  .bar .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;
    background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);left:0%}
  .buttons{display:flex;align-items:center;justify-content:center;gap:18px}
  .btn{
    background:none;border:none;color:var(--text);cursor:pointer;
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:.2s;
  }
  .btn:hover{background:rgba(255,255,255,.08)}
  .btn svg{width:20px;height:20px;fill:currentColor}
  .btn.play{
    width:60px;height:60px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 12px 30px rgba(139,92,246,.5);
  }
  .btn.play svg{width:26px;height:26px}
  .btn.active{color:var(--accent-2)}
  .btn.small{width:38px;height:38px}
  .vol{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted)}
  .vol input[type=range]{width:130px;accent-color:var(--accent-2)}

  /* Playlist */
  .playlist{
    flex:1;padding:22px;border-left:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;min-height:420px;
  }
  .playlist h3{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:4px}
  .tracks{display:flex;flex-direction:column;gap:6px;overflow:auto}
  .track{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s;
  }
  .track:hover{background:rgba(255,255,255,.05)}
  .track.active{background:linear-gradient(90deg,rgba(139,92,246,.25),rgba(236,72,153,.15))}
  .track .idx{width:18px;text-align:center;color:var(--muted);font-size:13px}
  .track.active .idx{color:var(--accent-2)}
  .track .t-info{flex:1;min-width:0}
  .track .t-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .t-artist{font-size:12px;color:var(--muted)}
  .track .t-dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .eq{display:flex;gap:2px;align-items:flex-end;height:14px;width:16px}
  .eq span{width:3px;background:var(--accent-2);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .eq span:nth-child(2){animation-delay:.2s}
  .eq span:nth-child(3){animation-delay:.4s}
  .eq span:nth-child(4){animation-delay:.1s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .vis{display:flex;align-items:flex-end;gap:3px;height:40px;justify-content:center;margin-top:4px}
  .vis span{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:3px;height:6px;transition:height .12s}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:10px;border-top:1px solid var(--line)}
</style>
</head>
<body>
  <div class="desktop">
    <div class="titlebar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="title">Aurora Player — 1.0</div>
    </div>
    <div class="body">
      <div class="now">
        <div class="art-wrap">
          <div class="art">
            <div class="disc" id="disc"><div class="hole"></div></div>
          </div>
        </div>
        <div class="meta">
          <div class="title-track" id="trackTitle">Midnight Drive</div>
          <div class="artist" id="trackArtist">Neon Coast</div>
        </div>
        <div class="vis" id="vis"></div>
        <div class="controls">
          <div class="progress-row">
            <span id="cur">0:00</span>
            <div class="bar" id="bar">
              <div class="fill" id="fill"></div>
              <div class="knob" id="knob"></div>
            </div>
            <span id="dur">3:24</span>
          </div>
          <div class="buttons">
            <button class="btn small" id="shuffle" title="Shuffle">
              <svg viewBox="0 0 24 24"><path d="M10 3h4v4h-4zM3 10h4l4 4H7v4H3zm18 0v4h-4v-4zM14 11l7 7-7 7-1.4-1.4L18.2 18l-5.6-5.6z" opacity=".0"/><path d="M16 3h5v5h-2V6.4l-3.3 3.3-1.4-1.4L17.6 5H16V3zM4 6h3.6l9 9H20v3h-3.6l-9-9H4V6zm15 9.6V16h-1.6l-9-9H9v1.6l9 9H19v-1.4z"/></svg>
            </button>
            <button class="btn small" id="prev" title="Previous">
              <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L18 5v14z"/></svg>
            </button>
            <button class="btn play" id="play" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn small" id="next" title="Next">
              <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5l8.5 7L6 19z"/></svg>
            </button>
            <button class="btn small" id="repeat" title="Repeat">
              <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
            </button>
          </div>
          <div class="vol">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            <input type="range" id="volume" min="0" max="100" value="80">
          </div>
        </div>
      </div>
      <div class="playlist">
        <h3>Library</h3>
        <div class="tracks" id="tracks"></div>
      </div>
    </div>
    <div class="foot">Web Audio demo — synthesized preview tracks. Click a track or press play.</div>
  </div>

<script>
(function(){
  const tracks = [
    {name:"Midnight Drive", artist:"Neon Coast", dur:204, notes:[220,261.6,329.6,392,440]},
    {name:"Paper Planes", artist:"Lumen", dur:178, notes:[246.9,293.7,349.2,415.3,493.9]},
    {name:"Glass Garden", artist:"Aoko", dur:232, notes:[196,233.1,277.2,329.6,392]},
    {name:"Slow Tide", artist:"Marsh & Vale", dur:255, notes:[174.6,207.7,261.6,311.1,349.2]},
    {name:"Citrus", artist:"The Pauses", dur:189, notes:[261.6,311.1,392,466.2,523.3]},
    {name:"Velvet Static", artist:"Hilo", dur:213, notes:[207.7,246.9,293.7,349.2,415.3]}
  ];

  let ctx, master, analyser, data, oscNodes=[], timer=null;
  let current=0, playing=false, elapsed=0, shuffle=false, repeat=false, volume=0.8;
  let lastTick=0;

  const $ = id => document.getElementById(id);
  const tracksEl=$('tracks'), bar=$('bar'), fill=$('fill'), knob=$('knob');
  const curEl=$('cur'), durEl=$('dur'), playIcon=$('playIcon'), disc=$('disc');
  const vis=$('vis');

  // build visualizer bars
  const visBars=[];
  for(let i=0;i<28;i++){const s=document.createElement('span');vis.appendChild(s);visBars.push(s);}

  function fmt(s){const m=Math.floor(s/60);const r=Math.floor(s%60);return m+':'+(r<10?'0':'')+r;}

  function renderTracks(){
    tracksEl.innerHTML='';
    tracks.forEach((t,i)=>{
      const row=document.createElement('div');
      row.className='track'+(i===current?' active':'');
      row.innerHTML=`<div class="idx">${i===current&&playing?'<div class="eq"><span></span><span></span><span></span><span></span></div>':(i+1)}</div>`+
        `<div class="t-info"><div class="t-name">${t.name}</div><div class="t-artist">${t.artist}</div></div>`+
        `<div class="t-dur">${fmt(t.dur)}</div>`;
      row.addEventListener('click',()=>selectTrack(i,true));
      tracksEl.appendChild(row);
    });
  }

  function loadTrack(i){
    current=i; elapsed=0;
    const t=tracks[current];
    $('trackTitle').textContent=t.name;
    $('trackArtist').textContent=t.artist;
    durEl.textContent=fmt(t.dur);
    curEl.textContent='0:00';
    updateProgress();
    renderTracks();
  }

  function selectTrack(i,autoplay){
    stopAudio();
    loadTrack(i);
    if(autoplay) play();
    else renderTracks();
  }

  function ensureCtx(){
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=volume;
      analyser=ctx.createAnalyser(); analyser.fftSize=64;
      data=new Uint8Array(analyser.frequencyBinCount);
      master.connect(analyser); analyser.connect(ctx.destination);
    }
  }

  function playAudio(){
    ensureCtx();
    if(ctx.state==='suspended') ctx.resume();
    const t=tracks[current];
    const now=ctx.currentTime;
    const startOffset=elapsed;
    const remaining=t.dur-startOffset;
    t.notes.forEach((f,idx)=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.type= idx%2? 'triangle':'sine';
      o.frequency.value=f;
      const local=Math.max(0,startOffset - idx*0.04);
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.18/(t.notes.length), now+0.05+local);
      g.gain.exponentialRampToValueAtTime(0.0001, now+remaining+0.3);
      o.connect(g); g.connect(master);
      o.start(now+idx*0.04+local);
      o.stop(now+remaining+0.4);
      oscNodes.push({o,g});
    });
    startLoop();
  }

  function stopAudio(){
    oscNodes.forEach(n=>{try{n.o.stop();}catch(e){}});
    oscNodes=[];
    if(timer){cancelAnimationFrame(timer);timer=null;}
    visBars.forEach(b=>b.style.height='6px');
  }

  function startLoop(){
    lastTick=performance.now();
    const step=(ts)=>{
      const dt=(ts-lastTick)/1000; lastTick=ts;
      elapsed+=dt;
      const t=tracks[current];
      if(elapsed>=t.dur){ onEnd(); return; }
      updateProgress();
      // visualizer
      if(analyser){
        analyser.getByteFrequencyData(data);
        for(let i=0;i<visBars.length;i++){
          const v=data[i%data.length]/255;
          visBars[i].style.height=(6+v*34)+'px';
        }
      }
      timer=requestAnimationFrame(step);
    };
    timer=requestAnimationFrame(step);
  }

  function updateProgress(){
    const t=tracks[current];
    const pct=Math.min(100,(elapsed/t.dur)*100);
    fill.style.width=pct+'%';
    knob.style.left=pct+'%';
    curEl.textContent=fmt(elapsed);
  }

  function play(){
    ensureCtx();
    if(ctx.state==='suspended') ctx.resume();
    playing=true;
    playIcon.innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    disc.classList.add('spin');
    playAudio();
    renderTracks();
  }

  function pause(){
    playing=false;
    playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    disc.classList.remove('spin');
    stopAudio();
    renderTracks();
  }

  function toggle(){ playing?pause():play(); }

  function onEnd(){
    stopAudio();
    if(repeat){ elapsed=0; play(); }
    else { next(); }
  }

  function next(){
    let i;
    if(shuffle){ i=Math.floor(Math.random()*tracks.length); }
    else { i=(current+1)%tracks.length; }
    selectTrack(i,true);
  }
  function prev(){
    const i=(current-1+tracks.length)%tracks.length;
    selectTrack(i,true);
  }

  // events
  $('play').addEventListener('click',toggle);
  $('next').addEventListener('click',next);
  $('prev').addEventListener('click',prev);
  $('shuffle').addEventListener('click',function(){shuffle=!shuffle;this.classList.toggle('active',shuffle);});
  $('repeat').addEventListener('click',function(){repeat=!repeat;this.classList.toggle('active',repeat);});
  $('volume').addEventListener('input',function(e){volume=e.target.value/100; if(master)master.gain.value=volume;});

  bar.addEventListener('click',function(e){
    const r=bar.getBoundingClientRect();
    const pct=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    elapsed=pct*tracks[current].dur;
    updateProgress();
    if(playing){ stopAudio(); playAudio(); }
  });

  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault();toggle();}
    else if(e.code==='ArrowRight'){next();}
    else if(e.code==='ArrowLeft'){prev();}
  });

  loadTrack(0);
  renderTracks();
})();
</script>
</body>
</html>
