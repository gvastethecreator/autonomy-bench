<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chromatic Currents — Fluid Simulation</title>
<style>
  :root {
    --ui-fg: rgba(255,255,255,0.92);
    --ui-dim: rgba(255,255,255,0.55);
    --panel: rgba(16,18,32,0.42);
    --panel-stroke: rgba(255,255,255,0.14);
    --accent: #7df9ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: #04060d; color: var(--ui-fg);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Vignette + grain overlay for cinematic framing */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(120% 120% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }
  #grain {
    position: fixed; inset: -50%; pointer-events: none; z-index: 6; opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grain 1.1s steps(3) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); }
    33% { transform: translate(-4%,3%); }
    66% { transform: translate(3%,-2%); }
    100% { transform: translate(0,0); }
  }

  /* Title */
  #title {
    position: fixed; top: 26px; left: 30px; z-index: 10; pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #title h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--ui-fg);
    text-shadow: 0 2px 22px rgba(0,0,0,0.6);
  }
  #title p {
    margin: 6px 0 0; font-size: 12px; letter-spacing: 0.16em; color: var(--ui-dim);
    font-weight: 400;
  }

  /* Control panel */
  #panel {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; align-items: center;
    padding: 10px 14px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--panel-stroke);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    opacity: 0; animation: rise 1s ease 0.5s forwards;
  }
  @keyframes rise { from { opacity:0; transform: translateX(-50%) translateY(14px);} to { opacity:1; transform: translateX(-50%) translateY(0);} }
  .btn {
    appearance: none; border: 1px solid var(--panel-stroke);
    background: rgba(255,255,255,0.06); color: var(--ui-fg);
    font: inherit; font-size: 12px; letter-spacing: 0.08em; font-weight: 600;
    padding: 9px 14px; border-radius: 11px; cursor: pointer;
    transition: background .2s ease, border-color .2s ease, transform .08s ease;
    user-select: none;
  }
  .btn:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.32); }
  .btn:active { transform: scale(0.95); }
  .btn.active { background: rgba(125,249,255,0.18); border-color: var(--accent); color: #d6feff; }
  .sep { width:1px; height: 26px; background: var(--panel-stroke); }
  .label { font-size: 11px; letter-spacing: 0.12em; color: var(--ui-dim); text-transform: uppercase; }

  #hint {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 11.5px; letter-spacing: 0.14em; color: var(--ui-dim);
    pointer-events: none; opacity: 0; animation: fade 1.4s ease 1.2s forwards;
    text-align: center;
  }
  @keyframes fade { to { opacity: 0.85; } }

  #loader {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #04060d; transition: opacity .8s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .ring {
    width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    #title h1 { font-size: 16px; letter-spacing: 0.22em; }
    #title p { font-size: 10px; }
    .btn { padding: 8px 10px; font-size: 11px; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div id="title">
    <h1>Chromatic Currents</h1>
    <p>an interactive fluid of living color</p>
  </div>

  <div id="hint">move your cursor to stir the dye &nbsp;·&nbsp; click to bloom &nbsp;·&nbsp; press SPACE for a cosmic burst</div>

  <div id="panel">
    <button class="btn active" id="btnColor">Aurora</button>
    <button class="btn" id="btnColor2">Ember</button>
    <button class="btn" id="btnColor3">Spectrum</button>
    <div class="sep"></div>
    <button class="btn active" id="btnAuto">Auto Bloom</button>
    <div class="sep"></div>
    <button class="btn" id="btnBurst">Burst</button>
    <button class="btn" id="btnClear">Clear</button>
  </div>

  <div id="loader"><div class="ring"></div></div>

<script>
"use strict";
/* ============================================================
   Chromatic Currents — a self-contained WebGL fluid simulation
   Navier-Stokes (Stam) solver: advection, divergence, pressure
   (Jacobi), and curl/vorticity confinement for living swirls.
   ============================================================ */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.getElementById('loader').innerHTML = '<div style="color:#fff;font-family:Inter,sans-serif">WebGL not supported on this device.</div>'; }

const isWebGL2 = false;

/* ---- Config ---- */
const config = {
  SIM_RES: 192,
  DYE_RES: 1024,
  DENSITY_DISSIPATION: 0.985,
  VELOCITY_DISSIPATION: 0.992,
  PRESSURE: 0.8,
  PRESSURE_ITER: 20,
  CURL: 30,
  SPLAT_RADIUS: 0.22,
  SPLAT_FORCE: 6200,
  autoBloom: true,
  palette: 0
};

/* ---- Shaders ---- */
const baseVertex = `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv;
  varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform vec2 texelSize;
  void main () {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }`;

const clearShader = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; uniform sampler2D uTexture; uniform float value;
  void main () { gl_FragColor = value * texture2D(uTexture, vUv); }`;

const copyShader = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; uniform sampler2D uTexture;
  void main () { gl_FragColor = texture2D(uTexture, vUv); }`;

const splatShader = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv; uniform sampler2D uTarget; uniform float aspectRatio;
  uniform vec3 color; uniform vec2 point; uniform float radius;
  void main () {
    vec2 p = vUv - point.xy; p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    gl_FragColor = vec4(base + splat, 1.0);
  }`;

const advectionShader = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv; uniform sampler2D uVelocity; uniform sampler2D uSource;
  uniform vec2 texelSize; uniform float dt; uniform float dissipation;
  void main () {
    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
    vec4 result = texture2D(uSource, coord);
    float decay = 1.0 + dissipation * dt;
    gl_FragColor = result / decay;
  }`;

const divergenceShader = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) { L = -C.x; }
    if (vR.x > 1.0) { R = -C.x; }
    if (vT.y > 1.0) { T = -C.y; }
    if (vB.y < 0.0) { B = -C.y; }
    float div = 0.5 * (R - L + T - B);
    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
  }`;

const curlShader = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
  }`;

const vorticityShader = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uVelocity; uniform sampler2D uCurl;
  uniform float curl; uniform float dt;
  void main () {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 vel = texture2D(uVelocity, vUv).xy;
    vel += force * dt;
    vel = clamp(vel, -1000.0, 1000.0);
    gl_FragColor = vec4(vel, 0.0, 1.0);
  }`;

const pressureShader = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uPressure; uniform sampler2D uDivergence;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
  }`;

const gradientSubtractShader = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uPressure; uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }`;

const displayShader = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv; uniform sampler2D uTexture;
  uniform vec2 texelSize;
  void main () {
    vec3 c = texture2D(uTexture, vUv).rgb;
    // gentle filmic tone curve for richness
    c = c / (c + vec3(0.55));
    c = pow(c, vec3(0.85));
    gl_FragColor = vec4(c, 1.0);
  }`;

/* ---- GL helpers ---- */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPosition');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
function uniforms(p) {
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name] = gl.getUniformLocation(p, info.name);
  }
  return u;
}

const programs = {
  copy: program(baseVertex, copyShader),
  clear: program(baseVertex, clearShader),
  splat: program(baseVertex, splatShader),
  advection: program(baseVertex, advectionShader),
  divergence: program(baseVertex, divergenceShader),
  curl: program(baseVertex, curlShader),
  vorticity: program(baseVertex, vorticityShader),
  pressure: program(baseVertex, pressureShader),
  gradient: program(baseVertex, gradientSubtractShader),
  display: program(baseVertex, displayShader)
};
for (const k in programs) programs[k].uniforms = uniforms(programs[k]);

/* quad */
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function blit(target) {
  if (target == null) {
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  } else {
    gl.viewport(0, 0, target.width, target.height);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* FBO */
function createFBO(w, h, internal, format, type, param) {
  gl.activeTexture(gl.TEXTURE0);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const texelX = 1.0 / w, texelY = 1.0 / h;
  return {
    texture, fbo, width: w, height: h, texelSizeX: texelX, texelSizeY: texelY,
    attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; }
  };
}
function createDoubleFBO(w, h, internal, format, type, param) {
  let fbo1 = createFBO(w, h, internal, format, type, param);
  let fbo2 = createFBO(w, h, internal, format, type, param);
  return {
    width: w, height: h, texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
    get read() { return fbo1; }, set read(v) { fbo1 = v; },
    get write() { return fbo2; }, set write(v) { fbo2 = v; },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}

let dye, velocity, divergence, curl, pressure;

function getFormat() {
  // Use RGBA / half float-ish via UNSIGNED_BYTE fallback for broad support
  return { internal: gl.RGBA, format: gl.RGBA, type: gl.UNSIGNED_BYTE };
}

function initFramebuffers() {
  const fmt = getFormat();
  const simRes = config.SIM_RES;
  const dyeRes = config.DYE_RES;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(window.innerWidth * dpr);
  const h = Math.floor(window.innerHeight * dpr);
  canvas.width = w; canvas.height = h;

  dye = createDoubleFBO(dyeRes, dyeRes, fmt.internal, fmt.format, fmt.type, gl.LINEAR);
  velocity = createDoubleFBO(simRes, simRes, fmt.internal, fmt.format, fmt.type, gl.LINEAR);
  divergence = createFBO(simRes, simRes, fmt.internal, fmt.format, fmt.type, gl.NEAREST);
  curl = createFBO(simRes, simRes, fmt.internal, fmt.format, fmt.type, gl.NEAREST);
  pressure = createDoubleFBO(simRes, simRes, fmt.internal, fmt.format, fmt.type, gl.NEAREST);
}

/* ---- Palettes ---- */
const palettes = [
  // Aurora: teals, violets, magentas
  (t) => {
    const a = HSVtoRGB((t * 0.12 + 0.55) % 1.0, 0.85, 1.0);
    return a;
  },
  // Ember: reds, oranges, golds
  (t) => {
    return HSVtoRGB((t * 0.10 + 0.02) % 1.0, 0.9, 1.0);
  },
  // Spectrum: full hue rotation
  (t) => {
    return HSVtoRGB((t * 0.18) % 1.0, 0.85, 1.0);
  }
];

function HSVtoRGB(h, s, v) {
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return { r, g, b };
}

let hueClock = Math.random();
function nextColor(intensity) {
  const p = palettes[config.palette];
  const c = p(hueClock);
  hueClock += 0.0035;
  const k = intensity * 0.32;
  return { r: c.r * k, g: c.g * k, b: c.b * k };
}

/* ---- Splats ---- */
function splat(x, y, dx, dy, color) {
  const aspect = canvas.width / canvas.height;
  const sp = programs.splat;
  gl.useProgram(sp);
  gl.uniform1i(sp.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(sp.uniforms.aspectRatio, aspect);
  gl.uniform2f(sp.uniforms.point, x, y);
  gl.uniform3f(sp.uniforms.color, dx, dy, 0.0);
  gl.uniform1f(sp.uniforms.radius, config.SPLAT_RADIUS / 100.0);
  blit(velocity.write); velocity.swap();

  gl.uniform1i(sp.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(sp.uniforms.color, color.r, color.g, color.b);
  blit(dye.write); dye.swap();
}

/* ---- Simulation step ---- */
let lastTime = performance.now();
function step(dt) {
  gl.disable(gl.BLEND);

  // curl
  gl.useProgram(programs.curl);
  gl.uniform2f(programs.curl.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.curl.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  // vorticity
  gl.useProgram(programs.vorticity);
  gl.uniform2f(programs.vorticity.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.vorticity.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(programs.vorticity.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(programs.vorticity.uniforms.curl, config.CURL);
  gl.uniform1f(programs.vorticity.uniforms.dt, dt);
  blit(velocity.write); velocity.swap();

  // divergence
  gl.useProgram(programs.divergence);
  gl.uniform2f(programs.divergence.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.divergence.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  // clear pressure
  gl.useProgram(programs.clear);
  gl.uniform1i(programs.clear.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(programs.clear.uniforms.value, config.PRESSURE);
  blit(pressure.write); pressure.swap();

  // pressure solve
  gl.useProgram(programs.pressure);
  gl.uniform2f(programs.pressure.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.pressure.uniforms.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITER; i++) {
    gl.uniform1i(programs.pressure.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write); pressure.swap();
  }

  // gradient subtract
  gl.useProgram(programs.gradient);
  gl.uniform2f(programs.gradient.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.gradient.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(programs.gradient.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  // advect velocity
  gl.useProgram(programs.advection);
  gl.uniform2f(programs.advection.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(programs.advection.uniforms.uSource, velocity.read.attach(0));
  gl.uniform1f(programs.advection.uniforms.dt, dt);
  gl.uniform1f(programs.advection.uniforms.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write); velocity.swap();

  // advect dye
  gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(programs.advection.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(programs.advection.uniforms.dissipation, config.DENSITY_DISSIPATION);
  blit(dye.write); dye.swap();
}

function render() {
  gl.useProgram(programs.display);
  gl.uniform2f(programs.display.uniforms.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(programs.display.uniforms.uTexture, dye.read.attach(0));
  blit(null);
}

/* ---- Pointer interaction ---- */
const pointers = {};
function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) / rect.width;
  const cy = 1.0 - (e.clientY - rect.top) / rect.height;
  return { x: cx, y: cy };
}
let lastPointer = null;

function onMove(e) {
  const pos = pointerPos(e);
  const color = nextColor(1.0);
  if (lastPointer) {
    const dx = (pos.x - lastPointer.x) * config.SPLAT_FORCE;
    const dy = (pos.y - lastPointer.y) * config.SPLAT_FORCE;
    splat(pos.x, pos.y, dx, dy, color);
  }
  lastPointer = pos;
}
function onDown(e) {
  const pos = pointerPos(e);
  const color = nextColor(2.4);
  splat(pos.x, pos.y, (Math.random()-0.5)*200, (Math.random()-0.5)*200, color);
  lastPointer = pos;
  // small bloom
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    splat(pos.x + Math.cos(a)*0.02, pos.y + Math.sin(a)*0.02,
          Math.cos(a)*800, Math.sin(a)*800, nextColor(1.8));
  }
}
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e.touches[0]); }, { passive: false });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e.touches[0]); }, { passive: false });

/* ---- Auto bloom (showcase-first life) ---- */
let bloomTimer = 0;
function autoBloom(dt) {
  if (!config.autoBloom) return;
  bloomTimer -= dt;
  if (bloomTimer <= 0) {
    bloomTimer = 0.9 + Math.random() * 1.4;
    const x = 0.12 + Math.random() * 0.76;
    const y = 0.12 + Math.random() * 0.76;
    const ang = Math.random() * Math.PI * 2;
    const force = 400 + Math.random() * 900;
    const color = nextColor(1.6 + Math.random());
    splat(x, y, Math.cos(ang) * force, Math.sin(ang) * force, color);
  }
}

/* ---- Cosmic burst ---- */
function cosmicBurst() {
  const cx = 0.5, cy = 0.5;
  const n = 26;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
    const f = 600 + Math.random() * 1400;
    const x = cx + Math.cos(a) * 0.05;
    const y = cy + Math.sin(a) * 0.05;
    splat(x, y, Math.cos(a) * f, Math.sin(a) * f, nextColor(2.2 + Math.random()));
  }
}

/* ---- Main loop ---- */
function frame() {
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  dt = Math.min(dt, 0.0166);
  lastTime = now;

  autoBloom(dt);
  step(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---- Controls ---- */
function bindToggle(id, on, init) {
  const el = document.getElementById(id);
  el.addEventListener('click', () => { on(); });
  return el;
}
const b1 = document.getElementById('btnColor');
const b2 = document.getElementById('btnColor2');
const b3 = document.getElementById('btnColor3');
function setPalette(i, el) {
  config.palette = i;
  [b1,b2,b3].forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
b1.addEventListener('click', () => setPalette(0, b1));
b2.addEventListener('click', () => setPalette(1, b2));
b3.addEventListener('click', () => setPalette(2, b3));

const btnAuto = document.getElementById('btnAuto');
btnAuto.addEventListener('click', () => {
  config.autoBloom = !config.autoBloom;
  btnAuto.classList.toggle('active', config.autoBloom);
});
document.getElementById('btnBurst').addEventListener('click', cosmicBurst);
document.getElementById('btnClear').addEventListener('click', () => {
  gl.useProgram(programs.clear);
  gl.uniform1i(programs.clear.uniforms.uTexture, dye.read.attach(0));
  gl.uniform1f(programs.clear.uniforms.value, 0.0);
  blit(dye.write); dye.swap();
  gl.uniform1i(programs.clear.uniforms.uTexture, velocity.read.attach(0));
  gl.uniform1f(programs.clear.uniforms.value, 0.0);
  blit(velocity.write); velocity.swap();
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); cosmicBurst(); }
});

window.addEventListener('resize', () => { initFramebuffers(); });

/* ---- Boot ---- */
initFramebuffers();
// seed a few blooms so the opening frame is alive
setTimeout(() => {
  for (let i = 0; i < 8; i++) {
    const x = Math.random(), y = Math.random();
    const a = Math.random()*Math.PI*2, f = 500 + Math.random()*800;
    splat(x, y, Math.cos(a)*f, Math.sin(a)*f, nextColor(1.5));
  }
  document.getElementById('loader').classList.add('done');
}, 120);

requestAnimationFrame(frame);
</script>
</body>
