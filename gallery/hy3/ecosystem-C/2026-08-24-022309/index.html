<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Biome — A Self-Sustaining Ecosystem</title>
<style>
  :root {
    --ink: #f3ede1;
    --ink-dim: rgba(243, 237, 225, 0.62);
    --panel: rgba(14, 20, 18, 0.42);
    --panel-line: rgba(243, 237, 225, 0.14);
    --herb: #e8b06a;
    --carn: #d96a5b;
    --plant: #8fc46a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0f0d; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  #scene { position: fixed; inset: 0; display: block; }

  /* Title */
  #title {
    position: fixed; left: 34px; top: 30px; z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 18px rgba(0,0,0,0.55);
    transition: opacity 1.6s ease;
  }
  #title h1 {
    font-size: 30px; font-weight: 600; letter-spacing: 0.42em;
    text-transform: uppercase; margin-left: 4px;
  }
  #title .sub {
    margin-top: 8px; font-size: 12.5px; letter-spacing: 0.28em;
    color: var(--ink-dim); text-transform: uppercase;
  }
  #title .rule {
    margin-top: 12px; width: 54px; height: 2px;
    background: linear-gradient(90deg, var(--plant), transparent);
    border-radius: 2px;
  }

  /* HUD counts */
  #hud {
    position: fixed; right: 30px; top: 30px; z-index: 5;
    display: flex; flex-direction: column; gap: 10px;
    align-items: flex-end;
  }
  .stat {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--panel-line);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-radius: 11px; padding: 9px 14px; min-width: 132px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.28);
  }
  .stat .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .stat .lbl { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); flex: 1; }
  .stat .val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Clock */
  #clock {
    position: fixed; left: 34px; bottom: 28px; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--panel-line);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-radius: 12px; padding: 11px 16px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.28);
  }
  #clock .phase { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); min-width: 64px; }
  #clock .bar { width: 150px; height: 5px; border-radius: 5px; background: rgba(243,237,225,0.16); overflow: hidden; }
  #clock .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd98a, #ff9d5c); border-radius: 5px; transition: width 0.2s linear; }

  /* Graph */
  #graphWrap {
    position: fixed; right: 30px; bottom: 28px; z-index: 5;
    background: var(--panel); border: 1px solid var(--panel-line);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-radius: 12px; padding: 12px 14px 10px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.28);
  }
  #graphWrap .gtitle { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 7px; }
  #graph { display: block; border-radius: 6px; }

  /* Controls */
  #controls {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 6; display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--panel-line);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-radius: 14px; padding: 8px 12px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.28);
  }
  #controls button {
    background: rgba(243,237,225,0.08); color: var(--ink);
    border: 1px solid var(--panel-line); border-radius: 9px;
    padding: 8px 13px; font-size: 12px; letter-spacing: 0.08em;
    cursor: pointer; transition: background 0.18s, transform 0.1s;
    font-family: inherit;
  }
  #controls button:hover { background: rgba(243,237,225,0.18); }
  #controls button:active { transform: scale(0.95); }
  #controls button.active { background: rgba(143,196,106,0.28); border-color: rgba(143,196,106,0.5); }
  #controls .sep { width: 1px; height: 22px; background: var(--panel-line); margin: 0 4px; }
  #controls .speedlbl { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.1em; padding: 0 4px; min-width: 60px; text-align: center; }

  /* Intro veil */
  #veil {
    position: fixed; inset: 0; z-index: 20; background: #0a0f0d;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.8s ease; pointer-events: none;
  }
  #veil.gone { opacity: 0; }

  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; z-index: 5;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim);
    opacity: 0.7; pointer-events: none; transition: opacity 1s; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="title">
  <h1>Biome</h1>
  <div class="sub">A living, self-sustaining world</div>
  <div class="rule"></div>
</div>

<div id="hud">
  <div class="stat"><span class="dot" style="background:var(--plant)"></span><span class="lbl">Flora</span><span class="val" id="cPlant">0</span></div>
  <div class="stat"><span class="dot" style="background:var(--herb)"></span><span class="lbl">Grazer</span><span class="val" id="cHerb">0</span></div>
  <div class="stat"><span class="dot" style="background:var(--carn)"></span><span class="lbl">Predator</span><span class="val" id="cCarn">0</span></div>
</div>

<div id="clock">
  <span class="phase" id="phase">Dawn</span>
  <span class="bar"><span class="fill" id="dayFill"></span></span>
</div>

<div id="graphWrap">
  <div class="gtitle">Population · 60s</div>
  <canvas id="graph" width="220" height="84"></canvas>
</div>

<div id="controls">
  <button id="btnPlay" class="active">Pause</button>
  <div class="sep"></div>
  <button data-spd="0.5">0.5×</button>
  <button data-spd="1" class="active">1×</button>
  <button data-spd="2">2×</button>
  <button data-spd="4">4×</button>
  <div class="sep"></div>
  <button id="btnReset">Reset</button>
  <span class="speedlbl" id="spdLbl">1×</span>
</div>

<div class="hint" id="hint">Click the meadow to scatter seed · drag to disturb</div>

<div id="veil"></div>

<script>
"use strict";
(function () {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let groundY = 0;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    groundY = H * 0.80;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- utils ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(c1, c2, t) {
    const a = hexToRgb(c1), b = hexToRgb(c2);
    return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
  }
  function rgba(c, a) { const x = hexToRgb(c); return `rgba(${x[0]},${x[1]},${x[2]},${a})`; }

  // ---------- day / night ----------
  // cycle: full day in DAY_LEN seconds (sim time). t in [0,1)
  const DAY_LEN = 90;
  let dayT = 0.18; // start at dawn
  let dayCount = 1;
  // sky palettes for phases
  const SKY = {
    night:  ["#0a1226", "#13203f", "#1b2c4d"],
    dawn:   ["#23304f", "#5b5a7a", "#e7936b"],
    day:    ["#5fa8d8", "#9fd0e8", "#dff0e6"],
    dusk:   ["#2b2d52", "#7a4f6e", "#e8845a"]
  };
  function skyColors(t) {
    // t: 0=midnight,0.25=dawn,0.5=noon,0.75=dusk
    let a, b, k;
    if (t < 0.25) { a = SKY.night; b = SKY.dawn; k = t / 0.25; }
    else if (t < 0.5) { a = SKY.dawn; b = SKY.day; k = (t - 0.25) / 0.25; }
    else if (t < 0.75) { a = SKY.day; b = SKY.dusk; k = (t - 0.5) / 0.25; }
    else { a = SKY.dusk; b = SKY.night; k = (t - 0.75) / 0.25; }
    return [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];
  }
  function phaseName(t) {
    if (t < 0.06 || t >= 0.94) return "Night";
    if (t < 0.22) return "Dawn";
    if (t < 0.28) return "Morning";
    if (t < 0.5) return "Midday";
    if (t < 0.56) return "Afternoon";
    if (t < 0.78) return "Dusk";
    return "Night";
  }
  function sunPos(t) {
    // arc from left (sunrise ~0.22) to right (sunset ~0.78)
    const ang = (t - 0.22) / 0.56 * Math.PI;
    const cx = W * 0.5, cy = H * 0.80;
    const r = Math.min(W, H) * 0.62;
    return { x: cx - Math.cos(ang) * r, y: cy - Math.sin(ang) * r, up: Math.sin(ang) > 0 };
  }

  // ---------- entities ----------
  const plants = [];
  const herbivores = [];
  const carnivores = [];
  const particles = [];
  const stars = [];

  function makeStars() {
    stars.length = 0;
    const n = Math.floor(W / 7);
    for (let i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * groundY * 0.92, r: rand(0.4, 1.5), tw: rand(0, Math.PI * 2) });
    }
  }
  makeStars();

  class Plant {
    constructor(x) {
      this.x = x;
      this.y = groundY + rand(-2, 6);
      this.growth = rand(0.2, 0.6);
      this.max = rand(0.85, 1.0);
      this.sway = rand(0, Math.PI * 2);
      this.blades = 3 + Math.floor(rand(0, 4));
      this.hue = rand(95, 135);
      this.dead = false;
    }
    get food() { return this.growth * this.max; }
    update(dt, light) {
      // grows faster in daylight
      const rate = (0.05 + 0.16 * light) * dt;
      if (this.growth < this.max) this.growth = clamp(this.growth + rate, 0, this.max);
      this.sway += dt * 1.4;
    }
    eat(amount) {
      const got = Math.min(this.growth, amount);
      this.growth -= got;
      if (this.growth <= 0.04) this.dead = true;
      return got;
    }
    draw(ctx, light) {
      const g = this.growth;
      const baseY = this.y;
      const sh = Math.sin(this.sway) * 3 * g;
      const h = (10 + 26 * g);
      ctx.save();
      ctx.translate(this.x, baseY);
      ctx.globalAlpha = 0.9;
      for (let i = 0; i < this.blades; i++) {
        const off = (i - (this.blades - 1) / 2) * 3.2;
        const bend = sh * (0.4 + 0.6 * Math.abs(off) / (this.blades * 2 + 1));
        const tipX = off + bend, tipY = -h * (0.7 + 0.3 * (1 - Math.abs(off) / 18));
        const grd = ctx.createLinearGradient(0, 0, tipX, tipY);
        const lit = lerp(0.45, 1, light);
        grd.addColorStop(0, `hsla(${this.hue - 8},45%,${28 * lit}%,0.95)`);
        grd.addColorStop(1, `hsla(${this.hue},55%,${46 * lit}%,0.95)`);
        ctx.strokeStyle = grd;
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(off, 0);
        ctx.quadraticCurveTo(off + bend * 0.5, tipY * 0.55, tipX, tipY);
        ctx.stroke();
      }
      // seed head when mature
      if (g > 0.7) {
        ctx.fillStyle = `hsla(${this.hue},50%,${60 * lerp(0.5,1,light)}%,0.9)`;
        ctx.beginPath();
        ctx.arc(sh * 0.4, -h, 2.2, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  }

  class Critter {
    constructor(x, opts) {
      this.x = x;
      this.y = groundY;
      this.vx = rand(-opts.speed, opts.speed);
      this.energy = rand(0.45, 0.7) * opts.maxEnergy;
      this.maxEnergy = opts.maxEnergy;
      this.speed = opts.speed;
      this.size = opts.size;
      this.color = opts.color;
      this.type = opts.type;
      this.age = 0;
      this.maxAge = opts.maxAge;
      this.reproCool = rand(4, 9);
      this.dir = this.vx >= 0 ? 1 : -1;
      this.legPhase = rand(0, 6.28);
      this.bob = 0;
      this.dead = false;
      this.fear = 0;
      this.eatFlash = 0;
    }
  }

  function updateCritter(c, dt, light) {
    c.age += dt;
    // energy drain (lower at night, since resting)
    const night = 1 - light;
    const drain = (c.type === "herb" ? 0.018 : 0.014) * (0.6 + 0.9 * light) * dt * 6;
    c.energy -= drain;
    if (c.energy <= 0 || c.age > c.maxAge) { c.dead = true; return; }
    c.legPhase += Math.abs(c.vx) * dt * 0.9;
    c.bob = Math.sin(c.legPhase) * (c.size * 0.18);
    if (c.fear > 0) c.fear = Math.max(0, c.fear - dt * 1.5);
    if (c.eatFlash > 0) c.eatFlash = Math.max(0, c.eatFlash - dt * 3);

    // steering
    let tx = c.x + c.vx * 60;
    if (c.type === "herb") {
      // flee predators
      let threat = null, td = 1e9;
      for (const p of carnivores) {
        const d = dist2(c.x, c.y, p.x, p.y);
        if (d < td && d < 180 * 180) { td = d; threat = p; }
      }
      if (threat) {
        c.fear = 1;
        const away = Math.sign(c.x - threat.x) || (Math.random() < 0.5 ? 1 : -1);
        c.vx = away * c.speed * 1.5;
      } else {
        // seek nearest mature plant
        let best = null, bd = 1e9;
        for (const pl of plants) {
          if (pl.dead || pl.growth < 0.25) continue;
          const d = (pl.x - c.x) ** 2;
          if (d < bd) { bd = d; best = pl; }
        }
        if (best) {
          const dir = Math.sign(best.x - c.x);
          const near = Math.abs(best.x - c.x) < 14;
          c.vx = near ? 0 : dir * c.speed * (0.5 + 0.5 * (1 - bd / (260 * 260)));
          if (near && c.energy < c.maxEnergy * 0.96) {
            const got = best.eat(0.5 * dt * 6 / 60 * 24);
            c.energy = clamp(c.energy + got * 26, 0, c.maxEnergy);
            c.eatFlash = 1;
            if (got > 0.01) spawnSpark(best.x, c.y - 8, "#bfe88a");
            if (best.dead) spawnSpark(best.x, c.y - 8, "#9bd066");
          }
        } else {
          c.vx += rand(-1, 1) * dt * 8;
        }
      }
    } else {
      // carnivore: hunt herbivores
      let prey = null, pd = 1e9;
      for (const h of herbivores) {
        const d = dist2(c.x, c.y, h.x, h.y);
        if (d < pd) { pd = d; prey = h; }
      }
      if (prey) {
        const dir = Math.sign(prey.x - c.x);
        const near = Math.abs(prey.x - c.x) < c.size + prey.size + 4;
        c.vx = near ? 0 : dir * c.speed * (0.7 + 0.5 * (1 - pd / (340 * 340)));
        if (near) {
          prey.dead = true;
          c.energy = clamp(c.energy + c.maxEnergy * 0.42, 0, c.maxEnergy);
          c.eatFlash = 1;
          for (let i = 0; i < 8; i++) spawnSpark(prey.x, prey.y - 10, "#e8a07a");
        }
      } else {
        c.vx += rand(-1, 1) * dt * 6;
      }
    }
    c.vx = clamp(c.vx, -c.speed * 1.6, c.speed * 1.6);
    if (Math.abs(c.vx) > 0.15) c.dir = c.vx > 0 ? 1 : -1;
    c.x += c.vx * dt * 6;
    // wander bounce when idle
    if (Math.abs(c.vx) < 0.2) c.x += Math.sin(c.age * 0.8) * 0.2;
    // boundaries
    if (c.x < 20) { c.x = 20; c.vx = Math.abs(c.vx); c.dir = 1; }
    if (c.x > W - 20) { c.x = W - 20; c.vx = -Math.abs(c.vx); c.dir = -1; }

    // reproduction
    c.reproCool -= dt;
    if (c.energy > c.maxEnergy * 0.78 && c.reproCool <= 0) {
      c.energy *= 0.5;
      c.reproCool = c.type === "herb" ? rand(7, 13) : rand(12, 20);
      const child = new Critter(c.x + rand(-6, 6), c.type === "herb" ? HERB : CARN);
      if (c.type === "herb") herbivores.push(child); else carnivores.push(child);
      for (let i = 0; i < 5; i++) spawnSpark(c.x, c.y - 8, c.type === "herb" ? "#f0c98a" : "#e88a7a");
    }
  }

  function drawCritter(c, light) {
    const s = c.size;
    const y = c.y + c.bob;
    ctx.save();
    ctx.translate(c.x, y);
    ctx.scale(c.dir, 1);
    // shadow
    ctx.save();
    ctx.scale(c.dir, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.22 * lerp(0.5,1,light)})`;
    ctx.beginPath();
    ctx.ellipse(0, -c.bob + 2, s * 1.05, s * 0.28, 0, 0, 7); ctx.fill();
    ctx.restore();

    const lit = lerp(0.5, 1, light);
    if (c.type === "herb") {
      // legs
      ctx.strokeStyle = rgba(c.color, 0.85 * lit);
      ctx.lineWidth = 1.6; ctx.lineCap = "round";
      for (let i = -1; i <= 1; i++) {
        const lp = Math.sin(c.legPhase + i * 1.4) * s * 0.4;
        ctx.beginPath(); ctx.moveTo(i * s * 0.4, -s * 0.1); ctx.lineTo(i * s * 0.4 + lp * 0.4, -s * 0.7); ctx.stroke();
      }
      // body
      const bg = ctx.createLinearGradient(0, -s, 0, 0);
      bg.addColorStop(0, mix(c.color, "#ffffff", 0.18 * lit));
      bg.addColorStop(1, mix(c.color, "#000000", 0.22));
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, -s * 0.55, s * 0.85, s * 0.62, 0, 0, 7); ctx.fill();
      // head
      ctx.beginPath(); ctx.ellipse(s * 0.7, -s * 0.7, s * 0.42, s * 0.4, 0, 0, 7); ctx.fill();
      // ear
      ctx.beginPath(); ctx.ellipse(s * 0.6, -s * 1.15, s * 0.16, s * 0.3, -0.3, 0, 7); ctx.fill();
      // eye
      ctx.fillStyle = "rgba(20,16,14,0.9)";
      ctx.beginPath(); ctx.arc(s * 0.82, -s * 0.72, s * 0.08, 0, 7); ctx.fill();
      // tail
      ctx.strokeStyle = rgba(c.color, 0.9 * lit); ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-s * 0.8, -s * 0.5);
      ctx.quadraticCurveTo(-s * 1.3, -s * 0.8, -s * 1.15, -s * 1.1); ctx.stroke();
    } else {
      // carnivore: sleek, longer
      ctx.strokeStyle = rgba(c.color, 0.85 * lit);
      ctx.lineWidth = 1.8; ctx.lineCap = "round";
      for (let i = -1; i <= 1; i++) {
        const lp = Math.sin(c.legPhase + i * 1.2) * s * 0.45;
        ctx.beginPath(); ctx.moveTo(i * s * 0.45, -s * 0.15); ctx.lineTo(i * s * 0.45 + lp * 0.4, -s * 0.75); ctx.stroke();
      }
      const bg = ctx.createLinearGradient(0, -s * 1.1, 0, 0);
      bg.addColorStop(0, mix(c.color, "#ffffff", 0.12 * lit));
      bg.addColorStop(1, mix(c.color, "#000000", 0.3));
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, -s * 0.6, s * 1.05, s * 0.5, 0, 0, 7); ctx.fill();
      // head forward
      ctx.beginPath(); ctx.ellipse(s * 0.95, -s * 0.75, s * 0.4, s * 0.36, -0.15, 0, 7); ctx.fill();
      // snout
      ctx.beginPath(); ctx.ellipse(s * 1.3, -s * 0.62, s * 0.22, s * 0.18, 0, 0, 7); ctx.fill();
      // ear
      ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 1.05); ctx.lineTo(s * 0.85, -s * 1.45); ctx.lineTo(s * 1.0, -s * 1.05); ctx.fill();
      // eye (glowing red)
      ctx.fillStyle = `rgba(255,${lerp(60,160,light)|0},60,0.95)`;
      ctx.beginPath(); ctx.arc(s * 1.02, -s * 0.8, s * 0.09, 0, 7); ctx.fill();
      // tail
      ctx.strokeStyle = rgba(c.color, 0.9 * lit); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-s * 0.95, -s * 0.6);
      ctx.quadraticCurveTo(-s * 1.6, -s * 0.4, -s * 1.5, -s * 1.0); ctx.stroke();
    }
    // eat flash
    if (c.eatFlash > 0) {
      ctx.globalAlpha = c.eatFlash * 0.5;
      ctx.fillStyle = c.type === "herb" ? "#dfffa0" : "#ffd0a0";
      ctx.beginPath(); ctx.arc(0, -s * 0.6, s * 1.3, 0, 7); ctx.fill();
    }
    // fear indicator
    if (c.fear > 0.4) {
      ctx.globalAlpha = (c.fear - 0.4) * 1.2;
      ctx.strokeStyle = "rgba(255,90,70,0.9)"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, -s * 0.6, s * 1.5, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }

  function spawnSpark(x, y, col) {
    particles.push({ x, y, vx: rand(-30, 30), vy: rand(-50, -10), life: 1, col, r: rand(1, 2.6) });
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt;
      p.life -= dt * 1.6;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- config ----------
  const HERB = { type: "herb", speed: 26, size: 9, color: "#e8b06a", maxEnergy: 100, maxAge: 70 };
  const CARN = { type: "carn", speed: 34, size: 12, color: "#7a4a52", maxEnergy: 130, maxAge: 95 };

  // ---------- spawn / reset ----------
  function reset() {
    plants.length = 0; herbivores.length = 0; carnivores.length = 0; particles.length = 0;
    for (let i = 0; i < 130; i++) plants.push(new Plant(rand(10, W - 10)));
    for (let i = 0; i < 16; i++) herbivores.push(new Critter(rand(40, W - 40), HERB));
    for (let i = 0; i < 5; i++) carnivores.push(new Critter(rand(40, W - 40), CARN));
    history.length = 0;
  }

  // background hills
  const hills = [];
  function makeHills() {
    hills.length = 0;
    for (let layer = 0; layer < 3; layer++) {
      const pts = [];
      const seg = 6 + layer * 2;
      for (let i = 0; i <= seg; i++) pts.push({ x: i / seg, h: rand(0.18, 0.5) });
      hills.push({ layer, pts, col: ["#1d3b34", "#244a3c", "#2c5a44"][layer] });
    }
  }
  makeHills();

  // ---------- population history ----------
  const history = [];
  let histAccum = 0;

  // ---------- main loop ----------
  let last = performance.now();
  let running = true;
  let speed = 1;

  function step(dt) {
    dayT += dt / DAY_LEN;
    if (dayT >= 1) { dayT -= 1; dayCount++; }
    const light = clamp(Math.sin(dayT * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5, 0, 1);
    // boost: daylight grows plants
    for (const pl of plants) pl.update(dt, light);
    // remove dead plants, spawn new ones to keep meadow alive
    for (let i = plants.length - 1; i >= 0; i--) {
      if (plants[i].dead) {
        if (Math.random() < 0.5) plants[i] = new Plant(rand(10, W - 10));
        else plants.splice(i, 1);
      }
    }
    if (plants.length < 60 && Math.random() < 0.4) plants.push(new Plant(rand(10, W - 10)));

    for (const h of herbivores) updateCritter(h, dt, light);
    for (const c of carnivores) updateCritter(c, dt, light);
    for (let i = herbivores.length - 1; i >= 0; i--) if (herbivores[i].dead) {
      const d = herbivores[i];
      for (let k = 0; k < 6; k++) spawnSpark(d.x, d.y - 8, "rgba(180,200,170,0.7)");
      herbivores.splice(i, 1);
    }
    for (let i = carnivores.length - 1; i >= 0; i--) if (carnivores[i].dead) {
      const d = carnivores[i];
      for (let k = 0; k < 6; k++) spawnSpark(d.x, d.y - 8, "rgba(150,110,110,0.7)");
      carnivores.splice(i, 1);
    }
    // starvation / extinction safety: reseed if a tier collapses
    if (herbivores.length === 0 && plants.length > 30 && Math.random() < 0.02) {
      for (let i = 0; i < 3; i++) herbivores.push(new Critter(rand(40, W - 40), HERB));
    }
    if (plants.length < 20) { for (let i = 0; i < 20; i++) plants.push(new Plant(rand(10, W - 10))); }

    updateParticles(dt);

    histAccum += dt;
    if (histAccum > 0.25) {
      histAccum = 0;
      history.push({ p: plants.length, h: herbivores.length, c: carnivores.length });
      if (history.length > 240) history.shift();
    }
    return light;
  }

  function render(light) {
    // sky
    const cols = skyColors(dayT);
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, cols[0]); g.addColorStop(0.55, cols[1]); g.addColorStop(1, cols[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, groundY);

    // stars
    const starAlpha = clamp(1 - light * 2.2, 0, 1);
    if (starAlpha > 0.01) {
      for (const s of stars) {
        s.tw += 0.02;
        const a = starAlpha * (0.5 + 0.5 * Math.sin(s.tw));
        ctx.fillStyle = `rgba(255,255,240,${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
      }
    }

    // sun / moon
    const sp = sunPos(dayT);
    if (sp.up) {
      const isDay = dayT > 0.25 && dayT < 0.75;
      const col = isDay ? "#ffe9a8" : "#ffb27a";
      const r = isDay ? 34 : 26;
      const gr = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, r * 4);
      gr.addColorStop(0, rgba(col.startsWith("#") ? col : "#ffe9a8", 0.9));
      gr.addColorStop(0.2, rgba(col.startsWith("#") ? col : "#ffe9a8", 0.35));
      gr.addColorStop(1, rgba(col.startsWith("#") ? col : "#ffe9a8", 0));
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, r * 4, 0, 7); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 7); ctx.fill();
    } else {
      // moon
      const mx = sp.x, my = sp.y;
      const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 70);
      mg.addColorStop(0, "rgba(220,230,255,0.5)");
      mg.addColorStop(1, "rgba(220,230,255,0)");
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 70, 0, 7); ctx.fill();
      ctx.fillStyle = "#e8eefc";
      ctx.beginPath(); ctx.arc(mx, my, 22, 0, 7); ctx.fill();
      ctx.fillStyle = mix(cols[0], "#000000", 0.3);
      ctx.beginPath(); ctx.arc(mx + 8, my - 6, 20, 0, 7); ctx.fill();
    }

    // hills
    for (const h of hills) {
      ctx.fillStyle = mix(h.col, "#000000", (1 - light) * 0.55);
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      const base = groundY - groundY * 0.02;
      for (let i = 0; i < h.pts.length; i++) {
        const p = h.pts[i];
        const y = groundY - p.h * groundY * 0.5 - h.layer * 14;
        if (i === 0) ctx.lineTo(p.x * W, y);
        else {
          const prev = h.pts[i - 1];
          const px = prev.x * W, py = groundY - prev.h * groundY * 0.5 - h.layer * 14;
          const cx = (px + p.x * W) / 2;
          ctx.quadraticCurveTo(px, py, cx, (py + y) / 2);
          ctx.quadraticCurveTo(cx, (py + y) / 2, p.x * W, y);
        }
      }
      ctx.lineTo(W, groundY); ctx.closePath(); ctx.fill();
    }

    // ground
    const gg = ctx.createLinearGradient(0, groundY - 30, 0, H);
    gg.addColorStop(0, mix("#3a6b3a", "#0e1a10", (1 - light) * 0.6));
    gg.addColorStop(0.25, mix("#2f5a2c", "#0c160d", (1 - light) * 0.6));
    gg.addColorStop(1, mix("#1c3a1b", "#070d08", (1 - light) * 0.6));
    ctx.fillStyle = gg;
    ctx.fillRect(0, groundY - 2, W, H - groundY + 2);
    // grass line highlight
    ctx.strokeStyle = rgba("#7fc15a", (0.25 + 0.4 * light));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY - 1); ctx.lineTo(W, groundY - 1); ctx.stroke();

    // plants (sorted by x for depth not needed; draw all)
    for (const pl of plants) pl.draw(ctx, light);

    // critters sorted by x for slight depth
    const all = herbivores.concat(carnivores).sort((a, b) => a.x - b.x);
    for (const c of all) drawCritter(c, light);

    drawParticles();

    // night ambient overlay
    if (light < 0.5) {
      ctx.fillStyle = `rgba(8,16,40,${(0.5 - light) * 0.5})`;
      ctx.fillRect(0, 0, W, H);
    }
    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.4)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  // ---------- graph ----------
  const gcv = document.getElementById("graph");
  const gx = gcv.getContext("2d");
  function drawGraph() {
    const w = gcv.width, h = gcv.height;
    gx.clearRect(0, 0, w, h);
    gx.fillStyle = "rgba(255,255,255,0.03)";
    gx.fillRect(0, 0, w, h);
    if (history.length < 2) return;
    let maxv = 10;
    for (const e of history) maxv = Math.max(maxv, e.p, e.h, e.c);
    const plot = (key, col) => {
      gx.strokeStyle = col; gx.lineWidth = 1.6; gx.beginPath();
      history.forEach((e, i) => {
        const x = i / (history.length - 1) * w;
        const y = h - (e[key] / maxv) * (h - 6) - 3;
        i ? gx.lineTo(x, y) : gx.moveTo(x, y);
      });
      gx.stroke();
    };
    plot("p", rgba("#8fc46a", 0.55));
    plot("h", "#e8b06a");
    plot("c", "#d96a5b");
  }

  // ---------- HUD ----------
  const el = {
    cPlant: document.getElementById("cPlant"),
    cHerb: document.getElementById("cHerb"),
    cCarn: document.getElementById("cCarn"),
    phase: document.getElementById("phase"),
    fill: document.getElementById("dayFill")
  };
  function updateHUD(light) {
    el.cPlant.textContent = plants.length;
    el.cHerb.textContent = herbivores.length;
    el.cCarn.textContent = carnivores.length;
    el.phase.textContent = phaseName(dayT);
    el.fill.style.width = ((dayT % 1) * 100).toFixed(0) + "%";
  }

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.05) * speed;
    if (running) {
      // sub-step for stability at high speed
      const steps = speed > 1 ? 2 : 1;
      const sdt = dt / steps;
      for (let i = 0; i < steps; i++) step(sdt);
    } else {
      // still animate particles & light subtly
      dayT += 0;
    }
    // need light for render; recompute
    const light = clamp(Math.sin(dayT * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5, 0, 1);
    render(light);
    updateHUD(light);
    drawGraph();
    requestAnimationFrame(frame);
  }

  // ---------- interaction ----------
  canvas.addEventListener("pointerdown", (e) => {
    // scatter seed / spawn plant + maybe a grazer
    for (let i = 0; i < 6; i++) plants.push(new Plant(clamp(e.clientX + rand(-30, 30), 10, W - 10)));
    for (let i = 0; i < 5; i++) spawnSpark(e.clientX, groundY - 8, "#bfe88a");
    if (Math.random() < 0.4 && herbivores.length < 60) herbivores.push(new Critter(e.clientX, HERB));
  });
  let dragging = false;
  canvas.addEventListener("pointerdown", () => dragging = true);
  window.addEventListener("pointerup", () => dragging = false);
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    if (Math.random() < 0.3) {
      // disturb herbivores nearby
      for (const h of herbivores) if (Math.abs(h.x - e.clientX) < 60) h.fear = Math.max(h.fear, 0.6);
      for (let i = 0; i < 2; i++) spawnSpark(e.clientX + rand(-20, 20), groundY - rand(0, 20), "rgba(200,210,180,0.6)");
    }
  });

  // ---------- controls ----------
  const btnPlay = document.getElementById("btnPlay");
  btnPlay.addEventListener("click", () => {
    running = !running;
    btnPlay.textContent = running ? "Pause" : "Play";
    btnPlay.classList.toggle("active", running);
  });
  document.querySelectorAll("#controls [data-spd]").forEach((b) => {
    b.addEventListener("click", () => {
      speed = parseFloat(b.dataset.spd);
      document.querySelectorAll("#controls [data-spd]").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById("spdLbl").textContent = speed + "×";
    });
  });
  document.getElementById("btnReset").addEventListener("click", () => { reset(); });

  // fade intro
  const hint = document.getElementById("hint");
  const veil = document.getElementById("veil");
  setTimeout(() => { veil.classList.add("gone"); }, 350);
  setTimeout(() => { hint.style.opacity = "0"; }, 9000);

  window.addEventListener("resize", () => { makeStars(); makeHills(); });

  // ---------- go ----------
  reset();
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
