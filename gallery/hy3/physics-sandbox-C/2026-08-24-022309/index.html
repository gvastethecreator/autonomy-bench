<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Physics Sandbox</title>
<style>
  :root {
    --bg-0: #0a0e1a;
    --bg-1: #121a2e;
    --accent: #6ee7ff;
    --accent-2: #ff7eb6;
    --glass: rgba(20, 28, 48, 0.55);
    --glass-border: rgba(140, 170, 220, 0.18);
    --text: #dfe8ff;
    --text-dim: #8a98c0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-0); }

  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #stage { position: fixed; inset: 0; display: block; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }

  /* ---- Top title ---- */
  .title {
    position: fixed;
    top: 22px; left: 26px;
    z-index: 5;
    pointer-events: none;
  }
  .title h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  /* ---- Control panel ---- */
  .panel {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 5;
    width: 232px;
    padding: 16px 16px 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: opacity .35s ease, transform .35s ease;
  }
  .panel.hidden { opacity: 0; transform: translateX(20px); pointer-events: none; }

  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .row { margin-bottom: 13px; }
  .row label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text); margin-bottom: 6px;
  }
  .row label span.val { color: var(--accent); font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent) 0%, rgba(110,231,255,0.15) 100%);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #eaf6ff;
    border: 2px solid var(--accent);
    box-shadow: 0 0 10px rgba(110,231,255,0.7);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #eaf6ff; border: 2px solid var(--accent); cursor: pointer;
  }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  button {
    font-family: inherit;
    font-size: 12px; font-weight: 600;
    color: var(--text);
    padding: 9px 6px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(40, 54, 86, 0.5);
    cursor: pointer;
    transition: background .18s, transform .1s, border-color .18s;
  }
  button:hover { background: rgba(60, 78, 120, 0.7); border-color: rgba(140,170,220,0.4); }
  button:active { transform: scale(0.95); }
  button.accent {
    background: linear-gradient(135deg, rgba(110,231,255,0.22), rgba(255,126,182,0.22));
    border-color: rgba(110,231,255,0.45);
  }
  button.wide { grid-column: 1 / -1; }

  .toggle-row { display: flex; gap: 8px; margin-top: 10px; }
  .toggle-row button { flex: 1; }

  /* ---- Hint bar ---- */
  .hint {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 8px 16px;
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
    transition: opacity .4s ease;
  }
  .hint b { color: var(--text); font-weight: 600; }

  /* ---- Stats ---- */
  .stats {
    position: fixed;
    bottom: 18px; left: 22px;
    z-index: 5;
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    line-height: 1.6;
    pointer-events: none;
  }
  .stats b { color: var(--accent); }

  .fade-out { opacity: 0 !important; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="title">
    <h1>PHYSICS SANDBOX</h1>
    <p>impulse-based · interactive · live</p>
  </div>

  <div class="panel" id="panel">
    <h2>Controls</h2>
    <div class="row">
      <label>Gravity <span class="val" id="gVal">1.0</span></label>
      <input type="range" id="gravity" min="0" max="3" step="0.05" value="1">
    </div>
    <div class="row">
      <label>Bounciness <span class="val" id="rVal">0.72</span></label>
      <input type="range" id="rest" min="0" max="0.98" step="0.01" value="0.72">
    </div>
    <div class="row">
      <label>Air drag <span class="val" id="dVal">0.012</span></label>
      <input type="range" id="drag" min="0" max="0.08" step="0.002" value="0.012">
    </div>
    <div class="row">
      <label>Body size <span class="val" id="sVal">26</span></label>
      <input type="range" id="size" min="10" max="56" step="1" value="26">
    </div>
    <div class="btns">
      <button class="accent" id="rain">Rain</button>
      <button id="burst">Burst</button>
      <button id="boom">Boom</button>
      <button id="clear">Clear</button>
      <button class="wide" id="pause">Pause</button>
    </div>
    <div class="toggle-row">
      <button id="grid">Grid</button>
      <button id="trails">Trails</button>
    </div>
  </div>

  <div class="hint" id="hint">
    <b>Drag</b> to grab &amp; throw · <b>Click</b> empty space to drop · <b>Right-click</b> for a heavy one · <b>H</b> hides panel
  </div>

  <div class="stats" id="stats">
    bodies <b id="stCount">0</b> · fps <b id="stFps">0</b>
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Config (driven by UI) ----------
  const cfg = {
    gravity: 1.0,
    restitution: 0.72,
    airDrag: 0.012,
    size: 26,
    showGrid: true,
    showTrails: false,
    paused: false,
  };

  const GRAV = 1400; // px/s^2 at gravity = 1

  // ---------- Body ----------
  const palette = [
    ["#6ee7ff", "#1d6e88"],
    ["#ff7eb6", "#8a2a55"],
    ["#ffd166", "#9a6b18"],
    ["#9b8cff", "#473a9c"],
    ["#7dffb0", "#1d7a4d"],
    ["#ff9f6e", "#9a4d1d"],
    ["#5cc8ff", "#1d5a9c"],
  ];

  class Body {
    constructor(x, y, r, heavy) {
      this.x = x; this.y = y;
      this.px = x; this.py = y;
      this.vx = 0; this.vy = 0;
      this.r = r;
      this.mass = heavy ? r * r * 2.4 : r * r;
      this.inv = 1 / this.mass;
      const c = palette[(Math.random() * palette.length) | 0];
      this.c0 = c[0]; this.c1 = c[1];
      this.spin = (Math.random() - 0.5) * 0.6;
      this.angle = Math.random() * Math.PI * 2;
      this.grabbed = false;
      this.trail = [];
    }
  }

  let bodies = [];

  function addBody(x, y, r, vx, vy, heavy) {
    const b = new Body(x, y, r, heavy);
    b.vx = vx || 0; b.vy = vy || 0;
    bodies.push(b);
    if (bodies.length > 260) bodies.shift();
    return b;
  }

  // ---------- Interaction ----------
  const mouse = { x: 0, y: 0, down: false, prevx: 0, prevy: 0, vx: 0, vy: 0 };
  let grabbed = null;

  function pointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function bodyAt(x, y) {
    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      const dx = b.x - x, dy = b.y - y;
      if (dx * dx + dy * dy <= b.r * b.r) return b;
    }
    return null;
  }

  function onDown(e) {
    if (e.button === 2) return; // handled by contextmenu
    const p = pointerPos(e);
    mouse.x = mouse.prevx = p.x;
    mouse.y = mouse.prevy = p.y;
    mouse.down = true;
    const b = bodyAt(p.x, p.y);
    if (b) {
      grabbed = b;
      b.grabbed = true;
      canvas.classList.add("grabbing");
    } else {
      // drop a body at click point
      addBody(p.x, p.y, cfg.size * (0.7 + Math.random() * 0.6),
              (Math.random() - 0.5) * 120, 0, false);
    }
  }

  function onMove(e) {
    const p = pointerPos(e);
    mouse.vx = p.x - mouse.x;
    mouse.vy = p.y - mouse.y;
    mouse.x = p.x; mouse.y = p.y;
    if (e.cancelable) e.preventDefault();
  }

  function onUp() {
    if (grabbed) {
      // throw with pointer velocity
      grabbed.vx = mouse.vx * 22;
      grabbed.vy = mouse.vy * 22;
      grabbed.grabbed = false;
      grabbed = null;
    }
    mouse.down = false;
    canvas.classList.remove("grabbing");
  }

  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); onDown(e); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); onMove(e); }, { passive: false });
  canvas.addEventListener("touchend", (e) => { e.preventDefault(); onUp(); }, { passive: false });
  canvas.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const p = pointerPos(e);
    addBody(p.x, p.y, cfg.size * 1.9, 0, 60, true);
  });

  // ---------- Physics step ----------
  function step(dt) {
    const g = GRAV * cfg.gravity;
    const dragFactor = Math.max(0, 1 - cfg.airDrag);

    // integrate
    for (const b of bodies) {
      if (b.grabbed) {
        // spring toward pointer
        const k = 18, damp = 0.86;
        const tx = mouse.x, ty = mouse.y;
        b.vx = (b.vx + (tx - b.x) * k * dt) * damp;
        b.vy = (b.vy + (ty - b.y) * k * dt) * damp;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        continue;
      }
      b.vy += g * dt;
      b.vx *= dragFactor;
      b.vy *= dragFactor;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.angle += b.spin * dt * (0.4 + Math.min(1, Math.hypot(b.vx, b.vy) / 600));
    }

    // collisions: walls
    for (const b of bodies) {
      if (b.x - b.r < 0) { b.x = b.r; b.vx = -b.vx * cfg.restitution; b.spin += b.vy * 0.0008; }
      else if (b.x + b.r > W) { b.x = W - b.r; b.vx = -b.vx * cfg.restitution; b.spin -= b.vy * 0.0008; }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = -b.vy * cfg.restitution; }
      else if (b.y + b.r > H) {
        b.y = H - b.r; b.vy = -b.vy * cfg.restitution;
        b.vx *= 0.94; // ground friction
        b.spin *= 0.9;
      }
    }

    // collisions: pairs (sub-iterated)
    const n = bodies.length;
    for (let iter = 0; iter < 4; iter++) {
      for (let i = 0; i < n; i++) {
        const a = bodies[i];
        for (let j = i + 1; j < n; j++) {
          const b = bodies[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy;
          const rsum = a.r + b.r;
          if (d2 >= rsum * rsum || d2 === 0) continue;
          let d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d;
          const overlap = rsum - d;
          // positional correction
          const totalInv = a.inv + b.inv;
          const corr = overlap / totalInv * 0.8;
          if (!a.grabbed) { a.x -= nx * corr * a.inv; a.y -= ny * corr * a.inv; }
          if (!b.grabbed) { b.x += nx * corr * b.inv; b.y += ny * corr * b.inv; }
          // relative velocity along normal
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn > 0) continue;
          const e = cfg.restitution;
          const jImp = -(1 + e) * vn / totalInv;
          const ix = jImp * nx, iy = jImp * ny;
          if (!a.grabbed) { a.vx -= ix * a.inv; a.vy -= iy * a.inv; }
          if (!b.grabbed) { b.vx += ix * b.inv; b.vy += iy * b.inv; }
          // tangential friction -> spin
          const tx = -ny, ty = nx;
          const vt = rvx * tx + rvy * ty;
          const fric = 0.04;
          const jf = -vt * fric / totalInv;
          if (!a.grabbed) { a.vx -= jf * tx * a.inv; a.vy -= jf * ty * a.inv; }
          if (!b.grabbed) { b.vx += jf * tx * b.inv; b.vy += jf * ty * b.inv; }
          a.spin += jf * 0.02;
          b.spin -= jf * 0.02;
        }
      }
    }
  }

  // ---------- Rendering ----------
  function drawBackground() {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.38, 80, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#161f38");
    g.addColorStop(0.6, "#0d1426");
    g.addColorStop(1, "#070a14");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (cfg.showGrid) {
      ctx.save();
      ctx.strokeStyle = "rgba(120,150,210,0.05)";
      ctx.lineWidth = 1;
      const gs = 46;
      ctx.beginPath();
      for (let x = gs; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = gs; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBody(b) {
    const speed = Math.hypot(b.vx, b.vy);
    const glow = Math.min(0.6, speed / 1100);

    // soft shadow
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(b.x + b.r * 0.18, b.y + b.r * 0.28, b.r * 0.95, b.r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // glow halo
    if (glow > 0.02) {
      ctx.save();
      ctx.globalAlpha = glow * 0.5;
      const gg = ctx.createRadialGradient(b.x, b.y, b.r * 0.5, b.x, b.y, b.r * 1.8);
      gg.addColorStop(0, b.c0);
      gg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // body sphere with lighting
    const lx = b.x - b.r * 0.35, ly = b.y - b.r * 0.4;
    const grad = ctx.createRadialGradient(lx, ly, b.r * 0.15, b.x, b.y, b.r);
    grad.addColorStop(0, b.c0);
    grad.addColorStop(0.65, b.c0);
    grad.addColorStop(1, b.c1);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    // rim light
    ctx.save();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r - 0.8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // specular highlight
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.ellipse(lx, ly, b.r * 0.26, b.r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // tiny spin marker so rotation reads
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = b.c1;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(b.r * 0.7, 0);
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    if (cfg.showTrails) {
      ctx.fillStyle = "rgba(7,10,20,0.18)";
      ctx.fillRect(0, 0, W, H);
      drawBackground();
    } else {
      drawBackground();
    }
    for (const b of bodies) drawBody(b);

    // vignette
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.45)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- Spawn helpers ----------
  function rain(count) {
    count = count || 14;
    for (let i = 0; i < count; i++) {
      addBody(Math.random() * W, -20 - Math.random() * 120,
              cfg.size * (0.6 + Math.random() * 0.8),
              (Math.random() - 0.5) * 120, Math.random() * 80, false);
    }
  }
  function burst() {
    const cx = W * 0.5, cy = H * 0.45;
    const n = 26;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const sp = 260 + Math.random() * 240;
      addBody(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30,
              cfg.size * (0.6 + Math.random() * 0.6),
              Math.cos(a) * sp, Math.sin(a) * sp, false);
    }
  }
  function boom() {
    const cx = mouse.x || W * 0.5, cy = mouse.y || H * 0.5;
    for (const b of bodies) {
      const dx = b.x - cx, dy = b.y - cy;
      const d = Math.hypot(dx, dy) || 1;
      const f = Math.min(1600, 52000 / (d + 40));
      b.vx += (dx / d) * f;
      b.vy += (dy / d) * f;
    }
    // flash
    flash = 1;
  }

  let flash = 0;

  // ---------- Loop ----------
  let last = performance.now();
  let acc = 0;
  const FIXED = 1 / 120;
  let fpsT = 0, fpsN = 0, fps = 0;
  let hintTimer = performance.now();

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    if (!cfg.paused) {
      acc += dt;
      let steps = 0;
      while (acc >= FIXED && steps < 8) { step(FIXED); acc -= FIXED; steps++; }
    }

    render();

    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = flash * 0.5;
      ctx.fillStyle = "#bfeaff";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      flash *= 0.86;
      if (flash < 0.02) flash = 0;
    }

    // fade hint after a while
    if (now - hintTimer > 8000) document.getElementById("hint").classList.add("fade-out");

    fpsN++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0;
      document.getElementById("stFps").textContent = fps;
      document.getElementById("stCount").textContent = bodies.length;
    }

    requestAnimationFrame(frame);
  }

  // ---------- UI wiring ----------
  const bind = (id, key, el, fmt) => {
    const input = document.getElementById(id);
    const out = document.getElementById(el);
    const upd = () => {
      cfg[key] = parseFloat(input.value);
      out.textContent = fmt ? fmt(cfg[key]) : input.value;
    };
    input.addEventListener("input", upd);
    upd();
  };
  bind("gravity", "gravity", "gVal", v => v.toFixed(2));
  bind("rest", "restitution", "rVal", v => v.toFixed(2));
  bind("drag", "airDrag", "dVal", v => v.toFixed(3));
  bind("size", "size", "sVal", v => Math.round(v));

  document.getElementById("rain").addEventListener("click", () => rain(16));
  document.getElementById("burst").addEventListener("click", burst);
  document.getElementById("boom").addEventListener("click", boom);
  document.getElementById("clear").addEventListener("click", () => { bodies = []; });

  const pauseBtn = document.getElementById("pause");
  pauseBtn.addEventListener("click", () => {
    cfg.paused = !cfg.paused;
    pauseBtn.textContent = cfg.paused ? "Resume" : "Pause";
    pauseBtn.classList.toggle("accent", cfg.paused);
  });

  const gridBtn = document.getElementById("grid");
  const trailsBtn = document.getElementById("trails");
  gridBtn.addEventListener("click", () => {
    cfg.showGrid = !cfg.showGrid;
    gridBtn.classList.toggle("accent", cfg.showGrid);
  });
  trailsBtn.addEventListener("click", () => {
    cfg.showTrails = !cfg.showTrails;
    trailsBtn.classList.toggle("accent", cfg.showTrails);
  });
  gridBtn.classList.add("accent");

  window.addEventListener("keydown", (e) => {
    if (e.key === "h" || e.key === "H") {
      document.getElementById("panel").classList.toggle("hidden");
    } else if (e.key === " ") {
      e.preventDefault();
      pauseBtn.click();
    } else if (e.key === "r" || e.key === "R") rain(16);
    else if (e.key === "c" || e.key === "C") bodies = [];
  });

  // ---------- Initial scene ----------
  rain(10);
  setTimeout(() => rain(8), 400);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
