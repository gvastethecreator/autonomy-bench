<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aldermere — A Living Medieval City</title>
<style>
  :root { --ink:#f3e7cf; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* Cinematic vignette + grain */
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode:multiply;
  }
  #title {
    position:fixed; left:0; right:0; top:8%; z-index:6; pointer-events:none;
    text-align:center; color:var(--ink);
    text-shadow:0 2px 14px rgba(0,0,0,0.8), 0 0 30px rgba(255,190,120,0.25);
    opacity:0; transform:translateY(-12px);
    transition:opacity 2.2s ease, transform 2.2s ease;
  }
  #title.show { opacity:1; transform:translateY(0); }
  #title h1 { font-size:clamp(28px,5vw,62px); letter-spacing:0.14em; font-weight:600; }
  #title .sub { margin-top:10px; font-size:clamp(12px,1.6vw,18px); letter-spacing:0.42em; text-transform:uppercase; opacity:0.78; }

  #hud {
    position:fixed; left:18px; bottom:16px; z-index:6; pointer-events:none;
    color:var(--ink); font-size:12.5px; letter-spacing:0.06em; opacity:0.82;
    text-shadow:0 1px 6px rgba(0,0,0,0.9);
  }
  #hud b { font-weight:600; letter-spacing:0.12em; color:#ffd9a3; }
  #clock {
    position:fixed; right:18px; bottom:16px; z-index:6; pointer-events:none;
    color:var(--ink); font-size:12.5px; letter-spacing:0.18em; opacity:0.82;
    text-shadow:0 1px 6px rgba(0,0,0,0.9); text-align:right;
  }
  #clock .phase { color:#ffd9a3; font-weight:600; }

  #loader {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#07080d; color:#caa56b; letter-spacing:0.4em; text-transform:uppercase; font-size:13px;
    transition:opacity 1s ease;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  .pulse { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title">
  <h1>ALDERMERE</h1>
  <div class="sub">A Living Medieval City</div>
</div>
<div id="hud">
  <div><b>drag</b> to look &nbsp;·&nbsp; <b>scroll</b> to zoom &nbsp;·&nbsp; <b>space</b> pause time &nbsp;·&nbsp; <b>D</b> day &nbsp;·&nbsp; <b>N</b> night</div>
</div>
<div id="clock"><span class="phase">—</span><br><span id="timetext">tide of the sun</span></div>
<div id="loader"><span class="pulse">Raising the city…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) { document.getElementById('loader').textContent = 'Failed to load Three.js'; return; }

  // ---------- Seeded RNG ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  let RNG = mulberry32(20260824);
  const rnd = (a=1,b=0)=> b + (a-b)*RNG();
  const rint = (a,b)=> Math.floor(rnd(a,b+1));
  const pick = (arr)=> arr[Math.floor(RNG()*arr.length)];

  // ---------- Renderer / Scene / Camera ----------
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x9fb0c0, 0.0085);

  const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.5, 2000);
  const camState = { theta: 0.7, phi: 1.05, radius: 150, target: new THREE.Vector3(0, 8, 0) };
  function applyCamera(){
    const r = camState.radius, ph = camState.phi, th = camState.theta;
    camera.position.set(
      camState.target.x + r*Math.sin(ph)*Math.cos(th),
      camState.target.y + r*Math.cos(ph),
      camState.target.z + r*Math.sin(ph)*Math.sin(th)
    );
    camera.lookAt(camState.target);
  }

  // ---------- Lights ----------
  const hemi = new THREE.HemisphereLight(0xbfd3e6, 0x4a3b2a, 0.55);
  scene.add(hemi);

  const ambient = new THREE.AmbientLight(0xffffff, 0.18);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffe6b8, 1.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 600;
  const S = 220;
  sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
  sun.shadow.camera.top = S; sun.shadow.camera.bottom = -S;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.6;
  scene.add(sun);
  scene.add(sun.target);

  const moon = new THREE.DirectionalLight(0x9db8ff, 0.0);
  scene.add(moon);

  // ---------- Sky dome (gradient shader) ----------
  const skyGeo = new THREE.SphereGeometry(1000, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms: {
      topColor:{value:new THREE.Color(0x2a4f86)},
      midColor:{value:new THREE.Color(0x95b4d6)},
      botColor:{value:new THREE.Color(0xd9c9a8)},
      offset:{value:0.0}, exponent:{value:0.9}
    },
    vertexShader:`varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec3 vP; uniform vec3 topColor; uniform vec3 midColor; uniform vec3 botColor; uniform float exponent;
      void main(){ float h = normalize(vP).y; float t = max(h,0.0);
        vec3 col = t>0.5 ? mix(midColor,topColor,pow((t-0.5)*2.0,exponent)) : mix(botColor,midColor,pow(t*2.0,exponent));
        gl_FragColor = vec4(col,1.0);} `
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // Stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 1400; const sPos = new Float32Array(starCount*3);
  for (let i=0;i<starCount;i++){
    const u=rnd(0,1), v=rnd(0,1), th=2*Math.PI*u, ph=Math.acos(2*v-1);
    const R=900;
    sPos[i*3]=R*Math.sin(ph)*Math.cos(th);
    sPos[i*3+1]=Math.abs(R*Math.cos(ph))*0.9+40;
    sPos[i*3+2]=R*Math.sin(ph)*Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
  const starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2, sizeAttenuation:false, transparent:true, opacity:0, depthWrite:false });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // ---------- Ground ----------
  function makeGroundTexture(){
    const c = document.createElement('canvas'); c.width=c.height=2048;
    const g = c.getContext('2d');
    // base earth/grass
    g.fillStyle='#4f5a36'; g.fillRect(0,0,2048,2048);
    // mottled noise
    for(let i=0;i<26000;i++){
      const x=rnd(0,2048), y=rnd(0,2048), s=rnd(2,7);
      const shade = rnd(0,1);
      g.fillStyle = shade<0.5 ? 'rgba(60,70,40,0.5)' : 'rgba(120,120,70,0.35)';
      g.fillRect(x,y,s,s);
    }
    // road network: a grid of cobbled streets
    const roads = 5; const step = 2048/roads;
    function road(x0,y0,x1,y1,w){
      g.strokeStyle='#7d7363'; g.lineWidth=w; g.lineCap='round';
      g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
      g.strokeStyle='#928878'; g.lineWidth=w*0.55; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
      // cobble ticks
      g.strokeStyle='rgba(60,54,46,0.5)'; g.lineWidth=2;
      const len=Math.hypot(x1-x0,y1-y0); const n=Math.floor(len/14);
      const ang=Math.atan2(y1-y0,x1-x0);
      for(let k=0;k<n;k++){
        const px=x0+(x1-x0)*k/n, py=y0+(y1-y0)*k/n;
        g.beginPath();
        g.moveTo(px-Math.sin(ang)*w*0.4, py+Math.cos(ang)*w*0.4);
        g.lineTo(px+Math.sin(ang)*w*0.4, py-Math.cos(ang)*w*0.4);
        g.stroke();
      }
    }
    const roadW = 46;
    for(let i=0;i<=roads;i++){
      road(i*step,0,i*step,2048,roadW);
      road(0,i*step,2048,i*step,roadW);
    }
    // diagonal market road
    road(0,0,2048,2048,roadW*0.8);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.anisotropy=8; tex.encoding=THREE.sRGBEncoding;
    return tex;
  }
  const groundTex = makeGroundTexture();
  const groundMat = new THREE.MeshStandardMaterial({ map:groundTex, roughness:1.0, metalness:0.0 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900,900), groundMat);
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
  scene.add(ground);

  // ---------- Building facade styles (map + emissive mask) ----------
  const WALL_PALETTE = ['#cabf9f','#b89a72','#c9b79a','#a98c63','#d3c3a3','#9c8e74','#bfae8c','#c4b393'];
  const ROOF_PALETTE = ['#7a3b2e','#5d4030','#6b4a2f','#8a4b35','#4a3326','#70422c'];

  function makeStyle(idx){
    const W=256,H=512;
    const fc=document.createElement('canvas'); fc.width=W; fc.height=H; const fg=fc.getContext('2d');
    const mc=document.createElement('canvas'); mc.width=W; mc.height=H; const mg=mc.getContext('2d');
    const wall = WALL_PALETTE[idx%WALL_PALETTE.length];
    fg.fillStyle=wall; fg.fillRect(0,0,W,H);
    // subtle vertical timber lines
    fg.strokeStyle='rgba(90,70,45,0.25)'; fg.lineWidth=2;
    for(let x=14;x<W;x+=34){ fg.beginPath(); fg.moveTo(x,0); fg.lineTo(x,H); fg.stroke(); }
    // horizontal beams
    fg.strokeStyle='rgba(70,52,33,0.3)'; fg.lineWidth=5;
    fg.beginPath(); fg.moveTo(0,H*0.5); fg.lineTo(W,H*0.5); fg.stroke();
    mg.fillStyle='#000'; mg.fillRect(0,0,W,H);
    // windows
    const cols = rint(2,3), rows = rint(3,4);
    const pad=34; const ww=34, wh=46;
    const gx=(W-pad*2-cols*ww)/(cols+1), gy=(H-pad*2-rows*wh)/(rows+1);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=pad+gx*(c+1)+ww*c, y=pad+gy*(r+1)+wh*r;
      // window frame on facade
      fg.fillStyle='#3b2c1c'; fg.fillRect(x-3,y-3,ww+6,wh+6);
      fg.fillStyle='#6f86a8'; fg.fillRect(x,y,ww,wh);
      // mullion
      fg.strokeStyle='#3b2c1c'; fg.lineWidth=3;
      fg.beginPath(); fg.moveTo(x+ww/2,y); fg.lineTo(x+ww/2,y+wh); fg.stroke();
      fg.beginPath(); fg.moveTo(x,y+wh/2); fg.lineTo(x+ww,y+wh/2); fg.stroke();
      // emissive mask
      mg.fillStyle='#ffd27a'; mg.fillRect(x,y,ww,wh);
    }
    // door at bottom
    const dw=48,dh=70, dx=W/2-dw/2, dy=H-dh;
    fg.fillStyle='#2e2113'; fg.fillRect(dx,dy,dw,dh);
    fg.fillStyle='#473421'; fg.fillRect(dx+6,dy+6,dw-12,dh-6);
    const tex=new THREE.CanvasTexture(fc); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=4;
    const mask=new THREE.CanvasTexture(mc); tex.anisotropy=4;
    return { tex, mask };
  }
  const STYLES = []; for(let i=0;i<8;i++) STYLES.push(makeStyle(i));

  // shared roof material (color set per mesh)
  function roofMat(color){ return new THREE.MeshStandardMaterial({ color, roughness:0.85, metalness:0.0 }); }

  // Building factory -> returns Group
  function makeHouse(){
    const g = new THREE.Group();
    const style = pick(STYLES);
    const w = rnd(7,12), d = rnd(7,12), floors = rint(1,2);
    const h = floors* (rnd(5,6.5));
    const mat = new THREE.MeshStandardMaterial({ map:style.tex, emissiveMap:style.mask, emissive:0xffcf7a, emissiveIntensity:0.0, roughness:0.95 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    body.position.y = h/2; body.castShadow=true; body.receiveShadow=true;
    g.add(body);

    // roof: 4-sided pyramid
    const rc = pick(ROOF_PALETTE);
    const roofGeo = new THREE.ConeGeometry(Math.max(w,d)*0.78, rnd(3.5,5.5), 4);
    const roof = new THREE.Mesh(roofGeo, roofMat(rc));
    roof.rotation.y = Math.PI/4;
    roof.position.y = h + (roofGeo.parameters.height/2) - 0.2;
    roof.castShadow=true;
    g.add(roof);

    g.userData.bodyMat = mat;
    g.userData.height = h + roofGeo.parameters.height;
    return g;
  }

  function makeTower(tall){
    const g = new THREE.Group();
    const style = pick(STYLES);
    const rad = rnd(4,6.5);
    const h = tall ? rnd(34,52) : rnd(16,26);
    const mat = new THREE.MeshStandardMaterial({ map:style.tex, emissiveMap:style.mask, emissive:0xffcf7a, emissiveIntensity:0.0, roughness:0.95 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad*1.06, h, 12), mat);
    body.position.y=h/2; body.castShadow=true; body.receiveShadow=true; g.add(body);
    const rc = pick(ROOF_PALETTE);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(rad*1.15, rnd(7,11), 12), roofMat(rc));
    cap.position.y = h + (cap.geometry.parameters.height)/2 - 0.3; cap.castShadow=true; g.add(cap);
    // battlement ring for shorter towers
    if(!tall && RNG()<0.6){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(rad*1.02, 0.7, 6, 16), roofMat('#6b6b6b'));
      ring.rotation.x=Math.PI/2; ring.position.y=h-1; g.add(ring);
    }
    g.userData.bodyMat = mat;
    return g;
  }

  // ---------- City placement ----------
  const city = new THREE.Group(); scene.add(city);
  const cityRadius = 110;
  const cell = 24; // block size
  const occupado = [];

  // roads at multiples of gridStep
  const gridStep = 2048/5; // matches ground texture (in texture px). Map to world: 900 plane.
  // We'll just avoid a grid in world space aligned to ground roads.
  const roadSpacing = (900/5); // 180 world units between main roads
  function nearRoad(x,z,margin){
    const m = margin||16;
    const half=roadSpacing/2;
    // distance to nearest road line (both axes), roads at -2*..2*?
    // ground roads drawn at i*step for i=0..5 across 2048 mapped to 900 centered.
    // world road positions:
    for(let i=0;i<=5;i++){
      const wpos = -450 + i*roadSpacing;
      if(Math.abs(x-wpos)<m || Math.abs(z-wpos)<m) return true;
    }
    return false;
  }

  // Keep a clear plaza in center for the castle; keep distance from center
  function placeOnGrid(){
    for(let tries=0; tries<4000; tries++){
      const gx = Math.round(rnd(-4,4)); // block index
      const gz = Math.round(rnd(-4,4));
      const x = gx*roadSpacing + rnd(-roadSpacing*0.32,roadSpacing*0.32);
      const z = gz*roadSpacing + rnd(-roadSpacing*0.32,roadSpacing*0.32);
      const distC = Math.hypot(x,z);
      if(distC < 30) continue;            // castle plaza
      if(distC > cityRadius) continue;
      if(nearRoad(x,z,14)) continue;
      // overlap check (coarse)
      let ok=true;
      for(const o of occupado){ if(Math.hypot(o.x-x,o.z-z) < o.r){ ok=false; break; } }
      if(!ok) continue;
      occupado.push({x,z,r:13});
      return {x,z};
    }
    return null;
  }

  const buildingMats = [];
  let count=0;
  while(count<150){
    const p = placeOnGrid(); if(!p) break;
    let b;
    const roll = RNG();
    if(roll < 0.12 && Math.hypot(p.x,p.z) > 40) b = makeTower(false);
    else b = makeHouse();
    b.position.set(p.x, 0, p.z);
    b.rotation.y = rnd(0, Math.PI*2);
    city.add(b);
    if(b.userData.bodyMat) buildingMats.push(b.userData.bodyMat);
    count++;
  }

  // ---------- Castle (central keep + curtain + towers + gate) ----------
  function buildCastle(){
    const g = new THREE.Group();
    const stoneMat = new THREE.MeshStandardMaterial({ color:0xb9b2a3, roughness:0.95 });
    const stoneDark = new THREE.MeshStandardMaterial({ color:0x9a9486, roughness:0.95 });
    const keepMat = new THREE.MeshStandardMaterial({ map:STYLES[0].tex, emissiveMap:STYLES[0].mask, emissive:0xffcf7a, emissiveIntensity:0.0, roughness:0.95 });
    buildingMats.push(keepMat);

    // Keep
    const keep = new THREE.Mesh(new THREE.BoxGeometry(20,40,20), keepMat);
    keep.position.y=20; keep.castShadow=true; keep.receiveShadow=true; g.add(keep);
    const keepRoof = new THREE.Mesh(new THREE.ConeGeometry(15,12,4), roofMat('#5d4030'));
    keepRoof.rotation.y=Math.PI/4; keepRoof.position.y=46; keepRoof.castShadow=true; g.add(keepRoof);

    // corner towers
    const tp=[[14,14],[-14,14],[14,-14],[-14,-14]];
    for(const [tx,tz] of tp){
      const t = new THREE.Mesh(new THREE.CylinderGeometry(5,5.4,52,14), stoneMat);
      t.position.set(tx,26,tz); t.castShadow=true; t.receiveShadow=true; g.add(t);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(6,12,14), roofMat('#7a3b2e'));
      cap.position.set(tx,58,tz); cap.castShadow=true; g.add(cap);
      // torch on tower
      addTorch(g, tx, 40, tz, 18);
    }
    // curtain walls (4 sides)
    const wallLen=28, wallH=16, wt=4;
    function wall(x,z,len,rot){
      const m=new THREE.Mesh(new THREE.BoxGeometry(len,wallH,wt), stoneMat);
      m.position.set(x,wallH/2,z); m.rotation.y=rot; m.castShadow=true; m.receiveShadow=true; g.add(m);
      // crenellations
      const n=Math.floor(len/4);
      for(let i=0;i<n;i++){
        const c=new THREE.Mesh(new THREE.BoxGeometry(2,3,wt), stoneDark);
        c.position.set(x-Math.cos(rot)*len/2 + Math.cos(rot)*(i*4+2), wallH+1.5, z-Math.sin(rot)*len/2 + Math.sin(rot)*(i*4+2));
        c.rotation.y=rot; g.add(c);
      }
    }
    wall(0,14,wallLen,0); wall(0,-14,wallLen,0);
    wall(14,0,wallLen,Math.PI/2); wall(-14,0,wallLen,Math.PI/2);
    // gatehouse
    const gate=new THREE.Mesh(new THREE.BoxGeometry(10,18,6), stoneMat);
    gate.position.set(0,9,14); gate.castShadow=true; gate.receiveShadow=true; g.add(gate);
    const arch=new THREE.Mesh(new THREE.BoxGeometry(5,10,7), new THREE.MeshStandardMaterial({color:0x2a2018, roughness:1}));
    arch.position.set(0,5,14.2); g.add(arch);
    addTorch(g, 4, 12, 14, 16); addTorch(g, -4, 12, 14, 16);
    return g;
  }

  // ---------- Cathedral ----------
  function buildCathedral(){
    const g=new THREE.Group();
    const stone=new THREE.MeshStandardMaterial({color:0xd8d2c2, roughness:0.9});
    const stone2=new THREE.MeshStandardMaterial({color:0xc4bda8, roughness:0.9});
    const winMat=new THREE.MeshStandardMaterial({color:0x2a3a55, emissive:0xffcaa0, emissiveIntensity:0.0, roughness:0.6});
    g.userData.winMat=winMat; cathedralMats.push(winMat);

    const nave=new THREE.Mesh(new THREE.BoxGeometry(18,22,40), stone);
    nave.position.y=11; nave.castShadow=true; nave.receiveShadow=true; g.add(nave);
    // pitched roof
    const roof=new THREE.Mesh(new THREE.CylinderGeometry(9.2,9.2,40,3,1), roofMat('#6b4a2f'));
    roof.rotation.z=Math.PI/2; roof.position.y=22; g.add(roof);
    // transept
    const tran=new THREE.Mesh(new THREE.BoxGeometry(40,16,14), stone2);
    tran.position.y=8; tran.castShadow=true; tran.receiveShadow=true; g.add(tran);
    // crossing tower + spire
    const tower=new THREE.Mesh(new THREE.BoxGeometry(12,30,12), stone);
    tower.position.y=15+22; tower.castShadow=true; g.add(tower);
    const spire=new THREE.Mesh(new THREE.ConeGeometry(9,34,4), roofMat('#5d4030'));
    spire.rotation.y=Math.PI/4; spire.position.y=15+22+30+17; spire.castShadow=true; g.add(spire);
    const spireTip=new THREE.Mesh(new THREE.ConeGeometry(2,8,8), new THREE.MeshStandardMaterial({color:0xcfc08a, metalness:0.6, roughness:0.4}));
    spireTip.position.y=15+22+30+34+4; g.add(spireTip);
    // rose window (emissive)
    const rose=new THREE.Mesh(new THREE.CircleGeometry(4,24), winMat);
    rose.position.set(0,26,-20.1); g.add(rose);
    // door
    const door=new THREE.Mesh(new THREE.BoxGeometry(6,10,1), new THREE.MeshStandardMaterial({color:0x2a2018}));
    door.position.set(0,5,20.1); g.add(door);
    // side windows
    for(let i=-1;i<=1;i++){
      const w=new THREE.Mesh(new THREE.PlaneGeometry(3,7), winMat);
      w.position.set(i*7, 12, 20.05); g.add(w);
    }
    return g;
  }

  const cathedralMats=[];
  const cathedral = buildCathedral();
  cathedral.position.set(60, 0, -40);
  cathedral.rotation.y = -0.4;
  scene.add(cathedral);

  const castle = buildCastle();
  scene.add(castle);

  // ---------- City wall ring (partial, open toward viewer) ----------
  (function buildCityWalls(){
    const g=new THREE.Group();
    const stone=new THREE.MeshStandardMaterial({color:0xa89f8c, roughness:0.96});
    const segLen=18, segH=14, wt=3.5, R=cityRadius+6;
    const segs=40;
    for(let i=0;i<segs;i++){
      const a=(i/segs)*Math.PI*2;
      // leave a gap (gate) facing +z (toward default camera) and slightly
      if(a>Math.PI*0.42 && a<Math.PI*0.58) continue;
      const x=Math.cos(a)*R, z=Math.sin(a)*R;
      const seg=new THREE.Mesh(new THREE.BoxGeometry(segLen,segH,wt), stone);
      seg.position.set(x,segH/2,z); seg.rotation.y=-a+Math.PI/2;
      seg.castShadow=true; seg.receiveShadow=true; g.add(seg);
      // crenellations
      for(let k=0;k<4;k++){
        const c=new THREE.Mesh(new THREE.BoxGeometry(2,2.5,wt), stone);
        const off=(k-1.5)*4;
        c.position.set(x+Math.cos(a+Math.PI/2)*off, segH+1.2, z+Math.sin(a+Math.PI/2)*off);
        c.rotation.y=-a+Math.PI/2; g.add(c);
      }
      if(i%5===0){
        const tw=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.8,segH+8,12), stone);
        tw.position.set(x, (segH+8)/2, z); tw.castShadow=true; g.add(tw);
        const cap=new THREE.Mesh(new THREE.ConeGeometry(4.4,9,12), roofMat('#7a3b2e'));
        cap.position.set(x, segH+8+4.5, z); cap.castShadow=true; g.add(cap);
      }
    }
    scene.add(g);
  })();

  // ---------- Trees ----------
  (function plantTrees(){
    const trunkMat=new THREE.MeshStandardMaterial({color:0x5b3a22, roughness:1});
    const leafMat=new THREE.MeshStandardMaterial({color:0x3f5e2e, roughness:1});
    for(let i=0;i<70;i++){
      const a=rnd(0,Math.PI*2), rr=rnd(20,cityRadius+10);
      const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
      if(nearRoad(x,z,6)) continue;
      if(Math.hypot(x,z)<26) continue;
      const t=new THREE.Group();
      const th=rnd(3,6);
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.8,th,6), trunkMat);
      trunk.position.y=th/2; trunk.castShadow=true; t.add(trunk);
      const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(2.4,4.2),0), leafMat);
      crown.position.y=th+rnd(1.2,2.4); crown.castShadow=true; t.add(crown);
      t.position.set(x,0,z); scene.add(t);
    }
  })();

  // ---------- Torches (flicker lights + glow sprites) ----------
  const torches=[];
  const glowTex = (function(){
    const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
    const grd=g.createRadialGradient(32,32,0,32,32,32);
    grd.addColorStop(0,'rgba(255,200,120,1)'); grd.addColorStop(0.4,'rgba(255,150,60,0.6)'); grd.addColorStop(1,'rgba(255,120,30,0)');
    g.fillStyle=grd; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
  })();
  function addTorch(parent, x,y,z, base){
    const col=0xff9b3d;
    const light=new THREE.PointLight(col, 0, 26, 2);
    light.position.set(x,y,z); parent.add(light);
    const sprite=new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    sprite.scale.set(5,5,5); sprite.position.set(x,y,z); parent.add(sprite);
    torches.push({light, sprite, base, phase:rnd(0,Math.PI*2), freq:rnd(8,14)});
  }
  // torches along the ground ring path / market
  for(let i=0;i<22;i++){
    const a=rnd(0,Math.PI*2), rr=rnd(35,cityRadius);
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    if(nearRoad(x,z,8)===false) { /* place near a building cluster anyway */ }
    addTorch(scene, x, 4.5, z, 1.3);
  }

  // ---------- Clouds ----------
  const clouds=[];
  const cloudTex=(function(){
    const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
    const grd=g.createRadialGradient(64,64,0,64,64,64);
    grd.addColorStop(0,'rgba(255,255,255,0.9)'); grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(64,64,64,0,Math.PI*2); g.fill(); return new THREE.CanvasTexture(c);
  })();
  for(let i=0;i<26;i++){
    const m=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex, color:0xffffff, transparent:true, opacity:0.5, depthWrite:false}));
    const s=rnd(60,140); m.scale.set(s,s*0.55,1);
    m.position.set(rnd(-400,400), rnd(80,170), rnd(-400,400));
    scene.add(m); clouds.push({s:m, spd:rnd(2,6), drift:rnd(0.2,0.6)});
  }

  // ---------- Fireflies / motes (night particles) ----------
  const moteCount=420;
  const moteGeo=new THREE.BufferGeometry();
  const motePos=new Float32Array(moteCount*3);
  const moteSpd=new Float32Array(moteCount);
  for(let i=0;i<moteCount;i++){
    motePos[i*3]=rnd(-cityRadius-20,cityRadius+20);
    motePos[i*3+1]=rnd(2,40);
    motePos[i*3+2]=rnd(-cityRadius-20,cityRadius+20);
    moteSpd[i]=rnd(0.3,1.1);
  }
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos,3));
  const moteMat=new THREE.PointsMaterial({color:0xffd98a, size:1.6, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
  const motes=new THREE.Points(moteGeo, moteMat); scene.add(motes);

  // ---------- Birds (simple V sprites) ----------
  const birdTex=(function(){
    const c=document.createElement('canvas'); c.width=c.height=32; const g=c.getContext('2d');
    g.strokeStyle='#2a2a2a'; g.lineWidth=3; g.lineCap='round';
    g.beginPath(); g.moveTo(2,20); g.quadraticCurveTo(16,6,16,16); g.quadraticCurveTo(16,6,30,20); g.stroke();
    return new THREE.CanvasTexture(c);
  })();
  const birds=[];
  for(let i=0;i<12;i++){
    const b=new THREE.Sprite(new THREE.SpriteMaterial({map:birdTex, transparent:true, opacity:0.7, depthWrite:false}));
    b.scale.set(6,6,1);
    b.position.set(rnd(-200,200), rnd(60,120), rnd(-200,200));
    scene.add(b);
    birds.push({s:b, vx:rnd(-6,6), vy:rnd(-1,1), vz:rnd(-6,6), flap:rnd(0,6)});
  }

  // ---------- Controls (drag / wheel) ----------
  let dragging=false, lastX=0, lastY=0, autoTheta=0.0, userActive=false;
  const el=renderer.domElement;
  el.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; userActive=true; });
  addEventListener('pointerup', ()=> dragging=false);
  addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    camState.theta -= dx*0.005;
    camState.phi = Math.min(1.45, Math.max(0.18, camState.phi - dy*0.005));
  });
  el.addEventListener('wheel', e=>{
    e.preventDefault();
    camState.radius = Math.min(360, Math.max(55, camState.radius + e.deltaY*0.08));
  }, {passive:false});

  let paused=false, forced=null;
  addEventListener('keydown', e=>{
    if(e.code==='Space'){ paused=!paused; e.preventDefault(); }
    if(e.key==='d'||e.key==='D') forced='day';
    if(e.key==='n'||e.key==='N') forced='night';
    if(e.key==='a'||e.key==='A') forced=null;
  });

  // ---------- Day/Night model ----------
  // t in [0,1): 0 = midnight, 0.25 = sunrise, 0.5 = noon, 0.75 = sunset
  const skyStates = {
    night:  { top:0x0a1230, mid:0x16244f, bot:0x223152, sun:0x2a3a66, sunI:0.0, hemi:0x101a33, hemiI:0.18, amb:0x223052, ambI:0.12, fog:0x16203a, exp:0.014, exposure:0.9 },
    dawn:   { top:0x4a6ea0, mid:0xc98a6a, bot:0xf0b079, sun:0xffb066, sunI:1.1, hemi:0xbfa98a, hemiI:0.45, amb:0x6a5a55, ambI:0.2, fog:0xd9a98a, exp:0.009, exposure:1.05 },
    day:    { top:0x2a5fb0, mid:0x9fc4e8, bot:0xd8e2ea, sun:0xfff2d6, sunI:1.5, hemi:0xbfd8f0, hemiI:0.6, amb:0x6a7d92, ambI:0.22, fog:0xa9c2d6, exp:0.0075, exposure:1.12 },
    dusk:   { top:0x3a3a78, mid:0xb8604a, bot:0xe89a5c, sun:0xff8a4a, sunI:1.0, hemi:0x9a7a7a, hemiI:0.45, amb:0x554a55, ambI:0.18, fog:0xb07060, exp:0.010, exposure:1.05 }
  };
  function lerpColor(a,b,t){ return new THREE.Color(a).lerp(new THREE.Color(b), t); }
  function getPhase(t){
    // returns interpolated state object
    let A,B,tt;
    if(t<0.22){ A=skyStates.night; B=skyStates.dawn; tt=t/0.22; }
    else if(t<0.30){ A=skyStates.dawn; B=skyStates.day; tt=(t-0.22)/0.08; }
    else if(t<0.70){ A=skyStates.day; B=skyStates.day; tt=(t-0.30)/0.40; }
    else if(t<0.80){ A=skyStates.day; B=skyStates.dusk; tt=(t-0.70)/0.10; }
    else if(t<0.90){ A=skyStates.dusk; B=skyStates.night; tt=(t-0.80)/0.10; }
    else { A=skyStates.night; B=skyStates.night; tt=(t-0.90)/0.10; }
    const o={};
    for(const k in A){ if(k==='exp'||k==='exposure'||k==='sunI'||k==='hemiI'||k==='ambI'){ o[k]=A[k]+(B[k]-A[k])*tt; } else { o[k]=lerpColor(A[k],B[k],tt); } }
    return o;
  }
  function phaseName(t){
    if(t<0.22) return 'Night';
    if(t<0.30) return 'Dawn';
    if(t<0.70) return 'Day';
    if(t<0.80) return 'Dusk';
    if(t<0.90) return 'Twilight';
    return 'Night';
  }

  // ---------- Animation ----------
  const clockEl=document.getElementById('clock');
  const phaseEl=clockEl.querySelector('.phase');
  const timeEl=document.getElementById('timetext');
  let timeOfDay = 0.32; // start mid-morning
  const DAY_SECONDS = 90; // full cycle length in real seconds
  const tmpV=new THREE.Vector3();
  let last=performance.now();

  function updateEnv(t, dt){
    let st;
    if(forced==='day') st=getPhase(0.5);
    else if(forced==='night') st=getPhase(0.02);
    else st=getPhase(t);

    skyMat.uniforms.topColor.value.copy(st.top);
    skyMat.uniforms.midColor.value.copy(st.mid);
    skyMat.uniforms.botColor.value.copy(st.bot);
    scene.fog.color.copy(st.fog);
    scene.fog.density = st.exp;
    renderer.toneMappingExposure = st.exposure;

    // sun position along arc: altitude peaks at noon (t=0.5)
    const elev = Math.sin((t-0.25)*Math.PI*2); // 0 at sunrise(0.25), 1 at noon(0.5), 0 at sunset(0.75), -1 at midnight
    const az = (t*2*Math.PI);
    const sunY = Math.max(-50, elev*300);
    const sunX = Math.cos(az)*300;
    const sunZ = Math.sin(az)*300;
    sun.position.set(sunX, sunY, sunZ);
    sun.target.position.set(0,0,0);
    sun.intensity = Math.max(0, st.sunI);
    sun.color.copy(st.sun);
    // moon
    moon.position.set(-sunX, -sunY+20, -sunZ);
    moon.intensity = forced==='night'?0.5 : Math.max(0, -elev)*0.5;
    moon.color.set(0x9db8ff);

    hemi.color.copy(st.hemi); hemi.intensity=st.hemiI;
    ambient.color.copy(st.amb); ambient.intensity=st.ambI;

    // night factor for windows / motes / stars
    const night = forced==='night'?1 : forced==='day'?0 : Math.max(0, -elev);
    const winI = Math.max(0, night*1.6 - 0.1);
    for(const m of buildingMats) m.emissiveIntensity = winI;
    for(const m of cathedralMats) m.emissiveIntensity = winI*1.4;
    starMat.opacity = forced==='night'?0.9 : Math.max(0, -elev)*0.9;
    moteMat.opacity = Math.min(0.85, night*0.9);
    stars.visible = starMat.opacity>0.02;
    motes.visible = moteMat.opacity>0.02;

    // clock readout
    const totalMin = Math.floor(t*24*60);
    const hh=String(Math.floor(totalMin/60)).padStart(2,'0');
    const mm=String(totalMin%60).padStart(2,'0');
    phaseEl.textContent = forced? (forced==='day'?'Day (held)':'Night (held)') : phaseName(t);
    timeEl.textContent = hh+':'+mm;
  }

  function flicker(t){
    for(const to of torches){
      const f = 0.65 + 0.35*Math.sin(t*to.freq + to.phase) + 0.15*Math.sin(t*to.freq*2.3+to.phase*1.7);
      const nightBoost = forced==='night'?1.4 : forced==='day'?0.4 : 1.4;
      to.light.intensity = to.base * Math.max(0,f) * nightBoost;
      const s = 4.5 + f*1.6;
      to.sprite.scale.set(s,s,s);
      to.sprite.material.opacity = Math.max(0, Math.min(1, f)) * (forced==='day'?0.5:1);
    }
  }

  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now-last)/1000); last=now;
    const time = now/1000;

    if(!paused && !forced) timeOfDay = (timeOfDay + dt/DAY_SECONDS) % 1;
    else if(!paused && (forced==='day'||forced==='night')) { /* hold */ }

    updateEnv(forced? (forced==='day'?0.5:0.02) : timeOfDay, dt);
    flicker(time);

    // continuous slow orbit; drag overrides by user-set theta
    camState.theta += dt*0.045;
    if(!dragging){
      // gentle vertical bob
      camState.phi += Math.sin(time*0.3)*0.0006;
    }
    applyCamera();

    // clouds drift
    for(const c of clouds){
      c.s.position.x += c.spd*dt;
      if(c.s.position.x>460) c.s.position.x=-460;
    }
    // motes float
    const mp=moteGeo.attributes.position.array;
    for(let i=0;i<moteCount;i++){
      mp[i*3+1]+= moteSpd[i]*dt*2;
      mp[i*3]+= Math.sin(time*0.5+i)*dt*0.6;
      if(mp[i*3+1]>46) mp[i*3+1]=2;
    }
    moteGeo.attributes.position.needsUpdate=true;

    // birds fly
    for(const b of birds){
      b.s.position.x+=b.vx*dt; b.s.position.y+=b.vy*dt; b.s.position.z+=b.vz*dt;
      b.flap+=dt*8;
      b.s.scale.y = 6 + Math.sin(b.flap)*2.2;
      if(Math.abs(b.s.position.x)>260) b.vx*=-1;
      if(Math.abs(b.s.position.z)>260) b.vz*=-1;
      if(b.s.position.y>130||b.s.position.y<50) b.vy*=-1;
    }

    renderer.render(scene, camera);
  }

  // ---------- Resize ----------
  addEventListener('resize', ()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---------- Intro ----------
  applyCamera();
  const loader=document.getElementById('loader');
  setTimeout(()=>{ loader.classList.add('hide'); }, 500);
  setTimeout(()=>{ document.getElementById('title').classList.add('show'); }, 900);
  setTimeout(()=>{ document.getElementById('title').classList.remove('show'); }, 7000);

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
