<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bulwark — Tower Defense</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141b30;
    --panel-2: #1b2440;
    --ink: #e8eefc;
    --muted: #8b97b8;
    --accent: #4cc2ff;
    --gold: #ffd166;
    --danger: #ff6b6b;
    --good: #5ce1a6;
    --line: #2a3656;
    --grid: #182238;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(1200px 800px at 70% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    display: flex;
    height: 100vh;
    gap: 14px;
    padding: 14px;
  }
  #stage {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  canvas {
    background:
      linear-gradient(180deg, #0e1526 0%, #0a1020 100%);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 0 0 1px var(--line);
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
  }
  /* Side panel */
  #panel {
    width: 290px;
    flex: 0 0 290px;
    background: linear-gradient(180deg, var(--panel) 0%, #10172b 100%);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.4), inset 0 0 0 1px var(--line);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .title .sub {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat .v { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .stat.gold .v { color: var(--gold); }
  .stat.lives .v { color: var(--good); }
  .stat.wave .v { color: var(--accent); }
  .section-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }
  .towers { display: flex; flex-direction: column; gap: 8px; }
  .tower-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
    text-align: left;
    color: var(--ink);
  }
  .tower-btn:hover { transform: translateY(-1px); border-color: #3a4d7a; }
  .tower-btn.active { border-color: var(--accent); background: #1d2c4e; box-shadow: 0 0 0 1px var(--accent) inset; }
  .tower-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .tower-ico {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 30px;
    display: grid; place-items: center;
    font-weight: 900; font-size: 14px; color: #0a1020;
  }
  .tower-meta { flex: 1 1 auto; min-width: 0; }
  .tower-meta .name { font-weight: 700; font-size: 13px; }
  .tower-meta .desc { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tower-cost { font-size: 12px; font-weight: 800; color: var(--gold); }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  button.act {
    flex: 1 1 auto;
    background: var(--accent);
    color: #06121f;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: filter .12s ease, transform .08s ease;
  }
  button.act:hover { filter: brightness(1.08); }
  button.act:active { transform: translateY(1px); }
  button.act.ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
  button.act:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint {
    font-size: 11px; color: var(--muted); line-height: 1.5;
    border-top: 1px solid var(--line); padding-top: 10px;
  }
  .hint b { color: var(--ink); }
  /* Overlays */
  #overlay {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(6,10,22,0.72);
    backdrop-filter: blur(3px);
    border-radius: 14px;
  }
  #overlay.show { display: flex; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #0e1626 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 34px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    max-width: 420px;
  }
  .card h2 { margin: 0 0 8px; font-size: 30px; }
  .card p { margin: 6px 0 18px; color: var(--muted); line-height: 1.5; }
  .card .big { font-size: 46px; font-weight: 900; margin: 4px 0; }
  .card .win { color: var(--good); }
  .card .lose { color: var(--danger); }
  /* speed control */
  .speedrow { display: flex; align-items: center; gap: 8px; }
  .speedrow .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .spbtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 5px 9px; font-weight: 800; cursor: pointer; font-size: 12px;
  }
  .spbtn.active { border-color: var(--accent); color: var(--accent); }
  #toast {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,107,107,0.92); color: #2a0d0d; font-weight: 800; font-size: 12px;
    padding: 7px 14px; border-radius: 20px; opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
    <div id="overlay">
      <div class="card" id="overlayCard"></div>
    </div>
  </div>

  <div id="panel">
    <div class="title">Bulwark<span class="sub">Tower Defense</span></div>

    <div class="stats">
      <div class="stat gold"><div class="k">Gold</div><div class="v" id="goldV">120</div></div>
      <div class="stat lives"><div class="k">Lives</div><div class="v" id="livesV">20</div></div>
      <div class="stat wave"><div class="k">Wave</div><div class="v" id="waveV">0 / 12</div></div>
      <div class="stat"><div class="k">Score</div><div class="v" id="scoreV">0</div></div>
    </div>

    <div class="section-label">Build — select a tower</div>
    <div class="towers" id="towerList"></div>

    <div class="section-label">Speed</div>
    <div class="speedrow">
      <span class="label">Game</span>
      <button class="spbtn active" data-speed="1">1×</button>
      <button class="spbtn" data-speed="2">2×</button>
      <button class="spbtn" data-speed="3">3×</button>
    </div>

    <div class="hint">
      <b>Click</b> an empty tile to place the selected tower, then click it again to <b>sell</b> (50% refund).
      Press <b>Space</b> to start the next wave. Survive 12 waves.
    </div>

    <div class="actions">
      <button class="act" id="startBtn">Start Wave</button>
      <button class="act ghost" id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function () {
  // ---------- Canvas setup ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const COLS = 16, ROWS = 10, TILE = 52;
  const W = COLS * TILE, H = ROWS * TILE;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.scale(DPR, DPR);

  // ---------- Map path (grid coords) ----------
  // Path goes through the grid as a series of waypoints (col,row centers).
  const pathTiles = [
    [0,1],[1,1],[2,1],[3,1],[3,2],[3,3],[3,4],[4,4],[5,4],[6,4],[6,5],
    [6,6],[6,7],[5,7],[4,7],[3,7],[2,7],[2,8],[2,9],[3,9],[4,9],[5,9],[6,9],[7,9],[8,9],
    [9,9],[10,9],[11,9],[11,8],[11,7],[12,7],[13,7],[13,6],[13,5],[13,4],[13,3],
    [14,3],[15,3]
  ];
  // waypoints in pixel coords (center of tiles)
  const waypoints = pathTiles.map(([c,r]) => ({ x: c*TILE + TILE/2, y: r*TILE + TILE/2 }));
  const pathSet = new Set(pathTiles.map(([c,r]) => c + "," + r));
  function isPath(c,r){ return pathSet.has(c+","+r); }

  // Total path length for progress
  let pathLen = 0;
  const segLens = [];
  for (let i=0;i<waypoints.length-1;i++){
    const a=waypoints[i], b=waypoints[i+1];
    const d=Math.hypot(b.x-a.x,b.y-a.y);
    segLens.push(d); pathLen+=d;
  }
  function posAt(dist){
    let d = dist;
    for (let i=0;i<segLens.length;i++){
      if (d <= segLens[i]){
        const a=waypoints[i], b=waypoints[i+1];
        const t = segLens[i]===0?0:d/segLens[i];
        return { x: a.x+(b.x-a.x)*t, y: a.y+(b.y-a.y)*t };
      }
      d -= segLens[i];
    }
    return { x: waypoints[waypoints.length-1].x, y: waypoints[waypoints.length-1].y };
  }

  // ---------- Tower definitions ----------
  const TOWERS = {
    arrow: {
      name: "Arrow", cost: 40, color: "#5ce1a6", glyph: "↑",
      range: 2.6*TILE, damage: 9, fireRate: 0.45, proj: "bolt", splash: 0, slow: 0,
      desc: "Fast, cheap single-target"
    },
    cannon: {
      name: "Cannon", cost: 85, color: "#ffb703", glyph: "✸",
      range: 2.2*TILE, damage: 34, fireRate: 1.25, proj: "ball", splash: 46, slow: 0,
      desc: "Slow splash damage"
    },
    frost: {
      name: "Frost", cost: 70, color: "#4cc2ff", glyph: "❄",
      range: 2.3*TILE, damage: 5, fireRate: 0.7, proj: "ice", splash: 0, slow: 0.5,
      desc: "Chills & slows foes"
    }
  };

  // ---------- Enemy definitions ----------
  const ENEMIES = {
    grunt:  { hp: 38, speed: 58, reward: 7, color: "#ff8fab", radius: 11, name:"Grunt" },
    runner: { hp: 24, speed: 104, reward: 9, color: "#ffd6a5", radius: 9, name:"Runner" },
    tank:   { hp: 150, speed: 38, reward: 18, color: "#c77dff", radius: 15, name:"Tank" },
    swarm:  { hp: 16, speed: 72, reward: 4, color: "#b5e48c", radius: 8, name:"Swarm" }
  };

  // ---------- Game state ----------
  let gold, lives, wave, score, towers, enemies, projectiles, particles;
  let selected = "arrow";
  let spawnQueue = [];
  let spawnTimer = 0;
  let waveActive = false;
  let speed = 1;
  let gameOver = false;
  let victory = false;
  let lastTime = 0;
  let hoverCell = null;
  let pulse = 0;

  function reset() {
    gold = 120; lives = 20; wave = 0; score = 0;
    towers = []; enemies = []; projectiles = []; particles = [];
    spawnQueue = []; spawnTimer = 0; waveActive = false;
    gameOver = false; victory = false; selected = "arrow";
    overlay.classList.remove("show");
    syncUI();
  }

  // ---------- Wave generation ----------
  function buildWave(n) {
    const q = [];
    // composition scales with n
    const count = 6 + n*2;
    for (let i=0;i<count;i++){
      let type = "grunt";
      const r = Math.random();
      if (n >= 2 && r < 0.25) type = "runner";
      if (n >= 3 && r > 0.8) type = "tank";
      if (n >= 4 && r > 0.55 && r < 0.7) type = "swarm";
      q.push(type);
    }
    // occasional tank anchor
    if (n % 3 === 0) q.push("tank");
    // hp scale
    const hpScale = 1 + (n-1)*0.22;
    return { q, hpScale, gap: Math.max(0.35, 0.95 - n*0.04) };
  }

  function startWave() {
    if (waveActive || gameOver || victory) return;
    if (wave >= 12) return;
    wave++;
    const w = buildWave(wave);
    spawnQueue = w.q.slice();
    const hpScale = w.hpScale;
    spawnTimer = 0;
    waveActive = true;
    // store scale for spawner
    currentWaveScale = hpScale;
    currentGap = w.gap;
    syncUI();
  }
  let currentWaveScale = 1, currentGap = 0.9;

  function spawnEnemy(type) {
    const def = ENEMIES[type];
    const hp = Math.round(def.hp * currentWaveScale);
    enemies.push({
      type, x: waypoints[0].x, y: waypoints[0].y,
      dist: 0, maxHp: hp, hp, speed: def.speed,
      reward: def.reward, color: def.color, radius: def.radius,
      slowT: 0, dead: false
    });
  }

  // ---------- Input ----------
  const overlay = document.getElementById("overlay");
  const overlayCard = document.getElementById("overlayCard");

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (c<0||c>=COLS||r<0||r>=ROWS) return null;
    return { c, r };
  }
  function towerAt(c,r){ return towers.find(t => t.c===c && t.r===r); }

  let toastTimer = 0;
  const toastEl = document.getElementById("toast");
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 1100);
  }

  canvas.addEventListener("mousemove", (e)=>{ hoverCell = cellFromEvent(e); });
  canvas.addEventListener("mouseleave", ()=>{ hoverCell = null; });
  canvas.addEventListener("click", (e)=>{
    if (gameOver || victory) return;
    const cell = cellFromEvent(e);
    if (!cell) return;
    const { c, r } = cell;
    if (isPath(c,r)) return;
    const existing = towerAt(c,r);
    if (existing) {
      // sell
      const refund = Math.floor(existing.cost*0.5);
      gold += refund;
      towers = towers.filter(t=>t!==existing);
      spawnParticles(existing.x, existing.y, existing.color, 10);
      toast("Sold +" + refund + "g");
      syncUI();
      return;
    }
    const def = TOWERS[selected];
    if (gold < def.cost) { toast("Not enough gold"); return; }
    gold -= def.cost;
    towers.push({
      type: selected, c, r,
      x: c*TILE+TILE/2, y: r*TILE+TILE/2,
      cost: def.cost, cooldown: 0, angle: 0, level: 1
    });
    spawnParticles(c*TILE+TILE/2, r*TILE+TILE/2, def.color, 8);
    syncUI();
  });

  window.addEventListener("keydown", (e)=>{
    if (e.code === "Space") { e.preventDefault(); startWave(); }
    if (e.key === "1") selectTower("arrow");
    if (e.key === "2") selectTower("cannon");
    if (e.key === "3") selectTower("frost");
  });

  // ---------- UI ----------
  const towerListEl = document.getElementById("towerList");
  function buildTowerList(){
    towerListEl.innerHTML = "";
    Object.keys(TOWERS).forEach(key=>{
      const t = TOWERS[key];
      const btn = document.createElement("button");
      btn.className = "tower-btn" + (key===selected?" active":"");
      btn.dataset.key = key;
      btn.innerHTML = `
        <div class="tower-ico" style="background:${t.color}">${t.glyph}</div>
        <div class="tower-meta"><div class="name">${t.name}</div><div class="desc">${t.desc}</div></div>
        <div class="tower-cost">${t.cost}g</div>`;
      btn.addEventListener("click", ()=>selectTower(key));
      towerListEl.appendChild(btn);
    });
  }
  function selectTower(key){
    selected = key;
    [...towerListEl.children].forEach(b=>b.classList.toggle("active", b.dataset.key===key));
  }

  const goldV=document.getElementById("goldV"), livesV=document.getElementById("livesV"),
        waveV=document.getElementById("waveV"), scoreV=document.getElementById("scoreV"),
        startBtn=document.getElementById("startBtn");
  function syncUI(){
    goldV.textContent = gold;
    livesV.textContent = lives;
    waveV.textContent = wave + " / 12";
    scoreV.textContent = score;
    startBtn.disabled = waveActive || wave>=12 || gameOver || victory;
    startBtn.textContent = waveActive ? "Wave in progress" : (wave>=12 ? "Done" : (wave===0?"Start Wave":"Next Wave"));
    // disable tower buttons player can't afford
    [...towerListEl.children].forEach(b=>{
      const key=b.dataset.key;
      b.disabled = gold < TOWERS[key].cost && !towerAt(0,0) || false;
      // simpler: just leave enabled; toast handles affordability
      b.disabled = false;
    });
  }

  startBtn.addEventListener("click", startWave);
  document.getElementById("resetBtn").addEventListener("click", reset);

  // speed buttons
  document.querySelectorAll(".spbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      speed = parseInt(b.dataset.speed,10);
      document.querySelectorAll(".spbtn").forEach(x=>x.classList.toggle("active", x===b));
    });
  });

  // ---------- Particles ----------
  function spawnParticles(x,y,color,n){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const s = 30 + Math.random()*70;
      particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5+Math.random()*0.3, max:0.8, color });
    }
  }

  // ---------- Update ----------
  function update(dt){
    pulse += dt;
    // spawn
    if (waveActive && spawnQueue.length>0){
      spawnTimer -= dt;
      if (spawnTimer <= 0){
        spawnEnemy(spawnQueue.shift());
        spawnTimer = currentGap;
      }
    }

    // enemies
    for (const en of enemies){
      if (en.dead) continue;
      if (en.slowT > 0) en.slowT -= dt;
      const spd = en.speed * (en.slowT>0 ? 0.5 : 1);
      en.dist += spd * dt;
      const p = posAt(en.dist);
      en.x = p.x; en.y = p.y;
      if (en.dist >= pathLen){
        en.dead = true;
        lives -= 1;
        spawnParticles(en.x, en.y, "#ff6b6b", 8);
        if (lives <= 0){ lives = 0; endGame(false); }
      }
    }

    // towers
    for (const t of towers){
      const def = TOWERS[t.type];
      if (t.cooldown > 0) t.cooldown -= dt;
      // find target: furthest along path within range
      let best=null, bestDist=-1;
      for (const en of enemies){
        if (en.dead) continue;
        const d = Math.hypot(en.x-t.x, en.y-t.y);
        if (d <= def.range && en.dist > bestDist){ best=en; bestDist=en.dist; }
      }
      if (best){
        t.angle = Math.atan2(best.y-t.y, best.x-t.x);
        if (t.cooldown <= 0){
          t.cooldown = def.fireRate;
          fire(t, def, best);
        }
      }
    }

    // projectiles
    for (const p of projectiles){
      if (p.dead) continue;
      const target = p.target;
      if (!target || target.dead){
        // if splash, still travel to last pos
        if (p.splash){
          // continue to stored point
        } else { p.dead = true; continue; }
      }
      const tx = target && !target.dead ? target.x : p.tx;
      const ty = target && !target.dead ? target.y : p.ty;
      const dx = tx - p.x, dy = ty - p.y;
      const d = Math.hypot(dx,dy);
      const step = p.speed * dt;
      if (d <= step){
        // hit
        p.x = tx; p.y = ty;
        if (p.splash){
          for (const en of enemies){
            if (en.dead) continue;
            if (Math.hypot(en.x-tx, en.y-ty) <= p.splash){
              damage(en, p.damage);
            }
          }
          spawnParticles(tx,ty,p.color,12);
        } else if (target && !target.dead){
          damage(target, p.damage);
          if (p.slow>0) target.slowT = Math.max(target.slowT, p.slow*1.5);
          spawnParticles(tx,ty,p.color,6);
        }
        p.dead = true;
      } else {
        p.x += dx/d*step; p.y += dy/d*step;
        p.tx = tx; p.ty = ty;
      }
    }

    // particles
    for (const pa of particles){
      pa.x += pa.vx*dt; pa.y += pa.vy*dt;
      pa.vx *= 0.92; pa.vy *= 0.92;
      pa.life -= dt;
    }

    // cleanup
    enemies = enemies.filter(e=>!e.dead);
    projectiles = projectiles.filter(p=>!p.dead);
    particles = particles.filter(p=>p.life>0);

    // wave complete?
    if (waveActive && spawnQueue.length===0 && enemies.length===0){
      waveActive = false;
      const bonus = 20 + wave*5;
      gold += bonus;
      score += 50*wave;
      toast("Wave " + wave + " cleared! +" + bonus + "g");
      if (wave >= 12){ endGame(true); }
      syncUI();
    }
    syncUI();
  }

  function damage(en, amt){
    en.hp -= amt;
    if (en.hp <= 0 && !en.dead){
      en.dead = true;
      gold += en.reward; score += en.reward*2;
      spawnParticles(en.x, en.y, en.color, 12);
    }
  }

  function fire(t, def, target){
    if (def.proj === "ball"){
      // lead slightly
      projectiles.push({
        x:t.x, y:t.y, tx:target.x, ty:target.y, target, speed:340,
        damage: def.damage, color: def.color, splash: def.splash, slow:0, r:5
      });
    } else if (def.proj === "ice"){
      projectiles.push({
        x:t.x, y:t.y, tx:target.x, ty:target.y, target, speed:420,
        damage: def.damage, color: def.color, splash:0, slow:def.slow, r:4
      });
    } else {
      projectiles.push({
        x:t.x, y:t.y, tx:target.x, ty:target.y, target, speed:560,
        damage: def.damage, color: def.color, splash:0, slow:0, r:3
      });
    }
  }

  function endGame(win){
    gameOver = !win; victory = win;
    if (win) score += 500;
    const card = overlayCard;
    card.innerHTML = win
      ? `<h2 class="win">Victory!</h2>
         <div class="big win">${score}</div>
         <p>You held the line through all 12 waves with ${lives} lives to spare.</p>
         <button class="act" id="againBtn">Play Again</button>`
      : `<h2 class="lose">Breached</h2>
         <div class="big lose">Wave ${wave}</div>
         <p>The bulwark fell on wave ${wave}. Score: ${score}.</p>
         <button class="act" id="againBtn">Try Again</button>`;
    overlay.classList.add("show");
    const again = document.getElementById("againBtn");
    if (again) again.addEventListener("click", reset);
  }

  // ---------- Render ----------
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawGrid();
    drawPath();
    drawRangePreview();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawParticles();
  }

  function drawGrid(){
    ctx.strokeStyle = "#16213a";
    ctx.lineWidth = 1;
    for (let c=0;c<=COLS;c++){
      ctx.beginPath(); ctx.moveTo(c*TILE,0); ctx.lineTo(c*TILE,H); ctx.stroke();
    }
    for (let r=0;r<=ROWS;r++){
      ctx.beginPath(); ctx.moveTo(0,r*TILE); ctx.lineTo(W,r*TILE); ctx.stroke();
    }
  }

  function drawPath(){
    // base
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = "#1c2742";
    ctx.lineWidth = TILE*0.78;
    ctx.beginPath();
    ctx.moveTo(waypoints[0].x, waypoints[0].y);
    for (let i=1;i<waypoints.length;i++) ctx.lineTo(waypoints[i].x, waypoints[i].y);
    ctx.stroke();
    // top
    ctx.strokeStyle = "#26324f";
    ctx.lineWidth = TILE*0.5;
    ctx.beginPath();
    ctx.moveTo(waypoints[0].x, waypoints[0].y);
    for (let i=1;i<waypoints.length;i++) ctx.lineTo(waypoints[i].x, waypoints[i].y);
    ctx.stroke();
    // dashed center
    ctx.strokeStyle = "rgba(120,150,210,0.35)";
    ctx.lineWidth = 2; ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(waypoints[0].x, waypoints[0].y);
    for (let i=1;i<waypoints.length;i++) ctx.lineTo(waypoints[i].x, waypoints[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    // start & end markers
    const s = waypoints[0], e = waypoints[waypoints.length-1];
    ctx.fillStyle = "#5ce1a6";
    ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff6b6b";
    ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI*2); ctx.fill();
  }

  function drawRangePreview(){
    if (!hoverCell) return;
    const { c, r } = hoverCell;
    if (isPath(c,r)) return;
    if (towerAt(c,r)) return;
    const def = TOWERS[selected];
    const x = c*TILE+TILE/2, y = r*TILE+TILE/2;
    const ok = gold >= def.cost;
    ctx.fillStyle = ok ? "rgba(76,194,255,0.10)" : "rgba(255,107,107,0.10)";
    ctx.fillRect(c*TILE+2, r*TILE+2, TILE-4, TILE-4);
    ctx.strokeStyle = ok ? "rgba(76,194,255,0.7)" : "rgba(255,107,107,0.7)";
    ctx.lineWidth = 2;
    ctx.strokeRect(c*TILE+2, r*TILE+2, TILE-4, TILE-4);
    // range ghost
    ctx.fillStyle = ok ? "rgba(76,194,255,0.06)" : "rgba(255,107,107,0.06)";
    ctx.beginPath(); ctx.arc(x,y,def.range,0,Math.PI*2); ctx.fill();
  }

  function drawTowers(){
    for (const t of towers){
      const def = TOWERS[t.type];
      const x=t.x, y=t.y;
      // base
      ctx.fillStyle = "#0f1830";
      roundRect(x-18, y-18, 36, 36, 9); ctx.fill();
      ctx.strokeStyle = def.color; ctx.lineWidth = 2;
      roundRect(x-18, y-18, 36, 36, 9); ctx.stroke();
      // turret
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(t.angle);
      ctx.fillStyle = def.color;
      ctx.fillRect(0, -4, 20, 8);
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#0a1020";
      ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // glyph
      ctx.fillStyle = "#0a1020";
      ctx.font = "bold 13px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(def.glyph, x, y);
    }
  }

  function drawEnemies(){
    for (const en of enemies){
      // body
      ctx.beginPath(); ctx.arc(en.x, en.y, en.radius, 0, Math.PI*2);
      ctx.fillStyle = en.color; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.stroke();
      // slow tint
      if (en.slowT>0){
        ctx.beginPath(); ctx.arc(en.x, en.y, en.radius+2, 0, Math.PI*2);
        ctx.strokeStyle = "rgba(76,194,255,0.8)"; ctx.lineWidth=2; ctx.stroke();
      }
      // hp bar
      const w = en.radius*2.2;
      const hpFrac = Math.max(0, en.hp/en.maxHp);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(en.x-w/2, en.y-en.radius-9, w, 4);
      ctx.fillStyle = hpFrac>0.5 ? "#5ce1a6" : hpFrac>0.25 ? "#ffd166" : "#ff6b6b";
      ctx.fillRect(en.x-w/2, en.y-en.radius-9, w*hpFrac, 4);
    }
  }

  function drawProjectiles(){
    for (const p of projectiles){
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color; ctx.fill();
      if (p.splash){
        ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r+2,0,Math.PI*2);
        ctx.fillStyle = p.color; ctx.fill(); ctx.globalAlpha=1;
      }
    }
  }

  function drawParticles(){
    for (const pa of particles){
      const a = Math.max(0, pa.life/pa.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = pa.color;
      ctx.beginPath(); ctx.arc(pa.x, pa.y, 3*a+1, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- Loop ----------
  function loop(ts){
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime)/1000;
    lastTime = ts;
    if (dt > 0.05) dt = 0.05;
    if (!gameOver && !victory){
      const steps = speed;
      for (let i=0;i<steps;i++) update(dt);
    } else {
      // keep particles animating
      for (const pa of particles){ pa.x+=pa.vx*dt; pa.y+=pa.vy*dt; pa.vx*=0.92; pa.vy*=0.92; pa.life-=dt; }
      particles = particles.filter(p=>p.life>0);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Boot ----------
  buildTowerList();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
