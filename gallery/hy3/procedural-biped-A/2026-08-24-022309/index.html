<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Biped Walk</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 10;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #c9d1d9; background: rgba(13,17,23,.55);
    border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px;
    backdrop-filter: blur(6px); user-select: none;
  }
  #hud b { color: #58a6ff; }
  #hud .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #hud input[type=range] { width: 140px; }
  #hud button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 7px; padding: 4px 10px; cursor: pointer; font: inherit;
  }
  #hud button:hover { background: #30363d; }
  #hint { opacity: .7; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div><b>Procedural Biped</b> — walk cycle</div>
  <div class="row">Speed <input id="speed" type="range" min="0" max="3" step="0.01" value="1.2"></div>
  <div class="row">Step <input id="step" type="range" min="0.2" max="1.6" step="0.01" value="0.85"></div>
  <div class="row"><button id="rotate">Auto-rotate: On</button><button id="reset">Reset</button></div>
  <div id="hint">Drag to orbit · scroll to zoom</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Renderer / scene / camera ----------------------------------------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 12, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.4, 2.6, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.4, 0);
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

// ---- Lights -----------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0x9bb8ff, 0x202a35, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 30;
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0x4f8cff, 0.6);
rim.position.set(-6, 4, -5);
scene.add(rim);

// ---- Ground -----------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 40, 0x30363d, 0x21262d);
grid.position.y = 0.001;
scene.add(grid);

// ---- Biped factory ----------------------------------------------------------
// A humanoid built from primitive limbs. Each joint is a pivot Group; we rotate
// them procedurally to drive a walk cycle. No external animation assets.
function makeMat(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.1 });
}
function box(w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), makeMat(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function buildBiped() {
  const root = new THREE.Group();

  // Hip pivot (whole body bobs around here)
  const hip = new THREE.Group();
  hip.position.y = 0.95;
  root.add(hip);

  // Pelvis
  const pelvis = box(0.46, 0.26, 0.30, 0x2f81f7);
  pelvis.position.y = 0;
  hip.add(pelvis);

  // Torso (slightly tapered via two boxes)
  const torso = new THREE.Group();
  torso.position.y = 0.13;
  hip.add(torso);
  const chest = box(0.52, 0.62, 0.32, 0x388bfd);
  chest.position.y = 0.40;
  torso.add(chest);
  const neck = box(0.16, 0.14, 0.16, 0x2f81f7);
  neck.position.y = 0.78;
  torso.add(neck);

  // Head
  const head = new THREE.Group();
  head.position.y = 0.85;
  torso.add(head);
  const skull = box(0.30, 0.32, 0.30, 0xadbbc9);
  head.add(skull);
  const visor = box(0.22, 0.07, 0.02, 0x58a6ff);
  visor.position.set(0, 0.02, 0.16);
  head.add(visor);

  // Limb builder: returns { joint, end } where joint is the pivot at the hip/shoulder
  function limb(len, topW, topColor, lowColor, side) {
    const joint = new THREE.Group();
    const upper = box(topW, len * 0.5, topW * 0.9, topColor);
    upper.position.y = -len * 0.25;
    joint.add(upper);
    const elbow = new THREE.Group();
    elbow.position.y = -len * 0.5;
    joint.add(elbow);
    const lower = box(topW * 0.8, len * 0.5, topW * 0.7, lowColor);
    lower.position.y = -len * 0.25;
    elbow.add(lower);
    return { joint, elbow, len };
  }

  // Legs
  const legL = limb(0.95, 0.20, 0x1f6feb, 0x1158c7, 1);
  legL.joint.position.set(-0.13, -0.10, 0);
  hip.add(legL.joint);

  const legR = limb(0.95, 0.20, 0x1f6feb, 0x1158c7, -1);
  legR.joint.position.set(0.13, -0.10, 0);
  hip.add(legR.joint);

  // Feet
  for (const leg of [legL, legR]) {
    const foot = box(0.16, 0.10, 0.34, 0x0d419d);
    foot.position.set(0, -leg.len * 0.5 - 0.02, 0.10);
    leg.elbow.add(foot);
  }

  // Arms
  const armL = limb(0.78, 0.13, 0x388bfd, 0x2f81f7, 1);
  armL.joint.position.set(-0.34, 0.66, 0);
  torso.add(armL.joint);

  const armR = limb(0.78, 0.13, 0x388bfd, 0x2f81f7, -1);
  armR.joint.position.set(0.34, 0.66, 0);
  torso.add(armR.joint);

  return { root, hip, torso, head, legL, legR, armL, armR };
}

const biped = buildBiped();
scene.add(biped.root);

// ---- Procedural walk cycle --------------------------------------------------
// Phase drives two legs 180° out of phase; arms counter-swing; torso bobs and
// rolls. Everything is computed from a single scalar `t` so it loops seamlessly.
const param = { speed: 1.2, stepHeight: 0.85, autoRotate: true };
let phase = 0;
let traveled = 0;

function easeInOut(x) { return x * x * (3 - 2 * x); }

function animateWalk(t) {
  const swing = param.stepHeight;            // radians of hip swing
  const kneeBend = swing * 1.15;

  const l = Math.sin(t);
  const r = Math.sin(t + Math.PI);

  // Hip swing (front/back)
  biped.legL.joint.rotation.x = l * swing;
  biped.legR.joint.rotation.x = r * swing;

  // Knee bend: only bends strongly on the back-swing / lift phase
  // Use a positive bump when the leg is lifting (sin between 0 and PI)
  function kneeFor(phaseSin) {
    // phaseSin in [-1,1]; lift when moving forward (sin>0)
    const lift = Math.max(0, phaseSin);
    return easeInOut(lift) * kneeBend;
  }
  biped.legL.elbow.rotation.x = kneeFor(l);
  biped.legR.elbow.rotation.x = kneeFor(r);

  // Arms counter-swing (opposite to legs) with a slight elbow bend
  const armSwing = swing * 0.7;
  biped.armL.joint.rotation.x = -l * armSwing;
  biped.armR.joint.rotation.x = -r * armSwing;
  biped.armL.elbow.rotation.x = 0.25 + Math.max(0, -l) * 0.5;
  biped.armR.elbow.rotation.x = 0.25 + Math.max(0, -r) * 0.5;

  // Torso bob (twice per stride) + slight roll and yaw twist
  const bob = Math.abs(Math.cos(t)) * 0.06 + 0.95;
  biped.hip.position.y = bob;
  biped.torso.rotation.z = -l * 0.05;     // shoulder roll
  biped.torso.rotation.y = l * 0.06;      // slight twist
  biped.head.rotation.y = -l * 0.04;      // counter-rotate head a touch

  // Whole-body forward travel along -Z, plus gentle reset by wrapping
  traveled += Math.cos(t) * 0; // (kept in place; visual motion via legs)
}

// Actually move the biped forward and loop it on a circular track for showcase.
let trackAngle = 0;
function updateTravel(dt) {
  const v = param.speed * 1.4;
  trackAngle += dt * v * 0.35;
  const radius = 4.5;
  biped.root.position.x = Math.sin(trackAngle) * radius;
  biped.root.position.z = -Math.cos(trackAngle) * radius;
  biped.root.rotation.y = -trackAngle + Math.PI / 2;
}

// ---- UI ---------------------------------------------------------------------
const speedEl = document.getElementById('speed');
const stepEl = document.getElementById('step');
const rotateBtn = document.getElementById('rotate');
const resetBtn = document.getElementById('reset');
speedEl.addEventListener('input', () => param.speed = +speedEl.value);
stepEl.addEventListener('input', () => param.stepHeight = +stepEl.value);
rotateBtn.addEventListener('click', () => {
  param.autoRotate = !param.autoRotate;
  rotateBtn.textContent = 'Auto-rotate: ' + (param.autoRotate ? 'On' : 'Off');
});
resetBtn.addEventListener('click', () => { trackAngle = 0; phase = 0; });

// ---- Loop -------------------------------------------------------------------
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  phase += dt * param.speed * 3.0;
  animateWalk(phase);
  updateTravel(dt);
  if (param.autoRotate) controls.autoRotate = false;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
