<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Procedural City — Night</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Cinematic vignette + subtle film grain */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(120% 100% at 50% 38%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }
  #caption {
    position: fixed; left: 26px; bottom: 22px; z-index: 6; pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: rgba(200,215,255,0.62);
    letter-spacing: 0.22em; text-transform: uppercase; font-size: 11px;
    text-shadow: 0 1px 12px rgba(0,0,0,0.8);
  }
  #caption b { color: rgba(255,224,170,0.85); font-weight: 600; letter-spacing: 0.30em; }
  #hint {
    position: fixed; right: 22px; bottom: 22px; z-index: 6; pointer-events: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: rgba(150,170,210,0.40); font-size: 10px; letter-spacing: 0.18em;
    text-align: right; text-transform: uppercase;
  }
  /* Loading veil that fades once the scene is ready */
  #veil {
    position: fixed; inset: 0; z-index: 10; background: #05070f;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.4s ease; opacity: 1;
  }
  #veil.hidden { opacity: 0; pointer-events: none; }
  #veil .pulse {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ffd98a; box-shadow: 0 0 22px 6px rgba(255,200,120,0.6);
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{ opacity:0.35; transform: scale(0.8);} 50%{ opacity:1; transform: scale(1.15);} }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="caption">procedural city &nbsp;·&nbsp; <b>night</b></div>
<div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom</div>
<div id="veil"><div class="pulse"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const NIGHT = new THREE.Color(0x070b18);
scene.fog = new THREE.FogExp2(0x0a1024, 0.0042);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);
camera.position.set(120, 70, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 35;
controls.maxDistance = 360;
controls.maxPolarAngle = Math.PI * 0.495; // stay above ground
controls.target.set(0, 18, 0);

// ---------------------------------------------------------------------------
// Sky dome (gradient) + stars + moon
// ---------------------------------------------------------------------------
const skyGeo = new THREE.SphereGeometry(1000, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    cZenith:  { value: new THREE.Color(0x03040a) },
    cHorizon: { value: new THREE.Color(0x142146) },
    cGlow:    { value: new THREE.Color(0x2a3a6e) }
  },
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 cZenith; uniform vec3 cHorizon; uniform vec3 cGlow;
    void main(){
      float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(cHorizon, cZenith, pow(h, 0.75));
      // faint warm glow near the horizon where the city haze sits
      float low = smoothstep(0.42, 0.0, abs(vDir.y));
      col = mix(col, cGlow, low * 0.35);
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// Stars
(function addStars(){
  const N = 2200;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++){
    // upper hemisphere shell
    const u = Math.random(), v = Math.random() * 0.5 + 0.12;
    const theta = u * Math.PI * 2;
    const phi = Math.acos(1 - 2 * v);
    const r = 850;
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi);
    const z = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3] = x; pos[i*3+1] = Math.abs(y) * 0.9 + 30; pos[i*3+2] = z;
    const t = Math.random();
    c.setHSL(0.58 + t * 0.08, 0.25, 0.6 + Math.random() * 0.4);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 2.2, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.9, depthWrite: false
  });
  const stars = new THREE.Points(g, m);
  stars.name = 'stars';
  scene.add(stars);
})();

// Moon (sprite glow + disc)
(function addMoon(){
  const mk = (size, inner, outer) => {
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, inner); g.addColorStop(0.4, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  };
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: mk(256, 'rgba(220,230,255,0.9)', 'rgba(150,180,255,0.35)'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  glow.scale.set(180, 180, 1);
  const disc = new THREE.Sprite(new THREE.SpriteMaterial({
    map: mk(128, 'rgba(245,248,255,1)', 'rgba(210,220,245,0.9)'),
    transparent: true, depthWrite: false
  }));
  disc.scale.set(46, 46, 1);
  const moon = new THREE.Group();
  moon.add(glow); moon.add(disc);
  moon.position.set(-260, 300, -360);
  scene.add(moon);
})();

// ---------------------------------------------------------------------------
// Lighting (night): dim ambient + cold moon key + warm hemisphere fill
// ---------------------------------------------------------------------------
scene.add(new THREE.AmbientLight(0x223052, 0.55));
const moonLight = new THREE.DirectionalLight(0x9fb4ff, 0.6);
moonLight.position.set(-260, 300, -360);
scene.add(moonLight);
const hemi = new THREE.HemisphereLight(0x33508f, 0x05060c, 0.35);
scene.add(hemi);

// ---------------------------------------------------------------------------
// Procedural window facade textures (shared base canvases, cloned per building)
// ---------------------------------------------------------------------------
const TILE_W = 64, TILE_H = 128, COLS = 4, ROWS = 8;

function makeFacadePair(seed){
  const facadeCv = document.createElement('canvas'); facadeCv.width = TILE_W; facadeCv.height = TILE_H;
  const emisCv   = document.createElement('canvas'); emisCv.width = TILE_W;  emisCv.height = TILE_H;
  const fctx = facadeCv.getContext('2d');
  const ectx = emisCv.getContext('2d');

  // base wall tones (cool concrete / warm brick mixes)
  const wallTones = ['#0b0e16','#10131d','#0c0f17','#141019','#0a0d14'];
  const wall = wallTones[seed % wallTones.length];
  fctx.fillStyle = wall; fctx.fillRect(0,0,TILE_W,TILE_H);
  ectx.fillStyle = '#000'; ectx.fillRect(0,0,TILE_W,TILE_H);

  const padX = 5, padY = 5;
  const cw = (TILE_W - padX*2) / COLS;
  const rh = (TILE_H - padY*2) / ROWS;
  const ww = cw * 0.62, wh = rh * 0.62;

  // deterministic-ish jitter via seed
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const x = padX + c*cw + (cw - ww)/2;
      const y = padY + r*rh + (rh - wh)/2;
      // occasional dark "floor gap"
      const lit = rnd();
      if (lit < 0.34){
        // unlit window — faint reflective glass on facade only
        fctx.fillStyle = '#0a0c12'; fctx.fillRect(x, y, ww, wh);
        continue;
      }
      // warm vs cool vs rare cool-white
      const pick = rnd();
      let cr, cg, cb;
      if (pick < 0.62){ cr = 255; cg = 205; cb = 130; }       // warm sodium
      else if (pick < 0.9){ cr = 150; cg = 195; cb = 255; }    // cold fluorescent
      else { cr = 235; cg = 245; cb = 255; }                   // bright white
      const a = 0.55 + rnd() * 0.45;
      fctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
      fctx.fillRect(x, y, ww, wh);
      // emissive (brighter, slightly inset to avoid halo bleed)
      ectx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
      ectx.fillRect(x, y, ww, wh);
    }
  }
  const fTex = new THREE.CanvasTexture(facadeCv);
  const eTex = new THREE.CanvasTexture(emisCv);
  [fTex, eTex].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; });
  return { fTex, eTex };
}

// Build a small library of facade pairs
const FACADES = [];
for (let i = 0; i < 14; i++) FACADES.push(makeFacadePair(i + 1));

// ---------------------------------------------------------------------------
// City generation
// ---------------------------------------------------------------------------
const SPACING = 15;          // grid cell pitch
const GRID = 26;             // cells per side
const HALF = (GRID - 1) / 2;
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

const buildings = new THREE.Group();
scene.add(buildings);

const rand = (a, b) => a + Math.random() * (b - a);

for (let i = 0; i < GRID; i++){
  for (let j = 0; j < GRID; j++){
    // leave some lots empty (parks / plazas), rarer near core
    if (Math.random() < 0.08) continue;

    const x = (i - HALF) * SPACING;
    const z = (j - HALF) * SPACING;

    // downtown falloff: taller toward center
    const d = Math.sqrt(x*x + z*z);
    const core = Math.exp(-(d*d) / (2 * 95*95));
    const baseH = 8 + core * 78;
    const h = Math.max(6, baseH * rand(0.45, 1.25) + rand(0, 14));
    const w = rand(7.5, SPACING - 3.5);
    const dp = rand(7.5, SPACING - 3.5);

    const f = FACADES[(Math.random() * FACADES.length) | 0];
    const mapTex = f.fTex.clone();
    const emisTex = f.eTex.clone();
    const repX = Math.max(1, Math.round(w / 3.0));
    const repY = Math.max(1, Math.round(h / 3.2));
    mapTex.repeat.set(repX, repY);
    emisTex.repeat.set(repX, repY);
    mapTex.needsUpdate = emisTex.needsUpdate = true;

    const mat = new THREE.MeshStandardMaterial({
      map: mapTex,
      emissiveMap: emisTex,
      emissive: 0xffffff,
      emissiveIntensity: 1.15,
      roughness: 0.82,
      metalness: 0.12
    });

    const mesh = new THREE.Mesh(boxGeo, mat);
    mesh.scale.set(w, h, dp);
    mesh.position.set(x, h / 2, z);
    buildings.add(mesh);

    // rooftop beacon on the tallest towers
    if (h > 60 && Math.random() < 0.5){
      const beacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff5a5a })
      );
      beacon.position.set(x, h + 1.2, z);
      beacon.userData.beacon = true;
      buildings.add(beacon);
    }
  }
}

// ---------------------------------------------------------------------------
// Ground: dark wet asphalt with faint street grid + central city glow
// ---------------------------------------------------------------------------
(function ground(){
  const size = GRID * SPACING + 60;
  const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#04060c'; ctx.fillRect(0,0,1024,1024);
  // street grid lines (faint cyan)
  ctx.strokeStyle = 'rgba(90,130,200,0.10)';
  ctx.lineWidth = 1.5;
  const step = 1024 / GRID;
  for (let k = 0; k <= GRID; k++){
    ctx.beginPath(); ctx.moveTo(k*step, 0); ctx.lineTo(k*step, 1024); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, k*step); ctx.lineTo(1024, k*step); ctx.stroke();
  }
  // central warm glow
  const g = ctx.createRadialGradient(512,512,30, 512,512,420);
  g.addColorStop(0, 'rgba(255,180,110,0.20)');
  g.addColorStop(0.4, 'rgba(120,90,160,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,1024,1024);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;

  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.35, metalness: 0.7, color: 0x6a7390
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = 0.02;
  scene.add(plane);
})();

// ---------------------------------------------------------------------------
// Traffic: emissive streaks moving along the street grid
// ---------------------------------------------------------------------------
const cars = new THREE.Group();
scene.add(cars);
const carGeo = new THREE.BoxGeometry(1, 0.5, 1);

const carList = [];
const STREETS = [];
for (let i = 0; i <= GRID; i++) STREETS.push((i - HALF - 0.5) * SPACING + SPACING * 0.0);

function spawnCar(){
  const axis = Math.random() < 0.5 ? 'x' : 'z';
  const lane = STREETS[(Math.random() * STREETS.length) | 0] + (Math.random() < 0.5 ? 2.4 : -2.4);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const speed = rand(14, 30) * dir;
  const span = GRID * SPACING;

  const headColor = Math.random() < 0.5 ? 0xfff2d6 : 0xbfe0ff; // headlights
  const tailColor = 0xff3b3b;                                   // taillights

  const body = new THREE.Group();

  const head = new THREE.Mesh(carGeo, new THREE.MeshBasicMaterial({ color: headColor }));
  head.scale.set(0.6, 0.6, 0.6);
  head.position.set(axis === 'x' ? dir * 0.7 : 0, 0, axis === 'z' ? dir * 0.7 : 0);

  const tail = new THREE.Mesh(carGeo, new THREE.MeshBasicMaterial({ color: tailColor }));
  tail.scale.set(0.5, 0.5, 0.5);
  tail.position.set(axis === 'x' ? -dir * 0.7 : 0, 0, axis === 'z' ? -dir * 0.7 : 0);

  body.add(head); body.add(tail);
  const y = 1.0;
  const start = (Math.random() - 0.5) * span;
  if (axis === 'x') body.position.set(start, y, lane);
  else body.position.set(lane, y, start);
  cars.add(body);

  carList.push({ mesh: body, axis, dir, speed, span, lane, y });
}
for (let k = 0; k < 90; k++) spawnCar();

// ---------------------------------------------------------------------------
// Post-processing: bloom for the neon-night glow
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.85,   // strength
  0.55,   // radius
  0.18    // threshold
);
composer.addPass(bloom);

// ---------------------------------------------------------------------------
// Animation loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
let t = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  // traffic
  for (const car of carList){
    if (car.axis === 'x'){
      car.mesh.position.x += car.speed * dt;
      if (car.mesh.position.x >  car.span/2 + 6) car.mesh.position.x = -car.span/2 - 6;
      if (car.mesh.position.x < -car.span/2 - 6) car.mesh.position.x =  car.span/2 + 6;
    } else {
      car.mesh.position.z += car.speed * dt;
      if (car.mesh.position.z >  car.span/2 + 6) car.mesh.position.z = -car.span/2 - 6;
      if (car.mesh.position.z < -car.span/2 - 6) car.mesh.position.z =  car.span/2 + 6;
    }
  }

  // rooftop beacon pulse
  const bp = 0.5 + 0.5 * Math.sin(t * 3.0);
  buildings.children.forEach(o => {
    if (o.userData.beacon) o.material.color.setRGB(1.0, 0.2 + 0.1*bp, 0.2 + 0.1*bp);
  });

  // subtle star twinkle
  const stars = scene.getObjectByName('stars');
  if (stars) stars.material.opacity = 0.75 + 0.2 * Math.sin(t * 0.7);

  controls.update();
  composer.render();
}

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

// Reveal once first frame is ready
animate();
requestAnimationFrame(() => {
  const veil = document.getElementById('veil');
  setTimeout(() => veil.classList.add('hidden'), 350);
});
</script>
</body>
</html>
