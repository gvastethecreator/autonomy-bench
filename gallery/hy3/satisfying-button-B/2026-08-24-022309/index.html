<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satisfying Button</title>
<style>
  :root {
    --bg-1: #0f1020;
    --bg-2: #1a1b3a;
    --accent: #7c5cff;
    --accent-2: #00e0c6;
    --ink: #f4f3ff;
    --shadow: rgba(124, 92, 255, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.4rem;
    background:
      radial-gradient(120% 120% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 60%);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }

  /* soft drifting ambient blobs */
  .ambient {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    animation: drift 18s ease-in-out infinite;
  }
  .blob.a { width: 360px; height: 360px; left: 12%; top: 18%; background: var(--accent); }
  .blob.b { width: 300px; height: 300px; right: 14%; bottom: 16%; background: var(--accent-2); animation-delay: -6s; }
  .blob.c { width: 240px; height: 240px; right: 28%; top: 22%; background: #ff6ad5; animation-delay: -11s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.08); }
    66% { transform: translate(-30px, 25px) scale(0.95); }
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.4rem;
  }

  .hint {
    font-size: 0.95rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(244, 243, 255, 0.55);
    transition: opacity 0.6s ease;
  }
  .hint.dim { opacity: 0; }

  /* The button */
  .btn-wrap {
    position: relative;
    display: grid;
    place-items: center;
  }

  .ripple-root {
    position: absolute;
    inset: -120px;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  .button {
    --press: 0;
    position: relative;
    border: none;
    cursor: pointer;
    padding: 1.4rem 3.6rem;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #fff;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent) 0%, #9a7bff 50%, var(--accent-2) 100%);
    background-size: 200% 200%;
    box-shadow:
      0 18px 40px -12px var(--shadow),
      0 0 0 0 rgba(124, 92, 255, 0);
    transform: translateY(calc(var(--press) * -2px)) scale(calc(1 - var(--press) * 0.04));
    transition:
      transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.3s ease,
      background-position 0.8s ease;
    outline: none;
    overflow: hidden;
  }
  .button:hover {
    background-position: 100% 0%;
    box-shadow:
      0 26px 60px -14px var(--shadow),
      0 0 28px 2px rgba(124, 92, 255, 0.35);
  }
  .button:active {
    transition-duration: 0.06s;
  }
  .button::after {
    /* sheen sweep */
    content: "";
    position: absolute;
    top: 0; left: -150%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-18deg);
    transition: left 0.7s ease;
  }
  .button.sheen::after { left: 150%; }

  .button .label {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
  }

  /* ripple circles */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(124, 92, 255, 0.7);
    width: 20px; height: 20px;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.9;
    animation: ripple-out 0.9s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple-out {
    to { transform: translate(-50%, -50%) scale(14); opacity: 0; }
  }

  /* particle burst */
  .particle {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    top: 50%; left: 50%;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* counter */
  .counter {
    position: relative;
    z-index: 1;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: rgba(244, 243, 255, 0.7);
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
  }
  .counter b {
    font-size: 1.6rem;
    color: var(--ink);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .counter b.pop { transform: scale(1.25); }

  /* floating "tap" texts */
  .floattext {
    position: absolute;
    font-weight: 700;
    font-size: 1.3rem;
    pointer-events: none;
    color: var(--accent-2);
    text-shadow: 0 0 12px rgba(0, 224, 198, 0.6);
    animation: floatup 1s ease-out forwards;
  }
  @keyframes floatup {
    from { opacity: 1; transform: translate(-50%, 0) scale(1); }
    to   { opacity: 0; transform: translate(-50%, -90px) scale(1.2); }
  }

  /* success ring pulse on click count milestones */
  .pulse {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    box-shadow: 0 0 0 0 rgba(0, 224, 198, 0.5);
    animation: pulse 0.8s ease-out;
    pointer-events: none;
  }
  @keyframes pulse {
    to { box-shadow: 0 0 0 40px rgba(0, 224, 198, 0); }
  }

  .footer {
    position: fixed;
    bottom: 1.2rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: rgba(244, 243, 255, 0.35);
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="ambient">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
  </div>

  <div class="stage">
    <div class="hint" id="hint">Tap the button</div>

    <div class="btn-wrap" id="wrap">
      <div class="ripple-root" id="rippleRoot"></div>
      <button class="button" id="btn" aria-label="Satisfying button">
        <span class="label">Press me</span>
      </button>
    </div>

    <div class="counter">
      <span>taps</span>
      <b id="count">0</b>
    </div>
  </div>

  <div class="footer">made for the moment, not the metric</div>

<script>
(function () {
  var btn = document.getElementById('btn');
  var wrap = document.getElementById('wrap');
  var rippleRoot = document.getElementById('rippleRoot');
  var countEl = document.getElementById('count');
  var hint = document.getElementById('hint');

  var count = 0;
  var pressTimer = null;
  var sheenTimer = null;

  function setPress(on) {
    btn.style.setProperty('--press', on ? 1 : 0);
  }

  function spawnRipple(x, y) {
    var rect = btn.getBoundingClientRect();
    var r = document.createElement('span');
    r.className = 'ripple';
    r.style.left = (x - rect.left) + 'px';
    r.style.top = (y - rect.top) + 'px';
    btn.appendChild(r);
    setTimeout(function () { r.remove(); }, 950);
  }

  function spawnParticles(x, y) {
    var colors = ['#7c5cff', '#00e0c6', '#ff6ad5', '#ffd86b', '#9a7bff'];
    var n = 14;
    for (var i = 0; i < n; i++) {
      var p = document.createElement('span');
      p.className = 'particle';
      var color = colors[i % colors.length];
      p.style.background = color;
      p.style.boxShadow = '0 0 10px ' + color;
      var size = 6 + Math.random() * 8;
      p.style.width = p.style.height = size + 'px';
      document.body.appendChild(p);
      p.style.left = x + 'px';
      p.style.top = y + 'px';

      var angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      var dist = 60 + Math.random() * 80;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist;
      var dur = 600 + Math.random() * 400;

      p.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.2)', opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });

      (function (node) {
        setTimeout(function () { node.remove(); }, dur + 50);
      })(p);
    }
  }

  function floatText(x, y, text) {
    var t = document.createElement('div');
    t.className = 'floattext';
    t.textContent = text;
    t.style.left = x + 'px';
    t.style.top = (y - 30) + 'px';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1000);
  }

  function bumpCount() {
    count++;
    countEl.textContent = count;
    countEl.classList.add('pop');
    setTimeout(function () { countEl.classList.remove('pop'); }, 200);

    // milestone pulse every 10
    if (count % 10 === 0) {
      var pulse = document.createElement('div');
      pulse.className = 'pulse';
      btn.appendChild(pulse);
      setTimeout(function () { pulse.remove(); }, 850);
      floatText(window.innerWidth / 2, wrap.getBoundingClientRect().top + 10, count + '!');
    }
  }

  function trigger(x, y) {
    spawnRipple(x, y);
    spawnParticles(x, y);
    bumpCount();

    // sheen sweep
    btn.classList.remove('sheen');
    void btn.offsetWidth; // reflow
    btn.classList.add('sheen');
    clearTimeout(sheenTimer);
    sheenTimer = setTimeout(function () { btn.classList.remove('sheen'); }, 750);

    hint.classList.add('dim');
  }

  function getXY(e) {
    if (e.touches && e.touches.length) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  // Pointer interactions
  btn.addEventListener('pointerdown', function (e) {
    setPress(true);
    var p = getXY(e);
    trigger(p.x, p.y);
  });

  btn.addEventListener('pointerup', function () {
    setPress(false);
  });
  btn.addEventListener('pointerleave', function () {
    setPress(false);
  });
  btn.addEventListener('pointercancel', function () {
    setPress(false);
  });

  // keyboard accessibility
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var rect = btn.getBoundingClientRect();
      trigger(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }
  });

  // gentle idle breathing so the initial state already feels alive
  var breathe = 0;
  setInterval(function () {
    if (document.activeElement === btn) return;
    breathe += 0.08;
    var s = 1 + Math.sin(breathe) * 0.012;
    btn.style.transform = 'translateY(0) scale(' + s + ')';
  }, 40);

  // subtle ambient sound on first interaction (Web Audio), optional delight
  var audioCtx = null;
  function chime() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(520 + Math.random() * 60, t);
      o.frequency.exponentialRampToValueAtTime(880, t + 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.42);
    } catch (e) {}
  }
  btn.addEventListener('pointerdown', chime);

})();
</script>
</body>
</html>
