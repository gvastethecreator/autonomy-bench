<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visual Node Editor</title>
<style>
  :root {
    --bg: #0f1117;
    --grid: #1b1f2a;
    --grid-strong: #232838;
    --panel: #161a24;
    --node: #1d2230;
    --node-head: #2a3142;
    --node-border: #3a4258;
    --accent: #4f9dff;
    --wire: #6f7fa6;
    --wire-active: #ffcf5c;
    --text: #d7dce8;
    --muted: #8b93a7;
    --port: #c9d2e6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas#grid { position: absolute; inset: 0; z-index: 0; }
  svg#wires { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #nodes { position: absolute; inset: 0; z-index: 2; }

  .toolbar {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: rgba(22,26,36,0.85); border: 1px solid var(--grid-strong);
    padding: 8px 10px; border-radius: 10px; backdrop-filter: blur(6px);
  }
  .toolbar button {
    background: var(--node-head); color: var(--text); border: 1px solid #39425a;
    padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 12px;
    transition: background .15s, transform .05s;
  }
  .toolbar button:hover { background: #34405a; }
  .toolbar button:active { transform: translateY(1px); }
  .toolbar .hint { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .toolbar .title { font-weight: 600; color: var(--accent); margin-right: 6px; }

  .node {
    position: absolute; min-width: 170px; max-width: 240px;
    background: var(--node); border: 1px solid var(--grid-strong);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,157,255,0.4), 0 8px 24px rgba(0,0,0,0.45); }
  .node-head {
    background: var(--node-head); padding: 8px 11px; font-weight: 600;
    cursor: grab; display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #2c3447;
  }
  .node-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .node-head .typ { margin-left: auto; color: var(--muted); font-size: 10px; font-weight: 500; }
  .node-body { padding: 6px 0; }
  .row { display: flex; align-items: center; position: relative; min-height: 24px; padding: 2px 0; }
  .row .lbl { flex: 1; padding: 0 11px; color: var(--muted); font-size: 11px; }
  .row .val { padding: 0 11px 0 0; color: var(--text); font-size: 12px; }
  .port {
    position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: var(--port); border: 2px solid var(--node); cursor: crosshair;
    top: 50%; transform: translateY(-50%); z-index: 3;
    transition: background .12s, transform .08s;
  }
  .port:hover { background: var(--accent); transform: translateY(-50%) scale(1.25); }
  .port.in { left: -7px; }
  .port.out { right: -7px; }
  .port.connected { background: var(--wire-active); }

  .inspector {
    position: absolute; top: 12px; right: 12px; z-index: 10; width: 220px;
    background: rgba(22,26,36,0.9); border: 1px solid var(--grid-strong);
    border-radius: 10px; padding: 12px; backdrop-filter: blur(6px);
  }
  .inspector h3 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
  .inspector .field { margin-bottom: 8px; }
  .inspector label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .inspector input, .inspector select {
    width: 100%; background: var(--bg); border: 1px solid #39425a; color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 12px;
  }
  .inspector .empty { color: var(--muted); font-size: 12px; }
  .statusbar {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    color: var(--muted); font-size: 11px; background: rgba(22,26,36,0.7);
    padding: 5px 10px; border-radius: 8px; border: 1px solid var(--grid-strong);
  }
  .temp-wire { stroke: var(--wire-active); stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .wire { fill: none; stroke: var(--wire); stroke-width: 2.5; }
  .wire:hover { stroke: var(--wire-active); cursor: pointer; }
  .wire.active { stroke: var(--wire-active); }
</style>
</head>
<body>
<div id="app">
  <canvas id="grid"></canvas>
  <svg id="wires"></svg>
  <div id="nodes"></div>

  <div class="toolbar">
    <span class="title">Node Editor</span>
    <button id="addMath">+ Math</button>
    <button id="addNumber">+ Number</button>
    <button id="addOutput">+ Output</button>
    <button id="deleteNode">Delete</button>
    <button id="reset">Reset</button>
    <span class="hint">drag headers · drag ports to connect · scroll to pan</span>
  </div>

  <div class="inspector" id="inspector">
    <h3>Inspector</h3>
    <div id="inspectorBody"><div class="empty">Select a node to edit its properties.</div></div>
  </div>

  <div class="statusbar" id="status">0 nodes · 0 wires</div>
</div>

<script>
(function () {
  "use strict";

  const gridCanvas = document.getElementById('grid');
  const gctx = gridCanvas.getContext('2d');
  const svg = document.getElementById('wires');
  const nodesLayer = document.getElementById('nodes');
  const inspectorBody = document.getElementById('inspectorBody');
  const statusEl = document.getElementById('status');

  let view = { x: 0, y: 0, scale: 1 };
  const nodes = new Map();
  const wires = [];
  let nodeSeq = 0;
  let selectedNode = null;
  let tempWire = null;

  const NODE_TYPES = {
    number: { title: 'Number', color: '#5cc8ff', inputs: [], outputs: ['value'], fields: [{ key: 'value', label: 'Value', type: 'number', def: 1 }] },
    math:   { title: 'Math',   color: '#ff8f5c', inputs: ['a', 'b'], outputs: ['result'], fields: [{ key: 'op', label: 'Operation', type: 'select', def: 'add', options: ['add','subtract','multiply','divide'] }] },
    output: { title: 'Output', color: '#9b7bff', inputs: ['in'], outputs: [], fields: [{ key: 'label', label: 'Label', type: 'text', def: 'result' }] }
  };

  function computeGraph() {
    // Evaluate output values by traversing from outputs back through wires.
    const results = new Map(); // nodeId -> value

    function evalNode(id, visiting) {
      if (results.has(id)) return results.get(id);
      if (visiting.has(id)) return 0; // cycle guard
      visiting.add(id);
      const node = nodes.get(id);
      const def = NODE_TYPES[node.type];

      let value = 0;
      if (node.type === 'number') {
        value = Number(node.fields.value) || 0;
      } else if (node.type === 'math') {
        const wireA = wires.find(w => w.to === id && w.toPort === 'a');
        const wireB = wires.find(w => w.to === id && w.toPort === 'b');
        const a = wireA ? evalNode(wireA.from, visiting) : 0;
        const b = wireB ? evalNode(wireB.from, visiting) : 0;
        switch (node.fields.op) {
          case 'subtract': value = a - b; break;
          case 'multiply': value = a * b; break;
          case 'divide': value = b === 0 ? 0 : a / b; break;
          default: value = a + b;
        }
      } else if (node.type === 'output') {
        const wire = wires.find(w => w.to === id && w.toPort === 'in');
        value = wire ? evalNode(wire.from, visiting) : 0;
      }
      results.set(id, value);
      visiting.delete(id);
      return value;
    }

    for (const id of nodes.keys()) evalNode(id, new Set());
    return results;
  }

  function renderNodeValue(node, value) {
    const row = node.el.querySelector('.val');
    if (row) row.textContent = typeof value === 'number' ? (Math.round(value * 1000) / 1000) : value;
  }

  function refreshEvaluation() {
    const results = computeGraph();
    for (const [id, val] of results) {
      const node = nodes.get(id);
      if (node && node.type !== 'output') renderNodeValue(node, val);
    }
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    gridCanvas.width = window.innerWidth * dpr;
    gridCanvas.height = window.innerHeight * dpr;
    gridCanvas.style.width = window.innerWidth + 'px';
    gridCanvas.style.height = window.innerHeight + 'px';
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGrid();
  }

  function drawGrid() {
    const w = window.innerWidth, h = window.innerHeight;
    gctx.clearRect(0, 0, w, h);
    const size = 28 * view.scale;
    const offX = view.x % size;
    const offY = view.y % size;
    gctx.lineWidth = 1;
    gctx.strokeStyle = '#1b1f2a';
    for (let x = offX; x < w; x += size) {
      gctx.beginPath(); gctx.moveTo(x, 0); gctx.lineTo(x, h); gctx.stroke();
    }
    for (let y = offY; y < h; y += size) {
      gctx.beginPath(); gctx.moveTo(0, y); gctx.lineTo(w, y); gctx.stroke();
    }
  }

  function toScreen(wx, wy) {
    return { x: wx * view.scale + view.x, y: wy * view.scale + view.y };
  }
  function toWorld(sx, sy) {
    return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
  }

  function makeNode(type, wx, wy) {
    const def = NODE_TYPES[type];
    const id = 'n' + (++nodeSeq);
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = id;
    const pos = toScreen(wx, wy);
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';

    const head = document.createElement('div');
    head.className = 'node-head';
    head.innerHTML = `<span class="dot" style="background:${def.color}"></span>${def.title}<span class="typ">${type}</span>`;
    el.appendChild(head);

    const body = document.createElement('div');
    body.className = 'node-body';

    // input rows
    def.inputs.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="lbl">${p}</span><span class="port in" data-port="${p}" data-dir="in"></span>`;
      body.appendChild(row);
    });

    // output row(s) with value display
    def.outputs.forEach((p) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="lbl">${p}</span><span class="val">0</span><span class="port out" data-port="${p}" data-dir="out"></span>`;
      body.appendChild(row);
    });

    el.appendChild(body);
    nodesLayer.appendChild(el);

    const node = {
      id, type, el,
      wx, wy,
      fields: {},
      ports: el.querySelectorAll('.port')
    };
    def.fields.forEach(f => node.fields[f.key] = f.def);
    nodes.set(id, node);

    // interactions
    head.addEventListener('mousedown', (e) => startDrag(e, node));
    el.addEventListener('mousedown', () => selectNode(node));
    node.ports.forEach(port => {
      port.addEventListener('mousedown', (e) => startWire(e, node, port));
    });

    return node;
  }

  function selectNode(node) {
    if (selectedNode) selectedNode.el.classList.remove('selected');
    selectedNode = node;
    if (node) node.el.classList.add('selected');
    renderInspector();
  }

  function renderInspector() {
    if (!selectedNode) {
      inspectorBody.innerHTML = '<div class="empty">Select a node to edit its properties.</div>';
      return;
    }
    const def = NODE_TYPES[selectedNode.type];
    let html = '';
    def.fields.forEach(f => {
      html += `<div class="field"><label>${f.label}</label>`;
      if (f.type === 'select') {
        html += `<select data-key="${f.key}">`;
        f.options.forEach(o => html += `<option value="${o}" ${selectedNode.fields[f.key] === o ? 'selected' : ''}>${o}</option>`);
        html += `</select>`;
      } else if (f.type === 'number') {
        html += `<input type="number" data-key="${f.key}" value="${selectedNode.fields[f.key]}">`;
      } else {
        html += `<input type="text" data-key="${f.key}" value="${selectedNode.fields[f.key]}">`;
      }
      html += `</div>`;
    });
    inspectorBody.innerHTML = html;
    inspectorBody.querySelectorAll('input, select').forEach(inp => {
      inp.addEventListener('input', () => {
        selectedNode.fields[inp.dataset.key] = inp.type === 'number' ? Number(inp.value) : inp.value;
        refreshEvaluation();
      });
    });
  }

  let drag = null;
  function startDrag(e, node) {
    e.stopPropagation();
    selectNode(node);
    const start = toWorld(e.clientX, e.clientY);
    drag = { node, dx: start.x - node.wx, dy: start.y - node.wy };
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  }
  function onDrag(e) {
    if (!drag) return;
    const w = toWorld(e.clientX, e.clientY);
    drag.node.wx = w.x - drag.dx;
    drag.node.wy = w.y - drag.dy;
    const s = toScreen(drag.node.wx, drag.node.wy);
    drag.node.el.style.left = s.x + 'px';
    drag.node.el.style.top = s.y + 'px';
    updateWires();
  }
  function endDrag() {
    drag = null;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
  }

  function portWorldPos(node, portEl, dir) {
    const nodeScreen = { x: parseFloat(node.el.style.left), y: parseFloat(node.el.style.top) };
    const pr = portEl.getBoundingClientRect();
    const nodeR = node.el.getBoundingClientRect();
    const sx = nodeScreen.x + (pr.left + pr.width / 2 - nodeR.left);
    const sy = nodeScreen.y + (pr.top + pr.height / 2 - nodeR.top);
    return toWorld(sx, sy);
  }

  function startWire(e, node, portEl) {
    e.stopPropagation();
    const dir = portEl.dataset.dir;
    const port = portEl.dataset.port;
    tempWire = { fromNode: node, fromPort: port, fromDir: dir, el: portEl };
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'temp-wire');
    svg.appendChild(path);
    tempWire.path = path;

    if (dir === 'out') {
      tempWire.start = portWorldPos(node, portEl, dir);
    } else {
      tempWire.start = portWorldPos(node, portEl, dir);
    }

    document.addEventListener('mousemove', onWireMove);
    document.addEventListener('mouseup', endWire);
  }

  function onWireMove(e) {
    if (!tempWire) return;
    const cur = toWorld(e.clientX, e.clientY);
    const s = toScreen(tempWire.start.x, tempWire.start.y);
    const c = toScreen(cur.x, cur.y);
    let d;
    if (tempWire.fromDir === 'out') {
      d = bezier(s.x, s.y, c.x, c.y);
    } else {
      d = bezier(c.x, c.y, s.x, s.y);
    }
    tempWire.path.setAttribute('d', d);
  }

  function endWire(e) {
    document.removeEventListener('mousemove', onWireMove);
    document.removeEventListener('mouseup', endWire);
    if (!tempWire) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (target && target.classList.contains('port')) {
      const targetNodeEl = target.closest('.node');
      const targetNode = nodes.get(targetNodeEl.dataset.id);
      const targetPort = target.dataset.port;
      const targetDir = target.dataset.dir;
      // wire must go out -> in
      let from, to;
      if (tempWire.fromDir === 'out' && targetDir === 'in') {
        from = { node: tempWire.fromNode, port: tempWire.fromPort };
        to = { node: targetNode, port: targetPort };
      } else if (tempWire.fromDir === 'in' && targetDir === 'out') {
        from = { node: targetNode, port: targetPort };
        to = { node: tempWire.fromNode, port: tempWire.fromPort };
      }
      if (from && to) {
        // prevent duplicate input connections (one wire per input)
        if (to.node.type === 'output' ? false : true) {
          const existing = wires.findIndex(w => w.to === to.node.id && w.toPort === to.port);
          if (existing >= 0) wires.splice(existing, 1);
        }
        // prevent self-loop direct
        if (from.node.id !== to.node.id) {
          wires.push({ from: from.node.id, fromPort: from.port, to: to.node.id, toPort: to.port });
        }
      }
    }
    tempWire.path.remove();
    tempWire = null;
    updateWires();
    refreshEvaluation();
    updateStatus();
  }

  function bezier(x1, y1, x2, y2) {
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }

  function updateWires() {
    // remove all wire paths
    Array.from(svg.querySelectorAll('.wire')).forEach(p => p.remove());
    wires.forEach((w, i) => {
      const fn = nodes.get(w.from), tn = nodes.get(w.to);
      if (!fn || !tn) return;
      const fPort = Array.from(fn.ports).find(p => p.dataset.port === w.fromPort && p.dataset.dir === 'out');
      const tPort = Array.from(tn.ports).find(p => p.dataset.port === w.toPort && p.dataset.dir === 'in');
      if (!fPort || !tPort) return;
      const fp = portWorldPos(fn, fPort, 'out');
      const tp = portWorldPos(tn, tPort, 'in');
      const fs = toScreen(fp.x, fp.y), ts = toScreen(tp.x, tp.y);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'wire' + (selectedNode && (selectedNode.id === w.from || selectedNode.id === w.to) ? ' active' : ''));
      path.setAttribute('d', bezier(fs.x, fs.y, ts.x, ts.y));
      path.addEventListener('click', () => removeWire(i));
      svg.appendChild(path);
      fPort.classList.add('connected');
      tPort.classList.add('connected');
    });
  }

  function removeWire(i) {
    wires.splice(i, 1);
    updateWires();
    refreshEvaluation();
    updateStatus();
  }

  function updateStatus() {
    statusEl.textContent = `${nodes.size} nodes · ${wires.length} wires`;
  }

  // panning
  let panning = false, panStart = null;
  gridCanvas.addEventListener('mousedown', (e) => {
    panning = true; panStart = { x: e.clientX - view.x, y: e.clientY - view.y };
    selectNode(null);
  });
  window.addEventListener('mousemove', (e) => {
    if (panning) {
      view.x = e.clientX - panStart.x;
      view.y = e.clientY - panStart.y;
      drawGrid();
      // reposition nodes visually
      for (const node of nodes.values()) {
        const s = toScreen(node.wx, node.wy);
        node.el.style.left = s.x + 'px';
        node.el.style.top = s.y + 'px';
      }
      updateWires();
    }
  });
  window.addEventListener('mouseup', () => { panning = false; });

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const mx = e.clientX, my = e.clientY;
    const wx = (mx - view.x) / view.scale;
    const wy = (my - view.y) / view.scale;
    view.scale = Math.min(2.5, Math.max(0.4, view.scale * factor));
    view.x = mx - wx * view.scale;
    view.y = my - wy * view.scale;
    drawGrid();
    for (const node of nodes.values()) {
      const s = toScreen(node.wx, node.wy);
      node.el.style.left = s.x + 'px';
      node.el.style.top = s.y + 'px';
    }
    updateWires();
  }, { passive: false });

  // delete key
  window.addEventListener('keydown', (e) => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedNode) {
      const id = selectedNode.id;
      for (let i = wires.length - 1; i >= 0; i--) {
        if (wires[i].from === id || wires[i].to === id) wires.splice(i, 1);
      }
      selectedNode.el.remove();
      nodes.delete(id);
      selectedNode = null;
      renderInspector();
      updateWires();
      refreshEvaluation();
      updateStatus();
    }
  });

  // toolbar
  function placeNew() {
    const c = toWorld(window.innerWidth / 2 - 90, window.innerHeight / 2 - 40);
    return c;
  }
  document.getElementById('addNumber').addEventListener('click', () => {
    const c = placeNew(); makeNode('number', c.x + (Math.random()*60-30), c.y + (Math.random()*60-30));
    updateStatus();
  });
  document.getElementById('addMath').addEventListener('click', () => {
    const c = placeNew(); makeNode('math', c.x + (Math.random()*60-30), c.y + (Math.random()*60-30));
    updateStatus();
  });
  document.getElementById('addOutput').addEventListener('click', () => {
    const c = placeNew(); makeNode('output', c.x + (Math.random()*60-30), c.y + (Math.random()*60-30));
    updateStatus();
  });
  document.getElementById('deleteNode').addEventListener('click', () => {
    if (selectedNode) window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete' }));
  });
  document.getElementById('reset').addEventListener('click', () => {
    nodes.forEach(n => n.el.remove());
    nodes.clear(); wires.length = 0; selectedNode = null; nodeSeq = 0;
    renderInspector(); updateWires(); refreshEvaluation(); updateStatus();
    seed();
  });

  function seed() {
    const n1 = makeNode('number', -260, -120); n1.fields.value = 12;
    const n2 = makeNode('number', -260, 40); n2.fields.value = 8;
    const m = makeNode('math', -20, -40); m.fields.op = 'multiply';
    const out = makeNode('output', 240, -20);
    wires.push({ from: n1.id, fromPort: 'value', to: m.id, toPort: 'a' });
    wires.push({ from: n2.id, fromPort: 'value', to: m.id, toPort: 'b' });
    wires.push({ from: m.id, fromPort: 'result', to: out.id, toPort: 'in' });
    // sync inspector fields display
    n1.el.querySelector('[data-key="value"]') && (n1.el.querySelector('[data-key="value"]').value = 12);
    refreshEvaluation();
    updateWires();
    updateStatus();
    selectNode(m);
  }

  window.addEventListener('resize', () => { resizeCanvas(); updateWires(); });
  resizeCanvas();
  seed();
})();
</script>
</body>
</html>
