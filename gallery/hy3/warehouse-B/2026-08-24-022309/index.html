<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warehouse Run — Package Sorting Sim</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --ink: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --line: #30363d;
    --in: #1f6feb;
    --out: #da3633;
    --floor: #11161d;
    --floor-line: #21262d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 280px;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    width: 100vw;
  }
  header {
    grid-column: 1 / 3;
    display: flex; align-items: center; gap: 16px;
    padding: 0 18px;
    background: linear-gradient(180deg, #11161d, #0d1117);
    border-bottom: 1px solid var(--line);
  }
  header .logo {
    font-weight: 700; letter-spacing: .5px; font-size: 15px;
    display: flex; align-items: center; gap: 9px;
  }
  header .logo .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header .clock {
    font-variant-numeric: tabular-nums;
    color: var(--ink); font-size: 14px;
    background: var(--panel); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 8px;
  }

  #stage {
    position: relative;
    background: var(--floor);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #side {
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 14px;
    gap: 14px;
    overflow-y: auto;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
  }
  .card h3 {
    margin: 0 0 9px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); font-weight: 600;
  }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; }
  .stat-row .k { color: var(--muted); font-size: 13px; }
  .stat-row .v { font-size: 16px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .big {
    font-size: 30px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .accent { color: var(--accent); }

  .workers { display: flex; flex-direction: column; gap: 7px; }
  .wbar {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .wbar .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .wbar .name { width: 64px; color: var(--ink); }
  .wbar .meter { flex: 1; height: 7px; background: #0b0f14; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .wbar .meter > span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .wbar .st { width: 54px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .controls { display: flex; flex-direction: column; gap: 9px; }
  .btn {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink);
    padding: 9px 12px; border-radius: 9px; font-size: 13px;
    cursor: pointer; font-weight: 600; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #04101f; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: #04101f; }
  .btn.ghost { background: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  label.sl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 5px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend .chip { width: 14px; height: 14px; border-radius: 4px; }

  .toast {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(13,17,23,.85); border: 1px solid var(--line);
    color: var(--ink); padding: 8px 14px; border-radius: 10px;
    font-size: 12.5px; backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hint {
    position: absolute; top: 12px; left: 14px;
    background: rgba(13,17,23,.7); border: 1px solid var(--line);
    padding: 7px 11px; border-radius: 9px; font-size: 12px; color: var(--muted);
    backdrop-filter: blur(6px);
  }
  .hint b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="dot"></span> WAREHOUSE&nbsp;RUN</div>
    <div class="sub">inbound → sort floor → outbound</div>
    <div class="spacer"></div>
    <div class="clock" id="clock">00:00</div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hint">Workers auto-route packages from <b style="color:var(--in)">inbound</b> docks to <b style="color:var(--out)">outbound</b> docks.</div>
    <div class="toast" id="toast"></div>
  </div>

  <aside id="side">
    <div class="card">
      <h3>Throughput</h3>
      <div class="big good" id="delivered">0</div>
      <div class="stat-row"><span class="k">Loaded (inbound)</span><span class="v" id="loaded">0</span></div>
      <div class="stat-row"><span class="k">In transit</span><span class="v accent" id="transit">0</span></div>
      <div class="stat-row"><span class="k">Shipped (outbound)</span><span class="v" id="shipped">0</span></div>
    </div>

    <div class="card">
      <h3>Crew</h3>
      <div class="workers" id="workers"></div>
    </div>

    <div class="card">
      <h3>Controls</h3>
      <div class="controls">
        <div class="row2">
          <button class="btn primary" id="playBtn">Pause</button>
          <button class="btn ghost" id="resetBtn">Reset</button>
        </div>
        <div>
          <label class="sl"><span>Arrival rate</span><span id="rateVal">1.0×</span></label>
          <input type="range" id="rate" min="0.3" max="3" step="0.1" value="1" />
        </div>
        <div>
          <label class="sl"><span>Crew size</span><span id="crewVal">5</span></label>
          <input type="range" id="crew" min="2" max="9" step="1" value="5" />
        </div>
        <div>
          <label class="sl"><span>Speed</span><span id="spdVal">1.0×</span></label>
          <input type="range" id="spd" min="0.5" max="2.5" step="0.1" value="1" />
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Legend</h3>
      <div class="legend">
        <div><span class="chip" style="background:var(--in)"></span> Inbound truck</div>
        <div><span class="chip" style="background:var(--out)"></span> Outbound truck</div>
        <div><span class="chip" style="background:#d9a441"></span> Package</div>
        <div><span class="chip" style="background:#e6edf3"></span> Worker (carrying = tinted)</div>
      </div>
    </div>
  </aside>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const r = cv.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }
  window.addEventListener("resize", resize);

  // ---- World layout ----
  let L = {};
  function layout() {
    const pad = Math.max(14, Math.min(W, H) * 0.03);
    const dockW = Math.min(150, W * 0.16);
    const inX = pad;                 // inbound dock left edge
    const outX = W - pad - dockW;    // outbound dock left edge
    const top = pad + 28;
    const bot = H - pad;
    L = {
      pad, dockW, inX, outX, top, bot,
      floorX: inX + dockW + 8,
      floorW: (outX - 8) - (inX + dockW + 8),
      midY: (top + bot) / 2,
      inShelfY: top + 30,
      outShelfY: bot - 30,
    };
    // keep trucks docked within bounds
    L.inTruck = { x: inX, y: top + 10, w: dockW, h: 96 };
    L.outTruck = { x: outX, y: bot - 106, w: dockW, h: 96 };
  }

  // ---- Simulation state ----
  let sim = null;
  function makeSim() {
    return {
      running: true,
      t: 0,
      rate: 1, speed: 1,
      delivered: 0,
      loaded: 0,
      shipped: 0,
      packages: [],     // floating packages to be picked
      workers: [],
      spawnTimer: 0,
      pkgId: 0,
      nextDock: "in",    // alternate which truck
    };
  }

  const WORKER_NAMES = ["Ava","Ben","Cleo","Dee","Eli","Fay","Gus","Hugo","Iris"];
  const WORKER_COLORS = ["#58a6ff","#bc8cff","#39c5cf","#ff7b72","#f2cc60","#7ee787","#ff9bce","#79c0ff","#d2a8ff"];

  function spawnWorker(i) {
    return {
      id: i,
      name: WORKER_NAMES[i % WORKER_NAMES.length],
      color: WORKER_COLORS[i % WORKER_COLORS.length],
      // start on the floor
      x: L.floorX + Math.random() * L.floorW,
      y: L.midY + (Math.random() - 0.5) * 40,
      target: null,        // package or dock
      carrying: null,      // package object
      state: "idle",       // idle | toPick | toDock
      speed: 58 + Math.random() * 22, // px/sec
      carried: 0,
    };
  }

  function rebuildCrew(n) {
    const old = sim.workers;
    sim.workers = [];
    for (let i = 0; i < n; i++) {
      if (old[i]) sim.workers.push(old[i]);
      else sim.workers.push(spawnWorker(i));
    }
  }

  function spawnPackage() {
    const fromIn = L.inTruck;
    const side = sim.nextDock === "in" ? fromIn : L.outTruck;
    sim.nextDock = sim.nextDock === "in" ? "out" : "in";
    const p = {
      id: sim.pkgId++,
      x: side.x + 18 + Math.random() * (side.w - 36),
      y: side.y + 14 + Math.random() * (side.h - 28),
      homeX: side.x,
      target: side === fromIn ? "out" : "in", // deliver opposite
      claimed: false,
      born: sim.t,
    };
    sim.packages.push(p);
    sim.loaded++;
    return p;
  }

  // ---- Update ----
  function update(dt) {
    if (!sim.running) return;
    const sdt = dt * sim.speed;

    // spawn packages on inbound truck (and a few on outbound to balance)
    sim.spawnTimer -= sdt;
    const interval = 1.6 / sim.rate;
    if (sim.spawnTimer <= 0) {
      sim.spawnTimer = interval;
      spawnPackage();
      // occasionally seed an outbound-bound package too
      if (Math.random() < 0.5) spawnPackage();
    }

    // worker logic
    for (const w of sim.workers) {
      if (w.state === "idle") {
        // find nearest unclaimed package
        let best = null, bd = 1e9;
        for (const p of sim.packages) {
          if (p.claimed) continue;
          const d = (p.x - w.x) ** 2 + (p.y - w.y) ** 2;
          if (d < bd) { bd = d; best = p; }
        }
        if (best) {
          best.claimed = true;
          w.target = best;
          w.state = "toPick";
        } else {
          // drift toward floor center
          const tx = L.floorX + L.floorW / 2;
          const ty = L.midY;
          stepToward(w, tx, ty, sdt, w.speed * 0.5);
        }
      } else if (w.state === "toPick") {
        const p = w.target;
        if (!p || p.delivered) { w.state = "idle"; w.target = null; continue; }
        const reached = stepToward(w, p.x, p.y, sdt, w.speed);
        if (reached) {
          w.carrying = p;
          w.carried++;
          // remove from packages list (now attached)
          sim.packages = sim.packages.filter(x => x !== p);
          // target dock: opposite of origin
          const dock = p.target === "out" ? L.outTruck : L.inTruck;
          w.target = dock;
          w.state = "toDock";
        }
      } else if (w.state === "toDock") {
        const dock = w.target;
        const px = dock.x + dock.w / 2;
        const py = dock.y + dock.h / 2;
        const reached = stepToward(w, px, py, sdt, w.speed);
        if (reached) {
          // deliver
          w.carrying.delivered = true;
          sim.delivered++;
          sim.shipped++;
          w.carrying = null;
          w.target = null;
          w.state = "idle";
        }
      }
    }

    // keep package positions settled (they sit on truck)
    sim.t += sdt;
  }

  function stepToward(w, tx, ty, dt, speed) {
    const dx = tx - w.x, dy = ty - w.y;
    const d = Math.hypot(dx, dy);
    if (d < 4) return true;
    const v = Math.min(d, speed * dt);
    w.x += (dx / d) * v;
    w.y += (dy / d) * v;
    return d <= v + 0.5;
  }

  // ---- Render ----
  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawFloor();
    drawTruck(L.inTruck, "#1f6feb", "INBOUND", sim.loaded);
    drawTruck(L.outTruck, "#da3633", "OUTBOUND", sim.shipped);
    drawPackages();
    drawWorkers();
    drawConveyorHint();
  }

  function drawFloor() {
    // floor area
    const fx = L.floorX, fy = L.top, fw = L.floorW, fh = L.bot - L.top;
    const g = ctx.createLinearGradient(0, fy, 0, fy + fh);
    g.addColorStop(0, "#141b24");
    g.addColorStop(1, "#0e131a");
    ctx.fillStyle = g;
    roundRect(fx, fy, fw, fh, 10); ctx.fill();

    // grid lines
    ctx.strokeStyle = "#1b222c";
    ctx.lineWidth = 1;
    const step = 46;
    ctx.beginPath();
    for (let x = fx; x <= fx + fw; x += step) { ctx.moveTo(x, fy); ctx.lineTo(x, fy + fh); }
    for (let y = fy; y <= fy + fh; y += step) { ctx.moveTo(fx, y); ctx.lineTo(fx + fw, y); }
    ctx.stroke();

    // center lane
    ctx.strokeStyle = "rgba(88,166,255,0.18)";
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(fx + fw * 0.5, fy + 10);
    ctx.lineTo(fx + fw * 0.5, fy + fh - 10);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawConveyorHint() {
    // subtle arrow from inbound to outbound along center
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = "#58a6ff";
    const y = L.midY;
    for (let i = 0; i < 3; i++) {
      const x = L.floorX + L.floorW * (0.25 + i * 0.25) - 8;
      ctx.beginPath();
      ctx.moveTo(x, y - 6); ctx.lineTo(x + 12, y); ctx.lineTo(x, y + 6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawTruck(t, color, label, count) {
    ctx.save();
    // body
    const g = ctx.createLinearGradient(t.x, t.y, t.x, t.y + t.h);
    g.addColorStop(0, color);
    g.addColorStop(1, shade(color, -28));
    ctx.fillStyle = g;
    roundRect(t.x, t.y, t.w, t.h, 8); ctx.fill();
    // cab hint
    ctx.fillStyle = shade(color, -45);
    roundRect(t.x + 4, t.y + 4, 18, t.h - 8, 4); ctx.fill();
    // label
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "bold 11px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(label, t.x + 26, t.y + 16);
    // count badge
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    roundRect(t.x + 26, t.y + t.h - 24, 46, 16, 6); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(String(count), t.x + 32, t.y + t.h - 12);
    ctx.restore();
  }

  function drawPackages() {
    for (const p of sim.packages) {
      drawBox(p.x, p.y, 14);
    }
  }

  function drawBox(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    const g = ctx.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, "#e3b056");
    g.addColorStop(1, "#c98f33");
    ctx.fillStyle = g;
    roundRect(-s/2, -s/2, s, s, 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s/2,-s/2); ctx.lineTo(s/2,s/2);
    ctx.moveTo(s/2,-s/2); ctx.lineTo(-s/2,s/2); ctx.stroke();
    ctx.restore();
  }

  function drawWorkers() {
    for (const w of sim.workers) {
      const r = 9;
      // shadow
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath(); ctx.ellipse(w.x, w.y + r - 1, r, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      // body
      ctx.fillStyle = w.carrying ? "#e6edf3" : w.color;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = w.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2); ctx.stroke();
      // name
      ctx.fillStyle = "rgba(230,237,243,0.8)";
      ctx.font = "9px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(w.name, w.x, w.y - r - 3);
      // carried package
      if (w.carrying) {
        drawBox(w.x, w.y - r - 8, 11);
      }
      // progress meter when toDock
      if (w.state === "toDock" && w.carrying) {
        const dock = w.target;
        const dgoal = Math.hypot(dock.x + dock.w/2 - w.x, dock.y + dock.h/2 - w.y);
        const prog = Math.max(0, Math.min(1, 1 - dgoal / 240));
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        roundRect(w.x - r, w.y + r + 2, r * 2, 3, 2); ctx.fill();
        ctx.fillStyle = w.color;
        roundRect(w.x - r, w.y + r + 2, r * 2 * prog, 3, 2); ctx.fill();
      }
    }
  }

  // helpers
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shade(hex, amt) {
    const c = hex.replace('#','');
    let r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  // ---- HUD ----
  const el = {
    delivered: document.getElementById("delivered"),
    loaded: document.getElementById("loaded"),
    transit: document.getElementById("transit"),
    shipped: document.getElementById("shipped"),
    workers: document.getElementById("workers"),
    clock: document.getElementById("clock"),
    playBtn: document.getElementById("playBtn"),
    resetBtn: document.getElementById("resetBtn"),
    rate: document.getElementById("rate"),
    rateVal: document.getElementById("rateVal"),
    crew: document.getElementById("crew"),
    crewVal: document.getElementById("crewVal"),
    spd: document.getElementById("spd"),
    spdVal: document.getElementById("spdVal"),
    toast: document.getElementById("toast"),
  };

  let toastTimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1600);
  }

  function updateHUD() {
    el.delivered.textContent = sim.delivered;
    el.loaded.textContent = sim.loaded;
    el.transit.textContent = sim.workers.filter(w => w.carrying).length;
    el.shipped.textContent = sim.shipped;

    // clock
    const total = Math.floor(sim.t);
    const m = String(Math.floor(total / 60)).padStart(2, "0");
    const s = String(total % 60).padStart(2, "0");
    el.clock.textContent = `${m}:${s}`;

    // workers
    if (el.workers.childElementCount !== sim.workers.length) {
      el.workers.innerHTML = "";
      sim.workers.forEach((w) => {
        const d = document.createElement("div");
        d.className = "wbar";
        d.innerHTML = `<span class="swatch" style="background:${w.color}"></span>
          <span class="name">${w.name}</span>
          <span class="meter"><span></span></span>
          <span class="st">idle</span>`;
        el.workers.appendChild(d);
      });
    }
    const rows = el.workers.children;
    sim.workers.forEach((w, i) => {
      const row = rows[i];
      const meter = row.querySelector(".meter > span");
      const st = row.querySelector(".st");
      const prog = w.state === "toDock" && w.carrying
        ? 1 - Math.hypot(w.target.x + w.target.w/2 - w.x, w.target.y + w.target.h/2 - w.y) / 240
        : (w.state === "toPick" ? 0.5 : 0);
      meter.style.width = Math.max(0, Math.min(1, prog)) * 100 + "%";
      st.textContent = w.state === "idle" ? "idle"
        : w.state === "toPick" ? "fetch" : "haul";
    });
  }

  // ---- Controls ----
  el.playBtn.addEventListener("click", () => {
    sim.running = !sim.running;
    el.playBtn.textContent = sim.running ? "Pause" : "Resume";
    toast(sim.running ? "Running" : "Paused");
  });
  el.resetBtn.addEventListener("click", () => {
    const rate = sim.rate, speed = sim.speed, crew = sim.workers.length;
    sim = makeSim();
    sim.rate = rate; sim.speed = speed;
    rebuildCrew(crew);
    el.playBtn.textContent = "Pause";
    toast("Warehouse reset");
  });
  el.rate.addEventListener("input", () => {
    sim.rate = parseFloat(el.rate.value);
    el.rateVal.textContent = sim.rate.toFixed(1) + "×";
  });
  el.spd.addEventListener("input", () => {
    sim.speed = parseFloat(el.spd.value);
    el.spdVal.textContent = sim.speed.toFixed(1) + "×";
  });
  el.crew.addEventListener("input", () => {
    const n = parseInt(el.crew.value, 10);
    el.crewVal.textContent = n;
    rebuildCrew(n);
  });

  // click a worker to boost its speed briefly (interaction bonus)
  cv.addEventListener("click", (e) => {
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    for (const w of sim.workers) {
      if (Math.hypot(w.x - mx, w.y - my) < 14) {
        w.speed = (w.speed || 70) * 1.4;
        setTimeout(() => { w.speed = 58 + (w.id * 7 % 22); }, 1500);
        toast(`${w.name} hustling!`);
        break;
      }
    }
  });

  // ---- Boot ----
  function init() {
    sim = makeSim();
    rebuildCrew(5);
    resize();
    // seed a few packages so it's alive immediately
    for (let i = 0; i < 4; i++) spawnPackage();
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  let lastT = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    update(dt);
    draw();
    updateHUD();
    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
