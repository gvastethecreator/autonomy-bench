<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>The Endless Labyrinth</title>
<style>
  :root {
    --ink: #cfe3ff;
    --dim: #6f86ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05070d; overflow: hidden; }
  body { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: var(--ink); }
  #scene { position: fixed; inset: 0; display: block; }

  /* Vignette + grain overlay for atmosphere */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(120% 120% at 50% 45%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.92) 100%);
    mix-blend-mode: multiply;
  }
  #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* Title card */
  #title {
    position: fixed; left: 0; right: 0; top: 7vh; z-index: 8; text-align: center;
    pointer-events: none; transition: opacity 1.6s ease;
  }
  #title h1 {
    font-size: clamp(28px, 6vw, 64px); font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; text-shadow: 0 0 22px rgba(120,170,255,0.35);
  }
  #title p {
    margin-top: 0.9em; font-size: clamp(11px, 1.6vw, 15px); letter-spacing: 0.42em;
    text-transform: uppercase; color: var(--dim);
  }

  /* HUD */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 5vh; z-index: 8; text-align: center;
    pointer-events: none; font-size: clamp(10px, 1.4vw, 13px); letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--dim); transition: opacity 1.2s ease;
  }
  #hud .depth { color: var(--ink); }
  #hud .dot { color: #4a5d7d; margin: 0 0.7em; }

  /* Fade-to-black transition layer */
  #fade {
    position: fixed; inset: 0; z-index: 9; background: #05070d;
    opacity: 0; pointer-events: none; transition: opacity 1.1s ease;
  }

  /* Compass hint (top-right) */
  #compass {
    position: fixed; top: 4vh; right: 4vh; z-index: 8; width: 64px; height: 64px;
    pointer-events: none; opacity: 0.7;
  }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 11vh; z-index: 8; text-align: center;
    pointer-events: none; font-size: clamp(9px, 1.2vw, 12px); letter-spacing: 0.34em;
    text-transform: uppercase; color: #4a5d7d; transition: opacity 1.4s ease;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="title">
  <h1>The Endless Labyrinth</h1>
  <p>A self-walking descent into the infinite</p>
</div>

<svg id="compass" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#2a3a59" stroke-width="1.5"/>
  <g id="needle">
    <polygon points="50,10 44,50 50,46 56,50" fill="#7fb4ff"/>
    <polygon points="50,90 44,50 50,54 56,50" fill="#34466b"/>
  </g>
</svg>

<div id="hint">Press any key or tap to steer &middot; the maze walks itself otherwise</div>

<div id="hud">
  <span class="depth">Depth <span id="depthVal">0</span></span>
  <span class="dot">&bull;</span>
  <span>Corridors explored <span id="roomsVal">0</span></span>
</div>

<div id="fade"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const CELL = 4.0;            // world spacing between maze cells
const WALL_H = 3.6;          // wall height
const EYE = 1.65;            // camera eye height
const W = 15, H = 15;        // maze half-dimensions (grid is 2W+1 x 2H+1)
const GW = 2 * W + 1, GH = 2 * H + 1;
const SPEED = 3.4;           // base walk speed (units/sec)
const TURN_RATE = 2.6;       // rad/sec turn speed
const REGEN_MARGIN = 5;      // regenerate when within this many cells of the edge

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0x0a1322);
scene.background = FOG_COLOR;
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.055);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, EYE, 0);

// ---------------------------------------------------------------------------
// Lighting
// ---------------------------------------------------------------------------
const ambient = new THREE.AmbientLight(0x35507f, 0.55);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x4f6fae, 0x0a0f1a, 0.35);
scene.add(hemi);

// A wandering lantern carried with the walker.
const lantern = new THREE.PointLight(0xffd9a0, 2.4, 26, 1.6);
lantern.position.set(0, EYE + 0.2, 0);
scene.add(lantern);

// Cool rim light following behind for depth separation.
const rim = new THREE.PointLight(0x6fa0ff, 1.4, 22, 2.0);
scene.add(rim);

// ---------------------------------------------------------------------------
// Materials (procedural canvas textures)
// ---------------------------------------------------------------------------
function makeWallTexture() {
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#1c2740'; g.fillRect(0, 0, s, s);
  // stone blocks
  const bw = 42, bh = 30;
  for (let y = 0; y < s; y += bh) {
    const off = ((y / bh) % 2) * (bw / 2);
    for (let x = -bw; x < s + bw; x += bw) {
      const shade = 26 + Math.floor(Math.random() * 26);
      g.fillStyle = `rgb(${shade},${shade + 12},${shade + 34})`;
      g.fillRect(x + off + 2, y + 2, bw - 4, bh - 4);
      // mortar highlight
      g.strokeStyle = 'rgba(10,16,28,0.6)';
      g.strokeRect(x + off + 2, y + 2, bw - 4, bh - 4);
    }
  }
  // grime streaks
  for (let i = 0; i < 60; i++) {
    g.fillStyle = `rgba(0,0,0,${0.04 + Math.random() * 0.08})`;
    const x = Math.random() * s;
    g.fillRect(x, 0, 1 + Math.random() * 2, s);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeFloorTexture() {
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#0e1626'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 5000; i++) {
    const v = Math.random();
    g.fillStyle = `rgba(${20 + v * 30},${26 + v * 30},${40 + v * 40},${0.04 + Math.random() * 0.05})`;
    g.fillRect(Math.random() * s, Math.random() * s, 1.5, 1.5);
  }
  // cracks
  for (let i = 0; i < 14; i++) {
    g.strokeStyle = 'rgba(0,0,0,0.35)';
    g.lineWidth = 1;
    g.beginPath();
    let x = Math.random() * s, y = Math.random() * s;
    g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 50; y += (Math.random() - 0.5) * 50; g.lineTo(x, y); }
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const wallTex = makeWallTexture();
const floorTex = makeFloorTexture();

const wallMat = new THREE.MeshStandardMaterial({
  map: wallTex, color: 0x9fb4d6, roughness: 0.92, metalness: 0.05,
});
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTex, color: 0x7e90b4, roughness: 0.97, metalness: 0.0,
});

// ---------------------------------------------------------------------------
// Maze generation (recursive backtracker on a 2W+1 x 2H+1 grid)
// grid[r][c] === true  => wall ; false => passage
// ---------------------------------------------------------------------------
function generateMaze() {
  const grid = [];
  for (let r = 0; r < GH; r++) { grid.push(new Array(GW).fill(true)); }

  const inB = (r, c) => r > 0 && c > 0 && r < GH - 1 && c < GW - 1;
  const stack = [[1, 1]];
  grid[1][1] = false;
  const dirs = [[-2, 0], [2, 0], [0, -2], [0, 2]];

  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const opts = [];
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (inB(nr, nc) && grid[nr][nc] === true) opts.push([nr, nc, dr, dc]);
    }
    if (opts.length === 0) { stack.pop(); continue; }
    const [nr, nc, dr, dc] = opts[(Math.random() * opts.length) | 0];
    grid[r + dr / 2][c + dc / 2] = false;
    grid[nr][nc] = false;
    stack.push([nr, nc]);
  }
  return grid;
}

// ---------------------------------------------------------------------------
// Maze mesh builder (floor + instanced walls)
// ---------------------------------------------------------------------------
let mazeGroup = null;
let grid = null;

function gridToWorld(r, c) {
  return new THREE.Vector3((c - (GW - 1) / 2) * CELL, 0, (r - (GH - 1) / 2) * CELL);
}

function buildMaze() {
  if (mazeGroup) { scene.remove(mazeGroup); disposeGroup(mazeGroup); }
  grid = generateMaze();
  mazeGroup = new THREE.Group();

  // Floor plane covering the whole grid
  const fullW = GW * CELL, fullD = GH * CELL;
  const floorGeo = new THREE.PlaneGeometry(fullW, fullD);
  floorTex.repeat.set(GW, GH);
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, 0);
  mazeGroup.add(floor);

  // Ceiling (subtle, to enclose atmosphere) - darker
  const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0a1120, roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide });
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(fullW, fullD), ceilMat);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = WALL_H;
  mazeGroup.add(ceil);

  // Count wall cells for instancing
  let count = 0;
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) if (grid[r][c]) count++;

  const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const walls = new THREE.InstancedMesh(wallGeo, wallMat, count);
  walls.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  const dummy = new THREE.Object3D();
  const tint = new THREE.Color();
  let i = 0;
  for (let r = 0; r < GH; r++) {
    for (let c = 0; c < GW; c++) {
      if (!grid[r][c]) continue;
      const p = gridToWorld(r, c);
      dummy.position.set(p.x, WALL_H / 2, p.z);
      dummy.updateMatrix();
      walls.setMatrixAt(i, dummy.matrix);
      // subtle per-wall color variation for depth
      const v = 0.82 + Math.random() * 0.32;
      tint.setRGB(v, v, v * 1.04);
      walls.setColorAt(i, tint);
      i++;
    }
  }
  walls.instanceMatrix.needsUpdate = true;
  if (walls.instanceColor) walls.instanceColor.needsUpdate = true;
  mazeGroup.add(walls);

  // Scattered glowing moss / runes on some walls for art direction
  addWallGlows(mazeGroup);

  scene.add(mazeGroup);
}

function addWallGlows(group) {
  const glowGeo = new THREE.PlaneGeometry(0.9, 0.9);
  for (let n = 0; n < 26; n++) {
    const r = 1 + ((Math.random() * (GH - 2)) | 0);
    const c = 1 + ((Math.random() * (GW - 2)) | 0);
    if (!grid[r][c]) continue;
    const p = gridToWorld(r, c);
    const hue = 0.55 + Math.random() * 0.12; // teal-cyan
    const col = new THREE.Color().setHSL(hue, 0.7, 0.5);
    const mat = new THREE.MeshBasicMaterial({
      color: col, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide, depthWrite: false,
    });
    const m = new THREE.Mesh(glowGeo, mat);
    // face a random passage direction
    const dir = [[0, 1], [0, -1], [1, 0], [-1, 0]][(Math.random() * 4) | 0];
    m.position.set(p.x + dir[1] * (CELL / 2 - 0.05), WALL_H * (0.35 + Math.random() * 0.4), p.z + dir[0] * (CELL / 2 - 0.05));
    m.lookAt(m.position.x + dir[1], m.position.y, m.position.z + dir[0]);
    m.userData.flicker = 0.6 + Math.random() * 0.8;
    m.userData.base = 0.6 + Math.random() * 0.4;
    group.add(m);
    glowMeshes.push(m);
  }
}

let glowMeshes = [];

function disposeGroup(g) {
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

// ---------------------------------------------------------------------------
// Walker (self-navigating first-person)
// ---------------------------------------------------------------------------
const DIRS = [
  { dr: -1, dc: 0, yaw: 0 },         // north (-z)
  { dr: 1, dc: 0, yaw: Math.PI },    // south (+z)
  { dr: 0, dc: -1, yaw: -Math.PI / 2 }, // west (-x)
  { dr: 0, dc: 1, yaw: Math.PI / 2 },  // east (+x)
];

const walker = {
  r: 1, c: 1,
  x: 0, z: 0,
  yaw: 0,
  targetYaw: 0,
  moving: false,
  fromX: 0, fromZ: 0, toX: 0, toZ: 0,
  t: 0,
  depth: 0,
  rooms: 0,
  visited: new Set(),
  nextTurn: 0,
};

function key(r, c) { return r + ',' + c; }

function passage(r, c) {
  return r >= 0 && c >= 0 && r < GH && c < GW && grid[r][c] === false;
}

function startWalker() {
  walker.r = 1; walker.c = 1;
  const p = gridToWorld(1, 1);
  walker.x = p.x; walker.z = p.z; walker.yaw = 0; walker.targetYaw = 0;
  walker.moving = false; walker.depth = 0; walker.rooms = 0;
  walker.visited = new Set([key(1, 1)]);
  walker.nextTurn = 0;
}

// Choose the next cell from current. Prefer going straight, avoid immediate
// backtrack unless it's the only option. A pending user turn (walker.nextTurn)
// biases the choice at the next junction. Returns a DIR or null.
function chooseNext() {
  const straight = DIRS.find(d => dirYawEquals(d.yaw, walker.yaw));
  const opts = [];
  for (const d of DIRS) {
    if (passage(walker.r + d.dr, walker.c + d.dc)) {
      // prefer not to backtrack
      const isBack = straight && dirYawEquals(d.yaw, straight.yaw) === false &&
        Math.abs(angleDiff(d.yaw, walker.yaw)) > Math.PI * 0.9;
      opts.push({ d, back: isBack });
    }
  }
  if (opts.length === 0) return null;

  // User-requested turn: steer toward current heading +/- 90 deg.
  if (walker.nextTurn !== 0) {
    const want = walker.yaw + walker.nextTurn * (Math.PI / 2);
    let best = null, bestErr = Infinity;
    for (const o of opts) {
      const err = Math.abs(angleDiff(o.d.yaw, want)) + (o.back ? 0.6 : 0);
      if (err < bestErr) { bestErr = err; best = o; }
    }
    walker.nextTurn = 0;
    return best.d;
  }

  const nonBack = opts.filter(o => !o.back);
  const pool = nonBack.length ? nonBack : opts;
  // Bias: 55% straight if available, else random among pool.
  const straightOpt = pool.find(o => dirYawEquals(o.d.yaw, walker.yaw));
  if (straightOpt && Math.random() < 0.55) return straightOpt.d;
  return pool[(Math.random() * pool.length) | 0].d;
}

function dirYawEquals(a, b) { return Math.abs(angleDiff(a, b)) < 1e-3; }
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

function beginMove(d) {
  walker.fromX = walker.x; walker.fromZ = walker.z;
  const nr = walker.r + d.dr, nc = walker.c + d.dc;
  const p = gridToWorld(nr, nc);
  walker.toX = p.x; walker.toZ = p.z;
  walker.r = nr; walker.c = nc;
  walker.targetYaw = d.yaw;
  walker.t = 0;
  walker.moving = true;
  walker.depth++;
  if (!walker.visited.has(key(nr, nc))) { walker.visited.add(key(nr, nc)); walker.rooms++; }
}

function nearEdge() {
  return walker.r <= REGEN_MARGIN || walker.c <= REGEN_MARGIN ||
         walker.r >= GH - 1 - REGEN_MARGIN || walker.c >= GW - 1 - REGEN_MARGIN;
}

// ---------------------------------------------------------------------------
// Transition (fade to black, regenerate, fade back)
// ---------------------------------------------------------------------------
const fadeEl = document.getElementById('fade');
let transitioning = false;

function regenerate() {
  if (transitioning) return;
  transitioning = true;
  fadeEl.style.opacity = '1';
  setTimeout(() => {
    // reset glow meshes list
    glowMeshes = [];
    buildMaze();
    startWalker();
    fadeEl.style.opacity = '0';
    setTimeout(() => { transitioning = false; }, 1150);
  }, 1100);
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
const depthVal = document.getElementById('depthVal');
const roomsVal = document.getElementById('roomsVal');
const titleEl = document.getElementById('title');
const hintEl = document.getElementById('hint');
const hudEl = document.getElementById('hud');
let hudFaded = false;

// ---------------------------------------------------------------------------
// Input  (steers the auto-walker at the next junction; optional)
// ---------------------------------------------------------------------------
function steer(dir) { walker.nextTurn = dir; fadeHint(); }
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) steer(-1);
  else if (['ArrowRight', 'd', 'D'].includes(e.key)) steer(1);
  else fadeHint();
});
window.addEventListener('pointerdown', (e) => {
  const x = e.clientX / window.innerWidth;
  steer(x < 0.5 ? -1 : 1);
});
let hintTimer = setTimeout(fadeHint, 9000);
function fadeHint() {
  if (hintEl.style.opacity === '0') return;
  hintEl.style.opacity = '0';
  clearTimeout(hintTimer);
}

// Fade the title card after a few seconds (showcase-first, then it recedes)
setTimeout(() => { titleEl.style.opacity = '0'; }, 6500);

// ---------------------------------------------------------------------------
// Compass needle
// ---------------------------------------------------------------------------
const needleEl = document.getElementById('needle');

// ---------------------------------------------------------------------------
// Animation loop
// ---------------------------------------------------------------------------
let last = performance.now();
let bobPhase = 0;

function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  // Smoothly turn toward target yaw
  const dy = angleDiff(walker.targetYaw, walker.yaw);
  const turn = TURN_RATE * dt;
  if (Math.abs(dy) <= turn) walker.yaw = walker.targetYaw;
  else walker.yaw += Math.sign(dy) * turn;

  // Movement state machine
  if (walker.moving) {
    const dist = Math.hypot(walker.toX - walker.fromX, walker.toZ - walker.fromZ);
    const dur = dist / SPEED;
    walker.t += dt / Math.max(0.001, dur);
    if (walker.t >= 1) {
      walker.x = walker.toX; walker.z = walker.toZ;
      walker.moving = false;
      walker.t = 1;
      // arrived at a cell center -> decide next
      if (nearEdge()) { regenerate(); }
    }
    if (!walker.moving) {
      // pick next direction
      const d = chooseNext();
      if (d) beginMove(d);
      else { regenerate(); } // dead end at edge
    } else {
      const e = easeInOut(walker.t);
      walker.x = walker.fromX + (walker.toX - walker.fromX) * e;
      walker.z = walker.fromZ + (walker.toZ - walker.fromZ) * e;
    }
  } else {
    // not moving: should not persist; choose immediately
    const d = chooseNext();
    if (d) beginMove(d);
    else regenerate();
  }

  // downward bias so it feels like a descent? keep level for clarity.
  // Head-bob for life
  bobPhase += dt * (walker.moving ? 7.0 : 1.5);
  const bob = Math.sin(bobPhase) * (walker.moving ? 0.06 : 0.015);

  camera.position.set(walker.x, EYE + bob, walker.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = walker.yaw;
  // subtle look sway
  camera.rotation.x = Math.sin(bobPhase * 0.5) * 0.012;
  camera.rotation.z = Math.sin(bobPhase * 0.33) * 0.01;

  // Lantern + rim follow
  lantern.position.set(walker.x, EYE + 0.3 + bob, walker.z);
  const back = 3.0;
  rim.position.set(
    walker.x - Math.sin(walker.yaw) * back,
    EYE + 0.6,
    walker.z - Math.cos(walker.yaw) * back
  );

  // Manual steer is consumed at junctions inside chooseNext(); nothing to do here.

  // Flicker glows
  for (const m of glowMeshes) {
    const f = m.userData.base + Math.sin(now * 0.004 * m.userData.flicker + m.position.x) * 0.18;
    m.material.opacity = Math.max(0.15, f);
    const sc = 0.85 + Math.sin(now * 0.003 * m.userData.flicker) * 0.12;
    m.scale.setScalar(sc);
  }

  // Compass
  needleEl.setAttribute('transform', `rotate(${-walker.yaw * 180 / Math.PI} 50 50)`);

  // HUD
  depthVal.textContent = walker.depth;
  roomsVal.textContent = walker.visited.size;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
glowMeshes = [];
buildMaze();
startWalker();
requestAnimationFrame(tick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
