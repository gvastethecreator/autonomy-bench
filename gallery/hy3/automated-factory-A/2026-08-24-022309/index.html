<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automated Factory Simulation</title>
<style>
  :root {
    --bg: #0c1118;
    --panel: #141c26;
    --panel-2: #1b2632;
    --line: #2a3850;
    --accent: #4fd1c5;
    --accent-2: #f6ad55;
    --danger: #fc8181;
    --ok: #68d391;
    --text: #e2e8f0;
    --muted: #8499b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #16202e 0%, var(--bg) 60%);
    color: var(--text);
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "stage  side";
    height: 100vh;
  }
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: linear-gradient(90deg, var(--panel), var(--panel-2));
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header h1 .tag { color: var(--accent); }
  .status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    padding: 6px 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.paused { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }

  #stage {
    grid-area: stage;
    position: relative;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #side {
    grid-area: side;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .card h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .k { color: var(--muted); }
  .stat-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .v.ok { color: var(--ok); }
  .v.warn { color: var(--accent-2); }
  .v.bad { color: var(--danger); }

  .controls { display: flex; flex-direction: column; gap: 8px; }
  .btn-row { display: flex; gap: 8px; }
  button {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    transition: all .15s ease;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #04221f; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.1); color: #04221f; }
  .slider-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .legend span {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--muted);
  }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .log {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--muted);
    background: #0a0f16;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    height: 130px;
    overflow-y: auto;
  }
  .log .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .line b { color: var(--accent); }
  .log .line.warn b { color: var(--accent-2); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AUTONOMA <span class="tag">// Factory Floor</span></h1>
    <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Running</span></div>
  </header>

  <div id="stage">
    <canvas id="factory"></canvas>
  </div>

  <aside id="side">
    <div class="card">
      <h2>Production</h2>
      <div class="stat-row"><span class="k">Units produced</span><span class="v ok" id="sProduced">0</span></div>
      <div class="stat-row"><span class="k">Throughput</span><span class="v" id="sRate">0 /min</span></div>
      <div class="stat-row"><span class="k">On belts</span><span class="v" id="sBelts">0</span></div>
      <div class="stat-row"><span class="k">Rejects</span><span class="v bad" id="sRejects">0</span></div>
      <div class="stat-row"><span class="k">Efficiency</span><span class="v" id="sEff">100%</span></div>
    </div>

    <div class="card">
      <h2>Controls</h2>
      <div class="controls">
        <div class="btn-row">
          <button class="primary" id="btnPause">Pause</button>
          <button id="btnSpeed">Speed: 1x</button>
        </div>
        <div class="btn-row">
          <button id="btnBurst">Rush Order</button>
          <button id="btnReset">Reset</button>
        </div>
        <div class="slider-row">
          <span>Line</span>
          <input type="range" id="speedSlider" min="0.3" max="3" step="0.1" value="1">
          <span id="speedVal">1.0x</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Stations</h2>
      <div class="stat-row"><span class="k">1 · Intake</span><span class="v ok" id="st0">OK</span></div>
      <div class="stat-row"><span class="k">2 · Press</span><span class="v ok" id="st1">OK</span></div>
      <div class="stat-row"><span class="k">3 · Weld</span><span class="v ok" id="st2">OK</span></div>
      <div class="stat-row"><span class="k">4 · Paint</span><span class="v ok" id="st3">OK</span></div>
      <div class="stat-row"><span class="k">5 · QA</span><span class="v ok" id="st4">OK</span></div>
      <div class="stat-row"><span class="k">6 · Pack</span><span class="v ok" id="st5">OK</span></div>
    </div>

    <div class="card">
      <h2>Legend</h2>
      <div class="legend">
        <span><i style="background:#4fd1c5"></i>Raw</span>
        <span><i style="background:#f6ad55"></i>Pressed</span>
        <span><i style="background:#90cdf4"></i>Welded</span>
        <span><i style="background:#fc8181"></i>Painted</span>
        <span><i style="background:#68d391"></i>Packed</span>
      </div>
    </div>

    <div class="card">
      <h2>Event Log</h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("factory");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---- Factory layout ----
  // A serpentine conveyor with processing stations along it.
  const STATION_COLORS = ["#4fd1c5", "#f6ad55", "#90cdf4", "#fc8181", "#68d391", "#b794f4"];
  const STATION_NAMES = ["Intake", "Press", "Weld", "Paint", "QA", "Pack"];

  // Build a path of points the belt follows (serpentine).
  function buildPath() {
    const pad = 60;
    const top = pad + 40, bot = H - pad - 30;
    const cols = [pad + 60, W * 0.32, W * 0.55, W * 0.78, W - pad - 60];
    const pts = [];
    // row 1: left -> right at top
    pts.push({ x: cols[0], y: top });
    pts.push({ x: cols[3], y: top });
    // down
    pts.push({ x: cols[3], y: (top + bot) / 2 });
    // row 2: right -> left
    pts.push({ x: cols[0], y: (top + bot) / 2 });
    // down
    pts.push({ x: cols[0], y: bot });
    // row 3: left -> right at bottom
    pts.push({ x: cols[4], y: bot });
    // up to exit
    pts.push({ x: cols[4], y: top + 10 });
    return pts;
  }

  let PATH = [];
  let SEGS = []; // cumulative length segments
  let TOTAL = 0;

  function recomputePath() {
    PATH = buildPath();
    SEGS = [];
    TOTAL = 0;
    for (let i = 0; i < PATH.length - 1; i++) {
      const a = PATH[i], b = PATH[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      SEGS.push({ a, b, len, start: TOTAL });
      TOTAL += len;
    }
    // place stations evenly along path
    for (let i = 0; i < STATION_NAMES.length; i++) {
      const t = (i + 0.5) / STATION_NAMES.length;
      stations[i].pos = pointAt(t * TOTAL);
    }
  }

  function pointAt(dist) {
    if (dist <= 0) return { x: PATH[0].x, y: PATH[0].y };
    for (const s of SEGS) {
      if (dist <= s.start + s.len) {
        const f = (dist - s.start) / s.len;
        return { x: s.a.x + (s.b.x - s.a.x) * f, y: s.a.y + (s.b.y - s.a.y) * f };
      }
    }
    const last = PATH[PATH.length - 1];
    return { x: last.x, y: last.y };
  }

  const stations = STATION_NAMES.map((name, i) => ({
    name, color: STATION_COLORS[i], pos: { x: 0, y: 0 },
    busy: 0, progress: 0, status: "OK", work: null
  }));

  // ---- Items flowing on belt ----
  // stage: 0 raw, 1 pressed, 2 welded, 3 painted, 4 qa-pass, 5 packed
  const ITEM_COLORS = ["#4fd1c5", "#f6ad55", "#90cdf4", "#fc8181", "#68d391", "#68d391"];
  const items = [];
  let spawnTimer = 0;
  let produced = 0, rejects = 0;
  let rateWindow = [];
  let speedMul = 1;
  let paused = false;
  let beltSpeed = 70; // px/sec base

  function spawnItem() {
    items.push({ d: 0, stage: 0, id: Math.floor(Math.random() * 1e6),
      defect: Math.random() < 0.12, wob: Math.random() * Math.PI * 2 });
  }

  function logMsg(msg, cls) {
    const el = document.getElementById("log");
    const line = document.createElement("div");
    line.className = "line" + (cls ? " " + cls : "");
    line.innerHTML = "<b>›</b> " + msg;
    el.appendChild(line);
    while (el.children.length > 60) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  let lastLog = 0;

  function update(dt) {
    const sp = beltSpeed * speedMul;
    // spawn
    spawnTimer -= dt;
    const interval = 0.9 / speedMul;
    if (spawnTimer <= 0) {
      spawnItem();
      spawnTimer = interval;
    }

    const stationGap = TOTAL / STATION_NAMES.length;

    // process stations
    for (let i = 0; i < stations.length; i++) {
      const st = stations[i];
      const stationDist = (i + 0.5) * stationGap;
      // find item near station front
      if (!st.work) {
        // pick the item closest beyond stationDist (just arriving)
        let best = null, bestD = 1e9;
        for (const it of items) {
          if (it.stage === i && !it.claimed && it.d > stationDist - 6) {
            const dd = Math.abs(it.d - stationDist);
            if (dd < bestD) { bestD = dd; best = it; }
          }
        }
        if (best && bestD < 14) {
          best.claimed = true;
          st.work = best;
          st.progress = 0;
          st.busy = 1;
        }
      }
      if (st.work) {
        st.progress += dt * (0.9 + 0.3 * speedMul);
        if (st.progress >= 1) {
          const it = st.work;
          // QA station: reject defects
          if (i === 4) {
            if (it.defect) {
              rejects++;
              it.remove = true;
              logMsg("QA rejected unit #" + it.id, "warn");
            } else {
              it.stage = 5;
            }
          } else if (i === 5) {
            // packing -> done
            produced++;
            it.remove = true;
            rateWindow.push(performance.now());
            if (produced % 10 === 0) logMsg("Packed unit #" + it.id + " (total " + produced + ")");
          } else {
            it.stage = i + 1;
          }
          it.claimed = false;
          st.work = null;
          st.busy = 0;
        }
      }
      // random occasional jam
      st.status = st.work ? "WORK" : "OK";
    }

    // move items
    for (const it of items) {
      if (it.claimed) continue;
      if (it.remove) continue;
      it.d += sp * dt;
      it.wob += dt * 4;
    }

    // remove finished / off-path
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.remove || it.d > TOTAL + 20) {
        if (it.d > TOTAL + 20 && !it.remove) rejects++;
        items.splice(i, 1);
      }
    }
  }

  // ---- Rendering ----
  function drawBelt() {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    // glow underlay
    ctx.strokeStyle = "rgba(79,209,197,0.10)";
    ctx.lineWidth = 30;
    strokePath();
    // belt body
    ctx.strokeStyle = "#1d2735";
    ctx.lineWidth = 22;
    strokePath();
    // belt rails
    ctx.strokeStyle = "#2a3850";
    ctx.lineWidth = 2;
    strokePath();
    // moving treads
    const off = (performance.now() / 1000 * beltSpeed * speedMul) % 26;
    ctx.save();
    ctx.strokeStyle = "rgba(120,150,190,0.25)";
    ctx.lineWidth = 22;
    ctx.setLineDash([4, 22]);
    ctx.lineDashOffset = -off;
    strokePath();
    ctx.restore();
  }

  function strokePath() {
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();
  }

  function drawStations() {
    const stationGap = TOTAL / STATION_NAMES.length;
    for (let i = 0; i < stations.length; i++) {
      const st = stations[i];
      const p = st.pos;
      const x = p.x, y = p.y;
      // machine body
      const bw = 54, bh = 40;
      const working = st.work ? 1 : 0;
      ctx.save();
      ctx.translate(x, y);
      // shadow
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(-bw/2 + 3, -bh/2 + 5, bw, bh);
      // body
      const grad = ctx.createLinearGradient(0, -bh/2, 0, bh/2);
      grad.addColorStop(0, "#22303f");
      grad.addColorStop(1, "#16202c");
      ctx.fillStyle = grad;
      roundRect(-bw/2, -bh/2, bw, bh, 7);
      ctx.fill();
      ctx.strokeStyle = st.color;
      ctx.lineWidth = 2;
      roundRect(-bw/2, -bh/2, bw, bh, 7);
      ctx.stroke();
      // status light
      ctx.fillStyle = st.work ? st.color : "#2a3850";
      ctx.beginPath();
      ctx.arc(bw/2 - 9, -bh/2 + 9, 4, 0, Math.PI * 2);
      ctx.fill();
      if (st.work) {
        ctx.shadowColor = st.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      // progress arc when working
      if (st.work) {
        ctx.strokeStyle = st.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 14, -Math.PI/2, -Math.PI/2 + st.progress * Math.PI * 2);
        ctx.stroke();
      }
      // label
      ctx.fillStyle = "#8499b0";
      ctx.font = "9px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(st.name, 0, bh/2 + 13);
      ctx.fillStyle = "#5a6b80";
      ctx.font = "8px Segoe UI, sans-serif";
      ctx.fillText("ST" + (i + 1), 0, bh/2 + 24);
      ctx.restore();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawItems() {
    for (const it of items) {
      if (it.remove) continue;
      const p = pointAt(Math.min(it.d, TOTAL));
      // small perpendicular offset based on stage for visual layering
      const wob = Math.sin(it.wob) * 1.5;
      let size = 9;
      let color = ITEM_COLORS[it.stage] || "#fff";
      ctx.save();
      ctx.translate(p.x, p.y + wob);
      if (it.defect && it.stage >= 4) {
        ctx.strokeStyle = "#fc8181";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, size + 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      roundRect(-size/2, -size/2, size, size, 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  function drawHeaderArt() {
    // faint moving particles in background for ambiance
    ctx.fillStyle = "rgba(79,209,197,0.04)";
    const t = performance.now() / 1000;
    for (let i = 0; i < 30; i++) {
      const x = (i * 137.5 + t * 12) % W;
      const y = (i * 91.3 + Math.sin(t + i) * 20) % H;
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Stats ----
  function updateStats() {
    const now = performance.now();
    rateWindow = rateWindow.filter(t => now - t < 60000);
    const perMin = rateWindow.length;
    const onBelts = items.filter(i => !i.remove).length;
    const total = produced + rejects;
    const eff = total > 0 ? Math.round((produced / total) * 100) : 100;

    document.getElementById("sProduced").textContent = produced;
    document.getElementById("sRate").textContent = perMin + " /min";
    document.getElementById("sBelts").textContent = onBelts;
    document.getElementById("sRejects").textContent = rejects;
    const effEl = document.getElementById("sEff");
    effEl.textContent = eff + "%";
    effEl.className = "v " + (eff >= 90 ? "ok" : eff >= 70 ? "warn" : "bad");

    for (let i = 0; i < stations.length; i++) {
      const st = stations[i];
      const el = document.getElementById("st" + i);
      el.textContent = st.status === "WORK" ? "WORK" : "OK";
      el.className = "v " + (st.status === "WORK" ? "warn" : "ok");
    }
  }

  // ---- Loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) update(dt);

    ctx.clearRect(0, 0, W, H);
    drawHeaderArt();
    drawBelt();
    drawItems();
    drawStations();
    updateStats();
    requestAnimationFrame(frame);
  }

  // ---- Controls ----
  const btnPause = document.getElementById("btnPause");
  btnPause.addEventListener("click", () => {
    paused = !paused;
    btnPause.textContent = paused ? "Resume" : "Pause";
    const dot = document.getElementById("statusDot");
    dot.className = "dot" + (paused ? " paused" : "");
    document.getElementById("statusText").textContent = paused ? "Paused" : "Running";
    logMsg(paused ? "Line paused by operator" : "Line resumed");
  });

  const speeds = [1, 2, 4];
  let speedIdx = 0;
  const btnSpeed = document.getElementById("btnSpeed");
  btnSpeed.addEventListener("click", () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speedMul = speeds[speedIdx];
    btnSpeed.textContent = "Speed: " + speedMul + "x";
    document.getElementById("speedVal").textContent = speedMul.toFixed(1) + "x";
    document.getElementById("speedSlider").value = speedMul;
    logMsg("Line speed set to " + speedMul + "x");
  });

  const slider = document.getElementById("speedSlider");
  slider.addEventListener("input", () => {
    speedMul = parseFloat(slider.value);
    document.getElementById("speedVal").textContent = speedMul.toFixed(1) + "x";
    btnSpeed.textContent = "Speed: " + speedMul + "x";
  });

  document.getElementById("btnBurst").addEventListener("click", () => {
    for (let i = 0; i < 12; i++) spawnItem();
    logMsg("Rush order dispatched: 12 units queued");
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    items.length = 0;
    produced = 0; rejects = 0; rateWindow = [];
    for (const st of stations) { st.work = null; st.busy = 0; st.progress = 0; }
    logMsg("Factory reset");
  });

  // ---- Boot ----
  resize();
  recomputePath();
  window.addEventListener("resize", recomputePath);
  for (let i = 0; i < 6; i++) spawnItem();
  logMsg("Factory online — 6 stations initialized");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
