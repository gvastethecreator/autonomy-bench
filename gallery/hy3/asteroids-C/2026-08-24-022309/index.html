<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASTEROIDS — Vector Drift</title>
<style>
  :root{
    --bg0:#05070f;
    --bg1:#0a1024;
    --ink:#dff3ff;
    --accent:#5cf2ff;
    --accent2:#ff5c8a;
    --gold:#ffd86b;
    --dim:#6b86a8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg0);}
  body{
    font-family:"Segoe UI",-apple-system,system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    touch-action:none;
  }
  #wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 10%, #0c1430 0%, #06081a 55%, #03040c 100%);
  }
  canvas{display:block;width:100%;height:100%;}
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 22px;pointer-events:none;
    font-variant-numeric:tabular-nums;letter-spacing:.06em;
    text-shadow:0 0 14px rgba(92,242,255,.35);
  }
  .hud-block{font-size:13px;text-transform:uppercase;color:var(--dim);}
  .hud-block b{display:block;font-size:26px;color:var(--ink);letter-spacing:.04em;margin-top:2px;
    text-shadow:0 0 18px rgba(92,242,255,.55);}
  .hud-right{text-align:right;}
  #lives{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
  .life{width:16px;height:16px;
    background:linear-gradient(135deg,var(--accent),#2aa6c4);
    clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
    filter:drop-shadow(0 0 6px rgba(92,242,255,.7));}

  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(70% 60% at 50% 45%, rgba(8,12,30,.55), rgba(3,4,12,.86));
    backdrop-filter:blur(2px);
    transition:opacity .6s ease;
    z-index:5;
  }
  #overlay.hidden{opacity:0;pointer-events:none;}
  .title{
    font-size:clamp(40px,9vw,104px);font-weight:800;letter-spacing:.14em;
    background:linear-gradient(180deg,#eafcff 0%, #5cf2ff 55%, #1e8fb0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(92,242,255,.45));
    transform:translateY(8px);
    animation:float 6s ease-in-out infinite;
  }
  .subtitle{margin-top:6px;font-size:13px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);
    opacity:.8;}
  .panel{max-width:520px;margin-top:30px;padding:0 24px;}
  .lines{margin-top:18px;font-size:13.5px;line-height:2;color:var(--dim);letter-spacing:.04em;}
  .lines kbd{
    display:inline-block;min-width:22px;padding:2px 7px;margin:0 2px;
    border:1px solid rgba(92,242,255,.4);border-radius:6px;
    background:rgba(92,242,255,.07);color:var(--ink);font-size:12px;
    box-shadow:0 0 10px rgba(92,242,255,.15) inset;
  }
  .cta{
    margin-top:30px;font-size:15px;letter-spacing:.35em;text-transform:uppercase;
    color:var(--bg0);font-weight:700;
    padding:14px 38px;border-radius:40px;cursor:pointer;pointer-events:auto;
    background:linear-gradient(135deg,var(--accent),#37c6e0);
    box-shadow:0 0 26px rgba(92,242,255,.55), 0 6px 26px rgba(0,0,0,.4);
    animation:pulse 2.4s ease-in-out infinite;
    border:none;
  }
  .cta:hover{filter:brightness(1.1);}
  .score-final{margin-top:14px;font-size:14px;letter-spacing:.2em;color:var(--gold);}
  .score-final b{font-size:34px;display:block;color:var(--gold);
    text-shadow:0 0 20px rgba(255,216,107,.5);margin-top:4px;}

  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:3;
    box-shadow:inset 0 0 220px rgba(0,0,0,.85);}
  #scan{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.07;
    background:repeating-linear-gradient(0deg, #fff 0px, #fff 1px, transparent 2px, transparent 4px);}

  @keyframes float{0%,100%{transform:translateY(8px)}50%{transform:translateY(-8px)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 26px rgba(92,242,255,.45),0 6px 26px rgba(0,0,0,.4)}
    50%{box-shadow:0 0 40px rgba(92,242,255,.85),0 6px 30px rgba(0,0,0,.5)}}

  #hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:rgba(107,134,168,.6);
    pointer-events:none;z-index:6;}
  @media (max-width:560px){
    .hud-block b{font-size:20px}
    .lines{font-size:12px;line-height:1.9}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="scan"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="hud-block">Score<b id="score">0</b></div>
    <div class="hud-block">Wave<b id="wave">1</b></div>
    <div class="hud-block hud-right">Lives<div id="lives"></div></div>
  </div>

  <div id="overlay">
    <div class="title">ASTEROIDS</div>
    <div class="subtitle">Vector Drift</div>
    <div class="panel">
      <div class="lines" id="lines">
        <kbd>←</kbd> <kbd>→</kbd> rotate &nbsp;·&nbsp; <kbd>↑</kbd> thrust &nbsp;·&nbsp; <kbd>Space</kbd> fire<br>
        <kbd>Shift</kbd> hyperspace &nbsp;·&nbsp; <kbd>P</kbd> pause
      </div>
      <div class="score-final" id="final" style="display:none"></div>
      <button class="cta" id="startBtn">Launch</button>
    </div>
  </div>

  <div id="hint">Move with arrows · fire with space</div>
</div>

<script>
"use strict";
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const waveEl = document.getElementById('wave');
  const livesEl = document.getElementById('lives');
  const flashEl = document.getElementById('flash');
  const finalEl = document.getElementById('final');
  const linesEl = document.getElementById('lines');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Audio (Web Audio API) ----
  let actx=null;
  function audio(){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==='suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, slideTo){
    const a=audio(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sawtooth'; o.frequency.value=freq;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
    g.gain.value=vol||0.12;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }
  function noise(dur, vol){
    const a=audio(); if(!a) return;
    const n=Math.floor(a.sampleRate*dur);
    const buf=a.createBuffer(1,n,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.value=vol||0.18;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start();
  }
  const sfx = {
    shoot(){ tone(620,0.12,'square',0.07,180); },
    thrust(){ tone(90,0.08,'sawtooth',0.03); },
    bangBig(){ noise(0.5,0.22); tone(120,0.4,'sawtooth',0.08,40); },
    bangMed(){ noise(0.35,0.16); tone(180,0.3,'square',0.06,60); },
    bangSmall(){ noise(0.22,0.12); tone(260,0.2,'square',0.05,90); },
    death(){ noise(0.7,0.28); tone(160,0.6,'sawtooth',0.1,30); },
    hyper(){ tone(420,0.3,'sine',0.08,900); },
    wave(){ tone(300,0.18,'sine',0.08,600); tone(600,0.18,'sine',0.05); },
    life(){ tone(520,0.12,'triangle',0.08,780); }
  };

  // ---- Utility ----
  const TAU = Math.PI*2;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const randi=(a,b)=>Math.floor(rand(a,b));
  function wrap(v,m){ if(v<0) return v+m; if(v>m) return v-m; return v; }

  // ---- Starfield (parallax depth) ----
  const stars=[];
  function buildStars(){
    stars.length=0;
    const n = Math.round((W*H)/5500);
    for(let i=0;i<n;i++){
      const depth=Math.random();
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        z:depth,
        r:0.4+depth*1.6,
        tw:Math.random()*TAU,
        tws:rand(0.5,2.2),
      });
    }
  }
  buildStars();
  window.addEventListener('resize', buildStars);

  // ---- Game state ----
  const STATE={TITLE:0,PLAY:1,DEAD:2,OVER:3,PAUSE:4};
  let state=STATE.TITLE;
  let score=0, wave=1, lives=3, hiscore=Number(localStorage.getItem('ast_hi')||0);
  let shake=0, shakeT=0;
  let thrustGlow=0;

  function setLives(){
    livesEl.innerHTML='';
    for(let i=0;i<lives;i++){ const d=document.createElement('div'); d.className='life'; livesEl.appendChild(d); }
  }
  function updateHUD(){
    scoreEl.textContent=score;
    waveEl.textContent=wave;
  }

  // ---- Entities ----
  const ship={
    x:0,y:0,a:-Math.PI/2,
    vx:0,vy:0,
    r:13, alive:true, inv:0,
    thrust:false, fireCd:0,
  };
  const bullets=[];
  const asteroids=[];
  const particles=[];
  const rocks=[]; // debris trail

  function resetShip(){
    ship.x=W/2; ship.y=H/2; ship.a=-Math.PI/2;
    ship.vx=0; ship.vy=0; ship.alive=true; ship.inv=2.2; ship.thrust=false; ship.fireCd=0;
  }

  function makeAsteroid(x,y,size){
    // size 3=big,2=med,1=small
    const baseR=[0,34,20,52][size];
    const verts=randi(9,14);
    const pts=[];
    let prev=rand(0.7,1.0);
    for(let i=0;i<verts;i++){
      const ang=(i/verts)*TAU;
      const rr=baseR*(0.62+Math.random()*0.5);
      pts.push({a:ang, r:rr});
    }
    const sp=([0,90,70,42])[size];
    const ang=rand(0,TAU);
    const speed=rand(sp*0.4,sp);
    return {
      x,y,size, r:baseR, pts,
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      rot:rand(-1.1,1.1), rotCur:rand(0,TAU),
      hue:rand(185,210),
      seed:Math.random()*1000,
    };
  }

  function spawnWave(n){
    for(let i=0;i<n;i++){
      let x,y, tries=0;
      do{
        x=rand(0,W); y=rand(0,H); tries++;
      }while(Math.hypot(x-ship.x,y-ship.y)<180 && tries<30);
      asteroids.push(makeAsteroid(x,y,3));
    }
  }

  function newGame(){
    score=0; wave=1; lives=3;
    bullets.length=0; asteroids.length=0; particles.length=0; rocks.length=0;
    setLives(); updateHUD();
    resetShip();
    spawnWave(4);
    state=STATE.PLAY;
    overlay.classList.add('hidden');
  }

  function addParticles(x,y,n,col,spd,life){
    for(let i=0;i<n;i++){
      const a=rand(0,TAU), s=rand(spd*0.3,spd);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:life||0.6, max:life||0.6, col:col||'#5cf2ff', r:rand(1,2.6)});
    }
  }

  function shoot(){
    if(ship.fireCd>0||!ship.alive) return;
    ship.fireCd=0.16;
    const speed=520;
    const bx=ship.x+Math.cos(ship.a)*ship.r;
    const by=ship.y+Math.sin(ship.a)*ship.r;
    bullets.push({
      x:bx,y:by,
      vx:Math.cos(ship.a)*speed+ship.vx*0.5,
      vy:Math.sin(ship.a)*speed+ship.vy*0.5,
      life:0.85, r:2.2
    });
    // recoil
    ship.vx-=Math.cos(ship.a)*8;
    ship.vy-=Math.sin(ship.a)*8;
    sfx.shoot();
  }

  function hurtShip(){
    if(ship.inv>0||!ship.alive) return;
    ship.alive=false;
    sfx.death();
    flash(0.5);
    addParticles(ship.x,ship.y,40,'#ff5c8a',260,0.9);
    addParticles(ship.x,ship.y,24,'#ffd86b',180,0.7);
    shake=18; shakeT=0.4;
    lives--;
    setLives();
    if(lives<=0){
      setTimeout(()=>{ gameOver(); }, 700);
    } else {
      setTimeout(()=>{ resetShip(); }, 900);
    }
  }

  function gameOver(){
    state=STATE.OVER;
    if(score>hiscore){ hiscore=score; localStorage.setItem('ast_hi',hiscore); }
    finalEl.style.display='block';
    finalEl.innerHTML='Final Score<b>'+score+'</b>'+(score>=hiscore?'<div style="margin-top:6px;color:var(--accent)">★ New Best ★</div>':'<div style="margin-top:6px;color:var(--dim)">Best '+hiscore+'</div>');
    startBtn.textContent='Replay';
    linesEl.style.display='none';
    overlay.classList.remove('hidden');
  }

  function hyperspace(){
    if(!ship.alive) return;
    sfx.hyper();
    addParticles(ship.x,ship.y,18,'#5cf2ff',140,0.5);
    ship.x=rand(40,W-40); ship.y=rand(40,H-40);
    ship.vx=rand(-40,40); ship.vy=rand(-40,40);
    ship.inv=1.0;
    addParticles(ship.x,ship.y,18,'#5cf2ff',140,0.5);
  }

  function splitAsteroid(idx){
    const a=asteroids[idx];
    let pts = a.size===3?20:(a.size===2?50:100);
    score+=pts; updateHUD();
    flash(0.12);
    addParticles(a.x,a.y, a.size===3?26:18, 'hsl('+a.hue+',80%,65%)', 200, 0.7);
    if(a.size===3) sfx.bangBig(); else if(a.size===2) sfx.bangMed(); else sfx.bangSmall();
    shake=Math.max(shake, a.size===3?10:6); shakeT=0.25;
    if(a.size>1){
      for(let k=0;k<2;k++){
        const child=makeAsteroid(a.x,a.y,a.size-1);
        // inherit some momentum
        child.vx=a.vx*0.5+rand(-40,40);
        child.vy=a.vy*0.5+rand(-40,40);
        asteroids.push(child);
      }
    }
    asteroids.splice(idx,1);
    if(asteroids.length===0){
      wave++; waveEl.textContent=wave;
      sfx.wave();
      flash(0.6);
      setTimeout(()=>{ if(state===STATE.PLAY) spawnWave(Math.min(3+wave, 11)); }, 700);
    }
  }

  function flash(v){ flashEl.style.opacity=v; setTimeout(()=>{flashEl.style.opacity=0;},60); }

  // ---- Input ----
  const keys={};
  window.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(e.key)) e.preventDefault();
    if(e.repeat) return;
    const k=e.key.toLowerCase();
    keys[k]=true;
    if(k===' '){ if(state===STATE.PLAY) shoot(); }
    if(k==='shift'){ if(state===STATE.PLAY) hyperspace(); }
    if(k==='p'){ if(state===STATE.PLAY){ state=STATE.PAUSE; showPause(true);} else if(state===STATE.PAUSE){ state=STATE.PLAY; showPause(false);} }
    if(k==='enter'){ if(state===STATE.TITLE||state===STATE.OVER) newGame(); }
  });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  startBtn.addEventListener('click',()=>{ audio(); if(state===STATE.TITLE||state===STATE.OVER) newGame(); });

  function showPause(on){
    if(on){
      finalEl.style.display='none'; linesEl.style.display='none';
      startBtn.textContent='Resume';
      overlay.querySelector('.title').textContent='PAUSED';
      overlay.querySelector('.subtitle').textContent='Vector Drift';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  // Touch / pointer controls (drag to rotate+thrust, tap to shoot)
  let pointerActive=false, pointerAngle=0, pointerDist=0;
  canvas.addEventListener('pointerdown',e=>{
    if(state===STATE.TITLE||state===STATE.OVER){ newGame(); return; }
    if(state!==STATE.PLAY) return;
    pointerActive=true;
    handlePointer(e);
  });
  canvas.addEventListener('pointermove',e=>{ if(pointerActive) handlePointer(e); });
  window.addEventListener('pointerup',()=>{ pointerActive=false; ship.thrust=false; });
  function handlePointer(e){
    const dx=e.clientX-ship.x, dy=e.clientY-ship.y;
    pointerAngle=Math.atan2(dy,dx);
    ship.a=pointerAngle;
    pointerDist=Math.hypot(dx,dy);
    ship.thrust = pointerDist>60;
    if(pointerDist<40) shoot();
  }

  // ---- Update ----
  let last=performance.now();
  function update(dt){
    // stars twinkle + drift
    for(const s of stars){
      s.tw+=s.tws*dt;
      s.y += s.z*8*dt;
      if(s.y>H){ s.y=0; s.x=Math.random()*W; }
    }

    if(state===STATE.PLAY && ship.alive){
      const turn=3.4;
      if(keys['arrowleft']) ship.a-=turn*dt;
      if(keys['arrowright']) ship.a+=turn*dt;
      // pointer steering
      if(pointerActive){
        // handled in move
        ship.thrust = pointerDist>60;
      } else {
        ship.thrust=!!keys['arrowup'];
      }
      if(ship.inv>0) ship.inv-=dt;
      if(ship.fireCd>0) ship.fireCd-=dt;

      if(ship.thrust){
        const acc=320;
        ship.vx+=Math.cos(ship.a)*acc*dt;
        ship.vy+=Math.sin(ship.a)*acc*dt;
        thrustGlow=Math.min(1,thrustGlow+dt*5);
        if(Math.random()<0.7){
          const ba=ship.a+Math.PI+rand(-0.3,0.3);
          particles.push({
            x:ship.x+Math.cos(ship.a)*ship.r, y:ship.y+Math.sin(ship.a)*ship.r,
            vx:Math.cos(ba)*rand(60,160)+ship.vx*0.3, vy:Math.sin(ba)*rand(60,160)+ship.vy*0.3,
            life:0.4,max:0.4,col:'#ffd86b',r:rand(1.5,3)
          });
        }
        if(Math.random()<0.3) sfx.thrust();
      } else {
        thrustGlow=Math.max(0,thrustGlow-dt*4);
      }
      // damping
      ship.vx*=Math.pow(0.55,dt);
      ship.vy*=Math.pow(0.55,dt);
      ship.x=wrap(ship.x+ship.vx*dt, W);
      ship.y=wrap(ship.y+ship.vy*dt, H);
      if(ship.inv<=0 && Math.random()<0.02) sfx.life();
    }

    // bullets
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.x=wrap(b.x+b.vx*dt, W);
      b.y=wrap(b.y+b.vy*dt, H);
      b.life-=dt;
      if(b.life<=0) bullets.splice(i,1);
    }

    // asteroids
    for(const a of asteroids){
      a.x=wrap(a.x+a.vx*dt, W);
      a.y=wrap(a.y+a.vy*dt, H);
      a.rotCur+=a.rot*dt;
    }

    // collisions bullet-asteroid
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      for(let j=asteroids.length-1;j>=0;j--){
        const a=asteroids[j];
        if(Math.hypot(b.x-a.x,b.y-a.y) < a.r){
          bullets.splice(i,1);
          splitAsteroid(j);
          break;
        }
      }
    }

    // collisions ship-asteroid
    if(state===STATE.PLAY && ship.alive && ship.inv<=0){
      for(let j=asteroids.length-1;j>=0;j--){
        const a=asteroids[j];
        if(Math.hypot(ship.x-a.x,ship.y-a.y) < a.r+ship.r*0.7){
          hurtShip();
          break;
        }
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vx*=0.96; p.vy*=0.96;
      p.life-=dt;
      if(p.life<=0) particles.splice(i,1);
    }

    // shake decay
    if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shake=0; }

    // title idle animation: gentle drifting asteroids
    if(state===STATE.TITLE){
      if(asteroids.length===0){
        for(let i=0;i<5;i++){
          const a=makeAsteroid(rand(0,W),rand(0,H),3);
          a.vx*=0.4; a.vy*=0.4; a.rot*=0.5;
          asteroids.push(a);
        }
      }
      for(const a of asteroids){
        a.x=wrap(a.x+a.vx*dt, W); a.y=wrap(a.y+a.vy*dt,H); a.rotCur+=a.rot*dt;
      }
    }
  }

  // ---- Render ----
  function drawStars(){
    for(const s of stars){
      const tw=0.5+0.5*Math.sin(s.tw);
      const a=0.25+tw*0.6*(0.4+s.z*0.6);
      ctx.fillStyle='rgba('+(180+s.z*60|0)+','+(210+s.z*40|0)+',255,'+a+')';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
    }
  }

  function drawAsteroid(a){
    ctx.save();
    ctx.translate(a.x,a.y);
    ctx.rotate(a.rotCur);
    const cols='hsl('+a.hue+',70%,62%)';
    ctx.beginPath();
    for(let i=0;i<a.pts.length;i++){
      const p=a.pts[i];
      const x=Math.cos(p.a)*p.r, y=Math.sin(p.a)*p.r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(20,40,60,0.55)';
    ctx.fill();
    ctx.lineWidth=2;
    ctx.strokeStyle=cols;
    ctx.shadowColor=cols; ctx.shadowBlur=14;
    ctx.stroke();
    ctx.shadowBlur=0;
    // inner facet lines for depth
    ctx.beginPath();
    for(let i=0;i<a.pts.length;i++){
      const p=a.pts[i];
      const x=Math.cos(p.a)*p.r*0.55, y=Math.sin(p.a)*p.r*0.55;
      ctx.moveTo(0,0); ctx.lineTo(x,y);
    }
    ctx.strokeStyle='hsla('+a.hue+',50%,70%,0.35)';
    ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }

  function drawShip(){
    if(!ship.alive) return;
    ctx.save();
    ctx.translate(ship.x,ship.y);
    // invuln blink
    const blink = ship.inv>0 ? (Math.sin(performance.now()*0.02)>0?0.35:1) : 1;
    ctx.globalAlpha=blink;
    ctx.rotate(ship.a+Math.PI/2);

    // thrust flame
    if(thrustGlow>0.02){
      ctx.beginPath();
      ctx.moveTo(-5, ship.r-2);
      ctx.lineTo(0, ship.r+10+thrustGlow*10+Math.random()*4);
      ctx.lineTo(5, ship.r-2);
      const g=ctx.createLinearGradient(0,ship.r,0,ship.r+18);
      g.addColorStop(0,'rgba(255,216,107,'+(0.9*thrustGlow)+')');
      g.addColorStop(1,'rgba(255,92,138,0)');
      ctx.fillStyle=g; ctx.fill();
    }

    // hull
    ctx.beginPath();
    ctx.moveTo(0,-ship.r);
    ctx.lineTo(ship.r*0.7, ship.r*0.85);
    ctx.lineTo(0, ship.r*0.5);
    ctx.lineTo(-ship.r*0.7, ship.r*0.85);
    ctx.closePath();
    const hg=ctx.createLinearGradient(0,-ship.r,0,ship.r);
    hg.addColorStop(0,'#eafcff'); hg.addColorStop(1,'#5cf2ff');
    ctx.fillStyle='rgba(10,20,35,0.8)';
    ctx.fill();
    ctx.lineWidth=2;
    ctx.strokeStyle='#5cf2ff';
    ctx.shadowColor='#5cf2ff'; ctx.shadowBlur=16;
    ctx.stroke();
    ctx.shadowBlur=0;

    // cockpit dot
    ctx.beginPath(); ctx.arc(0,-ship.r*0.2,2.4,0,TAU);
    ctx.fillStyle='#ffd86b'; ctx.fill();
    ctx.restore();
  }

  function drawBullets(){
    for(const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r,0,TAU);
      ctx.fillStyle='#fff';
      ctx.shadowColor='#5cf2ff'; ctx.shadowBlur=12;
      ctx.fill(); ctx.shadowBlur=0;
    }
  }

  function drawParticles(){
    for(const p of particles){
      const a=Math.max(0,p.life/p.max);
      ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU);
      ctx.fillStyle=p.col; ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0){
      const m=shake;
      ctx.translate(rand(-m,m),rand(-m,m));
    }
    drawStars();
    drawParticles();
    for(const a of asteroids) drawAsteroid(a);
    drawBullets();
    drawShip();
    ctx.restore();

    // subtle title glow ring around ship on title
    if(state===STATE.TITLE){
      ctx.save();
      ctx.globalAlpha=0.10;
      const cx=W/2, cy=H/2;
      const t=performance.now()*0.0006;
      for(let r=60;r<Math.max(W,H);r+=70){
        ctx.beginPath(); ctx.arc(cx,cy,r+Math.sin(t+r)*6,0,TAU);
        ctx.strokeStyle='#5cf2ff'; ctx.lineWidth=1; ctx.stroke();
      }
      ctx.restore();
    }
  }

  function loop(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // init HUD
  setLives(); updateHUD();
})();
</script>
</body>
</html>
