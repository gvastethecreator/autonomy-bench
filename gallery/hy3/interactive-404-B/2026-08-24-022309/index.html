<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Lost in the drift</title>
<style>
  :root {
    --bg: #07080d;
    --bg-2: #0d1018;
    --ink: #e8eaf2;
    --muted: #7c8398;
    --accent: #6ea8fe;
    --accent-2: #b78bff;
    --line: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1200px 700px at 70% -10%, rgba(110, 168, 254, 0.12), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(183, 139, 255, 0.10), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  /* drifting starfield */
  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  .wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    max-width: 720px;
    animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: .8rem;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.4rem;
    opacity: 0;
    animation: fade 1s ease .25s both;
  }

  @keyframes fade { to { opacity: 1; } }

  .code {
    font-size: clamp(6rem, 22vw, 13rem);
    font-weight: 800;
    line-height: .9;
    letter-spacing: -.04em;
    background: linear-gradient(135deg, var(--ink) 0%, var(--accent) 55%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
    filter: drop-shadow(0 18px 50px rgba(110, 168, 254, 0.22));
    user-select: none;
  }

  .code span {
    display: inline-block;
    animation: floaty 6s ease-in-out infinite;
  }
  .code span:nth-child(1) { animation-delay: 0s; }
  .code span:nth-child(2) { animation-delay: .4s; }
  .code span:nth-child(3) { animation-delay: .8s; }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%     { transform: translateY(-14px); }
  }

  .title {
    margin-top: 1.2rem;
    font-size: clamp(1.25rem, 4vw, 1.9rem);
    font-weight: 600;
    opacity: 0;
    animation: fade 1s ease .5s both;
  }

  .sub {
    margin: 1rem auto 0;
    max-width: 46ch;
    color: var(--muted);
    line-height: 1.65;
    font-size: 1rem;
    opacity: 0;
    animation: fade 1s ease .7s both;
  }

  .actions {
    margin-top: 2.2rem;
    display: flex;
    gap: .8rem;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    animation: fade 1s ease .9s both;
  }

  .btn {
    --c: var(--accent);
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    color: var(--ink);
    padding: .8rem 1.4rem;
    border-radius: 999px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    display: inline-flex;
    align-items: center;
    gap: .5rem;
  }
  .btn:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--c) 60%, transparent);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--c) 22%, transparent);
  }
  .btn.primary {
    --c: var(--accent);
    background: linear-gradient(135deg, rgba(110,168,254,.18), rgba(183,139,255,.18));
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .btn:active { transform: translateY(0); }

  .orbit {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    display: grid;
    place-items: center;
  }
  .ring {
    position: absolute;
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 320px;
    height: 320px;
    animation: spin 26s linear infinite;
  }
  .ring::before {
    content: "";
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
    transform: translateX(-50%);
  }
  .ring.r2 { width: 480px; height: 480px; animation-duration: 40s; animation-direction: reverse; }
  .ring.r2::before { background: var(--accent-2); box-shadow: 0 0 16px var(--accent-2); }
  .ring.r3 { width: 660px; height: 660px; animation-duration: 60s; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .foot {
    position: fixed;
    bottom: 1.1rem;
    left: 0; right: 0;
    text-align: center;
    z-index: 2;
    color: var(--muted);
    font-size: .78rem;
    letter-spacing: .04em;
    opacity: 0;
    animation: fade 1s ease 1.2s both;
  }
  .foot a { color: var(--accent); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="orbit" aria-hidden="true">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
  </div>

  <main class="wrap">
    <p class="eyebrow">Signal lost</p>
    <div class="code" aria-label="404">
      <span>4</span><span>0</span><span>4</span>
    </div>
    <h1 class="title">This page drifted out of orbit</h1>
    <p class="sub">
      The coordinates you followed lead nowhere — the page may have moved,
      expired, or never existed. Let's get you back to solid ground.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">Return home</a>
      <button class="btn" id="back">Go back</button>
      <button class="btn" id="search">Search the site</button>
    </div>
  </main>

  <p class="foot">
    Error <strong>404</strong> · <a href="/">home</a> · you can press <kbd>R</kbd> to return
  </p>

<script>
  // --- Drifting starfield (lightweight, self-contained) ---
  (function () {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars, dpr;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = innerWidth * dpr;
      h = canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      const count = Math.round((innerWidth * innerHeight) / 9000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random() * 0.8 + 0.2,
        r: (Math.random() * 1.2 + 0.3) * dpr,
        tw: Math.random() * Math.PI * 2
      }));
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.z * 0.18 * dpr;
        if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
        const alpha = 0.4 + Math.sin(t * 0.001 + s.tw) * 0.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200, 214, 255,' + alpha.toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();

  // --- Interactions ---
  const back = document.getElementById('back');
  const search = document.getElementById('search');
  const sub = document.querySelector('.sub');

  if (back) back.addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = '/';
  });

  if (search) search.addEventListener('click', () => {
    const q = prompt('What are you looking for?');
    if (q && q.trim()) location.href = '/?q=' + encodeURIComponent(q.trim());
  });

  addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') location.href = '/';
  });
</script>
</body>
</html>
