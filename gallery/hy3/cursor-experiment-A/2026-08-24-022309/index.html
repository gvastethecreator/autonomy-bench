<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Cursor Experiment</title>
<style>
  :root {
    --bg: #07080f;
    --fg: #e8ecff;
    --accent: #6cf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 50% 30%, #11142a 0%, var(--bg) 70%);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    cursor: none;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .hud {
    position: fixed;
    top: 18px; left: 18px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.85;
    font-size: 12px;
    line-height: 1.6;
    letter-spacing: 0.04em;
  }
  .hud h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .hud .hint { color: #9aa3c7; }

  .modes {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 8px;
    background: rgba(20,24,46,0.55);
    border: 1px solid rgba(120,140,200,0.25);
    padding: 8px;
    border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  .modes button {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    color: #c5cced;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 8px 14px;
    border-radius: 9px;
    transition: all 0.18s ease;
  }
  .modes button:hover { color: #fff; background: rgba(108,204,255,0.12); }
  .modes button.active {
    color: #061018;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(108,204,255,0.5);
  }

  .stats {
    position: fixed;
    top: 18px; right: 18px;
    z-index: 10;
    pointer-events: none;
    text-align: right;
    font-size: 11px;
    color: #7e88ad;
    line-height: 1.7;
  }
  .stats b { color: var(--accent); font-weight: 600; }

  /* custom cursor */
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 0 12px rgba(108,204,255,0.9);
    mix-blend-mode: screen;
  }
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid rgba(108,204,255,0.7);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 19;
    transition: width 0.15s ease, height 0.15s ease, border-color 0.15s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>Cursor Experiment</h1>
  <div class="hint">Move &middot; click &middot; hold</div>
</div>

<div class="stats">
  x <b id="px">0</b> &nbsp; y <b id="py">0</b><br>
  vel <b id="pv">0</b> &nbsp; fps <b id="pf">0</b>
</div>

<div class="modes" id="modes">
  <button data-mode="0" class="active">Trails</button>
  <button data-mode="1">Ripples</button>
  <button data-mode="2">Orbit</button>
  <button data-mode="3">Magnet</button>
</div>

<div class="cursor-ring" id="ring"></div>
<div class="cursor-dot" id="dot"></div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const dot = document.getElementById("dot");
  const ring = document.getElementById("ring");
  const px = document.getElementById("px");
  const py = document.getElementById("py");
  const pv = document.getElementById("pv");
  const pf = document.getElementById("pf");
  const modeBtns = document.querySelectorAll("#modes button");

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // ---- input state ----
  const mouse = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, vx: 0, vy: 0, down: false };
  let mode = 0;

  window.addEventListener("pointermove", (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY;
  });
  window.addEventListener("pointerdown", () => { mouse.down = true; });
  window.addEventListener("pointerup", () => { mouse.down = false; });
  window.addEventListener("pointerleave", () => { mouse.down = false; });

  modeBtns.forEach((b) => b.addEventListener("click", () => {
    modeBtns.forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    mode = parseInt(b.dataset.mode, 10);
  }));

  // ---- particle systems ----
  const trails = [];
  const ripples = [];
  const orbiters = [];
  const magnets = [];

  for (let i = 0; i < 90; i++) {
    orbiters.push({
      a: Math.random() * Math.PI * 2,
      r: 30 + Math.random() * 120,
      s: 0.4 + Math.random() * 1.6,
      h: 180 + Math.random() * 120,
      size: 1 + Math.random() * 2.5
    });
  }
  for (let i = 0; i < 60; i++) {
    magnets.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: 0, vy: 0,
      h: Math.random() * 360,
      size: 2 + Math.random() * 3
    });
  }

  let hue = 200;
  let frame = 0;

  function spawnTrail() {
    const speed = Math.hypot(mouse.vx, mouse.vy);
    const count = Math.max(1, Math.floor(speed / 4));
    for (let k = 0; k < count; k++) {
      trails.push({
        x: mouse.x + (Math.random() - 0.5) * 6,
        y: mouse.y + (Math.random() - 0.5) * 6,
        vx: mouse.vx * 0.15 + (Math.random() - 0.5) * 1.2,
        vy: mouse.vy * 0.15 + (Math.random() - 0.5) * 1.2,
        life: 1,
        h: hue + (Math.random() - 0.5) * 40,
        size: 2 + Math.random() * 3
      });
    }
    if (trails.length > 1400) trails.splice(0, trails.length - 1400);
  }

  function spawnRipple(x, y, strong) {
    ripples.push({ x, y, r: 0, max: strong ? 260 : 130, life: 1, h: hue });
  }

  let lastT = performance.now();
  let fpsSmooth = 60;

  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const inst = 1 / (dt || 0.016);
    fpsSmooth += (inst - fpsSmooth) * 0.08;
    frame++;

    // velocity
    mouse.vx = (mouse.x - mouse.px);
    mouse.vy = (mouse.y - mouse.py);
    mouse.px = mouse.x; mouse.py = mouse.y;
    const speed = Math.hypot(mouse.vx, mouse.vy);
    hue = (hue + speed * 0.6 + 0.3) % 360;

    // cursor visuals
    dot.style.transform = `translate(${mouse.x}px, ${mouse.y}px) translate(-50%,-50%)`;
    const ringScale = mouse.down ? 0.7 : 1;
    const rSize = 34 * ringScale;
    ring.style.width = rSize + "px";
    ring.style.height = rSize + "px";
    ring.style.borderColor = mouse.down ? "rgba(255,140,200,0.9)" : "rgba(108,204,255,0.7)";
    ring.style.transform = `translate(${mouse.x}px, ${mouse.y}px) translate(-50%,-50%)`;

    // fade background
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(7,8,15,0.18)";
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    if (mode === 0) {
      // trails
      spawnTrail();
      for (let i = trails.length - 1; i >= 0; i--) {
        const p = trails[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        p.life -= 0.02;
        if (p.life <= 0) { trails.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.h}, 90%, 65%, ${p.life})`;
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (mode === 1) {
      // ripples
      if (speed > 6 && frame % 4 === 0) spawnRipple(mouse.x, mouse.y, false);
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.r += (r.max - r.r) * 0.06;
        r.life -= 0.012;
        if (r.life <= 0) { ripples.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${r.h}, 90%, 65%, ${r.life * 0.6})`;
        ctx.lineWidth = 2;
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
        // inner dot
        ctx.beginPath();
        ctx.fillStyle = `hsla(${r.h}, 90%, 70%, ${r.life})`;
        ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (mode === 2) {
      // orbit
      const boost = mouse.down ? 2.4 : 1;
      for (const o of orbiters) {
        o.a += o.s * 0.02 * boost;
        o.r += (o.r + Math.sin(frame * 0.01 + o.a) * 0.4) * 0.004;
        const x = mouse.x + Math.cos(o.a) * o.r;
        const y = mouse.y + Math.sin(o.a) * o.r;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${o.h}, 90%, 65%, 0.9)`;
        ctx.arc(x, y, o.size, 0, Math.PI * 2);
        ctx.fill();
        // tether
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${o.h}, 90%, 65%, 0.12)`;
        ctx.lineWidth = 1;
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (mode === 3) {
      // magnet
      for (const m of magnets) {
        const dx = mouse.x - m.x;
        const dy = mouse.y - m.y;
        const d = Math.hypot(dx, dy) || 1;
        const pull = mouse.down ? 900 : 320;
        const f = (pull / (d * d)) * 14;
        m.vx += (dx / d) * f;
        m.vy += (dy / d) * f;
        m.vx *= 0.92; m.vy *= 0.92;
        m.x += m.vx; m.y += m.vy;
        // wrap
        if (m.x < -20) m.x = W + 20; if (m.x > W + 20) m.x = -20;
        if (m.y < -20) m.y = H + 20; if (m.y > H + 20) m.y = -20;
        const sp = Math.hypot(m.vx, m.vy);
        ctx.beginPath();
        ctx.fillStyle = `hsla(${m.h}, 85%, ${55 + Math.min(25, sp)}%, 0.95)`;
        ctx.arc(m.x, m.y, m.size + Math.min(4, sp * 0.2), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // HUD
    px.textContent = Math.round(mouse.x);
    py.textContent = Math.round(mouse.y);
    pv.textContent = Math.round(speed);
    pf.textContent = Math.round(fpsSmooth);

    requestAnimationFrame(loop);
  }

  window.addEventListener("pointerdown", (e) => {
    if (mode === 1 || mode === 0) spawnRipple(e.clientX, e.clientY, true);
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
