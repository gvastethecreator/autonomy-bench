<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Physics Sandbox</title>
<style>
  :root {
    --bg: #0b0e16;
    --panel: rgba(20, 25, 38, 0.82);
    --panel-border: rgba(120, 150, 220, 0.18);
    --ink: #e8ecf6;
    --muted: #8a93ad;
    --accent: #5cc8ff;
    --accent2: #ff7eb6;
    --good: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
    background:
      radial-gradient(1200px 800px at 70% -10%, rgba(92, 200, 255, 0.10), transparent 60%),
      radial-gradient(900px 700px at 10% 110%, rgba(255, 126, 182, 0.08), transparent 55%),
      var(--bg);
  }
  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: min(340px, calc(100vw - 28px));
    pointer-events: none;
  }
  .title {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .title b { color: var(--ink); font-weight: 600; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    pointer-events: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .row label { flex: 0 0 92px; font-size: 12px; color: var(--muted); }
  .row .val { flex: 0 0 46px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink); }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    pointer-events: auto;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 8px 11px;
    cursor: pointer;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { background: rgba(255,255,255,0.12); border-color: rgba(120,150,220,0.4); }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(90deg, rgba(92,200,255,.25), rgba(255,126,182,.22)); border-color: rgba(120,150,220,.5); }
  .palette { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer; pointer-events: auto;
    transition: transform .08s ease, border-color .12s ease;
  }
  .swatch.active { border-color: #fff; transform: scale(1.12); }
  .hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 7px 14px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100vw - 28px);
  }
  .hint b { color: var(--accent); font-weight: 600; }
  .fps {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 5;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 6px 10px;
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 560px) {
    .hud { max-width: calc(100vw - 28px); }
    .row label { flex-basis: 70px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="title"><b>Physics Sandbox</b> · toy universe</div>
  <div class="panel">
    <div class="row">
      <label>Gravity</label>
      <input id="gravity" type="range" min="0" max="2000" value="900" />
      <span class="val" id="gravityV">900</span>
    </div>
    <div class="row">
      <label>Bounce</label>
      <input id="restitution" type="range" min="0" max="100" value="72" />
      <span class="val" id="restitutionV">.72</span>
    </div>
    <div class="row">
      <label>Friction</label>
      <input id="friction" type="range" min="0" max="100" value="12" />
      <span class="val" id="frictionV">.12</span>
    </div>
    <div class="row">
      <label>Size</label>
      <input id="size" type="range" min="6" max="60" value="22" />
      <span class="val" id="sizeV">22</span>
    </div>
    <div class="row" style="margin-top:10px">
      <label>Color</label>
      <div class="palette" id="palette"></div>
    </div>
  </div>
  <div class="panel btns">
    <button id="rain" class="primary">Rain</button>
    <button id="burst">Burst</button>
    <button id="walls">Walls</button>
    <button id="clear">Clear</button>
    <button id="pause">Pause</button>
  </div>
</div>

<div class="fps" id="fps">— fps</div>
<div class="hint"><b>Click</b> to drop · <b>Drag</b> to throw · <b>Right-click</b> to push</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // ---- World state ---------------------------------------------------------
  const world = {
    gravity: 900,
    restitution: 0.72,
    friction: 0.12,
    spawnSize: 22,
    walls: true,
    paused: false,
    color: "#5cc8ff",
  };

  const PALETTE = ["#5cc8ff", "#ff7eb6", "#7ee787", "#ffd166", "#b794ff", "#ff9f6b"];

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Bodies --------------------------------------------------------------
  const bodies = [];
  let nextId = 1;

  function makeBody(x, y, r, color, vx = 0, vy = 0) {
    return {
      id: nextId++,
      x, y, r,
      vx, vy,
      mass: Math.PI * r * r,
      color,
      angle: Math.random() * Math.PI * 2,
      av: (Math.random() - 0.5) * 4,
      spawn: performance.now(),
    };
  }

  function addBody(x, y, r, color, vx = 0, vy = 0) {
    if (bodies.length > 420) bodies.shift();
    bodies.push(makeBody(x, y, r, color || world.color, vx, vy));
  }

  // ---- Input ---------------------------------------------------------------
  const pointer = { x: 0, y: 0, down: false, px: 0, py: 0, button: 0 };

  function evtPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    const p = evtPos(e);
    pointer.x = pointer.px = p.x;
    pointer.y = pointer.py = p.y;
    pointer.down = true;
    pointer.button = e.button;
    if (e.button === 2) {
      pushWave(p.x, p.y);
    } else {
      addBody(p.x, p.y, world.spawnSize * (0.7 + Math.random() * 0.6), world.color);
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    const p = evtPos(e);
    pointer.px = pointer.x;
    pointer.py = pointer.y;
    pointer.x = p.x;
    pointer.y = p.y;
  });

  function endPointer(e) {
    if (pointer.down && pointer.button !== 2) {
      const vx = (pointer.x - pointer.px) * 12;
      const vy = (pointer.y - pointer.py) * 12;
      const last = bodies[bodies.length - 1];
      if (last && performance.now() - last.spawn < 400) {
        last.vx += vx;
        last.vy += vy;
        last.av += (vx - vy) * 0.01;
      }
    }
    pointer.down = false;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  function pushWave(x, y) {
    for (const b of bodies) {
      const dx = b.x - x, dy = b.y - y;
      const d2 = dx * dx + dy * dy;
      const d = Math.sqrt(d2) || 1;
      const force = Math.min(90000 / (d2 + 400), 2600);
      b.vx += (dx / d) * force;
      b.vy += (dy / d) * force;
    }
  }

  // ---- Buttons -------------------------------------------------------------
  document.getElementById("rain").addEventListener("click", () => {
    for (let i = 0; i < 26; i++) {
      addBody(Math.random() * W, -30 - Math.random() * 120,
        world.spawnSize * (0.5 + Math.random()),
        PALETTE[(Math.random() * PALETTE.length) | 0],
        (Math.random() - 0.5) * 120, Math.random() * 60);
    }
  });
  document.getElementById("burst").addEventListener("click", () => {
    const cx = W / 2, cy = H / 2;
    const n = 30;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const s = 260 + Math.random() * 200;
      addBody(cx, cy, world.spawnSize * (0.7 + Math.random() * 0.7),
        PALETTE[i % PALETTE.length], Math.cos(a) * s, Math.sin(a) * s);
    }
  });
  document.getElementById("walls").addEventListener("click", (e) => {
    world.walls = !world.walls;
    e.currentTarget.classList.toggle("primary", world.walls);
  });
  document.getElementById("clear").addEventListener("click", () => bodies.length = 0);
  document.getElementById("pause").addEventListener("click", (e) => {
    world.paused = !world.paused;
    e.currentTarget.textContent = world.paused ? "Play" : "Pause";
    e.currentTarget.classList.toggle("primary", world.paused);
  });

  // ---- Sliders -------------------------------------------------------------
  function bindSlider(id, valId, fmt, apply) {
    const el = document.getElementById(id);
    const val = document.getElementById(valId);
    const update = () => {
      const v = parseFloat(el.value);
      apply(v);
      val.textContent = fmt(v);
    };
    el.addEventListener("input", update);
    update();
  }
  bindSlider("gravity", "gravityV", (v) => Math.round(v), (v) => world.gravity = v);
  bindSlider("restitution", "restitutionV", (v) => (v / 100).toFixed(2).slice(1), (v) => world.restitution = v / 100);
  bindSlider("friction", "frictionV", (v) => (v / 100).toFixed(2).slice(1), (v) => world.friction = v / 100);
  bindSlider("size", "sizeV", (v) => Math.round(v), (v) => world.spawnSize = v);

  // ---- Palette -------------------------------------------------------------
  const pal = document.getElementById("palette");
  PALETTE.forEach((c, i) => {
    const s = document.createElement("div");
    s.className = "swatch" + (i === 0 ? " active" : "");
    s.style.background = c;
    s.addEventListener("click", () => {
      world.color = c;
      document.querySelectorAll(".swatch").forEach((x) => x.classList.remove("active"));
      s.classList.add("active");
    });
    pal.appendChild(s);
  });

  // ---- Physics -------------------------------------------------------------
  const WALL = 0; // padding handled by radius

  function step(dt) {
    const g = world.gravity;
    // integrate
    for (const b of bodies) {
      b.vy += g * dt;
      // mild air drag
      b.vx *= 0.999;
      b.vy *= 0.999;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.angle += b.av * dt;
      b.av *= 0.992;
    }

    // pairwise collisions (spatial-hash-lite via simple loop with cap)
    const n = bodies.length;
    const maxChecks = 1400;
    for (let i = 0; i < n; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < n; j++) {
        if (i * n + j > maxChecks * 400) break;
        const b = bodies[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const rsum = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rsum * rsum || d2 === 0) continue;
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const overlap = rsum - d;
        const totalMass = a.mass + b.mass;
        // positional correction
        a.x -= nx * overlap * (b.mass / totalMass);
        a.y -= ny * overlap * (b.mass / totalMass);
        b.x += nx * overlap * (a.mass / totalMass);
        b.y += ny * overlap * (a.mass / totalMass);
        // relative velocity along normal
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn > 0) continue;
        const e = world.restitution;
        const jImp = -(1 + e) * vn / (1 / a.mass + 1 / b.mass);
        const ix = jImp * nx, iy = jImp * ny;
        a.vx -= ix / a.mass;
        a.vy -= iy / a.mass;
        b.vx += ix / b.mass;
        b.vy += iy / b.mass;
        // tangential friction (tangential relative velocity)
        const tx = -ny, ty = nx;
        const vt = rvx * tx + rvy * ty;
        const jt = -vt * world.friction / (1 / a.mass + 1 / b.mass);
        const jtx = jt * tx, jty = jt * ty;
        a.vx -= jtx / a.mass;
        a.vy -= jty / a.mass;
        b.vx += jtx / b.mass;
        b.vy += jty / b.mass;
        // a little spin from tangential contact
        const spin = vt * 0.004;
        a.av -= spin;
        b.av += spin;
      }
    }

    // walls / bounds
    const fr = world.friction;
    for (const b of bodies) {
      if (world.walls) {
        if (b.x - b.r < 0) { b.x = b.r; b.vx = -b.vx * world.restitution; b.vy *= (1 - fr); b.av += b.vy * 0.002; }
        if (b.x + b.r > W) { b.x = W - b.r; b.vx = -b.vx * world.restitution; b.vy *= (1 - fr); b.av -= b.vy * 0.002; }
        if (b.y - b.r < 0) { b.y = b.r; b.vy = -b.vy * world.restitution; b.vx *= (1 - fr); }
        if (b.y + b.r > H) {
          b.y = H - b.r;
          b.vy = -b.vy * world.restitution;
          b.vx *= (1 - fr);
          b.av += b.vx * 0.004;
          if (Math.abs(b.vy) < 8) b.vy = 0; // settle
        }
      } else {
        // wrap-around soft bounds so things don't vanish forever
        if (b.x < -b.r * 3) b.x = W + b.r;
        if (b.x > W + b.r * 3) b.x = -b.r;
        if (b.y > H + b.r * 3) b.y = -b.r;
        if (b.y < -b.r * 3) b.y = H + b.r;
      }
    }
  }

  // ---- Render --------------------------------------------------------------
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // floor glow when walls on
    if (world.walls) {
      const g = ctx.createLinearGradient(0, H - 80, 0, H);
      g.addColorStop(0, "rgba(92,200,255,0)");
      g.addColorStop(1, "rgba(92,200,255,0.06)");
      ctx.fillStyle = g;
      ctx.fillRect(0, H - 80, W, 80);
    }

    ctx.lineCap = "round";
    for (const b of bodies) {
      const ang = b.angle;
      // shadow
      ctx.beginPath();
      ctx.arc(b.x + 3, b.y + 5, b.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fill();

      // gradient body
      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, shade(b.color, 55));
      grad.addColorStop(0.65, b.color);
      grad.addColorStop(1, shade(b.color, -45));
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // rim
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.stroke();

      // spin marker so rotation is visible
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(ang) * b.r * 0.7, b.y + Math.sin(ang) * b.r * 0.7);
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // drag indicator
    if (pointer.down && pointer.button !== 2) {
      ctx.beginPath();
      ctx.moveTo(pointer.px, pointer.py);
      ctx.lineTo(pointer.x, pointer.y);
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ---- Loop ----------------------------------------------------------------
  let last = performance.now();
  let fpsT = last, fpsCount = 0, fps = 0;
  const fpsEl = document.getElementById("fps");

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp big gaps
    if (!world.paused) {
      // sub-step for stability
      const steps = 2;
      const sdt = dt / steps;
      for (let s = 0; s < steps; s++) step(sdt);
    }
    draw();

    fpsCount++;
    if (now - fpsT >= 500) {
      fps = Math.round((fpsCount * 1000) / (now - fpsT));
      fpsT = now;
      fpsCount = 0;
      fpsEl.textContent = fps + " fps · " + bodies.length;
    }
    requestAnimationFrame(frame);
  }

  // ---- Seed an opening scene so it's alive on load -------------------------
  (function seed() {
    const cx = W / 2;
    for (let i = 0; i < 16; i++) {
      addBody(
        cx + (Math.random() - 0.5) * 260,
        120 + Math.random() * 120,
        world.spawnSize * (0.6 + Math.random() * 0.8),
        PALETTE[i % PALETTE.length],
        (Math.random() - 0.5) * 140,
        Math.random() * 40
      );
    }
    // a gentle burst on top so motion is immediate
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      addBody(cx, H * 0.4, 14 + Math.random() * 14, PALETTE[(i + 2) % PALETTE.length],
        Math.cos(a) * 180, Math.sin(a) * 180 - 120);
    }
  })();

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
