<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miniature Solar System</title>
<style>
  :root {
    --ink: #eaf2ff;
    --muted: #8fa6c4;
    --glass: rgba(12, 18, 34, 0.55);
    --line: rgba(140, 170, 220, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #02030a; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; display: block; }

  /* Cinematic vignette */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(120% 120% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%),
      radial-gradient(80% 60% at 50% 120%, rgba(40,70,140,0.18), rgba(0,0,0,0) 70%);
    mix-blend-mode: normal;
  }

  /* Title block */
  #title {
    position: fixed; top: 26px; left: 30px; z-index: 10;
    padding: 14px 18px; border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(-10px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #title.in { opacity: 1; transform: translateY(0); }
  #title h1 {
    font-size: 19px; font-weight: 650; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ffd8a8, #ffe9c7 40%, #9fd3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p { font-size: 12.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0.3px; }

  /* Hint */
  #hint {
    position: fixed; bottom: 22px; left: 30px; z-index: 10;
    font-size: 12px; color: var(--muted); letter-spacing: 0.4px;
    opacity: 0; transition: opacity 1.4s ease 0.6s;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  #hint.in { opacity: 0.85; }
  #hint b { color: #cfe0ff; font-weight: 600; }

  /* Speed control */
  #panel {
    position: fixed; bottom: 22px; right: 30px; z-index: 10;
    background: var(--glass); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(10px);
    opacity: 0; transition: opacity 1.4s ease 0.8s;
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--muted);
  }
  #panel.in { opacity: 1; }
  #panel label { letter-spacing: 0.4px; }
  #panel input { width: 130px; accent-color: #ffcf8f; }
  #speedVal { color: #ffd9a0; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

  /* Planet labels */
  .label {
    position: fixed; z-index: 8; pointer-events: none;
    transform: translate(-50%, -140%);
    font-size: 11.5px; letter-spacing: 1.1px; text-transform: uppercase;
    color: #dcebff; text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.9);
    white-space: nowrap; opacity: 0;
    transition: opacity 0.5s ease;
    display: flex; align-items: center; gap: 6px;
  }
  .label .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #ffd9a0; box-shadow: 0 0 8px #ffd9a0;
  }

  /* Loading */
  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #02030a; transition: opacity 1s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid rgba(255,210,150,0.15);
    border-top-color: #ffd9a0; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <div id="title">
    <h1>The Solar System</h1>
    <p>A miniature, in motion — eight worlds circling a single star.</p>
  </div>

  <div id="hint">
    <span><b>Drag</b> to orbit</span>
    <span><b>Scroll</b> to zoom</span>
    <span><b>L</b> toggle labels</span>
    <span><b>Space</b> pause</span>
  </div>

  <div id="panel">
    <label for="speed">Time</label>
    <input id="speed" type="range" min="0" max="4" step="0.01" value="1" />
    <span id="speedVal">1.0×</span>
  </div>

  <div id="loader"><div class="ring"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ----------------------------------------------------------------------------
// Renderer / Scene / Camera
// ----------------------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 70, 175);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 20;
controls.maxDistance = 520;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;
controls.target.set(0, 0, 0);

// ----------------------------------------------------------------------------
// Lighting — the Sun is the only real light source
// ----------------------------------------------------------------------------
const sunLight = new THREE.PointLight(0xfff2dc, 4.2, 0, 1.4);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223044, 0.35));

// ----------------------------------------------------------------------------
// Procedural texture helpers (no external assets)
// ----------------------------------------------------------------------------
function canvasTex(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  draw(ctx, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// Rocky / speckled planet
function rockyTexture(base, accent, speckle) {
  return canvasTex(512, (ctx, s) => {
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, s, s);
    // soft mottling
    for (let i = 0; i < 1400; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      const r = Math.random() * 9 + 1;
      ctx.globalAlpha = Math.random() * 0.25;
      ctx.fillStyle = Math.random() > 0.5 ? accent : '#000000';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    // a few craters
    ctx.globalAlpha = 0.4;
    for (let i = 0; i < 26; i++) {
      const x = Math.random() * s, y = Math.random() * s, r = Math.random() * 14 + 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    if (speckle) {
      ctx.globalAlpha = 0.18;
      for (let i = 0; i < 400; i++) {
        ctx.fillStyle = speckle;
        const x = Math.random() * s, y = Math.random() * s;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
    }
    ctx.globalAlpha = 1;
  });
}

// Banded gas giant
function gasTexture(base, dark, light, spot) {
  return canvasTex(512, (ctx, s) => {
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, s, s);
    let y = 0;
    while (y < s) {
      const h = Math.random() * 14 + 6;
      const k = Math.random();
      ctx.fillStyle = k > 0.66 ? light : (k < 0.33 ? dark : base);
      ctx.globalAlpha = 0.55 + Math.random() * 0.35;
      ctx.fillRect(0, y, s, h);
      y += h;
    }
    ctx.globalAlpha = 1;
    // swirl turbulence
    for (let i = 0; i < 220; i++) {
      const yy = Math.random() * s;
      ctx.globalAlpha = 0.06;
      ctx.fillStyle = Math.random() > 0.5 ? light : dark;
      ctx.beginPath();
      ctx.ellipse(Math.random() * s, yy, Math.random() * 40 + 10, Math.random() * 4 + 1, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (spot) {
      // great red spot
      const g = ctx.createRadialGradient(s * 0.66, s * 0.62, 2, s * 0.66, s * 0.62, 34);
      g.addColorStop(0, 'rgba(190,70,40,0.95)');
      g.addColorStop(1, 'rgba(190,70,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(s * 0.66, s * 0.62, 34, 20, 0, 0, Math.PI * 2); ctx.fill();
    }
  });
}

// Earth-like: ocean + continents + ice caps
function earthTexture() {
  return canvasTex(512, (ctx, s) => {
    const g = ctx.createLinearGradient(0, 0, 0, s);
    g.addColorStop(0, '#0a2a55'); g.addColorStop(0.5, '#0e3f7a'); g.addColorStop(1, '#0a2a55');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    // continents
    const land = ['#2f6b3a', '#3c7d44', '#6b6b3a', '#7a8b4a'];
    for (let i = 0; i < 26; i++) {
      ctx.fillStyle = land[i % land.length];
      ctx.globalAlpha = 0.85;
      const cx = Math.random() * s, cy = Math.random() * s;
      const blobs = Math.floor(Math.random() * 6) + 3;
      for (let b = 0; b < blobs; b++) {
        const x = cx + (Math.random() - 0.5) * 70;
        const y = cy + (Math.random() - 0.5) * 70;
        const r = Math.random() * 26 + 10;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // ice caps
    ctx.fillStyle = 'rgba(235,245,255,0.92)';
    ctx.beginPath(); ctx.ellipse(s / 2, 8, s * 0.55, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s / 2, s - 8, s * 0.55, 22, 0, 0, Math.PI * 2); ctx.fill();
  });
}
function cloudTexture() {
  return canvasTex(512, (ctx, s) => {
    ctx.clearRect(0, 0, s, s);
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      const x = Math.random() * s, y = Math.random() * s;
      const r = Math.random() * 26 + 6;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  });
}

// Sun surface
function sunTexture() {
  return canvasTex(512, (ctx, s) => {
    const g = ctx.createRadialGradient(s/2, s/2, 10, s/2, s/2, s/2);
    g.addColorStop(0, '#fff4c2'); g.addColorStop(0.55, '#ffba49'); g.addColorStop(1, '#ff7a18');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * s, y = Math.random() * s, r = Math.random() * 6 + 1;
      ctx.globalAlpha = Math.random() * 0.35;
      ctx.fillStyle = Math.random() > 0.5 ? '#ffd97a' : '#ff6a00';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

// ----------------------------------------------------------------------------
// Starfield
// ----------------------------------------------------------------------------
function makeStars(count, radius, size, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color(color);
  for (let i = 0; i < count; i++) {
    const r = radius * (0.6 + Math.random() * 0.4);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const b = 0.6 + Math.random() * 0.4;
    col[i*3] = c.r * b; col[i*3+1] = c.g * b; col[i*3+2] = c.b * b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false });
  return new THREE.Points(geo, mat);
}
const starsFar = makeStars(3500, 1600, 1.6, 0xffffff);
const starsNear = makeStars(1200, 1100, 2.6, 0xbcd4ff);
scene.add(starsFar, starsNear);

// Faint nebula backdrop
const nebula = new THREE.Mesh(
  new THREE.SphereGeometry(1900, 32, 32),
  new THREE.MeshBasicMaterial({ map: canvasTex(1024, (ctx, s) => {
    ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, s, s);
    const blobs = [['rgba(60,40,120,0.5)', 0.25], ['rgba(20,70,120,0.45)', 0.4], ['rgba(90,30,80,0.4)', 0.7]];
    for (const [col, px] of blobs) {
      for (let i = 0; i < 14; i++) {
        const x = Math.random() * s, y = Math.random() * s, r = Math.random() * s * 0.18 + 40;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.5; ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }), side: THREE.BackSide, transparent: true, opacity: 0.5 })
);
scene.add(nebula);

// ----------------------------------------------------------------------------
// Sun
// ----------------------------------------------------------------------------
const SUN_R = 6;
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(SUN_R, 64, 64),
  new THREE.MeshBasicMaterial({ map: sunTexture() })
);
scene.add(sun);

// Corona glow sprite
const corona = new THREE.Sprite(new THREE.SpriteMaterial({
  map: canvasTex(256, (ctx, s) => {
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(255,225,150,0.9)');
    g.addColorStop(0.25, 'rgba(255,160,60,0.55)');
    g.addColorStop(0.6, 'rgba(255,110,30,0.18)');
    g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  }),
  color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
corona.scale.set(SUN_R * 7, SUN_R * 7, 1);
scene.add(corona);

// ----------------------------------------------------------------------------
// Atmosphere (fresnel) shader for Earth
// ----------------------------------------------------------------------------
function atmosphere(color, scale) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      glowColor: { value: new THREE.Color(color) },
      intensity: { value: 1.0 }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      uniform vec3 glowColor;
      uniform float intensity;
      void main(){
        float f = pow(1.0 - abs(dot(vNormal, vView)), 2.4);
        gl_FragColor = vec4(glowColor, f * intensity);
      }`,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 48), mat);
  m.scale.setScalar(scale);
  return m;
}

// ----------------------------------------------------------------------------
// Saturn ring texture
// ----------------------------------------------------------------------------
function ringTexture() {
  return canvasTex(512, (ctx, s) => {
    ctx.clearRect(0, 0, s, s);
    for (let x = 0; x < s; x++) {
      const t = x / s;
      const a = 0.15 + Math.abs(Math.sin(t * 40)) * 0.5 * (1 - t);
      const shade = 200 + Math.floor(Math.sin(t * 18) * 30);
      ctx.fillStyle = `rgba(${shade},${shade - 30},${shade - 80},${a})`;
      ctx.fillRect(x, 0, 1, s);
    }
  });
}

// ----------------------------------------------------------------------------
// Build planets
// ----------------------------------------------------------------------------
const planetDefs = [
  { name: 'Mercury', r: 0.9,  dist: 14, speed: 1.60, spin: 0.010, tex: rockyTexture('#8a7f74','#5c5147','#b3a89c') },
  { name: 'Venus',   r: 1.5,  dist: 20, speed: 1.17, spin: 0.006, tex: rockyTexture('#d9a564','#b07d3a','#f0d49a') },
  { name: 'Earth',   r: 1.6,  dist: 28, speed: 1.00, spin: 0.035, tex: earthTexture(), clouds: true, atmo: 0x6db3ff, moon: true },
  { name: 'Mars',    r: 1.2,  dist: 36, speed: 0.81, spin: 0.033, tex: rockyTexture('#c1502e','#7d2d18','#e08a5a') },
  { name: 'Jupiter', r: 3.6,  dist: 50, speed: 0.44, spin: 0.070, tex: gasTexture('#d8b48a','#9c7245','#f0dcb8', true) },
  { name: 'Saturn',  r: 3.0,  dist: 66, speed: 0.32, spin: 0.062, tex: gasTexture('#e0c79a','#b39a6a','#f3e6c4', false), ring: true },
  { name: 'Uranus',  r: 2.2,  dist: 80, speed: 0.23, spin: 0.050, tex: gasTexture('#a8e0e6','#6fb6c4','#cdf2f6', false), tilt: 1.7 },
  { name: 'Neptune', r: 2.1,  dist: 92, speed: 0.18, spin: 0.050, tex: gasTexture('#3b6fd6','#274a9c','#7aa0ee', false) },
];

const planets = [];
const labelLayer = [];

function addOrbitRing(dist) {
  const seg = 160;
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color: 0x4a6aa0, transparent: true, opacity: 0.22 });
  return new THREE.Line(g, m);
}

for (const d of planetDefs) {
  const pivot = new THREE.Object3D();         // rotates around sun
  pivot.rotation.y = Math.random() * Math.PI * 2;
  scene.add(pivot);
  scene.add(addOrbitRing(d.dist));

  const group = new THREE.Object3D();          // holds tilt + planet
  group.position.x = d.dist;
  pivot.add(group);

  const mat = new THREE.MeshStandardMaterial({ map: d.tex, roughness: 0.92, metalness: 0.0 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(d.r, 48, 48), mat);
  if (d.tilt) mesh.rotation.z = d.tilt;
  group.add(mesh);

  if (d.atmo) {
    const a = atmosphere(d.atmo, d.r * 1.18);
    group.add(a);
  }
  if (d.clouds) {
    const cloud = new THREE.Mesh(
      new THREE.SphereGeometry(d.r * 1.02, 48, 48),
      new THREE.MeshStandardMaterial({ map: cloudTexture(), transparent: true, opacity: 0.5, depthWrite: false })
    );
    group.add(cloud);
    mesh.userData.clouds = cloud;
  }
  if (d.ring) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(d.r * 1.4, d.r * 2.4, 96),
      new THREE.MeshBasicMaterial({ map: ringTexture(), side: THREE.DoubleSide, transparent: true, opacity: 0.85, depthWrite: false })
    );
    ring.rotation.x = Math.PI / 2 - 0.45;
    if (d.tilt) ring.rotation.z = d.tilt;
    group.add(ring);
  }
  if (d.moon) {
    const moonPivot = new THREE.Object3D();
    group.add(moonPivot);
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(d.r * 0.27, 24, 24),
      new THREE.MeshStandardMaterial({ map: rockyTexture('#9a9a9a','#5a5a5a','#c4c4c4'), roughness: 1 })
    );
    moon.position.x = d.r * 2.4;
    moonPivot.add(moon);
    group.userData.moonPivot = moonPivot;
  }

  // Label
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `<span class="dot"></span>${d.name}`;
  document.body.appendChild(el);
  labelLayer.push({ el, group });

  planets.push({ def: d, pivot, group, mesh });
}

// ----------------------------------------------------------------------------
// Asteroid belt (between Mars and Jupiter)
// ----------------------------------------------------------------------------
const belt = new THREE.Group();
const beltGeo = new THREE.BufferGeometry();
const bCount = 1400;
const bPos = new Float32Array(bCount * 3);
const bData = []; // {angle, speed, radius, y}
for (let i = 0; i < bCount; i++) {
  const radius = 42 + Math.random() * 6;
  const angle = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * 2.2;
  bPos[i*3] = Math.cos(angle) * radius;
  bPos[i*3+1] = y;
  bPos[i*3+2] = Math.sin(angle) * radius;
  bData.push({ angle, speed: 0.5 + Math.random() * 0.4, radius, y });
}
beltGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
const beltMesh = new THREE.Points(beltGeo, new THREE.PointsMaterial({ color: 0x9a8b78, size: 0.5, transparent: true, opacity: 0.7, depthWrite: false }));
belt.add(beltMesh);
scene.add(belt);

// ----------------------------------------------------------------------------
// A passing comet
// ----------------------------------------------------------------------------
const comet = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xeaf6ff })
);
const cometTail = new THREE.Sprite(new THREE.SpriteMaterial({
  map: canvasTex(128, (ctx, s) => {
    const g = ctx.createLinearGradient(0, s/2, s, s/2);
    g.addColorStop(0, 'rgba(180,230,255,0.8)'); g.addColorStop(1, 'rgba(180,230,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  }),
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
cometTail.scale.set(14, 3, 1);
comet.add(cometTail);
scene.add(comet);
const cometOrbit = { a: 0, radius: 120, speed: 0.05, incline: 0.5 };

// ----------------------------------------------------------------------------
// Post-processing (bloom)
// ----------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.1, 0.55, 0.18);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ----------------------------------------------------------------------------
// Interaction state
// ----------------------------------------------------------------------------
let timeScale = 1.0;
let paused = false;
let showLabels = true;

const speed = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
speed.addEventListener('input', () => {
  timeScale = parseFloat(speed.value);
  speedVal.textContent = timeScale.toFixed(1) + '×';
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.key === 'l' || e.key === 'L') {
    showLabels = !showLabels;
    labelLayer.forEach(l => { if (!showLabels) l.el.style.opacity = 0; });
  }
});

// ----------------------------------------------------------------------------
// UI reveal
// ----------------------------------------------------------------------------
window.addEventListener('load', () => {
  document.getElementById('loader').classList.add('hide');
  setTimeout(() => {
    document.getElementById('title').classList.add('in');
    document.getElementById('hint').classList.add('in');
    document.getElementById('panel').classList.add('in');
  }, 350);
});

// ----------------------------------------------------------------------------
// Animation loop
// ----------------------------------------------------------------------------
const clock = new THREE.Clock();
let intro = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = paused ? 0 : dt * timeScale;

  // Sun shimmer
  sun.rotation.y += dt * 0.05;
  corona.material.rotation += dt * 0.02;

  // Planets
  for (const p of planets) {
    p.pivot.rotation.y += t * p.def.speed * 0.25;
    p.mesh.rotation.y += t * p.def.spin * 20;
    if (p.mesh.userData.clouds) p.mesh.userData.clouds.rotation.y += t * 0.03 * 20;
    if (p.group.userData.moonPivot) p.group.userData.moonPivot.rotation.y += t * 1.6;
  }

  // Belt
  const bp = beltMesh.geometry.attributes.position;
  for (let i = 0; i < bCount; i++) {
    const d = bData[i];
    d.angle += t * d.speed * 0.25;
    bp.array[i*3] = Math.cos(d.angle) * d.radius;
    bp.array[i*3+2] = Math.sin(d.angle) * d.radius;
  }
  bp.needsUpdate = true;

  // Comet
  cometOrbit.a += t * cometOrbit.speed;
  const ca = cometOrbit.a;
  comet.position.set(
    Math.cos(ca) * cometOrbit.radius,
    Math.sin(ca) * cometOrbit.radius * cometOrbit.incline,
    Math.sin(ca) * cometOrbit.radius
  );
  cometTail.position.set(-Math.cos(ca) * 8, -Math.sin(ca) * 8 * cometOrbit.incline, -Math.sin(ca) * 8);
  cometTail.material.rotation = -ca;

  // Stars drift
  starsFar.rotation.y += dt * 0.002;
  starsNear.rotation.y -= dt * 0.003;

  // Intro camera ease-in
  if (intro < 1) {
    intro = Math.min(1, intro + dt * 0.25);
    const e = 1 - Math.pow(1 - intro, 3);
    camera.position.y = 70 + (1 - e) * 60;
    camera.position.z = 175 - (1 - e) * 45;
  }

  controls.update();

  // Labels
  if (showLabels) {
    const v = new THREE.Vector3();
    for (const l of labelLayer) {
      l.group.getWorldPosition(v);
      v.project(camera);
      const behind = v.z > 1;
      if (behind) { l.el.style.opacity = 0; continue; }
      const x = (v.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
      l.el.style.left = x + 'px';
      l.el.style.top = y + 'px';
      l.el.style.opacity = 0.9;
    }
  }

  composer.render();
}
animate();

// ----------------------------------------------------------------------------
// Resize
// ----------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
