<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verdant — A Self-Sustaining Ecosystem</title>
<style>
  :root {
    --bg: #0a0f0d;
    --panel: rgba(18, 28, 24, 0.82);
    --panel-edge: rgba(120, 200, 150, 0.18);
    --ink: #d8efe0;
    --ink-dim: #7f9b8a;
    --grass: #4caf50;
    --herb: #ffd166;
    --carn: #ef5350;
    --accent: #6fe3a0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(120% 120% at 50% -10%, #11201a 0%, #0a0f0d 60%, #060a08 100%);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
  }
  .hud {
    position: fixed;
    top: 16px; left: 16px;
    width: 268px;
    padding: 16px 16px 14px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    user-select: none;
  }
  .hud h1 {
    margin: 0 0 2px;
    font-size: 18px;
    letter-spacing: .5px;
    font-weight: 650;
  }
  .hud .sub {
    margin: 0 0 12px;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: .3px;
  }
  .stat-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; margin: 5px 0;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 6px currentColor; }
  .dot.grass { background: var(--grass); color: var(--grass); }
  .dot.herb { background: var(--herb); color: var(--herb); }
  .dot.carn { background: var(--carn); color: var(--carn); }
  .stat-row .label { flex: 1; color: var(--ink-dim); }
  .stat-row .val { font-variant-numeric: tabular-nums; font-weight: 600; }

  .chart {
    margin-top: 12px;
    border-radius: 8px;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.05);
  }
  .legend { font-size: 10px; color: var(--ink-dim); margin-top: 5px; display:flex; gap:10px; }
  .legend span { display:flex; align-items:center; gap:4px; }

  .controls {
    position: fixed; bottom: 16px; left: 16px;
    display: flex; gap: 10px; align-items: center;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    user-select: none;
  }
  .btn {
    font: inherit; font-size: 12.5px;
    color: var(--ink);
    background: rgba(111,227,160,.12);
    border: 1px solid rgba(111,227,160,.3);
    padding: 7px 13px; border-radius: 9px; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(111,227,160,.22); }
  .btn:active { transform: scale(.96); }
  .btn.alt { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); }
  .hint {
    position: fixed; bottom: 18px; right: 18px;
    font-size: 11px; color: var(--ink-dim);
    text-align: right; line-height: 1.5;
    user-select: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .speed { display:flex; align-items:center; gap:6px; font-size:11px; color: var(--ink-dim); }
  .speed input { width: 84px; accent-color: var(--accent); }
  .fps { position: fixed; top: 16px; right: 16px; font-size: 11px; color: var(--ink-dim);
         background: var(--panel); border:1px solid var(--panel-edge); padding:5px 9px; border-radius:8px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <h1>Verdant</h1>
  <p class="sub">a self-sustaining ecosystem</p>
  <div class="stat-row"><span class="dot grass"></span><span class="label">Grass tufts</span><span class="val" id="cGrass">0</span></div>
  <div class="stat-row"><span class="dot herb"></span><span class="label">Foragers</span><span class="val" id="cHerb">0</span></div>
  <div class="stat-row"><span class="dot carn"></span><span class="label">Predators</span><span class="val" id="cCarn">0</span></div>
  <div class="stat-row"><span class="label">Generation</span><span class="val" id="cGen">0</span></div>
  <canvas class="chart" id="chart" width="236" height="70"></canvas>
  <div class="legend">
    <span><span class="dot grass"></span>grass</span>
    <span><span class="dot herb"></span>forager</span>
    <span><span class="dot carn"></span>predator</span>
  </div>
</div>

<div class="fps" id="fps">—</div>

<div class="controls">
  <button class="btn" id="pauseBtn">Pause</button>
  <button class="btn alt" id="resetBtn">Reset</button>
  <div class="speed">speed
    <input type="range" id="speed" min="0.25" max="3" step="0.25" value="1" />
    <span id="speedVal">1×</span>
  </div>
</div>

<div class="hint">
  Click to drop a forager · Shift-click to drop a predator<br/>
  Watch the food web find its own balance.
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const chart = document.getElementById("chart");
  const cctx = chart.getContext("2d");

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- RNG (small, deterministic-ish) ----
  let seed = (Math.random() * 1e9) >>> 0;
  function rnd() { // xorshift32
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0;
    return seed / 4294967296;
  }
  const rand = (a, b) => a + (b - a) * rnd();
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; };

  // ---- World parameters ----
  const CFG = {
    grassMax: 1400,
    grassSpawnPerSec: 26,
    grassEnergy: 26,
    herbSpeed: 58, herbRadius: 4.5, herbVision: 70,
    herbMaxEnergy: 150, herbStartEnergy: 70, herbReproEnergy: 120, herbReproCost: 55, herbMetabolism: 9,
    carnSpeed: 70, carnRadius: 6, carnVision: 130,
    carnMaxEnergy: 220, carnStartEnergy: 130, carnReproEnergy: 175, carnReproCost: 80, carnMetabolism: 14,
    carnBite: 95,
  };

  let grass = [];      // {x,y,r}
  let herbivores = [];
  let carnivores = [];
  let generation = 0;
  let running = true;
  let speedMul = 1;

  // ---- Spatial hashing for grass (cheap) ----
  class Grid {
    constructor(cell) { this.cell = cell; this.map = new Map(); }
    key(cx, cy) { return cx + "," + cy; }
    clear() { this.map.clear(); }
    insert(item) {
      const cx = (item.x / this.cell) | 0, cy = (item.y / this.cell) | 0;
      const k = this.key(cx, cy);
      let arr = this.map.get(k); if (!arr) { arr = []; this.map.set(k, arr); }
      arr.push(item);
    }
    near(x, y, radius) {
      const out = [];
      const r = Math.ceil(radius / this.cell);
      const cx = (x / this.cell) | 0, cy = (y / this.cell) | 0;
      for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {
        const arr = this.map.get(this.key(cx + i, cy + j));
        if (arr) for (let k = 0; k < arr.length; k++) out.push(arr[k]);
      }
      return out;
    }
  }
  const grassGrid = new Grid(40);

  // ---- Entities ----
  function makeHerb(x, y, energy) {
    return { x, y, vx: rand(-1,1), vy: rand(-1,1), energy: energy ?? CFG.herbStartEnergy,
             age: 0, repro: 0, hue: rand(40, 55) };
  }
  function makeCarn(x, y, energy) {
    return { x, y, vx: rand(-1,1), vy: rand(-1,1), energy: energy ?? CFG.carnStartEnergy,
             age: 0, repro: 0, hue: rand(0, 12) };
  }

  function reset() {
    grass = []; herbivores = []; carnivores = [];
    generation = 0;
    seed = (Math.random() * 1e9) >>> 0;
    const area = W * H;
    const gCount = Math.min(CFG.grassMax, Math.floor(area / 6500));
    for (let i = 0; i < gCount; i++) grass.push({ x: rand(0, W), y: rand(0, H), r: rand(2, 4) });
    for (let i = 0; i < Math.max(14, Math.floor(area / 90000)); i++)
      herbivores.push(makeHerb(rand(0, W), rand(0, H)));
    for (let i = 0; i < Math.max(4, Math.floor(area / 320000)); i++)
      carnivores.push(makeCarn(rand(0, W), rand(0, H)));
    history = [];
  }

  // ---- Simulation step ----
  let grassAccumulator = 0;
  function spawnGrass(dt) {
    grassAccumulator += CFG.grassSpawnPerSec * dt;
    while (grassAccumulator >= 1 && grass.length < CFG.grassMax) {
      grassAccumulator -= 1;
      grass.push({ x: rand(0, W), y: rand(0, H), r: rand(2, 4) });
    }
  }

  function stepHerb(h, dt) {
    // find nearest grass
    let target = null, best = CFG.herbVision * CFG.herbVision;
    const near = grassGrid.near(h.x, h.y, CFG.herbVision);
    for (let i = 0; i < near.length; i++) {
      const g = near[i];
      const d = dist2(h.x, h.y, g.x, g.y);
      if (d < best) { best = d; target = g; }
    }
    let ax = 0, ay = 0;
    if (target) {
      const dx = target.x - h.x, dy = target.y - h.y, m = Math.hypot(dx, dy) || 1;
      ax = dx / m; ay = dy / m;
    } else {
      ax = Math.cos(h.age * 0.7 + h.y * 0.01);
      ay = Math.sin(h.age * 0.6 + h.x * 0.01);
    }
    h.vx += ax * 30 * dt; h.vy += ay * 30 * dt;
    const sp = Math.hypot(h.vx, h.vy) || 1;
    if (sp > CFG.herbSpeed) { h.vx = h.vx / sp * CFG.herbSpeed; h.vy = h.vy / sp * CFG.herbSpeed; }
    h.x += h.vx * dt; h.y += h.vy * dt;
    // bounds wrap
    if (h.x < 0) h.x += W; else if (h.x > W) h.x -= W;
    if (h.y < 0) h.y += H; else if (h.y > H) h.y -= H;

    h.energy -= CFG.herbMetabolism * dt;
    h.age += dt;

    // eat
    if (target && dist2(h.x, h.y, target.x, target.y) < (CFG.herbRadius + target.r + 2) ** 2) {
      const idx = grass.indexOf(target);
      if (idx >= 0) { grass.splice(idx, 1); h.energy = Math.min(CFG.herbMaxEnergy, h.energy + CFG.grassEnergy); }
    }
    // reproduce
    h.repro += dt;
    if (h.energy > CFG.herbReproEnergy && h.repro > 4) {
      h.energy -= CFG.herbReproCost; h.repro = 0;
      const baby = makeHerb(h.x + rand(-6, 6), h.y + rand(-6, 6), CFG.herbReproCost + 8);
      hb.push(baby);
    }
    return h.energy > 0;
  }

  function stepCarn(c, dt) {
    let target = null, best = CFG.carnVision * CFG.carnVision;
    for (let i = 0; i < herbivores.length; i++) {
      const h = herbivores[i];
      const d = dist2(c.x, c.y, h.x, h.y);
      if (d < best) { best = d; target = h; }
    }
    let ax = 0, ay = 0;
    if (target) {
      const dx = target.x - c.x, dy = target.y - c.y, m = Math.hypot(dx, dy) || 1;
      ax = dx / m; ay = dy / m;
    } else {
      ax = Math.cos(c.age * 0.5 + c.x * 0.01);
      ay = Math.sin(c.age * 0.45 + c.y * 0.01);
    }
    c.vx += ax * 34 * dt; c.vy += ay * 34 * dt;
    const sp = Math.hypot(c.vx, c.vy) || 1;
    if (sp > CFG.carnSpeed) { c.vx = c.vx / sp * CFG.carnSpeed; c.vy = c.vy / sp * CFG.carnSpeed; }
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.x < 0) c.x += W; else if (c.x > W) c.x -= W;
    if (c.y < 0) c.y += H; else if (c.y > H) c.y -= H;

    c.energy -= CFG.carnMetabolism * dt;
    c.age += dt;

    if (target && dist2(c.x, c.y, target.x, target.y) < (CFG.carnRadius + CFG.herbRadius + 1) ** 2) {
      const idx = herbivores.indexOf(target);
      if (idx >= 0) {
        herbivores.splice(idx, 1);
        c.energy = Math.min(CFG.carnMaxEnergy, c.energy + CFG.carnBite);
      }
    }
    c.repro += dt;
    if (c.energy > CFG.carnReproEnergy && c.repro > 6) {
      c.energy -= CFG.carnReproCost; c.repro = 0;
      cb.push(makeCarn(c.x + rand(-8, 8), c.y + rand(-8, 8), CFG.carnReproCost + 10));
    }
    return c.energy > 0;
  }

  let hb = [], cb = [];
  function update(dt) {
    spawnGrass(dt);
    grassGrid.clear();
    for (let i = 0; i < grass.length; i++) grassGrid.insert(grass[i]);

    const aliveH = [];
    for (let i = 0; i < herbivores.length; i++) {
      const h = herbivores[i];
      if (stepHerb(h, dt)) aliveH.push(h);
    }
    hb = [];
    for (let i = 0; i < carnivores.length; i++) {
      const c = carnivores[i];
      if (stepCarn(c, dt)) cb.push(c);
    }
    herbivores = aliveH.concat(hb);
    carnivores = cb;
    if (hb.length || cb.length) generation++;
  }

  // ---- Rendering ----
  function draw() {
    // soft vignette background already via CSS; draw ecosystem field
    ctx.clearRect(0, 0, W, H);

    // grass
    ctx.save();
    for (let i = 0; i < grass.length; i++) {
      const g = grass[i];
      ctx.fillStyle = "rgba(76,175,80," + (0.35 + (g.r - 2) * 0.12) + ")";
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();

    // herbivores
    for (let i = 0; i < herbivores.length; i++) {
      const h = herbivores[i];
      drawCreature(h.x, h.y, CFG.herbRadius, "hsl(" + h.hue + ",90%,62%)", h.energy / CFG.herbMaxEnergy);
    }
    // carnivores
    for (let i = 0; i < carnivores.length; i++) {
      const c = carnivores[i];
      drawCreature(c.x, c.y, CFG.carnRadius, "hsl(" + c.hue + ",75%,58%)", c.energy / CFG.carnMaxEnergy, true);
    }
  }

  function drawCreature(x, y, r, color, energyFrac, pred) {
    // glow
    ctx.beginPath();
    ctx.fillStyle = pred ? "rgba(239,83,80,0.16)" : "rgba(255,209,102,0.14)";
    ctx.arc(x, y, r * 2.6, 0, 6.2832);
    ctx.fill();
    // body
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
    // energy ring
    ctx.beginPath();
    ctx.strokeStyle = "rgba(255,255,255," + (0.25 + energyFrac * 0.5) + ")";
    ctx.lineWidth = 1.4;
    ctx.arc(x, y, r + 2, -Math.PI/2, -Math.PI/2 + 6.2832 * Math.max(0.05, energyFrac));
    ctx.stroke();
  }

  // ---- Population chart ----
  let history = [];
  const MAXH = 240;
  function pushHistory() {
    history.push({ g: grass.length, h: herbivores.length, c: carnivores.length });
    if (history.length > MAXH) history.shift();
  }
  function drawChart() {
    const w = chart.width, h = chart.height;
    cctx.clearRect(0, 0, w, h);
    if (history.length < 2) return;
    let max = 10;
    for (const p of history) max = Math.max(max, p.g, p.h * 4, p.c * 8);
    const plot = (key, scale, color) => {
      cctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const x = (i / (MAXH - 1)) * w;
        const y = h - (history[i][key] / max) * h * scale;
        if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
      }
      cctx.strokeStyle = color; cctx.lineWidth = 1.4; cctx.stroke();
    };
    plot("g", 1, "rgba(76,175,80,.8)");
    plot("h", 1, "rgba(255,209,102,.85)");
    plot("c", 1, "rgba(239,83,80,.9)");
  }

  // ---- Loop ----
  let last = performance.now();
  let acc = 0, fpsT = 0, fpsN = 0, fps = 0;
  const FIXED = 1 / 60;
  let histTimer = 0;

  const elGrass = document.getElementById("cGrass");
  const elHerb = document.getElementById("cHerb");
  const elCarn = document.getElementById("cCarn");
  const elGen = document.getElementById("cGen");
  const elFps = document.getElementById("fps");

  function loop(now) {
    let frameDt = (now - last) / 1000;
    last = now;
    if (frameDt > 0.1) frameDt = 0.1;

    if (running) {
      let sim = frameDt * speedMul;
      acc += sim;
      let steps = 0;
      while (acc >= FIXED && steps < 8) { update(FIXED); acc -= FIXED; steps++; }
    }
    draw();
    drawChart();

    // stats
    elGrass.textContent = grass.length;
    elHerb.textContent = herbivores.length;
    elCarn.textContent = carnivores.length;
    elGen.textContent = generation;

    fpsT += frameDt; fpsN++;
    if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0;
      elFps.textContent = fps + " fps"; }

    histTimer += frameDt;
    if (histTimer >= 0.25) { pushHistory(); histTimer = 0; }

    requestAnimationFrame(loop);
  }

  // ---- Interaction ----
  canvas.addEventListener("click", (e) => {
    if (e.shiftKey) carnivores.push(makeCarn(e.clientX, e.clientY));
    else herbivores.push(makeHerb(e.clientX, e.clientY));
  });

  document.getElementById("pauseBtn").addEventListener("click", (e) => {
    running = !running;
    e.target.textContent = running ? "Pause" : "Resume";
  });
  document.getElementById("resetBtn").addEventListener("click", reset);
  const speedEl = document.getElementById("speed");
  speedEl.addEventListener("input", () => {
    speedMul = parseFloat(speedEl.value);
    document.getElementById("speedVal").textContent = speedMul + "×";
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
