<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Endless Drive — Night</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* cinematic vignette + subtle dashboard reflection */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 86%, rgba(0,0,0,0.9) 100%),
      linear-gradient(180deg, rgba(6,10,20,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(2,4,9,0.85) 100%);
    mix-blend-mode: normal;
  }
  #dash {
    position: fixed; left: 0; right: 0; bottom: 0; height: 22%;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(4,7,14,0.55) 60%, rgba(2,3,7,0.9) 100%);
    box-shadow: inset 0 1px 0 rgba(120,150,200,0.06);
  }

  /* title + hint */
  #title {
    position: fixed; left: 0; right: 0; top: 13%;
    text-align: center; pointer-events: none;
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: #cfe2ff; text-shadow: 0 0 18px rgba(80,140,255,0.5);
    transition: opacity 2.4s ease;
  }
  #title h1 {
    font-weight: 200; letter-spacing: 0.42em; font-size: clamp(20px, 4.6vw, 44px);
    text-transform: uppercase; opacity: 0.92;
  }
  #title p {
    margin-top: 14px; font-weight: 300; letter-spacing: 0.22em; font-size: clamp(10px, 1.6vw, 13px);
    color: #6f86ad; text-transform: uppercase;
  }

  /* HUD */
  #hud {
    position: fixed; left: 18px; bottom: 16px; pointer-events: none;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    color: #8fb4ff; font-size: 12px; letter-spacing: 0.12em; opacity: 0.65;
    text-shadow: 0 0 10px rgba(40,90,200,0.5);
  }
  #hud b { color: #d8e6ff; font-weight: 600; }
  #speedo {
    position: fixed; right: 18px; bottom: 16px; pointer-events: none;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    color: #9fd0ff; font-size: 12px; letter-spacing: 0.12em; opacity: 0.6;
    text-align: right; text-shadow: 0 0 10px rgba(40,120,220,0.5);
  }
  #speedo .big { font-size: 26px; color: #e6f1ff; font-weight: 600; }

  #fade {
    position: fixed; inset: 0; background: #04060c; pointer-events: none;
    transition: opacity 1.2s ease; opacity: 1;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="dash"></div>

  <div id="title">
    <h1>Endless Drive</h1>
    <p>↑ accelerate &nbsp;·&nbsp; ↓ brake &nbsp;·&nbsp; ← → steer &nbsp;·&nbsp; or just watch</p>
  </div>

  <div id="hud">
    NIGHT RUN &nbsp; <b id="dist">0.0</b> km
  </div>
  <div id="speedo">
    <div class="big"><span id="kmh">0</span></div>
    <div>km / h</div>
  </div>

  <div id="fade"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";

  if (typeof THREE === "undefined") {
    document.getElementById("fade").style.opacity = 0;
    document.getElementById("title").innerHTML =
      "<h1>Offline</h1><p>Three.js could not be loaded from the CDN.</p>";
    return;
  }

  // ---------- core setup ----------
  const app = document.getElementById("app");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05070e, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b16, 0.0085);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 4000);
  camera.position.set(0, 2.6, 0);

  // ---------- sky dome (gradient, follows camera so it feels infinite) ----------
  const skyGeo = new THREE.SphereGeometry(2200, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top:    { value: new THREE.Color(0x02030a) },
      mid:    { value: new THREE.Color(0x0a1430) },
      horizon:{ value: new THREE.Color(0x223a66) },
      glow:   { value: new THREE.Color(0x3a5a8c) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main(){
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      varying vec3 vPos;
      uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; uniform vec3 glow;
      void main(){
        float h = normalize(vPos).y;
        vec3 col;
        if(h > 0.0){
          col = mix(mid, top, pow(clamp(h,0.0,1.0), 0.7));
        } else {
          col = mix(mid, horizon, clamp(-h*3.0,0.0,1.0));
        }
        // faint horizon glow band
        float band = exp(-pow(h*8.0,2.0)) * 0.5;
        col = mix(col, glow, band);
        gl_FragColor = vec4(col,1.0);
      }`
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // ---------- stars (child of sky so they pan with view) ----------
  (function addStars(){
    const N = 1400;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    const c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      // upper hemisphere mostly
      const u = Math.random(), v = Math.random();
      const theta = u * Math.PI * 2;
      const phi = Math.acos(0.15 + v * 0.85); // bias upward
      const r = 1900;
      pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.cos(phi);
      pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
      const t = Math.random();
      c.setHSL(0.58 + t*0.06, 0.5, 0.7 + Math.random()*0.3);
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size: 4.5, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false });
    const stars = new THREE.Points(g, m);
    sky.add(stars);
  })();

  // ---------- moon ----------
  (function addMoon(){
    const cv = document.createElement("canvas");
    cv.width = cv.height = 128;
    const x = cv.getContext("2d");
    const g = x.createRadialGradient(64,64,4, 64,64,64);
    g.addColorStop(0, "rgba(245,248,255,1)");
    g.addColorStop(0.5, "rgba(210,224,255,0.85)");
    g.addColorStop(1, "rgba(180,205,255,0)");
    x.fillStyle = g; x.fillRect(0,0,128,128);
    const tex = new THREE.CanvasTexture(cv);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const moon = new THREE.Sprite(mat);
    moon.scale.set(220, 220, 1);
    moon.position.set(-700, 520, -1500);
    sky.add(moon);
    // halo
    const halo = new THREE.Sprite(mat.clone());
    halo.scale.set(460, 460, 1);
    halo.material.opacity = 0.35;
    moon.add(halo);
  })();

  // ---------- the world group (road + props + skyline), scrolls & wraps ----------
  const P = 300;          // recycling period (world repeats every P units)
  const ROAD_HALF = 6.0;  // half road width
  const AHEAD = 360;      // how far the ribbon extends ahead
  const AMP = 7.5;        // curve amplitude
  const WAVES = 2;        // number of S-curves per period

  // road centerline in local space: periodic with P so wrapping is seamless
  function curveX(s) { return AMP * Math.sin((s / P) * Math.PI * 2 * WAVES); }

  const world = new THREE.Group();
  scene.add(world);

  // ground (catches headlight glow beyond the asphalt)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(900, AHEAD + 600),
    new THREE.MeshStandardMaterial({ color: 0x070b10, roughness: 1.0, metalness: 0.0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, -0.02, -AHEAD / 2 + 200);
  world.add(ground);

  // ---------- road ribbon (curved) ----------
  (function buildRoad(){
    const segLen = 4;
    const N = Math.ceil((P + AHEAD) / segLen) + 4;   // localZ from +P+... down to -AHEAD
    const M = 10;                                    // across width
    const top = P + 30;                              // extend a bit behind camera
    const bot = -AHEAD;
    const positions = [];
    const uvs = [];
    const indices = [];
    for (let i = 0; i <= N; i++) {
      const localZ = top - (i / N) * (top - bot);
      const cx = curveX(localZ);
      for (let j = 0; j <= M; j++) {
        const t = j / M;
        const x = cx + (t - 0.5) * (ROAD_HALF * 2);
        positions.push(x, 0.0, localZ);
        uvs.push(t, (top - localZ) / (P / 1)); // v repeats per period-ish
      }
    }
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < M; j++) {
        const a = i * (M + 1) + j;
        const b = a + 1;
        const c = a + (M + 1);
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(indices);
    g.computeVertexNormals();

    // road texture: asphalt + dashed center + edge lines
    const cv = document.createElement("canvas");
    cv.width = 64; cv.height = 128;
    const x = cv.getContext("2d");
    x.fillStyle = "#0c0f15"; x.fillRect(0,0,64,128);
    // subtle asphalt noise
    for (let k = 0; k < 1600; k++) {
      const v = (Math.random()*40)|0;
      x.fillStyle = "rgba("+(20+v)+","+(22+v)+","+(28+v)+",0.5)";
      x.fillRect(Math.random()*64, Math.random()*128, 1, 1);
    }
    // edge lines
    x.fillStyle = "rgba(200,210,225,0.9)";
    x.fillRect(4, 0, 3, 128);
    x.fillRect(57, 0, 3, 128);
    // center dashed yellow
    x.fillStyle = "rgba(240,210,120,0.95)";
    x.fillRect(30, 14, 4, 50);
    x.fillRect(30, 78, 4, 50);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, (P + AHEAD) / 11);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, metalness: 0.1 });
    const road = new THREE.Mesh(g, mat);
    road.position.y = 0.01;
    world.add(road);
  })();

  // ---------- shared textures for props ----------
  function glowTexture() {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 128;
    const x = cv.getContext("2d");
    const g = x.createRadialGradient(64,64,2, 64,64,64);
    g.addColorStop(0, "rgba(255,240,200,1)");
    g.addColorStop(0.25, "rgba(255,215,150,0.65)");
    g.addColorStop(1, "rgba(255,200,120,0)");
    x.fillStyle = g; x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(cv);
  }
  const glowTex = glowTexture();

  function windowTexture(seed) {
    const cv = document.createElement("canvas");
    cv.width = 64; cv.height = 128;
    const x = cv.getContext("2d");
    x.fillStyle = "#0a0f1c"; x.fillRect(0,0,64,128);
    let s = seed * 9301 + 49297;
    const rnd = () => { s = (s*9301 + 49297) % 233280; return s/233280; };
    for (let yy = 6; yy < 128; yy += 9) {
      for (let xx = 5; xx < 60; xx += 8) {
        const r = rnd();
        if (r < 0.55) {
          const warm = rnd();
          x.fillStyle = warm < 0.7 ? "rgba(255,210,130,0.95)" : "rgba(180,220,255,0.9)";
          x.fillRect(xx, yy, 5, 6);
        }
      }
    }
    return new THREE.CanvasTexture(cv);
  }

  // ---------- roadside props (lamps + trees + rocks) ----------
  const props = [];
  (function buildProps(){
    const spacing = 24;
    let idx = 0;
    for (let localZ = -52; localZ > -(P + AHEAD - 40); localZ -= spacing) {
      const side = (idx % 2 === 0) ? -1 : 1;
      const chosen = (idx % 4 === 1) ? "tree" : (idx % 4 === 3 ? "rock" : "lamp");
      const cx = curveX(localZ);
      const baseX = cx + side * (ROAD_HALF + 2.2 + Math.random()*1.5);

      let obj;
      if (chosen === "lamp") {
        obj = new THREE.Group();
        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.16, 6.4, 6),
          new THREE.MeshStandardMaterial({ color: 0x141820, roughness: 0.8, metalness: 0.4 })
        );
        pole.position.y = 3.2;
        obj.add(pole);
        const arm = new THREE.Mesh(
          new THREE.BoxGeometry(1.1, 0.14, 0.14),
          new THREE.MeshStandardMaterial({ color: 0x141820, roughness: 0.8, metalness: 0.4 })
        );
        arm.position.set(-side * 0.55, 6.3, 0);
        obj.add(arm);
        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.28, 10, 10),
          new THREE.MeshStandardMaterial({ color: 0xfff1c8, emissive: 0xffd98a, emissiveIntensity: 2.4 })
        );
        bulb.position.set(-side * 1.05, 6.15, 0);
        obj.add(bulb);
        const glow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTex, color: 0xffe2a8, transparent: true, depthWrite: false,
          blending: THREE.AdditiveBlending, opacity: 0.9
        }));
        glow.scale.set(7, 7, 1);
        glow.position.copy(bulb.position);
        obj.add(glow);
      } else if (chosen === "tree") {
        obj = new THREE.Group();
        const h = 4 + Math.random()*4;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.32, h*0.5, 6),
          new THREE.MeshStandardMaterial({ color: 0x0c0e12, roughness: 1 })
        );
        trunk.position.y = h*0.25;
        obj.add(trunk);
        const c1 = new THREE.Mesh(
          new THREE.ConeGeometry(1.6 + Math.random(), h, 7),
          new THREE.MeshStandardMaterial({ color: 0x0a1410, roughness: 1 })
        );
        c1.position.y = h*0.75;
        obj.add(c1);
      } else {
        obj = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.6 + Math.random()*0.5, 0),
          new THREE.MeshStandardMaterial({ color: 0x0b0d11, roughness: 1, flatShading: true })
        );
        obj.position.y = 0.3;
        obj.rotation.set(Math.random(), Math.random(), Math.random());
      }

      obj.position.x = baseX;
      obj.position.z = localZ;
      obj.rotation.y = Math.random() * Math.PI * 2;
      world.add(obj);
      props.push(obj);
      idx++;
    }
  })();

  // ---------- distant skyline (scrolls with world) ----------
  (function buildSkyline(){
    const group = new THREE.Group();
    const count = 26;
    for (let i = 0; i < count; i++) {
      const w = 14 + Math.random()*22;
      const h = 30 + Math.random()*90;
      const d = 14 + Math.random()*22;
      const mat = new THREE.MeshStandardMaterial({
        color: 0x0a1322, roughness: 1, metalness: 0,
        emissive: 0xffffff, emissiveMap: windowTexture(i+1),
        emissiveIntensity: 0.9
      });
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      const side = (i % 2 === 0) ? -1 : 1;
      b.position.set(side * (90 + Math.random()*120), h/2 - 1, -AHEAD - 30 - Math.random()*60);
      group.add(b);
    }
    world.add(group);
  })();

  // ---------- lighting ----------
  scene.add(new THREE.AmbientLight(0x223355, 0.5));
  const hemi = new THREE.HemisphereLight(0x2a3a66, 0x05070c, 0.35);
  scene.add(hemi);

  // two headlights (spotlights) mounted at the car
  function makeHeadlight(xoff, color) {
    const sp = new THREE.SpotLight(color, 6.0, 150, 0.62, 0.45, 1.2);
    sp.position.set(xoff, 1.5, -0.5);
    const tgt = new THREE.Object3D();
    tgt.position.set(xoff, 0.6, -70);
    scene.add(tgt);
    sp.target = tgt;
    scene.add(sp);
    return { light: sp, target: tgt };
  }
  const hlL = makeHeadlight(-0.85, 0xfff0d0);
  const hlR = makeHeadlight( 0.85, 0xfff0d0);

  // faint warm fill from the dashboard
  const fill = new THREE.PointLight(0x3a4a7a, 0.6, 40, 2);
  fill.position.set(0, 1.4, 1.5);
  scene.add(fill);

  // ---------- input ----------
  const keys = {};
  let steer = 0;        // -1..1 user steer
  let speed = 22;       // units / sec
  let targetSpeed = 22;

  window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });

  // pointer steer (drag / move) for touch & mouse
  let pointerSteer = 0;
  window.addEventListener("pointermove", (e) => {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    pointerSteer = Math.max(-1, Math.min(1, (Math.abs(nx) > 0.06 ? nx : 0) * 0.8));
  });
  window.addEventListener("pointerdown", () => { targetSpeed = Math.min(46, targetSpeed + 10); });

  // ---------- animation ----------
  let traveled = 0;
  let distKm = 0;
  const clock = new THREE.Clock();
  const lookTarget = new THREE.Vector3();
  const titleEl = document.getElementById("title");
  const fadeEl = document.getElementById("fade");
  const distEl = document.getElementById("dist");
  const kmhEl = document.getElementById("kmh");

  // fade out intro
  setTimeout(() => { titleEl.style.opacity = "0"; }, 4200);

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);

    // input -> target speed & steer
    if (keys["ArrowUp"]) targetSpeed = Math.min(48, targetSpeed + 28 * dt);
    if (keys["ArrowDown"]) targetSpeed = Math.max(6, targetSpeed - 40 * dt);
    if (keys["ArrowLeft"]) steer = Math.max(-1, steer - 2.2 * dt);
    if (keys["ArrowRight"]) steer = Math.min(1, steer + 2.2 * dt);
    if (!keys["ArrowLeft"] && !keys["ArrowRight"]) {
      steer += (pointerSteer - steer) * Math.min(1, dt * 4);
    }
    speed += (targetSpeed - speed) * Math.min(1, dt * 1.5);

    // advance world; wrap seamlessly every P
    traveled += speed * dt;
    distKm += (speed * dt) / 1000 * 60; // playful km scale
    let g = traveled % P;
    world.position.z = -g;

    // camera follows the winding road centerline; user steer offsets it
    const cxHere = curveX(g);
    camera.position.x += ((cxHere + steer * 2.2) - camera.position.x) * Math.min(1, dt * 3);
    camera.position.y = 2.6 + Math.sin(traveled * 0.25) * 0.05;
    // look ahead along the curve
    const aheadZ = -70;
    const localAhead = g - 70; // world z = -g + localAhead
    const cxAhead = curveX(localAhead);
    lookTarget.set(cxAhead + steer * 3.5, 1.5, aheadZ);
    camera.lookAt(lookTarget);
    camera.rotation.z = Math.sin(traveled * 0.18) * 0.012 + steer * 0.05;

    // headlights follow camera
    hlL.light.position.set(camera.position.x - 0.85, 1.5, camera.position.z - 0.5);
    hlR.light.position.set(camera.position.x + 0.85, 1.5, camera.position.z - 0.5);
    hlL.target.position.set(cxAhead - 0.8 + steer*3, 0.6, aheadZ);
    hlR.target.position.set(cxAhead + 0.8 + steer*3, 0.6, aheadZ);
    fill.position.x = camera.position.x;

    // sky + stars + moon follow camera (infinite distance feel)
    sky.position.copy(camera.position);

    // subtle speed-based fov
    const targetFov = 60 + (speed - 22) * 0.35;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 2);
    camera.updateProjectionMatrix();

    renderer.render(scene, camera);

    // HUD
    distEl.textContent = distKm.toFixed(1);
    kmhEl.textContent = Math.round(speed * 3.0);

    requestAnimationFrame(frame);
  }
  frame();

  // reveal
  requestAnimationFrame(() => { fadeEl.style.opacity = "0"; });

  // ---------- resize ----------
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
