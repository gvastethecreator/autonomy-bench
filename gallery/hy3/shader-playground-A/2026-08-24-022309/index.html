<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shader Playground — WebGL</title>
<style>
  :root {
    --bg: #0c0e14;
    --panel: #151823;
    --panel-2: #1c2030;
    --border: #2a2f42;
    --text: #e6e9f0;
    --muted: #8a91a8;
    --accent: #5cc8ff;
    --accent-2: #ff7ad9;
    --ok: #62e08b;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 420px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    width: 100vw;
  }
  header {
    grid-column: 1 / 3;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
    background: linear-gradient(90deg, #151823, #1b2030);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px; margin: 0; letter-spacing: .5px; font-weight: 600;
  }
  header h1 .g { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .preset-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  button, select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #06121c; border-color: var(--accent); font-weight: 600; }
  #stage {
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #glcanvas { display: block; width: 100%; height: 100%; }
  #fps {
    position: absolute; left: 10px; top: 10px;
    background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 5px;
    font-size: 11px; color: var(--muted); pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #overlay.show { opacity: 1; }
  #overlay .card {
    background: rgba(20,24,35,.92); border: 1px solid var(--err);
    border-radius: 8px; padding: 14px 18px; max-width: 80%;
    font-size: 12px; color: var(--err); white-space: pre-wrap;
  }
  #panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .panel-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .panel-head .dot.err { background: var(--err); }
  .editor-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  textarea {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0;
    background: #0a0c12; color: #d6e2ff; padding: 12px;
    font-family: inherit; font-size: 12.5px; line-height: 1.55;
    tab-size: 2; white-space: pre; overflow: auto;
  }
  .hint {
    padding: 8px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); line-height: 1.5;
  }
  .hint b { color: var(--accent); font-weight: 600; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 10.5px; color: var(--text);
  }
  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 48px 45vh 1fr; }
    #panel { border-left: 0; border-top: 1px solid var(--border); }
    header { grid-column: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Shader <span class="g">Playground</span></h1>
    <span class="sub">WebGL · live fragment shaders</span>
    <div class="spacer"></div>
    <div class="preset-bar" id="presets"></div>
  </header>

  <div id="stage">
    <canvas id="glcanvas"></canvas>
    <div id="fps">—</div>
    <div id="overlay"><div class="card" id="errcard"></div></div>
  </div>

  <aside id="panel">
    <div class="panel-head">
      <span class="dot" id="statusdot"></span>
      <span id="statustext">fragment shader</span>
      <div style="flex:1"></div>
      <button id="resetBtn" title="Reset to current preset">reset</button>
    </div>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false"></textarea>
    </div>
    <div class="hint">
      Available uniforms: <b>vec2 u_res</b> (pixels), <b>float u_time</b> (sec),
      <b>vec2 u_mouse</b> (pixels, y-up). Must define
      <b>vec3 render(vec2 uv)</b> and set <b>gl_FragColor</b>. Edit live —
      press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to recompile.
    </div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("glcanvas");
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  const codeEl = document.getElementById("code");
  const statusdot = document.getElementById("statusdot");
  const statustext = document.getElementById("statustext");
  const overlay = document.getElementById("overlay");
  const errcard = document.getElementById("errcard");
  const fpsEl = document.getElementById("fps");
  const presetsEl = document.getElementById("presets");

  if (!gl) {
    showError("WebGL is not available in this browser.");
    return;
  }

  // Vertex shader: fullscreen triangle.
  const VERT = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

  // The user fragment shader is wrapped so they only write a render() function.
  function wrap(src) {
    return `
    precision highp float;
    uniform vec2 u_res;
    uniform float u_time;
    uniform vec2 u_mouse;
    ${src}
    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
      vec3 col = render(uv);
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
    `;
  }

  const PRESETS = {
    "Plasma": `
// Animated plasma field
float wave(vec2 p, float t) {
  return sin(p.x * 3.0 + t)
       + sin(p.y * 4.0 - t * 1.3)
       + sin((p.x + p.y) * 2.5 + t * 0.7)
       + sin(length(p) * 6.0 - t * 1.1);
}
vec3 render(vec2 uv) {
  float t = u_time * 0.6;
  float v = wave(uv * 2.0, t);
  v = 0.5 + 0.5 * v / 4.0;
  vec3 a = vec3(0.10, 0.40, 0.90);
  vec3 b = vec3(0.95, 0.25, 0.75);
  vec3 c = vec3(0.20, 0.95, 0.70);
  vec3 col = mix(a, b, smoothstep(0.0, 1.0, v));
  col = mix(col, c, smoothstep(0.4, 0.9, abs(sin(t + v * 3.1415))));
  return col;
}`,

    "Raymarch": `
// Soft raymarched sphere with lighting
float sdSphere(vec3 p, float r) { return length(p) - r; }
vec3 render(vec2 uv) {
  vec3 ro = vec3(0.0, 0.0, 3.0);
  vec3 rd = normalize(vec3(uv, -1.5));
  float t = 0.0;
  float hit = -1.0;
  for (int i = 0; i < 64; i++) {
    vec3 p = ro + rd * t;
    float d = sdSphere(p - vec3(sin(u_time)*0.6, cos(u_time*0.8)*0.4, 0.0), 1.0);
    if (d < 0.001) { hit = t; break; }
    if (d > 20.0) break;
    t += d;
  }
  if (hit < 0.0) {
    return vec3(0.04, 0.05, 0.09) + 0.05 * uv.y;
  }
  vec3 p = ro + rd * hit;
  vec3 n = normalize(p - vec3(sin(u_time)*0.6, cos(u_time*0.8)*0.4, 0.0));
  vec3 L = normalize(vec3(0.6, 0.7, 0.5));
  float diff = max(dot(n, L), 0.0);
  float spec = pow(max(dot(reflect(-L, n), -rd), 0.0), 32.0);
  vec3 base = mix(vec3(0.95,0.3,0.5), vec3(0.3,0.6,1.0), 0.5+0.5*n.y);
  return base * (0.2 + diff) + vec3(spec);
}`,

    "Voronoi": `
// Voronoi cells with glowing edges
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}
vec3 render(vec2 uv) {
  uv *= 3.5;
  uv += vec2(0.0, u_time * 0.2);
  vec2 g = floor(uv);
  vec2 f = fract(uv);
  float md = 1e9;
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec2 o = vec2(float(i), float(j));
    vec2 r = hash2(g + o);
    r = 0.5 + 0.5 * sin(u_time + 6.2831 * r);
    vec2 d = o + r - f;
    md = min(md, dot(d, d));
  }
  float d = sqrt(md);
  vec3 col = mix(vec3(0.05,0.1,0.25), vec3(0.4,0.9,1.0), d);
  col *= smoothstep(0.0, 0.08, d) * 1.4;
  col += vec3(0.9, 0.4, 1.0) * (1.0 - smoothstep(0.0, 0.03, abs(d - 0.5)));
  return col;
}`,

    "Truchet": `
// Truchet tiles with flowing noise
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*43758.5); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
vec3 render(vec2 uv) {
  uv = uv * 4.0 + vec2(u_time * 0.15);
  vec2 id = floor(uv);
  vec2 gv = fract(uv) - 0.5;
  float rnd = hash(id);
  float n = noise(id * 0.5 + floor(u_time));
  float ang = rnd > 0.5 ? 1.5707963 : 0.0;
  float c = cos(ang), s = sin(ang);
  gv = mat2(c, -s, s, c) * gv;
  float d = abs(abs(gv.x) - abs(gv.y)) - 0.18;
  float line = smoothstep(0.04, 0.0, d);
  vec3 col = mix(vec3(0.03,0.04,0.08), vec3(0.2,0.8,0.9), n);
  col += vec3(1.0, 0.6, 0.3) * line;
  return col;
}`,

    "Mandelbrot": `
// Zooming Mandelbrot explorer
vec3 render(vec2 uv) {
  float zoom = 0.6 + 0.2 * sin(u_time * 0.2);
  vec2 c = uv / zoom;
  c += vec2(-0.75, 0.0);
  vec2 z = vec2(0.0);
  float iter = 0.0;
  const float MAX = 96.0;
  for (float i = 0.0; i < MAX; i++) {
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
    if (dot(z, z) > 4.0) break;
    iter++;
  }
  if (iter >= MAX) return vec3(0.0);
  float t = iter / MAX;
  vec3 a = vec3(0.0, 0.1, 0.3);
  vec3 b = vec3(0.9, 0.4, 0.1);
  vec3 cc = vec3(1.0, 0.95, 0.6);
  return mix(a, b, t) + cc * pow(t, 4.0);
}`
  };

  let current = "Plasma";
  let program = null;
  let buf = null;
  const u = { res: null, time: null, mouse: null };
  const mouse = { x: 0, y: 0 };

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error(log || "shader compile failed");
    }
    return sh;
  }

  function build(src) {
    const vs = compile(gl.VERTEX_SHADER, VERT);
    const fs = compile(gl.FRAGMENT_SHADER, wrap(src));
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(prog);
      gl.deleteProgram(prog);
      throw new Error(log || "program link failed");
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return prog;
  }

  function setError(msg) {
    statusdot.className = "dot err";
    statustext.textContent = "compile error";
    errcard.textContent = msg;
    overlay.classList.add("show");
  }
  function clearError() {
    statusdot.className = "dot";
    statustext.textContent = "fragment shader";
    overlay.classList.remove("show");
  }
  function showError(msg) {
    statusdot.className = "dot err";
    statustext.textContent = "fatal";
    errcard.textContent = msg;
    overlay.classList.add("show");
  }

  function recompile() {
    try {
      const prog = build(codeEl.value);
      if (program) gl.deleteProgram(program);
      program = prog;
      gl.useProgram(program);
      if (!buf) {
        buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      }
      const loc = gl.getAttribLocation(program, "a_pos");
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      u.res = gl.getUniformLocation(program, "u_res");
      u.time = gl.getUniformLocation(program, "u_time");
      u.mouse = gl.getUniformLocation(program, "u_mouse");
      clearError();
    } catch (e) {
      setError(e.message);
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(canvas.clientWidth * dpr);
    const h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  let last = performance.now(), frames = 0, facc = 0;
  function render(now) {
    resize();
    if (program) {
      gl.useProgram(program);
      gl.uniform2f(u.res, canvas.width, canvas.height);
      gl.uniform1f(u.time, now / 1000);
      gl.uniform2f(u.mouse, mouse.x * (canvas.width / canvas.clientWidth),
                   (canvas.clientHeight - mouse.y) * (canvas.height / canvas.clientHeight));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    frames++;
    const dt = now - last;
    facc += dt;
    if (facc >= 500) {
      fpsEl.textContent = (1000 * frames / facc).toFixed(0) + " fps · " + canvas.width + "×" + canvas.height;
      frames = 0; facc = 0;
    }
    last = now;
    requestAnimationFrame(render);
  }

  canvas.addEventListener("mousemove", (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });

  codeEl.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = codeEl.selectionStart, en = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, s) + "  " + codeEl.value.slice(en);
      codeEl.selectionStart = codeEl.selectionEnd = s + 2;
    } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      recompile();
    }
  });

  // Preset buttons
  Object.keys(PRESETS).forEach((name) => {
    const b = document.createElement("button");
    b.textContent = name;
    b.addEventListener("click", () => {
      current = name;
      codeEl.value = PRESETS[name];
      recompile();
      markActive();
    });
    b.dataset.name = name;
    presetsEl.appendChild(b);
  });
  function markActive() {
    [...presetsEl.children].forEach((b) => {
      b.classList.toggle("active", b.dataset.name === current);
    });
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    codeEl.value = PRESETS[current];
    recompile();
  });

  // Init
  codeEl.value = PRESETS[current];
  markActive();
  recompile();
  if (!program) { showError("Initial shader failed to compile."); }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
