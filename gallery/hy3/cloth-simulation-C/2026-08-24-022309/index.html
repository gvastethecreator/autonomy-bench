<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silk — Cloth in the Wind</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060c; }
  #stage { position: fixed; inset: 0; display: block; }
  .overlay {
    position: fixed; left: 28px; top: 24px; z-index: 5;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: rgba(235, 240, 255, 0.92);
    pointer-events: none;
    text-shadow: 0 2px 18px rgba(0,0,0,0.6);
  }
  .overlay h1 {
    font-size: 22px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff8fd0, #9fd0ff 60%, #b9a6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .overlay p {
    margin-top: 6px; font-size: 12.5px; font-weight: 400;
    letter-spacing: 0.04em; color: rgba(200, 212, 240, 0.66);
    max-width: 320px; line-height: 1.5;
  }
  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 5; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 12px; letter-spacing: 0.08em; color: rgba(190, 205, 235, 0.5);
    pointer-events: none; text-align: center;
    transition: opacity 1.2s ease; opacity: 1;
  }
  .hint.fade { opacity: 0; }
  .vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 42%, transparent 52%, rgba(2,3,8,0.55) 100%);
  }
  kbd {
    font-family: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: rgba(220,230,250,0.85);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>
<div class="overlay">
  <h1>Silk</h1>
  <p>A verlet-integrated cloth drifting in a living wind. Drag to gather it, sweep the cursor to stir the air, pull hard to tear.</p>
</div>
<div class="hint" id="hint">
  <kbd>drag</kbd> gather &nbsp;·&nbsp; <kbd>move</kbd> stir &nbsp;·&nbsp; <kbd>R</kbd> reset &nbsp;·&nbsp; <kbd>W</kbd> wind
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });
  const hint = document.getElementById("hint");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    f = Math.max(W, H) * 0.92;
  }

  // ---- simulation grid ----
  const COLS = 46, ROWS = 33;
  const N = COLS * ROWS;
  const clothW = 2.5, clothH = 1.75;
  const topY = 0.95;

  const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
  const ox = new Float32Array(N), oy = new Float32Array(N), oz = new Float32Array(N);
  const pinned = new Uint8Array(N);

  // projected / view-space caches
  const sx = new Float32Array(N), sy = new Float32Array(N);
  const vz = new Float32Array(N);   // view-space z (before camera distance) for normal + depth

  const idx = (i, j) => j * COLS + i;

  function initCloth() {
    for (let j = 0; j < ROWS; j++) {
      for (let i = 0; i < COLS; i++) {
        const k = idx(i, j);
        const x = (i / (COLS - 1) - 0.5) * clothW;
        const y = topY - (j / (ROWS - 1)) * clothH;
        const z = (Math.random() - 0.5) * 0.02;
        px[k] = ox[k] = x;
        py[k] = oy[k] = y;
        pz[k] = oz[k] = z;
        pinned[k] = (j === 0) ? 1 : 0;   // top row hangs
      }
    }
  }
  initCloth();

  // ---- constraints ----
  const cA = [], cB = [], cRest = [], cAlive = [];
  function addConstraint(a, b) {
    const dx = px[a] - px[b], dy = py[a] - py[b], dz = pz[a] - pz[b];
    const rest = Math.sqrt(dx*dx + dy*dy + dz*dz);
    cA.push(a); cB.push(b); cRest.push(rest); cAlive.push(1);
  }
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const k = idx(i, j);
      if (i < COLS - 1) addConstraint(k, idx(i + 1, j));       // structural h
      if (j < ROWS - 1) addConstraint(k, idx(i, j + 1));       // structural v
      if (i < COLS - 1 && j < ROWS - 1) {                       // shear
        addConstraint(k, idx(i + 1, j + 1));
        addConstraint(idx(i + 1, j), idx(i, j + 1));
      }
    }
  }
  const NC = cA.length;

  // ---- camera ----
  let f = 1000;
  const camDist = 4.2;
  const yaw = -0.16, pitch = 0.13;
  const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

  // view-space transform (rotate then push to camera distance)
  function toView(x, y, z, out) {
    // yaw about Y
    const x1 = x * cosY + z * sinY;
    const z1 = -x * sinY + z * cosY;
    // pitch about X
    const y2 = y * cosP - z1 * sinP;
    const z2 = y * sinP + z1 * cosP;
    out[0] = x1; out[1] = y2; out[2] = z2 + camDist;
  }

  // ---- physics state ----
  const GRAV = 0.00042;
  const DAMP = 0.986;
  const ITER = 3;
  const TEAR = 4.2;
  let windOn = true;
  let t = 0;

  function simulate() {
    t += 0.016;
    const gust = Math.sin(t * 0.7) * 0.5 + Math.sin(t * 1.7 + 1.3) * 0.32 + Math.sin(t * 0.27) * 0.4;
    const windZ = windOn ? (0.00018 + Math.max(0, gust) * 0.00030) : 0.0;

    for (let k = 0; k < N; k++) {
      if (pinned[k]) continue;
      // per-point wind ripple for organic motion
      const rip = windOn ? (0.55 + 0.45 * Math.sin(t * 2.1 + px[k] * 3.0 + py[k] * 2.2)) : 0;
      const az = windZ * rip;
      const ax = windOn ? 0.00006 * Math.sin(t * 1.3 + py[k] * 2.0) : 0;
      const ay = -GRAV;

      const nx = px[k] + (px[k] - ox[k]) * DAMP + ax;
      const ny = py[k] + (py[k] - oy[k]) * DAMP + ay;
      const nz = pz[k] + (pz[k] - oz[k]) * DAMP + az;

      ox[k] = px[k]; oy[k] = py[k]; oz[k] = pz[k];
      px[k] = nx; py[k] = ny; pz[k] = nz;
    }

    // grabbed point follows cursor target
    if (grab >= 0) {
      px[grab] = grabTX; py[grab] = grabTY; pz[grab] = grabTZ;
      ox[grab] = px[grab]; oy[grab] = py[grab]; oz[grab] = pz[grab];
    }

    for (let it = 0; it < ITER; it++) {
      for (let c = 0; c < NC; c++) {
        if (!cAlive[c]) continue;
        const a = cA[c], b = cB[c], rest = cRest[c];
        let dx = px[b] - px[a], dy = py[b] - py[a], dz = pz[b] - pz[a];
        const d = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1e-6;
        if (d > rest * TEAR) { cAlive[c] = 0; continue; }
        const diff = (d - rest) / d * 0.5;
        const mx = dx * diff, my = dy * diff, mz = dz * diff;
        const pa = pinned[a], pb = pinned[b];
        if (!pa && !pb) {
          px[a] += mx; py[a] += my; pz[a] += mz;
          px[b] -= mx; py[b] -= my; pz[b] -= mz;
        } else if (pa && !pb) {
          px[b] -= mx * 2; py[b] -= my * 2; pz[b] -= mz * 2;
        } else if (!pa && pb) {
          px[a] += mx * 2; py[a] += my * 2; pz[a] += mz * 2;
        }
      }
    }
  }

  // ---- projection ----
  const _v = [0, 0, 0];
  function projectAll() {
    const cx = W / 2, cy = H / 2;
    for (let k = 0; k < N; k++) {
      toView(px[k], py[k], pz[k], _v);
      const dz = _v[2];
      const s = f / (dz > 0.05 ? dz : 0.05);
      sx[k] = cx + _v[0] * s;
      sy[k] = cy - _v[1] * s;
      vz[k] = _v[2];
    }
  }

  // ---- lighting / color ----
  // light dir in view space (upper-left, from front)
  const Lx = -0.36, Ly = 0.58, Lz = -0.72;
  const Llen = Math.sqrt(Lx*Lx + Ly*Ly + Lz*Lz);
  const lx = Lx / Llen, ly = Ly / Llen, lz = Lz / Llen;
  // half vector with view (0,0,-1)
  let hx = lx, hy = ly, hz = lz - 1;
  const hl = Math.sqrt(hx*hx + hy*hy + hz*hz); hx/=hl; hy/=hl; hz/=hl;

  // base silk gradient colors
  function baseColor(u) {
    // u in 0..1 across width: magenta -> violet -> cyan
    let r, g, b;
    if (u < 0.5) {
      const tt = u / 0.5;
      r = 196 + (150 - 196) * tt;
      g = 38 + (120 - 38) * tt;
      b = 211 + (230 - 211) * tt;
    } else {
      const tt = (u - 0.5) / 0.5;
      r = 150 + (14 - 150) * tt;
      g = 120 + (165 - 120) * tt;
      b = 230 + (233 - 230) * tt;
    }
    return [r, g, b];
  }

  // quad list for painter sort
  const quads = [];
  for (let j = 0; j < ROWS - 1; j++) {
    for (let i = 0; i < COLS - 1; i++) {
      quads.push([idx(i, j), idx(i + 1, j), idx(i + 1, j + 1), idx(i, j + 1)]);
    }
  }
  const QN = quads.length;

  function render() {
    // background atmosphere
    const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#141a2e");
    g.addColorStop(0.45, "#0b0e1c");
    g.addColorStop(1, "#04050b");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft contact shadow on ground
    const shadowY = H * 0.80;
    const sg = ctx.createRadialGradient(W * 0.5, shadowY, 0, W * 0.5, shadowY, W * 0.42);
    sg.addColorStop(0, "rgba(0,0,0,0.34)");
    sg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.ellipse(W * 0.5, shadowY, W * 0.40, H * 0.10, 0, 0, Math.PI * 2);
    ctx.fill();

    // build depth-sorted draw list (farthest first)
    const draw = [];
    for (let q = 0; q < QN; q++) {
      const c = quads[q];
      const depth = (vz[c[0]] + vz[c[1]] + vz[c[2]] + vz[c[3]]) * 0.25;
      draw.push([depth, q]);
    }
    draw.sort((a, b) => b[0] - a[0]);

    for (let di = 0; di < draw.length; di++) {
      const c = quads[draw[di][1]];
      const a = c[0], b = c[1], d = c[2], e = c[3];

      // view-space corners for normal
      toView(px[a], py[a], pz[a], _v); const a0=_v[0],a1=_v[1],a2=_v[2];
      toView(px[b], py[b], pz[b], _v); const b0=_v[0],b1=_v[1],b2=_v[2];
      toView(px[d], py[d], pz[d], _v); const d0=_v[0],d1=_v[1],d2=_v[2];
      toView(px[e], py[e], pz[e], _v); const e0=_v[0],e1=_v[1],e2=_v[2];

      // normal via cross of two edges
      const ux = d0 - a0, uy = d1 - a1, uz = d2 - a2;
      const wx = e0 - b0, wy = e1 - b1, wz = e2 - b2;
      let nx = uy * wz - uz * wy;
      let ny = uz * wx - ux * wz;
      let nz = ux * wy - uy * wx;
      const nl = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1e-6;
      nx /= nl; ny /= nl; nz /= nl;
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; } // face camera

      const diff = Math.max(0, nx * lx + ny * ly + nz * lz);
      const spec = Math.pow(Math.max(0, nx * hx + ny * hy + nz * hz), 22);
      const amb = 0.34;
      const bright = amb + diff * 0.78 + spec * 0.9;

      // base color by horizontal uv of cell center
      const u = (sx[a] + sx[b] + sx[d] + sx[e]) / (4 * W);
      const bc = baseColor(Math.min(1, Math.max(0, u)));
      let r = bc[0] * bright + 255 * spec * 0.5;
      let gg = bc[1] * bright + 255 * spec * 0.5;
      let bb = bc[2] * bright + 255 * spec * 0.5;
      r = r < 0 ? 0 : r > 255 ? 255 : r;
      gg = gg < 0 ? 0 : gg > 255 ? 255 : gg;
      bb = bb < 0 ? 0 : bb > 255 ? 255 : bb;

      ctx.beginPath();
      ctx.moveTo(sx[a], sy[a]);
      ctx.lineTo(sx[b], sy[b]);
      ctx.lineTo(sx[d], sy[d]);
      ctx.lineTo(sx[e], sy[e]);
      ctx.closePath();
      ctx.fillStyle = "rgb(" + (r|0) + "," + (gg|0) + "," + (bb|0) + ")";
      ctx.fill();
    }
  }

  // ---- interaction ----
  let grab = -1;
  let grabTX = 0, grabTY = 0, grabTZ = 0;
  let pointerX = -1, pointerY = -1, down = false;
  let lastMoveX = 0, lastMoveY = 0;

  function nearestPoint(screenX, screenY, maxR) {
    let best = -1, bestD = maxR * maxR;
    for (let k = 0; k < N; k++) {
      const dx = sx[k] - screenX, dy = sy[k] - screenY;
      const dd = dx*dx + dy*dy;
      if (dd < bestD) { bestD = dd; best = k; }
    }
    return best;
  }

  function setGrabTargetFromScreen(screenX, screenY) {
    // incremental inverse: move grabbed point so its projection approaches cursor
    const k = grab;
    const currentS = f / (vz[k] > 0.05 ? vz[k] : 0.05);
    const ex = screenX - sx[k];
    const ey = screenY - sy[k];
    // view-space delta (z fixed)
    const vdx = ex / currentS;
    const vdy = -ey / currentS;
    // rotate view-space delta back to world (transpose of toView rotation, ignoring translation)
    // inverse yaw then inverse pitch
    // world = R^-1 * view_delta ; R = pitch * yaw
    // undo pitch: x1 = vdx ; y1 = vdy*cosP + vdz*sinP ; z1 = -vdy*sinP + vdz*cosP  (vdz=0)
    const x1 = vdx;
    const y1 = vdy * cosP;
    const z1 = -vdy * sinP;
    // undo yaw: x = x1*cosY - z1*sinY ; y = y1 ; z = x1*sinY + z1*cosY
    const wx = x1 * cosY - z1 * sinY;
    const wy = y1;
    const wz = x1 * sinY + z1 * cosY;
    grabTX = px[k] + wx;
    grabTY = py[k] + wy;
    grabTZ = pz[k] + wz;
  }

  canvas.addEventListener("pointerdown", (ev) => {
    down = true;
    pointerX = ev.clientX; pointerY = ev.clientY;
    lastMoveX = ev.clientX; lastMoveY = ev.clientY;
    const k = nearestPoint(ev.clientX, ev.clientY, 46);
    if (k >= 0) { grab = k; grabTX = px[k]; grabTY = py[k]; grabTZ = pz[k]; }
    hint.classList.add("fade");
  });

  canvas.addEventListener("pointermove", (ev) => {
    const mx = ev.clientX, my = ev.clientY;
    if (down && grab >= 0) {
      setGrabTargetFromScreen(mx, my);
    } else {
      // stir the air: push nearest point away in z
      const k = nearestPoint(mx, my, 60);
      if (k >= 0 && !pinned[k]) {
        const dx = mx - lastMoveX, dy = my - lastMoveY;
        const speed = Math.min(1, Math.sqrt(dx*dx + dy*dy) / 30);
        pz[k] += (0.06 + speed * 0.12);
        ox[k] -= (dx) * 0.002;
      }
    }
    lastMoveX = mx; lastMoveY = my;
    pointerX = mx; pointerY = my;
  });

  window.addEventListener("pointerup", () => { down = false; grab = -1; });
  canvas.addEventListener("pointerleave", () => { if (!down) grab = -1; });

  window.addEventListener("keydown", (ev) => {
    const kk = ev.key.toLowerCase();
    if (kk === "r") { initCloth(); for (let c = 0; c < NC; c++) cAlive[c] = 1; t = 0; }
    if (kk === "w") { windOn = !windOn; }
  });

  // ---- main loop ----
  function frame() {
    simulate();
    projectAll();
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  // warm up so initial frame is lively
  for (let i = 0; i < 40; i++) { simulate(); }
  setTimeout(() => hint.classList.add("fade"), 6000);
  frame();
})();
</script>
</body>
</html>
