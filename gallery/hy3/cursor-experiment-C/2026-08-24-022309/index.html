<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Aurora — A Cursor Experiment</title>
<style>
  :root {
    --ink: #e8ecff;
    --muted: rgba(232, 236, 255, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    cursor: none;
    font-family: "Inter", "Helvetica Neue", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
  }
  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .title {
    position: absolute;
    top: clamp(20px, 5vh, 48px);
    left: clamp(20px, 5vw, 56px);
    color: var(--ink);
    letter-spacing: 0.22em;
    font-size: clamp(11px, 1.4vw, 14px);
    font-weight: 600;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .title small {
    display: block;
    margin-top: 8px;
    font-weight: 400;
    letter-spacing: 0.34em;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .hint {
    position: absolute;
    bottom: clamp(20px, 5vh, 44px);
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    transition: opacity 1.2s ease;
    text-align: center;
    white-space: nowrap;
  }
  .hint b {
    color: var(--ink);
    font-weight: 600;
  }
  .hint.fade { opacity: 0; }
  .readout {
    position: absolute;
    bottom: clamp(20px, 5vh, 44px);
    right: clamp(20px, 5vw, 56px);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-align: right;
    line-height: 1.7;
  }
  .readout span { color: var(--ink); }
  .grain {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(120% 120% at 50% 45%, transparent 38%, rgba(2,3,10,0.55) 78%, rgba(1,1,6,0.9) 100%);
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="overlay">
    <div class="title">Aurora<small>a cursor experiment</small></div>
    <div class="hint" id="hint"><b>move</b> to gather light &nbsp;·&nbsp; <b>click</b> to release it</div>
    <div class="readout">
      <div>flow <span id="rSpeed">0</span></div>
      <div>field <span id="rCount">0</span></div>
      <div>hue <span id="rHue">0°</span></div>
    </div>
  </div>
  <div class="vignette"></div>
  <div class="grain"></div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let sprites = [];
  const HUE_STEPS = 60;

  // Cursor state (smoothed) + raw target
  const cursor = { x: 0, y: 0, tx: 0, ty: 0, px: 0, py: 0, vx: 0, vy: 0, speed: 0 };
  const trail = [];
  const TRAIL_LEN = 26;

  // Tunable feel
  const cfg = {
    influence: 250,
    pull: 0.85,
    swirl: 0.55,
    home: 0.0009,
    damping: 0.905,
    fade: 0.10,        // background fade per frame (trail persistence)
    burstR: 320,
    burst: 14,
    energy: 0,         // decays after click
  };

  let baseHue = 205;    // drifting palette anchor

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildField();
  }

  function makeGlow(hue) {
    const s = 64;
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0.0, `hsla(${hue},100%,82%,1)`);
    grad.addColorStop(0.18, `hsla(${hue},100%,68%,0.85)`);
    grad.addColorStop(0.45, `hsla(${hue},95%,58%,0.28)`);
    grad.addColorStop(1.0, `hsla(${hue},95%,52%,0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  }

  function buildSprites() {
    sprites = [];
    for (let i = 0; i < HUE_STEPS; i++) {
      sprites.push(makeGlow(Math.round((i / HUE_STEPS) * 360)));
    }
  }

  function spriteFor(hue) {
    let h = ((hue % 360) + 360) % 360;
    let idx = Math.round((h / 360) * HUE_STEPS) % HUE_STEPS;
    return sprites[idx];
  }

  function buildField() {
    const target = Math.round(Math.min(1100, Math.max(420, (W * H) / 1500)));
    particles = [];
    for (let i = 0; i < target; i++) {
      const hx = Math.random() * W;
      const hy = Math.random() * H;
      particles.push({
        x: hx, y: hy, hx, hy,
        vx: 0, vy: 0,
        size: 6 + Math.random() * 14,
        hueOffset: (Math.random() - 0.5) * 70,
        alpha: 0.35 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function burst(mx, my) {
    cfg.energy = 1;
    const dirx = mx - cursor.x, diry = my - cursor.y;
    const d = Math.hypot(dirx, diry) || 1;
    for (const p of particles) {
      const dx = p.x - mx, dy = p.y - my;
      const dist = Math.hypot(dx, dy);
      if (dist < cfg.burstR) {
        const f = (1 - dist / cfg.burstR);
        const nx = dist > 0 ? dx / dist : 0;
        const ny = dist > 0 ? dy / dist : 0;
        const imp = f * cfg.burst;
        p.vx += nx * imp;
        p.vy += ny * imp;
      }
    }
  }

  // ---- input ----
  function setTarget(x, y) {
    cursor.tx = x;
    cursor.ty = y;
    if (cursor.x === 0 && cursor.y === 0) { cursor.x = x; cursor.y = y; }
  }
  window.addEventListener("pointermove", (e) => setTarget(e.clientX, e.clientY), { passive: true });
  window.addEventListener("pointerdown", (e) => { setTarget(e.clientX, e.clientY); burst(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener("pointerleave", () => {});

  const hint = document.getElementById("hint");
  let hintTimer = setTimeout(() => hint.classList.add("fade"), 5200);

  const rSpeed = document.getElementById("rSpeed");
  const rCount = document.getElementById("rCount");
  const rHue = document.getElementById("rHue");

  // ---- loop ----
  let last = performance.now();
  let frame = 0;

  function step(now) {
    const dt = Math.min(2, (now - last) / 16.67);
    last = now;
    frame++;

    // smooth cursor
    cursor.px = cursor.x; cursor.py = cursor.y;
    cursor.x += (cursor.tx - cursor.x) * 0.18 * dt;
    cursor.y += (cursor.ty - cursor.y) * 0.18 * dt;
    cursor.vx = cursor.x - cursor.px;
    cursor.vy = cursor.y - cursor.py;
    cursor.speed = Math.hypot(cursor.vx, cursor.vy);

    // trail
    trail.push({ x: cursor.x, y: cursor.y, s: cursor.speed });
    if (trail.length > TRAIL_LEN) trail.shift();

    baseHue += 0.18 * dt + cursor.speed * 0.04;
    cfg.energy *= 0.94;

    // fade background -> persistence / comet trails
    ctx.globalCompositeOperation = "source-over";
    const fb = Math.max(0.06, cfg.fade - cursor.speed * 0.004);
    ctx.fillStyle = `rgba(5, 6, 16, ${fb.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);

    // soft atmospheric aura around cursor
    ctx.globalCompositeOperation = "lighter";
    const aura = spriteFor(baseHue + 30);
    const auraSize = 420 + cursor.speed * 12 + cfg.energy * 160;
    ctx.globalAlpha = 0.22 + cfg.energy * 0.18;
    ctx.drawImage(aura, cursor.x - auraSize / 2, cursor.y - auraSize / 2, auraSize, auraSize);

    // particles
    const R = cfg.influence + cfg.energy * 90;
    const pull = cfg.pull + cfg.energy * 0.6;
    for (const p of particles) {
      const dx = cursor.x - p.x, dy = cursor.y - p.y;
      const d = Math.hypot(dx, dy) + 0.001;
      if (d < R) {
        const f = 1 - d / R;
        const nx = dx / d, ny = dy / d;
        const force = f * f * pull;
        p.vx += nx * force * dt;
        p.vy += ny * force * dt;
        p.vx += -ny * force * cfg.swirl * dt;
        p.vy += nx * force * cfg.swirl * dt;
      }
      // home spring keeps the field coherent
      p.vx += (p.hx - p.x) * cfg.home * dt;
      p.vy += (p.hy - p.y) * cfg.home * dt;
      // gentle drift
      p.phase += 0.01 * dt;
      p.vx += Math.cos(p.phase) * 0.01;
      p.vy += Math.sin(p.phase * 1.3) * 0.01;

      p.vx *= Math.pow(cfg.damping, dt);
      p.vy *= Math.pow(cfg.damping, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const sp = Math.hypot(p.vx, p.vy);
      const hue = baseHue + p.hueOffset + sp * 6;
      const sp2 = spriteFor(hue);
      const sz = p.size * (1 + Math.min(1.4, sp * 0.18) + cfg.energy * 0.3);
      let a = p.alpha + Math.min(0.5, sp * 0.05) + cfg.energy * 0.2;
      if (a > 1) a = 1;
      ctx.globalAlpha = a;
      ctx.drawImage(sp2, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }

    // cursor trail ribbon
    ctx.globalCompositeOperation = "lighter";
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      const t = i / trail.length;
      ctx.globalAlpha = t * 0.5;
      ctx.strokeStyle = `hsl(${Math.round(baseHue + 40)}, 100%, ${60 + t * 20}%)`;
      ctx.lineWidth = t * (10 + b.s * 0.6);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // bright cursor core
    const core = spriteFor(baseHue + 50);
    const cs = 70 + cfg.energy * 40;
    ctx.globalAlpha = 0.95;
    ctx.drawImage(core, cursor.x - cs / 2, cursor.y - cs / 2, cs, cs);
    // crisp ring
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = `hsla(${Math.round(baseHue + 50)}, 100%, 88%, 0.9)`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(cursor.x, cursor.y, 6 + cfg.energy * 4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 1;

    // readout (throttled)
    if (frame % 6 === 0) {
      rSpeed.textContent = Math.round(cursor.speed);
      rCount.textContent = particles.length;
      rHue.textContent = Math.round(((baseHue % 360) + 360) % 360) + "°";
    }

    requestAnimationFrame(step);
  }

  buildSprites();
  resize();
  window.addEventListener("resize", resize);
  // seed cursor at center so first frames aren't empty
  cursor.x = cursor.y = cursor.tx = cursor.ty = W / 2;
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
