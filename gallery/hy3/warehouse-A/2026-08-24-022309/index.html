<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Simulation</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --in:#3fb950; --out:#f778ba; --pkg:#d29922; --worker:#1f6feb;
    --line:#30363d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;
  }
  header{padding:14px 16px 6px;text-align:center}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .wrap{width:min(960px,96vw);padding:8px}
  .stage{
    position:relative;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:linear-gradient(180deg,#10141b,#0c0f14)
  }
  canvas{display:block;width:100%;height:auto}
  .hud{
    position:absolute;top:8px;left:8px;display:flex;gap:8px;flex-wrap:wrap;
    pointer-events:none
  }
  .chip{
    background:rgba(22,27,34,.82);border:1px solid var(--line);border-radius:8px;
    padding:4px 9px;font-size:12px;color:var(--ink)
  }
  .chip b{color:var(--accent)}
  .controls{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px
  }
  button{
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 13px;cursor:pointer;font:inherit;font-size:13px
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--worker);border-color:var(--worker)}
  .controls label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  input[type=range]{accent-color:var(--accent)}
  .legend{
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:10px 0 18px;
    color:var(--muted);font-size:12px
  }
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<header>
  <h1>Warehouse Simulation</h1>
  <p>Workers move packages from incoming trucks to outgoing trucks</p>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="cv" width="940" height="500"></canvas>
    <div class="hud">
      <div class="chip">Incoming queue: <b id="hIn">0</b></div>
      <div class="chip">On belt: <b id="hBelt">0</b></div>
      <div class="chip">Delivered: <b id="hOut">0</b></div>
      <div class="chip">Shipped: <b id="hShip">0</b></div>
    </div>
  </div>

  <div class="controls">
    <button id="play" class="primary">Pause</button>
    <button id="add">Add worker</button>
    <button id="spawn">Send truck</button>
    <label>Speed <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1"><b id="spd">1.0×</b></label>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--in)"></i>Incoming truck</span>
    <span><i class="dot" style="background:var(--out)"></i>Outgoing truck</span>
    <span><i class="dot" style="background:var(--pkg)"></i>Package</span>
    <span><i class="dot" style="background:var(--worker)"></i>Worker</span>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  const inChk = {x: 18, y: H/2, w: 84, h: 120};          // incoming dock
  const outChk = {x: W-102, y: H/2, w: 84, h: 120};      // outgoing dock
  const belt = {x: 150, y: H/2-26, w: W-300, h: 52};     // conveyor staging

  let running = true;
  let speed = 1;
  let delivered = 0, shipped = 0;

  const rnd = (a,b)=>a+Math.random()*(b-a);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  // ---- Trucks ----
  class Truck {
    constructor(kind){
      this.kind = kind; // 'in' | 'out'
      this.active = true;
      this.cap = kind==='in'? 8 : 12;
      this.load = 0;
      this.x = kind==='in' ? -90 : W+10;
      this.target = kind==='in' ? inChk.x-78 : outChk.x+18;
      this.speed = 70;
      this.t = 0;
      this.color = kind==='in' ? '#3fb950' : '#f778ba';
    }
    update(dt){
      this.t += dt;
      if(this.x < this.target){ this.x += this.speed*dt; }
      else if(this.x > this.target){ this.x -= this.speed*dt; }
      this.x = Math.max(Math.min(this.x, W+10),-90);
    }
    draw(){
      const y = (this.kind==='in'?inChk.y:outChk.y)-4;
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, y, 78, 110);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(this.x+8, y+14, 62, 60); // cargo box
      ctx.fillStyle = '#0e1117';
      ctx.fillRect(this.x-12, y+20, 14, 22); // cab
      // wheels
      ctx.fillStyle = '#0b0d12';
      ctx.beginPath();ctx.arc(this.x+18,y+110,9,0,7);ctx.arc(this.x+60,y+110,9,0,7);ctx.fill();
      // load meter
      ctx.fillStyle = '#0e1117';
      ctx.fillRect(this.x+4, y-10, 70, 6);
      ctx.fillStyle = '#e6edf3';
      ctx.fillRect(this.x+4, y-10, 70*(this.load/this.cap), 6);
    }
  }

  // ---- Packages ----
  class Package {
    constructor(x,y){
      this.x=x; this.y=y; this.r=11;
      this.held=null;            // worker holding it
      this.onBelt=false; this.bx=0; // belt position 0..1
      this.hue = pick(['#d29922','#e3b341','#bb8009','#f0c674']);
      this.state='incoming';     // incoming -> belt -> carried -> shipped
    }
    draw(){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.fillStyle=this.hue;
      ctx.fillRect(-this.r,-this.r,this.r*2,this.r*2);
      ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;
      ctx.strokeRect(-this.r,-this.r,this.r*2,this.r*2);
      ctx.beginPath();ctx.moveTo(-this.r,-this.r);ctx.lineTo(this.r,this.r);
      ctx.moveTo(this.r,-this.r);ctx.lineTo(-this.r,this.r);ctx.stroke();
      ctx.restore();
    }
  }

  // ---- Workers ----
  class Worker {
    constructor(i){
      this.id=i;
      this.x = rnd(belt.x+40, belt.x+belt.w-40);
      this.y = rnd(60, H-90);
      this.state='idle';       // idle, toBelt, carry, toOut
      this.pkg=null;
      this.tx=0; this.ty=0;
      this.color='#1f6feb';
      this.speed=95;
    }
    go(tx,ty,next){ this.tx=tx;this.ty=ty;this.next=next; }
    update(dt){
      if(this.state==='idle'){
        // seek nearest belt package
        const free = beltPkgs.filter(p=>p.state==='belt' && !p.held);
        if(free.length){
          free.sort((a,b)=>dist(this,a)-dist(this,b));
          const p=free[0];
          this.pkg=p; p.held=this;
          this.go(p.x,p.y+14,'grab');
          this.state='toBelt';
        } else {
          // wander gently
          this.go(this.x+rnd(-30,30), this.y+rnd(-25,25), 'idle');
          this.state='idle';
        }
        return;
      }
      const d = Math.hypot(this.tx-this.x, this.ty-this.y);
      const step = this.speed*dt;
      if(d>step){
        this.x += (this.tx-this.x)/d*step;
        this.y += (this.ty-this.y)/d*step;
      } else { this.x=this.tx; this.y=this.ty; this.state=this.next; this.next=null; }

      if(this.pkg){ this.pkg.x=this.x; this.pkg.y=this.y-12; }

      if(this.state==='grab'){
        const p=this.pkg; p.state='carried';
        this.go(outChk.x-40, outChk.y-20, 'drop'); this.state='toOut';
      }
      if(this.state==='drop'){
        const p=this.pkg;
        delivered++;
        // try to load onto an outgoing truck near dock
        const t = outTrucks.find(t=>t.active);
        if(t){ t.load++; if(t.load>=t.cap){ t.active=false; shipped++; } }
        p.state='done';
        this.pkg=null; this.state='idle';
      }
    }
    draw(){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.fillStyle=this.color;
      ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';
      ctx.fillText('W'+this.id,0,-13);
      ctx.restore();
    }
  }

  function dist(w,p){ return Math.hypot(w.x-p.x,w.y-p.y); }

  // ---- World state ----
  let inTrucks=[], outTrucks=[], beltPkgs=[], workers=[];
  for(let i=0;i<4;i++) workers.push(new Worker(i+1));

  function spawnIn(){
    const t=new Truck('in'); inTrucks.push(t);
    // after arrival, drip packages to belt
    return t;
  }
  function spawnOut(){
    const t=new Truck('out'); outTrucks.push(t); return t;
  }
  spawnOut(); spawnOut();

  let inTimer=0.5, dripTimers=[];
  // manage arrivals
  function updateTrucks(dt){
    inTrucks.forEach(t=>{
      if(t.active){
        if(Math.abs(t.x-t.target)<2 && t.load<t.cap){
          // drip packages
          t._drip=(t._drip||0)+dt;
          if(t._drip>0.45){
            t._drip=0; t.load++;
            const p=new Package(inChk.x+10, inChk.y+ rnd(-30,30));
            p.state='incoming'; beltPkgs.push(p);
            p._from=t;
          }
        }
        if(t.load>=t.cap && Math.abs(t.x-t.target)<2){
          t.active=false; // leaves
        }
      }
    });
    outTrucks.forEach(t=>{ if(!t.active){} });
    // remove emptied/cap trucks that have left
    inTrucks = inTrucks.filter(t=> t.active || t.x>-90 );
    outTrucks = outTrucks.filter(t=> t.active || t.x<W+10 );
  }

  // move incoming packages onto belt
  function updatePackages(dt){
    beltPkgs = beltPkgs.filter(p=>p.state!=='done');
    for(const p of beltPkgs){
      if(p.state==='incoming'){
        const d=Math.hypot(belt.x+10-p.x, belt.y+belt.h/2-p.y);
        const s=110*dt;
        if(d>s){ p.x+=(belt.x+10-p.x)/d*s; p.y+=(belt.y+belt.h/2-p.y)/d*s; }
        else { p.x=belt.x+10; p.y=belt.y+belt.h/2; p.state='belt'; p.bx=0; }
      } else if(p.state==='belt' && !p.held){
        // slowly advance along belt toward workers' reach (right end)
        p.x += 24*dt;
        if(p.x > belt.x+belt.w-20){ p.x = belt.x+belt.w-20; }
      }
    }
    // workers carry; remove delivered that are gone
  }

  // ---- Drawing ----
  function drawFloor(){
    ctx.fillStyle='#0c0f14'; ctx.fillRect(0,0,W,H);
    // floor grid
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
    for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // docks
    drawDock(inChk,'INCOMING', var_c('--in'));
    drawDock(outChk,'OUTGOING', var_c('--out'));

    // belt
    ctx.fillStyle='#1b2230';
    ctx.fillRect(belt.x,belt.y,belt.w,belt.h);
    ctx.strokeStyle='#2b3342';ctx.lineWidth=2;
    ctx.strokeRect(belt.x,belt.y,belt.w,belt.h);
    // rollers
    ctx.strokeStyle='rgba(255,255,255,.08)';
    for(let x=belt.x+14;x<belt.x+belt.w;x+=22){
      ctx.beginPath();ctx.moveTo(x,belt.y);ctx.lineTo(x,belt.y+belt.h);ctx.stroke();
    }
    ctx.fillStyle='var(--muted)';ctx.fillStyle='#8b949e';
    ctx.font='10px monospace';ctx.textAlign='left';
    ctx.fillText('CONVEYOR →', belt.x+4, belt.y-6);
  }
  function var_c(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  function drawDock(d,label,color){
    ctx.fillStyle='rgba(255,255,255,.04)';
    ctx.fillRect(d.x-10,d.y-d.h/2-10,d.w+20,d.h+20);
    ctx.strokeStyle=color;ctx.lineWidth=2;
    ctx.strokeRect(d.x-10,d.y-d.h/2-10,d.w+20,d.h+20);
    ctx.fillStyle=color;ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(label, d.x+d.w/2, d.y-d.h/2-16);
  }

  // ---- Loop ----
  let last=performance.now();
  function frame(now){
    const dt0=Math.min(0.05,(now-last)/1000); last=now;
    const dt = dt0*speed;

    if(running){
      // arrival scheduler
      inTimer-=dt;
      if(inTimer<=0){ inTimer=rnd(5,9); spawnIn(); }

      updateTrucks(dt);
      updatePackages(dt);
      workers.forEach(w=>w.update(dt));

      // keep at least one outgoing truck ready
      if(!outTrucks.some(t=>t.active)) spawnOut();

      // HUD
      document.getElementById('hIn').textContent = inTrucks.filter(t=>t.active).length + inTrucks.reduce((s,t)=>s+t.load,0);
      document.getElementById('hBelt').textContent = beltPkgs.filter(p=>p.state==='belt').length;
      document.getElementById('hOut').textContent = delivered;
      document.getElementById('hShip').textContent = shipped;
    }

    drawFloor();
    inTrucks.forEach(t=>t.draw());
    outTrucks.forEach(t=>t.draw());
    beltPkgs.forEach(p=>{ if(p.state!=='carried'||true) p.draw(); });
    workers.forEach(w=>w.draw());

    requestAnimationFrame(frame);
  }

  // ---- Controls ----
  document.getElementById('play').onclick=e=>{
    running=!running; e.target.textContent=running?'Pause':'Play';
    last=performance.now();
  };
  document.getElementById('add').onclick=()=>{
    if(workers.length<10) workers.push(new Worker(workers.length+1));
  };
  document.getElementById('spawn').onclick=()=>spawnIn();
  const sp=document.getElementById('speed');
  sp.oninput=()=>{ speed=parseFloat(sp.value); document.getElementById('spd').textContent=speed.toFixed(1)+'×'; };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
