<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Network Topology — Living Mesh</title>
<style>
  :root {
    --bg0: #05070d;
    --bg1: #0a0f1c;
    --ink: #cfe3ff;
    --muted: #6c83a8;
    --core: #ffce4d;
    --router: #4dd0ff;
    --server: #7cf2a8;
    --client: #b78bff;
    --edge: #ff7a9c;
    --grid: rgba(80,120,180,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: block; }

  /* Vignette + ambient glow */
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 38%, rgba(20,40,80,0.25), transparent 60%),
      radial-gradient(140% 120% at 50% 120%, rgba(40,10,60,0.35), transparent 55%);
    mix-blend-mode: screen;
  }

  .hud {
    position: fixed; pointer-events: none;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  }
  .title {
    top: 26px; left: 30px;
  }
  .title h1 {
    margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.06em;
    color: #eaf3ff;
  }
  .title p {
    margin: 4px 0 0; font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em;
  }
  .legend {
    bottom: 24px; left: 30px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .legend .row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend .dot {
    width: 11px; height: 11px; border-radius: 50%;
    box-shadow: 0 0 10px currentColor; background: currentColor;
  }
  .stats {
    top: 26px; right: 30px; text-align: right;
    font-size: 12px; color: var(--muted); line-height: 1.7;
  }
  .stats b { color: var(--ink); font-weight: 600; }

  .panel {
    bottom: 24px; right: 30px;
    display: flex; gap: 8px; pointer-events: auto;
  }
  .panel button {
    pointer-events: auto;
    background: rgba(20,32,56,0.7);
    border: 1px solid rgba(90,130,190,0.35);
    color: var(--ink);
    font: inherit; font-size: 12px;
    padding: 7px 13px; border-radius: 8px; cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .18s, border-color .18s, transform .1s;
  }
  .panel button:hover { background: rgba(35,55,95,0.85); border-color: rgba(120,170,240,0.6); }
  .panel button:active { transform: translateY(1px); }
  .panel button.on { background: rgba(60,120,190,0.85); border-color: rgba(150,200,255,0.9); }

  .tip {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%);
    font-size: 11.5px; color: var(--muted); letter-spacing: 0.05em;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  .tip.show { opacity: 0.85; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>

  <div class="hud title">
    <h1>LIVING MESH</h1>
    <p>complex computer network · force-directed · live traffic</p>
  </div>

  <div class="hud stats" id="stats">
    <div>nodes <b id="s-nodes">0</b></div>
    <div>links <b id="s-links">0</b></div>
    <div>packets/s <b id="s-pkt">0</b></div>
    <div>load <b id="s-load">0%</b></div>
  </div>

  <div class="hud legend">
    <div class="row" style="color:var(--core)"><span class="dot"></span> core gateway</div>
    <div class="row" style="color:var(--router)"><span class="dot"></span> router / switch</div>
    <div class="row" style="color:var(--server)"><span class="dot"></span> server</div>
    <div class="row" style="color:var(--client)"><span class="dot"></span> client / host</div>
    <div class="row" style="color:var(--edge)"><span class="dot"></span> edge / firewall</div>
  </div>

  <div class="hud panel">
    <button id="b-traffic" class="on">Traffic</button>
    <button id="b-labels" class="on">Labels</button>
    <button id="b-pulse" class="on">Pulse</button>
    <button id="b-reset">Reset</button>
  </div>

  <div class="tip" id="tip">drag nodes · scroll to zoom · hover to inspect</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Node types ----
  const TYPES = {
    core:    { color: "#ffce4d", r: 13, label: "core" },
    router:  { color: "#4dd0ff", r: 9,  label: "router" },
    server:  { color: "#7cf2a8", r: 10, label: "server" },
    client:  { color: "#b78bff", r: 6,  label: "client" },
    edge:    { color: "#ff7a9c", r: 8,  label: "edge" },
  };

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  let nodes = [], links = [], packets = [];
  let view = { x: 0, y: 0, s: 1, tx: 0, ty: 0, ts: 1 };
  let hover = null, drag = null, dragMoved = false;

  const opts = { traffic: true, labels: true, pulse: true };

  // ---- Build a believable complex network ----
  function build() {
    nodes = []; links = []; packets = [];
    const add = (type, cluster) => {
      const n = {
        id: nodes.length,
        type,
        cluster: cluster || 0,
        x: rnd(-W / 2, W / 2),
        y: rnd(-H / 2, H / 2),
        vx: 0, vy: 0,
        r: TYPES[type].r,
        color: TYPES[type].color,
        load: rnd(0.15, 0.55),
        phase: rnd(0, Math.PI * 2),
        pulse: 0,
      };
      nodes.push(n);
      return n;
    };
    const link = (a, b) => {
      if (a === b) return;
      links.push({ a, b, w: rnd(0.4, 1), flow: rnd(0.2, 0.8), hot: 0 });
    };

    const CORES = 2;
    const CLUSTERS = 5;
    const coreNodes = [];
    for (let i = 0; i < CORES; i++) coreNodes.push(add("core"));

    const clusterHeads = [];
    for (let c = 0; c < CLUSTERS; c++) {
      const head = add("router", c);
      clusterHeads.push(head);
      // connect head to a core (mesh cores)
      link(head.id, c === 0 ? coreNodes[1].id : coreNodes[(Math.random() < 0.5 ? 0 : 1)].id);
    }
    // interconnect routers (backbone ring + cross)
    for (let c = 0; c < CLUSTERS; c++) {
      link(clusterHeads[c].id, clusterHeads[(c + 1) % CLUSTERS].id);
      if (Math.random() < 0.4) link(clusterHeads[c].id, clusterHeads[(c + 2) % CLUSTERS].id);
    }
    // a couple of edge firewalls guarding cores
    const edges = [];
    for (let i = 0; i < 3; i++) {
      const e = add("edge");
      edges.push(e);
      link(e.id, coreNodes[i % CORES].id);
      if (Math.random() < 0.5) link(e.id, clusterHeads[(i * 2) % CLUSTERS].id);
    }

    // sub-routers + servers + clients per cluster
    for (let c = 0; c < CLUSTERS; c++) {
      const head = clusterHeads[c];
      const subRouters = 2 + ((Math.random() * 2) | 0);
      const subs = [];
      for (let k = 0; k < subRouters; k++) {
        const s = add("router", c);
        subs.push(s);
        link(head.id, s.id);
        // server farms under sub-router
        const servers = 1 + ((Math.random() * 3) | 0);
        for (let j = 0; j < servers; j++) {
          const sv = add("server", c);
          link(s.id, sv.id);
        }
        // clients under sub-router
        const clients = 2 + ((Math.random() * 4) | 0);
        for (let j = 0; j < clients; j++) {
          const cl = add("client", c);
          link(s.id, cl.id);
          if (Math.random() < 0.18) link(cl.id, pick(subs).id); // peer link
        }
      }
    }

    // a few long-haul cross-cluster server links (datacenter replication)
    const servers = nodes.filter(n => n.type === "server");
    for (let i = 0; i < 6; i++) {
      const a = pick(servers), b = pick(servers);
      if (a.cluster !== b.cluster) link(a.id, b.id);
    }

    document.getElementById("s-nodes").textContent = nodes.length;
    document.getElementById("s-links").textContent = links.length;
  }

  // ---- Force-directed layout ----
  function simulate() {
    const cx = 0, cy = 0;
    const REP = 4200, SPRING = 0.012, REST = 70, GRAV = 0.0016, DAMP = 0.86;
    // repulse
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy + 0.01;
        if (d2 > 90000) continue;
        const f = REP / d2;
        const d = Math.sqrt(d2);
        const fx = (dx / d) * f, fy = (dy / d) * f;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
      // gravity to center
      a.vx += (cx - a.x) * GRAV;
      a.vy += (cy - a.y) * GRAV;
    }
    // springs
    for (const l of links) {
      const a = nodes[l.a], b = nodes[l.b];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - REST) * SPRING * l.w;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
    for (const n of nodes) {
      if (drag && drag.node === n) { n.vx = 0; n.vy = 0; continue; }
      n.vx *= DAMP; n.vy *= DAMP;
      n.x += n.vx; n.y += n.vy;
    }
  }

  // ---- Packets travel along links ----
  function spawnPackets() {
    if (!opts.traffic) return;
    const budget = 2.2;
    for (let k = 0; k < budget; k++) {
      if (Math.random() > 0.55) continue;
      const l = pick(links);
      const dir = Math.random() < 0.5;
      packets.push({
        l, t: 0,
        from: dir ? l.a : l.b,
        to: dir ? l.b : l.a,
        speed: rnd(0.006, 0.016) * (0.5 + l.w),
        color: nodes[l.b].color,
      });
    }
  }
  function stepPackets() {
    for (let i = packets.length - 1; i >= 0; i--) {
      const p = packets[i];
      p.t += p.speed;
      if (p.t >= 1) {
        packets.splice(i, 1);
        const dest = nodes[p.to];
        dest.load = Math.min(1, dest.load + 0.06);
        dest.pulse = 1;
        const lk = links[p.l.__i];
        if (lk) lk.hot = 1;
      }
    }
    for (const l of links) l.hot *= 0.92;
    for (const n of nodes) { n.load *= 0.992; n.pulse *= 0.9; }
  }
  links.forEach((l, i) => (l.__i = i));

  // ---- Interaction ----
  function toWorld(px, py) {
    return { x: (px - W / 2) / view.s - view.x, y: (py - H / 2) / view.s - view.y };
  }
  canvas.addEventListener("mousemove", e => {
    const m = toWorld(e.clientX, e.clientY);
    if (drag) {
      drag.node.x = m.x - drag.ox; drag.node.y = m.y - drag.oy;
      dragMoved = true;
      return;
    }
    let best = null, bd = 18 / view.s;
    for (const n of nodes) {
      const d = Math.hypot(n.x - m.x, n.y - m.y);
      if (d < bd) { bd = d; best = n; }
    }
    hover = best;
    canvas.style.cursor = best ? "pointer" : "default";
  });
  canvas.addEventListener("mousedown", e => {
    const m = toWorld(e.clientX, e.clientY);
    for (const n of nodes) {
      if (Math.hypot(n.x - m.x, n.y - m.y) < (n.r + 6) / view.s) {
        drag = { node: n, ox: m.x - n.x, oy: m.y - n.y };
        dragMoved = false;
        return;
      }
    }
  });
  window.addEventListener("mouseup", () => { drag = null; });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 0.89;
    view.ts = Math.max(0.3, Math.min(3, view.ts * f));
  }, { passive: false });

  // ---- Buttons ----
  const bind = (id, key) => {
    const b = document.getElementById(id);
    b.addEventListener("click", () => {
      if (key) { opts[key] = !opts[key]; b.classList.toggle("on", opts[key]); }
      else { build(); centerView(); }
    });
  };
  bind("b-traffic", "traffic");
  bind("b-labels", "labels");
  bind("b-pulse", "pulse");
  bind("b-reset", null);

  function centerView() { view.tx = 0; view.ty = 0; view.ts = 1; }
  // tip fade
  setTimeout(() => document.getElementById("tip").classList.add("show"), 600);
  setTimeout(() => document.getElementById("tip").classList.remove("show"), 6000);

  // ---- Render ----
  let last = performance.now(), frames = 0, pktAcc = 0, pktTimer = 0;
  function frame(now) {
    const dt = Math.min(40, now - last); last = now;
    // smooth view
    view.x += (view.tx - view.x) * 0.12;
    view.y += (view.ty - view.y) * 0.12;
    view.s += (view.ts - view.s) * 0.12;

    simulate();
    spawnPackets();
    stepPackets();

    ctx.clearRect(0, 0, W, H);
    drawGrid();

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(view.s, view.s);
    ctx.translate(view.x, view.y);

    // links
    for (const l of links) {
      const a = nodes[l.a], b = nodes[l.b];
      const hot = l.hot;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = hot > 0.05
        ? `rgba(255,210,120,${0.15 + hot * 0.5})`
        : `rgba(120,150,200,${0.07 + l.flow * 0.06})`;
      ctx.lineWidth = (hot > 0.05 ? 1.6 : 0.8) * (0.6 + l.w);
      ctx.stroke();
    }

    // packets
    if (opts.traffic) {
      for (const p of packets) {
        const a = nodes[p.from], b = nodes[p.to];
        const x = a.x + (b.x - a.x) * p.t;
        const y = a.y + (b.y - a.y) * p.t;
        ctx.beginPath();
        ctx.arc(x, y, 2.1, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color; ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // nodes
    for (const n of nodes) {
      const isHi = hover === n;
      const glow = 6 + n.load * 14 + (opts.pulse ? n.pulse * 10 : 0);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.shadowColor = n.color; ctx.shadowBlur = isHi ? glow + 12 : glow;
      ctx.fill();
      ctx.shadowBlur = 0;

      // core/router inner ring
      if (n.type === "core" || n.type === "router") {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 4 + Math.sin(now / 600 + n.phase) * 2, 0, Math.PI * 2);
        ctx.strokeStyle = n.color.replace(")", ",0.3)").replace("rgb", "rgba");
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (isHi) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 9, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(230,245,255,0.8)";
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    }

    // labels
    if (opts.labels) {
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const n of nodes) {
        const show = n.type === "core" || n.type === "router" || n.type === "server" || hover === n;
        if (!show) continue;
        const tx = n.x, ty = n.y - n.r - 10;
        const label = `${TYPES[n.type].label}·${n.id}`;
        const tw = ctx.measureText(label).width + 8;
        ctx.fillStyle = "rgba(6,10,18,0.7)";
        roundRect(ctx, tx - tw / 2, ty - 8, tw, 15, 4);
        ctx.fill();
        ctx.fillStyle = n.type === "core" ? "#ffe6a0" : "#cfe3ff";
        ctx.fillText(label, tx, ty);
      }
    }
    ctx.restore();

    // hover tooltip (screen space)
    if (hover) {
      const sx = (hover.x - view.x) * view.s + W / 2;
      const sy = (hover.y - view.y) * view.s + H / 2;
      drawTip(sx, sy, hover);
    }

    // stats
    frames++;
    pktAcc += packets.length; pktTimer += dt;
    if (pktTimer > 500) {
      const avg = pktAcc / Math.max(1, frames);
      document.getElementById("s-pkt").textContent = Math.round(avg * (1000 / pktTimer) * 1.6);
      const totalLoad = nodes.reduce((s, n) => s + n.load, 0) / nodes.length;
      document.getElementById("s-load").textContent = Math.round(totalLoad * 100) + "%";
      frames = 0; pktAcc = 0; pktTimer = 0;
    }

    requestAnimationFrame(frame);
  }

  function drawGrid() {
    const step = 46;
    ctx.strokeStyle = "rgba(80,120,180,0.05)";
    ctx.lineWidth = 1;
    const ox = ((view.x * view.s) % step + W) % step;
    const oy = ((view.y * view.s) % step + H) % step;
    ctx.beginPath();
    for (let x = ox; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = oy; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawTip(x, y, n) {
    const lines = [
      `${TYPES[n.type].label.toUpperCase()}  #${n.id}`,
      `cluster ${n.cluster}`,
      `load ${Math.round(n.load * 100)}%`,
    ];
    ctx.font = "12px Segoe UI, sans-serif";
    let w = 0;
    for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    w += 20;
    const h = lines.length * 17 + 12;
    let px = x + 16, py = y - h - 10;
    if (px + w > W) px = x - w - 16;
    if (py < 8) py = y + 16;
    ctx.fillStyle = "rgba(8,14,26,0.92)";
    roundRect(ctx, px, py, w, h, 8); ctx.fill();
    ctx.strokeStyle = n.color; ctx.globalAlpha = 0.6; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    lines.forEach((l, i) => {
      ctx.fillStyle = i === 0 ? n.color : "#b9cde8";
      ctx.fillText(l, px + 10, py + 8 + i * 17);
    });
  }

  build();
  centerView();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
