<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City — Night</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #8fb7ff; letter-spacing: .04em; text-shadow: 0 0 8px #0a1a3a;
    pointer-events: none; user-select: none; opacity: .85;
  }
  #hud b { color: #cfe2ff; }
  #title {
    position: fixed; left: 14px; top: 12px;
    font: 600 15px/1.3 ui-monospace, Menlo, Consolas, monospace;
    color: #d7e6ff; letter-spacing: .14em; text-transform: uppercase;
    text-shadow: 0 0 14px #11408f; pointer-events: none; user-select: none; opacity: .9;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">A Living City · Night</div>
<div id="hud"><b>procedural</b> · orbit + drifting traffic · <b>drag</b> to look · <b>scroll</b> to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<script>
(function () {
  "use strict";

  if (typeof THREE === "undefined") {
    document.getElementById("title").textContent = "Three.js failed to load (offline?)";
    return;
  }

  // ---------- Renderer / Scene / Camera ----------
  var canvas = document.getElementById("c");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070f);
  scene.fog = new THREE.FogExp2(0x070b18, 0.0042);

  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 2000);
  camera.position.set(70, 55, 70);

  // ---------- Lights ----------
  scene.add(new THREE.AmbientLight(0x223355, 0.55));
  var moon = new THREE.DirectionalLight(0x9fb6ff, 0.35);
  moon.position.set(-120, 180, 60);
  scene.add(moon);

  // ---------- Window emissive textures (procedural) ----------
  function makeWindowTexture(kind) {
    var cv = document.createElement("canvas");
    cv.width = 64; cv.height = 128;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, 64, 128);
    var cols = 5, rows = 11;
    var padX = 5, padY = 4;
    var cw = (64 - padX * 2) / cols;
    var ch = (128 - padY * 2) / rows;
    var warm = ["#ffd27a", "#ffb347", "#ffe3a0", "#ffcf8a"];
    var cool = ["#7ad7ff", "#9be7ff", "#bfe9ff", "#86c8ff"];
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var r = Math.random();
        var lit = r < 0.62;
        if (!lit) { ctx.fillStyle = "#0c0c14"; }
        else if (kind === "warm") { ctx.fillStyle = warm[(Math.random() * warm.length) | 0]; }
        else if (kind === "cool") { ctx.fillStyle = cool[(Math.random() * cool.length) | 0]; }
        else { ctx.fillStyle = (Math.random() < 0.5 ? warm : cool)[(Math.random() * 4) | 0]; }
        var a = lit ? (0.55 + Math.random() * 0.45) : 1;
        ctx.globalAlpha = a;
        ctx.fillRect(padX + x * cw + 1, padY + y * ch + 1, cw - 2, ch - 2);
      }
    }
    ctx.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.magFilter = THREE.NearestFilter;
    return tex;
  }

  var winTextures = [
    makeWindowTexture("warm"),
    makeWindowTexture("cool"),
    makeWindowTexture("mix"),
    makeWindowTexture("warm"),
    makeWindowTexture("cool")
  ];

  // ---------- Ground + streets ----------
  var CITY = 22;      // grid half-extent in cells
  var STEP = 8;       // cell spacing
  var GROUND = CITY * STEP * 2 + STEP;

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(GROUND, GROUND),
    new THREE.MeshStandardMaterial({ color: 0x05060c, roughness: 0.95, metalness: 0.0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  scene.add(ground);

  // street grid glow lines
  var streetMat = new THREE.LineBasicMaterial({ color: 0x123056, transparent: true, opacity: 0.5 });
  var sgeo = new THREE.BufferGeometry();
  var spts = [];
  for (var i = -CITY; i <= CITY; i++) {
    var p = i * STEP + STEP / 2;
    spts.push(-GROUND / 2, 0.02, p, GROUND / 2, 0.02, p);
    spts.push(p, 0.02, -GROUND / 2, p, 0.02, GROUND / 2);
  }
  sgeo.setAttribute("position", new THREE.Float32BufferAttribute(spts, 3));
  scene.add(new THREE.LineSegments(sgeo, streetMat));

  // ---------- Buildings ----------
  var buildings = [];
  var neonBuildings = [];
  var boxGeo = new THREE.BoxGeometry(1, 1, 1);

  function rand(a, b) { return a + Math.random() * (b - a); }

  for (var gx = -CITY; gx <= CITY; gx++) {
    for (var gz = -CITY; gz <= CITY; gz++) {
      if (Math.random() < 0.12) continue; // open lots / plazas
      var cx = gx * STEP;
      var cz = gz * STEP;
      var fw = rand(3.2, 6.0);
      var fd = rand(3.2, 6.0);
      var h = rand(5, 46) * (1 - 0.5 * Math.hypot(gx, gz) / (CITY + 4));
      if (h < 4) h = 4;

      var tex = winTextures[(Math.random() * winTextures.length) | 0].clone();
      tex.needsUpdate = true;
      tex.repeat.set(Math.max(1, Math.round(fw / 2)), Math.max(2, Math.round(h / 3)));

      var neon = Math.random() < 0.05;
      var mat = new THREE.MeshStandardMaterial({
        color: 0x0a0c16,
        roughness: 0.82,
        metalness: 0.1,
        emissive: neon ? new THREE.Color().setHSL(Math.random(), 0.9, 0.55) : 0xffffff,
        emissiveMap: tex,
        emissiveIntensity: neon ? 1.0 : 1.25
      });

      var m = new THREE.Mesh(boxGeo, mat);
      m.scale.set(fw, h, fd);
      m.position.set(cx, h / 2, cz);
      scene.add(m);

      var rec = { mesh: m, mat: mat, baseI: mat.emissiveIntensity, neon: neon, phase: Math.random() * 6.28, speed: rand(0.4, 1.4) };
      buildings.push(rec);
      if (neon) neonBuildings.push(rec);
    }
  }

  // ---------- Street lamps (corner glows) ----------
  var lampGeo = new THREE.SphereGeometry(0.35, 8, 8);
  var lampMat = new THREE.MeshBasicMaterial({ color: 0xffd98a });
  for (var lx = -CITY; lx <= CITY; lx += 3) {
    for (var lz = -CITY; lz <= CITY; lz += 3) {
      var lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.position.set(lx * STEP + STEP / 2, 2.2, lz * STEP + STEP / 2);
      scene.add(lamp);
    }
  }

  // ---------- Traffic (moving cars) ----------
  var cars = [];
  var carGeo = new THREE.BoxGeometry(0.6, 0.5, 1.4);
  function spawnCar() {
    var onX = Math.random() < 0.5;
    var lane = ((Math.floor(rand(-CITY, CITY))) * STEP) + STEP / 2;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var headColor = Math.random() < 0.5 ? 0xfff3d0 : 0xff5a5a;
    var mat = new THREE.MeshBasicMaterial({ color: headColor });
    var car = new THREE.Mesh(carGeo, mat);
    var pos = rand(-GROUND / 2, GROUND / 2);
    if (onX) car.position.set(pos, 1.0, lane); else car.position.set(lane, 1.0, pos);
    car.userData = { onX: onX, dir: dir, lane: lane, speed: rand(10, 22) };
    scene.add(car);
    cars.push(car);
  }
  for (var ci = 0; ci < 60; ci++) spawnCar();

  // ---------- Stars ----------
  var starGeo = new THREE.BufferGeometry();
  var starPts = [];
  for (var s = 0; s < 1200; s++) {
    var rr = rand(400, 900);
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(rand(-0.1, 1));
    starPts.push(rr * Math.sin(ph) * Math.cos(th), rr * Math.cos(ph), rr * Math.sin(ph) * Math.sin(th));
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPts, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x9fb8ff, size: 1.6, sizeAttenuation: true, transparent: true, opacity: 0.8 })));

  // ---------- Post-processing (bloom) ----------
  var composer = null;
  try {
    if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      var bloom = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.6, 0.18
      );
      composer.addPass(bloom);
    }
  } catch (e) { composer = null; }

  // ---------- Controls (drag / zoom) ----------
  var yaw = Math.PI * 0.25, pitch = 0.55, dist = 150;
  var dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("mousedown", function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener("mouseup", function () { dragging = false; });
  window.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.005;
    pitch = Math.min(1.4, Math.max(0.08, pitch + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener("wheel", function (e) {
    dist = Math.min(420, Math.max(35, dist + e.deltaY * 0.08));
    e.preventDefault();
  }, { passive: false });

  // ---------- Animation ----------
  var clock = new THREE.Clock();
  var autoT = 0;

  function frame() {
    var dt = Math.min(0.05, clock.getDelta());
    var t = clock.elapsedTime;
    autoT += dt;

    if (!dragging) yaw += dt * 0.05; // slow auto orbit

    camera.position.set(
      Math.cos(yaw) * Math.cos(pitch) * dist,
      Math.sin(pitch) * dist + 8,
      Math.sin(yaw) * Math.cos(pitch) * dist
    );
    camera.lookAt(0, 12, 0);

    // flicker / pulse
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      if (b.neon) {
        b.mat.emissiveIntensity = b.baseI + Math.sin(t * b.speed + b.phase) * 0.6;
      } else if (Math.random() < 0.004) {
        b.mat.emissiveIntensity = b.baseI * (0.4 + Math.random() * 0.9);
      } else {
        b.mat.emissiveIntensity += (b.baseI - b.mat.emissiveIntensity) * 0.05;
      }
    }

    // traffic
    for (var k = 0; k < cars.length; k++) {
      var car = cars[k];
      var u = car.userData;
      if (u.onX) { car.position.x += u.dir * u.speed * dt; if (car.position.x > GROUND / 2) car.position.x = -GROUND / 2; if (car.position.x < -GROUND / 2) car.position.x = GROUND / 2; }
      else { car.position.z += u.dir * u.speed * dt; if (car.position.z > GROUND / 2) car.position.z = -GROUND / 2; if (car.position.z < -GROUND / 2) car.position.z = GROUND / 2; }
    }

    if (composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();

  // ---------- Resize ----------
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
