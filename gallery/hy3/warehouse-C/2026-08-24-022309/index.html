<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NIGHTSHIFT — Warehouse Ops Simulation</title>
<style>
  :root{
    --ink:#e8eef6;
    --dim:#8a97a8;
    --accent:#ffc24b;
    --accent2:#4fd1c5;
    --panel:rgba(13,18,27,0.72);
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05070b;}
  body{
    font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #scene{position:fixed;inset:0;display:block;}

  /* atmospheric overlays */
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%,rgba(0,0,0,0) 45%,rgba(0,0,0,0.55) 100%);
    mix-blend-mode:multiply;}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:0.05;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.6) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;}

  /* HUD */
  .hud{position:fixed;pointer-events:none;}
  .topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 22px;gap:14px;}
  .brand{pointer-events:none;}
  .brand .logo{font-size:13px;letter-spacing:5px;color:var(--accent);font-weight:700;}
  .brand .sub{font-size:10px;letter-spacing:3px;color:var(--dim);margin-top:4px;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;min-width:92px;backdrop-filter:blur(8px);}
  .stat .k{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px;color:var(--ink);}
  .stat .v small{font-size:11px;color:var(--dim);font-weight:400;}
  .stat.accent .v{color:var(--accent);}
  .stat.teal .v{color:var(--accent2);}

  .bottombar{bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding:16px 22px;gap:14px;}
  .hint{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 13px;font-size:11px;color:var(--dim);letter-spacing:.5px;backdrop-filter:blur(8px);}
  .hint b{color:var(--accent);font-weight:600;}

  .controls{pointer-events:auto;display:flex;gap:8px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px);}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,0.04);
    color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:1px;border-radius:8px;
    padding:7px 11px;transition:.15s;}
  .btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25);}
  .btn.on{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:700;}
  .btn.ghost{opacity:.75;}
  .seg{display:flex;gap:4px;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}

  .docktag{position:fixed;pointer-events:none;}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s;}
  @media (max-width:640px){
    .stat{min-width:70px;padding:6px 9px;}
    .stat .v{font-size:16px;}
    .brand .logo{letter-spacing:3px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="flash" id="flash"></div>

<div class="hud topbar">
  <div class="brand">
    <div class="logo">NIGHTSHIFT&nbsp;LOGISTICS</div>
    <div class="sub">BAY&nbsp;7 · CROSS-DOCK SIMULATION</div>
  </div>
  <div class="stats" id="stats">
    <div class="stat accent"><div class="k">Delivered</div><div class="v" id="s-del">0</div></div>
    <div class="stat teal"><div class="k">Throughput</div><div class="v" id="s-tp">0.0<small>/min</small></div></div>
    <div class="stat"><div class="k">Outbound</div><div class="v" id="s-out">0</div></div>
    <div class="stat"><div class="k">Shift</div><div class="v" id="s-time">00:00</div></div>
  </div>
</div>

<div class="hud bottombar">
  <div class="hint">Workers ferry inbound freight from the <b>left dock</b> to outbound trucks at the <b>right dock</b>. &nbsp;<b>Click</b> the floor to dispatch another handler · <b>Space</b> to pause.</div>
  <div class="controls">
    <button class="btn ghost" id="b-worker">+ HANDLER</button>
    <div class="sep"></div>
    <div class="seg">
      <button class="btn" id="sp-half">0.5×</button>
      <button class="btn on" id="sp-1">1×</button>
      <button class="btn" id="sp-2">2×</button>
    </div>
    <div class="sep"></div>
    <button class="btn on" id="b-pause">RUN</button>
  </div>
</div>

<script>
"use strict";
const cvs = document.getElementById('scene');
const ctx = cvs.getContext('2d');

/* ---------- layout / projection ---------- */
const GRID_W = 20, GRID_H = 12;
let W=0,H=0,DPR=1,TILE_W=64,TILE_H=32,originX=0,originY=0,U=1;
const IN_REAR_X = 1.7;      // incoming truck rear (door) position
const OUT_REAR_X = GRID_W-1.7;
const LANE_Y = GRID_H/2;
const TRUCK_L = 3.7;

function project(x,y,z){
  z = z||0;
  return {
    x: originX + (x - y)*TILE_W/2,
    y: originY + (x + y)*TILE_H/2 - z*TILE_H
  };
}
function computeLayout(){
  const margin = 36;
  const availW = Math.max(320, W - margin*2);
  const availH = Math.max(240, H - margin*2);
  let tw = availW / ((GRID_W+GRID_H)/2);
  let th = tw/2;
  if((GRID_W+GRID_H)*th/2 > availH){
    th = availH / ((GRID_W+GRID_H)/2);
    tw = th*2;
  }
  TILE_W = tw; TILE_H = th; U = TILE_W/64;
  originX = W/2;
  const isoH = (GRID_W+GRID_H)*TILE_H/2;
  originY = (H - isoH)/2 + TILE_H*1.6;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout();
}
window.addEventListener('resize', resize);

/* ---------- drawing primitives ---------- */
function quad(pts, fill, stroke){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function shade(hex, f){
  // f<1 darken, f>1 lighten
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(f<=1){ r*=f; g*=f; b*=f; }
  else { r += (255-r)*(f-1); g += (255-g)*(f-1); b += (255-b)*(f-1); }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

/* ---------- simulation state ---------- */
const state = {
  paused:false,
  speed:1,
  time:0,
  delivered:0,
  outbound:0,
  workers:[],
  inTruck:null,
  outTruck:null,
  inSpawn:2.2,
  outSpawn:0.4,
  pallet:0,            // inbound packages waiting on dock
  palletMax:7,
  dust:[],
  lights:[],
  flashT:0,
};

const TRUCK_COLORS = [
  {body:'#c0392b',top:'#e05a4c',cab:'#7d241b'},
  {body:'#2c6fbb',top:'#4f93dd',cab:'#1c4677'},
  {body:'#2f9e6b',top:'#52c08d',cab:'#1c6343'},
  {body:'#d98a2b',top:'#f2a94e',cab:'#8a5316'},
  {body:'#7a5cc4',top:'#9b80e0',cab:'#4a357e'},
];

function pick(a){ return a[(Math.random()*a.length)|0]; }

/* ---------- packages ---------- */
function makePackage(){
  return { col: pick(['#b07b4f','#a8713f','#bd8655','#9c6a3f']), tape:'#e7d3a1', id: (Math.random()*9000|0)+1000 };
}

/* ---------- trucks ---------- */
function spawnInTruck(){
  const col = pick(TRUCK_COLORS);
  state.inTruck = {
    side:'in', doorSide:1, col,
    cargo: 8 + (Math.random()*3|0),
    phase:'in', t:0, shiftX: -7,
    dwell:0,
  };
}
function spawnOutTruck(){
  const col = pick(TRUCK_COLORS);
  state.outTruck = {
    side:'out', doorSide:-1, col,
    slots: new Array(6).fill(null),
    phase:'in', t:0, shiftX: 7,
  };
}

function truckGeom(tr){
  // base geometry (without shift)
  if(tr.side==='in'){
    const x1 = IN_REAR_X, x0 = IN_REAR_X - TRUCK_L;
    return { x0:x0+tr.shiftX, x1:x1+tr.shiftX, yc:LANE_Y, w:1.9 };
  } else {
    const x0 = OUT_REAR_X, x1 = OUT_REAR_X + TRUCK_L;
    return { x0:x0+tr.shiftX, x1:x1+tr.shiftX, yc:LANE_Y, w:1.9 };
  }
}

function updateTruck(tr, dt){
  const T_ARR = 2.0, T_DEP = 2.0;
  if(tr.phase==='in'){
    tr.t += dt / T_ARR;
    let k = Math.min(1, tr.t);
    k = k*k*(3-2*k); // smoothstep
    tr.shiftX = (tr.side==='in') ? (-7 + 7*k) : (7 - 7*k);
    if(tr.t>=1){ tr.shiftX = 0; tr.phase='active'; tr.t=0; }
  } else if(tr.phase==='active'){
    if(tr.side==='in'){
      tr.dwell += dt;
      if(tr.dwell > 1.0){
        tr.dwell = 0;
        if(tr.cargo>0 && state.pallet < state.palletMax){
          tr.cargo--; state.pallet++;
        }
      }
      if(tr.cargo<=0){
        // brief dwell then leave
        tr.t += dt;
        if(tr.t>0.8){ tr.phase='out'; tr.t=0; }
      }
    } else {
      // outbound fills via workers; check full
      let filled=0; for(const s of tr.slots) if(s) filled++;
      if(filled>=6){ tr.phase='out'; tr.t=0; }
    }
  } else if(tr.phase==='out'){
    tr.t += dt / T_DEP;
    let k = Math.min(1, tr.t);
    k = k*k*(3-2*k);
    tr.shiftX = (tr.side==='in') ? (-7*k) : (7*k);
    if(tr.t>=1){
      if(tr.side==='out'){ state.outbound++; }
      if(tr.side==='in') state.inSpawn = 1.6 + Math.random()*1.2;
      else state.outSpawn = 1.6 + Math.random()*1.2;
      return false; // remove
    }
  }
  return true;
}

/* ---------- workers ---------- */
function spawnWorker(){
  if(state.workers.length>=8) return;
  const i = state.workers.length;
  const off = (i - 2.5)*0.9;
  state.workers.push({
    x: 4 + Math.random()*2,
    y: LANE_Y + off + (Math.random()-0.5)*0.6,
    phase: Math.random()*6,
    moving:false,
    state:'toPick',
    timer:0,
    carry:null,
    slot: -1,
    vest: pick(['#ffc24b','#ffd86b','#ffb020','#ffe08a']),
    id:i,
    yoff: off,
  });
}

function workerPickTarget(w){
  return { x: IN_REAR_X + 1.0, y: LANE_Y + w.yoff*0.6 };
}
function slotPos(tr, i){
  const g = truckGeom(tr);
  const col = i%2, row = (i/2)|0;
  const x = g.x0 + 0.55 + col*0.95;
  const y = g.yc - 0.55 + row*0.55;
  return { x, y };
}
function findFreeSlot(tr){
  for(let i=0;i<6;i++) if(!tr.slots[i]) return i;
  return -1;
}

function moveToward(w, tx, ty, dt, spd){
  const dx = tx - w.x, dy = ty - w.y;
  const d = Math.hypot(dx,dy);
  if(d < 0.04){ w.x = tx; w.y = ty; w.moving=false; return true; }
  const step = (spd||2.7) * dt;
  if(step >= d){ w.x = tx; w.y = ty; w.moving=false; return true; }
  w.x += dx/d*step; w.y += dy/d*step;
  w.moving = true;
  w.face = Math.atan2(dy,dx);
  return false;
}

function updateWorker(w, dt){
  w.phase += (w.moving? dt*9 : dt*2.5);
  const tr = state.inTruck, ot = state.outTruck;
  switch(w.state){
    case 'toPick': {
      const t = workerPickTarget(w);
      if(moveToward(w, t.x, t.y, dt, 2.7)) w.state='pick', w.timer=0;
      break;
    }
    case 'pick': {
      w.moving=false; w.timer+=dt;
      if(w.timer>0.45){
        if(state.pallet>0){
          state.pallet--; w.carry = makePackage(); w.slot=-1;
          w.state='toDrop';
        } else {
          w.state = (tr && tr.phase==='active' && tr.cargo>0) ? 'pick' : 'idle';
          w.timer=0;
        }
      }
      break;
    }
    case 'idle': {
      w.moving=false;
      if(state.pallet>0 || (tr && tr.phase==='active' && tr.cargo>0)){
        w.state='toPick';
      }
      break;
    }
    case 'toDrop': {
      if(!ot || ot.phase!=='active'){ w.state='hold'; break; }
      let i = w.slot;
      if(i<0 || ot.slots[i]){ i = findFreeSlot(ot); w.slot=i; }
      if(i<0){ w.state='hold'; break; }
      const t = slotPos(ot, i);
      if(moveToward(w, t.x, t.y, dt, 2.7)){ w.state='drop'; w.timer=0; }
      break;
    }
    case 'hold': {
      w.moving=false;
      if(ot && ot.phase==='active'){ w.state='toDrop'; w.slot=-1; }
      break;
    }
    case 'drop': {
      w.moving=false; w.timer+=dt;
      if(w.timer>0.45){
        if(ot && ot.phase==='active'){
          let i = w.slot; if(i<0||ot.slots[i]) i=findFreeSlot(ot);
          if(i>=0){
            ot.slots[i] = w.carry; w.carry=null; w.slot=-1;
            state.delivered++;
            w.state='toPick';
            break;
          }
        }
        w.state='hold'; w.timer=0;
      }
      break;
    }
  }
}

/* ---------- atmosphere ---------- */
function initAtmos(){
  state.dust.length=0;
  for(let i=0;i<70;i++){
    state.dust.push({
      x: Math.random()*GRID_W, y: Math.random()*GRID_H,
      z: Math.random()*2.2, vy: 0.05+Math.random()*0.12,
      r: 0.4+Math.random()*1.1, ph: Math.random()*6.28
    });
  }
  state.lights.length=0;
  const xs=[3,8,13,18], ys=[2,6,10];
  for(const x of xs) for(const y of ys){
    state.lights.push({x:x+(Math.random()-0.5), y:y+(Math.random()-0.5), r:2.6+Math.random()*0.8});
  }
}

/* ---------- render ---------- */
function drawFloor(){
  // base concrete
  const a = project(0,0,0), b = project(GRID_W,0,0), c = project(GRID_W,GRID_H,0), d = project(0,GRID_H,0);
  const grd = ctx.createLinearGradient(a.x, a.y, c.x, c.y);
  grd.addColorStop(0, '#222834');
  grd.addColorStop(0.5, '#2b323f');
  grd.addColorStop(1, '#1c222c');
  quad([a,b,c,d], grd);

  // light pools
  for(const L of state.lights){
    const p = project(L.x, L.y, 0);
    const rad = L.r*TILE_W*0.9;
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
    g.addColorStop(0,'rgba(255,214,150,0.20)');
    g.addColorStop(0.5,'rgba(255,200,130,0.07)');
    g.addColorStop(1,'rgba(255,200,130,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rad,rad*0.55,0,0,Math.PI*2); ctx.fill();
  }

  // floor grid
  ctx.strokeStyle='rgba(255,255,255,0.045)';
  ctx.lineWidth=1;
  for(let x=0;x<=GRID_W;x++){
    const p1=project(x,0,0), p2=project(x,GRID_H,0);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  for(let y=0;y<=GRID_H;y++){
    const p1=project(0,y,0), p2=project(GRID_W,y,0);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }

  // painted safety lanes along the central transit lane
  ctx.strokeStyle='rgba(242,194,78,0.5)';
  ctx.lineWidth=Math.max(2,TILE_W*0.06);
  ctx.setLineDash([TILE_W*0.5, TILE_W*0.4]);
  const l1=project(2.6, LANE_Y-1.7, 0), l2=project(GRID_W-2.6, LANE_Y-1.7, 0);
  const l3=project(2.6, LANE_Y+1.7, 0), l4=project(GRID_W-2.6, LANE_Y+1.7, 0);
  ctx.beginPath(); ctx.moveTo(l1.x,l1.y); ctx.lineTo(l2.x,l2.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(l3.x,l3.y); ctx.lineTo(l4.x,l4.y); ctx.stroke();
  ctx.setLineDash([]);

  // hazard stripe on dock edges
  drawHazard(0, LANE_Y-2.2, 2.4, LANE_Y-1.9);
  drawHazard(GRID_W-2.4, LANE_Y-2.2, GRID_W, LANE_Y-1.9);

  // dock floor pads
  drawPad(IN_REAR_X+0.8, LANE_Y, 'INBOUND');
  drawPad(OUT_REAR_X-0.8, LANE_Y, 'OUTBOUND');
}
function drawHazard(x0,x1,y0,y1){
  ctx.save();
  const steps=10;
  for(let i=0;i<steps;i++){
    const t0=i/steps, t1=(i+0.5)/steps;
    const ax=project(x0+(x1-x0)*t0, y0,0), bx=project(x0+(x1-x0)*t0, y1,0);
    const cx=project(x0+(x1-x0)*t1, y1,0), dx=project(x0+(x1-x0)*t1, y0,0);
    ctx.fillStyle = (i%2)? 'rgba(242,194,78,0.55)':'rgba(20,20,20,0.55)';
    quad([ax,bx,cx,dx], ctx.fillStyle);
  }
  ctx.restore();
}
function drawPad(x,y,label){
  const p=project(x,y,0);
  const r=TILE_W*1.1;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
  g.addColorStop(0,'rgba(79,209,197,0.10)');
  g.addColorStop(1,'rgba(79,209,197,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(p.x,p.y,r,r*0.5,0,0,Math.PI*2); ctx.fill();
}

/* truck drawing */
function faceX(xc, y0,y1, z0,z1, col){
  quad([project(xc,y0,z0),project(xc,y1,z0),project(xc,y1,z1),project(xc,y0,z1)], col);
}
function faceY(yc, x0,x1, z0,z1, col){
  quad([project(x0,yc,z0),project(x1,yc,z0),project(x1,yc,z1),project(x0,yc,z1)], col);
}
function drawTruck(tr){
  const g = truckGeom(tr);
  const {x0,x1,yc,w} = g;
  const y0 = yc - w/2, y1 = yc + w/2;
  const z0=0, z1=2.0;
  const col = tr.col;
  // arriving glow / exhaust
  if(tr.phase==='in'){
    const ex = project((tr.side==='in')? x0-0.4 : x1+0.4, yc, 0.4);
    const eg = ctx.createRadialGradient(ex.x,ex.y,0,ex.x,ex.y,24*U);
    eg.addColorStop(0,'rgba(200,210,220,0.18)');
    eg.addColorStop(1,'rgba(200,210,220,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(ex.x,ex.y,24*U,0,6.28); ctx.fill();
  }

  // shadow
  const sc = project((x0+x1)/2, yc, 0);
  ctx.fillStyle='rgba(0,0,0,0.34)';
  ctx.beginPath();
  ctx.ellipse(sc.x, sc.y+2*U, (TRUCK_L*0.5+0.5)*TILE_W*0.5, w*TILE_W*0.32, 0,0,6.28);
  ctx.fill();

  // wheels
  ctx.fillStyle='#15181d';
  for(const wx of [x0+0.5, x1-0.5]){
    for(const wy of [y0+0.2, y1-0.2]){
      const wp=project(wx,wy,0);
      ctx.beginPath(); ctx.ellipse(wp.x, wp.y, 9*U, 5*U, 0,0,6.28); ctx.fill();
    }
  }

  // cab (drawn first if behind; trailer overlaps)
  const cabH=1.5, cabL=1.1;
  function drawCab(){
    let cx0,cx1;
    if(tr.side==='in'){ cx1=x0; cx0=x0-cabL; }
    else { cx0=x1; cx1=x1+cabL; }
    const cc = col.cab;
    // body
    quad([project(cx0,y0,z0),project(cx1,y0,z0),project(cx1,y1,z0),project(cx0,y1,z0)], shade(cc,0.7));
    faceX(tr.side==='in'? cx1:cx0, y0,y1, z0,cabH, cc); // front cab face
    faceY(y0, cx0,cx1, z0,cabH, shade(cc,1.1));
    faceY(y1, cx0,cx1, z0,cabH, shade(cc,0.85));
    quad([project(cx0,y0,cabH),project(cx1,y0,cabH),project(cx1,y1,cabH),project(cx0,y1,cabH)], shade(cc,1.15));
    // window
    const wg=shade(cc,1.8);
    if(tr.side==='in') faceX(cx1-0.05, y0+0.35,y1-0.35, cabH*0.55,cabH*0.95, 'rgba(180,220,240,0.55)');
    else faceX(cx0+0.05, y0+0.35,y1-0.35, cabH*0.55,cabH*0.95, 'rgba(180,220,240,0.55)');
  }

  // trailer
  function drawTrailer(){
    const bc=col.body, tc=col.top;
    // floor
    quad([project(x0,y0,z0),project(x1,y0,z0),project(x1,y1,z0),project(x0,y1,z0)], shade(bc,0.5));
    // cab-end wall (interior)
    if(tr.doorSide===1) faceX(x0, y0,y1, z0,z1, shade(bc,0.62));
    else faceX(x1, y0,y1, z0,z1, shade(bc,0.62));
    // long walls
    faceY(y0, x0,x1, z0,z1, bc);
    faceY(y1, x0,x1, z0,z1, shade(bc,0.78));
    // top
    quad([project(x0,y0,z1),project(x1,y0,z1),project(x1,y1,z1),project(x0,y1,z1)], tc);
    // door frame + interior hint on open side
    if(tr.doorSide===1){
      // door at x=x1
      const dg=ctx.createLinearGradient(0, project(x1,y0,z1).y, 0, project(x1,y0,z0).y);
      dg.addColorStop(0,'rgba(0,0,0,0.0)'); dg.addColorStop(1,'rgba(0,0,0,0.35)');
      quad([project(x1,y0+0.15,z0+0.1),project(x1,y1-0.15,z0+0.1),project(x1,y1-0.15,z1-0.15),project(x1,y0+0.15,z1-0.15)], 'rgba(8,10,14,0.30)');
      // header bar
      quad([project(x1,y0,z1-0.12),project(x1,y1,z1-0.12),project(x1,y1,z1),project(x1,y0,z1)], shade(bc,0.6));
    } else {
      quad([project(x0,y0+0.15,z0+0.1),project(x0,y1-0.15,z0+0.1),project(x0,y1-0.15,z1-0.15),project(x0,y0+0.15,z1-0.15)], 'rgba(8,10,14,0.30)');
      quad([project(x0,y0,z1-0.12),project(x0,y1,z1-0.12),project(x0,y1,z1),project(x0,y0,z1)], shade(bc,0.6));
    }
  }

  if(tr.side==='in'){ drawCab(); drawTrailer(); }
  else { drawTrailer(); drawCab(); }

  // label
  const lp = project((x0+x1)/2, yc, z1+0.6);
  ctx.font = (9*U|0)+'px ui-monospace,monospace';
  ctx.textAlign='center';
  ctx.fillStyle = tr.side==='in' ? 'rgba(255,194,75,0.9)' : 'rgba(79,209,197,0.95)';
  ctx.fillText(tr.side==='in'?'◀ INBOUND':'OUTBOUND ▶', lp.x, lp.y);
  if(tr.side==='in'){
    ctx.fillStyle='rgba(230,238,246,0.7)';
    ctx.fillText(tr.phase==='active'?('CARGO '+tr.cargo):(tr.phase==='in'?'ARRIVING':'DEPARTING'), lp.x, lp.y+11*U);
  } else {
    let f=0; for(const s of tr.slots) if(s) f++;
    ctx.fillStyle='rgba(230,238,246,0.7)';
    ctx.fillText(tr.phase==='active'?('LOAD '+f+'/6'):(tr.phase==='in'?'ARRIVING':'DEPARTING'), lp.x, lp.y+11*U);
  }
}

/* package box (iso) */
function drawPackageBox(x,y,z, pkg, s){
  s = s||0.5;
  const z1 = z + s;
  const x0=x-s/2,x1=x+s/2,y0=y-s/2,y1=y+s/2;
  quad([project(x0,y0,z),project(x1,y0,z),project(x1,y1,z),project(x0,y1,z)], shade(pkg.col,0.55));
  faceX(x1, y0,y1, z,z1, pkg.col);
  faceY(y1, x0,x1, z,z1, shade(pkg.col,0.78));
  quad([project(x0,y0,z1),project(x1,y0,z1),project(x1,y1,z1),project(x0,y1,z1)], shade(pkg.col,1.18));
  // tape
  const tz=shade(pkg.tape,1);
  ctx.strokeStyle=pkg.tape; ctx.lineWidth=Math.max(1,s*TILE_W*0.12);
  const t1=project(x0,y,z1), t2=project(x1,y,z1);
  ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y); ctx.stroke();
  const t3=project(x,y0,z1), t4=project(x,y1,z1);
  ctx.beginPath(); ctx.moveTo(t3.x,t3.y); ctx.lineTo(t4.x,t4.y); ctx.stroke();
}

/* pallet of inbound packages */
function drawPallet(){
  const baseX = IN_REAR_X + 1.0, baseY = LANE_Y;
  // pallet slab
  const px0=baseX-0.7,px1=baseX+0.7,py0=baseY-1.0,py1=baseY+1.0;
  quad([project(px0,py0,0),project(px1,py0,0),project(px1,py1,0),project(px0,py1,0)], '#3a2c1c');
  faceY(py1,px0,px1,0,0.18,'#4a3826');
  faceX(px1,py0,py1,0,0.18,'#2c2014');
  quad([project(px0,py0,0.18),project(px1,py0,0.18),project(px1,py1,0.18),project(px0,py1,0.18)], '#523c25');
  // stacked boxes (count capped visual)
  const n = Math.min(state.pallet, 6);
  for(let i=0;i<n;i++){
    const col=i%3, row=(i/3)|0;
    const bx = baseX - 0.45 + col*0.45;
    const by = baseY - 0.5 + row*0.5;
    const bz = 0.18 + ((i%2)?0.5:0);
    drawPackageBox(bx,by,bz, {col:pick(['#b07b4f','#a8713f','#bd8655']), tape:'#e7d3a1'}, 0.42);
  }
}

/* worker sprite */
function drawWorker(w){
  const f = project(w.x, w.y, 0);
  const fx=f.x, fy=f.y;
  const bob = Math.sin(w.phase)* (w.moving? 2.4*U : 0.8*U);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(fx, fy, 15*U, 6*U, 0,0,6.28); ctx.fill();

  const legSwing = w.moving ? Math.sin(w.phase)*5*U : 0;
  const hipY = fy - 24*U + bob;
  const shoY = fy - 50*U + bob;
  const headY = fy - 60*U + bob;

  // legs
  ctx.strokeStyle='#23262e'; ctx.lineWidth=5*U; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(fx-3*U, hipY); ctx.lineTo(fx-3*U+legSwing, fy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx+3*U, hipY); ctx.lineTo(fx+3*U-legSwing, fy); ctx.stroke();

  // torso (hi-vis vest)
  ctx.fillStyle=w.vest;
  roundRect(fx-9*U, shoY, 18*U, (hipY-shoY), 5*U);
  // reflective stripes
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillRect(fx-9*U, shoY+ (hipY-shoY)*0.35, 18*U, 2*U);
  ctx.fillRect(fx-9*U, shoY+ (hipY-shoY)*0.62, 18*U, 2*U);
  // belt
  ctx.fillStyle='#2a2d34'; ctx.fillRect(fx-9*U, hipY-3*U, 18*U, 3*U);

  // arms + carried box
  ctx.strokeStyle=shade(w.vest,0.7); ctx.lineWidth=4*U; ctx.lineCap='round';
  if(w.carry){
    const handY = shoY + (hipY-shoY)*0.45;
    const bx = fx, by = handY - 2*U;
    // arms forward
    ctx.beginPath(); ctx.moveTo(fx-7*U, shoY+6*U); ctx.lineTo(bx-7*U, handY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx+7*U, shoY+6*U); ctx.lineTo(bx+7*U, handY); ctx.stroke();
    // box in hands (screen-space)
    const bw=20*U, bh=16*U;
    ctx.fillStyle=w.carry.col;
    roundRect(bx-bw/2, by-bh, bw, bh, 3*U);
    ctx.fillStyle='rgba(255,255,255,0.0)';
    ctx.strokeStyle=w.carry.tape; ctx.lineWidth=1.5*U;
    ctx.beginPath(); ctx.moveTo(bx-bw/2, by-bh/2); ctx.lineTo(bx+bw/2, by-bh/2); ctx.stroke();
  } else {
    const sw = w.moving? Math.sin(w.phase)*4*U : 0;
    ctx.beginPath(); ctx.moveTo(fx-7*U, shoY+6*U); ctx.lineTo(fx-9*U, hipY+sw); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx+7*U, shoY+6*U); ctx.lineTo(fx+9*U, hipY-sw); ctx.stroke();
  }

  // head + helmet
  ctx.fillStyle='#e9c9a3';
  ctx.beginPath(); ctx.arc(fx, headY, 7*U, 0, 6.28); ctx.fill();
  ctx.fillStyle='#ff7a1a';
  ctx.beginPath(); ctx.arc(fx, headY-1*U, 7.5*U, Math.PI*1.05, Math.PI*1.95); ctx.fill();
  ctx.fillRect(fx-7.5*U, headY-1*U, 15*U, 2.5*U);
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
}

/* depth-sorted actors */
function render(){
  ctx.clearRect(0,0,W,H);
  // background
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0e16');
  bg.addColorStop(1,'#05070b');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // far wall suggestion
  const w0=project(0,0,0), w1=project(GRID_W,0,0), w2=project(GRID_W,0,2.6), w3=project(0,0,2.6);
  quad([w0,w1,w2,w3], 'rgba(255,255,255,0.02)');

  drawFloor();

  // ambient dust
  for(const d of state.dust){
    const p=project(d.x,d.y,d.z);
    const a=0.10+0.12*Math.abs(Math.sin(d.ph));
    ctx.fillStyle='rgba(255,230,190,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,d.r*U,0,6.28); ctx.fill();
  }

  // build actor list
  const actors=[];
  if(state.inTruck) actors.push({d: state.inTruck.side==='in'? IN_REAR_X-TRUCK_L/2 : 0, kind:'in', o:state.inTruck});
  if(state.outTruck) actors.push({d: OUT_REAR_X+TRUCK_L/2, kind:'out', o:state.outTruck});
  // pallet (drawPallet renders slab + stacked boxes)
  actors.push({d: IN_REAR_X+1.0 + LANE_Y, kind:'pallet', o:null});
  // out slots
  if(state.outTruck){
    for(let i=0;i<6;i++){
      if(state.outTruck.slots[i]){
        const sp=slotPos(state.outTruck,i);
        actors.push({d: sp.x+sp.y, kind:'oslot', o:{i}});
      }
    }
  }
  // workers
  for(const w of state.workers) actors.push({d: w.x+w.y, kind:'worker', o:w});

  actors.sort((a,b)=>a.d-b.d);
  for(const a of actors){
    if(a.kind==='in') drawTruck(a.o);
    else if(a.kind==='out') drawTruck(a.o);
    else if(a.kind==='pallet') drawPallet();
    else if(a.kind==='oslot'){ const i=a.o.i; const sp=slotPos(state.outTruck,i); drawPackageBox(sp.x,sp.y,0.05,state.outTruck.slots[i],0.5); }
    else if(a.kind==='worker') drawWorker(a.o);
  }
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  const sdt = state.paused?0:dt*state.speed;

  if(sdt>0){
    state.time += sdt;
    // dust drift
    for(const d of state.dust){
      d.z += d.vy*sdt;
      d.ph += sdt*0.8;
      if(d.z>2.6){ d.z=0; d.x=Math.random()*GRID_W; d.y=Math.random()*GRID_H; }
    }
    // trucks
    if(state.inTruck){ if(!updateTruck(state.inTruck, sdt)) state.inTruck=null; }
    else { state.inSpawn -= sdt; if(state.inSpawn<=0) spawnInTruck(); }
    if(state.outTruck){ if(!updateTruck(state.outTruck, sdt)) state.outTruck=null; }
    else { state.outSpawn -= sdt; if(state.outSpawn<=0) spawnOutTruck(); }
    // workers
    for(const w of state.workers) updateWorker(w, sdt);
  }

  render();
  updateHUD();
  requestAnimationFrame(frame);
}

function updateHUD(){
  document.getElementById('s-del').textContent = state.delivered;
  const mins = state.time/60;
  const tp = mins>0.01 ? (state.delivered/mins) : 0;
  document.getElementById('s-tp').innerHTML = tp.toFixed(1)+'<small>/min</small>';
  document.getElementById('s-out').textContent = state.outbound;
  const mm=Math.floor(state.time/60), ss=Math.floor(state.time%60);
  document.getElementById('s-time').textContent = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}

/* ---------- interaction ---------- */
cvs.addEventListener('click', (e)=>{
  // dispatch a handler
  spawnWorker();
  triggerFlash();
});
function triggerFlash(){
  const fl=document.getElementById('flash');
  fl.style.opacity='0.12';
  setTimeout(()=>fl.style.opacity='0',60);
}

const bPause=document.getElementById('b-pause');
bPause.addEventListener('click',()=>{
  state.paused=!state.paused;
  bPause.textContent = state.paused?'PAUSED':'RUN';
  bPause.classList.toggle('on', !state.paused);
});
document.getElementById('b-worker').addEventListener('click',()=>{ spawnWorker(); triggerFlash(); });

const spBtns=[['sp-half',0.5],['sp-1',1],['sp-2',2]];
for(const [id,sp] of spBtns){
  document.getElementById(id).addEventListener('click',()=>{
    state.speed=sp;
    for(const [i2,s2] of spBtns) document.getElementById(i2).classList.toggle('on', s2===sp);
  });
}
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){ e.preventDefault(); bPause.click(); }
});

/* ---------- boot ---------- */
resize();
initAtmos();
spawnInTruck();
spawnOutTruck();
for(let i=0;i<3;i++) spawnWorker();
requestAnimationFrame(frame);
</script>
