<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Colony — scent trail foraging</title>
  <style>
    :root {
      --ink: #f3eadb;
      --muted: #b6a58d;
      --accent: #e7a24e;
      --panel: rgba(14, 11, 9, 0.72);
      --line: rgba(243, 234, 219, 0.14);
      --food: #d6e36c;
      --home: #6aa4ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #100e0c;
      color: var(--ink);
      font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    #view {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }
    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .panel, .dock {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    header.panel {
      position: absolute;
      top: 18px;
      left: 18px;
      max-width: min(360px, calc(100% - 220px));
      padding: 14px 16px 12px;
      border-radius: 16px;
    }
    .brand {
      letter-spacing: 0.38em;
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 6px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .lede {
      margin: 6px 0 10px;
      color: var(--muted);
    }
    .legend {
      display: flex;
      gap: 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .swatch {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: 1px;
      box-shadow: 0 0 8px currentColor;
    }
    .swatch.food { background: #ff8a3d; color: #ff8a3d; }
    .swatch.home { background: var(--home); color: var(--home); }
    aside.panel {
      position: absolute;
      top: 18px;
      right: 18px;
      min-width: 168px;
      padding: 12px 14px;
      border-radius: 16px;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 4px 0;
    }
    .stat span { color: var(--muted); }
    .stat b { font-weight: 600; }
    .dock {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 10px;
      max-width: calc(100% - 24px);
      padding: 8px 10px;
      border-radius: 999px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(243, 234, 219, 0.06);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: rgba(243, 234, 219, 0.12); }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.active {
      background: rgba(231, 162, 78, 0.22);
      border-color: rgba(231, 162, 78, 0.5);
      color: #f3c37a;
    }
    .sep {
      width: 1px;
      height: 22px;
      background: var(--line);
    }
    label.ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      padding: 0 4px;
    }
    label.ctrl output {
      color: var(--ink);
      min-width: 2.4em;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 88px;
      height: 16px;
      background: transparent;
      margin: 0;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: rgba(243, 234, 219, 0.22);
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 0;
      margin-top: -4.5px;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-track {
      height: 3px;
      background: rgba(243, 234, 219, 0.22);
      border-radius: 2px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 0;
      cursor: pointer;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      padding: 0 8px 0 2px;
    }
    @media (max-width: 820px) {
      header.panel { max-width: calc(100% - 36px); }
      aside.panel {
        top: auto;
        bottom: 88px;
        right: 12px;
        left: auto;
      }
      .lede { display: none; }
      .dock { border-radius: 22px; }
      .hint { display: none; }
    }
    @media (max-width: 560px) {
      header.panel { top: 10px; left: 10px; padding: 10px 12px; }
      aside.panel { bottom: 108px; right: 10px; min-width: 140px; }
    }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Ant colony simulation">This simulation needs canvas.</canvas>
  <div class="ui">
    <header class="panel">
      <p class="brand">Formicarium</p>
      <h1>Colony</h1>
      <p class="lede">Workers wander, carry, and double back. Scent that leads to food grows brighter; the rest fades. Click to drop seed. Shift-drag to raise stone.</p>
      <div class="legend">
        <span><i class="swatch food"></i>Food scent</span>
        <span><i class="swatch home"></i>Home scent</span>
      </div>
    </header>
    <aside class="panel" aria-live="polite">
      <div class="stat"><span>Harvested</span><b id="stHarvest">0</b></div>
      <div class="stat"><span>Seeking</span><b id="stSeek">0</b></div>
      <div class="stat"><span>Carrying</span><b id="stCarry">0</b></div>
      <div class="stat"><span>Food left</span><b id="stFood">0</b></div>
    </aside>
    <footer class="dock">
      <button type="button" id="btnPause">Pause</button>
      <button type="button" id="btnReset">Reset</button>
      <span class="sep"></span>
      <button type="button" id="toolFood" class="active">Food</button>
      <button type="button" id="toolStone">Stone</button>
      <button type="button" id="toolErase">Erase</button>
      <span class="sep"></span>
      <label class="ctrl">Workers
        <input id="rngAnts" type="range" min="30" max="340" step="10" value="150">
        <output id="outAnts">150</output>
      </label>
      <label class="ctrl">Memory
        <input id="rngFade" type="range" min="0" max="100" value="68">
        <output id="outFade">68</output>
      </label>
      <label class="ctrl">Speed
        <input id="rngSpeed" type="range" min="0.4" max="2.4" step="0.1" value="1">
        <output id="outSpeed">1.0×</output>
      </label>
      <span class="hint">Space pause · R reset · 1–3 tools</span>
    </footer>
  </div>
  <script>
    const TAU = Math.PI * 2;
    const CELL = 4;
    const NEST_R = 32;
    const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const view = document.getElementById("view");
    const ctx = view.getContext("2d", { alpha: false });
    const soil = document.createElement("canvas");
    const soilCtx = soil.getContext("2d");
    const wallC = document.createElement("canvas");
    const wallCtx = wallC.getContext("2d");
    const pherC = document.createElement("canvas");
    const pherCtx = pherC.getContext("2d");

    const C = { ants: 150, fade: 68, speed: 1, tool: "food" };
    const nest = { x: 0, y: 0, r: NEST_R };
    let W = 0, H = 0, COLS = 0, ROWS = 0;
    let foodA, foodB, homeA, homeB, walls, pherImg;
    let ants = [];
    let foods = [];
    let particles = [];
    let rings = [];
    let harvested = 0;
    let nestPulse = 0;
    let foodId = 1;
    let paused = false;
    let wallDirty = false;
    let lastT = performance.now();
    let mouse = { x: 0, y: 0, inside: false, down: false, button: 0, shift: false, alt: false };
    let lastDropX = -999, lastDropY = -999;
    let statClock = 0;

    const motes = Array.from({ length: REDUCE ? 0 : 42 }, () => ({
      x: Math.random(),
      y: Math.random(),
      z: 0.25 + Math.random() * 0.75,
      p: Math.random()
    }));

    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const wrap = (a) => {
      while (a > Math.PI) a -= TAU;
      while (a < -Math.PI) a += TAU;
      return a;
    };
    const hypot = Math.hypot;
    const idxAt = (x, y) => {
      const cx = x / CELL | 0;
      const cy = y / CELL | 0;
      if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return -1;
      return cy * COLS + cx;
    };
    const blocked = (x, y) => {
      if (x < 2 || y < 2 || x > W - 2 || y > H - 2) return true;
      const i = idxAt(x, y);
      return i < 0 || walls[i] !== 0;
    };
    const sample = (arr, x, y) => {
      const i = idxAt(x, y);
      if (i < 0 || walls[i]) return -1;
      return arr[i];
    };

    function fit() {
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      W = window.innerWidth;
      H = window.innerHeight;
      view.width = Math.max(1, W * dpr | 0);
      view.height = Math.max(1, H * dpr | 0);
      view.style.width = W + "px";
      view.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      COLS = Math.max(8, Math.ceil(W / CELL));
      ROWS = Math.max(8, Math.ceil(H / CELL));
      foodA = new Float32Array(COLS * ROWS);
      foodB = new Float32Array(COLS * ROWS);
      homeA = new Float32Array(COLS * ROWS);
      homeB = new Float32Array(COLS * ROWS);
      walls = new Uint8Array(COLS * ROWS);
      pherC.width = COLS;
      pherC.height = ROWS;
      pherImg = pherCtx.createImageData(COLS, ROWS);
      nest.x = W * 0.42;
      nest.y = H * 0.5;
      stampSoil();
      wallC.width = W;
      wallC.height = H;
      wallDirty = false;
    }

    function stampSoil() {
      soil.width = W;
      soil.height = H;
      const img = soilCtx.createImageData(W, H);
      const d = img.data;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
          const f = n - Math.floor(n);
          const n2 = Math.sin(x * 0.051 + y * 0.067) * 9137.17;
          const f2 = n2 - Math.floor(n2);
          const g = 11 + f * 13 + f2 * 9;
          d[i] = g + 7;
          d[i + 1] = g + 2;
          d[i + 2] = g - 3;
          d[i + 3] = 255;
        }
      }
      soilCtx.putImageData(img, 0, 0);
      soilCtx.globalAlpha = 0.18;
      for (let k = 0; k < 28; k++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        const r = 40 + Math.random() * 160;
        const g = soilCtx.createRadialGradient(x, y, 4, x, y, r);
        g.addColorStop(0, Math.random() > 0.5 ? "#000" : "#2a2018");
        g.addColorStop(1, "rgba(0,0,0,0)");
        soilCtx.fillStyle = g;
        soilCtx.beginPath();
        soilCtx.arc(x, y, r, 0, TAU);
        soilCtx.fill();
      }
      soilCtx.globalAlpha = 1;
    }

    function makeFood(x, y, amount) {
      return { id: foodId++, x, y, amount, radius: 12 };
    }

    function placeFood(x, y, amount) {
      if (hypot(x - nest.x, y - nest.y) < nest.r + 26) return;
      if (blocked(x, y)) return;
      for (const f of foods) {
        if (hypot(f.x - x, f.y - y) < 30) {
          f.amount += amount;
          return;
        }
      }
      foods.push(makeFood(x, y, amount));
      rings.push({ x, y, life: 1, color: "rgba(214,227,108," });
    }

    function seedFood() {
      const spots = W < 640
        ? [[0.82, 0.22], [0.16, 0.72]]
        : [[0.82, 0.18], [0.12, 0.32], [0.78, 0.82]];
      spots.forEach((p, i) => placeFood(p[0] * W, p[1] * H, 88 + i * 18));
    }

    function spawnOne() {
      const a = Math.random() * TAU;
      const d = Math.pow(Math.random(), 0.65) * 40;
      ants.push({
        x: nest.x + Math.cos(a) * d,
        y: nest.y + Math.sin(a) * d,
        heading: a + (Math.random() - 0.5) * 1.2,
        hasFood: false,
        speed: 64 + Math.random() * 26,
        seed: Math.random() * 1000,
        searchT: 0,
        carryT: 0
      });
    }

    function setPopulation(n) {
      C.ants = n;
      while (ants.length < n) spawnOne();
      while (ants.length > n) {
        let i = ants.findIndex((a) => !a.hasFood);
        if (i < 0) i = ants.length - 1;
        ants.splice(i, 1);
      }
    }

    function reset() {
      foodA.fill(0); foodB.fill(0); homeA.fill(0); homeB.fill(0); walls.fill(0);
      wallCtx.clearRect(0, 0, W, H);
      wallDirty = false;
      foods = [];
      particles = [];
      rings = [];
      ants = [];
      harvested = 0;
      nestPulse = 0;
      seedFood();
      setPopulation(C.ants);
    }

    function brushWall(x, y, val) {
      const rad = 17;
      const r2 = rad * rad;
      const x0 = Math.max(0, (x - rad) / CELL | 0);
      const y0 = Math.max(0, (y - rad) / CELL | 0);
      const x1 = Math.min(COLS - 1, (x + rad) / CELL | 0);
      const y1 = Math.min(ROWS - 1, (y + rad) / CELL | 0);
      for (let cy = y0; cy <= y1; cy++) {
        for (let cx = x0; cx <= x1; cx++) {
          const px = (cx + 0.5) * CELL;
          const py = (cy + 0.5) * CELL;
          const dx = px - x;
          const dy = py - y;
          if (dx * dx + dy * dy > r2) continue;
          if (hypot(px - nest.x, py - nest.y) < nest.r + 14) continue;
          const i = cy * COLS + cx;
          walls[i] = val;
          if (val) {
            foodA[i] = 0;
            homeA[i] = 0;
          }
        }
      }
      wallDirty = true;
      if (!val) {
        foods = foods.filter((f) => hypot(f.x - x, f.y - y) > rad + 6);
      }
    }

    function bakeWalls() {
      wallCtx.clearRect(0, 0, W, H);
      for (let i = 0; i < walls.length; i++) {
        if (!walls[i]) continue;
        const cx = (i % COLS) * CELL + CELL * 0.5;
        const cy = (i / COLS | 0) * CELL + CELL * 0.5;
        const shade = 42 + (i * 17 % 22);
        wallCtx.fillStyle = "rgb(" + (shade + 10) + "," + shade + "," + (shade - 8) + ")";
        wallCtx.beginPath();
        wallCtx.arc(cx, cy, CELL * 0.92, 0, TAU);
        wallCtx.fill();
      }
      wallDirty = false;
    }

    function deposit(arr, x, y, amt) {
      const i = idxAt(x, y);
      if (i < 0 || walls[i]) return;
      arr[i] = Math.min(1, arr[i] + amt);
      if (i % COLS > 0) arr[i - 1] = Math.min(1, arr[i - 1] + amt * 0.35);
      if (i % COLS < COLS - 1) arr[i + 1] = Math.min(1, arr[i + 1] + amt * 0.35);
      if (i >= COLS) arr[i - COLS] = Math.min(1, arr[i - COLS] + amt * 0.35);
      if (i < walls.length - COLS) arr[i + COLS] = Math.min(1, arr[i + COLS] + amt * 0.35);
    }

    function senseSteer(ant, arr) {
      const sd = 20;
      const sa = 0.56;
      const lx = ant.x + Math.cos(ant.heading - sa) * sd;
      const ly = ant.y + Math.sin(ant.heading - sa) * sd;
      const mx = ant.x + Math.cos(ant.heading) * sd;
      const my = ant.y + Math.sin(ant.heading) * sd;
      const rx = ant.x + Math.cos(ant.heading + sa) * sd;
      const ry = ant.y + Math.sin(ant.heading + sa) * sd;
      let left = sample(arr, lx, ly);
      let mid = sample(arr, mx, my);
      let right = sample(arr, rx, ry);
      if (left < 0 && mid < 0 && right < 0) return (Math.random() > 0.5 ? 1 : -1) * 2.4;
      if (left < 0) left = 0;
      if (mid < 0) mid = 0;
      if (right < 0) right = 0;
      left += 0.002;
      mid += 0.002;
      right += 0.002;
      if (mid >= left && mid >= right) return 0;
      if (left > right) return -1;
      if (right > left) return 1;
      return 0;
    }

    function burst(x, y, color, n) {
      if (REDUCE) n = Math.min(n, 4);
      const cap = 420 - particles.length;
      n = Math.min(n, cap);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU;
        const s = 18 + Math.random() * 70;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.7 + Math.random() * 0.5,
          color,
          size: 1 + Math.random() * 1.8
        });
      }
    }

    function updateAnts(dt) {
      const maxTurn = 5.6 * dt;
      for (const ant of ants) {
        const dNest = hypot(ant.x - nest.x, ant.y - nest.y);
        const trail = ant.hasFood ? homeA : foodA;
        let wander = (Math.random() - 0.5) * (2.6 + (ant.hasFood ? 0 : Math.min(2.2, ant.searchT * 0.12)));
        const dir = senseSteer(ant, trail);
        let turn = wander * dt + dir * maxTurn;

        if (ant.hasFood) {
          ant.carryT += dt;
          const toNest = Math.atan2(nest.y - ant.y, nest.x - ant.x);
          const bias = 0.18 + 0.55 * Math.exp(-dNest / 160) + Math.min(0.45, ant.carryT * 0.04);
          turn += wrap(toNest - ant.heading) * bias * dt * 4.2;
        } else {
          ant.searchT += dt;
        }

        const ahead = 8;
        if (blocked(ant.x + Math.cos(ant.heading) * ahead, ant.y + Math.sin(ant.heading) * ahead)) {
          turn += (Math.random() > 0.5 ? 1 : -1) * 1.6;
        }

        ant.heading = wrap(ant.heading + clamp(turn, -maxTurn * 1.8, maxTurn * 1.8));
        const step = ant.speed * dt;
        const nx = ant.x + Math.cos(ant.heading) * step;
        const ny = ant.y + Math.sin(ant.heading) * step;
        if (!blocked(nx, ny)) {
          ant.x = nx;
          ant.y = ny;
        } else {
          ant.heading += (Math.random() > 0.5 ? 1 : -1) * (0.7 + Math.random());
        }
        ant.x = clamp(ant.x, 3, W - 3);
        ant.y = clamp(ant.y, 3, H - 3);

        if (!ant.hasFood) {
          for (const f of foods) {
            if (f.amount <= 0) continue;
            f.radius = 8 + Math.sqrt(f.amount) * 1.35;
            if (hypot(f.x - ant.x, f.y - ant.y) < f.radius) {
              ant.hasFood = true;
              ant.searchT = 0;
              ant.carryT = 0;
              f.amount -= 1;
              ant.heading += Math.PI + (Math.random() - 0.5) * 0.5;
              burst(ant.x, ant.y, "#d6e36c", 6);
              break;
            }
          }
        } else if (dNest < nest.r * 0.82) {
          ant.hasFood = false;
          ant.carryT = 0;
          harvested += 1;
          nestPulse = 1;
          ant.heading += Math.PI + (Math.random() - 0.5) * 0.8;
          burst(nest.x, nest.y, "#e7a24e", 10);
        }

        if (dNest > nest.r + 2) {
          if (ant.hasFood) deposit(foodA, ant.x, ant.y, 0.02);
          else deposit(homeA, ant.x, ant.y, 0.012 * Math.min(1, dNest / 48));
        }
      }
      foods = foods.filter((f) => f.amount > 0);
    }

    function diffuse(src, dst, keep) {
      const cols = COLS, rows = ROWS;
      for (let y = 1; y < rows - 1; y++) {
        const row = y * cols;
        for (let x = 1; x < cols - 1; x++) {
          const i = row + x;
          if (walls[i]) { dst[i] = 0; continue; }
          const blur = (src[i] * 4 + src[i - 1] + src[i + 1] + src[i - cols] + src[i + cols]) * 0.125;
          dst[i] = (src[i] * 0.74 + blur * 0.26) * keep;
        }
      }
    }

    function evaporateKeep(dt) {
      const half = 0.45 + (C.fade / 100) * 4.6;
      return Math.pow(0.5, dt / half);
    }

    function tick(dt) {
      updateAnts(dt);
      const keep = evaporateKeep(dt);
      diffuse(foodA, foodB, keep);
      diffuse(homeA, homeB, keep);
      let t = foodA; foodA = foodB; foodB = t;
      t = homeA; homeA = homeB; homeB = t;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt * 1.7;
        p.vy += 28 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].life -= dt * 1.4;
        if (rings[i].life <= 0) rings.splice(i, 1);
      }
      nestPulse *= Math.exp(-dt * 3.4);
    }

    function drawAnt(ant, t) {
      ctx.save();
      ctx.translate(ant.x, ant.y);
      ctx.rotate(ant.heading);
      const g = REDUCE ? 0 : Math.sin(t * 17 + ant.seed) * 0.32;
      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath();
      ctx.ellipse(0, 1.15, 4.1, 1.45, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(32,18,12,0.9)";
      ctx.lineWidth = 0.7;
      ctx.lineCap = "round";
      const legs = [[-2.3, 1], [0.1, -1], [1.7, 1]];
      for (const [bx, s] of legs) {
        const k = s * g;
        ctx.beginPath();
        ctx.moveTo(bx, 0.2);
        ctx.lineTo(bx - 1.1, 3.1 + k);
        ctx.moveTo(bx, -0.2);
        ctx.lineTo(bx - 1.1, -3.1 - k);
        ctx.stroke();
      }
      ctx.fillStyle = ant.hasFood ? "#c56a28" : "#5c3422";
      ctx.beginPath();
      ctx.ellipse(-2.85, 0, 3.25, 2.02, 0, 0, TAU);
      ctx.fill();
      if (ant.hasFood) {
        ctx.fillStyle = "rgba(255,176,72,0.55)";
        ctx.beginPath();
        ctx.ellipse(-2.7, 0, 2.15, 1.2, 0, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(255,220,190,0.13)";
      ctx.beginPath();
      ctx.ellipse(-2.9, -0.7, 1.8, 0.55, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "#432418";
      ctx.beginPath();
      ctx.ellipse(0.15, 0, 1.85, 1.42, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "#321910";
      ctx.beginPath();
      ctx.ellipse(2.45, 0, 1.65, 1.38, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "#27140e";
      ctx.lineWidth = 0.55;
      ctx.beginPath();
      ctx.moveTo(3.5, 0.15);
      ctx.quadraticCurveTo(5.4, 1.7 + g, 6.6, 1.15);
      ctx.moveTo(3.5, -0.15);
      ctx.quadraticCurveTo(5.4, -1.7 - g, 6.6, -1.15);
      ctx.stroke();
      if (ant.hasFood) {
        ctx.fillStyle = "#dce56a";
        ctx.beginPath();
        ctx.arc(4.15, 0, 1.28, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFood(f) {
      const n = Math.min(46, Math.max(3, f.amount | 0));
      f.radius = 8 + Math.sqrt(f.amount) * 1.35;
      const glow = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, f.radius * 1.8);
      glow.addColorStop(0, "rgba(210,230,90,0.28)");
      glow.addColorStop(1, "rgba(210,230,90,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.radius * 1.8, 0, TAU);
      ctx.fill();
      let s = (f.id * 99991) % 2147483647;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s % 1000) / 1000; };
      for (let i = 0; i < n; i++) {
        const ang = rnd() * TAU;
        const rad = Math.sqrt(rnd()) * f.radius;
        const gx = f.x + Math.cos(ang) * rad;
        const gy = f.y + Math.sin(ang) * rad * 0.82;
        const r = 1.3 + rnd() * 1.7;
        ctx.fillStyle = rnd() > 0.35 ? "#d7e56a" : "#b8c94a";
        ctx.beginPath();
        ctx.ellipse(gx, gy, r, r * 0.72, ang, 0, TAU);
        ctx.fill();
      }
    }

    function drawNestMound() {
      const { x, y, r } = nest;
      for (let i = 6; i >= 1; i--) {
        ctx.beginPath();
        ctx.ellipse(x, y + i * 0.8, r + i * 6.5, (r + i * 6.5) * 0.7, 0, 0, TAU);
        ctx.fillStyle = "rgba(" + (28 + i * 5) + "," + (22 + i * 3) + "," + (16 + i * 2) + ",0.28)";
        ctx.fill();
      }
      const pulse = 0.16 + nestPulse * 0.22;
      const g = ctx.createRadialGradient(x, y, 2, x, y, r * 3.2);
      g.addColorStop(0, "rgba(255,176,80," + (pulse + 0.08) + ")");
      g.addColorStop(0.35, "rgba(180,90,30,0.1)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 3.2, 0, TAU);
      ctx.fill();
    }

    function drawNestHole() {
      const { x, y, r } = nest;
      const g = ctx.createRadialGradient(x, y - 2, 1, x, y, r);
      g.addColorStop(0, "#050302");
      g.addColorStop(0.55, "#120e0a");
      g.addColorStop(1, "rgba(16,12,9,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.92, r * 0.78, 0, 0, TAU);
      ctx.fill();
      if (harvested > 0) {
        ctx.fillStyle = "rgba(231,162,78,0.35)";
        ctx.beginPath();
        ctx.ellipse(x, y + 4, 6 + Math.min(14, harvested * 0.04), 4, 0, 0, TAU);
        ctx.fill();
      }
    }

    function drawPheromones() {
      const data = pherImg.data;
      const n = COLS * ROWS;
      for (let i = 0; i < n; i++) {
        const o = i * 4;
        if (walls[i]) {
          data[o] = data[o + 1] = data[o + 2] = data[o + 3] = 0;
          continue;
        }
        const fv = Math.sqrt(foodA[i]);
        const hv = Math.sqrt(homeA[i]);
        data[o] = Math.min(255, fv * 255 + hv * 28);
        data[o + 1] = Math.min(255, fv * 98 + hv * 138);
        data[o + 2] = Math.min(255, fv * 32 + hv * 255);
        data[o + 3] = Math.min(255, (fv * 0.9 + hv * 0.72) * 255);
      }
      pherCtx.putImageData(pherImg, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(pherC, 0, 0, W, H);
      ctx.restore();
    }

    function render(t) {
      ctx.drawImage(soil, 0, 0);
      drawPheromones();
      if (wallC.width) ctx.drawImage(wallC, 0, 0);
      drawNestMound();
      for (const f of foods) drawFood(f);
      for (const ant of ants) {
        if (hypot(ant.x - nest.x, ant.y - nest.y) < nest.r * 0.35) continue;
        drawAnt(ant, t);
      }
      drawNestHole();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (const r of rings) {
        ctx.strokeStyle = r.color + (r.life * 0.7) + ")";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(r.x, r.y, (1 - r.life) * 26 + 8, 0, TAU);
        ctx.stroke();
      }
      if (!REDUCE) {
        ctx.fillStyle = "rgba(255,220,170,0.07)";
        for (const m of motes) {
          const x = (m.x * W + t * 6 * m.z) % W;
          const y = (m.y * H + t * 3 * m.z) % H;
          ctx.beginPath();
          ctx.arc(x < 0 ? x + W : x, y < 0 ? y + H : y, 0.55 + m.z * 0.8, 0, TAU);
          ctx.fill();
        }
      }
      const vg = ctx.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.2, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.52)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      if (mouse.inside) {
        ctx.beginPath();
        const stone = (C.tool === "stone") || mouse.shift;
        const erase = C.tool === "erase" || mouse.alt;
        ctx.strokeStyle = erase ? "rgba(243,234,219,0.35)" : stone ? "rgba(180,170,160,0.55)" : "rgba(214,227,108,0.6)";
        ctx.lineWidth = 1.2;
        ctx.arc(mouse.x, mouse.y, stone || erase ? 17 : 10, 0, TAU);
        ctx.stroke();
      }
      if (paused) {
        ctx.fillStyle = "rgba(8,6,5,0.28)";
        ctx.fillRect(0, 0, W, H);
      }
    }

    function syncStats() {
      let seek = 0, carry = 0, left = 0;
      for (const a of ants) (a.hasFood ? carry++ : seek++);
      for (const f of foods) left += Math.max(0, f.amount | 0);
      document.getElementById("stHarvest").textContent = harvested;
      document.getElementById("stSeek").textContent = seek;
      document.getElementById("stCarry").textContent = carry;
      document.getElementById("stFood").textContent = left;
    }

    function applyTool(x, y, isClick) {
      const erase = C.tool === "erase" || mouse.alt;
      const stone = !erase && (C.tool === "stone" || mouse.shift || mouse.button === 2);
      if (erase) brushWall(x, y, 0);
      else if (stone) brushWall(x, y, 1);
      else if (isClick || hypot(x - lastDropX, y - lastDropY) > 26) {
        placeFood(x, y, isClick ? 64 : 36);
        lastDropX = x;
        lastDropY = y;
      }
    }

    function posFromEvent(e) {
      const r = view.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function setTool(name) {
      C.tool = name;
      document.getElementById("toolFood").classList.toggle("active", name === "food");
      document.getElementById("toolStone").classList.toggle("active", name === "stone");
      document.getElementById("toolErase").classList.toggle("active", name === "erase");
    }

    function bind() {
      view.addEventListener("pointerdown", (e) => {
        view.setPointerCapture(e.pointerId);
        const p = posFromEvent(e);
        mouse.down = true;
        mouse.button = e.button;
        mouse.shift = e.shiftKey;
        mouse.alt = e.altKey;
        mouse.x = p.x;
        mouse.y = p.y;
        lastDropX = -999;
        applyTool(p.x, p.y, true);
        e.preventDefault();
      });
      view.addEventListener("pointermove", (e) => {
        const p = posFromEvent(e);
        mouse.x = p.x;
        mouse.y = p.y;
        mouse.inside = true;
        mouse.shift = e.shiftKey;
        mouse.alt = e.altKey;
        if (mouse.down) applyTool(p.x, p.y, false);
      });
      view.addEventListener("pointerup", () => { mouse.down = false; });
      view.addEventListener("pointercancel", () => { mouse.down = false; });
      view.addEventListener("pointerleave", () => { mouse.inside = false; });
      view.addEventListener("contextmenu", (e) => e.preventDefault());

      document.getElementById("btnPause").addEventListener("click", () => {
        paused = !paused;
        document.getElementById("btnPause").textContent = paused ? "Run" : "Pause";
      });
      document.getElementById("btnReset").addEventListener("click", reset);
      document.getElementById("toolFood").addEventListener("click", () => setTool("food"));
      document.getElementById("toolStone").addEventListener("click", () => setTool("stone"));
      document.getElementById("toolErase").addEventListener("click", () => setTool("erase"));

      const antsEl = document.getElementById("rngAnts");
      const fadeEl = document.getElementById("rngFade");
      const speedEl = document.getElementById("rngSpeed");
      antsEl.addEventListener("input", () => {
        setPopulation(+antsEl.value);
        document.getElementById("outAnts").textContent = antsEl.value;
      });
      fadeEl.addEventListener("input", () => {
        C.fade = +fadeEl.value;
        document.getElementById("outFade").textContent = fadeEl.value;
      });
      speedEl.addEventListener("input", () => {
        C.speed = +speedEl.value;
        document.getElementById("outSpeed").textContent = (+speedEl.value).toFixed(1) + "×";
      });

      window.addEventListener("keydown", (e) => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON")) {
          if (e.code !== "Space") return;
        }
        if (e.code === "Space") {
          paused = !paused;
          document.getElementById("btnPause").textContent = paused ? "Run" : "Pause";
          e.preventDefault();
        } else if (e.key === "r" || e.key === "R") reset();
        else if (e.key === "1") setTool("food");
        else if (e.key === "2") setTool("stone");
        else if (e.key === "3") setTool("erase");
      });
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      if (!paused) {
        const steps = C.speed > 1.5 ? 2 : 1;
        const sdt = (dt * C.speed) / steps;
        for (let i = 0; i < steps; i++) tick(sdt);
        if (wallDirty) bakeWalls();
      }
      render(now * 0.001);
      statClock += dt;
      if (statClock > 0.12) { statClock = 0; syncStats(); }
      requestAnimationFrame(loop);
    }

    let booted = false;
    function onResize() {
      const oldFoods = foods.map((f) => ({ x: W ? f.x / W : 0.5, y: H ? f.y / H : 0.5, amount: f.amount }));
      const oldAnts = ants.map((a) => ({
        nx: W ? a.x / W : 0.5,
        ny: H ? a.y / H : 0.5,
        heading: a.heading,
        hasFood: a.hasFood,
        speed: a.speed,
        seed: a.seed
      }));
      fit();
      if (!booted) {
        reset();
        booted = true;
        return;
      }
      foods = [];
      for (const f of oldFoods) placeFood(f.x * W, f.y * H, f.amount);
      ants = oldAnts.map((a) => ({
        x: clamp(a.nx * W, 4, W - 4),
        y: clamp(a.ny * H, 4, H - 4),
        heading: a.heading,
        hasFood: a.hasFood,
        speed: a.speed,
        seed: a.seed,
        searchT: 0,
        carryT: 0
      }));
      setPopulation(C.ants);
    }

    window.addEventListener("resize", onResize);
    bind();
    onResize();
    syncStats();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
