<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click</title>
  <style>
    :root {
      --canvas: oklch(0.145 0.018 52);
      --canvas-deep: oklch(0.1 0.016 50);
      --ink: oklch(0.93 0.018 82);
      --ink-muted: oklch(0.74 0.02 72);
      --ink-subtle: oklch(0.58 0.018 68);
      --accent: oklch(0.8 0.12 72);
      --accent-hot: oklch(0.86 0.14 68);
      --metal-hi: oklch(0.8 0.038 82);
      --metal-mid: oklch(0.58 0.03 74);
      --metal-lo: oklch(0.34 0.022 64);
      --cap: oklch(0.2 0.022 52);
      --cap-lit: oklch(0.32 0.05 62);
      --stem: oklch(0.12 0.02 50);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --press: 140ms;
      --heat: 0;
      --plate: min(236px, 72vw);
    }

    @media (color-gamut: p3) {
      :root {
        --accent: oklch(0.8 0.14 72);
        --accent-hot: oklch(0.88 0.16 68);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
    }

    html {
      color-scheme: dark;
      background: var(--canvas-deep);
    }

    body {
      margin: 0;
      font-family: Inter, "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(
          90vw 70vh at 50% 44%,
          color-mix(in oklab, oklch(0.28 0.05 62) calc(var(--heat) * 55%), oklch(0.22 0.028 58)),
          var(--canvas) 42%,
          var(--canvas-deep) 78%
        );
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100dvh;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(1.25rem, env(safe-area-inset-left));
    }

    ::selection {
      background: color-mix(in oklab, var(--accent) 40%, transparent);
      color: var(--ink);
    }

    .skip {
      position: absolute;
      inset-inline-start: 1rem;
      top: 1rem;
      z-index: 20;
      padding: 0.5rem 0.75rem;
      background: var(--canvas);
      color: var(--ink);
      border: 2px solid var(--accent);
      border-radius: 8px;
      text-decoration: none;
      transform: translateY(-200%);
    }

    .skip:focus {
      transform: none;
    }

    .skip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 2.5rem;
    }

    .sound {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      padding: 0.45rem 0.7rem;
      border: 0;
      border-radius: 8px;
      background: color-mix(in oklab, var(--ink) 6%, transparent);
      color: var(--ink-muted);
      font: 500 0.8125rem/1.2 inherit;
      letter-spacing: 0.01em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        color 150ms ease,
        background-color 150ms ease;
    }

    .sound:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .sound-icons {
      position: relative;
      width: 1.05rem;
      height: 1.05rem;
      flex: 0 0 auto;
    }

    .sound svg {
      width: 1.05rem;
      height: 1.05rem;
      display: block;
    }

    .icon-on,
    .icon-off {
      position: absolute;
      inset: 0;
      transition: opacity 150ms cubic-bezier(0.2, 0, 0, 1);
    }

    .icon-off { opacity: 0; }
    .sound[aria-pressed="false"] .icon-on { opacity: 0; }
    .sound[aria-pressed="false"] .icon-off { opacity: 1; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding-block: 1rem 2rem;
    }

    .intro {
      text-align: center;
      max-width: 22rem;
    }

    .eyebrow {
      margin: 0 0 0.45rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      text-wrap: balance;
    }

    .lede {
      margin: 0.45rem 0 0;
      color: var(--ink-muted);
      font-size: 0.9375rem;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .stage {
      position: relative;
      width: var(--plate);
      height: var(--plate);
      display: grid;
      place-items: center;
      touch-action: manipulation;
    }

    .floor {
      position: absolute;
      width: 78%;
      height: 22%;
      left: 11%;
      bottom: 2%;
      background: radial-gradient(ellipse, oklch(0.05 0.02 50 / 0.62), transparent 72%);
      pointer-events: none;
      transform: translateY(18%);
      transition: opacity var(--press) var(--ease-out), transform var(--press) var(--ease-out);
    }

    .switch[data-pressed="true"] ~ .floor,
    .stage:has(.switch[data-pressed="true"]) .floor {
      opacity: 0.55;
      transform: translateY(18%) scaleX(0.92);
    }

    .ripples {
      position: absolute;
      inset: -18%;
      pointer-events: none;
      z-index: 1;
    }

    .ring {
      position: absolute;
      inset: 22%;
      border-radius: 50%;
      border: 1.5px solid color-mix(in oklab, var(--accent) 72%, white);
      opacity: 0.65;
      transform: scale(0.92);
      animation: ripple 680ms var(--ease-out) forwards;
    }

    .ring-charged {
      border-width: 2.5px;
      border-color: var(--accent-hot);
      animation-duration: 920ms;
    }

    @keyframes ripple {
      to {
        transform: scale(1.58);
        opacity: 0;
      }
    }

    .flash {
      position: absolute;
      inset: -40%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        circle at 50% 50%,
        color-mix(in oklab, var(--accent-hot) 28%, transparent),
        transparent 58%
      );
      opacity: 0;
    }

    .switch {
      position: relative;
      z-index: 2;
      width: var(--plate);
      height: var(--plate);
      padding: 0;
      border: 0;
      border-radius: 22%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      color: inherit;
      font: inherit;
      isolation: isolate;
    }

    .switch:focus {
      outline: none;
    }

    .switch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    .plate {
      position: absolute;
      inset: 0;
      border-radius: 22%;
      background:
        linear-gradient(
          145deg,
          color-mix(in oklab, var(--metal-hi) 55%, var(--metal-mid)),
          var(--metal-lo) 42%,
          color-mix(in oklab, var(--metal-mid) 70%, var(--metal-hi))
        );
      box-shadow:
        inset 0 1px 0 color-mix(in oklab, var(--metal-hi) 55%, transparent),
        inset 0 -2px 6px oklch(0.12 0.02 50 / 0.55),
        0 1px 0 oklch(0.86 0.04 85 / 0.18),
        0 22px 40px oklch(0.05 0.02 50 / 0.5);
      pointer-events: none;
    }

    .plate::after {
      content: "";
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 210deg,
          var(--metal-lo),
          var(--metal-hi),
          var(--metal-mid),
          var(--metal-hi),
          oklch(0.28 0.02 60),
          var(--metal-mid),
          var(--metal-lo)
        );
      box-shadow:
        0 0 0 1px oklch(0.2 0.02 55 / 0.55),
        inset 0 1px 0 oklch(0.9 0.03 85 / 0.28);
    }

    .screw {
      position: absolute;
      width: 7.5%;
      height: 7.5%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal-lo) 72%);
      box-shadow:
        inset 0 1px 0 oklch(1 0 0 / 0.28),
        0 1px 1px oklch(0.1 0.02 50 / 0.7);
      z-index: 1;
      pointer-events: none;
    }

    .screw::before {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      top: 46%;
      height: 12%;
      background: oklch(0.16 0.02 50 / 0.85);
      border-radius: 1px;
      transform: rotate(var(--slot, 18deg));
    }

    .screw-tl { top: 7.5%; left: 7.5%; --slot: 16deg; }
    .screw-tr { top: 7.5%; right: 7.5%; --slot: -28deg; }
    .screw-bl { bottom: 7.5%; left: 7.5%; --slot: 42deg; }
    .screw-br { bottom: 7.5%; right: 7.5%; --slot: -8deg; }

    .well {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: oklch(0.09 0.018 50);
      box-shadow:
        inset 0 10px 18px oklch(0.04 0.02 50 / 0.88),
        inset 0 -3px 6px oklch(0.55 0.03 80 / 0.12);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 2;
    }

    .pip {
      position: absolute;
      top: 12.2%;
      left: 50%;
      width: 4.2%;
      height: 4.2%;
      translate: -50% 0;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, var(--accent-hot), oklch(0.45 0.1 55));
      box-shadow: 0 0 8px color-mix(in oklab, var(--accent) 45%, transparent);
      z-index: 3;
      pointer-events: none;
      opacity: calc(0.35 + var(--heat) * 0.65);
    }

    .actuator {
      position: relative;
      width: 82%;
      height: 82%;
      display: grid;
      place-items: center;
      transform: translateY(-5%);
      transition: transform var(--press) var(--ease-out);
      z-index: 2;
    }

    .stem {
      position: absolute;
      width: 100%;
      height: 22%;
      bottom: 12%;
      border-radius: 50% / 20%;
      background:
        linear-gradient(
          oklch(0.16 0.02 52),
          var(--stem)
        );
      transform-origin: top center;
      transition: transform var(--press) var(--ease-out);
    }

    .cap {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, oklch(0.42 0.045 62), transparent 36%),
        radial-gradient(circle at 50% 100%, oklch(0.12 0.02 50), transparent 42%),
        radial-gradient(circle at 50% 54%, var(--cap-lit), var(--cap));
      box-shadow:
        inset 0 1px 0 oklch(1 0 0 / 0.2),
        inset 0 -10px 18px oklch(0.05 0.02 50 / 0.45),
        0 10px 16px oklch(0.05 0.02 50 / 0.4);
      overflow: hidden;
      transition:
        transform var(--press) var(--ease-out),
        box-shadow var(--press) var(--ease-out);
    }

    .specular {
      position: absolute;
      left: 18%;
      top: 12%;
      width: 46%;
      height: 28%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, oklch(1 0 0 / 0.28), transparent 70%);
      transform: rotate(-18deg);
      pointer-events: none;
      transition: opacity var(--press) var(--ease-out), transform var(--press) var(--ease-out);
    }

    .filament {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        color-mix(in oklab, var(--accent-hot) 80%, white),
        color-mix(in oklab, var(--accent) 35%, transparent) 46%,
        transparent 72%
      );
      opacity: 0.12;
      mix-blend-mode: screen;
      transform: scale(0.92);
      transition:
        opacity var(--press) var(--ease-out),
        transform var(--press) var(--ease-out);
    }

    .charge {
      position: absolute;
      inset: 11.5%;
      z-index: 4;
      pointer-events: none;
      transform: rotate(-90deg);
    }

    .charge circle {
      fill: none;
      stroke-width: 1.75;
    }

    .charge-track {
      stroke: color-mix(in oklab, var(--ink) 12%, transparent);
    }

    .charge-fill {
      stroke: var(--accent-hot);
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      opacity: 0;
      transition:
        stroke-dashoffset 200ms var(--ease-out),
        opacity 200ms var(--ease-out);
    }

    .switch[data-pressed="true"] .actuator {
      transform: translateY(4%);
    }

    .switch[data-pressed="true"] .stem {
      transform: scaleY(0.28);
    }

    .switch[data-pressed="true"] .cap {
      transform: scale(0.97);
      box-shadow:
        inset 0 8px 16px oklch(0.05 0.02 50 / 0.55),
        inset 0 1px 0 oklch(1 0 0 / 0.08),
        0 2px 4px oklch(0.05 0.02 50 / 0.35);
    }

    .switch[data-pressed="true"] .specular {
      opacity: 0.4;
      transform: rotate(-18deg) translateY(10%);
    }

    .switch[data-pressed="true"] .filament {
      opacity: 0.55;
      transform: scale(1);
    }

    .switch[data-holding="true"] .charge-fill {
      stroke-dashoffset: 0;
      opacity: 1;
      transition:
        stroke-dashoffset 720ms linear,
        opacity 120ms ease;
    }

    .switch[data-holding="true"] .filament {
      opacity: 0.82;
      transform: scale(1.04);
      transition:
        opacity 720ms linear,
        transform 720ms linear;
    }

    .switch[data-charged="true"] .filament {
      opacity: 1;
      transform: scale(1.08);
    }

    .switch[data-charged="true"] .pip {
      opacity: 1;
    }

    .readout {
      text-align: center;
      min-height: 4.25rem;
    }

    .odometer {
      display: inline-flex;
      gap: 0.08em;
      font-size: clamp(2rem, 8vw, 2.75rem);
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      transition: color 280ms var(--ease-out);
    }

    .odometer.is-tick {
      color: var(--accent-hot);
    }

    .wheel {
      display: inline-block;
      height: 1em;
      overflow: hidden;
    }

    .strip {
      display: flex;
      flex-direction: column;
      line-height: 1;
      transition: transform 280ms var(--ease-out);
    }

    .strip i {
      font-style: normal;
      font-weight: 500;
      height: 1em;
      display: block;
    }

    .unit {
      margin: 0.45rem 0 0;
      color: var(--ink-subtle);
      font-size: 0.8125rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .hint {
      margin: 0;
      color: var(--ink-subtle);
      font-size: 0.8125rem;
      line-height: 1.45;
      text-align: center;
      text-wrap: pretty;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .sound:hover {
        color: var(--ink);
        background: color-mix(in oklab, var(--ink) 10%, transparent);
      }

      .switch:hover .cap {
        background:
          radial-gradient(circle at 34% 28%, oklch(0.48 0.05 64), transparent 36%),
          radial-gradient(circle at 50% 100%, oklch(0.14 0.02 50), transparent 42%),
          radial-gradient(circle at 50% 54%, oklch(0.36 0.055 62), var(--cap));
      }

      .switch:hover .filament {
        opacity: 0.22;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .actuator,
      .stem,
      .cap,
      .specular,
      .filament,
      .strip,
      .floor,
      .charge-fill,
      .sound,
      .odometer,
      .icon-on,
      .icon-off {
        transition: none !important;
      }

      .ring,
      .ring-charged {
        animation: fade-ring 280ms ease forwards;
      }

      @keyframes fade-ring {
        from { opacity: 0.5; transform: scale(1); }
        to { opacity: 0; transform: scale(1); }
      }

      .switch[data-holding="true"] .charge-fill,
      .switch[data-holding="true"] .filament {
        transition: none !important;
      }
    }

    @media (prefers-contrast: more) {
      .switch:focus-visible,
      .sound:focus-visible,
      .skip:focus-visible {
        outline-width: 3px;
      }

      .plate {
        outline: 2px solid var(--ink);
      }

      .unit, .lede, .hint, .sound {
        color: var(--ink);
      }
    }

    @media (forced-colors: active) {
      .plate,
      .cap,
      .filament,
      .pip,
      .floor,
      .flash {
        forced-color-adjust: none;
      }

      .switch {
        outline: 3px solid ButtonText;
        background: ButtonFace;
      }

      .switch[data-pressed="true"] {
        outline-color: Highlight;
      }

      .sound {
        border: 1px solid ButtonText;
      }
    }

    @media (max-width: 380px) {
      h1 { font-size: 1.2rem; }
      main { gap: 1.25rem; }
      :root { --plate: min(210px, 78vw); }
    }
  </style>
</head>
<body>
  <a class="skip" href="#click">Skip to button</a>

  <div class="topbar">
    <button class="sound" type="button" id="sound" aria-pressed="true">
      <span class="sound-icons" aria-hidden="true">
        <svg class="icon-on" viewBox="0 0 24 24">
          <path fill="currentColor" d="M4.5 9.5h3.2l5.3-4.2v13.4l-5.3-4.2H4.5z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M16.2 9.2c1.4 1.3 1.4 4.3 0 5.6"/>
          <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M18.4 7.2c2.3 2.2 2.3 7.4 0 9.6"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24">
          <path fill="currentColor" d="M4.5 9.5h3.2l5.3-4.2v13.4l-5.3-4.2H4.5z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M16 9.5 20.5 14.5"/>
          <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M20.5 9.5 16 14.5"/>
        </svg>
      </span>
      <span id="sound-label">Sound on</span>
    </button>
  </div>

  <main>
    <header class="intro">
      <p class="eyebrow">Studio switch</p>
      <h1>A click with weight</h1>
      <p class="lede">Press to fire. Hold until the ring fills for a deeper one.</p>
    </header>

    <div class="stage" id="stage">
      <span class="flash" id="flash" aria-hidden="true"></span>
      <span class="ripples" id="ripples" aria-hidden="true"></span>
      <button class="switch" type="button" id="click" aria-describedby="count-text">
        <span class="plate" aria-hidden="true">
          <span class="screw screw-tl"></span>
          <span class="screw screw-tr"></span>
          <span class="screw screw-bl"></span>
          <span class="screw screw-br"></span>
          <span class="pip"></span>
        </span>
        <svg class="charge" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="charge-track" cx="50" cy="50" r="46"></circle>
          <circle class="charge-fill" cx="50" cy="50" r="46" pathLength="100"></circle>
        </svg>
        <span class="well" aria-hidden="true">
          <span class="actuator">
            <span class="stem"></span>
            <span class="cap">
              <span class="filament"></span>
              <span class="specular"></span>
            </span>
          </span>
        </span>
        <span class="sr-only">Click</span>
      </button>
      <span class="floor" aria-hidden="true"></span>
    </div>

    <div class="readout">
      <div class="odometer" id="odometer" aria-hidden="true">
        <span class="wheel" data-place="0"><span class="strip"></span></span>
        <span class="wheel" data-place="1"><span class="strip"></span></span>
        <span class="wheel" data-place="2"><span class="strip"></span></span>
        <span class="wheel" data-place="3"><span class="strip"></span></span>
      </div>
      <p class="unit">Clicks</p>
      <p class="sr-only" id="count-text">0 clicks</p>
    </div>

    <p class="hint">Space or Enter also works. Sound is part of the feel.</p>
  </main>

  <script>
    (function () {
      const CHARGE_MS = 720;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const switchEl = document.getElementById("click");
      const soundBtn = document.getElementById("sound");
      const soundLabel = document.getElementById("sound-label");
      const ripples = document.getElementById("ripples");
      const flash = document.getElementById("flash");
      const stage = document.getElementById("stage");
      const odometer = document.getElementById("odometer");
      const countText = document.getElementById("count-text");
      const wheels = [...odometer.querySelectorAll(".wheel")];

      let count = 0;
      let soundOn = true;
      let audioCtx = null;
      let live = false;
      let charged = false;
      let chargeTimer = 0;
      let ignoreClick = false;
      let voices = [];
      let settleAnim = null;

      wheels.forEach((wheel) => {
        const strip = wheel.querySelector(".strip");
        for (let n = 0; n <= 10; n += 1) {
          const i = document.createElement("i");
          i.textContent = String(n % 10);
          strip.appendChild(i);
        }
        wheel.dataset.digit = "0";
        strip.dataset.index = "0";
      });

      function digitsOf(n) {
        const s = String(n % 10000).padStart(4, "0");
        return [...s].map(Number);
      }

      function setWheels(n, animate) {
        const next = digitsOf(n);
        wheels.forEach((wheel, idx) => {
          const strip = wheel.querySelector(".strip");
          const from = Number(wheel.dataset.digit);
          const to = next[idx];
          let index = to;
          if (animate && to < from) index = 10;
          if (!reduce && animate) {
            strip.style.transition = "transform 280ms cubic-bezier(0.23, 1, 0.32, 1)";
          } else {
            strip.style.transition = "none";
          }
          strip.style.transform = "translateY(" + (-index) + "em)";
          strip.dataset.index = String(index);
          wheel.dataset.digit = String(to);
          if (index === 10) {
            const snap = () => {
              strip.style.transition = "none";
              strip.style.transform = "translateY(0em)";
              strip.dataset.index = "0";
              strip.removeEventListener("transitionend", snap);
            };
            strip.addEventListener("transitionend", snap);
          }
        });
      }

      function ctx() {
        if (!audioCtx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          audioCtx = new C();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function pruneVoices(now) {
        voices = voices.filter((v) => {
          if (v.until < now) {
            try { v.stop(); } catch (e) {}
            return false;
          }
          return true;
        });
        while (voices.length > 10) {
          const old = voices.shift();
          try { old.stop(); } catch (e) {}
        }
      }

      function tone(ac, type, freq, t, dur, gain, peak) {
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(gain);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        voices.push({ until: t + dur + 0.05, stop: () => { try { osc.stop(); } catch (e) {} } });
      }

      function noiseBurst(ac, t, dur, peak, highpass) {
        const length = Math.max(1, Math.floor(ac.sampleRate * dur));
        const buffer = ac.createBuffer(1, length, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buffer;
        const filter = ac.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = highpass;
        const g = ac.createGain();
        g.gain.setValueAtTime(peak, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(filter);
        filter.connect(g);
        g.connect(ac.destination);
        src.start(t);
        src.stop(t + dur + 0.02);
        voices.push({ until: t + dur + 0.05, stop: () => { try { src.stop(); } catch (e) {} } });
      }

      function playClick(kind) {
        if (!soundOn) return;
        const ac = ctx();
        if (!ac) return;
        const t = ac.currentTime;
        pruneVoices(t);
        const jitter = 0.97 + Math.random() * 0.06;
        const master = ac.createGain();
        master.gain.value = kind === "ready" ? 0.18 : 0.28;
        master.connect(ac.destination);

        if (kind === "ready") {
          tone(ac, "sine", 880 * jitter, t, 0.12, master, 0.09);
          tone(ac, "sine", 1320 * jitter, t, 0.1, master, 0.04);
          return;
        }

        noiseBurst(ac, t, kind === "charged" ? 0.045 : 0.028, kind === "charged" ? 0.22 : 0.16, 1800);
        tone(ac, "sine", (kind === "charged" ? 92 : 148) * jitter, t, kind === "charged" ? 0.16 : 0.07, master, kind === "charged" ? 0.22 : 0.12);
        tone(ac, "triangle", (kind === "charged" ? 196 : 240) * jitter, t, 0.05, master, 0.07);
        tone(ac, "sine", (kind === "charged" ? 2100 : 2460) * jitter, t, kind === "charged" ? 0.11 : 0.07, master, kind === "charged" ? 0.08 : 0.06);
        if (kind === "charged") {
          tone(ac, "sine", 58 * jitter, t, 0.22, master, 0.16);
        }
      }

      function haptic(kind) {
        if (!navigator.vibrate) return;
        if (kind === "charged") navigator.vibrate([10, 24, 18]);
        else if (kind === "ready") navigator.vibrate(8);
        else navigator.vibrate(12);
      }

      function spawnRing(chargedHit) {
        if (reduce) return;
        const ring = document.createElement("span");
        ring.className = chargedHit ? "ring ring-charged" : "ring";
        ripples.appendChild(ring);
        ring.addEventListener("animationend", () => ring.remove());
      }

      function pulseFlash(chargedHit) {
        if (reduce) {
          flash.style.opacity = "0";
          return;
        }
        flash.animate(
          [
            { opacity: chargedHit ? 0.9 : 0.45 },
            { opacity: 0 }
          ],
          { duration: chargedHit ? 420 : 220, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }
        );
      }

      function settleCap() {
        if (reduce) return;
        const cap = switchEl.querySelector(".actuator");
        if (settleAnim) settleAnim.cancel();
        settleAnim = cap.animate(
          [
            { transform: "translateY(4%)" },
            { transform: "translateY(-1.6%)", offset: 0.38 },
            { transform: "translateY(-5%)" }
          ],
          { duration: 280, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }
        );
      }

      function renderCount(animate) {
        setWheels(count, animate);
        const label = count === 1 ? "1 click" : count + " clicks";
        countText.textContent = label;
        switchEl.setAttribute("aria-label", "Click, " + label);
        odometer.classList.add("is-tick");
        window.setTimeout(() => odometer.classList.remove("is-tick"), reduce ? 0 : 280);
        const heat = Math.min(1, count / 48);
        document.documentElement.style.setProperty("--heat", String(heat));
      }

      function strike(kind) {
        count += 1;
        renderCount(true);
        playClick(kind);
        haptic(kind);
        spawnRing(kind === "charged");
        pulseFlash(kind === "charged");
      }

      function armCharge() {
        window.clearTimeout(chargeTimer);
        charged = false;
        switchEl.removeAttribute("data-charged");
        if (reduce) {
          chargeTimer = window.setTimeout(() => {
            charged = true;
            switchEl.setAttribute("data-charged", "true");
            playClick("ready");
            haptic("ready");
          }, CHARGE_MS);
          return;
        }
        chargeTimer = window.setTimeout(() => {
          charged = true;
          switchEl.setAttribute("data-charged", "true");
          playClick("ready");
          haptic("ready");
        }, CHARGE_MS);
      }

      function press() {
        if (live) return;
        live = true;
        if (settleAnim) {
          settleAnim.cancel();
          settleAnim = null;
        }
        ctx();
        switchEl.setAttribute("data-pressed", "true");
        if (!reduce) switchEl.setAttribute("data-holding", "true");
        armCharge();
      }

      function release() {
        if (!live) return;
        window.clearTimeout(chargeTimer);
        const wasCharged = charged;
        live = false;
        charged = false;
        switchEl.removeAttribute("data-pressed");
        switchEl.removeAttribute("data-holding");
        switchEl.removeAttribute("data-charged");
        strike(wasCharged ? "charged" : "click");
        settleCap();
      }

      function cancelPress() {
        if (!live) return;
        window.clearTimeout(chargeTimer);
        live = false;
        charged = false;
        ignoreClick = false;
        switchEl.removeAttribute("data-pressed");
        switchEl.removeAttribute("data-holding");
        switchEl.removeAttribute("data-charged");
      }

      switchEl.addEventListener("pointerdown", (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        ignoreClick = true;
        switchEl.setPointerCapture(event.pointerId);
        press();
      });

      switchEl.addEventListener("pointerup", () => {
        release();
      });

      switchEl.addEventListener("pointercancel", cancelPress);

      switchEl.addEventListener("click", (event) => {
        if (ignoreClick) {
          ignoreClick = false;
          event.preventDefault();
          return;
        }
        press();
        release();
      });

      switchEl.addEventListener("keydown", (event) => {
        if (event.code !== "Space" && event.code !== "Enter") return;
        if (event.repeat) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        ignoreClick = true;
        press();
      });

      switchEl.addEventListener("keyup", (event) => {
        if (event.code !== "Space" && event.code !== "Enter") return;
        event.preventDefault();
        release();
      });

      switchEl.addEventListener("blur", cancelPress);
      switchEl.addEventListener("contextmenu", (event) => event.preventDefault());

      window.addEventListener("pointerup", () => {
        if (live) release();
      });

      soundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
        soundLabel.textContent = soundOn ? "Sound on" : "Sound off";
        if (soundOn) ctx();
      });

      setWheels(0, false);
    })();
  </script>
</body>
</html>
