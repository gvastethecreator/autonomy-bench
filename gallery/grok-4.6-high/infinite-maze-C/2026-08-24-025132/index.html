<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Narthex — Infinite Cloister</title>
  <style>
    :root {
      --ink: #0a0807;
      --paper: #eadcc4;
      --dim: #9a8b72;
      --amber: #e0b36a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }
    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    #vignette {
      background:
        radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(4, 2, 1, 0.28) 72%, rgba(0, 0, 0, 0.62) 100%);
    }
    #grain {
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.82  0 0 0 0 0.65  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain 0.42s steps(3) infinite;
    }
    @keyframes grain {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-12px, 8px); }
      66% { transform: translate(9px, -11px); }
      100% { transform: translate(0, 0); }
    }
    .letterbox {
      position: fixed;
      left: 0; right: 0;
      height: 6.2vh;
      background: #000;
      z-index: 4;
      pointer-events: none;
      transition: height 0.8s ease;
    }
    .letterbox.top { top: 0; }
    .letterbox.bot { bottom: 0; }
    body.is-paused .letterbox { height: 9vh; }
    #hud {
      position: fixed;
      top: max(28px, calc(6.2vh + 14px));
      left: max(22px, env(safe-area-inset-left));
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    #hud.show { opacity: 1; }
    .mark {
      font-size: 11px;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 10px;
    }
    .place {
      font-size: clamp(22px, 3.4vw, 34px);
      font-style: italic;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-shadow: 0 2px 18px rgba(0,0,0,0.65);
    }
    .meta {
      margin-top: 12px;
      display: flex;
      gap: 18px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .meta b {
      color: var(--paper);
      font-weight: 500;
      letter-spacing: 0.18em;
    }
    #title {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.2s ease;
    }
    #title.show { opacity: 1; }
    #title.hide { opacity: 0; }
    #title h1 {
      font-size: clamp(42px, 9vw, 92px);
      font-weight: 400;
      letter-spacing: 0.52em;
      text-indent: 0.52em;
      line-height: 1;
      text-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }
    #title p {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--dim);
    }
    #hint {
      position: fixed;
      bottom: max(28px, calc(6.2vh + 12px));
      left: 0; right: 0;
      text-align: center;
      z-index: 5;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--dim);
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #hint.show { opacity: 0.85; }
    #pause {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 2, 1, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--paper);
    }
    body.is-paused #pause { opacity: 1; }
    .controls {
      position: fixed;
      top: max(22px, calc(6.2vh + 8px));
      right: max(16px, env(safe-area-inset-right));
      z-index: 8;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .controls button {
      appearance: none;
      border: 1px solid rgba(232, 212, 176, 0.22);
      background: rgba(8, 6, 5, 0.42);
      color: var(--paper);
      width: 40px;
      height: 40px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0;
      backdrop-filter: blur(8px);
      font-family: inherit;
    }
    .controls button:hover,
    .controls button:focus-visible {
      border-color: var(--amber);
      outline: none;
    }
    #fail {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
      background: #0a0807;
    }
    @media (prefers-reduced-motion: reduce) {
      #grain { animation: none; }
    }
    @media (max-width: 640px) {
      .meta { flex-direction: column; gap: 6px; }
      #title h1 { letter-spacing: 0.28em; text-indent: 0.28em; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette" class="overlay"></div>
  <div id="grain" class="overlay"></div>
  <div class="letterbox top"></div>
  <div class="letterbox bot"></div>
  <div id="hud">
    <div class="mark">Narthex</div>
    <div class="place" id="place">The threshold</div>
    <div class="meta">
      <span>Depth <b id="depth">000</b></span>
      <span>Bearing <b id="bearing">S</b></span>
      <span>Hours <b id="hours">I</b></span>
    </div>
  </div>
  <div id="title">
    <h1>NARTHEX</h1>
    <p>The walker does not stop</p>
  </div>
  <div id="hint">Space pause · M mute · F fullscreen · arrows bias the turn</div>
  <div id="pause">Paused</div>
  <div class="controls">
    <button type="button" id="btnMute" aria-label="Mute">♪</button>
    <button type="button" id="btnPause" aria-label="Pause">Ⅱ</button>
  </div>
  <div id="fail">This cloister needs WebGL.</div>

  <script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const canvas = document.getElementById("c");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const mobile = matchMedia("(max-width: 700px)").matches || /Mobi|Android/i.test(navigator.userAgent);

const CHUNK = 8;
const CELL = 4.4;
const WALL_H = 3.15;
const RADIUS = mobile ? 2 : 2;
const MAX_WALL = 4200;
const MAX_ARCH = 2800;
const MAX_COL = 2400;
const MAX_FLOOR = 2200;
const MAX_CEIL = 2200;
const MAX_BEAM = 3600;
const MAX_IVY = 1600;
const MAX_NICHE = 900;

const DIRS = [
  { x: 0, z: -1, name: "N" },
  { x: 1, z: 0, name: "E" },
  { x: 0, z: 1, name: "S" },
  { x: -1, z: 0, name: "W" }
];
const N = 1, E = 2, S = 4, W = 8;
const BIT = [N, E, S, W];

function hashInt(x, y, s = 1) {
  let h = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function hash01(x, y, s = 1) {
  return hashInt(x, y, s) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(t) { return t * t * (3 - 2 * t); }
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const h = (i, j) => hash01(i, j, 97);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), ux), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), ux), uy);
}
function fbm(x, y) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < 5; i++) { v += a * noise2(x * f, y * f); a *= 0.5; f *= 2; }
  return v;
}
function roman(n) {
  const r = [["C",100],["XC",90],["L",50],["XL",40],["X",10],["IX",9],["V",5],["IV",4],["I",1]];
  let s = "";
  for (const [g, v] of r) while (n >= v) { s += g; n -= v; }
  return s || "I";
}

const chunks = new Map();
function chunkKey(cx, cz) { return cx + ":" + cz; }
function worldToChunk(x, z) {
  return { cx: Math.floor(x / CHUNK), cz: Math.floor(z / CHUNK), lx: ((x % CHUNK) + CHUNK) % CHUNK, lz: ((z % CHUNK) + CHUNK) % CHUNK };
}
function openCell(grid, x, z, bit) { grid[z][x] |= bit; }

function generateChunk(cx, cz) {
  const rng = mulberry32(hashInt(cx, cz, 19));
  const grid = Array.from({ length: CHUNK }, () => new Uint8Array(CHUNK));
  const rooms = [];
  const nRooms = rng() < 0.2 ? 0 : rng() < 0.55 ? 1 : 2;
  for (let i = 0; i < nRooms; i++) {
    const rw = 2 + (rng() < 0.4 ? 1 : 0);
    const rh = 2 + (rng() < 0.4 ? 1 : 0);
    const rx = 1 + Math.floor(rng() * (CHUNK - rw - 2));
    const rz = 1 + Math.floor(rng() * (CHUNK - rh - 2));
    let overlap = false;
    for (const r of rooms) {
      if (rx < r.rx + r.rw + 1 && rx + rw + 1 > r.rx && rz < r.rz + r.rh + 1 && rz + rh + 1 > r.rz) overlap = true;
    }
    if (overlap) continue;
    for (let z = rz; z < rz + rh; z++) {
      for (let x = rx; x < rx + rw; x++) {
        if (x < rx + rw - 1) { openCell(grid, x, z, E); openCell(grid, x + 1, z, W); }
        if (z < rz + rh - 1) { openCell(grid, x, z, S); openCell(grid, x, z + 1, N); }
      }
    }
    const openAir = rw * rh >= 6 && rng() < 0.38;
    const pool = rng() < (openAir ? 0.7 : 0.28);
    rooms.push({ rx, rz, rw, rh, openAir, pool });
  }

  const vis = Array.from({ length: CHUNK }, () => new Uint8Array(CHUNK));
  const stack = [];
  let sx = Math.floor(rng() * CHUNK), sz = Math.floor(rng() * CHUNK);
  stack.push([sx, sz]);
  vis[sz][sx] = 1;
  const order = [0, 1, 2, 3];
  while (stack.length) {
    const [x, z] = stack[stack.length - 1];
    for (let i = 3; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    let found = false;
    for (const d of order) {
      const nx = x + DIRS[d].x, nz = z + DIRS[d].z;
      if (nx < 0 || nz < 0 || nx >= CHUNK || nz >= CHUNK || vis[nz][nx]) continue;
      openCell(grid, x, z, BIT[d]);
      openCell(grid, nx, nz, BIT[d ^ 2]);
      vis[nz][nx] = 1;
      stack.push([nx, nz]);
      found = true;
      break;
    }
    if (!found) stack.pop();
  }

  const doorZ = hashInt(cx, cz, 11) % CHUNK;
  const doorX = hashInt(cx, cz, 29) % CHUNK;
  openCell(grid, CHUNK - 1, doorZ, E);
  openCell(grid, doorX, CHUNK - 1, S);
  const nDoorZ = hashInt(cx - 1, cz, 11) % CHUNK;
  const nDoorX = hashInt(cx, cz - 1, 29) % CHUNK;
  openCell(grid, 0, nDoorZ, W);
  openCell(grid, nDoorX, 0, N);

  if (cx === 0 && cz === 0) {
    for (let z = 0; z < 5; z++) {
      openCell(grid, 3, z, S);
      openCell(grid, 3, z + 1 < CHUNK ? z + 1 : z, N);
    }
    rooms.push({ rx: 2, rz: 5, rw: 3, rh: 2, openAir: false, pool: false, start: true });
  }
  return { grid, rooms, cx, cz };
}

function getChunk(cx, cz) {
  const k = chunkKey(cx, cz);
  let ch = chunks.get(k);
  if (!ch) {
    ch = generateChunk(cx, cz);
    chunks.set(k, ch);
  }
  return ch;
}

function cellMask(x, z) {
  const { cx, cz, lx, lz } = worldToChunk(x, z);
  return getChunk(cx, cz).grid[lz][lx];
}
function isOpen(x, z, dir) {
  return (cellMask(x, z) & BIT[dir]) !== 0;
}
function roomAt(x, z) {
  const { cx, cz, lx, lz } = worldToChunk(x, z);
  const ch = getChunk(cx, cz);
  for (const r of ch.rooms) {
    if (lx >= r.rx && lx < r.rx + r.rw && lz >= r.rz && lz < r.rz + r.rh) {
      return r;
    }
  }
  return null;
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !mobile, powerPreference: "high-performance" });
if (!renderer.capabilities.isWebGL2 && !renderer.getContext()) {
  document.getElementById("fail").style.display = "flex";
}
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = !mobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09070a);
scene.fog = new THREE.FogExp2(0x09070a, 0.052);

const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.08, 90);
camera.position.set(0, 1.62, 0);
scene.add(camera);

const hemi = new THREE.HemisphereLight(0x44587a, 0x1a120c, 0.42);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x20160f, 0.16);
scene.add(amb);
const moon = new THREE.DirectionalLight(0xb7c8e8, 0.28);
moon.position.set(10, 22, 8);
moon.castShadow = !mobile;
if (moon.castShadow) {
  moon.shadow.mapSize.set(1024, 1024);
  moon.shadow.camera.near = 2;
  moon.shadow.camera.far = 60;
  moon.shadow.camera.left = -22;
  moon.shadow.camera.right = 22;
  moon.shadow.camera.top = 22;
  moon.shadow.camera.bottom = -22;
}
scene.add(moon);

function makeCanvas(size, fn) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  fn(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const stoneAlbedo = makeCanvas(512, (ctx, size) => {
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const n = fbm(x * 0.035, y * 0.035);
      const n2 = fbm(x * 0.12 + 20, y * 0.12);
      const tile = 64;
      const mx = x % tile, my = y % tile;
      const mortar = (mx < 2 || my < 2 || mx > tile - 2) ? 0.62 : 1;
      const r = (118 + n * 48 + n2 * 18) * mortar;
      const g = (92 + n * 36 + n2 * 10) * mortar;
      const b = (64 + n * 22) * mortar;
      const i = (y * size + x) * 4;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = "rgba(28,18,10,0.28)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 28; i++) {
    ctx.beginPath();
    ctx.moveTo(hash01(i, 2, 4) * size, hash01(i, 3, 5) * size);
    ctx.quadraticCurveTo(hash01(i, 6, 7) * size, hash01(i, 8, 9) * size, hash01(i, 10, 11) * size, hash01(i, 12, 13) * size);
    ctx.stroke();
  }
});
stoneAlbedo.repeat.set(1.4, 1.1);

const stoneRough = makeCanvas(256, (ctx, size) => {
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const n = fbm(x * 0.08, y * 0.08);
    const v = 90 + n * 110;
    const i = (y * size + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
});
stoneRough.colorSpace = THREE.NoColorSpace;

const floorAlbedo = makeCanvas(512, (ctx, size) => {
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const n = fbm(x * 0.04, y * 0.04);
    const tile = 128;
    const mx = Math.abs((x % tile) - tile / 2);
    const my = Math.abs((y % tile) - tile / 2);
    const inlay = (mx < 3 || my < 3) ? 1.18 : 1;
    const r = (52 + n * 28) * inlay;
    const g = (42 + n * 18) * inlay;
    const b = (32 + n * 12) * inlay;
    const i = (y * size + x) * 4;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
});
floorAlbedo.repeat.set(1, 1);

const fresco = makeCanvas(256, (ctx, size) => {
  ctx.fillStyle = "#6d5640";
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = "rgba(210,180,120,0.18)";
  ctx.lineWidth = 3;
  ctx.strokeRect(18, 18, size - 36, size - 36);
  ctx.strokeRect(36, 36, size - 72, size - 72);
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, 44, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = "rgba(120,80,40,0.2)";
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(size / 2, size / 2);
    ctx.lineTo(size / 2 + Math.cos(a) * 90, size / 2 + Math.sin(a) * 90);
    ctx.stroke();
  }
});

const ivyTex = makeCanvas(256, (ctx, size) => {
  ctx.clearRect(0, 0, size, size);
  for (let i = 0; i < 70; i++) {
    const x = hash01(i, 1, 21) * size;
    const y = hash01(i, 2, 22) * size;
    const r = 6 + hash01(i, 3, 23) * 16;
    ctx.fillStyle = `rgba(${30 + hash01(i,4,24)*40},${70 + hash01(i,5,25)*70},${30 + hash01(i,6,26)*20},${0.35 + hash01(i,7,27)*0.45})`;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.7, r, hash01(i, 8, 28) * 6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(40,70,35,0.45)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(size * 0.5, 0);
  for (let y = 0; y < size; y += 8) ctx.lineTo(size * 0.5 + Math.sin(y * 0.08) * 18, y);
  ctx.stroke();
});
ivyTex.colorSpace = THREE.SRGBColorSpace;

const glowTex = makeCanvas(64, (ctx, size) => {
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,228,180,1)");
  g.addColorStop(0.22, "rgba(255,186,92,0.55)");
  g.addColorStop(0.55, "rgba(255,120,40,0.12)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
});
glowTex.wrapS = glowTex.wrapT = THREE.ClampToEdgeWrapping;

const shaftTex = makeCanvas(64, (ctx, size) => {
  const g = ctx.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0, "rgba(190,210,255,0.28)");
  g.addColorStop(0.4, "rgba(180,200,240,0.08)");
  g.addColorStop(1, "rgba(180,200,240,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const s = ctx.createLinearGradient(0, 0, size, 0);
  s.addColorStop(0, "rgba(0,0,0,0.85)");
  s.addColorStop(0.5, "rgba(0,0,0,0)");
  s.addColorStop(1, "rgba(0,0,0,0.85)");
  ctx.fillStyle = s;
  ctx.fillRect(0, 0, size, size);
});
shaftTex.wrapS = shaftTex.wrapT = THREE.ClampToEdgeWrapping;

const envMap = (() => {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 128;
  const ctx = c.getContext("2d");

function mergeGeoms(geoms) {
  let vcount = 0;
  for (const g of geoms) vcount += g.attributes.position.count;
  const pos = new Float32Array(vcount * 3);
  const nrm = new Float32Array(vcount * 3);
  const uv = new Float32Array(vcount * 2);
  const indices = [];
  let p = 0, u = 0, iOff = 0;
  for (const g of geoms) {
    if (!g.attributes.normal) g.computeVertexNormals();
    pos.set(g.attributes.position.array, p);
    nrm.set(g.attributes.normal.array, p);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, u);
    if (g.index) {
      const ia = g.index.array;
      for (let i = 0; i < ia.length; i++) indices.push(ia[i] + iOff);
    } else {
      for (let i = 0; i < g.attributes.position.count; i++) indices.push(iOff + i);
    }
    const vc = g.attributes.position.count;
    p += vc * 3;
    u += vc * 2;
    iOff += vc;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
  out.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  out.setIndex(indices);
  out.computeBoundingSphere();
  return out;
}

function makeArchGeom() {
  const hw = CELL * 0.5;
  const h = WALL_H;
  const depth = 0.42;
  const shape = new THREE.Shape();
  shape.moveTo(-hw, 0);
  shape.lineTo(hw, 0);
  shape.lineTo(hw, h);
  shape.lineTo(-hw, h);
  shape.closePath();
  const hole = new THREE.Path();
  const how = CELL * 0.34;
  const spring = 1.72;
  hole.moveTo(-how, 0.02);
  hole.lineTo(-how, spring);
  hole.absarc(0, spring, how, Math.PI, 0, true);
  hole.lineTo(how, 0.02);
  hole.closePath();
  shape.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 14 });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}

function biomeAt(x, z) {
  const d = Math.hypot(x, z);
  if (d < 28) return 0;
  if (d < 70) return 1;
  if (d < 130) return 2;
  return 3;
}
function biomeBlend(x, z) {
  const d = Math.hypot(x, z);
  if (d < 28) return { a: 0, b: 1, t: d / 28 };
  if (d < 70) return { a: 1, b: 2, t: (d - 28) / 42 };
  if (d < 130) return { a: 2, b: 3, t: (d - 70) / 60 };
  return { a: 3, b: 3, t: 0 };
}

function rebuildWorld(wx, wz) {
  const ccx = Math.floor(wx / CHUNK);
  const ccz = Math.floor(wz / CHUNK);
  let w = 0, a = 0, c = 0, f = 0, q = 0, b = 0, ivy = 0, ni = 0;
  lanternSites.length = 0;
  wellSites.length = 0;
  while (details.children.length) details.remove(details.children[0]);

  const wallC = new THREE.Color();
  const floorC = new THREE.Color();

  for (let cz = ccz - RADIUS; cz <= ccz + RADIUS; cz++) {
    for (let cx = ccx - RADIUS; cx <= ccx + RADIUS; cx++) {
      const ch = getChunk(cx, cz);
      for (let lz = 0; lz < CHUNK; lz++) {
        for (let lx = 0; lx < CHUNK; lx++) {
          const x = cx * CHUNK + lx;
          const z = cz * CHUNK + lz;
          const mask = ch.grid[lz][lx];
          const p = cellCenter(x, z);
          const bio = biomeAt(x, z);
          wallC.setHex(BIOME_WALL[bio]);
          wallC.offsetHSL((hash01(x, z, 3) - 0.5) * 0.04, 0, (hash01(x, z, 4) - 0.5) * 0.06);
          floorC.setHex(BIOME_FLOOR[bio]);
          const room = roomAt(x, z);
          const openAir = !!(room && room.openAir);
          const openings = ((mask & N) ? 1 : 0) + ((mask & E) ? 1 : 0) + ((mask & S) ? 1 : 0) + ((mask & W) ? 1 : 0);

          if (f < MAX_FLOOR) {
            setInst(floorMesh, f, p.x, -0.06, p.z, 0, 1, 1, 1, floorC);
            f++;
          }
          if (!openAir && q < MAX_CEIL) {
            setInst(ceilMesh, q, p.x, WALL_H + 0.05, p.z, 0, 1, 1, 1, wallC);
            q++;
            if (b + 1 < MAX_BEAM) {
              setInst(beamMesh, b++, p.x, WALL_H - 0.08, p.z, 0, 1, 1, 1, null);
              setInst(beamMesh, b++, p.x, WALL_H - 0.08, p.z, Math.PI / 2, 1, 1, 1, null);
            }
          }

          const edges = [
            { bit: N, x: p.x, z: p.z - CELL * 0.5, ry: 0 },
            { bit: S, x: p.x, z: p.z + CELL * 0.5, ry: 0 },
            { bit: E, x: p.x + CELL * 0.5, z: p.z, ry: Math.PI / 2 },
            { bit: W, x: p.x - CELL * 0.5, z: p.z, ry: Math.PI / 2 }
          ];
          for (const e of edges) {
            const open = (mask & e.bit) !== 0;
            if (open) {
              if (a < MAX_ARCH) {
                setInst(archMesh, a, e.x, 0, e.z, e.ry, 1, 1, 1, wallC);
                a++;
              }
            } else if (w < MAX_WALL) {
              setInst(wallMesh, w, e.x, WALL_H * 0.5, e.z, e.ry, 1, 1, 1, wallC);
              w++;
            }
          }

          if (c < MAX_COL) {
            setInst(colMesh, c, p.x + CELL * 0.5, 0, p.z + CELL * 0.5, 0, 1, 1, 1, wallC);
            c++;
          }

          const hLantern = hash01(x, z, 41);
          const corridor = openings === 2;
          if (hLantern > 0.62 || (room && hLantern > 0.35) || (x === 3 && z >= 0 && z < 6 && cx === 0 && cz === 0)) {
            const hanging = hLantern > 0.78;
            const lxpos = p.x + (hash01(x, z, 42) - 0.5) * 0.3;
            const lzpos = p.z + (hash01(x, z, 43) - 0.5) * 0.3;
            const ly = hanging ? WALL_H - 0.55 : 1.55;
            const lantern = new THREE.Mesh(lanternGeo, ironMat);
            lantern.position.set(lxpos, ly, lzpos);
            lantern.castShadow = true;
            details.add(lantern);
            if (hanging) {
              const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.5, 5), ironMat);
              chain.position.set(lxpos, ly + 0.38, lzpos);
              details.add(chain);
            }
            const flame = new THREE.Mesh(flameGeo, flameMat);
            flame.position.set(lxpos, ly - 0.02, lzpos);
            details.add(flame);
            const spr = new THREE.Sprite(glowMat);
            spr.position.set(lxpos, ly, lzpos);
            spr.scale.set(2.4, 2.4, 1);
            details.add(spr);
            const refl = new THREE.Sprite(glowMat);
            refl.position.set(lxpos, -0.02, lzpos);
            refl.scale.set(1.6, 0.55, 1);
            refl.material = glowMat;
            details.add(refl);
            lanternSites.push({ x: lxpos, y: ly, z: lzpos, flame, spr, id: hash01(x, z, 44) });
          }

          if (bio >= 1 && ivy < MAX_IVY - 1 && hash01(x, z, 51) > 0.55) {
            const side = Math.floor(hash01(x, z, 52) * 4);
            const e = edges[side];
            if ((mask & e.bit) === 0) {
              setInst(ivyMesh, ivy, e.x + DIRS[side].x * -0.28, 1.15, e.z + DIRS[side].z * -0.28, e.ry, 1, 1 + hash01(x, z, 53) * 0.4, 1, null);
              ivy++;
            }
          }

          if (ni < MAX_NICHE && openings <= 2 && hash01(x, z, 61) > 0.78) {
            let side = -1;
            for (let d = 0; d < 4; d++) if ((mask & BIT[d]) === 0) { side = d; break; }
            if (side >= 0) {
              const e = edges[side];
              const nx = e.x - DIRS[side].x * 0.22;
              const nz = e.z - DIRS[side].z * 0.22;
              setInst(nicheMesh, ni, nx, 1.55, nz, e.ry, 1, 1, 1, null);
              ni++;
              if (hash01(x, z, 62) > 0.4) {
                const idol = new THREE.Mesh(idolGeo, idolMat);
                idol.position.set(nx - DIRS[side].x * 0.05, 0.02, nz - DIRS[side].z * 0.05);
                idol.rotation.y = e.ry + Math.PI;
                details.add(idol);
              }
            }
          }

          if (hash01(x, z, 71) > 0.92 && corridor) {
            const ban = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.6), bannerMat);
            ban.position.set(p.x + 0.9, 1.7, p.z);
            ban.rotation.y = Math.PI / 2;
            details.add(ban);
          }

          const well = !openAir && hash01(x, z, 81) > 0.93 && openings >= 2;
          if (well) {
            wellSites.push({ x: p.x, z: p.z });
            const frame = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.7, 12), ceilMat);
            frame.rotation.x = -Math.PI / 2;
            frame.position.set(p.x, WALL_H + 0.08, p.z);
            details.add(frame);
            for (let k = 0; k < 2; k++) {
              const sh = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 3.2), shaftMat);
              sh.position.set(p.x, 1.7, p.z);
              sh.rotation.y = k * Math.PI / 2 + 0.2;
              details.add(sh);
            }
            const mg = new THREE.Sprite(moonGlowMat);
            mg.position.set(p.x, WALL_H + 0.4, p.z);
            mg.scale.set(3.2, 3.2, 1);
            details.add(mg);
          }

          if (room && room.pool && lx === room.rx + Math.floor(room.rw / 2) && lz === room.rz + Math.floor(room.rh / 2)) {
            const pool = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(room.rw, room.rh) * CELL * 0.28, Math.min(room.rw, room.rh) * CELL * 0.28, 0.05, 24), waterMat);
            pool.position.set(p.x, 0.02, p.z);
            details.add(pool);
            const rim = new THREE.Mesh(new THREE.TorusGeometry(Math.min(room.rw, room.rh) * CELL * 0.28, 0.06, 6, 24), wallMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(p.x, 0.04, p.z);
            details.add(rim);
          }

          if (openAir && lx === room.rx && lz === room.rz) {
            const moonSpr = new THREE.Sprite(moonGlowMat);
            moonSpr.position.set(p.x + room.rw * CELL * 0.4, 11, p.z - 6);
            moonSpr.scale.set(7, 7, 1);
            details.add(moonSpr);
          }
        }
      }
    }
  }

  wallMesh.count = w;
  archMesh.count = a;
  colMesh.count = c;
  floorMesh.count = f;
  ceilMesh.count = q;
  beamMesh.count = b;
  ivyMesh.count = ivy;
  nicheMesh.count = ni;
  const meshes = [wallMesh, archMesh, colMesh, floorMesh, ceilMesh, beamMesh, ivyMesh, nicheMesh];
  for (const m of meshes) {
    m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
  }
}

    " acc += texture2D(tDiffuse, uv + vec2(-1.5,0.0)/uRes).rgb;",
    " acc += texture2D(tDiffuse, uv + vec2(0.0,1.5)/uRes).rgb;",
    " acc += texture2D(tDiffuse, uv + vec2(0.0,-1.5)/uRes).rgb;",
    " acc += texture2D(tDiffuse, uv + vec2(2.8,1.6)/uRes).rgb;",
    " acc += texture2D(tDiffuse, uv + vec2(-2.2,-1.4)/uRes).rgb;",
    " vec3 bright = max(acc / 6.0 - 0.42, 0.0);",
    " col += bright * vec3(1.15, 0.9, 0.55) * 0.72;",
    " col *= 1.0 - r * r * 0.52;",
    " float g = fract(sin(dot(uv * uRes, vec2(12.9898,78.233)) + uTime * 17.1) * 43758.5453);",
    " col += (g - 0.5) * 0.045;",
    " col = pow(max(col, 0.0), vec3(0.95, 1.0, 1.06));",
    " col *= vec3(1.06, 0.98, 0.9);",
    " col *= 1.0 - uPause * 0.22;",
    " col *= 1.0 - uIntro;",
    " gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n")
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

const walker = {
  x: 3,
  z: 0,
  dir: 2,
  t: 0,
  state: "walk",
  hold: 0,
  scanT: 0,
  scanPhase: 0,
  options: [],
  chosen: 2,
  from: new THREE.Vector3(3 * CELL, 1.62, 0),
  to: new THREE.Vector3(3 * CELL, 1.62, CELL),
  look: new THREE.Vector3(3 * CELL, 1.5, 2),
  desiredLook: new THREE.Vector3(3 * CELL, 1.5, 4),
  pos: new THREE.Vector3(3 * CELL, 1.62, 0),
  yaw: 0,
  visited: new Map(),
  steps: 0,
  lastRoom: null,
  bias: 0,
  biasAge: 0
};
walker.visited.set("3,0", 1);

function markVisit(x, z) {
  walker.visited.set(x + "," + z, walker.steps);
  if (walker.visited.size > 420) {
    let oldest = Infinity, ok = null;
    for (const [k, v] of walker.visited) if (v < oldest) { oldest = v; ok = k; }
    if (ok) walker.visited.delete(ok);
  }
}
function visitAge(x, z) {
  const v = walker.visited.get(x + "," + z);
  if (v == null) return 9999;
  return walker.steps - v;
}

function pickDir(x, z, fromDir) {
  const opts = [];
  for (let d = 0; d < 4; d++) {
    if (!isOpen(x, z, d)) continue;
    if (d === (fromDir ^ 2) && opts.length) continue;
    opts.push(d);
  }
  if (!opts.length) {
    for (let d = 0; d < 4; d++) if (isOpen(x, z, d)) opts.push(d);
  }
  let best = opts[0], bestS = -1e9;
  const scored = [];
  for (const d of opts) {
    const nx = x + DIRS[d].x, nz = z + DIRS[d].z;
    let s = hash01(nx, nz, walker.steps + 9) * 1.4;
    s += Math.min(visitAge(nx, nz), 80) * 0.12;
    if (d === fromDir) s += 2.4;
    if (d === (fromDir ^ 2)) s -= 4.5;
    const rm = roomAt(nx, nz);
    if (rm && rm !== roomAt(x, z)) s += 1.8;
    if (walker.biasAge > 0) {
      const left = (fromDir + 3) % 4;
      const right = (fromDir + 1) % 4;
      if (walker.bias < 0 && d === left) s += 5;
      if (walker.bias > 0 && d === right) s += 5;
    }
    scored.push({ d, s });
    if (s > bestS) { bestS = s; best = d; }
  }
  walker.options = scored.map(o => o.d);
  return best;
}

function setSegment(dir) {
  walker.dir = dir;
  const nx = walker.x + DIRS[dir].x;
  const nz = walker.z + DIRS[dir].z;
  const a = cellCenter(walker.x, walker.z);
  const b = cellCenter(nx, nz);
  walker.from.set(a.x, 1.62, a.z);
  walker.to.set(b.x, 1.62, b.z);
  walker.t = 0;
}

setSegment(2);
rebuildWorld(walker.x, walker.z);
let builtKey = Math.floor(walker.x / CHUNK) + ":" + Math.floor(walker.z / CHUNK);

const mouse = { x: 0, y: 0 };
addEventListener("pointermove", (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
});

let paused = false;
let muted = false;
let audioReady = false;
let audio;
const placeEl = document.getElementById("place");
const depthEl = document.getElementById("depth");
const bearingEl = document.getElementById("bearing");
const hoursEl = document.getElementById("hours");

function setupAudio() {
  if (audioReady) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  const master = ctx.createGain();
  master.gain.value = 0.0;
  master.connect(ctx.destination);

  function osc(type, freq, gain) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = gain;
    o.connect(g);
    o.start();
    return { o, g };
  }
  const droneA = osc("sine", 55, 0.12);
  const droneB = osc("sine", 82.4, 0.08);
  const droneC = osc("triangle", 110.1, 0.03);
  const filt = ctx.createBiquadFilter();
  filt.type = "lowpass";
  filt.frequency.value = 280;
  droneA.g.connect(filt);
  droneB.g.connect(filt);
  droneC.g.connect(filt);

  const choir = ctx.createGain();
  choir.gain.value = 0.018;
  for (const f of [220, 261.6, 329.6, 392]) {
    const o = osc("sine", f, 1);
    const lfo = osc("sine", 0.05 + f * 0.0001, 1);
    const lfoG = ctx.createGain();
    lfoG.gain.value = 3;
    lfo.o.connect(lfoG);
    lfoG.connect(o.o.frequency);
    o.g.connect(choir);
  }
  choir.connect(master);

  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const windSrc = ctx.createBufferSource();
  windSrc.buffer = noiseBuf;
  windSrc.loop = true;
  const windF = ctx.createBiquadFilter();
  windF.type = "bandpass";
  windF.frequency.value = 400;
  windF.Q.value = 0.6;
  const windG = ctx.createGain();
  windG.gain.value = 0.03;
  windSrc.connect(windF);
  windF.connect(windG);
  windG.connect(master);
  windSrc.start();
  filt.connect(master);

  audio = {
    ctx, master, filt, windG, droneA, lastStep: 0, lastDrip: 0, lastBell: 0,
    step() {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = "lowpass";
      bp.frequency.value = 180 + Math.random() * 90;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start();
      src.stop(ctx.currentTime + 0.18);
    },
    drip() {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(980 + Math.random() * 400, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.18);
      g.gain.setValueAtTime(0.045, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      o.connect(g); g.connect(master);
      o.start(); o.stop(ctx.currentTime + 0.24);
    },
    bell() {
      const now = ctx.currentTime;
      for (const f of [164.8, 247, 329.6, 494]) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
        o.connect(g); g.connect(master);
        o.start(now); o.stop(now + 4.6);
      }
    }
  };
  master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, ctx.currentTime + 2.5);
  audioReady = true;
}

function toggleMute() {
  muted = !muted;
  document.getElementById("btnMute").textContent = muted ? "×" : "♪";
  if (audio) audio.master.gain.setTargetAtTime(muted ? 0 : 0.9, audio.ctx.currentTime, 0.12);
}
function togglePause() {
  paused = !paused;
  document.body.classList.toggle("is-paused", paused);
  document.getElementById("btnPause").textContent = paused ? "▶" : "Ⅱ";
}

addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  if (e.key === "m" || e.key === "M") toggleMute();
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { walker.bias = -1; walker.biasAge = 2.2; }
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { walker.bias = 1; walker.biasAge = 2.2; }
});
document.getElementById("btnMute").addEventListener("click", () => { setupAudio(); toggleMute(); });
document.getElementById("btnPause").addEventListener("click", togglePause);
canvas.addEventListener("pointerdown", () => setupAudio());
document.addEventListener("visibilitychange", () => {
  if (document.hidden && !paused) togglePause();
});

const clock = new THREE.Clock();
let intro = 1;
let titleShown = false;
let hudShown = false;
let walkPhase = 0;
let hours = 1;
const tmp = new THREE.Vector3();
const fogColor = new THREE.Color();

function placeName(x, z, dir) {
  const bio = biomeAt(x, z);
  const room = roomAt(x, z);
  if (room && room.openAir) return bio === 0 ? "Moon garth" : BIOME_NAMES[bio][4];
  if (room && room.pool) return BIOME_NAMES[bio][2];
  if (room) return BIOME_NAMES[bio][1];
  const i = hashInt(x, z, 17) % BIOME_NAMES[bio].length;
  return BIOME_NAMES[bio][i];
}

function updateWalker(dt) {
  walker.biasAge = Math.max(0, walker.biasAge - dt);
  const speed = reduced ? 0.55 : 0.72;
  if (walker.state === "dwell" || walker.state === "scan") {
    walker.hold -= dt;
    if (walker.state === "scan") {
      walker.scanT += dt;
      const opts = walker.options.length ? walker.options : [walker.dir];
      const slot = Math.min(opts.length - 1, Math.floor(walker.scanT / 0.85));
      const d = opts[Math.min(slot, opts.length - 1)];
      const c = cellCenter(walker.x, walker.z);
      walker.desiredLook.set(c.x + DIRS[d].x * 5.2, 1.45 + Math.sin(walker.scanT) * 0.08, c.z + DIRS[d].z * 5.2);
      if (walker.hold <= 0) {
        walker.state = "walk";
        setSegment(walker.chosen);
      }
    } else if (walker.hold <= 0) {
      walker.state = "walk";
      const d = pickDir(walker.x, walker.z, walker.dir);
      setSegment(d);
    }
    return;
  }

  walker.t += dt * speed / 1.0;
  if (walker.t >= 1) {
    walker.x += DIRS[walker.dir].x;
    walker.z += DIRS[walker.dir].z;
    walker.t = 0;
    walker.steps++;
    markVisit(walker.x, walker.z);
    const mask = cellMask(walker.x, walker.z);
    let nOpen = 0;
    for (let d = 0; d < 4; d++) if (mask & BIT[d]) nOpen++;
    const room = roomAt(walker.x, walker.z);
    const key = room ? (Math.floor(walker.x / CHUNK) + ":" + Math.floor(walker.z / CHUNK) + ":" + room.rx + ":" + room.rz) : null;

    if (nOpen === 1) {
      walker.chosen = pickDir(walker.x, walker.z, walker.dir);
      walker.state = "scan";
      walker.hold = 1.15;
      walker.scanT = 0;
    } else if (room && key !== walker.lastRoom && (room.openAir || room.pool || hash01(walker.x, walker.z, 91) > 0.55)) {
      walker.lastRoom = key;
      walker.state = "dwell";
      walker.hold = room.openAir ? 2.4 : 1.5;
      const c = cellCenter(walker.x, walker.z);
      walker.desiredLook.set(c.x, room.openAir ? 6.5 : 2.8, c.z + 0.2);
    } else if (nOpen >= 3 && hash01(walker.x, walker.z, walker.steps) > 0.38) {
      walker.chosen = pickDir(walker.x, walker.z, walker.dir);
      walker.state = "scan";
      walker.hold = 1.7 + hash01(walker.x, walker.z, 5) * 0.6;
      walker.scanT = 0;
    } else {
      const d = pickDir(walker.x, walker.z, walker.dir);
      setSegment(d);
    }

    const ck = Math.floor(walker.x / CHUNK) + ":" + Math.floor(walker.z / CHUNK);
    if (ck !== builtKey) {
      builtKey = ck;
      rebuildWorld(walker.x, walker.z);
    }
    placeEl.textContent = placeName(walker.x, walker.z, walker.dir);
    depthEl.textContent = String(walker.steps).padStart(3, "0");
    bearingEl.textContent = DIRS[walker.dir].name;
    if (walker.steps > 0 && walker.steps % 40 === 0) {
      hours++;
      hoursEl.textContent = roman(hours);
    }
  }

  const u = smooth(clamp(walker.t, 0, 1));
  walker.pos.lerpVectors(walker.from, walker.to, u);
  tmp.copy(walker.to).sub(walker.from);
  if (tmp.lengthSq() > 0.0001) {
    walker.desiredLook.set(
      walker.pos.x + tmp.x * 1.6,
      1.48 + Math.sin(performance.now() * 0.0007) * 0.04,
      walker.pos.z + tmp.z * 1.6
    );
  }
}

function assignLights() {
  const px = walker.pos.x, pz = walker.pos.z;
  lanternSites.sort((a, b) => {
    const da = (a.x - px) ** 2 + (a.z - pz) ** 2;
    const db = (b.x - px) ** 2 + (b.z - pz) ** 2;
    return da - db;
  });
  for (let i = 0; i < lightPool.length; i++) {
    const L = lightPool[i];
    const s = lanternSites[i];
    if (!s) { L.intensity = 0; continue; }
    L.position.set(s.x, s.y, s.z);
    const flick = 0.86 + Math.sin(performance.now() * 0.012 + s.id * 40) * 0.08 + Math.sin(performance.now() * 0.027 + s.id * 12) * 0.05;
    const dist = Math.hypot(s.x - px, s.z - pz);
    const fade = clamp(1 - dist / 18, 0, 1);
    L.intensity = 11 * flick * fade;
    L.color.setHex(biomeAt(walker.x, walker.z) >= 3 ? 0xd8c6ff : biomeAt(walker.x, walker.z) >= 2 ? 0xb7d8d0 : 0xffc07a);
    if (s.spr) s.spr.scale.setScalar(2.1 + flick * 0.6);
  }
  wellSites.sort((a, b) => (a.x - px) ** 2 + (a.z - pz) ** 2 - ((b.x - px) ** 2 + (b.z - pz) ** 2));
  for (let i = 0; i < wellLights.length; i++) {
    const s = wellSites[i];
    const L = wellLights[i];
    if (!s) { L.intensity = 0; continue; }
    L.position.set(s.x, WALL_H + 0.2, s.z);
    L.target.position.set(s.x, 0, s.z);
    L.intensity = 9;
  }
}

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  rt.setSize(w, h);
  postMat.uniforms.uRes.value.set(w, h);
}
addEventListener("resize", resize);

const t0 = performance.now();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = (performance.now() - t0) / 1000;
  postMat.uniforms.uTime.value = t;
  postMat.uniforms.uPause.value = paused ? 1 : 0;

  if (!paused) {
    updateWalker(dt);
    walkPhase += dt * (walker.state === "walk" ? 8.4 : 1.6);
  }

  const bob = reduced ? 0 : Math.sin(walkPhase) * (walker.state === "walk" ? 0.028 : 0.01);
  const sway = reduced ? 0 : Math.sin(walkPhase * 0.5) * 0.012;
  const breath = Math.sin(t * 1.15) * 0.006;
  walker.look.lerp(walker.desiredLook, 1 - Math.exp(-dt * 2.6));
  camera.position.copy(walker.pos);
  camera.position.y = 1.62 + bob + breath;
  camera.position.x += sway;
  tmp.copy(walker.look);
  tmp.x += mouse.x * 0.55;
  tmp.y += -mouse.y * 0.28 + (walker.state === "dwell" ? 0.4 : 0);
  camera.lookAt(tmp);

  if (bannerMat.userData.shader) bannerMat.userData.shader.uniforms.uTime.value = t;

  const bio = biomeBlend(walker.x, walker.z);
  fogColor.setHex(BIOME_FOG[bio.a]).lerp(new THREE.Color(BIOME_FOG[bio.b]), bio.t);
  scene.fog.color.copy(fogColor);
  scene.background.copy(fogColor);
  scene.fog.density = 0.046 + bio.a * 0.004;

  stars.position.set(walker.pos.x, 0, walker.pos.z);

  const dp = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    const bx = dustBase[i * 3], spd = dustBase[i * 3 + 1], bz = dustBase[i * 3 + 2];
    dp[i * 3] = walker.pos.x + Math.sin(t * spd + bx) * 6 + ((i * 17) % 13) - 6;
    dp[i * 3 + 1] = 0.4 + ((Math.sin(t * 0.2 + bz) + 1) * 1.3);
    dp[i * 3 + 2] = walker.pos.z + Math.cos(t * spd * 0.8 + bz) * 6 + ((i * 13) % 11) - 5;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  assignLights();

  if (audio && !paused && !muted) {
    const stepBeat = Math.sin(walkPhase);
    if (walker.state === "walk" && stepBeat > 0.92 && t - audio.lastStep > 0.28) {
      audio.step();
      audio.lastStep = t;
    }
    if (t - audio.lastDrip > 2.8 + hash01(Math.floor(t), 1, 8) * 4) {
      audio.drip();
      audio.lastDrip = t;
    }
    if (t - audio.lastBell > 52) {
      audio.bell();
      audio.lastBell = t;
    }
    audio.filt.frequency.setTargetAtTime(240 + biomeAt(walker.x, walker.z) * 40, audio.ctx.currentTime, 0.3);
  }

  if (t > 0.6 && intro > 0) intro = Math.max(0, intro - dt * 0.35);
  postMat.uniforms.uIntro.value = intro;
  if (t > 1.6 && !titleShown) {
    document.getElementById("title").classList.add("show");
    titleShown = true;
  }
  if (t > 6.2) document.getElementById("title").classList.add("hide");
  if (t > 7.2 && !hudShown) {
    document.getElementById("hud").classList.add("show");
    document.getElementById("hint").classList.add("show");
    hudShown = true;
    setTimeout(() => document.getElementById("hint").classList.remove("show"), 7000);
  }

  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
  </script>
</body>
