<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Halide Works — developing</title>
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --canvas: oklch(0.12 0.038 28);
      --canvas-deep: oklch(0.08 0.03 28);
      --safelight: oklch(0.46 0.155 32);
      --safelight-hot: oklch(0.58 0.17 38);
      --ink: oklch(0.9 0.028 62);
      --ink-muted: oklch(0.78 0.04 48);
      --ink-faint: oklch(0.68 0.045 40);
      --line: color-mix(in oklab, var(--ink) 22%, transparent);
      --paper: oklch(0.82 0.028 78);
      --paper-wet: oklch(0.74 0.04 62);
      --tray: oklch(0.18 0.03 32);
      --tray-lip: oklch(0.24 0.04 30);
      --bath: oklch(0.28 0.07 28);
      --focus: oklch(0.92 0.03 70);
      --pad: clamp(1rem, 3.2vw, 2.25rem);
      --develop: 0;
      --fix: 0;
      --wash: 0;
      --ready: 0;
      --agitate: 0deg;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--ink);
      background:
        radial-gradient(1200px 720px at 50% -8%, color-mix(in oklab, var(--safelight) 28%, transparent), transparent 62%),
        radial-gradient(900px 520px at 50% 42%, color-mix(in oklab, var(--safelight) 14%, transparent), transparent 58%),
        linear-gradient(180deg, var(--canvas-deep), var(--canvas) 42%, var(--canvas-deep));
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Palatino LT STD", "Book Antiqua", Georgia, serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      transition: background-color 700ms var(--ease-out);
    }

    body.is-ready {
      --canvas: oklch(0.2 0.014 78);
      --canvas-deep: oklch(0.14 0.012 78);
      --safelight: oklch(0.42 0.02 80);
      --safelight-hot: oklch(0.62 0.03 85);
      --ink: oklch(0.93 0.012 85);
      --ink-muted: oklch(0.78 0.014 80);
      --ink-faint: oklch(0.66 0.016 78);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    header, footer {
      position: relative;
      z-index: 3;
      padding: var(--pad);
      padding-top: max(var(--pad), env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.25rem;
    }

    footer {
      padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
      align-items: flex-end;
    }

    .brand {
      display: grid;
      gap: 0.28rem;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(0.92rem, 1.5vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 1.2;
      text-wrap: balance;
    }

    .brand p,
    .meta p,
    .clock .label,
    .process-caption {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      line-height: 1.4;
    }

    .meta {
      text-align: end;
      display: grid;
      gap: 0.28rem;
      font-variant-numeric: tabular-nums;
    }

    .meta strong {
      font-weight: 600;
      letter-spacing: 0.08em;
      font-size: 0.92rem;
    }

    main {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding-inline: var(--pad);
    }

    .enlarger {
      position: absolute;
      inset: 0 auto auto 50%;
      translate: -50% 0;
      width: min(46vw, 420px);
      height: 28%;
      pointer-events: none;
      z-index: 1;
      opacity: calc(1 - var(--ready) * 0.85);
    }

    .enlarger .head {
      width: 58px;
      height: 18px;
      margin: 0 auto;
      background: oklch(0.16 0.02 28);
      border: 1px solid color-mix(in oklab, var(--ink) 16%, transparent);
      border-radius: 2px 2px 0 0;
    }

    .enlarger .bellows {
      width: 34px;
      height: 28px;
      margin: 0 auto;
      background:
        repeating-linear-gradient(
          180deg,
          oklch(0.18 0.02 28) 0 3px,
          oklch(0.13 0.02 28) 3px 6px
        );
      clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
    }

    .enlarger .lens {
      width: 22px;
      height: 10px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, var(--safelight-hot), oklch(0.2 0.08 28));
      box-shadow: 0 10px 28px color-mix(in oklab, var(--safelight-hot) 55%, transparent);
    }

    .cone {
      position: absolute;
      top: 56px;
      left: 50%;
      width: 150%;
      height: 240%;
      translate: -50% 0;
      background: linear-gradient(
        180deg,
        color-mix(in oklab, var(--safelight-hot) 32%, transparent),
        color-mix(in oklab, var(--safelight) 8%, transparent) 48%,
        transparent
      );
      clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
      mix-blend-mode: screen;
      opacity: 0.85;
    }

    .stage {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 1.1rem;
      width: min(100%, 720px);
      transform: rotate(var(--agitate));
    }

    .tray {
      width: min(100%, 640px);
      padding: clamp(0.7rem, 1.8vw, 1.15rem);
      background:
        linear-gradient(180deg, var(--tray-lip), var(--tray));
      border: 1px solid color-mix(in oklab, var(--ink) 14%, transparent);
      border-radius: 10px 10px 14px 14px;
      box-shadow:
        inset 0 1px 0 color-mix(in oklab, var(--ink) 12%, transparent),
        0 30px 70px oklch(0.08 0.03 28 / 0.55);
    }

    .bath {
      position: relative;
      padding: clamp(0.55rem, 1.4vw, 0.9rem);
      background:
        radial-gradient(120% 80% at 50% 0%, color-mix(in oklab, var(--safelight) 18%, transparent), transparent 46%),
        linear-gradient(180deg, color-mix(in oklab, var(--bath) 88%, white), var(--bath));
      border-radius: 4px;
      overflow: hidden;
    }

    .sheet {
      position: relative;
      aspect-ratio: 10 / 8;
      background: var(--paper);
      padding: 3.6% 3.4% 8.2%;
      box-shadow:
        0 1px 0 color-mix(in oklab, black 25%, transparent),
        inset 0 0 0 1px color-mix(in oklab, black 8%, transparent);
    }

    .sheet canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }

    .pencil {
      position: absolute;
      right: 4.2%;
      bottom: 2.4%;
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: clamp(0.58rem, 1.3vw, 0.72rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: color-mix(in oklab, black 48%, var(--paper));
      opacity: calc(0.35 + var(--fix) * 0.55);
    }

    .sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        108deg,
        transparent 20%,
        color-mix(in oklab, white 28%, transparent) 42%,
        transparent 62%
      );
      mix-blend-mode: soft-light;
      pointer-events: none;
      opacity: calc(0.55 - var(--wash) * 0.35 - var(--ready) * 0.2);
      transform: translateX(-18%);
    }

    .tongs {
      position: absolute;
      right: 6%;
      top: -18px;
      width: 76px;
      height: 54px;
      pointer-events: none;
      opacity: 0.72;
    }

    .tongs span {
      position: absolute;
      top: 8px;
      width: 4px;
      height: 46px;
      background: linear-gradient(180deg, oklch(0.55 0.04 70), oklch(0.32 0.03 60));
      border-radius: 2px;
      rotate: 18deg;
    }

    .tongs span:last-child {
      left: 14px;
      rotate: 32deg;
    }

    .clock {
      display: grid;
      justify-items: center;
      gap: 0.2rem;
    }

    .clock time {
      font-family: "Segoe UI", ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: clamp(1.7rem, 4.4vw, 2.35rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .process {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1.15rem;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .process li {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .process li::before {
      content: "";
      width: 7px;
      height: 7px;
      border: 1px solid var(--ink-faint);
      border-radius: 50%;
    }

    .process li[data-state="done"] {
      color: var(--ink-muted);
    }

    .process li[data-state="done"]::before {
      background: var(--ink-muted);
      border-color: var(--ink-muted);
    }

    .process li[aria-current="step"] {
      color: var(--ink);
    }

    .process li[aria-current="step"]::before {
      background: var(--ink);
      border-color: var(--ink);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ink) 18%, transparent);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      min-width: min(100%, 12rem);
    }

    button {
      appearance: none;
      min-height: 44px;
      padding: 0.7rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: color-mix(in oklab, var(--ink) 7%, transparent);
      color: var(--ink);
      font: 600 0.72rem/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover {
      background: color-mix(in oklab, var(--ink) 12%, transparent);
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    button[hidden] { display: none; }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    noscript {
      position: absolute;
      inset: auto var(--pad) var(--pad);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    @media (max-width: 640px) {
      body { overflow: auto; }
      header, footer {
        flex-direction: column;
        align-items: stretch;
      }
      .meta, .actions { text-align: start; }
      .process { gap: 0.45rem 0.85rem; }
      .enlarger { width: 70vw; height: 22%; }
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover { border-color: color-mix(in oklab, var(--ink) 45%, transparent); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .sheen {
        animation: sheen 7.5s linear infinite;
      }
      .cone {
        animation: cone 4.8s var(--ease-in-out) infinite;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body, button { transition: none; }
      .stage { transform: none; }
      .sheen, .cone { animation: none; }
    }

    @media (prefers-contrast: more) {
      :root {
        --ink: oklch(0.96 0.02 70);
        --ink-muted: oklch(0.88 0.02 70);
        --line: color-mix(in oklab, var(--ink) 55%, transparent);
      }
      .sheet { outline: 1px solid var(--ink); }
      button { border-width: 2px; }
    }

    @media (forced-colors: active) {
      button { border: 2px solid ButtonText; }
      .process li::before { forced-color-adjust: none; }
    }

    @keyframes sheen {
      from { transform: translateX(-24%); }
      to { transform: translateX(24%); }
    }

    @keyframes cone {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 0.95; }
    }
  </style>
</head>
<body>
  <div class="status" role="status" aria-live="polite" aria-atomic="true" id="live"></div>

  <header>
    <div class="brand">
      <h1>Halide Works</h1>
      <p>Safelight 3 · silver gelatin</p>
    </div>
    <div class="meta">
      <p><strong>20.0 °C</strong></p>
      <p>Dektol 1+2 · MG IV · 10×8</p>
    </div>
  </header>

  <main>
    <div class="enlarger" aria-hidden="true">
      <div class="head"></div>
      <div class="bellows"></div>
      <div class="lens"></div>
      <div class="cone"></div>
    </div>

    <section class="stage" aria-labelledby="clock-label">
      <div class="tray">
        <div class="bath">
          <div class="tongs" aria-hidden="true"><span></span><span></span></div>
          <figure class="sheet">
            <canvas id="print" width="1000" height="800" role="img" aria-label="Silver gelatin print of Kettle Point forming in the developer."></canvas>
            <p class="pencil">Kettle Point · 12 Aug 1974</p>
            <div class="sheen" aria-hidden="true"></div>
          </figure>
        </div>
      </div>

      <div class="clock">
        <div class="label" id="clock-label">Developing time</div>
        <time id="timer" datetime="PT0S">0:00.0</time>
      </div>

      <div
        id="bar"
        class="sr-only"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-valuetext="Starting developer"
        aria-label="Print development"
      ></div>
    </section>
  </main>

  <footer>
    <div>
      <ol class="process" id="steps">
        <li data-step="develop" aria-current="step">Develop</li>
        <li data-step="stop">Stop</li>
        <li data-step="fix">Fix</li>
        <li data-step="wash">Wash</li>
      </ol>
      <p class="process-caption" id="caption">Paper in the bath. Highlights still blank.</p>
    </div>
    <div class="actions">
      <button type="button" id="skip">Skip wait</button>
      <button type="button" id="again" hidden>Print again</button>
    </div>
  </footer>

  <noscript>JavaScript is required to run the developing timer.</noscript>

  <script>
    (function () {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      const canvas = document.getElementById("print");
      const ctx = canvas.getContext("2d", { alpha: false });
      const timerEl = document.getElementById("timer");
      const liveEl = document.getElementById("live");
      const captionEl = document.getElementById("caption");
      const barEl = document.getElementById("bar");
      const skipBtn = document.getElementById("skip");
      const againBtn = document.getElementById("again");
      const stepEls = Array.from(document.querySelectorAll("#steps li"));
      const root = document.documentElement;

      const PHASES = [
        { id: "develop", at: 0, caption: "Paper in the bath. Shadows coming up first." },
        { id: "develop", at: 0.18, caption: "Pier posts and headlands appearing." },
        { id: "develop", at: 0.42, caption: "Midtones filling. Water taking density." },
        { id: "stop", at: 0.58, caption: "Stop bath. Development arrested." },
        { id: "fix", at: 0.68, caption: "Fixer. The silver is going stable." },
        { id: "wash", at: 0.88, caption: "Wash. Clearing the hypo." },
        { id: "ready", at: 1, caption: "Print ready. Safe for white light." }
      ];

      const TOTAL = reduce.matches ? 4200 : 13500;
      const W = 1000;
      const H = 800;

      let master = null;
      let started = 0;
      let elapsed = 0;
      let running = true;
      let lastLive = "";
      let lastDraw = -1;
      let raf = 0;

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function clamp(v, a, b) {
        return v < a ? a : v > b ? b : v;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function smooth(t) {
        t = clamp(t, 0, 1);
        return t * t * (3 - 2 * t);
      }

      function buildMaster() {
        const data = new Float32Array(W * H);
        const rnd = mulberry32(19740812);

        function add(x, y, v) {
          if (x < 0 || y < 0 || x >= W || y >= H) return;
          const i = y * W + x;
          data[i] = data[i] + v;
        }

        function stampSoft(cx, cy, rx, ry, density, power) {
          const x0 = Math.max(0, Math.floor(cx - rx));
          const x1 = Math.min(W - 1, Math.ceil(cx + rx));
          const y0 = Math.max(0, Math.floor(cy - ry));
          const y1 = Math.min(H - 1, Math.ceil(cy + ry));
          for (let y = y0; y <= y1; y++) {
            for (let x = x0; x <= x1; x++) {
              const nx = (x - cx) / rx;
              const ny = (y - cy) / ry;
              const d = nx * nx + ny * ny;
              if (d > 1) continue;
              const k = Math.pow(1 - d, power);
              add(x, y, density * k);
            }
          }
        }

        function fillPoly(points, density) {
          let minY = H, maxY = 0;
          for (const p of points) {
            minY = Math.min(minY, p[1]);
            maxY = Math.max(maxY, p[1]);
          }
          minY = Math.max(0, Math.floor(minY));
          maxY = Math.min(H - 1, Math.ceil(maxY));
          for (let y = minY; y <= maxY; y++) {
            const xs = [];
            for (let i = 0; i < points.length; i++) {
              const a = points[i];
              const b = points[(i + 1) % points.length];
              if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) {
                const t = (y - a[1]) / (b[1] - a[1]);
                xs.push(a[0] + t * (b[0] - a[0]));
              }
            }
            xs.sort((m, n) => m - n);
            for (let i = 0; i < xs.length; i += 2) {
              const x0 = Math.max(0, Math.floor(xs[i]));
              const x1 = Math.min(W - 1, Math.ceil(xs[i + 1] || xs[i]));
              for (let x = x0; x <= x1; x++) add(x, y, density);
            }
          }
        }

        const horizon = Math.floor(H * 0.402);

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const skyT = y / horizon;
            const waterT = (y - horizon) / (H - horizon);
            let d;
            if (y < horizon) {
              d = lerp(0.34, 0.12, smooth(skyT));
              d += Math.sin(x * 0.01 + y * 0.03) * 0.018;
            } else {
              d = lerp(0.16, 0.46, smooth(waterT));
              d += Math.sin(y * 0.55) * 0.012;
              d += Math.sin(x * 0.045 + y * 0.2) * 0.01;
            }
            data[y * W + x] = d;
          }
        }

        stampSoft(W * 0.62, H * 0.16, W * 0.34, H * 0.11, 0.08, 1.4);
        stampSoft(W * 0.28, H * 0.2, W * 0.28, H * 0.09, 0.06, 1.6);
        stampSoft(W * 0.5, horizon - 8, W * 0.9, 28, -0.05, 1.2);

        fillPoly(
          [
            [0, horizon + 8],
            [0, H * 0.34],
            [W * 0.08, H * 0.3],
            [W * 0.18, H * 0.36],
            [W * 0.27, H * 0.39],
            [W * 0.34, horizon + 6]
          ],
          0.38
        );
        fillPoly(
          [
            [W * 0.72, horizon + 8],
            [W * 0.8, H * 0.355],
            [W * 0.9, H * 0.33],
            [W, H * 0.35],
            [W, horizon + 10]
          ],
          0.3
        );

        for (let y = horizon; y < H; y++) {
          const t = (y - horizon) / (H - horizon);
          const wobble = Math.sin(y * 0.9) * (1 - t) * 4;
          for (let x = 0; x < W; x++) {
            if ((y + Math.floor(wobble)) % 5 === 0) add(x, y, 0.018 * (1 - t));
          }
        }

        const vpX = W * 0.49;
        const vpY = horizon + 6;
        for (let i = 0; i < 36; i++) {
          const t = Math.pow(i / 35, 1.15);
          const y = Math.floor(lerp(H + 10, vpY + 4, t));
          if (y < 0 || y >= H) continue;
          const half = lerp(W * 0.28, 9, Math.pow(t, 0.72));
          const cx = lerp(W * 0.36, vpX, t);
          const thick = Math.max(1, Math.round(lerp(3, 1, t)));
          const dens = lerp(0.22, 0.08, t);
          for (let k = 0; k < thick; k++) {
            const yy = y + k;
            if (yy >= H) continue;
            const x0 = Math.max(0, Math.floor(cx - half));
            const x1 = Math.min(W - 1, Math.ceil(cx + half));
            for (let x = x0; x <= x1; x++) add(x, yy, dens);
          }
        }

        for (let i = 0; i < 13; i++) {
          const t = Math.pow((i + 0.35) / 13, 0.92);
          const x = Math.floor(lerp(W * 0.21, vpX - 6, t));
          const yTop = Math.floor(lerp(H * 0.58, vpY - 2, t));
          const yBot = Math.floor(lerp(H + 8, vpY + 10, t));
          const half = Math.max(1, lerp(9, 1.2, t));
          for (let y = yTop; y <= yBot; y++) {
            if (y < 0 || y >= H) continue;
            for (let xOff = -half; xOff <= half; xOff++) {
              add(Math.round(x + xOff), y, 0.62);
            }
          }
          const ry0 = yBot;
          const ry1 = Math.min(H - 1, yBot + Math.floor(lerp(90, 12, t)));
          for (let y = ry0; y <= ry1; y++) {
            const fade = 1 - (y - ry0) / (ry1 - ry0 + 1);
            for (let xOff = -half * 0.7; xOff <= half * 0.7; xOff++) {
              add(Math.round(x + xOff), y, 0.16 * fade);
            }
          }
        }

        const lampX = Math.floor(lerp(W * 0.21, vpX, Math.pow(10.2 / 13, 0.92)));
        const lampY = Math.floor(lerp(H * 0.58, vpY, Math.pow(10.2 / 13, 0.92))) - 18;
        stampSoft(lampX, lampY, 90, 70, -0.28, 1.8);
        stampSoft(lampX, lampY, 14, 14, -0.5, 1.2);
        for (let y = lampY; y < H * 0.82; y++) {
          const spread = lerp(1.2, 7, (y - lampY) / (H * 0.4));
          for (let x = -spread; x <= spread; x++) {
            add(Math.round(lampX + x), Math.round(y), -0.045);
          }
        }

        stampSoft(W * 0.63, H * 0.62, 38, 12, 0.42, 1.6);
        stampSoft(W * 0.61, H * 0.615, 22, 7, 0.2, 1.4);

        for (let i = 0; i < 3; i++) {
          const bx = W * (0.18 + rnd() * 0.6);
          const by = H * (0.12 + rnd() * 0.18);
          stampSoft(bx, by, 2.2, 1.4, 0.35, 1.1);
        }

        for (let i = 0; i < data.length; i++) {
          const x = i % W;
          const y = (i / W) | 0;
          const vignette = Math.pow(Math.hypot((x - W * 0.5) / W, (y - H * 0.48) / H) * 1.35, 2);
          data[i] = clamp(data[i] + vignette * 0.16 + (rnd() - 0.5) * 0.045, 0, 1);
        }

        master = data;
      }

      function render(progress, ready) {
        if (!master) buildMaster();
        const img = ctx.createImageData(W, H);
        const px = img.data;
        const develop = clamp(progress / 0.58, 0, 1);
        const fix = clamp((progress - 0.68) / 0.2, 0, 1);
        const toneReady = ready;
        const cut = (1 - develop) * 0.9;
        const knee = 0.16 + develop * 0.08;

        for (let i = 0; i < master.length; i++) {
          const d = master[i];
          let vis = smooth((d - cut + 0.02) / knee);
          vis = clamp(d * vis * (0.42 + 0.58 * develop), 0, 1);
          vis = clamp(vis + fix * d * 0.1, 0, 1);
          const silver = Math.pow(vis, 0.92);
          const v = 255 * (1 - silver);
          const o = i * 4;
          if (toneReady > 0.92) {
            px[o] = v * 0.98;
            px[o + 1] = v * 0.97;
            px[o + 2] = v * 0.93;
          } else {
            px[o] = v * 0.62 + 48;
            px[o + 1] = v * 0.22 + 8;
            px[o + 2] = v * 0.12 + 4;
            if (toneReady > 0) {
              const gR = v * 0.98;
              const gG = v * 0.97;
              const gB = v * 0.93;
              px[o] = lerp(px[o], gR, toneReady);
              px[o + 1] = lerp(px[o + 1], gG, toneReady);
              px[o + 2] = lerp(px[o + 2], gB, toneReady);
            }
          }
          px[o + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }

      function formatTime(ms) {
        const t = Math.max(0, ms) / 1000;
        const m = Math.floor(t / 60);
        const s = t % 60;
        return m + ":" + s.toFixed(1).padStart(4, "0");
      }

      function phaseAt(p) {
        let cur = PHASES[0];
        for (const ph of PHASES) if (p >= ph.at) cur = ph;
        return cur;
      }

      function setSteps(id) {
        let seen = true;
        for (const li of stepEls) {
          const match = li.dataset.step === id || (id === "ready" && li.dataset.step === "wash");
          if (id === "ready") {
            li.removeAttribute("aria-current");
            li.dataset.state = "done";
            continue;
          }
          if (li.dataset.step === id) {
            li.setAttribute("aria-current", "step");
            li.dataset.state = "current";
            seen = false;
          } else if (seen) {
            li.removeAttribute("aria-current");
            li.dataset.state = "done";
          } else {
            li.removeAttribute("aria-current");
            li.dataset.state = "todo";
          }
        }
      }

      function apply(ms, forceReady) {
        const p = forceReady ? 1 : clamp(ms / TOTAL, 0, 1);
        const ph = phaseAt(p);
        const develop = clamp(p / 0.58, 0, 1);
        const fix = clamp((p - 0.68) / 0.2, 0, 1);
        const wash = clamp((p - 0.88) / 0.12, 0, 1);
        const ready = p >= 1 ? 1 : 0;

        root.style.setProperty("--develop", develop.toFixed(4));
        root.style.setProperty("--fix", fix.toFixed(4));
        root.style.setProperty("--wash", wash.toFixed(4));
        root.style.setProperty("--ready", String(ready));

        if (!reduce.matches && ph.id === "develop") {
          const wave = Math.sin(ms / 900) * 0.35;
          root.style.setProperty("--agitate", wave.toFixed(3) + "deg");
        } else {
          root.style.setProperty("--agitate", "0deg");
        }

        document.body.classList.toggle("is-ready", ready === 1);
        timerEl.textContent = formatTime(Math.min(ms, TOTAL));
        timerEl.setAttribute("datetime", "PT" + (Math.min(ms, TOTAL) / 1000).toFixed(1) + "S");
        captionEl.textContent = ph.caption;
        setSteps(ph.id);

        const pct = Math.round(p * 100);
        barEl.setAttribute("aria-valuenow", String(pct));
        barEl.setAttribute("aria-valuetext", ph.caption);

        if (ph.caption !== lastLive) {
          liveEl.textContent = ph.caption;
          lastLive = ph.caption;
        }

        if (ready || lastDraw < 0 || Math.abs(p - lastDraw) >= 0.006) {
          render(p, ready);
          lastDraw = p;
        }

        if (ready) {
          running = false;
          skipBtn.hidden = true;
          againBtn.hidden = false;
        } else {
          skipBtn.hidden = false;
          againBtn.hidden = true;
        }
      }

      function frame(now) {
        if (!running) return;
        if (!started) started = now - elapsed;
        elapsed = now - started;
        apply(elapsed, false);
        if (elapsed < TOTAL) raf = requestAnimationFrame(frame);
        else apply(TOTAL, true);
      }

      function start() {
        cancelAnimationFrame(raf);
        started = 0;
        elapsed = 0;
        running = true;
        lastLive = "";
        document.body.classList.remove("is-ready");
        skipBtn.hidden = false;
        againBtn.hidden = true;
        apply(0, false);
        raf = requestAnimationFrame(frame);
      }

      skipBtn.addEventListener("click", function () {
        running = false;
        cancelAnimationFrame(raf);
        elapsed = TOTAL;
        lastDraw = -1;
        apply(TOTAL, true);
        againBtn.focus();
      });

      againBtn.addEventListener("click", start);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          if (!running) return;
          running = false;
          cancelAnimationFrame(raf);
          return;
        }
        if (elapsed < TOTAL && !document.body.classList.contains("is-ready")) {
          running = true;
          started = performance.now() - elapsed;
          raf = requestAnimationFrame(frame);
        }
      });

      reduce.addEventListener("change", function () {
        if (!document.body.classList.contains("is-ready")) start();
      });

      start();
    })();
  </script>
</body>
</html>
