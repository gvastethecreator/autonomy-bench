<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Meridian · Regulator</title>
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --font-ui: "Segoe UI", system-ui, -apple-system, sans-serif;
      --sky-top: oklch(0.14 0.04 260);
      --sky-bot: oklch(0.10 0.03 250);
      --glow: oklch(0.78 0.12 70 / 0.0);
      --lamp: 0;
      --star: 0.85;
      --sun-x: 50%;
      --sun-y: 120%;
      --moon-x: 72%;
      --moon-y: 28%;
      --moon-a: 0;
      --day: 0;
      --shade-x: 14px;
      --ink: oklch(0.93 0.02 85);
      --ink-muted: oklch(0.78 0.03 80);
      --ink-subtle: oklch(0.62 0.03 80);
      --brass: oklch(0.72 0.11 75);
      --brass-deep: oklch(0.48 0.08 65);
      --enamel: oklch(0.93 0.02 88);
      --steel: oklch(0.36 0.07 250);
      --wood-1: oklch(0.28 0.045 52);
      --wood-2: oklch(0.22 0.04 48);
      --wood-3: oklch(0.33 0.05 55);
      --wall: oklch(0.16 0.025 55);
      --focus: oklch(0.86 0.12 85);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: var(--font-ui);
      background: var(--wall);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: oklch(0.72 0.11 75 / 0.35);
      color: oklch(0.98 0.02 85);
    }

    .skip {
      position: absolute;
      inset-inline-start: 12px;
      top: 12px;
      z-index: 20;
      padding: 8px 14px;
      border-radius: 8px;
      background: oklch(0.18 0.02 55);
      color: var(--ink);
      text-decoration: none;
      transform: translateY(-120%);
    }
    .skip:focus { transform: none; outline: 2px solid var(--focus); outline-offset: 3px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .scene {
      min-height: 100dvh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .study {
      position: relative;
      display: grid;
      grid-template-columns: 1fr minmax(220px, 32vw);
      align-items: stretch;
      min-height: 0;
      overflow: hidden;
    }

    .window {
      position: relative;
      margin: clamp(16px, 3vh, 36px) 0 clamp(16px, 3vh, 36px) clamp(16px, 3vw, 40px);
      border-radius: 4px 4px 2px 2px;
      overflow: hidden;
      background: var(--sky-top);
      box-shadow:
        inset 0 0 0 10px oklch(0.18 0.03 55),
        inset 0 0 0 12px oklch(0.38 0.06 70),
        0 0 0 1px oklch(0.12 0.02 50),
        calc(var(--shade-x) * -0.3) 18px 40px oklch(0.08 0.02 50 / 0.45);
    }

    .sky {
      position: absolute;
      inset: 12px;
      border-radius: 2px;
      overflow: hidden;
      background: linear-gradient(in oklab, var(--sky-top), var(--sky-bot));
    }

    #sky {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .sun {
      position: absolute;
      left: var(--sun-x);
      top: var(--sun-y);
      width: clamp(36px, 8vw, 88px);
      height: clamp(36px, 8vw, 88px);
      border-radius: 50%;
      background: oklch(0.95 0.12 85);
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 24px 8px oklch(0.92 0.14 80 / 0.85),
        0 0 90px 28px oklch(0.82 0.14 70 / 0.45),
        0 0 160px 60px var(--glow);
      opacity: var(--day);
      pointer-events: none;
    }

    .moon {
      position: absolute;
      left: var(--moon-x);
      top: var(--moon-y);
      width: clamp(22px, 4.4vw, 48px);
      height: clamp(22px, 4.4vw, 48px);
      border-radius: 50%;
      background: oklch(0.92 0.03 95);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 24px 6px oklch(0.85 0.04 90 / 0.35);
      opacity: var(--moon-a);
      overflow: hidden;
      pointer-events: none;
    }

    .moon .shade {
      position: absolute;
      inset: 0;
      background: var(--sky-top);
      transform: translateX(var(--moon-shift, 50%));
      border-radius: 50%;
    }

    .muntins {
      position: absolute;
      inset: 12px;
      pointer-events: none;
      background:
        linear-gradient(oklch(0.32 0.04 55 / 0.92) 0 0) 50% / 8px 100% no-repeat,
        linear-gradient(oklch(0.32 0.04 55 / 0.92) 0 0) 0 33.33% / 100% 8px no-repeat,
        linear-gradient(oklch(0.32 0.04 55 / 0.92) 0 0) 0 66.66% / 100% 8px no-repeat;
      box-shadow: inset 0 0 80px oklch(0.08 0.02 50 / 0.28);
    }

    .sill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      background: linear-gradient(in oklab, oklch(0.38 0.05 70), oklch(0.24 0.04 55));
      box-shadow: 0 -8px 24px oklch(0.85 0.12 70 / var(--lamp));
    }

    .lamp {
      position: absolute;
      left: 18%;
      bottom: 18px;
      width: 42%;
      height: 46%;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 100%, oklch(0.82 0.14 70 / calc(var(--lamp) * 0.55)), transparent 70%);
      mix-blend-mode: screen;
    }

    .dust {
      position: absolute;
      inset: 12px;
      pointer-events: none;
      opacity: calc(var(--lamp) * 0.55 + 0.08);
    }

    .dust span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: oklch(0.95 0.04 90 / 0.55);
    }

    .pier {
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vh, 48px) clamp(12px, 3vw, 40px) 8px;
    }

    .regulator {
      position: relative;
      width: min(300px, 78vw);
      transform-origin: 50% 0;
      filter: drop-shadow(var(--shade-x) 22px 28px oklch(0.07 0.02 50 / 0.55));
    }

    .case {
      background:
        repeating-linear-gradient(
          90deg,
          var(--wood-2) 0 2px,
          var(--wood-1) 2px 5px,
          var(--wood-3) 5px 7px
        );
      border: 1px solid oklch(0.18 0.03 50);
      border-radius: 6px 6px 10px 10px;
      padding: 10px 12px 14px;
      box-shadow:
        inset 0 1px 0 oklch(0.45 0.05 60 / 0.45),
        inset 0 -8px 16px oklch(0.12 0.03 50 / 0.45);
    }

    .pediment {
      height: 28px;
      margin: -10px -12px 8px;
      background:
        linear-gradient(in oklab, var(--wood-3), var(--wood-2));
      clip-path: polygon(0 100%, 4% 42%, 50% 0, 96% 42%, 100% 100%);
      box-shadow: inset 0 1px 0 oklch(0.5 0.05 65 / 0.4);
    }

    .pediment::after {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      margin: 8px auto 0;
      background: radial-gradient(circle at 35% 30%, oklch(0.85 0.12 80), var(--brass-deep));
      border-radius: 50%;
    }

    .movement {
      position: relative;
      aspect-ratio: 1;
      border-radius: 4px;
      background: oklch(0.14 0.02 50);
      padding: 10px;
      box-shadow:
        inset 0 0 0 3px var(--brass-deep),
        inset 0 0 0 5px var(--brass),
        inset 0 0 0 7px oklch(0.38 0.07 70);
    }

    #dial {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .glass {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      pointer-events: none;
      background:
        linear-gradient(
          125deg,
          oklch(1 0 0 / 0.22) 0%,
          oklch(1 0 0 / 0.05) 28%,
          transparent 42%,
          transparent 62%,
          oklch(0.4 0.04 250 / 0.08) 100%
        );
      box-shadow: inset 0 -18px 24px oklch(0.2 0.03 70 / 0.12);
    }

    .hinges {
      position: absolute;
      right: 2px;
      top: 28%;
      width: 7px;
      height: 44%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .hinges i {
      display: block;
      height: 18px;
      border-radius: 1px;
      background: linear-gradient(90deg, oklch(0.55 0.1 70), oklch(0.78 0.12 80), oklch(0.48 0.08 65));
    }

    .waist {
      height: 14px;
      margin: 0 18px;
      background: linear-gradient(in oklab, var(--wood-1), var(--wood-2));
      box-shadow: inset 0 1px 0 oklch(0.4 0.05 60 / 0.3);
    }

    .well {
      position: relative;
      height: clamp(120px, 22vh, 210px);
      margin: 0 22px 0;
      border-radius: 0 0 4px 4px;
      background: oklch(0.10 0.02 50);
      overflow: hidden;
      box-shadow:
        inset 0 0 0 3px var(--brass-deep),
        inset 0 0 0 4px oklch(0.62 0.1 75 / 0.65),
        inset 0 12px 20px oklch(0.05 0.02 50 / 0.65);
    }

    .well-glass {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, oklch(1 0 0 / 0.08), transparent 40%);
      pointer-events: none;
    }

    .pendulum {
      position: absolute;
      left: 50%;
      top: -6px;
      width: 36px;
      height: 108%;
      margin-left: -18px;
      transform-origin: 50% 0;
      will-change: transform;
    }

    .gridiron {
      display: flex;
      justify-content: center;
      gap: 2px;
      height: 62%;
      padding-top: 0;
    }

    .gridiron span {
      width: 2px;
      height: 100%;
      border-radius: 1px;
    }
    .gridiron span:nth-child(odd) { background: oklch(0.62 0.04 70); }
    .gridiron span:nth-child(even) { background: var(--brass); }

    .bob {
      width: 34px;
      height: 34px;
      margin: -4px auto 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, oklch(0.82 0.12 80), var(--brass) 42%, var(--brass-deep));
      box-shadow:
        0 4px 8px oklch(0.1 0.02 50 / 0.5),
        inset 0 1px 0 oklch(0.9 0.08 80 / 0.5);
    }

    .nut {
      width: 8px;
      height: 8px;
      margin: 3px auto 0;
      background: oklch(0.55 0.08 70);
      border-radius: 1px;
    }

    .plinth {
      height: 22px;
      margin-top: 6px;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(in oklab, var(--wood-1), var(--wood-2));
      box-shadow: inset 0 1px 0 oklch(0.42 0.05 60 / 0.35);
    }

    .plaque {
      margin: 14px 4px 0;
      text-align: center;
    }

    .plaque time {
      display: block;
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4.4vw, 2.5rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: oklch(0.96 0.02 85);
      text-shadow: 0 1px 0 oklch(0.1 0.02 50 / 0.6);
    }

    .plaque time .sec {
      font-size: 0.52em;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
      margin-inline-start: 0.18em;
    }

    .meta {
      margin: 6px 0 0;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--ink-muted);
      text-wrap: pretty;
    }

    .meta strong {
      display: block;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .eq {
      margin-top: 4px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }

    .rail {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 20px;
      padding: 12px clamp(16px, 4vw, 40px) 16px;
      background: linear-gradient(in oklab, oklch(0.14 0.025 50), oklch(0.12 0.02 50));
      border-top: 1px solid oklch(0.32 0.05 70 / 0.35);
    }

    .hint {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .controls button {
      appearance: none;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid oklch(0.62 0.1 75 / 0.35);
      background: oklch(0.2 0.03 55);
      color: var(--ink);
      font: 500 0.85rem/1 var(--font-ui);
      letter-spacing: 0.02em;
      cursor: pointer;
      transition-property: background, border-color, transform;
      transition-duration: 150ms;
      transition-timing-function: ease;
    }

    .controls button[aria-pressed="true"] {
      background: oklch(0.32 0.06 70);
      border-color: var(--brass);
      color: oklch(0.96 0.03 85);
    }

    .controls button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .controls button:active { transform: scale(0.96); }

    .noscript {
      margin: 0;
      padding: 24px;
      text-align: center;
      font-family: var(--font-display);
    }

    @media (hover: hover) and (pointer: fine) {
      .controls button:hover {
        background: oklch(0.26 0.04 58);
        border-color: oklch(0.7 0.11 75 / 0.7);
      }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .study {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(28vh, 34vh) 1fr;
      }
      .window {
        margin: 8px 12px 0;
        min-height: 28vh;
      }
      .muntins {
        background:
          linear-gradient(oklch(0.32 0.04 55 / 0.35) 0 0) 50% / 6px 100% no-repeat,
          linear-gradient(oklch(0.32 0.04 55 / 0.35) 0 0) 0 50% / 100% 6px no-repeat;
      }
      .pier { padding: 8px 12px 0; }
      .well { height: clamp(88px, 16vh, 140px); }
    }

    @media (max-height: 680px) {
      .well { height: 72px; }
      .pediment { height: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dust span { animation: none !important; }
      .pendulum { transition: none; }
      .sun, .moon { transition: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .regulator {
        animation: rise 700ms var(--ease-out) both;
      }
      .plaque {
        animation: rise 700ms var(--ease-out) 90ms both;
      }
      .dust span {
        animation: mote 9s linear infinite;
      }
      .dust span:nth-child(2) { animation-duration: 12s; animation-delay: -2s; }
      .dust span:nth-child(3) { animation-duration: 8s; animation-delay: -5s; }
      .dust span:nth-child(4) { animation-duration: 14s; animation-delay: -1s; }
      .dust span:nth-child(5) { animation-duration: 11s; animation-delay: -7s; }
      .sun, .moon {
        transition-property: left, top, opacity;
        transition-duration: 400ms;
        transition-timing-function: linear;
      }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes mote {
      from { transform: translate3d(0, 18px, 0); opacity: 0; }
      12% { opacity: 0.7; }
      to { transform: translate3d(12px, -46px, 0); opacity: 0; }
    }

    @media (prefers-contrast: more) {
      .plaque time { color: white; }
      .meta, .hint { color: oklch(0.88 0.02 85); }
      .controls button { border-width: 2px; }
      .movement { box-shadow: inset 0 0 0 4px oklch(0.85 0.12 80); }
    }

    @media (forced-colors: active) {
      body { background: Canvas; color: CanvasText; }
      .window, .case, .well, .rail { background: Canvas; border: 1px solid CanvasText; }
      .controls button { border: 2px solid ButtonText; background: ButtonFace; color: ButtonText; }
      .sun, .moon, .lamp, .dust, .glass, .muntins { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#readout">Skip to time</a>
  <h1 class="sr-only">Meridian regulator clock</h1>

  <div class="scene">
    <div class="study">
      <div class="window" aria-hidden="true">
        <div class="sky">
          <canvas id="sky"></canvas>
          <div class="sun" id="sun"></div>
          <div class="moon" id="moon"><i class="shade" id="moonShade"></i></div>
        </div>
        <div class="muntins"></div>
        <div class="lamp"></div>
        <div class="dust" id="dust"></div>
        <div class="sill"></div>
      </div>

      <div class="pier">
        <article class="regulator" aria-labelledby="readout" aria-describedby="meta">
          <div class="case">
            <div class="pediment"></div>
            <div class="movement">
              <canvas id="dial" width="480" height="480"></canvas>
              <div class="glass"></div>
              <div class="hinges" aria-hidden="true"><i></i><i></i></div>
            </div>
            <div class="waist"></div>
            <div class="well">
              <div class="pendulum" id="pendulum">
                <div class="gridiron">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="bob"></div>
                <div class="nut"></div>
              </div>
              <div class="well-glass"></div>
            </div>
            <div class="plinth"></div>
          </div>
          <div class="plaque">
            <time id="readout" datetime="">00:00<span class="sec">00</span></time>
            <p class="meta" id="meta">
              <strong id="dateLine">—</strong>
              <span id="periodLine">—</span>
            </p>
            <p class="eq" id="eqLine">Sun · mean time</p>
          </div>
        </article>
      </div>
    </div>

    <footer class="rail">
      <p class="hint" id="hint">Minutes on the chapter ring · hours above · seconds below</p>
      <div class="controls">
        <button type="button" id="fmtBtn" aria-pressed="false" aria-label="Use 24-hour time">24-hour</button>
        <button type="button" id="tickBtn" aria-pressed="false" aria-label="Play pendulum tick">Tick</button>
      </div>
    </footer>
  </div>

  <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="announce"></div>

  <noscript>
    <p class="noscript">This clock needs JavaScript to keep solar time.</p>
  </noscript>

  <script>
    (function () {
      const skyCanvas = document.getElementById("sky");
      const dialCanvas = document.getElementById("dial");
      const skyCtx = skyCanvas.getContext("2d");
      const dialCtx = dialCanvas.getContext("2d");
      const pendulum = document.getElementById("pendulum");
      const readout = document.getElementById("readout");
      const dateLine = document.getElementById("dateLine");
      const periodLine = document.getElementById("periodLine");
      const eqLine = document.getElementById("eqLine");
      const announce = document.getElementById("announce");
      const fmtBtn = document.getElementById("fmtBtn");
      const tickBtn = document.getElementById("tickBtn");
      const moonShade = document.getElementById("moonShade");
      const root = document.documentElement;
      const hint = document.getElementById("hint");

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const hourFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
      const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" });
      const tzFmt = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" });
      const pad = (n) => String(n).padStart(2, "0");

      let use24 = false;
      let tickOn = false;
      let audio;
      let lastSecond = -1;
      let lastAnnounce = "";
      let raf = 0;
      let skyW = 0;
      let skyH = 0;
      let stars = [];
      let dialFace = null;

      const SKY = [
        { t: 0.00, top: [0.13, 0.045, 262], bot: [0.08, 0.035, 250] },
        { t: 4.80, top: [0.14, 0.05, 268], bot: [0.10, 0.04, 260] },
        { t: 5.70, top: [0.22, 0.09, 285], bot: [0.30, 0.13, 42] },
        { t: 6.60, top: [0.42, 0.10, 240], bot: [0.58, 0.13, 62] },
        { t: 8.20, top: [0.62, 0.08, 228], bot: [0.80, 0.05, 95] },
        { t: 12.0, top: [0.74, 0.08, 230], bot: [0.90, 0.03, 105] },
        { t: 16.2, top: [0.64, 0.07, 228], bot: [0.82, 0.05, 80] },
        { t: 18.1, top: [0.44, 0.10, 250], bot: [0.60, 0.14, 55] },
        { t: 19.4, top: [0.26, 0.11, 278], bot: [0.34, 0.14, 28] },
        { t: 21.0, top: [0.16, 0.07, 268], bot: [0.12, 0.08, 300] },
        { t: 24.0, top: [0.13, 0.045, 262], bot: [0.08, 0.035, 250] }
      ];

      function lerp(a, b, t) { return a + (b - a) * t; }
      function mix(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }
      function oklch(l, c, h, a) {
        return a == null ? "oklch(" + l + " " + c + " " + h + ")" : "oklch(" + l + " " + c + " " + h + " / " + a + ")";
      }
      function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }

      function sampleSky(hour) {
        let i = 0;
        while (i < SKY.length - 1 && SKY[i + 1].t < hour) i++;
        const a = SKY[i];
        const b = SKY[i + 1];
        const t = (hour - a.t) / (b.t - a.t || 1);
        return { top: mix(a.top, b.top, t), bot: mix(a.bot, b.bot, t) };
      }

      function solar(date) {
        const h = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
        const rise = 5.85;
        const set = 19.55;
        const daySpan = set - rise;
        const u = (h - rise) / daySpan;
        const up = u > 0 && u < 1;
        const elev = up ? Math.sin(Math.PI * u) : 0;
        const day = clamp(elev * 1.15, 0, 1);
        const az = up ? u : (h < 12 ? 0 : 1);
        return { h, day, elev, az, up };
      }

      function moonPhase(date) {
        const synodic = 29.53058867;
        const known = Date.UTC(2000, 0, 6, 18, 14);
        const days = (date.getTime() - known) / 86400000;
        const p = ((days / synodic) % 1 + 1) % 1;
        return p;
      }

      function equationOfTime(date) {
        const start = Date.UTC(date.getFullYear(), 0, 0);
        const d = (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - start) / 86400000;
        const B = (2 * Math.PI * (d - 81)) / 364;
        return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
      }

      function periodName(h, day) {
        if (h < 4.8 || h >= 21.5) return "Night";
        if (h < 5.7) return "Astronomical twilight";
        if (h < 6.4) return "Nautical twilight";
        if (h < 7.0) return "Civil dawn";
        if (h < 11.2) return "Morning";
        if (h < 13.4) return "Midday";
        if (h < 17.2) return "Afternoon";
        if (h < 18.8) return "Golden hour";
        if (h < 19.8) return "Civil dusk";
        if (day < 0.08) return "Night";
        return "Evening";
      }

      function seedStars(w, h) {
        const rng = (s) => () => (s = Math.imul(s ^ (s >>> 15), 1 | s) >>> 0) / 4294967296;
        const r = rng(0x6d657269);
        const out = [];
        const n = Math.floor((w * h) / 2800);
        for (let i = 0; i < n; i++) {
          out.push({
            x: r() * w,
            y: r() * h * 0.72,
            s: r() * 1.4 + 0.3,
            a: r() * 0.7 + 0.25
          });
        }
        return out;
      }

      function sizeSky() {
        const pane = skyCanvas.parentElement;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(1, pane.clientWidth);
        const h = Math.max(1, pane.clientHeight);
        skyW = w;
        skyH = h;
        skyCanvas.width = Math.floor(w * dpr);
        skyCanvas.height = Math.floor(h * dpr);
        skyCanvas.style.width = w + "px";
        skyCanvas.style.height = h + "px";
        skyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = seedStars(w, h);
      }

      function drawHorizon(ctx, w, h, bot) {
        ctx.fillStyle = oklch(bot[0] * 0.28, bot[1] * 0.6, bot[2] + 8, 1);
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(0, h * 0.78);
        const ridges = [0.12, 0.22, 0.31, 0.44, 0.57, 0.7, 0.82, 0.93];
        const highs = [0.70, 0.62, 0.67, 0.58, 0.64, 0.60, 0.69, 0.66];
        ridges.forEach((x, i) => {
          ctx.lineTo(w * x, h * highs[i]);
        });
        ctx.lineTo(w, h * 0.74);
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = oklch(0.12, 0.02, 60, 0.55);
        const base = h * 0.82;
        [[0.18, 0.08, 0.16], [0.48, 0.05, 0.12], [0.71, 0.1, 0.2]].forEach(function (b) {
          const x = w * b[0];
          const bw = w * b[1];
          const bh = h * b[2];
          ctx.fillRect(x, base - bh, bw, bh);
          ctx.fillRect(x + bw * 0.15, base - bh - bh * 0.35, bw * 0.22, bh * 0.35);
          ctx.fillRect(x + bw * 0.55, base - bh - bh * 0.18, bw * 0.28, bh * 0.18);
        });
      }

      function paintSky(sol, phase) {
        const w = skyW;
        const h = skyH;
        if (!w) return;
        const col = sampleSky(sol.h);
        skyCtx.clearRect(0, 0, w, h);
        const g = skyCtx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, oklch(col.top[0], col.top[1], col.top[2]));
        g.addColorStop(1, oklch(col.bot[0], col.bot[1], col.bot[2]));
        skyCtx.fillStyle = g;
        skyCtx.fillRect(0, 0, w, h);

        if (sol.day < 0.55) {
          const a = (1 - sol.day / 0.55) * 0.9;
          stars.forEach(function (s) {
            skyCtx.fillStyle = oklch(0.96, 0.02, 90, s.a * a);
            skyCtx.fillRect(s.x, s.y, s.s, s.s);
          });
        }

        drawHorizon(skyCtx, w, h, col.bot);
      }

      function polar(cx, cy, r, deg) {
        const a = (deg - 90) * Math.PI / 180;
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      }

      function makeDialFace(size) {
        const c = document.createElement("canvas");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        c.width = size * dpr;
        c.height = size * dpr;
        const ctx = c.getContext("2d");
        ctx.scale(dpr, dpr);
        const cx = size / 2;
        const cy = size / 2;
        const r = size * 0.48;

        const enamel = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.28, r * 0.1, cx, cy, r);
        enamel.addColorStop(0, "oklch(0.96 0.018 88)");
        enamel.addColorStop(1, "oklch(0.88 0.028 80)");
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = enamel;
        ctx.fill();

        ctx.strokeStyle = "oklch(0.55 0.09 70)";
        ctx.lineWidth = size * 0.012;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.965, 0, Math.PI * 2);
        ctx.strokeStyle = "oklch(0.72 0.11 75)";
        ctx.lineWidth = size * 0.006;
        ctx.stroke();

        ctx.strokeStyle = "oklch(0.22 0.03 50)";
        for (let i = 0; i < 60; i++) {
          const major = i % 5 === 0;
          ctx.lineWidth = major ? size * 0.008 : size * 0.003;
          const a = i * 6;
          const p1 = polar(cx, cy, r * (major ? 0.82 : 0.86), a);
          const p2 = polar(cx, cy, r * 0.93, a);
          ctx.beginPath();
          ctx.moveTo(p1[0], p1[1]);
          ctx.lineTo(p2[0], p2[1]);
          ctx.stroke();
        }

        ctx.fillStyle = "oklch(0.20 0.03 50)";
        ctx.font = "600 " + (size * 0.072) + "px " + getComputedStyle(root).getPropertyValue("--font-display");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let m = 5; m <= 60; m += 5) {
          const p = polar(cx, cy, r * 0.72, m * 6);
          ctx.fillText(String(m), p[0], p[1] + size * 0.006);
        }

        function subdial(ox, oy, sr, label, marks, romans) {
          ctx.beginPath();
          ctx.arc(ox, oy, sr, 0, Math.PI * 2);
          ctx.fillStyle = "oklch(0.91 0.02 86)";
          ctx.fill();
          ctx.lineWidth = size * 0.004;
          ctx.strokeStyle = "oklch(0.28 0.03 50)";
          ctx.stroke();
          ctx.lineWidth = size * 0.0025;
          for (let i = 0; i < marks; i++) {
            const major = i % (marks / 12 === 5 ? 5 : marks / 12) === 0;
            const a = i * (360 / marks);
            const p1 = polar(ox, oy, sr * (major ? 0.72 : 0.82), a);
            const p2 = polar(ox, oy, sr * 0.92, a);
            ctx.beginPath();
            ctx.moveTo(p1[0], p1[1]);
            ctx.lineTo(p2[0], p2[1]);
            ctx.stroke();
          }
          ctx.fillStyle = "oklch(0.22 0.03 50)";
          ctx.font = "600 " + (sr * 0.22) + "px " + getComputedStyle(root).getPropertyValue("--font-display");
          if (romans) {
            const R = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
            R.forEach(function (t, i) {
              const p = polar(ox, oy, sr * 0.58, i * 30);
              ctx.fillText(t, p[0], p[1] + 1);
            });
          } else {
            for (let s = 0; s < 60; s += 10) {
              const p = polar(ox, oy, sr * 0.58, s * 6);
              ctx.fillText(String(s === 0 ? 60 : s), p[0], p[1] + 1);
            }
          }
          ctx.font = "500 " + (size * 0.028) + "px " + getComputedStyle(root).getPropertyValue("--font-ui");
          ctx.fillStyle = "oklch(0.38 0.04 50)";
          ctx.fillText(label, ox, oy + sr * 0.42);
        }

        subdial(cx, cy - r * 0.38, r * 0.22, "HOURS", 60, true);
        subdial(cx, cy + r * 0.40, r * 0.20, "SECONDS", 60, false);

        const dw = size * 0.09;
        const dh = size * 0.07;
        const dx = cx + r * 0.42;
        const dy = cy - dh / 2;
        ctx.fillStyle = "oklch(0.97 0.01 90)";
        ctx.strokeStyle = "oklch(0.25 0.03 50)";
        ctx.lineWidth = size * 0.004;
        ctx.beginPath();
        ctx.roundRect(dx - dw / 2, dy, dw, dh, 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = "500 " + (size * 0.026) + "px " + getComputedStyle(root).getPropertyValue("--font-ui");
        ctx.fillStyle = "oklch(0.4 0.04 55)";
        ctx.fillText("MERIDIAN", cx, cy - r * 0.08);
        ctx.font = "500 " + (size * 0.022) + "px " + getComputedStyle(root).getPropertyValue("--font-ui");
        ctx.fillText("EIGHT-DAY  ·  REGULATOR", cx, cy + r * 0.08);

        return { canvas: c, dateBox: { x: dx, y: dy, w: dw, h: dh, size: size } };
      }

      function hand(ctx, cx, cy, ang, len, width, color, tail) {
        const a = (ang - 90) * Math.PI / 180;
        const dx = Math.cos(a);
        const dy = Math.sin(a);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(cx - dx * tail, cy - dy * tail);
        ctx.lineTo(cx + dx * len, cy + dy * len);
        ctx.stroke();
      }

      function paintClock(date, size) {
        if (!dialFace || dialFace.size !== size) {
          dialFace = makeDialFace(size);
          dialFace.size = size;
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (dialCanvas.width !== size * dpr) {
          dialCanvas.width = size * dpr;
          dialCanvas.height = size * dpr;
        }
        dialCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dialCtx.clearRect(0, 0, size, size);
        dialCtx.drawImage(dialFace.canvas, 0, 0, size, size);

        const cx = size / 2;
        const cy = size / 2;
        const r = size * 0.48;
        const ms = date.getMilliseconds();
        const sec = date.getSeconds() + (reduce ? 0 : ms / 1000);
        const min = date.getMinutes() + sec / 60;
        const hr = (date.getHours() % 12) + min / 60;

        const box = dialFace.dateBox;
        dialCtx.fillStyle = "oklch(0.18 0.03 50)";
        dialCtx.font = "600 " + (box.size * 0.042) + "px " + getComputedStyle(root).getPropertyValue("--font-display");
        dialCtx.textAlign = "center";
        dialCtx.textBaseline = "middle";
        dialCtx.fillText(String(date.getDate()), box.x, box.y + box.h / 2 + 1);

        const hx = cx;
        const hy = cy - r * 0.38;
        const sx = cx;
        const sy = cy + r * 0.40;
        const hrR = r * 0.22;
        const secR = r * 0.20;

        hand(dialCtx, hx, hy, hr * 30, hrR * 0.62, size * 0.012, "oklch(0.32 0.07 250)", hrR * 0.18);
        dialCtx.beginPath();
        dialCtx.arc(hx, hy, size * 0.01, 0, Math.PI * 2);
        dialCtx.fillStyle = "oklch(0.32 0.07 250)";
        dialCtx.fill();

        hand(dialCtx, cx, cy, min * 6, r * 0.78, size * 0.014, "oklch(0.30 0.08 252)", r * 0.16);
        dialCtx.beginPath();
        dialCtx.arc(cx, cy, size * 0.018, 0, Math.PI * 2);
        dialCtx.fillStyle = "oklch(0.30 0.08 252)";
        dialCtx.fill();
        dialCtx.beginPath();
        dialCtx.arc(cx, cy, size * 0.007, 0, Math.PI * 2);
        dialCtx.fillStyle = "oklch(0.72 0.11 75)";
        dialCtx.fill();

        hand(dialCtx, sx, sy, sec * 6, secR * 0.78, size * 0.006, "oklch(0.52 0.18 28)", secR * 0.22);
        dialCtx.beginPath();
        dialCtx.arc(sx, sy, size * 0.008, 0, Math.PI * 2);
        dialCtx.fillStyle = "oklch(0.52 0.18 28)";
        dialCtx.fill();
      }

      function applyAtmosphere(date, sol, phase) {
        const col = sampleSky(sol.h);
        root.style.setProperty("--sky-top", oklch(col.top[0], col.top[1], col.top[2]));
        root.style.setProperty("--sky-bot", oklch(col.bot[0], col.bot[1], col.bot[2]));
        const lamp = clamp(1 - sol.day * 1.4, 0.05, 0.95);
        root.style.setProperty("--lamp", lamp.toFixed(3));
        root.style.setProperty("--day", sol.day.toFixed(3));
        root.style.setProperty("--glow", oklch(0.82, 0.14, 70, sol.day * 0.5));
        const sunX = lerp(8, 92, sol.az);
        const sunY = lerp(78, 18, sol.elev);
        root.style.setProperty("--sun-x", sunX + "%");
        root.style.setProperty("--sun-y", sol.up ? sunY + "%" : "120%");
        root.style.setProperty("--shade-x", (8 + sol.az * 22) + "px");

        const moonVis = clamp((1 - sol.day) * 1.2, 0, 1) * (phase < 0.03 || phase > 0.97 ? 0.15 : 1);
        const moonAz = (sol.az + (phase - 0.5) * 0.85 + 1) % 1;
        root.style.setProperty("--moon-a", moonVis.toFixed(3));
        root.style.setProperty("--moon-x", lerp(12, 88, moonAz) + "%");
        root.style.setProperty("--moon-y", lerp(22, 48, Math.abs(phase - 0.5) * 2) + "%");
        const shift = (phase < 0.5 ? 1 - phase * 2 : -(phase - 0.5) * 2) * 100;
        moonShade.style.transform = "translateX(" + shift + "%)";

        const angle = 3.4 * Math.cos(Math.PI * (date.getSeconds() + (reduce ? 0 : date.getMilliseconds() / 1000)));
        pendulum.style.transform = "rotate(" + (reduce ? 0 : angle) + "deg)";
      }

      function formatDigital(date) {
        const h24 = date.getHours();
        const h = use24 ? h24 : (h24 % 12 || 12);
        return { h: use24 ? pad(h) : String(h), m: pad(date.getMinutes()), s: pad(date.getSeconds()) };
      }

      function updateCopy(date, sol) {
        const t = formatDigital(date);
        readout.innerHTML = t.h + ":" + t.m + '<span class="sec">' + t.s + "</span>";
        readout.setAttribute("datetime", date.toISOString());
        const tzParts = tzFmt.formatToParts(date);
        const tz = (tzParts.find((p) => p.type === "timeZoneName") || {}).value || "";
        dateLine.textContent = dateFmt.format(date);
        periodLine.textContent = periodName(sol.h, sol.day) + (tz ? " · " + tz : "");
        const eot = equationOfTime(date);
        const abs = Math.abs(eot);
        const mins = Math.round(abs);
        if (mins === 0) eqLine.textContent = "Sun on mean time";
        else eqLine.textContent = "Sun " + (eot > 0 ? "fast" : "slow") + "  " + mins + " min";

        const minute = date.getMinutes();
        const key = date.getHours() + ":" + minute + (use24 ? "24" : "12");
        if (key !== lastAnnounce) {
          lastAnnounce = key;
          announce.textContent = "The time is " + hourFmt.format(date) + ", " + dateFmt.format(date) + ".";
        }
      }

      function ensureAudio() {
        if (audio) return audio;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audio = new AC();
        return audio;
      }

      function playTick() {
        const ac = ensureAudio();
        if (!ac) return;
        if (ac.state === "suspended") ac.resume();
        const t = ac.currentTime;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(1180, t);
        o.frequency.exponentialRampToValueAtTime(420, t + 0.03);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.045, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + 0.08);
      }

      function render() {
        const date = new Date();
        const sol = solar(date);
        const phase = moonPhase(date);
        applyAtmosphere(date, sol, phase);
        paintSky(sol, phase);
        const size = dialCanvas.clientWidth || 240;
        paintClock(date, size);
        updateCopy(date, sol);
        const sec = date.getSeconds();
        if (tickOn && sec !== lastSecond) playTick();
        lastSecond = sec;
      }

      function loop() {
        render();
        raf = reduce ? 0 : requestAnimationFrame(loop);
      }

      function start() {
        sizeSky();
        dialFace = null;
        if (reduce) {
          render();
          setInterval(render, 1000);
        } else {
          cancelAnimationFrame(raf);
          loop();
        }
      }

      fmtBtn.addEventListener("click", function () {
        use24 = !use24;
        fmtBtn.setAttribute("aria-pressed", String(use24));
        render();
      });

      tickBtn.addEventListener("click", function () {
        tickOn = !tickOn;
        tickBtn.setAttribute("aria-pressed", String(tickOn));
        if (tickOn) ensureAudio();
      });

      document.addEventListener("keydown", function (e) {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (e.key === "t" || e.key === "T") {
          fmtBtn.click();
        } else if (e.key === "s" || e.key === "S") {
          tickBtn.click();
        } else if (e.key === "Escape" && tickOn) {
          tickBtn.click();
        }
      });

      const dust = document.getElementById("dust");
      for (let i = 0; i < 6; i++) {
        const s = document.createElement("span");
        s.style.left = (8 + i * 15) + "%";
        s.style.top = (30 + (i % 3) * 18) + "%";
        dust.appendChild(s);
      }

      window.addEventListener("resize", function () {
        sizeSky();
        dialFace = null;
        render();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          cancelAnimationFrame(raf);
        } else if (!reduce) {
          loop();
        } else {
          render();
        }
      });

      hint.title = "T switches 12/24-hour · S toggles the tick";
      start();
    })();
  </script>
</body>
</html>
