<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" id="themeColor" content="#08090d">
  <title>Meridian — Regulator</title>
  <style>
    :root {
      --sky: #08090d;
      --fg: #ece4d4;
      --muted: #9a9284;
      --line: rgba(236, 228, 212, 0.16);
      --glow: #1c2240;
      --glow-a: 0.2;
      --sun-x: 50%;
      --sun-y: 118%;
      --shadow: rgba(0, 0, 0, 0.48);
      --dial: #101218;
      --gold: #c9a45c;
      --ivory: #f0e6d2;
      --hand: #efe6d4;
      --second: #d9b25a;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--sky);
      color: var(--fg);
      font-family: var(--sans);
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    canvas#stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .sun {
      position: fixed;
      left: var(--sun-x);
      top: var(--sun-y);
      width: 85vmax;
      height: 85vmax;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
      opacity: var(--glow-a);
      pointer-events: none;
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(0, 0, 0, 0.28) 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.045;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.9'/></svg>");
    }

    main {
      position: relative;
      z-index: 3;
      width: min(920px, 100%);
      display: grid;
      justify-items: center;
      gap: clamp(20px, 4vh, 36px);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    .mast {
      width: min(420px, 100%);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--fg);
    }

    #zone {
      margin: 0;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
    }

    .instrument {
      --case:  min(72vw, min(58vh, 440px));
      width: var(--case);
      height: var(--case);
      border-radius: 50%;
      padding: 11px;
      background:
        conic-gradient(from 210deg,
          #2a2c34 0deg,
          #6a6558 38deg,
          #3a3c46 80deg,
          #1c1e26 140deg,
          #5a564c 200deg,
          #2e3038 260deg,
          #8a8374 310deg,
          #2a2c34 360deg);
      box-shadow:
        0 28px 70px var(--shadow),
        0 2px 0 rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -8px 18px rgba(0, 0, 0, 0.35);
    }

    .instrument svg {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, #1a1d28 0%, var(--dial) 62%, #0a0b10 100%);
      box-shadow: inset 0 0 0 1px rgba(232, 214, 176, 0.08);
    }

    .civil {
      text-align: center;
      min-width: 0;
    }

    .hms {
      margin: 0;
      font-weight: 300;
      font-size: clamp(2.6rem, 8vw, 4.4rem);
      letter-spacing: 0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      color: var(--fg);
    }

    .hms .sep {
      opacity: 0.32;
      padding: 0 0.06em;
      font-weight: 200;
    }

    .hms .sec {
      display: inline-block;
      margin-left: 0.18em;
      font-size: 0.42em;
      letter-spacing: 0.12em;
      vertical-align: 0.62em;
      color: var(--gold);
      font-weight: 400;
    }

    .hms .ampm {
      display: inline-block;
      margin-left: 0.28em;
      font-size: 0.28em;
      letter-spacing: 0.22em;
      vertical-align: 1.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .dateline {
      margin: 10px 0 0;
      font-family: var(--serif);
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .tray {
      width: min(520px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px 20px;
      padding-top: 4px;
      border-top: 1px solid var(--line);
    }

    .moon-block {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .moon {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }

    .moon-name {
      margin: 0;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #fmt {
      appearance: none;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 40px;
      touch-action: manipulation;
    }

    #fmt:hover {
      border-color: color-mix(in srgb, var(--gold) 55%, var(--line));
      color: var(--gold);
    }

    #fmt:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .cities {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 4px;
      justify-items: end;
    }

    .cities li {
      display: grid;
      grid-template-columns: auto 4.2em;
      gap: 12px;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .cities time {
      color: var(--fg);
      text-align: right;
      font-weight: 500;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .tray {
        grid-template-columns: 1fr 1fr;
        justify-items: start;
      }
      .moon-block { grid-column: 1; }
      #fmt { grid-column: 2; justify-self: end; }
      .cities {
        grid-column: 1 / -1;
        width: 100%;
        grid-template-columns: repeat(3, 1fr);
        justify-items: stretch;
        gap: 8px 12px;
        padding-top: 4px;
      }
      .cities li {
        grid-template-columns: 1fr;
        gap: 2px;
        justify-items: start;
      }
      .cities time { text-align: left; }
    }

    @media (max-height: 700px) and (min-width: 900px) {
      main {
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto auto;
        column-gap: 48px;
        align-items: center;
        justify-items: start;
      }
      .instrument {
        grid-row: 1 / span 3;
        --case: min(64vh, 420px);
      }
      .mast, .civil, .tray { width: min(380px, 100%); }
      .civil { text-align: left; }
      .tray { grid-template-columns: 1fr; justify-items: start; }
      .cities { justify-items: start; }
      #fmt { justify-self: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; opacity: 1; transform: none; }
      #fmt { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <header class="mast">
      <h1>Meridian</h1>
      <p id="zone"></p>
    </header>

    <figure class="instrument">
      <svg id="face" viewBox="0 0 400 400" role="img" aria-labelledby="clockTitle clockDesc">
        <title id="clockTitle">Meridian regulator clock</title>
        <desc id="clockDesc">Minutes on the main dial, hours in the upper subdial, seconds in the lower subdial.</desc>
      </svg>
    </figure>

    <section class="civil" aria-label="Civil time">
      <p class="hms" id="hms"></p>
      <p class="dateline" id="dateline"></p>
    </section>

    <section class="tray" aria-label="Details">
      <div class="moon-block">
        <svg class="moon" id="moon" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <mask id="moonMask">
              <rect width="32" height="32" fill="black"/>
              <circle cx="16" cy="16" r="13" fill="white"/>
              <circle id="terminator" cx="16" cy="16" r="13" fill="black"/>
            </mask>
          </defs>
          <circle cx="16" cy="16" r="13.6" fill="none" stroke="#c9a45c" stroke-width="0.7" opacity="0.55"/>
          <circle cx="16" cy="16" r="13" fill="#1a1c24"/>
          <circle id="moonLit" cx="16" cy="16" r="13" fill="#e6d7b8" mask="url(#moonMask)"/>
        </svg>
        <p class="moon-name" id="moonName">Moon</p>
      </div>
      <button type="button" id="fmt" aria-pressed="true">24-hour</button>
      <ul class="cities" id="cities"></ul>
    </section>
  </main>

  <p class="sr-only" aria-live="polite" id="live"></p>

  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
      let reduce = reduceMq.matches;
      reduceMq.addEventListener("change", (e) => { reduce = e.matches; });

      const CITIES = [
        { label: "Tokyo", tz: "Asia/Tokyo" },
        { label: "London", tz: "Europe/London" },
        { label: "New York", tz: "America/New_York" }
      ];

      const PHASE_NAMES = [
        "New moon",
        "Waxing crescent",
        "First quarter",
        "Waxing gibbous",
        "Full moon",
        "Waning gibbous",
        "Last quarter",
        "Waning crescent"
      ];

      const SKY = [
        { h: 0.0,  sky: [8, 9, 14],     glow: [28, 34, 70],    a: 0.18, stars: 1.00, fg: [236, 228, 212], mu: [154, 146, 132] },
        { h: 4.6,  sky: [12, 12, 22],   glow: [90, 50, 70],    a: 0.28, stars: 0.85, fg: [236, 228, 212], mu: [154, 146, 132] },
        { h: 5.7,  sky: [46, 28, 40],   glow: [210, 90, 60],   a: 0.48, stars: 0.25, fg: [250, 236, 220], mu: [196, 168, 150] },
        { h: 6.6,  sky: [214, 164, 132],glow: [255, 176, 96],  a: 0.62, stars: 0.00, fg: [36, 28, 24],    mu: [96, 72, 60] },
        { h: 8.0,  sky: [186, 198, 208],glow: [255, 236, 210], a: 0.55, stars: 0.00, fg: [24, 26, 32],    mu: [84, 88, 96] },
        { h: 12.0, sky: [168, 186, 202],glow: [244, 248, 255], a: 0.58, stars: 0.00, fg: [22, 24, 30],    mu: [78, 84, 94] },
        { h: 16.5, sky: [186, 168, 154],glow: [255, 196, 120], a: 0.50, stars: 0.00, fg: [32, 26, 22],    mu: [96, 80, 68] },
        { h: 18.2, sky: [196, 112, 78], glow: [255, 140, 70],  a: 0.60, stars: 0.05, fg: [40, 22, 16],    mu: [120, 72, 52] },
        { h: 19.6, sky: [62, 32, 48],   glow: [200, 80, 50],   a: 0.42, stars: 0.35, fg: [244, 228, 210], mu: [176, 140, 122] },
        { h: 21.2, sky: [14, 12, 22],   glow: [48, 36, 80],    a: 0.22, stars: 0.85, fg: [236, 228, 212], mu: [154, 146, 132] },
        { h: 24.0, sky: [8, 9, 14],     glow: [28, 34, 70],    a: 0.18, stars: 1.00, fg: [236, 228, 212], mu: [154, 146, 132] }
      ];

      const face = document.getElementById("face");
      const hmsEl = document.getElementById("hms");
      const dateEl = document.getElementById("dateline");
      const zoneEl = document.getElementById("zone");
      const fmtBtn = document.getElementById("fmt");
      const citiesEl = document.getElementById("cities");
      const liveEl = document.getElementById("live");
      const moonNameEl = document.getElementById("moonName");
      const terminator = document.getElementById("terminator");
      const themeColor = document.getElementById("themeColor");
      const starsCanvas = document.getElementById("stars");
      const ctx = starsCanvas.getContext("2d");

      let hour12 = false;
      try {
        hour12 = localStorage.getItem("meridian-hour12") === "1";
      } catch (_) {}

      let lastAnnounce = "";
      let starOpacity = 1;
      let raf = 0;

      function svg(name, attrs, parent) {
        const n = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
        if (parent) parent.appendChild(n);
        return n;
      }

      function buildFace() {
        const defs = svg("defs", {}, face);
        const glow = svg("filter", { id: "secGlow", x: "-80%", y: "-80%", width: "260%", height: "260%" }, defs);
        svg("feGaussianBlur", { in: "SourceGraphic", stdDeviation: "1.4", result: "b" }, glow);
        const merge = svg("feMerge", {}, glow);
        svg("feMergeNode", { in: "b" }, merge);
        svg("feMergeNode", { in: "SourceGraphic" }, merge);

        svg("circle", { cx: 200, cy: 200, r: 196, fill: "none", stroke: "rgba(232,220,190,0.14)", "stroke-width": 1.2 }, face);
        svg("circle", { cx: 200, cy: 200, r: 188, fill: "none", stroke: "rgba(201,164,92,0.28)", "stroke-width": 0.7 }, face);

        const ticks = svg("g", { "aria-hidden": "true" }, face);
        for (let i = 0; i < 60; i++) {
          const major = i % 5 === 0;
          const a = (i * 6 - 90) * Math.PI / 180;
          const inner = major ? 168 : 176;
          const outer = 184;
          svg("line", {
            x1: 200 + Math.cos(a) * inner,
            y1: 200 + Math.sin(a) * inner,
            x2: 200 + Math.cos(a) * outer,
            y2: 200 + Math.sin(a) * outer,
            stroke: major ? "#e8dcc4" : "rgba(232,220,196,0.38)",
            "stroke-width": major ? 1.8 : 0.7,
            "stroke-linecap": "round"
          }, ticks);
        }

        const nums = svg("g", {
          fill: "#e8dcc4",
          "font-family": "Palatino Linotype, Palatino, Georgia, serif",
          "font-size": "17",
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, face);
        const minuteLabels = [60, 10, 20, 30, 40, 50];
        minuteLabels.forEach((label, i) => {
          const a = (i * 60 - 90) * Math.PI / 180;
          const r = 154;
          svg("text", { x: 200 + Math.cos(a) * r, y: 200 + Math.sin(a) * r }, nums).textContent = String(label);
        });

        svg("polygon", {
          points: "200,22 204.2,32 195.8,32",
          fill: "#c9a45c"
        }, face);

        const hourDial = svg("g", { id: "hourDial" }, face);
        svg("circle", { cx: 200, cy: 122, r: 52, fill: "none", stroke: "rgba(232,220,196,0.22)", "stroke-width": 0.8 }, hourDial);
        for (let i = 0; i < 12; i++) {
          const a = (i * 30 - 90) * Math.PI / 180;
          const major = i % 3 === 0;
          svg("line", {
            x1: 200 + Math.cos(a) * (major ? 42 : 46),
            y1: 122 + Math.sin(a) * (major ? 42 : 46),
            x2: 200 + Math.cos(a) * 50,
            y2: 122 + Math.sin(a) * 50,
            stroke: "#d8ccb4",
            "stroke-width": major ? 1.5 : 0.6,
            "stroke-linecap": "round"
          }, hourDial);
        }
        const hourNums = svg("g", {
          fill: "#d8ccb4",
          "font-family": "Palatino Linotype, Palatino, Georgia, serif",
          "font-size": "9",
          "letter-spacing": "0.08em",
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, hourDial);
        [[12, 0], [3, 90], [6, 180], [9, 270]].forEach(([label, deg]) => {
          const a = (deg - 90) * Math.PI / 180;
          const r = 32;
          const t = svg("text", { x: 200 + Math.cos(a) * r, y: 122 + Math.sin(a) * r }, hourNums);
          t.textContent = label === 12 ? "XII" : label === 3 ? "III" : label === 6 ? "VI" : "IX";
        });

        const secDial = svg("g", { id: "secDial" }, face);
        svg("circle", { cx: 200, cy: 286, r: 56, fill: "none", stroke: "rgba(201,164,92,0.35)", "stroke-width": 0.8 }, secDial);
        for (let i = 0; i < 60; i++) {
          const a = (i * 6 - 90) * Math.PI / 180;
          const major = i % 5 === 0;
          svg("line", {
            x1: 200 + Math.cos(a) * (major ? 46 : 51),
            y1: 286 + Math.sin(a) * (major ? 46 : 51),
            x2: 200 + Math.cos(a) * 54.5,
            y2: 286 + Math.sin(a) * 54.5,
            stroke: major ? "#c9a45c" : "rgba(201,164,92,0.4)",
            "stroke-width": major ? 1.3 : 0.55,
            "stroke-linecap": "round"
          }, secDial);
        }
        const secNums = svg("g", {
          fill: "#c9a45c",
          "font-family": "Palatino Linotype, Palatino, Georgia, serif",
          "font-size": "8.5",
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, secDial);
        [60, 15, 30, 45].forEach((label, i) => {
          const a = (i * 90 - 90) * Math.PI / 180;
          svg("text", { x: 200 + Math.cos(a) * 38, y: 286 + Math.sin(a) * 38 }, secNums).textContent = String(label);
        });

        svg("rect", {
          x: 268, y: 188, width: 30, height: 24, rx: 2,
          fill: "#efe6d4",
          stroke: "rgba(20,18,14,0.35)",
          "stroke-width": 0.6
        }, face);
        const dateWin = svg("text", {
          id: "dateWin",
          x: 283, y: 205.5,
          fill: "#16140f",
          "font-family": "Palatino Linotype, Palatino, Georgia, serif",
          "font-size": "13",
          "font-weight": "700",
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, face);
        dateWin.textContent = "01";

        svg("ellipse", {
          cx: 168, cy: 148, rx: 118, ry: 78,
          fill: "rgba(255,255,255,0.035)",
          transform: "rotate(-18 168 148)",
          "pointer-events": "none"
        }, face);

        const minHand = svg("g", { id: "minHand" }, face);
        svg("polygon", {
          points: "200,42 204.4,206 200,218 195.6,206",
          fill: "#efe6d4"
        }, minHand);
        svg("polygon", {
          points: "200,218 203,206 200,246 197,206",
          fill: "#cfc4ae"
        }, minHand);

        const hourHand = svg("g", { id: "hourHand" }, face);
        svg("polygon", {
          points: "200,86 202.7,128 200,136 197.3,128",
          fill: "#efe6d4"
        }, hourHand);

        const secHand = svg("g", { id: "secHand", filter: "url(#secGlow)" }, face);
        svg("line", {
          x1: 200, y1: 304, x2: 200, y2: 242,
          stroke: "#d9b25a",
          "stroke-width": 1.15,
          "stroke-linecap": "round"
        }, secHand);
        svg("circle", { cx: 200, cy: 286, r: 3.1, fill: "#d9b25a" }, secHand);
        svg("circle", { cx: 200, cy: 304, r: 2.1, fill: "#efe6d4" }, secHand);

        svg("circle", { cx: 200, cy: 200, r: 6.2, fill: "#c9a45c" }, face);
        svg("circle", { cx: 200, cy: 200, r: 3.1, fill: "#14161c" }, face);
        svg("circle", { cx: 200, cy: 200, r: 1.25, fill: "#efe6d4" }, face);
        svg("circle", { cx: 200, cy: 122, r: 3.4, fill: "#c9a45c" }, face);
        svg("circle", { cx: 200, cy: 122, r: 1.4, fill: "#14161c" }, face);
      }

      function pad(n) { return String(n).padStart(2, "0"); }

      function rgb(arr) {
        return "rgb(" + arr[0].toFixed(1) + ", " + arr[1].toFixed(1) + ", " + arr[2].toFixed(1) + ")";
      }

      function hex(arr) {
        return "#" + arr.map((v) => pad(Math.round(Math.max(0, Math.min(255, v))).toString(16))).join("");
      }

      function lerp(a, b, t) { return a + (b - a) * t; }
      function lerp3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

      function skyAt(hour) {
        let i = 0;
        while (i < SKY.length - 1 && SKY[i + 1].h < hour) i++;
        const a = SKY[i];
        const b = SKY[i + 1];
        const t = (hour - a.h) / (b.h - a.h || 1);
        return {
          sky: lerp3(a.sky, b.sky, t),
          glow: lerp3(a.glow, b.glow, t),
          a: lerp(a.a, b.a, t),
          stars: lerp(a.stars, b.stars, t),
          fg: lerp3(a.fg, b.fg, t),
          mu: lerp3(a.mu, b.mu, t)
        };
      }

      function applySky(now) {
        const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
        const s = skyAt(h);
        const root = document.documentElement.style;
        root.setProperty("--sky", rgb(s.sky));
        root.setProperty("--glow", rgb(s.glow));
        root.setProperty("--glow-a", s.a.toFixed(3));
        root.setProperty("--fg", rgb(s.fg));
        root.setProperty("--muted", rgb(s.mu));
        root.setProperty("--line", "rgba(" + s.fg[0].toFixed(0) + ", " + s.fg[1].toFixed(0) + ", " + s.fg[2].toFixed(0) + ", 0.16)");
        const elev = Math.cos((h - 12) * Math.PI / 12);
        const az = (h / 24) * Math.PI * 2 - Math.PI / 2;
        const x = 50 + Math.cos(az) * 34;
        const y = 78 - elev * 46;
        root.setProperty("--sun-x", x.toFixed(2) + "%");
        root.setProperty("--sun-y", y.toFixed(2) + "%");
        root.setProperty("--shadow", elev > 0 ? "rgba(20, 24, 32, 0.28)" : "rgba(0, 0, 0, 0.55)");
        themeColor.setAttribute("content", hex(s.sky));
        starOpacity = s.stars;
      }

      function moonPhase(date) {
        const synodic = 29.53058867;
        const known = Date.UTC(2000, 0, 6, 18, 14, 0);
        const days = (date.getTime() - known) / 86400000;
        const age = ((days % synodic) + synodic) % synodic;
        return age / synodic;
      }

      function applyMoon(date) {
        const phase = moonPhase(date);
        const idx = Math.round(phase * 8) % 8;
        const waxing = phase < 0.5;
        const offset = Math.cos(phase * Math.PI * 2) * 13;
        terminator.setAttribute("cx", String(16 + (waxing ? offset : -offset)));
        terminator.setAttribute("fill", phase > 0.47 && phase < 0.53 ? "white" : "black");
        if (phase > 0.47 && phase < 0.53) {
          terminator.setAttribute("cx", "16");
          terminator.setAttribute("fill", "white");
        }
        if (phase < 0.03 || phase > 0.97) {
          terminator.setAttribute("cx", "16");
          terminator.setAttribute("fill", "black");
        }
        const g = document.getElementById("moon");
        g.setAttribute("transform", waxing ? "" : "matrix(-1 0 0 1 32 0)");
        moonNameEl.textContent = PHASE_NAMES[idx];
        document.getElementById("moon").setAttribute("aria-label", PHASE_NAMES[idx]);
      }

      function formatZone(id) {
        if (!id) return "Local time";
        const leaf = id.split("/").pop().replace(/_/g, " ");
        return leaf;
      }

      function setFormatUI() {
        fmtBtn.setAttribute("aria-pressed", hour12 ? "false" : "true");
        fmtBtn.textContent = hour12 ? "12-hour" : "24-hour";
      }

      function renderCities(now) {
        const opts = {
          hour: "2-digit",
          minute: "2-digit",
          hour12: hour12,
          hourCycle: hour12 ? "h12" : "h23"
        };
        CITIES.forEach((c, i) => {
          const li = citiesEl.children[i];
          if (!li) return;
          const t = now.toLocaleTimeString(undefined, { ...opts, timeZone: c.tz });
          li.querySelector("time").textContent = t.replace(/ /g, "").replace(/([AP]M)/i, " $1");
        });
      }

      function buildCities() {
        citiesEl.innerHTML = "";
        CITIES.forEach((c) => {
          const li = document.createElement("li");
          li.innerHTML = "<span>" + c.label + "</span><time datetime=\"\"></time>";
          citiesEl.appendChild(li);
        });
      }

      const minHand = () => document.getElementById("minHand");
      const hourHand = () => document.getElementById("hourHand");
      const secHand = () => document.getElementById("secHand");
      const dateWin = () => document.getElementById("dateWin");

      function paint(now) {
        const ms = now.getMilliseconds();
        const sec = now.getSeconds() + (reduce ? 0 : ms / 1000);
        const min = now.getMinutes() + sec / 60;
        const hour = (now.getHours() % 12) + min / 60;

        minHand().setAttribute("transform", "rotate(" + (min * 6) + " 200 200)");
        hourHand().setAttribute("transform", "rotate(" + (hour * 30) + " 200 122)");
        secHand().setAttribute("transform", "rotate(" + (sec * 6) + " 200 286)");

        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        let hDisp = h;
        let ampm = "";
        if (hour12) {
          ampm = h >= 12 ? "PM" : "AM";
          hDisp = h % 12;
          if (hDisp === 0) hDisp = 12;
        }

        hmsEl.innerHTML =
          "<span>" + pad(hDisp) + "</span>" +
          "<span class=\"sep\">:</span>" +
          "<span>" + pad(m) + "</span>" +
          "<span class=\"sec\">" + pad(s) + "</span>" +
          (ampm ? "<span class=\"ampm\">" + ampm + "</span>" : "");

        const weekday = now.toLocaleDateString(undefined, { weekday: "long" });
        const rest = now.toLocaleDateString(undefined, { day: "numeric", month: "long" });
        dateEl.textContent = weekday + "  ·  " + rest;
        dateWin().textContent = String(now.getDate());

        const iso = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
          "T" + pad(h) + ":" + pad(m) + ":" + pad(s);
        hmsEl.setAttribute("datetime", iso);

        const spoken = now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        if (spoken !== lastAnnounce) {
          lastAnnounce = spoken;
          liveEl.textContent = "The time is " + spoken + " on " + weekday + ", " + rest + ".";
          document.getElementById("clockDesc").textContent =
            "Minutes " + pad(m) + ", hours " + (h % 12 || 12) + ", seconds " + pad(s) + ".";
        }

        renderCities(now);
        applySky(now);
      }

      const stars = [];
      function placeStars() {
        stars.length = 0;
        const n = 140;
        for (let i = 0; i < n; i++) {
          stars.push({
            x: Math.random(),
            y: Math.random(),
            r: Math.random() * 1.3 + 0.2,
            o: Math.random() * 0.7 + 0.2,
            tw: Math.random() * Math.PI * 2,
            sp: 0.4 + Math.random() * 1.2
          });
        }
      }

      function sizeStars() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        starsCanvas.width = Math.floor(window.innerWidth * dpr);
        starsCanvas.height = Math.floor(window.innerHeight * dpr);
      }

      function drawStars(t) {
        const w = starsCanvas.width;
        const h = starsCanvas.height;
        ctx.clearRect(0, 0, w, h);
        if (starOpacity < 0.02) return;
        ctx.save();
        ctx.globalAlpha = starOpacity;
        for (const s of stars) {
          const tw = reduce ? 1 : 0.55 + 0.45 * Math.sin(t * 0.001 * s.sp + s.tw);
          ctx.globalAlpha = starOpacity * s.o * tw;
          ctx.fillStyle = "#f4efe4";
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r * (window.devicePixelRatio || 1), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function loop(ts) {
        const now = new Date();
        paint(now);
        if (!reduce) drawStars(ts || 0);
        else drawStars(0);
        if (reduce) {
          window.setTimeout(() => { raf = requestAnimationFrame(loop); }, 250);
        } else {
          raf = requestAnimationFrame(loop);
        }
      }

      fmtBtn.addEventListener("click", () => {
        hour12 = !hour12;
        try { localStorage.setItem("meridian-hour12", hour12 ? "1" : "0"); } catch (_) {}
        setFormatUI();
        paint(new Date());
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "t" || e.key === "T") {
          if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
          fmtBtn.click();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) paint(new Date());
      });

      window.addEventListener("resize", () => {
        sizeStars();
        if (reduce) drawStars(0);
      });

      zoneEl.textContent = formatZone(Intl.DateTimeFormat().resolvedOptions().timeZone);
      buildFace();
      buildCities();
      setFormatUI();
      applyMoon(new Date());
      placeStars();
      sizeStars();
      paint(new Date());
      drawStars(0);
      raf = requestAnimationFrame(loop);

      window.setInterval(() => applyMoon(new Date()), 60000);
    })();
  </script>
</body>
</html>
