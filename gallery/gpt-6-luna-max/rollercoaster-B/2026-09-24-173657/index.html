<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d1b">
<title>Moonwake — A Continuous Coaster Ride</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #eef3fb;
    --muted: rgba(219, 229, 245, .62);
    --cyan: #82e7f5;
    --amber: #ffc98a;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #090d1b;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #ride { position: fixed; inset: 0; }
  #ride canvas { display: block; width: 100%; height: 100%; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(5, 8, 19, .58) 0%, transparent 23%, transparent 69%, rgba(5, 8, 19, .57) 100%),
      radial-gradient(ellipse at 50% 48%, transparent 45%, rgba(4, 7, 16, .36) 100%);
  }
  .grain {
    position: fixed; inset: -50%; z-index: 2; pointer-events: none; opacity: .09;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.36'/%3E%3C/svg%3E");
    transform: rotate(7deg);
  }
  .ui { position: fixed; z-index: 3; pointer-events: none; }
  .masthead {
    top: max(30px, env(safe-area-inset-top)); left: max(34px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 14px;
  }
  .mark {
    width: 35px; height: 35px; display: grid; place-items: center; position: relative;
    border: 1px solid rgba(181, 225, 246, .58); border-radius: 50%;
    color: var(--cyan); font-size: 15px; line-height: 1; text-shadow: 0 0 12px rgba(104, 226, 249, .8);
  }
  .mark::before, .mark::after {
    content: ""; position: absolute; background: rgba(130, 231, 245, .75);
  }
  .mark::before { width: 1px; height: 45px; }
  .mark::after { width: 45px; height: 1px; }
  .brand { font-size: 10px; letter-spacing: .23em; font-weight: 650; text-transform: uppercase; }
  .route { margin-top: 5px; color: var(--muted); font-size: 9px; letter-spacing: .17em; text-transform: uppercase; }
  .live {
    top: max(34px, env(safe-area-inset-top)); right: max(38px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border: 1px solid rgba(220, 232, 248, .17); border-radius: 999px;
    background: rgba(9, 16, 31, .33); backdrop-filter: blur(10px);
    color: rgba(235, 241, 250, .78); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  }
  .live i {
    width: 6px; height: 6px; border-radius: 50%; background: #a0f5db;
    box-shadow: 0 0 11px #7affdc; animation: beacon 2.4s ease-in-out infinite;
  }
  @keyframes beacon { 50% { opacity: .35; box-shadow: 0 0 3px #7affdc; } }
  .center-mark {
    left: 50%; top: 49%; width: 5px; height: 5px; border: 1px solid rgba(240, 247, 255, .38);
    border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 14px rgba(157, 235, 250, .48);
  }
  .caption {
    left: max(38px, env(safe-area-inset-left)); bottom: max(38px, env(safe-area-inset-bottom));
    display: flex; align-items: end; gap: 18px;
  }
  .caption-rule { width: 27px; height: 1px; margin-bottom: 5px; background: var(--amber); box-shadow: 0 0 10px rgba(255, 201, 138, .7); }
  .caption-text { color: rgba(242, 244, 250, .84); font-family: Georgia, "Times New Roman", serif; font-size: clamp(14px, 1.5vw, 18px); font-style: italic; letter-spacing: .015em; }
  .telemetry {
    right: max(38px, env(safe-area-inset-right)); bottom: max(39px, env(safe-area-inset-bottom));
    color: rgba(225, 235, 248, .62); font-size: 9px; letter-spacing: .18em; text-align: right; text-transform: uppercase;
  }
  .telemetry strong { display: block; margin-bottom: 7px; color: rgba(235, 243, 250, .9); font-size: 10px; font-weight: 550; }
  .progress {
    position: fixed; z-index: 4; right: 0; bottom: 0; left: 0; height: 2px;
    background: rgba(216, 232, 248, .13);
  }
  .progress span {
    display: block; width: 0%; height: 100%;
    background: linear-gradient(90deg, #75e6ee, #f8c58b 58%, #fa9eaf);
    box-shadow: 0 0 12px rgba(117, 230, 238, .72); will-change: width;
  }
  .loading, .failure {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: radial-gradient(ellipse at 50% 70%, #19263c 0%, #0b1020 55%, #080b16 100%);
    transition: opacity .9s ease, visibility .9s ease;
  }
  .loading.hide { opacity: 0; visibility: hidden; }
  .loading-copy { text-align: center; }
  .loading-copy b { display: block; font-size: 10px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
  .loading-copy span { display: block; margin-top: 12px; color: var(--muted); font-family: Georgia, serif; font-size: 14px; font-style: italic; }
  .loading-line { width: 90px; height: 1px; margin: 24px auto 0; background: linear-gradient(90deg, transparent, var(--cyan), transparent); animation: breathe 1.5s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .22; transform: scaleX(.58); } }
  .failure { display: none; padding: 30px; text-align: center; }
  .failure b { display: block; margin-bottom: 10px; font-family: Georgia, serif; font-size: 22px; font-weight: 400; }
  .failure span { color: var(--muted); font-size: 13px; }
  @media (max-width: 650px) {
    .masthead { left: 21px; top: 23px; }
    .mark { width: 30px; height: 30px; }
    .live { right: 20px; top: 26px; padding: 8px 10px; font-size: 8px; }
    .caption { left: 23px; bottom: 27px; gap: 11px; }
    .caption-rule { width: 17px; }
    .telemetry { right: 23px; bottom: 28px; font-size: 8px; }
    .telemetry strong { font-size: 9px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <main id="ride" aria-label="A first-person continuous rollercoaster journey"></main>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="ui masthead" aria-hidden="true">
    <div class="mark">✳</div>
    <div><div class="brand">Moonwake</div><div class="route">Arc 01 &nbsp;·&nbsp; Night service</div></div>
  </div>
  <div class="ui live" aria-hidden="true"><i></i> Ride in progress</div>
  <div class="ui center-mark" aria-hidden="true"></div>
  <div class="ui caption" aria-hidden="true">
    <span class="caption-rule"></span><span class="caption-text">The moon is your north.</span>
  </div>
  <div class="ui telemetry" aria-hidden="true"><strong>Continuous playback</strong><span>One more lap, always</span></div>
  <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
  <div class="loading" id="loading"><div class="loading-copy"><b>Moonwake</b><span>Waking the night line</span><div class="loading-line"></div></div></div>
  <div class="failure" id="failure"><div><b>The night line is out of view.</b><span>This experience needs a browser with WebGL and access to Three.js.</span></div></div>

<script type="module">
const mount = document.getElementById("ride");
const loading = document.getElementById("loading");
const failure = document.getElementById("failure");
const progressFill = document.getElementById("progressFill");

try {
  const THREE = await import("three");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#111a30");
  scene.fog = new THREE.FogExp2("#111a30", 0.0036);
  const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 700);
  scene.add(camera);

  scene.add(new THREE.HemisphereLight("#b5d9ed", "#171727", 1.12));
  const keyLight = new THREE.DirectionalLight("#ffd5ae", 2.0);
  keyLight.position.set(-45, 92, 28);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.left = -100;
  keyLight.shadow.camera.right = 100;
  keyLight.shadow.camera.top = 100;
  keyLight.shadow.camera.bottom = -100;
  scene.add(keyLight);
  const fillLight = new THREE.PointLight("#55bfe5", 190, 240, 2);
  fillLight.position.set(5, 34, -8);
  scene.add(fillLight);
  const warmLight = new THREE.PointLight("#ff9c86", 130, 180, 2);
  warmLight.position.set(-42, 18, -55);
  scene.add(warmLight);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(620, 620),
    new THREE.MeshStandardMaterial({ color: "#111820", roughness: 1, metalness: 0.02 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -12.8;
  ground.receiveShadow = true;
  scene.add(ground);

  let seed = 17123;
  const random = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Faceted ridges hold the horizon around the track.
  const peakGeometry = new THREE.ConeGeometry(1, 1, 6, 1);
  const peakMaterial = new THREE.MeshStandardMaterial({ color: "#243143", roughness: 0.94, flatShading: true });
  const peaks = new THREE.InstancedMesh(peakGeometry, peakMaterial, 74);
  const dummy = new THREE.Object3D();
  const peakColors = ["#263849", "#293447", "#302f43", "#203746", "#303446"];
  for (let i = 0; i < 74; i++) {
    const angle = random() * Math.PI * 2;
    const radius = 105 + random() * 105;
    const height = 24 + random() * 56;
    const width = 12 + random() * 24;
    dummy.position.set(Math.cos(angle) * radius, -12.8 + height * 0.48, Math.sin(angle) * radius);
    dummy.scale.set(width, height, width * (0.72 + random() * 0.48));
    dummy.rotation.y = random() * Math.PI;
    dummy.updateMatrix();
    peaks.setMatrixAt(i, dummy.matrix);
    peaks.setColorAt(i, new THREE.Color(peakColors[Math.floor(random() * peakColors.length)]));
  }
  peaks.receiveShadow = true;
  scene.add(peaks);

  // Distant, low silhouettes give the valley a little depth and scale.
  const towerGeometry = new THREE.BoxGeometry(1, 1, 1);
  const towerMaterial = new THREE.MeshStandardMaterial({ color: "#263346", roughness: 0.72, metalness: 0.12, flatShading: true });
  const towers = new THREE.InstancedMesh(towerGeometry, towerMaterial, 56);
  for (let i = 0; i < 56; i++) {
    const angle = random() * Math.PI * 2;
    const radius = 67 + random() * 56;
    const height = 5 + random() * 25;
    dummy.position.set(Math.cos(angle) * radius, -12.8 + height / 2, Math.sin(angle) * radius);
    dummy.scale.set(1.8 + random() * 4.4, height, 1.8 + random() * 4.4);
    dummy.rotation.y = random() * Math.PI;
    dummy.updateMatrix();
    towers.setMatrixAt(i, dummy.matrix);
    towers.setColorAt(i, new THREE.Color(random() > 0.48 ? "#29384a" : "#342f45"));
  }
  towers.receiveShadow = true;
  scene.add(towers);

  // A quiet field of stars and drifting embers carries the eye beyond the rails.
  const starPositions = new Float32Array(1750 * 3);
  const starColors = new Float32Array(1750 * 3);
  for (let i = 0; i < 1750; i++) {
    const i3 = i * 3;
    starPositions[i3] = (random() - 0.5) * 430;
    starPositions[i3 + 1] = 48 + random() * 205;
    starPositions[i3 + 2] = (random() - 0.5) * 430;
    const tint = random();
    starColors[i3] = 0.63 + tint * 0.32;
    starColors[i3 + 1] = 0.72 + tint * 0.24;
    starColors[i3 + 2] = 0.82 + tint * 0.18;
  }
  const starGeometry = new THREE.BufferGeometry();
  starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
  starGeometry.setAttribute("color", new THREE.BufferAttribute(starColors, 3));
  const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({
    size: 0.72, vertexColors: true, transparent: true, opacity: 0.78, sizeAttenuation: true,
    depthWrite: false
  }));
  scene.add(stars);

  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(19, 48, 40),
    new THREE.MeshStandardMaterial({ color: "#e5cdb0", emissive: "#65513e", emissiveIntensity: 0.44, roughness: 0.76, metalness: 0.02 })
  );
  moon.position.set(-32, 78, -142);
  scene.add(moon);
  const moonRing = new THREE.Mesh(
    new THREE.TorusGeometry(26, 0.16, 8, 100),
    new THREE.MeshBasicMaterial({ color: "#f4cda1", transparent: true, opacity: 0.72 })
  );
  moonRing.position.copy(moon.position);
  moonRing.rotation.set(1.18, 0.18, 0.32);
  moonRing.scale.set(1, 0.38, 1);
  scene.add(moonRing);
  const moonGlow = new THREE.PointLight("#f2ba89", 360, 250, 2);
  moonGlow.position.copy(moon.position);
  scene.add(moonGlow);

  const routePoints = [
    new THREE.Vector3(0, 4, 43),
    new THREE.Vector3(-20, 4, 36),
    new THREE.Vector3(-34, 8, 19),
    new THREE.Vector3(-36, 16, -4),
    new THREE.Vector3(-20, 29, -25),
    new THREE.Vector3(2, 32, -31),
    new THREE.Vector3(22, 21, -20),
    new THREE.Vector3(36, 7, -2),
    new THREE.Vector3(33, 4, 18),
    new THREE.Vector3(18, 8, 31),
    new THREE.Vector3(1, 19, 24),
    new THREE.Vector3(-13, 6, 12),
    new THREE.Vector3(-29, 4, -7),
    new THREE.Vector3(-25, 8, -30),
    new THREE.Vector3(-6, 13, -46),
    new THREE.Vector3(18, 6, -43),
    new THREE.Vector3(38, 4, -25),
    new THREE.Vector3(45, 7, -1),
    new THREE.Vector3(34, 5, 23),
    new THREE.Vector3(15, 4, 45)
  ];
  const track = new THREE.CatmullRomCurve3(routePoints, true, "catmullrom", 0.28);
  const worldUp = new THREE.Vector3(0, 1, 0);

  function frameAt(u) {
    const p = (u + 1) % 1;
    const tangent = track.getTangentAt(p).normalize();
    const side = tangent.clone().cross(worldUp).normalize();
    const normal = side.clone().cross(tangent).normalize();
    const before = track.getTangentAt((p - 0.003 + 1) % 1);
    const after = track.getTangentAt((p + 0.003) % 1);
    const yaw = before.clone().cross(after).y;
    const bank = clamp(yaw * 5.1, -0.22, 0.22);
    side.applyAxisAngle(tangent, bank);
    normal.applyAxisAngle(tangent, bank);
    return { center: track.getPointAt(p), tangent, side, normal };
  }

  function offsetCurve(offset) {
    const points = [];
    const segments = 300;
    for (let i = 0; i < segments; i++) {
      const f = frameAt(i / segments);
      points.push(f.center.clone().addScaledVector(f.side, offset).addScaledVector(f.normal, 0.15));
    }
    return new THREE.CatmullRomCurve3(points, true, "catmullrom", 0.18);
  }

  const railCurves = [offsetCurve(-1.28), offsetCurve(1.28)];
  const railSteel = new THREE.MeshStandardMaterial({ color: "#a9bdcf", roughness: 0.23, metalness: 0.78 });
  const railCoreMaterials = [
    new THREE.MeshStandardMaterial({ color: "#67e2f1", emissive: "#37cde6", emissiveIntensity: 2.2, roughness: 0.24, metalness: 0.12 }),
    new THREE.MeshStandardMaterial({ color: "#f6a9ad", emissive: "#ed6f8f", emissiveIntensity: 1.9, roughness: 0.25, metalness: 0.1 })
  ];
  const auraMaterials = [
    new THREE.MeshBasicMaterial({ color: "#53d8f3", transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false }),
    new THREE.MeshBasicMaterial({ color: "#fa7d9b", transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending, depthWrite: false })
  ];
  for (let i = 0; i < railCurves.length; i++) {
    const curve = railCurves[i];
    const steel = new THREE.Mesh(new THREE.TubeGeometry(curve, 640, 0.13, 10, true), railSteel);
    steel.castShadow = true;
    steel.receiveShadow = true;
    scene.add(steel);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 640, 0.19, 8, true), auraMaterials[i]));
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 640, 0.052, 8, true), railCoreMaterials[i]));
  }

  // Closely spaced sleepers make the track read as a physical ride, not just light.
  const sleeperCount = 180;
  const sleeperMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(2.96, 0.19, 0.58),
    new THREE.MeshStandardMaterial({ color: "#554b4d", roughness: 0.79, metalness: 0.28 }),
    sleeperCount
  );
  const basis = new THREE.Matrix4();
  const orientation = new THREE.Quaternion();
  const unitScale = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < sleeperCount; i++) {
    const f = frameAt(i / sleeperCount);
    basis.makeBasis(f.side, f.normal, f.tangent);
    orientation.setFromRotationMatrix(basis);
    const center = f.center.clone().addScaledVector(f.normal, 0.02);
    dummy.position.copy(center);
    dummy.quaternion.copy(orientation);
    dummy.scale.copy(unitScale);
    dummy.updateMatrix();
    sleeperMesh.setMatrixAt(i, dummy.matrix);
    if (i % 3 === 0) sleeperMesh.setColorAt(i, new THREE.Color("#645452"));
  }
  sleeperMesh.castShadow = true;
  sleeperMesh.receiveShadow = true;
  scene.add(sleeperMesh);

  // Deep-set pylons, spaced under the high sections of the route.
  const supportCount = 40;
  const supportMesh = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.16, 0.27, 1, 7, 1),
    new THREE.MeshStandardMaterial({ color: "#596577", roughness: 0.42, metalness: 0.68 }),
    supportCount
  );
  for (let i = 0; i < supportCount / 2; i++) {
    const f = frameAt((i * 2) / supportCount);
    for (let sideIndex = 0; sideIndex < 2; sideIndex++) {
      const sideSign = sideIndex === 0 ? -1 : 1;
      const railPoint = f.center.clone().addScaledVector(f.side, sideSign * 1.28).addScaledVector(f.normal, 0.15);
      const height = Math.max(3.2, railPoint.y + 12.8);
      dummy.position.set(railPoint.x, -12.8 + height / 2, railPoint.z);
      dummy.scale.set(1, height, 1);
      dummy.quaternion.identity();
      dummy.updateMatrix();
      supportMesh.setMatrixAt(i * 2 + sideIndex, dummy.matrix);
    }
  }
  supportMesh.castShadow = true;
  supportMesh.receiveShadow = true;
  scene.add(supportMesh);

  // Repeating light gates mark the route as it folds through the valley.
  const gateGeometry = new THREE.TorusGeometry(3.65, 0.12, 9, 56);
  const gateMaterials = [
    new THREE.MeshStandardMaterial({ color: "#b4f7ff", emissive: "#48d9ef", emissiveIntensity: 2.1, metalness: 0.18, roughness: 0.22 }),
    new THREE.MeshStandardMaterial({ color: "#ffcfb5", emissive: "#fd927d", emissiveIntensity: 1.7, metalness: 0.12, roughness: 0.25 }),
    new THREE.MeshStandardMaterial({ color: "#e1c7ff", emissive: "#a586ee", emissiveIntensity: 1.8, metalness: 0.14, roughness: 0.24 })
  ];
  const gates = [];
  for (let i = 0; i < 24; i++) {
    const u = i / 24;
    const f = frameAt(u);
    const hoop = new THREE.Mesh(gateGeometry, gateMaterials[i % gateMaterials.length].clone());
    const gateBasis = new THREE.Matrix4().makeBasis(f.side, f.normal, f.tangent);
    hoop.quaternion.setFromRotationMatrix(gateBasis);
    hoop.position.copy(f.center).addScaledVector(f.normal, 4.3);
    hoop.castShadow = true;
    scene.add(hoop);
    gates.push(hoop);
  }

  // A dark, low nose and two restraint bars give the camera a clear first-person seat.
  const cockpit = new THREE.Group();
  camera.add(cockpit);
  cockpit.position.set(0, -0.86, -2.15);
  const bodyMaterial = new THREE.MeshStandardMaterial({ color: "#1c2936", metalness: 0.76, roughness: 0.26 });
  const noseMaterial = new THREE.MeshStandardMaterial({ color: "#263e4c", metalness: 0.72, roughness: 0.22, emissive: "#071c25", emissiveIntensity: 0.7 });
  const cockpitBody = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.2, 1.26), bodyMaterial);
  cockpitBody.position.set(0, -0.27, -0.25);
  cockpit.add(cockpitBody);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.78, 0.95, 4), noseMaterial);
  nose.rotation.x = -Math.PI / 2;
  nose.rotation.y = Math.PI / 4;
  nose.scale.set(1, 0.78, 0.76);
  nose.position.set(0, -0.22, -0.91);
  cockpit.add(nose);
  const noseStripe = new THREE.Mesh(
    new THREE.BoxGeometry(0.07, 0.018, 0.93),
    new THREE.MeshBasicMaterial({ color: "#86eff5" })
  );
  noseStripe.position.set(0, -0.116, -0.35);
  cockpit.add(noseStripe);
  const restraintMaterial = new THREE.MeshStandardMaterial({ color: "#97aabc", metalness: 0.84, roughness: 0.2 });
  for (const sign of [-1, 1]) {
    const points = [
      new THREE.Vector3(sign * 0.68, -0.12, 0.12),
      new THREE.Vector3(sign * 0.76, 0.1, -0.08),
      new THREE.Vector3(sign * 0.59, 0.19, -0.44),
      new THREE.Vector3(sign * 0.25, 0.18, -0.68)
    ];
    cockpit.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 18, 0.035, 7, false), restraintMaterial));
  }

  const dustCount = 310;
  const dustPositions = new Float32Array(dustCount * 3);
  const dustSeeds = [];
  for (let i = 0; i < dustCount; i++) {
    const x = (random() - 0.5) * 120;
    const y = -1 + random() * 62;
    const z = (random() - 0.5) * 120;
    dustSeeds.push([x, y, z, random() * Math.PI * 2]);
    dustPositions[i * 3] = x;
    dustPositions[i * 3 + 1] = y;
    dustPositions[i * 3 + 2] = z;
  }
  const dustGeometry = new THREE.BufferGeometry();
  dustGeometry.setAttribute("position", new THREE.BufferAttribute(dustPositions, 3).setUsage(THREE.DynamicDrawUsage));
  const dust = new THREE.Points(dustGeometry, new THREE.PointsMaterial({
    color: "#a6e9ed", size: 0.2, transparent: true, opacity: 0.5, sizeAttenuation: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(dust);

  let rideProgress = 0;
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const pre = frameAt(rideProgress);
    const speed = clamp(1.0 - pre.tangent.y * 0.3 + 0.055 * Math.sin(clock.elapsedTime * 0.42), 0.72, 1.34);
    rideProgress = (rideProgress + dt * speed / 51) % 1;
    const f = frameAt(rideProgress);
    const sway = Math.sin(clock.elapsedTime * 1.65) * 0.025;
    camera.position.copy(f.center)
      .addScaledVector(f.normal, 1.56 + Math.sin(clock.elapsedTime * 0.86) * 0.035)
      .addScaledVector(f.side, sway);
    const cameraBasis = new THREE.Matrix4().makeBasis(f.side, f.normal, f.tangent.clone().negate());
    camera.quaternion.setFromRotationMatrix(cameraBasis);
    camera.rotateZ(Math.sin(clock.elapsedTime * 0.72) * 0.008);
    camera.updateMatrixWorld();

    stars.rotation.y = Math.sin(clock.elapsedTime * 0.012) * 0.035;
    for (let i = 0; i < dustCount; i++) {
      const [x, y, z, phase] = dustSeeds[i];
      const i3 = i * 3;
      dustPositions[i3] = x + Math.sin(clock.elapsedTime * 0.31 + phase) * 0.42;
      dustPositions[i3 + 1] = y + Math.cos(clock.elapsedTime * 0.47 + phase) * 0.3;
      dustPositions[i3 + 2] = z + Math.sin(clock.elapsedTime * 0.22 + phase) * 0.42;
    }
    dustGeometry.attributes.position.needsUpdate = true;
    for (let i = 0; i < gates.length; i++) {
      gates[i].material.emissiveIntensity = 1.65 + 0.38 * Math.sin(clock.elapsedTime * 1.25 + i * 0.66);
    }
    fillLight.intensity = 175 + 22 * Math.sin(clock.elapsedTime * 0.52);
    progressFill.style.width = (rideProgress * 100).toFixed(2) + "%";
    renderer.render(scene, camera);
  }

  function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  }
  window.addEventListener("resize", resize, { passive: true });
  loading.classList.add("hide");
  animate();
} catch (error) {
  console.error("Moonwake could not start:", error);
  loading.style.display = "none";
  failure.style.display = "grid";
}
</script>
</body>
