<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071319">
<title>Nightfall Express — POV</title>
<style>
  :root { color-scheme: dark; --ink: #f2f1e9; --muted: #a5b4b1; --mint: #a8f0d5; --amber: #ffc078; --glass: rgba(8, 20, 24, .55); }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071319; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { color: var(--ink); }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, transparent 37%, rgba(3, 11, 15, .18) 72%, rgba(3, 10, 13, .7) 130%), linear-gradient(180deg, rgba(2, 11, 16, .26), transparent 28%, transparent 74%, rgba(2, 10, 13, .32)); }
  .grain { position: fixed; inset: 0; opacity: .09; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }
  .hud { position: fixed; inset: 0; pointer-events: none; padding: clamp(18px, 3.4vw, 46px); display: flex; flex-direction: column; justify-content: space-between; }
  .topline, .bottomline { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .sigil { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(168,240,213,.62); border-radius: 50%; color: var(--mint); font-size: 14px; letter-spacing: -.08em; box-shadow: 0 0 24px rgba(115, 224, 190, .11), inset 0 0 14px rgba(115, 224, 190, .08); }
  .brandname { font-size: 10px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: rgba(242,241,233,.92); }
  .brandmeta { margin-top: 5px; font-size: 9px; letter-spacing: .14em; color: rgba(208,222,216,.58); text-transform: uppercase; }
  .runstate { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid rgba(228,239,231,.15); border-radius: 99px; background: rgba(7,17,20,.28); backdrop-filter: blur(12px); color: rgba(235,242,234,.82); font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 11px var(--mint); animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .38; transform: scale(.72); } }
  .centerreadout { position: absolute; left: 50%; top: clamp(22px, 4.4vw, 60px); transform: translateX(-50%); text-align: center; color: rgba(238,244,235,.72); text-transform: uppercase; font-size: 9px; letter-spacing: .2em; white-space: nowrap; }
  .centerreadout strong { display: block; margin-top: 6px; color: var(--amber); font-size: 11px; letter-spacing: .24em; font-weight: 600; }
  .corner-readout { min-width: 145px; text-align: right; }
  .tiny-label { font-size: 9px; letter-spacing: .18em; color: rgba(221,231,224,.56); text-transform: uppercase; }
  .metric { margin-top: 4px; font-size: 24px; line-height: 1; font-weight: 300; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .metric small { margin-left: 4px; color: rgba(221,231,224,.65); font-size: 9px; font-weight: 600; letter-spacing: .13em; }
  .bottomline { align-items: flex-end; }
  .stats { display: flex; gap: clamp(18px, 4vw, 48px); }
  .stat { min-width: 72px; }
  .stat .value { margin-top: 6px; color: rgba(245,244,234,.92); font-size: 13px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
  button { color: var(--ink); font: inherit; }
  .control-btn { height: 38px; min-width: 38px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(221,236,225,.22); border-radius: 22px; background: var(--glass); backdrop-filter: blur(14px); color: rgba(242,241,233,.9); cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
  .control-btn:hover { border-color: rgba(168,240,213,.7); background: rgba(12,31,32,.74); transform: translateY(-1px); }
  .control-btn:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
  .control-btn svg { width: 13px; height: 13px; fill: currentColor; }
  .control-btn span { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .speed-control { margin-left: 6px; color: rgba(221,231,224,.66); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .speed-control button { width: 26px; height: 26px; margin-left: 5px; border: 1px solid rgba(221,236,225,.19); border-radius: 50%; background: rgba(8,20,24,.4); color: var(--ink); cursor: pointer; }
  .speed-control button:hover { border-color: var(--mint); color: var(--mint); }
  .progress { position: fixed; bottom: 0; left: 0; height: 2px; width: 100%; background: rgba(225,245,235,.1); }
  .progress span { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #86debf, #ffc078); box-shadow: 0 0 12px rgba(168,240,213,.7); }
  .reticle { position: fixed; left: 50%; top: 54%; width: 26px; height: 26px; transform: translate(-50%,-50%); opacity: .52; pointer-events: none; }
  .reticle:before, .reticle:after { content: ""; position: absolute; background: rgba(238,245,228,.72); }
  .reticle:before { top: 12px; left: 0; width: 26px; height: 1px; }
  .reticle:after { top: 0; left: 12px; width: 1px; height: 26px; }
  .reticle i { position: absolute; inset: 8px; border: 1px solid rgba(238,245,228,.78); border-radius: 50%; }
  .hint { position: fixed; right: clamp(18px,3.4vw,46px); bottom: clamp(72px,10vh,100px); color: rgba(221,231,224,.54); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; }
  .hint kbd { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px; margin-left: 3px; border: 1px solid rgba(221,236,225,.2); border-radius: 4px; color: rgba(242,241,233,.75); font: inherit; }
  @media (max-width: 600px) {
    .hud { padding: 18px; }
    .sigil { width: 32px; height: 32px; }
    .brandname { font-size: 9px; }
    .centerreadout { top: 65px; font-size: 8px; }
    .centerreadout strong { font-size: 9px; }
    .corner-readout { min-width: auto; }
    .metric { font-size: 20px; }
    .stats { gap: 15px; }
    .stat { min-width: 55px; }
    .stat .value { font-size: 11px; }
    .controls { gap: 5px; }
    .control-btn { height: 34px; min-width: 34px; padding: 0 9px; }
    .speed-control { display: none; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="view" aria-label="First-person rollercoaster ride"></div>
<div class="vignette"></div><div class="grain"></div>
<div class="reticle" aria-hidden="true"><i></i></div>
<div class="hud">
  <div class="topline">
    <div class="brand"><div class="sigil">N<span style="font-size:8px">/</span>E</div><div><div class="brandname">Nightfall Express</div><div class="brandmeta">Alpine observatory · 01</div></div></div>
    <div class="centerreadout">Elevation<strong id="elevation">— M</strong></div>
    <div class="runstate"><i class="dot" id="statusDot"></i><span id="runLabel">Live ride</span></div>
  </div>
  <div class="corner-readout" style="position:absolute;right:clamp(18px,3.4vw,46px);top:clamp(72px,10vw,112px)"><div class="tiny-label">Velocity</div><div class="metric"><span id="speed">—</span><small>KM/H</small></div></div>
  <div class="bottomline">
    <div class="stats">
      <div class="stat"><div class="tiny-label">Lap</div><div class="value" id="lap">01 / ∞</div></div>
      <div class="stat"><div class="tiny-label">Distance</div><div class="value" id="distance">000 M</div></div>
      <div class="stat"><div class="tiny-label">Track</div><div class="value">NIGHT / 01</div></div>
    </div>
    <div class="controls">
      <button class="control-btn" id="pause" type="button" aria-label="Pause ride" title="Pause / resume (Space)"><svg id="pauseIcon" viewBox="0 0 16 16"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><span id="pauseText">Pause</span></button>
      <div class="speed-control">Pace <button id="slower" type="button" aria-label="Slow down">−</button><button id="faster" type="button" aria-label="Speed up">+</button></div>
    </div>
  </div>
</div>
<div class="hint">Ride control <kbd>SPACE</kbd> &nbsp; Pace <kbd>−</kbd><kbd>+</kbd></div>
<div class="progress"><span id="progress"></span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const mount = document.querySelector('#view');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x10242a, 0.0022);
const camera = new THREE.PerspectiveCamera(77, innerWidth / innerHeight, 0.08, 500);
camera.position.set(0, 5, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
mount.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0x91c7d1, 0x101a20, 1.0);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0xc4e5df, 2.1);
moon.position.set(-34, 62, -42);
scene.add(moon);
const warmRim = new THREE.DirectionalLight(0xffa866, 1.05);
warmRim.position.set(52, 20, 22);
scene.add(warmRim);

// Gradient twilight dome and a sparse, fixed starfield.
const sky = new THREE.Mesh(new THREE.SphereGeometry(260, 32, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { top: { value: new THREE.Color('#102b42') }, middle: { value: new THREE.Color('#34505a') }, horizon: { value: new THREE.Color('#cf7955') } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 middle; uniform vec3 horizon; varying vec3 vDir; void main(){ float h=normalize(vDir).y; vec3 c=mix(horizon,middle,smoothstep(-0.14,0.18,h)); c=mix(c,top,smoothstep(0.06,0.72,h)); gl_FragColor=vec4(c,1.0); }'
}));
scene.add(sky);
let seed = 81231;
function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const starPositions = [];
for (let i = 0; i < 620; i++) {
  const a = random() * Math.PI * 2, y = .19 + random() * .8, r = 215 + random() * 24;
  const h = Math.sqrt(1 - y * y);
  starPositions.push(Math.cos(a) * h * r, y * r, Math.sin(a) * h * r);
}
const starsGeo = new THREE.BufferGeometry();
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xd7eee0, size: .8, sizeAttenuation: false, transparent: true, opacity: .68 }));
scene.add(stars);
const sun = new THREE.Mesh(new THREE.SphereGeometry(8, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffbc83 }));
sun.position.set(95, 44, -178);
scene.add(sun);

const groundY = -3.2;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x142126, roughness: 1, metalness: 0 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
scene.add(ground);

// Distant low-poly ridges give the valley a strong horizon line.
for (let i = 0; i < 46; i++) {
  const angle = i / 46 * Math.PI * 2 + random() * .08;
  const radius = 105 + random() * 50;
  const height = 25 + random() * 58;
  const width = 12 + random() * 25;
  const peak = new THREE.Mesh(new THREE.ConeGeometry(width, height, 5, 1), new THREE.MeshStandardMaterial({ color: i % 3 === 0 ? 0x203842 : 0x172c36, roughness: 1, flatShading: true }));
  peak.position.set(Math.cos(angle) * radius, groundY + height * .48, Math.sin(angle) * radius);
  peak.rotation.y = random() * Math.PI;
  scene.add(peak);
}

// One closed route: its spline is both the physical track and the camera path.
const routePoints = [
  [0, 4.5, 34], [0, 5, 17], [-5, 9, 3], [-16, 22, -7], [-25, 34, -21], [-21, 19, -34], [-8, 7, -41], [9, 5, -38], [22, 11, -28], [28, 24, -13], [22, 37, 1], [7, 30, 10], [1, 14, 16], [4, 6, 27], [17, 4.5, 36], [26, 13, 48], [18, 23, 59], [1, 15, 61], [-15, 8, 53], [-23, 14, 42], [-16, 23, 34], [-6, 12, 32]
].map(p => new THREE.Vector3(...p));
const track = new THREE.CatmullRomCurve3(routePoints, true, 'catmullrom', .46);
const trackLength = track.getLength();

function frameAt(u) {
  const p = track.getPointAt((u % 1 + 1) % 1);
  const tangent = track.getTangentAt((u % 1 + 1) % 1).normalize();
  let side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0));
  if (side.lengthSq() < .001) side.set(1, 0, 0);
  side.normalize();
  let up = new THREE.Vector3().crossVectors(side, tangent).normalize();
  const bank = Math.sin(u * Math.PI * 4 + .45) * .20 + Math.sin(u * Math.PI * 2 - .6) * .09;
  const bankedSide = side.clone().multiplyScalar(Math.cos(bank)).addScaledVector(up, Math.sin(bank));
  const bankedUp = up.clone().multiplyScalar(Math.cos(bank)).addScaledVector(side, -Math.sin(bank));
  return { p, tangent, side: bankedSide, up: bankedUp };
}

function railGeometry(sign, radius = .105, offset = .83) {
  const longitudinal = 1150, radial = 9;
  const positions = [], indices = [];
  for (let i = 0; i <= longitudinal; i++) {
    const f = i / longitudinal, frame = frameAt(f);
    const center = frame.p.clone().addScaledVector(frame.side, sign * offset).addScaledVector(frame.up, .14);
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2;
      const v = frame.side.clone().multiplyScalar(Math.cos(a)).addScaledVector(frame.up, Math.sin(a)).multiplyScalar(radius).add(center);
      positions.push(v.x, v.y, v.z);
      if (i < longitudinal) {
        const n = i * radial + j, next = i * radial + (j + 1) % radial;
        indices.push(n, next, n + radial, next, next + radial, n + radial);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}
const railMat = new THREE.MeshStandardMaterial({ color: 0xa3d9cd, metalness: .78, roughness: .23, emissive: 0x173c36, emissiveIntensity: .5 });
const railGlow = new THREE.MeshStandardMaterial({ color: 0xffbd78, metalness: .3, roughness: .28, emissive: 0xa24a20, emissiveIntensity: 1.4 });
for (const sign of [-1, 1]) {
  const rail = new THREE.Mesh(railGeometry(sign), railMat);
  rail.castShadow = false;
  scene.add(rail);
  // A fine amber line rides the outside edge of each steel rail.
  scene.add(new THREE.Mesh(railGeometry(sign, .022, .86), railGlow));
}

// Closely spaced sleepers and slender supports make the structure read as a real ride.
const sleeperStep = .72;
const sleeperCount = Math.floor(trackLength / sleeperStep);
const sleeperGeo = new THREE.BoxGeometry(1.95, .09, .19);
const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x394b4b, metalness: .58, roughness: .38 });
const sleepers = new THREE.InstancedMesh(sleeperGeo, sleeperMat, sleeperCount);
sleepers.instanceMatrix.setUsage(THREE.StaticDrawUsage);
const tempObj = new THREE.Object3D();
for (let i = 0; i < sleeperCount; i++) {
  const f = i / sleeperCount, fr = frameAt(f);
  tempObj.position.copy(fr.p).addScaledVector(fr.up, -.02);
  tempObj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fr.side, fr.up, fr.tangent));
  tempObj.updateMatrix(); sleepers.setMatrixAt(i, tempObj.matrix);
}
sleepers.computeBoundingSphere();
scene.add(sleepers);
const postGeo = new THREE.BoxGeometry(.14, 1, .14);
const postMat = new THREE.MeshStandardMaterial({ color: 0x526363, metalness: .62, roughness: .35 });
const postCount = Math.floor(trackLength / 5.8) * 2;
const posts = new THREE.InstancedMesh(postGeo, postMat, postCount);
let postI = 0;
for (let d = 0; d < trackLength; d += 5.8) {
  const fr = frameAt(d / trackLength);
  for (const sign of [-1, 1]) {
    const top = fr.p.clone().addScaledVector(fr.side, sign * .83).addScaledVector(fr.up, .1);
    const h = Math.max(1, top.y - groundY);
    tempObj.position.set(top.x, groundY + h / 2, top.z);
    tempObj.quaternion.identity(); tempObj.scale.set(1, h, 1); tempObj.updateMatrix();
    posts.setMatrixAt(postI++, tempObj.matrix);
  }
}
posts.computeBoundingSphere();
scene.add(posts);

// Instanced alpine forest, kept clear of the track corridor.
const trunkGeo = new THREE.CylinderGeometry(.18, .29, 1, 6);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x46392f, roughness: 1 });
const pineGeo = new THREE.ConeGeometry(1, 1, 6, 1);
const pineMatA = new THREE.MeshStandardMaterial({ color: 0x183b39, roughness: 1, flatShading: true });
const pineMatB = new THREE.MeshStandardMaterial({ color: 0x234b45, roughness: 1, flatShading: true });
const treeCount = 460;
const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
const pinesA = new THREE.InstancedMesh(pineGeo, pineMatA, treeCount);
const pinesB = new THREE.InstancedMesh(pineGeo, pineMatB, treeCount);
let treeN = 0;
function nearTrack(x, z) {
  for (let i = 0; i < 120; i++) { const p = track.getPointAt(i / 120); const dx = p.x - x, dz = p.z - z; if (dx * dx + dz * dz < 78) return true; }
  return false;
}
for (let tries = 0; tries < 2400 && treeN < treeCount; tries++) {
  const x = (random() - .5) * 190, z = (random() - .5) * 190;
  if (nearTrack(x, z)) continue;
  const h = 6 + random() * 10, r = 1.8 + random() * 2.4;
  tempObj.position.set(x, groundY + h * .27, z); tempObj.rotation.set(0, random() * Math.PI, 0); tempObj.scale.set(1, h * .55, 1); tempObj.updateMatrix(); trunks.setMatrixAt(treeN, tempObj.matrix);
  tempObj.position.set(x, groundY + h * .48, z); tempObj.rotation.set(0, random() * Math.PI, 0); tempObj.scale.set(r, h * .52, r); tempObj.updateMatrix(); pinesA.setMatrixAt(treeN, tempObj.matrix);
  tempObj.position.set(x, groundY + h * .69, z); tempObj.rotation.set(0, random() * Math.PI, 0); tempObj.scale.set(r * .72, h * .43, r * .72); tempObj.updateMatrix(); pinesB.setMatrixAt(treeN, tempObj.matrix);
  treeN++;
}
trunks.count = treeN; pinesA.count = treeN; pinesB.count = treeN;
trunks.computeBoundingSphere(); pinesA.computeBoundingSphere(); pinesB.computeBoundingSphere();
scene.add(trunks, pinesA, pinesB);

// Small route beacons skim past the rider on each lap.
const beaconGeo = new THREE.SphereGeometry(.105, 8, 6);
const beaconMat = new THREE.MeshBasicMaterial({ color: 0xffb768 });
const beaconCount = Math.floor(trackLength / 4.6);
const beacons = new THREE.InstancedMesh(beaconGeo, beaconMat, beaconCount);
for (let i = 0; i < beaconCount; i++) {
  const f = i / beaconCount, fr = frameAt(f);
  tempObj.position.copy(fr.p).addScaledVector(fr.side, .98).addScaledVector(fr.up, -.03);
  tempObj.scale.set(1, 1, 1); tempObj.updateMatrix(); beacons.setMatrixAt(i, tempObj.matrix);
}
beacons.computeBoundingSphere(); scene.add(beacons);

const speedEl = document.querySelector('#speed');
const elevationEl = document.querySelector('#elevation');
const distanceEl = document.querySelector('#distance');
const progressEl = document.querySelector('#progress');
const pauseBtn = document.querySelector('#pause');
const pauseText = document.querySelector('#pauseText');
const pauseIcon = document.querySelector('#pauseIcon');
const runLabel = document.querySelector('#runLabel');
const statusDot = document.querySelector('#statusDot');
let u = .012, elapsed = 0, distance = 0, paused = false, pace = 1;
const baseSpeed = 22.5;
function setPaused(value) {
  paused = value;
  pauseText.textContent = paused ? 'Resume' : 'Pause';
  pauseBtn.setAttribute('aria-label', paused ? 'Resume ride' : 'Pause ride');
  pauseIcon.innerHTML = paused ? '<path d="M5 3.3 13 8l-8 4.7z"/>' : '<path d="M4 3h3v10H4zm5 0h3v10H9z"/>';
  runLabel.textContent = paused ? 'Ride paused' : 'Live ride';
  statusDot.style.animationPlayState = paused ? 'paused' : 'running';
  statusDot.style.opacity = paused ? '.45' : '1';
}
pauseBtn.addEventListener('click', () => setPaused(!paused));
document.querySelector('#slower').addEventListener('click', () => { pace = Math.max(.55, pace - .15); });
document.querySelector('#faster').addEventListener('click', () => { pace = Math.min(1.8, pace + .15); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  if (e.key === '-' || e.key === '_') pace = Math.max(.55, pace - .15);
  if (e.key === '+' || e.key === '=') pace = Math.min(1.8, pace + .15);
});

let previous = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - previous) / 1000, .05); previous = now;
  if (!paused) {
    elapsed += dt;
    const speed = baseSpeed * pace;
    distance += speed * dt;
    u = (u + speed * dt / trackLength) % 1;
  }
  const fr = frameAt(u);
  const bob = paused ? 0 : Math.sin(elapsed * 7.2) * .025 + Math.sin(elapsed * 2.1) * .035;
  camera.position.copy(fr.p).addScaledVector(fr.up, 1.12 + bob).addScaledVector(fr.tangent, -.26);
  camera.up.copy(fr.up);
  camera.lookAt(camera.position.clone().addScaledVector(fr.tangent, 7));
  speedEl.textContent = String(Math.round(baseSpeed * pace * 3.6)).padStart(3, '0');
  elevationEl.textContent = `${Math.max(0, Math.round((fr.p.y - groundY) * 3.28))} FT`;
  distanceEl.textContent = `${String(Math.floor(distance)).padStart(4, '0')} M`;
  progressEl.style.width = `${u * 100}%`;
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
