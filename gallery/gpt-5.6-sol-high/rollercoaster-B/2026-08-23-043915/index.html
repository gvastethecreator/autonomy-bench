<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EMBERLINE — Alpine Coaster</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f1e7; --muted:#b9c4c9; --amber:#ffb14a; --panel:rgba(5,13,18,.58); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#07131a; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
    canvas { display:block; width:100%; height:100%; }
    #vignette { position:fixed; inset:0; pointer-events:none; z-index:2; background:radial-gradient(circle at 50% 46%,transparent 38%,rgba(2,8,12,.12) 68%,rgba(2,7,10,.58) 120%); }
    #grain { position:fixed; inset:-100%; pointer-events:none; z-index:3; opacity:.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E"); animation:grain .22s steps(2) infinite; }
    @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(3%,1%)} 50%{transform:translate(-2%,4%)} 75%{transform:translate(4%,-3%)} }
    .topbar { position:fixed; inset:0 0 auto 0; z-index:5; display:flex; align-items:flex-start; justify-content:space-between; padding:clamp(18px,3vw,34px); pointer-events:none; }
    .brand { display:flex; align-items:center; gap:13px; }
    .brandmark { width:38px; height:38px; border:1px solid rgba(255,255,255,.45); border-radius:50%; display:grid; place-items:center; box-shadow:inset 0 0 0 5px rgba(255,255,255,.04); }
    .brandmark:before { content:""; width:18px; height:7px; border-top:2px solid var(--amber); border-bottom:2px solid var(--amber); transform:skewY(-13deg); }
    .brand b { display:block; font-size:12px; letter-spacing:.28em; line-height:1; }
    .brand span { display:block; margin-top:7px; font-size:9px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; }
    .status { display:flex; align-items:center; gap:9px; padding:8px 11px; border:1px solid rgba(255,255,255,.13); border-radius:999px; color:#dce6e8; font:600 9px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.13em; background:rgba(5,13,18,.22); backdrop-filter:blur(8px); }
    .dot { width:5px; height:5px; border-radius:50%; background:#8be49b; box-shadow:0 0 10px #8be49b; animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity:.35; } }
    .telemetry { position:fixed; left:clamp(18px,3vw,34px); bottom:clamp(20px,4vw,38px); z-index:5; width:min(290px,calc(100vw - 36px)); padding:17px 18px 15px; border:1px solid rgba(255,255,255,.13); border-radius:16px; background:linear-gradient(145deg,rgba(10,22,28,.7),rgba(4,12,17,.43)); box-shadow:0 18px 60px rgba(0,0,0,.28); backdrop-filter:blur(14px); }
    .meter-head { display:flex; justify-content:space-between; align-items:baseline; }
    .eyebrow { font:600 8px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.2em; color:#95a7ad; }
    .speed { font:300 34px/.9 ui-monospace,SFMono-Regular,monospace; letter-spacing:-.08em; color:var(--ink); }
    .speed small { font-size:9px; letter-spacing:.14em; color:#95a7ad; margin-left:7px; }
    .trackline { position:relative; height:2px; margin:17px 0 13px; background:rgba(255,255,255,.12); overflow:visible; }
    .trackfill { position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg,#f17645,#ffd078); box-shadow:0 0 12px rgba(255,177,74,.55); }
    .trackpoint { position:absolute; top:50%; left:0%; width:8px; height:8px; border:2px solid #ffd078; background:#102026; border-radius:50%; transform:translate(-50%,-50%); }
    .data { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
    .datum { border-left:1px solid rgba(255,255,255,.12); padding-left:9px; }
    .datum:first-child { border:0; padding:0; }
    .datum strong { display:block; font:500 11px/1.2 ui-monospace,SFMono-Regular,monospace; color:#e8edef; }
    .datum span { display:block; margin-top:5px; font:600 7px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.17em; color:#738991; }
    .controls { position:fixed; right:clamp(18px,3vw,34px); bottom:clamp(20px,4vw,38px); z-index:5; display:flex; align-items:center; gap:8px; padding:7px; border:1px solid rgba(255,255,255,.13); border-radius:15px; background:var(--panel); backdrop-filter:blur(14px); }
    button { width:38px; height:38px; border:0; border-radius:10px; color:#eaf0ef; background:transparent; cursor:pointer; display:grid; place-items:center; transition:.2s ease; }
    button:hover { background:rgba(255,255,255,.1); color:#fff; }
    button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
    button svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .divider { width:1px; height:22px; background:rgba(255,255,255,.12); }
    .speedpick { display:flex; gap:3px; }
    .speedpick button { width:auto; min-width:33px; padding:0 8px; font:600 9px ui-monospace,SFMono-Regular,monospace; color:#81959d; }
    .speedpick button.active { color:#182026; background:#ffd078; }
    .hint { position:fixed; z-index:5; left:50%; top:clamp(20px,4vw,38px); transform:translateX(-50%); color:rgba(228,237,238,.65); font:600 8px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.18em; text-transform:uppercase; transition:opacity 1s ease; }
    .reticle { position:fixed; z-index:4; left:50%; top:50%; width:5px; height:5px; border:1px solid rgba(255,255,255,.38); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; }
    #fallback { display:none; position:fixed; inset:0; z-index:10; place-items:center; padding:30px; text-align:center; background:#07131a; color:white; }
    @media (max-width:680px) { .controls{bottom:auto;top:76px}.telemetry{padding:13px 14px}.hint{display:none}.brand span{display:none} }
  </style>
</head>
<body>
  <div id="fallback"><div><h1>WebGL unavailable</h1><p>This ride needs a WebGL-capable browser.</p></div></div>
  <div id="vignette"></div><div id="grain"></div><div class="reticle"></div>
  <header class="topbar">
    <div class="brand"><div class="brandmark"></div><div><b>EMBERLINE</b><span>Alpine circuit · Run 07</span></div></div>
    <div class="status"><i class="dot"></i><span id="rideStatus">AUTOPILOT ENGAGED</span></div>
  </header>
  <div class="hint" id="hint">Drag to look · Scroll to change pace · Space to pause</div>
  <section class="telemetry" aria-label="Ride telemetry">
    <div class="meter-head"><span class="eyebrow">VELOCITY</span><div class="speed"><span id="speed">086</span><small>KM/H</small></div></div>
    <div class="trackline"><i class="trackfill" id="trackfill"></i><i class="trackpoint" id="trackpoint"></i></div>
    <div class="data">
      <div class="datum"><strong id="altitude">142 M</strong><span>ALTITUDE</span></div>
      <div class="datum"><strong id="gforce">1.2 G</strong><span>G-FORCE</span></div>
      <div class="datum"><strong id="sector">RIDGE 01</strong><span>SECTOR</span></div>
    </div>
  </section>
  <nav class="controls" aria-label="Ride controls">
    <button id="pause" aria-label="Pause ride"><svg viewBox="0 0 24 24"><path id="pauseIcon" d="M8 5v14M16 5v14"/></svg></button>
    <div class="divider"></div>
    <div class="speedpick" aria-label="Playback speed">
      <button data-rate="0.65">0.7×</button><button class="active" data-rate="1">1×</button><button data-rate="1.45">1.5×</button>
    </div>
    <div class="divider"></div>
    <button id="view" aria-label="Toggle cinematic view"><svg viewBox="0 0 24 24"><path d="M3 8.5 7 6l3 2.5L14 6l7 4v8H3zM8 12h.01"/></svg></button>
    <button id="full" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  (() => {
    if (!window.THREE) { document.getElementById('fallback').style.display='grid'; return; }
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ca8b4);
    scene.fog = new THREE.FogExp2(0x91a4a8, 0.0032);

    const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, .06, 1400);
    const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xc7e3ec, 0x5d4937, 1.8); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffc98a, 4.2);
    sun.position.set(-120, 150, -100); sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;sun.shadow.camera.far=480; scene.add(sun);

    // Sky dome: a procedural sunset gradient, so the experience has no texture dependencies.
    const skyMat = new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, uniforms:{top:{value:new THREE.Color(0x3e718f)},mid:{value:new THREE.Color(0xa8c1c6)},bottom:{value:new THREE.Color(0xf2b36f)},offset:{value:10},exponent:{value:.7}}, vertexShader:`varying vec3 vWorldPosition; void main(){vec4 p=modelMatrix*vec4(position,1.);vWorldPosition=p.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`, fragmentShader:`uniform vec3 top;uniform vec3 mid;uniform vec3 bottom;uniform float offset;uniform float exponent;varying vec3 vWorldPosition;void main(){float h=normalize(vWorldPosition+vec3(0.,offset,0.)).y;vec3 c=mix(bottom,mid,smoothstep(-.15,.24,h));c=mix(c,top,pow(max(h,0.),exponent));gl_FragColor=vec4(c,1.);}` });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(900,32,18), skyMat));
    const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(13,48),new THREE.MeshBasicMaterial({color:0xffd294,fog:false,transparent:true,opacity:.88}));
    sunDisc.position.set(-180,98,-330); sunDisc.lookAt(camera.position); scene.add(sunDisc);

    // Closed spline with sustained climbs, diving turns and a lake-level helix.
    const pts = [
      [-10,56,112],[-72,70,82],[-110,96,22],[-92,132,-48],[-28,153,-90],[45,139,-78],
      [95,105,-32],[116,64,30],[88,25,93],[32,12,122],[-34,19,104],[-77,37,54],
      [-66,69,3],[-22,82,-24],[34,66,-16],[64,38,24],[50,17,62],[10,11,72],[-22,21,50],[-6,46,24],[36,54,44],[51,58,91]
    ].map(p=>new THREE.Vector3(...p));
    const curve = new THREE.CatmullRomCurve3(pts,true,'centripetal',.45);
    const frames = curve.computeFrenetFrames(1200,true);
    const track = new THREE.Group(); scene.add(track);
    const steel = new THREE.MeshStandardMaterial({color:0x744338,metalness:.76,roughness:.27});
    const edgeSteel = new THREE.MeshStandardMaterial({color:0xe3a26a,metalness:.82,roughness:.22});
    const wood = new THREE.MeshStandardMaterial({color:0x46372d,roughness:.85});
    const darkSteel = new THREE.MeshStandardMaterial({color:0x273339,metalness:.72,roughness:.35});

    function offsetCurve(amount){ const arr=[]; const n=420; for(let i=0;i<=n;i++){const u=i/n, p=curve.getPointAt(u), idx=Math.round(u*1200)%1200;arr.push(p.clone().addScaledVector(frames.normals[idx],amount));} return new THREE.CatmullRomCurve3(arr,true,'centripetal'); }
    [-1.05,1.05].forEach((off,i)=>{ const rail=new THREE.Mesh(new THREE.TubeGeometry(offsetCurve(off),520,.17,7,true),i?edgeSteel:steel);rail.castShadow=true;rail.receiveShadow=true;track.add(rail); });
    // Central service rail adds a strong visual line at speed.
    const centerRail = new THREE.Mesh(new THREE.TubeGeometry(curve,600,.09,6,true),darkSteel); track.add(centerRail);

    const sleeperGeo = new THREE.BoxGeometry(2.8,.18,.32);
    const sleeperMat = wood;
    const up = new THREE.Vector3(0,1,0), q = new THREE.Quaternion(), mat = new THREE.Matrix4();
    const sleepers = new THREE.InstancedMesh(sleeperGeo,sleeperMat,280); sleepers.castShadow=true; sleepers.receiveShadow=true;
    for(let i=0;i<280;i++){const u=i/280,p=curve.getPointAt(u),t=curve.getTangentAt(u),idx=Math.round(u*1200)%1200,n=frames.normals[idx];q.setFromUnitVectors(up,t); const baseBin=new THREE.Vector3(1,0,0).applyQuaternion(q); const roll=Math.atan2(baseBin.clone().cross(n).dot(t),baseBin.dot(n));q.multiply(new THREE.Quaternion().setFromAxisAngle(t,roll));mat.compose(p,q,new THREE.Vector3(1,1,1));sleepers.setMatrixAt(i,mat);} track.add(sleepers);

    // Mountain islands built from irregular cones.
    const rockMats=[new THREE.MeshStandardMaterial({color:0x50605e,roughness:1}),new THREE.MeshStandardMaterial({color:0x6a6c62,roughness:1}),new THREE.MeshStandardMaterial({color:0x3c514f,roughness:1})];
    function mountain(x,z,r,h,seed=0){ const geo=new THREE.ConeGeometry(r,h,9,5); const a=geo.attributes.position; for(let i=0;i<a.count;i++){const y=a.getY(i),f=1-y/h; const j=Math.sin(i*12.91+seed*8.13)*.9+Math.sin(i*3.7)*.45; a.setX(i,a.getX(i)+j*f);a.setZ(i,a.getZ(i)+j*f);} geo.computeVertexNormals(); const m=new THREE.Mesh(geo,rockMats[seed%3]);m.position.set(x,h/2-3,z);m.rotation.y=seed*1.74;m.receiveShadow=true;m.castShadow=true;scene.add(m); return m; }
    [[-175,-85,82,104,1],[-118,-185,112,152,2],[20,-210,128,174,0],[165,-158,112,126,1],[212,-25,92,113,2],[190,140,124,141,0],[-170,185,124,151,2],[-240,55,100,132,1]].forEach(v=>mountain(...v));
    const ground=new THREE.Mesh(new THREE.CylinderGeometry(255,290,10,48),new THREE.MeshStandardMaterial({color:0x283d3d,roughness:1}));ground.position.y=-8;ground.receiveShadow=true;scene.add(ground);
    const lake=new THREE.Mesh(new THREE.CircleGeometry(340,72),new THREE.MeshPhysicalMaterial({color:0x244f5c,roughness:.12,metalness:.2,transparent:true,opacity:.86,clearcoat:1,clearcoatRoughness:.16}));lake.rotation.x=-Math.PI/2;lake.position.y=-2.7;scene.add(lake);

    // Pine forest as inexpensive instanced silhouettes.
    const trunkGeo=new THREE.CylinderGeometry(.12,.18,2.2,5), crownGeo=new THREE.ConeGeometry(1.05,4.4,7);
    const trunks=new THREE.InstancedMesh(trunkGeo,new THREE.MeshStandardMaterial({color:0x392c24,roughness:1}),420);
    const crowns=new THREE.InstancedMesh(crownGeo,new THREE.MeshStandardMaterial({color:0x183d35,roughness:.92}),420);
    const dummy=new THREE.Object3D();
    for(let i=0;i<420;i++){const ang=i*2.399963+Math.sin(i*9.1)*.12,rad=35+(i%29)*6.3+Math.sin(i*3.4)*12,x=Math.cos(ang)*rad,z=Math.sin(ang)*rad,y=Math.max(-2,8-Math.pow(rad/72,1.5)*6),s=.7+(i%7)*.12;dummy.position.set(x,y+.9*s,z);dummy.scale.set(s,s,s);dummy.rotation.y=ang;dummy.updateMatrix();trunks.setMatrixAt(i,dummy.matrix);dummy.position.y=y+3.1*s;dummy.updateMatrix();crowns.setMatrixAt(i,dummy.matrix);} trunks.castShadow=crowns.castShadow=true;scene.add(trunks,crowns);

    // Steel supports drop vertically from the track to terrain level.
    const supportGeo=new THREE.CylinderGeometry(.13,.2,1,7); const supports=new THREE.InstancedMesh(supportGeo,darkSteel,116);
    for(let i=0;i<116;i++){const u=i/116,p=curve.getPointAt(u);const h=Math.max(2,p.y+3);dummy.position.set(p.x,h/2-3,p.z);dummy.scale.set(1,h,1);dummy.rotation.set(0,0,0);dummy.updateMatrix();supports.setMatrixAt(i,dummy.matrix);} supports.castShadow=true;scene.add(supports);

    // Tunnel portals around the low western section.
    const tunnelMat=new THREE.MeshStandardMaterial({color:0x313b39,roughness:.94,side:THREE.DoubleSide});
    [0.465,0.505].forEach((u,k)=>{const p=curve.getPointAt(u),t=curve.getTangentAt(u);const arch=new THREE.Mesh(new THREE.TorusGeometry(4.0,.55,9,28,Math.PI),tunnelMat);arch.position.copy(p).add(new THREE.Vector3(0,-2.8,0));arch.rotation.z=Math.PI;arch.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),t).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2));scene.add(arch);});

    // Distant balloons make the scale legible.
    const balloonMat=[0xd36449,0xe0aa58,0x446e78].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.7}));
    [[-75,181,-130,0],[125,145,-210,1],[-205,118,40,2]].forEach(([x,y,z,c])=>{const b=new THREE.Group();const bulb=new THREE.Mesh(new THREE.SphereGeometry(3.5,16,12),balloonMat[c]);bulb.scale.y=1.25;b.add(bulb);const basket=new THREE.Mesh(new THREE.BoxGeometry(1.1,.7,1.1),wood);basket.position.y=-5;b.add(basket);b.position.set(x,y,z);scene.add(b);});

    // Front-of-car hardware remains visible in first person.
    const car=new THREE.Group();camera.add(car);scene.add(camera);
    const nose=new THREE.Mesh(new THREE.BoxGeometry(2.15,.34,1.8),new THREE.MeshStandardMaterial({color:0xa83f2f,metalness:.58,roughness:.28}));nose.position.set(0,-1.2,-1.7);nose.rotation.x=-.07;nose.castShadow=true;car.add(nose);
    const guardMat=new THREE.MeshStandardMaterial({color:0x172326,metalness:.88,roughness:.2});
    [-1,1].forEach(s=>{const g=new THREE.Mesh(new THREE.TorusGeometry(.72,.075,7,20,Math.PI*.8),guardMat);g.position.set(s*.68,-.75,-1.35);g.rotation.set(Math.PI/2,0,s*.1);car.add(g);});

    const ui={speed:document.getElementById('speed'),alt:document.getElementById('altitude'),g:document.getElementById('gforce'),sector:document.getElementById('sector'),fill:document.getElementById('trackfill'),point:document.getElementById('trackpoint'),status:document.getElementById('rideStatus'),pause:document.getElementById('pause'),icon:document.getElementById('pauseIcon')};
    let progress=.005, rate=1, paused=false, cinematic=false, yaw=0, pitch=0, dragging=false, lastX=0,lastY=0;
    const clock=new THREE.Clock(), desiredQ=new THREE.Quaternion(), lookMat=new THREE.Matrix4();
    const sectors=['RIDGE 01','SUMMIT 02','FALL 03','LAKESIDE 04','HELIX 05','RETURN 06'];
    function setRate(v){rate=v;document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',+b.dataset.rate===v));}
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>setRate(+b.dataset.rate));
    function togglePause(){paused=!paused;ui.status.textContent=paused?'RIDE PAUSED':'AUTOPILOT ENGAGED';ui.icon.setAttribute('d',paused?'M8 5l11 7-11 7z':'M8 5v14M16 5v14');}
    ui.pause.onclick=togglePause;
    document.getElementById('view').onclick=()=>{cinematic=!cinematic;yaw=pitch=0;document.getElementById('view').style.background=cinematic?'rgba(255,208,120,.25)':'';};
    document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePause();}});
    addEventListener('wheel',e=>setRate(e.deltaY>0?Math.max(.45,rate-.1):Math.min(1.7,rate+.1)),{passive:true});
    renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
    renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;yaw-= (e.clientX-lastX)*.003;pitch=Math.max(-.48,Math.min(.4,pitch-(e.clientY-lastY)*.0025));lastX=e.clientX;lastY=e.clientY;});
    renderer.domElement.addEventListener('pointerup',()=>dragging=false);
    setTimeout(()=>document.getElementById('hint').style.opacity=0,6500);

    const p=new THREE.Vector3(), p2=new THREE.Vector3(), tangent=new THREE.Vector3(), normal=new THREE.Vector3(), binormal=new THREE.Vector3();
    function animate(){
      requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.05);
      const tangentNow=curve.getTangentAt(progress), descent=Math.max(0,-tangentNow.y), velocity=(.0105+descent*.019)*rate;
      if(!paused) progress=(progress+dt*velocity)%1;
      p.copy(curve.getPointAt(progress)); tangent.copy(curve.getTangentAt(progress)).normalize();
      const idx=Math.round(progress*1200)%1200; normal.copy(frames.normals[idx]);binormal.copy(frames.binormals[idx]);
      const bank=Math.max(-.55,Math.min(.55,curve.getTangentAt((progress+.004)%1).clone().sub(curve.getTangentAt(progress)).dot(binormal)*13));
      normal.applyAxisAngle(tangent,bank); binormal.crossVectors(tangent,normal).normalize();
      camera.position.copy(p).addScaledVector(normal,1.13);
      p2.copy(camera.position).addScaledVector(tangent,12).addScaledVector(normal,pitch*5).addScaledVector(binormal,yaw*5);
      lookMat.lookAt(camera.position,p2,normal);desiredQ.setFromRotationMatrix(lookMat);
      if(cinematic){const side=Math.sin(progress*Math.PI*8)*7;camera.position.addScaledVector(binormal,side).addScaledVector(normal,2.3);p2.copy(p).addScaledVector(tangent,7);lookMat.lookAt(camera.position,p2,normal);desiredQ.setFromRotationMatrix(lookMat);}
      camera.quaternion.slerp(desiredQ,1-Math.pow(.00005,dt));
      const kph=Math.round(58+descent*91+rate*22);ui.speed.textContent=String(kph).padStart(3,'0');
      ui.alt.textContent=Math.max(0,Math.round(p.y+3))+' M';
      const curvature=curve.getTangentAt((progress+.006)%1).angleTo(curve.getTangentAt((progress-.006+1)%1));ui.g.textContent=(.8+curvature*12+descent*.55).toFixed(1)+' G';
      ui.sector.textContent=sectors[Math.floor(progress*sectors.length)%sectors.length];const pct=progress*100;ui.fill.style.width=pct+'%';ui.point.style.left=pct+'%';
      sunDisc.lookAt(camera.position); renderer.render(scene,camera);
    }
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));});
    animate();
  })();
  </script>
</body>
</html>
