<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aldervale — A Living Medieval City</title>
  <style>
    :root { color-scheme: dark; --gold:#d9b46b; --ink:#11100d; --paper:#e8ddc5; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#10151b; font-family:Georgia, "Times New Roman", serif; }
    canvas { display:block; }
    #vignette { position:fixed; inset:0; pointer-events:none; z-index:3; background:radial-gradient(circle at 50% 46%, transparent 42%, rgba(4,7,10,.22) 74%, rgba(4,7,10,.58) 120%); }
    #grain { position:fixed; inset:0; pointer-events:none; z-index:4; opacity:.055; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); }
    header { position:fixed; z-index:7; top:28px; left:34px; pointer-events:none; color:#f1e9d7; text-shadow:0 2px 16px #000; }
    .eyebrow { font:600 10px/1.2 system-ui,sans-serif; letter-spacing:.34em; text-transform:uppercase; color:#d8b879; margin-bottom:8px; }
    h1 { margin:0; font-weight:400; letter-spacing:.055em; font-size:clamp(27px,3vw,45px); }
    .subtitle { font:400 12px/1.5 system-ui,sans-serif; letter-spacing:.13em; color:#d8d0bf; margin-top:7px; }
    #panel { position:fixed; z-index:8; right:24px; top:24px; width:228px; color:#eee6d5; padding:17px; border:1px solid rgba(217,180,107,.31); background:linear-gradient(145deg,rgba(18,17,15,.82),rgba(26,26,26,.63)); box-shadow:0 14px 46px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.06); backdrop-filter:blur(13px); border-radius:3px; transition:opacity .25s, transform .25s; }
    #panel.hidden { opacity:0; transform:translateX(18px); pointer-events:none; }
    .panel-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:11px; border-bottom:1px solid rgba(217,180,107,.22); font:600 10px/1 system-ui,sans-serif; text-transform:uppercase; letter-spacing:.22em; color:#d9b46b; }
    .row { margin:12px 0; }
    .label { display:flex; justify-content:space-between; margin-bottom:7px; font:500 10px/1 system-ui,sans-serif; letter-spacing:.08em; color:#cfc7b8; }
    .value { color:#d9b46b; font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; height:3px; appearance:none; background:rgba(255,255,255,.16); border-radius:2px; outline:none; }
    input[type=range]::-webkit-slider-thumb { appearance:none; width:12px; height:12px; border-radius:50%; background:#d9b46b; box-shadow:0 0 0 3px rgba(217,180,107,.13); cursor:pointer; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:15px; }
    button { appearance:none; border:1px solid rgba(217,180,107,.3); background:rgba(217,180,107,.08); color:#e9dfcb; padding:9px 7px; border-radius:2px; cursor:pointer; font:600 9px/1 system-ui,sans-serif; text-transform:uppercase; letter-spacing:.11em; transition:.2s; }
    button:hover { background:rgba(217,180,107,.2); border-color:rgba(217,180,107,.65); }
    button.active { color:#17130d; background:#d9b46b; }
    #legend { position:fixed; z-index:7; bottom:24px; left:32px; display:flex; gap:17px; align-items:center; color:rgba(239,232,218,.68); font:500 9px/1.3 system-ui,sans-serif; text-transform:uppercase; letter-spacing:.12em; pointer-events:none; }
    #legend span { display:flex; gap:7px; align-items:center; }
    #legend b { width:4px; height:4px; border-radius:50%; background:#d9b46b; box-shadow:0 0 7px #d9b46b; }
    #district { position:fixed; z-index:6; left:50%; bottom:29px; transform:translateX(-50%); color:#f2e7d0; text-shadow:0 2px 11px #000; text-align:center; pointer-events:none; opacity:0; transition:opacity .3s; }
    #district.show { opacity:1; }
    #district strong { display:block; font-size:15px; font-weight:400; letter-spacing:.16em; }
    #district small { display:block; margin-top:5px; font:500 8px/1 system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase; color:#d9b46b; }
    #loading { position:fixed; z-index:20; inset:0; display:grid; place-items:center; background:#10151b; color:#e8ddc5; transition:opacity .7s; }
    #loading.done { opacity:0; pointer-events:none; }
    #loading div { text-align:center; letter-spacing:.22em; }
    #loading i { display:block; width:110px; height:1px; margin:16px auto; background:linear-gradient(90deg,transparent,#d9b46b,transparent); animation:pulse 1.2s ease-in-out infinite; }
    #loading small { font:500 9px/1 system-ui,sans-serif; text-transform:uppercase; color:#aa9e88; }
    @keyframes pulse { 50% { transform:scaleX(.42); opacity:.4; } }
    @media (max-width:680px) { #panel { top:auto; right:12px; bottom:12px; width:205px; } header{left:18px;top:18px}.subtitle{display:none}#legend{display:none} }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="loading"><div>ALDERVALE<i></i><small>Raising the city walls</small></div></div>
  <header>
    <div class="eyebrow">The Crownlands · Year 1367</div>
    <h1>ALDERVALE</h1>
    <div class="subtitle">A living city between river and crown</div>
  </header>
  <aside id="panel">
    <div class="panel-title"><span>City Chronicle</span><span id="clock">08:30</span></div>
    <div class="row"><div class="label"><span>Hour of day</span><span class="value" id="timeValue">08:30</span></div><input id="time" type="range" min="0" max="24" value="8.5" step=".05"></div>
    <div class="row"><div class="label"><span>City bustle</span><span class="value" id="bustleValue">72%</span></div><input id="bustle" type="range" min="0" max="100" value="72"></div>
    <div class="row"><div class="label"><span>Weather</span><span class="value" id="weatherValue">Clear</span></div><input id="weather" type="range" min="0" max="100" value="18"></div>
    <div class="buttons"><button id="tour">Guided tour</button><button id="cycle" class="active">Living time</button><button id="regen">New city</button><button id="hide">Hide panel</button></div>
  </aside>
  <div id="legend"><span><b></b>Drag to orbit</span><span><b></b>Scroll to travel</span><span><b></b>Click a quarter</span><span><b></b>H to show controls</span></div>
  <div id="district"><strong></strong><small></small></div>
  <div id="vignette"></div><div id="grain"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa7c0c6);
    scene.fog = new THREE.FogExp2(0xb4c6c4, 0.0038);
    const camera = new THREE.PerspectiveCamera(43, innerWidth/innerHeight, .5, 650);
    camera.position.set(142, 116, 164);
    const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 10, 0); controls.enableDamping = true; controls.dampingFactor=.055;
    controls.minDistance=55; controls.maxDistance=285; controls.maxPolarAngle=Math.PI*.485;

    let seed = 1367;
    function rand(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
    const TAU=Math.PI*2, city=new THREE.Group(), movers=[], flames=[], smoke=[], flags=[], clouds=[], birds=[];
    scene.add(city);

    const palette={ plaster:[0xd6c39d,0xc2ad88,0xe0d0ad,0xbda27d,0xcebd9b], timber:[0x4a3020,0x5a3823,0x39271e], roof:[0x5c3027,0x714135,0x3f4650,0x665b4f,0x3d3431] };
    const mat=(color,roughness=.86)=>new THREE.MeshStandardMaterial({color,roughness,metalness:.02});
    const groundMat=mat(0x66744f), stoneMat=mat(0x77766b), roadMat=mat(0x736858), darkStone=mat(0x56584f);
    const woodMat=mat(0x4c3020), waterMat=new THREE.MeshPhysicalMaterial({color:0x456f78,roughness:.2,metalness:.05,transparent:true,opacity:.82,clearcoat:.4});
    const shared={ box:new THREE.BoxGeometry(1,1,1), cyl:new THREE.CylinderGeometry(1,1,1,10), sphere:new THREE.SphereGeometry(1,10,7), cone:new THREE.ConeGeometry(1,1,8) };

    function mesh(geo, material, x=0,y=0,z=0, sx=1,sy=1,sz=1, parent=city){
      const o=new THREE.Mesh(geo,material); o.position.set(x,y,z); o.scale.set(sx,sy,sz); o.castShadow=true; o.receiveShadow=true; parent.add(o); return o;
    }
    function canvasTexture(draw,w=256,h=256){ const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t; }
    const grassTex=canvasTexture((x,w,h)=>{x.fillStyle='#66734f';x.fillRect(0,0,w,h);for(let i=0;i<2400;i++){const v=70+rand()*55;x.fillStyle=`rgba(${v*.65},${v},${v*.52},.18)`;x.fillRect(rand()*w,rand()*h,1,1);}});grassTex.repeat.set(30,30);
    groundMat.map=grassTex;

    const terrain=mesh(new THREE.CircleGeometry(285,96),groundMat,0,-1.2,0,1,1,1,scene);terrain.rotation.x=-Math.PI/2;terrain.receiveShadow=true;
    // Rolling outskirts.
    for(let i=0;i<34;i++){const a=rand()*TAU,r=128+rand()*112,s=13+rand()*28;const hill=mesh(shared.sphere,mat(0x60704c),Math.cos(a)*r,-7+rand()*2,Math.sin(a)*r,s,7+rand()*8,s*.75,scene);hill.castShadow=false;}

    // River and stone bridge.
    const river=mesh(new THREE.PlaneGeometry(54,600,1,1),waterMat,-150,-.82,0,1,1,1,scene);river.rotation.x=-Math.PI/2;river.rotation.z=-.08;river.receiveShadow=true;
    for(let i=-2;i<=2;i++){const arch=mesh(new THREE.TorusGeometry(7.2,2.1,8,20,Math.PI),stoneMat,-150,4,i*6.5,1,1,1,scene);arch.rotation.y=Math.PI/2;arch.rotation.z=Math.PI/2;}
    mesh(shared.box,stoneMat,-150,8,0,18,2.2,20,scene);

    // Roads: three rings, spokes and central square.
    function ringRoad(radius,width){const r=mesh(new THREE.RingGeometry(radius-width,radius+width,96),roadMat,0,-.67,0,1,1,1);r.rotation.x=-Math.PI/2;r.receiveShadow=true;}
    ringRoad(27,3.7);ringRoad(57,3.2);ringRoad(86,3.5);
    for(let i=0;i<8;i++){const a=i*TAU/8;const road=mesh(shared.box,roadMat,Math.cos(a)*57,-.58,Math.sin(a)*57,5.2,.5,119);road.rotation.y=-a;road.receiveShadow=true;}
    const square=mesh(new THREE.CylinderGeometry(18,18,.5,8),roadMat,0,-.5,0);square.rotation.y=Math.PI/8;

    // Wall, battlements, towers and gates.
    function tower(a,r=109,large=false){const x=Math.cos(a)*r,z=Math.sin(a)*r,h=large?22:17,rad=large?7:5.3;const g=new THREE.Group();g.position.set(x,0,z);city.add(g);
      mesh(new THREE.CylinderGeometry(rad,rad*1.08,h,12),stoneMat,0,h/2,0,1,1,1,g);
      mesh(new THREE.ConeGeometry(rad*1.35,6.8,12),mat(0x4d3b35),0,h+3.1,0,1,1,1,g);
      for(let j=0;j<8;j++){const q=j*TAU/8;mesh(shared.box,darkStone,Math.cos(q)*rad*.82,h+.6,Math.sin(q)*rad*.82,1.15,1.9,1.15,g);}
      const flagPole=mesh(new THREE.CylinderGeometry(.08,.08,7,5),mat(0x2c251f),0,h+7,0,1,1,1,g); flagPole.castShadow=false;
      const f=mesh(new THREE.PlaneGeometry(3.6,1.8,5,1),new THREE.MeshStandardMaterial({color:large?0xb89a4b:0x8e2f29,side:THREE.DoubleSide}),1.8,h+9.5,0,1,1,1,g);flags.push({mesh:f,phase:rand()*TAU});
    }
    for(let i=0;i<16;i++){const a=i*TAU/16;tower(a,109,i%4===0);if(i<16){const b=(i+1)*TAU/16,mid=(a+b)/2,len=2*109*Math.sin((b-a)/2);const wall=mesh(shared.box,stoneMat,Math.cos(mid)*106,6,Math.sin(mid)*106,len*.98,12,3.6);wall.rotation.y=-mid;for(let j=-3;j<=3;j++){const mer=mesh(shared.box,darkStone,Math.cos(mid)*104.3,12.9,Math.sin(mid)*104.3,2.2,2.2,2.2);mer.rotation.y=-mid;mer.translateX(j*len/7);}}}

    function roofGeometry(w,d,h){const p=new Float32Array([-w/2,0,-d/2,w/2,0,-d/2,0,h,-d/2,-w/2,0,d/2,0,h,d/2,w/2,0,d/2]);const idx=[0,1,2,3,4,5,0,3,1,1,3,5,1,5,2,2,5,4,3,0,4,4,0,2];const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setIndex(idx);g.computeVertexNormals();return g;}
    function house(x,z,angle,scale=1,grand=false){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=angle;city.add(g);const w=(grand?10:6+rand()*3)*scale,d=(grand?9:6+rand()*3)*scale,h=(grand?11:5+rand()*4)*scale;
      const wall=mesh(shared.box,mat(palette.plaster[(rand()*palette.plaster.length)|0]),0,h/2,0,w,h,d, g);
      mesh(roofGeometry(w*1.17,d*1.16,3.8*scale),mat(palette.roof[(rand()*palette.roof.length)|0]),0,h,0,1,1,1,g);
      const tim=mat(palette.timber[(rand()*palette.timber.length)|0]);for(const xx of [-w*.43,w*.43])mesh(shared.box,tim,xx,h*.53,d*.506,.38,h*.92,.22,g);
      mesh(shared.box,tim,0,h*.78,d*.515,w*.94,.34,.2,g);mesh(shared.box,tim,0,h*.28,d*.515,w*.94,.3,.2,g);
      const door=mesh(shared.box,woodMat,0,1.25,d*.523,1.45,2.5,.24,g);door.castShadow=false;
      const winMat=new THREE.MeshStandardMaterial({color:0x5d81a0,emissive:0xffb956,emissiveIntensity:.08,roughness:.25});
      for(const xx of [-w*.27,w*.27]){const wi=mesh(shared.box,winMat,xx,h*.59,d*.525,1.05,1.3,.2,g);wi.userData.window=true;}
      if(rand()>.55){const chimney=mesh(shared.box,darkStone,w*.27,h+3,0,.8,4,.8,g);smoke.push({x:g.position.x+Math.cos(angle)*w*.27,y:h+5,z:g.position.z-Math.sin(angle)*w*.27,phase:rand()*TAU});}
      wall.userData={district:Math.hypot(x,z)<40?'Crown Ward':(Math.atan2(z,x)>0?'Artisans’ Quarter':'River Ward'),kind:'home'};return g;
    }

    // Dense, irregular rings of homes, leaving streets readable.
    for(const band of [[38,20],[52,28],[69,36],[88,46]]){const [r,count]=band;for(let i=0;i<count;i++){const a=i*TAU/count+(rand()-.5)*.08;if(Math.abs(Math.sin(a*4))<.075)continue;const rr=r+(rand()-.5)*8;house(Math.cos(a)*rr,Math.sin(a)*rr,-a+Math.PI/2,.78+rand()*.26,r<45&&i%7===0);}}

    // Keep, hill, towers, courtyard and market landmark.
    mesh(new THREE.CylinderGeometry(24,28,5,24),darkStone,0,1.5,0);
    const keep=mesh(shared.box,stoneMat,0,15,0,25,27,22);keep.userData={district:'High Keep',kind:'castle'};
    for(const [x,z] of [[-13,-12],[13,-12],[-13,12],[13,12]]){const kt=mesh(new THREE.CylinderGeometry(5,5.7,30,12),darkStone,x,15,z);mesh(new THREE.ConeGeometry(6.8,8,12),mat(0x4d3330),x,34,z);for(let j=0;j<6;j++){const a=j*TAU/6;mesh(shared.box,stoneMat,x+Math.cos(a)*4.5,30.8,z+Math.sin(a)*4.5,1.4,2.4,1.4);}}
    for(let i=-3;i<=3;i++){mesh(shared.box,darkStone,i*3.2,29,11.2,1.7,2.6,1.8);mesh(shared.box,darkStone,i*3.2,29,-11.2,1.7,2.6,1.8);}
    const bannerMat=new THREE.MeshStandardMaterial({color:0xa52e29,side:THREE.DoubleSide});const keepFlag=mesh(new THREE.PlaneGeometry(7,3.5,7,1),bannerMat,3.5,42,0);flags.push({mesh:keepFlag,phase:0});mesh(new THREE.CylinderGeometry(.1,.1,13,5),woodMat,0,40,0);
    // Market stalls in the outer square.
    for(let i=0;i<9;i++){const a=i*TAU/9,r=31+rand()*3,x=Math.cos(a)*r,z=Math.sin(a)*r,g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=-a;city.add(g);mesh(shared.box,woodMat,0,1,0,5,.35,3,g);const awning=new THREE.MeshStandardMaterial({color:i%2?0x9f4b38:0xb9984f,roughness:.9});const top=mesh(shared.box,awning,0,3.3,0,5.7,.18,3.6,g);top.rotation.z=(i%2?.04:-.04);for(const xx of [-2.3,2.3])mesh(shared.box,woodMat,xx,1.7,-1.2,.16,3.4,.16,g);}

    // Forest and farmland beyond the wall.
    for(let i=0;i<190;i++){const a=rand()*TAU,r=124+rand()*130;if(Math.abs(Math.cos(a)*r+150)<35)continue;const x=Math.cos(a)*r,z=Math.sin(a)*r,h=3+rand()*5;mesh(shared.cyl,woodMat,x,h*.5-1,z,.35,h,.35,scene);const crown=mesh(shared.cone,mat(i%4?0x3f5d3c:0x536943),x,h+2,z,2.3+rand()*2,5+rand()*4,2.3+rand()*2,scene);crown.castShadow=i<80;}
    for(let i=0;i<8;i++){const a=-1+rand()*1.3,r=145+rand()*70,x=Math.cos(a)*r,z=Math.sin(a)*r;const field=mesh(shared.box,mat(i%2?0x9a8d50:0x897946),x,-.6,z,18+rand()*15,.35,10+rand()*8,scene);field.rotation.y=-a+rand()*.35;}

    // Torches and warm pools of light.
    for(let i=0;i<20;i++){const a=i*TAU/20,r=i%2?24:102,x=Math.cos(a)*r,z=Math.sin(a)*r;mesh(shared.cyl,woodMat,x,2,z,.13,4,.13);const flame=mesh(shared.sphere,new THREE.MeshBasicMaterial({color:0xffa33b}),x,4.4,z,.3,.55,.3);const light=new THREE.PointLight(0xff8c38,0,15,2);light.position.set(x,4.8,z);scene.add(light);flames.push({mesh:flame,light,phase:rand()*TAU});}

    // People and carts follow concentric streets.
    function person(radius,speed,color){const g=new THREE.Group();const body=mesh(new THREE.ConeGeometry(.48,.42,1.7,7),mat(color),0,1.05,0,1,1,1,g);mesh(shared.sphere,mat(0xc5966c),0,2.12,0,.34,.38,.34,g);scene.add(g);movers.push({group:g,radius,angle:rand()*TAU,speed:(rand()>.5?1:-1)*speed,offset:rand()*2,kind:'person'});}
    const cloth=[0x6f4438,0x31505a,0x79612e,0x493e63,0x7b3031,0x3f5a3c];for(let i=0;i<72;i++)person([27,57,86][i%3]+(rand()-.5)*2.6,.035+rand()*.025,cloth[i%cloth.length]);
    function cart(radius){const g=new THREE.Group();mesh(shared.box,woodMat,0,1.2,0,3.2,.75,1.8,g);for(const z of [-1,1]){const w=mesh(new THREE.TorusGeometry(.72,.14,6,12),darkStone,-.65,.75,z,1,1,1,g);w.rotation.y=Math.PI/2;}mesh(shared.box,mat(0x786042),1.9,1,0,1.2,1.1,.65,g);scene.add(g);movers.push({group:g,radius,angle:rand()*TAU,speed:.018*(rand()>.5?1:-1),kind:'cart'});}for(let i=0;i<8;i++)cart(i%2?57:86);

    // Smoke sprites.
    const smokeTex=canvasTexture((x,w,h)=>{const g=x.createRadialGradient(w/2,h/2,1,w/2,h/2,w/2);g.addColorStop(0,'rgba(230,225,210,.55)');g.addColorStop(.45,'rgba(170,170,165,.23)');g.addColorStop(1,'rgba(100,100,100,0)');x.fillStyle=g;x.fillRect(0,0,w,h);},64,64);
    const smokeMat=new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,color:0xc2c1b9});const smokeSprites=[];smoke.slice(0,38).forEach((s,j)=>{for(let i=0;i<4;i++){const sp=new THREE.Sprite(smokeMat.clone());sp.position.set(s.x,s.y+i*1.7,s.z);sp.scale.set(2.4+i*.8,2.4+i*.8,1);sp.userData={base:s.y,phase:s.phase+i*1.7,index:i};scene.add(sp);smokeSprites.push(sp);}});

    // Clouds and birds.
    for(let i=0;i<11;i++){const g=new THREE.Group();const cm=mat(0xe1e1d8);for(let j=0;j<5;j++)mesh(shared.sphere,cm,(j-2)*4+rand()*2,rand()*2,rand()*3,5+rand()*3,2+rand()*1.3,3+rand()*2,g);g.position.set((rand()-.5)*340,65+rand()*42,(rand()-.5)*280);g.scale.setScalar(.8+rand()*1.2);scene.add(g);clouds.push({g,speed:.5+rand()*.7});}
    const birdMat=new THREE.LineBasicMaterial({color:0x242a29});for(let i=0;i<16;i++){const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1,0,0),new THREE.Vector3(0,-.4,0),new THREE.Vector3(1,0,0)]);const b=new THREE.Line(geo,birdMat);scene.add(b);birds.push({b,r:35+rand()*65,a:rand()*TAU,y:44+rand()*35,s:.07+rand()*.05});}

    // Lighting and sky actors.
    const hemi=new THREE.HemisphereLight(0xc9dcea,0x39422f,1.8);scene.add(hemi);
    const sun=new THREE.DirectionalLight(0xffe4b0,3.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-145;sun.shadow.camera.right=145;sun.shadow.camera.top=145;sun.shadow.camera.bottom=-145;sun.shadow.camera.far=420;sun.shadow.bias=-.00025;scene.add(sun);scene.add(sun.target);
    const moon=new THREE.DirectionalLight(0x839bc8,0);scene.add(moon);
    const skySun=mesh(shared.sphere,new THREE.MeshBasicMaterial({color:0xffe3a0}),0,0,0,4,4,4,scene);skySun.castShadow=false;
    const starsGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<900;i++){const a=rand()*TAU,u=rand(),r=270,y=45+u*180;starPos.push(Math.cos(a)*Math.sqrt(r*r-y*y*.35),y,Math.sin(a)*Math.sqrt(r*r-y*y*.35));}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xeaf1ff,size:.65,transparent:true,opacity:0}));scene.add(stars);

    const rainGeo=new THREE.BufferGeometry(),rainPos=[];for(let i=0;i<1100;i++)rainPos.push((rand()-.5)*300,rand()*120,(rand()-.5)*300);rainGeo.setAttribute('position',new THREE.Float32BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xaec3ca,size:.22,transparent:true,opacity:0,depthWrite:false}));scene.add(rain);

    let hour=8.5,autoTime=true,bustle=.72,weather=.18,tour=false,tourT=0;
    function fmtHour(v){const h=Math.floor(v)%24,m=Math.floor((v%1)*60);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
    function updateDay(){const a=(hour-6)/24*TAU,alt=Math.sin(a),x=Math.cos(a)*190,y=alt*165,z=Math.sin(a*.67)*105;sun.position.set(x,y,z);skySun.position.copy(sun.position);sun.intensity=Math.max(0,alt)*3.3;moon.intensity=Math.max(0,-alt)*.42;hemi.intensity=.28+Math.max(0,alt)*1.45;const night=THREE.MathUtils.smoothstep(-alt,.02,.6);stars.material.opacity=night*.9;skySun.visible=alt>-.04;
      const dawn=new THREE.Color(0xd99c78),day=new THREE.Color(0x9fbcc4),nightC=new THREE.Color(0x091320);const c=alt<.12?nightC.clone().lerp(dawn,THREE.MathUtils.clamp((alt+.18)/.3,0,1)):dawn.clone().lerp(day,THREE.MathUtils.clamp((alt-.12)/.45,0,1));scene.background.copy(c);scene.fog.color.copy(c).lerp(new THREE.Color(0x9ca6a0),weather*.22);renderer.toneMappingExposure=.68+Math.max(0,alt)*.42;
      const lamp=Math.max(0,night);flames.forEach(f=>{f.light.intensity=lamp*2.8;f.mesh.material.opacity=lamp;f.mesh.visible=lamp>.08;});scene.traverse(o=>{if(o.userData.window&&o.material)o.material.emissiveIntensity=lamp*(.7+Math.sin(o.id)*.2);});
    }
    updateDay();

    const timeInput=document.querySelector('#time'),bustleInput=document.querySelector('#bustle'),weatherInput=document.querySelector('#weather');
    timeInput.oninput=e=>{hour=+e.target.value;autoTime=false;document.querySelector('#cycle').classList.remove('active');updateDay();};
    bustleInput.oninput=e=>bustle=+e.target.value/100;
    weatherInput.oninput=e=>weather=+e.target.value/100;
    document.querySelector('#cycle').onclick=e=>{autoTime=!autoTime;e.target.classList.toggle('active',autoTime);};
    document.querySelector('#tour').onclick=e=>{tour=!tour;e.target.classList.toggle('active',tour);tourT=0;controls.enabled=!tour;};
    document.querySelector('#hide').onclick=()=>document.querySelector('#panel').classList.add('hidden');
    addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.querySelector('#panel').classList.toggle('hidden');});
    document.querySelector('#regen').onclick=()=>location.reload();

    const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),district=document.querySelector('#district');
    renderer.domElement.addEventListener('pointerdown',e=>{pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(city.children,true).find(h=>h.object.userData.district);if(hit){const d=hit.object.userData.district;district.querySelector('strong').textContent=d;district.querySelector('small').textContent=hit.object.userData.kind==='castle'?'Seat of the Aldervale crown':'Click and drag to explore';district.classList.add('show');setTimeout(()=>district.classList.remove('show'),2600);}});

    const clock=new THREE.Clock();let intro=0;
    function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;intro=Math.min(1,intro+dt*.22);
      if(autoTime){hour=(hour+dt*.075)%24;timeInput.value=hour;updateDay();}
      const hh=fmtHour(hour);document.querySelector('#clock').textContent=hh;document.querySelector('#timeValue').textContent=hh;document.querySelector('#bustleValue').textContent=Math.round(bustle*100)+'%';document.querySelector('#weatherValue').textContent=weather<.32?'Clear':weather<.68?'Overcast':'Rain';
      movers.forEach((m,i)=>{m.angle+=m.speed*dt*18*bustle;m.group.visible=bustle>.03&&i<movers.length*(.25+bustle*.75);m.group.position.set(Math.cos(m.angle)*m.radius,0,Math.sin(m.angle)*m.radius);m.group.rotation.y=-m.angle+(m.speed>0?Math.PI/2:-Math.PI/2);if(m.kind==='person')m.group.position.y=Math.abs(Math.sin(t*7+i))*.08;});
      flames.forEach((f,i)=>{const q=1+Math.sin(t*12+f.phase)*.16+Math.sin(t*21+i)*.07;f.mesh.scale.set(.3*q,.55*q,.3*q);f.light.intensity*=.92+Math.sin(t*17+i)*.08;});
      flags.forEach((f,i)=>{const p=f.mesh.geometry.attributes.position;for(let j=0;j<p.count;j++)p.setZ(j,Math.sin(t*3.2+f.phase+p.getX(j)*1.8)*.22);p.needsUpdate=true;});
      smokeSprites.forEach((s,i)=>{const u=(t*.38+s.userData.index*.2+s.userData.phase)%1;s.position.y=s.userData.base+u*8;s.position.x+=Math.sin(t*.45+i)*.0015;s.material.opacity=(1-u)*(.13+.25*(1-weather));const sc=2.1+u*4.2;s.scale.set(sc,sc,1);});
      clouds.forEach(c=>{c.g.position.x+=dt*c.speed*(1+weather*2);if(c.g.position.x>210)c.g.position.x=-210;c.g.children.forEach(o=>o.material.color.setHex(weather>.6?0x889496:0xe1e1d8));});
      birds.forEach((o,i)=>{o.a+=o.s*dt*8;o.b.position.set(Math.cos(o.a)*o.r, o.y+Math.sin(t*2+i)*2,Math.sin(o.a)*o.r);o.b.rotation.y=-o.a;o.b.scale.y=.7+Math.sin(t*7+i)*.4;});
      waterMat.color.setHex(weather>.6?0x374f56:0x456f78);water.material.opacity=.76+.04*Math.sin(t*.7);
      rain.material.opacity=Math.max(0,(weather-.58)*1.7);rain.visible=weather>.58;const rp=rain.geometry.attributes.position;for(let i=0;i<rp.count;i++){let y=rp.getY(i)-dt*(55+weather*40);if(y<0)y=120;rp.setY(i,y);}rp.needsUpdate=true;scene.fog.density=.0038+weather*.004;
      if(tour){tourT+=dt*.055;const a=tourT*TAU,r=118-35*Math.sin(tourT*TAU*.5);camera.position.set(Math.cos(a)*r,50+20*Math.sin(a*.7),Math.sin(a)*r);camera.lookAt(0,12,0);}else controls.update();
      renderer.render(scene,camera);
    }
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    setTimeout(()=>document.querySelector('#loading').classList.add('done'),700);
    animate();
  </script>
</body>
</html>
