<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIGHT//DRIVE</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #8dfcff;
      --cyan-soft: rgba(141, 252, 255, .34);
      --amber: #ffbd65;
      --ink: #03070b;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; color: #eafcff; }
    canvas { position: fixed; inset: 0; display: block; }
    #grain, #vignette, #windshield { position: fixed; inset: 0; pointer-events: none; }
    #grain {
      z-index: 2; opacity: .12; mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      animation: grain .18s steps(2) infinite;
    }
    @keyframes grain { 0% { transform: translate(0,0) } 25% { transform: translate(-2%,1%) } 50% { transform: translate(1%,-2%) } 75% { transform: translate(2%,2%) } }
    #vignette {
      z-index: 3;
      background: radial-gradient(ellipse at 50% 48%, transparent 34%, rgba(1,4,8,.2) 66%, rgba(0,1,3,.83) 100%);
      box-shadow: inset 0 0 12vw 3vw #000;
    }
    #windshield {
      z-index: 4;
      background:
        linear-gradient(103deg, transparent 15%, rgba(195,242,255,.025) 43%, transparent 44%),
        linear-gradient(77deg, transparent 56%, rgba(195,242,255,.018) 76%, transparent 77%);
    }
    #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    .topbar {
      position: absolute; top: 28px; left: 34px; right: 34px; display: flex; align-items: flex-start; justify-content: space-between;
      text-transform: uppercase; letter-spacing: .14em; font-size: 10px; color: rgba(220,250,255,.64);
    }
    .brand { display: flex; align-items: center; gap: 12px; color: #f3feff; font-size: 12px; letter-spacing: .28em; }
    .brand-mark { width: 24px; height: 1px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); position: relative; }
    .brand-mark::after { content: ""; position: absolute; right: -1px; top: -3px; width: 7px; height: 7px; border: 1px solid var(--cyan); transform: rotate(45deg); }
    .signal { display: flex; align-items: center; gap: 9px; }
    .signal i { width: 5px; height: 5px; display: inline-block; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: blink 1.8s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .2; box-shadow: none; } }
    .route {
      position: absolute; top: 29px; left: 50%; transform: translateX(-50%); text-align: center;
    }
    .route b { display: block; color: rgba(231,253,255,.92); font-weight: 500; letter-spacing: .3em; margin-bottom: 7px; }
    .route span { color: rgba(162,217,224,.4); }
    .reticle { position: absolute; top: 42%; left: 50%; width: 46px; height: 12px; transform: translate(-50%,-50%); opacity: .46; }
    .reticle::before, .reticle::after { content: ""; position: absolute; top: 50%; width: 13px; height: 1px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    .reticle::before { left: 0; } .reticle::after { right: 0; }
    .reticle i { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; border: 1px solid var(--cyan); transform: translate(-50%,-50%) rotate(45deg); }
    .bottom {
      position: absolute; left: 34px; right: 34px; bottom: 27px; display: flex; align-items: flex-end; justify-content: space-between;
    }
    .telemetry { width: 240px; }
    .speed-row { display: flex; align-items: baseline; gap: 9px; }
    #speed { font-family: Arial, sans-serif; font-size: clamp(52px, 7vw, 92px); font-weight: 200; line-height: .8; letter-spacing: -.07em; color: #f2fdff; text-shadow: 0 0 18px rgba(130,237,255,.2); }
    .unit { font-size: 9px; letter-spacing: .25em; color: rgba(199,238,243,.48); }
    .meter { height: 2px; width: 100%; margin-top: 16px; background: rgba(151,226,236,.13); position: relative; }
    #meter-fill { position: absolute; inset: 0 auto 0 0; width: 42%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transition: width .15s linear; }
    .meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: 8px; letter-spacing: .17em; color: rgba(188,228,234,.38); }
    .status-stack { text-align: right; font-size: 9px; letter-spacing: .18em; color: rgba(211,245,249,.48); line-height: 2; }
    .status-stack span { color: var(--cyan); text-shadow: 0 0 9px rgba(141,252,255,.5); }
    #distance { color: rgba(241,254,255,.82); }
    .controls {
      position: absolute; right: 34px; top: 50%; transform: translateY(-50%); display: grid; gap: 10px; text-align: right;
      font-size: 8px; letter-spacing: .12em; color: rgba(211,244,248,.34);
    }
    .controls div { display: flex; justify-content: flex-end; align-items: center; gap: 9px; }
    .key { border: 1px solid rgba(182,234,241,.24); min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: rgba(228,251,255,.68); background: rgba(7,16,22,.35); }
    #flash { position: fixed; inset: 0; z-index: 6; background: #d9f8ff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
    #intro {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 38%, rgba(8,26,35,.28), rgba(0,2,5,.94));
      transition: opacity .9s ease, visibility .9s;
    }
    #intro.hidden { opacity: 0; visibility: hidden; }
    .intro-card { width: min(540px, calc(100vw - 48px)); text-align: center; }
    .eyebrow { font-size: 9px; text-transform: uppercase; letter-spacing: .42em; color: rgba(164,231,240,.52); margin-bottom: 21px; }
    h1 { margin: 0; font-family: Arial, sans-serif; font-size: clamp(54px, 9vw, 108px); font-weight: 800; letter-spacing: -.08em; line-height: .78; color: #effdff; text-shadow: 0 0 50px rgba(112,229,255,.18); }
    h1 em { display: block; color: transparent; -webkit-text-stroke: 1px rgba(192,245,252,.5); font-style: normal; letter-spacing: .04em; font-weight: 300; }
    .intro-rule { width: 1px; height: 54px; margin: 30px auto; background: linear-gradient(var(--cyan), transparent); }
    #start {
      pointer-events: auto; cursor: pointer; appearance: none; border: 1px solid rgba(142,241,253,.38); background: rgba(4,16,21,.58); color: #eaffff;
      padding: 15px 26px; min-width: 196px; text-transform: uppercase; font: 10px/1 monospace; letter-spacing: .28em; transition: .25s;
    }
    #start:hover { background: rgba(73,198,214,.16); border-color: var(--cyan); box-shadow: 0 0 25px rgba(72,220,242,.12), inset 0 0 20px rgba(72,220,242,.06); }
    .hint { margin-top: 16px; font-size: 8px; letter-spacing: .15em; color: rgba(185,229,235,.28); text-transform: uppercase; }
    .corner { position: absolute; width: 22px; height: 22px; border-color: rgba(140,229,240,.18); border-style: solid; }
    .corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; } .corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; } .corner.br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
    @media (max-width: 700px) {
      .controls { display: none; } .route { display: none; } .topbar, .bottom { left: 18px; right: 18px; } .topbar { top: 18px; } .bottom { bottom: 20px; }
      .telemetry { width: 180px; } .status-stack { font-size: 7px; }
    }
  </style>
</head>
<body>
  <div id="grain"></div><div id="vignette"></div><div id="windshield"></div><div id="flash"></div>
  <div id="hud">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="topbar">
      <div class="brand"><i class="brand-mark"></i>NIGHT//DRIVE</div>
      <div class="route"><b>SECTOR N-17</b><span>NO DESTINATION · NO RETURN</span></div>
      <div class="signal"><i></i><span id="clock">03:17:42</span></div>
    </div>
    <div class="reticle"><i></i></div>
    <div class="controls">
      <div>STEER <span class="key">A</span><span class="key">D</span></div>
      <div>THROTTLE <span class="key">W</span><span class="key">S</span></div>
      <div>VIEW <span class="key">C</span></div>
      <div>LIGHTS <span class="key">H</span></div>
      <div>AUDIO <span class="key">M</span></div>
    </div>
    <div class="bottom">
      <div class="telemetry">
        <div class="speed-row"><span id="speed">118</span><span class="unit">KM/H</span></div>
        <div class="meter"><i id="meter-fill"></i></div>
        <div class="meta"><span>CRUISE VECTOR</span><span id="gear">D4</span></div>
      </div>
      <div class="status-stack">
        <div>RAIN <span id="rain-state">ACTIVE</span></div>
        <div>HEADLIGHTS <span id="light-state">AUTO</span></div>
        <div>DISTANCE <b id="distance">000.0 KM</b></div>
      </div>
    </div>
  </div>
  <div id="intro">
    <div class="intro-card">
      <div class="eyebrow">An endless night transmission</div>
      <h1>NIGHT<em>DRIVE</em></h1>
      <div class="intro-rule"></div>
      <button id="start">Engage ignition</button>
      <div class="hint">Headphones recommended · W A S D to drive</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02060b);
    scene.fog = new THREE.FogExp2(0x07101a, 0.0125);

    const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 950);
    camera.position.set(0, 2.25, 7.5);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0x23435e, 0x030306, 0.34);
    scene.add(hemi);
    const moonLight = new THREE.DirectionalLight(0x8fb9d5, 0.48);
    moonLight.position.set(-20, 32, -45);
    scene.add(moonLight);

    const roadMat = new THREE.MeshPhysicalMaterial({ color: 0x070b0e, roughness: .29, metalness: .22, clearcoat: .78, clearcoatRoughness: .22 });
    const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x0c1215, roughness: .72, metalness: .1 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xc5e7e8, toneMapped: false });
    const edgeMat = new THREE.MeshBasicMaterial({ color: 0x2b9fa7, transparent: true, opacity: .54, toneMapped: false });
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x101b21, roughness: .42, metalness: .7 });
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xa9f7ff, toneMapped: false });
    const redMat = new THREE.MeshBasicMaterial({ color: 0xff1d32, toneMapped: false });
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x071016, roughness: .75, metalness: .15 });
    const windowMats = [0x3e8295, 0x79cad3, 0xcf9f57].map(c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .72, toneMapped: false }));

    const SEG_LEN = 30, SEG_COUNT = 24;
    const segments = [];
    let segmentSerial = 0;

    function curveAt(serial) {
      return Math.sin(serial * .19) * 5.2 + Math.sin(serial * .071 + 1.4) * 8.3;
    }

    function addBox(parent, geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
    }

    function makeBuilding(parent, side, seed) {
      const h = 8 + ((seed * 13) % 20), w = 5 + ((seed * 7) % 6);
      const x = side * (18 + ((seed * 5) % 18));
      const z = -9 + ((seed * 11) % 18);
      addBox(parent, new THREE.BoxGeometry(w, h, 7), buildingMat, x, h / 2 - .1, z);
      const rows = Math.floor(h / 3);
      for (let r = 0; r < rows; r++) {
        if ((seed + r * 3) % 5 === 0) continue;
        const win = addBox(parent, new THREE.PlaneGeometry(.65, .5), windowMats[(seed + r) % windowMats.length], x - side * (w / 2 + .006), 2 + r * 2.5, z + ((r * 3 + seed) % 5) - 2);
        win.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
      }
      const antenna = addBox(parent, new THREE.CylinderGeometry(.025, .025, 4, 4), poleMat, x, h + 2, z);
      if (seed % 3 === 0) addBox(antenna, new THREE.SphereGeometry(.1, 6, 4), redMat, 0, 2, 0);
    }

    function createSegment(i) {
      const root = new THREE.Group();
      root.userData.serial = i;
      const road = addBox(root, new THREE.BoxGeometry(15, .16, SEG_LEN + .15), roadMat, 0, -.08, 0);
      addBox(root, new THREE.BoxGeometry(5, .22, SEG_LEN), shoulderMat, -10, -.12, 0);
      addBox(root, new THREE.BoxGeometry(5, .22, SEG_LEN), shoulderMat, 10, -.12, 0);
      addBox(root, new THREE.BoxGeometry(.12, .025, SEG_LEN), edgeMat, -7.35, .02, 0);
      addBox(root, new THREE.BoxGeometry(.12, .025, SEG_LEN), edgeMat, 7.35, .02, 0);
      for (let z = -12; z <= 12; z += 8) {
        addBox(root, new THREE.BoxGeometry(.11, .025, 3.4), lineMat, -2.5, .025, z);
        addBox(root, new THREE.BoxGeometry(.11, .025, 3.4), lineMat, 2.5, .025, z);
      }
      if (i % 2 === 0) {
        [-1, 1].forEach(side => {
          const pole = addBox(root, new THREE.CylinderGeometry(.045, .08, 6.5, 6), poleMat, side * 9.1, 3.15, -7);
          const arm = addBox(root, new THREE.BoxGeometry(1.3, .08, .08), poleMat, -side * .6, 3.1, 0);
          addBox(arm, new THREE.BoxGeometry(.55, .08, .24), lampMat, -side * .5, -.05, 0);
          const glow = new THREE.PointLight(0x91eeff, 2.4, 18, 2.2); glow.position.set(-side * .45, -.18, 0); arm.add(glow);
        });
      }
      if (i % 3 !== 1) makeBuilding(root, i % 2 ? -1 : 1, i + 3);
      if (i % 5 === 2) makeBuilding(root, i % 2 ? 1 : -1, i + 17);
      root.position.z = -i * SEG_LEN;
      scene.add(root); segments.push(root);
    }
    for (let i = 0; i < SEG_COUNT; i++) createSegment(i);
    segmentSerial = SEG_COUNT;

    // Distant skyline and moon.
    const moon = new THREE.Mesh(new THREE.CircleGeometry(9, 48), new THREE.MeshBasicMaterial({ color: 0x93b2c2, transparent: true, opacity: .34, fog: false, toneMapped: false }));
    moon.position.set(-42, 36, -360); scene.add(moon);
    const moonHalo = new THREE.Mesh(new THREE.CircleGeometry(17, 48), new THREE.MeshBasicMaterial({ color: 0x659ab2, transparent: true, opacity: .06, fog: false, toneMapped: false }));
    moonHalo.position.set(-42, 36, -361); scene.add(moonHalo);

    // Sparse stars.
    const starPos = [];
    for (let i = 0; i < 450; i++) starPos.push((Math.random() - .5) * 700, 20 + Math.random() * 170, -60 - Math.random() * 650);
    const starsGeo = new THREE.BufferGeometry(); starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xb8d9e8, size: .45, transparent: true, opacity: .58, fog: false, sizeAttenuation: true })));

    // Hood / cockpit foreground.
    const cockpit = new THREE.Group(); camera.add(cockpit); cockpit.position.set(0, -1.05, -2.4);
    const hood = new THREE.Mesh(new THREE.BoxGeometry(3.35, .3, 2.4), new THREE.MeshPhysicalMaterial({ color: 0x071118, metalness: .88, roughness: .17, clearcoat: 1, clearcoatRoughness: .1 }));
    hood.rotation.x = -.055; hood.position.set(0, -.32, .2); cockpit.add(hood);
    addBox(cockpit, new THREE.BoxGeometry(.035, .02, 2.25), new THREE.MeshBasicMaterial({ color: 0x2b6570, toneMapped: false }), 0, -.145, .15);
    const dash = addBox(cockpit, new THREE.BoxGeometry(4.6, .5, .65), new THREE.MeshStandardMaterial({ color: 0x020506, roughness: .55 }), 0, -.64, 1.0);
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(.46, .055, 10, 40), new THREE.MeshStandardMaterial({ color: 0x06090a, roughness: .44, metalness: .45 }));
    wheel.position.set(-.85, -.3, .65); wheel.rotation.x = Math.PI / 2; cockpit.add(wheel);
    const lightL = new THREE.SpotLight(0xb6ecff, 8, 150, .42, .5, 1.4); lightL.position.set(-1.1, -.05, -1); lightL.target.position.set(-2, -1.8, -105); camera.add(lightL, lightL.target);
    const lightR = lightL.clone(); lightR.position.x = 1.1; lightR.target.position.set(2, -1.8, -105); camera.add(lightR, lightR.target);

    // Cars ahead, each with luminous tail lamps.
    const cars = [];
    const carBodyMat = new THREE.MeshPhysicalMaterial({ color: 0x111820, roughness: .24, metalness: .78, clearcoat: .9 });
    function createCar(lane, z, pace) {
      const car = new THREE.Group();
      addBox(car, new THREE.BoxGeometry(2.15, .65, 4.15), carBodyMat, 0, .55, 0);
      addBox(car, new THREE.BoxGeometry(1.75, .58, 1.75), new THREE.MeshPhysicalMaterial({ color: 0x07131a, roughness: .14, metalness: .55, transmission: .15 }), 0, 1.08, -.25);
      [-.68,.68].forEach(x => {
        addBox(car, new THREE.BoxGeometry(.42, .13, .08), redMat, x, .58, 2.09);
        const glow = new THREE.PointLight(0xff142e, 3.2, 8, 2); glow.position.set(x, .6, 2.25); car.add(glow);
      });
      car.position.set(lane * 5, 0, z); car.userData = { pace, lane, phase: Math.random() * 8 };
      scene.add(car); cars.push(car);
    }
    createCar(-1, -105, 0.72); createCar(0, -245, .58); createCar(1, -390, .82); createCar(-1, -520, .67);

    // Rain streaks live in camera space.
    const rainCount = 650, rainData = [];
    const rainVerts = new Float32Array(rainCount * 6);
    for (let i = 0; i < rainCount; i++) rainData.push({ x: (Math.random()-.5)*35, y: Math.random()*16-3, z: -Math.random()*65-2, s: .5+Math.random()*1.5 });
    const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainVerts, 3));
    const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xa7dce6, transparent: true, opacity: .25, depthWrite: false, blending: THREE.AdditiveBlending }));
    camera.add(rain);

    const keys = {};
    let started = false, muted = false, headlights = true, rainActive = true, cinematic = false;
    let speed = 118, targetSpeed = 118, playerX = 0, steer = 0, distance = 0, elapsed = 0;
    let audioCtx, engineOsc, engineGain, noiseGain;

    function startAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sawtooth';
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 150;
      engineGain = audioCtx.createGain(); engineGain.gain.value = .045;
      engineOsc.connect(filter).connect(engineGain).connect(audioCtx.destination); engineOsc.start();
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const data = buffer.getChannelData(0); for (let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buffer; noise.loop = true;
      const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 2600;
      noiseGain = audioCtx.createGain(); noiseGain.gain.value = .011;
      noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination); noise.start();
    }

    document.getElementById('start').addEventListener('click', () => {
      started = true; document.getElementById('intro').classList.add('hidden');
      try { startAudio(); } catch (_) {}
      document.getElementById('flash').animate([{opacity:.7},{opacity:0}], {duration:650, easing:'ease-out'});
    });
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyH') { headlights = !headlights; lightL.visible = lightR.visible = headlights; document.getElementById('light-state').textContent = headlights ? 'ACTIVE' : 'OFF'; }
      if (e.code === 'KeyM') { muted = !muted; if (engineGain) engineGain.gain.setTargetAtTime(muted ? 0 : .045, audioCtx.currentTime, .08); if(noiseGain) noiseGain.gain.setTargetAtTime(muted ? 0 : .011, audioCtx.currentTime, .08); }
      if (e.code === 'KeyR') { rainActive = !rainActive; rain.visible = rainActive; document.getElementById('rain-state').textContent = rainActive ? 'ACTIVE' : 'OFF'; }
      if (e.code === 'KeyC') cinematic = !cinematic;
    });
    addEventListener('keyup', e => keys[e.code] = false);

    const clock = new THREE.Clock();
    function updateRain(dt) {
      const pos = rainGeo.attributes.position.array;
      for (let i=0; i<rainCount; i++) {
        const p = rainData[i]; p.y -= dt * (13 + speed*.045) * p.s; p.z += dt * speed * .045;
        if (p.y < -4 || p.z > 1) { p.y = 12 + Math.random()*5; p.z = -10-Math.random()*60; p.x = (Math.random()-.5)*35; }
        const k=i*6; pos[k]=p.x; pos[k+1]=p.y; pos[k+2]=p.z; pos[k+3]=p.x-.04; pos[k+4]=p.y+.6*p.s; pos[k+5]=p.z-.65*p.s;
      }
      rainGeo.attributes.position.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .045); elapsed += dt;
      if (started) {
        if (keys.KeyW || keys.ArrowUp) targetSpeed += dt * 50;
        else if (keys.KeyS || keys.ArrowDown) targetSpeed -= dt * 70;
        else targetSpeed += (126 - targetSpeed) * dt * .11;
        targetSpeed = THREE.MathUtils.clamp(targetSpeed, 42, 224);
        speed += (targetSpeed - speed) * Math.min(1, dt * 2.4);
      } else speed += (82 - speed) * dt * .7;
      const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;
      const steerTarget = (right ? 1 : 0) - (left ? 1 : 0);
      steer += (steerTarget - steer) * Math.min(1, dt * 6.5);
      playerX = THREE.MathUtils.clamp(playerX + steer * dt * (3.1 + speed*.018), -5.9, 5.9);
      const travel = dt * speed / 3.6;
      distance += travel / 1000;

      segments.forEach(seg => {
        seg.position.z += travel;
        if (seg.position.z > SEG_LEN * 1.5) {
          seg.position.z -= SEG_COUNT * SEG_LEN;
          seg.userData.serial = segmentSerial++;
        }
        const serialFloat = seg.userData.serial - seg.position.z / SEG_LEN - Math.floor(-seg.position.z / SEG_LEN);
        const bend = curveAt(seg.userData.serial);
        const next = curveAt(seg.userData.serial + 1);
        seg.position.x = bend;
        seg.rotation.y = Math.atan2(next - bend, SEG_LEN) * .72;
      });

      cars.forEach(car => {
        car.position.z += travel * (1 - car.userData.pace);
        if (car.position.z > 14) { car.position.z = -520 - Math.random()*240; car.userData.lane = [-1,0,1][Math.floor(Math.random()*3)]; }
        const bend = Math.sin((-car.position.z/SEG_LEN + elapsed*.08) * .19) * 5.2;
        car.position.x = bend + car.userData.lane*5;
        car.position.y = Math.sin(elapsed*2 + car.userData.phase)*.018;
      });

      const roadUnder = curveAt(Math.max(0, segmentSerial - SEG_COUNT));
      const camTargetX = playerX + roadUnder * .08;
      camera.position.x += (camTargetX - camera.position.x) * Math.min(1, dt*3.2);
      const bob = Math.sin(elapsed*7.5)*.007*(speed/120);
      camera.position.y = (cinematic ? 4.3 : 2.25) + bob;
      camera.position.z += ((cinematic ? 11.5 : 7.5) - camera.position.z) * Math.min(1,dt*2.6);
      camera.rotation.z += ((cinematic ? -.015 : -steer*.012) - camera.rotation.z) * Math.min(1,dt*5);
      camera.rotation.x += ((cinematic ? -.07 : -.018) - camera.rotation.x) * Math.min(1,dt*3);
      cockpit.visible = !cinematic;
      wheel.rotation.z = -steer * .48;
      hood.position.x = -camera.position.x*.015;
      moon.position.x = -42 - camera.position.x*.15; moonHalo.position.x = moon.position.x;
      if (rainActive) updateRain(dt);
      if (engineOsc && audioCtx) engineOsc.frequency.setTargetAtTime(32 + speed*.55, audioCtx.currentTime, .08);

      document.getElementById('speed').textContent = Math.round(speed).toString().padStart(3,'0');
      document.getElementById('meter-fill').style.width = `${Math.max(4, (speed-30)/2.05)}%`;
      document.getElementById('gear').textContent = `D${Math.min(7, Math.max(2, Math.floor(speed/32)+1))}`;
      document.getElementById('distance').textContent = `${distance.toFixed(1).padStart(5,'0')} KM`;
      const totalSec = Math.floor(elapsed) + 3*3600 + 17*60 + 42;
      document.getElementById('clock').textContent = [Math.floor(totalSec/3600)%24,Math.floor(totalSec/60)%60,totalSec%60].map(v=>String(v).padStart(2,'0')).join(':');
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    });
    document.addEventListener('visibilitychange', () => { if (audioCtx) document.hidden ? audioCtx.suspend() : audioCtx.resume(); });
  </script>
</body>
</html>
