<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060b">
  <title>Infinite // Maze</title>
  <style>
    :root{color-scheme:dark;--cyan:#7cf8ff;--violet:#a687ff;--ink:#06070c;--muted:#8c9caf}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{isolation:isolate}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#06070c}
    .grain{position:fixed;inset:-50%;pointer-events:none;opacity:.045;z-index:3;background-image:repeating-radial-gradient(circle at 23% 37%,#fff 0 1px,transparent 1px 5px),repeating-radial-gradient(circle at 71% 64%,#fff 0 1px,transparent 1px 7px);background-size:17px 19px,23px 29px;animation:grain .24s steps(2) infinite}
    @keyframes grain{0%{transform:translate3d(-2%,1%,0)}25%{transform:translate3d(2%,-3%,0)}50%{transform:translate3d(3%,2%,0)}75%{transform:translate3d(-3%,-1%,0)}100%{transform:translate3d(1%,3%,0)}}
    .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle at 50% 51%,transparent 32%,rgba(0,0,0,.15) 58%,rgba(0,0,0,.8) 120%);box-shadow:inset 0 0 11vw rgba(0,0,0,.58)}
    .hud{position:fixed;inset:0;z-index:4;pointer-events:none;color:#eafcff;padding:clamp(18px,3.2vw,52px);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto}
    .brand{align-self:start}
    .eyebrow{display:flex;align-items:center;gap:9px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase;margin-bottom:12px}
    .eyebrow:before{content:"";width:29px;height:1px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
    h1{font-size:clamp(28px,4.2vw,66px);line-height:.84;letter-spacing:-.065em;margin:0;font-weight:760;text-transform:uppercase;text-shadow:0 4px 30px #000}
    h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(231,252,255,.52);font-weight:260;letter-spacing:.01em}
    .telemetry{align-self:start;text-align:right;border-right:1px solid rgba(124,248,255,.45);padding-right:13px;min-width:150px}
    .label{font:600 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .metric{font:400 clamp(18px,2vw,26px)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;margin:5px 0 16px;text-shadow:0 0 16px rgba(124,248,255,.35)}
    .footer{grid-column:1/-1;display:flex;align-items:end;justify-content:space-between;gap:24px}
    .journey{max-width:330px}
    .status{font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#c8faff;text-transform:uppercase;margin-bottom:10px}
    .status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);margin-right:9px;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
    .bar{width:min(300px,42vw);height:2px;background:rgba(255,255,255,.13);overflow:hidden}
    .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .3s ease}
    .hint{margin-top:10px;font-size:11px;line-height:1.5;letter-spacing:.02em;color:#8e9caa}
    .map-shell{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
    #map{position:relative!important;inset:auto!important;width:clamp(92px,11vw,148px)!important;height:clamp(92px,11vw,148px)!important;border:1px solid rgba(154,180,197,.22);background:rgba(3,5,9,.55);box-shadow:0 12px 40px rgba(0,0,0,.36);backdrop-filter:blur(6px)}
    .map-copy{font:500 9px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;color:#768797;padding-bottom:1px}
    .map-copy strong{display:block;color:#d8fbff;font-size:10px;font-weight:600}
    .scanline{position:fixed;z-index:3;left:0;right:0;height:1px;top:0;background:linear-gradient(90deg,transparent,rgba(124,248,255,.42),transparent);opacity:.3;pointer-events:none;animation:scan 8s linear infinite}
    @keyframes scan{to{transform:translateY(100vh)}}
    .iris{position:fixed;z-index:5;inset:0;pointer-events:none;background:#c8fbff;opacity:0;mix-blend-mode:screen}
    .iris.flash{animation:flash 1.4s ease-out}
    @keyframes flash{0%{opacity:.72}20%{opacity:.14}100%{opacity:0}}
    @media(max-width:640px){.hud{padding:19px}.telemetry{min-width:108px}.telemetry .metric:nth-of-type(n+2),.telemetry .label:nth-of-type(n+2){display:none}.hint,.map-copy{display:none}.footer{align-items:end}.bar{width:45vw}#map{width:86px!important;height:86px!important}h1{font-size:33px}}
    @media(prefers-reduced-motion:reduce){.grain,.scanline,.status i{animation:none}}
  </style>
</head>
<body>
  <canvas id="view" aria-label="An automatically navigating first-person infinite maze"></canvas>
  <div class="vignette"></div><div class="grain"></div><div class="scanline"></div><div class="iris" id="iris"></div>
  <main class="hud" aria-live="polite">
    <header class="brand"><div class="eyebrow">Autonomous passage</div><h1>Infinite <span>Maze</span></h1></header>
    <aside class="telemetry">
      <div class="label">Sector</div><div class="metric" id="sector">001</div>
      <div class="label">Distance</div><div class="metric" id="distance">0000 m</div>
      <div class="label">Bearing</div><div class="metric" id="bearing">000°</div>
    </aside>
    <footer class="footer">
      <section class="journey"><div class="status"><i></i><span id="status">Calculating route</span></div><div class="bar"><b id="progress"></b></div><div class="hint">No controls. The navigator finds every exit and continues.</div></section>
      <section class="map-shell"><canvas id="map" aria-label="Live maze route map"></canvas><div class="map-copy">Route model<strong>Recursive backtrack</strong>Signal<strong id="signal">Nominal / 100%</strong></div></section>
    </footer>
  </main>
  <script>
  (()=>{
    'use strict';
    /* A compact, embedded Three-style scene runtime keeps this single-file journey fully offline. */
    const THREE={
      MathUtils:{clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),lerp:(a,b,t)=>a+(b-a)*t,radToDeg:r=>r*180/Math.PI},
      Vector2:class{constructor(x=0,y=0){this.x=x;this.y=y}set(x,y){this.x=x;this.y=y;return this}distanceTo(v){return Math.hypot(this.x-v.x,this.y-v.y)}},
      Clock:class{constructor(){this.t=performance.now()}getDelta(){const n=performance.now(),d=Math.min(.05,(n-this.t)/1000);this.t=n;return d}},
      PerspectiveCamera:class{constructor(fov=68){this.fov=fov;this.position=new THREE.Vector2();this.rotation=0}},
      Scene:class{constructor(){this.grid=[];this.route=[];this.sector=1}},
      WebGLRenderer:class{constructor({canvas}){this.domElement=canvas;this.ctx=canvas.getContext('2d',{alpha:false});this.pixelRatio=Math.min(devicePixelRatio||1,1.35)}setSize(w,h){this.domElement.width=Math.floor(w*this.pixelRatio);this.domElement.height=Math.floor(h*this.pixelRatio);this.domElement.style.width=w+'px';this.domElement.style.height=h+'px'}}
    };

    const view=document.querySelector('#view'),map=document.querySelector('#map');
    const renderer=new THREE.WebGLRenderer({canvas:view}),ctx=renderer.ctx,mctx=map.getContext('2d');
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(67),clock=new THREE.Clock();
    const ui={sector:document.querySelector('#sector'),distance:document.querySelector('#distance'),bearing:document.querySelector('#bearing'),status:document.querySelector('#status'),progress:document.querySelector('#progress'),signal:document.querySelector('#signal'),iris:document.querySelector('#iris')};
    const SIZE=31,FOV=Math.PI/3.15,MAX_DEPTH=22;
    let rng=Math.random,route=[],routeIndex=0,totalDistance=0,travel=0,nextSector=false;
    let px=1.5,py=1.5,angle=0,targetAngle=0,turning=false,bob=0,lastHud=0;

    function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function makeMaze(sector){
      rng=seeded(0x41c6ce57^(sector*0x9e3779b9));
      const g=Array.from({length:SIZE},()=>Array(SIZE).fill(1)),stack=[[1,1]];g[1][1]=0;
      while(stack.length){const [x,y]=stack[stack.length-1],dirs=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>x+dx>0&&y+dy>0&&x+dx<SIZE-1&&y+dy<SIZE-1&&g[y+dy][x+dx]);if(!dirs.length){stack.pop();continue}const [dx,dy]=dirs[Math.floor(rng()*dirs.length)];g[y+dy/2][x+dx/2]=0;g[y+dy][x+dx]=0;stack.push([x+dx,y+dy])}
      const bfs=(start)=>{const q=[start],seen=new Map([[start.join(','),null]]);let far=start;for(let i=0;i<q.length;i++){const p=q[i];far=p;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[p[0]+dx,p[1]+dy],k=n.join(',');if(g[n[1]]?.[n[0]]===0&&!seen.has(k)){seen.set(k,p);q.push(n)}}}return{far,seen}};
      const search=bfs([1,1]),exit=search.far,path=[];let cur=exit;while(cur){path.push([cur[0]+.5,cur[1]+.5]);cur=search.seen.get(cur.join(','))}path.reverse();
      scene.grid=g;scene.route=path;scene.sector=sector;route=path;routeIndex=1;px=route[0][0];py=route[0][1];camera.position.set(px,py);targetAngle=angle=Math.atan2(route[1][1]-py,route[1][0]-px);travel=0;nextSector=false;
      ui.sector.textContent=String(sector).padStart(3,'0');ui.status.textContent='Route locked · '+path.length+' nodes';ui.progress.style.width='0%';ui.iris.classList.remove('flash');void ui.iris.offsetWidth;ui.iris.classList.add('flash');
    }

    function resize(){renderer.setSize(innerWidth,innerHeight);const s=Math.floor(Math.min(150,Math.max(86,innerWidth*.11))*(devicePixelRatio||1));map.width=s;map.height=s}
    addEventListener('resize',resize,{passive:true});resize();

    function update(dt){
      if(nextSector)return;
      const target=route[routeIndex];if(!target){nextSector=true;ui.status.textContent='Threshold crossed · remapping';setTimeout(()=>makeMaze(scene.sector+1),900);return}
      const dx=target[0]-px,dy=target[1]-py,dist=Math.hypot(dx,dy),desired=Math.atan2(dy,dx);let diff=Math.atan2(Math.sin(desired-angle),Math.cos(desired-angle));
      turning=Math.abs(diff)>.055;targetAngle=desired;angle+=diff*Math.min(1,dt*(turning?4.1:7.5));
      const speed=(turning?0.72:1.32)*dt,step=Math.min(speed,dist);px+=Math.cos(desired)*step;py+=Math.sin(desired)*step;totalDistance+=step;travel+=step;bob+=step*4.8;camera.position.set(px,py);camera.rotation=angle;
      if(dist<.035)routeIndex++;
    }

    function wallAt(x,y){return scene.grid[Math.floor(y)]?.[Math.floor(x)]??1}
    function cast(rayAngle){
      const dirX=Math.cos(rayAngle),dirY=Math.sin(rayAngle);let mapX=Math.floor(px),mapY=Math.floor(py);const deltaX=Math.abs(1/(dirX||1e-9)),deltaY=Math.abs(1/(dirY||1e-9));let stepX,stepY,sideX,sideY;
      if(dirX<0){stepX=-1;sideX=(px-mapX)*deltaX}else{stepX=1;sideX=(mapX+1-px)*deltaX}
      if(dirY<0){stepY=-1;sideY=(py-mapY)*deltaY}else{stepY=1;sideY=(mapY+1-py)*deltaY}
      let side=0;for(let n=0;n<64;n++){if(sideX<sideY){sideX+=deltaX;mapX+=stepX;side=0}else{sideY+=deltaY;mapY+=stepY;side=1}if(scene.grid[mapY]?.[mapX])break}
      const distance=side===0?(mapX-px+(1-stepX)/2)/(dirX||1e-9):(mapY-py+(1-stepY)/2)/(dirY||1e-9);const hit=side===0?py+distance*dirY:px+distance*dirX;return{d:Math.abs(distance),side,tex:hit-Math.floor(hit),mx:mapX,my:mapY}
    }

    function render(){
      const w=view.width,h=view.height,horizon=h*(.5+Math.sin(bob)*.004),grad=ctx.createLinearGradient(0,0,0,horizon);grad.addColorStop(0,'#03040a');grad.addColorStop(.65,'#101225');grad.addColorStop(1,'#252243');ctx.fillStyle=grad;ctx.fillRect(0,0,w,horizon);
      const floor=ctx.createLinearGradient(0,horizon,0,h);floor.addColorStop(0,'#15162b');floor.addColorStop(.22,'#0b0d19');floor.addColorStop(1,'#020306');ctx.fillStyle=floor;ctx.fillRect(0,horizon,w,h-horizon);
      ctx.globalAlpha=.16;ctx.strokeStyle='#92dce7';ctx.lineWidth=1;for(let i=1;i<13;i++){const y=horizon+(h-horizon)*(1-1/(1+i*.29));ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.globalAlpha=1;
      const stripe=Math.max(2,Math.floor(renderer.pixelRatio*2)),proj=h*.78;for(let x=0;x<w;x+=stripe){const camX=x/w-.5,ray=angle+camX*FOV,hit=cast(ray),corrected=hit.d*Math.cos(ray-angle),wallH=Math.min(h*1.55,proj/Math.max(.08,corrected)),top=horizon-wallH/2,bottom=top+wallH,fog=THREE.MathUtils.clamp(1-corrected/MAX_DEPTH,0,1),edge=Math.min(hit.tex,1-hit.tex),mortar=edge<.025||Math.abs((hit.tex*5)%1)<.055;let hue=(scene.sector*37+hit.mx*7+hit.my*3)%52+188,sat=hit.side?37:51,light=(hit.side?31:39)*fog+4;if(mortar)light*=.45;ctx.fillStyle=`hsl(${hue} ${sat}% ${light}%)`;ctx.fillRect(x,top,stripe+1,wallH);
        if(fog>.28){ctx.globalAlpha=fog*.18;ctx.fillStyle=hit.side?'#8577ff':'#7cf8ff';ctx.fillRect(x,top,stripe,Math.max(1,renderer.pixelRatio));ctx.globalAlpha=1}
      }
      const glow=ctx.createLinearGradient(0,horizon-h*.03,0,horizon+h*.18);glow.addColorStop(0,'rgba(125,242,255,.12)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,horizon-h*.03,w,h*.25);
    }

    function drawMap(){
      const w=map.width,h=map.height,scale=w/(SIZE+2),ox=scale,oy=scale;mctx.clearRect(0,0,w,h);mctx.fillStyle='rgba(4,7,12,.94)';mctx.fillRect(0,0,w,h);mctx.fillStyle='rgba(124,248,255,.12)';for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(scene.grid[y][x])mctx.fillRect(ox+x*scale,oy+y*scale,Math.ceil(scale),Math.ceil(scale));mctx.strokeStyle='rgba(166,135,255,.55)';mctx.lineWidth=Math.max(1,scale*.28);mctx.beginPath();for(let i=0;i<route.length;i++){const [x,y]=route[i],sx=ox+x*scale,sy=oy+y*scale;i?mctx.lineTo(sx,sy):mctx.moveTo(sx,sy)}mctx.stroke();mctx.fillStyle='#7cf8ff';mctx.shadowColor='#7cf8ff';mctx.shadowBlur=scale*3;mctx.beginPath();mctx.arc(ox+px*scale,oy+py*scale,Math.max(2,scale*.48),0,Math.PI*2);mctx.fill();mctx.shadowBlur=0;mctx.strokeStyle='rgba(124,248,255,.8)';mctx.beginPath();mctx.moveTo(ox+px*scale,oy+py*scale);mctx.lineTo(ox+(px+Math.cos(angle)*1.5)*scale,oy+(py+Math.sin(angle)*1.5)*scale);mctx.stroke()}

    function hud(now){if(now-lastHud<110)return;lastHud=now;const deg=(THREE.MathUtils.radToDeg(angle)+360)%360;ui.distance.textContent=String(Math.floor(totalDistance*2.4)).padStart(4,'0')+' m';ui.bearing.textContent=String(Math.round(deg)).padStart(3,'0')+'°';ui.progress.style.width=Math.min(100,routeIndex/route.length*100).toFixed(1)+'%';ui.signal.textContent=turning?'Turn solve / '+Math.max(78,100-Math.round(Math.abs(Math.atan2(Math.sin(targetAngle-angle),Math.cos(targetAngle-angle)))*9))+'%':'Nominal / 100%'}
    function loop(now){const dt=clock.getDelta();update(dt);render();drawMap();hud(now);requestAnimationFrame(loop)}
    makeMaze(1);requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
