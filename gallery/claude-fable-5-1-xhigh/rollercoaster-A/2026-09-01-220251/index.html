<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Coaster</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: #f4f7fb; }
  canvas { display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
  .hud { position: fixed; pointer-events: none; user-select: none; }
  #title { left: 20px; top: 18px; }
  #title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.9; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  #title p { margin: 4px 0 0; font-size: 12px; opacity: 0.7; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  #stats { left: 20px; bottom: 20px; display: flex; gap: 10px; }
  .tile { background: rgba(8, 14, 28, 0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 8px 12px; min-width: 78px; backdrop-filter: blur(6px); }
  .tile .k { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile .u { font-size: 11px; opacity: 0.6; margin-left: 3px; font-weight: 400; }
  #gbar { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
  #gfill { height: 100%; width: 25%; background: #ffd166; transition: width 0.15s linear; }
  #controls { right: 20px; bottom: 20px; display: flex; gap: 8px; pointer-events: auto; }
  button { pointer-events: auto; cursor: pointer; font: inherit; font-size: 12px; letter-spacing: 0.04em; color: #f4f7fb; background: rgba(8, 14, 28, 0.6); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 9px 14px; backdrop-filter: blur(6px); }
  button:hover { background: rgba(30, 44, 74, 0.75); }
  #section { right: 20px; top: 18px; text-align: right; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  #paused { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; padding: 12px 22px; border-radius: 12px; background: rgba(8,14,28,0.6); border: 1px solid rgba(255,255,255,0.2); display: none; }
  #error { left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 420px; text-align: center; font-size: 14px; line-height: 1.5; display: none; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="title" class="hud"><h1>Skyline Coaster</h1><p>First-person ride, continuous playback</p></div>
<div id="section" class="hud">Station</div>
<div id="stats" class="hud">
  <div class="tile"><div class="k">Speed</div><div class="v"><span id="spd">0</span><span class="u">km/h</span></div></div>
  <div class="tile" style="position:relative"><div class="k">Vertical G</div><div class="v"><span id="gv">1.0</span><span class="u">g</span></div><div id="gbar"><div id="gfill"></div></div></div>
  <div class="tile"><div class="k">Height</div><div class="v"><span id="alt">0</span><span class="u">m</span></div></div>
  <div class="tile"><div class="k">Lap</div><div class="v"><span id="lap">1</span></div></div>
</div>
<div id="controls" class="hud">
  <button id="soundBtn" type="button">Sound: off</button>
  <button id="pauseBtn" type="button">Pause</button>
</div>
<div id="paused" class="hud">Paused</div>
<div id="error" class="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var errBox = document.getElementById('error');
  function fail(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
  if (typeof THREE === 'undefined') { fail('Three.js failed to load. Check your internet connection and reload the page.'); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) { fail('WebGL is not available in this browser, so the ride cannot render.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.getElementById('vignette'));

  var G = 9.81;
  var WORLD_UP = new THREE.Vector3(0, 1, 0);
  function col(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function smoothstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(col(0xcfdfee), 140, 720);
  var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 1500);

  // Sky dome with a gradient and a sun disc.
  var sunDir = new THREE.Vector3(0.45, 0.55, 0.35).normalize();
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(1000, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { sunDir: { value: sunDir } },
      vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'varying vec3 vDir; uniform vec3 sunDir;',
        'void main(){',
        '  vec3 d = normalize(vDir); float h = d.y;',
        '  vec3 zenith = vec3(0.16, 0.42, 0.82); vec3 horizon = vec3(0.81, 0.87, 0.93); vec3 ground = vec3(0.62, 0.70, 0.74);',
        '  vec3 c = h > 0.0 ? mix(horizon, zenith, pow(h, 0.55)) : mix(horizon, ground, clamp(-h * 6.0, 0.0, 1.0));',
        '  float s = max(dot(d, sunDir), 0.0);',
        '  c += vec3(1.0, 0.93, 0.78) * (smoothstep(0.9989, 0.9996, s) + 0.14 * pow(s, 10.0) + 0.05 * pow(s, 2.0));',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'].join('\n')
    })
  );
  scene.add(sky);

  // Lighting.
  scene.add(new THREE.HemisphereLight(col(0xbfd7ff), col(0x5c7a3a), 0.7));
  var sun = new THREE.DirectionalLight(col(0xfff1d6), 1.35);
  sun.position.copy(sunDir).multiplyScalar(320).add(new THREE.Vector3(-15, 0, 40));
  sun.target.position.set(-15, 0, 40);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -175; sun.shadow.camera.right = 175;
  sun.shadow.camera.top = 175; sun.shadow.camera.bottom = -175;
  sun.shadow.camera.near = 50; sun.shadow.camera.far = 650;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);

  // Ground with a procedural grass texture.
  function grassTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#5f8f3e'; ctx.fillRect(0, 0, 256, 256);
    for (var i = 0; i < 9000; i++) {
      var g = 120 + Math.floor(Math.random() * 60), r = 70 + Math.floor(Math.random() * 40), b = 40 + Math.floor(Math.random() * 30);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 1 + Math.random() * 2);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(140, 140);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);

  // Distant hills, clouds, and a station platform are added after the track exists.

  // ---------------------------------------------------------------------------
  // Track layout (metres). Station and lift run east along z = 18, then a first
  // drop, a banked 180-degree turn, a camelback, a teardrop vertical loop, a
  // floater hill, a banked return turn and the brake run back into the station.
  // ---------------------------------------------------------------------------
  var raw = [], sectionStarts = [], deg = Math.PI / 180;
  function section(name) { sectionStarts.push([raw.length, name]); }
  function add(list) { list.forEach(function (p) { raw.push(p); }); }
  function last() { return raw[raw.length - 1]; }
  // Vertical profile builder: arcs and straights in the x-y plane, travelling
  // along x in direction dir. Heading 0 is level; a positive arc pitches up.
  // The composite curve is sampled at uniform spacing so the spline follows
  // the design closely, and radii step gradually to avoid curvature overshoot.
  // Sideways drift from z0 to z1 is eased so sections join without a kink.
  function profile(x, y, z0, z1, dir, ops, step) {
    var segs = [], th = 0, total = 0, i;
    ops.forEach(function (op) {
      var len = op[0] === 'line' ? op[1] : Math.abs(op[2]) * deg * op[1];
      segs.push({ op: op, x: x, y: y, th: th, start: total, len: len });
      total += len;
      if (op[0] === 'line') { x += dir * Math.cos(th) * op[1]; y += Math.sin(th) * op[1]; }
      else {
        var R = op[1], sg = op[2] > 0 ? 1 : -1, cx = x - sg * dir * R * Math.sin(th), cy = y + sg * R * Math.cos(th);
        th += op[2] * deg; x = cx + sg * dir * R * Math.sin(th); y = cy - sg * R * Math.cos(th);
      }
    });
    var n = Math.max(2, Math.round(total / (step || 4))), out = [], si = 0;
    for (i = 1; i <= n; i++) {
      var d = total * i / n;
      while (si < segs.length - 1 && d > segs[si].start + segs[si].len + 1e-9) si++;
      var sgm = segs[si], t = d - sgm.start, op = sgm.op, px, py;
      if (op[0] === 'line') { px = sgm.x + dir * Math.cos(sgm.th) * t; py = sgm.y + Math.sin(sgm.th) * t; }
      else {
        var r = op[1], s2 = op[2] > 0 ? 1 : -1, an = sgm.th + s2 * t / r;
        px = sgm.x - s2 * dir * r * Math.sin(sgm.th) + s2 * dir * r * Math.sin(an);
        py = sgm.y + s2 * r * Math.cos(sgm.th) - s2 * r * Math.cos(an);
      }
      out.push([px, py, z0 + (z1 - z0) * (1 - Math.cos(Math.PI * i / n)) / 2]);
    }
    return out;
  }
  // Plan builder: arcs in the x-z plane with a compass heading h in degrees
  // (0 = +x, 90 = +z), sampled uniformly. Returns [x, z] points.
  function plan(x, z, h, ops) {
    var segs = [], total = 0, i;
    h *= deg;
    ops.forEach(function (op) {
      var R = op[0], sg = op[1] > 0 ? 1 : -1, len = Math.abs(op[1]) * deg * R;
      segs.push({ R: R, sg: sg, x: x, z: z, h: h, start: total, len: len });
      total += len;
      var cx = x - sg * R * Math.sin(h), cz = z + sg * R * Math.cos(h);
      h += op[1] * deg; x = cx + sg * R * Math.sin(h); z = cz - sg * R * Math.cos(h);
    });
    var n = Math.max(2, Math.round(total / 4)), out = [], si = 0;
    for (i = 1; i <= n; i++) {
      var d = total * i / n;
      while (si < segs.length - 1 && d > segs[si].start + segs[si].len + 1e-9) si++;
      var sgm = segs[si], an = sgm.h + sgm.sg * (d - sgm.start) / sgm.R;
      out.push([sgm.x - sgm.sg * sgm.R * Math.sin(sgm.h) + sgm.sg * sgm.R * Math.sin(an), sgm.z + sgm.sg * sgm.R * Math.cos(sgm.h) - sgm.sg * sgm.R * Math.cos(an)]);
    }
    return out;
  }
  function withHeights(xz, yFn) { return xz.map(function (q, k) { return [q[0], yFn(k / (xz.length - 1)), q[1]]; }); }
  // A 180-degree turn with easing arcs of four and two times the core radius
  // at each end, sized so it spans exactly `span` metres sideways.
  function turnOps(span) {
    var seq = [[4, 5], [2, 10], [1, 150], [2, 10], [4, 5]], th = 0, k = 0;
    seq.forEach(function (e) { k += e[0] * (Math.cos(th * deg) - Math.cos((th + e[1]) * deg)); th += e[1]; });
    var R = span / k;
    return seq.map(function (e) { return [e[0] * R, e[1]]; });
  }

  section('Station');   add([[-70, 3, 18], [-52, 3, 18]]);
  section('Lift hill'); add([[-36, 4.5, 18], [-18, 17, 18], [2, 32, 18], [20, 44, 18], [32, 48, 18]]);
  // First drop: crest, 55-degree straight and a 40 m pull-out (about 3.3 g).
  section('First drop');
  add(profile(32, 48, 18, 18, 1, [['arc', 60, -10], ['arc', 30, -45], ['line', 10.3], ['arc', 80, 10], ['arc', 40, 45]]));
  var dropEnd = last(), base = dropEnd[1];
  // Banked 180-degree turn (38 m radius) rising 6 m through the apex.
  section('Banked turn');
  add(withHeights(plan(dropEnd[0], dropEnd[2], 0, turnOps(77)), function (f) { return base + 3 * (1 - Math.cos(Math.PI * 2 * f)); }));
  var turnEnd = last();
  // Camelback: 40 m valleys, 45-degree ramps and a 21 m crest for airtime.
  section('Camelback');
  var valleyIn = [['arc', 70, 10], ['arc', 40, 25], ['arc', 70, 10]], valleyOut = [['arc', 70, 10], ['arc', 40, 25], ['arc', 70, 10]];
  var crest = [['arc', 60, -10], ['arc', 32, -15], ['arc', 21, -40], ['arc', 32, -15], ['arc', 60, -10]];
  var loopEntryX = -20, probe = profile(turnEnd[0], base, 0, 0, -1, valleyIn.concat(crest, valleyOut));
  var ramp = (probe[probe.length - 1][0] - loopEntryX) / Math.SQRT2;
  add(profile(turnEnd[0], base, turnEnd[2], 88, -1, valleyIn.concat([['line', ramp]], crest, [['line', ramp]], valleyOut)));
  // Teardrop loop: 26 m legs crossing at the base, 15 m sides, 7.5 m top,
  // drifting 6 m sideways so the exit leg passes beside the entry leg.
  var loopStart = last();
  section('Vertical loop');
  add(profile(loopStart[0], loopStart[1], 88, 82, -1, [['arc', 26, 45], ['arc', 20, 15], ['arc', 15, 45], ['arc', 10, 15], ['arc', 7.5, 120], ['arc', 10, 15], ['arc', 15, 45], ['arc', 20, 15], ['arc', 26, 45]], 3));
  var loopEnd = last();
  // Floater hill: raised-cosine bump 3.6 m tall over 55 m (about -0.5 g).
  section('Floater hill');
  for (var k = 0; k <= 11; k++) raw.push([loopEnd[0] - 6 - 5 * k, loopEnd[1] + 1.8 * (1 - Math.cos(Math.PI * 2 * k / 11)), 82 - 5 * (1 - Math.cos(Math.PI * k / 11)) / 2]);
  // Banked return turn descending into the brake run, ending on the station line z = 18.
  var hillEnd = last();
  section('Final turn');
  add(withHeights(plan(hillEnd[0], hillEnd[2], 180, turnOps(hillEnd[2] - 18)), function (f) { return loopEnd[1] + 1.5 * (1 - Math.cos(Math.PI * 2 * f)) - (loopEnd[1] - 3.5) * (1 - Math.cos(Math.PI * f)) / 2; }));
  section('Brake run'); add([[-84, 3, 18]]);

  var pts = raw.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });
  var curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
  curve.arcLengthDivisions = 6000;
  var L = curve.getLength();
  var lens = curve.getLengths(6000);
  var sectionTable = sectionStarts.map(function (e) { return { s: lens[Math.round(e[0] / pts.length * 6000)], name: e[1] }; });

  // Dense arc-length sampling of the centreline.
  var N = 2600, ds = L / N;
  var P = new Array(N), T = new Array(N), H = new Float32Array(N);
  for (var i = 0; i < N; i++) {
    var u = i / N;
    P[i] = curve.getPointAt(u);
    T[i] = curve.getTangentAt(u).normalize();
    H[i] = P[i].y;
  }

  // Speed profile: chain lift at constant speed, then energy conservation with
  // rolling losses, then magnetic brakes before the station.
  var vStation = 3, vLift = 4.5, mu = 0.012, vMin = 4;
  var iCrest = 0;
  for (i = 1; i < N * 0.4; i++) if (H[i] > H[iCrest]) iCrest = i;
  var sCrest = iCrest * ds, E0 = H[iCrest] + vLift * vLift / (2 * G);
  var V = new Float32Array(N);
  for (i = 0; i < N; i++) {
    var s = i * ds;
    if (i <= iCrest) V[i] = s < 22 ? vStation : (s < 40 ? vStation + (vLift - vStation) * (s - 22) / 18 : vLift);
    else V[i] = Math.sqrt(Math.max(vMin * vMin, 2 * G * (E0 - mu * (s - sCrest) - H[i])));
  }
  var brakeLen = 45, iBrake = Math.floor((L - brakeLen) / ds), vBrake0 = V[iBrake];
  for (i = iBrake; i < N; i++) {
    var ub = clamp((i - iBrake) * ds / brakeLen, 0, 1);
    V[i] = Math.min(V[i], Math.max(vStation, vBrake0 + (vStation - vBrake0) * ub));
  }
  var lapTime = 0; for (i = 0; i < N; i++) lapTime += ds / V[i];

  // Curvature vector (kappa * normal) by central differences of the unit tangent.
  var KN = new Array(N);
  for (i = 0; i < N; i++) KN[i] = T[(i + 1) % N].clone().sub(T[(i + N - 1) % N]).multiplyScalar(1 / (2 * ds));

  function signedAngle(a, b, axis) { return Math.atan2(new THREE.Vector3().crossVectors(a, b).dot(axis), a.dot(b)); }
  function smoothCyclic(src, tau) {
    var a = ds / (tau + ds), n = src.length, out = new Float32Array(n), st = 0, j;
    for (j = 0; j < n; j++) st += a * (src[j] - st);
    for (j = 0; j < n; j++) { st += a * (src[j] - st); out[j] = st; }
    st = out[n - 1];
    for (j = n - 1; j >= 0; j--) st += a * (out[j] - st);
    for (j = n - 1; j >= 0; j--) { st += a * (out[j] - st); out[j] = st; }
    return out;
  }

  // 1) Rotation-minimising frames by parallel transport, closed around the loop.
  var NRM = new Array(N), tmp = new THREE.Vector3();
  NRM[0] = WORLD_UP.clone().addScaledVector(T[0], -WORLD_UP.dot(T[0])).normalize();
  for (i = 1; i < N; i++) NRM[i] = NRM[i - 1].clone().addScaledVector(T[i], -NRM[i - 1].dot(T[i])).normalize();
  var nEnd = NRM[N - 1].clone().addScaledVector(T[0], -NRM[N - 1].dot(T[0])).normalize();
  var holonomy = signedAngle(nEnd, NRM[0], T[0]);
  for (i = 0; i < N; i++) NRM[i].applyAxisAngle(T[i], holonomy * i / N);

  // 2) Level the frame against gravity wherever the track is not near vertical,
  //    so straights and turns start level while the loop keeps its inversion.
  var psi = new Float32Array(N);
  for (i = 0; i < N; i++) {
    tmp.copy(WORLD_UP).addScaledVector(T[i], -WORLD_UP.dot(T[i]));
    var pl = tmp.length();
    if (pl < 1e-4) { psi[i] = 0; continue; }
    tmp.divideScalar(pl);
    var d = NRM[i].dot(tmp);
    if (d < 0) tmp.negate();
    psi[i] = smoothstep(0.12, 0.45, pl) * smoothstep(0.05, 0.3, Math.abs(d)) * signedAngle(NRM[i], tmp, T[i]);
  }
  psi = smoothCyclic(psi, 4);
  for (i = 0; i < N; i++) NRM[i].applyAxisAngle(T[i], psi[i]);

  // 3) Bank the track so the seat pushes along the combined gravity and
  //    centripetal force, then smooth the roll along the track.
  var phi = new Float32Array(N), F = new Array(N), gUp = new THREE.Vector3(0, G, 0);
  for (i = 0; i < N; i++) {
    F[i] = KN[i].clone().multiplyScalar(V[i] * V[i]).add(gUp);
    var right = new THREE.Vector3().crossVectors(T[i], NRM[i]);
    phi[i] = clamp(Math.atan2(F[i].dot(right), Math.max(F[i].dot(NRM[i]), 4)), -1.35, 1.35);
  }
  phi = smoothCyclic(phi, 3);
  var UP = new Array(N), RIGHT = new Array(N), GV = new Float32Array(N), GL = new Float32Array(N);
  for (i = 0; i < N; i++) {
    UP[i] = NRM[i].clone().applyAxisAngle(T[i], phi[i]).normalize();
    RIGHT[i] = new THREE.Vector3().crossVectors(T[i], UP[i]).normalize();
    GV[i] = F[i].dot(UP[i]) / G;
    GL[i] = F[i].dot(RIGHT[i]) / G;
  }

  // Interpolated frame lookup at arc length s.
  function Frame() { this.pos = new THREE.Vector3(); this.T = new THREE.Vector3(); this.up = new THREE.Vector3(); this.right = new THREE.Vector3(); this.v = 0; this.gv = 1; this.gl = 0; }
  function frameAt(s, out) {
    s = ((s % L) + L) % L;
    var x = s / ds, i0 = Math.floor(x) % N, i1 = (i0 + 1) % N, t = x - Math.floor(x);
    out.pos.copy(P[i0]).lerp(P[i1], t);
    out.T.copy(T[i0]).lerp(T[i1], t).normalize();
    out.up.copy(UP[i0]).lerp(UP[i1], t).normalize();
    out.right.crossVectors(out.T, out.up).normalize();
    out.v = V[i0] + (V[i1] - V[i0]) * t;
    out.gv = GV[i0] + (GV[i1] - GV[i0]) * t;
    out.gl = GL[i0] + (GL[i1] - GL[i0]) * t;
    return out;
  }
  function sectionName(s) {
    var name = sectionTable[0].name;
    for (var j = 0; j < sectionTable.length; j++) if (s >= sectionTable[j].s) name = sectionTable[j].name;
    return name;
  }

  // ---------------------------------------------------------------------------
  // Track geometry: two rails, a box spine, crossties and supports.
  // ---------------------------------------------------------------------------
  function buildTube(offsetR, offsetU, radius, radial) {
    var pos = new Float32Array(N * radial * 3), idx = [];
    var c = new THREE.Vector3(), q = new THREE.Vector3(), i, j;
    for (i = 0; i < N; i++) {
      c.copy(P[i]).addScaledVector(RIGHT[i], offsetR).addScaledVector(UP[i], offsetU);
      for (j = 0; j < radial; j++) {
        var a = j / radial * Math.PI * 2;
        q.copy(c).addScaledVector(RIGHT[i], Math.cos(a) * radius).addScaledVector(UP[i], Math.sin(a) * radius);
        var o = (i * radial + j) * 3; pos[o] = q.x; pos[o + 1] = q.y; pos[o + 2] = q.z;
      }
    }
    for (i = 0; i < N; i++) {
      var i1 = (i + 1) % N;
      for (j = 0; j < radial; j++) {
        var j1 = (j + 1) % radial, a0 = i * radial + j, a1 = i * radial + j1, b0 = i1 * radial + j, b1 = i1 * radial + j1;
        idx.push(a0, b0, b1, a0, b1, a1);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  var railMat = new THREE.MeshStandardMaterial({ color: col(0xd6dde6), metalness: 0.75, roughness: 0.32 });
  var spineMat = new THREE.MeshStandardMaterial({ color: col(0x1d4e9a), metalness: 0.25, roughness: 0.55 });
  var steelMat = new THREE.MeshStandardMaterial({ color: col(0xdedede), metalness: 0.2, roughness: 0.6 });
  var darkMat = new THREE.MeshStandardMaterial({ color: col(0x2a2f38), metalness: 0.3, roughness: 0.7 });
  var track = new THREE.Group();
  [[-0.6, 0, 0.12, 8], [0.6, 0, 0.12, 8], [0, -0.55, 0.24, 6]].forEach(function (d, k) {
    var m = new THREE.Mesh(buildTube(d[0], d[1], d[2], d[3]), k < 2 ? railMat : spineMat);
    m.castShadow = true; m.receiveShadow = true; track.add(m);
  });

  var mat4 = new THREE.Matrix4(), tieStep = Math.max(1, Math.round(1.4 / ds)), tieCount = Math.floor(N / tieStep);
  var ties = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5, 0.1, 0.18), darkMat, tieCount);
  var links = new THREE.InstancedMesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), darkMat, tieCount);
  var basis = new THREE.Matrix4(), place = new THREE.Vector3();
  for (var ti = 0; ti < tieCount; ti++) {
    var idx = ti * tieStep;
    basis.makeBasis(RIGHT[idx], UP[idx], T[idx]);
    mat4.copy(basis).setPosition(place.copy(P[idx]).addScaledVector(UP[idx], -0.1)); ties.setMatrixAt(ti, mat4);
    mat4.copy(basis).setPosition(place.copy(P[idx]).addScaledVector(UP[idx], -0.33)); links.setMatrixAt(ti, mat4);
  }
  ties.castShadow = links.castShadow = true;
  track.add(ties, links);

  var supportStep = Math.round(9 / ds), supportIdx = [];
  for (var si = 0; si < N; si += supportStep) if (UP[si].y > 0.35 && P[si].y > 1.6) supportIdx.push(si);
  var columns = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.34, 1, 10), steelMat, supportIdx.length);
  var footers = new THREE.InstancedMesh(new THREE.BoxGeometry(1.7, 0.5, 1.7), darkMat, supportIdx.length);
  var quat = new THREE.Quaternion(), scl = new THREE.Vector3();
  supportIdx.forEach(function (idx, n) {
    var base = P[idx].clone().addScaledVector(UP[idx], -0.72), h = base.y, w = 1 + h * 0.018;
    columns.setMatrixAt(n, mat4.compose(place.set(base.x, h / 2, base.z), quat, scl.set(w, h, w)));
    footers.setMatrixAt(n, mat4.compose(place.set(base.x, 0.25, base.z), quat, scl.set(1, 1, 1)));
  });
  columns.castShadow = true; columns.receiveShadow = true;
  track.add(columns, footers);
  scene.add(track);

  // Station platform and canopy.
  var station = new THREE.Group();
  var platform = new THREE.Mesh(new THREE.BoxGeometry(26, 0.5, 2.6), new THREE.MeshStandardMaterial({ color: col(0x8f836f), roughness: 0.9 }));
  platform.position.set(-61, 2.45, 15.7); platform.receiveShadow = true; station.add(platform);
  var canopy = new THREE.Mesh(new THREE.BoxGeometry(28, 0.3, 8.5), new THREE.MeshStandardMaterial({ color: col(0x9aa7b8), emissive: col(0x2a3140), roughness: 0.7 }));
  canopy.position.set(-61, 8.2, 17.4); canopy.castShadow = true; station.add(canopy);
  [[-74, 13.6], [-48, 13.6], [-74, 21.2], [-48, 21.2]].forEach(function (p) {
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 8.2, 8), steelMat);
    post.position.set(p[0], 4.1, p[1]); post.castShadow = true; station.add(post);
  });
  scene.add(station);

  // ---------------------------------------------------------------------------
  // Train: the rider sits in the front-right seat of the lead car.
  // ---------------------------------------------------------------------------
  var bodyMat = new THREE.MeshStandardMaterial({ color: col(0xc62f2a), metalness: 0.45, roughness: 0.35 });
  var trimMat = new THREE.MeshStandardMaterial({ color: col(0xf2c14e), metalness: 0.4, roughness: 0.4 });
  var seatMat = new THREE.MeshStandardMaterial({ color: col(0x1b1c22), roughness: 0.85 });
  var skinMats = [0xd9a066, 0x8d5524, 0xf1c27d, 0x5c3a1e].map(function (c) { return new THREE.MeshStandardMaterial({ color: col(c), roughness: 0.8 }); });
  var shirtMats = [0x2f6fde, 0xe8e4dc, 0x3aa374, 0xd4552f].map(function (c) { return new THREE.MeshStandardMaterial({ color: col(c), roughness: 0.9 }); });
  function box(w, h, d, mat, x, y, z, rx) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); if (rx) m.rotation.x = rx; m.castShadow = true; return m;
  }
  function makeCar(index) {
    var car = new THREE.Group();
    car.add(box(1.5, 0.45, 2.3, bodyMat, 0, 0.475, 0));
    car.add(box(1.5, 0.28, 0.5, bodyMat, 0, 0.39, 1.4));
    car.add(box(1.44, 0.1, 0.7, trimMat, 0, 0.62, 1.32, 0.3));
    car.add(box(1.52, 0.06, 2.3, trimMat, 0, 0.7, 0));
    [[-0.6, 0.7], [0.6, 0.7], [-0.6, -0.7], [0.6, -0.7]].forEach(function (p) { car.add(box(0.3, 0.26, 0.45, darkMat, p[0], 0.06, p[1])); });
    [-0.38, 0.38].forEach(function (x, sIdx) {
      car.add(box(0.6, 0.12, 0.55, seatMat, x, 0.76, -0.2));
      car.add(box(0.6, 0.8, 0.14, seatMat, x, 1.1, -0.55));
      car.add(box(0.42, 0.28, 0.12, seatMat, x, 1.42, -0.58));
      var bar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.56, 10), steelMat);
      bar.rotation.z = Math.PI / 2; bar.position.set(x, 1.05, 0.12); car.add(bar);
      car.add(box(0.06, 0.32, 0.06, steelMat, x - 0.27, 0.9, 0.12));
      car.add(box(0.06, 0.32, 0.06, steelMat, x + 0.27, 0.9, 0.12));
      var occupied = !(index === 0 && sIdx === 1);
      if (occupied) {
        var pick = (index * 2 + sIdx) % 4;
        car.add(box(0.42, 0.5, 0.26, shirtMats[pick], x, 1.15, -0.34));
        var head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), skinMats[(pick + 1) % 4]);
        head.position.set(x, 1.62, -0.36); head.castShadow = true; car.add(head);
      }
    });
    return car;
  }
  var cars = [];
  for (var ci = 0; ci < 3; ci++) { var car = makeCar(ci); cars.push(car); scene.add(car); }

  // ---------------------------------------------------------------------------
  // Scenery: trees, distant hills and clouds.
  // ---------------------------------------------------------------------------
  var trackXZ = [];
  for (var ki = 0; ki < N; ki += 6) trackXZ.push(P[ki].x, P[ki].z);
  function nearTrack(x, z, r) {
    for (var j = 0; j < trackXZ.length; j += 2) { var dx = trackXZ[j] - x, dz = trackXZ[j + 1] - z; if (dx * dx + dz * dz < r * r) return true; }
    return false;
  }
  var treeCount = 260, foliage = [new THREE.MeshStandardMaterial({ color: col(0x2f6b2c), roughness: 0.95 }), new THREE.MeshStandardMaterial({ color: col(0x4a8a3a), roughness: 0.95 })];
  var canopies = [new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 6.5, 7), foliage[0], treeCount), new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 6.5, 7), foliage[1], treeCount)];
  var trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.28, 0.4, 2.4, 6), new THREE.MeshStandardMaterial({ color: col(0x5b3f2a), roughness: 1 }), treeCount);
  var placed = 0, counts = [0, 0], guard = 0;
  while (placed < treeCount && guard++ < 20000) {
    var tx = -320 + Math.random() * 640, tz = -260 + Math.random() * 600;
    if (nearTrack(tx, tz, 10) || (Math.abs(tz - 18) < 9 && tx > -90 && tx < 40)) continue;
    var sc = 0.75 + Math.random() * 0.9, which = Math.random() < 0.5 ? 0 : 1;
    canopies[which].setMatrixAt(counts[which]++, mat4.compose(place.set(tx, 2.4 * sc + 3.25 * sc, tz), quat, scl.set(sc, sc, sc)));
    trunks.setMatrixAt(placed++, mat4.compose(place.set(tx, 1.2 * sc, tz), quat, scl.set(sc, sc, sc)));
  }
  canopies[0].count = counts[0]; canopies[1].count = counts[1]; trunks.count = placed;
  canopies.concat([trunks]).forEach(function (m) { m.castShadow = true; scene.add(m); });

  var hillMat = new THREE.MeshStandardMaterial({ color: col(0x6c8c78), roughness: 1 });
  for (var hi = 0; hi < 16; hi++) {
    var ang = hi / 16 * Math.PI * 2 + Math.random() * 0.3, rad = 560 + Math.random() * 120;
    var hill = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), hillMat);
    hill.position.set(-2 + Math.cos(ang) * rad, -8, 47 + Math.sin(ang) * rad);
    hill.scale.set(140 + Math.random() * 120, 45 + Math.random() * 70, 120 + Math.random() * 100);
    scene.add(hill);
  }
  var cloudMat = new THREE.MeshStandardMaterial({ color: col(0xffffff), emissive: col(0x8a97a8), roughness: 1 });
  for (var cl = 0; cl < 22; cl++) {
    var cx = -600 + Math.random() * 1200, cz = -500 + Math.random() * 1100, cy = 110 + Math.random() * 70, cloud = new THREE.Group();
    for (var pi = 0; pi < 4; pi++) {
      var puff = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), cloudMat);
      puff.position.set((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 20);
      puff.scale.set(16 + Math.random() * 18, 6 + Math.random() * 6, 12 + Math.random() * 12);
      cloud.add(puff);
    }
    cloud.position.set(cx, cy, cz); scene.add(cloud);
  }

  // ---------------------------------------------------------------------------
  // Ride state, camera, HUD, sound.
  // ---------------------------------------------------------------------------
  var s = 0, lap = 1, paused = false, carSpacing = 2.75;
  var f0 = new Frame(), f1 = new Frame(), fc = new Frame();
  var camUp = new THREE.Vector3(0, 1, 0), camDir = new THREE.Vector3(1, 0, 0);
  var eye = new THREE.Vector3(), look = new THREE.Vector3(), tv = new THREE.Vector3();
  var el = {
    spd: document.getElementById('spd'), gv: document.getElementById('gv'), alt: document.getElementById('alt'), lap: document.getElementById('lap'),
    section: document.getElementById('section'), gfill: document.getElementById('gfill'), paused: document.getElementById('paused'),
    soundBtn: document.getElementById('soundBtn'), pauseBtn: document.getElementById('pauseBtn')
  };

  function updateTrain() {
    for (var k = 0; k < cars.length; k++) {
      frameAt(s + k * carSpacing, fc);
      cars[k].position.copy(fc.pos);
      cars[k].up.copy(fc.up);
      cars[k].lookAt(tv.copy(fc.pos).add(fc.T));
    }
  }
  function updateCamera(dt, t) {
    frameAt(s, f0);
    frameAt(s + 6 + f0.v * 0.15, f1);
    eye.copy(f0.pos).addScaledVector(f0.up, 1.75).addScaledVector(f0.right, -0.38).addScaledVector(f0.T, -0.45);
    look.copy(f1.pos).addScaledVector(f1.up, 1.6).sub(eye).normalize();
    tv.copy(f0.T).lerp(look, 0.55).normalize();
    camDir.lerp(tv, 1 - Math.exp(-dt * 9)).normalize();
    camUp.lerp(f0.up, 1 - Math.exp(-dt * 10)).normalize();
    var v = f0.v, shake = paused ? 0 : v * v * 0.00006, chain = (!paused && s > 40 && s < sCrest) ? 0.004 : 0;
    eye.addScaledVector(f0.right, Math.sin(t * 23.1) * shake + Math.sin(t * 61) * chain)
       .addScaledVector(f0.up, Math.sin(t * 29.7) * shake * 0.8 + Math.sin(t * 47) * chain);
    camera.position.copy(eye);
    camera.up.copy(camUp);
    camera.lookAt(tv.copy(eye).add(camDir));
    var fov = clamp(70 + v * 0.45, 70, 88);
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }
  var hudTimer = 0;
  function updateHUD(dt) {
    hudTimer += dt;
    if (hudTimer < 0.1) return;
    hudTimer = 0;
    el.spd.textContent = Math.round(f0.v * 3.6);
    el.gv.textContent = f0.gv.toFixed(1);
    el.alt.textContent = Math.round(f0.pos.y);
    el.section.textContent = sectionName(s);
    el.gfill.style.width = (clamp((f0.gv + 1.5) / 6, 0, 1) * 100).toFixed(0) + '%';
    el.gfill.style.background = f0.gv < 0.3 ? '#7fd3ff' : (f0.gv > 3.2 ? '#ff6b57' : '#ffd166');
  }

  var audio = null;
  function toggleSound() {
    if (!audio) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC(), buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), data = buf.getChannelData(0);
      for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      var wind = ctx.createBiquadFilter(); wind.type = 'lowpass'; wind.frequency.value = 200; wind.Q.value = 0.6;
      var windGain = ctx.createGain(); windGain.gain.value = 0;
      var roar = ctx.createBiquadFilter(); roar.type = 'bandpass'; roar.frequency.value = 95; roar.Q.value = 1.4;
      var roarGain = ctx.createGain(); roarGain.gain.value = 0;
      src.connect(wind); wind.connect(windGain); windGain.connect(ctx.destination);
      src.connect(roar); roar.connect(roarGain); roarGain.connect(ctx.destination);
      src.start();
      if (ctx.state === 'suspended') ctx.resume();
      audio = { ctx: ctx, wind: wind, windGain: windGain, roarGain: roarGain, on: true };
    } else {
      audio.on = !audio.on;
      if (audio.on) audio.ctx.resume(); else audio.ctx.suspend();
    }
    el.soundBtn.textContent = 'Sound: ' + (audio.on ? 'on' : 'off');
  }
  function updateAudio() {
    if (!audio || !audio.on) return;
    var v = paused ? 0 : f0.v, t = audio.ctx.currentTime, k = clamp(v / 30, 0, 1);
    audio.wind.frequency.setTargetAtTime(150 + v * 40, t, 0.15);
    audio.windGain.gain.setTargetAtTime(k * k * 0.4, t, 0.15);
    audio.roarGain.gain.setTargetAtTime(k * 0.3, t, 0.15);
  }
  function setPaused(p) { paused = p; el.paused.style.display = p ? 'block' : 'none'; el.pauseBtn.textContent = p ? 'Resume' : 'Pause'; }
  el.soundBtn.addEventListener('click', toggleSound);
  el.pauseBtn.addEventListener('click', function () { setPaused(!paused); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
    else if (e.key === 'm' || e.key === 'M') toggleSound();
  });
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var last = performance.now(), clock = 0;
  function step(dt) {
    clock += dt;
    if (!paused) {
      frameAt(s, f0);
      s += f0.v * dt;
      if (s >= L) { s -= L; lap++; el.lap.textContent = lap; }
    }
    updateTrain();
    updateCamera(dt, clock);
    updateHUD(dt);
    updateAudio();
    renderer.render(scene, camera);
  }
  function animate(now) {
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    step(dt);
  }
  updateTrain();
  updateCamera(0.016, 0);
  updateHUD(1);
  requestAnimationFrame(animate);
  // Small debug API: jump to a point on the track (metres) and draw one frame.
  window.__ride = {
    length: L, lapTime: lapTime, samples: N, maxSpeed: Math.max.apply(null, Array.prototype.slice.call(V)),
    seek: function (metres) { s = ((metres % L) + L) % L; frameAt(s, f0); camUp.copy(f0.up); camDir.copy(f0.T); },
    tick: function (dt) { step(dt); return { s: s, lap: lap, speed: f0.v }; },
    renderOnce: function () { updateTrain(); updateCamera(1, clock); hudTimer = 1; updateHUD(1); renderer.render(scene, camera); return { s: s, speed: f0.v, gv: f0.gv, section: sectionName(s) }; },
    snapshot: function (w, h, quality) {
      renderer.setPixelRatio(1); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      updateTrain(); updateCamera(1, clock); renderer.render(scene, camera);
      var url = renderer.domElement.toDataURL('image/jpeg', quality || 0.7);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      return url;
    }
  };
})();
</script>
</body>
</html>
