<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Vela Nocturne — a continuous first-person night rollercoaster over a black-glass bay.">
<title>Vela Nocturne</title>
<style>
  :root {
    --ink: #f3ecdf;
    --amber: #e7a15a;
    --dim: rgba(243, 236, 223, 0.68);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #07090f;
    overflow: hidden;
    overscroll-behavior: none;
    color: var(--ink);
  }
  body { user-select: none; -webkit-user-select: none; }
  #c { display: block; width: 100%; height: 100%; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.58) 100%),
      linear-gradient(to bottom, rgba(0, 0, 0, 0.28), transparent 18%, transparent 78%, rgba(0, 0, 0, 0.35));
  }
  #grain {
    position: fixed;
    inset: -10%;
    width: 120%;
    height: 120%;
    pointer-events: none;
    z-index: 3;
    opacity: 0.05;
    mix-blend-mode: overlay;
  }
  #hud {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #hero {
    position: absolute;
    left: 0;
    right: 0;
    top: 15vh;
    text-align: center;
    transition: opacity 2.1s ease;
  }
  #hero.hide { opacity: 0; }
  .eyebrow {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.46em;
    text-transform: uppercase;
    color: var(--amber);
  }
  h1 {
    margin: 10px 0 0;
    font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    font-weight: 500;
    font-size: clamp(52px, 8.4vw, 112px);
    line-height: 0.86;
    letter-spacing: -0.04em;
    text-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
  }
  #word {
    position: absolute;
    top: max(20px, env(safe-area-inset-top));
    left: max(22px, 4.5vw);
    margin: 12px 0 0;
    opacity: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--dim);
    transition: opacity 1.8s ease;
  }
  #word.show { opacity: 1; }
  #bottom {
    position: absolute;
    left: max(22px, 4.5vw);
    right: max(22px, 4.5vw);
    bottom: calc(18px + env(safe-area-inset-bottom));
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
  }
  #section {
    margin: 0;
    min-height: 1.2em;
    font-size: clamp(20px, 2.6vw, 32px);
    letter-spacing: 0.03em;
    opacity: 0;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    transition: opacity 0.9s ease;
  }
  #section.on { opacity: 1; }
  #speed {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  #speed strong {
    font-weight: 560;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-right: 4px;
  }
  #bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 1px;
    background: rgba(243, 236, 223, 0.16);
  }
  #bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e7a15a, #9ee7df);
  }
  #sound {
    pointer-events: auto;
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, 4vw);
    margin-top: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(243, 236, 223, 0.38);
    background: rgba(8, 10, 16, 0.28);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #sound:hover { border-color: var(--amber); color: white; }
  #sound:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  #curtain {
    position: fixed;
    inset: 0;
    z-index: 4;
    background: #07090f;
    pointer-events: none;
    transition: opacity 2.4s ease;
  }
  #curtain.open { opacity: 0; }
  #curtain p {
    position: absolute;
    left: 10vw;
    right: 10vw;
    bottom: 14vh;
    text-align: center;
    font-family: Georgia, serif;
    color: var(--ink);
  }
  @media (prefers-reduced-motion: reduce) {
    #curtain, #hero, #section, #word { transition: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Vela Nocturne, a continuous first-person night rollercoaster"></canvas>
<div id="vignette"></div>
<svg id="grain" aria-hidden="true">
  <filter id="grainf">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grainf)"/>
</svg>
<div id="hud">
  <p id="word">Vela Nocturne</p>
  <header id="hero">
    <p class="eyebrow">Continuous night circuit</p>
    <h1>Vela Nocturne</h1>
  </header>
  <div id="bottom">
    <p id="section"></p>
    <p id="speed"><strong id="spd">0</strong> km/h</p>
    <i id="bar"><i></i></i>
  </div>
  <button id="sound" type="button" aria-pressed="false">Sound</button>
</div>
<div id="curtain"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EYE = 1.24;
const FOG_D = 0.00112;
const FOG_HEX = 0x141c2a;
const FRAME_N = 1500;
const CRUISE = 7;

const canvas = document.getElementById('c');
const curtain = document.getElementById('curtain');
const hero = document.getElementById('hero');
const word = document.getElementById('word');
const sectionEl = document.getElementById('section');
const spdEl = document.getElementById('spd');
const barEl = document.querySelector('#bar i');
const soundBtn = document.getElementById('sound');

const COL = {
  amber: new THREE.Color('#ffb15a'),
  white: new THREE.Color('#fff1df'),
  teal: new THREE.Color('#7ef0dc'),
  copper: new THREE.Color('#e38a55'),
  sea: new THREE.Color('#b7e7ff')
};

function fail(msg) {
  const p = document.createElement('p');
  p.textContent = msg;
  curtain.appendChild(p);
}

function wrap01(u) {
  u %= 1;
  if (u < 0) u += 1;
  return u >= 1 ? 0 : u;
}

function ease(s, a, b, y0, y1) {
  const t = Math.min(1, Math.max(0, (s - a) / (b - a || 1)));
  const k = 0.5 - 0.5 * Math.cos(Math.PI * t);
  return y0 + (y1 - y0) * k;
}

function rnd(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function makeCanvasTexture(draw, w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function glowTexture(inner, mid) {
  return makeCanvasTexture((g, w, h) => {
    const grd = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grd.addColorStop(0, inner);
    grd.addColorStop(0.35, mid);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
  }, 128, 128);
}

const samples = [];
const marks = {};
let x = 0;
let z = 0;
let dx = 0;
let dz = 1;
let minX = Infinity;
let maxX = -Infinity;
let minZ = Infinity;
let maxZ = -Infinity;
let bboxOn = true;
let helixCenter = { x: 0, z: 0 };

function push(px, pz) {
  if (samples.length) {
    const q = samples[samples.length - 1];
    const d = Math.hypot(px - q.x, pz - q.z);
    if (d < 0.35) return;
    samples.push({ x: px, z: pz, s: q.s + d, y: 0 });
  } else {
    samples.push({ x: px, z: pz, s: 0, y: 0 });
  }
  if (!bboxOn) return;
  if (px < minX) minX = px;
  if (px > maxX) maxX = px;
  if (pz < minZ) minZ = pz;
  if (pz > maxZ) maxZ = pz;
}

function bookmark(name) {
  marks[name] = samples[samples.length - 1].s;
}

function straight(dist, step = 5) {
  const n = Math.max(1, Math.round(dist / step));
  const sx = x;
  const sz = z;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    push(sx + dx * dist * t, sz + dz * dist * t);
  }
  x = sx + dx * dist;
  z = sz + dz * dist;
}

function turnRight(radius, deg, step = 4) {
  const rad = deg * Math.PI / 180;
  const rx = -dz;
  const rz = dx;
  const cx = x + rx * radius;
  const cz = z + rz * radius;
  const a0 = Math.atan2(z - cz, x - cx);
  const arc = Math.abs(rad) * radius;
  const n = Math.max(2, Math.round(arc / step));
  for (let i = 1; i <= n; i++) {
    const a = a0 + rad * (i / n);
    push(cx + Math.cos(a) * radius, cz + Math.sin(a) * radius);
  }
  const a1 = a0 + rad;
  x = cx + Math.cos(a1) * radius;
  z = cz + Math.sin(a1) * radius;
  dx = -Math.sin(a1);
  dz = Math.cos(a1);
  const len = Math.hypot(dx, dz) || 1;
  dx /= len;
  dz /= len;
}

function helix(radius, turns) {
  helixCenter = { x: x + -dz * radius, z: z + dx * radius };
  bboxOn = false;
  turnRight(radius, 360 * turns, 3);
  bboxOn = true;
}

const R = 50;
push(0, 0);
straight(70); bookmark('lift0');
straight(164); bookmark('crest');
straight(26); bookmark('westEnd');
turnRight(R, 90); bookmark('nwEnd');
straight(18); bookmark('drop0');
straight(150); bookmark('drop1');
straight(40); bookmark('camel0');
straight(56); bookmark('camel1');
straight(56); bookmark('camel2');
turnRight(R, 90); bookmark('east0');
straight(36); bookmark('tun0');
straight(124); bookmark('tun1');
straight(28); bookmark('helix0');
helix(22, 2); bookmark('helix1');
straight(72); bookmark('eastEnd');
turnRight(R, 90); bookmark('south0');
straight(70); bookmark('hill0');
straight(64); bookmark('hill1');
straight(62); bookmark('hill2');
straight(44); bookmark('brake0');
straight(80); bookmark('brake1');
turnRight(R, 90); bookmark('finish');

const end = samples[samples.length - 1];
const start = samples[0];
const gap = Math.hypot(end.x - start.x, end.z - start.z);
let fullS = end.s;
if (gap < 1) {
  fullS = end.s;
  samples.pop();
} else {
  fullS = end.s + gap;
}

function heightAt(s) {
  const m = marks;
  if (s < m.lift0) return 15;
  if (s < m.crest) return ease(s, m.lift0, m.crest, 15, 100);
  if (s < m.drop0) return 100;
  if (s < m.drop1) return ease(s, m.drop0, m.drop1, 100, 3.5);
  if (s < m.camel0) return 3.5;
  if (s < m.camel1) return ease(s, m.camel0, m.camel1, 3.5, 36);
  if (s < m.camel2) return ease(s, m.camel1, m.camel2, 36, 6.5);
  if (s < m.east0) return ease(s, m.camel2, m.east0, 6.5, 11);
  if (s < m.tun0) return ease(s, m.east0, m.tun0, 11, 36);
  if (s < m.helix0) return 36;
  if (s < m.helix1) return ease(s, m.helix0, m.helix1, 36, 5.5);
  if (s < m.eastEnd) return ease(s, m.helix1, m.eastEnd, 5.5, 4.6);
  if (s < m.hill0) return 4.6;
  if (s < m.hill1) return ease(s, m.hill0, m.hill1, 4.6, 19);
  if (s < m.hill2) return ease(s, m.hill1, m.hill2, 19, 3.6);
  if (s < m.brake0) return 3.6;
  if (s < m.brake1) return ease(s, m.brake0, m.brake1, 3.6, 15);
  return 15;
}

for (const p of samples) p.y = heightAt(p.s);
const ox = (minX + maxX) / 2;
const oz = (minZ + maxZ) / 2;
for (const p of samples) {
  p.x -= ox;
  p.z -= oz;
}
helixCenter.x -= ox;
helixCenter.z -= oz;

const centerline = samples.map((p) => new THREE.Vector3(p.x, p.y, p.z));
const curve = new THREE.CatmullRomCurve3(centerline, true, 'centripetal', 0.35);
curve.arcLengthDivisions = 2600;
curve.updateArcLengths();
const trackLen = curve.getLength();

function smoothstep(t) {
  t = Math.min(1, Math.max(0, t));
  return t * t * (3 - 2 * t);
}

function speedFor(s, y) {
  const phys = Math.min(33.2, Math.sqrt(Math.max(64, 10.38 * (107.8 - y))));
  let target = phys;
  if (s < marks.crest) target = CRUISE;
  else if (s < marks.drop0) {
    const t = (s - marks.crest) / (marks.drop0 - marks.crest);
    const k = smoothstep(Math.max(0, (t - 0.5) / 0.5));
    target = THREE.MathUtils.lerp(CRUISE, phys, k);
  }
  if (s >= marks.helix0 && s < marks.helix1) {
    const t = (s - marks.helix0) / (marks.helix1 - marks.helix0);
    let k = 1;
    if (t < 0.16) k = smoothstep(t / 0.16);
    else if (t > 0.84) k = smoothstep((1 - t) / 0.16);
    target = THREE.MathUtils.lerp(target, Math.min(target, 20), k);
  }
  if (s >= marks.brake0) {
    const t = (s - marks.brake0) / (fullS - marks.brake0);
    target = THREE.MathUtils.lerp(target, CRUISE, smoothstep(t));
  }
  return target;
}

const SPEEDS = new Float32Array(2048);
for (let i = 0; i < 2048; i++) {
  const uu = i / 2048;
  const s = uu * fullS;
  SPEEDS[i] = speedFor(s, heightAt(s));
}
for (let pass = 0; pass < 2; pass++) {
  const copy = SPEEDS.slice();
  for (let i = 0; i < 2048; i++) {
    SPEEDS[i] = (copy[(i + 2047) % 2048] + copy[i] * 2 + copy[(i + 1) % 2048]) / 4;
  }
}

function speedAtU(u) {
  const x = wrap01(u) * 2048;
  const i = Math.floor(x) % 2048;
  const f = x - Math.floor(x);
  return SPEEDS[i] * (1 - f) + SPEEDS[(i + 1) % 2048] * f;
}

const paletteStops = [
  [0, COL.amber],
  [marks.lift0, COL.amber],
  [marks.crest, COL.white],
  [marks.drop0, COL.white],
  [marks.drop1, COL.teal],
  [marks.east0, COL.teal],
  [marks.tun0, COL.teal],
  [marks.helix1, COL.teal],
  [marks.hill0, COL.sea],
  [marks.brake0, COL.teal],
  [marks.brake1, COL.amber],
  [fullS + 1, COL.amber]
];
const tmpC = new THREE.Color();

function palette(s, target) {
  if (s >= marks.tun0 && s < marks.tun1) {
    return target.copy(Math.floor(s / 10) % 2 ? COL.amber : COL.teal);
  }
  if (s >= marks.helix0 && s < marks.helix1) {
    const span = (marks.helix1 - marks.helix0) / 8;
    return target.copy(Math.floor((s - marks.helix0) / span) % 2 ? COL.copper : COL.teal);
  }
  let a = paletteStops[0];
  let b = paletteStops[paletteStops.length - 1];
  for (let i = 0; i < paletteStops.length - 1; i++) {
    if (s >= paletteStops[i][0] && s <= paletteStops[i + 1][0]) {
      a = paletteStops[i];
      b = paletteStops[i + 1];
      break;
    }
  }
  const t = (s - a[0]) / Math.max(0.001, b[0] - a[0]);
  return target.copy(a[1]).lerp(b[1], smoothstep(t));
}

const tangents = [];
for (let i = 0; i < FRAME_N; i++) {
  tangents.push(curve.getTangentAt(i / FRAME_N).normalize());
}
const banks = new Float32Array(FRAME_N);
const ds = trackLen / FRAME_N;
for (let i = 0; i < FRAME_N; i++) {
  const t0 = tangents[i];
  const t1 = tangents[(i + 1) % FRAME_N];
  let d = Math.atan2(t1.z, t1.x) - Math.atan2(t0.z, t0.x);
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  if (Math.abs(d) < 0.0006) d = 0;
  banks[i] = THREE.MathUtils.clamp((d / ds) * 24, -0.85, 0.85);
}
for (let pass = 0; pass < 3; pass++) {
  const copy = banks.slice();
  for (let i = 0; i < FRAME_N; i++) {
    let acc = 0;
    let w = 0;
    for (let o = -5; o <= 5; o++) {
      const g = 6 - Math.abs(o);
      acc += copy[(i + o + FRAME_N) % FRAME_N] * g;
      w += g;
    }
    banks[i] = acc / w;
  }
}
for (let i = 0; i < FRAME_N; i++) {
  const s = (i / FRAME_N) * fullS;
  if (s >= marks.helix0 && s < marks.helix1) {
    const t = (s - marks.helix0) / (marks.helix1 - marks.helix0);
    banks[i] += Math.sin(Math.PI * t) * 0.2;
  }
  banks[i] = THREE.MathUtils.clamp(banks[i], -0.8, 0.8);
}

const FRAMES = [];
const _T = new THREE.Vector3();
const _up = new THREE.Vector3();
const _right = new THREE.Vector3();
const _back = new THREE.Vector3();
const _q = new THREE.Quaternion();
for (let i = 0; i < FRAME_N; i++) {
  const u = i / FRAME_N;
  const pos = curve.getPointAt(u);
  _T.copy(tangents[i]);
  _up.set(0, 1, 0).addScaledVector(_T, -_T.y);
  if (_up.lengthSq() < 1e-8) _up.set(1, 0, 0).addScaledVector(_T, -_T.x);
  _up.normalize();
  if (Math.abs(banks[i]) > 1e-5) {
    _q.setFromAxisAngle(_T, banks[i]);
    _up.applyQuaternion(_q);
  }
  _right.crossVectors(_T, _up).normalize();
  _back.copy(_T).negate();
  _up.crossVectors(_back, _right).normalize();
  const quat = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(_right, _up, _back)
  );
  if (i > 0 && quat.dot(FRAMES[i - 1].q) < 0) quat.negate();
  FRAMES.push({
    pos: pos.clone(),
    q: quat,
    up: _up.clone(),
    right: _right.clone(),
    T: _T.clone(),
    s: u * fullS
  });
}

const live = {
  pos: new THREE.Vector3(),
  q: new THREE.Quaternion(),
  up: new THREE.Vector3(),
  right: new THREE.Vector3(),
  T: new THREE.Vector3()
};
const scratchQ = new THREE.Quaternion();

function frameAt(u, out) {
  u = wrap01(u);
  const xf = u * FRAME_N;
  let i = Math.floor(xf);
  let f = xf - i;
  if (i >= FRAME_N) {
    i = 0;
    f = 0;
  }
  const a = FRAMES[i];
  const b = FRAMES[(i + 1) % FRAME_N];
  out.pos.lerpVectors(a.pos, b.pos, f);
  out.q.copy(a.q);
  scratchQ.copy(b.q);
  if (out.q.dot(scratchQ) < 0) scratchQ.negate();
  out.q.slerp(scratchQ, f);
  out.right.set(1, 0, 0).applyQuaternion(out.q);
  out.up.set(0, 1, 0).applyQuaternion(out.q);
  out.T.set(0, 0, -1).applyQuaternion(out.q);
  out.s = u * fullS;
  return out;
}

function buildPathTube(opt) {
  const tubular = opt.tubular;
  const radial = opt.radial;
  const closed = !!opt.closed;
  const rings = closed ? tubular : tubular + 1;
  const cols = radial + 1;
  const positions = [];
  const normals = [];
  const uvs = [];
  const colors = [];
  const indices = [];
  for (let i = 0; i < rings; i++) {
    const t = closed ? i / tubular : i / tubular;
    const u = opt.u0 + (opt.u1 - opt.u0) * t;
    frameAt(u, live);
    const s = ((u % 1) + 1) % 1 * fullS;
    if (opt.colorFn) opt.colorFn(s, tmpC);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      let rx = live.right.x * ca + live.up.x * sa;
      let ry = live.right.y * ca + live.up.y * sa;
      let rz = live.right.z * ca + live.up.z * sa;
      let rr = opt.radius;
      if (opt.noise) {
        rr *= 1 + opt.noise * Math.sin(i * 0.61 + a * 3) * Math.cos(a * 2 + i * 0.23);
      }
      const lateral = opt.lateral || 0;
      const lift = opt.lift || 0;
      positions.push(
        live.pos.x + live.right.x * lateral + live.up.x * lift + rx * rr,
        live.pos.y + live.right.y * lateral + live.up.y * lift + ry * rr,
        live.pos.z + live.right.z * lateral + live.up.z * lift + rz * rr
      );
      const ns = opt.inward ? -1 : 1;
      normals.push(rx * ns, ry * ns, rz * ns);
      uvs.push(j / radial, s * (opt.uvScale || 0.15));
      if (opt.colorFn) colors.push(tmpC.r, tmpC.g, tmpC.b);
    }
  }
  const seg = closed ? tubular : tubular;
  for (let i = 0; i < (closed ? tubular : tubular); i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * cols + j;
      const b = ((closed ? (i + 1) % rings : i + 1) * cols) + j;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  if (colors.length) geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeBoundingSphere();
  return geo;
}

function placeBox(mesh, index, a, b, thickness) {
  const mid = tmpA.copy(a).add(b).multiplyScalar(0.5);
  const dir = tmpB.copy(b).sub(a);
  const len = dir.length();
  if (len < 0.2) return index;
  dir.multiplyScalar(1 / len);
  dummy.position.copy(mid);
  dummy.quaternion.setFromUnitVectors(tmpUp.set(0, 1, 0), dir);
  dummy.scale.set(thickness ? 1 : 1, len, 1);
  dummy.updateMatrix();
  mesh.setMatrixAt(index, dummy.matrix);
  return index + 1;
}

const tmpA = new THREE.Vector3();
const tmpB = new THREE.Vector3();
const tmpUp = new THREE.Vector3();
const tmpR = new THREE.Vector3();

let nextSupport = 0;
for (let i = 0; i < FRAME_N; i++) {
  const f = FRAMES[i];
  if (f.s < nextSupport) continue;
  nextSupport = f.s + (f.pos.y > 42 ? 9 : 14);
  if (f.s > marks.tun0 && f.s < marks.tun1) continue;
  if (f.s > marks.helix0 && f.s < marks.helix1) continue;
  const top = f.pos.y - 0.72;
  const base = -1.7;
  const h = top - base;
  if (h < 2) continue;
  tmpR.copy(f.right);
  tmpR.y = 0;
  if (tmpR.lengthSq() < 1e-6) tmpR.set(1, 0, 0);
  tmpR.normalize();
  const tall = h > 12;
  const need = tall ? 2 : 1;
  if (colN + need > columns.count || padN + need > pads.count) continue;
  const spread = tall ? 1.25 : 0;
  const places = tall ? [-spread, spread] : [0];
  for (const off of places) {
    const px = f.pos.x + tmpR.x * off;
    const pz = f.pos.z + tmpR.z * off;
    dummy.position.set(px, (top + base) / 2, pz);
    dummy.quaternion.identity();
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    columns.setMatrixAt(colN++, dummy.matrix);
    dummy.position.set(px, 0.15, pz);
    dummy.scale.set(0.9 + Math.min(1.4, h * 0.012), 1, 0.9 + Math.min(1.4, h * 0.012));
    dummy.updateMatrix();
    pads.setMatrixAt(padN++, dummy.matrix);
  }
  if (tall && beamN < 210 && braceN < 410) {
    const left = tmpA.set(f.pos.x, top - 0.05, f.pos.z).addScaledVector(tmpR, -spread);
    const right = tmpB.set(f.pos.x, top - 0.05, f.pos.z).addScaledVector(tmpR, spread);
    dummy.position.copy(left).add(right).multiplyScalar(0.5);
    dummy.quaternion.setFromUnitVectors(tmpUp.set(1, 0, 0), tmpR);
    dummy.scale.set(spread * 2, 1, 1);
    dummy.updateMatrix();
    beams.setMatrixAt(beamN++, dummy.matrix);
    braceN = placeBox(braces, braceN,
      new THREE.Vector3(f.pos.x, base + 0.5, f.pos.z).addScaledVector(tmpR, -spread),
      new THREE.Vector3(f.pos.x, top - 0.3, f.pos.z).addScaledVector(tmpR, spread));
    braceN = placeBox(braces, braceN,
      new THREE.Vector3(f.pos.x, base + 0.5, f.pos.z).addScaledVector(tmpR, spread),
      new THREE.Vector3(f.pos.x, top - 0.3, f.pos.z).addScaledVector(tmpR, -spread));
  }
}

function rockGeometry(radius, yScale, seed) {
  const geo = new THREE.SphereGeometry(radius, 22, 14);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const vx = pos.getX(i);
    const vy = pos.getY(i);
    const vz = pos.getZ(i);
    const n = Math.sin(vx * 0.17 + seed) * Math.cos(vz * 0.15 + seed * 1.7) + Math.sin((vy + seed) * 0.21);
    const s = 1 + n * 0.16;
    pos.setXYZ(i, vx * s, vy * s * yScale, vz * s);
  }
  geo.computeVertexNormals();
  return geo;
}

function clearOfTrack(px, pz, minD) {
  const min2 = minD * minD;
  for (let i = 0; i < centerline.length; i += 2) {

    const dz = centerline[i].z - pz;
    if (dx * dx + dz * dz < min2) return false;
  }
  return true;
}

function deckRibbon(s0, s1, inner, outer) {
  const steps = Math.max(4, Math.ceil((s1 - s0) / 4));
  const positions = [];
  const uvs = [];
  const indices = [];
  let dist = 0;
  let prev = null;
  for (let k = 0; k <= steps; k++) {
    const s = s0 + (s1 - s0) * (k / steps);
    frameAt(s / fullS, live);
    const r = tmpR.copy(live.right);
    r.y = 0;
    if (r.lengthSq() < 1e-6) r.set(1, 0, 0);
    r.normalize();
    const a = new THREE.Vector3(live.pos.x, deckY, live.pos.z).addScaledVector(r, inner);
    const b = new THREE.Vector3(live.pos.x, deckY, live.pos.z).addScaledVector(r, outer);
    if (prev) dist += Math.hypot(live.pos.x - prev.x, live.pos.z - prev.z);
    positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    uvs.push(0, dist * 0.18, 1, dist * 0.18);
    prev = live.pos.clone();
  }
  for (let k = 0; k < steps; k++) {
    const i = k * 2;
    indices.push(i, i + 1, i + 2, i + 1, i + 3, i + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

      p.z += sin(uv.x * 7.0 - uTime * 3.2) * edge * 0.16;
      p.y += sin(uv.x * 4.0 - uTime * 2.4 + 1.0) * edge * 0.05;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying vec2 vUv;
    void main() {
      float stripe = step(0.5, fract(vUv.y * 3.0));
      vec3 col = mix(uColor, uColor * 0.35, stripe);
      ${finishGLSL}
    }
  `
});
const flagMatB = flagMatA.clone();
flagMatB.uniforms = { uTime: flagMatA.uniforms.uTime, uColor: { value: new THREE.Color('#7ef0dc') } };

  flag.position.set(pole.position.x + live.T.x * 0.75, deckY + 2.7, pole.position.z + live.T.z * 0.75);
  flag.rotation.y = Math.atan2(live.T.x, live.T.z);

}
addFlag(14, flagMatA, -6.6);

const spinners = [];

function buildTrailingCar() {

  seat.position.set(0, 1.05, 0.72);

let ctx = null;
let master = null;
let windFilter = null;
let windGain = null;
let rumbleGain = null;
let droneGain = null;
let whiteBuf = null;
let clackBuf = null;
let audioOn = false;

function noiseBuffer(seconds, brown) {
  const len = Math.floor(seconds * ctx.sampleRate);
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const white = Math.random() * 2 - 1;
    if (brown) {
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.2;
    } else {
      data[i] = white;
    }
  }
  return buffer;
}

function setupAudio() {
  ctx = new AudioContext();
  master = ctx.createGain();
  master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16;
  comp.knee.value = 18;
  comp.ratio.value = 2.4;
  comp.attack.value = 0.01;
  comp.release.value = 0.22;
  master.connect(comp);
  comp.connect(ctx.destination);
  whiteBuf = noiseBuffer(2, false);
  const brown = noiseBuffer(2, true);
  const windSrc = ctx.createBufferSource();
  windSrc.buffer = whiteBuf;
  windSrc.loop = true;
  windFilter = ctx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 480;
  windFilter.Q.value = 0.55;
  windGain = ctx.createGain();
  windGain.gain.value = 0;
  windSrc.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(master);
  windSrc.start();
  const rumbleSrc = ctx.createBufferSource();
  rumbleSrc.buffer = brown;
  rumbleSrc.loop = true;
  const rumbleFilter = ctx.createBiquadFilter();
  rumbleFilter.type = 'lowpass';
  rumbleFilter.frequency.value = 120;
  rumbleGain = ctx.createGain();
  rumbleGain.gain.value = 0;
  rumbleSrc.connect(rumbleFilter);
  rumbleFilter.connect(rumbleGain);
  rumbleGain.connect(master);
  rumbleSrc.start();
  droneGain = ctx.createGain();
  droneGain.gain.value = 0;
  droneGain.connect(master);
  [[55, 0.04], [82.41, 0.022], [110, 0.014], [164.81, 0.008]].forEach(([f, level], i) => {
    const o = ctx.createOscillator();
    o.type = i < 2 ? 'sine' : 'triangle';
    o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.value = level;
    o.connect(g);
    g.connect(droneGain);
    o.start();
  });
  const n = Math.floor(ctx.sampleRate * 0.07);
  clackBuf = ctx.createBuffer(1, n, ctx.sampleRate);
  const cd = clackBuf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    cd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.012));
  }
}

function playClack(amp, bright) {
  if (!audioOn || !ctx) return;
  const src = ctx.createBufferSource();
  src.buffer = clackBuf;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = bright ? 1900 : 380;
  f.Q.value = bright ? 0.7 : 1.5;
  const g = ctx.createGain();
  g.gain.value = amp;
  src.connect(f);
  f.connect(g);
  g.connect(master);
  src.start();
}

function dropSweep() {
  if (!audioOn || !ctx) return;
  const now = ctx.currentTime;
  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, now);
  o.frequency.exponentialRampToValueAtTime(42, now + 1.35);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.07, now + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.45);
  o.connect(g);
  g.connect(master);
  o.start(now);
  o.stop(now + 1.5);
  const src = ctx.createBufferSource();
  src.buffer = whiteBuf;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(300, now);
  f.frequency.exponentialRampToValueAtTime(900, now + 0.8);
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.0001, now);
  ng.gain.exponentialRampToValueAtTime(0.05, now + 0.1);
  ng.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  src.connect(f);
  f.connect(ng);
  ng.connect(master);
  src.start(now);
  src.stop(now + 1.25);
}

function helixSwell() {
  if (!audioOn || !ctx) return;
  const now = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = whiteBuf;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.Q.value = 5;
  f.frequency.setValueAtTime(640, now);
  f.frequency.exponentialRampToValueAtTime(1700, now + 1.05);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.045, now + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
  src.connect(f);
  f.connect(g);
  g.connect(master);
  src.start(now);
  src.stop(now + 1.3);
}

function buoyBell() {
  if (!audioOn || !ctx) return;
  const now = ctx.currentTime;
  [523.25, 784].forEach((freq, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(i === 0 ? 0.028 : 0.014, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.3);
    o.connect(g);
    g.connect(master);
    o.start(now);
    o.stop(now + 2.4);
  });
}

function toggleSound() {
  if (!ctx) setupAudio();
  audioOn = !audioOn;
  if (ctx.state === 'suspended') ctx.resume();
  master.gain.setTargetAtTime(audioOn ? 0.9 : 0, ctx.currentTime, 0.05);
  soundBtn.textContent = audioOn ? 'Mute' : 'Sound';
  soundBtn.setAttribute('aria-pressed', audioOn ? 'true' : 'false');
}
soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleSound();
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'Space') e.preventDefault();
});

const SECTIONS = [
  ['Pier Lights', 0, marks.lift0],
  ['Chain Lift', marks.lift0, marks.crest],
  ['High Water', marks.crest, marks.drop0],
  ['The Drop', marks.drop0, marks.drop1],
  ['Camelback', marks.drop1, marks.east0],
  ['Lantern Bore', marks.east0, marks.helix0],
  ['Glass Helix', marks.helix0, marks.helix1],
  ['Skim Line', marks.helix1, marks.brake0],
  ['The Return', marks.brake0, fullS + 1]
];

function sectionName(s) {
  for (const sec of SECTIONS) {
    if (s >= sec[1] && s < sec[2]) return sec[0];
  }
  return 'Pier Lights';
}

function crossed(a, b, m) {
  if (a <= b) return a < m && m <= b;
  return a < m || m <= b;
}

let rideU = wrap01((marks.crest + 6) / fullS);
let travel = marks.crest + 6;
let lastTie = Math.floor(travel / 2.35);
let prevS = (marks.crest + 6);
let namesOn = false;
let shown = '';
let hideAt = 0;
let bellT = 0;
let nextBell = 5;
let lastHud = 0;
let prevSpeed = CRUISE;
const ahead = new THREE.Vector3();
const euler = new THREE.Euler(0, 0, 0, 'YXZ');

function resize() {
  const w = window.innerWidth;
  const h = Math.max(1, window.innerHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
resize();
window.addEventListener('resize', resize);

window.setTimeout(() => {
  hero.classList.add('hide');
  word.classList.add('show');
  namesOn = true;
}, REDUCE ? 500 : 8600);

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now * 0.001;
  const sp = speedAtU(rideU);
  rideU = wrap01(rideU + (sp * dt) / trackLen);
  travel += sp * dt;
  const s = rideU * fullS;

  frameAt(rideU, live);
  rig.position.copy(live.pos).addScaledVector(live.up, EYE);
  rig.quaternion.copy(live.q);

  const look = THREE.MathUtils.clamp(8 + sp * 0.22, 8, 18);
  ahead.copy(curve.getPointAt(wrap01(rideU + look / trackLen)));
  tmpA.copy(ahead).sub(rig.position).applyQuaternion(scratchQ.copy(live.q).invert());
  const yaw = THREE.MathUtils.clamp(Math.atan2(tmpA.x, -tmpA.z), -0.65, 0.65);
  const pitch = THREE.MathUtils.clamp(Math.atan2(tmpA.y, Math.hypot(tmpA.x, tmpA.z)), -0.45, 0.35);
  const accel = THREE.MathUtils.clamp((sp - prevSpeed) / Math.max(dt, 0.001), -40, 40);
  prevSpeed = sp;
  const buzz = REDUCE ? 0 : sp * 0.0001;
  const tieBuzz = REDUCE ? 0 : Math.sin((travel / 2.35) * Math.PI * 2) * sp * 0.00011;
  camera.position.set(Math.sin(t * 47) * buzz, Math.sin(t * 63) * buzz * 0.6 + tieBuzz, 0);
  euler.set(-0.055 + pitch * 0.2 - accel * 0.0014, -yaw * 0.46, 0);
  camera.rotation.copy(euler);
  const targetFov = (REDUCE ? 68 : 72) + Math.min(REDUCE ? 5 : 12, Math.max(0, sp - 11) * 0.4);
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-dt * 1.5));
  camera.updateProjectionMatrix();
  const inTun = s >= marks.tun0 && s < marks.tun1;
  const targetExp = inTun ? 0.9 : 1.06;
  renderer.toneMappingExposure += (targetExp - renderer.toneMappingExposure) * (1 - Math.exp(-dt * 1.3));

  const gaps = [5.1, 10.4];
  for (let i = 0; i < train.length; i++) {
    const su = wrap01(rideU - gaps[i] / trackLen);
    frameAt(su, live);
    train[i].position.copy(live.pos);
    train[i].quaternion.copy(live.q);
  }
  const spin = sp * dt / 0.2;
  for (const w of spinners) w.rotation.y -= spin;

  waterMat.uniforms.uTime.value = t;
  flagMatA.uniforms.uTime.value = t;
  mist.rotation.z += dt * 0.012;
  beamPivot.rotation.y = t * 0.45;
  const pulse = 0.82 + Math.sin(t * 2.1) * 0.18;
  beacon.scale.setScalar(pulse);
  beaconGlow.scale.setScalar(6.2 + pulse);
  for (const boat of boats) {
    boat.position.y = Math.sin(t * 0.8 + boat.userData.phase) * 0.12;
    boat.rotation.z = Math.sin(t * 0.6 + boat.userData.phase) * 0.035;
  }
  for (const item of hangLanterns) {
    if (item.userData.base != null) {
      item.position.y = item.userData.base + Math.sin(t * 0.9 + item.userData.phase) * 0.08;
    }
    if (item.userData.follow) {
      item.position.x = item.userData.follow.position.x;
      item.position.y = item.userData.follow.position.y + 1.15;
      item.position.z = item.userData.follow.position.z;
    }
  }
  chainTex.offset.y = -((travel * 0.22) % 1);

  for (let i = 0; i < flyData.length; i++) {
    const f = flyData[i];
    flyPos[i * 3] = f.x + Math.sin(t * 0.35 + f.p) * 0.8;
    flyPos[i * 3 + 1] = f.y + Math.sin(t * 0.8 + f.p) * 0.35;
    flyPos[i * 3 + 2] = f.z + Math.cos(t * 0.3 + f.p) * 0.8;
  }
  flyGeo.attributes.position.needsUpdate = true;

  const emit = sp > 18 ? 2 : 0;
  const splash = sp > 16 && heightAt(s) < 5.4;
  for (let n = 0; n < emit + (splash ? 2 : 0); n++) {
    let slot = -1;
    for (let i = 0; i < STREAKS; i++) if (streakState[i].life <= 0) { slot = i; break; }
    if (slot < 0) break;
    frameAt(rideU, live);
    const side = n % 2 ? 1 : -1;
    const st = streakState[slot];
    st.life = 0.35 + Math.random() * 0.3;
    const px = live.pos.x + live.right.x * side * (0.5 + Math.random() * 0.4) + live.T.x * (1 + Math.random());
    const py = live.pos.y + 0.3 + Math.random() * 0.4;
    const pz = live.pos.z + live.right.z * side * (0.5 + Math.random() * 0.4) + live.T.z * (1 + Math.random());
    streakPos[slot * 3] = px;
    streakPos[slot * 3 + 1] = py;
    streakPos[slot * 3 + 2] = pz;
    const back = splash ? 0.35 : 1;
    st.vx = -live.T.x * sp * back + live.right.x * side * (splash ? 6 : 0.4);
    st.vy = splash ? 2.5 + Math.random() * 2 : (Math.random() - 0.4) * 0.8;
    st.vz = -live.T.z * sp * back + live.right.z * side * (splash ? 6 : 0.4);
  }
  for (let i = 0; i < STREAKS; i++) {
    const st = streakState[i];
    if (st.life <= 0) continue;
    st.life -= dt;
    streakPos[i * 3] += st.vx * dt;
    streakPos[i * 3 + 1] += st.vy * dt;
    streakPos[i * 3 + 2] += st.vz * dt;
    if (st.life <= 0) streakPos[i * 3 + 1] = -40;
  }
  streakGeo.attributes.position.needsUpdate = true;
  streakMat.opacity = sp > 18 ? 0.45 : 0.15;

  const tieIndex = Math.floor(travel / 2.35);
  if (tieIndex !== lastTie) {
    lastTie = tieIndex;
    const onLift = s > marks.lift0 && s < marks.crest;
    playClack(onLift ? 0.16 : sp > 24 ? 0.035 : 0.09, !onLift);
  }
  if (crossed(prevS, s, marks.drop0)) dropSweep();
  if (crossed(prevS, s, marks.helix0)) helixSwell();
  prevS = s;

  if (audioOn && ctx) {
    const nowT = ctx.currentTime;
    windGain.gain.setTargetAtTime(Math.min(0.14, sp * 0.0045), nowT, 0.08);
    windFilter.frequency.setTargetAtTime(280 + sp * 16, nowT, 0.1);
    rumbleGain.gain.setTargetAtTime(Math.min(0.2, 0.02 + sp * 0.005), nowT, 0.08);
    const onLift = s > marks.lift0 && s < marks.crest;
    droneGain.gain.setTargetAtTime(onLift || sp < 12 ? 0.55 : 0.28, nowT, 0.3);
    bellT += dt;
    if (bellT > nextBell) {
      bellT = 0;
      nextBell = 7 + Math.random() * 6;
      buoyBell();
    }
  }

  if (namesOn) {
    const name = sectionName(s);
    if (name !== shown) {
      shown = name;
      sectionEl.textContent = name;
      sectionEl.classList.add('on');
      hideAt = now + 5400;
    } else if (now > hideAt) {
      sectionEl.classList.remove('on');
    }
  }
  if (now - lastHud > 80) {
    lastHud = now;
    spdEl.textContent = String(Math.round(sp * 3.6));
    barEl.style.width = (rideU * 100).toFixed(2) + '%';
  }

  renderer.render(scene, camera);
}

let last = performance.now();
requestAnimationFrame(() => curtain.classList.add('open'));
renderer.setAnimationLoop(loop);
</script>
