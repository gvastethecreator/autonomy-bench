<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Run — First-Person Rollercoaster</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:'Segoe UI',system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;left:18px;top:18px;color:#fff;padding:12px 16px;border-radius:14px;
       background:rgba(10,16,30,.42);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);
       user-select:none;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .hud h1{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ffd166}
  .row{display:flex;gap:20px;align-items:flex-start}
  .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
  .lbl{font-size:10px;opacity:.65;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(ellipse at center,transparent 58%,rgba(5,8,18,.55) 100%)}
  #fade{position:fixed;inset:0;background:#000;transition:opacity 1.6s ease;pointer-events:none}
  #err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffb4b4;display:none;
       background:rgba(30,0,0,.85);padding:16px 22px;border-radius:10px;font:14px/1.5 monospace;
       border:1px solid rgba(255,120,120,.35);max-width:80ch}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <h1>Aurora&nbsp;Run</h1>
  <div class="row">
    <div><div class="val" id="spd">0</div><div class="lbl">km/h</div></div>
    <div><div class="val" id="alt">0</div><div class="lbl">altitude m</div></div>
    <div><div class="val" id="gf">1.0</div><div class="lbl">g-force</div></div>
  </div>
</div>
<div id="vig"></div>
<div id="fade"></div>
<div id="err"></div>
<script>
  window.addEventListener('load',function(){
    setTimeout(function(){
      if(!window.__rc_ok){
        var e=document.getElementById('err');
        e.style.display='block';
        e.textContent='Could not load Three.js from CDN — check your internet connection and reload.';
      }
    },5000);
  });
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
window.__rc_ok = true;

const fail = msg => {
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'Failed to start: ' + msg;
};

try { main(); } catch (err) { fail(err && err.message ? err.message : String(err)); if (window.console) console.error(err); }

function main() {
  const G = 9.81, VMIN = 8, VMAX = 46;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  document.getElementById('app').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xe2eff7, 480, 2300);

  const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 4000);

  const hemi = new THREE.HemisphereLight(0xcfe5ff, 0x63744c, 0.95);
  scene.add(hemi);
  const sunDir = new THREE.Vector3(0.45, 0.62, 0.35).normalize();
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.0);
  sun.position.copy(sunDir).multiplyScalar(600);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9db8ff, 0.4);
  fill.position.set(-300, 180, -260);
  scene.add(fill);

  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1900, 32, 18),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        top:  { value: new THREE.Color(0x2e6ecf) },
        mid:  { value: new THREE.Color(0x9cc8ee) },
        bot:  { value: new THREE.Color(0xeaf3f0) },
        sunD: { value: sunDir }
      },
      vertexShader:
        'varying vec3 vW;\n' +
        'void main(){ vW = normalize(position);\n' +
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader:
        'varying vec3 vW;\n' +
        'uniform vec3 top, mid, bot, sunD;\n' +
        'void main(){\n' +
        '  float h = vW.y;\n' +
        '  vec3 c = mix(bot, mid, smoothstep(-0.02, 0.22, h));\n' +
        '  c = mix(c, top, smoothstep(0.18, 0.75, h));\n' +
        '  float d = max(dot(normalize(vW), normalize(sunD)), 0.0);\n' +
        '  float s = pow(d, 220.0) * 0.9 + pow(d, 14.0) * 0.22;\n' +
        '  c += vec3(1.0, 0.92, 0.75) * s;\n' +
        '  gl_FragColor = vec4(c, 1.0);\n' +
        '}'
    })
  );
  scene.add(sky);

  function terrainH(x, z) {
    const d = Math.hypot(x, z);
    const fall = THREE.MathUtils.smoothstep(d, 240, 650);
    let h = 0;
    h += Math.sin(x * 0.011 + 1.7) * Math.cos(z * 0.009 + 0.4) * 26;
    h += Math.sin(x * 0.031 + z * 0.027) * 7;
    h += Math.sin(x * 0.071 - z * 0.052 + 2.0) * 2.4;
    h *= fall;
    return h;
  }

  const tg = new THREE.PlaneGeometry(2600, 2600, 110, 110);
  tg.rotateX(-Math.PI / 2);
  const pa = tg.attributes.position;
  const cols = [];
  const cLow = new THREE.Color(0x6fae57), cMid = new THREE.Color(0x8fbf6a), cHigh = new THREE.Color(0xa8926b);
  const tmpC = new THREE.Color();
  for (let i = 0; i < pa.count; i++) {
    const x = pa.getX(i), z = pa.getZ(i);
    const y = terrainH(x, z);
    pa.setY(i, y);
    const t = THREE.MathUtils.clamp(y / 34, 0, 1);
    tmpC.copy(cLow).lerp(cMid, THREE.MathUtils.smoothstep(t, 0.05, 0.5));
    tmpC.lerp(cHigh, THREE.MathUtils.smoothstep(t, 0.45, 1));
    const n = (((Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1) + 1) % 1 * 0.07 - 0.035;
    tmpC.offsetHSL(0, 0, n);
    cols.push(tmpC.r, tmpC.g, tmpC.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  scene.add(new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: true })));

  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const cps = [
    V(0, 6, 140), V(0, 18, 116), V(0, 34, 93), V(0, 47, 69), V(2, 50, 53),
    V(10, 38, 34), V(22, 17, 20), V(34, 5, 10), V(50, 12, 4), V(66, 18, 2),
    V(82, 8, 5), V(97, 4, 11), V(106, 6, 25), V(108, 9, 41), V(101, 7, 57), V(87, 5, 67)
  ];
  { // vertical loop in the x-y plane heading -x
    const cx = 66, cy = 13, r = 9, cz = 72, dz = 4;
    for (let k = 0; k <= 12; k++) {
      const th = k / 12 * Math.PI * 2;
      cps.push(V(cx - r * Math.sin(th), cy - r * Math.cos(th), cz + dz * k / 12));
    }
  }
  cps.push(V(56, 4, 75), V(44, 7, 80), V(34, 10, 90), V(26, 10, 104),
           V(18, 9, 120), V(10, 8, 136), V(-2, 7, 148), V(-14, 7, 140));

  const curve = new THREE.CatmullRomCurve3(cps, true, 'centripetal');
  curve.arcLengthDivisions = 3000;
  const L = curve.getLength();

  const N = 2800, ds = L / N;
  const P = [], T = [], S = [], U = [], KR = [], KM = [], SP = [], BK = [];
  const worldUp = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    const u = i / N;
    const p = curve.getPointAt(u);
    const t = curve.getTangentAt(u).normalize();
    const s = new THREE.Vector3().crossVectors(worldUp, t);
    if (s.lengthSq() < 1e-6) s.set(1, 0, 0);
    s.normalize();
    const upv = new THREE.Vector3().crossVectors(t, s).normalize();
    P.push(p); T.push(t); S.push(s); U.push(upv);
  }
  let ymax = 0;
  for (const p of P) if (p.y > ymax) ymax = p.y;
  const dv = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    dv.subVectors(T[(i + 1) % N], T[(i - 1 + N) % N]);
    KR.push(dv.dot(S[i]) / (2 * ds));
    KM.push(dv.length() / (2 * ds));
    SP.push(Math.min(VMAX, Math.sqrt(VMIN * VMIN + 2 * G * Math.max(0, ymax - P[i].y))));
  }
  function smoothRing(a, passes, w) {
    for (let p = 0; p < passes; p++) {
      const src = a.slice();
      for (let i = 0; i < a.length; i++) {
        let sum = 0;
        for (let k = -w; k <= w; k++) sum += src[(i + k + a.length) % a.length];
        a[i] = sum / (2 * w + 1);
      }
    }
  }
  smoothRing(SP, 2, 40);
  for (let i = 0; i < N; i++) {
    BK.push(THREE.MathUtils.clamp(-Math.atan2(KR[i] * SP[i] * SP[i], G), -1.15, 1.15));
  }
  smoothRing(BK, 4, 12);

  const samp = { p: new THREE.Vector3(), t: new THREE.Vector3(), s: new THREE.Vector3(), u: new THREE.Vector3(), bank: 0, v: 0, km: 0 };
  function sample(u) {
    u -= Math.floor(u);
    const f = u * N;
    const i = Math.floor(f) % N, j = (i + 1) % N, a = f - Math.floor(f);
    samp.p.lerpVectors(P[i], P[j], a);
    samp.t.lerpVectors(T[i], T[j], a).normalize();
    samp.s.lerpVectors(S[i], S[j], a).normalize();
    samp.u.lerpVectors(U[i], U[j], a).normalize();
    samp.bank = BK[i] + (BK[j] - BK[i]) * a;
    samp.v = SP[i] + (SP[j] - SP[i]) * a;
    samp.km = KM[i] + (KM[j] - KM[i]) * a;
    return samp;
  }

  const _pa = new THREE.Vector3(), _ta = new THREE.Vector3(), _sa = new THREE.Vector3(), _ua = new THREE.Vector3();
  class OffsetCurve extends THREE.Curve {
    constructor(mode, off) { super(); this.mode = mode; this.off = off; }
    getPoint(t, target = new THREE.Vector3()) {
      const p = curve.getPoint(t, _pa);
      const tn = curve.getTangent(t, _ta);
      _sa.crossVectors(worldUp, tn);
      if (_sa.lengthSq() < 1e-6) _sa.set(1, 0, 0);
      _sa.normalize();
      _ua.crossVectors(tn, _sa).normalize();
      if (this.mode === 'L') return target.copy(p).addScaledVector(_sa, this.off);
      if (this.mode === 'R') return target.copy(p).addScaledVector(_sa, -this.off);
      return target.copy(p).addScaledVector(_ua, -this.off);
    }
  }

  const railMat = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 0.35, roughness: 0.28 });
  const spineMat = new THREE.MeshStandardMaterial({ color: 0xd7263d, metalness: 0.3, roughness: 0.4 });
  const SEG = 1800;
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new OffsetCurve('L', 0.46), SEG, 0.075, 7, true), railMat));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new OffsetCurve('R', 0.46), SEG, 0.075, 7, true), railMat));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new OffsetCurve('D', 0.42), SEG, 0.05, 5, true), spineMat));

  const tieGeo = new THREE.BoxGeometry(1.5, 0.09, 0.26);
  const tieMat = new THREE.MeshStandardMaterial({ color: 0x3c4250, roughness: 0.7, metalness: 0.2 });
  const nTies = Math.max(8, Math.floor(L / 2.1));
  const ties = new THREE.InstancedMesh(tieGeo, tieMat, nTies);
  const dm = new THREE.Object3D();
  const bm = new THREE.Matrix4();
  for (let i = 0; i < nTies; i++) {
    const smp = sample(i / nTies);
    dm.position.copy(smp.p).addScaledVector(smp.u, -0.18);
    dm.quaternion.setFromRotationMatrix(bm.makeBasis(smp.s, smp.u, smp.t));
    dm.scale.set(1, 1, 1);
    dm.updateMatrix();
    ties.setMatrixAt(i, dm.matrix);
  }
  ties.instanceMatrix.needsUpdate = true;
  scene.add(ties);

  const supPts = [];
  for (let i = 0; i < nTies; i += 4) {
    const smp = sample(i / nTies);
    if (smp.p.y > 3.2 && smp.p.y < 46) supPts.push([smp.p.x, smp.p.y, smp.p.z]);
  }
  const supGeo = new THREE.CylinderGeometry(0.28, 0.4, 1, 8);
  const supMat = new THREE.MeshStandardMaterial({ color: 0xb9bec7, roughness: 0.6, metalness: 0.25 });
  const sups = new THREE.InstancedMesh(supGeo, supMat, supPts.length);
  dm.quaternion.identity();
  for (let i = 0; i < supPts.length; i++) {
    const [x, y, z] = supPts[i];
    const h = y - 0.3;
    dm.position.set(x, h / 2, z);
    dm.scale.set(1, h, 1);
    dm.updateMatrix();
    sups.setMatrixAt(i, dm.matrix);
  }
  sups.instanceMatrix.needsUpdate = true;
  scene.add(sups);

  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry(1337);
  const coarse = [];
  for (let i = 0; i < 420; i++) coarse.push(curve.getPointAt(i / 420));
  function clearOf(x, z, r) {
    for (const p of coarse) {
      const dx = p.x - x, dz = p.z - z;
      if (dx * dx + dz * dz < r * r) return false;
    }
    return true;
  }
  const NT = 150;
  const trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 3, 6);
  const leafGeo = new THREE.ConeGeometry(3.2, 8, 7);
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: 0.9 }), NT);
  const leaves = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({ color: 0x3f7d3a, roughness: 0.9, flatShading: true }), NT);
  let placed = 0, guard = 0;
  const lc = new THREE.Color();
  while (placed < NT && guard++ < 3000) {
    const ang = rnd() * Math.PI * 2, rad = 90 + rnd() * 560;
    const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
    if (!clearOf(x, z, 17)) continue;
    const gy = terrainH(x, z);
    const sc = 0.7 + rnd() * 0.9;
    dm.rotation.set(0, rnd() * 6.28, 0);
    dm.scale.setScalar(sc);
    dm.position.set(x, gy + 1.5 * sc, z);
    dm.updateMatrix();
    trunks.setMatrixAt(placed, dm.matrix);
    dm.position.set(x, gy + 6.2 * sc, z);
    dm.updateMatrix();
    leaves.setMatrixAt(placed, dm.matrix);
    lc.setHSL(0.29 + rnd() * 0.06, 0.45, 0.28 + rnd() * 0.1);
    leaves.setColorAt(placed, lc);
    placed++;
  }
  trunks.count = placed; leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  if (leaves.instanceColor) leaves.instanceColor.needsUpdate = true;
  scene.add(trunks, leaves);

  const mGeo = new THREE.ConeGeometry(1, 1, 5);
  const mounts = new THREE.InstancedMesh(mGeo, new THREE.MeshStandardMaterial({ color: 0x7d93a3, roughness: 1, flatShading: true }), 16);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + rnd() * 0.3;
    const rad = 1000 + rnd() * 450;
    const w = 180 + rnd() * 260, h = 140 + rnd() * 220;
    dm.position.set(Math.cos(a) * rad, h * 0.5 - 20, Math.sin(a) * rad);
    dm.scale.set(w, h, w);
    dm.rotation.set(0, rnd() * 6.28, 0);
    dm.updateMatrix();
    mounts.setMatrixAt(i, dm.matrix);
  }
  mounts.instanceMatrix.needsUpdate = true;
  scene.add(mounts);

  let uPos = 0, vel = SP[0] * 0.55, frame = 0;
  let tPrev = performance.now() / 1000;
  const m4 = new THREE.Matrix4(), qRoll = new THREE.Quaternion(),
        look = new THREE.Vector3(), eye = new THREE.Vector3(), upR = new THREE.Vector3();
  const spdEl = document.getElementById('spd'), altEl = document.getElementById('alt'), gfEl = document.getElementById('gf');
  const fadeEl = document.getElementById('fade');

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now() / 1000;
    const dt = Math.min(now - tPrev, 0.05);
    tPrev = now;

    const here = sample(uPos);
    vel += (Math.max(VMIN, here.v) - vel) * Math.min(1, 1.4 * dt);
    uPos = (uPos + vel * dt / L) % 1;

    const s2 = sample(uPos);
    qRoll.setFromAxisAngle(s2.t, s2.bank);
    upR.copy(s2.u).applyQuaternion(qRoll);
    eye.copy(s2.p).addScaledVector(s2.u, 1.55);
    const sh = Math.min(1, vel / VMAX);
    eye.addScaledVector(s2.s, Math.sin(now * 21) * 0.035 * sh);
    eye.addScaledVector(upR, Math.sin(now * 27 + 1.3) * 0.02 * sh);
    const ahead = sample((uPos + 9 / L) % 1);
    look.copy(ahead.p).addScaledVector(ahead.u, 1.15).addScaledVector(ahead.t, 2.0);
    m4.lookAt(eye, look, upR);
    camera.position.copy(eye);
    camera.quaternion.setFromRotationMatrix(m4);

    const fovT = 66 + 15 * Math.min(1, vel / VMAX);
    if (Math.abs(camera.fov - fovT) > 0.05) {
      camera.fov += (fovT - camera.fov) * 0.1;
      camera.updateProjectionMatrix();
    }

    renderer.render(scene, camera);

    if (++frame === 2) fadeEl.style.opacity = '0';
    if (frame % 8 === 0) {
      spdEl.textContent = Math.round(vel * 3.6);
      altEl.textContent = Math.round(s2.p.y);
      gfEl.textContent = Math.min(9.9, 1 + s2.km * vel * vel / G).toFixed(1);
    }
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}
</script>
</body>
</html>
