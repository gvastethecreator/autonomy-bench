<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Midnight // Run</title>
  <style>
    :root {
      --ice: #b8f5ff;
      --cyan: #50d8ff;
      --violet: #9d75ff;
      --pink: #ff4fba;
      --ink: #050611;
      --muted: rgba(190, 208, 244, .58);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 52% 42%, rgba(37, 47, 103, .36) 0%, rgba(8, 9, 24, .86) 42%, #03040c 100%),
        #03040c;
      color: var(--ice);
      font-family: "Bahnschrift", "Arial Narrow", "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: .11;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0, rgba(255,255,255,.12) 1px, transparent 1px, transparent 5px);
      mix-blend-mode: screen;
    }

    #stage, canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(3,4,12,.54) 0%, transparent 23%, transparent 72%, rgba(3,4,12,.78) 100%),
        radial-gradient(ellipse at center, transparent 49%, rgba(2,3,9,.42) 100%);
    }

    .ui {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      padding: clamp(22px, 4vw, 56px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topbar, .bottom-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      text-shadow: 0 0 24px rgba(80, 216, 255, .25);
    }

    .eyebrow {
      color: var(--pink);
      font-size: 10px;
      letter-spacing: .34em;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3.1vw, 46px);
      line-height: .88;
      letter-spacing: .11em;
      font-weight: 800;
    }

    h1 span { color: var(--pink); font-weight: 300; }

    .subline {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .3em;
      font-weight: 600;
    }

    .session {
      text-align: right;
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: .15em;
      color: var(--muted);
    }

    .session strong {
      display: block;
      color: var(--ice);
      font-size: 13px;
      letter-spacing: .24em;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
      color: #88ffc7;
      font-size: 9px;
      letter-spacing: .17em;
    }

    .status i {
      width: 6px;
      height: 6px;
      display: inline-block;
      border-radius: 50%;
      background: #88ffc7;
      box-shadow: 0 0 12px #88ffc7;
      animation: blink 1.7s ease-in-out infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .26; } }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 30px;
      height: 30px;
      transform: translate(-50%, -50%);
      opacity: .42;
    }

    .crosshair::before, .crosshair::after {
      content: "";
      position: absolute;
      background: var(--ice);
      box-shadow: 0 0 9px var(--cyan);
    }

    .crosshair::before { width: 1px; height: 30px; left: 14px; top: 0; }
    .crosshair::after { width: 30px; height: 1px; left: 0; top: 14px; }

    .telemetry {
      min-width: 150px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .speed {
      color: var(--ice);
      font-size: clamp(42px, 6.2vw, 84px);
      line-height: .77;
      letter-spacing: -.065em;
      font-weight: 200;
      text-shadow: 0 0 24px rgba(80,216,255,.32);
    }

    .speed-meta {
      padding-bottom: 3px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.65;
      letter-spacing: .19em;
    }

    .speed-meta b {
      color: var(--pink);
      font-size: 10px;
      font-weight: 700;
    }

    .route {
      margin-left: auto;
      align-self: flex-end;
      text-align: right;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.7;
      letter-spacing: .2em;
    }

    .route strong {
      display: block;
      color: var(--ice);
      font-size: 12px;
      letter-spacing: .24em;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: clamp(22px, 4vw, 56px);
      transform: translateX(-50%);
      color: rgba(203, 224, 255, .54);
      font-size: 9px;
      letter-spacing: .2em;
      white-space: nowrap;
    }

    .controls b {
      color: rgba(184,245,255,.9);
      font-weight: 700;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 61%;
      transform: translate(-50%, -50%);
      color: rgba(184,245,255,.72);
      font-size: 9px;
      letter-spacing: .3em;
      white-space: nowrap;
      opacity: .62;
      transition: opacity .7s ease;
    }

    .message.hidden { opacity: 0; }

    @media (max-width: 620px) {
      .ui { padding: 24px; }
      .session { font-size: 8px; }
      .route { display: none; }
      .controls { bottom: 23px; font-size: 8px; }
      .message { top: 59%; font-size: 8px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div class="ui">
    <div class="topbar">
      <div class="brand">
        <div class="eyebrow">NIGHT DRIVE / 09</div>
        <h1>MIDNIGHT<span>//</span>RUN</h1>
        <p class="subline">NEURAL HIGHWAY &bull; OPEN LOOP</p>
      </div>
      <div class="session">
        <strong>RUN 0047</strong>
        SECTOR 09 &nbsp;&middot;&nbsp; LATENCY 12MS
        <span class="status"><i></i> AUTOPILOT ENGAGED</span>
      </div>
    </div>
    <div class="crosshair"></div>
    <div class="message" id="message">FOLLOW THE LIGHTS &nbsp;&middot;&nbsp; THE ROAD DOESN'T END</div>
    <div class="bottom-bar">
      <div class="telemetry">
        <div class="speed" id="speed">096</div>
        <div class="speed-meta">KM/H<br><b id="distance">00.0</b> KM</div>
      </div>
      <div class="route">
        <strong id="lane">CENTER LANE</strong>
        SIGNAL: <span id="signal">NOMINAL</span><br>
        NIGHT INDEX <span id="index">87</span>%
      </div>
    </div>
    <div class="controls"><b>WASD / ARROW KEYS</b> &nbsp; STEER THE LOOP &nbsp;&nbsp; <b>SPACE</b> &nbsp; BOOST</div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

    const {
      ACESFilmicToneMapping, AdditiveBlending, BackSide, BoxGeometry, BufferGeometry,
      CanvasTexture, Color, ConeGeometry, DirectionalLight, FogExp2, Group, Mesh,
      MeshBasicMaterial, MeshStandardMaterial, PerspectiveCamera, PlaneGeometry,
      Points, PointsMaterial, Scene, ShaderMaterial, SphereGeometry, Sprite,
      SpriteMaterial, Vector3, WebGLRenderer
    } = THREE;

    const stage = document.getElementById("stage");
    const scene = new Scene();
    scene.background = new Color(0x050611);
    scene.fog = new FogExp2(0x080a1b, 0.0095);

    const renderer = new WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    stage.appendChild(renderer.domElement);

    const camera = new PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 650);
    camera.position.set(0, 3.45, 10.2);

    const palette = {
      road: new MeshStandardMaterial({ color: 0x090e1d, roughness: 0.88, metalness: 0.2 }),
      ground: new MeshStandardMaterial({ color: 0x08091a, roughness: 1 }),
      shoulder: new MeshStandardMaterial({ color: 0x11162b, roughness: .74, metalness: .4 }),
      rail: new MeshStandardMaterial({ color: 0x1e2948, roughness: .38, metalness: .74 }),
      dark: new MeshStandardMaterial({ color: 0x0b0d1b, roughness: .57, metalness: .55 }),
      mountainFar: new MeshStandardMaterial({ color: 0x10152e, roughness: 1 }),
      mountainNear: new MeshStandardMaterial({ color: 0x151535, roughness: 1 }),
      cyan: new MeshStandardMaterial({ color: 0x50d8ff, emissive: 0x0e718b, emissiveIntensity: 3.2, roughness: .25, metalness: .2 }),
      whiteGlow: new MeshStandardMaterial({ color: 0xc9fbff, emissive: 0x61dfff, emissiveIntensity: 3.8, roughness: .2 }),
      pink: new MeshStandardMaterial({ color: 0xff4fba, emissive: 0x7e0e54, emissiveIntensity: 3.4, roughness: .3 }),
      red: new MeshStandardMaterial({ color: 0xff244f, emissive: 0xc41439, emissiveIntensity: 4.2, roughness: .2 }),
      car: new MeshStandardMaterial({ color: 0x111831, emissive: 0x080c25, emissiveIntensity: .45, roughness: .35, metalness: .8 }),
      glass: new MeshStandardMaterial({ color: 0x071326, emissive: 0x06132b, emissiveIntensity: 1.2, roughness: .1, metalness: .7, transparent: true, opacity: .82 })
    };

    scene.add(new THREE.AmbientLight(0x424b78, 0.65));
    const moonLight = new DirectionalLight(0x8aa9ff, 1.8);
    moonLight.position.set(-40, 56, -110);
    scene.add(moonLight);
    const horizonLight = new DirectionalLight(0xb22f8d, 0.36);
    horizonLight.position.set(50, 8, -70);
    scene.add(horizonLight);

    function glowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(64, 64, 1, 64, 64, 64);
      gradient.addColorStop(0, "rgba(203,246,255,1)");
      gradient.addColorStop(.15, "rgba(100,224,255,.9)");
      gradient.addColorStop(.45, "rgba(72,142,255,.23)");
      gradient.addColorStop(1, "rgba(24,38,120,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      return new CanvasTexture(canvas);
    }

    function signTexture(kicker, title, accent) {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 220;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(4,6,18,.9)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 5;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);
      ctx.fillStyle = accent;
      ctx.font = "700 24px Arial";
      ctx.letterSpacing = "5px";
      ctx.fillText(kicker, 42, 61);
      ctx.fillStyle = "#e2faff";
      ctx.font = "800 60px Arial Narrow, Arial";
      ctx.fillText(title, 40, 132);
      ctx.fillStyle = "rgba(190,211,242,.7)";
      ctx.font = "600 15px Arial";
      ctx.fillText("KEEP MOVING  /  KEEP LOOKING", 42, 176);
      return new CanvasTexture(canvas);
    }

    const halo = new Sprite(new SpriteMaterial({
      map: glowTexture(), color: 0x7caaff, transparent: true,
      depthWrite: false, blending: AdditiveBlending, opacity: .58
    }));
    halo.position.set(-42, 42, -178);
    halo.scale.set(37, 37, 1);
    scene.add(halo);

    const moon = new Mesh(
      new SphereGeometry(5.7, 32, 24),
      new MeshStandardMaterial({ color: 0x8fa7d8, emissive: 0x334477, emissiveIntensity: .8, roughness: .95 })
    );
    moon.position.set(-42, 42, -178);
    scene.add(moon);

    const starGeometry = new BufferGeometry();
    const starPositions = new Float32Array(1150 * 3);
    for (let i = 0; i < 1150; i++) {
      const radius = 70 + Math.random() * 120;
      const angle = Math.random() * Math.PI * 2;
      starPositions[i * 3] = Math.cos(angle) * radius;
      starPositions[i * 3 + 1] = 8 + Math.random() * 92;
      starPositions[i * 3 + 2] = -20 - Math.random() * 350;
    }
    starGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    const stars = new Points(starGeometry, new PointsMaterial({
      color: 0xa9c9ff, size: .42, transparent: true, opacity: .86, sizeAttenuation: true
    }));
    scene.add(stars);

    function mountainLayer(material, count, spread, zBase, seed) {
      const layer = new Group();
      for (let i = 0; i < count; i++) {
        const height = 16 + ((i * 37 + seed * 19) % 33);
        const width = 18 + ((i * 17 + seed * 13) % 28);
        const mountain = new Mesh(new ConeGeometry(width, height, 6), material);
        mountain.position.set(-spread + i * (spread * 2 / (count - 1)), height / 2 - 1.5, zBase - (i % 3) * 9);
        mountain.rotation.y = i * .71;
        layer.add(mountain);
      }
      scene.add(layer);
      return layer;
    }
    mountainLayer(palette.mountainFar, 18, 145, -220, 4);
    mountainLayer(palette.mountainNear, 12, 120, -152, 9);

    const signA = new Sprite(new SpriteMaterial({
      map: signTexture("SECTOR 09", "OPEN LOOP", "#50d8ff"),
      transparent: true, depthWrite: false
    }));
    signA.position.set(13.8, 8.4, -74);
    signA.scale.set(15, 5.15, 1);
    scene.add(signA);
    const signB = new Sprite(new SpriteMaterial({
      map: signTexture("NO EXIT", "NIGHT//09", "#ff4fba"),
      transparent: true, depthWrite: false
    }));
    signB.position.set(-14.8, 7.2, -142);
    signB.scale.set(12, 4.15, 1);
    scene.add(signB);

    const SEGMENT_LENGTH = 24;
    const SEGMENT_COUNT = 30;
    const WORLD_LENGTH = SEGMENT_LENGTH * SEGMENT_COUNT;
    const roadSegments = [];
    const glowMaterials = [palette.cyan, palette.whiteGlow, palette.pink];

    function createRoadSegment(index) {
      const group = new Group();
      const ground = new Mesh(new BoxGeometry(230, .32, SEGMENT_LENGTH + .5), palette.ground);
      ground.position.y = -.56;
      group.add(ground);

      const asphalt = new Mesh(new BoxGeometry(14.4, .18, SEGMENT_LENGTH + .5), palette.road);
      asphalt.position.y = -.36;
      group.add(asphalt);

      for (const x of [-7.35, 7.35]) {
        const shoulder = new Mesh(new BoxGeometry(.72, .04, SEGMENT_LENGTH + .45), palette.shoulder);
        shoulder.position.set(x, -.245, 0);
        group.add(shoulder);
        const edge = new Mesh(new BoxGeometry(.12, .035, SEGMENT_LENGTH + .4), palette.whiteGlow);
        edge.position.set(x * .955, -.21, 0);
        edge.scale.y = .68;
        group.add(edge);
      }

      for (const x of [-3.6, 0, 3.6]) {
        for (let dash = 0; dash < 3; dash++) {
          const laneMark = new Mesh(new BoxGeometry(x === 0 ? .12 : .09, .035, 4.5), x === 0 ? palette.pink : palette.cyan);
          laneMark.position.set(x, -.2, -SEGMENT_LENGTH / 2 + 3 + dash * 8);
          group.add(laneMark);
        }
      }

      for (const side of [-1, 1]) {
        const rail = new Mesh(new BoxGeometry(.12, .85, SEGMENT_LENGTH), palette.rail);
        rail.position.set(side * 8.25, .24, 0);
        group.add(rail);
        for (let pole = 0; pole < 2; pole++) {
          const pylon = new Group();
          const stem = new Mesh(new BoxGeometry(.07, 3.6, .07), palette.dark);
          stem.position.y = 1.75;
          pylon.add(stem);
          const lamp = new Mesh(new SphereGeometry(.14, 10, 8), glowMaterials[(index + pole + (side === 1 ? 1 : 0)) % glowMaterials.length]);
          lamp.position.y = 3.56;
          pylon.add(lamp);
          const accent = new Mesh(new BoxGeometry(.5, .055, .055), glowMaterials[(index + pole + 1) % glowMaterials.length]);
          accent.position.set(-side * .18, 3.1, 0);
          pylon.add(accent);
          pylon.position.set(side * 9.05, 0, -SEGMENT_LENGTH / 2 + 6 + pole * 12);
          group.add(pylon);
        }
      }
      group.position.z = -index * SEGMENT_LENGTH;
      return group;
    }

    for (let i = 0; i < SEGMENT_COUNT; i++) {
      const segment = createRoadSegment(i);
      roadSegments.push(segment);
      scene.add(segment);
    }

    function createTraffic(color, x, z, cruise) {
      const car = new Group();
      const bodyMaterial = new MeshStandardMaterial({ color, emissive: new Color(color).multiplyScalar(.12), emissiveIntensity: 1.1, roughness: .32, metalness: .7 });
      const body = new Mesh(new BoxGeometry(2.25, .54, 4.1), bodyMaterial);
      body.position.y = .5;
      car.add(body);
      const cabin = new Mesh(new BoxGeometry(1.62, .48, 1.7), palette.glass);
      cabin.position.set(0, .94, -.35);
      car.add(cabin);
      for (const lightX of [-.64, .64]) {
        const tail = new Mesh(new BoxGeometry(.38, .14, .08), palette.red);
        tail.position.set(lightX, .74, 2.08);
        car.add(tail);
        const reflection = new Mesh(new BoxGeometry(.21, .035, .03), palette.whiteGlow);
        reflection.position.set(lightX, .39, -2.07);
        car.add(reflection);
      }
      const underglow = new Mesh(new BoxGeometry(1.5, .025, 2.8), new MeshBasicMaterial({ color: 0x3c78ff, transparent: true, opacity: .24, blending: AdditiveBlending }));
      underglow.position.y = .15;
      car.add(underglow);
      car.position.set(x, 0, z);
      car.userData.cruise = cruise;
      car.userData.lane = x;
      scene.add(car);
      return car;
    }

    const traffic = [
      createTraffic(0x2a356a, -3.6, -43, 21),
      createTraffic(0x4a1e58, 3.6, -96, 25),
      createTraffic(0x263c55, 0, -166, 18),
      createTraffic(0x3b285d, 3.6, -228, 24)
    ];

    const player = new Group();
    const playerBody = new Mesh(new BoxGeometry(4.35, .48, 2.85), palette.car);
    playerBody.position.set(0, .34, 6.75);
    player.add(playerBody);
    const hood = new Mesh(new BoxGeometry(4.7, .16, 2.05), palette.car);
    hood.position.set(0, .68, 5.6);
    player.add(hood);
    const hoodGlow = new Mesh(new BoxGeometry(3.15, .018, 1.4), new MeshStandardMaterial({ color: 0x142349, emissive: 0x143a7a, emissiveIntensity: 1.2, roughness: .22, metalness: .76 }));
    hoodGlow.position.set(0, .77, 5.42);
    player.add(hoodGlow);
    const dash = new Mesh(new BoxGeometry(5.1, .36, .95), palette.dark);
    dash.position.set(0, .15, 8.0);
    player.add(dash);
    const windshield = new Mesh(new PlaneGeometry(3.55, 1.25), palette.glass);
    windshield.position.set(0, 1.18, 7.24);
    windshield.rotation.x = -.24;
    player.add(windshield);
    for (const x of [-1.65, 1.65]) {
      const headlight = new Mesh(new BoxGeometry(.68, .09, .06), palette.whiteGlow);
      headlight.position.set(x, .72, 4.64);
      player.add(headlight);
    }
    player.position.set(0, 0, 0);
    scene.add(player);

    function addHeadlight(x) {
      const light = new THREE.SpotLight(0xa9edff, 3.8, 58, .3, .68, 1.2);
      light.position.set(x, 1.05, 4.65);
      light.target.position.set(x * .7, -.3, -64);
      scene.add(light, light.target);
    }
    addHeadlight(-1.65);
    addHeadlight(1.65);

    const state = {
      speed: 26.7,
      distance: 0,
      steer: 0,
      targetSteer: 0,
      elapsed: 0
    };
    const keys = new Set();
    let pointerSteer = 0;

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "arrowup", "arrowdown", " ", "a", "d", "w", "s"].includes(key)) event.preventDefault();
      keys.add(key);
      document.getElementById("message").classList.add("hidden");
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
    window.addEventListener("pointermove", (event) => {
      pointerSteer = (event.clientX / Math.max(1, window.innerWidth) - .5) * 2;
    });

    const clock = new THREE.Clock();
    const lookTarget = new Vector3();
    const laneNames = ["LEFT LANE", "CENTER LANE", "RIGHT LANE"];

    function updateHud() {
      const kmh = Math.max(0, Math.round(state.speed * 3.6));
      document.getElementById("speed").textContent = String(kmh).padStart(3, "0");
      document.getElementById("distance").textContent = state.distance.toFixed(1).padStart(4, "0");
      const laneIndex = state.steer < -.95 ? 0 : state.steer > .95 ? 2 : 1;
      document.getElementById("lane").textContent = laneNames[laneIndex];
      document.getElementById("signal").textContent = state.speed > 33 ? "BOOST" : "NOMINAL";
      document.getElementById("index").textContent = String(82 + Math.floor((Math.sin(state.elapsed * .7) + 1) * 3));
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), .05);
      state.elapsed += dt;
      const left = keys.has("arrowleft") || keys.has("a");
      const right = keys.has("arrowright") || keys.has("d");
      const boost = keys.has(" ") || keys.has("shift") || keys.has("arrowup") || keys.has("w");
      state.targetSteer = (right ? 1 : 0) - (left ? 1 : 0);
      if (!left && !right && Math.abs(pointerSteer) > .08) state.targetSteer = pointerSteer;
      state.steer += (state.targetSteer - state.steer) * Math.min(1, dt * 6);
      const steerX = THREE.MathUtils.clamp(state.steer * 4.4, -4.2, 4.2);
      player.position.x += (steerX - player.position.x) * Math.min(1, dt * 7);
      player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -state.steer * .055, dt * 5);

      const cruiseTarget = boost ? 42 : 26.7;
      state.speed += (cruiseTarget - state.speed) * Math.min(1, dt * (boost ? 2.5 : 1.4));
      state.distance += state.speed * dt / 1000;

      for (const segment of roadSegments) {
        segment.position.z += state.speed * dt;
        if (segment.position.z > SEGMENT_LENGTH * 1.2) segment.position.z -= WORLD_LENGTH;
      }

      for (const car of traffic) {
        car.position.z += (state.speed - car.userData.cruise) * dt;
        car.position.x += (car.userData.lane - car.position.x) * Math.min(1, dt * 2);
        if (car.position.z > 14) {
          car.position.z = -190 - Math.random() * 105;
          const lane = [-3.6, 0, 3.6][Math.floor(Math.random() * 3)];
          car.userData.lane = lane;
        }
      }

      const pulse = .92 + Math.sin(state.elapsed * 4.6) * .1;
      palette.cyan.emissiveIntensity = 3.2 * pulse;
      palette.whiteGlow.emissiveIntensity = 3.8 * (.96 + Math.sin(state.elapsed * 5.2 + 1) * .08);
      palette.pink.emissiveIntensity = 3.4 * (.94 + Math.sin(state.elapsed * 3.1 + 2) * .11);
      stars.rotation.y = state.elapsed * .002;

      camera.position.x += (player.position.x * .22 - camera.position.x) * Math.min(1, dt * 3.5);
      camera.position.y = 3.45 + Math.sin(state.elapsed * 1.7) * .025;
      camera.rotation.z += (-state.steer * .018 - camera.rotation.z) * Math.min(1, dt * 3);
      lookTarget.set(player.position.x * .16, 1.05, -42);
      camera.lookAt(lookTarget);
      updateHud();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }
    window.addEventListener("resize", onResize);
    updateHud();
    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
