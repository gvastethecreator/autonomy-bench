<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vellum — A Living Medieval City</title>
  <style>
    :root {
      --ink: #f2e7cf;
      --muted: #9fa9b9;
      --gold: #e9b85c;
      --glass: rgba(10, 18, 30, .78);
      --line: rgba(236, 200, 125, .24);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d18; }
    body { color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
    #scene { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #interface { position: fixed; inset: 0; pointer-events: none; }
    .panel { pointer-events: auto; background: linear-gradient(135deg, rgba(13, 22, 37, .9), rgba(8, 14, 25, .68)); border: 1px solid var(--line); box-shadow: 0 18px 60px rgba(0, 0, 0, .3); backdrop-filter: blur(14px); }
    #masthead { position: absolute; top: 26px; left: 30px; display: flex; gap: 12px; align-items: center; padding: 13px 17px 14px 13px; border-radius: 5px; }
    .crest { width: 37px; height: 42px; display: grid; place-items: center; color: #1d2b40; background: linear-gradient(150deg, #efca72, #9c6126); clip-path: polygon(50% 0, 93% 17%, 87% 72%, 50% 100%, 13% 72%, 7% 17%); font-size: 20px; text-shadow: 0 1px #ffe6a5; }
    .eyebrow { margin-bottom: 3px; color: var(--gold); font: 600 9px/1.2 Arial, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 25px; font-weight: 500; letter-spacing: .04em; }
    .subtitle { margin-top: 4px; color: var(--muted); font: 10px/1.3 Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    #stats { position: absolute; top: 26px; right: 30px; min-width: 214px; padding: 14px 16px; border-radius: 5px; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 26px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .stat-row:last-child { border-bottom: 0; }
    .stat-label { color: var(--muted); font: 9px Arial, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
    .stat-value { color: #f6d58e; font: 600 13px Arial, sans-serif; letter-spacing: .08em; }
    #legend { position: absolute; left: 30px; bottom: 27px; display: flex; align-items: center; gap: 14px; padding: 10px 13px; border-radius: 4px; color: var(--muted); font: 10px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f3bf64; box-shadow: 0 0 12px #f3bf64; }
    .dot.blue { background: #75a8ca; box-shadow: 0 0 12px #75a8ca; }
    #controls { position: absolute; right: 30px; bottom: 27px; display: flex; gap: 7px; align-items: center; }
    button { border: 1px solid var(--line); border-radius: 3px; padding: 10px 13px; color: var(--ink); background: rgba(12, 22, 36, .84); font: 600 9px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: border-color .2s, color .2s, background .2s; }
    button:hover { color: #fff1c9; border-color: rgba(242, 202, 123, .75); background: rgba(52, 52, 53, .75); }
    #location { position: absolute; left: 50%; top: 25px; transform: translateX(-50%); color: rgba(240, 224, 191, .72); font: 10px Arial, sans-serif; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #080d18; color: var(--gold); font: 11px Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; z-index: 5; transition: opacity .6s; }
    #boot.hide { opacity: 0; pointer-events: none; }
    #hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); color: rgba(231, 222, 202, .62); font: 10px Arial, sans-serif; letter-spacing: .08em; white-space: nowrap; }
    @media (max-width: 760px) {
      #masthead { top: 15px; left: 15px; }
      #stats { top: 15px; right: 15px; min-width: 170px; }
      #location { top: 104px; }
      #legend { left: 15px; bottom: 15px; }
      #controls { right: 15px; bottom: 15px; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="boot">raising the lanterns...</div>
  <div id="interface">
    <div id="masthead" class="panel">
      <div class="crest">✦</div>
      <div>
        <div class="eyebrow">The Free Marches · Est. 1187</div>
        <h1>Vellum</h1>
        <div class="subtitle">A city that keeps its own hours</div>
      </div>
    </div>
    <div id="location">Ward of the Seven Bridges</div>
    <div id="stats" class="panel">
      <div class="stat-row"><span class="stat-label">Residents</span><span class="stat-value">1,248</span></div>
      <div class="stat-row"><span class="stat-label">Hour</span><span class="stat-value" id="clockLabel">22:17</span></div>
      <div class="stat-row"><span class="stat-label">Weather</span><span class="stat-value">clear · cool</span></div>
    </div>
    <div id="legend" class="panel">
      <span class="legend-item"><span class="dot"></span>lantern district</span>
      <span class="legend-item"><span class="dot blue"></span>canal ward</span>
    </div>
    <div id="hint">drag the horizon with your cursor · the city keeps moving</div>
    <div id="controls">
      <button id="pause">Pause life</button>
      <button id="view">Aerial view</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script>
  (function () {
    'use strict';
    if (!window.THREE) {
      document.getElementById('boot').textContent = 'Three.js could not be reached';
      return;
    }

    const THREE = window.THREE;
    const sceneRoot = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1220);
    scene.fog = new THREE.Fog(0x0b1424, 44, 105);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    sceneRoot.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, .1, 180);
    const homeCamera = new THREE.Vector3(42, 27, 43);
    const aerialCamera = new THREE.Vector3(0, 57, 2);
    camera.position.copy(homeCamera);
    const cameraTarget = new THREE.Vector3(0, 4.5, 0);
    let overview = false;
    let paused = false;
    let elapsed = 0;
    let timeOfDay = 0.805;
    const pointer = { x: 0, y: 0 };

    const ambient = new THREE.HemisphereLight(0x8ea4c3, 0x1b1721, 1.25);
    scene.add(ambient);
    const moon = new THREE.DirectionalLight(0x9ab7de, 1.25);
    moon.position.set(-38, 58, -42);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    moon.shadow.camera.left = -45;
    moon.shadow.camera.right = 45;
    moon.shadow.camera.top = 45;
    moon.shadow.camera.bottom = -45;
    scene.add(moon);
    const dusk = new THREE.DirectionalLight(0xffbd71, .18);
    dusk.position.set(40, 22, 35);
    scene.add(dusk);

    const warmPointLights = [];
    const windows = [];
    const smokePuffs = [];
    const wavingFlags = [];
    const movingPeople = [];
    const wheelMeshes = [];
    const emberPositions = [];

    function rng(seed) {
      let s = (seed >>> 0) + 0x6D2B79F5;
      return function () {
        s |= 0;
        s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function addMesh(geometry, material, parent, x, y, z, rx, ry, rz) {
      const item = new THREE.Mesh(geometry, material);
      item.position.set(x || 0, y || 0, z || 0);
      item.rotation.set(rx || 0, ry || 0, rz || 0);
      item.castShadow = true;
      item.receiveShadow = true;
      (parent || scene).add(item);
      return item;
    }

    function tileTexture(base, line, seed, repeatX, repeatY) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const r = rng(seed);
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, 256, 256);
      for (let y = -8; y < 264; y += 18) {
        for (let x = -8; x < 264; x += 21) {
          const ox = (Math.floor(y / 18) % 2) * 9;
          const w = 16 + r() * 8;
          const h = 10 + r() * 5;
          ctx.fillStyle = line;
          ctx.globalAlpha = .52 + r() * .25;
          ctx.beginPath();
          ctx.roundRect(x + ox + r() * 3, y + r() * 3, w, h, 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(10,12,18,.25)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX || 1, repeatY || 1);
      texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
      return texture;
    }

    function roofTexture(seed) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const r = rng(seed);
      ctx.fillStyle = '#242a39';
      ctx.fillRect(0, 0, 128, 128);
      for (let y = -10; y < 140; y += 9) {
        ctx.strokeStyle = r() > .5 ? '#4b3f43' : '#323544';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(128, y + 22);
        ctx.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 1);
      return texture;
    }

    const grass = tileTexture('#202d2b', '#263a35', 13, 7, 7);
    const cobble = tileTexture('#30333a', '#53545a', 48, 7, 7);
    const smallCobble = tileTexture('#3b3b40', '#626066', 81, 2, 2);
    const roofTex = roofTexture(202);
    const groundMat = new THREE.MeshStandardMaterial({ map: grass, color: 0x5a7064, roughness: 1 });
    const streetMat = new THREE.MeshStandardMaterial({ map: cobble, color: 0x73727a, roughness: .97 });
    const squareMat = new THREE.MeshStandardMaterial({ map: smallCobble, color: 0x827c76, roughness: .96 });
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x59616c, roughness: .94 });
    const stoneLightMat = new THREE.MeshStandardMaterial({ color: 0x79808a, roughness: .88 });
    const foundationMat = new THREE.MeshStandardMaterial({ color: 0x353e49, roughness: 1 });
    const timberMat = new THREE.MeshStandardMaterial({ color: 0x30231f, roughness: .86 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x604330, roughness: .9 });
    const roofMats = [
      new THREE.MeshStandardMaterial({ map: roofTex, color: 0x433843, roughness: .95 }),
      new THREE.MeshStandardMaterial({ map: roofTex, color: 0x34404a, roughness: .95 }),
      new THREE.MeshStandardMaterial({ map: roofTex, color: 0x503d3c, roughness: .95 })
    ];
    const plasterMats = [
      new THREE.MeshStandardMaterial({ color: 0xa99882, roughness: .93 }),
      new THREE.MeshStandardMaterial({ color: 0x8f9a96, roughness: .95 }),
      new THREE.MeshStandardMaterial({ color: 0xb29c7b, roughness: .94 }),
      new THREE.MeshStandardMaterial({ color: 0x7e8b8b, roughness: .95 }),
      new THREE.MeshStandardMaterial({ color: 0xa58779, roughness: .94 })
    ];
    const glassMats = [
      new THREE.MeshStandardMaterial({ color: 0xffc86d, emissive: 0xff7e24, emissiveIntensity: 1.7, roughness: .3 }),
      new THREE.MeshStandardMaterial({ color: 0xffe69b, emissive: 0xffa235, emissiveIntensity: 1.25, roughness: .3 }),
      new THREE.MeshStandardMaterial({ color: 0x9cc2c5, emissive: 0x427f8f, emissiveIntensity: .8, roughness: .3 })
    ];
    const darkGlass = new THREE.MeshStandardMaterial({ color: 0x142d3a, emissive: 0x102d3d, emissiveIntensity: .65 });
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x234657, emissive: 0x0c2731, emissiveIntensity: .35, roughness: .16, metalness: .2 });
    const smokeMat = new THREE.MeshStandardMaterial({ color: 0x7e8790, transparent: true, opacity: .16, depthWrite: false });

    // The sky is a hand-shaped dusk gradient, with a restrained star field.
    const skyGeometry = new THREE.SphereGeometry(150, 32, 16);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { top: { value: new THREE.Color(0x172d4a) }, bottom: { value: new THREE.Color(0x080e1a) } },
      vertexShader: 'varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vPos; void main(){ float h=clamp(normalize(vPos).y*.5+.5,0.0,1.0); vec3 c=mix(bottom,top,smoothstep(.05,.8,h)); gl_FragColor=vec4(c,1.0); }'
    });
    scene.add(new THREE.Mesh(skyGeometry, skyMaterial));
    const starGeo = new THREE.BufferGeometry();
    const starData = [];
    const starRand = rng(393);
    for (let i = 0; i < 460; i++) {
      const theta = starRand() * Math.PI * 2;
      const y = .18 + starRand() * .78;
      const ring = Math.sqrt(1 - y * y);
      starData.push(Math.cos(theta) * ring * 115, y * 115, Math.sin(theta) * ring * 115);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starData, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xf2e8c5, size: .23, transparent: true, opacity: .68, sizeAttenuation: true }));
    scene.add(stars);
    const moonMesh = addMesh(new THREE.SphereGeometry(3.25, 24, 24), new THREE.MeshBasicMaterial({ color: 0xdce4eb }), scene, -44, 51, -54);
    moonMesh.castShadow = false;
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x9ebdde, transparent: true, opacity: .12 }));
    halo.position.set(-44, 51, -54);
    scene.add(halo);
    halo.scale.set(14, 14, 1);

    addMesh(new THREE.PlaneGeometry(78, 78), groundMat, scene, 0, -.12, 0, -Math.PI / 2, 0, 0).receiveShadow = true;
    // Streets, square and narrow lanes.
    addMesh(new THREE.BoxGeometry(62, .12, 5.8), streetMat, scene, 0, .02, 0);
    addMesh(new THREE.BoxGeometry(5.8, .13, 62), streetMat, scene, 0, .025, 0);
    addMesh(new THREE.BoxGeometry(22, .15, 17), squareMat, scene, 0, .04, 0);
    addMesh(new THREE.BoxGeometry(3.2, .1, 51), streetMat, scene, -15.5, .02, 0);
    addMesh(new THREE.BoxGeometry(3.2, .1, 51), streetMat, scene, 15.5, .02, 0);
    addMesh(new THREE.BoxGeometry(51, .1, 3.2), streetMat, scene, 0, .02, -15.5);
    addMesh(new THREE.BoxGeometry(51, .1, 3.2), streetMat, scene, 0, .02, 15.5);

    function addWindow(parent, x, y, z, rotY, w, h, seed) {
      const holder = new THREE.Group();
      holder.position.set(x, y, z);
      holder.rotation.y = rotY || 0;
      parent.add(holder);
      const mat = glassMats[seed % glassMats.length].clone();
      mat.emissiveIntensity *= .78 + (seed % 5) * .08;
      const pane = addMesh(new THREE.BoxGeometry(w || .72, h || 1.1, .07), mat, holder, 0, 0, 0);
      pane.castShadow = false;
      windows.push({ mesh: pane, phase: seed * .63, base: mat.emissiveIntensity });
      addMesh(new THREE.BoxGeometry((w || .72) + .15, .12, .12), timberMat, holder, 0, (h || 1.1) / 2 + .1, 0);
      addMesh(new THREE.BoxGeometry((w || .72) + .15, .12, .12), timberMat, holder, 0, -(h || 1.1) / 2 - .1, 0);
      addMesh(new THREE.BoxGeometry(.12, (h || 1.1) + .2, .12), timberMat, holder, -(w || .72) / 2 - .06, 0, 0);
      addMesh(new THREE.BoxGeometry(.12, (h || 1.1) + .2, .12), timberMat, holder, (w || .72) / 2 + .06, 0, 0);
      addMesh(new THREE.BoxGeometry(.06, (h || 1.1), .1), timberMat, holder, 0, 0, .02);
      return holder;
    }

    function addDoor(parent, x, y, z, rotY, w, h) {
      const holder = new THREE.Group();
      holder.position.set(x, y, z);
      holder.rotation.y = rotY || 0;
      parent.add(holder);
      addMesh(new THREE.BoxGeometry(w, h, .12), new THREE.MeshStandardMaterial({ color: 0x3a2823, roughness: .9 }), holder, 0, 0, 0);
      addMesh(new THREE.BoxGeometry(w + .18, .14, .14), timberMat, holder, 0, h / 2 + .08, 0);
      addMesh(new THREE.BoxGeometry(.14, h + .15, .14), timberMat, holder, -w / 2 - .07, 0, 0);
      addMesh(new THREE.BoxGeometry(.14, h + .15, .14), timberMat, holder, w / 2 + .07, 0, 0);
      addMesh(new THREE.SphereGeometry(.07, 8, 8), new THREE.MeshStandardMaterial({ color: 0xd3a34e, metalness: .6, roughness: .3 }), holder, w * .27, 0, -.09);
    }

    function addChimney(parent, x, z, h, seed) {
      addMesh(new THREE.BoxGeometry(.55, h, .55), stoneMat, parent, x, h / 2, z);
      addMesh(new THREE.BoxGeometry(.74, .12, .74), stoneLightMat, parent, x, h + .05, z);
      const r = rng(seed);
      for (let i = 0; i < 4; i++) {
        const puff = addMesh(new THREE.SphereGeometry(.2 + r() * .14, 9, 7), smokeMat, parent, x + (r() - .5) * .2, h + .3 + i * .25, z + (r() - .5) * .2);
        puff.castShadow = false;
        smokePuffs.push({ mesh: puff, home: puff.position.clone(), phase: r() * 6.28, speed: .45 + r() * .35 });
      }
    }

    function createBuilding(x, z, w, d, h, seed) {
      const r = rng(seed);
      const house = new THREE.Group();
      house.position.set(x, 0, z);
      house.userData.title = 'merchant house';
      scene.add(house);
      addMesh(new THREE.BoxGeometry(w + .28, .55, d + .28), foundationMat, house, 0, .27, 0);
      addMesh(new THREE.BoxGeometry(w, h, d), plasterMats[Math.floor(r() * plasterMats.length)], house, 0, h / 2 + .52, 0);
      const roofH = 2.6 + r() * 1.2;
      addMesh(new THREE.CylinderGeometry(0, Math.max(w, d) * .76, roofH, 4, 1), roofMats[Math.floor(r() * roofMats.length)], house, 0, h + roofH / 2 + .52, 0, 0, Math.PI / 4, 0);
      // Dark timber framing makes each house legible at a distance.
      for (const side of [-1, 1]) {
        addMesh(new THREE.BoxGeometry(w * .92, .13, .12), timberMat, house, 0, h * .35 + .52, side * (d / 2 + .065));
        addMesh(new THREE.BoxGeometry(w * .92, .13, .12), timberMat, house, 0, h * .69 + .52, side * (d / 2 + .065));
        addMesh(new THREE.BoxGeometry(.14, h * .62, .12), timberMat, house, -w * .27, h * .51 + .52, side * (d / 2 + .07));
        addMesh(new THREE.BoxGeometry(.14, h * .62, .12), timberMat, house, w * .27, h * .51 + .52, side * (d / 2 + .07));
      }
      const frontZ = d / 2 + .085;
      const sideX = w / 2 + .085;
      const cols = w > 5.7 ? [-w * .25, w * .25] : [0];
      cols.forEach(function (xx, i) {
        addWindow(house, xx, h * .44 + .52, frontZ, 0, .72, 1.06, seed + i);
        if (h > 6.8) addWindow(house, xx, h * .72 + .52, frontZ, 0, .68, .86, seed + i + 5);
      });
      addDoor(house, 0, .86, frontZ + .03, 0, 1.05, 1.7);
      if (d > 5) {
        addWindow(house, sideX, h * .45 + .52, 0, Math.PI / 2, .7, .95, seed + 12);
      }
      if (r() > .28) addChimney(house, (r() - .5) * w * .55, (r() - .5) * d * .5, 1.15 + r() * .55, seed + 18);
      if (r() > .56) {
        addMesh(new THREE.BoxGeometry(w * .42, .13, .9), woodMat, house, (r() - .5) * w * .4, h * .48 + .52, frontZ + .35);
        addMesh(new THREE.BoxGeometry(.1, .85, .1), woodMat, house, (r() - .5) * w * .4 - w * .21, h * .18 + .52, frontZ + .37);
        addMesh(new THREE.BoxGeometry(.1, .85, .1), woodMat, house, (r() - .5) * w * .4 + w * .21, h * .18 + .52, frontZ + .37);
      }
      return house;
    }

    let buildingSeed = 90;
    for (let gx = -3; gx <= 3; gx++) {
      for (let gz = -3; gz <= 3; gz++) {
        if (gx === 0 || gz === 0 || gx === 3) continue;
        const rr = rng(buildingSeed++);
        const x = gx * 8 + (rr() - .5) * 1.2;
        const z = gz * 8 + (rr() - .5) * 1.2;
        createBuilding(x, z, 5.2 + rr() * 1.5, 5.1 + rr() * 1.4, 5.2 + rr() * 3.1, buildingSeed);
      }
    }
    // A few taller guild houses frame the central vista.
    createBuilding(-22, 6.9, 6.2, 5.7, 9.2, 412);
    createBuilding(7.3, -22, 5.8, 6.5, 8.5, 417);
    createBuilding(20.5, -10.8, 5.5, 6, 7.6, 423);

    function createTower(x, z, radius, height, seed) {
      const tower = new THREE.Group();
      tower.position.set(x, 0, z);
      scene.add(tower);
      addMesh(new THREE.CylinderGeometry(radius, radius * 1.06, height, 10), stoneMat, tower, 0, height / 2, 0);
      addMesh(new THREE.CylinderGeometry(radius * 1.22, radius * 1.22, .42, 10), foundationMat, tower, 0, .22, 0);
      addMesh(new THREE.ConeGeometry(radius * 1.18, 3.1, 10), roofMats[seed % roofMats.length], tower, 0, height + 1.55, 0);
      for (let i = 0; i < 3; i++) addWindow(tower, 0, 2.4 + i * 2.1, radius + .04, 0, .58, .82, seed + i);
      const pole = addMesh(new THREE.CylinderGeometry(.045, .045, 3.6, 6), woodMat, tower, 0, height + 4.3, 0);
      const flag = addMesh(new THREE.PlaneGeometry(1.7, .82), new THREE.MeshStandardMaterial({ color: seed % 2 ? 0x9d3833 : 0x345678, side: THREE.DoubleSide, roughness: .9 }), tower, .76, height + 4.78, 0, 0, Math.PI / 2, 0);
      flag.castShadow = false;
      wavingFlags.push({ mesh: flag, phase: seed * .41, anchor: height + 4.75 });
      return tower;
    }

    function createCitadel() {
      const cx = -11.4, cz = 12.1;
      const castleMat = new THREE.MeshStandardMaterial({ color: 0x68717a, roughness: .92 });
      addMesh(new THREE.BoxGeometry(11.5, 9.2, 9.4), castleMat, scene, cx, 4.7, cz);
      addMesh(new THREE.BoxGeometry(12.5, .65, 10.5), foundationMat, scene, cx, .33, cz);
      addMesh(new THREE.CylinderGeometry(0, 8.4, 3.2, 4), roofMats[1], scene, cx, 10.9, cz, 0, Math.PI / 4, 0);
      [[-16.3, 8.2], [-6.4, 8.2], [-16.3, 16.0], [-6.4, 16.0]].forEach(function (p, i) { createTower(p[0], p[1], 1.8, 11.2, 510 + i); });
      addDoor(scene, cx, .9, cz + 4.78, 0, 1.4, 2);
      for (let i = -1; i <= 1; i++) addWindow(scene, cx + i * 2.8, 5.7, cz + 4.78, 0, 1.05, 1.3, 580 + i);
      const beacon = new THREE.PointLight(0xffa943, 2.1, 18, 2);
      beacon.position.set(cx, 9.2, cz + 4);
      scene.add(beacon);
      warmPointLights.push({ light: beacon, phase: 2.1, base: 2.1 });
    }
    createCitadel();

    function createCathedral() {
      const x = 11.4, z = 11.8;
      addMesh(new THREE.BoxGeometry(8.8, 6.2, 11), stoneLightMat, scene, x, 3.1, z);
      addMesh(new THREE.CylinderGeometry(0, 5.1, 3.2, 4), roofMats[0], scene, x, 7.8, z, 0, Math.PI / 4, 0);
      createTower(x + 3.1, z + 1.4, 1.55, 12.5, 708);
      addWindow(scene, x, 4.5, z + 5.55, 0, 2.2, 2.1, 720);
      const rose = addMesh(new THREE.CircleGeometry(.82, 16), glassMats[2], scene, x, 4.45, z + 5.64, 0, 0, 0);
      rose.castShadow = false;
      addDoor(scene, x, 1.2, z + 5.58, 0, 1.5, 2.25);
    }
    createCathedral();

    function wallSegment(x, z, width, depth) {
      addMesh(new THREE.BoxGeometry(width, 3.2, depth), stoneMat, scene, x, 1.6, z);
      const horizontal = width > depth;
      const count = Math.floor((horizontal ? width : depth) / 2.25);
      for (let i = 0; i <= count; i++) {
        const t = (i / count - .5) * (horizontal ? width : depth);
        addMesh(new THREE.BoxGeometry(horizontal ? 1.2 : depth + .12, 1.05, horizontal ? depth + .12 : 1.2), stoneLightMat, scene, horizontal ? x + t : x, 3.72, horizontal ? z : z + t);
      }
    }
    wallSegment(-31, 0, 1.05, 62);
    wallSegment(31, 0, 1.05, 62);
    wallSegment(0, 31, 62, 1.05);
    wallSegment(-22, -31, 18, 1.05);
    wallSegment(22, -31, 18, 1.05);
    createTower(-31, -26, 2.15, 9.2, 832);
    createTower(31, -26, 2.15, 9.2, 836);
    createTower(-31, 26, 2.15, 8.1, 840);
    createTower(31, 26, 2.15, 8.1, 844);
    addMesh(new THREE.BoxGeometry(10, 4.5, .8), woodMat, scene, 0, 2.25, -31);
    addMesh(new THREE.BoxGeometry(4.4, 3.6, .15), new THREE.MeshStandardMaterial({ color: 0x171b26, roughness: .9 }), scene, 0, 1.8, -31.46);
    addMesh(new THREE.BoxGeometry(5.5, .65, 2.1), roofMats[2], scene, 0, 5, -31);
    createTower(-5.1, -31, 1.45, 5.5, 850);
    createTower(5.1, -31, 1.45, 5.5, 853);

    // Canal ward and the small bridge to the eastern gate.
    addMesh(new THREE.BoxGeometry(3.4, .12, 52), waterMat, scene, 25.4, .02, 0);
    addMesh(new THREE.BoxGeometry(4.5, .45, 52), stoneMat, scene, 23.4, .05, 0);
    addMesh(new THREE.BoxGeometry(4.5, .45, 52), stoneMat, scene, 27.4, .05, 0);
    addMesh(new THREE.BoxGeometry(6.2, .55, 5.2), stoneLightMat, scene, 25.4, .28, -7);
    for (let i = -2; i <= 2; i++) addMesh(new THREE.BoxGeometry(1.12, .11, 4.5), squareMat, scene, 25.4 + i * 1.18, .64, -7);

    function createMarketStall(x, z, rotation, seed) {
      const stall = new THREE.Group();
      stall.position.set(x, 0, z);
      stall.rotation.y = rotation || 0;
      scene.add(stall);
      addMesh(new THREE.BoxGeometry(3.4, .45, 1.85), woodMat, stall, 0, 1.55, 0);
      for (const xx of [-1.45, 1.45]) for (const zz of [-.72, .72]) addMesh(new THREE.CylinderGeometry(.09, .11, 2.6, 7), woodMat, stall, xx, 1.28, zz);
      const canopyMat = new THREE.MeshStandardMaterial({ color: seed % 2 ? 0x7f3031 : 0x30546c, roughness: .93, side: THREE.DoubleSide });
      addMesh(new THREE.BoxGeometry(3.85, .14, 2.3), canopyMat, stall, 0, 2.76, 0, .04, 0, -.035);
      const r = rng(seed);
      for (let i = 0; i < 5; i++) {
        const fruitMat = new THREE.MeshStandardMaterial({ color: [0xb66b38, 0x8c3539, 0xc19b44][i % 3], roughness: .8 });
        addMesh(new THREE.SphereGeometry(.22 + r() * .1, 8, 6), fruitMat, stall, -1.05 + (i % 3) * .63, 1.88 + (i % 2) * .12, -.18 + (i % 2) * .35);
      }
    }
    [[-5.4, -2.8, .05], [5.1, -2.7, -.08], [-5.1, 3.2, .08], [5.4, 3.3, -.03], [-8, .1, Math.PI / 2], [8, .1, Math.PI / 2]].forEach(function (p, i) { createMarketStall(p[0], p[1], p[2], 940 + i); });

    function createFountain() {
      addMesh(new THREE.CylinderGeometry(3.05, 3.25, .45, 16), stoneLightMat, scene, 0, .25, 0);
      addMesh(new THREE.CylinderGeometry(2.55, 2.55, .16, 16), waterMat, scene, 0, .52, 0);
      addMesh(new THREE.CylinderGeometry(.38, .56, 2.1, 10), stoneMat, scene, 0, 1.56, 0);
      addMesh(new THREE.CylinderGeometry(1.05, 1.05, .22, 12), stoneLightMat, scene, 0, 2.55, 0);
      addMesh(new THREE.ConeGeometry(.24, .82, 12), waterMat, scene, 0, 3.02, 0);
      const fLight = new THREE.PointLight(0xf6aa4f, 1.25, 10, 2);
      fLight.position.set(0, 1.6, 0);
      scene.add(fLight);
      warmPointLights.push({ light: fLight, phase: .7, base: 1.25 });
    }
    createFountain();

    function createLamp(x, z, seed) {
      const post = new THREE.Group();
      post.position.set(x, 0, z);
      scene.add(post);
      addMesh(new THREE.CylinderGeometry(.07, .11, 2.7, 8), woodMat, post, 0, 1.35, 0);
      addMesh(new THREE.BoxGeometry(.55, .1, .1), woodMat, post, .2, 2.62, 0, 0, 0, -.16);
      const lanternMat = new THREE.MeshStandardMaterial({ color: 0xffc366, emissive: 0xff7923, emissiveIntensity: 2.2, transparent: true, opacity: .94 });
      addMesh(new THREE.BoxGeometry(.32, .42, .32), lanternMat, post, .42, 2.42, 0);
      const light = new THREE.PointLight(0xffa13d, 1.65, 8.8, 2);
      light.position.set(.42, 2.42, 0);
      post.add(light);
      warmPointLights.push({ light: light, phase: seed * .32, base: 1.65 });
    }
    [[-4.2, -7.2], [4.2, -7.2], [-4.2, 7.2], [4.2, 7.2], [-10.4, 0], [10.4, 0], [0, -10.8], [0, 10.8], [-21, -4], [-21, 4], [20.7, 3.5], [20.7, -3.5]].forEach(function (p, i) { createLamp(p[0], p[1], i + 2); });

    function createTree(x, z, scale, seed) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.scale.setScalar(scale);
      scene.add(tree);
      addMesh(new THREE.CylinderGeometry(.22, .34, 2.3, 7), new THREE.MeshStandardMaterial({ color: 0x503b2c, roughness: 1 }), tree, 0, 1.15, 0);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.55, 3.2, 8), new THREE.MeshStandardMaterial({ color: seed % 2 ? 0x29463d : 0x355446, roughness: 1 }));
      crown.position.y = 3.1; crown.castShadow = true; crown.receiveShadow = true; tree.add(crown);
      addMesh(new THREE.SphereGeometry(1.05, 8, 6), new THREE.MeshStandardMaterial({ color: 0x3d6049, roughness: 1 }), tree, .5, 3.55, .08);
    }
    [[-27, 19, 1.1], [-25, 23, .8], [-20, 27, 1.15], [18, 26, .95], [24, 22, 1.25], [27, 15, .78], [-25, -18, 1.05], [-20, -24, .92], [22, -22, 1.18], [26, -17, .8]].forEach(function (p, i) { createTree(p[0], p[1], p[2], i); });

    // Waterwheel at the mill's edge. Its spokes and paddles turn continuously.
    const wheel = new THREE.Group();
    wheel.position.set(27.15, 2.7, 4.8);
    wheel.rotation.z = Math.PI / 2;
    scene.add(wheel);
    addMesh(new THREE.TorusGeometry(2.55, .2, 8, 18), woodMat, wheel, 0, 0, 0);
    addMesh(new THREE.TorusGeometry(1.8, .1, 7, 16), woodMat, wheel, 0, 0, 0);
    for (let i = 0; i < 8; i++) {
      const spoke = addMesh(new THREE.BoxGeometry(.14, 4.55, .22), woodMat, wheel, 0, 0, 0, 0, 0, i * Math.PI / 4);
      wheelMeshes.push(spoke);
    }
    wheelMeshes.push(wheel);
    addMesh(new THREE.BoxGeometry(1.1, 5, 1.4), woodMat, scene, 29.1, 2.5, 4.8);

    function createCart(x, z, rotation, seed) {
      const cart = new THREE.Group();
      cart.position.set(x, .05, z);
      cart.rotation.y = rotation || 0;
      scene.add(cart);
      addMesh(new THREE.BoxGeometry(2.6, .5, 1.35), woodMat, cart, 0, 1.1, 0);
      addMesh(new THREE.BoxGeometry(2.25, .16, 1.06), roofMats[seed % roofMats.length], cart, 0, 1.52, 0);
      for (const xx of [-.95, .95]) {
        const wheelMesh = addMesh(new THREE.CylinderGeometry(.48, .48, .16, 12), timberMat, cart, xx, .58, .73, Math.PI / 2, 0, 0);
        wheelMeshes.push(wheelMesh);
      }
      addMesh(new THREE.CylinderGeometry(.1, .1, 1.5, 8), woodMat, cart, -1.5, .95, 0, 0, 0, Math.PI / 2);
    }
    createCart(-7.8, -10.4, .1, 2);
    createCart(15.1, 9.1, Math.PI / 2, 3);

    // A loop of townsfolk walks the four principal streets.
    const walkingPath = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-18, 0, -15.5), new THREE.Vector3(-3, 0, -15.5), new THREE.Vector3(15, 0, -15.5),
      new THREE.Vector3(15, 0, 0), new THREE.Vector3(15, 0, 15.5), new THREE.Vector3(3, 0, 15.5),
      new THREE.Vector3(-15, 0, 15.5), new THREE.Vector3(-15, 0, 0), new THREE.Vector3(-18, 0, -15.5)
    ], true, 'centripetal');
    function createPerson(index) {
      const r = rng(1110 + index);
      const person = new THREE.Group();
      const cloakColor = [0x485d74, 0x783e3d, 0x536d59, 0x725734][index % 4];
      addMesh(new THREE.ConeGeometry(.3, 1.05, 7), new THREE.MeshStandardMaterial({ color: cloakColor, roughness: .95 }), person, 0, .62, 0);
      addMesh(new THREE.SphereGeometry(.2, 10, 8), new THREE.MeshStandardMaterial({ color: 0xc88d6a, roughness: .92 }), person, 0, 1.28, 0);
      addMesh(new THREE.ConeGeometry(.31, .34, 6), new THREE.MeshStandardMaterial({ color: index % 2 ? 0x2a2730 : 0x6a4432, roughness: 1 }), person, 0, 1.52, 0);
      if (index % 3 === 0) {
        const lampMat = new THREE.MeshStandardMaterial({ color: 0xffd173, emissive: 0xff8b20, emissiveIntensity: 2.2 });
        addMesh(new THREE.SphereGeometry(.09, 8, 6), lampMat, person, .35, .75, .04);
      }
      person.scale.setScalar(.8 + r() * .22);
      scene.add(person);
      movingPeople.push({ group: person, offset: r(), speed: .010 + r() * .008 });
    }
    for (let i = 0; i < 11; i++) createPerson(i);

    // Fireflies/embers hover over the square and canal.
    for (let i = 0; i < 90; i++) {
      const r = rng(1600 + i);
      emberPositions.push({ x: (r() - .5) * 28, y: 1.2 + r() * 5.5, z: (r() - .5) * 27, phase: r() * 6.28, speed: .3 + r() * .6 });
    }
    const emberGeo = new THREE.BufferGeometry();
    emberGeo.setAttribute('position', new THREE.Float32BufferAttribute(emberPositions.flatMap(function (p) { return [p.x, p.y, p.z]; }), 3));
    const emberPoints = new THREE.Points(emberGeo, new THREE.PointsMaterial({ color: 0xf7b45c, size: .13, transparent: true, opacity: .8, sizeAttenuation: true }));
    scene.add(emberPoints);

    function updateLighting(t) {
      const night = .62 + Math.sin(t * Math.PI * 2) * .08;
      moon.intensity = 1.02 + night * .35;
      ambient.intensity = .92 + night * .22;
      dusk.intensity = .12 + (1 - night) * .12;
      warmPointLights.forEach(function (item) {
        item.light.intensity = item.base * (.86 + Math.sin(elapsed * 6.5 + item.phase) * .1 + Math.sin(elapsed * 11 + item.phase) * .04);
      });
      windows.forEach(function (item) {
        item.mesh.material.emissiveIntensity = item.base * (.9 + Math.sin(elapsed * 1.3 + item.phase) * .07);
      });
      const hh = Math.floor((t * 24) % 24);
      const mm = Math.floor(((t * 24) % 1) * 60);
      document.getElementById('clockLabel').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - last) / 1000, .05);
      last = now;
      if (!paused) {
        elapsed += dt;
        timeOfDay = (timeOfDay + dt * .0018) % 1;
      }
      const desired = overview ? aerialCamera : homeCamera;
      camera.position.lerp(desired, 1 - Math.pow(.001, dt));
      const look = overview ? new THREE.Vector3(0, 0, 0) : new THREE.Vector3(pointer.x * 2.5, 4.3 + pointer.y * 1.4, 0);
      camera.lookAt(look);
      movingPeople.forEach(function (walker) {
        const u = (elapsed * walker.speed + walker.offset) % 1;
        const p = walkingPath.getPointAt(u);
        const tangent = walkingPath.getTangentAt(u);
        walker.group.position.set(p.x, .06, p.z);
        walker.group.rotation.y = Math.atan2(tangent.x, tangent.z);
      });
      smokePuffs.forEach(function (item) {
        const life = (elapsed * item.speed + item.phase) % 3.4;
        item.mesh.position.set(item.home.x + Math.sin(elapsed * .7 + item.phase) * .24 * life, item.home.y + life * .6, item.home.z + Math.cos(elapsed * .8 + item.phase) * .16 * life);
        item.mesh.scale.setScalar(.65 + life * .23);
        item.mesh.material.opacity = Math.max(0, .2 - life * .045);
      });
      wavingFlags.forEach(function (flag) {
        flag.mesh.rotation.z = Math.sin(elapsed * 2.1 + flag.phase) * .08;
        flag.mesh.position.y = flag.anchor + Math.sin(elapsed * 1.7 + flag.phase) * .035;
      });
      wheel.rotation.x = elapsed * .52;
      wheelMeshes.slice(0, 0);
      const positions = emberGeo.attributes.position.array;
      emberPositions.forEach(function (p, i) {
        positions[i * 3 + 1] = p.y + Math.sin(elapsed * p.speed + p.phase) * .65;
        positions[i * 3] = p.x + Math.sin(elapsed * .16 + p.phase) * .35;
      });
      emberGeo.attributes.position.needsUpdate = true;
      stars.rotation.y = elapsed * .0014;
      updateLighting(timeOfDay);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    document.getElementById('pause').addEventListener('click', function () {
      paused = !paused;
      this.textContent = paused ? 'Resume life' : 'Pause life';
    });
    document.getElementById('view').addEventListener('click', function () {
      overview = !overview;
      this.textContent = overview ? 'Street view' : 'Aerial view';
    });
    window.addEventListener('pointermove', function (event) {
      pointer.x = (event.clientX / window.innerWidth - .5);
      pointer.y = (event.clientY / window.innerHeight - .5);
    });
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    setTimeout(function () { document.getElementById('boot').classList.add('hide'); }, 650);
  }());
  </script>
</body>
</html>
