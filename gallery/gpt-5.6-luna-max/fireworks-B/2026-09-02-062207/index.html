<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05071b">
  <title>Midnight Pyrotechnics</title>
  <style>
    :root{color-scheme:dark;--text:#f3f5ff;--muted:#9da6c9;--line:rgba(225,232,255,.16);--panel:rgba(10,14,39,.68);--cyan:#98ecff;--pink:#f2a2ff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#040516;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .stage{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 37%,rgba(56,63,165,.17),transparent 40%),linear-gradient(180deg,#050617 0%,#080a25 54%,#11142e 100%)}
    .stage:before{content:"";position:absolute;inset:-20% -5% 12%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 88%,rgba(114,80,213,.13),transparent 54%);filter:blur(24px)}
    canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:crosshair}
    .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(1,2,12,.48) 100%)}
    .header{position:absolute;z-index:2;top:clamp(22px,4.8vw,60px);left:clamp(20px,5vw,72px);right:clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .brand{display:grid;gap:10px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .live{width:7px;height:7px;border-radius:99px;background:#8bfbd1;box-shadow:0 0 0 4px rgba(139,251,209,.1),0 0 18px #8bfbd1;animation:pulse 2.2s ease-in-out infinite}
    h1{margin:0;font-size:clamp(34px,5.1vw,68px);font-weight:300;letter-spacing:-.06em;line-height:.94;text-shadow:0 3px 34px rgba(115,139,255,.18)}
    h1 em{color:#f6b4ff;font-style:normal}.tagline{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
    .time{text-align:right;display:grid;gap:7px;padding-top:2px;color:rgba(232,237,255,.8);font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.12em}
    .time small{color:var(--muted);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
    .side-note{position:absolute;z-index:2;top:50%;left:clamp(18px,3vw,40px);transform:translateY(-50%) rotate(-90deg) translateX(-50%);transform-origin:left top;color:rgba(179,189,230,.5);font-size:9px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
    .side-note:after{content:"";display:inline-block;width:62px;height:1px;margin:0 0 3px 12px;background:linear-gradient(90deg,rgba(179,189,230,0),rgba(179,189,230,.55))}
    .dock{position:absolute;z-index:3;right:clamp(16px,4.6vw,72px);bottom:clamp(18px,4.2vw,52px);width:min(366px,calc(100vw - 32px));padding:15px 16px 14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(23,28,67,.8),rgba(8,11,34,.76));box-shadow:0 18px 55px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(130%)}
    .dock-head,.dock-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.dock-head{margin-bottom:14px}.label{color:rgba(234,239,255,.83);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.count{color:#a8f3ff;font-size:11px;font-variant-numeric:tabular-nums}
    .actions{display:flex;gap:8px}button{border:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .launch{min-width:136px;padding:10px 15px;border:1px solid rgba(178,239,255,.34);border-radius:10px;background:linear-gradient(110deg,#82dcff,#ca9dff 82%);color:#080a26;font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 22px rgba(126,204,255,.25),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .16s ease,filter .16s ease}
    .launch:hover{filter:brightness(1.08);transform:translateY(-1px)}.launch:active{transform:translateY(1px) scale(.98)}
    .icon{width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(225,232,255,.17);border-radius:10px;background:rgba(255,255,255,.055);color:#dfe7ff;transition:background .16s ease,border-color .16s ease,transform .16s ease}.icon:hover{background:rgba(255,255,255,.12);border-color:rgba(225,232,255,.35);transform:translateY(-1px)}.icon svg{width:15px;height:15px;fill:currentColor}
    .range{display:flex;align-items:center;gap:10px;margin-top:14px;color:#a4aed1;font-size:10px}.range input{width:100%;height:4px;appearance:none;border-radius:99px;outline:0;background:linear-gradient(90deg,#8ce6ff 0%,#9ce4ff 42%,rgba(255,255,255,.14) 42%)}.range input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#effaff;border:2px solid #81dfff;box-shadow:0 0 12px rgba(138,229,255,.66)}.range input::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#effaff;border:2px solid #81dfff}
    .palette{display:flex;gap:8px;align-items:center}.swatch{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.38);opacity:.67;box-shadow:0 0 10px currentColor;transition:transform .15s ease,opacity .15s ease}.swatch.active,.swatch:hover{opacity:1;transform:scale(1.3)}.aurora{color:#83eaff;background:#83eaff}.orchid{color:#f49bff;background:#f49bff}.ember{color:#ffb367;background:#ffb367}.spectrum{color:#fff;background:linear-gradient(135deg,#84e9ff,#ea9dff,#ffd185)}
    .hint{position:absolute;z-index:2;left:50%;bottom:clamp(18px,5vw,56px);transform:translateX(-50%);color:rgba(195,205,240,.52);font-size:10px;letter-spacing:.08em;white-space:nowrap;pointer-events:none;transition:opacity .5s ease}.hint strong{color:rgba(229,237,255,.82)}
    .toast{position:absolute;z-index:5;top:50%;left:50%;padding:9px 14px;border:1px solid rgba(211,229,255,.2);border-radius:999px;background:rgba(10,13,37,.68);color:rgba(243,247,255,.9);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transform:translate(-50%,-42%) scale(.95);pointer-events:none;backdrop-filter:blur(10px);transition:opacity .2s ease,transform .2s ease}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    @keyframes pulse{0%,100%{opacity:.65;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
    @media(max-width:620px){.header{top:22px}.time,.side-note{display:none}.dock{left:14px;right:14px;bottom:14px;width:auto}.hint{bottom:147px;font-size:9px}h1{font-size:clamp(36px,11vw,54px)}}@media(prefers-reduced-motion:reduce){.live{animation:none}}
  </style>
</head>
<body>
  <main class="stage" aria-label="Interactive midnight fireworks display">
    <canvas id="sky" aria-label="Fireworks canvas. Click anywhere in the sky to launch."></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="header">
      <div class="brand">
        <div class="eyebrow"><span class="live"></span> Live sky · 00:00:00</div>
        <h1>Midnight<br><em>Pyrotechnics</em></h1>
        <p class="tagline">A quiet city. A very loud sky.<br>Make your own constellation.</p>
      </div>
      <div class="time"><span id="clock">00:00:00</span><small>Your local sky</small></div>
    </header>
    <div class="side-note">click the sky to compose a moment</div>
    <div class="hint" id="hint"><strong>Click anywhere</strong> to launch · <strong>Space</strong> for a surprise</div>
    <section class="dock" aria-label="Fireworks controls">
      <div class="dock-head"><div class="label">Tonight's show <span class="count" id="count">00</span></div><div class="actions">
        <button class="icon" id="pause" type="button" aria-label="Pause show" title="Pause show"><svg id="pauseSvg" viewBox="0 0 24 24"><path d="M7 5.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-13Zm7 0a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-13Z"/></svg></button>
        <button class="icon" id="sound" type="button" aria-label="Toggle sound" title="Toggle sound"><svg viewBox="0 0 24 24"><path d="M5 9.5v5h3.2l4.3 3.6V5.9L8.2 9.5H5Zm9.8-.7a.9.9 0 0 0-1.3 1.3 3.1 3.1 0 0 1 0 4.4.9.9 0 0 0 1.3 1.3 4.9 4.9 0 0 0 0-7Zm2.8-2.7a.9.9 0 0 0-1.3 1.3 6.9 6.9 0 0 1 0 9.8.9.9 0 1 0 1.3 1.3 8.7 8.7 0 0 0 0-12.4Z"/></svg></button>
      </div></div>
      <div class="dock-row"><button class="launch" id="launch" type="button">Launch a firework <span aria-hidden="true">↗</span></button><div class="palette" role="group" aria-label="Firework color palette">
        <button class="swatch aurora active" data-palette="aurora" type="button" aria-label="Aurora palette"></button><button class="swatch orchid" data-palette="orchid" type="button" aria-label="Orchid palette"></button><button class="swatch ember" data-palette="ember" type="button" aria-label="Ember palette"></button><button class="swatch spectrum" data-palette="spectrum" type="button" aria-label="Spectrum palette"></button>
      </div></div>
      <label class="range">Intensity <input id="intensity" type="range" min=".45" max="1.35" step=".05" value=".82" aria-label="Firework intensity"><span id="intensityValue">82%</span></label>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('sky'), ctx = canvas.getContext('2d', {alpha:false}), stage = document.querySelector('.stage');
    const count = document.getElementById('count'), clock = document.getElementById('clock'), hint = document.getElementById('hint'), toast = document.getElementById('toast');
    const intensity = document.getElementById('intensity'), intensityValue = document.getElementById('intensityValue');
    let width = 0, height = 0, dpr = 1, last = performance.now(), paused = false, soundOn = false, launches = 0, idle = 0, hiddenHint = false, audio = null, palette = 'aurora';
    const rockets = [], sparks = [], stars = [], smoke = [], embers = [];
    const colors = {aurora:['#8cefff','#b9ffec','#b69cff','#fbf6ff'],orchid:['#f89cff','#cf9cff','#9fe8ff','#fff2ff'],ember:['#ffb05d','#ffd27e','#ff7e9f','#fff4d7'],spectrum:['#8eeaff','#d79cff','#ffb980','#fbfaff']};
    const rand = (a,b) => a + Math.random() * (b-a), pick = a => a[Math.floor(Math.random()*a.length)], clamp = (n,a,b) => Math.max(a,Math.min(b,n));
    function rgb(hex){ const s=hex.slice(1); return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; }
    function rgba(hex,a){ const c=rgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
    function resize(){
      width = Math.max(1,Math.floor(stage.clientWidth)); height = Math.max(1,Math.floor(stage.clientHeight)); dpr = Math.min(devicePixelRatio || 1,2);
      canvas.width = Math.floor(width*dpr); canvas.height = Math.floor(height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); stars.length = 0;
      const amount = clamp(Math.floor(width*height/8300),90,240);
      for(let i=0;i<amount;i++) stars.push({x:Math.random()*width,y:Math.random()*height*.78,r:rand(.25,1.25),a:rand(.18,.72),p:rand(0,Math.PI*2),s:rand(.4,1.25)});
    }
    function backdrop(t){
      const g=ctx.createLinearGradient(0,0,0,height); g.addColorStop(0,'#050617');g.addColorStop(.44,'#090b28');g.addColorStop(1,'#11142e');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);
      const glow=ctx.createRadialGradient(width*.5,height*.62,0,width*.5,height*.62,Math.max(width,height)*.7);glow.addColorStop(0,'rgba(77,70,176,.11)');glow.addColorStop(.45,'rgba(40,47,126,.045)');glow.addColorStop(1,'rgba(1,2,12,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);
      stars.forEach(s=>{ctx.globalAlpha=s.a*(.72+Math.sin(t*s.s+s.p)*.28);ctx.fillStyle='#d7e1ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
      const x=width*.82,y=height*.2,r=clamp(width*.038,17,30),mg=ctx.createRadialGradient(x,y,r*.45,x,y,r*3.8);mg.addColorStop(0,'rgba(180,198,255,.1)');mg.addColorStop(1,'rgba(180,198,255,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(x,y,r*3.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(215,226,255,.72)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(119,135,193,.14)';ctx.beginPath();ctx.arc(x-r*.25,y-r*.13,r*.28,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+r*.23,y+r*.24,r*.18,0,Math.PI*2);ctx.fill();
    }
    function city(){
      const h=height*.82, water=height*.9, blocks=[[0,.12,.23],[.07,.1,.12],[.14,.18,.17],[.24,.12,.2],[.31,.24,.13],[.4,.12,.23],[.47,.3,.17],[.56,.14,.15],[.63,.22,.2],[.73,.13,.14],[.8,.28,.18],[.91,.17,.16]];
      ctx.fillStyle='#080a21';ctx.beginPath();ctx.moveTo(0,height);ctx.lineTo(0,h);blocks.forEach(b=>{ctx.lineTo(width*b[0],h);ctx.lineTo(width*b[0],h-height*b[1]);ctx.lineTo(width*(b[0]+b[2]),h-height*b[1]);ctx.lineTo(width*(b[0]+b[2]),h)});ctx.lineTo(width,h);ctx.lineTo(width,height);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(182,191,248,.16)';for(let i=0;i<48;i++){const x=(i*83.7)%(width-5),y=h-10-(i*29)%(height*.18);ctx.fillRect(x,y,2,3)}
      const w=ctx.createLinearGradient(0,water,0,height);w.addColorStop(0,'rgba(35,43,95,.32)');w.addColorStop(1,'rgba(3,5,19,.72)');ctx.fillStyle=w;ctx.fillRect(0,water,width,height-water);
      ctx.strokeStyle='rgba(144,165,237,.12)';for(let i=0;i<16;i++){const y=water+8+i*8,x=(i*43)%width;ctx.beginPath();ctx.moveTo(Math.max(0,x-width*.18),y);ctx.lineTo(Math.min(width,x+width*.2),y);ctx.stroke()}
      const hg=ctx.createLinearGradient(0,h-18,0,h+10);hg.addColorStop(0,'rgba(121,139,255,0)');hg.addColorStop(.7,'rgba(132,160,255,.11)');hg.addColorStop(1,'rgba(121,139,255,0)');ctx.fillStyle=hg;ctx.fillRect(0,h-18,width,28);
    }
    function puff(x,y,c){smoke.push({x:x,y:y,vx:rand(-.09,.09),vy:rand(-.14,-.03),life:rand(.8,1.4),age:0,size:rand(4,10),color:c})}
    function launch(x,y,surprise){
      const cs=colors[palette], power=+intensity.value, sx=clamp(x==null?rand(width*.17,width*.83):x,32,width-32), target=clamp(y==null?rand(height*.21,height*.55):y,90,height*.68);
      rockets.push({x:sx,y:height+17,px:sx,py:height+17,vx:rand(-.42,.42),vy:-rand(6.6,8.2)*(.88+power*.12),target:target,age:0,hue:pick(cs),colors:cs,shape:surprise?pick(['ring','willow','heart','chrysanthemum']):pick(['ring','chrysanthemum','willow']),power:power});
      launches++;count.textContent=String(launches%100).padStart(2,'0');idle=0;if(!hiddenHint){hiddenHint=true;hint.style.opacity=0}pop(.06);
    }
    function burst(q){
      const n=Math.floor(75+q.power*62), base=rand(2.8,4.4)*(.86+q.power*.14), golden=q.hue==='#ffb05d'||q.hue==='#ffd27e';
      for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rand(-.025,.025),shape=q.shape;let speed=base*rand(.68,1.08),vx=Math.cos(a)*speed,vy=Math.sin(a)*speed;
        if(shape==='willow'){vy*=.76;speed*=.93}else if(shape==='heart'){const hx=16*Math.pow(Math.sin(a),3)/16,hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))/14;vx=hx*base*rand(.89,1.05);vy=hy*base*rand(.89,1.05)}else if(shape==='chrysanthemum'){const wave=Math.sin(a*7)*.16;vx+=Math.cos(a+Math.PI*.5)*wave;vy+=Math.sin(a+Math.PI*.5)*wave}
        sparks.push({x:q.x,y:q.y,px:q.x,py:q.y,vx:vx,vy:vy,drag:shape==='willow'?.988:.982,gravity:shape==='willow'?.053:.078,age:0,life:rand(shape==='willow'?1.7:1,shape==='willow'?2.8:1.75),size:rand(golden?1.05:.78,golden?1.8:1.45),color:pick(q.colors),twinkle:rand(6,14),trail:shape==='willow'?.58:.42});
      }
      for(let i=0;i<Math.floor(10+q.power*8);i++){const a=Math.random()*Math.PI*2,s=rand(.3,1.4);embers.push({x:q.x,y:q.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:rand(.34,.78),color:pick(q.colors),size:rand(1.4,2.8)})}
      for(let i=0;i<5;i++)puff(q.x+rand(-9,9),q.y+rand(-8,8),q.hue);pop(.18+q.power*.18);
    }
    function update(dt){
      const step=Math.min(dt,.035)*60;
      for(let i=rockets.length-1;i>=0;i--){const q=rockets[i];q.age+=dt;q.px=q.x;q.py=q.y;q.x+=q.vx*step;q.y+=q.vy*step;q.vy+=.11*step;q.vx*=.998;if(Math.random()<.55)puff(q.x,q.y+8,q.hue);if(q.y<=q.target||q.vy>=-.25||q.age>2.2){burst(q);rockets.splice(i,1)}}
      for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.age+=dt;p.px=p.x;p.py=p.y;p.x+=p.vx*step;p.y+=p.vy*step;p.vx*=Math.pow(p.drag,step);p.vy=p.vy*Math.pow(p.drag,step)+p.gravity*step;if(p.age>p.life)sparks.splice(i,1)}
      for(let i=embers.length-1;i>=0;i--){const p=embers[i];p.age+=dt;p.x+=p.vx*step;p.y+=p.vy*step;p.vx*=.95;p.vy=p.vy*.95+.08*step;if(p.age>p.life)embers.splice(i,1)}
      for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.age+=dt;p.x+=p.vx*step;p.y+=p.vy*step;p.vx*=.997;p.size+=.012*step;if(p.age>p.life)smoke.splice(i,1)}
    }
    function particles(){
      ctx.save();ctx.globalCompositeOperation='lighter';
      smoke.forEach(p=>{const a=(1-p.age/p.life)*.08,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.4);g.addColorStop(0,rgba(p.color,a));g.addColorStop(1,rgba(p.color,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.4,0,Math.PI*2);ctx.fill()});
      rockets.forEach(q=>{ctx.strokeStyle=rgba(q.hue,clamp(1-q.age*.9,0,1)*.34);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.px,q.py);ctx.lineTo(q.x,q.y);ctx.stroke();const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,10);g.addColorStop(0,rgba(q.hue,.95));g.addColorStop(.24,rgba(q.hue,.32));g.addColorStop(1,rgba(q.hue,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,1.5,0,Math.PI*2);ctx.fill()});
      sparks.forEach(p=>{const prog=p.age/p.life,a=clamp((1-prog)*(prog<.08?prog/.08:1),0,1),tw=.74+Math.sin(p.age*p.twinkle)*.26;ctx.strokeStyle=rgba(p.color,a*p.trail*tw);ctx.lineWidth=p.size*1.25;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle=rgba(p.color,a*tw);ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.7+tw*.3),0,Math.PI*2);ctx.fill()});
      embers.forEach(p=>{ctx.fillStyle=rgba(p.color,clamp(1-p.age/p.life,0,1)*.9);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.restore();
    }
    function draw(now){const t=now/1000;backdrop(t);city();particles()}
    function frame(now){const dt=(now-last)/1000;last=now;if(!paused){idle+=dt;update(dt);if(idle>4.5&&rockets.length===0&&sparks.length<20){const x=Math.random()<.5?rand(width*.2,width*.43):rand(width*.57,width*.82);launch(x,rand(height*.24,height*.52),false)}}draw(now);requestAnimationFrame(frame)}
    function pointer(e){const r=canvas.getBoundingClientRect();launch((e.clientX-r.left),(e.clientY-r.top),false)}
    function message(s){toast.textContent=s;toast.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>toast.classList.remove('show'),1100)}
    function pop(volume){if(!soundOn||!audio)return;const n=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(54,n+.22);g.gain.setValueAtTime(Math.min(volume,.22),n);g.gain.exponentialRampToValueAtTime(.001,n+.24);o.connect(g).connect(audio.destination);o.start(n);o.stop(n+.25)}
    document.getElementById('launch').addEventListener('click',()=>launch(rand(width*.15,width*.85),rand(height*.2,height*.58),true));
    document.getElementById('pause').addEventListener('click',()=>{paused=!paused;document.getElementById('pause').setAttribute('aria-label',paused?'Resume show':'Pause show');document.getElementById('pauseSvg').innerHTML=paused?'<path d="M8.1 5.2a1 1 0 0 1 1.53-.85l8.05 6.8a1.1 1.1 0 0 1 0 1.7l-8.05 6.8A1 1 0 0 1 8.1 18.8V5.2Z"/>':'<path d="M7 5.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-13Zm7 0a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-13Z"/>';message(paused?'Show paused':'Show resumed')});
    document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;if(soundOn&&!audio)audio=new(window.AudioContext||window.webkitAudioContext)();document.getElementById('sound').style.color=soundOn?'#a8f3ff':'';message(soundOn?'Sound on':'Sound off')});
    canvas.addEventListener('pointerdown',pointer);window.addEventListener('resize',resize,{passive:true});
    document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();launch(rand(width*.16,width*.84),rand(height*.2,height*.55),true)}if(e.key.toLowerCase()==='p')document.getElementById('pause').click()});
    intensity.addEventListener('input',()=>{const v=+intensity.value,p=(v-.45)/.9*100;intensityValue.textContent=Math.round(v*100)+'%';intensity.style.background='linear-gradient(90deg,#8ce6ff 0%,#9ce4ff '+p+'%,rgba(255,255,255,.14) '+p+'%)'});
    document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{palette=s.dataset.palette;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===s));message(palette+' palette')}));
    function updateClock(){clock.textContent=new Date().toLocaleTimeString([],{hour12:false})}
    resize();updateClock();setInterval(updateClock,1000);setTimeout(()=>launch(width*.5,height*.33,false),650);setTimeout(()=>launch(width*.31,height*.48,false),1600);requestAnimationFrame(frame);
  })();
  </script>
