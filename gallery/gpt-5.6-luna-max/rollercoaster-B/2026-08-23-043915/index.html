<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nightfall Loop — Autonomous Run</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f1f5ff;
      --muted: #9da8bf;
      --line: rgba(197, 210, 255, .16);
      --glass: rgba(10, 16, 34, .68);
      --cyan: #67e8f9;
      --violet: #9b8cff;
      --amber: #ffc477;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050816; }

    body {
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .01em;
    }

    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    .interface { position: fixed; inset: 0; pointer-events: none; user-select: none; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; padding: 28px 34px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(103, 232, 249, .65);
      border-radius: 10px; background: rgba(25, 38, 75, .62); box-shadow: 0 0 22px rgba(103, 232, 249, .18);
      color: var(--cyan); font-size: 12px; font-weight: 800; letter-spacing: .06em;
    }
    .brand-copy { display: grid; gap: 2px; }
    .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .brand-title { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

    .run-state { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: rgba(10, 16, 34, .46); backdrop-filter: blur(14px); }
    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); animation: blink 1.7s ease-in-out infinite; }
    .state-label { color: #dfe8ff; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }

    .center-mark { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); opacity: .7; }
    .center-mark::before, .center-mark::after { content: ""; position: absolute; background: rgba(230, 240, 255, .78); }
    .center-mark::before { left: 10px; top: 0; width: 1px; height: 22px; }
    .center-mark::after { left: 0; top: 10px; width: 22px; height: 1px; }
    .center-mark span { position: absolute; inset: 7px; border: 1px solid rgba(230, 240, 255, .65); border-radius: 50%; }

    .bottom-panel { position: absolute; left: 34px; right: 34px; bottom: 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .telemetry { min-width: min(580px, calc(100vw - 68px)); padding: 18px 20px 16px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(135deg, rgba(11, 18, 40, .82), rgba(8, 12, 27, .59)); box-shadow: 0 18px 60px rgba(0, 0, 0, .26); backdrop-filter: blur(18px); }
    .telemetry-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 15px; }
    .telemetry-title { color: #e8eeff; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .telemetry-subtitle { color: var(--muted); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
    .metrics { display: flex; align-items: flex-end; gap: 30px; }
    .metric { display: grid; gap: 4px; }
    .metric-value { font-variant-numeric: tabular-nums; font-size: 31px; font-weight: 650; line-height: .95; letter-spacing: -.04em; }
    .metric-value small { margin-left: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; }
    .metric-label { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .metric-accent { color: var(--cyan); }
    .progress-wrap { display: grid; gap: 7px; flex: 1; min-width: 155px; padding-bottom: 3px; }
    .progress-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .progress-line { height: 4px; overflow: hidden; border-radius: 99px; background: rgba(161, 176, 220, .14); }
    .progress-line span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--cyan)); box-shadow: 0 0 15px rgba(103, 232, 249, .7); }

    .next-cue { display: grid; gap: 8px; min-width: 165px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(10, 16, 34, .46); backdrop-filter: blur(14px); }
    .cue-kicker { color: var(--amber); font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .cue-title { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
    .cue-detail { color: var(--muted); font-size: 10px; line-height: 1.45; }

    .vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(2, 4, 13, .12) 67%, rgba(2, 4, 13, .72) 120%); }
    .grain { position: absolute; inset: 0; opacity: .035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"); mix-blend-mode: screen; }

    @keyframes blink { 0%, 100% { opacity: .6; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.18); } }

    @media (max-width: 760px) {
      .topbar { padding: 18px; }
      .bottom-panel { left: 18px; right: 18px; bottom: 18px; }
      .telemetry { min-width: 0; width: 100%; padding: 14px; }
      .next-cue { display: none; }
      .metrics { gap: 18px; }
      .metric-value { font-size: 25px; }
      .progress-wrap { min-width: 90px; }
      .run-state { padding: 8px 10px; }
      .state-label { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <div class="interface">
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">NL</div>
        <div class="brand-copy">
          <div class="eyebrow">Autonomous attraction 07</div>
          <div class="brand-title">Nightfall Loop</div>
        </div>
      </div>
      <div class="run-state"><span class="state-dot"></span><span class="state-label">Live · auto pilot</span></div>
    </div>
    <div class="center-mark"><span></span></div>
    <div class="bottom-panel">
      <section class="telemetry" aria-label="ride telemetry">
        <div class="telemetry-head"><span class="telemetry-title">Live telemetry</span><span class="telemetry-subtitle">Continuous playback · seat 01</span></div>
        <div class="metrics">
          <div class="metric"><div class="metric-value metric-accent" id="speed">084<small>km/h</small></div><div class="metric-label">Velocity</div></div>
          <div class="metric"><div class="metric-value" id="altitude">042<small>m</small></div><div class="metric-label">Altitude</div></div>
          <div class="progress-wrap"><div class="progress-meta"><span>Loop progress</span><span id="distance">00.0 km</span></div><div class="progress-line"><span id="progress"></span></div></div>
        </div>
      </section>
      <aside class="next-cue"><div class="cue-kicker">Approaching</div><div class="cue-title" id="cueTitle">Neon Ridge</div><div class="cue-detail" id="cueDetail">bank left · 180° horizon turn</div></aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (() => {
      'use strict';

      const stage = document.getElementById('stage');
      const speedReadout = document.getElementById('speed');
      const altitudeReadout = document.getElementById('altitude');
      const distanceReadout = document.getElementById('distance');
      const progressReadout = document.getElementById('progress');
      const cueTitle = document.getElementById('cueTitle');
      const cueDetail = document.getElementById('cueDetail');

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x080c1d, 0.0085);

      const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.08, 420);
      camera.position.set(0, 6, 34);
      scene.add(camera);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      stage.appendChild(renderer.domElement);

      const ambient = new THREE.HemisphereLight(0x8ca8ff, 0x070913, 1.18);
      scene.add(ambient);
      const keyLight = new THREE.DirectionalLight(0xffc991, 2.2);
      keyLight.position.set(-35, 65, 22);
      scene.add(keyLight);
      const rimLight = new THREE.DirectionalLight(0x6b7dff, 1.3);
      rimLight.position.set(42, 24, -35);
      scene.add(rimLight);

      const skyMaterial = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { topColor: { value: new THREE.Color(0x101941) }, bottomColor: { value: new THREE.Color(0x050713) } },
        vertexShader: 'varying vec3 worldPosition; void main(){ vec4 p=modelMatrix*vec4(position,1.0); worldPosition=p.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: 'uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 worldPosition; void main(){ float h=normalize(worldPosition).y; float mixFactor=smoothstep(-0.24,0.62,h); gl_FragColor=vec4(mix(bottomColor,topColor,mixFactor),1.0); }'
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(190, 32, 18), skyMaterial));

      const starGeometry = new THREE.BufferGeometry();
      const starPositions = [];
      const starColors = [];
      const starColorA = new THREE.Color(0xabc5ff);
      const starColorB = new THREE.Color(0xffd5b2);
      for (let i = 0; i < 900; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(THREE.MathUtils.randFloat(-0.12, 0.9));
        const radius = THREE.MathUtils.randFloat(95, 165);
        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = Math.abs(radius * Math.cos(phi)) + 14;
        const z = radius * Math.sin(phi) * Math.sin(theta);
        starPositions.push(x, y, z);
        const c = starColorA.clone().lerp(starColorB, Math.random() * .42);
        starColors.push(c.r, c.g, c.b);
      }
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
      const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ size: .5, vertexColors: true, transparent: true, opacity: .82, sizeAttenuation: true }));
      scene.add(stars);

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), new THREE.MeshStandardMaterial({ color: 0x070a16, roughness: .96, metalness: .08 }));
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -3.8;
      scene.add(ground);
      const grid = new THREE.GridHelper(280, 56, 0x23305d, 0x111a36);
      grid.position.y = -3.72;
      grid.material.transparent = true;
      grid.material.opacity = .2;
      scene.add(grid);

      const moon = new THREE.Mesh(new THREE.SphereGeometry(5.3, 24, 24), new THREE.MeshBasicMaterial({ color: 0xffc99a }));
      moon.position.set(-53, 54, -88);
      scene.add(moon);
      const moonGlow = new THREE.Mesh(new THREE.SphereGeometry(8.8, 24, 24), new THREE.MeshBasicMaterial({ color: 0xf8a56d, transparent: true, opacity: .07, side: THREE.BackSide }));
      moonGlow.position.copy(moon.position);
      scene.add(moonGlow);

      const silhouetteMat = new THREE.MeshStandardMaterial({ color: 0x0b1126, roughness: 1, metalness: 0 });
      const silhouetteGlow = new THREE.MeshStandardMaterial({ color: 0x171b47, emissive: 0x161642, emissiveIntensity: .35, roughness: 1 });
      for (let i = 0; i < 34; i++) {
        const angle = (i / 34) * Math.PI * 2;
        const radius = THREE.MathUtils.randFloat(82, 125);
        const h = THREE.MathUtils.randFloat(7, 24);
        const w = THREE.MathUtils.randFloat(4, 10);
        const building = new THREE.Mesh(new THREE.ConeGeometry(w, h, THREE.MathUtils.randInt(4, 7)), i % 4 === 0 ? silhouetteGlow : silhouetteMat);
        building.position.set(Math.cos(angle) * radius, -3.8 + h / 2, Math.sin(angle) * radius);
        building.rotation.y = Math.random() * Math.PI;
        scene.add(building);
      }

      const controlPoints = [
        new THREE.Vector3(0, 6.0, 34),
        new THREE.Vector3(17, 8.2, 23),
        new THREE.Vector3(28, 15.5, 3),
        new THREE.Vector3(23, 27.2, -19),
        new THREE.Vector3(5, 34.5, -31),
        new THREE.Vector3(-17, 30.2, -25),
        new THREE.Vector3(-29, 18.0, -6),
        new THREE.Vector3(-28, 9.2, 15),
        new THREE.Vector3(-14, 6.3, 31)
      ];
      const track = new THREE.CatmullRomCurve3(controlPoints, true, 'centripetal', .45);
      const trackGroup = new THREE.Group();
      scene.add(trackGroup);

      const railMaterial = new THREE.MeshStandardMaterial({ color: 0x8ba1c6, metalness: .86, roughness: .23, emissive: 0x182451, emissiveIntensity: .55 });
      const centerMaterial = new THREE.MeshStandardMaterial({ color: 0x26355c, metalness: .72, roughness: .32, emissive: 0x111e50, emissiveIntensity: .46 });
      const railUp = new THREE.Vector3(0, 1, 0);
      class RailCurve extends THREE.Curve {
        constructor(base, offset) { super(); this.base = base; this.offset = offset; }
        getPoint(t, target = new THREE.Vector3()) {
          const p = this.base.getPointAt(t);
          const tangent = this.base.getTangentAt(t).normalize();
          const side = new THREE.Vector3().crossVectors(tangent, railUp).normalize();
          if (side.lengthSq() < .001) side.set(1, 0, 0);
          return target.copy(p).addScaledVector(side, this.offset);
        }
      }
      const leftRail = new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(track, -1.48), 280, .105, 8, true), railMaterial);
      const rightRail = new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(track, 1.48), 280, .105, 8, true), railMaterial);
      const centerRail = new THREE.Mesh(new THREE.TubeGeometry(track, 280, .17, 8, true), centerMaterial);
      trackGroup.add(leftRail, rightRail, centerRail);

      const sleeperGeometry = new THREE.BoxGeometry(4.2, .16, .3);
      const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x131b34, metalness: .6, roughness: .5, emissive: 0x070c1b, emissiveIntensity: .7 });
      const upAxis = new THREE.Vector3(0, 0, 1);
      for (let i = 0; i < 122; i++) {
        const t = i / 122;
        const p = track.getPointAt(t);
        const tangent = track.getTangentAt(t).normalize();
        const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
        sleeper.position.copy(p);
        sleeper.quaternion.setFromUnitVectors(upAxis, tangent);
        trackGroup.add(sleeper);
      }

      const supportMaterial = new THREE.MeshStandardMaterial({ color: 0x1a2d56, metalness: .74, roughness: .3, emissive: 0x0a1735, emissiveIntensity: .8 });
      const supportGlowMaterial = new THREE.MeshStandardMaterial({ color: 0x4f65aa, metalness: .5, roughness: .3, emissive: 0x2d40a0, emissiveIntensity: 1.1 });
      const supportRadius = .14;
      for (let i = 0; i < 32; i++) {
        const t = (i + .17) / 32;
        const p = track.getPointAt(t);
        const height = p.y - (-3.72);
        const support = new THREE.Mesh(new THREE.CylinderGeometry(supportRadius, .2, height, 8), i % 4 === 0 ? supportGlowMaterial : supportMaterial);
        support.position.set(p.x, -3.72 + height / 2, p.z);
        trackGroup.add(support);
        if (i % 2 === 0) {
          const brace = new THREE.Mesh(new THREE.BoxGeometry(3.4, .1, .1), supportMaterial);
          brace.position.set(p.x, p.y - 1.8, p.z);
          const tangent = track.getTangentAt(t).normalize();
          brace.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), tangent);
          trackGroup.add(brace);
        }
      }

      const beaconGeometry = new THREE.SphereGeometry(.14, 10, 10);
      const beaconMaterials = [
        new THREE.MeshBasicMaterial({ color: 0x67e8f9 }),
        new THREE.MeshBasicMaterial({ color: 0xffb86b }),
        new THREE.MeshBasicMaterial({ color: 0xa58bff })
      ];
      const beacons = [];
      for (let i = 0; i < 72; i++) {
        const t = i / 72;
        const p = track.getPointAt(t);
        const tangent = track.getTangentAt(t).normalize();
        const side = new THREE.Vector3().crossVectors(tangent, railUp).normalize();
        const beacon = new THREE.Mesh(beaconGeometry, beaconMaterials[i % beaconMaterials.length]);
        beacon.position.copy(p).addScaledVector(side, i % 2 ? 1.48 : -1.48).addScaledVector(railUp, .14);
        trackGroup.add(beacon);
        beacons.push({ mesh: beacon, phase: Math.random() * Math.PI * 2, color: i % beaconMaterials.length });
      }
      for (let i = 0; i < 12; i++) {
        const t = i / 12;
        const p = track.getPointAt(t);
        const light = new THREE.PointLight(i % 2 ? 0x6a78ff : 0xff9e6b, 2.2, 18, 2);
        light.position.copy(p).addScaledVector(railUp, 1.2);
        trackGroup.add(light);
      }

      const cockpit = new THREE.Group();
      camera.add(cockpit);
      const cockpitMaterial = new THREE.MeshStandardMaterial({ color: 0x10162d, metalness: .88, roughness: .25, emissive: 0x08102c, emissiveIntensity: .75 });
      const cockpitEdge = new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: .72 });
      const nose = new THREE.Mesh(new THREE.BoxGeometry(2.8, .16, 2.25), cockpitMaterial);
      nose.position.set(0, -1.22, -1.48);
      cockpit.add(nose);
      const noseGlow = new THREE.Mesh(new THREE.BoxGeometry(1.5, .025, .05), cockpitEdge);
      noseGlow.position.set(0, -1.11, -2.58);
      cockpit.add(noseGlow);
      for (const x of [-1.18, 1.18]) {
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, 2.05, 8), cockpitMaterial);
        bar.rotation.x = Math.PI / 2;
        bar.position.set(x, -.73, -1.52);
        cockpit.add(bar);
        const barLight = new THREE.Mesh(new THREE.BoxGeometry(.04, .025, 1.45), cockpitEdge);
        barLight.position.set(x, -.6, -1.78);
        cockpit.add(barLight);
      }

      const up = new THREE.Vector3(0, 1, 0);
      const ridePosition = new THREE.Vector3();
      const rideTangent = new THREE.Vector3();
      const lookTarget = new THREE.Vector3();
      const segments = [
        { at: .03, title: 'Neon Ridge', detail: 'bank left · 180° horizon turn' },
        { at: .22, title: 'Aurora Crest', detail: 'climb sequence · peak 34 m' },
        { at: .45, title: 'Blue Drop', detail: 'descent vector · clear track' },
        { at: .68, title: 'Signal Valley', detail: 'low pass · lights active' },
        { at: .88, title: 'Home Straight', detail: 'return curve · auto-brake ready' }
      ];
      let elapsed = 0;
      const rideRate = .0235;
      const clock = new THREE.Clock();
      function updateInterface(t) {
        const speed = Math.round(88 + Math.sin(elapsed * .74) * 13 + Math.sin(elapsed * 1.7) * 3);
        const altitude = Math.max(0, Math.round(ridePosition.y * 1.28 + 2));
        speedReadout.innerHTML = String(speed).padStart(3, '0') + '<small>km/h</small>';
        altitudeReadout.innerHTML = String(altitude).padStart(3, '0') + '<small>m</small>';
        const distance = (t * 1.84).toFixed(2).padStart(4, '0');
        distanceReadout.textContent = distance + ' km';
        progressReadout.style.width = (t * 100).toFixed(2) + '%';
        let cue = segments[0];
        for (let i = segments.length - 1; i >= 0; i--) if (t >= segments[i].at) { cue = segments[i]; break; }
        cueTitle.textContent = cue.title;
        cueDetail.textContent = cue.detail;
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), .05);
        elapsed += delta;
        const t = (elapsed * rideRate) % 1;
        track.getPointAt(t, ridePosition);
        track.getTangentAt(t, rideTangent).normalize();
        camera.position.copy(ridePosition).addScaledVector(up, 1.38 + Math.sin(elapsed * 3.7) * .035);
        lookTarget.copy(ridePosition).addScaledVector(rideTangent, 11).addScaledVector(up, 1.34);
        camera.lookAt(lookTarget);
        camera.rotateZ(Math.sin(elapsed * 1.3) * .025 + Math.sin(t * Math.PI * 2 * 3) * .018);
        stars.rotation.y += delta * .002;
        stars.rotation.x = Math.sin(elapsed * .04) * .015;
        for (const beacon of beacons) {
          const pulse = .68 + Math.sin(elapsed * 3.2 + beacon.phase) * .32;
          beacon.mesh.scale.setScalar(.76 + pulse * .32);
          beacon.mesh.material.opacity = .64 + pulse * .36;
        }
        updateInterface(t);
        renderer.render(scene, camera);
      }
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      });
      animate();
    })();
  </script>
</body>
</html>
