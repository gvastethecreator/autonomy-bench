<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nightfall Express — Neon Run</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #6df4ff;
      --blue: #75a8ff;
      --pink: #ff71d7;
      --amber: #ffcf7c;
      --ink: #040710;
      --panel: rgba(5, 11, 26, .68);
      --line: rgba(151, 207, 255, .18);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { font-family: "Segoe UI", "Arial Narrow", Arial, sans-serif; letter-spacing: .08em; }
    #scene { width: 100%; height: 100%; display: block; position: fixed; inset: 0; }
    .vignette, .grain { pointer-events: none; position: fixed; inset: 0; z-index: 3; }
    .vignette { background: radial-gradient(ellipse at 50% 46%, transparent 28%, rgba(1,3,10,.18) 65%, rgba(1,2,7,.92) 124%); }
    .grain { opacity: .055; mix-blend-mode: screen; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.46'/%3E%3C/svg%3E"); }
    .hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; padding: clamp(20px, 3.5vw, 54px); display: flex; flex-direction: column; justify-content: space-between; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand { display: flex; align-items: flex-start; gap: 14px; }
    .brand-mark { width: 35px; height: 35px; border: 1px solid var(--cyan); border-radius: 50%; position: relative; box-shadow: 0 0 22px rgba(109,244,255,.32), inset 0 0 14px rgba(109,244,255,.16); }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; background: var(--cyan); left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .brand-mark::before { width: 19px; height: 1px; }
    .brand-mark::after { width: 1px; height: 19px; }
    .eyebrow { color: var(--cyan); font-size: 10px; line-height: 1; font-weight: 700; letter-spacing: .36em; text-transform: uppercase; margin: 2px 0 7px; }
    .brand h1 { font-size: clamp(19px, 2.4vw, 29px); line-height: .95; margin: 0; font-weight: 300; letter-spacing: .16em; text-transform: uppercase; color: #f4fbff; text-shadow: 0 0 22px rgba(117,168,255,.25); }
    .brand h1 b { color: var(--pink); font-weight: 600; }
    .status { border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px 10px 11px; background: rgba(3, 9, 21, .58); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 9px; color: #d9eeff; font-size: 9px; font-weight: 700; letter-spacing: .24em; }
    .status i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 13px var(--cyan); animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.65); } }
    .middle { display: flex; align-items: center; }
    .telemetry { width: min(270px, 31vw); padding: 18px 19px 16px; background: linear-gradient(145deg, rgba(7,14,32,.78), rgba(4,8,20,.46)); border: 1px solid var(--line); border-left: 2px solid var(--cyan); box-shadow: 14px 18px 50px rgba(0,0,0,.18); backdrop-filter: blur(13px); }
    .telemetry .label { color: #8ea9c9; font-size: 9px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
    .telemetry .route { color: #eef8ff; font-size: 12px; margin: 11px 0 17px; letter-spacing: .16em; }
    .speed-line { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; border-bottom: 1px solid rgba(151,207,255,.12); }
    .speed { color: #f9fdff; font-size: 48px; line-height: .8; letter-spacing: -.05em; font-weight: 200; }
    .speed small { font-size: 10px; color: var(--cyan); letter-spacing: .2em; margin-left: 5px; }
    .telemetry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; padding-top: 14px; }
    .stat span { display: block; color: #7188a8; font-size: 8px; margin-bottom: 5px; letter-spacing: .2em; }
    .stat strong { display: block; color: #deedff; font-size: 12px; font-weight: 500; letter-spacing: .12em; }
    .stat strong em { color: var(--pink); font-style: normal; }
    .footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .quote { max-width: 380px; }
    .quote .line { width: 32px; height: 1px; background: var(--pink); box-shadow: 0 0 11px var(--pink); margin-bottom: 13px; }
    .quote p { color: #e7f2ff; font-size: 12px; line-height: 1.7; letter-spacing: .18em; margin: 0; text-transform: uppercase; }
    .progress-wrap { width: min(420px, 42vw); }
    .progress-meta { display: flex; justify-content: space-between; color: #89a1c0; font-size: 8px; font-weight: 700; letter-spacing: .22em; margin-bottom: 9px; }
    .progress { height: 2px; background: rgba(182,216,255,.21); position: relative; }
    .progress b { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 14px rgba(109,244,255,.8); transition: width .2s linear; }
    .progress::before, .progress::after { content: ""; position: absolute; width: 4px; height: 4px; top: -1px; background: #d5f8ff; box-shadow: 0 0 8px var(--cyan); }
    .progress::before { left: 0; } .progress::after { right: 0; }
    #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #030611; transition: opacity .8s ease, visibility .8s ease; color: var(--cyan); font-size: 10px; letter-spacing: .34em; }
    #loader.hide { opacity: 0; visibility: hidden; }
    #loader span { display: inline-flex; align-items: center; gap: 12px; }
    #loader i { width: 6px; height: 6px; background: var(--pink); border-radius: 50%; box-shadow: 0 0 16px var(--pink); animation: pulse 1s infinite; }
    @media (max-width: 700px) {
      .hud { padding: 20px; }
      .telemetry { width: 220px; padding: 14px; }
      .speed { font-size: 39px; }
      .quote { display: none; }
      .progress-wrap { width: 100%; }
      .footer { display: block; }
      .status { padding: 8px 10px; font-size: 8px; }
      .brand-mark { width: 28px; height: 28px; }
      .brand-mark::before { width: 14px; } .brand-mark::after { height: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="A continuously moving first-person neon rollercoaster ride"></canvas>
  <div id="loader"><span><i></i> CALIBRATING HORIZON LOOP</span></div>
  <div class="vignette"></div><div class="grain"></div>
  <main class="hud" aria-hidden="true">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div><div class="eyebrow">NIGHTFALL AMUSEMENT CO.</div><h1>NEON <b>//</b> RUN</h1></div>
      </div>
      <div class="status"><i></i> AUTO-RUN / LIVE</div>
    </div>
    <div class="middle">
      <section class="telemetry">
        <div class="label">First-person telemetry</div>
        <div class="route">HORIZON LOOP <span style="color:var(--pink)">/</span> 01</div>
        <div class="speed-line"><div class="speed" id="speed">082<small>KM/H</small></div><div class="label">CRUISE<br>MODE</div></div>
        <div class="telemetry-grid">
          <div class="stat"><span>ALTITUDE</span><strong id="altitude">018 <em>M</em></strong></div>
          <div class="stat"><span>G-FORCE</span><strong id="gforce">+1.24 <em>G</em></strong></div>
          <div class="stat"><span>SECTOR</span><strong id="sector">LUMEN RISE</strong></div>
          <div class="stat"><span>LAP</span><strong id="lap">01 / 03</strong></div>
        </div>
      </section>
    </div>
    <div class="footer">
      <div class="quote"><div class="line"></div><p>Breathe in. Hold on.<br><span style="color:var(--cyan)">The city is about to move.</span></p></div>
      <div class="progress-wrap"><div class="progress-meta"><span>CONTINUOUS PLAYBACK</span><span id="progressText">00:00 / 00:42</span></div><div class="progress"><b id="progress"></b></div></div>
    </div>
  </main>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040817);
    scene.fog = new THREE.FogExp2(0x071129, 0.0092);
    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 600);

    const cyan = new THREE.Color(0x63edff);
    const pink = new THREE.Color(0xff55d3);
    const steel = new THREE.MeshStandardMaterial({ color: 0x9bb0c8, metalness: .9, roughness: .24 });
    const darkSteel = new THREE.MeshStandardMaterial({ color: 0x1a3551, metalness: .86, roughness: .32 });
    const cyanGlow = new THREE.MeshStandardMaterial({ color: 0x267d91, emissive: 0x22d8eb, emissiveIntensity: 3.6, metalness: .35, roughness: .2 });
    const pinkGlow = new THREE.MeshStandardMaterial({ color: 0x8b206e, emissive: 0xff35c3, emissiveIntensity: 3.4, metalness: .3, roughness: .2 });
    const windowGlow = new THREE.MeshStandardMaterial({ color: 0x123c59, emissive: 0x257899, emissiveIntensity: 1.6, metalness: .55, roughness: .6 });

    scene.add(new THREE.HemisphereLight(0x78a6e6, 0x04050b, 1.15));
    const key = new THREE.DirectionalLight(0xb4ccff, 2.2); key.position.set(-32, 52, 22); scene.add(key);
    const rim = new THREE.PointLight(0xff42ce, 18, 90, 2.2); rim.position.set(24, 20, -28); scene.add(rim);
    const moonLight = new THREE.PointLight(0x4b90ff, 11, 150, 1.7); moonLight.position.set(-65, 38, -80); scene.add(moonLight);

    const controlPoints = [
      new THREE.Vector3(0, 6.4, 37), new THREE.Vector3(9, 9.8, 30), new THREE.Vector3(17, 16.5, 17),
      new THREE.Vector3(17, 10.2, 2), new THREE.Vector3(10, 3.2, -13), new THREE.Vector3(-2, 2.4, -21),
      new THREE.Vector3(-16, 5.8, -17), new THREE.Vector3(-25, 12.2, -5), new THREE.Vector3(-25, 7.1, 10),
      new THREE.Vector3(-16, 3.9, 23), new THREE.Vector3(-6, 5.4, 33)
    ];
    const trackPath = new THREE.CatmullRomCurve3(controlPoints, true, 'catmullrom', .48);
    trackPath.arcLengthDivisions = 2400;
    trackPath.updateArcLengths();

    function lateralAt(t) {
      const tangent = trackPath.getTangentAt(((t % 1) + 1) % 1).normalize();
      const lateral = new THREE.Vector3(-tangent.z, 0, tangent.x);
      if (lateral.lengthSq() < .001) lateral.set(1, 0, 0);
      return lateral.normalize();
    }
    function railCurve(side, radius = 1.15) {
      const points = [];
      for (let i = 0; i < 720; i++) {
        const t = i / 720;
        points.push(trackPath.getPointAt(t).addScaledVector(lateralAt(t), side * radius));
      }
      return new THREE.CatmullRomCurve3(points, true, 'catmullrom', .38);
    }
    const leftRail = railCurve(1), rightRail = railCurve(-1);
    const railGeo = new THREE.TubeGeometry(leftRail, 720, .105, 8, true);
    const railGeoR = new THREE.TubeGeometry(rightRail, 720, .105, 8, true);
    scene.add(new THREE.Mesh(railGeo, steel), new THREE.Mesh(railGeoR, steel));
    const glowGeo = new THREE.TubeGeometry(railCurve(1, 1.155), 720, .031, 6, true);
    const glowGeoR = new THREE.TubeGeometry(railCurve(-1, 1.155), 720, .031, 6, true);
    scene.add(new THREE.Mesh(glowGeo, cyanGlow), new THREE.Mesh(glowGeoR, pinkGlow));

    function beamBetween(start, end, radius, material) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.08, length, 7), material);
      beam.position.copy(start).add(end).multiplyScalar(.5);
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      scene.add(beam);
      return beam;
    }
    for (let i = 0; i < 112; i++) {
      const t = i / 112;
      const center = trackPath.getPointAt(t);
      const tangent = trackPath.getTangentAt(t).normalize();
      const across = lateralAt(t);
      const sleeper = new THREE.Mesh(new THREE.BoxGeometry(3.05, .16, .45), darkSteel);
      sleeper.position.copy(center).addScaledVector(across, 0).addScaledVector(tangent, .02);
      sleeper.position.y -= .23;
      sleeper.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), across);
      scene.add(sleeper);
      if (i % 4 === 0) {
        const baseY = .28 + Math.abs(Math.sin(i * 2.31)) * .2;
        for (const side of [-.72, .72]) {
          const top = center.clone().addScaledVector(across, side).add(new THREE.Vector3(0, -.15, 0));
          const bottom = new THREE.Vector3(top.x, baseY, top.z);
          beamBetween(bottom, top, .095, darkSteel);
          const foot = new THREE.Mesh(new THREE.CylinderGeometry(.22, .3, .16, 8), darkSteel);
          foot.position.set(bottom.x, baseY - .08, bottom.z); scene.add(foot);
        }
      }
    }

    // Light gates turn the ride into a visible rhythm as the camera loops through the track.
    [0.035, .205, .385, .59, .79].forEach((t, index) => {
      const p = trackPath.getPointAt(t);
      const tangent = trackPath.getTangentAt(t).normalize();
      const ring = new THREE.Mesh(new THREE.TorusGeometry(3.15, .075, 9, 48), index % 2 ? pinkGlow : cyanGlow);
      ring.position.copy(p).add(new THREE.Vector3(0, .55, 0));
      ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent);
      scene.add(ring);
      const halo = new THREE.PointLight(index % 2 ? 0xff3bd0 : 0x52ecff, 2.3, 16, 2);
      halo.position.copy(ring.position); scene.add(halo);
    });

    // Ground, grid and the distant city establish scale without competing with the ride.
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), new THREE.MeshStandardMaterial({ color: 0x040914, metalness: .18, roughness: .93 }));
    ground.rotation.x = -Math.PI / 2; ground.position.y = 0; scene.add(ground);
    const grid = new THREE.GridHelper(300, 60, 0x1a526c, 0x0b2038);
    grid.position.y = .025; grid.material.transparent = true; grid.material.opacity = .26; scene.add(grid);

    // A deterministic skyline keeps every replay visually stable.
    let seed = 193;
    const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const city = new THREE.Group();
    for (let i = 0; i < 58; i++) {
      const side = i % 2 ? 1 : -1;
      const x = side * (38 + rand() * 48);
      const z = -68 + rand() * 135;
      const width = 2.8 + rand() * 5.5, depth = 2.6 + rand() * 5, height = 4 + rand() * 17;
      const tower = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(.59 + rand() * .04, .33, .055 + rand() * .045), emissive: 0x081b32, emissiveIntensity: 1.2, metalness: .55, roughness: .72 }));
      tower.position.set(x, height / 2, z); city.add(tower);
      if (i % 3 !== 0) {
        const cap = new THREE.Mesh(new THREE.BoxGeometry(width * .74, .08, depth * .74), i % 2 ? cyanGlow : pinkGlow);
        cap.position.set(x, height + .06, z); city.add(cap);
      }
      if (i % 4 === 0) {
        const antenna = beamBetween(new THREE.Vector3(x, height, z), new THREE.Vector3(x, height + 2.4 + rand() * 3, z), .035, cyanGlow);
        antenna.parent = city;
      }
    }
    scene.add(city);

    const mountainMat = new THREE.MeshStandardMaterial({ color: 0x07152b, emissive: 0x061126, emissiveIntensity: .55, roughness: 1 });
    [[-65, -44, 26], [-37, -80, 18], [62, -67, 31], [89, -8, 23], [-76, 48, 20], [72, 51, 17]].forEach(([x, z, h], i) => {
      const mountain = new THREE.Mesh(new THREE.ConeGeometry(15 + (i % 2) * 7, h, 6), mountainMat);
      mountain.position.set(x, h / 2 - .2, z); mountain.rotation.y = i * .6; scene.add(mountain);
    });

    const stars = [];
    for (let i = 0; i < 1100; i++) {
      const a = rand() * Math.PI * 2, r = 150 + rand() * 180;
      stars.push(Math.cos(a) * r, 18 + rand() * 105, Math.sin(a) * r - 45);
    }
    const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x9bbfff, size: .34, transparent: true, opacity: .78, sizeAttenuation: true })));
    const moon = new THREE.Mesh(new THREE.SphereGeometry(5.2, 32, 32), new THREE.MeshBasicMaterial({ color: 0xb5c8ff, transparent: true, opacity: .9 }));
    moon.position.set(-72, 51, -102); scene.add(moon);
    const moonHalo = new THREE.Mesh(new THREE.SphereGeometry(7.7, 24, 24), new THREE.MeshBasicMaterial({ color: 0x426ac3, transparent: true, opacity: .08, side: THREE.BackSide }));
    moonHalo.position.copy(moon.position); scene.add(moonHalo);

    const speedEl = document.querySelector('#speed');
    const altitudeEl = document.querySelector('#altitude');
    const gforceEl = document.querySelector('#gforce');
    const sectorEl = document.querySelector('#sector');
    const lapEl = document.querySelector('#lap');
    const progressEl = document.querySelector('#progress');
    const progressTextEl = document.querySelector('#progressText');
    const sectors = ['LUMEN RISE', 'AURORA DROP', 'VOID TURN', 'PULSE VALLEY', 'NOVA RETURN'];
    const clock = new THREE.Clock();
    let rideT = .004, elapsed = 0, firstFrame = true;
    const totalRide = 42;
    function pad(value) { return String(Math.max(0, Math.round(value))).padStart(2, '0'); }
    function animate() {
      const dt = Math.min(clock.getDelta(), .05);
      elapsed += dt;
      const grade = trackPath.getTangentAt(rideT).y;
      const pace = .019 + Math.max(0, -grade) * .012 + Math.sin(elapsed * .32) * .0009;
      rideT = (rideT + dt * pace) % 1;
      const center = trackPath.getPointAt(rideT);
      const tangent = trackPath.getTangentAt(rideT).normalize();
      const ahead = trackPath.getPointAt((rideT + .012) % 1);
      const ridePos = center.clone().add(new THREE.Vector3(0, 1.08, 0));
      camera.position.lerp(ridePos, .42);
      camera.lookAt(ahead.clone().add(new THREE.Vector3(0, 1.14, 0)));
      camera.rotateZ(Math.sin(elapsed * 1.8) * .006 + tangent.x * .009);
      camera.fov = 70 + Math.abs(grade) * 7;
      camera.updateProjectionMatrix();
      const speed = 69 + Math.round(Math.abs(grade) * 85 + (Math.sin(elapsed * .34) + 1) * 6);
      const altitude = Math.max(2, Math.round(center.y));
      const gforce = 1.03 + Math.abs(grade) * 1.55 + Math.abs(Math.sin(elapsed * .57)) * .12;
      speedEl.innerHTML = `${String(speed).padStart(3, '0')}<small>KM/H</small>`;
      altitudeEl.innerHTML = `${String(altitude).padStart(3, '0')} <em>M</em>`;
      gforceEl.innerHTML = `+${gforce.toFixed(2)} <em>G</em>`;
      sectorEl.textContent = sectors[Math.floor(rideT * sectors.length) % sectors.length];
      lapEl.textContent = `${String(Math.floor(elapsed / totalRide) + 1).padStart(2, '0')} / 03`;
      const runProgress = (elapsed % totalRide) / totalRide;
      progressEl.style.width = `${runProgress * 100}%`;
      progressTextEl.textContent = `${pad((elapsed % totalRide) / 60)}:${pad(elapsed % 60)} / 00:42`;
      if (firstFrame) { firstFrame = false; document.querySelector('#loader').classList.add('hide'); }
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
