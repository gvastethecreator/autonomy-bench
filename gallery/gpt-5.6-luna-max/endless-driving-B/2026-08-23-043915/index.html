<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NIGHTRUN // Endless Drive</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #75f5ff;
      --cyan-dim: rgba(117,245,255,.25);
      --amber: #ffbf68;
      --ink: #e7f6ff;
      --muted: #83a4b4;
      --glass: rgba(5,12,22,.64);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #03050d; }
    body {
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      color: var(--ink);
      letter-spacing: .08em;
      text-transform: uppercase;
      user-select: none;
    }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #grain, #vignette, #scanlines { position: fixed; inset: 0; pointer-events: none; }
    #vignette {
      background: radial-gradient(ellipse at 50% 46%, transparent 34%, rgba(0,0,0,.25) 73%, rgba(0,0,0,.86) 120%);
      z-index: 3;
    }
    #grain {
      opacity: .08;
      z-index: 4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }
    #scanlines {
      z-index: 5;
      opacity: .075;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(137,224,255,.11) 4px);
    }
    #hud {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(18px, 3vw, 42px);
    }
    .hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .mark {
      width: 31px; height: 31px; border: 1px solid var(--cyan);
      transform: rotate(45deg); box-shadow: 0 0 20px var(--cyan-dim);
      position: relative;
    }
    .mark:after { content: ""; position: absolute; inset: 7px; border: 1px solid var(--cyan); }
    .label { font-size: 10px; color: var(--muted); line-height: 1.7; }
    .label strong { font-size: 13px; letter-spacing: .2em; color: var(--ink); font-weight: 500; }
    .readout { display: flex; gap: clamp(18px, 3vw, 46px); text-align: right; }
    .readout .value { display: block; font-variant-numeric: tabular-nums; font-size: clamp(18px, 2.5vw, 31px); line-height: 1; color: var(--ink); letter-spacing: .04em; }
    .readout .unit { display: block; margin-top: 7px; font-size: 9px; color: var(--muted); }
    .bottom { align-items: flex-end; }
    .status { min-width: 212px; }
    .status-line { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; font-size: 10px; color: var(--muted); }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); animation: pulse 1.35s infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .meter { width: min(260px, 42vw); height: 3px; background: rgba(153,212,230,.18); overflow: hidden; }
    .meter i { display: block; width: 62%; height: 100%; background: linear-gradient(90deg, var(--cyan), #d7fbff); box-shadow: 0 0 12px var(--cyan); transition: width .3s ease; }
    .hint { font-size: 9px; color: rgba(210,234,241,.65); line-height: 1.8; text-align: right; }
    .hint kbd {
      display: inline-block; padding: 3px 5px; margin: 0 1px; border: 1px solid rgba(144,206,225,.4);
      border-radius: 2px; color: var(--ink); font-size: 9px; background: rgba(5,18,28,.55);
    }
    #boot {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(180deg, rgba(3,6,15,.35), rgba(3,6,15,.83));
      transition: opacity .8s ease, visibility .8s ease; cursor: pointer;
    }
    #boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .title-card { width: min(560px, 100%); text-align: center; }
    .eyebrow { color: var(--cyan); font-size: 10px; letter-spacing: .46em; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(48px, 10vw, 108px); line-height: .84; letter-spacing: .08em; font-weight: 300; text-shadow: 0 0 36px rgba(94,239,255,.33); }
    h1 em { display: block; font-style: normal; color: transparent; -webkit-text-stroke: 1px rgba(220,250,255,.85); }
    .sub { color: var(--muted); font-size: 10px; letter-spacing: .25em; margin: 27px 0 31px; }
    .start {
      display: inline-flex; align-items: center; gap: 12px; padding: 12px 18px; border: 1px solid rgba(117,245,255,.65);
      color: var(--ink); font: inherit; font-size: 10px; letter-spacing: .25em; background: rgba(11,34,45,.56);
      box-shadow: 0 0 30px rgba(117,245,255,.12); transition: background .2s ease, box-shadow .2s ease;
    }
    #boot:hover .start { background: rgba(24,67,80,.75); box-shadow: 0 0 36px rgba(117,245,255,.26); }
    .start span { color: var(--cyan); font-size: 17px; line-height: 0; }
    #crosshair {
      position: fixed; left: 50%; top: 51%; z-index: 6; width: 26px; height: 26px; transform: translate(-50%,-50%);
      opacity: .25; pointer-events: none;
    }
    #crosshair:before, #crosshair:after { content: ""; position: absolute; background: var(--cyan); }
    #crosshair:before { width: 1px; height: 100%; left: 50%; }
    #crosshair:after { height: 1px; width: 100%; top: 50%; }
    @media (max-width: 620px) {
      #hud { padding: 18px; }
      .hint { display: none; }
      .status { min-width: 145px; }
      .readout { gap: 14px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="vignette"></div><div id="grain"></div><div id="scanlines"></div>
  <div id="crosshair"></div>
  <div id="hud">
    <div class="hud-row">
      <div class="brand">
        <div class="mark"></div>
        <div class="label"><strong>NIGHTRUN</strong><br>SECTOR 04 / OPEN ROAD</div>
      </div>
      <div class="readout">
        <div><span id="speed" class="value">076</span><span class="unit">KM/H</span></div>
        <div><span id="distance" class="value">000.0</span><span class="unit">KM TRIP</span></div>
        <div><span id="clock" class="value">00:00</span><span class="unit">LOCAL TIME</span></div>
      </div>
    </div>
    <div class="hud-row bottom">
      <div class="status">
        <div class="status-line"><i class="pulse"></i><span id="statusText">AUTOPILOT // NOMINAL</span></div>
        <div class="meter"><i id="meter"></i></div>
      </div>
      <div class="hint"><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> CHANGE LANE &nbsp; <kbd>SPACE</kbd> BOOST</div>
    </div>
  </div>
  <div id="boot">
    <div class="title-card">
      <div class="eyebrow">A SYNTHETIC ROAD MOVIE</div>
      <h1>NIGHT<em>RUN</em></h1>
      <p class="sub">No destination. Just keep the lights ahead.</p>
      <div class="start"><span>↗</span> CLICK TO ENGAGE</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  (() => {
    "use strict";
    const stage = document.getElementById("stage");
    const boot = document.getElementById("boot");
    const speedReadout = document.getElementById("speed");
    const distanceReadout = document.getElementById("distance");
    const clockReadout = document.getElementById("clock");
    const statusText = document.getElementById("statusText");
    const meter = document.getElementById("meter");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030611);
    scene.fog = new THREE.FogExp2(0x070d1c, 0.010);
    const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, .1, 520);
    camera.position.set(0, 4.2, 10.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    stage.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0x142c58, 0x020309, 1.1);
    scene.add(hemi);
    const moonLight = new THREE.DirectionalLight(0x91b7ff, 2.0);
    moonLight.position.set(-25, 45, -70);
    scene.add(moonLight);

    const mat = (color, roughness, metalness, emissive, eIntensity) => new THREE.MeshStandardMaterial({
      color, roughness: roughness === undefined ? .7 : roughness, metalness: metalness === undefined ? .1 : metalness,
      emissive: emissive || 0x000000, emissiveIntensity: eIntensity || 0
    });
    const roadMat = mat(0x101722, .92, .12);
    const shoulderMat = mat(0x151c28, .82, .2);
    const laneMat = mat(0x8ea3aa, .4, .2, 0x7cf4ff, .32);
    const edgeMat = mat(0x51e4e8, .35, .3, 0x34cad4, .7);
    const poleMat = mat(0x252c38, .42, .76);
    const lampMat = mat(0xfad7a0, .24, .25, 0xffa849, 4);
    const redLightMat = mat(0x6e091d, .26, .12, 0xff183d, 4);
    const whiteLightMat = mat(0xcffaff, .18, .15, 0x83eeff, 5);

    function glowTexture(color) {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(64,64,1,64,64,64);
      g.addColorStop(0, color);
      g.addColorStop(.18, color.replace("1)", ".72)"));
      g.addColorStop(.48, color.replace("1)", ".16)"));
      g.addColorStop(1, color.replace("1)", "0)"));
      ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const cyanGlow = glowTexture("rgba(117,245,255,1)");
    const amberGlow = glowTexture("rgba(255,178,87,1)");

    function sprite(texture, scale, opacity) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false, opacity: opacity || 1 }));
      s.scale.set(scale, scale, 1);
      return s;
    }

    // Moon and distant atmosphere.
    const moon = new THREE.Mesh(new THREE.SphereGeometry(13, 32, 32), new THREE.MeshBasicMaterial({ color: 0xabbcff }));
    moon.position.set(-58, 46, -185);
    scene.add(moon);
    const moonHalo = sprite(glowTexture("rgba(149,176,255,1)"), 46, .18);
    moonHalo.position.copy(moon.position);
    moonHalo.position.z += 1;
    scene.add(moonHalo);

    // Deterministic stars give the road a fixed visual identity.
    const starPositions = [];
    let seed = 4107;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let i = 0; i < 850; i++) {
      const radius = 150 + rand() * 180;
      const theta = rand() * Math.PI * 2;
      const y = 28 + rand() * 120;
      starPositions.push(Math.cos(theta) * radius, y, -40 - rand() * 420);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x91c5f8, size: .7, transparent: true, opacity: .72, sizeAttenuation: true }));
    scene.add(stars);

    // Low, graphic mountain silhouettes.
    const mountains = new THREE.Group();
    const mountainMats = [mat(0x0b1222, 1, 0), mat(0x10162a, 1, 0), mat(0x121c33, 1, 0)];
    for (let i = 0; i < 22; i++) {
      const height = 12 + rand() * 27;
      const width = 22 + rand() * 38;
      const m = new THREE.Mesh(new THREE.ConeGeometry(width, height, 5), mountainMats[i % mountainMats.length]);
      m.position.set((i - 11) * 18 + (rand() - .5) * 16, height * .45 - 1, -160 - rand() * 32);
      m.rotation.y = rand() * Math.PI;
      mountains.add(m);
    }
    scene.add(mountains);

    const road = new THREE.Group();
    scene.add(road);
    const SEGMENT = 40, SEGMENTS = 12, TOTAL = SEGMENT * SEGMENTS;
    const roadSegments = [];
    function roadCurve(worldZ) {
      return Math.sin(worldZ * .0032) * 2.9 + Math.sin(worldZ * .00105 + 1.6) * 1.25;
    }
    function buildSegment(i) {
      const g = new THREE.Group();
      g.userData.worldZ = -i * SEGMENT - 10;
      const asphalt = new THREE.Mesh(new THREE.BoxGeometry(15, .18, SEGMENT + .7), roadMat);
      asphalt.position.y = -.26;
      g.add(asphalt);
      const leftShoulder = new THREE.Mesh(new THREE.BoxGeometry(3.8, .12, SEGMENT + .7), shoulderMat);
      leftShoulder.position.set(-9.25, -.22, 0); g.add(leftShoulder);
      const rightShoulder = leftShoulder.clone();
      rightShoulder.position.x = 9.25; g.add(rightShoulder);
      for (const x of [-2.5, 2.5]) {
        for (let z = -16; z <= 16; z += 9) {
          const dash = new THREE.Mesh(new THREE.BoxGeometry(.12, .025, 4.8), laneMat);
          dash.position.set(x, -.145, z); g.add(dash);
        }
      }
      for (const x of [-7.48, 7.48]) {
        const edge = new THREE.Mesh(new THREE.BoxGeometry(.18, .05, SEGMENT + .7), edgeMat);
        edge.position.set(x, -.12, 0); g.add(edge);
      }
      if (i % 2 === 0) {
        [-1, 1].forEach(side => {
          const x = side * 12.2;
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(.075, .12, 7.5, 8), poleMat);
          pole.position.set(x, 3.45, -7); g.add(pole);
          const arm = new THREE.Mesh(new THREE.BoxGeometry(2.2, .08, .08), poleMat);
          arm.position.set(x - side * 1.0, 7.1, -7); g.add(arm);
          const lamp = new THREE.Mesh(new THREE.SphereGeometry(.16, 12, 8), lampMat);
          lamp.position.set(x - side * 2.0, 7.02, -7); g.add(lamp);
          const halo = sprite(amberGlow, 4.3, .56);
          halo.position.set(x - side * 2.0, 7.02, -7); g.add(halo);
        });
      }
      if (i === 3 || i === 8) {
        const sign = new THREE.Group();
        const board = new THREE.Mesh(new THREE.BoxGeometry(3.7, 1.25, .12), mat(0x0b2735, .55, .35, 0x0a6174, .8));
        const post = new THREE.Mesh(new THREE.CylinderGeometry(.07, .09, 4.8, 8), poleMat);
        post.position.y = -2.8; sign.add(board, post);
        const texture = signTexture(i === 3 ? "EXIT 04" : "NO SIGNAL", i === 3 ? "#75f5ff" : "#ffbf68");
        const face = new THREE.Mesh(new THREE.PlaneGeometry(3.45, 1.02), new THREE.MeshBasicMaterial({ map: texture, transparent: true }));
        face.position.z = -.08; sign.add(face);
        sign.position.set(i === 3 ? -12.5 : 12.5, 5.2, 5); sign.rotation.y = i === 3 ? .12 : -.12; g.add(sign);
      }
      road.add(g); roadSegments.push(g);
    }
    function signTexture(text, color) {
      const c = document.createElement("canvas"); c.width = 512; c.height = 160;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#071622"; ctx.fillRect(0,0,c.width,c.height);
      ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.strokeRect(8,8,c.width-16,c.height-16);
      ctx.fillStyle = color; ctx.font = "500 43px Segoe UI, Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text,256,80);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    for (let i = 0; i < SEGMENTS; i++) buildSegment(i);

    // Player vehicle: a compact, luminous grand tourer.
    const car = new THREE.Group();
    car.position.set(0, .24, 4.0);
    scene.add(car);
    const carBody = mat(0x141d2b, .22, .9, 0x07111e, .4);
    const carLower = new THREE.Mesh(new THREE.BoxGeometry(2.95, .42, 4.95), carBody);
    carLower.position.y = .48; car.add(carLower);
    const hood = new THREE.Mesh(new THREE.BoxGeometry(2.65, .22, 1.5), mat(0x1d2a3a, .2, .86));
    hood.position.set(0, .82, -1.45); car.add(hood);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.22, .72, 2.25), mat(0x0a1828, .12, .8, 0x071726, .6));
    cabin.position.set(0, 1.04, .35); cabin.rotation.x = -.035; car.add(cabin);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.98, .08, 2.02), mat(0x2b3e50, .18, .72, 0x0d2536, .8));
    roof.position.set(0, 1.43, .32); car.add(roof);
    const windshield = new THREE.Mesh(new THREE.PlaneGeometry(1.86, .56), new THREE.MeshBasicMaterial({ color: 0x183c54, transparent: true, opacity: .88 }));
    windshield.position.set(0, 1.18, -.78); windshield.rotation.x = -.08; car.add(windshield);
    const rearGlass = windshield.clone(); rearGlass.position.z = 1.37; rearGlass.rotation.x = Math.PI + .08; car.add(rearGlass);
    const sill = mat(0x0b111c, .34, .8, 0x061b27, .5);
    [-1, 1].forEach(side => {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(.08, .08, 4.35), edgeMat);
      strip.position.set(side * 1.48, .52, 0); car.add(strip);
      const mirror = new THREE.Mesh(new THREE.BoxGeometry(.18, .12, .3), sill);
      mirror.position.set(side * 1.25, 1.16, -.78); mirror.rotation.y = side * .22; car.add(mirror);
    });
    const tailBar = new THREE.Mesh(new THREE.BoxGeometry(2.25, .13, .07), redLightMat);
    tailBar.position.set(0, .78, 2.47); car.add(tailBar);
    [-.86, .86].forEach(x => {
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(.5, .18, .08), redLightMat);
      lamp.position.set(x, .82, 2.51); car.add(lamp);
      const glow = sprite(glowTexture("rgba(255,24,61,1)"), 1.6, .34);
      glow.position.set(x, .82, 2.56); car.add(glow);
    });
    [-.84, .84].forEach(x => {
      const head = new THREE.Mesh(new THREE.BoxGeometry(.65, .13, .08), whiteLightMat);
      head.position.set(x, .79, -2.5); car.add(head);
    });
    const wheelMat = mat(0x03050a, .6, .55);
    const rimMat = mat(0x517486, .2, .8, 0x193643, .35);
    [-1, 1].forEach(side => [-1.55, 1.55].forEach(z => {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(.46, .46, .28, 20), wheelMat);
      tire.rotation.z = Math.PI / 2; tire.position.set(side * 1.43, .39, z); car.add(tire);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(.23, .23, .3, 16), rimMat);
      rim.rotation.z = Math.PI / 2; rim.position.set(side * 1.44, .39, z); car.add(rim);
    }));
    const headLight = new THREE.SpotLight(0xd5faff, 150, 94, .29, .8, 1.2);
    headLight.position.set(0, .98, -2.2); headLight.target.position.set(0, -.15, -54);
    car.add(headLight, headLight.target);
    const headLightLeft = new THREE.PointLight(0x9df8ff, 2.2, 8);
    headLightLeft.position.set(-.85, .82, -2.3);
    const headLightRight = headLightLeft.clone(); headLightRight.position.x = .85;
    car.add(headLightLeft, headLightRight);

    function makeTraffic(color, lane) {
      const g = new THREE.Group();
      g.userData.worldZ = -85 - rand() * 270;
      g.userData.lane = lane;
      g.userData.speed = 10 + rand() * 9;
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.15, .47, 3.9), mat(color, .28, .6, color, .15));
      body.position.y = .37; g.add(body);
      const top = new THREE.Mesh(new THREE.BoxGeometry(1.67, .46, 1.65), mat(0x0a1623, .14, .68));
      top.position.set(0, .76, .1); g.add(top);
      const lamps = new THREE.Mesh(new THREE.BoxGeometry(1.48, .1, .06), redLightMat);
      lamps.position.set(0, .51, 1.98); g.add(lamps);
      g.add(sprite(glowTexture("rgba(255,24,61,1)"), 1.4, .23));
      return g;
    }
    const traffic = [makeTraffic(0x493b72, -1), makeTraffic(0x1d5260, 1), makeTraffic(0x6f4d31, -1)];
    traffic.forEach(v => { v.children[v.children.length - 1].position.set(0, .54, 2.02); scene.add(v); });

    let running = false;
    let boost = false;
    let targetX = 0;
    let playerX = 0;
    let distance = 0;
    let driveTime = 0;
    let speed = 21;
    let last = performance.now();
    const keys = Object.create(null);
    addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === "Space") { boost = true; e.preventDefault(); }
      if (!running && (e.code === "Enter" || e.code === "Space")) start();
    });
    addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; if (e.code === "Space") boost = false; });
    boot.addEventListener("click", start);
    function start() { running = true; boot.classList.add("hidden"); last = performance.now(); }
    function damp(current, target, lambda, dt) { return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt)); }
    function update(dt) {
      const left = keys.a || keys.arrowleft;
      const right = keys.d || keys.arrowright;
      if (left) targetX -= dt * 6.7;
      if (right) targetX += dt * 6.7;
      targetX = THREE.MathUtils.clamp(targetX, -4.8, 4.8);
      playerX = damp(playerX, targetX, 7, dt);
      car.position.x = playerX;
      car.rotation.z = damp(car.rotation.z, (targetX - playerX) * -.07, 8, dt);
      car.rotation.y = damp(car.rotation.y, (targetX - playerX) * .018, 8, dt);
      const targetSpeed = boost ? 39 : 22;
      speed = damp(speed, targetSpeed, 1.8, dt);
      distance += speed * dt;
      driveTime += dt;
      const roadBase = roadCurve(distance);
      roadSegments.forEach(seg => {
        while (seg.userData.worldZ + distance > 68) seg.userData.worldZ -= TOTAL;
        const rel = seg.userData.worldZ + distance;
        seg.position.z = rel;
        seg.position.x = roadCurve(seg.userData.worldZ) - roadBase;
        const ahead = roadCurve(seg.userData.worldZ + 4) - roadCurve(seg.userData.worldZ - 4);
        seg.rotation.y = Math.atan2(ahead, 8);
      });
      traffic.forEach((v, idx) => {
        v.userData.worldZ += (speed - v.userData.speed) * dt;
        while (v.userData.worldZ + distance > 48) {
          v.userData.worldZ -= TOTAL - 35;
          v.userData.lane = idx % 2 ? 1 : -1;
        }
        const rel = v.userData.worldZ + distance;
        v.position.z = rel;
        v.position.x = roadCurve(v.userData.worldZ) - roadBase + v.userData.lane * 3.15;
        v.rotation.y = Math.atan2(roadCurve(v.userData.worldZ + 4) - roadCurve(v.userData.worldZ - 4), 8);
      });
      camera.position.x = damp(camera.position.x, playerX * .16, 3, dt);
      camera.position.y = 4.2 + Math.sin(driveTime * 1.8) * .018;
      camera.lookAt(camera.position.x * .34, 1.0, -34);
      stars.rotation.y = distance * .000035;
      speedReadout.textContent = String(Math.round(speed * 3.52)).padStart(3, "0");
      distanceReadout.textContent = (distance / 100).toFixed(1).padStart(5, "0");
      const mins = Math.floor(driveTime / 60).toString().padStart(2, "0");
      const secs = Math.floor(driveTime % 60).toString().padStart(2, "0");
      clockReadout.textContent = mins + ":" + secs;
      meter.style.width = (48 + Math.min(speed / 39, 1) * 52) + "%";
      statusText.textContent = boost ? "BOOST // HEADLIGHTS HOT" : (Math.abs(targetX - playerX) > .15 ? "MANUAL // VECTOR SHIFT" : "AUTOPILOT // NOMINAL");
    }
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, .05);
      last = now;
      if (running) update(dt);
      renderer.render(scene, camera);
    }
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
    frame(performance.now());
  })();
  </script>
</body>
</html>
