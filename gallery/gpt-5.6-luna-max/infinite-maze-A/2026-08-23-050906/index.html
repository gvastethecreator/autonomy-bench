<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Infinite Maze // Auto Journey</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #d8f6ff;
      --muted: #80a6b6;
      --cyan: #22e6ff;
      --amber: #ffbd67;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #04070b; }
    body {
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      letter-spacing: .1em;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      color: var(--ink);
      text-shadow: 0 0 14px rgba(34, 230, 255, .35);
    }
    #hud::before {
      content: "";
      position: absolute;
      left: 24px;
      top: 24px;
      width: 42px;
      height: 42px;
      border-left: 1px solid rgba(34,230,255,.7);
      border-top: 1px solid rgba(34,230,255,.7);
      opacity: .9;
    }
    #hud::after {
      content: "";
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 42px;
      height: 42px;
      border-right: 1px solid rgba(255,189,103,.65);
      border-bottom: 1px solid rgba(255,189,103,.65);
      opacity: .9;
    }
    .topline {
      position: absolute;
      top: 28px;
      left: 82px;
      right: 82px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      font-size: clamp(11px, 1.2vw, 16px);
      font-weight: 600;
      letter-spacing: .28em;
      color: #ecfcff;
    }
    .subbrand {
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .26em;
    }
    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, minmax(70px, 1fr));
      gap: 17px;
      text-align: right;
      min-width: 265px;
    }
    .telemetry label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .2em;
    }
    .telemetry strong {
      display: block;
      color: #effcff;
      font-size: 13px;
      letter-spacing: .18em;
      font-weight: 500;
    }
    #status {
      color: var(--cyan);
      transition: color .35s ease;
    }
    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translate(-50%, -50%);
      opacity: .68;
    }
    .crosshair::before, .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(216,246,255,.75);
      box-shadow: 0 0 8px rgba(34,230,255,.55);
    }
    .crosshair::before { left: 8px; top: 0; width: 1px; height: 17px; }
    .crosshair::after { left: 0; top: 8px; width: 17px; height: 1px; }
    .bottomline {
      position: absolute;
      left: 82px;
      right: 82px;
      bottom: 29px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .readout {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.8;
      letter-spacing: .22em;
    }
    .readout em { color: var(--amber); font-style: normal; }
    .signal {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #9cc4cf;
      font-size: 8px;
      letter-spacing: .2em;
    }
    .signal i {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 1.55s ease-in-out infinite;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      background: #04070b;
      color: var(--ink);
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }
    #boot.hidden { opacity: 0; visibility: hidden; }
    .boot-card { text-align: center; }
    .boot-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 23px;
      border: 1px solid rgba(34,230,255,.75);
      transform: rotate(45deg);
      box-shadow: 0 0 28px rgba(34,230,255,.18), inset 0 0 18px rgba(34,230,255,.1);
    }
    .boot-mark::after {
      content: "";
      display: block;
      width: 22px;
      height: 22px;
      margin: 15px;
      border: 1px solid rgba(255,189,103,.8);
    }
    .boot-title { font-size: 13px; letter-spacing: .35em; }
    .boot-copy { margin-top: 10px; color: var(--muted); font-size: 9px; letter-spacing: .2em; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.75); } 50% { opacity: 1; transform: scale(1); } }
    @media (max-width: 720px) {
      .topline, .bottomline { left: 32px; right: 32px; }
      #hud::before { left: 12px; top: 12px; }
      #hud::after { right: 12px; bottom: 12px; }
      .telemetry { min-width: 210px; gap: 9px; }
      .brand { font-size: 10px; }
      .subbrand { font-size: 7px; }
      .readout { font-size: 7px; }
      .signal { font-size: 7px; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <div class="boot-mark"></div>
      <div class="boot-title">INFINITE MAZE</div>
      <div class="boot-copy">AUTONOMOUS NAVIGATION INITIALIZING</div>
    </div>
  </div>
  <div id="hud" aria-hidden="true">
    <div class="topline">
      <div>
        <div class="brand">INFINITE MAZE</div>
        <div class="subbrand">CONTINUOUS FIRST-PERSON JOURNEY / NO INPUT REQUIRED</div>
      </div>
      <div class="telemetry">
        <div><label>MODE</label><strong id="status">AUTOPILOT</strong></div>
        <div><label>SECTOR</label><strong id="sector">001</strong></div>
        <div><label>RANGE</label><strong id="range">00000 M</strong></div>
      </div>
    </div>
    <div class="crosshair"></div>
    <div class="bottomline">
      <div class="readout">ROUTE VECTOR <em id="vector">N 00°</em><br />PATH MEMORY <em>LIVE / STREAMING</em></div>
      <div class="signal"><i></i><span>SELF-NAVIGATING</span></div>
    </div>
  </div>

  <script type="module">
    let THREE;
    try {
      THREE = await import("https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js");
    } catch (error) {
      document.querySelector(".boot-copy").textContent = "RENDERER UNAVAILABLE / REFRESH TO RETRY";
      throw error;
    }

    const boot = document.getElementById("boot");
    const status = document.getElementById("status");
    const sectorReadout = document.getElementById("sector");
    const rangeReadout = document.getElementById("range");
    const vectorReadout = document.getElementById("vector");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04070b);
    scene.fog = new THREE.Fog(0x04070b, 34, 165);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.04, 800);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x284b63, 0x020307, 1.7));
    const keyLight = new THREE.DirectionalLight(0x8bdfff, 1.4);
    keyLight.position.set(-28, 45, 20);
    scene.add(keyLight);
    const headLight = new THREE.PointLight(0x5deaff, 3.2, 55, 2);
    scene.add(headLight);

    const floorTextureCanvas = document.createElement("canvas");
    floorTextureCanvas.width = floorTextureCanvas.height = 256;
    const floorTextureContext = floorTextureCanvas.getContext("2d");
    floorTextureContext.fillStyle = "#0a1018";
    floorTextureContext.fillRect(0, 0, 256, 256);
    floorTextureContext.strokeStyle = "rgba(77,139,158,.19)";
    floorTextureContext.lineWidth = 1;
    for (let i = 0; i <= 256; i += 32) {
      floorTextureContext.beginPath(); floorTextureContext.moveTo(i, 0); floorTextureContext.lineTo(i, 256); floorTextureContext.stroke();
      floorTextureContext.beginPath(); floorTextureContext.moveTo(0, i); floorTextureContext.lineTo(256, i); floorTextureContext.stroke();
    }
    floorTextureContext.strokeStyle = "rgba(34,230,255,.22)";
    floorTextureContext.beginPath(); floorTextureContext.moveTo(0, 4); floorTextureContext.lineTo(256, 4); floorTextureContext.stroke();
    const floorTexture = new THREE.CanvasTexture(floorTextureCanvas);
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(1, 6);

    const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTexture, color: 0x8ba9b0, roughness: .9, metalness: .32 });
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x1a2630, roughness: .74, metalness: .55 });
    const wallInnerMaterial = new THREE.MeshStandardMaterial({ color: 0x0c151e, roughness: .82, metalness: .3 });
    const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x070c12, roughness: .92, metalness: .22, side: THREE.DoubleSide });
    const cyanMaterial = new THREE.MeshStandardMaterial({ color: 0x1de9ff, emissive: 0x00a9c7, emissiveIntensity: 3.6, roughness: .3, metalness: .4 });
    const amberMaterial = new THREE.MeshStandardMaterial({ color: 0xffba63, emissive: 0xb84e18, emissiveIntensity: 2.7, roughness: .34, metalness: .38 });
    const dimCyanMaterial = new THREE.MeshBasicMaterial({ color: 0x27d7ed, transparent: true, opacity: .7 });
    const dimAmberMaterial = new THREE.MeshBasicMaterial({ color: 0xffb85d, transparent: true, opacity: .64 });
    const sharedLineCyan = new THREE.LineBasicMaterial({ color: 0x2be6ff, transparent: true, opacity: .72 });
    const sharedLineAmber = new THREE.LineBasicMaterial({ color: 0xffba66, transparent: true, opacity: .68 });

    const corridorGroup = new THREE.Group();
    const architectureGroup = new THREE.Group();
    const atmosphereGroup = new THREE.Group();
    scene.add(corridorGroup, architectureGroup, atmosphereGroup);

    let randomState = 0x9e3779b9;
    function random() {
      randomState |= 0;
      randomState = randomState + 0x6d2b79f5 | 0;
      let t = Math.imul(randomState ^ randomState >>> 15, 1 | randomState);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    const corridorWidth = 9;
    const corridorHalf = corridorWidth / 2;
    const wallHeight = 10;
    const routeNodes = [
      new THREE.Vector3(0, 0, 28),
      new THREE.Vector3(0, 0, 0)
    ];
    const routeHeadings = [0, 0];
    let routeCurve;
    let routeLength = 0;
    let routePoints = [];
    let travelDistance = 0;
    let rebuildCount = 0;

    function directionForHeading(heading) {
      return new THREE.Vector3(Math.sin(heading), 0, -Math.cos(heading));
    }

    function extendRouteUntil(minimumLength) {
      let estimate = routeNodes[routeNodes.length - 1].distanceTo(routeNodes[0]);
      while (estimate < minimumLength) {
        const previous = routeNodes[routeNodes.length - 1];
        const previousHeading = routeHeadings[routeHeadings.length - 1];
        let heading = previousHeading;
        const roll = random();
        if (roll < .34) heading += Math.PI / 2;
        else if (roll > .66) heading -= Math.PI / 2;
        const direction = directionForHeading(heading);
        const length = 18 + random() * 11;
        const next = previous.clone().addScaledVector(direction, length);
        routeNodes.push(next);
        routeHeadings.push(heading);
        estimate += length;
      }
    }

    function disposeGeometryTree(root) {
      root.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
      });
      while (root.children.length) root.remove(root.children[root.children.length - 1]);
    }

    function makeRibbon(points, width, bottom, top, material, uvScale = .08) {
      const positions = [];
      const uvs = [];
      const indices = [];
      let distance = 0;
      for (let i = 0; i < points.length; i++) {
        const current = points[i];
        const before = points[Math.max(0, i - 1)];
        const after = points[Math.min(points.length - 1, i + 1)];
        const tangent = new THREE.Vector2(after.x - before.x, after.z - before.z).normalize();
        const normal = new THREE.Vector2(-tangent.y, tangent.x);
        const left = new THREE.Vector3(current.x + normal.x * width, 0, current.z + normal.y * width);
        const right = new THREE.Vector3(current.x - normal.x * width, 0, current.z - normal.y * width);
        if (i > 0) distance += current.distanceTo(points[i - 1]);
        positions.push(left.x, bottom, left.z, right.x, bottom, right.z, left.x, top, left.z, right.x, top, right.z);
        uvs.push(0, distance * uvScale, 1, distance * uvScale, 0, distance * uvScale, 1, distance * uvScale);
        if (i < points.length - 1) {
          const a = i * 4;
          const b = (i + 1) * 4;
          indices.push(a, b, a + 2, a + 2, b, b + 2, a + 1, a + 3, b + 1, b + 1, a + 3, b + 3);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, material);
    }

    function createLine(points, y, material, offset = 0) {
      const linePoints = points.map((point, index) => {
        const before = points[Math.max(0, index - 1)];
        const after = points[Math.min(points.length - 1, index + 1)];
        const tangent = new THREE.Vector2(after.x - before.x, after.z - before.z).normalize();
        const normal = new THREE.Vector2(-tangent.y, tangent.x);
        return new THREE.Vector3(point.x + normal.x * offset, y, point.z + normal.y * offset);
      });
      const geometry = new THREE.BufferGeometry().setFromPoints(linePoints);
      return new THREE.Line(geometry, material);
    }

    function alignToTangent(object, tangent) {
      object.rotation.y = Math.atan2(tangent.x, tangent.z);
      return object;
    }

    function buildArchitecture(points) {
      const neonGeometry = new THREE.BoxGeometry(.09, .11, 3.3);
      const finGeometry = new THREE.BoxGeometry(.24, 3.6, .18);
      const beamGeometry = new THREE.BoxGeometry(corridorWidth + 1.2, .48, .58);
      const beamLightGeometry = new THREE.BoxGeometry(corridorWidth * .72, .08, .16);
      const towerMaterials = [wallMaterial, wallInnerMaterial, wallMaterial];
      for (let i = 3; i < points.length - 2; i += 6) {
        const current = points[i];
        const before = points[i - 1];
        const after = points[i + 1];
        const tangent2 = new THREE.Vector2(after.x - before.x, after.z - before.z).normalize();
        const tangent = new THREE.Vector3(tangent2.x, 0, tangent2.y);
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        const beam = new THREE.Mesh(beamGeometry, wallMaterial);
        beam.position.set(current.x, wallHeight - .62, current.z);
        alignToTangent(beam, tangent);
        architectureGroup.add(beam);
        const beamLight = new THREE.Mesh(beamLightGeometry, i % 12 === 0 ? amberMaterial : cyanMaterial);
        beamLight.position.set(current.x, wallHeight - .92, current.z);
        alignToTangent(beamLight, tangent);
        architectureGroup.add(beamLight);

        const side = (i / 6) % 2 ? 1 : -1;
        const panelPosition = current.clone().addScaledVector(normal, side * (corridorHalf + .06));
        panelPosition.y = 2.45 + (i % 3) * .48;
        const panel = new THREE.Mesh(neonGeometry, i % 12 === 0 ? amberMaterial : cyanMaterial);
        panel.position.copy(panelPosition);
        alignToTangent(panel, tangent);
        architectureGroup.add(panel);

        if (i % 12 === 3) {
          const outerSide = side * -1;
          const outerDistance = corridorHalf + 5.2 + random() * 5;
          const towerHeight = 6 + random() * 9;
          const tower = new THREE.Mesh(finGeometry, towerMaterials[i % towerMaterials.length]);
          tower.scale.set(3.5 + random() * 4, towerHeight / 3.6, 3 + random() * 3);
          tower.position.copy(current).addScaledVector(normal, outerSide * outerDistance);
          tower.position.y = towerHeight / 2;
          alignToTangent(tower, tangent);
          architectureGroup.add(tower);
          const towerCap = new THREE.Mesh(new THREE.BoxGeometry(1.9, .14, 2.3), i % 24 === 3 ? amberMaterial : dimCyanMaterial);
          towerCap.position.set(tower.position.x, towerHeight + .1, tower.position.z);
          alignToTangent(towerCap, tangent);
          architectureGroup.add(towerCap);
        }
        if (i % 18 === 0) {
          const beacon = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), amberMaterial);
          beacon.position.copy(current).addScaledVector(normal, -side * (corridorHalf - .12));
          beacon.position.y = wallHeight - 1.38;
          architectureGroup.add(beacon);
        }
      }
    }

    function buildCorridor() {
      disposeGeometryTree(corridorGroup);
      disposeGeometryTree(architectureGroup);
      routeCurve = new THREE.CatmullRomCurve3(routeNodes, false, "centripetal", .18);
      routeLength = routeCurve.getLength();
      routePoints = routeCurve.getSpacedPoints(Math.max(180, Math.ceil(routeLength / 3.7)));
      const floor = makeRibbon(routePoints, corridorHalf, 0, 0, floorMaterial, .1);
      corridorGroup.add(floor);
      const leftWall = makeRibbon(routePoints, corridorHalf, 0, wallHeight, wallMaterial, .045);
      const rightWall = makeRibbon(routePoints, -corridorHalf, 0, wallHeight, wallInnerMaterial, .045);
      corridorGroup.add(leftWall, rightWall);
      const ceiling = makeRibbon(routePoints, corridorHalf * .96, wallHeight, wallHeight + .02, ceilingMaterial, .04);
      corridorGroup.add(ceiling);
      const leftEdge = createLine(routePoints, .2, sharedLineCyan, corridorHalf - .13);
      const rightEdge = createLine(routePoints, .2, sharedLineAmber, -corridorHalf + .13);
      corridorGroup.add(leftEdge, rightEdge);
      buildArchitecture(routePoints);
      rebuildCount++;
    }

    extendRouteUntil(2400);
    buildCorridor();

    const dustPositions = [];
    for (let i = 0; i < 700; i++) {
      dustPositions.push((random() - .5) * 140, 1 + random() * 26, 34 - random() * 390);
    }
    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute("position", new THREE.Float32BufferAttribute(dustPositions, 3));
    const dust = new THREE.Points(dustGeometry, new THREE.PointsMaterial({ color: 0x6bd9eb, size: .055, transparent: true, opacity: .38, sizeAttenuation: true }));
    atmosphereGroup.add(dust);

    const clock = new THREE.Clock();
    let elapsed = 0;
    let lastSector = 0;
    let lastRebuildTravel = 0;
    function updateHud(tangent) {
      const degrees = (Math.atan2(tangent.x, -tangent.z) * 180 / Math.PI + 360) % 360;
      const cardinal = degrees < 22.5 || degrees >= 337.5 ? "N" : degrees < 67.5 ? "NE" : degrees < 112.5 ? "E" : degrees < 157.5 ? "SE" : degrees < 202.5 ? "S" : degrees < 247.5 ? "SW" : degrees < 292.5 ? "W" : "NW";
      vectorReadout.textContent = `${cardinal} ${String(Math.round(degrees)).padStart(3, "0")}°`;
      rangeReadout.textContent = `${String(Math.floor(travelDistance)).padStart(5, "0")} M`;
      const currentSector = Math.floor(travelDistance / 120) + 1;
      if (currentSector !== lastSector) {
        lastSector = currentSector;
        sectorReadout.textContent = String(currentSector).padStart(3, "0");
        status.style.color = currentSector % 3 === 0 ? "#ffbd67" : "#22e6ff";
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), .05);
      elapsed += delta;
      travelDistance += delta * 8.25;
      if (travelDistance > routeLength - 260 && travelDistance - lastRebuildTravel > 180) {
        lastRebuildTravel = travelDistance;
        extendRouteUntil(routeLength + 1500);
        buildCorridor();
      }
      const progress = Math.min(.999999, Math.max(0, travelDistance / routeLength));
      const point = routeCurve.getPointAt(progress);
      const tangent = routeCurve.getTangentAt(progress).normalize();
      const lookProgress = Math.min(.999999, Math.max(0, (travelDistance + 8) / routeLength));
      const lookPoint = routeCurve.getPointAt(lookProgress);
      const bob = Math.sin(elapsed * 5.2) * .035 + Math.sin(elapsed * 2.1) * .025;
      camera.position.set(point.x, 3.25 + bob, point.z);
      camera.lookAt(lookPoint.x, 3.15 + bob * .35, lookPoint.z);
      headLight.position.copy(camera.position);
      headLight.intensity = 2.8 + Math.sin(elapsed * 3.4) * .35;
      cyanMaterial.emissiveIntensity = 3.25 + Math.sin(elapsed * 2.8) * .42;
      amberMaterial.emissiveIntensity = 2.45 + Math.sin(elapsed * 2.1 + 1.4) * .25;
      dust.position.x = camera.position.x * .06;
      dust.position.z = camera.position.z * .025;
      updateHud(tangent);
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    setTimeout(() => boot.classList.add("hidden"), 700);
    animate();
  </script>
</body>
</html>
