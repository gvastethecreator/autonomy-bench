<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightfall Express</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #d8f7ff;
      --muted: #75a8b5;
      --cyan: #49f1f3;
      --violet: #b979ff;
      --amber: #ffb762;
    }

    * { box-sizing: border-box; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030711;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    canvas { display: block; }

    .vignette,
    .scanlines,
    .color-wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .vignette {
      background:
        radial-gradient(ellipse at center, transparent 48%, rgba(1, 4, 13, 0.18) 70%, rgba(1, 3, 10, 0.78) 100%),
        linear-gradient(180deg, rgba(0, 5, 16, 0.22), transparent 22%, transparent 74%, rgba(0, 5, 16, 0.42));
    }

    .scanlines {
      opacity: 0.06;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 1px, transparent 1px 4px);
      mix-blend-mode: screen;
    }

    .color-wash {
      background: radial-gradient(ellipse at 53% 35%, rgba(39, 111, 147, .08), transparent 47%), radial-gradient(ellipse at 70% 82%, rgba(173, 55, 255, .05), transparent 45%);
      mix-blend-mode: screen;
    }

    .hud {
      position: fixed;
      z-index: 5;
      inset: 0;
      padding: clamp(20px, 4vw, 52px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      text-shadow: 0 0 16px rgba(71, 226, 238, .24);
    }

    .hud-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .eyebrow {
      margin-bottom: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .33em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px 2px var(--cyan);
      animation: breathe 1.7s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      max-width: 520px;
      color: #e7fbff;
      font-size: clamp(25px, 4vw, 52px);
      line-height: .96;
      font-weight: 300;
      letter-spacing: .11em;
    }

    .route-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
    }

    .telemetry {
      min-width: 145px;
      padding: 14px 16px 13px;
      border-left: 1px solid rgba(73, 241, 243, .54);
      background: linear-gradient(90deg, rgba(8, 39, 53, .42), transparent);
      text-align: right;
    }

    .telemetry-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .23em;
    }

    .telemetry-value {
      margin-top: 4px;
      color: var(--cyan);
      font-size: 28px;
      font-weight: 300;
      letter-spacing: .06em;
    }

    .telemetry-unit {
      margin-left: 3px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .19em;
    }

    .hud-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
    }

    .progress-wrap { width: min(360px, 45vw); }

    .phase {
      margin-bottom: 11px;
      color: #a6d5de;
      font-size: 10px;
      letter-spacing: .24em;
    }

    .progress-track {
      height: 2px;
      overflow: hidden;
      background: rgba(126, 183, 196, .18);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--violet), var(--cyan), var(--amber));
      box-shadow: 0 0 14px rgba(73, 241, 243, .9);
      transition: width .08s linear;
    }

    .footer-note {
      color: rgba(173, 213, 221, .65);
      font-size: 9px;
      line-height: 1.6;
      letter-spacing: .18em;
      text-align: right;
    }

    .footer-note span { color: var(--cyan); }

    @keyframes breathe {
      0%, 100% { opacity: .42; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (max-width: 620px) {
      .hud { padding: 22px; }
      .telemetry { min-width: 110px; padding-right: 0; border-left: 0; }
      .telemetry-value { font-size: 22px; }
      .hud-bottom { align-items: flex-start; flex-direction: column; gap: 16px; }
      .progress-wrap { width: min(300px, 74vw); }
      .footer-note { text-align: left; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="color-wash"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="hud" aria-hidden="true">
    <div class="hud-top">
      <div>
        <div class="eyebrow"><span class="live-dot"></span>LIVE RIDE / LOOP 01</div>
        <h1>NIGHTFALL<br />EXPRESS</h1>
        <div class="route-note">A continuous flight through the electric wild</div>
      </div>
      <div class="telemetry">
        <div class="telemetry-label">VELOCITY</div>
        <div class="telemetry-value"><span id="speed">072</span><span class="telemetry-unit">KM/H</span></div>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="progress-wrap">
        <div id="phase" class="phase">ASCENT / MAG-RAIL LIFT</div>
        <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
      </div>
      <div class="footer-note"><span>NO BRAKES</span><br />THE TRACK REMEMBERS THE WAY HOME</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const app = document.getElementById("app");
    const speedReadout = document.getElementById("speed");
    const phaseReadout = document.getElementById("phase");
    const progressReadout = document.getElementById("progress");

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.setClearColor(0x030711, 1);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x071221, 0.0085);

    const camera = new THREE.PerspectiveCamera(74, window.innerWidth / window.innerHeight, 0.08, 500);
    camera.position.set(0, 5, 36);

    const ambient = new THREE.HemisphereLight(0x6aa9ca, 0x080b17, 1.25);
    scene.add(ambient);

    const moonLight = new THREE.DirectionalLight(0x8c9fff, 2.35);
    moonLight.position.set(-50, 90, -70);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(1024, 1024);
    scene.add(moonLight);

    const cyanLight = new THREE.PointLight(0x2ef6ed, 8, 38, 2);
    cyanLight.position.set(0, 8, 24);
    scene.add(cyanLight);

    const violetLight = new THREE.PointLight(0xb25cff, 11, 55, 2);
    violetLight.position.set(-28, 18, -34);
    scene.add(violetLight);

    const seed = (n) => {
      const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
      return x - Math.floor(x);
    };

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(280, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          varying vec3 vWorldPosition;
          void main() {
            vec3 dir = normalize(vWorldPosition);
            float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
            vec3 zenith = vec3(0.008, 0.017, 0.055);
            vec3 high = vec3(0.025, 0.055, 0.15);
            vec3 horizon = vec3(0.16, 0.045, 0.19);
            vec3 col = mix(horizon, high, smoothstep(0.06, 0.52, h));
            col = mix(col, zenith, smoothstep(0.46, 1.0, h));
            float band = exp(-pow((dir.y - 0.09) * 8.0, 2.0));
            col += band * vec3(0.16, 0.025, 0.18);
            float pulse = 0.5 + 0.5 * sin(uTime * 0.08 + dir.x * 3.0);
            col += pulse * 0.012 * vec3(0.15, 0.32, 0.42) * smoothstep(0.3, 1.0, h);
            gl_FragColor = vec4(col, 1.0);
          }
        `
      })
    );
    scene.add(sky);

    const starPositions = [];
    for (let i = 0; i < 1300; i++) {
      const angle = seed(i * 3.1) * Math.PI * 2;
      const radius = 90 + seed(i * 5.7) * 155;
      const y = 12 + seed(i * 9.4) * 150;
      starPositions.push(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    }
    const starsGeometry = new THREE.BufferGeometry();
    starsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(
      starsGeometry,
      new THREE.PointsMaterial({ color: 0x9fd9ff, size: 0.75, sizeAttenuation: true, transparent: true, opacity: 0.78, depthWrite: false, blending: THREE.AdditiveBlending })
    );
    scene.add(stars);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(8.5, 32, 20),
      new THREE.MeshBasicMaterial({ color: 0x9a79ff, transparent: true, opacity: 0.75 })
    );
    moon.position.set(-89, 66, -105);
    scene.add(moon);
    const moonHalo = new THREE.Mesh(
      new THREE.SphereGeometry(12.7, 32, 20),
      new THREE.MeshBasicMaterial({ color: 0x7c74ff, transparent: true, opacity: 0.095, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    moonHalo.position.copy(moon.position);
    scene.add(moonHalo);

    const groundY = (x, z) => -13.5 + Math.sin(x * 0.075) * 1.15 + Math.cos(z * 0.063) * 1.2 + Math.sin((x + z) * 0.032) * 0.7;
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(420, 420, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x08111d, roughness: 0.95, metalness: 0.04 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -14.2;
    ground.receiveShadow = true;
    scene.add(ground);

    const horizonRing = new THREE.Mesh(
      new THREE.TorusGeometry(92, 0.16, 8, 128),
      new THREE.MeshBasicMaterial({ color: 0x6e55d9, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending })
    );
    horizonRing.rotation.x = Math.PI / 2;
    horizonRing.position.y = -8.5;
    scene.add(horizonRing);

    const trackPoints = [
      new THREE.Vector3(0, 4.5, 37),
      new THREE.Vector3(18, 6.2, 34),
      new THREE.Vector3(34, 11.5, 20),
      new THREE.Vector3(43, 14.2, 1),
      new THREE.Vector3(37, 3.3, -21),
      new THREE.Vector3(22, -0.4, -38),
      new THREE.Vector3(-1, 7.8, -44),
      new THREE.Vector3(-25, 15.5, -35),
      new THREE.Vector3(-41, 10.4, -16),
      new THREE.Vector3(-45, -1.7, 6),
      new THREE.Vector3(-31, 2.4, 27),
      new THREE.Vector3(-12, 5.2, 39)
    ];
    const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, "catmullrom", 0.46);

    function frameAt(t) {
      const wrapped = ((t % 1) + 1) % 1;
      const center = trackCurve.getPointAt(wrapped);
      const tangent = trackCurve.getTangentAt(wrapped).normalize();
      const right = new THREE.Vector3(0, 1, 0).cross(tangent);
      if (right.lengthSq() < 0.001) right.set(1, 0, 0);
      right.normalize();
      const up = tangent.clone().cross(right).normalize();
      return { center, tangent, right, up };
    }

    class OffsetCurve extends THREE.Curve {
      constructor(offset, lift) { super(); this.offset = offset; this.lift = lift; }
      getPoint(t, target = new THREE.Vector3()) {
        const f = frameAt(t);
        return target.copy(f.center).addScaledVector(f.right, this.offset).addScaledVector(f.up, this.lift);
      }
    }

    const trackGroup = new THREE.Group();
    scene.add(trackGroup);

    const railMaterial = new THREE.MeshStandardMaterial({ color: 0x66ffff, emissive: 0x00bfcd, emissiveIntensity: 0.78, metalness: 0.9, roughness: 0.2 });
    const darkRailMaterial = new THREE.MeshStandardMaterial({ color: 0x182d40, emissive: 0x062e47, emissiveIntensity: 0.7, metalness: 0.8, roughness: 0.28 });
    const railLeft = new THREE.Mesh(new THREE.TubeGeometry(new OffsetCurve(-1.28, 0.34), 260, 0.12, 8, true), railMaterial);
    const railRight = new THREE.Mesh(new THREE.TubeGeometry(new OffsetCurve(1.28, 0.34), 260, 0.12, 8, true), railMaterial);
    const centerRail = new THREE.Mesh(new THREE.TubeGeometry(new OffsetCurve(0, 0.12), 260, 0.055, 6, true), darkRailMaterial);
    railLeft.castShadow = railRight.castShadow = true;
    trackGroup.add(railLeft, railRight, centerRail);

    const tieCount = 170;
    const tieGeometry = new THREE.BoxGeometry(3.55, 0.16, 0.48);
    const tieMaterial = new THREE.MeshStandardMaterial({ color: 0x243848, emissive: 0x071c2e, emissiveIntensity: 0.55, roughness: 0.72, metalness: 0.25 });
    const ties = new THREE.InstancedMesh(tieGeometry, tieMaterial, tieCount);
    const tieMatrix = new THREE.Matrix4();
    const tieQuaternion = new THREE.Quaternion();
    const tieScale = new THREE.Vector3(1, 1, 1);
    for (let i = 0; i < tieCount; i++) {
      const f = frameAt(i / tieCount);
      const basis = new THREE.Matrix4().makeBasis(f.right, f.up, f.tangent);
      tieQuaternion.setFromRotationMatrix(basis);
      tieMatrix.compose(f.center.clone().addScaledVector(f.up, 0.03), tieQuaternion, tieScale);
      tieMatrix.scale(new THREE.Vector3(1, 1, 1));
      ties.setMatrixAt(i, tieMatrix);
    }
    ties.instanceMatrix.needsUpdate = true;
    ties.castShadow = true;
    trackGroup.add(ties);

    function cylinderBetween(a, b, radius, material, radialSegments = 8) {
      const midpoint = a.clone().add(b).multiplyScalar(0.5);
      const direction = b.clone().sub(a);
      const length = direction.length();
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.18, length, radialSegments), material);
      mesh.position.copy(midpoint);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      return mesh;
    }

    const supportMaterial = new THREE.MeshStandardMaterial({ color: 0x152a3a, emissive: 0x062738, emissiveIntensity: 0.45, metalness: 0.8, roughness: 0.34 });
    const supportAccent = new THREE.MeshStandardMaterial({ color: 0x4af6ea, emissive: 0x10bfc0, emissiveIntensity: 0.9, metalness: 0.65, roughness: 0.25 });
    const supports = new THREE.Group();
    scene.add(supports);
    for (let i = 0; i < 22; i++) {
      const t = (i + 0.23) / 22;
      const f = frameAt(t);
      const baseCenter = new THREE.Vector3(f.center.x, groundY(f.center.x, f.center.z), f.center.z);
      const top = f.center.clone().addScaledVector(f.up, 0.2);
      const leftFoot = baseCenter.clone().addScaledVector(f.right, -0.92);
      const rightFoot = baseCenter.clone().addScaledVector(f.right, 0.92);
      const leftTop = top.clone().addScaledVector(f.right, -1.04);
      const rightTop = top.clone().addScaledVector(f.right, 1.04);
      supports.add(cylinderBetween(leftFoot, leftTop, 0.2, supportMaterial));
      supports.add(cylinderBetween(rightFoot, rightTop, 0.2, supportMaterial));
      const braceA = leftFoot.clone().addScaledVector(f.up, 2.7);
      const braceB = rightFoot.clone().addScaledVector(f.up, 1.2);
      supports.add(cylinderBetween(braceA, braceB, 0.065, supportAccent, 6));
      const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.16, 0.22), supportMaterial);
      const barBasis = new THREE.Matrix4().makeBasis(f.right, f.up, f.tangent);
      bar.quaternion.setFromRotationMatrix(new THREE.Matrix4().extractRotation(barBasis));
      bar.position.copy(top).addScaledVector(f.up, -0.3);
      bar.castShadow = true;
      supports.add(bar);
    }

    const beaconGroup = new THREE.Group();
    scene.add(beaconGroup);
    const beaconGeometry = new THREE.SphereGeometry(0.18, 10, 8);
    for (let i = 0; i < 34; i++) {
      const f = frameAt(i / 34);
      const color = i % 3 === 0 ? 0xffb862 : (i % 2 ? 0xb576ff : 0x45ffff);
      const beacon = new THREE.Mesh(beaconGeometry, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 }));
      beacon.position.copy(f.center).addScaledVector(f.right, i % 2 ? 1.48 : -1.48).addScaledVector(f.up, 0.68);
      beaconGroup.add(beacon);
      if (i % 7 === 0) {
        const light = new THREE.PointLight(color, 2.4, 10, 2);
        light.position.copy(beacon.position);
        scene.add(light);
      }
    }

    const portalGroup = new THREE.Group();
    scene.add(portalGroup);
    const portalMats = [
      new THREE.MeshBasicMaterial({ color: 0x43fbf0, transparent: true, opacity: 0.82, blending: THREE.AdditiveBlending }),
      new THREE.MeshBasicMaterial({ color: 0xb46cff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending }),
      new THREE.MeshBasicMaterial({ color: 0xffb35c, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending })
    ];
    for (let i = 0; i < 13; i++) {
      const f = frameAt((i / 13 + 0.055) % 1);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(4.35 + (i % 3) * 0.18, 0.085, 8, 56), portalMats[i % portalMats.length]);
      const portalBasis = new THREE.Matrix4().makeBasis(f.right, f.up, f.tangent.clone().negate());
      ring.quaternion.setFromRotationMatrix(portalBasis);
      ring.position.copy(f.center).addScaledVector(f.up, 0.2);
      portalGroup.add(ring);
      const inner = new THREE.Mesh(new THREE.TorusGeometry(3.72 + (i % 2) * 0.14, 0.035, 6, 48), portalMats[(i + 1) % portalMats.length]);
      inner.quaternion.copy(ring.quaternion);
      inner.position.copy(ring.position);
      portalGroup.add(inner);
    }

    const rockMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x111a2a, roughness: 0.97, metalness: 0.03 }),
      new THREE.MeshStandardMaterial({ color: 0x172038, emissive: 0x160e32, emissiveIntensity: 0.42, roughness: 0.88, metalness: 0.08 }),
      new THREE.MeshStandardMaterial({ color: 0x0d2530, emissive: 0x042f38, emissiveIntensity: 0.58, roughness: 0.9, metalness: 0.12 })
    ];
    const rockGeometry = new THREE.DodecahedronGeometry(1, 1);
    const rocks = new THREE.Group();
    scene.add(rocks);
    for (let i = 0; i < 112; i++) {
      const a = seed(i * 1.17) * Math.PI * 2;
      const radius = 57 + seed(i * 2.31) * 43;
      const x = Math.cos(a) * radius;
      const z = Math.sin(a) * radius;
      const h = 2.6 + seed(i * 4.9) * 11;
      const rock = new THREE.Mesh(rockGeometry, rockMaterials[i % rockMaterials.length]);
      rock.position.set(x, groundY(x, z) + h * 0.47, z);
      rock.scale.set(1.8 + seed(i * 5.1) * 3.5, h, 1.6 + seed(i * 7.3) * 3.3);
      rock.rotation.set(seed(i * 1.8) * 0.4, seed(i * 3.8) * Math.PI, seed(i * 8.1) * 0.4);
      rock.castShadow = true;
      rocks.add(rock);
      if (i % 9 === 0) {
        const shard = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.3 + seed(i) * 1.3, 0.09), supportAccent);
        shard.position.copy(rock.position).add(new THREE.Vector3(0, h * 0.38, 0));
        shard.rotation.y = a;
        rocks.add(shard);
      }
    }

    const city = new THREE.Group();
    scene.add(city);
    const towerMat = new THREE.MeshStandardMaterial({ color: 0x0b1524, emissive: 0x101b3d, emissiveIntensity: 0.5, metalness: 0.35, roughness: 0.7 });
    const windowMats = [
      new THREE.MeshBasicMaterial({ color: 0x4af4ef, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending }),
      new THREE.MeshBasicMaterial({ color: 0xffb45d, transparent: true, opacity: 0.62, blending: THREE.AdditiveBlending }),
      new THREE.MeshBasicMaterial({ color: 0xaa73ff, transparent: true, opacity: 0.66, blending: THREE.AdditiveBlending })
    ];
    for (let i = 0; i < 38; i++) {
      const a = (i / 38) * Math.PI * 2 + 0.11;
      const radius = 87 + seed(i * 8.8) * 20;
      const x = Math.cos(a) * radius;
      const z = Math.sin(a) * radius;
      const w = 2.2 + seed(i * 2.2) * 3.2;
      const d = 2.2 + seed(i * 3.4) * 3.4;
      const h = 7 + seed(i * 4.4) * 26;
      const tower = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), towerMat);
      tower.position.set(x, groundY(x, z) + h * 0.5, z);
      tower.rotation.y = a;
      tower.castShadow = true;
      city.add(tower);
      const windowCount = Math.floor(h / 3.1);
      for (let j = 0; j < windowCount; j++) {
        if ((i + j) % 4 === 0) continue;
        const window = new THREE.Mesh(new THREE.BoxGeometry(w * 0.34, 0.13, 0.045), windowMats[(i + j) % windowMats.length]);
        window.position.set(0, -h * 0.45 + j * 3.1, d * 0.51);
        tower.add(window);
      }
      if (i % 6 === 0) {
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, h * 0.42, 6), windowMats[i % 2]);
        mast.position.y = h * 0.7;
        tower.add(mast);
      }
    }

    const auroraGroup = new THREE.Group();
    scene.add(auroraGroup);
    const auroraColors = [0x43f6ef, 0x8b72ff, 0xff71cf];
    for (let i = 0; i < 4; i++) {
      const pts = [];
      for (let j = 0; j <= 80; j++) {
        const u = j / 80;
        const a = u * Math.PI * 1.08 + i * 0.24;
        pts.push(new THREE.Vector3(Math.cos(a) * (64 + i * 3), 42 + Math.sin(a * 2.0 + i) * 5 + i * 4, Math.sin(a) * (52 + i * 4) - 28));
      }
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: auroraColors[i % auroraColors.length], transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false }));
      auroraGroup.add(line);
    }

    const droneGroup = new THREE.Group();
    scene.add(droneGroup);
    const droneGeometry = new THREE.SphereGeometry(0.23, 10, 8);
    const droneMaterial = new THREE.MeshBasicMaterial({ color: 0xb674ff, blending: THREE.AdditiveBlending });
    for (let i = 0; i < 7; i++) {
      const drone = new THREE.Mesh(droneGeometry, droneMaterial);
      drone.userData = { phase: seed(i * 6.2) * Math.PI * 2, radius: 55 + seed(i * 9.3) * 18, height: 17 + seed(i * 11.2) * 20, speed: 0.12 + seed(i * 4.7) * 0.09 };
      droneGroup.add(drone);
    }

    const sparkPositions = [];
    for (let i = 0; i < 180; i++) {
      const f = frameAt(seed(i * 3.2));
      const p = f.center.clone().addScaledVector(f.right, (seed(i * 4.1) - 0.5) * 10).addScaledVector(f.up, seed(i * 8.2) * 8 + 0.4);
      sparkPositions.push(p.x, p.y, p.z);
    }
    const sparkGeometry = new THREE.BufferGeometry();
    sparkGeometry.setAttribute("position", new THREE.Float32BufferAttribute(sparkPositions, 3));
    const sparks = new THREE.Points(sparkGeometry, new THREE.PointsMaterial({ color: 0x61ffff, size: 0.24, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(sparks);

    const cockpit = new THREE.Group();
    camera.add(cockpit);
    const cockpitMaterial = new THREE.MeshStandardMaterial({ color: 0x050b14, metalness: 0.8, roughness: 0.25, transparent: true, opacity: 0.92 });
    const dash = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.16, 0.72), cockpitMaterial);
    dash.position.set(0, -1.18, -1.12);
    dash.rotation.x = -0.14;
    cockpit.add(dash);
    const dashGlow = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.025, 0.05), new THREE.MeshBasicMaterial({ color: 0x49f1f3, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending }));
    dashGlow.position.set(0, -1.07, -1.5);
    cockpit.add(dashGlow);
    scene.add(camera);

    const phases = [
      [0.00, 0.18, "ASCENT / MAG-RAIL LIFT"],
      [0.18, 0.38, "CREST / SKYLINE RUN"],
      [0.38, 0.59, "RAVINE / NIGHTFALL DROP"],
      [0.59, 0.82, "NEON CANYON / FULL SEND"],
      [0.82, 1.01, "RETURN / LOOP RESET"]
    ];
    let rideT = 0.008;
    let elapsed = 0;
    const clock = new THREE.Clock();
    const bankQuaternion = new THREE.Quaternion();
    const worldAxis = new THREE.Vector3(0, 0, 1);

    function updateRide(dt) {
      elapsed += dt;
      const acceleration = 0.5 + 0.5 * Math.sin(rideT * Math.PI * 2 * 2.0 - 0.8);
      const speed = 0.0165 + acceleration * 0.0105;
      rideT = (rideT + dt * speed) % 1;

      const f = frameAt(rideT);
      const ahead = frameAt(rideT + 0.012);
      const sway = Math.sin(elapsed * 7.4) * 0.045;
      const lift = Math.cos(elapsed * 5.2) * 0.035;
      const cameraPosition = f.center.clone().addScaledVector(f.up, 1.63).addScaledVector(f.right, sway).addScaledVector(f.up, lift);
      camera.position.copy(cameraPosition);
      camera.lookAt(ahead.center.clone().addScaledVector(ahead.up, 1.12));
      const bank = -0.115 * Math.sin(rideT * Math.PI * 4.0 + 0.4) - 0.045 * Math.sin(rideT * Math.PI * 8.0);
      bankQuaternion.setFromAxisAngle(worldAxis, bank);
      camera.quaternion.multiply(bankQuaternion);

      const speedKmh = Math.round(58 + acceleration * 63);
      speedReadout.textContent = String(speedKmh).padStart(3, "0");
      progressReadout.style.width = `${rideT * 100}%`;
      const currentPhase = phases.find(([start, end]) => rideT >= start && rideT < end) || phases[0];
      phaseReadout.textContent = currentPhase[2];
      const fovTarget = 72 + acceleration * 9;
      camera.fov += (fovTarget - camera.fov) * Math.min(1, dt * 4.5);
      camera.updateProjectionMatrix();

      stars.rotation.y += dt * 0.002;
      auroraGroup.rotation.y += dt * 0.004;
      horizonRing.rotation.z += dt * 0.012;
      portalGroup.rotation.y = Math.sin(elapsed * 0.22) * 0.002;
      sky.material.uniforms.uTime.value = elapsed;
      beaconGroup.children.forEach((beacon, i) => {
        const flicker = 0.68 + Math.sin(elapsed * (3.1 + (i % 3)) + i) * 0.22;
        beacon.material.opacity = flicker;
        beacon.scale.setScalar(0.86 + flicker * 0.22);
      });
      droneGroup.children.forEach((drone) => {
        const d = drone.userData;
        const a = elapsed * d.speed + d.phase;
        drone.position.set(Math.cos(a) * d.radius, d.height + Math.sin(a * 2.2) * 5, Math.sin(a) * d.radius - 17);
      });

      // Let a soft side-light follow the train, reinforcing speed and depth.
      cyanLight.position.copy(f.center).addScaledVector(f.right, -3.2).addScaledVector(f.up, 3.2);
      violetLight.position.copy(ahead.center).addScaledVector(ahead.right, 4).addScaledVector(ahead.up, 5);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.045);
      updateRide(dt);
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    animate();
  </script>
</body>
</html>
