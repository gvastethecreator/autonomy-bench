<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Myrmidon — Ant Colony</title>
  <style>
    :root {
      --ink: #e7dcc8;
      --muted: #a69681;
      --line: rgba(232, 211, 174, .18);
      --panel: rgba(20, 18, 15, .78);
      --amber: #f5b45b;
      --mint: #9bc9aa;
      --rust: #ce724a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #11100f; color: var(--ink); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .015em; }
    #app { position: relative; width: 100%; height: 100%; isolation: isolate; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    .grain { pointer-events:none; position:absolute; inset:0; z-index:2; opacity:.08; mix-blend-mode:screen; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E"); }
    .shade { pointer-events:none; position:absolute; inset:0; z-index:1; background: radial-gradient(ellipse at 50% 46%, transparent 0%, rgba(8,8,7,.04) 49%, rgba(5,5,5,.55) 100%); }
    .topbar { position:absolute; z-index:5; left: clamp(18px, 4vw, 64px); right: clamp(18px, 4vw, 64px); top: clamp(18px, 3.8vh, 40px); display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
    .brand { display:flex; gap:14px; align-items:flex-start; text-shadow:0 2px 12px #080706; }
    .sigil { width:30px; height:30px; border:1px solid rgba(247,190,100,.75); border-radius:50%; position:relative; margin-top:4px; box-shadow:0 0 18px rgba(235,151,60,.22); }
    .sigil:before, .sigil:after { content:""; position:absolute; left:8px; right:8px; height:1px; background:var(--amber); transform-origin:center; }
    .sigil:before { top:10px; transform:rotate(35deg); box-shadow:0 7px 0 rgba(245,180,91,.8); }
    .sigil:after { top:17px; transform:rotate(-35deg); }
    .eyebrow { margin:0 0 3px; text-transform:uppercase; color:var(--amber); font-size:10px; font-weight:700; letter-spacing:.28em; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; letter-spacing:.12em; font-size:clamp(20px, 2vw, 30px); line-height:1; margin:0; }
    .chapter { text-align:right; color:rgba(231,220,200,.66); font-size:10px; line-height:1.7; text-transform:uppercase; letter-spacing:.18em; }
    .chapter strong { color:var(--ink); font-size:12px; font-weight:500; }
    .hud { position:absolute; z-index:4; left:clamp(18px,4vw,64px); bottom:clamp(18px,3.7vh,42px); width:min(360px, calc(100vw - 36px)); pointer-events:none; }
    .hud-card { border:1px solid var(--line); background:linear-gradient(125deg, rgba(22,20,17,.84), rgba(18,18,16,.55)); backdrop-filter: blur(16px); padding:15px 17px 14px; box-shadow:0 16px 38px rgba(0,0,0,.2); }
    .hud-head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:11px; margin-bottom:11px; border-bottom:1px solid rgba(231,220,200,.12); }
    .hud-title { font-size:11px; text-transform:uppercase; letter-spacing:.23em; color:rgba(231,220,200,.75); }
    .live { display:flex; align-items:center; gap:6px; color:var(--mint); font-size:9px; text-transform:uppercase; letter-spacing:.15em; }
    .live:before { content:""; width:5px; height:5px; border-radius:50%; background:var(--mint); box-shadow:0 0 9px var(--mint); animation:pulse 1.8s infinite; }
    @keyframes pulse { 50% { opacity:.3; transform:scale(.7); } }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .stat label { display:block; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.14em; margin-bottom:4px; }
    .stat strong { display:block; font-size:22px; font-weight:400; color:#f0dfbf; font-variant-numeric:tabular-nums; }
    .stat small { display:block; font-size:9px; color:rgba(231,220,200,.45); margin-top:1px; }
    .meters { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .meter-label { display:flex; justify-content:space-between; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.11em; margin-bottom:5px; }
    .meter-label span:last-child { color:rgba(231,220,200,.82); font-variant-numeric:tabular-nums; }
    .meter-track { height:3px; border-radius:3px; background:rgba(255,255,255,.11); overflow:hidden; }
    .meter-fill { height:100%; width:50%; transition:width .4s ease; background:linear-gradient(90deg, #bb7045, #e7b565); box-shadow:0 0 10px rgba(235,160,82,.35); }
    .meter-fill.cool { background:linear-gradient(90deg,#648f87,#a6cba8); box-shadow:0 0 10px rgba(149,205,178,.3); }
    .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:13px; color:rgba(231,220,200,.54); font-size:9px; text-transform:uppercase; letter-spacing:.1em; }
    .legend i { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:0; }
    .legend i.amber { background:#efaa57; box-shadow:0 0 7px #efaa57; }
    .legend i.mint { background:#9bc9aa; box-shadow:0 0 7px #9bc9aa; }
    .legend i.rust { background:#d16c48; box-shadow:0 0 7px #d16c48; }
    .control-dock { position:absolute; z-index:5; right:clamp(18px,4vw,64px); bottom:clamp(18px,3.7vh,42px); display:flex; align-items:center; gap:8px; pointer-events:auto; }
    button { appearance:none; border:1px solid rgba(231,220,200,.19); background:rgba(20,18,16,.72); color:rgba(231,220,200,.76); border-radius:2px; padding:8px 11px; font:inherit; font-size:10px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; transition:all .2s ease; backdrop-filter:blur(12px); }
    button:hover { border-color:rgba(245,180,91,.65); color:#ffe5bd; background:rgba(55,40,27,.78); }
    button.active { border-color:rgba(245,180,91,.8); color:#ffca7a; box-shadow:0 0 14px rgba(245,180,91,.13); }
    .help { position:absolute; z-index:4; right:clamp(18px,4vw,64px); top:50%; transform:translateY(-50%); writing-mode:vertical-rl; color:rgba(231,220,200,.36); text-transform:uppercase; font-size:9px; letter-spacing:.25em; pointer-events:none; }
    .hint { position:absolute; z-index:4; left:50%; transform:translateX(-50%); top:clamp(18px,3.8vh,40px); color:rgba(231,220,200,.42); font-size:10px; letter-spacing:.13em; text-transform:uppercase; pointer-events:none; white-space:nowrap; }
    .toast { position:absolute; z-index:8; left:50%; top:18%; transform:translate(-50%,-12px); padding:10px 15px; border:1px solid rgba(245,180,91,.35); background:rgba(22,18,13,.82); color:#f2d29b; font-size:10px; letter-spacing:.16em; text-transform:uppercase; opacity:0; transition:all .35s ease; pointer-events:none; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:700px) {
      .chapter, .help, .hint { display:none; }
      .topbar { top:16px; }
      .hud { bottom:72px; width:calc(100vw - 36px); }
      .control-dock { bottom:18px; left:18px; right:18px; justify-content:flex-end; }
      .hud-card { padding:12px 14px; }
      .stat strong { font-size:19px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="world" aria-label="Animated ant colony simulation"></canvas>
    <div class="shade"></div><div class="grain"></div>
    <header class="topbar">
      <div class="brand"><div class="sigil" aria-hidden="true"></div><div><p class="eyebrow">Field study / 07</p><h1>MYRMIDON</h1></div></div>
      <div class="chapter">A living architecture<br><strong>Colony C — dusk cycle</strong></div>
    </header>
    <div class="hint">click the soil to leave a scent marker</div>
    <div class="help">observe · guide · sustain</div>
    <section class="hud" aria-live="polite">
      <div class="hud-card">
        <div class="hud-head"><div class="hud-title">Colony telemetry</div><div class="live" id="liveState">foraging</div></div>
        <div class="stats">
          <div class="stat"><label>population</label><strong id="population">63</strong><small id="popDelta">+2 this cycle</small></div>
          <div class="stat"><label>stores</label><strong id="stores">72%</strong><small>seed + nectar</small></div>
          <div class="stat"><label>cycle</label><strong id="cycle">04:18</strong><small id="cycleTag">dusk / 03</small></div>
        </div>
        <div class="meters">
          <div><div class="meter-label"><span>provisions</span><span id="foodValue">72%</span></div><div class="meter-track"><div class="meter-fill" id="foodMeter"></div></div></div>
          <div><div class="meter-label"><span>brood</span><span id="broodValue">48%</span></div><div class="meter-track"><div class="meter-fill cool" id="broodMeter"></div></div></div>
        </div>
        <div class="legend"><span><i class="amber"></i>workers</span><span><i class="mint"></i>nurses</span><span><i class="rust"></i>guards</span></div>
      </div>
    </section>
    <div class="control-dock"><button id="pauseBtn" type="button">pause <span>space</span></button><button id="speedBtn" type="button">speed ×1</button><button id="resetBtn" type="button">reset</button></div>
    <div id="toast" class="toast">scent trail placed</div>
  </main>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const TAU = Math.PI * 2;
    let W = 0, H = 0, ground = 0, scale = 1;
    let paused = false, speed = 1, time = 0, last = performance.now(), accumulator = 0;
    let ants = [], particles = [], motes = [], markers = [], foodPiles = [];
    let food = 72, brood = 48, population = 63, cycleSeconds = 258;
    const nest = { x: .49, y: .72 };
    const colors = { worker:'#eaa252', nurse:'#a8d1ad', guard:'#cf704d', queen:'#f4c56e' };
    const el = id => document.getElementById(id);
    const rand = (a=0,b=1) => a + Math.random()*(b-a);
    const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
    const lerp = (a,b,t) => a+(b-a)*t;
    const smooth = t => t*t*(3-2*t);
    function resize() {
      W = window.innerWidth; H = window.innerHeight; scale = Math.min(W,H)/900;
      ground = H * (W < 620 ? .34 : .385);
      canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
      canvas.style.width = W+'px'; canvas.style.height = H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      seedMotes();
    }
    function seedMotes() { motes = Array.from({length: Math.floor(clamp(W*H/14500,34,100))}, () => ({ x:rand(0,W), y:rand(0,ground), r:rand(.35,1.6), a:rand(.1,.42), p:rand(0,TAU), z:rand(.5,1.6) })); }
    window.addEventListener('resize', resize, {passive:true});

    // Chambers are described in normalized coordinates so the cutaway breathes at every aspect ratio.
    const chamberData = [
      {x:.49,y:.57,rx:.12,ry:.052,name:'threshold'},
      {x:.37,y:.65,rx:.105,ry:.064,name:'pantry'},
      {x:.58,y:.66,rx:.115,ry:.068,name:'nursery'},
      {x:.47,y:.78,rx:.15,ry:.082,name:'commons'},
      {x:.69,y:.79,rx:.1,ry:.059,name:'guard post'},
      {x:.34,y:.84,rx:.09,ry:.05,name:'seed vault'}
    ];
    const tunnels = [
      [[.49,.57],[.49,.63],[.39,.65]], [[.49,.57],[.54,.62],[.58,.66]],
      [[.39,.65],[.43,.74],[.47,.78]], [[.58,.66],[.53,.74],[.47,.78]],
      [[.47,.78],[.37,.82],[.34,.84]], [[.47,.78],[.58,.79],[.69,.79]],
      [[.58,.66],[.64,.72],[.69,.79]], [[.49,.63],[.47,.78]]
    ];
    const pathPoints = [
      {x:.49,y:.57},{x:.49,y:.63},{x:.39,y:.65},{x:.37,y:.73},{x:.47,y:.78},{x:.58,y:.79},{x:.69,y:.79},
      {x:.58,y:.66},{x:.54,y:.62},{x:.34,y:.84},{x:.74,y:.42},{x:.83,y:.28},{x:.21,y:.3},{x:.11,y:.2}
    ];
    const pxy = p => ({x:p.x*W, y:p.y*H});
    function makeAnt(i) {
      const role = i < 41 ? 'worker' : i < 54 ? 'nurse' : 'guard';
      const start = role === 'nurse' ? 2 + Math.floor(rand(0,3)) : role === 'guard' ? 5 : Math.floor(rand(0,8));
      const a = { role, x:0,y:0, tx:0,ty:0, vx:0,vy:0, phase:rand(0,TAU), speed:rand(.14,.23), state:'inside', node:start, next:start, progress:rand(0,1), carry:false, wait:rand(0,5), id:i, wobble:rand(.6,1.5) };
      if (role === 'worker' && i % 4 === 0) { a.state='outbound'; a.node=0; a.next=11; a.progress=0; }
      if (role === 'worker' && i % 4 === 1) { a.state='outbound'; a.node=0; a.next=12; a.progress=0; }
      if (role === 'guard') { a.state='guarding'; a.node=5 + i%2; a.next=a.node; a.wait=rand(0,3); }
      a.x = pathPoints[a.node].x; a.y = pathPoints[a.node].y; return a;
    }
    function reset() {
      time=0; cycleSeconds=258; food=72; brood=48; population=63; paused=false; speed=1; markers=[]; particles=[];
      foodPiles=[{x:.82,y:.26,r:.025,amount:1,glow:0},{x:.18,y:.31,r:.018,amount:.72,glow:2}];
      ants=Array.from({length:population},(_,i)=>makeAnt(i));
      for(let i=0;i<34;i++) particles.push({x:rand(.29,.7)*W,y:rand(.56,.9)*H,vx:rand(-.5,.5),vy:rand(-.4,.4),life:rand(0,4),max:rand(3,7),kind:'dust',r:rand(.4,1.2)});
      updateUI();
      toast('colony cycle restored');
    }
    function addMarker(clientX,clientY) {
      const x=clientX/W,y=clientY/H;
      if (y < ground/H) {
        foodPiles.push({x,y,r:rand(.012,.022),amount:1,glow:0});
        markers.push({x:clientX,y:clientY,life:0,max:3.4});
        ants.filter(a=>a.role==='worker').slice(0,3).forEach(a=>{a.state='outbound';a.node=0;a.next=(x>.5?11:12);a.progress=0;});
        toast('fresh provisions marked');
      } else {
        markers.push({x:clientX,y:clientY,life:0,max:3.4});
        const target = pathPoints.reduce((best,p,idx)=>{const d=Math.hypot(p.x*W-clientX,p.y*H-clientY);return d<best.d?{d,idx}:best},{d:Infinity,idx:0}).idx;
        ants.filter(a=>a.role==='worker').slice(0,4).forEach(a=>{a.state='inside';a.node=0;a.next=target;a.progress=0;});
        toast('scent trail placed');
      }
    }
    let toastTimer;
    function toast(msg) { const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1500); }
    function updateUI() {
      el('population').textContent=population; el('stores').textContent=Math.round(food)+'%'; el('foodValue').textContent=Math.round(food)+'%'; el('foodMeter').style.width=clamp(food,3,100)+'%';
      el('broodValue').textContent=Math.round(brood)+'%'; el('broodMeter').style.width=clamp(brood,3,100)+'%';
      const mins=Math.floor(cycleSeconds/60).toString().padStart(2,'0'), secs=Math.floor(cycleSeconds%60).toString().padStart(2,'0'); el('cycle').textContent=mins+':'+secs;
      el('liveState').textContent=paused?'resting':(food<28?'rationing':(brood>72?'brooding':'foraging')); el('pauseBtn').innerHTML=(paused?'resume':'pause')+' <span>space</span>'; el('pauseBtn').classList.toggle('active',paused); el('speedBtn').textContent='speed ×'+speed;
    }
    function update(dt) {
      const step=dt*speed; time+=step; cycleSeconds += step*.12; food=clamp(food + (Math.sin(time*.07)*.005 - .003*step), 12, 96); brood=clamp(brood + Math.sin(time*.035+.8)*.012, 20, 86);
      if (food<23 && Math.random()<.006) { foodPiles.push({x:rand(.1,.9),y:rand(.19,.32),r:rand(.01,.02),amount:.8,glow:1}); }
      for (const a of ants) updateAnt(a,step);
      for (const p of particles) { p.life+=step; p.x+=p.vx*step*10; p.y+=p.vy*step*10; if(p.life>p.max){p.life=0;p.x=rand(.28,.7)*W;p.y=rand(.56,.9)*H;} }
      markers.forEach(m=>m.life+=step); markers=markers.filter(m=>m.life<m.max);
      motes.forEach(m=>m.p+=step*m.z*.24);
      if (Math.random()<.32*speed) particles.push({x:rand(.28,.72)*W,y:rand(ground,H*.94),vx:rand(-.12,.12),vy:rand(-.06,.06),life:0,max:rand(2,4),kind:'dust',r:rand(.3,.9)});
      updateUI();
    }
    function updateAnt(a,dt) {
      a.phase+=dt*(1.7+a.wobble); if(a.wait>0){a.wait-=dt;return;}
      let target;
      if (a.state==='outbound') {
        target = pxy(pathPoints[a.next]);
        if (a.next===11 || a.next===12) { const pile=foodPiles[a.next===11?0:1]||foodPiles[0]; target={x:pile.x*W,y:pile.y*H}; }
      } else if (a.state==='returning') target=pxy(pathPoints[0]);
      else if (a.state==='guarding') {
        const p=pxy(pathPoints[a.node]); a.x=lerp(a.x,p.x,.04); a.y=lerp(a.y,p.y,.04); if(Math.random()<.004){a.node=a.node===5?6:5;} return;
      } else { target=pxy(pathPoints[a.next]); }
      const dx=target.x-a.x, dy=target.y-a.y, d=Math.hypot(dx,dy)||1, velocity=(a.role==='nurse'?.72:1)*a.speed*W*dt;
      a.x += dx/d*velocity; a.y += dy/d*velocity;
      a.vx=dx/d; a.vy=dy/d;
      if(d<4+W*.0025) {
        if (a.state==='outbound') { a.carry=true; a.state='returning'; a.next=0; food=clamp(food+rand(.04,.16),0,100); }
        else if (a.state==='returning') { a.carry=false; a.state='inside'; a.node=0; a.next = a.role==='nurse' ? (2+Math.floor(rand(0,3))) : Math.floor(rand(1,8)); a.wait=rand(.1,1.1); }
        else { a.node=a.next; const options=a.role==='nurse'?[2,3,4]:[1,2,3,4,5,6,7]; a.next=options[Math.floor(rand(0,options.length))]; }
      }
    }

    function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
    function drawBackground() {
      const sky=ctx.createLinearGradient(0,0,0,ground); sky.addColorStop(0,'#202526');sky.addColorStop(.46,'#2b3632');sky.addColorStop(1,'#8f7658');ctx.fillStyle=sky;ctx.fillRect(0,0,W,ground);
      const haze=ctx.createRadialGradient(W*.54,ground*.75,10,W*.54,ground*.75,W*.65);haze.addColorStop(0,'rgba(239,188,114,.18)');haze.addColorStop(1,'rgba(239,188,114,0)');ctx.fillStyle=haze;ctx.fillRect(0,0,W,ground);
      const soil=ctx.createLinearGradient(0,ground,0,H); soil.addColorStop(0,'#6d523b');soil.addColorStop(.15,'#4e392b');soil.addColorStop(.56,'#2d2420');soil.addColorStop(1,'#121313');ctx.fillStyle=soil;ctx.fillRect(0,ground,W,H-ground);
      ctx.fillStyle='rgba(21,17,14,.45)'; ctx.fillRect(0,ground,W,3);
      // distant horizon silhouette
      ctx.fillStyle='rgba(17,27,26,.62)';ctx.beginPath();ctx.moveTo(0,ground); for(let x=0;x<=W;x+=22){const y=ground-rand(5,24)-Math.sin(x*.018)*7;ctx.lineTo(x,y);}ctx.lineTo(W,ground);ctx.closePath();ctx.fill();
      // soft strata
      ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#c59766';ctx.lineWidth=1;
      for(let j=0;j<8;j++){ctx.beginPath();const yy=ground+H*(.08+j*.1);ctx.moveTo(-10,yy);for(let x=0;x<W+20;x+=34){ctx.quadraticCurveTo(x+15,yy+rand(-4,4),x+34,yy+rand(-3,3));}ctx.stroke();}ctx.restore();
      // rocks / pebbles
      for(let i=0;i<45;i++){const x=(i*83.37%W),y=ground+((i*117.19)%Math.max(1,H-ground));const s=1.3+(i%4);ctx.fillStyle=i%3?'rgba(12,13,13,.18)':'rgba(183,134,91,.12)';ctx.beginPath();ctx.ellipse(x,y,s*1.9,s,rand(0,TAU),0,TAU);ctx.fill();}
    }
    function drawVegetation() {
      ctx.save();
      // stems
      ctx.strokeStyle='rgba(117,151,117,.42)';ctx.lineWidth=1.3;
      for(let i=0;i<18;i++){const x=(i*139.7%W),h=rand(18,68), lean=rand(-18,18);ctx.beginPath();ctx.moveTo(x,ground+2);ctx.quadraticCurveTo(x+lean*.3,ground-h*.55,x+lean,ground-h);ctx.stroke();
        ctx.fillStyle='rgba(139,173,126,.4)';ctx.beginPath();ctx.ellipse(x+lean,ground-h,rand(3,8),rand(1.2,3),rand(-.8,.8),0,TAU);ctx.fill();
      }
      // little stones at the surface
      for(let i=0;i<14;i++){const x=rand(0,W), y=ground+rand(-2,6), s=rand(1,4);ctx.fillStyle='rgba(26,26,23,.55)';ctx.beginPath();ctx.ellipse(x,y,s*1.6,s,rand(0,TAU),0,TAU);ctx.fill();}
      ctx.restore();
    }
    function drawTunnels() {
      ctx.save();
      ctx.lineCap='round';ctx.lineJoin='round';
      tunnels.forEach((t,idx)=>{
        ctx.beginPath(); t.forEach((p,i)=>{const q=pxy({x:p[0],y:p[1]});if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);});
        ctx.strokeStyle='rgba(7,7,6,.82)';ctx.lineWidth=Math.max(17,W*.019);ctx.stroke();
        ctx.strokeStyle='rgba(134,92,59,.36)';ctx.lineWidth=Math.max(11,W*.012);ctx.stroke();
        ctx.strokeStyle='rgba(229,161,91,.08)';ctx.lineWidth=2;ctx.stroke();
      });
      chamberData.forEach((c,i)=>{
        const x=c.x*W,y=c.y*H,rx=c.rx*W,ry=c.ry*H;
        const glow=ctx.createRadialGradient(x,y,rx*.12,x,y,rx*1.2);glow.addColorStop(0,i===2?'rgba(130,180,145,.11)':'rgba(220,145,69,.09)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(x,y,rx*1.28,ry*1.45,0,0,TAU);ctx.fill();
        ctx.fillStyle='rgba(20,16,14,.92)';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();
        ctx.strokeStyle='rgba(184,125,73,.43)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.stroke();
        ctx.strokeStyle='rgba(237,176,98,.08)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,rx*.9,ry*.82,0,0,TAU);ctx.stroke();
        if(i!==0){ctx.fillStyle='rgba(235,180,102,.42)';ctx.font=`${Math.max(8, W*.007)}px Inter, sans-serif`;ctx.letterSpacing='0.13em';ctx.fillText(c.name.toUpperCase(),x-rx*.66,y+ry*1.65);}
      });
      // chamber details: seed grains and brood ovals
      for(let i=0;i<16;i++){const x=(.34+((i*29)%70)/100)*W,y=(.825+((i*17)%44)/1000)*H;ctx.fillStyle='rgba(210,148,76,.44)';ctx.beginPath();ctx.ellipse(x,y,1.3,2.7,((i%3)-1)*.35,0,TAU);ctx.fill();}
      for(let i=0;i<13;i++){const x=(.525+((i*23)%43)/1000)*W,y=(.64+((i*19)%35)/1000)*H;ctx.fillStyle='rgba(157,207,169,.54)';ctx.beginPath();ctx.ellipse(x,y,2.2,3.5,((i%2)-.5),0,TAU);ctx.fill();}
      // queen chamber pool
      const qx=.47*W,qy=.785*H;ctx.fillStyle='rgba(235,165,76,.2)';ctx.beginPath();ctx.ellipse(qx,qy,20*scale,11*scale,0,0,TAU);ctx.fill();
      ctx.restore();
    }
    function drawPheromones() {
      ctx.save();ctx.lineCap='round';
      const pulse=(Math.sin(time*1.6)+1)/2;
      [[.49,.57,.83,.28],[.49,.57,.18,.31]].forEach((line,i)=>{const g=ctx.createLinearGradient(line[0]*W,line[1]*H,line[2]*W,line[3]*H);g.addColorStop(0,i?'rgba(147,193,139,.04)':'rgba(245,177,81,.09)');g.addColorStop(.6,i?'rgba(147,193,139,.22)':'rgba(245,177,81,.28)');g.addColorStop(1,'rgba(245,177,81,.02)');ctx.strokeStyle=g;ctx.lineWidth=1.2+ pulse*.9;ctx.setLineDash([2,7]);ctx.beginPath();ctx.moveTo(line[0]*W,line[1]*H);ctx.quadraticCurveTo(.58*W,.47*H,line[2]*W,line[3]*H);ctx.stroke();});
      ctx.setLineDash([]);markers.forEach(m=>{const p=1-m.life/m.max;ctx.strokeStyle=`rgba(242,181,91,${p*.7})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(m.x,m.y,10+m.life*12,0,TAU);ctx.stroke();ctx.fillStyle=`rgba(242,181,91,${p*.1})`;ctx.beginPath();ctx.arc(m.x,m.y,13+m.life*8,0,TAU);ctx.fill();});ctx.restore();
    }
    function drawFood() {
      foodPiles.forEach((pile,index)=>{
        const x=pile.x*W,y=pile.y*H,r=Math.max(7,pile.r*W);const aura=ctx.createRadialGradient(x,y,1,x,y,r*3.4);aura.addColorStop(0,'rgba(245,183,83,.3)');aura.addColorStop(1,'rgba(245,183,83,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(x,y,r*3.4,0,TAU);ctx.fill();
        ctx.fillStyle='rgba(225,163,78,.86)';for(let j=0;j<10;j++){const a=j*2.39+index,rr=r*rand(.1,1);ctx.beginPath();ctx.ellipse(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.64,rand(1.1,2.7),rand(.7,1.6),a,0,TAU);ctx.fill();}
        ctx.fillStyle='rgba(252,208,121,.6)';ctx.beginPath();ctx.arc(x-r*.25,y-r*.35,1.4,0,TAU);ctx.fill();
      });
    }
    function drawMotes() { ctx.save();motes.forEach(m=>{const a=m.a*(.7+.3*Math.sin(m.p));ctx.fillStyle=`rgba(232,193,129,${a})`;ctx.beginPath();ctx.arc(m.x+Math.sin(m.p)*4,m.y+Math.cos(m.p*.7)*2,m.r,0,TAU);ctx.fill();});ctx.restore(); }
    function drawParticles() { ctx.save();particles.forEach(p=>{const a=Math.sin(Math.min(1,p.life/p.max)*Math.PI)*.3;ctx.fillStyle=`rgba(213,161,107,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();});ctx.restore(); }
    function drawAnt(a) {
      const s=clamp(scale, .55, 1.15), wiggle=Math.sin(a.phase)*.8*s, angle=Math.atan2(a.vy||0,a.vx||1);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(angle);
      const c=colors[a.role];ctx.globalAlpha=.16;ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(-1,1,8*s,4*s,0,0,TAU);ctx.fill();
      ctx.globalAlpha=1;ctx.strokeStyle=c;ctx.lineWidth=Math.max(.7,1*s);ctx.lineCap='round';
      const leg=2.8*s;[-1,0,1].forEach((n)=>{ctx.beginPath();ctx.moveTo(-n*1.7*s,-1*s);ctx.lineTo(n*2.4*s,-leg);ctx.moveTo(-n*1.7*s,1*s);ctx.lineTo(n*2.4*s,leg);ctx.stroke();});
      ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(-2.4*s,0,3.1*s,2.2*s,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(1.6*s,0,2.5*s,2*s,0,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(4.2*s,0,1.65*s,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(255,226,162,.74)';ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(5*s,-.7*s);ctx.lineTo(8*s,-2.3*s);ctx.moveTo(5*s,.7*s);ctx.lineTo(8*s,2.3*s);ctx.stroke();
      if(a.carry){ctx.fillStyle='#e9bf78';ctx.beginPath();ctx.arc(-5.6*s,-2.8*s,2*s,0,TAU);ctx.fill();}
      ctx.restore();
    }
    function drawQueen() { const x=.47*W,y=.785*H,s=clamp(scale,.65,1.1);ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*.45)*.06);ctx.fillStyle='rgba(250,189,89,.14)';ctx.beginPath();ctx.ellipse(0,0,26*s,16*s,0,0,TAU);ctx.fill();ctx.fillStyle=colors.queen;ctx.beginPath();ctx.ellipse(-5*s,0,10*s,7*s,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(7*s,0,9*s,6*s,0,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(16*s,0,4.2*s,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,224,156,.8)';ctx.lineWidth=1;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-4*s,-5*s);ctx.lineTo(-10*s,(i-1.5)*4*s);ctx.moveTo(-4*s,5*s);ctx.lineTo(-10*s,(i-1.5)*4*s);ctx.stroke();}ctx.restore(); }
    function draw() {
      ctx.clearRect(0,0,W,H);drawBackground();drawVegetation();drawMotes();drawPheromones();drawFood();drawTunnels();drawParticles();
      ants.forEach(drawAnt);drawQueen();
      // surface caption and underground depth rule
      ctx.save();ctx.fillStyle='rgba(240,215,176,.46)';ctx.font=`500 ${Math.max(9,W*.0075)}px Inter, sans-serif`;ctx.letterSpacing='.2em';ctx.fillText('SURFACE / FORAGE ZONE',24,ground-17);ctx.strokeStyle='rgba(232,211,174,.26)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(24,ground-9);ctx.lineTo(164,ground-9);ctx.stroke();ctx.fillStyle='rgba(240,215,176,.3)';ctx.font=`${Math.max(8,W*.006)}px Inter, sans-serif`;ctx.fillText('CUTAWAY — 1.8 M BELOW',W-167,ground+25);ctx.restore();
    }
    function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){accumulator+=dt;while(accumulator>1/30){update(1/30);accumulator-=1/30;}}draw();requestAnimationFrame(frame);}
    canvas.addEventListener('pointerdown',e=>{addMarker(e.clientX,e.clientY);});
    el('pauseBtn').addEventListener('click',()=>{paused=!paused;updateUI();toast(paused?'colony at rest':'foraging resumed');});
    el('speedBtn').addEventListener('click',()=>{speed=speed===1?2:speed===2?.5:1;updateUI();toast('tempo ×'+speed);});
    el('resetBtn').addEventListener('click',reset);
    window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();paused=!paused;updateUI();toast(paused?'colony at rest':'foraging resumed');}if(e.key.toLowerCase()==='r')reset();});
    resize();reset();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
