<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
  :root {
    --bg: #0f1115;
    --face: #171a21;
    --face-edge: #232833;
    --tick: #8b93a3;
    --tick-major: #e6e9ef;
    --hand: #e6e9ef;
    --second: #ff5c5c;
    --text: #c7ccd6;
    --text-dim: #6b7280;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(1200px 800px at 50% 35%, #1a1e26 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .clock-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .clock-shell {
    width: min(80vmin, 420px);
    height: min(80vmin, 420px);
    border-radius: 50%;
    background: conic-gradient(from 180deg, #262b35, #14171d, #262b35, #14171d, #262b35);
    padding: 10px;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.55),
      0 4px 12px rgba(0, 0, 0, 0.4),
      inset 0 1px 1px rgba(255, 255, 255, 0.06);
  }

  .clock-face {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 32%, #1d212b 0%, var(--face) 70%);
    border: 1px solid var(--face-edge);
    position: relative;
    box-shadow: inset 0 6px 24px rgba(0, 0, 0, 0.45);
  }

  svg.dial {
    width: 100%;
    height: 100%;
    display: block;
  }

  .brand {
    position: absolute;
    top: 26%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(10px, 2.4vmin, 14px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    user-select: none;
  }

  .digital-date {
    position: absolute;
    bottom: 24%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(9px, 2vmin, 12px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    user-select: none;
  }

  .digital-time {
    font-variant-numeric: tabular-nums;
    font-size: clamp(28px, 6vmin, 44px);
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--text);
    text-align: center;
  }

  .digital-time .sec {
    color: var(--second);
    font-size: 0.6em;
  }

  .digital-time .ampm {
    font-size: 0.45em;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-left: 0.6em;
    vertical-align: 0.25em;
  }
</style>
</head>
<body>
  <main class="clock-app" aria-label="Clock">
    <div class="clock-shell">
      <div class="clock-face">
        <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
          <g id="ticks"></g>
          <g id="numerals" fill="#e6e9ef"
             font-family="Georgia, 'Times New Roman', serif"
             font-size="11" text-anchor="middle" dominant-baseline="central"></g>

          <!-- hands -->
          <g id="hour-hand">
            <line x1="100" y1="100" x2="100" y2="58"
                  stroke="#e6e9ef" stroke-width="5" stroke-linecap="round" />
          </g>
          <g id="minute-hand">
            <line x1="100" y1="100" x2="100" y2="34"
                  stroke="#e6e9ef" stroke-width="3.2" stroke-linecap="round" />
          </g>
          <g id="second-hand">
            <line x1="100" y1="112" x2="100" y2="26"
                  stroke="#ff5c5c" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="100" cy="100" r="3.4" fill="#ff5c5c" />
          </g>
          <circle cx="100" cy="100" r="1.4" fill="#0f1115" />
        </svg>
        <div class="brand">Chronos</div>
        <div class="digital-date" id="date"></div>
      </div>
    </div>

    <div class="digital-time">
      <span id="time-hm">--:--</span><span class="sec" id="time-s">:--</span><span class="ampm" id="time-ampm"></span>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var ticksGroup = document.getElementById("ticks");
  var numeralsGroup = document.getElementById("numerals");
  var hourHand = document.getElementById("hour-hand");
  var minuteHand = document.getElementById("minute-hand");
  var secondHand = document.getElementById("second-hand");
  var timeHM = document.getElementById("time-hm");
  var timeS = document.getElementById("time-s");
  var timeAmPm = document.getElementById("time-ampm");
  var dateEl = document.getElementById("date");

  // --- build tick marks ---
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0;
    var angle = (i * 6 - 90) * Math.PI / 180;
    var rOuter = 88;
    var rInner = major ? 79 : 84;
    var line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", (100 + Math.cos(angle) * rInner).toFixed(2));
    line.setAttribute("y1", (100 + Math.sin(angle) * rInner).toFixed(2));
    line.setAttribute("x2", (100 + Math.cos(angle) * rOuter).toFixed(2));
    line.setAttribute("y2", (100 + Math.sin(angle) * rOuter).toFixed(2));
    line.setAttribute("stroke", major ? "#e6e9ef" : "#8b93a3");
    line.setAttribute("stroke-width", major ? 2 : 0.8);
    if (major) line.setAttribute("stroke-linecap", "round");
    ticksGroup.appendChild(line);
  }

  // --- build numerals ---
  var roman = ["XII", "I", "II", "III", "IIII", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
  for (var n = 0; n < 12; n++) {
    var a = (n * 30 - 90) * Math.PI / 180;
    var text = document.createElementNS(SVG_NS, "text");
    text.setAttribute("x", (100 + Math.cos(a) * 66).toFixed(2));
    text.setAttribute("y", (100 + Math.sin(a) * 66).toFixed(2));
    text.setAttribute("fill", n % 3 === 0 ? "#e6e9ef" : "#8b93a3");
    text.setAttribute("font-size", n % 3 === 0 ? "10" : "8");
    text.textContent = roman[n];
    numeralsGroup.appendChild(text);
  }

  // --- rendering ---
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  var lastDateStr = "";

  function render() {
    var now = new Date();
    var ms = now.getMilliseconds();
    var s = now.getSeconds() + ms / 1000;
    var m = now.getMinutes() + s / 60;
    var h = (now.getHours() % 12) + m / 60;

    hourHand.setAttribute("transform", "rotate(" + (h * 30).toFixed(3) + " 100 100)");
    minuteHand.setAttribute("transform", "rotate(" + (m * 6).toFixed(3) + " 100 100)");
    secondHand.setAttribute("transform", "rotate(" + (s * 6).toFixed(3) + " 100 100)");

    var hours24 = now.getHours();
    var ampm = hours24 < 12 ? "AM" : "PM";
    var hours12 = hours24 % 12;
    if (hours12 === 0) hours12 = 12;

    timeHM.textContent = hours12 + ":" + pad(now.getMinutes());
    timeS.textContent = ":" + pad(now.getSeconds());
    timeAmPm.textContent = ampm;

    var dateStr = now.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
    if (dateStr !== lastDateStr) {
      dateEl.textContent = dateStr;
      lastDateStr = dateStr;
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
