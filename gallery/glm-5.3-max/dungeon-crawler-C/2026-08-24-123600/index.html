<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<title>EMBERDEEP — a procedural descent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0d14'/><path d='M8 2c2 3 4 4 4 7a4 4 0 1 1-8 0c0-3 2-4 4-7z' fill='%23f0b34c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#f0b34c; --amber2:#ffd98a; --gold:#ffd66e;
    --text:#e8dcc0; --dim:#9aa3b8;
    --red:#d8494f; --teal:#58c0d8;
    --panel:rgba(12,14,23,.78);
    --line:rgba(240,179,76,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:#05060a; color:var(--text);
    font-family:"Alegreya", Georgia, serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas#cv{position:fixed; inset:0; display:block;}

  /* ---------- HUD ---------- */
  #hud,#log,#hint,#banner,#touch{opacity:0; pointer-events:none; transition:opacity .6s ease;}
  body.play #hud, body.play #log, body.play #hint, body.play #banner{opacity:1;}
  body.play.coarse #touch{opacity:1; pointer-events:auto;}

  .panel{
    background:linear-gradient(180deg, rgba(16,18,28,.82), rgba(9,10,17,.88));
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 4px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(3px);
  }
  #pTL{position:fixed; top:14px; left:14px; z-index:5; padding:10px 14px 11px; width:272px;}
  .name-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  #charName{font-family:Cinzel,serif; font-weight:700; font-size:13px; letter-spacing:.14em; color:var(--amber2);}
  #levelTag{font-family:Cinzel,serif; font-size:10px; letter-spacing:.2em; color:var(--dim);}
  .bar{position:relative; height:15px; border-radius:4px; background:#141722; overflow:hidden;
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 2px 4px rgba(0,0,0,.5);}
  .bar .ghost{position:absolute; inset:0 auto 0 0; width:100%; background:#e8b48a; transition:width .5s ease .22s;}
  .bar.hp .fill{position:absolute; inset:0 auto 0 0; width:100%;
      background:linear-gradient(180deg,#e5666b,#a72e37 60%,#8c222b);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
  .bar.hp .fill.low{animation:hpPulse 1s ease-in-out infinite;}
  @keyframes hpPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.5);}}
  .bar .bl{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-family:Cinzel,serif; font-size:9.5px; font-weight:700; letter-spacing:.12em; color:#fff;
      text-shadow:0 1px 2px rgba(0,0,0,.8);}
  .bar.xp{height:5px; margin-top:5px; border-radius:3px;}
  .bar.xp .fill{position:absolute; inset:0 auto 0 0; width:0%;
      background:linear-gradient(90deg,#3f8fa5,#58c0d8); box-shadow:0 0 8px rgba(88,192,216,.5);}
  .stats{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:9px; font-size:13px; color:var(--dim);}
  .st{display:inline-flex; align-items:center; gap:5px; letter-spacing:.06em;}
  .st b{color:var(--text); font-weight:700;}
  .st i{font-style:normal; font-family:Cinzel,serif; font-size:8.5px; color:#6b7288;
        border:1px solid #3a4054; border-radius:4px; padding:1px 4px; margin-left:1px;}
  .st.gold b{color:var(--gold);}
  .ic{width:14px; height:14px; stroke:var(--amber); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.9;}

  #depthTag{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:5;
    display:flex; align-items:center; gap:12px; white-space:nowrap;
    font-family:Cinzel,serif; font-size:11px; font-weight:700; letter-spacing:.32em; color:#c8bd9e;
    text-shadow:0 2px 6px rgba(0,0,0,.9);
  }
  #depthTag::before,#depthTag::after{content:""; display:block; width:56px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(240,179,76,.45)); }
  #depthTag::after{background:linear-gradient(90deg,rgba(240,179,76,.45),transparent);}

  #mmWrap{position:fixed; top:14px; right:14px; z-index:5; padding:8px;}
  #mm{display:block; width:174px; image-rendering:pixelated;}
  .mm-cap{font-family:Cinzel,serif; font-size:8.5px; letter-spacing:.34em; color:#6b7288; text-align:center; margin-top:6px;}

  #log{position:fixed; left:14px; bottom:14px; z-index:5; width:min(360px, 62vw);}
  #log .ln{font-size:14.5px; line-height:1.4; text-shadow:0 1px 3px #000, 0 0 12px rgba(0,0,0,.7); transition:opacity .4s;}
  #log .ln.good{color:#e9c87e;}
  #log .ln.bad{color:#e2757a;}
  #log .ln.info{color:#aeb6c8;}
  #log .ln.dim{color:#767e92; font-style:italic;}
  #log .ln.epic{color:#ffd66e; text-shadow:0 0 12px rgba(255,214,110,.45);}
  #log .ln.bad.epic{color:#ff9a6b;}

  #hint{position:fixed; right:14px; bottom:14px; z-index:5; font-size:12.5px; color:#767e92;
        text-shadow:0 1px 3px #000;}
  #hint kbd{font-family:Cinzel,serif; font-size:9.5px; color:#a8afc4; border:1px solid #3a4054;
        border-radius:4px; padding:1px 5px; margin:0 2px;}
  body.coarse #hint{display:none;}

  #banner{position:fixed; top:26%; left:0; right:0; z-index:8; text-align:center; pointer-events:none;}
  #bMain{font-family:Cinzel,serif; font-weight:900; font-size:clamp(28px,4.6vw,52px); letter-spacing:.18em;
      color:#f4e6c0; text-shadow:0 0 30px rgba(240,179,76,.4), 0 4px 18px rgba(0,0,0,.9);
      opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease;}
  #bSub{font-family:Cinzel,serif; font-size:clamp(12px,1.5vw,17px); letter-spacing:.5em; color:var(--amber);
      margin-top:8px; opacity:0; transform:translateY(10px); transition:opacity .5s ease .12s, transform .5s ease .12s;}
  #banner.show #bMain,#banner.show #bSub{opacity:1; transform:translateY(0);}

  /* ---------- overlays ---------- */
  #ovl{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(ellipse at 50% 38%, rgba(14,16,26,.62) 0%, rgba(4,5,9,.94) 78%);
      animation:fadeIn .7s ease both;}
  #ovl.hidden{display:none;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .ovl-inner{text-align:center; max-width:760px; padding:24px; animation:riseIn .8s cubic-bezier(.2,.8,.2,1) both .15s;}
  @keyframes riseIn{from{opacity:0; transform:translateY(18px);}to{opacity:1; transform:translateY(0);}}
  .eyebrow{font-family:Cinzel,serif; font-size:clamp(10px,1.2vw,13px); font-weight:700; letter-spacing:.55em;
      color:var(--dim); margin-bottom:14px;}
  h1.title{font-family:Cinzel,serif; font-weight:900; font-size:clamp(52px,9vw,108px); letter-spacing:.08em;
      line-height:1; background:linear-gradient(180deg,#fff3d0 5%,#f6c76a 45%,#b47a24 78%,#8a5a1c);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 0 28px rgba(240,179,76,.35)) drop-shadow(0 6px 20px rgba(0,0,0,.8));}
  h2.sub{font-family:Cinzel,serif; font-weight:700; font-size:clamp(26px,4vw,44px); letter-spacing:.12em; margin-bottom:6px;}
  .tagline{font-style:italic; font-size:clamp(15px,1.9vw,19px); color:#c9c0a8; margin:18px auto 0; max-width:520px; line-height:1.55;}
  .ctrl-grid{display:grid; grid-template-columns:repeat(2, minmax(180px,220px)); gap:7px 26px; justify-content:center;
      margin:26px auto 0; font-size:14px; color:#aeb6c8; text-align:left;}
  .ctrl-grid div{display:flex; justify-content:space-between; gap:14px; align-items:center;
      border-bottom:1px solid rgba(255,255,255,.05); padding-bottom:5px;}
  .ctrl-grid kbd{font-family:Cinzel,serif; font-size:10.5px; letter-spacing:.08em; color:#ffd98a; white-space:nowrap;}
  .btn{pointer-events:auto; cursor:pointer; margin-top:30px; display:inline-block;
      font-family:Cinzel,serif; font-weight:700; font-size:15px; letter-spacing:.3em; text-indent:.3em;
      color:#ffd98a; background:rgba(240,179,76,.04); border:1px solid rgba(240,179,76,.5);
      padding:15px 46px; border-radius:4px; transition:all .25s ease;}
  .btn:hover{background:rgba(240,179,76,.14); box-shadow:0 0 36px rgba(240,179,76,.28), inset 0 0 18px rgba(240,179,76,.08);
      transform:translateY(-1px); color:#ffe9b8;}
  .btn:active{transform:translateY(1px);}
  .pressenter{margin-top:14px; font-size:13px; color:#767e92; font-style:italic;}
  .stat-grid{display:grid; grid-template-columns:auto auto; gap:9px 26px; justify-content:center; margin:26px 0 4px;
      font-size:15px; color:#aeb6c8; text-align:left;}
  .stat-grid b{color:var(--text); text-align:right; font-family:Cinzel,serif; letter-spacing:.06em;}
  .stat-grid .row-ic{display:inline-flex; align-items:center; gap:8px;}
  .newbest{display:inline-block; margin-top:16px; font-family:Cinzel,serif; font-size:11px; letter-spacing:.4em;
      color:#0b0d14; background:linear-gradient(180deg,#ffe9ae,#f0b34c); border-radius:3px; padding:5px 14px;
      box-shadow:0 0 24px rgba(240,179,76,.5);}
  .bestline{margin-top:20px; font-size:13px; color:#767e92; letter-spacing:.08em;}
  .credit{margin-top:34px; font-size:12px; color:#5c6377; letter-spacing:.14em; font-style:italic;}
  .ovl-red h2.sub{color:#e2757a; text-shadow:0 0 30px rgba(216,73,79,.4);}
  .ovl-gold h2.sub{color:#ffd66e; text-shadow:0 0 30px rgba(255,214,110,.45);}

  /* ---------- touch controls ---------- */
  #touch{position:fixed; inset:auto 0 0 0; z-index:10; display:flex; justify-content:space-between;
      align-items:flex-end; padding:0 22px 26px;}
  .dpad{display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:6px;}
  .tbtn{pointer-events:auto; display:flex; align-items:center; justify-content:center;
      background:rgba(12,14,23,.6); border:1px solid rgba(240,179,76,.3); border-radius:12px; color:#ffd98a;
      font-family:Cinzel,serif; font-size:15px; touch-action:none;}
  .tbtn:active{background:rgba(240,179,76,.22);}
  .tbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .tact{display:flex; flex-direction:column; gap:10px; align-items:flex-end;}
  .tact .tbtn{width:64px; height:50px; flex-direction:column; gap:2px; font-size:10px; letter-spacing:.1em;}
  .tact .tbtn b{font-size:16px; font-family:Cinzel,serif;}

  @media (max-width:720px){
    #pTL{width:216px; padding:8px 11px 9px;}
    #mmWrap{display:none;}
    #depthTag{font-size:9px; letter-spacing:.2em;}
    #depthTag::before,#depthTag::after{width:26px;}
    #log{width:60vw; bottom:110px;}
    .ctrl-grid{grid-template-columns:1fr; max-width:260px;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="panel" id="pTL">
    <div class="name-row"><span id="charName">THE LANTERNBEARER</span><span id="levelTag">LEVEL I</span></div>
    <div class="bar hp"><div class="ghost" id="hpGhost"></div><div class="fill" id="hpFill"></div><span class="bl" id="hpText">32 / 32</span></div>
    <div class="bar xp"><div class="fill" id="xpFill"></div></div>
    <div class="stats">
      <span class="st">ATK <b id="stAtk">4</b></span>
      <span class="st">DEF <b id="stDef">0</b></span>
      <span class="st gold"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.2"/><circle cx="12" cy="12" r="3.2"/></svg><b id="stGold">0</b></span>
      <span class="st"><svg class="ic" viewBox="0 0 24 24"><path d="M10 3h4"/><path d="M11 3v5.2L5.6 17a3 3 0 0 0 2.7 4.4h7.4a3 3 0 0 0 2.7-4.4L13 8.2V3"/><path d="M7.5 14.5h9"/></svg><b id="stPot">2</b><i>Q</i></span>
      <span class="st"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2.5 2.5 0 0 1 0-5h1"/><path d="M8 4a2.5 2.5 0 0 0 0 5"/><path d="M11.5 9.5h4.5M11.5 13.5h4.5"/></svg><b id="stScr">0</b><i>E</i></span>
    </div>
  </div>
  <div id="depthTag">DEPTH I · THE WEEPING GATE</div>
  <div class="panel" id="mmWrap"><canvas id="mm"></canvas><div class="mm-cap">CHART</div></div>
</div>

<div id="log"></div>
<div id="hint"><kbd>WASD</kbd> move <kbd>SPACE</kbd> wait <kbd>Q</kbd> potion <kbd>E</kbd> scroll <kbd>M</kbd> sound</div>
<div id="banner"><div id="bMain"></div><div id="bSub"></div></div>

<div id="touch">
  <div class="dpad">
    <div></div><button class="tbtn" data-dir="0,-1"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><div></div>
    <button class="tbtn" data-dir="-1,0"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="tbtn" data-dir="wait"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg></button>
    <button class="tbtn" data-dir="1,0"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div></div><button class="tbtn" data-dir="0,1"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div></div>
  </div>
  <div class="tact">
    <button class="tbtn" data-act-touch="potion"><b>Q</b>DRINK</button>
    <button class="tbtn" data-act-touch="scroll"><b>E</b>SCROLL</button>
  </div>
</div>

<div id="ovl" class="hidden"></div>

<noscript><p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e8dcc0;">This dungeon needs JavaScript.</p></noscript>

<script>
"use strict";
/* =====================================================================
   EMBERDEEP — a single-file procedural dungeon crawler
   Everything is generated: levels, art, sound. Nothing is loaded.
   ===================================================================== */

/* ---------------- utilities ---------------- */
const TS = 36;
const T = { WALL:0, FLOOR:1, STAIRS:2 };
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,k)=>a+(b-a)*k;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const cheb=(ax,ay,bx,by)=>Math.max(Math.abs(ax-bx),Math.abs(ay-by));
const easeOutQuad=k=>k*(2-k);
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const roman=n=>ROMAN[n-1]||String(n);
const el=id=>document.getElementById(id);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let seed=(Date.now()^(Math.random()*1e9))>>>0, rng=mulberry32(seed);
const R=(a,b)=>a+rng()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pickA=arr=>arr[Math.floor(rng()*arr.length)];
function h2(x,y,s){let n=(x*374761393+y*668265263+s*1274126177)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}
const mixc=(c1,c2,k)=>`rgb(${Math.round(lerp(c1[0],c2[0],k))},${Math.round(lerp(c1[1],c2[1],k))},${Math.round(lerp(c1[2],c2[2],k))})`;

const FLOOR_NAMES=['THE WEEPING GATE','THE SUNKEN HALLS','THE DROWNED ARCHIVE','THE OSSUARY','THE BLOOD GALLERY','THE SILENT FOUNDRY','THE WHISPERING DEEPS','THE BONE ORCHARD','THE ASHEN COURT','THE EMBER THRONE'];
const SWORD_NAMES=['a chipped shortsword','a bronze falchion','a steel longsword','a runed saber','emberbrand, blade of the deep'];
const ARMOR_NAMES=['a cracked buckler','a boiled-leather jerkin','a hauberk of grey mail','a warding plate','the Emberward, unmelting'];

/* ---------------- audio ---------------- */
const AU={ctx:null,master:null,on:true,noiseBuf:null,drone:null,dripT:0};
function initAudio(){
  if(AU.ctx){ if(AU.ctx.state==='suspended')AU.ctx.resume(); return; }
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    AU.ctx=new AC(); AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.on?0.5:0;
    AU.master.connect(AU.ctx.destination);
    const len=AU.ctx.sampleRate|0, buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    AU.noiseBuf=buf;
  }catch(e){}
}
function beep(f0,f1,dur,type,vol,when){
  if(!AU.ctx||!AU.on)return; const t=AU.ctx.currentTime+(when||0);
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+dur+0.03);
}
function noiseB(dur,vol,freq,q,when,f1){
  if(!AU.ctx||!AU.on||!AU.noiseBuf)return; const t=AU.ctx.currentTime+(when||0);
  const s=AU.ctx.createBufferSource(); s.buffer=AU.noiseBuf; s.loop=true;
  const f=AU.ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=q||1;
  f.frequency.setValueAtTime(freq,t); if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=AU.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+dur+0.03);
}
let stepAlt=false;
const sfx={
  step(){stepAlt=!stepAlt; noiseB(0.06,0.045,stepAlt?260:340,1.4);},
  bump(){beep(95,55,0.09,'square',0.09); noiseB(0.05,0.06,180,1);},
  hit(){noiseB(0.09,0.24,850,0.8); beep(170,60,0.12,'square',0.16);},
  crit(){noiseB(0.14,0.3,700,0.7); beep(1200,240,0.22,'sawtooth',0.1); beep(150,50,0.16,'square',0.18);},
  hurt(){beep(290,110,0.24,'sawtooth',0.2); noiseB(0.12,0.16,420,0.8);},
  die(){noiseB(0.32,0.28,380,0.6); beep(210,40,0.34,'square',0.14);},
  coin(){beep(1250,1250,0.06,'sine',0.14); beep(1680,1680,0.09,'sine',0.12,0.06);},
  pickup(){beep(660,660,0.08,'triangle',0.14); beep(990,990,0.12,'triangle',0.12,0.07);},
  potion(){beep(320,320,0.07,'sine',0.12); beep(430,430,0.07,'sine',0.12,0.06); beep(560,760,0.14,'sine',0.12,0.12);},
  stairs(){[392,330,262,196].forEach((f,i)=>beep(f,f*0.99,0.22,'triangle',0.13,i*0.13)); noiseB(0.7,0.05,300,0.4);},
  level(){[330,392,494,587,740].forEach((f,i)=>beep(f,f,0.24,'triangle',0.13,i*0.09));},
  fire(){noiseB(0.55,0.3,1400,0.5,0,150); beep(600,70,0.5,'sawtooth',0.1);},
  growl(){beep(120,60,0.3,'sawtooth',0.1);},
  roar(){beep(90,28,0.8,'sawtooth',0.22); noiseB(0.8,0.2,220,0.5); beep(55,40,0.9,'square',0.12,0.05);},
  slam(){noiseB(0.4,0.4,140,0.6,0,60); beep(70,32,0.4,'square',0.24);},
  charge(){beep(200,700,0.5,'sawtooth',0.06);},
  deny(){beep(150,120,0.09,'square',0.07);},
  win(){[392,494,587,784,988,1175].forEach((f,i)=>beep(f,f,0.4,'triangle',0.13,i*0.12));},
};
function ambientStart(){
  if(!AU.ctx||AU.drone)return;
  try{
    const o1=AU.ctx.createOscillator(),o2=AU.ctx.createOscillator(),g=AU.ctx.createGain(),f=AU.ctx.createBiquadFilter();
    o1.type='sawtooth'; o2.type='sawtooth';
    o1.frequency.value=52; o2.frequency.value=52.7;
    f.type='lowpass'; f.frequency.value=190;
    g.gain.value=0.028;
    const lfo=AU.ctx.createOscillator(),lg=AU.ctx.createGain();
    lfo.frequency.value=0.09; lg.gain.value=0.012; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(AU.master); o1.start(); o2.start();
    AU.drone={o1,o2,g,lfo};
  }catch(e){}
}

let bakeCv=null,bctx=null;
let entities=[],items=[],torches=[],decor=[],parts=[],floaters=[];

        cam:{x:0,y:0},focus:null,attractT:0,run:{gold:0,kills:0,steps:0},best:null};

const idx=(x,y)=>y*W+x;
const tileAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?T.WALL:map[y*W+x];
const walkableT=t=>t===T.FLOOR||t===T.STAIRS;

/* ---------------- FOV / light ---------------- */
function clearLine(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;
  while(!(x===x1&&y===y1)){
    const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;}
    if(e2<dx){err+=dx;y+=sy;}
    if(x===x1&&y===y1)break;
    if(map[y*W+x]===T.WALL)return false;
  }
  return true;
}
function recomputeFOV(){
  vis.fill(0);
  const px=P.x,py=P.y,RA=9,RA2=RA*RA;
  for(let y=Math.max(0,py-RA);y<=Math.min(H-1,py+RA);y++)
    for(let x=Math.max(0,px-RA);x<=Math.min(W-1,px+RA);x++){
      const dx=x-px,dy=y-py;
      if(dx*dx+dy*dy>RA2)continue;
      if(clearLine(px,py,x,y)){const i=y*W+x;vis[i]=1;exp[i]=1;}
    }
  // lantern betrays you: lit foes notice the flame (the king keeps his own counsel)
  for(const e of entities){
    if(e.dead||e.awake||e.boss)continue;
    const i=idx(e.x,e.y);
    if(vis[i]&&dist2(e.x,e.y,px,py)<=49)e.awake=true;
  }
}
function computeDist(){
  distF=new Int16Array(W*H).fill(-1);
  const q=[idx(P.x,P.y)]; distF[q[0]]=0; let head=0;
  while(head<q.length){
    const i=q[head++],d=distF[i],x=i%W,y=(i/W)|0;
    const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(const[nx,ny]of nb){
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const j=ny*W+nx;
      if(distF[j]<0&&walkableT(map[j])){distF[j]=d+1;q.push(j);}
    }
  }
}

/* ---------------- level generation ---------------- */
function genLevel(depth){
  rng=mulberry32((seed^(depth*2654435761))>>>0);
  const boss=depth>=10;
  W=boss?46:58; H=boss?36:40;
  map=new Uint8Array(W*H); vis=new Uint8Array(W*H); exp=new Uint8Array(W*H);
  entities=[];items=[];torches=[];decor=[];floaters=[];
  const rooms=[];
  const carveR=r=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)map[y*W+x]=T.FLOOR;};
  let sx,sy;

  if(boss){
    const arena={x:10,y:7,w:26,h:17},entry={x:20,y:29,w:6,h:4};
    carveR(arena);carveR(entry);
    for(let y=24;y<25+1;y++)for(let x=22;x<24;x++)map[y*W+x]=T.FLOOR; // corridor
    for(let x=20;x<26;x++)map[25*W+x]=T.FLOOR;map[26*W+22]=T.FLOOR;map[26*W+23]=T.FLOOR;map[27*W+22]=T.FLOOR;map[27*W+23]=T.FLOOR;map[28*W+22]=T.FLOOR;map[28*W+23]=T.FLOOR;
    rooms.push(arena,entry);
    sx=22;sy=31;
    // arena torch ring
    const ax=arena.x,ay=arena.y,aw=arena.w,ah=arena.h;
    for(let x=ax+2;x<ax+aw-1;x+=4){torches.push({x,y:ay-1,ph:rng()*7});torches.push({x,y:ay+ah,ph:rng()*7});}
    for(let y=ay+2;y<ay+ah-1;y+=4){torches.push({x:ax-1,y,ph:rng()*7});torches.push({x:ax+aw,y,ph:rng()*7});}
    // ember fissures decor
    for(let i=0;i<26;i++)decor.push({x:ax+RI(1,aw-2),y:ay+RI(1,ah-2),t:'ember'});
  }else{
    const target=9+RI(0,3);let tries=90;
    while(rooms.length<target&&tries-->0){
      const w=RI(5,11),h=RI(4,9),x=RI(2,W-w-3),y=RI(2,H-h-3);
      let bad=false;
      for(const r of rooms)if(x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y){bad=true;break;}
      if(bad)continue;
      const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)};carveR(r);rooms.push(r);
    }
    const corr=(a,b)=>{
      const c=[[a.cx,a.cy],[b.cx,b.cy]];
      if(rng()<0.5){for(let x=Math.min(c[0][0],c[1][0]);x<=Math.max(c[0][0],c[1][0]);x++)map[c[0][1]*W+x]=T.FLOOR;
                   for(let y=Math.min(c[0][1],c[1][1]);y<=Math.max(c[0][1],c[1][1]);y++)map[y*W+c[1][0]]=T.FLOOR;}
      else{for(let y=Math.min(c[0][1],c[1][1]);y<=Math.max(c[0][1],c[1][1]);y++)map[y*W+c[0][0]]=T.FLOOR;
           for(let x=Math.min(c[0][0],c[1][0]);x<=Math.max(c[0][0],c[1][0]);x++)map[c[1][1]*W+x]=T.FLOOR;}
    };
    for(let i=1;i<rooms.length;i++)corr(rooms[i-1],rooms[i]);
    const extra=RI(2,3);
    for(let i=0;i<extra&&rooms.length>3;i++)corr(pickA(rooms),pickA(rooms));
    const start=rooms[0];sx=start.cx;sy=start.cy;
    // stairs: farthest room by BFS
    const df=new Int16Array(W*H).fill(-1);const q=[sy*W+sx];df[q[0]]=0;let head=0;
    while(head<q.length){const i2=q[head++],d=df[i2],x=i2%W,y=(i2/W)|0;
      const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for(const[nx,ny]of nb){if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;
        if(df[j]<0&&walkableT(map[j])){df[j]=d+1;q.push(j);}}}
    let best=rooms[1]||rooms[0],bd=-1;
    for(const r of rooms){const d=df[r.cy*W+r.cx];if(d!=null&&d>bd){bd=d;best=r;}}
    map[best.cy*W+best.cx]=T.STAIRS;
    // wall torches
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      if(map[y*W+x]===T.WALL&&map[(y+1)*W+x]===T.FLOOR&&rng()<0.052){
        let near=false;
        for(const t of torches)if(Math.abs(t.x-x)<3&&Math.abs(t.y-y)<3){near=true;break;}
        if(!near)torches.push({x,y,ph:rng()*7});
      }
    }
    // floor decor
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      if(map[y*W+x]!==T.FLOOR)continue;
      const r=rng();
      if(r<0.05)decor.push({x,y,t:'bones',rot:rng()*6.28});
      else if(r<0.13)decor.push({x,y,t:'rubble',rot:rng()*6.28});
      else if(r<0.22)decor.push({x,y,t:'moss',rot:rng()*6.28});
      else if(r<0.255)decor.push({x,y,t:'crack',rot:rng()*6.28});
    }
  }

  // shared spawn logic
  const spawnTiles=(minD,count)=>{
    const out=[];let guard=900;
    const df=new Int16Array(W*H).fill(-1);const q=[sy*W+sx];df[q[0]]=0;let head=0;
    while(head<q.length){const i2=q[head++],d=df[i2],x=i2%W,y=(i2/W)|0;
      const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for(const[nx,ny]of nb){if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;
        if(df[j]<0&&walkableT(map[j])){df[j]=d+1;q.push(j);}}}
    const used=new Set([sy*W+sx]);
    while(out.length<count&&guard-->0){
      const x=RI(1,W-2),y=RI(1,H-2),i=y*W+x;
      if(!walkableT(map[i])||map[i]===T.STAIRS||used.has(i)||df[i]<minD)continue;
      used.add(i);out.push([x,y]);
    }
    return out;
  };

  if(!boss){
    const kinds=[];
    const table=[];
    const addK=(k,n)=>{for(let i=0;i<n;i++)table.push(k);};
    addK('slime',depth<=3?4:depth<6?2:1);
    addK('bat',depth<=2?3:depth<7?2:1);
    if(depth>=2)addK('skel',4);
    if(depth>=4)addK('brute',depth>=7?2:1);
    if(depth>=5)addK('wraith',depth>=8?2:1);
    const count=Math.min(5+depth+RI(0,2),16);
    const spots=spawnTiles(9,count);
    for(const[x,y]of spots)spawnEnemy(pickA(table),x,y,depth);
  }else{
    spawnEnemy('king',22,13,depth);
    spawnEnemy('skel',18,15,depth);spawnEnemy('skel',26,15,depth);
    items.push({kind:'potion',x:21,y:30},{kind:'potion',x:24,y:30},{kind:'scroll',x:22,y:29});
    items.push({kind:'gold',x:12,y:9,n:30},{kind:'gold',x:33,y:9,n:30},{kind:'gold',x:12,y:21,n:30},{kind:'gold',x:33,y:21,n:30});
  }
  if(!boss){
    const spots2=spawnTiles(4,30);
    let si=0;
    const take=()=>si<spots2.length?spots2[si++]:null;
    const nPot=2+(depth>=4?1:0)+(rng()<0.4?1:0);
    for(let i=0;i<nPot;i++){const s=take();if(s)items.push({kind:'potion',x:s[0],y:s[1]});}
    for(let i=0, n=RI(4,6);i<n;i++){const s=take();if(s)items.push({kind:'gold',x:s[0],y:s[1],n:5+RI(0,14)+depth*2});}
    if(rng()<0.75){const s=take();if(s)items.push({kind:'sword',x:s[0],y:s[1],n:2+Math.floor(depth*0.8)});}
    if(rng()<0.6){const s=take();if(s)items.push({kind:'armor',x:s[0],y:s[1],n:1+Math.floor(depth/2)});}
    if(rng()<0.65){const s=take();if(s)items.push({kind:'scroll',x:s[0],y:s[1]});}
  }

  P.x=sx;P.y=sy;P.px=sx;P.py=sy;P.fx=1;P.fy=0;P.anim=null;P.dead=false;
  bakeLevel(depth);
}

/* ---------------- bake (static art) ---------------- */
function bakeLevel(depth){
  bakeCv=document.createElement('canvas');bakeCv.width=W*TS;bakeCv.height=H*TS;
  bctx=bakeCv.getContext('2d');
  const warm=clamp((depth-1)/9,0,1)*0.45;
  const fA=[52,56,72],fB=[76,58,58],wA=[27,30,44],wB=[48,39,44];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,t=map[i],px=x*TS,py=y*TS,hh=h2(x,y,depth*13);
    if(t===T.WALL){
      bctx.fillStyle=mixc(wA,wB,warm*(0.6+hh*0.4));
      bctx.fillRect(px,py,TS,TS);
      bctx.fillStyle='rgba(255,255,255,0.045)';
      bctx.fillRect(px,py,TS,2);bctx.fillRect(px,py,2,TS);
      bctx.fillStyle='rgba(0,0,0,0.34)';
      bctx.fillRect(px,py+TS-3,TS,3);bctx.fillRect(px+TS-2,py,2,TS);
      // brick seams
      bctx.strokeStyle='rgba(0,0,0,0.16)';bctx.lineWidth=1;
      bctx.beginPath();
      for(let by=py+9;by<py+TS;by+=9){bctx.moveTo(px,by+0.5);bctx.lineTo(px+TS,by+0.5);}
      const off=((x+y)%2)*9;
      for(let bx=px+off;bx<px+TS;bx+=18){bctx.moveTo(bx+0.5,py);bctx.lineTo(bx+0.5,py+TS);}
      bctx.stroke();
      if(hh>0.88){ // wall crack
        bctx.strokeStyle='rgba(5,6,10,0.55)';bctx.beginPath();
        let cx2=px+6+h2(x,y,7)*20,cy2=py+4;
        bctx.moveTo(cx2,cy2);
        for(let s=0;s<4;s++){cx2+=(h2(x,y,s+11)-0.5)*10;cy2+=7;bctx.lineTo(cx2,cy2);}
        bctx.stroke();
      }
    }else{
      const v=(hh-0.5)*16;
      const base=[lerp(fA[0],fB[0],warm)+v,lerp(fA[1],fB[1],warm)+v,lerp(fA[2],fB[2],warm)+v];
      bctx.fillStyle=`rgb(${base[0]|0},${base[1]|0},${base[2]|0})`;
      bctx.fillRect(px,py,TS,TS);
      bctx.fillStyle='rgba(255,255,255,0.05)';bctx.fillRect(px,py,TS,2);
      bctx.fillStyle='rgba(0,0,0,0.22)';bctx.fillRect(px,py+TS-2,TS,2);
      if(hh>0.62&&hh<0.66){ // slab seam
        bctx.strokeStyle='rgba(0,0,0,0.2)';bctx.beginPath();
        bctx.moveTo(px+4,py+TS/2);bctx.lineTo(px+TS-4,py+TS/2);bctx.stroke();
      }
      if(t===T.STAIRS){ // descending stairwell
        const cols=['#3a3f52','#2c3040','#21242f','#171922','#0e0f16'];
        for(let s=0;s<5;s++){
          bctx.fillStyle=cols[s];
          const inx=3+s*3.2,iny=3+s*3.2;
          bctx.fillRect(px+inx,py+iny,TS-inx*2,TS-iny*2);
        }
        bctx.strokeStyle='rgba(240,179,76,0.35)';bctx.lineWidth=1.5;
        bctx.strokeRect(px+2,py+2,TS-4,TS-4);
      }
    }
  }
  // wall drop shadows onto floors
  for(let y=1;y<H;y++)for(let x=0;x<W;x++){
    if(map[y*W+x]!==T.FLOOR&&map[y*W+x]!==T.STAIRS)continue;
    if(map[(y-1)*W+x]===T.WALL){
      const g=bctx.createLinearGradient(0,y*TS,0,y*TS+10);
      g.addColorStop(0,'rgba(0,0,0,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');
      bctx.fillStyle=g;bctx.fillRect(x*TS,y*TS,TS,10);
    }
    if(x>0&&map[y*W+x-1]===T.WALL){
      const g=bctx.createLinearGradient(x*TS,0,x*TS+7,0);
      g.addColorStop(0,'rgba(0,0,0,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');
      bctx.fillStyle=g;bctx.fillRect(x*TS,y*TS,7,TS);
    }
  }
  // decor
  for(const d of decor)drawDecorBake(d);
  // torch brackets
  for(const t of torches){
    const px=t.x*TS+TS/2,py=t.y*TS+8;
    bctx.fillStyle='#191b24';
    bctx.beginPath();bctx.moveTo(px-5,py+9);bctx.lineTo(px+5,py+9);bctx.lineTo(px,py+2);bctx.closePath();bctx.fill();
    bctx.fillStyle='#2c2f3d';bctx.fillRect(px-1.5,py,3,7);
  }
}
function drawDecorBake(d){
  const px=d.x*TS+TS/2,py=d.y*TS+TS/2;
  bctx.save();bctx.translate(px,py);bctx.rotate(d.rot);
  if(d.t==='bones'){
    bctx.strokeStyle='rgba(210,200,168,0.75)';bctx.lineWidth=2.4;bctx.lineCap='round';
    bctx.beginPath();bctx.moveTo(-8,3);bctx.lineTo(7,-4);bctx.stroke();
    bctx.fillStyle='rgba(210,200,168,0.75)';
    [[-8,3],[7,-4]].forEach(p=>{bctx.beginPath();bctx.arc(p[0],p[1]-2,2,0,6.28);bctx.arc(p[0],p[1]+2,2,0,6.28);bctx.fill();});
    if(h2(d.x,d.y,3)>0.5){bctx.beginPath();bctx.arc(4,4,4.4,0,6.28);bctx.fill();
      bctx.fillStyle='rgba(20,22,30,0.9)';bctx.beginPath();bctx.arc(2.6,3.2,1.1,0,6.28);bctx.arc(5.4,3.2,1.1,0,6.28);bctx.fill();}
  }else if(d.t==='rubble'){
    bctx.fillStyle='rgba(58,63,82,0.85)';
    for(let i=0;i<3;i++){const a=h2(d.x,d.y,i+9)*6.28,r=3+h2(d.x,d.y,i+20)*5;
      bctx.beginPath();bctx.arc(Math.cos(a)*r*0.7,Math.sin(a)*r*0.6,1.6+h2(d.x,d.y,i+30)*2,0,6.28);bctx.fill();}
  }else if(d.t==='moss'){
    bctx.fillStyle='rgba(64,96,60,0.4)';
    for(let i=0;i<3;i++){bctx.beginPath();
      bctx.ellipse((h2(d.x,d.y,i)-0.5)*14,(h2(d.y,d.x,i)-0.5)*14,4+h2(d.x,d.y,i+5)*5,3+h2(d.y,d.x,i+6)*4,0,0,6.28);bctx.fill();}
  }else if(d.t==='crack'){
    bctx.strokeStyle='rgba(10,11,16,0.5)';bctx.lineWidth=1.4;bctx.beginPath();
    let cx2=-10,cy2=(h2(d.x,d.y,2)-0.5)*16;bctx.moveTo(cx2,cy2);
    for(let s=0;s<4;s++){cx2+=5;cy2+=(h2(d.x,d.y,s+40)-0.5)*10;bctx.lineTo(cx2,cy2);}
    bctx.stroke();
  }else if(d.t==='ember'){
    bctx.fillStyle='rgba(255,110,40,0.16)';
    bctx.beginPath();bctx.ellipse(0,0,7,4,0,0,6.28);bctx.fill();
    bctx.fillStyle='rgba(255,160,70,0.35)';
    for(let i=0;i<3;i++){bctx.beginPath();bctx.arc((h2(d.x,d.y,i)-0.5)*10,(h2(d.y,d.x,i)-0.5)*8,1,0,6.28);bctx.fill();}
  }
  bctx.restore();
}
function decalBlood(x,y,big){
  if(!bctx)return;
  const px=x*TS+TS/2,py=y*TS+TS/2;
  bctx.fillStyle=big?'rgba(96,16,24,0.55)':'rgba(120,20,28,0.45)';
  for(let i=0;i<(big?9:5);i++){
    const a=rng()*6.28,r=rng()*(big?16:9);
    bctx.beginPath();bctx.ellipse(px+Math.cos(a)*r,py+Math.sin(a)*r,2+rng()*4,1.5+rng()*3,rng()*3,0,6.28);bctx.fill();
  }
}
function decalScorch(x,y){
  if(!bctx)return;
  const px=x*TS+TS/2,py=y*TS+TS/2;
  bctx.fillStyle='rgba(8,7,10,0.6)';
  bctx.beginPath();bctx.ellipse(px,py,16,12,0,0,6.28);bctx.fill();
  bctx.fillStyle='rgba(255,120,40,0.3)';
  for(let i=0;i<8;i++){const a=rng()*6.28,r=rng()*12;
    bctx.beginPath();bctx.arc(px+Math.cos(a)*r,py+Math.sin(a)*r,1,0,6.28);bctx.fill();}
}

/* ---------------- entities ---------------- */
const EDEF={
  slime:{name:'cave slime',hp:6,atk:3,xp:4,half:1},
  bat:{name:'dire bat',hp:4,atk:2,xp:3,erratic:1},
  skel:{name:'skeleton',hp:11,atk:4,xp:7},
  brute:{name:'troll brute',hp:20,atk:7,xp:12,half:1},
  wraith:{name:'wraith',hp:12,atk:5,xp:10,swift:1},
  king:{name:'The Ember King',hp:150,atk:9,xp:120,boss:1},
};
function spawnEnemy(kind,x,y,depth){
  const d=EDEF[kind];
  const hpMul=d.boss?1:1+(depth-1)*0.07, atkAdd=d.boss?0:Math.floor((depth-1)/3);
  entities.push({kind,x,y,px:x,py:y,hp:Math.round(d.hp*hpMul),maxhp:Math.round(d.hp*hpMul),
    atk:d.atk+(d.boss?0:atkAdd),xp:d.xp,awake:false,flash:0,anim:null,ph:rng()*7,
    half:d.half||0,erratic:d.erratic||0,swift:d.swift||0,boss:d.boss||0,charge:0,didAtk:false,dead:false});
}
function freshPlayer(){
  return {x:0,y:0,px:0,py:0,fx:1,fy:0,anim:null,dead:false,flash:0,ph:0,
    hp:32,maxhp:32,atk:4,weapon:0,armor:0,baseDef:0,level:1,xp:0,xpNext:18,potions:2,scrolls:0};
}
const pAtk=()=>P.atk+P.weapon;
const pDef=()=>P.baseDef+P.armor;

function setAnim(e,type,tx,ty,dur){e.anim={type,fx:e.px,fy:e.py,tx,ty,t0:performance.now(),dur};}
function entPos(e,now){
  if(e.anim){
    const k=clamp((now-e.anim.t0)/e.anim.dur,0,1);
    if(e.anim.type==='move'){
      const ek=easeOutQuad(k);
      e.px=lerp(e.anim.fx,e.anim.tx,ek);e.py=lerp(e.anim.fy,e.anim.ty,ek);
      if(k>=1)e.anim=null;
    }else{ // lunge
      const s=Math.sin(k*Math.PI)*0.38;
      e.px=e.anim.fx+(e.anim.tx-e.anim.fx)*s;e.py=e.anim.fy+(e.anim.ty-e.anim.fy)*s;
      if(k>=1){e.px=e.anim.fx;e.py=e.anim.fy;e.anim=null;}
    }
  }else{e.px=e.x;e.py=e.y;}
  return e;
}

/* ---------------- particles / floaters ---------------- */
function spawnP(o){if(parts.length<650)parts.push(Object.assign({vx:0,vy:0,g:0,life:0.6,tl:0.6,size:2,col:'#fff',add:false},o,{tl:o.life||0.6}));}
function burst(x,y,n,fn){for(let i=0;i<n;i++)spawnP(fn(i));}
function bloodBurst(x,y,n){burst(x,y,n,()=>{const a=Math.random()*6.28,s=30+Math.random()*90;
  return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,g:170,life:0.35+Math.random()*0.35,size:1.5+Math.random()*2.4,col:'rgba(178,32,44,0.9)'};});}
function sparkBurst(x,y,n,col){burst(x,y,n,()=>{const a=Math.random()*6.28,s=40+Math.random()*140;
  return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:60,life:0.3+Math.random()*0.4,size:1+Math.random()*2,col:col||'#ffd66e',add:true};});}
function soulBurst(x,y,col){burst(x,y,16,()=>{const a=Math.random()*6.28,s=10+Math.random()*60;
  return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:0.6+Math.random()*0.6,size:1.5+Math.random()*2.5,col:col||'#9fe0ff',add:true};});}
function ftext(x,y,txt,col,scale){floaters.push({x:(x+0.5)*TS,y:y*TS+4,txt,col,scale:scale||1,vy:-30,life:1.05,tl:1.05});}

/* ---------------- turn system ---------------- */
const canAct=()=>G.state==='play'&&P&&!P.dead&&performance.now()>=busyUntil;
function playerAct(dx,dy){
  if(!canAct())return;
  P.fx=dx;P.fy=dy;
  const nx=P.x+dx,ny=P.y+dy;
  const e=enemyAt(nx,ny);
  if(e){attackEnemy(e,dx,dy);return;}
  const t=tileAt(nx,ny);
  if(!walkableT(t)){setAnim(P,'lunge',P.px+dx*0.5,P.py+dy*0.5,150);sfx.bump();busyUntil=performance.now()+170;return;}
  setAnim(P,'move',nx,ny,130);
  P.x=nx;P.y=ny;G.run.steps++;sfx.step();
  checkTileItems();
  if(tileAt(nx,ny)===T.STAIRS){startDescent();return;}
  endTurn(150);
}
function bumpWait(){if(!canAct())return;endTurn(110);}
function attackEnemy(e,dx,dy){
  setAnim(P,'lunge',P.px+dx*0.6,P.py+dy*0.6,170);
  const crit=Math.random()<0.12;
  let dmg=pAtk()+RI(0,1);if(crit)dmg*=2;
  e.hp-=dmg;e.flash=1;e.awake=true;
  ftext(e.x,e.y-0.1,'-'+dmg,crit?'#ffd66e':'#ffb0a0',crit?1.35:1);
  if(crit)ftext(e.x,e.y-0.65,'CRITICAL','#ffd66e',0.72);
  bloodBurst((e.x+0.5)*TS,e.y*TS+16,crit?16:9);
  G.shake=Math.max(G.shake,crit?5:2.5);
  crit?sfx.crit():sfx.hit();
  if(e.hp<=0)killEnemy(e);
  endTurn(190);
}
function killEnemy(e){
  e.dead=true;
  decalBlood(e.x,e.y,e.boss);
  bloodBurst((e.x+0.5)*TS,e.y*TS+16,e.boss?40:12);
  soulBurst((e.x+0.5)*TS,e.y*TS+10,e.kind==='wraith'?'#9fe0ff':e.kind==='king'?'ffb347':'#c8bd9e');
  sfx.die();G.run.kills++;
  if(e.boss){
    items.push({kind:'crown',x:e.x,y:e.y});
    decalScorch(e.x,e.y);
    G.shake=16;G.warmF=1;sfx.roar();
    banner('THE KING FALLS','claim the crown');
    addLog('The Ember King crumbles into ash and gold.','epic');
  }else{
    addLog(`The ${EDEF[e.kind].name} is destroyed.`,'info');
    if(Math.random()<0.5){const g=RI(2,6)+G.depth;G.run.gold+=g;ftext(e.x,e.y-0.55,'+'+g+'g','#ffd66e',0.8);}
  }
  gainXP(e.xp);
  entities=entities.filter(x=>!x.dead);
}
function gainXP(v){
  P.xp+=v;
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext;P.level++;P.xpNext=Math.round(18*Math.pow(P.level,1.35));
    P.maxhp+=6;P.atk+=1;if(P.level%3===0)P.baseDef+=1;
    const heal=Math.max(8,Math.round((P.maxhp-P.hp)*0.45));P.hp=Math.min(P.maxhp,P.hp+heal);
    sparkBurst((P.x+0.5)*TS,P.y*TS+14,26,'#ffd66e');
    ftext(P.x,P.y-0.7,'LEVEL UP','#ffd66e',1.1);
    banner('LEVEL '+roman(P.level),'the flame grows stronger');
    sfx.level();addLog(`You reach level ${P.level}. (+6 HP, +1 ATK${P.level%3===0?', +1 DEF':''})`,'good');
  }
  updateHUD();
}
function endTurn(lock){
  turnCount++;
  enemiesAct();
  if(P.dead){busyUntil=performance.now()+1e9;return;}
  recomputeFOV();
  updateHUD();
  busyUntil=performance.now()+(lock||150);
}
function enemiesAct(){
  if(!P||P.dead)return;
  computeDist();
  for(const e of entities){
    if(e.dead)continue;
    if(e.boss)bossAct(e);else enemyAct(e);
    if(P.dead)return;
  }
  entities=entities.filter(x=>!x.dead);
}
function randStep(e){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
  for(const[dx,dy]of dirs){
    const nx=e.x+dx,ny=e.y+dy;
    if(walkableT(tileAt(nx,ny))&&!occupied(nx,ny)){
      setAnim(e,'move',nx,ny,120);e.x=nx;e.y=ny;return true;
    }
  }
  return false;
}
function stepToward(e){
  const cur=distF[idx(e.x,e.y)];
  if(cur==null||cur<0)return randStep(e);
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
  let best=null,bd=cur;
  for(const[dx,dy]of dirs){
    const nx=e.x+dx,ny=e.y+dy;
    if(!walkableT(tileAt(nx,ny))||occupied(nx,ny))continue;
    const d=distF[idx(nx,ny)];
    if(d>=0&&d<bd){bd=d;best=[nx,ny];}
  }
  if(best){setAnim(e,'move',best[0],best[1],120);e.x=best[0];e.y=best[1];return true;}
  return false;
}
const adjacent4=(e)=>Math.abs(e.x-P.x)+Math.abs(e.y-P.y)===1;
function enemyAct(e){
  if(e.half&&turnCount%2===0)return;
  const actions=e.swift?2:1;let attacked=false;
  for(let a=0;a<actions;a++){
    if(!e.awake){
      const d=distF[idx(e.x,e.y)];
      if(((d!=null&&d<=7)&&clearLine(e.x,e.y,P.x,P.y))||(d!=null&&d<=2)){
        e.awake=true;ftext(e.x,e.y-0.6,'!','#ffd66e',1.2);sfx.growl();
      }else{if(Math.random()<0.25)randStep(e);return;}
    }
    if(adjacent4(e)&&!attacked){attacked=true;enemyAttack(e);if(P.dead)return;continue;}
    if(a>0&&adjacent4(e))continue;
    if(e.erratic&&Math.random()<0.45){randStep(e);continue;}
    stepToward(e);
  }
}
function enemyAttack(e){
  const dx=P.x-e.x,dy=P.y-e.y;
  setAnim(e,'lunge',e.px+dx*0.5,e.py+dy*0.5,180);
  const dmg=Math.max(1,e.atk-pDef()+RI(0,1)-1);
  P.hp-=dmg;
  ftext(P.x,P.y-0.15,'-'+dmg,'#ff8a8a',1.1);
  bloodBurst((P.x+0.5)*TS,P.y*TS+14,8);
  G.hurtF=1;G.shake=Math.max(G.shake,4+dmg*0.45);
  sfx.hurt();
  addLog(`The ${EDEF[e.kind].name} strikes you for ${dmg}.`,'bad');
  if(P.hp<=0){P.hp=0;playerDie(e);}
  updateHUD();
}
function bossAct(k){
  for(let a=0;a<2;a++){
    if(P.dead)return;
    if(adjacent4(k)&&!k.didAtk){k.didAtk=true;enemyAttack(k);continue;}
    if(a>0&&adjacent4(k))continue;
    stepToward(k);
  }
  k.didAtk=false;
  if(!k.awake&&(distF[idx(k.x,k.y)]||99)<=9){
    k.awake=true;banner('THE EMBER KING','he has been waiting');sfx.roar();G.shake=10;
    addLog('The Ember King wakes. His crown burns.','bad');
    return;
  }
  if(!k.awake)return;
  k.charge++;
  if(k.charge===3){
    addLog('The Ember King raises his burning fist...','bad');
    ftext(k.x,k.y-0.8,'...','#ffb347',1.3);
    sparkBurst((k.x+0.5)*TS,(k.y+0.5)*TS,14,'#ff7a2f');
    sfx.charge();
  }else if(k.charge>=4){
    k.charge=0;
    decalScorch(k.x,k.y);
    burst((k.x+0.5)*TS,(k.y+0.5)*TS,44,i=>{const a=i/44*6.28;
      return{x:(k.x+0.5)*TS,y:(k.y+0.5)*TS,vx:Math.cos(a)*240,vy:Math.sin(a)*240,g:0,life:0.5,size:3,col:'#ff8a3d',add:true};});
    G.shake=16;sfx.slam();
    if(cheb(k.x,k.y,P.x,P.y)<=2){
      const dmg=Math.max(1,13-pDef());
      P.hp-=dmg;ftext(P.x,P.y-0.2,'-'+dmg,'#ffb347',1.3);
      G.hurtF=1;addLog('A burning shockwave slams into you!','bad');
      if(P.hp<=0){P.hp=0;playerDie(k);}
      updateHUD();
    }else addLog('The ground quakes under the king\'s fist.','dim');
  }
}
function playerDie(killer){
  P.dead=true;
  soulBurst((P.x+0.5)*TS,P.y*TS+10,'#ffb0a0');
  bloodBurst((P.x+0.5)*TS,P.y*TS+14,26);
  decalBlood(P.x,P.y,false);
  G.shake=12;sfx.roar();
  addLog('Darkness takes you.','bad');
  setTimeout(()=>{if(P&&P.dead)showDeath();},1200);
}

/* ---------------- items ---------------- */
function checkTileItems(){
  for(const it of items){
    if(it.taken||it.x!==P.x||it.y!==P.y)continue;
    if(it.kind==='potion'){it.taken=true;P.potions++;sfx.pickup();addLog('You pocket a healing draught.','good');}
    else if(it.kind==='gold'){it.taken=true;G.run.gold+=it.n;sfx.coin();ftext(P.x,P.y-0.4,'+'+it.n+'g','#ffd66e',0.9);addLog(`You gather ${it.n} gold.`,'good');}
    else if(it.kind==='scroll'){it.taken=true;P.scrolls++;sfx.pickup();addLog('A scroll of embers — read it with E.','good');}
    else if(it.kind==='sword'){
      if(it.n>P.weapon){it.taken=true;P.weapon=it.n;sfx.pickup();
        const nm=SWORD_NAMES[clamp(it.n-2,0,SWORD_NAMES.length-1)];
        addLog(`You take up ${nm} (+${it.n} ATK).`,'epic');sparkBurst((P.x+0.5)*TS,P.y*TS+14,14,'#cfd8ff');}
      else addLog('A dull blade lies here — you leave it.','dim');
    }
    else if(it.kind==='armor'){
      if(it.n>P.armor){it.taken=true;P.armor=it.n;sfx.pickup();
        const nm=ARMOR_NAMES[clamp(it.n-1,0,ARMOR_NAMES.length-1)];
        addLog(`You strap on ${nm} (+${it.n} DEF).`,'epic');sparkBurst((P.x+0.5)*TS,P.y*TS+14,14,'#cfd8ff');}
      else addLog('Worn armor, no better than yours.','dim');
    }
    else if(it.kind==='crown'){it.taken=true;winGame();}
  }
  updateHUD();
}
function usePotion(){
  if(!canAct())return;
  if(P.potions<=0){addLog('No draughts remain.','dim');sfx.deny();return;}
  if(P.hp>=P.maxhp){addLog('You are already whole.','dim');sfx.deny();return;}
  P.potions--;
  const heal=Math.min(P.maxhp-P.hp,14+P.level*2);
  P.hp+=heal;
  ftext(P.x,P.y-0.3,'+'+heal,'#8fe08a',1.1);
  burst((P.x+0.5)*TS,P.y*TS+10,14,()=>({x:(P.x+0.5)*TS+(Math.random()-0.5)*20,y:P.y*TS+16,
    vx:(Math.random()-0.5)*30,vy:-40-Math.random()*40,life:0.7,size:1.6+Math.random()*2,col:'#8fe08a',add:true}));
  sfx.potion();addLog(`The draught knits your wounds (+${heal}).`,'good');
  endTurn(150);
}
function useScroll(){
  if(!canAct())return;
  if(P.scrolls<=0){addLog('You carry no scrolls.','dim');sfx.deny();return;}
  P.scrolls--;
  const dmg=12+G.depth*2,rad=4.5;
  G.warmF=1;G.shake=9;sfx.fire();
  burst((P.x+0.5)*TS,(P.y+0.5)*TS,60,i=>{const a=i/60*6.28,s=120+Math.random()*120;
    return{x:(P.x+0.5)*TS,y:(P.y+0.5)*TS,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,life:0.55,size:2+Math.random()*3,col:Math.random()<0.5?'#ff8a3d':'#ffd66e',add:true};});
  addLog('A ring of fire erupts from the scroll!','epic');
  for(const e of entities){
    if(e.dead)continue;
    const i=idx(e.x,e.y);
    if(!vis[i]||dist2(e.x,e.y,P.x,P.y)>rad*rad)continue;
    e.hp-=dmg;e.flash=1;e.awake=true;
    ftext(e.x,e.y-0.1,'-'+dmg,'#ffb347',1.15);
    sparkBurst((e.x+0.5)*TS,e.y*TS+14,10,'#ff8a3d');
    if(e.hp<=0)killEnemy(e);
  }
  endTurn(240);
}

/* ---------------- flow: descend / win / restart ---------------- */
function startDescent(){
  G.state='transition';sfx.stairs();
  addLog('You descend worn steps into dark.','dim');
  G.veilT=1;G.pendingDepth=G.depth+1;
}
function setupFloor(d){
  G.depth=d;
  genLevel(d);
  recomputeFOV();
  snapCam();
  G.veilT=0;G.state='play';
  banner('DEPTH '+roman(d),FLOOR_NAMES[d-1]||'THE DEEP');

  updateHUD();
  if(d>=10){
    setTimeout(()=>{if(G.state==='play'){G.focus={x:22,y:13,until:performance.now()+1500};}},420);
    addLog('Heat rises. A crowned silhouette waits beyond the pillars.','bad');
  }else if(d>1)addLog('Depth '+d+'. The air grows heavier.','dim');
  if(AU.drone){try{AU.drone.o1.frequency.value=52-d*1.4;AU.drone.o2.frequency.value=(52-d*1.4)+0.7;}catch(e){}}

function winGame(){
  G.state='won';
  sparkBurst((P.x+0.5)*TS,P.y*TS+10,60,'#ffd66e');

}
function score(){return G.run.gold+G.run.kills*15+(G.depth-1)*120;}
function saveBest(){
  const s=score();

}

/* ---------------- input ---------------- */
const DIRK={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
const heldDirs=new Map();
window.addEventListener('keydown',e=>{
  if(DIRK[e.code]||e.code==='Space')e.preventDefault();
  if(e.repeat)return;
  initAudio();
  if(e.code==='Enter'||e.code==='Space'){
    if(G.state==='title'||G.state==='dead'||G.state==='won'){startRun();return;}
  }
  if(DIRK[e.code]){
    heldDirs.set(e.code,DIRK[e.code]);
    if(canAct())playerAct(DIRK[e.code][0],DIRK[e.code][1]);
    return;
  }
  if(e.code==='Space'||e.code==='Period'){if(canAct())bumpWait();return;}
  if(e.code==='KeyQ'||e.code==='Digit1')usePotion();
  if(e.code==='KeyE'||e.code==='Digit2')useScroll();
  if(e.code==='KeyM'){
    AU.on=!AU.on;
    if(AU.master)AU.master.gain.value=AU.on?0.5:0;
    addLog(AU.on?'Sound on.':'Sound off.','dim');
  }
});
window.addEventListener('keyup',e=>heldDirs.delete(e.code));
window.addEventListener('blur',()=>heldDirs.clear());
el('ovl').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&b.dataset.act==='start'){initAudio();startRun();}
});
document.querySelectorAll('#touch .tbtn').forEach(b=>{
  const h=e=>{e.preventDefault();initAudio();
    const d=b.dataset.dir;
    if(d==='wait'){if(canAct())bumpWait();return;}
    if(d){const[dx,dy]=d.split(',').map(Number);if(canAct())playerAct(dx,dy);}
    else if(b.dataset.actTouch==='potion')usePotion();
    else if(b.dataset.actTouch==='scroll')useScroll();
  };
  b.addEventListener('pointerdown',h);
});
document.addEventListener('pointerdown',()=>initAudio(),{once:true});

/* ---------------- camera / resize ---------------- */
function resize(){
  view.dpr=Math.min(2,window.devicePixelRatio||1);
  view.w=window.innerWidth;view.h=window.innerHeight;
  cv.width=view.w*view.dpr;cv.height=view.h*view.dpr;
  cv.style.width=view.w+'px';cv.style.height=view.h+'px';
}
window.addEventListener('resize',resize);
function camTarget(){
  if(G.focus&&performance.now()<G.focus.until)return{x:G.focus.x,y:G.focus.y};
  return{x:P.px,y:P.py};
}
function snapCam(){
  const t={x:P.px*TS+TS/2-view.w/2,y:P.py*TS+TS/2-view.h/2};
  const mx=W*TS-view.w,my=H*TS-view.h;
  G.cam.x=mx<0?mx/2:clamp(t.x,0,mx);
  G.cam.y=my<0?my/2:clamp(t.y,0,my);
}

/* ---------------- update ---------------- */
function update(dt,now){
  G.veil+=(G.veilT-G.veil)*Math.min(1,dt*6.5);
  if(Math.abs(G.veil-G.veilT)<0.01)G.veil=G.veilT;
  if(G.veil>=0.99&&G.pendingDepth){const d=G.pendingDepth;G.pendingDepth=0;setupFloor(d);}
  G.shake*=Math.pow(0.0018,dt);if(G.shake<0.05)G.shake=0;
  G.hurtF=Math.max(0,G.hurtF-dt*2.2);
  G.warmF=Math.max(0,G.warmF-dt*1.4);

  if(G.state==='title'){
    G.attractT+=dt;
    const mx=Math.max(0,W*TS-view.w),my=Math.max(0,H*TS-view.h);
    G.cam.x=mx>0?(0.5+0.42*Math.sin(G.attractT*0.05))*mx:mx/2;
    G.cam.y=my>0?(0.5+0.4*Math.sin(G.attractT*0.033+2))*my:my/2;
    if(Math.random()<dt*3&&torches.length){
      const t=torches[(Math.random()*torches.length)|0];
      spawnP({x:(t.x+0.5)*TS+(Math.random()-0.5)*8,y:t.y*TS+8,vx:(Math.random()-0.5)*12,vy:-22-Math.random()*20,
        life:0.8+Math.random()*0.7,size:1+Math.random()*1.6,col:'#ffb347',add:true});
    }
  }else if(P){
    const t=camTarget();
    const gx=t.x*TS+TS/2-view.w/2,gy=t.y*TS+TS/2-view.h/2;
    const mx=W*TS-view.w,my=H*TS-view.h;
    const tx=mx<0?mx/2:clamp(gx,0,mx),ty=my<0?my/2:clamp(gy,0,my);
    const k=1-Math.pow(0.0001,dt);
    G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k;

    // ambient particles
    if(G.state==='play'&&!P.dead){
      if(Math.random()<dt*7){
        const a=Math.random()*6.28,r=1+Math.random()*5;
        const x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r;
        if(x>=0&&y>=0&&x<W&&y<H&&vis[idx(x|0,y|0)])
          spawnP({x:(x+0.5)*TS,y:(y+0.5)*TS,vx:(Math.random()-0.5)*7,vy:-4-Math.random()*7,
            life:1.2+Math.random()*1.4,size:0.8+Math.random()*1.1,col:'rgba(200,190,160,0.5)'});
      }
      for(const t2 of torches){
        const i=idx(t2.x,t2.y);
        if((i>=0&&i<vis.length&&vis[i])&&Math.random()<dt*2.2)
          spawnP({x:(t2.x+0.5)*TS+(Math.random()-0.5)*7,y:t2.y*TS+7,vx:(Math.random()-0.5)*14,vy:-24-Math.random()*24,
            life:0.7+Math.random()*0.8,size:1+Math.random()*1.5,col:Math.random()<0.5?'#ffb347':'#ff7a2f',add:true});
      }
    }
    // held movement
    if(canAct()&&heldDirs.size){
      let last=null;for(const v of heldDirs.values())last=v;
      if(last)playerAct(last[0],last[1]);
    }
  }

  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.y+=f.vy*dt;f.vy*=Math.pow(0.3,dt);f.life-=dt;
    if(f.life<=0)floaters.splice(i,1);
  }
  if(P)entPos(P,now);
  for(const e of entities){entPos(e,now);e.flash=Math.max(0,e.flash-dt*4);}
  if(P)P.flash=Math.max(0,P.flash-dt*4);
}

/* ---------------- sprites ---------------- */
function shadowE(x,y,rx){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(x,y,rx,rx*0.36,0,0,6.28);ctx.fill();}
function flashOver(x,y,r,a){if(a<=0.02)return;ctx.fillStyle=`rgba(255,255,255,${(a*0.75).toFixed(3)})`;ctx.beginPath();ctx.ellipse(x,y,r,r*1.12,0,0,6.28);ctx.fill();}

function drawPlayer(now){
  const t=now/1000;
  const x=(P.px+0.5)*TS,y=(P.py+0.5)*TS;
  const bob=Math.sin(t*2.6)*1.4;
  shadowE(x,y+13,10);
  ctx.save();ctx.translate(x,y+bob);
  // cloak body
  ctx.fillStyle='#33507e';
  ctx.beginPath();
  ctx.moveTo(-9,13);ctx.quadraticCurveTo(-11,-2,-6,-9);
  ctx.lineTo(6,-9);ctx.quadraticCurveTo(11,-2,9,13);
  ctx.quadraticCurveTo(0,15.5,-9,13);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#1d2f52';ctx.lineWidth=1.4;ctx.stroke();
  // belt
  ctx.strokeStyle='#8a6d4a';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(-8,4);ctx.quadraticCurveTo(0,6,8,4);ctx.stroke();
  // hood
  ctx.fillStyle='#3b5c90';
  ctx.beginPath();ctx.arc(0,-10,7.2,0,6.28);ctx.fill();
  ctx.strokeStyle='#22375c';ctx.lineWidth=1.3;ctx.stroke();
  ctx.fillStyle='#0f1523';
  ctx.beginPath();ctx.arc(0,-9.2,5,0,6.28);ctx.fill();
  // eyes glint toward facing
  ctx.fillStyle='#ffd98a';
  const ex=P.fx*1.6,ey=P.fy*1.2;
  ctx.beginPath();ctx.arc(-2+ex,-9.5+ey,0.9,0,6.28);ctx.arc(2+ex,-9.5+ey,0.9,0,6.28);ctx.fill();
  // boots
  ctx.fillStyle='#243044';
  ctx.fillRect(-6.5,11.5,4.5,3);ctx.fillRect(2,11.5,4.5,3);
  // lantern arm (toward facing)
  const lx=6+P.fx*7,ly=2+P.fy*6;
  ctx.strokeStyle='#6b4a2c';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(5,1);ctx.lineTo(lx,ly-3);ctx.stroke();
  ctx.fillStyle='#2c2c34';ctx.fillRect(lx-3,ly-4,6,7);
  ctx.fillStyle='#ffb347';ctx.fillRect(lx-1.8,ly-2.6,3.6,4.4);
  ctx.fillStyle='rgba(255,230,160,0.85)';ctx.fillRect(lx-0.8,ly-1.6,1.6,2.2);
  ctx.restore();
  flashOver(x,y-2,11,P.flash);
}

function drawEntity(e,now){
  switch(e.kind){
    case 'slime':drawSlime(e,now);break;
    case 'bat':drawBat(e,now);break;
    case 'skel':drawSkel(e,now);break;
    case 'brute':drawBrute(e,now);break;
    case 'wraith':drawWraith(e,now);break;
    case 'king':drawKing(e,now);break;
  }
}
function drawItem(it,now){
  const t=now/1000,x=(it.x+0.5)*TS,y=(it.y+0.5)*TS;
  const bob=Math.sin(t*2.2+it.x*1.7+it.y)*2;
  ctx.save();ctx.translate(x,y+bob*0.6);
  // ground halo
  const halo=ctx.createRadialGradient(0,8,1,0,8,14);
  halo.addColorStop(0,it.kind==='crown'?'rgba(255,214,110,0.4)':'rgba(240,179,76,0.16)');
  halo.addColorStop(1,'rgba(240,179,76,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.ellipse(0,9,14,6,0,0,6.28);ctx.fill();
  if(it.kind==='potion'){
    ctx.fillStyle='#2a2d3a';ctx.fillRect(-1.6,-9,3.2,3);
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fillRect(-3.6,-6.4,7.2,1.6);
    const g=ctx.createLinearGradient(0,-5,0,7);
    g.addColorStop(0,'#e5666b');g.addColorStop(1,'#8c222b');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(-2.6,-6);ctx.lineTo(2.6,-6);ctx.lineTo(5,1);ctx.quadraticCurveTo(5,7,0,7);
    ctx.quadraticCurveTo(-5,7,-5,1);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.ellipse(-1.8,0,1.1,2.4,0,0,6.28);ctx.fill();
  }else if(it.kind==='gold'){
    ctx.fillStyle='#b28a2e';
    [[-4,6],[3.4,6.4],[0,3.4]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],4.4,2.6,0,0,6.28);ctx.fill();});
    ctx.fillStyle='#ffd66e';
    [[-4,4.6],[3.4,5],[0,2]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],4.4,2.6,0,0,6.28);ctx.fill();});
    ctx.fillStyle='#fff3c0';ctx.beginPath();ctx.ellipse(-1.4,0.8,1,1.8,0,0,6.28);ctx.fill();
  }else if(it.kind==='sword'){
    ctx.rotate(-0.7);
    ctx.fillStyle='#cfd8ff';ctx.beginPath();ctx.moveTo(-1.8,-9);ctx.lineTo(1.8,-9);ctx.lineTo(1.2,5);ctx.lineTo(-1.2,5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a6d4a';ctx.fillRect(-4,5,8,2);ctx.fillStyle='#5d4a3a';ctx.fillRect(-1.2,7,2.4,5);
    ctx.fillStyle='#fff';ctx.fillRect(-0.5,-8,1,10);
  }else if(it.kind==='armor'){
    const g=ctx.createLinearGradient(0,-8,0,8);
    g.addColorStop(0,'#9aa6c4');g.addColorStop(1,'#4a5570');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,-5.4);ctx.lineTo(7,0);
    ctx.quadraticCurveTo(7,6,0,8.4);ctx.quadraticCurveTo(-7,6,-7,0);ctx.lineTo(-7,-5.4);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#22303f';ctx.lineWidth=1.3;ctx.stroke();
    ctx.strokeStyle='#c9a964';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,8.4);ctx.stroke();
  }else if(it.kind==='scroll'){
    ctx.rotate(0.2);
    ctx.fillStyle='#d8cba1';ctx.fillRect(-6,-7,12,14);
    ctx.fillStyle='#b7a97e';ctx.fillRect(-6,-8,12,2);ctx.fillRect(-6,6,12,2);
    ctx.strokeStyle='#7a6c48';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-3.6,-3);ctx.lineTo(3.6,-3);ctx.moveTo(-3.6,0);ctx.lineTo(3.6,0);ctx.moveTo(-3.6,3);ctx.lineTo(3.6,3);ctx.stroke();
    ctx.fillStyle='#c9552e';ctx.fillRect(-1.4,-9,2.8,2);
  }else if(it.kind==='crown'){
    ctx.rotate(Math.sin(t*0.8)*0.06);
    const rg=ctx.createRadialGradient(0,0,2,0,0,24);
    rg.addColorStop(0,'rgba(255,214,110,0.5)');rg.addColorStop(1,'rgba(255,214,110,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,24,0,6.28);ctx.fill();
    ctx.fillStyle='#ffd66e';
    ctx.beginPath();ctx.moveTo(-9,5);ctx.lineTo(-8,-6);ctx.lineTo(-4,-1);ctx.lineTo(0,-8);
    ctx.lineTo(4,-1);ctx.lineTo(8,-6);ctx.lineTo(9,5);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#b28a2e';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#e5384f';
    ctx.beginPath();ctx.arc(0,2.4,1.6,0,6.28);ctx.fill();
    ctx.fillStyle='#58c0d8';ctx.beginPath();ctx.arc(-5.4,2.4,1.1,0,6.28);ctx.arc(5.4,2.4,1.1,0,6.28);ctx.fill();
    // rotating rays
    ctx.rotate(t*0.5);ctx.strokeStyle='rgba(255,214,110,0.35)';ctx.lineWidth=1.4;
    for(let i=0;i<6;i++){ctx.rotate(6.28/6);ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(19,0);ctx.stroke();}
    if(Math.random()<0.3)spawnP({x:x+(Math.random()-0.5)*20,y:y+(Math.random()-0.5)*8,vx:0,vy:-18,life:0.8,size:1.4,col:'#ffd66e',add:true});
  }
  ctx.restore();
}

/* ---------------- render ---------------- */
function render(now){
  const cw=view.w,ch=view.h,t=now/1000;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,cw,ch);
  if(!bakeCv)return;
  const shx=(Math.random()*2-1)*G.shake,shy=(Math.random()*2-1)*G.shake;
  const camX=G.cam.x+shx,camY=G.cam.y+shy;

  ctx.save();ctx.translate(-camX,-camY);
  ctx.drawImage(bakeCv,0,0);

  const titleMode=G.state==='title';
  const x0=Math.max(0,Math.floor(camX/TS)-1),y0=Math.max(0,Math.floor(camY/TS)-1);
  const x1=Math.min(W-1,Math.ceil((camX+cw)/TS)+1),y1=Math.min(H-1,Math.ceil((camY+ch)/TS)+1);

  // items
  for(const it of items){
    if(it.taken)continue;
    const i=idx(it.x,it.y);
    if(!exp[i])continue;
    if(it.kind!=='crown'&&!vis[i])continue;
    drawItem(it,now);
  }
  // stairs shimmer
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(map[y*W+x]===T.STAIRS&&vis[y*W+x]){
      const pu=0.5+0.5*Math.sin(t*2.4);
      ctx.strokeStyle=`rgba(240,179,76,${(0.25+pu*0.3).toFixed(2)})`;
      ctx.lineWidth=1.6;
      ctx.strokeRect(x*TS+3+pu*2,y*TS+3+pu*2,TS-6-pu*4,TS-6-pu*4);
      if(Math.random()<0.08)spawnP({x:x*TS+TS/2+(Math.random()-0.5)*16,y:y*TS+TS/2,vx:0,vy:-14,life:0.9,size:1.2,col:'#ffd98a',add:true});
    }
  }
  // entities
  const drawList=[...entities].filter(e=>!e.dead&&vis[idx(e.x,e.y)]).sort((a,b)=>a.py-b.py);
  if(!titleMode&&P)drawList.push(P);
  drawList.sort((a,b)=>a.py-b.py);
  for(const e of drawList){
    if(e===P)drawPlayer(now);else drawEntity(e,now);
  }
  // dark (non-additive) particles
  for(const p of parts)if(!p.add){
    ctx.globalAlpha=clamp(p.life/p.tl,0,1);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  /* --- darkness overlay --- */
  ctx.save();ctx.translate(-camX,-camY);
  const flick=0.92+0.08*Math.sin(t*8.7)+0.04*Math.sin(t*23.3);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*W+x;
    let alpha;
    if(titleMode)alpha=0.72+0.05*Math.sin(t*0.7+x*0.3+y*0.2);
    else if(vis[i]){
      const d=Math.sqrt(dist2(x,y,P.x,P.y));
      let b=clamp(1.12-d/(8.4*flick),0,1);
      for(const tc of torches){
        const dt2=dist2(x,y,tc.x,tc.y);
        if(dt2<30){const bt=clamp(1.1-Math.sqrt(dt2)/4.8,0,1);if(bt>b)b=bt;}
      }
      b=Math.min(1,b+0.06);
      alpha=(1-b)*0.93;
    }else alpha=exp[i]?0.82:1;
    if(alpha>0.01){
      ctx.fillStyle=`rgba(4,6,12,${alpha.toFixed(3)})`;
      ctx.fillRect(x*TS,y*TS,TS+1,TS+1);
    }
  }

  /* --- warm additive light --- */
  ctx.globalCompositeOperation='lighter';
  if(!titleMode&&P&&!P.dead){
    const gx=(P.px+0.5)*TS,gy=(P.py+0.5)*TS;
    const rr=TS*6.2*flick;
    const g=ctx.createRadialGradient(gx,gy,4,gx,gy,rr);
    g.addColorStop(0,'rgba(255,190,110,0.26)');
    g.addColorStop(0.5,'rgba(255,150,70,0.11)');
    g.addColorStop(1,'rgba(255,120,50,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx,gy,rr,0,6.28);ctx.fill();
  }
  for(const tc of torches){
    if(tc.x<x0-4||tc.x>x1+4||tc.y<y0-4||tc.y>y1+4)continue;
    const tf=0.8+0.2*Math.sin(t*7.3+tc.ph)+0.08*Math.sin(t*19+tc.ph*2);
    const gx=tc.x*TS+TS/2,gy=tc.y*TS+9;
    const rr=TS*4.4*tf;
    const g=ctx.createRadialGradient(gx,gy,2,gx,gy,rr);
    g.addColorStop(0,'rgba(255,190,110,0.34)');
    g.addColorStop(0.45,'rgba(255,140,60,0.14)');
    g.addColorStop(1,'rgba(255,110,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx,gy,rr,0,6.28);ctx.fill();
    // flame body
    const fh=6+2.4*tf;
    ctx.fillStyle='rgba(255,110,40,0.55)';
    ctx.beginPath();ctx.ellipse(gx,gy-2,3.2,fh*0.55,0,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,180,70,0.75)';
    ctx.beginPath();ctx.ellipse(gx,gy-1,2,fh*0.36,0,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,240,180,0.85)';
    ctx.beginPath();ctx.ellipse(gx,gy,1,fh*0.18,0,0,6.28);ctx.fill();
  }
  // crown beacon
  for(const it of items){
    if(it.taken||it.kind!=='crown')continue;
    const gx=(it.x+0.5)*TS,gy=(it.y+0.5)*TS;
    const pu=0.7+0.3*Math.sin(t*3);
    const rr=TS*3.4*pu;
    const g=ctx.createRadialGradient(gx,gy,2,gx,gy,rr);
    g.addColorStop(0,'rgba(255,214,110,0.4)');g.addColorStop(1,'rgba(255,214,110,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx,gy,rr,0,6.28);ctx.fill();
  }
  // additive particles
  for(const p of parts)if(p.add){
    ctx.globalAlpha=clamp(p.life/p.tl,0,1);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;

  /* --- enemy hp bars + sleep marks (readable, above darkness) --- */
  if(!titleMode){
    ctx.globalCompositeOperation='source-over';
    for(const e of entities){
      if(e.dead||!vis[idx(e.x,e.y)])continue;
      const gx=(e.px+0.5)*TS,gy=(e.py)*TS;
      if(e.hp<e.maxhp){
        const w=e.boss?36:24;
        ctx.fillStyle='rgba(6,8,12,0.8)';ctx.fillRect(gx-w/2,gy-4,w,4);
        const hpF=clamp(e.hp/e.maxhp,0,1);
        ctx.fillStyle=e.boss?'#ff9a3d':'#d8494f';
        ctx.fillRect(gx-w/2+0.5,gy-3.5,(w-1)*hpF,3);
      }
      if(!e.awake){
        ctx.globalAlpha=0.35+0.3*Math.sin(t*2+e.ph);
        ctx.fillStyle='#c8bd9e';ctx.font='700 11px Cinzel, serif';ctx.textAlign='center';
        ctx.fillText('z',gx+11,gy-8);
        ctx.globalAlpha=1;
      }
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.restore();

  /* --- screen space --- */
  const vg=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.34,cw/2,ch/2,Math.max(cw,ch)*0.74);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,3,6,0.58)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,cw,ch);

  if(!titleMode&&P&&!P.dead&&P.hp/P.maxhp<0.3&&G.state==='play'){
    const pu=0.5+0.5*Math.sin(t*4);
    const hg=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.3,cw/2,ch/2,Math.max(cw,ch)*0.7);
    hg.addColorStop(0,'rgba(160,20,30,0)');hg.addColorStop(1,`rgba(160,20,30,${(0.12+pu*0.16).toFixed(2)})`);
    ctx.fillStyle=hg;ctx.fillRect(0,0,cw,ch);
  }
  if(G.hurtF>0.01){
    const hg=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.2,cw/2,ch/2,Math.max(cw,ch)*0.7);
    hg.addColorStop(0,'rgba(180,20,30,0)');hg.addColorStop(1,`rgba(180,20,30,${(G.hurtF*0.5).toFixed(2)})`);
    ctx.fillStyle=hg;ctx.fillRect(0,0,cw,ch);
  }
  if(G.warmF>0.01){
    ctx.fillStyle=`rgba(255,140,50,${(G.warmF*0.2).toFixed(2)})`;ctx.fillRect(0,0,cw,ch);
  }

  /* --- floaters --- */
  ctx.textAlign='center';
  for(const f of floaters){
    const sx=f.x-camX,sy=f.y-camY;
    const a=clamp(f.life/f.tl*1.8,0,1);
    ctx.globalAlpha=a;
    ctx.font=`700 ${Math.round(15*f.scale)}px Cinzel, serif`;
    ctx.strokeStyle='rgba(0,0,0,0.8)';ctx.lineWidth=3;ctx.strokeText(f.txt,sx,sy);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,sx,sy);
  }
  ctx.globalAlpha=1;

  if(G.veil>0.004){
    ctx.fillStyle=`rgba(3,4,8,${G.veil.toFixed(3)})`;
    ctx.fillRect(0,0,cw,ch);
  }

  if(G.state!=='title'&&P)renderMinimap(now);
}

function renderMinimap(now){
  if(mm.width!==W*3){mm.width=W*3;mm.height=H*3;}
  mmx.fillStyle='#0a0c13';mmx.fillRect(0,0,mm.width,mm.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;
    if(!exp[i])continue;
    const t=map[i];
    mmx.fillStyle=t===T.WALL?'#1c2030':t===T.STAIRS?'#f0b34c':'#454b5f';
    mmx.fillRect(x*3,y*3,3,3);
  }
  for(const it of items){
    if(it.taken)continue;
    const i=idx(it.x,it.y);
    if(!exp[i])continue;
    mmx.fillStyle=it.kind==='potion'?'#e06a6a':it.kind==='gold'?'#ffd66e':it.kind==='crown'?'#fff3c0':it.kind==='scroll'?'#d8cba1':'#9aa6c4';
    mmx.fillRect(it.x*3,it.y*3,2,2);
  }
  const blink=0.5+0.5*Math.sin(now/300);
  for(const e of entities){
    if(e.dead||!vis[idx(e.x,e.y)])continue;
    mmx.fillStyle=e.boss?`rgba(255,120,50,${0.5+blink*0.5})`:'#ff5a5a';
    mmx.fillRect(e.x*3-1,e.y*3-1,e.boss?5:3,e.boss?5:3);
  }
  mmx.fillStyle=`rgba(120,225,255,${0.6+blink*0.4})`;
  mmx.beginPath();mmx.arc(P.x*3+1.5,P.y*3+1.5,2.6,0,6.28);mmx.fill();
}

/* ---------------- boot & loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt,now);
  render(now);
  requestAnimationFrame(frame);
}
resize();
P=freshPlayer();
genLevel(1);
exp.fill(1); // attract mode: the whole floor, dimly remembered
snapCam();
showTitle();
requestAnimationFrame(frame);
</script>
