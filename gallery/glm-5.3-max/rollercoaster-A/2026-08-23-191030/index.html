<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Skyloop — First-Person Rollercoaster</title>
<style>
  :root { --ink:#eaf2fb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b1220;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  canvas { display:block; }

  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(4,8,18,.34) 100%); }

  #progress { position:fixed; top:0; left:0; right:0; height:3px; z-index:6; background:rgba(255,255,255,.12); }
  #progress i { display:block; height:100%; width:0%;
    background: linear-gradient(90deg, #ffd166, #ef4f3f); }

  .card { position:fixed; z-index:5; color:var(--ink); pointer-events:none;
    background: rgba(8,14,26,.55); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:12px 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  #title { top:14px; left:16px; }
  #title h1 { margin:0; font-size:20px; letter-spacing:.35em; font-weight:800;
    background: linear-gradient(90deg,#ffd166,#ff8f6b 55%,#8fd3ff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #title p { margin:3px 0 0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.72; }

  #viewBadge { position:fixed; top:14px; right:16px; z-index:5; pointer-events:none; color:var(--ink);
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    background: rgba(8,14,26,.45); border:1px solid rgba(255,255,255,.14);
    border-radius:999px; padding:6px 14px; }

  #stats { left:16px; bottom:16px; min-width:210px; }
  #stats .speed { display:flex; align-items:baseline; gap:8px; }
  #stats .speed b { font-size:46px; font-weight:750; font-variant-numeric: tabular-nums; line-height:1; }
  #stats .speed span { font-size:12px; opacity:.7; letter-spacing:.12em; }
  #stats .meta { display:flex; gap:16px; margin-top:8px; font-size:12px; opacity:.92; }
  #stats .meta b { font-variant-numeric: tabular-nums; }

  #controls { right:16px; bottom:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:340px; }
  #controls button { pointer-events:auto; cursor:pointer; color:var(--ink);
    background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    border-radius:9px; padding:7px 12px; font: inherit; font-size:13px; font-weight:600; }
  #controls button:hover { background: rgba(255,255,255,.18); }
  #controls #mult { min-width:46px; text-align:center; font-size:13px; font-variant-numeric:tabular-nums; }
  #controls .hint { flex-basis:100%; margin:6px 0 0; font-size:11px; opacity:.66; }
  kbd { border:1px solid rgba(255,255,255,.25); border-bottom-width:2px; border-radius:4px; padding:0 4px; font-size:10px; }

  #pausedOverlay { position:fixed; inset:0; z-index:7; display:none; place-items:center; text-align:center;
    color:#fff; background: rgba(6,10,20,.45); backdrop-filter: blur(3px); }
  #pausedOverlay.show { display:grid; }
  #pausedOverlay b { font-size:42px; letter-spacing:.3em; }
  #pausedOverlay small { display:block; margin-top:8px; opacity:.7; letter-spacing:.15em; }

  body.hud-hidden .card, body.hud-hidden #viewBadge, body.hud-hidden #progress { display:none; }

  #boot, #fallback { position:fixed; inset:0; z-index:9; display:grid; place-items:center;
    color:#dfe9f5; background:#0e1626; text-align:center; }
  #fallback { display:none; }
  #fallback small { opacity:.7; }
</style>
</head>
<body>

<div id="progress"><i id="progFill"></i></div>
<div id="vignette"></div>

<header id="title" class="card">
  <h1>SKYLOOP</h1>
  <p>first-person coaster · endless ride</p>
</header>

<div id="viewBadge">Rider cam</div>

<section id="stats" class="card">
  <div class="speed"><b id="spd">0</b><span>km/h</span></div>
  <div class="meta">
    <span>height <b id="alt">6</b> m</span>
    <span>lap <b id="lap">1</b></span>
  </div>
</section>

<section id="controls" class="card">
  <button id="btnPause" title="Pause or resume (Space)">Pause</button>
  <button id="btnSlow" aria-label="Slower" title="Slower (Arrow Down)">−</button>
  <b id="mult">1.0×</b>
  <button id="btnFast" aria-label="Faster" title="Faster (Arrow Up)">+</button>
  <button id="btnView" title="Change camera (V)">View</button>
  <p class="hint"><kbd>Space</kbd> pause · <kbd>↑</kbd><kbd>↓</kbd> speed · <kbd>V</kbd> camera · <kbd>H</kbd> hud</p>
</section>

<div id="pausedOverlay"><div><b>PAUSED</b><small>press Space to resume</small></div></div>
<div id="boot"><div>building the track…</div></div>
<div id="fallback"><div><b>Could not start</b><p>this page needs WebGL and network access to load three.js</p></div></div>

<script>
  window.addEventListener('error', function (e) {
    if (window.__skyloopBooted) return;
    var f = document.getElementById('fallback');
    if (f) {
      var p = f.querySelector('p');
      if (p && e && e.message) p.textContent = String(e.message);
      f.style.display = 'grid';
    }
    var b = document.getElementById('boot');
    if (b) b.remove();
  }, true);
  setTimeout(function () {
    if (!window.__skyloopBooted) {
      var b = document.getElementById('boot');
      if (b) b.remove();
      document.getElementById('fallback').style.display = 'grid';
    }
  }, 12000);
</script>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================== helpers & constants ============================== */
const G = 9.81;          // gravity, m/s^2
const EFF = 0.85;        // energy efficiency (friction losses)
const V_MIN = 6;         // minimum speed at the crest, m/s
const UP = new THREE.Vector3(0, 1, 0);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = THREE.MathUtils.lerp;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const rand = (a, b) => a + Math.random() * (b - a);

/* ============================== renderer / scene ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcadff2, 160, 1050);

const camera = new THREE.PerspectiveCamera(74, window.innerWidth / window.innerHeight, 0.1, 3200);

/* sky dome — vertical gradient */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x3d80d8) },
      mid: { value: new THREE.Color(0x9cc6ee) },
      bot: { value: new THREE.Color(0xe9f4fb) }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;',
      'void main(){',
      '  float h = normalize(vP).y;',
      '  vec3 c = h > 0.0 ? mix(mid, top, pow(min(h * 1.4, 1.0), 0.75)) : mix(mid, bot, min(-h * 3.0, 1.0));',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  })
);
scene.add(sky);

/* lights */
scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x6a8f5a, 0.85));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.3);
sun.position.set(190, 330, 130);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 40;
sun.shadow.camera.far = 800;
sun.shadow.camera.left = -210; sun.shadow.camera.right = 210;
sun.shadow.camera.top = 210; sun.shadow.camera.bottom = -210;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.4;
sun.target.position.set(30, 0, -20);
scene.add(sun); scene.add(sun.target);

/* visible sun disc */
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, 'rgba(255,253,244,1)');
  g.addColorStop(0.25, 'rgba(255,238,190,0.9)');
  g.addColorStop(0.55, 'rgba(255,205,120,0.32)');
  g.addColorStop(1.00, 'rgba(255,190,110,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, fog: false, toneMapped: false
  }));
  spr.position.copy(V3(190, 330, 130).normalize().multiplyScalar(1350));
  spr.scale.set(260, 260, 1);
  scene.add(spr);
}

/* ============================== track curve ============================== */
/* closed circuit: station straight, chain lift, big first drop, banked far turn,
   airtime hill, low valley, s-curves and the return brake run */
const CTRL = [
  [  0,  6,  92], [  0,  6,  52], [  3, 13,  18], [  6, 30, -16], [  9, 45, -52],
  [ 11, 50, -86], [ 14, 48,-112], [ 24, 32,-142], [ 42,  9,-160], [ 68,  8,-150],
  [ 92, 12,-130], [104, 17,-100], [103, 21, -66], [ 88, 28, -40], [ 70, 35, -18],
  [ 60, 18,  10], [ 63,  8,  40], [ 76, 13,  68], [ 66, 21,  90], [ 38, 12, 102],
  [ 12,  8, 100]
].map(a => V3(a[0], a[1], a[2]));

const curve = new THREE.CatmullRomCurve3(CTRL, true, 'centripetal', 0.5);
curve.arcLengthDivisions = 2400;
const trackLen = curve.getLength();

/* ============================== sample the track ============================== */
const N = 1600;
const P = new Array(N), Tn = new Array(N);
const vArr = new Float32Array(N), yArr = new Float32Array(N);
let H = 0, iMax = 0;

for (let i = 0; i < N; i++) {
  const u = i / N;
  P[i] = curve.getPointAt(u);
  Tn[i] = curve.getTangentAt(u).normalize();
  yArr[i] = P[i].y;
  if (P[i].y > H) { H = P[i].y; iMax = i; }
}

/* speed profile — position-only energy model (continuous across laps)
   plus station brakes and a slow chain lift up to the crest */
const uCrest = iMax / N;
function capAt(u) {
  if (u < 0.045) return 8.5;                                            // station
  if (u < 0.10)  return lerp(8.5, 7.0, (u - 0.045) / 0.055);            // release
  if (u < uCrest - 0.015) return 6.8;                                   // chain lift
  if (u < uCrest + 0.09) return lerp(6.8, 60, (u - (uCrest - 0.015)) / 0.105); // drop
  if (u > 0.985) return 8.5;                                            // station entry
  if (u > 0.90)  return lerp(60, 9.5, (u - 0.90) / 0.085);              // final brakes
  return 999;
}
for (let i = 0; i < N; i++) {
  const vEnergy = Math.sqrt(V_MIN * V_MIN + 2 * G * EFF * Math.max(0, H - yArr[i]));
  vArr[i] = Math.min(vEnergy, capAt(i / N));
}

/* ============================== banking ============================== */
const bank = new Float32Array(N);
{
  const ds = trackLen / N;
  const dT = new THREE.Vector3(), right = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const prev = (i - 1 + N) % N, next = (i + 1) % N;
    dT.subVectors(Tn[next], Tn[prev]).divideScalar(2 * ds);
    right.crossVectors(Tn[i], UP);
    if (right.lengthSq() < 1e-8) right.set(1, 0, 0);
    right.normalize();
    const kappa = dT.dot(right);                       // signed curvature
    const horiz = Math.hypot(Tn[i].x, Tn[i].z);        // fade banking on steep drops
    const w = clamp((horiz - 0.35) / 0.4, 0, 1);
    bank[i] = clamp(Math.atan2(vArr[i] * vArr[i] * kappa, G), -0.62, 0.62) * w;
  }
  /* wrap-aware smoothing */
  const tmp = new Float32Array(N), R = 10;
  for (let pass = 0; pass < 6; pass++) {
    for (let i = 0; i < N; i++) {
      let s = 0;
      for (let k = -R; k <= R; k++) s += bank[(i + k + N) % N];
      tmp[i] = s / (2 * R + 1);
    }
    bank.set(tmp);
  }
}

/* banked frames: right = T x up, up = right x T, then roll around T */
const UpB = new Array(N), RtB = new Array(N);
for (let i = 0; i < N; i++) {
  const r = new THREE.Vector3().crossVectors(Tn[i], UP).normalize();
  const u0 = new THREE.Vector3().crossVectors(r, Tn[i]).normalize();
  const c = Math.cos(bank[i]), s = Math.sin(bank[i]);
  UpB[i] = u0.clone().multiplyScalar(c).addScaledVector(r, s).normalize();
  RtB[i] = r.clone().multiplyScalar(c).addScaledVector(u0, -s).normalize();
}

/* interpolated frame lookup at arc-length fraction u */
function frameAt(uu, F) {
  let u = uu % 1; if (u < 0) u += 1;
  const f = u * N;
  const i0 = Math.floor(f) % N, i1 = (i0 + 1) % N, t = f - Math.floor(f);
  F.p.lerpVectors(P[i0], P[i1], t);
  F.t.lerpVectors(Tn[i0], Tn[i1], t).normalize();
  F.u.lerpVectors(UpB[i0], UpB[i1], t).normalize();
  F.r.crossVectors(F.t, F.u).normalize();
  F.u.crossVectors(F.r, F.t).normalize();
}
function makeFrame() {
  return { p: new THREE.Vector3(), t: new THREE.Vector3(), u: new THREE.Vector3(), r: new THREE.Vector3() };
}
function speedAt(uu) {
  let u = uu % 1; if (u < 0) u += 1;
  const f = u * N;
  const i0 = Math.floor(f) % N, i1 = (i0 + 1) % N, t = f - Math.floor(f);
  return lerp(vArr[i0], vArr[i1], t);
}

/* ============================== track meshes ============================== */
const trackGroup = new THREE.Group();
scene.add(trackGroup);

const railMat   = new THREE.MeshStandardMaterial({ color: 0xd8453a, metalness: 0.6,  roughness: 0.32 });
const spineMat  = new THREE.MeshStandardMaterial({ color: 0xeef1f4, metalness: 0.25, roughness: 0.5 });
const tieMat    = new THREE.MeshStandardMaterial({ color: 0x2c3138, roughness: 0.85 });
const supportMat= new THREE.MeshStandardMaterial({ color: 0xb7bec8, metalness: 0.35, roughness: 0.55 });

/* build an offset tube (rail / spine) following the banked frame */
function tubeWith(mat, offR, offU, radius, tubularSegments) {
  const pts = [];
  const tmp = new THREE.Vector3();
  for (let i = 0; i < N; i += 4) {
    tmp.copy(P[i]).addScaledVector(RtB[i], offR).addScaledVector(UpB[i], offU);
    pts.push(tmp.clone());
  }
  const c = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(c, tubularSegments, radius, 10, true), mat);
  mesh.castShadow = true;
  trackGroup.add(mesh);
  return mesh;
}
tubeWith(railMat,  0.55, 0.24, 0.075, 1400);   // left rail
tubeWith(railMat, -0.55, 0.24, 0.075, 1400);   // right rail
tubeWith(spineMat, 0.0, -0.18, 0.13, 1200);    // spine

/* ties (sleepers) */
{
  const count = Math.max(2, Math.round(trackLen / 1.7));
  const geo = new THREE.BoxGeometry(1.55, 0.14, 0.4);
  const ties = new THREE.InstancedMesh(geo, tieMat, count);
  const m = new THREE.Matrix4(), pos = new THREE.Vector3(), negR = new THREE.Vector3();
  for (let j = 0; j < count; j++) {
    const i = Math.floor(j * N / count) % N;
    negR.copy(RtB[i]).negate();
    pos.copy(P[i]).addScaledVector(UpB[i], 0.10);
    m.makeBasis(negR, UpB[i], Tn[i]).setPosition(pos);
    ties.setMatrixAt(j, m);
  }
  ties.castShadow = true;
  trackGroup.add(ties);
}

/* support columns down to the ground */
{
  const list = [];
  const top = new THREE.Vector3(), ground = new THREE.Vector3(), dir = new THREE.Vector3(), q = new THREE.Quaternion();
  const step = Math.max(1, Math.round(12.5 / (trackLen / N)));
  for (let i = 0; i < N; i += step) {
    top.copy(P[i]).addScaledVector(UpB[i], -0.34);
    if (top.y < 2.6) continue;
    ground.set(top.x, 0, top.z);
    dir.subVectors(top, ground);
    const len = dir.length();
    q.setFromUnitVectors(UP, dir.normalize());
    list.push({ mid: ground.clone().addScaledVector(dir, len / 2), q, len });
  }
  const geo = new THREE.CylinderGeometry(0.24, 0.28, 1, 10);
  const sup = new THREE.InstancedMesh(geo, supportMat, list.length);
  const m = new THREE.Matrix4(), sc = new THREE.Vector3();
  for (let k = 0; k < list.length; k++) {
    sc.set(1, list[k].len, 1);
    m.compose(list[k].mid, list[k].q, sc);
    sup.setMatrixAt(k, m);
  }
  sup.castShadow = true;
  trackGroup.add(sup);
}

/* ============================== environment ============================== */
/* ground */
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#68a957'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    const g = Math.random();
    ctx.fillStyle = g < 0.5
      ? 'rgba(52,110,44,0.10)'
      : (g < 0.85 ? 'rgba(126,190,96,0.10)' : 'rgba(150,170,80,0.07)');
    ctx.beginPath();
    ctx.ellipse(Math.random() * 256, Math.random() * 256, rand(2, 14), rand(2, 14), Math.random() * 3.14, 0, 6.29);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(46, 46);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(1250, 64),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}

/* flat 2D track points, used to keep trees off the circuit */
const trackPts2 = [];
for (let i = 0; i < N; i += 16) trackPts2.push([P[i].x, P[i].z]);

/* trees */
{
  const COUNT = 260;
  const trunkGeo = new THREE.CylinderGeometry(0.28, 0.42, 2.4, 6);
  const leafGeo = new THREE.ConeGeometry(2.6, 7, 7);
  const trunk = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ roughness: 1 }), COUNT);
  const leaf = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.95 }), COUNT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3();
  const col = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < COUNT && guard++ < 6000) {
    const r = Math.sqrt(lerp(30 * 30, 330 * 330, Math.random()));
    const a = Math.random() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    let ok = true;
    for (let k = 0; k < trackPts2.length; k++) {
      const dx = x - trackPts2[k][0], dz = z - trackPts2[k][1];
      if (dx * dx + dz * dz < 15 * 15) { ok = false; break; }
    }
    if ((x + 150) * (x + 150) + (z + 40) * (z + 40) < 48 * 48) ok = false; // ferris wheel area
    if (!ok) continue;
    const s = rand(0.75, 1.65);
    q.setFromAxisAngle(UP, Math.random() * Math.PI * 2);
    sc.set(s, s, s);
    pos.set(x, 1.2 * s, z);
    m.compose(pos, q, sc); trunk.setMatrixAt(placed, m);
    trunk.setColorAt(placed, col.setHSL(0.07, 0.35, rand(0.22, 0.3)));
    pos.set(x, (2.4 + 3.5) * s, z);
    m.compose(pos, q, sc); leaf.setMatrixAt(placed, m);
    leaf.setColorAt(placed, col.setHSL(rand(0.24, 0.34), rand(0.38, 0.55), rand(0.26, 0.38)));
    placed++;
  }
  trunk.count = leaf.count = placed;
  trunk.castShadow = leaf.castShadow = true;
  if (trunk.instanceColor) trunk.instanceColor.needsUpdate = true;
  if (leaf.instanceColor) leaf.instanceColor.needsUpdate = true;
  scene.add(trunk, leaf);
}

/* distant mountains */
{
  const mat = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 1 });
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + rand(-0.12, 0.12);
    const rad = rand(720, 940);
    const h = rand(130, 300);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(h * rand(0.9, 1.5), h, 5 + (i % 3)), mat.clone());
    cone.material.color.setHSL(0.58, rand(0.10, 0.16), rand(0.52, 0.64));
    cone.position.set(Math.cos(a) * rad, h / 2 - 8, Math.sin(a) * rad);
    cone.rotation.y = Math.random() * Math.PI;
    scene.add(cone);
  }
}

/* drifting clouds */
const clouds = { mesh: null, data: [] };
{
  const COUNT = 26;
  clouds.mesh = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.88, fog: false }),
    COUNT
  );
  for (let i = 0; i < COUNT; i++) {
    clouds.data.push({
      x: rand(-850, 850), z: rand(-850, 850), y: rand(130, 230),
      sx: rand(18, 42), sy: rand(6, 10), sz: rand(12, 24), sp: rand(1.5, 4)
    });
  }
  scene.add(clouds.mesh);
}
function updateClouds(t) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3();
  for (let i = 0; i < clouds.data.length; i++) {
    const d = clouds.data[i];
    let x = d.x + t * d.sp;
    x = ((x + 850) % 1700) - 850;
    pos.set(x, d.y, d.z); sc.set(d.sx, d.sy, d.sz);
    m.compose(pos, q, sc);
    clouds.mesh.setMatrixAt(i, m);
  }
  clouds.mesh.instanceMatrix.needsUpdate = true;
}

/* ferris wheel */
const wheel = { spin: null, cabins: [] };
{
  const fw = new THREE.Group();
  fw.position.set(-150, 0, -40);
  fw.rotation.y = 0.55;
  const red = new THREE.MeshStandardMaterial({ color: 0xd8453a, roughness: 0.5, metalness: 0.3 });
  const white = new THREE.MeshStandardMaterial({ color: 0xf0f3f6, roughness: 0.5 });
  function strut(a, b, radius, mat) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const s = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 8), mat);
    s.position.copy(a).addScaledVector(dir, 0.5);
    s.quaternion.setFromUnitVectors(UP, dir.normalize());
    s.castShadow = true;
    fw.add(s);
    return s;
  }
  const spin = new THREE.Group();
  spin.position.y = 34;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(28, 0.8, 8, 48), red);
  rim.castShadow = true;
  spin.add(rim);
  const spokeGeo = new THREE.CylinderGeometry(0.22, 0.22, 28, 6);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const sp = new THREE.Mesh(spokeGeo, white);
    sp.position.set(Math.cos(a) * 14, Math.sin(a) * 14, 0);
    sp.rotation.z = a - Math.PI / 2;
    spin.add(sp);
  }
  const cabinCols = [0xef4f3f, 0xf4b942, 0x3fa7d6, 0x7bc950];
  const cabinGeo = new THREE.BoxGeometry(2.4, 2.2, 1.8);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const pivot = new THREE.Group();
    pivot.position.set(Math.cos(a) * 28, Math.sin(a) * 28, 0);
    const cab = new THREE.Mesh(cabinGeo, new THREE.MeshStandardMaterial({ color: cabinCols[i % 4], roughness: 0.6 }));
    cab.position.y = -1.7;
    cab.castShadow = true;
    pivot.add(cab);
    spin.add(pivot);
    wheel.cabins.push(pivot);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 6, 12), white);
  hub.rotation.x = Math.PI / 2;
  spin.add(hub);
  fw.add(spin);
  wheel.spin = spin;
  /* legs (two A-frames) */
  for (const zs of [-3, 3]) {
    strut(V3(-15, 0, zs), V3(0, 34, zs), 0.5, white);
    strut(V3(15, 0, zs), V3(0, 34, zs), 0.5, white);
  }
  strut(V3(-13, 6, -3), V3(-13, 6, 3), 0.35, red);
  strut(V3(13, 6, -3), V3(13, 6, 3), 0.35, red);
  scene.add(fw);
}

/* station platform with roof and signs */
{
  const F = makeFrame();
  frameAt(0, F);
  const negR = F.r.clone().negate();
  const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(negR, F.u, F.t));
  const st = new THREE.Group();
  st.quaternion.copy(q);

  const platMat = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.8 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0xd8453a, roughness: 0.6 });
  const postMat = new THREE.MeshStandardMaterial({ color: 0xf0f3f6, roughness: 0.5 });

  const plat = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.28, 16), platMat);
  plat.position.set(3.2, -0.02, 0);
  plat.castShadow = plat.receiveShadow = true;
  st.add(plat);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.22, 17), roofMat);
  roof.position.set(3.2, 3.0, 0);
  roof.castShadow = true;
  st.add(roof);

  /* roof posts and legs down to the ground */
  function groundLeg(dx, dz) {
    const worldTop = new THREE.Vector3(dx, -0.1, dz).applyQuaternion(q).add(P[0]);
    const worldBottom = new THREE.Vector3(worldTop.x, 0, worldTop.z);
    const dir = new THREE.Vector3().subVectors(worldTop, worldBottom);
    const len = dir.length();
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, len, 8), postMat);
    leg.position.copy(worldBottom).addScaledVector(dir.normalize(), len / 2);
    leg.quaternion.setFromUnitVectors(UP, dir);
    leg.castShadow = true;
    scene.add(leg);
  }
  for (const dz of [-7.2, 7.2]) {
    for (const dx of [1.2, 5.2]) {
      const g = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.0, 8), postMat);
      g.position.set(dx, 1.5, dz);
      st.add(g);
      groundLeg(dx, dz);
    }
  }

  /* sign with the coaster name */
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#131c2a'; ctx.fillRect(0, 0, 1024, 256);
  ctx.strokeStyle = '#e8edf4'; ctx.lineWidth = 10; ctx.strokeRect(14, 14, 996, 228);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd166';
  ctx.font = '900 118px system-ui, sans-serif';
  ctx.fillText('S K Y L O O P', 512, 108);
  ctx.fillStyle = '#bcd2ea';
  ctx.font = '600 34px system-ui, sans-serif';
  ctx.fillText('FIRST-PERSON COASTER · CONTINUOUS LOOP', 512, 198);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const signMat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
  for (const dz of [-7.4, 7.4]) {
    const s1 = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 2.1), signMat);
    s1.position.set(3.2, 2.15, dz);
    s1.rotation.y = Math.PI;
    st.add(s1);
    const s2 = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 2.1), signMat);
    s2.position.set(3.2, 2.15, dz + 0.03);
    st.add(s2);
  }
  st.position.copy(P[0]);
  scene.add(st);
}

/* ============================== the train ============================== */
const cars = [];
{
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8453a, metalness: 0.35, roughness: 0.4 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xf2f5f8, roughness: 0.5 });
  const chassisMat = new THREE.MeshStandardMaterial({ color: 0x30353c, roughness: 0.7 });
  const seatMat = new THREE.MeshStandardMaterial({ color: 0x232a33, roughness: 0.9 });
  const wheelGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.12, 10);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1c2025, roughness: 0.6 });

  function buildCar(isFront) {
    const g = new THREE.Group();
    const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.35, 2.05), chassisMat);
    chassis.position.y = -0.15;
    g.add(chassis);
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 1.9), bodyMat);
    body.position.y = 0.1;
    g.add(body);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.08, 1.94), trimMat);
    trim.position.y = 0.32;
    g.add(trim);
    for (const sx of [-0.32, 0.32]) {
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.34, 0.5), seatMat);
      seat.position.set(sx, 0.32, -0.35);
      g.add(seat);
    }
    if (isFront) {
      const nose = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.75), bodyMat);
      nose.position.set(0, 0.06, 1.25);
      nose.rotation.x = 0.38;
      g.add(nose);
      const noseTrim = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.09, 0.78), trimMat);
      noseTrim.position.set(0, 0.26, 1.32);
      noseTrim.rotation.x = 0.38;
      g.add(noseTrim);
    }
    for (const sx of [-0.62, 0.62]) for (const sz of [-0.62, 0.62]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(sx, -0.34, sz);
      g.add(w);
    }
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    g.matrixAutoUpdate = false;
    scene.add(g);
    cars.push(g);
  }
  buildCar(true);
  buildCar(false);
  buildCar(false);
}
const CAR_SPACING = 2.35;
const _m4 = new THREE.Matrix4();
const _negR = new THREE.Vector3();
function updateTrain(u) {
  const F = makeFrame();
  for (let k = 0; k < cars.length; k++) {
    frameAt(u - (k * CAR_SPACING) / trackLen, F);
    _negR.copy(F.r).negate();
    _m4.makeBasis(_negR, F.u, F.t).setPosition(F.p.clone().addScaledVector(F.u, 0.62));
    cars[k].matrix.copy(_m4);
  }
}

/* ============================== state, HUD, input ============================== */
const S = { u: 0, lap: 1, mult: 1, paused: false, view: 0, v: 0, orbA: 2.2, fov: 74 };
const VIEW_NAMES = ['Rider cam', 'Chase cam', 'Orbit cam'];

const $ = id => document.getElementById(id);
const spdEl = $('spd'), altEl = $('alt'), lapEl = $('lap'), multEl = $('mult'),
      badgeEl = $('viewBadge'), progEl = $('progFill'), pauseOv = $('pausedOverlay');

function togglePause() {
  S.paused = !S.paused;
  $('btnPause').textContent = S.paused ? 'Resume' : 'Pause';
  pauseOv.classList.toggle('show', S.paused);
}
function setMult(v) {
  S.mult = clamp(v, 0.35, 2.6);
  multEl.textContent = S.mult.toFixed(1) + '×';
}
function cycleView() {
  S.view = (S.view + 1) % 3;
  badgeEl.textContent = VIEW_NAMES[S.view];
}
$('btnPause').addEventListener('click', togglePause);
$('btnSlow').addEventListener('click', () => setMult(S.mult / 1.25));
$('btnFast').addEventListener('click', () => setMult(S.mult * 1.25));
$('btnView').addEventListener('click', cycleView);

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'ArrowUp' || e.code === 'NumpadAdd' || e.code === 'Equal') { e.preventDefault(); setMult(S.mult * 1.25); }
  else if (e.code === 'ArrowDown' || e.code === 'NumpadSubtract' || e.code === 'Minus') { e.preventDefault(); setMult(S.mult / 1.25); }
  else if (e.code === 'KeyV') cycleView();
  else if (e.code === 'KeyH') document.body.classList.toggle('hud-hidden');
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================== camera ============================== */
const A = makeFrame(), B = makeFrame();
const _eye = new THREE.Vector3(), _look = new THREE.Vector3();

function updateCamera(dt, t) {
  frameAt(S.u, A);
  const v = S.v, sn = clamp(v / 28, 0, 1);
  let fovT;

  if (S.view === 0) {            /* rider */
    _eye.copy(A.p).addScaledVector(A.u, 1.18).addScaledVector(A.t, 0.35);
    _eye.addScaledVector(A.r, Math.sin(t * 12.9) * 0.018 * sn);
    _eye.addScaledVector(A.u, Math.sin(t * 15.7) * 0.012 * sn);
    frameAt(S.u + (7 + v * 0.42) / trackLen, B);
    camera.position.copy(_eye);
    camera.up.copy(B.u);
    _look.copy(B.p).addScaledVector(B.u, 1.1);
    camera.lookAt(_look);
    fovT = 73 + 15 * sn;
  } else if (S.view === 1) {     /* chase */
    _eye.copy(A.p).addScaledVector(A.t, -7.5).addScaledVector(A.u, 3.0);
    camera.position.copy(_eye);
    camera.up.copy(A.u);
    _look.copy(A.p).addScaledVector(A.t, 5).addScaledVector(A.u, 0.9);
    camera.lookAt(_look);
    fovT = 60;
  } else {                       /* orbit */
    S.orbA += dt * 0.045;
    _eye.set(
      A.p.x + Math.cos(S.orbA) * 250,
      A.p.y + 105,
      A.p.z + Math.sin(S.orbA) * 250
    );
    camera.position.copy(_eye);
    camera.up.copy(UP);
    _look.copy(A.p).addScaledVector(A.u, 6);
    camera.lookAt(_look);
    fovT = 55;
  }

  S.fov += (fovT - S.fov) * Math.min(1, dt * 2.5);
  if (Math.abs(S.fov - camera.fov) > 0.01) {
    camera.fov = S.fov;
    camera.updateProjectionMatrix();
  }
}

/* ============================== main loop ============================== */
let prev = performance.now();
let booted = false;
const F_lap = makeFrame();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  const t = now / 1000;

  if (!S.paused) {
    const v = speedAt(S.u) * S.mult;
    S.v = v;
    S.u += v * dt / trackLen;
    if (S.u >= 1) {
      S.u -= 1;
      S.lap++;
      lapEl.textContent = S.lap;
    }
    updateTrain(S.u);
  }

  /* ambient life continues even while the coaster is paused */
  updateClouds(t);
  wheel.spin.rotation.z += dt * 0.12;
  for (const cab of wheel.cabins) cab.rotation.z = -wheel.spin.rotation.z;

  updateCamera(dt, t);

  frameAt(S.u, F_lap);
  spdEl.textContent = Math.round(S.v * 3.6);
  altEl.textContent = Math.round(F_lap.p.y);
  progEl.style.width = (S.u * 100).toFixed(2) + '%';

  renderer.render(scene, camera);

  if (!booted) {
    booted = true;
    window.__skyloopBooted = true;
    const b = $('boot');
    if (b) b.remove();
  }
});
</script>
