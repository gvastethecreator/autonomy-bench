<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<meta name="description" content="The page you were looking for could not be found.">
<style>
  :root {
    --bg: #0b0d12;
    --ink: #e8ecf4;
    --muted: #8a93a6;
    --accent: #6ee7b7;
    --accent-2: #818cf8;
    --danger: #f87171;
    --card: #12151d;
    --line: #232838;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient background ------------------------------------------------ */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.22;
    pointer-events: none;
    z-index: 0;
  }
  .glow.a { width: 420px; height: 420px; background: var(--accent-2); top: -120px; left: -120px; }
  .glow.b { width: 380px; height: 380px; background: var(--accent); bottom: -140px; right: -100px; }

  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Card --------------------------------------------------------------- */
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--line);
    background: rgba(18, 21, 29, 0.7);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); }
    50%      { box-shadow: 0 0 0 6px rgba(248,113,113,0); }
  }

  /* The big 404 -------------------------------------------------------- */
  .code {
    font-size: clamp(7rem, 26vw, 13rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin: 1rem 0 0.5rem;
    user-select: none;
    cursor: default;
    background: linear-gradient(180deg, var(--ink) 30%, #4b5265 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
    display: inline-block;
    transition: transform 0.15s ease-out;
  }
  .code::before,
  .code::after {
    content: "404";
    position: absolute;
    inset: 0;
    -webkit-text-fill-color: initial;
    pointer-events: none;
    opacity: 0;
  }
  .code.glitching::before {
    color: var(--accent);
    opacity: 0.85;
    animation: glitch-a 0.3s steps(2) 1;
  }
  .code.glitching::after {
    color: var(--accent-2);
    opacity: 0.85;
    animation: glitch-b 0.3s steps(2) 1;
  }
  @keyframes glitch-a {
    0%   { transform: translate(-6px, 2px); clip-path: inset(10% 0 55% 0); }
    50%  { transform: translate(5px, -3px);  clip-path: inset(60% 0 8% 0); }
    100% { transform: none; clip-path: inset(0 0 0 0); }
  }
  @keyframes glitch-b {
    0%   { transform: translate(6px, -2px);  clip-path: inset(45% 0 30% 0); }
    50%  { transform: translate(-5px, 3px);  clip-path: inset(5% 0 70% 0); }
    100% { transform: none; clip-path: inset(0 0 0 0); }
  }

  h1 {
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: 600;
    margin: 0.5rem 0 0.75rem;
  }

  p.lede {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    max-width: 42ch;
    margin: 0 auto 1.75rem;
  }

  /* Search-ish path display ------------------------------------------- */
  .path-box {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.7rem 1rem;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1.75rem;
    text-align: left;
    overflow: hidden;
  }
  .path-box svg { flex-shrink: 0; color: var(--accent); }
  .path-box .path {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink);
  }
  .path-box .path .scheme { color: var(--muted); }

  /* Actions ------------------------------------------------------------ */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 0.7rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #4fd1a5);
    color: #07130d;
  }
  .btn-primary:hover { box-shadow: 0 6px 24px rgba(110,231,183,0.25); transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }
  .btn-ghost:hover { border-color: #3a4258; background: rgba(255,255,255,0.04); }

  /* Hint / footer ------------------------------------------------------ */
  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.6;
  }
  .hint kbd {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0.1rem 0.4rem;
  }
  .hint a { color: var(--accent-2); text-decoration: none; }
  .hint a:hover { text-decoration: underline; }

  /* Toast --------------------------------------------------------------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 2rem;
    transform: translate(-50%, 150%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.65rem 1.1rem;
    font-size: 0.85rem;
    z-index: 10;
    transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .toast.show { transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .status-pill .dot { animation: none; }
    .code, .btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="glow a" aria-hidden="true"></div>
  <div class="glow b" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="wrap">
    <div class="status-pill">
      <span class="dot" aria-hidden="true"></span>
      Error 404 &middot; Not Found
    </div>

    <div class="code" id="code" title="Click me">404</div>

    <h1>This page wandered off the map.</h1>
    <p class="lede">
      The link may be broken, or the page may have been moved or deleted.
      Let&rsquo;s get you somewhere useful.
    </p>

    <div class="path-box" aria-label="Requested address">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="path" id="requested-path"><span class="scheme">you tried to reach</span> /unknown-page</span>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="go-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
        </svg>
        Back to home
      </button>
      <button type="button" class="btn btn-ghost" id="go-back">Go back</button>
      <button type="button" class="btn btn-ghost" id="copy-link">Copy this URL</button>
    </div>

    <p class="hint">
      Tip: click the <strong>404</strong> for a surprise, or press <kbd>H</kbd> for home.
      Think this is a mistake? <a href="mailto:support@example.com">Let us know</a>.
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- Show the requested path ------------------------------------- */
  var pathEl = document.getElementById("requested-path");
  try {
    var p = decodeURIComponent(location.pathname + location.search) || "/";
    pathEl.textContent = p;
  } catch (e) {
    /* keep the default text */
  }

  /* ---- Toast helper -------------------------------------------------- */
  var toast = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  /* ---- Actions -------------------------------------------------------- */
  document.getElementById("go-home").addEventListener("click", function () {
    location.href = "/";
  });

  document.getElementById("go-back").addEventListener("click", function () {
    if (history.length > 1) {
      history.back();
    } else {
      location.href = "/";
    }
  });

  document.getElementById("copy-link").addEventListener("click", function () {
    var url = location.href;
    function done() { showToast("URL copied to clipboard"); }
    function fail() { showToast("Couldn't copy — " + url); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, fail);
    } else {
      fail();
    }
  });

  /* ---- Keyboard shortcuts --------------------------------------------- */
  document.addEventListener("keydown", function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === "h") { location.href = "/"; }
    if (k === "b") {
      if (history.length > 1) { history.back(); } else { location.href = "/"; }
    }
  });

  /* ---- Interactive 404: tilt + glitch + click surprise ---------------- */
  var code = document.getElementById("code");
  var glitchTimeout = null;

  function glitch() {
    code.classList.remove("glitching");
    void code.offsetWidth; /* restart animations */
    code.classList.add("glitching");
    clearTimeout(glitchTimeout);
    glitchTimeout = setTimeout(function () { code.classList.remove("glitching"); }, 320);
  }

  var surpriseIndex = 0;
  var surprises = [
    "Still 404. Nice try.",
    "Nope. Still not found.",
    "The page is genuinely gone.",
    "OK, you win. It's very much a 404.",
    "Persistence noted. Have a star. \u2728"
  ];

  code.addEventListener("click", function () {
    glitch();
    showToast(surprises[surpriseIndex % surprises.length]);
    surpriseIndex++;
  });

  /* Subtle parallax tilt toward the cursor */
  if (!prefersReduced) {
    document.addEventListener("mousemove", function (e) {
      var nx = e.clientX / window.innerWidth - 0.5;
      var ny = e.clientY / window.innerHeight - 0.5;
      code.style.transform =
        "rotateY(" + (nx * 10) + "deg) rotateX(" + (-ny * 10) + "deg)";
    });
    /* Occasional ambient glitch */
    setInterval(function () {
      if (Math.random() < 0.25) { glitch(); }
    }, 4500);
  }

  /* ---- Starfield background -------------------------------------------- */
  var canvas = document.getElementById("stars");
  var ctx = canvas.getContext("2d");
  var stars = [];
  var raf = null;
  var mouse = { x: 0.5, y: 0.5 };

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function seed() {
    stars = [];
    var count = Math.min(140, Math.floor((canvas.width * canvas.height) / 12000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random() * 0.5 + 0.15,
        tw: Math.random() * Math.PI * 2,
        sp: Math.random() * 0.015 + 0.004,
        drift: Math.random() * 0.15 + 0.05
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var parX = (mouse.x - 0.5) * 14;
    var parY = (mouse.y - 0.5) * 14;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.tw += s.sp;
      s.y += s.drift;
      if (s.y > canvas.height + 2) { s.y = -2; s.x = Math.random() * canvas.width; }
      var alpha = s.a + Math.sin(s.tw) * 0.25;
      if (alpha < 0.05) { alpha = 0.05; }
      ctx.beginPath();
      ctx.arc(s.x + parX, s.y + parY, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(232, 236, 244, " + alpha.toFixed(3) + ")";
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  resize();
  seed();
  if (prefersReduced) {
    /* Draw one static frame instead of animating */
    draw(0);
    cancelAnimationFrame(raf);
  } else {
    raf = requestAnimationFrame(draw);
    document.addEventListener("mousemove", function (e) {
      mouse.x = e.clientX / window.innerWidth;
      mouse.y = e.clientY / window.innerHeight;
    });
  }

  window.addEventListener("resize", function () {
    resize();
    seed();
  });

  /* Pause the starfield when the tab is hidden */
  document.addEventListener("visibilitychange", function () {
    if (prefersReduced) return;
    if (document.hidden) {
      cancelAnimationFrame(raf);
      raf = null;
    } else if (raf === null) {
      raf = requestAnimationFrame(draw);
    }
  });
})();
</script>
</body>
</html>
