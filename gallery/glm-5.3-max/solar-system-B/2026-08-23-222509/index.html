<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>SOLARIS — a miniature solar system</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23ffd27f'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --glass: rgba(10, 14, 24, 0.55);
    --line: rgba(255, 255, 255, 0.13);
    --ink: #e9edf5;
    --dim: #96a0b6;
    --accent: #ffd27f;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0; overflow: hidden; background: #04060c; color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #scene{ position: fixed; inset: 0; }
  #scene canvas{ display: block; touch-action: none; }
  #vignette{
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(2,4,10,0.55) 100%);
  }
  #labels{ position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .label{
    position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap;
    color: rgba(233,237,245,0.82); text-shadow: 0 1px 8px rgba(0,0,0,0.9); cursor: pointer;
    pointer-events: auto; transition: color 0.25s ease, opacity 0.25s ease; will-change: transform;
  }
  .label:hover{ color: #ffffff; }
  .label.active{ color: var(--accent, #ffd27f); }
  .label .dot{ width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; opacity: 0.9; }

  #masthead{
    position: fixed; top: 26px; left: 30px; z-index: 5; pointer-events: none; user-select: none;
    opacity: 0; transition: opacity 1.4s ease 0.2s;
  }
  #masthead.in{ opacity: 1; }
  #masthead h1{
    margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.44em;
    background: linear-gradient(180deg, #ffffff, #9fb0d6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #masthead .sub{ margin-top: 7px; font-size: 10.5px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); }
  #clock{
    margin-top: 12px; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; color: var(--accent); opacity: 0.9;
  }

  #hint{
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 5; pointer-events: none;
    font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim);
    opacity: 0; transition: opacity 1.2s ease; text-align: center; width: 90vw;
  }
  #hint.in{ opacity: 1; }

  #hud{
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 14px 44px rgba(0,0,0,0.5); max-width: calc(100vw - 32px);
    flex-wrap: wrap; justify-content: center;
  }
  .icon-btn{
    width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.05); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; transition: background 0.2s, border-color 0.2s;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.12); }
  .icon-btn svg{ width: 13px; height: 13px; fill: currentColor; }
  .speed{ display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .speed input[type=range]{ width: 120px; accent-color: var(--accent); cursor: pointer; }
  #speed-val{
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
    color: var(--dim); min-width: 40px; text-align: right;
  }
  .vr{ width: 1px; height: 22px; background: var(--line); }
  .pill{
    appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink);
    font: inherit; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .pill:hover{ background: rgba(255,255,255,0.11); }
  .pill.active{ background: rgba(255,210,127,0.13); border-color: rgba(255,210,127,0.45); color: var(--accent); }

  #panel{
    position: fixed; right: 26px; top: 50%; z-index: 7; width: 288px; max-width: calc(100vw - 40px);
    transform: translate(26px, -50%); opacity: 0; visibility: hidden;
    background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 20px 20px 16px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 18px 60px rgba(0,0,0,0.5);
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease, visibility 0.5s;
  }
  #panel.show{ transform: translate(0, -50%); opacity: 1; visibility: visible; }
  .panel-head{ display: flex; align-items: center; gap: 10px; }
  .panel-head .swatch{ width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 12px currentColor; flex: none; }
  #p-name{ margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; flex: 1; }
  #p-close{
    appearance: none; border: none; background: transparent; color: var(--dim);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  #p-close:hover{ color: #ffffff; background: rgba(255,255,255,0.08); }
  #p-kind{ margin: 6px 0 0; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); }
  #p-blurb{ margin: 12px 0 4px; font-size: 13px; line-height: 1.55; color: #c6cede; }
  .stats{ display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 14px 0 6px; font-size: 12px; }
  .stats dt{ color: var(--dim); letter-spacing: 0.05em; }
  .stats dd{ margin: 0; text-align: right; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; }
  .panel-foot{
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim);
  }

  #loader{
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: #04060c;
    transition: opacity 0.9s ease; font-size: 11px; letter-spacing: 0.34em;
    text-transform: uppercase; color: var(--dim);
  }
  #loader.done{ opacity: 0; pointer-events: none; }
  #loader .orb{
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 24px 6px rgba(255,210,127,0.45); animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%, 100%{ transform: scale(0.75); opacity: 0.6; } 50%{ transform: scale(1.15); opacity: 1; } }

  @media (max-width: 640px){
    #masthead{ top: 18px; left: 18px; }
    #masthead h1{ font-size: 19px; }
    #hud{ gap: 8px; padding: 8px 10px; bottom: 14px; }
    .speed input[type=range]{ width: 88px; }
    #panel{ right: 12px; }
    #hint{ bottom: 122px; }
  }
</style>
</head>
<body>
  <div id="scene" aria-label="Interactive 3D solar system"></div>
  <div id="vignette"></div>
  <div id="labels" aria-hidden="true"></div>

  <header id="masthead">
    <h1>SOLARIS</h1>
    <div class="sub">a miniature solar system</div>
    <div id="clock">T +0.0 yr</div>
  </header>

  <div id="hint">drag to orbit · scroll to zoom · click a world to visit</div>

  <aside id="panel" aria-live="polite">
    <div class="panel-head">
      <span class="swatch" id="p-swatch"></span>
      <h2 id="p-name">&mdash;</h2>
      <button id="p-close" aria-label="Close details">&times;</button>
    </div>
    <p id="p-kind">&mdash;</p>
    <p id="p-blurb">&mdash;</p>
    <dl class="stats" id="p-stats"></dl>
    <div class="panel-foot" id="p-foot">following · esc to release</div>
  </aside>

  <footer id="hud">
    <button id="btn-play" class="icon-btn" aria-label="Pause simulation">
      <svg id="ic-pause" viewBox="0 0 16 16"><rect x="2.5" y="2" width="4" height="12" rx="1"/><rect x="9.5" y="2" width="4" height="12" rx="1"/></svg>
      <svg id="ic-play" viewBox="0 0 16 16" style="display:none"><path d="M4 2.3v11.4c0 .8.9 1.3 1.6.9l9-5.7c.6-.4.6-1.4 0-1.8l-9-5.7C4.9 1 4 1.5 4 2.3z"/></svg>
    </button>
    <div class="speed">
      <input id="speed" type="range" min="0" max="5" step="0.1" value="1" aria-label="Simulation speed" />
      <span id="speed-val">1.0&times;</span>
    </div>
    <span class="vr"></span>
    <button id="btn-orbits" class="pill active">Orbits</button>
    <button id="btn-labels" class="pill active">Labels</button>
    <button id="btn-home" class="pill">Overview</button>
  </footer>

  <div id="loader"><span class="orb"></span><span>entering the system</span></div>

  <script>
    window.addEventListener('error', function () {
      var l = document.getElementById('loader');
      if (l && !l.classList.contains('done')) {
        var s = l.querySelectorAll('span');
        if (s.length > 1) s[1].textContent = 'something went wrong — try reloading';
      }
    }, true);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /* ============================== tiny seeded RNG + canvas helpers ============================== */

    function rng(seed){
      let a = seed >>> 0;
      return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function gauss(R){
      let u = 0, v = 0;
      while (!u) u = R();
      while (!v) v = R();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    function makeCanvas(w, h){
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return [c, c.getContext('2d')];
    }
    function rgba(hex, a){
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    function toTex(c){
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }
    function softEllipse(ctx, cx, cy, rx, ry, color, alpha){
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, ry / rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, rgba(color, alpha));
      g.addColorStop(0.65, rgba(color, alpha * 0.5));
      g.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, rx, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    function speckle(ctx, R, w, h, n, color, alpha){
      for (let i = 0; i < n; i++){
        ctx.fillStyle = rgba(color, alpha * R());
        ctx.beginPath();
        ctx.arc(R() * w, R() * h, 0.4 + R() * 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* ============================== procedural texture painters ============================== */

    function texBands(o){
      const [c, ctx] = makeCanvas(512, 256);
      const R = rng(o.seed);
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      o.grad.forEach(function (s){ g.addColorStop(s[0], s[1]); });
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 256);
      for (let i = 0; i < 30; i++){
        const y = R() * 256, ry = 3 + R() * 15, rx = 130 + R() * 230, x = R() * 512;
        const col = R() < 0.5 ? o.tones[0] : o.tones[1];
        const a = 0.04 + R() * 0.09;
        const dxs = [0, 512, -512];
        for (let k = 0; k < dxs.length; k++) softEllipse(ctx, x + dxs[k], y, rx, ry, col, a);
      }
      for (let i = 0; i < 80; i++){
        ctx.fillStyle = rgba(R() < 0.5 ? o.tones[0] : o.tones[1], 0.03 + R() * 0.09);
        ctx.fillRect(-60, R() * 256, 632, 0.8 + R() * 1.8);
      }
      speckle(ctx, R, 512, 256, 700, '#ffffff', 0.05);
      if (o.spot){
        const s = o.spot;
        const dxs = [0, 512, -512];
        for (let k = 0; k < dxs.length; k++){
          softEllipse(ctx, s.x * 512 + dxs[k], s.y * 256, s.rx, s.ry, s.col, 0.55);
          softEllipse(ctx, s.x * 512 + dxs[k], s.y * 256, s.rx * 0.55, s.ry * 0.55, s.core || s.col, 0.5);
        }
      }
      return toTex(c);
    }

    function texRocky(o){
      const [c, ctx] = makeCanvas(512, 256);
      const R = rng(o.seed);
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, o.base1); g.addColorStop(0.5, o.base2); g.addColorStop(1, o.base1);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 256);
      for (let i = 0; i < 46; i++){
        const col = R() < 0.5 ? o.spots[0] : o.spots[1];
        softEllipse(ctx, R() * 512, R() * 256, 18 + R() * 60, 8 + R() * 26, col, 0.05 + R() * 0.06);
      }
      const n = o.craters || 140;
      for (let i = 0; i < n; i++){
        const x = R() * 512, y = 20 + R() * 216, r = 1.2 + R() * R() * 8.5;
        const dxs = [0, 512, -512];
        for (let k = 0; k < dxs.length; k++){
          ctx.fillStyle = 'rgba(0,0,0,' + (0.10 + R() * 0.12).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(x + dxs[k], y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.10)';
          ctx.lineWidth = Math.max(0.6, r * 0.16);
          ctx.beginPath();
          ctx.arc(x + dxs[k], y, r, Math.PI * 0.75, Math.PI * 1.75);
          ctx.stroke();
        }
      }
      speckle(ctx, R, 512, 256, 500, '#000000', 0.06);
      if (o.cap){
        for (let i = 0; i < 26; i++){
          softEllipse(ctx, R() * 512, 4 + R() * 12, 26 + R() * 44, 6 + R() * 9, o.cap, 0.5);
          softEllipse(ctx, R() * 512, 252 - R() * 12, 26 + R() * 44, 6 + R() * 9, o.cap, 0.5);
        }
      }
      return toTex(c);
    }

    function texEarth(){
      const W = 1024, H = 512;
      const [c, ctx] = makeCanvas(W, H);
      const R = rng(42);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0d2c5e'); g.addColorStop(0.5, '#155198'); g.addColorStop(1, '#0b2a56');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      softEllipse(ctx, W / 2, H / 2, W * 0.62, 90, '#2f74c4', 0.16);
      const greens = ['#3f6d3a', '#517d43', '#6b8a4c', '#83905a', '#4d7a40'];
      const lands = [];
      for (let k = 0; k < 7; k++){
        const blobs = [];
        let x = R() * W, y = 110 + R() * 290;
        for (let i = 0; i < 26; i++){
          blobs.push([x, y, 9 + R() * 34]);
          x += (R() - 0.5) * 74;
          y += (R() - 0.5) * 46;
          y = Math.max(70, Math.min(H - 70, y));
        }
        lands.push(blobs);
      }
      function circle(px, py, r, col, a){
        const dxs = [0, W, -W];
        for (let k = 0; k < dxs.length; k++){
          ctx.fillStyle = rgba(col, a);
          ctx.beginPath();
          ctx.arc(px + dxs[k], py, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      for (let k = 0; k < lands.length; k++){
        const blobs = lands[k];
        for (let i = 0; i < blobs.length; i++) circle(blobs[i][0], blobs[i][1], blobs[i][2] + 5, '#123c72', 0.85);
      }
      for (let k = 0; k < lands.length; k++){
        const blobs = lands[k];
        for (let i = 0; i < blobs.length; i++) circle(blobs[i][0], blobs[i][1], blobs[i][2], greens[(R() * greens.length) | 0], 0.95);
      }
      for (let k = 0; k < 10; k++){
        const blobs = lands[(R() * lands.length) | 0];
        const b = blobs[(R() * blobs.length) | 0];
        const dxs = [0, W, -W];
        for (let m = 0; m < dxs.length; m++)
          softEllipse(ctx, b[0] + dxs[m], b[1], 16 + R() * 30, 8 + R() * 16, '#c8b078', 0.4);
      }
      for (let i = 0; i < 22; i++){
        softEllipse(ctx, R() * W, 2 + R() * 8, 40 + R() * 70, 8 + R() * 12, '#eef4ff', 0.75);
        softEllipse(ctx, R() * W, H - 2 - R() * 8, 40 + R() * 70, 8 + R() * 12, '#eef4ff', 0.75);
      }
      for (let i = 0; i < 30; i++){
        const x = R() * W, y = R() * H;
        const dxs = [0, W, -W];
        for (let m = 0; m < dxs.length; m++){
          softEllipse(ctx, x + dxs[m], y, 30 + R() * 80, 6 + R() * 12, '#ffffff', 0.10 + R() * 0.08);
          softEllipse(ctx, x + W * 0.25 * (R() - 0.5) + dxs[m], y + 20 * (R() - 0.5), 20 + R() * 40, 4 + R() * 7, '#ffffff', 0.08);
        }
      }
      return toTex(c);
    }

    function texSun(){
      const [c, ctx] = makeCanvas(512, 256);
      const R = rng(7);
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, '#ffdf9a'); g.addColorStop(0.5, '#ffb64e'); g.addColorStop(1, '#ff9a33');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 256);
      for (let i = 0; i < 110; i++)
        softEllipse(ctx, R() * 512, R() * 256, 14 + R() * 46, 8 + R() * 22, '#ffe9b0', 0.05 + R() * 0.08);
      for (let i = 0; i < 30; i++)
        softEllipse(ctx, R() * 512, R() * 256, 10 + R() * 26, 6 + R() * 14, '#e67718', 0.06 + R() * 0.07);
      speckle(ctx, R, 512, 256, 2200, '#fff6d8', 0.07);
      return toTex(c);
    }

    function texRing(){
      const W = 512;
      const [c, ctx] = makeCanvas(W, 8);
      const bands = [
        [0.02, 0.16, 0.16], [0.16, 0.44, 0.62], [0.44, 0.50, 0.22], [0.50, 0.60, 0.85],
        [0.60, 0.655, 0.06], [0.655, 0.86, 0.55], [0.86, 0.93, 0.22], [0.93, 1.0, 0.0]
      ];
      function ss(t, a, b){
        const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
        return x * x * (3 - 2 * x);
      }
      for (let x = 0; x < W; x++){
        const t = x / (W - 1);
        let a = 0;
        for (let i = 0; i < bands.length; i++){
          const f = bands[i][0], to = bands[i][1], al = bands[i][2];
          a += al * ss(t, f - 0.02, f + 0.02) * (1 - ss(t, to - 0.02, to + 0.02));
        }
        const shade = 0.86 + 0.14 * Math.sin(t * 140 + 1.7);
        ctx.fillStyle = 'rgba(' + ((222 * shade) | 0) + ',' + ((203 * shade) | 0) + ',' + ((168 * shade) | 0) + ',' + a.toFixed(3) + ')';
        ctx.fillRect(x, 0, 1, 8);
      }
      return toTex(c);
    }

    function texGlow(){
      const [c, ctx] = makeCanvas(256, 256);
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, 'rgba(255,246,220,0.85)');
      g.addColorStop(0.2, 'rgba(255,206,120,0.38)');
      g.addColorStop(0.5, 'rgba(255,160,60,0.10)');
      g.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      return toTex(c);
    }

    /* ============================== system data ============================== */

    const SUN_INFO = {
      name: 'Sol', kind: 'G2V · the star', accent: '#ffd27f',
      blurb: "A middle-aged yellow dwarf holding 99.86% of the system's mass.",
      stats: [

    /* ============================== renderer / scene / camera ============================== */

    function starLayer(count, size, opacity, seed, bandNormal){
      const R = rng(seed);
      const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
      let u = null, v = null, n = null;
      if (bandNormal){
        n = bandNormal.clone().normalize();
        u = new THREE.Vector3(1, 0, 0).cross(n).normalize();
        v = new THREE.Vector3().crossVectors(n, u).normalize();
      }
      const p = new THREE.Vector3();
      for (let i = 0; i < count; i++){
        if (bandNormal){
          const th = R() * Math.PI * 2;
          p.copy(u).multiplyScalar(Math.cos(th)).addScaledVector(v, Math.sin(th)).addScaledVector(n, gauss(R) * 0.085);
        } else {
          p.set(gauss(R), gauss(R), gauss(R));
        }
        p.normalize().multiplyScalar(880 + R() * 160);
        pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
        const b = 0.35 + Math.pow(R(), 2.6) * 1.25;
        const t = R();
        let r = b, g = b, bl = b;
        if (t < 0.16){ g = b * 0.82; bl = b * 0.6; }
        else if (t > 0.62){ r = b * 0.72; g = b * 0.84; }
        col[i * 3] = r; col[i * 3 + 1] = g; col[i * 3 + 2] = bl;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: size, sizeAttenuation: false, vertexColors: true, transparent: true,
        opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const pts = new THREE.Points(geo, mat);
      pts.renderOrder = -2;
      scene.add(pts);
      return mat;
    }
    const starMatA = starLayer(1600, 1.5, 0.9, 101, null);

    /* ============================== planets ============================== */

    const EARTH_RATE = Math.PI * 2 / 60; // one Earth orbit per minute at 1x (pacing compressed outward)

    function makeRing(inner, outer, tex, opacity){
      const geo = new THREE.RingGeometry(inner, outer, 160, 1);
      const pos = geo.attributes.position, uv = geo.attributes.uv;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++){
        v.fromBufferAttribute(pos, i);
        uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5);

      const mat = new THREE.MeshStandardMaterial({
        map: tex, transparent: true, opacity: opacity, side: THREE.DoubleSide,
        roughness: 0.95, metalness: 0, depthWrite: false

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      return mesh;

    /* ============================== asteroid belt ============================== */

    const belt = (function (){
      const R = rng(55);
      const count = 620;
      const geo = new THREE.DodecahedronGeometry(0.13, 0);
      const mat = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0, flatShading: true });
      const im = new THREE.InstancedMesh(geo, mat, count);
      const dummy = new THREE.Object3D();
      const col = new THREE.Color();
      for (let i = 0; i < count; i++){
        const r = Math.min(37.6, Math.max(28.6, 33 + gauss(R) * 2.6));
        const a = R() * Math.PI * 2;
        dummy.position.set(Math.cos(a) * r, gauss(R) * 0.6, Math.sin(a) * r);
        dummy.rotation.set(R() * Math.PI, R() * Math.PI, R() * Math.PI);
        dummy.scale.setScalar(0.35 + Math.pow(R(), 2) * 1.5);
        dummy.updateMatrix();
        im.setMatrixAt(i, dummy.matrix);
        const s = 0.45 + R() * 0.45;
        im.setColorAt(i, col.setRGB(s * 0.62, s * 0.55, s * 0.46));
      }
      im.instanceMatrix.needsUpdate = true;

    /* ============================== comet with particle tail ============================== */

    const comet = (function (){
      const group = new THREE.Group();
      group.rotation.set(0.2, 1.2, 0);

      const head = new THREE.Mesh(

      }));
      glow.scale.setScalar(4.5);
      head.add(glow);
      group.add(head);

      const TRAIL = 130;
      const posArr = new Float32Array(TRAIL * 3);
      const colArr = new Float32Array(TRAIL * 3);
      for (let i = 0; i < TRAIL; i++){
        const t = i / (TRAIL - 1);
        colArr[i * 3] = 0.55 * (1 - t) + 0.02;
        colArr[i * 3 + 1] = 0.85 * (1 - t) + 0.03;
        colArr[i * 3 + 2] = 1.0 * (1 - t) + 0.05;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      const trailPts = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 2.2, sizeAttenuation: true, vertexColors: true, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      trailPts.frustumCulled = false;
      scene.add(trailPts);

      return { group: group, head: head, geo: geo, TRAIL: TRAIL, history: [], theta: 1.1, a: 46, e: 0.72, k: 300 };
    })();

    function updateComet(dts){
      const c = comet;
      const rNow = c.a * (1 - c.e * c.e) / (1 + c.e * Math.cos(c.theta));
      c.theta += (c.k / (rNow * rNow)) * dts;
      const r = c.a * (1 - c.e * c.e) / (1 + c.e * Math.cos(c.theta));
      c.head.position.set(Math.cos(c.theta) * r, 0, Math.sin(c.theta) * r);
      const wp = new THREE.Vector3();
      c.head.getWorldPosition(wp);
      const last = c.history[0];
      if (!last || last.distanceToSquared(wp) > 0.02){
        c.history.unshift(wp.clone());
        if (c.history.length > c.TRAIL) c.history.pop();
      }
      const pa = c.geo.attributes.position.array;
      for (let i = 0; i < c.TRAIL; i++){
        const p = c.history[Math.min(i, c.history.length - 1)] || wp;
        pa[i * 3] = p.x; pa[i * 3 + 1] = p.y; pa[i * 3 + 2] = p.z;
      }
      c.geo.attributes.position.needsUpdate = true;
    }

      bodies.forEach(function (b){
        b.el.classList.remove('active');

    function focusBody(idx){
      selected = idx;
      const b = bodies[idx];
      resetOrbitHighlight();
      b.el.classList.add('active');
      b.lineMat.color.set(b.cfg.accent);
      b.lineMat.opacity = 0.42;
      setPanel(b.cfg);
      ui.pFoot.textContent = 'following · esc to release';
      hideHint();
      const getTgt = function (){ return b.anchor.getWorldPosition(new THREE.Vector3()); };
      const getPos = function (){
        const p = getTgt();
        const out = p.lengthSq() < 1e-6 ? new THREE.Vector3(1, 0, 0) : p.clone().normalize();
        const side = new THREE.Vector3().crossVectors(UP, out).normalize();
        const d = b.cfg.r * 5.6 + 3.6;
        return p.clone().addScaledVector(out, d * 0.6).addScaledVector(UP, d * 0.36).addScaledVector(side, d * 0.3);
      };
      flyTo(getPos, getTgt, 1.6, function (){ follow = b; b.anchor.getWorldPosition(followPrev); });
    }

    function focusSun(){
      selected = 'sun';
      follow = null;
      resetOrbitHighlight();
      setPanel(SUN_INFO);
      ui.pFoot.textContent = 'click a planet or esc for overview';
      hideHint();
      const dir = camera.position.clone();
      if (dir.lengthSq() < 1) dir.set(0, 0.3, 1);
      dir.normalize();
      flyTo(
        function (){ return dir.clone().multiplyScalar(17).add(new THREE.Vector3(0, 1.5, 0)); },
        function (){ return new THREE.Vector3(0, 0, 0); },
        1.5, null
      );
    }

    function clearSelection(){
      if (selected === null && follow === null) return;
      selected = null;
      follow = null;
      ui.panel.classList.remove('show');
      resetOrbitHighlight();
      flyTo(
        function (){ return OVERVIEW_POS.clone(); },
        function (){ return OVERVIEW_TGT.clone(); },
        1.7, null
      );
    }

    /* ---------- picking ---------- */

    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const canvasEl = renderer.domElement;
    const hitTargets = [sunHit].concat(bodies.map(function (b){ return b.hit; }));
    let pDown = null, hoverIdx = null, hoverDirty = true;

    function setNdc(e){
      const r = canvasEl.getBoundingClientRect();
      ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    }

    canvasEl.addEventListener('pointerdown', function (e){
      pDown = { x: e.clientX, y: e.clientY, t: performance.now() };
      userInteracted = true;
      setTimeout(hideHint, 4000);
    });
    canvasEl.addEventListener('pointerup', function (e){
      if (!pDown) return;
      const moved = Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y);
      const dtms = performance.now() - pDown.t;
      pDown = null;
      if (moved > 6 || dtms > 500) return;
      setNdc(e);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(hitTargets, false);
      if (hits.length){
        const o = hits[0].object;
        if (o === sunHit) focusSun();
        else focusBody(o.userData.bodyIndex);
      } else if (selected !== null){
        clearSelection();
      }
    });
    canvasEl.addEventListener('pointermove', function (e){ setNdc(e); hoverDirty = true; });

    function updateHover(){
      if (!hoverDirty) return;
      hoverDirty = false;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(hitTargets, false);
      let idx = null;
      if (hits.length) idx = hits[0].object === sunHit ? 'sun' : hits[0].object.userData.bodyIndex;
      if (idx !== hoverIdx){
        hoverIdx = idx;
        canvasEl.style.cursor = idx === null ? 'grab' : 'pointer';
      }
    }

    /* ---------- buttons ---------- */

    function setPaused(v){
      paused = v;
      ui.icPlay.style.display = v ? '' : 'none';
      ui.icPause.style.display = v ? 'none' : '';
      ui.play.setAttribute('aria-label', v ? 'Resume simulation' : 'Pause simulation');
    }
    ui.play.addEventListener('click', function (){ setPaused(!paused); });
    ui.speed.addEventListener('input', function (){
      speed = parseFloat(ui.speed.value);
      ui.speedVal.textContent = speed.toFixed(1) + '\u00d7';
    });
    ui.orbits.addEventListener('click', function (){
      showOrbits = !showOrbits;
      ui.orbits.classList.toggle('active', showOrbits);
      bodies.forEach(function (b){ b.line.visible = showOrbits; });
    });
    ui.labelsBtn.addEventListener('click', function (){
      showLabels = !showLabels;
      ui.labelsBtn.classList.toggle('active', showLabels);
      labelsRoot.style.display = showLabels ? '' : 'none';
    });
    ui.home.addEventListener('click', function (){ clearSelection(); });
    ui.pClose.addEventListener('click', function (){ clearSelection(); });

    window.addEventListener('keydown', function (e){
      if (e.code === 'Space'){ e.preventDefault(); setPaused(!paused); }
      else if (e.key === 'o' || e.key === 'O'){ ui.orbits.click(); }
      else if (e.key === 'l' || e.key === 'L'){ ui.labelsBtn.click(); }
      else if (e.key === 'Escape'){ clearSelection(); }
    });

    /* ---------- hint / intro timing ---------- */

    let hintHidden = false;
    function hideHint(){
      if (hintHidden) return;
      hintHidden = true;
      ui.hint.classList.remove('in');
    }

    setTimeout(function (){ ui.masthead.classList.add('in'); }, 900);
    flyTo(
      function (){ return OVERVIEW_POS.clone(); },
      function (){ return OVERVIEW_TGT.clone(); },
      3.6,
      function (){
        if (!userInteracted) controls.autoRotate = true;
        ui.hint.classList.add('in');
        setTimeout(hideHint, 14000);
      }
    );

    /* ============================== labels ============================== */

    const labelV = new THREE.Vector3();
    const camDir = new THREE.Vector3();
    const tmpV = new THREE.Vector3();

    function updateLabels(){
      if (!showLabels) return;
      camera.getWorldDirection(camDir);
      const w = window.innerWidth, h = window.innerHeight;
      for (let i = 0; i < bodies.length; i++){
        const b = bodies[i];
        b.anchor.getWorldPosition(labelV);
        const dWorld = camera.position.distanceTo(labelV);
        labelV.y += b.cfg.r + 0.55;
        const behind = tmpV.copy(labelV).sub(camera.position).dot(camDir) <= 0.05;
        labelV.project(camera);
        if (behind || labelV.z > 1){
          b.el.style.opacity = '0';
          b.el.style.pointerEvents = 'none';
          continue;
        }
        const x = (labelV.x * 0.5 + 0.5) * w;
        const y = (-labelV.y * 0.5 + 0.5) * h;
        b.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%, -100%)';
        b.el.style.opacity = String(Math.max(0.25, Math.min(1, 1.55 - dWorld / 300)));
        b.el.style.pointerEvents = 'auto';
      }
    }

    /* ============================== main loop ============================== */

    const clock = new THREE.Clock();
    const V1 = new THREE.Vector3(), V2 = new THREE.Vector3();

    function animate(){
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      realT += dt;
      const dts = dt * (paused ? 0 : speed);
      simT += dts;

      for (let i = 0; i < bodies.length; i++){
        const b = bodies[i];
        b.angle += b.rate * dts;
        b.anchor.position.set(Math.cos(b.angle) * b.cfg.dist, 0, Math.sin(b.angle) * b.cfg.dist);
        b.mesh.rotation.y += b.spin * dts;
        if (b.moonAnchor){
          b.moonAngle += b.moonRate * dts;
          b.moonMesh.position.set(
            Math.cos(b.moonAngle) * b.cfg.moon.dist, 0,
            Math.sin(b.moonAngle) * b.cfg.moon.dist
          );
          b.moonMesh.rotation.y += 0.1 * dts;
        }
      }

      belt.rotation.y += 0.0085 * dts;
      updateComet(dts);

      sunMesh.rotation.y += 0.02 * dt;
      const pulse = 1 + Math.sin(realT * 1.3) * 0.045;
      coronaA.scale.setScalar(22 * pulse);
      coronaB.scale.setScalar(46 * (1 + Math.sin(realT * 1.3 + 1.2) * 0.03));

      starMatA.opacity = 0.85 + Math.sin(realT * 0.6) * 0.12;
      starMatB.opacity = 0.85 + Math.sin(realT * 0.43 + 2) * 0.14;

      if (camAnim){
        camAnim.t += dt;
        const k = easeIO(Math.min(1, camAnim.t / camAnim.dur));
        camera.position.lerpVectors(camAnim.fromPos, camAnim.getPos(), k);
        controls.target.lerpVectors(camAnim.fromTgt, camAnim.getTgt(), k);
        if (camAnim.t >= camAnim.dur){
          const after = camAnim.after;
          camAnim = null;
          controls.enabled = true;
          if (after) after();
        }
      } else {
        if (follow){
          follow.anchor.getWorldPosition(V1);
          V2.copy(V1).sub(followPrev);
          camera.position.add(V2);
          controls.target.copy(V1);
          followPrev.copy(V1);
        }
        controls.autoRotate = !userInteracted;
        controls.update();
      }

      updateHover();
      updateLabels();
      ui.clockEl.textContent = 'T +' + (simT / 60).toFixed(1) + ' yr';
      composer.render();
    }

    window.addEventListener('resize', function (){
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });

    animate();
    requestAnimationFrame(function (){ setTimeout(function (){ ui.loader.classList.add('done'); }, 350); });
  </script>
</body>
</html>
