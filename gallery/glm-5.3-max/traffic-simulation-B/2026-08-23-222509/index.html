<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetroFlow — City Traffic Simulation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e131c'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%23ff5d5d'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffcf6e'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%233fd97f'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#e8edf5; --ink-dim:#8d99af; --ink-faint:#5c6879;
    --panel:rgba(14,18,27,.72); --line:rgba(255,255,255,.09);
    --accent:#ffcf6e; --green:#3fd97f; --red:#ff5d5d;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:#0a0e14; color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #city{position:fixed; inset:0; display:block; cursor:default}
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(4,7,12,.55) 100%);
  }
  .panel{
    position:fixed; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:13px 15px; color:var(--ink);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 34px rgba(0,0,0,.4);
    animation:rise .7s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @keyframes riseC{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}

  /* title */
  #titlePanel{top:18px; left:18px; min-width:196px}
  .brand{display:flex; align-items:center; gap:9px}
  .mark{width:15px; height:15px; border-radius:5px; background:#141b28; border:1px solid var(--line);
    position:relative; flex:none}
  .mark i{position:absolute; width:3px; height:3px; border-radius:50%; top:5.5px}
  .mark i:nth-child(1){left:2.6px; background:var(--red)}
  .mark i:nth-child(2){left:6px;  background:var(--accent)}
  .mark i:nth-child(3){left:9.4px; background:var(--green)}
  h1{margin:0; font-size:15px; letter-spacing:.24em; font-weight:700}
  .sub{margin:3px 0 10px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}
  .clockRow{display:flex; align-items:baseline; gap:9px; border-top:1px solid var(--line); padding-top:9px}
  #clock{font:600 19px/1 var(--mono); letter-spacing:.04em}
  .chip{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#0e131c;
    background:var(--accent); border-radius:99px; padding:3px 8px; font-weight:700}
  #liveDot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;align-self:center}
  #liveDot.paused{background:var(--ink-dim)}

  /* stats */
  #statsPanel{top:18px; right:18px; width:236px}
  .statGrid{display:grid; grid-template-columns:1fr 1fr; gap:9px 14px}
  .stat b{display:block; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); font-weight:600}
  .stat span{font:600 16px/1.3 var(--mono)}
  .load{margin-top:11px; border-top:1px solid var(--line); padding-top:9px}
  .load b{display:flex; justify-content:space-between; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; margin-bottom:6px}
  .bar{height:5px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
  .bar i{display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#3fd97f,#ffcf6e 55%,#ff5d5d); transition:width .4s}

  /* controls */
  #controls{
    bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:13px; flex-wrap:wrap; justify-content:center;
    max-width:min(96vw,860px);
    animation:riseC .7s cubic-bezier(.2,.9,.25,1) both;
  }
  .btn{
    appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.055);
    color:var(--ink); border-radius:10px; padding:7px 13px; font:600 12px/1 inherit;
    letter-spacing:.03em; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .btn:hover{background:rgba(255,255,255,.11)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:11px;height:11px;fill:currentColor;flex:none}
  .btn.primary{background:var(--accent); color:#161206; border-color:transparent; min-width:88px; justify-content:center}
  .btn.primary:hover{background:#ffda8b}
  .seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{
    appearance:none; border:0; background:transparent; color:var(--ink-dim); cursor:pointer;
    padding:8px 12px; font:600 12px/1 var(--mono); border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:0}
  .seg button.active{background:rgba(255,207,110,.16); color:var(--accent)}
  .ctl{display:flex; align-items:center; gap:9px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim)}
  .ctl output{font:600 12px var(--mono); color:var(--ink); width:24px; text-align:right}
  input[type=range]{
    appearance:none; width:118px; height:4px; border-radius:99px;
    background:rgba(255,255,255,.14); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent);
    border:2px solid #16120a; box-shadow:0 1px 5px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #16120a;
  }
  .switch{position:relative; cursor:pointer; user-select:none}
  .switch input{position:absolute; opacity:0; pointer-events:none}
  .knob{width:32px; height:18px; border-radius:99px; background:rgba(255,255,255,.12);
    border:1px solid var(--line); position:relative; transition:background .15s}
  .knob::after{content:""; position:absolute; width:12px; height:12px; border-radius:50%;
    background:#aeb8ca; top:2px; left:2.5px; transition:transform .15s,background .15s}
  .switch input:checked + .knob{background:rgba(63,217,127,.28)}
  .switch input:checked + .knob::after{transform:translateX(13px); background:var(--green)}

  /* car card */
  #carCard{bottom:18px; right:18px; width:218px; display:none}
  #carCard.on{display:block; animation:rise .35s cubic-bezier(.2,.9,.25,1) both}
  #carCard .head{display:flex; align-items:center; gap:9px; margin-bottom:9px}
  #carChip{width:13px; height:13px; border-radius:4px; border:1px solid rgba(0,0,0,.4); flex:none}
  #carName{font-weight:700; font-size:13px}
  #unfollow{margin-left:auto; padding:4px 8px; font-size:10.5px}
  #carCard .row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); padding:2.5px 0}
  #carCard .row span:last-child{font:600 12px var(--mono); color:var(--ink)}

  #hint{
    position:fixed; bottom:20px; left:20px; font-size:10.5px; letter-spacing:.08em;
    color:var(--ink-dim); text-transform:uppercase; pointer-events:none;
    animation:rise .7s .4s cubic-bezier(.2,.9,.25,1) both;
  }
  #hint b{color:var(--ink); font-weight:600}
  @media (max-width:900px){
    #statsPanel{display:none}
    #hint{display:none}
    #titlePanel{padding:10px 12px}
  }
</style>
</head>
<body>
<canvas id="city"></canvas>
<div id="vignette"></div>

<header class="panel" id="titlePanel">
  <div class="brand"><span class="mark"><i></i><i></i><i></i></span><h1>METROFLOW</h1><span id="liveDot"></span></div>
  <p class="sub">City traffic simulation</p>
  <div class="clockRow"><span id="clock">09:07</span><span class="chip" id="modeChip">Day</span></div>
</header>

<aside class="panel" id="statsPanel">
  <div class="statGrid">
    <div class="stat"><b>Vehicles</b><span id="stVeh">0</span></div>
    <div class="stat"><b>Avg speed</b><span id="stSpd">0 km/h</span></div>
    <div class="stat"><b>Trips done</b><span id="stTrips">0</span></div>
    <div class="stat"><b>Flow / min</b><span id="stFlow">0</span></div>
    <div class="stat"><b>Stopped</b><span id="stStop">0</span></div>
    <div class="stat"><b>Signals</b><span id="stSig">20</span></div>
  </div>
  <div class="load"><b>Network load <span id="stLoadPct">0%</span></b><div class="bar"><i id="stLoadBar"></i></div></div>
</aside>

<div class="panel" id="controls">
  <button class="btn primary" id="playBtn">
    <svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg><span>Pause</span>
  </button>
  <div class="seg" id="speedSeg">
    <button data-s="1" class="active">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
  </div>
  <label class="ctl">Density
    <input type="range" id="density" min="10" max="110" step="5" value="70">
    <output id="densityVal">70</output>
  </label>
  <label class="ctl switch">Pedestrians
    <input type="checkbox" id="pedsToggle" checked><span class="knob"></span>
  </label>
  <button class="btn" id="timeBtn">Cycle · Auto</button>
  <button class="btn" id="resetBtn" title="Reset simulation">
    <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.7 7.9l1.9-.6A4 4 0 1 0 8 4v2.6L3.7 3.3 8 0z"/></svg>
  </button>
</div>

<aside class="panel" id="carCard">
  <div class="head">
    <span id="carChip"></span><span id="carName">Sedan</span>
    <button class="btn" id="unfollow">Release</button>
  </div>
  <div class="row"><span>Speed</span><span id="carSpd">0 km/h</span></div>
  <div class="row"><span>Status</span><span id="carState">Cruising</span></div>
  <div class="row"><span>Waiting</span><span id="carWait">0 s</span></div>
</aside>

<div id="hint"><b>Space</b> pause · <b>Click</b> a vehicle to follow · <b>Esc</b> release</div>

<script>
'use strict';
/* ============================================================
   MetroFlow — a self-contained city traffic simulation
   canvas 2D · fixed-timestep sim · prerendered day/night city
   ============================================================ */

/* ---------- utilities ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function angTo(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
const hyp = Math.hypot;

/* ---------- world constants ---------- */
const NX = 5, NY = 4;              // vertical × horizontal roads
const SP = 300, MARGIN = 150;      // block spacing / border margin
const RH = 24;                     // road half width (one lane each way)
const LO = 12;                     // lane centre offset from road centreline
const SW = 16;                     // sidewalk width
const WW = MARGIN*2 + (NX-1)*SP;   // world width  = 1500
const WH = MARGIN*2 + (NY-1)*SP;   // world height = 1200
const YEL = 2.2, ALLR = 1.3;       // signal phase times
const COMF = 120, HARD = 300;      // comfortable / hard braking (px/s²)
const STEP = 1/60, DAYLEN = 200;   // sim step / seconds per day cycle
const KMH = 0.4;                   // px/s -> km/h display factor

/* ---------- palettes ---------- */
const PAL = {
  day:{
    bg:'#bcc2b2', ground:'#c3c9ba', sidewalk:'#d5d9cf', asphalt:'#8f96a0',
    edge:'rgba(250,251,253,0.8)', center:'#d9b13f', cross:'#eef1f3',
    park:'#a3bf90', park2:'#96b283', plaza:'#ced3c5', path:'#dde0d3', water:'#9cc3d6',
    roofs:['#aeb7c2','#c3cad2','#9fab9f','#cdd3d8','#bcc3c6','#a9b3a5','#c6bfb2','#b6c1c9'],
    roofEdge:'rgba(52,63,74,0.35)', winDay:'rgba(70,85,100,0.16)',
    shadow:'rgba(35,48,60,0.17)', tree:'#5f8a52', tree2:'#79a367',
    lamp:'#7c848e', inter:'rgba(255,255,255,0.05)'
  },
  night:{
    bg:'#141a24', ground:'#151b26', sidewalk:'#1d2430', asphalt:'#151a23',
    edge:'rgba(165,180,205,0.26)', center:'#6b6034', cross:'rgba(175,185,205,0.36)',
    park:'#101b15', park2:'#0d1712', plaza:'#161d27', path:'#1c2430', water:'#12202e',
    roofs:['#1a2130','#161c29','#1e2635','#141a25','#1c2331','#182031'],
    roofEdge:'rgba(0,0,0,0.55)', winNight:['#ffd98e','#ffe7b0','#cfe6ff','#ffc97a'],
    winOff:'rgba(140,170,210,0.05)',
    shadow:'rgba(0,0,0,0.4)', tree:'#0f1d14', tree2:'#13261a',
    lamp:'#0d1220', lampGlow:'rgba(255,190,110,0.14)', lampHead:'#ffd9a0', inter:'rgba(0,0,0,0.18)'
  }
};

/* ---------- vehicle catalogue ---------- */
const VTYPES = {
  car:  {L:28, W:14, acc:95,  v:[106,136], name:'Sedan',  w:0.66},
  taxi: {L:28, W:14, acc:100, v:[116,142], name:'Taxi',   w:0.15},
  bus:  {L:48, W:16, acc:55,  v:[80, 96],  name:'Bus',    w:0.08},
  truck:{L:40, W:16, acc:60,  v:[85,102],  name:'Truck',  w:0.11}
};
const CAR_COLORS = [
  ['#e9eaee','#b9bdc6'], ['#242932','#12151b'], ['#d5495c','#a33344'],
  ['#3f7fd6','#2d5fa8'], ['#e0a63e','#b07f28'], ['#49b39a','#33806e'],
  ['#8d99ae','#66708a'], ['#b8bec9','#8f959f'], ['#8a7bd8','#6759ad'],
  ['#c96a4a','#a04f35']
];
const TAXI_C = ['#f2c241','#c29a2a'], BUS_C = ['#2f8f85','#20655e'], TRUCK_C = ['#b04a3e','#8a382e'];
const PED_COLORS = ['#d8dbe2','#c9b8a6','#a8b8c8','#b8c8b0','#d2a8a0','#c3c3d6','#e0c9a8'];

/* ---------- canvas ---------- */
const canvas = document.getElementById('city');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1, fitScale = 1, stars = [];

/* ---------- city network ---------- */
const nodes = [], links = [], INTERS = [], entries = [];
const vx = [], hy = [];
let blocks = [];
const rngCity = mulberry32(20260823);

function mkNode(x, y, boundary){
  const n = {x, y, boundary:!!boundary, out:[], inp:[], cws:null,
             gNS:0, gEW:0, t:0, cycle:0, st:null};
  nodes.push(n); return n;
}
function addLink(a, b){
  const dxx = b.x-a.x, dyy = b.y-a.y, m = hyp(dxx,dyy);
  const ux = dxx/m, uy = dyy/m, rx = -uy, ry = ux;
  const sx = (a.boundary ? a.x : a.x+ux*RH) + rx*LO;
  const sy = (a.boundary ? a.y : a.y+uy*RH) + ry*LO;
  const ex = (b.boundary ? b.x : b.x-ux*RH) + rx*LO;
  const ey = (b.boundary ? b.y : b.y-uy*RH) + ry*LO;
  const l = {a, b, ux, uy, rx, ry, sx, sy, ex, ey,
             len: hyp(ex-sx, ey-sy), cars:[], rev:null};
  links.push(l); a.out.push(l); b.inp.push(l); return l;
}
function buildCity(){
  for(let i=0;i<NX;i++) vx.push(MARGIN + i*SP);
  for(let j=0;j<NY;j++) hy.push(MARGIN + j*SP);
  const grid = [];
  for(let i=0;i<NX;i++){ grid.push([]);
    for(let j=0;j<NY;j++){ const n = mkNode(vx[i], hy[j], false); grid[i].push(n); INTERS.push(n); }
  }
  // interior two-way links
  for(let i=0;i<NX;i++)for(let j=0;j<NY;j++){
    if(i<NX-1){ addLink(grid[i][j], grid[i+1][j]); addLink(grid[i+1][j], grid[i][j]); }
    if(j<NY-1){ addLink(grid[i][j], grid[i][j+1]); addLink(grid[i][j+1], grid[i][j]); }
  }
  // boundary stubs (entry / exit)
  for(let i=0;i<NX;i++){
    const top = mkNode(vx[i], -70, true),  bot = mkNode(vx[i], WH+70, true);
    addLink(top, grid[i][0]); addLink(grid[i][NY-1], bot); entries.push(top.out[0]);
  }
  for(let j=0;j<NY;j++){
    const lf = mkNode(-70, hy[j], true), rt = mkNode(WW+70, hy[j], true);
    addLink(lf, grid[0][j]); addLink(grid[NX-1][j], rt); entries.push(lf.out[0]);
  }
  for(const l of links){ // resolve reverses
    for(const o of links){ if(o.a===l.b && o.b===l.a){ l.rev = o; break; } }
  }
  // signal timing + crosswalks
  for(const T of INTERS){
    T.box = [];
    T.gNS = 6.5 + rngCity()*3.5; T.gEW = 6.5 + rngCity()*3.5;
    T.cycle = T.gNS + YEL + ALLR + T.gEW + YEL + ALLR;
    T.t = rngCity()*T.cycle;
    T.cws = {};
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    for(const [dx,dy] of dirs){
      const px = dy===0 ? 0 : 1, py = dx===0 ? 0 : 1;      // ped walk axis
      T.cws[dx+','+dy] = {
        T, ux:dx, uy:dy,
        cx: T.x - dx*(RH+9), cy: T.y - dy*(RH+9),
        px, py, half: RH+12,
        walkAxis: dy!==0 ? 'ns' : 'ew'                     // road being crossed
      };
    }
  }
  buildBlocks();
}

/* ---------- procedural blocks (buildings / parks / plazas) ---------- */
function splitRect(x,y,w,h,depth,out){
  if(depth>=2 || w<62 || h<62 || (depth>0 && rngCity()<0.24)){ out.push({x,y,w,h}); return; }
  const vert = w>h ? true : h>w ? false : rngCity()<0.5;
  if(vert){ const c = w*(0.36+rngCity()*0.28);
    splitRect(x,y,c-5,h,depth+1,out); splitRect(x+c+5,y,w-c-5,h,depth+1,out);
  } else { const c = h*(0.36+rngCity()*0.28);
    splitRect(x,y,w,c-5,depth+1,out); splitRect(x,y+c+5,w,h-c-5,depth+1,out);
  }
}
function buildBlocks(){
  const bx = [0]; for(const x of vx){ bx.push(x-RH, x+RH); } bx.push(WW);
  const by = [0]; for(const y of hy){ by.push(y-RH, y+RH); } by.push(WH);
  blocks = [];
  for(let i=0;i<bx.length;i+=2)for(let j=0;j<by.length;j+=2){
    const x0 = bx[i], x1 = bx[i+1], y0 = by[j], y1 = by[j+1];
    if(x1-x0 < 30 || y1-y0 < 30) continue;
    const blk = {x:x0, y:y0, w:x1-x0, h:y1-y0,
                 ix:x0+SW, iy:y0+SW, iw:x1-x0-2*SW, ih:y1-y0-2*SW,
                 kind:'bld', blds:[], trees:[], pond:null, streetTrees:[]};
    const r = rngCity();
    blk.kind = r<0.18 ? 'park' : r<0.27 ? 'plaza' : 'bld';
    if(blk.kind==='bld'){
      const rects = []; splitRect(blk.ix+3, blk.iy+3, blk.iw-6, blk.ih-6, 0, rects);
      for(const rc of rects){
        const b = {x:rc.x, y:rc.y, w:rc.w, h:rc.h, roof:(rngCity()*8)|0,
                   cols:Math.max(1,((rc.w-8)/13)|0), rows:Math.max(1,((rc.h-8)/13)|0),
                   wins:[], acs:[]};
        const n = b.cols*b.rows;
        for(let k=0;k<n;k++) b.wins.push(rngCity()<0.4 ? 1+(rngCity()*4|0)*16 : 0);
        const na = 1+(rngCity()*3|0);
        for(let k=0;k<na;k++) b.acs.push({x:rc.x+6+rngCity()*(rc.w-14), y:rc.y+6+rngCity()*(rc.h-14), s:3+rngCity()*2.5});
        blk.blds.push(b);
      }
    } else if(blk.kind==='park'){
      const n = 6+(rngCity()*5|0);
      if(rngCity()<0.5){
        blk.pond = {x:blk.ix+blk.iw*(0.3+rngCity()*0.4), y:blk.iy+blk.ih*(0.3+rngCity()*0.4),
                    rx:16+rngCity()*18, ry:12+rngCity()*14};
      }
      for(let k=0;k<n;k++){
        const t = {x:blk.ix+10+rngCity()*(blk.iw-20), y:blk.iy+10+rngCity()*(blk.ih-20), r:5+rngCity()*3.5};
        if(blk.pond && hyp(t.x-blk.pond.x,t.y-blk.pond.y) < blk.pond.rx+t.r+3) continue;
        blk.trees.push(t);
      }
    } else { // plaza
      for(let k=0;k<3;k++) blk.trees.push({x:blk.ix+12+rngCity()*(blk.iw-24), y:blk.iy+12+rngCity()*(blk.ih-24), r:5+rngCity()*3});
    }
    // street trees on sidewalk corners
    for(const [sx,sy] of [[blk.ix,blk.iy],[blk.ix+blk.iw,blk.iy],[blk.ix,blk.iy+blk.ih],[blk.ix+blk.iw,blk.iy+blk.ih]]){
      if(rngCity()<0.45) blk.streetTrees.push({x:sx+(sx===blk.ix?-SW/2:SW/2), y:sy+(sy===blk.iy?-SW/2:SW/2), r:5+rngCity()*2});
    }
    blocks.push(blk);
  }
}

/* ---------- static city layers (day & night prerender) ---------- */
const SS = 2;
let dayLayer = null, nightLayer = null;

function drawStaticLayer(pal, night){
  const c = document.createElement('canvas');
  c.width = WW*SS; c.height = WH*SS;
  const g = c.getContext('2d'); g.scale(SS, SS);
  // base
  g.fillStyle = pal.bg; g.fillRect(0,0,WW,WH);
  // blocks
  for(const blk of blocks){
    g.fillStyle = pal.sidewalk; g.fillRect(blk.x, blk.y, blk.w, blk.h);
    if(blk.kind==='park'){
      g.fillStyle = pal.park; g.fillRect(blk.ix,blk.iy,blk.iw,blk.ih);
      g.fillStyle = pal.path;
      g.fillRect(blk.ix, blk.iy+blk.ih/2-4, blk.iw, 8);
      g.fillRect(blk.ix+blk.iw/2-4, blk.iy, 8, blk.ih);
      if(blk.pond){ g.fillStyle = pal.water; g.beginPath();
        g.ellipse(blk.pond.x, blk.pond.y, blk.pond.rx, blk.pond.ry, 0, 0, TAU); g.fill(); }
    } else if(blk.kind==='plaza'){
      g.fillStyle = pal.plaza; g.fillRect(blk.ix,blk.iy,blk.iw,blk.ih);
      g.strokeStyle = pal.path; g.lineWidth = 1;
      for(let x=blk.ix+16;x<blk.ix+blk.iw;x+=16){ g.beginPath(); g.moveTo(x,blk.iy); g.lineTo(x,blk.iy+blk.ih); g.stroke(); }
      for(let y=blk.iy+16;y<blk.iy+blk.ih;y+=16){ g.beginPath(); g.moveTo(blk.ix,y); g.lineTo(blk.ix+blk.iw,y); g.stroke(); }
      g.fillStyle = pal.water; g.beginPath(); g.arc(blk.ix+blk.iw/2, blk.iy+blk.ih/2, 13, 0, TAU); g.fill();
      g.strokeStyle = pal.sidewalk; g.lineWidth = 3; g.stroke();
    } else {
      g.fillStyle = pal.ground; g.fillRect(blk.ix,blk.iy,blk.iw,blk.ih);
    }
    // buildings
    for(const b of blk.blds){
      if(!night){ g.fillStyle = pal.shadow; rr(g, b.x+3, b.y+4, b.w, b.h, 3); g.fill(); }
      g.fillStyle = pal.roofs[b.roof % pal.roofs.length];
      rr(g, b.x, b.y, b.w, b.h, 3); g.fill();
      g.strokeStyle = pal.roofEdge; g.lineWidth = 1; g.stroke();
      g.fillStyle = 'rgba(255,255,255,' + (night?0.03:0.10) + ')';
      rr(g, b.x+4, b.y+4, b.w-8, b.h-8, 2); g.fill();
      // roof AC units
      g.fillStyle = night ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.28)';
      for(const a of b.acs) g.fillRect(a.x, a.y, a.s, a.s);
      // windows
      const ox = b.x + (b.w - b.cols*13 + 5)/2, oy = b.y + (b.h - b.rows*13 + 5)/2;
      for(let cy2=0; cy2<b.rows; cy2++)for(let cx2=0; cx2<b.cols; cx2++){
        const wflag = b.wins[cy2*b.cols+cx2];
        if(night){
          if(wflag){ g.fillStyle = pal.winNight[(wflag-1)/16 | 0]; g.globalAlpha = 0.85; }
          else { g.fillStyle = pal.winOff; g.globalAlpha = 1; }
          g.fillRect(ox+cx2*13, oy+cy2*13, 8, 8); g.globalAlpha = 1;
        } else {
          g.fillStyle = pal.winDay;
          g.fillRect(ox+cx2*13, oy+cy2*13, 8, 8);
        }
      }
    }
    // trees
    for(const t of blk.trees){
      if(!night){ g.fillStyle = 'rgba(35,48,60,0.14)'; g.beginPath(); g.arc(t.x+2.5,t.y+3,t.r,0,TAU); g.fill(); }
      g.fillStyle = pal.tree;  g.beginPath(); g.arc(t.x, t.y, t.r, 0, TAU); g.fill();
      g.fillStyle = pal.tree2; g.beginPath(); g.arc(t.x-t.r*0.22, t.y-t.r*0.22, t.r*0.62, 0, TAU); g.fill();
    }
    for(const t of blk.streetTrees){
      if(!night){ g.fillStyle = 'rgba(35,48,60,0.12)'; g.beginPath(); g.arc(t.x+2,t.y+2.5,t.r,0,TAU); g.fill(); }
      g.fillStyle = pal.tree;  g.beginPath(); g.arc(t.x, t.y, t.r, 0, TAU); g.fill();
      g.fillStyle = pal.tree2; g.beginPath(); g.arc(t.x-t.r*0.22, t.y-t.r*0.22, t.r*0.62, 0, TAU); g.fill();
    }
  }
  // roads
  g.fillStyle = pal.asphalt;
  for(const x of vx) g.fillRect(x-RH, 0, RH*2, WH);
  for(const y of hy) g.fillRect(0, y-RH, WW, RH*2);
  // intersection tint
  g.fillStyle = pal.inter;
  for(const T of INTERS) g.fillRect(T.x-RH, T.y-RH, RH*2, RH*2);
  // lane markings between intersections
  const markV = (x, y0, y1) => {
    g.strokeStyle = pal.center; g.lineWidth = 1.6; g.setLineDash([13,12]);
    g.beginPath(); g.moveTo(x,y0); g.lineTo(x,y1); g.stroke();
    g.strokeStyle = pal.edge; g.lineWidth = 1.2; g.setLineDash([]);
    g.beginPath(); g.moveTo(x-RH+3,y0); g.lineTo(x-RH+3,y1); g.moveTo(x+RH-3,y0); g.lineTo(x+RH-3,y1); g.stroke();
  };
  const markH = (y, x0, x1) => {
    g.strokeStyle = pal.center; g.lineWidth = 1.6; g.setLineDash([13,12]);
    g.beginPath(); g.moveTo(x0,y); g.lineTo(x1,y); g.stroke();
    g.strokeStyle = pal.edge; g.lineWidth = 1.2; g.setLineDash([]);
    g.beginPath(); g.moveTo(x0,y-RH+3); g.lineTo(x1,y-RH+3); g.moveTo(x0,y+RH-3); g.lineTo(x1,y+RH-3); g.stroke();
  };
  const gap = RH + 22;
  for(const x of vx){
    for(let j=0;j<=NY;j++){
      const y0 = j===0 ? 4 : hy[j-1]+gap, y1 = j===NY ? WH-4 : hy[j]-gap;
      if(y1-y0 > 30) markV(x, y0, y1);
    }
  }
  for(const y of hy){
    for(let i=0;i<=NX;i++){
      const x0 = i===0 ? 4 : vx[i-1]+gap, x1 = i===NX ? WW-4 : vx[i]-gap;
      if(x1-x0 > 30) markH(y, x0, x1);
    }
  }
  // crosswalks + stop bars
  g.fillStyle = pal.cross;
  for(const T of INTERS){
    for(const key in T.cws){
      const w = T.cws[key], dx = w.ux, dy = w.uy;
      for(let k=-2; k<=2; k++){
        const off = k*7.4;
        let sx, sy, sw2, sh2;
        if(dy!==0){ sx = T.x + off - 2.6; sy = T.y - dy*(RH+13); sw2 = 5.2; sh2 = 9; }
        else      { sx = T.x - dx*(RH+13); sy = T.y + off - 2.6; sw2 = 9; sh2 = 5.2; }
        rr(g, sx, sy, sw2, sh2, 1.5); g.fill();
      }
      // static stop bar on the incoming lane
      const rx = -dy, ry = dx; // right of travel
      const ax = T.x - dx*(RH+17), ay = T.y - dy*(RH+17);
      g.strokeStyle = pal.cross; g.lineWidth = 2.4; g.globalAlpha = 0.55;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax + rx*(RH-3), ay + ry*(RH-3)); g.stroke();
      g.globalAlpha = 1;
    }
  }
  // street lamps
  for(const T of INTERS){
    for(const [ox,oy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
      const lx = T.x + ox*(RH+9), ly = T.y + oy*(RH+9);
      if(night){
        const grd = g.createRadialGradient(lx,ly,2, lx,ly,52);
        grd.addColorStop(0, pal.lampGlow); grd.addColorStop(1, 'rgba(255,190,110,0)');
        g.fillStyle = grd; g.beginPath(); g.arc(lx,ly,52,0,TAU); g.fill();
        g.fillStyle = pal.lampHead; g.shadowColor = '#ffcf9e'; g.shadowBlur = 7;
        g.beginPath(); g.arc(lx,ly,2.1,0,TAU); g.fill(); g.shadowBlur = 0;
      } else {
        g.fillStyle = pal.lamp; g.beginPath(); g.arc(lx,ly,2.2,0,TAU); g.fill();
      }
    }
  }
  return c;
}

/* ---------- simulation state ---------- */
let cars = [], peds = [], followed = null;
let simTime = 0, dayT = 0.38, trips = 0, tripTimes = [];
let running = true, simSpeed = 1, targetCars = 70, pedsOn = true;
let timeMode = 'auto', idc = 0;
let spawnAcc = 0, pedAcc = 0, avgSpeedEMA = 60, lastMove = 0;
const cam = {x:WW/2, y:WH/2, s:1, tx:WW/2, ty:WH/2, ts:1, follow:false};

/* ---------- signals ---------- */
function sigState(T){
  let t = T.t % T.cycle;
  if(t < T.gNS) return {ns:'g', ew:'r', tin:t, tleft:T.gNS-t};
  t -= T.gNS; if(t < YEL) return {ns:'y', ew:'r', tin:t, tleft:YEL-t};
  t -= YEL;   if(t < ALLR) return {ns:'r', ew:'r', tin:t, tleft:ALLR-t};
  t -= ALLR;  if(t < T.gEW) return {ns:'r', ew:'g', tin:t, tleft:T.gEW-t};
  t -= T.gEW; if(t < YEL) return {ns:'r', ew:'y', tin:t, tleft:YEL-t};
  t -= YEL;   return {ns:'r', ew:'r', tin:t, tleft:ALLR-t};
}

/* ---------- vehicles ---------- */
function pickType(){
  let r = Math.random(), acc = 0;
  for(const k in VTYPES){ acc += VTYPES[k].w; if(r <= acc) return k; }
  return 'car';
}
function spawnCar(link, s, v){
  const kind = pickType(), T = VTYPES[kind];
  const c = {
    id: ++idc, kind, name:T.name, L:T.L, W:T.W, acc:T.acc,
    vmax:T.v[0] + Math.random()*(T.v[1]-T.v[0]),
    v: v!=null ? v : T.v[0]*0.7, link, s, conn:null, nextLink:null, turnNext:0, connAhead:0,
    x:0, y:0, a:Math.atan2(link.uy, link.ux), braking:false, waitT:0, blinkOn:false,
    col: kind==='taxi' ? TAXI_C : kind==='bus' ? BUS_C : kind==='truck' ? TRUCK_C
         : CAR_COLORS[(Math.random()*CAR_COLORS.length)|0]
  };
  chooseNext(c); cars.push(c); link.cars.push(c); updateCarPos(c); return c;
}
function chooseNext(c){
  const L = c.link, T = L.b;
  if(T.boundary){ c.nextLink = null; c.turnNext = 0; c.connAhead = 0; return; }
  let straight = null, left = null, right = null;
  for(const l of T.out){
    if(l === L.rev) continue;
    const dot = L.ux*l.ux + L.uy*l.uy;
    if(dot > 0.9) straight = l;
    else if(L.ux*l.uy - L.uy*l.ux > 0) right = l; else left = l;
  }
  const opts = [[straight,0.58],[right,0.24],[left,0.18]].filter(o=>o[0]);
  let tot = 0; for(const o of opts) tot += o[1];
  let r = Math.random()*tot, pick = opts[0][0];
  for(const o of opts){ r -= o[1]; if(r <= 0){ pick = o[0]; break; } }
  c.nextLink = pick;
  c.turnNext = pick===straight ? 0 : (L.ux*pick.uy - L.uy*pick.ux > 0 ? 1 : -1);
  c.connAhead = hyp(pick.sx - L.ex, pick.sy - L.ey);
}
function removeCar(c){
  if(!c.conn){ const i = c.link.cars.indexOf(c); if(i>=0) c.link.cars.splice(i,1); }
  const i = cars.indexOf(c); if(i>=0) cars.splice(i,1);
  if(followed === c){ followed = null; cam.follow = false; carCard.classList.remove('on'); }
}
function trySpawn(){
  const link = entries[(Math.random()*entries.length)|0];
  let minS = Infinity;
  for(const o of link.cars) if(o.s < minS) minS = o.s;
  if(minS > 95 || link.cars.length===0) spawnCar(link, 0);
}
function spawnInitial(){
  let placed = 0, guard = 0;
  while(placed < targetCars && guard++ < 900){
    const link = links[(Math.random()*links.length)|0];
    const s = 14 + Math.random()*(link.len-60);
    let ok = true;
    for(const o of link.cars) if(Math.abs(o.s - s) < 75){ ok = false; break; }
    if(!ok) continue;
    spawnCar(link, s); placed++;
  }
}

/* ---------- car physics helpers ---------- */
function leaderGap(c){
  let best = Infinity;
  if(c.conn){
    const NL = c.conn.nextLink;
    for(const o of NL.cars){
      const g = (c.conn.len - c.s) + o.s - (o.L+c.L)/2 - 4;
      if(g < best) best = g;
    }
    for(const o of cars){
      if(!o.conn || o === c) continue;
      if(o.conn.fromLink === c.conn.fromLink){
        // diverter from my own approach: shared start point, compare progress
        if(o.s > c.s){
          const g = o.s - c.s - (o.L+c.L)/2 - 4;
          if(g < best) best = g;
        }
      } else if(o.conn.nextLink === NL){
        // compare distance-to-lane-entry across the two different chords;
        // only the car that is actually behind yields (no mutual freeze)
        const myRem = c.conn.len - c.s, oRem = o.conn.len - o.s;
        if(oRem < myRem){
          const g = myRem - oRem - (o.L+c.L)/2 - 4;
          if(g < best) best = g;
        }
      }
    }
    return best;
  }
  const L = c.link;
  for(const o of L.cars){
    if(o === c || o.s <= c.s) continue;
    const g = (o.s - c.s) - (o.L+c.L)/2 - 4;
    if(g < best) best = g;
  }
  if(best < Infinity) return best;
  const NL = c.nextLink;
  if(!NL) return Infinity;
  for(const o of cars){                       // cars clearing the intersection ahead of me
    if(o.conn && o.conn.nextLink === NL){
      // distance from my centre to the shared lane entry, minus theirs
      const g = (L.len - c.s) + c.connAhead - (o.conn.len - o.s) - (o.L+c.L)/2 - 4;
      if(g < best) best = g;
    } else if(o.conn && o.conn.fromLink === L){
      // a vehicle from my own approach diverging inside the box is still my leader
      const g = (L.len - c.s) + o.s - (o.L+c.L)/2 - 4;
      if(g < best) best = g;
    }
  }
  if(best < Infinity) return best;
  for(const o of NL.cars){
    const g = (L.len - c.s) + c.connAhead + o.s - (o.L+c.L)/2 - 4;
    if(g < best) best = g;
  }
  return best;
}
function pedNear(T){
  const r2 = 75*75;
  for(const p of peds){
    if(p.state !== 'cross') continue;
    const dx = p.x-T.x, dy = p.y-T.y;
    if(dx*dx+dy*dy < r2) return true;
  }
  return false;
}
/* Intersection access uses a conflict-class reservation ("the box"):
   a car claims entry as its nose reaches the stop line and releases
   when it lands on the departure lane. Non-conflicting movements
   (tandems from one approach, opposing straights) share the box;
   merges and left turns get it exclusively. Entry also requires exit
   room, so the box can never jam. */
function gateInfo(c){
  const L = c.link, T = L.b;
  if(T.boundary || !T.st) return null;
  const axis = Math.abs(L.ux) > 0.5 ? 'ew' : 'ns';
  const sAxis = T.st[axis];
  const stopS = L.len - 16;
  const dLine = stopS - (c.s + c.L/2);
  if(dLine <= -2) return {committed:true};
  let ok = true;
  if(sAxis === 'r') ok = false;
  else if(sAxis === 'y' && dLine > (c.v*c.v)/(2*HARD) + 4) ok = false;  // can still stop
  if(ok){
    for(const m of T.box){
      if(m.car === c) continue;
      if(m.fromLink !== L && (m.toLink === c.nextLink || m.turn === -1 || c.turnNext === -1)){
        ok = false; break;
      }
    }
  }
  if(ok && c.turnNext !== 0 && pedNear(T)) ok = false;  // turns wait for pedestrians
  if(ok && c.nextLink){                                 // don't enter behind a stopped queue
    const room = c.L/2 + 6;
    for(const o of c.nextLink.cars){
      if(o.s < o.L/2 + room && o.v < 10){ ok = false; break; }
    }
    if(ok) for(const o of cars){
      if(o.conn && o.conn.nextLink === c.nextLink && o.v < 10 &&
         (o.conn.len - o.s) < o.L/2 + c.L + 8){ ok = false; break; }
    }
  }
  return {committed:false, ok, dLine, stopS, sAxis, L, T};
}
function updateCarPos(c){
  if(c.conn){
    const t = clamp(c.s / c.conn.len, 0, 1);
    c.x = c.conn.ax + (c.conn.bx - c.conn.ax)*t;
    c.y = c.conn.ay + (c.conn.by - c.conn.ay)*t;
  } else {
    c.x = c.link.sx + c.link.ux*c.s;
    c.y = c.link.sy + c.link.uy*c.s;
  }
}
function updateCar(c, dt){
  let vmax = c.vmax;
  if(c.conn){ if(c.conn.turn) vmax = Math.min(vmax, 54); }
  else if(c.turnNext !== 0 && c.link.len - c.s < 90) vmax = Math.min(vmax, 56);
  const gL = leaderGap(c);
  let vAllow = Math.min(vmax, Math.sqrt(2*COMF*Math.max(0, gL)));
  let g = null;
  if(!c.conn){
    g = gateInfo(c);
    if(g && !g.committed && !g.ok){
      vAllow = Math.min(vAllow, Math.sqrt(2*COMF*Math.max(0, g.dLine - 4)));
    } else if(g && !g.committed && c.turnNext === 0 && g.sAxis !== 'r' && g.dLine > -4){
      // straight through: let finishing pedestrians clear the crosswalk
      const cw = g.T.cws[g.L.ux+','+g.L.uy];
      if(cw){
        for(const p of peds){
          if(p.cw !== cw || p.state !== 'cross') continue;
          const lat = (p.x - g.L.ex)*g.L.rx + (p.y - g.L.ey)*g.L.ry;
          if(Math.abs(lat) < c.W/2 + 4.5 && p.q > 0.04 && p.q < 0.96){
            vAllow = Math.min(vAllow, Math.sqrt(2*COMF*Math.max(0, (g.L.len - 13) - (c.s + c.L/2))));
            break;
          }
        }
      }
    }
  }
  c.braking = vAllow < c.v - 4;
  if(vAllow < c.v) c.v = Math.max(vAllow, c.v - HARD*dt);
  else c.v = Math.min(vAllow, c.v + c.acc*dt);
  if(c.v < 0.01) c.v = 0;
  if(c.v < 3) c.waitT += dt; else c.waitT = 0;
  c.s += c.v*dt;

  if(!c.conn && c.s >= c.link.len){
    const L = c.link, T = L.b;
    if(T.boundary){ trips++; tripTimes.push(simTime); removeCar(c); return; }
    const NL = c.nextLink || chooseNextFallback(c);
    const idx = L.cars.indexOf(c); if(idx>=0) L.cars.splice(idx,1);
    c.conn = {ax:L.ex, ay:L.ey, bx:NL.sx, by:NL.sy,
              len:Math.max(0.001, hyp(NL.sx-L.ex, NL.sy-L.ey)),
              fromLink:L, nextLink:NL, turn:(L.ux*NL.uy - L.uy*NL.ux) > 0 ? 1 : (L.ux*NL.ux + L.uy*NL.uy) < 0.9 ? -1 : 0};
    c.s -= L.len;
  } else if(c.conn && c.s >= c.conn.len){
    const NL = c.conn.nextLink, T2 = c.conn.fromLink.b;
    const bi = T2.box.findIndex(m => m.car === c);      // release the box
    if(bi >= 0) T2.box.splice(bi, 1);
    c.s -= c.conn.len; c.conn = null;
    c.link = NL; NL.cars.push(c); chooseNext(c);
  }
  // stop line: join the box or hold behind it (a hard wall — no creeping in)
  if(!c.conn){
    const T = c.link.b;
    if(!T.boundary && T.st){
      const inBox = T.box.some(m => m.car === c);
      if(!inBox){
        const stopS = c.link.len - 16, front = c.s + c.L/2;
        if(front > stopS - 1.5){
          const g2 = gateInfo(c);
          if(g2 && !g2.committed && !g2.ok){
            c.s = stopS - 1.5 - c.L/2; c.v = 0;
          } else {
            T.box.push({car:c, fromLink:c.link, toLink:c.nextLink, turn:c.turnNext});
          }
        }
      }
    }
  }
  updateCarPos(c);
  const ta = c.conn ? Math.atan2(c.conn.by-c.conn.ay, c.conn.bx-c.conn.ax)
                    : Math.atan2(c.link.uy, c.link.ux);
  c.a += angTo(c.a, ta) * Math.min(1, 9*dt);
  c.blinkOn = c.turnNext !== 0 && (c.conn || c.link.len - c.s < 110);
}
function chooseNextFallback(c){ chooseNext(c); return c.nextLink; }

/* ---------- pedestrians ---------- */
function spawnPed(){
  const T = INTERS[(Math.random()*INTERS.length)|0];
  const keys = Object.keys(T.cws);
  const cw = T.cws[keys[(Math.random()*keys.length)|0]];
  peds.push({
    cw, T, side: Math.random()<0.5 ? -1 : 1, q:0, state:'wait',
    v: 20 + Math.random()*10, leaveT:0, fade:1,
    col: PED_COLORS[(Math.random()*PED_COLORS.length)|0],
    ph: Math.random()*TAU, x:0, y:0
  });
}
function updatePed(p, dt){
  const cw = p.cw, st = p.T.st;
  const walk = st && st[cw.walkAxis]==='r' && st.tin > 0.5 && st.tleft > 1.6;
  if(p.state === 'wait'){
    if(walk) p.state = 'cross';
    p.x = cw.cx + cw.px * (-cw.half * p.side);
    p.y = cw.cy + cw.py * (-cw.half * p.side);
  } else if(p.state === 'cross'){
    const sp = walk ? p.v : p.v*1.65;
    p.q += sp*dt/(cw.half*2);
    if(p.q >= 1){ p.q = 1; p.state = 'leave'; p.leaveT = 0; }
    p.x = cw.cx + cw.px * lerp(-cw.half*p.side, cw.half*p.side, p.q);
    p.y = cw.cy + cw.py * lerp(-cw.half*p.side, cw.half*p.side, p.q);
  } else {
    p.leaveT += dt;
    const ext = p.v*p.leaveT;
    p.x = cw.cx + cw.px * (cw.half*p.side + ext);
    p.y = cw.cy + cw.py * (cw.half*p.side + ext);
    if(p.leaveT > 0.6) p.fade = Math.max(0, p.fade - dt*3);
  }
}

/* ---------- main step ---------- */
function step(dt){
  simTime += dt;
  for(const T of INTERS){ T.t += dt; T.st = sigState(T); }
  spawnAcc += dt;
  if(spawnAcc > 0.35){
    spawnAcc = 0;
    if(cars.length < targetCars) trySpawn();
  }
  if(pedsOn){
    pedAcc += dt;
    if(pedAcc > 0.45){ pedAcc = 0; if(peds.length < 34) spawnPed(); }
  }
  for(let i=cars.length-1; i>=0; i--) updateCar(cars[i], dt);
  for(let i=peds.length-1; i>=0; i--){
    updatePed(peds[i], dt);
    if(peds[i].fade <= 0) peds.splice(i,1);
  }
  if(timeMode === 'auto') dayT = (dayT + dt/DAYLEN) % 1;
  // stats EMA + gridlock recovery: when the whole fleet crawls for a long
  // stretch, quietly dissolve one vehicle from the longest dead queue so
  // standing waves can drain again
  if(cars.length){
    let sum = 0; for(const c of cars) sum += c.v;
    const fleetAvg = sum / cars.length;
    avgSpeedEMA = lerp(avgSpeedEMA, fleetAvg, 0.02);
    if(fleetAvg > 6) lastMove = simTime;
    else if(cars.length > 8 && simTime - lastMove > 12){
      let best = null, bn = 2;
      for(const l of links){ if(l.cars.length > bn){ bn = l.cars.length; best = l; } }
      if(best){
        let victim = null;
        const bx = best.b.box;
        for(const o of best.cars){
          if(o.conn || (bx && bx.some(m => m.car === o))) continue;
          if(!victim || o.s > victim.s) victim = o;
        }
        if(victim){ removeCar(victim); lastMove = simTime; }
      }
    }
  }
  while(tripTimes.length && tripTimes[0] < simTime-60) tripTimes.shift();
}

/* ---------- daylight ---------- */
function daylight(){
  if(timeMode === 'day') return 1;
  if(timeMode === 'night') return 0;
  const h = dayT*24;
  const up = clamp((h-5.6)/1.6, 0, 1), down = 1 - clamp((h-19.4)/1.6, 0, 1);
  const sm = t => t*t*(3-2*t);
  return sm(up) * sm(down);
}

/* ---------- rendering ---------- */
function render(now, dt){
  const dl = daylight(), nite = 1-dl;
  // camera targets
  if(cam.follow && followed){
    cam.tx = followed.x; cam.ty = followed.y; cam.ts = fitScale*1.75;
  } else {
    cam.tx = WW/2; cam.ty = WH/2; cam.ts = fitScale;
  }
  const k = 1 - Math.pow(0.0015, Math.min(0.05, dt || 0.016)); // frame-rate aware smoothing
  cam.x = lerp(cam.x, cam.tx, k); cam.y = lerp(cam.y, cam.ty, k);
  cam.s = lerp(cam.s, cam.ts, k);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0,0,cw,ch);
  // stars
  if(nite > 0.05){
    ctx.fillStyle = '#cfe0ff';
    for(const s of stars){
      ctx.globalAlpha = nite * s.a;
      ctx.fillRect(s.x*cw, s.y*ch, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }
  // world drop shadow (screen space)
  const sc = cam.s;
  const px = (wx,wy) => [cw/2 + (wx-cam.x)*sc, ch/2 + (wy-cam.y)*sc];
  const [x0,y0] = px(0,0), [x1,y1] = px(WW,WH);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 46; ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#0d1117';
  rr(ctx, x0, y0, x1-x0, y1-y0, 16); ctx.fill();
  ctx.restore();

  // world space
  ctx.save();
  ctx.translate(cw/2, ch/2); ctx.scale(sc, sc); ctx.translate(-cam.x, -cam.y);
  ctx.beginPath(); ctx.rect(0,0,WW,WH); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  if(nite < 0.995){ ctx.globalAlpha = 1; ctx.drawImage(dayLayer, 0, 0, WW, WH); }
  if(nite > 0.005){ ctx.globalAlpha = nite; ctx.drawImage(nightLayer, 0, 0, WW, WH); ctx.globalAlpha = 1; }

  // drifting haze (day only)
  if(dl > 0.05){
    ctx.fillStyle = 'rgba(255,255,255,' + (0.05*dl) + ')';
    for(let i=0;i<3;i++){
      const cx2 = ((simTime*(9+i*4) + i*700) % (WW+700)) - 350;
      const cy2 = WH*(0.2 + 0.3*i);
      const g = ctx.createRadialGradient(cx2,cy2,10, cx2,cy2,260);
      g.addColorStop(0,'rgba(255,255,255,' + (0.075*dl) + ')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx2,cy2,260,150,0,0,TAU); ctx.fill();
    }
  }
  drawSignals();
  drawPeds(now);
  drawCars(nite, dl, now);

  // border
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2/sc;
  rr(ctx, 1, 1, WW-2, WH-2, 14); ctx.stroke();
  ctx.restore();
}

function drawSignals(){
  const COLS = {g:'#3fd97f', y:'#ffc94d', r:'#ff5d5d'};
  ctx.lineCap = 'round';
  for(const T of INTERS){
    const st = T.st; if(!st) continue;
    for(const l of T.inp){
      const axis = Math.abs(l.ux) > 0.5 ? 'ew' : 'ns';
      const s = st[axis];
      const ax = T.x - l.ux*(RH+17), ay = T.y - l.uy*(RH+17);
      const bx = ax + l.rx*(RH-4), by = ay + l.ry*(RH-4);
      ctx.strokeStyle = COLS[s]; ctx.lineWidth = 3.2;
      ctx.shadowColor = COLS[s]; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
      // signal head just off the corner
      const hx = ax + l.rx*(RH+8), hy2 = ay + l.ry*(RH+8);
      ctx.fillStyle = COLS[s];
      ctx.beginPath(); ctx.arc(hx, hy2, 2.4, 0, TAU); ctx.fill();
    }
  }
  ctx.shadowBlur = 0; ctx.lineCap = 'butt';
}

function drawPeds(now){
  for(const p of peds){
    ctx.save();
    ctx.globalAlpha = p.fade;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(p.x+0.8, p.y+1.4, 3.4, 2, 0, 0, TAU); ctx.fill();
    const bob = p.state==='cross' ? Math.sin(now*0.009 + p.ph)*0.9 : 0;
    const ox = p.cw.py*bob, oy = p.cw.px*bob;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.ellipse(p.x+ox, p.y+oy, 2.6, 3.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 1.35, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawCars(nite, dl, now){
  const blink = (simTime*2.4) % 1 < 0.55;
  // headlight beams first (under bodies)
  if(nite > 0.08){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(const c of cars){
      ctx.save();
      ctx.translate(c.x, c.y); ctx.rotate(c.a);
      const g = ctx.createRadialGradient(c.L/2+4,0,1, c.L/2+16,0,34);
      g.addColorStop(0,'rgba(255,242,196,' + (0.20*nite) + ')');
      g.addColorStop(1,'rgba(255,242,196,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(c.L/2, -c.W*0.34); ctx.lineTo(c.L/2+32, -c.W*1.25);
      ctx.lineTo(c.L/2+32, c.W*1.25); ctx.lineTo(c.L/2, c.W*0.34);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // bodies
  for(const c of cars){
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.a);
    const L = c.L, W = c.W;
    if(dl > 0.25){
      ctx.fillStyle = 'rgba(25,35,50,' + (0.24*dl) + ')';
      rr(ctx, -L/2+1.6, -W/2+2.2, L, W, 4); ctx.fill();
    }
    ctx.fillStyle = c.col[0];
    rr(ctx, -L/2, -W/2, L, W, W*0.3); ctx.fill();
    ctx.strokeStyle = c.col[1]; ctx.lineWidth = 1; ctx.stroke();
    if(c.kind === 'truck'){
      ctx.fillStyle = '#c6ccd6'; rr(ctx, -L/2+1, -W/2+1.5, L*0.62, W-3, 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.14)';
      for(let k=1;k<4;k++){ const xx = -L/2+1 + (L*0.62)*k/4;
        ctx.beginPath(); ctx.moveTo(xx,-W/2+2); ctx.lineTo(xx,W/2-2); ctx.stroke(); }
    }
    if(c.kind === 'bus'){
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      rr(ctx, -L/2+3, -W/2+2, L-8, W-4, 2); ctx.fill();
      ctx.fillStyle = 'rgba(15,25,35,0.8)';
      for(let k=0;k<5;k++){ const xx = -L/2+5 + k*(L-14)/4.6;
        ctx.fillRect(xx, -W/2+1.2, 4.5, 2); ctx.fillRect(xx, W/2-3.2, 4.5, 2); }
    }
    // windshield + roof
    ctx.fillStyle = '#243140';
    rr(ctx, L*0.06, -W/2+1.8, L*0.24, W-3.6, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    rr(ctx, -L*0.26, -W/2+2, L*0.32, W-4, 2); ctx.fill();
    ctx.fillStyle = '#243140';
    rr(ctx, -L*0.40, -W/2+2.4, L*0.10, W-4.8, 1.5); ctx.fill();
    if(c.kind === 'taxi'){
      ctx.fillStyle = '#161a22'; ctx.fillRect(-L*0.08, -2.2, 6, 4.4);
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(-L*0.08+1, -1.4, 4, 2.8);
    }
    // head / tail lights
    ctx.fillStyle = nite > 0.3 ? '#fff6cf' : '#efe6c0';
    ctx.fillRect(L/2-2.4, -W/2+1.4, 1.9, 2.6); ctx.fillRect(L/2-2.4, W/2-4, 1.9, 2.6);
    const tl = c.braking ? '#ff4b3a' : '#b23527';
    ctx.fillStyle = tl;
    ctx.fillRect(-L/2+0.6, -W/2+1.4, 1.7, 2.6); ctx.fillRect(-L/2+0.6, W/2-4, 1.7, 2.6);
    ctx.restore();
  }
  // glows / blinkers (over bodies)
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(const c of cars){
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.a);
    const L = c.L, W = c.W;
    if(nite > 0.1){
      ctx.fillStyle = 'rgba(255,246,207,' + (0.75*nite) + ')';
      ctx.beginPath(); ctx.arc(L/2-1.4, -W/2+2.6, 1.4, 0, TAU); ctx.arc(L/2-1.4, W/2-2.6, 1.4, 0, TAU); ctx.fill();
    }
    if(nite > 0.15 && c.braking){
      ctx.fillStyle = 'rgba(255,64,48,' + (0.55*nite) + ')';
      ctx.beginPath(); ctx.arc(-L/2+1.4, -W/2+2.6, 1.8, 0, TAU); ctx.arc(-L/2+1.4, W/2-2.6, 1.8, 0, TAU); ctx.fill();
    }
    if(c.blinkOn && blink){
      const side = c.turnNext;
      ctx.fillStyle = '#ffb02e'; ctx.shadowColor = '#ffb02e'; ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(L/2-3, side*(W/2-1.4), 1.7, 0, TAU);
      ctx.arc(-L/2+2.6, side*(W/2-1.4), 1.7, 0, TAU);
      ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  ctx.restore();
  // followed highlight
  if(cam.follow && followed){
    const c = followed;
    ctx.save();
    ctx.strokeStyle = '#ffcf6e'; ctx.lineWidth = 1.6/cam.s;
    ctx.setLineDash([6/cam.s, 5/cam.s]); ctx.lineDashOffset = -(now*0.02)%(11/cam.s);
    ctx.beginPath(); ctx.arc(c.x, c.y, c.L*0.85, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
const carCard = $('carCard');
let hudAcc = 0;
function fmtClock(){
  const h = Math.floor(dayT*24), m = Math.floor((dayT*24 - h)*60);
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function updateHUD(){
  $('clock').textContent = fmtClock();
  const dl = daylight(), h = dayT*24;
  let lbl;
  if(timeMode === 'day') lbl = 'Day';
  else if(timeMode === 'night') lbl = 'Night';
  else if(dl > 0.8) lbl = 'Day';
  else if(dl < 0.15) lbl = 'Night';
  else lbl = h < 12 ? 'Dawn' : 'Dusk';
  $('modeChip').textContent = lbl;
  $('stVeh').textContent = cars.length;
  $('stSpd').textContent = Math.round(avgSpeedEMA*KMH) + ' km/h';
  $('stTrips').textContent = trips;
  $('stFlow').textContent = tripTimes.length;
  let stopped = 0; for(const c of cars) if(c.v < 2) stopped++;
  $('stStop').textContent = stopped;
  let load = 0;
  if(cars.length){ for(const c of cars) load += 1 - c.v/c.vmax; load = clamp(load/cars.length, 0, 1); }
  $('stLoadPct').textContent = Math.round(load*100) + '%';
  $('stLoadBar').style.width = (load*100).toFixed(1) + '%';
  if(cam.follow && followed){
    const c = followed;
    $('carChip').style.background = c.col[0];
    $('carName').textContent = c.name + ' #' + c.id;
    $('carSpd').textContent = Math.round(c.v*KMH) + ' km/h';
    let st = 'Cruising';
    if(c.conn) st = c.conn.turn ? (c.conn.turn>0?'Turning right':'Turning left') : 'Crossing';
    else if(c.v < 2) st = c.waitT > 1 ? 'Waiting at signal' : 'Stalled';
    else if(c.braking) st = 'Slowing';
    $('carState').textContent = st;
    $('carWait').textContent = Math.round(c.waitT) + ' s';
  }
}

/* ---------- input & controls ---------- */
$('playBtn').addEventListener('click', togglePlay);
function togglePlay(){
  running = !running;
  $('playBtn').querySelector('span').textContent = running ? 'Pause' : 'Resume';
  $('playBtn').querySelector('svg').innerHTML = running
    ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
  $('liveDot').classList.toggle('paused', !running);
}
document.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if(tag === 'BUTTON' || tag === 'INPUT') e.target.blur();
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if(e.code === 'Escape'){ followed = null; cam.follow = false; carCard.classList.remove('on'); }
});
document.querySelectorAll('#speedSeg button').forEach(b => {
  b.addEventListener('click', () => {
    simSpeed = +b.dataset.s;
    document.querySelectorAll('#speedSeg button').forEach(x => x.classList.toggle('active', x===b));
  });
});
$('density').addEventListener('input', e => {
  targetCars = +e.target.value;
  $('densityVal').textContent = targetCars;
});
$('pedsToggle').addEventListener('change', e => { pedsOn = e.target.checked; });
$('timeBtn').addEventListener('click', () => {
  timeMode = timeMode === 'auto' ? 'day' : timeMode === 'day' ? 'night' : 'auto';
  $('timeBtn').textContent = 'Cycle · ' + timeMode[0].toUpperCase() + timeMode.slice(1);
});
$('resetBtn').addEventListener('click', reset);
$('unfollow').addEventListener('click', () => {
  followed = null; cam.follow = false; carCard.classList.remove('on');
});
canvas.addEventListener('click', e => {
  const wxm = (e.clientX - cw/2)/cam.s + cam.x;
  const wym = (e.clientY - ch/2)/cam.s + cam.y;
  let best = null, bd = 26*26;
  for(const c of cars){
    const dx = c.x-wxm, dy = c.y-wym, d = dx*dx+dy*dy;
    if(d < bd){ bd = d; best = c; }
  }
  if(best){ followed = best; cam.follow = true; carCard.classList.add('on'); }
  else { followed = null; cam.follow = false; carCard.classList.remove('on'); }
});
canvas.addEventListener('mousemove', e => {
  const wxm = (e.clientX - cw/2)/cam.s + cam.x;
  const wym = (e.clientY - ch/2)/cam.s + cam.y;
  let hover = false;
  for(const c of cars){
    const dx = c.x-wxm, dy = c.y-wym;
    if(dx*dx+dy*dy < 22*22){ hover = true; break; }
  }
  canvas.style.cursor = hover ? 'pointer' : 'default';
});

/* ---------- resize ---------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = Math.round(cw*dpr); canvas.height = Math.round(ch*dpr);
  canvas.style.width = cw+'px'; canvas.style.height = ch+'px';
  fitScale = Math.min(cw/WW, ch/WH) * 0.965;
  stars = [];
  for(let i=0;i<110;i++) stars.push({x:Math.random(), y:Math.random(),
                                     a:0.15+Math.random()*0.7, s:Math.random()<0.2?2:1});
}
window.addEventListener('resize', resize);

/* ---------- reset & boot ---------- */
function reset(){
  for(const c of cars.slice()) removeCar(c);
  cars = []; peds = []; tripTimes = []; trips = 0; simTime = 0; dayT = 0.38; lastMove = 0;
  followed = null; cam.follow = false; carCard.classList.remove('on');
  for(const l of links) l.cars.length = 0;
  for(const T of INTERS) T.box.length = 0;
  spawnInitial();
}

buildCity();
resize();
dayLayer = drawStaticLayer(PAL.day, false);
nightLayer = drawStaticLayer(PAL.night, true);
for(const T of INTERS) T.st = sigState(T);
reset();

/* ---------- main loop ---------- */
let last = performance.now(), acc2 = 0;
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;
  if(running){
    acc2 += dt*simSpeed;
    let steps = 0;
    while(acc2 >= STEP && steps < 8){ step(STEP); acc2 -= STEP; steps++; }
    if(steps === 8) acc2 = 0;
  }
  render(now, dt);
  hudAcc += dt;
  if(hudAcc > 0.15){ hudAcc = 0; updateHUD(); }
}
requestAnimationFrame(loop);
</script>
</body>
