<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Biped — Three.js Walk Cycle</title>
<style>
  :root {
    --ink: #e8ecf2;
    --ink-dim: #9aa4b2;
    --accent: #ff6a3d;
    --panel: rgba(14, 17, 24, 0.72);
    --line: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #0d1017;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  /* soft vignette over the 3D stage */
  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(4, 6, 10, 0.55) 100%);
  }

  header {
    position: fixed; top: 22px; left: 26px;
    pointer-events: none; user-select: none;
  }
  header h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  header h1 em { color: var(--accent); font-style: normal; }
  header p {
    margin: 7px 0 0;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
  }

  #panel {
    position: fixed; left: 26px; bottom: 24px;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 11px;
    font: inherit; font-size: 10.5px; letter-spacing: 0.12em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.22); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 13px; height: 13px; fill: currentColor; flex: none; }
  .btn.icon { padding: 7px 9px; }
  .btn.icon.playing { color: var(--accent); border-color: rgba(255, 106, 61, 0.45); }

  .ctl { display: flex; align-items: center; gap: 10px; }
  .ctl label { font-size: 10px; letter-spacing: 0.16em; color: var(--ink-dim); }
  .ctl input[type="range"] {
    width: 130px; accent-color: var(--accent); cursor: pointer;
  }
  .ctl .val { font-size: 11px; min-width: 44px; text-align: right; color: var(--ink); }

  .readout {
    display: flex; flex-direction: column; gap: 3px;
    padding-left: 16px;
    border-left: 1px solid var(--line);
    font-size: 10px; letter-spacing: 0.08em;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .readout b { color: var(--ink); font-weight: 600; }

  #hints {
    position: fixed; right: 26px; bottom: 26px;
    font-size: 10px; letter-spacing: 0.12em;
    color: var(--ink-dim);
    pointer-events: none; user-select: none;
    text-align: right;
  }
  #hints span { color: rgba(255, 255, 255, 0.35); margin: 0 5px; }

  #veil {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #0d1017;
    transition: opacity 0.6s ease;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  .veil-inner {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .pulse {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.55); opacity: 0.35; }
    50% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 760px) {
    #hints { display: none; }
    #panel { flex-wrap: wrap; gap: 10px 14px; max-width: calc(100vw - 40px); }
    .readout { border-left: none; padding-left: 0; flex-direction: row; gap: 14px; }
  }
</style>
</head>
<body>

<div id="vignette"></div>

<header>
  <h1>Procedural <em>Biped</em></h1>
  <p>three.js · kinematic walk cycle · zero keyframes</p>
</header>

<div id="panel">
  <button id="play" class="btn icon playing" aria-label="Pause animation" title="Play / Pause (Space)">
    <svg id="icoPause" viewBox="0 0 14 14" aria-hidden="true">
      <rect x="2.4" y="1.6" width="3.4" height="10.8" rx="1.1"></rect>
      <rect x="8.2" y="1.6" width="3.4" height="10.8" rx="1.1"></rect>
    </svg>
    <svg id="icoPlay" viewBox="0 0 14 14" aria-hidden="true" style="display:none">
      <path d="M3.4 1.7 L12.2 7 L3.4 12.3 Z"></path>
    </svg>
  </button>

  <div class="ctl">
    <label for="speed">SPEED</label>
    <input id="speed" type="range" min="0" max="2.2" step="0.01" value="1" aria-label="Walking speed">
    <span id="speedVal" class="val">1.00×</span>
  </div>

  <button id="resetCam" class="btn" title="Reset camera (R)">
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <rect x="1.2" y="3.4" width="8.4" height="7.2" rx="1.4"></rect>
      <path d="M9.6 6.2 L12.8 4.2 L12.8 9.8 L9.6 7.8 Z"></path>
    </svg>
    <span>CAMERA</span>
  </button>

  <div class="readout">
    <span>velocity <b id="roV">0.00 m/s</b></span>
    <span>cadence <b id="roC">0.0 steps/s</b></span>
  </div>
</div>

<div id="hints">drag orbit<span>·</span>scroll zoom<span>·</span>space pause<span>·</span>R camera</div>

<div id="veil">
  <div class="veil-inner"><span class="pulse"></span><span id="veilText">loading three.js</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/* helpers                                                             */
/* ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (t) => t * t * (3 - 2 * t);

/* ------------------------------------------------------------------ */
/* gait tuning (radians / meters)                                      */
/* ------------------------------------------------------------------ */
const CFG = {
  pathRadius: 6.5,      // radius of the circular walk path (m)
  pelvisY: 0.989,       // nominal hip height (solved so the heel meets y=0
                        // exactly at heel-strike; residual contact error
                        // stays under ~2 cm across the whole cycle)
  bobAmp: 0.019,        // vertical pelvis oscillation, twice per cycle
  hipAmp: 0.42,         // max hip swing angle
  kneeBase: 0.14,       // slight stance knee flex
  swingKnee: 0.95,      // extra knee flex at mid swing
  ankleAmp: 0.35,       // ankle articulation amplitude
  anklePhase: -Math.PI, // dorsi peak at heel-strike, flat at mid-stance,
                        // plantar peak at toe-off
  armAmp: 0.50,         // shoulder swing amplitude (counter to legs)
  cadence: 0.95,        // walk cycles per second at speed 1.0
  sole: 0.114,          // ankle pivot to sole distance
  legReach: 0.86        // hip pivot to ankle pivot distance
};

/* ------------------------------------------------------------------ */
/* renderer / scene / camera                                           */
/* ------------------------------------------------------------------ */
const veil = $('veil');
const veilText = $('veilText');
let veilGone = false;
window.addEventListener('error', (e) => {
  if (!veilGone) veilText.textContent = 'load failed — ' + (e.message || 'unknown error');
}, true);
window.addEventListener('unhandledrejection', () => {
  if (!veilGone) veilText.textContent = 'load failed — check network / CDN access';
});

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  veilText.textContent = 'WebGL is not available in this browser';
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1017);
scene.fog = new THREE.Fog(0x0d1017, 14, 34);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.5;

/* image-based ambience for the PBR materials */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.3;
  pmrem.dispose();
}

/* ------------------------------------------------------------------ */
/* lights                                                              */
/* ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0x9db8ff, 0x2c2622, 0.55));

const key = new THREE.DirectionalLight(0xffe9d0, 2.6);
key.position.set(6, 10, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -11;
key.shadow.camera.right = 11;
key.shadow.camera.top = 11;
key.shadow.camera.bottom = -11;
key.shadow.camera.near = 2;
key.shadow.camera.far = 30;
key.shadow.camera.updateProjectionMatrix();
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.03;
scene.add(key);
scene.add(key.target);

const rim = new THREE.DirectionalLight(0x7fd8ff, 1.1);
rim.position.set(-7, 5, -6);
scene.add(rim);

/* ------------------------------------------------------------------ */
/* ground                                                              */
/* ------------------------------------------------------------------ */
function makeGroundTexture() {
  const S = 1024;
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = S;
  const g = cnv.getContext('2d');
  const c = S / 2;
  const px = (S / 2) / 15; // pixels per meter (ground radius 15 m)

  g.fillStyle = '#151923';
  g.fillRect(0, 0, S, S);

  // faint radial spokes
  g.strokeStyle = 'rgba(255,255,255,0.030)';
  g.lineWidth = 1.5;
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * TAU;
    g.beginPath();
    g.moveTo(c + Math.cos(a) * px * 1.2, c + Math.sin(a) * px * 1.2);
    g.lineTo(c + Math.cos(a) * px * 14.8, c + Math.sin(a) * px * 14.8);
    g.stroke();
  }

  // concentric survey rings
  for (let r = 1; r <= 14; r++) {
    g.strokeStyle = r === 7 ? 'rgba(255,255,255,0.055)' : 'rgba(255,255,255,0.035)';
    g.lineWidth = r === 7 ? 3 : 1.5;
    g.beginPath();
    g.arc(c, c, r * px, 0, TAU);
    g.stroke();
  }

  // dashed marker ring on the walk path
  g.strokeStyle = 'rgba(255,140,90,0.20)';
  g.lineWidth = 4;
  g.setLineDash([26, 18]);
  g.beginPath();
  g.arc(c, c, CFG.pathRadius * px, 0, TAU);
  g.stroke();
  g.setLineDash([]);

  const tex = new THREE.CanvasTexture(cnv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(15, 72),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 0.94, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* perimeter pylons for depth */
const mat = {
  body:   new THREE.MeshStandardMaterial({ color: 0xe9e6dd, roughness: 0.50, metalness: 0.08 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x272c35, roughness: 0.55, metalness: 0.45 }),
  joint:  new THREE.MeshStandardMaterial({ color: 0x1b1f27, roughness: 0.40, metalness: 0.60 }),
  accent: new THREE.MeshStandardMaterial({ color: 0xff6a3d, roughness: 0.45, metalness: 0.15 }),
  warm:   new THREE.MeshStandardMaterial({ color: 0x2a1208, emissive: 0xff6a3d, emissiveIntensity: 2.0, roughness: 0.4 }),
  eye:    new THREE.MeshStandardMaterial({ color: 0x06141a, emissive: 0x8ef4ff, emissiveIntensity: 2.6, roughness: 0.3 })
};
{
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU + 0.31;
    const r = 10.4 + Math.sin(i * 3.7) * 0.9;
    const h = 1.2 + 0.9 * (0.5 + 0.5 * Math.sin(i * 12.9898));
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, h, 10), mat.dark);
    pole.position.set(Math.sin(a) * r, h / 2, Math.cos(a) * r);
    scene.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.09), mat.warm);
    lamp.position.set(Math.sin(a) * r, h + 0.07, Math.cos(a) * r);
    scene.add(lamp);
  }
}

/* ------------------------------------------------------------------ */
/* the biped — a jointed rig built from primitives, facing +Z          */
/* ------------------------------------------------------------------ */
function addBox(parent, w, h, d, r, m, x, y, z) {
  const mesh = new THREE.Mesh(
    new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)), m
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addBall(parent, r, m, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 16), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addCyl(parent, rt, rb, h, m, x, y, z, rotZ) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 14), m);
  mesh.position.set(x, y, z);
  if (rotZ) mesh.rotation.z = rotZ;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
/* capsule limb segment: pivot at group origin, next joint at y = -L */
function segment(joint, L, r, m) {
  const mesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(r, Math.max(0.02, L - 2 * r), 6, 16), m
  );
  mesh.position.y = -L / 2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  joint.add(mesh);
}

function buildBiped() {
  const root = new THREE.Group();
  const lean = new THREE.Group(); // banking / forward lean, layered under lookAt
  root.add(lean);
  const pelvis = new THREE.Group();
  pelvis.position.y = CFG.pelvisY;
  lean.add(pelvis);

  /* pelvis block */
  addBox(pelvis, 0.46, 0.26, 0.30, 0.07, mat.body, 0, 0.02, 0);
  addBox(pelvis, 0.48, 0.07, 0.33, 0.03, mat.accent, 0, 0.17, 0);

  /* torso */
  const torso = new THREE.Group();
  torso.position.y = 0.16;
  pelvis.add(torso);
  const chest = addBox(torso, 0.56, 0.52, 0.34, 0.09, mat.body, 0, 0.30, 0);
  addBox(torso, 0.34, 0.30, 0.13, 0.05, mat.dark, 0, 0.30, -0.21); // backpack
  addBox(torso, 0.15, 0.15, 0.05, 0.02, mat.warm, 0, 0.33, 0.19);  // core light
  addBox(torso, 0.30, 0.10, 0.20, 0.03, mat.dark, 0, 0.60, 0);     // collar
  addBox(torso, 0.17, 0.13, 0.21, 0.05, mat.accent, 0.345, 0.52, 0); // shoulder pads
  addBox(torso, 0.17, 0.13, 0.21, 0.05, mat.accent, -0.345, 0.52, 0);

  /* head */
  const head = new THREE.Group();
  head.position.y = 0.70;
  torso.add(head);
  addCyl(head, 0.05, 0.062, 0.12, mat.dark, 0, 0.02, 0);           // neck
  addBox(head, 0.32, 0.27, 0.29, 0.08, mat.body, 0, 0.19, 0);
  addBox(head, 0.26, 0.11, 0.06, 0.03, mat.dark, 0, 0.205, 0.135); // visor
  const eyeL = addBall(head, 0.026, mat.eye, 0.062, 0.205, 0.170);
  const eyeR = addBall(head, 0.026, mat.eye, -0.062, 0.205, 0.170);
  addCyl(head, 0.05, 0.05, 0.055, mat.dark, 0.175, 0.19, 0, Math.PI / 2);  // ear pods
  addCyl(head, 0.05, 0.05, 0.055, mat.dark, -0.175, 0.19, 0, Math.PI / 2);
  const antenna = new THREE.Group();
  antenna.position.set(0.075, 0.33, -0.035);
  head.add(antenna);
  addCyl(antenna, 0.011, 0.011, 0.20, mat.dark, 0, 0.10, 0);
  addBall(antenna, 0.032, mat.warm, 0, 0.21, 0);

  /* legs: hip -> knee -> ankle, left leg at +X */
  function makeLeg(side) {
    const hip = new THREE.Group();
    hip.position.set(side * 0.175, -0.02, 0);
    pelvis.add(hip);
    addBall(hip, 0.085, mat.joint, 0, 0, 0);
    segment(hip, 0.44, 0.078, mat.body);
    const knee = new THREE.Group();
    knee.position.y = -0.44;
    hip.add(knee);
    addBall(knee, 0.075, mat.joint, 0, 0, 0);
    segment(knee, 0.42, 0.060, mat.body);
    addCyl(knee, 0.064, 0.064, 0.05, mat.accent, 0, -0.21, 0); // shin band
    const ankle = new THREE.Group();
    ankle.position.y = -0.42;
    knee.add(ankle);
    addBall(ankle, 0.055, mat.joint, 0, 0, 0);
    addBox(ankle, 0.16, 0.09, 0.34, 0.035, mat.body, 0, -0.05, 0.055);  // foot
    addBox(ankle, 0.168, 0.036, 0.375, 0.014, mat.dark, 0, -0.096, 0.055); // sole
    addBox(ankle, 0.16, 0.065, 0.07, 0.02, mat.accent, 0, -0.05, 0.225);  // toe cap
    return { hip, knee, ankle, side, phaseOff: side > 0 ? 0 : Math.PI, prevPlant: -1e9 };
  }

  /* arms: shoulder -> elbow, opposite phase to the same-side leg */
  function makeArm(side) {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.37, 0.50, 0);
    torso.add(shoulder);
    addBall(shoulder, 0.07, mat.joint, 0, 0, 0);
    segment(shoulder, 0.30, 0.056, mat.body);
    const elbow = new THREE.Group();
    elbow.position.y = -0.30;
    shoulder.add(elbow);
    addBall(elbow, 0.06, mat.joint, 0, 0, 0);
    segment(elbow, 0.28, 0.048, mat.body);
    addBox(elbow, 0.085, 0.12, 0.095, 0.03, mat.dark, 0, -0.335, 0); // hand
    return { shoulder, elbow, side, phaseOff: side > 0 ? 0 : Math.PI };
  }

  return {
    root, lean, pelvis, torso, chest, head, antenna,
    eyeL, eyeR,
    legs: [makeLeg(1), makeLeg(-1)],
    arms: [makeArm(1), makeArm(-1)]
  };
}

const B = buildBiped();
scene.add(B.root);

/* fake contact-shadow blobs under the feet (ground the character) */
function makeBlob() {
  const m = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false });
  const b = new THREE.Mesh(new THREE.CircleGeometry(0.14, 24), m);
  b.rotation.x = -Math.PI / 2;
  b.renderOrder = 2;
  scene.add(b);
  return b;
}
const blobL = makeBlob();
const blobR = makeBlob();

/* ------------------------------------------------------------------ */
/* dust puffs on foot plant                                            */
/* ------------------------------------------------------------------ */
function makeDustTexture() {
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = 64;
  const g = cnv.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cnv);
}
const dustTex = makeDustTexture();
const DUST_N = 56;
const dust = [];
for (let i = 0; i < DUST_N; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: dustTex, color: 0x9aa6b8, transparent: true, opacity: 0, depthWrite: false
  }));
  s.visible = false;
  s.userData = { vel: new THREE.Vector3(), age: 0, life: 1, size: 0.1, op: 0.3 };
  scene.add(s);
  dust.push(s);
}
let dustCursor = 0;

function spawnDust(pos, intensity) {
  const n = 5;
  for (let i = 0; i < n; i++) {
    const s = dust[dustCursor];
    dustCursor = (dustCursor + 1) % DUST_N;
    const a = Math.random() * TAU;
    const rr = Math.random() * 0.07;
    s.position.set(pos.x + Math.cos(a) * rr, 0.03 + Math.random() * 0.03, pos.z + Math.sin(a) * rr);
    const out = 0.25 + Math.random() * 0.45;
    s.userData.vel.set(Math.cos(a + 1.3) * out, 0.4 + Math.random() * 0.5, Math.sin(a + 1.3) * out);
    s.userData.age = 0;
    s.userData.life = 0.45 + Math.random() * 0.35;
    s.userData.size = 0.08 + Math.random() * 0.06;
    s.userData.op = 0.30 * intensity;
    s.visible = true;
  }
}

function updateDust(dt) {
  for (const s of dust) {
    if (!s.visible) continue;
    const u = s.userData;
    u.age += dt;
    if (u.age >= u.life) { s.visible = false; continue; }
    u.vel.y -= 1.4 * dt;
    u.vel.multiplyScalar(Math.max(0, 1 - 1.6 * dt));
    s.position.addScaledVector(u.vel, dt);
    const k = u.age / u.life;
    const sc = u.size + 0.5 * u.age;
    s.scale.set(sc, sc, 1);
    s.material.opacity = u.op * Math.pow(1 - k, 2);
  }
}

/* ------------------------------------------------------------------ */
/* state                                                               */
/* ------------------------------------------------------------------ */
const HOME_OFF = new THREE.Vector3(4.2, 1.9, 5.1); // camera offset from character
const state = {
  sliderSpeed: 1.0,
  playing: true,
  speed: 0,          // smoothed locomotion speed
  phi: 0,            // gait phase (rad), left leg = phi, right leg = phi + PI
  theta: -Math.PI / 2, // position on the circular path
  t: 0,
  idleT: 0,
  bobPrev: 0,
  prevChar: new THREE.Vector3(),
  camAnim: null,
  roTimer: 0
};
const ant = { px: 0, vx: 0, pz: 0, vz: 0 }; // antenna spring
let blinkClock = 2.6;
let blinkT = -1;

/* place character + camera at start */
function pathPoint(theta, out) {
  return out.set(
    CFG.pathRadius * Math.sin(theta), 0, CFG.pathRadius * Math.cos(theta)
  );
}
{
  const p = pathPoint(state.theta, new THREE.Vector3());
  B.root.position.copy(p);
  state.prevChar.copy(p);
  camera.position.copy(p).add(HOME_OFF);
  controls.target.set(p.x, 1.05, p.z);
}

/* ------------------------------------------------------------------ */
/* pose: pure functions of phase — no keyframes anywhere               */
/* ------------------------------------------------------------------ */
const tmpA = new THREE.Vector3();
const tmpB = new THREE.Vector3();

function applyGait(phi, amp, idleW, idleT, turn) {
  const c2 = Math.cos(2 * phi);

  /* pelvis: bob, sway over the stance foot, pelvic yaw + roll */
  B.pelvis.position.y = CFG.pelvisY + CFG.bobAmp * amp * c2;
  B.pelvis.position.x = -0.055 * amp * Math.cos(phi - 0.5);
  B.pelvis.rotation.set(0, -0.14 * amp * Math.cos(phi - 0.9), -0.06 * amp * Math.cos(phi - 0.3));

  /* torso: counter-rotation, slight forward lean, breathing when idle */
  B.torso.rotation.set(
    0.05 * amp + 0.03 * clamp(state.speed / 2, 0, 1),
    0.20 * amp * Math.cos(phi - 0.9),
    0.05 * amp * Math.cos(phi - 0.3)
  );
  const br = 1 + idleW * 0.02 * Math.sin(idleT * 1.7);
  B.chest.scale.set(br, 1 + (br - 1) * 0.4, br);

  /* head: stabilization plus a glance into the turn */
  const idleLook = idleW * (0.35 * Math.sin(idleT * 0.31) + 0.2 * Math.sin(idleT * 0.83 + 1.7));
  B.head.rotation.set(
    -0.02 - 0.035 * amp * Math.cos(2 * phi + 0.8),
    0.12 * amp * Math.cos(phi - 0.9) + clamp(turn * 0.8, -0.35, 0.35) + idleLook,
    0.03 * amp * Math.cos(phi)
  );

  /* legs */
  for (const leg of B.legs) {
    const p = phi + leg.phaseOff;
    const swing = Math.max(0, Math.cos(p));
    leg.hip.rotation.x = -CFG.hipAmp * amp * Math.sin(p);
    leg.knee.rotation.x = CFG.kneeBase + CFG.swingKnee * amp * Math.pow(swing, 1.5);
    leg.ankle.rotation.x = CFG.ankleAmp * amp * Math.sin(p + CFG.anklePhase);
  }

  /* arms, counter-swinging the same-side leg */
  for (const arm of B.arms) {
    const p = phi + arm.phaseOff;
    arm.shoulder.rotation.x =
      CFG.armAmp * amp * Math.sin(p) + idleW * 0.05 * Math.sin(idleT * 0.9 + arm.side);
    arm.shoulder.rotation.z = arm.side * (0.10 + 0.05 * amp);
    arm.elbow.rotation.x = -0.28 - 0.24 * amp * Math.sin(p) - idleW * 0.10;
  }

  /* banking into the circular path + forward pitch with speed */
  B.lean.rotation.z = -clamp(turn * 0.55, 0, 0.16) * amp;
  B.lean.rotation.x = 0.05 * clamp(state.speed / 1.6, 0, 1.2);
}

/* ------------------------------------------------------------------ */
/* UI                                                                  */
/* ------------------------------------------------------------------ */
const icoPlay = $('icoPlay');
const icoPause = $('icoPause');
const playBtn = $('play');

function setPlaying(on) {
  state.playing = on;
  icoPause.style.display = on ? '' : 'none';
  icoPlay.style.display = on ? 'none' : '';
  playBtn.classList.toggle('playing', on);
  playBtn.setAttribute('aria-label', on ? 'Pause animation' : 'Resume animation');
}
playBtn.addEventListener('click', () => setPlaying(!state.playing));
$('speed').addEventListener('input', (e) => {
  state.sliderSpeed = parseFloat(e.target.value);
  $('speedVal').textContent = state.sliderSpeed.toFixed(2) + '\u00d7';
});

function resetCamera() {
  state.camAnim = {
    t: 0, dur: 0.9,
    p0: camera.position.clone(),
    p1: B.root.position.clone().add(HOME_OFF),
    q0: controls.target.clone(),
    q1: new THREE.Vector3(B.root.position.x, 1.05, B.root.position.z)
  };
  controls.enabled = false;
}
$('resetCam').addEventListener('click', resetCamera);

window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!state.playing); }
  else if (e.code === 'KeyR') { resetCamera(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ */
/* main loop                                                           */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const roV = $('roV');
const roC = $('roC');

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  state.t += dt;
  state.idleT += dt;

  /* speed shaping */
  state.speed = damp(state.speed, state.playing ? state.sliderSpeed : 0, 3.5, dt);
  const sp = state.speed;
  const amp = smooth(clamp(sp / 0.35, 0, 1));
  const freq = CFG.cadence * sp;                 // walk cycles per second
  state.phi += TAU * freq * dt;

  /* stride-length / cadence consistency so feet do not skate */
  const stride = amp * (4 * CFG.legReach * Math.sin(CFG.hipAmp) + 0.18);
  const v = stride * freq;                        // m/s
  const turn = v / CFG.pathRadius;                // rad/s, turning left
  state.theta += turn * dt;

  /* place character on the path, facing the tangent */
  const p = pathPoint(state.theta, tmpA);
  B.root.position.copy(p);
  tmpB.copy(p);
  tmpB.x += Math.cos(state.theta) * 3;   // tangent direction, scaled ahead
  tmpB.z -= Math.sin(state.theta) * 3;
  B.root.lookAt(tmpB);

  /* pose */
  applyGait(state.phi, amp, 1 - amp, state.idleT, turn);

  /* antenna: damped spring reacting to pelvis bob velocity */
  const bobNow = CFG.bobAmp * amp * Math.cos(2 * state.phi);
  const bobVel = dt > 0 ? (bobNow - state.bobPrev) / dt : 0;
  state.bobPrev = bobNow;
  const targetX = -0.10 * amp - clamp(bobVel * 0.6, -0.6, 0.6);
  ant.vx += (140 * (targetX - ant.px) - 12 * ant.vx) * dt;
  ant.px += ant.vx * dt;
  B.antenna.rotation.x = ant.px;
  const swayVel = -0.055 * amp * Math.sin(state.phi - 0.5) * 2 * freq * TAU;
  ant.vz += (110 * (clamp(swayVel * 0.5, -0.4, 0.4) - ant.pz) - 10 * ant.vz) * dt;
  ant.pz += ant.vz * dt;
  B.antenna.rotation.z = ant.pz;

  /* blinking */
  blinkClock -= dt;
  if (blinkT < 0 && blinkClock <= 0) blinkT = 0;
  if (blinkT >= 0) {
    blinkT += dt;
    const k = blinkT / 0.22;
    if (k >= 1) { blinkT = -1; blinkClock = 1.8 + Math.random() * 3.4; }
    const s = 1 - 0.92 * Math.sin(Math.PI * Math.min(k, 1));
    B.eyeL.scale.y = B.eyeR.scale.y = s;
  }

  /* world matrices are needed for dust spawn points and blobs */
  B.root.updateMatrixWorld(true);

  /* foot-plant detection -> dust puffs */
  for (const leg of B.legs) {
    const ph = state.phi + leg.phaseOff;
    const k = Math.floor((ph - 1.72) / TAU); // 1.72 ~ just after heel strike
    if (k > leg.prevPlant) {
      leg.prevPlant = k;
      if (amp > 0.35) {
        leg.ankle.getWorldPosition(tmpA);
        spawnDust(tmpA, Math.min(1, sp));
      }
    }
  }
  updateDust(dt);

  /* fake contact shadows */
  const blobs = [blobL, blobR];
  for (let i = 0; i < 2; i++) {
    const leg = B.legs[i];
    leg.ankle.getWorldPosition(tmpA);
    const h = Math.max(0, tmpA.y - CFG.sole);
    const w = clamp(1 - h / 0.16, 0, 1);
    const b = blobs[i];
    b.material.opacity = 0.42 * w * Math.max(amp, 0.12);
    b.position.set(tmpA.x, 0.006, tmpA.z);
    const s = 1 + h * 1.2;
    b.scale.set(s, s, 1);
  }

  /* camera: ride along with the character, or run the reset tween */
  if (state.camAnim) {
    const A = state.camAnim;
    A.t += dt;
    const k = smooth(clamp(A.t / A.dur, 0, 1));
    camera.position.lerpVectors(A.p0, A.p1, k);
    controls.target.lerpVectors(A.q0, A.q1, k);
    if (k >= 1) {
      state.camAnim = null;
      controls.enabled = true;
      state.prevChar.copy(B.root.position);
    }
  } else {
    tmpA.copy(B.root.position).sub(state.prevChar);
    camera.position.add(tmpA);
    controls.target.set(B.root.position.x, 1.05, B.root.position.z);
    state.prevChar.copy(B.root.position);
  }
  controls.update();

  /* readouts */
  state.roTimer += dt;
  if (state.roTimer > 0.25) {
    state.roTimer = 0;
    roV.textContent = v.toFixed(2) + ' m/s';
    roC.textContent = (freq * 2).toFixed(1) + ' steps/s';
  }

  renderer.render(scene, camera);

  if (!veilGone) {
    veilGone = true;
    veil.classList.add('gone');
    setTimeout(() => veil.remove(), 700);
  }
}

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
