<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Cursor Studies — five small interactive experiments in what a pointer can be.">
<title>Cursor Studies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5.5' fill='none' stroke='%23EDEBE6' stroke-width='1.4'/%3E%3Ccircle cx='8' cy='8' r='1.4' fill='%23EDEBE6'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#EDEBE6;
    --bg:#0A0B0D;
    --accent:#EDEBE6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
    overflow:hidden;
    cursor:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    overscroll-behavior:none;
  }
  canvas#scene{position:fixed;inset:0;display:block;z-index:0}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.42) 100%);
  }
  .frame{
    position:fixed;inset:20px;z-index:2;pointer-events:none;
    border:1px solid rgba(237,235,230,0.09);
  }
  .ghost-num{
    position:fixed;right:28px;top:50%;transform:translateY(-50%);
    z-index:1;pointer-events:none;
    font-size:clamp(140px,19vw,270px);font-weight:600;line-height:1;
    letter-spacing:-0.06em;color:rgba(237,235,230,0.05);
    transition:opacity .18s ease;
  }
  /* ---------- HUD ---------- */
  .hud{
    position:fixed;z-index:5;pointer-events:none;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(237,235,230,.55);
  }
  .hud button{pointer-events:auto;cursor:none;font-family:inherit}
  .hud-tl{top:36px;left:40px}
  .brand{font-size:12px;letter-spacing:.34em;color:rgba(237,235,230,.92)}
  .subtitle{
    margin-top:8px;font-family:Georgia,"Times New Roman",serif;font-style:italic;
    text-transform:none;letter-spacing:.03em;font-size:12.5px;
    color:rgba(237,235,230,.42);
  }
  .hud-tr{top:36px;right:40px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .auto{
    display:flex;align-items:center;gap:7px;color:rgba(237,235,230,.6);
    opacity:0;transition:opacity .5s ease;
  }
  .auto.on{opacity:1}
  .auto-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .gain{display:flex;align-items:center;gap:10px}
  .gain-label{font-size:9.5px;letter-spacing:.24em;color:rgba(237,235,230,.38)}
  .gain-bar{width:76px;height:3px;background:rgba(237,235,230,.12)}
  #gainFill{height:100%;width:55%;background:var(--accent);transition:width .15s linear}
  .hud-bl{bottom:36px;left:40px;max-width:360px}
  .ch-eyebrow{font-size:10px;color:rgba(237,235,230,.35);letter-spacing:.22em}
  .ch-eyebrow #chNum{color:rgba(237,235,230,.75)}
  .ch-title{
    margin-top:7px;font-size:14px;letter-spacing:.3em;
    color:var(--accent);transition:color .3s ease;
  }
  .ch-desc{
    margin-top:9px;font-size:11px;letter-spacing:.06em;text-transform:none;
    color:rgba(237,235,230,.48);
  }
  .keys{margin-top:16px;font-size:9.5px;letter-spacing:.14em;color:rgba(237,235,230,.28)}
  .hud-bc{
    bottom:40px;left:50%;transform:translateX(-50%);
    text-align:center;font-size:10.5px;letter-spacing:.24em;
    color:rgba(237,235,230,.55);white-space:nowrap;
  }
  .hud-br{bottom:34px;right:40px;display:flex;align-items:center;gap:16px}
  .dots{display:flex;gap:10px;align-items:center;margin-right:6px}
  .dots button{
    width:7px;height:7px;padding:0;border:0;border-radius:50%;
    background:rgba(237,235,230,.22);transition:background .25s,transform .25s;
  }
  .dots button:hover{background:rgba(237,235,230,.55)}
  .dots button.on{background:var(--accent);transform:scale(1.3)}
  .nav{
    width:32px;height:28px;border:1px solid rgba(237,235,230,.18);border-radius:2px;
    background:transparent;color:rgba(237,235,230,.6);font-size:12px;line-height:1;
    transition:border-color .2s,color .2s,transform .05s;
  }
  .nav:hover{border-color:var(--accent);color:var(--accent)}
  .nav:active{transform:translateY(1px)}
  .fade-swap{transition:opacity .18s ease}
  body.switching .fade-swap{opacity:0}
  /* ---------- prompt ---------- */
  .prompt{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;
    display:flex;align-items:center;gap:14px;pointer-events:none;
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(237,235,230,.55);transition:opacity .9s ease;
  }
  .prompt.gone{opacity:0}
  .prompt-pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){
    .auto-dot,.prompt-pulse{animation:none}
  }
  noscript div{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:rgba(237,235,230,.7);letter-spacing:.2em;font-size:12px;z-index:9;
  }
  @media (max-width:720px){
    .subtitle,.ch-desc,.keys,.ghost-num{display:none}
    .hud-tl{top:28px;left:28px}
    .hud-tr{top:28px;right:28px}
    .hud-bl{bottom:28px;left:28px}
    .hud-br{bottom:26px;right:28px}
    .hud-bc{bottom:96px;width:100%;padding:0 24px;white-space:normal}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"></div>
<div class="ghost-num" id="ghostNum" aria-hidden="true">01</div>

<header class="hud hud-tl">
  <div class="brand">Cursor&nbsp;Studies</div>
  <div class="subtitle">five small experiments in what a pointer can be</div>
</header>

<div class="hud hud-tr">
  <div class="auto" id="autoChip"><span class="auto-dot"></span>auto</div>
  <div class="gain"><span class="gain-label">gain</span><div class="gain-bar"><div id="gainFill"></div></div></div>
</div>

<div class="hud hud-bl">
  <div class="fade-swap">
    <div class="ch-eyebrow"><span id="chNum">01</span> <span>/ 05</span></div>
    <div class="ch-title" id="chTitle">Echo</div>
    <div class="ch-desc" id="chDesc"></div>
  </div>
  <div class="keys">1&ndash;5 jump &middot; &larr;&rarr; move &middot; scroll sets gain</div>
</div>

<div class="hud hud-bc"><span class="fade-swap" id="hint"></span></div>

<div class="hud hud-br">
  <div class="dots" id="dots"></div>
  <button class="nav" id="prevBtn" aria-label="Previous study">&#8592;</button>
  <button class="nav" id="nextBtn" aria-label="Next study">&#8594;</button>
</div>

<div class="prompt" id="prompt"><span class="prompt-pulse"></span><span>move your cursor</span></div>

<noscript><div>this experiment needs javascript to run.</div></noscript>

<script>
(() => {
'use strict';

/* ============================== dom ============================== */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const elNum = $('chNum'), elTitle = $('chTitle'), elDesc = $('chDesc'), elHint = $('hint');
const elDots = $('dots'), elPrev = $('prevBtn'), elNext = $('nextBtn');
const elGain = $('gainFill'), elAuto = $('autoChip'), elPrompt = $('prompt'), elGhost = $('ghostNum');

/* ============================== utils ============================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const damp  = (a,b,k,dt) => a + (b - a) * (1 - Math.exp(-k * dt)); // fps-independent smoothing
const angDiff = (a,b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const INK = [237,235,230];
const rgba = (c,a) => 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + a + ')';
const mixc = (a,b,t) => [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
const MONO = '"SF Mono","Cascadia Code",Menlo,Consolas,monospace';

/* ============================== state ============================ */
let W = innerWidth, H = innerHeight, DPR = 1;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tNow = 0;
let gain = 0.55, gainT = 0.55;
let chI = 0;                       // current chapter index
let autoAmt = 0, autoT = Math.random() * 100;
let lastInput = -1e9, everMoved = false, promptGone = false, pointerOver = true;

/* the single pointer everything listens to (real or autopilot) */
const P = { x: W/2, y: H/2, px: W/2, py: W/2, dirX: 1, dirY: 0, spd: 0,
            down: false, downT: 0, downX: 0, downY: 0 };

/* ============================ studies ============================ */

/* I — ECHO: the cursor drags its own past behind it */
const echo = {
  name: 'Echo', hex: '#EDEBE6', accent: INK,
  desc: 'the cursor drags its own past behind it',
  hint: 'move to travel \u00B7 hold to freeze the echoes',
  hist: [], frozen: 0, snap: null,
  enter(){ this.hist.length = 0; this.frozen = 0; this.snap = null; },
  onDown(){
    const sp = 1 + 0.28 * Math.sin(tNow * 0.45), s = [];
    for (let i = 1; i <= this.k(); i++){ const p = this.gpos(i, sp); if (p) s.push(p); }
    this.snap = s;
  },
  k(){ return 5 + Math.round(gain * 26); },
  gpos(i, sp){
    const age = Math.floor(2 + Math.pow(i, 1.5) * 2.4 * sp);
    return age < this.hist.length ? this.hist[age] : null;
  },
  update(dt){
    this.hist.unshift({ x: P.x, y: P.y });
    if (this.hist.length > 300) this.hist.pop();
    this.frozen = P.down ? 1 : damp(this.frozen, 0, 4, dt);
  },
  draw(ctx, t){
    const h = this.hist; if (h.length < 2) return;
    const K = this.k(), sp = 1 + 0.28 * Math.sin(t * 0.45);
    const liveA = 1 - this.frozen * 0.9;
    /* comet tail */
    const N = Math.min(h.length, 64);
    ctx.lineCap = 'round';
    for (let i = 0; i < N - 1; i++){
      const f = 1 - i / N;
      ctx.strokeStyle = rgba(INK, 0.32 * f * f);
      ctx.lineWidth = lerp(2.4, 0.3, i / N);
      ctx.beginPath(); ctx.moveTo(h[i].x, h[i].y); ctx.lineTo(h[i+1].x, h[i+1].y); ctx.stroke();
    }
    /* live ghosts, receding into history */
    ctx.lineWidth = 1;
    for (let i = 1; i <= K; i++){
      const p = this.gpos(i, sp); if (!p) break;
      const f = 1 - i / (K + 1);
      ctx.strokeStyle = rgba(INK, (0.08 + 0.5 * f * f) * liveA);
      ctx.beginPath(); ctx.arc(p.x, p.y, clamp(3 + i * 0.55, 3, 26), 0, TAU); ctx.stroke();
    }
    /* frozen constellation while held */
    if (this.frozen > 0.02 && this.snap && this.snap.length > 1){
      const s = this.snap;
      ctx.strokeStyle = rgba(INK, this.frozen * 0.15);
      ctx.beginPath();
      for (let i = 0; i < s.length; i++){ if (i) ctx.lineTo(s[i].x, s[i].y); else ctx.moveTo(s[i].x, s[i].y); }
      ctx.stroke();
      for (let i = 0; i < s.length; i++){
        const f = 1 - i / (s.length + 1);
        ctx.strokeStyle = rgba(INK, this.frozen * (0.25 + 0.6 * f));
        ctx.beginPath(); ctx.arc(s[i].x, s[i].y, clamp(3 + i * 0.55, 3, 26), 0, TAU); ctx.stroke();
        ctx.fillStyle = rgba(INK, this.frozen * (0.9 * f + 0.08));
        ctx.beginPath(); ctx.arc(s[i].x, s[i].y, 1.4, 0, TAU); ctx.fill();
      }
    }
  }
};

/* II — COMPASS: a field of needles takes its north from you */
const compass = {
  name: 'Compass', hex: '#E0A458', accent: [224,164,88],
  desc: 'a field of needles takes its north from you',
  hint: 'move to lead \u00B7 hold to lock \u00B7 release to snap',
  needles: [], snapBoost: 0,
  init(){ this.build(); },
  build(){
    this.needles.length = 0;
    const sp = clamp(Math.round(Math.min(W, H) / 26), 30, 46);
    for (let y = sp * 0.75; y < H - 10; y += sp)
      for (let x = sp * 0.75; x < W - 10; x += sp)
        this.needles.push({ x, y, a: Math.random() * TAU, va: 0 });
  },
  enter(){ this.snapBoost = 0; },
  onUp(){ this.snapBoost = 1; },
  update(dt){
    this.snapBoost = Math.max(0, this.snapBoost - dt * 0.9);
    const kBase = (26 + gain * 34) * (1 + 2.4 * this.snapBoost);
    for (const n of this.needles){
      const dx = P.x - n.x, dy = P.y - n.y;
      const d = Math.sqrt(dx*dx + dy*dy) + 1e-6;
      const prox = Math.exp(-d / (150 + gain * 140));
      if (!P.down){
        let target = Math.atan2(dy, dx)
                   + Math.sin(tNow * 0.33 + n.x * 0.012 + n.y * 0.017) * 0.55 * (1 - prox);
        const k = kBase * (0.3 + prox * 2.4);
        n.va += angDiff(n.a, target) * k * dt;
        n.va *= Math.exp(-5.5 * dt);
        n.a += n.va * dt;
      } else {                     /* locked: coast to rest */
        n.va *= Math.exp(-2.5 * dt);
        n.a += n.va * dt;
      }
    }
  },
  draw(ctx){
    ctx.lineWidth = 1;
    for (const n of this.needles){
      const dx = P.x - n.x, dy = P.y - n.y;
      const d = Math.sqrt(dx*dx + dy*dy) + 1e-6;
      const prox = Math.exp(-d / (150 + gain * 140));
      const len = (6.5 + prox * 10) * (0.75 + gain * 0.5);
      const c = Math.cos(n.a), s = Math.sin(n.a);
      const col = mixc(INK, this.accent, Math.pow(prox, 1.3));
      ctx.strokeStyle = rgba(col, 0.14 + 0.68 * prox);
      ctx.beginPath();
      ctx.moveTo(n.x - c * len * 0.38, n.y - s * len * 0.38);
      ctx.lineTo(n.x + c * len * 0.62, n.y + s * len * 0.62);
      ctx.stroke();
      if (prox > 0.15){
        ctx.fillStyle = rgba(INK, 0.10 + 0.25 * prox);
        ctx.beginPath(); ctx.arc(n.x, n.y, 0.9, 0, TAU); ctx.fill();
      }
      if (prox > 0.45){
        ctx.fillStyle = rgba(col, (prox - 0.45) * 0.9);
        ctx.beginPath(); ctx.arc(n.x + c * len * 0.62, n.y + s * len * 0.62, 1.1, 0, TAU); ctx.fill();
      }
    }
  }
};

/* III — SWARM: they would rather follow than wander */
const swarm = {
  name: 'Swarm', hex: '#8FCCBB', accent: [143,204,187],
  desc: 'they would rather follow than wander',
  hint: 'move to lead the flock \u00B7 hold to scatter',
  boids: [], MAX: 260,
  init(){
    for (let i = 0; i < this.MAX; i++)
      this.boids.push({ x: Math.random()*W, y: Math.random()*H,
                        vx: (Math.random()-0.5)*80, vy: (Math.random()-0.5)*80 });
  },
  count(){ return Math.round(60 + gain * 180); },
  update(dt){
    const n = this.count(), bs = this.boids;
    const maxSp = 150 + gain * 120, maxSp2 = maxSp * maxSp;
    const view2 = 62*62, sep2 = 24*24;
    for (let i = 0; i < n; i++){
      const b = bs[i];
      let ax = 0, ay = 0, cx = 0, cy = 0, avx = 0, avy = 0, cnt = 0, sx = 0, sy = 0, scnt = 0;
      for (let j = 0; j < n; j++){
        if (j === i) continue;
        const o = bs[j], dx = o.x - b.x, dy = o.y - b.y, d2 = dx*dx + dy*dy;
        if (d2 < view2){
          cnt++; cx += o.x; cy += o.y; avx += o.vx; avy += o.vy;
          if (d2 < sep2 && d2 > 0.01){ const inv = 1 / d2; sx -= dx * inv; sy -= dy * inv; scnt++; }
        }
      }
      if (cnt){
        ax += (cx / cnt - b.x) * 0.55; ay += (cy / cnt - b.y) * 0.55;   /* cohesion   */
        ax += (avx / cnt - b.vx) * 0.9; ay += (avy / cnt - b.vy) * 0.9; /* alignment  */
      }
      if (scnt){ ax += sx * 1400; ay += sy * 1400; }                    /* separation */
      const dx = P.x - b.x, dy = P.y - b.y;
      const d = Math.sqrt(dx*dx + dy*dy) + 1e-6, ux = dx / d, uy = dy / d;
      if (P.down){
        ax += (-ux * maxSp * 1.5 - b.vx) * 2.2;                          /* scatter    */
        ay += (-uy * maxSp * 1.5 - b.vy) * 2.2;
      } else {
        const w = d < 90 ? 0.35 : 1.25;                                  /* seek cursor */
        ax += (ux * maxSp - b.vx) * w; ay += (uy * maxSp - b.vy) * w;
        if (d < 110){ ax += -uy * maxSp * 0.9; ay += ux * maxSp * 0.9; } /* swirl near */
      }
      const m = 60, bb = 420;                                            /* soft walls */
      if (b.x < m) ax += bb * (1 - b.x / m);      if (b.x > W - m) ax -= bb * (1 - (W - b.x) / m);
      if (b.y < m) ay += bb * (1 - b.y / m);      if (b.y > H - m) ay -= bb * (1 - (H - b.y) / m);
      b.vx += ax * dt; b.vy += ay * dt;
      const s2 = b.vx*b.vx + b.vy*b.vy;
      if (s2 > maxSp2){ const s = Math.sqrt(s2); b.vx *= maxSp / s; b.vy *= maxSp / s; }
      else if (s2 < 1600){ const s = Math.sqrt(s2) || 1; b.vx *= 40 / s; b.vy *= 40 / s; }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
  },
  draw(ctx){
    const n = this.count(), maxSp = 150 + gain * 120;
    for (let i = 0; i < n; i++){
      const b = this.boids[i];
      const spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      const sN = clamp(spd / maxSp, 0, 1);
      const dx = P.x - b.x, dy = P.y - b.y;
      const prox = Math.exp(-Math.sqrt(dx*dx + dy*dy) / 130);
      const col = mixc(INK, this.accent, prox);
      const s = 3.8 + sN * 2.6;
      const c = Math.cos(Math.atan2(b.vy, b.vx)), si = Math.sin(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = rgba(col, 0.30 + 0.45 * sN + 0.15 * prox);
      ctx.beginPath();
      ctx.moveTo(b.x + c * s, b.y + si * s);
      ctx.lineTo(b.x - c * s * 0.75 - si * s * 0.42, b.y - si * s * 0.75 + c * s * 0.42);
      ctx.lineTo(b.x - c * s * 0.75 + si * s * 0.42, b.y - si * s * 0.75 - c * s * 0.42);
      ctx.closePath(); ctx.fill();
    }
  }
};

/* IV — VORTEX: orbitals bending around a wandering center */
const vortex = {
  name: 'Vortex', hex: '#B9A0E8', accent: [185,160,232],
  desc: 'orbitals bending around a wandering center',
  hint: 'tap to reverse the spin \u00B7 hold to collapse',
  ps: [], MAX: 760, cx: 0, cy: 0, spin: 1, spinT: 1,
  init(){
    this.cx = W / 2; this.cy = H / 2;
    this.spinT = Math.random() < 0.5 ? -1 : 1; this.spin = this.spinT;
    for (let i = 0; i < this.MAX; i++){
      const baseR = 26 + Math.pow(Math.random(), 0.62) * Math.min(W, H) * 0.30;
      this.ps.push({ baseR, a: Math.random() * TAU, r: baseR, x: 0, y: 0, px: 0, py: 0,
                     init: false, ph: Math.random() * TAU, wf: 0.5 + Math.random() * 0.9,
                     rk: 2 + Math.random() * 3, mul: 1 });
    }
  },
  enter(){ this.cx = P.x; this.cy = P.y; for (const p of this.ps) p.init = false; },
  onUp(){
    if (tNow - P.downT < 0.3 && Math.hypot(P.x - P.downX, P.y - P.downY) < 16) this.spinT *= -1;
  },
  count(){ return Math.round(160 + gain * 560); },
  update(dt){
    this.spin = damp(this.spin, this.spinT, 2.6, dt);
    this.cx = damp(this.cx, P.x, 5, dt); this.cy = damp(this.cy, P.y, 5, dt);
    const n = this.count();
    for (let i = 0; i < n; i++){
      const p = this.ps[i];
      p.mul = damp(p.mul, P.down ? 0.3 : 1, p.rk, dt);
      const target = (p.baseR + Math.sin(tNow * p.wf + p.ph) * 8) * p.mul;
      p.r = damp(p.r, target, 2.2, dt);
      const ox = this.cx + Math.cos(p.a) * p.r, oy = this.cy + Math.sin(p.a) * p.r;
      p.a += this.spin * (420 / (p.r + 16) + 0.35) * dt;
      p.x = this.cx + Math.cos(p.a) * p.r; p.y = this.cy + Math.sin(p.a) * p.r;
      if (p.init){ p.px = ox; p.py = oy; } else { p.px = p.x; p.py = p.y; p.init = true; }
    }
  },
  draw(ctx){
    const n = this.count(), Rm = Math.min(W, H) * 0.30;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.setLineDash([2, 6]); ctx.lineWidth = 1; ctx.strokeStyle = rgba(INK, 0.10);
    ctx.beginPath(); ctx.arc(this.cx, this.cy, Rm * 0.35, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(this.cx, this.cy, Rm * 0.80, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < n; i++){
      const p = this.ps[i]; if (!p.init) continue;
      const inner = clamp(1 - p.r / (Rm + 30), 0, 1);
      const col = mixc(INK, this.accent, inner * inner);
      ctx.strokeStyle = rgba(col, 0.12 + 0.55 * inner);
      ctx.lineWidth = 0.9 + inner * 1.1;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    ctx.fillStyle = rgba(this.accent, 0.9);
    ctx.beginPath(); ctx.arc(this.cx, this.cy, 1.8, 0, TAU); ctx.fill();
    ctx.restore();
  }
};

/* V — GLYPHS: motion becomes handwriting */
const glyphs = {
  name: 'Glyphs', hex: '#E08770', accent: [224,135,112],
  desc: 'motion becomes handwriting',
  hint: 'move to write \u00B7 hold to erase',
  PHRASE: 'THE CURSOR REMEMBERS WHAT THE HAND FORGETS \u00B7 ',
  gs: [], acc: 0, pi: 0,
  enter(){ this.gs.length = 0; this.acc = 0; },
  update(dt){
    if (!P.down && P.spd > 30){
      this.acc += P.spd * dt;
      const speedN = clamp(P.spd / 900, 0, 1);
      const size = 9 + 24 * Math.pow(1 - speedN, 1.25);   /* slow strokes are heavy */
      const spacing = size * 0.72 + 8;
      while (this.acc > spacing){
        this.acc -= spacing;
        const ch = this.PHRASE[this.pi % this.PHRASE.length]; this.pi++;
        const rot = Math.atan2(P.dirY, P.dirX) + (Math.random() - 0.5) * 0.25;
        this.gs.push({
          x: P.x + (Math.random() - 0.5) * 4, y: P.y + (Math.random() - 0.5) * 4,
          ch, size, rot, age: 0, life: 6.5 + Math.random() * 3,
          vx: -P.dirX * 8 + (Math.random() - 0.5) * 10,
          vy: -P.dirY * 8 - 6 + (Math.random() - 0.5) * 10
        });
        if (this.gs.length > 360) this.gs.shift();
      }
    } else if (P.spd <= 30){
      this.acc = Math.min(this.acc, 20);
    }
    for (let i = this.gs.length - 1; i >= 0; i--){
      const g = this.gs[i];
      g.age += dt;
      g.x += g.vx * dt; g.y += g.vy * dt;
      g.vx *= Math.exp(-0.6 * dt); g.vy *= Math.exp(-0.6 * dt);
      if (P.down){                                   /* eraser */
        const dx = g.x - P.x, dy = g.y - P.y;
        if (dx*dx + dy*dy < 110*110) g.age += dt * 5;
      }
      if (g.age > g.life) this.gs.splice(i, 1);
    }
  },
  draw(ctx){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const g of this.gs){
      const fIn = clamp(g.age / 0.25, 0, 1);
      const fOut = clamp((g.life - g.age) / 1.4, 0, 1);
      const a = fIn * fOut; if (a <= 0.01) continue;
      const recent = g.age < 0.5 ? (0.5 - g.age) / 0.5 : 0;
      const col = recent > 0 ? mixc(this.accent, INK, recent) : this.accent;
      ctx.font = g.size + 'px ' + MONO;
      ctx.save();
      ctx.translate(g.x, g.y); ctx.rotate(g.rot);
      ctx.fillStyle = rgba(col, a * (0.55 + 0.4 * recent));
      ctx.fillText(g.ch, 0, 0);
      ctx.restore();
    }
  }
};

const studies = [echo, compass, swarm, vortex, glyphs];

/* ============================== resize =========================== */
function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(2, devicePixelRatio || 1);
  canvas.width = (W * DPR) | 0; canvas.height = (H * DPR) | 0;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  compass.build();
  for (const b of swarm.boids){ b.x = clamp(b.x, 0, W); b.y = clamp(b.y, 0, H); }
  vortex.cx = clamp(vortex.cx, 0, W); vortex.cy = clamp(vortex.cy, 0, H);
  P.x = clamp(P.x, 0, W); P.y = clamp(P.y, 0, H); P.px = P.x; P.py = P.y;
}

/* ============================== input ============================ */
function userInput(){ lastInput = tNow; }
function dismissPrompt(){
  if (promptGone) return; promptGone = true;
  elPrompt.classList.add('gone');
  setTimeout(() => elPrompt.remove(), 1200);
}
addEventListener('pointermove', e => {
  P.x = e.clientX; P.y = e.clientY; pointerOver = true;
  userInput(); everMoved = true; dismissPrompt();
});
addEventListener('pointerdown', e => {
  pointerOver = true;
  if (e.target.closest('button, .dots')) return;
  P.down = true; P.downT = tNow; P.downX = e.clientX; P.downY = e.clientY;
  userInput(); everMoved = true; dismissPrompt();
  const s = studies[chI]; if (s.onDown) s.onDown();
});
addEventListener('pointerup', () => {
  if (!P.down) return;
  P.down = false; userInput();
  const s = studies[chI]; if (s.onUp) s.onUp();
});
addEventListener('pointercancel', () => { P.down = false; });
addEventListener('mouseleave', () => { pointerOver = false; });
addEventListener('mouseenter', () => { pointerOver = true; });
addEventListener('blur', () => { pointerOver = false; P.down = false; });
addEventListener('contextmenu', e => { if (!e.target.closest('button')) e.preventDefault(); });
addEventListener('wheel', e => {
  e.preventDefault();
  const max = REDUCED ? 0.55 : 1;
  gainT = clamp(gainT - e.deltaY * 0.0009, 0.12, max);
  userInput();
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || (e.key === ' ' && !e.repeat)){ e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
  else if (!e.repeat && /^[1-5]$/.test(e.key)){ jump(e.key.charCodeAt(0) - 49); }
});

/* ======================= chapters & hud ========================== */
const trans = { active: false, p: 0, to: 0, swapped: false };
function applyChapter(i){
  chI = i;
  const s = studies[i];
  elNum.textContent = String(i + 1).padStart(2, '0');
  elTitle.textContent = s.name;
  elDesc.textContent = s.desc;
  elHint.textContent = s.hint;
  elGhost.textContent = String(i + 1).padStart(2, '0');
  document.body.style.setProperty('--accent', s.hex);
  Array.prototype.forEach.call(elDots.children, (d, j) => d.classList.toggle('on', j === i));
  if (s.enter) s.enter();
}
function swapChapter(i){
  if (trans.active || i === chI) return;
  trans.active = true; trans.p = 0; trans.to = i; trans.swapped = false;
  document.body.classList.add('switching');
}
function go(d){ swapChapter((chI + d + studies.length) % studies.length); }
function jump(i){ swapChapter(i); }

studies.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'dot'; b.title = s.name; b.setAttribute('aria-label', s.name);
  b.addEventListener('click', function(){ jump(i); this.blur(); });
  elDots.appendChild(b);
});
elPrev.addEventListener('click', function(){ go(-1); this.blur(); });
elNext.addEventListener('click', function(){ go(1); this.blur(); });

/* ======================= custom cursor ========================== */
const cur = { x: W/2, y: H/2, r: 9, alpha: 1 };
function drawCursor(dt){
  cur.x = damp(cur.x, P.x, 30, dt); cur.y = damp(cur.y, P.y, 30, dt);
  cur.alpha = damp(cur.alpha, pointerOver ? 1 : 0, 8, dt);
  if (cur.alpha < 0.02) return;
  cur.r = damp(cur.r, P.down ? 5 : 9, 16, dt);
  const vx = P.x - cur.x, vy = P.y - cur.y;
  const st = 1 + clamp(Math.hypot(vx, vy) * 0.02, 0, 0.5);   /* stretch with speed */
  const ry = cur.r * (2 - Math.min(1.9, st));
  ctx.save();
  ctx.translate(cur.x, cur.y);
  ctx.strokeStyle = rgba(INK, 0.85 * cur.alpha); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 0, cur.r * st, ry, 0, 0, TAU); ctx.stroke();
  if (P.down){ ctx.fillStyle = rgba(studies[chI].accent, 0.14); ctx.fill(); }
  ctx.strokeStyle = rgba(INK, 0.45 * cur.alpha); ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo( cur.r * st + 4, 0); ctx.lineTo( cur.r * st + 7.5, 0);
  ctx.moveTo(-(cur.r * st + 4), 0); ctx.lineTo(-(cur.r * st + 7.5), 0);
  ctx.moveTo(0,  ry + 4); ctx.lineTo(0,  ry + 7.5);
  ctx.moveTo(0, -(ry + 4)); ctx.lineTo(0, -(ry + 7.5));
  ctx.stroke();
  ctx.fillStyle = rgba(INK, 0.95 * cur.alpha);
  ctx.beginPath(); ctx.arc(0, 0, P.down ? 2.6 : 2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ============================ main loop ========================== */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt <= 0) dt = 0.016; dt = Math.min(dt, 0.05);
  tNow += dt;

  /* gain */
  gain = damp(gain, gainT, 6, dt);

  /* autopilot: wander on its own when nobody is watching */
  autoT += dt;
  const idle = tNow - lastInput;
  const wantAuto = !REDUCED && idle > (everMoved ? 5 : 12);
  autoAmt = damp(autoAmt, wantAuto ? 1 : 0, wantAuto ? 0.7 : 7, dt);
  if (autoAmt > 0.002){
    const f = autoT;
    const tx = W/2 + W * 0.30 * (Math.sin(f * 0.42) * 0.6 + Math.sin(f * 0.163 + 2.1) * 0.4);
    const ty = H/2 + H * 0.27 * (Math.cos(f * 0.34) * 0.6 + Math.sin(f * 0.221 + 0.8) * 0.4);
    const k = clamp(autoAmt * 2.2 * dt, 0, 1);
    P.x = lerp(P.x, tx, k); P.y = lerp(P.y, ty, k);
    if (autoAmt > 0.5) dismissPrompt();
  }
  elAuto.classList.toggle('on', autoAmt > 0.5);

  /* pointer velocity */
  const ivx = (P.x - P.px) / dt, ivy = (P.y - P.py) / dt;
  const isp = Math.hypot(ivx, ivy);
  P.spd = damp(P.spd, isp, 10, dt);
  if (isp > 40){ P.dirX = ivx / isp; P.dirY = ivy / isp; }
  P.px = P.x; P.py = P.y;

  /* chapter transition clock */
  if (trans.active){
    trans.p += dt / 0.55;
    if (trans.p >= 0.5 && !trans.swapped){ trans.swapped = true; applyChapter(trans.to); }
    if (trans.p >= 1){ trans.active = false; document.body.classList.remove('switching'); }
  }

  /* scene */
  ctx.fillStyle = '#0A0B0D';
  ctx.fillRect(0, 0, W, H);
  const s = studies[chI];
  s.update(dt);
  s.draw(ctx, tNow);
  drawCursor(dt);

  /* transition shutter */
  if (trans.active){
    const a = Math.sin(clamp(trans.p, 0, 1) * Math.PI);
    ctx.fillStyle = 'rgba(10,11,13,' + (a * 0.96).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  elGain.style.width = (gain * 100).toFixed(1) + '%';
}

/* ============================== init ============================= */
resize();
addEventListener('resize', resize);
studies.forEach(s => { if (s.init) s.init(); });
applyChapter(0);
if (REDUCED) gainT = Math.min(gainT, 0.55);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
