<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Underkeep — Procedural Dungeon Crawler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: #05060a; overflow: hidden; }
  body {
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    color: #cfd3e4;
    -webkit-user-select: none; user-select: none;
  }
  #game { position: fixed; inset: 0; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; }
  .panel {
    background: rgba(9, 11, 19, 0.78);
    border: 1px solid #343a52;
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(4px);
    min-width: 230px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  #depthLabel { color: #8fb7ff; font-weight: 700; letter-spacing: 0.5px; }
  #lvlLabel { color: #ffd34d; font-weight: 700; }
  .bar {
    position: relative; height: 16px; background: #141722;
    border: 1px solid #3a3f55; border-radius: 8px; overflow: hidden; margin: 4px 0 6px;
  }
  .bar.slim { height: 10px; margin: 2px 0 6px; }
  .fill { height: 100%; width: 100%; transition: width .25s ease; border-radius: 7px; }
  .fill.hp  { background: linear-gradient(180deg,#e05555,#a12c2c); }
  .fill.xp  { background: linear-gradient(180deg,#9f8fe0,#6c5fb0); }
  .bartext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; letter-spacing: 0.5px;
  }
  .stats { font-size: 11px; color: #9aa1bd; margin: 0; flex-wrap: wrap; }
  .stats b { color: #dfe3f2; }

  #minimapWrap { position: absolute; top: 10px; right: 10px; pointer-events: none; }
  #minimap {
    display: block; background: rgba(9,11,19,0.78); border: 1px solid #343a52;
    border-radius: 8px; padding: 4px; image-rendering: pixelated;
  }
  #controlsHint {
    position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: #6c7391;
    text-align: right; pointer-events: none; line-height: 1.6; text-shadow: 0 1px 2px #000;
  }

  /* ---------- log ---------- */
  #log {
    position: absolute; left: 12px; bottom: 10px; width: min(480px, 60vw);
    pointer-events: none; font-size: 12px; line-height: 1.55; text-shadow: 0 1px 2px #000;
  }
  #log .l { margin-top: 1px; }
  #log .info { color: #a8aec9; }
  #log .good { color: #7fdd8a; }
  #log .bad  { color: #ff7a6e; }
  #log .gold { color: #ffd34d; }
  #log .level{ color: #b9a6ff; font-weight: 700; }

  /* ---------- banner ---------- */
  #banner {
    position: absolute; top: 16%; left: 0; right: 0; text-align: center;
    pointer-events: none; opacity: 0;
  }
  #banner .btitle {
    font-size: clamp(22px, 4.5vw, 42px); font-weight: 800; letter-spacing: 6px;
    color: #e8ecff; text-shadow: 0 0 24px rgba(120,150,255,0.55), 0 2px 4px #000;
  }
  #banner .bsub { font-size: 13px; color: #8a91b3; letter-spacing: 3px; margin-top: 6px; text-shadow: 0 1px 2px #000; }
  #banner.show { animation: bannerAnim 2.4s ease forwards; }
  @keyframes bannerAnim {
    0%   { opacity: 0; transform: translateY(14px); }
    12%  { opacity: 1; transform: none; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- overlay ---------- */
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(4, 5, 10, 0.72); backdrop-filter: blur(3px); z-index: 10; cursor: pointer;
  }
  #overlay.hidden { display: none; }
  .card {
    text-align: center; padding: 34px 44px; max-width: 92vw;
    background: rgba(12, 14, 24, 0.92); border: 1px solid #3d4360; border-radius: 14px;
    box-shadow: 0 10px 60px rgba(0,0,0,0.7);
  }
  .card h1 {
    margin: 0 0 4px; font-size: clamp(30px, 7vw, 58px); letter-spacing: 10px; font-weight: 800;
    color: #e8ecff; text-shadow: 0 0 30px rgba(255, 190, 90, 0.35), 0 3px 6px #000;
  }
  .card h1.dead { color: #ff6e5e; text-shadow: 0 0 30px rgba(255, 60, 40, 0.5), 0 3px 6px #000; }
  .card h1.won  { color: #ffd34d; text-shadow: 0 0 30px rgba(255, 200, 60, 0.55), 0 3px 6px #000; }
  .card .tag { color: #8a91b3; letter-spacing: 3px; font-size: 12px; margin-bottom: 20px; }
  .card .ctl {
    display: grid; grid-template-columns: auto auto; gap: 4px 18px; text-align: left;
    font-size: 12.5px; color: #9aa1bd; margin: 0 auto 20px; width: fit-content; line-height: 1.7;
  }
  .card .ctl b { color: #dfe3f2; }
  .card .go { color: #ffd34d; font-size: 14px; letter-spacing: 2px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .card .endstats { margin: 0 auto 18px; width: fit-content; font-size: 13px; color: #9aa1bd; line-height: 1.9; text-align: left; }
  .card .endstats b { color: #dfe3f2; }

  /* ---------- touch dpad ---------- */
  #dpad {
    display: none; position: absolute; right: 14px; bottom: 44px; z-index: 5;
    grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px;
  }
  #dpad button {
    background: rgba(20, 23, 36, 0.85); border: 1px solid #3d4360; border-radius: 12px;
    color: #cfd3e4; font-size: 20px; font-family: inherit; touch-action: manipulation;
  }
  #dpad button:active { background: #343a52; }
  #dpad button[data-d="0,-1"] { grid-column: 2; grid-row: 1; }
  #dpad button[data-d="-1,0"] { grid-column: 1; grid-row: 2; }
  #dpad #dpadPotion { grid-column: 2; grid-row: 2; font-size: 17px; }
  #dpad button[data-d="1,0"] { grid-column: 3; grid-row: 2; }
  #dpad button[data-d="0,1"] { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) { #dpad { display: grid; } #controlsHint { display: none; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="panel">
      <div class="row"><span id="depthLabel">Depth 1</span><span id="lvlLabel">Lv 1</span></div>
      <div class="bar"><div class="fill hp" id="hpFill"></div><span class="bartext" id="hpText">30 / 30</span></div>
      <div class="bar slim"><div class="fill xp" id="xpFill"></div><span class="bartext" id="xpText">0 / 10</span></div>
      <div class="row stats">
        <span id="atkStat"></span><span id="defStat"></span><span id="potStat"></span>
        <span id="goldStat"></span><span id="killStat"></span>
      </div>
    </div>
  </div>

  <div id="minimapWrap"><canvas id="minimap" width="152" height="104"></canvas></div>

  <div id="banner"><div class="btitle"></div><div class="bsub"></div></div>
  <div id="log"></div>

  <div id="controlsHint">
    move <b>WASD / arrows</b> &nbsp;·&nbsp; wait <b>space</b> &nbsp;·&nbsp; potion <b>Q</b><br>
    click a tile to step toward it &nbsp;·&nbsp; find the stairs ▼
  </div>

  <div id="dpad">
    <button data-d="0,-1">▲</button>
    <button data-d="-1,0">◀</button>
    <button id="dpadPotion">🧪</button>
    <button data-d="1,0">▶</button>
    <button data-d="0,1">▼</button>
  </div>

  <div id="overlay"><div class="card" id="overlayCard"></div></div>
</div>

<script>
'use strict';
/* =====================================================================
   UNDERKEEP — a procedural dungeon crawler in one file
   Turn-based roguelike: explore, fight, loot, descend. Depth 8 holds
   Vytharax the Ash-Binder. Kill the dragon to win.
   ===================================================================== */

/* ---------- constants ---------- */
const MAP_W = 48, MAP_H = 32, MAX_DEPTH = 8;
const FOV_R = 8.5;
const LEVEL_NAMES = [
  "The Catacombs", "Flooded Sewers", "The Ossuary", "Goblin Warrens",
  "The Great Hall", "Frost Halls", "The Wraith Court", "The Dragon's Lair"
];
const ENEMY_TYPES = {
  rat:      { name: "cave rat",   hp: 5,  atk: 2, def: 0, xp: 3,   sight: 7,  color: "#9a8f7d", minDepth: 1, weight: 5 },
  bat:      { name: "dusk bat",   hp: 4,  atk: 2, def: 0, xp: 4,   sight: 8,  color: "#7b6fae", minDepth: 1, weight: 4 },
  skeleton: { name: "skeleton",   hp: 9,  atk: 4, def: 1, xp: 8,   sight: 8,  color: "#d8d3c2", minDepth: 2, weight: 4 },
  orc:      { name: "orc raider", hp: 14, atk: 6, def: 1, xp: 14,  sight: 8,  color: "#6f8f3f", minDepth: 3, weight: 4 },
  wraith:   { name: "wraith",     hp: 12, atk: 8, def: 2, xp: 22,  sight: 9,  color: "#9fd8e8", minDepth: 5, weight: 3 },
  dragon:   { name: "Vytharax the Ash-Binder", hp: 70, atk: 9, def: 3, xp: 150, sight: 10, color: "#c0392b", boss: true }
};

/* ---------- dom ---------- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('minimap');
const mctx = mini.getContext('2d');
const logEl = document.getElementById('log');
const bannerEl = document.getElementById('banner');
const overlayEl = document.getElementById('overlay');
const cardEl = document.getElementById('overlayCard');
const el = id => document.getElementById(id);

/* ---------- state ---------- */
let state = 'title';           // title | play | dead | won
let depth = 1, turn = 0, kills = 0;
let map, shade, rooms = [], enemies = [], items = [], stairs = null;
let explored, visible;
let player = null;
let dmgNumbers = [], particles = [];
let shake = 0, time = 0, camX = 0, camY = 0;
let W = 0, H = 0, DPR = 1;
let logs = [];

/* ---------- helpers ---------- */
const irnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
}
window.addEventListener('resize', resize);

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------- audio (tiny synth) ---------- */
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function sfx(name) {
  if (!actx) return;
  switch (name) {
    case 'hit':    tone(170, 70, 0.08, 'square', 0.06); break;
    case 'crit':   tone(240, 55, 0.13, 'square', 0.09); break;
    case 'hurt':   tone(115, 45, 0.18, 'sawtooth', 0.08); break;
    case 'kill':   tone(320, 50, 0.24, 'sawtooth', 0.07); break;
    case 'gold':   tone(880, 1320, 0.09, 'triangle', 0.06); tone(1100, 1650, 0.09, 'triangle', 0.05, 0.06); break;
    case 'pickup': tone(520, 790, 0.10, 'triangle', 0.06); break;
    case 'quaff':  tone(300, 520, 0.14, 'sine', 0.07); tone(380, 660, 0.14, 'sine', 0.06, 0.08); break;
    case 'stairs': tone(420, 110, 0.38, 'triangle', 0.07); break;
    case 'level':  [440, 554, 659, 880].forEach((f, i) => tone(f, f, 0.13, 'triangle', 0.07, i * 0.09)); break;
    case 'death':  tone(220, 28, 0.9, 'sawtooth', 0.09); break;
    case 'breath': tone(90, 260, 0.4, 'sawtooth', 0.09); break;
    case 'roar':   tone(60, 115, 0.7, 'sawtooth', 0.10); tone(45, 85, 0.7, 'square', 0.06, 0.05); break;
  }
}

/* ---------- log / banner / hud ---------- */
function addLog(text, cls) {
  logs.push({ text: text, cls: cls || 'info' });
  if (logs.length > 7) logs.shift();
  logEl.innerHTML = logs.map((l, i) =>
    '<div class="l ' + l.cls + '" style="opacity:' + (0.4 + 0.6 * (i + 1) / logs.length).toFixed(2) + '">' + l.text + '</div>'
  ).join('');
}
function showBanner(title, sub) {
  bannerEl.querySelector('.btitle').textContent = title;
  bannerEl.querySelector('.bsub').textContent = sub || '';
  bannerEl.classList.remove('show');
  void bannerEl.offsetWidth;
  bannerEl.classList.add('show');
}
function updateHUD() {
  el('depthLabel').textContent = 'Depth ' + depth + ' · ' + LEVEL_NAMES[depth - 1];
  el('lvlLabel').textContent = 'Lv ' + player.level;
  el('hpFill').style.width = clamp(player.hp / player.maxhp * 100, 0, 100) + '%';
  el('hpText').textContent = Math.max(0, player.hp) + ' / ' + player.maxhp;
  el('xpFill').style.width = clamp(player.xp / player.xpNext * 100, 0, 100) + '%';
  el('xpText').textContent = player.xp + ' / ' + player.xpNext + ' xp';
  el('atkStat').innerHTML = 'ATK <b>' + player.atk + '</b>';
  el('defStat').innerHTML = 'DEF <b>' + player.def + '</b>';
  el('potStat').innerHTML = '🧪 <b>' + player.potions + '</b>';
  el('goldStat').innerHTML = '💰 <b>' + player.gold + '</b>';
  el('killStat').innerHTML = '☠ <b>' + kills + '</b>';
}

/* ---------- level generation ---------- */
function carveRect(x, y, w, h) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (i > 0 && j > 0 && i < MAP_W - 1 && j < MAP_H - 1) map[j * MAP_W + i] = 1;
}
function hCorridor(x1, x2, y) {
  y = clamp(y, 1, MAP_H - 2);
  for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) map[y * MAP_W + x] = 1;
}
function vCorridor(y1, y2, x) {
  x = clamp(x, 1, MAP_W - 1);
  for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) map[y * MAP_W + x] = 1;
}
function farthestRoom(fx, fy) {
  let best = rooms[0], bd = -1;
  for (const r of rooms) {
    const d = (r.cx - fx) * (r.cx - fx) + (r.cy - fy) * (r.cy - fy);
    if (d > bd) { bd = d; best = r; }
  }
  return best;
}
function occupied(x, y) {
  if (player && player.x === x && player.y === y) return true;
  if (stairs && stairs.x === x && stairs.y === y) return true;
  if (enemies.some(e => e.x === x && e.y === y)) return true;
  if (items.some(it => it.x === x && it.y === y)) return true;
  return false;
}
function randInRoom(r) {
  return { x: r.x + irnd(0, r.w - 1), y: r.y + irnd(0, r.h - 1) };
}
function makeEnemy(kind, x, y) {
  const t = ENEMY_TYPES[kind];
  return {
    kind: kind, x: x, y: y, rx: x, ry: y, face: [0, 1],
    hp: t.hp + (t.boss ? 0 : (depth - 1) * 2),
    maxhp: t.hp + (t.boss ? 0 : (depth - 1) * 2),
    atk: t.atk + (t.boss ? 0 : Math.floor((depth - 1) / 2)),
    def: t.def, xp: t.xp, sight: t.sight,
    awake: false, cd: t.boss ? 2 : 0, flash: 0, lunge: null
  };
}
function pickKind() {
  const table = [
    ['rat', ENEMY_TYPES.rat.weight],
    ['bat', depth >= 2 ? 4 : 2],
    ['skeleton', depth >= 3 ? 4 : 0],
    ['orc', depth >= 4 ? 4 : 0],
    ['wraith', depth >= 6 ? 3 : 0]
  ];
  let sum = 0; for (const t of table) sum += t[1];
  let r = Math.random() * sum;
  for (const t of table) { if ((r -= t[1]) < 0) return t[0]; }
  return 'rat';
}

function genLevel() {
  map = new Uint8Array(MAP_W * MAP_H);
  shade = new Float32Array(MAP_W * MAP_H);
  for (let i = 0; i < shade.length; i++) shade[i] = Math.random();
  explored = new Set(); visible = new Set();
  enemies = []; items = []; stairs = null;
  rooms = [];

  const target = 9 + Math.min(6, depth + 1);
  for (let tries = 0; tries < 500 && rooms.length < target; tries++) {
    const w = irnd(4, 10), h = irnd(3, 7);
    const x = irnd(1, MAP_W - w - 2), y = irnd(1, MAP_H - h - 2);
    if (rooms.some(o => x < o.x + o.w + 2 && x + w + 2 > o.x && y < o.y + o.h + 2 && y + h + 2 > o.y)) continue;
    rooms.push({ x: x, y: y, w: w, h: h, cx: x + (w >> 1), cy: y + (h >> 1) });
  }
  if (rooms.length < 2) { // safety net
    rooms = [];
    const r = { x: 18, y: 11, w: 12, h: 9, cx: 24, cy: 15 };
    rooms.push(r); carveRect(r.x, r.y, r.w, r.h);
  } else {
    for (const r of rooms) carveRect(r.x, r.y, r.w, r.h);
  }

  // chain rooms with L corridors, plus a couple of loops
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    if (Math.random() < 0.5) { hCorridor(a.cx, b.cx, a.cy); vCorridor(a.cy, b.cy, b.cx); }
    else { vCorridor(a.cy, b.cy, a.cx); hCorridor(a.cx, b.cx, b.cy); }
  }
  for (let k = 0; k < 2; k++) {
    const a = rooms[irnd(0, rooms.length - 1)], b = rooms[irnd(0, rooms.length - 1)];
    if (a !== b) { hCorridor(a.cx, b.cx, a.cy); vCorridor(a.cy, b.cy, b.cx); }
  }

  // player start
  const start = rooms[0];
  player.x = start.cx; player.y = start.cy;
  player.rx = player.x; player.ry = player.y;
  camX = player.x + 0.5; camY = player.y + 0.5;

  // stairs or dragon in the farthest room
  const far = farthestRoom(start.cx, start.cy);
  if (depth < MAX_DEPTH) {
    stairs = { x: far.cx, y: far.cy };
  } else {
    enemies.push(makeEnemy('dragon', far.cx, far.cy));
  }

  // enemies (never in the starting room)
  const want = Math.min(13, 4 + depth + Math.floor(depth / 2));
  let placed = 0, attempts = 0;
  while (placed < want && attempts < 400) {
    attempts++;
    const room = rooms[irnd(1, rooms.length - 1)];
    const p = randInRoom(room);
    if (map[p.y * MAP_W + p.x] !== 1 || occupied(p.x, p.y)) continue;
    enemies.push(makeEnemy(pickKind(), p.x, p.y));
    placed++;
  }

  // items
  const wantItems = irnd(4, 6);
  placed = 0; attempts = 0;
  while (placed < wantItems && attempts < 400) {
    attempts++;
    const room = rooms[irnd(0, rooms.length - 1)];
    const p = randInRoom(room);
    if (map[p.y * MAP_W + p.x] !== 1 || occupied(p.x, p.y)) continue;
    const roll = Math.random();
    if (roll < 0.42) items.push({ x: p.x, y: p.y, kind: 'potion' });
    else if (roll < 0.75) items.push({ x: p.x, y: p.y, kind: 'gold', val: 5 + irnd(0, 10) + depth * 2 });
    else if (roll < 0.88) items.push({ x: p.x, y: p.y, kind: 'sword' });
    else items.push({ x: p.x, y: p.y, kind: 'shield' });
    placed++;
  }

  computeFOV();
  updateHUD();
}

/* ---------- field of view ---------- */
function los(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    if (!(x === x0 && y === y0) && map[y * MAP_W + x] === 0) return false;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return true;
}
function computeFOV() {
  visible = new Set();
  const r = 8, r2 = FOV_R * FOV_R;
  const px = player.x, py = player.y;
  for (let y = py - r; y <= py + r; y++) {
    for (let x = px - r; x <= px + r; x++) {
      if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) continue;
      const d2 = (x - px) * (x - px) + (y - py) * (y - py);
      if (d2 > r2 + 2) continue;
      if (los(px, py, x, y)) {
        const idx = y * MAP_W + x;
        visible.add(idx); explored.add(idx);
      }
    }
  }
}

/* ---------- particles / floating numbers ---------- */
function spawnBurst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.8 + Math.random() * 2.4;
    particles.push({
      x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9, color: color, size: 1.5 + Math.random() * 2.5
    });
  }
}
function spawnHitSparks(x, y, color) {
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 2.5;
    particles.push({
      x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.22, maxLife: 0.22, color: color, size: 1 + Math.random() * 2
    });
  }
}
function fireLine(from, to) {
  // bresenham + fire particles along the path
  let x0 = from.x, y0 = from.y, x1 = to.x, y1 = to.y;
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, guard = 0;
  while (guard++ < 64) {
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: x0 + 0.2 + Math.random() * 0.6, y: y0 + 0.2 + Math.random() * 0.6,
        vx: (Math.random() - 0.5) * 0.8, vy: -0.6 - Math.random(),
        life: 0.45 + Math.random() * 0.3, maxLife: 0.75,
        color: Math.random() < 0.5 ? '#ff9b3d' : '#ffd34d', size: 2 + Math.random() * 3
      });
    }
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}
function addDmgNum(x, y, text, color) {
  dmgNumbers.push({ x: x + 0.5, y: y + 0.1, text: text, color: color, age: 0 });
}

/* ---------- combat ---------- */
function enemyAt(x, y) {
  for (const e of enemies) if (e.hp > 0 && e.x === x && e.y === y) return e;
  return null;
}
function playerAttack(e) {
  const crit = Math.random() < 0.08;
  let dmg = Math.max(1, player.atk - e.def + irnd(-1, 2));
  if (crit) dmg = Math.round(dmg * 1.6);
  e.hp -= dmg; e.flash = 0.25; e.awake = true;
  player.lunge = { dx: Math.sign(e.x - player.x), dy: Math.sign(e.y - player.y), t: 0 };
  spawnHitSparks(e.x, e.y, crit ? '#ffd34d' : '#ff8a7a');
  addDmgNum(e.x, e.y, String(dmg) + (crit ? '!' : ''), crit ? '#ffd34d' : '#ffffff');
  addLog('You hit the ' + ENEMY_TYPES[e.kind].name + ' for ' + dmg + (crit ? ' — critical!' : '.'), 'info');
  sfx(crit ? 'crit' : 'hit');
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  kills++;
  addLog('The ' + ENEMY_TYPES[e.kind].name + ' dies.', 'good');
  sfx('kill');
  spawnBurst(e.x, e.y, ENEMY_TYPES[e.kind].color, e.kind === 'dragon' ? 40 : 14);
  enemies = enemies.filter(o => o !== e);
  if (e.kind === 'dragon') { win(); return; }
  if (Math.random() < 0.3) items.push({ x: e.x, y: e.y, kind: 'gold', val: 3 + irnd(0, 6) + depth });
  gainXP(e.xp);
}
function gainXP(n) {
  player.xp += n;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.round(player.xpNext * 1.5 + 5);
    player.maxhp += 6;
    player.hp = Math.min(player.maxhp, player.hp + 8);
    player.atk += 1;
    if (player.level % 2 === 0) player.def += 1;
    addLog('You feel stronger! Welcome to level ' + player.level + '.', 'level');
    sfx('level');
    spawnBurst(player.x, player.y, '#ffd34d', 18);
    showBanner('LEVEL ' + player.level, 'you grow stronger');
  }
}
function hurtPlayer(dmg, srcText) {
  player.hp -= dmg;
  player.flash = 0.25; shake = 7;
  addDmgNum(player.x, player.y, String(dmg), '#ff5e5e');
  addLog(srcText + ' (-' + dmg + ' HP)', 'bad');
  sfx('hurt');
  if (player.hp <= 0) { player.hp = 0; die(); }
}
function enemyAttack(e) {
  if (Math.random() < 0.08) {
    addLog('The ' + ENEMY_TYPES[e.kind].name + ' misses you.', 'info');
    e.lunge = { dx: Math.sign(player.x - e.x), dy: Math.sign(player.y - e.y), t: 0 };
    return;
  }
  const dmg = Math.max(1, e.atk - player.def + irnd(-1, 2));
  e.lunge = { dx: Math.sign(player.x - e.x), dy: Math.sign(player.y - e.y), t: 0 };
  hurtPlayer(dmg, 'The ' + ENEMY_TYPES[e.kind].name + ' hits you.');
}
function dragonBreath(e) {
  e.cd = 3;
  fireLine(e, player);
  const dmg = Math.max(2, e.atk + irnd(-1, 3) - Math.floor(player.def / 2));
  sfx('breath');
  hurtPlayer(dmg, 'Vytharax bathes you in dragonfire!');
}

/* ---------- enemy turns ---------- */
function canEnemyWalk(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return false;
  if (map[y * MAP_W + x] !== 1) return false;
  if (player.x === x && player.y === y) return false;
  if (enemies.some(o => o !== null && o.hp > 0 && o.x === x && o.y === y)) return false;
  return true;
}
function moveEnemy(e, mx, my) { e.x += mx; e.y += my; e.face = [mx, my]; }
function randomStep(e) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const d = dirs[irnd(0, 3)];
  if (canEnemyWalk(e.x + d[0], e.y + d[1])) moveEnemy(e, d[0], d[1]);
}
function stepToward(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const sx = Math.sign(dx), sy = Math.sign(dy);
  let prefs;
  if (Math.abs(dx) > Math.abs(dy)) prefs = [[sx, 0], [0, sy], [0, -sy], [-sx, 0]];
  else prefs = [[0, sy], [sx, 0], [-sx, 0], [0, -sy]];
  if (Math.random() < 0.5) { const t = prefs[0]; prefs[0] = prefs[1]; prefs[1] = t; }
  for (const d of prefs) {
    if (!d[0] && !d[1]) continue;
    if (canEnemyWalk(e.x + d[0], e.y + d[1])) { moveEnemy(e, d[0], d[1]); return; }
  }
}
function enemiesAct() {
  for (const e of enemies.slice()) {
    if (e.hp <= 0 || state !== 'play') continue;
    e.cd = Math.max(0, (e.cd || 0) - 1);
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.max(Math.abs(dx), Math.abs(dy));
    const sees = dist <= e.sight && los(e.x, e.y, player.x, player.y);
    if (sees) e.awake = true;
    if (e.kind === 'dragon' && e.cd === 0 && dist <= 6 && sees) { dragonBreath(e); continue; }
    if (dist === 1) { enemyAttack(e); continue; }
    if (e.awake) {
      if (e.kind === 'bat' && Math.random() < 0.4) randomStep(e);
      else stepToward(e);
    } else if (Math.random() < 0.3) randomStep(e);
  }
}

/* ---------- player actions ---------- */
function pickup() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.x !== player.x || it.y !== player.y) continue;
    items.splice(i, 1);
    if (it.kind === 'potion') {
      player.potions++;
      addLog('You pocket a crimson potion. [Q] to drink.', 'good'); sfx('pickup');
    } else if (it.kind === 'gold') {
      player.gold += it.val;
      addLog('You scoop up ' + it.val + ' gold.', 'gold'); sfx('gold');
      spawnBurst(player.x, player.y, '#ffd34d', 8);
    } else if (it.kind === 'sword') {
      player.atk += 1;
      addLog('A finer blade! ATK is now ' + player.atk + '.', 'good'); sfx('pickup');
      spawnBurst(player.x, player.y, '#cfd6e4', 10);
    } else {
      player.def += 1;
      addLog('A sturdy shield! DEF is now ' + player.def + '.', 'good'); sfx('pickup');
      spawnBurst(player.x, player.y, '#7ba7d9', 10);
    }
  }
}
function descend() {
  depth++;
  sfx('stairs');
  player.hp = Math.min(player.maxhp, player.hp + 4);
  addLog('You descend the worn steps. (+4 HP)', 'info');
  genLevel();
  showBanner('DEPTH ' + depth, LEVEL_NAMES[depth - 1]);
  if (depth === MAX_DEPTH) {
    addLog('The air tastes of ash. Something vast stirs in the dark…', 'bad');
    sfx('roar');
  }
}
function checkStairs() {
  if (stairs && player.x === stairs.x && player.y === stairs.y) { descend(); return true; }
  return false;
}
function playerAct(dx, dy) {
  if (state !== 'play') return;
  player.face = [dx, dy];
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return;
  const e = enemyAt(nx, ny);
  if (e) {
    playerAttack(e);
  } else if (map[ny * MAP_W + nx] === 1) {
    player.x = nx; player.y = ny;
    pickup();
    if (checkStairs()) return; // new level generated; enemies of old level must not act
  }
  endTurn();
}
function waitTurn() { if (state !== 'play') return; addLog('You hold your breath and listen…', 'info'); endTurn(); }
function endTurn() {
  turn++;
  if (turn % 6 === 0 && player.hp < player.maxhp) player.hp++;
  enemiesAct();
  computeFOV();
  updateHUD();
}
function quaff() {
  if (state !== 'play') return;
  if (player.potions <= 0) { addLog('No potions left.', 'info'); return; }
  if (player.hp >= player.maxhp) { addLog('You are already at full health.', 'info'); return; }
  player.potions--;
  const heal = Math.max(10, Math.round(player.maxhp * 0.4));
  player.hp = Math.min(player.maxhp, player.hp + heal);
  addLog('You quaff a potion. (+' + heal + ' HP)', 'good');
  sfx('quaff');
  spawnBurst(player.x, player.y, '#7fdd8a', 12);
  addDmgNum(player.x, player.y, '+' + heal, '#7fdd8a');
  updateHUD();
}

/* ---------- game flow ---------- */
function resetPlayer() {
  player = {
    x: 0, y: 0, rx: 0, ry: 0, face: [0, 1],
    hp: 32, maxhp: 32, atk: 5, def: 1,
    level: 1, xp: 0, xpNext: 10,
    gold: 0, potions: 1, flash: 0, lunge: null
  };
}
function die() {
  state = 'dead';
  sfx('death');
  spawnBurst(player.x, player.y, '#c0392b', 26);
  addLog('Darkness takes you. You died on depth ' + depth + '.', 'bad');
  setTimeout(() => showEnd(false), 700);
}
function win() {
  state = 'won';
  sfx('roar');
  showBanner('THE DRAGON FALLS', 'the Underkeep is free');
  addLog('Vytharax the Ash-Binder is slain. Victory!', 'level');
  setTimeout(() => showEnd(true), 1100);
}
function statsHTML() {
  return '<div class="endstats">' +
    'Depth reached <b>' + depth + ' — ' + LEVEL_NAMES[depth - 1] + '</b><br>' +
    'Level <b>' + player.level + '</b> &nbsp; ATK <b>' + player.atk + '</b> &nbsp; DEF <b>' + player.def + '</b><br>' +
    'Gold <b>' + player.gold + '</b> &nbsp; Kills <b>' + kills + '</b> &nbsp; Turns <b>' + turn + '</b>' +
    '</div>';
}
function showEnd(won) {
  cardEl.innerHTML =
    '<h1 class="' + (won ? 'won' : 'dead') + '">' + (won ? 'VICTORY' : 'YOU DIED') + '</h1>' +
    '<div class="tag">' + (won ? 'the Ash-Binder is no more' : 'the dungeon keeps what it takes') + '</div>' +
    statsHTML() +
    '<div class="go">press Enter — or tap — to delve again</div>';
  overlayEl.classList.remove('hidden');
}
function showTitle() {
  cardEl.innerHTML =
    '<h1>UNDERKEEP</h1>' +
    '<div class="tag">a procedural dungeon crawl</div>' +
    '<div class="ctl">' +
    '<span><b>WASD / arrows</b></span><span>move &amp; attack (bump)</span>' +
    '<span><b>space</b></span><span>wait a turn</span>' +
    '<span><b>Q</b></span><span>drink potion</span>' +
    '<span><b>click / tap</b></span><span>step toward a tile</span>' +
    '</div>' +
    '<div class="ctl" style="grid-template-columns:1fr;text-align:center;margin-top:-8px">' +
    '<span>Descend 8 depths. Slay what waits at the bottom.<br>Every run generates a new keep.</span>' +
    '</div>' +
    '<div class="go">press Enter — or tap — to begin</div>';
  overlayEl.classList.remove('hidden');
}
function startRun() {
  depth = 1; turn = 0; kills = 0;
  logs = []; logEl.innerHTML = '';
  dmgNumbers = []; particles = []; shake = 0;
  resetPlayer();
  genLevel();
  state = 'play';
  overlayEl.classList.add('hidden');
  addLog('You enter the Underkeep. Torch in hand.', 'info');
  showBanner('DEPTH 1', LEVEL_NAMES[0]);
  updateHUD();
}

/* ---------- rendering ---------- */
function drawWallTile(px, py, ts, x, y, v) {
  ctx.fillStyle = 'rgb(' + (58 + v * 14 | 0) + ',' + (54 + v * 13 | 0) + ',' + (72 + v * 16 | 0) + ')';
  ctx.fillRect(px, py, ts + 1, ts + 1);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(px, py + ts * 0.33, ts, 1);
  ctx.fillRect(px, py + ts * 0.66, ts, 1);
  const off = ((x * 3 + y * 7) % 2) ? ts * 0.5 : 0;
  ctx.fillRect(px + off, py, 1, ts * 0.34);
  ctx.fillRect(px + ((off + ts * 0.5) % ts), py + ts * 0.33, 1, ts * 0.34);
  ctx.fillRect(px + off, py + ts * 0.66, 1, ts * 0.34);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(px, py, ts, 2);
}
function drawFloorTile(px, py, ts, x, y, v) {
  ctx.fillStyle = 'rgb(' + (34 + v * 10 | 0) + ',' + (31 + v * 9 | 0) + ',' + (44 + v * 12 | 0) + ')';
  ctx.fillRect(px, py, ts + 1, ts + 1);
  if (((x * 7 + y * 13) & 7) === 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.fillRect(px + ts * (0.25 + v * 0.45), py + ts * 0.45, 2, 2);
  }
}
function drawStairs(px, py, ts) {
  ctx.fillStyle = '#0c0f1c';
  rr(ctx, px + 3, py + 3, ts - 6, ts - 6, 4); ctx.fill();
  const glow = 0.35 + 0.25 * Math.sin(time * 4);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = 'rgba(95,216,255,' + (0.14 + i * 0.09 + glow * 0.25).toFixed(2) + ')';
    ctx.fillRect(px + ts * 0.24, py + ts * (0.28 + i * 0.17), ts * 0.52, ts * 0.1);
  }
  ctx.strokeStyle = 'rgba(95,216,255,' + glow.toFixed(2) + ')';
  ctx.lineWidth = 1.5;
  rr(ctx, px + 3, py + 3, ts - 6, ts - 6, 4); ctx.stroke();
}
function drawItem(it, cx, cy, ts) {
  const s = ts / 32;
  if (it.kind === 'potion') {
    ctx.fillStyle = '#d9dee8';
    ctx.fillRect(cx - 2 * s, cy - 11 * s, 4 * s, 4 * s);           // cork
    ctx.fillStyle = 'rgba(200,215,235,0.35)';
    rr(ctx, cx - 6 * s, cy - 7 * s, 12 * s, 14 * s, 4 * s); ctx.fill(); // glass
    ctx.fillStyle = '#d43a3a';
    rr(ctx, cx - 5 * s, cy - 1 * s, 10 * s, 7 * s, 3 * s); ctx.fill();  // liquid
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(cx - 3.5 * s, cy - 5.5 * s, 2 * s, 8 * s);
  } else if (it.kind === 'gold') {
    ctx.fillStyle = '#c9a227';
    ctx.beginPath(); ctx.arc(cx - 3 * s, cy + 2 * s, 5 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4 * s, cy, 4 * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(cx - 3 * s, cy + 1 * s, 4 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4 * s, cy - 1 * s, 3 * s, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(cx - 4 * s, cy - 1 * s, 1.5 * s, 1.5 * s);
  } else if (it.kind === 'sword') {
    ctx.strokeStyle = '#cfd6e4'; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.moveTo(cx - 6 * s, cy + 7 * s); ctx.lineTo(cx + 5 * s, cy - 6 * s); ctx.stroke();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(cx - 7 * s, cy + 4 * s); ctx.lineTo(cx - 3 * s, cy + 8 * s); ctx.stroke();
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 1.5 * s;
    ctx.beginPath(); ctx.moveTo(cx - 6 * s, cy + 3 * s); ctx.lineTo(cx - 1 * s, cy + 8 * s); ctx.stroke();
  } else { // shield
    ctx.fillStyle = '#3f6db0';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 9 * s);
    ctx.lineTo(cx + 7 * s, cy - 6 * s);
    ctx.lineTo(cx + 6 * s, cy + 3 * s);
    ctx.lineTo(cx, cy + 9 * s);
    ctx.lineTo(cx - 6 * s, cy + 3 * s);
    ctx.lineTo(cx - 7 * s, cy - 6 * s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9fc0e8'; ctx.lineWidth = 1.5 * s; ctx.stroke();
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(cx, cy - 1 * s, 2.2 * s, 0, 7); ctx.fill();
  }
}
function drawEnemy(e, cx, cy, ts) {
  const s = ts / 32;
  const t = ENEMY_TYPES[e.kind];
  // lunge offset
  let lx = 0, ly = 0;
  if (e.lunge && e.lunge.t < 1) {
    const o = Math.sin(Math.min(1, e.lunge.t) * Math.PI) * 0.38 * ts;
    lx = e.lunge.dx * o; ly = e.lunge.dy * o;
  }
  cx += lx; cy += ly;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx, cy + ts * 0.3, ts * 0.26, ts * 0.1, 0, 0, 7); ctx.fill();

  if (e.kind === 'rat') {
    ctx.strokeStyle = '#9a8f7d'; ctx.lineWidth = 1.5 * s;
    ctx.beginPath(); ctx.moveTo(cx - 9 * s, cy + 3 * s);
    ctx.quadraticCurveTo(cx - 15 * s, cy + (Math.sin(time * 8) * 3) * s, cx - 13 * s, cy - 3 * s); ctx.stroke();
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.ellipse(cx, cy + 2 * s, 9 * s, 6 * s, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 7 * s, cy - 3 * s, 4.5 * s, 0, 7); ctx.fill(); // head
    ctx.fillStyle = '#7d7365';
    ctx.beginPath(); ctx.arc(cx + 5 * s, cy - 8 * s, 2.5 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 10 * s, cy - 8 * s, 2.5 * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff5e5e';
    ctx.fillRect(cx + 7 * s, cy - 4 * s, 1.6 * s, 1.6 * s);
  } else if (e.kind === 'bat') {
    const flap = Math.sin(time * 14) * 6 * s;
    ctx.fillStyle = '#4d4380';
    ctx.beginPath(); ctx.moveTo(cx - 2 * s, cy);
    ctx.quadraticCurveTo(cx - 12 * s, cy - 4 * s - flap, cx - 15 * s, cy + 3 * s - flap * 0.5);
    ctx.quadraticCurveTo(cx - 8 * s, cy + 2 * s, cx - 2 * s, cy + 3 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 2 * s, cy);
    ctx.quadraticCurveTo(cx + 12 * s, cy - 4 * s - flap, cx + 15 * s, cy + 3 * s - flap * 0.5);
    ctx.quadraticCurveTo(cx + 8 * s, cy + 2 * s, cx + 2 * s, cy + 3 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.ellipse(cx, cy + 1 * s, 5 * s, 6 * s, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 4 * s, cy - 5 * s); ctx.lineTo(cx - 2 * s, cy - 10 * s); ctx.lineTo(cx - 0.5 * s, cy - 5 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 4 * s, cy - 5 * s); ctx.lineTo(cx + 2 * s, cy - 10 * s); ctx.lineTo(cx + 0.5 * s, cy - 5 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd34d';
    ctx.fillRect(cx - 2.5 * s, cy - 1 * s, 1.5 * s, 1.5 * s);
    ctx.fillRect(cx + 1 * s, cy - 1 * s, 1.5 * s, 1.5 * s);
  } else if (e.kind === 'skeleton') {
    ctx.fillStyle = t.color;
    rr(ctx, cx - 6 * s, cy - 1 * s, 12 * s, 11 * s, 3 * s); ctx.fill();   // ribcage
    ctx.strokeStyle = '#8f8a78'; ctx.lineWidth = 1.2 * s;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(cx - 6 * s, cy + (1.5 + i * 3) * s); ctx.lineTo(cx + 6 * s, cy + (1.5 + i * 3) * s); ctx.stroke();
    }
    ctx.fillStyle = '#e8e3d2';
    ctx.beginPath(); ctx.arc(cx, cy - 7 * s, 6.5 * s, 0, 7); ctx.fill(); // skull
    ctx.fillStyle = '#1b1b22';
    ctx.fillRect(cx - 4 * s, cy - 8.5 * s, 2.6 * s, 3 * s);
    ctx.fillRect(cx + 1.4 * s, cy - 8.5 * s, 2.6 * s, 3 * s);
    ctx.fillRect(cx - 1 * s, cy - 4.5 * s, 2 * s, 2 * s);
    ctx.strokeStyle = '#e8e3d2'; ctx.lineWidth = 1.8 * s;
    ctx.beginPath(); ctx.moveTo(cx + 7 * s, cy - 2 * s); ctx.lineTo(cx + 11 * s, cy - 12 * s); ctx.stroke(); // rusty sword
  } else if (e.kind === 'orc') {
    ctx.fillStyle = t.color;
    rr(ctx, cx - 9 * s, cy - 5 * s, 18 * s, 15 * s, 5 * s); ctx.fill();
    ctx.fillStyle = '#5b7634';
    rr(ctx, cx - 9 * s, cy + 3 * s, 18 * s, 7 * s, 3 * s); ctx.fill();
    ctx.fillStyle = '#7fa04b';
    ctx.beginPath(); ctx.arc(cx, cy - 9 * s, 6 * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(cx - 3.5 * s, cy - 11 * s, 2.2 * s, 2.2 * s);
    ctx.fillRect(cx + 1.3 * s, cy - 11 * s, 2.2 * s, 2.2 * s);
    ctx.fillStyle = '#e8e3d2'; // tusks
    ctx.beginPath(); ctx.moveTo(cx - 3 * s, cy - 5.5 * s); ctx.lineTo(cx - 1.6 * s, cy - 5.5 * s); ctx.lineTo(cx - 2.3 * s, cy - 2.8 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 3 * s, cy - 5.5 * s); ctx.lineTo(cx + 1.6 * s, cy - 5.5 * s); ctx.lineTo(cx + 2.3 * s, cy - 2.8 * s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2.2 * s; // axe
    ctx.beginPath(); ctx.moveTo(cx + 10 * s, cy + 6 * s); ctx.lineTo(cx + 12 * s, cy - 8 * s); ctx.stroke();
    ctx.fillStyle = '#b9c0cc';
    ctx.beginPath(); ctx.arc(cx + 12.5 * s, cy - 9 * s, 3.5 * s, 0, 7); ctx.fill();
  } else if (e.kind === 'wraith') {
    ctx.globalAlpha = 0.72;
    const sway = Math.sin(time * 3) * 2 * s;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(cx - 8 * s, cy - 6 * s);
    ctx.quadraticCurveTo(cx - 9 * s + sway, cy + 6 * s, cx - 5 * s, cy + 10 * s);
    ctx.quadraticCurveTo(cx - 2 * s, cy + 6 * s, cx, cy + 10 * s);
    ctx.quadraticCurveTo(cx + 2 * s, cy + 6 * s, cx + 5 * s, cy + 10 * s);
    ctx.quadraticCurveTo(cx + 9 * s + sway, cy + 6 * s, cx + 8 * s, cy - 6 * s);
    ctx.arc(cx, cy - 6 * s, 8 * s, Math.PI, 0, false);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0d2b33';
    ctx.beginPath(); ctx.arc(cx - 3 * s, cy - 7 * s, 1.8 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 3 * s, cy - 7 * s, 1.8 * s, 0, 7); ctx.fill();
  } else if (e.kind === 'dragon') {
    const flap = Math.sin(time * 3.2) * 5 * s;
    ctx.fillStyle = '#7e241b'; // wings
    ctx.beginPath(); ctx.moveTo(cx - 8 * s, cy - 4 * s);
    ctx.quadraticCurveTo(cx - 22 * s, cy - 12 * s - flap, cx - 20 * s, cy + 2 * s - flap * 0.4);
    ctx.quadraticCurveTo(cx - 12 * s, cy + 1 * s, cx - 7 * s, cy + 4 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 8 * s, cy - 4 * s);
    ctx.quadraticCurveTo(cx + 22 * s, cy - 12 * s - flap, cx + 20 * s, cy + 2 * s - flap * 0.4);
    ctx.quadraticCurveTo(cx + 12 * s, cy + 1 * s, cx + 7 * s, cy + 4 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = t.color; // body
    ctx.beginPath(); ctx.ellipse(cx, cy + 3 * s, 11 * s, 9 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e07a44'; // belly
    ctx.beginPath(); ctx.ellipse(cx, cy + 6 * s, 6 * s, 4.5 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = t.color; // head
    ctx.beginPath(); ctx.arc(cx, cy - 8 * s, 7 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 5 * s, cy - 13 * s); ctx.lineTo(cx - 7 * s, cy - 19 * s); ctx.lineTo(cx - 2 * s, cy - 13.5 * s); ctx.closePath(); ctx.fill(); // horns
    ctx.beginPath(); ctx.moveTo(cx + 5 * s, cy - 13 * s); ctx.lineTo(cx + 7 * s, cy - 19 * s); ctx.lineTo(cx + 2 * s, cy - 13.5 * s); ctx.closePath(); ctx.fill();
    const eye = 0.6 + 0.4 * Math.sin(time * 5);
    ctx.fillStyle = 'rgba(255,210,70,' + eye.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(cx - 3 * s, cy - 9 * s, 1.8 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 3 * s, cy - 9 * s, 1.8 * s, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7e241b'; ctx.lineWidth = 2.5 * s; // tail
    ctx.beginPath(); ctx.moveTo(cx, cy + 10 * s);
    ctx.quadraticCurveTo(cx + (Math.sin(time * 2.5) * 6) * s, cy + 16 * s, cx + 10 * s, cy + 13 * s); ctx.stroke();
    // smoke wisp
    if (Math.random() < 0.15) particles.push({
      x: e.rx + 0.5, y: e.ry - 0.1, vx: (Math.random() - 0.5) * 0.4, vy: -0.8,
      life: 0.6, maxLife: 0.6, color: 'rgba(120,90,90,0.5)', size: 2 + Math.random() * 2
    });
  }

  // hp bar when damaged
  if (e.hp < e.maxhp && e.hp > 0) {
    const bw = ts * 0.66;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(cx - bw / 2, cy - ts * 0.48, bw, 3.5);
    ctx.fillStyle = e.hp / e.maxhp > 0.4 ? '#7fdd8a' : '#ff6e5e';
    ctx.fillRect(cx - bw / 2, cy - ts * 0.48, bw * clamp(e.hp / e.maxhp, 0, 1), 3.5);
  }
  // hit flash
  if (e.flash > 0) {
    ctx.globalAlpha = clamp(e.flash * 3, 0, 0.75);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(cx, cy, ts * 0.32, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawPlayer(cx, cy, ts) {
  const s = ts / 32;
  const bob = Math.sin(time * 5) * 1.2 * s;
  let lx = 0, ly = 0;
  if (player.lunge && player.lunge.t < 1) {
    const o = Math.sin(Math.min(1, player.lunge.t) * Math.PI) * 0.38 * ts;
    lx = player.lunge.dx * o; ly = player.lunge.dy * o;
  }
  cx += lx; cy += ly + bob;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(cx - lx, cy - bob + ts * 0.32, ts * 0.24, ts * 0.09, 0, 0, 7); ctx.fill();

  // body / armor
  ctx.fillStyle = '#4a66b0';
  rr(ctx, cx - 7 * s, cy - 4 * s, 14 * s, 14 * s, 4 * s); ctx.fill();
  ctx.fillStyle = '#3a5288';
  rr(ctx, cx - 7 * s, cy + 3 * s, 14 * s, 7 * s, 3 * s); ctx.fill();
  ctx.fillStyle = '#ffd34d'; // belt buckle
  ctx.fillRect(cx - 1.5 * s, cy + 3 * s, 3 * s, 3 * s);

  // head
  ctx.fillStyle = '#e6c39c';
  ctx.beginPath(); ctx.arc(cx, cy - 10 * s, 5.5 * s, 0, 7); ctx.fill();
  // helmet
  ctx.fillStyle = '#98a2b3';
  ctx.beginPath(); ctx.arc(cx, cy - 10.5 * s, 5.8 * s, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  ctx.fillRect(cx - 1 * s, cy - 15 * s, 2 * s, 5 * s);
  ctx.fillStyle = '#7d8798';
  ctx.fillRect(cx - 5.8 * s, cy - 10.5 * s, 11.6 * s, 1.8 * s);

  // face direction eyes
  const fx = player.face[0], fy = player.face[1];
  ctx.fillStyle = '#2b2e3a';
  const ex = cx + fx * 2 * s, ey = cy - 9.5 * s + fy * 1.5 * s;
  ctx.fillRect(ex - 2.6 * s, ey, 1.7 * s, 1.7 * s);
  ctx.fillRect(ex + 1 * s, ey, 1.7 * s, 1.7 * s);

  // torch
  const tf = 0.7 + Math.sin(time * 11) * 0.3;
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.8 * s;
  ctx.beginPath(); ctx.moveTo(cx + 8 * s, cy - 1 * s); ctx.lineTo(cx + 10 * s, cy - 9 * s); ctx.stroke();
  ctx.fillStyle = 'rgba(255,155,61,' + (0.75 + tf * 0.25).toFixed(2) + ')';
  ctx.beginPath(); ctx.arc(cx + 10 * s, cy - 11 * s, (2.4 + tf) * s, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,120,0.9)';
  ctx.beginPath(); ctx.arc(cx + 10 * s, cy - 11 * s, (1.1 + tf * 0.7) * s, 0, 7); ctx.fill();

  if (player.flash > 0) {
    ctx.globalAlpha = clamp(player.flash * 3, 0, 0.7);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(cx, cy - 2 * s, ts * 0.3, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);

  const ts = clamp(H / 16, 20, 56);
  const shx = (Math.random() * 2 - 1) * shake;
  const shy = (Math.random() * 2 - 1) * shake;
  const ox = W / 2 - camX * ts + shx;
  const oy = H / 2 - camY * ts + shy;

  const x0 = Math.max(0, Math.floor(-ox / ts) - 1);
  const y0 = Math.max(0, Math.floor(-oy / ts) - 1);
  const x1 = Math.min(MAP_W - 1, Math.ceil((W - ox) / ts) + 1);
  const y1 = Math.min(MAP_H - 1, Math.ceil((H - oy) / ts) + 1);

  // ---- tiles ----
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const idx = y * MAP_W + x;
      if (!explored.has(idx)) continue;
      const px = ox + x * ts, py = oy + y * ts;
      const v = shade[idx];
      if (map[idx] === 1) drawFloorTile(px, py, ts, x, y, v);
      else drawWallTile(px, py, ts, x, y, v);
      if (stairs && x === stairs.x && y === stairs.y) drawStairs(px, py, ts);
      let b;
      if (visible.has(idx)) {
        const d = Math.hypot(x - player.rx - 0.5, y - player.ry - 0.5);
        b = 1 - 0.52 * clamp(d / (FOV_R + 1), 0, 1);
      } else b = 0.22;
      if (b < 0.995) {
        ctx.fillStyle = 'rgba(4,5,9,' + (1 - b).toFixed(3) + ')';
        ctx.fillRect(px, py, ts + 1, ts + 1);
      }
    }
  }

  // ---- items ----
  for (const it of items) {
    const idx = it.y * MAP_W + it.x;
    if (!visible.has(idx)) continue;
    drawItem(it, ox + it.x * ts + ts / 2, oy + it.y * ts + ts / 2, ts);
  }

  // ---- enemies ----
  for (const e of enemies) {
    const idx = e.y * MAP_W + e.x;
    if (!visible.has(idx)) continue;
    drawEnemy(e, ox + (e.rx + 0.5) * ts, oy + (e.ry + 0.5) * ts, ts);
  }

  // ---- player ----
  if (player) drawPlayer(ox + (player.rx + 0.5) * ts, oy + (player.ry + 0.5) * ts, ts);

  // ---- particles ----
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(ox + p.x * ts, oy + p.y * ts, p.size * (ts / 32) * 1.6, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- damage numbers ----
  ctx.font = 'bold ' + Math.round(ts * 0.38) + 'px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  for (const d of dmgNumbers) {
    ctx.globalAlpha = clamp(1 - d.age / 1.1, 0, 1);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(d.text, ox + d.x * ts, oy + d.y * ts);
    ctx.fillStyle = d.color;
    ctx.fillText(d.text, ox + d.x * ts, oy + d.y * ts);
  }
  ctx.globalAlpha = 1;

  // ---- torch vignette ----
  const px = ox + (player.rx + 0.5) * ts, py = oy + (player.ry + 0.5) * ts;
  const g = ctx.createRadialGradient(px, py, ts * 2.2, px, py, ts * 9.5);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.65, 'rgba(3,4,8,0.25)');
  g.addColorStop(1, 'rgba(3,4,8,0.82)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  drawMinimap();
}

function drawMinimap() {
  const sc = 3;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, mini.width, mini.height);
  mctx.fillStyle = 'rgba(10,12,19,0.0)';
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const idx = y * MAP_W + x;
      if (!explored.has(idx)) continue;
      const vis = visible.has(idx);
      if (map[idx] === 1) mctx.fillStyle = vis ? '#565d7d' : '#333850';
      else mctx.fillStyle = vis ? '#3d4258' : '#232735';
      mctx.fillRect(4 + x * sc, 4 + y * sc, sc, sc);
    }
  }
  if (stairs && explored.has(stairs.y * MAP_W + stairs.x)) {
    mctx.fillStyle = '#5fd8ff';
    mctx.fillRect(3 + stairs.x * sc, 3 + stairs.y * sc, sc + 2, sc + 2);
  }
  for (const e of enemies) {
    if (!visible.has(e.y * MAP_W + e.x)) continue;
    mctx.fillStyle = e.kind === 'dragon' ? '#ff9b3d' : '#ff5e5e';
    mctx.fillRect(4 + e.x * sc, 4 + e.y * sc, sc, sc);
  }
  if (player) {
    mctx.fillStyle = '#ffe08a';
    mctx.fillRect(3 + player.x * sc, 3 + player.y * sc, sc + 2, sc + 2);
  }
}

/* ---------- main loop ---------- */
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  time += dt;

  // smooth movement + timers
  if (player) {
    const k = Math.min(1, dt * 10);
    player.rx += (player.x - player.rx) * k;
    player.ry += (player.y - player.ry) * k;
    if (Math.abs(player.rx - player.x) < 0.003) player.rx = player.x;
    if (Math.abs(player.ry - player.y) < 0.003) player.ry = player.y;
    if (player.flash > 0) player.flash -= dt;
    if (player.lunge) { player.lunge.t += dt * 5; if (player.lunge.t >= 1) player.lunge = null; }
    const ck = Math.min(1, dt * 5);
    camX += (player.rx + 0.5 - camX) * ck;
    camY += (player.ry + 0.5 - camY) * ck;
  }
  for (const e of enemies) {
    const k = Math.min(1, dt * 10);
    e.rx += (e.x - e.rx) * k;
    e.ry += (e.y - e.ry) * k;
    if (e.flash > 0) e.flash -= dt;
    if (e.lunge) { e.lunge.t += dt * 5; if (e.lunge.t >= 1) e.lunge = null; }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = dmgNumbers.length - 1; i >= 0; i--) {
    const d = dmgNumbers[i];
    d.age += dt; d.y -= dt * 0.8;
    if (d.age > 1.1) dmgNumbers.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 22);

  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const DIRS = {
  arrowup: [0, -1], w: [0, -1],
  arrowdown: [0, 1], s: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0],
  arrowright: [1, 0], d: [1, 0]
};
window.addEventListener('keydown', function (e) {
  initAudio();
  const k = e.key.toLowerCase();
  if (state === 'title') {
    if (k === 'enter' || k === ' ' || DIRS[k]) { e.preventDefault(); startRun(); }
    return;
  }
  if (state === 'dead' || state === 'won') {
    if (k === 'enter' || k === 'r' || k === ' ') { e.preventDefault(); startRun(); }
    return;
  }
  if (DIRS[k]) { e.preventDefault(); playerAct(DIRS[k][0], DIRS[k][1]); return; }
  if (k === ' ') { e.preventDefault(); waitTurn(); return; }
  if (k === '.' || k === '5') { waitTurn(); return; }
  if (k === 'q' || k === '1') { quaff(); return; }
});

function screenToTile(ev) {
  const rect = canvas.getBoundingClientRect();
  const ts = clamp(H / 16, 20, 56);
  const ox = W / 2 - camX * ts, oy = H / 2 - camY * ts;
  return {
    x: Math.floor((ev.clientX - rect.left - ox) / ts),
    y: Math.floor((ev.clientY - rect.top - oy) / ts)
  };
}
canvas.addEventListener('pointerdown', function (ev) {
  initAudio();
  if (state === 'title') { startRun(); return; }
  if (state === 'dead' || state === 'won') { startRun(); return; }
  const t = screenToTile(ev);
  const dx = t.x - player.x, dy = t.y - player.y;
  if (dx === 0 && dy === 0) { waitTurn(); return; }
  if (Math.abs(dx) > Math.abs(dy)) playerAct(Math.sign(dx), 0);
  else playerAct(0, Math.sign(dy));
});
overlayEl.addEventListener('pointerdown', function (ev) {
  ev.stopPropagation();
  initAudio();
  if (state !== 'play') startRun();
});
document.querySelectorAll('#dpad button[data-d]').forEach(function (b) {
  b.addEventListener('pointerdown', function (ev) {
    ev.preventDefault(); ev.stopPropagation();
    initAudio();
    if (state === 'title' || state === 'dead' || state === 'won') { startRun(); return; }
    const d = b.getAttribute('data-d').split(',');
    playerAct(+d[0], +d[1]);
  });
});
el('dpadPotion').addEventListener('pointerdown', function (ev) {
  ev.preventDefault(); ev.stopPropagation();
  initAudio();
  quaff();
});
window.addEventListener('contextmenu', function (e) { if (e.target === canvas) e.preventDefault(); });

/* ---------- boot ---------- */
resize();
resetPlayer();
genLevel();          // scenery behind the title screen
showTitle();
updateHUD();
requestAnimationFrame(frame);
</script>
</body>
</html>
