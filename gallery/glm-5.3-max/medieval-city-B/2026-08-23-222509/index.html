<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Living Medieval City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d9b36a; --gold-dim:rgba(217,179,106,.4);
    --ink:#efe4c8; --panel:rgba(18,14,10,.68);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0f0c09}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
  #app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .panel{
    background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:auto;
  }

  #title-panel{position:fixed;top:18px;left:18px;padding:14px 20px 12px;max-width:min(430px,80vw);z-index:10}
  #city-name{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(22px,3.4vw,32px);letter-spacing:.06em;color:var(--gold);line-height:1.05}
  #city-sub{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-top:3px}
  #city-stats{font-size:12px;opacity:.85;margin-top:9px;border-top:1px solid rgba(217,179,106,.22);padding-top:8px}

  #clock-panel{position:fixed;top:18px;right:18px;padding:11px 16px;display:flex;align-items:center;gap:12px;z-index:10}
  #clock-icon{width:20px;height:20px;color:var(--gold);flex:0 0 auto}
  #clock-icon svg{width:100%;height:100%;display:block}
  #clock-time{font-family:'Cinzel',serif;font-size:21px;font-weight:600;letter-spacing:.05em;min-width:74px;text-align:center}
  #day-track{width:140px;height:8px;border-radius:5px;position:relative;border:1px solid rgba(0,0,0,.4);
    background:linear-gradient(90deg,#0a1026 0%,#16223f 21%,#7d4a33 25%,#e0904e 27.5%,#a8c4de 34%,#c4d9ea 50%,#a8c4de 66%,#e0904e 73%,#7d4a33 76%,#16223f 80%,#0a1026 100%)}
  #day-marker{position:absolute;top:-4px;width:4px;height:16px;background:var(--gold);border-radius:2px;left:0;transform:translateX(-50%);box-shadow:0 0 6px rgba(217,179,106,.9)}

  #controls{position:fixed;left:18px;bottom:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;z-index:10}
  .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-right:2px}
  button{
    font-family:inherit;font-size:12px;font-weight:500;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid rgba(217,179,106,.28);border-radius:8px;
    padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  button:hover{background:rgba(217,179,106,.16);border-color:var(--gold)}
  button.active{background:rgba(217,179,106,.28);border-color:var(--gold);color:#fff}
  button svg{width:13px;height:13px;fill:currentColor}

  #hint{position:fixed;right:18px;bottom:18px;text-align:right;font-size:11.5px;line-height:1.65;opacity:.75;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:10}
  #hint b{color:var(--gold);font-weight:600}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(6,4,8,.42) 100%),
               linear-gradient(180deg,rgba(6,4,8,.28) 0%,transparent 16%,transparent 86%,rgba(6,4,8,.3) 100%)}

  #veil{position:fixed;inset:0;background:#0f0c09;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .9s ease}
  #veil.hide{opacity:0;pointer-events:none}
  #veil-name{font-family:'Cinzel',serif;font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:.1em;color:var(--gold)}
  #veil-text{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  #veil.err #veil-text{color:#e2a06a;letter-spacing:.03em;text-transform:none;max-width:70vw;text-align:center;line-height:1.6}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(217,179,106,.22);border-top-color:var(--gold);animation:sp 1s linear infinite}
  #veil.err .spin{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    #title-panel{top:12px;left:12px;padding:10px 14px}
    #clock-panel{top:auto;bottom:96px;right:12px;padding:8px 12px}
    #day-track{width:90px}
    #controls{left:12px;bottom:12px;right:12px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="title-panel" class="panel">
  <div id="city-name">—</div>
  <div id="city-sub">A Living Procedural City</div>
  <div id="city-stats">raising the walls…</div>
</div>

<div id="clock-panel" class="panel">
  <div id="clock-icon"></div>
  <div id="clock-time">07:55</div>
  <div id="day-track"><div id="day-marker"></div></div>
</div>

<div id="controls" class="panel">
  <div class="row">
    <span class="lbl">Time</span>
    <button id="btn-pause" title="Pause the passage of the day (Space)"><svg viewBox="0 0 16 16"><rect x="3" y="2.5" width="3.4" height="11" rx="1"/><rect x="9.6" y="2.5" width="3.4" height="11" rx="1"/></svg>Halt</button>
    <button id="btn-play" class="active" title="Normal speed"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>Day</button>
    <button id="btn-fast" title="Race toward dusk"><svg viewBox="0 0 16 16"><path d="M1.5 2.5l6 5.5-6 5.5zM8 2.5l6 5.5-6 5.5z"/></svg>Swift</button>
  </div>
  <div class="row">
    <span class="lbl">View</span>
    <button id="btn-orbit" class="active" title="Slow camera drift (O)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.6"/><ellipse cx="8" cy="8" rx="7" ry="2.7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Drift</button>
    <button id="btn-new" title="Found a new city (N)"><svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.65 3.97" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2.2 1.6v4.4h4.4z"/></svg>New City</button>
  </div>
  <div class="row">
    <span class="lbl">Go</span>
    <button class="preset" data-v="plaza">Plaza</button>
    <button class="preset" data-v="cathedral">Cathedral</button>
    <button class="preset" data-v="walls">Walls</button>
    <button class="preset" data-v="mill">Windmill</button>
  </div>
</div>

<div id="hint">
  <b>Drag</b> to orbit &nbsp;·&nbsp; <b>Scroll</b> to zoom<br>
  <b>Space</b> halt the sun &nbsp;·&nbsp; <b>N</b> found a new city
</div>

<div id="veil">
  <div id="veil-name">…</div>
  <div class="spin"></div>
  <div id="veil-text">Raising the walls…</div>
</div>

<script type="module">
/* ============================================================
   A LIVING PROCEDURAL MEDIEVAL CITY  —  single-file Three.js
   A walled town: market plaza, cathedral, timber houses, gates,
   windmill, farms, wandering citizens, smoke, and a full
   day/night cycle. Everything is seeded and regenerable.
   ============================================================ */

const veil = document.getElementById('veil');
const veilName = document.getElementById('veil-name');
const veilText = document.getElementById('veil-text');
function fatal(msg){
  veil.classList.remove('hide'); veil.classList.add('err');
  veilText.textContent = msg;
}
window.addEventListener('error', e => { if(!window.__booted) fatal('Something went wrong while building the city: ' + (e.message||'unknown error')); });

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
} catch(e1) {
  try {
    THREE = await import('https://unpkg.com/three@0.160.1/build/three.module.js');
  } catch(e2) {
    fatal('Three.js could not be loaded from the CDN. Please check your internet connection and reload.');
    throw e2;
  }
}

/* ---------- small math helpers ---------- */
const TAU = Math.PI*2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const sstep = (a,b,x)=>{ const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dampAngle(cur, target, lambda, dt){
  let d = target - cur;
  while(d >  Math.PI) d -= TAU;
  while(d < -Math.PI) d += TAU;
  return cur + d * Math.min(1, lambda*dt);
}

/* ---------- seeded randomness ---------- */
let SEED = 1 + Math.floor(Math.random()*999998);
let rng = mulberry32(SEED);
const R  = (a=1,b)=> b===undefined ? rng()*a : a+rng()*(b-a);
const RI = (a,b)=> Math.floor(R(a,b+1));
const pick = arr => arr[Math.floor(rng()*arr.length)];
function vary(hex, amt=0.06){
  const c = new THREE.Color(hex); const hsl = {h:0,s:0,l:0}; c.getHSL(hsl);
  c.setHSL(hsl.h, clamp(hsl.s+(rng()-0.5)*amt*1.6,0,1), clamp(hsl.l+(rng()-0.5)*amt*2,0,1));
  return c;
}
/* seeded value noise */
function hash2(ix,iz){ const s = Math.sin(ix*127.1 + iz*311.7 + SEED*0.0137)*43758.5453; return s - Math.floor(s); }
function vnoise(x,z){
  const ix=Math.floor(x), iz=Math.floor(z), fx=x-ix, fz=z-iz;
  const sx=fx*fx*(3-2*fx), sz=fz*fz*(3-2*fz);
  const a=hash2(ix,iz), b=hash2(ix+1,iz), c=hash2(ix,iz+1), d=hash2(ix+1,iz+1);
  return a+(b-a)*sx+(c-a)*sz+(a-b-c+d)*sx*sz;
}
function fbm(x,z){ return vnoise(x,z)*0.55 + vnoise(x*2.13+7.3, z*2.13+3.1)*0.28 + vnoise(x*4.31+13.7, z*4.31+29.4)*0.17; }

/* ---------- city naming ---------- */
const NAME_A=['Ald','Bre','Cal','Dun','Ever','Fenn','Grim','Hal','King','Mar','Nor','Oak','Rav','Sil','Thorn','West','Wind','Ash','Black','Stone'];
const NAME_B=['burg','gate','haven','hold','march','moor','shire','stead','ford','wick','field','holm'];

/* ---------- palette ---------- */
const PAL = {
  plaster:[0xe6d9bd,0xdccfae,0xd3c49b,0xcfc09a,0xe2d2b2],
  beam:0x4a3627, stone:0x97917f, stoneDark:0x837d6c,
  roofTile:[0xa4553f,0x8f4a3a,0xb06046], roofThatch:[0xc2a05e,0xb08d4f], roofSlate:[0x5a6470,0x515a66],
  door:[0x5d3e2a,0x6b4a33,0x4a3222], wood:0x7a5a3a, glass:0x31404e,
  cobble:0x7c7466, dirt:0x8f7a5c,
  grass1:0x5c884a, grass2:0x79a355, grassDry:0xa9a06a, sand:0xc9b484, seabed:0x274b46,
  cloth:[0xa03e2e,0xc8912f,0x3e5a8f,0x5d7a45,0x6b4a33,0x3c3a38,0x8a6a2f,0x704b5e],
  skin:[0xe8b48c,0xd9a06e,0xb97e52,0x8f5f3c],
  crimson:0x8e2f2f, gold:0xd9a441, slateRoof:0x55606c,
};

/* ============================================================
   RENDERER / SCENE / PERSISTENT WORLD
   ============================================================ */
const app = document.getElementById('app');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
} catch(e){ fatal('WebGL is not available in this browser.'); throw e; }
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9d3e6, 150, 640);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 2600);
camera.position.set(80, 90, 130);

/* lights */
const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -145; sun.shadow.camera.right = 145;
sun.shadow.camera.top = 145;   sun.shadow.camera.bottom = -145;
sun.shadow.camera.near = 20;   sun.shadow.camera.far = 620;
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.6;
scene.add(sun); scene.add(sun.target);
const moonLight = new THREE.DirectionalLight(0x93a7d6, 0.0);
scene.add(moonLight);
const hemi = new THREE.HemisphereLight(0xbcd7ee, 0x6b5f4a, 0.8);
scene.add(hemi);

/* ---------- sky dome ---------- */
const skyU = {
  uTop:{value:new THREE.Color(0x3f6db3)}, uHor:{value:new THREE.Color(0xb9d3e6)},
  uSunDir:{value:new THREE.Vector3(0,1,0)}, uSunCol:{value:new THREE.Color(0xfff2da)},
  uMoonDir:{value:new THREE.Vector3(0,-1,0)}, uNight:{value:0}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(860, 32, 20),
  new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:`
      varying vec3 vDir;
      void main(){ vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol;
      uniform vec3 uMoonDir; uniform float uNight;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y*1.18 + 0.06, 0.0, 1.0);
        vec3 col = mix(uHor, uTop, pow(h, 0.62));
        float sd = max(dot(d, uSunDir), 0.0);
        col += uSunCol * (pow(sd,700.0)*2.6 + pow(sd,18.0)*0.35 + pow(sd,3.5)*0.08);
        float md = max(dot(d, uMoonDir), 0.0);
        col += vec3(0.62,0.70,0.92) * (pow(md,1400.0)*1.1 + pow(md,80.0)*0.10) * uNight;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ---------- moon ---------- */
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(17, 20, 14),
  new THREE.MeshBasicMaterial({color:0xdfe6f2, fog:false})
);
scene.add(moonMesh);

/* ---------- stars ---------- */
const starGeo = new THREE.BufferGeometry();
{
  const N=850, pos=new Float32Array(N*3), seed=new Float32Array(N);
  for(let i=0;i<N;i++){
    const a = Math.random()*TAU, y = 0.06+Math.random()*0.94;
    const r = Math.sqrt(1-y*y)*780;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=y*780; pos[i*3+2]=Math.sin(a)*r;
    seed[i]=Math.random()*100;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  starGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
}
const starMat = new THREE.ShaderMaterial({
  uniforms:{ uNight:{value:0}, uTime:{value:0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
  vertexShader:`
    attribute float aSeed; uniform float uNight; uniform float uTime;
    varying float vA;
    void main(){
      vA = uNight * (0.55 + 0.45*sin(uTime*2.0 + aSeed*40.0));
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = (1.4 + fract(aSeed*7.31)*2.6) * (620.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    varying float vA;
    void main(){
      vec2 q = gl_PointCoord - 0.5; float d = dot(q,q);
      if(d>0.25) discard;
      gl_FragColor = vec4(0.92,0.95,1.0, vA*(1.0-d*3.4));
    }`
});
const stars = new THREE.Points(starGeo, starMat);
stars.frustumCulled=false; stars.renderOrder = 1;
scene.add(stars);

/* ---------- water ---------- */
const waterU = {
  uTime:{value:0}, uSunDir:{value:new THREE.Vector3(0,1,0)}, uSunCol:{value:new THREE.Color(0xfff2da)},
  uSky:{value:new THREE.Color(0xb9d3e6)}, uDeep:{value:new THREE.Color(0x16424f)},
  uShallow:{value:new THREE.Color(0x2f6b74)}, uFogColor:{value:new THREE.Color(0xb9d3e6)},
  uFogNear:{value:150}, uFogFar:{value:640}
};
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(1700,1700),
  new THREE.ShaderMaterial({
    uniforms:waterU, fog:false,
    vertexShader:`
      varying vec3 vW; varying float vDist;
      void main(){
        vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
        vec4 mv = viewMatrix * w; vDist = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uSky;
      uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uFogColor;
      uniform float uFogNear; uniform float uFogFar;
      varying vec3 vW; varying float vDist;
      void main(){
        float r = length(vW.xz);
        vec3 col = mix(uShallow, uDeep, smoothstep(102.0, 185.0, r));
        float a1 = sin(vW.x*0.10 + uTime*0.8) * sin(vW.z*0.085 - uTime*0.65);
        float b1 = sin(vW.x*0.021 - uTime*0.11) * sin(vW.z*0.027 + uTime*0.09);
        col += vec3(0.020,0.045,0.05) * (a1*1.4 + b1);
        float e = 1.1;
        float ax = sin((vW.x+e)*0.10 + uTime*0.8) * sin(vW.z*0.085 - uTime*0.65);
        float az = sin(vW.x*0.10 + uTime*0.8) * sin((vW.z+e)*0.085 - uTime*0.65);
        vec3 n = normalize(vec3(-(ax-a1), 1.0, -(az-a1)));
        vec3 vDir = normalize(cameraPosition - vW);
        float spec = pow(max(dot(reflect(-uSunDir,n), vDir), 0.0), 120.0);
        float fres = pow(1.0 - max(dot(n, vDir), 0.0), 2.5);
        col = mix(col, uSky, fres*0.55);
        col += uSunCol * spec * 1.5;
        col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, vDist));
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
water.rotation.x = -Math.PI/2;
water.position.y = -1.1;
scene.add(water);

/* ---------- clouds ---------- */
const clouds = [];
{
  const cnv = document.createElement('canvas'); cnv.width = cnv.height = 128;
  const ctx = cnv.getContext('2d');
  const g = ctx.createRadialGradient(64,64,8, 64,64,62);
  g.addColorStop(0,'rgba(255,252,246,0.85)'); g.addColorStop(0.55,'rgba(250,246,240,0.4)'); g.addColorStop(1,'rgba(250,246,240,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  const tex = new THREE.CanvasTexture(cnv);
  for(let i=0;i<12;i++){
    const m = new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0.5, depthWrite:false, fog:false});
    const s = new THREE.Sprite(m);
    const sc = 60+Math.random()*110;
    s.scale.set(sc, sc*0.42, 1);
    s.position.set((Math.random()*2-1)*430, 105+Math.random()*70, (Math.random()*2-1)*430);
    clouds.push({s, m, v: 1.1+Math.random()*1.6});
    scene.add(s);
  }
}

/* ---------- birds (persistent — they circle the spire) ---------- */
const birds = [];
{
  const birdMat = new THREE.MeshStandardMaterial({color:0x2e2a26, roughness:1});
  const wingMat = new THREE.MeshStandardMaterial({color:0x35302b, roughness:1, side:THREE.DoubleSide});
  for(let i=0;i<7;i++){
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.14,6,5), birdMat);
    body.scale.set(1.7,0.8,1); g.add(body);
    const wingGeo = new THREE.PlaneGeometry(0.85,0.3);
    wingGeo.translate(0.43,0,0);
    const w1 = new THREE.Mesh(wingGeo, wingMat);
    const w2 = new THREE.Mesh(wingGeo, wingMat); w2.rotation.y = Math.PI;
    g.add(w1); g.add(w2);
    scene.add(g);
    birds.push({g, w1, w2, a: Math.random()*TAU, w: (0.14+Math.random()*0.12)*(i%2?1:-1),
      r: 22+Math.random()*14, h: 44+Math.random()*10, ph: Math.random()*TAU});
  }
}

/* ============================================================
   GEOMETRY MERGE HELPERS (the whole town in a handful of draws)
   ============================================================ */
function colorize(g, color){
  const c = color.isColor ? color : new THREE.Color(color);
  const n = g.attributes.position.count;
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr,3));
}
const _eul = new THREE.Euler();
function piece(list, geo, color, x=0, y=0, z=0, o={}){
  let g = geo.index ? geo.toNonIndexed() : geo;
  _eul.set(o.rx||0, o.ry||0, o.rz||0, 'YXZ');
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromEuler(_eul),
    new THREE.Vector3(o.sx||1, o.sy||1, o.sz||1)
  );
  if(o.base) m.premultiply(o.base);
  g.applyMatrix4(m);
  if(g !== geo) geo.dispose();
  colorize(g, color);
  list.push(g);
}
function box(list, w,h,d, color, x,y,z, o={}){ piece(list, new THREE.BoxGeometry(w,h,d), color, x,y,z, o); }
function cylPrism(list, rT,rB,h,seg, color, x,y,z, o={}){ piece(list, new THREE.CylinderGeometry(rT,rB,h,seg), color, x,y,z, o); }
function coneP(list, r,h,seg, color, x,y,z, o={}){ piece(list, new THREE.ConeGeometry(r,h,seg), color, x,y,z, o); }
function blob(list, r, color, x,y,z, o={}){ piece(list, new THREE.IcosahedronGeometry(r,0), color, x,y,z, o); }
/* gabled roof: ridge along local X, base plane at y=0, half-span sz, height h */
function roofPrism(list, len, span, h, color, x,y,z, o={}){
  const geo = new THREE.CylinderGeometry(1,1,1,3,1); geo.rotateZ(Math.PI/2);
  piece(list, geo, color, x, y + 0.5*(h/1.5), z, Object.assign({sx:len, sy:h/1.5, sz:span/0.866}, o));
}
function mergeGeoms(list){
  if(!list.length) return null;
  let n=0; for(const g of list) n += g.attributes.position.count;
  const pos = new Float32Array(n*3), nor = new Float32Array(n*3), col = new Float32Array(n*3);
  let off=0;
  for(const g of list){
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array, off*3);
    nor.set(g.attributes.normal.array, off*3);
    col.set(g.attributes.color.array, off*3);
    off += c; g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
  return geo;
}
function baseMat(x,y,z, ry, s=1){
  return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), ry),
    new THREE.Vector3(s,s,s));
}

/* shared materials */
const matCity    = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.92, metalness:0.0, flatShading:true});
const matGround  = new THREE.MeshStandardMaterial({vertexColors:true, roughness:1.0, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
const matWinA    = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.35, emissive:0xffb45e, emissiveIntensity:0});
const matWinB    = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.35, emissive:0xffb45e, emissiveIntensity:0});
const matWinC    = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.35, emissive:0xffb45e, emissiveIntensity:0});
const matHoly    = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.3,  emissive:0xa9c3ff, emissiveIntensity:0});
const matLantern = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.4,  emissive:0xffc67a, emissiveIntensity:0});
const matGold    = new THREE.MeshStandardMaterial({color:0xd9a441, roughness:0.4, metalness:0.35, emissive:0x533a10, emissiveIntensity:0.4});

/* per-color material cache (people) */
const matCache = new Map();
function matFlat(hex){ if(!matCache.has(hex)) matCache.set(hex, new THREE.MeshStandardMaterial({color:hex, roughness:0.95})); return matCache.get(hex); }

/* refs filled in by the builder, consumed when assembling the root */
let crossGAdd = null;
let fountainWaterRef = null;

/* ============================================================
   CITY BUILDER
   ============================================================ */
const WALL_R = 74;
const world = { wallR:a=>WALL_R, terrainH:(x,z)=>0 };
let city = null;

function buildCity(seed){
  SEED = seed; rng = mulberry32(seed);
  crossGAdd = null; fountainWaterRef = null;
  const P1=R(0,TAU), P2=R(0,TAU), P3=R(0,TAU);
  world.wallR = a => WALL_R + Math.sin(a*3+P1)*3.2 + Math.sin(a*7+P2)*1.8;

  /* ----- terrain: flat plateau for the town, island falls to the sea ----- */
  const flattens = [];
  function terrainBase(x,z){
    const r = Math.hypot(x,z);
    if(r < 82) return 0;
    let h = -4.2 * sstep(0,1,(r-84)/86);
    h += (fbm(x*0.02, z*0.02) - 0.5) * 2.6 * sstep(0,1,(r-82)/26);
    return h;
  }
  world.terrainH = (x,z)=>{
    let h = terrainBase(x,z);
    for(const f of flattens){
      const d = Math.hypot(x-f.x, z-f.z);
      if(d < f.r){
        const t = 1 - sstep(0,1, d/f.r);
        h = h + (f.h - h)*t;
      }
    }
    return h;
  };

  /* ----- gates, roads, walk graph ----- */
  const gateAngles = [];
  for(let i=0;i<6;i++) gateAngles.push(-Math.PI/2 + Math.PI/6 + i*Math.PI/3 + R(-0.07,0.07));
  const RING1=36, RING2=60;

  const roadSegs = [];
  const pathPolylines = [];
  const nodes = [];
  const addNode=(x,z)=>{ nodes.push({x,z,nb:[]}); return nodes.length-1; };
  const addEdge=(a,b)=>{ nodes[a].nb.push(b); nodes[b].nb.push(a); };

  const plazaN = [];
  for(let k=0;k<12;k++){ const a=k*Math.PI/6; plazaN.push(addNode(Math.cos(a)*12.4, Math.sin(a)*12.4)); }
  for(let k=0;k<12;k++) addEdge(plazaN[k], plazaN[(k+1)%12]);

  const ring1=[], ring2=[];
  for(let i=0;i<6;i++){ const a=gateAngles[i];
    ring1.push(addNode(Math.cos(a)*RING1, Math.sin(a)*RING1));
    ring2.push(addNode(Math.cos(a)*RING2, Math.sin(a)*RING2));
  }
  for(let i=0;i<6;i++){ const j=(i+1)%6;
    if(i===5) continue; /* leave a gap around the cathedral close */
    addEdge(ring1[i],ring1[j]); addEdge(ring2[i],ring2[j]);
  }
  const gateN=[], outN=[];
  for(let i=0;i<6;i++){
    const a=gateAngles[i], k=(2*i+10)%12, gr=world.wallR(a);
    addEdge(plazaN[k], ring1[i]); addEdge(ring1[i], ring2[i]);
    const gN = addNode(Math.cos(a)*(gr-2.2), Math.sin(a)*(gr-2.2));
    addEdge(ring2[i], gN); gateN.push(gN);
    const oN = addNode(Math.cos(a)*(gr+3.0), Math.sin(a)*(gr+3.0));
    addEdge(gN, oN); outN.push(oN);
  }
  const F1=addNode(-3.4,-16.4), F2=addNode(3.4,-16.4);
  addEdge(plazaN[8],F1); addEdge(F1,F2); addEdge(F2,plazaN[10]);

  for(let i=0;i<6;i++){
    const a=gateAngles[i], gr=world.wallR(a);
    roadSegs.push({ax:Math.cos(a)*11.5, az:Math.sin(a)*11.5, bx:Math.cos(a)*(gr+2.5), bz:Math.sin(a)*(gr+2.5)});
  }
  for(let i=0;i<6;i++){ const j=(i+1)%6; if(i===5) continue;
    roadSegs.push({ax:nodes[ring1[i]].x, az:nodes[ring1[i]].z, bx:nodes[ring1[j]].x, bz:nodes[ring1[j]].z});
    roadSegs.push({ax:nodes[ring2[i]].x, az:nodes[ring2[i]].z, bx:nodes[ring2[j]].x, bz:nodes[ring2[j]].z});
  }
  for(let k=0;k<24;k++){ const a0=k/24*TAU, a1=(k+1)/24*TAU;
    roadSegs.push({ax:Math.cos(a0)*13, az:Math.sin(a0)*13, bx:Math.cos(a1)*13, bz:Math.sin(a1)*13});
  }
  roadSegs.push({ax:0,az:-13.2, bx:0,bz:-18.8, wide:true});

  /* ----- landmarks outside the walls ----- */
  const millAngle = 0.45 + R(-0.12,0.12);
  const millPos = new THREE.Vector3(Math.cos(millAngle)*106, 0, Math.sin(millAngle)*106);
  millPos.y = terrainBase(millPos.x, millPos.z) + 0.35;
  flattens.push({x:millPos.x, z:millPos.z, r:16, h:millPos.y});
  const fields = [];
  for(const fd of [{a:2.4,r:96},{a:3.9,r:100},{a:5.3,r:92}]){
    const x=Math.cos(fd.a)*fd.r, z=Math.sin(fd.a)*fd.r;
    const h = terrainBase(x,z)+0.25;
    flattens.push({x,z,r:22,h});
    fields.push({x,z,h, ry:fd.a+Math.PI/2, w:30, d:19});
  }
  function addPath(gateIdx, target){
    const a = gateAngles[gateIdx];
    const sx=Math.cos(a)*(world.wallR(a)+3.5), sz=Math.sin(a)*(world.wallR(a)+3.5);
    const pts=[[sx,sz]];
    const steps = Math.max(2, Math.round(Math.hypot(target.x-sx, target.z-sz)/13));
    for(let s=1;s<steps;s++) pts.push([lerp(sx,target.x,s/steps), lerp(sz,target.z,s/steps)]);
    pathPolylines.push(pts);
    let prev = outN[gateIdx];
    for(let s=1;s<pts.length;s++){ const n=addNode(pts[s][0], pts[s][1]); addEdge(prev,n); prev=n; }
  }
  addPath(1, millPos);
  addPath(3, fields[0]); addPath(5, fields[1]); addPath(0, fields[2]);

  /* ----- geometry buckets ----- */
  const GL=[], CL=[], WA=[], WB=[], WC=[], WH=[], LN=[];
  const yards=[], smokeOrigins=[], flags=[], lights=[];
  const sharedTime = {value:0};

  function makeFlagMesh(len,h,colA,colB,hang=0){
    const geo = new THREE.PlaneGeometry(len,h,12,5);
    if(hang) geo.translate(0,-h/2,0); else geo.translate(len/2,0,0);
    const mat = new THREE.ShaderMaterial({
      uniforms:{
        uTime:sharedTime, uPhase:{value:R(0,TAU)}, uLen:{value:len}, uHang:{value:hang},
        uColA:{value:new THREE.Color(colA)}, uColB:{value:new THREE.Color(colB)},
        uFogColor:{value:scene.fog.color}
      }, side:THREE.DoubleSide,
      vertexShader:`
        uniform float uTime; uniform float uPhase; uniform float uLen; uniform float uHang;
        varying vec2 vUv; varying float vShade; varying float vDist;
        void main(){
          vUv = uv; vec3 p = position;
          float k = mix(p.x/uLen, 1.0-uv.y, uHang);
          float w1 = sin(p.x*3.2 - uTime*6.5 + uPhase);
          float w2 = sin(p.x*6.1 - uTime*10.5 + uPhase*1.7);
          p.z += (w1*0.16 + w2*0.05) * k;
          p.y += sin(p.x*2.1 - uTime*5.0 + uPhase)*0.05*k;
          vShade = 0.82 + 0.18*(w1*0.5+0.5);
          vec4 mv = modelViewMatrix*vec4(p,1.0); vDist = -mv.z;
          gl_Position = projectionMatrix*mv;
        }`,
      fragmentShader:`
        uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uFogColor;
        varying vec2 vUv; varying float vShade; varying float vDist;
        void main(){
          float stripe = step(0.5, fract(vUv.x*3.0));
          vec3 col = mix(uColA, uColB, stripe)*vShade;
          col = mix(col, uFogColor, smoothstep(120.0, 480.0, vDist));
          gl_FragColor = vec4(col, 1.0);
        }`
    });
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true; m.frustumCulled = false;
    flags.push(m);
    return m;
  }
  function poleWithFlag(x,y,z,len,h,colA,colB,ry=0){
    cylPrism(CL, 0.05,0.05,3.2, 5, PAL.beam, x, y+1.6, z);
    const f = makeFlagMesh(len,h,colA,colB,0);
    f.position.set(x, y+2.6, z); f.rotation.y = ry;
  }

  /* ---------- ground details ---------- */
  function roadSeg(ax,az,bx,bz, w, colBase, followTerrain=false){
    const dx=bx-ax, dz=bz-az, len=Math.hypot(dx,dz);
    if(len<0.2) return;
    const ry = Math.atan2(dx,dz);
    const mx=(ax+bx)/2, mz=(az+bz)/2;
    const y = followTerrain ? Math.max(world.terrainH(ax,az), world.terrainH(bx,bz))+0.02 : 0.03;
    box(GL, w, followTerrain?0.26:0.1, len+w*0.3, vary(colBase,0.05), mx, y, mz, {ry});
  }

  /* ---------- timber houses ---------- */
  function distToRoads(px,pz){
    let best=1e9, qx=0, qz=0;
    for(const s of roadSegs){
      const dx=s.bx-s.ax, dz=s.bz-s.az, L2=dx*dx+dz*dz;
      let t=((px-s.ax)*dx+(pz-s.az)*dz)/L2; t=clamp(t,0,1);
      const cx=s.ax+dx*t, cz=s.az+dz*t;
      const d=Math.hypot(px-cx, pz-cz);
      if(d<best){ best=d; qx=cx; qz=cz; }
    }
    return {d:best, qx, qz};
  }
  const placed = [];
  function canPlace(px,pz,rad){
    if(Math.hypot(px,pz) < 17) return false;
    if(px>9 && px<28 && pz>-5 && pz<15) return false;               /* town hall yard */
    if(Math.abs(px)<12.5 && pz<-14 && pz>-62) return false;         /* cathedral close */
    if(Math.abs(px)<10 && pz<-55 && pz>-70) return false;           /* graveyard */
    const a=Math.atan2(pz,px);
    if(Math.hypot(px,pz) > world.wallR(a)-5.0-rad) return false;
    for(const p of placed) if(Math.hypot(px-p.x,pz-p.z) < p.rad+rad+1.1) return false;
    return true;
  }
  const houseTrees=[];
  for(let ring=20; ring<=66; ring+=4.6){
    const step = 7.6/ring;
    for(let a=R(0,step); a<TAU; a+=step){
      const ja = a + R(-step*0.28, step*0.28);
      const px=Math.cos(ja)*(ring+R(-1.2,1.2)), pz=Math.sin(ja)*(ring+R(-1.2,1.2));
      const w=R(4.8,7.2), d=R(5,8);
      const rad=Math.max(w,d)*0.62;
      const near = distToRoads(px,pz);
      if(near.d < 4.3 || near.d > 11.5) continue;
      if(!canPlace(px,pz,rad)) continue;
      const ry = Math.atan2(px-near.qx, pz-near.qz);   /* face the street */
      placed.push({x:px, z:pz, ry, rad, w, d});
      yards.push({x:px, z:pz, r:rad+R(0.8,1.6)});
    }
  }
  const houseCount = placed.length;

  function buildHouse(p, scale=1, rich=false){
    const s=scale;
    const base = baseMat(p.x,0,p.z, p.ry, s);
    const floors = rich?3:pick([1,2,2,2,3]);
    const fh=2.6;
    const plaster=vary(pick(PAL.plaster),0.05);
    const roofKind = rng()<0.55?'tile':(rng()<0.62?'thatch':'slate');
    const roofC = vary(roofKind==='tile'?pick(PAL.roofTile):(roofKind==='thatch'?pick(PAL.roofThatch):pick(PAL.roofSlate)),0.06);
    const stoneC=vary(PAL.stone,0.06), beamC=vary(PAL.beam,0.05);
    const floorY=[0], floorW=[p.w], floorD=[p.d], floorOff=[0];
    box(CL, p.w, fh, p.d, rich?stoneC:plaster.clone().offsetHSL(0,0,-0.03), 0, fh/2, 0, {base});
    let topY=fh;
    for(let f=1; f<floors; f++){
      const o=0.3*f, fh2=fh*0.94;
      const W=p.w+o*1.6, D=p.d+o*1.6, off=o*0.8;
      box(CL, W, fh2, D, plaster, 0, topY+fh2/2, off, {base});
      for(const sx of [-W/2+0.1, W/2-0.1]){
        box(CL, 0.17, fh2, 0.17, beamC, sx, topY+fh2/2, D/2+off-0.06, {base});
        box(CL, 0.17, fh2, 0.17, beamC, sx, topY+fh2/2, -D/2+off+0.06, {base});
      }
      box(CL, W, 0.14, 0.12, beamC, 0, topY+fh2, D/2+off, {base});
      box(CL, 0.12, fh2, D, beamC, -W/2, topY+fh2/2, off, {base});
      box(CL, 0.12, fh2, D, beamC,  W/2, topY+fh2/2, off, {base});
      topY+=fh2;
      floorY.push(topY-fh2); floorW.push(W); floorD.push(D); floorOff.push(off);
    }
    const uW=floorW[floors-1], uD=floorD[floors-1], uOff=floorOff[floors-1];
    const rH=(roofKind==='thatch'? R(2.6,3.4): R(1.9,2.9)) + floors*0.12;
    roofPrism(CL, uW+0.7, uD+0.7, rH, roofC, 0, topY, uOff, {base});
    const doorX = R(-p.w*0.22, p.w*0.22);
    box(CL, 1.05, 2.05, 0.14, vary(pick(PAL.door),0.05), doorX, 1.02, p.d/2+0.05, {base});
    box(CL, 1.5, 0.16, 0.6, vary(PAL.stoneDark,0.04), doorX, 0.08, p.d/2+0.36, {base});
    for(let f=0; f<floors; f++){
      const fy=floorY[f], fw=floorW[f], fz=floorD[f]/2+floorOff[f]+0.06;
      const wy = fy + (f===0?1.55:1.5);
      const n = f===0? RI(1,2) : RI(2,3);
      for(let i=0;i<n;i++){
        const wx=(i-(n-1)/2)*(fw/(n+0.6))+R(-0.2,0.2);
        if(f===0 && Math.abs(wx-doorX)<0.95) continue;
        box(CL, 0.72, 0.95, 0.1, beamC, wx, wy, fz, {base});
        const wl = rng()<0.45?WA:(rng()<0.6?WB:WC);
        piece(wl, new THREE.BoxGeometry(0.56,0.78,0.13), vary(PAL.glass,0.05), wx, wy, fz, {base});
      }
    }
    if(roofKind!=='thatch' && rng()<0.5){
      const cx=R(-uW*0.24,uW*0.24), chH=rH*0.6+0.9;
      box(CL, 0.62, chH, 0.62, vary(PAL.stoneDark,0.05), cx, topY+rH*0.45+chH/2-0.25, uOff, {base});
      if(rng()<0.85) smokeOrigins.push(new THREE.Vector3(cx, topY+rH*0.45+chH-0.25, uOff).applyMatrix4(base));
    }
    if(rng()<0.13){
      const fx=Math.sin(p.ry), fz=Math.cos(p.ry);
      houseTrees.push({x:p.x - fx*4.6*s + R(-1,1), z:p.z - fz*4.6*s + R(-1,1)});
    }
  }
  for(const p of placed) buildHouse(p, R(0.92,1.1), rng()<0.16);

  /* ---------- town hall ---------- */
  {
    const ang=0.28, hx=Math.cos(ang)*19, hz=Math.sin(ang)*19;
    const p={x:hx, z:hz, ry:ang+Math.PI, w:9.5, d:8};
    yards.push({x:hx,z:hz,r:8.5});
    buildHouse(p, 1.35, true);
    /* banners hanging on the facade */
    const fx=Math.sin(p.ry), fz=Math.cos(p.ry), rx=Math.cos(p.ry), rz=-Math.sin(p.ry);
    const D=(8*1.35)/2 + 0.12;
    for(const sgn of [-1,1]){
      const bx=hx + rx*sgn*3.4 + fx*D, bz=hz + rz*sgn*3.4 + fz*D;
      box(CL, 1.0, 0.09, 0.09, vary(PAL.beam,0.04), bx, 8.4, bz, {ry:p.ry});
      const f=makeFlagMesh(1.5,3.6, PAL.crimson, PAL.gold, 1);
      f.position.set(bx, 8.32, bz); f.rotation.y=p.ry;
    }
  }

  /* ---------- cathedral ---------- */
  let bellPivot=null;
  {
    const stoneC=vary(0xa8a296,0.035), stoneD=vary(0x8f897c,0.035);
    const slateC=vary(PAL.slateRoof,0.04);
    const goldC=new THREE.Color(0xd9a441);
    /* tower */
    box(CL, 8, 24, 8, stoneC, 0, 12, -20.5);
    for(const sx of [-3.9,3.9]) for(const sz of [-24.4,-16.6])
      box(CL, 0.75, 24, 0.75, stoneD, sx, 12, sz);
    /* door, steps, flanking glass */
    box(CL, 3.0, 4.4, 0.3, vary(0x241a12,0.03), 0, 2.2, -16.42);
    box(CL, 1.9, 3.1, 0.22, vary(0x4a3222,0.04), 0, 1.55, -16.30);
    box(CL, 6.5, 0.5, 2.0, stoneD, 0, 0.25, -15.6);
    for(const s of [-1,1]) piece(WH, new THREE.BoxGeometry(0.65,3.4,0.16), vary(0x6d84b8,0.04), s*2.05, 2.6, -16.38);
    piece(WH, new THREE.CircleGeometry(1.8, 22), new THREE.Color(0x86a7e8), 0, 13.4, -16.32);
    /* belfry openings + bell */
    box(CL, 3.2, 4.4, 0.25, vary(0x191410,0.02), 0, 18.4, -16.48);
    box(CL, 3.2, 4.4, 0.25, vary(0x191410,0.02), -3.98, 18.4, -20.5, {ry:Math.PI/2});
    box(CL, 3.2, 4.4, 0.25, vary(0x191410,0.02),  3.98, 18.4, -20.5, {ry:Math.PI/2});
    bellPivot=new THREE.Group();
    bellPivot.position.set(0, 19.6, -20.5);
    const bell=new THREE.Mesh(new THREE.ConeGeometry(0.72,1.15,10), matGold);
    bell.position.y=-0.95; bell.rotation.x=Math.PI; bellPivot.add(bell);
    const clapper=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,5), matGold);
    clapper.position.y=-1.6; bellPivot.add(clapper);
    /* spire, pinnacles, cross */

    for(let i=0;i<p.length-1;i++) roadSeg(p[i][0],p[i][1],p[i+1][0],p[i+1][1], 2.4, PAL.dirt, true);
  { /* plaza cobbles */
    const ringCols=[0x777061,0x6d6759,0x736c5d,0x68624f,0x6f695a];
    let rIn=2.6;
    for(let i=0;i<5;i++){
      const rOut=2.6+(13.5-2.6)*(i+1)/5;
      const g=new THREE.RingGeometry(rIn,rOut,40,1); g.rotateX(-Math.PI/2);
      piece(GL, g, vary(ringCols[i%5],0.04), 0, 0.045+i*0.0012, 0);
      rIn=rOut;
    }
  }
  for(const yd of yards){
    const g=new THREE.CircleGeometry(yd.r,10); g.rotateX(-Math.PI/2);
    piece(GL, g, vary(0x8a7a5f,0.09), yd.x, 0.02+R(0,0.004), yd.z);
  }
  box(GL, 26, 0.09, 34, vary(0x8a8272,0.04), 0, 0.02, -36); /* cathedral close */
  {
    const g=new THREE.PlaneGeometry(680,680,148,148);
    g.rotateX(-Math.PI/2);
    const pos=g.attributes.position;
    const col=new Float32Array(pos.count*3);
    const c2=new THREE.Color(), cc=new THREE.Color();
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), z=pos.getZ(i);
      const h=world.terrainH(x,z);
      pos.setY(i,h);
      const r=Math.hypot(x,z);
      const n=fbm(x*0.09+3, z*0.09+11);
      cc.setHex(PAL.grass1).lerp(c2.setHex(PAL.grass2), n);
      const dn=fbm(x*0.16+31, z*0.16+7);
      if(dn>0.72) cc.lerp(c2.setHex(PAL.grassDry), (dn-0.72)*2.4);
      if(h<0.45 && h>-2.4) cc.lerp(c2.setHex(PAL.sand), clamp(1-h/0.45,0,1)*0.9);
      if(h<-1.15) cc.lerp(c2.setHex(PAL.seabed), clamp((-1.15-h)/2.4,0,1));
      if(r<84) cc.lerp(c2.setHex(0x7e7a58), 0.42);
      col[i*3]=cc.r; col[i*3+1]=cc.g; col[i*3+2]=cc.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    g.computeVertexNormals();
    GL.push(g.toNonIndexed());
  }

  /* ---------- assemble the root ---------- */
  const root=new THREE.Group();
  const groundMesh=new THREE.Mesh(mergeGeoms(GL), matGround);
  groundMesh.receiveShadow=true;
  root.add(groundMesh);
  const cityMesh=new THREE.Mesh(mergeGeoms(CL), matCity);
  cityMesh.castShadow=true; cityMesh.receiveShadow=true;
  root.add(cityMesh);
  for(const [list,mat] of [[WA,matWinA],[WB,matWinB],[WC,matWinC],[WH,matHoly]]){
    const geo=mergeGeoms(list);
    if(geo){ const m=new THREE.Mesh(geo,mat); root.add(m); }
  }
  const lanGeo=mergeGeoms(LN);
  if(lanGeo) root.add(new THREE.Mesh(lanGeo, matLantern));
  for(const f of flags) root.add(f);
  if(bellPivot) root.add(bellPivot);
  if(crossGAdd) root.add(crossGAdd);
  if(blades) root.add(blades);
  for(const b of boats) root.add(b.m);
  if(fountainWaterRef) root.add(fountainWaterRef);
  for(const L of lights) root.add(L);

  /* ---------- chimney smoke (GPU particles) ---------- */
  if(smokeOrigins.length){
    const nP=smokeOrigins.length*7;
    const posA=new Float32Array(nP*3), dat=new Float32Array(nP*4);
    for(let i=0;i<nP;i++){
      const o=smokeOrigins[i%smokeOrigins.length];
      posA[i*3]=o.x; posA[i*3+1]=o.y; posA[i*3+2]=o.z;
      dat[i*4]=rng(); dat[i*4+1]=R(0.10,0.16); dat[i*4+2]=R(0.5,1.4); dat[i*4+3]=R(0.7,1.5);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(posA,3));
    g.setAttribute('aData', new THREE.BufferAttribute(dat,4));
    const m=new THREE.ShaderMaterial({
      uniforms:{uTime:sharedTime, uWind:{value:new THREE.Vector3(0.55,0,0.3)}},
      transparent:true, depthWrite:false,
      vertexShader:`
        attribute vec4 aData;
        uniform float uTime; uniform vec3 uWind;
        varying float vA; varying float vT;
        void main(){
          float t=fract(aData.x + uTime*aData.y);
          float h=t*9.0;
          vec3 p=position+vec3(
            uWind.x*h + sin(t*9.0+aData.x*40.0)*aData.z*t*3.0, h,
            uWind.z*h + cos(t*7.0+aData.x*30.0)*aData.z*t*3.0);
          vT=t;
          vA=smoothstep(0.0,0.08,t)*(1.0-smoothstep(0.55,1.0,t));
          vec4 mv=modelViewMatrix*vec4(p,1.0);
          gl_PointSize=(2.0+t*13.0)*aData.w*(170.0/max(1.0,-mv.z));
          gl_Position=projectionMatrix*mv;
        }`,
      fragmentShader:`
        varying float vA; varying float vT;
        void main(){
          vec2 q=gl_PointCoord-0.5; float d=dot(q,q);
          if(d>0.25) discard;
          vec3 col=mix(vec3(0.40,0.40,0.44), vec3(0.85,0.85,0.88), vT);
          gl_FragColor=vec4(col, vA*(1.0-d*3.2)*0.30);
        }`
    });
    const pts=new THREE.Points(g,m); pts.frustumCulled=false;
    root.add(pts);
  }

  /* ---------- fountain spray (GPU particles) ---------- */
  {
    const n=260;
    const posA=new Float32Array(n*3), vel=new Float32Array(n*3), seed=new Float32Array(n);
    for(let i=0;i<n;i++){
      posA[i*3]=R(-0.2,0.2); posA[i*3+1]=2.85; posA[i*3+2]=R(-0.2,0.2);
      const a=R(0,TAU), out=i%5===0?R(0.5,1.4):R(0.15,0.5);
      vel[i*3]=Math.cos(a)*out; vel[i*3+1]=R(2.6,4.3); vel[i*3+2]=Math.sin(a)*out;
      seed[i]=rng();
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(posA,3));
    g.setAttribute('aVel', new THREE.BufferAttribute(vel,3));
    g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
    const m=new THREE.ShaderMaterial({
      uniforms:{uTime:sharedTime},
      transparent:true, depthWrite:false,
      vertexShader:`
        attribute vec3 aVel; attribute float aSeed; uniform float uTime;
        varying float vA;
        void main(){
          float T=1.35;
          float t=fract(aSeed+uTime/T)*T;
          vec3 p=position+aVel*t+vec3(0.0,-3.6*t*t,0.0);
          float k=t/T;
          vA=(1.0-smoothstep(0.72,1.0,k))*smoothstep(0.0,0.04,k);
          vec4 mv=modelViewMatrix*vec4(p,1.0);
          gl_PointSize=(2.4+aSeed*2.2)*(150.0/max(1.0,-mv.z));
          gl_Position=projectionMatrix*mv;
        }`,
      fragmentShader:`
        varying float vA;
        void main(){
          vec2 q=gl_PointCoord-0.5; float d=dot(q,q);
          if(d>0.25) discard;
          gl_FragColor=vec4(0.78,0.90,0.98, vA*(1.0-d*3.2)*0.55);
        }`
    });
    const pts=new THREE.Points(g,m); pts.frustumCulled=false;
    root.add(pts);
  }

  /* ---------- people ---------- */
  function makePerson(kind){
    const g=new THREE.Group();
    const cloth = kind==='guard' ? 0x7a2721 : (kind==='monk' ? 0x4b4338 : pick(PAL.cloth));
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.30,1.05,7), matFlat(cloth));
    body.position.y=0.62; body.castShadow=true; g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,7), matFlat(pick(PAL.skin)));
    head.position.y=1.33; head.castShadow=true; g.add(head);
    if(kind!=='monk' && rng()<0.45){
      const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.2,0.16,7), matFlat(pick([0x3c3a38,0x6b4a33,0x8a6a2f])));
      hat.position.y=1.5; g.add(hat);
    }
    if(kind==='guard'){
      const spear=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,2.3,5), matFlat(0x4a3222));
      spear.position.set(0.26,1.15,0); g.add(spear);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.22,5), matFlat(0xb9c0c8));
      tip.position.set(0.26,2.4,0); g.add(tip);
    }
    if(kind==='vendor'){
      const apron=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.5,0.05), matFlat(0xe8dcc3));
      apron.position.set(0,0.62,0.19); g.add(apron);
    }
    g.scale.setScalar(R(0.9,1.06));
    return g;
  }
  const walkers=[], statics=[];
  for(let i=0;i<58;i++){
    const g=makePerson('walk');
    let a=RI(0,nodes.length-1);
    while(nodes[a].nb.length===0) a=RI(0,nodes.length-1);
    const b=pick(nodes[a].nb);
    const c={g, a, b, t:R(0,1), sp:R(1.0,1.9), pause:R(0,2), ph:R(0,TAU),
      len:Math.hypot(nodes[b].x-nodes[a].x, nodes[b].z-nodes[a].z)};
    g.position.set(nodes[a].x, world.terrainH(nodes[a].x,nodes[a].z), nodes[a].z);
    root.add(g); walkers.push(c);
  }
  for(const vs of yards.vendorSpots){
    const g=makePerson('vendor');
    g.position.set(vs.x,0,vs.z); g.rotation.y=vs.ry;
    root.add(g); statics.push({g, ph:R(0,6.2)});
  }
  for(let i=0;i<6;i++){
    const a=gateAngles[i], gr=world.wallR(a);
    for(const s of [-1,1]){
      const x=Math.cos(a)*(gr-4.4)-Math.sin(a)*s*1.9, z=Math.sin(a)*(gr-4.4)+Math.cos(a)*s*1.9;
      const g=makePerson('guard');
      g.position.set(x,0,z); g.rotation.y=Math.PI/2-a;
      root.add(g); statics.push({g, ph:R(0,6.2)});
    }
  }
  for(const s of [-1,1]){
    const g=makePerson('monk');
    g.position.set(s*2.4,0,-14.6); g.rotation.y=Math.PI;
    root.add(g); statics.push({g, ph:R(0,6.2)});
  }
  for(const f of fields){
    const g=makePerson('farmer');
    g.position.set(f.x+R(-6,6), f.h, f.z+R(-4,4)); g.rotation.y=R(0,TAU);
    root.add(g); statics.push({g, ph:R(0,6.2)});
  }

  scene.add(root);
  return {
    root, walkNodes:nodes, walkers, statics, boats, lights, flags,
    bellPivot, blades, sharedTime,
    houses:houseCount, souls:walkers.length+statics.length,
    anno:RI(780,1120), millPos,
    name: pick(NAME_A)+pick(NAME_B), seed
  };
}

/* ============================================================
   CAMERA CONTROLS (custom orbit: inertia, pinch, presets)
   ============================================================ */
class OrbitCam {
  constructor(dom, cam){
    this.cam=cam; this.target=new THREE.Vector3(0,8,0);
    this.theta=0.55; this.phi=1.07; this.radius=175;
    this.radiusT=175; this.vTheta=0; this.vPhi=0; this.dragging=false;
    this.auto=true; this.autoSpeed=0.045;
    this.tween=null;
    this.min=26; this.max=460;
    this.ptrs=new Map(); this.pinchD=0;
    dom.style.touchAction='none';
    dom.addEventListener('pointerdown', e=>this.down(e));
    dom.addEventListener('pointermove', e=>this.move(e));
    window.addEventListener('pointerup', e=>this.up(e));
    window.addEventListener('pointercancel', e=>this.up(e));
    dom.addEventListener('wheel', e=>{
      e.preventDefault();
      this.radiusT=clamp(this.radiusT*Math.exp(e.deltaY*0.0011), this.min, this.max);
      this.userTouched();
    }, {passive:false});
  }
  down(e){
    this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(this.ptrs.size===1){ this.dragging=true; this.vTheta=0; this.vPhi=0; }
    if(this.ptrs.size===2){
      const p=[...this.ptrs.values()];
      this.pinchD=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    }
    this.tween=null; this.userTouched();
  }
  move(e){
    if(!this.ptrs.has(e.pointerId)) return;
    const prev=this.ptrs.get(e.pointerId);
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(this.ptrs.size===1 && this.dragging){
      this.theta-=dx*0.0052; this.phi-=dy*0.0052;
      this.phi=clamp(this.phi,0.14,1.5);
      this.vTheta=-dx*0.0052; this.vPhi=-dy*0.0052;
    } else if(this.ptrs.size===2){
      const p=[...this.ptrs.values()];
      const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(this.pinchD>0) this.radiusT=clamp(this.radiusT*this.pinchD/d, this.min, this.max);
      this.pinchD=d;
    }
  }
  up(e){
    this.ptrs.delete(e.pointerId);
    if(this.ptrs.size===0) this.dragging=false;
  }
  userTouched(){
    if(this.auto){ this.auto=false; syncOrbitBtn(); }
  }
  flyTo(view, dur=1.9){
    this.tween={t:0, dur,
      from:{th:this.theta, ph:this.phi, r:this.radiusT, tx:this.target.x, ty:this.target.y, tz:this.target.z},
      to:view};
  }
  update(dt){
    if(this.tween){
      const tw=this.tween; tw.t+=dt;
      let k=clamp(tw.t/tw.dur,0,1); k=k*k*k*(k*(k*6-15)+10);
      const f=tw.from, t=tw.to;
      this.theta=lerp(f.th,t.th,k); this.phi=clamp(lerp(f.ph,t.ph,k),0.14,1.5);
      this.radiusT=lerp(f.r,t.r,k); this.radius=this.radiusT;
      this.target.set(lerp(f.tx,t.tx,k), lerp(f.ty,t.ty,k), lerp(f.tz,t.tz,k));
      if(tw.t>=tw.dur) this.tween=null;
    } else {
      if(!this.dragging){
        this.theta+=this.vTheta; this.phi=clamp(this.phi+this.vPhi,0.14,1.5);
        const dec=Math.exp(-dt*3.2);
        this.vTheta*=dec; this.vPhi*=dec;
        if(this.auto) this.theta+=this.autoSpeed*dt;
      }
      this.radius=lerp(this.radius, this.radiusT, 1-Math.exp(-dt*9));
    }
    const sp=Math.sin(this.phi);
    this.cam.position.set(
      this.target.x+this.radius*sp*Math.sin(this.theta),
      this.target.y+this.radius*Math.cos(this.phi),
      this.target.z+this.radius*sp*Math.cos(this.theta));
    this.cam.lookAt(this.target);
  }
}
const controls=new OrbitCam(renderer.domElement, camera);

/* ============================================================
   HUD
   ============================================================ */
const $=id=>document.getElementById(id);
const btnPause=$('btn-pause'), btnPlay=$('btn-play'), btnFast=$('btn-fast'), btnOrbit=$('btn-orbit'), btnNew=$('btn-new');
let timeScale=1;
function setSpeed(s){
  timeScale=s;
  btnPause.classList.toggle('active', s===0);
  btnPlay.classList.toggle('active', s===1);
  btnFast.classList.toggle('active', s===8);
}
btnPause.onclick=()=>setSpeed(0);
btnPlay.onclick=()=>setSpeed(1);
btnFast.onclick=()=>setSpeed(8);
function syncOrbitBtn(){ btnOrbit.classList.toggle('active', controls.auto); }
btnOrbit.onclick=()=>{ controls.auto=!controls.auto; syncOrbitBtn(); };
btnNew.onclick=()=>regen();
document.querySelectorAll('.preset').forEach(b=>{
  b.onclick=()=>{
    const v=b.dataset.v;
    let view;
    if(v==='plaza') view={th:0.9, ph:1.12, r:58, tx:0, ty:4, tz:0};
    else if(v==='cathedral') view={th:0.15, ph:1.12, r:88, tx:0, ty:20, tz:-38};
    else if(v==='walls') view={th:2.25, ph:1.02, r:215, tx:0, ty:2, tz:0};
    else {
      const m=city?city.millPos:{x:0,y:9,z:0};
      view={th:Math.atan2(m.x,m.z)+2.35, ph:1.18, r:52, tx:m.x, ty:m.y+9, tz:m.z};
    }
    controls.auto=false; syncOrbitBtn();
    controls.flyTo(view);
  };
});
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); setSpeed(timeScale===0?1:0); }
  else if(e.code==='KeyN') regen();
  else if(e.code==='KeyO'){ controls.auto=!controls.auto; syncOrbitBtn(); }
});

function regen(){
  const seed=1+Math.floor(Math.random()*999998);
  if(city){
    scene.remove(city.root);
    city.root.traverse(o=>{ if((o.isMesh||o.isPoints) && o.geometry) o.geometry.dispose(); });
    for(const f of city.flags) f.material.dispose();
  }
  city=buildCity(seed);
  $('city-name').textContent=city.name;
  $('city-stats').textContent=`Souls ${city.souls} · ${city.houses} hearths · Anno ${city.anno} · Seed ${city.seed}`;
  document.title=`${city.name} — a living procedural city`;
}

/* ============================================================
   DAY / NIGHT
   ============================================================ */
let dayT=0.33;             /* just before eight in the morning */
const DAY_LEN=190;         /* seconds per full day at 1x */
let simT=0;
let lastBell=-1, bellAnim=0;

const _sunDir=new THREE.Vector3(), _c1=new THREE.Color(), _c2=new THREE.Color(),
      _c3=new THREE.Color(), _c4=new THREE.Color(), _c5=new THREE.Color();
const COL={
  dayTop:new THREE.Color(0x3f6db3), dayHor:new THREE.Color(0xb9d3e6),
  duskTop:new THREE.Color(0x41427a), duskHor:new THREE.Color(0xf2a35c),
  nightTop:new THREE.Color(0x0a1026), nightHor:new THREE.Color(0x223148),
  sunLow:new THREE.Color(0xff8a3c), sunHigh:new THREE.Color(0xfff2da),
  hemiGDay:new THREE.Color(0x6b5f4a), hemiGNight:new THREE.Color(0x3f3830),
  moonTint:new THREE.Color(0x9db1d8)
};
let hudClock=0;

function updateDayNight(dt){
  const ang=(dayT-0.25)*TAU;
  _sunDir.set(Math.cos(ang), Math.sin(ang), 0.34).normalize();
  const el=_sunDir.y;
  const day=sstep(-0.03,0.25,el);
  const night=1-sstep(-0.16,0.05,el);
  const dusk=Math.exp(-Math.pow((el-0.035)/0.14,2));

  const top=_c1.copy(COL.nightTop).lerp(COL.dayTop,day).lerp(COL.duskTop,dusk*0.65);
  const hor=_c2.copy(COL.nightHor).lerp(COL.dayHor,day).lerp(COL.duskHor,dusk*0.85);
  const sunCol=_c3.copy(COL.sunLow).lerp(COL.sunHigh,sstep(0.02,0.4,el));

  skyU.uTop.value.copy(top); skyU.uHor.value.copy(hor);
  skyU.uSunDir.value.copy(_sunDir); skyU.uSunCol.value.copy(sunCol).multiplyScalar(0.95);
  skyU.uMoonDir.value.copy(_sunDir).multiplyScalar(-1); skyU.uNight.value=night;

  moonMesh.position.copy(_sunDir).multiplyScalar(-770);
  moonMesh.visible=night>0.02;
  moonLight.position.copy(_sunDir).multiplyScalar(-260);
  moonLight.intensity=0.5*night;
  sun.position.copy(_sunDir).multiplyScalar(260);
  sun.intensity=3.3*sstep(-0.02,0.15,el);
  sun.color.copy(sunCol);
  hemi.intensity=0.22+0.95*day;
  hemi.color.copy(_c4.copy(hor).lerp(top,0.4));
  hemi.groundColor.copy(_c4.copy(COL.hemiGNight).lerp(COL.hemiGDay,day));

  scene.fog.color.copy(_c4.copy(hor).lerp(top,0.5));
  waterU.uFogColor.value.copy(scene.fog.color);
  waterU.uSky.value.copy(hor);
  waterU.uSunDir.value.copy(_sunDir);
  waterU.uSunCol.value.copy(_c5.copy(sunCol).multiplyScalar(sstep(-0.02,0.12,el)))
    .add(_c4.copy(COL.moonTint).multiplyScalar(night*0.35));
  starMat.uniforms.uNight.value=Math.pow(night,1.4);
  starMat.uniforms.uTime.value=simT;

  /* warm windows and lanterns wake with the dark */
  const fl=f=>0.9+0.1*Math.sin(simT*f);
  matWinA.emissiveIntensity=sstep(0.10,0.45,night)*1.5*fl(9.1);
  matWinB.emissiveIntensity=sstep(0.20,0.60,night)*1.6*fl(7.7);
  matWinC.emissiveIntensity=sstep(0.32,0.72,night)*1.6*fl(8.3);
  matHoly.emissiveIntensity=sstep(0.22,0.60,night)*1.9;
  const lanternGlow=sstep(0.15,0.5,night);
  matLantern.emissiveIntensity=lanternGlow*2.3*fl(11.3);
  city.lights.forEach((L,i)=>{
    L.intensity=lanternGlow*(26+9*Math.sin(simT*11+i*2.4)*Math.sin(simT*5.1+i));
  });
  for(const c of clouds) c.m.opacity=0.13+0.42*day+dusk*0.12;

  /* the bell tolls six times a day */
  const q=Math.floor(dayT*4);
  if(q!==lastBell){ lastBell=q; bellAnim=1; }
  bellAnim=Math.max(0,bellAnim-dt/6.5);

  hudClock-=dt;
  if(hudClock<=0){
    hudClock=0.2;
    const mins=Math.floor(dayT*24*60);
    const hh=String(Math.floor(mins/60)).padStart(2,'0');
    const mm=String(Math.floor((mins%60)/5)*5).padStart(2,'0');
    $('clock-time').textContent=`${hh}:${mm}`;
    $('day-marker').style.left=(dayT*100)+'%';
    $('clock-icon').innerHTML=el>0?iconSun:iconMoon;
  }
}

/* ============================================================
   BOOT + MAIN LOOP
   ============================================================ */
regen();
veilName.textContent=city.name;

/* cinematic intro dolly */
controls.theta=-0.45; controls.phi=0.7; controls.radius=430; controls.radiusT=175;
controls.target.set(0,10,0);
controls.flyTo({th:0.55, ph:1.07, r:175, tx:0, ty:7, tz:0}, 4.6);

let prev=performance.now();
let firstFrame=true;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=(now-prev)/1000; prev=now;
  dt=Math.min(dt,0.06);
  simT+=dt;
  dayT=(dayT+dt*timeScale/DAY_LEN)%1;
  city.sharedTime.value=simT;
  waterU.uTime.value=simT;

  updateDayNight(dt);
  controls.update(dt);

  /* citizens wander the street graph */
  const PN=city.walkNodes;
  for(const c of city.walkers){
    if(c.pause>0){ c.pause-=dt; continue; }
    c.t+=dt*c.sp/c.len;
    if(c.t>=1){
      const from=c.a; c.a=c.b;
      const nb=PN[c.a].nb;
      let ch=nb.filter(n=>n!==from);
      if(!ch.length) ch=nb;
      c.b=ch[Math.floor(Math.random()*ch.length)];
      c.len=Math.max(0.1, Math.hypot(PN[c.b].x-PN[c.a].x, PN[c.b].z-PN[c.a].z));
      c.t=0;
      if(Math.random()<0.22) c.pause=0.7+Math.random()*2.8;
    }
    const A=PN[c.a], B=PN[c.b];
    const px=A.x+(B.x-A.x)*c.t, pz=A.z+(B.z-A.z)*c.t;
    c.g.position.set(px, world.terrainH(px,pz), pz);
    c.g.position.y+=Math.abs(Math.sin(simT*7*c.sp+c.ph))*0.055;
    c.g.rotation.y=dampAngle(c.g.rotation.y, Math.atan2(B.x-A.x, B.z-A.z), 10, dt);
  }
  for(const s of city.statics){
    s.g.position.y=world.terrainH(s.g.position.x,s.g.position.z)+Math.sin(simT*1.6+s.ph)*0.012;
    s.g.rotation.y+=Math.sin(simT*0.7+s.ph)*0.0006;
  }

  if(city.blades) city.blades.rotation.z+=dt*0.55;
  if(city.bellPivot) city.bellPivot.rotation.z=Math.sin(simT*4.4)*0.34*bellAnim;
  for(const b of city.boats){
    b.m.position.y=-1.02+Math.sin(simT*1.2+b.ph)*0.07;
    b.m.rotation.z=Math.sin(simT*0.9+b.ph)*0.04;
  }
  for(let i=0;i<birds.length;i++){
    const b=birds[i];
    b.a+=dt*b.w;
    b.g.position.set(Math.cos(b.a)*b.r, b.h+Math.sin(simT*0.8+b.ph)*2.2, -38+Math.sin(b.a)*b.r);
    b.g.rotation.y=-b.a+(b.w>0?0:Math.PI);
    const f=Math.sin(simT*9+i*1.7)*0.55;
    b.w1.rotation.z=f; b.w2.rotation.z=-f;
  }
  for(const c of clouds){
    c.s.position.x+=c.v*dt;
    if(c.s.position.x>470) c.s.position.x=-470;
  }

  renderer.render(scene,camera);
  if(firstFrame){
    firstFrame=false;
    window.__booted=true;
    setTimeout(()=>veil.classList.add('hide'), 350);
  }
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
