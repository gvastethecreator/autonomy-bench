<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06080d">
<title>MERIDIAN · Boot Sequence</title>
<style>
  :root{
    --bg:#06080d;
    --ink:#dbe2ea;
    --dim:#8b95a6;
    --faint:#39424f;
    --accent:#d9a24b;
    --accent-hi:#ffd98f;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* ---------- layers ---------- */
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block}
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(2,3,6,.6) 100%);
  }
  #grain{
    position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    background-size:140px 140px;
  }

  /* ---------- corner HUD ---------- */
  .hud{
    position:fixed;z-index:5;font-size:10px;letter-spacing:.22em;
    color:var(--dim);text-transform:uppercase;
  }
  .hud--tl{top:26px;left:30px;display:flex;flex-direction:column;gap:7px}
  .hud--tr{top:29px;right:32px;font-variant-numeric:tabular-nums;letter-spacing:.18em}
  .wordmark{
    display:flex;align-items:center;gap:11px;color:var(--ink);
    font-size:12px;letter-spacing:.36em;font-weight:600;
  }
  .hud-sub{color:var(--faint);font-size:9px}

  /* ---------- central stage ---------- */
  #stage{
    position:fixed;inset:0;z-index:4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:36px;
  }
  .instrument{position:relative;width:min(300px,68vw,42vh);aspect-ratio:1}
  #dial{position:absolute;inset:0;width:100%;height:100%;display:block}
  .readout{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;pointer-events:none;
  }
  .pct{
    font-size:clamp(40px,7vw,56px);font-weight:300;line-height:1;
    color:#e9edf3;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  }
  .pct-unit{font-size:.36em;color:var(--dim);margin-left:.16em}
  .readout-cap{font-size:8px;letter-spacing:.42em;color:var(--faint);text-transform:uppercase;padding-left:.42em}

  .status{
    display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;min-height:1.2em;
  }
  .caret{width:7px;height:13px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #status-text.swap{animation:swapIn .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes swapIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ---------- bottom track ---------- */
  .track{position:fixed;left:32px;right:32px;bottom:26px;z-index:5}
  .track-meta{
    display:flex;justify-content:space-between;margin-bottom:10px;
    font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }
  .track-bar{position:relative;height:2px;background:rgba(140,155,180,.14)}
  #fill{
    position:absolute;top:0;bottom:0;left:0;width:0%;
    background:var(--accent);box-shadow:0 0 10px rgba(217,162,75,.55);
    transition:width .12s linear;
  }
  .mark{position:absolute;top:-2px;width:1px;height:6px;background:rgba(140,155,180,.28)}

  /* ---------- entrance ---------- */
  .anim{animation-fill-mode:backwards}
  .hud--tl.anim{animation:rise .8s .25s cubic-bezier(.2,.7,.3,1)}
  .hud--tr.anim{animation:rise .8s .40s cubic-bezier(.2,.7,.3,1)}
  .instrument.anim{animation:loom 1.2s .15s cubic-bezier(.16,.8,.3,1)}
  .status.anim{animation:rise .8s .70s cubic-bezier(.2,.7,.3,1)}
  .track.anim{animation:rise .8s .55s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes loom{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:scale(1)}}

  /* ---------- ready panel ---------- */
  #ready{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .45s ease,visibility 0s .45s;
  }
  body.is-ready #ready{
    opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity .9s ease .35s,visibility 0s 0s;
  }
  .ready-mark{margin-bottom:22px;opacity:.9}
  .ready-kicker{
    display:flex;align-items:center;gap:16px;
    font-size:9px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase;
  }
  .ready-kicker::before,.ready-kicker::after{
    content:"";width:56px;height:1px;background:var(--faint);
  }
  .ready-title{
    margin-top:18px;font-size:clamp(34px,7vw,60px);font-weight:300;
    letter-spacing:.32em;padding-left:.32em;color:#eef1f6;
  }
  .ready-sub{margin-top:16px;font-size:10px;letter-spacing:.3em;color:var(--dim)}
  #enter{
    margin-top:46px;background:transparent;cursor:pointer;
    border:1px solid rgba(217,162,75,.5);color:var(--accent);
    font:inherit;font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    padding:15px 35px 15px 41px;
    transition:background .25s ease,color .25s ease,box-shadow .25s ease,border-color .25s ease;
  }
  #enter:hover{
    background:var(--accent);border-color:var(--accent);color:#0a0c10;
    box-shadow:0 0 28px rgba(217,162,75,.35);
  }
  #enter:focus-visible{outline:1px solid var(--accent-hi);outline-offset:4px}
  .ready-hint{margin-top:18px;font-size:8px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase}

  /* ---------- state transition ---------- */
  #stage,.hud,.track{transition:opacity .6s ease,transform .6s ease}
  body.is-ready #stage{opacity:0;transform:translateY(-10px)}
  body.is-ready .hud,body.is-ready .track{opacity:0}

  @media (max-width:560px){
    .hud--tl{top:18px;left:18px}
    .hud--tr{top:20px;right:20px}
    .track{left:18px;right:18px;bottom:18px}
    .instrument{width:min(240px,64vw,34vh)}
    .status{font-size:10px;letter-spacing:.12em}
    .stage-gap{gap:28px}
  }

  @media (prefers-reduced-motion:reduce){
    .caret{animation:none}
    #fill{transition:none}
    .anim{animation-duration:.01s;animation-delay:0s}
  }
</style>
</head>
<body>

  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>

  <header class="hud hud--tl anim">
    <div class="wordmark">
      <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="3.4" y="3.4" width="7.2" height="7.2" transform="rotate(45 7 7)"
              fill="none" stroke="#d9a24b" stroke-width="1.2"/>
      </svg>
      MERIDIAN
    </div>
    <div class="hud-sub">Deep Field Observatory · v2.4.1</div>
  </header>

  <div class="hud hud--tr anim">T+<span id="clock">00.0</span>S</div>

  <main id="stage">
    <section class="instrument anim" aria-label="Boot progress">
      <canvas id="dial"></canvas>
      <div class="readout">
        <div class="pct"><span id="pct">0</span><span class="pct-unit">%</span></div>
        <div class="readout-cap" id="cap">System boot</div>
      </div>
    </section>
    <p class="status anim" role="status" aria-live="polite">
      <span id="status-text" class="swap">Initializing core systems</span><span class="caret" aria-hidden="true"></span>
    </p>
  </main>

  <footer class="track anim">
    <div class="track-meta">
      <span id="phase-label">Phase 01 · Core</span>
      <span id="eta">T-0:10</span>
    </div>
    <div class="track-bar" id="track-bar"><i id="fill"></i></div>
  </footer>

  <section id="ready" aria-hidden="true">
    <div class="ready-mark">
      <svg width="18" height="18" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="3.4" y="3.4" width="7.2" height="7.2" transform="rotate(45 7 7)"
              fill="none" stroke="#d9a24b" stroke-width="1.1"/>
      </svg>
    </div>
    <p class="ready-kicker">Sequence complete</p>
    <h2 class="ready-title">MERIDIAN</h2>
    <p class="ready-sub">Deep Field Observatory · Online</p>
    <button id="enter" type="button">Enter</button>
    <p class="ready-hint">Press Enter to reboot sequence</p>
  </section>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#8b95a6">Boot sequence requires JavaScript.</p></noscript>

<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const pctEl = $("pct"), clockEl = $("clock"), statusEl = $("status-text"),
        phaseEl = $("phase-label"), etaEl = $("eta"), fillEl = $("fill"),
        capEl = $("cap"), enterBtn = $("enter"), readyEl = $("ready");

  /* ------------------------------------------------ phases & pacing */
  const PHASES = [
    { label: "Phase 01 · Core",     status: "Initializing core systems",  at: 0.00 },
    { label: "Phase 02 · Optics",   status: "Calibrating primary optics", at: 0.18 },
    { label: "Phase 03 · Tracking", status: "Aligning star trackers",     at: 0.41 },
    { label: "Phase 04 · Catalog",  status: "Loading deep-field catalog", at: 0.63 },
    { label: "Phase 05 · Checks",   status: "Running final diagnostics",  at: 0.84 },
  ];

  // [seconds, progress] keyframes: fast start, a stall at 67%, a jump, quick finish.
  const FULL = [
    [0.0, 0.00], [1.5, 0.14], [3.1, 0.37], [4.6, 0.58], [5.6, 0.66],
    [6.9, 0.665], [7.15, 0.72], [8.3, 0.93], [9.6, 1.00],
  ];
  const REDUCED = [[0, 0], [2.2, 1]];
  const KEYS = reduceMotion ? REDUCED : FULL;
  const TOTAL = KEYS[KEYS.length - 1][0];

  const smooth = t => t * t * (3 - 2 * t);
  function schedule(t) {
    if (t <= 0) return 0;
    if (t >= TOTAL) return 1;
    for (let i = 1; i < KEYS.length; i++) {
      if (t <= KEYS[i][0]) {
        const [t0, p0] = KEYS[i - 1], [t1, p1] = KEYS[i];
        return p0 + (p1 - p0) * smooth((t - t0) / Math.max(1e-6, t1 - t0));
      }
    }
    return 1;
  }

  /* ------------------------------------------------ canvases */
  const sky = $("sky"), dial = $("dial");
  const sctx = sky.getContext("2d"), dctx = dial.getContext("2d");
  let dpr = 1, cw = 0, ch = 0, dialSize = 0;
  let stars = [];

  function sizeCanvases() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cw = window.innerWidth; ch = window.innerHeight;
    sky.width = Math.round(cw * dpr); sky.height = Math.round(ch * dpr);
    dialSize = dial.clientWidth || 300;
    dial.width = Math.round(dialSize * dpr); dial.height = Math.round(dialSize * dpr);
    initStars();
  }

  function initStars() {
    const n = Math.max(90, Math.min(300, Math.round(cw * ch / 8500)));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * cw, y: Math.random() * ch,
      z: 0.25 + Math.random() * 0.75,
      r: 0.5 + Math.random() * 0.9,
      ph: Math.random() * TAU,
      tw: 0.5 + Math.random() * 1.5,
      warm: Math.random() < 0.12,
      big: Math.random() < 0.05,
    }));
  }

  function drawSky(dt, p) {
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, cw, ch);

    // faint nebulas
    let g = sctx.createRadialGradient(cw * 0.72, ch * 0.18, 0, cw * 0.72, ch * 0.18, ch * 0.55);
    g.addColorStop(0, "rgba(84,104,160,0.055)"); g.addColorStop(1, "rgba(84,104,160,0)");
    sctx.fillStyle = g; sctx.fillRect(0, 0, cw, ch);
    g = sctx.createRadialGradient(cw * 0.14, ch * 0.86, 0, cw * 0.14, ch * 0.86, ch * 0.5);
    g.addColorStop(0, "rgba(66,118,128,0.045)"); g.addColorStop(1, "rgba(66,118,128,0)");
    sctx.fillStyle = g; sctx.fillRect(0, 0, cw, ch);

    for (const s of stars) {
      if (!reduceMotion) {
        const v = (3 + 9 * s.z) * (1 + p * 1.4); // drift quickens with progress
        s.y += v * dt; s.x -= v * 0.22 * dt;
        if (s.y > ch + 2) { s.y = -2; s.x = Math.random() * cw; }
        if (s.x < -2) s.x = cw + 2;
      }
      const twk = reduceMotion ? 0.7 : (0.55 + 0.45 * Math.sin(animT * s.tw + s.ph));
      const a = (s.big ? 0.85 : 0.55) * s.z * twk;
      if (a <= 0.02) continue;
      sctx.fillStyle = s.warm ? `rgba(232,205,168,${a.toFixed(3)})` : `rgba(196,210,232,${a.toFixed(3)})`;
      if (s.big) { sctx.shadowColor = "rgba(200,215,240,.8)"; sctx.shadowBlur = 6; }
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.big ? s.r + 0.7 : s.r, 0, TAU);
      sctx.fill();
      sctx.shadowBlur = 0;
    }
  }

  const TICKS = 72;
  function drawDial(p, t) {
    const S = dialSize, cx = S / 2, cy = S / 2, R = S / 2 - 16;
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dctx.clearRect(0, 0, S, S);

    // inner hairline frame
    dctx.beginPath(); dctx.arc(cx, cy, R * 0.585, 0, TAU);
    dctx.strokeStyle = "rgba(150,166,192,.10)"; dctx.lineWidth = 1; dctx.stroke();

    // radar sweep (trail of fading segments)
    if (!reduceMotion) {
      const swA = -Math.PI / 2 + (t * 0.9) % TAU;
      const segs = 36, spread = 1.15, rIn = R * 0.30, rOut = R - 18;
      for (let k = 0; k < segs; k++) {
        const a = swA - k * (spread / segs);
        dctx.beginPath();
        dctx.moveTo(cx + Math.cos(a) * rIn, cy + Math.sin(a) * rIn);
        dctx.lineTo(cx + Math.cos(a) * rOut, cy + Math.sin(a) * rOut);
        dctx.strokeStyle = `rgba(168,186,212,${(0.09 * (1 - k / segs)).toFixed(3)})`;
        dctx.lineWidth = 1; dctx.stroke();
      }
    }

    // tick ring: passed ticks glow amber, recent ones brightest (comet trail)
    const flash = done ? Math.max(0, 1 - (animT - doneAt) / 0.7) : 0;
    const fr = (217 + 38 * flash) | 0, fg = (162 + 73 * flash) | 0, fb = (75 + 125 * flash) | 0;
    for (let i = 0; i < TICKS; i++) {
      const frac = i / TICKS;
      const a = -Math.PI / 2 + frac * TAU;
      const major = i % 6 === 0;
      const len = major ? 12 : 6;
      let style;
      if (frac <= p + 1e-9) {
        const glow = Math.max(0, 1 - (p - frac) / 0.10);
        style = `rgba(${fr},${fg},${fb},${(0.42 + 0.58 * glow).toFixed(3)})`;
      } else {
        style = major ? "rgba(148,163,188,0.20)" : "rgba(148,163,188,0.09)";
      }
      const r0 = R - len;
      dctx.beginPath();
      dctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      dctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      dctx.strokeStyle = style;
      dctx.lineWidth = major ? 1.5 : 1;
      dctx.stroke();
    }

    // progress arc + head
    if (p > 0.002) {
      const a0 = -Math.PI / 2, a1 = a0 + p * TAU;
      const breathe = 0.78 + 0.14 * Math.sin(t * 2.1);
      dctx.beginPath(); dctx.arc(cx, cy, R + 8, a0, a1);
      dctx.strokeStyle = `rgba(${fr},${fg},${fb},${breathe.toFixed(3)})`;
      dctx.lineWidth = 1.6;
      dctx.shadowColor = "rgba(217,162,75,.75)"; dctx.shadowBlur = 9;
      dctx.stroke(); dctx.shadowBlur = 0;

      const hx = cx + Math.cos(a1) * (R + 8), hy = cy + Math.sin(a1) * (R + 8);
      dctx.beginPath(); dctx.arc(hx, hy, 2.6, 0, TAU);
      dctx.fillStyle = "#ffe3ae";
      dctx.shadowColor = "rgba(255,220,150,.9)"; dctx.shadowBlur = 12;
      dctx.fill(); dctx.shadowBlur = 0;
    }

    // completion pulse
    if (done) {
      const k = (animT - doneAt) / 0.9;
      if (k < 1) {
        const e = 1 - Math.pow(1 - k, 3);
        dctx.beginPath(); dctx.arc(cx, cy, R * 0.585 + e * R * 0.9, 0, TAU);
        dctx.strokeStyle = `rgba(${fr},${fg},${fb},${(0.35 * (1 - k)).toFixed(3)})`;
        dctx.lineWidth = 1.2; dctx.stroke();
      }
    }
  }

  /* ------------------------------------------------ HUD text */
  let lastPct = -1, lastPhaseIdx = -1, lastEta = "", lastClock = "", lastW = -1;

  function swapStatus(text) {
    statusEl.classList.remove("swap");
    void statusEl.offsetWidth; // reflow to restart the animation
    statusEl.textContent = text;
    statusEl.classList.add("swap");
  }

  function updateHUD(p, elapsed) {
    const pct = Math.floor(p * 100);
    if (pct !== lastPct) { pctEl.textContent = pct; lastPct = pct; }

    const clock = elapsed.toFixed(1).padStart(4, "0");
    if (clock !== lastClock) { clockEl.textContent = clock; lastClock = clock; }

    let idx = 0;
    for (let i = 0; i < PHASES.length; i++) if (p >= PHASES[i].at - 1e-9) idx = i;
    if (idx !== lastPhaseIdx) {
      phaseEl.textContent = PHASES[idx].label;
      swapStatus(PHASES[idx].status);
      lastPhaseIdx = idx;
    }

    const eta = done ? "READY" : "T-0:" + String(Math.ceil(Math.max(0, TOTAL - elapsed))).padStart(2, "0");
    if (eta !== lastEta) { etaEl.textContent = eta; lastEta = eta; }

    const w = p * 100;
    if (Math.abs(w - lastW) > 0.12) { fillEl.style.width = w + "%"; lastW = w; }
  }

  /* ------------------------------------------------ state machine */
  let done = false, doneAt = 0, elapsed = 0, animT = 0;

  function finish() {
    done = true;
    doneAt = animT;
    pctEl.textContent = "100"; lastPct = 100;
    capEl.textContent = "Nominal";
    swapStatus("All systems nominal");
    phaseEl.textContent = "Sequence complete";
    etaEl.textContent = "READY"; lastEta = "READY";
    fillEl.style.width = "100%"; lastW = 100;
    clockEl.textContent = TOTAL.toFixed(1).padStart(4, "0");
    setTimeout(() => {
      document.body.classList.add("is-ready");
      readyEl.setAttribute("aria-hidden", "false");
      enterBtn.focus({ preventScroll: true });
    }, reduceMotion ? 450 : 1300);
  }

  function replayEntrance() {
    document.querySelectorAll(".anim").forEach(el => {
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
    });
  }

  function restart() {
    document.body.classList.remove("is-ready");
    readyEl.setAttribute("aria-hidden", "true");
    enterBtn.blur();
    done = false; doneAt = 0; elapsed = 0;
    lastPct = -1; lastPhaseIdx = -1; lastEta = ""; lastClock = ""; lastW = -1;
    pctEl.textContent = "0";
    capEl.textContent = "System boot";
    clockEl.textContent = "00.0";
    phaseEl.textContent = PHASES[0].label;
    swapStatus(PHASES[0].status);
    etaEl.textContent = "T-0:" + String(Math.ceil(TOTAL)).padStart(2, "0");
    fillEl.style.width = "0%";
    replayEntrance();
  }

  enterBtn.addEventListener("click", restart);
  window.addEventListener("keydown", e => {
    if (!document.body.classList.contains("is-ready")) return;
    if (e.target === enterBtn) return; // let the button handle its own Enter
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restart(); }
  });

  /* ------------------------------------------------ main loop */
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05; // clamp tab-away jumps
    animT += dt;

    let p;
    if (done) {
      p = 1;
    } else {
      elapsed += dt;
      p = schedule(Math.min(elapsed, TOTAL));
      if (!reduceMotion) {
        // sensor jitter, damped near the ends
        p = Math.min(0.995, Math.max(0, p + Math.sin(animT * 11.3) * 0.0011 + Math.sin(animT * 2.7) * 0.0007));
      }
    }

    drawSky(dt, done ? 1 : p);
    drawDial(p, animT);
    if (!done) updateHUD(p, elapsed);
    if (!done && elapsed >= TOTAL) finish();

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------ boot */
  // phase markers on the bottom track
  for (const f of [0.18, 0.41, 0.63, 0.84]) {
    const m = document.createElement("i");
    m.className = "mark";
    m.style.left = (f * 100) + "%";
    $("track-bar").appendChild(m);
  }

  window.addEventListener("resize", sizeCanvases);
  sizeCanvases();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
