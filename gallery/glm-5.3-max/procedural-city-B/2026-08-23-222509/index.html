<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne — a procedural night city</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;
    font-family:"Bahnschrift","Avenir Next","Futura","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.55) 100%)}
  #hud{position:fixed;top:28px;left:32px;z-index:4;pointer-events:none}
  #title{font-size:21px;font-weight:300;letter-spacing:.5em;color:#d6dcea;margin-bottom:7px}
  #subtitle{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#5d6680}
  #rule{width:52px;height:1px;background:rgba(57,64,82,.6);margin:10px 0 0}
  #stats{position:fixed;left:32px;bottom:26px;z-index:4;pointer-events:none;
    font:10px/1.7 ui-monospace,Consolas,monospace;color:#454e63;letter-spacing:.12em}
  #hint{position:fixed;right:32px;bottom:26px;z-index:4;pointer-events:none;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#454e63}
  #regen{position:fixed;top:28px;right:32px;z-index:5;cursor:pointer;
    font-family:"Bahnschrift","Segoe UI",sans-serif;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:#9aa6c0;background:rgba(10,13,20,.55);border:1px solid #262d3d;padding:10px 16px;
    backdrop-filter:blur(6px);transition:border-color .25s,color .25s}
  #regen:hover{border-color:#3c4a66;color:#d6dcea}
  #flash{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6;transition:opacity .45s ease}
  #loader{position:fixed;inset:0;background:#05060a;z-index:7;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity 1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .dot{width:8px;height:8px;border-radius:50%;background:#7d8db3;animation:pulse 1.2s ease-in-out infinite}
  #loader .msg{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#4d566e}
  @keyframes pulse{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  @media (max-width:680px){#hint,#stats,#rule{display:none}#hud{top:20px;left:20px}#regen{top:20px;right:20px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="hud">
  <div id="title">NOCTURNE</div>
  <div id="subtitle">procedural night city</div>
  <div id="rule"></div>
</div>
<div id="stats"></div>
<div id="hint">drag orbit&ensp;&middot;&ensp;scroll zoom&ensp;&middot;&ensp;R new city</div>
<button id="regen">New city</button>
<div id="flash"></div>
<div id="loader"><div class="dot"></div><div class="msg" id="loaderMsg">generating city</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   NOCTURNE — a living procedural city at night
   Seeded generation: buildings with animated window grids,
   neon, traffic, rooftop beacons, aircraft, baked street light.
   ============================================================ */

const GRID = 13;                    // city blocks per side
const BLOCK = 26, STREET = 10;      // meters
const PITCH = BLOCK + STREET;       // 36
const CITY_SIZE = GRID * BLOCK + (GRID + 1) * STREET; // 478
const HALF = CITY_SIZE / 2;         // 239
const streetCoords = [];            // 14 street center lines per axis
for (let i = 0; i <= GRID; i++) streetCoords.push(-HALF + STREET / 2 + i * PITCH);
const blockCenter = j => -HALF + STREET + BLOCK / 2 + j * PITCH; // 13 block centers

const N_CARS = 210;
const NEON_PALETTE = [
  [0.35, 1.9, 2.3],   // cyan
  [2.5, 0.35, 1.55],  // magenta
  [2.7, 1.15, 0.22],  // amber
  [0.75, 2.2, 0.7],   // green
  [0.6, 1.05, 2.7],   // blue
];
const SIGN_WORDS = ['HOTEL','BAR','NOODLES','24 HR','OPEN','CLUB NEON','RAMEN','LIQUOR',
  'CINEMA','TAXI','PAWN','CAFE','MOTEL','SUSHI','KARAOKE','GATE 7','ZUZU','BILLIARDS'];
const SIGN_COLORS = ['#ff2d78','#22e6ff','#ffae00','#7dff4a','#8f7bff','#ff5c1a'];

/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rand = mulberry32(1);
const range=(a,b)=>a+(b-a)*rand();
const pick=arr=>arr[Math.floor(rand()*arr.length)];

/* ---------- DOM ---------- */
const app=document.getElementById('app');
const loader=document.getElementById('loader');
const loaderMsg=document.getElementById('loaderMsg');
const statsEl=document.getElementById('stats');
const flashEl=document.getElementById('flash');
let started=false;
setTimeout(()=>{ if(!started) loaderMsg.textContent='loading three.js from cdn — check connection'; },8000);

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(new THREE.Color(0.075,0.068,0.125),0.0024);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,6000);
const camA=new THREE.Vector3(470,340,630), camB=new THREE.Vector3(238,148,338);
camera.position.copy(camA);
camera.lookAt(0,24,0);

/* ---------- shared glow sprite texture ---------- */
function makeGlowTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.25,'rgba(255,255,255,0.55)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const glowTex=makeGlowTexture();

/* ---------- sky ---------- */
const moonDir=new THREE.Vector3(0.5,0.45,-0.73).normalize();
const sky=new THREE.Mesh(
  new THREE.SphereGeometry(1900,32,20),
  new THREE.ShaderMaterial({
    side:THREE.BackSide,fog:false,depthWrite:false,
    uniforms:{uMoonDir:{value:moonDir}},
    vertexShader:`
      varying vec3 vDir;
      void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 uMoonDir;
      varying vec3 vDir;
      float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
      void main(){
        vec3 d=normalize(vDir);
        float h=clamp(d.y,-1.0,1.0);
        vec3 zen=vec3(0.010,0.013,0.030);
        vec3 hor=vec3(0.075,0.070,0.120);
        vec3 col=mix(hor,zen,pow(clamp(h,0.0,1.0),0.42));
        float hh=max(h,0.0);
        float band=pow(1.0-clamp(hh*1.5,0.0,1.0),6.0)*smoothstep(-0.06,0.02,h);
        col+=vec3(0.30,0.14,0.09)*band;
        float m=pow(max(dot(d,uMoonDir),0.0),48.0);
        col+=vec3(0.28,0.33,0.48)*m*0.8;
        col+=(hash12(gl_FragCoord.xy)-0.5)*0.006;
        gl_FragColor=vec4(col,1.0);
      }`
  }));
scene.add(sky);

/* ---------- stars ---------- */
{
  const N=1300,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const az=rand()*Math.PI*2;
    const el=Math.asin(rand())*0.95+0.08;   // above horizon
    const r=1750;
    pos[i*3]=Math.cos(az)*Math.cos(el)*r; pos[i*3+1]=Math.sin(el)*r; pos[i*3+2]=Math.sin(az)*Math.cos(el)*r;
    const b=0.25+Math.random()*0.75, w=Math.random();
    col[i*3]=b*(w<0.15?0.75:(w<0.3?1.0:0.95));
    col[i*3+1]=b*(w<0.15?0.85:0.95);
    col[i*3+2]=b*(w<0.15?1.0:(w<0.3?0.8:1.0));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({
    size:1.7,sizeAttenuation:false,map:glowTex,vertexColors:true,transparent:true,
    depthWrite:false,blending:THREE.AdditiveBlending,fog:false})));
}

/* ---------- moon ---------- */
{
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');
  let gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.38,'rgba(238,243,255,1)');
  gr.addColorStop(0.44,'rgba(210,224,255,0.35)');gr.addColorStop(1,'rgba(180,200,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,
    depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
  core.position.copy(moonDir).multiplyScalar(1750);core.scale.setScalar(150);
  scene.add(core);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.16,
    depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
  halo.position.copy(core.position);halo.scale.setScalar(420);
  scene.add(halo);
}

/* ---------- ground: baked asphalt, streets, lamp pools ---------- */
const lampPositions=[];
{
  const G=760,S=2048,px=S/G;
  const cv=document.createElement('canvas');cv.width=cv.height=S;
  const g=cv.getContext('2d');
  const X=w=>(w+G/2)*px, M=m=>m*px;
  g.fillStyle='#07080c';g.fillRect(0,0,S,S);
  g.fillStyle='#0b0d12';
  g.fillRect(X(-HALF-16),X(-HALF-16),M(CITY_SIZE+32),M(CITY_SIZE+32));
  // blocks: sidewalk + interior lot
  for(let bi=0;bi<GRID;bi++)for(let bk=0;bk<GRID;bk++){
    const cx=blockCenter(bi),cz=blockCenter(bk),s=BLOCK/2;
    g.fillStyle='#14161c';
    g.fillRect(X(cx-s-2.4),X(cz-s-2.4),M(BLOCK+4.8),M(BLOCK+4.8));
    g.fillStyle='#0e1015';
    g.fillRect(X(cx-s),X(cz-s),M(BLOCK),M(BLOCK));
  }
  // streets
  g.fillStyle='#15171d';
  for(const c of streetCoords){
    g.fillRect(X(c-5),X(-HALF-5),M(10),M(CITY_SIZE+10));
    g.fillRect(X(-HALF-5),X(c-5),M(CITY_SIZE+10),M(10));
  }
  // lane dashes
  g.fillStyle='rgba(190,200,225,0.28)';
  for(const c of streetCoords){
    for(let z=-HALF;z<HALF;z+=9){
      g.fillRect(X(c-0.22),X(z),M(0.44),M(3.2));
      g.fillRect(X(z),X(c-0.22),M(3.2),M(0.44));
    }
  }
  // lamps: intersections + street midpoints
  for(const cx of streetCoords)for(const cz of streetCoords) lampPositions.push([cx,cz]);
  for(const c of streetCoords){
    for(let i=0;i<streetCoords.length-1;i++){
      const m=(streetCoords[i]+streetCoords[i+1])/2, side=(i%2?4.6:-4.6);
      lampPositions.push([c+side,m],[m,c-side]);
    }
  }
  // baked warm pools
  for(const [lx,lz] of lampPositions){
    const r=M(7.5);
    const gr=g.createRadialGradient(X(lx),X(lz),0,X(lx),X(lz),r);
    gr.addColorStop(0,'rgba(255,190,110,0.20)');
    gr.addColorStop(0.5,'rgba(255,170,90,0.08)');
    gr.addColorStop(1,'rgba(255,160,80,0)');
    g.fillStyle=gr;g.beginPath();g.arc(X(lx),X(lz),r,0,7);g.fill();
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const plate=new THREE.Mesh(new THREE.PlaneGeometry(G,G),
    new THREE.MeshBasicMaterial({map:tex}));
  plate.rotation.x=-Math.PI/2;scene.add(plate);
  const outer=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),
    new THREE.MeshBasicMaterial({color:new THREE.Color(0.028,0.032,0.042)}));
  outer.rotation.x=-Math.PI/2;outer.position.y=-0.2;scene.add(outer);

  // lamp glow points
  const n=lampPositions.length,pp=new Float32Array(n*3),cc=new Float32Array(n*3);
  lampPositions.forEach(([x,z],i)=>{pp[i*3]=x;pp[i*3+1]=7;pp[i*3+2]=z;
    cc[i*3]=1.45;cc[i*3+1]=0.82;cc[i*3+2]=0.34;});
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  lg.setAttribute('color',new THREE.BufferAttribute(cc,3));
  scene.add(new THREE.Points(lg,new THREE.PointsMaterial({size:2.0,map:glowTex,vertexColors:true,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));
}

/* ---------- post: bloom ---------- */
const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{samples:4,type:THREE.HalfFloatType});
const composer=new EffectComposer(renderer,rt);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.55,0.3);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- controls + intro shot ---------- */
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,24,0);
controls.enableDamping=true;controls.dampingFactor=0.06;
controls.minDistance=40;controls.maxDistance=900;
controls.maxPolarAngle=Math.PI*0.495;
controls.enablePan=false;
controls.autoRotate=true;controls.autoRotateSpeed=0.55;
controls.enabled=false;
let introT=0,introDone=false,idleTimer=null;
renderer.domElement.addEventListener('pointerdown',()=>{
  if(!introDone){introDone=true;}
  controls.enabled=true;
},{passive:true});
controls.addEventListener('start',()=>{controls.autoRotate=false;clearTimeout(idleTimer);});
controls.addEventListener('end',()=>{clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>controls.autoRotate=true,14000);});

/* ---------- aircraft (persistent, independent of seed) ---------- */
const aircraft=[];
const airGeo=new THREE.BufferGeometry();
const airPos=new Float32Array(9*3),airCol=new Float32Array(9*3);
{
  const rand0=mulberry32(777);
  for(let i=0;i<3;i++){
    aircraft.push({
      p:new THREE.Vector3(-1200+rand0()*600,260+rand0()*70,-400+rand0()*800),
      v:new THREE.Vector3(28+rand0()*18,0,(rand0()-0.5)*10),
      ph:rand0()*10});
  }
  airGeo.setAttribute('position',new THREE.BufferAttribute(airPos,3).setUsage(THREE.DynamicDrawUsage));
  airGeo.setAttribute('color',new THREE.BufferAttribute(airCol,3).setUsage(THREE.DynamicDrawUsage));
  scene.add(new THREE.Points(airGeo,new THREE.PointsMaterial({size:2.4,map:glowTex,vertexColors:true,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false,sizeAttenuation:true})));
}
function updateAircraft(dt,t){
  aircraft.forEach((a,i)=>{
    a.p.addScaledVector(a.v,dt);
    if(a.p.x>1400){a.p.x=-1400;a.p.z=-600+Math.random()*1200;}
    const base=i*3;
    // steady white + red strobe + green strobe
    airPos[(base+0)*3]=a.p.x;airPos[(base+0)*3+1]=a.p.y;airPos[(base+0)*3+2]=a.p.z;
    airPos[(base+1)*3]=a.p.x-2;airPos[(base+1)*3+1]=a.p.y;airPos[(base+1)*3+2]=a.p.z+1;
    airPos[(base+2)*3]=a.p.x-2;airPos[(base+2)*3+1]=a.p.y;airPos[(base+2)*3+2]=a.p.z-1;
    const rOn=(t*1.1+a.ph)%1<0.12?1:0, gOn=(t*1.1+a.ph+0.5)%1<0.12?1:0;
    airCol[(base+0)*3]=1.1;airCol[(base+0)*3+1]=1.1;airCol[(base+0)*3+2]=1.25;
    airCol[(base+1)*3]=2.4*rOn;airCol[(base+1)*3+1]=0.2*rOn;airCol[(base+1)*3+2]=0.2*rOn;
    airCol[(base+2)*3]=0.2*gOn;airCol[(base+2)*3+1]=2.4*gOn;airCol[(base+2)*3+2]=0.4*gOn;
  });
  airGeo.attributes.position.needsUpdate=true;
  airGeo.attributes.color.needsUpdate=true;
}

/* ---------- neon sign textures ---------- */
function makeSignTexture(text,color,vertical){
  const font='Arial, sans-serif';
  const cv=document.createElement('canvas');
  const g=cv.getContext('2d');
  if(vertical){
    const lh=112;cv.width=170;cv.height=text.length*lh+40;
    g.font='900 92px '+font;g.textAlign='center';g.textBaseline='middle';
    for(let i=0;i<text.length;i++){
      const x=cv.width/2,y=(i+0.5)*lh+20;
      g.shadowColor=color;g.shadowBlur=30;g.fillStyle=color;g.fillText(text[i],x,y);g.fillText(text[i],x,y);
      g.shadowBlur=8;g.fillStyle='#fff';g.globalAlpha=0.85;g.fillText(text[i],x,y);g.globalAlpha=1;
    }
  }else{
    cv.width=720;cv.height=170;
    let fs=100;g.font='900 '+fs+'px '+font;
    while(g.measureText(text).width>640&&fs>30){fs-=6;g.font='900 '+fs+'px '+font;}
    g.textAlign='center';g.textBaseline='middle';
    const x=cv.width/2,y=cv.height/2;
    g.shadowColor=color;g.shadowBlur=34;g.fillStyle=color;
    g.fillText(text,x,y);g.fillText(text,x,y);
    g.shadowBlur=10;g.fillStyle='#fff';g.globalAlpha=0.85;g.fillText(text,x,y);g.globalAlpha=1;
  }
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;
  return {tex:t,aspect:cv.width/cv.height};
}
function makeBillboardTexture(text,color){
  const cv=document.createElement('canvas');cv.width=1024;cv.height=288;
  const g=cv.getContext('2d');
  g.strokeStyle=color;g.lineWidth=10;g.shadowColor=color;g.shadowBlur=26;
  g.strokeRect(28,28,cv.width-56,cv.height-56);
  let fs=150;g.font='900 '+fs+'px Arial, sans-serif';
  while(g.measureText(text).width>cv.width-160&&fs>30){fs-=10;g.font='900 '+fs+'px Arial, sans-serif';}
  g.textAlign='center';g.textBaseline='middle';g.fillStyle=color;
  g.fillText(text,cv.width/2,cv.height/2+8);g.fillText(text,cv.width/2,cv.height/2+8);
  g.shadowBlur=10;g.fillStyle='#fff';g.globalAlpha=0.85;
  g.fillText(text,cv.width/2,cv.height/2+8);g.globalAlpha=1;
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ---------- building shader (animated procedural windows) ---------- */
const BUILDING_VERT=`
  attribute float aSeed;
  attribute vec3 aTint;
  varying vec3 vWorldPos;
  varying vec3 vN;
  varying float vSeed;
  varying vec3 vTint;
  #include <fog_pars_vertex>
  void main(){
    vSeed=aSeed;vTint=aTint;
    vec4 wp=instanceMatrix*vec4(position,1.0);
    vWorldPos=(modelMatrix*wp).xyz;
    vN=normalize(mat3(instanceMatrix)*normal);
    vec4 mvPosition=viewMatrix*modelMatrix*wp;
    gl_Position=projectionMatrix*mvPosition;
    #include <fog_vertex>
  }`;
const BUILDING_FRAG=`
  uniform float uTime;
  uniform vec3 uMoonDir;
  varying vec3 vWorldPos;
  varying vec3 vN;
  varying float vSeed;
  varying vec3 vTint;
  #include <fog_pars_fragment>
  float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
  void main(){
    vec3 n=vN;
    vec3 col;
    float faceId=n.x*3.0+n.z*5.0;
    float lamb=0.5+0.5*max(dot(n,uMoonDir),0.0);
    if(abs(n.y)>0.5){
      float r=hash12(floor(vWorldPos.xz*0.9)+vSeed*7.0);
      col=mix(vec3(0.028,0.030,0.038),vec3(0.045,0.043,0.050),r)*vTint*(0.6+0.4*lamb);
    }else{
      float u=abs(n.x)>0.5?vWorldPos.z:vWorldPos.x;
      float v=vWorldPos.y;
      float fh=hash12(vec2(faceId*3.1,vSeed*77.7));
      vec3 facade=mix(vec3(0.040,0.046,0.062),vec3(0.070,0.062,0.054),fh)*vTint;
      facade*=0.55+0.45*lamb;
      facade*=mix(0.8,1.0,clamp(v/60.0,0.0,1.0));
      float store=step(v,4.4);
      float cellW=mix(2.7,4.2,store);
      float floorH=mix(3.1,4.4,store);
      vec2 cell=floor(vec2(u/cellW,v/floorH));
      vec2 f=fract(vec2(u/cellW,v/floorH));
      float inWin=step(mix(0.20,0.05,store),f.x)*step(f.x,mix(0.80,0.95,store))
                 *step(mix(0.32,0.08,store),f.y)*step(f.y,mix(0.85,0.92,store));
      float w1=hash12(cell+vec2(faceId*13.7,vSeed*91.3));
      float w2=hash12(cell*1.13+vec2(vSeed*57.1,faceId*7.9));
      float w3=hash12(cell+vec2(vSeed*23.7,faceId*3.1+4.7));
      float occ=0.30+0.28*hash12(vec2(vSeed,3.7));
      float cyc=fract(w1*61.7+uTime*(0.012+0.05*w2));
      float lit=step(cyc,mix(occ,0.88,store));
      vec3 warm=vec3(1.0,0.70,0.40);
      vec3 cool=vec3(0.68,0.80,1.05);
      vec3 wc=mix(warm,cool,step(0.78,w3));
      wc=mix(wc,vec3(0.45,1.0,1.25),step(0.85,w3)*store);
      float bri=(0.5+0.9*w2)*mix(1.0,1.5,store);
      float fl=step(0.965,fract(w1*7.31));
      bri*=1.0-fl*0.55*(0.5+0.5*sin(uTime*34.0+w1*99.0));
      vec3 litCol=wc*bri;
      vec3 darkWin=facade*0.6+vec3(0.012,0.018,0.040);
      vec3 winCol=mix(darkWin,litCol,lit);
      col=mix(facade,winCol,inWin);
    }
    gl_FragColor=vec4(col,1.0);
    #include <fog_fragment>
  }`;

/* ---------- city (seeded, rebuildable) ---------- */
let city=null;

function buildCity(seed){
  if(city){
    scene.remove(city.group);
    city.group.traverse(o=>{
      if(o.geometry)o.geometry.dispose();
      if(o.isInstancedMesh)o.dispose();
      if(o.material){
        for(const m of [].concat(o.material)){if(m.map)m.map.dispose();m.dispose();}
      }
    });
  }
  rand=mulberry32(seed);
  const group=new THREE.Group();

  /* --- building lots --- */
  const buildings=[];
  for(let bi=0;bi<GRID;bi++)for(let bk=0;bk<GRID;bk++){
    if(rand()<0.04)continue;              // occasional empty lot
    const cx=blockCenter(bi),cz=blockCenter(bk);
    const d=Math.hypot(cx,cz);
    const centerF=Math.exp(-(d*d)/(2*130*130));
    let n=1+(rand()<0.6?1:0)+(rand()<0.4?1:0)+(rand()<0.2?1:0);
    const lots=[];
    if(n===1){
      lots.push([cx,cz,range(15,23),range(15,23)]);
    }else if(n===2){
      const vert=rand()<0.5,off=range(5.5,6.5);
      for(const s of [-1,1]){
        lots.push([cx+(vert?off*s:0),cz+(vert?0:off*s),
          vert?range(8,11):range(16,23),vert?range(16,23):range(8,11)]);
      }
    }else{
      const q=range(8.5,10.5);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        if(rand()<0.88)lots.push([cx+sx*q,cz+sz*q,range(8,11),range(8,11)]);
      }
    }
    for(const [x,z,w,dd] of lots){
      let h=6+range(0,10)+centerF*range(60,150);
      if(rand()<0.03)h*=1.5;
      if(n>2)h*=0.7;
      h=Math.min(h,190);
      if(h>90){w=Math.min(w,16);dd=Math.min(dd,16);}
      buildings.push({x,z,w,d:dd,h,seed:rand()*100,
        tint:pick([[0.9,0.95,1.1],[1.05,1,0.9],[1,1,1],[0.85,0.9,1.05],[1.1,0.95,0.85]])});
    }
  }

  /* --- instanced buildings with window shader --- */
  const mat=new THREE.ShaderMaterial({
    uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,
      {uTime:{value:0},uMoonDir:{value:moonDir}}]),
    vertexShader:BUILDING_VERT,fragmentShader:BUILDING_FRAG,fog:true});
  const bgeo=new THREE.BoxGeometry(1,1,1);bgeo.translate(0,0.5,0);
  const seeds=new Float32Array(buildings.length);
  const tints=new Float32Array(buildings.length*3);
  const bmesh=new THREE.InstancedMesh(bgeo,mat,buildings.length);
  const dummy=new THREE.Object3D();
  buildings.forEach((b,i)=>{
    dummy.position.set(b.x,0,b.z);dummy.scale.set(b.w,b.h,b.d);dummy.rotation.set(0,0,0);
    dummy.updateMatrix();bmesh.setMatrixAt(i,dummy.matrix);
    seeds[i]=b.seed;
    tints[i*3]=b.tint[0];tints[i*3+1]=b.tint[1];tints[i*3+2]=b.tint[2];
  });
  bgeo.setAttribute('aSeed',new THREE.InstancedBufferAttribute(seeds,1));
  bgeo.setAttribute('aTint',new THREE.InstancedBufferAttribute(tints,3));
  group.add(bmesh);

  /* --- neon corner strips + roof crowns --- */
  const neonEntries=[];
  for(const b of buildings){
    if(b.h>50&&rand()<0.4){
      const c=pick(NEON_PALETTE);
      const len=b.h*range(0.5,0.85);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        neonEntries.push({p:[b.x+sx*(b.w/2-0.3),len/2,b.z+sz*(b.d/2-0.3)],s:[0.35,len,0.35],c});
      }
      if(b.h>110&&rand()<0.5){
        for(const [ox,oz,sw,sd] of [[0,-b.d/2,b.w,0.3],[0,b.d/2,b.w,0.3],
                                     [-b.w/2,0,0.3,b.d],[b.w/2,0,0.3,b.d]]){
          neonEntries.push({p:[b.x+ox,b.h,b.z+oz],s:[sw,0.3,sd],c});
        }
      }
    }
  }
  if(neonEntries.length){
    const ngeo=new THREE.BoxGeometry(1,1,1);
    const nmesh=new THREE.InstancedMesh(ngeo,
      new THREE.MeshBasicMaterial({color:0xffffff}),neonEntries.length);
    neonEntries.forEach((e,i)=>{
      dummy.position.set(e.p[0],e.p[1],e.p[2]);dummy.scale.set(e.s[0],e.s[1],e.s[2]);
      dummy.rotation.set(0,0,0);dummy.updateMatrix();nmesh.setMatrixAt(i,dummy.matrix);
      nmesh.setColorAt(i,new THREE.Color(e.c[0],e.c[1],e.c[2]));
    });
    group.add(nmesh);
  }

  /* --- rooftop beacons --- */
  const beacons=[];
  for(const b of buildings){
    if(b.h>65)beacons.push({p:[b.x,b.h+1.5,b.z],ph:rand()*10,white:false});
  }
  const tallest=[...buildings].sort((a,b2)=>b2.h-a.h).slice(0,3);
  for(const b of tallest)beacons.push({p:[b.x,b.h+1.8,b.z],ph:rand()*10,white:true});
  let beaconPts=null,beaconCol=null;
  if(beacons.length){
    const bp=new Float32Array(beacons.length*3);
    beaconCol=new Float32Array(beacons.length*3);
    beacons.forEach((b,i)=>{bp[i*3]=b.p[0];bp[i*3+1]=b.p[1];bp[i*3+2]=b.p[2];});
    const bg=new THREE.BufferGeometry();
    bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
    bg.setAttribute('color',new THREE.BufferAttribute(beaconCol,3).setUsage(THREE.DynamicDrawUsage));
    beaconPts=new THREE.Points(bg,new THREE.PointsMaterial({size:2.4,map:glowTex,vertexColors:true,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
    beaconPts.frustumCulled=false;
    group.add(beaconPts);
  }

  /* --- neon signs --- */
  const signs=[];
  const candidates=buildings.filter(b=>b.h>14);
  const signCount=Math.min(16,candidates.length);
  for(let i=0;i<signCount;i++){
    const b=pick(candidates);
    const vertical=rand()<0.35;
    const word=pick(SIGN_WORDS);
    const color=pick(SIGN_COLORS);
    const {tex,aspect}=makeSignTexture(word,color,vertical);
    let W,H;
    if(vertical){H=Math.min(b.h-6,22);W=H*aspect;}
    else{W=6.8;H=W/aspect;}
    // face outward from block center when lot is offset
    const bcx=blockCenter(Math.round((b.x+HALF-STREET-BLOCK/2)/PITCH));
    const bcz=blockCenter(Math.round((b.z+HALF-STREET-BLOCK/2)/PITCH));
    let face;
    if(Math.abs(b.x-bcx)>2||Math.abs(b.z-bcz)>2){
      face=Math.abs(b.x-bcx)>Math.abs(b.z-bcz)?(b.x>bcx?'+x':'-x'):(b.z>bcz?'+z':'-z');
    }else face=pick(['+x','-x','+z','-z']);
    let px=b.x,py=range(6,Math.max(7,Math.min(b.h-4,vertical?Math.min(b.h-8,24):26))),pz=b.z,ry=0;
    py=Math.min(py,b.h-H/2-1);py=Math.max(py,H/2+0.5);
    const jx=range(-0.3,0.3),jz=range(-0.3,0.3);
    if(face==='+x'){px=b.x+b.w/2+0.15;pz=b.z+jz*(b.d/2-H/2-0.5);ry=Math.PI/2;}
    else if(face==='-x'){px=b.x-b.w/2-0.15;pz=b.z+jz*(b.d/2-H/2-0.5);ry=-Math.PI/2;}
    else if(face==='+z'){pz=b.z+b.d/2+0.15;px=b.x+jx*(b.w/2-W/2-0.5);ry=0;}
    else{pz=b.z-b.d/2-0.15;px=b.x+jx*(b.w/2-W/2-0.5);ry=Math.PI;}
    const m=new THREE.Mesh(new THREE.PlaneGeometry(W,H),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,
        blending:THREE.AdditiveBlending,fog:false}));
    m.position.set(px,py,pz);m.rotation.y=ry;m.renderOrder=10;
    group.add(m);
    signs.push({mesh:m,base:range(0.75,1),spd:range(1.5,5),ph:rand()*20});
  }
  // rooftop billboards on tall towers
  const towers=buildings.filter(b=>b.h>80);
  for(let i=0;i<Math.min(4,towers.length);i++){
    const b=towers[Math.floor(rand()*towers.length)];
    const tex=makeBillboardTexture(pick(['AZURA','PAN AM','KIRIN','ORBIT','VOLT','MERIDIAN']),pick(SIGN_COLORS));
    const m=new THREE.Mesh(new THREE.PlaneGeometry(13,3.6),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,
        blending:THREE.AdditiveBlending,fog:false,side:THREE.DoubleSide}));
    m.position.set(b.x,b.h+2.6,b.z);
    m.rotation.y=Math.PI/4*Math.floor(rand()*4);
    m.renderOrder=10;
    group.add(m);
    signs.push({mesh:m,base:1,spd:range(0.5,1.5),ph:rand()*20});
  }

  /* --- traffic --- */
  const cars=[];
  for(let i=0;i<N_CARS;i++){
    cars.push({
      axis:rand()<0.5?0:1,
      line:streetCoords[Math.floor(rand()*streetCoords.length)],
      dir:rand()<0.5?1:-1,
      pos:range(-HALF,HALF),
      speed:range(8,16),
      len:rand()<0.12?range(7,9):range(3.8,5)});
  }
  const nPts=cars.length*4;
  const tPos=new Float32Array(nPts*3),tCol=new Float32Array(nPts*3);
  cars.forEach((c,i)=>{
    const b=i*4;
    for(let k=0;k<2;k++){tCol[(b+k)*3]=1.7;tCol[(b+k)*3+1]=1.5;tCol[(b+k)*3+2]=1.15;}
    for(let k=2;k<4;k++){tCol[(b+k)*3]=1.8;tCol[(b+k)*3+1]=0.14;tCol[(b+k)*3+2]=0.08;}
  });
  const tGeo=new THREE.BufferGeometry();
  tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3).setUsage(THREE.DynamicDrawUsage));
  tGeo.setAttribute('color',new THREE.BufferAttribute(tCol,3));
  const tPts=new THREE.Points(tGeo,new THREE.PointsMaterial({size:1.7,map:glowTex,vertexColors:true,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  tPts.frustumCulled=false;
  group.add(tPts);
  const carGeo=new THREE.BoxGeometry(1,1,1);
  const bodies=new THREE.InstancedMesh(carGeo,
    new THREE.MeshBasicMaterial({color:0xffffff}),cars.length);
  cars.forEach((c,i)=>{
    const r=rand();
    const col=r<0.12?new THREE.Color(0.7,0.5,0.08)
             :r<0.22?new THREE.Color(0.42,0.44,0.5)
             :new THREE.Color(range(0.03,0.09),range(0.035,0.1),range(0.05,0.12));
    bodies.setColorAt(i,col);
  });
  bodies.frustumCulled=false;
  group.add(bodies);

  scene.add(group);
  city={group,mat,signs,beacons,beaconCol,beaconPts,cars,tGeo,bodies,seed,
        count:buildings.length};
  statsEl.textContent=buildings.length+' buildings  /  '+cars.length+' vehicles  /  seed '+seed;
}

/* ---------- per-frame updates ---------- */
const carDummy=new THREE.Object3D();
function updateTraffic(dt){
  const {cars,tGeo,bodies}=city;
  const pos=tGeo.attributes.position.array;
  cars.forEach((c,i)=>{
    c.pos+=c.dir*c.speed*dt;
    if(c.pos>HALF+10)c.pos=-HALF-10;
    if(c.pos<-HALF-10)c.pos=HALF+10;
    let x,z,dx,dz;
    if(c.axis===0){x=c.pos;z=c.line+2.7*c.dir;dx=c.dir;dz=0;}
    else{z=c.pos;x=c.line-2.7*c.dir;dz=c.dir;dx=0;}
    const hl=c.len*0.5;
    const b=i*4;
    // headlights
    pos[(b+0)*3]=x+dx*hl;      pos[(b+0)*3+1]=0.8;pos[(b+0)*3+2]=z+dz*hl+ (c.axis===0?0.75:0);
    pos[(b+1)*3]=x+dx*hl;      pos[(b+1)*3+1]=0.8;pos[(b+1)*3+2]=z+dz*hl- (c.axis===0?0.75:0);
    if(c.axis===1){pos[(b+0)*3]=x+0.75;pos[(b+1)*3]=x-0.75;}
    // taillights
    pos[(b+2)*3]=x-dx*hl;      pos[(b+2)*3+1]=0.9;pos[(b+2)*3+2]=z-dz*hl+(c.axis===0?0.8:0);
    pos[(b+3)*3]=x-dx*hl;      pos[(b+3)*3+1]=0.9;pos[(b+3)*3+2]=z-dz*hl-(c.axis===0?0.8:0);
    if(c.axis===1){pos[(b+2)*3]=x+0.8;pos[(b+3)*3]=x-0.8;}
    // body
    carDummy.position.set(x,0.85,z);
    carDummy.rotation.set(0,c.axis===0?(c.dir>0?0:Math.PI):(c.dir>0?Math.PI/2:-Math.PI/2),0);
    carDummy.scale.set(c.len,1.5,1.9);
    carDummy.updateMatrix();
    bodies.setMatrixAt(i,carDummy.matrix);
  });
  tGeo.attributes.position.needsUpdate=true;
  bodies.instanceMatrix.needsUpdate=true;
}
function updateBeacons(t){
  if(!city.beaconCol||!city.beaconPts)return;
  const col=city.beaconCol;
  city.beacons.forEach((b,i)=>{
    const on=(t*0.9+b.ph)%1.6<0.18?1:0;
    if(b.white){col[i*3]=2.5*on;col[i*3+1]=2.5*on;col[i*3+2]=2.5*on;}
    else{col[i*3]=2.5*on;col[i*3+1]=0.3*on;col[i*3+2]=0.25*on;}
  });
  city.beaconPts.geometry.attributes.color.needsUpdate=true;
}
function updateSigns(t){
  for(const s of city.signs){
    let o=s.base*(0.84+0.16*Math.sin(t*s.spd+s.ph));
    if(((t*0.31+s.ph*7.7)%1)<0.025)o*=0.15;
    s.mesh.material.opacity=o;
  }
}

/* ---------- seed / regen ---------- */
let seed=parseInt((location.hash||'').replace('#',''),10);
if(!Number.isFinite(seed)||seed<=0)seed=1000+Math.floor(Math.random()*90000);
function regen(newSeed){
  seed=newSeed;
  history.replaceState(null,'','#'+seed);
  buildCity(seed);
  flashEl.style.opacity=1;
  requestAnimationFrame(()=>setTimeout(()=>flashEl.style.opacity=0,80));
}
document.getElementById('regen').addEventListener('click',()=>regen(1000+Math.floor(Math.random()*90000)));
addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R')regen(1000+Math.floor(Math.random()*90000));
});

/* ---------- resize ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

/* ---------- main loop ---------- */
buildCity(seed);
const clock=new THREE.Clock();
let t=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  t+=dt;
  if(city){
    city.mat.uniforms.uTime.value=t;
    updateTraffic(dt);
    updateBeacons(t);
    updateSigns(t);
  }
  updateAircraft(dt,t);
  if(!introDone){
    introT+=dt;
    const k=Math.min(introT/7,1);
    const s=k*k*k*(k*(k*6-15)+10);
    camera.position.lerpVectors(camA,camB,s);
    camera.lookAt(0,24,0);
    if(k>=1){introDone=true;controls.enabled=true;controls.update();}
  }else{
    controls.update();
  }
  composer.render();
  if(!started){started=true;loader.classList.add('done');}
});
</script>
