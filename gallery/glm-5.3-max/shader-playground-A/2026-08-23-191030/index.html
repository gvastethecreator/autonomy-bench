<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A zero-dependency WebGL fragment shader playground in a single HTML file.">
<title>Shader Playground — WebGL fragment shader studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='rgba(10,13,19,0.55)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0d13; --bg2:#0d1018; --panel:#111624; --panel2:#151b2c;
    --border:#1d2536; --border2:#2b3650;
    --text:#dbe2f4; --dim:#8b95ad; --faint:#5a6478;
    --accent:#7c5cff; --accent2:#22d3ee;
    --ok:#3ddc84; --err:#ff5470; --warn:#ffb454;
    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
    --ui: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--ui);
    font-size:14px; display:flex; flex-direction:column; overflow:hidden;
  }
  button{ font-family:inherit; }

  /* ---------- top bar ---------- */
  #topbar{
    height:52px; flex:0 0 52px; display:flex; align-items:center; gap:12px;
    padding:0 14px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; user-select:none; }
  .brand-mark{
    width:18px; height:18px; border-radius:5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 14px rgba(124,92,255,.45);
  }
  .brand h1{
    margin:0; font-size:15px; letter-spacing:.4px; font-weight:700;
    background:linear-gradient(90deg,#c9b8ff,#7c5cff 40%,#22d3ee);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .preset-chip{
    display:flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px;
    background:var(--bg2); border:1px solid var(--border); font-size:12.5px; color:var(--dim);
    max-width:260px; white-space:nowrap; overflow:hidden;
  }
  .preset-chip #chip-name{ color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .dirty-dot{ width:7px; height:7px; border-radius:50%; background:var(--warn); flex:0 0 auto; }
  .spacer{ flex:1; }
  .pill{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim);
    background:var(--bg2); border:1px solid var(--border); border-radius:999px; padding:5px 11px;
    white-space:nowrap;
  }
  .pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--faint); }
  .pill.ok .dot{ background:var(--ok); box-shadow:0 0 8px rgba(61,220,132,.6); }
  .pill.err .dot{ background:var(--err); box-shadow:0 0 8px rgba(255,84,112,.6); }

  /* ---------- buttons & inputs ---------- */
  .btn{
    background:var(--panel2); border:1px solid var(--border2); color:var(--text);
    border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer; line-height:1.2;
  }
  .btn:hover{ background:#1d2740; border-color:#3a4767; }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none;
    color:#0a0d13; font-weight:700;
  }
  .btn.primary:hover{ filter:brightness(1.12); }
  .btn.ghost{ background:transparent; border-color:var(--border); }
  select.btn{ padding:6px 8px; }
  input[type="range"]{ accent-color:var(--accent); }
  .check{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--dim); cursor:pointer; user-select:none; }
  .check input{ accent-color:var(--accent); }

  /* ---------- main layout ---------- */
  #main{ flex:1; display:flex; min-height:0; position:relative; }

  #sidebar{
    flex:0 0 262px; min-width:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  body.side-off #sidebar{ display:none; }
  .side-section{ padding:12px 12px 6px; display:flex; flex-direction:column; min-height:0; }
  .side-section.grow{ flex:1; overflow:hidden; }
  .side-section h2{
    margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--faint); font-weight:700;
  }
  .side-section h2 .hint{ font-weight:400; text-transform:none; letter-spacing:0; color:var(--faint); }
  #preset-list{ overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding-right:2px; }
  .preset-item{
    text-align:left; background:transparent; border:1px solid transparent; border-left:3px solid transparent;
    border-radius:7px; padding:7px 9px; cursor:pointer; color:var(--text);
    display:flex; flex-direction:column; gap:2px;
  }
  .preset-item:hover{ background:var(--panel2); }
  .preset-item.active{ background:var(--panel2); border-left-color:var(--accent); }
  .p-name{ font-size:12.5px; font-weight:600; }
  .p-desc{ font-size:11px; color:var(--faint); line-height:1.35; }
  #uniform-panel-wrap{ overflow-y:auto; flex:1; padding-right:2px; }
  #uniform-panel{ display:flex; flex-direction:column; gap:10px; }
  #uniform-panel .empty{ font-size:11.5px; color:var(--faint); line-height:1.5; margin:0; }
  #uniform-panel code{ color:#9aa7c4; background:var(--bg2); padding:1px 4px; border-radius:4px; }
  .u-sub{ margin-bottom:2px; }
  .u-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .u-name{ font-family:var(--mono); font-size:11.5px; color:#9aa7c4; cursor:default; }
  .u-val{ font-family:var(--mono); font-size:11px; color:var(--accent2); }
  .u-sub input[type="range"]{ width:100%; margin:0; }

  /* ---------- editor pane ---------- */
  #editor-pane{
    flex:0 0 42%; min-width:280px; display:flex; flex-direction:column;
    background:var(--bg2); border-right:1px solid var(--border); overflow:hidden;
  }
  .toolbar{
    flex:0 0 42px; display:flex; align-items:center; gap:8px; padding:0 10px;
    background:var(--panel); border-bottom:1px solid var(--border);
  }
  .kbd-hint{ font-size:11px; color:var(--faint); font-family:var(--mono); }
  .speed{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--dim); white-space:nowrap; }
  .speed input{ width:86px; }
  .speed span{ font-family:var(--mono); font-size:11px; color:var(--accent2); min-width:44px; }

  #code-wrap{ flex:1; display:flex; min-height:0; position:relative; background:#0c0f16; }
  #gutter-wrap{
    flex:0 0 52px; overflow:hidden; border-right:1px solid #161c2a;
    background:#0c0f16; user-select:none;
  }
  #gutter{ padding:12px 0; will-change:transform; }
  .ln{
    font-family:var(--mono); font-size:13px; line-height:20px; height:20px;
    color:#39445e; text-align:right; padding-right:10px;
  }
  #code-area{ flex:1; position:relative; min-width:0; }
  .code-metrics{
    font-family:var(--mono); font-size:13px; line-height:20px;
    tab-size:2; margin:0; border:0; padding:12px 14px; white-space:pre;
  }
  #highlight{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; color:#c9d3ea;
  }
  #highlight code{ display:block; padding:0; margin:0; }
  #editor{
    position:absolute; inset:0; overflow:auto; resize:none; outline:none; z-index:2;
    background:transparent; color:transparent; -webkit-text-fill-color:transparent;
    caret-color:#8f7bff;
  }
  #editor::selection{ background:rgba(124,92,255,.30); color:transparent; }
  .c{ color:#57657f; font-style:italic; }        /* comments   */
  .p{ color:#ff7ba9; }                          /* preprocessor */
  .n{ color:#f5a97f; }                          /* numbers    */
  .k{ color:#b48cff; }                          /* keywords   */
  .t{ color:#4fd6be; }                          /* types      */
  .b{ color:#5ec8ff; }                          /* builtins   */

  /* ---------- problems ---------- */
  #problems{
    flex:0 0 auto; max-height:150px; overflow-y:auto; background:#170f16;
    border-top:1px solid #3a1f2b;
  }
  .problems-head{
    position:sticky; top:0; display:flex; justify-content:space-between; align-items:center;
    padding:5px 10px; background:#170f16; border-bottom:1px solid #3a1f2b;
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--err); font-weight:700;
  }
  .problems-head button{
    background:none; border:none; color:var(--dim); font-size:15px; cursor:pointer; line-height:1; padding:0 4px;
  }
  .problem{
    display:flex; gap:10px; width:100%; text-align:left; background:none; border:none;
    border-bottom:1px solid rgba(255,84,112,.12); padding:5px 10px; cursor:pointer; color:var(--text);
    font-family:var(--mono); font-size:12px; align-items:baseline;
  }
  .problem:hover{ background:rgba(255,84,112,.08); }
  .problem .pl{ color:var(--err); min-width:52px; flex:0 0 auto; }

  /* ---------- splitter ---------- */
  #splitter{
    flex:0 0 6px; cursor:col-resize; background:var(--border);
    transition:background .15s;
  }
  #splitter:hover, body.dragging #splitter{ background:var(--accent); }

  /* ---------- preview pane ---------- */
  #preview-pane{ flex:1; min-width:220px; display:flex; flex-direction:column; overflow:hidden; }
  #canvas-host{ flex:1; position:relative; background:#04060a; min-height:0; overflow:hidden; }
  #canvas-host:fullscreen{ background:#04060a; }
  #gl{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud{
    position:absolute; left:10px; bottom:10px; display:flex; gap:12px; align-items:center;
    font-family:var(--mono); font-size:11px; color:#93a0bd;
    background:rgba(9,12,19,.62); border:1px solid rgba(60,72,102,.5); border-radius:7px;
    padding:5px 10px; pointer-events:none; backdrop-filter:blur(3px);
  }
  #hud-paused{ color:var(--warn); font-weight:700; letter-spacing:1px; }
  #gl-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(6,8,13,.82); z-index:5; padding:20px; text-align:center;
  }
  #gl-overlay-text{ color:var(--warn); font-size:14px; line-height:1.6; max-width:420px; }

  /* ---------- status bar ---------- */
  #statusbar{
    height:28px; flex:0 0 28px; display:flex; align-items:center; gap:16px; padding:0 12px;
    background:var(--panel); border-top:1px solid var(--border);
    font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden;
  }
  #foot-status{ overflow:hidden; text-overflow:ellipsis; }
  #foot-status.err{ color:var(--err); }

  /* ---------- modal ---------- */
  #modal-backdrop{
    position:fixed; inset:0; background:rgba(4,6,10,.72); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  #modal{
    background:var(--panel); border:1px solid var(--border2); border-radius:14px;
    max-width:640px; width:100%; max-height:82vh; overflow-y:auto; padding:22px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  #modal h2{ margin:0 0 6px; font-size:17px; }
  #modal h3{ margin:18px 0 6px; font-size:12.5px; color:var(--accent2); text-transform:uppercase; letter-spacing:1px; }
  #modal p{ margin:6px 0; color:var(--dim); line-height:1.55; font-size:13px; }
  #modal code, #modal td:first-child{
    font-family:var(--mono); font-size:12px; color:#9aa7c4; background:var(--bg2);
    padding:1px 5px; border-radius:4px;
  }
  #modal table{ border-collapse:collapse; width:100%; margin:8px 0; }
  #modal td{ padding:5px 8px 5px 0; vertical-align:top; font-size:12.5px; color:var(--dim); line-height:1.5; }
  #modal td:first-child{ white-space:nowrap; }
  .modal-close{
    float:right; background:none; border:1px solid var(--border2); color:var(--dim);
    border-radius:7px; width:28px; height:28px; font-size:14px; cursor:pointer;
  }
  .modal-close:hover{ color:var(--text); border-color:var(--accent); }
  #share-url{ width:100%; font-family:var(--mono); font-size:11.5px; padding:8px 10px; color:var(--text);
    background:var(--bg2); border:1px solid var(--border2); border-radius:8px; margin-top:10px; }

  /* ---------- toasts ---------- */
  #toasts{ position:fixed; right:16px; bottom:40px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{
    background:var(--panel2); border:1px solid var(--border2); border-left:3px solid var(--ok);
    color:var(--text); border-radius:8px; padding:9px 14px; font-size:12.5px;
    opacity:0; transform:translateY(8px); transition:all .25s ease; max-width:320px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{ opacity:1; transform:none; }
  .toast.err{ border-left-color:var(--err); }

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#232c42; border-radius:6px; border:2px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:#33405f; background-clip:content-box; border:2px solid transparent; }
  #editor{ scrollbar-width:thin; scrollbar-color:#232c42 transparent; }

  /* ---------- narrow screens ---------- */
  @media (max-width: 900px){
    #main{ flex-direction:column; }
    #sidebar{
      position:fixed; z-index:50; top:52px; bottom:28px; left:0; width:262px; flex:none;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:10px 0 30px rgba(0,0,0,.5);
      display:flex;
    }
    body:not(.side-off) #sidebar{ transform:none; }
    #splitter{ display:none; }
    #editor-pane{ flex:0 0 46% !important; min-width:0; }
    #preview-pane{ min-width:0; }
  }
</style>
</head>
<body>

<header id="topbar">
  <button class="btn ghost" id="btn-sidebar" title="Toggle examples sidebar">Examples</button>
  <div class="brand"><span class="brand-mark"></span><h1>Shader Playground</h1></div>
  <div class="preset-chip" id="preset-chip" title="Current example">
    <span id="chip-name">—</span>
    <span id="chip-dirty" class="dirty-dot" hidden title="Modified"></span>
  </div>
  <span class="spacer"></span>
  <div class="pill" id="status-pill"><span class="dot"></span><span id="status-text">booting…</span></div>
  <button class="btn" id="btn-help">Help</button>
</header>

<main id="main">

  <aside id="sidebar">
    <div class="side-section">
      <h2>Examples</h2>
      <div id="preset-list"></div>
    </div>
    <div class="side-section grow">
      <h2>Uniforms <span class="hint">· auto-detected</span></h2>
      <div id="uniform-panel-wrap">
        <div id="uniform-panel"></div>
      </div>
    </div>
  </aside>

  <section id="editor-pane">
    <div class="toolbar">
      <button class="btn primary" id="btn-run" title="Compile the shader (Ctrl+Enter)">Compile&nbsp;&amp;&nbsp;Run</button>
      <button class="btn" id="btn-revert" title="Revert to the selected example">Revert</button>
      <label class="check" title="Recompile automatically while typing"><input type="checkbox" id="chk-auto" checked> Auto</label>
      <span class="spacer"></span>
      <span class="kbd-hint">Ctrl+Enter</span>
    </div>
    <div id="code-wrap">
      <div id="gutter-wrap"><div id="gutter"></div></div>
      <div id="code-area">
        <pre id="highlight" class="code-metrics" aria-hidden="true"><code id="highlight-code" class="code-metrics"></code></pre>
        <textarea id="editor" class="code-metrics" spellcheck="false" wrap="off"
          autocapitalize="off" autocomplete="off" autocorrect="off"
          aria-label="Fragment shader source (GLSL)"></textarea>
      </div>
    </div>
    <div id="problems" hidden>
      <div class="problems-head">
        <span id="problems-title">Problems</span>
        <button id="problems-close" title="Hide problems">×</button>
      </div>
      <div id="problems-list"></div>
    </div>
  </section>

  <div id="splitter" title="Drag to resize"></div>

  <section id="preview-pane">
    <div class="toolbar">
      <button class="btn" id="btn-pause" title="Freeze u_time">Pause</button>
      <button class="btn" id="btn-reset" title="Reset u_time and u_frame to zero">Reset</button>
      <label class="speed" title="Time multiplier">Speed
        <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
        <span id="speed-val">1.00×</span>
      </label>
      <span class="spacer"></span>
      <select id="res-scale" class="btn" title="Render resolution scale">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button class="btn" id="btn-shot" title="Download the canvas as PNG">PNG</button>
      <button class="btn" id="btn-share" title="Copy a link that embeds this shader">Share</button>
      <button class="btn" id="btn-full" title="Fullscreen preview">Full</button>
    </div>
    <div id="canvas-host">
      <canvas id="gl"></canvas>
      <div id="hud">
        <span id="hud-fps">— fps</span>
        <span id="hud-res"></span>
        <span id="hud-time"></span>
        <span id="hud-paused" hidden>PAUSED</span>
      </div>
      <div id="gl-overlay" hidden><div id="gl-overlay-text"></div></div>
    </div>
  </section>

</main>

<footer id="statusbar">
  <span id="foot-status">Starting…</span>
  <span class="spacer"></span>
  <span id="foot-cursor">Ln 1, Col 1</span>
  <span id="foot-gl">—</span>
</footer>

<div id="modal-backdrop" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Element handles
===================================================================== */
var $ = function(id){ return document.getElementById(id); };
var editor        = $('editor');
var highlightPre  = $('highlight');
var highlightCode = $('highlight-code');
var gutter        = $('gutter');
var canvas        = $('gl');
var canvasHost    = $('canvas-host');
var presetList    = $('preset-list');
var uniformPanel  = $('uniform-panel');
var problemsBox   = $('problems');
var problemsList  = $('problems-list');
var pill          = $('status-pill');
var pillText      = $('status-text');
var footStatus    = $('foot-status');
var footCursor    = $('foot-cursor');
var footGL        = $('foot-gl');
var chipName      = $('chip-name');
var chipDirty     = $('chip-dirty');
var speedInput    = $('speed');
var speedVal      = $('speed-val');
var resScale      = $('res-scale');
var chkAuto       = $('chk-auto');
var hudFps        = $('hud-fps');
var hudRes        = $('hud-res');
var hudTime       = $('hud-time');
var hudPaused     = $('hud-paused');
var overlay       = $('gl-overlay');
var overlayText   = $('gl-overlay-text');
var backdrop      = $('modal-backdrop');
var modal         = $('modal');
var toasts        = $('toasts');
var sidebar       = $('sidebar');
var main          = $('main');
var editorPane    = $('editor-pane');
var splitter      = $('splitter');
var btnPause      = $('btn-pause');

var LH = 20;            /* editor line height, must match .code-metrics */
var BUILTIN_U = { u_time:1, u_resolution:1, u_mouse:1, u_frame:1 };

var store = {
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set: function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

var state = {
  isGL2: false, program: null, vertShader: null, buf: null,
  loc: { time:null, res:null, mouse:null, frame:null },
  time: 0, frame: 0, speed: 1, playing: true, scale: 1,
  mouse: [0.5, 0.5], fps: 60
};
var gl = null;
var presetIdx = 0;
var gutterLines = 0;
var splitFrac = 0.42;      /* editor pane as a fraction of editor+preview space */
var customUniforms = {};   /* name -> { type, v:[..], loc } */

/* =====================================================================
   GLSL environment
===================================================================== */
var VERT2 = '#version 300 es\n' +
'precision highp float;\n' +
'in vec2 a_pos;\n' +
'void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }';

var VERT1 =
'attribute vec2 a_pos;\n' +
'void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }';

/* Ten lines each, so error line offsets stay simple. */
var PRELUDE2 =
'#version 300 es\n' +
'precision highp float;\n' +
'\n' +
'uniform vec2  u_resolution;\n' +
'uniform float u_time;\n' +
'uniform vec2  u_mouse;\n' +
'uniform float u_frame;\n' +
'\n' +
'out vec4 fragColor;\n' +
'/* ---- your shader below ---- */';

var PRELUDE1 =
'precision highp float;\n' +
'\n' +
'uniform vec2  u_resolution;\n' +
'uniform float u_time;\n' +
'uniform vec2  u_mouse;\n' +
'uniform float u_frame;\n' +
'\n' +
'#define fragColor gl_FragColor\n' +
'/* ---- your shader below ---- */';

/* =====================================================================
   Example shaders
===================================================================== */
var PRESETS = [
{
  name: 'Plasma Dream',
  desc: 'Layered sine plasma with a cosine palette.',
  code:
'// Live controls: u_scale and u_tint get sliders in the sidebar.\n' +
'uniform float u_scale;   // pattern density\n' +
'uniform vec3  u_tint;    // palette shift\n' +
'\n' +
'vec3 palette(float t){\n' +

/* =====================================================================
   Syntax highlighting
===================================================================== */
var KWS = toSet('uniform varying attribute precision highp mediump lowp const ' +
  'if else for while do return break continue discard in out inout struct ' +
  'switch case default true false void');
var TYPES = toSet('float int bool vec2 vec3 vec4 ivec2 ivec3 ivec4 bvec2 bvec3 bvec4 ' +
  'mat2 mat3 mat4 sampler1D sampler2D sampler3D samplerCube');
var BUILTINS = toSet('gl_FragColor gl_FragCoord gl_FragDepth gl_Position gl_PointSize ' +
  'gl_FrontFacing sin cos tan asin acos atan radians degrees pow exp log exp2 log2 sqrt ' +
  'inversesqrt abs sign floor ceil fract mod min max clamp mix step smoothstep length ' +
  'distance dot cross normalize faceforward reflect refract matrixCompMult texture2D ' +
  'textureCube texture dFdx dFdy fwidth any all not equal notEqual lessThan lessThanEqual ' +
  'greaterThan greaterThanEqual');

function toSet(s){ var o = {}; s.split(/\s+/).forEach(function(w){ o[w] = 1; }); return o; }

function esc(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var TOK = new RegExp(
  '(\\/\\/[^\\n]*)' +                 /* 1 line comment   */
  '|(\\/\\*[\\s\\S]*?\\*\\/)' +       /* 2 block comment  */
  '|(^[ \\t]*#[^\\n]*)' +             /* 3 preprocessor   */
  '|(0[xX][0-9a-fA-F]+|(?:\\b\\d+\\.\\d*|\\B\\.\\d+|\\b\\d+)(?:[eE][+-]?\\d+)?[fF]?)' + /* 4 number */
  '|([A-Za-z_][A-Za-z0-9_]*)',        /* 5 identifier     */
  'gm');

function highlightGLSL(src){
  var out = '', last = 0, m;
  TOK.lastIndex = 0;
  while((m = TOK.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    var s = esc(m[0]);
    if(m[1] || m[2])      out += '<span class="c">' + s + '</span>';
    else if(m[3])         out += '<span class="p">' + s + '</span>';
    else if(m[4])         out += '<span class="n">' + s + '</span>';
    else{
      var w = m[0];
      if(KWS[w])          out += '<span class="k">' + s + '</span>';
      else if(TYPES[w])   out += '<span class="t">' + s + '</span>';
      else if(BUILTINS[w])out += '<span class="b">' + s + '</span>';
      else                out += s;
    }
    last = TOK.lastIndex;
  }
  out += esc(src.slice(last));
  return out;
}

/* =====================================================================
   Toasts / modal / overlay
===================================================================== */
function toast(msg, kind){
  var d = document.createElement('div');
  d.className = 'toast' + (kind === 'err' ? ' err' : '');
  d.textContent = msg;
  toasts.appendChild(d);
  requestAnimationFrame(function(){ d.classList.add('show'); });
  setTimeout(function(){
    d.classList.remove('show');
    setTimeout(function(){ d.remove(); }, 300);
  }, 2400);
}

function openModal(html){
  modal.innerHTML = html;
  backdrop.hidden = false;
}
function closeModal(){ backdrop.hidden = true; }
backdrop.addEventListener('click', function(e){ if(e.target === backdrop) closeModal(); });

function showOverlay(text){ overlayText.textContent = text; overlay.hidden = false; }
function hideOverlay(){ overlay.hidden = true; }

/* =====================================================================
   WebGL setup
===================================================================== */
function initGL(){
  var opts = { antialias:false, depth:false, stencil:false, alpha:false,
               preserveDrawingBuffer:true, powerPreference:'high-performance' };
  gl = canvas.getContext('webgl2', opts);
  state.isGL2 = !!gl;
  if(!gl){
    gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
  }
  if(!gl){
    showOverlay('WebGL is not available in this browser. Try another browser or enable hardware acceleration.');
    footGL.textContent = 'no WebGL';
    return false;
  }
  var vsSrc = state.isGL2 ? VERT2 : VERT1;
  var vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, vsSrc);
  gl.compileShader(vs);
  if(!gl.getShaderParameter(vs, gl.COMPILE_STATUS)){
    showOverlay('Internal error: vertex shader failed to compile.');
    return false;
  }
  state.vertShader = vs;
  state.buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, state.buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  footGL.textContent = state.isGL2 ? 'WebGL 2.0 · GLSL ES 3.00' : 'WebGL 1.0 · GLSL ES 1.00';
  return true;
}

function parseLog(log, offset){
  var out = [];
  log.split('\n').forEach(function(l){
    var m = l.match(/ERROR:\s*\d+:(\d+):\s*(.*)/);
    if(m){
      var ln = parseInt(m[1], 10) - offset;
      out.push({ line: Math.max(1, ln), msg: m[2] });
    }else if(l.trim() && !/^WARNING/i.test(l)){
      out.push({ line: null, msg: l.trim() });
    }
  });
  return out;
}

function detectUniforms(src){
  var found = [], seen = {};
  var re = /^[ \t]*uniform[ \t]+(float|vec3)[ \t]+(u_[A-Za-z_][A-Za-z0-9_]*)[ \t]*;/gm;
  var m;
  while((m = re.exec(src)) !== null){
    var name = m[2];
    if(BUILTIN_U[name] || seen[name]) continue;
    seen[name] = 1;
    found.push({ name: name, type: m[1] });
  }
  return found;
}

function compile(src){
  if(!gl) return false;
  var prelude = state.isGL2 ? PRELUDE2 : PRELUDE1;
  var offset = prelude.split('\n').length;   /* user line 1 == offset + 1 */
  var full = prelude + '\n' + src + '\n';
  var t0 = performance.now();

  var fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, full);
  gl.compileShader(fs);
  if(!gl.getShaderParameter(fs, gl.COMPILE_STATUS)){
    var errs = parseLog(gl.getShaderInfoLog(fs) || 'Unknown compile error.', offset);
    gl.deleteShader(fs);
    setStatus(errs);
    return false;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, state.vertShader);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.deleteShader(fs);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    errs = parseLog(gl.getProgramInfoLog(prog) || 'Program link failed.', offset);
    gl.deleteProgram(prog);
    setStatus(errs);
    return false;
  }

  if(state.program) gl.deleteProgram(state.program);
  state.program = prog;

  gl.useProgram(prog);
  var aloc = gl.getAttribLocation(prog, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, state.buf);
  gl.enableVertexAttribArray(aloc);
  gl.vertexAttribPointer(aloc, 2, gl.FLOAT, false, 0, 0);

  state.loc.res   = gl.getUniformLocation(prog, 'u_resolution');
  state.loc.time  = gl.getUniformLocation(prog, 'u_time');
  state.loc.mouse = gl.getUniformLocation(prog, 'u_mouse');
  state.loc.frame = gl.getUniformLocation(prog, 'u_frame');

  rebuildUniformPanel(detectUniforms(src));
  applyAllCustomUniforms();

  var ms = (performance.now() - t0).toFixed(1);
  setStatus([{ ok: true, ms: ms }]);
  return true;
}

function setStatus(errs){
  if(errs.length && errs[0].ok){
    pill.className = 'pill ok';
    pillText.textContent = 'compiled';
    problemsBox.hidden = true;
    footStatus.className = '';
    footStatus.textContent = 'Shader compiled successfully in ' + errs[0].ms + ' ms.';
    return;
  }
  if(errs.length === 0) errs = [{ line: null, msg: 'Unknown error.' }];
  pill.className = 'pill err';
  pillText.textContent = errs.length + ' error' + (errs.length > 1 ? 's' : '');
  problemsList.innerHTML = '';
  errs.forEach(function(e){
    var b = document.createElement('button');
    b.className = 'problem';
    var pl = document.createElement('span');
    pl.className = 'pl';
    pl.textContent = e.line ? 'line ' + e.line : '—';
    var tx = document.createElement('span');
    tx.textContent = e.msg;
    b.appendChild(pl);
    b.appendChild(tx);
    if(e.line) b.addEventListener('click', function(){ jumpToLine(e.line); });
    problemsList.appendChild(b);
  });
  problemsBox.hidden = false;
  footStatus.className = 'err';
  footStatus.textContent = 'line ' + (errs[0].line || '?') + ': ' + errs[0].msg;
}

/* =====================================================================
   Custom uniform panel
===================================================================== */
function rebuildUniformPanel(decls){
  var keep = customUniforms;
  customUniforms = {};
  uniformPanel.innerHTML = '';
  if(decls.length === 0){
    var p = document.createElement('p');
    p.className = 'empty';
    p.innerHTML = 'Declare <code>uniform float u_x;</code> or <code>uniform vec3 u_x;</code> ' +
                  'in your shader and matching sliders appear here.';
    uniformPanel.appendChild(p);
    return;
  }
  decls.forEach(function(d){
    var prev = keep[d.name];
    var v = prev ? prev.v.slice() : (d.type === 'vec3' ? [0.5, 0.5, 0.5] : [0.5]);
    customUniforms[d.name] = { type: d.type, v: v, loc: null };
    var row = document.createElement('div');
    row.className = 'u-row';
    var comps = d.type === 'vec3' ? [0, 1, 2] : [0];
    comps.forEach(function(ci){
      var label = d.type === 'vec3' ? d.name + '.' + 'xyz'[ci] : d.name;
      var sub = document.createElement('div');
      sub.className = 'u-sub';
      var head = document.createElement('div');
      head.className = 'u-head';
      var nm = document.createElement('span');
      nm.className = 'u-name';
      nm.textContent = label;
      nm.title = 'Double-click to reset';
      var val = document.createElement('span');
      val.className = 'u-val';
      val.textContent = v[ci].toFixed(3);
      head.appendChild(nm);
      head.appendChild(val);
      var rng = document.createElement('input');
      rng.type = 'range';
      rng.min = '0'; rng.max = '1'; rng.step = '0.001';
      rng.value = String(v[ci]);
      rng.addEventListener('input', function(){
        v[ci] = parseFloat(rng.value);
        val.textContent = v[ci].toFixed(3);
        pushUniform(d.name);
      });
      nm.addEventListener('dblclick', function(){
        v[ci] = 0.5;
        rng.value = '0.5';
        val.textContent = '0.500';
        pushUniform(d.name);
      });
      sub.appendChild(head);
      sub.appendChild(rng);
      row.appendChild(sub);
    });
    uniformPanel.appendChild(row);
  });
}

function pushUniform(name){
  if(!gl || !state.program) return;
  var u = customUniforms[name];
  if(!u) return;
  gl.useProgram(state.program);
  if(u.loc === null) u.loc = gl.getUniformLocation(state.program, name);
  if(u.type === 'vec3') gl.uniform3f(u.loc, u.v[0], u.v[1], u.v[2]);
  else                  gl.uniform1f(u.loc, u.v[0]);
}

function applyAllCustomUniforms(){
  for(var name in customUniforms){ customUniforms[name].loc = null; pushUniform(name); }
}

/* =====================================================================
   Editor
===================================================================== */
function refreshEditor(){
  var code = editor.value;
  highlightCode.innerHTML = highlightGLSL(code) + '\n';
  var lines = code.split('\n').length;
  if(lines !== gutterLines){
    var html = '';
    for(var i = 1; i <= lines; i++) html += '<div class="ln">' + i + '</div>';
    gutter.innerHTML = html;
    gutterLines = lines;
  }
  syncScroll();
  updateCursor();
  updateDirty();
}

function syncScroll(){
  highlightPre.scrollTop = editor.scrollTop;
  highlightPre.scrollLeft = editor.scrollLeft;
  gutter.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
}

function updateCursor(){
  var pos = editor.selectionStart;
  var before = editor.value.slice(0, pos);
  var line = before.split('\n').length;
  var lastNl = before.lastIndexOf('\n');
  var col = pos - lastNl;
  footCursor.textContent = 'Ln ' + line + ', Col ' + col;
}

function updateDirty(){
  var dirty = editor.value !== PRESETS[presetIdx].code;
  chipDirty.hidden = !dirty;
}

function lineStartIndex(code, line){
  var idx = 0, i;
  var lines = code.split('\n');
  for(i = 0; i < line - 1 && i < lines.length; i++) idx += lines[i].length + 1;
  return idx;
}

function jumpToLine(line){
  var code = editor.value;
  var start = lineStartIndex(code, line);
  var nl = code.indexOf('\n', start);
  var end = nl === -1 ? code.length : nl;
  editor.focus();
  editor.setSelectionRange(start, end);
  editor.scrollTop = Math.max(0, (line - 3) * LH);
  syncScroll();
  updateCursor();
}

var compileTimer = null;
function scheduleCompile(){
  if(!chkAuto.checked) return;
  clearTimeout(compileTimer);
  compileTimer = setTimeout(compileNow, 500);
}
function compileNow(){ compile(editor.value); persistSoon(); }

var saveTimer = null;
function persistSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 700);
}
function persist(){
  store.set('sp.code', editor.value);
  store.set('sp.preset', String(presetIdx));
  store.set('sp.settings', JSON.stringify({
    speed: state.speed, scale: state.scale,
    auto: chkAuto.checked, split: splitFrac
  }));
}
window.addEventListener('beforeunload', function(){
  clearTimeout(saveTimer);
  persist();
});

editor.addEventListener('input', function(){ refreshEditor(); scheduleCompile(); persistSoon(); });
editor.addEventListener('scroll', syncScroll);
['click', 'keyup'].forEach(function(ev){
  editor.addEventListener(ev, updateCursor);
});
editor.addEventListener('keydown', function(e){
  if(e.key === 'Tab'){
    e.preventDefault();
    editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end');
    refreshEditor();
    scheduleCompile();
  }else if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    compileNow();
  }
});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    compileNow();
  }
  if(e.key === 'Escape' && !backdrop.hidden) closeModal();
});

/* =====================================================================
   Presets
===================================================================== */
function buildPresetList(){
  PRESETS.forEach(function(p, i){
    var b = document.createElement('button');
    b.className = 'preset-item';
    var nm = document.createElement('span');
    nm.className = 'p-name';
    nm.textContent = p.name;
    var ds = document.createElement('span');
    ds.className = 'p-desc';
    ds.textContent = p.desc;
    b.appendChild(nm);
    b.appendChild(ds);
    b.addEventListener('click', function(){ loadPreset(i); });
    presetList.appendChild(b);
  });
}

function loadPreset(i, keepValues){
  presetIdx = i;
  customUniforms = {};                       /* fresh slider defaults */
  editor.value = PRESETS[i].code;
  Array.prototype.forEach.call(presetList.children, function(el, j){
    el.classList.toggle('active', j === i);
  });
  chipName.textContent = PRESETS[i].name;
  refreshEditor();
  compileNow();
  if(!keepValues) toast('Loaded "' + PRESETS[i].name + '"');
}

/* =====================================================================
   Canvas / render loop
===================================================================== */
function resize(){
  var w = canvas.clientWidth, h = canvas.clientHeight;
  if(w < 2 || h < 2) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2) * state.scale;
  var W = Math.max(2, Math.round(w * dpr));
  var H = Math.max(2, Math.round(h * dpr));
  if(canvas.width !== W || canvas.height !== H){
    canvas.width = W;
    canvas.height = H;
  }
}

var lastNow = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;
  if(dt > 0) state.fps = state.fps * 0.9 + (1 / dt) * 0.1;
  if(state.playing) state.time += dt * state.speed;
  state.frame++;
  if(!gl || !state.program) return;
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(state.program);
  if(state.loc.res)   gl.uniform2f(state.loc.res, canvas.width, canvas.height);
  if(state.loc.time)  gl.uniform1f(state.loc.time, state.time);
  if(state.loc.mouse) gl.uniform2f(state.loc.mouse, state.mouse[0], state.mouse[1]);
  if(state.loc.frame) gl.uniform1f(state.loc.frame, state.frame);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

setInterval(function(){
  hudFps.textContent = Math.round(state.fps) + ' fps';
  hudRes.textContent = canvas.width + '\u00d7' + canvas.height;
  hudTime.textContent = 't=' + state.time.toFixed(2) + 's';
}, 250);

canvasHost.addEventListener('pointermove', function(e){
  var r = canvas.getBoundingClientRect();
  if(r.width < 1 || r.height < 1) return;
  state.mouse[0] = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  state.mouse[1] = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
});
canvasHost.addEventListener('pointerleave', function(){
  state.mouse[0] = 0.5;
  state.mouse[1] = 0.5;
});

canvas.addEventListener('webglcontextlost', function(e){
  e.preventDefault();
  state.program = null;
  showOverlay('WebGL context lost. It will try to restore itself automatically.');
});
canvas.addEventListener('webglcontextrestored', function(){
  hideOverlay();
  if(initGL()) compileNow();
});

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(canvasHost);
}else{
  window.addEventListener('resize', resize);
}

/* =====================================================================
   Toolbar wiring
===================================================================== */
$('btn-run').addEventListener('click', compileNow);
$('btn-revert').addEventListener('click', function(){ loadPreset(presetIdx, true); toast('Reverted to "' + PRESETS[presetIdx].name + '"'); });

btnPause.addEventListener('click', function(){
  state.playing = !state.playing;
  btnPause.textContent = state.playing ? 'Pause' : 'Resume';
  hudPaused.hidden = state.playing;
});
$('btn-reset').addEventListener('click', function(){
  state.time = 0;
  state.frame = 0;
  toast('Time reset');
});

speedInput.addEventListener('input', function(){
  state.speed = parseFloat(speedInput.value);
  speedVal.textContent = state.speed.toFixed(2) + '\u00d7';
  persistSoon();
});
resScale.addEventListener('change', function(){
  state.scale = parseFloat(resScale.value);
  resize();
  persistSoon();
});
chkAuto.addEventListener('change', function(){
  if(chkAuto.checked) scheduleCompile();
  persistSoon();
});

$('btn-shot').addEventListener('click', function(){
  if(!gl){ toast('No WebGL context', 'err'); return; }
  canvas.toBlob(function(b){
    if(!b){ toast('Capture failed', 'err'); return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'shader-' + Date.now() + '.png';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('PNG saved');
  });
});

function encodeCode(src){
  var bytes = new TextEncoder().encode(src);
  var s = '';
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeCode(e){
  e = e.replace(/-/g, '+').replace(/_/g, '/');
  while(e.length % 4) e += '=';
  var s = atob(e);
  var bytes = new Uint8Array(s.length);
  for(var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

$('btn-share').addEventListener('click', function(){
  var url = location.href.split('#')[0] + '#code=' + encodeCode(editor.value);
  var fallback = function(){
    openModal('<button class="modal-close" id="m-close">\u00d7</button>' +
      '<h2>Share this shader</h2>' +
      '<p>The link below encodes the current shader. Copy it from the box:</p>' +
      '<input id="share-url" readonly value="' + url.replace(/"/g, '&quot;') + '">' +
      '<p style="margin-top:12px"><button class="btn primary" id="m-copy">Copy</button></p>');
    $('m-close').addEventListener('click', closeModal);
    var inp = $('share-url');
    inp.focus();
    inp.select();
    $('m-copy').addEventListener('click', function(){
      inp.select();
      try{
        document.execCommand('copy');
        toast('Link copied');
        closeModal();
      }catch(err){ toast('Press Ctrl+C to copy', 'err'); }
    });
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      function(){ toast('Share link copied to clipboard'); },
      fallback
    );
  }else{
    fallback();
  }
});

$('btn-full').addEventListener('click', function(){
  if(document.fullscreenElement) document.exitFullscreen();
  else canvasHost.requestFullscreen().catch(function(){ toast('Fullscreen was blocked', 'err'); });
});
document.addEventListener('fullscreenchange', function(){
  $('btn-full').textContent = document.fullscreenElement ? 'Exit' : 'Full';
  setTimeout(resize, 60);
});

$('btn-sidebar').addEventListener('click', function(){
  document.body.classList.toggle('side-off');
  setTimeout(resize, 60);
});
$('problems-close').addEventListener('click', function(){ problemsBox.hidden = true; });

$('btn-help').addEventListener('click', function(){
  openModal(
    '<button class="modal-close" id="m-close">\u00d7</button>' +
    '<h2>Shader Playground</h2>' +
    '<p>A zero-dependency WebGL fragment-shader studio in a single HTML file. ' +
    'Edit the GLSL on the left; the canvas recompiles as you type.</p>' +
    '<h3>Built-in uniforms</h3>' +
    '<table>' +
    '<tr><td>u_time</td><td>float — seconds since start, scaled by the Speed slider</td></tr>' +
    '<tr><td>u_resolution</td><td>vec2 — canvas size in pixels</td></tr>' +
    '<tr><td>u_mouse</td><td>vec2 — pointer over the canvas, 0..1, origin bottom-left</td></tr>' +
    '<tr><td>u_frame</td><td>float — frame counter</td></tr>' +
    '</table>' +
    '<h3>Output</h3>' +
    '<p>Write your final color to <code>fragColor</code> (a vec4). A prelude declares the ' +
    'uniforms and the output for you, on WebGL\u00a02 and WebGL\u00a01 alike.</p>' +
    '<h3>Custom controls</h3>' +
    '<p>Declare <code>uniform float u_anything;</code> or <code>uniform vec3 u_color;</code> ' +
    '(the u_ prefix matters) and a live slider appears in the Uniforms panel. ' +
    'Double-click a slider label to reset it.</p>' +
    '<h3>Shortcuts</h3>' +
    '<p><code>Ctrl+Enter</code> compile immediately \u00b7 <code>Tab</code> indent \u00b7 ' +
    'drag the divider to resize \u00b7 click an error to jump to its line</p>' +
    '<h3>Sharing</h3>' +
    '<p>Share packs the whole shader into the URL hash, and your latest edit is kept ' +
    'in local storage, so a refresh never loses work.</p>'
  );
  $('m-close').addEventListener('click', closeModal);
});

/* =====================================================================
   Splitter
===================================================================== */
var dragging = false;
function editorAvailWidth(){
  var sideW = getComputedStyle(sidebar).display === 'none' ? 0 : sidebar.offsetWidth;
  return Math.max(200, main.getBoundingClientRect().width - sideW - 6);
}
function applySplitPx(px){
  var avail = editorAvailWidth();
  px = Math.min(avail - 240, Math.max(280, px));   /* keep both panes usable */
  editorPane.style.flex = '0 0 ' + Math.round(px) + 'px';
  splitFrac = Math.min(0.85, Math.max(0.15, px / avail));
}
splitter.addEventListener('pointerdown', function(e){
  dragging = true;
  splitter.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});
splitter.addEventListener('pointermove', function(e){
  if(!dragging) return;
  if(window.innerWidth <= 900) return;
  var rect = main.getBoundingClientRect();
  var sideW = getComputedStyle(sidebar).display === 'none' ? 0 : sidebar.offsetWidth;
  applySplitPx(e.clientX - rect.left - sideW);
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  document.body.classList.remove('dragging');
  persistSoon();
  resize();
}
splitter.addEventListener('pointerup', endDrag);
splitter.addEventListener('pointercancel', endDrag);

/* =====================================================================
   Boot
===================================================================== */
function boot(){
  buildPresetList();

  /* settings */
  var settings = null;
  try{ settings = JSON.parse(store.get('sp.settings') || 'null'); }catch(e){}
  if(settings){
    if(typeof settings.speed === 'number'){
      state.speed = settings.speed;
      speedInput.value = String(settings.speed);
      speedVal.textContent = settings.speed.toFixed(2) + '\u00d7';
    }
    if(typeof settings.scale === 'number'){
      state.scale = settings.scale;
      resScale.value = String(settings.scale);
    }
    if(typeof settings.auto === 'boolean') chkAuto.checked = settings.auto;
    if(typeof settings.split === 'number'){
      splitFrac = settings.split > 1 ? settings.split / 100 : settings.split;
      splitFrac = Math.min(0.85, Math.max(0.15, splitFrac));
    }
  }
  applySplitPx(splitFrac * editorAvailWidth());
  if(window.innerWidth <= 900) document.body.classList.add('side-off');

  if(!initGL()){
    pill.className = 'pill err';
    pillText.textContent = 'no WebGL';
    footStatus.className = 'err';
    footStatus.textContent = 'WebGL is not available.';
    return;
  }

  /* restore code: shared link > saved work > default preset */
  var code = null;
  if(location.hash.indexOf('#code=') === 0){
    try{ code = decodeCode(location.hash.slice(6)); }catch(e){ code = null; }
    if(code !== null) toast('Loaded shader from share link');
  }
  if(code === null) code = store.get('sp.code');
  var savedIdx = parseInt(store.get('sp.preset'), 10);
  presetIdx = (savedIdx >= 0 && savedIdx < PRESETS.length) ? savedIdx : 0;
  if(code === null) code = PRESETS[presetIdx].code;

  Array.prototype.forEach.call(presetList.children, function(el, j){
    el.classList.toggle('active', j === presetIdx);
  });
  chipName.textContent = PRESETS[presetIdx].name;

  editor.value = code;
  refreshEditor();
  compileNow();

  requestAnimationFrame(loop);
  editor.focus();
}

boot();

})();
