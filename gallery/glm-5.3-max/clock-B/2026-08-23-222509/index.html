<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian — Clock</title>
<meta name="description" content="A quiet, precise clock: sweeping analog dial, tabular digital readout, date and timezone." />
<script>
(function () {
  var t = "dark";
  try {
    var stored = localStorage.getItem("meridian-theme");
    if (stored === "light" || stored === "dark") t = stored;
    else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) t = "light";
  } catch (e) { /* keep dark */ }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root {
    --font: -apple-system, "Segoe UI Variable Display", "Segoe UI", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --bg: #0a0c0f;
    --bg-glow: #12161c;
    --ink: #e9e4d7;
    --ink-dim: rgba(233, 228, 215, 0.62);
    --ink-faint: rgba(233, 228, 215, 0.32);
    --hair: rgba(233, 228, 215, 0.15);
    --accent: #d9a462;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f2efe7;
    --bg-glow: #fbf9f3;
    --ink: #211f1b;
    --ink-dim: rgba(33, 31, 27, 0.64);
    --ink-faint: rgba(33, 31, 27, 0.35);
    --hair: rgba(33, 31, 27, 0.16);
    --accent: #ac6527;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: radial-gradient(130vmax 130vmax at 50% 38%, var(--bg-glow), var(--bg) 62%);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 3.5vmin, 30px);
    padding: clamp(16px, 3vmin, 28px);
  }

  .bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(14px, 2.4vmin, 22px) clamp(18px, 3.2vmin, 28px);
  }
  .wordmark {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-dim);
    user-select: none;
  }

  button { font-family: inherit; }
  .iconbtn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--hair);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .iconbtn:active { transform: scale(0.94); }
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="light"] .icon-sun { display: none; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .dialwrap { width: min(60vmin, 420px); }
  svg.dial { display: block; width: 100%; height: auto; }
  svg text { user-select: none; }

  .ring-track { stroke: var(--hair); }
  .ring-prog { stroke: var(--accent); opacity: 0.85; }
  .tick { stroke: var(--ink-faint); stroke-width: 1.5; }
  .tick.hour { stroke: var(--ink-dim); stroke-width: 3; }
  .tick.cur { stroke: var(--accent); }
  .numeral {
    fill: var(--ink-dim);
    font-family: var(--font);
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.08em;
  }
  .dial-label {
    fill: var(--ink-faint);
    font-family: var(--font);
    font-size: 8.5px;
    letter-spacing: 0.34em;
    text-anchor: middle;
  }
  .hand-h { stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
  .hand-m { stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; }
  .hand-s line { stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; }
  .hand-s circle { fill: var(--accent); }
  .cap { fill: var(--ink); }
  .cap-dot { fill: var(--accent); }

  .readout { text-align: center; user-select: none; }
  .time {
    font-size: clamp(3rem, 10vmin, 5rem);
    font-weight: 200;
    letter-spacing: 0.015em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .time .sec {
    font-size: 0.45em;
    font-weight: 400;
    color: var(--accent);
    margin-left: 0.55em;
  }
  .time .ampm {
    font-size: 0.26em;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: var(--ink-dim);
    margin-left: 1.7em;
  }
  .meta {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.9em;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .meta .dot { color: var(--ink-faint); }
  .chip {
    margin-top: 22px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--hair);
    border-radius: 999px;
    padding: 9px 16px 9px 20px;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-faint); }
  .chip:active { transform: scale(0.96); }

  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .rise-1 { animation-delay: 0.05s; }
    .rise-2 { animation-delay: 0.2s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="bar">
    <span class="wordmark">Meridian</span>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Toggle light and dark theme">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
  </header>

  <div class="dialwrap rise rise-1">
    <svg class="dial" viewBox="0 0 400 400" role="img" aria-label="Analog clock">
      <circle class="ring-track" cx="200" cy="200" r="186" fill="none" stroke-width="2"/>
      <circle class="ring-prog" id="ring" cx="200" cy="200" r="186" fill="none" stroke-width="2"
              stroke-linecap="round" transform="rotate(-90 200 200)"/>
      <g id="ticks"></g>
      <text class="numeral" x="200" y="66" text-anchor="middle" dominant-baseline="central">XII</text>
      <text class="numeral" x="334" y="200" text-anchor="middle" dominant-baseline="central">III</text>
      <text class="numeral" x="200" y="334" text-anchor="middle" dominant-baseline="central">VI</text>
      <text class="numeral" x="66" y="200" text-anchor="middle" dominant-baseline="central">IX</text>
      <text class="dial-label" x="200" y="260">M E R I D I A N</text>
      <line id="handH" class="hand-h" x1="200" y1="212" x2="200" y2="112"/>
      <line id="handM" class="hand-m" x1="200" y1="216" x2="200" y2="70"/>
      <g id="handS" class="hand-s">
        <line x1="200" y1="228" x2="200" y2="62"/>
        <circle cx="200" cy="222" r="4.5"/>
      </g>
      <circle class="cap" cx="200" cy="200" r="5.5"/>
      <circle class="cap-dot" cx="200" cy="200" r="2.2"/>
    </svg>
  </div>

  <section class="readout rise rise-2">
    <div class="time">
      <span id="dH">12</span><span id="colon">:</span><span id="dM">00</span><span class="sec" id="dS">00</span><span class="ampm" id="dAP">AM</span>
    </div>
    <div class="meta">
      <span id="dDate">—</span>
      <span class="dot" aria-hidden="true">·</span>
      <span id="dTz">Local time</span>
    </div>
    <button class="chip" id="fmtBtn" type="button">24-hour</button>
  </section>
</main>

<script>
(function () {
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }

  /* --- Build the tick ring programmatically --- */
  var ticksG = $("ticks");
  var ticks = [];
  for (var i = 0; i < 60; i++) {
    var isHour = i % 5 === 0;
    var a = i * 6 * Math.PI / 180;
    var sin = Math.sin(a), cos = Math.cos(a);
    var r1 = isHour ? 161 : 169, r2 = 178;
    var l = document.createElementNS(SVGNS, "line");
    l.setAttribute("x1", (200 + r1 * sin).toFixed(2));
    l.setAttribute("y1", (200 - r1 * cos).toFixed(2));
    l.setAttribute("x2", (200 + r2 * sin).toFixed(2));
    l.setAttribute("y2", (200 - r2 * cos).toFixed(2));
    l.setAttribute("class", "tick" + (isHour ? " hour" : ""));
    ticksG.appendChild(l);
    ticks.push(l);
  }

  /* --- Seconds progress ring --- */
  var ring = $("ring");
  var handH = $("handH"), handM = $("handM"), handS = $("handS");
  var C = 2 * Math.PI * 186;
  ring.setAttribute("stroke-dasharray", C.toFixed(2));
  ring.setAttribute("stroke-dashoffset", C.toFixed(2));

  /* --- Digital elements --- */
  var dH = $("dH"), dM = $("dM"), dS = $("dS"), dAP = $("dAP");
  var dDate = $("dDate"), dTz = $("dTz"), colon = $("colon"), fmtBtn = $("fmtBtn");

  var reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
  function prefersReduce() { return reduceMQ.matches; }

  /* --- 12 / 24 hour format --- */
  var use24 = false;
  try { use24 = localStorage.getItem("meridian-24h") === "1"; } catch (e) { /* not captured */ }

  var lastSec = -1;
  function setFmt() {
    dAP.style.display = use24 ? "none" : "";
    fmtBtn.textContent = use24 ? "12-hour" : "24-hour";
    lastSec = -1; /* force digital re-render */
    try { localStorage.setItem("meridian-24h", use24 ? "1" : "0"); } catch (e) { /* ignore */ }
  }
  fmtBtn.addEventListener("click", function () { use24 = !use24; setFmt(); });

  /* --- Theme toggle --- */
  var root = document.documentElement;
  $("themeBtn").addEventListener("click", function () {
    var next = root.dataset.theme === "light" ? "dark" : "light";
    root.dataset.theme = next;
    try { localStorage.setItem("meridian-theme", next); } catch (e) { /* ignore */ }
  });

  /* --- Keyboard shortcuts as a quiet nicety --- */
  document.addEventListener("keydown", function (e) {
    if (e.target && /^(BUTTON|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "h" || e.key === "H") { use24 = !use24; setFmt(); }
    if (e.key === "t" || e.key === "T") { $("themeBtn").click(); }
  });

  /* --- Timezone label --- */
  try {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    dTz.textContent = tz ? tz.split("/").pop().replace(/_/g, " ") : "Local time";
  } catch (e) { dTz.textContent = "Local time"; }

  /* --- Render loop --- */
  var lastDate = "", lastMin = -1;
  function pad(n) { return String(n).padStart(2, "0"); }

  function updateDigital(now, sFrac) {
    var sInt = now.getSeconds();
    if (sInt !== lastSec) {
      lastSec = sInt;
      var h = now.getHours();
      dH.textContent = use24 ? pad(h) : String((h % 12) || 12);
      dM.textContent = pad(now.getMinutes());
      dS.textContent = pad(sInt);
      dAP.textContent = h < 12 ? "AM" : "PM";
      var ds = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
      if (ds !== lastDate) { lastDate = ds; dDate.textContent = ds; }
    }
    /* The colon breathes once per second */
    if (!prefersReduce()) {
      colon.style.opacity = (1 - 0.6 * sFrac).toFixed(3);
    } else {
      colon.style.opacity = sInt % 2 ? "0.45" : "1";
    }
  }

  function frame() {
    var now = new Date();
    var ms = now.getMilliseconds();
    var smooth = prefersReduce() ? 0 : ms / 1000;

    var s = now.getSeconds() + smooth;
    var m = now.getMinutes() + s / 60;
    var h = (now.getHours() % 12) + m / 60;

    handS.setAttribute("transform", "rotate(" + (s * 6).toFixed(3) + " 200 200)");
    handM.setAttribute("transform", "rotate(" + (m * 6).toFixed(3) + " 200 200)");
    handH.setAttribute("transform", "rotate(" + (h * 30).toFixed(3) + " 200 200)");
    ring.setAttribute("stroke-dashoffset", (C * (1 - s / 60)).toFixed(2));

    /* Highlight the tick at the current minute */
    var mi = now.getMinutes();
    if (mi !== lastMin) {
      if (lastMin >= 0 && ticks[lastMin]) ticks[lastMin].classList.remove("cur");
      if (ticks[mi]) ticks[mi].classList.add("cur");
      lastMin = mi;
    }

    updateDigital(now, ms / 1000);
    requestAnimationFrame(frame);
  }

  setFmt();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
