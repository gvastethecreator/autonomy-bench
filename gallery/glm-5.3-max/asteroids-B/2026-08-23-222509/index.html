<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04060b">
<title>ASTEROIDS</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #04060b; }
  canvas { display: block; }
  /* CRT-style overlay: vignette + scanlines */
  #fx {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.42) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }
  #touch { position: fixed; inset: 0; z-index: 10; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(140,190,230,0.35); color: rgba(190,225,255,0.9);
    background: rgba(20,40,70,0.28); border-radius: 50%;
    font: 700 13px ui-monospace, Consolas, monospace; letter-spacing: 1px;
  }
  .tbtn:active { background: rgba(70,130,190,0.42); }
  #btnL { left: 18px;   bottom: 24px; width: 64px; height: 64px; font-size: 22px; }
  #btnR { left: 96px;   bottom: 24px; width: 64px; height: 64px; font-size: 22px; }
  #btnF { right: 18px;  bottom: 24px; width: 80px; height: 80px; border-color: rgba(255,190,120,0.45); color: rgba(255,220,170,0.95); }
  #btnT { right: 116px; bottom: 32px; width: 62px; height: 62px; font-size: 11px; }
  #btnJ { right: 34px;  bottom: 122px; width: 54px; height: 54px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fx"></div>
<div id="touch">
  <div class="tbtn" id="btnL">&laquo;</div>
  <div class="tbtn" id="btnR">&raquo;</div>
  <div class="tbtn" id="btnT">THRUST</div>
  <div class="tbtn" id="btnF">FIRE</div>
  <div class="tbtn" id="btnJ">JUMP</div>
</div>
<script>
(() => {
'use strict';

/* =====================================================================
   ASTEROIDS - a single-file vector arcade game
   Canvas rendering, WebAudio sound, keyboard + touch controls.
   ===================================================================== */

/* ---------------- helpers ---------------- */
const TAU = Math.PI * 2;
const FONT = "ui-monospace, Consolas, 'Cascadia Mono', Menlo, monospace";
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const d2 = (ax, ay, bx, by) => {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
};

/* ---------------- canvas ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let stars = [];

function makeStars() {
  stars = [];
  const n = Math.round((W * H) / 14000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      z: [0.35, 0.6, 1][randInt(0, 2)],
      ph: rand(TAU), sp: rand(0.4, 1.6)
    });
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
}
window.addEventListener('resize', resize);

/* ---------------- tuning ---------------- */
const CFG = {
  shipR: 13,
  rot: 3.9,            // rad/s
  thrust: 370,         // px/s^2
  damping: 0.5,        // per second (velocity halves ~ every 1.4 s)
  maxV: 500,
  bulletSpeed: 560,
  bulletLife: 1.05,
  maxBullets: 4,
  fireCd: 0.14,
  hyperCd: 5,
  rockR: { 3: 52, 2: 30, 1: 15 },
  rockScore: { 3: 20, 2: 50, 1: 100 },
  rockMass: { 3: 4, 2: 2, 1: 1 },
  sbulletSpeed: 350,
  sbulletLife: 1.4,
  respawnDelay: 2.0,
  spawnInvuln: 2.6
};

/* ---------------- audio ---------------- */
const Audio = {
  ac: null, master: null, noise: null, thrustGain: null,
  muted: false,

  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ac.destination);
    // white noise buffer
    const len = this.ac.sampleRate * 2;
    this.noise = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // continuous thrust rumble
    const src = this.ac.createBufferSource();
    src.buffer = this.noise; src.loop = true;
    const bp = this.ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 320; bp.Q.value = 0.8;
    this.thrustGain = this.ac.createGain();
    this.thrustGain.gain.value = 0;
    src.connect(bp); bp.connect(this.thrustGain); this.thrustGain.connect(this.master);
    src.start();
  },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.5;
    try { localStorage.setItem('asteroids-mute', m ? '1' : '0'); } catch (e) {}
  },

  setThrust(on) {
    if (!this.ac || !this.thrustGain) return;
    const t = this.ac.currentTime;
    this.thrustGain.gain.cancelScheduledValues(t);
    this.thrustGain.gain.setTargetAtTime(on ? 0.13 : 0, t, 0.05);
  },

  blip(f0, f1, dur, type, vol, when = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + when;
    const o = this.ac.createOscillator();
    const g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  burst(dur, fStart, fEnd, vol) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    const src = this.ac.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = rand(0.8, 1.2);
    const lp = this.ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(fStart, t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(40, fEnd), t + dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },

  shoot()      { this.blip(950, 150, 0.11, 'square', 0.11); },
  sshoot()     { this.blip(320, 90, 0.16, 'sawtooth', 0.09); },
  rockHit(s)   { this.burst(0.26 + 0.11 * s, 700 + 320 * s, 120, 0.2 + 0.07 * s);
                 this.blip(96, 38, 0.22, 'sine', 0.22); },
  shipDie()    { this.burst(0.85, 1600, 60, 0.4); this.blip(140, 28, 0.7, 'sine', 0.3); },
  saucerDie()  { this.burst(0.55, 2200, 90, 0.32);
                 this.blip(520, 60, 0.5, 'sawtooth', 0.16); },
  hyper()      { this.blip(170, 1600, 0.32, 'sine', 0.2); },
  beat(i)      { const f = i % 2 ? 86 : 62; this.blip(f, f, 0.1, 'triangle', 0.3); },
  saucerBlip(alt, small) {
    const base = small ? 470 : 215;
    const f = base * (alt ? 1.24 : 1);
    this.blip(f, f * 0.9, 0.22, 'sawtooth', small ? 0.06 : 0.085);
  },
  oneUp()      { this.blip(523, 523, 0.09, 'square', 0.14, 0);
                 this.blip(659, 659, 0.09, 'square', 0.14, 0.1);
                 this.blip(784, 784, 0.16, 'square', 0.14, 0.2); },
  gameOver()   { this.blip(220, 48, 0.9, 'sawtooth', 0.18); },
  uiStart()    { this.blip(330, 330, 0.07, 'square', 0.12, 0);
                 this.blip(440, 440, 0.07, 'square', 0.12, 0.08);
                 this.blip(660, 660, 0.12, 'square', 0.12, 0.16); }
};

/* ---------------- input ---------------- */
const keys = new Set();
const virt = { left: false, right: false, thrust: false, fire: false };
const input = { left: false, right: false, thrust: false, fire: false };

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'thrust', KeyW: 'thrust',
  Space: 'fire'
};

window.addEventListener('keydown', (e) => {
  Audio.init();
  if (e.code in KEYMAP || ['Enter', 'KeyP', 'KeyM', 'KeyH', 'Escape', 'ShiftLeft', 'ShiftRight', 'ArrowDown'].includes(e.code)) {
    e.preventDefault();
  }
  keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'KeyM') { Audio.setMuted(!Audio.muted); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if ((e.code === 'KeyH' || e.code === 'ShiftLeft' || e.code === 'ShiftRight')) { tryHyperspace(); return; }
  if (e.code === 'Enter' || e.code === 'Space') {
    if (game.state === 'title') startGame();
    else if (game.state === 'over' && game.overT > 0.8) startGame();
  }
});

window.addEventListener('keyup', (e) => keys.delete(e.code));

function readInput() {
  input.left  = keys.has('ArrowLeft')  || keys.has('KeyA') || virt.left;
  input.right = keys.has('ArrowRight') || keys.has('KeyD') || virt.right;
  input.thrust = keys.has('ArrowUp')   || keys.has('KeyW') || virt.thrust;
  input.fire  = keys.has('Space') || virt.fire;
}

/* touch controls */
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                 (window.matchMedia && matchMedia('(pointer: coarse)').matches);
if (IS_TOUCH) document.body.classList.add('touch');

function bindBtn(id, prop) {
  const el = document.getElementById(id);
  const on = (e) => { e.preventDefault(); Audio.init(); virt[prop] = true; };
  const off = (e) => { e.preventDefault(); virt[prop] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
bindBtn('btnL', 'left');
bindBtn('btnR', 'right');
bindBtn('btnT', 'thrust');
bindBtn('btnF', 'fire');

document.getElementById('btnJ').addEventListener('pointerdown', (e) => {
  e.preventDefault(); Audio.init(); tryHyperspace();
});

canvas.addEventListener('pointerdown', () => {
  Audio.init();
  if (game.state === 'title') startGame();
  else if (game.state === 'over' && game.overT > 0.8) startGame();
});

/* ---------------- game state ---------------- */
const game = {
  state: 'title',       // title | playing | paused | over
  time: 0, ui: 0,
  score: 0, hi: 0, lives: 3, wave: 1, nextExtra: 10000,
  ship: null,
  bullets: [], sbullets: [], rocks: [], saucers: [],
  particles: [], popups: [],
  shake: 0,
  respawnTimer: 0, respawnWait: 0,
  waveDelay: -1, waveSpeed: 1, mass0: 1,
  saucerCd: 0, sirenAlt: 0,
  beatT: 0, beatIv: 1, beatIdx: 0,
  hyperCd: 0,
  banner: { text: '', t: 0 },
  overT: 0, newHi: false
};

try {
  game.hi = parseInt(localStorage.getItem('asteroids-hi') || '0', 10) || 0;
  Audio.muted = localStorage.getItem('asteroids-mute') === '1';
} catch (e) {}

/* ---------------- entities ---------------- */
function makeRock(size, x, y, vx, vy) {
  const n = 9 + randInt(0, 4);
  const verts = [];
  for (let i = 0; i < n; i++) verts.push({ a: (i / n) * TAU + rand(-0.12, 0.12), m: rand(0.72, 1.26) });
  const r = {
    x, y, vx, vy, size,
    r: CFG.rockR[size] * rand(0.9, 1.1),
    verts,
    rot: rand(TAU), rs: rand(-1.1, 1.1),
    tint: ['#a9c6de', '#b7d3e8', '#9cb9d6'][randInt(0, 2)]
  };
  game.rocks.push(r);
  return r;
}

function rockBaseSpeed(size) {
  if (size === 3) return rand(28, 58);
  if (size === 2) return rand(58, 98);
  return rand(92, 140);
}

function spawnRockEdge(size) {
  let x, y;
  const side = randInt(0, 3);
  if (side === 0) { x = rand(W); y = -60; }
  else if (side === 1) { x = W + 60; y = rand(H); }
  else if (side === 2) { x = rand(W); y = H + 60; }
  else { x = -60; y = rand(H); }
  const tx = W * rand(0.25, 0.75), ty = H * rand(0.25, 0.75);
  const ang = Math.atan2(ty - y, tx - x) + rand(-0.35, 0.35);
  const sp = rockBaseSpeed(size) * game.waveSpeed * rand(0.85, 1.25);
  makeRock(size, x, y, Math.cos(ang) * sp, Math.sin(ang) * sp);
}

function spawnWave(n) {
  const count = Math.min(3 + n, 11);
  game.waveSpeed = Math.min(1 + (n - 1) * 0.11, 2.1);
  for (let i = 0; i < count; i++) spawnRockEdge(3);
  game.mass0 = count * CFG.rockMass[3];
  recalcBeat();
}

function newShip(invuln) {
  game.ship = {
    x: W / 2, y: H / 2, vx: 0, vy: 0,
    a: -Math.PI / 2,
    thrusting: false, invuln, fireCd: 0
  };
  game.respawnWait = 0;
}

function wrap(e, m) {
  m = m || e.r || 6;
  if (e.x < -m) e.x = W + m; else if (e.x > W + m) e.x = -m;
  if (e.y < -m) e.y = H + m; else if (e.y > H + m) e.y = -m;
}

/* particles */
function burst(x, y, n, sp, color, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), s = sp * rand(0.25, 1);
    game.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * rand(0.5, 1.1), max: life, color
    });
  }
}

function ring(x, y, color, life = 0.4) {
  game.particles.push({ x, y, vx: 0, vy: 0, life, max: life, color, ring: true });
}

/* ---------------- game flow ---------------- */
function startGame() {
  game.state = 'playing';
  game.score = 0; game.lives = 3; game.wave = 1; game.nextExtra = 10000;
  game.bullets = []; game.sbullets = []; game.rocks = []; game.saucers = [];
  game.particles = []; game.popups = [];
  game.shake = 0; game.hyperCd = 0;
  game.waveDelay = -1;
  game.saucerCd = rand(9, 15);
  game.beatIdx = 0; game.beatT = 0.6;
  game.banner = { text: 'WAVE 1', t: 2.0 };
  newShip(CFG.spawnInvuln);
  spawnWave(1);
  Audio.setThrust(false);
  Audio.uiStart();
}

function gameOver() {
  game.state = 'over';
  game.overT = 0;
  game.newHi = game.score > game.hi && game.score > 0;
  if (game.score > game.hi) {
    game.hi = game.score;
    try { localStorage.setItem('asteroids-hi', String(game.hi)); } catch (e) {}
  }
  Audio.setThrust(false);
  Audio.gameOver();
  // pop remaining saucers so nothing freezes mid-air behind the overlay
  for (let i = game.saucers.length - 1; i >= 0; i--) {
    const s = game.saucers[i];
    burst(s.x, s.y, 20, 170, '#ff9d7a', 0.7);
    ring(s.x, s.y, '#ff9d7a', 0.35);
  }
  game.saucers = [];
  game.sbullets = [];
}

function togglePause() {
  if (game.state === 'playing') {
    game.state = 'paused';
    Audio.setThrust(false);
  } else if (game.state === 'paused') {
    game.state = 'playing';
  }
}

function tryHyperspace() {
  if (game.state !== 'playing' || !game.ship || game.hyperCd > 0) return;
  const s = game.ship;
  burst(s.x, s.y, 14, 160, '#8fd6ff', 0.5);
  ring(s.x, s.y, '#8fd6ff');
  s.x = rand(W * 0.1, W * 0.9);
  s.y = rand(H * 0.1, H * 0.9);
  s.vx *= 0.25; s.vy *= 0.25;
  s.invuln = Math.max(s.invuln, 1.1);
  game.hyperCd = CFG.hyperCd;
  ring(s.x, s.y, '#8fd6ff');
  burst(s.x, s.y, 10, 110, '#cfeaff', 0.4);
  Audio.hyper();
}

function addScore(p, x, y) {
  game.score += p;
  game.popups.push({ x, y, txt: String(p), life: 0.9, max: 0.9, color: '#ffd27d' });
  if (game.score >= game.nextExtra) {
    game.nextExtra += 10000;
    game.lives++;
    Audio.oneUp();
    game.popups.push({ x: W / 2, y: H / 2 - 70, txt: '1UP', life: 1.4, max: 1.4, color: '#8effa1' });
  }
  if (game.score > game.hi) game.hi = game.score;
}

function recalcBeat() {
  let mass = 0;
  for (const r of game.rocks) mass += CFG.rockMass[r.size];
  const progress = game.mass0 > 0 ? 1 - mass / game.mass0 : 1;
  game.beatIv = clamp(1.05 - progress * 0.8 - (game.wave - 1) * 0.05, 0.22, 1.05);
}

function destroyRock(idx, scored) {
  const r = game.rocks[idx];
  game.rocks.splice(idx, 1);
  burst(r.x, r.y, 8 + r.size * 5, 60 + r.size * 40, r.tint, 0.55);
  ring(r.x, r.y, r.tint, 0.3);
  game.shake = Math.min(game.shake + 1.6 * r.size, 12);
  Audio.rockHit(r.size);
  if (r.size > 1) {
    const base = Math.atan2(r.vy, r.vx);
    const sp = Math.hypot(r.vx, r.vy) * 1.25 + 24 + (4 - r.size) * 18;
    for (const dirSign of [-1, 1]) {
      const a = base + dirSign * rand(0.5, 1.1);
      makeRock(r.size - 1, r.x, r.y, Math.cos(a) * sp, Math.sin(a) * sp);
    }
  }
  if (scored) addScore(CFG.rockScore[r.size], r.x, r.y);
  recalcBeat();
}

function spawnSaucer() {
  const probSmall = game.wave >= 2 ? Math.min(0.14 + (game.wave - 2) * 0.13, 0.65) : 0.1;
  const small = Math.random() < probSmall;
  const dir = Math.random() < 0.5 ? 1 : -1;
  let y0 = rand(H * 0.18, H * 0.82);
  const amp = Math.max(0, Math.min(46, y0 - 60, H - 60 - y0));
  const speed = (small ? 112 : 76) * rand(0.9, 1.15) * (1 + game.wave * 0.03);
  game.saucers.push({
    x: dir > 0 ? -60 : W + 60,
    y: y0, y0, amp, t: 0,
    vx: dir * speed,
    small, r: small ? 16 : 26,
    fireT: 1.0, sirenT: 0.12
  });
}

function scheduleSaucer() {
  game.saucerCd = rand(Math.max(8, 16 - game.wave), Math.max(13, 26 - game.wave));
}

function destroySaucer(idx, scored) {
  const s = game.saucers[idx];
  game.saucers.splice(idx, 1);
  burst(s.x, s.y, 26, 200, '#ff9d7a', 0.7);
  burst(s.x, s.y, 12, 90, '#ffd27d', 0.5);
  ring(s.x, s.y, '#ff9d7a', 0.35);
  game.shake = Math.min(game.shake + 8, 14);
  Audio.saucerDie();
  if (scored) addScore(s.small ? 1000 : 200, s.x, s.y);
  scheduleSaucer();
}

function killShip() {
  const s = game.ship;
  game.ship = null;
  burst(s.x, s.y, 44, 230, '#eef6ff', 0.9);
  burst(s.x, s.y, 16, 110, '#ffb347', 0.7);
  ring(s.x, s.y, '#eef6ff', 0.5);
  game.shake = 16;
  Audio.setThrust(false);
  Audio.shipDie();
  game.lives--;
  game.respawnTimer = CFG.respawnDelay;
  game.respawnWait = 0;
  if (game.lives < 0) gameOver();
}

function fire() {
  const s = game.ship;
  if (!s || s.fireCd > 0 || game.bullets.length >= CFG.maxBullets) return;
  s.fireCd = CFG.fireCd;
  const nx = s.x + Math.cos(s.a) * CFG.shipR * 1.5;
  const ny = s.y + Math.sin(s.a) * CFG.shipR * 1.5;
  game.bullets.push({
    x: nx, y: ny,
    vx: Math.cos(s.a) * CFG.bulletSpeed + s.vx * 0.5,
    vy: Math.sin(s.a) * CFG.bulletSpeed + s.vy * 0.5,
    life: CFG.bulletLife
  });
  burst(nx, ny, 2, 60, '#ffd27d', 0.15);
  Audio.shoot();
}

function fireSaucer(s) {
  let ang;
  if (s.small && game.ship) {
    const err = Math.max(0.06, 0.42 - game.wave * 0.035);
    ang = Math.atan2(game.ship.y - s.y, game.ship.x - s.x) + rand(-err, err);
  } else {
    ang = rand(TAU);
  }
  game.sbullets.push({
    x: s.x, y: s.y,
    vx: Math.cos(ang) * CFG.sbulletSpeed,
    vy: Math.sin(ang) * CFG.sbulletSpeed,
    life: CFG.sbulletLife
  });
  Audio.sshoot();
}

/* ---------------- update ---------------- */
function updateShip(dt) {
  const s = game.ship;
  if (input.left) s.a -= CFG.rot * dt;
  if (input.right) s.a += CFG.rot * dt;
  s.thrusting = input.thrust;
  if (s.thrusting) {
    s.vx += Math.cos(s.a) * CFG.thrust * dt;
    s.vy += Math.sin(s.a) * CFG.thrust * dt;
    // exhaust sparks
    if (Math.random() < 0.45) {
      const tx = s.x - Math.cos(s.a) * 14, ty = s.y - Math.sin(s.a) * 14;
      const a = s.a + Math.PI + rand(-0.4, 0.4);
      game.particles.push({
        x: tx, y: ty,
        vx: Math.cos(a) * rand(60, 150) + s.vx * 0.4,
        vy: Math.sin(a) * rand(60, 150) + s.vy * 0.4,
        life: rand(0.15, 0.35), max: 0.35, color: '#ffb347'
      });
    }
  }
  Audio.setThrust(s.thrusting);
  const sp = Math.hypot(s.vx, s.vy);
  if (sp > CFG.maxV) { s.vx = (s.vx / sp) * CFG.maxV; s.vy = (s.vy / sp) * CFG.maxV; }
  const d = Math.exp(-CFG.damping * dt);
  s.vx *= d; s.vy *= d;
  s.x += s.vx * dt; s.y += s.vy * dt;
  wrap(s, CFG.shipR);
  if (s.invuln > 0) s.invuln -= dt;
  if (s.fireCd > 0) s.fireCd -= dt;
  if (input.fire) fire();
}

function spawnClear() {
  const cx = W / 2, cy = H / 2, pad = 130;
  for (const r of game.rocks) {
    if (d2(r.x, r.y, cx, cy) < (r.r + pad) * (r.r + pad)) return false;
  }
  for (const s of game.saucers) {
    if (d2(s.x, s.y, cx, cy) < (s.r + pad) * (s.r + pad)) return false;
  }
  return true;
}

function updateFx(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const d = Math.exp(-1.4 * dt);
    p.vx *= d; p.vy *= d;
  }
  for (let i = game.popups.length - 1; i >= 0; i--) {
    const p = game.popups[i];
    p.life -= dt;
    if (p.life <= 0) { game.popups.splice(i, 1); continue; }
    p.y -= 28 * dt;
  }
}

function updateRocks(dt) {
  for (const r of game.rocks) {
    r.x += r.vx * dt; r.y += r.vy * dt;
    r.rot += r.rs * dt;
    wrap(r);
  }
}

function updatePlaying(dt) {
  game.time += dt;

  // wave transition countdown
  if (game.waveDelay > 0) {
    game.waveDelay -= dt;
    if (game.waveDelay <= 0) {
      game.wave++;
      game.banner = { text: 'WAVE ' + game.wave, t: 2.0 };
      spawnWave(game.wave);
    }
  }

  // ship
  if (game.ship) {
    updateShip(dt);
  } else if (game.state === 'playing') {
    if (game.respawnTimer > 0) {
      game.respawnTimer -= dt;
    } else {
      game.respawnWait += dt;
      if (game.respawnWait > 0.35 && (spawnClear() || game.respawnWait > 3.5)) {
        newShip(CFG.spawnInvuln);
      }
    }
  }

  // ship bullets
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.life -= dt;
    if (b.life <= 0) { game.bullets.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    wrap(b, 3);
  }

  // saucer bullets
  for (let i = game.sbullets.length - 1; i >= 0; i--) {
    const b = game.sbullets[i];
    b.life -= dt;
    if (b.life <= 0) { game.sbullets.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    wrap(b, 3);
  }

  updateRocks(dt);

  // saucers
  for (let i = game.saucers.length - 1; i >= 0; i--) {
    const s = game.saucers[i];
    s.t += dt;
    s.x += s.vx * dt;
    s.y = s.y0 + Math.sin(s.t * 1.5) * s.amp;
    s.fireT -= dt;
    if (s.fireT <= 0 && game.sbullets.length < 2) {
      s.fireT = 0.85;
      fireSaucer(s);
    }
    s.sirenT -= dt;
    if (s.sirenT <= 0) {
      s.sirenT = 0.32;
      game.sirenAlt ^= 1;
      Audio.saucerBlip(game.sirenAlt, s.small);
    }
    if ((s.vx > 0 && s.x > W + 70) || (s.vx < 0 && s.x < -70)) {
      game.saucers.splice(i, 1);
      scheduleSaucer();
    }
  }

  updateFx(dt);

  // saucer spawn timer
  if (game.saucerCd > 0) {
    game.saucerCd -= dt;
    if (game.saucerCd <= 0 && game.saucers.length === 0) spawnSaucer();
  }

  // heartbeat
  if (game.rocks.length > 0 && game.waveDelay <= 0) {
    game.beatT -= dt;
    if (game.beatT <= 0) {
      game.beatT = game.beatIv;
      Audio.beat(game.beatIdx++);
    }
  }

  if (game.hyperCd > 0) game.hyperCd -= dt;
  game.shake *= Math.exp(-5.5 * dt);
  if (game.shake < 0.04) game.shake = 0;
  if (game.banner.t > 0) game.banner.t -= dt;

  collide();
}

function collide() {
  // ship bullets vs rocks / saucers
  for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
    const b = game.bullets[bi];
    let consumed = false;
    for (let ri = game.rocks.length - 1; ri >= 0; ri--) {
      const r = game.rocks[ri];
      const rr = r.r * 0.92 + 3;
      if (d2(b.x, b.y, r.x, r.y) < rr * rr) {
        game.bullets.splice(bi, 1);
        destroyRock(ri, true);
        consumed = true;
        break;
      }
    }
    if (consumed) continue;
    for (let si = game.saucers.length - 1; si >= 0; si--) {
      const s = game.saucers[si];
      const rr = s.r + 4;
      if (d2(b.x, b.y, s.x, s.y) < rr * rr) {
        game.bullets.splice(bi, 1);
        destroySaucer(si, true);
        break;
      }
    }
  }

  // saucer bullets vs rocks
  for (let bi = game.sbullets.length - 1; bi >= 0; bi--) {
    const b = game.sbullets[bi];
    for (let ri = game.rocks.length - 1; ri >= 0; ri--) {
      const r = game.rocks[ri];
      const rr = r.r * 0.92 + 3;
      if (d2(b.x, b.y, r.x, r.y) < rr * rr) {
        game.sbullets.splice(bi, 1);
        destroyRock(ri, false);
        break;
      }
    }
  }

  // saucers vs rocks
  for (let si = game.saucers.length - 1; si >= 0; si--) {
    const s = game.saucers[si];
    for (let ri = game.rocks.length - 1; ri >= 0; ri--) {
      const r = game.rocks[ri];
      const rr = (s.r + r.r) * 0.85;
      if (d2(s.x, s.y, r.x, r.y) < rr * rr) {
        destroySaucer(si, false);
        destroyRock(ri, false);
        break;
      }
    }
  }

  // ship collisions
  const sh = game.ship;
  if (sh && sh.invuln <= 0) {
    for (let ri = game.rocks.length - 1; ri >= 0; ri--) {
      const r = game.rocks[ri];
      const rr = (r.r + CFG.shipR) * 0.85;
      if (d2(sh.x, sh.y, r.x, r.y) < rr * rr) {
        destroyRock(ri, false);
        killShip();
        return;
      }
    }
    for (let si = game.saucers.length - 1; si >= 0; si--) {
      const s = game.saucers[si];
      const rr = (s.r + CFG.shipR) * 0.85;
      if (d2(sh.x, sh.y, s.x, s.y) < rr * rr) {
        destroySaucer(si, false);
        killShip();
        return;
      }
    }
    for (let bi = game.sbullets.length - 1; bi >= 0; bi--) {
      const b = game.sbullets[bi];
      const rr = CFG.shipR + 3;
      if (d2(sh.x, sh.y, b.x, b.y) < rr * rr) {
        game.sbullets.splice(bi, 1);
        killShip();
        return;
      }
    }
  }

  // wave cleared?
  if (game.rocks.length === 0 && game.saucers.length === 0 && game.waveDelay < 0) {
    game.waveDelay = 1.9;
  }
}

function updateAmbient(dt) {
  updateRocks(dt);
  updateFx(dt);
  game.shake *= Math.exp(-5.5 * dt);
  if (game.shake < 0.04) game.shake = 0;
  if (game.state === 'over') game.overT += dt;
}

/* ---------------- drawing ---------------- */
function strokeGlow(color, w, a = 1) {
  ctx.strokeStyle = color;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.globalAlpha = a * 0.18;
  ctx.lineWidth = w + 3.4;
  ctx.stroke();
  ctx.globalAlpha = a;
  ctx.lineWidth = w;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function text(str, x, y, size, color, align = 'center', alpha = 1, weight = 700, ls = 2) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  try { ctx.letterSpacing = ls + 'px'; } catch (e) {}
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.restore();
}

function glowText(str, x, y, size, color, align = 'center', alpha = 1) {
  ctx.save();
  ctx.font = '700 ' + size + 'px ' + FONT;
  try { ctx.letterSpacing = Math.round(size * 0.14) + 'px'; } catch (e) {}
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = alpha * 0.55;
  ctx.shadowColor = color;
  ctx.shadowBlur = size * 0.5;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 0;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function drawStars() {
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(game.ui * s.sp + s.ph);
    ctx.fillStyle = 'rgba(205,225,255,' + (0.16 + 0.5 * s.z * tw).toFixed(3) + ')';
    const sz = s.z > 0.8 ? 2 : 1;
    ctx.fillRect(s.x * W, s.y * H, sz, sz);
  }
}

function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.rot);
  ctx.beginPath();
  for (let i = 0; i < r.verts.length; i++) {
    const v = r.verts[i];
    const px = Math.cos(v.a) * r.r * v.m;
    const py = Math.sin(v.a) * r.r * v.m;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(90,130,175,0.10)';
  ctx.fill();
  strokeGlow(r.tint, 1.5);
  ctx.restore();
}

function shipPath(scale) {
  ctx.beginPath();
  ctx.moveTo(15 * scale, 0);
  ctx.lineTo(-10 * scale, 8.5 * scale);
  ctx.lineTo(-5.5 * scale, 0);
  ctx.lineTo(-10 * scale, -8.5 * scale);
  ctx.closePath();
}

function drawShip(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.a);
  const blink = s.invuln > 0 ? 0.3 + 0.7 * Math.abs(Math.sin(game.ui * 9)) : 1;
  if (s.thrusting && Math.floor(game.ui * 32) % 2 === 0) {
    const f = rand(0.75, 1.25);
    ctx.beginPath();
    ctx.moveTo(-7 * 1, 4.5);
    ctx.lineTo(-15 * f, 0);
    ctx.lineTo(-7 * 1, -4.5);
    strokeGlow('#ffb347', 1.4, blink);
  }
  shipPath(1);
  strokeGlow('#f2f7ff', 1.6, blink);
  if (s.invuln > 0) {
    ctx.beginPath();
    ctx.setLineDash([7, 7]);
    ctx.arc(0, 0, 24, 0, TAU);
    strokeGlow('#8fd6ff', 1, 0.4 + 0.3 * Math.sin(game.ui * 6));
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawShipIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-Math.PI / 2);
  shipPath(0.62);
  ctx.strokeStyle = '#cfe3f5';
  ctx.lineWidth = 1.4;
  ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.9;
  ctx.stroke();
  ctx.restore();
}

function drawSaucer(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  const r = s.r;
  const col = s.small ? '#ff5f6e' : '#ff9d7a';
  ctx.beginPath();
  ctx.moveTo(-1.5 * r, 0);
  ctx.lineTo(-0.55 * r, 0.5 * r);
  ctx.lineTo(0.55 * r, 0.5 * r);
  ctx.lineTo(1.5 * r, 0);
  ctx.lineTo(0.55 * r, -0.5 * r);
  ctx.lineTo(-0.55 * r, -0.5 * r);
  ctx.closePath();
  strokeGlow(col, 1.5);
  ctx.beginPath();
  ctx.moveTo(-0.42 * r, -0.5 * r);
  ctx.lineTo(-0.22 * r, -0.95 * r);
  ctx.lineTo(0.22 * r, -0.95 * r);
  ctx.lineTo(0.42 * r, -0.5 * r);
  strokeGlow(col, 1.2);
  // mid line with blinking lights
  ctx.beginPath();
  ctx.moveTo(-1.5 * r, 0);
  ctx.lineTo(1.5 * r, 0);
  strokeGlow(col, 1, 0.8);
  const lit = Math.floor(game.ui * 7) % 2 === 0;
  ctx.fillStyle = lit ? '#ffe9a8' : col;
  ctx.globalAlpha = 0.95;
  ctx.fillRect(-0.75 * r - 1.5, -1.5, 3, 3);
  ctx.fillStyle = lit ? col : '#ffe9a8';
  ctx.fillRect(0.75 * r - 1.5, -1.5, 3, 3);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBullet(b, color) {
  const ang = Math.atan2(b.vy, b.vx);
  const L = 7;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - Math.cos(ang) * L, b.y - Math.sin(ang) * L);
  strokeGlow(color, 2);
}

function drawParticles() {
  for (const p of game.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.ring) {
      const prog = 1 - a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 + prog * 34, 0, TAU);
      strokeGlow(p.color, 1.4, a * 0.8);
    } else {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = a;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function drawPopups() {
  for (const p of game.popups) {
    const a = clamp(p.life / p.max, 0, 1);
    text(p.txt, p.x, p.y, 15, p.color, 'center', a, 700, 1);
  }
}

function drawHUD() {
  const pad = 18;
  text('SCORE', pad, pad + 8, 10, 'rgba(150,190,220,0.6)', 'left', 1, 700, 3);
  text(String(game.score).padStart(5, '0'), pad, pad + 30, 24, '#e8f4ff', 'left', 1, 700, 2);
  text('HI ' + String(game.hi).padStart(5, '0'), W / 2, pad + 16, 13, 'rgba(150,190,220,0.75)', 'center', 1, 700, 3);
  text('WAVE ' + game.wave, W - pad, pad + 16, 13, 'rgba(150,190,220,0.75)', 'right', 1, 700, 3);
  // lives
  const n = Math.max(0, game.lives);
  for (let i = 0; i < Math.min(n, 8); i++) drawShipIcon(pad + 10 + i * 24, pad + 58);
  if (n > 8) text('x' + n, pad + 10 + 8 * 24, pad + 58, 12, '#cfe3f5', 'left');
  // hyperspace meter
  if (game.hyperCd > 0) {
    const w = 70, x = W - pad - w, y = pad + 48;
    ctx.fillStyle = 'rgba(120,170,210,0.2)';
    ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = 'rgba(143,214,255,0.85)';
    ctx.fillRect(x + w * (game.hyperCd / CFG.hyperCd), y, w * (1 - game.hyperCd / CFG.hyperCd), 4);
    text('JUMP', W - pad, y + 14, 9, 'rgba(150,190,220,0.55)', 'right', 1, 700, 2);
  } else {
    text('JUMP READY', W - pad, pad + 50, 9, 'rgba(143,214,255,0.7)', 'right', 1, 700, 2);
  }
  if (Audio.muted) text('SOUND OFF [M]', W - pad, H - 14, 10, 'rgba(150,190,220,0.5)', 'right', 1, 700, 2);
}

function drawOverlays() {
  const blink = (game.ui % 1.1) < 0.66;

  if (game.state === 'title') {
    const ty = H * 0.32;
    glowText('ASTEROIDS', W / 2, ty, Math.min(W * 0.085, 82), '#eaf6ff');
    text('A VECTOR FIELD CLASSIC', W / 2, ty + Math.min(W * 0.085, 82) * 0.75, 13, 'rgba(150,190,220,0.7)', 'center', 1, 700, 5);
    if (game.hi > 0) text('HIGH SCORE ' + String(game.hi).padStart(5, '0'), W / 2, H * 0.47, 15, '#ffd27d', 'center', 0.9, 700, 3);

    const cy = H * 0.60;
    if (IS_TOUCH) {
      text('TOUCH BUTTONS TO STEER, THRUST, FIRE AND JUMP', W / 2, cy, 12, 'rgba(190,225,255,0.75)', 'center', 1, 400, 2);
    } else {
      text('LEFT / RIGHT  ROTATE', W / 2, cy - 26, 13, 'rgba(190,225,255,0.75)', 'center', 1, 400, 2);
      text('UP  THRUST      SPACE  FIRE', W / 2, cy - 6, 13, 'rgba(190,225,255,0.75)', 'center', 1, 400, 2);
      text('H  HYPERSPACE      P  PAUSE      M  SOUND', W / 2, cy + 14, 13, 'rgba(190,225,255,0.75)', 'center', 1, 400, 2);
    }
    if (blink) {
      text(IS_TOUCH ? 'TAP TO START' : 'PRESS ENTER TO START', W / 2, H * 0.76, 17, '#8effa1', 'center', 1, 700, 4);
    }
    text('CANVAS + WEBAUDIO, ONE FILE, NO DEPENDENCIES', W / 2, H - 20, 10, 'rgba(150,190,220,0.35)', 'center', 1, 400, 2);
    return;
  }

  if (game.state === 'paused') {
    ctx.fillStyle = 'rgba(3,5,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    glowText('PAUSED', W / 2, H * 0.42, 44, '#eaf6ff');
    text('P TO RESUME', W / 2, H * 0.42 + 44, 13, 'rgba(190,225,255,0.7)', 'center', 1, 700, 3);
    return;
  }

  if (game.state === 'over') {
    ctx.fillStyle = 'rgba(3,5,10,0.5)';
    ctx.fillRect(0, 0, W, H);
    glowText('GAME OVER', W / 2, H * 0.36, Math.min(W * 0.07, 58), '#ff8d7a');
    text('SCORE ' + String(game.score).padStart(5, '0'), W / 2, H * 0.36 + 58, 20, '#eaf6ff', 'center', 1, 700, 3);
    if (game.newHi) {
      if ((game.ui % 0.8) < 0.5) text('NEW HIGH SCORE', W / 2, H * 0.36 + 88, 15, '#8effa1', 'center', 1, 700, 4);
    } else {
      text('HIGH SCORE ' + String(game.hi).padStart(5, '0'), W / 2, H * 0.36 + 88, 13, 'rgba(150,190,220,0.8)', 'center', 1, 700, 3);
    }
    if (game.overT > 0.8 && blink) {
      text(IS_TOUCH ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN', W / 2, H * 0.62, 15, '#8effa1', 'center', 1, 700, 3);
    }
    return;
  }

  // wave banner while playing
  if (game.banner.t > 0) {
    const t = game.banner.t;
    const a = clamp(Math.min((2.0 - t) * 4, t * 1.6), 0, 1);
    text(game.banner.text, W / 2, H * 0.3, 30, '#eaf6ff', 'center', a * 0.9, 700, 8);
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // phosphor-style fade instead of a hard clear
  ctx.fillStyle = 'rgba(4,6,11,0.5)';
  ctx.fillRect(0, 0, W, H);

  drawStars();

  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-1, 1) * game.shake, rand(-1, 1) * game.shake);

  for (const r of game.rocks) drawRock(r);
  for (const s of game.saucers) drawSaucer(s);
  for (const b of game.sbullets) drawBullet(b, '#ff8d7a');
  for (const b of game.bullets) drawBullet(b, '#ffd27d');
  if (game.ship && (game.state === 'playing' || game.state === 'paused')) drawShip(game.ship);
  drawParticles();
  drawPopups();

  ctx.restore();

  if (game.state !== 'title') drawHUD();
  drawOverlays();
}

/* ---------------- title ambience ---------------- */
function seedTitleRocks() {
  game.rocks = [];
  game.saucers = [];
  game.sbullets = [];
  for (let i = 0; i < 7; i++) {
    let x = rand(W), y = rand(H);
    if (d2(x, y, W / 2, H / 2) < 220 * 220) { x = (x + W / 2) % W; }
    makeRock(randInt(2, 3), x, y, rand(-28, 28), rand(-28, 28));
  }
}

/* ---------------- main loop ---------------- */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  const dt = Math.min((ts - last) / 1000 || 0, 0.05);
  last = ts;
  game.ui += dt;
  readInput();
  if (game.state === 'playing') updatePlaying(dt);
  else if (game.state === 'title' || game.state === 'over') updateAmbient(dt);
  render();
}

window.addEventListener('blur', () => {
  if (game.state === 'playing') togglePause();
  Audio.setThrust(false);
});

/* ---------------- boot ---------------- */
resize();
seedTitleRocks();
requestAnimationFrame(frame);

})();
</script>
