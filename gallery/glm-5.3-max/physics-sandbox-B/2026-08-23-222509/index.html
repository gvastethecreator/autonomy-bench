<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinetic &middot; 2D Physics Sandbox</title>
<style>
  :root{
    --bg:#0a0e16;
    --panel:rgba(14,20,33,.84);
    --line:rgba(148,163,184,.14);
    --text:#e7ecf5;
    --muted:#8b98ae;
    --accent:#5eead4;
    --accent-soft:rgba(94,234,212,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font:13px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  }
  #world{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}

  /* ---------- control panel ---------- */
  #panel{
    position:fixed;top:14px;left:14px;width:266px;z-index:10;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 44px rgba(0,0,0,.5);
    animation:panelIn .5s cubic-bezier(.2,.9,.25,1) both;
    transition:transform .28s ease,opacity .28s ease;
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  #panel.hidden{transform:translateX(-120%);opacity:0;pointer-events:none}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px 9px;border-bottom:1px solid var(--line)}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{
    width:27px;height:27px;border-radius:8px;flex:none;
    background:#123 conic-gradient(from 210deg,#ff8f6b,#ffc95c,#6fc0ff,#b9a2ff,#ff8f6b);
    opacity:.92;box-shadow:0 0 16px rgba(94,234,212,.22);
  }
  .brand h1{font-size:13px;letter-spacing:.26em;font-weight:650}
  .brand p{font-size:10.5px;color:var(--muted);letter-spacing:.05em;margin-top:1px}
  .icon-btn{
    width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;
  }
  .icon-btn:hover{color:var(--text);background:rgba(255,255,255,.09)}
  #showPanel{
    position:fixed;top:14px;left:14px;z-index:9;width:34px;height:34px;
    border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(10px);font-size:15px;
  }
  #showPanel.visible{display:flex}
  .panel-body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:11px}
  .label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}

  .tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .tool{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 2px 5px;background:rgba(255,255,255,.03);border:1px solid var(--line);
    border-radius:9px;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,box-shadow .15s;
  }
  .tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tool span{font-size:9px;letter-spacing:.05em}
  .tool:hover{color:var(--text);background:rgba(255,255,255,.07)}
  .tool.active{color:#08211c;background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px rgba(94,234,212,.35)}

  .seg{display:grid;gap:4px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg.c4{grid-template-columns:repeat(4,1fr)}
  .seg.c2{grid-template-columns:repeat(2,1fr)}
  .seg button{
    display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 2px;
    border:0;border-radius:6px;background:transparent;color:var(--muted);
    font-size:11px;font-family:inherit;cursor:pointer;transition:background .15s,color .15s;
  }
  .seg button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .seg button:hover{color:var(--text)}
  .seg button.active{background:var(--accent-soft);color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .slider{display:flex;flex-direction:column;gap:2px}
  .slider .row{display:flex;justify-content:space-between;align-items:baseline}
  .slider label{font-size:11px}
  .slider output{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);
    margin-top:-4px;box-shadow:0 0 8px rgba(94,234,212,.5);
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}

  .actions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .actions button{
    padding:7px 0;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--text);font-size:10px;font-family:inherit;
    letter-spacing:.03em;cursor:pointer;transition:background .15s;
  }
  .actions button:hover{background:rgba(255,255,255,.10)}
  .actions button.primary{background:var(--accent-soft);border-color:rgba(94,234,212,.4);color:var(--accent)}
  .keys{font-size:9.5px;color:var(--muted);letter-spacing:.03em;line-height:1.7}
  .keys b{color:#c3cede;font-weight:600}

  /* ---------- overlays ---------- */
  #stats{
    position:fixed;right:14px;bottom:12px;z-index:5;
    font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em;
    background:rgba(10,14,22,.6);padding:5px 11px;border-radius:8px;border:1px solid var(--line);
    backdrop-filter:blur(8px);pointer-events:none;
  }
  #hint{
    position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;
    font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;
    background:rgba(10,14,22,.6);padding:5px 14px;border-radius:999px;border:1px solid var(--line);
    backdrop-filter:blur(8px);pointer-events:none;transition:opacity .3s;
  }
  #toast{
    position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;
    font-size:12px;letter-spacing:.06em;color:var(--text);
    background:rgba(14,20,33,.9);border:1px solid rgba(94,234,212,.35);color:var(--accent);
    padding:7px 18px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(3px)}

  @media (max-width:640px){
    #panel{width:236px}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="panel">
  <div class="panel-head">
    <div class="brand">
      <div class="logo"></div>
      <div><h1>KINETIC</h1><p>2D physics sandbox</p></div>
    </div>
    <button class="icon-btn" id="collapseBtn" title="Hide panel (H)">&laquo;</button>
  </div>
  <div class="panel-body">
    <div>
      <div class="label">Tool</div>
      <div class="tools" id="tools">
        <button class="tool active" data-tool="spawn" title="Spawn shapes (1)" aria-label="Spawn tool">
          <svg viewBox="0 0 16 16"><circle cx="5.6" cy="10.4" r="3.4"/><rect x="9.6" y="2.9" width="5.6" height="5.6" rx="1"/></svg>
          <span>spawn</span>
        </button>
        <button class="tool" data-tool="grab" title="Grab &amp; fling (2)" aria-label="Grab tool">
          <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12M5.6 4.4L8 2l2.4 2.4M5.6 11.6L8 14l2.4-2.4M4.4 5.6L2 8l2.4 2.4M11.6 5.6L14 8l-2.4 2.4"/></svg>
          <span>grab</span>
        </button>
        <button class="tool" data-tool="wall" title="Draw static platforms (3)" aria-label="Wall tool">
          <svg viewBox="0 0 16 16"><rect x="1.6" y="6" width="12.8" height="4" rx="1" transform="rotate(-18 8 8)"/></svg>
          <span>wall</span>
        </button>
        <button class="tool" data-tool="boom" title="Explosion (4)" aria-label="Boom tool">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.4v2.2M8 12.4v2.2M1.4 8h2.2M12.4 8h2.2M3.3 3.3l1.6 1.6M11.1 11.1l1.6 1.6M12.7 3.3l-1.6 1.6M4.9 11.1l-1.6 1.6"/></svg>
          <span>boom</span>
        </button>
        <button class="tool" data-tool="erase" title="Erase bodies (5)" aria-label="Erase tool">
          <svg viewBox="0 0 16 16"><path d="M2.8 4.4h10.4M6.4 4.4V2.8h3.2v1.6M4.3 4.4l.7 9h6l.7-9M6.6 7v3.6M9.4 7v3.6"/></svg>
          <span>erase</span>
        </button>
      </div>
    </div>

    <div>
      <div class="label">Shape</div>
      <div class="seg c4" id="shapes">
        <button data-shape="circle" title="Circle"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/></svg></button>
        <button data-shape="box" title="Box"><svg viewBox="0 0 16 16"><rect x="3.2" y="3.2" width="9.6" height="9.6" rx="1.4"/></svg></button>
        <button data-shape="poly" title="Polygon"><svg viewBox="0 0 16 16"><path d="M8 2.4l4.8 3.5-1.8 5.6H5L3.2 5.9z"/></svg></button>
        <button data-shape="mixed" title="Random mix"><svg viewBox="0 0 16 16"><path d="M8 1.8l1.3 4.9 4.9 1.3-4.9 1.3L8 14.2l-1.3-4.9-4.9-1.3 4.9-1.3z"/></svg></button>
      </div>
    </div>

    <div>
      <div class="label">Material</div>
      <div class="seg c2" id="mats">
        <button data-mat="normal" class="active"><span class="dot" style="background:#ff8f6b"></span>Normal</button>
        <button data-mat="bouncy"><span class="dot" style="background:#52e5b3"></span>Bouncy</button>
        <button data-mat="heavy"><span class="dot" style="background:#8fa3c2"></span>Heavy</button>
        <button data-mat="light"><span class="dot" style="background:#ffd3e8"></span>Feather</button>
      </div>
    </div>

    <div class="slider">
      <div class="row"><label for="gravity">Gravity</label><output id="gravityOut">1500</output></div>
      <input type="range" id="gravity" min="-2000" max="2000" step="50" value="1500">
    </div>
    <div class="slider">
      <div class="row"><label for="timeScale">Time scale</label><output id="timeOut">1.00x</output></div>
      <input type="range" id="timeScale" min="0.1" max="2" step="0.05" value="1">
    </div>
    <div class="slider">
      <div class="row"><label for="sizeRange">Spawn size</label><output id="sizeOut">26</output></div>
      <input type="range" id="sizeRange" min="12" max="70" step="1" value="26">
    </div>

    <div class="actions">
      <button id="pauseBtn" class="primary" title="Pause / resume (Space)">Pause</button>
      <button id="stepBtn" title="Advance one step (S)">Step</button>
      <button id="burstBtn" title="Burst of shapes (B)">Burst</button>
      <button id="clearBtn" title="Clear dynamic bodies (C)">Clear</button>
      <button id="resetBtn" title="Rebuild scene (R)">Reset</button>
    </div>

    <div class="keys">
      <b>1-5</b> tools &nbsp;<b>Space</b> pause &nbsp;<b>G</b> zero-g &nbsp;<b>X</b> clear all &nbsp;<b>right-click</b> blast
    </div>
  </div>
</div>
<button id="showPanel" title="Show panel (H)">&#9776;</button>

<div id="stats">&mdash;</div>
<div id="hint"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   KINETIC - a 2D physics sandbox in one file.
   Custom impulse-based rigid body engine (circles + convex polygons),
   spatial-hash broadphase, SAT narrowphase with clipped contact
   manifolds, sequential impulses with warm starting, sleeping.
   ===================================================================== */

/* ---------------- tiny math ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

/* ---------------- canvas ---------------- */
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
let bgCanvas = null;

function buildBackground() {
  bgCanvas = document.createElement("canvas");
  bgCanvas.width = Math.max(1, Math.round(W * DPR));
  bgCanvas.height = Math.max(1, Math.round(H * DPR));
  const b = bgCanvas.getContext("2d");
  const g = b.createLinearGradient(0, 0, 0, bgCanvas.height);
  g.addColorStop(0, "#0c1322"); g.addColorStop(0.55, "#0a0e16"); g.addColorStop(1, "#0d1526");
  b.fillStyle = g; b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  b.fillStyle = "rgba(148,163,184,0.075)";
  const s = 36 * DPR;
  for (let y = s; y < bgCanvas.height; y += s)
    for (let x = s; x < bgCanvas.width; x += s)
      b.fillRect(x - DPR, y - DPR, 2 * DPR, 2 * DPR);
  const rg = b.createRadialGradient(
    bgCanvas.width / 2, bgCanvas.height / 2, Math.min(bgCanvas.width, bgCanvas.height) * 0.3,
    bgCanvas.width / 2, bgCanvas.height / 2, Math.max(bgCanvas.width, bgCanvas.height) * 0.72
  );
  rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(1, "rgba(0,0,0,0.42)");
  b.fillStyle = rg; b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
}

/* ---------------- world state ---------------- */
const bodies = [];
let nextId = 1;
let gravityY = 1500, prevGravity = 1500;
let timeScaleVal = 1, paused = false, stepOnce = false;
let simTime = 0;

const STEP = 1 / 120, ITER = 9, BAUM = 0.2, SLOP = 0.4, REST_VEL = 80, BIAS_MAX = 280;
const SLEEP_LIN = 13, SLEEP_ANG = 0.14, SLEEP_TIME = 0.55;
const CELL = 100, MAX_DYN = 460;

let tool = "spawn";
let toolShape = "circle";
let toolMaterial = "normal";
let spawnSize = 26;
let grab = null;              // { body, ax, ay } anchor in local coords
let mouse = { x: 0, y: 0, sx: 0, sy: 0, down: false, dragging: false };

/* ---------------- materials ---------------- */
const MATERIALS = {
  normal: { density: 0.0016, e: 0.18, friction: 0.42,
    palette: [["#ff8f6b", "#ffc4a8"], ["#ffc95c", "#ffe3a1"], ["#6fc0ff", "#a8d9ff"], ["#b9a2ff", "#d6c8ff"], ["#ff85a6", "#ffb3c7"]] },
  bouncy: { density: 0.0013, e: 0.88, friction: 0.35,
    palette: [["#52e5b3", "#a5f3d6"], ["#3fd8cf", "#9df0ea"], ["#8af0a0", "#c8ffd8"], ["#5eead4", "#b5fbec"]] },
  heavy:  { density: 0.006, e: 0.05, friction: 0.55,
    palette: [["#8fa3c2", "#c2d2e8"], ["#7c8fb0", "#b4c4dd"], ["#a3b2cc", "#d3deee"]] },
  light:  { density: 0.0004, e: 0.35, friction: 0.30,
    palette: [["#ffd3e8", "#fff0f7"], ["#cfe3ff", "#eaf2ff"], ["#ffe9c9", "#fff6e6"]] },
};
const STATIC_FILL = "#232e43", STATIC_STROKE = "#43587a";

/* ---------------- body factory ---------------- */
function baseBody(x, y, opts) {
  const mat = MATERIALS[opts.material || "normal"];
  const pal = opts.colorPair || pick(mat.palette);
  return {
    id: nextId++,
    px: x, py: y, angle: opts.angle || 0,
    vx: opts.vx || 0, vy: opts.vy || 0, av: opts.av || 0,
    isStatic: !!opts.isStatic, wall: !!opts.wall,
    material: opts.material || "normal",
    e: opts.e !== undefined ? opts.e : mat.e,
    friction: opts.friction !== undefined ? opts.friction : mat.friction,
    fill: pal[0], stroke: pal[1],
    trailColor: rgba(pal[0], 0.13),
    halo: (opts.material || "normal") === "bouncy",
    alpha: (opts.material || "normal") === "light" ? 0.85 : 1,
    asleep: false, sleepT: 0, dead: false,
    bornMs: performance.now(),
    mass: 0, invMass: 0, inertia: 0, invI: 0,
    wv: null, wn: null,
    aabb: { x0: 0, y0: 0, x1: 0, y1: 0 },
  };
}

function setMassFromArea(b, area, density) {
  if (b.isStatic) { b.mass = Infinity; b.invMass = 0; b.inertia = Infinity; b.invI = 0; return; }
  b.mass = Math.max(density * area, 0.0004);
  b.invMass = 1 / b.mass;
}

function makeCircle(x, y, r, opts) {
  const b = baseBody(x, y, opts);
  b.shape = "circle"; b.r = r;
  setMassFromArea(b, Math.PI * r * r, MATERIALS[b.material].density);
  if (!b.isStatic) { b.inertia = 0.5 * b.mass * r * r; b.invI = 1 / b.inertia; }
  bodies.push(b);
  return b;
}

function makePoly(x, y, verts, opts) {
  const b = baseBody(x, y, opts);
  b.shape = "poly";
  // ensure CCW ordering (positive shoelace area)
  let area2 = 0;
  for (let i = 0; i < verts.length; i++) {
    const p1 = verts[i], p2 = verts[(i + 1) % verts.length];
    area2 += p1.x * p2.y - p1.y * p2.x;
  }
  if (area2 < 0) verts = verts.slice().reverse();
  // recenter on centroid
  let cx = 0, cy = 0;
  for (const v of verts) { cx += v.x; cy += v.y; }
  cx /= verts.length; cy /= verts.length;
  b.verts = verts.map(v => ({ x: v.x - cx, y: v.y - cy }));
  // outward edge normals
  b.norms = [];
  for (let i = 0; i < b.verts.length; i++) {
    const p1 = b.verts[i], p2 = b.verts[(i + 1) % b.verts.length];
    const ex = p2.x - p1.x, ey = p2.y - p1.y, l = Math.hypot(ex, ey) || 1;
    b.norms.push({ x: ey / l, y: -ex / l });
  }
  // mass & inertia
  let num = 0, den = 0;
  for (let i = 0; i < b.verts.length; i++) {
    const p1 = b.verts[i], p2 = b.verts[(i + 1) % b.verts.length];
    const cr = p1.x * p2.y - p1.y * p2.x;
    num += cr * (p1.x * p1.x + p1.x * p2.x + p2.x * p2.x + p1.y * p1.y + p1.y * p2.y + p2.y * p2.y);
    den += cr;
  }
  const area = den / 2;
  setMassFromArea(b, Math.abs(area), MATERIALS[b.material].density);
  if (!b.isStatic && Math.abs(den) > 1e-9) {
    b.inertia = Math.abs(b.mass / 6 * num / den);
    b.invI = 1 / b.inertia;
  }
  updateWorld(b);
  bodies.push(b);
  return b;
}

function makeBox(x, y, w, h, opts, angle) {
  opts = opts || {};
  if (angle !== undefined && opts.angle === undefined) opts.angle = angle;
  const hw = w / 2, hh = h / 2;
  return makePoly(x, y, [
    { x: hw, y: -hh }, { x: hw, y: hh }, { x: -hw, y: hh }, { x: -hw, y: -hh }
  ], opts);
}

function ngonVerts(r, n) {
  const vs = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + rand(-0.28, 0.28) / n;
    const rr = r * rand(0.78, 1.14);
    vs.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr });
  }
  return vs;
}

function updateWorld(b) {
  const c = Math.cos(b.angle), s = Math.sin(b.angle);
  const vs = b.verts, n = vs.length;
  if (!b.wv) { b.wv = new Array(n); b.wn = new Array(n); for (let i = 0; i < n; i++) { b.wv[i] = { x: 0, y: 0 }; b.wn[i] = { x: 0, y: 0 }; } }
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (let i = 0; i < n; i++) {
    const v = vs[i], wx = b.px + v.x * c - v.y * s, wy = b.py + v.x * s + v.y * c;
    b.wv[i].x = wx; b.wv[i].y = wy;
    if (wx < minx) minx = wx; if (wx > maxx) maxx = wx;
    if (wy < miny) miny = wy; if (wy > maxy) maxy = wy;
  }
  for (let i = 0; i < n; i++) {
    const nm = b.norms[i];
    b.wn[i].x = nm.x * c - nm.y * s;
    b.wn[i].y = nm.x * s + nm.y * c;
  }
  b.aabb.x0 = minx; b.aabb.y0 = miny; b.aabb.x1 = maxx; b.aabb.y1 = maxy;
}

/* ---------------- scene ---------------- */
function addStaticBox(x, y, w, h, angle) {
  return makeBox(x, y, w, h, { isStatic: true, material: "normal", friction: 0.55 }, angle || 0);
}
function addStaticCircle(x, y, r) {
  return makeCircle(x, y, r, { isStatic: true, material: "normal", friction: 0.4 });
}

function rebuildWalls() {
  for (let i = bodies.length - 1; i >= 0; i--) if (bodies[i].wall) bodies.splice(i, 1);
  const T = 120, TOP = -2500, EXT = 2600;
  makeBox(W / 2, H + T / 2 - 2, W + T * 2, T, { isStatic: true, wall: true, friction: 0.55 });          // floor
  makeBox(-T / 2 + 2, (TOP + H) / 2, T, H - TOP + EXT, { isStatic: true, wall: true, friction: 0.4 });  // left
  makeBox(W + T / 2 - 2, (TOP + H) / 2, T, H - TOP + EXT, { isStatic: true, wall: true, friction: 0.4 });// right
  makeBox(W / 2, TOP - T / 2, W + T * 2, T, { isStatic: true, wall: true, friction: 0.4 });              // ceiling
  wakeAll();
}

function pyramid(cx, baseY, rows, size) {
  for (let r = 0; r < rows; r++) {
    const count = rows - r;
    const y = baseY - size / 2 - r * (size + 3);
    const startX = cx - ((count - 1) * (size + 6)) / 2;
    for (let i = 0; i < count; i++)
      makeBox(startX + i * (size + 6), y, size, size, { material: "normal" });
  }
}

function buildScene() {
  bodies.length = 0; grab = null;
  rebuildWalls();

  // left: platform + box pyramid
  const pw = clamp(W * 0.30, 190, 430);
  const py = H * 0.68;
  addStaticBox(W * 0.20, py, pw, 16);
  pyramid(W * 0.20, py - 8, 4, clamp(pw * 0.105, 22, 34));

  // center: peg field
  const cxp = W * 0.52, spacing = clamp(W * 0.052, 44, 78);
  for (let r = 0; r < 4; r++) {
    const cnt = r % 2 === 0 ? 5 : 4;
    const y = H * 0.24 + r * spacing * 0.92;
    for (let i = 0; i < cnt; i++) {
      const x = cxp + (i - (cnt - 1) / 2) * spacing + (r % 2 ? spacing * 0.5 : 0);
      if (x > W * 0.62 || x < W * 0.36) continue;
      addStaticCircle(x, y, 8.5);
    }
  }

  // right: ramp funneling into a basket
  addStaticBox(W * 0.74, H * 0.36, clamp(W * 0.22, 150, 360), 14, 0.28);
  const bw = clamp(W * 0.15, 120, 210);
  const bx = W * 0.88, by = H - 64;
  addStaticBox(bx, by, bw, 14);
  addStaticBox(bx - bw / 2 - 6, by - 46, 12, 88, 0.5);

  // seed bodies: an opening cascade
  spawnShape({ x: W * 0.52, y: H * 0.06, r: 20, mat: "bouncy", kind: "circle", vx: 30, vy: 140 });
  spawnShape({ x: W * 0.30, y: H * 0.12, r: 22, mat: "normal", kind: "circle", vx: 70, vy: 0 });
  spawnShape({ x: W * 0.60, y: H * 0.05, r: 17, mat: "normal", kind: "circle", vx: -150, vy: 0 });
  spawnShape({ x: W * 0.78, y: H * 0.08, r: 26, mat: "heavy", kind: "circle", vx: 0, vy: 60 });
  spawnShape({ x: W * 0.44, y: H * 0.02, r: 24, mat: "normal", kind: "poly", vx: -40, vy: 0 });
  spawnShape({ x: W * 0.36, y: H * 0.03, r: 21, mat: "normal", kind: "box", vx: 110, vy: 0 });
}

function spawnShape(o) {
  let kind = o.kind || toolShape;
  if (kind === "mixed") kind = pick(["circle", "box", "poly"]);
  const r = clamp(o.r || spawnSize, 8, 90);
  const opts = {
    material: o.mat || toolMaterial,
    vx: clamp(o.vx || 0, -1500, 1500),
    vy: clamp(o.vy || 0, -1500, 1500),
    av: rand(-3, 3),
    angle: rand(0, TAU),
  };
  let b;
  if (kind === "circle") b = makeCircle(o.x, o.y, r, opts);
  else if (kind === "box") b = makeBox(o.x, o.y, r * 2, r * 2, opts);
  else b = makePoly(o.x, o.y, ngonVerts(r, 3 + ((Math.random() * 4) | 0)), opts);
  enforceCap();
  return b;
}

function enforceCap() {
  let dyn = 0;
  for (const b of bodies) if (!b.isStatic) dyn++;
  while (dyn > MAX_DYN) {
    let removed = false;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (!b.isStatic && (!grab || grab.body !== b)) {
        bodies.splice(i, 1); dyn--; removed = true; break;
      }
    }
    if (!removed) break;
  }
}

function removeBody(b, silent) {
  const i = bodies.indexOf(b);
  if (i < 0) return;
  bodies.splice(i, 1);
  if (grab && grab.body === b) grab = null;
  if (!silent && !b.isStatic) popParticles(b);
  if (b.isStatic) wakeAll();
}

function wakeAll() { for (const b of bodies) { b.asleep = false; b.sleepT = 0; } }

/* ---------------- effects ---------------- */
const particles = [];   // {x,y,vx,vy,t,life,size,color}
const shockwaves = [];  // {x,y,t,dur,r0,r1}

function addSparks(x, y, n, color, speed, dirX, dirY) {
  for (let i = 0; i < n; i++) {
    const a = Math.atan2(dirY || -1, dirX || 0) + rand(-0.9, 0.9);
    const sp = speed * rand(0.4, 1.3);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      t: 0, life: rand(0.25, 0.6), size: rand(1.4, 3.2), color,
    });
  }
}
function popParticles(b) {
  const c = b.isStatic ? "#7f93b8" : b.fill;
  for (let i = 0; i < 8; i++) {
    const a = rand(0, TAU), sp = rand(60, 260);
    particles.push({ x: b.px, y: b.py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: rand(0.3, 0.55), size: rand(1.5, 3.4), color: c });
  }
}
function explode(x, y) {
  const R = 240, POWER = 1050;
  shockwaves.push({ x, y, t: 0, dur: 0.5, r0: 12, r1: R * 1.05 });
  addSparks(x, y, 26, "#ffd9a0", 520);
  addSparks(x, y, 10, "#8ff5e0", 300);
  for (const b of bodies) {
    if (b.isStatic) continue;
    const dx = b.px - x, dy = b.py - y;
    const d = Math.hypot(dx, dy);
    if (d > R || d < 0.001) continue;
    b.asleep = false; b.sleepT = 0;
    const fall = 1 - d / R;
    const mag = POWER * fall * rand(0.85, 1.2);
    b.vx += (dx / d) * mag;
    b.vy += (dy / d) * mag;
    b.av += rand(-7, 7) * fall;
  }
}

/* ---------------- collision detection ---------------- */
function circleCircle(a, b) {
  const dx = b.px - a.px, dy = b.py - a.py;
  const r = a.r + b.r, d2 = dx * dx + dy * dy;
  if (d2 >= r * r) return null;
  const d = Math.sqrt(d2) || 0.0001;
  const nx = dx / d, ny = dy / d;
  const depth = r - d;
  return {
    a, b, nx, ny,
    points: [{ px: a.px + nx * (a.r - depth * 0.5), py: a.py + ny * (a.r - depth * 0.5), depth, id: "c" }],
  };
}

function circlePoly(c, p) {
  // circle is A, poly is B; normal points from circle toward poly
  const vs = p.wv, ns = p.wn, n = vs.length;
  let best = -Infinity, bi = 0;
  for (let i = 0; i < n; i++) {
    const s = ns[i].x * (c.px - vs[i].x) + ns[i].y * (c.py - vs[i].y);
    if (s > best) { best = s; bi = i; }
  }
  if (best > c.r) return null;
  const v1 = vs[bi], v2 = vs[(bi + 1) % n];
  const ex = v2.x - v1.x, ey = v2.y - v1.y;
  const el2 = ex * ex + ey * ey || 1;
  const t = clamp(((c.px - v1.x) * ex + (c.py - v1.y) * ey) / el2, 0, 1);
  const qx = v1.x + ex * t, qy = v1.y + ey * t;
  if (best < 0) { // center inside the polygon
    const nx = -ns[bi].x, ny = -ns[bi].y;
    return {
      a: c, b: p, nx, ny,
      points: [{ px: c.px - ns[bi].x * best, py: c.py - ns[bi].y * best, depth: c.r - best, id: "f" + bi }],
    };
  }
  const dx = c.px - qx, dy = c.py - qy;
  const d = Math.hypot(dx, dy);
  if (d < 0.0001) {
    return { a: c, b: p, nx: -ns[bi].x, ny: -ns[bi].y, points: [{ px: c.px, py: c.py, depth: c.r, id: "f" + bi }] };
  }
  return {
    a: c, b: p, nx: -dx / d, ny: -dy / d,
    points: [{ px: qx, py: qy, depth: c.r - d, id: "f" + bi }],
  };
}

function findMaxSeparation(A, B) {
  let best = -Infinity, bi = 0;
  for (let i = 0; i < A.wn.length; i++) {
    const n = A.wn[i], v = A.wv[i];
    let minD = Infinity;
    for (let j = 0; j < B.wv.length; j++) {
      const q = B.wv[j];
      const d = n.x * (q.x - v.x) + n.y * (q.y - v.y);
      if (d < minD) minD = d;
    }
    if (minD > best) { best = minD; bi = i; }
  }
  return [best, bi];
}

function clipSeg(pts, nx, ny, offset) {
  // keep points with n.p <= offset; pts has exactly 2 entries
  const out = [];
  const d0 = nx * pts[0].x + ny * pts[0].y - offset;
  const d1 = nx * pts[1].x + ny * pts[1].y - offset;
  if (d0 <= 0) out.push(pts[0]);
  if (d1 <= 0) out.push(pts[1]);
  if (d0 * d1 < 0) {
    const t = d0 / (d0 - d1);
    out.push({ x: pts[0].x + t * (pts[1].x - pts[0].x), y: pts[0].y + t * (pts[1].y - pts[0].y), id: pts[0].id + "*" + pts[1].id });
  }
  return out;
}

function polyPoly(a, b) {
  const [aSep, aFace] = findMaxSeparation(a, b);
  if (aSep > 0 || a.wv === null || b.wv === null) return null;
  const [bSep, bFace] = findMaxSeparation(b, a);
  if (bSep > 0) return null;
  let ref, inc, refFace, flip;
  if (bSep > aSep + 0.001) { ref = b; inc = a; refFace = bFace; flip = true; }
  else { ref = a; inc = b; refFace = aFace; flip = false; }
  const rn = ref.wn[refFace];
  const rv1 = ref.wv[refFace], rv2 = ref.wv[(refFace + 1) % ref.wv.length];
  // most anti-parallel face on the incident body
  let minD = Infinity, incFace = 0;
  for (let i = 0; i < inc.wn.length; i++) {
    const d = rn.x * inc.wn[i].x + rn.y * inc.wn[i].y;
    if (d < minD) { minD = d; incFace = i; }
  }
  const i1 = incFace, i2 = (incFace + 1) % inc.wv.length;
  let pts = [
    { x: inc.wv[i1].x, y: inc.wv[i1].y, id: "" + i1 },
    { x: inc.wv[i2].x, y: inc.wv[i2].y, id: "" + i2 },
  ];
  let tx = rv2.x - rv1.x, ty = rv2.y - rv1.y;
  const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
  // keep points within the reference-face slab: t.rv1 <= t.p <= t.rv2
  pts = clipSeg(pts, -tx, -ty, -(tx * rv1.x + ty * rv1.y));
  if (pts.length === 0) return null;
  pts = clipSeg(pts, tx, ty, tx * rv2.x + ty * rv2.y);
  if (pts.length === 0) return null;
  const out = [];
  for (const p of pts) {
    const sep = rn.x * (p.x - rv1.x) + rn.y * (p.y - rv1.y);
    if (sep <= 0.05) out.push({ px: p.x, py: p.y, depth: -sep, id: p.id + "@" + refFace });
  }
  if (out.length === 0) return null;
  const nx = flip ? -rn.x : rn.x, ny = flip ? -rn.y : rn.y;
  return { a, b, nx, ny, points: out };
}

function collide(a, b) {
  if (a.shape === "circle" && b.shape === "circle") return circleCircle(a, b);
  if (a.shape === "circle") return circlePoly(a, b);
  if (b.shape === "circle") {
    const m = circlePoly(b, a);
    if (m) { m.a = a; m.b = b; m.nx = -m.nx; m.ny = -m.ny; }
    return m;
  }
  return polyPoly(a, b);
}

/* ---------------- broadphase ---------------- */
const grid = new Map();
function broadphase() {
  grid.clear();
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i], bb = b.aabb;
    if (b.shape === "circle") { bb.x0 = b.px - b.r; bb.y0 = b.py - b.r; bb.x1 = b.px + b.r; bb.y1 = b.py + b.r; }
    const x0 = Math.floor(bb.x0 / CELL), x1 = Math.floor(bb.x1 / CELL);
    const y0 = Math.floor(bb.y0 / CELL), y1 = Math.floor(bb.y1 / CELL);
    for (let cx = x0; cx <= x1; cx++) {
      const rowKey = cx * 131072;
      for (let cy = y0; cy <= y1; cy++) {
        const key = rowKey + cy;
        let arr = grid.get(key);
        if (!arr) { arr = []; grid.set(key, arr); }
        arr.push(i);
      }
    }
  }
  const pairs = [];
  const seen = new Set();
  const tryPair = (i, j) => {
    if (i === j) return;
    const lo = i < j ? i : j, hi = i < j ? j : i;
    const k = lo * 2048 + hi;
    if (seen.has(k)) return;
    seen.add(k);
    pairs.push(lo < hi ? [lo, hi] : [hi, lo]);
  };
  for (const [key, arr] of grid) {
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) tryPair(arr[i], arr[j]);
      const n1 = grid.get(key + 131072);       // (x+1, y)
      const n2 = grid.get(key - 131071);       // (x-1, y+1)
      const n3 = grid.get(key + 1);            // (x,   y+1)
      const n4 = grid.get(key + 131073);       // (x+1, y+1)
      for (const nb of [n1, n2, n3, n4]) {
        if (!nb) continue;
        for (let j = 0; j < nb.length; j++) tryPair(arr[i], nb[j]);
      }
    }
  }
  return pairs;
}

/* ---------------- solver ---------------- */
let impulseCache = new Map(); // "aid|bid|pid" -> {Pn, Pt}

function prepareManifold(m, dt) {
  const a = m.a, b = m.b;
  m.key = a.id + "|" + b.id;
  const e = Math.max(a.e, b.e);
  m.mu = Math.sqrt(a.friction * b.friction);
  m.tx = -m.ny; m.ty = m.nx;
  for (const c of m.points) {
    c.rax = c.px - a.px; c.ray = c.py - a.py;
    c.rbx = c.px - b.px; c.rby = c.py - b.py;
    const rnA = c.rax * m.ny - c.ray * m.nx;
    const rnB = c.rbx * m.ny - c.rby * m.nx;
    c.kn = a.invMass + b.invMass + a.invI * rnA * rnA + b.invI * rnB * rnB;
    const rtA = c.rax * m.ty - c.ray * m.tx;
    const rtB = c.rbx * m.ty - c.rby * m.tx;
    c.kt = a.invMass + b.invMass + a.invI * rtA * rtA + b.invI * rtB * rtB;
    const vax = a.vx - a.av * c.ray, vay = a.vy + a.av * c.rax;
    const vbx = b.vx - b.av * c.rby, vby = b.vy + b.av * c.rbx;
    c.vn0 = (vbx - vax) * m.nx + (vby - vay) * m.ny;
    c.bias = Math.min((BAUM / dt) * Math.max(0, Math.min(c.depth, 18) - SLOP), BIAS_MAX);
    c.bounce = c.vn0 < -REST_VEL ? -e * c.vn0 : 0;
    const w = impulseCache.get(m.key + "|" + c.id);
    c.Pn = w ? w.Pn : 0;
    c.Pt = w ? w.Pt : 0;
  }
  // warm start
  for (const c of m.points) {
    const Px = m.nx * c.Pn + m.tx * c.Pt, Py = m.ny * c.Pn + m.ty * c.Pt;
    a.vx -= Px * a.invMass; a.vy -= Py * a.invMass; a.av -= (c.rax * Py - c.ray * Px) * a.invI;
    b.vx += Px * b.invMass; b.vy += Py * b.invMass; b.av += (c.rbx * Py - c.rby * Px) * b.invI;
  }
}

function solveVelocity(m) {
  const a = m.a, b = m.b;
  const nx = m.nx, ny = m.ny, tx = m.tx, ty = m.ty;
  const imA = a.invMass, imB = b.invMass, iiA = a.invI, iiB = b.invI;
  for (let k = 0; k < m.points.length; k++) {
    const c = m.points[k];
    // normal impulse
    let vax = a.vx - a.av * c.ray, vay = a.vy + a.av * c.rax;
    let vbx = b.vx - b.av * c.rby, vby = b.vy + b.av * c.rbx;
    const vn = (vbx - vax) * nx + (vby - vay) * ny;
    const target = c.bias > c.bounce ? c.bias : c.bounce;
    let dPn = (target - vn) / c.kn;
    const Pn0 = c.Pn;
    let Pn1 = Pn0 + dPn; if (Pn1 < 0) Pn1 = 0;
    dPn = Pn1 - Pn0; c.Pn = Pn1;
    let Px = nx * dPn, Py = ny * dPn;
    a.vx -= Px * imA; a.vy -= Py * imA; a.av -= (c.rax * Py - c.ray * Px) * iiA;
    b.vx += Px * imB; b.vy += Py * imB; b.av += (c.rbx * Py - c.rby * Px) * iiB;
    // friction impulse
    vax = a.vx - a.av * c.ray; vay = a.vy + a.av * c.rax;
    vbx = b.vx - b.av * c.rby; vby = b.vy + b.av * c.rbx;
    const vt = (vbx - vax) * tx + (vby - vay) * ty;
    let dPt = -vt / c.kt;
    const maxF = m.mu * c.Pn;
    const Pt0 = c.Pt;
    let Pt1 = Pt0 + dPt;
    if (Pt1 > maxF) Pt1 = maxF; else if (Pt1 < -maxF) Pt1 = -maxF;
    dPt = Pt1 - Pt0; c.Pt = Pt1;
    Px = tx * dPt; Py = ty * dPt;
    a.vx -= Px * imA; a.vy -= Py * imA; a.av -= (c.rax * Py - c.ray * Px) * iiA;
    b.vx += Px * imB; b.vy += Py * imB; b.av += (c.rbx * Py - c.rby * Px) * iiB;
  }
}

/* ---------------- mouse spring ---------------- */
function applyGrab(dt) {
  const b = grab.body;
  if (b.dead || bodies.indexOf(b) < 0) { grab = null; return; }
  b.asleep = false; b.sleepT = 0;
  const c = Math.cos(b.angle), s = Math.sin(b.angle);
  const rx = grab.ax * c - grab.ay * s, ry = grab.ax * s + grab.ay * c;
  const axp = b.px + rx, ayp = b.py + ry;
  const vax = b.vx - b.av * ry, vay = b.vy + b.av * rx;
  const k = 900, damp = 54;
  const Fx = (mouse.x - axp) * k - vax * damp;
  const Fy = (mouse.y - ayp) * k - vay * damp;
  b.vx = clamp(b.vx + Fx * dt, -2600, 2600);
  b.vy = clamp(b.vy + Fy * dt, -2600, 2600);
  b.av += (rx * Fy - ry * Fx) * b.invI * dt;
  b.av = clamp(b.av, -40, 40);
}

/* ---------------- step ---------------- */
function step(dt) {
  simTime += dt;

  // integrate forces
  for (const b of bodies) {
    if (b.isStatic) continue;
    if (b.asleep) { b.vx = 0; b.vy = 0; b.av = 0; continue; }
    b.vy += gravityY * dt;
    const d = 1 / (1 + dt * 0.12);
    b.vx *= d; b.vy *= d;
    b.av *= 1 / (1 + dt * 0.3);
    if (b.vx > 3200) b.vx = 3200; else if (b.vx < -3200) b.vx = -3200;
    if (b.vy > 3200) b.vy = 3200; else if (b.vy < -3200) b.vy = -3200;
    if (b.shape === "poly") updateWorld(b);
  }
  if (grab) applyGrab(dt);

  // contacts
  const pairs = broadphase();
  const manifolds = [];
  for (const [i, j] of pairs) {
    let a = bodies[i], b = bodies[j];
    if (a.dead || b.dead) continue;
    if (a.id > b.id) { const t = a; a = b; b = t; } // stable pair order
    if ((a.asleep || a.isStatic) && (b.asleep || b.isStatic)) continue;
    // wake sleeping bodies pushed by fast awake ones
    if (a.asleep && !b.isStatic && (b.vx * b.vx + b.vy * b.vy) > 1600) { a.asleep = false; a.sleepT = 0; }
    if (b.asleep && !a.isStatic && (a.vx * a.vx + a.vy * a.vy) > 1600) { b.asleep = false; b.sleepT = 0; }
    if (a.asleep || b.asleep) { // still drowsy: only solve if the other can push
      if (a.asleep && b.asleep) continue;
    }
    const m = collide(a, b);
    if (m) { prepareManifold(m, dt); manifolds.push(m); }
  }

  for (let it = 0; it < ITER; it++)
    for (let m of manifolds) solveVelocity(m);

  // impact sparks
  let sparkBudget = 3;
  for (const m of manifolds) {
    if (sparkBudget <= 0) break;
    for (const c of m.points) {
      if (c.vn0 < -280 && Math.random() < 0.5) {
        addSparks(c.px, c.py, 1 + ((-c.vn0 / 350) | 0), "#ffe9c4", Math.min(-c.vn0 * 0.55, 420), m.nx, m.ny);
        sparkBudget--;
        if (sparkBudget <= 0) break;
      }
    }
  }

  // integrate positions + sleeping
  for (const b of bodies) {
    if (b.isStatic || b.asleep) continue;
    b.px += b.vx * dt; b.py += b.vy * dt; b.angle += b.av * dt;
    const sp2 = b.vx * b.vx + b.vy * b.vy;
    if (sp2 < SLEEP_LIN * SLEEP_LIN && Math.abs(b.av) < SLEEP_ANG) {
      b.sleepT += dt;
      if (b.sleepT > SLEEP_TIME && !(grab && grab.body === b)) b.asleep = true;
    } else b.sleepT = 0;
  }

  // persist impulses for warm starting
  const next = new Map();
  for (const m of manifolds)
    for (const c of m.points)
      if (c.Pn !== 0 || c.Pt !== 0) next.set(m.key + "|" + c.id, { Pn: c.Pn, Pt: c.Pt });
  impulseCache = next;

  // effects
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.vy += gravityY * 0.45 * dt;
    p.vx *= 1 / (1 + dt * 1.5); p.vy *= 1 / (1 + dt * 1.5);
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    shockwaves[i].t += dt;
    if (shockwaves[i].t >= shockwaves[i].dur) shockwaves.splice(i, 1);
  }

  // occasional cleanup of escapees
  if ((stepCount++ % 90) === 0) {
    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      if (b.wall) continue;
      if (b.py < -3200 || b.py > H + 3200 || b.px < -3200 || b.px > W + 3200) removeBody(b, true);
    }
  }
}
let stepCount = 0;

/* ---------------- picking ---------------- */
function pointInBody(x, y, b) {
  if (b.shape === "circle") {
    const dx = x - b.px, dy = y - b.py;
    return dx * dx + dy * dy <= (b.r + 2) * (b.r + 2);
  }
  if (!b.wv) return false;
  for (let i = 0; i < b.wv.length; i++) {
    if (b.wn[i].x * (x - b.wv[i].x) + b.wn[i].y * (y - b.wv[i].y) > 1.5) return false;
  }
  return true;
}
function pickBody(x, y, includeStatic) {
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.wall) continue;
    if (!includeStatic && b.isStatic) continue;
    if (pointInBody(x, y, b)) return b;
  }
  return null;
}

/* ---------------- rendering ---------------- */
function drawBody(b, nowMs) {
  const age = (nowMs - b.bornMs) / 1000;
  const pop = age < 0.16 ? easeOutBack(clamp(age / 0.16, 0, 1)) : 1;
  const asleep = b.asleep;
  ctx.save();
  ctx.translate(b.px, b.py);
  ctx.rotate(b.angle);
  if (pop !== 1) ctx.scale(pop, pop);
  ctx.globalAlpha = (asleep ? 0.55 : 1) * b.alpha;
  if (b.isStatic) {
    ctx.fillStyle = STATIC_FILL;
    ctx.strokeStyle = STATIC_STROKE;
    ctx.lineWidth = 2;
    if (b.shape === "circle") {
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, Math.max(2, b.r * 0.3), 0, TAU);
      ctx.fillStyle = "#46608c"; ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(b.verts[0].x, b.verts[0].y);
      for (let i = 1; i < b.verts.length; i++) ctx.lineTo(b.verts[i].x, b.verts[i].y);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  } else if (b.shape === "circle") {
    if (b.halo && !asleep) {
      ctx.strokeStyle = rgba(b.fill, 0.38);
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(0, 0, b.r + 3.5, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = b.fill;
    ctx.strokeStyle = b.stroke;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath(); ctx.arc(-b.r * 0.32, -b.r * 0.32, b.r * 0.38, 0, TAU); ctx.fill();
  } else {
    if (b.halo && !asleep) {
      ctx.strokeStyle = rgba(b.fill, 0.35);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(b.verts[0].x, b.verts[0].y);
      for (let i = 1; i < b.verts.length; i++) ctx.lineTo(b.verts[i].x, b.verts[i].y);
      ctx.closePath(); ctx.stroke();
    }
    ctx.fillStyle = b.fill;
    ctx.strokeStyle = b.stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.verts[0].x, b.verts[0].y);
    for (let i = 1; i < b.verts.length; i++) ctx.lineTo(b.verts[i].x, b.verts[i].y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (b.material === "heavy") {
      ctx.strokeStyle = "rgba(10,14,22,0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-b.verts[0].x * 0.55, -b.verts[0].y * 0.55);
      ctx.lineTo(b.verts[0].x * 0.55, b.verts[0].y * 0.55);
      ctx.stroke();
    }
  }
  if (grab && grab.body === b) {
    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawOverlays() {
  ctx.save();
  if (tool === "boom") {
    ctx.strokeStyle = "rgba(255,200,140,0.25)";
    ctx.setLineDash([6, 8]);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 240, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (tool === "erase") {
    ctx.strokeStyle = "rgba(255,143,107,0.8)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 14, 0, TAU); ctx.stroke();
  }
  if (mouse.down && tool === "spawn") {
    const dx = mouse.x - mouse.sx, dy = mouse.y - mouse.sy;
    const d = Math.hypot(dx, dy);
    const r = d > 6 ? clamp(d, 12, 70) : spawnSize;
    ctx.strokeStyle = "rgba(94,234,212,0.75)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(mouse.sx, mouse.sy, r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    if (d > 10) {
      const ex = mouse.sx + (dx / d) * r, ey = mouse.sy + (dy / d) * r;
      ctx.strokeStyle = "rgba(94,234,212,0.5)";
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      ctx.fillStyle = "rgba(94,234,212,0.9)";
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 3, 0, TAU); ctx.fill();
    }
  } else if (tool === "spawn" && !mouse.down) {
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, spawnSize, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (mouse.down && tool === "wall") {
    const x0 = Math.min(mouse.sx, mouse.x), x1 = Math.max(mouse.sx, mouse.x);
    const y0 = Math.min(mouse.sy, mouse.y), y1 = Math.max(mouse.sy, mouse.y);
    const horiz = (x1 - x0) > (y1 - y0);
    let rx = x0, ry = y0, rw = x1 - x0, rh = y1 - y0;
    if (horiz) { if (rh < 18) { ry = mouse.sy - 9; rh = 18; } }
    else if (rw < 18) { rx = mouse.sx - 9; rw = 18; }
    ctx.fillStyle = "rgba(94,234,212,0.10)";
    ctx.strokeStyle = "rgba(94,234,212,0.7)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (grab) {
    const b = grab.body;
    const c = Math.cos(b.angle), s = Math.sin(b.angle);
    const ax = b.px + grab.ax * c - grab.ay * s, ay = b.py + grab.ax * s + grab.ay * c;
    ctx.strokeStyle = "rgba(94,234,212,0.65)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#5eead4";
    ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function render(nowMs) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

  // motion streaks
  ctx.lineCap = "round";
  for (const b of bodies) {
    if (b.isStatic || b.asleep) continue;
    const sp2 = b.vx * b.vx + b.vy * b.vy;
    if (sp2 < 250000) continue;
    const wdt = b.shape === "circle" ? b.r * 1.6 : 10;
    ctx.strokeStyle = b.trailColor;
    ctx.lineWidth = wdt;
    ctx.beginPath();
    ctx.moveTo(b.px - b.vx * 0.028, b.py - b.vy * 0.028);
    ctx.lineTo(b.px, b.py);
    ctx.stroke();
  }

  for (const b of bodies) if (b.isStatic) drawBody(b, nowMs);
  for (const b of bodies) if (!b.isStatic) drawBody(b, nowMs);

  // particles + shockwaves (additive)
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const f = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = f * 0.85;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + f * 0.5), 0, TAU); ctx.fill();
  }
  for (const s of shockwaves) {
    const t = s.t / s.dur;
    const ease = 1 - Math.pow(1 - t, 3);
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = "#ffd9a0";
    ctx.lineWidth = 3 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r0 + (s.r1 - s.r0) * ease, 0, TAU); ctx.stroke();
    if (t < 0.25) {
      ctx.globalAlpha = (1 - t / 0.25) * 0.35;
      ctx.fillStyle = "#fff3dd";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r1 * 0.22, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  drawOverlays();
}

/* ---------------- input ---------------- */
const HINTS = {
  spawn: "drag: size + fling &middot; click: drop &middot; scroll: size",
  grab: "drag a body to pull it &mdash; release to throw",
  wall: "drag to build a static platform",
  boom: "click for a blast &mdash; right-click works in any tool",
  erase: "click or sweep over bodies to remove them",
};

function pointerPos(e) { mouse.x = e.clientX; mouse.y = e.clientY; }

canvas.addEventListener("pointerdown", e => {
  pointerPos(e);
  mouse.sx = mouse.x; mouse.sy = mouse.y;
  if (e.button === 2) { explode(mouse.x, mouse.y); return; }
  if (e.button !== 0) return;
  mouse.down = true;
  canvas.setPointerCapture(e.pointerId);
  if (tool === "grab") {
    const b = pickBody(mouse.x, mouse.y, false);
    if (b) {
      const c = Math.cos(b.angle), s = Math.sin(b.angle);
      const dx = mouse.x - b.px, dy = mouse.y - b.py;
      grab = { body: b, ax: dx * c + dy * s, ay: -dx * s + dy * c };
      b.asleep = false; b.sleepT = 0;
      canvas.style.cursor = "grabbing";
    }
  } else if (tool === "boom") {
    explode(mouse.x, mouse.y);
  } else if (tool === "erase") {
    const b = pickBody(mouse.x, mouse.y, true);
    if (b) removeBody(b);
  }
});

canvas.addEventListener("pointermove", e => {
  pointerPos(e);
  if (!mouse.down) return;
  if (tool === "erase") {
    const b = pickBody(mouse.x, mouse.y, true);
    if (b) removeBody(b);
  }
});

canvas.addEventListener("pointerup", e => {
  pointerPos(e);
  if (!mouse.down) return;
  mouse.down = false;
  canvas.style.cursor = cursorForTool();
  if (tool === "spawn") {
    const dx = mouse.x - mouse.sx, dy = mouse.y - mouse.sy;
    const d = Math.hypot(dx, dy);
    const r = d > 6 ? clamp(d, 12, 70) : spawnSize;
    spawnShape({ x: mouse.sx, y: mouse.sy, r, vx: dx * 6.5, vy: dy * 6.5 });
  } else if (tool === "wall") {
    const x0 = Math.min(mouse.sx, mouse.x), x1 = Math.max(mouse.sx, mouse.x);
    const y0 = Math.min(mouse.sy, mouse.y), y1 = Math.max(mouse.sy, mouse.y);
    const w = x1 - x0, h = y1 - y0;
    if (Math.max(w, h) >= 24) {
      if (w > h) makeBox((x0 + x1) / 2, mouse.sy, w, Math.max(h, 18), { isStatic: true, friction: 0.55 });
      else makeBox(mouse.sx, (y0 + y1) / 2, Math.max(w, 18), h, { isStatic: true, friction: 0.55 });
      wakeAll();
    }
  } else if (tool === "grab") {
    grab = null;
  }
});
canvas.addEventListener("pointercancel", () => { mouse.down = false; grab = null; canvas.style.cursor = cursorForTool(); });
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("wheel", e => {
  if (tool !== "spawn" || mouse.down) return;
  e.preventDefault();
  spawnSize = clamp(spawnSize - e.deltaY * 0.03, 12, 70);
  els.sizeRange.value = spawnSize;
  els.sizeOut.textContent = String(Math.round(spawnSize));
}, { passive: false });

function cursorForTool() {
  return tool === "grab" ? "grab" : "crosshair";
}

/* ---------------- UI wiring ---------------- */
const $ = id => document.getElementById(id);
const els = {
  tools: $("tools"), shapes: $("shapes"), mats: $("mats"),
  gravity: $("gravity"), gravityOut: $("gravityOut"),
  timeScale: $("timeScale"), timeOut: $("timeOut"),
  sizeRange: $("sizeRange"), sizeOut: $("sizeOut"),
  pauseBtn: $("pauseBtn"), stepBtn: $("stepBtn"), burstBtn: $("burstBtn"),
  clearBtn: $("clearBtn"), resetBtn: $("resetBtn"),
  hint: $("hint"), stats: $("stats"), toast: $("toast"),
  panel: $("panel"), collapseBtn: $("collapseBtn"), showPanel: $("showPanel"),
};

function setTool(t) {
  tool = t;
  for (const btn of els.tools.querySelectorAll("button"))
    btn.classList.toggle("active", btn.dataset.tool === t);
  els.hint.innerHTML = HINTS[t] || "";
  canvas.style.cursor = cursorForTool();
}
els.tools.addEventListener("click", e => {
  const btn = e.target.closest("button[data-tool]");
  if (btn) { setTool(btn.dataset.tool); btn.blur(); }
});

els.shapes.addEventListener("click", e => {
  const btn = e.target.closest("button[data-shape]");
  if (!btn) return;
  toolShape = btn.dataset.shape;
  for (const b of els.shapes.querySelectorAll("button"))
    b.classList.toggle("active", b === btn);
  btn.blur();
});
els.mats.addEventListener("click", e => {
  const btn = e.target.closest("button[data-mat]");
  if (!btn) return;
  toolMaterial = btn.dataset.mat;
  for (const b of els.mats.querySelectorAll("button"))
    b.classList.toggle("active", b === btn);
  btn.blur();
});

els.gravity.addEventListener("input", () => {
  gravityY = +els.gravity.value;
  if (gravityY !== 0) prevGravity = gravityY;
  els.gravityOut.textContent = String(gravityY);
  wakeAll();
});
els.timeScale.addEventListener("input", () => {
  timeScaleVal = +els.timeScale.value;
  els.timeOut.textContent = timeScaleVal.toFixed(2) + "x";
});
els.sizeRange.addEventListener("input", () => {
  spawnSize = +els.sizeRange.value;
  els.sizeOut.textContent = String(spawnSize);
});

function togglePause() {
  paused = !paused;
  els.pauseBtn.textContent = paused ? "Resume" : "Pause";
  toast(paused ? "Paused" : "Running");
}
function burst() {
  for (let i = 0; i < 26; i++) {
    spawnShape({
      x: rand(W * 0.18, W * 0.82), y: rand(-360, -40),
      r: rand(12, 34), mat: toolMaterial, kind: "mixed",
      vx: rand(-280, 280), vy: rand(0, 160),
    });
  }
  toast("Burst");
}
function clearDynamic() {
  for (let i = bodies.length - 1; i >= 0; i--)
    if (!bodies[i].isStatic) removeBody(bodies[i], true);
  grab = null;
  toast("Dynamic bodies cleared");
}
function clearAll() {
  for (let i = bodies.length - 1; i >= 0; i--)
    if (!bodies[i].wall) removeBody(bodies[i], true);
  grab = null;
  toast("Everything cleared");
}
els.pauseBtn.addEventListener("click", () => { togglePause(); els.pauseBtn.blur(); });
els.stepBtn.addEventListener("click", () => { stepOnce = true; els.stepBtn.blur(); });
els.burstBtn.addEventListener("click", () => { burst(); els.burstBtn.blur(); });
els.clearBtn.addEventListener("click", () => { clearDynamic(); els.clearBtn.blur(); });
els.resetBtn.addEventListener("click", () => { buildScene(); toast("Scene reset"); els.resetBtn.blur(); });

function setPanelHidden(hidden) {
  els.panel.classList.toggle("hidden", hidden);
  els.showPanel.classList.toggle("visible", hidden);
}
els.collapseBtn.addEventListener("click", () => setPanelHidden(true));
els.showPanel.addEventListener("click", () => setPanelHidden(false));

let toastTimer = 0;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1500);
}

window.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "BUTTON" || tag === "TEXTAREA") {
    if (e.key === " " || e.key === "Escape") e.target.blur();
    return;
  }
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "5") {
    setTool(["spawn", "grab", "wall", "boom", "erase"][+k - 1]);
  } else if (k === " ") {
    e.preventDefault(); if (!e.repeat) togglePause();
  } else if (k === "s") {
    if (paused) stepOnce = true;
  } else if (k === "g") {
    if (!e.repeat) {
      if (gravityY !== 0) { prevGravity = gravityY; gravityY = 0; toast("Zero-G ON"); }
      else { gravityY = prevGravity || 1500; toast("Gravity restored"); }
      els.gravity.value = gravityY;
      els.gravityOut.textContent = String(gravityY);
      wakeAll();
    }
  } else if (k === "b") { if (!e.repeat) burst(); }
  else if (k === "c") { if (!e.repeat) clearDynamic(); }
  else if (k === "x" || k === "backspace") { e.preventDefault(); if (!e.repeat) clearAll(); }
  else if (k === "r") { if (!e.repeat) { buildScene(); toast("Scene reset"); } }
  else if (k === "h") { if (!e.repeat) setPanelHidden(!els.panel.classList.contains("hidden")); }
});

/* ---------------- main loop ---------------- */
let last = performance.now(), acc = 0;
let fps = 60, statTimer = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  fps += ((1 / Math.max(dt, 1e-4)) - fps) * 0.06;

  if (!paused) {
    acc += dt * timeScaleVal;
    let n = 0;
    while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
  } else if (stepOnce) {
    step(STEP);
    stepOnce = false;
  }

  render(now);

  statTimer += dt;
  if (statTimer > 0.3) {
    statTimer = 0;
    let asleep = 0, dyn = 0;
    for (const b of bodies) { if (b.isStatic) continue; dyn++; if (b.asleep) asleep++; }
    els.stats.textContent = `${Math.round(fps)} fps \u00b7 ${bodies.length} bodies \u00b7 ${asleep} asleep`;
  }
}

/* ---------------- boot ---------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  buildBackground();
  rebuildWalls();
}
window.addEventListener("resize", resize);

resize();
buildScene();
setTool("spawn");
els.hint.innerHTML = HINTS.spawn;
requestAnimationFrame(frame);

/* test hook (harmless in production) */
window.__kinetic = {
  step, bodies: () => bodies, spawn: spawnShape, explode, scene: buildScene,
  grabById: id => { const b = bodies.find(x => x.id === id); if (b) grab = { body: b, ax: 0, ay: 0 }; },
  release: () => { grab = null; },
  mouseTo: (x, y) => { mouse.x = x; mouse.y = y; },
};
</script>
</body>
</html>
