<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GridGuard — Tower Defense</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b26; --panel2:#1d2532; --line:#2b3547;
    --text:#dce4f2; --muted:#8b98ad; --gold:#ffd35c; --good:#7ed26b; --bad:#e06a5a; --accent:#6ea8ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; background:radial-gradient(1200px 800px at 50% -100px, #1a2233, var(--bg));
    color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:14px; user-select:none;
  }
  #app{width:100%; max-width:1280px; display:flex; flex-direction:column; gap:10px;}
  .topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
  }
  .logo{font-weight:800; letter-spacing:1px; font-size:18px; margin-right:6px;}
  .logo span{color:var(--accent);}
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:14px; font-weight:600;
  }
  .chip .lbl{color:var(--muted); font-weight:500; font-size:12px;}
  .chip.money .val{color:var(--gold);}
  .chip.lives .val{color:var(--bad);}
  .chip.wave .val{color:var(--accent);}
  .spacer{flex:1;}
  button{
    font-family:inherit; font-size:13px; font-weight:600; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:6px 12px; cursor:pointer; transition:background .15s, border-color .15s, transform .05s;
  }
  button:hover:not(:disabled){background:#26303f; border-color:#3a4a61;}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  button.primary{background:#274a7d; border-color:#3b6cb4;}
  button.primary:hover:not(:disabled){background:#2f5a99;}
  button.good{background:#2c5231; border-color:#3f7a48;}
  button.good:hover:not(:disabled){background:#356540;}
  button.bad{background:#5c2d2d; border-color:#8a4444;}
  button.bad:hover:not(:disabled){background:#6d3636;}

  .main{display:flex; gap:10px; align-items:stretch;}
  .canvas-wrap{
    position:relative; flex:1; min-width:0;
    background:#000; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  canvas{display:block; width:100%; height:auto;}

  .panel{
    width:264px; flex-shrink:0; display:flex; flex-direction:column; gap:10px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px;
  }
  .card h3{
    font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:8px;
  }
  .shop{display:flex; flex-direction:column; gap:6px;}
  .shop-item{
    display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px;
    background:var(--panel2); border:1px solid var(--line); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .shop-item:hover{background:#242e3e;}
  .shop-item.sel{border-color:var(--accent); background:#243447;}
  .shop-item.poor{opacity:.55;}
  .swatch{
    width:34px; height:34px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:17px; border:2px solid rgba(255,255,255,.15);
  }
  .shop-item .meta{flex:1; min-width:0;}
  .shop-item .nm{font-weight:700; font-size:13px;}
  .shop-item .ds{font-size:11px; color:var(--muted); margin-top:1px;}
  .shop-item .cost{font-weight:700; color:var(--gold); font-size:13px; white-space:nowrap;}
  .shop-item .cost::after{content:"g"; font-size:10px; opacity:.7;}
  .key{
    display:inline-block; background:#0e131b; border:1px solid var(--line); border-radius:4px;
    font-size:10px; padding:0 4px; margin-left:4px; color:var(--muted);
  }
  .info-body{font-size:12.5px;}
  .info-body .hint{color:var(--muted); line-height:1.5;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin:6px 0;}
  .stat-grid .k{color:var(--muted);}
  .stat-grid .v{font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  .lvl-pips{color:var(--gold); letter-spacing:2px;}
  .btn-row{display:flex; gap:6px; margin-top:8px;}
  .btn-row button{flex:1; padding:6px 4px; font-size:12px;}
  .next-card .row{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .preview{font-size:12px; color:var(--muted); line-height:1.7;}
  .preview b{color:var(--text);}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px;}
  .hotkeys{font-size:11px; color:var(--muted); line-height:1.8;}
  .hotkeys b{color:var(--text); font-weight:600; background:#0e131b; border:1px solid var(--line); border-radius:4px; padding:0 5px;}

  #toast{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    background:rgba(10,14,20,.92); border:1px solid var(--line); color:var(--text);
    padding:7px 16px; border-radius:8px; font-size:13px; font-weight:600;
    opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
  }
  #vignette{
    position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .5s;
    box-shadow:inset 0 0 90px 30px rgba(220,60,40,.55); border-radius:12px;
  }
  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(8,11,17,.78); backdrop-filter:blur(3px); z-index:5;
  }
  #overlay.hidden{display:none;}
  .ov-card{
    text-align:center; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:28px 34px; max-width:440px; box-shadow:0 18px 60px rgba(0,0,0,.5);
  }
  .ov-card h1{font-size:26px; margin-bottom:10px; letter-spacing:1px;}
  .ov-card h1.win{color:var(--good);} .ov-card h1.lose{color:var(--bad);}
  .ov-card p{color:var(--muted); font-size:13.5px; line-height:1.7; margin-bottom:14px;}
  .ov-card .stats{font-size:14px; margin-bottom:16px; line-height:1.9;}
  .ov-card .stats b{color:var(--gold);}
  .ov-card button{font-size:15px; padding:10px 26px;}
  @media (max-width:900px){ .main{flex-direction:column;} .panel{width:100%;} }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">GRID<span>GUARD</span></div>
    <div class="chip money"><span class="lbl">Gold</span><span class="val" id="uiMoney">0</span></div>
    <div class="chip lives"><span class="lbl">Lives</span><span class="val" id="uiLives">0</span></div>
    <div class="chip wave"><span class="lbl">Wave</span><span class="val" id="uiWave">0/20</span></div>
    <div class="chip"><span class="lbl">Score</span><span class="val" id="uiScore">0</span></div>
    <div class="chip"><span class="lbl">Best</span><span class="val" id="uiBest">0</span></div>
    <div class="spacer"></div>
    <button id="btnPause">Pause</button>
    <button id="btnSpeed">1×</button>
    <button id="btnSound">Sound: on</button>
  </div>
  <div class="main">
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
      <div id="vignette"></div>
      <div id="toast"></div>
      <div id="overlay"><div class="ov-card" id="ovCard"></div></div>
    </div>
    <div class="panel">
      <div class="card">
        <h3>Build</h3>
        <div class="shop" id="shop"></div>
      </div>
      <div class="card">
        <h3>Tower</h3>
        <div class="info-body" id="info"></div>
      </div>
      <div class="card next-card">
        <h3>Waves</h3>
        <div class="preview" id="preview"></div>
        <div class="row">
          <button class="primary" id="btnNext" style="flex:1">Start wave</button>
        </div>
      </div>
      <div class="card">
        <h3>Hotkeys</h3>
        <div class="hotkeys">
          <b>1-4</b> pick tower &nbsp; <b>Esc</b> cancel<br>
          <b>U</b> upgrade &nbsp; <b>X</b> sell &nbsp; <b>N</b> next wave<br>
          <b>Space</b> pause &nbsp; right-click deselect
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================== CONSTANTS ============================== */
const COLS = 20, ROWS = 13, CELL = 48, W = COLS * CELL, H = ROWS * CELL, MAX_WAVE = 20;

const WAYPOINTS = [[-1,1],[2,1],[2,10],[6,10],[6,4],[10,4],[10,9],[14,9],[14,2],[20,2]];

const TOWER_ORDER = ["arrow","cannon","frost","tesla"];
const TOWER_TYPES = {
  arrow:  { name:"Archer", icon:"➤", color:"#7ed26b", desc:"Fast single-target shots",
            levels:[{cost:50,dmg:9,range:115,rate:2.6},
                    {cost:60,dmg:15,range:125,rate:3.1},
                    {cost:90,dmg:24,range:138,rate:3.8}] },
  cannon: { name:"Cannon", icon:"◉", color:"#e0a458", desc:"Slow splash damage",
            levels:[{cost:100,dmg:26,range:120,rate:0.8,splash:52},
                    {cost:110,dmg:46,range:130,rate:0.95,splash:62},
                    {cost:160,dmg:80,range:142,rate:1.1,splash:74}] },
  frost:  { name:"Frost", icon:"❄", color:"#7cc7ff", desc:"Chills and slows enemies",
            levels:[{cost:70,dmg:4,range:105,rate:1.3,slow:0.42,slowDur:1.6},
                    {cost:80,dmg:7,range:115,rate:1.5,slow:0.50,slowDur:1.9},
                    {cost:120,dmg:11,range:126,rate:1.7,slow:0.58,slowDur:2.2}] },
  tesla:  { name:"Tesla", icon:"⚡", color:"#c59bff", desc:"Chain lightning arcs",
            levels:[{cost:150,dmg:16,range:95,rate:1.1,chain:2},
                    {cost:170,dmg:26,range:105,rate:1.3,chain:3},
                    {cost:240,dmg:40,range:116,rate:1.5,chain:4}] }
};

const ENEMY_TYPES = {
  grunt:  { name:"Grunt", hp:42,  speed:56,  radius:12, reward:8,   color:"#7ed26b", dark:"#3f7a35", armor:0, leak:1 },
  runner: { name:"Runner",hp:26,  speed:112, radius:9,  reward:7,   color:"#ffd35c", dark:"#a8842a", armor:0, leak:1 },
  tank:   { name:"Tank",  hp:170, speed:34,  radius:15, reward:18,  color:"#d06a5a", dark:"#8a3f34", armor:4, leak:2 },
  boss:   { name:"Boss",  hp:950, speed:26,  radius:20, reward:130, color:"#b06ae0", dark:"#6d3b96", armor:6, leak:4, boss:true }
};

/* ============================== PATH ============================== */
const pathPts = WAYPOINTS.map(p => ({x:(p[0]+0.5)*CELL, y:(p[1]+0.5)*CELL}));
const segments = [];
let pathLen = 0;
for (let i = 0; i < pathPts.length - 1; i++){
  const a = pathPts[i], b = pathPts[i+1];
  const len = Math.hypot(b.x-a.x, b.y-a.y);
  segments.push({a, b, len, start:pathLen, ang:Math.atan2(b.y-a.y, b.x-a.x)});
  pathLen += len;
}
function posAt(d){
  if (d <= 0){ const s = segments[0]; return {x:s.a.x + d*Math.cos(s.ang), y:s.a.y + d*Math.sin(s.ang), a:s.ang}; }
  if (d >= pathLen){ const s = segments[segments.length-1]; const e = d - pathLen;
    return {x:s.b.x + e*Math.cos(s.ang), y:s.b.y + e*Math.sin(s.ang), a:s.ang}; }
  for (const s of segments){
    if (d <= s.start + s.len){
      const t = (d - s.start) / s.len;
      return {x:s.a.x + (s.b.x-s.a.x)*t, y:s.a.y + (s.b.y-s.a.y)*t, a:s.ang};
    }
  }
  const s = segments[segments.length-1];
  return {x:s.b.x, y:s.b.y, a:s.ang};
}
const pathSet = new Set();
for (let i = 0; i < WAYPOINTS.length - 1; i++){
  let [c,r] = WAYPOINTS[i]; const [c2,r2] = WAYPOINTS[i+1];
  const dc = Math.sign(c2-c), dr = Math.sign(r2-r);
  pathSet.add(c+","+r);
  while (c !== c2 || r !== r2){ c += dc; r += dr; pathSet.add(c+","+r); }
}

/* ============================== STATE ============================== */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);

let money, lives, wave, score, kills, state, countdown, speed, paused;
let enemies, towers, projectiles, particles, texts, effects, spawnQueue, waveTime;
let shopSel, selectedTower, hoverCell, mouse;
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem("gridguard-best") || "0", 10) || 0; } catch(e){}

const occupied = new Map();
const cellKey = (c,r) => c+","+r;

/* ============================== UTILS ============================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const dist2 = (ax,ay,bx,by) => { const dx=ax-bx, dy=ay-by; return dx*dx + dy*dy; };
const rand = (a,b) => a + Math.random()*(b-a);
function angLerp(a,b,t){ let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return a + d*t; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function roundRectPath(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function hpMul(w){ return 1 + 0.14*(w-1) + Math.max(0, w-10)*0.12; }
function spdMul(w){ return 1 + 0.008*(w-1); }

/* ============================== AUDIO ============================== */
const Sound = {
  ctx:null, muted:false, last:{}, noiseBuf:null,
  ensure(){
    if (!this.ctx){
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        const len = this.ctx.sampleRate * 0.35 | 0;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      } catch(e){ this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, freq2, dur, type, vol){
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freq2) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq2), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur, vol, freq){
    if (this.muted || !this.ctx || !this.noiseBuf) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.ctx.destination);
    s.start(t); s.stop(t+dur);
  },
  play(kind){
    if (this.muted || !this.ctx) return;
    const now = performance.now(), gap = kind === "shoot" ? 55 : 35;
    if (this.last[kind] && now - this.last[kind] < gap) return;
    this.last[kind] = now;
    switch(kind){
      case "shoot":  this.tone(620, 240, 0.07, "square", 0.05); break;
      case "boom":   this.noise(0.28, 0.16, 700); this.tone(120, 40, 0.25, "sine", 0.12); break;
      case "zap":    this.tone(980, 140, 0.12, "sawtooth", 0.06); break;
      case "freeze": this.tone(1250, 420, 0.12, "sine", 0.06); break;
      case "die":    this.tone(300, 70, 0.16, "triangle", 0.08); break;
      case "build":  this.tone(420, 640, 0.09, "square", 0.07); break;
      case "upgrade":[440,660,880].forEach((f,i)=>setTimeout(()=>this.tone(f,f,0.09,"square",0.06), i*70)); break;
      case "sell":   this.tone(520, 220, 0.14, "square", 0.06); break;
      case "leak":   this.tone(180, 60, 0.35, "sawtooth", 0.12); break;
      case "wave":   this.tone(330, 330, 0.1, "square", 0.06); setTimeout(()=>this.tone(440,440,0.12,"square",0.06),110); break;
      case "lose":   [400,300,200,120].forEach((f,i)=>setTimeout(()=>this.tone(f,f*0.8,0.25,"sawtooth",0.09), i*180)); break;
      case "win":    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,f,0.22,"square",0.07), i*140)); break;
    }
  }
};

/* ============================== BACKGROUND ============================== */
const bgCanvas = document.createElement("canvas");
bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
(function renderStatic(){
  const c = bgCanvas.getContext("2d");
  c.scale(DPR, DPR);
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#1d3020"); g.addColorStop(1, "#152119");
  c.fillStyle = g; c.fillRect(0,0,W,H);
  // checker cells
  for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++){
    if ((i+j) % 2 === 0){ c.fillStyle = "rgba(255,255,255,0.022)"; c.fillRect(i*CELL, j*CELL, CELL, CELL); }
  }
  // faint grid
  c.strokeStyle = "rgba(0,0,0,0.10)"; c.lineWidth = 1;
  for (let i = 1; i < COLS; i++){ c.beginPath(); c.moveTo(i*CELL+0.5, 0); c.lineTo(i*CELL+0.5, H); c.stroke(); }
  for (let j = 1; j < ROWS; j++){ c.beginPath(); c.moveTo(0, j*CELL+0.5); c.lineTo(W, j*CELL+0.5); c.stroke(); }
  // decorations on non-path cells (deterministic)
  const rnd = mulberry32(20260823);
  for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++){
    if (pathSet.has(i+","+j)) continue;
    const x = i*CELL + CELL/2, y = j*CELL + CELL/2, r = rnd();
    if (r < 0.13){ // bush
      c.fillStyle = "#2a4a2d";
      for (let k = 0; k < 3; k++){
        c.beginPath();
        c.arc(x + rand2(rnd,-9,9), y + rand2(rnd,-8,8), rand2(rnd,4,7), 0, Math.PI*2);
        c.fill();
      }
      c.fillStyle = "rgba(255,255,255,0.06)";
      c.beginPath(); c.arc(x-4, y-5, 3, 0, Math.PI*2); c.fill();
    } else if (r < 0.18){ // rock
      c.fillStyle = "#46505f";
      c.beginPath();
      c.moveTo(x-7, y+5); c.lineTo(x-4, y-6); c.lineTo(x+5, y-5); c.lineTo(x+8, y+4); c.closePath();
      c.fill();
      c.fillStyle = "rgba(255,255,255,0.08)";
      c.beginPath(); c.moveTo(x-4, y-6); c.lineTo(x+5, y-5); c.lineTo(x+1, y); c.closePath(); c.fill();
    } else if (r < 0.26){ // flowers
      for (let k = 0; k < 3; k++){
        c.fillStyle = k % 2 ? "#d6e08a" : "#d98ba0";
        c.beginPath(); c.arc(x + rand2(rnd,-14,14), y + rand2(rnd,-14,14), 1.6, 0, Math.PI*2); c.fill();
      }
    }
  }
  // road
  const road = new Path2D();
  road.moveTo(pathPts[0].x, pathPts[0].y);
  for (let i = 1; i < pathPts.length; i++) road.lineTo(pathPts[i].x, pathPts[i].y);
  c.lineJoin = "round"; c.lineCap = "round";
  c.strokeStyle = "#1f2630"; c.lineWidth = CELL + 2; c.stroke(road);
  c.strokeStyle = "#3a4350"; c.lineWidth = CELL - 4; c.stroke(road);
  c.strokeStyle = "rgba(255,255,255,0.045)"; c.lineWidth = CELL - 20; c.stroke(road);
  // subtle cracks
  c.strokeStyle = "rgba(0,0,0,0.12)"; c.lineWidth = 1.5;
  for (let k = 0; k < 40; k++){
    const d = rnd()*pathLen, p = posAt(d);
    c.beginPath(); c.moveTo(p.x + rand2(rnd,-14,14), p.y + rand2(rnd,-14,14));
    c.lineTo(p.x + rand2(rnd,-14,14), p.y + rand2(rnd,-14,14)); c.stroke();
  }
  // entrance marker
  const ent = posAt(26);
  c.fillStyle = "#7ed26b"; c.font = "700 11px system-ui"; c.textAlign = "center";
  c.fillText("SPAWN", ent.x + 4, ent.y - 26);
  // exit portal
  const exit = segments[segments.length-1].b;
  for (let k = 4; k >= 1; k--){
    c.fillStyle = k % 2 ? "rgba(176,106,224,"+(0.18 + 0.1*k)+")" : "rgba(120,60,180,"+(0.15 + 0.1*k)+")";
    c.beginPath(); c.arc(exit.x - 8, exit.y, 6 + k*4.5, 0, Math.PI*2); c.fill();
  }
  c.fillStyle = "#e6ccff"; c.font = "700 11px system-ui";
  c.fillText("CORE", exit.x - 10, exit.y - 34);
})();
function rand2(rnd, a, b){ return a + rnd()*(b-a); }

/* ============================== WAVES ============================== */
function buildWaveGroups(w){
  const g = [];
  g.push({type:"grunt", count:6 + Math.floor(w*1.4), gap:0.9, delay:1});
  if (w >= 2) g.push({type:"runner", count:2 + Math.floor(w*0.8), gap:0.5, delay:6});
  if (w >= 3) g.push({type:"tank", count:1 + Math.floor((w-3)/2), gap:2.4, delay:10});
  if (w >= 4 && w % 2 === 0) g.push({type:"runner", count:4 + w, gap:0.35, delay:16});
  if (w % 5 === 0) g.push({type:"boss", count:Math.floor(w/5), gap:5, delay:3});
  return g;
}

/* ============================== ENTITIES ============================== */
function spawnEnemy(type){
  const def = ENEMY_TYPES[type];
  const hm = hpMul(wave);
  enemies.push({
    type, def, dist:0, x:pathPts[0].x, y:pathPts[0].y, a:0,
    hp:def.hp*hm, maxHp:def.hp*hm, speed:def.speed*spdMul(wave),
    radius:def.radius, armor:def.armor, reward:def.reward + Math.floor(wave/3),
    slowT:0, slowF:0, hitT:0, dead:false
  });
}
function makeTower(type, c, r){
  const lv = TOWER_TYPES[type].levels[0];
  towers.push({type, c, r, x:(c+0.5)*CELL, y:(r+0.5)*CELL, level:0, cd:0, aim:-Math.PI/2, spent:lv.cost, flash:0});
  occupied.set(cellKey(c,r), towers[towers.length-1]);
}
function curLevel(t){ return TOWER_TYPES[t.type].levels[t.level]; }

/* ============================== COMBAT ============================== */
function acquireTarget(t, range){
  let best = null, r2 = range*range;
  for (const e of enemies){
    if (e.dead) continue;
    if (dist2(t.x, t.y, e.x, e.y) <= r2){ if (!best || e.dist > best.dist) best = e; }
  }
  return best;
}
function damage(e, amt){
  if (e.dead) return;
  e.hp -= Math.max(1, amt - e.armor);
  e.hitT = 0.08;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  money += e.reward; score += e.reward + wave; kills++;
  texts.push({x:e.x, y:e.y - 14, txt:"+"+e.reward, color:"#ffd35c", life:0.9, vy:-34});
  for (let i = 0; i < (e.def.boss ? 26 : 12); i++){
    const a = rand(0, Math.PI*2), s = rand(30, e.def.boss ? 220 : 150);
    particles.push({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.35,0.7), max:0.7, size:rand(2,4.5), color:e.def.color});
  }
  if (e.def.boss){ effects.push({kind:"ring", x:e.x, y:e.y, r0:10, r1:90, life:0.5, max:0.5, color:"#b06ae0"}); }
  Sound.play("die");
}
function fireTower(t, tgt, L){
  const tipX = t.x + Math.cos(t.aim)*16, tipY = t.y + Math.sin(t.aim)*16;
  t.flash = 0.07;
  if (t.type === "arrow"){
    projectiles.push({kind:"arrow", x:tipX, y:tipY, target:tgt, tx:tgt.x, ty:tgt.y, speed:430, dmg:L.dmg, ang:t.aim});
    Sound.play("shoot");
  } else if (t.type === "cannon"){
    projectiles.push({kind:"ball", x:tipX, y:tipY, target:tgt, tx:tgt.x, ty:tgt.y, speed:250, dmg:L.dmg, splash:L.splash, ang:t.aim});
    Sound.play("shoot");
  } else if (t.type === "frost"){
    projectiles.push({kind:"shard", x:tipX, y:tipY, target:tgt, tx:tgt.x, ty:tgt.y, speed:320, dmg:L.dmg, slow:L.slow, slowDur:L.slowDur, ang:t.aim});
    Sound.play("freeze");
  } else if (t.type === "tesla"){
    fireTesla(t, tgt, L);
  }
}
function fireTesla(t, tgt, L){
  const hops = [];
  let from = {x:t.x, y:t.y - 10};
  const hitSet = new Set();
  let cur = tgt, dmg = L.dmg;
  for (let i = 0; i < L.chain && cur; i++){
    hitSet.add(cur);
    damage(cur, dmg);
    cur.hitT = 0.1;
    hops.push(jitterPoints(from.x, from.y, cur.x, cur.y));
    from = cur;
    dmg *= 0.8;
    let next = null, bd = 95*95;
    for (const e of enemies){
      if (e.dead || hitSet.has(e)) continue;
      const d = dist2(from.x, from.y, e.x, e.y);
      if (d <= bd){ bd = d; next = e; }
    }
    cur = next;
  }
  effects.push({kind:"zap", hops, life:0.14, max:0.14});
  Sound.play("zap");
}
function jitterPoints(x1,y1,x2,y2){
  const pts = [[x1,y1]];
  const n = 4;
  for (let i = 1; i < n; i++){
    const t = i/n;
    const nx = x1 + (x2-x1)*t, ny = y1 + (y2-y1)*t;
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
    const off = rand(-9,9);
    pts.push([nx + (-dy/len)*off, ny + (dx/len)*off]);
  }
  pts.push([x2,y2]);
  return pts;
}
function hitProjectile(p){
  if (p.kind === "arrow"){
    if (p.target && !p.target.dead){ damage(p.target, p.dmg); spark(p.tx, p.ty, "#ffe9a0", 4); }
  } else if (p.kind === "ball"){
    explode(p.tx, p.ty, p.dmg, p.splash);
  } else if (p.kind === "shard"){
    if (p.target && !p.target.dead){
      p.target.slowT = Math.max(p.target.slowT, p.slowDur);
      p.target.slowF = Math.max(p.target.slowF, p.slow);
      damage(p.target, p.dmg);
    }
    spark(p.tx, p.ty, "#bfe4ff", 6);
  }
}
function explode(x, y, dmg, radius){
  Sound.play("boom");
  effects.push({kind:"ring", x, y, r0:8, r1:radius, life:0.3, max:0.3, color:"#ffb066"});
  for (let i = 0; i < 14; i++){
    const a = rand(0, Math.PI*2), s = rand(40, 190);
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.25,0.55), max:0.55, size:rand(2,5), color:i%2?"#ffb066":"#8a5a30"});
  }
  for (const e of enemies){
    if (e.dead) continue;
    const d = Math.sqrt(dist2(x,y,e.x,e.y));
    if (d <= radius + e.radius){
      const fall = 1 - 0.5 * clamp((d - e.radius)/radius, 0, 1);
      damage(e, dmg * fall);
    }
  }
}
function spark(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = rand(0, Math.PI*2), s = rand(20, 110);
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.15,0.35), max:0.35, size:rand(1.5,3), color});
  }
}
function leakEnemy(e){
  e.dead = true;
  lives -= e.def.leak;
  Sound.play("leak");
  texts.push({x:e.x - 30, y:e.y, txt:"-"+e.def.leak+" ♥", color:"#ff6a5a", life:1.0, vy:-24});
  effects.push({kind:"ring", x:e.x, y:e.y, r0:6, r1:40, life:0.35, max:0.35, color:"#ff5a4a"});
  const v = $("vignette");
  v.style.transition = "none"; v.style.opacity = "1";
  requestAnimationFrame(()=>{ v.style.transition = "opacity .5s"; v.style.opacity = "0"; });
  if (lives <= 0){ lives = 0; gameOver(); }
}

/* ============================== FLOW ============================== */
function startWave(){
  state = "wave"; waveTime = 0; spawnQueue = [];
  const groups = buildWaveGroups(wave);
  for (const g of groups)
    for (let i = 0; i < g.count; i++)
      spawnQueue.push({t:g.delay + i*g.gap, type:g.type, done:false});
  spawnQueue.sort((a,b)=>a.t-b.t);
  if (wave % 5 === 0) announce("WAVE "+wave, "⚠ Boss incoming"); else announce("WAVE "+wave, "Defend the core");
  Sound.play("wave");
  refreshNextBtn();
}
function waveCleared(){
  const bonus = 25 + wave*8;
  money += bonus; score += bonus;
  texts.push({x:W/2, y:H/2 - 40, txt:"+"+bonus+"g", color:"#ffd35c", life:1.4, vy:-30});
  if (wave >= MAX_WAVE){ victory(); return; }
  announce("WAVE "+wave+" CLEARED", "+"+bonus+"g bonus");
  wave++;
  state = "intermission"; countdown = 12;
  updatePreview();
  refreshNextBtn();
}
function callWaveEarly(){
  if (state !== "intermission") return;
  const bonus = Math.floor(countdown) * 3;
  if (bonus > 0){
    money += bonus;
    toast("Early call bonus: +"+bonus+"g");
  }
  startWave();
}
function gameOver(){
  state = "over";
  finishGame(false);
}
function victory(){
  state = "won";
  finishGame(true);
}
function finishGame(won){
  Sound.play(won ? "win" : "lose");
  let best = false;
  if (score > bestScore){ bestScore = score; best = true; try { localStorage.setItem("gridguard-best", String(score)); } catch(e){} }
  showOverlay(
    won ? "VICTORY" : "GAME OVER",
    won ? "All 20 waves repelled. The core stands." : "The core has fallen.",
    '<div class="stats">Score <b>'+score+'</b> &nbsp;·&nbsp; Kills <b>'+kills+'</b> &nbsp;·&nbsp; Lives left <b>'+lives+'</b>'+
    (best ? '<br><span style="color:var(--good);font-weight:700">New best score!</span>' : '') + '</div>',
    "Play again", resetGame
  );
}

/* ============================== UPDATE ============================== */
function update(dt){
  if (dt > 0){
    if (state === "intermission"){
      countdown -= dt;
      if (countdown <= 0) startWave();
    }
    if (state === "wave"){
      waveTime += dt;
      for (const s of spawnQueue){
        if (!s.done && s.t <= waveTime){ s.done = true; spawnEnemy(s.type); }
      }
    }
    // towers
    for (const t of towers){
      t.cd -= dt; t.flash = Math.max(0, t.flash - dt);
      const L = curLevel(t);
      const tgt = acquireTarget(t, L.range);
      if (tgt){
        const want = Math.atan2(tgt.y - t.y, tgt.x - t.x);
        t.aim = angLerp(t.aim, want, Math.min(1, dt*12));
        if (t.cd <= 0){ fireTower(t, tgt, L); t.cd = 1 / L.rate; }
      }
    }
    // enemies
    for (const e of enemies){
      if (e.dead) continue;
      e.slowT = Math.max(0, e.slowT - dt);
      e.hitT = Math.max(0, e.hitT - dt);
      const mul = e.slowT > 0 ? 1 - e.slowF : 1;
      e.dist += e.speed * mul * dt;
      const p = posAt(e.dist);
      e.x = p.x; e.y = p.y; e.a = p.a;
      if (e.dist >= pathLen) leakEnemy(e);
    }
    // projectiles
    for (const p of projectiles){
      if (p.dead) continue;
      if (p.target && !p.target.dead){ p.tx = p.target.x; p.ty = p.target.y; }
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.hypot(dx, dy);
      const step = p.speed * dt;
      const hitR = (p.target && !p.target.dead) ? p.target.radius * 0.6 : 4;
      if (d <= step + hitR){ hitProjectile(p); p.dead = true; }
      else {
        p.x += dx / d * step; p.y += dy / d * step;
        p.ang = Math.atan2(dy, dx);
      }
    }
    // fx
    for (const p of particles){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1 - 2.5*dt); p.vy *= (1 - 2.5*dt); }
    for (const t of texts){ t.life -= dt; t.y += t.vy*dt; }
    for (const f of effects) f.life -= dt;
    for (const a of announces) a.life -= dt;
    enemies = enemies.filter(e => !e.dead);
    projectiles = projectiles.filter(p => !p.dead);
    particles = particles.filter(p => p.life > 0);
    texts = texts.filter(t => t.life > 0);
    effects = effects.filter(f => f.life > 0);
    announces = announces.filter(a => a.life > 0);
    // wave clear check
    if (state === "wave" && spawnQueue.length && spawnQueue.every(s => s.done) && enemies.length === 0 && waveTime > 1){
      waveCleared();
    }
  }
  updateHUD();
}

/* ============================== RENDER ============================== */
let announces = [];
function announce(text, sub){ announces.push({text, sub, life:2.2, max:2.2}); }

function drawChevrons(time){
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.16)";
  ctx.lineWidth = 3; ctx.lineCap = "round";
  const spacing = 90, offset = (time * 26) % spacing;
  for (let d = offset + 60; d < pathLen - 40; d += spacing){
    const p = posAt(d);
    const s = 7;
    ctx.beginPath();
    ctx.moveTo(p.x - Math.cos(p.a)*s - Math.cos(p.a+Math.PI/2)*s, p.y - Math.sin(p.a)*s - Math.sin(p.a+Math.PI/2)*s);
    ctx.lineTo(p.x + Math.cos(p.a)*s, p.y + Math.sin(p.a)*s);
    ctx.lineTo(p.x - Math.cos(p.a)*s + Math.cos(p.a+Math.PI/2)*s, p.y - Math.sin(p.a)*s + Math.sin(p.a+Math.PI/2)*s);
    ctx.stroke();
  }
  ctx.restore();
}
function drawRange(x, y, r, ok){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = ok ? "rgba(110,168,255,0.07)" : "rgba(224,106,90,0.08)";
  ctx.fill();
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = ok ? "rgba(150,190,255,0.5)" : "rgba(255,120,100,0.6)";
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function drawTower(t){
  const d = TOWER_TYPES[t.type], L = curLevel(t);
  const {x, y} = t;
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(x, y + 14, 18, 7, 0, 0, Math.PI*2); ctx.fill();
  // base
  roundRectPath(ctx, x-19, y-19, 38, 38, 9);
  ctx.fillStyle = "#262e3c"; ctx.fill();
  ctx.strokeStyle = "#3c4759"; ctx.lineWidth = 2; ctx.stroke();
  roundRectPath(ctx, x-14, y-14, 28, 28, 6);
  ctx.fillStyle = "#313b4c"; ctx.fill();
  // level pips
  for (let i = 0; i <= t.level; i++){
    ctx.fillStyle = "#ffd35c";
    ctx.beginPath(); ctx.arc(x - 8 + i*8, y + 16.5, 2.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.save();
  ctx.translate(x, y); ctx.rotate(t.aim);
  if (t.type === "arrow"){
    ctx.fillStyle = "#5a6b7d"; ctx.fillRect(0, -3, 20, 6);
    ctx.fillStyle = d.color; ctx.fillRect(14, -2, 8, 4);
    ctx.fillStyle = "#8fd97f"; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#3f7a35"; ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
  } else if (t.type === "cannon"){
    ctx.fillStyle = "#4a4038"; ctx.fillRect(0, -5.5, 22, 11);
    ctx.fillStyle = "#1f1a14"; ctx.fillRect(18, -4, 5, 8);
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#8a5a30"; ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI*2); ctx.fill();
  } else if (t.type === "frost"){
    ctx.fillStyle = "#5a7a8d"; ctx.fillRect(0, -2.5, 16, 5);
    drawCrystal(ctx, 0, 0, 10, d.color);
    ctx.fillStyle = "#e8f6ff"; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = "#6a5a8d"; ctx.fillRect(-3, -3, 14, 6);
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 3; i++){
      const a = time0 * 3 + i * Math.PI*2/3;
      ctx.fillStyle = "#e6d6ff";
      ctx.beginPath(); ctx.arc(Math.cos(a)*13, Math.sin(a)*13*0.5, 2.6, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "#f2ecff"; ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
  }
  if (t.flash > 0){
    ctx.fillStyle = "rgba(255,240,170,"+(t.flash/0.07)+")";
    ctx.beginPath(); ctx.arc(22, 0, 6, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
let time0 = 0;
function drawCrystal(c, x, y, r, color){
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(x, y-r); c.lineTo(x + r*0.65, y); c.lineTo(x, y+r); c.lineTo(x - r*0.65, y);
  c.closePath(); c.fill();
  c.fillStyle = "rgba(255,255,255,0.35)";
  c.beginPath(); c.moveTo(x, y-r); c.lineTo(x + r*0.65, y); c.lineTo(x, y);
  c.closePath(); c.fill();
}
function drawEnemy(e){
  const r = e.radius;
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(e.x, e.y + r*0.75, r*0.95, r*0.42, 0, 0, Math.PI*2); ctx.fill();
  // body
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2);
  ctx.fillStyle = e.hitT > 0 ? "#ffffff" : e.def.color;
  ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = e.def.dark; ctx.stroke();
  // boss spikes
  if (e.def.boss){
    ctx.fillStyle = e.def.dark;
    for (let i = 0; i < 8; i++){
      const a = i * Math.PI/4 + 0.4;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(a)*(r-2), e.y + Math.sin(a)*(r-2));
      ctx.lineTo(e.x + Math.cos(a+0.25)*(r-6), e.y + Math.sin(a+0.25)*(r-6));
      ctx.lineTo(e.x + Math.cos(a)*(r+6), e.y + Math.sin(a)*(r+6));
      ctx.closePath(); ctx.fill();
    }
  }
  // eyes facing travel direction
  const ex = Math.cos(e.a), ey = Math.sin(e.a);
  ctx.fillStyle = "#10151d";
  ctx.beginPath(); ctx.arc(e.x + ex*r*0.45 - ey*r*0.32, e.y + ey*r*0.45 + ex*r*0.32, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(e.x + ex*r*0.45 + ey*r*0.32, e.y + ey*r*0.45 - ex*r*0.32, r*0.16, 0, Math.PI*2); ctx.fill();
  // slow aura
  if (e.slowT > 0){
    ctx.strokeStyle = "rgba(124,199,255,0.75)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, r + 3.5, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "rgba(124,199,255,0.14)";
    ctx.beginPath(); ctx.arc(e.x, e.y, r + 3.5, 0, Math.PI*2); ctx.fill();
  }
  // hp bar
  if (e.hp < e.maxHp || e.def.boss){
    const w = Math.max(22, r*2), h = e.def.boss ? 6 : 4;
    const bx = e.x - w/2, by = e.y - r - 10;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(bx-1, by-1, w+2, h+2);
    ctx.fillStyle = "#3a2020"; ctx.fillRect(bx, by, w, h);
    const frac = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = frac > 0.5 ? "#7ed26b" : frac > 0.25 ? "#ffd35c" : "#ff5a4a";
    ctx.fillRect(bx, by, w*frac, h);
  }
}
function drawProjectile(p){

  } else if (p.kind === "ball"){

  } else {

}
function drawEffects(){
  for (const f of effects){
    const a = clamp(f.life / f.max, 0, 1);
    if (f.kind === "zap"){
      ctx.save();
      ctx.globalAlpha = a;
      for (const pts of f.hops){
        ctx.strokeStyle = "rgba(197,155,255,0.4)"; ctx.lineWidth = 5;

        ctx.stroke();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.8; ctx.stroke();
      }
      ctx.restore();
    } else if (f.kind === "ring"){
      const r = f.r0 + (f.r1 - f.r0) * (1 - a);
      ctx.save();
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = f.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
}
function render(time){
  time0 = time;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawChevrons(time);
  // selection / ghost ranges under everything else
  if (selectedTower){
    const L = curLevel(selectedTower);
    drawRange(selectedTower.x, selectedTower.y, L.range, true);
  }
  if (shopSel && hoverCell){
    const gx = hoverCell.c*CELL, gy = hoverCell.r*CELL;
    const valid = canBuild(hoverCell.c, hoverCell.r) && money >= TOWER_TYPES[shopSel].levels[0].cost;
    const validPlace = canBuild(hoverCell.c, hoverCell.r);
    drawRange(gx + CELL/2, gy + CELL/2, TOWER_TYPES[shopSel].levels[0].range, validPlace);
    ctx.fillStyle = validPlace ? "rgba(110,220,110,0.18)" : "rgba(230,90,70,0.22)";
    ctx.fillRect(gx + 2, gy + 2, CELL - 4, CELL - 4);
    ctx.strokeStyle = validPlace ? "rgba(140,255,140,0.7)" : "rgba(255,110,90,0.8)";
    ctx.lineWidth = 2;
    ctx.strokeRect(gx + 2, gy + 2, CELL - 4, CELL - 4);
    ctx.save();
    ctx.globalAlpha = 0.55;
    drawTower({type:shopSel, x:gx + CELL/2, y:gy + CELL/2, level:0, aim:-Math.PI/2, flash:0});
    ctx.restore();
  } else if (selectedTower && !shopSel){
    ctx.strokeStyle = "rgba(150,190,255,0.8)"; ctx.lineWidth = 2;
    ctx.strokeRect(selectedTower.c*CELL + 2, selectedTower.r*CELL + 2, CELL - 4, CELL - 4);
  }
  for (const t of towers) drawTower(t);
  const sorted = enemies.slice().sort((a,b)=>a.dist-b.dist);
  for (const e of sorted) drawEnemy(e);
  for (const p of projectiles) drawProjectile(p);
  drawEffects();
  for (const p of particles){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.font = "700 13px system-ui";
  for (const t of texts){
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillText(t.txt, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  // announcements
  for (const a of announces){
    const al = clamp(a.life / a.max, 0, 1);
    const y = 44;
    ctx.globalAlpha = al;
    ctx.font = "800 24px system-ui";
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillText(a.text, W/2 + 2, y + 2);
    ctx.fillStyle = "#f0f5ff";
    ctx.fillText(a.text, W/2, y);
    if (a.sub){
      ctx.font = "600 14px system-ui";
      ctx.fillStyle = "#ffd35c";
      ctx.fillText(a.sub, W/2, y + 22);
    }
  }
  ctx.globalAlpha = 1;
  // intermission countdown
  if (state === "intermission"){
    const txt = "Wave " + wave + " in " + Math.ceil(countdown) + "s";
    ctx.font = "700 15px system-ui";
    ctx.fillStyle = "rgba(10,14,20,0.72)";
    roundRectPath(ctx, W/2 - 90, 6, 180, 26, 13); ctx.fill();
    ctx.fillStyle = "#dce4f2"; ctx.fillText(txt, W/2, 24);
  }
  if (paused && (state === "wave" || state === "intermission")){
    ctx.fillStyle = "rgba(8,11,17,0.55)"; ctx.fillRect(0, 0, W, H);
    ctx.font = "800 40px system-ui"; ctx.fillStyle = "#fff";
    ctx.fillText("PAUSED", W/2, H/2);
    ctx.font = "600 14px system-ui"; ctx.fillStyle = "#8b98ad";
    ctx.fillText("Press Space to resume", W/2, H/2 + 28);
  }
}

/* ============================== BUILD & SELECT ============================== */
function canBuild(c, r){
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
  if (pathSet.has(cellKey(c,r))) return false;
  return !occupied.has(cellKey(c,r));
}
function selectShop(type){
  shopSel = (shopSel === type) ? null : type;
  selectedTower = null;
  refreshShop(); refreshInfo();
}
function tryBuild(c, r){
  const def = TOWER_TYPES[shopSel];
  if (!canBuild(c, r)){ toast("Cannot build there"); return; }
  const cost = def.levels[0].cost;
  if (money < cost){ toast("Not enough gold"); return; }
  money -= cost;
  makeTower(shopSel, c, r);
  spark((c+0.5)*CELL, (r+0.5)*CELL, def.color, 10);
  Sound.play("build");
  refreshInfo();
}
function upgradeSelected(){
  const t = selectedTower;
  if (!t) return;
  const levels = TOWER_TYPES[t.type].levels;
  if (t.level >= levels.length - 1){ toast("Max level"); return; }
  const cost = levels[t.level + 1].cost;
  if (money < cost){ toast("Not enough gold"); return; }
  money -= cost; t.spent += cost; t.level++;
  spark(t.x, t.y, "#ffd35c", 14);
  effects.push({kind:"ring", x:t.x, y:t.y, r0:6, r1:44, life:0.35, max:0.35, color:"#ffd35c"});
  Sound.play("upgrade");
  refreshInfo();
}
function sellSelected(){
  const t = selectedTower;
  if (!t) return;
  const refund = Math.floor(t.spent * 0.7);
  money += refund;
  occupied.delete(cellKey(t.c, t.r));
  towers = towers.filter(x => x !== t);
  texts.push({x:t.x, y:t.y - 10, txt:"+"+refund, color:"#ffd35c", life:0.9, vy:-30});
  spark(t.x, t.y, "#8b98ad", 8);
  Sound.play("sell");
  selectedTower = null;
  refreshInfo();
}

/* ============================== UI ============================== */
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = "0"; }, 1500);
}
function buildShopUI(){
  const shop = $("shop");
  shop.innerHTML = "";
  for (const key of TOWER_ORDER){
    const d = TOWER_TYPES[key];
    const el = document.createElement("div");
    el.className = "shop-item"; el.id = "shop-" + key;
    el.innerHTML =
      '<div class="swatch" style="background:'+d.color+'22;color:'+d.color+'">'+d.icon+'</div>'+
      '<div class="meta"><div class="nm">'+d.name+'<span class="key">'+(TOWER_ORDER.indexOf(key)+1)+'</span></div>'+
      '<div class="ds">'+d.desc+'</div></div>'+
      '<div class="cost">'+d.levels[0].cost+'</div>';
    el.addEventListener("click", ()=>{ Sound.ensure(); selectShop(key); });
    shop.appendChild(el);
  }
}
function refreshShop(){
  for (const key of TOWER_ORDER){
    const el = $("shop-" + key);
    if (!el) continue;
    el.classList.toggle("sel", shopSel === key);
    el.classList.toggle("poor", money < TOWER_TYPES[key].levels[0].cost);
  }
}
function refreshInfo(){
  const el = $("info");
  const t = selectedTower;
  if (!t){
    el.innerHTML = '<div class="hint">Pick a tower type on the left, then click a grass tile to build. Click a built tower to upgrade or sell it.</div>';
    return;
  }
  const d = TOWER_TYPES[t.type];
  const L = d.levels[t.level];
  const next = d.levels[t.level + 1];
  let extra = "";
  if (L.splash) extra = '<div class="k">Splash</div><div class="v">'+L.splash+' px</div>';
  if (L.slow) extra = '<div class="k">Slow</div><div class="v">'+Math.round(L.slow*100)+'% / '+L.slowDur+'s</div>';
  if (L.chain) extra = '<div class="k">Chains</div><div class="v">'+L.chain+' targets</div>';
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'+
      '<span style="color:'+d.color+';font-size:18px">'+d.icon+'</span>'+
      '<b style="font-size:14px">'+d.name+'</b>'+
      '<span class="lvl-pips" style="margin-left:auto">'+"★".repeat(t.level+1)+"☆".repeat(d.levels.length-1-t.level)+'</span>'+
    '</div>'+
    '<div class="stat-grid">'+
      '<div class="k">Damage</div><div class="v">'+L.dmg+(next?' <span style="color:var(--good)">→'+next.dmg+'</span>':'')+'</div>'+
      '<div class="k">Range</div><div class="v">'+L.range+(next?' <span style="color:var(--good)">→'+next.range+'</span>':'')+'</div>'+
      '<div class="k">Fire rate</div><div class="v">'+L.rate+'/s</div>'+
      '<div class="k">DPS</div><div class="v">'+Math.round(L.dmg*L.rate)+'</div>'+
      extra+
    '</div>'+
    '<div class="btn-row">'+
      (next ? '<button class="good" id="btnUp" '+(money<next.cost?'disabled':'')+'>Upgrade '+next.cost+'g</button>'
            : '<button disabled>Max level</button>')+
      '<button class="bad" id="btnSell">Sell '+Math.floor(t.spent*0.7)+'g</button>'+
    '</div>';
  const up = $("btnUp");
  if (up) up.addEventListener("click", upgradeSelected);
  $("btnSell").addEventListener("click", sellSelected);
}
function updatePreview(){
  const el = $("preview");
  if (state === "over" || state === "won"){ el.innerHTML = ""; return; }
  const groups = buildWaveGroups(wave);
  let html = "<b>Wave "+wave+"</b> arrives with:<br>";
  for (const g of groups){
    const d = ENEMY_TYPES[g.type];
    html += '<span class="dot" style="background:'+d.color+'"></span>'+g.count+"× "+d.name+"<br>";
  }
  el.innerHTML = html;
}
function refreshNextBtn(){
  const b = $("btnNext");
  if (state === "intermission"){
    b.disabled = false;
    b.textContent = "Start wave " + wave + " (+" + Math.floor(countdown)*3 + "g)";
  } else if (state === "wave"){
    b.disabled = true;
    b.textContent = "Wave " + wave + " in progress";
  } else {
    b.disabled = true;
    b.textContent = "Start wave";
  }
}
let cachedMoney = -1;
function updateHUD(){
  $("uiMoney").textContent = money;
  $("uiLives").textContent = lives;
  $("uiWave").textContent = wave + "/" + MAX_WAVE;
  $("uiScore").textContent = score;
  $("uiBest").textContent = bestScore;
  refreshShop();
  if (money !== cachedMoney){
    cachedMoney = money;
    if (selectedTower) refreshInfo();
  }
  refreshNextBtn();
}
function showOverlay(title, sub, bodyHtml, btnText, btnFn){
  const card = $("ovCard");
  card.innerHTML = "<h1>"+title+"</h1><p>"+sub+"</p>"+bodyHtml+'<button class="primary" id="ovBtn">'+btnText+"</button>";
  $("overlay").classList.remove("hidden");
  $("ovBtn").addEventListener("click", ()=>{ Sound.ensure(); btnFn(); });
}
function hideOverlay(){ $("overlay").classList.add("hidden"); }

/* ============================== INPUT ============================== */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX - r.left) * (W / r.width), y:(e.clientY - r.top) * (H / r.height)};
}
cv.addEventListener("mousemove", e => {
  const p = canvasPos(e);
  mouse = p;
  const c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
  hoverCell = (c >= 0 && r >= 0 && c < COLS && r < ROWS) ? {c, r} : null;
});
cv.addEventListener("mouseleave", ()=>{ hoverCell = null; });
cv.addEventListener("click", e => {
  Sound.ensure();
  if (state === "menu" || state === "over" || state === "won") return;
  const p = canvasPos(e);
  const c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  const t = occupied.get(cellKey(c,r));
  if (t){
    selectedTower = t; shopSel = null;
    refreshShop(); refreshInfo();
    return;
  }
  if (shopSel){ tryBuild(c, r); return; }
  selectedTower = null;
  refreshInfo();
});
cv.addEventListener("contextmenu", e => {
  e.preventDefault();
  shopSel = null; selectedTower = null;
  refreshShop(); refreshInfo();
});
window.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); togglePause(); return; }
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "4" && state !== "menu" && state !== "over" && state !== "won"){ selectShop(TOWER_ORDER[+k - 1]); }
  else if (k === "escape"){ shopSel = null; selectedTower = null; refreshShop(); refreshInfo(); }
  else if (k === "n") callWaveEarly();
  else if (k === "u") upgradeSelected();
  else if (k === "x") sellSelected();
});
function togglePause(){
  if (state !== "wave" && state !== "intermission") return;
  paused = !paused;
  $("btnPause").textContent = paused ? "Resume" : "Pause";
}
$("btnPause").addEventListener("click", e => { Sound.ensure(); togglePause(); e.target.blur(); });
$("btnSpeed").addEventListener("click", e => {
  speed = speed === 1 ? 2 : speed === 2 ? 3 : 1;
  e.target.textContent = speed + "×";
  e.target.blur();
});
$("btnSound").addEventListener("click", e => {
  Sound.ensure();
  Sound.muted = !Sound.muted;
  e.target.textContent = Sound.muted ? "Sound: off" : "Sound: on";
  e.target.blur();
});
$("btnNext").addEventListener("click", e => { Sound.ensure(); callWaveEarly(); e.target.blur(); });

/* ============================== GAME LIFECYCLE ============================== */
function resetGame(){
  money = 220; lives = 20; wave = 1; score = 0; kills = 0;
  state = "intermission"; countdown = 8; speed = 1; paused = false;
  enemies = []; towers = []; projectiles = []; particles = []; texts = []; effects = []; spawnQueue = [];
  waveTime = 0; shopSel = null; selectedTower = null; cachedMoney = -1;
  occupied.clear();
  announces = [];
  $("btnPause").textContent = "Pause";
  $("btnSpeed").textContent = "1×";
  hideOverlay();
  updatePreview();
  refreshShop(); refreshInfo();
  announce("GET READY", "Build your defenses");
}
function showMenu(){
  state = "menu";
  showOverlay(
    "GRIDGUARD",
    "Hostile waves march toward your core. Build towers on the grass, upgrade them, and survive all " + MAX_WAVE + " waves.",
    '<div class="stats" style="text-align:left;font-size:13px;line-height:2">'+
    '<b style="color:#7ed26b">➤ Archer</b> — cheap, rapid single-target fire<br>'+
    '<b style="color:#e0a458">◉ Cannon</b> — slow shots, splash damage<br>'+
    '<b style="color:#7cc7ff">❄ Frost</b> — chills and slows enemies<br>'+
    '<b style="color:#c59bff">⚡ Tesla</b> — chain lightning between foes<br>'+
    '<span style="color:var(--muted)">Calling the next wave early grants bonus gold.</span></div>',
    "Start game", resetGame
  );
}

/* ============================== MAIN LOOP ============================== */
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const active = !paused && (state === "intermission" || state === "wave");
  update(active ? dt * speed : 0);
  render(now / 1000);
  requestAnimationFrame(frame);
}

/* ============================== INIT ============================== */
buildShopUI();
resetGame();
showMenu();
requestAnimationFrame(frame);
</script>
