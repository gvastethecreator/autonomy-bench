<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
  :root {
    --bg-0: #07090f;
    --bg-1: #0d1220;
    --accent: #5eead4;
    --accent-2: #818cf8;
    --accent-3: #f0abfc;
    --text: #e8ecf4;
    --text-dim: #8b93a7;
    --track: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", "SF Pro Text", system-ui, -apple-system, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient background layers */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1100px 700px at 15% 10%, rgba(129, 140, 248, 0.16), transparent 60%),
      radial-gradient(900px 600px at 85% 85%, rgba(94, 234, 212, 0.12), transparent 60%),
      radial-gradient(700px 500px at 60% 40%, rgba(240, 171, 252, 0.07), transparent 65%),
      linear-gradient(160deg, var(--bg-1), var(--bg-0) 60%);
  }

  .grid {
    position: fixed;
    inset: -1px;
    z-index: 1;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 25%, transparent 75%);
    animation: gridDrift 24s linear infinite;
  }

  @keyframes gridDrift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 56px 56px, 56px 56px; }
  }

  .scanline {
    position: fixed;
    left: 0; right: 0;
    height: 140px;
    z-index: 1;
    background: linear-gradient(to bottom, transparent, rgba(94, 234, 212, 0.05), transparent);
    animation: scan 7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0%   { top: -20%; }
    100% { top: 120%; }
  }

  /* Loader card */
  .stage {
    position: relative;
    z-index: 2;
    width: min(440px, calc(100vw - 48px));
    padding: 48px 40px 40px;
    border-radius: 24px;
    background: rgba(13, 18, 32, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Orbital spinner */
  .orbital {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 34px;
  }

  .orbital .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  .ring.r1 {
    border-top-color: var(--accent);
    border-right-color: rgba(94, 234, 212, 0.25);
    animation: spin 1.1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite;
  }

  .ring.r2 {
    inset: 12px;
    border-bottom-color: var(--accent-2);
    border-left-color: rgba(129, 140, 248, 0.25);
    animation: spin 1.7s cubic-bezier(0.4, 0.1, 0.6, 0.9) infinite reverse;
  }

  .ring.r3 {
    inset: 26px;
    border-top-color: var(--accent-3);
    animation: spin 2.3s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .core {
    position: absolute;
    inset: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #b7fff0, var(--accent) 45%, #0f766e);
    box-shadow:
      0 0 18px rgba(94, 234, 212, 0.65),
      0 0 44px rgba(94, 234, 212, 0.3);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(0.78); opacity: 0.7; }
  }

  /* Heading + status */
  .title {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 26px;
  }

  .status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 16px;
  }

  .status {
    font-size: 14px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.25s ease;
  }

  .status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: blink 1.2s ease-in-out infinite;
    vertical-align: 1px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }

  .percent {
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 4ch;
    text-align: right;
  }

  .percent::after { content: "%"; font-size: 13px; color: var(--text-dim); margin-left: 1px; }

  /* Progress track */
  .track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }

  .bar {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2) 60%, var(--accent-3));
    box-shadow: 0 0 14px rgba(94, 234, 212, 0.5);
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    transform: translateX(-100%);
    animation: sheen 1.8s ease-in-out infinite;
  }

  @keyframes sheen {
    60%, 100% { transform: translateX(100%); }
  }

  /* Segment ticks under the bar */
  .ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
  }

  .ticks span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  .ticks span.lit {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(94, 234, 212, 0.8);
  }

  .hint {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(139, 147, 167, 0.7);
  }

  /* Done state */
  .stage.done .bar { transition: width 0.5s ease; }
  .stage.done .core {
    background: radial-gradient(circle at 35% 30%, #d1fae5, var(--accent) 45%, #0f766e);
    animation: none;
  }
  .stage.done .hint { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .ring, .core, .dot, .scanline, .grid, .bar::after { animation: none !important; }
    .bar { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="scanline"></div>

  <main class="stage" id="stage" role="status" aria-live="polite" aria-label="Loading">
    <div class="orbital" aria-hidden="true">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core"></div>
    </div>

    <h1 class="title">Loading</h1>

    <div class="status-row">
      <div class="status"><span class="dot"></span><span id="statusText">Initializing…</span></div>
      <div class="percent" id="percent">0</div>
    </div>

    <div class="track"><div class="bar" id="bar"></div></div>

    <div class="ticks" id="ticks" aria-hidden="true"></div>

    <p class="hint" id="hint">Please wait while we prepare your experience</p>
  </main>

<script>
(function () {
  "use strict";

  var TOTAL_MS = 8200;           // nominal load duration
  var STEPS = [
    { at: 0,  label: "Initializing…" },
    { at: 12, label: "Loading assets" },
    { at: 30, label: "Fetching configuration" },
    { at: 48, label: "Compiling shaders" },
    { at: 65, label: "Warming caches" },
    { at: 82, label: "Establishing connection" },
    { at: 96, label: "Almost there…" }
  ];

  var stage   = document.getElementById("stage");
  var bar     = document.getElementById("bar");
  var percent = document.getElementById("percent");
  var statusT = document.getElementById("statusText");
  var hint    = document.getElementById("hint");
  var ticksEl = document.getElementById("ticks");
  var TICK_N  = 24;

  for (var t = 0; t < TICK_N; t++) {
    ticksEl.appendChild(document.createElement("span"));
  }
  var ticks = ticksEl.children;

  var start = performance.now();
  var currentLabel = "";
  var lastShown = -1;

  // Slightly uneven progress curve so the bar feels organic.
  function curve(x) {
    // ease with a plateau in the middle (long stretch) and a hitch near 90%
    if (x < 0.35) return x / 0.35 * 0.34;
    if (x < 0.72) return 0.34 + (x - 0.35) / 0.37 * 0.5;
    if (x < 0.9)  return 0.84 + (x - 0.72) / 0.18 * 0.08;
    return 0.92 + (x - 0.9) / 0.1 * 0.08;
  }

  function render(pct) {
    pct = Math.max(0, Math.min(100, pct));

    if (Math.floor(pct) !== lastShown) {
      lastShown = Math.floor(pct);
      percent.textContent = lastShown;
    }

    bar.style.width = pct.toFixed(2) + "%";

    var litCount = Math.round(pct / 100 * TICK_N);
    for (var i = 0; i < TICK_N; i++) {
      ticks[i].classList.toggle("lit", i < litCount);
    }

    var label = "";
    for (var s = 0; s < STEPS.length; s++) {
      if (pct + 0.01 >= STEPS[s].at) label = STEPS[s].label;
    }
    if (label && label !== currentLabel) {
      currentLabel = label;
      statusT.style.opacity = "0";
      (function (text) {
        setTimeout(function () {
          statusT.textContent = text;
          statusT.style.opacity = "1";
        }, 160);
      })(label);
    }
  }

  function finish() {
    render(100);
    statusT.textContent = "Ready";
    hint.textContent = "Complete — entering the experience";
    stage.classList.add("done");
    setTimeout(function () {
      stage.style.transition = "opacity 0.6s ease, transform 0.6s ease";
      stage.style.opacity = "0";
      stage.style.transform = "translateY(-10px) scale(0.985)";
    }, 900);
    // Fade back in as a looping demo so the screen never ends on a blank page.
    setTimeout(function () {
      stage.style.opacity = "1";
      stage.style.transform = "translateY(0) scale(1)";
    }, 2400);
  }

  function frame(now) {
    var x = (now - start) / TOTAL_MS;
    if (x >= 1) { finish(); return; }
    render(curve(x) * 100);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
