<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a12" />
<title>The Button</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd166'/%3E%3Cstop offset='1' stop-color='%23ff5e7e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='50' fill='url(%23g)'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg0: #0b0a12;
    --bg1: #171331;
    --ink: #f6f3ff;
    --muted: #8b87a3;
    --amber: #ffd166;
    --coral: #ff5e7e;
    --ease-pop: cubic-bezier(.2, 1.4, .3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg0) 60%);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- ambience ---------- */

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
  }
  .blob-a {
    width: 46vmax; height: 46vmax;
    left: -12vmax; top: -14vmax;
    background: radial-gradient(closest-side, rgba(124, 77, 255, .22), transparent 70%);
    animation: drift-a 26s ease-in-out infinite alternate;
  }
  .blob-b {
    width: 40vmax; height: 40vmax;
    right: -10vmax; bottom: -16vmax;
    background: radial-gradient(closest-side, rgba(64, 199, 255, .13), transparent 70%);
    animation: drift-b 31s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  @keyframes drift-b { to { transform: translate(-5vmax, -4vmax) scale(1.08); } }

  .grain {
    position: fixed;
    inset: -50%;
    z-index: 1;
    pointer-events: none;
    opacity: .05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(5, 4, 10, .55) 100%);
  }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(60% 50% at 50% 55%, rgba(255, 190, 150, .32), transparent 70%);
  }
  .flash.on { animation: flash-pulse .7s ease-out; }
  @keyframes flash-pulse { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }

  #fx {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }

  /* ---------- composition ---------- */

  #stage {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 5vh, 42px);
    user-select: none;
    -webkit-user-select: none;
    transform: translate(calc(var(--jx, 0) * 1px), calc(var(--jy, 0) * 1px));
  }

  #stage > * { animation: enter .7s cubic-bezier(.2, .7, .3, 1) backwards; }
  #stage > :nth-child(1) { animation-delay: .06s; }
  #stage > :nth-child(2) { animation-delay: .14s; }
  #stage > :nth-child(3) { animation-delay: .24s; }
  #stage > :nth-child(4) { animation-delay: .34s; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(16px); filter: blur(6px); }
  }

  .kicker {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .34em;
    padding-left: .34em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color .3s ease;
    text-align: center;
  }
  .kicker.gold { color: var(--amber); }
  .kicker.swap { animation: swap .35s ease; }
  @keyframes swap {
    from { opacity: 0; transform: translateY(6px); filter: blur(3px); }
  }

  .hint {
    font-size: 12.5px;
    color: rgba(139, 135, 163, .72);
    letter-spacing: .08em;
    text-align: center;
    padding: 0 20px;
  }

  /* ---------- the button ---------- */

  .button-wrap {
    --mx: 0; --my: 0; --fy: 0; --gap: 14; --sx: 1; --sy: 1; --glow-o: 1;
    position: relative;
    width: min(340px, 80vw);
  }

  .glow {
    position: absolute;
    left: 50%; top: 50%;
    width: 135%; height: 230%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(255, 118, 100, .5), transparent 70%);
    filter: blur(24px);
    opacity: var(--glow-o);
    z-index: 0;
    pointer-events: none;
  }

  .depth {
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: 999px;
    background: linear-gradient(#a52c58, #7c1f45);
    transform: translateY(calc(var(--gap) * 1px));
    box-shadow: 0 36px 60px -20px rgba(0, 0, 0, .65);
  }

  #the-button {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 92px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: linear-gradient(168deg, #ffd166 0%, #ff8f5e 48%, #ff5e7e 100%);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, .38),
      inset 0 -12px 26px rgba(150, 26, 74, .30),
      inset 0 0 0 1px rgba(255, 255, 255, .12);
    transform:
      translate3d(
        calc(var(--mx) * 1px),
        calc(var(--my) * 1px + var(--fy) * 1px),
        0
      )
      scale(var(--sx), var(--sy));
    will-change: transform;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #the-button:focus-visible {
    outline: 3px solid rgba(255, 209, 102, .9);
    outline-offset: 6px;
  }
  #the-button::before {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .05) 42%, transparent 62%);
    pointer-events: none;
  }

  .btn-label {
    position: relative;
    z-index: 2;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .26em;
    padding-left: .26em;
    text-shadow: 0 2px 10px rgba(140, 20, 60, .45);
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .18) 40%, rgba(255, 255, 255, 0) 65%);
    transform: translate(-50%, -50%) scale(0);
    animation: ripple .55s ease-out forwards;
  }
  @keyframes ripple {
    from { opacity: .8; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* combo badge + floaty +1 */

  .combo {
    position: absolute;
    top: -14px;
    right: -6px;
    z-index: 5;
    background: var(--amber);
    color: #241a05;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .04em;
    padding: 5px 10px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(255, 209, 102, .35);
    opacity: 0;
    transform: scale(.6);
    transition: opacity .18s ease, transform .18s var(--ease-pop);
    pointer-events: none;
  }
  .combo.show { opacity: 1; transform: scale(1); }
  .combo.bump { animation: bump .25s var(--ease-pop); }
  @keyframes bump { from { transform: scale(1.4); } }

  .floaty {
    position: absolute;
    bottom: 100%;
    margin-bottom: 6px;
    font-weight: 800;
    font-size: 15px;
    color: var(--amber);
    text-shadow: 0 2px 12px rgba(255, 209, 102, .4);
    pointer-events: none;
    animation: floaty .8s cubic-bezier(.2, .7, .3, 1) forwards;
  }
  @keyframes floaty {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(.7); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -54px) scale(1.05); }
  }

  /* ---------- counter ---------- */

  .meter {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  #count {
    display: inline-flex;
    font-size: clamp(56px, 11vw, 92px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    color: #fff;
    transform-origin: 50% 70%;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    #count {
      background: linear-gradient(180deg, #ffffff 30%, #ffd9c4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  }
  #count.pop { animation: count-pop .3s var(--ease-pop); }
  #count.mega { animation: count-mega .5s var(--ease-pop); }
  @keyframes count-pop { 30% { transform: scale(1.09); } }
  @keyframes count-mega { 30% { transform: scale(1.22); } }

  .digit { display: block; height: 1em; overflow: hidden; }
  .reel { display: block; transition: transform .5s cubic-bezier(.22, 1.2, .36, 1); will-change: transform; }
  .reel span { display: block; height: 1em; line-height: 1; }

  .count-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .18em;
    padding-left: .18em;
    text-transform: uppercase;
  }

  /* ---------- mute ---------- */

  #mute {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 40;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .05);
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: color .2s, border-color .2s, transform .15s var(--ease-pop);
  }
  #mute:hover { color: var(--ink); border-color: rgba(255, 255, 255, .3); transform: translateY(-2px); }
  #mute:focus-visible { outline: 2px solid rgba(255, 209, 102, .8); outline-offset: 3px; }
  #mute svg { width: 20px; height: 20px; display: block; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: block; }

  /* ---------- reduced motion ---------- */

  @media (prefers-reduced-motion: reduce) {
    .blob, #stage > *, .kicker.swap, .flash.on, .floaty, .ripple { animation: none !important; }
    .reel { transition-duration: .15s; }
  }
</style>
</head>
<body>

  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main id="stage">
    <p class="kicker" id="kicker">go on. press it.</p>

    <div class="button-wrap" id="wrap">
      <div class="glow" aria-hidden="true"></div>
      <div class="depth" aria-hidden="true"></div>
      <button id="the-button" aria-label="The satisfying button. Press it for a pop.">
        <span class="btn-label">PRESS</span>
      </button>
      <span class="combo" id="combo" aria-hidden="true"></span>
    </div>

    <div class="meter">
      <span id="count" aria-hidden="true">0</span>
      <span class="count-label">presses</span>
    </div>

    <p class="hint">space bar works too &middot; every 25 presses, a small celebration</p>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <button id="mute" aria-label="Toggle sound" aria-pressed="false">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.4 5.6a9 9 0 0 1 0 12.8"/>
    </svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4z"/>
      <line x1="22" y1="9" x2="16" y2="15"/>
      <line x1="16" y1="9" x2="22" y2="15"/>
    </svg>
  </button>

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const wrap = $('#wrap');
  const btn = $('#the-button');
  const stage = $('#stage');
  const countEl = $('#count');
  const comboEl = $('#combo');
  const kicker = $('#kicker');
  const flashEl = $('#flash');
  const muteBtn = $('#mute');
  const canvas = $('#fx');
  const g2d = canvas.getContext('2d');

  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DEFAULT_KICKER = 'go on. press it.';
  const PHRASES = [
    'nice.', 'keep going.', 'so satisfying.', 'certified presser.',
    'the button is pleased.', 'again? again.', 'pure serotonin.'
  ];
  const COLORS = ['#ffd166', '#ff8f5e', '#ff5e7e', '#7ee8fa', '#b28dff', '#8affc1'];

  /* ------------------ state ------------------ */

  let count = 0;
  try { count = parseInt(localStorage.getItem('the-button-count'), 10) || 0; } catch (e) {}

  let combo = 0;
  let lastClickAt = -1e9;
  let comboTimer = 0;
  let phraseTimer = 0;

  let pressed = false;   // pointer or key held down
  let hover = false;     // fine pointer over the button
  let pressPoint = null; // last pointerdown position (for burst origin)

  // squash-and-stretch spring (s: scale-y, sv: velocity)
  let s = 1, sv = 0;
  const K = RM ? 800 : 520;  // stiffness
  const C = RM ? 42 : 15;    // damping (underdamped for bounce)

  // magnetic hover
  let mx = 0, my = 0, tx = 0, ty = 0;

  // screen jolt
  let jx = 0, jy = 0, jvx = 0, jvy = 0;

  let lastInteract = performance.now();

  /* ------------------ canvas ------------------ */

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    g2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const parts = [];
  const rainQueue = [];

  function spawnBurst(x, y, power) {
    if (RM) return;
    parts.push({ type: 'ring', x, y, age: 0, life: 0.5, r0: 26 * power });
    const sparks = Math.round(14 * power);
    for (let i = 0; i < sparks; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 260 + Math.random() * 520;
      parts.push({
        type: 'spark', x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
        age: 0, life: 0.3 + Math.random() * 0.3,
        size: 1.5 + Math.random() * 2.2
      });
    }
    const conf = Math.round(11 * power);
    for (let i = 0; i < conf; i++) {
      parts.push({
        type: 'confetti',
        x: x + (Math.random() - 0.5) * 40, y,
        vx: (Math.random() - 0.5) * 540, vy: -(140 + Math.random() * 420),
        age: 0, life: 1.1 + Math.random() * 0.9,
        size: 5 + Math.random() * 6,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 14,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function queueRain(n) {
    const now = performance.now() / 1000;
    for (let i = 0; i < n; i++) rainQueue.push({ t: now + Math.random() * 1.2 });
  }

  function stepParticles(dt, nowSec) {
    for (let i = rainQueue.length - 1; i >= 0; i--) {
      if (nowSec >= rainQueue[i].t) {
        parts.push({
          type: 'drop',
          x: Math.random() * W, y: -20,
          vx: 0, vy: 80 + Math.random() * 160,
          age: 0, life: 7,
          size: 5 + Math.random() * 6,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 10,
          phase: Math.random() * Math.PI * 2
        });
        rainQueue.splice(i, 1);
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.type === 'confetti') {
        p.vy += 1150 * dt;
        p.vx *= Math.exp(-1.4 * dt);
        p.vy *= Math.exp(-0.35 * dt);
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
      } else if (p.type === 'spark') {
        p.vy += 420 * dt;
        p.vx *= Math.exp(-2.2 * dt);
        p.vy *= Math.exp(-1.2 * dt);
        p.x += p.vx * dt; p.y += p.vy * dt;
      } else if (p.type === 'drop') {
        p.vy = Math.min(p.vy + 300 * dt, 260 + p.size * 14);
        p.vx = Math.sin(nowSec * 2 + p.phase) * 70;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
      }
      const dead = p.type === 'ring'
        ? p.age >= p.life
        : (p.age >= p.life || p.y > H + 60);
      if (dead) parts.splice(i, 1);
    }
  }

  function drawParticles() {
    g2d.clearRect(0, 0, W, H);
    for (const p of parts) {
      const t = Math.min(p.age / p.life, 1);
      if (p.type === 'ring') {
        const r = p.r0 * (1 - Math.pow(1 - t, 3)) + 6;
        g2d.beginPath();
        g2d.arc(p.x, p.y, r, 0, Math.PI * 2);
        g2d.strokeStyle = 'rgba(255, 236, 214, ' + ((1 - t) * 0.5).toFixed(3) + ')';
        g2d.lineWidth = 2 + 9 * (1 - t);
        g2d.stroke();
      } else if (p.type === 'spark') {
        g2d.globalCompositeOperation = 'lighter';
        g2d.beginPath();
        g2d.arc(p.x, p.y, p.size * (1 - t * 0.5), 0, Math.PI * 2);
        g2d.fillStyle = 'rgba(255, 214, 150, ' + (1 - t).toFixed(3) + ')';
        g2d.fill();
        g2d.globalCompositeOperation = 'source-over';
      } else {
        const a = Math.max(0, Math.min((p.life - p.age) / 0.4, 1));
        g2d.save();
        g2d.translate(p.x, p.y);
        g2d.rotate(p.rot);
        g2d.scale(1, 0.35 + 0.65 * Math.abs(Math.sin(p.phase + p.age * 7)));
        g2d.globalAlpha = a;
        g2d.fillStyle = p.color;
        g2d.fillRect(-p.size / 2, -p.size * 0.65, p.size, p.size * 1.3);
        g2d.restore();
        g2d.globalAlpha = 1;
      }
    }
  }

  /* ------------------ audio ------------------ */

  let actx = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('the-button-muted') === '1'; } catch (e) {}

  function ensureAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.8;
      master.connect(actx.destination);
      const len = Math.floor(actx.sampleRate * 0.1);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  }

  function popSound(c) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const semis = Math.min(c - 1, 14);
    const f = 330 * Math.pow(2, semis / 12);
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 1.7, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.22);
    const n = actx.createBufferSource();
    n.buffer = noiseBuf;
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1800;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0.1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    n.connect(hp); hp.connect(ng); ng.connect(master);
    n.start(t); n.stop(t + 0.06);
  }

  function fanfare() {
    if (!actx || muted) return;
    const t = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = actx.createOscillator();
      o.type = 'triangle'; o.frequency.value = f;
      const g = actx.createGain();
      const st = t + i * 0.09;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.22, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.4);
      o.connect(g); g.connect(master);
      o.start(st); o.stop(st + 0.45);
    });
    const sub = actx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(120, t);
    sub.frequency.exponentialRampToValueAtTime(55, t + 0.25);
    const sg = actx.createGain();
    sg.gain.setValueAtTime(0.25, t);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    sub.connect(sg); sg.connect(master);
    sub.start(t); sub.stop(t + 0.32);
  }

  function setMuted(m) {
    muted = m;
    if (actx && master) master.gain.setTargetAtTime(m ? 0 : 0.8, actx.currentTime, 0.02);
    muteBtn.setAttribute('aria-pressed', String(m));
    muteBtn.classList.toggle('muted', m);
    try { localStorage.setItem('the-button-muted', m ? '1' : '0'); } catch (e) {}
  }

  /* ------------------ counter (odometer) ------------------ */

  function makeDigit() {
    const d = document.createElement('span');
    d.className = 'digit';
    const r = document.createElement('span');
    r.className = 'reel';
    for (let i = 0; i < 10; i++) {
      const cell = document.createElement('span');
      cell.textContent = i;
      r.appendChild(cell);
    }
    d.appendChild(r);
    return d;
  }

  function setCount(n) {
    const str = String(n);
    while (countEl.children.length < str.length) {
      countEl.insertBefore(makeDigit(), countEl.firstChild);
    }
    // apply inside rAF so freshly-inserted digits animate from 0
    requestAnimationFrame(() => {
      const reels = countEl.querySelectorAll('.reel');
      for (let i = 0; i < str.length; i++) {
        reels[i].style.transform = 'translateY(-' + str[i] + 'em)';
      }
    });
  }

  function bumpCounter(mega) {
    countEl.classList.remove('pop', 'mega');
    void countEl.offsetWidth;
    countEl.classList.add(mega ? 'mega' : 'pop');
  }

  /* ------------------ small helpers ------------------ */

  function pulse(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function spawnRipple(clientX, clientY) {
    if (RM) return;
    const r = btn.getBoundingClientRect();
    const x = clientX == null ? r.width / 2 : clientX - r.left;
    const y = clientY == null ? r.height / 2 : clientY - r.top;
    const d = Math.max(r.width, r.height) * 2.3;
    const el = document.createElement('span');
    el.className = 'ripple';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = el.style.height = d + 'px';
    btn.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function spawnFloaty() {
    if (RM) return;
    const f = document.createElement('span');
    f.className = 'floaty';
    f.textContent = '+1';
    f.style.left = 'calc(50% + ' + ((Math.random() - 0.5) * 70).toFixed(0) + 'px)';
    wrap.appendChild(f);
    f.addEventListener('animationend', () => f.remove());
  }

  function jolt() {
    const a = Math.random() * Math.PI * 2;
    const p = 150 + Math.random() * 120;
    jvx += Math.cos(a) * p;
    jvy += Math.sin(a) * p;
  }

  function flashPhrase() {
    kicker.textContent = PHRASES[(Math.random() * PHRASES.length) | 0];
    kicker.classList.add('gold');
    pulse(kicker, 'swap');
    clearTimeout(phraseTimer);
    phraseTimer = setTimeout(() => {
      kicker.textContent = DEFAULT_KICKER;
      kicker.classList.remove('gold');
      pulse(kicker, 'swap');
    }, 1700);
  }

  function updateCombo() {
    if (combo >= 2) {
      comboEl.textContent = '\u00d7' + combo;
      comboEl.classList.add('show');
      pulse(comboEl, 'bump');
    }
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => comboEl.classList.remove('show'), 950);
  }

  function milestone(x, y) {
    spawnBurst(x, y, 2.4);
    if (!RM) queueRain(150);
    pulse(flashEl, 'on');
    flashPhrase();
    fanfare();
  }

  /* ------------------ events ------------------ */

  btn.addEventListener('pointerdown', (e) => {
    pressed = true;
    pressPoint = { x: e.clientX, y: e.clientY };
    lastInteract = performance.now();
    ensureAudio();
    spawnRipple(e.clientX, e.clientY);
  });

  addEventListener('pointerup', () => { pressed = false; });
  addEventListener('pointercancel', () => { pressed = false; });
  addEventListener('blur', () => { pressed = false; hover = false; });

  btn.addEventListener('pointerenter', (e) => {
    if (e.pointerType === 'mouse') hover = true;
  });
  btn.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') hover = false;
  });

  addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || RM) return;
    if (!hover || pressed) { tx = 0; ty = 0; return; }
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const near = Math.max(0, 1 - Math.hypot(dx, dy) / 260);
    tx = Math.max(-16, Math.min(16, dx * near * 0.5));
    ty = Math.max(-12, Math.min(12, dy * near * 0.45));
  });

  btn.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      pressed = true;
      lastInteract = performance.now();
      ensureAudio();
      spawnRipple(null, null);
    }
  });
  btn.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') pressed = false;
  });

  btn.addEventListener('click', (e) => {
    lastInteract = performance.now();
    const now = performance.now();
    combo = (now - lastClickAt < 850) ? combo + 1 : 1;
    lastClickAt = now;

    count += 1;
    try { localStorage.setItem('the-button-count', String(count)); } catch (err) {}
    setCount(count);

    const isMilestone = count % 25 === 0;
    bumpCounter(isMilestone);
    ensureAudio();
    popSound(combo);

    const r = btn.getBoundingClientRect();
    const x = pressPoint ? pressPoint.x : r.left + r.width / 2;
    const y = pressPoint ? pressPoint.y : r.top + r.height / 2;
    spawnBurst(x, y, 1);
    spawnFloaty();
    if (!RM) jolt();
    updateCombo();
    if (isMilestone) milestone(x, y);

    document.title = 'The Button \u2014 ' + count;
  });

  muteBtn.addEventListener('click', () => {
    ensureAudio();
    setMuted(!muted);
  });

  /* ------------------ animation loop ------------------ */

  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // squash spring
    const target = pressed ? 0.86 : (hover ? 1.035 : 1);
    sv += (K * (target - s) - C * sv) * dt;
    s += sv * dt;

    // magnet lerp
    if (RM || pressed || !hover) { tx = 0; ty = 0; }
    const mk = 1 - Math.exp(-16 * dt);
    mx += (tx - mx) * mk;
    my += (ty - my) * mk;

    // jolt spring
    jvx += (-900 * jx - 22 * jvx) * dt; jx += jvx * dt;
    jvy += (-900 * jy - 22 * jvy) * dt; jy += jvy * dt;
    stage.style.setProperty('--jx', jx.toFixed(2));
    stage.style.setProperty('--jy', jy.toFixed(2));

    // derived depth + glow
    const gap = Math.max(3, Math.min(17, 3 + (s - 0.86) * 74.29));
    const fy = 13.4 - gap;
    const sx = 1 + (1 - s) * 0.55;
    const base = Math.max(0, Math.min((s - 0.88) / 0.16, 1));
    const idle = (now - lastInteract) / 1000;
    const breathAmp = RM ? 0 : Math.max(0, Math.min((idle - 2.5) / 3, 1));
    const glowO = Math.min(1.35,
      base * (hover ? 1.3 : 1) * (1 + 0.3 * Math.sin(now / 1000 * 1.9) * breathAmp));

    wrap.style.setProperty('--sy', s.toFixed(4));
    wrap.style.setProperty('--sx', sx.toFixed(4));
    wrap.style.setProperty('--fy', fy.toFixed(2));
    wrap.style.setProperty('--gap', gap.toFixed(2));
    wrap.style.setProperty('--mx', mx.toFixed(2));
    wrap.style.setProperty('--my', my.toFixed(2));
    wrap.style.setProperty('--glow-o', glowO.toFixed(3));

    stepParticles(dt, now / 1000);
    drawParticles();

    requestAnimationFrame(frame);
  }

  /* ------------------ init ------------------ */

  setCount(count);
  if (count > 0) document.title = 'The Button \u2014 ' + count;
  setMuted(muted);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
