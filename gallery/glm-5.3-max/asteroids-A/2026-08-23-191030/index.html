<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTEROIDS</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  #game{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:2;
        background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0px,rgba(0,0,0,.20) 1px,transparent 1px,transparent 3px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;
       background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
</style>
</head>
<body>
<canvas id="game" role="img" aria-label="Asteroids arcade game"></canvas>
<div id="scan"></div>
<div id="vig"></div>
<script>
'use strict';
/* =====================================================================
   ASTEROIDS - vector arcade classic in a single file
   Keys: arrows/WASD fly, SPACE fire, H hyperspace, P pause, M sound
   ===================================================================== */

/* ---------------- canvas & starfield ---------------- */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const FONT='"Courier New",Courier,monospace';
const TAU=Math.PI*2;
let W=1,H=1,DPR=1,stars=[];
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[];
  const n=Math.round(W*H/9000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.3+0.4,p:Math.random()*TAU,s:Math.random()*1.5+0.4});
}
window.addEventListener('resize',resize);
resize();

/* ---------------- audio (WebAudio, no assets) ---------------- */
let AC=null,master=null,muted=false,noiseBuf=null;
function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();
      master.gain.value=muted?0:0.5;
      master.connect(AC.destination);
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function env(g,t0,a,peak,d){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001,peak),t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}
function blip(type,f0,f1,dur,vol){
  const a=audio();if(!a)return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  env(g,t,0.005,vol,dur);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur+0.1);
}
function makeNoise(a){
  if(!noiseBuf){
    const len=a.sampleRate;
    noiseBuf=a.createBuffer(1,len,a.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function noise(dur,vol,f0,f1){
  const a=audio();if(!a)return;
  const t=a.currentTime,src=a.createBufferSource();
  src.buffer=makeNoise(a);src.loop=true;
  const flt=a.createBiquadFilter();
  flt.type='lowpass';
  flt.frequency.setValueAtTime(f0,t);
  flt.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=a.createGain();
  env(g,t,0.012,vol,dur);
  src.connect(flt);flt.connect(g);g.connect(master);
  src.start(t);src.stop(t+dur+0.2);
}
const SFX={
  shoot(){blip('square',900,220,0.16,0.12);},
  eShoot(){blip('square',460,150,0.18,0.09);},
  bang(size){
    if(size>=3)noise(0.7,0.5,900,60);
    else if(size===2)noise(0.45,0.4,1400,120);
    else noise(0.3,0.35,2200,200);
  },
  saucerBang(small){noise(small?0.4:0.6,0.45,700,80);},
  shipBang(){noise(1.1,0.55,600,40);blip('sawtooth',150,35,0.9,0.2);},
  beat(hi){blip('sine',hi?125:95,hi?95:70,0.12,0.38);},
  extra(){blip('square',520,1040,0.35,0.2);},
  hyper(){blip('sawtooth',200,1400,0.3,0.15);}
};
let thrustSrc=null,thrustGain=null;
function thrustOn(){
  const a=audio();if(!a||thrustSrc)return;
  const src=a.createBufferSource();
  src.buffer=makeNoise(a);src.loop=true;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const g=a.createGain();g.gain.value=0;
  g.gain.setTargetAtTime(0.35,a.currentTime,0.05);
  src.connect(f);f.connect(g);g.connect(master);
  src.start();
  thrustSrc=src;thrustGain=g;
}
function thrustOff(){
  if(!thrustSrc)return;
  try{
    thrustGain.gain.setTargetAtTime(0,AC.currentTime,0.05);
    thrustSrc.stop(AC.currentTime+0.3);
  }catch(e){}
  thrustSrc=null;thrustGain=null;
}
let saucerOsc=null,saucerLfo=null;
function saucerSoundOn(){
  const a=audio();if(!a||saucerOsc)return;
  const o=a.createOscillator();o.type='square';o.frequency.value=140;
  const l=a.createOscillator();l.type='sine';l.frequency.value=9;
  const lg=a.createGain();lg.gain.value=45;
  l.connect(lg);lg.connect(o.frequency);
  const g=a.createGain();g.gain.value=0.05;
  o.connect(g);g.connect(master);
  o.start();l.start();
  saucerOsc=o;saucerLfo=l;
}
function saucerSoundOff(){
  if(!saucerOsc)return;
  try{saucerOsc.stop();saucerLfo.stop();}catch(e){}
  saucerOsc=null;saucerLfo=null;
}

/* ---------------- helpers ---------------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const d2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};
function wrapObj(o,m){
  if(o.x<-m)o.x=W+m;else if(o.x>W+m)o.x=-m;
  if(o.y<-m)o.y=H+m;else if(o.y>H+m)o.y=-m;
}

/* ---------------- game state ---------------- */
let state='menu'; // menu | playing | paused | gameover
let score=0,hi=0,lives=3,wave=0,nextExtra=10000;
try{hi=parseInt(localStorage.getItem('ast_hi'),10)||0;}catch(e){}
let asteroids=[],bullets=[],saucers=[],parts=[],debris=[];
let ship=null,respawnT=0,clearT=0,bannerD=1,saucerT=999;
let fireT=0,hyperT=0,shake=0,flashT=0,beatT=0,beatHi=false,units0=1;

const AST_R={1:14,2:26,3:46};
const AST_SCORE={1:100,2:50,3:20};

function newShip(){
  return {x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,thrust:false,invuln:2.6};
}
function makeAsteroid(x,y,size,vx,vy){
  const n=9+((Math.random()*5)|0),shape=[];
  for(let i=0;i<n;i++)shape.push(rnd(0.7,1.15));
  return {x,y,size,r:AST_R[size],shape,rot:Math.random()*TAU,
          vr:rnd(-1.4,1.4),vx,vy};
}
function edgeAsteroid(){
  const side=(Math.random()*4)|0;
  let x,y;
  if(side===0){x=rnd(0,W);y=-60;}
  else if(side===1){x=rnd(0,W);y=H+60;}
  else if(side===2){x=-60;y=rnd(0,H);}
  else{x=W+60;y=rnd(0,H);}
  const tx=rnd(W*0.2,W*0.8),ty=rnd(H*0.2,H*0.8);
  const a=Math.atan2(ty-y,tx-x)+rnd(-0.5,0.5);
  const sp=rnd(38,72)+wave*6;
  return makeAsteroid(x,y,3,Math.cos(a)*sp,Math.sin(a)*sp);
}
function makeSaucer(){
  const small=Math.random()<Math.min(0.2+wave*0.15,0.85);
  const dir=Math.random()<0.5?1:-1;
  return {x:dir>0?-50:W+50,y:rnd(70,Math.max(120,H-70)),dir,small,
          r:small?13:22,vy:0,vyt:rnd(-120,120),turnT:rnd(0.7,1.6),
          fireT:1.2,life:0};
}
function nextSaucerDelay(){return Math.max(6,15-wave)+rnd(0,7);}

function spawnWave(){
  const count=Math.min(3+wave,9);
  for(let i=0;i<count;i++)asteroids.push(edgeAsteroid());
  units0=asteroids.reduce((s,a)=>s+a.size,0);
  saucerT=wave===1?rnd(13,20):nextSaucerDelay();
}
function startGame(){
  score=0;lives=3;wave=1;nextExtra=10000;
  asteroids=[];bullets=[];saucers=[];parts=[];debris=[];
  saucerSoundOff();thrustOff();
  ship=newShip();
  respawnT=0;clearT=1.6;bannerD=1.6;fireT=0;hyperT=0;shake=0;flashT=0;
  saucerT=999;beatT=0;
  state='playing';
}
function enterMenu(){
  state='menu';
  asteroids=[];bullets=[];saucers=[];parts=[];debris=[];
  ship=null;thrustOff();saucerSoundOff();
  for(let i=0;i<7;i++){
    const size=1+((Math.random()*3)|0);
    const a=rnd(0,TAU),sp=rnd(15,45);
    asteroids.push(makeAsteroid(rnd(0,W),rnd(0,H),size,
      Math.cos(a)*sp,Math.sin(a)*sp));
  }
}
function saveHi(){try{localStorage.setItem('ast_hi',String(hi));}catch(e){}}
function addScore(n){
  score+=n;
  if(score>hi)hi=score;
  if(score>=nextExtra){nextExtra+=10000;lives++;flashT=2;SFX.extra();}
}

/* ---------------- effects ---------------- */
function burst(x,y,n,sp){
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU),s=sp*rnd(0.25,1),L=rnd(0.4,1.1);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:L,life0:L});
  }
}
function addDebris(x,y,vx,vy,n,len){
  for(let i=0;i<n;i++){
    const L=rnd(0.6,1.3);
    debris.push({x:x+rnd(-6,6),y:y+rnd(-6,6),
      vx:vx*0.3+rnd(-25,25),vy:vy*0.3+rnd(-25,25),
      a:rnd(0,TAU),va:rnd(-5,5),len:rnd(3,len),life:L,life0:L});
  }
}

/* ---------------- combat ---------------- */
function destroyAsteroid(j){
  const a=asteroids[j];
  asteroids.splice(j,1);
  addScore(AST_SCORE[a.size]);
  SFX.bang(a.size);
  burst(a.x,a.y,6+a.size*5,50+a.size*35);
  addDebris(a.x,a.y,a.vx,a.vy,3+a.size*2,4+a.size*4);
  shake=Math.min(shake+a.size*3,22);
  if(a.size>1){
    for(let k=0;k<2;k++){
      const ang=rnd(0,TAU),sp=rnd(55,95)+wave*7;
      asteroids.push(makeAsteroid(a.x,a.y,a.size-1,
        a.vx*0.35+Math.cos(ang)*sp,a.vy*0.35+Math.sin(ang)*sp));
    }
  }
}
function killSaucer(j){
  const s=saucers[j];
  saucers.splice(j,1);
  addScore(s.small?1000:200);
  SFX.saucerBang(s.small);
  burst(s.x,s.y,18,120);
  addDebris(s.x,s.y,s.dir*80,0,6,10);
  shake=Math.min(shake+10,24);
  if(!saucers.length){saucerSoundOff();saucerT=nextSaucerDelay();}
}
function shipDeath(){
  if(!ship)return;
  burst(ship.x,ship.y,26,150);
  addDebris(ship.x,ship.y,ship.vx,ship.vy,7,14);
  SFX.shipBang();
  shake=Math.min(shake+18,28);
  ship=null;
  thrustOff();
  lives--;
  if(lives<=0){
    state='gameover';
    saucerSoundOff();
    saveHi();
  }else respawnT=2.2;
}
function hyperspace(){
  if(!ship||hyperT>0)return;
  hyperT=5;
  burst(ship.x,ship.y,14,90);
  ship.x=rnd(70,W-70);ship.y=rnd(70,H-70);
  ship.vx*=0.25;ship.vy*=0.25;
  ship.invuln=Math.max(ship.invuln,1.0);
  burst(ship.x,ship.y,14,90);
  SFX.hyper();
}
function areaClear(){
  for(const a of asteroids){
    if(Math.hypot(a.x-W/2,a.y-H/2)<a.r+140)return false;
  }
  for(const s of saucers){
    if(Math.hypot(s.x-W/2,s.y-H/2)<240)return false;
  }
  return true;
}
function playerBulletCount(){
  return bullets.reduce((n,b)=>n+(b.enemy?0:1),0);
}

/* ---------------- update ---------------- */
function updateSaucers(dt){
  for(let i=saucers.length-1;i>=0;i--){
    const s=saucers[i];
    s.life+=dt;
    s.x+=s.dir*(s.small?160:105)*dt;
    s.turnT-=dt;
    if(s.turnT<=0){s.turnT=rnd(0.7,1.6);s.vyt=rnd(-150,150);}
    s.vy+=(s.vyt-s.vy)*Math.min(1,dt*2.5);
    s.y+=s.vy*dt;
    if(s.y<40){s.y=40;s.vyt=Math.abs(s.vyt);}
    if(s.y>H-40){s.y=H-40;s.vyt=-Math.abs(s.vyt);}
    if(s.life>16){
      saucers.splice(i,1);
      saucerSoundOff();
      saucerT=nextSaucerDelay();
      continue;
    }
    if(state==='playing'&&ship){
      s.fireT-=dt;
      if(s.fireT<=0){
        s.fireT=s.small?0.85:1.35;
        const ta=Math.atan2(ship.y-s.y,ship.x-s.x);
        const err=(Math.random()-0.5)*
          (s.small?Math.max(0.14,0.55-wave*0.06):1.0);
        const ba=ta+err;
        const sp=Math.min(430,250+wave*12);
        bullets.push({x:s.x,y:s.y+3,
          vx:Math.cos(ba)*sp,vy:Math.sin(ba)*sp,life:1.5,enemy:true});
        SFX.eShoot();
      }
    }
  }
}
function moveWorld(dt){
  for(const a of asteroids){
    a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.vr*dt;
    wrapObj(a,a.r+20);
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0)bullets.splice(i,1);
    else wrapObj(b,6);
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const f=Math.exp(-1.2*dt);
    p.vx*=f;p.vy*=f;
    p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.a+=d.va*dt;
    d.life-=dt;
    if(d.life<=0)debris.splice(i,1);
  }
}
function collisions(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.enemy)continue;
    let hit=false;
    for(let j=asteroids.length-1;j>=0;j--){
      const a=asteroids[j],rr=a.r*0.9+2;
      if(d2(b,a)<rr*rr){destroyAsteroid(j);hit=true;break;}
    }
    if(!hit)for(let j=saucers.length-1;j>=0;j--){
      const s=saucers[j],rr=s.r+3;
      if(d2(b,s)<rr*rr){killSaucer(j);hit=true;break;}
    }
    if(hit)bullets.splice(i,1);
  }
  if(!ship||ship.invuln>0)return;
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(!b.enemy)continue;
    if(d2(b,ship)<100){bullets.splice(i,1);shipDeath();return;}
  }
  for(let j=asteroids.length-1;j>=0;j--){
    const a=asteroids[j],rr=a.r*0.8+8;
    if(d2(a,ship)<rr*rr){shipDeath();return;}
  }
  for(let j=saucers.length-1;j>=0;j--){
    const s=saucers[j],rr=s.r+8;
    if(d2(s,ship)<rr*rr){killSaucer(j);shipDeath();return;}
  }
}
function update(dt){
  if(state==='paused')return;
  if(state==='menu'||state==='gameover'){
    updateSaucers(dt);
    moveWorld(dt);
    return;
  }
  /* --- playing: ship --- */
  if(ship){
    const ROT=3.5;
    if(keys.ArrowLeft||keys.KeyA)ship.a-=ROT*dt;
    if(keys.ArrowRight||keys.KeyD)ship.a+=ROT*dt;
    const thr=!!(keys.ArrowUp||keys.KeyW);
    ship.thrust=thr;
    if(thr){
      ship.vx+=Math.cos(ship.a)*300*dt;
      ship.vy+=Math.sin(ship.a)*300*dt;
      thrustOn();
    }else thrustOff();
    const sp=Math.hypot(ship.vx,ship.vy);
    if(sp>520){ship.vx*=520/sp;ship.vy*=520/sp;}
    const fr=Math.exp(-0.4*dt);
    ship.vx*=fr;ship.vy*=fr;
    ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
    wrapObj(ship,24);
    if(ship.invuln>0)ship.invuln-=dt;
    fireT-=dt;
    if(keys.Space&&fireT<=0&&playerBulletCount()<5){
      fireT=0.17;
      bullets.push({x:ship.x+Math.cos(ship.a)*18,
                    y:ship.y+Math.sin(ship.a)*18,
                    vx:ship.vx+Math.cos(ship.a)*520,
                    vy:ship.vy+Math.sin(ship.a)*520,
                    life:1.15,enemy:false});
      SFX.shoot();
      ship.invuln=0;
    }
  }else{
    thrustOff();
    respawnT-=dt;
    if(respawnT<=0){
      if(areaClear())ship=newShip();
      else respawnT=0.4;
    }
  }
  hyperT=Math.max(0,hyperT-dt);
  flashT=Math.max(0,flashT-dt);
  /* --- saucers --- */
  if(!saucers.length&&clearT<=0&&asteroids.length>0){
    saucerT-=dt;
    if(saucerT<=0){saucers.push(makeSaucer());saucerT=999;}
  }
  if(saucers.length)saucerSoundOn();else saucerSoundOff();
  updateSaucers(dt);
  moveWorld(dt);
  collisions();
  /* --- heartbeat --- */
  if(clearT<=0&&asteroids.length>0){
    beatT-=dt;
    if(beatT<=0){
      const units=asteroids.reduce((s,a)=>s+a.size,0);
      const frac=Math.max(0,1-units/units0);
      beatT=0.95-0.6*frac;
      beatHi=!beatHi;
      SFX.beat(beatHi);
    }
  }
  /* --- wave progression --- */
  if(clearT>0){
    clearT-=dt;
    if(clearT<=0&&asteroids.length===0)spawnWave();
  }else if(asteroids.length===0&&saucers.length===0&&!bullets.some(b=>b.enemy)){
    wave++;clearT=2.0;bannerD=2.0;
    bullets=bullets.filter(b=>!b.enemy);
  }
  shake=Math.max(0,shake-40*dt);
}

/* ---------------- render ---------------- */
function glowStroke(build,width,color,mul){
  const m=(mul==null)?1:mul;
  ctx.save();
  build();
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle=color||'#e9edff';
  ctx.globalAlpha=m*0.16;
  ctx.lineWidth=(width||1.6)*3.4;
  ctx.stroke();
  ctx.globalAlpha=m;
  ctx.lineWidth=width||1.6;
  ctx.stroke();
  ctx.restore();
}
function drawShip(t){
  const s=ship;
  let mul=1;
  if(s.invuln>0)mul=(Math.floor(t*14)%2===0)?0.9:0.15;
  glowStroke(()=>{
    ctx.translate(s.x,s.y);ctx.rotate(s.a);
    ctx.beginPath();
    ctx.moveTo(16,0);ctx.lineTo(-12,10);ctx.lineTo(-7,0);ctx.lineTo(-12,-10);
    ctx.closePath();
  },1.8,'#e9edff',mul);
  if(s.thrust&&Math.random()<0.85){
    glowStroke(()=>{
      ctx.translate(s.x,s.y);ctx.rotate(s.a);
      ctx.beginPath();
      const L=22+Math.random()*7;
      ctx.moveTo(-8,5);ctx.lineTo(-L,0);ctx.lineTo(-8,-5);
      ctx.closePath();
    },1.4,'#ffb454',mul);
  }
}
function drawAsteroid(a){
  glowStroke(()=>{
    ctx.translate(a.x,a.y);ctx.rotate(a.rot);
    ctx.beginPath();
    const n=a.shape.length;
    for(let i=0;i<n;i++){
      const ang=i/n*TAU,r=a.shape[i]*a.r;
      const px=Math.cos(ang)*r,py=Math.sin(ang)*r;
      if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);
    }
    ctx.closePath();
  },1.6);
}
function drawSaucer(s){
  const k=s.r/20;
  glowStroke(()=>{
    ctx.translate(s.x,s.y);ctx.scale(k,k);
    ctx.beginPath();
    ctx.moveTo(-8,-6);ctx.lineTo(8,-6);ctx.lineTo(20,1);
    ctx.lineTo(9,9);ctx.lineTo(-9,9);ctx.lineTo(-20,1);
    ctx.closePath();
    ctx.moveTo(-20,1);ctx.lineTo(20,1);
    ctx.moveTo(-4,-6);ctx.lineTo(-4,-12);ctx.lineTo(4,-12);ctx.lineTo(4,-6);
  },1.6,s.small?'#ffd9a0':'#e9edff');
}
function drawBullets(){
  for(const b of bullets){
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=0.22;
    ctx.beginPath();ctx.arc(b.x,b.y,4.5,0,TAU);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=b.enemy?'#ffd2a0':'#ffffff';
    ctx.beginPath();ctx.arc(b.x,b.y,2.2,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawParts(){
  ctx.fillStyle='#ffffff';
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.life0)*0.9;
    ctx.fillRect(p.x-1,p.y-1,2,2);
  }
  ctx.globalAlpha=1;
}
function drawDebris(){
  ctx.strokeStyle='#cfd6ff';
  ctx.lineWidth=1.2;ctx.lineCap='round';
  for(const d of debris){
    ctx.globalAlpha=Math.min(1,d.life/d.life0)*0.8;
    const dx=Math.cos(d.a)*d.len/2,dy=Math.sin(d.a)*d.len/2;
    ctx.beginPath();
    ctx.moveTo(d.x-dx,d.y-dy);
    ctx.lineTo(d.x+dx,d.y+dy);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function text(str,x,y,size,align,alpha,color){
  ctx.save();
  ctx.globalAlpha=(alpha==null)?1:alpha;
  ctx.fillStyle=color||'#e9edff';
  ctx.font='700 '+size+'px '+FONT;
  ctx.textAlign=align||'center';
  ctx.textBaseline='middle';
  ctx.fillText(str,x,y);
  ctx.restore();
}
function spaced(str,x,y,size,ls){
  ctx.save();
  ctx.font='700 '+size+'px '+FONT;
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle='#e9edff';
  const chars=[...str];
  const ws=chars.map(c=>ctx.measureText(c).width);
  const total=ws.reduce((a,b)=>a+b,0)+ls*(chars.length-1);
  let cx=x-total/2;
  chars.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=ws[i]+ls;});
  ctx.restore();
}
function drawLifeIcon(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.strokeStyle='#e9edff';
  ctx.lineWidth=1.5;ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(0,-9);ctx.lineTo(7,8);ctx.lineTo(0,4);ctx.lineTo(-7,8);
  ctx.closePath();ctx.stroke();
  ctx.restore();
}
function drawHUD(t){
  text('SCORE '+String(score).padStart(6,'0'),18,26,20,'left');
  text('HI '+String(hi).padStart(6,'0'),W-18,26,18,'right',0.8);
  if(muted)text('SOUND OFF',W-18,50,13,'right',0.55);
  for(let i=0;i<lives;i++)drawLifeIcon(26+i*26,58);
  text('WAVE '+wave,18,H-22,14,'left',0.55);
  text(hyperT>0?'HYPERSPACE '+Math.ceil(hyperT):'HYPERSPACE READY',
       W-18,H-22,13,'right',hyperT>0?0.35:0.6);
  if(clearT>0&&state==='playing'){
    const a=Math.max(0,Math.min(1,Math.min(clearT/0.35,(bannerD-clearT)/0.35)));
    text('WAVE '+wave,W/2,H*0.42,42,'center',a);
  }
  if(flashT>0)text('+1 SHIP',W/2,H*0.55,18,'center',Math.min(1,flashT),'#ffd9a0');
}
function drawOverlay(t){
  if(state==='menu'){
    spaced('ASTEROIDS',W/2,H*0.3,Math.min(76,W/9),Math.min(14,W/60));
    const blink=0.55+0.45*Math.sin(t*4);
    text('PRESS ENTER TO PLAY',W/2,H*0.46,20,'center',blink);
    if(hi>0)text('HIGH SCORE '+String(hi).padStart(6,'0'),
                 W/2,H*0.53,15,'center',0.6);
    const cy=H*0.64,lh=24;
    text('ROTATE ..... ARROWS OR A / D',W/2,cy,14,'center',0.6);
    text('THRUST ..... UP OR W',W/2,cy+lh,14,'center',0.6);
    text('FIRE ....... SPACE',W/2,cy+lh*2,14,'center',0.6);
    text('HYPERSPACE . H    PAUSE . P',W/2,cy+lh*3,14,'center',0.6);
    text('SOUND ...... M',W/2,cy+lh*4,14,'center',0.6);
  }else if(state==='paused'){
    ctx.fillStyle='rgba(2,3,8,0.6)';
    ctx.fillRect(0,0,W,H);
    text('PAUSED',W/2,H*0.44,36);
    text('PRESS P TO RESUME',W/2,H*0.54,16,'center',
         0.6+0.3*Math.sin(t*4));
  }else if(state==='gameover'){
    ctx.fillStyle='rgba(2,3,8,0.45)';
    ctx.fillRect(0,0,W,H);
    text('GAME OVER',W/2,H*0.36,44);
    text('SCORE '+String(score).padStart(6,'0'),W/2,H*0.46,22);
    if(score>=hi&&score>0)
      text('NEW HIGH SCORE',W/2,H*0.53,16,'center',
           0.6+0.4*Math.sin(t*5),'#ffd9a0');
    text('PRESS ENTER TO PLAY AGAIN',W/2,H*0.62,18,'center',
         0.55+0.45*Math.sin(t*4));
  }
}
function draw(){
  const t=performance.now()/1000;
  ctx.fillStyle='#04050a';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#cdd6ff';
  for(const s of stars){
    ctx.globalAlpha=0.18+0.5*(0.5+0.5*Math.sin(t*s.s+s.p));
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  ctx.save();
  if(shake>0.2)ctx.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);
  drawDebris();
  drawParts();
  for(const a of asteroids)drawAsteroid(a);
  for(const s of saucers)drawSaucer(s);
  drawBullets();
  if(ship&&state!=='menu')drawShip(t);
  ctx.restore();
  if(state!=='menu')drawHUD(t);
  drawOverlay(t);
}

/* ---------------- input ---------------- */
const keys=Object.create(null);
const PREVENT=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space']);
window.addEventListener('keydown',e=>{
  if(PREVENT.has(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.repeat)return;
  audio();
  if(e.code==='Enter'||e.code==='NumpadEnter'){
    if(state==='menu'||state==='gameover')startGame();
    else if(state==='paused')state='playing';
  }else if(e.code==='KeyP'||e.code==='Escape'){
    if(state==='playing'){state='paused';thrustOff();saucerSoundOff();}
    else if(state==='paused')state='playing';
  }else if(e.code==='KeyM'){
    muted=!muted;
    if(master)master.gain.value=muted?0:0.5;
    if(muted){thrustOff();saucerSoundOff();}
  }else if(e.code==='KeyH'){
    if(state==='playing')hyperspace();
  }
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{
  for(const k in keys)keys[k]=false;
  if(state==='playing'){state='paused';thrustOff();saucerSoundOff();}
});
canvas.addEventListener('pointerdown',()=>{
  audio();
  if(state==='menu'||state==='gameover')startGame();
  else if(state==='paused')state='playing';
});

/* ---------------- main loop ---------------- */
enterMenu();
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;
  last=now;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
