<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsegrid — Web Audio Step Sequencer</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #12161f;
    --panel2: #171c28;
    --line: #232a3a;
    --text: #e8ecf4;
    --dim: #8b94a8;
    --accent: #46d8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 26px 16px 44px;
  }
  .app { max-width: 1024px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  header { text-align: center; }
  header h1 {
    font-size: 30px; letter-spacing: 8px; font-weight: 800;
    background: linear-gradient(90deg, #46d8ff, #7ce38b 55%, #b78cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { color: var(--dim); font-size: 13px; margin-top: 6px; letter-spacing: .4px; }

  .panel {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.38);
  }

  /* ---------- transport ---------- */
  .transport { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .play-btn {
    width: 60px; height: 60px; border-radius: 50%;
    border: none; cursor: pointer; flex: none;
    font-size: 22px; line-height: 1; color: #04121a;
    background: linear-gradient(135deg, #46d8ff, #7ce38b);
    box-shadow: 0 6px 20px rgba(70,216,255,.35);
    transition: transform .1s ease, box-shadow .2s ease;
  }
  .play-btn:active { transform: scale(.93); }
  .play-btn.on {
    background: linear-gradient(135deg, #ff5470, #ffa928);
    box-shadow: 0 6px 20px rgba(255,84,112,.42);
  }
  .readout {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 52px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px;
    background: #0d1119;
  }
  .readout span { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .readout label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); }
  .ctrl { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 128px; }
  .ctrl label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--dim); display: flex; justify-content: space-between; gap: 8px;
  }
  .ctrl output { color: var(--text); font-weight: 700; }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  select {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  .ghost {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost.danger:hover { border-color: #ff5470; color: #ff5470; }

  #scope {
    width: 100%; height: 56px; display: block;
    border-radius: 10px; background: #0d1119; border: 1px solid var(--line);
  }

  /* ---------- grids ---------- */
  .section-title {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--dim);
  }
  .section-title .spacer { flex: 1; }
  #drumSection { --labelw: 212px; }
  #bassSection { --labelw: 96px; --c: #f0abfc; }
  .scroll { overflow-x: auto; padding-bottom: 4px; }
  .g16, .steps-head {
    display: grid;
    grid-template-columns: var(--labelw, 200px) repeat(16, minmax(26px, 1fr));
    gap: 5px; min-width: 790px;
  }
  .steps-head { margin-bottom: 7px; }
  .snum { text-align: center; font-size: 11px; color: var(--dim); user-select: none; }
  .snum.beat { color: var(--text); font-weight: 700; }
  .snum.ph { color: var(--accent); }

  .tlabel { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .tlabel .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
  .tname { font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tname:hover { color: var(--c); }
  .mute {
    width: 21px; height: 21px; font-size: 10px; font-weight: 700; flex: none;
    border-radius: 5px; border: 1px solid var(--line);
    background: transparent; color: var(--dim); cursor: pointer;
  }
  .mute:hover { border-color: #ff5470; color: #ff5470; }
  .mute.active { background: #ff5470; border-color: #ff5470; color: #fff; }
  .tvol { width: 92%; height: 12px; }

  .cell {
    height: 34px; border-radius: 7px;
    border: 1px solid var(--line);
    background: #1a2030;
    cursor: pointer;
    transition: background .08s, box-shadow .12s;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  .cell.alt { background: #151a27; }
  .cell:hover { border-color: #3d4a63; }
  .cell.on {
    background: var(--c); border-color: var(--c);
    box-shadow: 0 0 11px color-mix(in srgb, var(--c) 55%, transparent);
  }
  .cell.ph { box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), 0 0 9px rgba(255,255,255,.10); }
  .cell.on.ph { filter: brightness(1.30) saturate(1.15); }
  .cell.hit { animation: pop .16s ease-out; }
  @keyframes pop {
    0% { transform: scale(1.22); filter: brightness(1.9); }
    100% { transform: scale(1); }
  }
  .row { margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .row.muted .cell { opacity: .32; }
  .row.muted .tname { opacity: .4; text-decoration: line-through; }
  #rollGrid.muted .cell { opacity: .32; }

  .roll .cell, .rcell { height: 21px; border-radius: 5px; }
  .rlabel {
    text-align: left; font-size: 11px; color: var(--dim);
    background: transparent; border: none; cursor: pointer;
    padding-left: 6px; letter-spacing: .5px; user-select: none;
  }
  .rlabel.root { color: var(--accent); font-weight: 700; }
  .rlabel:hover { color: var(--text); }

  footer { text-align: center; color: var(--dim); font-size: 12px; letter-spacing: .3px; }
  kbd {
    background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: inherit;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>PULSEGRID</h1>
    <p class="tag">16-step drum machine &amp; bassline sequencer — pure Web Audio API, no dependencies</p>
  </header>

  <div class="transport panel">
    <button id="playBtn" class="play-btn" title="Play / stop (Space)">&#9654;</button>
    <div class="readout"><span id="stepReadout">&ndash;</span><label>step</label></div>
    <div class="ctrl">
      <label for="bpm">Tempo <output id="bpmVal">122</output></label>
      <input type="range" id="bpm" min="60" max="180" step="1" value="122">
    </div>
    <div class="ctrl">
      <label for="swing">Swing <output id="swingVal">0%</output></label>
      <input type="range" id="swing" min="0" max="60" step="1" value="0">
    </div>
    <div class="ctrl">
      <label for="vol">Master <output id="volVal">80%</output></label>
      <input type="range" id="vol" min="0" max="100" step="1" value="80">
    </div>
    <div class="ctrl" style="min-width:110px">
      <label for="preset">Pattern</label>
      <select id="preset">
        <option value="">&mdash; load &mdash;</option>
        <option value="house">House</option>
        <option value="techno">Techno</option>
        <option value="trap">Trap</option>
        <option value="breaks">Breaks</option>
      </select>
    </div>
    <button id="randomBtn" class="ghost" title="Generate a random pattern">Random</button>
    <button id="clearBtn" class="ghost danger" title="Erase everything">Clear</button>
  </div>

  <canvas id="scope" width="600" height="56"></canvas>

  <section class="panel" id="drumSection">
    <div class="section-title">Drum Machine</div>
    <div class="scroll">
      <div class="steps-head" id="drumHead"></div>
      <div id="drumGrid"></div>
    </div>
  </section>

  <section class="panel" id="bassSection">
    <div class="section-title">
      Bassline
      <select id="root" title="Root note"></select>
      <select id="scale" title="Scale"></select>
      <span class="spacer"></span>
      <button class="mute" data-track="bass" title="Mute bass">M</button>
    </div>
    <div class="scroll">
      <div class="steps-head" id="rollHead"></div>
      <div id="rollGrid"></div>
    </div>
  </section>

  <footer>
    <kbd>Space</kbd> play / stop &nbsp;&middot;&nbsp; click cells to toggle &nbsp;&middot;&nbsp; drag to paint
    &nbsp;&middot;&nbsp; click a track or note name to audition &nbsp;&middot;&nbsp; pattern auto-saves locally
  </footer>
</div>

<script>
(() => {
'use strict';

/* ============================== constants ============================== */

const STEPS = 16;
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  'Minor Pentatonic': [0,3,5,7,10],
  'Major Pentatonic': [0,2,4,7,9],
  'Natural Minor':    [0,2,3,5,7,8,10],
  'Major':            [0,2,4,5,7,9,11],
};
const TRACKS = [
  { id:'kick',  name:'Kick',       color:'#ff5470', level:0.90 },
  { id:'snare', name:'Snare',      color:'#ffa928', level:0.80 },
  { id:'clap',  name:'Clap',       color:'#ffe066', level:0.70 },
  { id:'chat',  name:'Closed Hat', color:'#46d8ff', level:0.55 },
  { id:'ohat',  name:'Open Hat',   color:'#5ef2a4', level:0.50 },
  { id:'tom',   name:'Tom',        color:'#b78cff', level:0.70 },
];
const BASS_COLOR = '#f0abfc';
const LOOKAHEAD_MS = 25;      // scheduler wake-up interval
const SCHEDULE_AHEAD = 0.15;  // seconds scheduled in advance

const PRESETS = {
  house: {
    bpm: 124, swing: 0, root: 9, scale: 'Minor Pentatonic',
    drums: {
      kick: 'x...x...x...x...',
      clap: '....x.......x...',
      chat: 'x.x.x.x.x.x.x.x.',
      ohat: '..x...x...x...x.',
    },
    bass: [0,null,5,null, 0,null,5,null, 0,null,5,null, 3,null,4,null],
  },
  techno: {
    bpm: 132, swing: 0, root: 9, scale: 'Minor Pentatonic',
    drums: {
      kick: 'x...x...x...x...',
      clap: '....x.......x...',
      chat: 'x.x.x.x.x.x.x.x.',
      ohat: '..x...x...x...x.',
      tom:  '.............x..',
    },
    bass: [0,3,0,5, 0,3,0,7, 0,3,0,5, 8,7,5,3],
  },
  trap: {
    bpm: 140, swing: 0, root: 9, scale: 'Minor Pentatonic',
    drums: {
      kick:  'x......x..x.....',
      snare: '........x.......',
      chat:  'x.x.x.xxx.x.x.xx',
    },
    bass: [0,null,null,null, 0,null,3,null, 5,null,null,null, 4,null,null,null],
  },
  breaks: {
    bpm: 110, swing: 12, root: 9, scale: 'Minor Pentatonic',
    drums: {
      kick:  'x..x..x...x.....',
      snare: '....x.....x.x...',
      chat:  'x.x.x.x.x.x.x.x.',
      tom:   '...........x....',
    },
    bass: [0,null,null,0, null,null,3,null, 5,null,5,null, 4,3,null,null],
  },
};

/* ============================== state ============================== */

const defaultState = () => ({
  bpm: 122,
  swing: 0,
  volume: 0.8,
  root: 9,
  scale: 'Minor Pentatonic',
  drums: Object.fromEntries(TRACKS.map(t => [t.id, new Array(STEPS).fill(false)])),
  bass: new Array(STEPS).fill(null),
  mutes: Object.fromEntries(TRACKS.map(t => [t.id, false]).concat([['bass', false]])),
  levels: Object.fromEntries(TRACKS.map(t => [t.id, t.level]).concat([['bass', 0.8]])),
});

let state = defaultState();
try {
  const saved = JSON.parse(localStorage.getItem('pulsegrid-v1') || 'null');
  if (saved && typeof saved === 'object') {
    state = { ...defaultState(), ...saved };
    TRACKS.forEach(t => {
      const d = state.drums && state.drums[t.id];
      if (!Array.isArray(d)) state.drums[t.id] = new Array(STEPS).fill(false);
      else state.drums[t.id].length = STEPS;
    });
    if (!Array.isArray(state.bass)) state.bass = new Array(STEPS).fill(null);
    else state.bass.length = STEPS;
    if (!state.mutes || typeof state.mutes !== 'object') state.mutes = defaultState().mutes;
    if (!state.levels || typeof state.levels !== 'object') state.levels = defaultState().levels;
    if (!SCALES[state.scale]) state.scale = 'Minor Pentatonic';
    if (typeof state.root !== 'number' || state.root < 0 || state.root > 11) state.root = 9;
    state.bpm = Math.min(180, Math.max(60, +state.bpm || 122));
    state.swing = Math.min(60, Math.max(0, +state.swing || 0));
    state.volume = Math.min(1, Math.max(0, +state.volume || 0));
  }
} catch (e) { /* corrupted storage: fall back to defaults */ }

function save() {
  try { localStorage.setItem('pulsegrid-v1', JSON.stringify(state)); } catch (e) { /* ignore */ }
}

/* ============================== audio engine ============================== */

let ctx = null, master = null, analyser = null, noiseBuf = null;
const trackGain = {};

function ensureAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = state.volume;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 20;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;

    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;

    master.connect(comp);
    comp.connect(analyser);
    analyser.connect(ctx.destination);

    const mk = (v) => { const g = ctx.createGain(); g.gain.value = v; g.connect(master); return g; };
    TRACKS.forEach(t => { trackGain[t.id] = mk(state.levels[t.id]); });
    trackGain.bass = mk(state.levels.bass);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

const noiseSrc = () => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s; };
const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);

function playKick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.09);
  o.frequency.exponentialRampToValueAtTime(28, t + 0.40);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(1.0, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  o.connect(g); g.connect(trackGain.kick);
  o.start(t); o.stop(t + 0.45);
}

function playSnare(t) {
  const n = noiseSrc();
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.7, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  n.connect(bp); bp.connect(hp); hp.connect(g); g.connect(trackGain.snare);
  n.start(t); n.stop(t + 0.25);

  const o = ctx.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.10);
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.6, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(og); og.connect(trackGain.snare);
  o.start(t); o.stop(t + 0.15);
}

function playClap(t) {
  const n = noiseSrc();
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.4;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  [0, 0.012, 0.024].forEach((off, i) => {
    g.gain.setValueAtTime(i === 2 ? 0.7 : 0.4, t + off);
    g.gain.exponentialRampToValueAtTime(0.05, t + off + 0.010);
  });
  g.gain.setValueAtTime(0.5, t + 0.036);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  n.connect(bp); bp.connect(g); g.connect(trackGain.clap);
  n.start(t); n.stop(t + 0.30);
}

function playHat(t, open) {
  const n = noiseSrc();
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
  const g = ctx.createGain();
  const dur = open ? 0.38 : 0.06;
  g.gain.setValueAtTime(open ? 0.45 : 0.35, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(hp); hp.connect(g); g.connect(trackGain[open ? 'ohat' : 'chat']);
  n.start(t); n.stop(t + dur + 0.02);
}

function playTom(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.25);
  g.gain.setValueAtTime(0.8, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
  o.connect(g); g.connect(trackGain.tom);
  o.start(t); o.stop(t + 0.32);
}

function playBass(t, freq, dur) {
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
  const o2 = ctx.createOscillator(); o2.type = 'sine';     o2.frequency.value = freq / 2;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 8;
  f.frequency.setValueAtTime(180, t);
  f.frequency.exponentialRampToValueAtTime(1500, t + 0.03);
  f.frequency.exponentialRampToValueAtTime(220, t + Math.max(0.05, dur));
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.55, t + 0.008);
  g.gain.setTargetAtTime(0.0001, t + dur * 0.72, 0.035);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(trackGain.bass);
  o1.start(t); o2.start(t);
  o1.stop(t + dur + 0.25); o2.stop(t + dur + 0.25);
}

const VOICES = {
  kick:  playKick,
  snare: playSnare,
  clap:  playClap,
  chat:  (t) => playHat(t, false),
  ohat:  (t) => playHat(t, true),
  tom:   playTom,
};

function audition(id) {
  const c = ensureAudio();
  if (VOICES[id]) VOICES[id](c.currentTime + 0.001);
}
function auditionBassRow(rowIdx) {
  if (rowIdx == null || rowIdx < 0 || rowIdx >= currentRows.length) return;
  const c = ensureAudio();
  playBass(c.currentTime + 0.001, midiToFreq(currentRows[rowIdx]), stepDur() * 2);
}

/* ============================== scheduler ============================== */

let playing = false;
let currentStep = 0;
let nextNoteTime = 0;
let timerID = null;
const drawQueue = [];

const stepDur = () => 60 / state.bpm / 4;
let currentRows = []; // midi numbers, ascending; index 0 = lowest

function scheduler() {
  // resync after tab throttling instead of flooding past events
  if (nextNoteTime < ctx.currentTime - 0.25) nextNoteTime = ctx.currentTime + 0.05;
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    const swingOff = (currentStep % 2 === 1)
      ? (state.swing / 100) * stepDur() * 0.9
      : 0;
    scheduleStep(currentStep, nextNoteTime + swingOff);
    nextNoteTime += stepDur();
    currentStep = (currentStep + 1) % STEPS;
  }
}

function scheduleStep(step, time) {
  TRACKS.forEach(tr => {
    if (state.drums[tr.id][step] && !state.mutes[tr.id]) VOICES[tr.id](time);
  });
  const rowIdx = state.bass[step];
  if (rowIdx != null && !state.mutes.bass && rowIdx < currentRows.length) {
    // sustain until the next bass note, capped at 4 steps
    let gate = 4;
    for (let g = 1; g <= 4; g++) {
      if (state.bass[(step + g) % STEPS] != null) { gate = g; break; }
    }
    playBass(time, midiToFreq(currentRows[rowIdx]), gate * stepDur() * 0.95);
  }
  drawQueue.push({ step, time });
}

function start() {
  const c = ensureAudio();
  playing = true;
  currentStep = 0;
  nextNoteTime = c.currentTime + 0.06;
  drawQueue.length = 0;
  timerID = setInterval(scheduler, LOOKAHEAD_MS);
  scheduler();
  playBtn.innerHTML = '&#9632;';
  playBtn.classList.add('on');
}
function stop() {
  playing = false;
  if (timerID) { clearInterval(timerID); timerID = null; }
  drawQueue.length = 0;
  setPlayhead(-1);
  stepReadout.textContent = '\u2013';
  playBtn.innerHTML = '&#9654;';
  playBtn.classList.remove('on');
}
const togglePlay = () => (playing ? stop() : start());

/* ============================== DOM build ============================== */

const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

const playBtn = $('playBtn');
const stepReadout = $('stepReadout');
const drumGrid = $('drumGrid');
const rollGrid = $('rollGrid');
let cellRefs = [];   // [trackIndex][step]
let rollRefs = [];   // [rowIdx][step]
let rowEls = {};     // trackId -> row element

function computeRows() {
  const ints = SCALES[state.scale];
  const rootMidi = 36 + state.root; // C2-based
  const rows = [];
  const total = Math.min(ints.length * 2 + 1, 15);
  for (let i = 0; i < total; i++) {
    rows.push(rootMidi + Math.floor(i / ints.length) * 12 + ints[i % ints.length]);
  }
  return rows;
}

function buildHead(container) {
  container.innerHTML = '';
  container.appendChild(el('div', 'hspacer'));
  for (let s = 0; s < STEPS; s++) {
    const n = el('span', 'snum' + (s % 4 === 0 ? ' beat' : ''));
    n.dataset.step = s;
    n.textContent = s % 4 === 0 ? (s / 4 + 1) : '\u00B7';
    container.appendChild(n);
  }
}

function buildDrums() {
  drumGrid.innerHTML = '';
  cellRefs = [];
  rowEls = {};
  TRACKS.forEach((tr, ti) => {
    const row = el('div', 'row g16');
    if (state.mutes[tr.id]) row.classList.add('muted');
    rowEls[tr.id] = row;

    const label = el('div', 'tlabel');
    label.style.setProperty('--c', tr.color);
    const top = el('div', 'top');
    const mute = el('button', 'mute' + (state.mutes[tr.id] ? ' active' : ''));
    mute.type = 'button';
    mute.dataset.track = tr.id;
    mute.title = 'Mute ' + tr.name;
    mute.textContent = 'M';
    const dot = el('span', 'dot');
    const name = el('span', 'tname');
    name.textContent = tr.name;
    name.dataset.audition = tr.id;
    name.title = 'Audition ' + tr.name;
    top.append(mute, dot, name);
    const vol = el('input', 'tvol');
    vol.type = 'range';
    vol.min = 0; vol.max = 100;
    vol.value = Math.round((state.levels[tr.id] ?? 0.8) * 100);
    vol.dataset.level = tr.id;
    vol.title = tr.name + ' level';
    vol.style.accentColor = tr.color;
    label.append(top, vol);
    row.appendChild(label);

    cellRefs[ti] = [];
    for (let s = 0; s < STEPS; s++) {
      const c = el('button', 'cell' + (Math.floor(s / 4) % 2 === 1 ? ' alt' : '') + (state.drums[tr.id][s] ? ' on' : ''));
      c.type = 'button';
      c.dataset.track = tr.id;
      c.dataset.step = s;
      c.style.setProperty('--c', tr.color);
      c.setAttribute('aria-label', tr.name + ' step ' + (s + 1));
      c.setAttribute('aria-pressed', state.drums[tr.id][s] ? 'true' : 'false');
      row.appendChild(c);
      cellRefs[ti][s] = c;
    }
    drumGrid.appendChild(row);
  });
}

function buildRoll() {
  currentRows = computeRows();
  rollGrid.innerHTML = '';
  rollGrid.classList.toggle('muted', !!state.mutes.bass);
  rollRefs = [];
  for (let r = currentRows.length - 1; r >= 0; r--) {
    const row = el('div', 'row g16 roll');
    const midi = currentRows[r];
    const isRoot = ((midi - state.root) % 12 + 12) % 12 === 0;
    const label = el('button', 'rlabel' + (isRoot ? ' root' : ''));
    label.type = 'button';
    label.textContent = NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
    label.dataset.auditionBass = r;
    label.title = 'Audition ' + label.textContent;
    row.appendChild(label);

    rollRefs[r] = [];
    for (let s = 0; s < STEPS; s++) {
      const c = el('button', 'cell rcell' + (Math.floor(s / 4) % 2 === 1 ? ' alt' : '') + (state.bass[s] === r ? ' on' : ''));
      c.type = 'button';
      c.dataset.roll = r;
      c.dataset.step = s;
      c.setAttribute('aria-label', label.textContent + ' step ' + (s + 1));
      c.setAttribute('aria-pressed', state.bass[s] === r ? 'true' : 'false');
      row.appendChild(c);
      rollRefs[r][s] = c;
    }
    rollGrid.appendChild(row);
  }
}

function buildAll() {
  buildDrums();
  buildRoll();
  buildHead($('drumHead'));
  buildHead($('rollHead'));
}

/* ============================== toggling / painting ============================== */

function toggleDrum(track, step) {
  const v = !state.drums[track][step];
  setDrum(track, step, v);
  if (v) audition(track);
  return v;
}
function setDrum(track, step, v) {
  state.drums[track][step] = v;
  const ti = TRACKS.findIndex(t => t.id === track);
  const c = cellRefs[ti] && cellRefs[ti][step];
  if (c) { c.classList.toggle('on', v); c.setAttribute('aria-pressed', String(v)); }
}
function toggleRoll(row, step) {
  const v = state.bass[step] === row ? null : row;
  setRoll(step, v);
  if (v != null) auditionBassRow(v);
  return v;
}
function setRoll(step, v) {
  state.bass[step] = v;
  rollRefs.forEach((arr, ri) => {
    const c = arr[step];
    if (c) {
      const on = v === ri;
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', String(on));
    }
  });
}

let paint = null; // {kind, key/step, value}

document.addEventListener('pointerdown', (e) => {
  ensureAudio();
  if (e.button !== 0) return;
  const c = e.target.closest('.cell');
  if (!c) return;
  e.preventDefault();
  if (c.dataset.track !== undefined) {
    const v = toggleDrum(c.dataset.track, +c.dataset.step);
    paint = { kind: 'drum', key: c.dataset.track, value: v };
  } else if (c.dataset.roll !== undefined) {
    const v = toggleRoll(+c.dataset.roll, +c.dataset.step);
    paint = { kind: 'roll', step: +c.dataset.step, value: v };
  }
  save();
});

document.addEventListener('pointerover', (e) => {
  if (!paint) return;
  const c = e.target.closest('.cell');
  if (!c || c.dataset.step === undefined) return;
  if (paint.kind === 'drum' && c.dataset.track === paint.key) {
    if (state.drums[paint.key][+c.dataset.step] !== paint.value) {
      setDrum(paint.key, +c.dataset.step, paint.value);
      if (paint.value) audition(paint.key);
      save();
    }
  } else if (paint.kind === 'roll' && c.dataset.roll !== undefined) {
    if (state.bass[paint.step] !== paint.value) {
      setRoll(paint.step, paint.value);
      if (paint.value != null) auditionBassRow(paint.value);
      save();
    }
  }
});
const endPaint = () => { paint = null; };
document.addEventListener('pointerup', endPaint);
document.addEventListener('pointercancel', endPaint);

// keyboard activation of cells (Enter/Space on a focused cell)
document.addEventListener('click', (e) => {
  if (e.detail !== 0) return;
  const c = e.target.closest('.cell');
  if (!c) return;
  if (c.dataset.track !== undefined) toggleDrum(c.dataset.track, +c.dataset.step);
  else if (c.dataset.roll !== undefined) toggleRoll(+c.dataset.roll, +c.dataset.step);
  save();
});

/* ============================== mutes, levels, auditions ============================== */

document.addEventListener('click', (e) => {
  const m = e.target.closest('.mute');
  if (m) {
    const id = m.dataset.track;
    state.mutes[id] = !state.mutes[id];
    m.classList.toggle('active', state.mutes[id]);
    if (id === 'bass') rollGrid.classList.toggle('muted', state.mutes[id]);
    else if (rowEls[id]) rowEls[id].classList.toggle('muted', state.mutes[id]);
    save();
    return;
  }
  const nm = e.target.closest('[data-audition]');
  if (nm) { audition(nm.dataset.audition); return; }
  const rb = e.target.closest('[data-audition-bass]');
  if (rb) auditionBassRow(+rb.dataset.auditionBass);
});

document.addEventListener('input', (e) => {
  const v = e.target;
  if (v.classList && v.classList.contains('tvol')) {
    const id = v.dataset.level;
    state.levels[id] = v.value / 100;
    if (trackGain[id]) trackGain[id].gain.value = state.levels[id];
    save();
  }
});

/* ============================== transport controls ============================== */

const bpmIn = $('bpm'), swingIn = $('swing'), volIn = $('vol');
const bpmVal = $('bpmVal'), swingVal = $('swingVal'), volVal = $('volVal');

bpmIn.addEventListener('input', () => {
  state.bpm = +bpmIn.value;
  bpmVal.textContent = bpmIn.value;
  save();
});
swingIn.addEventListener('input', () => {
  state.swing = +swingIn.value;
  swingVal.textContent = swingIn.value + '%';
  save();
});
volIn.addEventListener('input', () => {
  state.volume = volIn.value / 100;
  volVal.textContent = volIn.value + '%';
  if (master) master.gain.value = state.volume;
  save();
});
playBtn.addEventListener('click', togglePlay);

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat) return;
  if (e.target.closest('input, select, textarea')) return;
  e.preventDefault();
  togglePlay();
});

/* ============================== root / scale selects ============================== */

const rootSel = $('root'), scaleSel = $('scale');
NOTE_NAMES.forEach((n, i) => {
  const o = el('option', '');
  o.value = i;
  o.textContent = n;
  rootSel.appendChild(o);
});
Object.keys(SCALES).forEach(name => {
  const o = el('option', '');
  o.value = name;
  o.textContent = name;
  scaleSel.appendChild(o);
});
rootSel.addEventListener('change', () => {
  state.root = +rootSel.value;
  buildRoll();
  save();
});
scaleSel.addEventListener('change', () => {
  state.scale = scaleSel.value;
  buildRoll();
  save();
});

/* ============================== presets / random / clear ============================== */

$('preset').addEventListener('change', (e) => {
  const p = PRESETS[e.target.value];
  if (!p) return;
  state.bpm = p.bpm;
  state.swing = p.swing;
  state.root = p.root;
  state.scale = p.scale;
  TRACKS.forEach(tr => {
    const pat = (p.drums && p.drums[tr.id]) || '';
    for (let s = 0; s < STEPS; s++) state.drums[tr.id][s] = pat[s] === 'x';
  });
  state.bass = p.bass.slice();
  buildAll();
  syncUI();
  save();
});

const rand = (p) => Math.random() < p;
$('randomBtn').addEventListener('click', () => {
  const k = new Array(STEPS).fill(false);
  k[0] = true;
  [4, 6, 8, 10, 12, 14].forEach(s => { if (rand(0.35)) k[s] = true; });
  if (!k[8] && rand(0.5)) k[8] = true;
  state.drums.kick = k;
  state.drums.snare = Array.from({ length: STEPS }, (_, s) => (s === 4 || s === 12) ? rand(0.85) : rand(0.05));
  state.drums.clap  = Array.from({ length: STEPS }, (_, s) => (s === 4 || s === 12) ? rand(0.35) : rand(0.03));
  state.drums.chat  = Array.from({ length: STEPS }, (_, s) => s % 2 === 0 ? rand(0.7) : rand(0.25));
  state.drums.ohat  = Array.from({ length: STEPS }, (_, s) => s % 4 === 2 ? rand(0.5) : rand(0.04));
  state.drums.tom   = Array.from({ length: STEPS }, () => rand(0.06));

  let cur = 0;
  const maxRow = Math.max(1, currentRows.length - 1);
  state.bass = Array.from({ length: STEPS }, (_, s) => {
    if (s % 2 === 0 ? rand(0.75) : rand(0.25)) {
      cur = Math.max(0, Math.min(maxRow, cur + Math.floor(Math.random() * 5) - 2));
      return cur;
    }
    return null;
  });

  buildAll();
  syncUI();
  save();
});

$('clearBtn').addEventListener('click', () => {
  TRACKS.forEach(tr => state.drums[tr.id].fill(false));
  state.bass.fill(null);
  buildAll();
  save();
});

/* ============================== playhead & scope drawing ============================== */

let lastStep = -1;
function setPlayhead(step) {
  if (lastStep === step) return;
  document.querySelectorAll('.ph').forEach(n => n.classList.remove('ph'));
  if (step >= 0) {
    document.querySelectorAll('.cell[data-step="' + step + '"]').forEach(n => n.classList.add('ph'));
    document.querySelectorAll('.snum[data-step="' + step + '"]').forEach(n => n.classList.add('ph'));
    stepReadout.textContent = String(step + 1);
    document.querySelectorAll('.cell.on[data-step="' + step + '"]').forEach(n => {
      n.classList.remove('hit');
      void n.offsetWidth; // restart animation
      n.classList.add('hit');
    });
  }
  lastStep = step;
}

const scope = $('scope');
const sctx = scope.getContext('2d');
const freqData = new Uint8Array(128);
const scopeGrad = sctx.createLinearGradient(0, 0, scope.width, 0);
scopeGrad.addColorStop(0, '#46d8ff');
scopeGrad.addColorStop(0.5, '#7ce38b');
scopeGrad.addColorStop(1, '#b78cff');

function drawScope() {
  const w = scope.width, h = scope.height;
  sctx.clearRect(0, 0, w, h);
  if (!analyser) {
    sctx.fillStyle = 'rgba(232,236,244,0.08)';
    sctx.fillRect(0, h / 2 - 1, w, 2);
    return;
  }
  analyser.getByteFrequencyData(freqData);
  const bars = 48;
  const bw = w / bars;
  sctx.fillStyle = scopeGrad;
  for (let i = 0; i < bars; i++) {
    const v = freqData[Math.floor(i * freqData.length / bars)] / 255;
    const bh = Math.max(2, v * (h - 4));
    sctx.fillRect(i * bw + 1, h - bh - 2, bw - 2, bh);
  }
}

function frame() {
  requestAnimationFrame(frame);
  drawScope();
  if (!ctx) return;
  const now = ctx.currentTime;
  while (drawQueue.length && drawQueue[0].time <= now) {
    setPlayhead(drawQueue.shift().step);
  }
}

/* ============================== init ============================== */

function syncUI() {
  bpmIn.value = state.bpm;
  bpmVal.textContent = state.bpm;
  swingIn.value = state.swing;
  swingVal.textContent = state.swing + '%';
  volIn.value = Math.round(state.volume * 100);
  volVal.textContent = Math.round(state.volume * 100) + '%';
  rootSel.value = String(state.root);
  scaleSel.value = state.scale;
}

buildAll();
syncUI();
requestAnimationFrame(frame);
})();
</script>
</body>
