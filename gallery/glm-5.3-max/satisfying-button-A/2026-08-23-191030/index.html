<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1022">
<title>satisfying button</title>
<style>
  :root{
    --bg:#0d1022;
    --ink:#eef0ff;
    --muted:#8b90b5;
    --face-a:#ff7a47;
    --face-b:#ffb347;
    --edge:#a83517;
    --edge-dark:#7e240c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
  }

  /* ---------- ambient background ---------- */
  .bg{ position:fixed; inset:0; overflow:hidden; z-index:0; }
  .bg::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.55), transparent 60%);
  }
  .blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.35; }
  .blob.a{ width:46vmax; height:46vmax; left:-12vmax; top:-14vmax; background:#3b2f7a; animation:drift1 26s ease-in-out infinite alternate; }
  .blob.b{ width:40vmax; height:40vmax; right:-10vmax; bottom:-16vmax; background:#123a5e; animation:drift2 31s ease-in-out infinite alternate; }
  .blob.c{ width:26vmax; height:26vmax; right:8vmax; top:-10vmax; background:#6e2450; opacity:.22; animation:drift1 21s ease-in-out infinite alternate-reverse; }
  @keyframes drift1{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(6vmax,4vmax) scale(1.15);} }
  @keyframes drift2{ from{ transform:translate(0,0) scale(1.1);} to{ transform:translate(-5vmax,-4vmax) scale(.95);} }

  /* ---------- layout ---------- */
  main{ position:relative; z-index:1; text-align:center; padding:24px; }

  .overline{
    font-size:12px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--muted); margin-bottom:14px;
  }
  h1{
    font-size:clamp(20px, 3.4vw, 30px); font-weight:600;
    letter-spacing:.02em; margin-bottom:52px; color:#cfd3f5;
  }

  /* ---------- the button ---------- */
  .stage{ position:relative; display:inline-block; }

  .shadow-bed{
    position:absolute; left:50%; bottom:-26px; transform:translateX(-50%);
    width:92%; height:30px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.65), transparent 72%);
    transition:transform .5s cubic-bezier(.2,2.4,.35,1), opacity .2s;
  }
  .stage.pressed .shadow-bed{ transform:translateX(-50%) scale(.86,.6); opacity:.75; }

  .glow{
    position:absolute; inset:-26px; border-radius:56px; pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,138,71,.55), rgba(255,138,71,0) 72%);
    filter:blur(20px);
    animation:breathe 3.4s ease-in-out infinite;
    transition:opacity .12s;
  }
  .stage.pressed .glow{ opacity:.35; animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.55; transform:scale(1);} 50%{ opacity:.95; transform:scale(1.06);} }

  .btn-wrap{
    position:relative; display:block; border:0; padding:0;
    background:none; cursor:pointer; outline:none;
    transform:translateY(0);
    transition:transform .55s cubic-bezier(.2,2.6,.35,1); /* springy return */
    will-change:transform;
  }
  .stage.pressed .btn-wrap{
    transform:translateY(13px);
    transition:transform .085s cubic-bezier(.3,0,.6,1); /* fast press-in */
  }

  .btn-edge{
    position:absolute; inset:0; border-radius:30px;
    background:linear-gradient(180deg, var(--edge) 0%, var(--edge-dark) 100%);
    transform:translateY(14px);
    box-shadow:0 22px 40px -12px rgba(0,0,0,.7);
  }

  .face{
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    min-width:min(300px, 72vw); height:104px;
    padding:0 46px;
    border-radius:30px;
    background:linear-gradient(180deg, #ff9a5c 0%, var(--face-a) 34%, var(--face-b) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.55),
      inset 0 -3px 0 rgba(150,60,10,.45),
      0 4px 0 rgba(255,255,255,.06);
    transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .3s ease-out;
    will-change:transform;
  }

  .face::before{ /* glossy top highlight */
    content:""; position:absolute; left:8%; right:8%; top:5%; height:42%;
    border-radius:24px 24px 40px 40px;
    background:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.04));
    pointer-events:none;
  }
  .face::after{ /* idle sheen sweep */
    content:""; position:absolute; inset:-40%;
    background:linear-gradient(105deg, transparent 42%, rgba(255,255,255,.35) 50%, transparent 58%);
    transform:translateX(-130%);
    animation:sheen 6.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sheen{ 0%,60%{ transform:translateX(-130%);} 78%,100%{ transform:translateX(130%);} }

  .label{
    position:relative; z-index:2;
    font-size:30px; font-weight:800; letter-spacing:.03em; color:#fff;
    text-shadow:0 2px 0 rgba(150,55,5,.45), 0 6px 18px rgba(120,40,0,.35);
    white-space:nowrap;
    transition:opacity .25s, transform .25s;
  }
  .label.swap{ opacity:0; transform:translateY(6px) scale(.96); }

  /* focus ring (keyboard only) */
  .btn-wrap:focus-visible .face{ box-shadow:0 0 0 4px #ffd9a8, 0 0 34px 6px rgba(255,180,90,.55), inset 0 2px 0 rgba(255,255,255,.55); }

  /* ---------- fx ---------- */
  .fx{ position:fixed; inset:0; pointer-events:none; z-index:40; overflow:hidden; }

  .ripple{
    position:absolute; border-radius:50%; transform:scale(0);
    background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 55%, transparent 70%);
    animation:rip .55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rip{ to{ transform:scale(1); opacity:0; } }

  .ring{
    position:absolute; border-radius:50%;
    border:3px solid rgba(255,190,120,.8);
    animation:ring .6s cubic-bezier(.2,.6,.3,1) forwards;
  }
  @keyframes ring{ from{ transform:scale(.4); opacity:.9;} to{ transform:scale(1.5); opacity:0;} }

  .p{ position:absolute; border-radius:2px; will-change:transform,opacity; }
  .p.dot{ border-radius:50%; }

  .plus{
    position:absolute; font-weight:800; font-size:18px; color:#ffd9a8;
    text-shadow:0 2px 10px rgba(255,150,60,.6); will-change:transform,opacity;
  }

  /* ---------- counter ---------- */
  .counter{ margin-top:58px; }
  .count{
    font-size:52px; font-weight:800; line-height:1;
    font-variant-numeric:tabular-nums;
    color:#fff; text-shadow:0 4px 30px rgba(255,150,80,.25);
  }
  .count.pop{ animation:pop .35s cubic-bezier(.2,2.2,.4,1); }
  @keyframes pop{ 40%{ transform:scale(1.22);} 100%{ transform:scale(1);} }
  .count-label{
    margin-top:6px; font-size:12px; letter-spacing:.4em; text-transform:uppercase;
    color:var(--muted);
  }
  .quip{ margin-top:16px; font-size:14px; color:#a9aed4; min-height:20px; transition:opacity .3s; }

  /* combo badge */
  .combo{
    position:absolute; top:-16px; right:-26px; z-index:5;
    padding:5px 12px; border-radius:999px;
    background:linear-gradient(135deg,#ff006e,#ff7a47);
    font-size:14px; font-weight:800; color:#fff;
    box-shadow:0 4px 16px rgba(255,0,110,.45);
    transform:scale(0); pointer-events:none;
  }
  .combo.show{ animation:comboIn .45s cubic-bezier(.2,2.4,.4,1) forwards; }
  @keyframes comboIn{ from{ transform:scale(0) rotate(-12deg);} to{ transform:scale(1) rotate(8deg);} }

  .hint{ margin-top:26px; font-size:12px; color:#565b82; letter-spacing:.08em; transition:opacity .6s; }

  /* mute toggle */
  .mute{
    position:fixed; top:18px; right:18px; z-index:50;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05); color:#cfd3f5;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .2s;
  }
  .mute:hover{ background:rgba(255,255,255,.12); transform:scale(1.06); }
  .mute svg{ width:20px; height:20px; }
  .mute .off{ display:none; }
  .mute.muted .on{ display:none; }
  .mute.muted .off{ display:block; }

  /* milestone shake */
  .shake{ animation:shake .35s linear; }
  @keyframes shake{
    20%{ transform:translate(-4px,2px);} 40%{ transform:translate(4px,-2px);}
    60%{ transform:translate(-3px,-2px);} 80%{ transform:translate(3px,2px);}
  }

  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @media (prefers-reduced-motion: reduce){
    .blob, .glow, .face::after{ animation:none !important; }
    .btn-wrap, .face, .shadow-bed{ transition-duration:.01s !important; }
    .count.pop, .combo.show{ animation-duration:.01s !important; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>
</div>

<button class="mute" id="mute" aria-label="Toggle sound" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>
    <path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
  </svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>
    <line x1="16" y1="9" x2="22" y2="15"></line><line x1="22" y1="9" x2="16" y2="15"></line>
  </svg>
</button>

<main id="main">
  <div class="overline">the one and only</div>
  <h1>Satisfying Button</h1>

  <div class="stage" id="stage">
    <div class="shadow-bed" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <button class="btn-wrap" id="btn" aria-live="off">
      <span class="btn-edge" aria-hidden="true"></span>
      <span class="face" id="face">
        <span class="label" id="label">press me</span>
      </span>
    </button>
    <div class="combo" id="combo" aria-hidden="true">x2</div>
  </div>

  <div class="counter">
    <div class="count" id="count" aria-hidden="true">0</div>
    <div class="count-label">clicks</div>
    <div class="quip" id="quip" aria-hidden="true"></div>
  </div>

  <div class="hint" id="hint">click &middot; tap &middot; or hit space</div>
  <div class="sr" role="status" id="sr"></div>
</main>

<div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function(){
  'use strict';

  var stage   = document.getElementById('stage');
  var btn     = document.getElementById('btn');
  var face    = document.getElementById('face');
  var label   = document.getElementById('label');
  var countEl = document.getElementById('count');
  var quipEl  = document.getElementById('quip');
  var hintEl  = document.getElementById('hint');
  var comboEl = document.getElementById('combo');
  var fx      = document.getElementById('fx');
  var main    = document.getElementById('main');
  var sr      = document.getElementById('sr');
  var muteBtn = document.getElementById('mute');

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var COLORS = ['#ffb703','#fb5607','#ff006e','#8338ec','#3a86fd','#06d6a0','#ffffff'];
  var LABELS = [
    [0,    'press me'],
    [50,   'again. again.'],
    [100,  'you\u2019re really doing this'],
    [250,  'obsessed.'],
    [500,  'legendary.'],
    [1000, 'touch grass.']
  ];
  var QUIPS = [
    [10,   'nice start.'],
    [25,   'okay, that IS satisfying.'],
    [50,   'certified clicker.'],
    [100,  'one hundred. respectable.'],
    [250,  'the button fears you.'],
    [500,  'half a thousand. seek help.'],
    [1000, 'a thousand. the button is yours.']
  ];

  var count = 0;
  try { count = parseInt(localStorage.getItem('satisfying-button-clicks') || '0', 10) || 0; } catch(e){}

  var pressed = false;
  var combo = 0;
  var lastClick = 0;
  var comboTimer = null;
  var quipTimer = null;
  var muted = false;

  /* ---------------- audio ---------------- */
  var actx = null;
  function audio(){
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function soundPress(){
    if (muted) return;
    var c = audio(); if (!c) return;
    var t = c.currentTime;
    var pitch = Math.min(1 + combo * 0.05, 1.9);

    /* pop: sine dropping fast */
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(560 * pitch, t);
    o.frequency.exponentialRampToValueAtTime(150 * pitch, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.15);

    /* click: filtered noise tick */
    var len = Math.floor(c.sampleRate * 0.035);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var src = c.createBufferSource(); src.buffer = buf;
    var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
    var ng = c.createGain(); ng.gain.value = 0.22;
    src.connect(hp); hp.connect(ng); ng.connect(c.destination);
    src.start(t);
  }

  function soundRelease(){
    if (muted) return;
    var c = audio(); if (!c) return;
    var t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(480, t + 0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.08);
  }

  function soundMilestone(){
    if (muted) return;
    var c = audio(); if (!c) return;
    var notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach(function(f, i){
      var t = c.currentTime + i * 0.09;
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.55);
    });
  }

  /* ---------------- fx ---------------- */
  function removeLater(el, ms){
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, ms);
  }

  function ripple(rx, ry){
    var rect = face.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 2.2;
    var r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (rx - size / 2) + 'px';
    r.style.top  = (ry - size / 2) + 'px';
    face.appendChild(r);
    removeLater(r, 600);
  }

  function ring(x, y){
    if (REDUCED) return;
    var el = document.createElement('span');
    el.className = 'ring';
    var s = 150;
    el.style.width = el.style.height = s + 'px';
    el.style.left = (x - s / 2) + 'px';
    el.style.top  = (y - s / 2) + 'px';
    fx.appendChild(el);
    removeLater(el, 650);
  }

  function particles(x, y, n, spread){
    if (REDUCED) return;
    for (var i = 0; i < n; i++){
      var el = document.createElement('span');
      var dot = Math.random() < 0.55;
      el.className = 'p' + (dot ? ' dot' : '');
      var size = dot ? (4 + Math.random() * 7) : (5 + Math.random() * 8);
      el.style.width = size + 'px';
      el.style.height = (dot ? size : size * 0.55) + 'px';
      el.style.background = COLORS[(Math.random() * COLORS.length) | 0];
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      var a = Math.random() * Math.PI * 2;
      var v = (spread || 1) * (70 + Math.random() * 130);
      var dx = Math.cos(a) * v;
      var dy = Math.sin(a) * v - 60;
      var dur = 550 + Math.random() * 450;
      var rot = (Math.random() * 520 - 260);

      el.animate([
        { transform:'translate(-50%,-50%) translate(0px,0px) rotate(0deg) scale(1)', opacity:1 },
        { transform:'translate(-50%,-50%) translate(' + (dx * 0.7) + 'px,' + (dy * 0.7) + 'px) rotate(' + (rot * 0.7) + 'deg) scale(1)', opacity:1, offset:0.6 },
        { transform:'translate(-50%,-50%) translate(' + dx + 'px,' + (dy + 190) + 'px) rotate(' + rot + 'deg) scale(.4)', opacity:0 }
      ], { duration: dur, easing:'cubic-bezier(.2,.6,.4,1)' });

      fx.appendChild(el);
      removeLater(el, dur + 80);
    }
  }

  function plusOne(x, y){
    if (REDUCED) return;
    var el = document.createElement('span');
    el.className = 'plus';
    el.textContent = '+1';
    el.style.left = x + 'px';
    el.style.top = (y - 30) + 'px';
    var jx = Math.random() * 40 - 20;
    el.animate([
      { transform:'translate(-50%,-50%) translate(0,0) scale(.6)', opacity:0 },
      { transform:'translate(-50%,-50%) translate(' + jx * 0.4 + 'px,-28px) scale(1.15)', opacity:1, offset:0.35 },
      { transform:'translate(-50%,-50%) translate(' + jx + 'px,-74px) scale(.9)', opacity:0 }
    ], { duration: 750, easing:'cubic-bezier(.2,.6,.3,1)' });
    fx.appendChild(el);
    removeLater(el, 800);
  }

  function popCounter(){
    countEl.classList.remove('pop');
    void countEl.offsetWidth; /* restart animation */
    countEl.classList.add('pop');
  }

  function showCombo(){
    if (combo < 2){ comboEl.classList.remove('show'); return; }
    comboEl.textContent = 'x' + combo;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){ comboEl.classList.remove('show'); }, 900);
  }

  function shake(){
    if (REDUCED) return;
    main.classList.remove('shake');
    void main.offsetWidth;
    main.classList.add('shake');
  }

  function bestMatch(map, n){
    var out = '';
    for (var i = 0; i < map.length; i++) if (n >= map[i][0]) out = map[i][1];
    return out;
  }

  function setLabel(){
    var next = bestMatch(LABELS, count);
    if (label.textContent === next) return;
    label.classList.add('swap');
    setTimeout(function(){
      label.textContent = next;
      label.classList.remove('swap');
    }, 250);
  }

  function setQuip(text){
    quipEl.style.opacity = 0;
    clearTimeout(quipTimer);
    quipTimer = setTimeout(function(){
      quipEl.textContent = text;
      quipEl.style.opacity = 1;
    }, 300);
  }

  /* ---------------- interaction ---------------- */
  function press(clientX, clientY){
    if (pressed) return;
    pressed = true;
    stage.classList.add('pressed');

    var rect = face.getBoundingClientRect();
    var hasPoint = typeof clientX === 'number';
    var x = hasPoint ? clientX : rect.left + rect.width / 2;
    var y = hasPoint ? clientY : rect.top + rect.height / 2;

    ripple(x, y);
    ring(x, y);
    particles(x, y, 16, 1);
    plusOne(x, y);

    var now = Date.now();
    combo = (now - lastClick < 650) ? combo + 1 : 1;
    lastClick = now;
    showCombo();

    count++;
    countEl.textContent = count;
    popCounter();
    sr.textContent = count + ' clicks';
    setLabel();

    try { localStorage.setItem('satisfying-button-clicks', String(count)); } catch(e){}

    var quip = bestMatch(QUIPS, count);
    var isMilestone = QUIPS.some(function(q){ return q[0] === count; });
    if (isMilestone){
      setQuip(quip);
      soundMilestone();
      particles(rect.left + rect.width / 2, rect.top + rect.height / 2, 60, 1.9);
      shake();
    }

    soundPress();
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
  }

  function release(){
    if (!pressed) return;
    pressed = false;
    stage.classList.remove('pressed');
    soundRelease();
  }

  function firstInteraction(){
    hintEl.style.opacity = 0;
  }

  btn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    firstInteraction();
    if (btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch(err){} }
    press(e.clientX, e.clientY);
  });
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('lostpointercapture', release);

  btn.addEventListener('keydown', function(e){
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){
      e.preventDefault();
      firstInteraction();
      press();
    }
  });
  btn.addEventListener('keyup', function(e){
    if (e.key === ' ' || e.key === 'Enter') release();
  });

  /* gentle 3D tilt toward the cursor */
  if (!REDUCED){
    face.addEventListener('pointermove', function(e){
      if (pressed) return;
      var r = face.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      face.style.setProperty('--ry', (px * 10).toFixed(2) + 'deg');
      face.style.setProperty('--rx', (-py * 8).toFixed(2) + 'deg');
    });
    face.addEventListener('pointerleave', function(){
      face.style.setProperty('--rx', '0deg');
      face.style.setProperty('--ry', '0deg');
    });
  }

  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.blur();
  });

  /* init */
  countEl.textContent = count;
  if (count > 0){
    setLabel();
    var q = bestMatch(QUIPS, count);
    if (q) quipEl.textContent = q;
  }
})();
</script>
</body>
</html>
