<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cloth — Verlet Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06070b; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  canvas.grabbing { cursor: grabbing; }
  canvas.cutting  { cursor: crosshair; }

  .ui {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaf0; user-select: none; pointer-events: none;
  }
  .ui h1 {
    font-size: 15px; font-weight: 600; letter-spacing: 0.42em;
    color: #f2f3f7; text-transform: uppercase;
  }
  .ui .sub {
    margin-top: 5px; font-size: 11px; letter-spacing: 0.08em;
    color: rgba(232, 234, 240, 0.45); font-variant-numeric: tabular-nums;
  }
  .chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; pointer-events: auto; max-width: 300px; }
  .chip {
    font-size: 11px; letter-spacing: 0.06em; padding: 6px 11px;
    color: rgba(232, 234, 240, 0.78);
    background: rgba(18, 21, 30, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  .chip:hover { background: rgba(38, 43, 58, 0.65); color: #fff; }
  .chip.on {
    background: rgba(233, 90, 90, 0.16);
    border-color: rgba(233, 90, 90, 0.55);
    color: #ffb9b0;
  }

  .hint {
    position: fixed; left: 20px; bottom: 18px; z-index: 10;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.85; letter-spacing: 0.03em;
    color: rgba(232, 234, 240, 0.38); user-select: none; pointer-events: none;
  }
  .hint b { color: rgba(232, 234, 240, 0.75); font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <h1>Cloth</h1>
  <div class="sub" id="stats">verlet · verlet integration</div>
  <div class="chips">
    <div class="chip" id="btnWind">Wind</div>
    <div class="chip" id="btnPins">Release pins</div>
    <div class="chip on" id="btnFragile">Fragile</div>
    <div class="chip" id="btnReset">Reset</div>
  </div>
</div>

<div class="hint">
  <b>drag</b> pull the fabric &nbsp;·&nbsp; <b>shift + drag</b> / <b>right-drag</b> cut<br>
  <b>space</b> release pins &nbsp;·&nbsp; <b>w</b> wind &nbsp;·&nbsp; <b>f</b> fragile &nbsp;·&nbsp; <b>r</b> reset
</div>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ setup */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const statsEl = document.getElementById("stats");

let W = 0, H = 0, DPR = 1, CX = 0, CY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
}
window.addEventListener("resize", resize);
resize();

/* ------------------------------------------------------------ simulation */

const COLS = 60, ROWS = 38;
const FOV = 900;               // perspective focal length (px)
const GRAVITY = 2200;          // px / s^2
const WIND = 1500;
const DT = 1 / 120;            // fixed physics step
const ITER = 6;                // constraint relaxation passes
const DAMP = 0.992;            // air damping per step
const TEAR = 4.6;              // auto-tear stretch factor

const windOn = { v: false };
const fragile = { v: true };

// particles (flat arrays for speed)
const N = COLS * ROWS;
const px = new Float64Array(N), py = new Float64Array(N), pz = new Float64Array(N);
const ox = new Float64Array(N), oy = new Float64Array(N), oz = new Float64Array(N); // previous
const pin = new Uint8Array(N);
const sx = new Float32Array(N), sy = new Float32Array(N), ss = new Float32Array(N); // screen cache

// constraints
let cons = [];                 // {a, b, rest, k, on}
let pinsBackup = new Uint8Array(N);
let simTime = 0;

function idx(x, y) { return y * COLS + x; }

function buildCloth() {
  simTime = 0;
  cons = [];
  pin.fill(0);

  const clothW = Math.min(W * 0.78, 940);
  const sp = clothW / (COLS - 1);
  const top = Math.max(70, H * 0.14);

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = idx(x, y);
      // gentle z ripple so folds catch the light immediately
      const z = Math.sin(x * 0.31) * 6 + Math.cos(y * 0.22) * 5;
      px[i] = CX + (x - (COLS - 1) / 2) * sp;
      py[i] = top + y * sp;
      pz[i] = z;
      ox[i] = px[i]; oy[i] = py[i]; oz[i] = z;
    }
  }

  const add = (a, b, k) => {
    const dx = px[a] - px[b], dy = py[a] - py[b], dz = pz[a] - pz[b];
    cons.push({ a, b, rest: Math.sqrt(dx * dx + dy * dy + dz * dz), k, on: true });
  };

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      if (x < COLS - 1) add(idx(x, y), idx(x + 1, y), 1.0);          // structural
      if (y < ROWS - 1) add(idx(x, y), idx(x, y + 1), 1.0);
      if (x < COLS - 1 && y < ROWS - 1) {                            // shear
        add(idx(x, y), idx(x + 1, y + 1), 0.92);
        add(idx(x + 1, y), idx(x, y + 1), 0.92);
      }
      if (x < COLS - 2) add(idx(x, y), idx(x + 2, y), 0.35);         // bend
      if (y < ROWS - 2) add(idx(x, y), idx(x, y + 2), 0.35);
    }

  // pin the top edge at intervals, plus both corners
  for (let x = 0; x < COLS; x++) {
    if (x % 7 === 0 || x === COLS - 1) pin[idx(x, 0)] = 1;
  }
  pinsBackup = pin.slice();

  statsEl.textContent =
    `verlet · ${N.toLocaleString()} particles · ${cons.length.toLocaleString()} constraints`;
}

/* -------------------------------------------------------------- interaction */

const mouse = { x: -1e9, y: -1e9, buttons: 0, shift: false };
let grab = -1;
let grabTX = 0, grabTY = 0;

function cutting() { return (mouse.buttons & 2) !== 0 || ((mouse.buttons & 1) !== 0 && mouse.shift); }

function unprojectAtZ(mx, my, z) {
  const s = FOV / (FOV + z);
  return [(mx - CX) / s, (my - CY) / s];
}

function findNearest(mx, my, radius) {
  let best = -1, bd = radius * radius;
  for (let i = 0; i < N; i++) {
    const dx = sx[i] - mx, dy = sy[i] - my;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function cutAt(mx, my, r) {
  const r2 = r * r;
  for (let c = 0; c < cons.length; c++) {
    if (!cons[c].on) continue;
    const a = cons[c].a, b = cons[c].b;
    const mxs = (sx[a] + sx[b]) * 0.5, mys = (sy[a] + sy[b]) * 0.5;
    const dx = mxs - mx, dy = mys - my;
    if (dx * dx + dy * dy < r2) cons[c].on = false;
  }
}

canvas.addEventListener("contextmenu", e => e.preventDefault());

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.buttons = e.buttons; mouse.shift = e.shiftKey;
  if ((e.buttons & 1) && !e.shiftKey) {
    const i = findNearest(mouse.x, mouse.y, 46);
    if (i >= 0 && !pin[i]) {
      grab = i;
      const t = unprojectAtZ(mouse.x, mouse.y, pz[i]);
      grabTX = t[0]; grabTY = t[1];
      canvas.classList.add("grabbing");
    }
  }
});

canvas.addEventListener("pointermove", e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.buttons = e.buttons; mouse.shift = e.shiftKey;
  if (cutting()) {
    cutAt(mouse.x, mouse.y, 13);
    canvas.classList.add("cutting");
  } else if (grab < 0) {
    canvas.classList.remove("cutting");
  }
});

function releasePointer() {
  mouse.buttons = 0;
  grab = -1;
  canvas.classList.remove("grabbing");
  canvas.classList.remove("cutting");
}
canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("pointerleave", releasePointer);

/* ------------------------------------------------------------- physics step */

function step(dt) {
  simTime += dt;

  // forces -> verlet integrate
  const wind = windOn.v ? WIND : 0;
  const gust = 0.6 + 0.4 * Math.sin(simTime * 1.7);
  const sway = 0.75 + 0.25 * Math.sin(simTime * 0.53);

  for (let i = 0; i < N; i++) {
    if (pin[i]) { ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i]; continue; }
    if (i === grab) {
      // particle follows the mouse; prev keeps drag velocity for the fling
      ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i];
      px[i] = grabTX; py[i] = grabTY;
      continue;
    }

    let ax = 0, ay = GRAVITY, az = 0;
    if (wind) {
      az += wind * gust * sway * (0.8 + 0.2 * Math.sin(simTime * 2.3 + py[i] * 0.006 + px[i] * 0.004));
      ax += wind * 0.28 * Math.sin(simTime * 1.1 + py[i] * 0.01);
    }

    const vx = (px[i] - ox[i]) * DAMP;
    const vy = (py[i] - oy[i]) * DAMP;
    const vz = (pz[i] - oz[i]) * DAMP;
    ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i];
    px[i] += vx + ax * dt * dt;
    py[i] += vy + ay * dt * dt;
    pz[i] += vz + az * dt * dt;
  }

  // constraint relaxation
  for (let it = 0; it < ITER; it++) {
    for (let c = 0; c < cons.length; c++) {
      const cn = cons[c];
      if (!cn.on) continue;
      const a = cn.a, b = cn.b;
      let dx = px[b] - px[a], dy = py[b] - py[a], dz = pz[b] - pz[a];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 1e-9) continue;
      if (fragile.v && d > cn.rest * TEAR) { cn.on = false; continue; }

      let diff = ((d - cn.rest) / d) * cn.k;
      const pa = pin[a] || a === grab, pb = pin[b] || b === grab;
      if (pa && pb) continue;
      if (pa) diff *= 2;
      else if (pb) diff *= 2;
      else diff *= 1; // each side takes half below

      const half = diff * 0.5;
      if (!pa) { px[a] += dx * (pa ? diff : half); py[a] += dy * (pa ? diff : half); pz[a] += dz * (pa ? diff : half); }
      if (!pb) { px[b] -= dx * (pb ? diff : half); py[b] -= dy * (pb ? diff : half); pz[b] -= dz * (pb ? diff : half); }
    }
  }
}

/* ------------------------------------------------------------------ render */

// triangles
const TRIS = (COLS - 1) * (ROWS - 1) * 2;
const tA = new Uint32Array(TRIS), tB = new Uint32Array(TRIS), tC = new Uint32Array(TRIS);
const tDepth = new Float64Array(TRIS);
const tOrder = new Uint32Array(TRIS);
let tPtr = 0;
{ let t = 0;
  for (let y = 0; y < ROWS - 1; y++)
    for (let x = 0; x < COLS - 1; x++) {
      const i0 = idx(x, y), i1 = idx(x + 1, y), i2 = idx(x, y + 1), i3 = idx(x + 1, y + 1);
      tA[t] = i0; tB[t] = i2; tC[t] = i1; t++;
      tA[t] = i1; tB[t] = i2; tC[t] = i3; t++;
    }
}
for (let i = 0; i < TRIS; i++) tOrder[i] = i;

const L1x = 0.34, L1y = -0.44, L1z = -0.83;   // key light
const L2x = -0.52, L2y = -0.18, L2z = -0.83;  // fill

function draw() {
  // background
  const bg = ctx.createRadialGradient(CX, CY * 0.9, 80, CX, CY, Math.max(W, H) * 0.85);
  bg.addColorStop(0, "#10141d");
  bg.addColorStop(1, "#05060a");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // project particles
  for (let i = 0; i < N; i++) {
    const s = FOV / (FOV + pz[i]);
    ss[i] = s;
    sx[i] = CX + px[i] * s;
    sy[i] = CY + py[i] * s;
  }

  // triangle depth
  for (let t = 0; t < TRIS; t++) {
    tDepth[t] = pz[tA[t]] + pz[tB[t]] + pz[tC[t]];
  }
  const order = Array.from(tOrder).sort((m, n) => tDepth[n] - tDepth[m]); // far first

  ctx.lineJoin = "round";
  ctx.lineWidth = 1;

  for (let k = 0; k < order.length; k++) {
    const t = order[k];
    const a = tA[t], b = tB[t], c = tC[t];

    // face normal
    const ux = px[b] - px[a], uy = py[b] - py[a], uz = pz[b] - pz[a];
    const vx2 = px[c] - px[a], vy2 = py[c] - py[a], vz2 = pz[c] - pz[a];
    let nx = uy * vz2 - uz * vy2;
    let ny = uz * vx2 - ux * vz2;
    let nz = ux * vy2 - uy * vx2;
    const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
    if (nl < 1e-9) continue;
    nx /= nl; ny /= nl; nz /= nl;
    if (nz > 0) { nx = -nx; ny = -ny; nz = -nz; }  // double-sided

    let d1 = nx * L1x + ny * L1y + nz * L1z;
    if (d1 < 0) d1 = 0;
    let d2 = nx * L2x + ny * L2y + nz * L2z;
    if (d2 < 0) d2 = 0;

    let bright = 0.16 + 0.86 * d1 + 0.20 * d2;
    if (bright > 1) bright = 1;

    // hue: crimson at the rail -> amber at the hem
    const rowAvg = ((a / COLS | 0) + (b / COLS | 0) + (c / COLS | 0)) / 3;
    const hue = 348 + (rowAvg / (ROWS - 1)) * 57;
    const light = 16 + 46 * bright;

    ctx.fillStyle = `hsl(${hue}, 74%, ${light}%)`;
    ctx.strokeStyle = ctx.fillStyle;
    ctx.beginPath();
    ctx.moveTo(sx[a], sy[a]);
    ctx.lineTo(sx[b], sy[b]);
    ctx.lineTo(sx[c], sy[c]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // pins
  ctx.fillStyle = "rgba(240, 242, 248, 0.9)";
  for (let i = 0; i < N; i++) {
    if (!pin[i]) continue;
    ctx.beginPath();
    ctx.arc(sx[i], sy[i], 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------------------------------------------------------------- loop */

let last = performance.now();
let acc = 0;
let fps = 60, fpsT = last;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  // update grab target at the particle's depth
  if (grab >= 0) {
    const t = unprojectAtZ(mouse.x, mouse.y, pz[grab]);
    grabTX = t[0]; grabTY = t[1];
  }

  acc += dt;
  while (acc >= DT) {
    step(DT);
    acc -= DT;
  }

  draw();

  fps = fps * 0.95 + (1 / Math.max(dt, 1e-4)) * 0.05;
  if (now - fpsT > 500) {
    fpsT = now;
    statsEl.textContent =
      `verlet · ${N.toLocaleString()} particles · ${cons.length.toLocaleString()} constraints · ${Math.round(fps)} fps`;
  }

  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- controls */

const btnWind = document.getElementById("btnWind");
const btnPins = document.getElementById("btnPins");
const btnFragile = document.getElementById("btnFragile");
const btnReset = document.getElementById("btnReset");

let pinsReleased = false;

function toggleWind() {
  windOn.v = !windOn.v;
  btnWind.classList.toggle("on", windOn.v);
}
function togglePins() {
  pinsReleased = !pinsReleased;
  if (pinsReleased) pin.fill(0);
  else pin.set(pinsBackup);
  btnPins.classList.toggle("on", pinsReleased);
  btnPins.textContent = pinsReleased ? "Re-pin edge" : "Release pins";
}
function toggleFragile() {
  fragile.v = !fragile.v;
  btnFragile.classList.toggle("on", fragile.v);
}
function reset() {
  grab = -1;
  canvas.classList.remove("grabbing");
  pinsReleased = false;
  btnPins.classList.remove("on");
  btnPins.textContent = "Release pins";
  buildCloth();
}

btnWind.addEventListener("click", toggleWind);
btnPins.addEventListener("click", togglePins);
btnFragile.addEventListener("click", toggleFragile);
btnReset.addEventListener("click", reset);

window.addEventListener("keydown", e => {
  if (e.repeat) return;
  switch (e.code) {
    case "Space": e.preventDefault(); togglePins(); break;
    case "KeyW": toggleWind(); break;
    case "KeyF": toggleFragile(); break;
    case "KeyR": reset(); break;
  }
});
window.addEventListener("keyup", e => { mouse.shift = e.shiftKey; });

/* --------------------------------------------------------------- start */

buildCloth();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
