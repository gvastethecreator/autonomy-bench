<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Flow — Cross-Dock Simulator</title>
<style>
  :root {
    --bg: #0a0f1c;
    --panel: #101828;
    --panel-2: #0d1524;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #14203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
  }
  header {
    width: 100%;
    max-width: 992px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 6px 11px;
    min-width: 86px;
  }
  .chip .k {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
  }
  .chip .v {
    display: block;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .card {
    width: 100%;
    max-width: 992px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: #0d1424;
  }
  .controls {
    width: 100%;
    max-width: 992px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    background: #16213a;
    color: var(--text);
    border: 1px solid #27354f;
    border-radius: 9px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover:not(:disabled) { background: #1d2c4c; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: #0e4a6e; border-color: #1d6ea3; }
  button.primary:hover { background: #125a8a; }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }
  .legend {
    width: 100%;
    max-width: 992px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    align-items: center;
  }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>WAREHOUSE <span>FLOW</span></h1>
    <div class="subtitle">cross-dock simulator · workers move freight from inbound trucks to outbound trucks</div>
  </div>
  <div class="stats">
    <div class="chip"><span class="k">Moved</span><span class="v" id="stMoved">0</span></div>
    <div class="chip"><span class="k">Trucks out</span><span class="v" id="stTrucks">0</span></div>
    <div class="chip"><span class="k">On floor</span><span class="v" id="stStaging">0</span></div>
    <div class="chip"><span class="k">Workers</span><span class="v" id="stWorkers">0</span></div>
    <div class="chip"><span class="k">Pkgs / min</span><span class="v" id="stRate">0.0</span></div>
    <div class="chip"><span class="k">Shift time</span><span class="v" id="stClock">00:00</span></div>
  </div>
</header>

<div class="card"><canvas id="cv" width="960" height="540"></canvas></div>

<div class="controls">
  <button id="btnPause" class="primary">⏸ Pause</button>
  <button id="btnSpeed">Speed 1×</button>
  <button id="btnAdd">＋ Worker</button>
  <button id="btnRemove">－ Worker</button>
  <div class="spacer"></div>
  <div class="hint">space = pause · workers are hired at the break room (bottom middle)</div>
</div>

<div class="legend" id="legend"></div>

<script>
"use strict";
/* ============================================================
   WAREHOUSE FLOW — a single-file cross-dock simulation
   Inbound trucks (left) unload packages onto the staging floor.
   Workers pathfind around racking, carry each package to the
   matching outbound truck (right), and trucks depart when full.
   ============================================================ */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const CELL = 30, COLS = 32, ROWS = 18;
const W = COLS * CELL, H = ROWS * CELL;
const K = (c, r) => r * COLS + c;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);

const PALETTE = [
  { hex: "#f59e0b", name: "Amber" },
  { hex: "#22d3ee", name: "Cyan"  },
  { hex: "#a78bfa", name: "Violet"},
  { hex: "#4ade80", name: "Green" },
  { hex: "#fb7185", name: "Rose"  }
];
const VESTS = ["#f97316", "#38bdf8", "#a3e635", "#e879f9", "#fbbf24", "#34d399", "#f87171", "#60a5fa"];

/* ---------- warehouse geometry ---------- */
// Racking blocks (obstacles) in the middle of the floor.
const RACKS = [];
for (const r of [2, 5, 8, 11, 14]) {
  RACKS.push({ c: 12, r: r, w: 3, h: 2 });
  RACKS.push({ c: 18, r: r, w: 3, h: 2 });
}
const blocked = new Set();
for (const rk of RACKS)
  for (let c = rk.c; c < rk.c + rk.w; c++)
    for (let r = rk.r; r < rk.r + rk.h; r++)
      blocked.add(K(c, r));

const STAGING = { c0: 4, c1: 9, r0: 2, r1: 15 }; // preferred drop zone (cols 2-3 are spill)
const BAY_ROWS = [3, 8, 13];
const DROP_C = 28; // column where workers stand to load outbound trucks

function walkable(c, r) {
  return c >= 0 && c < COLS && r >= 0 && r < ROWS && !blocked.has(K(c, r));
}

/* ---------- A* pathfinding (4-dir) ---------- */
function astar(sc, sr, tc, tr) {
  if (!walkable(tc, tr)) {
    let best = null, bd = 1e9;
    for (let dc = -2; dc <= 2; dc++) for (let dr = -2; dr <= 2; dr++) {
      const c = tc + dc, r = tr + dr;
      if (walkable(c, r)) { const d = Math.abs(dc) + Math.abs(dr); if (d < bd) { bd = d; best = { c, r }; } }
    }
    if (!best) return null;
    tc = best.c; tr = best.r;
  }
  const start = K(sc, sr), goal = K(tc, tr);
  if (start === goal) return [{ c: sc, r: sr }];
  const g = new Map([[start, 0]]);
  const came = new Map();
  const open = [{ k: start, c: sc, r: sr, f: Math.abs(tc - sc) + Math.abs(tr - sr) }];
  let guard = 0;
  while (open.length && guard++ < 5000) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
    const cur = open.splice(bi, 1)[0];
    if (cur.k === goal) {
      const path = [];
      let k = goal;
      while (k !== undefined) {
        path.push({ c: k % COLS, r: Math.floor(k / COLS) });
        k = came.get(k);
      }
      path.reverse();
      return path;
    }
    const cg = g.get(cur.k);
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = cur.c + dc, nr = cur.r + dr;
      if (!walkable(nc, nr)) continue;
      const nk = K(nc, nr);
      const ng = cg + 1;
      if (ng < (g.get(nk) === undefined ? Infinity : g.get(nk))) {
        g.set(nk, ng);
        came.set(nk, cur.k);
        open.push({ k: nk, c: nc, r: nr, f: ng + Math.abs(tc - nc) + Math.abs(tr - nr) });
      }
    }
  }
  return null;
}

/* ---------- simulation state ---------- */
const sim = { time: 0, speed: 1, paused: false, moved: 0, trucksOut: 0 };
const packages = [];
const pkgAt = new Map();
const workers = [];
const effects = [];
const floats = [];
let workerSeq = 0;

const inBays = BAY_ROWS.map(r => ({ row: r, truck: null, respawn: rnd(0.5, 2) }));
const outBays = BAY_ROWS.map(r => ({ row: r, truck: null, respawn: rnd(0.5, 2) }));

function dockedOutTrucks() {
  const list = [];
  for (const b of outBays) if (b.truck && b.truck.phase === "docked") list.push(b.truck);
  return list;
}
function chooseTruckFor(color) {
  let best = null;
  for (const t of dockedOutTrucks()) {
    if (t.color !== color || t.load >= t.cap) continue;
    if (!best || t.load < best.load) best = t;
  }
  return best;
}

function spawnInTruck(bay) {
  bay.truck = { phase: "arriving", t: 0, row: bay.row, queue: 4 + irnd(3), ut: 1.0, wait: 0 };
}
function spawnOutTruck(bay) {
  // Prefer a color that waiting packages actually need, to keep flow balanced.
  const need = new Map();
  for (const p of packages) need.set(p.color, (need.get(p.color) || 0) + 1);
  let color = null;
  if (need.size && Math.random() < 0.7) {
    let bn = 0;
    for (const [col, n] of need) if (n > bn) { bn = n; color = col; }
  }
  if (!color) color = PALETTE[irnd(PALETTE.length)].hex;
  bay.truck = { phase: "arriving", t: 0, row: bay.row, load: 0, cap: 5 + irnd(3), color: color, delay: 0 };
}

function spawnPackage(bayRow) {
  const docked = dockedOutTrucks().filter(t => t.load < t.cap);
  const color = docked.length ? docked[irnd(docked.length)].color : PALETTE[irnd(PALETTE.length)].hex;
  // nearest free floor cell to the bay mouth (staging zone first, spill left if full)
  const cand = [];
  for (let c = STAGING.c0; c <= STAGING.c1; c++)
    for (let r = STAGING.r0; r <= STAGING.r1; r++)
      if (walkable(c, r)) cand.push({ c, r, d: Math.abs(r - bayRow) + Math.abs(c - 2) + (c < STAGING.c0 + 6 ? 0 : 1) });
  for (let c = 2; c < STAGING.c0; c++)
    for (let r = 2; r <= 15; r++)
      if (walkable(c, r)) cand.push({ c, r, d: 50 + Math.abs(r - bayRow) });
  cand.sort((a, b) => a.d - b.d);
  const spot = cand.find(s => !pkgAt.has(K(s.c, s.r)));
  if (!spot) return false; // floor completely jammed
  const p = { c: spot.c, r: spot.r, color: color, pop: 0, reserved: false, truck: null };
  packages.push(p);
  pkgAt.set(K(p.c, p.r), p);
  effects.push({ x: (p.c + 0.5) * CELL, y: (p.r + 0.5) * CELL, t: 0, color: color });
  return true;
}
function removePackage(p) {
  pkgAt.delete(K(p.c, p.r));
  const i = packages.indexOf(p);
  if (i >= 0) packages.splice(i, 1);
}

function spawnWorker() {
  const c = 13 + irnd(7), r = 16;
  workers.push({
    id: workerSeq++,
    px: c + 0.5, py: r + 0.5,
    path: null, pi: 0,
    state: "idle", timer: 0, searchCd: rnd(0, 0.3), wanderCd: rnd(0.5, 2),
    pkg: null, carrying: false,
    speed: rnd(3.3, 4.0),
    facing: 1, walkPhase: rnd(0, 6), bob: rnd(0, 6),
    vest: VESTS[workerSeq % VESTS.length]
  });
}

/* ---------- worker behaviour ---------- */
function reservePackage(w) {
  let best = null, bd = 1e9;
  for (const p of packages) {
    if (p.reserved || p.pop < 1) continue;
    if (!chooseTruckFor(p.color)) continue;
    const d = Math.abs(p.c + 0.5 - w.px) + Math.abs(p.r + 0.5 - w.py);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) {
    best.reserved = true;
    w.pkg = best;
    return best;
  }
  return null;
}

function pathTo(w, c, r) {
  const p = astar(Math.floor(w.px), Math.floor(w.py), c, r);
  if (p && p.length) { w.path = p; w.pi = 0; return true; }
  w.path = null;
  return false;
}

function stepAlong(w, dt) {
  if (!w.path) return true;
  let step = w.speed * dt;
  while (step > 0 && w.pi < w.path.length - 1) {
    const a = w.path[w.pi], b = w.path[w.pi + 1];
    const tx = b.c + 0.5, ty = b.r + 0.5;
    const dx = tx - w.px, dy = ty - w.py;
    const d = Math.abs(dx) + Math.abs(dy);
    if (Math.abs(dx) > 0.01) w.facing = dx > 0 ? 1 : -1;
    if (step >= d) {
      w.px = tx; w.py = ty; w.pi++; step -= d;
    } else {
      w.px += (dx / d) * step; w.py += (dy / d) * step;
      w.walkPhase += step * 9;
      step = 0;
    }
  }
  return w.pi >= w.path.length - 1;
}

function updateWorker(w, dt) {
  switch (w.state) {
    case "idle": {
      w.searchCd -= dt;
      if (w.searchCd <= 0) {
        w.searchCd = 0.25;
        const p = reservePackage(w);
        if (p) {
          if (pathTo(w, p.c, p.r)) { w.state = "toPackage"; break; }
          p.reserved = false; w.pkg = null; // unreachable (shouldn't happen)
        }
      }
      // nothing to do: mill about
      w.wanderCd -= dt;
      if (w.wanderCd <= 0) {
        w.wanderCd = rnd(1.5, 3.5);
        if (Math.random() < 0.6) {
          const c = clamp(Math.floor(w.px) + irnd(9) - 4, 2, 29);
          const r = clamp(Math.floor(w.py) + irnd(9) - 4, 1, 16);
          if (walkable(c, r)) pathTo(w, c, r);
        } else w.path = null;
      }
      stepAlong(w, dt);
      break;
    }
    case "toPackage": {
      if (!w.pkg) { w.state = "idle"; break; }
      if (stepAlong(w, dt)) { w.state = "picking"; w.timer = 0.35; w.path = null; }
      break;
    }
    case "picking": {
      w.timer -= dt;
      if (w.timer <= 0) {
        w.carrying = true;
        const t = chooseTruckFor(w.pkg.color);
        if (t && pathTo(w, DROP_C, t.row)) { w.state = "toTruck"; w.truckRow = t.row; }
        else { w.state = "wait"; w.timer = 0.4; }
      }
      break;
    }
    case "wait": { // holding a package, waiting for an outbound truck with room
      w.timer -= dt;
      if (w.timer <= 0) {
        const t = chooseTruckFor(w.pkg.color);
        if (t && pathTo(w, DROP_C, t.row)) { w.state = "toTruck"; w.truckRow = t.row; }
        else w.timer = 0.4;
      }
      break;
    }
    case "toTruck": {
      if (!w.pkg) { w.state = "idle"; w.carrying = false; break; }
      if (stepAlong(w, dt)) { w.state = "depositing"; w.timer = 0.3; w.path = null; }
      break;
    }
    case "depositing": {
      w.timer -= dt;
      if (w.timer <= 0) {
        const bay = outBays.find(b => b.truck && b.truck.phase === "docked" && b.row === w.truckRow);
        const truck = bay ? bay.truck : null;
        if (truck) {
          truck.load++;
          sim.moved++;
          effects.push({ x: (DROP_C + 0.9) * CELL, y: (truck.row + 0.5) * CELL, t: 0, color: "#4ade80" });
          floats.push({ x: (DROP_C - 0.4) * CELL, y: (truck.row + 0.2) * CELL, t: 0, text: "+1", color: "#4ade80" });
          removePackage(w.pkg);
          w.pkg = null; w.carrying = false;
          w.state = "idle"; w.searchCd = 0;
        } else {
          // target truck slipped away full — wait for the next one of this color
          w.state = "wait"; w.timer = 0.4;
        }
      }
      break;
    }
  }
  w.bob += dt * (w.path && w.pi < w.path.length - 1 ? 9 : 2);
}

/* ---------- trucks ---------- */
function updateBays(dt) {
  // inbound
  for (const bay of inBays) {
    const t = bay.truck;
    if (!t) {
      bay.respawn -= dt;
      if (bay.respawn <= 0) spawnInTruck(bay);
      continue;
    }
    if (t.phase === "arriving") {
      t.t += dt / 1.4;
      if (t.t >= 1) { t.t = 0; t.phase = "docked"; }
    } else if (t.phase === "docked") {
      if (t.queue > 0) {
        t.ut -= dt;
        if (t.ut <= 0) {
          if (spawnPackage(bay.row)) t.queue--;
          const congested = packages.length > 45 ? 2 : 1;
          t.ut = (t.queue > 0 ? rnd(2.2, 3.4) : 1.0) * congested;
        }
      } else {
        t.wait += dt;
        if (t.wait > 2) { t.phase = "departing"; t.t = 0; }
      }
    } else { // departing
      t.t += dt / 1.6;
      if (t.t >= 1) { bay.truck = null; bay.respawn = rnd(2, 4.5); }
    }
  }
  // outbound
  for (const bay of outBays) {
    const t = bay.truck;
    if (!t) {
      bay.respawn -= dt;
      if (bay.respawn <= 0) spawnOutTruck(bay);
      continue;
    }
    if (t.phase === "arriving") {
      t.t += dt / 1.4;
      if (t.t >= 1) { t.t = 0; t.phase = "docked"; }
    } else if (t.phase === "docked") {
      if (t.load >= t.cap) {
        t.delay += dt;
        if (t.delay > 0.7) { t.phase = "departing"; t.t = 0; }
      }
    } else { // departing
      t.t += dt / 1.6;
      if (t.t >= 1) {
        sim.trucksOut++;
        bay.truck = null;
        bay.respawn = rnd(1.5, 3.5);
      }
    }
  }
}

function update(dt) {
  sim.time += dt;
  updateBays(dt);
  for (const p of packages) if (p.pop < 1) p.pop = Math.min(1, p.pop + dt * 4);
  for (const w of workers) updateWorker(w, dt);
  for (let i = effects.length - 1; i >= 0; i--) { effects[i].t += dt * 2.4; if (effects[i].t >= 1) effects.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt * 1.1; if (floats[i].t >= 1) floats.splice(i, 1); }
}

/* ============================================================
   RENDERING
   ============================================================ */
function seedRand(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawFloor(time) {
  // base
  ctx.fillStyle = "#0d1424";
  ctx.fillRect(0, 0, W, H);

  // subtle concrete tiles
  ctx.strokeStyle = "rgba(148,163,184,0.05)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 0; c <= COLS; c++) { ctx.moveTo(c * CELL + 0.5, 0); ctx.lineTo(c * CELL + 0.5, H); }
  for (let r = 0; r <= ROWS; r++) { ctx.moveTo(0, r * CELL + 0.5); ctx.lineTo(W, r * CELL + 0.5); }
  ctx.stroke();

  // staging zone
  const sx = STAGING.c0 * CELL, sy = STAGING.r0 * CELL;
  const sw = (STAGING.c1 - STAGING.c0 + 1) * CELL, sh = (STAGING.r1 - STAGING.r0 + 1) * CELL;
  ctx.fillStyle = "rgba(56,189,248,0.035)";
  ctx.fillRect(sx, sy, sw, sh);
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = "rgba(56,189,248,0.28)";
  ctx.strokeRect(sx + 0.5, sy + 0.5, sw - 1, sh - 1);
  ctx.setLineDash([]);

  // break room
  const bx = 13 * CELL, by = 16 * CELL;
  ctx.fillStyle = "rgba(251,191,36,0.05)";
  rr(bx + 4, by + 4, 7 * CELL - 8, 2 * CELL - 8, 10);
  ctx.fill();
  ctx.strokeStyle = "rgba(251,191,36,0.25)";
  ctx.stroke();
  ctx.fillStyle = "rgba(251,191,36,0.35)";
  ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("BREAK ROOM", bx + 3.5 * CELL, by + 24);
  ctx.beginPath();
  ctx.arc(bx + 3.5 * CELL, by + 44, 9, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(251,191,36,0.4)";
  ctx.stroke();

  // flow chevrons down the main aisle
  ctx.strokeStyle = "rgba(56,189,248,0.10)";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  for (const ry of BAY_ROWS) {
    const y = (ry + 0.5) * CELL;
    for (let x = 330; x < 660; x += 70) {
      const a = 0.06 + 0.05 * Math.sin(time * 2 - x * 0.02 + ry);
      ctx.strokeStyle = `rgba(56,189,248,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(x, y - 7);
      ctx.lineTo(x + 8, y);
      ctx.lineTo(x, y + 7);
      ctx.stroke();
    }
  }
  ctx.lineCap = "butt";

  // hazard stripes at both dock walls
  for (let y = 0; y < H; y += 18) {
    ctx.fillStyle = "rgba(251,191,36,0.45)";
    ctx.fillRect(0, y, 4, 9);
    ctx.fillRect(W - 4, y, 4, 9);
  }

  // zone labels
  ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "rgba(148,163,184,0.55)";
  ctx.textAlign = "left";
  ctx.fillText("INBOUND DOCK", 10, 18);
  ctx.textAlign = "center";
  ctx.fillText("STAGING", sx + sw / 2, sy - 6);
  ctx.textAlign = "right";
  ctx.fillText("OUTBOUND DOCK", W - 10, 18);
  ctx.textAlign = "left";
}

function drawRacks() {
  RACKS.forEach((rk, idx) => {
    const x = rk.c * CELL + 2, y = rk.r * CELL + 2;
    const w = rk.w * CELL - 4, h = rk.h * CELL - 4;
    ctx.fillStyle = "#16203a";
    rr(x, y, w, h, 5);
    ctx.fill();
    ctx.strokeStyle = "#2a3a5c";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // shelves
    ctx.strokeStyle = "rgba(148,163,184,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 3, y + h / 2 + 0.5); ctx.lineTo(x + w - 3, y + h / 2 + 0.5);
    ctx.moveTo(x + 3, y + h / 4 + 0.5); ctx.lineTo(x + w - 3, y + h / 4 + 0.5);
    ctx.moveTo(x + 3, y + 3 * h / 4 + 0.5); ctx.lineTo(x + w - 3, y + 3 * h / 4 + 0.5);
    ctx.stroke();
    // stored cartons (deterministic per rack)
    const rand = seedRand(idx * 977 + 13);
    for (let i = 0; i < 8; i++) {
      const cx = x + 6 + rand() * (w - 16);
      const cy = y + 6 + rand() * (h - 14);
      const cw = 7 + rand() * 7;
      ctx.fillStyle = `rgba(148,163,184,${(0.10 + rand() * 0.12).toFixed(2)})`;
      ctx.fillRect(cx, cy, cw, 5);
    }
    // uprights
    ctx.fillStyle = "#3b4d75";
    ctx.fillRect(x - 1, y - 2, 3, h + 4);
    ctx.fillRect(x + w - 2, y - 2, 3, h + 4);
  });
}

function drawPackageShape(x, y, size, color, alpha) {
  const s = size;
  ctx.globalAlpha = alpha;
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(x, y + s * 0.45, s * 0.55, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // box
  ctx.fillStyle = color;
  rr(x - s / 2, y - s / 2, s, s * 0.9, 3);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // tape
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - s / 2); ctx.lineTo(x, y + s * 0.4);
  ctx.stroke();
  // label
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillRect(x + s * 0.14, y - s * 0.3, s * 0.2, s * 0.16);
  ctx.globalAlpha = 1;
}

function drawPackages() {
  for (const p of packages) {
    const s = 20 * easeOutBack(clamp(p.pop, 0, 1));
    drawPackageShape((p.c + 0.5) * CELL, (p.r + 0.55) * CELL, Math.max(4, s), p.color, 1);
    if (p.reserved && !p.truck) {
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc((p.c + 0.5) * CELL, (p.r + 0.55) * CELL, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawWheels(x, y, w) {
  ctx.fillStyle = "#0b1220";
  for (const wx of [x + 12, x + w - 14, x + w - 34]) {
    ctx.beginPath(); ctx.arc(wx, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#33415c";
    ctx.beginPath(); ctx.arc(wx, y, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b1220";
  }
}

function drawInTruck(t) {
  const e = easeOutCubic(clamp(t.t, 0, 1));
  const d = easeInCubic(clamp(t.t, 0, 1));
  const off = t.phase === "arriving" ? -430 * (1 - e) : t.phase === "departing" ? -430 * d : 0;
  const x = 6 + off, y = (t.row + 0.5) * CELL - 34;
  // cab
  ctx.fillStyle = "#33415c";
  rr(x - 40, y + 8, 44, 52, 8); ctx.fill();
  ctx.fillStyle = "#7dd3fc";
  rr(x - 36, y + 14, 16, 14, 3); ctx.fill();
  // trailer
  ctx.fillStyle = "#1c2a45";
  rr(x, y, 104, 68, 6); ctx.fill();
  ctx.strokeStyle = "#3d5580";
  ctx.lineWidth = 2; ctx.stroke();
  // ribbing
  ctx.strokeStyle = "rgba(148,163,184,0.15)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 7; i++) { ctx.moveTo(x + i * 14, y + 4); ctx.lineTo(x + i * 14, y + 64); }
  ctx.stroke();
  // cargo indicator: remaining cartons
  for (let i = 0; i < Math.min(t.queue, 4); i++) {
    ctx.fillStyle = "rgba(148,163,184,0.5)";
    ctx.fillRect(x + 86 - i * 13, y + 26, 10, 16);
  }
  drawWheels(x, y + 68, 104);
  // status text
  ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "rgba(226,232,240,0.75)";
  ctx.textAlign = "center";
  ctx.fillText(t.phase === "docked" ? (t.queue > 0 ? "UNLOADING · " + t.queue + " LEFT" : "EMPTY · DEPARTING") :
               t.phase === "arriving" ? "ARRIVING" : "DEPARTING", x + 52, y - 8);
}

function drawOutTruck(t) {
  const e = easeOutCubic(clamp(t.t, 0, 1));
  const d = easeInCubic(clamp(t.t, 0, 1));
  const off = t.phase === "arriving" ? 430 * (1 - e) : t.phase === "departing" ? 430 * d : 0;
  const x = W - 116 + off, y = (t.row + 0.5) * CELL - 34;
  // cab (right side)
  ctx.fillStyle = "#33415c";
  rr(x + 100, y + 8, 44, 52, 8); ctx.fill();
  ctx.fillStyle = "#7dd3fc";
  rr(x + 120, y + 14, 16, 14, 3); ctx.fill();
  // trailer
  ctx.fillStyle = "#1c2a45";
  rr(x, y, 104, 68, 6); ctx.fill();
  ctx.strokeStyle = "#3d5580";
  ctx.lineWidth = 2; ctx.stroke();
  // color band
  ctx.fillStyle = t.color;
  rr(x + 6, y + 6, 92, 8, 3); ctx.fill();
  // fill bar
  const frac = clamp(t.load / t.cap, 0, 1);
  const bx = x + 10, by = y + 24, bw = 84, bh = 10;
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  rr(bx, by, bw, bh, 4); ctx.fill();
  if (frac > 0) {
    ctx.fillStyle = frac >= 1 ? "#4ade80" : t.color;
    rr(bx, by, Math.max(6, bw * frac), bh, 4); ctx.fill();
  }
  ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "rgba(226,232,240,0.9)";
  ctx.textAlign = "center";
  ctx.fillText(t.load + " / " + t.cap + " LOADED", x + 52, y + 50);
  drawWheels(x, y + 68, 104);
  ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "rgba(226,232,240,0.75)";
  ctx.fillText(t.phase === "docked" ? (frac >= 1 ? "FULL · DEPARTING" : "LOADING") :
               t.phase === "arriving" ? "ARRIVING" : "DEPARTING", x + 52, y - 8);
}

function drawWorker(w, time) {
  const x = w.px * CELL, y = w.py * CELL;
  const moving = w.path && w.pi < w.path.length - 1;
  const bob = Math.sin(w.bob) * (moving ? 1.6 : 0.5);
  const busy = w.state === "picking" || w.state === "depositing";
  const squash = busy ? 0.88 : 1;
  const leg = moving ? Math.sin(w.walkPhase) * 3 : 0;

  ctx.save();
  ctx.translate(x, y);
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(0, 7, 9, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.fillStyle = "#243350";
  ctx.fillRect(-5, 0 + bob * 0.3, 4, 7 + leg);
  ctx.fillRect(1, 0 + bob * 0.3, 4, 7 - leg);
  // body
  ctx.translate(0, bob);
  ctx.scale(w.facing, 1);
  ctx.scale(busy ? 1.06 : 1, squash);
  ctx.fillStyle = w.vest;
  rr(-8, -14, 16, 16, 5); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.2; ctx.stroke();
  // hi-vis stripes
  ctx.strokeStyle = "rgba(255,255,255,0.65)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-6, -9.5); ctx.lineTo(6, -9.5);
  ctx.moveTo(-6, -5.5); ctx.lineTo(6, -5.5);
  ctx.stroke();
  // head + hard hat
  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath(); ctx.arc(0, -19, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd23f";
  ctx.beginPath(); ctx.arc(0, -20.5, 5.6, Math.PI, 0); ctx.fill();
  ctx.fillRect(-6.5, -21, 13, 2.4);
  ctx.restore();

  // carried package above head
  if (w.carrying && w.pkg) drawPackageShape(x - w.facing * 2, y - 34 + bob, 15, w.pkg.color, 1);
}

function drawEffects() {
  for (const fx of effects) {
    const t = clamp(fx.t, 0, 1);
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = fx.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, 5 + 15 * t, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.font = "800 14px ui-sans-serif, system-ui, sans-serif";
  ctx.textAlign = "center";
  for (const f of floats) {
    const t = clamp(f.t, 0, 1);
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - 26 * t);
  }
  ctx.globalAlpha = 1;
}

function draw(time) {
  drawFloor(time);
  drawRacks();
  drawPackages();
  for (const b of inBays) if (b.truck) drawInTruck(b.truck);
  for (const b of outBays) if (b.truck) drawOutTruck(b.truck);
  for (const w of workers) drawWorker(w, time);
  drawEffects();

  if (sim.paused) {
    ctx.fillStyle = "rgba(10,15,28,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "800 26px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W / 2, H / 2);
    ctx.font = "600 13px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("press space or the pause button to resume", W / 2, H / 2 + 24);
  }
}

/* ---------- HUD + controls ---------- */
const el = id => document.getElementById(id);
let hudAcc = 0;
function updateHUD() {
  el("stMoved").textContent = sim.moved;
  el("stTrucks").textContent = sim.trucksOut;
  el("stStaging").textContent = packages.length;
  el("stWorkers").textContent = workers.length;
  el("stRate").textContent = sim.time > 8 ? (sim.moved / (sim.time / 60)).toFixed(1) : "—";
  const m = Math.floor(sim.time / 60), s = Math.floor(sim.time % 60);
  el("stClock").textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  el("btnRemove").disabled = !workers.some(w => !w.pkg);
  el("btnAdd").disabled = workers.length >= 12;
}

el("btnPause").addEventListener("click", () => {
  sim.paused = !sim.paused;
  el("btnPause").textContent = sim.paused ? "▶ Resume" : "⏸ Pause";
});
el("btnSpeed").addEventListener("click", () => {
  sim.speed = sim.speed === 1 ? 2 : sim.speed === 2 ? 4 : 1;
  el("btnSpeed").textContent = "Speed " + sim.speed + "×";
});
el("btnAdd").addEventListener("click", () => {
  if (workers.length < 12) { spawnWorker(); updateHUD(); }
});
el("btnRemove").addEventListener("click", () => {
  for (let i = workers.length - 1; i >= 0; i--) {
    const w = workers[i];
    if (!w.pkg) { workers.splice(i, 1); updateHUD(); return; }
  }
});
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    el("btnPause").click();
  }
});

// color legend
(function buildLegend() {
  const lg = el("legend");
  const label = document.createElement("span");
  label.textContent = "Freight lanes:";
  lg.appendChild(label);
  for (const p of PALETTE) {
    const item = document.createElement("span");
    item.className = "item";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = p.hex;
    item.appendChild(dot);
    item.appendChild(document.createTextNode(p.name));
    lg.appendChild(item);
  }
  const how = document.createElement("span");
  how.className = "item";
  how.style.marginLeft = "auto";
  how.textContent = "A package is only picked up when a truck of its color is docked with room to spare.";
  lg.appendChild(how);
})();

/* ---------- boot ---------- */
for (let i = 0; i < 5; i++) spawnWorker();
spawnInTruck(inBays[0]);
inBays[1].respawn = 1.5;
inBays[2].respawn = 3;
spawnOutTruck(outBays[0]);
outBays[1].respawn = 2;
outBays[2].respawn = 5;

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!sim.paused) update(dt * sim.speed);
  draw(sim.time);
  hudAcc += dt;
  if (hudAcc > 0.2) { hudAcc = 0; updateHUD(); }
  requestAnimationFrame(frame);
}
updateHUD();
requestAnimationFrame(frame);
</script>
</body>
