<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A Living Procedural Medieval City</title>
<style>
  :root{ --ink:#e9dcc2; --panel:rgba(24,19,14,.80); --edge:#7c6748; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;font-family:Georgia,'Times New Roman',serif}
  canvas{display:block}
  #ui{position:fixed;top:14px;left:14px;color:var(--ink);background:var(--panel);border:1px solid var(--edge);
      border-radius:10px;padding:12px 14px;width:284px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      user-select:none;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:6}
  #ui h1{margin:0 0 2px;font-size:20px;letter-spacing:.5px;font-variant:small-caps;font-weight:600}
  #ui .sub{font-size:11.5px;opacity:.75;font-style:italic;margin-bottom:8px}
  #meta{font-size:11px;opacity:.85;margin-bottom:2px;line-height:1.5}
  .row{display:flex;gap:6px;align-items:center;margin-top:7px}
  button{font-family:inherit;font-size:12.5px;color:var(--ink);background:#2c2318;border:1px solid var(--edge);
      border-radius:6px;padding:5px 10px;cursor:pointer}
  button:hover{background:#3b2f1f}
  label.chk{font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
  input[type=range]{flex:1;accent-color:#c9a86a}
  #clock{font-size:12px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
  .hint{margin-top:9px;font-size:10.5px;opacity:.55}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e9dcc2;
      background:#0b0f14;font-size:15px;z-index:10;text-align:center;line-height:1.8;transition:opacity .7s}
  #vignette{position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 55%, rgba(5,8,14,.42) 100%);z-index:5}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="loading">Raising the city from procedural stone…<br><span style="font-size:12px;opacity:.6">loading Three.js from CDN</span></div>
<div id="ui">
  <h1 id="title">…</h1>
  <div class="sub">a living procedural medieval city</div>
  <div id="meta">…</div>
  <div class="row">

  </div>
  <div class="row">

  </div>
  <div class="hint">drag to look · scroll to zoom · right-drag to pan · N = new city</div>
</div>
<div id="vignette"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== seeded randomness ============================== */
function mulberry32(s){ return function(){ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
let seed = Math.floor(Math.random()*1e9);
let _r = mulberry32(seed);
const rf = ()=>_r();
const rr = (a,b)=>a+_r()*(b-a);
const ri = (a,b)=>Math.floor(rr(a,b+1));
const pk = a=>a[Math.floor(_r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
const ryTo=(dx,dz)=>Math.atan2(dx,dz); // rotation that points local +Z along (dx,dz)
const angDiff=(a,b)=>{ let d=Math.abs(a-b)%(Math.PI*2); return d>Math.PI?Math.PI*2-d:d; };

/* ============================== palettes ============================== */
const PLASTER=['#e9dfc8','#e3d3b3','#ded6c2','#d9c9a6','#e6dccb','#d4c5a5','#e0d0b8','#cfc2a0','#e8e2d4','#d2bfa0'];
const ROOFS =['#96502f','#a05a35','#8a4a32','#7c4737','#6e4a3f','#5f6066','#53616b','#8b6f4f','#7a5b45','#68423c'];
const STONES=['#9a978c','#a09a8e','#948f83','#a5a198','#8f8b80','#98938a'];
const WOODS =['#7a5b3e','#6b4f36','#836448','#5f452f'];
const CLOTHES=['#7d4a37','#44577a','#5c6e46','#6f5a80','#836a44','#7a4a5e','#3f6e6a','#8a5a3a'];
const SKINS =['#e6c09a','#d9ad84','#c69571','#edbd97'];
const GREENS=['#4e7d3a','#5b8a41','#6b9448','#46753a','#588246','#77a04f'];
const AUTUMN=['#a87f3a','#b09245'];
const GUILD =['#a83232','#2f5a8a','#3f7a3f','#8a6a2a','#7a3a6a'];
const NAME_A=['Al','Bran','Cald','Dun','Fal','Grim','Hoch','Kil','Lin','Mar','Nor','Oak','Pell','Quel','Rose','Stone','Thor','Ul','Ver','Wick','Ash','Bel'];
const NAME_B=['burg','holm','ford','stead','haven','mark','shire','gard','cliffe','moor','bridge','field'];

/* ============================== renderer / scene ============================== */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8ec9ea');
scene.fog = new THREE.Fog('#8ec9ea', 170, 520);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 1600);
const INTRO_FROM = new THREE.Vector3(250, 190, 290);
const INTRO_TO   = new THREE.Vector3(95, 58, 112);
camera.position.copy(INTRO_FROM);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 18;
controls.maxDistance = 400;
controls.maxPolarAngle = 1.52;
controls.minPolarAngle = 0.12;
controls.autoRotateSpeed = 0.6;
controls.enabled = false; // during intro flight

/* lights */
const hemi = new THREE.HemisphereLight('#bfdcff', '#5c6b50', 0.6); scene.add(hemi);
const amb  = new THREE.AmbientLight('#ffffff', 0.14); scene.add(amb);
const sun  = new THREE.DirectionalLight('#fff2df', 1.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-150; sun.shadow.camera.right=150;
sun.shadow.camera.top=150;   sun.shadow.camera.bottom=-150;
sun.shadow.camera.near=20;   sun.shadow.camera.far=460;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.5;
scene.add(sun); scene.add(sun.target);
const moonL = new THREE.DirectionalLight('#8899cc', 0); scene.add(moonL); scene.add(moonL.target);

/* sky bodies */
const sunDisc  = new THREE.Mesh(new THREE.SphereGeometry(9,16,12), new THREE.MeshBasicMaterial({color:'#ffe9b0', fog:false}));
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(5.5,16,12), new THREE.MeshBasicMaterial({color:'#dfe8ff', fog:false}));
scene.add(sunDisc, moonDisc);
{
  const n=380, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const a=rf()*Math.PI*2, e=Math.asin(rf()*0.98+0.02), r=620;
    pos[i*3]=Math.cos(a)*Math.cos(e)*r; pos[i*3+1]=Math.sin(e)*r; pos[i*3+2]=Math.sin(a)*Math.cos(e)*r; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({color:'#cfd8ff', size:1.7, sizeAttenuation:false,
    transparent:true, opacity:0, depthWrite:false, fog:false}));
  scene.add(stars);
}
const cloudMat = new THREE.MeshStandardMaterial({color:'#ffffff', roughness:1, flatShading:true, transparent:true, opacity:0.88});
const clouds=[];
{
  const sgeo = new THREE.IcosahedronGeometry(1, 1);
  for(let c=0;c<8;c++){
    const parts=[]; const k=ri(4,6);
    for(let i=0;i<k;i++){ const s=sgeo.clone();
      s.scale(rr(2.2,4.6), rr(1.1,1.8), rr(1.8,3.2));
      s.translate(rr(-5,5), rr(-0.8,0.8), rr(-2.5,2.5)); parts.push(s); }
    const m=new THREE.Mesh(mergeAll(parts), cloudMat);
    m.position.set(rr(-230,230), rr(62,95), rr(-230,230));
    clouds.push({m, sp:rr(1.6,3.4)}); scene.add(m);
  }
}

/* ============================== shared materials & textures ============================== */
const solidMat = new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:0.95, metalness:0});
const winLitMat= new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.5, emissive:'#ffb45e', emissiveIntensity:0});
const winDarkMat=new THREE.MeshStandardMaterial({color:'#151a21', roughness:0.6});
solidMat.keep=winLitMat.keep=winDarkMat.keep=true;
const waterMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uTime:{value:0}, uNight:{value:0},
    uColA:{value:new THREE.Color('#2e6f8e')}, uColB:{value:new THREE.Color('#5aa8c8')} },
  vertexShader:`
    uniform float uTime; varying vec3 vP;
    void main(){
      vec3 p = position;
      float a = atan(p.x, p.z);
      p.y += sin(a*18.0 + uTime*1.6)*0.07 + sin(p.x*0.35 + uTime*0.9)*0.05 + sin(p.z*0.42 - uTime*0.7)*0.05;
      vP = p;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader:`
    uniform float uTime; uniform float uNight; uniform vec3 uColA; uniform vec3 uColB;
    varying vec3 vP;
    void main(){
      float a = atan(vP.x, vP.z); float r = length(vP.xz);
      float w1 = sin(a*36.0 - uTime*2.0)*0.5+0.5;
      float w2 = sin(a*11.0 + uTime*0.8 + r*0.6)*0.5+0.5;
      vec3 col = mix(uColA, uColB, w1*0.55 + w2*0.45);
      col = mix(col, vec3(0.05,0.10,0.16), uNight*0.75);
      gl_FragColor = vec4(col, 0.93);
    }`
});
function radialTex(stops){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d'); const g=x.createRadialGradient(32,32,2,32,32,30);
  for(const [o,col] of stops) g.addColorStop(o,col);
  x.fillStyle=g; x.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); return t;
}
const smokeTex = radialTex([[0,'rgba(255,255,255,0.85)'],[0.4,'rgba(255,255,255,0.45)'],[1,'rgba(255,255,255,0)']]);
const flameTex = radialTex([[0,'rgba(255,244,200,1)'],[0.3,'rgba(255,170,60,0.9)'],[0.7,'rgba(230,90,20,0.45)'],[1,'rgba(200,60,10,0)']]);

/* ============================== mesh builder buckets ============================== */
const B = { solid:[], lit:[], dark:[] };
let TM = new THREE.Matrix4();
function setTM(x,y,z,ry=0){ TM.makeRotationY(ry); TM.setPosition(x,y,z); }
function colorize(geo, color){
  const c = new THREE.Color(color);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr,3));
  return geo;
}
function mergeAll(list){
  const geos=[];
  for(const g of list||[]){
    if(!g||!g.attributes||!g.attributes.position) continue;
    const n=g.index?g.toNonIndexed():g;
    if(!n.getAttribute('color')) colorize(n,'#888888');
    geos.push(n);
  }
  if(!geos.length) return null;
  return mergeGeometries(geos);
}
function put(list, geo, color){ geo.applyMatrix4(TM); if(color!==undefined) colorize(geo,color); list.push(geo); }
function bx(list,w,h,d,color,x=0,y=0,z=0,ry=0,rz=0,rx=0){
  const g=new THREE.BoxGeometry(w,h,d);
  if(rx)g.rotateX(rx); if(rz)g.rotateZ(rz); if(ry)g.rotateY(ry);
  g.translate(x,y,z); put(list,g,color); }
function cy(list,rT,rB,h,color,x=0,y=0,z=0,seg=9){
  const g=new THREE.CylinderGeometry(rT,rB,h,seg); g.translate(x,y,z); put(list,g,color); }
function cn(list,r,h,color,x=0,y=0,z=0,seg=9){
  const g=new THREE.ConeGeometry(r,h,seg); g.translate(x,y,z); put(list,g,color); }
function pl(list,w,h,x=0,y=0,z=0,ry=0,color){
  const g=new THREE.PlaneGeometry(w,h); if(ry)g.rotateY(ry); g.translate(x,y,z); put(list,g,color); }
function circ(list,r,color,x=0,y=0,z=0,ry=0){
  const g=new THREE.CircleGeometry(r,26); if(ry)g.rotateY(ry); g.translate(x,y,z); put(list,g,color); }
function tri(list,color,a,b,c){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([...a,...b,...c],3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0,0,0,0,0,0],2));
  g.setIndex([0,1,2]);
  g.computeVertexNormals();
  put(list,g,color); }
/* gabled roof, ridge along local X, base at y0 */
function gableRoof(bw,bd,rh,wallCol,roofCol,y0){
  const hw=bw/2, hd=bd/2, ox=0.42, oz=0.55;
  const x0=-hw-ox, x1=hw+ox, zi=-(hd+oz), zo=hd+oz, ry=y0+rh;
  tri(B.solid,roofCol,[x0,y0,zi],[x1,ry,0],[x1,y0,zi]);      // north slope
  tri(B.solid,roofCol,[x0,y0,zi],[x0,ry,0],[x1,ry,0]);
  tri(B.solid,roofCol,[x0,y0,zo],[x1,y0,zo],[x1,ry,0]);      // south slope
  tri(B.solid,roofCol,[x0,y0,zo],[x1,ry,0],[x0,ry,0]);
  const gi=hd+0.03, xe=hw+0.02;
  tri(B.solid,wallCol,[xe,y0,gi],[xe,y0,-gi],[xe,ry,0]);     // gable +x
  tri(B.solid,wallCol,[-xe,y0,-gi],[-xe,y0,gi],[-xe,ry,0]);  // gable -x
}

/* ============================== persistent world objects ============================== */
const cityRoot  = new THREE.Group(); scene.add(cityRoot);
const livingRoot= new THREE.Group(); scene.add(livingRoot);

/* moat water (persistent shape) */
{
  const g = new THREE.RingGeometry(64.6, 73.4, 96, 1); g.rotateX(-Math.PI/2);
  const w = new THREE.Mesh(g, waterMat); w.position.y=-1.0; scene.add(w);
}

/* smoke particle system (persistent pool) */
const SMOKE_N=260;
const smoke = { pos:new Float32Array(SMOKE_N*3), size:new Float32Array(SMOKE_N), alpha:new Float32Array(SMOKE_N),
  vx:new Float32Array(SMOKE_N), vy:new Float32Array(SMOKE_N), vz:new Float32Array(SMOKE_N),
  life:new Float32Array(SMOKE_N), max:new Float32Array(SMOKE_N), cursor:0, emitters:[] };
for(let i=0;i<SMOKE_N;i++) smoke.pos[i*3+1]=-999;
let smokePoints;
{
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(smoke.pos,3));
  g.setAttribute('aSize', new THREE.BufferAttribute(smoke.size,1));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(smoke.alpha,1));
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ uMap:{value:smokeTex} },
    vertexShader:`attribute float aSize; attribute float aAlpha; varying float vA;
      void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=aSize*(260.0/max(1.0,-mv.z)); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform sampler2D uMap; varying float vA;
      void main(){ float a=texture2D(uMap, gl_PointCoord).a*vA; if(a<0.01) discard;
        gl_FragColor=vec4(0.82,0.80,0.78,a); }`
  });
  smokePoints=new THREE.Points(g,m); smokePoints.frustumCulled=false; smokePoints.renderOrder=8;
  scene.add(smokePoints);
}
function spawnSmoke(x,y,z){
  const i=(smoke.cursor++)%SMOKE_N;
  smoke.pos[i*3]=x; smoke.pos[i*3+1]=y; smoke.pos[i*3+2]=z;
  smoke.life[i]=0; smoke.max[i]=rr(4,7);
  smoke.vx[i]=rr(0.18,0.42); smoke.vy[i]=rr(0.55,0.95); smoke.vz[i]=rr(0.0,0.22);
}
function updateSmoke(dt){
  for(const e of smoke.emitters){ e.t-=dt; if(e.t<=0){ e.t=rr(0.7,1.6); spawnSmoke(e.x+rr(-0.15,0.15), e.y, e.z+rr(-0.15,0.15)); } }
  for(let i=0;i<SMOKE_N;i++){
    if(smoke.life[i]>=smoke.max[i]) continue;
    smoke.life[i]+=dt;
    const k=smoke.life[i]/smoke.max[i];
    if(k>=1){ smoke.alpha[i]=0; smoke.size[i]=0; smoke.pos[i*3+1]=-999; continue; }
    smoke.pos[i*3]+=smoke.vx[i]*dt; smoke.pos[i*3+1]+=smoke.vy[i]*dt; smoke.pos[i*3+2]+=smoke.vz[i]*dt;
    smoke.size[i]=1.4+k*4.8;
    smoke.alpha[i]=0.34*(1-k)*Math.min(1,k*6);
  }
  smokePoints.geometry.attributes.position.needsUpdate=true;
  smokePoints.geometry.attributes.aSize.needsUpdate=true;
  smokePoints.geometry.attributes.aAlpha.needsUpdate=true;
}

/* birds (persistent) */
const birdMat = new THREE.MeshStandardMaterial({color:'#3a3f45', roughness:0.9, side:THREE.DoubleSide, flatShading:true});
const birdBodyGeo = new THREE.ConeGeometry(0.16,0.85,5); birdBodyGeo.rotateX(Math.PI/2);
const birdWingGeo = new THREE.PlaneGeometry(0.95,0.34); birdWingGeo.translate(0.5,0,0);
const birds=[];
for(let i=0;i<7;i++){
  const g=new THREE.Group();
  const body=new THREE.Mesh(birdBodyGeo, birdMat); body.userData.shared=true;
  const wl=new THREE.Mesh(birdWingGeo, birdMat); wl.userData.shared=true;
  const wr=new THREE.Mesh(birdWingGeo, birdMat); wr.userData.shared=true; wr.scale.x=-1;
  g.add(body,wl,wr); scene.add(g);
  const a=rf()*Math.PI*2;
  birds.push({g,wl,wr,c:{x:rr(-25,25),z:rr(-25,25)},R:rr(22,44),h:rr(34,56),sp:rr(0.25,0.5)*(rf()<0.5?1:-1),a,ph:rf()*9});
}

/* ============================== layout state ============================== */
const R_WALL=60, N_SEG=28, GATES=[0,Math.PI/2,Math.PI,Math.PI*1.5];
let WM={x:-112,z:-78}, FIELDS=[], cathC={x:0,z:0}, keepC={x:0,z:0};
let off1=0,off2=0,off3=0;
const flags=[], walkers=[], statics=[], flames=[], torchLights=[];
let blades=null, nBuildings=0, cityName='';
const W2V=new THREE.Vector3();

function baseNoise(x,z){
  return Math.sin(x*0.045+off1)*Math.cos(z*0.041+off2)*0.9
       + (Math.sin(x*0.021+off2)*0.7+Math.cos(z*0.027+off3)*0.6)*1.3
       + Math.sin((x+z)*0.013+off1)*1.8;
}
function terrainH(x,z){
  const r=Math.hypot(x,z); let h;
  if(r<64) h=0;
  else if(r<74) h=-2.1*Math.sin(Math.PI*(r-64)/10);
  else h=baseNoise(x,z)*0.45*Math.min(1,(r-74)/26)+(r-74)*0.012;
  const dx=x-WM.x,dz=z-WM.z; h+=6.5*Math.exp(-(dx*dx+dz*dz)/450);
  for(const f of FIELDS){ const d=Math.hypot(x-f.x,z-f.z);
    if(d<f.r+8){ const k=clamp(1-(d-f.r)/8,0,1); h=h*(1-k)+f.h*k; } }
  return h;
}

/* ============================== terrain ============================== */
function buildTerrain(){
  const g=new THREE.PlaneGeometry(460,460,110,110); g.rotateX(-Math.PI/2);
  const p=g.attributes.position; const col=new Float32Array(p.count*3);
  const grass=new THREE.Color('#6a9c50'), grass2=new THREE.Color('#7fae5a'),
        grass3=new THREE.Color('#57893e'), dry=new THREE.Color('#8a9a50'),
        dirt=new THREE.Color('#7d6a50'), town=new THREE.Color('#95896d');
  const c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i); const h=terrainH(x,z); p.setY(i,h);
    const r=Math.hypot(x,z); const n=baseNoise(x*1.7,z*1.7);
    if(r<62.5){ c.copy(town).offsetHSL(0,0,n*0.012); }
    else if(r<76){ c.copy(dirt).offsetHSL(0,0,n*0.01); }
    else{
      c.copy(grass).lerp(n>0?grass2:grass3, Math.abs(n));
      c.lerp(dry, clamp(h/3.4,0,0.4));
      let inF=null;
      for(const f of FIELDS) if(Math.hypot(x-f.x,z-f.z)<f.r) inF=f;
      if(inF) c.set(inF.col).offsetHSL(0,0,n*0.008);
    }

/* ------------------------------ houses ------------------------------ */
function building(cx,cz,ry){
  const w=rr(4.6,7.6), d=rr(4.6,7.4);
  const floors=_r()<0.55?2:3, fh=rr(2.7,3.3), h=floors*fh;
  setTM(cx,0,cz,ry);
  const plaster=pk(PLASTER);
  bx(B.solid,w,fh,d,plaster,0,fh/2,0);
  const jet=floors>1&&_r()<0.45?rr(0.35,0.7):0;
  const w2=w+(floors>1?jet:0), d2=d+(floors>1?jet:0);
  if(floors>1) bx(B.solid,w2,h-fh,d2,plaster,0,fh+(h-fh)/2,0);
  const timber=_r()<0.6?'#57422e':'#4b3a2a';
  for(const sx of [-1,1]) for(const sz of [-1,1]) bx(B.solid,0.24,h,0.24,timber,sx*(w/2-0.06),h/2,sz*(d/2-0.06));
  for(let f=1;f<floors;f++) bx(B.solid,w+0.06,0.2,0.1,timber,0,f*fh,d/2+0.03);
  if(jet>0) bx(B.solid,w2+0.08,0.26,0.12,timber,0,fh+0.05,d2/2+0.05);
  if(_r()<0.5) bx(B.solid,0.14,w*0.75,0.1,timber,-w*0.2,fh+(h-fh)*0.5,d2/2+0.06,0,0.5);
  const rh=rr(1.9,3.1);
  gableRoof(w2,d2,rh,plaster,pk(ROOFS),h);
  const doorX=rr(-w*0.25,w*0.25);
  pl(B.dark,1.15,2.05,doorX,1.03,d/2+0.02);
  bx(B.solid,1.5,0.16,0.7,'#8f8676',doorX,0.08,d/2+0.3);
  /* windows */
  const putWin=(x,y,z,wry)=>{
    const lit=_r()<0.72;
    pl(lit?B.lit:B.dark,0.72,0.95,x,y,z,wry, lit?'#233042':undefined);
  };
  for(const sx of [-1,1]) if(Math.abs(sx*w/3-doorX)>1.1) putWin(sx*w/3,fh*0.58,d/2+0.03,0);
  for(let f=1;f<floors;f++){
    const nf=Math.max(1,Math.floor((w-1.8)/1.6));
    for(let i=0;i<nf;i++){
      const x=-w/2+1.1+i*((w-2.2)/Math.max(1,nf-1));
      putWin(x,f*fh+fh*0.55,d2/2+0.03,0);
    }
  }
  for(let f=0;f<floors;f++){
    const y=f*fh+fh*0.55, bw=f===0?w:w2;
    if(_r()<0.85) putWin(bw/2+0.03,y,rr(-d*0.2,d*0.2),Math.PI/2);
    if(_r()<0.85) putWin(-bw/2-0.03,y,rr(-d*0.2,d*0.2),-Math.PI/2);
  }
  /* sign */
  if(_r()<0.2){
    const sx=doorX>0?-1:1;
    bx(B.solid,0.08,0.08,0.85,'#57422e',doorX+sx*1.3,2.5,d/2+0.42);
    bx(B.solid,0.07,0.55,0.75,pk(GUILD),doorX+sx*1.3,2.16,d/2+0.78);
  }
  /* chimney + smoke */
  if(_r()<0.65){
    const cx0=rr(-w*0.25,w*0.25), cz0=rr(-d*0.25,d*0.25);
    const top=h+rh+rr(0.5,1.1), bot=h*0.45;
    bx(B.solid,0.55,top-bot,0.55,'#8a8078',cx0,(top+bot)/2,cz0);
    bx(B.solid,0.75,0.14,0.75,'#6f6a63',cx0,top+0.05,cz0);
    if(_r()<0.5&&smoke.emitters.length<48){
      W2V.set(cx0,top+0.25,cz0).applyMatrix4(TM);
      smoke.emitters.push({x:W2V.x,y:W2V.y,z:W2V.z,t:rr(0,1.5)});
    }
  }
  nBuildings++;
}
function buildBuildings(){
  setTM(0,0,0,0);
  /* radial bands along the four main roads */
  for(const g of GATES){
    const ux=Math.cos(g), uz=Math.sin(g);
    for(const side of [-1,1]){
      const vx=-Math.sin(g)*side, vz=Math.cos(g)*side;
      for(const [r0,r1] of [[17.5,37.5],[48.5,56]]){
        let r=r0+rr(1,2.5);
        while(r<r1-2){
          const w=rr(4.6,7.6), d=rr(4.6,7.4);
          if(_r()>0.16){
            const off=3.5+d/2+rr(0.3,1.0);
            const px=ux*r+vx*off, pz=uz*r+vz*off;
            if(Math.hypot(px-cathC.x,pz-cathC.z)>17&&Math.hypot(px-keepC.x,pz-keepC.z)>23)
              building(px,pz,ryTo(-vx,-vz));
          }
          r+=w+rr(1.2,3.4);
        }
      }
    }
  }
  /* ring road arcs between gates */
  for(let k=0;k<4;k++){
    const g1=GATES[k], g2=GATES[(k+1)%4];
    let span=g2-g1; if(span<0) span+=Math.PI*2;
    for(const side of [0,1]){
      let a=g1+0.26;
      const end=g1+span-0.26;
      while(a<end-0.05){
        const w=rr(4.6,7.6), d=rr(4.6,7.4);
        const r=side===0?39-d/2-rr(0.5,1.5):46+d/2+rr(0.5,1.5);
        if(_r()>0.15){
          const px=Math.cos(a)*r, pz=Math.sin(a)*r;
          if(Math.hypot(px-cathC.x,pz-cathC.z)>17&&Math.hypot(px-keepC.x,pz-keepC.z)>23)
            building(px,pz, side===0?ryTo(Math.cos(a),Math.sin(a)):ryTo(-Math.cos(a),-Math.sin(a)));
        }
        a+=(w+rr(1.6,4))/r;
      }
    }
  }
}

  const hub=new THREE.Mesh(hubGeo, solidMat); hub.castShadow=true;
  bg.add(hub);
  for(let i=0;i<4;i++){
    const bl=new THREE.Mesh(bladeGeo, solidMat);
    bl.castShadow=true; bl.userData.shared=true; // bladeGeo is shared across rebuilds
    bl.rotation.z=i*Math.PI/2; bg.add(bl);
  }
  bg.position.set(WM.x+Math.sin(ry)*2.75, y+9.4, WM.z+Math.cos(ry)*2.75);
  bg.rotation.y=ry;
  cityRoot.add(bg); blades=bg;
}
const bladeGeo=new THREE.BoxGeometry(0.55,7.4,0.1); bladeGeo.translate(0,3.9,0); colorize(bladeGeo,'#e6dccb');
function buildFields(){
  for(const f of FIELDS){
    setTM(f.x,f.h+0.05,f.z,f.a);
    { const g=new THREE.CircleGeometry(f.r,26); g.rotateX(-Math.PI/2); colorize(g,f.col); B.solid.push(g); }
    const fur=new THREE.Color(f.col).multiplyScalar(0.72);
    for(let i=-Math.floor(f.r/1.4);i<=Math.floor(f.r/1.4);i++){
      const x=i*1.4, half=Math.sqrt(Math.max(0,f.r*f.r-x*x));
      bx(B.solid,0.55,0.06,half*2,fur,x,0,0);
    }
    if(f.scare){
      bx(B.solid,0.1,1.9,0.1,'#57422e',0,0.95,0);
      bx(B.solid,1.15,0.09,0.09,'#57422e',0,1.5,0);
      const head=new THREE.SphereGeometry(0.2,7,6); head.translate(0,2.05,0); colorize(head,'#d9ad84'); B.solid.push(head);
      const hat=new THREE.ConeGeometry(0.3,0.3,7); hat.translate(0,2.3,0); colorize(hat,'#8a6a2a'); B.solid.push(hat);
    }
  }
}
function buildTreesRocks(){
  const spots=[];
  const okSpot=(x,z)=>{
    const r=Math.hypot(x,z);
    if(r<78) return false;
    if(r>185) return false;
    for(const g of GATES){ const a=Math.atan2(z,x); if(angDiff(a,g)<0.13) return false; }
    if(Math.hypot(x-WM.x,z-WM.z)<15) return false;
    for(const f of FIELDS) if(Math.hypot(x-f.x,z-f.z)<f.r+4) return false;
    return true;
  };
  let tries=0;
  while(spots.length<170&&tries++<3000){
    const a=rf()*Math.PI*2, r=rr(80,182);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(okSpot(x,z)) spots.push([x,z,rr(0.75,1.6),false]);
  }
  /* courtyard trees inside the walls */
  tries=0; let inside=0;
  while(inside<10&&tries++<600){
    const a=rf()*Math.PI*2, r=rr(18,55);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(r>37.5&&r<48) continue;
    let bad=false;
    for(const g of GATES){ if(angDiff(a,g)<0.17&&r>15){ bad=true; break; } }
    if(bad) continue;
    if(Math.hypot(x-cathC.x,z-cathC.z)<15||Math.hypot(x-keepC.x,z-keepC.z)<17) continue;
    if(Math.hypot(x-7,z+7)<4) continue;
    spots.push([x,z,rr(0.6,0.95),true]); inside++;
  }
  const trunkGeo=new THREE.CylinderGeometry(0.16,0.26,1.5,6); trunkGeo.translate(0,0.75,0); trunkGeo.userData.shared=true;
  const leafGeo=new THREE.IcosahedronGeometry(1.25,0); leafGeo.translate(0,2.35,0); leafGeo.userData.shared=true;
  const tm=new THREE.MeshStandardMaterial({roughness:1, flatShading:true});
  const lm=new THREE.MeshStandardMaterial({roughness:1, flatShading:true});
  const trunks=new THREE.InstancedMesh(trunkGeo,tm,spots.length);
  const leaves=new THREE.InstancedMesh(leafGeo,lm,spots.length);
  const dummy=new THREE.Object3D(); const tc=new THREE.Color(), lc=new THREE.Color();
  spots.forEach(([x,z,s,ins],i)=>{
    const y=ins?0:terrainH(x,z);
    dummy.position.set(x,y,z); dummy.rotation.set(0,rf()*Math.PI*2,0); dummy.scale.setScalar(s);
    dummy.updateMatrix(); trunks.setMatrixAt(i,dummy.matrix);
    dummy.scale.set(s*rr(0.85,1.25),s*rr(0.9,1.5),s*rr(0.85,1.25));
    dummy.updateMatrix(); leaves.setMatrixAt(i,dummy.matrix);
    tc.set(pk(['#6b4a33','#5f4230','#77543a'])); trunks.setColorAt(i,tc);
    lc.set(_r()<0.1?pk(AUTUMN):pk(GREENS)).offsetHSL(rr(-0.02,0.02),0,rr(-0.04,0.04));
    leaves.setColorAt(i,lc);
  });
  trunks.instanceColor.needsUpdate=true; leaves.instanceColor.needsUpdate=true;
  trunks.castShadow=leaves.castShadow=true; trunks.receiveShadow=leaves.receiveShadow=true;
  trunks.userData.shared=true; leaves.userData.shared=true; // base geometries are shared
  cityRoot.add(trunks,leaves);
  /* rocks */
  setTM(0,0,0,0);
  for(let i=0;i<24;i++){
    const a=rf()*Math.PI*2, r=rr(80,180);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!okSpot(x,z)) continue;
    const g=new THREE.IcosahedronGeometry(rr(0.6,1.8),0);
    g.scale(1,rr(0.5,0.8),1); g.rotateY(rf()*Math.PI);
    colorize(g,pk(['#8b8a84','#7e7d78','#96958e']));
    g.translate(x,terrainH(x,z)+0.15,z); B.solid.push(g);
  }
}

/* ------------------------------ flags / flames / people ------------------------------ */
function makeFlag(x,y,z,ry,color,mode,w=2.6,h=1.4){
  const g=new THREE.PlaneGeometry(w,h,12,5);
  if(mode==='pole') g.translate(w/2+0.06,0,0); else g.translate(0,-h/2-0.02,0);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color, side:THREE.DoubleSide, roughness:0.9}));
  m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=true;
  livingRoot.add(m);
  flags.push({m, base:g.attributes.position.array.slice(), mode, w, h, ph:rf()*9});
}
function addFlame(x,y,z,s){
  const mat=new THREE.SpriteMaterial({map:flameTex, color:'#ffb066', transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.9});
  const sp=new THREE.Sprite(mat); sp.position.set(x,y,z); sp.scale.set(s,s*1.4,1);
  livingRoot.add(sp); flames.push({sp,mat,s,ph:rf()*9});
}
function personGeo(){
  const parts=[];
  const cloth=pk(CLOTHES);
  const body=new THREE.CylinderGeometry(0.17,0.35,0.95,7); body.translate(0,0.475,0); colorize(body,cloth); parts.push(body);
  const head=new THREE.SphereGeometry(0.19,7,6); head.translate(0,1.13,0); colorize(head,pk(SKINS)); parts.push(head);
  if(_r()<0.55){ const hat=new THREE.ConeGeometry(0.27,0.32,7); hat.translate(0,1.42,0);
    colorize(hat,'#'+new THREE.Color(cloth).multiplyScalar(0.55).getHexString()); parts.push(hat); }
  if(_r()<0.3){ const ap=new THREE.CylinderGeometry(0.28,0.37,0.55,7); ap.translate(0,0.33,0); colorize(ap,'#d8cdb6'); parts.push(ap); }
  return mergeAll(parts);
}
const peopleMat=new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:0.95});
peopleMat.keep=true; birdMat.keep=true;
function addStaticPerson(x,z,ry){
  const m=new THREE.Mesh(personGeo(),peopleMat);
  m.position.set(x,0,z); m.rotation.y=ry; m.castShadow=true;
  livingRoot.add(m); statics.push({m,ph:rf()*9,bob:_r()<0.6});
}

/* ------------------------------ road graph & walkers ------------------------------ */
let NODES=[], ADJ=[];
function buildGraph(){
  NODES=[{x:0,y:0,z:0}];
  for(let i=0;i<8;i++){ const a=i*Math.PI/4; NODES.push({x:Math.cos(a)*42.5,y:0,z:Math.sin(a)*42.5}); }
  for(let k=0;k<4;k++){ const g=GATES[k]; NODES.push({x:Math.cos(g)*57,y:0,z:Math.sin(g)*57}); }
  for(let k=0;k<4;k++){ const g=GATES[k]; const x=Math.cos(g)*80,z=Math.sin(g)*80;
    NODES.push({x,y:terrainH(x,z),z}); }
  for(let k=0;k<4;k++){ const g=GATES[k]; const x=Math.cos(g)*115,z=Math.sin(g)*115;
    NODES.push({x,y:terrainH(x,z),z}); }
  const edges=[];
  for(let k=0;k<4;k++){ edges.push([0,9+k]); edges.push([9+k,2*k+1]); edges.push([9+k,13+k]); edges.push([13+k,17+k]); }
  for(let i=0;i<8;i++) edges.push([1+i,1+(i+1)%8]);
  ADJ=NODES.map(()=>[]);
  for(const [a,b] of edges){ ADJ[a].push(b); ADJ[b].push(a); }
  const d=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
  for(let i=0;i<26;i++){
    const a=ri(0,NODES.length-1);
    if(!ADJ[a].length) continue;
    const b=ADJ[a][0];
    const m=new THREE.Mesh(personGeo(),peopleMat);
    const kid=_r()<0.12; const sc=kid?0.68:rr(0.85,1.05);
    m.scale.setScalar(sc); m.castShadow=true;
    if(kid){ /* recolor not needed, variety is fine */ }
    livingRoot.add(m);
    walkers.push({m,a,b,t:rf(),len:d(NODES[a],NODES[b]),speed:rr(1.1,2.1),ph:rf()*9,nightOwl:_r()<0.3});
  }
}

/* ============================== day / night ============================== */
const state={time:10.4, cycling:true, dayF:1, nightF:0};
const CYCLE_SECS=150;
const sunDir=new THREE.Vector3();
const skyCol=new THREE.Color(), nightSky=new THREE.Color('#0b1220'), daySky=new THREE.Color('#8ec9ea'),
      dawnSky=new THREE.Color('#f2a05a'), tmpC=new THREE.Color();
const SUN_LOW=new THREE.Color('#ffc27d'), SUN_HIGH=new THREE.Color('#fff2df'),
      HEMI_N=new THREE.Color('#39466e'), HEMI_D=new THREE.Color('#bfdcff'),
      CLOUD_N=new THREE.Color('#2b3242'), CLOUD_D=new THREE.Color('#ffffff');
function updateDayNight(dt){
  if(state.cycling) state.time=(state.time+dt*24/CYCLE_SECS)%24;
  const a=(state.time-6)/12*Math.PI;
  const el=Math.sin(a);
  sunDir.set(Math.cos(a),el,0.38).normalize();
  const dayF=smooth(-0.04,0.22,el), nightF=1-dayF;
  state.dayF=dayF; state.nightF=nightF;
  const glow=Math.pow(clamp(1-Math.abs(el)*2.8,0,1),1.6);
  skyCol.copy(nightSky).lerp(daySky,dayF).lerp(dawnSky,glow*0.5);
  scene.background=skyCol; scene.fog.color.copy(skyCol);
  sun.intensity=clamp(el*3,0,1)*1.45+glow*0.15;
  sun.color.copy(SUN_LOW).lerp(SUN_HIGH,clamp(el*2,0,1));
  sun.position.copy(sunDir).multiplyScalar(190);
  hemi.intensity=0.16+dayF*0.5;
  hemi.color.copy(HEMI_N).lerp(HEMI_D,dayF);
  amb.intensity=0.09+dayF*0.07;
  moonL.intensity=nightF*0.22;
  moonL.position.set(-sunDir.x,Math.max(0.2,-el),-sunDir.z).normalize().multiplyScalar(150);
  sunDisc.position.copy(sunDir).multiplyScalar(430); sunDisc.visible=el>-0.06;
  moonDisc.position.set(-sunDir.x,Math.max(0.1,-el),-sunDir.z).normalize().multiplyScalar(430);
  moonDisc.visible=-el>-0.04;
  stars.material.opacity=nightF*0.9;
  winLitMat.emissiveIntensity=0.06+nightF*1.55;
  waterMat.uniforms.uNight.value=nightF;
  cloudMat.color.copy(CLOUD_N).lerp(CLOUD_D,dayF);
  for(const L of torchLights) L.intensity=nightF*2.6;
  if(world.campfire) world.campfire.intensity=nightF*(1.6+0.5*Math.sin(elapsed*11));
  for(const f of flames){ const vis=0.18+nightF*0.82; f.target=vis; }
  for(const v of walkers) v.m.visible=dayF>0.22||v.nightOwl;
}

/* ============================== generation ============================== */
const world={campfire:null};
function clearRoot(root){
  root.traverse(o=>{
    if(o.isMesh&&o.geometry&&!o.userData.shared) o.geometry.dispose();
    if(o.isInstancedMesh) o.dispose();
    const m=o.material;
    if(m&&!m.keep) m.dispose();
  });
  while(root.children.length) root.remove(root.children[0]);
}
function finalizeBuckets(){
  for(const [list,mat,shadow] of [[B.solid,solidMat,true],[B.lit,winLitMat,false],[B.dark,winDarkMat,false]]){
    if(!list.length) continue;
    const g=mergeAll(list); list.length=0;
    if(!g) continue;
    const m=new THREE.Mesh(g,mat);
    m.castShadow=shadow; m.receiveShadow=shadow;
    cityRoot.add(m);
  }
}
function generate(){
  _r=mulberry32(seed);
  clearRoot(cityRoot); clearRoot(livingRoot);
  flags.length=0; walkers.length=0; statics.length=0; flames.length=0; torchLights.length=0;
  smoke.emitters.length=0; blades=null; world.campfire=null; nBuildings=0;
  for(let i=0;i<SMOKE_N;i++){ smoke.life[i]=1; smoke.max[i]=1; smoke.alpha[i]=0; smoke.size[i]=0; smoke.pos[i*3+1]=-999; }
  cityName=pk(NAME_A)+pk(NAME_B);
  /* layout */
  off1=rf()*10; off2=rf()*10; off3=rf()*10;
  { const a=rr(1.9,2.0), r=rr(26,28); cathC={x:Math.cos(a)*r, z:Math.sin(a)*r}; }
  { const a=rr(-0.9,-0.6), r=rr(52,54); keepC={x:Math.cos(a)*r, z:Math.sin(a)*r}; }
  WM={x:-112+rr(-8,8), z:-78+rr(-8,8)};
  FIELDS=[
    {x:100+rr(-6,6), z:18+rr(-6,6), r:13, col:'#b8a35b', a:rf()*Math.PI, scare:true},
    {x:126+rr(-6,6), z:44+rr(-6,6), r:12, col:'#87a453', a:rf()*Math.PI, scare:false},
    {x:88+rr(-5,5),  z:54+rr(-5,5), r:10, col:'#a4773f', a:rf()*Math.PI, scare:true},
  ];
  for(const f of FIELDS) f.h=baseNoise(f.x,f.z)*0.45*Math.min(1,(Math.hypot(f.x,f.z)-74)/26)+(Math.hypot(f.x,f.z)-74)*0.012;
  buildTerrain();
  buildGround();
  buildWalls();
  buildGates();
  buildCathedral();
  buildKeep();
  buildMarket();
  buildWell();
  buildLamps();
  buildCampfire();
  buildBuildings();
  buildWindmill();
  buildFields();
  buildTreesRocks();
  finalizeBuckets();
  buildGraph();
  updateStats();
}
function updateStats(){
  document.getElementById('title').textContent=cityName;
  document.getElementById('meta').innerHTML=
    `seed ${seed} · ${nBuildings} houses · ${walkers.length+statics.length} souls`;
}

/* ============================== animation ============================== */
const clock=new THREE.Clock();
let elapsed=0, introT=0, started=false;
const slider=document.getElementById('timeSlider');
const clockLbl=document.getElementById('clock');
const btnCycle=document.getElementById('btnCycle');
function fmtTime(t){ const h=Math.floor(t), m=Math.floor((t%1)*60);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  /* intro camera flight */
  if(introT<1){
    introT=Math.min(1,introT+dt/3.2);
    const e=introT*introT*(3-2*introT);
    camera.position.lerpVectors(INTRO_FROM,INTRO_TO,e);
    camera.lookAt(controls.target);
    if(introT>=1) controls.enabled=true;
  } else {
    controls.update();
  }
  updateDayNight(dt);
  slider.value=state.time; clockLbl.textContent=fmtTime(state.time);
  waterMat.uniforms.uTime.value=elapsed;
  updateSmoke(dt);
  /* flags */
  for(const f of flags){
    const pos=f.m.geometry.attributes.position, base=f.base;
    for(let i=0;i<pos.count;i++){
      const x0=base[i*3], y0=base[i*3+1];
      const amp=f.mode==='pole'?clamp(x0/f.w,0,1):clamp(-y0/f.h,0,1);
      pos.setZ(i,(Math.sin(x0*2.1+elapsed*6+f.ph)*0.24+Math.sin(y0*3.1+elapsed*4.3)*0.06)*amp);
    }
    pos.needsUpdate=true;
  }
  /* birds */
  for(const b of birds){
    b.a+=b.sp*dt;
    const x=b.c.x+Math.cos(b.a)*b.R, z=b.c.z+Math.sin(b.a)*b.R;
    b.g.position.set(x,b.h+Math.sin(b.a*3+b.ph)*2,z);
    b.g.rotation.y=Math.atan2(-Math.sin(b.a)*Math.sign(b.sp),Math.cos(b.a)*Math.sign(b.sp));
    const soar=0.35+0.65*(0.5+0.5*Math.sin(elapsed*0.6+b.ph));
    const fl=Math.sin(elapsed*10+b.ph)*0.75*soar;
    b.wl.rotation.z=fl; b.wr.rotation.z=fl;
  }
  /* walkers */
  for(const v of walkers){
    if(!v.m.visible) continue;
    v.t+=v.speed*dt/v.len;
    if(v.t>=1){
      const cur=v.b, nbrs=ADJ[cur];
      let nxt=nbrs[Math.floor(Math.random()*nbrs.length)];
      if(nbrs.length>1&&nxt===v.a) nxt=nbrs[(nbrs.indexOf(nxt)+1)%nbrs.length];
      v.a=cur; v.b=nxt; v.t=0.001;
      v.len=Math.hypot(NODES[nxt].x-NODES[cur].x,NODES[nxt].z-NODES[cur].z);
    }
    const A=NODES[v.a], Bn=NODES[v.b];
    v.ph+=dt*v.speed*4.2;
    v.m.position.set(A.x+(Bn.x-A.x)*v.t, A.y+(Bn.y-A.y)*v.t+Math.abs(Math.sin(v.ph))*0.07, A.z+(Bn.z-A.z)*v.t);
    v.m.rotation.y=Math.atan2(Bn.x-A.x,Bn.z-A.z);
    v.m.rotation.z=Math.sin(v.ph)*0.04;
  }
  for(const s of statics){ if(s.bob) s.m.position.y=Math.abs(Math.sin(elapsed*1.6+s.ph))*0.02; }
  /* windmill, clouds, stars, flames */
  if(blades) blades.rotation.z+=dt*0.55;
  for(const c of clouds){ c.m.position.x+=c.sp*dt; if(c.m.position.x>260) c.m.position.x=-260; }
  stars.rotation.y+=dt*0.004;
  for(const f of flames){
    const k=1+0.28*Math.sin(elapsed*13+f.ph)+0.12*Math.sin(elapsed*31+f.ph*2);
    f.sp.scale.set(f.s*k,f.s*k*1.4,1);
    f.mat.opacity=(f.target??0.9)*(0.8+0.2*Math.sin(elapsed*17+f.ph));
  }
  renderer.render(scene,camera);
  if(!started){ started=true; const l=document.getElementById('loading');
    l.style.opacity='0'; setTimeout(()=>l.style.display='none',750); window.__ok=true; }
}

/* ============================== ui ============================== */
document.getElementById('btnNew').addEventListener('click',()=>{ seed=Math.floor(Math.random()*1e9); generate(); });
btnCycle.addEventListener('click',()=>{ state.cycling=!state.cycling;
  btnCycle.textContent=state.cycling?'Pause Day':'Resume Day'; });
slider.addEventListener('input',()=>{ state.time=parseFloat(slider.value); });
document.getElementById('chkOrbit').addEventListener('change',e=>{ controls.autoRotate=e.target.checked; });
addEventListener('keydown',e=>{ if(e.key==='n'||e.key==='N'){ seed=Math.floor(Math.random()*1e9); generate(); } });
renderer.domElement.addEventListener('pointerdown',()=>{ if(introT<1){ introT=1; camera.position.copy(INTRO_TO); controls.enabled=true; } },{once:false});
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
window.addEventListener('error',ev=>{ if(!window.__ok){ const l=document.getElementById('loading');
  l.style.display='flex'; l.style.opacity='1';
  l.innerHTML='Something went wrong:<br><span style="font-size:12px">'+(ev.message||'unknown error')+'</span>'; } });

generate();
slider.value=state.time;
animate();
</script>
