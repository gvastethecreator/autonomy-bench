/* ---------- reference palettes ---------- */
const PLASTER = [0xe8dcc2, 0xdfd2b4, 0xe3d0aa, 0xd9c8b2, 0xe6d9c6, 0xd8c6a4];
const TIMBER_C = 0x5d3f24;
const ROOF_IN = [0x5d6b78, 0x6e5a63, 0x7d4a3a];         // slate / old tile near centre
const ROOF_MID = [0x9a4f38, 0xa86038, 0x8b4a30, 0x6f5a6a];
const ROOF_OUT = [0xb08a4a, 0xb5924f, 0xa07b42];        // thatch
const TUNIC = [0x8c3b2e, 0x3f5d3a, 0x38506e, 0x8a6a2e, 0x6e4a56, 0x7a7a52, 0x9c7b3f, 0x54423a, 0x845d3a, 0x46586b];
const SKIN = [0xe8b48c, 0xd9a06e, 0xc98f62, 0xf0c8a0];

/* ============================================================
   5.  Building pieces
   ============================================================ */

function addWindow(x, y, z, ry, w = 0.5, h = 0.68) {
  put('wood', U.box, x, y, z, { ry, sx: w + 0.22, sy: h + 0.2, sz: 0.1, color: 0x4a3418 });
  put('win', U.box, x, y, z, { ry, sx: w, sy: h, sz: 0.12, color: 0xffffff });
}
function addDoor(x, y, z, ry) {
  put('wood', U.box, x, y + 1, z, { ry, sx: 1.05, sy: 2.0, sz: 0.14, color: 0x3c2a16 });
  put('timber', U.box, x, y + 2.12, z, { ry, sx: 1.35, sy: 0.18, sz: 0.2, color: 0x503618 });
  put('stone', U.box, x, y + 0.06, z + Math.cos(ry) * 0.5, { ry, sx: 1.5, sy: 0.24, sz: 0.8, color: 0x9a9284, jitter: 0.1 });
}

/** Full gabled house. Local axes: width X, depth Z, front faces +Z. */
function buildHouse(px, pz, ry, w, d, opts = {}) {
  const o = Object.assign({
    stories: 2, style: 'timber', roofH: rr(1.9, 2.9), roofC: pick(ROOF_MID),
    wallC: pick(PLASTER), jetty: false, awning: false, chimney: true, sign: false,
  }, opts);
  const sh = 2.55;                       // storey height
  const H = sh * o.stories;
  const jx = o.jetty ? 0.55 : 0, jz = o.jetty ? 0.5 : 0;

  // ground floor (stone base for timber style)
  if (o.style === 'timber') {
    put('stone', U.box, px, 0.65, pz, { ry, sx: w - jx * 0.6, sy: 1.3, sz: d - jz * 0.6, color: 0xa8a094, jitter: 0.09, uv: [w / 4, 0.4] });
  }
  // walls
  const wy0 = o.style === 'timber' ? 1.3 : 0;
  const wh = H - wy0;
  const wallKey = o.style === 'stone' ? 'stone' : 'plaster';
  put(wallKey, U.box, px, wy0 + wh / 2, pz, { ry, sx: w - (o.stories > 1 ? jx * 0.5 : 0), sy: wh, sz: d - (o.stories > 1 ? jz * 0.5 : 0), color: o.wallC, jitter: 0.05 });
  if (o.stories > 1) {                     // jettied upper floor
    put(wallKey, U.box, px, 1.3 + sh + (H - sh - 1.3) / 2, pz, { ry, sx: w, sy: H - sh - 1.3 + 0.02, sz: d, color: o.wallC, jitter: 0.05 });
  }

  // timber framing
  if (o.style !== 'stone') {
    const zf = d / 2 + 0.05, zb = -d / 2 - 0.05;
    for (const zfz of [zf, zb]) {
      for (const xs of [-1, 1])
        put('timber', U.box, px + Math.cos(ry) * xs * (w / 2 - 0.08), wy0 + wh / 2, pz - Math.sin(ry) * xs * (w / 2 - 0.08) + Math.cos(ry) * 0 * zfz - Math.sin(ry) * zfz * 0 + zfz * Math.cos(ry) * 0 + zfz * 0 + zfz * Math.cos(ry) * 0 + zfz * 0 + zfz * Math.cos(ry), {}, );
    }
  }

  return { H };
}

/* The timber-framing loop above is rewritten below in a cleaner local-frame
   helper: houses are assembled in local space then transformed once. */

function frameHouse(px, pz, ry, w, d, H, style, wallC, stories, jetty) {
  const fx = Math.sin(ry), fz = Math.cos(ry);          // forward = +Z rotated by ry
  const rx = Math.cos(ry), rz = -Math.sin(ry);         // right  = +X rotated by ry
  const P = (lx, ly, lz) => [px + rx * lx + fx * lz, ly, pz + rz * lx + fz * lz];
  const sh = 2.55;
  const wy0 = style === 'timber' ? 1.3 : 0;
  const wh = H - wy0;
  const wallKey = style === 'stone' ? 'stone' : 'plaster';
  const jx = jetty && stories > 1 ? 0.55 : 0, jz = jetty && stories > 1 ? 0.5 : 0;

  if (style === 'timber')
    put('stone', U.box, ...P(0, 0.65, 0), { ry, sx: w, sy: 1.3, sz: d, color: 0xa8a094, jitter: 0.09, uv: [w / 4, 0.36] });
  if (stories > 1 && jetty) {
    put(wallKey, U.box, ...P(0, wy0 + (sh - wy0) / 2, 0), { ry, sx: w - jx, sy: sh - wy0, sz: d - jz, color: wallC, jitter: 0.05 });
    put(wallKey, U.box, ...P(0, sh + (H - sh) / 2, 0), { ry, sx: w, sy: H - sh, sz: d, color: wallC, jitter: 0.05 });
  } else {
    put(wallKey, U.box, ...P(0, wy0 + wh / 2, 0), { ry, sx: w, sy: wh, sz: d, color: wallC, jitter: 0.05 });
  }

  // timber framing strips on front and back
  if (style === 'timber' || (style === 'mixed' && stories > 1)) {
    for (const side of [1, -1]) {
      const lz = side * (d / 2 + 0.06);
      const bx = (t) => P(t, 0, lz);
      for (const xs of [-(w / 2 - 0.12), w / 2 - 0.12, 0])
        if (xs === 0 ? w > 4.6 : true)
          put('timber', U.box, ...bx(xs), { ry, sx: 0.17, sy: wh, sz: 0.14, color: TIMBER_C, jitter: 0.12 });
      for (let s2 = 1; s2 < stories; s2++)
        put('timber', U.box, ...P(0, s2 * sh - 0.06, lz), { ry, sx: w, sy: 0.19, sz: 0.13, color: TIMBER_C, jitter: 0.1 });
      if (chance(0.65)) {                              // diagonal braces
        const dir = chance(0.5) ? 1 : -1;
        for (const xs of [-(w / 2 - 0.5), w / 2 - 0.5])
          put('timber', U.box, ...P(xs - dir * 0.5, wy0 + 0.65, lz), { ry, rz: dir * 0.6, sx: 0.15, sy: 1.9, sz: 0.12, color: TIMBER_C, jitter: 0.12 });
      }
    }
  }

  // windows + door on the front face
  const zf = d / 2 + 0.07;
  for (let s = 0; s < stories; s++) {
    const y = s * sh + 1.55;
    const nWin = Math.max(1, Math.round(w / 2.6));
    for (let i = 0; i < nWin; i++) {
      const lx = -w / 2 + (w / nWin) * (i + 0.5);
      if (s === 0 && Math.abs(lx) < 0.95) continue;    // keep door clear
      addWindow(...P(lx, y, zf), ry);
    }
    if (s > 0 && w > 5.4) {
      addWindow(...P(-w / 2 - 0.06, y, 0), ry + Math.PI / 2, 0.45, 0.6);
      addWindow(...P(w / 2 + 0.06, y, 0), ry + Math.PI / 2, 0.45, 0.6);
    }
  }
  addDoor(...P(rr(-w * 0.14, w * 0.14), 0.02, zf + 0.05), ry);

  return { P, fx, fz, zf };
}

function frameRoof(px, pz, ry, w, d, H, roofH, roofC, thatch) {
  const fx = Math.sin(ry), fz = Math.cos(ry);
  const dh = d / 2;
  const a = Math.atan2(roofH, dh);
  const L = Math.hypot(dh, roofH) + 0.5;              // + eave overhang down-slope
  const oE = 0.55;
  for (const side of [1, -1]) {
    const cz = (side * (dh + oE)) / 2;
    const cyz = H + roofH / 2 - (oE * roofH) / (2 * dh) - 0.02;
    const gx = Math.cos(ry) * 0 + fx * cz + 0, gz = fz * cz;
    put(thatch ? 'thatch' : 'roof', U.box, px + gx, cyz, pz + gz,
      { ry, rx: side * a, sx: w + 1.0, sy: 0.2, sz: L + oE, color: roofC, jitter: 0.07, uv: [1, L / 1.35] });
  }
  // gable ends
  const rx = Math.cos(ry), rz = -Math.sin(ry);
  for (const side of [1, -1]) {
    const g = gableGeo(dh, H - 0.02, roofH);
    _e.set(0, ry, 0); _q.setFromEuler(_e);
    _m4.compose(_p.set(px + rx * side * (w / 2 - 0.01), 0, pz + rz * side * (w / 2 - 0.01)), _q, _s.set(1, 1, 1));
    const gg = g.applyMatrix4(_m4);
    putGeo('plaster', gg, 0xe8dcc2, 0.05);
  }
  // ridge cap
  put(thatch ? 'thatch' : 'roof', U.box, px, H + roofH + 0.03, pz,
    { ry, sx: w + 1.05, sy: 0.16, sz: 0.3, color: roofC, jitter: 0.06 });
}

function frameChimney(px, pz, ry, w, d, H, roofH, rx0, withSmoke) {
  const fx = Math.sin(ry), fz = Math.cos(ry);
  const rx = Math.cos(ry), rz = -Math.sin(ry);
  const lx = rx0 * w * 0.3;
  const chH = roofH + 2.1;
  const cx = px + rx * lx, cz = pz + rz * lx;
  put('stone', U.box, cx, H + roofH / 2 + 0.3, cz, { ry, sx: 0.62, sy: chH, sz: 0.62, color: 0x9b9385, jitter: 0.1, uv: [0.3, chH / 4] });
  put('stone', U.box, cx, H + roofH / 2 + 0.3 + chH / 2 + 0.1, cz, { ry, sx: 0.9, sy: 0.2, sz: 0.9, color: 0x8b8375, jitter: 0.1 });
  if (withSmoke) city.smokes.push({ x: cx + fx * 0.1, y: H + roofH + 1.65, z: cz + fz * 0.1 });
}

function makeHouse(plot) {
  const { x, z, ry, w, d } = plot;
  const dist = plot.dist;
  const stories = dist < 42 ? ri(2, 3) : dist < 72 ? ri(1, 2) : 1;
  const style = dist < 38 ? pick(['stone', 'timber', 'mixed']) : dist < 72 ? pick(['timber', 'timber', 'mixed', 'stone']) : pick(['timber', 'mixed']);
  const roofC = dist < 42 ? pick(ROOF_IN) : dist < 76 ? pick(ROOF_MID) : pick(ROOF_OUT);
  const thatch = dist >= 76;
  const roofH = thatch ? rr(2.2, 3.0) : rr(1.8, 2.7);
  const H = 2.55 * stories + 0.25;
  const jetty = style !== 'stone' && stories > 1 && chance(0.55);

  frameHouse(x, z, ry, w, d, H, style, plot.wallC, stories, jetty);
  frameRoof(x, z, ry, w, d, H, roofH, roofC, thatch);

  if (chance(0.85)) frameChimney(x, z, ry, w, d, H, roofH, chance(0.5) ? 1 : -1, chance(0.5));

  // side annex (barn / workshop lean-to)
  if (chance(0.42) && plot.w > 5) {
    const aw = rr(2.2, 3.2), ad = rr(2.6, 3.6);
    const rx = Math.cos(ry), rz = -Math.sin(ry);
    const side = chance(0.5) ? 1 : -1;
    const ax = x + rx * side * (w / 2 + aw / 2 - 0.2), az = z + rz * side * (w / 2 + aw / 2 - 0.2);
    put('plaster', U.box, ax, 1.05, az, { ry, sx: aw, sy: 2.1, sz: ad, color: plot.wallC, jitter: 0.06 });
    const sa = 0.5;
    put('roof', U.box, ax, 2.35, az, { ry, rx: sa, sx: aw + 0.7, sy: 0.16, sz: Math.hypot(ad, 1.2) + 0.4, color: roofC, jitter: 0.07 });
  }

  // ground-floor shutters on cottages
  if (thatch && chance(0.5)) {
    const fx = Math.sin(ry), fz = Math.cos(ry);
    const zf = d / 2 + 0.1;
    for (const sx of [-w * 0.28, w * 0.28])
      put('wood', U.box, x + Math.cos(ry) * (sx - 0.45) + fx * zf, 1.5, z - Math.sin(ry) * (sx - 0.45) + fz * zf,
        { ry, sx: 0.3, sy: 0.95, sz: 0.07, color: 0x5d4326 });
  }

  // hanging sign for inns near the plaza
  if (plot.sign) {
    const fx = Math.sin(ry), fz = Math.cos(ry);
    const zf = d / 2 + 0.35;
    const bx = x + fx * zf, bz = z + fz * zf;
    put('timber', U.box, bx, 3.35, bz, { ry, sx: 0.1, sy: 0.1, sz: 0.85, color: 0x4c3418 });
    const signMat = std({ map: pick(TEX.sign), roughness: 0.8 });
    const pivot = new THREE.Group();
    pivot.position.set(bx + fx * 0.72, 3.42, bz + fz * 0.72);
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.62, 0.62), signMat);
    board.position.y = -0.44;
    pivot.add(board);
    city.group.add(pivot);
    city.disposables.push(signMat, board.geometry);
    city.signs.push({ pivot, phase: rr(0, TAU) });
  }
  city.buildings++;
}

/* ============================================================
   6.  Landmarks: church, keep, walls, gates, market…
   ============================================================ */

function buildChurch(cx, cz, ry) {
  const stoneC = 0xb5ac9d;
  const fx = Math.sin(ry), fz = Math.cos(ry);
  const rx = Math.cos(ry), rz = -Math.sin(ry);
  const P = (lx, ly, lz) => [cx + rx * lx + fx * lz, ly, cz + rz * lx + fz * lz];

  // nave
  const nw = 7.5, nd = 15, nh = 6.4;
  put('stone', U.box, ...P(0, nh / 2, 0), { ry, sx: nw, sy: nh, sz: nd, color: stoneC, jitter: 0.05, uv: [2.2, 1.6] });
  frameRoof(cx, cz, ry, nw, nd, nh, 4.6, 0x55606e, false);

  // buttresses
  for (let i = 0; i < 4; i++) for (const side of [-1, 1]) {
    const lz = -nd / 2 + 2.4 + i * ((nd - 4) / 3);
    put('stone', U.box, ...P(side * (nw / 2 + 0.35), 2.1, lz), { ry, rz: side * 0.14, sx: 0.7, sy: 4.2, sz: 0.7, color: 0xa39a8a, jitter: 0.07 });
  }
  // tall arched windows
  for (let i = 0; i < 3; i++) for (const side of [-1, 1]) {
    const lz = -nd / 2 + 3.2 + i * ((nd - 6) / 2.4);
    put('win', U.box, ...P(side * (nw / 2 + 0.06), 3.4, lz), { ry: ry + Math.PI / 2, sx: 0.7, sy: 2.6, sz: 0.12, color: 0xffffff });
  }
  // main door facing the plaza (−Z end is the tower side; door on +Z end)
  addDoor(...P(0, 0.02, nd / 2 + 0.06), ry);
  put('timber', U.box, ...P(0, 2.6, nd / 2 + 0.08), { ry, sx: nw * 0.55, sy: 0.22, sz: 0.24, color: 0x4c3418 });

  // bell tower (+Z end, between nave and plaza edge)
  const tw = 4.6, th = 15.5;
  const tx = cx + fx * (nd / 2 + tw / 2 - 0.4), tz = cz + fz * (nd / 2 + tw / 2 - 0.4);
  const towerGeo = U.cyl.clone();
  putGeo('stone', (() => {
    const g = new THREE.CylinderGeometry(2.6, 3.0, th, 4, 1);
    g.rotateY(Math.PI / 4);
    const m = new THREE.Matrix4().compose(new THREE.Vector3(tx, th / 2, tz), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, 0)), new THREE.Vector3(tw / 4.6, 1, tw / 4.6));
    return g.applyMatrix4(m);
  })(), stoneC, 0.05);
  // belfry openings + spire
  put('win', U.box, tx, th - 2.6, tz, { ry, sx: 1.5, sy: 2.2, sz: 3.4, color: 0xffffff });
  put('roof', U.cone, tx, th + 3.1, tz, { ry: ry + Math.PI / 4, sx: 5.4, sy: 6.2, sz: 5.4, color: 0x4c565f, jitter: 0.05 });
  // gold cross
  put('wood', U.box, tx, th + 7.0, tz, { sx: 0.16, sy: 1.5, sz: 0.16, color: 0xd8b25e });
  put('wood', U.box, tx, th + 7.25, tz, { sx: 0.8, sy: 0.16, sz: 0.16, color: 0xd8b25e });

  // small graveyard beside the nave
  const gy = 0;
  for (let i = 0; i < 9; i++) {
    const gx = cx + rx * (nw / 2 + rr(3.5, 8.5)) + fx * rr(-nd / 2, nd / 2);
    const gz = cz + rz * (nw / 2 + rr(3.5, 8.5)) + fz * rr(-nd / 2, nd / 2);
    if (chance(0.3))
      put('stone', U.box, gx, gy + 0.75, gz, { ry: rr(-0.2, 0.2), sx: 0.16, sy: 1.5, sz: 0.16, color: 0xa8a094 },
        ) || put('stone', U.box, gx, gy + 1.1, gz, { sx: 0.6, sy: 0.14, sz: 0.14, color: 0xa8a094 });
    else
      put('stone', U.box, gx, gy + 0.5, gz, { ry: rr(-0.3, 0.3), sx: rr(0.5, 0.8), sy: rr(0.8, 1.15), sz: 0.16, color: 0x9a9284, jitter: 0.1 });
  }
  city.nightLights.push({ x: tx, y: th - 2.4, z: tz, color: 0xffc27a, base: 26, dist: 46 });
}

function buildKeep(cx, cz) {
  const rockC = 0x8d8678;
  // rocky mound
  putGeo('stone', (() => {
    const g = new THREE.CylinderGeometry(15, 21, 3.2, 12, 1);
    const m = new THREE.Matrix4().compose(new THREE.Vector3(cx, 1.4, cz), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1));
    return g.applyMatrix4(m);
  })(), rockC, 0.08);
  // courtyard curtain wall (square, aligned to axes with slight jitter)
  const s = 11.5, wh = 4.2, ry0 = rr(0, 1.5);
  const fx = Math.sin(ry0), fz = Math.cos(ry0), rx = Math.cos(ry0), rz = -Math.sin(ry0);
  const P = (lx, ly, lz) => [cx + rx * lx + fx * lz, ly, cz + rz * lx + fz * lz];
  const top = 3.2;
  for (let i = 0; i < 4; i++) {
    const a = ry0 + (i * Math.PI) / 2;
    const mx = Math.cos(a) * s, mz = -Math.sin(a) * s;
    const len = s * 2;
    put('stone', U.box, cx + mx, top + wh / 2, cz + mz, { ry: a + Math.PI / 2, sx: 1.4, sy: wh, sz: len, color: 0x9a9284, jitter: 0.06, uv: [len / 4.5, 1.1] });
    const n = Math.floor(len / 2.1);
    for (let k = 0; k <= n; k++) {
      const t = -len / 2 + (len / n) * k;
      put('stone', U.box, cx + mx + Math.cos(a + Math.PI / 2) * 0, top + wh + 0.3, cz + mz,
        { ry: a + Math.PI / 2, sx: 0.9, sy: 0.75, sz: 0.9, color: 0x948c7e, jitter: 0.08 });
      void t;
    }
  }
  // corner turrets
  for (let i = 0; i < 4; i++) {
    const a = ry0 + Math.PI / 4 + (i * Math.PI) / 2;
    const tx = cx + Math.cos(a) * s * 1.35, tz = cz + Math.sin(a) * s * 1.35;
    putGeo('stone', (() => {
      const g = new THREE.CylinderGeometry(1.9, 2.2, 8.2, 9);
      return g.applyMatrix4(new THREE.Matrix4().makeTranslation(tx, top + 4.1, tz));
    })(), 0x9a9284, 0.06);
    put('roof', U.cone, tx, top + 9.6, tz, { sx: 4.6, sy: 3.6, sz: 4.6, color: 0x6e5a63, jitter: 0.06 });
    addWindow(tx + Math.cos(a) * 2.3, top + 5.4, tz + Math.sin(a) * 2.3, a, 0.4, 0.9);
  }
  // central donjon
  const dh = 17;
  putGeo('stone', (() => {
    const g = new THREE.CylinderGeometry(3.7, 4.3, dh, 12);
    return g.applyMatrix4(new THREE.Matrix4().makeTranslation(cx, top + dh / 2, cz));
  })(), 0xa8a094, 0.05);
  for (let k = 0; k < 14; k++) {
    const a = (k / 14) * TAU;
    put('stone', U.box, cx + Math.cos(a) * 3.8, top + dh + 0.35, cz + Math.sin(a) * 3.8,
      { ry: a, sx: 1.0, sy: 0.8, sz: 1.0, color: 0x9a9284, jitter: 0.08 });
  }
  put('win', U.box, cx, top + dh - 2.4, cz + 4.35, { sx: 0.9, sy: 1.6, sz: 0.14, color: 0xffffff });
  put('win', U.box, cx, top + 9, cz + 4.35, { sx: 0.6, sy: 1.1, sz: 0.14, color: 0xffffff });
  // door + steps
  addDoor(cx, top, cz + 4.5, 0);
  // banner on the donjon
  addFlag(cx + 0.2, top + dh + 2.6, cz, 3.4);
  city.nightLights.push({ x: cx, y: top + dh - 2, z: cz + 4, color: 0xffb45e, base: 20, dist: 40 });
}

function addFlag(x, y, z, size = 1) {
  const geo = new THREE.PlaneGeometry(1.9 * size, 1.05 * size, 10, 5);
  geo.translate(0.95 * size, 0, 0);
  const mat = std({ map: TEX.flag, side: THREE.DoubleSide, roughness: 0.9 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.rotation.y = rr(0, TAU);
  mesh.castShadow = true;
  city.group.add(mesh);
  city.disposables.push(geo, mat);
  city.flags.push({ mesh, base: geo.attributes.position.array.slice(), phase: rr(0, TAU), size });
  put('timber', U.cyl, x, y - 0.9 * size, z, { sx: 0.09 * size, sy: 2.4 * size, sz: 0.09 * size, color: 0x3c2a16 });
}

function buildWalls() {
  const N = 30;
  const radii = [];
  for (let i = 0; i < N; i++) radii.push(104 * (0.9 + 0.2 * R()));
  for (let p = 0; p < 2; p++)
    for (let i = 0; i < N; i++) {
      const p0 = radii[(i + N - 1) % N], p2 = radii[(i + 1) % N];
      radii[i] = (p0 + 2 * radii[i] + p2) / 4;
    }
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU;
    city.wallPts.push({ x: Math.cos(a) * radii[i], z: Math.sin(a) * radii[i], a });
  }
  // gate angles: 4 rough quadrants with jitter, min separation
  const gateAngles = [];
  for (let k = 0; k < 4; k++) {
    let a = k * (Math.PI / 2) + rr(-0.3, 0.3);
    gateAngles.push(a);
  }
  const gateIdx = gateAngles.map((a) => {
    let best = 0, bd = Infinity;
    city.wallPts.forEach((p, i) => {
      let da = Math.abs(((p.a - a) % TAU + TAU * 1.5) % TAU - Math.PI);
      if (da < bd) { bd = da; best = i; }
    });
    return best;
  });

  const H = 6.8, TH = 2.5;
  const towersDone = new Set();
  for (let i = 0; i < N; i++) {
    const p0 = city.wallPts[i], p1 = city.wallPts[(i + 1) % N];
    // is there a gate at p0 or p1?  segments adjacent to a gate shrink to the towers
    const gAt = (idx) => gateIdx.includes(idx);
    let ax = p0.x, az = p0.z, bx = p1.x, bz = p1.z;
    let skip = false;
    for (const gi of gateIdx) {
      const g = city.wallPts[gi];
      const tg = Math.atan2(g.z, g.x) + Math.PI / 2;           // wall tangent at gate
      const tx = -Math.sin(tg), tz = Math.cos(tg);
      if (gAt(i) && gAt((i + 1) % N)) skip = true;             // both ends gates: too short
      if (gAt(i) && !gAt((i + 1) % N) && g === p0) { ax = g.x + tx * 5.8; az = g.z + tz * 5.8; }
      if (gAt((i + 1) % N) && !gAt(i) && g === p1) { bx = g.x - tx * 5.8; bz = g.z - tz * 5.8; }
    }
    if (skip) continue;
    const dx = bx - ax, dz = bz - az;
    const len = Math.hypot(dx, dz);
    if (len < 4) continue;
    const ry = Math.atan2(dx, dz) + Math.PI / 2;
    const mx = (ax + bx) / 2, mz = (az + bz) / 2;
    // wall blocks (repeating slightly jittered modules, hand-built feel)
    const nBlocks = Math.max(1, Math.round(len / 6.5));
    const bl = len / nBlocks;
    for (let b = 0; b < nBlocks; b++) {
      const t0 = -len / 2 + b * bl;
      const cxx = ax + (dx / len) * (t0 + bl / 2) + rr(-0.08, 0.08);
      const czz = az + (dz / len) * (t0 + bl / 2) + rr(-0.08, 0.08);
      put('stone', U.box, cxx, H / 2, czz, { ry: ry + rr(-0.015, 0.015), sx: TH, sy: H, sz: bl * 1.02, color: 0xa39a8a, jitter: 0.06, uv: [bl / 4, H / 4] });
    }
    // crenellations (outer side)
    const nM = Math.floor(len / 2.2);
    for (let k = 0; k <= nM; k++) {
      const t = -len / 2 + (len / nM) * k;
      put('stone', U.box, ax + (dx / len) * t - (dz / len) * (TH / 2), H + 0.4, az + (dz / len) * t + (dx / len) * (TH / 2),
        { ry, sx: 1.0, sy: 0.85, sz: 1.2, color: 0x9a9284, jitter: 0.09 });
    }
    // wall walk inner lip
    put('stone', U.box, mx, H - 0.35, mz, { ry, sx: 0.5, sy: 0.7, sz: len, color: 0x948c7e, jitter: 0.06 });

    // occasional wall tower (not near gates)
    const iNext = (i + 1) % N;
    if (!gAt(i) && !gAt(iNext) && i % 5 === 2 && !towersDone.has(i)) {
      towersDone.add(i);
      buildWallTower(mx, mz, ry);
    }
  }
  // gates
  gateIdx.forEach((gi, k) => buildGate(city.wallPts[gi], k));
  city.gateIdx = gateIdx;
}

function buildWallTower(x, z, ry) {
  const h = rr(9.5, 12);
  const g = new THREE.CylinderGeometry(3.1, 3.5, h, 10);
  const m = new THREE.Matrix4().makeTranslation(x, h / 2, z);
  putGeo('stone', (() => { const gg = g.clone().applyMatrix4(m); scaleUV(gg, 4, h / 4); return gg; })(), 0x9a9284, 0.06);
  for (let k = 0; k < 9; k++) {
    const a = (k / 9) * TAU + ry;
    put('stone', U.box, x + Math.cos(a) * 3.1, h + 0.4, z + Math.sin(a) * 3.1, { ry: a, sx: 1.1, sy: 0.9, sz: 1.0, color: 0x948c7e, jitter: 0.08 });
  }
  if (chance(0.55)) {
    put('roof', U.cone, x, h + 2.9, z, { sx: 7.6, sy: 5.2, sz: 7.6, color: pick(ROOF_MID), jitter: 0.07 });
    addWindow(x + 2.9, h - 2.2, z, Math.PI / 2 + rr(-0.4, 0.4), 0.5, 0.8);
  } else {
    addWindow(x, h - 2.4, z + 3.3, 0, 0.5, 0.9);
  }
}

function buildGate(g, k) {
  const outA = Math.atan2(g.z, g.x);
  const ux = Math.cos(outA), uz = Math.sin(outA);
  const tg = outA + Math.PI / 2;
  const tx = -Math.sin(tg), tz = Math.cos(tg);
  const H = 6.8;

  for (const side of [-1, 1]) {
    const txp = g.x + tx * side * 5.8, tzp = g.z + tz * side * 5.8;
    const h = 11.5;
    const gc = new THREE.CylinderGeometry(2.9, 3.3, h, 10);
    const m = new THREE.Matrix4().makeTranslation(txp, h / 2, tzp);
    putGeo('stone', (() => { const gg = gc.clone().applyMatrix4(m); scaleUV(gg, 4, h / 4); return gg; })(), 0xa39a8a, 0.05);
    for (let kk = 0; kk < 9; kk++) {
      const a = (kk / 9) * TAU;
      put('stone', U.box, txp + Math.cos(a) * 2.9, h + 0.4, tzp + Math.sin(a) * 2.9, { ry: a, sx: 1.1, sy: 0.9, sz: 1.0, color: 0x9a9284, jitter: 0.08 });
    }
    put('roof', U.cone, txp, h + 2.8, tzp, { sx: 7.2, sy: 5.0, sz: 7.2, color: 0x7d4a3a, jitter: 0.06 });
    addWindow(txp + ux * 3.1, 5.4, tzp + uz * 3.1, outA, 0.5, 0.9);
    // torch on the front
    city.lanterns.push({ x: txp + ux * 3.4, y: 4.6, z: tzp + uz * 3.4, big: true });
    city.nightLights.push({ x: txp + ux * 3.6, y: 4.8, z: tzp + uz * 3.6, color: 0xff9a4a, base: 30, dist: 44 });
  }
  // arch above the passage
  const ry = tg;
  put('stone', U.box, g.x, H + 1.1, g.z, { ry, sx: 2.6, sy: 2.4, sz: 13.4, color: 0x9a9284, jitter: 0.05, uv: [3, 0.7] });
  for (let kk = 0; kk < 6; kk++)
    put('stone', U.box, g.x + tx * (-5.5 + kk * 2.2), H + 2.9, g.z + tz * (-5.5 + kk * 2.2), { ry, sx: 1.1, sy: 0.85, sz: 1.1, color: 0x948c7e, jitter: 0.08 });
  // portcullis
  const pg = new THREE.PlaneGeometry(4.6, 5.2);
  const pm = new THREE.Matrix4().compose(new THREE.Vector3(g.x, 2.9, g.z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, tg, 0)), new THREE.Vector3(1, 1, 1));
  putGeo('port', pg.applyMatrix4(pm), 0xffffff);

  // wooden bridge over the moat
  const r0 = 104 * 0.92 + 3, r1 = 104 * 1.1 + 16;
  const nP = 11;
  for (let i = 0; i < nP; i++) {
    const r = lerp(r0, r1, i / (nP - 1));
    const y = 0.3 + Math.sin((i / (nP - 1)) * Math.PI) * 1.0;
    put('wood', U.box, g.x + ux * r, y, g.z + uz * r, { ry: tg, sx: 5.4, sy: 0.22, sz: 1.15, color: 0x7a5a36, jitter: 0.1 });
    if (i % 3 === 0) for (const side of [-1, 1])
      put('timber', U.cyl, g.x + ux * r + tx * side * 2.5, y + 0.55, g.z + uz * r + tz * side * 2.5,
        { sx: 0.16, sy: 1.15, sz: 0.16, color: 0x4c3418 });
  }
  for (const side of [-1, 1]) {                     // rope rails
    const a0 = Math.atan2(g.z + tz * side * 2.5, g.x + tx * side * 2.5);
    put('timber', U.box, g.x + ux * (r0 + r1) / 2 + tx * side * 2.5, 1.15, g.z + uz * (r0 + r1) / 2 + tz * side * 2.5,
      { ry: tg, rx: -0.09, sx: 0.09, sy: 0.06, sz: r1 - r0 + 2, color: 0x6b4a2c });
    void a0;
  }
  if (k === 0) {                                     // gate guards
    city.guardAnchors = [];
    for (const side of [-1, 1])
      city.guardAnchors.push({ x: g.x + tx * side * 3.4 + ux * 4.4, z: g.z + tz * side * 3.4 + uz * 4.4, ry: outA });
  }
  if (k === 0) addFlag(g.x + tx * 5.8, 16.6, g.z + tz * 5.8, 1.1);
}

function buildStreets() {
  // radial streets plaza -> gates
  for (const gi of city.gateIdx) {
    const g = city.wallPts[gi];
    const a = Math.atan2(g.z, g.x);
    const pts = [];
    const rIn = 15, rOut = Math.hypot(g.x, g.z) - 2;
    const n = Math.max(3, Math.round((rOut - rIn) / 22));
    for (let i = 0; i <= n; i++) {
      const r = lerp(rIn, rOut, i / n);
      pts.push({ x: Math.cos(a) * r + rr(-2.2, 2.2) * (i / n), z: Math.sin(a) * r + rr(-2.2, 2.2) * (i / n) });
    }
    city.streets.push({ pts, halfW: 3.6 });
    // road outside, continuing into the fields
    const outPts = [{ x: g.x, z: g.z }];
    for (let r = Math.hypot(g.x, g.z) + 8; r < 210; r += 30)
      outPts.push({ x: Math.cos(a) * r + rr(-4, 4), z: Math.sin(a) * r + rr(-4, 4) });
    city.streets.push({ pts: outPts, halfW: 3.2, outside: true });
  }
  // ring street
  const ringPts = [];
  const nR = 18;
  for (let i = 0; i <= nR; i++) {
    const a = (i / nR) * TAU;
    const r = 60 * (1 + Math.sin(i * 2.7) * 0.03);
    ringPts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r });
  }
  city.streets.push({ pts: ringPts, halfW: 3.0 });

  for (const st of city.streets)
    for (let i = 0; i < st.pts.length - 1; i++)
      city.segs.push({ ax: st.pts[i].x, az: st.pts[i].z, bx: st.pts[i + 1].x, bz: st.pts[i + 1].z, halfW: st.halfW });

  // lay the dirt ribbons
  for (const st of city.streets) {
    for (let i = 0; i < st.pts.length - 1; i++) {
      const a = st.pts[i], b = st.pts[i + 1];
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz);
      put('dirtRoad', U.box, (a.x + b.x) / 2, st.outside ? 0.02 : 0.06, (a.z + b.z) / 2,
        { ry: Math.atan2(dx, dz) + Math.PI / 2, sx: st.halfW * 2, sy: 0.1, sz: len + st.halfW, color: 0xffffff, jitter: 0.12, uv: [st.halfW / 1.6, len / 5] });
    }
  }
  // plaza
  const plaza = new THREE.CircleGeometry(17, 26);
  plaza.rotateX(-Math.PI / 2);
  putGeo('cobble', plaza.translate(0, 0.09, 0), 0xffffff);
  const rim = new THREE.RingGeometry(17, 18.2, 26);
  rim.rotateX(-Math.PI / 2);
  putGeo('dirtRoad', rim.translate(0, 0.085, 0), 0xd8c8a8, 0.05);
}

function streetClearOK(x, z, pad) {
  for (const s of city.segs)
    if (distPointSeg(x, z, s.ax, s.az, s.bx, s.bz) < s.halfW + pad) return false;
  return true;
}
function zoneClearOK(x, z, extra = 0) {
  for (const zn of city.clearZones) if (Math.hypot(x - zn.x, z - zn.z) < zn.r + extra) return false;
  return true;
}

function placePlots() {
  const plots = [];
  const tryPlot = (x, z, ry, w, d) => {
    if (!pointInPolygon(x, z, city.wallPts)) return false;
    if (distToPolyline(x, z, city.wallPts) < 3.2 + Math.max(w, d) * 0.3) return false;
    if (!streetClearOK(x, z, 1.6 + Math.min(w, d) * 0.42)) return false;
    if (!zoneClearOK(x, z, Math.max(w, d) * 0.4)) return false;
    const rad = Math.hypot(w, d) / 2 * 0.78;
    for (const p of plots) if (Math.hypot(x - p.x, z - p.z) < rad + p.rad) return false;
    const dist = Math.hypot(x, z);
    plots.push({ x, z, ry, w, d, dist, rad, wallC: pick(PLASTER), sign: false });
    return true;
  };

  for (const st of city.streets) {
    if (st.outside) continue;
    for (let i = 0; i < st.pts.length - 1; i++) {
      const a = st.pts[i], b = st.pts[i + 1];
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz);
      const ux = dx / len, uz = dz / len;
      const nx = -uz, nz = ux;
      let s = rr(3, 7);
      while (s < len - 5) {
        for (const side of [-1, 1]) {
          const dist0 = Math.hypot(a.x + ux * s, a.z + uz * s);
          const d = dist0 < 45 ? rr(6, 9.5) : dist0 < 78 ? rr(5, 8) : rr(4.5, 6.5);
          const w = dist0 < 45 ? rr(6, 9) : rr(4.5, 7);
          const cx = a.x + ux * s + nx * side * (st.halfW + 1.4 + d / 2);
          const cz = a.z + uz * s + nz * side * (st.halfW + 1.4 + d / 2);
          const fx = -nx * side, fz = -nz * side;
          tryPlot(cx, cz, Math.atan2(fx, fz), w, d);
        }
        s += rr(7, 11.5);
      }
    }
  }
  // ring of buildings facing the plaza
  for (let k = 0; k < 12; k++) {
    const a = k * (TAU / 12) + rr(-0.1, 0.1);
    let nearGate = false;
    for (const gi of city.gateIdx) {
      const ga = city.wallPts[gi].a;
      if (Math.abs(((a - ga) % TAU + TAU * 1.5) % TAU - Math.PI) < 0.24) nearGate = true;
    }
    if (nearGate) continue;
    const d = rr(6, 8), w = rr(6, 8.5);
    const r = 17 + 1.4 + d / 2;
    const cx = Math.cos(a) * r, cz = Math.sin(a) * r;
    tryPlot(cx, cz, a + Math.PI, w, d);
  }
  // two inns nearest the plaza get hanging signs
  const sorted = plots.slice().sort((p, q) => p.dist - q.dist);
  for (const p of sorted) { if (p.w >= 6 && p.d >= 6) { p.sign = true; if (plots.filter(q => q.sign).length >= 2) break; } }
  city.plots = plots;
}

function buildMarket() {
  // the well
  putGeo('stone', (() => {
    const g = new THREE.CylinderGeometry(1.5, 1.7, 1.2, 12, 1, true);
    return g.applyMatrix4(new THREE.Matrix4().makeTranslation(0, 0.6, 0));
  })(), 0x8d867a, 0.08);
  put('stone', U.cyl, 0, 0.35, 0, { sx: 2.6, sy: 0.7, sz: 2.6, color: 0x77706a });
  for (const side of [-1, 1]) {
    put('timber', U.cyl, side * 1.4, 1.7, 0, { sx: 0.16, sy: 2.4, sz: 0.16, color: 0x4c3418 });
  }
  put('timber', U.cyl, 0, 2.75, 0, { rz: Math.PI / 2, sx: 0.12, sy: 2.9, sz: 0.12, color: 0x5a3e20 });
  put('roof', U.box, 0, 3.4, 0, { rx: 0.42, sx: 4.0, sy: 0.16, sz: 1.35, color: 0x8b4a30 });
  put('roof', U.box, 0, 3.4, 0, { rx: -0.42, sx: 4.0, sy: 0.16, sz: 1.35, color: 0x8b4a30 });
  city.nightLights.push({ x: 0, y: 3.6, z: 0, color: 0xffb45e, base: 34, dist: 55 });

  // stalls around the plaza
  const stallAngles = [];
  for (let k = 0; k < 9; k++) {
    const a = k * (TAU / 9) + rr(-0.08, 0.08);
    let blocked = false;
    for (const gi of city.gateIdx) {
      const ga = city.wallPts[gi].a;
      if (Math.abs(((a - ga) % TAU + TAU * 1.5) % TAU - Math.PI) < 0.35) blocked = true;
    }
    if (!blocked) stallAngles.push(a);
  }
  const stallTops = [];
  for (const a of stallAngles) {
    const r = rr(10.5, 13);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const ry = a + Math.PI / 2 + rr(-0.15, 0.15);      // facing the centre
    const fx = Math.sin(a + Math.PI), fz = Math.cos(a + Math.PI);
    for (const sx of [-1.05, 1.05]) for (const sz of [-0.85, 0.85])
      put('timber', U.cyl, x + Math.cos(ry) * sx + fx * sz, 1.1, z - Math.sin(ry) * sx + fz * sz,
        { sx: 0.09, sy: 2.2, sz: 0.09, color: 0x4c3418 });
    put('wood', U.box, x, 0.85, z, { ry, sx: 2.3, sy: 0.09, sz: 1.8, color: 0x8a6844, uv: [1, 1] });
    // awning with stripes
    const awTex = pick(TEX.awning);
    const awMat = std({ map: awTex, roughness: 0.9, side: THREE.DoubleSide });
    const aw = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 2.1), awMat);
    aw.rotation.order = 'YXZ';
    aw.rotation.y = ry;
    aw.rotation.x = -Math.PI / 2 + 0.35;
    aw.position.set(x + fx * 0.25, 2.45, z + fz * 0.25);
    aw.castShadow = true;
    city.group.add(aw);
    city.disposables.push(aw.geometry, awMat);
    // wares
    for (let i = 0; i < ri(3, 6); i++)
      put('wood', U.box, x + Math.cos(ry) * rr(-0.9, 0.9) + fx * rr(-0.5, 0.5), 1.06, z - Math.sin(ry) * rr(-0.9, 0.9) + fz * rr(-0.5, 0.5),
        { ry: rr(0, 1), sx: rr(0.25, 0.5), sy: rr(0.2, 0.4), sz: rr(0.25, 0.5), color: pick([0xc96b2e, 0x9db24a, 0xd8b25e, 0xa8422e, 0x8f6b3a]) });
    // barrel
    if (chance(0.7))
      putGeo('wood', (() => {
        const g = new THREE.CylinderGeometry(0.4, 0.44, 0.85, 9);
        const bx = x + fx * 1.6 + Math.cos(ry) * rr(-1.2, 1.2), bz = z + fz * 1.6 - Math.sin(ry) * rr(-1.2, 1.2);
        return g.applyMatrix4(new THREE.Matrix4().makeTranslation(bx, 0.43, bz));
      })(), 0x6d4c2a, 0.1);
    stallTops.push({ x: x + Math.cos(ry) * 1.05, y: 2.3, z: z - Math.sin(ry) * 1.05 });
  }
  // bunting between stall poles
  const lineMat = new THREE.LineBasicMaterial({ color: 0xd8cfc0 });
  city.disposables.push(lineMat);
  const pennantCols = [0xa53c2e, 0xd8b25e, 0x3f6b3a, 0x3c5a78, 0xe8dcc0];
  for (let i = 0; i < stallTops.length; i++) {
    const a = stallTops[i], b = stallTops[(i + 1) % stallTops.length];
    if (Math.hypot(a.x - b.x, a.z - b.z) > 12) continue;
    const pts = [];
    const n = 18;
    for (let k = 0; k <= n; k++) {
      const t = k / n;
      pts.push(new THREE.Vector3(lerp(a.x, b.x, t), lerp(a.y, b.y, t) - Math.sin(t * Math.PI) * 0.9, lerp(a.z, b.z, t)));
    }
    const lg = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(lg, lineMat);
    city.group.add(line);
    city.disposables.push(lg);
    for (let k = 1; k < n; k += 2) {
      const p = pts[k];
      const g = new THREE.BufferGeometry();
      const s = 0.34;
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        p.x - s, p.y, p.z, p.x + s, p.y, p.z, p.x, p.y - s * 1.7, p.z]), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array([0, 0, 1, 0, 0, 1, 0, 0, 1]), 3));
      g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(6), 2));
      g.setIndex([0, 1, 2]);
      putGeo('pennant', g, pick(pennantCols), 0.08);
    }
  }

  // carts & crates
  for (let i = 0; i < 2; i++) {
    const a = rr(0, TAU), r = rr(14, 16.5);
    const x = Math.cos(a) * r, z = Math.sin(a) * r, ry = rr(0, TAU);
    put('wood', U.box, x, 0.75, z, { ry, sx: 1.7, sy: 0.5, sz: 2.8, color: 0x7a5a36 });
    for (const side of [-1, 1])
      putGeo('wood', (() => {
        const g = new THREE.CylinderGeometry(0.62, 0.62, 0.14, 10);
        g.rotateZ(Math.PI / 2);
        const m = new THREE.Matrix4().compose(
          new THREE.Vector3(x + Math.cos(ry) * side * 1.0, 0.62, z - Math.sin(ry) * side * 1.0),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, 0)), new THREE.Vector3(1, 1, 1));
        return g.applyMatrix4(m);
      })(), 0x5d4326, 0.08);
    put('thatch', U.sphere, x, 1.15, z, { ry, sx: 1.5, sy: 0.7, sz: 2.2, color: 0xc8a95e, jitter: 0.1 });
  }
  // plaza lanterns
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + (k * Math.PI) / 2;
    const x = Math.cos(a) * 15.4, z = Math.sin(a) * 15.4;
    addLanternPost(x, z, a + Math.PI);
  }
}

function addLanternPost(x, z, ry) {
  const fx = Math.sin(ry), fz = Math.cos(ry);
  put('timber', U.cyl, x, 1.3, z, { sx: 0.13, sy: 2.6, sz: 0.13, color: 0x3e2c14 });
  put('timber', U.box, x + fx * 0.32, 2.55, z + fz * 0.32, { ry, sx: 0.08, sy: 0.08, sz: 0.62, color: 0x3e2c14 });
  put('lamp', U.box, x + fx * 0.58, 2.34, z + fz * 0.58, { sx: 0.3, sy: 0.42, sz: 0.3, color: 0xffffff });
  city.lanterns.push({ x: x + fx * 0.58, y: 2.42, z: z + fz * 0.58, big: false });
}

function buildLanterns() {
  for (const st of city.streets) {
    if (st.outside) continue;
    for (let i = 0; i < st.pts.length - 1; i++) {
      const a = st.pts[i], b = st.pts[i + 1];
      const len = Math.hypot(b.x - a.x, b.z - a.z);
      const n = Math.floor(len / 26);
      for (let k = 1; k <= n; k++) {
        const t = k / (n + 1);
        const dx = (b.x - a.x) / len, dz = (b.z - a.z) / len;
        const side = (i + k) % 2 === 0 ? 1 : -1;
        const x = lerp(a.x, b.x, t) - dz * side * (st.halfW - 0.7);
        const z = lerp(a.z, b.z, t) + dx * side * (st.halfW - 0.7);
        if (!zoneClearOK(x, z, 0.5)) continue;
        addLanternPost(x, z, Math.atan2(-dz * side, dx * side) + Math.PI / 2);
      }
    }
  }
}

function buildTrees() {
  const spots = [];
  // outside trees
  let attempts = 0;
  while (spots.length < 130 && attempts < 1400) {
    attempts++;
    const a = rr(0, TAU), r = rr(125, 330);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    let ok = r > 130;
    for (const s of city.segs) if (ok && distPointSeg(x, z, s.ax, s.az, s.bx, s.bz) < s.halfW + 5) ok = false;
    for (const f of city.fields) if (ok && Math.hypot(x - f.x, z - f.z) < f.r + 3) ok = false;
    for (const zn of city.clearZones) if (ok && Math.hypot(x - zn.x, z - zn.z) < zn.r) ok = false;
    for (const t of spots) if (ok && Math.hypot(x - t.x, z - t.z) < 5.2) ok = false;
    if (ok) spots.push({ x, z, s: rr(0.8, 1.7) });
  }
  // a few inside
  for (let k = 0; k < 26 && attempts < 2200; k++) {
    const a = rr(0, TAU), r = rr(24, 92);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!pointInPolygon(x, z, city.wallPts)) continue;
    if (!streetClearOK(x, z, 2)) continue;
    if (!zoneClearOK(x, z, 1)) continue;
    let ok = true;
    for (const p of city.plots) if (Math.hypot(x - p.x, z - p.z) < p.rad + 2.5) ok = false;
    if (ok) spots.push({ x, z, s: rr(0.8, 1.3) });
  }

  const trunkGeo = new THREE.CylinderGeometry(0.16, 0.3, 2.4, 6);
  trunkGeo.translate(0, 1.2, 0);
  const canGeo = new THREE.SphereGeometry(1.5, 7, 6);
  canGeo.translate(0, 3.4, 0);
  const trunks = new THREE.InstancedMesh(trunkGeo, MAT.bark, spots.length);
  const cans = new THREE.InstancedMesh(canGeo, MAT.leaf, spots.length);
  trunks.castShadow = cans.castShadow = true;
  const d = new THREE.Object3D();
  const cT = new THREE.Color(), cC = new THREE.Color();
  spots.forEach((t, i) => {
    d.position.set(t.x, 0, t.z);
    d.rotation.y = rr(0, TAU);
    d.scale.setScalar(t.s);
    d.updateMatrix();
    trunks.setMatrixAt(i, d.matrix);
    cans.setMatrixAt(i, d.matrix);
    cT.setHSL(0.08, 0.45, rr(0.16, 0.26));
    trunks.setColorAt(i, cT);
    const autumn = chance(0.14);
    cC.setHSL(autumn ? rr(0.05, 0.1) : rr(0.24, 0.33), autumn ? 0.75 : rr(0.42, 0.6), autumn ? rr(0.4, 0.5) : rr(0.28, 0.42));
    cans.setColorAt(i, cC);
  });
  city.group.add(trunks, cans);
  city.disposables.push(trunkGeo, canGeo);
  city.trees = spots.length;
}

function buildFields() {
  city.fields = [];
  for (let k = 0; k < city.gateIdx.length; k++) {
    if (k === city.millGate) continue;
    const g = city.wallPts[city.gateIdx[k]];
    const a = Math.atan2(g.z, g.x);
    for (const side of [-1, 1]) {
      if (chance(0.25)) continue;
      const fa = a + side * rr(0.16, 0.3);
      const r = rr(155, 205);
      const x = Math.cos(fa) * r, z = Math.sin(fa) * r;
      const fw = rr(24, 40), fd = rr(12, 20);
      city.fields.push({ x, z, r: Math.max(fw, fd) / 2 + 2 });
      const crop = pick([0xc8a84b, 0x9db24a, 0xb5924f, 0x86a344]);
      put('dirtRoad', U.box, x, 0.1, z, { ry: fa + Math.PI / 2, sx: fw, sy: 0.22, sz: fd, color: 0x8a6f48, jitter: 0.1, uv: [fw / 6, fd / 6] });
      const rows = Math.floor(fd / 2.6);
      for (let ri2 = 0; ri2 < rows; ri2++) {
        const lz = -fd / 2 + 1.3 + ri2 * 2.6;
        put('dirtRoad', U.box, x + Math.sin(fa + Math.PI / 2) * 0 + Math.cos(fa) * 0 + Math.sin(fa) * lz, 0.32,
          z + Math.cos(fa) * lz, { ry: fa + Math.PI / 2, sx: fw - 1.5, sy: 0.5, sz: 1.1, color: crop, jitter: 0.14 });
      }
      if (chance(0.6)) {
        const hx = x + rr(-fw / 3, fw / 3), hz = z + rr(-fd / 3, fd / 3);
        putGeo('thatch', (() => {
          const g2 = new THREE.CylinderGeometry(0.8, 0.8, 1.3, 9);
          g2.rotateZ(Math.PI / 2);
          return g2.applyMatrix4(new THREE.Matrix4().makeTranslation(hx, 0.65, hz));
        })(), 0xc8a95e, 0.1);
      }
    }
  }
}

function buildWindmill() {
  // pick a gate sector without fields conflict, place on a knoll
  const k = city.millGate;
  const g = city.wallPts[city.gateIdx[k]];
  const a = Math.atan2(g.z, g.x) + rr(0.3, 0.45) * (chance(0.5) ? 1 : -1);
  const r = 158;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  city.clearZones.push({ x, z, r: 16 });
  putGeo('grassIn', (() => {
    const g2 = new THREE.CylinderGeometry(11, 16, 4.5, 12);
    return g2.applyMatrix4(new THREE.Matrix4().makeTranslation(x, 1.6, z));
  })(), 0x86a355, 0.09);
  const th = 10;
  putGeo('plaster', (() => {
    const g2 = new THREE.CylinderGeometry(2.3, 3.2, th, 10);
    return g2.applyMatrix4(new THREE.Matrix4().makeTranslation(x, 4.5 + th / 2, z));
  })(), 0xe3d5b8, 0.05);
  put('roof', U.cone, x, 4.5 + th + 2.2, z, { sx: 6.4, sy: 4.4, sz: 6.4, color: 0x7d4a3a });
  addDoor(x, 4.5, z + 2.9, 0);
  // sail assembly
  const faceA = Math.atan2(-z, -x);                      // face the town
  const hub = new THREE.Group();
  hub.position.set(x + Math.sin(faceA) * 3.1, 4.5 + th - 1.4, z + Math.cos(faceA) * 3.1);
  hub.rotation.y = faceA;
  const spin = new THREE.Group();
  const sailMat = std({ color: 0xe8ddc2, roughness: 0.9, side: THREE.DoubleSide });
  const armMat = std({ map: TEX.timber, roughness: 0.9 });
  city.disposables.push(sailMat, armMat);
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    arm.rotation.z = (i * Math.PI) / 2;
    const beam = new THREE.Mesh(new THREE.BoxGeometry(0.22, 7.4, 0.22), armMat);
    beam.position.y = 3.5;
    beam.castShadow = true;
    const sail = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 5.6), sailMat);
    sail.position.set(0.95, 3.4, 0.12);
    sail.castShadow = true;
    arm.add(beam, sail);
    city.disposables.push(beam.geometry, sail.geometry);
    spin.add(arm);
  }
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.4, 8), armMat);
  axle.rotation.x = Math.PI / 2;
  hub.add(axle, spin);
  city.group.add(hub);
  city.mill = { spin, speed: rr(0.5, 0.8), gust: rr(0, TAU) };
  // path to the mill
  const pts = [{ x: g.x * 1.35, z: g.z * 1.35 }, { x: x * 0.82, z: z * 0.82 }, { x, z: z }];
  city.streets.push({ pts, halfW: 2.2, outside: true });
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1];
    const dx = p1.x - p0.x, dz = p1.z - p0.z;
    put('dirtRoad', U.box, (p0.x + p1.x) / 2, 0.02, (p0.z + p1.z) / 2,
      { ry: Math.atan2(dx, dz) + Math.PI / 2, sx: 4.4, sy: 0.1, sz: Math.hypot(dx, dz) + 2, color: 0xffffff, jitter: 0.1, uv: [1.4, 2] });
    city.segs.push({ ax: p0.x, az: p0.z, bx: p1.x, bz: p1.z, halfW: 2.2 });
  }
}

function buildHamlet() {
  const k = (city.millGate + 2) % city.gateIdx.length;
  const g = city.wallPts[city.gateIdx[k]];
  const a = Math.atan2(g.z, g.x);
  const hx = Math.cos(a) * 152, hz = Math.sin(a) * 152;
  city.clearZones.push({ x: hx, z: hz, r: 22 });
  const n = ri(3, 5);
  for (let i = 0; i < n; i++) {
    const sa = a + rr(-0.28, 0.28);
    const r = rr(138, 165);
    const x = Math.cos(sa) * r, z = Math.sin(sa) * r;
    const d = rr(4.5, 6.5), w = rr(4.5, 6.5);
    const H = 2.8, roofH = rr(2.3, 3.0);
    const ry = sa + Math.PI / 2 + rr(-0.4, 0.4);
    frameHouse(x, z, ry, w, d, H, 'timber', pick(PLASTER), 1, false);
    frameRoof(x, z, ry, w, d, H, roofH, pick(ROOF_OUT), true);
    if (chance(0.8)) frameChimney(x, z, ry, w, d, H, roofH, chance(0.5) ? 1 : -1, chance(0.4));
    city.buildings++;
  }
  // connect for wanderers
  city.hamletNode = { x: hx, z: hz, gate: { x: g.x, z: g.z } };
}

function buildGround() {
  const outer = new THREE.Mesh(new THREE.RingGeometry(118, 860, 72, 1), MAT.grassOut);
  outer.rotation.x = -Math.PI / 2;
  outer.position.y = -0.14;
  outer.receiveShadow = true;
  city.group.add(outer);
  city.disposables.push(outer.geometry);

  const inner = new THREE.Mesh(new THREE.CircleGeometry(118, 64), MAT.grassIn);
  inner.rotation.x = -Math.PI / 2;
  inner.position.y = 0.0;
  inner.receiveShadow = true;
  city.group.add(inner);
  city.disposables.push(inner.geometry);

  // moat
  const moat = new THREE.Mesh(new THREE.RingGeometry(112, 126, 96, 1), waterMat);
  moat.rotation.x = -Math.PI / 2;
  moat.position.y = -0.5;
  city.group.add(moat);
  city.disposables.push(moat.geometry);
  // banks
  const b1 = new THREE.Mesh(new THREE.RingGeometry(110.5, 114, 96, 1), MAT.dirtRoad);
  b1.rotation.x = -Math.PI / 2; b1.position.y = -0.06;
  city.group.add(b1);
  city.disposables.push(b1.geometry);
  const b2 = new THREE.Mesh(new THREE.RingGeometry(124, 128.5, 96, 1), MAT.dirtRoad);
  b2.rotation.x = -Math.PI / 2; b2.position.y = -0.1;
  city.group.add(b2);
  city.disposables.push(b2.geometry);

  // distant hills
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * TAU + rr(-0.2, 0.2);
    const r = rr(430, 640);
    const s = rr(90, 190);
    putGeo('grassOut', (() => {
      const g = new THREE.SphereGeometry(1, 14, 8, 0, TAU, 0, Math.PI / 2);
      return g.applyMatrix4(new THREE.Matrix4().compose(
        new THREE.Vector3(Math.cos(a) * r, -4, Math.sin(a) * r),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rr(0, TAU), 0)),
        new THREE.Vector3(s, s * rr(0.16, 0.3), s)));
    })(), new THREE.Color().setHSL(rr(0.24, 0.32), rr(0.32, 0.45), rr(0.3, 0.4)).getHex(), 0.05);
  }
}

/* ---------- water ---------- */
const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: {
    uTime: { value: 0 },
    uDeep: { value: new THREE.Color(0x27474f) },
    uShallow: { value: new THREE.Color(0x4e7a72) },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uSunColor: { value: new THREE.Color(0xfff1d6) },
    uSkyColor: { value: new THREE.Color(0xd7ecf5) },
    uFogColor: { value: new THREE.Color(0xcfe4ef) },
    uFogNear: { value: 170 }, uFogFar: { value: 760 },
  },
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorld; varying vec3 vN; varying float vWave;
    void main() {
      vec3 p = position;
      float t = uTime;
      float wx = sin(p.x*0.30 + t*1.05) + 0.6*sin(p.x*0.12 - p.z*0.22 + t*0.7);
      float wz = sin(p.z*0.38 - t*0.9) + 0.6*sin(p.z*0.16 + p.x*0.24 + t*0.55);
      p.y += 0.09*(wx+wz);
      vWave = wx + wz;
      float ddx = 0.30*cos(p.x*0.30 + t*1.05) + 0.6*0.12*cos(p.x*0.12 - p.z*0.22 + t*0.7);
      float ddz = 0.38*cos(p.z*0.38 - t*0.9) + 0.6*0.16*cos(p.z*0.16 + p.x*0.24 + t*0.55);
      vN = normalize(vec3(-0.09*ddx, 1.0, -0.09*ddz));
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uSunDir;
    uniform vec3 uSunColor; uniform vec3 uSkyColor; uniform vec3 uFogColor;
    uniform float uFogNear; uniform float uFogFar;
    varying vec3 vWorld; varying vec3 vN; varying float vWave;
    void main() {
      vec3 V = normalize(cameraPosition - vWorld);
      vec3 N = normalize(vN);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 2.4);
      vec3 col = mix(uDeep, uShallow, clamp(0.5 + vWave*0.22, 0.0, 1.0));
      col = mix(col, uSkyColor, fres*0.7);
      vec3 R = reflect(-normalize(uSunDir), N);
      col += uSunColor * pow(max(dot(R, V), 0.0), 90.0) * 1.1;
      float fd = length(cameraPosition - vWorld);
      col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, fd));
      gl_FragColor = vec4(col, 0.9);
    }`,
});

/* ============================================================
   7.  Citizens (instanced) + guards + birds
   ============================================================ */

function buildGraph() {
  const nodes = [];
  const adj = [];
  const addNode = (x, z, tag) => { nodes.push({ x, z, tag }); adj.push(new Set()); return nodes.length - 1; };
  const link = (a, b) => { if (a === b) return; adj[a].add(b); adj[b].add(a); };

  // plaza ring
  const plazaIdx = [];
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    plazaIdx.push(addNode(Math.cos(a) * 13, Math.sin(a) * 13, 'plaza'));
  }
  for (let i = 0; i < 12; i++) link(plazaIdx[i], plazaIdx[(i + 1) % 12]);

  const chains = [];
  for (const gi of city.gateIdx) {
    const g = city.wallPts[gi];
    const a = Math.atan2(g.z, g.x);
    const rs = [27, 45, 62, 80, Math.hypot(g.x, g.z) - 1.5, Math.hypot(g.x, g.z) + 9, Math.hypot(g.x, g.z) + 26];
    const chain = rs.map((r, i) => addNode(Math.cos(a) * r + (i >= 5 ? rr(-2, 2) : 0), Math.sin(a) * r + (i >= 5 ? rr(-2, 2) : 0), i === 4 ? 'gate' : ''));
    for (let i = 0; i < chain.length - 1; i++) link(chain[i], chain[i + 1]);
    // connect to nearest plaza node
    let best = 0, bd = Infinity;
    for (const p of plazaIdx) {
      const d = Math.hypot(nodes[p].x - nodes[chain[0]].x, nodes[p].z - nodes[chain[0]].z);
      if (d < bd) { bd = d; best = p; }
    }
    link(best, chain[0]);
    chains.push(chain);
  }
  // ring street nodes
  const ring = [];
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * TAU;
    ring.push(addNode(Math.cos(a) * 60 + rr(-1.5, 1.5), Math.sin(a) * 60 + rr(-1.5, 1.5), ''));
  }
  for (let i = 0; i < 18; i++) link(ring[i], ring[(i + 1) % 18]);
  for (const r of ring) {
    let best = -1, bd = 13;
    for (const ch of chains) for (const ci of ch) {
      const d = Math.hypot(nodes[ci].x - nodes[r].x, nodes[ci].z - nodes[r].z);
      if (d < bd) { bd = d; best = ci; }
    }
    if (best >= 0) link(r, best);
  }
  // hamlet spur
  if (city.hamletNode) {
    const h = addNode(city.hamletNode.x, city.hamletNode.z, 'hamlet');
    let best = 0, bd = Infinity;
    for (const ch of chains) {
      const ci = ch[6];
      const d = Math.hypot(nodes[ci].x - nodes[h].x, nodes[ci].z - nodes[h].z);
      if (d < bd) { bd = d; best = ci; }
    }
    link(h, best);
  }
  city.graph = { nodes, adj };
}

const CITIZEN_N = 72;
function buildCitizens() {
  const { nodes, adj } = city.graph;
  const bodyGeo = new THREE.CapsuleGeometry(0.33, 0.62, 3, 8);
  const headGeo = new THREE.SphereGeometry(0.215, 8, 7);
  const armGeo = new THREE.BoxGeometry(0.11, 0.5, 0.11);
  armGeo.translate(0, -0.25, 0);

  const bodies = new THREE.InstancedMesh(bodyGeo, std({ roughness: 0.9 }), CITIZEN_N);
  const heads = new THREE.InstancedMesh(headGeo, std({ roughness: 0.85 }), CITIZEN_N);
  const armL = new THREE.InstancedMesh(armGeo, std({ roughness: 0.9 }), CITIZEN_N);
  const armR = new THREE.InstancedMesh(armGeo, std({ roughness: 0.9 }), CITIZEN_N);
  for (const m of [bodies, heads, armL, armR]) { m.castShadow = true; m.frustumCulled = false; }
  city.group.add(bodies, heads, armL, armR);
  city.disposables.push(bodyGeo, headGeo, armGeo);

  const list = [];
  const cB = new THREE.Color(), cH = new THREE.Color();
  for (let i = 0; i < CITIZEN_N; i++) {
    const a = Math.floor(R() * nodes.length);
    const nbrs = [...adj[a]];
    const b = nbrs.length ? nbrs[Math.floor(R() * nbrs.length)] : a;
    const tunic = pick(TUNIC);
    const hooded = chance(0.45);
    cB.set(tunic).offsetHSL(0, 0, rr(-0.05, 0.05));
    bodies.setColorAt(i, cB);
    if (hooded) cH.set(tunic).multiplyScalar(0.8);
    else cH.set(pick(SKIN));
    heads.setColorAt(i, cH);
    armL.setColorAt(i, cB); armR.setColorAt(i, cB);
    list.push({
      a, b, t: R(), speed: rr(1.5, 2.7), phase: rr(0, TAU),
      state: 'walk', wait: 0, ry: 0, bob: 0, hooded,
      scale: rr(0.9, 1.08),
    });
  }
  bodies.instanceColor.needsUpdate = true;
  heads.instanceColor.needsUpdate = true;
  armL.instanceColor.needsUpdate = true;
  armR.instanceColor.needsUpdate = true;

  // lantern-bearer glows (follow first few citizens at night)
  const glowGeo = new THREE.BufferGeometry();
  const gN = 6;
  glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(gN * 3), 3));
  glowGeo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(gN).fill(3), 1));
  glowGeo.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(gN).fill(1), 1));
  const gMat = pointsMat(TEX.glow, true);
  const glows = new THREE.Points(glowGeo, gMat);
  glows.frustumCulled = false;
  city.group.add(glows);
  city.disposables.push(glowGeo, gMat);

  city.citizens = { bodies, heads, armL, armR, list, glows, gMat, glowPos: glowGeo.attributes.position };
  city.souls = CITIZEN_N;
}

function updateCitizens(dt, time, dayCrowd, nightGlow) {
  const { nodes, adj } = city.graph;
  const C = city.citizens;
  const active = Math.round(lerp(16, CITIZEN_N, dayCrowd));
  const d = new THREE.Object3D();
  const qy = new THREE.Quaternion(), qx = new THREE.Quaternion(), q = new THREE.Quaternion();
  const Y = new THREE.Vector3(0, 1, 0), X = new THREE.Vector3(1, 0, 0);

  C.list.forEach((ct, i) => {
    let x = 0, z = 0, ry = ct.ry, visible = i < active;
    if (visible) {
      const A = nodes[ct.a], B = nodes[ct.b];
      if (ct.state === 'walk') {
        ct.t += (ct.speed * dt) / Math.max(1, Math.hypot(B.x - A.x, B.z - A.z));
        if (ct.t >= 1) {
          ct.a = ct.b; ct.t = 0;
          const nbrs = [...adj[ct.a]];
          let next = nbrs.length === 1 ? nbrs[0] : nbrs[Math.floor(R() * nbrs.length)];
          if (nbrs.length > 1 && next === ct.prev && chance(0.8))
            next = nbrs.filter((n) => n !== ct.prev)[Math.floor(R() * (nbrs.length - 1))] ?? next;
          ct.prev = ct.a; ct.b = next;
          const tag = nodes[ct.a].tag;
          if ((tag === 'plaza' && chance(0.45)) || chance(0.06)) { ct.state = 'idle'; ct.wait = rr(1.5, 7); }
        }
      } else {
        ct.wait -= dt;
        ct.ry += Math.sin(time * 1.3 + ct.phase) * 0.006;
        if (ct.wait <= 0) ct.state = 'walk';
      }
      const A2 = nodes[ct.a], B2 = nodes[ct.b];
      x = lerp(A2.x, B2.x, clamp(ct.t, 0, 1));
      z = lerp(A2.z, B2.z, clamp(ct.t, 0, 1));
      const dx = B2.x - A2.x, dz = B2.z - A2.z;
      if (Math.abs(dx) + Math.abs(dz) > 0.01) ct.ry = Math.atan2(dx, dz);
      ry = ct.ry;
      ct.bob += dt * ct.speed * 3.4;
    }
    const s = visible ? ct.scale : 0;
    const y = 0.95 + (visible ? Math.abs(Math.sin(ct.bob)) * 0.07 : 0);

    qy.setFromAxisAngle(Y, ry);
    qx.setFromAxisAngle(X, visible ? 0.07 : 0);
    q.copy(qy).multiply(qx);
    d.position.set(x, y, z); d.quaternion.copy(q); d.scale.setScalar(s);
    d.updateMatrix();
    C.bodies.setMatrixAt(i, d.matrix);
    d.position.y = y + 0.68; d.scale.setScalar(s * (ct.hooded ? 1.3 : 1));
    d.updateMatrix();
    C.heads.setMatrixAt(i, d.matrix);

    const swing = visible && ct.state === 'walk' ? Math.sin(ct.bob) * 0.55 : 0;
    const shY = y + 0.42;
    for (const [mesh, side] of [[C.armL, 1], [C.armR, -1]]) {
      d.position.set(x + Math.cos(ry) * 0.42 * side * s, shY, z - Math.sin(ry) * 0.42 * side * s);
      qx.setFromAxisAngle(X, swing * side);
      q.copy(qy).multiply(qx);
      d.quaternion.copy(q); d.scale.setScalar(s);
      d.updateMatrix();
      mesh.setMatrixAt(i, d.matrix);
    }
    if (i < 6) {
      C.glowPos.setXYZ(i, x, y + 0.55, z);
    }
  });
  C.bodies.instanceMatrix.needsUpdate = true;
  C.heads.instanceMatrix.needsUpdate = true;
  C.armL.instanceMatrix.needsUpdate = true;
  C.armR.instanceMatrix.needsUpdate = true;
  C.glowPos.needsUpdate = true;
  C.gMat.uniforms.uOpacity.value = nightGlow;
}

/* ---------- guards ---------- */
function buildGuards() {
  const mkGuard = (x, z, ry) => {
    const g = new THREE.Group();
    const bodyM = std({ color: 0x8b939e, roughness: 0.6, metalness: 0.35 });
    const tabM = std({ color: 0x7a1f2b, roughness: 0.9 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.66, 3, 8), bodyM);
    body.position.y = 1.0;
    const tabard = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.9, 0.62), tabM);
    tabard.position.y = 1.02;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 8, 7), std({ color: 0xd9a06e }));
    head.position.y = 1.72;
    const helm = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.34, 8), bodyM);
    helm.position.y = 1.94;
    const spearG = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 3.1, 6), std({ map: TEX.timber }));
    spearG.position.set(0.5, 1.5, 0.1);
    spearG.rotation.z = 0.06;
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 6), bodyM);
    tip.position.set(0.5, 3.1, 0.1);
    const shield = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 12), tabM);
    shield.rotation.z = Math.PI / 2;
    shield.position.set(-0.46, 1.15, 0);
    for (const m of [body, tabard, head, helm, spearG, tip, shield]) { m.castShadow = true; g.add(m); }
    g.position.set(x, 0, z);
    g.rotation.y = ry;
    city.group.add(g);
    city.disposables.push(bodyM, tabM, body.geometry, tabard.geometry, head.geometry, helm.geometry, spearG.geometry, tip.geometry, shield.geometry);
    return g;
  };
  // two sentries at the main gate
  if (city.guardAnchors)
    for (const an of city.guardAnchors)
      city.guards.push({ g: mkGuard(an.x, 0, an.ry), mode: 'stand', phase: rr(0, TAU), baseRy: an.ry });
  // two patrolling an arc of the wall walk
  const pts = [];
  const g0 = city.gateIdx[0], g1 = city.gateIdx[1];
  let i0 = Math.min(g0, g1), i1 = Math.max(g0, g1);
  for (let i = i0 + 2; i <= i1 - 2; i++) pts.push(city.wallPts[i % city.wallPts.length]);
  if (pts.length > 3) {
    for (let k = 0; k < 2; k++)
      city.guards.push({ g: mkGuard(pts[0].x, 7.3, 0), mode: 'patrol', path: pts, seg: Math.floor(k * pts.length / 2), t: 0, dir: 1, speed: rr(1.1, 1.4), phase: rr(0, TAU) });
  }
}

function updateGuards(dt, time) {
  for (const gd of city.guards) {
    if (gd.mode === 'stand') {
      gd.g.rotation.y = gd.baseRy + Math.sin(time * 0.6 + gd.phase) * 0.18;
      gd.g.position.y = Math.abs(Math.sin(time * 1.7 + gd.phase)) * 0.02;
    } else {
      const p = gd.path;
      gd.t += (gd.speed * dt) / Math.max(1, Math.hypot(p[gd.seg + 1].x - p[gd.seg].x, p[gd.seg + 1].z - p[gd.seg].z));
      while (gd.t >= 1) {
        gd.t -= 1;
        gd.seg += gd.dir;
        if (gd.seg >= p.length - 1 || gd.seg <= 0) gd.dir *= -1;
      }
      const a = p[gd.seg], b = p[clamp(gd.seg + gd.dir, 0, p.length - 1)];
      const x = lerp(a.x, b.x, gd.t), z = lerp(a.z, b.z, gd.t);
      gd.g.position.set(x, 7.35 + Math.abs(Math.sin(time * 4)) * 0.05, z);
      gd.g.rotation.y = Math.atan2((b.x - a.x) * gd.dir, (b.z - a.z) * gd.dir);
    }
  }
}

/* ---------- birds ---------- */
function buildBirds() {
  const wingM = std({ color: 0x2e2a26, side: THREE.DoubleSide, roughness: 0.9 });
  city.disposables.push(wingM);
  for (let i = 0; i < 6; i++) {
    const g = new THREE.Group();
    const wl = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.3), wingM);
    wl.position.x = 0.5;
    const wr = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.3), wingM);
    wr.position.x = -0.5;
    wl.rotation.x = wr.rotation.x = -Math.PI / 2;
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.6, 5), wingM);
    body.rotation.x = Math.PI / 2;
    g.add(wl, wr, body);
    city.group.add(g);
    city.disposables.push(wl.geometry, wr.geometry, body.geometry);
    city.birds.push({
      g, wl, wr,
      cx: rr(-40, 40), cz: rr(-40, 40),
      r: rr(24, 60), h: rr(26, 46),
      w: rr(0.12, 0.3) * (chance(0.5) ? 1 : -1), ph: rr(0, TAU), flap: rr(6, 10),
    });
  }
}
const _bv = new THREE.Vector3();
function updateBirds(dt, time) {
  for (const b of city.birds) {
    const a = time * b.w + b.ph;
    const x = b.cx + Math.cos(a) * b.r, z = b.cz + Math.sin(a) * b.r;
    const y = b.h + Math.sin(time * 0.7 + b.ph) * 2.5;
    _bv.set(b.cx + Math.cos(a + 0.1 * Math.sign(b.w)) * b.r, y, b.cz + Math.sin(a + 0.1 * Math.sign(b.w)) * b.r);
    b.g.position.set(x, y, z);
    b.g.lookAt(_bv);
    const glide = smooth(0.55, 0.75, Math.sin(time * 0.31 + b.ph * 3));
    const f = Math.sin(time * b.flap + b.ph) * 0.55 * (1 - glide * 0.85);
    b.wl.rotation.z = f;
    b.wr.rotation.z = -f;
  }
}

/* ============================================================
   8.  Particles: smoke, lantern glow, fireflies
   ============================================================ */

function pointsMat(tex, additive) {
  return new THREE.ShaderMaterial({
    uniforms: { uTex: { value: tex }, uOpacity: { value: 1 } },
    vertexShader: `
      attribute float aSize; attribute float aAlpha;
      varying float vA;
      void main() {
        vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (260.0 / max(1.0, -mv.z));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; uniform float uOpacity;
      varying float vA;
      void main() {
        vec4 c = texture2D(uTex, gl_PointCoord);
        float a = c.a * vA * uOpacity;
        if (a < 0.012) discard;
        gl_FragColor = vec4(c.rgb, a);
      }`,
    transparent: true, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
}

let smokeSys = null;
function buildSmoke() {
  const emitters = city.smokes.slice(0, 72);
  const per = 11;
  const n = emitters.length * per;
  if (!n) { smokeSys = null; return; }
  const pos = new Float32Array(n * 3);
  const size = new Float32Array(n);
  const alpha = new Float32Array(n);
  const meta = new Float32Array(n * 3);   // emitter idx, phase, rate
  for (let i = 0; i < n; i++) {
    meta[i * 3] = i % emitters.length;
    meta[i * 3 + 1] = R();
    meta[i * 3 + 2] = rr(0.7, 1.3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  const mat = pointsMat(TEX.smoke, false);
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  city.group.add(pts);
  city.disposables.push(geo, mat);
  smokeSys = { pts, mat, pos, size, alpha, meta, emitters, per };
}

function updateSmoke(time, dayF) {
  if (!smokeSys) return;
  const { pos, size, alpha, meta, emitters, per } = smokeSys;
  const windX = 1.5, windZ = 0.6;
  for (let i = 0; i < meta.length / 3; i++) {
    const e = emitters[meta[i * 3] | 0];
    const ph = meta[i * 3 + 1], rate = meta[i * 3 + 2];
    const t = (time * 0.115 * rate + ph) % 1;
    const curl = Math.sin(t * 7 + ph * 20) * (0.25 + t * 0.8);
    pos[i * 3] = e.x + windX * t * t * 3 + curl;
    pos[i * 3 + 1] = e.y + t * 9.5;
    pos[i * 3 + 2] = e.z + windZ * t * t * 3 + Math.cos(t * 6 + ph * 17) * (0.2 + t * 0.7);
    size[i] = lerp(1.6, 7.5, t);
    alpha[i] = (1 - t) * smooth(0, 0.12, t) * 0.34 * (0.4 + 0.6 * dayF);
  }
  smokeSys.pts.geometry.attributes.position.needsUpdate = true;
  smokeSys.pts.geometry.attributes.aSize.needsUpdate = true;
  smokeSys.pts.geometry.attributes.aAlpha.needsUpdate = true;
}

let glowSys = null;
function buildGlows() {
  const n = city.lanterns.length;
  const pos = new Float32Array(n * 3);
  const size = new Float32Array(n);
  const alpha = new Float32Array(n);
  const phase = new Float32Array(n);
  city.lanterns.forEach((l, i) => {
    pos[i * 3] = l.x; pos[i * 3 + 1] = l.y; pos[i * 3 + 2] = l.z;
    size[i] = l.big ? 7.5 : 3.4;
    phase[i] = R() * TAU;
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  const mat = pointsMat(TEX.glow, true);
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  city.group.add(pts);
  city.disposables.push(geo, mat);
  glowSys = { pts, mat, alpha, phase, geo };
}

function updateGlows(time, nightGlow) {
  if (!glowSys) return;
  const { alpha, phase, geo, mat } = glowSys;
  for (let i = 0; i < alpha.length; i++)
    alpha[i] = nightGlow * (0.75 + 0.25 * Math.sin(time * 9 + phase[i]));
  geo.attributes.aAlpha.needsUpdate = true;
  mat.uniforms.uOpacity.value = 1;
}

let flySys = null;
function buildFireflies() {
  const n = 80;
  const pos = new Float32Array(n * 3);
  const size = new Float32Array(n);
  const alpha = new Float32Array(n);
  const base = [];
  for (let i = 0; i < n; i++) {
    const a = R() * TAU, r = rr(70, 200);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    base.push({ x, y: rr(0.6, 3.2), z, ph: R() * TAU, sp: rr(0.4, 1.2) });
    pos[i * 3] = x; pos[i * 3 + 1] = base[i].y; pos[i * 3 + 2] = z;
    size[i] = rr(1.1, 2.2);
    alpha[i] = 0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  const mat = pointsMat(TEX.glowCool, true);
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  city.group.add(pts);
  city.disposables.push(geo, mat);
  flySys = { pts, geo, mat, alpha, base };
}

function updateFireflies(time, nightGlow) {
  if (!flySys) return;
  const { alpha, base, geo, pts } = flySys;
  const arr = geo.attributes.position.array;
  for (let i = 0; i < base.length; i++) {
    const b = base[i];
    const t = time * b.sp + b.ph;
    arr[i * 3] = b.x + Math.sin(t) * 1.6;
    arr[i * 3 + 1] = b.y + Math.sin(t * 1.7) * 0.5;
    arr[i * 3 + 2] = b.z + Math.cos(t * 0.8) * 1.6;
    alpha[i] = nightGlow * (0.35 + 0.65 * Math.max(0, Math.sin(t * 2.2)));
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aAlpha.needsUpdate = true;
  pts.visible = nightGlow > 0.02;
}

/* ============================================================
   9.  Day / night cycle
   ============================================================ */

const PAL = {
  day:   { top: 0x5ea7e0, hor: 0xd7ecf5, fog: 0xcfe4ef, sunC: 0xfff1d6, sunI: 1.45, hemiS: 0xbfd8ef, hemiG: 0x54622f, hemiI: 0.6, amb: 0x44525f, ambI: 0.35, glow: 0x000000, glowS: 0 },
  twi:   { top: 0x3b5a8c, hor: 0xf2a05a, fog: 0xd9905e, sunC: 0xffb377, sunI: 0.6,  hemiS: 0x8a90b8, hemiG: 0x4a4436, hemiI: 0.45, amb: 0x3a4258, ambI: 0.3, glow: 0xff9a4a, glowS: 0.9 },
  night: { top: 0x0a1030, hor: 0x1a2547, fog: 0x111a30, sunC: 0x8fb0e8, sunI: 0,    hemiS: 0x223355, hemiG: 0x0c1020, hemiI: 0.3, amb: 0x1a2233, ambI: 0.3, glow: 0x35406e, glowS: 0.12 },
};
const _ca = new THREE.Color(), _cb = new THREE.Color(), _ca2 = new THREE.Color(), _cb2 = new THREE.Color();
const sunDir = new THREE.Vector3();
let nightGlow = 0, dayCrowd = 1, dayF = 1;

function mixPal(a, b, t, out) {
  for (const k of ['top', 'hor', 'fog', 'sunC', 'hemiS', 'hemiG', 'amb', 'glow']) {
    _ca.set(a[k]); _cb.set(b[k]);
    out[k === 'glow' ? 'glow' : k] = '#' + k; // placeholder replaced below
  }
}
const palOut = { top: new THREE.Color(), hor: new THREE.Color(), fog: new THREE.Color(), sunC: new THREE.Color(), hemiS: new THREE.Color(), hemiG: new THREE.Color(), amb: new THREE.Color(), glow: new THREE.Color() };
function blendPal(wDay, wNight) {
  const wTwi = clamp(1 - wDay - wNight, 0, 1);
  const lerpC = (k, target) => {
    _ca2.copy(_ca.set(PAL.day[k])).multiplyScalar(wDay)
      .add(_cb.set(PAL.twi[k]).multiplyScalar(wTwi))
      .add(_cb2.set(PAL.night[k]).multiplyScalar(wNight));
    target.copy(_ca2);
  };
  lerpC('top', palOut.top); lerpC('hor', palOut.hor); lerpC('fog', palOut.fog);
  lerpC('sunC', palOut.sunC); lerpC('hemiS', palOut.hemiS); lerpC('hemiG', palOut.hemiG);
  lerpC('amb', palOut.amb); lerpC('glow', palOut.glow);
  palOut.sunI = PAL.day.sunI * wDay + PAL.twi.sunI * wTwi + PAL.night.sunI * wNight;
  palOut.hemiI = PAL.day.hemiI * wDay + PAL.twi.hemiI * wTwi + PAL.night.hemiI * wNight;
  palOut.ambI = PAL.day.ambI * wDay + PAL.twi.ambI * wTwi + PAL.night.ambI * wNight;
  palOut.glowS = PAL.day.glowS * wDay + PAL.twi.glowS * wTwi + PAL.night.glowS * wNight;
}

function updateDayNight() {
  const E = (app.dayTime - 0.25) * Math.PI;                // elevation angle
  sunDir.set(Math.cos(E), Math.sin(E), 0.36).normalize();
  const sinAlt = sunDir.y;
  const wDay = smooth(0.06, 0.32, sinAlt);
  const wNight = smooth(-0.06, -0.26, sinAlt);
  blendPal(wDay, wNight);
  nightGlow = 1 - smooth(-0.1, 0.08, sinAlt);
  dayCrowd = smooth(-0.05, 0.14, sinAlt);
  dayF = wDay;

  sun.position.copy(sunDir).multiplyScalar(260);
  sun.target.position.set(0, 0, 0);
  sun.color.copy(palOut.sunC);
  sun.intensity = palOut.sunI;
  sun.castShadow = app.shadows && sinAlt > 0.03;
  moonLight.position.copy(sunDir).multiplyScalar(-260);
  moonLight.intensity = 0.14 * wNight;

  hemi.color.copy(palOut.hemiS); hemi.groundColor.copy(palOut.hemiG); hemi.intensity = palOut.hemiI;
  ambient.color.copy(palOut.amb); ambient.intensity = palOut.ambI;

  scene.fog.color.copy(palOut.fog);
  skyMat.uniforms.uTop.value.copy(palOut.top);
  skyMat.uniforms.uHorizon.value.copy(palOut.hor);
  skyMat.uniforms.uSunDir.value.copy(sunDir);
  skyMat.uniforms.uSunGlow.value.copy(palOut.glow);
  skyMat.uniforms.uGlow.value = 0.25 + palOut.glowS;
  starMat.opacity = wNight * 0.9;

  sunSprite.position.copy(sunDir).multiplyScalar(950);
  sunSprite.material.opacity = clamp(sinAlt * 4 + 0.4, 0, 1) * (1 - wNight);
  sunSprite.material.color.copy(palOut.sunC).lerp(_cb.set(0xffffff), 0.4);
  moonSprite.position.copy(sunDir).multiplyScalar(-950);
  moonSprite.material.opacity = wNight;

  renderer.toneMappingExposure = lerp(0.88, 1.08, wDay);

  // window / lamp glow
  MAT.win.emissiveIntensity = nightGlow * 1.9;
  MAT.lamp.emissiveIntensity = 0.15 + nightGlow * 2.2;
  for (const L of city.nightLights) L.light.intensity = L.base * nightGlow;

  // water + clouds tint
  waterMat.uniforms.uSunDir.value.copy(sunDir.y > 0 ? sunDir : _bv.set(0, 1, 0));
  waterMat.uniforms.uSunColor.value.copy(palOut.sunC).multiplyScalar(clamp(palOut.sunI, 0, 1.2));
  waterMat.uniforms.uSkyColor.value.copy(palOut.hor);
  waterMat.uniforms.uFogColor.value.copy(palOut.fog);
  for (const c of cloudGroup.children) {
    c.material.color.copy(palOut.hor).lerp(_cb.set(0xffffff), 0.5 * wDay + 0.2);
    c.material.opacity = 0.16 + 0.36 * wDay;
  }
}

/* ============================================================
   10.  Assembly / disposal of the city
   ============================================================ */

function disposeCity() {
  if (!city.group) return;
  city.group.traverse((o) => { if (o.isMesh || o.isPoints || o.isLine) o.geometry && city.disposables.push(o.geometry); });
  city.group.traverse((o) => {
    if ((o.isMesh || o.isSprite) && o.material && !Object.values(MAT).includes(o.material) && !Array.isArray(o.material)) {
      // materials created per-build (signs, sails, awnings…) already tracked
    }
  });
  for (const d of city.disposables) { if (d.dispose) d.dispose(); }
  scene.remove(city.group);
  city.disposables = [];
  Object.assign(city, {
    group: null, wallPts: [], gates: [], streets: [], segs: [], clearZones: [], plots: [],
    smokes: [], lanterns: [], fireflies: [], flags: [], signs: [], guards: [], birds: [],
    mill: null, bunting: [], trees: 0, souls: 0, buildings: 0, nightLights: [],
    graph: null, citizens: null, guardAnchors: null, hamletNode: null, fields: [],
  });
  smokeSys = null; glowSys = null; flySys = null;
}

function buildCity(seedStr) {
  disposeCity();
  app.seed = seedStr;
  R = mulberry32(strSeed(seedStr));

  city.group = new THREE.Group();
  scene.add(city.group);
  buckets = new Map([
    ['plaster', []], ['timber', []], ['stone', []], ['roof', []], ['wood', []], ['thatch', []],
    ['win', []], ['lamp', []], ['port', []], ['pennant', []], ['dirtRoad', []], ['cobble', []],
    ['grassOut', []], ['grassIn', []],
  ]);

  // plan
  city.millGate = ri(0, 3);
  buildWalls();
  buildStreets();
  city.clearZones.push({ x: 0, z: 0, r: 19 });                         // plaza
  // church between gates 0 and 1
  const gA = city.wallPts[city.gateIdx[0]].a, gB = city.wallPts[city.gateIdx[1]].a;
  let chA = (gA + gB) / 2;
  if (Math.abs(gB - gA) > Math.PI) chA = gA + TAU - Math.abs(gB - gA) / 2;
  const chX = Math.cos(chA) * 33, chZ = Math.sin(chA) * 33;
  city.clearZones.push({ x: chX, z: chZ, r: 17 });
  // keep opposite the church
  const kpA = chA + Math.PI + rr(-0.4, 0.4);
  const kpX = Math.cos(kpA) * 76, kpZ = Math.sin(kp) * 0 || Math.sin(kpA) * 76;
  city.clearZones.push({ x: kpX, z: kpZ, r: 24 });

  placePlots();

  // raise
  buildGround();
  for (const p of city.plots) makeHouse(p);
  buildChurch(chX, chZ, chA + Math.PI / 2);
  buildKeep(kpX, kpZ);
  buildMarket();
  buildLanterns();
  buildFields();
  buildWindmill();
  buildHamlet();
  buildTrees();

  // night point-lights (few, pooled)
  const pool = city.nightLights.slice(0, 6);
  city.nightLights = [];
  for (const L of pool) {
    const pl = new THREE.PointLight(L.color, 0, L.dist, 2);
    pl.position.set(L.x, L.y, L.z);
    city.group.add(pl);
    city.nightLights.push({ light: pl, base: L.base });
  }

  // merge static buckets
  for (const [key, arr] of buckets) {
    if (!arr.length) continue;
    const merged = mergeGeometries(arr, false);
    const mesh = new THREE.Mesh(merged, MAT[key]);
    mesh.castShadow = key !== 'dirtRoad' && key !== 'cobble' && key !== 'grassOut' && key !== 'grassIn' && key !== 'port';
    mesh.receiveShadow = true;
    city.group.add(mesh);
    city.disposables.push(merged);
    arr.length = 0;
  }

  // living things
  buildGraph();
  buildCitizens();
  buildGuards();
  buildBirds();
  buildSmoke();
  buildGlows();
  buildFireflies();

  document.getElementById('stats').innerHTML =
    `${city.buildings} buildings &middot; ${city.trees} trees &middot; ${city.souls} souls &middot; seed <b>${app.seed}</b>`;

  try { history.replaceState(null, '', '#s=' + encodeURIComponent(app.seed)); } catch (e) { /* file:// may refuse */ }
}

/* ============================================================
   11.  Bells & wind (WebAudio, off by default)
   ============================================================ */

let AC = null, master = null;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = 0.6;
  master.connect(AC.destination);
  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const dd = buf.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const wg = AC.createGain(); wg.gain.value = 0.05;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.08;
  const lg = AC.createGain(); lg.gain.value = 0.028;
  lfo.connect(lg).connect(wg.gain);
  src.connect(lp).connect(wg).connect(master);
  src.start(); lfo.start();
}
function bell(base) {
  if (!AC || !app.sound) return;
  const t = AC.currentTime;
  [1, 2.0, 2.92].forEach((m, i) => {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = base * m * rr(0.995, 1.005);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.35 / (i + 1), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2 - i * 0.6);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 3.4);
  });
}

/* ============================================================
   12.  UI wiring
   ============================================================ */

const $ = (id) => document.getElementById(id);
const seedInput = $('seed'), slider = $('timeSlider'), clockEl = $('clock');

function currentSeed() {
  const m = location.hash.match(/s=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : String(1000 + Math.floor(Math.random() * 9000));
}
seedInput.value = currentSeed();
$('rebuild').addEventListener('click', () => {
  const v = seedInput.value.trim() || String(Math.floor(Math.random() * 9999));
  seedInput.value = v;
  buildCity(v);
});
seedInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('rebuild').click(); });

slider.value = app.dayTime;
slider.addEventListener('input', () => { app.dayTime = parseFloat(slider.value); });
$('pauseTime').addEventListener('change', (e) => { app.paused = e.target.checked; });
$('speedSel').addEventListener('change', (e) => { app.timeSpeed = parseFloat(e.target.value); });
$('sunsetBtn').addEventListener('click', () => { app.dayTime = 0.767; slider.value = app.dayTime; });
$('orbitChk').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('shadowChk').addEventListener('change', (e) => { app.shadows = e.target.checked; });
$('soundChk').addEventListener('change', (e) => {
  app.sound = e.target.checked;
  if (app.sound) { initAudio(); AC.resume && AC.resume(); }
});
renderer.domElement.addEventListener('pointerdown', () => {
  if (controls.autoRotate) { controls.autoRotate = false; $('orbitChk').checked = false; }
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   13.  Main loop
   ============================================================ */

const clock = new THREE.Clock();
let simTime = 0, lastHour = -1;
const camFrom = new THREE.Vector3(340, 260, 340);
const camTo = new THREE.Vector3(132, 82, 132);
app.intro = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  // time of day
  if (!app.paused) {
    app.dayTime = (app.dayTime + (dt * app.timeSpeed) / app.cycle) % 1;
    slider.value = app.dayTime;
  }
  const hh = Math.floor(app.dayTime * 24);
  const mm = Math.floor((app.dayTime * 24 - hh) * 60);
  clockEl.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  if (hh !== lastHour) {
    lastHour = hh;
    if (app.sound && hh >= 6 && hh <= 21) {
      const tolls = hh % 12 === 0 ? 3 : hh % 6 === 0 ? 2 : 1;
      for (let i = 0; i < tolls; i++) setTimeout(() => bell(hh >= 12 ? 392 : 440), i * 1500);
    }
  }

  // intro camera glide
  if (app.intro < 1) {
    app.intro = Math.min(1, app.intro + dt / 4.2);
    const t = app.intro < 0.5 ? 4 * app.intro ** 3 : 1 - (-2 * app.intro + 2) ** 3 / 2;
    camera.position.lerpVectors(camFrom, camTo, t);
    controls.autoRotateSpeed = 0.45 * t;
  }

  updateDayNight();
  if (city.citizens) updateCitizens(dt, simTime, dayCrowd, nightGlow);
  if (city.guards.length) updateGuards(dt, simTime);
  if (city.birds.length) updateBirds(dt, simTime);
  updateSmoke(simTime, dayF);
  updateGlows(simTime, nightGlow);
  updateFireflies(simTime, nightGlow);
  waterMat.uniforms.uTime.value = simTime;

  // flags in the wind
  for (const f of city.flags) {
    const p = f.mesh.geometry.attributes.position;
    const base = f.base;
    for (let i = 0; i < p.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      const k = (x / (1.9 * f.size) + 0.5);
      p.setZ(i, Math.sin(x * 2.6 - simTime * 7 + f.phase + y * 1.4) * 0.17 * k * f.size
        + Math.sin(y * 4 + simTime * 9) * 0.03 * k);
    }
    p.needsUpdate = true;
    f.mesh.rotation.y += Math.sin(simTime * 0.5 + f.phase) * 0.0008;
  }
  // hanging signs
  for (const s of city.signs) s.pivot.rotation.x = Math.sin(simTime * 1.4 + s.phase) * 0.13;
  // windmill
  if (city.mill) {
    city.mill.gust += dt * 0.3;
    city.mill.spin.rotation.z += dt * city.mill.speed * (0.7 + 0.5 * Math.sin(city.mill.gust));
  }
  // clouds drift
  for (const c of cloudGroup.children) {
    const u = c.userData;
    u.a += u.speed * dt * 4;
    c.position.set(Math.cos(u.a) * u.r, u.h, Math.sin(u.a) * u.r);
  }

  controls.update();
  // keep the pivot near town
  controls.target.x = clamp(controls.target.x, -160, 160);
  controls.target.z = clamp(controls.target.z, -160, 160);
  controls.target.y = clamp(controls.target.y, 1, 80);

  renderer.render(scene, camera);
}

/* ============================================================
   14.  Boot
   ============================================================ */

function boot() {
  const msg = $('loadMsg');
  msg.textContent = 'Raising the town…';
  setTimeout(() => {
    try {
      buildCity(seedInput.value);
      animate();
      setTimeout(() => $('loader').classList.add('hidden'), 350);
    } catch (err) {
      msg.innerHTML = 'The masons failed:<br><span style="color:#e88">' + (err && err.message ? err.message : err) + '</span>';
      console.error(err);
    }
  }, 60);
}
window.addEventListener('error', (e) => {
  const lm = $('loadMsg');
  if (lm && !$('loader').classList.contains('hidden') && e.message) {
    lm.innerHTML = 'Could not load (Three.js CDN reachable?):<br><span style="color:#e88">' + e.message + '</span>';
  }
});
boot();
</script>
