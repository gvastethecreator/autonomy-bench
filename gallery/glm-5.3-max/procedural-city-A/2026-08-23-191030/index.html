<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nightgrid — Procedural City at Night</title>
<style>
  :root{ --ink: rgba(214,232,255,.82); --dim: rgba(160,190,230,.5); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060c}
  body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:var(--ink)}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;pointer-events:none;z-index:5}
  .hud.top{top:0}
  .hud.bottom{bottom:0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .brand{font-size:13px;font-weight:700;letter-spacing:.42em;color:#dff0ff;text-shadow:0 0 18px rgba(90,180,255,.35)}
  .brand .sq{display:inline-block;width:8px;height:8px;margin-right:10px;background:#61d6ff;box-shadow:0 0 12px #61d6ff;animation:pulse 2.4s infinite}
  .brand .sub{font-weight:400;letter-spacing:.24em;color:var(--dim);margin-left:14px;font-size:10px}
  #regen{pointer-events:auto;cursor:pointer;font:inherit;font-size:10px;letter-spacing:.22em;color:#bfe6ff;background:rgba(8,18,38,.55);border:1px solid rgba(110,190,255,.35);padding:9px 16px;transition:all .18s ease}
  #regen:hover{background:rgba(20,50,90,.7);border-color:rgba(140,220,255,.8);box-shadow:0 0 22px rgba(60,150,255,.25)}
  .hint b{color:#9fd8ff}
  #stats{color:var(--dim)}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2,4,12,.55) 100%)}
  #boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#04060c;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);transition:opacity .6s ease;text-align:center;padding:0 24px}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .dot{width:10px;height:10px;border-radius:50%;background:#61d6ff;box-shadow:0 0 20px #61d6ff;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div class="hud top">
  <div class="brand"><span class="sq"></span>NIGHTGRID<span class="sub">procedural city · after hours</span></div>
  <button id="regen" title="Generate a new city (R)">NEW CITY</button>
</div>
<div class="hud bottom">
  <div class="hint">drag&nbsp;orbit&nbsp;&nbsp;&middot;&nbsp;&nbsp;scroll&nbsp;zoom&nbsp;&nbsp;&middot;&nbsp;&nbsp;<b>R</b>&nbsp;new&nbsp;city</div>
  <div id="stats">—</div>
</div>
<div id="boot"><div class="dot"></div><div>assembling the grid</div></div>

<script>
  window.__cityBooted = false;
  window.addEventListener('load', function () {
    if (!window.__cityBooted) {
      var b = document.getElementById('boot');
      b.innerHTML = '<div>could not load three.js from the cdn — check the connection and reload</div>';
    }
  });
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ */
/* city constants                                                      */
/* ------------------------------------------------------------------ */
const GRID  = 12;                // blocks per side
const BLOCK = 26;                // block (plot) size
const ROAD  = 10;                // road width
const PITCH = BLOCK + ROAD;      // 36
const SPAN  = GRID * PITCH;      // 432
const HALF  = SPAN / 2;          // 216
const RW2   = ROAD / 2;          // 5
const C0    = -HALF + RW2;       // first road center coordinate
const LAMP_X = Math.PI * 2 / 0.26; // lamp spacing, matches ground shader bumps

const ROADS = [];
for (let k = 0; k <= GRID; k++) ROADS.push(C0 + k * PITCH);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------ */
/* renderer / scene / camera                                           */
/* ------------------------------------------------------------------ */
const app = document.getElementById('app');
const boot = document.getElementById('boot');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  boot.innerHTML = '<div>webgl is not available in this browser</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 4000);
const CAM_A = new THREE.Vector3(360, 300, 540);
const CAM_B = new THREE.Vector3(168, 96, 238);
camera.position.copy(CAM_A);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 22, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 30;
controls.maxDistance = 1200;
controls.maxPolarAngle = 1.54;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.35;

/* shared uniforms */
const U = {
  uTime:    { value: 0 },
  uFogColor:{ value: new THREE.Color(0x0b0e1c) },
  uFogD:    { value: 0.0016 },
  uPITCH:   { value: PITCH },
  uROAD:    { value: ROAD },
  uHALF:    { value: HALF },
  uC0:      { value: C0 }
};

/* ------------------------------------------------------------------ */
/* sky dome                                                            */
/* ------------------------------------------------------------------ */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1600, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: /* glsl */`
      varying vec3 vD;
      void main(){
        vD = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vD;
      void main(){
        float h = normalize(vD).y;
        vec3 top = vec3(0.006, 0.008, 0.020);
        vec3 mid = vec3(0.018, 0.028, 0.062);
        vec3 hor = vec3(0.052, 0.058, 0.100);
        vec3 col = mix(mid, top, smoothstep(0.06, 0.55, h));
        col = mix(hor, col, smoothstep(-0.03, 0.18, h));
        col += vec3(0.100, 0.055, 0.026) * exp(-abs(h) * 5.0); // light pollution
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
sky.renderOrder = -5;
scene.add(sky);

/* ------------------------------------------------------------------ */
/* generic glowing points factory                                      */
/* ------------------------------------------------------------------ */
function makeGlowPoints(list, mode, maxSize) {
  const n = list.length;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const siz = new Float32Array(n);
  const pha = new Float32Array(n);
  list.forEach((p, i) => {
    pos.set(p.p, i * 3);
    col.set(p.c, i * 3);
    siz[i] = p.s;
    pha[i] = p.ph !== undefined ? p.ph : Math.random() * 10;
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(pha, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uMode: { value: mode }, uMax: { value: maxSize } },
    vertexShader: /* glsl */`
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aPhase;
      uniform float uTime;
      uniform float uMode;
      uniform float uMax;
      varying vec3 vC;
      varying float vA;
      void main(){
        vC = aColor;
        float tw = 1.0;
        if (uMode > 1.5) {
          tw = fract(uTime * 0.7 + aPhase) < 0.12 ? 1.0 : 0.0;   // beacon blink
        } else if (uMode > 0.5) {
          tw = 0.7 + 0.3 * sin(uTime * (0.6 + fract(aPhase) * 1.7) + aPhase * 50.0); // twinkle
        } else {
          tw = 0.94 + 0.06 * sin(uTime * 3.0 + aPhase * 20.0);   // near steady
        }
        vA = tw;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(aSize * (300.0 / -mv.z), 1.0, uMax);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vC;
      varying float vA;
      void main(){
        float r = length(gl_PointCoord - 0.5);
        float a = pow(smoothstep(0.5, 0.0, r), 1.8);
        if (a < 0.01) discard;
        gl_FragColor = vec4(vC * vA, a);
      }`
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  return pts;
}

/* ------------------------------------------------------------------ */
/* stars                                                               */
/* ------------------------------------------------------------------ */
{
  const stars = [];
  for (let i = 0; i < 1300; i++) {
    const t = Math.random() * Math.PI * 2;
    const y = 0.06 + Math.random() * 0.94;
    const r = Math.sqrt(1 - y * y);
    const big = Math.random() < 0.06;
    stars.push({
      p: [Math.cos(t) * r * 1200, y * 1200, Math.sin(t) * r * 1200],
      c: Math.random() < 0.12 ? [1, 0.85, 0.65] : [0.75 + Math.random() * 0.25, 0.85, 1.0],
      s: big ? 18 + Math.random() * 8 : 5 + Math.random() * 7
    });
  }
  const starPts = makeGlowPoints(stars, 1, 4);
  starPts.renderOrder = -4;
  scene.add(starPts);
}

/* ------------------------------------------------------------------ */
/* moon                                                                */
/* ------------------------------------------------------------------ */
function radialTexture(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
{
  const moonTex = radialTexture(256, [
    [0.00, 'rgba(255,250,238,1)'],
    [0.15, 'rgba(255,250,238,0.95)'],
    [0.21, 'rgba(205,220,255,0.35)'],
    [0.45, 'rgba(150,180,255,0.12)'],
    [1.00, 'rgba(130,160,255,0)']
  ]);
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({
    map: moonTex, color: 0xfff4e0, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  moon.position.set(-620, 430, -980);
  moon.scale.set(150, 150, 1);
  scene.add(moon);
}

/* ------------------------------------------------------------------ */
/* clouds                                                              */
/* ------------------------------------------------------------------ */
const clouds = [];
{
  const tex = radialTexture(256, [
    [0.00, 'rgba(255,255,255,0.16)'],
    [0.45, 'rgba(255,255,255,0.09)'],
    [1.00, 'rgba(255,255,255,0)']
  ]);
  for (let i = 0; i < 8; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: 0x9db4e8, transparent: true,
      opacity: 0.08 + Math.random() * 0.1, depthWrite: false
    }));
    const w = 200 + Math.random() * 260;
    sp.scale.set(w, w * (0.32 + Math.random() * 0.2), 1);
    sp.position.set((Math.random() * 2 - 1) * 650, 240 + Math.random() * 100, (Math.random() * 2 - 1) * 650);
    sp.userData.speed = 2 + Math.random() * 4;
    clouds.push(sp);
    scene.add(sp);
  }
}

/* ------------------------------------------------------------------ */
/* ground                                                              */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2600, 2600),
  new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uFogColor: U.uFogColor, uFogD: U.uFogD,
      uPITCH: U.uPITCH, uROAD: U.uROAD, uHALF: U.uHALF, uC0: U.uC0
    },
    vertexShader: /* glsl */`
      varying vec3 vW;
      varying float vDepth;
      void main(){
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        vec4 mv = viewMatrix * w;
        vDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform vec3 uFogColor;
      uniform float uFogD;
      uniform float uPITCH;
      uniform float uROAD;
      uniform float uHALF;
      uniform float uC0;
      varying vec3 vW;
      varying float vDepth;
      float h21(vec2 p){
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      void main(){
        vec2 q = vW.xz;
        float dx = abs(mod(q.x - uC0 + uPITCH * 0.5, uPITCH) - uPITCH * 0.5);
        float dz = abs(mod(q.y - uC0 + uPITCH * 0.5, uPITCH) - uPITCH * 0.5);
        float rw = uROAD * 0.5;
        float cityMask = 1.0 - smoothstep(uHALF + rw, uHALF + rw + 4.0, max(abs(q.x), abs(q.y)));
        float roadX = (1.0 - smoothstep(rw - 0.4, rw, dz)) * cityMask; // road running along X
        float roadZ = (1.0 - smoothstep(rw - 0.4, rw, dx)) * cityMask; // road running along Z
        float road = max(roadX, roadZ);
        float sideBand = (1.0 - smoothstep(rw + 1.4, rw + 2.4, min(dx, dz))) * (1.0 - road) * cityMask;
        float g = h21(floor(q * 0.5));
        vec3 block = mix(vec3(0.020, 0.022, 0.030), vec3(0.030, 0.028, 0.034), h21(floor((q - uC0) / uPITCH)));
        vec3 col = block * (0.85 + 0.3 * g);
        col = mix(col, vec3(0.052, 0.054, 0.062) * (0.9 + 0.2 * g), sideBand);
        col = mix(col, vec3(0.040, 0.042, 0.050) * (0.85 + 0.3 * g), road);
        // dashed center lines
        float dash1 = (1.0 - smoothstep(0.10, 0.18, abs(dz))) * step(fract(q.x / 7.0), 0.45) * roadX;
        float dash2 = (1.0 - smoothstep(0.10, 0.18, abs(dx))) * step(fract(q.y / 7.0), 0.45) * roadZ;
        col = mix(col, vec3(0.55, 0.45, 0.18), max(dash1, dash2) * 0.55);
        // warm lamp pools along the curbs
        float bump1 = 0.5 + 0.5 * cos(q.x * 0.26);
        float bump2 = 0.5 + 0.5 * cos(q.y * 0.26);
        float pool = exp(-abs(dz - (rw + 1.0)) * 1.5) * bump1 + exp(-abs(dx - (rw + 1.0)) * 1.5) * bump2;
        float flick = 0.9 + 0.1 * sin(uTime * 2.0 + (q.x + q.y) * 0.35);
        col += vec3(1.0, 0.72, 0.38) * pool * 0.10 * flick * cityMask;
        float fogF = 1.0 - exp(-uFogD * uFogD * vDepth * vDepth);
        col = mix(col, uFogColor, fogF);
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ------------------------------------------------------------------ */
/* street lamps (static, aligned with the ground pools)                */
/* ------------------------------------------------------------------ */
{
  const lamps = [];
  const warm = [1.0, 0.72, 0.42];
  const cool = [0.60, 0.75, 1.0];
  for (const line of ROADS) {
    for (let x = Math.ceil(-HALF / LAMP_X) * LAMP_X; x <= HALF; x += LAMP_X) {
      const c = Math.random() < 0.2 ? cool : warm;
      lamps.push({ p: [x, 7.2, line + RW2 + 1.0], c, s: 26 });
      lamps.push({ p: [x, 7.2, line - RW2 - 1.0], c, s: 26 });
    }
    for (let z = Math.ceil(-HALF / LAMP_X) * LAMP_X; z <= HALF; z += LAMP_X) {
      const c = Math.random() < 0.2 ? cool : warm;
      lamps.push({ p: [line + RW2 + 1.0, 7.2, z], c, s: 26 });
      lamps.push({ p: [line - RW2 - 1.0, 7.2, z], c, s: 26 });
    }
  }
  scene.add(makeGlowPoints(lamps, 0, 42));
}

/* ------------------------------------------------------------------ */
/* building material                                                   */
/* ------------------------------------------------------------------ */
const BUILDING_VERT = /* glsl */`
  attribute float aSeed;
  varying vec3 vPos;
  varying vec3 vDim;
  varying vec3 vN;
  varying float vSeed;
  varying float vDepth;
  void main(){
    vec3 sc = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
    vDim = sc;
    vPos = position * sc;
    vN = normal;
    vSeed = aSeed;
    vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;

const BUILDING_FRAG = /* glsl */`
  uniform float uTime;
  uniform vec3 uFogColor;
  uniform float uFogD;
  varying vec3 vPos;
  varying vec3 vDim;
  varying vec3 vN;
  varying float vSeed;
  varying float vDepth;
  float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
  float h21(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  float h31(vec3 p3){
    p3 = fract(p3 * 0.1031);
    p3 += dot(p3, p3.zyx + 31.32);
    return fract((p3.x + p3.y) * p3.z);
  }
  void main(){
    vec3 n = normalize(vN);
    float tr = h11(vSeed * 0.731 + 2.0);
    vec3 facade = mix(vec3(0.030, 0.036, 0.058), vec3(0.052, 0.046, 0.062), tr);
    vec3 col;
    if (abs(n.y) > 0.5) {
      col = facade * 0.55;
      float rl = step(0.9, h11(vSeed + 17.0));
      col += vec3(0.55, 0.5, 0.35) * rl * 0.5;
    } else {
      float u = abs(n.x) > 0.5 ? vPos.z : vPos.x;
      float span = abs(n.x) > 0.5 ? vDim.z : vDim.x;
      float faceId = abs(n.x) > 0.5 ? (n.x > 0.0 ? 1.0 : 2.0) : (n.z > 0.0 ? 3.0 : 4.0);
      float worldY = vPos.y + vDim.y * 0.5;
      float floorH = 3.1 + 0.7 * h11(vSeed + 5.0);
      float winW = 2.3 + 0.6 * h11(vSeed + 9.0);
      float fx = (u + span * 0.5) / winW;
      float fy = worldY / floorH;
      vec2 cid = vec2(floor(fx), floor(fy));
      vec2 f = vec2(fract(fx), fract(fy));
      bool inWin = (f.x > 0.16 && f.x < 0.84 && f.y > 0.28 && f.y < 0.76);
      float parapet = step(worldY, vDim.y - 1.6) * step(0.8, worldY);
      float rState = h31(vec3(cid, vSeed + faceId * 77.0));
      float rCol   = h31(vec3(cid + 7.31, vSeed + faceId * 13.0));
      float rPhase = h31(vec3(cid + 3.7, vSeed + faceId * 29.0));
      float rFlick = h31(vec3(cid + 11.1, vSeed));
      float tick = floor(uTime * 0.11 + rPhase * 37.0);
      float rOn = h31(vec3(cid * 1.37 + tick * 3.1, vSeed + faceId * 3.0));
      float litFrac = 0.18 + 0.5 * h11(vSeed + 3.0);
      bool isLit = rOn < litFrac;
      bool ground = worldY < floorH * 1.15;
      vec3 base = facade * (0.75 + 0.5 * clamp(worldY / 130.0, 0.0, 1.0));
      col = base;
      if (inWin && parapet > 0.5) {
        if (ground) {
          vec3 sc;
          if (rCol < 0.4)      sc = vec3(1.0, 0.72, 0.40);
          else if (rCol < 0.6) sc = vec3(0.35, 0.85, 1.00);
          else if (rCol < 0.8) sc = vec3(1.0, 0.35, 0.55);
          else                 sc = vec3(0.95, 0.90, 0.80);
          float b = 0.8 + 0.7 * rState;
          col = base * 0.4 + sc * b * 0.9;
        } else if (isLit) {
          vec3 warm  = vec3(1.00, 0.72, 0.42);
          vec3 white = vec3(0.95, 0.92, 0.85);
          vec3 cool  = vec3(0.62, 0.78, 1.00);
          vec3 amber = vec3(1.00, 0.50, 0.22);
          vec3 wc = rCol < 0.5 ? warm : (rCol < 0.75 ? white : (rCol < 0.92 ? cool : amber));
          float b = 0.30 + 0.85 * rState;
          if (rFlick > 0.9) {
            b *= 0.4 + 0.6 * h21(vec2(floor(uTime * 13.0), rPhase * 997.0));
            wc = mix(wc, vec3(0.45, 0.65, 1.0), 0.55);
          }
          col = base * 0.35 + wc * b;
        } else {
          col = vec3(0.015, 0.022, 0.045) + facade * 0.25;
        }
      }
    }
    float fogF = 1.0 - exp(-uFogD * uFogD * vDepth * vDepth);
    col = mix(col, uFogColor, fogF);
    gl_FragColor = vec4(col, 1.0);
  }`;

/* neon sign material */
const SIGN_VERT = /* glsl */`
  attribute vec3 aC;
  attribute float aSeed;
  varying vec2 vUv;
  varying vec3 vC;
  varying float vSeed;
  varying float vDepth;
  void main(){
    vUv = uv;
    vC = aC;
    vSeed = aSeed;
    vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;

const SIGN_FRAG = /* glsl */`
  uniform float uTime;
  uniform vec3 uFogColor;
  uniform float uFogD;
  varying vec2 vUv;
  varying vec3 vC;
  varying float vSeed;
  varying float vDepth;
  float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
  void main(){
    float style = h11(vSeed + 4.0);
    float t = uTime;
    float drop = step(0.05, h11(floor(t * 2.0) * 0.37 + vSeed * 0.11));
    float bars;
    if (style < 0.55) {
      float nb = 3.0 + floor(h11(vSeed + 8.0) * 5.0);
      float sp = floor(t * (0.4 + h11(vSeed + 2.0) * 1.2));
      bars = step(0.42, fract(vUv.y * nb + vSeed + sp * 0.13));
    } else {
      bars = 0.8 + 0.2 * h11(floor(vUv.x * 8.0) + vSeed);
    }
    float frame = step(0.05, vUv.x) * step(vUv.x, 0.95) * step(0.12, vUv.y) * step(vUv.y, 0.88);
    float a = drop * frame;
    vec3 col = vC * (0.25 + 1.15 * bars) * a;
    float fogF = 1.0 - exp(-uFogD * uFogD * vDepth * vDepth);
    col = mix(col, uFogColor * 0.9, fogF);
    gl_FragColor = vec4(col, 1.0);
  }`;

/* ------------------------------------------------------------------ */
/* procedural city build                                               */
/* ------------------------------------------------------------------ */
const NEON = [
  [1.0, 0.15, 0.55],
  [0.15, 0.85, 1.0],
  [1.0, 0.55, 0.12],
  [0.35, 1.0, 0.5],
  [0.8, 0.3, 1.0],
  [1.0, 0.85, 0.3]
];

let cityGroup = null;
let carPts = null;
let cars = [];
let currentStats = { buildings: 0, cars: 0, seed: 0 };

function disposeCity() {
  if (!cityGroup) return;
  cityGroup.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  scene.remove(cityGroup);
  cityGroup = null;
  carPts = null;
  cars = [];
}

function buildCity(seed) {
  disposeCity();
  const rnd = mulberry32(seed);
  const group = new THREE.Group();

  const buildings = [];
  const signs = [];
  const beacons = [];

  for (let i = 0; i < GRID; i++) {
    for (let j = 0; j < GRID; j++) {
      const x0 = -HALF + ROAD + i * PITCH;
      const z0 = -HALF + ROAD + j * PITCH;
      const bcx = x0 + BLOCK / 2;
      const bcz = z0 + BLOCK / 2;
      if (rnd() < 0.045) continue; // plaza
      const dn = Math.hypot(bcx, bcz) / (HALF * 1.05);
      const core = Math.pow(Math.max(0, 1 - dn), 2.1);
      const pat = rnd();

      const put = (cx, cz, maxW, maxD, boost) => {
        const w = Math.max(6, maxW - 1 - rnd() * 3);
        const d = Math.max(6, maxD - 1 - rnd() * 3);
        let h = 5 + rnd() * 9 + core * (35 + rnd() * 135) * boost;
        if (rnd() < 0.05) h *= 1.6;
        h = Math.min(h, 235);
        buildings.push({ x: cx, z: cz, w, d, h, seed: Math.floor(rnd() * 10000) });
        if (h > 85) beacons.push({ p: [cx, h + 2, cz], c: [1.0, 0.12, 0.10], s: 20 });
        if (h > 30 && dn < 0.8 && rnd() < 0.4) {
          signs.push({
            x: cx, z: cz, w, d, y: h * (0.45 + rnd() * 0.4),
            sw: Math.min(w * 0.75, 4 + rnd() * 10),
            sh: 1.8 + rnd() * 3.2,
            face: Math.floor(rnd() * 4),
            c: NEON[Math.floor(rnd() * NEON.length)],
            seed: rnd() * 100
          });
        }
      };

      if (pat < 0.3) {
        put(bcx, bcz, BLOCK, BLOCK, 1.15);
      } else if (pat < 0.72) {
        if (rnd() < 0.5) {
          put(x0 + BLOCK * 0.25, bcz, BLOCK * 0.5, BLOCK, 1.0);
          put(x0 + BLOCK * 0.75, bcz, BLOCK * 0.5, BLOCK, 1.0);
        } else {
          put(bcx, z0 + BLOCK * 0.25, BLOCK, BLOCK * 0.5, 1.0);
          put(bcx, z0 + BLOCK * 0.75, BLOCK, BLOCK * 0.5, 1.0);
        }
      } else {
        for (const [sx, sz] of [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]]) {
          if (rnd() < 0.85) put(x0 + BLOCK * sx, z0 + BLOCK * sz, BLOCK * 0.5, BLOCK * 0.5, 0.85);
        }
      }
    }
  }

  /* buildings */
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const seeds = new Float32Array(buildings.length);
  const bMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uFogColor: U.uFogColor, uFogD: U.uFogD },
    vertexShader: BUILDING_VERT,
    fragmentShader: BUILDING_FRAG
  });
  const bMesh = new THREE.InstancedMesh(boxGeo, bMat, buildings.length);
  const M = new THREE.Matrix4();
  const Q0 = new THREE.Quaternion();
  const P = new THREE.Vector3();
  const S = new THREE.Vector3();
  buildings.forEach((b, i) => {
    P.set(b.x, b.h / 2, b.z);
    S.set(b.w, b.h, b.d);
    M.compose(P, Q0, S);
    bMesh.setMatrixAt(i, M);
    seeds[i] = b.seed;
  });
  boxGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
  bMesh.frustumCulled = false;
  group.add(bMesh);

  /* neon signs */
  if (signs.length) {
    const plGeo = new THREE.PlaneGeometry(1, 1);
    const sMat = new THREE.ShaderMaterial({
      uniforms: { uTime: U.uTime, uFogColor: U.uFogColor, uFogD: U.uFogD },
      vertexShader: SIGN_VERT,
      fragmentShader: SIGN_FRAG
    });
    const sMesh = new THREE.InstancedMesh(plGeo, sMat, signs.length);
    const sCol = new Float32Array(signs.length * 3);
    const sSeed = new Float32Array(signs.length);
    const QS = new THREE.Quaternion();
    const rotY = a => QS.setFromAxisAngle(new THREE.Vector3(0, 1, 0), a);
    signs.forEach((s, i) => {
      let px, pz;
      if (s.face === 0) { rotY(Math.PI / 2); px = s.x + s.w / 2 + 0.35; pz = s.z; }
      else if (s.face === 1) { rotY(-Math.PI / 2); px = s.x - s.w / 2 - 0.35; pz = s.z; }
      else if (s.face === 2) { rotY(0); px = s.x; pz = s.z + s.d / 2 + 0.35; }
      else { rotY(Math.PI); px = s.x; pz = s.z - s.d / 2 - 0.35; }
      P.set(px, s.y, pz);
      S.set(s.sw, s.sh, 1);
      M.compose(P, QS, S);
      sMesh.setMatrixAt(i, M);
      sCol.set(s.c, i * 3);
      sSeed[i] = s.seed;
    });
    plGeo.setAttribute('aC', new THREE.InstancedBufferAttribute(sCol, 3));
    plGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(sSeed, 1));
    sMesh.frustumCulled = false;
    group.add(sMesh);
  }

  /* rooftop beacons */
  if (beacons.length) group.add(makeGlowPoints(beacons, 2, 40));

  /* traffic */
  const NCARS = 160;
  const cList = [];
  cars = [];
  for (let i = 0; i < NCARS; i++) {
    const axis = rnd() < 0.5 ? 0 : 1;
    const line = ROADS[Math.floor(rnd() * ROADS.length)];
    const dir = rnd() < 0.5 ? 1 : -1;
    const car = {
      axis, line, dir,
      speed: 9 + rnd() * 15,
      s: -HALF + rnd() * SPAN,
      big: rnd() < 0.06
    };
    cars.push(car);
    const taxi = rnd() < 0.1;
    const headC = taxi ? [1.0, 0.85, 0.35] : (rnd() < 0.3 ? [0.75, 0.85, 1.0] : [1.0, 0.93, 0.78]);
    cList.push({ p: [0, 1.1, 0], c: headC, s: car.big ? 32 : 24, ph: rnd() * 10 });
    cList.push({ p: [0, 1.1, 0], c: [1.0, 0.13, 0.10], s: car.big ? 20 : 14, ph: rnd() * 10 });
  }
  carPts = makeGlowPoints(cList, 0, 48);
  group.add(carPts);

  scene.add(group);
  cityGroup = group;
  currentStats = { buildings: buildings.length, cars: cars.length, seed };
  updateStats();
}

function updateStats() {
  document.getElementById('stats').textContent =
    currentStats.buildings + ' bldgs · ' +
    currentStats.cars + ' cars · seed ' +
    currentStats.seed.toString(16).toUpperCase().padStart(8, '0');
}

/* ------------------------------------------------------------------ */
/* aircraft strobes                                                    */
/* ------------------------------------------------------------------ */
const aircraft = [];
let airPts = null;
{
  const makeAircraft = () => ({
    p: new THREE.Vector3(),
    v: new THREE.Vector3(),
    reset() {
      const a = Math.random() * Math.PI * 2;
      this.v.set(Math.cos(a), 0, Math.sin(a)).multiplyScalar(26 + Math.random() * 20);
      this.p.set(-this.v.x * 28, 220 + Math.random() * 100, (Math.random() * 2 - 1) * 700);
    }
  });
  aircraft.push(makeAircraft(), makeAircraft());
  aircraft.forEach(a => a.reset());
  airPts = makeGlowPoints([
    { p: [0, 0, 0], c: [1.0, 0.15, 0.12], s: 14, ph: 1.3 },
    { p: [0, 0, 0], c: [0.9, 0.95, 1.0], s: 10, ph: 4.1 },
    { p: [0, 0, 0], c: [1.0, 0.15, 0.12], s: 14, ph: 2.9 },
    { p: [0, 0, 0], c: [0.9, 0.95, 1.0], s: 10, ph: 0.4 }
  ], 2, 26);
  scene.add(airPts);
}

/* ------------------------------------------------------------------ */
/* animation                                                           */
/* ------------------------------------------------------------------ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.65, 0.32
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let introT = 0;
let introDone = false;
let userTouched = false;
let rotateTimer = null;

controls.addEventListener('start', () => {
  userTouched = true;
  controls.autoRotate = false;
  if (rotateTimer) clearTimeout(rotateTimer);
});
controls.addEventListener('end', () => {
  if (rotateTimer) clearTimeout(rotateTimer);
  rotateTimer = setTimeout(() => { controls.autoRotate = true; }, 7000);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

function updateCars(dt) {
  if (!carPts) return;
  const pa = carPts.geometry.attributes.position.array;
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i];
    c.s += c.dir * c.speed * dt;
    if (c.s > HALF + 10) c.s = -HALF - 10;
    if (c.s < -HALF - 10) c.s = HALF + 10;
    const o = i * 6;
    if (c.axis === 0) {
      const z = c.line + 2.7 * c.dir;
      pa[o] = c.s + c.dir * 2.0; pa[o + 1] = 1.1; pa[o + 2] = z;
      pa[o + 3] = c.s - c.dir * 2.0; pa[o + 4] = 1.1; pa[o + 5] = z;
    } else {
      const x = c.line - 2.7 * c.dir;
      pa[o] = x; pa[o + 1] = 1.1; pa[o + 2] = c.s + c.dir * 2.0;
      pa[o + 3] = x; pa[o + 4] = 1.1; pa[o + 5] = c.s - c.dir * 2.0;
    }
  }
  carPts.geometry.attributes.position.needsUpdate = true;
}

function updateAircraft(dt) {
  if (!airPts) return;
  const pa = airPts.geometry.attributes.position.array;
  aircraft.forEach((a, i) => {
    a.p.addScaledVector(a.v, dt);
    if (Math.abs(a.p.x) > 1000 || Math.abs(a.p.z) > 1000) a.reset();
    const o = i * 6;
    pa[o] = a.p.x; pa[o + 1] = a.p.y; pa[o + 2] = a.p.z;
    pa[o + 3] = a.p.x + 1.5; pa[o + 4] = a.p.y + 0.5; pa[o + 5] = a.p.z;
  });
  airPts.geometry.attributes.position.needsUpdate = true;
}

function updateClouds(dt) {
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 800) c.position.x = -800;
  }
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  U.uTime.value = clock.elapsedTime;

  if (!introDone) {
    if (userTouched) {
      introDone = true;
      controls.autoRotate = true;
    } else {
      introT = Math.min(1, introT + dt / 4.5);
      const e = 1 - Math.pow(1 - introT, 3);
      camera.position.lerpVectors(CAM_A, CAM_B, e);
      if (introT >= 1) {
        introDone = true;
        controls.autoRotate = true;
      }
    }
  }

  updateCars(dt);
  updateAircraft(dt);
  updateClouds(dt);
  controls.update();
  composer.render();
}

/* ------------------------------------------------------------------ */
/* boot                                                                */
/* ------------------------------------------------------------------ */
function regen() {
  buildCity((Math.random() * 0xffffffff) >>> 0);
}

document.getElementById('regen').addEventListener('click', regen);
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') regen();
});

buildCity((Math.random() * 0xffffffff) >>> 0);
window.__cityBooted = true;
boot.classList.add('hide');
setTimeout(() => boot.remove(), 700);
animate();
</script>
</body>
