<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Infinite Maze — Autopilot</title>
<style>
  :root{
    --panel: rgba(9,13,22,.62);
    --line: rgba(148,178,255,.14);
    --ink: #e6edf9;
    --dim: #8fa0bd;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; background:#05070d; color:var(--ink);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none; cursor:default;
  }
  canvas.webgl{ position:fixed; inset:0; display:block; }

  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2,4,9,.55) 100%);
  }

  .panel{
    position:fixed; z-index:3; background:var(--panel);
    border:1px solid var(--line); border-radius:14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    pointer-events:none;
  }

  #badge{
    top:14px; left:14px; padding:8px 13px;
    display:flex; align-items:center; gap:9px;
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  }
  #badge .dot{
    width:8px; height:8px; border-radius:50%;
    background:#34d399; box-shadow:0 0 10px #34d399;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.3} }

  #stats{
    right:14px; bottom:14px; padding:12px 15px; min-width:216px;
    font-variant-numeric: tabular-nums;
  }
  #stats .row{ display:flex; justify-content:space-between; gap:20px; margin:5px 0; align-items:baseline; }
  #stats .k{ font-size:9.5px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  #stats .v{
    font-size:14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space:nowrap;
  }

  #minimapWrap{ left:14px; bottom:14px; padding:8px; }
  #minimap{ display:block; width:168px; height:168px; border-radius:8px; }

  #title{
    position:fixed; top:16%; left:0; right:0; z-index:3; text-align:center;
    pointer-events:none;
    animation: titleFade 1.6s ease 3.4s forwards;
  }
  #title h1{
    margin:0; font-weight:200; color:#f2f6ff;
    font-size: clamp(28px, 5vw, 54px);
    letter-spacing:.42em; text-indent:.42em;
    text-shadow: 0 0 30px rgba(120,160,255,.35);
  }
  #title p{
    margin:12px 0 0; font-size:12px;
    letter-spacing:.3em; text-indent:.3em; text-transform:uppercase; color:var(--dim);
  }
  @keyframes titleFade{ to{ opacity:0; transform:translateY(-14px); } }

  #loader{
    position:fixed; inset:0; z-index:10; background:#05070d;
    display:flex; flex-direction:column; gap:20px;
    align-items:center; justify-content:center;
    transition: opacity .6s ease;
  }
  #loader.done{ opacity:0; pointer-events:none; }
  .ring{
    width:44px; height:44px; border-radius:50%;
    border:2px solid rgba(140,170,255,.15); border-top-color:#8fb5ff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loader-text{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim);
  }
  #loader-text.err{
    color:#fca5a5; letter-spacing:.04em; text-transform:none;
    max-width:460px; text-align:center; line-height:1.55; padding:0 16px;
  }

  @media (max-width:640px){
    #minimap{ width:118px; height:118px; }
    #stats{ min-width:172px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>

<div id="loader">
  <div class="ring"></div>
  <div id="loader-text">Loading engine…</div>
</div>

<div id="title" aria-hidden="true">
  <h1>INFINITE MAZE</h1>
  <p>self-navigating &middot; no input required</p>
</div>

<div id="badge" class="panel"><span class="dot"></span><span>Autopilot</span></div>

<div id="stats" class="panel">
  <div class="row"><span class="k">Distance</span><span class="v" id="v-dist">0 m</span></div>
  <div class="row"><span class="k">Cells seen</span><span class="v" id="v-cells">1</span></div>
  <div class="row"><span class="k">Sector</span><span class="v" id="v-sector">0 , 0</span></div>
  <div class="row"><span class="k">Region</span><span class="v" id="v-region">—</span></div>
  <div class="row"><span class="k">Heading</span><span class="v" id="v-heading">N 0°</span></div>
  <div class="row"><span class="k">Uptime</span><span class="v" id="v-time">0:00</span></div>
  <div class="row"><span class="k">FPS</span><span class="v" id="v-fps">—</span></div>
</div>

<div id="minimapWrap" class="panel"><canvas id="minimap" width="336" height="336"></canvas></div>

<div id="vignette"></div>

<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070d;color:#e6edf9;z-index:20;text-align:center;padding:20px;">
    This experience requires JavaScript and WebGL.
  </div>
</noscript>

<script type="module">
import * as THREE from 'three';

/* ================================================================
   0. Utilities — deterministic hashing & seeded RNG
   ================================================================ */

function hash2i(a, b, salt){
  let h = 0x9e3779b9 ^ salt;
  h = Math.imul(h ^ a, 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h ^ b, 0xc2b2ae35); h ^= h >>> 16;
  h = Math.imul(h ^ 0x27d4eb2f, 0x165667b1); h ^= h >>> 15;
  return h >>> 0;
}
function hash01(a, b, salt){ return hash2i(a, b, salt) / 4294967296; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function wrapPi(a){ while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; }
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* ================================================================
   1. The infinite maze — pure, deterministic, lazily generated
   ================================================================ */

const CELL   = 4;      // world units per maze cell
const CHUNK  = 16;     // cells per chunk side
const THICK  = 0.55;   // wall thickness
const WALL_H = 3.1;    // wall height
const EYE    = 1.62;   // camera eye height

const chunkData = new Map();   // "cx,cy" -> { openE, openS }
const ckey = (cx, cy) => cx + ',' + cy;

/* Each chunk is a perfect maze (spanning tree) generated by an
   iterative depth-first carve. Chunk borders always expose at least
   one passage (plus a few random ones), so the infinite maze is
   fully connected everywhere, forever. */
function getChunkData(cx, cy){
  const k = ckey(cx, cy);
  let d = chunkData.get(k);
  if (d) return d;

  const N = CHUNK, NN = N*N;
  const openE = new Uint8Array(NN);   // edge (x,y)-(x+1,y)
  const openS = new Uint8Array(NN);   // edge (x,y)-(x,y+1)
  const seen  = new Uint8Array(NN);
  const rng = mulberry32(hash2i(cx, cy, 0xa53f9d1b));

  const stack = [0];
  seen[0] = 1;
  while (stack.length){
    const idx = stack[stack.length - 1];
    const x = idx % N, y = (idx / N) | 0;
    const opts = [];
    if (x + 1 < N && !seen[idx + 1]) opts.push([idx + 1, 0]);
    if (x - 1 >= 0 && !seen[idx - 1]) opts.push([idx - 1, 0]);
    if (y + 1 < N && !seen[idx + N]) opts.push([idx + N, 1]);
    if (y - 1 >= 0 && !seen[idx - N]) opts.push([idx - N, 1]);
    if (!opts.length){ stack.pop(); continue; }
    const [n, vert] = opts[(rng() * opts.length) | 0];
    if (vert) openS[Math.min(idx, n)] = 1; else openE[Math.min(idx, n)] = 1;
    seen[n] = 1;
    stack.push(n);
  }
  // light braiding: a few extra openings create small loops / plazas
  for (let i = 0; i < NN; i++){
    if ((i % N) !== N - 1 && rng() < 0.045) openE[i] = 1;
    if (((i / N) | 0) !== N - 1 && rng() < 0.045) openS[i] = 1;
  }

  d = { openE, openS };
  chunkData.set(k, d);
  return d;
}

/* Guaranteed-open passage per shared border + ~34% random extras. */
function borderOpenH(cx, cy, row){    // between chunk (cx,cy) and (cx+1,cy)
  if (row === (hash2i(cx, cy, 0x51ab7f) % CHUNK)) return true;
  return hash01(cx * 3 + 1, cy * 5 + row, 0x77f3) < 0.34;
}
function borderOpenV(cx, cy, col){    // between chunk (cx,cy) and (cx,cy+1)
  if (col === (hash2i(cx, cy, 0x27d4ea) % CHUNK)) return true;
  return hash01(cx + col * 7, cy * 3 + 1, 0x33c9) < 0.34;
}

/* dir: 0 = +x (E), 1 = +z (S), 2 = -x (W), 3 = -z (N) */
function canMove(x, y, dir){
  const N = CHUNK;
  const cx = Math.floor(x / N), cy = Math.floor(y / N);
  const lx = x - cx * N, ly = y - cy * N;
  const d = getChunkData(cx, cy);

  if (dir === 0){
    if (lx < N - 1) return d.openE[lx + ly * N] === 1;
    return borderOpenH(cx, cy, ly);
  }
  if (dir === 2){
    if (lx > 0) return d.openE[(lx - 1) + ly * N] === 1;
    return borderOpenH(cx - 1, cy, ly);
  }
  if (dir === 1){
    if (ly < N - 1) return d.openS[lx + ly * N] === 1;
    return borderOpenV(cx, cy, lx);
  }
  if (ly > 0) return d.openS[lx + (ly - 1) * N] === 1;
  return borderOpenV(cx, cy - 1, lx);
}

const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];

/* Breadth-first search over the lazily-queried maze. */
function findPath(sx, sy, tx, ty){
  const startK = sx + ',' + sy, targetK = tx + ',' + ty;
  if (startK === targetK) return null;
  const prev = new Map();
  prev.set(startK, null);
  const queue = [[sx, sy]];
  let head = 0, visited = 1;
  const NODE_CAP = 150000;

  while (head < queue.length){
    const [x, y] = queue[head++];
    for (let dir = 0; dir < 4; dir++){
      if (!canMove(x, y, dir)) continue;
      const nx = x + DIRS[dir][0], ny = y + DIRS[dir][1];
      const nk = nx + ',' + ny;
      if (prev.has(nk)) continue;
      prev.set(nk, x + ',' + y);
      if (nx === tx && ny === ty){
        const cells = [];
        let k = nk;
        while (k){ cells.push(k.split(',').map(Number)); k = prev.get(k); }
        cells.reverse();
        return cells;
      }
      if (++visited > NODE_CAP) return null;
      queue.push([nx, ny]);
    }
  }
  return null;
}

/* Fallback navigator (never expected — maze is fully connected):
   a straight-biased random walk used only if BFS is somehow cut short. */
function randomWalkPath(sx, sy, steps){
  const cells = [[sx, sy]];
  let x = sx, y = sy, dir = -1;
  for (let i = 0; i < steps; i++){
    const open = [];
    for (let d2 = 0; d2 < 4; d2++) if (canMove(x, y, d2)) open.push(d2);
    if (!open.length) break;
    let pick = dir >= 0 && open.includes(dir) && Math.random() < 0.5 ? dir
             : open[(Math.random() * open.length) | 0];
    dir = pick;
    x += DIRS[pick][0]; y += DIRS[pick][1];
    cells.push([x, y]);
  }
  return cells;
}

/* ================================================================
   2. Renderer, scene, atmosphere
   ================================================================ */

const loaderEl = document.getElementById('loader');
const loaderText = document.getElementById('loader-text');
let started = false;

function fail(msg){
  loaderText.textContent = msg;
  loaderText.classList.add('err');
  loaderEl.classList.remove('done');
}
window.addEventListener('error', () => { if (!started) fail('Something failed to load. This page needs internet access to fetch Three.js from the CDN.'); });
window.addEventListener('unhandledrejection', () => { if (!started) fail('Something failed to load. This page needs internet access to fetch Three.js from the CDN.'); });
setTimeout(() => { if (!started) fail('Still loading… this page fetches Three.js from cdn.jsdelivr.net, which requires an internet connection.'); }, 9000);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e){
  fail('WebGL is not available in this browser.');
  throw e;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.domElement.classList.add('webgl');
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  fail('The graphics context was lost. Please reload the page.');
});

const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e18, 0.03);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 900);
camera.rotation.order = 'YXZ';
camera.position.set(0, EYE, 0);

/* Lights */
scene.add(new THREE.HemisphereLight(0x93b0ff, 0x101722, 0.55));
const moon = new THREE.DirectionalLight(0xbfd0ff, 0.35);
moon.position.set(0.3, 1, 0.2);
scene.add(moon);
const torch = new THREE.PointLight(0xffc98a, 55, 30, 2);
scene.add(torch);

/* Sky dome + stars follow the camera so the horizon never recedes. */
const skyGroup = new THREE.Group();
scene.add(skyGroup);

const skyUniforms = {
  uTop:     { value: new THREE.Color(0x04060c) },
  uMid:     { value: new THREE.Color(0x0a1226) },
  uHorizon: { value: new THREE.Color(0x14203a) }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(380, 32, 20),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHorizon;
      varying vec3 vDir;
      void main(){
        float h = vDir.y;
        vec3 c;
        if (h < 0.0)      c = uHorizon * (1.0 + h * 0.8);
        else if (h < 0.32) c = mix(uHorizon, uMid, h / 0.32);
        else               c = mix(uMid, uTop, (h - 0.32) / 0.68);
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
sky.frustumCulled = false;
skyGroup.add(sky);

function makeStars(count, size, opacity){
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++){
    const u = Math.random() * 2 - 1;
    const t = Math.random() * Math.PI * 2;
    const r = Math.sqrt(1 - u * u);
    const R = 330 + Math.random() * 30;
    pos[i*3]   = Math.cos(t) * r * R;
    pos[i*3+1] = Math.abs(u) * R * 0.9 + 8;
    pos[i*3+2] = Math.sin(t) * r * R;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color: 0xdfe8ff, size, sizeAttenuation: false,
    transparent: true, opacity, fog: false, depthWrite: false
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  return p;
}
skyGroup.add(makeStars(900, 1.3, 0.5));
skyGroup.add(makeStars(320, 2.3, 0.9));

/* Drifting dust motes near the camera */
const DUST_N = 340, DUST_BOX = 80;
const dustPos = new Float32Array(DUST_N * 3);
const dustVel = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++){
  dustPos[i*3]   = (Math.random() - 0.5) * DUST_BOX;
  dustPos[i*3+1] = Math.random() * 7 + 0.2;
  dustPos[i*3+2] = (Math.random() - 0.5) * DUST_BOX;
  dustVel[i*3]   = (Math.random() - 0.5) * 0.25;
  dustVel[i*3+1] = (Math.random() - 0.5) * 0.08;
  dustVel[i*3+2] = (Math.random() - 0.5) * 0.25;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x9fb8ff, size: 0.055, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
dust.frustumCulled = false;
scene.add(dust);

/* ================================================================
   3. Procedural textures & shared materials
   ================================================================ */

function makeWallTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#242b39'; g.fillRect(0, 0, 256, 256);
  const cols = 4, rows = 2, w = 256 / cols, h = 256 / rows;
  for (let ry = 0; ry < rows; ry++){
    for (let rx = 0; rx < cols; rx++){
      const v = 0.88 + Math.random() * 0.28;
      g.fillStyle = 'rgb(' + (34*v|0) + ',' + (41*v|0) + ',' + (56*v|0) + ')';
      g.fillRect(rx*w + 3, ry*h + 3, w - 6, h - 6);
      g.strokeStyle = 'rgba(255,255,255,0.05)';
      g.strokeRect(rx*w + 3.5, ry*h + 3.5, w - 7, h - 7);
      g.strokeStyle = 'rgba(0,0,0,0.4)';
      g.strokeRect(rx*w + 2.5, ry*h + 2.5, w - 5, h - 5);
    }
  }
  for (let i = 0; i < 1700; i++){
    const a = Math.random() * 0.07;
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + a + ')' : 'rgba(0,0,0,' + a + ')';
    g.fillRect((Math.random()*256)|0, (Math.random()*256)|0, 2, 2);
  }
  const grad = g.createLinearGradient(0, 196, 0, 256);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = grad; g.fillRect(0, 196, 256, 60);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  return tex;
}

function makeFloorTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#0d1119'; g.fillRect(0, 0, 256, 256);
  const sub = 2, s = 256 / sub;
  for (let ry = 0; ry < sub; ry++){
    for (let rx = 0; rx < sub; rx++){
      const v = 0.85 + Math.random() * 0.3;
      g.fillStyle = 'rgb(' + (21*v|0) + ',' + (26*v|0) + ',' + (38*v|0) + ')';
      g.fillRect(rx*s + 4, ry*s + 4, s - 8, s - 8);
      g.strokeStyle = 'rgba(130,160,220,0.07)';
      g.strokeRect(rx*s + 4.5, ry*s + 4.5, s - 9, s - 9);
    }
  }
  for (let i = 0; i < 1500; i++){
    const a = Math.random() * 0.06;
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + a + ')' : 'rgba(0,0,0,' + a + ')';
    g.fillRect((Math.random()*256)|0, (Math.random()*256)|0, 2, 2);
  }
  for (let i = 0; i < 26; i++){
    g.fillStyle = 'rgba(150,190,255,' + (0.05 + Math.random()*0.1) + ')';
    g.fillRect((Math.random()*256)|0, (Math.random()*256)|0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(CHUNK, CHUNK);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  return tex;
}

const wallMat  = new THREE.MeshStandardMaterial({ map: makeWallTexture(), roughness: 0.82, metalness: 0.18 });
const floorMat = new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: 0.95, metalness: 0.05 });
const wallGeo  = new THREE.BoxGeometry(CELL + THICK, WALL_H, THICK);
const stripGeo = new THREE.BoxGeometry(CELL + THICK, 0.09, THICK * 0.66);
const floorGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL);

/* Regions: hue bands sweep diagonally across the world so travelling
   far visibly changes the mood of the maze. */
const REGION_NAMES = ['AURORA','COBALT','CYAN','AZURE','AQUA','TEAL','JADE','MALACHITE','EMERALD','MOSS','LIME','CITRUS','AMBER','GOLD','COPPER','RUST','CORAL','CRIMSON','GARNET','MAGENTA','ORCHID','VIOLET','INDIGO','ULTRAMARINE'];
const regionColors = [], regionCss = [], stripMats = [];
for (let i = 0; i < 24; i++){
  const col = new THREE.Color().setHSL(i / 24, 0.72, 0.6);
  regionColors.push(col);
  regionCss.push('#' + col.getHexString());
  stripMats.push(new THREE.MeshBasicMaterial({ color: col, toneMapped: false, transparent: true, opacity: 0.95 }));
}
const regionIndex = (cx, cy) => (((cx + 2 * cy) % 24) + 24) % 24;

/* ================================================================
   4. Chunk meshes — streamed around the walker
   ================================================================ */

const chunks = new Map();          // "cx,cy" -> { group, meshes }
const buildQueue = [];
let camChunkX = 0, camChunkY = 0;

const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

function buildChunk(cx, cy){
  const key = ckey(cx, cy);
  if (chunks.has(key)) return;

  const group = new THREE.Group();
  const N = CHUNK;

  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set((cx + 0.5) * N * CELL, 0, (cy + 0.5) * N * CELL);
  group.add(floor);

  const walls = [];
  for (let ly = 0; ly < N; ly++){
    for (let lx = 0; lx < N; lx++){
      const gx = cx * N + lx, gy = cy * N + ly;
      if (!canMove(gx, gy, 0)) walls.push([(gx + 1) * CELL, (gy + 0.5) * CELL, Math.PI / 2]);
      if (!canMove(gx, gy, 1)) walls.push([(gx + 0.5) * CELL, (gy + 1) * CELL, 0]);
    }
  }

  const meshes = [];
  if (walls.length){
    const rng = mulberry32(hash2i(cx, cy, 0xbeef01));
    const hue = regionIndex(cx, cy) / 24;
    const wallMesh = new THREE.InstancedMesh(wallGeo, wallMat, walls.length);
    const stripMesh = new THREE.InstancedMesh(stripGeo, stripMats[regionIndex(cx, cy)], walls.length);
    for (let i = 0; i < walls.length; i++){
      const [wx, wz, rot] = walls[i];
      dummy.position.set(wx, WALL_H / 2, wz);
      dummy.rotation.set(0, rot, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      wallMesh.setMatrixAt(i, dummy.matrix);
      const v = 0.58 + rng() * 0.2;
      wallMesh.setColorAt(i, tmpColor.setHSL(hue, 0.12, v));

      dummy.position.set(wx, WALL_H + 0.045, wz);
      dummy.updateMatrix();
      stripMesh.setMatrixAt(i, dummy.matrix);
    }
    wallMesh.instanceMatrix.needsUpdate = true;
    stripMesh.instanceMatrix.needsUpdate = true;
    if (wallMesh.instanceColor) wallMesh.instanceColor.needsUpdate = true;
    wallMesh.frustumCulled = false;
    stripMesh.frustumCulled = false;
    group.add(wallMesh, stripMesh);
    meshes.push(wallMesh, stripMesh);
  }

  scene.add(group);
  chunks.set(key, { group, meshes });
}

function disposeChunk(key){
  const rec = chunks.get(key);
  if (!rec) return;
  scene.remove(rec.group);
  for (const m of rec.meshes) m.dispose();
  chunks.delete(key);
}

const KEEP_R = 2, PRUNE_R = 3;

function refreshChunkSets(force){
  const wx = Math.floor((walker.pos.x + CELL / 2) / (CHUNK * CELL));
  const wy = Math.floor((walker.pos.z + CELL / 2) / (CHUNK * CELL));
  if (!force && wx === camChunkX && wy === camChunkY) return;
  camChunkX = wx; camChunkY = wy;

  buildQueue.length = 0;
  const queued = new Set();
  for (let j = -KEEP_R; j <= KEEP_R; j++){
    for (let i = -KEEP_R; i <= KEEP_R; i++){
      const cx = wx + i, cy = wy + j, key = ckey(cx, cy);
      if (!chunks.has(key) && !queued.has(key)){
        queued.add(key);
        buildQueue.push([cx, cy, i * i + j * j]);
      }
    }
  }
  buildQueue.sort((a, b) => a[2] - b[2]);

  for (const key of chunks.keys()){
    const [cx, cy] = key.split(',').map(Number);
    if (Math.max(Math.abs(cx - wx), Math.abs(cy - wy)) > PRUNE_R) disposeChunk(key);
  }

  if (chunkData.size > 1600){
    for (const key of chunkData.keys()){
      const [cx, cy] = key.split(',').map(Number);
      if (Math.max(Math.abs(cx - wx), Math.abs(cy - wy)) > 16) chunkData.delete(key);
    }
  }
}

function pumpBuildQueue(budget){
  while (budget > 0 && buildQueue.length){
    const [cx, cy] = buildQueue.shift();
    if (Math.max(Math.abs(cx - camChunkX), Math.abs(cy - camChunkY)) > PRUNE_R) continue;
    buildChunk(cx, cy);
    budget--;
  }
}

/* ================================================================
   5. The autonomous walker
   ================================================================ */

const SPEED_BASE = 3.3;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionScale = reduceMotion ? 0.3 : 1;

const walker = {
  pos: { x: 0, z: 0 },
  path: null,       // smoothed world-space waypoints
  seg: 0, t: 0,     // position along current segment
  yaw: 0, yawRate: 0,
  bobPhase: 0,
  distance: 0,
  cellsSeen: new Set(['0,0']),
  target: null
};

function cellOfPosition(){
  return { x: Math.round(walker.pos.x / CELL), y: Math.round(walker.pos.z / CELL) };
}

function smoothPath(pts, iterations){
  let out = pts;
  for (let it = 0; it < iterations; it++){
    const next = [out[0]];
    for (let i = 0; i < out.length - 1; i++){
      const a = out[i], b = out[i + 1];
      next.push({ x: a.x * 0.75 + b.x * 0.25, z: a.z * 0.75 + b.z * 0.25 });
      next.push({ x: a.x * 0.25 + b.x * 0.75, z: a.z * 0.25 + b.z * 0.75 });
    }
    next.push(out[out.length - 1]);
    out = next;
  }
  return out;
}

function setPathFromCells(cells){
  const pts = [{ x: walker.pos.x, z: walker.pos.z }];
  for (let i = 1; i < cells.length; i++) pts.push({ x: cells[i][0] * CELL, z: cells[i][1] * CELL });
  walker.path = smoothPath(pts, 2);
  walker.seg = 0;
  walker.t = 0;
  walker.target = cells[cells.length - 1];
}

function pickNewTarget(){
  const start = cellOfPosition();
  for (let attempt = 0; attempt < 10; attempt++){
    let ang;
    if (attempt < 6){
      const hx = -Math.sin(walker.yaw), hz = -Math.cos(walker.yaw);
      ang = Math.atan2(hz, hx) + (Math.random() * 2 - 1) * 1.2;
    } else {
      ang = Math.random() * Math.PI * 2;
    }
    const dist = 26 + Math.random() * 38;
    const tx = start.x + Math.round(Math.cos(ang) * dist);
    const ty = start.y + Math.round(Math.sin(ang) * dist);
    const cells = findPath(start.x, start.y, tx, ty);
    if (cells && cells.length >= 10){ setPathFromCells(cells); return; }
  }
  setPathFromCells(randomWalkPath(start.x, start.y, 70));
}

function segDir(p, q){
  const dx = q.x - p.x, dz = q.z - p.z;
  const l = Math.hypot(dx, dz) || 1e-6;
  return [dx / l, dz / l];
}

function updateWalker(dt){
  if (!walker.path) pickNewTarget();

  // speed eases down through sharp turns, breathes slowly over time
  let factor = 1;
  if (walker.path && walker.seg < walker.path.length - 2){
    const a = walker.path[walker.seg], b = walker.path[walker.seg + 1], c = walker.path[walker.seg + 2];
    const d1 = segDir(a, b), d2 = segDir(b, c);
    factor = 0.6 + 0.4 * Math.max(0, d1[0] * d2[0] + d1[1] * d2[1]);
  }
  const speed = SPEED_BASE * factor * (1 + 0.08 * Math.sin(performance.now() * 0.0003));

  let remain = speed * dt;
  let guard = 0;
  while (remain > 0 && walker.path && walker.seg < walker.path.length - 1 && guard++ < 64){
    const a = walker.path[walker.seg], b = walker.path[walker.seg + 1];
    const segLen = Math.hypot(b.x - a.x, b.z - a.z);
    if (segLen < 1e-4){ walker.seg++; walker.t = 0; continue; }
    const left = segLen - walker.t;
    if (remain < left){
      walker.t += remain;
      remain = 0;
    } else {
      remain -= left;
      walker.seg++;
      walker.t = 0;
    }
  }

  if (walker.path && walker.seg >= walker.path.length - 1){
    walker.pos.x = walker.path[walker.path.length - 1].x;
    walker.pos.z = walker.path[walker.path.length - 1].z;
    pickNewTarget();
  } else if (walker.path){
    const a = walker.path[walker.seg], b = walker.path[walker.seg + 1];
    const segLen = Math.hypot(b.x - a.x, b.z - a.z) || 1e-6;
    const u = clamp(walker.t / segLen, 0, 1);
    const nx = a.x + (b.x - a.x) * u, nz = a.z + (b.z - a.z) * u;
    walker.distance += Math.hypot(nx - walker.pos.x, nz - walker.pos.z);
    walker.pos.x = nx; walker.pos.z = nz;
  }

  // steer the gaze toward travel direction with a limited turn rate
  let targetYaw = walker.yaw;
  if (walker.path && walker.seg < walker.path.length - 1){
    const a = walker.path[Math.min(walker.seg, walker.path.length - 2)];
    const b = walker.path[Math.min(walker.seg + 1, walker.path.length - 1)];
    const d = segDir(a, b);
    targetYaw = Math.atan2(-d[0], -d[1]);
  }
  const diff = wrapPi(targetYaw - walker.yaw);
  const maxTurn = 2.4;
  walker.yawRate = clamp(diff * 6, -maxTurn, maxTurn);
  walker.yaw = wrapPi(walker.yaw + walker.yawRate * dt);

  const cell = cellOfPosition();
  walker.cellsSeen.add(cell.x + ',' + cell.y);
}

function applyCamera(t){
  const bobAmp = 0.045 * motionScale;
  const bob = Math.sin(walker.bobPhase) * bobAmp;
  const sway = Math.sin(walker.bobPhase * 0.5) * 0.03 * motionScale;

  const fx = -Math.sin(walker.yaw), fz = -Math.cos(walker.yaw); // forward
  const rx =  Math.cos(walker.yaw), rz = -Math.sin(walker.yaw); // right

  camera.position.set(
    walker.pos.x + rx * sway,
    EYE + bob,
    walker.pos.z + rz * sway
  );
  camera.rotation.y = walker.yaw;
  camera.rotation.x = Math.sin(walker.bobPhase * 2) * 0.004 * motionScale;
  camera.rotation.z = clamp(-walker.yawRate * 0.045, -0.06, 0.06) * motionScale;

  torch.position.set(
    camera.position.x + fx * 0.6,
    camera.position.y + 0.25,
    camera.position.z + fz * 0.6
  );
  torch.intensity = 50 + Math.sin(t * 13.7) * 3 + Math.sin(t * 29.3) * 2 + (Math.random() - 0.5) * 3;

  skyGroup.position.set(camera.position.x, 0, camera.position.z);
}

/* ================================================================
   6. HUD — stats & minimap
   ================================================================ */

const el = {
  dist: document.getElementById('v-dist'),
  cells: document.getElementById('v-cells'),
  sector: document.getElementById('v-sector'),
  region: document.getElementById('v-region'),
  heading: document.getElementById('v-heading'),
  time: document.getElementById('v-time'),
  fps: document.getElementById('v-fps')
};
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const COMPASS = ['N','NE','E','SE','S','SW','W','NW'];

let fpsEma = 60;
let statTimer = 0, mapTimer = 0;
const bootTime = performance.now();

function updateStats(){
  const cell = cellOfPosition();
  const ccx = Math.floor(cell.x / CHUNK), ccy = Math.floor(cell.y / CHUNK);
  const rIdx = regionIndex(ccx, ccy);

  el.dist.textContent = Math.round(walker.distance) + ' m';
  el.cells.textContent = walker.cellsSeen.size.toLocaleString();
  el.sector.textContent = ccx + ' , ' + ccy;
  el.region.textContent = REGION_NAMES[rIdx];
  el.region.style.color = regionCss[rIdx];

  const deg = ((-walker.yaw * 180 / Math.PI) % 360 + 360) % 360;
  el.heading.textContent = COMPASS[Math.round(deg / 45) % 8] + ' ' + Math.round(deg) + '°';

  const up = (performance.now() - bootTime) / 1000;
  const m = Math.floor(up / 60), s = Math.floor(up % 60);
  el.time.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  el.fps.textContent = Math.round(fpsEma);
}

function drawMinimap(){
  const ctx = mmCtx;
  const W = 168, R = 13, scale = W / (2 * R + 1);
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.clearRect(0, 0, W, W);

  const pc = cellOfPosition();
  const toX = (cx) => (cx - pc.x + R + 0.5) * scale;
  const toY = (cy) => (cy - pc.y + R + 0.5) * scale;

  // visited cells
  ctx.fillStyle = 'rgba(130,170,240,0.10)';
  for (let dy = -R; dy <= R; dy++){
    for (let dx = -R; dx <= R; dx++){
      if (walker.cellsSeen.has((pc.x + dx) + ',' + (pc.y + dy))){
        ctx.fillRect(toX(pc.x + dx) - scale / 2 + 0.7, toY(pc.y + dy) - scale / 2 + 0.7, scale - 1.4, scale - 1.4);
      }
    }
  }

  // walls
  ctx.strokeStyle = 'rgba(150,180,220,0.6)';
  ctx.lineWidth = Math.max(1.4, scale * 0.16);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let dy = -R; dy <= R; dy++){
    for (let dx = -R; dx <= R; dx++){
      const x = pc.x + dx, y = pc.y + dy;
      const px = toX(x), py = toY(y);
      if (!canMove(x, y, 0)){ ctx.moveTo(px, py); ctx.lineTo(px + scale, py); }
      if (!canMove(x, y, 1)){ ctx.moveTo(px, py); ctx.lineTo(px, py + scale); }
    }
  }
  ctx.stroke();

  const ccx = Math.floor(pc.x / CHUNK), ccy = Math.floor(pc.y / CHUNK);
  const hueCol = regionCss[regionIndex(ccx, ccy)];

  // planned route
  if (walker.path && walker.seg < walker.path.length - 1){
    ctx.strokeStyle = hueCol;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = hueCol;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.moveTo((walker.pos.x / CELL - pc.x + R + 0.5) * scale,
               (walker.pos.z / CELL - pc.y + R + 0.5) * scale);
    for (let i = walker.seg + 1; i < walker.path.length; i++){
      ctx.lineTo((walker.path[i].x / CELL - pc.x + R + 0.5) * scale,
                 (walker.path[i].z / CELL - pc.y + R + 0.5) * scale);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // destination marker
    const end = walker.path[walker.path.length - 1];
    ctx.fillStyle = hueCol;
    ctx.beginPath();
    ctx.arc((end.x / CELL - pc.x + R + 0.5) * scale,
            (end.z / CELL - pc.y + R + 0.5) * scale, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // player arrow
  const fx = -Math.sin(walker.yaw), fz = -Math.cos(walker.yaw);
  const ang = Math.atan2(fz, fx);
  ctx.save();
  ctx.translate(W / 2, W / 2);
  ctx.rotate(ang);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(5, 0);
  ctx.lineTo(-3.4, 3.2);
  ctx.lineTo(-3.4, -3.2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ================================================================
   7. Main loop
   ================================================================ */

const horizonCol = new THREE.Color();
const midCol = new THREE.Color();
const clock = { last: performance.now() };

function animate(){
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - clock.last) / 1000;
  clock.last = now;
  dt = clamp(dt, 0.0001, 0.05);

  if (dt > 0.0001) fpsEma = fpsEma * 0.92 + (1 / dt) * 0.08;

  updateWalker(dt);
  walker.bobPhase += dt * SPEED_BASE * 2.2;
  applyCamera(now / 1000);

  refreshChunkSets(false);
  pumpBuildQueue(2);

  // atmosphere drifts with distance travelled + time
  const hue = (0.58 + walker.distance * 0.00035 + now * 0.0000015) % 1;
  horizonCol.setHSL(hue, 0.5, 0.2);
  midCol.setHSL((hue + 0.06) % 1, 0.42, 0.1);
  skyUniforms.uHorizon.value.copy(horizonCol);
  skyUniforms.uMid.value.copy(midCol);
  scene.fog.color.copy(horizonCol).multiplyScalar(0.85);

  // dust drift, wrapped around the camera
  const camX = camera.position.x, camZ = camera.position.z, half = DUST_BOX / 2;
  for (let i = 0; i < DUST_N; i++){
    let px = dustPos[i*3] + dustVel[i*3] * dt;
    let py = dustPos[i*3+1] + dustVel[i*3+1] * dt;
    let pz = dustPos[i*3+2] + dustVel[i*3+2] * dt;
    let rel = px - camX; rel = ((rel % DUST_BOX) + DUST_BOX * 1.5) % DUST_BOX - half; px = camX + rel;
    rel = pz - camZ;     rel = ((rel % DUST_BOX) + DUST_BOX * 1.5) % DUST_BOX - half; pz = camZ + rel;
    if (py < 0.1) py = 7.5; else if (py > 7.6) py = 0.2;
    dustPos[i*3] = px; dustPos[i*3+1] = py; dustPos[i*3+2] = pz;
  }
  dustGeo.attributes.position.needsUpdate = true;

  statTimer += dt;
  if (statTimer > 0.25){ statTimer = 0; updateStats(); }
  mapTimer += dt;
  if (mapTimer > 0.12){ mapTimer = 0; drawMinimap(); }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================================================================
   8. Boot — no input ever required; the journey just begins
   ================================================================ */

buildChunk(0, 0);
for (let j = -1; j <= 1; j++)
  for (let i = -1; i <= 1; i++)
    if (i || j) buildChunk(i, j);

walker.yaw = Math.PI; // initial gaze; first path steers it from here
pickNewTarget();
if (walker.path && walker.path.length > 1){
  const d = segDir(walker.path[0], walker.path[1]);
  walker.yaw = Math.atan2(-d[0], -d[1]);
}
refreshChunkSets(true);
updateStats();
drawMinimap();

started = true;
loaderEl.classList.add('done');
setTimeout(() => loaderEl.remove(), 800);

animate();
</script>
