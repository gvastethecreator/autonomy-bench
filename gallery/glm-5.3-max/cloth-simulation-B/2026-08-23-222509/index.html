<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk — a cloth study</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0b0e; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8e3d8;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c {
    position: fixed; inset: 0; display: block;
    cursor: crosshair; touch-action: none;
    animation: fadein 1.1s ease both;
  }
  .frame {
    position: fixed; inset: 12px;
    border: 1px solid rgba(232, 227, 216, 0.07);
    pointer-events: none; z-index: 8;
  }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
  }
  .hud {
    position: fixed; z-index: 10; pointer-events: none;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.65);
    animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .hud-tl { top: 34px; left: 38px; animation-delay: 0.15s; }
  .hud-tr { top: 36px; right: 38px; text-align: right; animation-delay: 0.3s; }
  .hud-bl { bottom: 34px; left: 38px; animation-delay: 0.45s; }
  .hud-bc { bottom: 34px; left: 50%; transform: translateX(-50%); animation-delay: 0.6s; }
  .hud-br { bottom: 30px; right: 38px; pointer-events: auto; animation-delay: 0.45s; }

  h1 {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.52em; color: #e8e3d8;
  }
  .hud-tl p {
    margin-top: 7px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-size: 12.5px;
    color: #8f8a7f; letter-spacing: 0.02em;
  }
  #stats {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.08em; color: #6f6b62;
  }
  .meter { display: flex; align-items: center; gap: 10px; }
  .meter label {
    font-size: 9px; letter-spacing: 0.22em; color: #6f6b62; text-transform: uppercase;
  }
  .bar { width: 84px; height: 2px; background: rgba(232, 227, 216, 0.12); }
  #windFill { display: block; height: 100%; width: 0%; background: #cf9b5e; }

  #hint {
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #8f8a7f; white-space: nowrap;
    transition: opacity 1.4s ease;
  }
  #hint.dim { opacity: 0.3; }
  #hint i { font-style: normal; opacity: 0.35; padding: 0 0.6em; }

  .panel { display: flex; flex-direction: column; gap: 13px; align-items: flex-end; }
  .row { display: flex; gap: 20px; align-items: flex-end; }
  .ctl label {
    display: flex; justify-content: space-between;
    width: 112px; margin-bottom: 7px;
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #8f8a7f;
  }
  .ctl label span { color: #b5ae9f; letter-spacing: 0.06em; }
  input[type=range] {
    appearance: none; -webkit-appearance: none;
    width: 112px; height: 14px; background: transparent; cursor: pointer; display: block;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(232, 227, 216, 0.18); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
    background: #cf9b5e; margin-top: -4px; border: none;
  }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(232, 227, 216, 0.18); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #cf9b5e; border: none; }

  .btns { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #c9c3b6; background: transparent;
    border: 1px solid rgba(232, 227, 216, 0.18); border-radius: 2px;
    padding: 7px 12px; cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
  }
  button:hover { border-color: rgba(232, 227, 216, 0.45); color: #f2ecdf; background: rgba(232, 227, 216, 0.05); }
  button.on { background: rgba(207, 155, 94, 0.14); border-color: rgba(207, 155, 94, 0.55); color: #e6c194; }
  button:disabled { opacity: 0.35; cursor: default; background: transparent; }
  button:disabled:hover { border-color: rgba(232, 227, 216, 0.18); color: #c9c3b6; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .hud-bc { animation-name: riseC; }
  @keyframes riseC { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 740px) {
    #stats, .meter, #hint { display: none; }
    .hud-tl { top: 24px; left: 24px; }
    .hud-br { bottom: 22px; right: 24px; transform: scale(0.92); transform-origin: bottom right; }
    .frame { inset: 8px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="frame"></div>

<header class="hud hud-tl">
  <h1>SILK</h1>
  <p>a verlet cloth study</p>
</header>

<div class="hud hud-tr" id="stats">&mdash; nodes &middot; &mdash; threads &middot; &mdash; fps</div>

<div class="hud hud-bl meter">
  <label>Wind</label>
  <div class="bar"><span id="windFill"></span></div>
</div>

<div class="hud hud-bc" id="hint">
  drag to pull<i>&middot;</i>right-drag to cut<i>&middot;</i>double-click to burst<i>&middot;</i>W gusts
</div>

<div class="hud hud-br panel">
  <div class="row">
    <div class="ctl">
      <label>Wind <span id="windVal">34%</span></label>
      <input type="range" id="windRange" min="0" max="100" step="1" value="34">
    </div>
    <div class="ctl">
      <label>Drape <span id="drapeVal">4</span></label>
      <input type="range" id="drapeRange" min="2" max="6" step="1" value="4">
    </div>
  </div>
  <div class="btns">
    <button type="button" id="btnDrop">Drop</button>
    <button type="button" id="btnCut">Cut</button>
    <button type="button" id="btnPause">Pause</button>
    <button type="button" id="btnReset">Reset</button>
  </div>
</div>

<div class="grain"></div>

<script>
(() => {
"use strict";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statsEl  = document.getElementById('stats');
const windFill = document.getElementById('windFill');
const windRange = document.getElementById('windRange');
const drapeRange = document.getElementById('drapeRange');
const windVal = document.getElementById('windVal');
const drapeVal = document.getElementById('drapeVal');
const btnDrop = document.getElementById('btnDrop');
const btnCut = document.getElementById('btnCut');
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');
const hintEl = document.getElementById('hint');

// ---------- tunables ----------
const F = 1100;          // perspective focal length (px)
const GRAV = 2600;       // gravity px/s^2
const DAMP = 0.985;      // velocity retention per substep
const TEAR = 2.35;       // constraints snap past this stretch ratio
const WMAX = 2600;       // wind force at slider 100%
const DT = 1 / 60;
// light (normalized-ish) and blinn half-vector
const LX = -0.4206, LY = -0.5538, LZ = 0.7250;
const HX = -0.5630, HY = -0.7370, HZ = -0.3750;

// color ramp: wine -> vermillion -> pale gold (precomputed LUT)
const STOPS = [
  [0.00,  42,  10,  20],
  [0.22, 107,  18,  38],
  [0.45, 165,  36,  51],
  [0.62, 207,  74,  44],
  [0.78, 234, 122,  53],
  [0.90, 245, 168,  82],
  [1.00, 249, 207, 138]
];
const LUTN = 128, LUT = new Uint8Array(LUTN * 3);
for (let i = 0; i < LUTN; i++) {
  const t = i / (LUTN - 1);
  let s = 0;
  while (s < STOPS.length - 2 && t > STOPS[s + 1][0]) s++;
  const a = STOPS[s], b = STOPS[s + 1];
  const u = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0] || 1)));
  for (let c = 0; c < 3; c++) LUT[i * 3 + c] = a[c + 1] + (b[c + 1] - a[c + 1]) * u;
}

// ---------- state ----------
let vw = 0, vh = 0, dpr = 1, CX = 0, CY = 0;
let COLS = 0, ROWS = 0, N = 0, QN = 0, C = 0;
let px, py, pz, ox, oy, oz;             // positions + previous (verlet)
let pin, pinX, pinY;                    // pinning
let ca, cb, crest, calive, ctype;       // constraints
let rc, dc;                             // point -> right/down constraint id
let rowR, rowG, rowB;                   // base color per row
let qNoise, quadAlive, zsum, qfill, order;
let SX, SY;                             // projected screen coords
let floorY = 0, pinsDropped = false, aliveThreads = 0;
let bgGrad = null, floorGrad = null;

let simT = 0, acc = 0, paused = false;
let windBase = 0.34, iters = 4, gustV = 0, windNow = 0;
let grab = -1, grabSX = 0, grabSY = 0, grabTZ = 0;
let cutting = false, cutMode = false;
let mx = 0, my = 0, pmx = 0, pmy = 0;
let fps = 60, statTimer = 0;

// ---------- cloth construction ----------
function buildCloth() {
  vw = innerWidth; vh = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  CX = vw / 2; CY = vh / 2;

  const yTop = vh * 0.125;
  floorY = vh * 0.875;
  const cw = Math.min(vw * 0.66, 980);
  let s = 14;
  let cols = Math.round(cw / s) + 1;
  let rows = Math.round((floorY - yTop) * 0.94 / s) + 1;
  if (cols * rows > 2600) {                       // keep the mesh within budget
    const k = Math.sqrt(cols * rows / 2600);
    s *= k;
    cols = Math.round(cw / s) + 1;
    rows = Math.round((floorY - yTop) * 0.94 / s) + 1;
  }
  cols = Math.max(24, Math.min(80, cols));
  rows = Math.max(14, Math.min(60, rows));

  COLS = cols; ROWS = rows; N = cols * rows; QN = (cols - 1) * (rows - 1);
  const sx = cw / (cols - 1);
  const sy = (floorY - yTop) * 0.94 / (rows - 1);
  const x0 = vw / 2 - (cols - 1) * sx / 2;

  px = new Float32Array(N); py = new Float32Array(N); pz = new Float32Array(N);
  ox = new Float32Array(N); oy = new Float32Array(N); oz = new Float32Array(N);
  pin = new Uint8Array(N); pinX = new Float32Array(N); pinY = new Float32Array(N);
  SX = new Float32Array(N); SY = new Float32Array(N);

  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const id = i * cols + j;
      px[id] = x0 + j * sx;
      py[id] = yTop + i * sy;
      pz[id] = Math.sin(i * 0.35 + j * 0.21) * 4;   // faint initial ripple
      ox[id] = px[id]; oy[id] = py[id]; oz[id] = pz[id];
      pin[id] = 0;
    }
  }
  const pinEvery = Math.max(6, Math.round(cols / 9));
  for (let j = 0; j < cols; j++) {
    if (j % pinEvery === 0 || j === cols - 1) {
      pin[j] = 1; pinX[j] = px[j]; pinY[j] = py[j];
    }
  }

  const cap = cols * (rows - 1) + rows * (cols - 1);
  ca = new Int32Array(cap); cb = new Int32Array(cap);
  crest = new Float32Array(cap); calive = new Uint8Array(cap); ctype = new Uint8Array(cap);
  rc = new Int32Array(N).fill(-1); dc = new Int32Array(N).fill(-1);
  C = 0;
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const id = i * cols + j;
      if (j < cols - 1) {
        ca[C] = id; cb[C] = id + 1; calive[C] = 1; ctype[C] = 0;
        crest[C] = Math.hypot(px[id + 1] - px[id], py[id + 1] - py[id], pz[id + 1] - pz[id]);
        rc[id] = C; C++;
      }
      if (i < rows - 1) {
        ca[C] = id; cb[C] = id + cols; calive[C] = 1; ctype[C] = 1;
        crest[C] = Math.hypot(px[id + cols] - px[id], py[id + cols] - py[id], pz[id + cols] - pz[id]);
        dc[id] = C; C++;
      }
    }
  }
  aliveThreads = C;

  rowR = new Uint8Array(rows); rowG = new Uint8Array(rows); rowB = new Uint8Array(rows);
  for (let i = 0; i < rows; i++) {
    const li = Math.min(LUTN - 1, Math.round(i / (rows - 1) * (LUTN - 1))) * 3;
    rowR[i] = LUT[li]; rowG[i] = LUT[li + 1]; rowB[i] = LUT[li + 2];
  }
  qNoise = new Float32Array(QN);
  for (let q = 0; q < QN; q++) qNoise[q] = 0.965 + Math.random() * 0.07;  // woven grain
  quadAlive = new Uint8Array(QN);
  zsum = new Float32Array(QN);
  qfill = new Array(QN);
  order = [];

  bgGrad = ctx.createRadialGradient(vw / 2, vh * 0.42, 0, vw / 2, vh * 0.42, Math.max(vw, vh) * 0.75);
  bgGrad.addColorStop(0, '#15171c');
  bgGrad.addColorStop(1, '#08090c');
  floorGrad = ctx.createLinearGradient(0, 0, vw, 0);
  floorGrad.addColorStop(0, 'rgba(232,227,216,0)');
  floorGrad.addColorStop(0.5, 'rgba(232,227,216,0.07)');
  floorGrad.addColorStop(1, 'rgba(232,227,216,0)');

  pinsDropped = false;
  btnDrop.disabled = false;
  grab = -1;
  cutting = false;
  gustV = 500;            // opening breath of wind
}

// ---------- physics ----------
function step(dt) {
  simT += dt;
  gustV *= Math.exp(-dt * 1.4);
  // occasional ambient gusts keep the cloth alive
  if (Math.random() < dt * 0.05) gustV += 400 + Math.random() * 600;
  gustV = Math.min(gustV, 3400);

  const wb = windBase * WMAX;
  windNow = wb * (0.6 + 0.4 * Math.sin(simT * 0.53)) + gustV;
  const wx = wb * 0.22 * Math.sin(simT * 1.17) + gustV * 0.1 * Math.sin(simT * 3.1);
  const w2 = simT * 2.3, w3 = simT * 3.7;
  const dt2 = dt * dt;

  // integrate (verlet)
  for (let i = 0; i < N; i++) {
    if (pin[i]) continue;
    const az = windNow * (0.72 + 0.28 * Math.sin(w2 + px[i] * 0.006 + py[i] * 0.0045))
             + gustV * 0.35 * Math.sin(w3 + py[i] * 0.02 + px[i] * 0.01);
    const vx = (px[i] - ox[i]) * DAMP;
    const vy = (py[i] - oy[i]) * DAMP;
    const vz = (pz[i] - oz[i]) * DAMP;
    ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i];
    px[i] += vx + wx * dt2;
    py[i] += vy + GRAV * dt2;
    pz[i] += vz + az * dt2;
  }

  // relax constraints
  for (let it = 0; it < iters; it++) {
    for (let k = 0; k < C; k++) {
      if (!calive[k]) continue;
      const a = ca[k], b = cb[k];
      let dx = px[b] - px[a], dy = py[b] - py[a], dz = pz[b] - pz[a];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 1e-6) continue;
      const r = crest[k];
      if (d > r * TEAR) { calive[k] = 0; aliveThreads--; continue; }
      const f = (d - r) / d * 0.5;
      dx *= f; dy *= f; dz *= f;
      const A = pin[a], B = pin[b];
      if (A === B) {
        if (!A) {
          px[a] += dx; py[a] += dy; pz[a] += dz;
          px[b] -= dx; py[b] -= dy; pz[b] -= dz;
        }
      } else if (A) {
        px[b] -= 2 * dx; py[b] -= 2 * dy; pz[b] -= 2 * dz;
      } else {
        px[a] += 2 * dx; py[a] += 2 * dy; pz[a] += 2 * dz;
      }
    }
  }

  // pins, floor, bounds
  for (let i = 0; i < N; i++) {
    if (pin[i]) {
      px[i] = pinX[i]; py[i] = pinY[i];
      ox[i] = pinX[i]; oy[i] = pinY[i]; oz[i] = pz[i];
      continue;
    }
    if (py[i] > floorY) {
      py[i] = floorY;
      ox[i] = px[i] + (ox[i] - px[i]) * 0.45;   // floor friction
      oz[i] = pz[i] + (oz[i] - pz[i]) * 0.45;
    }
    if (px[i] < 18) px[i] = 18; else if (px[i] > vw - 18) px[i] = vw - 18;
    if (pz[i] > 420) pz[i] = 420; else if (pz[i] < -420) pz[i] = -420;
  }

  // grabbed point follows the pointer (lifted toward the viewer)
  if (grab >= 0) {
    grabTZ += (-150 - grabTZ) * 0.18;
    const k = F / (F + grabTZ);
    const gx = CX + (grabSX - CX) / k;
    const gy = CY + (grabSY - CY) / k;
    ox[grab] = px[grab]; oy[grab] = py[grab]; oz[grab] = pz[grab];
    px[grab] = gx; py[grab] = gy; pz[grab] = grabTZ;
  }
}

// ---------- helpers ----------
function d2seg(qx, qy, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((qx - x1) * dx + (qy - y1) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const ex = x1 + dx * t - qx, ey = y1 + dy * t - qy;
  return ex * ex + ey * ey;
}

function cutAt(ax, ay, bx, by) {
  const samples = [[ax, ay], [(ax + bx) * 0.5, (ay + by) * 0.5], [bx, by]];
  const R = 9, R2 = R * R;
  for (let k = 0; k < C; k++) {
    if (!calive[k]) continue;
    const a = ca[k], b = cb[k];
    const ka = F / (F + pz[a]), kb = F / (F + pz[b]);
    const x1 = CX + (px[a] - CX) * ka, y1 = CY + (py[a] - CY) * ka;
    const x2 = CX + (px[b] - CX) * kb, y2 = CY + (py[b] - CY) * kb;
    let lox = Math.min(x1, x2) - R, hix = Math.max(x1, x2) + R;
    let cut = false;
    for (let s = 0; s < 3 && !cut; s++) {
      const p = samples[s];
      if (p[0] < lox || p[0] > hix) continue;
      if (d2seg(p[0], p[1], x1, y1, x2, y2) < R2) cut = true;
    }
    if (cut) { calive[k] = 0; aliveThreads--; }
  }
}

function burst(x, y) {
  gustV = Math.min(gustV + 600, 3400);
  const R = 150;
  for (let i = 0; i < N; i++) {
    if (pin[i]) continue;
    const dx = px[i] - x, dy = py[i] - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > R || d < 1) continue;
    const f = 1 - d / R;
    const imp = 22 * f * f;
    ox[i] -= dx / d * imp;
    oy[i] -= dy / d * imp;
    oz[i] += imp * 0.8;    // kicked toward the viewer
  }
}

// ---------- render ----------
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, vw, vh);

  // project all points, track extent for the contact shadow
  let minX = 1e9, maxX = -1e9, maxY = -1e9;
  for (let i = 0; i < N; i++) {
    const k = F / (F + pz[i]);
    SX[i] = CX + (px[i] - CX) * k;
    SY[i] = CY + (py[i] - CY) * k;
    if (px[i] < minX) minX = px[i];
    if (px[i] > maxX) maxX = px[i];
    if (py[i] > maxY) maxY = py[i];
  }

  // floor line
  ctx.strokeStyle = floorGrad;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(20, Math.round(floorY) + 0.5);
  ctx.lineTo(vw - 20, Math.round(floorY) + 0.5);
  ctx.stroke();

  // contact shadow (grows as the cloth nears the floor)
  const sh = Math.min(1, Math.max(0, (maxY - (floorY - 170)) / 170));
  if (sh > 0.02) {
    const cxp = (minX + maxX) / 2;
    const rx = Math.max(60, (maxX - minX) * 0.56);
    const sg = ctx.createRadialGradient(cxp, floorY + 8, 0, cxp, floorY + 8, rx);
    sg.addColorStop(0, 'rgba(0,0,0,' + (0.4 * sh).toFixed(3) + ')');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.translate(cxp, floorY + 8);
    ctx.scale(1, 0.14);
    ctx.translate(-cxp, -(floorY + 8));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(cxp, floorY + 8, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // shaded quads
  order.length = 0;
  const CW = COLS - 1;
  for (let i = 0; i < ROWS - 1; i++) {
    const rBase = rowR[i], gBase = rowG[i], bBase = rowB[i];
    for (let j = 0; j < CW; j++) {
      const q = i * CW + j;
      const p00 = i * COLS + j, p10 = p00 + 1, p01 = p00 + COLS, p11 = p01 + 1;
      const e1 = rc[p00], e2 = rc[p01], e3 = dc[p00], e4 = dc[p10];
      const ok = e1 >= 0 && e2 >= 0 && e3 >= 0 && e4 >= 0 &&
                 calive[e1] && calive[e2] && calive[e3] && calive[e4];
      quadAlive[q] = ok ? 1 : 0;
      if (!ok) continue;

      const ux = px[p10] - px[p00], uy = py[p10] - py[p00], uz = pz[p10] - pz[p00];
      const vx2 = px[p01] - px[p00], vy2 = py[p01] - py[p00], vz2 = pz[p01] - pz[p00];
      let nx = uy * vz2 - uz * vy2;
      let ny = uz * vx2 - ux * vz2;
      let nz = ux * vy2 - uy * vx2;
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;

      let dif = nx * LX + ny * LY + nz * LZ;
      if (dif < 0) dif = -dif;
      let sp = nx * HX + ny * HY + nz * HZ;
      if (sp < 0) sp = -sp;
      sp = sp * sp; sp = sp * sp; sp = sp * sp; sp = sp * sp * sp * sp; // ^32 approx -> use pow-free
      let spv = sp * 0.5;

      const lu = Math.sqrt(ux * ux + uy * uy + uz * uz);
      const lv = Math.sqrt(vx2 * vx2 + vy2 * vy2 + vz2 * vz2);
      const rest = (crest[e1] + crest[e3]) * 0.5;
      let stress = ((lu + lv) / (2 * rest) - 1) * 2.4;
      if (stress < 0) stress = 0; else if (stress > 1) stress = 1;

      let fog = (pz[p00] + pz[p11]) * 0.0007;
      if (fog < 0) fog = 0; else if (fog > 0.45) fog = 0.45;

      let br = (0.2 + 0.85 * dif) * qNoise[q] * (1 - fog);
      let r = rBase * br, g2 = gBase * br, b = bBase * br;
      if (stress > 0) {
        const s = stress * 0.55;
        r = r * (1 - s) + 255 * s;
        g2 = g2 * (1 - s) + 208 * s;
        b = b * (1 - s) + 168 * s;
      }
      r += spv * 255; g2 += spv * 240; b += spv * 220;
      if (r > 255) r = 255; else if (r < 0) r = 0;
      if (g2 > 255) g2 = 255; else if (g2 < 0) g2 = 0;
      if (b > 255) b = 255; else if (b < 0) b = 0;
      qfill[q] = 'rgb(' + (r | 0) + ',' + (g2 | 0) + ',' + (b | 0) + ')';
      zsum[q] = pz[p00] + pz[p11];
      order.push(q);
    }
  }

  // painter's order: far quads first
  order.sort((a, b) => zsum[b] - zsum[a]);
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  for (let n = 0; n < order.length; n++) {
    const q = order[n];
    const i = (q / CW) | 0, j = q - i * CW;
    const p00 = i * COLS + j, p10 = p00 + 1, p01 = p00 + COLS, p11 = p01 + 1;
    const st = qfill[q];
    ctx.fillStyle = st;
    ctx.strokeStyle = st;
    ctx.beginPath();
    ctx.moveTo(SX[p00], SY[p00]);
    ctx.lineTo(SX[p10], SY[p10]);
    ctx.lineTo(SX[p11], SY[p11]);
    ctx.lineTo(SX[p01], SY[p01]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // loose threads along torn boundaries
  ctx.beginPath();
  for (let k = 0; k < C; k++) {
    if (!calive[k]) continue;
    const a = ca[k];
    const i = (a / COLS) | 0, j = a - i * COLS;
    let n1, n2;
    if (ctype[k] === 0) {
      n1 = i > 0 ? quadAlive[(i - 1) * CW + j] : 0;
      n2 = i < ROWS - 1 ? quadAlive[i * CW + j] : 0;
    } else {
      n1 = j > 0 ? quadAlive[i * CW + j - 1] : 0;
      n2 = j < COLS - 1 ? quadAlive[i * CW + j] : 0;
    }
    if (n1 || n2) continue;
    const b = cb[k];
    ctx.moveTo(SX[a], SY[a]);
    ctx.lineTo(SX[b], SY[b]);
  }
  ctx.strokeStyle = 'rgba(243,214,170,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // pins: a thin brass wire with dots
  if (!pinsDropped) {
    let first = -1, last = -1;
    for (let j = 0; j < COLS; j++) if (pin[j]) { if (first < 0) first = j; last = j; }
    if (first >= 0) {
      ctx.strokeStyle = 'rgba(201,163,106,0.30)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(CX + (pinX[first] - CX), CY + (pinY[first] - CY) + 0.5);
      ctx.lineTo(CX + (pinX[last] - CX), CY + (pinY[last] - CY) + 0.5);
      ctx.stroke();
      for (let j = 0; j < COLS; j++) {
        if (!pin[j]) continue;
        const x = CX + (pinX[j] - CX), y = CY + (pinY[j] - CY);
        ctx.beginPath();
        ctx.arc(x, y, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = '#cf9b5e';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.stroke();
      }
    }
  }

  // grabbed point ring
  if (grab >= 0) {
    ctx.beginPath();
    ctx.arc(SX[grab], SY[grab], 7, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(230,193,148,0.85)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // blade cursor while cutting
  if (cutting) {
    ctx.beginPath();
    ctx.arc(mx, my, 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(224,96,60,0.9)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mx, my, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(224,96,60,0.9)';
    ctx.fill();
  }

  // live wind meter
  const pct = Math.min(1, windNow / (WMAX * 1.35)) * 100;
  windFill.style.width = pct.toFixed(1) + '%';
}

// ---------- input ----------
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  mx = e.clientX; my = e.clientY; pmx = mx; pmy = my;
  if (e.button === 2 || cutMode) {
    cutting = true;
    cutAt(mx, my, mx, my);
    return;
  }
  if (e.button !== 0) return;
  let best = -1, bd = 28 * 28;
  for (let i = 0; i < N; i++) {
    if (pin[i]) continue;
    const dx = SX[i] - mx, dy = SY[i] - my;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) {
    grab = best;
    grabSX = mx; grabSY = my; grabTZ = pz[best];
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('pointermove', (e) => {
  mx = e.clientX; my = e.clientY;
  if (cutting) cutAt(pmx, pmy, mx, my);
  if (grab >= 0) { grabSX = mx; grabSY = my; }
  pmx = mx; pmy = my;
});

function endPointer() {
  cutting = false;
  if (grab >= 0) {
    grab = -1;
    canvas.style.cursor = 'crosshair';
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('dblclick', (e) => burst(e.clientX, e.clientY));
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- controls ----------
windRange.addEventListener('input', (e) => {
  windBase = e.target.value / 100;
  windVal.textContent = e.target.value + '%';
});
drapeRange.addEventListener('input', (e) => {
  iters = +e.target.value;
  drapeVal.textContent = e.target.value;
});

function dropPins() {
  if (pinsDropped) return;
  pinsDropped = true;
  pin.fill(0);
  btnDrop.disabled = true;
}
function togglePause() {
  paused = !paused;
  btnPause.textContent = paused ? 'Resume' : 'Pause';
  btnPause.classList.toggle('on', paused);
}
function toggleCut() {
  cutMode = !cutMode;
  btnCut.classList.toggle('on', cutMode);
}
btnDrop.addEventListener('click', dropPins);
btnCut.addEventListener('click', toggleCut);
btnPause.addEventListener('click', togglePause);
btnReset.addEventListener('click', buildCloth);

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'r') buildCloth();
  else if (k === 'd') dropPins();
  else if (k === 'c') toggleCut();
  else if (k === 'w') gustV = Math.min(gustV + 2200, 3400);
});

let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildCloth, 200);
});

setTimeout(() => hintEl.classList.add('dim'), 9000);

// ---------- main loop ----------
buildCloth();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let el = now - last; last = now;
  if (el > 100) el = 100;
  fps += (1000 / Math.max(el, 1) - fps) * 0.05;

  if (!paused) {
    acc += el;
    let n = 0;
    while (acc >= 16.666 && n < 3) { step(DT); acc -= 16.666; n++; }
    if (n === 3) acc = 0;
  }
  render();

  statTimer += el;
  if (statTimer > 500) {
    statTimer = 0;
    statsEl.textContent = N.toLocaleString() + ' nodes \u00b7 ' +
      aliveThreads.toLocaleString() + ' threads \u00b7 ' + Math.round(fps) + ' fps';
  }
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
