<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Synthwave Rollercoaster</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050011; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 150%); 
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffff;
            transition: opacity 1s ease-out;
        }
    </style>
</head>
<body>
    <div id="loading">Initialize Simulation</div>
    <div id="overlay"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050011, 0.0035);
        scene.background = new THREE.Color(0x050011);

        const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x221155, 1.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xff00cc, 2);
        directionalLight.position.set(100, 200, 50);
        scene.add(directionalLight);

        // Generate Rollercoaster Path
        const points = [];
        const numPoints = 80;
        for (let i = 0; i < numPoints; i++) {
            const angle = (i / numPoints) * Math.PI * 2;
            const radius = 150 + Math.sin(angle * 5) * 60;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            // Add vertical drops and twists
            const y = Math.sin(angle * 4) * 40 + Math.cos(angle * 2) * 50 + Math.sin(angle * 8) * 15;
            points.push(new THREE.Vector3(x, y, z));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        curve.closed = true;

        // Track Geometry
        const segments = 600;
        const tubeGeometry = new THREE.TubeGeometry(curve, segments, 2.5, 12, true);
        const tubeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            wireframe: true, 
            emissive: 0x00aaff,
            emissiveIntensity: 0.8,
            transparent: true,
            opacity: 0.9
        });
        const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);
        scene.add(tube);

        // Core Track (inner solid pipe)
        const coreGeometry = new THREE.TubeGeometry(curve, segments, 1.0, 6, true);
        const coreMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x000000, 
            emissive: 0x000000 
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);

        // Environment - Grid Floor
        const gridHelper = new THREE.GridHelper(1000, 100, 0xff00cc, 0xff00cc);
        gridHelper.position.y = -100;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.4;
        scene.add(gridHelper);

        // Environment - Stars
        const starsGeometry = new THREE.BufferGeometry();
        const starsVertices = [];
        for(let i = 0; i < 8000; i++) {
            const x = THREE.MathUtils.randFloatSpread(2000);
            const y = THREE.MathUtils.randFloatSpread(2000);
            const z = THREE.MathUtils.randFloatSpread(2000);
            // Don't place stars too close to center
            if (Math.abs(x) < 200 && Math.abs(y) < 200 && Math.abs(z) < 200) continue;
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: true, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Floating geometric obstacles/scenery
        const objectsGeometry = new THREE.IcosahedronGeometry(8, 0);
        const objectsMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff00cc, 
            wireframe: true,
            emissive: 0xff00cc,
            emissiveIntensity: 0.5
        });
        const objectMesh = new THREE.InstancedMesh(objectsGeometry, objectsMaterial, 200);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < 200; i++) {
            dummy.position.set(
                THREE.MathUtils.randFloatSpread(800),
                THREE.MathUtils.randFloatSpread(400) + 50,
                THREE.MathUtils.randFloatSpread(800)
            );
            dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            const scale = Math.random() * 1.5 + 0.5;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            objectMesh.setMatrixAt(i, dummy.matrix);
        }
        scene.add(objectMesh);

        // Particles along the track
        const particleGeo = new THREE.BufferGeometry();
        const particleVerts = [];
        for(let i=0; i<1500; i++) {
            const p = curve.getPointAt(Math.random());
            particleVerts.push(
                p.x + THREE.MathUtils.randFloatSpread(40),
                p.y + THREE.MathUtils.randFloatSpread(40),
                p.z + THREE.MathUtils.randFloatSpread(40)
            );
        }
        particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(particleVerts, 3));
        const particleMat = new THREE.PointsMaterial({color: 0x00ffff, size: 1.2, transparent: true, opacity: 0.6});
        const trackParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(trackParticles);

        // Pre-compute Frenet Frames for smooth banking
        const frenetFrames = curve.computeFrenetFrames(segments, true);

        // Animation Loop
        const clock = new THREE.Clock();
        const speed = 0.04; 

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
        }, 1000);

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Camera positioning and movement
            const t = (time * speed) % 1;
            const pos = curve.getPointAt(t);
            const lookAt = curve.getPointAt((t + 0.005) % 1);
            
            // Calculate banking/roll based on normals
            const segmentIndex = Math.floor(t * segments);
            const nextSegmentIndex = (segmentIndex + 1) % segments;
            const interpolation = (t * segments) - segmentIndex;
            
            const normal = new THREE.Vector3().copy(frenetFrames.normals[segmentIndex]);
            const nextNormal = new THREE.Vector3().copy(frenetFrames.normals[nextSegmentIndex]);
            const blendedNormal = normal.lerp(nextNormal, interpolation).normalize();
            
            const binormal = new THREE.Vector3().copy(frenetFrames.binormals[segmentIndex]);
            const nextBinormal = new THREE.Vector3().copy(frenetFrames.binormals[nextSegmentIndex]);
            const blendedBinormal = binormal.lerp(nextBinormal, interpolation).normalize();

            // Offset camera slightly above the track
            const cameraOffset = blendedNormal.clone().multiplyScalar(4);
            camera.position.copy(pos).add(cameraOffset);

            // Orient the camera correctly with banking
            const m = new THREE.Matrix4();
            const up = blendedNormal.clone();
            m.lookAt(camera.position, lookAt, up);
            camera.quaternion.setFromRotationMatrix(m);
            
            // Add slight camera shake based on speed
            const shake = Math.sin(time * 50) * 0.05;
            camera.rotateZ(shake * (1 - Math.abs(camera.position.y) / 100)); // less shake at peaks

            // Animate environment
            gridHelper.position.z = (time * 15) % 100; // moving grid illusion
            objectMesh.rotation.y = time * 0.1;
            objectMesh.rotation.x = Math.sin(time * 0.05) * 0.2;
            
            trackParticles.rotation.y = time * 0.02;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
