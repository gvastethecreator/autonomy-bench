<!DOCTYPE html>
<html lang="en" data-level="A">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autonomy Bench</title>
  <meta name="description" content="Same prompt. Different models. Live HTML takes from frozen Autonomy Bench runs.">
  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Departure Mono";
      src: url("fonts/DepartureMono-Regular.woff2") format("woff2"),
           url("fonts/DepartureMono-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;

    :root {
      --bg: #111;
      --bg-raise: #181818;
      --ink: #DDD;

      --level-c: oklch(0.730 0.230 230);
      --font: "Departure Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --type: clamp(10px, 0.22vw + 9px, 13px);
      --mark: clamp(16px, 0.55vw + 14px, 34px);
      --control: clamp(32px, 0.45vw + 30px, 44px);
      --gap: clamp(6px, 0.35vw + 4px, 12px);
      --pad-x: clamp(12px, 1.1vw + 8px, 40px);
      --pad-y: clamp(8px, 0.35vw + 6px, 20px);
      --frame-min: clamp(200px, 14vw, 360px);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease: var(--ease-out);
      --move: 320ms;
      --move-out: 240ms;
      --snap: 160ms;
      --drawer: clamp(280px, 28vw, 520px);
      --fit-w: 1280px;
      --fit-h: 800px;
      --radius: 2px;

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { color-scheme: dark; }
    body {

      font-synthesis: none;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);

      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
      transition-property: color, background-color, border-color, scale, opacity;

      transition-timing-function: var(--ease);
    }
    button:active { scale: 0.96; }
    button:disabled {

      cursor: not-allowed;

    button:focus-visible,
    a:focus-visible,

    .app {

    .mast {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-column: 1 / -1;
      gap: var(--gap) calc(var(--gap) * 2);

      padding: max(var(--pad-y), env(safe-area-inset-top)) max(var(--pad-x), env(safe-area-inset-right)) calc(var(--pad-y) + 2px) max(var(--pad-x), env(safe-area-inset-left));
      background: var(--bg);

    .mark {

    .picks { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; }
    .pick {
      position: relative;
      display: flex;
      min-width: 0;
    }
    .pick-native {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
      padding: 0;
      pointer-events: none;
    }
    .pick-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      min-height: var(--control);

      padding: 0 10px;

      height: 16px;

      transition: rotate var(--snap) var(--ease);

    .pick-btn[aria-expanded="true"] .pick-caret { rotate: 180deg; }
    .pick-btn:hover,

      color: var(--ink);
      border-color: var(--edge-strong);
    }
    .pick-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .pick-caret .icon { width: 16px; height: 16px; }

      position: fixed;
      z-index: 24;
      margin: 0;
      padding: 4px;
      list-style: none;
      border-radius: var(--radius);
      min-width: 10rem;
      max-width: min(320px, calc(100vw - 16px));
      max-height: min(320px, 50vh);

    }
    .pick-list[hidden] { display: none !important; }
    .pick-list [role="option"] {
      display: flex;
      align-items: center;
      min-height: var(--control);
      padding: 0 10px;
      color: var(--mute);

    }
    .pick-list [role="option"]:hover,
    .pick-list [role="option"]:focus-visible {
      color: var(--ink);
      outline: none;
    }
    .pick-list [role="option"][aria-selected="true"] {
      color: var(--bg);
      background: var(--ink);
    }
    .prompt-sub {
      display: flex;
      align-items: start;
      gap: 8px;
      grid-column: 1 / -1;
      margin: 0;
      max-width: none;
      padding: 0;
      color: var(--ink);
      text-align: start;
      line-height: 1.45;
    }
    .prompt-sub .prompt-text {
      display: -webkit-box;

      -webkit-line-clamp: 2;
      overflow: hidden;
      min-width: 0;
    }
    .modes, .arranges, .scales, .levels, .html-switch { display: flex; gap: var(--gap); }
    .modes button,
    .arranges button,
    .scales button,
    .levels button,
    .evidence button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--control);
      padding: 0 10px;
      color: var(--mute);
      border: 2px solid var(--edge);
      white-space: nowrap;
    }
    .modes button.active,
    .arranges button.active,
    .scales button.active,
    .evidence button.active {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
    }
    .levels button {
      flex: 1 1 0;
      min-width: 0;
      padding: 0;
    }
    .levels [data-level="A"]:hover:not(:disabled):not(.active),

    .levels [data-level="C"]:hover:not(:disabled):not(.active),

    .levels [data-level="A"].active {
      color: var(--bg);
      background: var(--level-a);
      border-color: var(--level-a);
    }
    .levels [data-level="B"].active {
      color: var(--bg);
      background: var(--level-b);
      border-color: var(--level-b);
    }
    .levels [data-level="C"].active {
      color: var(--bg);
      background: var(--level-c);
      border-color: var(--level-c);
    }
    .stage {
      position: relative;
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      gap: 0;
      padding: var(--gap);
      background: var(--bg);
    }
    .stage-port {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }
    .frames {
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: var(--gap);
      background: var(--bg);
    }
    .frames.mode-single { grid-template-columns: minmax(0, 1fr); }
    .frames.arrange-columns {
      grid-template-columns: repeat(var(--n, 1), minmax(var(--frame-min), 1fr));
      overflow-x: auto;
    }
    .frames.mode-single.arrange-columns { grid-template-columns: minmax(0, 1fr); overflow: hidden; }
    .frames.arrange-grid {
      grid-template-columns: repeat(auto-fit, minmax(var(--frame-min), 1fr));
      grid-auto-rows: minmax(220px, 1fr);
      overflow: auto;
    }
    .frames.arrange-rows {
      grid-template-columns: minmax(0, 1fr);

      overflow-y: auto;

    .frame {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      border: 2px solid var(--edge-strong);
      overflow: hidden;
      container-type: inline-size;
    }
    .frame .port {

    }
    .frames.scale-fill iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0a0a0a;
    }
    .frames.scale-fit iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--fit-w);
      height: var(--fit-h);
      border: 0;
      background: #0a0a0a;
      transform-origin: 0 0;
    }
    .frame .port iframe {
      display: block;
      border: 0;
      background: #0a0a0a;
    }
    .frame-loader,
    .source-loader {
      position: absolute;

      background: #0a0a0a;

    }
    .source-loader { background: var(--bg); }
    .source-loader .frame-loader-text {
      font: 11px/1.2 var(--font);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .frame-loader-copy,
    .stage-loader-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
      text-align: center;
    }
    .frame-loader-copy { padding: 12px 14px; min-width: 0; }
    .stage-loader-copy {

      padding: 24px;
      max-width: min(40rem, 92%);
    }
    .frame-loader-text,
    .frame-loader-model {

      max-width: 100%;

      overflow-wrap: break-word;
      text-wrap: balance;
    }
    .frame-loader-text {
      font: clamp(11px, 6cqi, 16px)/1.25 var(--font);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .frame-loader-model {
      font: clamp(10px, 4.6cqi, 13px)/1.3 var(--font);
      letter-spacing: 0.02em;
    }
    .frame .tag {

      top: 8px;
      inset-inline-start: 8px;

      align-items: center;

      min-width: 0;

      border: 2px solid var(--edge-strong);
      pointer-events: none;
    }
    .tag-title {

    }
    .frame .tag .badge { flex-shrink: 0; }
    .frames.mode-single .tag { display: none; }
    .frames.arrange-grid .tag,
    .frames.arrange-columns .tag {
      font-size: clamp(8px, 3.8cqi, 11px);
    }
    .unshot {
      height: 100%;

    .unshot .script {

    .unshot .why {
      margin: 16px 0 0;

      min-width: 0;

    }

    .unshot .scramble-mid {

    }
    .frames.arrange-grid .unshot,
    .frames.arrange-columns .unshot {
      padding: 16px 12px;
    }
    .frames.arrange-grid .unshot .script,
    .frames.arrange-columns .unshot .script {
      font-size: clamp(10px, 5.2cqi, 16px);
      max-width: 100%;
    }
    .frames.arrange-grid .unshot .why,
    .frames.arrange-columns .unshot .why,
    .frames.arrange-grid .unshot .kicker,
    .frames.arrange-columns .unshot .kicker {
      font-size: clamp(8px, 3.6cqi, 11px);
    }
    .film {
      display: flex;
      flex-direction: column;
      grid-column: 1;
      grid-row: 2;
      min-height: 0;
      width: var(--film, 248px);
      overflow: hidden;
      padding: var(--pad-y) 8px max(var(--pad-y), env(safe-area-inset-bottom));
      padding-inline-start: max(8px, env(safe-area-inset-left));

    }

    .film-toggle:hover { color: var(--ink); border-color: var(--edge-strong); }

    }

    }

      width: 100%;
      height: var(--control);

    function escapeHtml(value) {
  return String(value).replace(
    /[&<>"']/g,
    (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch],
  );
}

function highlightAttrs(rest) {
  let out = '';
  const re = /(\s+)|([^\s=/>]+)(?:(\s*=\s*)("[^"]*"|'[^']*'|[^\s/>]+))?/g;
  let m;
  while ((m = re.exec(rest))) {
    if (m[1]) {
      out += escapeHtml(m[1]);
      continue;
    }
    out += `<span class="tok-attr">${escapeHtml(m[2])}</span>`;
    if (m[3] != null) {
      out += `<span class="tok-punc">${escapeHtml(m[3])}</span>`;
      out += `<span class="tok-str">${escapeHtml(m[4])}</span>`;
    }
  }
  return out;
}

function highlightTag(tag) {
  const m = /^(<\/?)([^\s/>]*)([\s\S]*?)(\/?>)$/.exec(tag);
  if (!m) return `<span class="tok-tag">${escapeHtml(tag)}</span>`;
  return (
    `<span class="tok-punc">${escapeHtml(m[1])}</span>` +
    (m[2] ? `<span class="tok-tag">${escapeHtml(m[2])}</span>` : '') +
    highlightAttrs(m[3]) +
    `<span class="tok-punc">${escapeHtml(m[4])}</span>`
  );
}

function nextTagEnd(input, start) {
  const end = input.indexOf('>', start);
  return end === -1 ? input.length : end + 1;
}

function highlightHtml(source) {
  const input = String(source ?? '');
  let out = '';
  let i = 0;
  while (i < input.length) {
    if (input.startsWith('<!--', i)) {
      const end = input.indexOf('-->', i + 4);
      const endAt = end === -1 ? input.length : end + 3;
      out += `<span class="tok-com">${escapeHtml(input.slice(i, endAt))}</span>`;
      i = endAt;
      continue;
    }
    if (input[i] === '<') {
      const endAt = nextTagEnd(input, i);
      const tag = input.slice(i, endAt);
      out += highlightTag(tag);
      i = endAt;
      const rawName = /^<\s*([^\s/>]+)/.exec(tag);
      const name = rawName ? rawName[1].toLowerCase() : '';
      const selfClosing = /\/\s*>$/.test(tag) || tag.startsWith('</');
      if (!selfClosing && (name === 'script' || name === 'style' || name === 'textarea')) {
        const close = `</${name}>`;
        const closeAt = input.toLowerCase().indexOf(close, i);
        if (closeAt === -1) {
          out += escapeHtml(input.slice(i));
          break;
        }
        out += escapeHtml(input.slice(i, closeAt));
        const closeEnd = nextTagEnd(input, closeAt);
        out += highlightTag(input.slice(closeAt, closeEnd));
        i = closeEnd;
      }
      continue;
    }
    const next = input.indexOf('<', i);
    const end = next === -1 ? input.length : next;
    out += escapeHtml(input.slice(i, end));
    i = end;
  }
  return out;
}

    function canScrambleText(value) {
  const text = String(value ?? '');
  return text.length > 0 && !/[&<>]/.test(text);
}

function splitChangedText(from, to, minKeep = 2) {
  const a = String(from ?? '');
  const b = String(to ?? '');
  if (a === b) {
    return { prefix: b, fromMid: '', toMid: '', suffix: '' };
  }
  let prefixLen = 0;
  const limit = Math.min(a.length, b.length);
  while (prefixLen < limit && a[prefixLen] === b[prefixLen]) prefixLen += 1;
  let suffixLen = 0;
  while (
    suffixLen < a.length - prefixLen &&
    suffixLen < b.length - prefixLen &&
    a[a.length - 1 - suffixLen] === b[b.length - 1 - suffixLen]
  ) {
    suffixLen += 1;
  }
  if (prefixLen < minKeep) prefixLen = 0;
  if (suffixLen < minKeep) suffixLen = 0;
  return {
    prefix: b.slice(0, prefixLen),
    fromMid: a.slice(prefixLen, a.length - suffixLen),
    toMid: b.slice(prefixLen, b.length - suffixLen),
    suffix: suffixLen ? b.slice(b.length - suffixLen) : '',
  };
}

const IFRAME_STAGGER_GAP_MS = 120;

function iframeLoadJobs(root) {

function loaderProgressLabel(current, total, name = 'Loading') {

function yieldMain(ms = IFRAME_STAGGER_GAP_MS) {
  const gap = Math.max(0, Number(ms) || 0);
  return new Promise((resolve) => {
    const rest = () => {
      if (gap) setTimeout(resolve, gap);
      else resolve();
    };
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => requestAnimationFrame(rest));
    } else rest();
  });
}

async function loadIframesStaggered(iframes, options = {}) {
  const items = [...iframes];
  const {
    isCurrent = () => true,
    loadOne,
    afterEach,
    waitGap = yieldMain,
    gapMs = IFRAME_STAGGER_GAP_MS,
  } = options;
  for (let i = 0; i < items.length; i++) {
    if (!isCurrent()) return { loaded: i, aborted: true, total: items.length };
    await loadOne(items[i], i, items.length);
    if (!isCurrent()) return { loaded: i + 1, aborted: true, total: items.length };
    if (afterEach) await afterEach(items[i], i, items.length);
    if (!isCurrent()) return { loaded: i + 1, aborted: true, total: items.length };
    if (i < items.length - 1 && gapMs > 0) await waitGap(gapMs);
  }
  return { loaded: items.length, aborted: !isCurrent(), total: items.length };
}

    function monthKey(stamp) {
  const match = String(stamp || '').match(/^(\d{4}-\d{2})/);
  return match ? match[1] : '';
}

function monthsFromDates(dates) {
  const seen = new Set();
  const out = [];
  for (const stamp of dates || []) {
    const key = monthKey(stamp);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(key);
  }
  return out.sort((a, b) => b.localeCompare(a));
}

function datesInMonth(dates, month) {
  const key = monthKey(month) || String(month || '');
  if (!key) return [];
  return (dates || []).filter((stamp) => monthKey(stamp) === key).sort((a, b) => b.localeCompare(a));
}

function formatMonth(month) {
  const match = String(month || '').match(/^(\d{4})-(\d{2})$/);
  if (!match) return String(month || '');
  const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, 1));
  if (Number.isNaN(date.getTime())) return String(month);
  return new Intl.DateTimeFormat('en-US', {
    month: 'long',
    year: 'numeric',
    timeZone: 'UTC',
  }).format(date);
}

function formatRunInMonth(stamp) {
  const full = String(stamp || '').match(/^(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})(\d{2})(?:-a(\d+))?$/);
  if (!full) return String(stamp || '');
  let out = `${full[3]} · ${full[4]}:${full[5]}`;
  if (full[7]) out += ` a${full[7]}`;
  return out;
}

function pickCellForMonth(cells, month) {
  const key = monthKey(month) || String(month || '');
  const inMonth = (cells || []).filter((cell) => monthKey(cell.date) === key);
  inMonth.sort((a, b) => String(b?.date || '').localeCompare(String(a?.date || '')));
  return inMonth[0] || null;
}

      if (state.model) params.set('model', state.model);
      if (state.mode && state.mode !== 'single') params.set('mode', state.mode);
      if (state.mode !== 'single') params.set('arrange', state.arrange);
      if (state.scale) params.set('scale', state.scale);
      if (state.promptRevision) params.set('prompt', String(state.promptRevision));
      if (state.month) params.set('month', state.month);
      if (state.date) params.set('date', state.date);
      const filmDefault = window.matchMedia('(max-width: 900px)').matches;
      if (state.filmCompact !== filmDefault) {
        params.set('film', state.filmCompact ? 'compact' : 'open');
      }
      const qs = params.toString();
      history.replaceState(null, '', qs ? '?' + qs : location.pathname);
    }
    function renderNav() {
      const currentExp = CATALOG.experiments.find(e => e.id === state.experiment) || {};
      const title = (currentExp.title || state.experiment || 'Autonomy') + ' Bench';
      document.title = title;
      document.getElementById('title').textContent = title;
      document.getElementById('who').textContent = state.model + ' · ' + state.level + ' · v' + state.promptRevision;
      const prompt = currentPromptText();
      document.getElementById('prompt-text').setAttribute('aria-hidden', 'true');
      document.getElementById('prompt-sub').setAttribute('aria-label', prompt ? oneLine(prompt) : 'No prompt on file for this cell.');
      document.getElementById('prompt-sub').title = prompt || '';
      const cell = currentCell();
      setOptions(
        document.getElementById('experiments'),
        CATALOG.experiments.map(e => ({ value: e.id, label: e.title || e.id })),
        state.experiment
      );
      document.getElementById('models').innerHTML = CATALOG.models.map(m => {
        const live = modelLive(m.id);
        const current = m.id === state.model;
        const ghost = live ? '' : ' ghost';
        const on = (state.mode === 'single' ? current : live) ? ' active' : '';
        return '<button type="button" class="' + (on + ghost).trim() + '" data-model="' + m.id + '" title="' + esc(m.id) + '"' + (current ? ' aria-current="true"' : '') + '>' + brandIcon(modelBrand(m.id)) + '<span class="film-text">' + esc(m.id) + '</span></button>';
      }).join('');
      syncModelsScroll();
      document.documentElement.dataset.level = state.level;
      document.querySelectorAll('.levels [data-level]').forEach(b => {
        const on = state.mode === 'ladder' || b.dataset.level === state.level;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        if (b.dataset.level === state.level) b.setAttribute('aria-current', 'true');
        else b.removeAttribute('aria-current');
      });
      document.querySelectorAll('[data-mode]').forEach(b => {
        const on = b.dataset.mode === state.mode;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.querySelectorAll('[data-arrange]').forEach(b => {
        const usable = state.mode !== 'single';
        b.disabled = !usable;
        b.classList.toggle('active', usable && b.dataset.arrange === state.arrange);
      });
      document.querySelectorAll('[data-scale]').forEach(b => b.classList.toggle('active', b.dataset.scale === state.scale));
      const revs = revisionsFor(state.experiment, state.level);
      setOptions(
        document.getElementById('prompt-version'),
        revs.map(r => ({ value: String(r.revision), label: 'Prompt v' + r.revision })),
        String(state.promptRevision)
      );
      const dates = datesFor(state.experiment, state.level, state.promptRevision);
      const months = monthsFromDates(dates);
      const inMonth = datesInMonth(dates, state.month);
      setOptions(
        document.getElementById('run-month'),
        months.map(m => ({ value: m, label: formatMonth(m) })),
        state.month
      );
      const runWrap = document.getElementById('run-pick-wrap');
      const runPick = document.getElementById('run-pick');
      if (inMonth.length > 1) {
        runWrap.hidden = false;
        setOptions(
          runPick,
          [{ value: '', label: 'All' }].concat(inMonth.map(d => ({ value: d, label: formatRunInMonth(d) }))),
          state.date
        );
      } else {
        if (openPick && runWrap.contains(openPick)) closePick(openPick);
        runWrap.hidden = true;
        setOptions(runPick, [], '');
      }
      const promptBtn = document.getElementById('open-prompt');
      promptBtn.disabled = !prompt;
      document.getElementById('open-html').disabled = !(cell && cell.src);
      document.getElementById('open-receipt').disabled = !(cell && cell.receipt);
      if (!(cell && cell.src) && state.sourceOpen) setDrawer('source', false);
      if (!(cell && cell.receipt) && state.receiptOpen) setDrawer('receipt', false);
    }
    function renderStage() {
      const frames = document.getElementById('frames');
      const specs = desiredFrames();
      const keys = specs.map(s => frameKey(s.title, s.cell));
      const same = keys.length === frameKeys.length && keys.every((k, i) => k === frameKeys[i]);
      frames.className = 'frames mode-' + state.mode + ' arrange-' + state.arrange + ' scale-' + state.scale;
      frames.style.setProperty('--n', String(Math.max(specs.length, 1)));
      const cell = currentCell();
      document.getElementById('meta').textContent = cell ? cell.cellId : '';
      if (!same) {
        frames.innerHTML = specs.map(s => frameMarkup(s.title, s.cell)).join('') || '<p class="empty">No takes for this filter.</p>';
        frameKeys = keys;
      }
      syncFit();
      syncDrawers();
    }
    function framesWouldChange() {
      const keys = desiredFrames().map(s => frameKey(s.title, s.cell));
      return keys.length !== frameKeys.length || keys.some((k, i) => k !== frameKeys[i]);
    }
    async function swapStage(token) {
      const specs = desiredFrames();
      const pending = specs.filter(s => s.cell && s.cell.src);
      await showLoader(pending[0] && pending[0].cell);
      await waitCopyMotion();
      if (token !== stageToken) return;
      await liveCopy();
      if (token !== stageToken) return;
      renderStage();
      if (token !== stageToken) return;
      const frames = document.getElementById('frames');
      const jobs = iframeLoadJobs(frames);
      let revealed = false;
      async function reveal() {
        if (revealed || token !== stageToken) return;
        revealed = true;
        revealStageText();
        await hideLoader(token, jobs.length > 1);
      }
      await loadIframesStaggered(jobs, {
        isCurrent: () => token === stageToken,
        loadOne: async (iframe) => {
          if (!revealed) {
            const frame = iframe.closest('.frame');
            applyLoaderCopy({
              title: experimentTitle(),
              level: frame && frame.getAttribute('data-level'),
              model: frame && frame.getAttribute('data-model')
            });
          }
          const reason = await waitIframeSettled(iframe, token, IFRAME_LOAD_TIMEOUT_MS);
          if (reason === 'aborted' || token !== stageToken) return;
          markFrameReady(iframe);
        },
        afterEach: () => reveal(),
        waitGap: yieldMain,
        gapMs: IFRAME_STAGGER_GAP_MS
      });
      if (token !== stageToken) return;
      await reveal();
      document.getElementById('stage').removeAttribute('aria-busy');
    }
    function render() {
      snapFilters();
      renderNav();
      syncUrl();
      if (!framesWouldChange()) {
        liveCopy();
        renderStage();
        return;
      }
      const token = ++stageToken;
      swapStage(token);
    }
    function onExperiment(id) {
      state.experiment = id;
      state.promptRevision = maxRevision(state.experiment, state.level);
      state.date = '';
      render();
    }
    function onLevel(level) {
      state.level = level;
      state.promptRevision = maxRevision(state.experiment, state.level);
      state.date = '';
      render();
    }
    function onMode(mode) {
      state.mode = mode;
      applyModeDefaults(mode, true);
      render();
    }
    paintIcons();
    document.addEventListener('click', e => {
      const opt = e.target.closest('.pick-list [role="option"]');
      if (opt) {
        choosePick(opt.closest('.pick'), opt.dataset.value);
        return;
      }
      const btn = e.target.closest('.pick-btn');
      if (btn) {
        const pick = btn.closest('.pick');
        if (pick.classList.contains('is-open')) closePick(pick);
        else openPickMenu(pick);
        return;
      }
      if (openPick) closePick(openPick);
    });
    document.addEventListener('keydown', e => {
      if (!openPick && !(e.target && e.target.closest && e.target.closest('.pick-btn'))) return;
      const pick = openPick || (e.target && e.target.closest('.pick'));
      if (!pick) return;
      const list = pick.querySelector('.pick-list');
      const options = list ? [...list.querySelectorAll('[role="option"]')] : [];
      const current = document.activeElement && options.includes(document.activeElement)
        ? document.activeElement
        : options.find(o => o.getAttribute('aria-selected') === 'true') || options[0];
      const idx = options.indexOf(current);
      if (e.key === 'Escape') {
        e.preventDefault();
        closePick(pick);
        const btn = pick.querySelector('.pick-btn');
        if (btn) btn.focus();
        return;
      }
      if (!openPick && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        openPickMenu(pick);
        return;
      }
      if (!openPick) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        (options[Math.min(idx + 1, options.length - 1)] || options[0]).focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        (options[Math.max(idx - 1, 0)] || options[0]).focus();
      } else if (e.key === 'Home') {
        e.preventDefault();
        if (options[0]) options[0].focus();
      } else if (e.key === 'End') {
        e.preventDefault();
        if (options.length) options[options.length - 1].focus();
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (current) choosePick(pick, current.dataset.value);
      } else if (e.key === 'Tab') {
        closePick(pick);
      }
    });
    window.addEventListener('resize', () => { if (openPick) closePick(openPick); });
    applyFilmCompact();
    drawerOverlay.addEventListener('change', () => {
      ['drawer-source', 'drawer-receipt'].forEach(id => {
        const el = document.getElementById(id);
        stopMotion(el);
        clearDrawerInline(el);
      });
    });
    document.getElementById('film-toggle').addEventListener('click', () => {
      state.filmCompact = !state.filmCompact;
      applyFilmCompact();
      syncUrl();
    });
    document.getElementById('experiments').addEventListener('change', e => {
      onExperiment(e.target.value);
    });
    document.getElementById('models').addEventListener('click', e => {
      const b = e.target.closest('[data-model]'); if (!b) return;
      state.model = b.dataset.model; render();
    });
    document.querySelector('.levels').addEventListener('click', e => {
      const b = e.target.closest('[data-level]'); if (!b) return;
      onLevel(b.dataset.level);
    });
    document.querySelector('.modes').addEventListener('click', e => {
      const b = e.target.closest('[data-mode]'); if (!b) return;
      onMode(b.dataset.mode);
    });
    document.getElementById('arranges').addEventListener('click', e => {
      const b = e.target.closest('[data-arrange]'); if (!b || b.disabled) return;
      state.arrange = b.dataset.arrange; render();
    });
    document.querySelector('.scales').addEventListener('click', e => {
      const b = e.target.closest('[data-scale]'); if (!b) return;
      state.scale = b.dataset.scale; render();
    });
    document.getElementById('prompt-version').addEventListener('change', e => {
      state.promptRevision = Number(e.target.value) || 1;
      state.date = '';
      render();
    });
    document.getElementById('run-month').addEventListener('change', e => {
      state.month = e.target.value;
      state.date = '';
      render();
    });
    document.getElementById('run-pick').addEventListener('change', e => {
      state.date = e.target.value;
      render();
    });
    document.getElementById('open-prompt').addEventListener('click', e => {
      copyText(currentPromptText(), e.currentTarget, 'Prompt copied');
    });
    document.getElementById('open-html').addEventListener('click', () => {
      const cell = currentCell();
      if (!cell || !cell.src) return;
      setDrawer('source', !state.sourceOpen);
      if (state.sourceOpen) loadHtmlSource(cell.src);
    });
    document.getElementById('open-receipt').addEventListener('click', () => {
      const cell = currentCell();
      if (!cell || !cell.receipt) return;
      setDrawer('receipt', !state.receiptOpen);
      if (state.receiptOpen) document.getElementById('receipt-body').innerHTML = receiptMarkup(cell);
    });
    document.getElementById('close-source').addEventListener('click', () => setDrawer('source', false));
    document.getElementById('close-receipt').addEventListener('click', () => setDrawer('receipt', false));
    document.getElementById('copy-source').addEventListener('click', e => {
      copyText(rawSource, e.currentTarget, 'Source copied');
    });
    document.addEventListener('keydown', e => {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.target && e.target.closest && (e.target.closest('.pick-btn') || e.target.closest('.pick-list'))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') {
        if (closePick() || closeLastDrawer()) e.preventDefault();
        return;
      }
      if (e.key === '1') { onLevel('A'); }
      if (e.key === '2') { onLevel('B'); }
      if (e.key === '3') { onLevel('C'); }
      if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        const btn = document.getElementById('open-prompt');
        if (!btn.disabled) copyText(currentPromptText(), btn, 'Prompt copied');
      }
      if (e.key === 'h' || e.key === 'H') {
        const cell = currentCell();
        if (!cell || !cell.src) return;
        e.preventDefault();
        setDrawer('source', !state.sourceOpen);
        if (state.sourceOpen) loadHtmlSource(cell.src);
      }
      if (e.key === 'r' || e.key === 'R') {
        const cell = currentCell();
        if (!cell || !cell.receipt) return;
        e.preventDefault();
        setDrawer('receipt', !state.receiptOpen);
        if (state.receiptOpen) document.getElementById('receipt-body').innerHTML = receiptMarkup(cell);
      }
      if (e.key === '[') {
        e.preventDefault();
        state.filmCompact = !state.filmCompact;
        applyFilmCompact();
        syncUrl();
      }
    });
    applyModeDefaults(state.mode, !q.get('arrange') && !q.get('scale'));
    if (q.get('arrange')) state.arrange = q.get('arrange');
    if (q.get('scale')) state.scale = q.get('scale');
    fetch('catalog.json')
      .then(res => {
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      })
      .then(data => {
        CATALOG = data;
        state.experiment = q.get('experiment') || (CATALOG.experiments[0] || {}).id || '';
        state.model = q.get('model') || (CATALOG.models.find(m => m.playable) || CATALOG.models[0] || {}).id || '';
        if (!state.promptRevision) state.promptRevision = maxRevision(state.experiment, state.level);
        snapFilters();
        render();
      })
      .catch(() => {
        document.getElementById('frames').innerHTML = '<p class="empty">Could not load catalog.json.</p>';
        hideLoader(++stageToken);
      });
  </script>
</body>
</html>
