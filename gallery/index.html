<!DOCTYPE html>

  <link rel="alternate" type="text/plain" href="llms.txt" title="llms.txt">

  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Departure Mono";
      src: url("fonts/DepartureMono-Regular.woff2") format("woff2"),
           url("fonts/DepartureMono-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #0c0c0c;
      --bg-raise: #1e1e1e;
      --ink: #DDD;
      --mute: #8A8A8A;
      --edge: rgba(221, 221, 221, 0.10);
      --edge-strong: rgba(221, 221, 221, 0.28);
      --ok: #8FCB9B;
      --warn: #C8B87A;
      --bad: #D4897A;
      --gold: #E6C35C;
      --level-a: oklch(0.730 0.230 20);
      --level-b: oklch(0.730 0.230 120);
      --level-c: oklch(0.730 0.230 230);
      --font: "Departure Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --type: clamp(10px, 0.22vw + 9px, 13px);
      --mark: clamp(16px, 0.55vw + 14px, 34px);
      --control: clamp(32px, 0.45vw + 30px, 44px);
      --gap: clamp(6px, 0.35vw + 4px, 12px);
      --pad-x: clamp(12px, 1.1vw + 8px, 40px);
      --pad-y: clamp(8px, 0.35vw + 6px, 20px);
      --frame-min: clamp(200px, 14vw, 360px);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease: var(--ease-out);
      --move: 320ms;
      --move-out: 240ms;
      --snap: 160ms;
      --drawer: clamp(280px, 28vw, 520px);
      --fit-w: 1280px;
      --fit-h: 800px;
      --radius: 2px;

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { color-scheme: dark; }
    body {
      font: var(--type)/1.45 var(--font);
      font-synthesis: none;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    a { color: var(--ink); text-decoration-thickness: from-font; text-underline-position: from-font; }
    a:hover { color: #fff; }
    button, select {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
      transition-property: color, background-color, border-color, scale, opacity;
      transition-duration: var(--snap);
      transition-timing-function: var(--ease);
    }
    button:active { scale: 0.96; }
    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      scale: 1;

    button:focus-visible,
    a:focus-visible,

    .icon {

      height: 18px;

      border: 2px solid var(--ink);

    .skip:focus { inset-inline-start: 8px; }
    .app {
      height: 100%;

      grid-template-rows: auto minmax(0, 1fr);

    .mast {

      align-items: center;
      padding: max(var(--pad-y), env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) calc(var(--pad-y) + 2px) max(8px, env(safe-area-inset-left));

      justify-content: center;

      box-sizing: content-box;

      min-width: 1.15em;
      height: 1em;
      overflow: hidden;
      white-space: nowrap;
      line-height: 1;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      font-size: 0.9em;

    .mark-text { min-width: 0; }
    .repo {

    .repo:hover,

    .repo .icon {

      height: 12px;

    .repo-text {

      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mast-tools {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      justify-content: end;
      align-items: center;
      min-width: 0;
    }
    .report-group {
      display: inline-flex;
      align-items: center;
      align-self: center;
      gap: 3px;
      min-height: var(--control);
      padding: 3px;
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      background: var(--bg-raise);
    }

    .report-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--edge-strong); }

    .picks { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; }

      display: flex;
      min-width: 0;

    .pick[hidden] { display: none !important; }
    .pick-native {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
      padding: 0;
      pointer-events: none;
    }
    .pick-btn {
      display: inline-flex;

      justify-content: flex-start;

      min-width: 0;
      min-height: var(--control);
      max-width: 280px;
      padding: 0 10px;
      color: var(--mute);
      background: var(--bg-raise);
      border: 2px solid var(--edge);
      white-space: nowrap;
      text-align: start;
    }
    .pick-lead {

    }

      height: 16px;

    .pick-label {

      text-overflow: ellipsis;
      text-align: start;

    .pick-mark {

    .pick-caret {

    .pick-btn[aria-expanded="true"] .pick-caret { rotate: 180deg; }

    .pick-btn:disabled {

    }
    .pick-caret .icon { width: 16px; height: 16px; }

      background: var(--bg-raise);

      color: var(--ink);

      scrollbar-color: var(--edge-strong) transparent;
    }
    .pick-list[hidden] { display: none !important; }

      gap: 8px;
      min-height: var(--control);

      color: var(--mute);
      cursor: pointer;
      text-align: start;
      white-space: nowrap;

    .pick-list [role="option"] .icon,
    .menu-list [role="option"] .icon {

      height: 16px;

    }
    .pick-list [role="option"]:hover,

    .menu-list [role="option"]:hover,

    }
    .pick-list [role="option"][aria-selected="true"],
    .menu-list [role="option"][aria-selected="true"] {
      color: var(--bg);
      background: var(--ink);
    }
    .pick-panel {
      position: fixed;
      z-index: 24;
      margin: 0;
      padding: 6px;
      min-width: 12rem;
      max-width: min(320px, calc(100vw - 16px));
      max-height: min(420px, 70vh);
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--bg-raise);
      border: 2px solid var(--edge-strong);
      color: var(--ink);
      scrollbar-width: thin;
      scrollbar-color: var(--edge-strong) transparent;
    }
    .pick-panel[hidden] { display: none !important; }
    .menu-group { min-width: 0; }
    .menu-group + .menu-group {

    .menu-label {

      padding: 6px 10px 2px;

      letter-spacing: 0.08em;

    }
    .menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .pick-count {

    .pick-btn > .pick-count {

    }
    .pick-list [role="option"][aria-selected="true"] .pick-count {

      opacity: 0.72;
    }
    .frame-prompt {

    .frames.mode-models.arrange-grid .frame-bar,
    .frames.mode-models.arrange-columns .frame-bar {
      flex-direction: column;

      min-height: 0;

    }
    .frames.mode-models.arrange-grid .frame-prompt,

    .frame-status {

    .frame-status .stat-text {

    }
    @container (min-width: 560px) {
      .frame-status .stat-kicker,
      .frame-status .stat-who .stat-text,

    }
    .frame-status a { color: inherit; text-decoration: none; }
    .frame-status a:hover { color: var(--ink); }
    .frame-status .stat-who img {

      height: 16px;

      background: var(--bg-raise);
      display: block;
    }
    .levels, .html-switch { display: flex; gap: var(--gap); }
    .levels button,
    .evidence button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--control);
      padding: 0 10px;
      color: var(--mute);
      background: var(--bg-raise);
      border: 2px solid var(--edge);
      white-space: nowrap;
    }
    .evidence button.active {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
    }
    .levels button {
      flex: 1 1 0;
      min-width: 0;
      padding: 0;
    }
    .levels [data-level="A"]:hover:not(:disabled):not(.active),
    .levels [data-level="A"]:focus-visible { color: var(--level-a); border-color: var(--level-a); }
    .levels [data-level="B"]:hover:not(:disabled):not(.active),
    .levels [data-level="B"]:focus-visible { color: var(--level-b); border-color: var(--level-b); }
    .levels [data-level="C"]:hover:not(:disabled):not(.active),
    .levels [data-level="C"]:focus-visible { color: var(--level-c); border-color: var(--level-c); }

    .levels [data-level="C"]:focus-visible { outline-color: var(--level-c); }
    .levels [data-level="A"].active {
      color: var(--bg);
      background: var(--level-a);
      border-color: var(--level-a);
    }
    .levels [data-level="B"].active {
      color: var(--bg);
      background: var(--level-b);
      border-color: var(--level-b);
    }
    .levels [data-level="C"].active {
      color: var(--bg);
      background: var(--level-c);
      border-color: var(--level-c);
    }
    .stage {
      position: relative;
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      gap: 0;
      padding: var(--gap);
      background: var(--bg);
    }
    .stage:has(.frames.mode-single) {
      padding: 0;
    }

      position: relative;
      flex: 1;

      min-height: 0;
    }

      height: 100%;

      min-height: 0;

      gap: var(--gap);
      background: var(--bg);
    }
    .frames[data-transitioning="true"] {
      pointer-events: none;

    }
    .frames.mode-single { grid-template-columns: minmax(0, 1fr); }
    .frames.mode-single .frame,
    .frames.mode-single .frame .port {

      border-radius: 0;
    }
    .frames.mode-table {
      position: relative;
      display: block;
      overflow: auto;

      padding-top: 44px;

    }
    .frames.mode-table::-webkit-scrollbar,
    .ranking-table-wrap::-webkit-scrollbar {

      height: 11px;
    }
    .frames.mode-table::-webkit-scrollbar-track,

    }
    .frames.mode-table::-webkit-scrollbar-thumb:hover,

    }
    .frames.mode-table::-webkit-scrollbar-corner,
    .ranking-table-wrap::-webkit-scrollbar-corner { background: var(--bg-raise); }
    .table-scroll-cue {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 146px;
      min-height: 28px;
      margin: 0;
      padding: 0 9px;
      color: var(--mute);
      background: color-mix(in srgb, var(--bg-raise) 94%, transparent);

    }
    .table-scroll-cue .icon { width: 13px; height: 13px; }
    .matrix {

      border-spacing: 0;
      min-width: 100%;
      font-size: 10px;
    }

      min-width: 28px;
      max-width: 36px;
    }
    .matrix thead th.matrix-corner {
      left: 0;
      z-index: 3;

      max-width: 180px;
      text-align: start;
      padding: 0 8px;
      vertical-align: end;
    }

      white-space: nowrap;
      max-width: 88px;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }
    .matrix tbody th {

      left: 0;
      z-index: 1;
      min-width: 132px;

      padding: 0;
      color: var(--mute);

      border: 0;

    .matrix-cell.is-miss .matrix-dot {
      width: 7px;

    .glance .dur {
      color: var(--mute);
      font-variant-numeric: tabular-nums;
    }
    dl.kv {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 8px 12px;
      margin: 0;
    }
    dl.kv dt { margin: 0; color: var(--mute); }
    dl.kv dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .who {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .who img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bg-raise);
    }
    .who a { color: inherit; }
    .flags { margin: 14px 0 0; }
    .flags p {
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 2px solid var(--edge);
      background: var(--bg-raise);
    }
    details.raw { margin-top: 16px; color: var(--mute); }
    details.raw pre {
      white-space: pre-wrap;
      font: 11px/1.45 var(--font);
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .empty { color: var(--mute); margin: 24px; }
    .stage-loader {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: var(--bg);
      pointer-events: auto;
    }
    .stage-loader[hidden] { display: none !important; }
    .stage-loader-text,
    .stage-loader-model {
      margin: 0;
      width: 100%;
      max-width: 100%;
      text-align: center;
      overflow-wrap: break-word;
      text-wrap: balance;
    }
    .stage-loader-text {
      font: var(--mark)/1.15 var(--font);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .stage-loader-model {
      font: var(--type)/1.25 var(--font);
      letter-spacing: 0.04em;
      color: var(--mute);
    }
    .stage-loader-copy .scramble-keep,
    .stage-loader-copy .scramble-mid {
      white-space: pre-wrap;
    }
    .scramble-keep,
    .scramble-mid {
      white-space: pre;
    }
    .toast-slot {
      position: fixed;
      z-index: 30;
      bottom: 24px;
      left: 50%;
      translate: -50% 0;
      pointer-events: none;
    }
    .toast {
      opacity: 0;
      padding: 8px 12px;
      background: var(--ink);
      color: var(--bg);
      border: 2px solid var(--ink);
    }
    .toast.show {
      opacity: 1;
    }
    .tip {
      position: fixed;
      z-index: 32;
      max-width: min(240px, calc(100vw - 16px));
      padding: 6px 8px;
      background: var(--bg-raise);
      color: var(--ink);
      border: 2px solid var(--edge-strong);
      font: var(--type)/1.3 var(--font);
      pointer-events: none;
      opacity: 0;
      translate: 0 -4px;
    }
    .tip.tip-wide {
      max-width: min(420px, calc(100vw - 16px));
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 11px;
      line-height: 1.35;
    }
    @media (max-width: 1199px) {
      .stage { display: block; }
      .stage-port { position: absolute; inset: var(--gap); }
      .stage:has(.frames.mode-single) .stage-port { inset: 0; }
      .stacks {
        position: absolute;
        inset-block: var(--gap);
        inset-inline-end: var(--gap);
        z-index: 6;
      }
      .stage:has(.frames.mode-single) .stacks {
        inset-block: 0;
        inset-inline-end: 0;
      }
      .stack {
        width: min(var(--drawer), calc(100% - 16px));
      }
    }
    @media (max-width: 1100px) {
      .mast { grid-template-columns: minmax(0, 1fr) auto; }
      .report-group { grid-column: 2; grid-row: 1; }
      .mast-tools { grid-column: 1 / -1; justify-content: start; }
    }
    @media (max-width: 720px) {
      .frames.arrange-columns {
        grid-template-columns: minmax(0, 1fr);
        grid-auto-rows: minmax(180px, 1fr);
      }
      .frames.arrange-grid {
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
        grid-auto-rows: minmax(200px, 1fr);
      }
      .unshot { padding: 24px 16px; }
      .unshot .script { font-size: 11px; }
      .pick-btn { max-width: min(240px, 72vw); }
    }
    @media (max-width: 420px) {
      .mark { letter-spacing: 0.04em; }
      .evidence button { padding: 0 8px; }
    }
    .models-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 2px 4px;
      margin-bottom: 4px;
      font-size: 10px;
      color: var(--mute);
      border-bottom: 1px solid var(--edge);
    }
    .models-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      font-size: 10px;
      color: var(--ink);
      background: var(--bg-raise);
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      cursor: pointer;
    }
    .models-toggle-btn:hover {
      border-color: var(--edge-strong);
      color: #fff;
    }
    .models-toggle-btn .icon {
      width: 12px;
      height: 12px;
    }
    .app.film-compact .models-toolbar {
      display: none;
    }

    /* Comparison Mode */
    .frames.mode-compare {
      display: grid;
      grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr));
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      height: 100%;
      gap: var(--gap);
    }
    .frames.mode-compare .frame-compare { grid-row: 2; }
    .compare-global-tools { min-height: 32px; }
    .compare-title { text-transform: uppercase; letter-spacing: 0.08em; }
    @media (max-width: 980px) {
      .frames.mode-compare {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        grid-auto-rows: minmax(420px, 70vh);
        overflow-y: auto;
      }
      .frames.mode-compare .frame-compare { grid-row: auto; min-height: 0; }
    }
    @media (max-width: 1320px) {
      .frames.mode-compare.count-3 {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        grid-auto-rows: minmax(420px, 70vh);
        overflow-y: auto;
      }
      .frames.mode-compare.count-3 .frame-compare { grid-row: auto; min-height: 0; }
    }
    .compare-global-tools {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg-raise);
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      font-size: 11px;
      color: var(--mute);
      height: auto;
    }
    .compare-count-toggle {
      display: inline-flex;
      gap: 4px;
    }
    .compare-count-btn {
      padding: 3px 8px;
      font-size: 10px;
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      color: var(--mute);
      background: var(--bg);
    }
    .compare-count-btn.active {
      border-color: var(--ink);
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .compare-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      background: var(--bg-raise);
      border-bottom: 1px solid var(--edge);
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    .compare-slot-selectors {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
      flex: 1 1 auto;
    }
    .compare-select {
      font: inherit;
      font-size: 10px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--edge);
      padding: 2px 4px;
      border-radius: var(--radius);
      max-width: 130px;
      min-width: 0;
      flex: 0 1 auto;
      text-overflow: ellipsis;
    }
    .compare-select:hover { border-color: var(--edge-strong); }
    .compare-level-pills {
      display: inline-flex;
      gap: 2px;
    }
    .compare-level-pill {
      font-size: 10px;
      padding: 2px 6px;
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      color: var(--mute);
      background: var(--bg);
    }
    .compare-level-pill.active {
      color: var(--ink);
      border-color: var(--edge-strong);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Landing, Ranking, Charts containers */
    .frames.mode-landing,
    .frames.mode-ranking,
    .frames.mode-charts {
      display: block;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--edge-strong) transparent;
      height: 100%;
      padding: clamp(14px, 2.5vw, 32px);
      background: var(--bg);
    }
    .landing-wrap {
      width: 100%;
      max-width: 1720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(310px, 0.7fr) minmax(620px, 1.3fr);
      grid-template-areas:
        "hero duel"
        "section section"
        "benches benches";
      gap: clamp(16px, 2vw, 24px);
    }
    .ranking-wrap,
    .charts-wrap {
      width: 100%;
      max-width: 1540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 1.5vw, 20px);
    }

    /* Landing Styles */
    .landing-hero {

      padding: 8px 10px;

    .landing-random-header {

    .landing-opt-btn {

    .landing-section-title {

    .landing-duel {
      grid-area: duel;
      border: 1px solid var(--edge-strong);
      background: var(--bg-raise);

      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .landing-duel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 860px) {
      .landing-duel-grid { grid-template-columns: minmax(0, 1fr); }
    }
    .duel-card {
      margin: 0;

      border: 1px solid var(--edge-strong);
      border-radius: var(--radius);

    .duel-card-head {
      display: flex;

    .duel-card-meta { color: var(--mute); font-size: 10px; white-space: nowrap; }

    .duel-port-empty {

      font-size: 11px;

      padding-top: 6px;

    .bench-card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 8px;

    .bench-card-btn .icon { width: 12px; height: 12px; }

      color: var(--ink);

      font-weight: 500;

      padding: 2px 6px;

      border: 1px solid var(--edge);
      border-radius: var(--radius);
      text-align: start;
    }
    .winner-card:hover,
    .winner-card:focus-visible { border-color: var(--gold); color: #fff; }
    .winner-level {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--bg);
      background: var(--gold);
      border-radius: var(--radius);
      font-weight: 700;
    }
    .winner-copy { min-width: 0; }
    .winner-bench,
    .winner-model {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .winner-bench { color: var(--mute); font-size: 9px; }
    .winner-model { margin-top: 2px; font-size: 10px; }
    .winner-score {
      grid-column: 2;
      color: var(--gold);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .ranking-table-wrap {
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--ink) 42%, var(--bg)) var(--bg-raise);
      background: var(--bg-raise);
    }
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: start;
      font-variant-numeric: tabular-nums;
    }
    .rank-score {
      color: var(--gold);
      font-weight: 600;
    }
    .ranking-empty {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      color: var(--mute);
      background: var(--bg-raise);
      border: 1px dashed var(--edge);
      border-radius: var(--radius);
      font-size: 10px;
    }
    .ranking-empty strong { color: var(--ink); font-size: 12px; }
    .review-cell {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .review-badge {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      padding: 1px 5px;
      color: var(--mute);
      background: var(--bg);
      border: 1px solid var(--edge);
      border-radius: 999px;
      font-size: 9px;
      text-transform: capitalize;
    }
    .review-badge.confirmed { color: #8fd6a3; border-color: rgba(143, 214, 163, 0.42); }
    .review-badge.provisional,
    .review-badge.partial { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, var(--edge)); }
    .review-badge.invalid { color: #ff9a9a; border-color: rgba(255, 154, 154, 0.42); }
    .axis-score { color: var(--ink); }
    .ranking-table th, .ranking-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--edge);
      white-space: nowrap;
    }
    .ranking-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--bg);
      color: var(--mute);
      font-weight: 400;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.05em;
    }
    .ranking-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }
    .rank-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      font-weight: bold;
    }
    .rank-num.gold { color: var(--gold); }
    .rank-num.silver { color: #C0C0C0; }
    .rank-num.bronze { color: #CD7F32; }
    .rank-model-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--ink);
      text-align: start;
    }
    .rank-model-name:hover { color: #fff; }

    /* Charts Styles */
    .charts-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      min-width: 0;
    }
    .charts-metric-tabs {
      display: inline-flex;
      gap: 4px;
      max-width: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--edge-strong) transparent;
      padding-bottom: 2px;
    }
    .charts-tab-btn {
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid var(--edge);
      background: var(--bg);
      color: var(--mute);
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
    }
    .charts-tab-btn.active {
      border-color: var(--ink);
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .chart-container {
      background: var(--bg-raise);
      border: 1px solid var(--edge);
      padding: 18px;
      border-radius: var(--radius);
      min-width: 0;
      overflow: hidden;
    }
    .chart-title {
      margin: 0 0 12px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .chart-rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }
    .chart-row {
      display: grid;
      grid-template-columns: minmax(150px, 230px) minmax(100px, 1fr) minmax(96px, max-content);
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 27px;
    }
    .chart-model {
      min-width: 0;
      color: var(--mute);
      font-size: 10px;
      overflow-wrap: anywhere;
    }
    .chart-track {
      position: relative;
      min-width: 0;
      height: 16px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--edge);
      border-radius: var(--radius);
    }
    .chart-bar-fill {
      display: block;
      width: var(--bar-size, 0%);
      height: 100%;
      background: var(--bar-color, var(--level-b));
      border-radius: 1px;
      transform-origin: left center;
    }
    .chart-value {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
      color: var(--ink);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: end;
    }
    .chart-value strong { font-size: 11px; font-weight: 400; }
    .chart-value-detail { color: var(--mute); }
    .chart-level-row {
      align-items: start;
      padding: 5px 0 8px;
      border-bottom: 1px solid var(--edge);
    }
    .chart-level-bars {
      grid-column: 2 / -1;
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    .chart-level-line {
      display: grid;
      grid-template-columns: 14px minmax(80px, 1fr) minmax(62px, max-content);
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--mute);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }
    .chart-level-line .chart-track { height: 10px; }
    .chart-empty { margin: 18px 0 0; color: var(--mute); }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 12px;
      font-size: 10px;
      color: var(--mute);
    }
    .chart-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chart-legend-color {
      width: 10px;
      height: 10px;
      border-radius: 1px;
    }
    .mark { cursor: pointer; }

    @media (max-width: 1550px) {
      .landing-wrap {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "hero" "duel" "section" "benches";

    @media (max-width: 900px) {

      }
      .film-toggle { display: none; }
      .stage {

        grid-row: 3;
      }
      .frames.mode-landing,
      .frames.mode-ranking,
      .frames.mode-charts { padding: 12px; }
    }

    @media (max-width: 700px) {

      .landing-stat-chip strong { font-size: 12px; }
      .ranking-header,
      .charts-header { align-items: stretch; }
      .ranking-toolbar,
      .charts-toolbar { justify-content: flex-start; }
      .chart-container { padding: 12px; }
      .chart-row {
        grid-template-columns: minmax(0, 1fr) max-content;
        gap: 5px 8px;
        padding: 4px 0;
      }
      .chart-track { grid-column: 1 / -1; grid-row: 2; }
      .chart-value { grid-column: 2; grid-row: 1; flex-wrap: wrap; }
      .chart-level-row { grid-template-columns: minmax(0, 1fr); }
      .chart-level-row .chart-model { grid-column: 1; }
      .chart-level-bars { grid-column: 1; }
      .chart-level-line { grid-template-columns: 14px minmax(60px, 1fr) minmax(56px, max-content); }
    }

    @media (max-width: 600px) {
      .mast { padding-block: 7px; gap: 7px; }
      .repo { display: none; }
      .report-btn { width: 30px; padding: 0; }
      .report-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .mast-tools {
        flex-wrap: nowrap;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .mast-tools::-webkit-scrollbar { display: none; }
      .pick-step { display: none; }
      .landing-hero-title { font-size: clamp(18px, 6vw, 24px); }
      .landing-hero,
      .landing-duel,
      .bench-card { padding: 12px; }
      .landing-hero-actions { align-items: stretch; }
      .landing-btn-launch { flex: 1 1 auto; }
      .ranking-filter-group { flex: 1 1 100%; justify-content: space-between; }
      .ranking-select { max-width: 65%; }
      .ranking-method-note { width: 100%; margin-inline-start: 0; }
      .individual-winners-head { align-items: flex-start; flex-direction: column; gap: 2px; }
      .charts-toolbar { align-items: stretch; }
      .charts-metric-tabs {
        flex: 1 1 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        overflow: visible;
        padding-bottom: 0;
      }
      .charts-tab-btn { width: 100%; }
      .chart-value-detail { display: block; width: 100%; }
    }

    @media (forced-colors: active) {
      .frames.mode-table,

      .models { scrollbar-color: auto; }
      .table-scroll-cue { background: Canvas; color: CanvasText; border-color: CanvasText; }
    }

    @media (prefers-reduced-motion: reduce) {
      button, select, .drawer, .toast, .tip, .frames, .film, .film-text, .pick-caret { transition: none; }
      button:active { scale: 1; }
    }
  </style>
</head>

        const fallback = (CATALOG.cells || []).find(c =>

          && (!scopedLevel || c.level === scopedLevel)
        );

    function matrixMarkup() {
      const models = coverageModels();

          return '<td><button type="button" class="matrix-cell is-hit" data-matrix-cell data-experiment="' + esc(exp.id) + '" data-model="' + esc(m.id) + '" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '"><span class="matrix-dot"></span>' + crown + star + '</button></td>';
        }).join('');
        const benchTip = pick ? 'Staff pick · ' + pick : 'Open ' + (exp.title || exp.id);
        return '<tr><th scope="row"><button type="button" class="matrix-bench" data-open-pick="' + esc(exp.id) + '" data-tip="' + esc(benchTip) + '">' + esc(experimentMark(exp.id) || '') + ' ' + esc(exp.title || exp.id) + '</button></th>' + cells + '</tr>';

        + '<div class="landing-stat-chip"><strong>' + benchesCount + '</strong><span>benchmarks</span></div>'

        + '<div class="landing-hero-actions">'
        + '<div class="landing-random-opts" role="group" aria-label="Random matchup size">'

        + '<button type="button" class="landing-opt-btn' + (randomSize === 4 ? ' active' : '') + '" data-set-random="4" aria-pressed="' + (randomSize === 4 ? 'true' : 'false') + '">4-up</button>'

        + '<div class="landing-benches-grid">' + benchesCards + '</div>'

    function pickDuelSlots() {
      const pools = [];
      (CATALOG.experiments || []).forEach(e => {
        const models = [...new Set((CATALOG.cells || [])
          .filter(c => c.experiment === e.id && c.level === 'A' && c.src)
          .map(c => c.model))];
        if (models.length >= 2) pools.push({ experiment: e.id, models });
      });
      if (!pools.length) return [];
      const pool = pools[Math.floor(Math.random() * pools.length)];
      const shuffled = pool.models.slice().sort(() => Math.random() - 0.5);
      return [
        { model: shuffled[0], experiment: pool.experiment, level: 'A' },
        { model: shuffled[1], experiment: pool.experiment, level: 'A' }
      ];
    }
    function duelMarkup() {
      if (!Array.isArray(state.duelSlots)) state.duelSlots = [];
      if (!state.duelSlots.length) state.duelSlots = pickDuelSlots();
      const slots = state.duelSlots;
      if (slots.length < 2) return '';
      const cards = slots.map(slot => {
        const cell = findCell(CATALOG.cells, {
          model: slot.model,
          experiment: slot.experiment,
          level: slot.level,
          promptRevision: maxRevision(slot.experiment, slot.level),
          date: '',
          month: ''
        });
        const exp = (CATALOG.experiments || []).find(e => e.id === slot.experiment) || {};
        return '<figure class="duel-card">'
          + '<figcaption class="duel-card-head">'
          + '<span class="duel-card-model">' + brandIcon(modelBrand(slot.model)) + esc(slot.model) + '</span>'
          + '<span class="duel-card-meta">' + esc(experimentMark(slot.experiment)) + ' ' + esc(exp.title || slot.experiment) + ' · ' + esc(slot.level) + '</span>'
          + '</figcaption>'
          + (cell && cell.src
            ? '<div class="duel-port">' + frameLoaderMarkup(cell) + '<iframe data-src="' + esc(cell.src) + '" title="' + esc(slot.model) + ' live take"></iframe></div>'
            : '<div class="duel-port duel-port-empty"><p class="kicker">' + icon('play') + ' Take not landed</p></div>')
          + '</figure>';
      }).join('');
      return '<section class="landing-duel">'
        + '<div class="landing-random-header">'
        + '<h3 class="landing-random-title">' + icon('compare') + ' Live face-off</h3>'
        + '<div class="landing-random-opts">'
        + '<button type="button" class="landing-opt-btn" data-duel-shuffle>' + icon('dice') + '<span>Shuffle</span></button>'
        + '<button type="button" class="landing-opt-btn" data-duel-compare>' + icon('compare') + '<span>Compare</span></button>'
        + '</div>'
        + '</div>'
        + '<div class="landing-duel-grid">' + cards + '</div>'
        + '</section>';
    }
    function rollRandomMatchup() {
      const size = state.randomMatchupSize || 2;
      // the matchup lands on level A, so only models with a landed A take can face off
      const playableByExp = new Map();
      (CATALOG.experiments || []).forEach(e => {
        const models = [...new Set((CATALOG.cells || [])
          .filter(c => c.experiment === e.id && c.level === 'A' && c.src)
          .map(c => c.model))];
        if (models.length >= 2) playableByExp.set(e.id, models);
      });
      if (!playableByExp.size) {
        toast('No playable takes found');
        return;
      }
      const full = [...playableByExp.entries()].filter(([, models]) => models.length >= size);
      const pool = full.length ? full : [...playableByExp.entries()];
      const [randomExp, uniqueModels] = pool[Math.floor(Math.random() * pool.length)];
      const shuffled = uniqueModels.slice().sort(() => Math.random() - 0.5);
      const picked = shuffled.slice(0, Math.min(size, shuffled.length));

      state.experiment = randomExp;
      state.level = 'A';
      state.promptRevision = maxRevision(state.experiment, state.level);

      if (size === 2 && picked.length >= 2) {
        state.mode = 'compare';
        state.compareCount = 2;
        state.compareSlots = [
          { model: picked[0], experiment: randomExp, level: 'A' },
          { model: picked[1], experiment: randomExp, level: 'A' }
        ];
        toast('Matchup: ' + randomExp + ' (' + picked[0] + ' vs ' + picked[1] + ')');
      } else {
        state.mode = 'models';
        const allGen = (CATALOG.models || []).map(m => m.id);
        const hide = allGen.filter(id => !picked.includes(id));
        state.hiddenModels = new Set(hide);
        state.model = picked[0];
        toast('Shootout: ' + randomExp + ' (' + picked.length + ' models)');
      }
      applyModeDefaults(state.mode, true);
      render();
    }
    function rankingMarkup() {
      const currentBench = state.rankingBench || 'all';
      const currentLvl = state.rankingLevel || 'all';
      const currentSort = state.rankingSort || 'rank';
      const evaluation = CATALOG.evaluation || {};
      const scopeId = currentBench + '::' + currentLvl;
      const scope = (evaluation.scopes || []).find(row => row.id === scopeId) || {
        rankings: [],
        candidateCount: 0,
        reviewedCandidates: 0,
        scoredCandidates: 0
      };
      const rankingExperiments = currentBench === 'all'
        ? (CATALOG.experiments || []).map(e => e.id)
        : [currentBench];
      const rankingLevels = currentLvl === 'all' ? PROMPT_LEVELS : [currentLvl];
      const audienceCrowns = model => {
        let crowns = 0;
        rankingExperiments.forEach(experimentId => {
          rankingLevels.forEach(level => {
            const rec = voteCache.get(votePromptId(experimentId, level));
            if (rec && rec.leader === model) crowns++;
          });
        });
        return crowns;
      };
      const ranked = (scope.rankings || []).map(row => ({
        ...row,
        id: row.model,
        avgDurMs: row.averageDurationMs,
        avgTokens: row.averageOutputTokens,
        crowns: audienceCrowns(row.model)
      }));
      const models = ranked.slice();
      const storedRank = row => Number.isFinite(row.rank) ? row.rank : Infinity;
      const facetValue = (row, facet) => Number.isFinite(row.experienceFacets && row.experienceFacets[facet])
        ? row.experienceFacets[facet]
        : -1;

      if (currentSort === 'review') models.sort((a, b) => b.reviewCoveragePct - a.reviewCoveragePct || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'completion') models.sort((a, b) => b.completionPct - a.completionPct || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'experience') models.sort((a, b) => (b.experienceScore ?? -1) - (a.experienceScore ?? -1) || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'task') models.sort((a, b) => (b.taskScore ?? -1) - (a.taskScore ?? -1) || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'motion') models.sort((a, b) => facetValue(b, 'motionInteraction') - facetValue(a, 'motionInteraction') || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'craft') models.sort((a, b) => facetValue(b, 'craft') - facetValue(a, 'craft') || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'composition') models.sort((a, b) => facetValue(b, 'composition') - facetValue(a, 'composition') || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'clarity') models.sort((a, b) => facetValue(b, 'clarity') - facetValue(a, 'clarity') || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'speed') models.sort((a, b) => (a.avgDurMs ?? Infinity) - (b.avgDurMs ?? Infinity) || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else if (currentSort === 'votes') models.sort((a, b) => b.crowns - a.crowns || storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));
      else models.sort((a, b) => storedRank(a) - storedRank(b) || a.id.localeCompare(b.id));

      const benchOptions = '<option value="all"' + (currentBench === 'all' ? ' selected' : '') + '>All Benchmarks</option>'
        + (CATALOG.experiments || []).map(e => '<option value="' + esc(e.id) + '"' + (currentBench === e.id ? ' selected' : '') + '>' + esc(e.title || e.id) + '</option>').join('');

      const lvlOptions = [
        { value: 'all', label: 'All Levels (A, B, C)' },
        { value: 'A', label: 'Level A (Raw)' },
        { value: 'B', label: 'Level B (Autonomous)' },
        { value: 'C', label: 'Level C (Showcase)' }
      ].map(o => '<option value="' + o.value + '"' + (currentLvl === o.value ? ' selected' : '') + '>' + o.label + '</option>').join('');

      const sortOptions = [
        { value: 'rank', label: 'Deterministic rank' },
        { value: 'review', label: 'Review coverage' },
        { value: 'experience', label: 'Experience percentile' },
        { value: 'task', label: 'Task success' },
        { value: 'motion', label: 'Motion & interaction' },
        { value: 'craft', label: 'Craft' },
        { value: 'composition', label: 'Composition' },
        { value: 'clarity', label: 'Clarity' },
        { value: 'completion', label: 'Delivery coverage' },
        { value: 'speed', label: 'Generation time' },
        { value: 'votes', label: 'Audience vote' }
      ].map(o => '<option value="' + o.value + '"' + (currentSort === o.value ? ' selected' : '') + '>' + o.label + '</option>').join('');

      const scoreText = value => {
        if (!Number.isFinite(value)) return '—';
        return Number.isInteger(value) ? String(value) : Number(value).toFixed(1);
      };
      const facetText = (row, facet) => scoreText(row.experienceFacets && row.experienceFacets[facet]) + (Number.isFinite(row.experienceFacets && row.experienceFacets[facet]) ? '/4' : '');
      const method = evaluation.method || { label: 'Comparative quality review', taskChecks: [] };
      const reviewSummary = (scope.reviewedCandidates || 0) + '/' + (scope.candidateCount || 0) + ' candidates reviewed';
      const methodHtml = '<div class="ranking-method" aria-label="' + esc(method.label) + '">'

        + (method.taskChecks || []).filter(check => check.gate).map(check => '<span class="ranking-method-chip" data-tip="Required task gate · ' + esc(check.weight) + '% of the separate task score">' + esc(check.label) + '</span>').join('')
        + '<span class="ranking-method-note">' + esc(reviewSummary) + ' · task gates first, then blind within-cohort experience · time, output, delivery, and votes stay separate</span>'

      const top3 = ranked.filter(m => Number.isFinite(m.experienceScore)).slice(0, 3);
      const newTag = (m) => (isNewModel(m.id) ? '<span class="new-badge">new</span>' : '');
      const podiumCard = (m, idx, tone, medal, label) => m
        ? '<button type="button" class="podium-card ' + tone + '" data-view-model="' + esc(m.id) + '" data-view-bench="' + esc(currentBench) + '" data-view-level="' + esc(currentLvl) + '" aria-label="Open ' + esc(m.id) + '">'
          + '<span class="podium-medal">' + medal + ' #' + m.rank + ' ' + label + '</span>'
          + '<span class="podium-model">' + brandIcon(modelBrand(m.id)) + esc(m.id) + newTag(m) + '</span>'
          + '<span class="podium-score"><strong>' + scoreText(m.experienceScore) + '</strong><span>experience percentile</span></span>'
          + '<span class="podium-stat">Task ' + scoreText(m.taskScore) + '/100 · motion ' + facetText(m, 'motionInteraction') + ' · craft ' + facetText(m, 'craft') + '</span>'
          + '<span class="podium-stat">' + m.reviewCount + ' blind review' + (m.reviewCount === 1 ? '' : 's') + ' · ' + esc(m.reviewState) + '</span>'
          + '</button>'
        : '';
      const podiumHtml = top3.length
        ? '<div class="ranking-podium">'
          + podiumCard(top3[0], 0, 'gold', '🥇', scope.reviewComplete ? 'Winner' : 'Leader')
          + podiumCard(top3[1], 1, 'silver', '🥈', 'Runner-up')
          + podiumCard(top3[2], 2, 'bronze', '🥉', 'Third')
          + '</div>'
        : '<div class="ranking-empty"><strong>Comparative ranking pending</strong><span>No current take has a blind within-cohort review for this scope. Delivery facts remain in Coverage.</span></div>';

      const visibleWinners = (evaluation.winners || []).filter(winner =>
        (currentBench === 'all' || winner.experiment === currentBench)
        && (currentLvl === 'all' || winner.level === currentLvl)

      const winnerCards = visibleWinners.map(winner => {
        const exp = (CATALOG.experiments || []).find(item => item.id === winner.experiment) || {};
        return '<button type="button" class="winner-card" data-view-model="' + esc(winner.model) + '" data-view-bench="' + esc(winner.experiment) + '" data-view-level="' + esc(winner.level) + '" aria-label="Open ' + esc(winner.model) + ', winner of ' + esc(exp.title || winner.experiment) + ' ' + esc(winner.level) + '">'

          + '<span class="winner-score">#1 · exp ' + scoreText(winner.experienceScore) + ' · task ' + scoreText(winner.taskScore) + ' · ' + esc(winner.status) + '</span>'
          + '</button>';
      }).join('');
      const winnersHtml = visibleWinners.length
        ? '<section class="individual-winners" aria-labelledby="individual-winners-title">'
          + '<div class="individual-winners-head"><h3 class="individual-winners-title" id="individual-winners-title">' + icon('trophy') + ' Individual cohort leaders</h3><span class="individual-winners-note">Task gates pass first. Machine-only reviews stay provisional until an independent human review is added.</span></div>'

          + '<td>' + (m.crowns ? '👑 ' + m.crowns : '—') + '</td>'
          + '<td><button type="button" class="bench-card-btn" data-view-model="' + esc(m.id) + '" data-view-bench="' + esc(currentBench) + '" data-view-level="' + esc(currentLvl) + '">' + icon('single') + '<span>Open</span></button></td>'
          + '</tr>';
      }).join('');

      return '<div class="ranking-wrap">'
        + '<div class="ranking-header">'
        + '<h2 class="landing-hero-title">' + icon('ranking') + ' Evidence ranking</h2>'
        + '<div class="ranking-toolbar">'
        + '<div class="ranking-filter-group"><span>Benchmark:</span><select class="ranking-select" id="ranking-filter-bench">' + benchOptions + '</select></div>'
        + '<div class="ranking-filter-group"><span>Level:</span><select class="ranking-select" id="ranking-filter-level">' + lvlOptions + '</select></div>'
        + '<div class="ranking-filter-group"><span>Sort by:</span><select class="ranking-select" id="ranking-filter-sort">' + sortOptions + '</select></div>'

        + methodHtml

        + winnersHtml

      }
      render();
    });
    document.querySelector('.levels').addEventListener('click', e => {
      const b = e.target.closest('[data-level]'); if (!b) return;
      onLevel(b.dataset.level);
    });
    document.getElementById('report-group').addEventListener('click', e => {
      const btn = e.target.closest('.report-btn');
      if (!btn) return;
      if (state.mode === btn.dataset.report) onMode(state.lastFrameMode || 'single');
      else onMode(btn.dataset.report);
    });
    document.getElementById('view-mode').addEventListener('change', e => {
      onMode(e.target.value);
    });
    document.getElementById('view-arrange').addEventListener('change', e => {
      state.arrange = e.target.value;
      render();
    });
    document.getElementById('view-scale').addEventListener('change', e => {
      state.scale = e.target.value;
      render();
    });
    document.getElementById('prompt-version').addEventListener('change', e => {
      state.promptRevision = Number(e.target.value) || 1;
      state.date = '';
      render();
    });
    document.getElementById('run-month').addEventListener('change', e => {
      state.month = e.target.value;
      state.date = '';
      render();
    });
    document.getElementById('run-pick').addEventListener('change', e => {
      state.date = e.target.value;
      render();
    });
    document.getElementById('frames').addEventListener('change', e => {
      const modelSel = e.target.closest('.compare-select-model');
      if (modelSel) {
        const idx = Number(modelSel.dataset.slotIndex);
        initCompareSlots();
        if (state.compareSlots[idx]) {
          state.compareSlots[idx].model = modelSel.value;
          render();
        }
        return;
      }
      const benchSel = e.target.closest('.compare-select-bench');
      if (benchSel) {
        const idx = Number(benchSel.dataset.slotIndex);
        initCompareSlots();
        if (state.compareSlots[idx]) {
          state.compareSlots[idx].experiment = benchSel.value;
          render();
        }
        return;
      }
      const rankBench = e.target.closest('#ranking-filter-bench');
      if (rankBench) {
        state.rankingBench = rankBench.value;
        pendingStageFocus = '#ranking-filter-bench';
        render();
        return;
      }
      const rankLvl = e.target.closest('#ranking-filter-level');
      if (rankLvl) {
        state.rankingLevel = rankLvl.value;
        pendingStageFocus = '#ranking-filter-level';
        render();
        return;
      }
      const rankSort = e.target.closest('#ranking-filter-sort');
      if (rankSort) {
        state.rankingSort = rankSort.value;
        pendingStageFocus = '#ranking-filter-sort';
        render();
        return;
      }
      const chartBench = e.target.closest('#charts-filter-bench');
      if (chartBench) {
        state.chartsBench = chartBench.value;
        pendingStageFocus = '#charts-filter-bench';
        render();
        return;
      }
    });
    document.getElementById('frames').addEventListener('click', e => {
      const gotoMode = e.target.closest('[data-goto-mode]');
      if (gotoMode) {
        onMode(gotoMode.dataset.gotoMode);
        return;
      }
      if (e.target.closest('[data-duel-shuffle]')) {
        state.duelSlots = [];
        state.landingRevision++;
        render();
        return;
      }
      if (e.target.closest('[data-duel-compare]')) {
        if (state.duelSlots && state.duelSlots.length >= 2) {
          state.compareSlots = state.duelSlots.map(s => ({ model: s.model, experiment: s.experiment, level: s.level }));
          state.compareCount = 2;
          state.experiment = state.duelSlots[0].experiment;
          state.level = 'A';
          state.promptRevision = maxRevision(state.experiment, state.level);
        }
        onMode('compare');
        return;
      }
      const countBtn = e.target.closest('[data-compare-count]');
      if (countBtn) {
        state.compareCount = Number(countBtn.dataset.compareCount) || 2;
        render();
        return;
      }
      const lvlPill = e.target.closest('.compare-level-pill');
      if (lvlPill) {
        const idx = Number(lvlPill.dataset.slotIndex);
        initCompareSlots();
        if (state.compareSlots[idx]) {
          state.compareSlots[idx].level = lvlPill.dataset.level;
          render();
        }
        return;
      }
      if (e.target.closest('#btn-roll-random')) {
        rollRandomMatchup();
        return;
      }
      const randBtn = e.target.closest('[data-set-random]');
      if (randBtn) {
        state.randomMatchupSize = Number(randBtn.dataset.setRandom) || 2;
        state.landingRevision++;
        render();
        return;
      }
      const landAct = e.target.closest('[data-landing-action]');
      if (landAct) {
        const action = landAct.dataset.landingAction;
        const benchId = landAct.dataset.bench;
        state.experiment = benchId;
        state.level = 'A';
        state.promptRevision = maxRevision(state.experiment, state.level);
        if (action === 'compare') {
          const live = (CATALOG.cells || []).filter(c => c.experiment === benchId && c.src).map(c => c.model);
          const u = [...new Set(live)];
          state.mode = 'compare';
          state.compareCount = 2;
          state.compareSlots = [
            { model: u[0] || state.model, experiment: benchId, level: 'A' },
            { model: u[1] || u[0] || state.model, experiment: benchId, level: 'A' }
          ];
        } else if (action === 'ladder') {
          state.mode = 'ladder';
        } else if (action === 'models') {
          state.mode = 'models';
          state.hiddenModels.clear();
        } else {
          state.mode = 'single';
        }
        applyModeDefaults(state.mode, true);
        render();
        return;
      }
      const viewModBtn = e.target.closest('[data-view-model]');
      if (viewModBtn) {
        openModelSingle(viewModBtn.dataset.viewModel, {
          experiment: viewModBtn.dataset.viewBench,
          level: viewModBtn.dataset.viewLevel
        });
        return;
      }
      const metricBtn = e.target.closest('[data-chart-metric]');
      if (metricBtn) {
        const metric = metricBtn.dataset.chartMetric;
        state.chartsMetric = metric;
        pendingStageFocus = '[data-chart-metric="' + CSS.escape(metric) + '"]';
        render();
        return;
      }

      const frame = e.target.closest('.frame');
      const act = e.target.closest('.frame-act');
      if (frame && frame.dataset.model) state.model = frame.dataset.model;
      if (!act || act.disabled) return;
      const key = act.dataset.stack || stackKey(act.dataset.model || state.model, act.dataset.level || state.level);
      const cell = cellForKey(key);
      if (act.dataset.act === 'full') {
        if (act.dataset.model) state.model = act.dataset.model;
        if (act.dataset.level) state.level = act.dataset.level;
        onMode('single');
        return;
      }
      if (act.dataset.act === 'reload') {
        reloadTake(frame, cell);
        return;
      }
      if (act.dataset.act === 'prompt') {
        copyText(promptTextFor(cell), act, 'Prompt copied');
        return;
      }
      if (act.dataset.act === 'vote') {
        if (!cell || !cell.src) return;
        const promptId = currentPromptVoteId(act.dataset.level);
        const modelId = act.dataset.model;
        const rec = voteRecord(act.dataset.level);
        submitVote(promptId, modelId, Boolean(rec.mine && rec.mine === modelId));
        return;
      }
      if (act.dataset.act === 'html') {
        if (!cell || !cell.src) return;
        if (state.htmlOpen.includes(key)) state.htmlOpen = state.htmlOpen.filter(k => k !== key);
        else state.htmlOpen.push(key);
        renderStacks();
        return;
      }
      if (act.dataset.act === 'receipt') {
        if (!hasReceipt(cell)) return;
        if (state.receiptOpenKeys.includes(key)) state.receiptOpenKeys = state.receiptOpenKeys.filter(k => k !== key);
        else state.receiptOpenKeys.push(key);
        renderStacks();
      }
    });
    document.getElementById('stacks').addEventListener('click', e => {
      const panel = e.target.closest('.panel');
      if (!panel) return;
      if (e.target.closest('.panel-close')) {
        const key = panel.dataset.stack;
        if (panel.dataset.kind === 'html') state.htmlOpen = state.htmlOpen.filter(k => k !== key);
        else state.receiptOpenKeys = state.receiptOpenKeys.filter(k => k !== key);
        renderStacks();
        return;
      }
      const copyBtn = e.target.closest('.panel-copy');
      if (copyBtn) copyText(panel.dataset.raw || '', copyBtn, 'Source copied');
    });
    document.addEventListener('keydown', e => {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.target && e.target.closest && (e.target.closest('.pick-btn') || e.target.closest('.pick-list') || e.target.closest('.pick-panel'))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') {
        if (tipAnchor) { hideTip(true); e.preventDefault(); return; }
        if (closePick() || closeLastDrawer()) e.preventDefault();
        return;
      }
      if (e.key === '1') { e.preventDefault(); onLevel('A'); }
      if (e.key === '2') { e.preventDefault(); onLevel('B'); }
      if (e.key === '3') { e.preventDefault(); onLevel('C'); }
      if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        const cell = currentCell();
        const btn = document.querySelector('.frame-act[data-act="prompt"][data-stack="' + CSS.escape(stackKey(state.model, state.level)) + '"]');
        copyText(promptTextFor(cell), btn, 'Prompt copied');
      }
      if (e.key === 'h' || e.key === 'H') {
        const cell = currentCell();
        if (!cell || !cell.src) return;
        e.preventDefault();
        setDrawer('source', !state.htmlOpen.includes(stackKey(state.model, state.level)));
      }
      if (e.key === 'r' || e.key === 'R') {
        const cell = currentCell();
        if (!hasReceipt(cell)) return;
        e.preventDefault();
        setDrawer('receipt', !state.receiptOpenKeys.includes(stackKey(state.model, state.level)));
      }
      if (e.key === '[') {
        e.preventDefault();
        state.filmCompact = !state.filmCompact;
        applyFilmCompact();
        syncUrl();
      }
    });
    applyModeDefaults(state.mode, !parsedQuery.arrange && !parsedQuery.scale);
    if (parsedQuery.arrange) state.arrange = parsedQuery.arrange;
    if (parsedQuery.scale) state.scale = parsedQuery.scale;
    function webmcpHost() {
      return {
        getPack: () => AGENT_PACK || { benchmarks: [], rules: [], levels: {} },
        getCatalog: () => CATALOG,
        getState: () => ({
          experiment: state.experiment,
          level: state.level,
          model: state.model,
          mode: state.mode,
          promptRevision: state.promptRevision,
          month: state.month,
          date: state.date
        }),
        showTake({ experiment, level, model, mode }) {
          state.experiment = experiment;
          state.level = level;
          state.model = model;
          state.mode = mode || 'single';
          state.promptRevision = maxRevision(state.experiment, state.level);
          state.date = '';
          applyModeDefaults(state.mode, true);
          render();
          const cell = currentCell();
          return {
            experiment: state.experiment,
            level: state.level,
            model: state.model,
            mode: state.mode,
            src: (cell && cell.src) || ''
          };
        },
        async loadReceipt(input) {
          let cell = currentCell();
          if (input && (input.experiment || input.model || input.level)) {
            cell = findCell(CATALOG.cells, {
              model: input.model || state.model,
              experiment: input.experiment || state.experiment,
              level: String(input.level || state.level || 'A').toUpperCase(),
              promptRevision: state.promptRevision,
              date: state.date,
              month: state.month
            });
          }
          if (cell && cell.receipt) return cell.receipt;
          if (!cell || !cell.receiptSrc) return null;
          const res = await fetch(cell.receiptSrc);
          if (!res.ok) return null;
          return res.json();
        }
      };
    }
    fetch('catalog.json')
      .then(res => {
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      })
      .then(async data => {
        CATALOG = data;
        const liveIds = (CATALOG.experiments || []).map(e => e.id).filter(Boolean);
        state.experiment = parsedQuery.experiment || liveIds[0] || '';
        if (state.experiment && liveIds.length && !liveIds.includes(state.experiment)) {
          state.experiment = liveIds[0];
        }
        state.model = parsedQuery.model || (CATALOG.models.find(m => m.playable || m.playable) || CATALOG.models[0] || {}).id || '';
        if (!state.promptRevision) state.promptRevision = maxRevision(state.experiment, state.level);
        snapFilters();
        render();
        try {
          const packRes = await fetch('agent.json');
          if (packRes.ok) AGENT_PACK = await packRes.json();
          else AGENT_PACK = null;
        } catch {
          AGENT_PACK = null;
        }
        if (AGENT_PACK) render();
        try {
          await registerGalleryWebMcp(webmcpHost());
        } catch {
          /* native or polyfill registration is optional */
        }
      })
      .catch((err) => {
        if ((CATALOG.cells || []).length) {
          console.error(err);
          return;
        }
        document.getElementById('frames').innerHTML = '<p class="empty">Could not load catalog.json.</p>';
        hideLoader(++stageToken);
      });
  </script>
</body>
</html>
