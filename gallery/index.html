        + '<div class="glance">' + badge(receipt.status) + '<span class="dur">' + esc(fmtDuration(receipt.durationMs)) + '</span></div>'
        + '<dl class="kv">' + dl + '</dl>'
        + (flags ? '<div class="flags">' + flags + '</div>' : '')
        + '<details class="raw"><summary>Raw receipt</summary><pre>' + esc(JSON.stringify(receipt, null, 2)) + '</pre></details></section>';
    }
    function setHtmlView(view) {
      state.htmlView = view;
      document.querySelectorAll('[data-html-view]').forEach(b => b.classList.toggle('active', b.dataset.htmlView === view));
      document.getElementById('html-live').hidden = view !== 'live';
      document.getElementById('html-source').hidden = view !== 'source';
    }
    async function loadHtmlSource(src) {
      const pre = document.getElementById('html-source');
      if (!src) {
        pre.textContent = 'No HTML for this take.';
        return;
      }
      if (sourceCache.has(src)) {
        pre.textContent = sourceCache.get(src);
        return;
      }
      pre.textContent = 'Loading source…';
      try {
        const res = await fetch(src);
        if (!res.ok) throw new Error(String(res.status));
        const text = await res.text();
        sourceCache.set(src, text);
        pre.textContent = text;
      } catch (err) {
        pre.textContent = 'Could not load source. Use Live to watch the take, or retry after the file is available.';
      }
    }
    function syncInspector() {
      const cell = currentCell();
      const currentExp = CATALOG.experiments.find(e => e.id === state.experiment) || {};
      const title = (currentExp.title || state.experiment || 'Take') + ' · ' + state.level;
      document.getElementById('inspector-title').textContent = title;
      document.getElementById('inspector-kicker').textContent = (cell && cell.cellId) ? cell.cellId : 'Evidence';
      document.getElementById('pane-prompt').innerHTML = promptMarkup(cell);
      document.getElementById('pane-receipt').innerHTML = receiptMarkup(cell);
      document.getElementById('pane-prompt').hidden = state.pane !== 'prompt';
      document.getElementById('pane-html').hidden = state.pane !== 'html';
      document.getElementById('pane-receipt').hidden = state.pane !== 'receipt';
      document.querySelectorAll('.inspector-tabs [data-pane]').forEach(b => {
        const on = b.dataset.pane === state.pane;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
      });
      const live = document.getElementById('html-live');
      if (state.pane === 'html' && cell && cell.src) {
        if (live.getAttribute('src') !== cell.src) live.src = cell.src;
        loadHtmlSource(cell.src);
      } else if (state.pane !== 'html') {
        live.removeAttribute('src');
      } else {
        live.removeAttribute('src');
        document.getElementById('html-source').textContent = 'No HTML for this take.';
      }
    }
    function openInspector(pane, trigger) {
      inspectorTrigger = trigger || document.activeElement;
      state.pane = pane;
      const dialog = document.getElementById('inspector');
      syncInspector();
      if (!dialog.open) dialog.showModal();
      const tab = document.getElementById('tab-' + pane);
      if (tab) tab.focus({ preventScroll: true });
    }
    function closeInspector() {
      const dialog = document.getElementById('inspector');
      if (dialog.open) dialog.close();
    }
    function renderNav() {
      const currentExp = CATALOG.experiments.find(e => e.id === state.experiment) || {};
      const cell = currentCell();
      document.getElementById('title').textContent = currentExp.title || state.experiment || 'Take';
      document.getElementById('who').textContent = state.model + ' · ' + state.level;
      const prompt = cell && cell.prompt ? oneLine(cell.prompt) : 'No prompt on file for this cell.';
      const promptText = document.getElementById('prompt-text');
      promptText.textContent = prompt;
      document.getElementById('prompt-sub').title = cell && cell.prompt ? cell.prompt : prompt;
      document.getElementById('experiments').innerHTML = CATALOG.experiments.map(e =>
        '<button type="button" data-experiment="' + e.id + '"' + (e.id === state.experiment ? ' class="active" aria-current="true"' : '') + '>' + esc(e.title) + '</button>'
      ).join('');
      document.getElementById('models').innerHTML = CATALOG.models.map(m => {
        const ghost = !m.playable ? ' ghost' : '';
        const on = m.id === state.model ? ' active' : '';
        return '<button type="button" class="' + (on + ghost).trim() + '" data-model="' + m.id + '"' + (m.id === state.model ? ' aria-current="true"' : '') + '>' + m.id + '</button>';
      }).join('');
      document.querySelectorAll('[data-level]').forEach(b => b.classList.toggle('active', b.dataset.level === state.level));
      document.querySelectorAll('[data-mode]').forEach(b => {
        const on = b.dataset.mode === state.mode;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.getElementById('open-prompt').disabled = !(cell && cell.prompt);
      document.getElementById('open-html').disabled = !(cell && cell.src);
      document.getElementById('open-receipt').disabled = !(cell && cell.receipt);
      document.getElementById('tab-html').disabled = !(cell && cell.src);
      document.getElementById('tab-receipt').disabled = !(cell && cell.receipt);
    }
    function renderStage() {
      const frames = document.getElementById('frames');
      frames.className = 'frames ' + state.mode;
      const current = currentCell();
      document.getElementById('meta').textContent = current ? current.cellId : '';
      if (state.mode === 'single') {
        frames.innerHTML = frame(state.level + ' · ' + state.model, current);
      } else if (state.mode === 'ladder') {
        frames.innerHTML = ['A', 'B', 'C'].map(level => frame(level, cellAt(state.model, state.experiment, level))).join('');
      } else {
        frames.innerHTML = CATALOG.models.map(m => frame(m.id, cellAt(m.id, state.experiment, state.level))).join('');
      }
      if (document.getElementById('inspector').open) syncInspector();
    }
    function render() {
      renderNav();
      renderStage();
    }
    document.getElementById('experiments').addEventListener('click', e => {
      const b = e.target.closest('[data-experiment]'); if (!b) return;
      state.experiment = b.dataset.experiment; render();
    });
    document.getElementById('models').addEventListener('click', e => {
      const b = e.target.closest('[data-model]'); if (!b) return;
      state.model = b.dataset.model; render();
    });
    document.querySelector('.levels').addEventListener('click', e => {
      const b = e.target.closest('[data-level]'); if (!b) return;
      state.level = b.dataset.level; render();
    });
    document.querySelector('.modes').addEventListener('click', e => {
      const b = e.target.closest('[data-mode]'); if (!b) return;
      state.mode = b.dataset.mode; render();
    });
    document.getElementById('prompt-sub').addEventListener('click', e => openInspector('prompt', e.currentTarget));
    document.querySelector('.evidence').addEventListener('click', e => {
      const b = e.target.closest('[data-open]'); if (!b || b.disabled) return;
      openInspector(b.dataset.open, b);
    });
    document.querySelector('.inspector-tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-pane]'); if (!b || b.disabled) return;
      state.pane = b.dataset.pane;
      syncInspector();
    });
    document.querySelector('.html-switch').addEventListener('click', e => {
      const b = e.target.closest('[data-html-view]'); if (!b) return;
      setHtmlView(b.dataset.htmlView);
    });
    document.getElementById('inspector-close').addEventListener('click', closeInspector);
    document.getElementById('inspector').addEventListener('click', e => {
      if (e.target.id === 'inspector') closeInspector();
    });
    document.getElementById('inspector').addEventListener('close', () => {
      document.getElementById('html-live').removeAttribute('src');
      if (inspectorTrigger && typeof inspectorTrigger.focus === 'function') {
        inspectorTrigger.focus({ preventScroll: true });
      }
    });
    document.addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const dialog = document.getElementById('inspector');
      if (!dialog.open) {
        if (e.key === '1') { state.level = 'A'; render(); }
        if (e.key === '2') { state.level = 'B'; render(); }
        if (e.key === '3') { state.level = 'C'; render(); }
      }
      if (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S') {
        e.preventDefault();
        if (dialog.open && state.pane === 'prompt') closeInspector();
        else openInspector('prompt');
      }
      if (e.key === 'h' || e.key === 'H') {
        const cell = currentCell();
        if (!cell || !cell.src) return;
        e.preventDefault();
        if (dialog.open && state.pane === 'html') closeInspector();
        else openInspector('html');
      }
      if (e.key === 'r' || e.key === 'R') {
        const cell = currentCell();
        if (!cell || !cell.receipt) return;
        e.preventDefault();
        if (dialog.open && state.pane === 'receipt') closeInspector();
        else openInspector('receipt');
      }
    });
    paintIcons();
    setHtmlView('live');
    render();
    if (q.get('script') === '1') openInspector('prompt');
  </script>
</body>
</html>
