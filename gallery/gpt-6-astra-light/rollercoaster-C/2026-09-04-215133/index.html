<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUNDOWN — A canyon coaster</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#281d32;color:#fff6e7;overflow:hidden;font-family:'DM Sans',sans-serif}canvas{display:block;width:100%;height:100%}.shade{pointer-events:none;position:fixed;inset:0;background:linear-gradient(180deg,rgba(25,18,32,.36),transparent 27%,transparent 65%,rgba(22,20,31,.7));box-shadow:inset 0 0 150px #221b2825}.top{position:fixed;top:34px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:13px;align-items:center;font-family:'Space Grotesk';font-weight:600;letter-spacing:4px;font-size:18px}.mark{width:32px;height:32px;border:1px solid #fff7d6aa;border-radius:50%;position:relative;overflow:hidden}.mark:before{content:'';position:absolute;background:#fff0bc;width:16px;height:16px;border-radius:50%;left:7px;top:6px}.mark:after{content:'';position:absolute;width:34px;height:12px;background:#483542;top:18px;transform:rotate(-18deg)}.tag{font-size:10px;letter-spacing:2px;color:#fff7dbb3}.live{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:2px}.dot{width:5px;height:5px;background:#f5d79c;box-shadow:0 0 12px #fff0ac;border-radius:50%}.left{position:fixed;left:40px;bottom:44px} .eyebrow{font-size:10px;letter-spacing:3px;color:#f4cdaa;margin-bottom:12px}h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(38px,5.2vw,76px);letter-spacing:-4px;line-height:1;margin:0 0 15px}.subtitle{font-size:12px;color:#e8d8c7b3;letter-spacing:.4px}.controls{position:fixed;bottom:42px;right:40px;display:flex;gap:9px}button{border:1px solid #eee0c430;background:#302b354d;backdrop-filter:blur(16px);color:#fff3dc;cursor:pointer;width:46px;height:46px;border-radius:50%;font:17px 'DM Sans';transition:background .2s,transform .2s}button:hover{background:#fff3dc25;transform:translateY(-2px)}button:focus-visible{outline:2px solid #f4cdaa;outline-offset:4px}button.active{border-color:#e8c19288;background:#e8c19220}.telemetry{position:fixed;right:43px;top:46%;display:flex;text-align:right;flex-direction:column;gap:20px}.num{font-family:'Space Grotesk';font-size:35px;line-height:1;font-weight:400;letter-spacing:-1px}.unit{font-size:9px;letter-spacing:2px;color:#e8d8c79c;margin-top:6px}.progress{position:fixed;bottom:0;left:0;width:100%;height:3px;background:#fff1d315}.progress span{display:block;background:#f5ce97;width:0;height:100%;box-shadow:0 0 12px #ffd69b}.map{position:fixed;left:40px;top:120px;width:150px;height:105px;opacity:.75}.map svg{width:150px;height:80px;overflow:visible}.map-label{font-size:9px;letter-spacing:2px;color:#eadac2a6;display:flex;justify-content:space-between}.hint{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:#f2dec380;white-space:nowrap}.loading{position:fixed;inset:0;background:#292134;display:grid;place-items:center;z-index:10;transition:opacity 1.5s;pointer-events:none}.loading p{letter-spacing:5px;font-size:12px}.loaded{opacity:0}.status{position:fixed;top:95px;right:40px;color:#fff0ce80;font-size:10px;letter-spacing:1px}.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#302b35a0;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}@media(max-width:650px){.top{top:24px;left:22px;right:22px}.tag,.hint{display:none}.left{left:22px;bottom:102px}h1{letter-spacing:-2px}.controls{right:22px;bottom:30px}.telemetry{right:24px;top:40%}.map{left:22px;top:92px;width:115px;transform:scale(.8);transform-origin:top left}.status{right:22px;top:74px}.live{font-size:8px;letter-spacing:1px}.subtitle{font-size:11px}}
</style></head><body>
<div id="view"></div><div class="shade"></div>
<header class="top"><div class="brand"><span class="mark"></span>SUNDOWN<span class="tag"> / CANYON RUN</span></div><div class="live"><span class="dot" id="dot"></span><span id="live">CONTINUOUS JOURNEY</span></div></header>
<div class="map"><svg viewBox="0 0 150 80"><path id="route" fill="none" stroke="#f4d7b5" stroke-width="1" opacity=".48"/><circle id="pin" r="3" fill="#ffe4ac"/></svg><div class="map-label"><span>THE CIRCUIT</span><span>01 / ∞</span></div></div>
<div class="status">36° 14′ N &nbsp; 112° 06′ W</div>
<div class="telemetry"><div><div class="num" id="speed">00</div><div class="unit">KM / H</div></div><div><div class="num" id="height">00</div><div class="unit">METERS UP</div></div></div>
<section class="left"><div class="eyebrow" id="chapter">01 — THE ASCENT</div><h1>Chase the last light.</h1><div class="subtitle">An endless ride through the painted canyon.</div></section>
<div class="hint">HEADPHONES ON. &nbsp; WORLD OFF.</div>
<nav class="controls" aria-label="Ride controls"><button id="sound" title="Enable wind ambience" aria-label="Enable wind ambience">♪</button><button id="pause" title="Pause ride (Space)" aria-label="Pause ride">Ⅱ</button><button id="restart" title="Restart ride" aria-label="Restart ride">↺</button><button id="full" title="Enter fullscreen" aria-label="Enter fullscreen">⛶</button></nav>
<div class="progress"><span id="progress"></span></div><div class="toast" id="toast"></div><div class="loading" id="loading"><p>FOLLOW THE LAST LIGHT</p></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color('#c28983');scene.fog=new THREE.FogExp2('#c38c85',.0019);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.12,2400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#f9c6a5','#52435a',2.3));const sunLight=new THREE.DirectionalLight('#ffcf8c',3);sunLight.position.set(-450,270,-700);scene.add(sunLight);
// A painted sky, held at infinity, keeps the sunset luminous through the whole circuit.
const sky=new THREE.Mesh(new THREE.SphereGeometry(1800,48,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color('#43455f')},horizon:{value:new THREE.Color('#e9a18a')},bottom:{value:new THREE.Color('#d0a18c')}},vertexShader:'varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 v;uniform vec3 top;uniform vec3 horizon;uniform vec3 bottom;void main(){float h=normalize(v).y;vec3 c=mix(horizon,top,smoothstep(0.,.7,h));c=mix(c,bottom,smoothstep(0.,-.6,h));gl_FragColor=vec4(c,1.);}'}));scene.add(sky);
const sun=new THREE.Mesh(new THREE.SphereGeometry(58,40,24),new THREE.MeshBasicMaterial({color:'#ffddb0',fog:false}));sun.position.set(-590,180,-1110);scene.add(sun);
let seed=1837;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const terrainMat=new THREE.MeshStandardMaterial({color:'#ab6c56',roughness:1,flatShading:true});
const groundGeo=new THREE.PlaneGeometry(3000,3000,100,100);groundGeo.rotateX(-Math.PI/2);const pos=groundGeo.attributes.position;for(let i=0;i<pos.count;i++){let x=pos.getX(i),z=pos.getZ(i);pos.setY(i,-14+Math.sin(x*.009)*5+Math.cos(z*.012)*5+rand()*5)}groundGeo.computeVertexNormals();scene.add(new THREE.Mesh(groundGeo,terrainMat));
// Layered sandstone towers, with irregular rims and horizontal mineral bands.
const rockColors=['#744e51','#915d56','#b4765c','#c88767','#dca17b'];
function mesa(x,z,r,h){let group=new THREE.Group();let sides=7+Math.floor(rand()*4);for(let j=0;j<5;j++){let bottom=r*(1-j*.105),top=r*(1-(j+1)*.105);const geom=new THREE.CylinderGeometry(top,bottom,h/5,sides,1);const mesh=new THREE.Mesh(geom,new THREE.MeshStandardMaterial({color:rockColors[j],flatShading:true,roughness:1}));mesh.position.y=-15+h*(j+.5)/5;mesh.rotation.y=.3;group.add(mesh)}group.position.set(x,0,z);scene.add(group)}
for(let i=0;i<95;i++){let a=rand()*Math.PI*2,r=390+rand()*720;mesa(Math.cos(a)*r,Math.sin(a)*r,28+rand()*100,35+rand()*200)}
mesa(-230,-250,53,135);mesa(280,-160,64,170);mesa(-250,180,50,100);mesa(250,250,68,130);
const points=[[-90,30,190],[-125,53,95],[-90,108,-25],[-20,136,-115],[65,121,-180],[125,35,-195],[190,24,-120],[205,57,-25],[135,72,45],[50,38,65],[-20,23,20],[-60,43,-65],[-135,67,-145],[-215,49,-125],[-245,23,-30],[-215,30,90],[-160,67,195],[-80,79,260],[45,53,265],[135,27,190],[110,20,125],[30,24,130]];
const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)),true,'centripetal');curve.arcLengthDivisions=2400;const length=curve.getLength(),segments=1500,frames=curve.computeFrenetFrames(segments,true);
const railMat=new THREE.MeshStandardMaterial({color:'#f5bc83',metalness:.7,roughness:.31});const darkMat=new THREE.MeshStandardMaterial({color:'#443e46',metalness:.65,roughness:.6});const supportMat=new THREE.MeshStandardMaterial({color:'#67585a',metalness:.4,roughness:.7});
const up=new THREE.Vector3(0,1,0);function sideAt(t){return new THREE.Vector3().crossVectors(curve.getTangentAt((t+1)%1),up).normalize()}
for(const offset of [-1.12,1.12]){let rail=[];for(let i=0;i<=segments;i++){let t=i/segments;rail.push(curve.getPointAt(t).addScaledVector(sideAt(t),offset))}scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rail),segments,.14,6,false),railMat))}
function instanceBeams(list,material,radius){const mesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(radius,radius,1,6),material,list.length);const obj=new THREE.Object3D();list.forEach(([a,b],i)=>{obj.position.copy(a).add(b).multiplyScalar(.5);obj.quaternion.setFromUnitVectors(up,b.clone().sub(a).normalize());obj.scale.set(1,a.distanceTo(b),1);obj.updateMatrix();mesh.setMatrixAt(i,obj.matrix)});scene.add(mesh)}
let ties=[],supports=[],braces=[];for(let d=0;d<length;d+=2.8){let t=d/length,p=curve.getPointAt(t),s=sideAt(t);ties.push([p.clone().addScaledVector(s,-1.45).add(new THREE.Vector3(0,-.18,0)),p.clone().addScaledVector(s,1.45).add(new THREE.Vector3(0,-.18,0))])}instanceBeams(ties,darkMat,.12);
for(let d=0;d<length;d+=25){let t=d/length,p=curve.getPointAt(t),s=sideAt(t);for(let sign of [-1,1]){let top=p.clone().addScaledVector(s,sign*1.2);top.y-=.4;let foot=p.clone().addScaledVector(s,sign*3);foot.y=-15;supports.push([foot,top]);let across=p.clone().addScaledVector(s,-sign*1.2);across.y=Math.max(-5,p.y*.52);braces.push([foot,across])} }instanceBeams(supports,supportMat,.32);instanceBeams(braces,supportMat,.17);
// Tiny desert plants and boulders lend scale to the exposed ground.
let boulders=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshStandardMaterial({color:'#96604f',roughness:1,flatShading:true}),400);let dummy=new THREE.Object3D();for(let i=0;i<400;i++){dummy.position.set((rand()-.5)*1300,-7,(rand()-.5)*1300);dummy.scale.set(1+rand()*7,1+rand()*4,1+rand()*6);dummy.rotation.set(rand(),rand()*6,rand());dummy.updateMatrix();boulders.setMatrixAt(i,dummy.matrix)}scene.add(boulders);
let cactusMat=new THREE.MeshStandardMaterial({color:'#4d6152',roughness:1});let plants=[];for(let i=0;i<100;i++){let x=(rand()-.5)*750,z=(rand()-.5)*750,y=-8,h=3+rand()*7;plants.push([new THREE.Vector3(x,y,z),new THREE.Vector3(x,y+h,z)]);if(rand()>.5){plants.push([new THREE.Vector3(x,y+h*.6,z),new THREE.Vector3(x+2,y+h*.6,z)]);plants.push([new THREE.Vector3(x+2,y+h*.6,z),new THREE.Vector3(x+2,y+h*.9,z)])}}instanceBeams(plants,cactusMat,.35);
// Front of the carriage grounds the viewpoint without obscuring the track.
const cart=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.65,1.3),new THREE.MeshStandardMaterial({color:'#784137',metalness:.55,roughness:.34}));body.position.set(0,-1.38,-1.7);cart.add(body);const bar=new THREE.Mesh(new THREE.TorusGeometry(.56,.06,8,32,Math.PI),railMat);bar.rotation.z=0;bar.position.set(0,-1.16,-1.15);cart.add(bar);camera.add(cart);scene.add(camera);
const mapCoords=[];for(let i=0;i<=150;i++){let p=curve.getPointAt(i/150);mapCoords.push([12+(p.x+245)/450*126,8+(p.z+195)/460*62])}$('route').setAttribute('d',mapCoords.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '));
let t=0,velocity=10,paused=false,last=performance.now(),smoothBank=0,audioCtx,windGain,soundOn=false;const m=new THREE.Matrix4(),right=new THREE.Vector3(),camUp=new THREE.Vector3(),back=new THREE.Vector3();
const chapters=[[.0,'01 — THE ASCENT'],[.17,'02 — THE EDGE OF LIGHT'],[.27,'03 — INTO THE CANYON'],[.46,'04 — THE WILD TURN'],[.7,'05 — THE LONG WAY HOME'],[.9,'06 — ONE MORE HORIZON']];
function togglePause(){paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'Resume ride':'Pause ride');$('live').textContent=paused?'TAKE IN THE VIEW':'CONTINUOUS JOURNEY';$('dot').style.opacity=paused?.4:1}
$('pause').onclick=togglePause;$('restart').onclick=()=>{t=0;velocity=10;smoothBank=0;if(paused)togglePause()};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Fullscreen is unavailable in this view')}};
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,2400)}
$('sound').onclick=async()=>{try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate),data=buffer.getChannelData(0);let v=0;for(let i=0;i<data.length;i++){v=(v+(Math.random()*2-1)*.04)/1.025;data[i]=v*3}const source=audioCtx.createBufferSource();source.buffer=buffer;source.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=900;windGain=audioCtx.createGain();windGain.gain.value=0;source.connect(filter).connect(windGain).connect(audioCtx.destination);source.start()}await audioCtx.resume();soundOn=!soundOn;$('sound').classList.toggle('active',soundOn);$('sound').setAttribute('aria-label',soundOn?'Mute wind ambience':'Enable wind ambience');toast(soundOn?'Wind ambience on':'Wind ambience off')}catch{toast('Audio is unavailable in this browser')}};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePause()}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;if(!paused){const tangent=curve.getTangentAt(t);let target=Math.max(9,Math.min(37,Math.sqrt(Math.max(80,2*8*(143-curve.getPointAt(t).y)))*.8));velocity+=(target-velocity)*Math.min(1,dt*.65);t=(t+velocity*dt/length)%1}const p=curve.getPointAt(t),ahead=curve.getPointAt((t+.003)%1),tangent=curve.getTangentAt(t),nextTan=curve.getTangentAt((t+.005)%1);let turn=tangent.x*nextTan.z-tangent.z*nextTan.x;let bank=THREE.MathUtils.clamp(-turn*4,-.29,.29);smoothBank+=(bank-smoothBank)*Math.min(1,dt*3);camera.position.copy(p).add(new THREE.Vector3(0,1.55,0));ahead.y+=1.45;back.copy(camera.position).sub(ahead).normalize();right.crossVectors(up,back).normalize();camUp.crossVectors(back,right);m.makeBasis(right,camUp,back);camera.quaternion.setFromRotationMatrix(m);camera.rotateZ(smoothBank);camera.fov=68+(velocity-10)*.2;camera.updateProjectionMatrix();sky.position.copy(camera.position);if(windGain)windGain.gain.setTargetAtTime(soundOn&&!paused?.11+velocity*.005:0,audioCtx.currentTime,.3);$('speed').textContent=String(Math.round(paused?0:velocity*3.6)).padStart(2,'0');$('height').textContent=Math.round(p.y+12);$('progress').style.width=t*100+'%';const mp=[12+(p.x+245)/450*126,8+(p.z+195)/460*62];$('pin').setAttribute('cx',mp[0]);$('pin').setAttribute('cy',mp[1]);$('chapter').textContent=chapters.filter(c=>t>=c[0]).at(-1)[1];renderer.render(scene,camera)}
requestAnimationFrame(animate);$('loading').classList.add('loaded');setTimeout(()=>$('loading').remove(),1600);
</script></body></html>
