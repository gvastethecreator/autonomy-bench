<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERGLOW — an endless ride</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#162830;color:#fff3df;font-family:'DM Sans',sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}.screen{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,26,31,.45),transparent 27%,transparent 65%,rgba(9,25,30,.8))}header{position:absolute;left:42px;right:42px;top:32px;display:flex;align-items:center;justify-content:space-between}.brand{font:600 23px 'Space Grotesk',sans-serif;letter-spacing:6px}.brand span{color:#ffad76}.edition{font-size:10px;letter-spacing:2px;opacity:.65;margin-top:9px}.live{border:1px solid #ffffff35;border-radius:30px;padding:11px 16px;font-size:10px;letter-spacing:2px;backdrop-filter:blur(10px)}.live i{display:inline-block;background:#bfe8b8;width:6px;height:6px;border-radius:50%;margin-right:9px;box-shadow:0 0 12px #bfe8b8}.intro{position:absolute;left:42px;bottom:144px}.eyebrow{font-size:10px;letter-spacing:3px;color:#ffd0a9;margin-bottom:12px}h1{font:400 clamp(28px,4vw,52px)/1.1 'Space Grotesk',sans-serif;margin:0 0 12px;letter-spacing:-2px}.intro p{font-size:12px;color:#cbdbd9;margin:0;letter-spacing:.2px}.controls{position:absolute;bottom:32px;left:42px;right:42px;display:flex;align-items:center;gap:24px;border-top:1px solid #ffffff30;padding-top:22px;pointer-events:auto}button{font:500 11px 'DM Sans',sans-serif;color:#fff1df;cursor:pointer;background:#ffffff0d;border:1px solid #ffffff35;border-radius:8px;padding:13px 18px;transition:.2s}button:hover{background:#ffffff25;border-color:#ffc997}#pause{background:#ffcd98;color:#243437;border:0;min-width:104px}.speed{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:1px}.speed button{padding:10px;border:0;background:transparent;color:#9db6b9}.speed button.active{color:#ffcd98;background:#ffffff0c}.stats{margin-left:auto;display:flex;gap:33px}.stat small{display:block;color:#acc2c4;font-size:9px;letter-spacing:2px;margin-bottom:4px}.stat strong{font:400 25px 'Space Grotesk',sans-serif}.stat em{font-size:10px;font-style:normal;color:#a9bfc1;margin-left:4px}.map{position:absolute;right:42px;bottom:150px;width:165px;height:130px;opacity:.85}.map svg{width:100%;height:100%;overflow:visible}.map label{position:absolute;right:0;top:-8px;font-size:9px;letter-spacing:2px;color:#d7e3dc}.hint{position:absolute;top:50%;right:35px;writing-mode:vertical-rl;font-size:9px;letter-spacing:3px;color:#ffffff70}.crosshair{position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:100%;background:#ffe6c660}.loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#18313b;z-index:4;font:400 30px 'Space Grotesk',sans-serif;transition:opacity .6s}.loading small{font:10px 'DM Sans',sans-serif;letter-spacing:3px;margin-top:18px;color:#f4c7a2}.hidden{opacity:0;pointer-events:none}@media(max-width:640px){header{left:22px;right:22px;top:24px}.brand{font-size:18px;letter-spacing:4px}.live{font-size:8px;padding:9px}.intro{left:22px;bottom:157px}.intro p{max-width:210px;line-height:1.6}.controls{left:22px;right:22px;bottom:24px;gap:8px;flex-wrap:wrap}.stats{gap:17px}.stat strong{font-size:20px}.speed{gap:1px}.speed>span{display:none}#full{display:none}.map{right:22px;bottom:177px;width:95px;height:90px}.hint{display:none}.edition{font-size:8px}.stat:last-child{display:none}}
</style></head><body>
<div id="loading" class="loading">Chasing the last light.<small>BUILDING YOUR RIDE</small></div>
<div class="screen"><header><div><div class="brand">AFTERGLOW<span> /</span></div><div class="edition">COASTAL COASTER · VOL. 01</div></div><div class="live"><i></i><span id="status">ENDLESS RIDE</span></div></header><div class="crosshair"></div><div class="hint">TAKE THE LONG WAY HOME</div><section class="intro"><div class="eyebrow">THE GOLDEN HOUR, ON REPEAT</div><h1>A little closer to the sky.</h1><p>Salt air. Steep drops. Nowhere else to be.</p></section><div class="map"><label>THE CIRCUIT</label><svg viewBox="-110 -85 220 170"><path id="route" fill="none" stroke="#f5ddba" stroke-opacity=".45" stroke-width="1.4"/><circle id="dot" r="4" fill="#ffc28b" stroke="#fff1d6" stroke-width="2"/></svg></div><footer class="controls"><button id="pause" aria-label="Pause ride">Ⅱ &nbsp; Pause</button><div class="speed"><span>PACE</span><button data-speed="0.65">Drift</button><button data-speed="1" class="active">Cruise</button><button data-speed="1.55">Rush</button></div><button id="full" aria-label="Toggle fullscreen">⛶ &nbsp; Fullscreen</button><div class="stats"><div class="stat"><small>VELOCITY</small><strong id="velocity">0</strong><em>km/h</em></div><div class="stat"><small>ALTITUDE</small><strong id="altitude">0</strong><em>m</em></div><div class="stat"><small>YOUR LAP</small><strong id="lap">01</strong><em>∞</em></div></div></footer></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#c9957e');scene.fog=new THREE.FogExp2('#c9957e',.0027);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.12,1800);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffe1bb','#304e51',2.3));const sunLight=new THREE.DirectionalLight('#ffc286',3);sunLight.position.set(-200,160,-400);scene.add(sunLight);
// A closed spline gives the ride a seamless, unbroken circuit.
const points=[[-100,23,45],[-82,35,-28],[-46,73,-70],[10,96,-87],[68,64,-69],[97,15,-30],[100,12,26],[70,36,69],[23,55,77],[-7,25,36],[12,17,0],[53,40,-7],[59,49,30],[28,24,109],[-43,13,116],[-95,17,89]].map(p=>new THREE.Vector3(...p));
const track=new THREE.CatmullRomCurve3(points,true,'centripetal');const length=track.getLength(),N=1100,frames=track.computeFrenetFrames(N,true);
const steel=new THREE.MeshStandardMaterial({color:'#344e51',metalness:.6,roughness:.45});const railMat=new THREE.MeshStandardMaterial({color:'#ffb784',metalness:.6,roughness:.29});const dark=new THREE.MeshStandardMaterial({color:'#24484c',roughness:.85});
function lateral(t){const tan=track.getTangentAt(t);return new THREE.Vector3().crossVectors(tan,new THREE.Vector3(0,1,0)).normalize()}
class Rail extends THREE.Curve{constructor(side){super();this.side=side}getPoint(t,target=new THREE.Vector3()){return target.copy(track.getPointAt(t)).addScaledVector(lateral(t),this.side)}}
for(const side of [-1.05,1.05])scene.add(new THREE.Mesh(new THREE.TubeGeometry(new Rail(side),1100,.16,7,true),railMat));
const ties=new THREE.InstancedMesh(new THREE.BoxGeometry(2.85,.18,.25),steel,640);const dummy=new THREE.Object3D();for(let i=0;i<640;i++){let t=i/640,p=track.getPointAt(t),tan=track.getTangentAt(t);dummy.position.copy(p);dummy.position.y-=.18;dummy.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(),tan,new THREE.Vector3(0,1,0)));dummy.updateMatrix();ties.setMatrixAt(i,dummy.matrix)}scene.add(ties);
function beam(a,b,r,mat){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),6),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(m)}
for(let i=0;i<95;i++){let t=i/95,p=track.getPointAt(t),side=lateral(t);for(let s of [-1,1]){let top=p.clone().addScaledVector(side,s*.9);top.y-=.25;const base=top.clone().addScaledVector(side,s*2.3);base.y=-3;beam(base,top,.38,dark)}if(i%2===0){beam(p.clone().addScaledVector(side,-.9),new THREE.Vector3(p.x+side.x*3.2,-3,p.z+side.z*3.2),.18,steel)}}
// Quiet ocean, scattered coastal islands, and an oversized sunset.
const water=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshStandardMaterial({color:'#426f76',metalness:.42,roughness:.48}));water.rotation.x=-Math.PI/2;water.position.y=-4;scene.add(water);
let seed=81;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<75;i++){const angle=rand()*Math.PI*2,dist=155+rand()*600;const h=25+rand()*145;const island=new THREE.Mesh(new THREE.ConeGeometry(25+rand()*65,h,5+Math.floor(rand()*3)),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.46,.16,.19+rand()*.11),roughness:1}));island.position.set(Math.cos(angle)*dist,h*.3-10,Math.sin(angle)*dist);island.rotation.y=rand()*6;scene.add(island)}
const sun=new THREE.Mesh(new THREE.SphereGeometry(47,40,24),new THREE.MeshBasicMaterial({color:'#ffdc9f',fog:false}));sun.position.set(-310,142,-660);scene.add(sun);
for(let i=0;i<80;i++){const glint=new THREE.Mesh(new THREE.PlaneGeometry(3+rand()*22,.12+rand()*.35),new THREE.MeshBasicMaterial({color:'#e8b18b',transparent:true,opacity:.15+rand()*.22}));glint.rotation.x=-Math.PI/2;glint.position.set(-180+rand()*280,-3.94,-550+rand()*520);scene.add(glint)}
const cloudMat=new THREE.MeshBasicMaterial({color:'#f6c8ae',transparent:true,opacity:.22,depthWrite:false});for(let i=0;i<22;i++){const cloud=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),cloudMat);cloud.position.set((rand()-.5)*1700,170+rand()*100,(rand()-.5)*1700);cloud.scale.set(50+rand()*100,2+rand()*6,15+rand()*30);scene.add(cloud)}
// Visible nose of the car anchors the first-person view.
const car=new THREE.Group();camera.add(car);scene.add(camera);const nose=new THREE.Mesh(new THREE.BoxGeometry(1.45,.34,.7),new THREE.MeshStandardMaterial({color:'#dd7853',metalness:.4,roughness:.36}));nose.position.set(0,-1.02,-1.25);car.add(nose);const bar=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.35,12),steel);bar.rotation.z=Math.PI/2;bar.position.set(0,-.81,-.99);car.add(bar);
let path='';for(let i=0;i<=200;i++){const p=track.getPointAt(i/200);path+=(i?'L':'M')+(p.x*.8).toFixed(2)+','+(p.z*.65-10).toFixed(2)}document.querySelector('#route').setAttribute('d',path);
let progress=.02,lap=1,pace=1,paused=false;const clock=new THREE.Clock();const up=new THREE.Vector3(0,1,0);const pause=document.querySelector('#pause');function toggle(){paused=!paused;pause.innerHTML=paused?'▶ &nbsp; Resume':'Ⅱ &nbsp; Pause';pause.setAttribute('aria-label',paused?'Resume ride':'Pause ride');document.querySelector('#status').textContent=paused?'TAKE A BREATH':'ENDLESS RIDE'}pause.onclick=toggle;addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{pace=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};
let displayTimer=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),p=track.getPointAt(progress);const velocity=(13+Math.sqrt(Math.max(0,98-p.y))*2.35)*pace;if(!paused){progress+=velocity*dt/length;if(progress>=1){progress%=1;lap++}}const pos=track.getPointAt(progress),tan=track.getTangentAt(progress),nextTan=track.getTangentAt((progress+.009)%1);const bank=THREE.MathUtils.clamp(tan.clone().cross(nextTan).y*5,-.38,.38);const rideUp=up.clone().applyAxisAngle(tan,bank);camera.position.copy(pos).addScaledVector(rideUp,1.35);camera.up.copy(rideUp);camera.lookAt(camera.position.clone().add(tan.clone().multiplyScalar(10)));displayTimer+=dt;if(displayTimer>.12){displayTimer=0;document.querySelector('#velocity').textContent=paused?'0':Math.round(velocity*3.6);document.querySelector('#altitude').textContent=Math.round(pos.y+4);document.querySelector('#lap').textContent=String(lap).padStart(2,'0');const dot=document.querySelector('#dot');dot.setAttribute('cx',pos.x*.8);dot.setAttribute('cy',pos.z*.65-10)}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();document.querySelector('#loading').classList.add('hidden');
</script></body></html>
