<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afterglow — a sky worth staying up for</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b16;color:#f8f1de;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}header{position:absolute;top:36px;left:4%;right:4%;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font-size:15px;letter-spacing:5px;font-weight:bold}.brand span{color:#dfad72;margin-right:12px}.edition{font-size:10px;letter-spacing:2px;color:#9298aa}.intro{position:absolute;left:5%;top:22%;pointer-events:none;max-width:390px}.eyebrow{font-size:10px;letter-spacing:3px;color:#deb889;display:flex;align-items:center;gap:12px}.eyebrow:before{content:'';height:1px;width:32px;background:#deb889}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(42px,5.3vw,78px);line-height:1.04;letter-spacing:-3px;margin:24px 0}h1 em{color:#e4b482;font-weight:normal}p{color:#969bac;font-size:13px;line-height:1.8;max-width:240px}.hint{margin-top:32px;font-size:10px;letter-spacing:1.3px;color:#b5b7c3}.hint b{font-size:19px;color:#e3b483;margin-right:10px;font-weight:normal}.bottom{position:absolute;bottom:30px;left:4%;right:4%;display:flex;align-items:end;justify-content:space-between;gap:24px}.caption{font-size:9px;letter-spacing:2px;color:#777f95;line-height:2}.caption strong{font-weight:normal;color:#bdc1cd}.panel{display:flex;gap:24px;align-items:center;background:#131827db;backdrop-filter:blur(18px);border:1px solid #ffffff16;padding:15px 20px;border-radius:10px;box-shadow:0 10px 50px #0003}.label{font-size:8px;letter-spacing:2px;color:#9098aa;margin-bottom:9px}.swatches{display:flex;gap:9px}.swatch{width:18px;height:18px;border-radius:50%;border:3px solid #141a29;outline:1px solid transparent;cursor:pointer;padding:0}.swatch.active{outline-color:#e8bd8e}.divider{height:31px;width:1px;background:#ffffff15}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #fff;outline-offset:5px}.toggle{border:0;background:none;font-size:11px;cursor:pointer;padding:5px;display:flex;gap:9px;align-items:center}.dot{height:5px;width:5px;border-radius:50%;background:#d6b17a;box-shadow:0 0 8px #d6b17a}.launch{background:#e6be8f;color:#201e22;border:0;border-radius:5px;padding:12px 18px;cursor:pointer;font-size:11px}.launch:hover{background:#ffdbad}.status{position:absolute;right:4%;top:110px;font-size:9px;letter-spacing:2px;color:#737f9a;pointer-events:none}.status span{color:#d6b17a;margin-right:7px}@media(max-width:650px){header{top:25px}.edition{font-size:8px;letter-spacing:1px}.intro{top:15%;max-width:250px}h1{font-size:48px}.intro p{font-size:12px}.hint{margin-top:20px}.bottom{bottom:18px;justify-content:center}.caption{display:none}.panel{gap:15px;padding:12px}.status{top:76px}.launch{padding:12px}.label{font-size:7px}}
</style>
</head>
<body>
<canvas id="sky" aria-label="An interactive night sky filled with colorful fireworks"></canvas>
<header><div class="brand"><span>✳</span>AFTERGLOW</div><div class="edition">A LITTLE WONDER, AFTER DARK</div></header>
<section class="intro"><div class="eyebrow">THE NIGHT IS YOURS</div><h1>Make a little<br><em>light.</em></h1><p>Some moments don’t need a reason.<br>Just an open sky.</p><div class="hint"><b>+</b> CLICK ANYWHERE TO CELEBRATE</div></section>
<div class="status"><span>●</span> LIVE SKY · <span id="count">00</span> BURSTS</div>
<footer class="bottom"><div class="caption"><strong>LOOK UP. STAY A WHILE.</strong><br>YOUR OWN SMALL CELEBRATION</div><div class="panel"><div><div class="label">PALETTE</div><div class="swatches"><button class="swatch active" style="background:#e8b575" data-p="0" aria-label="Golden hour palette" aria-pressed="true"></button><button class="swatch" style="background:#bd9afa" data-p="1" aria-label="Violet dream palette" aria-pressed="false"></button><button class="swatch" style="background:#8fdccf" data-p="2" aria-label="Northern lights palette" aria-pressed="false"></button><button class="swatch" style="background:conic-gradient(#ff869d,#edd790,#90decb,#ae98ed,#ff869d)" data-p="3" aria-label="All colors palette" aria-pressed="false"></button></div></div><div class="divider"></div><button class="toggle" id="auto" aria-pressed="true"><span class="dot"></span><span id="autotext">Autoplay on</span></button><button class="launch" id="finale">Grand finale ↗</button></div></footer>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,dpr,particles=[],rockets=[],stars=[],palette=0,auto=true,bursts=0,last=0,next=0,finaleUntil=0;const palettes=[[35,43,24],[270,295,235],[165,185,145],[0,45,160,205,280,330]];const rand=(a,b)=>a+Math.random()*(b-a);function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:100},()=>({x:Math.random()*w,y:Math.random()*h*.84,r:rand(.3,1),a:rand(.12,.5)}));}addEventListener('resize',resize);resize();
function launch(x=rand(w*.42,w*.93),y=rand(h*.15,h*.51)){let colors=palettes[palette];rockets.push({x:x+rand(-90,90),y:h*.91,tx:x,ty:y,hue:colors[Math.floor(Math.random()*colors.length)],trail:[]});}
function burst(r){bursts++;document.getElementById('count').textContent=String(bursts).padStart(2,'0');let n=150,speed=rand(100,165),ring=Math.random()<.28;for(let i=0;i<n;i++){let angle=i/n*Math.PI*2,v=ring?speed*rand(.9,1.03):speed*Math.sqrt(Math.random());particles.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v,hue:r.hue+rand(-9,9),age:0,life:rand(1.3,2.8),size:rand(.7,1.8)});}particles.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:0,vy:0,hue:r.hue,age:0,life:.22,size:25});}
function frame(t){let dt=Math.min((t-last)/1000||.016,.04);last=t;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#080b16';ctx.fillRect(0,0,w,h);let glow=ctx.createRadialGradient(w*.7,h*.65,0,w*.7,h*.65,w*.7);glow.addColorStop(0,'#142038');glow.addColorStop(1,'#080b16');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(const s of stars){ctx.globalAlpha=s.a*(.7+.3*Math.sin(t/2000+s.x));ctx.fillStyle='#b6c9ea';ctx.fillRect(s.x,s.y,s.r,s.r);}ctx.globalAlpha=1;
// A distant shoreline grounds the spectacle.
ctx.fillStyle='#080d18';ctx.beginPath();ctx.moveTo(0,h*.88);for(let x=0;x<=w;x+=20)ctx.lineTo(x,h*(.88+.008*Math.sin(x*.02)+.009*Math.sin(x*.006)));ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle='#121c2c';ctx.fillRect(0,h*.915,w,1);
if((auto||t<finaleUntil)&&t>next){launch();next=t+(t<finaleUntil?160:rand(750,1350));}ctx.globalCompositeOperation='lighter';
for(let i=rockets.length-1;i>=0;i--){let r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,dist=Math.hypot(dx,dy),step=dt*330;r.trail.push({x:r.x,y:r.y});if(r.trail.length>16)r.trail.shift();if(dist<step+8){r.x=r.tx;r.y=r.ty;burst(r);rockets.splice(i,1);continue;}r.x+=dx/dist*step;r.y+=dy/dist*step;for(let j=1;j<r.trail.length;j++){ctx.strokeStyle=`hsla(${r.hue},90%,75%,${j/r.trail.length*.45})`;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(r.trail[j-1].x,r.trail[j-1].y);ctx.lineTo(r.trail[j].x,r.trail[j].y);ctx.stroke();}ctx.fillStyle='#fff5da';ctx.fillRect(r.x-1,r.y-2,2,3);}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.age+=dt;if(p.age>p.life){particles.splice(i,1);continue;}p.px=p.x;p.py=p.y;p.vx*=Math.exp(-.62*dt);p.vy=p.vy*Math.exp(-.62*dt)+23*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;let a=Math.pow(1-p.age/p.life,1.2);ctx.strokeStyle=`hsla(${p.hue},90%,${65+a*23}%,${a})`;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();ctx.fillStyle=`hsla(${p.hue},100%,78%,${a*.11})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2);ctx.fill();if(p.y<h*.87){ctx.fillStyle=`hsla(${p.hue},85%,65%,${a*.075})`;ctx.fillRect(p.x,h*.93+(h*.7-p.y)*.12,rand(2,5),1);}}
ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame);}
canvas.addEventListener('pointerdown',e=>launch(e.clientX,Math.min(e.clientY,h*.8)));document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{palette=+b.dataset.p;document.querySelectorAll('.swatch').forEach(s=>{s.classList.toggle('active',s===b);s.setAttribute('aria-pressed',s===b?'true':'false');});launch();});document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').setAttribute('aria-pressed',String(auto));document.getElementById('autotext').textContent='Autoplay '+(auto?'on':'off');document.querySelector('.dot').style.opacity=auto?'1':'.25';};document.getElementById('finale').onclick=()=>{finaleUntil=performance.now()+5000;next=0;};if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('auto').click();else{launch(w*.68,h*.28);launch(w*.87,h*.44);}requestAnimationFrame(frame);
</script>
</body>
</html>
