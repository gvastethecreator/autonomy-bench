<!DOCTYPE html>
<html lang="en" data-theme="safelight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#160e0c">
  <title>Helios — exposing plate</title>
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --font-display: "Iowan Old Style", Palatino, "Palatino Linotype", "Times New Roman", serif;
      --font-text: Inter, "SF Pro Text", -apple-system, system-ui, "Segoe UI", sans-serif;
      --font-data: "SF Mono", "Cascadia Mono", "Segoe UI Mono", ui-monospace, monospace;
      --space: 8px;
      --focus: var(--accent);
      --sun-core: oklch(0.74 0.19 38);
      --sun-mid: oklch(0.52 0.18 32);
      --sun-limb: oklch(0.28 0.12 28);
      --prominence: oklch(0.78 0.17 40);
    }

    [data-theme="safelight"] {
      color-scheme: dark;
      --canvas: oklch(0.14 0.025 32);
      --canvas-hot: oklch(0.22 0.05 38);
      --ink: oklch(0.93 0.02 70);
      --ink-muted: oklch(0.78 0.04 55);
      --line: oklch(0.93 0.02 70 / 0.14);
      --accent: oklch(0.78 0.14 48);
      --surface: oklch(0.18 0.03 32);
      --well: oklch(0.09 0.02 28);
      --emulsion: oklch(0.11 0.025 30);
      --brass-hi: oklch(0.46 0.08 62);
      --brass-lo: oklch(0.24 0.04 48);
      --btn-bg: oklch(0.2 0.03 32);
      --shadow: oklch(0.08 0.02 30 / 0.55);
    }

    [data-theme="daylight"] {
      color-scheme: light;
      --canvas: oklch(0.93 0.02 82);
      --canvas-hot: oklch(0.96 0.02 90);
      --ink: oklch(0.24 0.04 40);
      --ink-muted: oklch(0.42 0.04 48);
      --line: oklch(0.24 0.04 40 / 0.16);
      --accent: oklch(0.48 0.14 38);
      --surface: oklch(0.97 0.015 88);
      --well: oklch(0.88 0.03 80);
      --emulsion: oklch(0.86 0.03 78);
      --brass-hi: oklch(0.78 0.04 80);
      --brass-lo: oklch(0.62 0.03 70);
      --btn-bg: oklch(0.97 0.015 88);
      --shadow: oklch(0.4 0.04 50 / 0.18);
      --sun-core: oklch(0.58 0.18 36);
      --sun-mid: oklch(0.44 0.16 32);
      --sun-limb: oklch(0.32 0.12 28);
      --prominence: oklch(0.56 0.16 38);
    }

    @media (prefers-contrast: more) {
      [data-theme="safelight"] {
        --ink: oklch(0.97 0.01 70);
        --ink-muted: oklch(0.86 0.03 60);
        --line: oklch(0.97 0.01 70 / 0.4);
      }
      [data-theme="daylight"] {
        --ink: oklch(0.16 0.03 40);
        --ink-muted: oklch(0.3 0.04 40);
        --line: oklch(0.16 0.03 40 / 0.45);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-text);
      font-size: 1rem;
      line-height: 1.5;
      background:
        radial-gradient(1200px 700px at 50% 28%, var(--canvas-hot), var(--canvas) 58%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body.theme-switching, body.theme-switching * {
      transition: none !important;
    }

    .safelight {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% -10%, oklch(0.55 0.14 48 / 0.18), transparent 70%);
      opacity: 0.7;
      z-index: 0;
    }
    [data-theme="daylight"] .safelight { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      [data-theme="safelight"] .safelight {
        animation: glow 5.5s var(--ease-in-out) infinite alternate;
      }
    }
    @keyframes glow {
      from { opacity: 0.45; }
      to { opacity: 0.85; }
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) 0.5rem max(1.25rem, env(safe-area-inset-left));
    }
    .brand { min-width: 0; }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }
    .brand p {
      margin: 0.3rem 0 0;
      color: var(--ink-muted);
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    button {
      appearance: none;
      min-height: 44px;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--ink);
      font: 500 0.875rem/1.2 var(--font-text);
      cursor: pointer;
      transition-property: transform, background-color, border-color;
      transition-duration: 140ms;
      transition-timing-function: var(--ease-out);
    }
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    @media (hover: hover) and (pointer: fine) {
      button:hover { border-color: color-mix(in oklab, var(--accent) 55%, var(--line)); }
    }
    button:active { transform: scale(0.96); }

    main {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 1.5rem;
      padding: 1rem 1.25rem 2rem;
    }

    .aperture {
      --p: 0;
      width: min(72vmin, 22rem);
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 7.5%;
      background:
        radial-gradient(circle at 50% 36%, transparent 64%, var(--brass-lo) 65.2%, var(--brass-hi) 71%, var(--brass-lo) 86%),
        conic-gradient(from 118deg, var(--brass-lo), var(--brass-hi), var(--brass-lo), color-mix(in oklab, var(--brass-hi) 70%, white), var(--brass-lo));
      box-shadow:
        0 18px 40px var(--shadow),
        inset 0 1px 0 oklch(1 0 0 / 0.18);
      position: relative;
    }
    .aperture::before {
      content: "";
      position: absolute;
      top: 3.4%;
      left: 50%;
      width: 7px;
      height: 10px;
      transform: translateX(-50%);
      background: var(--accent);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }
    .well {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--well);
      isolation: isolate;
    }
    .sun-fallback {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background: radial-gradient(circle at 48% 42%, var(--sun-core), var(--sun-mid) 52%, var(--sun-limb) 100%);
    }
    .is-canvas .sun-fallback { opacity: 0; }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .slit {
      position: absolute;
      top: -6%;
      bottom: -6%;
      left: calc(var(--p) * 100%);
      width: 3px;
      background: color-mix(in oklab, var(--accent) 80%, white);
      box-shadow: 0 0 16px 4px color-mix(in oklab, var(--accent) 45%, transparent);
      transform: translateX(-50%);
      opacity: 0.95;
      pointer-events: none;
      z-index: 2;
    }
    .is-ready .slit { opacity: 0; transition: opacity 280ms var(--ease-out); }
    @media (prefers-reduced-motion: reduce) {
      .slit { display: none; }
    }

    .readout {
      display: grid;
      justify-items: center;
      gap: 0.35rem;
      min-height: 4.5rem;
      text-align: center;
    }
    .status {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .pct {
      font-family: var(--font-data);
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
    }
    .caption {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }

    progress {
      appearance: none;
      width: min(22rem, 72vw);
      height: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    progress::-webkit-progress-bar { background: var(--line); }
    progress::-webkit-progress-value {
      background: var(--accent);
      transition: none;
    }
    progress::-moz-progress-bar { background: var(--accent); }

    .hint {
      margin: 0;
      padding: 0 1.25rem 1.25rem;
      color: var(--ink-muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    noscript .note {
      margin: 0 auto 1rem;
      max-width: 28rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      .aperture, .readout, .top {
        animation: enter 520ms var(--ease-out) both;
      }
      .readout { animation-delay: 80ms; }
      .top { animation-delay: 0ms; }
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 420px) {
      .brand h1 { font-size: 1.4rem; }
      .top { align-items: center; }
      main { gap: 1.15rem; }
    }

    @media (prefers-reduced-transparency: reduce) {
      body { background: var(--canvas); }
      .safelight { display: none; }
    }

    @media (forced-colors: active) {
      body { background: Canvas; color: CanvasText; }
      .aperture { background: Canvas; border: 3px solid CanvasText; box-shadow: none; }
      .well { background: Canvas; }
      button { border: 1px solid ButtonText; background: ButtonFace; color: ButtonText; }
      progress { background: GrayText; }
      .safelight { display: none; }
    }
  </style>
</head>
<body>
  <div class="safelight" aria-hidden="true"></div>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Helios</h1>
        <p>Solar plate archive</p>
      </div>
      <div class="actions">
        <button type="button" id="theme" aria-pressed="false" aria-label="Daylight lighting">Daylight</button>
        <button type="button" id="skip" aria-keyshortcuts="Escape">Skip wait</button>
      </div>
    </header>

    <main id="stage" aria-busy="true">
      <noscript>
        <p class="note">JavaScript is required to run the exposure sequence. The plate below is a still frame.</p>
      </noscript>

      <div class="aperture" id="aperture" aria-hidden="true">
        <div class="well">
          <div class="sun-fallback"></div>
          <canvas id="plate" width="512" height="512"></canvas>
          <div class="slit" id="slit"></div>
        </div>
      </div>

      <div class="readout">
        <p class="status" id="status" role="status">Aligning the slit</p>
        <div class="pct" id="pct">0%</div>
        <p class="caption">H-alpha · 656.3&nbsp;nm</p>
      </div>

      <label class="sr-only" for="load">Plate exposure</label>
      <progress id="load" max="100" value="0"></progress>
    </main>

    <p class="hint">Simulated exposure · Escape skips</p>
  </div>

  <script>
    (function () {
      const DURATION = 7400;
      const stages = [
        { until: 0.16, label: "Aligning the slit" },
        { until: 0.74, label: "Exposing H-alpha" },
        { until: 0.92, label: "Washing the plate" },
        { until: 1, label: "Plate ready" }
      ];

      const root = document.documentElement;
      const body = document.body;
      const stage = document.getElementById("stage");
      const aperture = document.getElementById("aperture");
      const canvas = document.getElementById("plate");
      const ctx = canvas.getContext("2d", { alpha: true });
      const statusEl = document.getElementById("status");
      const pctEl = document.getElementById("pct");
      const bar = document.getElementById("load");
      const skipBtn = document.getElementById("skip");
      const themeBtn = document.getElementById("theme");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      const KEY = "helios-theme";

      let elapsed = 0;
      let last = 0;
      let running = true;
      let raf = 0;
      let grain = null;
      let lastLabel = "";

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = seed + 0x6D2B79F5 | 0;
          let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function makeGrain(size) {
        const off = document.createElement("canvas");
        off.width = off.height = size;
        const g = off.getContext("2d");
        const img = g.createImageData(size, size);
        const rand = mulberry32(47);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = 90 + rand() * 140;
          img.data[i] = n;
          img.data[i + 1] = n * 0.42;
          img.data[i + 2] = n * 0.28;
          img.data[i + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        return off;
      }

      function css(name) {
        return getComputedStyle(root).getPropertyValue(name).trim();
      }

      function resize() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const box = canvas.getBoundingClientRect();
        const side = Math.max(2, Math.round(box.width * dpr));
        if (canvas.width !== side) {
          canvas.width = canvas.height = side;
          grain = makeGrain(256);
        }
        draw(Math.min(1, elapsed / DURATION));
      }

      function filament(g, cx, cy, r, pts, width, alpha) {
        g.save();
        g.globalAlpha = alpha;
        g.strokeStyle = "oklch(0.18 0.08 25)";
        g.lineWidth = width;
        g.lineCap = "round";
        g.beginPath();
        pts.forEach(function (p, i) {
          const x = cx + (p[0] - 0.5) * r * 1.7;
          const y = cy + (p[1] - 0.5) * r * 1.7;
          if (i === 0) g.moveTo(x, y);
          else g.lineTo(x, y);
        });
        g.stroke();
        g.restore();
      }

      function flame(g, cx, cy, r, deg, size, alpha) {
        const a = deg * Math.PI / 180;
        g.save();
        g.translate(cx + Math.cos(a) * r * 0.93, cy + Math.sin(a) * r * 0.93);
        g.rotate(a);
        g.globalAlpha = alpha;
        g.fillStyle = css("--prominence");
        g.beginPath();
        g.moveTo(0, -size * 0.28);
        g.quadraticCurveTo(size * 1.35, 0, 0, size * 0.28);
        g.closePath();
        g.fill();
        g.restore();
      }

      function drawSun(g, size, progress, t) {
        const cx = size / 2;
        const cy = size / 2;
        const r = size * 0.42;
        const disk = Math.min(1, progress / 0.85);

        g.fillStyle = css("--emulsion");
        g.fillRect(0, 0, size, size);

        g.save();
        if (!reduce.matches) {
          g.beginPath();
          g.rect(0, 0, size * Math.max(0.02, progress), size);
          g.clip();
        } else {
          g.globalAlpha = 0.2 + 0.8 * progress;
        }

        const rad = g.createRadialGradient(cx - r * 0.12, cy - r * 0.18, r * 0.08, cx, cy, r);
        rad.addColorStop(0, css("--sun-core"));
        rad.addColorStop(0.48, css("--sun-mid"));
        rad.addColorStop(0.86, css("--sun-limb"));
        rad.addColorStop(1, "oklch(0.16 0.06 28)");
        g.fillStyle = rad;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();

        g.save();
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.clip();
        g.globalCompositeOperation = "overlay";
        g.globalAlpha = 0.42 * disk;
        if (grain) {
          g.translate(cx, cy);
          if (!reduce.matches) g.rotate(t * 0.04);
          g.drawImage(grain, -r, -r, r * 2, r * 2);
        }
        g.restore();

        g.save();
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.clip();
        const fil = Math.max(0, (progress - 0.28) / 0.45);
        filament(g, cx, cy, r, [[0.32, 0.3], [0.4, 0.4], [0.36, 0.54], [0.44, 0.66]], 2.4, fil);
        filament(g, cx, cy, r, [[0.62, 0.26], [0.58, 0.4], [0.66, 0.52], [0.56, 0.64]], 1.8, fil * 0.85);
        filament(g, cx, cy, r, [[0.48, 0.58], [0.52, 0.7], [0.44, 0.8]], 2, fil * 0.7);
        g.restore();

        g.strokeStyle = css("--prominence");
        g.globalAlpha = 0.55 * disk;
        g.lineWidth = Math.max(2, size * 0.008);
        g.beginPath();
        g.arc(cx, cy, r * 0.995, 0, Math.PI * 2);
        g.stroke();
        g.globalAlpha = 1;

        const prom = Math.max(0, (progress - 0.62) / 0.3);
        flame(g, cx, cy, r, -18, r * 0.22, prom);
        flame(g, cx, cy, r, 32, r * 0.14, prom * 0.8);
        flame(g, cx, cy, r, 128, r * 0.18, prom * 0.9);
        flame(g, cx, cy, r, 208, r * 0.16, prom * 0.75);
        flame(g, cx, cy, r, 302, r * 0.2, prom);

        g.restore();
      }

      function stageFor(p) {
        for (let i = 0; i < stages.length; i += 1) {
          if (p <= stages[i].until) return stages[i].label;
        }
        return stages[stages.length - 1].label;
      }

      function setReady(ready) {
        body.classList.toggle("is-ready", ready);
        stage.setAttribute("aria-busy", ready ? "false" : "true");
        skipBtn.textContent = ready ? "Watch again" : "Skip wait";
        document.title = ready ? "Helios — plate ready" : "Helios — exposing plate";
      }

      function draw(p) {
        const t = elapsed / 1000;
        drawSun(ctx, canvas.width, p, t);
        aperture.style.setProperty("--p", String(p));
        const pct = Math.round(p * 100);
        bar.value = pct;
        pctEl.textContent = pct + "%";
        const label = stageFor(p);
        if (label !== lastLabel) {
          lastLabel = label;
          statusEl.textContent = label;
        }
        body.classList.add("is-canvas");
      }

      function tick(now) {
        if (!last) last = now;
        const delta = now - last;
        last = now;
        if (running && !document.hidden) elapsed += delta;
        const p = Math.min(1, elapsed / DURATION);
        draw(p);
        if (p >= 1) {
          running = false;
          setReady(true);
          raf = 0;
          return;
        }
        raf = requestAnimationFrame(tick);
      }

      function startLoop() {
        if (raf) cancelAnimationFrame(raf);
        last = 0;
        raf = requestAnimationFrame(tick);
      }

      function skip() {
        elapsed = DURATION;
        running = false;
        draw(1);
        setReady(true);
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
      }

      function restart() {
        elapsed = 0;
        running = true;
        lastLabel = "";
        setReady(false);
        startLoop();
      }

      skipBtn.addEventListener("click", function () {
        if (body.classList.contains("is-ready")) restart();
        else skip();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && running && elapsed < DURATION) {
          event.preventDefault();
          skip();
        }
      });

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        const daylight = theme === "daylight";
        themeBtn.setAttribute("aria-pressed", daylight ? "true" : "false");
        themeBtn.setAttribute("aria-label", "Daylight lighting");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", daylight ? "#f3ead8" : "#160e0c");
        draw(Math.min(1, elapsed / DURATION));
      }

      themeBtn.addEventListener("click", function () {
        body.classList.add("theme-switching");
        const next = root.getAttribute("data-theme") === "daylight" ? "safelight" : "daylight";
        applyTheme(next);
        try { localStorage.setItem(KEY, next); } catch (err) {}
        requestAnimationFrame(function () {
          body.classList.remove("theme-switching");
        });
      });

      try {
        const saved = localStorage.getItem(KEY);
        if (saved === "daylight" || saved === "safelight") applyTheme(saved);
      } catch (err) {}

      window.addEventListener("resize", resize);
      document.addEventListener("visibilitychange", function () {
        last = 0;
      });
      reduce.addEventListener("change", function () {
        draw(Math.min(1, elapsed / DURATION));
      });

      grain = makeGrain(256);
      resize();
      startLoop();
    })();
  </script>
</body>
</html>
