<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dusk Hart — Procedural Walk</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <style>
    :root {
      --ink: #f4e7d4;
      --muted: #cbb79a;
      --accent: #e2a56c;
      --panel: rgba(14, 10, 8, 0.78);
      --line: rgba(226, 165, 108, 0.38);
      --serif: "Palatino Linotype", Palatino, "Iowan Old Style", "Times New Roman", serif;
      --sans: "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Mono", "Segoe UI Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #120e0c;
      color: var(--ink);
      font-family: var(--sans);
    }
    body { overflow: hidden; }
    .skip {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      z-index: 8;
      padding: 0.45rem 0.7rem;
      background: #1c1612;
      color: var(--ink);
      text-decoration: none;
      border-radius: 0.3rem;
      transform: translateY(-150%);
    }
    .skip:focus { transform: none; }
    main { height: 100%; }
    #stage {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #stage:active { cursor: grabbing; }
    .hud {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }
    .hud > * { pointer-events: auto; }
    .top-left {
      top: max(0.85rem, env(safe-area-inset-top));
      left: max(0.85rem, env(safe-area-inset-left));
      max-width: min(28rem, calc(100% - 2rem));
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.55rem, 3vw, 2.15rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.05;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }
    .lede {
      margin: 0.35rem 0 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      padding: 0.85rem 0.95rem 0.95rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    #controls {
      position: absolute;
      z-index: 3;
      left: max(0.85rem, env(safe-area-inset-left));
      bottom: max(0.85rem, env(safe-area-inset-bottom));
      width: min(22.5rem, calc(100% - 1.7rem));
    }
    #controls h2 {
      margin: 0 0 0.65rem;
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
    }
    .fields { display: grid; gap: 0.55rem; }
    .field {
      display: grid;
      gap: 0.2rem;
    }
    .field label {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .field label span { color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 0.76rem; }
    input[type="range"] {
      width: 100%;
      height: 1.7rem;
      margin: 0;
      accent-color: var(--accent);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.7rem;
    }
    button, .check {
      min-height: 2.5rem;
      padding: 0 0.8rem;
      border-radius: 0.45rem;
      border: 1px solid var(--line);
      background: rgba(48, 32, 22, 0.8);
      color: var(--ink);
      font: 600 0.85rem/1 var(--sans);
      cursor: pointer;
    }
    button:hover, .check:hover { background: rgba(72, 46, 28, 0.95); }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .check input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .stats {
      position: absolute;
      top: max(0.85rem, env(safe-area-inset-top));
      right: max(0.85rem, env(safe-area-inset-right));
      z-index: 3;
      min-width: 11rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .stats strong { color: var(--ink); font-weight: 600; }
    .hint {
      margin: 0.7rem 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.4;
    }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    #boot {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: grid;
      place-items: center;
      background: #120e0c;
      font-family: var(--serif);
      font-size: 1.35rem;
    }
    #boot.err { padding: 2rem; text-align: center; color: #f0c9a0; }
    @media (max-width: 700px) {
      .stats { display: none; }
      .lede { max-width: 28ch; font-size: 0.88rem; }
      #controls { width: calc(100% - 1.4rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    @media (forced-colors: active) {
      .panel, button, .check { border: 1px solid ButtonText; background: Canvas; color: CanvasText; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#controls">Skip to gait controls</a>
  <div id="boot" role="status">Loading the heath…</div>
  <main>
    <canvas id="stage" aria-label="Dusk Hart, an antlered biped walking a circular path on a peat heath"></canvas>
  </main>
  <header class="hud top-left">
    <h1>Dusk Hart</h1>
    <p class="lede">A peatland biped driven by two-bone IK, duty-factor gait, and planted feet — no keyframes.</p>
  </header>
  <aside class="stats panel" id="stats" aria-hidden="true"></aside>
  <section class="panel" id="controls" aria-labelledby="ctrl-title">
    <h2 id="ctrl-title">Gait</h2>
    <div class="fields">
      <div class="field">
        <label for="spd">Walk speed <span id="spd-val">1.15 m/s</span></label>
        <input id="spd" type="range" min="0" max="2.5" step="0.05" value="1.15" />
      </div>
      <div class="field">
        <label for="lift">Step lift <span id="lift-val">100%</span></label>
        <input id="lift" type="range" min="0.4" max="1.6" step="0.05" value="1" />
      </div>
    </div>
    <div class="row">
      <button type="button" id="btn-pause">Pause</button>
      <button type="button" id="btn-reset">Reset path</button>
      <label class="check"><input id="follow" type="checkbox" checked /> Camera follow</label>
      <label class="check"><input id="rig" type="checkbox" /> Show rig</label>
    </div>
    <p class="hint">Drag to orbit, scroll to zoom. Space pauses. 1 / 2 change speed.</p>
  </section>
  <div id="status" role="status" aria-live="polite"></div>

  <script type="module">
    import * as THREE from "three";

    const boot = document.getElementById("boot");
    const stage = document.getElementById("stage");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const state = {
      paused: reduceMotion,
      speed: 1.15,
      lift: 1,
      follow: true,
      rig: false,
    };

    const PATH_R = 8.2;
    const HIP_Y = 1.04;
    const HIP_W = 0.13;
    const THIGH = 0.5;
    const SHIN = 0.46;
    const UP = new THREE.Vector3(0, 1, 0);

    const _v1 = new THREE.Vector3();
    const _v2 = new THREE.Vector3();
    const _v3 = new THREE.Vector3();
    const _m = new THREE.Matrix4();
    const _q = new THREE.Quaternion();
    const _q2 = new THREE.Quaternion();

    function mulberry32(a) {
      return function rng() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20260823);

    function wrap01(x) {
      x %= 1;
      return x < 0 ? x + 1 : x;
    }

    function hash2(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function noiseTexture(size, fn) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(size, size);
      const d = img.data;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const n = hash2(x * 0.17, y * 0.19) * 0.6 + hash2(x * 0.07, y * 0.06) * 0.4;
          const [r, g, b] = fn(x / size, y / size, n);
          const i = (y * size + x) * 4;
          d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function pathPose(angle) {
      const s = Math.sin(angle);
      const c = Math.cos(angle);
      return {
        pos: new THREE.Vector3(PATH_R * s, 0, PATH_R * c),
        fwd: new THREE.Vector3(c, 0, -s),
        right: new THREE.Vector3(s, 0, c),
      };
    }

    function setPathOn(obj, angle) {
      const pose = pathPose(angle);
      obj.position.copy(pose.pos);
      obj.rotation.set(0, Math.atan2(pose.fwd.x, pose.fwd.z), 0);
      return pose;
    }

    try {
      init();
    } catch (err) {
      boot.classList.add("err");
      boot.textContent = "Could not start WebGL. Serve this file over http and use a current browser.";
      console.error(err);
    }

    function init() {
      const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.85));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x1a1418, 1);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x1a1418, 0.038);

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
      const cam = { az: 0.72, el: 0.36, dist: 6.1, azT: 0.72, elT: 0.36, distT: 6.1 };
      const look = new THREE.Vector3(0, 1.15, PATH_R);

      const hideTex = noiseTexture(256, (u, v, n) => {
        const moss = 28 + n * 36;
        return [36 + n * 28, 52 + moss * 0.45, 58 + n * 18];
      });
      hideTex.repeat.set(2.2, 2.2);
      const groundTex = noiseTexture(512, (u, v, n) => {
        const t = n * 0.7 + Math.abs(Math.sin(u * 28) * Math.sin(v * 22)) * 0.3;
        return [48 + t * 40, 42 + t * 28, 28 + t * 12];
      });
      groundTex.repeat.set(18, 18);

      const hide = new THREE.MeshPhysicalMaterial({
        color: 0x44585c, map: hideTex, roughness: 0.74, metalness: 0.03,
        sheen: 0.35, sheenColor: 0x7d9a86, sheenRoughness: 0.78,
      });
      const belly = new THREE.MeshStandardMaterial({ color: 0x9a6244, roughness: 0.7, metalness: 0.02 });
      const antlerMat = new THREE.MeshStandardMaterial({ color: 0xddc6a4, roughness: 0.52, metalness: 0.04 });
      const hoofMat = new THREE.MeshStandardMaterial({ color: 0x1c1612, roughness: 0.38, metalness: 0.12 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x14110f, roughness: 0.45 });
      const emberMat = new THREE.MeshStandardMaterial({
        color: 0xff7a3a, emissive: 0xff6a28, emissiveIntensity: 2.4, roughness: 0.3,
      });
      const eyeMat = new THREE.MeshStandardMaterial({
        color: 0xffc56a, emissive: 0xffb347, emissiveIntensity: 1.8, roughness: 0.25,
      });
      const lichenMat = new THREE.MeshStandardMaterial({
        color: 0x8fd18a, emissive: 0x3d7a40, emissiveIntensity: 0.55, roughness: 0.62,
      });
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x6a6258, roughness: 0.9, metalness: 0.02 });
      const tuftMat = new THREE.MeshStandardMaterial({ color: 0x3f4a2c, roughness: 0.95 });

      function mesh(geo, mat) {
        const m = new THREE.Mesh(geo, mat);
        m.castShadow = true;
        m.receiveShadow = true;
        return m;
      }

      const rigGroup = new THREE.Group();
      rigGroup.visible = false;

      function marker(color) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.045, 10, 8),
          new THREE.MeshBasicMaterial({ color, depthTest: false })
        );
        m.renderOrder = 3;
        rigGroup.add(m);
        return m;
      }
      const markL = marker(0x66ffcc);
      const markR = marker(0xff8866);

      function makeSky() {
        const geo = new THREE.SphereGeometry(70, 24, 16);
        const col = [];
        const pos = geo.attributes.position;
        const zenith = new THREE.Color(0x171322);
        const horizon = new THREE.Color(0xc47b4c);
        const nadir = new THREE.Color(0x241610);
        const c = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i) / 70;
          if (y > 0) c.copy(horizon).lerp(zenith, Math.pow(y, 0.62));
          else c.copy(horizon).lerp(nadir, Math.min(1, -y * 1.7));
          c.convertSRGBToLinear();
          col.push(c.r, c.g, c.b);
        }
        geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
        const sky = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
          vertexColors: true, side: THREE.BackSide, depthWrite: false, fog: false,
        }));
        return sky;
      }
      scene.add(makeSky());

      const sun = new THREE.DirectionalLight(0xffc089, 2.35);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 42;
      sun.shadow.camera.left = -11;
      sun.shadow.camera.right = 11;
      sun.shadow.camera.top = 11;
      sun.shadow.camera.bottom = -11;
      sun.shadow.bias = -0.00035;
      scene.add(sun);
      scene.add(sun.target);
      scene.add(new THREE.HemisphereLight(0x9ab0ff, 0x3a2418, 0.62));
      const rim = new THREE.DirectionalLight(0x6e8cff, 0.55);
      rim.position.set(5, 4, -8);
      scene.add(rim);

      const ground = mesh(new THREE.CircleGeometry(48, 72), new THREE.MeshStandardMaterial({
        color: 0x6a5340, map: groundTex, roughness: 0.95, metalness: 0,
      }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      ground.castShadow = false;
      scene.add(ground);

      const dummy = new THREE.Object3D();
      const tuftGeo = new THREE.ConeGeometry(0.045, 0.2, 5);
      const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, 420);
      tufts.castShadow = true;
      tufts.receiveShadow = true;
      for (let i = 0; i < 420; i++) {
        const a = rng() * Math.PI * 2;
        const r = 1.6 + rng() * 22;
        dummy.position.set(Math.sin(a) * r, 0.1, Math.cos(a) * r);
        dummy.rotation.set((rng() - 0.5) * 0.25, rng() * 6.28, (rng() - 0.5) * 0.25);
        dummy.scale.setScalar(0.55 + rng() * 1.35);
        dummy.updateMatrix();
        tufts.setMatrixAt(i, dummy.matrix);
        const shade = 0.65 + rng() * 0.45;
        tufts.setColorAt(i, new THREE.Color(0.22 * shade, 0.28 * shade, 0.14 * shade));
      }
      scene.add(tufts);

      const rockGeo = new THREE.DodecahedronGeometry(0.28, 0);
      const rocks = new THREE.InstancedMesh(rockGeo, stoneMat, 36);
      rocks.castShadow = true;
      rocks.receiveShadow = true;
      for (let i = 0; i < 36; i++) {
        const a = rng() * Math.PI * 2;
        const r = 3 + rng() * 18;
        dummy.position.set(Math.sin(a) * r, 0.12 + rng() * 0.08, Math.cos(a) * r);
        dummy.rotation.set(rng(), rng(), rng());
        dummy.scale.set(0.6 + rng() * 1.4, 0.4 + rng() * 0.9, 0.6 + rng() * 1.3);
        dummy.updateMatrix();
        rocks.setMatrixAt(i, dummy.matrix);
      }
      scene.add(rocks);

      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + 0.18;
        const h = 1.35 + ((i * 37) % 5) * 0.22;
        const stone = mesh(new THREE.CylinderGeometry(0.22 + (i % 3) * 0.04, 0.3, h, 6), stoneMat);
        stone.position.set(Math.sin(a) * 13.4, h * 0.5, Math.cos(a) * 13.4);
        stone.rotation.y = a;
        stone.rotation.z = ((i % 2) * 2 - 1) * 0.05;
        scene.add(stone);
      }

      const sunDisc = new THREE.Mesh(
        new THREE.SphereGeometry(1.6, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xffc38a, fog: false })
      );
      sunDisc.position.set(-28, 16, 12);
      scene.add(sunDisc);

      const pCount = 160;
      const pPos = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (rng() - 0.5) * 26;
        pPos[i * 3 + 1] = 0.3 + rng() * 3.4;
        pPos[i * 3 + 2] = (rng() - 0.5) * 26;
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      const pollen = new THREE.Points(pGeo, new THREE.PointsMaterial({
        color: 0xffd4a2, size: 0.055, transparent: true, opacity: 0.7,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
      }));
      scene.add(pollen);

      const dustPool = [];
      const dustGeo = new THREE.CircleGeometry(0.16, 12);
      const dustMat = new THREE.MeshBasicMaterial({
        color: 0xc4a07a, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide,
      });
      for (let i = 0; i < 10; i++) {
        const d = new THREE.Mesh(dustGeo, dustMat.clone());
        d.rotation.x = -Math.PI / 2;
        d.visible = false;
        d.userData = { t: 1, active: false };
        scene.add(d);
        dustPool.push(d);
      }
      function spawnDust(pos) {
        const d = dustPool.find((x) => !x.userData.active);
        if (!d) return;
        d.userData.active = true;
        d.userData.t = 0;
        d.visible = true;
        d.position.set(pos.x, 0.03, pos.z);
        d.scale.setScalar(0.4);
      }

      function limb(L1, L2, r1, r2, mat) {
        const hip = new THREE.Group();
        const thigh = new THREE.Group();
        hip.add(thigh);
        const thighMesh = mesh(new THREE.CapsuleGeometry(r1, Math.max(0.02, L1 - r1 * 2), 5, 10), mat);
        thighMesh.position.y = -L1 * 0.5;
        thigh.add(thighMesh);
        const kneeBall = mesh(new THREE.SphereGeometry(r1 * 0.92, 10, 8), mat);
        kneeBall.position.y = -L1;
        thigh.add(kneeBall);
        const shin = new THREE.Group();
        shin.position.y = -L1;
        thigh.add(shin);
        const shinMesh = mesh(new THREE.CapsuleGeometry(r2, Math.max(0.02, L2 - r2 * 2), 5, 10), mat);
        shinMesh.position.y = -L2 * 0.5;
        shin.add(shinMesh);
        const ankle = new THREE.Group();
        ankle.position.y = -L2;
        shin.add(ankle);
        return { hip, thigh, shin, ankle, L1, L2 };
      }

      function makeHart() {
        const root = new THREE.Group();
        const pelvis = new THREE.Group();
        pelvis.position.y = HIP_Y;
        root.add(pelvis);

        const hips = mesh(new THREE.SphereGeometry(0.16, 14, 10), hide);
        hips.scale.set(1.15, 0.72, 0.9);
        pelvis.add(hips);

        const abdomen = new THREE.Group();
        abdomen.position.y = 0.12;
        pelvis.add(abdomen);
        const bellyMesh = mesh(new THREE.CapsuleGeometry(0.16, 0.18, 6, 12), hide);
        bellyMesh.position.y = 0.14;
        abdomen.add(bellyMesh);
        const paunch = mesh(new THREE.SphereGeometry(0.14, 12, 10), belly);
        paunch.position.set(0, 0.04, 0.08);
        paunch.scale.set(0.9, 0.7, 1.05);
        abdomen.add(paunch);

        const chest = new THREE.Group();
        chest.position.y = 0.32;
        abdomen.add(chest);
        const chestPts = [
          new THREE.Vector2(0.06, 0.38),
          new THREE.Vector2(0.16, 0.32),
          new THREE.Vector2(0.22, 0.18),
          new THREE.Vector2(0.2, 0.02),
          new THREE.Vector2(0.15, -0.1),
        ];
        const rib = mesh(new THREE.LatheGeometry(chestPts, 18), hide);
        rib.rotation.x = Math.PI;
        chest.add(rib);
        const ember = mesh(new THREE.IcosahedronGeometry(0.055, 0), emberMat);
        ember.position.set(0, 0.08, 0.18);
        chest.add(ember);
        const emberLight = new THREE.PointLight(0xff6a33, 0.85, 3.8);
        emberLight.position.copy(ember.position);
        chest.add(emberLight);

        const neck = new THREE.Group();
        neck.position.set(0, 0.34, 0.04);
        chest.add(neck);
        const neckMesh = mesh(new THREE.CapsuleGeometry(0.07, 0.16, 5, 8), hide);
        neckMesh.position.y = 0.1;
        neckMesh.rotation.x = 0.18;
        neck.add(neckMesh);
        for (let i = 0; i < 10; i++) {
          const fur = mesh(new THREE.ConeGeometry(0.035, 0.12, 5), hide);
          const a = (i / 10) * Math.PI * 2;
          fur.position.set(Math.cos(a) * 0.09, 0.02, Math.sin(a) * 0.07 + 0.02);
          fur.rotation.z = Math.cos(a) * 0.6;
          fur.rotation.x = 0.5 + Math.sin(a) * 0.3;
          neck.add(fur);
        }

        const head = new THREE.Group();
        head.position.set(0, 0.28, 0.1);
        neck.add(head);
        const skull = mesh(new THREE.SphereGeometry(0.13, 16, 12), hide);
        skull.scale.set(0.92, 0.8, 1.2);
        head.add(skull);
        const snout = mesh(new THREE.CylinderGeometry(0.038, 0.068, 0.17, 10), belly);
        snout.rotation.x = Math.PI / 2;
        snout.position.set(0, -0.02, 0.15);
        head.add(snout);
        const nose = mesh(new THREE.SphereGeometry(0.032, 10, 8), dark);
        nose.position.set(0, -0.035, 0.24);
        head.add(nose);
        const beard = mesh(new THREE.ConeGeometry(0.03, 0.1, 6), hide);
        beard.position.set(0, -0.1, 0.16);
        beard.rotation.x = 0.5;
        head.add(beard);

        function addEye(side) {
          const g = new THREE.Group();
          const ball = mesh(new THREE.SphereGeometry(0.028, 10, 8), new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.3 }));
          const iris = mesh(new THREE.SphereGeometry(0.015, 8, 8), eyeMat);
          iris.position.z = 0.016;
          g.add(ball, iris);
          g.position.set(side * 0.09, 0.028, 0.08);
          g.rotation.y = side * 0.62;
          head.add(g);
        }
        addEye(-1); addEye(1);

        function addEar(side) {
          const ear = new THREE.Group();
          const outer = mesh(new THREE.ConeGeometry(0.045, 0.16, 8), hide);
          outer.rotation.z = side * 0.55;
          outer.rotation.x = -0.25;
          const inner = mesh(new THREE.ConeGeometry(0.028, 0.12, 6), belly);
          inner.position.set(side * 0.01, 0.01, 0.01);
          inner.rotation.copy(outer.rotation);
          ear.add(outer, inner);
          ear.position.set(side * 0.1, 0.08, -0.02);
          head.add(ear);
        }
        addEar(-1); addEar(1);

        function branch(pts, r) {
          const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
          const t = mesh(new THREE.TubeGeometry(curve, 16, r, 6, false), antlerMat);
          head.add(t);
        }
        for (const s of [-1, 1]) {
          branch([[s * 0.04, 0.1, -0.02], [s * 0.11, 0.28, -0.07], [s * 0.15, 0.46, -0.02], [s * 0.1, 0.6, 0.09]], 0.017);
          branch([[s * 0.09, 0.3, -0.05], [s * 0.2, 0.38, -0.03], [s * 0.27, 0.34, 0.05]], 0.011);
        }
        branch([[0.1, 0.42, -0.02], [0.17, 0.54, 0.05], [0.13, 0.66, 0.12]], 0.01);

        function makeArm(side) {
          const shoulder = new THREE.Group();
          shoulder.position.set(side * 0.2, 0.22, 0.02);
          chest.add(shoulder);
          const pad = mesh(new THREE.SphereGeometry(0.07, 10, 8), hide);
          pad.scale.set(1.1, 0.8, 0.95);
          shoulder.add(pad);
          const upper = new THREE.Group();
          shoulder.add(upper);
          const um = mesh(new THREE.CapsuleGeometry(0.045, 0.18, 4, 8), hide);
          um.position.y = -0.14;
          upper.add(um);
          const elbow = new THREE.Group();
          elbow.position.y = -0.26;
          upper.add(elbow);
          const lm = mesh(new THREE.CapsuleGeometry(0.035, 0.16, 4, 8), hide);
          lm.position.y = -0.12;
          elbow.add(lm);
          const hand = new THREE.Group();
          hand.position.y = -0.24;
          elbow.add(hand);
          hand.add(mesh(new THREE.SphereGeometry(0.04, 8, 8), hide));
          for (let f = 0; f < 3; f++) {
            const finger = mesh(new THREE.CapsuleGeometry(0.01, 0.05, 3, 5), hide);
            finger.position.set((f - 1) * 0.022, -0.05, 0.02);
            finger.rotation.x = 0.4;
            hand.add(finger);
          }
          const lichen = mesh(new THREE.SphereGeometry(0.02, 6, 6), lichenMat);
          lichen.position.set(side * 0.02, -0.08, 0.04);
          upper.add(lichen);
          return { shoulder, upper, elbow, hand };
        }
        const armL = makeArm(1);
        const armR = makeArm(-1);

        function makeLeg(side) {
          const leg = limb(THIGH, SHIN, 0.075, 0.055, hide);
          leg.hip.position.set(side * HIP_W, -0.04, 0.01);
          pelvis.add(leg.hip);
          const hoof = new THREE.Group();
          leg.ankle.add(hoof);
          const fetlock = mesh(new THREE.SphereGeometry(0.05, 8, 8), hide);
          fetlock.position.y = -0.02;
          hoof.add(fetlock);
          const tuft = mesh(new THREE.SphereGeometry(0.045, 8, 8), hide);
          tuft.position.set(0, -0.02, -0.03);
          tuft.scale.set(1.1, 0.7, 1.2);
          hoof.add(tuft);
          for (const hs of [-1, 1]) {
            const clove = mesh(new THREE.BoxGeometry(0.045, 0.05, 0.1), hoofMat);
            clove.position.set(hs * 0.028, -0.055, 0.04);
            clove.rotation.y = hs * 0.18;
            clove.rotation.x = 0.12;
            hoof.add(clove);
          }
          const lichen = mesh(new THREE.SphereGeometry(0.022, 6, 6), lichenMat);
          lichen.position.set(side * 0.03, -0.22, 0.04);
          leg.shin.add(lichen);
          leg.hoof = hoof;
          return leg;
        }
        const legL = makeLeg(1);
        const legR = makeLeg(-1);

        const tail = new THREE.Group();
        tail.position.set(0, 0.02, -0.14);
        pelvis.add(tail);
        const t1 = mesh(new THREE.CapsuleGeometry(0.04, 0.12, 4, 6), hide);
        t1.position.set(0, -0.04, -0.08);
        t1.rotation.x = 0.7;
        tail.add(t1);
        const t2 = mesh(new THREE.CapsuleGeometry(0.028, 0.1, 4, 6), hide);
        t2.position.set(0, -0.08, -0.18);
        t2.rotation.x = 0.95;
        tail.add(t2);

        const blob = new THREE.Mesh(
          new THREE.CircleGeometry(0.42, 16),
          new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false })
        );
        blob.rotation.x = -Math.PI / 2;
        blob.position.y = 0.02;
        root.add(blob);

        return { root, pelvis, abdomen, chest, neck, head, armL, armR, legL, legR, tail, t1, t2, blob, ember };
      }

      const hart = makeHart();
      scene.add(hart.root);
      scene.add(rigGroup);

      const gait = {
        phase: 0,
        pathAngle: 0.15,
        feet: {
          L: { side: 1, swinging: false, plant: new THREE.Vector3(), from: new THREE.Vector3(), to: new THREE.Vector3(), target: new THREE.Vector3(), pitch: 0, dust: false },
          R: { side: -1, swinging: false, plant: new THREE.Vector3(), from: new THREE.Vector3(), to: new THREE.Vector3(), target: new THREE.Vector3(), pitch: 0, dust: false },
        },
      };

      function placeFootRest(foot) {
        const pose = pathPose(gait.pathAngle);
        foot.plant.copy(pose.pos).addScaledVector(pose.right, -foot.side * HIP_W);
        foot.plant.y = 0;
        foot.target.copy(foot.plant);
        foot.swinging = false;
      }
      placeFootRest(gait.feet.L);
      placeFootRest(gait.feet.R);
      setPathOn(hart.root, gait.pathAngle);

      function solveLeg(leg, foot) {
        const thigh = leg.thigh;
        thigh.parent.updateWorldMatrix(true, false);
        _m.copy(thigh.parent.matrixWorld).invert();
        _v1.copy(foot.target).applyMatrix4(_m);
        const ox = thigh.position.x, oy = thigh.position.y, oz = thigh.position.z;
        const x = _v1.x - ox;
        const y = _v1.y - oy;
        const z = _v1.z - oz;
        const L1 = leg.L1, L2 = leg.L2;
        const dist = THREE.MathUtils.clamp(Math.hypot(x, y, z), 0.1, L1 + L2 - 0.018);
        const planar = Math.hypot(y, z) || 1e-5;
        const cosKnee = THREE.MathUtils.clamp((L1 * L1 + L2 * L2 - dist * dist) / (2 * L1 * L2), -1, 1);
        const kneeInterior = Math.acos(cosKnee);
        const cosHip = THREE.MathUtils.clamp((L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist), -1, 1);
        const hipOff = Math.acos(cosHip);
        const reach = Math.atan2(z, -y || 1e-5);
        thigh.rotation.order = "ZYX";
        thigh.rotation.z = Math.atan2(-x, planar);
        thigh.rotation.y = 0;
        thigh.rotation.x = -reach - hipOff;
        leg.shin.rotation.set(Math.PI - kneeInterior, 0, 0);

        leg.ankle.updateWorldMatrix(true, false);
        leg.ankle.parent.getWorldQuaternion(_q);
        _q2.copy(_q).invert();
        leg.ankle.quaternion.copy(_q2);
        leg.ankle.rotateX(foot.pitch - 0.15);
      }

      function beginSwing(foot, cadence, swingDur, speed) {
        foot.swinging = true;
        foot.from.copy(foot.plant);
        foot.dust = true;
        const future = pathPose(gait.pathAngle + (speed / PATH_R) * swingDur * 0.58);
        const step = speed / Math.max(cadence, 0.25);
        foot.to.copy(future.pos);
        foot.to.addScaledVector(future.fwd, step * 0.4);
        foot.to.addScaledVector(future.right, -foot.side * HIP_W);
        foot.to.y = 0;
      }

      function updateFoot(foot, offset, cadence, duty, swingDur, stepH, speed) {
        const p01 = wrap01(gait.phase + offset);
        if (p01 >= duty) {
          const u = (p01 - duty) / Math.max(1e-4, 1 - duty);
          if (!foot.swinging) beginSwing(foot, cadence, swingDur, speed);
          const e = u * u * (3 - 2 * u);
          foot.target.lerpVectors(foot.from, foot.to, e);
          foot.target.y = Math.sin(Math.PI * u) * stepH;
          foot.pitch = Math.sin(Math.PI * u) * 0.55;
        } else {
          if (foot.swinging) {
            foot.swinging = false;
            foot.plant.copy(foot.to);
            if (foot.dust) {
              spawnDust(foot.plant);
              foot.dust = false;
            }
          }
          foot.target.copy(foot.plant);
          foot.target.y = 0;
          foot.pitch = 0;
        }
      }

      function applyIdle(t) {
        const breath = Math.sin(t * 1.55) * 0.012;
        hart.chest.scale.set(1 + breath, 1 + breath * 0.45, 1 + breath);
        hart.pelvis.position.y = HIP_Y + Math.sin(t * 1.55) * 0.008;
        hart.pelvis.position.x = Math.sin(t * 0.6) * 0.018;
        hart.pelvis.rotation.set(0.02, 0, Math.sin(t * 0.6) * 0.03);
        hart.abdomen.rotation.x = 0;
        hart.chest.rotation.set(0.16, 0, 0);
        hart.neck.rotation.set(0.05, Math.sin(t * 0.4) * 0.04, 0);
        hart.head.rotation.set(-0.12, 0, 0);
        hart.armL.shoulder.rotation.set(0.15, 0, 0.18);
        hart.armR.shoulder.rotation.set(0.15, 0, -0.18);
        hart.armL.upper.rotation.set(-0.35, 0, 0);
        hart.armR.upper.rotation.set(-0.35, 0, 0);
        hart.armL.elbow.rotation.set(-0.4, 0, 0);
        hart.armR.elbow.rotation.set(-0.4, 0, 0);
        hart.t1.rotation.x = 0.7 + Math.sin(t * 1.2) * 0.08;
        hart.t2.rotation.x = 0.95 + Math.sin(t * 1.2 - 0.4) * 0.1;
        placeFootRest(gait.feet.L);
        placeFootRest(gait.feet.R);
      }

      function applyWalk(dt, t) {
        const speed = state.speed;
        const cadence = 0.78 + speed * 0.42;
        const duty = THREE.MathUtils.clamp(0.66 - speed * 0.07, 0.46, 0.66);
        const swingDur = (1 - duty) / cadence;
        const stepH = (0.08 + speed * 0.05) * state.lift;
        gait.phase += dt * cadence;
        gait.pathAngle += (speed / PATH_R) * dt;
        setPathOn(hart.root, gait.pathAngle);

        updateFoot(gait.feet.L, 0, cadence, duty, swingDur, stepH, speed);
        updateFoot(gait.feet.R, 0.5, cadence, duty, swingDur, stepH, speed);

        const two = gait.phase * Math.PI * 2;
        const bob = (1 - Math.cos(two * 2)) * 0.5 * (0.022 + speed * 0.012);
        hart.pelvis.position.y = HIP_Y + bob;
        hart.pelvis.position.x = -Math.sin(two) * 0.035;
        hart.pelvis.rotation.z = -Math.sin(two) * 0.09;
        hart.pelvis.rotation.y = Math.sin(two) * 0.11;
        hart.pelvis.rotation.x = Math.sin(two * 2) * 0.035;
        hart.chest.scale.setScalar(1);
        hart.chest.rotation.y = -hart.pelvis.rotation.y * 1.35;
        hart.chest.rotation.x = 0.18 + Math.sin(two * 2) * 0.035;
        hart.chest.rotation.z = -hart.pelvis.rotation.z * 0.4;
        hart.abdomen.rotation.x = Math.sin(two * 2) * 0.02;
        hart.neck.rotation.y = -hart.chest.rotation.y * 0.5;
        hart.neck.rotation.x = 0.04;
        hart.head.rotation.x = -0.16 + Math.sin(two * 2) * 0.03;
        hart.head.rotation.y = -hart.pelvis.rotation.y * 0.45;
        const arm = Math.sin(two) * (0.38 + speed * 0.1);
        hart.armL.shoulder.rotation.set(0.12, 0, 0.16);
        hart.armR.shoulder.rotation.set(0.12, 0, -0.16);
        hart.armL.upper.rotation.set(-0.25 - arm, 0, 0);
        hart.armR.upper.rotation.set(-0.25 + arm, 0, 0);
        hart.armL.elbow.rotation.set(-0.35 - Math.max(0, -arm) * 0.5, 0, 0);
        hart.armR.elbow.rotation.set(-0.35 - Math.max(0, arm) * 0.5, 0, 0);
        hart.t1.rotation.x = 0.65 + Math.sin(two) * 0.16;
        hart.t1.rotation.y = Math.sin(two * 0.5 + t) * 0.12;
        hart.t2.rotation.x = 0.9 + Math.sin(two - 0.5) * 0.2;
      }

      function resetPath() {
        gait.phase = 0;
        gait.pathAngle = 0.15;
        placeFootRest(gait.feet.L);
        placeFootRest(gait.feet.R);
        setPathOn(hart.root, gait.pathAngle);
        look.copy(hart.root.position);
        look.y = 1.15;
      }

      let dragging = false;
      let lastX = 0, lastY = 0;
      stage.addEventListener("pointerdown", (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointerup", () => { dragging = false; });
      stage.addEventListener("pointercancel", () => { dragging = false; });
      stage.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        cam.azT -= dx * 0.005;
        cam.elT = THREE.MathUtils.clamp(cam.elT + dy * 0.004, 0.08, 1.25);
      });
      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        cam.distT = THREE.MathUtils.clamp(cam.distT + e.deltaY * 0.004, 3.1, 14);
      }, { passive: false });

      const spd = document.getElementById("spd");
      const lift = document.getElementById("lift");
      const spdVal = document.getElementById("spd-val");
      const liftVal = document.getElementById("lift-val");
      const btnPause = document.getElementById("btn-pause");
      const btnReset = document.getElementById("btn-reset");
      const followEl = document.getElementById("follow");
      const rigEl = document.getElementById("rig");
      const statsEl = document.getElementById("stats");
      const statusEl = document.getElementById("status");

      function announce() {
        const mode = state.paused ? "Paused" : state.speed < 0.05 ? "Idle" : "Walking";
        statusEl.textContent = mode + (reduceMotion && state.paused ? ". Reduced motion: press Play to start." : "");
        btnPause.textContent = state.paused ? "Play" : "Pause";
      }
      function syncLabels() {
        spdVal.textContent = state.speed.toFixed(2) + " m/s";
        liftVal.textContent = Math.round(state.lift * 100) + "%";
      }
      spd.addEventListener("input", () => { state.speed = Number(spd.value); syncLabels(); announce(); });
      lift.addEventListener("input", () => { state.lift = Number(lift.value); syncLabels(); });
      btnPause.addEventListener("click", () => { state.paused = !state.paused; announce(); });
      btnReset.addEventListener("click", () => resetPath());
      followEl.addEventListener("change", () => { state.follow = followEl.checked; });
      rigEl.addEventListener("change", () => { state.rig = rigEl.checked; rigGroup.visible = state.rig; });

      window.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        if (["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(tag)) return;
        if (e.code === "Space") {
          e.preventDefault();
          state.paused = !state.paused;
          announce();
        } else if (e.key === "1") {
          state.speed = Math.max(0, state.speed - 0.1);
          spd.value = String(state.speed);
          syncLabels(); announce();
        } else if (e.key === "2") {
          state.speed = Math.min(2.5, state.speed + 0.1);
          spd.value = String(state.speed);
          syncLabels(); announce();
        }
      });

      function onResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / Math.max(1, h);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
      window.addEventListener("resize", onResize);

      const clock = new THREE.Clock();
      let tAbs = 0;
      announce();
      syncLabels();
      if (reduceMotion) btnPause.textContent = "Play";
      boot.remove();

      function tick() {
        const dt = Math.min(clock.getDelta(), 0.05);
        tAbs += dt;
        const moving = !state.paused && state.speed > 0.05;
        if (state.paused) {
          /* freeze locomotion; still idle-breathe slightly unless reduced motion */
          if (!reduceMotion) hart.chest.scale.setScalar(1 + Math.sin(tAbs * 1.2) * 0.006);
        } else if (!moving) {
          setPathOn(hart.root, gait.pathAngle);
          applyIdle(tAbs);
        } else {
          applyWalk(dt, tAbs);
        }

        hart.root.updateWorldMatrix(true, true);
        solveLeg(hart.legL, gait.feet.L);
        solveLeg(hart.legR, gait.feet.R);
        markL.position.copy(gait.feet.L.target);
        markR.position.copy(gait.feet.R.target);

        hart.pelvis.getWorldPosition(_v2);
        hart.blob.position.x = 0;
        hart.blob.position.z = 0;

        const pose = pathPose(gait.pathAngle);
        sun.position.copy(pose.pos).add(_v3.set(-8, 13, 6));
        sun.target.position.copy(pose.pos);
        sun.target.updateMatrixWorld();

        const pp = pollen.geometry.attributes.position;
        for (let i = 0; i < pCount; i++) {
          const y = pp.getY(i) + Math.sin(tAbs * 0.4 + i) * 0.003;
          pp.setY(i, y > 4.2 ? 0.25 : y);
          pp.setX(i, pp.getX(i) + Math.sin(tAbs * 0.2 + i) * 0.002);
        }
        pp.needsUpdate = true;

        for (const d of dustPool) {
          if (!d.userData.active) continue;
          d.userData.t += dt * 1.8;
          d.scale.setScalar(0.4 + d.userData.t * 1.6);
          d.material.opacity = 0.32 * (1 - d.userData.t);
          if (d.userData.t >= 1) {
            d.userData.active = false;
            d.visible = false;
          }
        }

        if (state.follow) {
          look.lerp(_v2, 1 - Math.pow(0.001, dt));
        }
        cam.az += (cam.azT - cam.az) * 0.14;
        cam.el += (cam.elT - cam.el) * 0.14;
        cam.dist += (cam.distT - cam.dist) * 0.14;
        const el = cam.el;
        const az = cam.az;
        camera.position.set(
          look.x + Math.sin(az) * Math.cos(el) * cam.dist,
          look.y + Math.sin(el) * cam.dist,
          look.z + Math.cos(az) * Math.cos(el) * cam.dist
        );
        camera.lookAt(look.x, look.y + 0.15, look.z);

        hart.ember.rotateY(dt * 0.6);

        renderer.render(scene, camera);

        const duty = THREE.MathUtils.clamp(0.66 - state.speed * 0.07, 0.46, 0.66);
        statsEl.innerHTML = `<strong>${state.paused ? "paused" : state.speed < 0.05 ? "idle" : "walk"}</strong><br>phase ${wrap01(gait.phase).toFixed(2)}<br>duty ${duty.toFixed(2)}<br>L ${gait.feet.L.swinging ? "swing" : "plant"} · R ${gait.feet.R.swinging ? "swing" : "plant"}`;
      }

      renderer.setAnimationLoop(tick);
    }
  </script>
</body>
</html>
