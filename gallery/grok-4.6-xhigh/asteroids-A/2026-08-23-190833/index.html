<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05070d" />
  <title>Asteroids — Sector Patrol</title>
  <style>
    :root {
      --bg: #05070d;
      --cyan: #7ee7ff;
      --cyan-dim: rgba(126, 231, 255, 0.16);
      --mint: #b9ffd8;
      --amber: #ffb04a;
      --pink: #ff5d8f;
      --text: #e7f4ff;
      --dim: #8aa0b8;
      --danger: #ff6b6b;
      --panel: rgba(6, 10, 18, 0.78);
      --line: rgba(126, 231, 255, 0.32);
      --bezel: rgba(126, 231, 255, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 42%, #10182a 0%, #070a12 52%, #030409 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
    }

    .bezel, .vignette, .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .bezel {
      margin: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      border: 1px solid var(--bezel);
      border-radius: 18px;
      box-shadow:
        inset 0 0 90px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(0, 0, 0, 0.6);
    }

    .vignette {
      background:
        radial-gradient(ellipse at center, transparent 48%, rgba(0, 0, 0, 0.42) 100%);
    }

    .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.017) 0px,
        rgba(255, 255, 255, 0.017) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: overlay;
      opacity: 0.55;
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 12px;
      padding: max(22px, calc(env(safe-area-inset-top) + 14px)) max(28px, env(safe-area-inset-right)) 0 max(28px, env(safe-area-inset-left));
      pointer-events: none;
      z-index: 3;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 12px;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(126, 231, 255, 0.45);
    }

    .hud .left { justify-self: start; }
    .hud .center { justify-self: center; text-align: center; }
    .hud .right { justify-self: end; text-align: right; }

    .hud .label {
      display: block;
      color: var(--dim);
      font-size: 9px;
      letter-spacing: 0.32em;
      margin-bottom: 4px;
    }

    .hud .value {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.16em;
      color: var(--text);
    }

    .lives {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      height: 16px;
    }

    .lives svg {
      width: 16px;
      height: 16px;
      filter: drop-shadow(0 0 6px rgba(126, 231, 255, 0.7));
    }

    .banner {
      position: absolute;
      left: 50%;
      top: 22%;
      transform: translateX(-50%);
      z-index: 4;
      pointer-events: none;
      text-align: center;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--mint);
      text-shadow: 0 0 18px rgba(185, 255, 216, 0.5);
      opacity: 0;
      transition: opacity 0.25s ease;
      font-size: clamp(18px, 3vw, 28px);
    }

    .banner.show { opacity: 1; }

    .banner small {
      display: block;
      margin-top: 8px;
      color: var(--dim);
      letter-spacing: 0.28em;
      font-size: 11px;
    }

    .menu {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 5;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 40%, rgba(8, 14, 28, 0.28), rgba(4, 6, 12, 0.55));
    }

    .menu[hidden] { display: none !important; }

    .panel {
      width: min(520px, 100%);
      padding: 36px 32px 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 20px 60px rgba(0, 0, 0, 0.45),
        0 0 40px rgba(126, 231, 255, 0.06);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--amber);
      letter-spacing: 0.42em;
      font-size: 10px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 24px rgba(126, 231, 255, 0.35);
    }

    .tag {
      margin: 12px 0 22px;
      color: var(--dim);
      letter-spacing: 0.28em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(126, 231, 255, 0.08);
      color: var(--text);
      font: inherit;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
      padding: 12px 20px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    button.primary {
      background: linear-gradient(180deg, rgba(126, 231, 255, 0.28), rgba(126, 231, 255, 0.1));
      border-color: rgba(126, 231, 255, 0.7);
      box-shadow: 0 0 18px rgba(126, 231, 255, 0.18);
    }

    button:hover { background: rgba(126, 231, 255, 0.16); }
    button:active { transform: translateY(1px); }
    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .help {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      margin: 0 auto 18px;
      width: fit-content;
      text-align: left;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .help kbd {
      display: inline-block;
      min-width: 92px;
      color: var(--cyan);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .hi {
      margin: 0;
      color: var(--mint);
      letter-spacing: 0.28em;
      font-size: 12px;
      text-transform: uppercase;
    }

    .status {
      margin: 8px 0 0;
      min-height: 1.2em;
      color: var(--amber);
      letter-spacing: 0.16em;
      font-size: 12px;
      text-transform: uppercase;
    }

    .icon-btn {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 6;
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      pointer-events: auto;
      background: rgba(6, 10, 18, 0.55);
    }

    .icon-btn svg { width: 20px; height: 20px; stroke: var(--cyan); fill: none; stroke-width: 1.7; }

    .touch {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      display: none;
      justify-content: space-between;
      align-items: end;
      padding: 0 max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .touch.show { display: flex; }

    .touch .cluster {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .touch button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      letter-spacing: 0.08em;
      font-size: 11px;
      background: rgba(8, 12, 22, 0.62);
      backdrop-filter: blur(6px);
    }

    .touch button.wide {
      width: 92px;
      border-radius: 32px;
    }

    .touch button:active,
    .touch button.held {
      background: rgba(126, 231, 255, 0.22);
      border-color: var(--cyan);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .hud { letter-spacing: 0.12em; padding-left: 16px; padding-right: 16px; }
      .hud .value { font-size: 18px; }
      .panel { padding: 28px 18px 22px; }
      h1 { letter-spacing: 0.12em; }
      .help { grid-template-columns: 1fr; gap: 2px; text-align: center; }
      .help kbd { min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scanlines { display: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="view" aria-label="Asteroids game field"></canvas>
    <div class="vignette"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="bezel" aria-hidden="true"></div>

    <header class="hud">
      <div class="left">
        <span class="label">Score</span>
        <span class="value" id="score">00000</span>
        <div class="lives" id="lives" aria-hidden="true"></div>
      </div>
      <div class="center">
        <span class="label">Wave</span>
        <span class="value" id="wave">01</span>
      </div>
      <div class="right">
        <span class="label">Best</span>
        <span class="value" id="best">00000</span>
      </div>
    </header>

    <div class="banner" id="banner" aria-live="polite"></div>

    <button class="icon-btn" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
      <svg id="mute-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 10v4h3l5 4V6L7 10H4z" />
        <path d="M16 9c1.2 1 1.8 2.2 1.8 3s-.6 2-1.8 3" />
        <path d="M18.7 7c2 1.6 3 3.4 3 5s-1 3.4-3 5" />
      </svg>
    </button>

    <div class="menu" id="menu" role="dialog" aria-labelledby="title" aria-modal="true">
      <div class="panel">
        <p class="eyebrow" id="eyebrow">Vector series</p>
        <h1 id="title">Asteroids</h1>
        <p class="tag" id="tag">Sector patrol</p>
        <div class="actions">
          <button class="primary" id="start" type="button">Start</button>
          <button id="resume" type="button" hidden>Resume</button>
        </div>
        <div class="help">
          <kbd>← → / A D</kbd><span>Turn</span>
          <kbd>↑ / W</kbd><span>Thrust</span>
          <kbd>Space / J</kbd><span>Fire</span>
          <kbd>Shift / H</kbd><span>Hyperspace</span>
          <kbd>P / Esc</kbd><span>Pause</span>
        </div>
        <p class="hi" id="hi-line">Best 00000</p>
        <p class="status" id="status"></p>
      </div>
    </div>

    <div class="touch" id="touch" aria-hidden="true">
      <div class="cluster">
        <button type="button" id="t-left" aria-label="Turn left">◀</button>
        <button type="button" id="t-right" aria-label="Turn right">▶</button>
        <button type="button" class="wide" id="t-thrust" aria-label="Thrust">Thrust</button>
      </div>
      <div class="cluster">
        <button type="button" id="t-hyper" aria-label="Hyperspace">Hyp</button>
        <button type="button" class="wide" id="t-fire" aria-label="Fire">Fire</button>
      </div>
    </div>

    <div class="sr-only" id="live" aria-live="polite"></div>
  </div>

  <script>
  (() => {
    "use strict";

    const TAU = Math.PI * 2;
    const SHIP_ROT = 4.6;
    const SHIP_THRUST = 320;
    const SHIP_MAX = 430;
    const BULLET_SPEED = 560;
    const BULLET_LIFE = 0.82;
    const MAX_BULLETS = 5;
    const FIRE_RATE = 0.13;
    const HYPER_COOLDOWN = 1.6;
    const EXTRA_LIFE = 10000;
    const STORE_HI = "asteroids-sector-hi";
    const STORE_MUTE = "asteroids-sector-mute";
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d", { alpha: false });
    const ui = {
      score: document.getElementById("score"),
      best: document.getElementById("best"),
      wave: document.getElementById("wave"),
      lives: document.getElementById("lives"),
      banner: document.getElementById("banner"),
      menu: document.getElementById("menu"),
      title: document.getElementById("title"),
      tag: document.getElementById("tag"),
      eyebrow: document.getElementById("eyebrow"),
      start: document.getElementById("start"),
      resume: document.getElementById("resume"),
      status: document.getElementById("status"),
      hiLine: document.getElementById("hi-line"),
      mute: document.getElementById("mute"),
      muteIcon: document.getElementById("mute-icon"),
      touch: document.getElementById("touch"),
      live: document.getElementById("live"),
    };

    const LIFE_SVG = '<svg viewBox="0 0 16 16"><polygon points="8,1 2,15 8,11 14,15" fill="none" stroke="#7ee7ff" stroke-width="1.2"/></svg>';

    let W = 800, H = 600, dpr = 1;
    let state = "title";
    let score = 0;
    let best = 0;
    let lives = 3;
    let wave = 0;
    let extraAt = EXTRA_LIFE;
    let ship = null;
    let rocks = [];
    let bullets = [];
    let enemyShots = [];
    let saucer = null;
    let particles = [];
    let floaters = [];
    let rings = [];
    let stars = [];
    let nebula = [];
    let shake = 0;
    let flash = 0;
    let fireCd = 0;
    let hyperCd = 0;
    let saucerTimer = 8;
    let wavePause = 0;
    let respawnT = 0;
    let bannerT = 0;
    let beatT = 0;
    let beatFlip = false;
    let last = 0;
    let muted = false;
    let newBest = false;
    let pendingStartShot = false;

    const keys = new Set();
    const touch = { left: false, right: false, thrust: false, fire: false, hyper: false };
    let pad = { left: false, right: false, thrust: false, fire: false, hyper: false, start: false, pause: false };
    let hyperHeld = false;

    const audio = {
      ctx: null,
      master: null,
      thrust: null,
      siren: null,
      noise: null,
    };

    function rand(a, b) { return a + Math.random() * (b - a); }
    function irand(a, b) { return Math.floor(rand(a, b + 1)); }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function wrap(v, max) { return ((v % max) + max) % max; }
    function angNorm(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
    function pad5(n) { return String(Math.max(0, Math.floor(n))).padStart(5, "0"); }

    function wrapDelta(a, b, size) {
      let d = a - b;
      const half = size * 0.5;
      if (d > half) d -= size;
      if (d < -half) d += size;
      return d;
    }

    function distWrap(ax, ay, bx, by) {
      const dx = wrapDelta(ax, bx, W);
      const dy = wrapDelta(ay, by, H);
      return Math.hypot(dx, dy);
    }

    function loadStore() {
      try {
        best = Number(localStorage.getItem(STORE_HI) || 0) || 0;
        muted = localStorage.getItem(STORE_MUTE) === "1";
      } catch (_) {}
    }

    function saveBest() {
      try { localStorage.setItem(STORE_HI, String(best)); } catch (_) {}
    }

    function saveMute() {
      try { localStorage.setItem(STORE_MUTE, muted ? "1" : "0"); } catch (_) {}
    }

    function initAudio() {
      if (audio.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctxA = new AC();
      const master = ctxA.createGain();
      master.gain.value = muted ? 0 : 0.7;
      master.connect(ctxA.destination);

      const nLen = ctxA.sampleRate * 1.2;
      const buf = ctxA.createBuffer(1, nLen, ctxA.sampleRate);
      const data = buf.getChannelData(0);
      let brown = 0;
      for (let i = 0; i < nLen; i++) {
        brown = clamp(brown + (Math.random() * 2 - 1) * 0.08, -1, 1);
        data[i] = brown * 0.9;
      }

      audio.ctx = ctxA;
      audio.master = master;
      audio.noise = buf;
    }

    function unlockAudio() {
      initAudio();
      if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
    }

    function setMute(next) {
      muted = next;
      if (audio.master) audio.master.gain.value = muted ? 0 : 0.7;
      ui.mute.setAttribute("aria-pressed", muted ? "true" : "false");
      ui.mute.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
      ui.muteIcon.innerHTML = muted
        ? '<path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M18 10l4 4m0-4l-4 4"/>'
        : '<path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M16 9c1.2 1 1.8 2.2 1.8 3s-.6 2-1.8 3"/><path d="M18.7 7c2 1.6 3 3.4 3 5s-1 3.4-3 5"/>';
      saveMute();
    }

    function tone(freq, dur, type, gain, slide) {
      if (!audio.ctx) return;
      const t = audio.ctx.currentTime;
      const osc = audio.ctx.createOscillator();
      const g = audio.ctx.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      osc.connect(g);
      g.connect(audio.master);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function noiseBurst(dur, gain, hp, lp) {
      if (!audio.ctx || !audio.noise) return;
      const t = audio.ctx.currentTime;
      const src = audio.ctx.createBufferSource();
      src.buffer = audio.noise;
      src.loop = true;
      const filter = audio.ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = hp || 700;
      filter.Q.value = 0.7;
      if (lp) {
        const low = audio.ctx.createBiquadFilter();
        low.type = "lowpass";
        low.frequency.value = lp;
        src.connect(filter);
        filter.connect(low);
        const g = audio.ctx.createGain();
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        low.connect(g);
        g.connect(audio.master);
        src.start(t);
        src.stop(t + dur + 0.02);
        return;
      }
      const g = audio.ctx.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(audio.master);
      src.start(t);
      src.stop(t + dur + 0.02);
    }

    function sfxShoot() { tone(920, 0.09, "square", 0.05, 180); }
    function sfxThump(hi) { tone(hi ? 92 : 64, 0.09, "triangle", 0.12); }
    function sfxBoom(big) {
      noiseBurst(big ? 0.42 : 0.22, big ? 0.22 : 0.14, big ? 280 : 700, big ? 900 : 1800);
      tone(big ? 110 : 180, 0.2, "sawtooth", 0.05, 40);
    }
    function sfxExtra() {
      [523, 659, 784, 1046].forEach((f, i) => {
        setTimeout(() => tone(f, 0.12, "square", 0.06), i * 90);
      });
    }
    function sfxHyper() { tone(240, 0.16, "sine", 0.06, 80); noiseBurst(0.18, 0.08, 1200); }
    function sfxOver() {
      [330, 247, 196, 130].forEach((f, i) => {
        setTimeout(() => tone(f, 0.22, "sawtooth", 0.07, f * 0.5), i * 160);
      });
    }

    function startThrustLoop() {
      if (!audio.ctx || audio.thrust) return;
      const t = audio.ctx.currentTime;
      const src = audio.ctx.createBufferSource();
      src.buffer = audio.noise;
      src.loop = true;
      const filter = audio.ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 420;
      const g = audio.ctx.createGain();
      g.gain.value = 0;
      src.connect(filter);
      filter.connect(g);
      g.connect(audio.master);
      src.start(t);
      audio.thrust = { src, g, filter };
    }

    function setThrustSound(on) {
      if (!audio.ctx) return;
      startThrustLoop();
      if (!audio.thrust) return;
      const t = audio.ctx.currentTime;
      audio.thrust.g.gain.cancelScheduledValues(t);
      audio.thrust.g.gain.linearRampToValueAtTime(on ? 0.045 : 0.0001, t + 0.06);
    }

    function startSiren() {
      stopSiren();
      if (!audio.ctx || !saucer) return;
      const osc = audio.ctx.createOscillator();
      const osc2 = audio.ctx.createOscillator();
      const g = audio.ctx.createGain();
      osc.type = "square";
      osc2.type = "square";
      const base = saucer.small ? 310 : 220;
      osc.frequency.value = base;
      osc2.frequency.value = base * 1.33;
      g.gain.value = 0.03;
      const lfo = audio.ctx.createOscillator();
      const lfoG = audio.ctx.createGain();
      lfo.frequency.value = saucer.small ? 7 : 4.5;
      lfoG.gain.value = 40;
      lfo.connect(lfoG);
      lfoG.connect(osc.frequency);
      osc.connect(g);
      osc2.connect(g);
      g.connect(audio.master);
      osc.start();
      osc2.start();
      lfo.start();
      audio.siren = { osc, osc2, lfo, g };
    }

    function stopSiren() {
      if (!audio.siren) return;
      try {
        audio.siren.osc.stop();
        audio.siren.osc2.stop();
        audio.siren.lfo.stop();
      } catch (_) {}
      audio.siren = null;
    }

    function resize() {
      W = Math.max(320, window.innerWidth);
      H = Math.max(320, window.innerHeight);
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!stars.length) seedSky();
    }

    function seedSky() {
      stars = [];
      nebula = [];
      const n = Math.floor((W * H) / 14000);
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() < 0.12 ? 1.4 : 0.7,
          a: rand(0.15, 0.9),
          tw: rand(0.4, 2.2),
          p: Math.random() * TAU,
        });
      }
      nebula = [
        { x: W * 0.2, y: H * 0.3, r: Math.min(W, H) * 0.45, c: "rgba(40, 70, 140, 0.16)" },
        { x: W * 0.78, y: H * 0.62, r: Math.min(W, H) * 0.4, c: "rgba(90, 30, 90, 0.12)" },
        { x: W * 0.55, y: H * 0.2, r: Math.min(W, H) * 0.28, c: "rgba(20, 90, 110, 0.1)" },
      ];
    }

    function rockShape(r) {
      const n = 8 + irand(0, 5);
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + rand(-0.16, 0.16);
        const rr = r * rand(0.66, 1.14);
        pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
      return pts;
    }

    function spawnRock(x, y, size, kickX, kickY) {
      const radii = { 3: 44, 2: 26, 1: 14 };
      const r = radii[size] * rand(0.92, 1.08);
      const spd = (size === 3 ? rand(28, 70) : size === 2 ? rand(50, 110) : rand(70, 150)) * (1 + wave * 0.07);
      const a = rand(0, TAU);
      rocks.push({
        x, y,
        vx: Math.cos(a) * spd + (kickX || 0),
        vy: Math.sin(a) * spd + (kickY || 0),
        r, size,
        rot: rand(0, TAU),
        vr: rand(-1.4, 1.4),
        pts: rockShape(r),
        tint: rand(0.82, 1),
      });
    }

    function spawnRockAway(size, px, py, minDist) {
      let x, y, tries = 0;
      do {
        const edge = irand(0, 3);
        if (edge === 0) { x = rand(0, W); y = -20; }
        else if (edge === 1) { x = rand(0, W); y = H + 20; }
        else if (edge === 2) { x = -20; y = rand(0, H); }
        else { x = W + 20; y = rand(0, H); }
        tries++;
      } while (distWrap(x, y, px, py) < minDist && tries < 30);
      spawnRock(x, y, size);
    }

    function makeShip() {
      return {
        x: W * 0.5,
        y: H * 0.5,
        vx: 0,
        vy: 0,
        a: -Math.PI / 2,
        r: 12,
        alive: true,
        invuln: 2.4,
        thrust: false,
        blink: 0,
      };
    }

    function addScore(n, x, y) {
      score += n;
      if (x != null) floaters.push({ x, y, text: "+" + n, life: 0.85, vy: -28 });
      if (score >= extraAt) {
        while (score >= extraAt) {
          lives++;
          extraAt += EXTRA_LIFE;
        }
        sfxExtra();
        showBanner("Extra ship", 1.4);
        announce("Extra ship. Lives " + lives);
        refreshLives();
      }
      if (score > best) {
        best = score;
        newBest = true;
        saveBest();
        ui.best.textContent = pad5(best);
      }
      ui.score.textContent = pad5(score);
    }

    function refreshLives() {
      ui.lives.innerHTML = LIFE_SVG.repeat(Math.max(0, Math.min(lives, 8)));
    }

    function announce(msg) { ui.live.textContent = msg; }

    function showBanner(html, t) {
      ui.banner.innerHTML = html;
      ui.banner.classList.add("show");
      bannerT = t;
    }

    function spawnBurst(x, y, color, n, speed, life) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU);
        const s = rand(speed * 0.2, speed);
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: rand(life * 0.45, life),
          max: life,
          r: rand(0.8, 2.4),
          color,
          line: Math.random() < 0.35,
        });
      }
    }

    function spawnDebris(rock) {
      const n = 3 + rock.size * 2;
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU);
        const s = rand(20, 90);
        particles.push({
          x: rock.x,
          y: rock.y,
          vx: rock.vx * 0.3 + Math.cos(a) * s,
          vy: rock.vy * 0.3 + Math.sin(a) * s,
          life: rand(0.4, 0.9),
          max: 0.9,
          r: rand(3, 8),
          color: "rgba(210, 225, 240, 0.9)",
          line: true,
          a0: a,
        });
      }
    }

    function boom(x, y, mag) {
      if (!reduceMotion) {
        shake = Math.max(shake, mag);
        flash = Math.max(flash, mag > 10 ? 0.22 : 0.1);
      }
      rings.push({ x, y, r: 6, vr: 140 + mag * 8, life: 0.35, color: "rgba(126,231,255,0.5)" });
      try {
        const gp = navigator.getGamepads && navigator.getGamepads()[0];
        if (gp && gp.vibrationActuator) {
          gp.vibrationActuator.playEffect("dual-rumble", {
            duration: 80 + mag * 8,
            strongMagnitude: clamp(mag / 18, 0, 1),
            weakMagnitude: clamp(mag / 24, 0, 1),
          });
        }
      } catch (_) {}
    }

    function splitRock(rock, fromBullet) {
      const i = rocks.indexOf(rock);
      if (i >= 0) rocks.splice(i, 1);
      spawnDebris(rock);
      spawnBurst(rock.x, rock.y, "#d7e7f7", 8 + rock.size * 6, 40 + rock.size * 40, 0.5 + rock.size * 0.12);
      sfxBoom(rock.size === 3);
      boom(rock.x, rock.y, 4 + rock.size * 3);
      const pts = rock.size === 3 ? 20 : rock.size === 2 ? 50 : 100;
      if (fromBullet) addScore(pts, rock.x, rock.y);
      if (rock.size > 1) {
        const kick = 40 + (3 - rock.size) * 20;
        spawnRock(rock.x, rock.y, rock.size - 1, rand(-kick, kick), rand(-kick, kick));
        spawnRock(rock.x, rock.y, rock.size - 1, rand(-kick, kick), rand(-kick, kick));
      }
    }

    function killShip() {
      if (!ship || !ship.alive) return;
      ship.alive = false;
      setThrustSound(false);
      spawnBurst(ship.x, ship.y, "#7ee7ff", 28, 220, 0.7);
      spawnBurst(ship.x, ship.y, "#ffb04a", 12, 140, 0.45);
      boom(ship.x, ship.y, 16);
      sfxBoom(true);
      lives--;
      refreshLives();
      if (lives <= 0) {
        state = "over";
        saucer = null;
        stopSiren();
        sfxOver();
        if (newBest) saveBest();
        openMenu("over");
        announce("Game over. Score " + score);
      } else {
        state = "dead";
        respawnT = 2.1;
        announce("Ship destroyed. Lives " + lives);
      }
    }

    function centerClear() {
      const cx = W * 0.5, cy = H * 0.5;
      for (const r of rocks) if (distWrap(r.x, r.y, cx, cy) < r.r + 78) return false;
      if (saucer && distWrap(saucer.x, saucer.y, cx, cy) < 90) return false;
      return true;
    }

    function respawn() {
      ship = makeShip();
      rings.push({ x: ship.x, y: ship.y, r: 8, vr: 180, life: 0.5, color: "rgba(185,255,216,0.7)" });
      state = "play";
      fireCd = 0.2;
      pendingStartShot = true;
    }

    function fire(from) {
      if (bullets.length >= MAX_BULLETS) return;
      const nx = Math.cos(from.a);
      const ny = Math.sin(from.a);
      bullets.push({
        x: from.x + nx * 14,
        y: from.y + ny * 14,
        vx: from.vx + nx * BULLET_SPEED,
        vy: from.vy + ny * BULLET_SPEED,
        life: BULLET_LIFE,
        r: 2.2,
      });
      sfxShoot();
    }

    function hyperspace() {
      if (!ship || !ship.alive || hyperCd > 0 || state !== "play") return;
      hyperCd = HYPER_COOLDOWN;
      spawnBurst(ship.x, ship.y, "#b9ffd8", 16, 160, 0.35);
      sfxHyper();
      let x, y, tries = 0;
      do {
        x = rand(40, W - 40);
        y = rand(40, H - 40);
        tries++;
      } while (rocks.some((r) => distWrap(x, y, r.x, r.y) < r.r + 36) && tries < 25);
      ship.x = x;
      ship.y = y;
      ship.vx *= 0.2;
      ship.vy *= 0.2;
      ship.invuln = 1.1;
      rings.push({ x, y, r: 4, vr: 220, life: 0.4, color: "rgba(126,231,255,0.8)" });
      if (Math.random() < 0.1) killShip();
    }

    function spawnSaucer() {
      if (saucer || state !== "play") return;
      const small = wave >= 3 && Math.random() < Math.min(0.75, 0.28 + wave * 0.08);
      const fromLeft = Math.random() < 0.5;
      saucer = {
        x: fromLeft ? -28 : W + 28,
        y: rand(H * 0.18, H * 0.82),
        vx: (fromLeft ? 1 : -1) * (small ? 150 : 96),
        vy: 0,
        r: small ? 11 : 18,
        small,
        t: 0,
        shoot: small ? 0.7 : 1.1,
        wrapLeft: 1,
      };
      startSiren();
    }

    function saucerFire() {
      if (!saucer) return;
      let a;
      if (saucer.small && ship && ship.alive) {
        const dx = wrapDelta(ship.x, saucer.x, W);
        const dy = wrapDelta(ship.y, saucer.y, H);
        const lead = 0.18;
        a = Math.atan2(dy + ship.vy * lead, dx + ship.vx * lead) + rand(-0.18, 0.18);
      } else {
        a = rand(0, TAU);
      }
      const spd = saucer.small ? 280 : 220;
      enemyShots.push({
        x: saucer.x,
        y: saucer.y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        life: 1.6,
        r: 2.4,
      });
      tone(saucer.small ? 1400 : 880, 0.08, "square", 0.04, 300);
    }

    function killSaucer(fromPlayer) {
      if (!saucer) return;
      spawnBurst(saucer.x, saucer.y, "#ff5d8f", 24, 200, 0.55);
      boom(saucer.x, saucer.y, 12);
      sfxBoom(true);
      if (fromPlayer) addScore(saucer.small ? 1000 : 200, saucer.x, saucer.y);
      saucer = null;
      stopSiren();
      saucerTimer = rand(10, 18) / Math.max(1, 0.7 + wave * 0.08);
    }

    function nextWave() {
      wave++;
      ui.wave.textContent = String(wave).padStart(2, "0");
      const count = Math.min(12, 3 + wave);
      const px = ship ? ship.x : W * 0.5;
      const py = ship ? ship.y : H * 0.5;
      for (let i = 0; i < count; i++) spawnRockAway(3, px, py, 170);
      saucerTimer = rand(7, 14);
      wavePause = 0;
      showBanner("Wave " + String(wave).padStart(2, "0") + "<small>Clear the field</small>", 2);
      announce("Wave " + wave);
    }

    function resetRun() {
      score = 0;
      lives = 3;
      wave = 0;
      extraAt = EXTRA_LIFE;
      newBest = false;
      rocks = [];
      bullets = [];
      enemyShots = [];
      particles = [];
      floaters = [];
      rings = [];
      saucer = null;
      stopSiren();
      shake = 0;
      flash = 0;
      fireCd = 0.25;
      hyperCd = 0;
      pendingStartShot = true;
      ship = makeShip();
      ui.score.textContent = pad5(0);
      refreshLives();
      nextWave();
      state = "play";
    }

    function openMenu(kind) {
      ui.menu.hidden = false;
      ui.menu.setAttribute("aria-modal", "true");
      ui.resume.hidden = kind !== "pause";
      ui.start.hidden = false;
      if (kind === "title") {
        ui.eyebrow.textContent = "Vector series";
        ui.title.textContent = "Asteroids";
        ui.tag.textContent = "Sector patrol";
        ui.start.textContent = "Start";
        ui.status.textContent = "";
      } else if (kind === "pause") {
        ui.eyebrow.textContent = "Hold";
        ui.title.textContent = "Paused";
        ui.tag.textContent = "Wave " + String(wave).padStart(2, "0");
        ui.start.textContent = "Restart";
        ui.status.textContent = "Resume to continue";
      } else {
        ui.eyebrow.textContent = "Ship lost";
        ui.title.textContent = "Game over";
        ui.tag.textContent = "Score " + pad5(score);
        ui.start.textContent = "Play again";
        ui.status.textContent = newBest ? "New best score" : "Best " + pad5(best);
      }
      ui.hiLine.textContent = "Best " + pad5(best);
      ui.start.focus();
    }

    function closeMenu() {
      ui.menu.hidden = true;
      ui.menu.setAttribute("aria-modal", "false");
    }

    function startGame() {
      unlockAudio();
      closeMenu();
      resetRun();
      announce("Game start");
    }

    function togglePause() {
      if (state === "play") {
        state = "pause";
        setThrustSound(false);
        openMenu("pause");
      } else if (state === "pause") {
        state = "play";
        closeMenu();
      }
    }

    function wantLeft() { return keys.has("ArrowLeft") || keys.has("KeyA") || touch.left || pad.left; }
    function wantRight() { return keys.has("ArrowRight") || keys.has("KeyD") || touch.right || pad.right; }
    function wantThrust() { return keys.has("ArrowUp") || keys.has("KeyW") || touch.thrust || pad.thrust; }
    function wantFire() { return keys.has("Space") || keys.has("KeyJ") || touch.fire || pad.fire; }
    function wantHyper() { return keys.has("ShiftLeft") || keys.has("ShiftRight") || keys.has("KeyH") || touch.hyper || pad.hyper; }

    function pollPad() {
      const list = navigator.getGamepads ? navigator.getGamepads() : [];
      const p = list && list[0];
      if (!p) {
        pad = { left: false, right: false, thrust: false, fire: false, hyper: false, start: false, pause: false };
        return;
      }
      const prevStart = pad.start, prevPause = pad.pause, prevHyper = pad.hyper;
      pad.left = p.axes[0] < -0.4 || !!(p.buttons[14] && p.buttons[14].pressed);
      pad.right = p.axes[0] > 0.4 || !!(p.buttons[15] && p.buttons[15].pressed);
      pad.thrust = p.axes[1] < -0.4 || !!(p.buttons[12] && p.buttons[12].pressed) || !!(p.buttons[7] && p.buttons[7].pressed);
      pad.fire = !!(p.buttons[0] && p.buttons[0].pressed) || !!(p.buttons[2] && p.buttons[2].pressed);
      pad.hyper = !!(p.buttons[1] && p.buttons[1].pressed) || !!(p.buttons[5] && p.buttons[5].pressed);
      pad.start = !!(p.buttons[9] && p.buttons[9].pressed);
      pad.pause = !!(p.buttons[8] && p.buttons[8].pressed);
      if (pad.start && !prevStart) {
        if (state === "title" || state === "over") startGame();
        else togglePause();
      } else if (pad.pause && !prevPause) togglePause();
      if (pad.hyper && !prevHyper) hyperspace();
    }

    function updateAttract(dt) {
      for (const r of rocks) {
        r.x = wrap(r.x + r.vx * dt, W);
        r.y = wrap(r.y + r.vy * dt, H);
        r.rot += r.vr * dt;
      }
      updateFx(dt);
    }

    function updateFx(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (particles.length > 260) particles.splice(0, particles.length - 260);
      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.y += f.vy * dt;
        f.life -= dt;
        if (f.life <= 0) floaters.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const g = rings[i];
        g.r += g.vr * dt;
        g.life -= dt;
        if (g.life <= 0) rings.splice(i, 1);
      }
      shake *= reduceMotion ? 0 : Math.pow(0.04, dt);
      if (shake < 0.2) shake = 0;
      flash = Math.max(0, flash - dt * 1.8);
      if (bannerT > 0) {
        bannerT -= dt;
        if (bannerT <= 0) ui.banner.classList.remove("show");
      }
    }

    function beat(dt) {
      if (state !== "play") return;
      const n = rocks.length;
      const interval = clamp(0.22 + n * 0.045, 0.2, 0.85);
      beatT -= dt;
      if (beatT <= 0) {
        beatT = interval;
        beatFlip = !beatFlip;
        sfxThump(beatFlip);
      }
    }

    function updatePlay(dt) {
      fireCd = Math.max(0, fireCd - dt);
      hyperCd = Math.max(0, hyperCd - dt);

      if (ship && ship.alive) {
        if (wantLeft()) ship.a -= SHIP_ROT * dt;
        if (wantRight()) ship.a += SHIP_ROT * dt;
        ship.thrust = wantThrust();
        if (ship.thrust) {
          ship.vx += Math.cos(ship.a) * SHIP_THRUST * dt;
          ship.vy += Math.sin(ship.a) * SHIP_THRUST * dt;
          spawnBurst(
            ship.x - Math.cos(ship.a) * 12,
            ship.y - Math.sin(ship.a) * 12,
            Math.random() < 0.5 ? "#ffb04a" : "#ff7a32",
            1, 40, 0.28
          );
        }
        setThrustSound(ship.thrust);
        const spd = Math.hypot(ship.vx, ship.vy);
        if (spd > SHIP_MAX) {
          ship.vx *= SHIP_MAX / spd;
          ship.vy *= SHIP_MAX / spd;
        }
        ship.x = wrap(ship.x + ship.vx * dt, W);
        ship.y = wrap(ship.y + ship.vy * dt, H);
        if (ship.invuln > 0) ship.invuln -= dt;
        ship.blink += dt;

        const firing = wantFire();
        if (!firing) pendingStartShot = false;
        if (firing && !pendingStartShot && fireCd <= 0) {
          fire(ship);
          fireCd = FIRE_RATE;
        }
        const hyper = wantHyper();
        if (hyper && !hyperHeld) hyperspace();
        hyperHeld = hyper;
      } else {
        hyperHeld = wantHyper();
      }

      for (const r of rocks) {
        r.x = wrap(r.x + r.vx * dt, W);
        r.y = wrap(r.y + r.vy * dt, H);
        r.rot += r.vr * dt;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x = wrap(b.x + b.vx * dt, W);
        b.y = wrap(b.y + b.vy * dt, H);
        b.life -= dt;
        if (b.life <= 0) bullets.splice(i, 1);
      }

      for (let i = enemyShots.length - 1; i >= 0; i--) {
        const b = enemyShots[i];
        b.x = wrap(b.x + b.vx * dt, W);
        b.y = wrap(b.y + b.vy * dt, H);
        b.life -= dt;
        if (b.life <= 0) enemyShots.splice(i, 1);
      }

      if (saucer) {
        saucer.t += dt;
        saucer.vy = Math.sin(saucer.t * 1.7) * (saucer.small ? 70 : 46);
        if (Math.random() < dt * 0.6) saucer.vx += rand(-30, 30);
        saucer.vx = clamp(saucer.vx, -180, 180);
        saucer.x += saucer.vx * dt;
        saucer.y = wrap(saucer.y + saucer.vy * dt, H);
        if (saucer.x < -40 || saucer.x > W + 40) {
          saucer.wrapLeft--;
          if (saucer.wrapLeft < 0) {
            saucer = null;
            stopSiren();
            saucerTimer = rand(6, 12);
          } else {
            saucer.x = saucer.x < 0 ? W + 20 : -20;
          }
        }
        saucer.shoot -= dt;
        if (saucer && saucer.shoot <= 0) {
          saucerFire();
          saucer.shoot = saucer.small ? rand(0.55, 0.95) : rand(0.9, 1.5);
        }
      } else if (state === "play") {
        saucerTimer -= dt;
        if (saucerTimer <= 0 && rocks.length) spawnSaucer();
      }

      collide();

      if (state === "play" && rocks.length === 0 && !saucer) {
        wavePause += dt;
        if (wavePause > 1.35) nextWave();
      }

      updateFx(dt);
      beat(dt);
    }

    function collide() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let hit = false;
        for (let j = rocks.length - 1; j >= 0; j--) {
          const r = rocks[j];
          if (distWrap(b.x, b.y, r.x, r.y) < r.r + b.r) {
            bullets.splice(i, 1);
            splitRock(r, true);
            hit = true;
            break;
          }
        }
        if (hit) continue;
        if (saucer && distWrap(b.x, b.y, saucer.x, saucer.y) < saucer.r + b.r) {
          bullets.splice(i, 1);
          killSaucer(true);
        }
      }

      for (let i = enemyShots.length - 1; i >= 0; i--) {
        const b = enemyShots[i];
        let hit = false;
        for (let j = rocks.length - 1; j >= 0; j--) {
          const r = rocks[j];
          if (distWrap(b.x, b.y, r.x, r.y) < r.r + b.r) {
            enemyShots.splice(i, 1);
            splitRock(r, false);
            hit = true;
            break;
          }
        }
        if (hit) continue;
        if (ship && ship.alive && ship.invuln <= 0 && distWrap(b.x, b.y, ship.x, ship.y) < ship.r + b.r) {
          enemyShots.splice(i, 1);
          killShip();
        }
      }

      if (saucer) {
        for (const r of rocks) {
          if (distWrap(saucer.x, saucer.y, r.x, r.y) < saucer.r + r.r * 0.85) {
            killSaucer(false);
            splitRock(r, false);
            break;
          }
        }
      }

      if (ship && ship.alive && ship.invuln <= 0) {
        for (const r of rocks) {
          if (distWrap(ship.x, ship.y, r.x, r.y) < ship.r + r.r * 0.86) {
            killShip();
            splitRock(r, false);
            break;
          }
        }
        if (ship.alive && saucer && distWrap(ship.x, ship.y, saucer.x, saucer.y) < ship.r + saucer.r) {
          killSaucer(false);
          killShip();
        }
      }
    }

    function updateDead(dt) {
      setThrustSound(false);
      for (const r of rocks) {
        r.x = wrap(r.x + r.vx * dt, W);
        r.y = wrap(r.y + r.vy * dt, H);
        r.rot += r.vr * dt;
      }
      if (saucer) {
        saucer.x += saucer.vx * dt;
        saucer.y = wrap(saucer.y + saucer.vy * dt, H);
      }
      updateFx(dt);
      respawnT -= dt;
      if (respawnT <= 0 && (centerClear() || respawnT < -1.6)) respawn();
    }

    function strokeGlow(draw, color, width) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = (width || 1.6) + 3.2;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      draw();
      ctx.globalAlpha = 1;
      ctx.lineWidth = width || 1.6;
      draw();
      ctx.restore();
    }

    function around(x, y, r, fn) {
      fn(x, y);
      if (x < r) fn(x + W, y);
      if (x > W - r) fn(x - W, y);
      if (y < r) fn(x, y + H);
      if (y > H - r) fn(x, y - H);
      if (x < r && y < r) fn(x + W, y + H);
      if (x < r && y > H - r) fn(x + W, y - H);
      if (x > W - r && y < r) fn(x - W, y + H);
      if (x > W - r && y > H - r) fn(x - W, y - H);
    }

    function drawSky() {
      ctx.fillStyle = "#05070d";
      ctx.fillRect(0, 0, W, H);
      for (const n of nebula) {
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
        g.addColorStop(0, n.c);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = "#fff";
      for (const s of stars) {
        const tw = reduceMotion ? s.a : s.a * (0.65 + 0.35 * Math.sin(performance.now() * 0.001 * s.tw + s.p));
        ctx.globalAlpha = tw;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
      ctx.globalAlpha = 1;
    }

    function drawShip(s, ox, oy) {
      const x = ox, y = oy;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(s.a);
      if (s.invuln > 0 && Math.floor(s.blink * 16) % 2 === 0) {
        ctx.restore();
        return;
      }
      if (s.thrust) {
        const flick = 10 + Math.random() * 7;
        strokeGlow(() => {
          ctx.beginPath();
          ctx.moveTo(-7, -4);
          ctx.lineTo(-flick, 0);
          ctx.lineTo(-7, 4);
          ctx.stroke();
        }, "#ffb04a", 1.4);
      }
      strokeGlow(() => {
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-11, 9);
        ctx.lineTo(-7, 0);
        ctx.lineTo(-11, -9);
        ctx.closePath();
        ctx.stroke();
      }, "#e8f6ff", 1.7);
      ctx.restore();
    }

    function drawRock(r, ox, oy) {
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(r.rot);
      const c = `rgba(${Math.floor(190 * r.tint)}, ${Math.floor(210 * r.tint)}, ${Math.floor(230 * r.tint)}, 1)`;
      strokeGlow(() => {
        ctx.beginPath();
        ctx.moveTo(r.pts[0][0], r.pts[0][1]);
        for (let i = 1; i < r.pts.length; i++) ctx.lineTo(r.pts[i][0], r.pts[i][1]);
        ctx.closePath();
        ctx.stroke();
      }, c, 1.4);
      ctx.restore();
    }

    function drawSaucer(s, ox, oy) {
      ctx.save();
      ctx.translate(ox, oy);
      const rw = s.r * 1.8;
      const rh = s.r * 0.55;
      strokeGlow(() => {
        ctx.beginPath();
        ctx.ellipse(0, 0, rw, rh, 0, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0, -rh * 0.55, rw * 0.45, rh * 0.7, 0, Math.PI, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-rw * 0.55, 0);
        ctx.lineTo(rw * 0.55, 0);
        ctx.stroke();
      }, s.small ? "#ff8fb3" : "#ff5d8f", 1.6);
      ctx.restore();
    }

    function draw() {
      drawSky();
      const sx = shake ? rand(-shake, shake) : 0;
      const sy = shake ? rand(-shake, shake) : 0;
      ctx.save();
      ctx.translate(sx, sy);

      for (const r of rocks) around(r.x, r.y, r.r + 4, (x, y) => drawRock(r, x, y));
      if (saucer) around(saucer.x, saucer.y, saucer.r + 8, (x, y) => drawSaucer(saucer, x, y));

      ctx.save();
      for (const b of bullets) {
        ctx.strokeStyle = "#ffffff";
        ctx.globalAlpha = 0.95;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.fillStyle = "#ff8fb3";
      for (const b of enemyShots) {
        ctx.globalAlpha = 0.95;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.2, 0, TAU);
        ctx.fill();
      }
      ctx.restore();

      if (ship && ship.alive) around(ship.x, ship.y, 22, (x, y) => drawShip(ship, x, y));

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.strokeStyle = p.color;
        ctx.fillStyle = p.color;
        if (p.line) {
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      for (const g of rings) {
        ctx.strokeStyle = g.color;
        ctx.globalAlpha = Math.max(0, g.life * 2);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, TAU);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      ctx.font = "12px Segoe UI, Trebuchet MS, sans-serif";
      ctx.textAlign = "center";
      for (const f of floaters) {
        ctx.globalAlpha = Math.max(0, f.life / 0.85);
        ctx.fillStyle = "#b9ffd8";
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      if (flash > 0) {
        ctx.fillStyle = `rgba(230, 245, 255, ${flash})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function frame(t) {
      const dt = Math.min(0.033, (t - last) / 1000 || 0.016);
      last = t;
      pollPad();
      if (state === "title" || state === "over") updateAttract(dt);
      else if (state === "play") updatePlay(dt);
      else if (state === "pause") { }
      else if (state === "dead") updateDead(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function bindHold(el, key) {
      const down = (e) => {
        e.preventDefault();
        touch[key] = true;
        el.classList.add("held");
        unlockAudio();
      };
      const up = (e) => {
        e.preventDefault();
        touch[key] = false;
        el.classList.remove("held");
      };
      el.addEventListener("pointerdown", down);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointerleave", up);
      el.addEventListener("pointercancel", up);
    }

    bindHold(document.getElementById("t-left"), "left");
    bindHold(document.getElementById("t-right"), "right");
    bindHold(document.getElementById("t-thrust"), "thrust");
    bindHold(document.getElementById("t-fire"), "fire");
    bindHold(document.getElementById("t-hyper"), "hyper");

    window.addEventListener("keydown", (e) => {
      const gameKey = [
        "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
        "KeyA", "KeyD", "KeyW", "KeyS", "Space", "KeyJ",
        "ShiftLeft", "ShiftRight", "KeyH", "KeyP", "Escape", "Enter",
      ].includes(e.code);
      if (gameKey) e.preventDefault();
      if (e.repeat) {
        keys.add(e.code);
        return;
      }
      keys.add(e.code);
      unlockAudio();
      if (e.code === "KeyP" || e.code === "Escape") {
        if (state === "play" || state === "pause") togglePause();
        return;
      }
      if (e.code === "Enter" || e.code === "Space") {
        if (state === "title" || state === "over") {
          startGame();
          pendingStartShot = true;
        } else if (state === "pause") {
          togglePause();
        }
      }
      if (e.code === "KeyM") setMute(!muted);
    });

    window.addEventListener("keyup", (e) => keys.delete(e.code));
    window.addEventListener("blur", () => keys.clear());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state === "play") togglePause();
    });

    ui.start.addEventListener("click", () => startGame());
    ui.resume.addEventListener("click", () => { if (state === "pause") togglePause(); });
    ui.mute.addEventListener("click", () => {
      unlockAudio();
      setMute(!muted);
    });

    window.addEventListener("touchstart", () => {
      ui.touch.classList.add("show");
      ui.touch.setAttribute("aria-hidden", "false");
    }, { once: true, passive: true });

    window.addEventListener("resize", () => {
      resize();
    });

    loadStore();
    setMute(muted);
    ui.best.textContent = pad5(best);
    ui.hiLine.textContent = "Best " + pad5(best);
    refreshLives();
    resize();
    for (let i = 0; i < 6; i++) spawnRockAway(3, W * 0.5, H * 0.5, 40);
    openMenu("title");
    last = performance.now();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
