<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120e18">
  <title>Aetherline — First-person coaster</title>
  <style>
    :root {
      --bg: #120e18;
      --text: oklch(0.96 0.015 85);
      --muted: oklch(0.82 0.03 80 / 0.88);
      --accent: oklch(0.82 0.14 68);
      --danger: oklch(0.72 0.15 28);
      --panel: oklch(0.2 0.02 260 / 0.52);
      --stroke: oklch(1 0 0 / 0.14);
      --focus: oklch(0.88 0.12 70);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Avenir Next", "Trebuchet MS", sans-serif;
      overflow: hidden;
    }
    body { min-height: 100dvh; }
    #view {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #view:active { cursor: grabbing; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 42%, oklch(0.08 0.03 40 / 0.42) 100%);
      z-index: 2;
    }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      padding:
        max(12px, var(--safe-t))
        max(12px, var(--safe-r))
        max(12px, var(--safe-b))
        max(12px, var(--safe-l));
    }
    .hud button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid var(--stroke);
      background: var(--panel);
      color: var(--text);
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      font: 600 0.8rem/1 "Segoe UI", "Avenir Next", sans-serif;
      letter-spacing: 0.04em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: scale 150ms cubic-bezier(0.2, 0, 0, 1), background-color 150ms cubic-bezier(0.2, 0, 0, 1);
    }
    .hud button:hover { background: oklch(0.28 0.03 260 / 0.7); }
    .hud button:active { scale: 0.96; }
    .hud button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    .top, .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .bottom {
      position: absolute;
      left: max(12px, var(--safe-l));
      right: max(12px, var(--safe-r));
      bottom: max(12px, var(--safe-b));
      align-items: flex-end;
    }
    .brand {
      pointer-events: none;
      padding: 10px 12px 8px;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      min-width: 11rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }
    .cluster {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .section {
      position: absolute;
      top: max(12px, var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      max-width: min(70vw, 22rem);
    }
    .section strong {
      display: block;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-shadow: 0 2px 16px #000a;
    }
    .section span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: oklch(1 0 0 / 0.08);
      pointer-events: none;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, oklch(0.72 0.12 70), oklch(0.88 0.14 50));
    }
    .stat {
      pointer-events: none;
      padding: 10px 12px;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      min-width: 9.5rem;
    }
    .stat label {
      display: block;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .stat b {
      display: block;
      margin-top: 2px;
      font-size: 1.2rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      min-width: 8ch;
    }
    .meter {
      margin-top: 8px;
      height: 4px;
      border-radius: 2px;
      background: oklch(1 0 0 / 0.12);
      overflow: hidden;
    }
    .meter > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), oklch(0.9 0.12 45));
    }
    .meter.g > i { background: linear-gradient(90deg, oklch(0.7 0.08 200), var(--danger)); }
    .map-wrap {
      margin-top: 8px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--stroke);
    }
    #minimap {
      display: block;
      width: 148px;
      height: 96px;
      background: oklch(0.12 0.02 250 / 0.65);
    }
    .hint {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 0 1px 8px #000c;
      max-width: 16rem;
      margin: 0 auto;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 30%, oklch(0.28 0.06 50 / 0.35), oklch(0.08 0.02 40 / 0.72));
      pointer-events: none;
      opacity: 1;
      transition: opacity 700ms cubic-bezier(0.2, 0, 0, 1);
    }
    .overlay.hide {
      opacity: 0;
    }
    .overlay.block {
      pointer-events: auto;
      background: oklch(0.1 0.02 40 / 0.62);
      backdrop-filter: blur(8px);
    }
    .card {
      width: min(28rem, 100%);
      text-align: center;
      pointer-events: auto;
    }
    .card h2 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.4rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .card p {
      margin: 10px 0 0;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .card .actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .card button {
      appearance: none;
      border: 1px solid var(--stroke);
      background: oklch(0.78 0.14 68);
      color: #1a1208;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      font: 700 0.9rem/1 "Segoe UI", "Avenir Next", sans-serif;
      cursor: pointer;
    }
    .card button.ghost {
      background: var(--panel);
      color: var(--text);
    }
    .card button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    .fail {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 8;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      text-align: center;
    }
    .fail.show { display: grid; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    @media (max-width: 640px) {
      .brand p, .hint { display: none; }
      .stat { min-width: 7.5rem; }
      #minimap { width: 112px; height: 76px; }
      .section { top: calc(max(12px, var(--safe-t)) + 52px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .overlay, .hud button { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="view" aria-label="First-person rollercoaster"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
  <div class="hud">
    <div class="top">
      <div class="brand">
        <h1>Aetherline</h1>
        <p>Helix Park · dusk circuit</p>
      </div>
      <div class="cluster" role="toolbar" aria-label="Ride controls">
        <button type="button" id="btnPause" aria-pressed="false">Pause</button>
        <button type="button" id="btnSound" aria-pressed="false">Sound on</button>
        <button type="button" id="btnFull" aria-pressed="false">Full screen</button>
      </div>
    </div>
    <div class="section">
      <strong id="sectionName">Station</strong>
      <span id="lapLabel">Lap 1</span>
    </div>
    <div class="bottom">
      <div class="stat">
        <label>Speed</label>
        <b id="speedVal">0 km/h</b>
        <div class="meter" aria-hidden="true"><i id="speedMeter"></i></div>
      </div>
      <p class="hint" id="hint">Drag to look · Space pauses</p>
      <div class="stat">
        <label>Height · G</label>
        <b id="gVal">4.6 m · 1.00 G</b>
        <div class="meter g" aria-hidden="true"><i id="gMeter"></i></div>
        <div class="map-wrap"><canvas id="minimap" width="296" height="192"></canvas></div>
      </div>
    </div>
  </div>
  <div class="overlay" id="intro">
    <div class="card">
      <h2>Aetherline</h2>
      <p>Front seat · continuous circuit</p>
    </div>
  </div>
  <div class="overlay hide" id="pauseOverlay">
    <div class="card">
      <h2>Paused</h2>
      <p>The train holds on the rails</p>
      <div class="actions">
        <button type="button" id="btnResume">Resume</button>
        <button type="button" class="ghost" id="btnRestart">Back to station</button>
      </div>
    </div>
  </div>
  <div class="fail" id="fail">
    <div>
      <h2>WebGL is required</h2>
      <p>This ride needs a browser with WebGL enabled.</p>
    </div>
  </div>
  <p class="sr" id="live" role="status" aria-live="polite"></p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('view');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = (id) => document.getElementById(id);
const intro = $('intro');
const pauseOverlay = $('pauseOverlay');
const live = $('live');
const mapCtx = $('minimap').getContext('2d');

const DS = 0.42;
const G = 9.81;
const GAUGE = 0.9;
const HEAD_Y = 1.08;
const LIFT_SPEED = 3.35;
const BRAKE_SPEED = 2.8;
const MIN_SPEED = 2.2;

function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
const rand = rng(0xA37E11);

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function wrap(s, len) { s %= len; return s < 0 ? s + len : s; }

function groundY(x, z) {
  const d = Math.hypot(x, z);
  const plaza = clamp((55 - d) / 30, 0, 1);
  const h =
    Math.sin(x * 0.017) * Math.cos(z * 0.015) * 3.1 +
    Math.sin(x * 0.041 + 1.7) * Math.cos(z * 0.033) * 1.35 +
    Math.sin(x * 0.09 + z * 0.02) * 0.35;
  return lerp(h, 0.02, smooth(plaza));
}

const SECTION = {
  station: 'Station',
  lift: 'Chain lift',
  crest: 'Crest',
  drop: 'First drop',
  airtime: 'Airtime hills',
  sweep: 'Banked sweep',
  tunnel: 'Tunnel',
  loop: 'Vertical loop',
  helix: 'Helix',
  screw: 'Corkscrew',
  hills: 'Bunny hops',
  brakes: 'Brakes'
};

class TrackBuilder {
  constructor() {
    this.p = new THREE.Vector3();
    this.d = new THREE.Vector3(1, 0, 0);
    this.u = new THREE.Vector3(0, 1, 0);
    this.r = new THREE.Vector3(0, 0, 1);
    this.samples = [];
    this.length = 0;
    this.section = 'station';
    this.lift = false;
    this.brake = false;
    this.markers = {};
  }
  ortho() {
    this.d.normalize();
    this.r.crossVectors(this.d, this.u);
    if (this.r.lengthSq() < 1e-8) {
      this.r.set(0, 0, 1).cross(this.d);
    }
    this.r.normalize();
    this.u.crossVectors(this.r, this.d).normalize();
  }
  record() {
    this.ortho();
    const prev = this.samples[this.samples.length - 1];
    if (prev) this.length += this.p.distanceTo(prev.p);
    this.samples.push({
      p: this.p.clone(),
      d: this.d.clone(),
      u: this.u.clone(),
      r: this.r.clone(),
      s: this.length,
      section: this.section,
      lift: this.lift,
      brake: this.brake
    });
  }
  pitch() {
    return Math.asin(clamp(this.d.y, -1, 1));
  }
  advance(ds, dPitch, dYaw, dRoll) {
    this.ortho();
    this.d.applyAxisAngle(this.u, dYaw);
    this.r.applyAxisAngle(this.u, dYaw);
    this.d.applyAxisAngle(this.r, dPitch);
    this.u.applyAxisAngle(this.r, dPitch);
    this.u.applyAxisAngle(this.d, dRoll);
    this.r.applyAxisAngle(this.d, dRoll);
    this.ortho();
    this.p.addScaledVector(this.d, ds);
    this.record();
  }
  straight(len) {
    const n = Math.max(1, Math.ceil(len / DS));
    for (let i = 0; i < n; i++) this.advance(DS, 0, 0, 0);
  }
  level() {
    for (let k = 0; k < 14; k++) {
      const cur = this.pitch();
      if (Math.abs(cur) < 0.012) break;
      this.advance(DS, -cur * 0.55, 0, 0);
    }
    const worldUp = new THREE.Vector3(0, 1, 0);
    const wantU = worldUp.clone().addScaledVector(this.d, -worldUp.dot(this.d));
    if (wantU.lengthSq() > 1e-6) {
      wantU.normalize();
      const ang = Math.atan2(this.r.dot(wantU), this.u.dot(wantU));
      if (Math.abs(ang) > 0.012) this.advance(DS, 0, 0, -ang);
    }
  }
  liftHill(len, rise) {
    this.lift = true;
    const n = Math.ceil(len / DS);
    const pitch = Math.atan2(rise, len);
    for (let i = 0; i < n; i++) {
      const t = i / Math.max(1, n - 1);
      let target = pitch;
      if (t < 0.08) target = pitch * (t / 0.08);
      else if (t > 0.9) target = pitch * (1 - (t - 0.9) / 0.1);
      this.advance(DS, target - this.pitch(), 0, 0);
    }
    this.lift = false;
  }
  drop(len, fall) {
    const n = Math.ceil(len / DS);
    const slope = Math.atan2(-fall, len);
    for (let i = 0; i < n; i++) {
      const t = i / Math.max(1, n - 1);
      const env = Math.sin(t * Math.PI);
      const target = slope * (0.45 + 0.95 * env);
      this.advance(DS, target - this.pitch(), 0, 0);
    }
    this.level();
  }
  hill(len, peak) {
    const n = Math.ceil(len / DS);
    let prev = 0;
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      const y = peak * Math.sin(Math.PI * t);
      const dy = y - prev;
      prev = y;
      const target = Math.atan2(dy, DS);
      this.advance(DS, target - this.pitch(), 0, 0);
    }
    this.level();
  }
  bankedTurn(angle, radius, bank) {
    const arc = Math.abs(angle) * radius;
    const n = Math.max(4, Math.ceil(arc / DS));
    const yawPer = angle / n;
    let rolled = 0;
    const sign = Math.sign(angle) || 1;
    for (let i = 0; i < n; i++) {
      const t = i / Math.max(1, n - 1);
      let tb = bank;
      if (t < 0.12) tb = bank * (t / 0.12);
      else if (t > 0.88) tb = bank * (1 - (t - 0.88) / 0.12);
      const want = -sign * tb;
      const dRoll = want - rolled;
      rolled = want;
      this.advance(DS, 0, yawPer, dRoll);
      if (i === (n >> 1) && !this.markers.sweepCenter) {
        this.markers.sweepCenter = this.p.clone().addScaledVector(this.r, sign * radius);
      }
    }
    if (Math.abs(rolled) > 0.01) this.advance(DS, 0, 0, -rolled);
    this.level();
  }
  loop(radius) {
    const n = Math.max(24, Math.ceil((Math.PI * 2 * radius) / DS));
    const dp = (Math.PI * 2) / n;
    this.markers.loop = this.p.clone();
    for (let i = 0; i < n; i++) this.advance(DS, dp, 0, 0);
    this.level();
  }
  helix(turns, radius, fall, bank) {
    const arc = Math.abs(turns) * Math.PI * 2 * radius;
    const n = Math.max(16, Math.ceil(arc / DS));
    const yawPer = (turns * Math.PI * 2) / n;
    const pitch = Math.atan2(-fall, arc);
    let rolled = 0;
    const sign = Math.sign(turns) || 1;
    for (let i = 0; i < n; i++) {
      const t = i / Math.max(1, n - 1);
      let tb = bank;
      if (t < 0.1) tb *= t / 0.1;
      if (t > 0.9) tb *= (1 - t) / 0.1;
      const want = -sign * tb;
      const dRoll = want - rolled;
      rolled = want;
      this.advance(DS, pitch - this.pitch(), yawPer, dRoll);
      if (i === (n >> 1)) {
        this.markers.helix = this.p.clone().addScaledVector(this.r, sign * radius);
      }
    }
    if (Math.abs(rolled) > 0.01) this.advance(DS, 0, 0, -rolled);
    this.level();
  }
  corkscrew(len, rolls) {
    const n = Math.max(16, Math.ceil(len / DS));
    const dr = (Math.PI * 2 * rolls) / n;
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const yaw = Math.sin(t * Math.PI) * 0.012;
      this.advance(DS, 0, yaw, dr);
    }
    this.level();
  }
  closeToStart() {
    const start = this.samples[0];
    const p0 = this.p.clone();
    const d0 = this.d.clone();
    const u0 = this.u.clone();
    const p1 = start.p;
    const d1 = start.d;
    const u1 = start.u;
    const dist = p0.distanceTo(p1);
    const len = Math.max(28, dist * 1.35);
    const n = Math.ceil(len / DS);
    const m0 = d0.clone().multiplyScalar(len);
    const m1 = d1.clone().multiplyScalar(len);
    this.brake = true;
    this.section = 'brakes';
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      const t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1;
      const h10 = t3 - 2 * t2 + t;
      const h01 = -2 * t3 + 3 * t2;
      const h11 = t3 - t2;
      this.p.set(0, 0, 0)
        .addScaledVector(p0, h00)
        .addScaledVector(m0, h10)
        .addScaledVector(p1, h01)
        .addScaledVector(m1, h11);
      const dh00 = 6 * t2 - 6 * t;
      const dh10 = 3 * t2 - 4 * t + 1;
      const dh01 = -6 * t2 + 6 * t;
      const dh11 = 3 * t2 - 2 * t;
      this.d.set(0, 0, 0)
        .addScaledVector(p0, dh00)
        .addScaledVector(m0, dh10)
        .addScaledVector(p1, dh01)
        .addScaledVector(m1, dh11);
      if (this.d.lengthSq() < 1e-8) this.d.copy(d1);
      this.d.normalize();
      this.u.lerpVectors(u0, u1, t);
      this.ortho();
      this.record();
    }
    const last = this.samples[this.samples.length - 1];
    if (last && last.p.distanceTo(start.p) < 1.2) this.samples.pop();
    this.length = this.samples[this.samples.length - 1].s;
  }
}

function buildTrack() {
  const b = new TrackBuilder();
  b.p.set(-64, 4.7, 14);
  b.d.set(1, 0, 0);
  b.u.set(0, 1, 0);
  b.section = 'station';
  b.record();
  b.straight(24);
  b.section = 'lift';
  b.bankedTurn(0.42, 18, 0.2);
  b.straight(10);
  b.liftHill(112, 56);
  b.section = 'crest';
  b.straight(12);
  b.level();
  b.section = 'drop';
  b.drop(68, 49);
  b.straight(8);
  b.section = 'airtime';
  b.hill(40, 16);
  b.straight(6);
  b.section = 'sweep';
  b.bankedTurn(Math.PI * 1.18, 26, 1.02);
  b.straight(8);
  b.hill(22, 7);
  b.section = 'tunnel';
  b.straight(16);
  b.bankedTurn(-0.55, 18, 0.35);
  b.straight(12);
  b.section = 'loop';
  b.loop(12);
  b.straight(14);

}

const track = buildTrack();
const samples = track.samples;
const trackLen = samples[samples.length - 1].s;

function sampleIndex(s) {
  s = wrap(s, trackLen);
  let lo = 0, hi = samples.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (samples[mid].s < s) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

const _fp = new THREE.Vector3();
const _fd = new THREE.Vector3();
const _fu = new THREE.Vector3();
const _fr = new THREE.Vector3();
const tmpFrame = { p: _fp, d: _fd, u: _fu, r: _fr, section: 'station', lift: false, brake: false, s: 0 };

function frameAt(s) {
  s = wrap(s, trackLen);
  let i1 = sampleIndex(s);
  if (i1 <= 0) i1 = 1;
  const a = samples[i1 - 1];
  const b = samples[i1] || samples[0];
  const span = (b.s - a.s) || DS;
  let t = clamp((s - a.s) / span, 0, 1);
  if (b.s < a.s) t = 0;
  _fp.lerpVectors(a.p, b.p, t);
  _fd.lerpVectors(a.d, b.d, t).normalize();
  _fu.lerpVectors(a.u, b.u, t);
  _fr.crossVectors(_fd, _fu);
  if (_fr.lengthSq() < 1e-8) _fr.set(0, 0, 1).cross(_fd);
  _fr.normalize();
  _fu.crossVectors(_fr, _fd).normalize();
  tmpFrame.section = t > 0.5 ? b.section : a.section;
  tmpFrame.lift = t > 0.5 ? b.lift : a.lift;
  tmpFrame.brake = t > 0.5 ? b.brake : a.brake;
  tmpFrame.s = s;
  return tmpFrame;
}

function extrude(pathSamples, profile, closed, colorFn) {
  const stride = 2;
  const ring = [];
  for (let i = 0; i < pathSamples.length; i += stride) ring.push(pathSamples[i]);
  if (ring[ring.length - 1] !== pathSamples[pathSamples.length - 1]) ring.push(pathSamples[pathSamples.length - 1]);
  const n = ring.length;
  const pn = profile.length;
  const pos = new Float32Array(n * pn * 3);
  const nor = new Float32Array(n * pn * 3);
  const col = new Float32Array(n * pn * 3);
  const uv = new Float32Array(n * pn * 2);
  const idx = [];
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const s = ring[i];
    for (let j = 0; j < pn; j++) {
      const pr = profile[j];
      const o = (i * pn + j) * 3;
      pos[o] = s.p.x + s.r.x * pr.x + s.u.x * pr.y;
      pos[o + 1] = s.p.y + s.r.y * pr.x + s.u.y * pr.y;
      pos[o + 2] = s.p.z + s.r.z * pr.x + s.u.z * pr.y;
      const nx = s.r.x * pr.nx + s.u.x * pr.ny;
      const ny = s.r.y * pr.nx + s.u.y * pr.ny;
      const nz = s.r.z * pr.nx + s.u.z * pr.ny;
      const nl = Math.hypot(nx, ny, nz) || 1;
      nor[o] = nx / nl; nor[o + 1] = ny / nl; nor[o + 2] = nz / nl;
      if (colorFn) {
        colorFn(c, s, i / n);
        col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b;
      } else {
        col[o] = col[o + 1] = col[o + 2] = 1;
      }
      const uvo = (i * pn + j) * 2;
      uv[uvo] = s.s * 0.25;
      uv[uvo + 1] = j / pn;
    }
  }
  for (let i = 0; i < n - (closed ? 0 : 1); i++) {
    const i0 = i, i1 = (i + 1) % n;
    for (let j = 0; j < pn; j++) {
      const j1 = (j + 1) % pn;
      const a = i0 * pn + j, b = i0 * pn + j1, c2 = i1 * pn + j, d = i1 * pn + j1;
      idx.push(a, c2, b, b, c2, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function circleProfile(radius, segs) {
  const p = [];
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const x = Math.cos(a) * radius, y = Math.sin(a) * radius;
    const l = Math.hypot(x, y) || 1;
    p.push({ x, y, nx: x / l, ny: y / l });
  }
  return p;
}

const basis = new THREE.Matrix4();

function placeCar(mesh, s) {

function placeTrain(s) {

const audio = {
  ctx: null,
  wind: null,
  windGain: null,
  filter: null,
  master: null,
  enabled: false
};

function startAudio() {
  if (audio.ctx) {
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    audio.enabled = true;
    return;
  }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const n = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const white = Math.random() * 2 - 1;
    last = last * 0.97 + white * 0.03;
    data[i] = last * 3.2;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 400;
  filter.Q.value = 0.7;
  const gain = ctx.createGain();
  gain.gain.value = 0;
  const master = ctx.createGain();
  master.gain.value = 0.55;
  src.connect(filter).connect(gain).connect(master).connect(ctx.destination);
  src.start();
  audio.ctx = ctx;
  audio.wind = src;
  audio.filter = filter;
  audio.windGain = gain;
  audio.master = master;
  audio.enabled = true;
}

function clickClack(rate, gainVal) {
  if (!audio.ctx || !audio.enabled) return;
  const t = audio.ctx.currentTime;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = 'square';
  o.frequency.value = 80 + Math.random() * 40;
  g.gain.setValueAtTime(gainVal, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(g).connect(audio.master);
  o.start(t);
  o.stop(t + 0.05);
}

const state = {
  s: 0.5,
  v: LIFT_SPEED,
  energy: G * 62,
  paused: reduced,
  lookYaw: 0,
  lookPitch: 0,
  dragging: false,
  pointerId: null,
  fovPunch: 0,
  trauma: 0,
  time: 0,
  lap: 1,
  lastSection: 'station',
  lastClick: 0,
  introUntil: 3.2,
  maxH: 4.7,
  gLoad: 1,
  muted: false
};

for (const sm of samples) state.maxH = Math.max(state.maxH, sm.p.y);
state.energy = G * (state.maxH + 1.5);

placeTrain(state.s);

const lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

function setPaused(v) {
  state.paused = v;
  $('btnPause').textContent = v ? 'Resume' : 'Pause';
  $('btnPause').setAttribute('aria-pressed', v ? 'true' : 'false');
  pauseOverlay.classList.toggle('hide', !v);
  pauseOverlay.classList.toggle('block', v);
  if (v) live.textContent = 'Paused';
}

function restart() {
  state.s = 0.6;
  state.v = LIFT_SPEED;
  state.energy = G * (state.maxH + 1.5);
  state.lap = 1;
  state.fovPunch = 0;
  state.trauma = 0;
  placeTrain(state.s);
  setPaused(false);
  live.textContent = 'Back at the station';
}

$('btnPause').addEventListener('click', () => setPaused(!state.paused));
$('btnResume').addEventListener('click', () => setPaused(false));
$('btnRestart').addEventListener('click', restart);
$('btnSound').addEventListener('click', () => {
  state.muted = !state.muted;
  if (!state.muted) startAudio();
  if (audio.master) audio.master.gain.value = state.muted ? 0 : 0.55;
  $('btnSound').textContent = state.muted ? 'Sound off' : 'Sound on';
  $('btnSound').setAttribute('aria-pressed', state.muted ? 'false' : 'true');
});

  else await document.exitFullscreen?.();

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    setPaused(!state.paused);
  } else if (e.code === 'KeyM') {
    $('btnSound').click();
  } else if (e.code === 'KeyR') {
    restart();
  } else if (e.code === 'KeyF') {
    $('btnFull').click();
  } else if (e.code === 'ArrowLeft') state.lookYaw += 0.08;
  else if (e.code === 'ArrowRight') state.lookYaw -= 0.08;
  else if (e.code === 'ArrowUp') state.lookPitch += 0.05;
  else if (e.code === 'ArrowDown') state.lookPitch -= 0.05;
});

canvas.addEventListener('pointerdown', (e) => {
  state.dragging = true;
  state.pointerId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  if (!state.muted) startAudio();
  intro.classList.add('hide');
});
canvas.addEventListener('pointermove', (e) => {
  if (!state.dragging) return;
  state.lookYaw -= e.movementX * 0.0032;
  state.lookPitch -= e.movementY * 0.0026;
  state.lookPitch = clamp(state.lookPitch, -1.05, 0.95);
  state.lookYaw = clamp(state.lookYaw, -1.35, 1.35);
});
function endDrag(e) {
  if (state.pointerId === e.pointerId) {
    state.dragging = false;
    state.pointerId = null;
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

let mapPts = null;
function buildMap() {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  const pts = [];
  for (let i = 0; i < samples.length; i += 6) {
    const p = samples[i].p;
    pts.push(p);
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
  }
  mapPts = { pts, minX, maxX, minZ, maxZ };
}
buildMap();

function drawMap(s) {
  const w = $('minimap').width, h = $('minimap').height;
  mapCtx.clearRect(0, 0, w, h);
  const { pts, minX, maxX, minZ, maxZ } = mapPts;
  const pad = 16;
  const sx = (w - pad * 2) / (maxX - minX || 1);
  const sz = (h - pad * 2) / (maxZ - minZ || 1);
  const sc = Math.min(sx, sz);
  const ox = (w - (maxX - minX) * sc) / 2;
  const oz = (h - (maxZ - minZ) * sc) / 2;
  const tx = (x) => ox + (x - minX) * sc;
  const tz = (z) => oz + (z - minZ) * sc;
  mapCtx.strokeStyle = 'rgba(255,210,140,0.55)';
  mapCtx.lineWidth = 3;
  mapCtx.beginPath();
  pts.forEach((p, i) => {
    if (i === 0) mapCtx.moveTo(tx(p.x), tz(p.z));
    else mapCtx.lineTo(tx(p.x), tz(p.z));
  });
  mapCtx.closePath();
  mapCtx.stroke();
  const f = frameAt(s);
  mapCtx.fillStyle = '#ffe6a8';
  mapCtx.beginPath();
  mapCtx.arc(tx(f.p.x), tz(f.p.z), 5, 0, Math.PI * 2);
  mapCtx.fill();
}

function curvatureUp(s) {
  const a = frameAt(s - 0.6);
  const da = a.d.clone();
  const b = frameAt(s + 0.6);
  const db = b.d.clone();
  const dD = db.sub(da);
  const ds = 1.2;
  const f = frameAt(s);
  return dD.dot(f.u) / ds;
}

let lastClickDist = 0;
let acc = 0;
const hud = {
  speed: $('speedVal'),
  g: $('gVal'),
  section: $('sectionName'),
  lap: $('lapLabel'),
  bar: $('progressBar'),
  speedMeter: $('speedMeter'),
  gMeter: $('gMeter')
};

function tick(now) {
  const t = now * 0.001;
  const rawDt = Math.min(0.05, Math.max(0.001, t - (tick.prev || t)));
  tick.prev = t;
  const dt = rawDt;
  state.time += dt;

  if (state.introUntil > 0) {
    state.introUntil -= dt;
    if (state.introUntil <= 0 && !reduced) intro.classList.add('hide');
  }

  const f = frameAt(state.s);
  const h = f.p.y;

  if (!state.paused) {
    if (f.lift) {
      state.v = LIFT_SPEED;
      state.energy = G * h + 0.5 * state.v * state.v;
    } else {
      const kinetic = Math.max(0, state.energy - G * h);
      state.v = Math.sqrt(2 * kinetic);
      if (f.brake) {
        const target = BRAKE_SPEED;
        state.v += (target - state.v) * Math.min(1, dt * 1.6);
        state.energy = G * h + 0.5 * state.v * state.v;
      } else {
        state.v = Math.max(MIN_SPEED, state.v);
        state.energy -= 0.55 * state.v * state.v * dt;
        state.energy = Math.max(G * (h + 0.4) + 0.5 * MIN_SPEED * MIN_SPEED, state.energy);
      }
    }
    const ds = state.v * dt;
    const prevS = state.s;
    state.s = wrap(state.s + ds, trackLen);
    if (state.s < prevS) state.lap += 1;
    lastClickDist += ds;
  }

  placeTrain(state.s);
  const fNow = frameAt(state.s);
  const kappa = curvatureUp(state.s);
  const gLoad = (G * fNow.u.y + state.v * state.v * kappa) / G;
  state.gLoad = gLoad;

  if (!reduced) {
    if (!state.paused && fNow.section === 'drop' && state.v > 18) {
      state.fovPunch = Math.min(10, state.fovPunch + dt * 14);
    }
    state.fovPunch *= Math.exp(-dt / 0.42);
    const shakeSrc = clamp((state.v - 12) / 40, 0, 1) * 0.18 + clamp(Math.abs(gLoad) - 1.6, 0, 2) * 0.08;
    state.trauma = lerp(state.trauma, shakeSrc, 1 - Math.exp(-dt * 6));
  } else {
    state.fovPunch = 0;
    state.trauma = 0;
  }

  const speedKmh = state.v * 3.6;
  const baseFov = reduced ? 62 : 66;
  camera.fov = baseFov + clamp(speedKmh / 18, 0, 12) + state.fovPunch;
  camera.updateProjectionMatrix();

  if (!state.dragging) {
    state.lookYaw *= Math.exp(-dt * 1.8);
    state.lookPitch *= Math.exp(-dt * 1.8);
  }
  lookEuler.set(state.lookPitch, state.lookYaw, 0);
  camera.quaternion.setFromEuler(lookEuler);
  if (state.trauma > 0.002) {
    const sh = state.trauma * state.trauma;
    const freq = state.time * 29;
    camera.position.set(
      0.012 * sh * Math.sin(freq * 1.7),
      HEAD_Y + 0.01 * sh * Math.sin(freq * 1.3 + 2),
      0.18
    );
    camera.rotateZ(0.04 * sh * Math.sin(freq * 1.1));
  } else {
    camera.position.set(0, HEAD_Y, 0.18);
  }

  const wheel = ferris.userData.wheel;
  wheel.rotation.z = state.time * 0.18;
  wheel.children.forEach((ch) => {
    if (ch.userData.base != null) ch.rotation.z = -wheel.rotation.z;
  });
  carousel.userData.mounts.rotation.y = state.time * 0.55;
  carousel.userData.mounts.children.forEach((h, i) => {
    h.position.y = 1.4 + Math.sin(state.time * 2.4 + i) * 0.22;
  });

  if (treeMat.userData.shader) treeMat.userData.shader.uniforms.uTime.value = state.time;
  waterUniforms.uTime.value = state.time;

  const streakOp = reduced ? 0 : clamp((state.v - 16) / 22, 0, 0.55);
  streakMat.opacity = streakOp;
  streaks.forEach((m, i) => {
    const seed = i * 17.2;
    m.position.set(
      ((Math.sin(seed) * 0.5 + 0.5) * 2.4 - 1.2),
      ((Math.cos(seed * 1.3) * 0.5 + 0.5) * 1.4 - 0.4),
      -1.2 - (i % 5) * 0.35
    );
    m.scale.z = 0.6 + clamp(state.v / 30, 0, 2);
  });

  if (audio.enabled && audio.windGain && !state.muted) {
    const w = clamp(state.v / 38, 0, 1);
    audio.windGain.gain.setTargetAtTime(w * 0.45, audio.ctx.currentTime, 0.08);
    audio.filter.frequency.setTargetAtTime(280 + w * 1400, audio.ctx.currentTime, 0.1);
    const interval = fNow.lift ? 0.38 : clamp(2.4 / Math.max(state.v, 1), 0.07, 0.45);
    if (!state.paused && lastClickDist > interval * Math.max(state.v, 1)) {
      lastClickDist = 0;
      clickClack(state.v, fNow.lift ? 0.07 : 0.035 * clamp(state.v / 20, 0.2, 1));
    }
  }

  if (fNow.section !== state.lastSection) {
    state.lastSection = fNow.section;
    const name = SECTION[fNow.section] || fNow.section;
    hud.section.textContent = name;
    live.textContent = name;
    if (!reduced && (fNow.section === 'drop' || fNow.section === 'loop')) state.fovPunch = Math.min(10, state.fovPunch + 5);
  }
  hud.lap.textContent = `Lap ${state.lap}`;
  hud.speed.textContent = `${speedKmh.toFixed(0)} km/h`;
  hud.g.textContent = `${h.toFixed(1)} m · ${gLoad.toFixed(2)} G`;
  hud.bar.style.width = `${(state.s / trackLen) * 100}%`;
  hud.speedMeter.style.width = `${clamp(speedKmh / 130, 0, 1) * 100}%`;
  hud.gMeter.style.width = `${clamp(Math.abs(gLoad) / 4, 0, 1) * 100}%`;

  acc += dt;
  if (acc > 0.08) {
    acc = 0;
    drawMap(state.s);
  }

  sky.position.copy(camera.getWorldPosition(lookTarget));
  renderer.render(scene, camera);

  const info = renderer.info;
  window.__THREE_GAME_DIAGNOSTICS__ = {
    paused: state.paused,
    s: state.s,
    v: state.v,
    section: fNow.section,
    lap: state.lap,
    calls: info.render.calls,
    triangles: info.render.triangles,
    fps: 1 / dt
  };
}

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);

if (reduced) {
  intro.classList.add('hide');
  setPaused(true);
  live.textContent = 'Motion reduced. Press Resume to ride.';
}

renderer.setAnimationLoop(tick);

window.__AETHERLINE__ = { trackLen, samples: samples.length, restart, setPaused };
  </script>
