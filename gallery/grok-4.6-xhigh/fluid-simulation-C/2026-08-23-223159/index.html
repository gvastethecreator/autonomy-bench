<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060a">
  <title>Cinnabar — pigment well</title>
  <style>
    :root {
      --void: #07060a;
      --ink: #f3ece4;
      --ink-dim: #c4b2a2;
      --ink-mute: #8d7b6e;
      --hairline: rgba(244, 220, 196, 0.16);
      --lacquer: rgba(14, 9, 8, 0.72);
      --lacquer-2: rgba(22, 14, 12, 0.55);
      --vermilion: #e4451a;
      --focus: #f4e2cf;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --safe-t: max(16px, env(safe-area-inset-top));
      --safe-r: max(16px, env(safe-area-inset-right));
      --safe-b: max(16px, env(safe-area-inset-bottom));
      --safe-l: max(16px, env(safe-area-inset-left));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--void);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #well {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }

    body.is-coarse #well { cursor: crosshair; }

    .mast, .rack, .hint, .print, .brush, .status {
      pointer-events: none;
    }

    .mast {
      position: fixed;
      top: var(--safe-t);
      left: var(--safe-l);
      z-index: 3;
      max-width: min(28rem, 42vw);
      padding: 4px 2px;
      transition: opacity 700ms var(--ease), transform 700ms var(--ease);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--vermilion);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Times New Roman", serif;
      font-size: clamp(2rem, 4.2vw, 3.35rem);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 0.95;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .lede {
      margin: 12px 0 0;
      max-width: 22ch;
      color: var(--ink-dim);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 500;
    }

    body.is-settled .mast {
      opacity: 0.55;
      transform: translateY(-4px);
    }

    body.is-settled .lede { opacity: 0; height: 0; margin: 0; overflow: hidden; }

    .rack {
      position: fixed;
      right: var(--safe-r);
      bottom: var(--safe-b);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: var(--lacquer);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 12px 14px;
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }

    .wells {
      display: flex;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .well-btn {
      appearance: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), transparent 26%),
        radial-gradient(circle at 50% 70%, rgba(0,0,0,0.28), transparent 55%),
        var(--pigment);
      box-shadow:
        inset 0 -6px 10px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 0 0 1px rgba(255,255,255,0.08);
      cursor: pointer;
      transform: scale(1);
      transition: transform 150ms var(--ease), box-shadow 150ms var(--ease);
    }

    .well-btn[aria-pressed="true"] {
      transform: scale(1.08);
      box-shadow:
        inset 0 -6px 10px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 0 0 2px var(--void),
        0 0 0 4px var(--pigment),
        0 8px 22px color-mix(in srgb, var(--pigment) 45%, transparent);
    }

    .well-btn:hover { transform: scale(1.05); }
    .well-btn:active { transform: scale(0.96); }
    .well-btn.water {
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.7), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(40,70,90,0.4), transparent 50%),
        linear-gradient(180deg, #d7e4ee, #7f97a8);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 10px;
      align-items: center;
    }

    .tools button {
      appearance: none;
      pointer-events: auto;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: var(--lacquer-2);
      color: var(--ink);
      font: 600 12px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 150ms var(--ease), background 150ms var(--ease);
    }

    .tools button:hover { background: rgba(40, 24, 20, 0.8); }
    .tools button:active { transform: scale(0.96); }
    .tools button[aria-pressed="true"] {
      background: color-mix(in srgb, var(--vermilion) 28%, #1a100e);
      border-color: color-mix(in srgb, var(--vermilion) 55%, white);
    }

    .sliders {
      display: grid;
      grid-template-columns: auto minmax(92px, 140px);
      gap: 8px 12px;
      align-items: center;
      min-width: 180px;
    }

    .sliders label {
      color: var(--ink-mute);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      height: 16px;
      margin: 0;
      accent-color: var(--vermilion);
      cursor: pointer;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: var(--hairline);
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid #2a1814;
    }

    input[type="range"]::-moz-range-track {
      height: 2px;
      background: var(--hairline);
      border: 0;
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid #2a1814;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-b) + 18px);
      z-index: 3;
      transform: translateX(-50%);
      color: var(--ink-dim);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 16px #000;
      transition: opacity 600ms var(--ease);
      white-space: nowrap;
    }

    body.is-settled .hint,
    body.is-ui-hidden .hint { opacity: 0; }

    body.is-ui-hidden .mast,
    body.is-ui-hidden .rack { opacity: 0; pointer-events: none; }

    .brush {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--brush, #e4451a) 0%, transparent 68%);
      mix-blend-mode: screen;
      opacity: 0;
      transform: translate3d(-40px, -40px, 0);
      will-change: transform, opacity;
    }

    body.is-drawing .brush { opacity: 0.85; }
    body.is-coarse .brush { display: none; }

    .print {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 6vh 6vw;
      background: rgba(6, 4, 6, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms var(--ease);
    }

    .print.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: min(920px, 100%);
      max-height: 88vh;
      padding: 18px 18px 16px;
      background: #efe4d2;
      color: #2a1c14;
      border-radius: 4px 4px 10px 10px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        0 0 0 1px rgba(80, 50, 30, 0.18);
      transform: translateY(18px);
      transition: transform 420ms var(--ease);
    }

    .print.is-open .sheet { transform: translateY(0); }

    .sheet canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #e7d8c0;
      border-radius: 2px;
    }

    .sheet footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      font-family: Palatino, "Palatino Linotype", "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sheet button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #6a4a38;
      font: 600 11px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 32px;
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--ink-dim);
      font-size: 15px;
    }

    button:focus-visible,
    input:focus-visible,
    .well-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    @media (max-width: 720px), (orientation: portrait) {
      .mast { max-width: calc(100% - 32px); }
      h1 { letter-spacing: 0.16em; }
      .lede { max-width: 34ch; }
      .rack {
        left: var(--safe-l);
        right: var(--safe-r);
        align-items: stretch;
      }
      .panel { width: 100%; }
      .wells { justify-content: space-between; }
      .tools { justify-content: space-between; }
      .sliders { grid-template-columns: auto 1fr; width: 100%; }
      .hint { bottom: auto; top: calc(var(--safe-t) + 92px); }
    }

    @media (max-width: 420px) {
      .well-btn { width: 38px; height: 38px; }
      .lede { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
      .brush { display: none; }
    }

    @media (forced-colors: active) {
      .panel, .tools button, .sheet {
        background: Canvas;
        color: CanvasText;
        border: 1px solid CanvasText;
        backdrop-filter: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="well" aria-label="Pigment cistern. Drag to stir color through the well."></canvas>
  <div class="brush" id="brush" aria-hidden="true"></div>

  <header class="mast">
    <p class="eyebrow">Wet pigment</p>
    <h1>Cinnabar</h1>
    <p class="lede">A cistern of living ink. Drag to stir. Leave it, and the tide still turns.</p>
  </header>

  <aside class="rack" aria-label="Pigments and well controls">
    <div class="panel">
      <ul class="wells" id="wells"></ul>
    </div>
    <div class="panel tools">
      <div class="sliders">
        <label for="viscosity">Body</label>
        <input id="viscosity" type="range" min="0" max="100" value="42" aria-valuetext="Medium body">
        <label for="bloom">Glow</label>
        <input id="bloom" type="range" min="0" max="100" value="62">
      </div>
      <button type="button" id="pauseBtn" aria-pressed="false">Pause</button>
      <button type="button" id="liftBtn">Lift print</button>
      <button type="button" id="clearBtn">Drain</button>
    </div>
  </aside>

  <p class="hint" id="hint">Drag to stir · keys 1–6 load pigment</p>

  <div class="print" id="print" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="printTitle">
      <canvas id="sheetCanvas" width="1024" height="1024"></canvas>
      <footer>
        <span id="printTitle">Cinnabar · lifted print</span>
        <button type="button" id="closePrint">Return to well</button>
      </footer>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">Cinnabar needs JavaScript to stir the well.</p></noscript>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("well");
    const brushEl = document.getElementById("brush");
    const wellsEl = document.getElementById("wells");
    const statusEl = document.getElementById("status");
    const printEl = document.getElementById("print");
    const sheetCanvas = document.getElementById("sheetCanvas");
    const pauseBtn = document.getElementById("pauseBtn");
    const liftBtn = document.getElementById("liftBtn");
    const clearBtn = document.getElementById("clearBtn");
    const visSlider = document.getElementById("viscosity");
    const bloomSlider = document.getElementById("bloom");

    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const coarse = matchMedia("(pointer: coarse)").matches;
    if (coarse) document.body.classList.add("is-coarse");

    const PIGMENTS = [
      { id: "vermilion", name: "Vermilion", hdr: [1.9, 0.16, 0.04], css: "#e4451a" },
      { id: "madder", name: "Rose madder", hdr: [1.55, 0.07, 0.4], css: "#d42b68" },
      { id: "gamboge", name: "Gamboge", hdr: [1.72, 0.94, 0.1], css: "#f0b400" },
      { id: "phthalo", name: "Phthalo", hdr: [0.05, 0.55, 1.55], css: "#1a7cff" },
      { id: "ultramarine", name: "Ultramarine", hdr: [0.28, 0.12, 1.42], css: "#3c2ad0" },
      { id: "water", name: "Water", hdr: [0, 0, 0], css: "#c5d4de", erase: true }
    ];

    let pigmentIndex = 0;
    let paused = false;
    let uiHidden = false;
    let settled = reduced;
    let drainFrames = 0;
    let liftArmed = false;
    let printCount = 0;
    let lastFocus = null;

    const pointer = {
      down: false,
      moved: false,
      x: 0.5,
      y: 0.5,
      px: 0.5,
      py: 0.5,
      cx: 0,
      cy: 0,
      id: null
    };

    function announce(msg) {
      statusEl.textContent = msg;
    }

    function setBrushColor() {
      const p = PIGMENTS[pigmentIndex];
      document.body.style.setProperty("--brush", p.css);
      brushEl.style.setProperty("--brush", p.css);
    }

    PIGMENTS.forEach((p, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "well-btn" + (p.erase ? " water" : "");
      btn.style.setProperty("--pigment", p.css);
      btn.setAttribute("aria-label", p.name);
      btn.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      btn.title = p.name + " (" + (i + 1) + ")";
      btn.addEventListener("click", () => selectPigment(i));
      li.appendChild(btn);
      wellsEl.appendChild(li);
    });

    function selectPigment(i) {
      pigmentIndex = i;
      wellsEl.querySelectorAll("button").forEach((b, n) => {
        b.setAttribute("aria-pressed", n === i ? "true" : "false");
      });
      setBrushColor();
      announce(PIGMENTS[i].name + " loaded");
    }

    setBrushColor();

    const VERT = `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

    function compile(gl, type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s);
        gl.deleteShader(s);
        throw new Error(log);
      }
      return s;
    }

    function program(gl, fs) {
      const p = gl.createProgram();
      const v = compile(gl, gl.VERTEX_SHADER, VERT);
      const f = compile(gl, gl.FRAGMENT_SHADER, fs);
      gl.attachShader(p, v);
      gl.attachShader(p, f);
      gl.linkProgram(p);
      gl.deleteShader(v);
      gl.deleteShader(f);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(p));
      }
      const loc = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const u = gl.getActiveUniform(p, i);
        loc[u.name] = gl.getUniformLocation(p, u.name);
      }
      return { p, loc };
    }

    function frag(body) {
      return `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
${body}`;
    }

    function createGL() {
      const gl = canvas.getContext("webgl2", {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: "high-performance",
        preserveDrawingBuffer: false,
        desynchronized: true
      });
      if (!gl) return null;
      if (!gl.getExtension("EXT_color_buffer_float")) return null;
      gl.getExtension("OES_texture_float_linear");
      gl.getExtension("EXT_float_blend");
      return gl;
    }

    function makeFBO(gl, w, h, internal, format, type, filter) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      if (!ok) {
        gl.deleteFramebuffer(fbo);
        gl.deleteTexture(tex);
        return null;
      }
      return {
        tex, fbo, w, h,
        texel: [1 / w, 1 / h]
      };
    }

    function makeDouble(gl, w, h, internal, format, type, filter) {
      const a = makeFBO(gl, w, h, internal, format, type, filter);
      const b = makeFBO(gl, w, h, internal, format, type, filter);
      if (!a || !b) return null;
      return {
        read: a,
        write: b,
        swap() {
          const t = this.read;
          this.read = this.write;
          this.write = t;
        }
      };
    }

    function bindTex(gl, unit, tex) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
    }

    const gl = createGL();
    let sim = null;
    let cpu = null;

    if (gl) {
      try {
        sim = buildSim(gl);
      } catch (err) {
        sim = null;
      }
    }
    if (!sim) cpu = buildCPU();

    function buildSim(gl) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);
      gl.clearColor(0, 0, 0, 1);

      const splatP = program(gl, frag(`
uniform sampler2D uTarget;
uniform vec3 uColor;
uniform vec2 uPoint;
uniform float uAspect;
uniform float uRadius;
uniform float uErase;
void main() {
  vec2 p = vUv - uPoint;
  p.x *= uAspect;
  float g = exp(-dot(p, p) / max(uRadius, 1e-6));
  vec4 base = texture(uTarget, vUv);
  if (uErase > 0.5) {
    fragColor = vec4(base.rgb * (1.0 - g * 0.85), 1.0);
  } else {
    float knee = exp(-dot(base.rgb, vec3(0.22, 0.54, 0.08)) * 0.55);
    fragColor = vec4(base.rgb + uColor * g * knee, 1.0);
  }
}`));

      const advectP = program(gl, frag(`
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 uTexel;
uniform float uDt;
uniform float uDissipation;
void main() {
  vec2 vel = texture(uVelocity, vUv).xy;
  vec2 coord = vUv - uDt * vel * uTexel * 256.0;
  fragColor = uDissipation * texture(uSource, coord);
}`));

      const curlP = program(gl, frag(`
uniform sampler2D uVelocity;
uniform vec2 uTexel;
void main() {
  float L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).y;
  float R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).y;
  float B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).x;
  float T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).x;
  fragColor = vec4(0.5 * (R - L - (T - B)), 0.0, 0.0, 1.0);
}`));

      const vortP = program(gl, frag(`
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform vec2 uTexel;
uniform float uCurlAmt;
uniform float uDt;
void main() {
  float L = texture(uCurl, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uCurl, vUv + vec2(uTexel.x, 0.0)).x;
  float B = texture(uCurl, vUv - vec2(0.0, uTexel.y)).x;
  float T = texture(uCurl, vUv + vec2(0.0, uTexel.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  float len = length(force) + 1e-5;
  force = uCurlAmt * C * force / len;
  vec2 vel = texture(uVelocity, vUv).xy;

uniform sampler2D uTexture;

uniform sampler2D uDye;
uniform sampler2D uVelocity;
uniform sampler2D uBloom;
uniform vec2 uTexel;
uniform vec2 uAspect;
uniform float uRadius;
uniform float uTime;
uniform float uBloomAmt;

  float hR = luma(texture(uDye, vUv + vec2(uTexel.x * 1.5, 0.0)).rgb);
  float hD = luma(texture(uDye, vUv - vec2(0.0, uTexel.y * 1.5)).rgb);

      const state = {
        gl, vao,

          dyeW = Math.round(dyeRes * aspect);

          simH = Math.round(simRes / aspect);

    function buildCPU() {

      const v = new Float32Array(N2);

      const IX = (x, y) => y * N + x;

      function setBnd(b, x) {

          x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
          x[IX(i, N - 1)] = b === 2 ? -x[IX(i, N - 2)] : x[IX(i, N - 2)];
          x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
          x[IX(N - 1, i)] = b === 1 ? -x[IX(N - 2, i)] : x[IX(N - 2, i)];

        x[IX(0, N - 1)] = 0.5 * (x[IX(1, N - 1)] + x[IX(0, N - 2)]);

        x[IX(N - 1, N - 1)] = 0.5 * (x[IX(N - 2, N - 1)] + x[IX(N - 1, N - 2)]);

                x[IX(i - 1, j)] + x[IX(i + 1, j)] + x[IX(i, j - 1)] + x[IX(i, j + 1)]

            if (x > N - 1.5) x = N - 1.5;
            if (y < 0.5) y = 0.5;
            if (y > N - 1.5) y = N - 1.5;
            const i0 = Math.floor(x);
            const i1 = i0 + 1;
            const j0 = Math.floor(y);
            const j1 = j0 + 1;
            const s1 = x - i0;
            const s0 = 1 - s1;
            const t1 = y - j0;
            const t0 = 1 - t1;
            d[IX(i, j)] =
              s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
              s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
          }
        }
        setBnd(b, d);
      }

      function splat(x, y, dx, dy, color, radius, erase) {
        const cx = x * (N - 1);
        const cy = y * (N - 1);
        const rad = Math.max(2.2, radius * N * 18);
        const r2 = rad * rad;
        for (let j = 1; j < N - 1; j++) {
          for (let i = 1; i < N - 1; i++) {
            const ddx = i - cx;
            const ddy = j - cy;
            const d2 = ddx * ddx + ddy * ddy;
            if (d2 > r2 * 4) continue;
            const g = Math.exp(-d2 / r2);
            const id = IX(i, j);
            u[id] += dx * g * 0.12;
            v[id] += dy * g * 0.12;
            if (erase) {
              dR[id] *= 1 - g * 0.85;
              dG[id] *= 1 - g * 0.85;
              dB[id] *= 1 - g * 0.85;
            } else {
              dR[id] += color[0] * g;
              dG[id] += color[1] * g;
              dB[id] += color[2] * g;
            }
          }
        }
      }

      function step(dt) {
        const visc = 0.00008 + Number(visSlider.value) / 100 * 0.0004;
        u0.set(u);
        v0.set(v);
        diffuse(1, u, u0, visc, dt);
        diffuse(2, v, v0, visc, dt);
        project();
        u0.set(u);
        v0.set(v);
        advect(1, u, u0, u0, v0, dt);
        advect(2, v, v0, u0, v0, dt);
        project();
        r0.set(dR);
        g0.set(dG);
        b0.set(dB);
        const diss = drainFrames > 0 ? 0.9 : 0.995;
        advect(0, dR, r0, u, v, dt);
        advect(0, dG, g0, u, v, dt);
        advect(0, dB, b0, u, v, dt);
        for (let i = 0; i < N2; i++) {
          dR[i] *= diss;
          dG[i] *= diss;
          dB[i] *= diss;
        }
        if (drainFrames > 0) drainFrames -= 1;
      }

      function render() {
        const dpr = Math.min(devicePixelRatio || 1, 1.5);
        const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        const data = img.data;
        for (let j = 0; j < N; j++) {
          for (let i = 0; i < N; i++) {
            const id = IX(i, j);
            const o = (j * N + i) * 4;
            const rr = dR[id];
            const gg = dG[id];
            const bb = dB[id];
            data[o] = Math.min(255, (0.03 + rr / (1 + rr * 0.4)) * 255);
            data[o + 1] = Math.min(255, (0.04 + gg / (1 + gg * 0.4)) * 255);
            data[o + 2] = Math.min(255, (0.06 + bb / (1 + bb * 0.4)) * 255);
            data[o + 3] = 255;
          }
        }
        ctx.fillStyle = "#0a0809";
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        const side = Math.min(w, h) * 0.92;
        const ox = (w - side) / 2;
        const oy = (h - side) / 2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, side / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(imgToCanvas(img), ox, oy, side, side);
        ctx.restore();
      }

      const tmp = document.createElement("canvas");
      tmp.width = N;
      tmp.height = N;
      const tctx = tmp.getContext("2d");
      function imgToCanvas(imageData) {
        tctx.putImageData(imageData, 0, 0);
        return tmp;
      }

      return { splat, step, render, resize() {}, kind: "cpu" };
    }

    const engine = sim || cpu;

    function inWell(x, y) {
      const aspect = canvas.clientWidth / canvas.clientHeight;
      const ax = aspect > 1 ? aspect : 1;
      const ay = aspect > 1 ? 1 : 1 / aspect;
      const px = (x - 0.5) * ax;
      const py = (y - 0.5) * ay;
      return Math.hypot(px, py) < 0.47;
    }

    function drop(x, y, color, erase) {
      if (!inWell(x, y) && !erase) return;
      const force = 900;
      engine.splat(x, y, 0, 0, color, 0.00055, erase);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        engine.splat(
          x + Math.cos(a) * 0.008,
          y + Math.sin(a) * 0.008,
          Math.cos(a) * force,
          Math.sin(a) * force,
          [0, 0, 0],
          0.00028,
          false
        );
      }
    }

    function stir(x, y, dx, dy, color, erase) {
      const force = 4200;
      engine.splat(x, y, dx * force, dy * force, color, erase ? 0.0007 : 0.00032, erase);
    }

    function seed() {
      const drops = [
        { x: 0.46, y: 0.52, c: PIGMENTS[0].hdr, dx: 18, dy: -8 },
        { x: 0.58, y: 0.47, c: PIGMENTS[3].hdr, dx: -14, dy: 12 },
        { x: 0.51, y: 0.6, c: PIGMENTS[2].hdr, dx: 6, dy: -16 },
        { x: 0.42, y: 0.44, c: PIGMENTS[1].hdr, dx: 10, dy: 9 },
        { x: 0.57, y: 0.58, c: PIGMENTS[4].hdr, dx: -11, dy: -7 }
      ];
      drops.forEach((d) => {
        drop(d.x, d.y, d.c, false);
        stir(d.x, d.y, d.dx, d.dy, d.c, false);
      });
    }

    seed();

    let lastT = performance.now();
    let hidden = document.hidden;
    let lastInput = 0;
    let startT = performance.now();
    let introStep = reduced ? 99 : 0;
    let ambientT = 0;

    document.addEventListener("visibilitychange", () => {
      hidden = document.hidden;
      lastT = performance.now();
    });

    function uvFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) / rect.width,
        y: 1 - (e.clientY - rect.top) / rect.height,
        cx: e.clientX,
        cy: e.clientY
      };
    }

    function currentColor() {
      return PIGMENTS[pigmentIndex];
    }

    function onPointerDown(e) {
      if (printEl.classList.contains("is-open")) return;
      if (e.target.closest(".rack, .print")) return;
      canvas.setPointerCapture(e.pointerId);
      const uv = uvFromEvent(e);
      pointer.down = true;
      pointer.moved = false;
      pointer.id = e.pointerId;
      pointer.x = pointer.px = uv.x;
      pointer.y = pointer.py = uv.y;
      pointer.cx = uv.cx;
      pointer.cy = uv.cy;
      document.body.classList.add("is-drawing");
      const p = currentColor();
      drop(uv.x, uv.y, p.hdr, !!p.erase);
      lastInput = performance.now();
      settle();
    }

    function onPointerMove(e) {
      const uv = uvFromEvent(e);
      pointer.cx = uv.cx;
      pointer.cy = uv.cy;
      brushEl.style.transform = "translate3d(" + uv.cx + "px," + uv.cy + "px,0)";
      if (!pointer.down || pointer.id !== e.pointerId) return;
      const dx = uv.x - pointer.x;
      const dy = uv.y - pointer.y;
      if (Math.hypot(dx, dy) < 0.0004) return;
      pointer.moved = true;
      const steps = Math.min(8, 1 + Math.floor(Math.hypot(dx, dy) * 80));
      const p = currentColor();
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        stir(pointer.x + dx * t, pointer.y + dy * t, dx, dy, p.hdr, !!p.erase);
      }
      pointer.x = uv.x;
      pointer.y = uv.y;
      lastInput = performance.now();
    }

    function onPointerUp(e) {
      if (pointer.id !== e.pointerId) return;
      pointer.down = false;
      pointer.id = null;
      document.body.classList.remove("is-drawing");
    }

    window.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("pointermove", () => {
      if (!settled) brushEl.style.opacity = "0.7";
    }, { once: true });

    function settle() {
      if (settled) return;
      settled = true;
      document.body.classList.add("is-settled");
    }

    setTimeout(settle, reduced ? 0 : 5200);

    function togglePause() {
      paused = !paused;
      pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
      pauseBtn.textContent = paused ? "Resume" : "Pause";
      announce(paused ? "Well paused" : "Well running");
    }

    function drain() {
      drainFrames = 48;
      announce("Draining the cistern");
    }

    function closePrint() {
      printEl.classList.remove("is-open");
      printEl.hidden = true;
      if (lastFocus) lastFocus.focus();
    }

    function liftPrint() {
      liftArmed = true;
      lastFocus = document.activeElement;
    }

    function showPrint() {
      printCount += 1;
      const paper = sheetCanvas.getContext("2d");
      const size = 1024;
      sheetCanvas.width = size;
      sheetCanvas.height = size;
      paper.fillStyle = "#eadcc6";
      paper.fillRect(0, 0, size, size);
      const grain = paper.createImageData(size, size);
      for (let i = 0; i < grain.data.length; i += 4) {
        const n = 214 + Math.random() * 28;
        grain.data[i] = n;
        grain.data[i + 1] = n - 10;
        grain.data[i + 2] = n - 22;
        grain.data[i + 3] = 255;
      }
      paper.putImageData(grain, 0, 0);
      paper.save();
      paper.globalCompositeOperation = "multiply";
      paper.filter = "contrast(1.12) saturate(0.92)";
      const side = Math.min(canvas.width, canvas.height);
      const sx = (canvas.width - side) / 2;
      const sy = (canvas.height - side) / 2;
      paper.drawImage(canvas, sx, sy, side, side, 48, 48, size - 96, size - 96);
      paper.restore();
      paper.strokeStyle = "rgba(80,50,30,0.18)";
      paper.strokeRect(48.5, 48.5, size - 97, size - 97);
      document.getElementById("printTitle").textContent =
        "Cinnabar · print " + String(printCount).padStart(2, "0");
      printEl.hidden = false;
      requestAnimationFrame(() => printEl.classList.add("is-open"));
      document.getElementById("closePrint").focus();
      announce("Print lifted from the well");
    }

    pauseBtn.addEventListener("click", togglePause);
    clearBtn.addEventListener("click", drain);
    liftBtn.addEventListener("click", liftPrint);
    document.getElementById("closePrint").addEventListener("click", closePrint);
    printEl.addEventListener("click", (e) => {
      if (e.target === printEl) closePrint();
    });

    visSlider.addEventListener("input", () => {
      const v = Number(visSlider.value);
      const label = v < 34 ? "Thin" : v < 66 ? "Medium body" : "Heavy body";
      visSlider.setAttribute("aria-valuetext", label);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && printEl.classList.contains("is-open")) {
        e.preventDefault();
        closePrint();
        return;
      }
      if (e.target.matches("input, textarea, button")) {
        if (e.key === " ") return;
      }
      if (e.key >= "1" && e.key <= "6") {
        selectPigment(Number(e.key) - 1);
        return;
      }
      if (e.key === " ") {
        e.preventDefault();
        togglePause();
      } else if (e.key === "c" || e.key === "C") {
        drain();
      } else if (e.key === "l" || e.key === "L") {
        liftPrint();
      } else if (e.key === "h" || e.key === "H") {
        uiHidden = !uiHidden;
        document.body.classList.toggle("is-ui-hidden", uiHidden);
      }
    });

    window.addEventListener("resize", () => engine.resize());

    function intro(now) {
      const t = (now - startT) / 1000;
      if (introStep < 1 && t > 0.35) {
        drop(0.45, 0.51, PIGMENTS[0].hdr, false);
        introStep = 1;
      } else if (introStep < 2 && t > 0.85) {
        drop(0.58, 0.48, PIGMENTS[3].hdr, false);
        introStep = 2;
      } else if (introStep < 3 && t > 1.35) {
        drop(0.52, 0.61, PIGMENTS[2].hdr, false);
        introStep = 3;
      } else if (introStep < 4 && t > 1.85) {
        stir(0.5, 0.5, 22, -10, PIGMENTS[1].hdr, false);
        introStep = 4;
      }
    }

    function ambient(now, dt) {
      if (reduced) return;
      if (now - lastInput < 2200) return;
      ambientT += dt;
      const a = now * 0.00022;
      const rx = 0.5 + Math.cos(a) * 0.12;
      const ry = 0.5 + Math.sin(a * 0.85) * 0.1;
      engine.splat(rx, ry, -Math.sin(a) * 180, Math.cos(a) * 180, [0, 0, 0], 0.0002, false);
      if (ambientT > 4.5 + Math.sin(now * 0.0003) * 1.2) {
        ambientT = 0;
        const p = PIGMENTS[Math.floor(Math.random() * 5)];
        const ang = now * 0.0007;
        drop(0.5 + Math.cos(ang) * 0.14, 0.5 + Math.sin(ang * 1.3) * 0.11, p.hdr, false);
      }
    }

    function frame(now) {
      const dt = Math.min(0.033, (now - lastT) / 1000);
      lastT = now;
      if (!hidden) {
        if (!paused) {
          intro(now);
          ambient(now, dt);
          engine.step(dt);
        }
        engine.render(now / 1000);
        if (liftArmed) {
          liftArmed = false;
          showPrint();
        }
      }
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
