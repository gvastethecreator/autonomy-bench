<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Iriswell — chromatic fluid ink</title>
  <style>
    :root {
      --ink: #f3eee6;
      --muted: #b7b0a4;
      --accent: #8af0dc;
      --glass: rgba(8, 10, 16, 0.58);
      --stroke: rgba(255, 255, 255, 0.14);
      --focus: #f0c27a;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
      --sans: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --serif: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #05060a;
      color: var(--ink);
      font-family: var(--sans);
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    canvas#fluid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
      background: #05060a;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    header.brand {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      max-width: min(42ch, calc(100% - 9rem));
    }

    header.brand h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2rem, 4.4vw, 3.4rem);
      letter-spacing: 0.12em;
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }

    header.brand p {
      margin: 0.55rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    .meta {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      text-align: right;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .meta strong {
      display: block;
      color: var(--ink);
      font-weight: 600;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    .dock {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      pointer-events: auto;
      width: min(920px, calc(100% - 24px));
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1rem;
      align-items: end;
      padding: 0.85rem 1rem;
      background: var(--glass);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .actions, .sliders, .palettes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .sliders {
      flex: 1 1 280px;
      gap: 0.85rem 1.1rem;
    }

    button, summary {
      font: inherit;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 0.42rem 0.9rem;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    button:hover, summary:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    button[aria-pressed="true"] {
      background: color-mix(in oklab, var(--accent) 28%, transparent);
      border-color: color-mix(in oklab, var(--accent) 55%, white 10%);
      color: #e9fff9;
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible,
    .swatch input:focus-visible + span {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    label.slider {
      display: grid;
      gap: 0.2rem;
      min-width: 120px;
      flex: 1 1 120px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    label.slider span.value {
      color: var(--ink);
      letter-spacing: 0.04em;
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0.35rem 0 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink);
      border: 0;
      box-shadow: 0 0 0 4px rgba(138, 240, 220, 0.18);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink);
      border: 0;
    }

    fieldset.palettes {
      border: 0;
      margin: 0;
      padding: 0;
      gap: 0.45rem;
    }

    fieldset.palettes legend {
      padding: 0;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .swatch {
      position: relative;
      width: 28px;
      height: 28px;
    }

    .swatch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    .swatch span {
      display: block;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.35);
    }

    .swatch input:checked + span {
      border-color: white;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.35);
    }

    .aurora span { background: conic-gradient(#5eead4, #a78bfa, #f5d07a, #5eead4); }
    .magma span { background: conic-gradient(#fb7185, #f97316, #facc15, #fb7185); }
    .ocean span { background: conic-gradient(#22d3ee, #2563eb, #34d399, #22d3ee); }
    .neon span { background: conic-gradient(#f472b6, #22d3ee, #a3e635, #f472b6); }

    details.keys {
      pointer-events: auto;
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
    }

    details.keys[open] {
      background: var(--glass);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 0.4rem 0.7rem 0.7rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    details.keys summary {
      list-style: none;
    }

    details.keys summary::-webkit-details-marker { display: none; }

    details.keys ul {
      margin: 0.55rem 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.55;
    }

    kbd {
      display: inline-block;
      min-width: 1.4em;
      padding: 0 0.3em;
      border: 1px solid var(--stroke);
      border-radius: 5px;
      color: var(--ink);
      font: 0.75rem ui-monospace, SFMono-Regular, monospace;
      text-align: center;
    }

    .fail {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
      z-index: 5;
    }

    @media (max-width: 720px) {
      .dock {
        width: calc(100% - 16px);
        border-radius: 16px;
        gap: 0.65rem;
      }

      details.keys {
        display: none;
      }

      header.brand p { font-size: 0.84rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dock, button { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="fluid" role="img" aria-label="Colorful fluid ink. Drag to stir."></canvas>

  <div class="hud">
    <header class="brand">
      <h1>Iriswell</h1>
      <p>Stir the ink. Color shears into a spectrum as it turns.</p>
    </header>

    <div class="meta">
      <strong id="fps">— fps</strong>
      <span id="backend">booting</span>
    </div>

    <form class="dock" id="controls" aria-label="Fluid controls">
      <div class="actions">
        <button type="button" id="pauseBtn" aria-pressed="false">Pause</button>
        <button type="button" id="clearBtn">Clear</button>
        <button type="button" id="burstBtn">Burst</button>
        <button type="button" id="autoBtn" aria-pressed="true">Auto drip</button>
      </div>

      <div class="sliders">
        <label class="slider">Thickness <span class="value" id="thickVal">0.45</span>
          <input id="thick" type="range" min="0" max="100" value="45" aria-valuetext="medium viscosity">
        </label>
        <label class="slider">Splatter <span class="value" id="splatVal">0.55</span>
          <input id="splat" type="range" min="0" max="100" value="55">
        </label>
        <label class="slider">Swirl <span class="value" id="swirlVal">0.70</span>
          <input id="swirl" type="range" min="0" max="100" value="70">
        </label>
        <label class="slider">Glow <span class="value" id="glowVal">0.60</span>
          <input id="glow" type="range" min="0" max="100" value="60">
        </label>
      </div>

      <fieldset class="palettes">
        <legend>Palette</legend>
        <label class="swatch aurora"><input type="radio" name="palette" value="aurora" checked><span></span><span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Aurora</span></label>
        <label class="swatch magma"><input type="radio" name="palette" value="magma"><span></span><span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Magma</span></label>
        <label class="swatch ocean"><input type="radio" name="palette" value="ocean"><span></span><span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Ocean</span></label>
        <label class="swatch neon"><input type="radio" name="palette" value="neon"><span></span><span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Neon</span></label>
      </fieldset>
    </form>

    <details class="keys">
      <summary>Keys</summary>
      <ul>
        <li><kbd>Space</kbd> pause</li>
        <li><kbd>C</kbd> clear · <kbd>B</kbd> burst</li>
        <li><kbd>A</kbd> auto drip</li>
        <li><kbd>1</kbd>–<kbd>4</kbd> palettes</li>
        <li>Arrows stir from the center</li>
      </ul>
    </details>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById("fluid");
    const fpsEl = document.getElementById("fps");
    const backendEl = document.getElementById("backend");
    const pauseBtn = document.getElementById("pauseBtn");
    const clearBtn = document.getElementById("clearBtn");
    const burstBtn = document.getElementById("burstBtn");
    const autoBtn = document.getElementById("autoBtn");
    const thickInput = document.getElementById("thick");
    const splatInput = document.getElementById("splat");
    const swirlInput = document.getElementById("swirl");
    const glowInput = document.getElementById("glow");

    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const state = {
      paused: false,
      auto: !reduced,
      palette: "aurora",
      thickness: 0.45,
      splat: 0.55,
      swirl: 0.7,
      glow: 0.6,
      time: 0
    };

    autoBtn.setAttribute("aria-pressed", String(state.auto));

    const PALETTES = {
      aurora: [172, 286, 46],
      magma: [8, 26, 40],
      ocean: [192, 218, 158],
      neon: [318, 186, 96]
    };

    function hsv(h, s, v) {
      h = ((h % 360) + 360) % 360 / 60;
      const c = v * s;
      const x = c * (1 - Math.abs(h % 2 - 1));
      const m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 1) { r = c; g = x; }
      else if (h < 2) { r = x; g = c; }
      else if (h < 3) { g = c; b = x; }
      else if (h < 4) { g = x; b = c; }
      else if (h < 5) { r = x; b = c; }
      else { r = c; b = x; }
      return [r + m, g + m, b + m];
    }

    function inkColor(t, angle, speed) {
      const hues = PALETTES[state.palette];
      const pick = hues[Math.floor((t * 0.27 + speed * 2) % hues.length)];
      const h = pick + Math.sin(t * 0.7 + angle * 2) * 16 + speed * 12;
      const s = 0.78 + Math.min(speed, 1) * 0.18;
      const v = 0.62 + Math.min(speed, 1.4) * 0.55;
      return hsv(h, s, v);
    }

    function format01(v) { return v.toFixed(2); }

    function syncLabels() {
      document.getElementById("thickVal").textContent = format01(state.thickness);
      document.getElementById("splatVal").textContent = format01(state.splat);
      document.getElementById("swirlVal").textContent = format01(state.swirl);
      document.getElementById("glowVal").textContent = format01(state.glow);
    }
    syncLabels();

    thickInput.addEventListener("input", () => {
      state.thickness = thickInput.value / 100;
      syncLabels();
    });
    splatInput.addEventListener("input", () => {
      state.splat = splatInput.value / 100;
      syncLabels();
    });
    swirlInput.addEventListener("input", () => {
      state.swirl = swirlInput.value / 100;
      syncLabels();
    });
    glowInput.addEventListener("input", () => {
      state.glow = glowInput.value / 100;
      syncLabels();
    });

    document.querySelectorAll("input[name=palette]").forEach((el) => {
      el.addEventListener("change", () => {
        if (el.checked) state.palette = el.value;
      });
    });

    function setPaused(p) {
      state.paused = p;
      pauseBtn.setAttribute("aria-pressed", String(p));
      pauseBtn.textContent = p ? "Play" : "Pause";
    }

    function setAuto(a) {
      state.auto = a;
      autoBtn.setAttribute("aria-pressed", String(a));
    }

    const pointers = new Map();

    function uvFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = 1 - (e.clientY - rect.top) / rect.height;
      return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
    }

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      const uv = uvFromEvent(e);
      pointers.set(e.pointerId, { ...uv, px: uv.x, py: uv.y, down: true, moved: false });
    });
    canvas.addEventListener("pointermove", (e) => {
      const p = pointers.get(e.pointerId);
      if (!p || !p.down) return;
      const uv = uvFromEvent(e);
      p.px = p.x; p.py = p.y;
      p.x = uv.x; p.y = uv.y;
      p.moved = true;
    });
    function endPointer(e) {
      const p = pointers.get(e.pointerId);
      if (p) p.down = false;
      pointers.delete(e.pointerId);
    }
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);
    canvas.addEventListener("lostpointercapture", endPointer);

    function compile(gl, vsSrc, fsSrc) {
      function sh(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(s) || "shader");
        }
        return s;
      }
      const p = gl.createProgram();
      gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc));
      gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
      gl.bindAttribLocation(p, 0, "aPos");
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(p) || "link");
      }
      const uniforms = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        uniforms[info.name] = gl.getUniformLocation(p, info.name);
      }
      return { program: p, uniforms };
    }

    function createGL() {
      const gl = canvas.getContext("webgl2", {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance"
      });
      if (!gl) return null;
      gl.getExtension("EXT_color_buffer_float");
      gl.getExtension("EXT_color_buffer_half_float");
      gl.getExtension("OES_texture_float_linear");
      gl.getExtension("OES_texture_half_float_linear");

      const candidates = [
        { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT, filter: gl.LINEAR },
        { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT, filter: gl.NEAREST },
        { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT, filter: gl.LINEAR },
        { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT, filter: gl.NEAREST }
      ];

      function testFormat(c) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, c.filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, c.filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, c.internal, 8, 8, 0, c.format, c.type, null);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(fb);
        gl.deleteTexture(tex);
        return ok;
      }

      const fmt = candidates.find(testFormat);
      if (!fmt) return null;
      return { gl, fmt };
    }

    const boot = createGL();

    function getRes(base, w, h) {
      const aspect = w / h;
      if (aspect > 1) return { w: Math.round(base * aspect), h: base };
      return { w: base, h: Math.round(base / aspect) };
    }

    if (boot) {
      runGPU(boot.gl, boot.fmt);
    } else {
      runCPU();
    }

    function runGPU(gl, fmt) {
      backendEl.textContent = "gpu fluid";
      const VS = `#version 300 es
        precision highp float;
        layout(location=0) in vec2 aPos;
        out vec2 vUv;
        void main(){
          vUv = aPos * 0.5 + 0.5;
          gl_Position = vec4(aPos, 0.0, 1.0);
        }`;

      const FS_CLEAR = `#version 300 es
        precision highp float;
        uniform vec4 uColor;
        out vec4 fragColor;
        void main(){ fragColor = uColor; }`;

      const FS_DISPLAY = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uDye;
        uniform sampler2D uVelocity;
        uniform float uGlow;
        uniform float uTime;
        out vec4 fragColor;
        void main(){
          vec2 vel = texture(uVelocity, vUv).xy;
          vec2 uv = vUv + vel * 0.012;
          vec3 c = texture(uDye, uv).rgb;
          vec3 bloom = vec3(0.0);
          for (int i = 0; i < 8; i++) {
            float a = float(i) * 0.785398;
            vec2 o = vec2(cos(a), sin(a)) * 0.0075;
            bloom += texture(uDye, uv + o).rgb;
          }
          bloom *= 0.125;
          c += bloom * bloom * uGlow * 1.35;
          float lum = dot(c, vec3(0.299, 0.587, 0.114));
          vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + lum * 1.4 + uTime * 0.04));
          c += irid * smoothstep(0.12, 0.85, lum) * 0.14;
          c = c / (1.0 + c);
          c = pow(max(c, 0.0), vec3(0.92));
          vec3 bg = vec3(0.02, 0.024, 0.045);
          float amt = smoothstep(0.0, 0.06, lum);
          vec3 col = mix(bg, c, amt);
          float vig = smoothstep(1.15, 0.28, length(vUv - 0.5));
          col *= mix(0.72, 1.0, vig);
          fragColor = vec4(col, 1.0);
        }`;

      const FS_SPLAT = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uTarget;
        uniform vec3 uColor;
        uniform vec2 uCenter;
        uniform float uRadius;
        uniform float uAspect;
        uniform float uAdd;
        out vec4 fragColor;
        void main(){
          vec4 base = texture(uTarget, vUv);
          vec2 p = vUv - uCenter;
          p.x *= uAspect;
          float infl = exp(-dot(p, p) / uRadius);
          vec3 mixed = uAdd > 0.5 ? base.rgb + uColor * infl : mix(base.rgb, uColor, infl);
          fragColor = vec4(mixed, 1.0);
        }`;

      const FS_ADVECT = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 uTexel;
        uniform float uDt;
        uniform float uDissipation;
        uniform float uChromatic;
        out vec4 fragColor;
        vec4 samp(sampler2D t, vec2 uv){
          uv = clamp(uv, uTexel, 1.0 - uTexel);
          return texture(t, uv);
        }
        void main(){
          vec2 vel = texture(uVelocity, vUv).xy;
          vec2 coord = vUv - uDt * vel;
          vec4 c;
          if (uChromatic > 0.5) {
            c.r = samp(uSource, vUv - uDt * vel * 1.045).r;
            c.g = samp(uSource, coord).g;
            c.b = samp(uSource, vUv - uDt * vel * 0.955).b;
            c.a = 1.0;
          } else {
            c = samp(uSource, coord);
          }
          fragColor = vec4(c.rgb * uDissipation, 1.0);
        }`;

      const FS_CURL = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uVelocity;
        uniform vec2 uTexel;
        out vec4 fragColor;
        void main(){
          vec2 L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).xy;
          vec2 R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).xy;
          vec2 B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).xy;
          vec2 T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).xy;
          float curl = R.y - L.y - T.x + B.x;
          fragColor = vec4(0.5 * curl, 0.0, 0.0, 1.0);
        }`;

      const FS_VORT = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uCurl;
        uniform vec2 uTexel;
        uniform float uVorticity;
        uniform float uDt;
        out vec4 fragColor;
        void main(){
          float L = texture(uCurl, vUv - vec2(uTexel.x, 0.0)).x;
          float R = texture(uCurl, vUv + vec2(uTexel.x, 0.0)).x;
          float B = texture(uCurl, vUv - vec2(0.0, uTexel.y)).x;
          float T = texture(uCurl, vUv + vec2(0.0, uTexel.y)).x;
          float C = texture(uCurl, vUv).x;
          vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
          float len = length(force) + 1e-6;
          force = force / len * C * uVorticity;
          vec2 vel = texture(uVelocity, vUv).xy;
          vel += force * uDt;
          vel *= 0.999;
          if (vUv.x < uTexel.x) vel.x = abs(vel.x);
          if (vUv.x > 1.0 - uTexel.x) vel.x = -abs(vel.x);
          if (vUv.y < uTexel.y) vel.y = abs(vel.y);
          if (vUv.y > 1.0 - uTexel.y) vel.y = -abs(vel.y);
          fragColor = vec4(vel, 0.0, 1.0);
        }`;

      const FS_DIV = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uVelocity;
        uniform vec2 uTexel;
        out vec4 fragColor;
        void main(){
          float L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).x;
          float R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).x;
          float B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).y;
          float T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).y;
          float div = 0.5 * (R - L + T - B);
          fragColor = vec4(div, 0.0, 0.0, 1.0);
        }`;

      const FS_PRESS = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uPressure;
        uniform sampler2D uDivergence;
        uniform vec2 uTexel;
        out vec4 fragColor;
        void main(){
          float L = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
          float R = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
          float B = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
          float T = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
          float div = texture(uDivergence, vUv).x;
          float p = (L + R + B + T - div) * 0.25;
          fragColor = vec4(p, 0.0, 0.0, 1.0);
        }`;

      const FS_GRAD = `#version 300 es
        precision highp float;
        in vec2 vUv;
        uniform sampler2D uPressure;
        uniform sampler2D uVelocity;
        uniform vec2 uTexel;
        out vec4 fragColor;
        void main(){
          float L = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
          float R = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
          float B = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
          float T = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
          vec2 vel = texture(uVelocity, vUv).xy;
          vel -= 0.5 * vec2(R - L, T - B);
          fragColor = vec4(vel, 0.0, 1.0);
        }`;

      const programs = {
        clear: compile(gl, VS, FS_CLEAR),
        display: compile(gl, VS, FS_DISPLAY),
        splat: compile(gl, VS, FS_SPLAT),
        advect: compile(gl, VS, FS_ADVECT),
        curl: compile(gl, VS, FS_CURL),
        vort: compile(gl, VS, FS_VORT),
        div: compile(gl, VS, FS_DIV),
        press: compile(gl, VS, FS_PRESS),
        grad: compile(gl, VS, FS_GRAD)
      };

      const quad = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      function createFBO(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, fmt.filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, fmt.filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, w, h, 0, fmt.format, fmt.type, null);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        gl.viewport(0, 0, w, h);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        return { tex, fbo, w, h, texel: [1 / w, 1 / h] };
      }

      function createDouble(w, h) {
        let a = createFBO(w, h);
        let b = createFBO(w, h);
        return {
          get read() { return a; },
          get write() { return b; },
          swap() { const t = a; a = b; b = t; },
          w, h
        };
      }

      let sim, dye, curl, divergence, pressure;
      let aspect = 1;

      function alloc() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
        canvas.width = w;
        canvas.height = h;
        aspect = w / h;
        const simBase = w < 900 ? 112 : 160;
        const dyeBase = w < 900 ? 320 : 512;
        const s = getRes(simBase, w, h);
        const d = getRes(dyeBase, w, h);
        sim = createDouble(s.w, s.h);
        dye = createDouble(d.w, d.h);
        curl = createFBO(s.w, s.h);
        divergence = createFBO(s.w, s.h);
        pressure = createDouble(s.w, s.h);
      }

      alloc();
      let lastW = canvas.clientWidth;
      let lastH = canvas.clientHeight;
      window.addEventListener("resize", () => {
        if (canvas.clientWidth !== lastW || canvas.clientHeight !== lastH) {
          lastW = canvas.clientWidth;
          lastH = canvas.clientHeight;
          alloc();
          seed();
        }
      });

      function use(mat) {
        gl.useProgram(mat.program);
        return mat.uniforms;
      }

      function blit(target) {
        if (target) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
          gl.viewport(0, 0, target.w, target.h);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        }
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      function bind(unit, tex) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, tex);
      }

      function splat(x, y, dx, dy, color, radiusMul) {
        const radius = (0.00035 + state.splat * 0.0028) * (radiusMul || 1);
        const aspectNow = canvas.width / canvas.height;
        let u = use(programs.splat);
        bind(0, sim.read.tex);
        gl.uniform1i(u.uTarget, 0);
        gl.uniform1f(u.uAspect, aspectNow);
        gl.uniform2f(u.uCenter, x, y);
        gl.uniform1f(u.uRadius, radius);
        gl.uniform1f(u.uAdd, 1);
        gl.uniform3f(u.uColor, dx, dy, 0);
        blit(sim.write);
        sim.swap();

        u = use(programs.splat);
        bind(0, dye.read.tex);
        gl.uniform1i(u.uTarget, 0);
        gl.uniform1f(u.uAspect, aspectNow);
        gl.uniform2f(u.uCenter, x, y);
        gl.uniform1f(u.uRadius, radius * 0.85);
        gl.uniform1f(u.uAdd, 1);
        gl.uniform3f(u.uColor, color[0] * 1.85, color[1] * 1.85, color[2] * 1.85);
        blit(dye.write);
        dye.swap();
      }

      function splatDrop(x, y, force, radiusMul) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 0.15 + Math.random() * 0.55;
        const c = inkColor(state.time + Math.random() * 8, ang, spd);
        splat(x, y, Math.cos(ang) * force, Math.sin(ang) * force, c, radiusMul);
      }

      function seed() {
        for (let i = 0; i < 8; i++) {
          splatDrop(0.22 + Math.random() * 0.56, 0.22 + Math.random() * 0.56, 1.6 + Math.random() * 2.2, 1.8 + Math.random());
        }
      }
      seed();

      function burst() {
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2 + state.time;
          splatDrop(0.5 + Math.cos(a) * 0.08, 0.5 + Math.sin(a) * 0.08, 1.8, 1.4);
        }
      }

      function clearFields() {
        const u = use(programs.clear);
        gl.uniform4f(u.uColor, 0, 0, 0, 1);
        blit(sim.read); blit(sim.write);
        blit(dye.read); blit(dye.write);
        blit(pressure.read); blit(pressure.write);
      }

      pauseBtn.addEventListener("click", () => setPaused(!state.paused));
      clearBtn.addEventListener("click", clearFields);
      burstBtn.addEventListener("click", burst);
      autoBtn.addEventListener("click", () => setAuto(!state.auto));

      window.addEventListener("keydown", (e) => {
        if (e.target.closest("input, textarea, select")) return;
        if (e.code === "Space") {
          if (e.target.closest("button, summary")) return;
          e.preventDefault();
          setPaused(!state.paused);
        } else if (e.key === "c" || e.key === "C") {
          clearFields();
        } else if (e.key === "b" || e.key === "B") {
          burst();
        } else if (e.key === "a" || e.key === "A") {
          if (!e.target.closest("button")) setAuto(!state.auto);
        } else if (e.key === "1") {
          state.palette = "aurora";
          document.querySelector("input[value=aurora]").checked = true;
        } else if (e.key === "2") {
          state.palette = "magma";
          document.querySelector("input[value=magma]").checked = true;
        } else if (e.key === "3") {
          state.palette = "ocean";
          document.querySelector("input[value=ocean]").checked = true;
        } else if (e.key === "4") {
          state.palette = "neon";
          document.querySelector("input[value=neon]").checked = true;
        } else if (e.key.startsWith("Arrow")) {
          e.preventDefault();
          const f = 1.6;
          const dx = e.key === "ArrowLeft" ? -f : e.key === "ArrowRight" ? f : 0;
          const dy = e.key === "ArrowDown" ? -f : e.key === "ArrowUp" ? f : 0;
          const c = inkColor(state.time, Math.atan2(dy, dx), 1);
          splat(0.5, 0.5, dx, dy, c, 1.8);
        }
      });

      let last = performance.now();
      let frames = 0;
      let fpsT = last;
      let dripT = 0;

      function step(dt) {
        const visc = state.thickness;
        const velDiss = 0.993 + visc * 0.005;
        const dyeDiss = 0.995 + visc * 0.004;
        const vorticity = 8 + state.swirl * 36;
        const jacobi = visc > 0.7 ? 24 : 18;

        for (const p of pointers.values()) {
          if (!p.down) continue;
          const dx = (p.x - p.px) / Math.max(dt, 0.008) * 0.85;
          const dy = (p.y - p.py) / Math.max(dt, 0.008) * 0.85;
          const speed = Math.hypot(p.x - p.px, p.y - p.py);
          if (!p.moved && speed < 0.0004) {
            splatDrop(p.x, p.y, 1.1, 1.25);
            p.moved = true;
            continue;
          }
          const c = inkColor(state.time, Math.atan2(dy, dx), speed * 18);
          splat(p.x, p.y, dx, dy, c, 0.9 + Math.min(speed * 8, 1.8));
          p.px = p.x; p.py = p.y;
        }

        if (state.auto) {
          dripT += dt;
          const interval = reduced ? 1.35 : 0.55;
          if (dripT > interval) {
            dripT = 0;
            splatDrop(0.12 + Math.random() * 0.76, 0.78 + Math.random() * 0.16, 0.25 + Math.random() * 0.7, 0.9);
          }
          const t = state.time;
          splat(
            0.5 + Math.cos(t * 0.23) * 0.28,
            0.5 + Math.sin(t * 0.19) * 0.22,
            Math.cos(t * 0.7) * 0.9,
            Math.sin(t * 0.61) * 0.9,
            inkColor(t, t, 0.55),
            0.7
          );
        }

        let u = use(programs.curl);
        bind(0, sim.read.tex);
        gl.uniform1i(u.uVelocity, 0);
        gl.uniform2f(u.uTexel, sim.read.texel[0], sim.read.texel[1]);
        blit(curl);

        u = use(programs.vort);
        bind(0, sim.read.tex);
        bind(1, curl.tex);
        gl.uniform1i(u.uVelocity, 0);
        gl.uniform1i(u.uCurl, 1);
        gl.uniform2f(u.uTexel, sim.read.texel[0], sim.read.texel[1]);
        gl.uniform1f(u.uVorticity, vorticity);
        gl.uniform1f(u.uDt, dt);
        blit(sim.write);
        sim.swap();

        u = use(programs.div);
        bind(0, sim.read.tex);
        gl.uniform1i(u.uVelocity, 0);
        gl.uniform2f(u.uTexel, sim.read.texel[0], sim.read.texel[1]);
        blit(divergence);

        u = use(programs.clear);
        gl.uniform4f(u.uColor, 0, 0, 0, 1);
        blit(pressure.write);
        pressure.swap();

        for (let i = 0; i < jacobi; i++) {
          u = use(programs.press);
          bind(0, pressure.read.tex);
          bind(1, divergence.tex);
          gl.uniform1i(u.uPressure, 0);
          gl.uniform1i(u.uDivergence, 1);
          gl.uniform2f(u.uTexel, sim.read.texel[0], sim.read.texel[1]);
          blit(pressure.write);
          pressure.swap();
        }

        u = use(programs.grad);
        bind(0, pressure.read.tex);
        bind(1, sim.read.tex);
        gl.uniform1i(u.uPressure, 0);
        gl.uniform1i(u.uVelocity, 1);
        gl.uniform2f(u.uTexel, sim.read.texel[0], sim.read.texel[1]);
        blit(sim.write);
        sim.swap();

        u = use(programs.advect);
        bind(0, sim.read.tex);
        bind(1, sim.read.tex);
        gl.uniform1i(u.uVelocity, 0);
        gl.uniform1i(u.uSource, 1);
        gl.uniform2f(u.uTexel, sim.read.texel[0], sim.read.texel[1]);
        gl.uniform1f(u.uDt, dt);
        gl.uniform1f(u.uDissipation, velDiss);
        gl.uniform1f(u.uChromatic, 0);
        blit(sim.write);
        sim.swap();

        u = use(programs.advect);
        bind(0, sim.read.tex);
        bind(1, dye.read.tex);
        gl.uniform1i(u.uVelocity, 0);
        gl.uniform1i(u.uSource, 1);
        gl.uniform2f(u.uTexel, dye.read.texel[0], dye.read.texel[1]);
        gl.uniform1f(u.uDt, dt);
        gl.uniform1f(u.uDissipation, dyeDiss);
        gl.uniform1f(u.uChromatic, 1);
        blit(dye.write);
        dye.swap();
      }

      function draw() {
        const u = use(programs.display);
        bind(0, dye.read.tex);
        bind(1, sim.read.tex);
        gl.uniform1i(u.uDye, 0);
        gl.uniform1i(u.uVelocity, 1);
        gl.uniform1f(u.uGlow, state.glow);
        gl.uniform1f(u.uTime, state.time);
        blit(null);
      }

      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        frames++;
        if (now - fpsT > 500) {
          fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + " fps";
          frames = 0;
          fpsT = now;
        }
        if (!state.paused) {
          state.time += dt;
          step(dt);
        }
        draw();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function runCPU() {
      backendEl.textContent = "cpu fluid";
      const ctx = canvas.getContext("2d", { alpha: false });
      if (!ctx) {
        backendEl.textContent = "no canvas";
        return;
      }

      let W = 96, H = 54, N = W * H;
      let u, v, u0, v0, r, g, b, r0, g0, b0, p, div;
      const IX = (x, y) => y * W + x;

      function allocCPU() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(2, Math.floor(canvas.clientWidth * dpr));
        canvas.height = Math.max(2, Math.floor(canvas.clientHeight * dpr));
        const base = canvas.width < 800 ? 80 : 112;
        const res = getRes(base, canvas.width, canvas.height);
        W = res.w; H = res.h; N = W * H;
        u = new Float32Array(N); v = new Float32Array(N);
        u0 = new Float32Array(N); v0 = new Float32Array(N);
        r = new Float32Array(N); g = new Float32Array(N); b = new Float32Array(N);
        r0 = new Float32Array(N); g0 = new Float32Array(N); b0 = new Float32Array(N);
        p = new Float32Array(N); div = new Float32Array(N);
        pixels = new ImageData(W, H);
        off.width = W;
        off.height = H;
      }

      let pixels;
      const off = document.createElement("canvas");
      const offCtx = off.getContext("2d");
      allocCPU();
      window.addEventListener("resize", () => {
        allocCPU();
        seed();
      });

      function setBnd(arr, dir) {
        for (let i = 1; i < W - 1; i++) {
          arr[IX(i, 0)] = dir === 2 ? -arr[IX(i, 1)] : arr[IX(i, 1)];
          arr[IX(i, H - 1)] = dir === 2 ? -arr[IX(i, H - 2)] : arr[IX(i, H - 2)];
        }
        for (let j = 1; j < H - 1; j++) {
          arr[IX(0, j)] = dir === 1 ? -arr[IX(1, j)] : arr[IX(1, j)];
          arr[IX(W - 1, j)] = dir === 1 ? -arr[IX(W - 2, j)] : arr[IX(W - 2, j)];
        }
        arr[IX(0, 0)] = 0.5 * (arr[IX(1, 0)] + arr[IX(0, 1)]);
        arr[IX(W - 1, 0)] = 0.5 * (arr[IX(W - 2, 0)] + arr[IX(W - 1, 1)]);
        arr[IX(0, H - 1)] = 0.5 * (arr[IX(1, H - 1)] + arr[IX(0, H - 2)]);
        arr[IX(W - 1, H - 1)] = 0.5 * (arr[IX(W - 2, H - 1)] + arr[IX(W - 1, H - 2)]);
      }

      function linSolve(arr, arr0, a, c, dir, iter) {
        const inv = 1 / c;
        for (let k = 0; k < iter; k++) {
          for (let j = 1; j < H - 1; j++) {
            for (let i = 1; i < W - 1; i++) {
              const id = IX(i, j);
              arr[id] = (arr0[id] + a * (arr[id - 1] + arr[id + 1] + arr[IX(i, j - 1)] + arr[IX(i, j + 1)])) * inv;
            }
          }
          setBnd(arr, dir);
        }
      }

      function diffuse(arr, arr0, diff, dt, dir) {
        const a = dt * diff * (W - 2) * (H - 2);
        linSolve(arr, arr0, a, 1 + 4 * a, dir, 8);
      }

      function advect(d, d0, uu, vv, dt, dir) {
        const dtx = dt * (W - 2);
        const dty = dt * (H - 2);
        for (let j = 1; j < H - 1; j++) {
          for (let i = 1; i < W - 1; i++) {
            const id = IX(i, j);
            let x = i - dtx * uu[id];
            let y = j - dty * vv[id];
            if (x < 0.5) x = 0.5; if (x > W - 1.5) x = W - 1.5;
            if (y < 0.5) y = 0.5; if (y > H - 1.5) y = H - 1.5;
            const i0 = x | 0, i1 = i0 + 1;
            const j0 = y | 0, j1 = j0 + 1;
            const s1 = x - i0, s0 = 1 - s1;
            const t1 = y - j0, t0 = 1 - t1;
            d[id] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                    s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
          }
        }
        setBnd(d, dir);
      }

      function project() {
        for (let j = 1; j < H - 1; j++) {
          for (let i = 1; i < W - 1; i++) {
            const id = IX(i, j);
            div[id] = -0.5 * (u[id + 1] - u[id - 1] + v[IX(i, j + 1)] - v[IX(i, j - 1)]) / W;
            p[id] = 0;
          }
        }
        setBnd(div, 0); setBnd(p, 0);
        linSolve(p, div, 1, 4, 0, 12);
        for (let j = 1; j < H - 1; j++) {
          for (let i = 1; i < W - 1; i++) {
            const id = IX(i, j);
            u[id] -= 0.5 * (p[id + 1] - p[id - 1]) * W;
            v[id] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) * W;
          }
        }
        setBnd(u, 1); setBnd(v, 2);
      }

      function vorticity(dt) {
        const curl = u0;
        for (let j = 1; j < H - 1; j++) {
          for (let i = 1; i < W - 1; i++) {
            curl[IX(i, j)] = 0.5 * (v[IX(i + 1, j)] - v[IX(i - 1, j)] - u[IX(i, j + 1)] + u[IX(i, j - 1)]);
          }
        }
        const vo = 6 + state.swirl * 28;
        for (let j = 1; j < H - 1; j++) {
          for (let i = 1; i < W - 1; i++) {
            const id = IX(i, j);
            const dwdy = Math.abs(curl[IX(i, j + 1)]) - Math.abs(curl[IX(i, j - 1)]);
            const dwdx = Math.abs(curl[IX(i + 1, j)]) - Math.abs(curl[IX(i - 1, j)]);
            const len = Math.hypot(dwdx, dwdy) + 1e-5;
            u[id] += dt * vo * (dwdy / len) * curl[id];
            v[id] += dt * vo * -(dwdx / len) * curl[id];
          }
        }
      }

      function splatCPU(x, y, dx, dy, color, radiusMul) {
        const cx = x * (W - 1);
        const cy = (1 - y) * (H - 1);
        const radius = (2.2 + state.splat * 9) * (radiusMul || 1);
        const rad2 = radius * radius;
        const i0 = Math.max(1, (cx - radius) | 0);
        const i1 = Math.min(W - 2, (cx + radius) | 0);
        const j0 = Math.max(1, (cy - radius) | 0);
        const j1 = Math.min(H - 2, (cy + radius) | 0);
        for (let j = j0; j <= j1; j++) {
          for (let i = i0; i <= i1; i++) {
            const d2 = (i - cx) * (i - cx) + (j - cy) * (j - cy);
            if (d2 > rad2) continue;
            const infl = Math.exp(-d2 / (rad2 * 0.45));
            const id = IX(i, j);
            u[id] += dx * infl * 6;
            v[id] -= dy * infl * 6;
            r[id] += color[0] * infl * 1.4;
            g[id] += color[1] * infl * 1.4;
            b[id] += color[2] * infl * 1.4;
          }
        }
      }

      function splatDrop(x, y, force, rm) {
        const ang = Math.random() * Math.PI * 2;
        const c = inkColor(state.time + Math.random(), ang, 0.8);
        splatCPU(x, y, Math.cos(ang) * force, Math.sin(ang) * force, c, rm);
      }

      function seed() {
        for (let i = 0; i < 7; i++) splatDrop(0.2 + Math.random() * 0.6, 0.25 + Math.random() * 0.5, 0.9, 1.6);
      }
      seed();

      function burst() {
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2;
          splatDrop(0.5 + Math.cos(a) * 0.06, 0.5 + Math.sin(a) * 0.06, 1.4, 1.3);
        }
      }

      function clearFields() {
        u.fill(0); v.fill(0); r.fill(0); g.fill(0); b.fill(0); p.fill(0);
      }

      pauseBtn.addEventListener("click", () => setPaused(!state.paused));
      clearBtn.addEventListener("click", clearFields);
      burstBtn.addEventListener("click", burst);
      autoBtn.addEventListener("click", () => setAuto(!state.auto));

      window.addEventListener("keydown", (e) => {
        if (e.target.closest("input, textarea, select")) return;
        if (e.code === "Space") {
          if (e.target.closest("button, summary")) return;
          e.preventDefault();
          setPaused(!state.paused);
        } else if (e.key === "c" || e.key === "C") clearFields();
        else if (e.key === "b" || e.key === "B") burst();
        else if (e.key === "a" || e.key === "A") { if (!e.target.closest("button")) setAuto(!state.auto); }
        else if (e.key === "1") { state.palette = "aurora"; document.querySelector("input[value=aurora]").checked = true; }
        else if (e.key === "2") { state.palette = "magma"; document.querySelector("input[value=magma]").checked = true; }
        else if (e.key === "3") { state.palette = "ocean"; document.querySelector("input[value=ocean]").checked = true; }
        else if (e.key === "4") { state.palette = "neon"; document.querySelector("input[value=neon]").checked = true; }
        else if (e.key.startsWith("Arrow")) {
          e.preventDefault();
          const dx = e.key === "ArrowLeft" ? -1.4 : e.key === "ArrowRight" ? 1.4 : 0;
          const dy = e.key === "ArrowDown" ? -1.4 : e.key === "ArrowUp" ? 1.4 : 0;
          splatCPU(0.5, 0.5, dx, dy, inkColor(state.time, 0, 1), 1.8);
        }
      });

      let last = performance.now();
      let frames = 0, fpsT = last, dripT = 0;

      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        frames++;
        if (now - fpsT > 500) {
          fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + " fps";
          frames = 0; fpsT = now;
        }
        if (!state.paused) {
          state.time += dt;
          for (const ptr of pointers.values()) {
            if (!ptr.down) continue;
            const dx = (ptr.x - ptr.px) * 7;
            const dy = (ptr.y - ptr.py) * 7;
            const speed = Math.hypot(dx, dy);
            splatCPU(ptr.x, ptr.y, dx * 2, dy * 2, inkColor(state.time, Math.atan2(dy, dx), speed), 1);
            ptr.px = ptr.x; ptr.py = ptr.y;
          }
          if (state.auto) {
            dripT += dt;
            if (dripT > (reduced ? 1.4 : 0.6)) {
              dripT = 0;
              splatDrop(Math.random() * 0.8 + 0.1, 0.85, 0.4, 1);
            }
          }
          const visc = 0.00008 + state.thickness * 0.0004;
          u0.set(u); v0.set(v);
          diffuse(u, u0, visc, dt, 1);
          diffuse(v, v0, visc, dt, 2);
          project();
          u0.set(u); v0.set(v);
          advect(u, u0, u0, v0, dt, 1);
          advect(v, v0, u0, v0, dt, 2);
          project();
          vorticity(dt);
          r0.set(r); g0.set(g); b0.set(b);
          advect(r, r0, u, v, dt * 1.04, 0);
          advect(g, g0, u, v, dt, 0);
          advect(b, b0, u, v, dt * 0.96, 0);
          const fade = 0.992 + state.thickness * 0.005;
          for (let i = 0; i < N; i++) { r[i] *= fade; g[i] *= fade; b[i] *= fade; }
        }

        const data = pixels.data;
        for (let i = 0; i < N; i++) {
          let rr = r[i], gg = g[i], bb = b[i];
          const lum = rr * 0.3 + gg * 0.59 + bb * 0.11;
          const glow = lum * lum * state.glow;
          rr = (rr + glow) / (1 + rr + glow);
          gg = (gg + glow) / (1 + gg + glow);
          bb = (bb + glow) / (1 + bb + glow);
          const o = i * 4;
          data[o] = Math.min(255, rr * 255 + 5);
          data[o + 1] = Math.min(255, gg * 255 + 6);
          data[o + 2] = Math.min(255, bb * 255 + 11);
          data[o + 3] = 255;
        }
        offCtx.putImageData(pixels, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.fillStyle = "#05060a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
