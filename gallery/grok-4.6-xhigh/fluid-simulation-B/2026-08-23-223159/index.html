<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07080d">
  <title>Chroma Well — living pigment</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #07080d;
      --panel: color-mix(in srgb, #0c1018 78%, transparent);
      --ink: #f3efe6;
      --ink-muted: #c5c0b4;
      --ink-subtle: #8e8a80;
      --line: color-mix(in srgb, #f3efe6 14%, transparent);
      --line-strong: color-mix(in srgb, #f3efe6 28%, transparent);
      --accent: #7ee0d0;
      --accent-strong: #4bb8a0;
      --danger: #e07a6a;
      --display: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
      --text: "SF Pro Text", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --radius-outer: 20px;
      --radius-inner: 8px;
      --pad: 12px;
      --focus: 2px solid var(--accent);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--void);
      color: var(--ink);
      font-family: var(--text);
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      touch-action: none;
    }

    .skip {
      position: absolute;
      inset-inline-start: 12px;
      top: 12px;
      z-index: 20;
      padding: 8px 14px;
      background: var(--void);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-inner);
      text-decoration: none;
      transform: translateY(-220%);
    }
    .skip:focus { transform: none; outline: var(--focus); outline-offset: 2px; }

    canvas#tank {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: var(--void);
      cursor: crosshair;
      touch-action: none;
    }
    canvas#tank:focus { outline: none; }
    canvas#tank:focus-visible {
      outline: var(--focus);
      outline-offset: -3px;
    }

    .hud {
      position: fixed;
      inset-inline-start: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 5;
      width: min(22.5rem, calc(100vw - 32px));
      display: grid;
      gap: 10px;
      pointer-events: none;
    }
    .hud > * { pointer-events: auto; }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: var(--radius-outer);
      padding: var(--pad);
      display: grid;
      gap: 12px;
    }

    .mast {
      display: grid;
      gap: 4px;
      padding: 4px 4px 0;
    }
    .eyebrow {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .lede {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select, summary {
      font: inherit;
      color: inherit;
      background: color-mix(in srgb, #f3efe6 7%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius-inner);
      min-height: 40px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover, select:hover, summary:hover {
      background: color-mix(in srgb, #f3efe6 12%, transparent);
    }
    @media (hover: hover) {
      button:hover, select:hover, summary:hover {
        background: color-mix(in srgb, #f3efe6 12%, transparent);
      }
    }
    button:active { scale: 0.96; }
    button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible {
      outline: var(--focus);
      outline-offset: 2px;
    }
    button[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      border-color: var(--accent-strong);
    }
    button.ghost {
      background: transparent;
    }

    .palettes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .palettes label {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-inner);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .palettes input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .palettes label:has(input:checked) {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border-color: var(--accent-strong);
    }
    .palettes label:has(input:focus-visible) {
      outline: var(--focus);
      outline-offset: 2px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .dot-aurora { background: linear-gradient(135deg in oklch, #5eead4, #c084fc, #86efac); }
    .dot-ember { background: linear-gradient(135deg in oklch, #fb7185, #fb923c, #fde68a); }
    .dot-abyss { background: linear-gradient(135deg in oklch, #38bdf8, #6366f1, #22d3ee); }
    .dot-prism { background: linear-gradient(135deg in oklch, #f472b6, #34d399, #60a5fa); }

    .mix {
      border: 0;
      padding: 0;
      margin: 0;
    }
    .mix > summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .mix > summary::-webkit-details-marker { display: none; }
    .mix > summary::after {
      content: "Show";
      font-size: 0.8rem;
      color: var(--ink-subtle);
    }
    .mix[open] > summary::after { content: "Hide"; }
    .mix-body {
      display: grid;
      gap: 12px;
      padding-top: 12px;
    }

    .sliders {
      display: grid;
      gap: 10px;
    }
    .sliders label, .quality {
      display: grid;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--ink-muted);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-strong);
      height: 24px;
    }
    .checks {
      display: grid;
      gap: 8px;
    }
    .checks label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .checks input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-strong);
    }

    .keys {
      margin: 0;
      font-size: 0.75rem;
      color: var(--ink-subtle);
      font-family: var(--mono);
      line-height: 1.45;
    }

    .chrome-btn {
      justify-self: start;
    }

    body.chrome-hidden .panel { display: none; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 26%;
      transform: translateX(-50%);
      z-index: 4;
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: color-mix(in srgb, #0c1018 55%, transparent);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      pointer-events: none;
      opacity: 1;
    }
    .hint.is-gone { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .hint { transition: opacity 400ms cubic-bezier(0.2, 0, 0, 1); }
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .fail {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      z-index: 8;
    }
    .fail[hidden] { display: none; }
    .fail p {
      max-width: 28rem;
      line-height: 1.45;
      color: var(--ink-muted);
    }

    @media (max-width: 640px) {
      .hud {
        inset-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
        width: auto;
        bottom: max(12px, env(safe-area-inset-bottom));
      }
      h1 { font-size: 1.25rem; }
      .lede { font-size: 0.85rem; }
    }

    @media (prefers-contrast: more) {
      .panel, button, .palettes label, .hint {
        border-width: 2px;
        border-color: var(--ink);
      }
      .lede { color: var(--ink); }
    }

    @media (forced-colors: active) {
      .panel, button, .palettes label, .hint {
        background: Canvas;
        border: 2px solid CanvasText;
        backdrop-filter: none;
      }
      .eyebrow { color: Highlight; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#controls">Skip to controls</a>
  <canvas id="tank" tabindex="0" aria-label="Color fluid tank. Drag to stir. Arrow keys push from the center when the tank is focused."></canvas>
  <p class="hint" id="hint">Drag to pour color into the current</p>
  <div class="hud">
    <button type="button" class="chrome-btn ghost" id="chrome" aria-expanded="true">Hide controls</button>
    <section class="panel" id="controls" aria-labelledby="title">
      <header class="mast">
        <p class="eyebrow">Living pigment</p>
        <h1 id="title">Chroma Well</h1>
        <p class="lede">A dark tank of oil-slick color. Drag to stir. The current keeps a slow gyre on its own.</p>
      </header>
      <div class="palettes" role="radiogroup" aria-label="Palette">
        <label><input type="radio" name="palette" value="aurora" checked> <span class="dot dot-aurora" aria-hidden="true"></span> Aurora</label>
        <label><input type="radio" name="palette" value="ember"> <span class="dot dot-ember" aria-hidden="true"></span> Ember</label>
        <label><input type="radio" name="palette" value="abyss"> <span class="dot dot-abyss" aria-hidden="true"></span> Abyss</label>
        <label><input type="radio" name="palette" value="prism"> <span class="dot dot-prism" aria-hidden="true"></span> Prism</label>
      </div>
      <div class="row">
        <button type="button" id="pause" aria-pressed="false">Pause</button>
        <button type="button" id="clear">Clear tank</button>
      </div>
      <details class="mix" id="mix">
        <summary>Mix</summary>
        <div class="mix-body">
          <div class="checks">
            <label><input type="checkbox" id="currents" checked> Auto currents</label>
            <label><input type="checkbox" id="bloom" checked> Bloom glow</label>
            <label><input type="checkbox" id="sheen" checked> Oil sheen</label>
          </div>
          <div class="sliders">
            <label>Swirl <input type="range" id="swirl" min="0" max="50" value="30"></label>
            <label>Fade <input type="range" id="fade" min="1" max="40" value="12"></label>
            <label class="quality">Quality
              <select id="quality">
                <option value="battery">Battery</option>
                <option value="balanced" selected>Balanced</option>
                <option value="vivid">Vivid</option>
              </select>
            </label>
          </div>
        </div>
      </details>
      <p class="keys">Space pause · C clear · 1–4 palettes · H chrome · arrows stir</p>
    </section>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="fail" id="fail" hidden>
    <p id="fail-text">This browser cannot draw the tank.</p>
  </div>
  <noscript>
    <div class="fail">
      <p>Chroma Well needs JavaScript to run the fluid tank.</p>
    </div>
  </noscript>
  <script>
    (function () {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let tank = document.getElementById("tank");
      function surface() { return document.getElementById("tank") || tank; }
      const hint = document.getElementById("hint");
      const status = document.getElementById("status");
      const fail = document.getElementById("fail");
      const failText = document.getElementById("fail-text");
      const pauseBtn = document.getElementById("pause");
      const clearBtn = document.getElementById("clear");
      const chromeBtn = document.getElementById("chrome");
      const currentsEl = document.getElementById("currents");
      const bloomEl = document.getElementById("bloom");
      const sheenEl = document.getElementById("sheen");
      const swirlEl = document.getElementById("swirl");
      const fadeEl = document.getElementById("fade");
      const qualityEl = document.getElementById("quality");

      if (reduced) {
        currentsEl.checked = false;
        bloomEl.checked = false;
      }

      const state = {
        palette: "aurora",
        paused: false,
        bloom: bloomEl.checked,
        sheen: sheenEl.checked,
        currents: currentsEl.checked,
        swirl: Number(swirlEl.value),
        fade: Number(fadeEl.value),
        quality: qualityEl.value,
        hueClock: 0,
        hinted: false
      };

      function say(msg) {
        status.textContent = "";
        status.textContent = msg;
      }

      function hsv(h, s, v) {
        h = ((h % 360) + 360) % 360 / 60;
        const c = v * s;
        const x = c * (1 - Math.abs(h % 2 - 1));
        const m = v - c;
        let r = 0, g = 0, b = 0;
        if (h < 1) { r = c; g = x; }
        else if (h < 2) { r = x; g = c; }
        else if (h < 3) { g = c; b = x; }
        else if (h < 4) { g = x; b = c; }
        else if (h < 5) { r = x; b = c; }
        else { r = c; b = x; }
        return [r + m, g + m, b + m];
      }

      function paletteColor(t, seed) {
        const u = t * 0.11 + seed * 1.7;
        const wave = 0.5 + 0.5 * Math.sin(u);
        switch (state.palette) {
          case "ember": return hsv(12 + 36 * wave, 0.94, 1);
          case "abyss": return hsv(198 + 62 * wave, 0.82, 0.98);
          case "prism": return hsv((u * 70) % 360, 0.9, 1);
          default: return hsv(148 + 92 * wave, 0.86, 1);
        }
      }

      function hideHint() {
        if (state.hinted) return;
        state.hinted = true;
        hint.classList.add("is-gone");
      }

      const pointers = new Map();

      function uvFromEvent(e) {
        const el = surface();
        const rect = el.getBoundingClientRect();
        const w = Math.max(1, rect.width);
        const h = Math.max(1, rect.height);
        return {
          x: (e.clientX - rect.left) / w,
          y: 1 - (e.clientY - rect.top) / h
        };
      }

      function endPointer(e) {
        const cur = pointers.get(e.pointerId);
        if (!cur) return;
        cur.down = false;
        pointers.delete(e.pointerId);
      }

      function bindSurface(el) {
        el.addEventListener("pointerdown", (e) => {
          el.setPointerCapture(e.pointerId);
          const p = uvFromEvent(e);
          pointers.set(e.pointerId, { x: p.x, y: p.y, px: p.x, py: p.y, down: true, moved: false });
          hideHint();
        });
        el.addEventListener("pointermove", (e) => {
          const cur = pointers.get(e.pointerId);
          if (!cur || !cur.down) return;
          const p = uvFromEvent(e);
          cur.px = cur.x; cur.py = cur.y;
          cur.x = p.x; cur.y = p.y;
          cur.moved = true;
        });
        el.addEventListener("pointerup", endPointer);
        el.addEventListener("pointercancel", endPointer);
        el.addEventListener("contextmenu", (e) => e.preventDefault());
        el.addEventListener("keydown", keyStir);
      }

      const vents = [
        { cx: 0.28, cy: 0.62, orbit: 0.16, speed: 0.31, breathe: 1.1, force: 90, seed: 0.1, radius: 0.0024 },
        { cx: 0.72, cy: 0.38, orbit: 0.14, speed: -0.24, breathe: 0.8, force: 80, seed: 0.4, radius: 0.0028 },
        { cx: 0.52, cy: 0.72, orbit: 0.11, speed: 0.19, breathe: 1.4, force: 70, seed: 0.7, radius: 0.0022 },
        { cx: 0.44, cy: 0.32, orbit: 0.18, speed: -0.15, breathe: 0.7, force: 64, seed: 0.95, radius: 0.0026 }
      ];

      const QUALITY = {
        battery: { sim: 96, dye: 256, pressure: 10 },
        balanced: { sim: 128, dye: 512, pressure: 18 },
        vivid: { sim: 192, dye: 1024, pressure: 28 }
      };

      function simDims(cap, w, h) {
        const aspect = w / h;
        let sw, sh;
        if (aspect >= 1) { sw = cap; sh = Math.max(32, Math.round(cap / aspect)); }
        else { sh = cap; sw = Math.max(32, Math.round(cap * aspect)); }
        sw += sw % 2; sh += sh % 2;
        return [sw, sh];
      }

      const VERT = [
        "precision highp float;",
        "attribute vec2 aPos;",
        "varying vec2 vUv;",
        "void main(){",
        "  vUv = aPos * 0.5 + 0.5;",
        "  gl_Position = vec4(aPos, 0.0, 1.0);",
        "}"
      ].join("\n");

      const PREC = [
        "#ifdef GL_FRAGMENT_PRECISION_HIGH",
        "precision highp float;",
        "#else",
        "precision mediump float;",
        "#endif",
        "varying vec2 vUv;"
      ].join("\n");

      function shader(gl, type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(s);
          gl.deleteShader(s);
          throw new Error(log || "shader");
        }
        return s;
      }

      function program(gl, fs) {
        const p = gl.createProgram();
        const vs = shader(gl, gl.VERTEX_SHADER, VERT);
        const frag = shader(gl, gl.FRAGMENT_SHADER, PREC + "\n" + fs);
        gl.attachShader(p, vs);
        gl.attachShader(p, frag);
        gl.bindAttribLocation(p, 0, "aPos");
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(p) || "link");
        }
        const uniforms = {};
        const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < n; i++) {
          const info = gl.getActiveUniform(p, i);
          uniforms[info.name] = gl.getUniformLocation(p, info.name);
        }
        return { p, uniforms };
      }

      const glOpts = {
        alpha: false,
        depth: false,
        stencil: false,
        antialias: false,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance"
      };

      function probeVersion(version) {
        const probe = document.createElement("canvas");
        probe.width = 8;
        probe.height = 8;
        const gl = version === 2
          ? probe.getContext("webgl2", glOpts)
          : (probe.getContext("webgl", glOpts) || probe.getContext("experimental-webgl", glOpts));
        if (!gl) return null;
        return pickFormat(gl, version);
      }

      function tryGL(canvas) {
        if (probeVersion(2)) {
          const gl = canvas.getContext("webgl2", glOpts);
          if (gl) {
            const fmt = pickFormat(gl, 2);
            if (fmt) return { gl: gl, fmt: fmt, v: 2 };
          }
        }
        if (probeVersion(1)) {
          const next = canvas.cloneNode(true);
          canvas.replaceWith(next);
          tank = next;
          const gl = next.getContext("webgl", glOpts) || next.getContext("experimental-webgl", glOpts);
          if (gl) {
            const fmt = pickFormat(gl, 1);
            if (fmt) return { gl: gl, fmt: fmt, v: 1 };
          }
        }
        return null;
      }

      function pickFormat(gl, version) {
        const candidates = [];
        if (version === 2) {
          gl.getExtension("EXT_color_buffer_float");
          gl.getExtension("EXT_color_buffer_half_float");
          gl.getExtension("OES_texture_float_linear");
          candidates.push(
            { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT },
            { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT }
          );
        } else {
          const half = gl.getExtension("OES_texture_half_float");
          const flt = gl.getExtension("OES_texture_float");
          gl.getExtension("OES_texture_half_float_linear");
          gl.getExtension("OES_texture_float_linear");
          gl.getExtension("WEBGL_color_buffer_float");
          gl.getExtension("EXT_color_buffer_half_float");
          if (half) candidates.push({ internal: gl.RGBA, format: gl.RGBA, type: half.HALF_FLOAT_OES });
          if (flt) candidates.push({ internal: gl.RGBA, format: gl.RGBA, type: gl.FLOAT });
        }
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          if (canRender(gl, c)) {
            c.filter = canFilter(gl, c) ? gl.LINEAR : gl.NEAREST;
            return c;
          }
        }
        return null;
      }

      function canRender(gl, c) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, c.internal, 8, 8, 0, c.format, c.type, null);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(fb);
        gl.deleteTexture(tex);
        return ok;
      }

      function canFilter(gl, c) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, c.internal, 8, 8, 0, c.format, c.type, null);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(fb);
        gl.deleteTexture(tex);
        return ok;
      }

      const FS = {
        splat: [
          "uniform sampler2D uTarget;",
          "uniform vec2 uPoint;",
          "uniform vec3 uColor;",
          "uniform float uRadius;",
          "uniform float uAspect;",
          "void main(){",
          "  vec2 p = vUv - uPoint;",
          "  p.x *= uAspect;",
          "  float fall = exp(-dot(p,p) / uRadius);",
          "  vec3 base = texture2D(uTarget, vUv).xyz;",
          "  gl_FragColor = vec4(base + fall * uColor, 1.0);",
          "}"
        ].join("\n"),
        curl: [
          "uniform sampler2D uVelocity;",
          "uniform vec2 uTexel;",
          "void main(){",
          "  float L = texture2D(uVelocity, vUv - vec2(uTexel.x, 0.0)).y;",
          "  float R = texture2D(uVelocity, vUv + vec2(uTexel.x, 0.0)).y;",
          "  float B = texture2D(uVelocity, vUv - vec2(0.0, uTexel.y)).x;",
          "  float T = texture2D(uVelocity, vUv + vec2(0.0, uTexel.y)).x;",
          "  gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);",
          "}"
        ].join("\n"),
        vorticity: [
          "uniform sampler2D uVelocity;",
          "uniform sampler2D uCurl;",
          "uniform vec2 uTexel;",
          "uniform float uCurlStr;",
          "uniform float uDt;",
          "uniform float uTide;",
          "void main(){",
          "  float L = texture2D(uCurl, vUv - vec2(uTexel.x, 0.0)).x;",
          "  float R = texture2D(uCurl, vUv + vec2(uTexel.x, 0.0)).x;",
          "  float B = texture2D(uCurl, vUv - vec2(0.0, uTexel.y)).x;",
          "  float T = texture2D(uCurl, vUv + vec2(0.0, uTexel.y)).x;",
          "  float C = texture2D(uCurl, vUv).x;",
          "  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));",
          "  float len = length(force) + 0.0001;",
          "  force = force / len * uCurlStr * C;",
          "  force.y *= -1.0;",
          "  vec2 tide = vec2(-(vUv.y - 0.5), vUv.x - 0.5) * uTide;",
          "  vec2 vel = texture2D(uVelocity, vUv).xy;",
          "  gl_FragColor = vec4(vel + (force + tide) * uDt, 0.0, 1.0);",
          "}"
        ].join("\n"),
        divergence: [
          "uniform sampler2D uVelocity;",
          "uniform vec2 uTexel;",
          "void main(){",
          "  vec2 L = texture2D(uVelocity, vUv - vec2(uTexel.x, 0.0)).xy;",
          "  vec2 R = texture2D(uVelocity, vUv + vec2(uTexel.x, 0.0)).xy;",
          "  vec2 B = texture2D(uVelocity, vUv - vec2(0.0, uTexel.y)).xy;",
          "  vec2 T = texture2D(uVelocity, vUv + vec2(0.0, uTexel.y)).xy;",
          "  vec2 C = texture2D(uVelocity, vUv).xy;",
          "  if (vUv.x < uTexel.x) L.x = -C.x;",
          "  if (vUv.x > 1.0 - uTexel.x) R.x = -C.x;",
          "  if (vUv.y < uTexel.y) B.y = -C.y;",
          "  if (vUv.y > 1.0 - uTexel.y) T.y = -C.y;",
          "  float div = 0.5 * (R.x - L.x + T.y - B.y);",
          "  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);",
          "}"
        ].join("\n"),
        pressure: [
          "uniform sampler2D uPressure;",
          "uniform sampler2D uDivergence;",
          "uniform vec2 uTexel;",
          "void main(){",
          "  float L = texture2D(uPressure, vUv - vec2(uTexel.x, 0.0)).x;",
          "  float R = texture2D(uPressure, vUv + vec2(uTexel.x, 0.0)).x;",
          "  float B = texture2D(uPressure, vUv - vec2(0.0, uTexel.y)).x;",
          "  float T = texture2D(uPressure, vUv + vec2(0.0, uTexel.y)).x;",
          "  float C = texture2D(uDivergence, vUv).x;",
          "  gl_FragColor = vec4((L + R + B + T - C) * 0.25, 0.0, 0.0, 1.0);",
          "}"
        ].join("\n"),
        gradient: [
          "uniform sampler2D uPressure;",
          "uniform sampler2D uVelocity;",
          "uniform vec2 uTexel;",
          "void main(){",
          "  float L = texture2D(uPressure, vUv - vec2(uTexel.x, 0.0)).x;",
          "  float R = texture2D(uPressure, vUv + vec2(uTexel.x, 0.0)).x;",
          "  float B = texture2D(uPressure, vUv - vec2(0.0, uTexel.y)).x;",
          "  float T = texture2D(uPressure, vUv + vec2(0.0, uTexel.y)).x;",
          "  vec2 vel = texture2D(uVelocity, vUv).xy;",
          "  vel.xy -= vec2(R - L, T - B);",
          "  gl_FragColor = vec4(vel, 0.0, 1.0);",
          "}"
        ].join("\n"),
        advect: [
          "uniform sampler2D uVelocity;",
          "uniform sampler2D uSource;",
          "uniform vec2 uVelTexel;",
          "uniform float uDt;",
          "uniform float uDissipation;",
          "void main(){",
          "  vec2 coord = vUv - uDt * texture2D(uVelocity, vUv).xy * uVelTexel;",
          "  gl_FragColor = uDissipation * texture2D(uSource, coord);",
          "}"
        ].join("\n"),
        clear: [
          "uniform sampler2D uTexture;",
          "uniform float uValue;",
          "void main(){",
          "  gl_FragColor = uValue * texture2D(uTexture, vUv);",
          "}"
        ].join("\n"),
        bloomExtract: [
          "uniform sampler2D uTexture;",
          "uniform float uThreshold;",
          "void main(){",
          "  vec3 c = texture2D(uTexture, vUv).rgb;",
          "  float br = max(max(c.r, c.g), c.b);",
          "  float q = max(0.0, br - uThreshold);",
          "  gl_FragColor = vec4(c * q, 1.0);",
          "}"
        ].join("\n"),
        blur: [
          "uniform sampler2D uTexture;",
          "uniform vec2 uDelta;",
          "void main(){",
          "  vec4 sum = texture2D(uTexture, vUv) * 0.294117;",
          "  sum += texture2D(uTexture, vUv + uDelta) * 0.352941;",
          "  sum += texture2D(uTexture, vUv - uDelta) * 0.352941;",
          "  gl_FragColor = sum;",
          "}"
        ].join("\n"),
        display: [
          "uniform sampler2D uDye;",
          "uniform sampler2D uBloom;",
          "uniform sampler2D uCurl;",
          "uniform vec2 uPx;",
          "uniform float uTime;",
          "uniform float uBloomAmt;",
          "uniform float uSheen;",
          "float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }",
          "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
          "void main(){",
          "  vec3 dye = texture2D(uDye, vUv).rgb;",
          "  vec3 bloom = texture2D(uBloom, vUv).rgb;",
          "  float crl = texture2D(uCurl, vUv).x;",
          "  float lL = lum(texture2D(uDye, vUv - vec2(uPx.x, 0.0)).rgb);",
          "  float lR = lum(texture2D(uDye, vUv + vec2(uPx.x, 0.0)).rgb);",
          "  float lB = lum(texture2D(uDye, vUv - vec2(0.0, uPx.y)).rgb);",
          "  float lT = lum(texture2D(uDye, vUv + vec2(0.0, uPx.y)).rgb);",
          "  vec3 n = normalize(vec3(lL - lR, lB - lT, 0.42));",
          "  float lit = clamp(dot(n, normalize(vec3(-0.25, 0.55, 0.8))), 0.0, 1.0);",
          "  vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + crl * 1.8 + uTime * 0.03));",
          "  vec3 well = mix(vec3(0.012, 0.016, 0.03), vec3(0.03, 0.04, 0.07), 1.0 - smoothstep(0.15, 0.85, length(vUv - 0.5)));",
          "  vec3 col = well + dye * (0.88 + 0.28 * lit);",
          "  col += bloom * uBloomAmt;",
          "  col += irid * abs(crl) * lum(dye) * uSheen;",
          "  col = col / (vec3(1.0) + col * 0.32);",
          "  float vig = smoothstep(1.15, 0.35, length(vUv - 0.5));",
          "  col *= vig;",
          "  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.018;",
          "  col = pow(max(col, 0.0), vec3(0.92));",
          "  gl_FragColor = vec4(col, 1.0);",
          "}"
        ].join("\n")
      };

      function startGPU(bundle) {
        const gl = bundle.gl;
        const fmt = bundle.fmt;
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        gl.clearColor(0, 0, 0, 1);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const prog = {};
        Object.keys(FS).forEach((k) => { prog[k] = program(gl, FS[k]); });

        function use(name) {
          const pr = prog[name];
          gl.useProgram(pr.p);
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
          return pr.uniforms;
        }

        function bindTex(u, unit, tex) {
          gl.uniform1i(u, unit);
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, tex);
        }

        function createFBO(w, h, filter) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, w, h, 0, fmt.format, fmt.type, null);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          gl.viewport(0, 0, w, h);
          gl.clear(gl.COLOR_BUFFER_BIT);
          return { tex, fbo, w, h, texelX: 1 / w, texelY: 1 / h };
        }

        function destroyFBO(f) {
          if (!f) return;
          gl.deleteTexture(f.tex);
          gl.deleteFramebuffer(f.fbo);
        }

        function doubleFBO(w, h, filter) {
          let a = createFBO(w, h, filter);
          let b = createFBO(w, h, filter);
          return {
            get read() { return a; },
            get write() { return b; },
            swap() { const t = a; a = b; b = t; },
            w, h,
            kill() { destroyFBO(a); destroyFBO(b); }
          };
        }

        function blit(target) {
          if (target) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
            gl.viewport(0, 0, target.w, target.h);
          } else {
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
          }
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        let velocity, dye, pressure, divergence, curl, bloomA, bloomB;
        let simW = 0, simH = 0, dyeW = 0, dyeH = 0;

        function rebuild() {
          const q = QUALITY[state.quality] || QUALITY.balanced;
          const w = tank.clientWidth || window.innerWidth;
          const h = tank.clientHeight || window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, state.quality === "vivid" ? 2 : 1.5);
          tank.width = Math.max(2, Math.round(w * dpr));
          tank.height = Math.max(2, Math.round(h * dpr));
          const sim = simDims(q.sim, w, h);
          const dyeDim = simDims(q.dye, w, h);
          if (velocity) velocity.kill();
          if (dye) dye.kill();
          if (pressure) pressure.kill();
          destroyFBO(divergence);
          destroyFBO(curl);
          destroyFBO(bloomA);
          destroyFBO(bloomB);
          simW = sim[0]; simH = sim[1];
          dyeW = dyeDim[0]; dyeH = dyeDim[1];
          velocity = doubleFBO(simW, simH, gl.NEAREST);
          dye = doubleFBO(dyeW, dyeH, fmt.filter);
          pressure = doubleFBO(simW, simH, gl.NEAREST);
          divergence = createFBO(simW, simH, gl.NEAREST);
          curl = createFBO(simW, simH, gl.NEAREST);
          bloomA = createFBO(Math.max(32, dyeW >> 1), Math.max(32, dyeH >> 1), fmt.filter);
          bloomB = createFBO(Math.max(32, dyeW >> 1), Math.max(32, dyeH >> 1), fmt.filter);
        }

        function splat(x, y, dx, dy, color, radius) {
          const aspect = tank.width / tank.height;
          let u = use("splat");
          bindTex(u.uTarget, 0, velocity.read.tex);
          gl.uniform1f(u.uAspect, aspect);
          gl.uniform2f(u.uPoint, x, y);
          gl.uniform3f(u.uColor, dx, dy, 0);
          gl.uniform1f(u.uRadius, radius);
          blit(velocity.write);
          velocity.swap();

          u = use("splat");
          bindTex(u.uTarget, 0, dye.read.tex);
          gl.uniform1f(u.uAspect, aspect);
          gl.uniform2f(u.uPoint, x, y);
          gl.uniform3f(u.uColor, color[0] * 1.35, color[1] * 1.35, color[2] * 1.35);
          gl.uniform1f(u.uRadius, radius * 0.85);
          blit(dye.write);
          dye.swap();
        }

        function splatPointers() {
          const aspect = tank.width / Math.max(1, tank.height);
          pointers.forEach((p) => {
            if (!p.down) return;
            let dx = (p.x - p.px) * 4200;
            let dy = (p.y - p.py) * 4200;
            if (!p.moved || (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1)) {
              dx = (Math.random() - 0.5) * 80;
              dy = (Math.random() - 0.5) * 80;
            }
            const speed = Math.min(1.6, Math.hypot(dx, dy) / 500);
            const col = paletteColor(state.hueClock + Math.atan2(dy, dx), speed);
            col[0] *= 0.7 + speed; col[1] *= 0.7 + speed; col[2] *= 0.7 + speed;
            splat(p.x, p.y, dx * aspect, dy, col, 0.0018 + speed * 0.0012);
            p.px = p.x; p.py = p.y; p.moved = false;
          });
        }

        function splatVents(now) {
          if (!state.currents) return;
          const aspect = tank.width / Math.max(1, tank.height);
          for (let i = 0; i < vents.length; i++) {
            const v = vents[i];
            const ph = now * v.speed + v.seed * 6.28;
            const x = v.cx + Math.cos(ph) * v.orbit;
            const y = v.cy + Math.sin(ph * 0.92) * v.orbit * 0.62;
            const pulse = 0.45 + 0.55 * Math.sin(now * v.breathe + v.seed);
            if (pulse < 0.38) continue;
            const tx = -Math.sin(ph) * v.force * pulse;
            const ty = Math.cos(ph) * v.force * pulse;
            const col = paletteColor(state.hueClock, v.seed);
            splat(x, y, tx * aspect, ty, col, v.radius * (0.7 + pulse));
          }
        }

        function clearTank() {
          const u = use("clear");
          gl.uniform1f(u.uValue, 0);
          bindTex(u.uTexture, 0, velocity.read.tex);
          blit(velocity.write); velocity.swap();
          bindTex(u.uTexture, 0, dye.read.tex);
          blit(dye.write); dye.swap();
          bindTex(u.uTexture, 0, pressure.read.tex);
          blit(pressure.write); pressure.swap();
        }

        function step(dt, now) {
          splatPointers();
          splatVents(now);

          const texel = [velocity.read.texelX, velocity.read.texelY];
          let u = use("curl");
          bindTex(u.uVelocity, 0, velocity.read.tex);
          gl.uniform2f(u.uTexel, texel[0], texel[1]);
          blit(curl);

          u = use("vorticity");
          bindTex(u.uVelocity, 0, velocity.read.tex);
          bindTex(u.uCurl, 1, curl.tex);
          gl.uniform2f(u.uTexel, texel[0], texel[1]);
          gl.uniform1f(u.uCurlStr, state.swirl);
          gl.uniform1f(u.uDt, dt);
          gl.uniform1f(u.uTide, state.currents ? 4.5 : 0);
          blit(velocity.write);
          velocity.swap();

          u = use("divergence");
          bindTex(u.uVelocity, 0, velocity.read.tex);
          gl.uniform2f(u.uTexel, texel[0], texel[1]);
          blit(divergence);

          u = use("clear");
          bindTex(u.uTexture, 0, pressure.read.tex);
          gl.uniform1f(u.uValue, 0.8);
          blit(pressure.write);
          pressure.swap();

          const iters = (QUALITY[state.quality] || QUALITY.balanced).pressure;
          for (let i = 0; i < iters; i++) {
            u = use("pressure");
            bindTex(u.uPressure, 0, pressure.read.tex);
            bindTex(u.uDivergence, 1, divergence.tex);
            gl.uniform2f(u.uTexel, texel[0], texel[1]);
            blit(pressure.write);
            pressure.swap();
          }

          u = use("gradient");
          bindTex(u.uPressure, 0, pressure.read.tex);
          bindTex(u.uVelocity, 1, velocity.read.tex);
          gl.uniform2f(u.uTexel, texel[0], texel[1]);
          blit(velocity.write);
          velocity.swap();

          const fade = 1 - state.fade * 0.00035;
          u = use("advect");
          bindTex(u.uVelocity, 0, velocity.read.tex);
          bindTex(u.uSource, 1, velocity.read.tex);
          gl.uniform2f(u.uVelTexel, texel[0], texel[1]);
          gl.uniform1f(u.uDt, dt);
          gl.uniform1f(u.uDissipation, Math.min(0.999, fade + 0.004));
          blit(velocity.write);
          velocity.swap();

          u = use("advect");
          bindTex(u.uVelocity, 0, velocity.read.tex);
          bindTex(u.uSource, 1, dye.read.tex);
          gl.uniform2f(u.uVelTexel, texel[0], texel[1]);
          gl.uniform1f(u.uDt, dt);
          gl.uniform1f(u.uDissipation, Math.min(0.9995, fade + 0.01));
          blit(dye.write);
          dye.swap();

          if (state.bloom) {
            u = use("bloomExtract");
            bindTex(u.uTexture, 0, dye.read.tex);
            gl.uniform1f(u.uThreshold, 0.42);
            blit(bloomA);
            u = use("blur");
            bindTex(u.uTexture, 0, bloomA.tex);
            gl.uniform2f(u.uDelta, 1 / bloomA.w, 0);
            blit(bloomB);
            u = use("blur");
            bindTex(u.uTexture, 0, bloomB.tex);
            gl.uniform2f(u.uDelta, 0, 1 / bloomB.h);
            blit(bloomA);
            u = use("blur");
            bindTex(u.uTexture, 0, bloomA.tex);
            gl.uniform2f(u.uDelta, 1.6 / bloomA.w, 0);
            blit(bloomB);
            u = use("blur");
            bindTex(u.uTexture, 0, bloomB.tex);
            gl.uniform2f(u.uDelta, 0, 1.6 / bloomB.h);
            blit(bloomA);
          }
        }

        function draw(now) {
          const u = use("display");
          bindTex(u.uDye, 0, dye.read.tex);
          bindTex(u.uBloom, 1, state.bloom ? bloomA.tex : dye.read.tex);
          bindTex(u.uCurl, 2, curl.tex);
          gl.uniform2f(u.uPx, 1 / dyeW, 1 / dyeH);
          gl.uniform1f(u.uTime, now);
          gl.uniform1f(u.uBloomAmt, state.bloom ? 0.72 : 0);
          gl.uniform1f(u.uSheen, state.sheen ? 0.42 : 0);
          blit(null);
        }

        function seedOpening(now) {
          if (reduced) {
            const c = paletteColor(0, 0.2);
            splat(0.5, 0.48, 40, -28, c, 0.006);
            return;
          }
          const spots = [
            [0.5, 0.5, 30, 90],
            [0.34, 0.42, -160, 40],
            [0.66, 0.56, 140, -70],
            [0.48, 0.7, -36, -120]
          ];
          for (let i = 0; i < spots.length; i++) {
            const s = spots[i];
            splat(s[0], s[1], s[2], s[3], paletteColor(now, i * 0.22), 0.0045 + i * 0.0006);
          }
        }

        rebuild();
        seedOpening(0);

        let last = performance.now();
        let raf = 0;
        function frame(now) {
          raf = requestAnimationFrame(frame);
          const dt = Math.min(0.016666, (now - last) / 1000);
          last = now;
          state.hueClock = now * 0.001;
          if (!state.paused) step(dt, now * 0.001);
          draw(now * 0.001);
        }
        raf = requestAnimationFrame(frame);

        window.addEventListener("resize", () => {
          const w = tank.clientWidth || window.innerWidth;
          const h = tank.clientHeight || window.innerHeight;
          const q = QUALITY[state.quality] || QUALITY.balanced;
          const sim = simDims(q.sim, w, h);
          const dyeDim = simDims(q.dye, w, h);
          if (sim[0] !== simW || sim[1] !== simH || dyeDim[0] !== dyeW || dyeDim[1] !== dyeH) rebuild();
          else {
            const dpr = Math.min(window.devicePixelRatio || 1, state.quality === "vivid" ? 2 : 1.5);
            tank.width = Math.max(2, Math.round(w * dpr));
            tank.height = Math.max(2, Math.round(h * dpr));
          }
        });

        return {
          clear: clearTank,
          rebuild,
          splat,
          stop() { cancelAnimationFrame(raf); }
        };
      }

      function startCPU() {
        const prev = tank;
        const next = prev.cloneNode();
        prev.replaceWith(next);
        next.id = "tank";
        next.tabIndex = 0;
        next.setAttribute("aria-label", prev.getAttribute("aria-label"));
        tank = next;
        const canvas = next;
        const ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return null;

        let nx = 96, ny = 54;
        let u, v, u0, v0, r, g, b, r0, g0, b0, p, div;
        const img = document.createElement("canvas");
        const ictx = img.getContext("2d");
        let pixels;

        function alloc() {
          const n = nx * ny;
          u = new Float32Array(n); v = new Float32Array(n);
          u0 = new Float32Array(n); v0 = new Float32Array(n);
          r = new Float32Array(n); g = new Float32Array(n); b = new Float32Array(n);
          r0 = new Float32Array(n); g0 = new Float32Array(n); b0 = new Float32Array(n);
          p = new Float32Array(n); div = new Float32Array(n);
          img.width = nx; img.height = ny;
          pixels = ictx.createImageData(nx, ny);
        }

        function ix(x, y) { return x + y * nx; }

        function rebuild() {
          const w = canvas.clientWidth || window.innerWidth;
          const h = canvas.clientHeight || window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          canvas.width = Math.max(2, Math.round(w * dpr));
          canvas.height = Math.max(2, Math.round(h * dpr));
          const cap = state.quality === "vivid" ? 128 : state.quality === "battery" ? 72 : 96;
          const d = simDims(cap, w, h);
          nx = d[0]; ny = d[1];
          alloc();
        }

        function setBnd(field, b) {
          for (let i = 1; i < nx - 1; i++) {
            field[ix(i, 0)] = b === 2 ? -field[ix(i, 1)] : field[ix(i, 1)];
            field[ix(i, ny - 1)] = b === 2 ? -field[ix(i, ny - 2)] : field[ix(i, ny - 2)];
          }
          for (let j = 1; j < ny - 1; j++) {
            field[ix(0, j)] = b === 1 ? -field[ix(1, j)] : field[ix(1, j)];
            field[ix(nx - 1, j)] = b === 1 ? -field[ix(nx - 2, j)] : field[ix(nx - 2, j)];
          }
          field[ix(0, 0)] = 0.5 * (field[ix(1, 0)] + field[ix(0, 1)]);
          field[ix(0, ny - 1)] = 0.5 * (field[ix(1, ny - 1)] + field[ix(0, ny - 2)]);
          field[ix(nx - 1, 0)] = 0.5 * (field[ix(nx - 2, 0)] + field[ix(nx - 1, 1)]);
          field[ix(nx - 1, ny - 1)] = 0.5 * (field[ix(nx - 2, ny - 1)] + field[ix(nx - 1, ny - 2)]);
        }

        function linSolve(field, field0, a, c, b, iters) {
          const inv = 1 / c;
          for (let k = 0; k < iters; k++) {
            for (let j = 1; j < ny - 1; j++) {
              for (let i = 1; i < nx - 1; i++) {
                const id = ix(i, j);
                field[id] = (field0[id] + a * (field[id - 1] + field[id + 1] + field[id - nx] + field[id + nx])) * inv;
              }
            }
            setBnd(field, b);
          }
        }

        function project() {
          for (let j = 1; j < ny - 1; j++) {
            for (let i = 1; i < nx - 1; i++) {
              const id = ix(i, j);
              div[id] = -0.5 * (u[id + 1] - u[id - 1] + v[id + nx] - v[id - nx]) / nx;
              p[id] = 0;
            }
          }
          setBnd(div, 0); setBnd(p, 0);
          linSolve(p, div, 1, 4, 0, 12);
          for (let j = 1; j < ny - 1; j++) {
            for (let i = 1; i < nx - 1; i++) {
              const id = ix(i, j);
              u[id] -= 0.5 * nx * (p[id + 1] - p[id - 1]);
              v[id] -= 0.5 * ny * (p[id + nx] - p[id - nx]);
            }
          }
          setBnd(u, 1); setBnd(v, 2);
        }

        function advect(dst, src, uu, vv, dt, bnd) {
          const dtx = dt * (nx - 2);
          const dty = dt * (ny - 2);
          for (let j = 1; j < ny - 1; j++) {
            for (let i = 1; i < nx - 1; i++) {
              const id = ix(i, j);
              let x = i - dtx * uu[id];
              let y = j - dty * vv[id];
              if (x < 0.5) x = 0.5;
              if (x > nx - 1.5) x = nx - 1.5;
              if (y < 0.5) y = 0.5;
              if (y > ny - 1.5) y = ny - 1.5;
              const i0 = x | 0, i1 = i0 + 1;
              const j0 = y | 0, j1 = j0 + 1;
              const s1 = x - i0, s0 = 1 - s1;
              const t1 = y - j0, t0 = 1 - t1;
              dst[id] = s0 * (t0 * src[ix(i0, j0)] + t1 * src[ix(i0, j1)]) + s1 * (t0 * src[ix(i1, j0)] + t1 * src[ix(i1, j1)]);
            }
          }
          setBnd(dst, bnd);
        }

        function splatCPU(x, y, dx, dy, color, radius) {
          const cx = x * (nx - 1);
          const cy = y * (ny - 1);
          const rad = Math.max(nx, ny) * Math.sqrt(radius) * 18;
          const r2 = rad * rad;
          for (let j = 1; j < ny - 1; j++) {
            const py = j - cy;
            for (let i = 1; i < nx - 1; i++) {
              const px = (i - cx) * (canvas.width / Math.max(1, canvas.height));
              const d2 = px * px + py * py;
              if (d2 > r2 * 4) continue;
              const fall = Math.exp(-d2 / Math.max(0.0001, r2));
              const id = ix(i, j);
              u[id] += dx * fall * 0.08;
              v[id] += dy * fall * 0.08;
              r[id] += color[0] * fall * 1.2;
              g[id] += color[1] * fall * 1.2;
              b[id] += color[2] * fall * 1.2;
            }
          }
        }

        function splatPointers() {
          const aspect = canvas.width / Math.max(1, canvas.height);
          pointers.forEach((p) => {
            if (!p.down) return;
            let dx = (p.x - p.px) * 900;
            let dy = (p.y - p.py) * 900;
            if (!p.moved) { dx = (Math.random() - 0.5) * 20; dy = (Math.random() - 0.5) * 20; }
            const col = paletteColor(state.hueClock, Math.atan2(dy, dx));
            splatCPU(p.x, p.y, dx * aspect, dy, col, 0.0007);
            p.px = p.x; p.py = p.y; p.moved = false;
          });
        }

        function splatVents(now) {
          if (!state.currents) return;
          const aspect = canvas.width / Math.max(1, canvas.height);
          for (let i = 0; i < vents.length; i++) {
            const vt = vents[i];
            const ph = now * vt.speed + vt.seed * 6.28;
            const x = vt.cx + Math.cos(ph) * vt.orbit;
            const y = vt.cy + Math.sin(ph * 0.92) * vt.orbit * 0.62;
            const pulse = 0.45 + 0.55 * Math.sin(now * vt.breathe + vt.seed);
            if (pulse < 0.4) continue;
            splatCPU(x, y, -Math.sin(ph) * vt.force * pulse * aspect, Math.cos(ph) * vt.force * pulse, paletteColor(state.hueClock, vt.seed), vt.radius);
          }
        }

        function step(dt, now) {
          splatPointers();
          splatVents(now);
          const curlStr = state.swirl * 0.002;
          if (curlStr > 0) {
            for (let j = 1; j < ny - 1; j++) {
              for (let i = 1; i < nx - 1; i++) {
                const id = ix(i, j);
                const cr = 0.5 * (v[id + 1] - v[id - 1] - u[id + nx] + u[id - nx]);
                u[id] += -cr * curlStr;
                v[id] += cr * curlStr;
              }
            }
          }
          if (state.currents) {
            for (let j = 1; j < ny - 1; j++) {
              for (let i = 1; i < nx - 1; i++) {
                const id = ix(i, j);
                const x = i / nx - 0.5;
                const y = j / ny - 0.5;
                u[id] += -y * dt * 8;
                v[id] += x * dt * 8;
              }
            }
          }
          u0.set(u); v0.set(v);
          project();
          advect(u, u0, u0, v0, dt, 1);
          advect(v, v0, u0, v0, dt, 2);
          project();
          r0.set(r); g0.set(g); b0.set(b);
          advect(r, r0, u, v, dt, 0);
          advect(g, g0, u, v, dt, 0);
          advect(b, b0, u, v, dt, 0);
          const fade = 1 - state.fade * 0.0009;
          for (let i = 0; i < r.length; i++) {
            r[i] *= fade; g[i] *= fade; b[i] *= fade;
            u[i] *= fade + 0.004; v[i] *= fade + 0.004;
          }
        }

        function draw() {
          const data = pixels.data;
          for (let i = 0; i < nx * ny; i++) {
            const o = i * 4;
            data[o] = Math.min(255, r[i] * 220);
            data[o + 1] = Math.min(255, g[i] * 220);
            data[o + 2] = Math.min(255, b[i] * 220);
            data[o + 3] = 255;
          }
          ictx.putImageData(pixels, 0, 0);
          ctx.fillStyle = "#07080d";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }

        function clearTank() {
          u.fill(0); v.fill(0); r.fill(0); g.fill(0); b.fill(0);
        }

        rebuild();
        splatCPU(0.5, 0.5, 20, 12, paletteColor(0, 0.2), 0.003);

        let last = performance.now();
        let raf = 0;
        function frame(now) {
          raf = requestAnimationFrame(frame);
          const dt = Math.min(0.016666, (now - last) / 1000);
          last = now;
          state.hueClock = now * 0.001;
          if (!state.paused) step(dt, now * 0.001);
          draw();
        }
        raf = requestAnimationFrame(frame);
        window.addEventListener("resize", rebuild);

        return {
          clear: clearTank,
          rebuild,
          splat: splatCPU,
          stop() { cancelAnimationFrame(raf); },
          canvas
        };
      }

      function keyStir(e) {
        const dir = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, 1],
          ArrowDown: [0, -1]
        };
        const d = dir[e.key];
        if (!d || !engine) return;
        e.preventDefault();
        hideHint();
        const col = paletteColor(state.hueClock, 0.3);
        engine.splat(0.5, 0.5, d[0] * 220, d[1] * 220, col, 0.004);
      }

      let engine = null;
      try {
        const bundle = tryGL(tank);
        if (bundle) {
          engine = startGPU(bundle);
        } else {
          engine = startCPU();
          say("Running a simpler current on this device.");
        }
      } catch (err) {
        try {
          engine = startCPU();
          say("Running a simpler current on this device.");
        } catch (err2) {
          fail.hidden = false;
          failText.textContent = "This browser cannot draw the tank.";
          return;
        }
      }

      bindSurface(surface());

      function setPaused(p) {
        state.paused = p;
        pauseBtn.setAttribute("aria-pressed", p ? "true" : "false");
        pauseBtn.textContent = p ? "Resume" : "Pause";
        say(p ? "Paused" : "Running");
      }

      pauseBtn.addEventListener("click", () => setPaused(!state.paused));
      clearBtn.addEventListener("click", () => {
        engine.clear();
        say("Tank cleared");
      });
      chromeBtn.addEventListener("click", () => {
        const hidden = document.body.classList.toggle("chrome-hidden");
        chromeBtn.setAttribute("aria-expanded", hidden ? "false" : "true");
        chromeBtn.textContent = hidden ? "Show controls" : "Hide controls";
      });

      document.querySelectorAll("input[name=palette]").forEach((el) => {
        el.addEventListener("change", () => {
          if (!el.checked) return;
          state.palette = el.value;
          const names = { aurora: "Aurora", ember: "Ember", abyss: "Abyss", prism: "Prism" };
          say("Palette " + names[state.palette]);
        });
      });
      currentsEl.addEventListener("change", () => { state.currents = currentsEl.checked; });
      bloomEl.addEventListener("change", () => { state.bloom = bloomEl.checked; });
      sheenEl.addEventListener("change", () => { state.sheen = sheenEl.checked; });
      swirlEl.addEventListener("input", () => { state.swirl = Number(swirlEl.value); });
      fadeEl.addEventListener("input", () => { state.fade = Number(fadeEl.value); });
      qualityEl.addEventListener("change", () => {
        state.quality = qualityEl.value;
        engine.rebuild();
        say("Quality " + qualityEl.options[qualityEl.selectedIndex].text);
      });

      window.addEventListener("keydown", (e) => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
        if (e.code === "Space") { e.preventDefault(); setPaused(!state.paused); }
        else if (e.key === "c" || e.key === "C") { engine.clear(); say("Tank cleared"); }
        else if (e.key === "h" || e.key === "H") { chromeBtn.click(); }
        else if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
          keyStir(e);
        }
        else if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4") {
          const map = { 1: "aurora", 2: "ember", 3: "abyss", 4: "prism" };
          const radio = document.querySelector("input[name=palette][value='" + map[e.key] + "']");
          if (radio) { radio.checked = true; radio.dispatchEvent(new Event("change")); }
        }
      });
    })();
  </script>
</body>
</html>
