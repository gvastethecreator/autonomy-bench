<!DOCTYPE html>
<html lang="en" data-room="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>After Eleven — Listening room</title>
  <style>
    :root {
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-ui: "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "Cascadia Mono", "SFMono-Regular", "Segoe UI Mono", ui-monospace, Consolas, monospace;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-move: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-ui: cubic-bezier(0.2, 0, 0, 1);
      --r-app: 22px;
      --r-ctl: 8px;
      --r-sm: 6px;
      --bg: oklch(0.145 0.028 248);
      --desk: oklch(0.205 0.032 58);
      --chassis: oklch(0.198 0.022 52);
      --chassis-2: oklch(0.236 0.022 52);
      --inset: oklch(0.16 0.02 50);
      --ink: oklch(0.94 0.02 88);
      --ink-muted: oklch(0.74 0.028 78);
      --ink-subtle: oklch(0.62 0.03 72);
      --line: oklch(0.92 0.02 88 / 0.1);
      --accent: oklch(0.8 0.13 74);
      --accent-ink: oklch(0.22 0.04 55);
      --stylus: oklch(0.62 0.18 28);
      --ok: oklch(0.78 0.09 145);
      --lamp: oklch(0.78 0.12 74 / 0.28);
      --city: oklch(0.72 0.12 70);
      --window: oklch(0.12 0.03 250);
      --plinth: oklch(0.12 0.01 50);
      --paper: oklch(0.9 0.03 88);
      --focus: oklch(0.84 0.12 74);
      --energy: 0;
      color-scheme: dark;
    }

    [data-room="dawn"] {
      --bg: oklch(0.78 0.03 230);
      --desk: oklch(0.72 0.04 75);
      --chassis: oklch(0.93 0.02 88);
      --chassis-2: oklch(0.89 0.025 85);
      --inset: oklch(0.86 0.02 82);
      --ink: oklch(0.24 0.03 50);
      --ink-muted: oklch(0.42 0.03 55);
      --ink-subtle: oklch(0.5 0.03 58);
      --line: oklch(0.24 0.03 50 / 0.12);
      --accent: oklch(0.52 0.11 55);
      --accent-ink: oklch(0.97 0.02 90);
      --stylus: oklch(0.5 0.16 28);
      --ok: oklch(0.42 0.09 145);
      --lamp: oklch(0.9 0.04 90 / 0.12);
      --city: oklch(0.55 0.04 230);
      --window: oklch(0.82 0.03 220);
      --plinth: oklch(0.28 0.02 55);
      --paper: oklch(0.97 0.015 90);
      --focus: oklch(0.45 0.1 55);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    img { max-width: 100%; display: block; }
    button, input, select { font: inherit; color: inherit; }
    h1, h2, p { margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; }
    button {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    ::selection { background: oklch(0.78 0.12 74 / 0.35); color: var(--ink); }

    .skip {
      position: absolute;
      inset-inline-start: 12px;
      top: 12px;
      z-index: 20;
      padding: 8px 12px;
      background: var(--chassis);
      color: var(--ink);
      border-radius: var(--r-sm);
      transform: translateY(-120%);
      transition: transform 160ms var(--ease-out);
    }
    .skip:focus { transform: none; outline: 2px solid var(--focus); outline-offset: 2px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #atmosphere {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .lamp-wash {
      position: fixed;
      inset: -10% 10% auto;
      height: 46vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, var(--lamp), transparent 68%);
    }

    .desk {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      padding: 22px 22px 28px;
      padding-top: max(22px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      display: grid;
      align-items: center;
    }

    .player {
      width: min(1240px, 100%);
      margin-inline: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: min(820px, calc(100dvh - 50px));
      max-height: calc(100dvh - 50px);
      background:
        linear-gradient(180deg, oklch(1 0 0 / 0.04), transparent 18%),
        var(--chassis);
      border: 1px solid var(--line);
      border-radius: var(--r-app);
      box-shadow:
        0 1px 0 oklch(1 0 0 / 0.1) inset,
        0 30px 60px oklch(0.1 0.02 50 / 0.45),
        0 0 0 1px oklch(0.1 0.02 50 / 0.2);
      overflow: hidden;
      animation: chassis-in 520ms var(--ease-out) both;
    }

    @keyframes chassis-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 320px) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 18px 14px 16px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in oklab, var(--chassis) 82%, black);
    }
    [data-room="dawn"] .topbar {
      background: color-mix(in oklab, var(--chassis) 88%, white);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, oklch(0.92 0.08 85), oklch(0.7 0.14 70) 42%, oklch(0.4 0.08 55) 68%, oklch(0.22 0.04 50));
      box-shadow: 0 0 24px oklch(0.78 0.12 74 / 0.35);
      position: relative;
    }
    .mark::after {
      content: "";
      position: absolute;
      inset: 10px 16px 6px;
      background: oklch(0.18 0.03 50);
      border-radius: 0 0 8px 8px;
    }
    [data-room="dawn"] .mark {
      background: radial-gradient(circle at 50% 42%, oklch(0.96 0.04 90), oklch(0.78 0.08 75) 50%, oklch(0.55 0.06 60));
      box-shadow: none;
    }
    .wordmark {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .tag {
      color: var(--ink-subtle);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      background: var(--inset);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .search svg { flex: 0 0 18px; color: var(--ink-subtle); }
    .search input {
      flex: 1;
      min-width: 0;
      height: 38px;
      border: 0;
      background: transparent;
      outline: none;
      font-size: 16px;
    }
    .search input::placeholder { color: var(--ink-subtle); }
    .search:focus-within {
      border-color: color-mix(in oklab, var(--accent) 65%, var(--line));
      box-shadow: 0 0 0 3px oklch(0.8 0.12 74 / 0.18);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
    }
    #clock {
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
      min-width: 5.5ch;
      text-align: end;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: var(--r-ctl);
      border: 1px solid var(--line);
      background: var(--chassis-2);
      color: var(--ink);
      transition: background-color 150ms ease, border-color 150ms ease, transform 140ms var(--ease-ui);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:active { transform: scale(0.96); }

    .body {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 0;
    }

    .crate {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-inline-end: 1px solid var(--line);
      background: color-mix(in oklab, var(--chassis) 88%, black);
    }
    [data-room="dawn"] .crate {
      background: color-mix(in oklab, var(--chassis) 92%, oklch(0.82 0.03 80));
    }

    .crate-head {
      display: flex;
      gap: 6px;
      padding: 12px 12px 8px;
    }
    .tab {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--ink-muted);
      border: 1px solid transparent;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .tab[aria-selected="true"] {
      color: var(--accent-ink);
      background: var(--accent);
      border-color: color-mix(in oklab, var(--accent) 70%, black);
    }

    .crate-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 10px 16px;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklab, var(--ink-subtle) 50%, transparent) transparent;
    }
    .crate-list li { margin-block: 4px; }
    .row {
      width: 100%;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      text-align: start;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .row img {
      width: 48px;
      height: 48px;
      border-radius: 3px;
      object-fit: cover;
      outline: 1px solid oklch(1 0 0 / 0.1);
      background: var(--inset);
    }
    [data-room="dawn"] .row img { outline-color: oklch(0 0 0 / 0.1); }
    .row .meta { min-width: 0; }
    .row .t {
      display: block;
      font-weight: 600;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row .a {
      display: block;
      color: var(--ink-subtle);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row .dur {
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
      color: var(--ink-subtle);
      font-family: var(--font-mono);
    }
    .row[aria-current="true"] {
      background: color-mix(in oklab, var(--accent) 16%, var(--chassis-2));
      border-color: color-mix(in oklab, var(--accent) 35%, transparent);
    }
    .row .now {
      width: 12px;
      height: 12px;
      display: none;
      align-items: flex-end;
      gap: 2px;
      margin-inline-end: 2px;
    }
    .row[aria-current="true"] .now { display: inline-flex; }
    .row .now i {
      width: 2px;
      height: 4px;
      background: var(--accent);
      border-radius: 1px;
      transform-origin: bottom;
    }
    .empty {
      padding: 28px 16px;
      color: var(--ink-muted);
      text-align: start;
    }
    .empty p + p { margin-top: 6px; color: var(--ink-subtle); font-size: 0.9rem; }
    .empty button {
      margin-top: 14px;
      height: 36px;
      padding: 0 12px;
      border-radius: var(--r-ctl);
      border: 1px solid var(--line);
      background: var(--chassis-2);
    }

    .stage {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 22px 28px 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      background:
        radial-gradient(ellipse 70% 55% at 70% 18%, oklch(0.7 0.1 74 / 0.1), transparent 60%),
        linear-gradient(180deg, transparent, color-mix(in oklab, var(--inset) 55%, transparent));
    }

    .platter-scene {
      display: grid;
      grid-template-columns: minmax(180px, 280px) minmax(220px, 1fr);
      gap: 28px;
      align-items: center;
      justify-items: center;
    }

    .sleeve {
      width: min(280px, 100%);
      margin: 0;
      position: relative;
      transform: rotate(-2.2deg);
      transition: transform 400ms var(--ease-out), filter 180ms ease;
      filter: brightness(calc(0.94 + var(--energy) * 0.16));
    }
    .sleeve img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 3px;
      outline: 1px solid oklch(1 0 0 / 0.12);
      box-shadow:
        8px 18px 40px oklch(0.1 0.02 50 / 0.45),
        0 0 0 10px color-mix(in oklab, var(--paper) 88%, black);
    }
    [data-room="dawn"] .sleeve img {
      outline-color: oklch(0 0 0 / 0.1);
      box-shadow:
        8px 18px 36px oklch(0.4 0.03 50 / 0.22),
        0 0 0 10px var(--paper);
    }
    .sleeve figcaption {
      position: absolute;
      inset-inline-start: 12px;
      bottom: -34px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--ink-subtle);
    }

    .turntable {
      width: min(340px, 100%);
      aspect-ratio: 1;
      position: relative;
    }
    .plinth {
      position: absolute;
      inset: 8% 4% 4%;
      background:
        radial-gradient(circle at 50% 50%, oklch(0.22 0.01 50), var(--plinth) 62%);
      border-radius: 8px;
      box-shadow:
        0 1px 0 oklch(1 0 0 / 0.12) inset,
        0 16px 28px oklch(0.1 0.02 50 / 0.4);
    }
    .vinyl {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%,
          oklch(0.86 0.04 85) 0 13%,
          oklch(0.22 0.02 50) 13.2% 14.4%,
          transparent 14.6%),
        repeating-radial-gradient(circle at 50% 50%,
          oklch(0.08 0.01 50) 0 2px,
          oklch(0.15 0.012 50) 3px 4px);
      box-shadow:
        0 0 0 1px oklch(1 0 0 / 0.08),
        0 10px 24px oklch(0.05 0.02 50 / 0.55);
      animation: spin 1.8s linear infinite;
      animation-play-state: paused;
    }
    .is-playing .vinyl { animation-play-state: running; }
    .vlabel {
      position: absolute;
      inset: 36%;
      border-radius: 50%;
      background: oklch(0.78 0.08 72);
      color: oklch(0.2 0.04 50);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.15;
      outline: 1px solid oklch(0 0 0 / 0.15);
    }
    .spindle {
      position: absolute;
      inset: 48.5%;
      border-radius: 50%;
      background: oklch(0.7 0.02 80);
      box-shadow: 0 0 0 2px oklch(0.3 0.02 50);
      z-index: 2;
    }
    .arm {
      position: absolute;
      inset-inline-end: 10%;
      top: 8%;
      width: 14px;
      height: 62%;
      transform-origin: 50% 8px;
      transform: rotate(-32deg);
      transition: transform 420ms var(--ease-out);
      z-index: 3;
    }
    .is-playing .arm { transform: rotate(16deg); }
    .arm .pivot {
      width: 16px;
      height: 16px;
      margin-inline: -1px;
      border-radius: 50%;
      background: linear-gradient(180deg, oklch(0.82 0.06 80), oklch(0.55 0.08 70));
      box-shadow: 0 2px 4px oklch(0 0 0 / 0.4);
    }
    .arm .tube {
      width: 5px;
      height: 78%;
      margin-inline: auto;
      background: linear-gradient(180deg, oklch(0.72 0.05 80), oklch(0.45 0.04 70));
      border-radius: 2px;
    }
    .arm .head {
      width: 16px;
      height: 22px;
      margin: -2px auto 0;
      background: oklch(0.3 0.02 50);
      border-radius: 2px 2px 3px 3px;
      position: relative;
    }
    .arm .head::after {
      content: "";
      position: absolute;
      inset-inline-start: 6px;
      bottom: -6px;
      width: 3px;
      height: 8px;
      background: var(--stylus);
      border-radius: 1px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .copy { min-width: 0; align-self: end; }
    .cat {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-subtle);
      margin-bottom: 8px;
    }
    #title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.4vw, 3.5rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.028em;
      text-wrap: balance;
      max-width: 18ch;
    }
    .artist {
      margin-top: 8px;
      font-size: 1.05rem;
      color: var(--ink-muted);
    }
    .liner {
      margin-top: 14px;
      max-width: 46ch;
      color: var(--ink-muted);
      line-height: 1.55;
      text-wrap: pretty;
    }
    .upnext {
      margin-top: 16px;
      color: var(--ink-subtle);
      font-size: 0.88rem;
    }
    .hint {
      margin-top: 12px;
      color: var(--accent);
      font-size: 0.88rem;
    }
    .hint[hidden] { display: none; }

    .transport {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      background:
        linear-gradient(180deg, oklch(1 0 0 / 0.04), transparent 40%),
        var(--inset);
    }

    .transport-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctl {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--ink);
      border: 1px solid transparent;
      position: relative;
      transition: background-color 150ms ease, transform 140ms var(--ease-ui), color 150ms ease;
    }
    .ctl svg { width: 22px; height: 22px; overflow: visible; }
    .ctl:active { transform: scale(0.96); }
    .ctl[aria-pressed="true"] { color: var(--accent); }
    .play {
      width: 56px;
      height: 56px;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 8px 18px oklch(0.6 0.12 74 / 0.28);
    }
    .play svg { width: 24px; height: 24px; }
    .play .icon-play { transform: translateX(1px); }
    .play .ico {
      position: absolute;
      transition: opacity 180ms var(--ease-ui), transform 180ms var(--ease-ui), filter 180ms var(--ease-ui);
    }
    .play .ico.is-out {
      opacity: 0;
      transform: scale(0.25);
      filter: blur(4px);
      pointer-events: none;
    }

    .timeline {
      display: grid;
      grid-template-columns: 5.5ch 1fr 5.5ch;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .time {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
      color: var(--ink-subtle);
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 40px;
      background: transparent;
      margin: 0;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: linear-gradient(90deg, var(--accent) var(--p, 0%), color-mix(in oklab, var(--ink) 18%, transparent) var(--p, 0%));
      border-radius: 99px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--paper);
      border: 1px solid color-mix(in oklab, var(--accent) 40%, black);
      box-shadow: 0 1px 4px oklch(0 0 0 / 0.35);
    }
    input[type="range"]::-moz-range-track {
      height: 4px;
      background: color-mix(in oklab, var(--ink) 18%, transparent);
      border-radius: 99px;
    }
    input[type="range"]::-moz-range-progress {
      height: 4px;
      background: var(--accent);
      border-radius: 99px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--paper);
      border: 1px solid color-mix(in oklab, var(--accent) 40%, black);
    }

    .meter-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .vu {
      display: grid;
      grid-template-columns: 8px 8px;
      gap: 4px;
      height: 36px;

      empty.hidden = true;
      list.hidden = false;
      items.forEach((t) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row";
        btn.setAttribute("aria-current", t.id === TRACKS[state.index].id ? "true" : "false");
        const img = document.createElement("img");
        img.src = covers[t.id];
        img.alt = "";
        const meta = document.createElement("span");
        meta.className = "meta";
        const title = document.createElement("span");
        title.className = "t";
        title.textContent = t.title;
        const artist = document.createElement("span");
        artist.className = "a";
        artist.textContent = t.artist;
        const now = document.createElement("span");
        now.className = "now";
        now.setAttribute("aria-hidden", "true");
        now.innerHTML = "<i></i><i></i><i></i>";
        meta.append(title, artist);
        const dur = document.createElement("span");
        dur.className = "dur";
        dur.textContent = fmt(t.duration);
        btn.append(img, meta, dur);
        title.prepend(now);
        btn.addEventListener("click", () => {
          const idx = TRACKS.findIndex((x) => x.id === t.id);
          selectTrack(idx, true);
        });
        li.append(btn);
        list.append(li);
      });
    }

    function renderNow() {
      const t = TRACKS[state.index];
      $("title").textContent = t.title;
      $("artist").textContent = t.artist;
      $("liner").textContent = t.liner;
      $("metaLine").textContent = t.cat + "  ·  " + t.album + "  ·  " + t.year;
      $("catLabel").textContent = t.cat;
      $("cover").src = covers[t.id];
      $("cover").alt = t.coverAlt;
      $("vlabel").textContent = t.cat.replace("AE-", "");
      const nxt = nextIndex(1);
      $("upnext").textContent = nxt === null ? "End of program" : "Up next: " + TRACKS[nxt].title;
      $("seek").max = "1000";
      $("tRemain").textContent = fmt(t.duration);
      const saved = state.saved.includes(t.id);
      $("saveBtn").setAttribute("aria-pressed", saved ? "true" : "false");
      $("saveBtn").setAttribute("aria-label", saved ? "Remove from night crate" : "Save to night crate");
      document.title = t.title + " — After Eleven";
      renderCrate();
      if (navigator.mediaSession) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: t.title,
          artist: t.artist,
          album: t.album,
          artwork: [{ src: covers[t.id], sizes: "420x420", type: "image/png" }]
        });
      }
    }

    function setPlayingUI(on) {
      $("player").classList.toggle("is-playing", on);
      $("playBtn").setAttribute("aria-label", on ? "Pause" : "Play");
      $("playBtn").querySelector(".icon-play").classList.toggle("is-out", on);
      $("playBtn").querySelector(".icon-pause").classList.toggle("is-out", !on);
      if (navigator.mediaSession) navigator.mediaSession.playbackState = on ? "playing" : "paused";
    }
    async function play() {
      ensureAudio();
      if (ctx.state === "suspended") await ctx.resume();
      if (!state.playing) {
        const t = TRACKS[state.index];
        const ratio = Number($("seek").value) / 1000;
        silence(0.03);
        scheduleFrom(Math.floor(ratio * t.bars));
        if (!state.startedOnce) crackle();
        state.playing = true;
        state.startedOnce = true;
        $("hint").hidden = true;
        timer = setInterval(scheduler, 25);
        scheduler();
        setPlayingUI(true);
        announce("Playing " + t.title + " by " + t.artist);
      }
    }
    function pause(atEnd) {
      state.playing = false;
      clearInterval(timer);
      silence(0.05);
      if (atEnd) {
        $("seek").value = "0";
        $("seek").style.setProperty("--p", "0%");
        $("tElapsed").textContent = "0:00";
        $("tRemain").textContent = fmt(TRACKS[state.index].duration);
      } else if (ctx) {
        const e = elapsedNow();
        const d = TRACKS[state.index].duration;
        $("seek").value = String(Math.round((e / d) * 1000));
      }
      setPlayingUI(false);
    }
    async function toggle() {
      if (state.playing) pause(false);
      else await play();
    }
    function selectTrack(i, autoplay) {
      state.index = i;
      $("seek").value = "0";
      $("seek").style.setProperty("--p", "0%");
      saveStore();
      renderNow();
      if (autoplay) {
        if (ctx) silence(0.06);
        state.playing = false;
        clearInterval(timer);
        play();
      } else if (state.playing) {
        silence(0.06);
        scheduleFrom(0);
      }
    }
    function seekTo(ratio) {
      const t = TRACKS[state.index];
      ratio = Math.min(1, Math.max(0, ratio));
      $("seek").value = String(Math.round(ratio * 1000));
      $("seek").style.setProperty("--p", (ratio * 100) + "%");
      $("tElapsed").textContent = fmt(ratio * t.duration);
      $("tRemain").textContent = fmt(t.duration - ratio * t.duration);
      if (state.playing) {
        silence(0.03);
        scheduleFrom(Math.floor(ratio * t.bars));
      }
    }

    function setView(view) {
      state.view = view;
      $("tabTonight").setAttribute("aria-selected", view === "tonight" ? "true" : "false");
      $("tabSaved").setAttribute("aria-selected", view === "saved" ? "true" : "false");
      renderCrate();
    }

    $("playBtn").addEventListener("click", toggle);
    $("prevBtn").addEventListener("click", () => {
      if (elapsedNow() > 3) seekTo(0);
      else {
        const n = nextIndex(-1);
        if (n !== null) selectTrack(n, state.playing);
      }
    });
    $("nextBtn").addEventListener("click", () => {
      const n = nextIndex(1);
      if (n !== null) selectTrack(n, state.playing || state.startedOnce);
    });
    $("shuffleBtn").addEventListener("click", () => {
      state.shuffle = !state.shuffle;
      $("shuffleBtn").setAttribute("aria-pressed", state.shuffle ? "true" : "false");
      if (state.shuffle) reshuffle();
      saveStore();
      renderNow();
    });
    $("repeatBtn").addEventListener("click", () => {
      state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
      const labels = { off: "Repeat off", all: "Repeat all", one: "Repeat one" };
      $("repeatBtn").setAttribute("aria-pressed", state.repeat === "off" ? "false" : "true");
      $("repeatBtn").setAttribute("aria-label", labels[state.repeat]);
      saveStore();
      renderNow();
    });
    $("saveBtn").addEventListener("click", () => {
      const id = TRACKS[state.index].id;
      if (state.saved.includes(id)) state.saved = state.saved.filter((x) => x !== id);
      else state.saved.push(id);
      saveStore();
      renderNow();
      announce(state.saved.includes(id) ? "Saved to night crate" : "Removed from night crate");
    });
    $("muteBtn").addEventListener("click", () => {
      state.muted = !state.muted;
      $("muteBtn").setAttribute("aria-pressed", state.muted ? "true" : "false");
      $("muteBtn").setAttribute("aria-label", state.muted ? "Unmute" : "Mute");
      if (ctx) applyVolume();
    });
    $("volume").addEventListener("input", (e) => {
      state.volume = Number(e.target.value);
      state.muted = false;
      $("muteBtn").setAttribute("aria-pressed", "false");
      if (ctx) applyVolume();
      saveStore();
    });
    $("seek").addEventListener("pointerdown", () => { state.seekDragging = true; });
    $("seek").addEventListener("pointerup", () => { state.seekDragging = false; });
    $("seek").addEventListener("input", (e) => seekTo(Number(e.target.value) / 1000));
    $("q").addEventListener("input", (e) => { state.query = e.target.value; renderCrate(); });
    document.querySelector(".search").addEventListener("submit", (e) => e.preventDefault());
    $("tabTonight").addEventListener("click", () => setView("tonight"));
    $("tabSaved").addEventListener("click", () => setView("saved"));
    $("roomBtn").addEventListener("click", () => {
      setRoom(document.documentElement.dataset.room === "night" ? "dawn" : "night");
    });

    document.addEventListener("keydown", (e) => {
      const typing = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
      if (e.key === "/" && !typing) {
        e.preventDefault();
        $("q").focus();
        return;
      }
      if (typing) {
        if (e.key === "Escape") e.target.blur();
        return;
      }
      if (e.key === " " || e.code === "Space") { e.preventDefault(); toggle(); }
      else if (e.key === "ArrowRight" && e.shiftKey) { e.preventDefault(); $("nextBtn").click(); }
      else if (e.key === "ArrowLeft" && e.shiftKey) { e.preventDefault(); $("prevBtn").click(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); seekTo((elapsedNow() + 8) / TRACKS[state.index].duration); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); seekTo((elapsedNow() - 8) / TRACKS[state.index].duration); }
      else if (e.key === "ArrowUp" || e.key === "]") {
        e.preventDefault();
        state.volume = Math.min(1, state.volume + 0.05);
        $("volume").value = String(state.volume);
        if (ctx) applyVolume();
      }
      else if (e.key === "ArrowDown" || e.key === "[") {
        e.preventDefault();
        state.volume = Math.max(0, state.volume - 0.05);
        $("volume").value = String(state.volume);
        if (ctx) applyVolume();
      }
      else if (e.key === "m" || e.key === "M") $("muteBtn").click();
      else if (e.key === "f" || e.key === "F") $("saveBtn").click();
      else if (e.key === "s" || e.key === "S") $("shuffleBtn").click();
      else if (e.key === "r" || e.key === "R") $("repeatBtn").click();
    });

    if (navigator.mediaSession) {
      navigator.mediaSession.setActionHandler("play", () => play());
      navigator.mediaSession.setActionHandler("pause", () => pause(false));
      navigator.mediaSession.setActionHandler("previoustrack", () => $("prevBtn").click());
      navigator.mediaSession.setActionHandler("nexttrack", () => $("nextBtn").click());
      navigator.mediaSession.setActionHandler("seekto", (d) => {
        if (typeof d.seekTime === "number") seekTo(d.seekTime / TRACKS[state.index].duration);
      });
    }

    const vu = $("vu");
    for (let c = 0; c < 2; c++) {
      const col = document.createElement("span");
      for (let i = 0; i < 12; i++) col.append(document.createElement("i"));
      vu.append(col);
    }
    const timeBuf = new Uint8Array(1024);
    function rms(analyser) {
      if (!analyser) return 0;
      analyser.getByteTimeDomainData(timeBuf);
      let s = 0;
      for (let i = 0; i < analyser.fftSize; i++) {
        const v = (timeBuf[i] - 128) / 128;
        s += v * v;
      }
      return Math.sqrt(s / analyser.fftSize);
    }
    function paintVu(col, level) {
      const n = Math.min(12, Math.floor(Math.pow(level * 3.4, 0.72) * 12));
      const cells = col.querySelectorAll("i");
      cells.forEach((cell, i) => {
        const on = (11 - i) < n;
        cell.classList.toggle("on", on);
        cell.classList.toggle("hot", on && i < 2);
      });
    }
    function tickUI() {
      if (state.playing && !state.seekDragging) {
        const t = TRACKS[state.index];
        const e = elapsedNow();
        const p = e / t.duration;
        $("seek").value = String(Math.round(p * 1000));
        $("seek").style.setProperty("--p", (p * 100) + "%");
        $("tElapsed").textContent = fmt(e);
        $("tRemain").textContent = fmt(Math.max(0, t.duration - e));
        $("seek").setAttribute("aria-valuetext", fmt(e) + " of " + fmt(t.duration));
      }
      const l = rms(analyserL);
      const r = rms(analyserR);
      paintVu(vu.children[0], l);
      paintVu(vu.children[1], r || l);
      const energy = Math.min(1, (l + r) * 4);
      document.documentElement.style.setProperty("--energy", String(state.playing ? energy : 0));
      requestAnimationFrame(tickUI);
    }

    function tickClock() {
      const d = new Date();
      const formatted = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(d);
      $("clock").textContent = formatted;
      $("clock").dateTime = d.toISOString();
    }

    const sky = $("atmosphere");
    const sctx = sky.getContext("2d");
    const drops = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), z: 0.4 + Math.random() * 0.6, len: 8 + Math.random() * 14 }));
    const windows = Array.from({ length: 46 }, () => ({
      x: Math.random(),
      y: 0.08 + Math.random() * 0.45,
      w: 0.006 + Math.random() * 0.01,
      h: 0.01 + Math.random() * 0.018,
      a: 0.15 + Math.random() * 0.7,
      warm: Math.random() > 0.35
    }));
    function sizeSky() {
      sky.width = Math.floor(window.innerWidth * devicePixelRatio);
      sky.height = Math.floor(window.innerHeight * devicePixelRatio);
    }
    function drawSky(ts) {
      const w = sky.width, h = sky.height;
      const dawn = document.documentElement.dataset.room === "dawn";
      const g = sctx.createLinearGradient(0, 0, 0, h);
      if (dawn) {
        g.addColorStop(0, "#b9c6d4");
        g.addColorStop(0.45, "#c9b79a");
        g.addColorStop(1, "#8a6a48");
      } else {
        g.addColorStop(0, "#0b1020");
        g.addColorStop(0.55, "#141018");
        g.addColorStop(1, "#1a140e");
      }
      sctx.fillStyle = g;
      sctx.fillRect(0, 0, w, h);
      windows.forEach((win) => {
        let a = win.a;
        if (!dawn && !prefersReduce() && Math.sin(ts / 700 + win.x * 20) > 0.92) a *= 0.35;
        sctx.fillStyle = win.warm
          ? (dawn ? "rgba(80,70,50," + (a * 0.35) + ")" : "rgba(232,170,70," + a + ")")
          : (dawn ? "rgba(70,90,110," + (a * 0.25) + ")" : "rgba(140,170,200," + (a * 0.35) + ")");
        sctx.fillRect(win.x * w, win.y * h, win.w * w, win.h * h);
      });
      if (!dawn && !prefersReduce()) {
        sctx.strokeStyle = "rgba(180,200,220,0.22)";
        sctx.lineWidth = 1.2 * devicePixelRatio;
        drops.forEach((d) => {
          d.y += 0.011 * d.z;
          if (d.y > 1) { d.y = -0.05; d.x = Math.random(); }
          sctx.beginPath();
          sctx.moveTo(d.x * w, d.y * h);
          sctx.lineTo(d.x * w + 0.4, d.y * h + d.len * d.z * devicePixelRatio);
          sctx.stroke();
        });
      }
      requestAnimationFrame(drawSky);
    }

    $("volume").value = String(state.volume);
    $("shuffleBtn").setAttribute("aria-pressed", state.shuffle ? "true" : "false");
    $("repeatBtn").setAttribute("aria-pressed", state.repeat === "off" ? "false" : "true");
    $("repeatBtn").setAttribute("aria-label", ({ off: "Repeat off", all: "Repeat all", one: "Repeat one" })[state.repeat]);
    if (state.shuffle) reshuffle();
    setRoom(document.documentElement.dataset.room || "night");
    renderNow();
    tickClock();
    setInterval(tickClock, 10000);
    sizeSky();
    window.addEventListener("resize", sizeSky);
    requestAnimationFrame(tickUI);
    requestAnimationFrame(drawSky);

    const nowBars = document.querySelectorAll(".row[aria-current='true'] .now i");
    function pulseEq() {
      document.querySelectorAll(".row[aria-current='true'] .now i").forEach((el, i) => {
        if (prefersReduce() || !state.playing) {
          el.style.height = "6px";
          return;
        }
        el.style.height = (4 + Math.abs(Math.sin(performance.now() / 180 + i)) * 8) + "px";
      });
      requestAnimationFrame(pulseEq);
    }
    requestAnimationFrame(pulseEq);
  </script>
</body>
</html>
