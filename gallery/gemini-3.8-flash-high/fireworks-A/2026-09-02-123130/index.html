<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spectacular Fireworks Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030308;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e0e6ed;
    }

    canvas#display {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      z-index: 1;
    }

    /* UI Header & Overlays */
    .overlay-ui {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .overlay-ui.hidden {
      opacity: 0 !important;
      transform: translateY(-10px);
      pointer-events: none !important;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    header.top-bar {
      top: 16px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #fff 20%, #ffd066 60%, #ff5277 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 200, 100, 0.4);
    }

    .tagline {
      font-size: 0.78rem;
      color: #8c9ba5;
      letter-spacing: 0.02em;
    }

    /* Quick Action Pill Bar */
    .quick-actions {
      top: 16px;
      right: 20px;
      display: flex;
      gap: 10px;
    }

    button.glass-btn {
      background: rgba(20, 24, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    button.glass-btn:hover {
      background: rgba(40, 50, 80, 0.75);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    button.glass-btn:active {
      transform: translateY(1px);
    }

    button.glass-btn.active {
      background: rgba(255, 180, 50, 0.25);
      border-color: rgba(255, 200, 80, 0.6);
      color: #ffe699;
      box-shadow: 0 0 16px rgba(255, 180, 50, 0.35);
    }

    button.finale-btn {
      background: linear-gradient(135deg, #ff3366, #ff9900);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-weight: 600;
      animation: pulse-glow 2.5s infinite;
    }

    button.finale-btn:hover {
      background: linear-gradient(135deg, #ff4d7d, #ffad33);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(255, 80, 40, 0.6);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 14px rgba(255, 80, 50, 0.4); }
      50% { box-shadow: 0 0 26px rgba(255, 160, 40, 0.8); }
    }

    /* Control Panel Drawer */
    .control-panel {
      bottom: 20px;
      right: 20px;
      width: 290px;
      background: rgba(13, 16, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .control-val {
      color: #38bdf8;
      font-weight: 600;
    }

    select, input[type="range"] {
      width: 100%;
      background: rgba(30, 36, 52, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e2e8f0;
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:hover, select:focus {
      border-color: rgba(255, 200, 80, 0.5);
    }

    input[type="range"] {
      -webkit-appearance: none;
      height: 6px;
      padding: 0;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #7dd3fc;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-switch {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      transition: .3s;
    }

    .slider-switch:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider-switch {
      background-color: #38bdf8;
    }

    input:checked + .slider-switch:before {
      transform: translateX(16px);
    }

    /* Bottom Left Hints */
    .hints-bar {
      bottom: 18px;
      left: 20px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      gap: 14px;
      align-items: center;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
    }

    .hint-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.8);
      font-family: monospace;
      font-size: 0.72rem;
    }

    /* Toggle visibility button */
    #toggle-ui-btn {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      opacity: 0.65;
    }

    #toggle-ui-btn:hover {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .control-panel {
        width: 250px;
        right: 12px;
        bottom: 60px;
        padding: 12px 14px;
      }
      .hints-bar {
        display: none;
      }
      header.top-bar h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="display"></canvas>

  <!-- Top Header -->
  <header class="overlay-ui top-bar">
    <div class="title-row">
      <h1>🎆 Fireworks Odyssey</h1>
    </div>
    <div class="tagline">Interactive Atmospheric Pyrotechnic Simulation</div>
  </header>

  <!-- Top Right Action Buttons -->
  <div class="overlay-ui quick-actions interactive">
    <button id="auto-btn" class="glass-btn active" title="Toggle Auto Show">
      <span class="icon">✨</span> Auto Show: ON
    </button>
    <button id="sound-btn" class="glass-btn" title="Toggle Sound Synthesizer">
      <span class="icon">🔇</span> Sound: OFF
    </button>
    <button id="finale-btn" class="glass-btn finale-btn" title="Trigger Grand Finale">
      <span class="icon">💥</span> GRAND FINALE
    </button>
  </div>

  <!-- Interactive Control Panel -->
  <div class="overlay-ui control-panel interactive" id="control-panel">
    <div class="panel-header">
      <span class="panel-title">Show Director</span>
      <span style="font-size:0.75rem; color:#64748b;">v2.0</span>
    </div>

    <!-- Shell Type -->
    <div class="control-group">
      <label class="control-label" for="shell-type">Shell Style</label>
      <select id="shell-type">
        <option value="random">🎲 Mixed / Surprise</option>
        <option value="peony">🌸 Chrysanthemum & Peony</option>
        <option value="willow">🌾 Golden Willow & Kamuro</option>
        <option value="ring">🪐 Saturn Rings</option>
        <option value="heart">💖 Loving Heart</option>
        <option value="crossette">⚡ Crossette Multi-Burst</option>
        <option value="strobe">✨ Strobe & Glitter</option>
        <option value="crackle">🐉 Dragon Egg Crackle</option>
        <option value="spiral">🌀 Galaxy Spiral</option>
      </select>
    </div>

    <!-- Palette -->
    <div class="control-group">
      <label class="control-label" for="palette-select">Color Theme</label>
      <select id="palette-select">
        <option value="vibrant">🌈 Vivid Rainbow</option>
        <option value="gold">👑 Royal Gold & Pearl</option>
        <option value="neon">🌆 Cyberpunk Neon</option>
        <option value="sunset">🌅 Sunset Flame</option>
        <option value="emerald">🌲 Emerald Aurora</option>
        <option value="sapphire">💎 Diamond & Sapphire</option>
      </select>
    </div>

    <!-- Auto Launch Cadence Slider -->
    <div class="control-group">
      <div class="control-label">
        <span>Show Cadence</span>
        <span id="cadence-val" class="control-val">Medium</span>
      </div>
      <input type="range" id="cadence-slider" min="1" max="5" value="3" step="1">
    </div>

    <!-- Particle Density -->
    <div class="control-group">
      <div class="control-label">
        <span>Particle Density</span>
        <span id="density-val" class="control-val">Normal (100%)</span>
      </div>
      <input type="range" id="density-slider" min="50" max="180" value="100" step="10">
    </div>

    <!-- Trail Persistence -->
    <div class="control-group">
      <div class="control-label">
        <span>Trail Persistence</span>
        <span id="trail-val" class="control-val">Smooth (85%)</span>
      </div>
      <input type="range" id="trail-slider" min="60" max="95" value="85" step="5">
    </div>

    <!-- City & Water Reflection Toggle -->
    <div class="toggle-row">
      <span class="control-label" style="margin:0;">Water & Cityscape</span>
      <label class="toggle-switch">
        <input type="checkbox" id="reflection-toggle" checked>
        <span class="slider-switch"></span>
      </label>
    </div>

    <!-- Screen Flash Toggle -->
    <div class="toggle-row">
      <span class="control-label" style="margin:0;">Sky Flash Bloom</span>
      <label class="toggle-switch">
        <input type="checkbox" id="flash-toggle" checked>
        <span class="slider-switch"></span>
      </label>
    </div>
  </div>

  <!-- Bottom Key Shortcuts -->
  <div class="overlay-ui hints-bar">
    <span><span class="hint-chip">Click / Drag</span> Launch firework</span>
    <span><span class="hint-chip">Spacebar</span> Grand Finale</span>
    <span><span class="hint-chip">H</span> Toggle Controls</span>
    <span><span class="hint-chip">F</span> Fullscreen</span>
  </div>

  <button id="toggle-ui-btn" class="glass-btn interactive">
    Hide Controls [H]
  </button>

  <script>
    /* ==========================================================================
       FIREWORKS ODYSSEY ENGINE
       High-performance procedural canvas pyrotechnic simulation with Web Audio
       ========================================================================== */

    const canvas = document.getElementById('display');
    const ctx = canvas.getContext('2d', { alpha: false });

    // State & Config
    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    let autoLaunch = true;
    let autoLaunchTimer = 0;
    let autoCadenceLevel = 3; // 1 (Relaxed) to 5 (Rapid)
    let soundEnabled = false;
    let masterVolume = 0.65;
    let densityScale = 1.0;
    let trailDecay = 0.15; // Corresponding to 85% persistence
    let showCityReflection = true;
    let screenFlashEnabled = true;
    let selectedShell = 'random';
    let selectedPalette = 'vibrant';
    let uiVisible = true;

    // Simulation collections
    const rockets = [];
    const particles = [];
    const ambientStars = [];
    const skyFlashes = [];
    let skylinePoints = [];
    let skylineWindows = [];

    // Timing
    let lastTime = performance.now();

    /* ==========================================================================
       COLOR PALETTES
       ========================================================================== */
    const PALETTES = {
      vibrant: [
        { h: 350, s: 100, l: 62 }, // Bright Crimson
        { h: 32,  s: 100, l: 58 }, // Amber Orange
        { h: 54,  s: 100, l: 62 }, // Golden Yellow
        { h: 140, s: 100, l: 60 }, // Electric Green
        { h: 190, s: 100, l: 60 }, // Cyan Turquoise
        { h: 260, s: 100, l: 66 }, // Violet
        { h: 315, s: 100, l: 64 }, // Hot Magenta
        { h: 0,   s: 0,   l: 98 }  // Diamond White
      ],
      gold: [
        { h: 42,  s: 100, l: 65 }, // Regal Gold
        { h: 35,  s: 90,  l: 52 }, // Deep Amber
        { h: 48,  s: 100, l: 75 }, // Champagne
        { h: 25,  s: 95,  l: 58 }, // Bronze Gold
        { h: 55,  s: 90,  l: 90 }  // Pearl White
      ],
      neon: [
        { h: 185, s: 100, l: 55 }, // Electric Cyan
        { h: 320, s: 100, l: 60 }, // Synth Magenta
        { h: 275, s: 100, l: 65 }, // Laser Purple
        { h: 60,  s: 100, l: 55 }, // Acid Lime
        { h: 15,  s: 100, l: 62 }  // Neon Coral
      ],
      sunset: [
        { h: 350, s: 95,  l: 58 }, // Ruby
        { h: 15,  s: 100, l: 56 }, // Sunset Orange
        { h: 35,  s: 100, l: 60 }, // Warm Gold
        { h: 330, s: 85,  l: 65 }, // Rose Twilight
        { h: 280, s: 70,  l: 45 }  // Deep Twilight Purple
      ],
      emerald: [
        { h: 155, s: 100, l: 55 }, // Vibrant Emerald
        { h: 175, s: 100, l: 50 }, // Seafoam
        { h: 130, s: 90,  l: 60 }, // Mint
        { h: 80,  s: 100, l: 60 }, // Chartreuse
        { h: 195, s: 90,  l: 75 }  // Glacial Blue
      ],
      sapphire: [
        { h: 215, s: 100, l: 60 }, // Royal Sapphire
        { h: 195, s: 100, l: 62 }, // Sky Blue
        { h: 240, s: 95,  l: 68 }, // Periwinkle
        { h: 270, s: 80,  l: 75 }, // Lilac
        { h: 180, s: 20,  l: 95 }  // Diamond Ice
      ]
    };

    function pickColor(paletteName) {
      const palette = PALETTES[paletteName] || PALETTES.vibrant;
      return palette[Math.floor(Math.random() * palette.length)];
    }

    function colorToRgba(c, alpha = 1) {
      return `hsla(${c.h}, ${c.s}%, ${c.l}%, ${alpha})`;
    }

    /* ==========================================================================
       WEB AUDIO SYNTHESIZER
       ========================================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playLaunchSound(xRatio) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const duration = 0.45;

        // White noise whoosh
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(450, t);
        filter.frequency.exponentialRampToValueAtTime(1600, t + duration * 0.9);
        filter.Q.setValueAtTime(3.5, t);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01 * masterVolume, t);
        gain.gain.linearRampToValueAtTime(0.18 * masterVolume, t + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if (panner) {
          panner.pan.setValueAtTime(Math.max(-1, Math.min(1, (xRatio - 0.5) * 1.8)), t);
          noise.connect(filter).connect(gain).connect(panner).connect(audioCtx.destination);
        } else {
          noise.connect(filter).connect(gain).connect(audioCtx.destination);
        }

        noise.start(t);
        noise.stop(t + duration);
      } catch (e) {}
    }

    function playExplodeSound(xRatio, intensity = 1.0, isCrackling = false) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const duration = 0.7;

        // 1. Low Thud / Sub Boom
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(110 * intensity, t);
        osc.frequency.exponentialRampToValueAtTime(26, t + 0.4);

        oscGain.gain.setValueAtTime(0.42 * masterVolume * intensity, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

        // 2. Blast Noise with Lowpass
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * (i / bufferSize));
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200 * intensity, t);
        filter.frequency.exponentialRampToValueAtTime(90, t + 0.55);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.48 * masterVolume * intensity, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if (panner) {
          panner.pan.setValueAtTime(Math.max(-1, Math.min(1, (xRatio - 0.5) * 1.8)), t);
          osc.connect(oscGain).connect(panner);
          noise.connect(filter).connect(noiseGain).connect(panner);
          panner.connect(audioCtx.destination);
        } else {
          osc.connect(oscGain).connect(audioCtx.destination);
          noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
        }

        osc.start(t);
        osc.stop(t + 0.5);
        noise.start(t);
        noise.stop(t + duration);

        if (isCrackling) {
          triggerCracklePops(xRatio, t + 0.18, 12);
        }
      } catch (e) {}
    }

    function triggerCracklePops(xRatio, startTime, count) {
      if (!soundEnabled || !audioCtx) return;
      try {
        for (let i = 0; i < count; i++) {
          const popTime = startTime + Math.random() * 0.5;
          const popDur = 0.04 + Math.random() * 0.04;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800 + Math.random() * 2400, popTime);

          gain.gain.setValueAtTime(0.12 * masterVolume, popTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, popTime + popDur);

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1000, popTime);

          osc.connect(filter).connect(gain).connect(audioCtx.destination);
          osc.start(popTime);
          osc.stop(popTime + popDur);
        }
      } catch (e) {}
    }

    /* ==========================================================================
       SCENERY & ENVIRONMENT
       ========================================================================== */
    function initStars() {
      ambientStars.length = 0;
      const count = Math.floor((width * height) / 9000);
      for (let i = 0; i < count; i++) {
        ambientStars.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.78),
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.2,
          twinkleSpeed: Math.random() * 0.03 + 0.01,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function generateCityscape() {
      skylinePoints = [];
      skylineWindows = [];
      const horizonY = height * 0.84;
      let currX = 0;

      while (currX < width) {
        const bWidth = Math.floor(Math.random() * 45 + 30);
        const bHeight = Math.floor(Math.random() * 85 + 30);
        const topY = horizonY - bHeight;

        skylinePoints.push({
          x: currX,
          y: topY,
          w: bWidth,
          h: bHeight
        });

        // Generate tiny office/apartment windows
        const rows = Math.floor(bHeight / 9);
        const cols = Math.floor(bWidth / 8);
        for (let r = 1; r < rows; r++) {
          for (let c = 1; c < cols; c++) {
            if (Math.random() < 0.28) { // 28% windows lit
              skylineWindows.push({
                x: currX + c * 8,
                y: topY + r * 9,
                color: Math.random() < 0.3 ? '#ffe082' : (Math.random() < 0.5 ? '#b3e5fc' : '#fff9c4'),
                alpha: Math.random() * 0.5 + 0.3
              });
            }
          }
        }
        currX += bWidth - 2; // subtle overlap
      }
    }

    /* ==========================================================================
       ROCKET (LAUNCHED SHELL)
       ========================================================================== */
    class Rocket {
      constructor(startX, startY, targetX, targetY, shellType, paletteName) {
        this.x = startX;
        this.y = startY;
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;

        this.shellType = shellType;
        this.paletteName = paletteName;
        this.color = pickColor(paletteName);

        // Physics trajectory towards target
        const dx = targetX - startX;
        const dy = targetY - startY;
        const distance = Math.hypot(dx, dy);
        const speed = Math.max(12, Math.min(22, distance * 0.024));

        const angle = Math.atan2(dy, dx);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.08;

        this.trail = [];
        this.dead = false;

        playLaunchSound(this.x / width);
      }

      update(dt) {
        this.trail.push({ x: this.x, y: this.y, alpha: 1.0 });
        if (this.trail.length > 9) {
          this.trail.shift();
        }

        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;

        // Peak or arrival check
        const remainingY = this.y - this.targetY;
        if (this.vy >= 0 || remainingY <= 0) {
          this.explode();
        }
      }

      draw(context) {
        // Glowing rocket trail
        context.save();
        context.lineWidth = 2.4;
        for (let i = 0; i < this.trail.length - 1; i++) {
          const pt = this.trail[i];
          const next = this.trail[i + 1];
          const progress = i / this.trail.length;
          context.beginPath();
          context.moveTo(pt.x, pt.y);
          context.lineTo(next.x, next.y);
          context.strokeStyle = `rgba(255, 200, 110, ${progress * 0.7})`;
          context.stroke();
        }

        // Head spark
        context.beginPath();
        context.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        context.fillStyle = '#ffffff';
        context.shadowColor = colorToRgba(this.color, 1);
        context.shadowBlur = 10;
        context.fill();
        context.restore();
      }

      explode() {
        this.dead = true;
        createFireworkExplosion(this.x, this.y, this.shellType, this.paletteName);
      }
    }

    /* ==========================================================================
       PARTICLES & EXPLOSIONS
       ========================================================================== */
    class Particle {
      constructor(x, y, vx, vy, color, options = {}) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;

        this.alpha = 1.0;
        this.decay = options.decay || (Math.random() * 0.015 + 0.012);
        this.size = options.size || (Math.random() * 2.2 + 1.2);
        this.gravity = options.gravity !== undefined ? options.gravity : 0.065;
        this.friction = options.friction || 0.96;
        this.flicker = options.flicker || false;
        this.sparkle = options.sparkle || false;
        this.willow = options.willow || false;

        // Crossette / secondary split
        this.subBurstTimer = options.subBurstTimer || 0;
        this.subBurstCount = options.subBurstCount || 0;
        this.paletteName = options.paletteName || 'vibrant';

        this.trail = [];
        this.maxTrail = this.willow ? 12 : 5;
        this.dead = false;
      }

      update(dt) {
        if (this.dead) return;

        // Store trail
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) {
          this.trail.shift();
        }

        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        // Sub-burst (Crossette)
        if (this.subBurstTimer > 0) {
          this.subBurstTimer -= 1;
          if (this.subBurstTimer <= 0 && this.subBurstCount > 0) {
            this.splitCrossette();
          }
        }

        this.alpha -= this.decay;
        if (this.alpha <= 0) {
          this.dead = true;
        }
      }

      splitCrossette() {
        this.dead = true;
        const subSparks = 4;
        for (let i = 0; i < subSparks; i++) {
          const angle = (Math.PI * 2 / subSparks) * i + Math.random() * 0.3;
          const speed = Math.random() * 2.5 + 2.0;
          particles.push(new Particle(
            this.x, this.y,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            this.color,
            {
              decay: 0.024,
              size: 1.8,
              gravity: 0.06,
              friction: 0.95
            }
          ));
        }
      }

      draw(context) {
        if (this.dead || this.alpha <= 0) return;

        let displayAlpha = this.alpha;
        if (this.flicker && Math.random() < 0.35) {
          displayAlpha *= 0.2;
        }

        context.save();

        // Glowing streak / tail
        if (this.trail.length > 1) {
          context.beginPath();
          context.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) {
            context.lineTo(this.trail[i].x, this.trail[i].y);
          }
          context.lineTo(this.x, this.y);
          context.strokeStyle = colorToRgba(this.color, displayAlpha * (this.willow ? 0.7 : 0.4));
          context.lineWidth = this.size * 0.8;
          context.stroke();
        }

        // Particle Core
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fillStyle = colorToRgba(this.color, displayAlpha);
        if (this.sparkle && Math.random() < 0.4) {
          context.fillStyle = `rgba(255, 255, 255, ${displayAlpha})`;
          context.shadowColor = '#ffffff';
          context.shadowBlur = 8;
        }
        context.fill();
        context.restore();
      }
    }

    /* ==========================================================================
       SKY FLASH BLOOM
       ========================================================================== */
    class SkyFlash {
      constructor(x, y, color, maxAlpha = 0.25) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.alpha = maxAlpha;
        this.decay = 0.02;
      }

      update() {
        this.alpha -= this.decay;
      }

      draw(context) {
        if (this.alpha <= 0) return;
        context.save();
        const radius = Math.max(width, height) * 0.7;
        const grad = context.createRadialGradient(this.x, this.y, 10, this.x, this.y, radius);
        grad.addColorStop(0, colorToRgba(this.color, this.alpha));
        grad.addColorStop(0.5, colorToRgba(this.color, this.alpha * 0.3));
        grad.addColorStop(1, 'transparent');
        context.fillStyle = grad;
        context.fillRect(0, 0, width, height);
        context.restore();
      }
    }

    /* ==========================================================================
       SHELL EXPLOSION LOGIC
       ========================================================================== */
    function createFireworkExplosion(x, y, requestedType, paletteName) {
      let type = requestedType;
      if (type === 'random') {
        const types = ['peony', 'willow', 'ring', 'heart', 'crossette', 'strobe', 'crackle', 'spiral'];
        type = types[Math.floor(Math.random() * types.length)];
      }

      const baseColor = pickColor(paletteName);
      const isLarge = Math.random() < 0.4;
      const intensity = isLarge ? 1.3 : 1.0;
      const isCrackle = type === 'crackle';

      // Sky flash bloom
      if (screenFlashEnabled) {
        skyFlashes.push(new SkyFlash(x, y, baseColor, isLarge ? 0.28 : 0.16));
      }

      // Audio detonation
      playExplodeSound(x / width, intensity, isCrackle);

      // Particle counts based on slider
      const countMultiplier = densityScale;

      switch (type) {
        case 'peony': {
          const count = Math.floor((120 + Math.random() * 40) * countMultiplier);
          const speedMax = 5.5 * intensity;
          for (let i = 0; i < count; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const speed = (Math.random() * 0.8 + 0.2) * speedMax;

            const vx = Math.sin(phi) * Math.cos(theta) * speed;
            const vy = Math.sin(phi) * Math.sin(theta) * speed;

            particles.push(new Particle(x, y, vx, vy, Math.random() < 0.25 ? pickColor(paletteName) : baseColor, {
              decay: Math.random() * 0.015 + 0.012,
              friction: 0.955,
              gravity: 0.07,
              size: Math.random() * 2 + 1.2
            }));
          }
          break;
        }

        case 'willow': {
          const count = Math.floor(100 * countMultiplier);
          const goldColor = { h: 44, s: 100, l: 65 };
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5.0 + 1.0;
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              goldColor,
              {
                decay: Math.random() * 0.007 + 0.006, // Long hang time
                friction: 0.965,
                gravity: 0.045,
                size: 1.8,
                willow: true,
                sparkle: true
              }
            ));
          }
          break;
        }

        case 'ring': {
          const count = Math.floor(90 * countMultiplier);
          const ringSpeed = 4.8 * intensity;
          const tilt = Math.random() * Math.PI;
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 / count) * i;
            let rx = Math.cos(angle) * ringSpeed;
            let ry = Math.sin(angle) * ringSpeed * 0.45; // ellipse tilt
            // Rotate by tilt
            const vx = rx * Math.cos(tilt) - ry * Math.sin(tilt);
            const vy = rx * Math.sin(tilt) + ry * Math.cos(tilt);

            particles.push(new Particle(x, y, vx, vy, baseColor, {
              decay: 0.014,
              friction: 0.965,
              gravity: 0.05,
              size: 2.0
            }));
          }
          // Center core pop
          for (let j = 0; j < 25; j++) {
            const a = Math.random() * Math.PI * 2;
            const s = Math.random() * 1.5;
            particles.push(new Particle(x, y, Math.cos(a)*s, Math.sin(a)*s, { h: 50, s: 100, l: 90 }, {
              decay: 0.02,
              friction: 0.93,
              gravity: 0.03
            }));
          }
          break;
        }

        case 'heart': {
          const count = Math.floor(100 * countMultiplier);
          const heartColor = { h: 345, s: 100, l: 65 };
          const scale = 0.26 * intensity;
          for (let i = 0; i < count; i++) {
            const t = (Math.PI * 2 / count) * i;
            // Parametric heart formula
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

            particles.push(new Particle(x, y, hx * scale, hy * scale, heartColor, {
              decay: 0.013,
              friction: 0.96,
              gravity: 0.04,
              size: 2.2,
              sparkle: true
            }));
          }
          break;
        }

        case 'crossette': {
          const count = Math.floor(28 * countMultiplier);
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 / count) * i + Math.random() * 0.15;
            const speed = Math.random() * 2.2 + 3.8;
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              baseColor,
              {
                decay: 0.008,
                friction: 0.97,
                gravity: 0.05,
                size: 2.6,
                subBurstTimer: Math.floor(Math.random() * 14 + 22),
                subBurstCount: 4,
                paletteName: paletteName
              }
            ));
          }
          break;
        }

        case 'strobe': {
          const count = Math.floor(90 * countMultiplier);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5.0 + 0.8;
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              Math.random() < 0.5 ? { h: 0, s: 0, l: 100 } : baseColor,
              {
                decay: Math.random() * 0.012 + 0.008,
                friction: 0.96,
                gravity: 0.06,
                size: 2.2,
                flicker: true
              }
            ));
          }
          break;
        }

        case 'crackle': {
          const count = Math.floor(80 * countMultiplier);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4.5 + 1.0;
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              baseColor,
              {
                decay: Math.random() * 0.016 + 0.012,
                friction: 0.95,
                gravity: 0.07,
                size: 2.0,
                sparkle: true,
                flicker: true
              }
            ));
          }
          break;
        }

        case 'spiral': {
          const count = Math.floor(100 * countMultiplier);
          const arms = 3;
          for (let i = 0; i < count; i++) {
            const arm = i % arms;
            const fraction = i / count;
            const angle = (fraction * Math.PI * 4) + (arm * (Math.PI * 2 / arms));
            const speed = (fraction * 4.5 + 1.2) * intensity;
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              pickColor(paletteName),
              {
                decay: 0.014,
                friction: 0.96,
                gravity: 0.05,
                size: 2.1
              }
            ));
          }
          break;
        }
      }
    }

    /* ==========================================================================
       DISPATCH FIREWORK
       ========================================================================== */
    function launchFirework(targetX, targetY) {
      initAudio();
      const startX = targetX + (Math.random() * 120 - 60);
      const startY = height * 0.88;
      rockets.push(new Rocket(startX, startY, targetX, targetY, selectedShell, selectedPalette));
    }

    function triggerGrandFinale() {
      initAudio();
      const barrageCount = 38;
      const delayStep = 110; // ms between bursts

      for (let i = 0; i < barrageCount; i++) {
        setTimeout(() => {
          const tx = Math.random() * (width * 0.84) + (width * 0.08);
          const ty = Math.random() * (height * 0.45) + (height * 0.12);
          launchFirework(tx, ty);
        }, i * delayStep);
      }
    }

    /* ==========================================================================
       MAIN SIMULATION & RENDER LOOP
       ========================================================================== */
    function render(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      // Handle Automatic Show Cadence
      if (autoLaunch) {
        autoLaunchTimer += dt;
        const intervals = [2.2, 1.6, 1.0, 0.65, 0.35];
        const targetInterval = intervals[autoCadenceLevel - 1];

        if (autoLaunchTimer >= targetInterval) {
          autoLaunchTimer = 0;
          const tx = Math.random() * (width * 0.78) + (width * 0.11);
          const ty = Math.random() * (height * 0.46) + (height * 0.12);
          launchFirework(tx, ty);

          // Occasional simultaneous twin burst
          if (Math.random() < 0.25) {
            setTimeout(() => {
              const tx2 = Math.random() * (width * 0.78) + (width * 0.11);
              const ty2 = Math.random() * (height * 0.46) + (height * 0.12);
              launchFirework(tx2, ty2);
            }, 200);
          }
        }
      }

      // Smooth Trail Clearing (Dark Night Sky)
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(4, 5, 12, ${trailDecay})`;
      ctx.fillRect(0, 0, width, height);

      // Render Ambient Twinkling Stars
      ctx.save();
      for (let s of ambientStars) {
        s.phase += s.twinkleSpeed;
        const starAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.fillStyle = `rgba(220, 235, 255, ${starAlpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Render Sky Flashes
      if (screenFlashEnabled) {
        for (let i = skyFlashes.length - 1; i >= 0; i--) {
          const flash = skyFlashes[i];
          flash.update();
          flash.draw(ctx);
          if (flash.alpha <= 0) {
            skyFlashes.splice(i, 1);
          }
        }
      }

      // Render Rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.update(dt);
        r.draw(ctx);
        if (r.dead) {
          rockets.splice(i, 1);
        }
      }

      // Render Particles with 'lighter' composite mode for vibrant luminescence
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        p.draw(ctx);
        if (p.dead) {
          particles.splice(i, 1);
        }
      }
      ctx.restore();

      // Scenery: Horizon, Water Reflection, and City Silhouette
      if (showCityReflection) {
        drawScenery();
      }

      requestAnimationFrame(render);
    }

    /* ==========================================================================
       SCENERY & WATER REFLECTION RENDERING
       ========================================================================== */
    function drawScenery() {
      const horizonY = height * 0.84;
      const waterHeight = height - horizonY;

      ctx.save();

      // 1. Water Surface Dark Tint & Base
      const waterGrad = ctx.createLinearGradient(0, horizonY, 0, height);
      waterGrad.addColorStop(0, '#040711');
      waterGrad.addColorStop(1, '#010206');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, horizonY, width, waterHeight);

      // 2. Realistic Water Reflection of Active Particles
      ctx.globalCompositeOperation = 'screen';
      ctx.lineWidth = 1.6;

      for (let i = 0; i < particles.length; i += 2) {
        const p = particles[i];
        if (p.y < horizonY) {
          const distAbove = horizonY - p.y;
          const reflY = horizonY + distAbove * 0.82; // slight compression
          if (reflY < height) {
            const rippleX = (Math.sin(p.y * 0.05 + lastTime * 0.003) * 6);
            const fade = (1 - (distAbove / horizonY)) * p.alpha * 0.28;
            ctx.strokeStyle = colorToRgba(p.color, fade);
            ctx.beginPath();
            ctx.moveTo(p.x - 4 + rippleX, reflY);
            ctx.lineTo(p.x + 4 + rippleX, reflY);
            ctx.stroke();
          }
        }
      }

      // 3. City Silhouette
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#06080e';
      for (let b of skylinePoints) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }

      // 4. City Window Lights
      for (let w of skylineWindows) {
        ctx.fillStyle = w.color;
        ctx.globalAlpha = w.alpha * (0.8 + 0.2 * Math.sin(lastTime * 0.002 + w.x));
        ctx.fillRect(w.x, w.y, 3, 4);
      }
      ctx.globalAlpha = 1.0;

      // 5. Waterline boundary glow
      ctx.strokeStyle = 'rgba(100, 140, 200, 0.15)';
      ctx.lineWidth = 1.0;
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      ctx.lineTo(width, horizonY);
      ctx.stroke();

      ctx.restore();
    }

    /* ==========================================================================
       CANVAS RESIZE HANDLER
       ========================================================================== */
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      // Initial clear to prevent black flicker
      ctx.fillStyle = '#030308';
      ctx.fillRect(0, 0, width, height);

      initStars();
      generateCityscape();
    }

    window.addEventListener('resize', resize);
    resize();

    /* ==========================================================================
       INTERACTION & EVENT LISTENERS
       ========================================================================== */
    let isPointerDown = false;
    let dragLaunchCooldown = 0;

    function handlePointerAction(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - rect.top;

      if (x !== undefined && y !== undefined && y < height * 0.80) {
        launchFirework(x, y);
      }
    }

    window.addEventListener('mousedown', (e) => {
      // Ignore clicks on UI elements
      if (e.target.closest('.interactive')) return;
      isPointerDown = true;
      handlePointerAction(e);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPointerDown) return;
      if (e.target.closest('.interactive')) return;
      const now = performance.now();
      if (now - dragLaunchCooldown > 180) {
        dragLaunchCooldown = now;
        handlePointerAction(e);
      }
    });

    window.addEventListener('mouseup', () => { isPointerDown = false; });

    // Touch support
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.interactive')) return;
      isPointerDown = true;
      handlePointerAction(e);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPointerDown) return;
      if (e.target.closest('.interactive')) return;
      const now = performance.now();
      if (now - dragLaunchCooldown > 200) {
        dragLaunchCooldown = now;
        handlePointerAction(e);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => { isPointerDown = false; });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        triggerGrandFinale();
      } else if (e.key === 'h' || e.key === 'H') {
        toggleUI();
      } else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

      selectedPalette = e.target.value;
    });

    const cadenceLabels = ['Relaxed', 'Gentle', 'Medium', 'Lively', 'Intense'];
    cadenceSlider.addEventListener('input', (e) => {
      autoCadenceLevel = parseInt(e.target.value, 10);
      cadenceVal.textContent = cadenceLabels[autoCadenceLevel - 1];
    });

    densitySlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      densityScale = val / 100;
      densityVal.textContent = `${val}%`;
    });

    trailSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      trailDecay = (100 - val) / 100; // e.g. 85% -> 0.15 decay
      trailVal.textContent = `${val}%`;
    });

    reflectionToggle.addEventListener('change', (e) => {
      showCityReflection = e.target.checked;
    });

    flashToggle.addEventListener('change', (e) => {
      screenFlashEnabled = e.target.checked;
    });

    function toggleUI() {
      uiVisible = !uiVisible;
      overlayElements.forEach(el => {
        el.classList.toggle('hidden', !uiVisible);
      });
      toggleUiBtn.textContent = uiVisible ? 'Hide Controls [H]' : 'Show Controls [H]';
    }

    toggleUiBtn.addEventListener('click', toggleUI);

    // First user interaction initializes Web Audio seamlessly
    const enableAudioOnce = () => {
      initAudio();
      window.removeEventListener('pointerdown', enableAudioOnce);
    };
    window.addEventListener('pointerdown', enableAudioOnce);

    // Kick off animation loop
    requestAnimationFrame(render);
  </script>
</body>
</html>
