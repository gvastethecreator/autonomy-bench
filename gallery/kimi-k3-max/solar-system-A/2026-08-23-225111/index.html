<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miniature Solar System</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #app { width: 100vw; height: 100vh; display: block; }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #cfd8e3;
    background: rgba(8, 12, 20, 0.55);
    border: 1px solid rgba(120, 160, 220, 0.25);
    border-radius: 10px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
    pointer-events: none;
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 4px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e8eef7;
  }
  #hud p {
    margin: 2px 0;
    font-size: 12px;
    color: #93a4bb;
  }
  #label {
    position: fixed;
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.05em;
    background: rgba(10, 14, 24, 0.7);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(140, 180, 240, 0.3);
    pointer-events: none;
    transform: translate(-50%, -140%);
    display: none;
    white-space: nowrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>
<div id="hud">
  <h1>Miniature Solar System</h1>
  <p>Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan</p>
  <p>Hover a planet to identify it &middot; Click to focus</p>
</div>
<div id="label"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 90, 220);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 12;
controls.maxDistance = 900;

// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0x334455, 0.55));

const sunLight = new THREE.PointLight(0xfff2dd, 3.2, 0, 1.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.bias = -0.0004;
scene.add(sunLight);

// ---------- Starfield ----------
function makeStars(count, radius, size, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const v = new THREE.Vector3()
      .randomDirection()
      .multiplyScalar(radius * (0.55 + Math.random() * 0.45));
    pos.set([v.x, v.y, v.z], i * 3);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size, sizeAttenuation: true,
    transparent: true, opacity: 0.9, depthWrite: false
  });
  return new THREE.Points(geo, mat);
}
scene.add(makeStars(3500, 1600, 2.2, 0xffffff));
scene.add(makeStars(1500, 1400, 1.4, 0x9db8ff));

// ---------- Procedural texture helpers ----------
function planetTexture(base, bands, noise) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, c.width, c.height);
  for (const b of bands) {
    g.fillStyle = b.color;
    const y = b.y * c.height;
    const h = b.h * c.height;
    g.globalAlpha = b.alpha ?? 1;
    g.fillRect(0, y, c.width, h);
  }
  g.globalAlpha = 1;
  for (let i = 0; i < noise; i++) {
    const x = Math.random() * c.width;
    const y = Math.random() * c.height;
    const r = 2 + Math.random() * 14;
    g.fillStyle = `rgba(${Math.random() > 0.5 ? '255,255,255' : '0,0,0'},${0.03 + Math.random() * 0.06})`;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function sunTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#ffb347');
  grad.addColorStop(0.5, '#ff8c1a');
  grad.addColorStop(1, '#ffb347');
  g.fillStyle = grad;
  g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * c.width;
    const y = Math.random() * c.height;
    const r = 1 + Math.random() * 8;
    g.fillStyle = Math.random() > 0.5
      ? `rgba(255,240,180,${0.05 + Math.random() * 0.12})`
      : `rgba(200,80,10,${0.05 + Math.random() * 0.12})`;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------- Sun ----------
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(14, 64, 64),
  new THREE.MeshBasicMaterial({ map: sunTexture() })
);
sunGroup.add(sun);

// Sun glow sprite
function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255, 200, 120, 0.85)');
  grad.addColorStop(0.25, 'rgba(255, 160, 60, 0.35)');
  grad.addColorStop(0.6, 'rgba(255, 120, 30, 0.12)');
  grad.addColorStop(1, 'rgba(255, 100, 20, 0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true
}));
glow.scale.setScalar(90);
sunGroup.add(glow);

// ---------- Orbit ring ----------
function orbitRing(radius) {
  const pts = [];
  const seg = 256;
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: 0x4a5a75, transparent: true, opacity: 0.35
  });
  return new THREE.Line(geo, mat);
}

// ---------- Planet data ----------
// name, radius, orbitRadius, speed (orbital), color/texture config, extras
const planetData = [
  {
    name: 'Mercury', radius: 1.6, orbit: 26, speed: 0.90, tilt: 0.03,
    tex: () => planetTexture('#8a8078', [], 500)
  },
  {
    name: 'Venus', radius: 2.6, orbit: 36, speed: 0.65, tilt: 0.05,
    tex: () => planetTexture('#d9b26a', [
      { color: '#e8c98a', y: 0.2, h: 0.15, alpha: 0.5 },
      { color: '#c99a4e', y: 0.55, h: 0.2, alpha: 0.5 }
    ], 350)
  },
  {
    name: 'Earth', radius: 2.8, orbit: 48, speed: 0.52, tilt: 0.41,
    tex: () => planetTexture('#1c5fa8', [
      { color: '#2e8b57', y: 0.15, h: 0.12, alpha: 0.85 },
      { color: '#3aa06a', y: 0.45, h: 0.18, alpha: 0.8 },
      { color: '#2e8b57', y: 0.72, h: 0.1, alpha: 0.85 },
      { color: '#eaf6ff', y: 0.0, h: 0.06, alpha: 0.9 },
      { color: '#eaf6ff', y: 0.94, h: 0.06, alpha: 0.9 }
    ], 420),
    moon: true
  },
  {
    name: 'Mars', radius: 2.0, orbit: 60, speed: 0.42, tilt: 0.44,
    tex: () => planetTexture('#b5533c', [
      { color: '#8f3d2a', y: 0.3, h: 0.2, alpha: 0.5 },
      { color: '#e8e0d8', y: 0.0, h: 0.07, alpha: 0.85 }
    ], 450)
  },
  {
    name: 'Jupiter', radius: 7.5, orbit: 84, speed: 0.24, tilt: 0.05,
    tex: () => planetTexture('#c8a06a', [
      { color: '#a87f4e', y: 0.18, h: 0.1 },
      { color: '#e6d3ae', y: 0.32, h: 0.08 },
      { color: '#b06a45', y: 0.46, h: 0.09 },
      { color: '#e0c493', y: 0.6, h: 0.1 },
      { color: '#9c7444', y: 0.76, h: 0.08 }
    ], 250),
    spot: true
  },
  {
    name: 'Saturn', radius: 6.2, orbit: 112, speed: 0.18, tilt: 0.47,
    tex: () => planetTexture('#d9c08a', [
      { color: '#c2a468', y: 0.25, h: 0.12 },
      { color: '#ead9ac', y: 0.45, h: 0.1 },
      { color: '#b3925c', y: 0.65, h: 0.12 }
    ], 200),
    rings: { inner: 8.2, outer: 13.5, color: 0xcbb287 }
  },
  {
    name: 'Uranus', radius: 4.2, orbit: 138, speed: 0.13, tilt: 1.71,
    tex: () => planetTexture('#8fd1d4', [
      { color: '#a5dee0', y: 0.3, h: 0.15, alpha: 0.6 },
      { color: '#7cc3c7', y: 0.6, h: 0.15, alpha: 0.6 }
    ], 150),
    rings: { inner: 5.6, outer: 7.4, color: 0x9fd8db, vertical: true }
  },
  {
    name: 'Neptune', radius: 4.0, orbit: 162, speed: 0.10, tilt: 0.49,
    tex: () => planetTexture('#2f5fd0', [
      { color: '#4a7ee0', y: 0.25, h: 0.15, alpha: 0.7 },
      { color: '#1e3f9e', y: 0.55, h: 0.15, alpha: 0.7 }
    ], 200)
  }
];

// ---------- Build planets ----------
const planets = [];
const pickables = [];

for (const d of planetData) {
  scene.add(orbitRing(d.orbit));

  const pivot = new THREE.Group();
  pivot.rotation.y = Math.random() * Math.PI * 2;
  scene.add(pivot);

  const holder = new THREE.Group();
  holder.position.x = d.orbit;
  pivot.add(holder);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(d.radius, 48, 48),
    new THREE.MeshStandardMaterial({
      map: d.tex(),
      roughness: 0.85,
      metalness: 0.05
    })
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.rotation.z = d.tilt;
  mesh.userData.name = d.name;
  holder.add(mesh);
  pickables.push(mesh);

  // Jupiter's Great Red Spot
  if (d.spot) {
    const spot = new THREE.Mesh(
      new THREE.SphereGeometry(d.radius * 0.28, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xc0442a, roughness: 0.9 })
    );
    spot.position.set(d.radius * 0.82, -d.radius * 0.28, d.radius * 0.45);
    spot.scale.set(1, 0.6, 0.5);
    mesh.add(spot);
  }

  // Rings
  if (d.rings) {
    const r = d.rings;
    const ringGeo = new THREE.RingGeometry(r.inner, r.outer, 96, 1);
    // remap UVs radially so a gradient reads across the ring
    const posAttr = ringGeo.attributes.position;
    const uvAttr = ringGeo.attributes.uv;
    for (let i = 0; i < posAttr.count; i++) {
      const len = Math.hypot(posAttr.getX(i), posAttr.getY(i));
      uvAttr.setXY(i, (len - r.inner) / (r.outer - r.inner), 0.5);
    }
    const rc = document.createElement('canvas');
    rc.width = 128; rc.height = 1;
    const rg = rc.getContext('2d');
    const grad = rg.createLinearGradient(0, 0, 128, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.45)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0.75)');
    grad.addColorStop(1, 'rgba(255,255,255,0.15)');
    rg.fillStyle = grad;
    rg.fillRect(0, 0, 128, 1);
    const ringTex = new THREE.CanvasTexture(rc);

    const ring = new THREE.Mesh(
      ringGeo,
      new THREE.MeshBasicMaterial({
        color: r.color,
        map: ringTex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      })
    );
    ring.rotation.x = r.vertical ? 0 : -Math.PI / 2;
    if (r.vertical) ring.rotation.y = Math.PI / 2.3;
    mesh.add(ring);
  }

  // Earth's moon
  let moon = null;
  if (d.moon) {
    const moonPivot = new THREE.Group();
    holder.add(moonPivot);
    moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xbfbfbf, roughness: 1 })
    );
    moon.castShadow = true;
    moon.position.x = d.radius + 3.4;
    moonPivot.add(moon);
    planets.push({ pivot: moonPivot, mesh: moon, speed: 2.2, spin: 0.5 });
  }

  planets.push({
    pivot, mesh: holder, body: mesh,
    speed: d.speed, spin: 0.6 + Math.random() * 0.6
  });
}

// ---------- Comet (a little life) ----------
const comet = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xcfe8ff })
);
const cometGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(), color: 0x9fc8ff,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
}));
cometGlow.scale.setScalar(8);
comet.add(cometGlow);
scene.add(comet);

// ---------- Interaction: hover label + click focus ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const labelEl = document.getElementById('label');
let focusTarget = null;

function setPointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

window.addEventListener('pointermove', (e) => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  if (hit) {
    labelEl.textContent = hit.object.userData.name;
    labelEl.style.display = 'block';
    labelEl.style.left = e.clientX + 'px';
    labelEl.style.top = e.clientY + 'px';
    document.body.style.cursor = 'pointer';
  } else {
    labelEl.style.display = 'none';
    document.body.style.cursor = 'default';
  }
});

window.addEventListener('click', (e) => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  focusTarget = hit ? hit.object : null;
});

window.addEventListener('dblclick', () => { focusTarget = null; });

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Animation ----------
const clock = new THREE.Clock();
const worldPos = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  sun.rotation.y = t * 0.05;
  glow.material.opacity = 0.85 + Math.sin(t * 2.1) * 0.1;

  for (const p of planets) {
    p.pivot.rotation.y += p.speed * 0.004;
    if (p.body) p.body.rotation.y += p.spin * 0.01;
    else p.mesh.rotation.y += p.spin * 0.01;
  }

  // Comet on an inclined elliptical path
  const ca = t * 0.25;
  comet.position.set(
    Math.cos(ca) * 190,
    Math.sin(ca * 0.7) * 24,
    Math.sin(ca) * 120
  );

  if (focusTarget) {
    focusTarget.getWorldPosition(worldPos);
    controls.target.lerp(worldPos, 0.08);
  } else {
    controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
