<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ENDLESS — Night Drive</title>
<style>
  :root{
    --ink:#dfe6f2;
    --dim:#7a86a0;
    --accent:#6fd8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060c;}
  body{font-family:"Bahnschrift","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);}
  canvas.webgl{position:fixed;inset:0;display:block;}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(2,4,10,.42) 82%, rgba(1,2,6,.78) 100%);}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.07;mix-blend-mode:overlay;}

  .bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:8;
    transition:height .9s cubic-bezier(.6,0,.3,1);}
  .bar.top{top:0;} .bar.bot{bottom:0;}
  body.letterbox .bar{height:7vh;}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .5s;}
  #hud.hidden{opacity:0;}
  .hud-tl{position:absolute;top:26px;left:32px;}
  .brand{font-size:11px;letter-spacing:.42em;color:var(--dim);font-weight:600;}
  .brand b{color:var(--ink);font-weight:600;}
  .clock{margin-top:6px;font-size:22px;letter-spacing:.18em;font-weight:300;color:var(--ink);
    font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(111,216,255,.35);}
  .hud-bl{position:absolute;left:32px;bottom:30px;}
  .speed{font-size:52px;font-weight:200;letter-spacing:.04em;line-height:1;
    font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(111,216,255,.28);}
  .speed small{font-size:12px;letter-spacing:.34em;color:var(--dim);margin-left:8px;font-weight:600;}
  .odo{margin-top:8px;font-size:10px;letter-spacing:.32em;color:var(--dim);font-variant-numeric:tabular-nums;}
  .speedbar{margin-top:10px;width:170px;height:2px;background:rgba(255,255,255,.10);}
  .speedbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2e7ea8,var(--accent));
    box-shadow:0 0 10px rgba(111,216,255,.6);transition:width .18s linear;}

  #caption{position:fixed;right:36px;bottom:34px;z-index:10;text-align:right;opacity:0;pointer-events:none;}
  #caption .line{font-size:15px;letter-spacing:.44em;font-weight:300;color:var(--ink);
    text-shadow:0 0 16px rgba(111,216,255,.4);}
  #caption .rule{margin-top:8px;margin-left:auto;width:64px;height:1px;background:var(--accent);
    box-shadow:0 0 8px rgba(111,216,255,.8);}
  #caption.show{animation:capFade 4.2s ease forwards;}
  @keyframes capFade{0%{opacity:0;transform:translateY(8px);}12%{opacity:1;transform:translateY(0);}
    78%{opacity:1;}100%{opacity:0;transform:translateY(-6px);}}

  #title{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.4s ease;}
  #title.vis{opacity:1;}
  #title h1{font-size:min(9vw,84px);font-weight:100;letter-spacing:.52em;text-indent:.52em;color:var(--ink);
    text-shadow:0 0 34px rgba(111,216,255,.45),0 0 90px rgba(111,216,255,.2);}
  #title p{margin-top:18px;font-size:11px;letter-spacing:.58em;text-indent:.58em;color:var(--dim);font-weight:600;}

  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    font-size:9px;letter-spacing:.4em;color:var(--dim);opacity:.35;pointer-events:none;
    transition:opacity 1.2s;font-weight:600;}

  #fade{position:fixed;inset:0;background:#000;z-index:20;pointer-events:none;
    transition:opacity 2.8s ease .15s;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;
    background:#04060c;color:var(--dim);font-size:13px;letter-spacing:.2em;text-align:center;padding:24px;}
</style>
</head>
<body>
<div id="vignette"></div>
<canvas id="grain"></canvas>
<div class="bar top"></div><div class="bar bot"></div>

<div id="hud">
  <div class="hud-tl">
    <div class="brand"><b>NIGHTDRIVE</b>&nbsp;&nbsp;//&nbsp;&nbsp;ENDLESS</div>
    <div class="clock" id="clock">23:58:40</div>
  </div>
  <div class="hud-bl">
    <div class="speed"><span id="kmh">108</span><small>KM/H</small></div>
    <div class="odo" id="odo">0000.0 KM&nbsp;&nbsp;·&nbsp;&nbsp;AUTO</div>
    <div class="speedbar"><i id="sbar"></i></div>
  </div>
</div>

<div id="caption"><div class="line" id="capline"></div><div class="rule"></div></div>

<div id="title"><h1>ENDLESS</h1><p>A NIGHT DRIVE</p></div>
<div id="hint">C&nbsp;CAMERA&nbsp;&nbsp;·&nbsp;&nbsp;H&nbsp;HUD&nbsp;&nbsp;·&nbsp;&nbsp;M&nbsp;SOUND</div>
<div id="fade"></div>
<div id="err"><div>WEBGL UNAVAILABLE — THIS SHOWCASE NEEDS A GPU-ENABLED BROWSER</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== utils ============================== */
const mod=(n,m)=>((n%m)+m)%m;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const sst=t=>t*t*t*(t*(t*6-15)+10);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};

/* ============================== textures ============================== */
function canvasTex(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const glowTex=canvasTex(128,128,(g)=>{
  const r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.55)');
  r.addColorStop(.6,'rgba(255,255,255,.12)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,128,128);
});
const poolTex=canvasTex(128,128,(g)=>{
  const r=g.createRadialGradient(64,64,2,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.5,'rgba(255,255,255,.28)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,128,128);
});
const streakTex=canvasTex(16,64,(g)=>{
  const r=g.createLinearGradient(0,0,0,64);
  r.addColorStop(0,'rgba(255,255,255,0)');r.addColorStop(.5,'rgba(255,255,255,.9)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(6,0,4,64);
});
function windowsTex(seed,cols,rows,lit){
  return canvasTex(cols*8,rows*8,(g,w,h)=>{
    g.fillStyle='#04060b';g.fillRect(0,0,w,h);
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const r=hash(seed+x*13.7+y*71.3);
      if(r<lit){
        const warm=hash(seed+y*3.1+x*9.7)>.42;
        const v=.55+hash(x*3.3+y*17.1+seed)*.45;
        g.fillStyle=warm?`rgba(255,${190+Math.floor(40*v)},${130+Math.floor(60*v)},${v})`
                         :`rgba(${150+Math.floor(60*v)},${200+Math.floor(40*v)},255,${v})`;
        g.fillRect(x*8+1,y*8+2,6,5);
      }
    }
  });
}
const winTexA=windowsTex(3.7,8,20,.30), winTexB=windowsTex(9.2,10,16,.26);
function billboardTex(main,sub,color){
  return canvasTex(256,128,(g)=>{
    g.fillStyle='#070a12';g.fillRect(0,0,256,128);
    g.strokeStyle=color;g.lineWidth=5;g.globalAlpha=.85;g.strokeRect(7,7,242,114);g.globalAlpha=1;
    g.fillStyle=color;g.font='bold 40px Arial';g.textAlign='center';g.textBaseline='middle';
    g.shadowColor=color;g.shadowBlur=16;g.fillText(main,128,52);
    g.shadowBlur=6;g.fillStyle='#c8d2e4';g.font='600 19px Arial';g.fillText(sub,128,96);
  });
}
const bbTex=[
  billboardTex('NIGHT CITY','12 KM — EXIT 9','#6fd8ff'),
  billboardTex('MOTEL','VACANCY · 24H','#ff5fa2'),
  billboardTex('DINER','OPEN ALL NIGHT','#ffb45c'),
  billboardTex('88.5 FM','ENDLESS RADIO','#9f8cff'),
];
const moonTex=canvasTex(256,256,(g)=>{
  let r=g.createRadialGradient(128,128,30,128,128,128);
  r.addColorStop(0,'rgba(200,220,255,.5)');r.addColorStop(.45,'rgba(160,190,255,.12)');
  r.addColorStop(1,'rgba(160,190,255,0)');
  g.fillStyle=r;g.fillRect(0,0,256,256);
  r=g.createRadialGradient(118,118,4,128,128,52);
  r.addColorStop(0,'#ffffff');r.addColorStop(.8,'#dce8ff');r.addColorStop(1,'rgba(200,220,255,0)');
  g.fillStyle=r;g.beginPath();g.arc(128,128,52,0,7);g.fill();
  g.fillStyle='rgba(170,195,235,.5)';
  g.beginPath();g.arc(112,120,8,0,7);g.fill();
  g.beginPath();g.arc(140,142,6,0,7);g.fill();
  g.beginPath();g.arc(134,108,5,0,7);g.fill();
});
const cloudTex=canvasTex(256,128,(g)=>{
  for(let i=0;i<9;i++){
    const x=40+hash(i*3.1)*176,y=44+hash(i*7.7)*40,r=26+hash(i*13.3)*34;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.30)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
});

/* ============================== road math / zones ============================== */
const CYCLE=4800;
const roadX=z=>9*Math.sin(z*0.0055)+4*Math.sin(z*0.0123+2.1);
const band=(z,a,b,e)=>{const m=mod(z,CYCLE);return ss(a,a+e,m)*(1-ss(b-e,b,m));};
const bridgeFactor=z=>band(z,2350,3050,150);
const cityFactor=z=>band(z,1400,2400,160);
const forestFactor=z=>band(z,3000,4200,200);
const roadY=z=>{
  const y=2.2*Math.sin(z*0.0035+1.0)+1.1*Math.sin(z*0.009+0.5);
  const b=bridgeFactor(z);
  return y*(1-b)+7.0*b;
};
const ZONES={
  country:{cap:'ROUTE 9 — OUTSKIRTS',rain:0,fog:.0046,top:0x04060f,hor:0x101a33,glow:0x24365e,gs:.14},
  rain:   {cap:'STORM FRONT — KM 12',rain:1,fog:.0072,top:0x03050c,hor:0x0d1526,glow:0x1a2a4a,gs:.10},
  city:   {cap:'NEON DISTRICT',      rain:.5,fog:.0040,top:0x070716,hor:0x2b2140,glow:0x6a3a7a,gs:.30},
  bridge: {cap:'MERIDIAN BAY BRIDGE',rain:0,fog:.0031,top:0x04060f,hor:0x16233f,glow:0x2a4a7a,gs:.22},
  forest: {cap:'PINECREST PASS — FOG',rain:0,fog:.0125,top:0x02040a,hor:0x0a141f,glow:0x14304a,gs:.12},
};
const zoneAt=z=>{const m=mod(z,CYCLE);
  if(m<600)return'country';if(m<1400)return'rain';if(m<2400)return'city';
  if(m<3000)return'bridge';if(m<4200)return'forest';return'country';};

/* ============================== shared state ============================== */
let carZ=0,speed=30,laneX=1.45,targetLane=1.45,wetness=0,fogCur=.0046,elapsed=0;
let cycleBuilt=-1,prevZone='country',lastYaw=0;
const curTop=new THREE.Color(0x04060f),curHor=new THREE.Color(0x101a33),curGlow=new THREE.Color(0x24365e);
let curGs=.14;

/* ============================== renderer / scene ============================== */
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){ document.getElementById('err').style.display='flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.domElement.className='webgl';
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x101a33,.0046);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.3,4500);
camera.position.set(0,3,-9);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.6,.55,.8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const hemi=new THREE.HemisphereLight(0x2a3a5f,0x0a0c14,.5);scene.add(hemi);
const moonLight=new THREE.DirectionalLight(0x8fb0ff,.4);scene.add(moonLight,moonLight.target);

/* ============================== sky ============================== */
const skyUni={top:{value:new THREE.Color(0x04060f)},hor:{value:new THREE.Color(0x101a33)},
  glow:{value:new THREE.Color(0x24365e)},gs:{value:.14}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1900,24,14),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyUni,
  vertexShader:`varying vec3 vD;void main(){vD=position;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vD;uniform vec3 top,hor,glow;uniform float gs;
    void main(){float h=normalize(vD).y;
    vec3 c=mix(hor,top,pow(smoothstep(-.02,.62,h),.8));
    c=mix(c,hor*.55,smoothstep(-.02,-.3,h));
    c+=glow*pow(max(0.,1.-abs(h)),9.)*gs;
    gl_FragColor=vec4(c,1.);}`
}));
scene.add(sky);

const starGeo=new THREE.BufferGeometry();
{
  const n=900,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=hash(i*1.3)*Math.PI*2,e=Math.asin(hash(i*2.7)*.96+.04),r=1500;
    p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r;
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(p,3));
}
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xcdd9f2,size:2,
  sizeAttenuation:false,transparent:true,opacity:.75,fog:false,depthWrite:false}));
scene.add(stars);

const moon=new THREE.Sprite(new THREE.SpriteMaterial({map:moonTex,transparent:true,
  fog:false,depthWrite:false,opacity:.95}));
moon.scale.set(190,190,1);scene.add(moon);
const MOON_DIR=new THREE.Vector3(-.42,.36,-.83).normalize();

const clouds=[];
for(let i=0;i<12;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,
    color:0x18223c,opacity:.13,depthWrite:false,fog:false}));
  const a=hash(i*3.3)*Math.PI*2,r=450+hash(i*7.1)*550;
  s.userData.off=new THREE.Vector3(Math.cos(a)*r,140+hash(i*11.7)*130,Math.sin(a)*r);
  s.scale.set(480+hash(i*5.9)*420,150+hash(i*8.3)*120,1);
  clouds.push(s);scene.add(s);
}

/* ============================== road segments ============================== */
const SEG=22,SEGN=64,ROAD_W=12.7;
const asphaltMat=new THREE.MeshStandardMaterial({color:0x141822,roughness:.92,metalness:.06});
const marksMat=new THREE.MeshBasicMaterial({vertexColors:true});
function buildMarks(withDash){
  const parts=[];
  const add=(x,w,hex,len=SEG*1.06,zOff=0)=>{
    const g=new THREE.PlaneGeometry(w,len);g.rotateX(-Math.PI/2);g.translate(x,.02,zOff);
    const c=new THREE.Color(hex),n=g.attributes.position.count,a=new Float32Array(n*3);
    for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
    g.setAttribute('color',new THREE.BufferAttribute(a,3));parts.push(g);
  };
  add(-5.95,.16,0x8a93a8);add(5.95,.16,0x8a93a8);
  add(-.22,.12,0x9a7a2a);add(.22,.12,0x9a7a2a);
  if(withDash){add(-2.9,.13,0x707a8c,SEG*.42);add(2.9,.13,0x707a8c,SEG*.42);}
  return mergeGeometries(parts);
}
const marksGeoA=buildMarks(true),marksGeoB=buildMarks(false);
const asphaltGeo=new THREE.PlaneGeometry(ROAD_W,SEG*1.07);asphaltGeo.rotateX(-Math.PI/2);
const segs=[];
for(let i=0;i<SEGN;i++){
  const grp=new THREE.Group();
  const a=new THREE.Mesh(asphaltGeo,asphaltMat);
  const m=new THREE.Mesh(marksGeoA,marksMat);
  grp.add(a,m);scene.add(grp);
  segs.push({grp,marks:m,k:-1e9});
}
const railGeo=new THREE.BoxGeometry(.18,1.05,SEG*1.02);
const railMesh=new THREE.InstancedMesh(railGeo,new THREE.MeshStandardMaterial({color:0x1a2230,roughness:.6,metalness:.5}),SEGN*2);
const railGlowGeo=new THREE.BoxGeometry(.07,.07,SEG*1.02);
const railGlow=new THREE.InstancedMesh(railGlowGeo,new THREE.MeshBasicMaterial({color:0x59d8ff,toneMapped:false}),SEGN*2);
railMesh.frustumCulled=railGlow.frustumCulled=false;
scene.add(railMesh,railGlow);

const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_m1=new THREE.Matrix4(),_m2=new THREE.Matrix4();
function updateRoad(){
  const baseK=Math.floor((carZ-110)/SEG);
  for(let i=0;i<SEGN;i++){
    const s=segs[i],k=baseK+i;
    if(s.k!==k){
      s.k=k;
      const z0=k*SEG,z1=z0+SEG;
      _v1.set(roadX(z0),roadY(z0),z0);_v2.set(roadX(z1),roadY(z1),z1);
      s.grp.position.copy(_v1).add(_v2).multiplyScalar(.5);
      s.grp.lookAt(_v2);
      s.marks.geometry=(mod(k,2)===0)?marksGeoA:marksGeoB;
      s.grp.updateMatrix();
    }
    const midZ=(k+.5)*SEG,bf=bridgeFactor(midZ);
    for(let side=0;side<2;side++){
      const idx=i*2+side,sgn=side?1:-1;
      if(bf>.02){
        _m2.makeTranslation(sgn*6.05,.55,0);_m1.multiplyMatrices(s.grp.matrix,_m2);
        railMesh.setMatrixAt(idx,_m1);
        _m2.makeTranslation(sgn*6.05,1.13,0);_m1.multiplyMatrices(s.grp.matrix,_m2);
        railGlow.setMatrixAt(idx,_m1);
      }else{
        _m1.makeScale(0,0,0);railMesh.setMatrixAt(idx,_m1);railGlow.setMatrixAt(idx,_m1);
      }
    }
  }
  railMesh.instanceMatrix.needsUpdate=true;
  railGlow.instanceMatrix.needsUpdate=true;
}

/* ============================== streetlights ============================== */
const LAMP_SP=55,LAMP_N=34;
const poleGeo=new THREE.CylinderGeometry(.09,.12,7,6);poleGeo.translate(0,3.5,0);
const armGeo=new THREE.BoxGeometry(2.3,.1,.1);armGeo.translate(0,6.9,0);
const headGeo=new THREE.BoxGeometry(.8,.12,.34);headGeo.translate(0,6.78,0);
const lampMat=new THREE.MeshStandardMaterial({color:0x11161f,roughness:.7,metalness:.6});
const poleMesh=new THREE.InstancedMesh(poleGeo,lampMat,LAMP_N);
const armMesh=new THREE.InstancedMesh(armGeo,lampMat,LAMP_N);
const headMesh=new THREE.InstancedMesh(headGeo,new THREE.MeshBasicMaterial({color:0xffc37a,toneMapped:false}),LAMP_N);
poleMesh.frustumCulled=armMesh.frustumCulled=headMesh.frustumCulled=false;
scene.add(poleMesh,armMesh,headMesh);
const lampGlowGeo=new THREE.BufferGeometry();
lampGlowGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(LAMP_N*3),3));
lampGlowGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(LAMP_N*3),3));
const lampGlow=new THREE.Points(lampGlowGeo,new THREE.PointsMaterial({size:6.5,map:glowTex,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,opacity:.9}));
lampGlow.frustumCulled=false;scene.add(lampGlow);
const lampPoolGeo=new THREE.PlaneGeometry(7,9);lampPoolGeo.rotateX(-Math.PI/2);
const lampPool=new THREE.InstancedMesh(lampPoolGeo,new THREE.MeshBasicMaterial({map:poolTex,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.3}),LAMP_N);
lampPool.frustumCulled=false;scene.add(lampPool);
const lampLastK=new Int32Array(LAMP_N).fill(-1e9);
const _dummy=new THREE.Object3D(),_c1=new THREE.Color();
function lampActive(k,z){
  const zn=zoneAt(z);
  if(zn==='city'||zn==='bridge')return true;
  if(zn==='forest')return hash(k*7.3)<.2;
  return hash(k*7.3)<.35;
}

const traffic=[];
function makeTrafficCar(){
  const kind=Math.random()<.72?0:1;
  const grp=new THREE.Group();grp.rotation.order='YXZ';
  const bm=new THREE.Mesh(trafficGeos[kind].body,trafficBodyMat.clone());
  bm.material.color.setHex(PAINTS[Math.floor(Math.random()*PAINTS.length)]);
  const lm=new THREE.Mesh(trafficGeos[kind].lamps,trafficLampMat);
  const fs=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xfff2d8,transparent:true,
    depthWrite:false,blending:THREE.AdditiveBlending,opacity:.9}));
  fs.scale.set(3.6,1.7,1);fs.position.set(0,.75,trafficGeos[kind].len/2+.35);
  const rs=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff2233,transparent:true,
    depthWrite:false,blending:THREE.AdditiveBlending,opacity:.85}));
  rs.scale.set(3.0,1.4,1);rs.position.set(0,.8,-trafficGeos[kind].len/2-.3);
  const pool=new THREE.Mesh(new THREE.PlaneGeometry(4.5,9),
    new THREE.MeshBasicMaterial({map:poolTex,transparent:true,depthWrite:false,
      blending:THREE.AdditiveBlending,opacity:.25}));
  pool.rotation.x=-Math.PI/2;pool.position.y=.06;
  grp.add(bm,lm,fs,rs,pool);scene.add(grp);
  return {grp,pool,kind,dir:1,speed:20,lane:1.45,z:0,wait:0};
}
for(let i=0;i<16;i++)traffic.push(makeTrafficCar());
function laneGapFree(lane,z,dir){
  for(const o of traffic)
    if(o.grp.visible&&o.dir===dir&&o.lane===lane&&Math.abs(o.z-z)<55)return false;
  return true;
}
function respawnSame(c,initial){
  const fast=Math.random()<.3;
  c.dir=1;c.speed=fast?33+Math.random()*5:16+Math.random()*8;
  c.lane=Math.random()<.5?1.45:4.35;
  const z=initial?carZ+(fast?-120+Math.random()*100:150+Math.random()*550)
                 :(fast?carZ-140-Math.random()*60:carZ+420+Math.random()*260);
  if(!laneGapFree(c.lane,z,1)){c.grp.visible=false;c.wait=2+Math.random()*3;return;}
  c.z=z;c.grp.visible=true;
}
function respawnOpp(c,initial){
  c.dir=-1;c.speed=25+Math.random()*8;
  c.lane=Math.random()<.5?-1.45:-4.35;
  const z=initial?carZ+200+Math.random()*900:carZ+520+Math.random()*420;
  if(!laneGapFree(c.lane,z,-1)){c.grp.visible=false;c.wait=1+Math.random()*2;return;}
  c.z=z;c.grp.visible=true;
}
traffic.forEach((c,i)=>{if(i<9)respawnSame(c,true);else respawnOpp(c,true);});
function updateTraffic(dt){
  for(const c of traffic){
    if(!c.grp.visible){
      c.wait-=dt;if(c.wait<=0){if(c.dir===1)respawnSame(c,false);else respawnOpp(c,false);}
      continue;
    }
    c.z+=c.speed*c.dir*dt;
    const dz=c.z-carZ;
    if(c.dir===1&&(dz<-160||dz>900)){respawnSame(c,false);continue;}
    if(c.dir===-1&&dz<-200){respawnOpp(c,false);continue;}
    const x=roadX(c.z)+c.lane,y=roadY(c.z);
    let yaw=Math.atan2(roadX(c.z+3)-roadX(c.z-3),6);
    const pitch=Math.atan2(roadY(c.z+3)-roadY(c.z-3),6);
    if(c.dir<0)yaw+=Math.PI;
    c.grp.position.set(x,y,c.z);
    c.grp.rotation.set(pitch*c.dir,yaw,0);
    c.pool.position.z=c.dir>0?-(trafficGeos[c.kind].len/2+4):(trafficGeos[c.kind].len/2+5);
    c.pool.material.color.setHex(c.dir>0?0xff4444:0xffe8c0);
    c.pool.material.opacity=c.dir>0?.13:.28;
  }
}

/* ============================== rain + lightning ============================== */
const RAIN_N=2500;
const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(RAIN_N*3);
for(let i=0;i<RAIN_N;i++){
  rainPos[i*3]=(Math.random()-.5)*70;
  rainPos[i*3+1]=Math.random()*40;
  rainPos[i*3+2]=(Math.random()-.5)*70;
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rainMat=new THREE.PointsMaterial({color:0x9fb6d8,size:1.5,map:streakTex,transparent:true,
  opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
const rain=new THREE.Points(rainGeo,rainMat);
rain.frustumCulled=false;scene.add(rain);

const skyFlash=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xcfe4ff,
  transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
skyFlash.scale.set(1100,700,1);scene.add(skyFlash);
let flashT0=-10,nextStrike=14;
function strike(){flashT0=elapsed;
  const a=Math.random()*Math.PI*2;
  skyFlash.position.set(camera.position.x+Math.cos(a)*1200,320,camera.position.z+Math.sin(a)*1200);
}
function flashEnv(t){
  const p=(c,w,a)=>a*Math.max(0,1-Math.abs(t-c)/w);
  return Math.min(1.2,p(.06,.06,1)+p(.2,.09,.8)+p(.45,.12,.5));
}

/* ============================== camera director ============================== */
const up=new THREE.Vector3(0,1,0);
const _f=new THREE.Vector3(),_r=new THREE.Vector3(),_pa=new THREE.Vector3(),_pb=new THREE.Vector3(),
      _la=new THREE.Vector3(),_lb=new THREE.Vector3();
const BEATS={
  chaseLow:{dur:11,lb:0,fov:66,hand:.045},
  hood:{dur:8,lb:0,fov:74,hand:.06},
  chaseHigh:{dur:9,lb:0,fov:58,hand:.03},
  side:{dur:9,lb:1,fov:52,hand:.08},
  front:{dur:7,lb:1,fov:55,hand:.07},
  top:{dur:8,lb:0,fov:50,hand:.02},
};
const order=['chaseLow','hood','side','chaseHigh','front','chaseLow','top','side','chaseHigh','front','hood','side'];
let curBeat='chaseLow',prevBeat='chaseLow',beatT=0,beatDur=BEATS.chaseLow.dur,blendT=1,beatIdx=0;
function setBeat(name){prevBeat=curBeat;curBeat=name;blendT=0;beatT=0;beatDur=BEATS[name].dur;}
function forceBeat(name,dur){prevBeat=curBeat;curBeat=name;blendT=0;beatT=0;beatDur=dur;}
function pose(name,out){
  const B=BEATS[name];
  const cx=car.position.x,cy=car.position.y,cz=car.position.z;
  switch(name){
    case 'chaseLow':
      out.pos.set(cx-_f.x*8.6,cy+2.7,cz-_f.z*8.6);
      out.look.set(cx+_f.x*14,cy+1.2,cz+_f.z*14);break;
    case 'hood':
      out.pos.set(cx+_f.x*1.9,cy+1.32,cz+_f.z*1.9);
      out.look.set(cx+_f.x*40,cy+.9,cz+_f.z*40);break;
    case 'chaseHigh':
      out.pos.set(cx-_f.x*13.5,cy+6.2,cz-_f.z*13.5);
      out.look.set(cx+_f.x*10,cy+1,cz+_f.z*10);break;
    case 'side':{
      const c2=roadX(carZ+30)-2*roadX(carZ)+roadX(carZ-30);
      const sg=c2>0?1:-1;
      out.pos.set(cx+_r.x*7.8*sg-_f.x*1.5,cy+1.7,cz+_r.z*7.8*sg-_f.z*1.5);
      out.look.set(cx+_f.x*4,cy+1,cz+_f.z*4);break;}
    case 'front':
      out.pos.set(cx+_f.x*11,cy+1.9,cz+_f.z*11);
      out.look.set(cx,cy+1,cz);break;
    case 'top':
      out.pos.set(cx-_f.x*3,cy+17,cz-_f.z*3);
      out.look.set(cx,cy,cz);break;
  }
  out.fov=B.fov;out.hand=B.hand;out.lb=B.lb;
  return out;
}
const poseA={pos:new THREE.Vector3(),look:new THREE.Vector3(),fov:66,hand:0,lb:0};
const poseB={pos:new THREE.Vector3(),look:new THREE.Vector3(),fov:66,hand:0,lb:0};
function copyPose(dst,src){dst.pos.copy(src.pos);dst.look.copy(src.look);dst.fov=src.fov;dst.hand=src.hand;dst.lb=src.lb;return dst;}
function updateCamera(dt){
  beatT+=dt;
  if(beatT>beatDur){beatIdx=(beatIdx+1)%order.length;setBeat(order[beatIdx]);}
  blendT=Math.min(1,blendT+dt/2.4);
  const e=sst(blendT);
  pose(prevBeat,poseA);pose(curBeat,poseB);
  _pa.lerpVectors(poseA.pos,poseB.pos,e);
  _la.lerpVectors(poseA.look,poseB.look,e);
  const hand=lerp(poseA.hand,poseB.hand,e);
  const t=elapsed;
  _pa.x+=(Math.sin(t*1.7)+Math.sin(t*2.9+1.3))*hand*.12;
  _pa.y+=(Math.sin(t*1.3+2)+Math.sin(t*2.3))*hand*.09;
  _pa.z+=(Math.sin(t*1.9+4)+Math.sin(t*1.1)) *hand*.12;
  _la.x+=Math.sin(t*1.5+.7)*hand*.3;_la.y+=Math.sin(t*2.1+3)*hand*.2;
  const minY=roadY(_pa.z)+.8;
  if(_pa.y<minY)_pa.y=minY;
  camera.position.copy(_pa);
  camera.lookAt(_la);
  const fov=lerp(poseA.fov,poseB.fov,e)+(speed-30)*.35;
  if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix();}
  document.body.classList.toggle('letterbox',BEATS[curBeat].lb===1);
}

/* ============================== HUD / captions ============================== */
const elClock=document.getElementById('clock'),elKmh=document.getElementById('kmh'),
      elOdo=document.getElementById('odo'),elSbar=document.getElementById('sbar'),
      elCap=document.getElementById('caption'),elCapLine=document.getElementById('capline');
function caption(txt){
  elCapLine.textContent=txt;
  elCap.classList.remove('show');void elCap.offsetWidth;elCap.classList.add('show');
}
let hudT=0,didMidnight=false;
function updateHUD(dt){
  hudT+=dt;if(hudT<.12)return;hudT=0;
  const kmh=Math.round(speed*3.7);
  elKmh.textContent=kmh;
  elSbar.style.width=clamp(kmh/140,0,1)*100+'%';
  elOdo.textContent=(carZ/1000).toFixed(1).padStart(6,'0')+' KM · AUTO';
  const sec=mod(23*3600+58*60+40+elapsed,86400);
  const hh=Math.floor(sec/3600),mm=Math.floor(sec/60)%60,ss2=Math.floor(sec)%60;
  elClock.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss2).padStart(2,'0')}`;
  if(!didMidnight&&hh===0){didMidnight=true;caption('00:00 — MIDNIGHT');strike();}
}

/* ============================== audio (optional) ============================== */
let actx=null,audioOn=false,masterGain=null,engOsc=null,engOsc2=null,rainGain=null;
function toggleAudio(){
  try{
    if(!actx){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=actx.createGain();masterGain.gain.value=0;masterGain.connect(actx.destination);
      engOsc=actx.createOscillator();engOsc.type='sawtooth';engOsc.frequency.value=58;
      engOsc2=actx.createOscillator();engOsc2.type='sawtooth';engOsc2.frequency.value=61.5;
      const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=240;
      const eg=actx.createGain();eg.gain.value=.05;
      engOsc.connect(eg);engOsc2.connect(eg);eg.connect(lp);lp.connect(masterGain);
      engOsc.start();engOsc2.start();
      const nb=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
      const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const ns=actx.createBufferSource();ns.buffer=nb;ns.loop=true;
      const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=950;bp.Q.value=.4;
      rainGain=actx.createGain();rainGain.gain.value=0;
      ns.connect(bp);bp.connect(rainGain);rainGain.connect(masterGain);ns.start();
    }
    audioOn=!audioOn;
    masterGain.gain.linearRampToValueAtTime(audioOn?1:0,actx.currentTime+.6);
  }catch(e){}
}
function updateAudio(){
  if(!actx||!audioOn)return;
  const f=50+speed*1.15;
  engOsc.frequency.setTargetAtTime(f,actx.currentTime,.1);
  engOsc2.frequency.setTargetAtTime(f*1.06,actx.currentTime,.1);
  rainGain.gain.setTargetAtTime(wetness*.09,actx.currentTime,.3);
}

/* ============================== grain overlay ============================== */
const grainC=document.getElementById('grain'),grainG=grainC.getContext('2d');
grainC.width=140;grainC.height=80;
setInterval(()=>{
  const img=grainG.createImageData(140,80),d=img.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  grainG.putImageData(img,0,0);
},95);

/* ============================== main loop ============================== */
const clock=new THREE.Clock();

caption('ROUTE 9 — OUTSKIRTS');
setTimeout(()=>document.getElementById('title').classList.add('vis'),700);
setTimeout(()=>document.getElementById('title').classList.remove('vis'),4600);
setTimeout(()=>{document.getElementById('fade').style.opacity='0';},120);
setTimeout(()=>{document.getElementById('hint').style.opacity='.12';},14000);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  elapsed+=dt;

  /* speed + steering */
  speed=30+Math.sin(elapsed*.13)*1.5;
  carZ+=speed*dt;
  let slowAhead=false;
  for(const c of traffic){
    if(c.grp.visible&&c.dir===1&&Math.abs(c.lane-1.45)<.5){
      const dz=c.z-carZ;
      if(dz>0&&dz<75&&c.speed<speed-1)slowAhead=true;
    }
  }
  if(slowAhead)targetLane=4.35;
  else{
    let clear=true;
    for(const c of traffic){
      if(c.grp.visible&&c.dir===1&&Math.abs(c.lane-1.45)<.5){
        const dz=c.z-carZ;if(dz>-25&&dz<60)clear=false;
      }
    }
    if(clear)targetLane=1.45;
  }
  const prevLane=laneX;
  laneX+=clamp(targetLane-laneX,-2.2*dt,2.2*dt);
  const laneVel=(laneX-prevLane)/Math.max(dt,.001);

  const yaw=Math.atan2(roadX(carZ+3)-roadX(carZ-3),6)+Math.atan2(laneVel,speed);
  const pitch=Math.atan2(roadY(carZ+3)-roadY(carZ-3),6);
  const yawRate=(yaw-lastYaw)/Math.max(dt,.001);lastYaw=yaw;
  car.position.set(roadX(carZ)+laneX,roadY(carZ),carZ);
  car.rotation.set(pitch,yaw,clamp(-yawRate*.06-laneVel*.02,-.12,.12));
  for(const w of wheels)w.rotation.x+=speed*dt/.37;

  _f.set(Math.sin(yaw),0,Math.cos(yaw));
  _r.set(-_f.z,0,_f.x);

  headPool.position.set(car.position.x+_f.x*16,roadY(carZ+16)+.06,car.position.z+_f.z*16);
  headPool.rotation.z=-yaw;

  /* zones / weather */
  const zn=zoneAt(carZ),Z=ZONES[zn];
  if(zn!==prevZone){
    caption(Z.cap);
    if(zn==='bridge'){forceBeat('side',12);strike();}
    if(zn==='city')forceBeat('front',9);
    prevZone=zn;
  }
  wetness+=((Z.rain>0?1:0)-wetness)*Math.min(1,dt*.35);
  fogCur+=(Z.fog-fogCur)*Math.min(1,dt*.4);
  scene.fog.density=fogCur;
  curTop.lerp(_c1.setHex(Z.top),dt*.3);
  curHor.lerp(_c1.setHex(Z.hor),dt*.3);
  curGlow.lerp(_c1.setHex(Z.glow),dt*.3);
  curGs+=(Z.gs-curGs)*dt*.3;
  skyUni.top.value.copy(curTop);skyUni.hor.value.copy(curHor);
  skyUni.glow.value.copy(curGlow);skyUni.gs.value=curGs;
  scene.fog.color.copy(curHor);

  asphaltMat.roughness=lerp(.92,.32,wetness);
  asphaltMat.metalness=lerp(.06,.5,wetness);
  asphaltMat.color.setHex(0x141822).lerp(_c1.setHex(0x0d1017),wetness);
  beamMat.opacity=.045+wetness*.05+forestFactor(carZ)*.03;

  /* lightning */
  const bf=bridgeFactor(carZ);
  if(elapsed>nextStrike){
    if(wetness>.45||bf>.4){strike();nextStrike=elapsed+4+Math.random()*7;}
    else nextStrike=elapsed+2;
  }
  const fl=flashEnv(elapsed-flashT0);
  hemi.intensity=.5+fl*2.2;
  renderer.toneMappingExposure=1.15+fl*.45;
  skyFlash.material.opacity=fl*.55;

  /* rain */
  rainMat.opacity=wetness*.55;
  rain.visible=wetness>.02;
  if(rain.visible){
    const cx=camera.position.x,cy=camera.position.y,cz=camera.position.z;
    const fall=(34+speed*.35)*dt;
    for(let i=0;i<RAIN_N;i++){
      rainPos[i*3+1]-=fall;
      if(rainPos[i*3+1]<cy-18){
        rainPos[i*3]=cx+(Math.random()-.5)*70;
        rainPos[i*3+1]=cy+20+Math.random()*8;
        rainPos[i*3+2]=cz+(Math.random()-.5)*70;
      }
    }
    rainGeo.attributes.position.needsUpdate=true;
  }

  /* world upkeep */
  const cyc=Math.floor(carZ/CYCLE);
  if(cyc!==cycleBuilt){cycleBuilt=cyc;buildSkyline(cyc);buildBridge(cyc);}
  updateRoad();updateLamps();updateTrees();updateBuildings();updateBillboards();updateTraffic(dt);

  ground.position.set(car.position.x,lerp(-.25,-9,bf),car.position.z);
  water.material.opacity=bf*.95;
  water.position.set(car.position.x,-8.5,car.position.z);
  moonStreak.material.opacity=bf*.35;
  moonStreak.position.set(car.position.x+MOON_DIR.x*380,-7.5,car.position.z+MOON_DIR.z*380);

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  moon.position.copy(camera.position).addScaledVector(MOON_DIR,1400);
  moonLight.position.copy(car.position).addScaledVector(MOON_DIR,500);
  moonLight.target.position.copy(car.position);
  for(const cl of clouds){
    cl.position.copy(camera.position).add(cl.userData.off);
    cl.userData.off.x+=2*dt;
    if(cl.position.distanceTo(camera.position)>1200){
      const a=Math.random()*Math.PI*2,r=500+Math.random()*500;
      cl.userData.off.set(Math.cos(a)*r,140+Math.random()*130,Math.sin(a)*r);
    }
  }
  for(const b of beacons)b.material.opacity=(Math.sin(elapsed*2+b.userData.ph)+1)/2*.8+.1;

  updateCamera(dt);
  updateHUD(dt);
  updateAudio();
  composer.render();
}
animate();

/* ============================== events ============================== */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='c'){beatIdx=(beatIdx+1)%order.length;setBeat(order[beatIdx]);}
  else if(k==='h'){document.getElementById('hud').classList.toggle('hidden');}
  else if(k==='m'){toggleAudio();}
});
</script>
