<script type="module">
import * as THREE from 'three';

const PI=Math.PI, CYCLE=170, R=90;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const adiff=(a,b)=>{let d=a-b;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return Math.abs(d);};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xc2d2da,70,380);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,1200);
camera.position.set(170,26,60);

const hemi=new THREE.HemisphereLight(0x5f8fd0,0x8a7a5a,0.6); scene.add(hemi);

sun.shadow.camera.left=-115;sun.shadow.camera.right=115;
sun.shadow.camera.top=115;sun.shadow.camera.bottom=-115;

/* ---------- canvas textures ---------- */
function cTex(size,draw,repeat=true){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');draw(g,size);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=4;return t;
}
const wallTex=cTex(256,(g,s)=>{
  g.fillStyle='#d9c9a3';g.fillRect(0,0,s,s);
  for(let i=0;i<900;i++){g.fillStyle=`rgba(${120+rnd(60)|0},${100+rnd(50)|0},70,0.06)`;g.fillRect(rnd(s),rnd(s),2,2);}
  g.fillStyle='#5a4230';
  g.fillRect(0,0,s,12);g.fillRect(0,s-12,s,12);g.fillRect(0,0,12,s);g.fillRect(s-12,0,12,s);
  g.fillRect(s/2-6,0,12,s);g.fillRect(0,s/2-6,s,12);
  g.save();g.translate(s/2,s/2);g.rotate(0.6);g.fillRect(-8,-s/2,16,s/2);g.restore();
  const win=(x,y)=>{g.fillStyle='#232a36';g.fillRect(x-17,y-22,34,44);
    g.strokeStyle='#5a4230';g.lineWidth=4;g.strokeRect(x-17,y-22,34,44);
    g.beginPath();g.moveTo(x,y-22);g.lineTo(x,y+22);g.moveTo(x-17,y);g.lineTo(x+17,y);g.stroke();};
  win(s*0.27,s*0.3);win(s*0.73,s*0.3);win(s*0.27,s*0.76);win(s*0.73,s*0.76);
});
const wallEmisTex=cTex(256,(g,s)=>{
  g.fillStyle='#000';g.fillRect(0,0,s,s);
  const win=(x,y)=>{const gr=g.createRadialGradient(x,y,2,x,y,26);
    gr.addColorStop(0,'#ffc06a');gr.addColorStop(1,'#a85a1e');
    g.fillStyle=gr;g.fillRect(x-15,y-20,30,40);};
  win(s*0.27,s*0.3);win(s*0.73,s*0.3);win(s*0.27,s*0.76);win(s*0.73,s*0.76);
});
const roofTex=cTex(256,(g,s)=>{
  g.fillStyle='#b8b8b8';g.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=22){for(let x=0;x<s;x+=16){
    const off=(y/22)%2?8:0;
    g.fillStyle=`rgba(${60+rnd(30)|0},${60+rnd(30)|0},${60+rnd(30)|0},0.55)`;
    g.fillRect(x+off,y,15,20);
  }}
  g.fillStyle='rgba(255,255,255,0.10)';for(let i=0;i<200;i++)g.fillRect(rnd(s),rnd(s),2,2);
});
const stoneTex=cTex(256,(g,s)=>{
  g.fillStyle='#8d8d94';g.fillRect(0,0,s,s);
  g.strokeStyle='rgba(70,70,78,0.7)';g.lineWidth=3;
  for(let y=0;y<=s;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(s,y);g.stroke();
    const off=(y/32)%2?24:0;
    for(let x=off;x<=s;x+=48){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+32);g.stroke();}}
  for(let i=0;i<500;i++){g.fillStyle=`rgba(${50+rnd(40)|0},${50+rnd(40)|0},${55+rnd(40)|0},0.12)`;g.fillRect(rnd(s),rnd(s),3,3);}
});
function awningTex(c1,c2){return cTex(128,(g,s)=>{
  for(let i=0;i<8;i++){g.fillStyle=i%2?c1:c2;g.fillRect(i*s/8,0,s/8,s);}
  g.fillStyle='rgba(0,0,0,0.12)';g.fillRect(0,s-10,s,10);
});}
const awnRed=awningTex('#a83c32','#e8dcc0'), awnBlue=awningTex('#3c5a8a','#e8dcc0');
const bannerTex=cTex(128,(g,s)=>{
  g.fillStyle='#8a2f28';g.fillRect(0,0,s,s);
  g.fillStyle='#c8a038';g.fillRect(0,0,14,s);g.fillRect(s-14,0,14,s);
  g.beginPath();g.arc(s/2,s*0.42,26,0,7);g.fillStyle='#c8a038';g.fill();
  g.beginPath();g.arc(s/2,s*0.42,16,0,7);g.fillStyle='#8a2f28';g.fill();
  g.fillStyle='#c8a038';g.fillRect(s/2-4,s*0.7,8,s*0.24);
});
const roseTex=cTex(128,(g,s)=>{
  g.fillStyle='#1a1410';g.fillRect(0,0,s,s);
  g.translate(s/2,s/2);
  g.strokeStyle='#ffb050';g.lineWidth=5;
  for(let i=0;i<12;i++){g.rotate(PI/6);g.beginPath();g.moveTo(0,10);g.lineTo(0,58);g.stroke();}
  g.beginPath();g.arc(0,0,58,0,7);g.stroke();
  g.beginPath();g.arc(0,0,34,0,7);g.stroke();
  g.beginPath();g.arc(0,0,10,0,7);g.fillStyle='#ffc878';g.fill();
});

/* ---------- ground ---------- */
const groundTex=cTex(2048,(g,s)=>{
  const k=s/440, cx=s/2;
  g.fillStyle='#5d7a3f';g.fillRect(0,0,s,s);
  const patch=['#4e6b36','#6b8a4a','#55703a','#647e42'];
  for(let i=0;i<900;i++){g.fillStyle=patch[i%4];g.globalAlpha=0.10;
    g.beginPath();g.ellipse(rnd(s),rnd(s),rnd(10,60),rnd(8,40),rnd(PI),0,7);g.fill();}
  g.globalAlpha=1;
  g.strokeStyle='#8a7350';g.lineWidth=6*k;g.lineCap='round';
  g.beginPath();g.moveTo(cx+88*k,cx);g.lineTo(s,cx);g.stroke();
  g.fillStyle='#9a938a';g.beginPath();g.arc(cx,cx,92*k,0,7);g.fill();
  for(let i=0;i<3200;i++){g.fillStyle=Math.random()<0.5?'#7a746c':'#aaa49c';g.globalAlpha=0.15;
    const a=rnd(PI*2),rr=Math.sqrt(Math.random())*92*k;
    g.fillRect(cx+Math.cos(a)*rr,cx+Math.sin(a)*rr,3,3);}
  g.globalAlpha=1;g.strokeStyle='#8b857d';
  for(const rr of [30,55,78]){g.lineWidth=7*k;g.beginPath();g.arc(cx,cx,rr*k,0,7);g.stroke();}
  for(let i=0;i<8;i++){const a=i*PI/4;g.lineWidth=6*k;
    g.beginPath();g.moveTo(cx+Math.cos(a)*15*k,cx+Math.sin(a)*15*k);
    g.lineTo(cx+Math.cos(a)*89*k,cx+Math.sin(a)*89*k);g.stroke();}
  g.fillStyle='#a39c92';g.beginPath();g.arc(cx,cx,15.5*k,0,7);g.fill();
  g.strokeStyle='#8f887e';g.lineWidth=2;
  for(const rr of [4,8,12]){g.beginPath();g.arc(cx,cx,rr*k,0,7);g.stroke();}
  g.fillStyle='#7a746c';g.beginPath();g.arc(cx,cx,3.4*k,0,7);g.fill();
},false);
const groundGeo=new THREE.PlaneGeometry(440,440,96,96);
{const pos=groundGeo.attributes.position;
 for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);
  const d=Math.hypot(x,y),m=ss(96,190,d);
  pos.setZ(i,m*(Math.sin(x*0.045)*Math.cos(y*0.05)*3+Math.sin(x*0.013+y*0.017)*5));}
 groundGeo.computeVertexNormals();}
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({map:groundTex,roughness:1}));
ground.rotation.x=-PI/2;ground.receiveShadow=true;scene.add(ground);

/* ---------- sky, stars, moon ---------- */
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color()},bot:{value:new THREE.Color()},
    sunDir:{value:V(0,1,0)},sunCol:{value:new THREE.Color()}},
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vDir;uniform vec3 top,bot,sunCol;uniform vec3 sunDir;
    void main(){vec3 d=normalize(vDir);float h=clamp(d.y*0.5+0.5,0.,1.);
    vec3 col=mix(bot,top,pow(h,0.75));
    float s=max(dot(d,normalize(sunDir)),0.);
    col+=sunCol*(pow(s,600.)*1.7+pow(s,10.)*0.22);
    gl_FragColor=vec4(col,1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(380,32,16),skyMat));

function makePoints(n,size,color,additive=true){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(n*3),3));
  const m=new THREE.PointsMaterial({color,size,transparent:true,opacity:0,depthWrite:false,
    blending:additive?THREE.AdditiveBlending:THREE.NormalBlending});
  const p=new THREE.Points(g,m);scene.add(p);return p;
}
const stars=makePoints(500,2,0xcfd8ff);stars.material.sizeAttenuation=false;
{const a=stars.geometry.attributes.position;
 for(let i=0;i<500;i++){const th=rnd(PI*2),ph=Math.acos(rnd(0.02,1));
  a.setXYZ(i,375*Math.sin(ph)*Math.cos(th),375*Math.cos(ph),375*Math.sin(ph)*Math.sin(th));}}
const moonMesh=new THREE.Mesh(new THREE.CircleGeometry(11,24),
  new THREE.MeshBasicMaterial({color:0xe8ecf5,transparent:true,opacity:0,fog:false}));
scene.add(moonMesh);

/* ---------- shared materials / geometry ---------- */
const wallMat=new THREE.MeshStandardMaterial({map:wallTex,emissiveMap:wallEmisTex,emissive:0xffb066,emissiveIntensity:0,roughness:0.9});
const roofMat=new THREE.MeshStandardMaterial({map:roofTex,roughness:0.95,side:THREE.DoubleSide});
const stoneMat=new THREE.MeshStandardMaterial({map:stoneTex,roughness:1});
const woodMat=new THREE.MeshStandardMaterial({color:0x6a4a30,roughness:0.9});
const slateMat=new THREE.MeshStandardMaterial({color:0x5a6274,roughness:0.9});
const flameMat=new THREE.MeshStandardMaterial({color:0x664422,emissive:0xffb050,emissiveIntensity:0.2});

const boxGeo=new THREE.BoxGeometry(1,1,1);boxGeo.translate(0,0.5,0);
function roofGeo(){
  const g=new THREE.BufferGeometry();const P=[],UV=[];
  const tri=(a,b,c)=>{P.push(...a,...b,...c);
    const uv=v=>[v[0]*0.35+0.5,(v[2]+v[1])*0.35];UV.push(...uv(a),...uv(b),...uv(c));};
  const A=[-0.5,0,-0.5],B=[-0.5,0,0.5],C=[0,1,0.5],D=[0,1,-0.5],E=[0.5,0,-0.5],F=[0.5,0,0.5];
  tri(A,B,C);tri(A,C,D);tri(F,E,D);tri(F,D,C);tri(B,F,C);tri(E,A,D);
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(UV,2));
  g.computeVertexNormals();return g;
}
const prismGeo=roofGeo();
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
function setI(im,i,px,py,pz,ry,sx,sy,sz){_e.set(0,ry,0);_q.setFromEuler(_e);_p.set(px,py,pz);_s.set(sx,sy,sz);
  _m.compose(_p,_q,_s);im.setMatrixAt(i,_m);}

/* ---------- city walls ---------- */
const wallSegs=[],crens=[],towers=[];
const NSEG=56,chord=2*R*Math.sin(PI/NSEG);
for(let i=0;i<NSEG;i++){const a=i/NSEG*2*PI;
  if(adiff(a,0)<0.10)continue;
  const x=R*Math.cos(a),z=R*Math.sin(a),rot=-(a+PI/2);
  wallSegs.push([x,3.5,z,rot,chord+0.6,7,3]);
  for(let c=-2;c<=2;c++){const off=c*chord/5;
    crens.push([x+off*Math.cos(rot),7,z-off*Math.sin(rot),rot,1.1,1.1,0.9]);}
  if(i%4===0&&adiff(a,0)>0.12)towers.push([x,z]);
}
const wallIM=new THREE.InstancedMesh(boxGeo,stoneMat,wallSegs.length);
wallSegs.forEach((s,i)=>setI(wallIM,i,...s));
const crenIM=new THREE.InstancedMesh(boxGeo,stoneMat,crens.length);
crens.forEach((s,i)=>setI(crenIM,i,s[0],s[1],s[2],s[3],s[4],s[5],s[6]));
const towerIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(3.4,3.8,12,10),stoneMat,towers.length);
const tRoofIM=new THREE.InstancedMesh(new THREE.ConeGeometry(4.2,5,10),slateMat,towers.length);
towers.forEach((t,i)=>{setI(towerIM,i,t[0],6,t[1],0,1,1,1);setI(tRoofIM,i,t[0],14.5,t[1],0,1,1,1);});
[wallIM,crenIM,towerIM,tRoofIM].forEach(m=>{m.castShadow=true;m.receiveShadow=true;scene.add(m);});
/* gate */
{const g1=new THREE.Mesh(new THREE.CylinderGeometry(4,4.4,13,10),stoneMat);
 g1.position.set(90,6.5,7);const g2=g1.clone();g2.position.z=-7;
 const r1=new THREE.Mesh(new THREE.ConeGeometry(4.6,5,10),slateMat);r1.position.set(90,15.5,7);
 const r2=r1.clone();r2.position.z=-7;
 const lintel=new THREE.Mesh(new THREE.BoxGeometry(4,3,14),stoneMat);lintel.position.set(90,8.5,0);
 const d1=new THREE.Mesh(new THREE.BoxGeometry(0.3,5.5,2.8),woodMat);
 d1.position.set(88.5,2.75,3.2);d1.rotation.y=0.9;
 const d2=d1.clone();d2.position.z=-3.2;d2.rotation.y=-0.9;
 [g1,g2,r1,r2,lintel,d1,d2].forEach(m=>{m.castShadow=true;m.receiveShadow=true;scene.add(m);});}

/* ---------- houses ---------- */
const MAXH=280;
const baseIM=new THREE.InstancedMesh(boxGeo,wallMat,MAXH);
const upperIM=new THREE.InstancedMesh(boxGeo,wallMat,MAXH);
const roofIM=new THREE.InstancedMesh(prismGeo,roofMat,MAXH);
const chimIM=new THREE.InstancedMesh(boxGeo,stoneMat,220);
[baseIM,upperIM,roofIM,chimIM].forEach(m=>{m.castShadow=true;m.receiveShadow=true;scene.add(m);});
const wallTints=[0xffffff,0xf2e6d0,0xe8d8c0,0xdccbaa,0xf6efe0].map(c=>new THREE.Color(c));
const roofTints=[0xa9502f,0x8a4a3a,0x6b6f7a,0x7a6248,0x9a5a35].map(c=>new THREE.Color(c));
const smokes=[];let nH=0,nC=0;
for(const r of [23.5,38,46.5,63,71.5,83]){
  const step=8.6/r;
  for(let a=0;a<PI*2;a+=step){
    const ja=a+rnd(-0.02,0.02),jr=r+rnd(-2.2,2.2);
    if(jr<19.5)continue;
    let bad=false;
    for(const rr of [30,55,78])if(Math.abs(jr-rr)<4.8)bad=true;
    for(let k=0;k<8;k++)if(adiff(ja,k*PI/4)*jr<5.2)bad=true;
    if(ja>1.10&&ja<2.05&&jr>16&&jr<46)bad=true;

    const x=jr*Math.cos(ja),z=jr*Math.sin(ja);
    const rot=-(ja+PI/2)+rnd(-0.12,0.12);
    const w=rnd(4.6,7.2),d=rnd(5.5,7.9),h1=rnd(3,3.8);
    const two=Math.random()<0.65,h2=two?rnd(2.6,3.1):0,rh=rnd(2,3.2);
    setI(baseIM,nH,x,0,z,rot,w,h1,d);
    setI(upperIM,nH,x,h1,z,rot,two?w+0.45:0.0001,two?h2:0.0001,two?d+0.45:0.0001);
    setI(roofIM,nH,x,h1+h2,z,rot,w+0.9,rh,d+1.0);
    const wt=wallTints[(Math.random()*wallTints.length)|0];
    baseIM.setColorAt(nH,wt);upperIM.setColorAt(nH,wt);

const _c1=new THREE.Color(),_c2=new THREE.Color();
function updateDay(t){
  let i=0;while(i<K.length-2&&t>=K[i+1].t)i++;
  const a=K[i],b=K[i+1];let f=ss(0,1,(t-a.t)/(b.t-a.t));
  const el=a.el+(b.el-a.el)*f, az=(a.az+(b.az-a.az)*f)*PI/180, elr=el*PI/180;
  const sd=V(Math.cos(elr)*Math.cos(az),Math.sin(elr),Math.cos(elr)*Math.sin(az));
  sun.position.copy(sd).multiplyScalar(240);
  sun.color.copy(_c1.copy(a.sun).lerp(b.sun,f));
  sun.intensity=(a.si+(b.si-a.si)*f)*ss(0,6,el);
  hemi.intensity=a.hi+(b.hi-a.hi)*f;
  skyMat.uniforms.top.value.copy(_c1.copy(a.top).lerp(b.top,f));
  skyMat.uniforms.bot.value.copy(_c1.copy(a.bot).lerp(b.bot,f));
  skyMat.uniforms.sunDir.value.copy(sd);
  skyMat.uniforms.sunCol.value.copy(sun.color);
  scene.fog.color.copy(_c1.copy(a.fog).lerp(b.fog,f));
  hemi.color.copy(skyMat.uniforms.top.value);
  hemi.groundColor.copy(scene.fog.color);
  renderer.toneMappingExposure=a.ex+(b.ex-a.ex)*f;
  nightF=Math.min(1,Math.max(0,(2-el)/7));
  wallMat.emissiveIntensity=nightF*1.35;
  roseMat.emissiveIntensity=0.25+nightF*1.6;
  flameMat.emissiveIntensity=0.2+nightF*2.4;
  stars.material.opacity=nightF*0.9;
  moon.intensity=nightF*0.3;
  moonMesh.material.opacity=nightF*0.95;
  moonMesh.position.set(-0.55,0.62,-0.55).normalize().multiplyScalar(360);
  moonMesh.lookAt(0,0,0);
  flies.material.opacity=nightF*0.85;
}

  p:[[-52,38,-24],[-34,20,-14],[-16,10,-2],[-4,6.5,8],[4,6,4]],
  l:[[-10,4,-4],[-4,3,-2],[0,3,0],[0,3,2],[0,4,0]]},
 {d:14,t:"Until Tomorrow",s:"Nova Aurelia sleeps, and wakes again",
  p:[[4,6,4],[26,16,26],[80,28,52],[170,26,60]],
  l:[[0,6,0],[30,10,10],[90,12,0],[95,10,0]]},
];
CH.forEach(c=>{c.pos=new THREE.CatmullRomCurve3(c.p.map(p=>V(...p)),false,'centripetal');
  c.look=new THREE.CatmullRomCurve3(c.l.map(p=>V(...p)),false,'centripetal');});
const starts=[];{let a=0;CH.forEach(c=>{starts.push(a);a+=c.d;});}
const ease=u=>{const s=u*u*(3-2*u);return u+(s-u)*0.55;};
const tmpP=new THREE.Vector3(),tmpL=new THREE.Vector3();
let cur=-1;

/* ---------- UI ---------- */
const capEl=document.getElementById('cap'),capT=document.getElementById('capT'),capS=document.getElementById('capS');
const barEl=document.getElementById('bar');
CH.forEach(()=>{const s=document.createElement('div');s.className='seg';s.innerHTML='<i></i>';barEl.appendChild(s);});
const segs=[...barEl.children];
let capTimer=null;
function showCaption(i){
  capEl.classList.remove('show');
  clearTimeout(capTimer);
  setTimeout(()=>{capT.textContent=CH[i].t;capS.textContent=CH[i].s;capEl.classList.add('show');},450);
  capTimer=setTimeout(()=>capEl.classList.remove('show'),7000);
}
const hintEl=document.getElementById('hint');
setTimeout(()=>hintEl.classList.add('dim'),14000);
const pauseEl=document.getElementById('pause');

/* ---------- ambience (opt-in) ---------- */
let ac=null,master=null,audioOn=false;
function initAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);
  const len=2*ac.sampleRate,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;
  const wg=ac.createGain();wg.gain.value=0.045;
  const lfo=ac.createOscillator();lfo.frequency.value=0.13;
  const lfoG=ac.createGain();lfoG.gain.value=0.02;
  lfo.connect(lfoG);lfoG.connect(wg.gain);
  src.connect(lp);lp.connect(wg);wg.connect(master);
  src.start();lfo.start();
  audioOn=true;hintEl.textContent='AMBIENCE ON';
}
function bell(f,when=0,g=0.15,dur=3.2){
  if(!audioOn)return;
  const t0=ac.currentTime+when;
  [[1,1],[2.01,0.55],[2.74,0.32],[3.76,0.18],[5.4,0.08]].forEach(([m,gg])=>{
    const o=ac.createOscillator(),gn=ac.createGain();
    o.type='sine';o.frequency.value=f*m;
    gn.gain.setValueAtTime(0,t0);
    gn.gain.linearRampToValueAtTime(g*gg,t0+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+0.2);
  });
}
addEventListener('pointerdown',()=>{initAudio();if(ac.state==='suspended')ac.resume();});
let paused=false;
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();paused=!paused;pauseEl.classList.toggle('on',paused);}
});
function onChapter(i){
  showCaption(i);
  if(i===4){for(let j=0;j<6;j++)bell(j%2?523.25:392,j*0.9,0.2);}
  if(i===0)bell(392,2,0.1);
}

/* ---------- animate ---------- */
const clock=new THREE.Clock();
let el=parseFloat(new URLSearchParams(location.search).get('t'))||0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!paused)el+=dt;
  const t=((el/CYCLE-0.05)%1+1)%1;
  updateDay(t);

  /* camera */
  const tt=el%CYCLE;
  let i=0;while(i<CH.length-1&&tt>=starts[i]+CH[i].d)i++;
  const u=Math.min(1,(tt-starts[i])/CH[i].d),ue=ease(u);
  CH[i].pos.getPoint(ue,tmpP);CH[i].look.getPoint(ue,tmpL);
  camera.position.set(tmpP.x+Math.sin(el*0.4)*0.12,tmpP.y+Math.sin(el*0.53)*0.07,tmpP.z+Math.cos(el*0.31)*0.12);
  tmpL.x+=Math.sin(el*0.23)*0.3;tmpL.y+=Math.cos(el*0.29)*0.2;
  camera.lookAt(tmpL);
  if(i!==cur)onChapter(i),cur=i;
  segs.forEach((s,j)=>{s.firstChild.style.width=j<cur?'100%':j>cur?'0%':(u*100)+'%';});

  /* people */
  for(const p of people){
    let x,z,vx,vz;
    if(p.t===0){const a=p.a0+el*p.w;x=p.r*Math.cos(a);z=p.r*Math.sin(a);
      vx=-Math.sin(a)*Math.sign(p.w);vz=Math.cos(a)*Math.sign(p.w);}
    else if(p.t===1){let uu=(el*p.sp+p.ph)%2;const dir=uu<1?1:-1;if(uu>=1)uu=2-uu;
      const r=p.r0+(p.r1-p.r0)*uu;x=r*Math.cos(p.ang);z=r*Math.sin(p.ang);
      vx=Math.cos(p.ang)*dir;vz=Math.sin(p.ang)*dir;}
    else{const a=p.a0+el*p.w;x=p.cx+p.r*Math.cos(a);z=p.cz+p.r*Math.sin(a);
      vx=-Math.sin(a)*Math.sign(p.w);vz=Math.cos(a)*Math.sign(p.w);}
    p.g.position.set(x,Math.abs(Math.sin(el*7+p.ph))*0.05,z);
    p.g.rotation.y=Math.atan2(vx,vz);
    p.g.visible=nightF<p.curfew;
  }

  /* birds */
  for(const b of birds){
    const a=b.ph+el*b.w;
    b.m.position.set(b.cx+b.r*Math.cos(a),b.h+Math.sin(el*0.7+b.ph)*2,b.cz+b.r*Math.sin(a));
    b.m.rotation.y=Math.atan2(-Math.sin(a)*Math.sign(b.w),Math.cos(a)*Math.sign(b.w));
    b.m.scale.y=0.6+0.4*Math.sin(el*9+b.ph);
    b.m.visible=nightF<0.5;
  }

  /* smoke */
  for(const sc of smokeClouds){
    const a=sc.p.geometry.attributes.position;
    for(let j=0;j<9;j++){
      const lj=(el*0.14+j/9+sc.off)%1;
      a.setXYZ(j,sc.src[0]+Math.sin(lj*5+j)*0.4*lj+lj*lj*2.2,
        sc.src[1]+lj*7,sc.src[2]+Math.cos(lj*4+j)*0.35*lj);
    }
    a.needsUpdate=true;
  }

  /* fireflies */
  {const a=flies.geometry.attributes.position;
   for(let j=0;j<60;j++){
     const b=flyBase[j];
     a.setXYZ(j,b[0]+Math.sin(el*0.9+j)*0.8,b[1]+Math.sin(el*1.3+j*2)*0.4,b[2]+Math.cos(el*0.7+j)*0.8);
   }
   a.needsUpdate=true;}

  /* fountain */
  water.material.opacity=0.75+0.1*Math.sin(el*2.1);
  water.scale.setScalar(1+0.015*Math.sin(el*3.2));
  {const a=splash.geometry.attributes.position;
   for(let j=0;j<14;j++){
     const lj=(el*0.5+j/14)%1,an=j*2.4,r=0.25+lj*0.85;
     a.setXYZ(j,Math.cos(an)*r,1.15+2.6*lj-2.9*lj*lj,Math.sin(an)*r);
   }
   a.needsUpdate=true;}

  /* banners, lanterns, forge */
  banners.forEach((b,j)=>{b.rotation.x=Math.sin(el*1.7+j*1.3)*0.14;b.rotation.y+=Math.sin(el*0.4+j)*0.0004;});
  lampLights.forEach((li,j)=>{li.intensity=nightF*1.7*(0.88+0.12*Math.sin(el*11+j*2.4));});
  forgeLight.intensity=(2.2+nightF*2.6)*(0.85+0.25*Math.sin(el*13)+0.1*Math.sin(el*31));

  /* smithy clinks */
  if(audioOn&&cur===3&&Math.random()<dt*1.3)bell(rnd(1400,2100),0,0.03,0.35);

  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
tick();
</script>
</body>
</html>
