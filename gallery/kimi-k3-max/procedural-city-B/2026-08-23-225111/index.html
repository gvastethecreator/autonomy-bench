<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nocturne — a living procedural city</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060d; }
  canvas { display: block; touch-action: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 46%, rgba(2,4,10,.62) 100%);
  }
  #hud {
    position: fixed; left: 26px; bottom: 24px; pointer-events: none;
    font-family: ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
    color: #a8bce6; text-shadow: 0 1px 8px rgba(0,0,0,.8);
  }
  #hud .title { font-size: 15px; letter-spacing: .55em; }
  #hud .sub { margin-top: 6px; font-size: 10px; letter-spacing: .22em; opacity: .55; }
  #hud .hint { margin-top: 10px; font-size: 10px; letter-spacing: .18em; opacity: .4; animation: hintfade 2.5s ease 7s forwards; }
  @keyframes hintfade { to { opacity: 0; } }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    font-family: ui-monospace, monospace; color: #8fa3cc; font-size: 13px; line-height: 1.8;
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="vignette"></div>
<div id="hud">
  <div class="title">NOCTURNE</div>
  <div class="sub">A LIVING PROCEDURAL CITY</div>
  <div class="hint">drag to look &nbsp;·&nbsp; scroll to zoom</div>
</div>
<div id="fallback"><div>the city could not wake —<br>WebGL or the Three.js CDN is unavailable.</div></div>

<script type="module">
import * as THREE from 'three';

const fallback = document.getElementById('fallback');
setTimeout(() => { if (!window.__cityAwake) fallback.style.display = 'grid'; }, 5000);

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = THREE.MathUtils.clamp;

const BLOCKS = 11, PITCH = 34, STREET = 10, LOT = PITCH - STREET;
const SIZE = BLOCKS * PITCH, HALF = SIZE / 2;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  fallback.style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);
scene.fog = new THREE.FogExp2(0x060a16, 0.0034);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 4200);

scene.add(new THREE.HemisphereLight(0x25335c, 0x05060a, 0.55));
const moonLight = new THREE.DirectionalLight(0x8fb0e8, 0.4);
moonLight.position.set(-560, 420, -720);
scene.add(moonLight);

// ---------- texture helpers ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function glowTexture(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return canvasTex(c);
}

const WIN_WARM = ['#ffd9a3', '#ffc98a', '#ffb46b', '#ffe7c4'];
const WIN_COOL = ['#b9d6ff', '#9fc4ff', '#d6e8ff'];
const WIN_RARE = ['#c8ffd9', '#fff2b8'];
function windowColor() {
  const r = Math.random();
  return r < 0.55 ? pick(WIN_WARM) : r < 0.93 ? pick(WIN_COOL) : pick(WIN_RARE);
}
const DARK_GLASS = ['#0b1220', '#0d1524', '#091019', '#101a2c', '#0a1322'];

// Facade + emissive window textures are cached per quantized window grid so
// hundreds of buildings share a few dozen small canvases.
const texCache = new Map();
const flickerPool = [];
function makeBuildingTextures(cols, floors, variant) {
  const key = cols + 'x' + floors + 'v' + variant;
  if (texCache.has(key)) return texCache.get(key);
  const cw = 13, ch = 16, pw = 9, ph = 10, ox = 6, oy = 7;
  const W = cols * cw + ox * 2, H = floors * ch + oy * 2;
  const map = document.createElement('canvas'); map.width = W; map.height = H;
  const emi = document.createElement('canvas'); emi.width = W; emi.height = H;
  const m = map.getContext('2d'), e = emi.getContext('2d');
  m.fillStyle = pick(['#0d1119', '#0f131c', '#0b0f17', '#10141d']);
  m.fillRect(0, 0, W, H);
  const shade = m.createLinearGradient(0, 0, 0, H);
  shade.addColorStop(0, 'rgba(255,255,255,0.06)');
  shade.addColorStop(1, 'rgba(0,0,0,0.38)');
  m.fillStyle = shade; m.fillRect(0, 0, W, H);
  e.fillStyle = '#000'; e.fillRect(0, 0, W, H);
  const lit = new Array(cols * floors), col = new Array(cols * floors);
  for (let f = 0; f < floors; f++) for (let c = 0; c < cols; c++) {
    const i = f * cols + c, x = ox + c * cw, y = oy + f * ch;
    lit[i] = Math.random() < 0.42;
    col[i] = windowColor();
    m.fillStyle = pick(DARK_GLASS); m.fillRect(x, y, pw, ph);
    if (lit[i]) { m.globalAlpha = 0.22; m.fillStyle = col[i]; m.fillRect(x, y, pw, ph); m.globalAlpha = 1; }
    e.fillStyle = lit[i] ? col[i] : '#04060a';
    e.fillRect(x, y, pw, ph);
  }
  const entry = { map: canvasTex(map), emi: canvasTex(emi) };
  texCache.set(key, entry);
  flickerPool.push({ ctx: e, tex: entry.emi, cols, floors, lit, col, cw, ch, pw, ph, ox, oy });
  return entry;
}

// Unit box (base at y=0) with two material groups: 4 sides + roof/floor,
// so each building costs 2 draw calls instead of 6.
function makeCityBoxGeometry() {
  const pos = [], norm = [], uv = [], idx = [];
  let v = 0;
  const quad = (p0, p1, p2, p3, n) => {
    for (const p of [p0, p1, p2, p3]) { pos.push(p[0], p[1], p[2]); norm.push(n[0], n[1], n[2]); }
    uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(v, v + 1, v + 2, v, v + 2, v + 3);
    v += 4;
  };
  quad([-0.5, 0, 0.5], [0.5, 0, 0.5], [0.5, 1, 0.5], [-0.5, 1, 0.5], [0, 0, 1]);
  quad([0.5, 0, -0.5], [-0.5, 0, -0.5], [-0.5, 1, -0.5], [0.5, 1, -0.5], [0, 0, -1]);
  quad([0.5, 0, 0.5], [0.5, 0, -0.5], [0.5, 1, -0.5], [0.5, 1, 0.5], [1, 0, 0]);
  quad([-0.5, 0, -0.5], [-0.5, 0, 0.5], [-0.5, 1, 0.5], [-0.5, 1, -0.5], [-1, 0, 0]);
  const sides = idx.length;
  quad([-0.5, 1, 0.5], [0.5, 1, 0.5], [0.5, 1, -0.5], [-0.5, 1, -0.5], [0, 1, 0]);
  quad([-0.5, 0, -0.5], [0.5, 0, -0.5], [0.5, 0, 0.5], [-0.5, 0, 0.5], [0, -1, 0]);
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.addGroup(0, sides, 0);
  g.addGroup(sides, idx.length - sides, 1);
  return g;
}
const cityBoxGeo = makeCityBoxGeometry();
const plainBoxGeo = new THREE.BoxGeometry(1, 1, 1); plainBoxGeo.translate(0, 0.5, 0);
const roofMat = new THREE.MeshStandardMaterial({ color: 0x0a0c12, roughness: 0.95 });

// ---------- buildings: downtown-tall skyline falling off toward the edge ----------
const buildings = [];
for (let bi = 0; bi < BLOCKS; bi++) for (let bj = 0; bj < BLOCKS; bj++) {
  const cx = -HALF + bi * PITCH + PITCH / 2, cz = -HALF + bj * PITCH + PITCH / 2;
  const dC = Math.hypot(cx, cz) / HALF;
  const r = Math.random();
  let lots;
  if (r < 0.58) lots = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([sx, sz]) => ({ x: cx + sx * LOT / 4, z: cz + sz * LOT / 4, w: LOT / 2, d: LOT / 2 }));
  else if (r < 0.83) {
    const vert = Math.random() < 0.5;
    lots = vert
      ? [{ x: cx - LOT / 4, z: cz, w: LOT / 2, d: LOT }, { x: cx + LOT / 4, z: cz, w: LOT / 2, d: LOT }]
      : [{ x: cx, z: cz - LOT / 4, w: LOT, d: LOT / 2 }, { x: cx, z: cz + LOT / 4, w: LOT, d: LOT / 2 }];
  } else lots = [{ x: cx, z: cz, w: LOT, d: LOT }];
  for (const lot of lots) {
    const margin = rand(2.2, 3.8);
    const w = Math.max(6, lot.w - margin), d = Math.max(6, lot.d - margin);
    const downtown = Math.pow(clamp(1 - dC, 0, 1), 1.6);
    let h = (8 + downtown * 86) * rand(0.55, 1.25);
    if (dC < 0.32 && Math.random() < 0.16) h *= 1.5;
    h = clamp(h, 7, 108);
    const cols = clamp(Math.round((w + d) / 6.8), 3, 9);
    const floors = clamp(Math.round(h / 3.6), 3, 27);
    const tex = makeBuildingTextures(cols, floors, randInt(0, 1));
    const facade = new THREE.MeshStandardMaterial({
      map: tex.map, emissiveMap: tex.emi, emissive: 0xffffff,
      emissiveIntensity: rand(1.05, 1.45), roughness: 0.92,
      color: pick([0xffffff, 0xf2f4ff, 0xfff6ea])
    });
    const mesh = new THREE.Mesh(cityBoxGeo, [facade, roofMat]);
    mesh.scale.set(w, h, d);
    mesh.position.set(lot.x + rand(-0.5, 0.5), 0, lot.z + rand(-0.5, 0.5));
    scene.add(mesh);
    buildings.push({ x: mesh.position.x, z: mesh.position.z, h, w, d });
    if (Math.random() < 0.35) {
      const rb = new THREE.Mesh(plainBoxGeo, roofMat);
      rb.scale.set(rand(2, Math.max(2.5, w * 0.35)), rand(1, 2.4), rand(2, Math.max(2.5, d * 0.35)));
      rb.position.set(mesh.position.x + rand(-w / 5, w / 5), h, mesh.position.z + rand(-d / 5, d / 5));
      scene.add(rb);
    }
  }
}

// ---------- street lamps along every block midpoint ----------
const lampPos = [];
for (let k = 0; k <= BLOCKS; k++) {
  const v = -HALF + k * PITCH;
  for (let m = 0; m < BLOCKS; m++) {
    const mid = -HALF + m * PITCH + PITCH / 2;
    const s = STREET / 2 + 0.9;
    lampPos.push([v - s, mid], [v + s, mid], [mid, v - s], [mid, v + s]);
  }
}

// ---------- ground: asphalt, sidewalks, lane dashes, warm pools under lamps ----------
const planeSize = SIZE + PITCH * 6;
{
  const gc = document.createElement('canvas'); gc.width = gc.height = 2048;
  const g2 = gc.getContext('2d');
  const S = 2048 / planeSize, px = v => (v + planeSize / 2) * S;
  g2.fillStyle = '#070a10'; g2.fillRect(0, 0, 2048, 2048);
  for (let bi = 0; bi < BLOCKS; bi++) for (let bj = 0; bj < BLOCKS; bj++) {
    const x0 = -HALF + bi * PITCH + STREET / 2, z0 = -HALF + bj * PITCH + STREET / 2;
    g2.fillStyle = '#12161f'; g2.fillRect(px(x0), px(z0), LOT * S, LOT * S);
    g2.fillStyle = '#0b0e16'; g2.fillRect(px(x0 + 1.4), px(z0 + 1.4), (LOT - 2.8) * S, (LOT - 2.8) * S);
  }
  g2.strokeStyle = 'rgba(150,170,215,0.28)';
  g2.lineWidth = Math.max(1, 0.3 * S);
  g2.setLineDash([3.4 * S, 3.8 * S]);
  for (let k = 0; k <= BLOCKS; k++) {
    const v = px(-HALF + k * PITCH);
    g2.beginPath(); g2.moveTo(v, px(-HALF - PITCH)); g2.lineTo(v, px(HALF + PITCH)); g2.stroke();
    g2.beginPath(); g2.moveTo(px(-HALF - PITCH), v); g2.lineTo(px(HALF + PITCH), v); g2.stroke();
  }
  g2.setLineDash([]);
  for (const [lx, lz] of lampPos) {
    const rg = g2.createRadialGradient(px(lx), px(lz), 0, px(lx), px(lz), 8.5 * S);
    rg.addColorStop(0, 'rgba(255,196,122,0.20)');
    rg.addColorStop(1, 'rgba(255,196,122,0)');
    g2.fillStyle = rg;
    g2.beginPath(); g2.arc(px(lx), px(lz), 8.5 * S, 0, 7); g2.fill();
  }
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(planeSize, planeSize),
    new THREE.MeshStandardMaterial({ map: canvasTex(gc), roughness: 0.96 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
}

{
  const poleGeo = new THREE.CylinderGeometry(0.09, 0.13, 5.8, 6); poleGeo.translate(0, 2.9, 0);
  const headGeo = new THREE.SphereGeometry(0.32, 8, 6); headGeo.translate(0, 5.85, 0);
  const poles = new THREE.InstancedMesh(poleGeo, new THREE.MeshStandardMaterial({ color: 0x14171f, roughness: 0.8, metalness: 0.4 }), lampPos.length);
  const heads = new THREE.InstancedMesh(headGeo, new THREE.MeshStandardMaterial({ color: 0x08090c, emissive: 0xffc27a, emissiveIntensity: 2.6 }), lampPos.length);
  poles.frustumCulled = heads.frustumCulled = false;
  const d = new THREE.Object3D();
  lampPos.forEach(([x, z], i) => {
    d.position.set(x, 0, z); d.updateMatrix();
    poles.setMatrixAt(i, d.matrix); heads.setMatrixAt(i, d.matrix);
  });
  scene.add(poles, heads);
}

// ---------- traffic: instanced cars with headlights, taillights and light pools ----------
const CAR_COUNT = 120;
const carBodyGeo = new THREE.BoxGeometry(1.9, 1.0, 4.4); carBodyGeo.translate(0, 0.62, 0);
const carCabGeo = new THREE.BoxGeometry(1.7, 0.6, 2.1); carCabGeo.translate(0, 1.32, -0.25);
const barGeo = new THREE.BoxGeometry(1.55, 0.22, 0.16);
const poolGeo = new THREE.PlaneGeometry(7, 13); poolGeo.rotateX(-Math.PI / 2);
const poolTex = glowTexture([[0, 'rgba(255,240,210,0.8)'], [0.4, 'rgba(255,230,190,0.3)'], [1, 'rgba(255,225,180,0)']]);
const bodies = new THREE.InstancedMesh(carBodyGeo, new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.45 }), CAR_COUNT);
const cabs = new THREE.InstancedMesh(carCabGeo, new THREE.MeshStandardMaterial({ color: 0x0b0f16, roughness: 0.3, metalness: 0.6 }), CAR_COUNT);
const fronts = new THREE.InstancedMesh(barGeo, new THREE.MeshBasicMaterial({ color: 0xdfeeff }), CAR_COUNT);
const rears = new THREE.InstancedMesh(barGeo, new THREE.MeshBasicMaterial({ color: 0xff3424 }), CAR_COUNT);
const pools = new THREE.InstancedMesh(poolGeo, new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }), CAR_COUNT);
bodies.frustumCulled = cabs.frustumCulled = fronts.frustumCulled = rears.frustumCulled = pools.frustumCulled = false;
scene.add(bodies, cabs, fronts, rears, pools);

const carPalette = [0x1c2130, 0x232838, 0x2a2f3f, 0x151a26, 0x30363f, 0x3a3f4a, 0x6b6f7a, 0x1c2130, 0x232838, 0x8a7326];
const cars = [];
{
  const c = new THREE.Color();
  for (let i = 0; i < CAR_COUNT; i++) {
    const axis = Math.random() < 0.5 ? 'x' : 'z';
    const v = -HALF + randInt(0, BLOCKS) * PITCH;
    const dir = Math.random() < 0.5 ? 1 : -1;
    cars.push({ axis, v, dir, lane: dir * 2.4, pos: rand(-HALF, HALF), speed: rand(8, 17), base: rand(9, 16) });
    bodies.setColorAt(i, c.setHex(pick(carPalette)));
  }
  bodies.instanceColor.needsUpdate = true;
}
const mFront = new THREE.Matrix4().makeTranslation(0, 0.62, 2.3);
const mRear = new THREE.Matrix4().makeTranslation(0, 0.62, -2.3);
const mPool = new THREE.Matrix4().makeTranslation(0, 0.05, 8.2);
const dummy = new THREE.Object3D();
const tmpM = new THREE.Matrix4();

// ---------- sky: stars, moon, horizon glow ----------
{
  const N = 900, sp = new Float32Array(N * 3), sc = new Float32Array(N * 3);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const th = rand(0, Math.PI * 2), u = rand(-1, 1);
    const s = Math.sqrt(1 - u * u);
    const y = Math.abs(u) * 0.92 + 0.06;
    const len = Math.hypot(s * Math.cos(th), y, s * Math.sin(th));
    const R = 1500;
    sp[i * 3] = s * Math.cos(th) / len * R; sp[i * 3 + 1] = y / len * R; sp[i * 3 + 2] = s * Math.sin(th) / len * R;
    c.set(pick(['#cfe0ff', '#ffffff', '#ffe9c9', '#9fb8ff'])).multiplyScalar(rand(0.3, 1));
    sc[i * 3] = c.r; sc[i * 3 + 1] = c.g; sc[i * 3 + 2] = c.b;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  sg.setAttribute('color', new THREE.BufferAttribute(sc, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })));
}
const moon = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture([[0, 'rgba(244,248,255,1)'], [0.16, 'rgba(215,228,255,0.9)'], [0.36, 'rgba(140,165,220,0.26)'], [1, 'rgba(120,150,210,0)']]),
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
}));
moon.position.set(-820, 330, -1010); moon.scale.setScalar(230);
scene.add(moon);
const glowTexWarm = glowTexture([[0, 'rgba(255,180,110,0.5)'], [1, 'rgba(255,160,90,0)']]);
for (const [gx, gz] of [[0, -HALF - 70], [0, HALF + 70], [-HALF - 70, 0], [HALF + 70, 0]]) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexWarm, transparent: true, opacity: 0.055, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  s.position.set(gx, 30, gz); s.scale.set(560, 150, 1);
  scene.add(s);
}

// ---------- rooftop beacons + sweeping searchlights ----------
const beaconTex = glowTexture([[0, 'rgba(255,90,80,1)'], [0.3, 'rgba(255,60,50,0.5)'], [1, 'rgba(255,40,30,0)']]);
const beacons = [];
const tallest = [...buildings].sort((a, b) => b.h - a.h);
for (const b of tallest.slice(0, 10)) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: beaconTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  s.position.set(b.x, b.h + 1.6, b.z);
  s.scale.setScalar(7);
  s.userData.phase = rand(0, Math.PI * 2);
  scene.add(s); beacons.push(s);
  const mast = new THREE.Mesh(plainBoxGeo, roofMat);
  mast.scale.set(0.3, 2.6, 0.3); mast.position.set(b.x, b.h, b.z);
  scene.add(mast);
}
const searchlights = [];
{
  const coneGeo = new THREE.CylinderGeometry(0.7, 18, 190, 12, 1, true);
  coneGeo.translate(0, 95, 0);
  const coneMat = new THREE.MeshBasicMaterial({ color: 0xaac4ff, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false, fog: false });
  const srcTex = glowTexture([[0, 'rgba(220,235,255,0.95)'], [1, 'rgba(160,190,255,0)']]);
  tallest.slice(0, 2).forEach((b, i) => {
    const pivot = new THREE.Group();
    pivot.position.set(b.x, b.h + 0.5, b.z);
    const tilt = new THREE.Group(); tilt.rotation.x = 0.5;
    tilt.add(new THREE.Mesh(coneGeo, coneMat));
    pivot.add(tilt);
    const src = new THREE.Sprite(new THREE.SpriteMaterial({ map: srcTex, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    src.scale.setScalar(6);
    pivot.add(src);
    scene.add(pivot);
    searchlights.push({ pivot, speed: i ? -0.16 : 0.21 });
  });
}

// ---------- camera: slow cinematic orbit, user drag/zoom on top ----------
let userAz = 0, userEl = 0, userRad = 0, dragging = false, lx = 0, ly = 0;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; dom.setPointerCapture(e.pointerId); });
dom.addEventListener('pointermove', e => {
  if (!dragging) return;
  userAz -= (e.clientX - lx) * 0.0042;
  userEl = clamp(userEl + (e.clientY - ly) * 0.0028, -0.2, 0.34);
  lx = e.clientX; ly = e.clientY;
});
const stopDrag = () => dragging = false;
dom.addEventListener('pointerup', stopDrag);
dom.addEventListener('pointercancel', stopDrag);
dom.addEventListener('wheel', e => { e.preventDefault(); userRad = clamp(userRad + e.deltaY * 0.22, -140, 250); }, { passive: false });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rotSpeed = reduced ? 0 : 0.022;
const clock = new THREE.Clock();
let t = 0, flickerTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  const az = 0.8 + t * rotSpeed + userAz;
  const elv = clamp(0.36 + Math.sin(t * 0.045) * 0.06 + userEl, 0.14, 0.75);
  const rad = clamp(305 + Math.sin(t * 0.03) * 22 + userRad, 160, 560);
  camera.position.set(Math.cos(az) * Math.cos(elv) * rad, Math.sin(elv) * rad, Math.sin(az) * Math.cos(elv) * rad);
  camera.lookAt(0, 16, 0);

  for (let i = 0; i < CAR_COUNT; i++) {
    const c = cars[i];
    c.pos += c.dir * c.speed * dt;
    if (c.pos > HALF + 14) c.pos = -HALF - 14;
    else if (c.pos < -HALF - 14) c.pos = HALF + 14;
    c.speed = clamp(c.speed + (c.base - c.speed) * dt * 0.4 + (Math.random() - 0.5) * dt * 2, 5, 20);
    if (c.axis === 'x') {
      dummy.position.set(c.pos, 0, c.v + c.lane);
      dummy.rotation.y = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    } else {
      dummy.position.set(c.v - c.lane, 0, c.pos);
      dummy.rotation.y = c.dir > 0 ? 0 : Math.PI;
    }
    dummy.updateMatrix();
    bodies.setMatrixAt(i, dummy.matrix);
    cabs.setMatrixAt(i, dummy.matrix);
    fronts.setMatrixAt(i, tmpM.multiplyMatrices(dummy.matrix, mFront));
    rears.setMatrixAt(i, tmpM.multiplyMatrices(dummy.matrix, mRear));
    pools.setMatrixAt(i, tmpM.multiplyMatrices(dummy.matrix, mPool));
  }
  bodies.instanceMatrix.needsUpdate = true;
  cabs.instanceMatrix.needsUpdate = true;
  fronts.instanceMatrix.needsUpdate = true;
  rears.instanceMatrix.needsUpdate = true;
  pools.instanceMatrix.needsUpdate = true;

  // windows toggle on/off across the city a few times a second
  flickerTimer += dt;
  while (flickerTimer > 0.12) {
    flickerTimer -= 0.12;
    const e = pick(flickerPool);
    const i = randInt(0, e.lit.length - 1);
    e.lit[i] = !e.lit[i];
    if (e.lit[i]) e.col[i] = windowColor();
    e.ctx.fillStyle = e.lit[i] ? e.col[i] : '#04060a';
    e.ctx.fillRect(e.ox + (i % e.cols) * e.cw, e.oy + ((i / e.cols) | 0) * e.ch, e.pw, e.ph);
    e.tex.needsUpdate = true;
  }

  for (const b of beacons) {
    const p = Math.pow(Math.max(0, Math.sin(t * 1.4 + b.userData.phase)), 8);
    b.material.opacity = 0.12 + p * 0.88;
  }
  for (const s of searchlights) s.pivot.rotation.y += s.speed * dt;

  renderer.render(scene, camera);
  window.__cityAwake = true;
}
animate();
</script>
