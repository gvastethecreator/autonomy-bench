<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Endless Night Drive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", system-ui, sans-serif; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,.62) 100%); }
  #hood { position: absolute; left: 0; right: 0; bottom: 0; height: 20vh; background: linear-gradient(to top, rgba(3,4,8,.97) 0%, rgba(3,4,8,.85) 38%, transparent 100%); }
  #dash-glow { position: absolute; left: 0; right: 0; bottom: 0; height: 20vh; background: radial-gradient(ellipse at 50% 115%, rgba(70,90,130,.20), transparent 60%); }
  #title { position: absolute; top: 22px; left: 0; right: 0; text-align: center; color: #aab4c8; font-size: 12px; letter-spacing: .55em; text-transform: uppercase; opacity: .65; }
  #speedbox { position: absolute; left: 34px; bottom: 30px; color: #eef2f8; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  #speed { font-size: 56px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  #unit { font-size: 12px; letter-spacing: .3em; color: #9aa5b8; margin-top: 6px; text-transform: uppercase; }
  #hint { position: absolute; right: 34px; bottom: 34px; color: #8b96ab; font-size: 12.5px; letter-spacing: .06em; animation: hintfade 1s ease 9s forwards; }
  @keyframes hintfade { to { opacity: 0; } }
</style>
</head>
<body>
<div id="ui">
  <div id="vignette"></div>
  <div id="hood"></div>
  <div id="dash-glow"></div>
  <div id="title">Endless Night Drive</div>
  <div id="speedbox"><div id="speed">0</div><div id="unit">km/h</div></div>
  <div id="hint">W / &uarr; accelerate &nbsp;&middot;&nbsp; S / &darr; brake &nbsp;&middot;&nbsp; A D / &larr; &rarr; change lanes</div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const LOOP = 720;                              // world wrap length (units)
const LANE_W = 3.6;
const LANES = [LANE_W * 0.5, LANE_W * 1.5];    // player lanes (right carriageway)
const ONCOMING = [-LANE_W * 0.5, -LANE_W * 1.5];
const WRAP_BACK = 30;                          // wrap point behind the camera

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
scene.fog = new THREE.Fog(0x04060c, 55, 380);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 2500);

// ---------- canvas-generated textures ----------
function radialTex(stops, size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) grad.addColorStop(o, col);
  g.fillStyle = grad; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,.55)'], [1, 'rgba(255,255,255,0)']]);
const poolTex = radialTex([[0, 'rgba(255,236,190,.6)'], [0.6, 'rgba(255,236,190,.18)'], [1, 'rgba(255,236,190,0)']], 256);

function asphaltTex() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#14161b'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 3200; i++) {
    const v = 16 + (Math.random() * 26 | 0);
    g.fillStyle = `rgb(${v},${v},${v + 4})`;
    g.fillRect(Math.random() * s, Math.random() * s, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 90);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const asphalt = asphaltTex();
const ASPHALT_TILE = 840 / 90;                 // world units per texture repeat along the road

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x2a3752, 0x05070a, 0.7));
const moonLight = new THREE.DirectionalLight(0x8fa3cc, 0.4);
moonLight.position.set(140, 190, -320);
scene.add(moonLight);

function headlight(dx) {
  const s = new THREE.SpotLight(0xffe9c4, 950, 210, 0.5, 0.7, 1.7);
  s.position.set(dx, 1.9, 0.6);
  s.userData.dx = dx;
  scene.add(s); scene.add(s.target);
  return s;
}
const headlights = [headlight(-0.8), headlight(0.8)];

// ---------- road & ground ----------
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(19, 840),
  new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95, metalness: 0 })
);
road.rotation.x = -Math.PI / 2;
road.position.z = -390;
scene.add(road);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.MeshStandardMaterial({ color: 0x070a09, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.08, -500);
scene.add(ground);

// continuous painted lines (uniform, so they never need to move)
const lineMatW = new THREE.MeshBasicMaterial({ color: 0xd7dee8 });
const lineMatY = new THREE.MeshBasicMaterial({ color: 0xc9a437 });
function strip(x, w, mat) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 840), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.02, -390);
  scene.add(m);
}
strip(-0.3, 0.14, lineMatY); strip(0.3, 0.14, lineMatY);   // double yellow centre line
strip(-7.35, 0.16, lineMatW); strip(7.35, 0.16, lineMatW); // edge lines

// ---------- scrolling world objects ----------
const scrollers = [];

// dashed lane dividers
const dashGeo = new THREE.BoxGeometry(0.16, 0.03, 3.2);
for (const x of [-LANE_W, LANE_W])
  for (let z = WRAP_BACK; z > WRAP_BACK - LOOP; z -= 12) {
    const d = new THREE.Mesh(dashGeo, lineMatW);
    d.position.set(x, 0.02, z);
    scene.add(d); scrollers.push(d);
  }

// roadside reflector posts
const postGeo = new THREE.BoxGeometry(0.14, 1.05, 0.14);
const postMat = new THREE.MeshStandardMaterial({ color: 0x2a2f36, roughness: 0.8 });
const reflGeo = new THREE.BoxGeometry(0.18, 0.12, 0.06);
const reflR = new THREE.MeshBasicMaterial({ color: 0xff5030 });
const reflL = new THREE.MeshBasicMaterial({ color: 0xffeecc });
for (let z = WRAP_BACK; z > WRAP_BACK - LOOP; z -= 18)
  for (const side of [-1, 1]) {
    const g = new THREE.Group();
    const p = new THREE.Mesh(postGeo, postMat); p.position.y = 0.52; g.add(p);
    const r = new THREE.Mesh(reflGeo, side < 0 ? reflL : reflR); r.position.y = 0.96; g.add(r);
    g.position.set(side * 8.7, 0, z);
    scene.add(g); scrollers.push(g);
  }

// street lamps, alternating sides, with a fake pool of light on the tarmac
const poleMat = new THREE.MeshStandardMaterial({ color: 0x30363d, roughness: 0.6, metalness: 0.5 });
const lampHeadMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0 });
function makeLamp(side) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 7.6, 8), poleMat);
  pole.position.set(side * 10.6, 3.8, 0); g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.12, 0.12), poleMat);
  arm.position.set(side * 9.15, 7.52, 0); g.add(arm);
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.22, 0.42), lampHeadMat);
  head.position.set(side * 7.85, 7.42, 0); g.add(head);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffc978, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: false, opacity: 0.85
  }));
  glow.scale.set(4.2, 4.2, 1); glow.position.set(side * 7.85, 7.35, 0); g.add(glow);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(6.4, 24), new THREE.MeshBasicMaterial({
    map: poolTex, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, opacity: 0.65
  }));
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(side * 6.3, 0.035, 0);
  pool.scale.set(1, 1.7, 1);
  g.add(pool);
  return g;
}
let lampSide = 1;
for (let z = WRAP_BACK; z > WRAP_BACK - LOOP; z -= 42) {
  const l = makeLamp(lampSide);
  l.position.z = z; scene.add(l); scrollers.push(l);
  lampSide *= -1;
}

// pine silhouettes scattered along both roadsides
const treeMat = new THREE.MeshStandardMaterial({ color: 0x0c1510, roughness: 1 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x16110c, roughness: 1 });
for (let i = 0; i < 90; i++) {
  const g = new THREE.Group();
  const h = 4 + Math.random() * 6.5;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(h * 0.32, h, 7), treeMat);
  cone.position.y = h * 0.55 + 0.9; g.add(cone);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 1.4, 6), trunkMat);
  trunk.position.y = 0.7; g.add(trunk);
  const side = Math.random() < 0.5 ? -1 : 1;
  g.position.set(side * (12 + Math.random() * 30), 0, WRAP_BACK - Math.random() * LOOP);
  scene.add(g); scrollers.push(g);
}

// ---------- sky ----------
const starCount = 1000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3]     = (Math.random() - 0.5) * 2000;
  starPos[i * 3 + 1] = 60 + Math.random() * 700;
  starPos[i * 3 + 2] = 200 - Math.random() * 1600;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xcdd8ff, size: 2.1, sizeAttenuation: false, transparent: true, opacity: 0.9, fog: false
})));

const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xf2eee0, fog: false, opacity: 0.95 }));
moon.scale.set(85, 85, 1); moon.position.set(210, 200, -950); scene.add(moon);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xbcc8e8, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.22
}));
moonHalo.scale.set(230, 230, 1); moonHalo.position.copy(moon.position); scene.add(moonHalo);

// faint glow of a distant town on the horizon
const cityGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0x3a4a6a, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.35
}));
cityGlow.scale.set(900, 120, 1); cityGlow.position.set(-250, 40, -980); scene.add(cityGlow);

// ---------- traffic ----------
function makeCar(oncoming) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x0b0d12, roughness: 0.45, metalness: 0.5 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.2, 4.4), mat);
  body.position.y = 0.85; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.8, 2.1), mat);
  cab.position.set(0, 1.65, -0.25); g.add(cab);
  const light = (dx, color, scale, opacity, z) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity
    }));
    s.scale.set(scale, scale, 1); s.position.set(dx, 0.85, z); g.add(s);
  };
  if (oncoming) {
    for (const dx of [-0.68, 0.68]) {
      light(dx, 0xfff6da, 1.6, 1.0, 2.25);   // headlight cores
      light(dx, 0xfff0c0, 4.2, 0.3, 2.25);   // halos
    }
  } else {
    for (const dx of [-0.72, 0.72]) light(dx, 0xff2418, 1.0, 0.95, -2.25); // taillights
  }
  return g;
}

const traffic = [];
for (let i = 0; i < 7; i++) {
  const c = makeCar(true);
  c.position.set(ONCOMING[i % 2], 0, -40 - i * 105 - Math.random() * 50);
  c.userData.v = 25 + Math.random() * 9;
  c.userData.oncoming = true;
  scene.add(c); traffic.push(c);
}
for (let i = 0; i < 5; i++) {
  const c = makeCar(false);
  c.position.set(LANES[i % 2], 0, -120 - i * 140 - Math.random() * 60);
  c.userData.v = 16 + Math.random() * 7;
  c.userData.oncoming = false;
  scene.add(c); traffic.push(c);
}

// ---------- input & vehicle state ----------
const MAX_SPEED = 58;
let speed = 20;
let laneIndex = 0;
let carX = LANES[0];
const keys = Object.create(null);

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') laneIndex = Math.max(0, laneIndex - 1);
  if (e.code === 'ArrowRight' || e.code === 'KeyD') laneIndex = Math.min(LANES.length - 1, laneIndex + 1);
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const speedEl = document.getElementById('speed');

// ---------- main loop ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // longitudinal dynamics
  const up = keys.ArrowUp || keys.KeyW;
  const down = keys.ArrowDown || keys.KeyS;
  if (up) speed += 13 * dt;
  if (down) speed -= 30 * dt;
  speed -= (0.35 + speed * 0.004) * dt * (up ? 0.4 : 1);
  speed = THREE.MathUtils.clamp(speed, 0, MAX_SPEED);

  // lateral lane-keeping
  const targetX = LANES[laneIndex];
  const latErr = targetX - carX;
  carX += latErr * Math.min(1, dt * 3.4);

  // scroll the world towards the camera, wrapping what passes behind
  const dz = speed * dt;
  for (const o of scrollers) {
    o.position.z += dz;
    if (o.position.z > WRAP_BACK) o.position.z -= LOOP;
  }
  asphalt.offset.y += dz / ASPHALT_TILE;

  // traffic moves at its own pace relative to the player
  for (const c of traffic) {
    const rel = c.userData.oncoming ? speed + c.userData.v : speed - c.userData.v;
    c.position.z += rel * dt;
    if (c.position.z > WRAP_BACK) c.position.z -= LOOP;
    else if (c.position.z < WRAP_BACK - LOOP) c.position.z += LOOP;
  }

  // headlights ride with the car
  for (const h of headlights) {
    h.position.x = carX + h.userData.dx;
    h.target.position.set(carX + h.userData.dx * 2.4, 0.15, -48);
  }

  // camera: seat height, engine bob, lane-change roll, speed-widened FOV
  const sf = speed / MAX_SPEED;
  const bob = (Math.sin(t * 7.3) * 0.02 + Math.sin(t * 12.9) * 0.013) * (0.3 + sf);
  camera.position.set(carX, 2.08 + bob, 0);
  camera.lookAt(carX + latErr * 1.4, 1.05 + bob * 0.5, -42);
  camera.rotateZ(-latErr * 0.04);
  const fov = 66 + sf * 12;
  if (Math.abs(fov - camera.fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }

  speedEl.textContent = Math.round(speed * 2.6);
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
