<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --cyan:#7df3ff; --mag:#ff7ad9; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#04050d; }
  body { font-family:'Rajdhani', system-ui, sans-serif; color:#e8ecf8; }
  canvas { display:block; touch-action:none; cursor:grab; }
  body.drag canvas { cursor:grabbing; }
  .ui { position:fixed; pointer-events:none; z-index:10; }
  .bar { left:0; right:0; height:0; background:#000; animation:bars 2s cubic-bezier(.6,0,.3,1) .3s forwards; }
  #barT { top:0; } #barB { bottom:0; }
  @keyframes bars { to { height:4.5vh; } }
  #vignette { inset:0; background:radial-gradient(ellipse at center, transparent 52%, rgba(3,4,12,.42) 82%, rgba(2,3,9,.78) 100%); }
  #title { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; opacity:0; animation:title 7.5s ease .6s forwards; }
  @keyframes title { 0%{opacity:0; transform:translateY(12px);} 9%{opacity:1; transform:none;} 72%{opacity:1;} 100%{opacity:0; visibility:hidden;} }
  #title h1 { font-family:'Cinzel', serif; font-weight:700; font-size:clamp(34px, 7vw, 84px); letter-spacing:.42em; text-indent:.42em; color:#f4f1ff; text-shadow:0 0 34px rgba(125,243,255,.35), 0 0 90px rgba(255,122,217,.18); }
  #title p { margin-top:16px; font-size:clamp(11px,1.4vw,15px); letter-spacing:.58em; text-indent:.58em; text-transform:uppercase; color:#9aa3c7; }
  #title .rule { width:130px; height:1px; margin:24px auto 0; background:linear-gradient(90deg, transparent, var(--cyan), var(--mag), transparent); }
  #elem { left:4vw; bottom:8.5vh; transition:opacity .35s ease; }
  #elem .k { font-size:11px; letter-spacing:.5em; color:#8f97bd; text-transform:uppercase; }
  #elem .n { font-family:'Cinzel', serif; font-size:clamp(18px,2.4vw,28px); letter-spacing:.18em; color:#f0f2ff; text-shadow:0 0 18px rgba(125,243,255,.25); }
  #elem.dim { opacity:0; }
  #prog { left:50%; bottom:6.2vh; width:min(220px, 30vw); height:2px; transform:translateX(-50%); background:rgba(255,255,255,.10); border-radius:2px; overflow:hidden; }
  #prog i { display:block; height:100%; width:100%; transform-origin:left; transform:scaleX(0); background:linear-gradient(90deg, var(--cyan), var(--mag)); box-shadow:0 0 8px rgba(125,243,255,.8); }
  #hint { right:4vw; bottom:6.5vh; font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:#7c84ab; opacity:0; animation:hint 13s ease 2.4s forwards; }
  @keyframes hint { 0%{opacity:0;} 8%{opacity:.9;} 78%{opacity:.9;} 100%{opacity:0; visibility:hidden;} }
  #hint b { color:#c9d2f5; font-weight:600; }
  #loader { inset:0; display:flex; align-items:center; justify-content:center; background:#04050d; z-index:40; transition:opacity 1.1s ease, visibility 1.1s; flex-direction:column; gap:18px; }
  #loader.done { opacity:0; visibility:hidden; }
  #loader .t { font-family:'Cinzel', serif; letter-spacing:.5em; text-indent:.5em; font-size:15px; color:#aab3d8; }
  #loader .spin { width:34px; height:34px; border-radius:50%; border:1px solid rgba(125,243,255,.18); border-top-color:var(--cyan); animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #err { inset:0; display:none; align-items:center; justify-content:center; background:#04050d; z-index:50; text-align:center; padding:0 8vw; }
  #err.show { display:flex; }
  #err p { color:#c8cfe9; letter-spacing:.12em; line-height:1.9; font-size:14px; max-width:540px; }
  body.nohud .ui:not(#loader):not(#err) { opacity:0 !important; visibility:hidden; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}

<body>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#c8cfe9;font-family:serif;letter-spacing:.2em;">This ride needs JavaScript.</div></noscript>
<div id="loader" class="ui"><div class="spin"></div><div class="t">NOCTURNE</div></div>
<div id="err" class="ui"><p></p></div>
<div id="barT" class="ui bar"></div><div id="barB" class="ui bar"></div>
<div id="vignette" class="ui"></div>
<div id="title" class="ui"><h1>NOCTURNE</h1><div class="rule"></div><p>a first-person night ride</p></div>
<div id="elem" class="ui"><div class="k">now riding</div><div class="n" id="elemName">Departure</div></div>
<div id="prog" class="ui"><i id="progFill"></i></div>
<div id="hint" class="ui"><b>drag</b> look &nbsp;·&nbsp; <b>R</b> replay &nbsp;·&nbsp; <b>H</b> hide ui</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

let started = false;
const loaderEl = document.getElementById('loader');
const errEl = document.getElementById('err');
function fail(msg){
  errEl.querySelector('p').textContent = msg;
  errEl.classList.add('show');
  loaderEl.classList.add('done');
}
window.addEventListener('error', (e)=>{ if(!started) fail('The night could not be composed — ' + (e.message || 'a resource failed to load')); });

try { main(); } catch (ex) { fail('The night could not be composed — ' + ex.message); throw ex; }

function main(){

const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sstep = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const n1 = (t)=> (Math.sin(t*1.31)+Math.sin(t*2.17+1.3)+Math.sin(t*3.71+4.2))/3;

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a1b45, 95, 800);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2200);
scene.add(camera);

/* ---------------- track layout ---------------- */
const CP = [
  [   0, 3.2, -10 ], [   0, 3.2,   4 ], [   1, 3.2,  20 ], [   6, 3.4,  36 ],
  [  16, 4.2,  52 ], [  29, 7.0,  67 ], [  40,15.0,  84 ], [  47,26.0,  99 ],
  [  53,33.0, 110 ], [  58,22.0, 121 ], [  66, 6.0, 136 ], [  82, 5.0, 148 ],
  [ 100, 7.5, 152 ], [ 116,11.0, 146 ], [ 128,13.0, 132 ], [ 136,17.0, 114 ],
  [ 143, 8.0,  96 ], [ 147,12.5,  78 ], [ 149, 6.0,  58 ], [ 149, 5.0,  44 ],
  [ 149,12.5,  35 ], [ 149,19.0,  27 ], [ 149,12.5,  19 ], [ 149, 5.5,  10 ],
  [ 143, 6.0,  -4 ], [ 130, 9.5, -14 ], [ 112,13.5, -16 ], [  94,11.0, -10 ],
  [  80, 7.5,   0 ], [  67,10.0,   8 ], [  55, 5.5,  12 ], [  44, 8.5,   9 ],
  [  34, 5.0,   2 ], [  24, 4.4,  -8 ], [  12, 4.0, -16 ], [   0, 3.6, -20 ],
  [ -10, 3.4, -14 ], [ -14, 3.2,  -4 ], [  -7, 3.2,   5 ]
].map(p => new THREE.Vector3(p[0], p[1], p[2]));

const curve = new THREE.CatmullRomCurve3(CP, true, 'centripetal');
curve.arcLengthDivisions = 4000;
const N = 2600;
const L = curve.getLength();

const P = curve.getSpacedPoints(N); P.pop();

const TAN = new Array(N);
for (let i=0;i<N;i++){
  TAN[i] = P[(i+1)%N].clone().sub(P[(i-1+N)%N]).normalize();
}

/* parallel-transport frames, twist-corrected for a seamless loop */
const NUP = new Array(N);
{
  const t0 = TAN[0];
  const n0 = Math.abs(t0.y) > 0.95 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
  n0.sub(t0.clone().multiplyScalar(n0.dot(t0))).normalize();
  NUP[0] = n0;
  const q = new THREE.Quaternion();
  for (let i=1;i<N;i++){
    q.setFromUnitVectors(TAN[i-1], TAN[i]);
    const n = NUP[i-1].clone().applyQuaternion(q);
    n.sub(TAN[i].clone().multiplyScalar(n.dot(TAN[i]))).normalize();
    NUP[i] = n;
  }
  q.setFromUnitVectors(TAN[N-1], TAN[0]);
  const nEnd = NUP[N-1].clone().applyQuaternion(q);
  nEnd.sub(TAN[0].clone().multiplyScalar(nEnd.dot(TAN[0]))).normalize();
  const cr = new THREE.Vector3().crossVectors(nEnd, NUP[0]);
  const twist = Math.atan2(cr.dot(TAN[0]), nEnd.dot(NUP[0]));
  for (let i=1;i<N;i++) NUP[i].applyAxisAngle(TAN[i], twist*(i/N));
}

/* ---------------- speed profile (energy + lift + brakes) ---------------- */
const G = 9.81, LIFT_V = 5.2, MIN_V = 2.6, MAX_V = 42;
const YA = new Float64Array(N);
for (let i=0;i<N;i++) YA[i] = P[i].y;

let crest = 0;
for (let i=1;i<N;i++) if (YA[i] > YA[crest]) crest = i;

let liftStart = crest;
{
  let guard = 0;
  while (guard++ < N){
    const p = (liftStart-1+N)%N;
    if (YA[p] <= YA[liftStart] + 0.02 && YA[p] > 3.6) liftStart = p; else break;
  }
}

const SPD = new Float64Array(N);
const ONL = new Uint8Array(N);
{
  let i = liftStart;
  while (true){ ONL[i]=1; SPD[i]=LIFT_V; if (i===crest) break; i=(i+1)%N; }
  for (let k=1;k<N;k++){
    const j = (crest+k)%N;
    if (ONL[j]) break;
    const prev = (j-1+N)%N;
    let vn = Math.sqrt(Math.max(MIN_V*MIN_V, SPD[prev]*SPD[prev] + 2*G*(YA[prev]-YA[j])));
    vn *= 0.999;
    const dHome = P[j].distanceTo(P[0]);
    if (dHome < 42) vn = Math.min(vn, 3.0 + dHome*0.17);
    SPD[j] = Math.min(vn, MAX_V);
  }
}
function boxBlur(arr, w){
  const n = arr.length, h = (w-1)/2, out = new Float64Array(n);
  for (let i=0;i<n;i++){ let s=0; for (let k=-h;k<=h;k++) s += arr[(i+k+n)%n]; out[i]=s/w; }
  return out;
}
let V = boxBlur(SPD, 9);
for (let i=0;i<N;i++) V[i] = Math.max(2.4, V[i]);

const TIME = new Float64Array(N);
{
  let t = 0;
  for (let k=1;k<N;k++){
    t += P[k].distanceTo(P[k-1]) / ((V[k]+V[k-1])*0.5);
    TIME[k] = t;
  }
  TIME[N-1] = t;
  var DUR = t + P[0].distanceTo(P[N-1]) / ((V[0]+V[N-1])*0.5);
}

/* ---------------- banking ---------------- */
const UP = new Array(N), RG = new Array(N);
{
  const bank = new Float64Array(N);
  const lat = new Array(N);
  for (let i=0;i<N;i++){
    const ds2 = P[(i+1)%N].distanceTo(P[(i-1+N)%N]);
    const kappa = TAN[(i+1)%N].clone().sub(TAN[(i-1+N)%N]).divideScalar(ds2);
    const l = kappa.sub(TAN[i].clone().multiplyScalar(kappa.dot(TAN[i])));
    const m = l.length();
    lat[i] = m > 1e-6 ? l.divideScalar(m) : new THREE.Vector3();
    const fade = 1 - sstep(0.30, 0.62, Math.abs(TAN[i].y));
    bank[i] = Math.min(Math.atan(m*V[i]*V[i]/G) * fade, 1.15);
  }
  const bankS = boxBlur(bank, 41);
  const lx = boxBlur(new Float64Array(lat.map(v=>v.x)), 41);
  const ly = boxBlur(new Float64Array(lat.map(v=>v.y)), 41);
  const lz = boxBlur(new Float64Array(lat.map(v=>v.z)), 41);
  for (let i=0;i<N;i++){
    const d = new THREE.Vector3(lx[i], ly[i], lz[i]);
    if (d.lengthSq() > 1e-8) d.normalize();
    UP[i] = NUP[i].clone().multiplyScalar(Math.cos(bankS[i])).addScaledVector(d, Math.sin(bankS[i])).normalize();
    RG[i] = new THREE.Vector3().crossVectors(TAN[i], UP[i]).normalize();
  }
}

/* ---------------- sampling ---------------- */
function sampleIdx(u){
  const f = u*N;
  const i0 = Math.floor(f)%N;
  return { i0, i1:(i0+1)%N, a:f-Math.floor(f) };
}
const _r = new THREE.Vector3(), _u = new THREE.Vector3();
class RailCurve extends THREE.Curve{
  constructor(side){ super(); this.side = side; }
  getPoint(u, target = new THREE.Vector3()){
    const { i0, i1, a } = sampleIdx(u);
    target.lerpVectors(P[i0], P[i1], a);
    _r.lerpVectors(RG[i0], RG[i1], a);
    _u.lerpVectors(UP[i0], UP[i1], a);
    target.addScaledVector(_r, this.side*0.55).addScaledVector(_u, 0.12);
    return target;
  }
}

/* ---------------- ground ---------------- */
const CENTER = { x:67, z:66 };
function groundH(x, z){
  const r = Math.hypot(x-CENTER.x, z-CENTER.z);
  let y = 2.0*Math.sin(x*0.018+1.3)*Math.cos(z*0.015-0.7)
        + 1.2*Math.sin(x*0.045+0.5)*Math.sin(z*0.052+1.9)
        + 0.6*Math.sin(x*0.11)*Math.cos(z*0.09+0.8);
  const m = sstep(230, 520, r);
  y += m * (11 + 8*Math.sin(x*0.011+2.2)*Math.cos(z*0.009-1.1) + 5*Math.sin(x*0.023+z*0.017+0.6));
  return y;
}
function distToTrack2D(x, z){
  let d = 1e9;
  for (let i=0;i<CP.length;i++){
    const dd = Math.hypot(x-CP[i].x, z-CP[i].z);
    if (dd < d) d = dd;
  }
  return d;
}

/* ---------------- materials ---------------- */
const railMat  = new THREE.MeshStandardMaterial({ color:0x7c8698, metalness:0.55, roughness:0.42 });
const tieMat   = new THREE.MeshStandardMaterial({ color:0x2b2438, roughness:0.95 });
const darkMat  = new THREE.MeshStandardMaterial({ color:0x1b1830, roughness:0.9 });
const supMat   = new THREE.MeshStandardMaterial({ color:0x1c1930, roughness:0.9 });
const amberNeon= new THREE.MeshBasicMaterial({ color:new THREE.Color(1.0,0.72,0.38).multiplyScalar(1.7) });
const cyanNeon = new THREE.MeshBasicMaterial({ color:new THREE.Color(0.35,0.95,1.0).multiplyScalar(1.8) });

/* ---------------- track geometry ---------------- */
scene.add(new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(-1), 1000, 0.085, 6, true), railMat));
scene.add(new THREE.Mesh(new THREE.TubeGeometry(new RailCurve( 1), 1000, 0.085, 6, true), railMat));

{
  const tieGeo = new THREE.BoxGeometry(1.5, 0.09, 0.3);
  const count = Math.floor(L/1.35);
  const ties = new THREE.InstancedMesh(tieGeo, tieMat, count);
  const m4 = new THREE.Matrix4();
  const rr = new THREE.Vector3(), uu = new THREE.Vector3(), tt = new THREE.Vector3(), pp = new THREE.Vector3();
  for (let k=0;k<count;k++){
    const { i0, i1, a } = sampleIdx((k*1.35)/L);
    pp.lerpVectors(P[i0], P[i1], a);
    rr.lerpVectors(RG[i0], RG[i1], a).normalize();
    uu.lerpVectors(UP[i0], UP[i1], a).normalize();
    tt.lerpVectors(TAN[i0], TAN[i1], a).normalize();
    m4.makeBasis(rr, uu, tt);
    m4.setPosition(pp.x + uu.x*0.02, pp.y + uu.y*0.02, pp.z + uu.z*0.02);
    ties.setMatrixAt(k, m4);
  }
  scene.add(ties);
}

/* supports */
{
  const step = Math.max(1, Math.round(7.5/(L/N)));
  const max = Math.ceil(N/step)+1;
  const geo = new THREE.CylinderGeometry(0.14, 0.2, 1, 6);
  const sup = new THREE.InstancedMesh(geo, supMat, max);
  const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), sc = new THREE.Vector3(), pp = new THREE.Vector3();
  let c = 0;
  for (let i=0;i<N;i+=step){
    const gh = groundH(P[i].x, P[i].z) - 0.5;
    const top = P[i].y - 0.03;
    const h = top - gh;
    if (h < 1.0) continue;
    pp.set(P[i].x, gh + h/2, P[i].z);
    sc.set(1, h, 1);
    m4.compose(pp, q0, sc);
    sup.setMatrixAt(c++, m4);
  }
  sup.count = c;
  scene.add(sup);
}

/* pathway light posts */
{
  const step = Math.max(1, Math.round(9.5/(L/N)));
  const max = Math.ceil(N/step)+1;
  const poleGeo = new THREE.CylinderGeometry(0.07, 0.1, 1, 5);
  const headGeo = new THREE.SphereGeometry(0.17, 8, 6);
  const poles = new THREE.InstancedMesh(poleGeo, supMat, max);
  const heads = new THREE.InstancedMesh(headGeo, amberNeon, max);
  const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), sc = new THREE.Vector3(), pp = new THREE.Vector3();
  let c = 0, side = 1;
  for (let i=0;i<N;i+=step){
    const gh = groundH(P[i].x, P[i].z);
    if (P[i].y - gh > 12) continue;
    side = -side;
    const px = P[i].x + RG[i].x*side*2.4, pz = P[i].z + RG[i].z*side*2.4;
    const gb = groundH(px, pz) - 0.3;
    const top = Math.max(P[i].y + 2.3, gb + 3.0);
    pp.set(px, gb + (top-gb)/2, pz); sc.set(1, top-gb, 1);
    m4.compose(pp, q0, sc);
    poles.setMatrixAt(c, m4);
    pp.set(px, top + 0.12, pz); sc.set(1,1,1);
    m4.compose(pp, q0, sc);
    heads.setMatrixAt(c, m4);
    c++;
  }
  poles.count = c; heads.count = c;
  scene.add(poles); scene.add(heads);
}

/* ---------------- terrain ---------------- */
{
  const geo = new THREE.PlaneGeometry(1400, 1400, 150, 150);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    let y = groundH(x, z);
    const d = distToTrack2D(x, z);
    const w = 1 - sstep(12, 30, d);
    y = y*(1-w) + 0.9*w;
    pos.setY(i, y);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color:0x1a1f38, roughness:1 });
  scene.add(new THREE.Mesh(geo, mat));
}

/* pines */
{
  const trunkGeo = new THREE.CylinderGeometry(0.16, 0.26, 1.6, 5);
  const coneGeo  = new THREE.ConeGeometry(1.7, 5.4, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x2a1d26, roughness:1 });
  const leafMat  = new THREE.MeshStandardMaterial({ color:0x0f2b2a, roughness:1 });
  const spots = [];
  let tries = 0;
  while (spots.length < 240 && tries++ < 1400){
    const a = Math.random()*Math.PI*2;
    const r = 30 + Math.random()*440;
    const x = CENTER.x + Math.cos(a)*r, z = CENTER.z + Math.sin(a)*r;
    if (distToTrack2D(x, z) < 15) continue;
    spots.push({ x, z, s:0.8 + Math.random()*0.9, rot:Math.random()*Math.PI*2 });
  }
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, spots.length);
  const cones  = new THREE.InstancedMesh(coneGeo, leafMat, spots.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pp = new THREE.Vector3();
  const up01 = new THREE.Vector3(0,1,0);
  const col = new THREE.Color();
  spots.forEach((t, i)=>{
    const gh = groundH(t.x, t.z) - 0.2;
    q.setFromAxisAngle(up01, t.rot);
    sc.set(t.s, t.s, t.s);
    pp.set(t.x, gh + 0.8*t.s, t.z); m4.compose(pp, q, sc); trunks.setMatrixAt(i, m4);
    pp.set(t.x, gh + 4.3*t.s, t.z); m4.compose(pp, q, sc); cones.setMatrixAt(i, m4);
    col.setHSL(0.42 + Math.random()*0.06, 0.4, 0.10 + Math.random()*0.06);
    cones.setColorAt(i, col);
  });
  scene.add(trunks); scene.add(cones);
}

/* ---------------- sky, moon, stars, clouds ---------------- */
{
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    vertexShader: `
      varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 zen = vec3(0.024, 0.032, 0.105);
        vec3 mid = vec3(0.135, 0.085, 0.30);
        vec3 hor = vec3(0.42, 0.17, 0.30);
        vec3 col = mix(hor, mid, smoothstep(0.02, 0.28, h));
        col = mix(col, zen, smoothstep(0.22, 0.7, h));
        vec3 sunDir = normalize(vec3(-0.55, 0.02, -0.72));
        float s = max(dot(d, sunDir), 0.0);
        col += vec3(1.0, 0.42, 0.16) * pow(s, 5.0) * 0.5 * (1.0 - smoothstep(0.0, 0.4, h));
        col += vec3(1.0, 0.62, 0.30) * pow(s, 24.0) * 0.55;
        col = mix(col, vec3(0.016, 0.014, 0.05), smoothstep(0.0, -0.12, h));
        float dith = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        col += (dith - 0.5) * 0.012;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(880, 32, 20), skyMat));
}

/* ---------------- finale ring tunnel ---------------- */
function idxOfCP(ci){
  let best = 0, bd = 1e18;
  for (let i=0;i<N;i++){
    const d = P[i].distanceToSquared(CP[ci]);
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}
const rings = [];
{
  const a = idxOfCP(33), b = idxOfCP(37);
  const torusGeo = new THREE.TorusGeometry(4.8, 0.13, 8, 40);
  const cA = new THREE.Color(0.32, 0.9, 1.0), cB = new THREE.Color(1.0, 0.42, 0.85);
  const m4 = new THREE.Matrix4();
  for (let k=0;k<14;k++){
    const idx = Math.round(a + (b-a)*(k/13));
    const base = (k%2===0) ? cA.clone() : cB.clone();
    const mesh = new THREE.Mesh(torusGeo, new THREE.MeshBasicMaterial({ color:base.clone() }));
    m4.makeBasis(RG[idx], UP[idx], TAN[idx]);
    mesh.quaternion.setFromRotationMatrix(m4);
    mesh.position.copy(P[idx]).addScaledVector(UP[idx], 1.35);
    rings.push({ mesh, base, idx });
    scene.add(mesh);
  }
}

/* ---------------- fireworks ---------------- */
const bursts = [];
function spawnBurst(pos, color, n = 260, speed = 12, size = 0.55, life = 2.3){
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(n*3), vel = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    p[i*3] = pos.x; p[i*3+1] = pos.y; p[i*3+2] = pos.z;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    const r = speed*(0.35 + 0.65*Math.random());
    vel[i*3]   = Math.sin(ph)*Math.cos(th)*r;
    vel[i*3+1] = Math.cos(ph)*r*1.15;
    vel[i*3+2] = Math.sin(ph)*Math.sin(th)*r;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color, size, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  bursts.push({ pts, vel, t:0, life, n });
}
function updateBursts(dt){
  for (let i=bursts.length-1;i>=0;i--){
    const b = bursts[i];
    b.t += dt;
    const pa = b.pts.geometry.attributes.position;
    for (let j=0;j<b.n;j++){
      b.vel[j*3+1] -= 3.4*dt;
      pa.array[j*3]   += b.vel[j*3]*dt;
      pa.array[j*3+1] += b.vel[j*3+1]*dt;
      pa.array[j*3+2] += b.vel[j*3+2]*dt;
    }
    pa.needsUpdate = true;
    const k = Math.max(0, 1 - b.t/b.life);
    b.pts.material.opacity = k*k;
    if (b.t >= b.life){
      scene.remove(b.pts);
      b.pts.geometry.dispose();
      b.pts.material.dispose();
      bursts.splice(i, 1);
    }
  }
}

/* ---------------- triggers ---------------- */

  { t:tFin+0.10, fn:()=>{ surge = 1; spawnBurst(new THREE.Vector3(-28, 30, -16), 0x7df3ff, 240, 11, 0.5, 2.2); } },

let elapsed = 0, lastRt = 0;

  if (e.key === 'h' || e.key === 'H'){ document.body.classList.toggle('nohud'); }
});
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

});

/* ---------------- per-frame state ---------------- */
function makeState(){ return { pos:new THREE.Vector3(), tan:new THREE.Vector3(), up:new THREE.Vector3(), right:new THREE.Vector3(), v:0, idx:0 }; }
function frameAt(rt, out){
  let lo = 0, hi = N-1;
  while (lo < hi){
    const mid = (lo+hi+1)>>1;
    if (TIME[mid] <= rt) lo = mid; else hi = mid-1;
  }
  const i0 = lo, i1 = (lo+1)%N;
  const t0 = TIME[i0], t1 = (i1 === 0) ? DUR : TIME[i1];
  const a = t1 > t0 ? (rt-t0)/(t1-t0) : 0;
  out.pos.lerpVectors(P[i0], P[i1], a);
  out.tan.lerpVectors(TAN[i0], TAN[i1], a).normalize();
  out.up.lerpVectors(UP[i0], UP[i1], a).normalize();
  out.right.lerpVectors(RG[i0], RG[i1], a).normalize();
  out.v = V[i0]*(1-a) + V[i1]*a;
  out.idx = i0;
  return out;
}
const S1 = makeState(), S2 = makeState();
const headPos = new THREE.Vector3(), fwd = new THREE.Vector3();
const zx = new THREE.Vector3(), xx = new THREE.Vector3(), yx = new THREE.Vector3();
const m4b = new THREE.Matrix4(), qTmp = new THREE.Quaternion(), eul = new THREE.Euler();
let fov = 60;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const rt = elapsed % DUR;
  if (rt < lastRt) fired.clear();
  lastRt = rt;

  const st = frameAt(rt, S1);
  const la = THREE.MathUtils.clamp(st.v*0.05, 0.35, 1.0);
  const stL = frameAt((rt+la) % DUR, S2);

  /* camera placement */
  const bobA = Math.min(1, st.v/25) * (RM ? 0.3 : 1);
  headPos.copy(st.pos).addScaledVector(st.up, 1.35);
  headPos.addScaledVector(st.up, Math.sin(elapsed*7.3)*0.02*bobA);
  headPos.addScaledVector(st.right, Math.sin(elapsed*5.1+1.2)*0.02*bobA);
  fwd.copy(stL.pos).addScaledVector(stL.up, 1.35).sub(headPos).normalize();
  zx.copy(fwd).negate();
  xx.crossVectors(st.up, zx).normalize();
  yx.crossVectors(zx, xx);
  m4b.makeBasis(xx, yx, zx);
  camera.quaternion.setFromRotationMatrix(m4b);

  if (!dragging){
    const k = Math.min(1, dt*2.2);
    yaw += (0-yaw)*k; pitch += (0-pitch)*k;
  }
  const onLift = ONL[st.idx] === 1;
  const shakeAmp = (0.0006*st.v + (onLift ? 0.0032 : 0)) * (RM ? 0.35 : 1);
  const clatter = onLift ? Math.sin(elapsed*48)*0.004 : 0;
  eul.set(
    n1(elapsed*6.5)*shakeAmp + pitch,
    n1(elapsed*5.2+5.0)*shakeAmp + yaw,
    n1(elapsed*7.7+9.0)*shakeAmp*0.8 + clatter
  );
  qTmp.setFromEuler(eul);
  camera.quaternion.multiply(qTmp);
  camera.position.copy(headPos);

  /* fov */
  const speedN = THREE.MathUtils.clamp((st.v-4)/30, 0, 1);
  const fovT = 57 + 15*speedN + kick + surge*5;
  fov += (fovT-fov)*Math.min(1, dt*3.2);
  if (Math.abs(fov-camera.fov) > 0.01){ camera.fov = fov; camera.updateProjectionMatrix(); }
  kick *= Math.exp(-dt*1.7);
  surge *= Math.exp(-dt*1.4);
  bloom.strength = 0.9 + surge*0.9;

  /* triggers */
  for (const tr of TRIGGERS){
    if (!fired.has(tr) && rt >= tr.t){ fired.add(tr); tr.fn(); }
  }

  /* rings pulse with proximity */
  for (const r of rings){
    const d = Math.abs(st.idx - r.idx);
    const dd = Math.min(d, N-d);
    const prox = Math.exp(-(dd*dd)/(2*60*60));
    const pulse = 0.75 + 0.45*Math.sin(elapsed*3.5 + r.idx*0.11);
    r.mesh.material.color.copy(r.base).multiplyScalar(pulse*(0.8 + 2.2*prox));
  }

  /* signal */
  sigMat.color.setHex(rt < 1.2 ? 0xff4444 : 0x44ff88).multiplyScalar(1.6);

  /* wind */
  wMat.opacity = THREE.MathUtils.clamp((st.v-13)/26, 0, 1)*0.55;
  if (wMat.opacity > 0.01){
    for (let i=0;i<WN;i++){
      wp[i*3+2] += st.v*dt*2.4;
      if (wp[i*3+2] > 2){
        wp[i*3+2] -= 74;
        wp[i*3] = (Math.random()-0.5)*34;
        wp[i*3+1] = (Math.random()-0.5)*20;
      }
    }
    wGeo.attributes.position.needsUpdate = true;
  }

  /* fireflies */
  for (let i=0;i<FN;i++){
    fp[i*3]   = fBase[i*3] + Math.sin(elapsed*0.23 + fPhase[i]*1.7)*1.2;
    fp[i*3+1] = fBase[i*3+1] + Math.sin(elapsed*0.6 + fPhase[i])*0.8;
    fp[i*3+2] = fBase[i*3+2] + Math.cos(elapsed*0.19 + fPhase[i])*1.2;
  }
  fGeo.attributes.position.needsUpdate = true;

  /* clouds */
  for (const s of clouds){
    s.position.x += dt*1.2;
    if (s.position.x > 750) s.position.x = -750;
  }

  updateBursts(dt);

  /* HUD */
  progFill.style.transform = `scaleX(${rt/DUR})`;
  let name = 'Brake Run';
  for (const [si, nm] of REGIONS){ if (st.idx >= si) name = nm; }
  setLabel(name);

  composer.render();
  if (!started){ started = true; loaderEl.classList.add('done'); }
}
animate();
