<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Miniature Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #04060c;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8ecf4;
  }
  #app, #app canvas { position: fixed; inset: 0; display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,0.55) 100%);
  }
  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .planet-label {
    position: absolute; left: 0; top: 0;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(232,236,244,0.72); text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    white-space: nowrap; will-change: transform;
  }
  header { position: fixed; top: 24px; left: 28px; z-index: 3; pointer-events: none; }
  header h1 {
    font-size: 15px; font-weight: 650; letter-spacing: 0.34em;
    text-transform: uppercase; color: #f3e9d2;
  }
  header p { margin-top: 7px; font-size: 12px; letter-spacing: 0.04em; color: rgba(232,236,244,0.5); }
  #panel {
    position: fixed; left: 28px; bottom: 26px; z-index: 3;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 12px 18px;
    background: rgba(10,14,24,0.55); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  button {
    font: inherit; font-size: 12px; letter-spacing: 0.08em;
    color: #e8ecf4; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 9px;
    padding: 7px 13px; cursor: pointer; transition: background 0.2s ease;
  }
  button:hover { background: rgba(255,255,255,0.15); }
  #panel label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(232,236,244,0.8); }
  input[type="range"] { width: 110px; accent-color: #ffd27a; }
  input[type="checkbox"] { accent-color: #ffd27a; }
  #speedVal { min-width: 40px; color: #ffd27a; font-variant-numeric: tabular-nums; }
  #info {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    width: 264px; z-index: 3; padding: 22px 22px 16px;
    background: rgba(10,14,24,0.62); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #info.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(14px); }
  #info h2 { font-size: 21px; letter-spacing: 0.04em; color: #ffffff; }

  #info .fact { margin: 14px 0 12px; font-size: 13px; line-height: 1.55; color: rgba(232,236,244,0.8); }
  .stat { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; }
  .stat span { color: rgba(232,236,244,0.5); letter-spacing: 0.06em; }
  .stat strong { color: #f3e9d2; font-weight: 600; }
  #infoClose {
    position: absolute; top: 8px; right: 10px; padding: 4px 9px;
    background: none; border: none; font-size: 16px; color: rgba(232,236,244,0.5);
  }

<script type="importmap">
{

<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="labels"></div>

<div id="credit">Three.js &middot; Fully procedural</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);

const HOME_POS = new THREE.Vector3(0, 42, 88);
const ORIGIN = new THREE.Vector3(0, 0, 0);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);
camera.position.copy(HOME_POS);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.2;
controls.maxDistance = 600;

// ---------- procedural texture helpers ----------
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const glowTex = makeCanvas(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.12)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

const starTex = makeCanvas(64, 64, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.4)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

function rocky(base, spots, count, caps = false) {
  return makeCanvas(512, 256, (ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < count; i++) {
      const r = 2 + Math.random() * 14;
      ctx.fillStyle = spots[(Math.random() * spots.length) | 0];
      ctx.globalAlpha = 0.08 + Math.random() * 0.25;
      ctx.beginPath();
      ctx.ellipse(Math.random() * w, Math.random() * h, r, r * (0.5 + Math.random() * 0.8), Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (caps) {
      ctx.fillStyle = 'rgba(240,246,255,0.9)';
      ctx.fillRect(0, 0, w, 7); ctx.fillRect(0, h - 7, w, 7);
    }
  });
}

function gas(stops, spot = false) {
  return makeCanvas(512, 256, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    for (const [o, c] of stops) g.addColorStop(o, c);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 42; i++) {
      const y = Math.random() * h;
      ctx.strokeStyle = Math.random() < 0.5
        ? `rgba(255,255,255,${0.03 + Math.random() * 0.06})`
        : `rgba(60,40,20,${0.03 + Math.random() * 0.05})`;
      ctx.lineWidth = 1 + Math.random() * 3;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 8) ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * 4);
      ctx.stroke();
    }
    if (spot) {
      ctx.fillStyle = 'rgba(178,74,52,0.85)';
      ctx.beginPath(); ctx.ellipse(w * 0.68, h * 0.62, 26, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(216,120,84,0.7)';
      ctx.beginPath(); ctx.ellipse(w * 0.68, h * 0.62, 16, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function earth() {
  return makeCanvas(512, 256, (ctx, w, h) => {
    ctx.fillStyle = '#1b4f8a'; ctx.fillRect(0, 0, w, h);
    const land = ['#3f7a3a', '#5d8a44', '#8a7a4a'];
    for (let i = 0; i < 14; i++) {
      const cx = Math.random() * w, cy = h * 0.15 + Math.random() * h * 0.7;
      ctx.fillStyle = land[i % 3]; ctx.globalAlpha = 0.9;
      for (let j = 0; j < 8; j++) {
        const r = 6 + Math.random() * 22;
        ctx.beginPath();
        ctx.ellipse(cx + (Math.random() - 0.5) * 50, cy + (Math.random() - 0.5) * 30, r, r * 0.6, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(240,246,255,0.95)';
    ctx.fillRect(0, 0, w, 12); ctx.fillRect(0, h - 12, w, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    for (let i = 0; i < 60; i++) {
      const r = 3 + Math.random() * 10;
      ctx.beginPath();
      ctx.ellipse(Math.random() * w, Math.random() * h, r * 2.2, r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function sunSurface() {
  return makeCanvas(512, 256, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#ffdf8a'); g.addColorStop(0.5, '#ffc95e'); g.addColorStop(1, '#ffb347');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      const r = 0.5 + Math.random() * 2.2;
      ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,240,200,0.25)' : 'rgba(220,120,40,0.18)';
      ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, r, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function saturnRingTexture() {
  return makeCanvas(512, 8, (ctx, w, h) => {
    for (let x = 0; x < w; x++) {
      const t = x / w;
      let a = Math.sin(t * Math.PI) * (0.55 + 0.45 * Math.sin(t * 34 + Math.sin(t * 9) * 2));
      if (Math.abs(t - 0.63) < 0.035) a *= 0.12; // Cassini division
      ctx.fillStyle = `rgba(216,198,164,${Math.max(0, a) * 0.9})`;
      ctx.fillRect(x, 0, 1, h);
    }
  });
}

function uranusRingTexture() {
  return makeCanvas(256, 8, (ctx, w, h) => {
    for (let x = 0; x < w; x++) {
      const t = x / w;
      const a = Math.pow(Math.sin(t * Math.PI), 3) * 0.35;
      ctx.fillStyle = `rgba(190,220,225,${a})`;
      ctx.fillRect(x, 0, 1, h);
    }
  });
}

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x8fa3c7, 0.16));
const sunLight = new THREE.PointLight(0xfff2dd, 2.2, 0, 0);
scene.add(sunLight);

// ---------- solar system root ----------
const solarSystem = new THREE.Group();
scene.add(solarSystem);

const labelsEl = document.getElementById('labels');
function makeLabel(text) {
  const el = document.createElement('div');
  el.className = 'planet-label';
  el.textContent = text;
  labelsEl.appendChild(el);
  return el;
}

const bodies = [];
const clickables = [];

// ---------- sun ----------
const SUN_R = 5;
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(SUN_R, 64, 64),
  new THREE.MeshBasicMaterial({ map: sunSurface() })
);
solarSystem.add(sunMesh);

const glow1 = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xffd9a0, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glow1.scale.setScalar(SUN_R * 4.5);
sunMesh.add(glow1);

const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xff8c3b, transparent: true, opacity: 0.32,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glow2.scale.setScalar(SUN_R * 11);
sunMesh.add(glow2);

const sunBody = {
  name: 'Sun', type: 'G-type main-sequence star',
  fact: 'The Sun holds 99.86% of everything in the solar system.',
  stats: [['Diameter', '1.39 M km'], ['Surface', '5,505 °C'], ['Age', '4.6 B years']],
  obj3d: sunMesh, focusRadius: SUN_R, labelEl: makeLabel('Sun')
};
sunMesh.userData.body = sunBody;
clickables.push(sunMesh);
bodies.push(sunBody);

// ---------- planets ----------
function makeOrbitLine(radius) {
  const pts = [];
  for (let i = 0; i <= 160; i++) {
    const a = (i / 160) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x54627f, transparent: true, opacity: 0.38 })
  );
}

function makeRing(inner, outer, tex) {
  const geo = new THREE.RingGeometry(inner, outer, 160, 1);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const r = Math.hypot(pos.getX(i), pos.getY(i));
    uv.setXY(i, (r - inner) / (outer - inner), 0.5);
  }
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide, transparent: true, depthWrite: false
  }));
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

const PLANETS = [
  {
    name: 'Mercury', type: 'Rocky planet', radius: 0.55, distance: 11, tilt: 0.03, spin: 0.10,
    map: rocky('#8d8178', ['#6e645c', '#a89c90', '#7c7268'], 700),
    moons: [], stats: [['Orbit', '0.39 AU'], ['Year', '88 days'], ['Moons', '0']],
    fact: 'A year on Mercury lasts just 88 Earth days.'
  },
  {
    name: 'Venus', type: 'Rocky planet', radius: 0.95, distance: 14.5, tilt: 0.05, spin: -0.04,
    map: gas([[0, '#e0b878'], [0.35, '#ecc98f'], [0.6, '#dfae6d'], [1, '#e8c184']]),
    moons: [], stats: [['Orbit', '0.72 AU'], ['Year', '225 days'], ['Moons', '0']],
    fact: 'Venus spins backwards — its day is longer than its year.'
  },
  {
    name: 'Earth', type: 'Rocky planet', radius: 1.0, distance: 18.5, tilt: 0.41, spin: 0.35,
    map: earth(),
    moons: [{ r: 0.27, d: 2.1, speed: 1.1, color: '#c9c9c9' }],
    stats: [['Orbit', '1.00 AU'], ['Year', '365 days'], ['Moons', '1']],
    fact: 'The only known world with life — and one perfect moon.'
  },
  {
    name: 'Mars', type: 'Rocky planet', radius: 0.72, distance: 23, tilt: 0.44, spin: 0.33,
    map: rocky('#b25a38', ['#8f4429', '#c9714a', '#a04e30'], 800, true),
    moons: [
      { r: 0.09, d: 1.25, speed: 1.9, color: '#b0a294' },
      { r: 0.07, d: 1.65, speed: 1.35, color: '#9d9186' }
    ],
    stats: [['Orbit', '1.52 AU'], ['Year', '687 days'], ['Moons', '2']],
    fact: 'Home to Olympus Mons, the tallest volcano in the solar system.'
  },
  {
    name: 'Jupiter', type: 'Gas giant', radius: 2.8, distance: 32, tilt: 0.05, spin: 0.8,
    map: gas([[0, '#c8a97e'], [0.18, '#b3906a'], [0.34, '#d8c19a'], [0.5, '#a87f5c'], [0.64, '#d0b48c'], [0.8, '#b69372'], [1, '#c8a97e']], true),
    moons: [
      { r: 0.22, d: 4.0, speed: 1.5, color: '#d8c98f' },
      { r: 0.19, d: 4.6, speed: 1.2, color: '#cfd6dd' },
      { r: 0.30, d: 5.4, speed: 0.95, color: '#b9a894' },
      { r: 0.26, d: 6.3, speed: 0.75, color: '#8f8a80' }
    ],
    stats: [['Orbit', '5.20 AU'], ['Year', '12 years'], ['Moons', '95']],
    fact: 'The Great Red Spot is a storm wider than Earth.'
  },
  {
    name: 'Saturn', type: 'Gas giant', radius: 2.35, distance: 41.5, tilt: 0.47, spin: 0.75,
    map: gas([[0, '#d9c49a'], [0.3, '#cbb287'], [0.55, '#e3d3ab'], [0.8, '#c4ab80'], [1, '#d9c49a']]),
    ring: { inner: 2.95, outer: 5.4, tex: saturnRingTexture() },
    moons: [{ r: 0.30, d: 6.6, speed: 0.9, color: '#d8c9a3' }],
    stats: [['Orbit', '9.58 AU'], ['Year', '29 years'], ['Moons', '146']],
    fact: 'Its rings are countless shards of ice and rock.'
  },
  {
    name: 'Uranus', type: 'Ice giant', radius: 1.6, distance: 50, tilt: 1.71, spin: 0.5,
    map: gas([[0, '#bfe3e6'], [0.5, '#a5d6dc'], [1, '#bfe3e6']]),
    ring: { inner: 2.05, outer: 2.8, tex: uranusRingTexture() },
    moons: [],
    stats: [['Orbit', '19.2 AU'], ['Year', '84 years'], ['Moons', '28']],
    fact: 'Uranus rolls around the Sun on its side.'
  },
  {
    name: 'Neptune', type: 'Ice giant', radius: 1.55, distance: 58, tilt: 0.49, spin: 0.55,
    map: gas([[0, '#3b62c4'], [0.4, '#4a74d8'], [0.7, '#3558b8'], [1, '#3b62c4']]),
    moons: [{ r: 0.20, d: 2.9, speed: -1.0, color: '#cfd8e8' }],
    stats: [['Orbit', '30.1 AU'], ['Year', '165 years'], ['Moons', '16']],
    fact: 'Winds here top 2,000 km/h — the fastest in the solar system.'
  }
];

for (const p of PLANETS) {
  const pivot = new THREE.Object3D();
  pivot.rotation.y = Math.random() * Math.PI * 2;
  solarSystem.add(pivot);

  const group = new THREE.Object3D();
  group.position.x = p.distance;
  pivot.add(group);

  const tiltGroup = new THREE.Object3D();
  tiltGroup.rotation.z = p.tilt;
  group.add(tiltGroup);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.radius, 48, 48),
    new THREE.MeshStandardMaterial({ map: p.map, roughness: 0.85, metalness: 0.08 })
  );
  tiltGroup.add(mesh);

  if (p.ring) tiltGroup.add(makeRing(p.ring.inner, p.ring.outer, p.ring.tex));

  const moonPivots = [];
  for (const m of p.moons) {
    const mp = new THREE.Object3D();
    mp.rotation.y = Math.random() * Math.PI * 2;
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(m.r, 24, 24),
      new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.95 })
    );
    moonMesh.position.x = m.d;
    mp.add(moonMesh);
    tiltGroup.add(mp);
    moonPivots.push({ pivot: mp, speed: m.speed });
  }

  solarSystem.add(makeOrbitLine(p.distance));

  const body = {
    name: p.name, type: p.type, fact: p.fact, stats: p.stats,
    obj3d: group, focusRadius: p.radius, labelEl: makeLabel(p.name)
  };
  mesh.userData.body = body;
  clickables.push(mesh);
  bodies.push(body);

  p._pivot = pivot;
  p._mesh = mesh;
  p._moonPivots = moonPivots;
  p.orbitSpeed = Math.PI * 2 / (16 * Math.pow(p.distance / 18.5, 1.5)); // Kepler-flavored pacing
}

// ---------- asteroid belt ----------
function makeBelt(count, rMin, rMax) {
  const geo = new THREE.DodecahedronGeometry(0.12, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x9a8f80, roughness: 1 });
  const belt = new THREE.InstancedMesh(geo, mat, count);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = rMin + Math.random() * (rMax - rMin);
    dummy.position.set(Math.cos(a) * r, (Math.random() - 0.5) * 1.2, Math.sin(a) * r);
    dummy.scale.setScalar(0.4 + Math.random() * 1.3);
    dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    dummy.updateMatrix();
    belt.setMatrixAt(i, dummy.matrix);
  }
  solarSystem.add(belt);
  return belt;
}
const belt = makeBelt(900, 26.5, 30);
const belt2 = makeBelt(400, 27, 31);

// ---------- starfield + nebula backdrop ----------
function makeStars(count, size) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const r = 420 + Math.random() * 480;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    c.setHSL(Math.random() < 0.15 ? 0.08 : 0.55 + Math.random() * 0.12, Math.random() * 0.5, 0.7 + Math.random() * 0.3);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size, sizeAttenuation: false, map: starTex, vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  scene.add(new THREE.Points(geo, mat));
}
makeStars(2200, 2.2);
makeStars(300, 3.4);

const nebulaColors = [0x3b4a8a, 0x6a3b7a, 0x2a6a6a];
for (let i = 0; i < 3; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: nebulaColors[i], transparent: true, opacity: 0.09,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  const a = (i / 3) * Math.PI * 2 + 0.7;
  s.position.set(Math.cos(a) * 430, (Math.random() - 0.5) * 220, Math.sin(a) * 430);
  s.scale.setScalar(320 + Math.random() * 180);
  scene.add(s);
}

// ---------- comet ----------
const COMET_A = 52, COMET_E = 0.72;
const COMET_B = COMET_A * Math.sqrt(1 - COMET_E * COMET_E);
const cometGroup = new THREE.Group();
cometGroup.rotation.x = 0.28;
cometGroup.rotation.y = 0.9;
solarSystem.add(cometGroup);

const cometOrbitPts = [];
for (let i = 0; i <= 160; i++) {
  const a = (i / 160) * Math.PI * 2;
  cometOrbitPts.push(new THREE.Vector3(COMET_A * (Math.cos(a) - COMET_E), 0, COMET_B * Math.sin(a)));
}
cometGroup.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(cometOrbitPts),
  new THREE.LineBasicMaterial({ color: 0x3a4a6a, transparent: true, opacity: 0.25 })
));

const cometHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xdfefff })
);
const cometGlowMat = new THREE.SpriteMaterial({
  map: glowTex, color: 0x9fd0ff, transparent: true, opacity: 0.8,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const cometGlow = new THREE.Sprite(cometGlowMat);
cometGlow.scale.setScalar(2.2);
cometHead.add(cometGlow);
cometGroup.add(cometHead);

const TAIL_LEN = 9;
const tailGeo = new THREE.ConeGeometry(0.5, TAIL_LEN, 24, 1, true);
tailGeo.translate(0, -TAIL_LEN / 2, 0); // apex at origin, body along -Y
const tailTex = makeCanvas(16, 128, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(180,215,255,0.55)');
  g.addColorStop(1, 'rgba(180,215,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});
const cometTail = new THREE.Mesh(tailGeo, new THREE.MeshBasicMaterial({
  map: tailTex, transparent: true, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
cometGroup.add(cometTail);

const NEG_Y = new THREE.Vector3(0, -1, 0);
const cometSpeed = Math.PI * 2 / 50;
let cometT = 2.1;
const tmpDir = new THREE.Vector3();

function updateComet(s) {
  cometT += s * cometSpeed;
  cometHead.position.set(COMET_A * (Math.cos(cometT) - COMET_E), 0, COMET_B * Math.sin(cometT));
  cometTail.position.copy(cometHead.position);
  tmpDir.copy(cometHead.position).normalize();
  cometTail.quaternion.setFromUnitVectors(NEG_Y, tmpDir);
  const prox = THREE.MathUtils.clamp(1.7 - cometHead.position.length() / COMET_A, 0.2, 1.3);
  cometTail.scale.set(prox, prox, prox);
  cometGlowMat.opacity = 0.25 + 0.5 * prox;
}

// ---------- UI state ----------
let running = true;
let timeScale = 1;
let labelsOn = true;
let focused = null;
let goingHome = false;

const pauseBtn = document.getElementById('pause');
const speedInput = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const labelsToggle = document.getElementById('labelsToggle');
const resetBtn = document.getElementById('reset');
const infoEl = document.getElementById('info');
const infoName = document.getElementById('infoName');
const infoType = document.getElementById('infoType');
const infoFact = document.getElementById('infoFact');
const infoStats = document.getElementById('infoStats');
const infoClose = document.getElementById('infoClose');

function togglePause() {
  running = !running;
  pauseBtn.textContent = running ? 'Pause' : 'Resume';
}
pauseBtn.addEventListener('click', togglePause);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    togglePause();
  }
});

speedInput.addEventListener('input', () => {
  timeScale = Math.pow(10, parseFloat(speedInput.value) - 1);
  speedVal.innerHTML = '&times;' + (timeScale >= 10 ? timeScale.toFixed(0) : timeScale.toFixed(1));
});

labelsToggle.addEventListener('change', () => { labelsOn = labelsToggle.checked; });

function hideInfo() { infoEl.classList.add('hidden'); }

resetBtn.addEventListener('click', () => {
  focused = null;
  goingHome = true;
  hideInfo();
});

infoClose.addEventListener('click', () => {
  focused = null;
  hideInfo();
});

function selectBody(body) {
  focused = body;
  goingHome = false;
  infoName.textContent = body.name;
  infoType.textContent = body.type;
  infoFact.textContent = body.fact;
  infoStats.innerHTML = body.stats
    .map(([k, v]) => `<div class="stat"><span>${k}</span><strong>${v}</strong></div>`)
    .join('');
  infoEl.classList.remove('hidden');
}

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX = 0, downY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY;
  goingHome = false;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if (hits.length) selectBody(hits[0].object.userData.body);
  else { focused = null; hideInfo(); }
});

// ---------- labels ----------
const tmpV = new THREE.Vector3();
function updateLabels() {
  const w = innerWidth, h = innerHeight;
  for (const b of bodies) {
    if (!labelsOn) { b.labelEl.style.display = 'none'; continue; }
    b.obj3d.getWorldPosition(tmpV);
    tmpV.y += b.focusRadius * 1.7 + 0.4;
    tmpV.project(camera);
    if (tmpV.z > 1) { b.labelEl.style.display = 'none'; continue; }
    b.labelEl.style.display = 'block';
    b.labelEl.style.transform =
      `translate(-50%, -100%) translate(${(tmpV.x * 0.5 + 0.5) * w}px, ${(-tmpV.y * 0.5 + 0.5) * h}px)`;
  }
}

// ---------- resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- animate ----------
const clock = new THREE.Clock();
const tmpTarget = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (running) {
    const s = dt * timeScale;
    sunMesh.rotation.y += s * 0.04;
    for (const p of PLANETS) {
      p._pivot.rotation.y += s * p.orbitSpeed;
      p._mesh.rotation.y += s * p.spin;
      for (const m of p._moonPivots) m.pivot.rotation.y += s * m.speed;
    }
    belt.rotation.y += s * 0.022;
    belt2.rotation.y -= s * 0.015;
    updateComet(s);
  }

  if (focused) {
    focused.obj3d.getWorldPosition(tmpTarget);
    const delta = tmpTarget.clone().sub(controls.target);
    camera.position.add(delta);
    controls.target.copy(tmpTarget);
    const offset = camera.position.clone().sub(tmpTarget);
    const want = Math.max(focused.focusRadius * 8, 4);
    const k = 1 - Math.exp(-dt * 3.2);
    offset.setLength(THREE.MathUtils.lerp(offset.length(), want, k));
    camera.position.copy(tmpTarget).add(offset);
  } else if (goingHome) {
    const k = 1 - Math.exp(-dt * 3.2);
    camera.position.lerp(HOME_POS, k);
    controls.target.lerp(ORIGIN, k);
    if (camera.position.distanceTo(HOME_POS) < 0.4) goingHome = false;
  }

  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}
animate();
</script>
