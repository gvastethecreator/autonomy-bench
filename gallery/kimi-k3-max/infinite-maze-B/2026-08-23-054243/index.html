<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Maze — Autopilot</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1020;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%);}
  #fade{position:fixed;inset:0;background:#0d1020;pointer-events:none;
    transition:opacity 2.8s ease;opacity:1;}
  #title{position:fixed;left:18px;top:16px;color:rgba(220,230,255,.42);
    font:11px/1.5 "SFMono-Regular",Consolas,"Courier New",monospace;
    letter-spacing:.3em;text-transform:uppercase;pointer-events:none;user-select:none;}
  #hud{position:fixed;left:18px;bottom:16px;color:rgba(220,230,255,.6);
    font:12px/1.7 "SFMono-Regular",Consolas,"Courier New",monospace;
    letter-spacing:.08em;text-transform:uppercase;pointer-events:none;user-select:none;}
  #hud .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#7fe0a8;margin-right:8px;vertical-align:1px;
    animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title">Infinite Maze &middot; Autonomous Drift</div>
<div id="hud"><span class="dot"></span><span id="hudtext">auto-navigating</span></div>
<div id="fade"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- tuning ----------
const CS = 4;              // cell size in world units
const CH = 16;             // cells per chunk side
const WALL_H = 3.4;
const WALL_T = 0.3;
const EYE = 1.65;
const SPEED = 3.8;
const VIEW_R = 2;          // live mesh radius, in chunks
const ROUTE_AHEAD = 6;     // route points kept ahead of the camera
const BG = 0x0d1020;

const N = 1, E = 2, S = 4, W = 8;
const DIRS = [
  { bit: N, dx: 0, dz: -1 },
  { bit: E, dx: 1, dz: 0 },
  { bit: S, dx: 0, dz: 1 },
  { bit: W, dx: -1, dz: 0 },
];

// ---------- deterministic hashing / rng ----------
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- infinite maze data ----------
// Each chunk is a perfect maze (recursive backtracker). Border openings between
// two chunks are a pure function of the chunk pair, so neighbours always agree
// and the whole infinite grid stays connected.
const chunkData = new Map();

function borderOpenings(ax, az, bx, bz, count) {
  let k1 = ax + "," + az, k2 = bx + "," + bz;
  if (k2 < k1) { const t = k1; k1 = k2; k2 = t; }
  const rand = mulberry32(hashStr("edge|" + k1 + "|" + k2));
  const out = new Set();
  let guard = 0;
  while (out.size < count && guard++ < 400) out.add((rand() * CH) | 0);
  return out;
}

function genChunkData(cx, cz) {
  const key = cx + "," + cz;
  let w = chunkData.get(key);
  if (w) return w;
  const rand = mulberry32(hashStr("maze|" + key));
  w = new Uint8Array(CH * CH).fill(15);
  const vis = new Uint8Array(CH * CH);
  const idx = (x, z) => z * CH + x;
  const stack = [idx((rand() * CH) | 0, (rand() * CH) | 0)];
  vis[stack[0]] = 1;
  while (stack.length) {
    const cur = stack[stack.length - 1];
    const x = cur % CH, z = (cur / CH) | 0;
    const opts = [];
    if (z > 0 && !vis[idx(x, z - 1)]) opts.push(0);
    if (x < CH - 1 && !vis[idx(x + 1, z)]) opts.push(1);
    if (z < CH - 1 && !vis[idx(x, z + 1)]) opts.push(2);
    if (x > 0 && !vis[idx(x - 1, z)]) opts.push(3);
    if (!opts.length) { stack.pop(); continue; }
    const d = opts[(rand() * opts.length) | 0];
    let nx = x, nz = z;
    if (d === 0) { nz--; w[cur] &= ~N; w[idx(nx, nz)] &= ~S; }
    else if (d === 1) { nx++; w[cur] &= ~E; w[idx(nx, nz)] &= ~W; }
    else if (d === 2) { nz++; w[cur] &= ~S; w[idx(nx, nz)] &= ~N; }
    else { nx--; w[cur] &= ~W; w[idx(nx, nz)] &= ~E; }
    vis[idx(nx, nz)] = 1;
    stack.push(idx(nx, nz));
  }
  for (const i of borderOpenings(cx, cz - 1, cx, cz, 2)) w[idx(i, 0)] &= ~N;
  for (const i of borderOpenings(cx, cz, cx, cz + 1, 2)) w[idx(i, CH - 1)] &= ~S;
  for (const i of borderOpenings(cx - 1, cz, cx, cz, 2)) w[idx(0, i)] &= ~W;
  for (const i of borderOpenings(cx, cz, cx + 1, cz, 2)) w[idx(CH - 1, i)] &= ~E;
  chunkData.set(key, w);
  return w;
}

function cellWalls(gx, gz) {
  const cx = Math.floor(gx / CH), cz = Math.floor(gz / CH);
  const w = genChunkData(cx, cz);
  return w[(gz - cz * CH) * CH + (gx - cx * CH)];
}

// ---------- navigator: endless DFS with forward bias ----------
const visited = new Set();
let navCell = { x: 8, z: 8 };
let navStack = [];
let lastDir = -1;
visited.add("8,8");

function chooseNext() {
  const w = cellWalls(navCell.x, navCell.z);
  const open = [], fresh = [];
  for (let d = 0; d < 4; d++) {
    if (!(w & DIRS[d].bit)) {
      open.push(d);
      if (!visited.has((navCell.x + DIRS[d].dx) + "," + (navCell.z + DIRS[d].dz))) fresh.push(d);
    }
  }
  let nd;
  if (fresh.length) {
    if (lastDir >= 0 && fresh.includes(lastDir) && Math.random() < 0.55) nd = lastDir;
    else nd = fresh[(Math.random() * fresh.length) | 0];
    navStack.push(navCell.x + "," + navCell.z);
  } else if (navStack.length) {
    const back = navStack.pop().split(",");
    const dx = +back[0] - navCell.x, dz = +back[1] - navCell.z;
    nd = DIRS.findIndex(d => d.dx === dx && d.dz === dz);
    if (nd < 0) nd = open[(Math.random() * open.length) | 0];
  } else {
    nd = open.length ? open[(Math.random() * open.length) | 0] : 0;
  }
  lastDir = nd;
  navCell = { x: navCell.x + DIRS[nd].dx, z: navCell.z + DIRS[nd].dz };
  visited.add(navCell.x + "," + navCell.z);
  return navCell;
}

// ---------- route + rabbit (smooth path follower) ----------
function centerOf(gx, gz) { return new THREE.Vector3(gx * CS, 0, gz * CS); }

const route = [];
const start = centerOf(navCell.x, navCell.z);
const rabbit = start.clone();
let bobPhase = 0;

function appendRoute() { const c = chooseNext(); route.push(centerOf(c.x, c.z)); }
for (let i = 0; i < ROUTE_AHEAD; i++) appendRoute();

function advance(dt) {
  let move = SPEED * dt;
  while (move > 0) {
    if (!route.length) appendRoute();
    const t = route[0];
    const dx = t.x - rabbit.x, dz = t.z - rabbit.z;
    const dist = Math.hypot(dx, dz);
    if (dist <= move) {
      rabbit.x = t.x; rabbit.z = t.z;
      route.shift();
      move -= dist;
    } else {
      rabbit.x += (dx / dist) * move;
      rabbit.z += (dz / dist) * move;
      move = 0;
    }
  }
  while (route.length < ROUTE_AHEAD) appendRoute();
  bobPhase += dt * (SPEED / CS) * Math.PI;
}

function pointAhead(dist) {
  let px = rabbit.x, pz = rabbit.z, rem = dist;
  for (const t of route) {
    const dx = t.x - px, dz = t.z - pz;
    const d = Math.hypot(dx, dz);
    if (d >= rem && d > 1e-6) return { x: px + (dx / d) * rem, z: pz + (dz / d) * rem };
    rem -= d; px = t.x; pz = t.z;
  }
  return { x: px, z: pz };
}

// ---------- renderer / scene ----------
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 3.5, 17);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 90);

scene.add(new THREE.HemisphereLight(0x8a9cc8, 0x0c0f18, 0.5));
const torch = new THREE.PointLight(0xffd9a3, 30, 24, 2);
scene.add(torch);

// ---------- merged chunk geometry ----------
const wallMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide,
});

function pushBox(arr, cx, cy, cz, sx, sy, sz, r, g, b) {
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const faces = [
    [[hx,-hy,-hz],[hx,hy,-hz],[hx,hy,hz],[hx,-hy,hz],[1,0,0]],
    [[-hx,-hy,hz],[-hx,hy,hz],[-hx,hy,-hz],[-hx,-hy,-hz],[-1,0,0]],
    [[-hx,hy,-hz],[-hx,hy,hz],[hx,hy,hz],[hx,hy,-hz],[0,1,0]],
    [[-hx,-hy,hz],[-hx,-hy,-hz],[hx,-hy,-hz],[hx,-hy,hz],[0,-1,0]],
    [[-hx,-hy,hz],[hx,-hy,hz],[hx,hy,hz],[-hx,hy,hz],[0,0,1]],
    [[hx,-hy,-hz],[-hx,-hy,-hz],[-hx,hy,-hz],[hx,hy,-hz],[0,0,-1]],
  ];
  for (const f of faces) {
    const base = arr.pos.length / 3;
    for (let i = 0; i < 4; i++) {
      const p = f[i];
      arr.pos.push(cx + p[0], cy + p[1], cz + p[2]);
      arr.nor.push(f[4][0], f[4][1], f[4][2]);
      arr.col.push(r, g, b);
    }
    arr.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
}

function pushQuad(arr, corners, normal, r, g, b) {
  const base = arr.pos.length / 3;
  for (const p of corners) {
    arr.pos.push(p[0], p[1], p[2]);
    arr.nor.push(normal[0], normal[1], normal[2]);
    arr.col.push(r, g, b);
  }
  arr.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
}

function addWall(arr, rand, cx, cz, sx, sz) {
  const j = (rand() - 0.5) * 0.09;
  pushBox(arr, cx, WALL_H / 2, cz, sx, WALL_H, sz, 0.52 + j, 0.57 + j, 0.72 + j * 1.2);
}

const chunkMeshes = new Map();
let lastChunkKey = "";

function buildChunkMesh(cx, cz) {
  const data = genChunkData(cx, cz);
  const rand = mulberry32(hashStr("deco|" + cx + "," + cz));
  const arr = { pos: [], nor: [], col: [], idx: [] };
  for (let lz = 0; lz < CH; lz++) {
    for (let lx = 0; lx < CH; lx++) {
      const gx = cx * CH + lx, gz = cz * CH + lz;
      const wx = gx * CS, wz = gz * CS;
      const f = ((lx + lz) & 1) ? 0.16 : 0.145;
      pushQuad(arr,
        [[wx - CS / 2, 0, wz - CS / 2], [wx - CS / 2, 0, wz + CS / 2],
         [wx + CS / 2, 0, wz + CS / 2], [wx + CS / 2, 0, wz - CS / 2]],
        [0, 1, 0], f, f * 1.08, f * 1.5);
      const w = data[lz * CH + lx];
      if (w & N) addWall(arr, rand, wx, wz - CS / 2, CS + WALL_T, WALL_T);
      if (w & W) addWall(arr, rand, wx - CS / 2, wz, WALL_T, CS + WALL_T);
    }
  }
  const mnX = cx * CH * CS - CS / 2, mxX = mnX + CH * CS;
  const mnZ = cz * CH * CS - CS / 2, mxZ = mnZ + CH * CS;
  pushQuad(arr,
    [[mnX, WALL_H, mnZ], [mxX, WALL_H, mnZ], [mxX, WALL_H, mxZ], [mnX, WALL_H, mxZ]],
    [0, -1, 0], 0.085, 0.095, 0.14);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(arr.pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(arr.nor, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(arr.col, 3));
  g.setIndex(arr.idx);
  const m = new THREE.Mesh(g, wallMat);
  scene.add(m);
  chunkMeshes.set(cx + "," + cz, m);
}

function ensureChunks() {
  const ccx = Math.floor(rabbit.x / (CS * CH));
  const ccz = Math.floor(rabbit.z / (CS * CH));
  const ck = ccx + "," + ccz;
  if (ck === lastChunkKey) return;
  lastChunkKey = ck;
  for (let dx = -VIEW_R; dx <= VIEW_R; dx++) {
    for (let dz = -VIEW_R; dz <= VIEW_R; dz++) {
      const k = (ccx + dx) + "," + (ccz + dz);
      if (!chunkMeshes.has(k)) buildChunkMesh(ccx + dx, ccz + dz);
    }
  }
  for (const [k, m] of [...chunkMeshes]) {
    const p = k.split(",");
    if (Math.max(Math.abs(+p[0] - ccx), Math.abs(+p[1] - ccz)) > VIEW_R + 1) {
      scene.remove(m);
      m.geometry.dispose();
      chunkMeshes.delete(k);
    }
  }
}

// long-session hygiene: far-away state can be forgotten safely, since chunk
// data is deterministic and regenerates identically when revisited
function pruneState() {
  if (visited.size > 8000) {
    for (const k of visited) {
      const p = k.split(",");
      if (Math.abs(+p[0] - navCell.x) > 200 || Math.abs(+p[1] - navCell.z) > 200) visited.delete(k);
    }
  }
  if (chunkData.size > 4000) {
    const ccx = Math.floor(navCell.x / CH), ccz = Math.floor(navCell.z / CH);
    for (const k of chunkData.keys()) {
      const p = k.split(",");
      if (Math.abs(+p[0] - ccx) > 30 || Math.abs(+p[1] - ccz) > 30) chunkData.delete(k);
    }
  }
}

// ---------- camera rig ----------
const camPos = new THREE.Vector3(start.x, EYE + 6.5, start.z + 3);
const lookPt = new THREE.Vector3(start.x, EYE, start.z - 4);

function updateCamera(dt) {
  const kPos = 1 - Math.exp(-5.2 * dt);
  const kLook = 1 - Math.exp(-3.2 * dt);
  const ahead = pointAhead(5.2);
  let hx = ahead.x - rabbit.x, hz = ahead.z - rabbit.z;
  const hl = Math.hypot(hx, hz) || 1;
  hx /= hl; hz /= hl;
  const sway = Math.sin(bobPhase) * 0.05;
  const bobY = Math.sin(bobPhase * 2) * 0.05;
  camPos.x += ((rabbit.x - hz * sway) - camPos.x) * kPos;
  camPos.z += ((rabbit.z + hx * sway) - camPos.z) * kPos;
  camPos.y += ((EYE + bobY) - camPos.y) * Math.min(kPos * 1.4, 1);
  lookPt.x += (ahead.x - lookPt.x) * kLook;
  lookPt.z += (ahead.z - lookPt.z) * kLook;
  lookPt.y += ((EYE + Math.sin(bobPhase * 2 + 0.6) * 0.03) - lookPt.y) * kLook;
  camera.position.copy(camPos);
  camera.lookAt(lookPt);
  camera.rotateZ(Math.sin(bobPhase) * 0.012);
}

// ---------- hud ----------
const hud = document.getElementById("hudtext");
function updateHud(fps) {
  const ccx = Math.floor(rabbit.x / (CS * CH));
  const ccz = Math.floor(rabbit.z / (CS * CH));
  hud.textContent =
    "auto-navigating \u00B7 cells " + visited.size.toLocaleString() +
    " \u00B7 depth " + navStack.length +
    " \u00B7 chunk " + ccx + "," + ccz +
    " \u00B7 " + fps + " fps";
}

// ---------- main loop ----------
const clock = new THREE.Clock();
let frames = 0, fpsT = 0;

ensureChunks();
updateCamera(0.016);
renderer.render(scene, camera);
requestAnimationFrame(() => { document.getElementById("fade").style.opacity = "0"; });

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  advance(dt);
  ensureChunks();
  updateCamera(dt);
  torch.position.set(camera.position.x, camera.position.y + 0.15, camera.position.z);
  renderer.render(scene, camera);
  frames++; fpsT += dt;
  if (fpsT >= 0.5) {
    updateHud(Math.round(frames / fpsT));
    frames = 0; fpsT = 0;
    pruneState();
  }
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
