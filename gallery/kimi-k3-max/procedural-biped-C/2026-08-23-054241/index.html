<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>HEAVYSTRIDER — Procedural Gait Study</title>
<style>
  :root { --ink:#d7e0f2; --dim:#8b96b3; --accent:#ffb45e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1026; }
  body { font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; }
  canvas { display:block; }
  .overlay { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #vignette { background:radial-gradient(ellipse at 50% 42%, transparent 46%, rgba(4,7,15,.38) 78%, rgba(3,5,12,.74) 100%); }
  #grain { opacity:.05; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>"); animation:grain .9s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-2%,1%)} 50%{transform:translate(1%,-2%)} 75%{transform:translate(-1%,2%)} 100%{transform:translate(2%,-1%)} }
  #fade { background:#05070e; transition:opacity 1.8s ease; z-index:40; }
  #ui { z-index:20; color:var(--ink); }
  #titleBlock { position:absolute; top:34px; left:40px; opacity:0; animation:rise 1.4s cubic-bezier(.2,.7,.2,1) .9s forwards; transition:opacity 2.5s ease; }
  #titleBlock.settled { opacity:.42; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  #title { font-size:24px; font-weight:200; letter-spacing:.55em; text-shadow:0 2px 14px rgba(0,0,0,.65); }
  #title b { font-weight:600; color:var(--accent); }
  #subtitle { margin-top:9px; font-size:10px; letter-spacing:.34em; color:var(--dim); text-transform:uppercase; border-left:2px solid var(--accent); padding-left:10px; }
  #status { position:absolute; left:40px; bottom:30px; font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim); text-shadow:0 1px 8px rgba(0,0,0,.7); opacity:0; animation:rise 1.4s ease 1.6s forwards; }
  #status #stState { color:var(--accent); }
  #status .sep { margin:0 10px; opacity:.5; }
  #hint { position:absolute; right:40px; bottom:30px; font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); opacity:0; animation:rise 1.4s ease 2.2s forwards; }
</style>
</head>
<body>
<div id="ui" class="overlay">
  <div id="titleBlock">
    <div id="title">HEAVY<b>STRIDER</b></div>
    <div id="subtitle">Field Unit 07 — Procedural Gait Study · Dusk Belt</div>
  </div>
  <div id="status">
    <span id="stState">TRAVERSE</span><span class="sep">·</span>SPD <span id="stSpeed">0.0</span> M/S<span class="sep">·</span>GRADE <span id="stGrade">0</span>%<span class="sep">·</span>STRIDE <span id="stStride">0.0</span> M<span class="sep">·</span>DIST <span id="stDist">0</span> M
  </div>

</div>
<div id="vignette" class="overlay"></div>
<div id="grain" class="overlay"></div>
<div id="fade" class="overlay"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const damp = THREE.MathUtils.damp;
const smooth01 = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const sstep = (a, b, x) => smooth01((x - a) / (b - a));
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
function dampAngle(a, b, l, dt) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d * (1 - Math.exp(-l * dt)); }

/* ---------------- noise / terrain field ---------------- */
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  const u = smooth01(fx), v = smooth01(fy);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct) { let s = 0, amp = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); n += amp; amp *= 0.5; f *= 2.03; } return s / n; }

function terrainHeight(x, z) {
  const d = Math.hypot(x, z);
  const rim = sstep(135, 290, d);
  let h = (fbm(x * 0.012 + 7.3, z * 0.012 + 2.9, 4) - 0.5) * 9.0 * (0.42 + rim * 3.4);
  h += (fbm(x * 0.045 + 13.7, z * 0.045 + 9.1, 2) - 0.5) * 1.5;
  h += rim * 16.0 * fbm(x * 0.006 + 31.7, z * 0.006 + 17.3, 3);
  return h;
}
function terrainNormal(x, z, out) {
  const e = 0.4;
  out.set(terrainHeight(x - e, z) - terrainHeight(x + e, z), 2 * e, terrainHeight(x, z - e) - terrainHeight(x, z + e));
  return out.normalize();
}

/* ---------------- patrol path (closed loop) ---------------- */
const PATH_R0 = 105, PATH_A1 = 16, PATH_A2 = 6;
function pathR(th) { return PATH_R0 + PATH_A1 * Math.sin(th * 3 + 0.7) + PATH_A2 * Math.sin(th * 7 + 1.9); }
function pathDR(th) { return PATH_A1 * 3 * Math.cos(th * 3 + 0.7) + PATH_A2 * 7 * Math.cos(th * 7 + 1.9); }
function pathPos(th, out) { const r = pathR(th); out.set(Math.cos(th) * r, 0, Math.sin(th) * r); return out; }
function pathDir(th, out) {
  const r = pathR(th), dr = pathDR(th);
  out.set(-Math.sin(th) * r + Math.cos(th) * dr, 0, Math.cos(th) * r + Math.sin(th) * dr);
  return out.normalize();
}
const pathSamples = [];
for (let i = 0; i < 256; i++) { const p = pathPos(i / 256 * TAU, new THREE.Vector3()); pathSamples.push(p); }
function distToPath(x, z) {
  let m = 1e9;
  for (let i = 0; i < 256; i++) { const dx = pathSamples[i].x - x, dz = pathSamples[i].z - z, d = dx * dx + dz * dz; if (d < m) m = d; }
  return Math.sqrt(m);
}

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.145, 0.185, 0.31), 0.0040);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1600);
camera.position.set(0, 6, 160);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.4, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------- lights ---------------- */
const MOON_DIR = new THREE.Vector3(-0.45, 0.38, -0.8).normalize();
const moonLight = new THREE.DirectionalLight(0xa8c4ff, 2.1);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -26; moonLight.shadow.camera.right = 26;
moonLight.shadow.camera.top = 26; moonLight.shadow.camera.bottom = -26;
moonLight.shadow.camera.near = 10; moonLight.shadow.camera.far = 190;
moonLight.shadow.bias = -0.0002;
moonLight.shadow.normalBias = 0.7;
scene.add(moonLight, moonLight.target);

const rimLight = new THREE.DirectionalLight(0xff9a5c, 0.55);
rimLight.position.set(60, 14, 40);
scene.add(rimLight);
scene.add(new THREE.HemisphereLight(0x3a4a6e, 0x202a40, 0.85));

/* ---------------- shared textures ---------------- */
function softCircleTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.4, 'rgba(255,255,255,.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const softTex = softCircleTexture();

/* ---------------- sky dome / stars / moon / aurora ---------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vDir;
    void main(){
      float h = clamp(vDir.y, -0.08, 1.0);
      vec3 zen = vec3(0.030, 0.050, 0.125);
      vec3 hor = vec3(0.145, 0.185, 0.31);
      vec3 col = mix(hor, zen, pow(max(h, 0.0), 0.55));
      float az = max(dot(normalize(vec2(vDir.x, vDir.z)), normalize(vec2(-0.85, -0.5))), 0.0);
      float band = pow(az, 3.0) * pow(1.0 - abs(vDir.y), 6.0);
      col += vec3(0.85, 0.42, 0.18) * band * 0.5;
      float mh = max(dot(vDir, normalize(vec3(-0.45, 0.38, -0.8))), 0.0);
      col += vec3(0.50, 0.62, 0.85) * pow(mh, 90.0) * 0.55;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(720, 32, 16), skyMat));

{
  const n = 850, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const az = rand(TAU), el = Math.acos(rand(0.02, 1));
    const r = 660;
    pos[i * 3] = Math.cos(az) * Math.sin(el) * r;
    pos[i * 3 + 1] = Math.cos(el) * r;
    pos[i * 3 + 2] = Math.sin(az) * Math.sin(el) * r;
    c.setHSL(rand(0.55, 0.68), rand(0.1, 0.5), rand(0.55, 0.95));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.85, fog: false, depthWrite: false }));
  scene.add(stars);
}

const moonPos = MOON_DIR.clone().multiplyScalar(630);
const moon = new THREE.Mesh(new THREE.SphereGeometry(24, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.15, 1.25, 1.45), fog: false }));
moon.position.copy(moonPos);
scene.add(moon);
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0x9db8e8, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
moonGlow.scale.set(170, 170, 1);
moonGlow.position.copy(moonPos);
scene.add(moonGlow);

function makeAuroraRibbon(w, h, colA, colB) {
  const geo = new THREE.PlaneGeometry(w, h, 96, 20);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i);
    p.setZ(i, -Math.cos(x / w * Math.PI) * 46);
  }
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uTime: { value: 0 }, uIntensity: { value: 0.14 }, uColA: { value: new THREE.Color(colA) }, uColB: { value: new THREE.Color(colB) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform float uTime, uIntensity; uniform vec3 uColA, uColB;
      void main(){
        float a = sin(vUv.x * 36.0 + uTime * 0.55 + sin(vUv.x * 11.0 + uTime * 0.21) * 2.5);
        float b = sin(vUv.x * 17.0 - uTime * 0.33 + sin(vUv.x * 5.0 + uTime * 0.12) * 2.0);
        float rays = clamp(a * 0.5 + 0.5, 0.0, 1.0) * clamp(b * 0.5 + 0.5, 0.0, 1.0);
        float vert = smoothstep(0.0, 0.28, vUv.y) * smoothstep(1.0, 0.42, vUv.y);
        float edge = smoothstep(0.0, 0.14, vUv.x) * smoothstep(1.0, 0.86, vUv.x);
        vec3 col = mix(uColA, uColB, clamp(vUv.y + 0.2 * sin(uTime * 0.1 + vUv.x * 6.0), 0.0, 1.0));
        float alpha = vert * (0.22 + rays * 0.78) * edge * uIntensity;
        gl_FragColor = vec4(col * (0.55 + rays * 0.9), alpha);
      }`
  });
  return new THREE.Mesh(geo, mat);
}
const aurora1 = makeAuroraRibbon(540, 120, 0x37ffb4, 0x7a5cff);
aurora1.position.set(-40, 150, -330); aurora1.rotation.x = -0.12;
const aurora2 = makeAuroraRibbon(420, 90, 0x2adfc8, 0x4d7bff);
aurora2.position.set(190, 175, -260); aurora2.rotation.y = 0.55; aurora2.rotation.x = -0.08;
scene.add(aurora1, aurora2);

/* shooting star */
const starHead = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
starHead.scale.set(4, 4, 1);
const starTrail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), new THREE.MeshBasicMaterial({ color: 0xbfd4ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
scene.add(starHead, starTrail);
const shoot = { active: false, t: 0, dur: 1.4, pos: new THREE.Vector3(), vel: new THREE.Vector3(), nextAt: rand(16, 30) };
function launchStar() {
  const az = rand(TAU), el = rand(0.5, 1.0);
  shoot.pos.set(Math.cos(az) * 560, Math.sin(el) * 380 + 120, Math.sin(az) * 560);
  shoot.vel.set(-Math.sin(az), 0, Math.cos(az)).multiplyScalar(rand(220, 300));
  shoot.vel.y = -rand(50, 90);
  shoot.active = true; shoot.t = 0;
}

/* ---------------- terrain mesh ---------------- */
{
  const SIZE = 620, SEG = 210;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainHeight(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal;
  const colors = new Float32Array(p.count * 3);
  const cLow = new THREE.Color(0x2c4a3c), cMid = new THREE.Color(0x49603f), cRock = new THREE.Color(0x565d6e), cSnow = new THREE.Color(0xc9d6e8);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i), slope = 1 - nrm.getY(i);
    c.copy(cLow).lerp(cMid, sstep(-2.5, 3.5, h));
    c.lerp(cRock, sstep(0.18, 0.42, slope));
    c.lerp(cSnow, sstep(9, 17, h) * sstep(0.35, 0.12, slope));
    const v = 0.92 + hash2(p.getX(i) * 3.1, p.getZ(i) * 3.1) * 0.16;
    colors[i * 3] = c.r * v; colors[i * 3 + 1] = c.g * v; colors[i * 3 + 2] = c.b * v;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0.0 }));
  terrain.receiveShadow = true;
  scene.add(terrain);
}

/* ---------------- scatter: rocks / grass / trees / mushrooms / cairns ---------------- */
const dummy = new THREE.Object3D();
function scatterPos(minR, maxR, minPathDist, tries = 40) {
  for (let i = 0; i < tries; i++) {
    const a = rand(TAU), r = Math.sqrt(rand()) * (maxR - minR) + minR;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (distToPath(x, z) < minPathDist) continue;
    return new THREE.Vector3(x, terrainHeight(x, z), z);
  }
  return null;
}

{
  const rockGeo = new THREE.IcosahedronGeometry(1, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x4d5568, flatShading: true, roughness: 0.9 });
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, 85);
  const rc = new THREE.Color();
  for (let i = 0; i < 85; i++) {
    const p = scatterPos(30, 250, 3.2) || new THREE.Vector3(rand(-200, 200), 0, rand(-200, 200));
    p.y = terrainHeight(p.x, p.z);
    dummy.position.copy(p); dummy.position.y -= 0.2;
    dummy.rotation.set(rand(TAU), rand(TAU), rand(TAU));
    dummy.scale.set(rand(0.5, 2.4), rand(0.4, 1.8), rand(0.5, 2.4));
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
    rocks.setColorAt(i, rc.setHSL(0.6, rand(0.04, 0.1), rand(0.3, 0.45)));
  }
  rocks.castShadow = true; rocks.receiveShadow = true;
  scene.add(rocks);
}

{
  const grassGeo = new THREE.ConeGeometry(0.09, 0.6, 4);
  grassGeo.translate(0, 0.3, 0);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x3d5c40, flatShading: true, roughness: 1 });
  const grass = new THREE.InstancedMesh(grassGeo, grassMat, 1300);
  const gc = new THREE.Color();
  for (let i = 0; i < 1300; i++) {
    const p = scatterPos(25, 230, 1.6) || new THREE.Vector3(0, -50, 0);
    dummy.position.copy(p);
    dummy.rotation.set(rand(-0.25, 0.25), rand(TAU), rand(-0.25, 0.25));
    const s = rand(0.6, 1.9);
    dummy.scale.set(s, s * rand(0.8, 1.5), s);
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
    grass.setColorAt(i, gc.setHSL(rand(0.26, 0.36), rand(0.25, 0.45), rand(0.2, 0.34)));
  }
  grass.receiveShadow = true;
  scene.add(grass);
}

const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x1d2432, flatShading: true, roughness: 0.95 });
function makeTree() {
  const g = new THREE.Group();
  const h = rand(5.5, 9);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.3, h, 5), treeTrunkMat);
  trunk.position.y = h / 2;
  trunk.castShadow = true;
  g.add(trunk);
  const branches = 2 + (rand(3) | 0);
  for (let i = 0; i < branches; i++) {
    const bl = rand(1.2, 2.6);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.1, bl, 4), treeTrunkMat);
    b.geometry.translate(0, bl / 2, 0);
    b.position.y = h * rand(0.45, 0.9);
    b.rotation.set(rand(0.5, 1.1), rand(TAU), 0);
    b.castShadow = true;
    g.add(b);
  }
  return g;
}
for (let i = 0; i < 24; i++) {
  const p = scatterPos(38, 235, 7);
  if (!p) continue;
  const t = makeTree();
  t.position.copy(p);
  t.rotation.y = rand(TAU);
  t.rotation.x = rand(-0.06, 0.06);
  scene.add(t);
}

const mushMat = new THREE.MeshStandardMaterial({ color: 0x0d2a24, emissive: 0x35e8b8, emissiveIntensity: 1.6, roughness: 0.6 });
{
  const mushGeo = new THREE.SphereGeometry(0.1, 6, 5);
  const mush = new THREE.InstancedMesh(mushGeo, mushMat, 64);
  for (let i = 0; i < 64; i++) {
    const p = scatterPos(30, 200, 2.2) || new THREE.Vector3(0, -50, 0);
    dummy.position.copy(p); dummy.position.y += 0.06;
    dummy.rotation.set(0, 0, 0);
    const s = rand(0.5, 1.6);
    dummy.scale.set(s, s * 0.75, s);
    dummy.updateMatrix();
    mush.setMatrixAt(i, dummy.matrix);
  }
  scene.add(mush);
}

const CAIRN_THETAS = [0.9, 3.3, 5.4];
const runeMat = new THREE.MeshStandardMaterial({ color: 0x0d2a24, emissive: 0x35e8b8, emissiveIntensity: 2.4, roughness: 0.5 });
const cairnMat = new THREE.MeshStandardMaterial({ color: 0x3c4354, flatShading: true, roughness: 0.9 });
for (const th of CAIRN_THETAS) {
  const p = pathPos(th, new THREE.Vector3());
  const d = pathDir(th, new THREE.Vector3());
  const side = new THREE.Vector3(d.z, 0, -d.x);
  p.addScaledVector(side, 4.2);
  p.y = terrainHeight(p.x, p.z);
  const g = new THREE.Group();
  let y = 0;
  for (let i = 0; i < 4; i++) {
    const s = 0.85 - i * 0.16;
    const stone = new THREE.Mesh(new THREE.BoxGeometry(s, 0.28, s * rand(0.7, 1)), cairnMat);
    stone.position.set(rand(-0.05, 0.05), y + 0.14, rand(-0.05, 0.05));
    stone.rotation.y = rand(TAU);
    stone.castShadow = true;
    g.add(stone);

  _ikDir.multiplyScalar(1 / Math.max(d, 1e-5));
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(L1 * L1 - a * a, 1e-8));

  if (_ikPole.lengthSq() < 1e-6) _ikPole.set(0, 0, -1).addScaledVector(_ikDir, _ikDir.z);

class Chain {
  constructor(count, segLen, opts = {}) {
    this.segLen = segLen;
    this.points = []; this.prev = [];
    for (let i = 0; i < count; i++) { this.points.push(new THREE.Vector3()); this.prev.push(new THREE.Vector3()); }
    this.gravity = opts.gravity ?? -2.0;
    this.damping = opts.damping ?? 0.9;
    this.restPull = opts.restPull ?? 0;
    this.init = false;
  }
  reset(root, dir) {
    for (let i = 0; i < this.points.length; i++) {
      this.points[i].copy(root).addScaledVector(dir, this.segLen * i);
      this.prev[i].copy(this.points[i]);
    }
    this.init = true;
  }
  update(dt, root, restDir) {
    if (!this.init) this.reset(root, restDir);
    dt = Math.min(dt, 0.033);
    const pts = this.points, prv = this.prev;
    pts[0].copy(root);
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = prv[i];
      const vx = (p.x - q.x) * this.damping, vy = (p.y - q.y) * this.damping, vz = (p.z - q.z) * this.damping;
      q.copy(p);
      p.x += vx; p.y += vy + this.gravity * dt; p.z += vz;
      if (this.restPull > 0) p.addScaledVector(restDir, this.restPull * dt);
    }
    for (let k = 0; k < 3; k++) {
      pts[0].copy(root);
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        _sv.subVectors(b, a);
        const d = _sv.length() || 1e-5;
        b.addScaledVector(_sv, -(d - this.segLen) / d);
      }
    }
  }
}

}

const bodyPos = new THREE.Vector3();
const bodyQuat = new THREE.Quaternion();

const backDir = new THREE.Vector3(0, 0, -1);
let yaw = 0, pitch = 0, roll = 0, speed = 0, theta = 0.0, bobPhase = 0, dist = 0;
let slopeAlong = 0, stepLen = 1.8, speedNorm = 0;

const HIP_OFF = new THREE.Vector3();

const _m4 = new THREE.Matrix4();

function onFootPlant(leg) {
  spawnDust(leg.planted, 0.8 + speedNorm * 0.6);
  wV -= 1.35 * (0.4 + speedNorm * 0.6);
}

function updateLeg(leg, other, dt) {
  HIP_OFF.set(leg.side * 0.5, -0.05, 0);
  leg.hip.copy(HIP_OFF).applyQuaternion(bodyQuat).add(bodyPos);
  hipGround.set(leg.hip.x, terrainHeight(leg.hip.x, leg.hip.z), leg.hip.z);

  if (leg.stepping) {
    leg.t += dt / leg.dur;
    if (leg.t >= 1) { leg.t = 1; leg.stepping = false; leg.planted.copy(leg.to); onFootPlant(leg); }
    const te = smooth01(leg.t);
    leg.ankle.lerpVectors(leg.from, leg.to, te);
    leg.ankle.y += Math.sin(Math.PI * leg.t) * (0.5 + stepLen * 0.12);
  } else {
    leg.ankle.copy(leg.planted);
    if (!other.stepping) {
      _v.subVectors(hipGround, leg.planted);
      if (speed > 0.06) {
        const along = _v.dot(moveDir);
        const lat = _v.addScaledVector(moveDir, -along).length();
        if (along > stepLen * 0.52 || lat > 0.85) {
          leg.stepping = true; leg.t = 0;
          leg.from.copy(leg.planted);
          leg.to.copy(hipGround).addScaledVector(moveDir, stepLen * 0.72);
          leg.to.y = terrainHeight(leg.to.x, leg.to.z);
          leg.dur = clamp(stepLen / (speed * 1.5), 0.2, 0.55);
        }
      } else if (_v.length() > 0.55) {
        leg.stepping = true; leg.t = 0;
        leg.from.copy(leg.planted);
        leg.to.copy(hipGround);
        leg.to.y = terrainHeight(leg.to.x, leg.to.z);
        leg.dur = 0.5;
      }
    }
  }

  _ankleTop.copy(leg.ankle); _ankleTop.y += FOOT_H + 0.02;
  solveKnee(leg.hip, _ankleTop, backDir, leg.kneeP);
  placeSegment(leg.rig.thigh, leg.hip, leg.kneeP);
  placeSegment(leg.rig.shin, leg.kneeP, _ankleTop);
  leg.rig.knee.position.copy(leg.kneeP);
  leg.rig.ankleGlow.position.copy(_ankleTop);

  if (leg.stepping) _up.set(0, 1, 0); else terrainNormal(leg.ankle.x, leg.ankle.z, _up);
  _fwd.set(Math.sin(yaw), 0, Math.cos(yaw));
  _fwd.addScaledVector(_up, -_fwd.dot(_up)).normalize();
  _side.crossVectors(_up, _fwd);
  _m4.makeBasis(_side, _up, _fwd);
  _q.setFromRotationMatrix(_m4);
  if (leg.stepping) {
    _e.set(-Math.sin(Math.PI * leg.t) * 0.55, 0, 0);
    _q.multiply(new THREE.Quaternion().setFromEuler(_e));
  }
  leg.rig.foot.quaternion.slerp(_q, 1 - Math.exp(-14 * dt));
  leg.rig.foot.position.copy(leg.ankle);
  leg.rig.foot.position.y += FOOT_H * 0.5 + 0.02;
}

function animate() {
  requestAnimationFrame(animate);

  t += dt;

  /* vista sequencing */
  if (!vista.active && t - vista.last > 30 && speed > 1) {
    const th = ((theta % TAU) + TAU) % TAU;
    for (const c of CAIRN_THETAS) {
      let d = Math.abs(th - c); if (d > Math.PI) d = TAU - d;
      if (d < 0.02) { vista.active = true; vista.t = 0; vista.last = t; vista.starFired = false; break; }
    }
  }
  let vistaAmt = 0;
  if (vista.active) {
    vista.t += dt;
    const ph = vista.t / vista.dur;
    vistaAmt = Math.min(sstep(0, 0.22, ph), sstep(1, 0.72, ph));
    if (vista.t > 3 && !vista.starFired) { launchStar(); vista.starFired = true; }
    if (ph >= 1) vista.active = false;
  }
  vista.blend = damp(vista.blend, vista.active ? 1 : 0, 0.9, dt);

  /* locomotion along path */
  pathPos(theta, bodyPos);
  pathDir(theta, moveDir);
  const r = pathR(theta);
  const hAhead = terrainHeight(bodyPos.x + moveDir.x * 1.4, bodyPos.z + moveDir.z * 1.4);
  const hBehind = terrainHeight(bodyPos.x - moveDir.x * 1.4, bodyPos.z - moveDir.z * 1.4);
  slopeAlong = (hAhead - hBehind) / 2.8;
  const baseSpeed = 2.3;
  const speedTarget = vista.active ? 0 : baseSpeed * clamp(1 - slopeAlong * 1.9, 0.5, 1.28);
  speed = damp(speed, speedTarget, 1.6, dt);
  theta += speed * dt / Math.max(r, 20);
  dist += speed * dt;
  speedNorm = clamp(speed / baseSpeed, 0, 1.3);
  stepLen = clamp(1.15 + speed * 0.5, 1.1, 2.35);
  bobPhase += dt * (speed / stepLen) * Math.PI;

  pathPos(theta, bodyPos);
  pathDir(theta, moveDir);
  backDir.copy(moveDir).negate();

  /* body orientation + height */
  const targetYaw = Math.atan2(moveDir.x, moveDir.z);
  yaw = dampAngle(yaw, targetYaw, 3.2, dt);
  _side.set(Math.cos(yaw), 0, -Math.sin(yaw));
  const hSide = terrainHeight(bodyPos.x + _side.x * 1.3, bodyPos.z + _side.z * 1.3) -
                terrainHeight(bodyPos.x - _side.x * 1.3, bodyPos.z - _side.z * 1.3);
  const sway = Math.sin(bobPhase) * 0.07 * speedNorm;
  pitch = damp(pitch, -Math.atan(slopeAlong) * 0.5 + Math.sin(bobPhase * 2) * 0.02 * speedNorm - vista.blend * 0.05, 4, dt);
  roll = damp(roll, -Math.atan(hSide / 2.6) * 0.35 + sway, 4, dt);
  const yawOsc = yaw + Math.sin(bobPhase) * 0.05 * speedNorm;
  _e.set(pitch, yawOsc, roll, 'YXZ');
  bodyQuat.setFromEuler(_e);

  wV += (-110 * wY - 14 * wV) * dt;
  wY += wV * dt;
  const groundUnder = terrainHeight(bodyPos.x, bodyPos.z);
  const feetAvg = (legL.planted.y + legR.planted.y) * 0.5;
  const bobY = Math.sin(bobPhase * 2) * 0.055 * speedNorm;
  const targetY = groundUnder * 0.45 + feetAvg * 0.55 + HIP_H + bobY + wY * 0.06;
  bodyPos.y = damp(bodyPos.y, targetY, 7, dt);
  bodyPos.addScaledVector(_side, Math.sin(bobPhase) * 0.06 * speedNorm);

  bodyGroup.position.copy(bodyPos);
  bodyGroup.quaternion.copy(bodyQuat);
  bodyGroup.updateMatrixWorld(true);

  /* legs */
  updateLeg(legL, legR, dt);
  updateLeg(legR, legL, dt);

  /* head: wander + vista sky-watch */
  const wanderYaw = Math.sin(t * 0.21) * 0.32 + Math.sin(t * 0.073) * 0.22;
  const targetHeadYaw = wanderYaw * (1 - vista.blend) + Math.sin(vista.t * 0.4) * 0.3 * vista.blend;
  const targetHeadPitch = -0.04 * (1 - vista.blend) + (-0.52 * vistaAmt) * vista.blend;
  headYaw = damp(headYaw, targetHeadYaw, 2.5, dt);
  headPitch = damp(headPitch, targetHeadPitch, 2.5, dt);
  headGroup.rotation.set(headPitch, headYaw - Math.sin(bobPhase) * 0.08 * speedNorm, 0);

  /* blink */
  if (t > blinkAt && blinkT < 0) { blinkT = 0; blinkAt = t + rand(3, 6.5); }
  if (blinkT >= 0) {
    blinkT += dt;
    const b = Math.sin(Math.PI * clamp(blinkT / 0.16, 0, 1));
    eyeL.scale.y = eyeR.scale.y = 1 - b * 0.9;
    if (blinkT > 0.16) { blinkT = -1; eyeL.scale.y = eyeR.scale.y = 1; }
  }
  eyeMat.emissiveIntensity = 3 + vista.blend * 3.2;

  /* arms swing counter to legs */
  const armSwing = 0.55 * speedNorm;
  armL.shoulder.rotation.x = Math.sin(bobPhase) * armSwing;
  armR.shoulder.rotation.x = Math.sin(bobPhase + Math.PI) * armSwing;
  armL.elbow.rotation.x = -0.45 + Math.sin(bobPhase - 0.6) * 0.22 * speedNorm;
  armR.elbow.rotation.x = -0.45 + Math.sin(bobPhase + Math.PI - 0.6) * 0.22 * speedNorm;

  /* secondary-motion chains */
  _root.set(0, 0.3, -0.48).applyQuaternion(bodyQuat).add(bodyPos);
  _rest.set(0, 0.3, -1).normalize().applyQuaternion(bodyQuat);
  tailChain.update(dt, _root, _rest);
  renderChain(tailChain, tailMeshes);
  for (const [chain, meshes, sx] of [[antChainL, antMeshesL, -1], [antChainR, antMeshesR, 1]]) {
    _headW.set(sx * 0.14, 0.28, -0.1);
    headGroup.localToWorld(_headW);
    _rest.set(sx * 0.2, 1, -0.35).normalize().applyQuaternion(bodyQuat);
    chain.update(dt, _headW, _rest);
    renderChain(chain, meshes);
  }

  /* environment life */
  aurora1.material.uniforms.uTime.value = t;
  aurora2.material.uniforms.uTime.value = t * 0.8 + 40;
  const auroraTarget = 0.14 + vistaAmt * 0.86;
  aurora1.material.uniforms.uIntensity.value = damp(aurora1.material.uniforms.uIntensity.value, auroraTarget, 0.8, dt);
  aurora2.material.uniforms.uIntensity.value = damp(aurora2.material.uniforms.uIntensity.value, auroraTarget * 0.7, 0.8, dt);
  mushMat.emissiveIntensity = 1.6 + Math.sin(t * 1.3) * 0.5;
  runeMat.emissiveIntensity = 2.4 + Math.sin(t * 2.1) * 0.7 + vista.blend * 2;
  updateFireflies(fliesA, t);
  updateFireflies(fliesB, t * 1.2 + 9);
  updateDust(dt);

  if (!shoot.active && t > shoot.nextAt) { launchStar(); shoot.nextAt = t + rand(18, 38); }
  if (shoot.active) {
    shoot.t += dt;
    const u = shoot.t / shoot.dur;
    if (u >= 1) { shoot.active = false; starHead.material.opacity = 0; starTrail.material.opacity = 0; }
    else {
      shoot.pos.addScaledVector(shoot.vel, dt);
      starHead.position.copy(shoot.pos);
      starHead.material.opacity = Math.sin(Math.PI * u) * 0.95;
      _v2.copy(shoot.pos).addScaledVector(shoot.vel, -0.09);
      placeSegment(starTrail, _v2, shoot.pos);
      starTrail.material.opacity = Math.sin(Math.PI * u) * 0.5;
    }
  }

  /* moon light follows creature for tight shadows */
  moonLight.position.copy(bodyPos).addScaledVector(MOON_DIR, 80);
  moonLight.target.position.copy(bodyPos);
  moonLight.target.updateMatrixWorld();

  /* camera */
  const introT = smooth01(t / 9);
  const followAngle = yaw + Math.PI + Math.sin(t * 0.045) * 1.05;
  const vistaAngle = yaw + Math.PI * 0.55 + t * 0.1;
  const ang = followAngle * (1 - vista.blend) + vistaAngle * vista.blend;
  const radius = (11.6 * (1 - vista.blend) + 16 * vista.blend) * (2.05 - 1.05 * introT);
  const height = (4.4 * (1 - vista.blend) + 2.4 * vista.blend) * (0.4 + 0.6 * introT) + (1 - introT) * 1.2;
  _camTarget.set(
    bodyPos.x + Math.sin(ang) * radius + _side.x * pointerX * 0.8,
    bodyPos.y + height - pointerY * 0.5,
    bodyPos.z + Math.cos(ang) * radius + _side.z * pointerX * 0.8
  );
  const camGround = terrainHeight(_camTarget.x, _camTarget.z) + 1.3;
  if (_camTarget.y < camGround) _camTarget.y = camGround;
  if (!camInit) { camPos.copy(_camTarget); camInit = true; }
  camPos.lerp(_camTarget, 1 - Math.exp(-1.7 * dt));
  camera.position.copy(camPos);
  _look.copy(bodyPos).addScaledVector(moveDir, 2.2);
  _look.y += 1.4 + vista.blend * 1.6 + (vnoise(t * 0.5, 3.7) - 0.5) * 0.3;
  lookPos.lerp(_look, 1 - Math.exp(-2.4 * dt));
  camera.lookAt(lookPos);

  /* HUD */
  hudTimer += dt;
  if (hudTimer > 0.18) {
    hudTimer = 0;
    stState.textContent = vista.active ? 'VISTA — AURORA SURVEY' : speed < 0.3 ? 'HALT' : slopeAlong > 0.05 ? 'ASCENT' : slopeAlong < -0.05 ? 'DESCENT' : 'TRAVERSE';
    stSpeed.textContent = speed.toFixed(1);
    stGrade.textContent = Math.round(slopeAlong * 100);
    stStride.textContent = stepLen.toFixed(1);
    stDist.textContent = Math.round(dist);
  }

  if (fadeEl.style.opacity !== '0') fadeEl.style.opacity = '0';
  composer.render();
}
animate();
</script>
</body>
</html>
