<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Golden Hour — First-Person Rollercoaster</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241407; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hud { position: fixed; z-index: 10; color: #fff; pointer-events: none;
         font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
         text-shadow: 0 1px 4px rgba(0,0,0,.55); }
  #title { top: 40px; left: 50%; transform: translateX(-50%); text-align: center;
           transition: opacity 3s; }
  #title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .5em; }
  #title p { margin: 8px 0 0; font-size: 11px; letter-spacing: .32em; opacity: .8; }
  #stats { left: 20px; bottom: 18px; font-size: 12px; line-height: 1.8;
           letter-spacing: .12em; opacity: .9; }
  #hint { right: 20px; bottom: 18px; font-size: 11px; letter-spacing: .2em; opacity: .65; }
  #err { top: 50%; left: 50%; transform: translate(-50%,-50%); display: none;
         font-size: 13px; background: rgba(0,0,0,.65); padding: 12px 18px; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title"><h1>GOLDEN HOUR</h1><p>FIRST-PERSON COASTER</p></div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">CLICK FOR SOUND</div>
<div class="hud" id="err"></div>

<script type="module">
const container = document.getElementById('app');
const statsEl = document.getElementById('stats');
const hintEl = document.getElementById('hint');
const titleEl = document.getElementById('title');
const errEl = document.getElementById('err');

function showError(msg) {
  errEl.style.display = 'block';
  errEl.textContent = String(msg);
}
addEventListener('error', (e) => showError('Error: ' + (e.message || 'unknown')));
addEventListener('unhandledrejection', (e) =>
  showError('Error: ' + ((e.reason && e.reason.message) || e.reason || 'unknown')));

let THREE;
try {
  THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
} catch (e) {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
}

// ---------- renderer / scene ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) { showError('WebGL is unavailable: ' + e.message); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xf0a468);
scene.fog = new THREE.Fog(HORIZON, 170, 720);

const camera = new THREE.PerspectiveCamera(66, window.innerWidth / window.innerHeight, 0.1, 2200);

// ---------- sky, sun, lights ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(950, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x3d6fa8) },
      mid: { value: HORIZON },
      bot: { value: new THREE.Color(0x6e4530) }
    },
    vertexShader: `
      varying vec3 vP;
      void main() {
        vP = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vP;
      uniform vec3 top; uniform vec3 mid; uniform vec3 bot;
      void main() {
        float h = normalize(vP).y;
        vec3 c = h > 0.0
          ? mix(mid, top, pow(h, 0.55))
          : mix(mid, bot, pow(clamp(-h, 0.0, 1.0), 0.6));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xffe0c0, 0x54683f, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffd9a8, 2.6);
sun.position.set(365, 150, -110);
sun.target.position.set(65, 0, 100);
scene.add(sun, sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -280;
sun.shadow.camera.right = sun.shadow.camera.top = 280;
sun.shadow.camera.near = 50;
sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;

const sunDir = sun.position.clone().sub(sun.target.position).normalize();
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(34, 32),
  new THREE.MeshBasicMaterial({ color: 0xfff3d0, fog: false })
);
disc.position.copy(sunDir).multiplyScalar(860).add(new THREE.Vector3(65, 0, 100));
disc.lookAt(65, 0, 100);
const glow = new THREE.Mesh(
  new THREE.CircleGeometry(115, 32),
  new THREE.MeshBasicMaterial({ color: 0xffd9a0, fog: false, transparent: true,
    opacity: 0.26, blending: THREE.AdditiveBlending, depthWrite: false })
);
glow.position.copy(disc.position);
glow.lookAt(65, 0, 100);
scene.add(disc, glow);

// ---------- track curve ----------
const RAW = [
  [0, 3, 0], [35, 3, 6], [70, 4, 20], [100, 10, 45], [118, 26, 75],
  [128, 44, 108], [132, 46, 118], [128, 14, 150], [112, 5, 178],
  [86, 8, 196], [55, 16, 200], [28, 22, 188], [10, 14, 162],
  [4, 8, 130], [12, 18, 100], [30, 24, 78], [58, 28, 70],
  [85, 26, 80], [100, 20, 102], [96, 14, 128], [74, 10, 140],
  [50, 12, 128], [38, 9, 104], [40, 6, 76], [55, 5, 50],
  [48, 4, 24], [24, 3, 8]
];
const curve = new THREE.CatmullRomCurve3(
  RAW.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, 'centripetal');
curve.arcLengthDivisions = 2400;
const L = curve.getLength();

const N = 2400;
const ds = L / N;
const pts = [], tans = [], nors = [], bins = [];
for (let i = 0; i < N; i++) {
  const u = i / N;
  pts.push(curve.getPointAt(u));
  tans.push(curve.getTangentAt(u).normalize());
}

// Parallel-transported up vectors (no twist), then distribute the residual
// seam twist over the whole loop so the closed curve joins seamlessly.
{
  const t0 = tans[0];
  const n0 = new THREE.Vector3(0, 1, 0).addScaledVector(t0, -t0.y).normalize();
  nors.push(n0.clone());
  bins.push(new THREE.Vector3().crossVectors(t0, n0).normalize());
  const axis = new THREE.Vector3();
  for (let i = 1; i < N; i++) {
    const a = tans[i - 1], b = tans[i];
    const n = nors[i - 1].clone();
    axis.crossVectors(a, b);
    if (axis.lengthSq() > 1e-12) {
      axis.normalize();
      n.applyAxisAngle(axis, Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)));
    }
    n.addScaledVector(b, -n.dot(b)).normalize();
    nors.push(n);
    bins.push(new THREE.Vector3().crossVectors(b, n).normalize());
  }
  const a = tans[N - 1], b = tans[0];
  const nEnd = nors[N - 1].clone();
  axis.crossVectors(a, b);
  if (axis.lengthSq() > 1e-12) {
    axis.normalize();
    nEnd.applyAxisAngle(axis, Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)));
  }
  nEnd.addScaledVector(b, -nEnd.dot(b)).normalize();
  const twist = Math.atan2(new THREE.Vector3().crossVectors(n0, nEnd).dot(b), n0.dot(nEnd));
  for (let i = 1; i < N; i++) {
    const c = -twist * (i / N);
    nors[i].applyAxisAngle(tans[i], c);
    bins[i].applyAxisAngle(tans[i], c);
  }
}

// ---------- banking ----------
// Roll into turns: bank = atan(a_lat / g) using the coaster's design speed,
// heavily smoothed so the camera eases in and out of each bank.
const G = 9.81, V_TOP = 7;
let hMax = 0;
for (const p of pts) hMax = Math.max(hMax, p.y);
hMax += 0.5;
let banks = new Float32Array(N);
{
  const k = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    k.copy(tans[(i + 1) % N]).sub(tans[(i - 1 + N) % N]).multiplyScalar(1 / (2 * ds));
    const lat = k.dot(bins[i]);
    const v2 = V_TOP * V_TOP + 2 * G * (hMax - pts[i].y);
    banks[i] = THREE.MathUtils.clamp(Math.atan(lat * v2 / G), -1.05, 1.05);
  }
  const blur = (arr, R) => {
    const out = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      let s = 0;
      for (let j = -R; j <= R; j++) s += arr[(i + j + N) % N];
      out[i] = s / (2 * R + 1);
    }
    return out;
  };
  for (let p = 0; p < 3; p++) banks = blur(banks, 22);
}

// ---------- track geometry ----------
function offsetCurve(latOff, upOff) {
  const arr = [];
  for (let i = 0; i < N; i += 2) {
    arr.push(pts[i].clone().addScaledVector(bins[i], latOff).addScaledVector(nors[i], upOff));
  }
  return new THREE.CatmullRomCurve3(arr, true, 'centripetal');
}
const railMat = new THREE.MeshStandardMaterial({ color: 0xc23b22, metalness: 0.55, roughness: 0.35 });
const spineMat = new THREE.MeshStandardMaterial({ color: 0x8f2a1d, metalness: 0.5, roughness: 0.4 });
for (const [geo, mat] of [
  [new THREE.TubeGeometry(offsetCurve(-0.75, 0.06), 1300, 0.09, 8, true), railMat],
  [new THREE.TubeGeometry(offsetCurve(0.75, 0.06), 1300, 0.09, 8, true), railMat],
  [new THREE.TubeGeometry(offsetCurve(0, -0.32), 1300, 0.14, 8, true), spineMat]
]) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  scene.add(m);
}

const tieStep = Math.max(1, Math.round(0.85 / ds));
const tieCount = Math.floor(N / tieStep);
const ties = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1.85, 0.09, 0.26),
  new THREE.MeshStandardMaterial({ color: 0x3f444b, metalness: 0.3, roughness: 0.6 }),
  tieCount
);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        s = new THREE.Vector3(1, 1, 1), pos = new THREE.Vector3(), back = new THREE.Vector3();
  let idx = 0;
  for (let i = 0; i < N && idx < tieCount; i += tieStep) {
    pos.copy(pts[i]).addScaledVector(nors[i], -0.05);
    back.copy(tans[i]).negate();
    m.makeBasis(bins[i], nors[i], back);
    q.setFromRotationMatrix(m);
    m.compose(pos, q, s);
    ties.setMatrixAt(idx++, m);
  }
  ties.count = idx;
}
ties.castShadow = true;
scene.add(ties);

const supStep = Math.max(1, Math.round(7.5 / ds));
const supGeo = new THREE.CylinderGeometry(0.14, 0.2, 1, 8);
supGeo.translate(0, 0.5, 0);
const supIdx = [];
for (let i = 0; i < N; i += supStep) if (pts[i].y > 2.4) supIdx.push(i);
const supports = new THREE.InstancedMesh(
  supGeo,
  new THREE.MeshStandardMaterial({ color: 0xdfe3e6, metalness: 0.2, roughness: 0.5 }),
  supIdx.length
);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        pos = new THREE.Vector3(), s = new THREE.Vector3();
  supIdx.forEach((si, k) => {
    const p = pts[si];
    pos.set(p.x, 0, p.z);
    s.set(1, p.y - 0.38, 1);
    m.compose(pos, q, s);
    supports.setMatrixAt(k, m);
  });
}
supports.castShadow = true;
scene.add(supports);

// ---------- ground ----------
function groundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#6f9a4e';
  g.fillRect(0, 0, 256, 256);
  const shades = ['#5c8a41', '#7fae5c', '#679247', '#76a356'];
  for (let i = 0; i < 140; i++) {
    g.fillStyle = shades[(Math.random() * shades.length) | 0];
    g.globalAlpha = 0.10 + Math.random() * 0.12;
    g.beginPath();
    g.arc(Math.random() * 256, Math.random() * 256, 6 + Math.random() * 34, 0, 7);
    g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(12, 12);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(820, 72),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- scenery ----------
const trackXZ = [];
for (let i = 0; i < N; i += 8) trackXZ.push(pts[i].x, pts[i].z);
function clearOfTrack(x, z, r) {
  const r2 = r * r;
  for (let i = 0; i < trackXZ.length; i += 2) {
    const dx = x - trackXZ[i], dz = z - trackXZ[i + 1];
    if (dx * dx + dz * dz < r2) return false;
  }
  return true;
}
function scatter(count, rMin, rMax, clearance) {
  const out = [];
  let guard = count * 40;
  while (out.length < count && guard-- > 0) {
    const a = Math.random() * Math.PI * 2;
    const r = rMin + Math.random() * (rMax - rMin);
    const x = 65 + Math.cos(a) * r;
    const z = 100 + Math.sin(a) * r;
    if (clearOfTrack(x, z, clearance)) out.push([x, z]);
  }
  return out;
}

const treeSpots = scatter(360, 26, 430, 13);
const trunkGeo = new THREE.CylinderGeometry(0.16, 0.26, 1.9, 5);
trunkGeo.translate(0, 0.95, 0);
const folGeo = new THREE.ConeGeometry(1.5, 3.8, 6);
folGeo.translate(0, 3.4, 0);
const trunks = new THREE.InstancedMesh(trunkGeo,
  new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.9 }), treeSpots.length);
const fols = new THREE.InstancedMesh(folGeo,
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 }), treeSpots.length);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(),
        s = new THREE.Vector3(), col = new THREE.Color(), AXIS_Y = new THREE.Vector3(0, 1, 0);
  treeSpots.forEach(([x, z], i) => {
    const sc = 0.7 + Math.random() * 1.1;
    pos.set(x, 0, z);
    q.setFromAxisAngle(AXIS_Y, Math.random() * Math.PI * 2);
    s.set(sc, sc * (0.85 + Math.random() * 0.4), sc);
    m.compose(pos, q, s);
    trunks.setMatrixAt(i, m);
    fols.setMatrixAt(i, m);
    col.setHSL(0.29 + Math.random() * 0.06, 0.45 + Math.random() * 0.2, 0.26 + Math.random() * 0.12);
    fols.setColorAt(i, col);
  });
}
trunks.castShadow = fols.castShadow = true;
scene.add(trunks, fols);

const rockSpots = scatter(70, 20, 400, 9);
const rocks = new THREE.InstancedMesh(
  new THREE.DodecahedronGeometry(1, 0),
  new THREE.MeshStandardMaterial({ color: 0x8d8578, roughness: 0.95, flatShading: true }),
  rockSpots.length
);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        e = new THREE.Euler(), pos = new THREE.Vector3(), s = new THREE.Vector3();
  rockSpots.forEach(([x, z], i) => {
    const sc = 0.4 + Math.random() * 1.3;
    pos.set(x, sc * 0.3, z);
    e.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    q.setFromEuler(e);
    s.set(sc, sc * (0.6 + Math.random() * 0.5), sc);
    m.compose(pos, q, s);
    rocks.setMatrixAt(i, m);
  });
}
rocks.castShadow = true;
scene.add(rocks);

const mtnMat = new THREE.MeshLambertMaterial({ color: 0x8c8398, flatShading: true });
for (let i = 0; i < 13; i++) {
  const a = (i / 13) * Math.PI * 2 + Math.random() * 0.3;
  const r = 500 + Math.random() * 130;
  const h = 90 + Math.random() * 110;
  const mtn = new THREE.Mesh(new THREE.ConeGeometry(70 + Math.random() * 70, h, 5), mtnMat);
  mtn.position.set(65 + Math.cos(a) * r, h / 2 - 4, 100 + Math.sin(a) * r);
  mtn.rotation.y = Math.random() * Math.PI;
  scene.add(mtn);
}

const clouds = [];
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.88 });
for (let i = 0; i < 14; i++) {
  const grp = new THREE.Group();
  const puffs = 3 + (Math.random() * 3 | 0);
  for (let j = 0; j < puffs; j++) {
    const s = 5 + Math.random() * 9;
    const puff = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), cloudMat);
    puff.scale.set(s * (1.2 + Math.random()), s * 0.45, s * (0.8 + Math.random() * 0.5));
    puff.position.set((j - puffs / 2) * s * 1.1 + Math.random() * 4, Math.random() * 2.5, Math.random() * 6 - 3);
    grp.add(puff);
  }
  const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 380;
  grp.position.set(65 + Math.cos(a) * r, 95 + Math.random() * 70, 100 + Math.sin(a) * r);
  grp.userData.speed = 1.2 + Math.random() * 1.6;
  clouds.push(grp);
  scene.add(grp);
}

// ---------- station ----------
function frameAt(u) {
  const f = u * N;
  const i0 = Math.floor(f) % N, i1 = (i0 + 1) % N, fr = f - Math.floor(f);
  const p = curve.getPointAt(u);
  const t = tans[i0].clone().lerp(tans[i1], fr).normalize();
  const n = nors[i0].clone().lerp(nors[i1], fr);
  n.addScaledVector(t, -n.dot(t)).normalize();
  const r = new THREE.Vector3().crossVectors(t, n).normalize();
  return { p, t, n, r };
}
{
  const { p, t, n, r } = frameAt(6 / L);
  const yaw = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(r, n, t.clone().negate()));
  const plat = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.2, 16),
    new THREE.MeshStandardMaterial({ color: 0x8a6b4a, roughness: 0.8 }));
  plat.position.copy(p).addScaledVector(r, 3.3);
  plat.position.y = p.y - 1.15;
  plat.quaternion.copy(yaw);
  plat.castShadow = plat.receiveShadow = true;
  const roof = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.16, 17),
    new THREE.MeshStandardMaterial({ color: 0xb5312a, roughness: 0.6 }));
  roof.position.copy(p).addScaledVector(r, 3.3);
  roof.position.y = p.y + 3.3;
  roof.quaternion.copy(yaw);
  roof.castShadow = true;
  scene.add(plat, roof);
  const postGeo = new THREE.CylinderGeometry(0.09, 0.09, 4.4, 6);
  const postMat = new THREE.MeshStandardMaterial({ color: 0xdfe3e6, roughness: 0.5 });
  for (const [dx, dz] of [[-1.9, -7.2], [1.9, -7.2], [-1.9, 7.2], [1.9, 7.2]]) {
    const post = new THREE.Mesh(postGeo, postMat);
    post.position.copy(p).addScaledVector(r, 3.3 + dx).addScaledVector(t, dz);
    post.position.y = p.y + 1.1;
    scene.add(post);
  }
}

// ---------- audio (gesture-gated wind) ----------
let actx = null, windGain = null, windFilter = null;
function enableAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const ch = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      ch[i] = last * 3.0;
    }
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    windFilter = actx.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 480;
    windFilter.Q.value = 0.55;
    windGain = actx.createGain();
    windGain.gain.value = 0;
    src.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(actx.destination);
    src.start();
    hintEl.style.display = 'none';
  } catch (e) { /* audio unavailable */ }
}
addEventListener('pointerdown', enableAudio);
addEventListener('keydown', enableAudio);

// ---------- ride loop ----------
const clock = new THREE.Clock();
let d = 0, v = 4.5, prevU = 0, laps = 0, lapStart = 0, lastLap = 0, frame = 0;

const _p = new THREE.Vector3(), _t = new THREE.Vector3(), _n = new THREE.Vector3(),
      _r = new THREE.Vector3(), _bk = new THREE.Vector3();
const _m = new THREE.Matrix4(), _qy = new THREE.Quaternion(), _Y = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  frame++;

  const u = (((d / L) % 1) + 1) % 1;
  const f = u * N;
  const i0 = Math.floor(f) % N, i1 = (i0 + 1) % N, fr = f - Math.floor(f);
  _p.copy(pts[i0]).lerp(pts[i1], fr);

  // Pacing: speed from gravitational energy, capped to a crawl near the station.
  const y = _p.y;
  let target = Math.sqrt(Math.max(25, V_TOP * V_TOP + 2 * G * (hMax - y)));
  const dm = ((d % L) + L) % L;
  const dSeam = Math.min(dm, L - dm);
  const cap = 4.5 + 34 * THREE.MathUtils.smoothstep(dSeam, 6, 42);
  target = Math.min(Math.min(target, cap), 34);
  v += (target - v) * Math.min(1, 2.4 * dt);

  if (u < prevU && prevU - u > 0.5) {
    laps++;
    lastLap = time - lapStart;
    lapStart = time;
  }
  prevU = u;

  _t.copy(tans[i0]).lerp(tans[i1], fr).normalize();
  _n.copy(nors[i0]).lerp(nors[i1], fr);
  _n.addScaledVector(_t, -_n.dot(_t)).normalize();
  _r.crossVectors(_t, _n).normalize();
  let bank = banks[i0] + (banks[i1] - banks[i0]) * fr;
  bank += 0.012 * Math.sin(time * 0.9) + 0.008 * Math.sin(time * 1.7 + 1.3);
  _n.applyAxisAngle(_t, bank);
  _r.applyAxisAngle(_t, bank);

  const shake = Math.min(0.05, (v / 34) * (v / 34) * 0.06);
  camera.position.copy(_p).addScaledVector(_n, 1.5);
  camera.position.addScaledVector(_r, (Math.random() - 0.5) * shake);
  camera.position.addScaledVector(_n, (Math.random() - 0.5) * shake);
  _bk.copy(_t).negate();
  _m.makeBasis(_r, _n, _bk);
  camera.quaternion.setFromRotationMatrix(_m);
  _qy.setFromAxisAngle(_Y, -bank * 0.3);
  camera.quaternion.multiply(_qy);

  const targetFov = 66 + 15 * (v / 34);
  if (Math.abs(targetFov - camera.fov) > 0.02) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, 3.5 * dt);
    camera.updateProjectionMatrix();
  }

  d += v * dt;

  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 720) c.position.x = -720;
  }

  if (actx && windGain) {
    const w = Math.pow(Math.min(v / 34, 1), 1.4);
    windGain.gain.setTargetAtTime(w * 0.22, actx.currentTime, 0.08);
    windFilter.frequency.setTargetAtTime(260 + v * 26, actx.currentTime, 0.1);
  }

  if (frame % 8 === 0) {
    statsEl.innerHTML =
      'SPEED ' + String(Math.round(v * 3.6)).padStart(3, '0') + ' KM/H<br>' +
      'ALT &nbsp;' + String(Math.round(y)).padStart(3, ' ') + ' M<br>' +
      'LAP &nbsp;' + (laps + 1) + (lastLap ? ' &nbsp;LAST ' + lastLap.toFixed(1) + ' S' : '');
  }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

setTimeout(() => { titleEl.style.opacity = '0'; }, 4600);
animate();
</script>
</body>
