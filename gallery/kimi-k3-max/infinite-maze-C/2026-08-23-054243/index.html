<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Endless Labyrinth</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Georgia,'Times New Roman',serif;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;}
  .bar{position:fixed;left:0;right:0;height:3.2vh;background:#000;z-index:5;pointer-events:none;}
  .bar.top{top:0}.bar.bottom{bottom:0}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.58) 100%);}
  #grain{position:fixed;inset:-120px;pointer-events:none;z-index:4;opacity:.05;
    animation:grainShift 1.1s steps(4) infinite;}
  @keyframes grainShift{
    0%{transform:translate(0,0)}25%{transform:translate(-42px,28px)}
    50%{transform:translate(34px,-46px)}75%{transform:translate(-26px,-18px)}100%{transform:translate(0,0)}}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:6;pointer-events:none;color:#e9dec6;text-align:center;transition:opacity 2.6s ease;}
  #title h1{font-size:clamp(26px,5vw,62px);font-weight:400;letter-spacing:.45em;margin:0 0 .45em .45em;
    text-shadow:0 0 34px rgba(255,220,160,.4);}
  #title p{font-size:clamp(11px,1.4vw,16px);letter-spacing:.32em;margin:.25em 0 .25em .32em;opacity:.75;font-style:italic;}
  #title.fade{opacity:0;}
  #toast{position:fixed;top:9vh;left:50%;transform:translateX(-50%) translateY(-10px);z-index:6;color:#f2ebdb;
    font-size:clamp(14px,2vw,23px);letter-spacing:.38em;text-indent:.38em;opacity:0;white-space:nowrap;
    transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.85);}
  #toast.show{opacity:.94;transform:translateX(-50%) translateY(0);}
  #hint{position:fixed;bottom:5.4vh;left:50%;transform:translateX(-50%);z-index:6;color:#cbbf9f;font-size:12px;
    letter-spacing:.22em;opacity:.5;pointer-events:none;transition:opacity 2.5s ease;white-space:nowrap;}
  #hint.fade{opacity:.18;}
  #paused{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;color:#fff;
    letter-spacing:.55em;text-indent:.55em;font-size:15px;opacity:0;transition:opacity .5s;pointer-events:none;}
  #paused.show{opacity:.72;}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar top"></div><div class="bar bottom"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title">
  <h1>THE ENDLESS LABYRINTH</h1>
  <p>an infinite first-person expedition</p>
  <p>sit back &mdash; the maze drives itself</p>
</div>
<div id="toast"></div>
<div id="hint">drag to look &nbsp;&middot;&nbsp; wheel to change pace &nbsp;&middot;&nbsp; space to pause</div>
<div id="paused">PAUSED</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

/* ---------------- deterministic PRNG ---------------- */
let seed = (Math.random()*1e9)|0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(seed);
const rrange=(a,b)=>a+rand()*(b-a);
const rint=(a,b)=>Math.floor(rrange(a,b+1));

/* ---------------- maze constants ---------------- */
const CELL=4, CHUNK=10, WALL_T=0.4;
const DX=[0,0,1,-1], DZ=[-1,1,0,0], BIT=[1,4,2,8]; // N,S,E/W pairs (d^1 = opposite)

/* ---------------- districts ---------------- */
const DISTRICTS=[
 {name:'The Vestibule of Dawn', wall:0xbb9060, wallH:3.6, wallRough:.92, wallMetal:.04,
  floor:0x8a6a42, floorRough:.95, floorMetal:0, ceil:true, ceilC:0x2a1c10,
  bg:0x130a05, fogNear:14, fogFar:52, hemiSky:0xffd9a0, hemiGround:0x3a2412, hemiInt:.55,
  lantern:0xffb066, accent:0xff9a3c, accentY:.78, pColor:0xffcf90, pMode:'drift', stars:0,
  landmark:'obelisk', plazaChance:.45, torches:true, vines:false, rays:false},
 {name:'The Azure Cistern', wall:0x2a5588, wallH:4.4, wallRough:.8, wallMetal:.15,
  floor:0x1a5570, floorRough:.18, floorMetal:.65, ceil:true, ceilC:0x0a1826,
  bg:0x030c18, fogNear:12, fogFar:48, hemiSky:0x9fd0ff, hemiGround:0x0a2036, hemiInt:.5,
  lantern:0x66c0ff, accent:0x54d8ff, accentY:.9, pColor:0x9fe6ff, pMode:'drift', stars:0,
  landmark:'orbs', plazaChance:.4, torches:false, vines:false, rays:false},
 {name:'The Neon Grid', wall:0x151628, wallH:5.0, wallRough:.5, wallMetal:.6,
  floor:0x141428, floorRough:.35, floorMetal:.5, ceil:false, ceilC:0x000000,
  bg:0x070312, fogNear:16, fogFar:60, hemiSky:0x8a6cff, hemiGround:0x120a2a, hemiInt:.45,
  lantern:0xb44dff, accent:0xff2fd6, accentY:.92, pColor:0xc07bff, pMode:'drift', stars:.85,
  landmark:'monolith', plazaChance:.4, torches:false, vines:false, rays:false},
 {name:'The Overgrown Ruins', wall:0x557a4e, wallH:3.2, wallRough:1, wallMetal:0,
  floor:0x476b3a, floorRough:1, floorMetal:0, ceil:false, ceilC:0,
  bg:0x0a140c, fogNear:14, fogFar:55, hemiSky:0xd8ffb0, hemiGround:0x1a2c14, hemiInt:.6,
  lantern:0xa8e070, accent:0x9fe870, accentY:0, pColor:0xc0ff90, pMode:'firefly', stars:.5,
  landmark:'tree', plazaChance:.5, torches:false, vines:true, rays:true},
 {name:'The Obsidian Depths', wall:0x1a1a22, wallH:4.6, wallRough:.25, wallMetal:.85,
  floor:0x16161e, floorRough:.22, floorMetal:.8, ceil:true, ceilC:0x050507,
  bg:0x0a0304, fogNear:12, fogFar:46, hemiSky:0xff6a50, hemiGround:0x1a0505, hemiInt:.4,
  lantern:0xff5030, accent:0xff2a1a, accentY:.55, pColor:0xff8a50, pMode:'rise', stars:0,
  landmark:'idol', plazaChance:.4, torches:true, vines:false, rays:false},
 {name:'The Pearl Sanctum', wall:0xcfc8b6, wallH:4.0, wallRough:.7, wallMetal:.08,
  floor:0xb0a890, floorRough:.6, floorMetal:.1, ceil:false, ceilC:0,
  bg:0x454f63, fogNear:18, fogFar:70, hemiSky:0xffffff, hemiGround:0x8a8578, hemiInt:.7,
  lantern:0xfff2dd, accent:0x9adfff, accentY:.85, pColor:0xffffff, pMode:'drift', stars:.35,
  landmark:'crystal', plazaChance:.5, torches:false, vines:false, rays:true},
];

/* ---------------- renderer / scene ---------------- */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.08,600);
camera.rotation.order='YXZ';

const amb={
  bg:new THREE.Color(DISTRICTS[0].bg), fogNear:DISTRICTS[0].fogNear, fogFar:DISTRICTS[0].fogFar,
  hemiSky:new THREE.Color(DISTRICTS[0].hemiSky), hemiGround:new THREE.Color(DISTRICTS[0].hemiGround),
  hemiInt:DISTRICTS[0].hemiInt, lantern:new THREE.Color(DISTRICTS[0].lantern),
  pColor:new THREE.Color(DISTRICTS[0].pColor), stars:0,
};
scene.background=amb.bg;
scene.fog=new THREE.Fog(amb.bg.getHex(),amb.fogNear,amb.fogFar);

const hemi=new THREE.HemisphereLight(DISTRICTS[0].hemiSky,DISTRICTS[0].hemiGround,DISTRICTS[0].hemiInt);
scene.add(hemi);
const dirLight=new THREE.DirectionalLight(0xffffff,0.22);
dirLight.position.set(30,60,10); scene.add(dirLight);
const lantern=new THREE.PointLight(DISTRICTS[0].lantern,36,30,1.9); scene.add(lantern);
const markLight=new THREE.PointLight(0xffffff,0,32,1.8); scene.add(markLight);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.5,0.55,0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const fxaa=new ShaderPass(FXAAShader);
composer.addPass(fxaa);
function setFxaaRes(){const pr=renderer.getPixelRatio();
  fxaa.material.uniforms.resolution.value.set(1/(innerWidth*pr),1/(innerHeight*pr));}
setFxaaRes();

/* ---------------- shared geometry / materials ---------------- */
const boxGeo=new THREE.BoxGeometry(1,1,1);
const floorGeo=new THREE.PlaneGeometry(CHUNK*CELL,CHUNK*CELL);
const torchStickGeo=new THREE.CylinderGeometry(0.03,0.05,0.42,6);
const torchFlameGeo=new THREE.SphereGeometry(0.09,8,8);
const vineGeo=new THREE.PlaneGeometry(0.7,1);
const rayGeo=new THREE.ConeGeometry(2.4,9,16,1,true);
const SHARED=new Set([boxGeo,floorGeo,torchStickGeo,torchFlameGeo,vineGeo,rayGeo]);

const floorTex=(()=>{ 
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#8f8f8f'; g.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){const v=120+Math.random()*50|0;
    g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect(Math.random()*256,Math.random()*256,2,2);}
  g.strokeStyle='rgba(42,42,42,0.5)'; g.lineWidth=2;
  for(let i=0;i<=10;i++){g.beginPath();g.moveTo(i*25.6,0);g.lineTo(i*25.6,256);g.stroke();
    g.beginPath();g.moveTo(0,i*25.6);g.lineTo(256,i*25.6);g.stroke();}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(CHUNK,CHUNK); return t;
})();

const vineMat=new THREE.MeshStandardMaterial({color:0x2f5527,roughness:1,side:THREE.DoubleSide});
const torchStickMat=new THREE.MeshStandardMaterial({color:0x2a1c12,roughness:.9});

function districtMats(d){
  if(d._mats) return d._mats;
  const m={
    wall:new THREE.MeshStandardMaterial({color:0xffffff,roughness:d.wallRough,metalness:d.wallMetal}),
    floor:new THREE.MeshStandardMaterial({color:d.floor,map:floorTex,roughness:d.floorRough,metalness:d.floorMetal}),
    ceil:new THREE.MeshStandardMaterial({color:d.ceilC,roughness:1,metalness:0}),
    accent:d.accentY>0?new THREE.MeshBasicMaterial({color:new THREE.Color(d.accent).multiplyScalar(1.9)}):null,
    flame:new THREE.MeshBasicMaterial({color:new THREE.Color(d.accent||0xff9a3c).multiplyScalar(2.1)}),
    ray:new THREE.MeshBasicMaterial({color:new THREE.Color(d.hemiSky),transparent:true,opacity:0.05,
      side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}),
  };
  d._mats=m; return m;
}

/* ---------------- maze data ---------------- */
const chunks=new Map();
const LANDMARKS=new Map();
const ANIMS=new Set();
let currentDistrict=0;

const chunkOfCell=(gx,gz)=>chunks.get(Math.floor(gx/CHUNK)+','+Math.floor(gz/CHUNK));
function wallAt(gx,gz,d){
  const ch=chunkOfCell(gx,gz); if(!ch) return true;
  const lx=gx-ch.cx*CHUNK, lz=gz-ch.cz*CHUNK;
  return (ch.cells[lz*CHUNK+lx]&BIT[d])!==0;
}
const cellOf=(x,z)=>({x:Math.floor(x/CELL),z:Math.floor(z/CELL)});

function generateChunk(cx,cz){
  const key=cx+','+cz;
  let chunk=chunks.get(key);
  if(chunk) return chunk;
  const cells=new Uint8Array(CHUNK*CHUNK).fill(15);
  const vis=new Uint8Array(CHUNK*CHUNK);
  const stack=[[rint(0,CHUNK-1),rint(0,CHUNK-1)]];
  vis[stack[0][1]*CHUNK+stack[0][0]]=1;
  while(stack.length){
    const top=stack[stack.length-1];
    const order=[0,1,2,3];
    for(let i=3;i>0;i--){const j=rint(0,i);const t=order[i];order[i]=order[j];order[j]=t;}
    let moved=false;
    for(const d of order){
      const nx=top[0]+DX[d], nz=top[1]+DZ[d];
      if(nx<0||nz<0||nx>=CHUNK||nz>=CHUNK) continue;
      const ni=nz*CHUNK+nx;
      if(vis[ni]) continue;
      vis[ni]=1;
      cells[top[1]*CHUNK+top[0]]&=~BIT[d];
      cells[ni]&=~BIT[d^1];
      stack.push([nx,nz]); moved=true; break;
    }
    if(!moved) stack.pop();
  }
  chunk={cx,cz,cells,district:currentDistrict,group:null,plaza:null,
         pendingGates:[],gateKeys:new Set()};
  if(rand()<DISTRICTS[currentDistrict].plazaChance){
    const px=rint(2,CHUNK-5), pz=rint(2,CHUNK-5);
    for(let z=pz;z<pz+3;z++)for(let x=px;x<px+3;x++){
      if(x<px+2){cells[z*CHUNK+x]&=~BIT[2]; cells[z*CHUNK+x+1]&=~BIT[3];}
      if(z<pz+2){cells[z*CHUNK+x]&=~BIT[1]; cells[(z+1)*CHUNK+x]&=~BIT[0];}
    }
    chunk.plaza={x:px,z:pz,seen:false};
  }
  chunks.set(key,chunk);
  const nb=[[cx,cz-1],[cx,cz+1],[cx+1,cz],[cx-1,cz]];
  for(let i=0;i<4;i++){
    const n=chunks.get(nb[i][0]+','+nb[i][1]);
    if(!n) continue;
    punchBorder(chunk,n,i);
    rebuildGroup(n);
  }
  buildChunkGroup(chunk);
  return chunk;
}

function punchBorder(c,n,side){
  const count=rint(1,2);
  for(let k=0;k<count;k++){
    const a=rint(0,CHUNK-1);
    let g=null;
    if(side===0){ c.cells[a]&=~BIT[0]; n.cells[(CHUNK-1)*CHUNK+a]&=~BIT[1];
      g={x:(c.cx*CHUNK+a+0.5)*CELL, z:c.cz*CHUNK*CELL, axis:'x'};
    } else if(side===1){ c.cells[(CHUNK-1)*CHUNK+a]&=~BIT[1]; n.cells[a]&=~BIT[0];
      g={x:(c.cx*CHUNK+a+0.5)*CELL, z:(c.cz+1)*CHUNK*CELL, axis:'x'};
    } else if(side===2){ c.cells[a*CHUNK+CHUNK-1]&=~BIT[2]; n.cells[a*CHUNK]&=~BIT[3];
      g={x:(c.cx+1)*CHUNK*CELL, z:(c.cz*CHUNK+a+0.5)*CELL, axis:'z'};
    } else { c.cells[a*CHUNK]&=~BIT[3]; n.cells[a*CHUNK+CHUNK-1]&=~BIT[2];
      g={x:c.cx*CHUNK*CELL, z:(c.cz*CHUNK+a+0.5)*CELL, axis:'z'};
    }
    if(c.district!==n.district){
      const gk=g.axis+Math.round(g.axis==='x'?g.z:g.x);
      if(!c.gateKeys.has(gk)){ c.gateKeys.add(gk); c.pendingGates.push(g); }
    }
  }
}

/* ---------------- chunk meshes ---------------- */
function buildWalls(chunk){
  const d=DISTRICTS[chunk.district];
  const mats=districtMats(d);
  const items=[];
  const h=d.wallH;
  for(let lz=0;lz<CHUNK;lz++)for(let lx=0;lx<CHUNK;lx++){
    const c=chunk.cells[lz*CHUNK+lx];
    const x0=(chunk.cx*CHUNK+lx)*CELL, z0=(chunk.cz*CHUNK+lz)*CELL;
    if(c&BIT[0]) items.push({x:x0+CELL/2,z:z0,rotY:0,nx:0,nz:1});
    if(c&BIT[3]) items.push({x:x0,z:z0+CELL/2,rotY:Math.PI/2,nx:1,nz:0});
    if(lz===CHUNK-1&&(c&BIT[1])) items.push({x:x0+CELL/2,z:z0+CELL,rotY:0,nx:0,nz:-1});
    if(lx===CHUNK-1&&(c&BIT[2])) items.push({x:x0+CELL,z:z0+CELL/2,rotY:Math.PI/2,nx:-1,nz:0});
  }
  const wall=new THREE.InstancedMesh(boxGeo,mats.wall,items.length);
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(),
        s=new THREE.Vector3(), p=new THREE.Vector3(), col=new THREE.Color();
  items.forEach((it,i)=>{
    e.set(0,it.rotY,0); q.setFromEuler(e);
    s.set(CELL+WALL_T,h,WALL_T); p.set(it.x,h/2,it.z);
    m4.compose(p,q,s); wall.setMatrixAt(i,m4);
    col.setHex(d.wall).multiplyScalar(0.88+rand()*0.24); wall.setColorAt(i,col);
  });
  wall.instanceMatrix.needsUpdate=true;
  if(wall.instanceColor) wall.instanceColor.needsUpdate=true;
  let accent=null;
  if(d.accentY>0){
    accent=new THREE.InstancedMesh(boxGeo,mats.accent,items.length);
    items.forEach((it,i)=>{
      e.set(0,it.rotY,0); q.setFromEuler(e);
      s.set(CELL+WALL_T+0.08,0.1,WALL_T+0.08); p.set(it.x,h*d.accentY,it.z);
      m4.compose(p,q,s); accent.setMatrixAt(i,m4);
    });
    accent.instanceMatrix.needsUpdate=true;
  }
  return {wall,accent,items};
}

function buildGate(g,districtIdx){
  const d=DISTRICTS[districtIdx];
  const grp=new THREE.Group();
  const h=d.wallH+0.8;
  const mat=new THREE.MeshStandardMaterial({color:0x23232c,roughness:.6,metalness:.3});
  const trim=new THREE.MeshBasicMaterial({color:new THREE.Color(d.accent||0xffffff).multiplyScalar(1.7)});
  const pillarG=new THREE.BoxGeometry(0.55,h,0.55);
  const half=CELL/2+0.1;
  for(const sg of [-1,1]){
    const p=new THREE.Mesh(pillarG,mat);
    if(g.axis==='x') p.position.set(g.x+sg*half,h/2,g.z);
    else p.position.set(g.x,h/2,g.z+sg*half);
    grp.add(p);
  }
  const beam=new THREE.Mesh(
    new THREE.BoxGeometry(g.axis==='x'?CELL+1.4:0.7,0.6,g.axis==='x'?0.7:CELL+1.4),mat);
  beam.position.set(g.x,h+0.1,g.z); grp.add(beam);
  const strip=new THREE.Mesh(
    new THREE.BoxGeometry(g.axis==='x'?CELL+1.5:0.74,0.1,g.axis==='x'?0.74:CELL+1.5),trim);
  strip.position.set(g.x,h-0.28,g.z); grp.add(strip);
  return grp;
}

function buildLandmark(kind,d,chunk){
  const g=new THREE.Group();
  const glowMat=new THREE.MeshBasicMaterial({color:new THREE.Color(d.accent||0xffffff).multiplyScalar(2.0)});
  const stone=new THREE.MeshStandardMaterial({color:0x3a3a42,roughness:.7,metalness:.2});
  if(kind==='obelisk'){
    const base=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,2.2),stone); base.position.y=0.25; g.add(base);
    const shaft=new THREE.Mesh(new THREE.BoxGeometry(0.85,3.4,0.85),stone); shaft.position.y=2.2; g.add(shaft);
    const tip=new THREE.Mesh(new THREE.OctahedronGeometry(0.55),glowMat); tip.position.y=4.35; g.add(tip);
    ANIMS.add({chunk,obj:tip,fn:(o,t)=>{o.rotation.y=t*0.8; o.position.y=4.35+Math.sin(t*1.3)*0.12;}});
  } else if(kind==='orbs'){
    for(let i=0;i<5;i++){
      const orb=new THREE.Mesh(new THREE.SphereGeometry(0.28+0.1*Math.sin(i*2.1),16,16),glowMat);
      const a=i/5*Math.PI*2;
      orb.position.set(Math.cos(a)*1.7,1.2+i*0.55,Math.sin(a)*1.7); g.add(orb);
    }
    ANIMS.add({chunk,obj:g,fn:(o,t)=>{o.rotation.y=t*0.4;}});
  } else if(kind==='monolith'){
    const core=new THREE.Mesh(new THREE.BoxGeometry(1.2,4.4,0.6),
      new THREE.MeshStandardMaterial({color:0x05050c,roughness:.3,metalness:.8}));
    core.position.y=2.2; g.add(core);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(1.34,4.54,0.5),glowMat);
    frame.position.y=2.2; g.add(frame);
    ANIMS.add({chunk,obj:g,fn:(o,t)=>{o.rotation.y=Math.sin(t*0.3)*0.4;}});
  } else if(kind==='tree'){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.5,2.8,8),
      new THREE.MeshStandardMaterial({color:0x4a3620,roughness:1}));
    trunk.position.y=1.4; g.add(trunk);
    const fol=new THREE.MeshStandardMaterial({color:0x3f7a34,roughness:1});
    [[0,3.4,0,1.5],[0.9,2.9,0.4,1.0],[-0.8,3.0,-0.5,1.1]].forEach(s=>{
      const m=new THREE.Mesh(new THREE.SphereGeometry(s[3],10,10),fol);
      m.position.set(s[0],s[1],s[2]); g.add(m);});
    ANIMS.add({chunk,obj:g,fn:(o,t)=>{o.rotation.z=Math.sin(t*0.7)*0.02;}});
  } else if(kind==='idol'){
    const base=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.5,2.4),stone); base.position.y=0.25; g.add(base);
    const mid=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.3,1.3),stone);
    mid.position.y=1.15; mid.rotation.y=Math.PI/4; g.add(mid);
    const top=new THREE.Mesh(new THREE.OctahedronGeometry(0.72),glowMat); top.position.y=2.6; g.add(top);
    ANIMS.add({chunk,obj:top,fn:(o,t)=>{o.rotation.y=t*1.2; o.position.y=2.6+Math.sin(t*2)*0.15;}});
  } else {
    const c1=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,0),glowMat); c1.position.y=1.9; g.add(c1);
    const c2=new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,0),glowMat); c2.position.set(1.3,0.9,0.4); g.add(c2);
    const c3=c2.clone(); c3.position.set(-1.1,0.7,-0.6); g.add(c3);
    ANIMS.add({chunk,obj:c1,fn:(o,t)=>{o.rotation.y=t*0.5; o.rotation.x=Math.sin(t*0.4)*0.2;
      o.position.y=1.9+Math.sin(t*0.9)*0.18;}});
  }
  return g;
}

function decorate(chunk,group,items,d){
  if(!items.length) return;
  const mats=districtMats(d);
  const picks=[...items];
  for(let i=picks.length-1;i>0;i--){const j=rint(0,i);const t=picks[i];picks[i]=picks[j];picks[j]=t;}
  if(d.torches){
    const n=Math.min(6,picks.length);
    for(let i=0;i<n;i++){
      const it=picks[i];
      const t=new THREE.Group();
      const stick=new THREE.Mesh(torchStickGeo,torchStickMat); stick.position.y=-0.2; t.add(stick);
      const flame=new THREE.Mesh(torchFlameGeo,mats.flame); t.add(flame);
      t.position.set(it.x+it.nx*(WALL_T/2+0.14),2.1,it.z+it.nz*(WALL_T/2+0.14));
      group.add(t);
      ANIMS.add({chunk,obj:flame,fn:(o,tt)=>{
        const s=0.85+0.3*Math.sin(tt*11+o.id*1.7); o.scale.set(s,s*1.2,s);}});
    }
  }
  if(d.vines){
    const n=Math.min(10,picks.length);
    for(let i=0;i<n;i++){
      const it=picks[i];
      const len=rrange(1.0,2.3);
      const vm=new THREE.Mesh(vineGeo,vineMat);
      vm.scale.set(rrange(0.5,1.1),len,1);
      vm.position.set(it.x+it.nx*(WALL_T/2+0.06),d.wallH-len/2-0.05,it.z+it.nz*(WALL_T/2+0.06));
      vm.rotation.y=Math.atan2(it.nx,it.nz);
      group.add(vm);
    }
  }
}

function buildChunkGroup(chunk){
  const d=DISTRICTS[chunk.district];
  const mats=districtMats(d);
  const group=new THREE.Group();
  const cxw=(chunk.cx*CHUNK+CHUNK/2)*CELL, czw=(chunk.cz*CHUNK+CHUNK/2)*CELL;
  const floor=new THREE.Mesh(floorGeo,mats.floor);
  floor.rotation.x=-Math.PI/2; floor.position.set(cxw,0,czw); group.add(floor);
  if(d.ceil){
    const ce=new THREE.Mesh(floorGeo,mats.ceil);
    ce.rotation.x=Math.PI/2; ce.position.set(cxw,d.wallH,czw); group.add(ce);
  }
  const {wall,accent,items}=buildWalls(chunk);
  group.add(wall); if(accent) group.add(accent);
  decorate(chunk,group,items,d);
  for(const g of chunk.pendingGates) group.add(buildGate(g,chunk.district));
  if(chunk.plaza){
    const px=(chunk.cx*CHUNK+chunk.plaza.x+1.5)*CELL;
    const pz=(chunk.cz*CHUNK+chunk.plaza.z+1.5)*CELL;
    const lm=buildLandmark(d.landmark,d,chunk);
    lm.position.set(px,0,pz); group.add(lm);
    LANDMARKS.set(chunk.cx+','+chunk.cz,
      {pos:new THREE.Vector3(px,1.8,pz),color:new THREE.Color(d.accent||d.lantern)});
    if(d.rays){
      const cone=new THREE.Mesh(rayGeo,mats.ray);
      cone.position.set(px,d.wallH+3.2,pz); group.add(cone);
      ANIMS.add({chunk,obj:cone,fn:(o,t)=>{o.rotation.y=t*0.1;}});
    }
  }
  chunk.group=group;
  scene.add(group);
}

function disposeGroup(chunk){
  if(!chunk.group) return;
  scene.remove(chunk.group);
  chunk.group.traverse(o=>{
    if(o.isInstancedMesh) o.dispose();
    else if(o.isMesh&&o.geometry&&!SHARED.has(o.geometry)) o.geometry.dispose();
  });
  chunk.group=null;
  for(const a of [...ANIMS]) if(a.chunk===chunk) ANIMS.delete(a);
  LANDMARKS.delete(chunk.cx+','+chunk.cz);
}
function rebuildGroup(chunk){ if(!chunk.group) return; disposeGroup(chunk); buildChunkGroup(chunk); }

function ensureChunksAroundCell(gx,gz,r){
  const ccx=Math.floor(gx/CHUNK), ccz=Math.floor(gz/CHUNK);
  for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){
    const ch=generateChunk(ccx+dx,ccz+dz);
    if(!ch.group) buildChunkGroup(ch);
  }
}
function pruneChunks(cc){
  const ccx=Math.floor(cc.x/CHUNK), ccz=Math.floor(cc.z/CHUNK);
  for(const ch of chunks.values()){
    const dd=Math.max(Math.abs(ch.cx-ccx),Math.abs(ch.cz-ccz));
    if(dd>3&&ch.group) disposeGroup(ch);
  }
}

/* ---------------- pathfinding ---------------- */
function bfs(from,to){
  const key=(x,z)=>x+','+z;
  const prev=new Map([[key(from.x,from.z),null]]);
  const q=[from]; let qi=0;
  while(qi<q.length&&qi<40000){
    const c=q[qi++];
    if(c.x===to.x&&c.z===to.z){
      const out=[]; let cur=c;
      while(cur){out.push(cur); cur=prev.get(key(cur.x,cur.z));}
      out.reverse(); return out;
    }
    for(let d=0;d<4;d++){
      if(wallAt(c.x,c.z,d)) continue;
      const nx=c.x+DX[d], nz=c.z+DZ[d];
      if(!chunkOfCell(nx,nz)) continue;
      const k=key(nx,nz);
      if(prev.has(k)) continue;
      prev.set(k,{x:c.x,z:c.z});
      q.push({x:nx,z:nz});
    }
  }
  return null;
}
function bfsFarthest(from){
  const key=(x,z)=>x+','+z;
  const prev=new Map([[key(from.x,from.z),null]]);
  const q=[from]; let qi=0, far=from;
  while(qi<q.length&&qi<40000){
    const c=q[qi++]; far=c;
    for(let d=0;d<4;d++){
      if(wallAt(c.x,c.z,d)) continue;
      const nx=c.x+DX[d], nz=c.z+DZ[d];
      if(!chunkOfCell(nx,nz)) continue;
      const k=key(nx,nz);
      if(prev.has(k)) continue;
      prev.set(k,{x:c.x,z:c.z});
      q.push({x:nx,z:nz});
    }
  }
  const out=[]; let cur=far;
  while(cur){out.push(cur); cur=prev.get(key(cur.x,cur.z));}
  out.reverse(); return out;
}

/* ---------------- atmosphere: stars & dust ---------------- */
const starGeo=new THREE.BufferGeometry();
{

  for(let i=0;i<700;i++){
    const a=rand()*Math.PI*2, el=rrange(0.06,1.5), r=380;

const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({

const DUST_N=550;
const dustGeo=new THREE.BufferGeometry();
const dp=new Float32Array(DUST_N*3), dv=new Float32Array(DUST_N*3);
for(let i=0;i<DUST_N;i++){
  dp[i*3]=rrange(-35,35); dp[i*3+1]=rrange(0.2,7); dp[i*3+2]=rrange(-35,35);
  dv[i*3]=rrange(-0.12,0.12); dv[i*3+1]=rrange(-0.05,0.05); dv[i*3+2]=rrange(-0.12,0.12);
}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({

dust.frustumCulled=false;
scene.add(dust);

/* ---------------- navigation state ---------------- */
let path=[], wpIndex=0;
const carrotPos=new THREE.Vector3();
let theta=0, v=0, yaw=0, pitch=-0.02, roll=0, yawRate=0;
let speedMul=1, paused=false;
let yawOff=0, pitchOff=0, dragging=false;
let cellsSinceDistrict=0, districtLen=30+rint(0,14);
let lastToastDistrict=0, ambDistrict=0, revealT=0;
const baseSpeed=3.4, eyeH=1.62;
let bobPhase=0, ensureTimer=0;

const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _ahead=new THREE.Vector3();
const _c=new THREE.Color();

function lerpAngle(a,b,t){
  let d=(b-a)%(Math.PI*2);
  if(d>Math.PI)d-=Math.PI*2;
  if(d<-Math.PI)d+=Math.PI*2;
  return a+d*t;
}

function extendPath(){
  if(cellsSinceDistrict>districtLen){
    currentDistrict=(currentDistrict+1)%DISTRICTS.length;
    districtLen=26+rint(0,16);
    cellsSinceDistrict=0;
  }
  const cur=cellOf(carrotPos.x,carrotPos.z);
  ensureChunksAroundCell(cur.x,cur.z,2);
  let pts=null;
  for(let a=0;a<10&&!pts;a++){
    if(a>0) theta+=rrange(-0.9,0.9);
    const dist=22+rand()*10;
    const tx=cur.x+Math.round(-Math.sin(theta)*dist);
    const tz=cur.z+Math.round(-Math.cos(theta)*dist);
    ensureChunksAroundCell(tx,tz,2);
    pts=bfs(cur,{x:tx,z:tz});
    if(pts&&pts.length<6) pts=null;
  }
  if(!pts) pts=bfsFarthest(cur);
  theta+=rrange(-0.35,0.35);
  path=[carrotPos.clone()];
  for(let i=1;i<pts.length;i++)
    path.push(new THREE.Vector3((pts[i].x+0.5)*CELL,0,(pts[i].z+0.5)*CELL));
  wpIndex=0;
}

function advanceCarrot(dist){
  while(dist>0&&wpIndex<path.length-1){
    const t=path[wpIndex+1];
    const d=carrotPos.distanceTo(t);
    if(d<=dist){
      carrotPos.copy(t); wpIndex++; dist-=d; cellsSinceDistrict++;
      checkPlazaReveal(cellOf(carrotPos.x,carrotPos.z));
    } else { carrotPos.lerp(t,dist/d); dist=0; }
  }
}

function pointAhead(dist){
  _ahead.copy(carrotPos);
  let i=wpIndex;
  while(dist>0&&i<path.length-1){
    const t=path[i+1];
    const d=_ahead.distanceTo(t);
    if(d<=dist){_ahead.copy(t); i++; dist-=d;}
    else {_ahead.lerp(t,dist/d); dist=0;}
  }
  return _ahead;
}

function upcomingTurnFactor(){
  if(path.length<3||wpIndex+2>=path.length) return 0;
  const a=_v1.copy(path[wpIndex+1]).sub(path[wpIndex]).normalize();
  const b=_v2.copy(path[wpIndex+2]).sub(path[wpIndex+1]).normalize();
  const ang=a.angleTo(b);
  const distTo=carrotPos.distanceTo(path[wpIndex+1]);
  const prox=THREE.MathUtils.clamp(1-distTo/(CELL*1.7),0,1);
  return Math.min(1,ang/(Math.PI*0.5))*prox;
}

function straightRun(){
  let run=0, px=0, pz=0;
  for(let i=wpIndex;i<Math.min(wpIndex+7,path.length-1);i++){
    const ax=Math.round(path[i+1].x-path[i].x), az=Math.round(path[i+1].z-path[i].z);
    if(i===wpIndex){px=ax;pz=az;run=1;continue;}
    if(ax===px&&az===pz) run++; else break;
  }
  return run;
}

function checkPlazaReveal(cell){
  const ch=chunkOfCell(cell.x,cell.z);
  if(!ch||!ch.plaza||ch.plaza.seen) return;
  const lx=cell.x-ch.cx*CHUNK, lz=cell.z-ch.cz*CHUNK;
  if(lx>=ch.plaza.x&&lx<ch.plaza.x+3&&lz>=ch.plaza.z&&lz<ch.plaza.z+3){
    ch.plaza.seen=true; revealT=2.4;
  }
}

/* ---------------- UI ---------------- */
const toastEl=document.getElementById('toast');
const titleEl=document.getElementById('title');
const hintEl=document.getElementById('hint');
const pausedEl=document.getElementById('paused');
let toastTimer=null;
function showToast(txt){
  toastEl.textContent=txt;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),3400);
}
{
  const gc=document.createElement('canvas'); gc.width=gc.height=128;
  const gg=gc.getContext('2d');

  for(let i=0;i<id.data.length;i+=4){

/* ---------------- optional input ---------------- */
let px=0, py=0;
addEventListener('pointerdown',e=>{dragging=true; px=e.clientX; py=e.clientY;});
addEventListener('pointermove',e=>{
  if(!dragging) return;
  yawOff-=(e.clientX-px)*0.0028;
  pitchOff-=(e.clientY-py)*0.0022;
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointercancel',()=>dragging=false);
addEventListener('wheel',e=>{
  speedMul=THREE.MathUtils.clamp(speedMul*(e.deltaY>0?0.9:1.12),0.4,2.2);
},{passive:true});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused; pausedEl.classList.toggle('show',paused); e.preventDefault();}
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  setFxaaRes();
});

/* ---------------- per-frame updates ---------------- */
function updateAmbiance(dt){
  const cc=cellOf(camera.position.x,camera.position.z);
  const ch=chunkOfCell(cc.x,cc.z);
  const dd=ch?ch.district:ambDistrict;
  if(dd!==lastToastDistrict){ showToast(DISTRICTS[dd].name); lastToastDistrict=dd; }
  ambDistrict=dd;
  const d=DISTRICTS[dd];
  const k=Math.min(1,0.85*dt);
  amb.bg.lerp(_c.setHex(d.bg),k);
  amb.fogNear+=(d.fogNear-amb.fogNear)*k;
  amb.fogFar+=(d.fogFar-amb.fogFar)*k;
  amb.hemiSky.lerp(_c.setHex(d.hemiSky),k);
  amb.hemiGround.lerp(_c.setHex(d.hemiGround),k);
  amb.hemiInt+=(d.hemiInt-amb.hemiInt)*k;
  amb.lantern.lerp(_c.setHex(d.lantern),k);
  amb.pColor.lerp(_c.setHex(d.pColor),k);
  amb.stars+=(d.stars-amb.stars)*k;
  scene.fog.color.copy(amb.bg);
  scene.fog.near=amb.fogNear; scene.fog.far=amb.fogFar;
  hemi.color.copy(amb.hemiSky); hemi.groundColor.copy(amb.hemiGround);
  hemi.intensity=amb.hemiInt;
  lantern.color.copy(amb.lantern);
  dust.material.color.copy(amb.pColor);
  stars.material.opacity=amb.stars;
}

function updateMarkLight(dt){
  let best=null, bd=Infinity;
  for(const lm of LANDMARKS.values()){
    const d2=lm.pos.distanceToSquared(camera.position);
    if(d2<bd){bd=d2; best=lm;}
  }
  const dist=Math.sqrt(bd);
  let ti=0;
  if(best&&dist<36){
    ti=60*(1-dist/36);
    markLight.color.lerp(best.color,Math.min(1,3*dt));
    markLight.position.lerp(best.pos,Math.min(1,3*dt));
  }
  if(revealT>0&&best) ti*=1.6;
  markLight.intensity+=(ti-markLight.intensity)*Math.min(1,3*dt);
}

function updateDust(dt,t){
  const mode=DISTRICTS[ambDistrict].pMode;
  const p=dustGeo.attributes.position.array;
  const cx=camera.position.x, cz=camera.position.z;
  const drift=mode==='firefly'?2.2:1;
  for(let i=0;i<DUST_N;i++){
    const j=i*3;
    const vy=mode==='rise'?(0.5+0.3*Math.sin(i)):dv[j+1];
    p[j]+=dv[j]*dt*drift;
    p[j+1]+=vy*dt;
    p[j+2]+=dv[j+2]*dt*drift;
    if(p[j]<cx-35)p[j]+=70; else if(p[j]>cx+35)p[j]-=70;
    if(p[j+2]<cz-35)p[j+2]+=70; else if(p[j+2]>cz+35)p[j+2]-=70;
    if(p[j+1]>7.5)p[j+1]=0.2; else if(p[j+1]<0.1)p[j+1]=7.4;
  }
  dustGeo.attributes.position.needsUpdate=true;
  dust.material.opacity=mode==='firefly'?0.3+0.28*Math.sin(t*2.6):0.5;
}

/* ---------------- main loop ---------------- */
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  ensureTimer-=dt;
  if(ensureTimer<=0){
    ensureTimer=1.2;
    const cc=cellOf(camera.position.x,camera.position.z);
    ensureChunksAroundCell(cc.x,cc.z,2);
    pruneChunks(cc);
  }

  if(wpIndex>=path.length-4) extendPath();

  const turnF=upcomingTurnFactor();
  let target=paused?0:baseSpeed*speedMul*(1-0.62*Math.min(1,turnF));
  if(!paused&&straightRun()>=5) target*=1.32;
  if(revealT>0){ target*=0.72; revealT-=dt; }
  v+=(target-v)*Math.min(1,2.6*dt);

  advanceCarrot(v*dt);

  bobPhase+=dt*(3.2+v*1.35);
  const bobA=0.05*Math.min(1,v/baseSpeed);
  const targetY=eyeH+Math.sin(bobPhase)*bobA;
  const kp=Math.min(1,8.5*dt);
  camera.position.x+=(carrotPos.x-camera.position.x)*kp;
  camera.position.z+=(carrotPos.z-camera.position.z)*kp;
  camera.position.y+=(targetY-camera.position.y)*Math.min(1,6*dt);

  const ahead=pointAhead(CELL*1.15);
  const dx=ahead.x-camera.position.x, dz=ahead.z-camera.position.z;
  const targetYaw=(dx*dx+dz*dz>1e-6)?Math.atan2(-dx,-dz):yaw;
  const ny=lerpAngle(yaw,targetYaw,Math.min(1,4.2*dt));
  const instRate=(ny-yaw)/Math.max(dt,1e-4);
  yawRate+=(instRate-yawRate)*Math.min(1,5*dt);
  yaw=ny;
  const targetRoll=THREE.MathUtils.clamp(-yawRate*0.16,-0.14,0.14)+Math.cos(bobPhase*0.5)*0.006;
  roll+=(targetRoll-roll)*Math.min(1,5*dt);
  const targetPitch=-0.025+Math.sin(t*0.5)*0.008-v*0.004;
  pitch+=(targetPitch-pitch)*Math.min(1,3*dt);
  if(!dragging){ const dec=Math.exp(-1.1*dt); yawOff*=dec; pitchOff*=dec; }
  pitchOff=THREE.MathUtils.clamp(pitchOff,-0.5,0.5);
  camera.rotation.set(pitch+pitchOff,yaw+yawOff,roll);

  const fovT=66+v*2.1+(revealT>0?5:0);
  camera.fov+=(fovT-camera.fov)*Math.min(1,2*dt);
  camera.updateProjectionMatrix();

  updateAmbiance(dt);
  lantern.position.set(
    camera.position.x-Math.sin(yaw)*1.2,
    camera.position.y+0.35,
    camera.position.z-Math.cos(yaw)*1.2);
  updateMarkLight(dt);
  updateDust(dt,t);
  for(const a of ANIMS) a.fn(a.obj,t);
  stars.position.set(camera.position.x,0,camera.position.z);

  composer.render();
}

/* ---------------- boot ---------------- */
ensureChunksAroundCell(0,0,2);
carrotPos.set(CELL*0.5,0,CELL*0.5);
extendPath();
camera.position.set(carrotPos.x,eyeH,carrotPos.z);
setTimeout(()=>titleEl.classList.add('fade'),5200);
setTimeout(()=>hintEl.classList.add('fade'),15000);
setTimeout(()=>showToast(DISTRICTS[0].name),6200);
tick();
</script>
