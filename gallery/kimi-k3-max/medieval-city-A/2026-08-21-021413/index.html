<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Medieval City — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; }
  #app { position: fixed; inset: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(8, 6, 4, .42) 100%); }
  #hud { position: fixed; top: 16px; left: 18px; z-index: 10; color: #ecdfc2;
    font-family: Georgia, 'Times New Roman', serif; text-shadow: 0 1px 4px rgba(0, 0, 0, .8); pointer-events: none; }
  #hud h1 { margin: 0; font-size: 20px; letter-spacing: .18em; font-weight: 400; text-transform: uppercase; }
  #hud .sub { font-size: 11px; letter-spacing: .22em; opacity: .65; text-transform: uppercase; margin-top: 2px; }
  #clock { margin-top: 10px; font-size: 15px; letter-spacing: .08em; color: #f4e9cd; }
  #panel { position: fixed; top: 16px; right: 16px; z-index: 10; display: flex; gap: 8px; }
  #panel button { font-family: Georgia, serif; font-size: 12px; letter-spacing: .06em; color: #ecdfc2;
    background: rgba(20, 16, 10, .55); border: 1px solid rgba(236, 223, 194, .35); border-radius: 3px;
    padding: 6px 10px; cursor: pointer; }
  #panel button:hover { background: rgba(60, 48, 28, .7); }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-family: Georgia, serif; font-size: 11px; letter-spacing: .12em; color: rgba(236, 223, 194, .55);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8); pointer-events: none; white-space: nowrap; }
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ecdfc2; font-family: Georgia, serif; background: #14101a; z-index: 20; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="hud">
  <h1>Medieval City</h1>
  <div class="sub">procedural &middot; living &middot; three.js</div>
  <div id="clock">--:--</div>
</div>
<div id="panel">
  <button id="btnPause" type="button">Pause time</button>
  <button id="btnSpeed" type="button">Speed 1&times;</button>
  <button id="btnRotate" type="button">Auto-orbit on</button>
</div>
<div id="hint">drag to orbit &middot; scroll to zoom &middot; append ?seed=42 for another city</div>
<div id="fallback"><div>WebGL is not available in this browser.</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const SEED = ((parseInt(params.get('seed') ?? '1337', 10) >>> 0) || 1337);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fb2e5);
scene.fog = new THREE.Fog(0x7fb2e5, 140, 520);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1600);
camera.position.set(96, 74, 128);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 18;
controls.maxDistance = 340;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// ---------- procedural canvas textures ----------
function makeCanvas(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  return c;
}
function texFromCanvas(c, rx = 1, ry = rx) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const stoneCanvas = makeCanvas(256, (g, s) => {
  g.fillStyle = '#8d887b'; g.fillRect(0, 0, s, s);
  const bh = 32;
  for (let y = 0; y < s / bh; y++) {
    const off = (y % 2) * 42;
    for (let x = -1; x < 4; x++) {
      const v = ri(-13, 13);
      g.fillStyle = `rgb(${141 + v},${136 + v},${123 + v})`;
      g.fillRect(x * 84 + off + 2, y * bh + 2, 80, bh - 4);
    }
  }
  g.strokeStyle = 'rgba(58,54,46,.5)'; g.lineWidth = 3;
  for (let y = 0; y <= s; y += bh) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); }
});

const timberCanvas = makeCanvas(256, (g, s) => {
  g.fillStyle = '#e6dbc4'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 300; i++) {
    g.fillStyle = `rgba(120,100,70,${rr(0.02, 0.07)})`;
    g.fillRect(rr(0, s), rr(0, s), rr(1, 3), rr(1, 3));
  }
  g.fillStyle = '#4c3826';
  const beam = (x, y, w, h) => g.fillRect(x, y, w, h);
  beam(0, 0, s, 14); beam(0, s - 14, s, 14); beam(0, 0, 14, s); beam(s - 14, 0, 14, s);
  beam(s / 2 - 7, 0, 14, s); beam(0, s / 2 - 7, s, 14);
  const diag = (cx, cy, rot) => { g.save(); g.translate(cx, cy); g.rotate(rot); beam(-62, -7, 124, 14); g.restore(); };
  diag(s / 4, s / 4, 0.6); diag(s * 3 / 4, s / 4, -0.6);
  diag(s / 4, s * 3 / 4, -0.6); diag(s * 3 / 4, s * 3 / 4, 0.6);
});

const cobbleCanvas = makeCanvas(256, (g, s) => {
  g.fillStyle = '#5f5b54'; g.fillRect(0, 0, s, s);
  const step = 32;
  for (let y = 0; y < s / step; y++) {
    for (let x = 0; x < s / step; x++) {
      const v = ri(-12, 18);
      g.fillStyle = `rgb(${122 + v},${118 + v},${110 + v})`;
      g.beginPath();
      g.ellipse(x * step + step / 2 + rr(-2, 2), y * step + step / 2 + rr(-2, 2), step / 2 - 3, step / 2 - 4, rr(0, 3), 0, TAU);
      g.fill();
    }
  }
});

const dirtCanvas = makeCanvas(256, (g, s) => {
  g.fillStyle = '#8a6f4d'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 420; i++) {
    g.fillStyle = `rgba(${ri(70, 120)},${ri(55, 90)},${ri(35, 60)},${rr(0.15, 0.4)})`;
    g.beginPath(); g.arc(rr(0, s), rr(0, s), rr(1, 5), 0, TAU); g.fill();
  }
});

function stripeCanvas(c1, c2) {
  return makeCanvas(128, (g, s) => {
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? c1 : c2; g.fillRect(i * s / 8, 0, s / 8, s); }
  });
}

const softCanvas = makeCanvas(128, (g, s) => {
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
});

const flameCanvas = makeCanvas(64, (g, s) => {
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(255,240,190,1)');
  grad.addColorStop(0.35, 'rgba(255,170,70,.85)');
  grad.addColorStop(0.7, 'rgba(220,90,30,.35)');
  grad.addColorStop(1, 'rgba(180,60,20,0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
});

const stoneTex = texFromCanvas(stoneCanvas, 2, 2);
const stoneBigTex = texFromCanvas(stoneCanvas, 6, 4);
const timberTex = texFromCanvas(timberCanvas, 1, 1);
const cobbleTexA = texFromCanvas(cobbleCanvas, 8, 8);
const cobbleTexB = texFromCanvas(cobbleCanvas, 1, 12);
const dirtTex = texFromCanvas(dirtCanvas, 1, 5);
const awnTexA = texFromCanvas(stripeCanvas('#b03a2e', '#e8ddc0'));
const awnTexB = texFromCanvas(stripeCanvas('#2e5a8a', '#e8ddc0'));
const softTex = texFromCanvas(softCanvas);
softTex.wrapS = softTex.wrapT = THREE.ClampToEdgeWrapping;
const flameTex = texFromCanvas(flameCanvas);
flameTex.wrapS = flameTex.wrapT = THREE.ClampToEdgeWrapping;

// ---------- materials ----------
const M = {
  stone: new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.95 }),
  stoneBig: new THREE.MeshStandardMaterial({ map: stoneBigTex, roughness: 0.95 }),
  stoneDark: new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x8a857a, roughness: 0.95 }),
  gable: new THREE.MeshStandardMaterial({ color: 0xded2b6, roughness: 0.9 }),
  plaster: [0xf5ead2, 0xecd9b8, 0xe2cba6, 0xf0e6da, 0xdcc9a8].map(c =>
    new THREE.MeshStandardMaterial({ map: timberTex, color: c, roughness: 0.9 })),
  roofs: [0x9e5038, 0x5d6673, 0xa8874e, 0x7d3f35].map(c =>
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 })),
  wood: new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.9 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x4a3320, roughness: 0.9 }),
  door: new THREE.MeshStandardMaterial({ color: 0x3d2a18, roughness: 0.9 }),
  window: new THREE.MeshBasicMaterial({ color: 0x2b3542 }),
  window2: new THREE.MeshBasicMaterial({ color: 0x2b3542 }),
  leaf: new THREE.MeshStandardMaterial({ color: 0x3f6b34, roughness: 0.9 }),
  leaf2: new THREE.MeshStandardMaterial({ color: 0x527a3a, roughness: 0.9 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95 }),
  water: new THREE.MeshStandardMaterial({ color: 0x3f7fbf, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.82 }),
  cobbleA: new THREE.MeshStandardMaterial({ map: cobbleTexA, roughness: 0.95 }),
  cobbleB: new THREE.MeshStandardMaterial({ map: cobbleTexB, roughness: 0.95 }),
  dirt: new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 }),
  rock: new THREE.MeshStandardMaterial({ color: 0x7d7a72, roughness: 1 }),
};
const roseMat = new THREE.MeshBasicMaterial({ color: 0x413252 });

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x55452e, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -130; sun.shadow.camera.right = 130;
sun.shadow.camera.top = 130; sun.shadow.camera.bottom = -130;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 520;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.5;
scene.add(sun);
scene.add(sun.target);

// ---------- sky ----------
const starN = 800;
const starPos = new Float32Array(starN * 3);
for (let i = 0; i < starN; i++) {
  const a = rand() * TAU, e = Math.acos(rr(0.03, 1)), R = 720;
  starPos[i * 3] = Math.cos(a) * Math.sin(e) * R;
  starPos[i * 3 + 1] = Math.cos(e) * R;
  starPos[i * 3 + 2] = Math.sin(a) * Math.sin(e) * R;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xcfd8ff, size: 1.7, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false });
const stars = new THREE.Points(starGeo, starMat);
stars.frustumCulled = false;
scene.add(stars);

const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xffe9b0, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false }));
sunSpr.scale.set(110, 110, 1);
scene.add(sunSpr);
const moonSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xdfe8ff, transparent: true, opacity: 0, depthWrite: false, fog: false }));
moonSpr.scale.set(46, 46, 1);
scene.add(moonSpr);

const clouds = [];
for (let i = 0; i < 9; i++) {
  const mat = new THREE.SpriteMaterial({ map: softTex, color: 0xffffff, transparent: true, opacity: 0.4, depthWrite: false });
  const spr = new THREE.Sprite(mat);
  spr.position.set(rr(-320, 320), rr(95, 150), rr(-320, 320));
  spr.scale.set(rr(50, 110), rr(16, 30), 1);
  scene.add(spr);
  clouds.push({ spr, mat, v: rr(1.2, 2.6) });
}

// ---------- terrain ----------
function groundH(x, z) {
  let h = Math.sin(x * 0.02) * Math.cos(z * 0.023) * 1.7
        + Math.sin(x * 0.047 + 1.7) * Math.cos(z * 0.05 + 0.6) * 0.8;
  const g = (cx, cz, r, amp) => amp * Math.exp(-(((x - cx) ** 2) + ((z - cz) ** 2)) / (2 * r * r));
  h += g(120, -85, 26, 8) + g(-130, 70, 32, 6) + g(30, 150, 36, 5) + g(-60, -150, 30, 5);
  return h * smooth(64, 95, Math.hypot(x, z));
}
{
  const gg = new THREE.PlaneGeometry(680, 680, 120, 120);
  gg.rotateX(-Math.PI / 2);
  const pos = gg.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cA = new THREE.Color(0x5d7a3c), cB = new THREE.Color(0x6f8a45);
  const cDust = new THREE.Color(0x7a6a42), cRoad = new THREE.Color(0x8a6f4d);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, groundH(x, z));
    const n = Math.sin(x * 0.11 + z * 0.13) * Math.sin(x * 0.031 - z * 0.07);
    tmp.copy(cA).lerp(cB, 0.5 + 0.5 * n);
    const d = Math.hypot(x, z);
    if (d < 72) tmp.lerp(cDust, smooth(72, 56, d) * 0.4);
    if (x > 58 && x < 185 && Math.abs(z) < 5.5) tmp.lerp(cRoad, smooth(5.5, 2, Math.abs(z)) * 0.75);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  gg.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  gg.computeVertexNormals();
  const ground = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  ground.receiveShadow = true;
  scene.add(ground);
}

// ---------- shared geometry ----------
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitPlane = new THREE.PlaneGeometry(1, 1);
const flatPlane = (w, l) => { const g = new THREE.PlaneGeometry(w, l); g.rotateX(-Math.PI / 2); return g; };

const roofCache = new Map();
function gableGeo(w, d, h) {
  const key = `${w.toFixed(1)}|${d.toFixed(1)}|${h.toFixed(1)}`;
  if (roofCache.has(key)) return roofCache.get(key);
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
  g.translate(0, 0, -d / 2);
  roofCache.set(key, g);
  return g;
}

// ---------- streets ----------
const streets = new THREE.Group();
scene.add(streets);
const CAT_PHI = -Math.PI / 2;    // cathedral sector (north, -z)
const KEEP_PHI = -Math.PI * 0.75; // keep sector (south-west)

function ringStreet(r, w, skips = []) {
  const SEG = 64;
  for (let k = 0; k < SEG; k++) {
    const p0 = k / SEG * TAU, p1 = (k + 1) / SEG * TAU, pm = (p0 + p1) / 2;
    if (skips.some(s => Math.abs(angDiff(pm, s.phi)) < s.half)) continue;
    const g = new THREE.RingGeometry(r - w / 2, r + w / 2, 5, 1, -p1, p1 - p0);
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, M.cobbleA);
    m.position.y = 0.04;
    m.receiveShadow = true;
    streets.add(m);
  }
}
ringStreet(20, 3.4, [{ phi: CAT_PHI, half: 0.5 }]);
ringStreet(36, 3.2);
ringStreet(52, 3.2, [{ phi: KEEP_PHI, half: 0.2 }]);

const radials = [0, 60, 120, 180, 240, 300].map(a => a * Math.PI / 180);
for (const phi of radials) {
  const m = new THREE.Mesh(flatPlane(3.2, 46), M.cobbleB);
  m.position.set(Math.cos(phi) * 38, 0.035, Math.sin(phi) * 38);
  m.rotation.y = Math.PI / 2 - phi;
  m.receiveShadow = true;
  streets.add(m);
}
{
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(16, 44), M.cobbleA);
  plaza.geometry.rotateX(-Math.PI / 2);
  plaza.position.y = 0.03;
  plaza.receiveShadow = true;
  streets.add(plaza);
}
for (let x = 66; x <= 170; x += 8) {
  const h1 = groundH(x - 4, 0), h2 = groundH(x + 4, 0);
  const m = new THREE.Mesh(flatPlane(8.8, 4.6), M.dirt);
  m.position.set(x, (h1 + h2) / 2 + 0.07, 0);
  m.rotation.z = Math.atan2(h1 - h2, 8.8);
  m.receiveShadow = true;
  streets.add(m);
}

// ---------- flags (created with buildings, animated later) ----------
const flags = [];
function addFlag(parent, x, y, z, color, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.045 * s, 0.045 * s, 2.4 * s, 6), M.woodDark);
  pole.position.y = 1.2 * s;
  g.add(pole);
  const geo = new THREE.PlaneGeometry(1.5 * s, 0.85 * s, 10, 5);
  geo.translate(0.75 * s, 0, 0);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.85 }));
  mesh.position.y = 2.0 * s;
  mesh.castShadow = true;
  g.add(mesh);
  parent.add(g);
  flags.push({ mesh, phase: rand() * TAU, s });
}

// ---------- city wall, towers, gate ----------
const WALL_R = 62, WALL_H = 6;
{
  const segCount = Math.floor(TAU * WALL_R / 4.6);
  const arcLen = TAU * WALL_R / segCount + 0.18;
  const wallMesh = new THREE.InstancedMesh(unitBox, M.stone, segCount);
  const crenelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 0.9, 0.5), M.stoneDark, segCount * 4);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const vp = new THREE.Vector3(), vs = new THREE.Vector3();
  let wi = 0, ci = 0;
  for (let k = 0; k < segCount; k++) {
    const phi = k / segCount * TAU;
    if (Math.abs(angDiff(phi, 0)) < 0.085) continue;
    const x = Math.cos(phi) * WALL_R, z = Math.sin(phi) * WALL_R;
    e.set(0, -phi - Math.PI / 2, 0); q.setFromEuler(e);
    vp.set(x, WALL_H / 2, z); vs.set(arcLen, WALL_H, 1.7);
    m4.compose(vp, q, vs);
    wallMesh.setMatrixAt(wi++, m4);
    const tx = -Math.sin(phi), tz = Math.cos(phi);
    for (let cI = 0; cI < 4; cI++) {
      const t = (cI - 1.5) * (arcLen / 4.4);
      vp.set(x + tx * t, WALL_H + 0.45, z + tz * t);
      vs.set(1, 1, 1);
      m4.compose(vp, q, vs);
      crenelMesh.setMatrixAt(ci++, m4);
    }
  }
  wallMesh.count = wi; crenelMesh.count = ci;
  wallMesh.instanceMatrix.needsUpdate = true;
  crenelMesh.instanceMatrix.needsUpdate = true;
  wallMesh.castShadow = wallMesh.receiveShadow = true;
  crenelMesh.castShadow = true;
  scene.add(wallMesh, crenelMesh);
}
const flagCols = [0x8a2a2a, 0x2a4a8a, 0xb08a2a];
[45, 90, 135, 180, 225, 270, 315].forEach((deg, i) => {
  const phi = deg * Math.PI / 180;
  const x = Math.cos(phi) * WALL_R, z = Math.sin(phi) * WALL_R;
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.7, 9.5, 10), M.stoneBig);
  tower.position.set(x, 4.75, z);
  tower.castShadow = tower.receiveShadow = true;
  scene.add(tower);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(4.1, 3.6, 10), M.roofs[1]);
  roof.position.set(x, 11.3, z);
  roof.castShadow = true;
  scene.add(roof);
  if (i % 2 === 0) addFlag(scene, x, 11.2, z, flagCols[i % 3], 1.1);

const smokeSpots = [];
function makeHouse(w, h, d) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(unitBox, pick(M.plaster));
  base.scale.set(w, h, d);
  base.position.y = h / 2;
  base.castShadow = base.receiveShadow = true;
  g.add(base);

  const roofH = rr(1.7, 2.7);
  const roof = new THREE.Mesh(gableGeo(w + 0.8, d + 0.8, roofH), [M.gable, pick(M.roofs)]);
  roof.position.y = h;
  roof.castShadow = roof.receiveShadow = true;
  g.add(roof);

  const doorX = rr(-w / 4, w / 4);
  const door = new THREE.Mesh(unitPlane, M.door);
  door.scale.set(0.95, 1.7, 1);
  door.position.set(doorX, 0.85, d / 2 + 0.03);
  g.add(door);

  const floors = h > 5.4 ? 2 : 1;
  const nw = Math.max(1, Math.round(w / 2.6));
  for (let f = 0; f < floors; f++) {
    for (let i = 0; i < nw; i++) {
      const wx = nw === 1 ? 0 : lerp(-w / 2 + 1.0, w / 2 - 1.0, i / (nw - 1));
      if (f === 0 && Math.abs(wx - doorX) < 0.9) continue;
      const win = new THREE.Mesh(unitPlane, rand() < 0.5 ? M.window : M.window2);
      win.scale.set(0.66, 0.85, 1);
      win.position.set(wx, 2.0 + f * 2.6, d / 2 + 0.03);
      g.add(win);
      const wb = win.clone();
      wb.position.z = -d / 2 - 0.03;
      wb.rotation.y = Math.PI;
      g.add(wb);
    }
  }

  if (rand() < 0.62) {
    const cx = rr(-w / 4, w / 4), cz = rr(-d / 5, d / 5);
    const ch = new THREE.Mesh(unitBox, M.stoneDark);
    ch.scale.set(0.55, 1.5, 0.55);
    ch.position.set(cx, h + roofH * 0.5, cz);
    ch.castShadow = true;
    g.add(ch);
    smokeSpots.push({ obj: g, local: new THREE.Vector3(cx, h + roofH * 0.5 + 0.85, cz) });
  }
  return g;
}

      if (v.r > 58) { v.r = 58; v.dir = -1; }
      if (v.r < 16) { v.r = 16; v.dir = 1; }
      v.g.position.set(Math.cos(v.lane) * v.r, 0, Math.sin(v.lane) * v.r);
      dx = Math.cos(v.lane) * v.dir; dz = Math.sin(v.lane) * v.dir;
    } else {
      const tx = v.tx - v.px, tz = v.tz - v.pz;
      const d = Math.hypot(tx, tz);
      if (d < 0.4) {
        const aa = rand() * TAU, dd = rr(2, 11);
        v.tx = Math.cos(aa) * dd; v.tz = Math.sin(aa) * dd;
      } else {
        v.px += (tx / d) * v.speed * 0.7 * dt;
        v.pz += (tz / d) * v.speed * 0.7 * dt;
        dx = tx / d; dz = tz / d;
      }
      v.g.position.set(v.px, 0, v.pz);
    }
    if (dx || dz) v.g.rotation.y = Math.atan2(dx, dz);
    v.g.position.y = Math.abs(Math.sin(t * 9 + v.phase)) * 0.055;
  }
}

// ---------- birds ----------
const birds = [];
{
  const birdMat = new THREE.MeshBasicMaterial({ color: 0x23232c, side: THREE.DoubleSide });
  const wingR = new THREE.PlaneGeometry(0.95, 0.34);
  wingR.translate(0.475, 0, 0); wingR.rotateX(-Math.PI / 2);
  const wingL = new THREE.PlaneGeometry(0.95, 0.34);
  wingL.translate(-0.475, 0, 0); wingL.rotateX(-Math.PI / 2);
  for (let i = 0; i < 14; i++) {
    const g = new THREE.Group();
    const wl = new THREE.Mesh(wingL, birdMat);
    const wr = new THREE.Mesh(wingR, birdMat);
    g.add(wl, wr);
    scene.add(g);
    birds.push({ g, wl, wr, r: rr(24, 58), h: rr(34, 56), a: rand() * TAU, sp: rr(0.12, 0.26), ph: rand() * TAU });
  }
}
function updateBirds(dt, t, dayF) {
  for (const b of birds) {
    b.g.visible = dayF > 0.08;
    if (!b.g.visible) continue;
    b.a += b.sp * dt;
    b.g.position.set(Math.cos(b.a) * b.r, b.h + Math.sin(t * 0.8 + b.ph) * 2.5, Math.sin(b.a) * b.r);
    b.g.rotation.y = -b.a;
    const flap = Math.sin(t * 11 + b.ph) * 0.5;
    b.wr.rotation.z = flap;
    b.wl.rotation.z = -flap;
  }
}

// ---------- chimney smoke ----------
scene.updateMatrixWorld(true);
const emitters = smokeSpots.map(s => s.obj.localToWorld(s.local.clone()));
const PER = 7;
const SN = emitters.length * PER;
const sPos = new Float32Array(SN * 3);
const sLife = new Float32Array(SN);
const sSize = new Float32Array(SN);
const sVel = new Float32Array(SN * 3);
function smokeReset(i, randomizeLife = false) {
  const e = emitters[(i / PER) | 0];
  sPos[i * 3] = e.x + rr(-0.15, 0.15);
  sPos[i * 3 + 1] = e.y;
  sPos[i * 3 + 2] = e.z + rr(-0.15, 0.15);
  sVel[i * 3] = rr(-0.12, 0.12);
  sVel[i * 3 + 1] = rr(1.0, 1.7);
  sVel[i * 3 + 2] = rr(-0.12, 0.12);
  sLife[i] = randomizeLife ? rand() : 0;
  sSize[i] = rr(1.2, 2.2);
}
for (let i = 0; i < SN; i++) smokeReset(i, true);
const smokeGeo = new THREE.BufferGeometry();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
smokeGeo.setAttribute('aLife', new THREE.BufferAttribute(sLife, 1));
smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
const smokeMat = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: softTex } },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute float aLife;
    attribute float aSize;
    varying float vLife;
    void main() {
      vLife = aLife;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (0.5 + aLife * 2.4) * (120.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vLife;
    void main() {
      float a = texture2D(uTex, gl_PointCoord).a;
      a *= (1.0 - vLife) * 0.5 * smoothstep(0.0, 0.12, vLife);
      gl_FragColor = vec4(vec3(0.58, 0.56, 0.55), a);
    }`
});
const smoke = new THREE.Points(smokeGeo, smokeMat);
smoke.frustumCulled = false;
scene.add(smoke);
function updateSmoke(dt) {
  for (let i = 0; i < SN; i++) {
    sLife[i] += dt / 5;
    if (sLife[i] >= 1) { smokeReset(i); continue; }
    sPos[i * 3] += (sVel[i * 3] + 0.45) * dt;
    sPos[i * 3 + 1] += sVel[i * 3 + 1] * dt;
    sPos[i * 3 + 2] += (sVel[i * 3 + 2] + 0.12) * dt;
  }
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.aLife.needsUpdate = true;
}

// ---------- per-frame updaters ----------
function updateFlags(t) {
  for (const f of flags) {
    const p = f.mesh.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i);
      p.setZ(i, Math.sin(x * (4 / f.s) - t * 7 + f.phase) * 0.13 * f.s * (x / (1.5 * f.s)));
    }
    p.needsUpdate = true;
    f.mesh.geometry.computeVertexNormals();
  }
}
function updateSpray(dt) {
  for (let i = 0; i < SPRAY; i++) {
    pVel[i * 3 + 1] -= 5.5 * dt;
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0.95) sprayReset(i);
  }
  sprayGeo.attributes.position.needsUpdate = true;
}
function updateRipples(dt) {
  for (const rp of ripples) {
    rp.t = (rp.t + dt * 0.5) % 1;
    const s = 0.4 + rp.t * 2.4;
    rp.m.scale.set(s, 1, s);
    rp.m.material.opacity = 0.5 * (1 - rp.t);
  }
}
function updateTrees(t) {
  for (const s of sway) s.fol.rotation.z = Math.sin(t * 1.1 + s.ph) * 0.035;
}

// ---------- day / night cycle ----------
const clockEl = document.getElementById('clock');
const skyDay = new THREE.Color(0x7fb2e5);
const skyNight = new THREE.Color(0x0a0e24);
const skyDusk = new THREE.Color(0xe88a5a);
const sunWarm = new THREE.Color(0xfff2d8);
const sunLow = new THREE.Color(0xff9a50);
const winDay = new THREE.Color(0x2b3542);
const winNight = new THREE.Color(0xffc06a);
const winNight2 = new THREE.Color(0xff9a4a);
const roseDay = new THREE.Color(0x413252);
const roseNight = new THREE.Color(0xc07aff);
const tmpSky = new THREE.Color();

let cycle = 0.30; // 0 = midnight, 0.25 = sunrise, 0.5 = noon, 0.75 = sunset
let dayCount = 1;
let paused = false;
let timeScale = 1;
const DAY_LEN = 160;
let elapsed = 0;

function updateDayNight(dt) {
  const prev = cycle;
  if (!paused) cycle = (cycle + dt * timeScale / DAY_LEN) % 1;
  if (cycle < prev) dayCount++;
  const a = (cycle * 2 - 0.5) * Math.PI;
  const sinA = Math.sin(a);
  sun.position.set(Math.cos(a) * 190, sinA * 170, 70);
  const dayF = smooth(-0.06, 0.22, sinA);
  const nightF = 1 - smooth(-0.18, 0.1, sinA);
  const duskF = clamp(1 - Math.abs(sinA) * 3.0, 0, 1);
  tmpSky.copy(skyNight).lerp(skyDay, dayF).lerp(skyDusk, duskF * 0.5 * (1 - nightF));
  scene.background.copy(tmpSky);
  scene.fog.color.copy(tmpSky);
  sun.intensity = 0.04 + 2.5 * dayF;
  sun.color.copy(sunWarm).lerp(sunLow, duskF);
  hemi.intensity = 0.16 + 0.85 * dayF;
  starMat.opacity = nightF * 0.85;
  sunSpr.position.copy(sun.position).normalize().multiplyScalar(680);
  sunSpr.material.opacity = dayF;
  moonSpr.position.set(-Math.cos(a) * 680, Math.max(-sinA, -0.2) * 620 + 40, -180);
  moonSpr.material.opacity = nightF * 0.9;
  M.window.color.copy(winDay).lerp(winNight, nightF);
  M.window2.color.copy(winDay).lerp(winNight2, nightF);
  roseMat.color.copy(roseDay).lerp(roseNight, nightF);
  for (const tc of torches) {
    const f = 0.75 + 0.25 * Math.sin(elapsed * 13 + tc.ph) * Math.sin(elapsed * 7.3 + tc.ph * 2);
    tc.light.intensity = nightF * 30 * f;
    tc.flame.material.opacity = nightF * (0.55 + 0.4 * f);
    const s = 0.7 + 0.25 * f;
    tc.flame.scale.set(0.8 * s, 1.15 * s, 1);
  }
  for (const c of clouds) c.mat.opacity = 0.4 * (0.2 + 0.8 * dayF);
  const hrs = cycle * 24;
  const hh = Math.floor(hrs), mm = Math.floor((hrs - hh) * 60);
  clockEl.textContent = `Day ${dayCount} — ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  return dayF;
}

// ---------- HUD controls ----------
document.getElementById('btnPause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume time' : 'Pause time';
});
const speeds = [1, 4, 12];
let speedIdx = 0;
document.getElementById('btnSpeed').addEventListener('click', (e) => {
  speedIdx = (speedIdx + 1) % speeds.length;
  timeScale = speeds[speedIdx];
  e.target.textContent = `Speed ${timeScale}\u00d7`;
});
document.getElementById('btnRotate').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.target.textContent = controls.autoRotate ? 'Auto-orbit on' : 'Auto-orbit off';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- main loop ----------
const clockT = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clockT.getDelta(), 0.05);
  elapsed += dt;
  const dayF = updateDayNight(dt);
  updateFlags(elapsed);
  updateSmoke(dt);
  updateSpray(dt);
  updateRipples(dt);
  updateVillagers(dt, elapsed, dayF);
  updateBirds(dt, elapsed, dayF);
  updateTrees(elapsed);
  windHub.rotation.z += dt * 0.8;
  M.water.opacity = 0.78 + 0.07 * Math.sin(elapsed * 2.1);
  for (const c of clouds) {
    c.spr.position.x += c.v * dt;
    if (c.spr.position.x > 380) c.spr.position.x = -380;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
