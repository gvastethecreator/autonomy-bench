<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Maze — Autonomous Drift</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #app { position: fixed; inset: 0; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.6) 100%);
  }
  .hud {
    position: fixed; left: 14px; top: 12px; pointer-events: none; user-select: none;
    font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #8fa3c8; letter-spacing: .12em; text-transform: uppercase;
    text-shadow: 0 1px 4px #000; opacity: .85;
  }
  .hud b { color: #d7e3ff; font-weight: 600; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div class="hud">
  <div><b>Infinite Maze</b> // autonomous drift</div>
  <div id="stats"></div>
</div>
<script type="module">
import * as THREE from 'three';

const CELL = 4;          // world units per maze cell
const CHUNK = 16;        // cells per chunk side
const WALL_H = 3.4;
const WALL_T = 0.4;
const SEED = 0x5EED1234 | 0;
const RADIUS = 0.35;     // camera collision radius
const SPEED = 3.4;
const TURN_RATE = 2.4;
const PROBE = 1.15;
const VIEW_R = 2;        // chunk render radius (Chebyshev)
const EYE = 1.62;

function hash3(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 974634211);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---- infinite maze: deterministic per-chunk generation ----
// v[i][z]: wall on vertical grid line i (west side of local cell x=i), i in 0..CHUNK
// h[x][j]: wall on horizontal grid line j (north side of local cell z=j), j in 0..CHUNK

function edgeOpenings(ax, az, salt) {
  const count = 1 + Math.floor(hash3(ax, az, salt) * 2);
  const out = new Set();
  let k = 0;
  while (out.size < count && k < 24) {
    out.add(Math.floor(hash3(ax, az, salt + 1 + k) * CHUNK));
    k++;
  }
  return out;
}

function buildChunkData(cx, cz) {
  const N = CHUNK;
  const v = [];
  const h = [];
  for (let i = 0; i <= N; i++) v.push(new Array(N).fill(true));
  for (let x = 0; x < N; x++) h.push(new Array(N + 1).fill(true));

  const seed = (Math.imul(cx, 0x8DA6B343) ^ Math.imul(cz, 0xD8163841) ^ SEED) | 0;
  const rng = mulberry32(seed);

  const visited = [];
  for (let x = 0; x < N; x++) visited.push(new Array(N).fill(false));
  const sx = Math.floor(rng() * N), sz = Math.floor(rng() * N);
  visited[sx][sz] = true;
  const stack = [[sx, sz]];
  while (stack.length) {
    const top = stack[stack.length - 1];
    const x = top[0], z = top[1];
    const opts = [];
    if (x > 0 && !visited[x - 1][z]) opts.push(0);
    if (x < N - 1 && !visited[x + 1][z]) opts.push(1);
    if (z > 0 && !visited[x][z - 1]) opts.push(2);
    if (z < N - 1 && !visited[x][z + 1]) opts.push(3);
    if (!opts.length) { stack.pop(); continue; }
    const d = opts[Math.floor(rng() * opts.length)];
    if (d === 0) { v[x][z] = false; visited[x - 1][z] = true; stack.push([x - 1, z]); }
    else if (d === 1) { v[x + 1][z] = false; visited[x + 1][z] = true; stack.push([x + 1, z]); }
    else if (d === 2) { h[x][z] = false; visited[x][z - 1] = true; stack.push([x, z - 1]); }
    else { h[x][z + 1] = false; visited[x][z + 1] = true; stack.push([x, z + 1]); }
  }

  // braid: knock out a few extra interior walls so the maze has loops
  for (let i = 1; i < N; i++) for (let z = 0; z < N; z++) if (rng() < 0.05) v[i][z] = false;
  for (let x = 0; x < N; x++) for (let j = 1; j < N; j++) if (rng() < 0.05) h[x][j] = false;

  // shared border doorways: both neighbors derive them from the same edge key
  for (const r of edgeOpenings(cx, cz, 100)) v[N][r] = false;      // east
  for (const r of edgeOpenings(cx - 1, cz, 100)) v[0][r] = false;  // west
  for (const c of edgeOpenings(cx, cz, 200)) h[c][N] = false;      // south
  for (const c of edgeOpenings(cx, cz - 1, 200)) h[c][0] = false;  // north

  return { v, h };
}

const dataCache = new Map();
function chunkData(cx, cz) {
  const key = cx + ',' + cz;
  let d = dataCache.get(key);
  if (!d) {
    d = buildChunkData(cx, cz);
    dataCache.set(key, d);
    if (dataCache.size > 2048) dataCache.delete(dataCache.keys().next().value);
  }
  return d;
}

function vWallAt(gxLine, gz) {
  const cx = Math.floor(gxLine / CHUNK), cz = Math.floor(gz / CHUNK);
  return chunkData(cx, cz).v[gxLine - cx * CHUNK][gz - cz * CHUNK];
}
function hWallAt(gx, gzLine) {
  const cx = Math.floor(gx / CHUNK), cz = Math.floor(gzLine / CHUNK);
  return chunkData(cx, cz).h[gx - cx * CHUNK][gzLine - cz * CHUNK];
}

function collides(px, pz) {
  const reach = RADIUS + WALL_T;
  const x0 = Math.floor((px - reach) / CELL), x1 = Math.floor((px + reach) / CELL);
  const z0 = Math.floor((pz - reach) / CELL), z1 = Math.floor((pz + reach) / CELL);
  const rr = RADIUS + WALL_T / 2;
  for (let gx = x0; gx <= x1; gx++) {
    for (let gz = z0; gz <= z1; gz++) {
      if (vWallAt(gx, gz)) {
        const dx = px - gx * CELL;
        const dz = pz - clamp(pz, gz * CELL, gz * CELL + CELL);
        if (dx * dx + dz * dz < rr * rr) return true;
      }
      if (vWallAt(gx + 1, gz)) {
        const dx = px - (gx + 1) * CELL;
        const dz = pz - clamp(pz, gz * CELL, gz * CELL + CELL);
        if (dx * dx + dz * dz < rr * rr) return true;
      }
      if (hWallAt(gx, gz)) {
        const dx = px - clamp(px, gx * CELL, gx * CELL + CELL);
        const dz = pz - gz * CELL;
        if (dx * dx + dz * dz < rr * rr) return true;
      }
      if (hWallAt(gx, gz + 1)) {
        const dx = px - clamp(px, gx * CELL, gx * CELL + CELL);
        const dz = pz - (gz + 1) * CELL;
        if (dx * dx + dz * dz < rr * rr) return true;
      }
    }
  }
  return false;
}

// ---- renderer / scene ----

const app = document.getElementById('app');
const statsEl = document.getElementById('stats');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05070d);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.052);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 140);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0x91a8e0, 0x14100c, 0.55));
const lamp = new THREE.PointLight(0xffd9a6, 30, 44, 1.7);
scene.add(lamp);

function makeFloorTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#0b0e16';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.05).toFixed(3) + ')';
    g.fillRect(Math.random() * 256, Math.random() * 256, 1, 1);
  }
  g.strokeStyle = 'rgba(120,150,210,0.10)';
  g.lineWidth = 1;
  for (let i = 0; i <= 256; i += 16) {
    g.beginPath(); g.moveTo(i + 0.5, 0); g.lineTo(i + 0.5, 256); g.stroke();
    g.beginPath(); g.moveTo(0, i + 0.5); g.lineTo(256, i + 0.5); g.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(CHUNK, CHUNK);
  tex.anisotropy = 4;
  return tex;
}

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0.08 });
const floorTex = makeFloorTexture();
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, color: 0x9fb2d8, roughness: 0.95 });
const ceilMat = new THREE.MeshStandardMaterial({ map: floorTex, color: 0x39415c, roughness: 0.95 });

const built = new Map();

function buildChunk(cx, cz) {
  const key = cx + ',' + cz;
  const data = chunkData(cx, cz);
  const group = new THREE.Group();
  const baseX = cx * CHUNK * CELL, baseZ = cz * CHUNK * CELL;

  let count = 0;
  for (let i = 0; i <= CHUNK; i++) for (let z = 0; z < CHUNK; z++) if (data.v[i][z]) count++;
  for (let x = 0; x < CHUNK; x++) for (let j = 0; j <= CHUNK; j++) if (data.h[x][j]) count++;

  const mesh = new THREE.InstancedMesh(unitBox, wallMat, count);
  mesh.frustumCulled = false;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const p = new THREE.Vector3(), s = new THREE.Vector3();
  const col = new THREE.Color();
  const hue = 0.55 + 0.22 * hash3(cx, cz, 7);
  let k = 0;

  for (let i = 0; i <= CHUNK; i++) {
    for (let z = 0; z < CHUNK; z++) {
      if (!data.v[i][z]) continue;
      p.set(baseX + i * CELL, WALL_H / 2, baseZ + z * CELL + CELL / 2);
      s.set(WALL_T, WALL_H, CELL + WALL_T);
      m.compose(p, q, s);
      mesh.setMatrixAt(k, m);
      col.setHSL(hue + 0.03 * (hash3(i, z, 9) - 0.5), 0.38, 0.30 + 0.14 * hash3(cx * 31 + i, cz * 31 + z, 5));
      mesh.setColorAt(k, col);
      k++;
    }
  }
  for (let x = 0; x < CHUNK; x++) {
    for (let j = 0; j <= CHUNK; j++) {
      if (!data.h[x][j]) continue;
      p.set(baseX + x * CELL + CELL / 2, WALL_H / 2, baseZ + j * CELL);
      s.set(CELL + WALL_T, WALL_H, WALL_T);
      m.compose(p, q, s);
      mesh.setMatrixAt(k, m);
      col.setHSL(hue + 0.03 * (hash3(x, j, 11) - 0.5), 0.38, 0.30 + 0.14 * hash3(cx * 31 + x, cz * 31 + j, 6));
      mesh.setColorAt(k, col);
      k++;
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  group.add(mesh);

  const floorGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL);
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(baseX + CHUNK * CELL / 2, 0, baseZ + CHUNK * CELL / 2);
  group.add(floor);

  const ceilGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL);
  const ceil = new THREE.Mesh(ceilGeo, ceilMat);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.set(baseX + CHUNK * CELL / 2, WALL_H, baseZ + CHUNK * CELL / 2);
  group.add(ceil);

  scene.add(group);
  built.set(key, { group, mesh, floorGeo, ceilGeo });
}

let lastChunkKey = '';
const pos = new THREE.Vector3(CELL / 2, EYE, CELL / 2);

function ensureChunks(force) {
  const ccx = Math.floor(pos.x / (CHUNK * CELL));
  const ccz = Math.floor(pos.z / (CHUNK * CELL));
  const ck = ccx + ',' + ccz;
  if (!force && ck === lastChunkKey) return;
  lastChunkKey = ck;
  for (let dx = -VIEW_R; dx <= VIEW_R; dx++) {
    for (let dz = -VIEW_R; dz <= VIEW_R; dz++) {
      const key = (ccx + dx) + ',' + (ccz + dz);
      if (!built.has(key)) buildChunk(ccx + dx, ccz + dz);
    }
  }
  for (const [key, entry] of built) {
    const parts = key.split(',');
    const x = +parts[0], z = +parts[1];
    if (Math.max(Math.abs(x - ccx), Math.abs(z - ccz)) > VIEW_R + 1) {
      scene.remove(entry.group);
      entry.mesh.dispose();
      entry.floorGeo.dispose();
      entry.ceilGeo.dispose();
      built.delete(key);
    }
  }
}

// ---- autonomous navigation ----

let heading = 0, targetHeading = 0;
let turning = false;
let turnCooldown = 0;
let bobPhase = 0, dist = 0, roll = 0;
let lastCellKey = '', rolledKey = '';
const visits = new Map();

const dirX = h => -Math.sin(h);
const dirZ = h => -Math.cos(h);
const openAt = (h, d) => !collides(pos.x + dirX(h) * d, pos.z + dirZ(h) * d);

function cellKeyAt(h, steps) {
  const gx = Math.floor((pos.x + dirX(h) * CELL * steps) / CELL);
  const gz = Math.floor((pos.z + dirZ(h) * CELL * steps) / CELL);
  return gx + ',' + gz;
}
const visitCount = key => visits.get(key) || 0;

function pickTurn() {
  const cands = [heading + Math.PI / 2, heading - Math.PI / 2].filter(h => openAt(h, 1.6));
  if (cands.length === 0) return heading + Math.PI;
  if (cands.length === 1) return cands[0];
  const v0 = visitCount(cellKeyAt(cands[0], 1));
  const v1 = visitCount(cellKeyAt(cands[1], 1));
  if (v0 !== v1) return v0 < v1 ? cands[0] : cands[1];
  return cands[Math.random() < 0.5 ? 0 : 1];
}

for (const h of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) {
  if (openAt(h, 1.6)) { heading = targetHeading = h; break; }
}
ensureChunks(true);

const clock = new THREE.Clock();
const t0 = performance.now();

setInterval(() => {
  const t = (performance.now() - t0) / 1000;
  statsEl.textContent = dist.toFixed(0) + ' m drifted · ' + built.size + ' chunks live · ' +
    visits.size + ' cells mapped · ' + t.toFixed(0) + ' s';
}, 250);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  const gx = Math.floor(pos.x / CELL), gz = Math.floor(pos.z / CELL);
  const cellKey = gx + ',' + gz;
  if (cellKey !== lastCellKey) {
    lastCellKey = cellKey;
    visits.set(cellKey, visitCount(cellKey) + 1);
    if (visits.size > 20000) visits.clear();
  }
  const cx0 = gx * CELL + CELL / 2, cz0 = gz * CELL + CELL / 2;

  if (!turning) {
    if (!openAt(heading, PROBE)) {
      targetHeading = pickTurn();
      turning = true;
    } else if (turnCooldown <= 0 && cellKey !== rolledKey &&
               Math.abs(pos.x - cx0) < 0.45 && Math.abs(pos.z - cz0) < 0.45) {
      rolledKey = cellKey;
      const options = [heading + Math.PI / 2, heading - Math.PI / 2].filter(h => openAt(h, 1.6));
      if (options.length && Math.random() < 0.3) {
        const v0 = visitCount(cellKeyAt(options[0], 1));
        const v1 = options.length > 1 ? visitCount(cellKeyAt(options[1], 1)) : 1e9;
        targetHeading = v0 <= v1 ? options[0] : options[1];
        turning = true;
        turnCooldown = 1.4;
      }
    }
  }
  turnCooldown -= dt;

  // gentle corridor centering while cruising
  let desired = targetHeading;
  if (!turning) {
    const lat = (cx0 - pos.x) * -Math.cos(heading) + (cz0 - pos.z) * Math.sin(heading);
    desired = targetHeading + clamp(lat * 0.55, -0.3, 0.3);
  }

  const prevHeading = heading;
  let dh = desired - heading;
  dh = Math.atan2(Math.sin(dh), Math.cos(dh));
  heading += clamp(dh, -TURN_RATE * dt, TURN_RATE * dt);

  if (turning) {
    let rem = targetHeading - heading;
    rem = Math.atan2(Math.sin(rem), Math.cos(rem));
    if (Math.abs(rem) < 0.03) { heading = targetHeading; turning = false; }
  }

  const step = SPEED * (turning ? 0.5 : 1) * dt;
  const dx = dirX(heading) * step, dz = dirZ(heading) * step;
  let moved = 0;
  if (!collides(pos.x + dx, pos.z)) { pos.x += dx; moved += Math.abs(dx); }
  if (!collides(pos.x, pos.z + dz)) { pos.z += dz; moved += Math.abs(dz); }
  dist += moved;

  bobPhase += moved * 1.6;
  pos.y = EYE + Math.sin(bobPhase) * 0.045;

  const applied = heading - prevHeading;
  const rollTarget = clamp(applied * 22, -0.05, 0.05);
  roll += (rollTarget - roll) * Math.min(1, dt * 6);

  camera.position.copy(pos);
  camera.rotation.y = heading;
  camera.rotation.z = roll;
  camera.rotation.x = Math.sin(bobPhase * 0.5) * 0.012;

  lamp.position.set(pos.x, pos.y + 0.3, pos.z);

  ensureChunks(false);
  renderer.render(scene, camera);
}

tick();
</script>
</body>
</html>
