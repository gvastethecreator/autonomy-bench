<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rollercoaster B - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0b0c10; }
    #hud { position: absolute; bottom: 20px; left: 20px; color: #66fcf1; font-family: 'Courier New', Courier, monospace; pointer-events: none; text-transform: uppercase; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="hud">Neon Coaster (Level B) - Gemini 3.1 Pro <br><span id="speed">Speed: 0 km/h</span></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.FogExp2(0x050505, 0.015);

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const points = [];
    for (let i = 0; i <= 200; i++) {
        const t = i / 200 * Math.PI * 2;
        points.push(new THREE.Vector3(
            Math.sin(t * 4) * 80,
            Math.cos(t * 3) * 40 + 40,
            Math.sin(t * 5) * 80
        ));
    }
    const curve = new THREE.CatmullRomCurve3(points, true);
    const tubeGeometry = new THREE.TubeGeometry(curve, 400, 1.5, 8, true);
    
    // Neon material
    const tubeMaterial = new THREE.MeshBasicMaterial({ color: 0x66fcf1, wireframe: true, transparent: true, opacity: 0.8 });
    const track = new THREE.Mesh(tubeGeometry, tubeMaterial);
    scene.add(track);

    // Support structures
    const supportGeo = new THREE.CylinderGeometry(0.5, 0.5, 100);
    const supportMat = new THREE.MeshBasicMaterial({ color: 0x45a29e });
    for(let i=0; i<points.length; i+=10) {
        const p = points[i];
        const support = new THREE.Mesh(supportGeo, supportMat);
        support.position.set(p.x, p.y/2, p.z);
        support.scale.y = p.y / 100;
        scene.add(support);
    }

    let progress = 0;
    const speedEl = document.getElementById('speed');
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastTime = 0;
    function animate(time) {
        requestAnimationFrame(animate);
        const delta = (time - lastTime) * 0.001;
        lastTime = time;
        
        progress += 0.0005;
        if (progress > 1) progress = 0;
        
        speedEl.innerText = `Speed: ${(Math.random()*10 + 100).toFixed(0)} km/h`;
        
        const pos = curve.getPointAt(progress);
        const lookAt = curve.getPointAt((progress + 0.005) % 1);
        
        camera.position.copy(pos);
        camera.position.y += 1; // offset
        camera.lookAt(lookAt);
        
        // Add some roll
        const tangent = curve.getTangentAt(progress);
        const axis = new THREE.Vector3(0, 1, 0);
        const roll = tangent.x * 0.5;
        camera.rotateOnAxis(new THREE.Vector3(0,0,1), roll);

        composer.render();
    }
    animate(0);
  </script>
</body>
</html>
