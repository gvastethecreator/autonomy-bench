<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viper Coaster 3D · Autonomous Experience</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; overflow: hidden; font-family: monospace; color: #38bdf8; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: absolute; top: 16px; left: 16px;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 16px; border-radius: 6px;
    }
    .val { font-size: 20px; font-weight: 700; color: #fff; }
    #start {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.8);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 50; cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="start" onclick="initAudio()">
    <h2 style="letter-spacing: 2px; margin-bottom: 6px;">VIPER 3D COASTER</h2>
    <p style="color: #94a3b8; font-size: 12px;">Click to launch experience & audio</p>
  </div>

  <div id="hud">
    <div>SPEED: <span class="val" id="spd">0</span> MPH</div>
    <div>G-FORCE: <span class="val" style="color: #fbbf24;" id="gForce">1.0</span></div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* Audio */
    let actx = null, soundStarted = false;
    let windGain = null, windFilt = null;

    function initAudio() {
      if (soundStarted) return;
      soundStarted = true;
      document.getElementById('start').style.display = 'none';

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();
        const bSize = actx.sampleRate * 2;
        const nBuf = actx.createBuffer(1, bSize, actx.sampleRate);
        const out = nBuf.getChannelData(0);
        for (let i = 0; i < bSize; i++) out[i] = (Math.random() * 2 - 1) * 0.3;

        const noise = actx.createBufferSource();
        noise.buffer = nBuf; noise.loop = true;

        windFilt = actx.createBiquadFilter();
        windFilt.type = 'lowpass'; windFilt.frequency.value = 250;
        windGain = actx.createGain(); windGain.gain.value = 0.03;

        noise.connect(windFilt); windFilt.connect(windGain); windGain.connect(actx.destination);
        noise.start();
      } catch (e) {}
    }

    /* Scene */
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);
    scene.fog = new THREE.Fog(0x38bdf8, 100, 1500);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(150, 300, 150);
    scene.add(sun);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2),
      new THREE.MeshLambertMaterial({ color: 0x166534 })
    );
    scene.add(ground);

    // Spline with Inversion
    const pts = [
      new THREE.Vector3(0, 15, 0),
      new THREE.Vector3(20, 35, 80),
      new THREE.Vector3(50, 80, 180),
      new THREE.Vector3(80, 130, 280), // Crest (130m)
      new THREE.Vector3(100, 110, 340),
      new THREE.Vector3(120, 18, 400), // Drop
      new THREE.Vector3(160, 65, 460), // Inversion Loop
      new THREE.Vector3(190, 95, 440),
      new THREE.Vector3(210, 50, 380),
      new THREE.Vector3(240, 18, 280),
      new THREE.Vector3(220, 55, 180), // Banked Helix
      new THREE.Vector3(160, 45, 80),
      new THREE.Vector3(80, 20, 10)
    ];

    const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);

    const SEGS = 800;
    const lPts = [], rPts = [];
    const rOff = 0.9;
    const trackGroup = new THREE.Group();

    for (let i = 0; i <= SEGS; i++) {
      const t = i / SEGS;
      const pt = curve.getPointAt(t);
      const tang = curve.getTangentAt(t).normalize();
      let up = new THREE.Vector3(0, 1, 0);

      if (t > 0.35 && t < 0.55) {
        up.applyAxisAngle(tang, Math.sin(((t - 0.35) / 0.2) * Math.PI) * Math.PI);
      }

      const binorm = new THREE.Vector3().crossVectors(tang, up).normalize();
      lPts.push(pt.clone().addScaledVector(binorm, -rOff));
      rPts.push(pt.clone().addScaledVector(binorm, rOff));

      if (i % 16 === 0 && pt.y > 3) {
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.25, 0.35, pt.y, 8),
          new THREE.MeshLambertMaterial({ color: 0x475569 })
        );
        pillar.position.set(pt.x, pt.y / 2, pt.z);
        trackGroup.add(pillar);
      }
    }

    const railMat = new THREE.MeshStandardMaterial({ color: 0x059669, metalness: 0.8, roughness: 0.2 });
    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lPts, true), 500, 0.14, 6, true), railMat));
    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rPts, true), 500, 0.14, 6, true), railMat));
    scene.add(trackGroup);

    let progress = 0.0;
    const spdEl = document.getElementById('spd');
    const gEl = document.getElementById('gForce');
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      const pt = curve.getPointAt(progress);
      const tang = curve.getTangentAt(progress).normalize();

      const isLift = progress < 0.28;
      const speed = isLift ? 18 : Math.max(Math.sqrt(Math.max(130 - pt.y, 4)) * 7.5, 24);
      progress = (progress + (speed * 0.447) / curve.getLength() * dt) % 1.0;

      let up = new THREE.Vector3(0, 1, 0);
      if (progress > 0.35 && progress < 0.55) {
        up.applyAxisAngle(tang, Math.sin(((progress - 0.35) / 0.2) * Math.PI) * Math.PI);
      }

      const binorm = new THREE.Vector3().crossVectors(tang, up).normalize();
      const norm = new THREE.Vector3().crossVectors(binorm, tang).normalize();

      const eye = pt.clone().addScaledVector(norm, 1.15);
      camera.position.copy(eye);
      camera.up.copy(norm);
      camera.lookAt(eye.clone().addScaledVector(tang, 15));

      if (windFilt && windGain && actx) {
        windFilt.frequency.setTargetAtTime(200 + (speed / 85) * 1600, actx.currentTime, 0.05);
        windGain.gain.setTargetAtTime(0.02 + (speed / 85) * 0.1, actx.currentTime, 0.05);
      }

      spdEl.textContent = Math.round(speed);
      gEl.textContent = (isLift ? 1.0 : (1.0 + (130 - pt.y) * 0.02 + Math.abs(tang.y) * 0.8)).toFixed(1);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
