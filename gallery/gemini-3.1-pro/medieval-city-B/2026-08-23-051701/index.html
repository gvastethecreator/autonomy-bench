<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medieval City B - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #2b3a42; }
    #hud { position: absolute; top: 10px; right: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 15px; font-family: 'Georgia', serif; border: 1px solid #c9a66b; border-radius: 4px; text-align: center; }
  </style>
</head>
<body>
  <div id="hud">
    <h3 style="margin:0 0 10px 0; color:#c9a66b;">Winterhold City</h3>
    <p style="margin:0; font-size:14px;">Nighttime Environment (Level B)</p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a242f);
    scene.fog = new THREE.FogExp2(0x1a242f, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 15, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    const ambientLight = new THREE.AmbientLight(0x223344, 0.5);
    scene.add(ambientLight);
    
    const moonLight = new THREE.DirectionalLight(0xaaccff, 0.8);
    moonLight.position.set(-50, 100, -20);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 2048;
    moonLight.shadow.mapSize.height = 2048;
    scene.add(moonLight);

    // Snow Ground
    const groundGeo = new THREE.PlaneGeometry(150, 150, 32, 32);
    // Displace ground slightly
    const posAttribute = groundGeo.attributes.position;
    for (let i = 0; i < posAttribute.count; i++) {
        posAttribute.setZ(i, Math.random() * 0.5);
    }
    groundGeo.computeVertexNormals();
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xddddff, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const houseGeo = new THREE.BoxGeometry(4, 5, 5);
    const houseMat = new THREE.MeshStandardMaterial({ color: 0x5a4d41, roughness: 0.8 });
    const roofGeo = new THREE.ConeGeometry(4.5, 4, 4);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }); // snow roof

    // Random town generation
    for (let i = 0; i < 40; i++) {
        const x = (Math.random() - 0.5) * 80;
        const z = (Math.random() - 0.5) * 80;
        
        // Skip center for plaza
        if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
        
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.set(x, 2.5, z);
        house.rotation.y = Math.random() * Math.PI;
        house.castShadow = true;
        scene.add(house);
        
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 4.5, 0);
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        house.add(roof);

        // Add warm window light randomly
        if (Math.random() > 0.5) {
            const windowLight = new THREE.PointLight(0xffaa33, 1, 10);
            windowLight.position.set(x, 3, z + 2.6);
            scene.add(windowLight);
        }
    }

    // Center Plaza Monument / Tree
    const treeGeo = new THREE.ConeGeometry(2, 10, 8);
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x224422 });
    const tree = new THREE.Mesh(treeGeo, treeMat);
    tree.position.set(0, 5, 0);
    tree.castShadow = true;
    scene.add(tree);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
