<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medieval City A - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #87CEEB; }
    #hud { position: absolute; bottom: 20px; left: 20px; color: white; font-family: monospace; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <div id="hud">Medieval City (Level A) - Gemini 3.1 Pro<br>Use Mouse to Orbit</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaccff);
    scene.fog = new THREE.FogExp2(0xaaccff, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(20, 20, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x446622 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Buildings
    const houseGeo = new THREE.BoxGeometry(4, 4, 4);
    const houseMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
    const roofGeo = new THREE.ConeGeometry(3.5, 3, 4);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x883333 });

    for (let i = 0; i < 20; i++) {
        const x = (Math.random() - 0.5) * 60;
        const z = (Math.random() - 0.5) * 60;
        
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.set(x, 2, z);
        house.castShadow = true;
        scene.add(house);
        
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(x, 5.5, z);
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        scene.add(roof);
    }

    // Castle
    const castleGeo = new THREE.CylinderGeometry(5, 5, 10, 8);
    const castleMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const castle = new THREE.Mesh(castleGeo, castleMat);
    castle.position.set(0, 5, 0);
    castle.castShadow = true;
    scene.add(castle);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
