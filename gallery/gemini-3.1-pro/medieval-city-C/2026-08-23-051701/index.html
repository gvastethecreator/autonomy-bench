<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medieval City C - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #fcebc9; font-family: 'Times New Roman', Times, serif; }
    #ui { position: absolute; inset: 0; pointer-events: none; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; }
    h1 { margin: 0; color: #4a3b2c; font-size: 36px; text-shadow: 1px 1px 0px rgba(255,255,255,0.8); }
    p { margin: 5px 0 0 0; color: #6a5b4c; font-size: 18px; font-style: italic; }
    #controls { align-self: flex-end; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; border: 2px solid #d3c4a1; color: #3a2b1c; box-shadow: 0 10px 30px rgba(0,0,0,0.1); pointer-events: auto; }
    button { background: #8c7355; color: white; border: none; padding: 8px 16px; margin-top: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #6b563d; }
  </style>
</head>
<body>
  <div id="ui">
    <div>
      <h1>Aethelgard Citadel</h1>
      <p>High Fantasy City Generator (Level C)</p>
    </div>
    <div id="controls">
      <strong>Time of Day</strong><br>
      <input type="range" id="time" min="0" max="24" value="12" style="width: 200px;"><br>
      <button id="regen">Regenerate City</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 1000);
    camera.position.set(100, 80, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; // Don't go below ground
    controls.target.set(0, 10, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 500;
    const d = 150;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    let cityGroup = new THREE.Group();
    scene.add(cityGroup);

    // Advanced City Generation
    function generateCity() {
        // Clear old city
        while(cityGroup.children.length > 0){ 
            const obj = cityGroup.children[0];
            cityGroup.remove(obj); 
        }

        // Terrain
        const terrainGeo = new THREE.PlaneGeometry(400, 400, 64, 64);
        const posAttribute = terrainGeo.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            const x = posAttribute.getX(i);
            const y = posAttribute.getY(i);
            // Island shape + noise
            const dist = Math.sqrt(x*x + y*y);
            const height = Math.max(0, 20 - dist * 0.1) + Math.sin(x*0.05)*Math.cos(y*0.05)*5;
            posAttribute.setZ(i, height);
        }
        terrainGeo.computeVertexNormals();
        const terrainMat = new THREE.MeshStandardMaterial({ color: 0x4d6633, roughness: 0.9, flatShading: true });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.rotation.x = -Math.PI / 2;
        terrain.receiveShadow = true;
        cityGroup.add(terrain);

        // Water
        const waterGeo = new THREE.PlaneGeometry(600, 600);
        const waterMat = new THREE.MeshPhysicalMaterial({ color: 0x2266aa, transparent: true, opacity: 0.8, roughness: 0.1, transmission: 0.9 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = 2; // Water level
        cityGroup.add(water);

        // Materials
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xe0d5c1, roughness: 0.8 });
        const roofMat1 = new THREE.MeshStandardMaterial({ color: 0x8a3a3a, roughness: 0.7 });
        const roofMat2 = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.7 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

        // Geometries
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const coneGeo = new THREE.ConeGeometry(0.7, 1, 4);

        // Castle in center
        const castle = new THREE.Group();
        const keep = new THREE.Mesh(boxGeo, wallMat);
        keep.scale.set(20, 40, 20);
        keep.position.y = 40;
        keep.castShadow = true;
        castle.add(keep);
        
        // Towers
        for(let tx of [-1, 1]) {
            for(let tz of [-1, 1]) {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 5, 50, 8), wallMat);
                tower.position.set(tx * 12, 45, tz * 12);
                tower.castShadow = true;
                castle.add(tower);
                
                const spire = new THREE.Mesh(new THREE.ConeGeometry(5, 15, 8), roofMat2);
                spire.position.set(tx * 12, 77.5, tz * 12);
                spire.castShadow = true;
                castle.add(spire);
            }
        }
        cityGroup.add(castle);

        // Houses spreading outwards
        for (let i = 0; i < 300; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 120;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            
            // Calculate terrain height at this point (approximate)
            const terrHeight = Math.max(0, 20 - dist * 0.1) + Math.sin(x*0.05)*Math.cos(z*0.05)*5;
            
            if (terrHeight < 3) continue; // Don't build in water
            
            const houseGroup = new THREE.Group();
            houseGroup.position.set(x, terrHeight, z);
            houseGroup.rotation.y = Math.random() * Math.PI;

            const w = 4 + Math.random() * 4;
            const d = 4 + Math.random() * 4;
            const h = 6 + Math.random() * 8;

            const base = new THREE.Mesh(boxGeo, wallMat);
            base.scale.set(w, h, d);
            base.position.y = h/2;
            base.castShadow = true;
            base.receiveShadow = true;
            houseGroup.add(base);

            // Roof
            const roof = new THREE.Mesh(coneGeo, Math.random() > 0.5 ? roofMat1 : roofMat2);
            roof.scale.set(w*1.1, h*0.6, d*1.1);
            roof.position.y = h + (h*0.6)/2;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);
            
            // Wooden overhangs (Tudor style)
            if (h > 10 && Math.random() > 0.5) {
                const overhang = new THREE.Mesh(boxGeo, wallMat);
                overhang.scale.set(w*1.2, h*0.4, d*1.2);
                overhang.position.y = h*0.7;
                overhang.castShadow = true;
                houseGroup.add(overhang);
            }

            cityGroup.add(houseGroup);
        }
    }

    generateCity();

    // Time of Day Logic
    const timeSlider = document.getElementById('time');
    document.getElementById('regen').addEventListener('click', generateCity);

    function updateTime() {
        const timeVal = parseFloat(timeSlider.value);
        const angle = (timeVal / 24) * Math.PI * 2 - Math.PI/2;
        
        sunLight.position.set(Math.cos(angle) * 200, Math.sin(angle) * 200, 50);
        
        if (Math.sin(angle) > 0) { // Day
            sunLight.intensity = Math.sin(angle) * 1.5;
            scene.background.setHSL(0.55, 0.6, Math.max(0.1, Math.sin(angle) * 0.6 + 0.2));
            scene.fog.color.copy(scene.background);
            ambientLight.intensity = 0.4;
        } else { // Night
            sunLight.intensity = 0;
            scene.background.setHex(0x050a1a);
            scene.fog.color.setHex(0x050a1a);
            ambientLight.intensity = 0.1;
        }
    }
    timeSlider.addEventListener('input', updateTime);
    updateTime();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
