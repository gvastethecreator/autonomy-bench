<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canyon Surge · Showcase Rollercoaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1c1917; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ffedd5; }
    #canvas { width: 100vw; height: 100vh; display: block; }

    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0);
      transition: box-shadow 0.15s ease-out; z-index: 5;
    }

    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 28px 32px;
    }

    .glass {
      background: rgba(28, 25, 23, 0.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(251, 146, 60, 0.3); border-radius: 12px;
      padding: 12px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); pointer-events: auto;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand h1 {
      font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      background: linear-gradient(135deg, #fb923c 0%, #f43f5e 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand p { font-size: 11px; color: #a8a29e; letter-spacing: 1px; }

    .telemetry { display: flex; gap: 20px; }
    .gauge { display: flex; flex-direction: column; align-items: flex-end; }
    .gauge-val { font-size: 26px; font-weight: 800; font-family: monospace; color: #fb923c; line-height: 1; }
    .gauge-lbl { font-size: 9px; text-transform: uppercase; color: #a8a29e; margin-top: 3px; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
    .btn-row { display: flex; gap: 8px; }
    .btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(251, 146, 60, 0.3);
      color: #ffedd5; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: rgba(251, 146, 60, 0.2); border-color: #fb923c; }
    .btn.active { background: rgba(251, 146, 60, 0.35); border-color: #fb923c; color: #fff; }

    #start-card {
      position: absolute; inset: 0; background: rgba(28, 25, 23, 0.85); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; cursor: pointer;
    }
    .card {
      background: rgba(41, 37, 36, 0.95); border: 1px solid #fb923c; border-radius: 16px;
      padding: 28px 42px; text-align: center; box-shadow: 0 0 50px rgba(251, 146, 60, 0.3);
    }
    .card h2 { font-size: 22px; color: #fb923c; margin-bottom: 6px; letter-spacing: 2px; }
    .card p { font-size: 13px; color: #a8a29e; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="vignette"></div>

  <div id="start-card" onclick="initExp()">
    <div class="card">
      <h2>CANYON SURGE EXPEDITION</h2>
      <p>Click anywhere to start canyon coaster & sound engine</p>
    </div>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="glass brand">
        <h1>CANYON SURGE</h1>
        <p>Red Rock Showcase Rollercoaster</p>
      </div>

      <div class="glass telemetry">
        <div class="gauge">
          <div class="gauge-val" id="spd">0</div>
          <div class="gauge-lbl">Speed (MPH)</div>
        </div>
        <div class="gauge">
          <div class="gauge-val" style="color: #f43f5e;" id="gForce">1.0</div>
          <div class="gauge-lbl">G-Force</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="glass btn-row">
        <button class="btn active" id="btnCam" onclick="cycleCam()">🎥 View: <span id="camText">Front Seat 1P</span></button>
        <button class="btn" id="btnAudio" onclick="toggleAudio()">🔊 Audio: <span id="audioText">ON</span></button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* Audio */
    let actx = null, soundInit = false, muted = false;
    let windGain = null, windFilter = null;

    function initExp() {
      if (soundInit) return;
      soundInit = true;
      document.getElementById('start-card').style.display = 'none';

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();

        const bSize = actx.sampleRate * 2;
        const nBuf = actx.createBuffer(1, bSize, actx.sampleRate);
        const out = nBuf.getChannelData(0);
        for (let i = 0; i < bSize; i++) out[i] = (Math.random() * 2 - 1) * 0.35;

        const noise = actx.createBufferSource();
        noise.buffer = nBuf; noise.loop = true;

        windFilter = actx.createBiquadFilter();
        windFilter.type = 'lowpass'; windFilter.frequency.value = 260;
        windGain = actx.createGain(); windGain.gain.value = 0.035;

        noise.connect(windFilter); windFilter.connect(windGain); windGain.connect(actx.destination);
        noise.start();
      } catch (e) {}
    }

    function toggleAudio() {
      muted = !muted;
      document.getElementById('audioText').textContent = muted ? "OFF" : "ON";
      if (windGain) windGain.gain.value = muted ? 0 : 0.035;
    }

    /* Scene */
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfdba74);
    scene.fog = new THREE.FogExp2(0xfb923c, 0.002);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3500);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xffedd5, 0.8));
    const sun = new THREE.DirectionalLight(0xfb923c, 1.8);
    sun.position.set(300, 450, 200);
    scene.add(sun);

    // Canyon Terrain
    const terr = new THREE.Mesh(
      new THREE.PlaneGeometry(3000, 3000, 32, 32).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.95, flatShading: true })
    );
    scene.add(terr);

    // Track Spline
    const pts = [
      new THREE.Vector3(0, 25, 0),
      new THREE.Vector3(30, 45, 90),
      new THREE.Vector3(70, 100, 200),
      new THREE.Vector3(110, 160, 320), // Peak (160m)
      new THREE.Vector3(140, 135, 400),
      new THREE.Vector3(160, 25, 480),  // Deep Canyon Plunge
      new THREE.Vector3(210, 85, 540),  // Airtime Hill
      new THREE.Vector3(280, 115, 510),
      new THREE.Vector3(330, 70, 430),
      new THREE.Vector3(360, 30, 320),
      new THREE.Vector3(340, 80, 200),
      new THREE.Vector3(260, 60, 90),
      new THREE.Vector3(150, 25, 15),
      new THREE.Vector3(60, 25, -15)
    ];

    const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);

    const SEGS = 900;
    const trackPts = curve.getSpacedPoints(SEGS);
    const trackGroup = new THREE.Group();

    const railMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, metalness: 0.85, roughness: 0.2 });
    const spineMat = new THREE.MeshStandardMaterial({ color: 0x292524, metalness: 0.7, roughness: 0.4 });

    const lPts = [], rPts = [], sPts = [];
    const rOff = 1.0;

    for (let i = 0; i <= SEGS; i++) {
      const t = i / SEGS;
      const pt = trackPts[i];
      const tang = curve.getTangentAt(t).normalize();
      let up = new THREE.Vector3(0, 1, 0);

      if (t > 0.35 && t < 0.55) {
        up.applyAxisAngle(tang, Math.sin(((t - 0.35) / 0.2) * Math.PI) * Math.PI);
      }

      const binorm = new THREE.Vector3().crossVectors(tang, up).normalize();
      const norm = new THREE.Vector3().crossVectors(binorm, tang).normalize();

      lPts.push(pt.clone().addScaledVector(binorm, -rOff));
      rPts.push(pt.clone().addScaledVector(binorm, rOff));
      sPts.push(pt.clone().addScaledVector(norm, -0.4));

      if (i % 16 === 0 && pt.y > 4) {
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.5, pt.y, 8),
          new THREE.MeshStandardMaterial({ color: 0x44403c })
        );
        pillar.position.set(pt.x, pt.y / 2, pt.z);
        trackGroup.add(pillar);
      }
    }

    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lPts, true), 600, 0.15, 6, true), railMat));
    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rPts, true), 600, 0.15, 6, true), railMat));
    trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sPts, true), 600, 0.25, 6, true), spineMat));
    scene.add(trackGroup);

    let progress = 0.0, camMode = 0;
    const clock = new THREE.Clock();

    function cycleCam() {
      camMode = (camMode + 1) % 2;
      document.getElementById('camText').textContent = camMode === 0 ? "Front Seat 1P" : "Chase 3P";
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      const pt = curve.getPointAt(progress);
      const tang = curve.getTangentAt(progress).normalize();

      const isLift = progress < 0.26;
      const speed = isLift ? 18 : Math.max(Math.sqrt(Math.max(160 - pt.y, 4)) * 7.5, 26);
      progress = (progress + (speed * 0.447) / curve.getLength() * dt) % 1.0;

      let up = new THREE.Vector3(0, 1, 0);
      if (progress > 0.35 && progress < 0.55) {
        up.applyAxisAngle(tang, Math.sin(((progress - 0.35) / 0.2) * Math.PI) * Math.PI);
      }

      const binorm = new THREE.Vector3().crossVectors(tang, up).normalize();
      const norm = new THREE.Vector3().crossVectors(binorm, tang).normalize();

      if (camMode === 0) {
        const eye = pt.clone().addScaledVector(norm, 1.2);
        camera.position.copy(eye);
        camera.up.copy(norm);
        camera.lookAt(eye.clone().addScaledVector(tang, 16));
      } else {
        camera.position.set(pt.x - tang.x * 8.5 + norm.x * 3.2, pt.y - tang.y * 8.5 + norm.y * 3.2, pt.z - tang.z * 8.5 + norm.z * 3.2);
        camera.up.copy(norm);
        camera.lookAt(pt.clone().addScaledVector(tang, 10));
      }

      const vig = Math.min(Math.max((speed - 40) / 50, 0), 1) * 100;
      document.getElementById('vignette').style.boxShadow = `inset 0 0 ${vig}px rgba(0,0,0,0.7)`;

      if (windFilter && windGain && actx) {
        windFilter.frequency.setTargetAtTime(200 + (speed / 90) * 1800, actx.currentTime, 0.05);
        windGain.gain.setTargetAtTime(0.02 + (speed / 90) * 0.1, actx.currentTime, 0.05);
      }

      document.getElementById('spd').textContent = Math.round(speed);
      document.getElementById('gForce').textContent = (isLift ? 1.0 : (1.0 + (160 - pt.y) * 0.015 + Math.abs(tang.y) * 0.8)).toFixed(1);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
