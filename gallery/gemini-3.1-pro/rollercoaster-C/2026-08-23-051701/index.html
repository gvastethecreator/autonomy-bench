<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HYPERION - Stellar Abyss Megacoaster (Level C)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070913; font-family: system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding: 24px; z-index: 10; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(13, 17, 34, 0.72); backdrop-filter: blur(16px); padding: 14px 24px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.14); }
    .logo-text h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.1em; background: linear-gradient(90deg, #fff, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .telemetry { flex-grow: 1; display: flex; align-items: flex-end; padding-bottom: 20px; }
    .speed-gauge { font-size: 48px; font-weight: 900; color: #3b82f6; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
    .speed-gauge span { font-size: 18px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="header-bar">
      <div class="logo-text"><h1>HYPERION</h1><span>Stellar Abyss Megacoaster - Gemini 3.1 Pro (Level C)</span></div>
    </div>
    <div class="telemetry">
      <div class="speed-gauge" id="speed">120 <span>km/h</span></div>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020308);
    scene.fog = new THREE.FogExp2(0x020308, 0.008);

    const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.5, 0.1);
    composer.addPass(bloomPass);

    // Advanced Track Generation
    const points = [];
    const radius = 200;
    for (let i = 0; i <= 400; i++) {
        const t = (i / 400) * Math.PI * 2;
        // Complex Lissajous knot with height variation
        const x = Math.sin(t * 3) * radius * 1.5;
        const y = (Math.cos(t * 5) * radius * 0.8) + (Math.sin(t * 2) * radius * 0.5) + 150;
        const z = Math.sin(t * 4) * radius * 1.5;
        points.push(new THREE.Vector3(x, y, z));
    }
    const curve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);
    
    // Extrude Geometry for flat track with rails
    const shape = new THREE.Shape();
    shape.moveTo(-3, -1);
    shape.lineTo(3, -1);
    shape.lineTo(3, 0);
    shape.lineTo(2.5, 0);
    shape.lineTo(2.5, -0.5);
    shape.lineTo(-2.5, -0.5);
    shape.lineTo(-2.5, 0);
    shape.lineTo(-3, 0);
    shape.lineTo(-3, -1);

    const extrudeSettings = { steps: 2000, extrudePath: curve, closed: true };
    const trackGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    const trackMat = new THREE.MeshStandardMaterial({ 
        color: 0x111111, metalness: 0.8, roughness: 0.2, wireframe: false 
    });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    scene.add(trackMesh);

    // Neon Rails
    const railGeo = new THREE.TubeGeometry(curve, 2000, 0.3, 4, true);
    const railMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 }); // glowing blue
    const rail1 = new THREE.Mesh(railGeo, railMat);
    const rail2 = new THREE.Mesh(railGeo, railMat);
    scene.add(rail1);
    scene.add(rail2);

    // Environment - Cyberpunk City Below
    const cityGroup = new THREE.Group();
    const bldgGeo = new THREE.BoxGeometry(1, 1, 1);
    const bldgMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1 });
    
    for(let i=0; i<1000; i++) {
        const b = new THREE.Mesh(bldgGeo, bldgMat);
        const w = Math.random() * 20 + 10;
        const d = Math.random() * 20 + 10;
        const h = Math.random() * 100 + 20;
        b.scale.set(w, h, d);
        b.position.set(
            (Math.random() - 0.5) * 1000,
            h/2 - 100,
            (Math.random() - 0.5) * 1000
        );
        cityGroup.add(b);
        
        if(Math.random() > 0.8) {
            const light = new THREE.PointLight(Math.random() > 0.5 ? 0xf43f5e : 0x10b981, 2, 50);
            light.position.set(b.position.x, h + 2, b.position.z);
            cityGroup.add(light);
        }
    }
    scene.add(cityGroup);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
    scene.add(ambientLight);

    let progress = 0;
    const speedEl = document.getElementById('speed');
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        
        // Dynamic speed based on height (potential energy)
        const currentPos = curve.getPointAt(progress);
        const heightFactor = 1 - (currentPos.y / 400); // 0 to 1
        const currentSpeed = 0.0003 + (heightFactor * 0.0008);
        
        progress += currentSpeed;
        if (progress > 1) progress = 0;
        
        speedEl.innerHTML = `${(currentSpeed * 500000).toFixed(0)} <span>km/h</span>`;
        
        const pos = curve.getPointAt(progress);
        const lookAt = curve.getPointAt((progress + 0.002) % 1);
        
        camera.position.copy(pos);
        camera.position.y += 2;
        camera.lookAt(lookAt);
        
        // Banking logic
        const tangent = curve.getTangentAt(progress);
        const normal = new THREE.Vector3(0, 1, 0);
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
        
        // Smoothly roll camera based on sharpness of turn
        const nextTangent = curve.getTangentAt((progress + 0.01) % 1);
        const turnDot = binormal.dot(nextTangent); // How much are we turning into the binormal?
        
        camera.rotateOnAxis(new THREE.Vector3(0, 0, 1), turnDot * 5); // Banking multiplier

        composer.render();
    }
    animate();
  </script>
</body>
</html>
