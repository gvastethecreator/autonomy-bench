<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rollercoaster</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
        }
        canvas { 
            display: block; 
        }
        #overlay {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            z-index: 10;
        }
        #ui {
            position: absolute; 
            bottom: 40px; left: 40px; 
            color: #0ff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 0 0 5px rgba(0, 255, 255, 0.5); 
            font-size: 20px; 
            font-weight: 800; 
            letter-spacing: 4px;
            opacity: 0.8; 
            pointer-events: none;
            z-index: 20;
        }
        .scanlines {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; 
            pointer-events: none; 
            opacity: 0.4;
            z-index: 15;
        }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div class="scanlines"></div>
    <div id="ui">NEON COASTER OS // V 1.0</div>
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050012);
        scene.fog = new THREE.FogExp2(0x050012, 0.0012);

        const camera = new THREE.PerspectiveCamera(95, window.innerWidth / window.innerHeight, 0.1, 8000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Track Generation ---
        const points = [];
        const numPoints = 1200;
        for (let i = 0; i < numPoints; i++) {
            let t = i / numPoints;
            let p = t * Math.PI * 2;
            
            let p_knot = 2; 
            let q_knot = 7; 
            
            let r = 500 + 150 * Math.cos(q_knot * p);
            let x = r * Math.cos(p_knot * p);
            let z = r * Math.sin(p_knot * p);
            let y = 600 + 350 * Math.sin(q_knot * p) + 150 * Math.cos(p_knot * p);
            
            // Add some high-frequency twists to the path
            x += Math.sin(p * 20) * 15;
            y += Math.cos(p * 20) * 15;
            
            points.push(new THREE.Vector3(x, y, z));
        }

        const curve = new THREE.CatmullRomCurve3(points);
        curve.closed = true;
        curve.curveType = 'centripetal';
        curve.tension = 0.5;

        // Calculate height bounds for dynamic speed
        let minY = Infinity;
        let maxY = -Infinity;
        const sampledPoints = curve.getSpacedPoints(1000);
        for (let pt of sampledPoints) {
            if (pt.y < minY) minY = pt.y;
            if (pt.y > maxY) maxY = pt.y;
        }

        // --- Track Geometry ---
        const spine = new THREE.Shape();
        spine.moveTo(-1.2, -1);
        spine.lineTo(1.2, -1);
        spine.lineTo(1.2, 0.2);
        spine.lineTo(-1.2, 0.2);
        spine.closePath();

        const leftRail = new THREE.Shape();
        leftRail.moveTo(-3.5, 0.2);
        leftRail.lineTo(-2.5, 0.2);
        leftRail.lineTo(-2.5, 1.2);
        leftRail.lineTo(-3.5, 1.2);
        leftRail.closePath();

        const rightRail = new THREE.Shape();
        rightRail.moveTo(2.5, 0.2);
        rightRail.lineTo(3.5, 0.2);
        rightRail.lineTo(3.5, 1.2);
        rightRail.lineTo(2.5, 1.2);
        rightRail.closePath();

        const trackSegments = 2500;
        const extrudeSettings = { 
            steps: trackSegments, 
            bevelEnabled: false, 
            extrudePath: curve, 
            closed: true 
        };

        const trackGeo = new THREE.ExtrudeGeometry([spine, leftRail, rightRail], extrudeSettings);
        
        const solidMat = new THREE.MeshPhongMaterial({ 
            color: 0x050510, 
            specular: 0xffffff,
            shininess: 80
        });
        const trackMesh = new THREE.Mesh(trackGeo, solidMat);
        scene.add(trackMesh);

        const wireMat = new THREE.LineBasicMaterial({ 
            color: 0x00ffff, 
            transparent: true, 
            opacity: 0.15 
        });
        const wireGeo = new THREE.WireframeGeometry(trackGeo);
        const wireframe = new THREE.LineSegments(wireGeo, wireMat);
        scene.add(wireframe);

        // --- Precompute Frenet Frames for Camera ---
        const frames = curve.computeFrenetFrames(trackSegments, true);

        // --- Environment & Aesthetics ---
        
        // Grid Floor
        const gridHelper = new THREE.GridHelper(8000, 160, 0xff00aa, 0x220044);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        const floorMat = new THREE.MeshBasicMaterial({ color: 0x020008 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        scene.add(floor);

        // Synthwave Sun
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const context = canvas.getContext('2d');
        const gradient = context.createLinearGradient(0, 0, 0, 1024);
        gradient.addColorStop(0, '#ff00aa');
        gradient.addColorStop(0.5, '#ff7700');
        gradient.addColorStop(1, '#ff0055');
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(512, 512, 500, 0, Math.PI * 2);
        context.fill();

        context.globalCompositeOperation = 'destination-out';
        for (let i = 0; i < 25; i++) {
            const y = 512 + i * 22; 
            const height = 3 + i * 1.5;
            context.fillRect(0, y, 1024, height);
        }
        context.globalCompositeOperation = 'source-over';

        const sunTex = new THREE.CanvasTexture(canvas);
        const sunMat = new THREE.MeshBasicMaterial({ 
            map: sunTex, 
            transparent: true, 
            side: THREE.DoubleSide,
            fog: false
        });
        const sun = new THREE.Mesh(new THREE.PlaneGeometry(2500, 2500), sunMat);
        sun.position.set(0, 1500, -3500);
        scene.add(sun);

        // Floating Crystals
        const crystals = new THREE.Group();
        const crystalGeo = new THREE.OctahedronGeometry(25, 0);
        const crystalMat = new THREE.MeshPhongMaterial({
            color: 0x00ffff, emissive: 0x003366, shininess: 100, wireframe: true
        });
        
        for (let i = 0; i < 80; i++) {
            const mesh = new THREE.Mesh(crystalGeo, crystalMat);
            mesh.position.set(
                (Math.random() - 0.5) * 4000,
                Math.random() * 2000,
                (Math.random() - 0.5) * 4000
            );
            mesh.scale.set(1, 2 + Math.random() * 4, 1);
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            mesh.userData = {
                rx: (Math.random() - 0.5) * 0.02,
                ry: (Math.random() - 0.5) * 0.02
            };
            crystals.add(mesh);
        }
        scene.add(crystals);

        // Neon Rings
        const ringGeo = new THREE.TorusGeometry(20, 0.6, 8, 32);
        const ringMatCyan = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
        const ringMatMagenta = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.8 });
        
        const numRings = 200;
        for(let i=0; i<numRings; i++) {
            let t = i / numRings;
            let pos = curve.getPointAt(t);
            let tangent = curve.getTangentAt(t);
            
            let ring = new THREE.Mesh(ringGeo, i % 2 === 0 ? ringMatCyan : ringMatMagenta);
            ring.position.copy(pos);
            ring.lookAt(pos.clone().add(tangent));
            ring.scale.z = 0.1;
            scene.add(ring);
        }

        // Speed Particles (Stars/Dust)
        const particleCount = 3000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleBox = 500;
        for (let i = 0; i < particleCount; i++) {
            particlePos[i*3] = Math.random() * particleBox;
            particlePos[i*3+1] = Math.random() * particleBox;
            particlePos[i*3+2] = Math.random() * particleBox;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ 
            color: 0xffffff, size: 1.5, transparent: true, opacity: 0.7 
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- Cart / Player Model ---
        const cartGroup = new THREE.Group();
        scene.add(cartGroup);

        const cartGeo = new THREE.ConeGeometry(3, 10, 4);
        cartGeo.rotateX(-Math.PI / 2);
        cartGeo.rotateY(Math.PI / 4); 

        const cartBody = new THREE.Mesh(cartGeo, new THREE.MeshPhongMaterial({
            color: 0x111111, shininess: 150, flatShading: true
        }));
        const cartGlow = new THREE.LineSegments(
            new THREE.EdgesGeometry(cartGeo), 
            new THREE.LineBasicMaterial({ color: 0xff00aa })
        );
        cartGroup.add(cartBody);
        cartGroup.add(cartGlow);
        
        // Attach camera to cart group
        cartGroup.add(camera);
        camera.position.set(0, 3, 4); 
        
        // Local lights attached to cart
        const cartLight1 = new THREE.PointLight(0x00ffff, 1.5, 150);
        cartLight1.position.set(6, 4, 0);
        cartGroup.add(cartLight1);
        
        const cartLight2 = new THREE.PointLight(0xff00ff, 1.5, 150);
        cartLight2.position.set(-6, 4, 0);
        cartGroup.add(cartLight2);

        // --- Global Lighting ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));
        const dirLight = new THREE.DirectionalLight(0xffaa00, 1.5);
        dirLight.position.set(0, 1000, -2000);
        scene.add(dirLight);

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        let progress = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            // Calculate dynamic speed based on height
            const t = progress % 1;
            const pos = curve.getPointAt(t);
            
            const heightNormalized = Math.max(0, Math.min(1, (pos.y - minY) / (maxY - minY)));
            const speedFactor = Math.pow(1 - heightNormalized, 2); 
            const currentSpeed = 120 + speedFactor * 450; 
            
            progress += (currentSpeed * delta) / curve.getLength();

            // Extract smooth Frenet frames
            const frameIndexFloat = t * trackSegments;
            const i1 = Math.floor(frameIndexFloat);
            const i2 = i1 + 1;
            const weight = frameIndexFloat - i1;

            const normal = new THREE.Vector3().copy(frames.normals[i1]).lerp(frames.normals[i2], weight).normalize();
            const tangent = new THREE.Vector3().copy(frames.tangents[i1]).lerp(frames.tangents[i2], weight).normalize();

            // Position and orient cart
            const offset = new THREE.Vector3().copy(normal).multiplyScalar(2.5);
            cartGroup.position.copy(pos).add(offset);
            
            const lookAtPos = pos.clone().add(tangent);
            cartGroup.up.copy(normal);
            cartGroup.lookAt(lookAtPos);

            // Camera Shake at high speeds
            const shakeAmount = Math.max(0, (currentSpeed - 200) / 370) * 0.05;
            const rx = (Math.random() - 0.5) * shakeAmount;
            const ry = (Math.random() - 0.5) * shakeAmount;
            const rz = (Math.random() - 0.5) * shakeAmount;
            camera.rotation.set(rx, ry, rz);

            // Animate Sun tracking
            sun.lookAt(camera.position);

            // Animate Crystals
            crystals.children.forEach(c => {
                c.rotation.x += c.userData.rx;
                c.rotation.y += c.userData.ry;
            });

            // Update Speed Particles (infinite wrap-around)
            const positions = particleGeo.attributes.position.array;
            const camPos = cartGroup.position;
            for (let i = 0; i < particleCount; i++) {
                let dx = positions[i*3] - camPos.x;
                let dy = positions[i*3+1] - camPos.y;
                let dz = positions[i*3+2] - camPos.z;
                
                dx = ((dx % particleBox) + particleBox) % particleBox - particleBox/2;
                dy = ((dy % particleBox) + particleBox) % particleBox - particleBox/2;
                dz = ((dz % particleBox) + particleBox) % particleBox - particleBox/2;
                
                positions[i*3] = camPos.x + dx;
                positions[i*3+1] = camPos.y + dy;
                positions[i*3+2] = camPos.z + dz;
            }
            particleGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
