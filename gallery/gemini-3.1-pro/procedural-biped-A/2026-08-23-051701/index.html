<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Procedural Biped A - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #eee; }
    #hud { position: absolute; top: 10px; width: 100%; text-align: center; color: black; font-family: sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="hud">Procedural Biped (Level A) - Gemini 3.1 Pro</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);
    scene.fog = new THREE.Fog(0xeeeeee, 10, 50);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x000000, 0xaaaaaa);
    scene.add(grid);

    // Biped
    const biped = new THREE.Group();
    const bodyGeo = new THREE.BoxGeometry(1, 1.5, 0.5);
    const mat = new THREE.MeshStandardMaterial({ color: 0x3366ff });
    const body = new THREE.Mesh(bodyGeo, mat);
    body.position.y = 2.5;
    body.castShadow = true;
    biped.add(body);

    const headGeo = new THREE.SphereGeometry(0.4);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.y = 1;
    head.castShadow = true;
    body.add(head);

    const legGeo = new THREE.CylinderGeometry(0.2, 0.15, 1.5);
    const legL = new THREE.Mesh(legGeo, mat);
    legL.position.set(-0.3, -1.25, 0);
    legL.castShadow = true;
    body.add(legL);

    const legR = new THREE.Mesh(legGeo, mat);
    legR.position.set(0.3, -1.25, 0);
    legR.castShadow = true;
    body.add(legR);
    
    scene.add(biped);

    let time = 0;
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        time += 0.05;
        
        // Simple walking animation
        legL.rotation.x = Math.sin(time) * 0.5;
        legL.position.y = -1.25 + Math.max(0, Math.sin(time) * 0.2);
        
        legR.rotation.x = Math.sin(time + Math.PI) * 0.5;
        legR.position.y = -1.25 + Math.max(0, Math.sin(time + Math.PI) * 0.2);
        
        body.position.y = 2.5 + Math.abs(Math.sin(time * 2)) * 0.1;
        
        biped.position.z = Math.sin(time * 0.5) * 2;
        
        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
