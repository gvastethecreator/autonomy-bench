<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Endless Driving A - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; }
    #hud { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: monospace; font-size: 1.2rem; text-shadow: 1px 1px 2px black; }
  </style>
</head>
<body>
  <div id="hud">Endless Driving (Level A) - Use A/D to Steer</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);
    scene.fog = new THREE.Fog(0x111122, 10, 100);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2, -5);
    camera.lookAt(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffaa55, 1);
    dirLight.position.set(10, 20, -10);
    scene.add(dirLight);

    // Road
    const roadGeo = new THREE.PlaneGeometry(10, 200, 1, 20);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = 90;
    scene.add(road);
    
    // Lines
    const lineGeo = new THREE.PlaneGeometry(0.2, 200, 1, 20);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.y = 0.01;
    line.position.z = 90;
    scene.add(line);

    const carGeo = new THREE.BoxGeometry(2, 1, 4);
    const carMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const car = new THREE.Mesh(carGeo, carMat);
    car.position.set(0, 0.5, 0);
    scene.add(car);

    let keys = { a: false, d: false };
    window.addEventListener('keydown', e => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
    });
    window.addEventListener('keyup', e => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    let speed = 0.5;
    let offset = 0;

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        
        if (keys.a) car.position.x += 0.1;
        if (keys.d) car.position.x -= 0.1;
        car.position.x = Math.max(-4, Math.min(4, car.position.x));
        
        offset -= speed;
        if (offset < -10) offset += 10;
        line.position.z = 90 + offset;

        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
