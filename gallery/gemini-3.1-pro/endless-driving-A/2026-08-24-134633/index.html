<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Night Drive</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
        camera.position.set(0, 2.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        const roadGeo = new THREE.PlaneGeometry(24, 300);
        const roadMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111,
            roughness: 0.9,
        });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -100;
        scene.add(road);

        const lineGeo = new THREE.PlaneGeometry(0.3, 6);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const lines = [];
        for(let i = 0; i < 30; i++) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.z = -i * 12;
            line.position.y = 0.02;
            scene.add(line);
            lines.push(line);
        }

        const envObjects = [];
        const boxGeo = new THREE.BoxGeometry(2, 20, 2);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });
        
        for(let i = 0; i < 60; i++) {
            const mesh = new THREE.Mesh(boxGeo, boxMat);
            const side = Math.random() > 0.5 ? 1 : -1;
            mesh.position.x = side * (14 + Math.random() * 20);
            mesh.position.y = 10;
            mesh.position.z = -Math.random() * 300;
            scene.add(mesh);
            envObjects.push(mesh);
        }

        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPos = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 400;
            starPos[i+1] = 20 + Math.random() * 200;
            starPos[i+2] = -Math.random() * 400;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.5 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        const leftHeadlight = new THREE.SpotLight(0xffffff, 2, 200, 0.4, 0.8, 1);
        leftHeadlight.position.set(-1.5, 1, 6);
        leftHeadlight.target.position.set(-1.5, 0, -50);
        scene.add(leftHeadlight);
        scene.add(leftHeadlight.target);

        const rightHeadlight = new THREE.SpotLight(0xffffff, 2, 200, 0.4, 0.8, 1);
        rightHeadlight.position.set(1.5, 1, 6);
        rightHeadlight.target.position.set(1.5, 0, -50);
        scene.add(rightHeadlight);
        scene.add(rightHeadlight.target);

        const taillightGeo = new THREE.PlaneGeometry(1, 0.3);
        const taillightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const distantCars = [];
        for(let i = 0; i < 5; i++) {
            const car = new THREE.Group();
            const leftTail = new THREE.Mesh(taillightGeo, taillightMat);
            leftTail.position.set(-1, 0, 0);
            const rightTail = new THREE.Mesh(taillightGeo, taillightMat);
            rightTail.position.set(1, 0, 0);
            car.add(leftTail);
            car.add(rightTail);
            car.position.set((Math.random() - 0.5) * 10, 0.5, -50 - Math.random() * 200);
            scene.add(car);
            distantCars.push({
                mesh: car,
                speed: 0.6 + Math.random() * 0.8,
                lane: Math.random() > 0.5 ? 1 : -1
            });
        }

        const ambientLight = new THREE.AmbientLight(0x050510);
        scene.add(ambientLight);

        const lightPoles = [];
        const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 10);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        for (let i = 0; i < 20; i++) {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = 5;
            group.add(pole);

            const lampLight = new THREE.PointLight(0xffaa00, 1, 50);
            lampLight.position.set(0, 10, 0);
            group.add(lampLight);

            const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
            lampBulb.position.set(0, 10, 0);
            group.add(lampBulb);

            const side = i % 2 === 0 ? 1 : -1;
            group.position.set(side * 14, 0, -i * 30);
            scene.add(group);
            lightPoles.push(group);
        }

        const speed = 1.0;
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            lines.forEach(line => {
                line.position.z += speed;
                if(line.position.z > 6) {
                    line.position.z -= 30 * 12;
                }
            });

            envObjects.forEach(obj => {
                obj.position.z += speed;
                if(obj.position.z > 10) {
                    obj.position.z -= 300;
                    const side = Math.random() > 0.5 ? 1 : -1;
                    obj.position.x = side * (14 + Math.random() * 20);
                }
            });

            lightPoles.forEach(pole => {
                pole.position.z += speed;
                if (pole.position.z > 10) {
                    pole.position.z -= 20 * 30;
                }
            });

            distantCars.forEach(car => {
                car.mesh.position.z += (speed - car.speed);
                if (car.mesh.position.z > 10) {
                    car.mesh.position.z = -250 - Math.random() * 100;
                    car.mesh.position.x = (Math.random() - 0.5) * 10;
                } else if (car.mesh.position.z < -350) {
                    car.mesh.position.z = -50;
                }
                
                car.mesh.position.y = 0.5 + Math.sin(time * 10 + car.mesh.position.z) * 0.05;
            });

            camera.position.y = 2.5 + Math.sin(time * 15) * 0.05;
            camera.position.x = Math.sin(time * 2) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
