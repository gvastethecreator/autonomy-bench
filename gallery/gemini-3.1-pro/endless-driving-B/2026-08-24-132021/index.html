<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Runner: Metro Grid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #030712; overflow: hidden; font-family: monospace; color: #38bdf8; }
    #canvas { width: 100vw; height: 100vh; display: block; }

    #hud {
      position: absolute; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .hud-box {
      background: rgba(3, 7, 18, 0.85); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 16px; border-radius: 6px; pointer-events: auto;
    }
    .val { font-size: 24px; font-weight: 700; color: #fff; }
    .lbl { font-size: 10px; color: #94a3b8; }

    #bottom-bar {
      position: absolute; bottom: 20px; left: 20px;
      display: flex; gap: 10px; pointer-events: auto;
    }
    .btn {
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 4px;
    }
    .btn:hover { background: rgba(56, 189, 248, 0.25); }

    #start-overlay {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.85);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 50; cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="start-overlay" onclick="startAudio()">
    <h2 style="letter-spacing: 2px; margin-bottom: 8px;">NIGHT RUNNER</h2>
    <p style="color: #94a3b8; font-size: 12px;">Click to initiate engine & audio</p>
  </div>

  <div id="hud">
    <div class="hud-box">
      <div class="val" id="speedText">0</div>
      <div class="lbl">KM/H</div>
    </div>
    <div class="hud-box">
      <div class="val" id="scoreText">0</div>
      <div class="lbl">TRAFFIC PASSED</div>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="btn" onclick="toggleCam()">VIEW: <span id="camText">CHASE</span></button>
    <button class="btn" onclick="toggleAudio()">AUDIO: <span id="sndText">ON</span></button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* Audio */
    let actx = null, audioStarted = false, muted = false;
    let engineOsc = null, engineGain = null;

    function startAudio() {
      if (audioStarted) return;
      audioStarted = true;
      document.getElementById('start-overlay').style.display = 'none';

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();

        engineOsc = actx.createOscillator();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 55;
        const filt = actx.createBiquadFilter();
        filt.type = 'lowpass'; filt.frequency.value = 200;
        engineGain = actx.createGain(); engineGain.gain.value = 0.04;
        engineOsc.connect(filt); filt.connect(engineGain); engineGain.connect(actx.destination);
        engineOsc.start();
      } catch (e) {}
    }

    function toggleAudio() {
      muted = !muted;
      document.getElementById('sndText').textContent = muted ? "OFF" : "ON";
      if (engineGain) engineGain.gain.value = muted ? 0 : 0.04;
    }

    /* Scene */
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.003);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0x0f172a, 0.8));

    // Road
    const ROAD_W = 18, ROAD_L = 1000, NUM_SEGS = 50, SEG_L = 20;
    const roadGroup = new THREE.Group();
    const segments = [];

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.7 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

    for (let i = 0; i < NUM_SEGS; i++) {
      const seg = new THREE.Group();
      seg.add(new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, SEG_L).rotateX(-Math.PI / 2), roadMat));

      const stripeL = new THREE.Mesh(new THREE.PlaneGeometry(0.2, SEG_L * 0.4).rotateX(-Math.PI / 2), lineMat);
      stripeL.position.set(-4.5, 0.02, 0);
      const stripeR = new THREE.Mesh(new THREE.PlaneGeometry(0.2, SEG_L * 0.4).rotateX(-Math.PI / 2), lineMat);
      stripeR.position.set(4.5, 0.02, 0);
      seg.add(stripeL); seg.add(stripeR);

      seg.position.z = i * SEG_L;
      roadGroup.add(seg);
      segments.push(seg);
    }
    scene.add(roadGroup);

    // Player Car
    const playerCar = new THREE.Group();
    const carMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.8 });
    const carMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.75, 4.4), carMat);
    carMesh.position.y = 0.5;
    playerCar.add(carMesh);

    const headL = new THREE.SpotLight(0xffffff, 4.0, 160, Math.PI / 6, 0.3);
    headL.position.set(-0.7, 0.6, 2.2);
    const tL = new THREE.Object3D(); tL.position.set(-0.7, 0.2, 35);
    playerCar.add(headL); playerCar.add(tL); headL.target = tL;

    const headR = new THREE.SpotLight(0xffffff, 4.0, 160, Math.PI / 6, 0.3);
    headR.position.set(0.7, 0.6, 2.2);
    const tR = new THREE.Object3D(); tR.position.set(0.7, 0.2, 35);
    playerCar.add(headR); playerCar.add(tR); headR.target = tR;

    scene.add(playerCar);

    // Traffic
    const traffic = [];
    for (let i = 0; i < 5; i++) {
      const tc = new THREE.Group();
      const m = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 4.2), new THREE.MeshStandardMaterial({ color: 0x475569 }));
      m.position.y = 0.5;
      tc.add(m);

      const lanes = [-4.5, 0, 4.5];
      tc.position.set(lanes[i % lanes.length], 0, 70 + i * 160);
      tc.userData = { speed: 60 + Math.random() * 20 };
      scene.add(tc);
      traffic.push(tc);
    }

    // Input
    const keys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    let currentSpeed = 100;
    let carX = 0, steer = 0, camMode = 0, score = 0;

    function toggleCam() {
      camMode = (camMode + 1) % 2;
      document.getElementById('camText').textContent = camMode === 0 ? "CHASE" : "COCKPIT";
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (keys.w) currentSpeed = Math.min(currentSpeed + 35 * dt, 180);
      else if (keys.s) currentSpeed = Math.max(currentSpeed - 50 * dt, 30);
      else currentSpeed = Math.max(currentSpeed - 8 * dt, 80);

      if (keys.a) steer = Math.max(steer - 3.8 * dt, -0.06);
      else if (keys.d) steer = Math.min(steer + 3.8 * dt, 0.06);
      else steer *= 0.85;

      carX += steer * (currentSpeed * 0.07);
      carX = THREE.MathUtils.clamp(carX, -ROAD_W / 2 + 1.8, ROAD_W / 2 - 1.8);

      playerCar.position.x = carX;
      playerCar.rotation.y = -steer * 4.0;

      const move = (currentSpeed * 0.277) * dt * 7.5;
      for (let i = 0; i < NUM_SEGS; i++) {
        segments[i].position.z -= move;
        if (segments[i].position.z < -SEG_L) segments[i].position.z += NUM_SEGS * SEG_L;
      }

      traffic.forEach(tc => {
        tc.position.z -= (move - (tc.userData.speed * 0.277) * dt * 7.5);
        if (tc.position.z < -40) {
          tc.position.z += 800;
          const lanes = [-4.5, 0, 4.5];
          tc.position.x = lanes[Math.floor(Math.random() * lanes.length)];
          score++;
        }
      });

      if (engineOsc && actx) {
        engineOsc.frequency.setTargetAtTime(40 + (currentSpeed / 180) * 110, actx.currentTime, 0.05);
      }

      if (camMode === 0) {
        camera.position.set(carX * 0.6, 3.2, playerCar.position.z - 8.5);
        camera.lookAt(carX * 0.9, 1.2, playerCar.position.z + 20);
      } else {
        camera.position.set(carX, 1.25, playerCar.position.z + 0.3);
        camera.lookAt(carX, 1.05, playerCar.position.z + 35);
      }

      document.getElementById('speedText').textContent = Math.round(currentSpeed);
      document.getElementById('scoreText').textContent = score;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
