<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Endless Driving B - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #ff9900; }
    #hud { position: absolute; top: 20px; left: 20px; color: white; font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
  </style>
</head>
<body>
  <div id="hud">Sunset Drive (Level B) <br><span style="font-size: 16px">Left/Right arrows to steer</span></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xff8833);
    scene.fog = new THREE.Fog(0xff8833, 20, 150);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 2.5, -6);
    camera.lookAt(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const dirLight = new THREE.DirectionalLight(0xffddaa, 1.5);
    dirLight.position.set(0, 5, 50);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x444444));

    // Sun
    const sunGeo = new THREE.CircleGeometry(20, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.position.set(0, 5, 100);
    scene.add(sun);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Road grid (synthwave style)
    const gridHelper = new THREE.GridHelper(300, 100, 0xff00ff, 0xff00ff);
    gridHelper.position.y = 0.05;
    scene.add(gridHelper);

    // Car (low poly)
    const carGroup = new THREE.Group();
    const carBodyGeo = new THREE.BoxGeometry(2.5, 0.8, 5);
    const carBodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffff });
    const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
    carBody.position.y = 0.6;
    carGroup.add(carBody);
    
    const roofGeo = new THREE.BoxGeometry(1.5, 0.6, 2.5);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 1.3;
    roof.position.z = -0.5;
    carGroup.add(roof);

    scene.add(carGroup);

    let keys = { ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    let speed = 1.2;

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        
        if (keys.ArrowLeft) carGroup.position.x += 0.2;
        if (keys.ArrowRight) carGroup.position.x -= 0.2;
        carGroup.position.x = Math.max(-10, Math.min(10, carGroup.position.x));
        
        // Tilt car when turning
        if (keys.ArrowLeft) carGroup.rotation.z = Math.min(0.1, carGroup.rotation.z + 0.02);
        else if (keys.ArrowRight) carGroup.rotation.z = Math.max(-0.1, carGroup.rotation.z - 0.02);
        else carGroup.rotation.z *= 0.8;
        
        gridHelper.position.z -= speed;
        if (gridHelper.position.z < -3) gridHelper.position.z = 0;

        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
