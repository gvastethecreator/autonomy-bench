<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Night Drive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030008;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            pointer-events: none;
            z-index: 10;
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 3px;
        }
        #vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.85) 100%);
            z-index: 5;
        }
        #scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.25));
            background-size: 100% 4px;
            opacity: 0.6;
            z-index: 6;
        }
    </style>
</head>
<body>
    <div id="ui">SPEED: 185 KM/H</div>
    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ----------------------------------------------------
        // Scene Setup
        // ----------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030008);
        scene.fog = new THREE.FogExp2(0x030008, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const cameraBaseY = 2.5;
        camera.position.set(0, cameraBaseY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ----------------------------------------------------
        // Post-Processing (Bloom)
        // ----------------------------------------------------
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, // strength
            0.5, // radius
            0.1  // threshold
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ----------------------------------------------------
        // Endless Terrain
        // ----------------------------------------------------
        const terrainWidth = 240;
        const terrainDepth = 400;
        const terrainSegmentsW = 60;
        const terrainSegmentsD = 120;
        const segmentLength = terrainDepth / terrainSegmentsD; 

        const terrainGeometry = new THREE.PlaneGeometry(terrainWidth, terrainDepth, terrainSegmentsW, terrainSegmentsD);
        terrainGeometry.rotateX(-Math.PI / 2);
        terrainGeometry.translate(0, 0, -terrainDepth / 2);

        // Wireframe for the synthwave grid
        const terrainMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xff00cc, 
            wireframe: true 
        });
        
        // Solid dark material underneath to occlude wireframes of mountains behind mountains
        const solidMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x030008, 
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1
        });

        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        const terrainSolid = new THREE.Mesh(terrainGeometry, solidMaterial);
        
        scene.add(terrain);
        scene.add(terrainSolid);

        // Procedural height function
        function getHeight(x, z) {
            const absX = Math.abs(x);
            const roadWidth = 14;
            if (absX < roadWidth) return 0; // Flat road
            
            let h = (absX - roadWidth) * 0.7; // Base slope
            
            // Complex rolling hills
            h += Math.sin(x * 0.05) * 6.0;
            h += Math.sin(z * 0.02) * 12.0;
            h += Math.sin(x * 0.1 + z * 0.05) * 5.0;
            h += Math.sin(x * 0.03 - z * 0.02) * 8.0;
            
            return Math.max(0, h); // Clamp to road level
        }

        // ----------------------------------------------------
        // Road and Lines
        // ----------------------------------------------------
        const roadGeometry = new THREE.PlaneGeometry(28, terrainDepth);
        roadGeometry.rotateX(-Math.PI / 2);
        roadGeometry.translate(0, 0, -terrainDepth / 2);
        const roadMaterial = new THREE.MeshBasicMaterial({ color: 0x010003 });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.position.y = 0.1;
        scene.add(road);

        // Cyan edge lines
        const edgeGeo = new THREE.PlaneGeometry(0.4, terrainDepth);
        edgeGeo.rotateX(-Math.PI / 2);
        edgeGeo.translate(0, 0, -terrainDepth / 2);
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        const leftEdge = new THREE.Mesh(edgeGeo, edgeMat);
        leftEdge.position.set(-13, 0.2, 0);
        scene.add(leftEdge);

        const rightEdge = new THREE.Mesh(edgeGeo, edgeMat);
        rightEdge.position.set(13, 0.2, 0);
        scene.add(rightEdge);

        // Pink dashed center lines
        const lineGroup = new THREE.Group();
        const lineGeo = new THREE.PlaneGeometry(0.4, 6);
        lineGeo.rotateX(-Math.PI / 2);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xff00cc });

        const numLines = 40;
        const lineSpacing = 10;
        for(let i=0; i<numLines; i++) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(0, 0.2, -i * lineSpacing);
            lineGroup.add(line);
        }
        scene.add(lineGroup);

        // ----------------------------------------------------
        // Passing Light Poles
        // ----------------------------------------------------
        const polesGroup = new THREE.Group();
        const poleGeo = new THREE.BoxGeometry(0.4, 14, 0.4);
        const poleMat = new THREE.MeshBasicMaterial({ color: 0x010002 });
        const lightGeo = new THREE.BoxGeometry(3, 0.4, 0.4);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        const numPoles = 20;
        const poleSpacing = 20;
        for(let i = 0; i < numPoles; i++) {
            // Left pole
            const p1 = new THREE.Mesh(poleGeo, poleMat);
            p1.position.set(-14.5, 7, -i * poleSpacing);
            const l1 = new THREE.Mesh(lightGeo, lightMat);
            l1.position.set(1.5, 6.8, 0); 
            p1.add(l1);
            polesGroup.add(p1);

            // Right pole
            const p2 = new THREE.Mesh(poleGeo, poleMat);
            p2.position.set(14.5, 7, -i * poleSpacing);
            const l2 = new THREE.Mesh(lightGeo, lightMat);
            l2.position.set(-1.5, 6.8, 0); 
            p2.add(l2);
            polesGroup.add(p2);
        }
        scene.add(polesGroup);

        // ----------------------------------------------------
        // Retro Striped Sun
        // ----------------------------------------------------
        const sunCanvas = document.createElement('canvas');
        sunCanvas.width = 512;
        sunCanvas.height = 512;
        const sunCtx = sunCanvas.getContext('2d');

        // Gradient
        const sunGrad = sunCtx.createLinearGradient(0, 0, 0, 512);
        sunGrad.addColorStop(0, '#ffbb00');
        sunGrad.addColorStop(0.5, '#ff0055');
        sunGrad.addColorStop(1, '#6600cc');
        sunCtx.fillStyle = sunGrad;
        sunCtx.beginPath();
        sunCtx.arc(256, 256, 256, 0, Math.PI * 2);
        sunCtx.fill();

        // Cutout stripes
        sunCtx.globalCompositeOperation = 'destination-out';
        let currentY = 512;
        let stripeHeight = 16;
        let gapHeight = 10;
        while (currentY > 256) { 
            sunCtx.fillRect(0, currentY - stripeHeight, 512, stripeHeight);
            currentY -= (stripeHeight + gapHeight);
            stripeHeight *= 0.85; 
            gapHeight *= 0.85;    
        }

        const sunTexture = new THREE.CanvasTexture(sunCanvas);
        sunTexture.needsUpdate = true;
        const sunMatUI = new THREE.MeshBasicMaterial({ 
            map: sunTexture, 
            transparent: true, 
            fog: false,
            color: 0xffffff
        });
        const sunGeoUI = new THREE.PlaneGeometry(220, 220);
        const sunMesh = new THREE.Mesh(sunGeoUI, sunMatUI);
        sunMesh.position.set(0, 45, -380);
        scene.add(sunMesh);

        // ----------------------------------------------------
        // Road Reflection
        // ----------------------------------------------------
        const refCanvas = document.createElement('canvas');
        refCanvas.width = 128;
        refCanvas.height = 512;
        const refCtx = refCanvas.getContext('2d');
        const refGrad = refCtx.createLinearGradient(0, 0, 0, 512);
        refGrad.addColorStop(0, 'rgba(255, 0, 85, 0.8)');
        refGrad.addColorStop(0.4, 'rgba(102, 0, 204, 0.4)');
        refGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        refCtx.fillStyle = refGrad;
        refCtx.fillRect(0, 0, 128, 512);

        // Scanlines on reflection
        refCtx.globalCompositeOperation = 'destination-out';
        for(let i=0; i<512; i+=4) {
            refCtx.fillRect(0, i, 128, 1);
        }

        const refTex = new THREE.CanvasTexture(refCanvas);
        refTex.needsUpdate = true;
        const refMat = new THREE.MeshBasicMaterial({
            map: refTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            fog: true,
            opacity: 0.7
        });
        const refGeo = new THREE.PlaneGeometry(12, 200);
        refGeo.rotateX(-Math.PI / 2);
        const reflection = new THREE.Mesh(refGeo, refMat);
        reflection.position.set(0, 0.15, -100);
        scene.add(reflection);

        // ----------------------------------------------------
        // Starfield
        // ----------------------------------------------------
        const starsCount = 2000;
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i += 3) {
            starsPos[i] = (Math.random() - 0.5) * 800; 
            starsPos[i+1] = Math.random() * 300 + 30; 
            starsPos[i+2] = -Math.random() * 500; 
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 1.5, 
            transparent: true, 
            opacity: 0.8, 
            fog: false 
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ----------------------------------------------------
        // Car Interior / Dashboard
        // ----------------------------------------------------
        const dashGroup = new THREE.Group();

        // Main dash body
        const dashGeo = new THREE.BoxGeometry(16, 3, 4);
        const dashMat = new THREE.MeshBasicMaterial({ color: 0x010002 });
        const dash = new THREE.Mesh(dashGeo, dashMat);
        dash.position.set(0, 0, -2);
        dashGroup.add(dash);

        // Neon strip across dash
        const dashLineGeo = new THREE.BoxGeometry(16, 0.05, 0.05);
        const dashLineMat = new THREE.MeshBasicMaterial({ color: 0xff00cc });
        const dashLine = new THREE.Mesh(dashLineGeo, dashLineMat);
        dashLine.position.set(0, 1.5, -0.5);
        dashGroup.add(dashLine);

        // Steering Wheel
        const wheelGeo = new THREE.TorusGeometry(0.7, 0.1, 16, 32);
        const wheelMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(0, 1.3, -1.2);
        wheel.rotation.x = -Math.PI / 3.5;
        dashGroup.add(wheel);

        // Animated Screens
        const screenCanvas = document.createElement('canvas');
        screenCanvas.width = 128;
        screenCanvas.height = 128;
        const screenCtx = screenCanvas.getContext('2d');
        const screenTex = new THREE.CanvasTexture(screenCanvas);
        const screenMatD = new THREE.MeshBasicMaterial({ map: screenTex, transparent: true, opacity: 0.8 });
        const screenGeoUI = new THREE.PlaneGeometry(1.2, 0.8);

        const screenL = new THREE.Mesh(screenGeoUI, screenMatD);
        screenL.position.set(-2.2, 1.3, -1.0);
        screenL.rotation.x = -Math.PI / 6;
        screenL.rotation.y = Math.PI / 8;
        dashGroup.add(screenL);

        const screenR = new THREE.Mesh(screenGeoUI, screenMatD);
        screenR.position.set(2.2, 1.3, -1.0);
        screenR.rotation.x = -Math.PI / 6;
        screenR.rotation.y = -Math.PI / 8;
        dashGroup.add(screenR);

        scene.add(dashGroup);

        // ----------------------------------------------------
        // Animation Loop
        // ----------------------------------------------------
        const clock = new THREE.Clock();
        const speed = 90;
        const uiElement = document.getElementById('ui');

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Animate Dashed Lines
            lineGroup.children.forEach(line => {
                line.position.z += speed * delta;
                if (line.position.z > 5) {
                    line.position.z -= numLines * lineSpacing;
                }
            });

            // Animate Poles
            polesGroup.children.forEach(pole => {
                pole.position.z += speed * delta;
                if (pole.position.z > 10) {
                    pole.position.z -= numPoles * poleSpacing;
                }
            });

            // Animate Terrain (Perfect infinite loop)
            const travelDist = speed * time;
            const meshOffset = travelDist % segmentLength;
            const n = Math.floor(travelDist / segmentLength);

            terrain.position.z = meshOffset;
            terrainSolid.position.z = meshOffset;

            const positions = terrainGeometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const localZ = positions.getZ(i);
                const sampleZ = localZ - n * segmentLength; 
                const y = getHeight(x, sampleZ);
                positions.setY(i, y);
            }
            positions.needsUpdate = true;

            // Camera and wheel bobbing
            camera.position.y = cameraBaseY + Math.sin(time * 12) * 0.03;
            camera.position.x = Math.sin(time * 2) * 0.02;
            camera.rotation.z = Math.sin(time * 1.5) * 0.005;
            
            wheel.rotation.z = Math.sin(time * 1.5) * 0.05;
            stars.rotation.y = time * 0.01;

            // Update screens randomly
            if (Math.random() > 0.85) {
                screenCtx.fillStyle = '#010002';
                screenCtx.fillRect(0, 0, 128, 128);
                screenCtx.fillStyle = '#00ffff';
                for(let i=0; i<8; i++) {
                    const h = Math.random() * 100 + 10;
                    screenCtx.fillRect(10 + i * 14, 120 - h, 10, h);
                }
                screenTex.needsUpdate = true;
            }

            // Update Speed UI
            if (Math.random() > 0.8) {
                const speedVal = 185 + Math.floor(Math.random() * 6);
                uiElement.innerText = `SPEED: ${speedVal} KM/H`;
            }

            composer.render();
        }

        // ----------------------------------------------------
        // Resize Handler
        // ----------------------------------------------------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
    </script>
</body>
</html>
