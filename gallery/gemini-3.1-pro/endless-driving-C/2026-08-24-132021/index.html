<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PACIFIC ROUTE 1 · Coastal Night Showcase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #030714; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    
    #cinematic-frame {
      position: absolute; inset: 0; pointer-events: none;
      border-top: 14px solid rgba(2, 6, 16, 0.75);
      border-bottom: 14px solid rgba(2, 6, 16, 0.75);
      z-index: 5;
    }

    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 30px;
    }

    .glass-box {
      background: rgba(8, 18, 36, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 12px;
      padding: 12px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); pointer-events: auto;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand h1 {
      font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand p { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }

    .telemetry { display: flex; gap: 20px; }
    .gauge { display: flex; flex-direction: column; align-items: flex-end; }
    .gauge-val { font-size: 26px; font-weight: 800; font-family: monospace; color: #38bdf8; line-height: 1; }
    .gauge-lbl { font-size: 9px; text-transform: uppercase; color: #64748b; margin-top: 3px; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
    .btn-row { display: flex; gap: 8px; }
    .btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(56, 189, 248, 0.25);
      color: #e2e8f0; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
    .btn.active { background: rgba(56, 189, 248, 0.35); border-color: #38bdf8; }

    #start-card {
      position: absolute; inset: 0; background: rgba(3, 7, 20, 0.85); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; cursor: pointer;
    }
    .card {
      background: rgba(8, 18, 36, 0.9); border: 1px solid #38bdf8; border-radius: 16px;
      padding: 30px 45px; text-align: center; box-shadow: 0 0 50px rgba(56, 189, 248, 0.3);
    }
    .card h2 { font-size: 22px; color: #38bdf8; margin-bottom: 8px; letter-spacing: 2px; }
    .card p { font-size: 13px; color: #94a3b8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="cinematic-frame"></div>

  <div id="start-card" onclick="initDrive()">
    <div class="card">
      <h2>PACIFIC ROUTE 1 · NIGHT CRUISE</h2>
      <p>Click anywhere to launch coastal soundscape & drive</p>
    </div>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="glass-box brand">
        <h1>PACIFIC ROUTE 1</h1>
        <p>Big Sur Coastal Night Showcase</p>
      </div>

      <div class="glass-box telemetry">
        <div class="gauge">
          <div class="gauge-val" id="spdText">0</div>
          <div class="gauge-lbl">Speed (MPH)</div>
        </div>
        <div class="gauge">
          <div class="gauge-val" style="color: #a855f7;" id="distText">0.0</div>
          <div class="gauge-lbl">Distance (MI)</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="glass-box btn-row">
        <button class="btn active" id="btnCam" onclick="cycleCam()">🎥 View: <span id="camText">Chase 3P</span></button>
        <button class="btn" id="btnSky" onclick="cycleSky()">🌌 Sky: <span id="skyText">Pacific Night</span></button>
        <button class="btn" id="btnAudio" onclick="toggleAudio()">🔊 Audio: <span id="audioText">ON</span></button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* Audio Engine */
    let actx = null, driveStarted = false, muted = false;
    let engineOsc = null, engineGain = null, oceanGain = null;

    function initDrive() {
      if (driveStarted) return;
      driveStarted = true;
      document.getElementById('start-card').style.display = 'none';

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();

        engineOsc = actx.createOscillator();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 48;
        const eFilt = actx.createBiquadFilter();
        eFilt.type = 'lowpass'; eFilt.frequency.value = 200;
        engineGain = actx.createGain(); engineGain.gain.value = 0.04;
        engineOsc.connect(eFilt); eFilt.connect(engineGain); engineGain.connect(actx.destination);
        engineOsc.start();

        const bSize = actx.sampleRate * 2;
        const nBuf = actx.createBuffer(1, bSize, actx.sampleRate);
        const out = nBuf.getChannelData(0);
        for (let i = 0; i < bSize; i++) out[i] = (Math.random() * 2 - 1) * 0.3;
        const noise = actx.createBufferSource();
        noise.buffer = nBuf; noise.loop = true;
        const oFilter = actx.createBiquadFilter();
        oFilter.type = 'lowpass'; oFilter.frequency.value = 350;
        oceanGain = actx.createGain(); oceanGain.gain.value = 0.035;
        noise.connect(oFilter); oFilter.connect(oceanGain); oceanGain.connect(actx.destination);
        noise.start();
      } catch (e) {}
    }

    function toggleAudio() {
      muted = !muted;
      document.getElementById('audioText').textContent = muted ? "OFF" : "ON";
      if (engineGain && oceanGain) {
        engineGain.gain.value = muted ? 0 : 0.04;
        oceanGain.gain.value = muted ? 0 : 0.035;
      }
    }

    /* Three.js Environment */
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030714, 0.0025);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    scene.add(new THREE.AmbientLight(0x0d1e38, 0.8));

    const moon = new THREE.DirectionalLight(0x38bdf8, 1.4);
    moon.position.set(120, 300, 100);
    scene.add(moon);

    // Coastal Highway Road
    const ROAD_W = 16, ROAD_L = 1000, NUM_SEGS = 50, SEG_L = 20;
    const roadSegments = [];

    const asphaltGeo = new THREE.PlaneGeometry(ROAD_W, SEG_L).rotateX(-Math.PI / 2);
    const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x0f1522, roughness: 0.5, metalness: 0.6 });

    for (let i = 0; i < NUM_SEGS; i++) {
      const seg = new THREE.Group();
      seg.add(new THREE.Mesh(asphaltGeo, asphaltMat));

      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, SEG_L * 0.4).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      line.position.set(0, 0.02, 0);
      seg.add(line);

      seg.position.z = i * SEG_L;
      scene.add(seg);
      roadSegments.push(seg);
    }

    // Pacific Ocean (Right Side)
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(600, ROAD_L).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x003355, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.85 })
    );
    ocean.position.set(ROAD_W / 2 + 300, -0.6, 0);
    scene.add(ocean);

    // Player Car
    const playerCar = new THREE.Group();
    const carMesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.3, 0.8, 4.8),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.15, metalness: 0.9 })
    );
    carMesh.position.y = 0.55;
    playerCar.add(carMesh);

    const headL = new THREE.SpotLight(0xffffff, 4.5, 180, Math.PI / 5, 0.35);
    headL.position.set(-0.8, 0.65, 2.4);
    const tL = new THREE.Object3D(); tL.position.set(-0.8, 0.2, 45);
    playerCar.add(headL); playerCar.add(tL); headL.target = tL;

    const headR = new THREE.SpotLight(0xffffff, 4.5, 180, Math.PI / 5, 0.35);
    headR.position.set(0.8, 0.65, 2.4);
    const tR = new THREE.Object3D(); tR.position.set(0.8, 0.2, 45);
    playerCar.add(headR); playerCar.add(tR); headR.target = tR;

    scene.add(playerCar);

    // Controls
    const keys = { w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    let currentSpeed = 75;
    let carX = 0, steer = 0, camMode = 0, distance = 0;

    function cycleCam() {
      camMode = (camMode + 1) % 2;
      document.getElementById('camText').textContent = camMode === 0 ? "Chase 3P" : "Cockpit 1P";
    }
    function cycleSky() {}

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (keys.w) currentSpeed = Math.min(currentSpeed + 30 * dt, 130);
      else if (keys.s) currentSpeed = Math.max(currentSpeed - 45 * dt, 20);
      else currentSpeed = Math.max(currentSpeed - 6 * dt, 65);

      if (keys.a) steer = Math.max(steer - 3.8 * dt, -0.06);
      else if (keys.d) steer = Math.min(steer + 3.8 * dt, 0.06);
      else steer *= 0.84;

      carX += steer * (currentSpeed * 0.075);
      carX = THREE.MathUtils.clamp(carX, -ROAD_W / 2 + 2, ROAD_W / 2 - 2);

      playerCar.position.x = carX;
      playerCar.rotation.y = -steer * 4.0;

      const move = (currentSpeed * 0.447) * dt * 7.5;
      distance += (currentSpeed * dt) / 3600;

      for (let i = 0; i < NUM_SEGS; i++) {
        roadSegments[i].position.z -= move;
        if (roadSegments[i].position.z < -SEG_L) roadSegments[i].position.z += NUM_SEGS * SEG_L;
      }

      if (camMode === 0) {
        camera.position.set(carX * 0.6, 3.4, playerCar.position.z - 9.0);
        camera.lookAt(carX * 0.85, 1.3, playerCar.position.z + 20);
      } else {
        camera.position.set(carX, 1.3, playerCar.position.z + 0.3);
        camera.lookAt(carX, 1.1, playerCar.position.z + 35);
      }

      document.getElementById('spdText').textContent = Math.round(currentSpeed);
      document.getElementById('distText').textContent = distance.toFixed(1);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
