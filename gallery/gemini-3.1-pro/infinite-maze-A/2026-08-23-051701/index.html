<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinite Maze A - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    #hud { position: absolute; top: 10px; width: 100%; text-align: center; color: #0f0; font-family: monospace; }
  </style>
</head>
<body>
  <div id="hud">Infinite Maze (Level A) - WASD to move</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 2, 15);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.PointLight(0x00ff00, 1, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x222222));

    const wallGeo = new THREE.BoxGeometry(1, 3, 1);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const walls = [];
    for (let x = -10; x <= 10; x++) {
        for (let z = -10; z <= 10; z++) {
            if (Math.random() > 0.7 && (x !== 0 || z !== 0)) {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(x * 2, 1.5, z * 2);
                scene.add(wall);
                walls.push(wall);
            }
        }
    }

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    let yaw = 0;
    document.addEventListener('mousemove', e => {
        if (document.pointerLockElement === document.body) {
            yaw -= e.movementX * 0.002;
        }
    });
    document.body.addEventListener('click', () => document.body.requestPointerLock());

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        
        const speed = 0.05;
        const dir = new THREE.Vector3();
        if (keys.w) dir.z -= speed;
        if (keys.s) dir.z += speed;
        if (keys.a) dir.x -= speed;
        if (keys.d) dir.x += speed;
        
        dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.position.add(dir);
        camera.rotation.y = yaw;
        
        light.position.copy(camera.position);

        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
