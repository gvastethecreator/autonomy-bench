<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Procedural Biped B - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #f0f4f8; font-family: system-ui, sans-serif; }
    #hud { position: absolute; top: 20px; left: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 250px; }
    h2 { margin: 0 0 15px 0; font-size: 18px; color: #102a43; }
    .slider-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #486581; font-weight: 600; }
    input[type=range] { width: 100%; }
    .val { float: right; color: #334e68; font-weight: normal; }
  </style>
</head>
<body>
  <div id="hud">
    <h2>Biped Kinematics (Level B)</h2>
    <div class="slider-group">
      <label>Walk Speed <span class="val" id="speed-val">1.0</span></label>
      <input type="range" id="speed" min="0" max="3" step="0.1" value="1.0">
    </div>
    <div class="slider-group">
      <label>Stride Length <span class="val" id="stride-val">1.0</span></label>
      <input type="range" id="stride" min="0.5" max="2" step="0.1" value="1.0">
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f4f8);
    scene.fog = new THREE.Fog(0xf0f4f8, 10, 50);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(-10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    scene.add(dirLight);

    const grid = new THREE.GridHelper(30, 30, 0x9fb3c8, 0xd9e2ec);
    scene.add(grid);

    // Advanced Biped Model
    const biped = new THREE.Group();
    const material = new THREE.MeshStandardMaterial({ color: 0x627d98, roughness: 0.3, metalness: 0.2 });
    
    // Torso
    const torsoGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.6);
    const torso = new THREE.Mesh(torsoGeo, material);
    torso.position.y = 2.4;
    torso.castShadow = true;
    biped.add(torso);

    // Head
    const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const head = new THREE.Mesh(headGeo, material);
    head.position.y = 1.2;
    head.castShadow = true;
    torso.add(head);

    // Arms
    const armGeo = new THREE.BoxGeometry(0.25, 1.2, 0.25);
    const armL = new THREE.Mesh(armGeo, material);
    armL.position.set(-0.7, 0.2, 0);
    armL.castShadow = true;
    torso.add(armL);
    
    const armR = new THREE.Mesh(armGeo, material);
    armR.position.set(0.7, 0.2, 0);
    armR.castShadow = true;
    torso.add(armR);

    // Legs
    const upperLegGeo = new THREE.BoxGeometry(0.3, 1, 0.3);
    const lowerLegGeo = new THREE.BoxGeometry(0.25, 1, 0.25);
    
    const createLeg = (x) => {
        const pivot = new THREE.Group();
        pivot.position.set(x, -0.8, 0);
        
        const upper = new THREE.Mesh(upperLegGeo, material);
        upper.position.y = -0.5;
        upper.castShadow = true;
        pivot.add(upper);
        
        const knee = new THREE.Group();
        knee.position.y = -0.5;
        upper.add(knee);
        
        const lower = new THREE.Mesh(lowerLegGeo, material);
        lower.position.y = -0.5;
        lower.castShadow = true;
        knee.add(lower);
        
        torso.add(pivot);
        return { pivot, knee };
    };

    const legL = createLeg(-0.3);
    const legR = createLeg(0.3);

    scene.add(biped);

    // UI Logic
    let speed = 1.0;
    let stride = 1.0;
    document.getElementById('speed').addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        document.getElementById('speed-val').innerText = speed.toFixed(1);
    });
    document.getElementById('stride').addEventListener('input', (e) => {
        stride = parseFloat(e.target.value);
        document.getElementById('stride-val').innerText = stride.toFixed(1);
    });

    let time = 0;
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        
        time += 0.05 * speed;
        
        // Procedural Animation Logic
        const cycleL = time;
        const cycleR = time + Math.PI;
        
        // Hip rotation
        legL.pivot.rotation.x = Math.sin(cycleL) * 0.6 * stride;
        legR.pivot.rotation.x = Math.sin(cycleR) * 0.6 * stride;
        
        // Knee bending (only bend backward)
        legL.knee.rotation.x = Math.max(0, -Math.cos(cycleL) * 1.2 * stride);
        legR.knee.rotation.x = Math.max(0, -Math.cos(cycleR) * 1.2 * stride);
        
        // Arm swinging (opposite to legs)
        armL.rotation.x = -Math.sin(cycleL) * 0.5 * stride;
        armR.rotation.x = -Math.sin(cycleR) * 0.5 * stride;
        
        // Torso bobbing
        torso.position.y = 2.4 + Math.abs(Math.cos(cycleL)) * 0.1 * stride;
        
        // Move biped forward
        biped.position.z += 0.02 * speed * stride;
        if(biped.position.z > 15) biped.position.z = -15;

        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
