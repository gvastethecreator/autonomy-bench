<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Rollercoaster</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 600);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const groundGeo = new THREE.PlaneGeometry(2000, 2000);
        const groundMat = new THREE.MeshPhongMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        for (let i = 0; i < 150; i++) {
            const h = Math.random() * 50 + 10;
            const geo = new THREE.BoxGeometry(10, h, 10);
            const mat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(
                (Math.random() - 0.5) * 800,
                h / 2,
                (Math.random() - 0.5) * 800
            );
            scene.add(mesh);
        }

        const points = [
            new THREE.Vector3(0, 10, -150),
            new THREE.Vector3(80, 70, -120),
            new THREE.Vector3(150, 20, 0),
            new THREE.Vector3(80, 5, 120),
            new THREE.Vector3(0, 80, 150),
            new THREE.Vector3(-80, 20, 80),
            new THREE.Vector3(-150, 100, 0),
            new THREE.Vector3(-80, 40, -80)
        ];
        
        const curve = new THREE.CatmullRomCurve3(points, true);
        
        const trackSteps = 500;
        const tubeGeo = new THREE.TubeGeometry(curve, trackSteps, 2, 8, true);
        const tubeMat = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
        const track = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(track);

        const supportGeo = new THREE.CylinderGeometry(1, 1, 1);
        const supportMat = new THREE.MeshPhongMaterial({ color: 0x555555 });
        
        for (let i = 0; i < trackSteps; i += 8) {
            const t = i / trackSteps;
            const pt = curve.getPointAt(t);
            if (pt.y > 1) {
                const support = new THREE.Mesh(supportGeo, supportMat);
                support.position.set(pt.x, pt.y / 2, pt.z);
                support.scale.y = pt.y;
                scene.add(support);
            }
        }

        let t = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            const currentPoint = curve.getPointAt(t);
            const speedModifier = Math.max(0.02, (150 - currentPoint.y) * 0.0008); 
            const speed = speedModifier * delta * 15;
            
            t += speed;
            if (t > 1) t -= 1;

            const pos = curve.getPointAt(t);
            const tangent = curve.getTangentAt(t).normalize();
            
            const up = new THREE.Vector3(0, 1, 0);
            const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
            const actualUp = new THREE.Vector3().crossVectors(right, tangent).normalize();

            const bankAngle = right.y * 2.0; 
            actualUp.applyAxisAngle(tangent, bankAngle);

            camera.position.copy(pos).add(actualUp.clone().multiplyScalar(4));
            
            const lookAtTarget = new THREE.Vector3().copy(camera.position).add(tangent);
            camera.lookAt(lookAtTarget);
            camera.up.copy(actualUp);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
