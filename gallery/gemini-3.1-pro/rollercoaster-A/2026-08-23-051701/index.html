<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rollercoaster A - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #87CEEB; }
    #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: sans-serif; pointer-events: none; text-shadow: 1px 1px 2px black; }
  </style>
</head>
<body>
  <div id="info">Rollercoaster (Level A) - Gemini 3.1 Pro</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 200, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Track
    const points = [];
    for (let i = 0; i <= 100; i++) {
        const t = i / 100 * Math.PI * 2;
        points.push(new THREE.Vector3(
            Math.sin(t * 3) * 50,
            Math.cos(t * 2) * 20 + 20,
            Math.cos(t * 3) * 50
        ));
    }
    const curve = new THREE.CatmullRomCurve3(points, true);
    const tubeGeometry = new THREE.TubeGeometry(curve, 200, 2, 8, true);
    const tubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, wireframe: false });
    const track = new THREE.Mesh(tubeGeometry, tubeMaterial);
    scene.add(track);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    let progress = 0;
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        
        progress += 0.001;
        if (progress > 1) progress = 0;
        
        const pos = curve.getPointAt(progress);
        const lookAt = curve.getPointAt((progress + 0.01) % 1);
        
        camera.position.copy(pos);
        camera.position.y += 2; // offset for height
        camera.lookAt(lookAt);

        renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
