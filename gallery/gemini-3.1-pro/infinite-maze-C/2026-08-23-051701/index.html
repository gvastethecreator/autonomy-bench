<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinite Maze C - Gemini 3.1 Pro</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #hud { position: absolute; inset: 0; pointer-events: none; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    h1 { margin: 0; color: #fff; font-size: 24px; text-shadow: 0 0 10px #0ff; letter-spacing: 2px; }
    p { margin: 5px 0 0 0; color: #88ccff; font-size: 14px; }
    .minimap-container { width: 150px; height: 150px; background: rgba(0,20,40,0.8); border: 2px solid #0ff; border-radius: 50%; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
    #minimap { width: 100%; height: 100%; position: absolute; transform-origin: center center; }
    .player-dot { width: 6px; height: 6px; background: #f0f; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #f0f; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .scan-line { width: 100%; height: 2px; background: rgba(0, 255, 255, 0.5); position: absolute; top: 0; animation: scan 2s linear infinite; }
    @keyframes scan { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 0; } }
  </style>
</head>
<body>
  <div id="hud">
    <div class="top-bar">
      <div>
        <h1>NEURAL LABYRINTH</h1>
        <p>Level C - Dynamic Cell Generation</p>
      </div>
      <div class="minimap-container">
        <div id="minimap"></div>
        <div class="player-dot"></div>
        <div class="scan-line"></div>
      </div>
    </div>
  </div>
  <div id="crosshair"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.08);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.2));

    // Dynamic Flashlight
    const flashlight = new THREE.SpotLight(0xffffff, 4, 30, Math.PI / 5, 0.5, 1);
    camera.add(flashlight);
    flashlight.target = new THREE.Object3D();
    flashlight.target.position.set(0, 0, -1);
    camera.add(flashlight.target);
    scene.add(camera);

    const ambient = new THREE.AmbientLight(0x0a1020, 1.5);
    scene.add(ambient);

    // Grid Floor
    const floorGeo = new THREE.PlaneGeometry(1000, 1000);
    const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x051015, roughness: 0.1, metalness: 0.8,
        emissive: 0x001122, emissiveIntensity: 0.5
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Maze Generation Engine
    const wallGeo = new THREE.BoxGeometry(2, 4, 2);
    
    // Shader material for animated TRON-like walls
    const wallUniforms = {
        time: { value: 0 },
        color: { value: new THREE.Color(0x00ffff) }
    };
    const wallMat = new THREE.ShaderMaterial({
        uniforms: wallUniforms,
        vertexShader: `
            varying vec2 vUv;
            varying vec3 vPos;
            void main() {
                vUv = uv;
                vPos = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float time;
            uniform vec3 color;
            varying vec2 vUv;
            varying vec3 vPos;
            void main() {
                // Grid lines
                float gridX = smoothstep(0.95, 1.0, fract(vPos.x * 2.0));
                float gridY = smoothstep(0.95, 1.0, fract(vPos.y * 2.0 + time));
                float gridZ = smoothstep(0.95, 1.0, fract(vPos.z * 2.0));
                
                float edge = max(gridX, max(gridY, gridZ));
                
                vec3 baseColor = vec3(0.02, 0.05, 0.1);
                vec3 glowColor = color * edge * 2.0;
                
                gl_FragColor = vec4(baseColor + glowColor, 1.0);
            }
        `
    });

    const mazeCache = new Map();
    const cellSize = 2;
    const renderDist = 15; // cells
    const mazeGroup = new THREE.Group();
    scene.add(mazeGroup);

    // Pseudo-random noise for maze
    function hash(x, z) {
        return Math.sin(x * 12.9898 + z * 78.233) * 43758.5453 % 1;
    }

    function getCell(x, z) {
        const key = `${x},${z}`;
        if (mazeCache.has(key)) return mazeCache.get(key);
        
        // Always clear 0,0 area
        if (Math.abs(x) < 2 && Math.abs(z) < 2) return false;
        
        // Maze pattern logic (organic sprawling)
        const isWall = Math.abs(hash(x, z)) > 0.65;
        mazeCache.set(key, isWall);
        return isWall;
    }

    const activeWalls = new Map();
    const minimapEl = document.getElementById('minimap');

    function updateMaze() {
        const px = Math.floor(camera.position.x / cellSize);
        const pz = Math.floor(camera.position.z / cellSize);
        
        const currentKeys = new Set();
        
        // Minimap HTML generation
        let minimapHTML = '';

        for (let dx = -renderDist; dx <= renderDist; dx++) {
            for (let dz = -renderDist; dz <= renderDist; dz++) {
                const cx = px + dx;
                const cz = pz + dz;
                const key = `${cx},${cz}`;
                currentKeys.add(key);
                
                if (getCell(cx, cz)) {
                    if (!activeWalls.has(key)) {
                        const mesh = new THREE.Mesh(wallGeo, wallMat);
                        mesh.position.set(cx * cellSize, 2, cz * cellSize);
                        mazeGroup.add(mesh);
                        activeWalls.set(key, mesh);
                    }
                    // Add to minimap (only close ones)
                    if (Math.abs(dx) <= 5 && Math.abs(dz) <= 5) {
                        const mx = 50 + (dx * 10);
                        const my = 50 + (dz * 10);
                        minimapHTML += `<div style="position:absolute; left:${mx}%; top:${my}%; width:10%; height:10%; background:#0ff; opacity:0.5;"></div>`;
                    }
                }
            }
        }
        
        // Remove far walls
        for (const [key, mesh] of activeWalls.entries()) {
            if (!currentKeys.has(key)) {
                mazeGroup.remove(mesh);
                activeWalls.delete(key);
            }
        }
        
        minimapEl.innerHTML = minimapHTML;
        // Rotate minimap to match player view
        const heading = -yaw * 180 / Math.PI;
        minimapEl.style.transform = `translate(-50%, -50%) rotate(${heading}deg)`;
    }

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    let pitch = 0, yaw = 0;
    document.addEventListener('mousemove', e => {
        if (document.pointerLockElement === document.body) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
        }
    });
    document.body.addEventListener('click', () => document.body.requestPointerLock());

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    let time = 0;
    let lastCellX = null;
    let lastCellZ = null;

    function checkCollision(nextPos) {
        // Simple bounding box collision against grid
        const buffer = 0.3;
        const px = Math.floor((nextPos.x + buffer * Math.sign(nextPos.x - camera.position.x)) / cellSize);
        const pz = Math.floor((nextPos.z + buffer * Math.sign(nextPos.z - camera.position.z)) / cellSize);
        
        // Check surrounding cells
        for(let dx=-1; dx<=1; dx++) {
            for(let dz=-1; dz<=1; dz++) {
                if(getCell(px+dx, pz+dz)) {
                    const cx = (px+dx) * cellSize;
                    const cz = (pz+dz) * cellSize;
                    // AABB collision
                    if (Math.abs(nextPos.x - cx) < (cellSize/2 + buffer) && 
                        Math.abs(nextPos.z - cz) < (cellSize/2 + buffer)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        wallUniforms.time.value = time;
        
        const speed = 0.1;
        const dir = new THREE.Vector3();
        if (keys.w) dir.z -= speed;
        if (keys.s) dir.z += speed;
        if (keys.a) dir.x -= speed;
        if (keys.d) dir.x += speed;
        
        dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        
        // Try move X
        const nextX = camera.position.clone();
        nextX.x += dir.x;
        if (!checkCollision(nextX)) camera.position.x = nextX.x;
        
        // Try move Z
        const nextZ = camera.position.clone();
        nextZ.z += dir.z;
        if (!checkCollision(nextZ)) camera.position.z = nextZ.z;
        
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
        
        // Head bob
        if(dir.lengthSq() > 0) {
            camera.position.y = 1.5 + Math.sin(time * 15) * 0.05;
        }

        // Update maze chunks if moved to new cell
        const curCellX = Math.floor(camera.position.x / cellSize);
        const curCellZ = Math.floor(camera.position.z / cellSize);
        if (curCellX !== lastCellX || curCellZ !== lastCellZ) {
            updateMaze();
            lastCellX = curCellX;
            lastCellZ = curCellZ;
        }

        composer.render();
    }
    
    // Initial generation
    updateMaze();
    animate();
  </script>
</body>
</html>
