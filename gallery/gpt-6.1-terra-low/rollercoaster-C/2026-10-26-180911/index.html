<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow — a ride above the clouds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14172d;color:#fff;font-family:'DM Sans',sans-serif}canvas{display:block}.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");mix-blend-mode:soft-light}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(16,15,34,.42) 100%)}.top{position:fixed;top:34px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font:700 15px 'Space Grotesk';letter-spacing:.23em}.brand span{color:#ffd49e}.edition{text-align:right;font-size:10px;letter-spacing:.22em;text-transform:uppercase;line-height:1.7;color:#fce6d8}.intro{position:fixed;left:7%;top:21%;max-width:500px;pointer-events:none;transition:opacity 2s,transform 2s}.intro.hide{opacity:0;transform:translateY(-12px)}.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#ffe0b5;margin-bottom:16px}.intro h1{font:500 clamp(54px,7vw,106px)/.9 'Space Grotesk';letter-spacing:-.07em;margin:0 0 18px}.intro p{font-size:14px;line-height:1.7;color:#fce6df;max-width:330px}.bottom{position:fixed;bottom:32px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:end}.ride{display:flex;gap:20px;align-items:center}.play{width:45px;height:45px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(30,28,52,.2);color:#fff;font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}.play:hover{background:rgba(255,255,255,.2)}.label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;line-height:1.9}.label strong{display:block;font:600 13px 'Space Grotesk';letter-spacing:.02em;text-transform:none}.progress{width:160px;height:2px;background:rgba(255,255,255,.3);margin-top:9px}.progress i{display:block;width:0;height:100%;background:#ffdbac}.stats{text-align:right;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#f7d7c7;line-height:1.8}.stats strong{font:500 25px 'Space Grotesk';letter-spacing:-.04em;color:#fff}.hint{position:fixed;right:42px;top:50%;transform:rotate(90deg) translateX(50%);transform-origin:right center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7)}.loading{position:fixed;inset:0;background:#201e36;display:grid;place-items:center;z-index:5;font:500 11px 'Space Grotesk';letter-spacing:.3em;text-transform:uppercase;transition:opacity 1s}.loading.done{opacity:0;pointer-events:none}@media(max-width:600px){.top{left:22px;right:22px;top:23px}.bottom{left:22px;right:22px;bottom:23px}.intro{left:7%;top:24%}.progress{width:100px}.hint{display:none}.edition{font-size:8px}}
</style>
</head>
<body>
<div class="loading" id="loading">Preparing your journey</div><div class="grain"></div><div class="vignette"></div>
<div class="top"><div class="brand">A<span>✳</span>G / AFTERGLOW</div><div class="edition">An endless escape<br>Ride no. 01 — dusk</div></div>
<div class="intro" id="intro"><div class="eyebrow">A little closer to the sky</div><h1>Chase the<br>afterglow.</h1><p>Leave the world below. Take the long way around the sun.</p></div>
<div class="hint">Made for the moment between day & night</div>
<div class="bottom"><div class="ride"><button class="play" id="play" aria-label="Pause ride">Ⅱ</button><div class="label"><strong>The sunset circuit</strong>Now riding <div class="progress"><i id="progress"></i></div></div></div><div class="stats">Altitude<br><strong><span id="alt">000</span> m</strong></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x9a8295,.0032);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.2,1600);
scene.add(new THREE.HemisphereLight(0xffdfbb,0x454c78,2.2));const sunLight=new THREE.DirectionalLight(0xffb57e,2.4);sunLight.position.set(-150,180,-200);scene.add(sunLight);
// A painted sky dome, with a broad, warm horizon.
const sky=new THREE.Mesh(new THREE.SphereGeometry(1300,32,20),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{},vertexShader:`varying vec3 vWorld; void main(){ vec4 w=modelMatrix*vec4(position,1.);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`varying vec3 vWorld;void main(){float h=normalize(vWorld).y; vec3 top=vec3(.13,.17,.32), mid=vec3(.64,.43,.52), low=vec3(1.,.65,.48);vec3 c=mix(low,mid,smoothstep(-.1,.25,h));c=mix(c,top,smoothstep(.13,.85,h));gl_FragColor=vec4(c,1.);}`}));scene.add(sky);
const sun=new THREE.Mesh(new THREE.CircleGeometry(72,64),new THREE.MeshBasicMaterial({color:0xffd6a0,fog:false}));sun.position.set(-250,95,-650);sun.lookAt(0,80,0);scene.add(sun);
const pts=[[-80,75,120],[-125,100,30],[-105,145,-80],[-25,174,-145],[90,140,-115],[145,72,-35],[115,55,80],[40,104,150],[-15,145,100],[5,85,10],[65,65,-15],[80,100,65],[25,110,170],[-45,65,195]].map(p=>new THREE.Vector3(...p));
const curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',.5);const N=900;const frames=curve.computeFrenetFrames(N,true);const railMat=new THREE.MeshStandardMaterial({color:0x583f48,metalness:.55,roughness:.3});const accent=new THREE.MeshStandardMaterial({color:0xffc58a,metalness:.3,roughness:.4,emissive:0xb45032,emissiveIntensity:.25});
function rail(offset,material,radius){let a=[];for(let i=0;i<=N;i++){let p=curve.getPointAt(i/N), side=frames.binormals[i];a.push(p.addScaledVector(side,offset));}let path=new THREE.CatmullRomCurve3(a,false);scene.add(new THREE.Mesh(new THREE.TubeGeometry(path,N,radius,8,false),material));}rail(-1.65,railMat,.22);rail(1.65,railMat,.22);rail(-1.65,accent,.065);rail(1.65,accent,.065);
const tieGeo=new THREE.BoxGeometry(3.7,.16,.34),tieMat=new THREE.MeshStandardMaterial({color:0x413746,metalness:.35,roughness:.5});const ties=new THREE.InstancedMesh(tieGeo,tieMat,300),dummy=new THREE.Object3D();for(let i=0;i<300;i++){let t=i/300,idx=Math.floor(t*N);dummy.position.copy(curve.getPointAt(t));let m=new THREE.Matrix4().makeBasis(frames.binormals[idx],frames.normals[idx],frames.tangents[idx]);dummy.quaternion.setFromRotationMatrix(m);dummy.updateMatrix();ties.setMatrixAt(i,dummy.matrix)}scene.add(ties);
// Slim structural supports descend into the cloud layer.
const supportMat=new THREE.MeshStandardMaterial({color:0x65535e,roughness:.75});for(let i=0;i<70;i++){let t=i/70,p=curve.getPointAt(t),h=p.y+12;let post=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,h,6),supportMat);post.position.set(p.x,p.y-h/2,p.z);scene.add(post)}
// Layered islands below the ride.
const islandMat=new THREE.MeshStandardMaterial({color:0x4d5361,roughness:1}),topMat=new THREE.MeshStandardMaterial({color:0x8a8275,roughness:1});let seed=77;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<60;i++){let x=(rnd()-.5)*1100,z=(rnd()-.5)*1100,rad=20+rnd()*65;let island=new THREE.Mesh(new THREE.ConeGeometry(rad,30+rnd()*55,7),islandMat);island.position.set(x,-30,z);island.rotation.y=rnd()*6;scene.add(island);let cap=new THREE.Mesh(new THREE.CylinderGeometry(rad*.95,rad*.7,5,7),topMat);cap.position.set(x,-8,z);cap.rotation.y=island.rotation.y;scene.add(cap)}
// Soft translucent cloud puffs; their arrangement is fixed for a calm backdrop.
const cloudGeo=new THREE.SphereGeometry(1,8,6);const cloudMat=new THREE.MeshBasicMaterial({color:0xffd5c1,transparent:true,opacity:.2,depthWrite:false});const clouds=new THREE.InstancedMesh(cloudGeo,cloudMat,420);for(let i=0;i<420;i++){dummy.position.set((rnd()-.5)*1300,-2+rnd()*20,(rnd()-.5)*1300);dummy.scale.set(18+rnd()*55,4+rnd()*9,12+rnd()*30);dummy.updateMatrix();clouds.setMatrixAt(i,dummy.matrix)}scene.add(clouds);
// A quiet suggestion of the front of the car anchors the first-person view.
const car=new THREE.Group();const shell=new THREE.Mesh(new THREE.SphereGeometry(1,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x662e38,metalness:.5,roughness:.34}));shell.scale.set(2.1,.65,1);shell.position.set(0,-1.05,-2.3);car.add(shell);const bar=new THREE.Mesh(new THREE.TorusGeometry(1.45,.08,8,36,Math.PI),accent);bar.position.set(0,-.9,-2.1);car.add(bar);camera.add(car);scene.add(camera);
let running=true,t=0,last=performance.now();const duration=100;const target=new THREE.Vector3(),up=new THREE.Vector3();function animate(now){requestAnimationFrame(animate);let dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;if(running)t=(t+dt/duration)%1;let idx=Math.floor(t*N);let pos=curve.getPointAt(t),ahead=curve.getPointAt((t+.004)%1);camera.position.copy(pos).addScaledVector(frames.normals[idx],1.25);up.copy(frames.normals[idx]);camera.up.lerp(up,.045).normalize();target.copy(ahead).addScaledVector(up,1.1);camera.lookAt(target);renderer.render(scene,camera);document.getElementById('progress').style.width=(t*100)+'%';document.getElementById('alt').textContent=Math.max(0,Math.round(pos.y+120)).toString().padStart(3,'0')};requestAnimationFrame(animate);
document.getElementById('play').addEventListener('click',()=>{running=!running;document.getElementById('play').textContent=running?'Ⅱ':'▶';document.getElementById('play').setAttribute('aria-label',running?'Pause ride':'Resume ride')});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').classList.add('done');setTimeout(()=>document.getElementById('intro').classList.add('hide'),7000);
</script></body></html>
