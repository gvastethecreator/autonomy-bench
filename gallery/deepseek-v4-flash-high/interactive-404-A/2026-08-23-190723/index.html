<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found</title>
<style>
  :root {
    --bg-0: #070b14;
    --bg-1: #0d1424;
    --accent: #4fd1ff;
    --accent-2: #7b6cff;
    --accent-3: #ff5f9e;
    --text: #e8eefc;
    --text-dim: #8b96b4;
    --glow: rgba(79, 209, 255, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% -20%, #15203c 0%, var(--bg-0) 55%) fixed;
    background-color: var(--bg-0);
    overflow: hidden;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Animated aurora blobs behind everything */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    filter: blur(70px);
    opacity: 0.5;
    pointer-events: none;
  }
  .aurora::before,
  .aurora::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    width: 45vmax;
    height: 45vmax;
    animation: drift 22s ease-in-out infinite;
  }
  .aurora::before {
    top: -20%;
    left: -15%;
    background: radial-gradient(circle, rgba(79, 209, 255, 0.28), transparent 65%);
  }
  .aurora::after {
    bottom: -25%;
    right: -15%;
    background: radial-gradient(circle, rgba(123, 108, 255, 0.28), transparent 65%);
    animation-delay: -11s;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vmax, -4vmax) scale(1.15); }
  }

  /* Interactive particle canvas */
  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 46rem;
  }

  /* The big 404 with layered glitch */
  .code-wrap {
    position: relative;
    display: inline-block;
    user-select: none;
    line-height: 1;
  }

  .code {
    font-size: clamp(7rem, 24vw, 16rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(120deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px var(--glow));
    position: relative;
    font-family: "Inter", "Segoe UI", sans-serif;
  }

  /* Glitch ghost layers */
  .code-wrap[data-glitch]::before,
  .code-wrap[data-glitch]::after {
    content: attr(data-glitch);
    position: absolute;
    inset: 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    pointer-events: none;
    opacity: 0;
  }
  .code-wrap[data-glitch]::before {
    color: var(--accent-2);
    background: none;
    transform: translate(-3px, 0);
  }
  .code-wrap[data-glitch]::after {
    color: var(--accent-3);
    background: none;
    transform: translate(3px, 0);
  }
  .code-wrap[data-glitch].glitching::before,
  .code-wrap[data-glitch].glitching::after {
    animation: glitch 0.5s steps(2, jump-none) both;
  }
  @keyframes glitch {
    0% { opacity: 0; }
    10% { opacity: 0.9; }
    30% { opacity: 0; }
    50% { opacity: 0.8; }
    70% { opacity: 0; }
    100% { opacity: 0; }
  }

  .title {
    margin-top: 1.6rem;
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .message {
    margin-top: 0.85rem;
    color: var(--text-dim);
    font-size: clamp(1rem, 2.6vw, 1.15rem);
    line-height: 1.6;
    max-width: 34rem;
    margin-left: auto;
    margin-right: auto;
  }

  .hint {
    margin-top: 0.6rem;
    font-size: 0.9rem;
    color: rgba(139, 150, 180, 0.85);
    font-style: italic;
  }

  .home {
    margin-top: 2.4rem;
    display: inline-block;
    padding: 0.9rem 2.1rem;
    font-size: 1rem;
    font-weight: 600;
    color: #06121f;
    text-decoration: none;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px -8px var(--glow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .home:hover {
    transform: translateY(-3px);
    filter: brightness(1.08);
    box-shadow: 0 16px 38px -8px var(--glow);
  }
  .home:active {
    transform: translateY(0);
  }
  .home:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  /* Floating "error" tag */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid rgba(79, 209, 255, 0.35);
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(79, 209, 255, 0.08);
    animation: pulse 3s ease-in-out infinite;
  }
  .tag .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--glow);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79, 209, 255, 0.35); }
    50% { box-shadow: 0 0 0 12px rgba(79, 209, 255, 0); }
  }

  footer {
    position: fixed;
    bottom: 1.2rem;
    left: 0;
    right: 0;
    z-index: 2;
    text-align: center;
    font-size: 0.82rem;
    color: rgba(139, 150, 180, 0.6);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<main>
  <div class="tag"><span class="dot"></span> Lost in space</div>

  <div class="code-wrap" data-glitch="404">
    <span class="code">404</span>
  </div>

  <h1 class="title">This page wandered off</h1>
  <p class="message">
    The link you followed is broken, or the page has been moved. Don&#8217;t worry —
    you can get back on track from here.
  </p>
  <p class="hint" id="hint">Tip: keep your eyes on the constellation to find your way home.</p>

  <a class="home" href="/">Take me home</a>
</main>

<footer>autonomy-bench &#8226; 404 not found</footer>

<script>
(function () {
  "use strict";

  /* ---------- Interactive constellation background ---------- */
  var canvas = document.getElementById("stars");
  var ctx = canvas.getContext("2d");
  var stars = [];
  var mouse = { x: -9999, y: -9999 };
  var lastX = -9999, lastY = -9999;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var COUNT = 130;
  var LINK_DIST = 130;
  var MOUSE_RADIUS = 160;

  function resize() {
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function makeStar(i) {
    return {
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.6 + 0.4,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      tw: Math.random() * Math.PI * 2,
      ts: 0.008 + Math.random() * 0.02,
      hue: i % 3 === 0 ? 255 : i % 3 === 1 ? 262 : 328
    };
  }

  function init() {
    resize();
    stars = [];
    for (var i = 0; i < COUNT; i++) stars.push(makeStar(i));
  }

  function step() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.x += s.vx;
      s.y += s.vy;
      s.tw += s.ts;

      // Wrap around edges for a seamless drift
      if (s.x < -10) s.x = window.innerWidth + 10;
      if (s.x > window.innerWidth + 10) s.x = -10;
      if (s.y < -10) s.y = window.innerHeight + 10;
      if (s.y > window.innerHeight + 10) s.y = -10;

      var a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "hsla(" + s.hue + ", 85%, 72%, " + a + ")";
      ctx.fill();
    }

    // Connection lines
    for (var i = 0; i < stars.length; i++) {
      var a = stars[i];
      for (var j = i + 1; j < stars.length; j++) {
        var b = stars[j];
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < LINK_DIST * LINK_DIST) {
          var alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.22;
          ctx.strokeStyle = "rgba(110, 140, 210, " + alpha + ")";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      // Links from stars near the cursor create a glowing guide
      var mx = a.x - mouse.x;
      var my = a.y - mouse.y;
      var md2 = mx * mx + my * my;
      if (md2 < MOUSE_RADIUS * MOUSE_RADIUS) {
        var alpha = (1 - Math.sqrt(md2) / MOUSE_RADIUS) * 0.5;
        ctx.strokeStyle = "rgba(79, 209, 255, " + alpha + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }
    }

    requestAnimationFrame(step);
  }

  /* Smooth mouse tracking with easing */
  function trackMouse(e) {
    lastX = e.clientX;
    lastY = e.clientY;
  }

  function easeMouse() {
    mouse.x += (lastX - mouse.x) * 0.2;
    mouse.y += (lastY - mouse.y) * 0.2;
    requestAnimationFrame(easeMouse);
  }

  window.addEventListener("resize", init);
  window.addEventListener("mousemove", trackMouse);
  window.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length) {
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }
  }, { passive: true });

  init();
  requestAnimationFrame(step);
  requestAnimationFrame(easeMouse);

  /* ---------- Glitch trigger on the 404 ---------- */
  var wrap = document.querySelector(".code-wrap");
  var timers = [2000, 5200, 3100, 7800];

  function glitchLoop() {
    wrap.classList.add("glitching");
    setTimeout(function () {
      wrap.classList.remove("glitching");
      var delay = timers[Math.floor(Math.random() * timers.length)];
      setTimeout(glitchLoop, delay);
    }, 550);
  }
  setTimeout(glitchLoop, 1800);

  /* ---------- Funny hint rotation ---------- */
  var hints = [
    "Tip: keep your eyes on the constellation to find your way home.",
    "Fun fact: unicorns also get lost, they just look graceful doing it.",
    "This page ghosted us harder than we ghosted it.",
    "Psst. The home button works. We tested it twice."
  ];
  var hintEl = document.getElementById("hint");
  var idx = Math.floor(Math.random() * hints.length) + 1;
  setInterval(function () {
    hintEl.textContent = hints[idx % hints.length];
    idx++;
  }, 5000);
})();
</script>
</body>
</html>
