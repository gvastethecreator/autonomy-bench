<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05030c">
<title>FLUID — interactive stable fluids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05030c;
    font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#fluid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* ---------- UI layer ---------- */
  .ui { position: fixed; z-index: 5; pointer-events: none; color: #fff; }

  .brand {
    top: max(24px, env(safe-area-inset-top));
    left: max(28px, env(safe-area-inset-left));
    mix-blend-mode: difference;
  }
  .brand h1 {
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 300;
    letter-spacing: 0.42em;
    line-height: 1;
    animation: fadeUp 1.4s cubic-bezier(.2,.7,.2,1) .5s both;
  }
  .brand p {
    margin-top: 9px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255,255,255,.6);
    animation: fadeUp 1.4s cubic-bezier(.2,.7,.2,1) .75s both;
  }
  .brand p .dot { color: rgba(255,255,255,.9); }

  .hint {
    bottom: max(26px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    font-size: 10.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    text-align: center;
    white-space: nowrap;
    transition: opacity 1.2s ease;
    animation: fadeUp 1.4s cubic-bezier(.2,.7,.2,1) 1.1s both;
  }
  .hint.hidden { opacity: 0; }

  .tag {
    bottom: max(26px, env(safe-area-inset-bottom));
    right: max(28px, env(safe-area-inset-right));
    font-size: 9.5px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255,255,255,.38);
    text-align: right;
    line-height: 1.9;
    animation: fadeUp 1.4s cubic-bezier(.2,.7,.2,1) .95s both;
  }

  /* ---------- Intro veil ---------- */
  .veil {
    position: fixed; inset: 0;
    background: #05030c;
    z-index: 10;
    pointer-events: none;
    animation: veilOut 1.5s ease .15s forwards;
  }
  .veil::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 20%, transparent 40%, rgba(5,3,12,.7) 100%);
  }

  /* ---------- Fallback ---------- */
  .fallback {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    align-items: center; justify-content: center;
    background: #05030c;
    color: rgba(255,255,255,.75);
    font-size: 13px;
    letter-spacing: .08em;
    text-align: center;
    padding: 24px;
  }
  .fallback b { display: block; font-weight: 400; letter-spacing: .3em; margin-bottom: 10px; color: #fff; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes veilOut {
    to { opacity: 0; visibility: hidden; }
  }

  @media (max-width: 640px) {
    .brand p { font-size: 9px; }
    .hint { white-space: normal; width: 80%; line-height: 1.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .veil { animation: none; visibility: hidden; }
    .brand h1, .brand p, .hint, .tag { animation-duration: .01s; animation-delay: 0s; }
  }
</style>
</head>
<body>

<canvas id="fluid"></canvas>

<div class="ui brand">
  <h1>FLUID</h1>
  <p>interactive stable fluids <span class="dot">·</span> webgl</p>
</div>

<div class="ui hint" id="hint">drag to stir&ensp;—&ensp;move to nudge</div>
<div class="ui tag">navier&ndash;stokes&nbsp;on&nbsp;the&nbsp;gpu<br>128×128 → 288×288&nbsp;adaptive</div>

<div class="veil" id="veil"></div>

<div class="fallback" id="fallback">
  <div>
    <b>WEBGL UNAVAILABLE</b>
    This experience needs a WebGL-capable browser with floating-point
    framebuffer support. Try Chrome, Edge, Firefox or Safari on a recent device.
  </div>
</div>

<script>
(() => {
'use strict';

/* =========================================================================
   FLUID — GPU stable-fluids simulation
   Dye + velocity fields solved with semi-Lagrangian advection, Jacobi
   pressure projection, vorticity confinement, bloom glow and a graded
   deep-space display. Self-contained; runs from file://.
   ========================================================================= */

const canvas = document.getElementById('fluid');
const hintEl = document.getElementById('hint');
const fallbackEl = document.getElementById('fallback');

function fail(msg) {
  fallbackEl.style.display = 'flex';
  if (msg) fallbackEl.innerHTML = '<div><b>WEBGL UNAVAILABLE</b>' + String(msg).replace(/</g, '&lt;') + '</div>';
  return false;
}

/* ----------------------------- WebGL setup ----------------------------- */

const gl = canvas.getContext('webgl', {
  alpha: false, depth: false, stencil: false,
  antialias: false, preserveDrawingBuffer: true,
}) || canvas.getContext('experimental-webgl', {
  alpha: false, depth: false, stencil: false,
  antialias: false, preserveDrawingBuffer: true,
});

if (!gl) fail('This experience needs a WebGL-capable browser.');

let texType = null;
let supportLinearFiltering = false;
let renderExt = null;

if (gl) {
  const halfFloat = gl.getExtension('OES_texture_half_float');
  const floatExt  = gl.getExtension('OES_texture_float');

  /* Prefer full-precision FLOAT targets: some ANGLE/driver stacks render
     half-float framebuffers black, so full float is the reliable choice. */
  if (floatExt) {
    texType = gl.FLOAT;
    renderExt = gl.getExtension('WEBGL_color_buffer_float');
    supportLinearFiltering = !!gl.getExtension('OES_texture_float_linear');
  }
  if ((!texType || !renderExt) && halfFloat) {
    texType = gl.HALF_FLOAT_OES;
    renderExt = gl.getExtension('EXT_color_buffer_half_float');
    supportLinearFiltering = supportLinearFiltering || !!gl.getExtension('OES_texture_half_float_linear');
  }
  if (!texType || !renderExt) {
    fail('Floating-point framebuffers are not supported on this device.');
  }
}

if (gl && texType && renderExt) {
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.STENCIL_TEST);
  gl.disable(gl.BLEND);
  gl.clearColor(0, 0, 0, 1);
  main();
}

/* ---------------------------------------------------------------------- */

function main() {
  const filter = supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

  /* ---------- shader helpers ---------- */

  function compileShader(kind, src) {
    const sh = gl.createShader(kind);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error('Shader compile: ' + gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  function createProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('Program link: ' + gl.getProgramInfoLog(p));
    }
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const u = gl.getActiveUniform(p, i);
      uniforms[u.name] = gl.getUniformLocation(p, u.name);
    }
    return { program: p, uniforms };
  }

  /* ---------- shaders ---------- */

  const baseVertex = `
    attribute vec2 aPosition;
    varying vec2 vUv;
    void main() {
      vUv = 0.5 * (aPosition + 1.0);
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }`;

  const copyFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uSource;
    void main() { gl_FragColor = texture2D(uSource, vUv); }`;

  const clearFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform vec4 uColor;
    void main() { gl_FragColor = uColor; }`;

  const splatFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;
    void main() {
      vec2 p = vUv - point.xy;
      p.x *= aspectRatio;
      vec3 splat = exp(-dot(p, p) / radius) * color;
      vec3 base = texture2D(uTarget, vUv).xyz;
      gl_FragColor = vec4(base + splat, 1.0);
    }`;

  const advectionFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 dyeTexelSize;
    uniform float dt;
    uniform float dissipation;
    uniform float clampTo;
    vec4 bilerp(sampler2D sam, vec2 uv, vec2 tsize) {
      vec2 st = uv / tsize - 0.5;
      vec2 iuv = floor(st);
      vec2 fuv = fract(st);
      vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
      vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
      vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
      vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
      return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
    }
    void main() {
      vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
      vec4 result = bilerp(uSource, coord, dyeTexelSize);
      float decay = 1.0 + dissipation * dt;
      result /= decay;
      if (clampTo > 0.0) result = min(result, vec4(clampTo));
      gl_FragColor = result;
    }`;

  const divergenceFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform vec2 texelSize;
    void main() {
      vec2 L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).xy;
      vec2 R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).xy;
      vec2 T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).xy;
      vec2 B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).xy;
      float div = 0.5 * ((R.x - L.x) + (T.y - B.y));
      gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }`;

  const curlFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform vec2 texelSize;
    void main() {
      vec2 L = texture2D(uVelocity, vUv - vec2(texelSize.x, 0.0)).xy;
      vec2 R = texture2D(uVelocity, vUv + vec2(texelSize.x, 0.0)).xy;
      vec2 T = texture2D(uVelocity, vUv + vec2(0.0, texelSize.y)).xy;
      vec2 B = texture2D(uVelocity, vUv - vec2(0.0, texelSize.y)).xy;
      float vorticity = 0.5 * (R.y - L.y - T.x + B.x);
      gl_FragColor = vec4(vorticity, 0.0, 0.0, 1.0);
    }`;

  const vorticityFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;
    uniform vec2 texelSize;
    void main() {
      float L = texture2D(uCurl, vUv - vec2(texelSize.x, 0.0)).x;
      float R = texture2D(uCurl, vUv + vec2(texelSize.x, 0.0)).x;
      float T = texture2D(uCurl, vUv + vec2(0.0, texelSize.y)).x;
      float B = texture2D(uCurl, vUv - vec2(0.0, texelSize.y)).x;
      float C = texture2D(uCurl, vUv).x;
      vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      force /= length(force) + 0.0001;
      force *= curl * C;
      force.y *= -1.0;
      vec2 velocity = texture2D(uVelocity, vUv).xy;
      velocity += force * dt;
      velocity = min(max(velocity, -1000.0), 1000.0);
      gl_FragColor = vec4(velocity, 0.0, 1.0);
    }`;

  const pressureFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPressure;
    uniform sampler2D uDivergence;
    uniform vec2 texelSize;
    void main() {
      float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;
      float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;
      float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;
      float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;
      float divergence = texture2D(uDivergence, vUv).x;
      float pressure = (L + R + B + T - divergence) * 0.25;
      gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }`;

  const gradientFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPressure;
    uniform sampler2D uVelocity;
    uniform vec2 texelSize;
    void main() {
      float L = texture2D(uPressure, vUv - vec2(texelSize.x, 0.0)).x;
      float R = texture2D(uPressure, vUv + vec2(texelSize.x, 0.0)).x;
      float T = texture2D(uPressure, vUv + vec2(0.0, texelSize.y)).x;
      float B = texture2D(uPressure, vUv - vec2(0.0, texelSize.y)).x;
      vec2 velocity = texture2D(uVelocity, vUv).xy;
      velocity.xy -= 0.5 * vec2(R - L, T - B);
      gl_FragColor = vec4(velocity, 0.0, 1.0);
    }`;

  const bloomDownFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform float threshold;
    void main() {
      vec2 off = texelSize;
      vec3 a = texture2D(uSource, vUv).rgb;
      vec3 b = texture2D(uSource, vUv + vec2(off.x, 0.0)).rgb;
      vec3 c = texture2D(uSource, vUv + vec2(0.0, off.y)).rgb;
      vec3 d = texture2D(uSource, vUv + off).rgb;
      vec3 col = (a + b + c + d) * 0.25;
      float bright = max(max(col.r, col.g), col.b);
      float knee = smoothstep(threshold - 0.25, threshold + 0.25, bright);
      gl_FragColor = vec4(col * knee, 1.0);
    }`;

  const blurFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 direction;
    void main() {
      vec2 off = direction * texelSize;
      vec3 sum = texture2D(uSource, vUv).rgb * 0.227027;
      sum += texture2D(uSource, vUv + off * 1.384615).rgb * 0.316216;
      sum += texture2D(uSource, vUv - off * 1.384615).rgb * 0.316216;
      sum += texture2D(uSource, vUv + off * 3.230769).rgb * 0.070270;
      sum += texture2D(uSource, vUv - off * 3.230769).rgb * 0.070270;
      gl_FragColor = vec4(sum, 1.0);
    }`;

  const displayFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTexture;
    uniform sampler2D uBloom;
    uniform float aspectRatio;
    uniform float time;

    vec3 hsv2rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    void main() {
      vec2 uv = vUv;
      vec2 p = uv - 0.5;
      p.x *= aspectRatio;
      float d = length(p);

      /* deep-space background with a slow aurora and faint drift */
      float bgHue = 0.66 + 0.05 * sin(time * 0.05);
      vec3 bg = hsv2rgb(vec3(bgHue, 0.18, 0.048));
      bg += hsv2rgb(vec3(fract(bgHue + 0.5), 0.20, 0.010));
      float glow = exp(-d * 2.8);
      bg += vec3(0.035, 0.02, 0.07) * glow;
      float shimmer = 0.5 + 0.5 * sin(uv.x * 18.0 + time * 0.5) * sin(uv.y * 14.0 - time * 0.35);
      bg += vec3(0.02, 0.03, 0.07) * shimmer * (1.0 - smoothstep(0.2, 1.0, d));

      /* fluid —— treated as "ink amount", coloured at render time from a
         slowly-morphing spectrum so the scene stays vividly colourful even
         where dyes mix (avoids white-out from colour-only accumulation) */
      vec3 fluid = texture2D(uTexture, uv).rgb;
      float amt = clamp(max(max(fluid.r, fluid.g), fluid.b), 0.0, 1.4);
      float hue = fract(time * 0.016 + uv.x * 0.20 + uv.y * 0.13);
      vec3 ink = hsv2rgb(vec3(hue, 0.86, 1.0));
      vec3 f = ink * (0.5 + amt * 1.35);
      float alpha = smoothstep(0.02, 0.32, amt);
      vec3 col = mix(bg, f, alpha);

      /* bloom glow */
      vec3 bloom = texture2D(uBloom, uv).rgb;
      col += bloom * 1.5;

      /* filmic rolloff */
      col = 1.0 - exp(-col * 1.55);

      /* re-saturate the composite so the fluid keeps its pop */
      float colLum = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(colLum), col, 1.3);

      /* vignette */
      float vig = 1.0 - smoothstep(0.55, 1.35, d);
      col *= mix(0.42, 1.0, vig);

      /* grain */
      float g = fract(sin(dot(uv + vec2(time * 0.07, 0.0), vec2(12.9898, 78.233))) * 43758.5453);
      col += (g - 0.5) * 0.05;

      /* breathing */
      col *= 0.985 + 0.015 * sin(time * 0.4);

      gl_FragColor = vec4(col, 1.0);
    }`;

  const programs = {
    copy:   createProgram(baseVertex, copyFrag),
    clear:  createProgram(baseVertex, clearFrag),
    splat:  createProgram(baseVertex, splatFrag),
    advection: createProgram(baseVertex, advectionFrag),
    divergence: createProgram(baseVertex, divergenceFrag),
    curl:   createProgram(baseVertex, curlFrag),
    vorticity: createProgram(baseVertex, vorticityFrag),
    pressure: createProgram(baseVertex, pressureFrag),
    gradient: createProgram(baseVertex, gradientFrag),
    bloomDown: createProgram(baseVertex, bloomDownFrag),
    blur:   createProgram(baseVertex, blurFrag),
    display: createProgram(baseVertex, displayFrag),
  };

  /* ---------- framebuffers ---------- */

  function createFBO(w, h, param) {
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, texType, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
      throw new Error('Framebuffer incomplete for render target.');
    }
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { texture: tex, fbo, width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h };
  }

  function createDoubleFBO(w, h, param) {
    const read = createFBO(w, h, param);
    const write = createFBO(w, h, param);
    return {
      read, write,
      swap() { const t = this.read; this.read = this.write; this.write = t; },
    };
  }

  /* ---------- draw helpers ---------- */

  const vertexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  function render(program, target, clear, uniforms) {
    gl.useProgram(program.program);
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    const loc = gl.getAttribLocation(program.program, 'aPosition');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    let unit = 0;
    for (const key in uniforms) {
      const value = uniforms[key];
      const u = program.uniforms[key];
      if (u === undefined || value == null) continue;
      if (Array.isArray(value)) {
        switch (value.length) {
          case 1: gl.uniform1f(u, value[0]); break;
          case 2: gl.uniform2f(u, value[0], value[1]); break;
          case 3: gl.uniform3f(u, value[0], value[1], value[2]); break;
          case 4: gl.uniform4f(u, value[0], value[1], value[2], value[3]); break;
        }
      } else if (typeof value === 'number') {
        gl.uniform1f(u, value);
      } else if (typeof value === 'boolean') {
        gl.uniform1i(u, value ? 1 : 0);
      } else if (typeof value === 'object' && value.texture !== undefined) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, value.texture);
        gl.uniform1i(u, unit);
        unit++;
      }
    }
    if (target == null) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
      gl.viewport(0, 0, target.width, target.height);
    }
    if (clear) {
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // Unbind a fixed range of texture units after every draw so a buffer
    // used later as a render target is never still bound as a sampler
    // (WebGL reports a feedback loop and drops the draw otherwise).
    for (let i = 0; i < 8; i++) {
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, null);
    }
  }

  /* ---------- config ---------- */

  const config = {
    splatRadius: 0.35,
    curl: 8,
    pressureIterations: 20,
    velocityDissipation: 2.2,
    dyeDissipation: 1.2,
    dyeMax: 1.0,
    bloomThreshold: 0.45,
    bloomStrength: 1.5,
    // always emit so the scene stays alive; reduced-motion users get a
    // calmer version rather than an empty canvas
    emittersOn: true,
    gentle: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  };

  /* ---------- simulation state ---------- */

  let dye, velocity, divergence, curl, pressure;
  let bloomDown, bloomH, bloomV;
  let simSize = 0;
  let simOverride = null;

  function calcSimSize() {
    if (simOverride) return simOverride;
    const d = Math.min(canvas.width, canvas.height);
    return Math.max(64, Math.min(288, Math.round(d / 3)));
  }

  function createFBOs() {
    const s = calcSimSize();
    simSize = s;
    dye = createDoubleFBO(s, s, filter);
    velocity = createDoubleFBO(s, s, gl.NEAREST);
    divergence = createFBO(s, s, gl.NEAREST);
    curl = createFBO(s, s, gl.NEAREST);
    pressure = createDoubleFBO(s, s, gl.NEAREST);
    const bw = Math.max(32, Math.floor(s / 2));
    bloomDown = createFBO(bw, bw, filter);
    bloomH = createFBO(bw, bw, filter);
    bloomV = createFBO(bw, bw, filter);
  }

  function resizeCanvas() {
    const w = window.innerWidth || document.documentElement.clientWidth;
    const h = window.innerHeight || document.documentElement.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    if (calcSimSize() !== simSize) {
      createFBOs();
    }
  }

  /* ---------- splats & emitters ---------- */

  function hsv2rgb(h, s, v) {
    h = ((h % 1) + 1) % 1;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  function correctRadius(radius, aspectRatio) {
    return aspectRatio > 1 ? radius * aspectRatio : radius;
  }

  function splat(x, y, dx, dy, color, radius) {
    const aspect = canvas.width / canvas.height;
    const r = correctRadius(radius / 100.0, aspect);

    render(programs.splat, velocity.write, true, {
      uTarget: velocity.read.texture,
      aspectRatio: aspect,
      color: [dx, dy, 0],
      point: [x, y],
      radius: r,
    });
    velocity.swap();

    render(programs.splat, dye.write, true, {
      uTarget: dye.read.texture,
      aspectRatio: aspect,
      color: color,
      point: [x, y],
      radius: r,
    });
    dye.swap();
  }

  /* ambient emitters —— Lissajous paths crossing a wide interior band so
     ink is painted across the whole frame without clumping at the edges;
     ink is coloured at render time by the spectrum, so mixing is harmless */
  const emitters = [
    { cx: 0.50, cy: 0.42, ampX: 0.36, ampY: 0.30, phase: 0.0, speed: 0.13,
      radius0: 0.34, intensity: 0.95, burstEvery: 5.5, burstTimer: 1.6 },
    { cx: 0.50, cy: 0.58, ampX: 0.34, ampY: 0.30, phase: 2.0, speed: 0.12,
      radius0: 0.34, intensity: 0.95, burstEvery: 6.0, burstTimer: 2.9 },
    { cx: 0.34, cy: 0.50, ampX: 0.30, ampY: 0.34, phase: 4.0, speed: 0.13,
      radius0: 0.32, intensity: 0.95, burstEvery: 6.2, burstTimer: 3.7 },
    { cx: 0.66, cy: 0.50, ampX: 0.30, ampY: 0.34, phase: 6.0, speed: 0.12,
      radius0: 0.32, intensity: 0.95, burstEvery: 6.3, burstTimer: 2.0 },
  ];

  function updateEmitters(dt, t) {
    if (!config.emittersOn) return;
    const g = config.gentle ? 0.45 : 1.0;
    for (const e of emitters) {
      const w = e.speed * g;
      const x = e.cx + e.ampX * Math.sin(t * w + e.phase);
      const y = e.cy + e.ampY * Math.cos(t * w * 0.83 + e.phase * 1.6);
      const ink = e.intensity * 0.6;
      /* tangential velocity along the path — ink trails the fountain as it
         crosses the frame; no rotating impulse, so no corner circulation */
      const vx = e.ampX * w * Math.cos(t * w + e.phase) * 1.8;
      const vy = -e.ampY * w * 0.83 * Math.sin(t * w * 0.83 + e.phase * 1.6) * 1.8;
      splat(x, y, vx, vy, [ink, ink, ink], e.radius0);

      if (config.gentle) continue; // calm mode: no bursts

      e.burstTimer -= dt;
      if (e.burstTimer <= 0) {
        e.burstTimer = e.burstEvery + Math.random() * 2.5;
        for (let i = 0; i < 6; i++) {
          const ba = Math.random() * Math.PI * 2;
          const sp = 0.4 + Math.random() * 0.9;
          const r = e.radius0 * (0.6 + Math.random() * 0.9);
          const amp = e.intensity * (0.4 + Math.random() * 0.3);
          splat(x + (Math.random() - 0.5) * 0.05, y + (Math.random() - 0.5) * 0.05,
                Math.cos(ba) * sp, Math.sin(ba) * sp,
                [amp, amp, amp], r);
        }
      }
    }
  }

  /* ---------- pointer ---------- */

  const pointer = {
    uvX: 0.5, uvY: 0.5, lastUVX: 0.5, lastUVY: 0.5,
    moved: false, down: false,
  };

  function uvFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width,
      y: 1 - (e.clientY - rect.top) / rect.height,
    };
  }

  let tGlobal = 0;

  function pointerColor() {
    // bright neutral ink — coloured by the spectrum shader
    return [0.8, 0.8, 0.8];
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.5 + Math.random() * 1.2;
      const r = 0.05 + Math.random() * 0.06;
      const ink = 0.9;
      splat(x + (Math.random() - 0.5) * 0.04, y + (Math.random() - 0.5) * 0.04,
            Math.cos(a) * sp, Math.sin(a) * sp,
            [ink, ink, ink], r);
    }
  }

  let hintHidden = false;
  function hideHint() {
    if (!hintHidden) {
      hintHidden = true;
      hintEl.classList.add('hidden');
    }
  }
  setTimeout(hideHint, 9000); // fade the hint away even without interaction

  canvas.addEventListener('pointerdown', (e) => {
    pointer.down = true;
    const uv = uvFromEvent(e);
    pointer.uvX = uv.x; pointer.uvY = uv.y;
    pointer.lastUVX = uv.x; pointer.lastUVY = uv.y;
    pointer.moved = true;
    burst(uv.x, uv.y, pointerColor(), 7);
    hideHint();
  });

  canvas.addEventListener('pointermove', (e) => {
    const uv = uvFromEvent(e);
    pointer.uvX = uv.x; pointer.uvY = uv.y;
    pointer.moved = true;
    if (pointer.down) hideHint();
  });

  window.addEventListener('pointerup', () => { pointer.down = false; });
  canvas.addEventListener('pointerleave', () => { pointer.moved = false; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ---------- main loop ---------- */

  let lastTime = performance.now();
  let startTime = lastTime;
  let fpsAcc = 0, fpsFrames = 0;

  function step(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    tGlobal = (now - startTime) / 1000;

    /* pointer splats */
    if (pointer.moved) {
      const pdx = pointer.uvX - pointer.lastUVX;
      const pdy = pointer.uvY - pointer.lastUVY;
      if (pointer.down && (Math.abs(pdx) + Math.abs(pdy) > 0.00001)) {
        splat(pointer.uvX, pointer.uvY,
              clamp((pdx / Math.max(dt, 0.001)) * 0.5, -6, 6),
              clamp((pdy / Math.max(dt, 0.001)) * 0.5, -6, 6),
              pointerColor(), config.splatRadius);
      } else if (!pointer.down) {
        splat(pointer.uvX, pointer.uvY,
              clamp((pdx / Math.max(dt, 0.001)) * 0.35, -3, 3),
              clamp((pdy / Math.max(dt, 0.001)) * 0.35, -3, 3),
              [0, 0, 0], config.splatRadius * 0.6);
      }
      pointer.lastUVX = pointer.uvX;
      pointer.lastUVY = pointer.uvY;
      pointer.moved = false;
    }

    updateEmitters(dt, tGlobal);

    /* ---- velocity field ---- */
    const vTex = [velocity.read.texelSizeX, velocity.read.texelSizeY];

    render(programs.curl, curl, true, { uVelocity: velocity.read.texture, texelSize: vTex });
    render(programs.vorticity, velocity.write, false, {
      uVelocity: velocity.read.texture, uCurl: curl.texture,
      curl: config.curl, dt: dt, texelSize: vTex,
    });
    velocity.swap();

    render(programs.divergence, divergence, true, { uVelocity: velocity.read.texture, texelSize: vTex });

    render(programs.clear, pressure.read, true, { uColor: [0, 0, 0, 1] });
    for (let i = 0; i < config.pressureIterations; i++) {
      render(programs.pressure, pressure.write, false, {
        uPressure: pressure.read.texture, uDivergence: divergence.texture, texelSize: vTex,
      });
      pressure.swap();
    }

    render(programs.gradient, velocity.write, false, {
      uVelocity: velocity.read.texture, uPressure: pressure.read.texture, texelSize: vTex,
    });
    velocity.swap();

    render(programs.advection, velocity.write, false, {
      uVelocity: velocity.read.texture, uSource: velocity.read.texture,
      texelSize: vTex, dyeTexelSize: vTex, dt: dt,
      dissipation: config.velocityDissipation, clampTo: 0,
    });
    velocity.swap();

    /* ---- dye ---- */
    render(programs.advection, dye.write, false, {
      uVelocity: velocity.read.texture, uSource: dye.read.texture,
      texelSize: vTex,
      dyeTexelSize: [dye.read.texelSizeX, dye.read.texelSizeY],
      dt: dt, dissipation: config.dyeDissipation, clampTo: config.dyeMax,
    });
    dye.swap();

    /* ---- bloom ---- */
    render(programs.bloomDown, bloomDown, true, {
      uSource: dye.read.texture,
      texelSize: [dye.read.texelSizeX * 2, dye.read.texelSizeY * 2],
      threshold: config.bloomThreshold,
    });
    render(programs.blur, bloomH, false, {
      uSource: bloomDown.texture,
      texelSize: [bloomDown.texelSizeX, bloomDown.texelSizeY],
      direction: [1, 0],
    });
    render(programs.blur, bloomV, false, {
      uSource: bloomH.texture,
      texelSize: [bloomH.texelSizeX, bloomH.texelSizeY],
      direction: [0, 1],
    });

    /* ---- display ---- */
    render(programs.display, null, false, {
      uTexture: dye.read.texture,
      uBloom: bloomV.texture,
      aspectRatio: canvas.width / canvas.height,
      time: tGlobal,
    });

    /* adaptive resolution: drop a notch if we can't hold ~42fps */
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 2) {
      const fps = fpsFrames / fpsAcc;
      if (fps < 42 && simSize > 64) {
        simOverride = Math.max(64, Math.floor(simSize / 2));
        createFBOs();
        document.querySelector('.tag').style.opacity = '0.5';
      }
      fpsAcc = 0; fpsFrames = 0;
    }
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function loop(now) {
    try {
      step(now);
    } catch (err) {
      console.error(err);
      cancelAnimationFrame(loop);
      fail(err.message);
      return;
    }
    requestAnimationFrame(loop);
  }

  /* ---------- boot ---------- */

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 200);
  });
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));

  try {
    resizeCanvas();
    createFBOs();
    requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    fail(err.message);
  }
}
})();
</script>
</body>
</html>
