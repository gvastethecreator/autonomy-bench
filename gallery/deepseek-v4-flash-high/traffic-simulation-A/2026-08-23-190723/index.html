<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CityFlow — City Traffic Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f14; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: center center; }
  canvas { display: block; background: #14181e; border-radius: 8px; cursor: pointer;
           box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 24px 80px rgba(0,0,0,.55); }

  #hud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
         display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
         padding: 8px 12px; max-width: 97%;
         background: rgba(9,12,18,.82); color: #dfe7ef;
         border: 1px solid rgba(255,255,255,.09); border-radius: 10px;
         backdrop-filter: blur(6px); font-size: 12px; line-height: 1.3; }
  #hud .title { font-weight: 700; font-size: 13px; letter-spacing: .3px; margin-right: 6px;
                 color: #9ecbff; white-space: nowrap; }
  .grp { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .grp label { opacity: .75; }
  button { background: #1c2430; color: #dfe7ef; border: 1px solid rgba(255,255,255,.14);
           border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:hover { background: #26324a; }
  button.on { background: #3b6ea8; border-color: #6ea5e0; color: #fff; }
  .statbox { display: flex; flex-direction: column; align-items: center; padding: 0 3px; }
  .statbox b { font-size: 13px; color: #fff; }
  .statbox span { font-size: 10px; opacity: .6; }
  input[type=range] { width: 90px; accent-color: #6ea5e0; }

  #info, #help { position: absolute; bottom: 10px; max-width: 300px;
                 background: rgba(9,12,18,.82); color: #dfe7ef;
                 border: 1px solid rgba(255,255,255,.09); border-radius: 10px;
                 padding: 10px 12px; font-size: 12px; line-height: 1.5;
                 backdrop-filter: blur(6px); }
  #info { left: 10px; min-width: 220px; }
  #info h3 { font-size: 12px; color: #9ecbff; margin-bottom: 2px; }
  #info .row { display: flex; justify-content: space-between; gap: 12px; }
  #info .row span { opacity: .62; }
  #help { right: 10px; opacity: .8; }
  #help kbd { background:#1c2430; border:1px solid rgba(255,255,255,.15); border-radius:3px;
              padding:0 4px; font-family:inherit; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1200" height="900"></canvas>

  <div id="hud">
    <span class="title">CityFlow&nbsp;·&nbsp;Traffic Simulation</span>
    <div class="grp" id="playGroup">
      <button id="pauseBtn" class="on">⏸ Pause</button>
    </div>
    <div class="grp">
      <label>Speed</label>
      <button data-speed="1" class="on">1&times;</button>
      <button data-speed="2">2&times;</button>
      <button data-speed="4">4&times;</button>
    </div>
    <div class="grp"><label>Traffic density</label>
      <input type="range" id="density" min="0.15" max="2.6" step="0.05" value="1.0"/>
    </div>
    <button id="resetBtn">↺ Reset city</button>
    <span style="opacity:.12">|</span>
    <div class="statbox"><b id="stCars">0</b><span>vehicles</span></div>
    <div class="statbox"><b id="stSpeed">0</b><span>avg km/h</span></div>
    <div class="statbox"><b id="stClock">00:00</b><span>sim time</span></div>
    <div class="statbox"><b id="stFlow">0</b><span>arrived</span></div>
  </div>

  <div id="info">
    <h3 id="iTitle">Click a vehicle to inspect it</h3>
    <div class="row"><span>Type</span><b id="iType">—</b></div>
    <div class="row"><span>Speed</span><b id="iSpeed">—</b></div>
    <div class="row"><span>Behaviour</span><b id="iStatus">—</b></div>
    <div class="row"><span>Destination</span><b id="iDest">—</b></div>
  </div>

  <div id="help">
    <kbd>Space</kbd> pause&nbsp;·&nbsp;<kbd>1</kbd>/<kbd>2</kbd>/<kbd>4</kbd> sim speed&nbsp;·&nbsp;<kbd>R</kbd> reset
  </div>
</div>

<script>
"use strict";
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------------------------------------------------------------- constants
  const BLOCK = 150;            // px between consecutive grid lines
  const ROAD_W = 32;            // full road width (two lanes, one per direction)
  const LANE_HALF = 8;          // lane centreline offset from road centre
  const C = 8, R = 6;           // grid: C blocks wide, R blocks high
  const STOP_OFF = 28;          // painted stop line distance from the junction centre
  const COMMIT = 32;            // point where a car leaves its lane for the crossing arc
  const PLAN_DIST = 90;         // how early a car picks its manoeuvre
  const EXIT_CHECK = 46;        // exit-lane must be this clear before entering a junction
  const YIELD = 170;            // left-turn oncoming-gap look-ahead
  const MERGE = 140;            // right-turn-on-red merge look-ahead
  const ACCEL = 70;             // px/s^2
  const BRAKE = 150;            // px/s^2
  const MAX_CARS = 128;

  const LIGHT = { g: 9, y: 2.5, ar: 1.5 };
  const CYCLE = (LIGHT.g + LIGHT.y + LIGHT.ar) * 2;   // NS + EW halves

  // ---------------------------------------------------------------- world data
  const nodes = [];
  for (let j = 0; j <= R; j++)
    for (let i = 0; i <= C; i++)
      nodes.push({ i, j, x: i * BLOCK, y: j * BLOCK, off: Math.random() * CYCLE,
                   segs: [], incoming: [] });
  const nodeAt = (i, j) => nodes[j * (C + 1) + i];

  const segs = [];
  function mkSeg(kind, from, to, dx, dy, dir) {
    const s = { kind, from, to, dir, dx, dy, x1: from.x, y1: from.y,
                x2: to.x, y2: to.y, len: BLOCK };
    s.offX = -dy * LANE_HALF;   // right-hand side of travel direction
    s.offY =  dx * LANE_HALF;
    from.segs.push(s); to.incoming.push(s);
    segs.push(s);
    return s;
  }
  for (let j = 0; j <= R; j++) for (let i = 0; i < C; i++) {
    const a = nodeAt(i, j), b = nodeAt(i + 1, j);
    mkSeg('h', a, b,  1, 0,  1);   // eastbound
    mkSeg('h', b, a, -1, 0, -1);   // westbound
  }
  for (let i = 0; i <= C; i++) for (let j = 0; j < R; j++) {
    const a = nodeAt(i, j), b = nodeAt(i, j + 1);
    mkSeg('v', a, b,  0, 1,  1);   // southbound
    mkSeg('v', b, a,  0, -1, -1);  // northbound
  }
  const lanePos = (s, p) => ({ x: s.x1 + s.dx * p + s.offX, y: s.y1 + s.dy * p + s.offY });

  const isBoundarySeg = s => s.from.i === 0 || s.from.i === C || s.from.j === 0 || s.from.j === R;

  // ---------------------------------------------------------------- buildings
  const BLOCK_COLORS = ['#3b4453', '#465060', '#39475f', '#42506a', '#4b5868',
                        '#58463a', '#6b4a3c', '#5a4632', '#7a5a44', '#3f4c5c'];
  const blocks = [];
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
    const r = Math.random();
    let kind = 'built';
    if (r < 0.16) kind = 'park';
    else if (r < 0.24) kind = 'plaza';
    blocks.push({ i, j, kind, color: BLOCK_COLORS[(Math.random() * BLOCK_COLORS.length) | 0],
                  seed: Math.random() * 1e4 });
  }

  // ---------------------------------------------------------------- traffic light
  const sim = { t: 0 };
  function lamp(seg) {
    const p = (sim.t + seg.to.off) % CYCLE;
    const isV = seg.kind === 'v';
    if (isV) {
      if (p < LIGHT.g) return 'g';
      if (p < LIGHT.g + LIGHT.y) return 'y';
      return 'r';
    } else {
      if (p < LIGHT.g + LIGHT.y + LIGHT.ar) return 'r';
      const t = p - (LIGHT.g + LIGHT.y + LIGHT.ar);
      if (t < LIGHT.g) return 'g';
      if (t < LIGHT.g + LIGHT.y) return 'y';
      return 'r';
    }
  }
  // phase state for the *axis*, used by the lamp drawing
  function axisLamp(node, vertical) {
    const p = (sim.t + node.off) % CYCLE;
    if (vertical) {
      if (p < LIGHT.g) return 'g';
      if (p < LIGHT.g + LIGHT.y) return 'y';
      return 'r';
    } else {
      if (p < LIGHT.g + LIGHT.y + LIGHT.ar) return 'r';
      const t = p - (LIGHT.g + LIGHT.y + LIGHT.ar);
      if (t < LIGHT.g) return 'g';
      if (t < LIGHT.g + LIGHT.y) return 'y';
      return 'r';
    }
  }

  // ---------------------------------------------------------------- vehicles
  const CARS_COLORS = ['#e23b3b', '#ef4444', '#3b82f6', '#2563eb', '#f8fafc', '#cbd5e1',
                       '#fbbf24', '#f97316', '#22c55e', '#a855f7', '#14b8a6', '#f43f5e'];
  const cars = [];
  let nextId = 1;
  const stats = { spawned: 0, arrived: 0 };

  function findInto(node, kind, dir) {
    for (const s of node.incoming) if (s.kind === kind && s.dir === dir) return s;
    return null;
  }
  const turnVect = (seg, turn) => {
    if (turn === 'straight') return { x: seg.dx, y: seg.dy };
    if (turn === 'right')  return { x: -seg.dy, y:  seg.dx };
    return { x:  seg.dy, y: -seg.dx };            // left
  };
  const turnType = (inSeg, outSeg) => {
    if (outSeg.kind === inSeg.kind) return 'straight';
    const e = turnVect(inSeg, 'right');
    return (outSeg.dx === e.x && outSeg.dy === e.y) ? 'right' : 'left';
  };

  function choosePlan(c) {
    const node = c.seg.to;
    let best = Infinity;
    const cands = [];
    for (const s of node.segs) {
      if (s.to === c.seg.from) continue;          // no U-turn
      const d = Math.abs(s.to.x - c.tx) + Math.abs(s.to.y - c.ty);
      if (d < best - 0.001) { best = d; cands.length = 0; }
      if (Math.abs(d - best) < 0.001) cands.push(s);
    }
    if (!cands.length) return null;               // nowhere to go (should not happen)
    const straight = cands.find(s => s.kind === c.seg.kind && s.dir === c.seg.dir);
    let sel;
    if (straight && Math.random() < 0.6) sel = straight;
    else sel = cands[(Math.random() * cands.length) | 0];
    return { node, exitSeg: sel, turn: turnType(c.seg, sel) };
  }

  function spawnCar() {
    if (cars.length >= MAX_CARS) return false;
    // exterior ring roads or an interior "driveway"?
    let seg, p;
    const inside = Math.random() < 0.55;
    if (inside) {
      const int = segs.filter(s => s.dir === 1 && !isBoundarySeg(s));
      seg = int[(Math.random() * int.length) | 0];
      p = seg.len * (0.3 + Math.random() * 0.4);
    } else {
      const ring = segs.filter(s => s.dir === 1 && isBoundarySeg(s));
      seg = ring[(Math.random() * ring.length) | 0];
      p = seg.len * (0.15 + Math.random() * 0.7);
    }
    // make sure the lane is free around the spawn point
    for (const o of cars) {
      if (o.dead || o.seg !== seg) continue;
      if (Math.abs(o.progress - p) < 74) return false;
    }
    const isBus = Math.random() < 0.08;
    const c = {
      id: nextId++, type: isBus ? 'bus' : 'car',
      seg, progress: p, speed: 42 + Math.random() * 25,
      len: isBus ? 46 : 24, wid: isBus ? 16 : 12,
      color: CARS_COLORS[(Math.random() * CARS_COLORS.length) | 0],
      vLimit: isBus ? 92 : 105 + Math.random() * 28,
      fade: 0, spawnDone: false, despawn: false, dead: false,
      age: 0, plan: null, crossing: null,
      wasStopped: false, brake: false, prevSpeed: 0
    };
    const tgSeg = segs[(Math.random() * segs.length) | 0];
    c.tseg = c.seg === tgSeg && Math.random() < 0.85 ? segs[(Math.random() * segs.length) | 0] : tgSeg;
    const tp2 = c.tseg.len * (0.3 + Math.random() * 0.4);
    const tpnt2 = lanePos(c.tseg, tp2);
    c.tp = tp2; c.tx = tpnt2.x; c.ty = tpnt2.y;
    cars.push(c);
    stats.spawned++;
    return true;
  }

  function warmStart() {
    for (let k = 0; k < 42; k++) {
      // fill up to capacity from empty without clearance conflicts too harsh
      const attempts = 40;
      for (let a = 0; a < attempts; a++) {
        const ok = spawnCar();
        if (ok) break;
      }
    }
  }

  // ------------------------------------------------------------------ crossing
  function startCross(c) {
    const node = c.seg.to;
    const s0 = lanePos(c.seg, c.seg.len - COMMIT);
    const t0 = lanePos(c.plan.exitSeg, COMMIT);
    const cx = {
      node, entrySeg: c.seg, exitSeg: c.plan.exitSeg, turn: c.plan.turn,
      dist: 0, holdAt: c.seg.len - COMMIT
    };
    if (cx.turn === 'straight') {
      cx.straight = true; cx.s0 = s0; cx.t0 = t0;
      cx.total = Math.hypot(t0.x - s0.x, t0.y - s0.y);
      cx.maxSpeed = c.vLimit;
    } else {
      cx.straight = false;
      cx.R0 = Math.hypot(s0.x - node.x, s0.y - node.y);
      cx.thS = Math.atan2(s0.y - node.y, s0.x - node.x);
      const thT = Math.atan2(t0.y - node.y, t0.x - node.x);
      let d = thT - cx.thS;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      cx.sweep = d >= 0 ? 1 : -1;
      cx.total = cx.R0 * Math.abs(d);
      cx.maxSpeed = cx.turn === 'left' ? 72 : 86;
    }
    c.crossing = cx;
  }
  function completeCross(c) {
    c.seg = c.crossing.exitSeg;
    c.progress = COMMIT;
    c.crossing = null;
    c.plan = null;
    c.wasStopped = false;
  }

  // ------------------------------------------------------------- sense helpers
  function crossingAt(node) {
    for (const o of cars) if (!o.dead && o.crossing && o.crossing.node === node) return true;
    return false;
  }
  function exitClear(exitSeg) {
    for (const o of cars) {
      if (o.dead || o.seg !== exitSeg) continue;
      if (o.progress < EXIT_CHECK && o.speed < 12) return false;
    }
    return true;
  }
  function oncomingOk(c) {
    const node = c.seg.to;
    const s2 = findInto(node, c.seg.kind, -c.seg.dir);   // opposing approach lane
    if (!s2) return true;
    for (const o of cars) {
      if (o.dead || o === c || o.seg !== s2) continue;
      const f = (s2.len - o.progress) - o.len / 2;       // front distance to node
      if (f < YIELD && o.speed > 4) return false;
    }
    return true;
  }
  function mergeClear(c) {
    const exitSeg = c.plan.exitSeg;
    for (const o of cars) {
      if (o.dead || o === c || o.seg !== exitSeg) continue;
      const f = (exitSeg.len - o.progress) - o.len / 2;  // approaching the node
      if (f < MERGE && o.speed > 3) return false;
    }
    return true;
  }
  // gap to the nearest leader on the same lane OR a crossing ghost in front
  function leaderGap(c) {
    let g = Infinity;
    for (const o of cars) {
      if (o.dead || o === c) continue;
      if (o.seg === c.seg && o.progress > c.progress) {
        const gg = (o.progress - o.len / 2) - (c.progress + c.len / 2);
        if (gg < g) g = gg;
      }
      if (o.crossing && o.crossing.entrySeg === c.seg) {
        const gp = o.crossing.holdAt - o.len / 2 + o.crossing.dist;
        const gg = gp - (c.progress + c.len / 2);
        if (gg < g) g = gg;
      }
    }
    return g;
  }

  // authority to enter the junction box (evaluated freshly each step)
  function canCross(c) {
    if (!c.plan) return { ok: false, stop: true };
    const node = c.seg.to;
    const frontToStop = (c.seg.len - STOP_OFF) - (c.progress + c.len / 2);
    let st = lamp(c.seg);
    if (st === 'y') {
      const tooLate = c.speed * c.speed / (2 * BRAKE) > frontToStop;
      st = tooLate ? 'g' : 'r';
    }
    if (st === 'g') {
      let ok = !crossingAt(node) && exitClear(c.plan.exitSeg);
      if (ok && c.plan.turn === 'left') ok = oncomingOk(c);
      return { ok, stop: !ok };
    }
    // red — right turn on red after a full stop
    if (c.plan.turn === 'right') {
      if (c.speed < 2 && frontToStop < 8) c.wasStopped = true;
      if (c.wasStopped && !crossingAt(node) && exitClear(c.plan.exitSeg) && mergeClear(c))
        return { ok: true, stop: false };
      return { ok: false, stop: true };
    }
    return { ok: false, stop: true };
  }

  // ------------------------------------------------------------------- update
  function targetSpeed(c, effGap, dt, lim) {
    if (effGap === Infinity) return Math.min(lim, c.speed + ACCEL * dt);
    const headway = c.speed * 0.9 + 14;
    let tgt;
    if (effGap > headway) tgt = Math.min(lim, c.speed + ACCEL * dt);
    else tgt = Math.sqrt(2 * BRAKE * Math.max(0, effGap - 4));
    tgt = Math.min(lim, Math.max(0, tgt));
    if (tgt > c.speed) tgt = Math.min(tgt, c.speed + ACCEL * dt);
    else tgt = Math.max(tgt, c.speed - BRAKE * dt);
    return tgt;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function updateCar(c, dt, ctxCars) {
    c.age += dt;
    if (c.despawn) {
      c.fade -= dt * 1.15;
      c.speed *= 0.86;
      if (c.fade <= 0) { c.dead = true; stats.arrived++; }
      return;
    }
    if (!c.spawnDone) {
      c.fade = Math.min(1, c.fade + dt * 1.8);
      if (c.fade >= 1) c.spawnDone = true;
    }
    c.brake = c.speed < c.prevSpeed - 4;
    c.prevSpeed = c.speed;

    if (c.crossing) {
      const cx = c.crossing;
      let eGap = Infinity;
      for (const o of cars) {
        if (o.dead || o === c || o.seg !== cx.exitSeg) continue;
        if (o.progress <= COMMIT) continue;          // still behind my exit point
        const gg = (o.progress - o.len / 2) - (COMMIT + c.len / 2);
        if (gg < eGap) eGap = gg;
      }
      const tgt = targetSpeed(c, eGap, dt, cx.maxSpeed);
      if (tgt > c.speed) c.speed = Math.min(tgt, c.speed + ACCEL * dt);
      else c.speed = Math.max(tgt, c.speed - BRAKE * dt);
      c.speed = Math.max(0, c.speed);
      cx.dist += c.speed * dt;
      if (cx.dist >= cx.total) { completeCross(c); return; }
      return;
    }

    // pick the manoeuvre for this junction once we are close
    if (!c.plan && c.progress >= c.seg.len - PLAN_DIST) {
      c.plan = choosePlan(c);
      if (!c.plan) { c.despawn = true; return; }
    }

    // evaluate junction authority (stop line acts as the obstacle when denied)
    const auth = c.plan ? canCross(c) : { ok: false, stop: true };

    let effGap = leaderGap(c);
    if (auth.stop) {
      const frontToStop = (c.seg.len - STOP_OFF) - (c.progress + c.len / 2);
      if (frontToStop < effGap) effGap = Math.max(0.01, frontToStop);
    }
    const tgt = targetSpeed(c, effGap, dt, c.vLimit);
    if (tgt > c.speed) c.speed = Math.min(tgt, c.speed + ACCEL * dt);
    else c.speed = Math.max(tgt, c.speed - BRAKE * dt);
    c.speed = Math.max(0, c.speed);
    c.brake = c.brake || (c.speed < c.prevSpeed - 1);

    if (c.speed > 0) c.progress += c.speed * dt;

    // hard guard: a non-authorized car may never stand past its stop line
    if (!auth.ok && !c.crossing) {
      const stopFront = c.seg.len - STOP_OFF;
      if (c.progress + c.len / 2 > stopFront) {
        c.progress = stopFront - c.len / 2;
        c.speed = 0;
      }
    }

    // follower penetration guard: never sink into the car ahead on this lane
    for (const o of cars) {
      if (o.dead || o === c || o.seg !== c.seg) continue;
      if (o.progress > c.progress) {
        const gg = (o.progress - o.len / 2) - (c.progress + c.len / 2);
        if (gg < 2) c.progress = Math.max(0, c.progress - (2 - gg));
      }
      if (o.crossing && o.crossing.entrySeg === c.seg) {
        const gp = o.crossing.holdAt - o.len / 2 + o.crossing.dist;
        const gg = gp - (c.progress + c.len / 2);
        if (gg < 2) c.progress = Math.max(0, c.progress - (2 - gg));
      }
    }

    // commit to the crossing arc once the front reaches the entry point
    if (auth.ok && c.plan && c.progress >= c.seg.len - COMMIT) {
      c.progress = c.seg.len - COMMIT;
      startCross(c);
      return;
    }

    // arrived at destination point
    if (c.seg === c.tseg && Math.abs(c.progress - c.tp) < 16) { c.despawn = true; return; }
    // safety net: never drive past the end of the road
    if (c.progress > c.seg.len) { c.progress = c.seg.len; }
  }

  function step(dt) {
    sim.t += dt;
    // spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (Math.random() < 0.85) spawnCar();
      spawnTimer = spawnBase;
    }
    for (const c of cars) {
      if (c.dead) continue;
      if (c.crossing || c.seg) updateCar(c, dt, cars);
    }
    for (let i = cars.length - 1; i >= 0; i--) if (cars[i].dead) cars.splice(i, 1);
  }

  let spawnBase = 1.0;
  let spawnTimer = 0;

  // ------------------------------------------------------------------ drawing
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
    r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // pseudo-random per block
  const rnd = (seed) => {
    const x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  };

  function drawBackground() {
    ctx.fillStyle = '#14181e';
    ctx.fillRect(0, 0, W, H);

    // blocks
    for (const b of blocks) {
      const x0 = b.i * BLOCK + ROAD_W / 2, y0 = b.j * BLOCK + ROAD_W / 2;
      const x1 = (b.i + 1) * BLOCK - ROAD_W / 2, y1 = (b.j + 1) * BLOCK - ROAD_W / 2;
      ctx.fillStyle = b.kind === 'park' ? '#22402b' : b.kind === 'plaza' ? '#2a2f37' : '#242932';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      if (b.kind === 'park') {
        // a couple of trees
        for (let t = 0; t < 3; t++) {
          const tx = x0 + 14 + rnd(b.seed + t * 7) * (x1 - x0 - 28);
          const ty = y0 + 14 + rnd(b.seed + t * 13) * (y1 - y0 - 28);
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.beginPath(); ctx.arc(tx + 2, ty + 3, 9, 0, 7); ctx.fill();
          ctx.fillStyle = '#3f7a4a';
          ctx.beginPath(); ctx.arc(tx, ty, 8.5, 0, 7); ctx.fill();
        }
      } else if (b.kind === 'plaza') {
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 1;
        for (let lx = x0 + 16; lx < x1; lx += 16) {
          ctx.beginPath(); ctx.moveTo(lx, y0); ctx.lineTo(lx, y1); ctx.stroke();
        }
      } else {
        // a small cluster of building footprints inside the block
        const m = 12, bw = (x1 - x0 - m * 2) / 2, bh = (y1 - y0 - m * 2) / 2;
        let u = 0;
        for (let bi = 0; bi < 2; bi++) for (let bj = 0; bj < 2; bj++) {
          u++;
          if (rnd(b.seed + u) < 0.22) continue;      // some gaps
          const bx = x0 + m + bi * (bw + 8);
          const by = y0 + m + bj * (bh + 8);
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.fillRect(bx + 3, by + 4, bw - 6, bh - 8);
          ctx.fillStyle = b.color;
          ctx.fillRect(bx, by, bw - 6, bh - 8);
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.fillRect(bx, by, bw - 6, 5);
          if (rnd(b.seed + u * 3) < 0.35) {          // rooftop unit
            ctx.fillStyle = '#55606e';
            ctx.fillRect(bx + bw * 0.3, by + bh * 0.3, bw * 0.3, bh * 0.22);
          }
        }
      }
    }

    // asphalt roads
    ctx.fillStyle = '#2c3038';
    for (let i = 0; i <= C; i++) ctx.fillRect(i * BLOCK - ROAD_W / 2, 0, ROAD_W, H);
    for (let j = 0; j <= R; j++) ctx.fillRect(0, j * BLOCK - ROAD_W / 2, W, ROAD_W);

    // road edges
    ctx.strokeStyle = '#23272f';
    ctx.lineWidth = 1;
    for (let i = 0; i <= C; i++) {
      for (const x of [i * BLOCK - ROAD_W / 2 + 1, i * BLOCK + ROAD_W / 2 - 1]) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
    }
    for (let j = 0; j <= R; j++) {
      for (const y of [j * BLOCK - ROAD_W / 2 + 1, j * BLOCK + ROAD_W / 2 - 1]) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
    }

    // dashed centre lines (one per undirected edge)
    ctx.strokeStyle = 'rgba(200,170,60,0.75)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([10, 12]);
    ctx.lineDashOffset = -sim.t * 12;
    for (const s of segs) {
      if (s.dir !== 1) continue;
      const ax = s.x1, ay = s.y1, bx = s.x2, by = s.y2;
      ctx.beginPath();
      ctx.moveTo(ax + s.dx * 6, ay + s.dy * 6);
      ctx.lineTo(bx - s.dx * 6, by - s.dy * 6);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // stop lines + light fixtures at junctions
    for (const nd of nodes) {
      for (const s of nd.incoming) {
        const lp = lanePos(s, s.len - STOP_OFF);
        const px = -s.dy, py = s.dx;                 // perpendicular
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(lp.x - px * LANE_HALF, lp.y - py * LANE_HALF);
        ctx.lineTo(lp.x + px * LANE_HALF, lp.y + py * LANE_HALF);
        ctx.stroke();
      }
      // 4 corner signals — one little 3-lamp head per approach, lit by the axis phase
      for (const [sx, sy, vertical] of [[1, 1, false], [-1, -1, false], [-1, 1, true], [1, -1, true]]) {
        const st = axisLamp(nd, vertical);
        const fx = nd.x + sx * (ROAD_W / 2 - 6);
        const fy = nd.y + sy * (ROAD_W / 2 - 6);
        ctx.fillStyle = '#1b1f26';
        rr(fx - 2.5, fy - 5.5, 5, 11, 2);
        ctx.fill();
        for (let li = 0; li < 3; li++) {
          const c2 = ['r', 'y', 'g'][li];            // red on top
          ctx.fillStyle = c2 === st ? (c2 === 'g' ? '#3df06a' : c2 === 'y' ? '#f5d03b' : '#f0434a')
                                    : 'rgba(80,88,100,0.55)';
          ctx.beginPath();
          ctx.arc(fx, fy - 2.5 + li * 2.5, 1.5, 0, 7);
          ctx.fill();
        }
      }
    }
  }

  // vehicle paint
  function drawCar(c) {
    let x, y, ang;
    if (c.crossing) {
      const cx = c.crossing;
      if (cx.straight) {
        const t = clamp(cx.dist / cx.total, 0, 1);
        x = cx.s0.x + (cx.t0.x - cx.s0.x) * t;
        y = cx.s0.y + (cx.t0.y - cx.s0.y) * t;
        ang = Math.atan2(cx.t0.y - cx.s0.y, cx.t0.x - cx.s0.x);
      } else {
        const th = cx.thS + cx.sweep * (cx.dist / cx.R0);
        x = cx.node.x + Math.cos(th) * cx.R0;
        y = cx.node.y + Math.sin(th) * cx.R0;
        const tx = cx.sweep > 0 ? -Math.sin(th) : Math.sin(th);
        const ty = cx.sweep > 0 ?  Math.cos(th) : -Math.cos(th);
        ang = Math.atan2(ty, tx);
      }
    } else {
      const p = lanePos(c.seg, c.progress);
      x = p.x; y = p.y;
      ang = Math.atan2(c.seg.dy, c.seg.dx);
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.globalAlpha = c.fade;

    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(-c.len / 2 + 1.5, -c.wid / 2 + 1.5, c.len, c.wid, 4);
    ctx.fill();

    const L = c.len, Wd = c.wid;
    // body
    const gr = ctx.createLinearGradient(-L / 2, 0, L / 2, 0);
    gr.addColorStop(0, shade(c.color, -20));
    gr.addColorStop(0.55, c.color);
    gr.addColorStop(1, shade(c.color, 16));
    ctx.fillStyle = gr;
    rr(-L / 2, -Wd / 2, L, Wd, c.type === 'bus' ? 4 : 3);
    ctx.fill();

    // roof inset
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    rr(-L * 0.12, -Wd / 2 + 1.5, L * 0.38, Wd - 3, 2);
    ctx.fill();

    if (c.type === 'bus') {
      // windows strip along the side
      ctx.fillStyle = 'rgba(190,215,235,0.85)';
      for (let w = 0; w < 4; w++) ctx.fillRect(-L * 0.32 + w * L * 0.14, -Wd / 2 + 2, L * 0.1, Wd - 4);
    }

    // windshield
    ctx.fillStyle = c.type === 'bus' ? 'rgba(170,198,220,0.9)' : 'rgba(205,228,250,0.75)';
    rr(L * 0.2, -Wd * 0.38, L * 0.13, Wd * 0.76, 1.5);
    ctx.fill();

    // headlights + taillights
    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(L / 2 - 2.5, -Wd / 2 + 0.8, 2.2, 3.2);
    ctx.fillRect(L / 2 - 2.5, Wd / 2 - 4, 2.2, 3.2);
    if (c.brake && c.speed < 30) {
      ctx.fillStyle = 'rgba(255,40,40,0.9)';
      ctx.fillRect(-L / 2, -Wd / 2 + 0.6, 2.4, 3.4);
      ctx.fillRect(-L / 2, Wd / 2 - 4, 2.4, 3.4);
      ctx.fillStyle = 'rgba(255,60,40,0.22)';
      ctx.beginPath(); ctx.arc(-L / 2, 0, 6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,110,80,0.16)';
      ctx.beginPath(); ctx.arc(-L / 2, 0, 10, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = '#8a1a1a';
      ctx.fillRect(-L / 2 + 0.2, -Wd / 2 + 0.8, 2, 3.2);
      ctx.fillRect(-L / 2 + 0.2, Wd / 2 - 4, 2, 3.2);
    }

    // left-turn blinker
    if (c.plan && c.plan.turn === 'left' && c.speed < 6 && (sim.t * 5) % 1 < 0.5) {
      ctx.fillStyle = 'rgba(255,170,40,0.95)';
      ctx.fillRect(-L * 0.08, -Wd / 2 - 0.5, 2.6, 2.2);
      ctx.fillRect(-L * 0.08, Wd / 2 - 1.7, 2.6, 2.2);
    }
    ctx.restore();
    return { x, y };
  }

  function render(now) {
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    drawBackground();

    // draw vehicles from north to south for tidy layering
    const order = cars.slice().sort((a, b) => {
      const ay = a.crossing ? a.crossing.node.y : a.seg.y1 + a.seg.dy * a.progress;
      const by = b.crossing ? b.crossing.node.y : b.seg.y1 + b.seg.dy * b.progress;
      return ay - by;
    });
    let sel = null;
    for (const c of order) {
      if (c.dead) continue;
      const pos = drawCar(c);
      if (c === selected) sel = pos;
    }
    if (selected && sel) {
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(sel.x, sel.y, 17, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  // ------------------------------------------------------------------ HUD
  const $ = id => document.getElementById(id);
  const pauseBtn = $('pauseBtn'), speedBtns = document.querySelectorAll('[data-speed]');
  const density = $('density'), resetBtn = $('resetBtn');
  const stCars = $('stCars'), stSpeed = $('stSpeed'), stClock = $('stClock'), stFlow = $('stFlow');
  const iTitle = $('iTitle'), iType = $('iType'), iSpeed = $('iSpeed'),
        iStatus = $('iStatus'), iDest = $('iDest');

  let paused = false, multiplier = 1;

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Play' : '⏸ Pause';
    pauseBtn.classList.toggle('on', !paused);
  });
  speedBtns.forEach(b => b.addEventListener('click', () => {
    multiplier = +b.dataset.speed;
    speedBtns.forEach(x => x.classList.toggle('on', x === b));
  }));
  density.addEventListener('input', () => { spawnBase = +density.value; });

  function resetCity() {
    cars.length = 0;
    nextId = 1;
    stats.arrived = 0; stats.spawned = 0;
    for (const n of nodes) n.off = Math.random() * CYCLE;
    // re-randomise building colours
    for (const b of blocks) b.color = BLOCK_COLORS[(Math.random() * BLOCK_COLORS.length) | 0];
    sim.t = 0;
    selected = null;
    warmStart();
    updateInfo(-1);
  }
  resetBtn.addEventListener('click', resetCity);

  let selected = null;
  let selCarId = -1;
  canvas.addEventListener('pointerdown', ev => {
    const b = canvas.getBoundingClientRect();
    const mx = (ev.clientX - b.left) / b.width * W;
    const my = (ev.clientY - b.top) / b.height * H;
    let best = null, bestD = 22;
    for (const c of cars) {
      const p = c.crossing
        ? crossingPos(c)
        : lanePos(c.seg, c.progress);
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < bestD) { bestD = d; best = c; }
    }
    selected = best;
    selCarId = best ? best.id : -1;
    updateInfo(best ? best.id : -1);
  });
  function crossingPos(c) {
    if (!c.crossing) return null;
    const cx = c.crossing;
    if (cx.straight) {
      const t = clamp(cx.dist / cx.total, 0, 1);
      return { x: cx.s0.x + (cx.t0.x - cx.s0.x) * t, y: cx.s0.y + (cx.t0.y - cx.s0.y) * t };
    }
    const th = cx.thS + cx.sweep * (cx.dist / cx.R0);
    return { x: cx.node.x + Math.cos(th) * cx.R0, y: cx.node.y + Math.sin(th) * cx.R0 };
  }
  function updateInfo(id) {
    const c = cars.find(k => k.id === id);
    if (!c) {
      iTitle.textContent = 'Click a vehicle to inspect it';
      iType.textContent = '—'; iSpeed.textContent = '—';
      iStatus.textContent = '—'; iDest.textContent = '—';
      return;
    }
    iTitle.textContent = 'Vehicle #' + c.id;
    iType.textContent = c.type === 'bus' ? 'Bus' : 'Car';
    iSpeed.textContent = Math.round(c.speed * 0.8) + ' km/h';
    let st;
    if (c.despawn) st = 'arriving';
    else if (c.crossing) st = 'in junction (' + c.crossing.turn + ')';
    else if (c.speed < 3) st = c.plan ? 'waiting (' + c.plan.turn + ')' : 'stopped';
    else st = 'cruising';
    iStatus.textContent = st;
    iDest.textContent = 'road ' + segLabel(c.tseg);
  }
  function segLabel(s) {
    const nm = s.kind === 'h' ? (s.dx > 0 ? 'E' : 'W') : (s.dy > 0 ? 'S' : 'N');
    const row = Math.round(s.y1 / BLOCK), col = Math.round(s.x1 / BLOCK);
    return (s.kind === 'h' ? 'Row ' + row : 'Col ' + col) + ' ' + nm;
  }

  // keyboard shortcuts
  window.addEventListener('keydown', ev => {
    if (ev.code === 'Space') { ev.preventDefault(); pauseBtn.click(); }
    else if (ev.key === '1') { multiplier = 1; speedBtns.forEach(x => x.classList.toggle('on', x.dataset.speed === '1')); }
    else if (ev.key === '2') { multiplier = 2; speedBtns.forEach(x => x.classList.toggle('on', x.dataset.speed === '2')); }
    else if (ev.key === '4') { multiplier = 4; speedBtns.forEach(x => x.classList.toggle('on', x.dataset.speed === '4')); }
    else if (ev.key === 'r' || ev.key === 'R') resetCity();
  });

  // ---------------------------------------------------------------- main loop
  const stage = document.getElementById('stage');
  function fit() {
    const sc = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.99;
    stage.style.transform = 'translate(-50%, -50%) scale(' + sc + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  let last = performance.now();
  let acc = 0;
  let hudTimer = 0;
  const FIXED = 1 / 60;
  let fps = 60;

  function frame(now) {
    const dtReal = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!paused) {
      acc += dtReal * multiplier;
      if (acc > 0.25) acc = 0.25;                 // avoid spiral of death
      let steps = 0;
      while (acc >= FIXED && steps < 4) {
        step(FIXED);
        acc -= FIXED;
        steps++;
      }
    }
    render(now);

    // HUD refresh ~8x/s
    hudTimer -= dtReal;
    if (hudTimer <= 0) {
      hudTimer = 0.12;
      let n = 0, sum = 0;
      for (const c of cars) if (!c.dead) { n++; sum += c.speed; }
      const avg = n ? sum / n : 0;
      stCars.textContent = n;
      stSpeed.textContent = Math.round(avg * 0.8);
      const mm = Math.floor(sim.t / 60), ss = Math.floor(sim.t % 60);
      stClock.textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
      stFlow.textContent = stats.arrived;
      if (selected) updateInfo(selected.id);
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- bootstrap
  resetCity();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
