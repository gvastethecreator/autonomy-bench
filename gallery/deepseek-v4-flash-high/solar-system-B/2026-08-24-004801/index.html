<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miniature Solar System</title>
<style>
  :root{
    --panel: rgba(12,16,32,0.72);
    --stroke: rgba(140,160,220,0.22);
    --txt: #dfe6ff;
    --dim: #8b96c9;
    --accent: #ffd27a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#04060f; color:var(--txt);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; }
  #labels{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  #labels .label{
    position:absolute; transform:translate(-50%,-50%);
    color:#cdd7f7; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    text-shadow:0 0 6px rgba(0,0,0,0.9), 0 0 18px rgba(80,110,220,0.35);
    white-space:nowrap; user-select:none;
  }
  #labels .label.dim{ opacity:0.62; }

  /* HUD */
  .hud{
    position:fixed; z-index:5; pointer-events:none;
    font-size:12px; color:var(--dim); letter-spacing:0.08em;
  }
  #title{ top:22px; left:26px; }
  #title h1{
    margin:0; font-size:17px; font-weight:600; letter-spacing:0.28em;
    color:#f2f6ff; text-shadow:0 0 24px rgba(120,160,255,0.35);
  }
  #title p{ margin:6px 0 0; font-size:10.5px; letter-spacing:0.16em; color:var(--dim); }
  #speed{ top:22px; right:26px; text-align:right; }
  #speed .pill{
    pointer-events:auto; cursor:pointer; user-select:none;
    display:inline-block; padding:6px 12px; border:1px solid var(--stroke);
    border-radius:999px; background:var(--panel); backdrop-filter: blur(8px);
    color:var(--txt); letter-spacing:0.14em; font-size:11px;
  }
  #speed .pill:hover{ border-color:rgba(140,160,220,0.5); }
  #hint{ bottom:22px; right:26px; text-align:right; line-height:1.9; text-shadow:0 1px 4px #000; }
  #hint b{ color:var(--accent); font-weight:600; }

  /* Planet info panel */
  #info{
    position:fixed; left:26px; bottom:22px; z-index:5; max-width:320px;
    padding:14px 18px; border:1px solid var(--stroke); border-radius:12px;
    background:var(--panel); backdrop-filter: blur(10px);
    pointer-events:none; opacity:0; transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  #info.show{ opacity:1; transform:translateY(0); }
  #info h2{ margin:0 0 4px; font-size:14px; font-weight:600; letter-spacing:0.18em; color:#f2f6ff; }
  #info p{ margin:0; font-size:12px; line-height:1.6; color:var(--dim); }

  /* Loader */
  #loader{
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(ellipse at 50% 45%, #0d1430 0%, #04060f 70%);
    transition:opacity 1s ease;
  }
  #loader.hide{ opacity:0; pointer-events:none; }
  #loader .ring{
    width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(140,160,220,0.18); border-top-color:var(--accent);
    animation:spin 1.1s linear infinite;
  }
  #loader .word{ font-size:13px; letter-spacing:0.34em; color:var(--dim); text-transform:uppercase; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>

  <div class="hud" id="title">
    <h1>MINIATURE SOLAR SYSTEM</h1>
    <p>three.js — A tiny walk through the neighbourhood</p>
  </div>
  <div class="hud" id="speed"><span class="pill" id="speedPill">TIME ×1</span></div>
  <div class="hud" id="hint">
    <b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; <b>click</b> a planet<br>
    <b>space</b> fast-forward &nbsp;·&nbsp; <b>H</b> labels
  </div>

  <div id="info">
    <h2 id="infoName"></h2>
    <p id="infoFact"></p>
  </div>

  <div id="loader"><div class="ring"></div><div class="word">warming up</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------- renderer / scene / camera ---------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060f);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
document.getElementById('labels').appendChild(labelRenderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.65, 0.82));
composer.addPass(new OutputPass());

/* ---------------- lights ---------------- */

scene.add(new THREE.AmbientLight(0x35405f, 0.55));
const sunLight = new THREE.PointLight(0xfff0d6, 4200, 0, 2);
scene.add(sunLight);

/* ---------------- helpers ---------------- */

function hash(x, y, seed){
  const s = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453;
  return s - Math.floor(s);
}

function makePlanetTexture(o){
  const w = 1024, h = 512;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const colors = o.colors.map(c => [c[0], c[1], c[2]]);
  const bands = o.bands ?? 3, wobble = o.wobble ?? 1.6, noiseAmt = o.noise ?? 0.12;
  const seed = o.seed ?? 1;
  for (let y = 0; y < h; y++){
    const t = y / h;
    let b = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * bands * 0.5 + seed * 7);
    b += (0.5 + 0.5 * Math.sin(t * Math.PI * 6 + seed * 3)) * 0.25;
    b /= 1.25;
    const row = y * w;
    for (let x = 0; x < w; x++){
      const u = x / w;
      const wave = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * bands * 0.5 + t * Math.PI * 2 * bands * wobble + seed * 11);
      const n = (hash(x, y, seed) * 2 - 1) * noiseAmt;
      const mix = Math.min(1, Math.max(0, b * 0.7 + wave * 0.3 + n));
      const idx = mix * (colors.length - 1);
      const i0 = Math.min(colors.length - 1, Math.floor(idx));
      const i1 = Math.min(colors.length - 1, i0 + 1);
      const f = idx - i0;
      let r = colors[i0][0] + (colors[i1][0] - colors[i0][0]) * f;
      let g = colors[i0][1] + (colors[i1][1] - colors[i0][1]) * f;
      let bl = colors[i0][2] + (colors[i1][2] - colors[i0][2]) * f;
      const polar = 1 - Math.pow(Math.abs(t - 0.5) * 2, 3) * 0.35;
      r *= polar; g *= polar; bl *= polar;
      const p = (row + x) * 4;
      d[p] = r; d[p + 1] = g; d[p + 2] = bl; d[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeEarthTexture(){
  const w = 1024, h = 512;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const GW = 7, GH = 4;
  const grid = [];
  for (let i = 0; i < GW * GH; i++) grid.push(Math.random());
  const smooth = t => t * t * (3 - 2 * t);
  function valueNoise(u, v, scale){
    const x = u * GW * scale, y = v * GH * scale;
    const x0 = Math.floor(x) % GW, x1 = (x0 + 1) % GW;
    const y0 = Math.min(GH - 1, Math.floor(y)), y1 = Math.min(GH - 1, y0 + 1);
    const fx = smooth(x - Math.floor(x)), fy = smooth(y - Math.floor(y));
    const a = grid[y0 * GW + x0], b = grid[y0 * GW + x1];
    const c = grid[y1 * GW + x0], e = grid[y1 * GW + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + e) * fx * fy;
  }
  // gradients for shading
  const oceanDeep = [18, 42, 110], ocean = [24, 74, 178], oceanShall = [48, 118, 214];
  const landHi = [122, 166, 84], land = [72, 128, 56], landLo = [52, 92, 44];
  for (let y = 0; y < h; y++){
    const t = y / h;
    const row = y * w;
    for (let x = 0; x < w; x++){
      const u = x / w;
      const n0 = valueNoise(u, t, 1);
      const n1 = valueNoise(u, t, 3.1) * 0.5;
      const n = Math.min(1, Math.max(0, n0 * 0.78 + n1));
      let r, g, bl;
      if (n > 0.56){
        const k = Math.min(1, (n - 0.56) / 0.18);
        r = landLo[0] + (landHi[0] - landLo[0]) * k;
        g = landLo[1] + (landHi[1] - landLo[1]) * k;
        bl = landLo[2] + (landHi[2] - landLo[2]) * k;
      } else {
        const k = Math.min(1, n / 0.56);
        if (k < 0.5){
          const f = k / 0.5;
          r = oceanDeep[0] + (ocean[0] - oceanDeep[0]) * f;
          g = oceanDeep[1] + (ocean[1] - oceanDeep[1]) * f;
          bl = oceanDeep[2] + (ocean[2] - oceanDeep[2]) * f;
        } else {
          const f = (k - 0.5) / 0.5;
          r = ocean[0] + (oceanShall[0] - ocean[0]) * f;
          g = ocean[1] + (oceanShall[1] - ocean[1]) * f;
          bl = ocean[2] + (oceanShall[2] - ocean[2]) * f;
        }
      }
      // ice caps
      if (t < 0.085 || t > 0.915){ r = 238; g = 244; bl = 250; }
      // clouds
      if (valueNoise(u, t, 2.2) > 0.68){
        const ci = 0.55;
        r = r + (235 - r) * ci; g = g + (240 - g) * ci; bl = bl + (245 - bl) * ci;
      }
      const p = (row + x) * 4;
      d[p] = r; d[p + 1] = g; d[p + 2] = bl; d[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeRingTexture(){
  const w = 512, h = 64;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let x = 0; x < w; x++){
    const t = x / w;
    // opacity profile from inner edge (t=0) to outer (t=1)
    let a = 0;
    if (t < 0.10) a = 0;
    else if (t < 0.17) a = 0.28;
    else if (t < 0.22) a = 0;
    else if (t < 0.50) a = 0.85;
    else if (t < 0.58) a = 0.5;
    else if (t < 0.63) a = 0.06;      // Cassini division
    else if (t < 0.90) a = 0.92;
    else a = 0.05;
    const shade = 0.72 + hash(x, 3, 17) * 0.26;
    for (let y = 0; y < h; y++){
      const vary = 0.85 + hash(x, y, 23) * 0.3;
      const aa = Math.min(1, a * vary);
      const p = (y * w + x) * 4;
      d[p] = 226 * shade; d[p + 1] = 208 * shade; d[p + 2] = 172 * shade; d[p + 3] = Math.floor(aa * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function glowTexture(){
  const s = 256;
  const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(255,244,214,1)');
  g.addColorStop(0.18, 'rgba(255,214,138,0.85)');
  g.addColorStop(0.45, 'rgba(255,170,90,0.28)');
  g.addColorStop(1, 'rgba(255,150,70,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeLabel(text, dim){
  const el = document.createElement('div');
  el.className = 'label' + (dim ? ' dim' : '');
  el.textContent = text;
  const obj = new CSS2DObject(el);
  obj.userData.labelEl = el;
  return obj;
}

function makeOrbitLine(radius){
  const seg = 180, pts = [];
  for (let i = 0; i <= seg; i++){
    const a = i / seg * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color: 0x8fa3c8, transparent: true, opacity: 0.14 });
  return new THREE.Line(g, m);
}

function makeAtmosphere(radius, color, opacity){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 1.12, 32, 24),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity,
      side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  return m;
}

/* ---------------- sun ---------------- */

const system = new THREE.Group();
scene.add(system);

const sunGeo = new THREE.SphereGeometry(4.5, 48, 32);
const sunTex = makePlanetTexture({ colors: [[255,246,214],[255,204,116],[255,158,74]], bands: 5, noise: 0.22, seed: 9 });
const sun = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ map: sunTex }));
system.add(sun);

const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
glow.scale.setScalar(30);
system.add(glow);
const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.4 }));
glow2.scale.setScalar(72);
system.add(glow2);

const sunLabel = makeLabel('Sol', true);
sunLabel.position.set(0, 6.8, 0);
system.add(sunLabel);

/* ---------------- planet data ---------------- */

const DATA = [
  { name:'Mercury', radius:0.55, orbit:10,  period:1.8,  spin:0.35, tilt:0.08,
    tex:()=>makePlanetTexture({ colors:[[135,129,121],[174,166,154],[108,102,95]], bands:2, noise:0.4, seed:2 }),
    fact:'Closest to the Sun — a year here lasts just 88 Earth days.' },
  { name:'Venus', radius:0.95, orbit:14,  period:2.8,  spin:0.16, tilt:0.16,
    tex:()=>makePlanetTexture({ colors:[[236,214,160],[210,180,120],[250,234,194]], bands:3, noise:0.22, seed:3 }),
    atmosphere:[0xd9c49a, 0.20],
    fact:'The hottest planet. It spins backwards, and a day is longer than its year.' },
  { name:'Earth', radius:1.0, orbit:19,  period:4.2,  spin:0.6, tilt:0.41,
    tex:makeEarthTexture, moon:true, atmosphere:[0x6f9fe8, 0.24],
    fact:'Our home — 71% ocean, one moon, and the only known place with life.' },
  { name:'Mars', radius:0.7, orbit:24,  period:6.6,  spin:0.55, tilt:0.18,
    tex:()=>makePlanetTexture({ colors:[[208,96,44],[158,70,34],[238,138,84]], bands:2, noise:0.42, seed:5 }),
    fact:'The red planet. Home to Olympus Mons, the tallest volcano in the solar system.' },
  { name:'Jupiter', radius:2.9, orbit:34,  period:11.5, spin:1.1, tilt:0.05,
    tex:()=>makePlanetTexture({ colors:[[228,192,150],[198,160,120],[248,226,190],[170,128,92]], bands:11, noise:0.16, wobble:3, seed:6 }),
    fact:'The giant of the family. The Great Red Spot is a storm bigger than Earth.' },
  { name:'Saturn', radius:2.4, orbit:39,  period:16.5, spin:1.0, tilt:0.47, ring:true,
    tex:()=>makePlanetTexture({ colors:[[238,220,182],[208,188,150],[252,238,208]], bands:8, noise:0.12, wobble:2, seed:7 }),
    fact:'Fabled for its rings of ice and rock — astonishingly thin, only metres thick in places.' },
  { name:'Uranus', radius:1.55, orbit:47, period:22,  spin:-0.5, tilt:1.55,
    tex:()=>makePlanetTexture({ colors:[[172,226,230],[132,198,210]], bands:2, noise:0.06, seed:8 }),
    atmosphere:[0x9fdce8, 0.16],
    fact:'It rolls on its side — its poles take turns facing the Sun.' },
  { name:'Neptune', radius:1.5, orbit:55,  period:30,  spin:0.5, tilt:0.3,
    tex:()=>makePlanetTexture({ colors:[[76,120,238],[50,88,206],[132,182,255]], bands:3, noise:0.1, seed:9 }),
    fact:'The windiest world — supersonic gusts reach 2,000 km/h.' },
];

const clickMeshes = [];
const labelEls = [];
const bodies = [];

for (const p of DATA){
  const orbitTilt = new THREE.Object3D();
  orbitTilt.rotation.x = (Math.random() * 0.05) + 0.0;
  orbitTilt.rotation.z = (Math.random() * 0.06) - 0.03;
  system.add(orbitTilt);

  orbitTilt.add(makeOrbitLine(p.orbit));

  const pivot = new THREE.Object3D();
  orbitTilt.add(pivot);

  const planetGroup = new THREE.Object3D();
  planetGroup.position.x = p.orbit;
  planetGroup.rotation.z = p.tilt;
  pivot.add(planetGroup);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.radius, 40, 28),
    new THREE.MeshStandardMaterial({ map: p.tex(), roughness: 0.92, metalness: 0.05 })
  );
  mesh.userData = { name: p.name, fact: p.fact };
  planetGroup.add(mesh);
  clickMeshes.push(mesh);

  if (p.atmosphere) planetGroup.add(makeAtmosphere(p.radius, p.atmosphere[0], p.atmosphere[1]));

  const label = makeLabel(p.name, true);
  label.position.set(0, p.radius * 1.5 + 0.6, 0);
  planetGroup.add(label);
  labelEls.push(label.userData.labelEl);

  if (p.ring){
    const ringMesh = new THREE.Mesh(
      new THREE.RingGeometry(3.0, 6.5, 128, 1),
      new THREE.MeshBasicMaterial({ map: makeRingTexture(), side: THREE.DoubleSide,
        transparent: true, depthWrite: false })
    );
    ringMesh.rotation.x = -Math.PI / 2;
    planetGroup.add(ringMesh);
  }

  let moonPivot = null;
  let moonPeriod = 0;
  if (p.moon){
    moonPivot = new THREE.Object3D();
    moonPivot.position.x = p.orbit;
    moonPivot.rotation.x = 0.09;
    pivot.add(moonPivot);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.26, 24, 16),
      new THREE.MeshStandardMaterial({ color: 0x9a9aa6, roughness: 1, metalness: 0 })
    );
    const moonOrbit = 1.9;
    moon.position.x = moonOrbit;
    moon.userData = { name: 'Moon', fact: "Earth's companion — it drifts about 3.8 cm farther away every year." };
    moonPivot.add(moon);
    clickMeshes.push(moon);

    const moonLine = makeOrbitLine(moonOrbit);
    moonLine.material.opacity = 0.12;
    moonPivot.add(moonLine);

    moonPeriod = 5.4;
  }

  bodies.push({ root: orbitTilt, period: p.period, spin: p.spin, mesh, moonPivot, moonPeriod });
}

/* ---------------- asteroid belt ---------------- */

function makeBelt(){
  const count = 1400;
  const pos = new Float32Array(count * 3);
  const inner = 27, outer = 31;
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const r = inner + Math.pow(Math.random(), 0.6) * (outer - inner);
    pos[i*3]   = Math.cos(a) * r;
    pos[i*3+1] = (Math.random() - 0.5) * 0.7;
    pos[i*3+2] = Math.sin(a) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0x8f8678, size: 0.09, sizeAttenuation: true, transparent: true, opacity: 0.85 });
  const belt = new THREE.Points(g, m);
  belt.rotation.x = 0.14;
  return belt;
}
const belt = makeBelt();
system.add(belt);

/* ---------------- starfield ---------------- */

function makeStars(){
  const count = 3200;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++){
    const r = 700 + Math.random() * 900;
    const t = Math.acos(2 * Math.random() - 1);
    const ph = Math.random() * Math.PI * 2;
    pos[i*3]   = r * Math.sin(t) * Math.cos(ph);
    pos[i*3+1] = r * Math.cos(t) * 0.6;
    pos[i*3+2] = r * Math.sin(t) * Math.sin(ph);
    const roll = Math.random();
    if (roll < 0.82) c.setRGB(1, 1, 1);
    else if (roll < 0.92) c.setRGB(0.75, 0.85, 1);
    else c.setRGB(1, 0.82, 0.62);
    const s = 0.4 + Math.random() * 0.6;
    col[i*3] = c.r * s; col[i*3+1] = c.g * s; col[i*3+2] = c.b * s;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({ size: 1.1, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.95, depthWrite: false });
  return new THREE.Points(g, m);
}
const stars = makeStars();
scene.add(stars);

/* ---------------- controls ---------------- */

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 7;
controls.maxDistance = 280;
controls.maxPolarAngle = Math.PI * 0.94;
controls.target.set(0, 0, 0);
controls.enabled = false;

/* ---------------- interaction: click to inspect ---------------- */

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, dragged = false;

const info = document.getElementById('info');
const infoName = document.getElementById('infoName');
const infoFact = document.getElementById('infoFact');

renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; dragged = false;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (dragged) return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) dragged = true;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (dragged) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(clickMeshes, false);
  if (hits.length){
    const o = hits[0].object.userData;
    infoName.textContent = o.name;
    infoFact.textContent = o.fact;
    info.classList.add('show');
  } else {
    info.classList.remove('show');
  }
});

/* ---------------- HUD keys ---------------- */

let timeScale = 1;
const speedPill = document.getElementById('speedPill');
speedPill.addEventListener('click', toggleSpeed);
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); toggleSpeed(); }
  if (e.key === 'h' || e.key === 'H'){
    const hidden = labelEls[0].style.visibility === 'hidden';
    for (const el of labelEls) el.style.visibility = hidden ? 'visible' : 'hidden';
    sunLabel.userData.labelEl.style.visibility = hidden ? 'visible' : 'hidden';
  }
});
function toggleSpeed(){
  timeScale = timeScale === 1 ? 3 : 1;
  speedPill.textContent = timeScale === 1 ? 'TIME ×1' : 'TIME ×3';
}

/* ---------------- resize ---------------- */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ---------------- intro & main loop ---------------- */

const introFrom = new THREE.Vector3(10, 14, 24);
const introTo   = new THREE.Vector3(30, 34, 66);
const introDur = 3.4;
let introT = 0;
camera.position.copy(introFrom);

const clock = new THREE.Clock();
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

// hide the loader after a moment
setTimeout(() => document.getElementById('loader').classList.add('hide'), 350);
setTimeout(() => document.getElementById('loader').remove(), 1600);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // intro camera flight
  if (introT < introDur){
    introT += dt;
    const k = easeOutCubic(Math.min(1, introT / introDur));
    camera.position.lerpVectors(introFrom, introTo, k);
    camera.lookAt(0, 0, 0);
    if (introT >= introDur) controls.enabled = true;
  }

  // orbits & spins
  const tdt = dt * timeScale;
  for (const b of bodies){
    b.root.rotation.y += (Math.PI * 2 / b.period) * tdt;
    b.mesh.rotation.y += b.spin * tdt;
    if (b.moonPivot) b.moonPivot.rotation.y += (Math.PI * 2 / b.moonPeriod) * tdt;
  }
  belt.rotation.y += tdt * 0.0085;
  stars.rotation.y += dt * 0.004;

  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
}
animate();
</script>
</body>
