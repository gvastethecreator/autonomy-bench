<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Aurora International — Live Operations</title>
<style>
  :root{
    --bg:#05070d; --panel:#0c1220; --panel2:#0f1729; --line:#1c2740; --line2:#24314f;
    --txt:#d7e2f0; --dim:#7c8ba5; --faint:#4c5a75;
    --cyan:#38bdf8; --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa; --violet:#a78bfa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 700px at 60% 0%, #0a1120 0%, var(--bg) 60%);
    color:var(--txt);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    font-size:13px;
  }
  header{
    display:flex; align-items:center; gap:18px; padding:8px 14px;
    background:linear-gradient(180deg,#0d1526,#0a1120);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand .t{font-weight:700; letter-spacing:2px; color:#eaf3ff; font-size:15px;}
  .brand .s{color:var(--cyan); font-size:10px; letter-spacing:3px;}
  .hitem{display:flex; flex-direction:column; line-height:1.25; padding:2px 10px; border-left:1px solid var(--line);}
  .hitem .k{font-size:9px; letter-spacing:1.5px; color:var(--faint);}
  .hitem .v{font-family:Consolas,"Cascadia Mono",monospace; font-size:14px; color:#eaf3ff;}
  .hitem .v.ok{color:var(--green);} .hitem .v.warn{color:var(--amber);} .hitem .v.cy{color:var(--cyan);}
  .hsep{flex:1;}
  .btn{
    background:linear-gradient(180deg,#17233b,#101a2e); color:var(--txt);
    border:1px solid var(--line2); border-radius:6px; padding:5px 12px; cursor:pointer;
    font-family:Consolas,"Cascadia Mono",monospace; font-size:12px; letter-spacing:.5px;
  }
  .btn:hover{background:linear-gradient(180deg,#1c2a45,#131f35); border-color:#33466b;}
  .btn.on{background:linear-gradient(180deg,#0e3a4d,#0a2a38); border-color:#1f6f8f; color:#9fe8ff;}
  .btn.accent{background:linear-gradient(180deg,#14532d,#0c3b20); border-color:#1e7a41; color:#86efac;}
  .btn.accent:hover{background:linear-gradient(180deg,#166534,#0e4728);}
  .btn.danger{background:linear-gradient(180deg,#5b1f2b,#45141d); border-color:#7c2d3c; color:#fda4af;}
  .ctrl{display:flex; align-items:center; gap:8px;}
  .ctrl .lbl{font-size:10px; color:var(--dim); letter-spacing:1px;}
  select.btn{appearance:none; padding:5px 8px;}
  input[type=range]{width:110px; accent-color:var(--cyan);}
  main{flex:1; display:flex; min-height:0;}
  #stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-width:0;}
  #stage::after{ /* subtle vignette */
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.55); border-radius:2px;
  }
  canvas{display:block; max-width:100%; max-height:100%; object-fit:contain;}
  aside{
    width:336px; flex:none; display:flex; flex-direction:column; gap:8px; padding:8px;
    background:#0a101d; border-left:1px solid var(--line); overflow:hidden;
  }
  .panel{display:flex; flex-direction:column; min-height:0; border:1px solid var(--line); border-radius:8px; background:var(--panel);}
  .panel h3{
    font-size:10px; letter-spacing:2px; color:var(--dim); padding:7px 12px 5px;
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
    font-weight:600;
  }
  .panel h3 .cnt{color:var(--cyan); font-family:Consolas,monospace; font-size:11px;}
  .board{overflow:hidden; display:flex; flex-direction:column;}
  .board .scroll{overflow-y:auto; min-height:0; flex:1;}
  .board .scroll::-webkit-scrollbar{width:6px;}
  .board .scroll::-webkit-scrollbar-thumb{background:#24314f; border-radius:3px;}
  #arrivalsPanel{flex:1.15;}
  #departuresPanel{flex:1.15;}
  #logPanel{flex:1.3;}
  table{width:100%; border-collapse:collapse; font-family:Consolas,"Cascadia Mono",monospace; font-size:11px;}
  th{position:sticky; top:0; background:var(--panel2); color:var(--faint); font-weight:600;
     text-align:left; padding:3px 8px; letter-spacing:1px; font-size:9px; border-bottom:1px solid var(--line);}
  td{padding:3px 8px; border-bottom:1px solid #131c30; white-space:nowrap;}
  tr.dim td{color:var(--dim);}
  tr:hover td{background:#111b31;}
  .st{font-size:9px; letter-spacing:.5px; padding:1px 5px; border-radius:3px; white-space:nowrap;}
  .st.air{background:#173a52; color:#7dd3fc;}
  .st.app{background:#0c2b45; color:#38bdf8;}
  .st.land{background:#14532d; color:#86efac;}
  .st.tax{background:#1e3a8a; color:#a5b4fc;}
  .st.gate{background:#3b2c12; color:#fcd34d;}
  .st.dep{background:#312e81; color:#c7d2fe;}
  .st.hold{background:#451a03; color:#fdba74;}
  .st.airborne{background:#134e4a; color:#5eead4;}
  .st.rem{background:#41121f; color:#fda4af;}
  .logline{font-family:Consolas,"Cascadia Mono",monospace; font-size:10.5px; padding:2px 10px; border-bottom:1px solid #101a2e; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .logline .tm{color:var(--faint); margin-right:6px;}
  .logline .ok{color:var(--green);} .logline .info{color:var(--cyan);} .logline .warn{color:var(--amber);} .logline .bad{color:var(--red);}
  #info{
    position:absolute; z-index:20; min-width:230px; max-width:300px; pointer-events:none;
    background:rgba(10,16,29,.94); border:1px solid var(--line2); border-radius:8px; padding:10px 12px;
    box-shadow:0 8px 30px rgba(0,0,0,.6); font-family:Consolas,"Cascadia Mono",monospace;
  }
  #info.hidden{display:none;}
  #info .h{font-size:13px; color:#fff; letter-spacing:1px; margin-bottom:6px;}
  #info .h .al{color:var(--cyan);}
  #info table{font-size:11px;}
  #info td{padding:2px 0; border:none;}
  #info td:first-child{color:var(--faint); padding-right:10px;}
  #paused{
    position:absolute; z-index:15; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:26px; letter-spacing:8px; color:var(--amber); font-weight:700;
    border:2px solid var(--amber); border-radius:10px; padding:10px 26px;
    background:rgba(10,10,5,.55); text-shadow:0 0 18px rgba(251,191,36,.6);
  }
  #paused.hidden{display:none;}
  #opsbadge{font-family:Consolas,monospace; font-size:10px; color:var(--dim);}
  @media (max-width:1000px){ aside{display:none;} }
</style>

<body>
<header>
  <div class="brand"><span class="t">AURORA INTL</span><span class="s">AUR · LIVE OPERATIONS</span></div>
  <div class="hitem"><span class="k">SIM CLOCK</span><span class="v" id="clock">06:00:00</span></div>
  <div class="hitem"><span class="k">WIND</span><span class="v" id="wind">—</span></div>
  <div class="hitem"><span class="k">ARRIVALS RWY</span><span class="v cy" id="arrRwy">—</span></div>

<div class="ctrl" style="padding:6px 14px; gap:10px; background:#0b1322; border-bottom:1px solid var(--line);">
  <button class="btn" id="btnPause" title="Space">⏸ PAUSE</button>
  <button class="btn" id="btnWind" title="W">🌀 CHANGE WIND</button>
  <div class="ctrl"><span class="lbl">SPEED</span>
    <button class="btn speed" data-sp="1">1×</button>
    <button class="btn speed" data-sp="2">2×</button>
    <button class="btn speed on" data-sp="4">4×</button>
    <button class="btn speed" data-sp="8">8×</button>

  </div>

    <select class="btn" id="density">

<main>
  <div id="stage">
    <canvas id="cv" width="1600" height="950"></canvas>
    <div id="info" class="hidden"></div>
    <div id="paused" class="hidden">PAUSED</div>
  </div>
  <aside>
    <div class="panel" id="arrivalsPanel">
      <h3>ARRIVALS <span class="cnt" id="arrCount">0</span></h3>
      <div class="board"><div class="scroll" id="arrivalsBoard">
        <table><thead><tr><th>FLIGHT</th><th>FROM</th><th>TYPE</th><th>ETA</th><th>STATUS</th></tr></thead>
        <tbody></tbody></table>

    </div>

      <h3>DEPARTURES <span class="cnt" id="depCount">0</span></h3>

        <table><thead><tr><th>FLIGHT</th><th>TO</th><th>TYPE</th><th>STATUS</th></tr></thead>
        <tbody></tbody></table>
      </div></div>

<script>
"use strict";
/* ============================================================
   AURORA INTERNATIONAL — live airport operations simulation
   Single-file, canvas-based. No dependencies.
   ============================================================ */

// ---------- canvas ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 950;

// ---------- world layout ----------
const RWY_Y_ARR = 650;          // arrivals runway (09R/27L)
const RWY_Y_DEP = 300;          // departures runway (09L/27R)
const RWY_X0 = 200, RWY_X1 = 1400;
const MAIN_Y = 475;             // main taxiway
const TERM_X = 1440;            // terminal taxiway x
const GATE_X = 1400;            // gate spots
const BLDG_X0 = 1470, BLDG_X1 = 1580, BLDG_Y0 = 350, BLDG_Y1 = 620;
const TOWER = { x: 1550, y: 330 };
const GATE_YS = [380, 410, 440, 470, 500, 530, 560, 590];
const XS = [200, 350, 650, 950, 1250, 1440]; // connectors

// ---------- simulation constants (px/sec at 1x) ----------
const SP_AIR = 92, SP_ORBIT = 85, SP_FINAL = 68, SP_TOUCH = 65, SP_VACATE = 30;
const SP_TAXI = 52, SP_TAXI_H = 46, SP_CLIMB = 106, ROTATE_SPEED = 80;
const DECIDE_DIST = 160;        // go-around decision distance before threshold
const RWY_ACC = 55, RWY_DECEL = 42;

// ---------- data ----------
const AIRLINES = [
  { code:'AX', name:'Aurora Air',      color:'#38bdf8' },
  { code:'BW', name:'Bluewing',        color:'#3b82f6' },
  { code:'NL', name:'Northlink',       color:'#22d3ee' },
  { code:'VT', name:'Volantis',        color:'#a78bfa' },
  { code:'SL', name:'Skyline Express', color:'#f59e0b' },
  { code:'CR', name:'Comet Air',       color:'#f472b6' },
  { code:'RW', name:'Redwood Airways', color:'#ef4444' },
  { code:'SJ', name:'Silverjet',       color:'#94a3b8' },
];
const CITIES = ['LHR','CDG','AMS','FRA','MAD','BCN','ROM','BER','VIE','ZRH','HEL','DUB','LIS','ATH','IST','MUC','PRG','WAW','OSL','ARN','GVA','NCE'];
const TYPES = {
  RJ:{ label:'RJ',  scale:0.60, turn:44, pax:92  },
  NB:{ label:'NB',  scale:0.85, turn:68, pax:176 },
  WB:{ label:'WB',  scale:1.18, turn:110,pax:330 },
};

// ---------- taxi graph ----------
const nodes = {}, edges = {};
function addNode(id, x, y){ nodes[id] = {x, y}; edges[id] = []; }
function link(a, b){ edges[a].push(b); edges[b].push(a); }

GATE_YS.forEach((y,i)=> addNode('g'+i, GATE_X, y));
const chainYs = [350, ...GATE_YS, 620];
chainYs.forEach(y=>{ if(y!==475) addNode('t'+y, TERM_X, y); });
addNode('m1440', TERM_X, 475);
GATE_YS.forEach((y,i)=> link('g'+i, 't'+y));
const chainSort = [350,380,410,440,470,500,530,560,590,620];
for(let i=0;i<chainSort.length-1;i++){
  const a = chainSort[i]===475 ? 'm1440' : 't'+chainSort[i];
  const b = chainSort[i+1]===475 ? 'm1440' : 't'+chainSort[i+1];
  link(a,b);
}
['m200','m350','m650','m950','m1250'].forEach(id=> addNode(id, +id.slice(1), MAIN_Y));
link('m200','m350'); link('m350','m650'); link('m650','m950'); link('m950','m1250'); link('m1250','m1440');
XS.forEach(x=>{
  addNode('u'+x+'h', x, 390); addNode('u'+x, x, RWY_Y_DEP);
  addNode('l'+x+'h', x, 585); addNode('l'+x, x, RWY_Y_ARR);
  link('m'+x, 'u'+x+'h'); link('u'+x+'h','u'+x);
  link('m'+x, 'l'+x+'h'); link('l'+x+'h','l'+x);
});

function dijkstra(from, to){
  if(!nodes[from] || !nodes[to]) return null;
  const dist = {}, prev = {}, seen = new Set();
  for(const id in nodes) dist[id] = Infinity;
  dist[from] = 0;
  while(true){
    let u = null, bd = Infinity;
    for(const id in dist){ if(!seen.has(id) && dist[id] < bd){ bd = dist[id]; u = id; } }
    if(u===null || u===to) break;
    seen.add(u);
    for(const v of edges[u]){
      const alt = dist[u] + Math.hypot(nodes[u].x-nodes[v].x, nodes[u].y-nodes[v].y);
      if(alt < dist[v]){ dist[v] = alt; prev[v] = u; }
    }
  }
  if(dist[to]===Infinity) return null;
  const path = [to]; let cur = to;
  while(cur !== from){ cur = prev[cur]; path.unshift(cur); }
  return path; // array of node ids, includes both ends
}
function nodePathIdsToPoints(ids){ return ids.map(id=> ({x:nodes[id].x, y:nodes[id].y})); }
function taxiDist(a, b){ const p = dijkstra(a,b); return p ? p.length : Infinity; }

// ---------- gates ----------
const gates = GATE_YS.map((y,i)=>({ id:'G'+(i+1), node:'g'+i, x:GATE_X, y, occupied:false, flight:null }));
function freeGateFor(exitNodeId){
  let best=null, bd=Infinity;
  for(const g of gates){
    if(g.occupied) continue;
    const d = taxiDist(exitNodeId, g.node);
    if(d < bd){ bd = d; best = g; }
  }
  return best;
}

// ---------- runways ----------
const runways = {
  arr: { y: RWY_Y_ARR, occupant:null, name:()=> ops==='W' ? '27L' : '09R' },
  dep: { y: RWY_Y_DEP, occupant:null, name:()=> ops==='W' ? '27R' : '09L' },
};
let ops = 'W';               // 'W' westbound ops, 'E' eastbound ops
let opsGen = 0;              // bumped on every wind shift
let windSpd = 12;
let lastDepTime = -99;

// ---------- state ----------
let simTime = 6*3600;        // 06:00:00
let paused = false;
let speed = 4;
let density = 'med';
let aircraft = [];
let idCounter = 1;
const stats = { landed:0, departed:0, goarounds:0 };
const log = [];
let spawnTimer = 2;
let windTimer = 140 + Math.random()*140;
let sweep = 0;

// ---------- helpers ----------
const rand = (a,b)=> a + Math.random()*(b-a);
const randInt = (a,b)=> Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
function angLerp(a,b,t){ let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*t; }
function angDiff(a,b){ return ((a-b+Math.PI*3)%(Math.PI*2))-Math.PI; }
const rad = d => d*Math.PI/180;
const dist = (p,q)=> Math.hypot(p.x-q.x, p.y-q.y);
function fmtTime(t){
  const s = Math.max(0, Math.floor(t));
  const h = Math.floor(s/3600)%24, m = Math.floor(s/60)%60, ss = s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function logMsg(msg, cls){
  log.push({ t: fmtTime(simTime), msg, cls: cls||'info' });
  if(log.length > 120) log.shift();
}
function paxGate(){ return Math.max(1, Math.round(Math.random()*3)); }

// ---------- ops / geometry ----------
function thresholdX(){ return ops==='W' ? RWY_X1 : RWY_X0; }
function touchX(){ return ops==='W' ? RWY_X1-80 : RWY_X0+80; }
function finalFix(){ return ops==='W' ? {x:1560,y:RWY_Y_ARR} : {x:40,y:RWY_Y_ARR}; }
function joinPath(){ return ops==='W'
  ? [{x:1680,y:940},{x:1630,y:790},{x:1560,y:RWY_Y_ARR}]
  : [{x:-80,y:940},{x:-30,y:790},{x:40,y:RWY_Y_ARR}]; }
function orbitPath(){
  return ops==='W'
    ? [{x:1580,y:600},{x:1580,y:500},{x:1400,y:500},{x:1520,y:800},{x:1560,y:RWY_Y_ARR}]
    : [{x:20,y:600},{x:20,y:500},{x:200,y:500},{x:80,y:800},{x:40,y:RWY_Y_ARR}];
}
function goaroundPath(){ return ops==='W'
  ? [{x:1580,y:640},{x:1580,y:500},{x:1400,y:500},{x:1520,y:800},{x:1560,y:RWY_Y_ARR}]
  : [{x:20,y:640},{x:20,y:500},{x:200,y:500},{x:80,y:800},{x:40,y:RWY_Y_ARR}]; }
function rotX(){ return ops==='W' ? 260 : 1340; }
function depExitX(){ return ops==='W' ? 40 : 1560; }

function redirectAirborne(){
  // re-vector all uncommitted airborne traffic onto the new runway direction
  const ff = finalFix();
  for(const a of aircraft){
    if(a.air && (a.state==='ENROUTE'||a.state==='ORBIT')){
      a.state = 'ENROUTE';
      a.opsGen = opsGen;
      a.alt = Math.max(a.alt, 1500);
      a.speed = SP_AIR;
      a.path = [{x: ff.x, y: ff.y - 70}, {x: ff.x, y: ff.y}];
      a.cleared = false;
    }
  }
}

// ---------- spacing & clearance ----------
function finalSpacingOk(a){
  // only a stack of FINAL aircraft near the join point blocks a new join;
  // airborne traffic in the pattern sequences itself naturally.
  const ff = finalFix();
  for(const o of aircraft){
    if(o===a || o.state!=='FINAL') continue;
    if(dist(o.pos, ff) < 460) return false;
  }
  return true;
}
function arrClear(a){
  const occ = runways.arr.occupant;
  if(!occ || occ===a) return true;
  const ttd = Math.max(0.5, Math.abs(a.pos.x - thresholdX()) / SP_FINAL);
  const oRem = occ.exitX===null ? 999 : Math.abs(occ.x - occ.exitX) / Math.max(24, occ.speed);
  return oRem < ttd - 1.2;
}
function depClear(){
  return runways.dep.occupant===null && (simTime - lastDepTime) > 2.5;
}
function countAirborne(){
  return aircraft.filter(a=> a.air).length;
}
function freeGates(){ return gates.filter(g=>!g.occupied).length; }

// ---------- aircraft creation ----------
function newAircraft(seed){
  const al = pick(AIRLINES);
  const tyKeys = ['RJ','RJ','RJ','RJ','NB','NB','WB'];
  const ty = TYPES[pick(tyKeys)];
  const city = pick(CITIES);
  return {
    id: idCounter++,
    callsign: al.code + randInt(100,999),
    airline: al, type: ty,
    from: city, to: 'AUR',
    pos: {x:0,y:0}, heading: rad(270), bank:0, speed:0,
    path: [], air:true, alt:2600, opsGen,
    scale: ty.scale, sizeMul:1,
    state:'ENROUTE', landDir:'W', cleared:false,
    exitX:null, exitNode:null, gate:null,
    turn:0, turnTotal:1, accel:0, seed,
  };
}

function spawnArrival(progress){
  const a = newAircraft(false);
  const path = joinPath().map(p=>({...p}));
  let placed = false;
  let total = 0;
  for(let i=1;i<path.length;i++) total += dist(path[i-1], path[i]);
  const target = total * clamp(progress, 0, 0.99);
  let acc = 0;
  for(let i=1;i<path.length;i++){
    const seg = dist(path[i-1], path[i]);
    if(acc+seg >= target){
      const f = (target-acc)/seg;
      a.pos = { x: lerp(path[i-1].x, path[i].x, f), y: lerp(path[i-1].y, path[i].y, f) };
      a.path = path.slice(i-1).map(p=>({...p}));
      placed = true;
      break;
    }
    acc += seg;
  }
  if(!placed){ a.pos = {x:path[0].x, y:path[0].y}; a.path = path.map(p=>({...p})); }
  a.speed = SP_AIR;
  a.alt = 2800;
  aircraft.push(a);
  return a;
}

function seedGateAircraft(g, boardingFrac){
  const a = newAircraft(false);
  a.state = 'ATGATE'; a.air = false;
  a.pos = {x:g.x, y:g.y}; a.heading = rad(90);
  a.gate = g; g.occupied = true; g.flight = a;
  a.to = pick(CITIES);
  a.turnTotal = a.type.turn * rand(0.85, 1.15);
  a.turn = a.turnTotal * (1 - boardingFrac);
  aircraft.push(a);
}

// ---------- movement ----------
function moveAlong(a, dt){
  if(!a.path.length) return true;
  const t = a.path[0];
  const dx = t.x - a.pos.x, dy = t.y - a.pos.y;
  const d = Math.hypot(dx,dy);
  const targetH = Math.atan2(dy,dx);
  const turnRate = a.air ? 2.2 : 3.6;
  a.heading = angLerp(a.heading, targetH, Math.min(1, dt*turnRate));
  a.bank = lerp(a.bank, clamp(angDiff(targetH, a.heading)*-9, -0.55, 0.55), dt*4);
  const step = a.speed * dt;
  if(d <= step + 0.5){
    a.pos.x = t.x; a.pos.y = t.y;
    a.path.shift();
    return a.path.length===0;
  }
  a.pos.x += Math.cos(a.heading)*step;
  a.pos.y += Math.sin(a.heading)*step;
  return false;
}

function groundSlow(a, dt){
  // keep separation from other taxiing aircraft
  a.sizeMul = 1;
  for(const o of aircraft){
    if(o===a || o.air || o.state==='ATGATE') continue;
    const d = dist(a.pos, o.pos);
    if(d < 64){ a.sizeMul = Math.min(a.sizeMul, d/64); }
  }
  a.sizeMul = clamp(a.sizeMul, 0.35, 1);
}

// ---------- exit / gate selection at landing ----------
function chooseExitAndGate(a){
  const W_ = a.landDir==='W';
  const cands = W_ ? [1250,950,650,350,200] : [350,650,950,1250,1440];
  let best=null, bs=Infinity;
  for(const X of cands){
    const roll = Math.abs(touchX() - X);
    if(roll < 60) continue;
    let bd = Infinity;
    for(const g of gates){
      if(g.occupied) continue;
      const d = taxiDist('l'+X, g.node);
      if(d < bd) bd = d;
    }
    const score = roll*0.55 + (bd===Infinity? 99999 : bd) + Math.random()*80;
    if(score < bs){ bs = score; best = X; }
  }
  if(best===null) best = W_ ? 650 : 650;
  const exitX = best;
  const gate = freeGateFor('l'+exitX);
  return { exitX, gate, exitNode:'l'+exitX };
}

// ---------- state transitions ----------
function tryJoin(a){
  if(freeGates()===0){ a.state='ORBIT'; a.speed=SP_ORBIT; a.path = orbitPath(); return; }
  if(!finalSpacingOk(a)){ a.state='ORBIT'; a.speed=SP_ORBIT; a.path = orbitPath(); return; }
  a.state = 'FINAL';
  a.speed = SP_FINAL;
  a.path = [{x: touchX(), y: RWY_Y_ARR}];
  a.cleared = arrClear(a);
  a.alt = 900;
}

function landAircraft(a){
  a.state = 'ROLLOUT';
  a.air = false; a.alt = 0;
  a.speed = SP_TOUCH;
  a.landDir = Math.cos(a.heading) < 0 ? 'W' : 'E';
  runways.arr.occupant = a;
  const sel = chooseExitAndGate(a);
  a.exitX = sel.exitX; a.exitNode = sel.exitNode; a.gate = sel.gate;
  stats.landed++;
  logMsg(a.callsign+' landed '+a.landDir+' on '+runways.arr.name()+', exit '+a.exitX, 'ok');
}

function startTaxiIn(a){
  a.state = 'TAXI';
  a.speed = a.type.label==='WB' ? SP_TAXI_H : SP_TAXI;
  const path = dijkstra(a.exitNode, a.gate.node);
  a.path = path ? nodePathIdsToPoints(path) : [];
}

function arriveGate(a){
  a.state = 'ATGATE';
  a.air = false;
  a.heading = rad(90);
  a.pos = {x: a.gate.x, y: a.gate.y};
  a.gate.occupied = true; a.gate.flight = a;
  const destPool = CITIES.filter(c=> c!==a.from);
  a.to = pick(destPool);
  a.turnTotal = a.type.turn * rand(0.85, 1.2);
  a.turn = a.turnTotal;
  logMsg(a.callsign+' at gate '+a.gate.id+' · turnaround '+Math.round(a.turn)+'s', 'info');
}

function departInit(a){
  a.gate.occupied = false; a.gate.flight = null;
  const from = a.gate.node;
  const destPool = CITIES.filter(c=> c!==a.from);
  a.to = pick(destPool);
  // pick departure entry with enough roll distance
  const W_ = ops==='W';
  const entries = W_ ? [650,950,1250,1440] : [200,350,650,950];
  let best=null, bd=Infinity;
  for(const X of entries){
    const roll = Math.abs(X - rotX());
    if(roll < 130) continue;
    const d = taxiDist(from, 'u'+X+'h');
    if(d < bd){ bd = d; best = X; }
  }
  if(best===null) best = W_ ? 650 : 650;
  a.state = 'TAXIOUT';
  a.speed = a.type.label==='WB' ? SP_TAXI_H : SP_TAXI;
  a.depEntry = best;
  const path = dijkstra(from, 'u'+best+'h');
  a.path = path ? nodePathIdsToPoints(path) : [];
  logMsg(a.callsign+' pushback approved · dep rwy '+runways.dep.name(), 'info');
}

function startTakeoff(a){
  a.state = 'TAKEOFF';
  a.speed = 0;
  a.accel = RWY_ACC;
  a.pos.y = RWY_Y_DEP;
  a.depDir = ops;
  a.heading = rad(a.depDir==='W'? 270 : 90);
  runways.dep.occupant = a;
  logMsg(a.callsign+' cleared for takeoff rwy '+runways.dep.name(), 'warn');
}

// ---------- per-aircraft update ----------
function updateAircraft(a, dt){
  switch(a.state){
    case 'ENROUTE':
      a.alt = Math.max(900, a.alt - dt*40);
      if(moveAlong(a, dt)) tryJoin(a);
      break;
    case 'ORBIT':
      a.alt = Math.max(1400, a.alt + dt*14);
      if(moveAlong(a, dt)) tryJoin(a);
      break;
    case 'FINAL':{
      const dToThresh = Math.abs(a.pos.x - thresholdX());
      if(dToThresh < DECIDE_DIST && !a.cleared){ // go around
        a.state = 'ORBIT';
        a.path = goaroundPath();
        a.alt = 1200;
        stats.goarounds++;
        logMsg(a.callsign+' GO-AROUND — runway occupied', 'bad');
        break;
      }
      if(dToThresh < DECIDE_DIST) a.cleared = arrClear(a);
      a.alt = Math.max(0, a.alt - dt*52);
      const prev = a.pos.x;
      if(moveAlong(a, dt)){
        // reached touchdown point
        a.pos.x = touchX(); a.pos.y = RWY_Y_ARR;
        landAircraft(a);
        break;
      }
      // crossed threshold during move
      const th = thresholdX();
      const crossed = (ops==='W' && prev > th && a.pos.x <= th) || (ops==='E' && prev < th && a.pos.x >= th);
      if(crossed){ a.pos.x = th; a.pos.y = RWY_Y_ARR; landAircraft(a); }
      break;
    }
    case 'ROLLOUT':{
      const dir = a.landDir==='W' ? -1 : 1;
      const sp = Math.max(SP_VACATE, a.speed - RWY_DECEL*dt);
      a.speed = sp;
      a.pos.x += dir * sp * dt;
      const rem = Math.abs(a.pos.x - a.exitX);
      if(rem < 5){
        a.pos.x = a.exitX; a.pos.y = RWY_Y_ARR;
        a.speed = a.type.label==='WB' ? SP_TAXI_H : SP_TAXI;
        a.state = 'TAXI';
        a.path = [];
        runways.arr.occupant = null;
        if(a.gate){
          const path = dijkstra(a.exitNode, a.gate.node);
          a.path = path ? nodePathIdsToPoints(path) : [];
        }
        logMsg(a.callsign+' vacated runway'+(a.gate?', taxiing to gate '+a.gate.id:' — waiting for gate'), 'info');
      }
      break;
    }
    case 'TAXI':
      groundSlow(a, dt);
      a.speed = (a.type.label==='WB'? SP_TAXI_H : SP_TAXI) * a.sizeMul;
      if(a.gate && a.path.length===0){
        const path = dijkstra(a.exitNode, a.gate.node);
        a.path = path ? nodePathIdsToPoints(path) : [];
      }
      if(moveAlong(a, dt)){
        if(a.gate) arriveGate(a);
      }
      break;
    case 'ATGATE':
      a.turn -= dt;
      if(a.turn <= 0) departInit(a);
      break;
    case 'TAXIOUT':
      groundSlow(a, dt);
      a.speed = (a.type.label==='WB'? SP_TAXI_H : SP_TAXI) * a.sizeMul;
      if(moveAlong(a, dt)){ a.state = 'HOLD'; logMsg(a.callsign+' holding short rwy '+runways.dep.name(), 'warn'); }
      break;
    case 'HOLD':
      groundSlow(a, dt);
      if(depClear()){ a.state = 'POSITION'; const p = dijkstra('u'+a.depEntry+'h', 'u'+a.depEntry); a.path = p? nodePathIdsToPoints(p):[]; a.speed = 30; }
      break;
    case 'POSITION':
      if(moveAlong(a, dt)){ startTakeoff(a); }
      break;
    case 'TAKEOFF':{
      a.speed = Math.min(SP_CLIMB, a.speed + a.accel*dt);
      const dir = a.depDir==='W' ? -1 : 1;
      a.pos.x += dir * a.speed * dt;
      const rX = a.depDir==='W' ? 260 : 1340;
      if(a.speed >= ROTATE_SPEED || Math.abs(a.pos.x - rX) < 60){
        a.state = 'CLIMB';
        a.air = true; a.alt = 100;
        a.speed = SP_CLIMB;
        a.heading = rad(a.depDir==='W'? 270 : 90);
        runways.dep.occupant = null;
        lastDepTime = simTime;
        stats.departed++;
        a.path = [{x: a.depDir==='W' ? 40 : 1560, y: RWY_Y_DEP}];
        logMsg(a.callsign+' airborne · en route to '+a.to, 'ok');
      }
      break;
    }
    case 'CLIMB':
      a.alt += dt*110;
      if(moveAlong(a, dt)){
        logMsg(a.callsign+' departed to '+a.to, 'info');
        a.dead = true;
      }
      break;
  }
}

// ---------- simulation step ----------
function stepSim(dt){
  simTime += dt;

  // wind / runway change
  windTimer -= dt;
  if(windTimer <= 0){
    ops = ops==='W' ? 'E' : 'W';
    windSpd = randInt(6, 18);
    windTimer = 140 + Math.random()*160;
    opsGen++;
    redirectAirborne();
    logMsg('WIND SHIFT — runways now '+runways.arr.name()+' arrivals / '+runways.dep.name()+' departures', 'warn');
  }

  // spawn schedule
  const base = density==='low' ? 13 : density==='med' ? 8.5 : 6;
  const cap = density==='low' ? 4 : density==='med' ? 6 : 9;
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    if(countAirborne() < cap && freeGates() + Math.max(0, cap - countAirborne()) > 0){
      spawnArrival(0);
    }
    spawnTimer = base * rand(0.75, 1.35);
  }

  // gates: aircraft waiting at apron gets a gate when free
  for(const g of gates){
    if(g.occupied) continue;
    const waiter = aircraft.find(a=> a.state==='TAXI' && !a.gate);
    if(waiter){
      waiter.gate = g;
      const path = dijkstra(waiter.exitNode, g.node);
      waiter.path = path ? nodePathIdsToPoints(path) : [];
      logMsg(waiter.callsign+' assigned gate '+g.id, 'info');
    }
  }

  for(const a of aircraft) updateAircraft(a, dt);
  aircraft = aircraft.filter(a=> !a.dead);

  // cleanup stalled aircraft safety
  for(const a of aircraft){
    if(!Number.isFinite(a.pos.x) || !Number.isFinite(a.pos.y)) a.dead = true;
  }
  aircraft = aircraft.filter(a=> !a.dead);
}

// ============================================================
const staticCv = document.createElement('canvas');
staticCv.width = W; staticCv.height = H;
const sctx = staticCv.getContext('2d');

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function buildStatic(){
  const c = sctx;
  // grass
  const g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0b2418'); g.addColorStop(1,'#0a1f15');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  // mowing stripes
  c.fillStyle = 'rgba(0,0,0,0.10)';
  for(let x=0;x<W;x+=160){ c.fillRect(x,0,80,H); }
  // faint grid
  c.strokeStyle = 'rgba(255,255,255,0.02)'; c.lineWidth=1;
  for(let x=0;x<W;x+=200){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  for(let y=0;y<H;y+=200){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }

  // apron concrete
  c.fillStyle = '#1c2530';
  rr(c, 1350, 350, 150, 290, 10); c.fill();
  c.strokeStyle = '#2a3544'; c.lineWidth=1; c.stroke();

  // runways pavement
  c.fillStyle = '#242b36';
  rr(c, RWY_X0-26, RWY_Y_ARR-20, RWY_X1-RWY_X0+52, 40, 6); c.fill();
  rr(c, RWY_X0-26, RWY_Y_DEP-20, RWY_X1-RWY_X0+52, 40, 6); c.fill();

  // taxiways pavement
  c.fillStyle = '#1f2732';
  const tw = (cx,cy,wx,wy)=>{ c.beginPath(); c.moveTo(cx-14,cy-14); c.lineTo(wx-14,wy-14); c.lineTo(wx+14,wy+14); c.lineTo(cx+14,cy+14); c.closePath(); c.fill(); };
  tw(200,MAIN_Y, 1440,MAIN_Y);                 // main
  XS.forEach(x=>{ tw(x,MAIN_Y, x,390); tw(x,MAIN_Y, x,585); }); // connectors
  tw(TERM_X,350, TERM_X,620);                  // terminal taxiway
  GATE_YS.forEach(y=> tw(GATE_X,y, TERM_X,y)); // gate aprons
  // gate spot pads
  GATE_YS.forEach(y=>{
    c.fillStyle = '#1a222c'; rr(c, GATE_X-16, y-14, 32, 28, 4); c.fill();
  });
  c.fillStyle = '#1f2732';

  // runway markings
  function runwayMarkings(y, yTop){
    // centerline dashes
    c.strokeStyle = 'rgba(235,240,248,0.85)'; c.lineWidth = 3;
    c.setLineDash([26,16]); c.lineDashOffset = 0;
    c.beginPath(); c.moveTo(RWY_X0+10,y); c.lineTo(RWY_X1-10,y); c.stroke();
    c.setLineDash([]);
    // edge lines
    c.strokeStyle = 'rgba(200,208,222,0.5)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(RWY_X0, y-15); c.lineTo(RWY_X1, y-15); c.stroke();
    c.beginPath(); c.moveTo(RWY_X0, y+15); c.lineTo(RWY_X1, y+15); c.stroke();
    // threshold piano keys
    function keys(x){
      c.fillStyle = 'rgba(235,240,248,0.9)';
      for(let i=-3;i<3;i++){
        c.fillRect(x, y-6-14*3 + (i+3)*14, 10, 8);
      }
    }
    keys(RWY_X0+20); keys(RWY_X1-30);
    // runway numbers
    c.fillStyle = 'rgba(235,240,248,0.9)'; c.font = 'bold 20px Consolas, monospace';
    c.textAlign='center'; c.textBaseline='middle';
    c.save(); c.translate((RWY_X0+RWY_X1)/2 - 260, y); c.rotate(rad(180));
    c.fillText('27', 0, -40); c.restore();
    c.save(); c.translate((RWY_X0+RWY_X1)/2 + 260, y);
    c.fillText('09', 0, -40); c.restore();
    // touchdown zone bars
    c.fillStyle = 'rgba(235,240,248,0.75)';
    for(const tz of [ [RWY_X0+260, 1], [RWY_X0+260, -1], [RWY_X1-330, 1], [RWY_X1-330,-1] ]){
      const [tzx, side] = tz;
      for(let i=0;i<3;i++){
        c.fillRect(tzx + i*40, y - 4 - 12 + side*10, 10, 4);
      }
    }
    // runway edge lights (white/amber), threshold green, end red
    for(let x=RWY_X0; x<=RWY_X1; x+=40){
      const nearEnd = x < RWY_X0+120 || x > RWY_X1-120;
      c.fillStyle = nearEnd ? '#4ade80' : '#e2e8f0';
      for(const sy of [-16, 16]){
        c.beginPath(); c.arc(x, y+sy, 2.2, 0, 7); c.fill();
      }
    }
    c.fillStyle = '#f87171';
    c.beginPath(); c.arc(RWY_X0, y-16, 2.6,0,7); c.arc(RWY_X0, y+16, 2.6,0,7);
    c.arc(RWY_X1, y-16, 2.6,0,7); c.arc(RWY_X1, y+16, 2.6,0,7); c.fill();
  }
  runwayMarkings(RWY_Y_ARR, true);
  runwayMarkings(RWY_Y_DEP, true);

  // taxiway centerline (yellow)
  c.strokeStyle = 'rgba(251,191,36,0.75)'; c.lineWidth = 2;
  c.setLineDash([14,12]);
  c.beginPath(); c.moveTo(200,MAIN_Y); c.lineTo(1440,MAIN_Y); c.stroke();
  XS.forEach(x=>{
    c.beginPath(); c.moveTo(x,MAIN_Y); c.lineTo(x,390); c.stroke();
    c.beginPath(); c.moveTo(x,MAIN_Y); c.lineTo(x,585); c.stroke();
  });
  c.beginPath(); c.moveTo(TERM_X,350); c.lineTo(TERM_X,620); c.stroke();
  GATE_YS.forEach(y=>{ c.beginPath(); c.moveTo(GATE_X,y); c.lineTo(TERM_X,y); c.stroke(); });
  c.setLineDash([]);

  // hold short bars at runway entrances
  XS.forEach(x=>{
    c.strokeStyle = '#fbbf24'; c.lineWidth = 3;
    c.setLineDash([6,6]);
    c.beginPath(); c.moveTo(x-12, 385); c.lineTo(x+12, 385); c.stroke();
    c.beginPath(); c.moveTo(x-12, 580); c.lineTo(x+12, 580); c.stroke();
    c.setLineDash([]);
    // guard lights
    c.fillStyle = '#f59e0b';
    c.beginPath(); c.arc(x-8, 381, 2,0,7); c.arc(x+8, 381, 2,0,7); c.fill();
    c.beginPath(); c.arc(x-8, 584, 2,0,7); c.arc(x+8, 584, 2,0,7); c.fill();
  });

  // taxiway edge blue lights
  c.fillStyle = '#60a5fa';
  for(let x=240;x<=1400;x+=90){
    c.beginPath(); c.arc(x, MAIN_Y-16, 1.6,0,7); c.fill();
    c.beginPath(); c.arc(x, MAIN_Y+16, 1.6,0,7); c.fill();
  }

  // terminal building
  const bg = c.createLinearGradient(0,BLDG_Y0,0,BLDG_Y1);
  bg.addColorStop(0,'#2a3850'); bg.addColorStop(1,'#1c2638');
  c.fillStyle = bg; rr(c, BLDG_X0, BLDG_Y0, BLDG_X1-BLDG_X0, BLDG_Y1-BLDG_Y0, 8); c.fill();
  c.strokeStyle = '#3a4a68'; c.lineWidth=1.5; c.stroke();
  // windows
  c.fillStyle = 'rgba(56,189,248,0.55)';
  for(let y=BLDG_Y0+26; y<BLDG_Y1-20; y+=22){
    for(let x=BLDG_X0+14; x<BLDG_X1-20; x+=20){ c.fillRect(x,y,9,8); }
  }
  // terminal text
  c.fillStyle = 'rgba(180,200,230,0.8)'; c.font = 'bold 15px Consolas, monospace';
  c.textAlign='center';
  c.fillText('AURORA INTERNATIONAL · AUR', (BLDG_X0+BLDG_X1)/2, BLDG_Y0-14);

  // jetbridges
  GATE_YS.forEach(y=>{
    c.fillStyle = '#33415c'; c.strokeStyle = '#45557a'; c.lineWidth=1;
    rr(c, GATE_X+10, y-5, BLDG_X0-GATE_X-10, 10, 2); c.fill(); c.stroke();
  });
  // gate numbers
  c.fillStyle = 'rgba(148,163,184,0.8)'; c.font = '10px Consolas, monospace';
  gates.forEach(g=> c.fillText(g.id, g.x-8, g.y-22));

  // control tower
  c.fillStyle = '#1d2940'; rr(c, TOWER.x-14, TOWER.y-40, 28, 40, 4); c.fill();
  c.strokeStyle = '#3a4a68'; c.stroke();
  c.fillStyle = 'rgba(56,189,248,0.35)';
  for(let y=TOWER.y-32;y<TOWER.y-8;y+=9){ c.fillRect(TOWER.x-9, y, 18, 5); }

  // ILS approach lines (both directions)
  c.strokeStyle = 'rgba(148,163,184,0.16)'; c.lineWidth=1; c.setLineDash([8,10]);
  c.beginPath(); c.moveTo(RWY_X1+40, RWY_Y_ARR); c.lineTo(RWY_X1+380, RWY_Y_ARR); c.stroke();
  c.beginPath(); c.moveTo(RWY_X0-40, RWY_Y_ARR); c.lineTo(RWY_X0-380, RWY_Y_ARR); c.stroke();
  c.setLineDash([]);

  // wind sock base + compass + scale
  c.fillStyle = 'rgba(255,255,255,0.12)'; c.beginPath(); c.arc(120,60,34,0,7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.2)'; c.stroke();
  c.fillStyle = '#eaf3ff'; c.font='11px Consolas,monospace'; c.textAlign='center';
  c.fillText('N', 120, 44);
  c.strokeStyle = 'rgba(255,255,255,0.25)';
  c.beginPath(); c.moveTo(120,60); c.lineTo(120,40); c.stroke();
  // compass ticks
  for(let a=0;a<360;a+=15){
    const r1 = a%90===0 ? 30 : 25;
    const x1 = 120+Math.cos(rad(a))*r1, y1 = 60+Math.sin(rad(a))*r1;
    const x2 = 120+Math.cos(rad(a))*34, y2 = 60+Math.sin(rad(a))*34;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  }
  // scale bar
  c.strokeStyle = 'rgba(255,255,255,0.3)'; c.beginPath();
  c.moveTo(40,H-40); c.lineTo(240,H-40); c.stroke();
  c.beginPath(); c.moveTo(40,H-44); c.lineTo(40,H-36); c.stroke();
  c.beginPath(); c.moveTo(240,H-44); c.lineTo(240,H-36); c.stroke();
  c.fillStyle = 'rgba(220,230,245,0.6)'; c.font='10px Consolas,monospace'; c.textAlign='left';
  c.fillText('500 m', 46, H-26);
}

function drawPlane(a){
  const p = a.pos;
  const sc = a.scale * (a.air ? 1 : 1);
  const L = 22 * sc;

  // shadow
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(p.x+4, p.y+6, L*1.1, L*0.32, a.heading, 0, 7); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(a.heading);
  if(a.air) ctx.scale(1, 1 - a.bank*0.7);

  const col = a.airline.color;

  // fuselage
  ctx.fillStyle = '#dfe8f5';
  ctx.beginPath();
  ctx.ellipse(0, 0, L*0.95, L*0.17, 0, 0, 7);
  ctx.fill();
  // body stripe
  ctx.fillStyle = col;
  ctx.fillRect(-L*0.7, -L*0.05, L*1.5, L*0.1);

  // wings
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-L*0.1, -L*0.02);
  ctx.lineTo(L*0.35, 0);
  ctx.lineTo(-L*0.1, L*0.02);
  ctx.lineTo(-L*0.45, -L*0.9);
  ctx.lineTo(-L*0.75, -L*0.78);
  ctx.lineTo(-L*0.25, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-L*0.1, L*0.02);
  ctx.lineTo(L*0.35, 0);
  ctx.lineTo(-L*0.1, -L*0.02);
  ctx.lineTo(-L*0.45, L*0.9);
  ctx.lineTo(-L*0.75, L*0.78);
  ctx.lineTo(-L*0.25, 0);
  ctx.closePath(); ctx.fill();

  // wing stripe
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillRect(-L*0.45, -L*0.9, L*0.1, L*0.14);
  ctx.fillRect(-L*0.45, L*0.76, L*0.1, L*0.14);

  // tail
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-L*0.85, 0);
  ctx.lineTo(-L*1.0, -L*0.05);
  ctx.lineTo(-L*0.95, -L*0.4);
  ctx.lineTo(-L*0.72, -L*0.3);
  ctx.closePath(); ctx.fill();

  // engines (under wings)
  ctx.fillStyle = '#9fb0c5';
  ctx.beginPath(); ctx.ellipse(L*0.02, -L*0.42, L*0.1, L*0.16, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(L*0.02, L*0.42, L*0.1, L*0.16, 0, 0, 7); ctx.fill();

  // cockpit window
  ctx.fillStyle = '#123a5c';
  ctx.beginPath(); ctx.ellipse(L*0.72, 0, L*0.14, L*0.09, 0, 0, 7); ctx.fill();

  // nav lights
  ctx.fillStyle = '#f87171';
  ctx.beginPath(); ctx.arc(-L*0.74, -L*0.78, 1.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#4ade80';
  ctx.beginPath(); ctx.arc(-L*0.74, L*0.78, 1.6, 0, 7); ctx.fill();

  // beacon (blink)
  const bl = Math.floor(simTime*2)%2===0;
  if(a.air && bl){
    ctx.fillStyle = 'rgba(248,113,113,0.9)';
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, 7); ctx.fill();
  }
  ctx.restore();

  // approach lights: white strobe on final
  if(a.state==='FINAL' && bl){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill();
  }
}

function drawAircraftLabel(a){
  if(!a.air) return;
  const p = a.pos;
  ctx.save();
  ctx.font = '9px Consolas, monospace';
  ctx.textAlign='center';
  const yOff = -26;
  ctx.fillStyle = 'rgba(215,226,240,0.85)';
  ctx.fillText(a.callsign, p.x, p.y + yOff);
  ctx.fillStyle = 'rgba(124,139,165,0.8)';
  ctx.fillText((a.state==='FINAL'?'F':a.state==='ORBIT'?'H':'E')+' · '+(a.air?Math.round(a.alt)+'ft':''), p.x, p.y + yOff + 11);
  ctx.restore();
}

function drawWindSock(){
  const c = ctx;
  const x=120, y=120;
  c.strokeStyle = '#93a5c0'; c.lineWidth=2;
  c.beginPath(); c.moveTo(x,y); c.lineTo(x,y-38); c.stroke();
  // sock angle from wind direction
  const dir = ops==='W' ? rad(270) : rad(90);
  const ang = dir + Math.PI; // sock blows downwind
  c.save(); c.translate(x, y-38); c.rotate(ang);
  c.fillStyle = '#f97316';
  c.beginPath();
  c.moveTo(0,0); c.lineTo(34,-4); c.lineTo(34,4); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.6)';
  c.beginPath(); c.moveTo(10,-2); c.lineTo(20,-3); c.lineTo(20,3); c.lineTo(10,2); c.closePath(); c.fill();
  c.restore();
  c.fillStyle = 'rgba(215,226,240,0.8)'; c.font='10px Consolas,monospace'; c.textAlign='center';
  c.fillText((ops==='W'?'W':'E')+' '+windSpd+'kt', x, y+16);
}

function drawRadar(){
  sweep += 0.02 * speed * (paused?0:1);
  const c = ctx;
  // range rings
  c.strokeStyle = 'rgba(56,189,248,0.10)'; c.lineWidth=1;
  for(const r of [220, 440, 660]){
    c.beginPath(); c.arc(TOWER.x, TOWER.y, r, 0, 7); c.stroke();
  }
  // sweep wedge
  const ang = sweep;
  const len = 700;
  const grad = c.createRadialGradient(TOWER.x,TOWER.y,20,TOWER.x,TOWER.y,len);
  grad.addColorStop(0, 'rgba(56,189,248,0.0)');
  grad.addColorStop(0.85, 'rgba(56,189,248,0.18)');
  grad.addColorStop(1, 'rgba(56,189,248,0.0)');
  c.fillStyle = grad;
  c.beginPath();
  c.moveTo(TOWER.x, TOWER.y);
  c.arc(TOWER.x, TOWER.y, len, ang-0.28, ang+0.06);
  c.closePath(); c.fill();
  // sweep line
  c.strokeStyle = 'rgba(125,211,252,0.8)'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(TOWER.x,TOWER.y);
  c.lineTo(TOWER.x+Math.cos(ang)*len, TOWER.y+Math.sin(ang)*len); c.stroke();
  // tower blips
  for(const a of aircraft){
    const d = dist(a.pos, TOWER);
    if(d < 240){
      const rel = Math.atan2(a.pos.y-TOWER.y, a.pos.x-TOWER.x);
      const dl = Math.abs(((rel - ang + Math.PI*3) % (Math.PI*2)) - Math.PI);
      if(dl < 0.16){
        c.fillStyle = 'rgba(125,211,252,0.9)';
        c.beginPath(); c.arc(a.pos.x, a.pos.y, 2.2, 0, 7); c.fill();
      }
    }
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(staticCv, 0, 0);
  drawRadar();
  drawWindSock();

  // aircraft sorted by y for tidy stacking
  const sorted = [...aircraft].sort((a,b)=> (a.air? -1: 1) || a.pos.y - b.pos.y);
  for(const a of sorted){ if(!a.air) continue; drawPlane(a); }
  for(const a of sorted){ if(a.air) drawAircraftLabel(a); }
  for(const a of sorted){ if(!a.air) drawPlane(a); }

  // gate progress bars
  for(const g of gates){
    if(!g.flight || g.flight.state!=='ATGATE') continue;
    const f = g.flight;
    const pct = clamp(1 - f.turn/f.turnTotal, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(10,16,29,0.8)';
    rr(ctx, g.x-18, g.y-30, 36, 5, 2); ctx.fill();
    ctx.fillStyle = '#34d399';
    rr(ctx, g.x-18, g.y-30, 36*pct, 5, 2); ctx.fill();
    ctx.fillStyle = 'rgba(215,226,240,0.75)';
    ctx.font='8px Consolas,monospace'; ctx.textAlign='center';
    ctx.fillText('boarding '+Math.round(pct*100)+'%', g.x, g.y-36);
    ctx.restore();
  }

  drawBoards();
}

// ============================================================
//  UI: boards, log, header
// ============================================================
const ST_CLS = {
  ENROUTE:'st air', ORBIT:'st air', FINAL:'st app', ROLLOUT:'st land', TAXI:'st tax',
  ATGATE:'st gate', TAXIOUT:'st dep', HOLD:'st hold', POSITION:'st dep', TAKEOFF:'st airborne', CLIMB:'st airborne'
};
const ST_TXT = {
  ENROUTE:'INBOUND', ORBIT:'HOLDING', FINAL:'FINAL APP', ROLLOUT:'LANDING ROLL',
  TAXI:'TAXI TO GATE', ATGATE:'AT GATE', TAXIOUT:'TAXI TO RWY', HOLD:'HOLD SHORT',
  POSITION:'POSITION', TAKEOFF:'TAKEOFF', CLIMB:'DEPARTED'
};

function drawBoards(){
  const arrivals = aircraft.filter(a=> ['ENROUTE','ORBIT','FINAL','ROLLOUT','TAXI','ATGATE'].includes(a.state));
  const departures = aircraft.filter(a=> ['ATGATE','TAXIOUT','HOLD','POSITION','TAKEOFF','CLIMB'].includes(a.state));
  document.getElementById('arrCount').textContent = arrivals.length;
  document.getElementById('depCount').textContent = departures.length;

  const ab = document.querySelector('#arrivalsBoard tbody');
  let ah = '';
  for(const a of arrivals.sort((x,y)=> Math.abs(x.pos.x-thresholdX())-Math.abs(y.pos.x-thresholdX()))){
    let eta;
    if(a.state==='ENROUTE') eta = Math.ceil(Math.abs(a.pos.x-thresholdX())/SP_FINAL)+'s';
    else if(a.state==='FINAL') eta = Math.ceil(Math.abs(a.pos.x-thresholdX())/SP_FINAL)+'s';
    else if(a.state==='ORBIT') eta = '~';
    else if(a.state==='ROLLOUT') eta = '~' + Math.ceil(Math.abs(a.pos.x-a.exitX)/SP_VACATE)+'s';
    else if(a.state==='TAXI') eta = Math.ceil(a.path.length*34/SP_TAXI)+'s';
    else eta = '—';
    ah += `<tr><td style="color:${a.airline.color}">${a.callsign}</td><td>${a.from}</td><td>${a.type.label}</td><td>${eta}</td><td><span class="${ST_CLS[a.state]}">${ST_TXT[a.state]}</span></td></tr>`;
  }
  ab.innerHTML = ah || '<tr class="dim"><td colspan="5">No inbound traffic</td></tr>';

  const db = document.querySelector('#departuresBoard tbody');
  let dh = '';
  for(const a of departures){
    let st = ST_TXT[a.state];
    if(a.state==='ATGATE') st = 'BOARDING '+Math.round(clamp(1-a.turn/a.turnTotal,0,1)*100)+'%';
    dh += `<tr><td style="color:${a.airline.color}">${a.callsign}</td><td>${a.to}</td><td>${a.type.label}</td><td><span class="${ST_CLS[a.state]}">${st}</span></td></tr>`;
  }
  db.innerHTML = dh || '<tr class="dim"><td colspan="4">No outbound traffic</td></tr>';

  // log
  const lb = document.getElementById('logBoard');
  let lh = '';
  for(const e of log.slice(-60)){
    lh += `<div class="logline"><span class="tm">${e.t}</span><span class="${e.cls}">${e.msg}</span></div>`;
  }
  lb.innerHTML = lh;
  lb.scrollTop = lb.scrollHeight;

  // header
  document.getElementById('clock').textContent = fmtTime(simTime);
  document.getElementById('wind').textContent = (ops==='W'?'270° W ':'090° E ') + windSpd + ' kt';
  document.getElementById('arrRwy').textContent = runways.arr.name();
  document.getElementById('depRwy').textContent = runways.dep.name();
  document.getElementById('stLanded').textContent = stats.landed;
  document.getElementById('stDep').textContent = stats.departed;
  document.getElementById('stGA').textContent = stats.goarounds;
  document.getElementById('stLive').textContent = countAirborne();
  document.getElementById('stGates').textContent = gates.filter(g=>g.occupied).length + '/8';
  document.getElementById('opsbadge').textContent = 'rate ' + Math.round(stats.landed/Math.max(1,(simTime-6*3600)/60)) + '/min';
}

// ============================================================
//  INPUT / CONTROLS
// ============================================================
const btnPause = document.getElementById('btnPause');
const pausedEl = document.getElementById('paused');
function togglePause(){
  paused = !paused;
  btnPause.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
  btnPause.style.borderColor = paused ? 'var(--amber)' : '';
  pausedEl.classList.toggle('hidden', !paused);
}
btnPause.addEventListener('click', togglePause);

document.querySelectorAll('.speed').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.speed').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    speed = +b.dataset.sp;
  });
});

document.getElementById('density').addEventListener('change', e=> density = e.target.value);
document.getElementById('btnWind').addEventListener('click', ()=>{
  ops = ops==='W' ? 'E' : 'W';
  windSpd = randInt(6,18);
  windTimer = 140 + Math.random()*160;
  opsGen++;
  redirectAirborne();
  logMsg('WIND SHIFT (manual) — '+runways.arr.name()+' arrivals / '+runways.dep.name()+' departures', 'warn');
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  aircraft = []; gates.forEach(g=>{g.occupied=false; g.flight=null;});
  runways.arr.occupant=null; runways.dep.occupant=null;
  stats.landed=0; stats.departed=0; stats.goarounds=0;
  log.length=0; simTime=6*3600; lastDepTime=-99;
  logMsg('RESET — AURORA INTERNATIONAL ONLINE', 'ok');
  seedWorld();
});

window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); togglePause(); }
  else if(e.code==='KeyW') document.getElementById('btnWind').click();
  else if(['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)){
    const sp = +e.code.slice(5);
    const b = document.querySelector(`.speed[data-sp="${sp}"]`);
    if(b) b.click();
  }
});

// aircraft info popup
const infoEl = document.getElementById('info');
const stageEl = document.getElementById('stage');
cv.addEventListener('click', e=>{
  const rect = cv.getBoundingClientRect();
  const scale = Math.min(rect.width/W, rect.height/H);
  const ox = (rect.width - W*scale)/2, oy = (rect.height - H*scale)/2;
  const wx = (e.clientX - rect.left - ox)/scale;
  const wy = (e.clientY - rect.top - oy)/scale;
  let best=null, bd=60;
  for(const a of aircraft){
    const d = Math.hypot(a.pos.x-wx, a.pos.y-wy);
    if(d<bd){ bd=d; best=a; }
  }
  if(best){
    const a = best;
    infoEl.innerHTML = `
      <div class="h"><span style="color:${a.airline.color}">${a.callsign}</span> <span class="al">· ${a.airline.name}</span></div>
      <table>
        <tr><td>Route</td><td>${a.from} → ${a.to}</td></tr>
        <tr><td>Aircraft</td><td>${a.type.label} · ${a.type.pax} pax</td></tr>
        <tr><td>Status</td><td>${ST_TXT[a.state]}</td></tr>
        <tr><td>Speed</td><td>${Math.round(a.speed*3.6)} km/h</td></tr>
        <tr><td>Heading</td><td>${String(Math.round(rad2deg(a.heading))%360).padStart(3,'0')}°</td></tr>
        ${a.air ? `<tr><td>Altitude</td><td>${Math.round(a.alt)} ft</td></tr>` : ''}
        ${a.gate ? `<tr><td>Gate</td><td>${a.gate.id}</td></tr>` : ''}
        ${a.exitX!==null ? `<tr><td>Exit rwy</td><td>${a.exitX} m</td></tr>` : ''}
        ${a.state==='ATGATE' ? `<tr><td>Turnaround</td><td>${Math.round(a.turn)}s left</td></tr>` : ''}
      </table>`;
    const px = Math.min(e.clientX - stageEl.getBoundingClientRect().left + 14, stageEl.clientWidth - 320);
    const py = e.clientY - stageEl.getBoundingClientRect().top + 14;
    infoEl.style.left = px+'px'; infoEl.style.top = py+'px';
    infoEl.classList.remove('hidden');
  } else {
    infoEl.classList.add('hidden');
  }
});
function rad2deg(r){ return r*180/Math.PI; }

// ============================================================
//  SEED + MAIN LOOP
// ============================================================
function seedWorld(){
  // gates
  seedGateAircraft(gates[0], 0.8);
  seedGateAircraft(gates[3], 0.5);
  seedGateAircraft(gates[6], 0.2);
  // inbound
  spawnArrival(0.05);
  spawnArrival(0.35);
  spawnArrival(0.6);
  // one in orbit
  const orb = newAircraft(false);
  orb.state='ORBIT'; orb.air=true; orb.alt=1800; orb.speed=SP_ORBIT;
  orb.pos = {x: 1560, y: 560}; orb.heading = rad(300);
  orb.path = orbitPath();
  aircraft.push(orb);
  logMsg('AURORA INTERNATIONAL ONLINE — ops '+runways.arr.name()+' arrivals / '+runways.dep.name()+' departures', 'ok');
}

seedWorld();

// main loop
let last = performance.now();
function frame(now){
  const dtReal = Math.min((now-last)/1000, 0.05);
  last = now;
  if(!paused){
    let rem = dtReal * speed;
    while(rem > 0){
      const step = Math.min(rem, 0.5);
      stepSim(step);
      rem -= step;
    }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
