<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chroma Flow — Colorful Fluid Simulation</title>
<style>
  :root {
    --glass: rgba(8, 12, 26, 0.52);
    --stroke: rgba(255, 255, 255, 0.12);
    --accent: #7ce8ff;
    --text: #eef3ff;
    --muted: rgba(238, 243, 255, 0.58);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
  }
  #screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  /* ---------- overlay chrome ---------- */
  .chip {
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 999px;
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    user-select: none;
  }

  #titlebar {
    position: fixed;
    top: 18px;
    left: 22px;
    pointer-events: none;
    user-select: none;
  }
  #titlebar h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 7px;
    background: linear-gradient(90deg, #ff9ae8, #7ce8ff, #ffe27a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #titlebar p {
    margin: 5px 0 0;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  #fps {
    position: fixed;
    top: 20px;
    right: 22px;
    font-variant-numeric: tabular-nums;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    animation: hintFade 1s ease 10s forwards;
  }
  @keyframes hintFade { to { opacity: 0; } }

  #paused-badge {
    position: fixed;
    top: 56px;
    right: 22px;
    border-color: rgba(124, 232, 255, 0.5);
    color: var(--accent);
  }

  /* ---------- control panel ---------- */
  #panel {
    position: fixed;
    left: 22px;
    bottom: 22px;
    width: 252px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.35);
    overflow: hidden;
    transition: opacity .2s ease, transform .2s ease;
  }
  #panel.collapsed { opacity: 0.55; }
  #panel.collapsed #panel-body { display: none; }
  #panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    cursor: pointer;
  }
  #panel-head .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
  }
  #panel-head .toggle {
    font-size: 12px;
    color: var(--muted);
    transition: transform .2s ease;
  }
  #panel.collapsed #panel-head .toggle { transform: rotate(-90deg); }
  #panel-body { padding: 0 14px 12px; }

  .ctl { display: flex; align-items: center; gap: 10px; margin: 11px 0; }
  .ctl span {
    flex: 0 0 66px;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ctl input[type="range"] {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .ctl output {
    flex: 0 0 34px;
    text-align: right;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .pals {
    display: flex;
    gap: 9px;
    margin: 14px 0 4px;
    align-items: center;
  }
  .pals .cap {
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    flex: 1;
  }
  .pal {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.28);
    cursor: pointer;
    padding: 0;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .pal:hover { transform: scale(1.14); }
  .pal.active {
    box-shadow: 0 0 0 2px #0a0c1a, 0 0 0 4px var(--accent);
  }

  .actions { display: flex; gap: 8px; margin: 12px 0 2px; }
  .btn {
    flex: 1;
    padding: 7px 0;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.15); }

  #fatal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05060f;
    z-index: 50;
    text-align: center;
    padding: 24px;
  }
  #fatal.hidden { display: none; }
  #fatal div { max-width: 420px; }
  #fatal h2 { letter-spacing: 4px; margin: 0 0 12px; font-size: 18px; }
  #fatal p { color: var(--muted); font-size: 14px; line-height: 1.6; }

  .hidden { display: none !important; }

  @media (max-width: 560px) {
    #panel { left: 12px; bottom: 12px; width: 220px; }
    #titlebar { top: 14px; left: 16px; }
    #fps { top: 16px; right: 16px; }
  }
</style>
</head>
<body>
<canvas id="screen" aria-label="Interactive colorful fluid simulation. Drag to stir the fluid."></canvas>

<div id="fatal" class="hidden">
  <div>
    <h2>WEBGL NOT AVAILABLE</h2>
    <p id="fatal-msg">This experience needs WebGL2 with floating-point render targets. Please try a recent version of Chrome, Edge, Firefox, or Safari.</p>
  </div>
</div>

<header id="titlebar">
  <h1>CHROMA FLOW</h1>
  <p>a colorful fluid simulation</p>
</header>

<div id="fps" class="chip">-- fps</div>
<div id="hint" class="chip">drag to stir &nbsp;·&nbsp; space to pause</div>
<div id="paused-badge" class="chip hidden">paused</div>

<aside id="panel" aria-label="Simulation controls">
  <div id="panel-head">
    <span class="label">Controls</span>
    <span class="toggle">&#9662;</span>
  </div>
  <div id="panel-body">
    <label class="ctl">
      <span>Speed</span>
      <input type="range" id="ctl-speed" min="0.2" max="2.5" step="0.05" value="1">
      <output id="val-speed">1.0</output>
    </label>
    <label class="ctl">
      <span>Force</span>
      <input type="range" id="ctl-force" min="0" max="2" step="0.05" value="1">
      <output id="val-force">1.0</output>
    </label>
    <label class="ctl">
      <span>Ink</span>
      <input type="range" id="ctl-dye" min="0" max="2" step="0.05" value="1">
      <output id="val-dye">1.0</output>
    </label>
    <label class="ctl">
      <span>Flow</span>
      <input type="range" id="ctl-turb" min="0" max="1.2" step="0.05" value="0.5">
      <output id="val-turbulence">0.5</output>
    </label>
    <label class="ctl">
      <span>Glow</span>
      <input type="range" id="ctl-bloom" min="0" max="2.5" step="0.05" value="1.15">
      <output id="val-bloom">1.2</output>
    </label>
    <label class="ctl">
      <span>Iridesce</span>
      <input type="range" id="ctl-irid" min="0" max="0.3" step="0.005" value="0.14">
      <output id="val-hueFactor">0.14</output>
    </label>

    <div class="pals">
      <span class="cap">Palette</span>
      <div id="palettes"></div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-pause" title="Pause / resume (space)">Pause</button>
      <button class="btn" id="btn-reset" title="Reset the simulation (R)">Reset</button>
    </div>
  </div>
</aside>

<script>
'use strict';

/* =========================================================
   CHROMA FLOW — a GPU fluid simulation in one HTML file.
   Stable-fluids Navier–Stokes solver on WebGL2 float textures:
   splats -> turbulence (curl noise) -> advection -> projection
   -> curl -> color render -> bloom -> composite.
   ========================================================= */

/* ---------------- DOM / context ---------------- */
const canvas = document.getElementById('screen');
const fatalEl = document.getElementById('fatal');
const fatalMsg = document.getElementById('fatal-msg');
const fpsEl = document.getElementById('fps');
const pausedBadge = document.getElementById('paused-badge');
const hintEl = document.getElementById('hint');

function fatal(msg) {
  fatalMsg.textContent = msg;
  fatalEl.classList.remove('hidden');
  throw new Error(msg);
}

const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  preserveDrawingBuffer: false
});
if (!gl) fatal('WebGL2 is not supported by this browser.');
if (!gl.getExtension('EXT_color_buffer_float'))
  fatal('Floating-point render targets are not supported by this browser.');

canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); fatal('The graphics context was lost. Please reload the page.'); });
canvas.addEventListener('webglcontextrestored', () => { window.location.reload(); });

/* ---------------- tiny GL helpers ---------------- */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error('Shader compile error:\n' + log);
  }
  return s;
}

const VS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

function createProgram(fragSrc) {
  const v = compile(gl.VERTEX_SHADER, VS);
  const f = compile(gl.FRAGMENT_SHADER, fragSrc);
  const p = gl.createProgram();
  gl.attachShader(p, v);
  gl.attachShader(p, f);
  gl.linkProgram(p);
  gl.deleteShader(v);
  gl.deleteShader(f);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('Program link error:\n' + gl.getProgramInfoLog(p));
  return p;
}

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

function makePass(fragSrc) {
  const program = createProgram(fragSrc);
  const loc = {};
  return {
    u(name) {
      if (!(name in loc)) loc[name] = gl.getUniformLocation(program, name);
      return loc[name];
    },
    run(fbo, settings) {
      settings = settings || {};
      gl.useProgram(program);
      gl.bindVertexArray(quadVAO);
      const textures = settings.textures || [];
      for (let i = 0; i < textures.length; i++) {
        gl.activeTexture(gl.TEXTURE0 + i);
        gl.bindTexture(gl.TEXTURE_2D, textures[i][1]);
        gl.uniform1i(this.u(textures[i][0]), i);
      }
      const uniforms = settings.uniforms || [];
      for (let i = 0; i < uniforms.length; i++) {
        const name = uniforms[i][0];
        const value = uniforms[i][1];
        const l = this.u(name);
        if (l === null || l === undefined) continue;
        if (typeof value === 'number') gl.uniform1f(l, value);
        else if (Array.isArray(value)) {
          if (value.length === 2) gl.uniform2f(l, value[0], value[1]);
          else if (value.length === 3) gl.uniform3f(l, value[0], value[1], value[2]);
          else if (value.length === 4) gl.uniform4f(l, value[0], value[1], value[2], value[3]);
        }
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo ? fbo.fbo : null);
      gl.viewport(0, 0, fbo ? fbo.width : canvas.width, fbo ? fbo.height : canvas.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindVertexArray(null);
    }
  };
}

function makeFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    throw new Error('Framebuffer incomplete (RGBA16F render target failed).');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, width: w, height: h };
}

function clearFBO(fbo, r, g, b, a) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fbo);
  gl.viewport(0, 0, fbo.width, fbo.height);
  gl.clearColor(r, g, b, a);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

gl.disable(gl.BLEND);
gl.clearColor(0, 0, 0, 1);

/* ---------------- shaders ---------------- */

const BILERP = `
vec4 bilerp(sampler2D sam, vec2 uv, vec2 texel) {
  vec2 p = uv / texel - 0.5;
  vec2 f = fract(p);
  vec2 c = (p - f) * texel + 0.5 * texel;
  vec4 a = texture(sam, c);
  vec4 b = texture(sam, c + vec2(texel.x, 0.0));
  vec4 d = texture(sam, c + vec2(0.0, texel.y));
  vec4 e = texture(sam, c + texel);
  return mix(mix(a, b, f.x), mix(d, e, f.x), f.y);
}`;

const ADVECT_FS = `#version 300 es
precision highp float;
uniform sampler2D uSource;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
uniform float uDt;
uniform float uDissipation;
in vec2 vUv;
out vec4 outColor;
${BILERP}
void main() {
  vec2 vel = bilerp(uVelocity, vUv, uTexelSize).xy;
  vec2 coord = clamp(vUv - uDt * vel, 0.001, 0.999);
  vec4 val = bilerp(uSource, coord, uTexelSize);
  outColor = vec4(val.rgb * uDissipation, val.a * uDissipation);
}`;

const FORCE_FS = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform float uTime;
uniform float uStrength;
uniform float uScale;
uniform float uDt;
in vec2 vUv;
out vec4 outColor;

vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x){ return mod289(((x * 34.0) + 1.0) * x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float fbm(vec2 p) {
  float s = snoise(p) * 0.50;
  s += snoise(p * 2.3 + 1.7) * 0.25;
  s += snoise(p * 5.1 + 4.3) * 0.125;
  return s;
}

vec2 curl(vec2 p) {
  float e = 0.08;
  float n1 = fbm(p + vec2(0.0, e));
  float n2 = fbm(p - vec2(0.0, e));
  float n3 = fbm(p + vec2(e, 0.0));
  float n4 = fbm(p - vec2(e, 0.0));
  return vec2((n1 - n2) / (2.0 * e), -(n3 - n4) / (2.0 * e));
}

void main() {
  vec2 vel = texture(uVelocity, vUv).xy;
  vec2 p = vUv * uScale;
  p += vel * 0.35;
  p += vec2(uTime * 0.06, uTime * 0.041);
  vec2 f = curl(p);
  vel += f * uStrength * uDt;
  float m = length(vel);
  if (m > 3.0) vel *= 3.0 / m;
  outColor = vec4(vel, 0.0, 0.0);
}`;

const DIVERGENCE_FS = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
uniform vec2 uGridSize;
in vec2 vUv;
out vec4 outColor;
void main() {
  vec2 l = texture(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).xy;
  vec2 r = texture(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).xy;
  vec2 t = texture(uVelocity, vUv + vec2(0.0, uTexelSize.y)).xy;
  vec2 b = texture(uVelocity, vUv - vec2(0.0, uTexelSize.y)).xy;
  float div = 0.5 * ((r.x - l.x) * uGridSize.x + (t.y - b.y) * uGridSize.y);
  outColor = vec4(div, 0.0, 0.0, 0.0);
}`;

const PRESSURE_FS = `#version 300 es
precision highp float;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uTexelSize;
in vec2 vUv;
out vec4 outColor;
void main() {
  float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
  float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x;
  float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
  float div = texture(uDivergence, vUv).x;
  outColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 0.0);
}`;

const SUBTRACT_FS = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform sampler2D uPressure;
uniform vec2 uTexelSize;
uniform vec2 uGridSize;
in vec2 vUv;
out vec4 outColor;
void main() {
  float pl = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x;
  float pr = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
  float pb = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
  float pt = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x;
  vec2 v = texture(uVelocity, vUv).xy;
  vec2 grad = 0.5 * vec2((pr - pl) * uGridSize.x, (pt - pb) * uGridSize.y);
  outColor = vec4(v - grad, 0.0, 0.0);
}`;

const CURL_FS = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
uniform vec2 uGridSize;
in vec2 vUv;
out vec4 outColor;
void main() {
  vec2 l = texture(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).xy;
  vec2 r = texture(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).xy;
  vec2 t = texture(uVelocity, vUv + vec2(0.0, uTexelSize.y)).xy;
  vec2 b = texture(uVelocity, vUv - vec2(0.0, uTexelSize.y)).xy;
  float c = 0.5 * ((r.y - l.y) * uGridSize.x - (t.x - b.x) * uGridSize.y);
  outColor = vec4(c, 0.0, 0.0, 0.0);
}`;

const SPLAT_VEL_FS = `#version 300 es
precision highp float;
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform float uRadius;
uniform vec2 uForce;
uniform float uAspect;
in vec2 vUv;
out vec4 outColor;
void main() {
  vec2 d = vUv - uPoint;
  d.x *= uAspect;
  float w = exp(-dot(d, d) / (uRadius * uRadius));
  vec4 prev = texture(uTarget, vUv);
  outColor = vec4(prev.xy + uForce * w, prev.zw);
}`;

const SPLAT_DYE_FS = `#version 300 es
precision highp float;
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform float uRadius;
uniform vec4 uColor;
uniform float uAspect;
in vec2 vUv;
out vec4 outColor;
void main() {
  vec2 d = vUv - uPoint;
  d.x *= uAspect;
  float w = exp(-dot(d, d) / (uRadius * uRadius));
  vec4 prev = texture(uTarget, vUv);
  outColor = vec4(prev.rgb + uColor.rgb * (uColor.a * w), prev.a + uColor.a * w);
}`;

const RENDER_FS = `#version 300 es
precision highp float;
uniform sampler2D uDye;
uniform sampler2D uCurl;
uniform vec2 uTexelSize;
uniform float uTime;
uniform float uHueFactor;
uniform float uHueDrift;
in vec2 vUv;
out vec4 outColor;
${BILERP}
vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}
vec3 rgb2hsv(vec3 c) {
  vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  float e = 1.0e-10;
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
}
void main() {
  vec4 dye = bilerp(uDye, vUv, uTexelSize);
  float curl = bilerp(uCurl, vUv, uTexelSize).x;
  vec3 hsv = rgb2hsv(dye.rgb);
  hsv.x = fract(hsv.x + curl * uHueFactor + uTime * uHueDrift);
  hsv.y = clamp(hsv.y, 0.55, 1.0);
  hsv.z = clamp(hsv.z, 0.0, 1.0);
  vec3 col = hsv2rgb(hsv);
  float a = clamp(dye.a, 0.0, 1.0);
  float glow = smoothstep(0.0, 0.1, a);
  col *= (0.28 + 1.55 * a) * glow;
  col += hsv2rgb(vec3(fract(0.62 + curl * 0.05 + uTime * 0.006), 0.5, 0.2 * a)) * glow;
  outColor = vec4(col, 1.0);
}`;

const COPY_FS = `#version 300 es
precision highp float;
uniform sampler2D uSource;
uniform vec2 uTexelSize;
in vec2 vUv;
out vec4 outColor;
${BILERP}
void main() {
  outColor = bilerp(uSource, vUv, uTexelSize);
}`;

const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSource;
uniform vec2 uTexelSize;
uniform vec2 uDirection;
in vec2 vUv;
out vec4 outColor;
${BILERP}
void main() {
  vec4 sum = bilerp(uSource, vUv, uTexelSize) * 0.227027;
  vec2 off = uDirection * uTexelSize;
  sum += bilerp(uSource, vUv + off, uTexelSize) * 0.1945946;
  sum += bilerp(uSource, vUv - off, uTexelSize) * 0.1945946;
  sum += bilerp(uSource, vUv + 2.0 * off, uTexelSize) * 0.1216216;
  sum += bilerp(uSource, vUv - 2.0 * off, uTexelSize) * 0.1216216;
  sum += bilerp(uSource, vUv + 3.0 * off, uTexelSize) * 0.054054;
  sum += bilerp(uSource, vUv - 3.0 * off, uTexelSize) * 0.054054;
  sum += bilerp(uSource, vUv + 4.0 * off, uTexelSize) * 0.016216;
  sum += bilerp(uSource, vUv - 4.0 * off, uTexelSize) * 0.016216;
  outColor = sum;
}`;

const COMPOSITE_FS = `#version 300 es
precision highp float;
uniform sampler2D uBase;
uniform sampler2D uBloom;
uniform vec2 uBaseTexel;
uniform vec2 uBloomTexel;
uniform float uBloomIntensity;
uniform float uVignette;
in vec2 vUv;
out vec4 outColor;
${BILERP}
void main() {
  vec3 base = bilerp(uBase, vUv, uBaseTexel).rgb;
  vec3 bloom = bilerp(uBloom, vUv, uBloomTexel).rgb;
  vec3 col = base + bloom * uBloomIntensity;
  float d = distance(vUv, vec2(0.5));
  col *= 1.0 - smoothstep(0.42, 0.98, d) * uVignette;
  col = col / (1.0 + col * 0.55);
  col = pow(col, vec3(0.93));
  outColor = vec4(col, 1.0);
}`;

function makeNamedPass(name, src) {
  try {
    return makePass(src);
  } catch (err) {
    console.error('PASS FAIL (' + name + '):\n' + err.message);
    throw err;
  }
}
const passes = {
  advect: makeNamedPass('advect', ADVECT_FS),
  force: makeNamedPass('force', FORCE_FS),
  divergence: makeNamedPass('divergence', DIVERGENCE_FS),
  pressure: makeNamedPass('pressure', PRESSURE_FS),
  subtract: makeNamedPass('subtract', SUBTRACT_FS),
  curl: makeNamedPass('curl', CURL_FS),
  splatVel: makeNamedPass('splatVel', SPLAT_VEL_FS),
  splatDye: makeNamedPass('splatDye', SPLAT_DYE_FS),
  render: makeNamedPass('render', RENDER_FS),
  copy: makeNamedPass('copy', COPY_FS),
  blur: makeNamedPass('blur', BLUR_FS),
  composite: makeNamedPass('composite', COMPOSITE_FS)
};

/* ---------------- state ---------------- */

const pressureIterations = 20;

let vel = [null, null], velRead = 0;
let dye = [null, null], dyeRead = 0;
let pres = [null, null], presRead = 0;
let div = null, curl = null, base = null;
let bloomA = null, bloomB = null;

let internal = null;
let texel = [1, 1], grid = [1, 1], aspect = 1, bloomTexel = [1, 1];

const settings = {
  speed: 1.0,
  force: 1.0,
  dye: 1.0,
  turbulence: 0.5,
  bloom: 1.15,
  hueFactor: 0.14,
  hueDrift: 0.012,
  paused: false
};

const palettes = {
  iridescent: { label: 'Iridescent', hues: [0.00, 0.12, 0.22, 0.35, 0.50, 0.65, 0.78, 0.90], hueFactor: 0.14, hueDrift: 0.012, sat: 0.80 },
  aurora:     { label: 'Aurora',     hues: [0.30, 0.36, 0.42, 0.50, 0.58, 0.66],        hueFactor: 0.05, hueDrift: 0.004, sat: 0.85 },
  sunset:     { label: 'Sunset',     hues: [0.96, 0.03, 0.06, 0.09, 0.00],             hueFactor: 0.05, hueDrift: 0.006, sat: 0.90 },
  neon:       { label: 'Neon',       hues: [0.78, 0.83, 0.87, 0.92, 0.97, 0.04],       hueFactor: 0.08, hueDrift: 0.010, sat: 0.90 }
};
let currentPalette = palettes.iridescent;

let emitters = [];

function initEmitters() {
  emitters.length = 0;
  const hues = currentPalette.hues;
  const n = 4;
  for (let i = 0; i < n; i++) {
    emitters.push({
      angle: (i / n) * Math.PI * 2 + Math.random() * 0.6,
      radius: 0.16 + Math.random() * 0.15,
      spin: (Math.random() < 0.5 ? -1 : 1) * (0.09 + Math.random() * 0.14),
      hue: hues[i % hues.length] + (Math.random() * 0.05 - 0.025),
      hueSpeed: (Math.random() * 0.007 - 0.0035),
      size: 0.028 + Math.random() * 0.02,
      amount: 0.005 + Math.random() * 0.004
    });
  }
}

/* ---------------- resizing / FBO allocation ---------------- */

function resizeInternal(iw, ih) {
  if (internal && internal.w === iw && internal.h === ih) return;
  const old = internal;
  const oldDye = dye, oldVel = vel;
  const oldDyeRead = dyeRead, oldVelRead = velRead;
  const oldTexel = old ? [1 / old.w, 1 / old.h] : null;

  internal = { w: iw, h: ih };
  texel = [1 / iw, 1 / ih];
  grid = [iw, ih];
  aspect = iw / ih;

  vel = [makeFBO(iw, ih), makeFBO(iw, ih)];
  dye = [makeFBO(iw, ih), makeFBO(iw, ih)];
  pres = [makeFBO(iw, ih), makeFBO(iw, ih)];
  div = makeFBO(iw, ih);
  curl = makeFBO(iw, ih);
  base = makeFBO(iw, ih);
  const bw = Math.max(2, iw >> 1);
  const bh = Math.max(2, ih >> 1);
  bloomA = makeFBO(bw, bh);
  bloomB = makeFBO(bw, bh);
  bloomTexel = [1 / bw, 1 / bh];
  velRead = 0; dyeRead = 0; presRead = 0;

  for (const f of vel.concat(dye, pres, [div, curl, base, bloomA, bloomB]))
    clearFBO(f, 0, 0, 0, 0);

  // Carry the current artwork across a resize instead of wiping it.
  if (old && oldTexel) {
    passes.copy.run(dye[0], {
      textures: [['uSource', oldDye[oldDyeRead].tex]],
      uniforms: [['uTexelSize', oldTexel]]
    });
    passes.copy.run(vel[0], {
      textures: [['uSource', oldVel[oldVelRead].tex]],
      uniforms: [['uTexelSize', oldTexel]]
    });
  }
}

function onResize() {
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(cssW * dpr));
  const h = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const scale = Math.min(1, 960 / Math.max(w, h));
  const iw = Math.max(320, Math.round(w * scale));
  const ih = Math.max(180, Math.round(h * scale));
  resizeInternal(iw, ih);
}

/* ---------------- JS color helper ---------------- */

function hsv2rgb(h, s, v) {
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    default: r = v; g = p; b = q; break;
  }
  return [r, g, b];
}

/* ---------------- splatting ---------------- */

function splatVel(x, y, radius, vx, vy) {
  const src = vel[velRead], dst = vel[velRead ^ 1];
  passes.splatVel.run(dst, {
    textures: [['uTarget', src.tex]],
    uniforms: [['uPoint', [x, y]], ['uRadius', radius], ['uForce', [vx, vy]], ['uAspect', aspect]]
  });
  velRead ^= 1;
}

function splatDye(x, y, radius, rgb, amount) {
  const src = dye[dyeRead], dst = dye[dyeRead ^ 1];
  passes.splatDye.run(dst, {
    textures: [['uTarget', src.tex]],
    uniforms: [['uPoint', [x, y]], ['uRadius', radius], ['uColor', [rgb[0], rgb[1], rgb[2], amount]], ['uAspect', aspect]]
  });
  dyeRead ^= 1;
}

const splatQueue = [];

function pushSplat(s) {
  if (splatQueue.length < 90) splatQueue.push(s);
}

function queueAutoSplat() {
  const x = 0.15 + Math.random() * 0.7;
  const y = 0.15 + Math.random() * 0.7;
  const hues = currentPalette.hues;
  let hue = hues[(Math.random() * hues.length) | 0] + (Math.random() * 0.06 - 0.03);
  hue = ((hue % 1) + 1) % 1;
  const r = 0.018 + Math.random() * 0.022;
  pushSplat({ type: 'dye', x, y, radius: r, color: hsv2rgb(hue, currentPalette.sat, 0.95), amount: 0.30 });
  const a = Math.random() * Math.PI * 2;
  pushSplat({ type: 'vel', x, y, radius: r * 1.8, vx: Math.cos(a) * 0.5, vy: Math.sin(a) * 0.5 });
}

function drainSplatQueue(energy) {
  while (splatQueue.length) {
    const s = splatQueue.shift();
    if (s.type === 'dye') {
      splatDye(s.x, s.y, s.radius, s.color, s.amount * settings.dye * energy);
    } else {
      splatVel(s.x, s.y, s.radius, s.vx * energy * settings.force, s.vy * energy * settings.force);
    }
  }
}

function updateEmitters(dt, energy) {
  for (const e of emitters) {
    e.angle += e.spin * dt;
    e.hue = (e.hue + e.hueSpeed * dt + 1) % 1;
    const x = 0.5 + Math.cos(e.angle) * e.radius;
    const y = 0.5 + Math.sin(e.angle) * e.radius * 0.88;
    const rgb = hsv2rgb(e.hue, currentPalette.sat, 0.9);
    splatDye(x, y, e.size, rgb, e.amount * settings.dye * energy);
    const tx = -Math.sin(e.angle), ty = Math.cos(e.angle);
    splatVel(x, y, e.size * 1.5, tx * 0.05 * energy * settings.force, ty * 0.05 * energy * settings.force);
  }
}

let autoTimer = 0;

function initialBurst() {
  for (let i = 0; i < 7; i++) {
    const x = 0.5 + (Math.random() - 0.5) * 0.32;
    const y = 0.5 + (Math.random() - 0.5) * 0.32;
    const hue = (i / 7 + Math.random() * 0.08) % 1;
    splatDye(x, y, 0.05, hsv2rgb(hue, 0.85, 1.0), 1.0);
    splatVel(x, y, 0.06, (Math.random() - 0.5) * 2.0, (Math.random() - 0.5) * 2.0);
  }
}

function resetSimulation() {
  for (const f of vel.concat(dye, pres, [div, curl, base, bloomA, bloomB]))
    clearFBO(f, 0, 0, 0, 0);
  velRead = 0; dyeRead = 0; presRead = 0;
  initialBurst();
}

/* ---------------- simulation + render ---------------- */

function stepSimulation(dt, energy, t) {
  drainSplatQueue(energy);

  autoTimer -= dt;
  if (autoTimer <= 0) {
    autoTimer = 0.45 + Math.random() * 0.75;
    queueAutoSplat();
  }

  updateEmitters(dt, energy);

  // Turbulence: advected curl-noise force field.
  {
    const src = vel[velRead], dst = vel[velRead ^ 1];
    passes.force.run(dst, {
      textures: [['uVelocity', src.tex]],
      uniforms: [['uTime', t], ['uStrength', settings.turbulence], ['uScale', 5.0], ['uDt', dt]]
    });
    velRead ^= 1;
  }

  const dissV = Math.exp(-1.6 * dt);
  const dissD = Math.exp(-0.45 * dt);

  // Semi-Lagrangian advection.
  {
    const src = vel[velRead], dst = vel[velRead ^ 1];
    passes.advect.run(dst, {
      textures: [['uSource', src.tex], ['uVelocity', src.tex]],
      uniforms: [['uDt', dt], ['uDissipation', dissV], ['uTexelSize', texel]]
    });
    velRead ^= 1;
  }
  {
    const src = dye[dyeRead], dst = dye[dyeRead ^ 1];
    passes.advect.run(dst, {
      textures: [['uSource', src.tex], ['uVelocity', vel[velRead].tex]],
      uniforms: [['uDt', dt], ['uDissipation', dissD], ['uTexelSize', texel]]
    });
    dyeRead ^= 1;
  }

  // Projection: divergence -> Jacobi pressure solve -> subtract gradient.
  passes.divergence.run(div, {
    textures: [['uVelocity', vel[velRead].tex]],
    uniforms: [['uTexelSize', texel], ['uGridSize', grid]]
  });
  for (let i = 0; i < pressureIterations; i++) {
    const src = pres[presRead], dst = pres[presRead ^ 1];
    passes.pressure.run(dst, {
      textures: [['uPressure', src.tex], ['uDivergence', div.tex]],
      uniforms: [['uTexelSize', texel]]
    });
    presRead ^= 1;
  }
  {
    const src = vel[velRead], dst = vel[velRead ^ 1];
    passes.subtract.run(dst, {
      textures: [['uVelocity', src.tex], ['uPressure', pres[presRead].tex]],
      uniforms: [['uTexelSize', texel], ['uGridSize', grid]]
    });
    velRead ^= 1;
  }

  // Vorticity field for the color mapping.
  passes.curl.run(curl, {
    textures: [['uVelocity', vel[velRead].tex]],
    uniforms: [['uTexelSize', texel], ['uGridSize', grid]]
  });
}

function renderScene(t) {
  passes.render.run(base, {
    textures: [['uDye', dye[dyeRead].tex], ['uCurl', curl.tex]],
    uniforms: [
      ['uTexelSize', texel], ['uTime', t],
      ['uHueFactor', settings.hueFactor], ['uHueDrift', settings.hueDrift]
    ]
  });

  passes.copy.run(bloomA, {
    textures: [['uSource', base.tex]],
    uniforms: [['uTexelSize', texel]]
  });
  for (let i = 0; i < 2; i++) {
    passes.blur.run(bloomB, {
      textures: [['uSource', bloomA.tex]],
      uniforms: [['uTexelSize', bloomTexel], ['uDirection', [1, 0]]]
    });
    passes.blur.run(bloomA, {
      textures: [['uSource', bloomB.tex]],
      uniforms: [['uTexelSize', bloomTexel], ['uDirection', [0, 1]]]
    });
  }

  passes.composite.run(null, {
    textures: [['uBase', base.tex], ['uBloom', bloomA.tex]],
    uniforms: [
      ['uBaseTexel', texel], ['uBloomTexel', bloomTexel],
      ['uBloomIntensity', settings.bloom], ['uVignette', 0.55]
    ]
  });
}

/* ---------------- main loop ---------------- */

let lastTime = 0;
let started = false;
let fpsAccum = 0, fpsFrames = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!started) { started = true; lastTime = now; }

  const realDt = Math.min(Math.max((now - lastTime) / 1000, 0.001), 1 / 30);
  lastTime = now;

  fpsAccum += realDt;
  fpsFrames++;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAccum) + ' fps';
    fpsAccum = 0; fpsFrames = 0;
  }

  if (!internal) return;

  if (settings.paused) {
    renderScene(now / 1000);
    return;
  }

  const simDt = Math.min(realDt * settings.speed, 1 / 30);
  const energy = Math.min(simDt * 60, 3);
  stepSimulation(simDt, energy, now / 1000);
  renderScene(now / 1000);
}

/* ---------------- pointer interaction ---------------- */

let pointerActive = false;
let lastPos = null;

function uvFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
}

function brushHue(uv, t) {
  return ((uv[0] * 0.8 + t * 0.04) % 1 + 1) % 1;
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  canvas.setPointerCapture(e.pointerId);
  pointerActive = true;
  const uv = uvFromEvent(e);
  lastPos = uv;
  const t = performance.now() / 1000;
  pushSplat({ type: 'dye', x: uv[0], y: uv[1], radius: 0.045, color: hsv2rgb(brushHue(uv, t), 0.85, 1.0), amount: 0.8 });
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointerActive) return;
  const uv = uvFromEvent(e);
  const dx = uv[0] - lastPos[0];
  const dy = uv[1] - lastPos[1];
  lastPos = uv;
  const m = Math.hypot(dx, dy);
  if (m < 0.00005) return;
  const t = performance.now() / 1000;
  const f = settings.force;
  let vx = dx * 40 * f, vy = dy * 40 * f;
  const maxV = 2.2 * f;
  if (Math.hypot(vx, vy) > maxV) { vx *= maxV / Math.hypot(vx, vy); vy *= maxV / Math.hypot(vx, vy); }
  pushSplat({ type: 'vel', x: uv[0], y: uv[1], radius: 0.028, vx, vy });
  pushSplat({ type: 'dye', x: uv[0], y: uv[1], radius: 0.02, color: hsv2rgb(brushHue(uv, t), 0.85, 1.0), amount: 0.38 });
});

function endPointer(e) {
  if (pointerActive) {
    pointerActive = false;
    lastPos = null;
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------- UI wiring ---------------- */

function bindSlider(id, key, fmt, after) {
  const el = document.getElementById(id);
  const out = document.getElementById('val-' + key);
  const upd = () => {
    settings[key] = parseFloat(el.value);
    out.textContent = fmt(settings[key]);
    if (after) after(settings[key]);
  };
  el.addEventListener('input', upd);
  upd();
}

bindSlider('ctl-speed', 'speed', (v) => v.toFixed(1));
bindSlider('ctl-force', 'force', (v) => v.toFixed(1));
bindSlider('ctl-dye', 'dye', (v) => v.toFixed(1));
bindSlider('ctl-turb', 'turbulence', (v) => v.toFixed(2));
bindSlider('ctl-bloom', 'bloom', (v) => v.toFixed(2));
bindSlider('ctl-irid', 'hueFactor', (v) => v.toFixed(2));

const palettesEl = document.getElementById('palettes');
for (const [name, p] of Object.entries(palettes)) {
  const btn = document.createElement('button');
  btn.className = 'pal';
  btn.dataset.pal = name;
  btn.title = p.label;
  const c0 = hsv2rgb(p.hues[0], p.sat, 0.95).map((c) => Math.round(c * 255));
  const c1 = hsv2rgb(p.hues[(p.hues.length / 2) | 0], p.sat, 0.95).map((c) => Math.round(c * 255));
  const c2 = hsv2rgb(p.hues[p.hues.length - 1], p.sat, 0.95).map((c) => Math.round(c * 255));
  btn.style.background = `linear-gradient(135deg, rgb(${c0.join(',')}), rgb(${c1.join(',')}), rgb(${c2.join(',')}))`;
  btn.addEventListener('click', () => applyPalette(name));
  palettesEl.appendChild(btn);
}

function applyPalette(name) {
  const p = palettes[name];
  currentPalette = p;
  settings.hueFactor = p.hueFactor;
  settings.hueDrift = p.hueDrift;
  document.getElementById('ctl-irid').value = p.hueFactor;
  document.getElementById('val-hueFactor').textContent = p.hueFactor.toFixed(2);
  initEmitters();
  for (const b of palettesEl.querySelectorAll('.pal'))
    b.classList.toggle('active', b.dataset.pal === name);
}

const panel = document.getElementById('panel');
document.getElementById('panel-head').addEventListener('click', () => {
  panel.classList.toggle('collapsed');
});

const btnPause = document.getElementById('btn-pause');
function setPaused(p) {
  settings.paused = p;
  pausedBadge.classList.toggle('hidden', !p);
  btnPause.textContent = p ? 'Resume' : 'Pause';
}
btnPause.addEventListener('click', () => setPaused(!settings.paused));

document.getElementById('btn-reset').addEventListener('click', () => {
  resetSimulation();
  initEmitters();
});

window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
  if (e.code === 'Space') { e.preventDefault(); setPaused(!settings.paused); }
  else if (e.key === 'r' || e.key === 'R') { resetSimulation(); initEmitters(); }
});

window.addEventListener('resize', onResize);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastTime = performance.now();
});

/* ---------------- boot ---------------- */

onResize();
initEmitters();
applyPalette('iridescent');
initialBurst();
