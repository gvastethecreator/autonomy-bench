<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
  :root {
    --accent: #9bff6a;
    --accent-soft: rgba(155, 255, 106, 0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
    color: #d9ffe0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #game {
    display: block;
    background: #05060a;
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(155,255,106,.18), 0 0 60px rgba(80,255,120,.10);
    max-width: 100vw;
    max-height: 100vh;
  }
  #hud {
    position: absolute;
    top: 8px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    pointer-events: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(155,255,106,.6);
  }
  #hud .unit { color: #6b8872; font-size: 11px; letter-spacing: 2px; }
  #msg {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    min-width: 300px;
  }
  #msg h1 {
    margin: 0 0 8px;
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(155,255,106,.8), 0 0 60px rgba(90,255,140,.4);
  }
  #msg p { margin: 4px 0; color: #a8d9b2; line-height: 1.5; }
  #msg .big { font-size: 22px; margin-top: 14px; letter-spacing: 2px; }
  #msg .kbd { color: #eafff0; background: rgba(155,255,106,.12); border: 1px solid rgba(155,255,106,.35); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  #controls {
    position: absolute;
    bottom: 14px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    background: rgba(155,255,106,.08);
    border: 1px solid rgba(155,255,106,.4);
    color: var(--accent);
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: rgba(155,255,106,.18); }
  .btn:active { transform: scale(.97); }
  #touch {
    display: none;
  }
  @media (pointer: coarse) {
    #touch { display: flex; }
    #controls.small-hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div><span class="unit">SCORE</span><br><span id="score">0000</span></div>
    <div><span class="unit">HI-SCORE</span><br><span id="hiscore">0000</span></div>
    <div><span class="unit">LIVES</span><br><span id="lives">3</span></div>
  </div>
  <div id="msg">
    <h1>ASTEROIDS</h1>
    <p>Shoot the asteroids. Don't get hit.</p>
    <p class="big">Press <span class="kbd">SPACE</span> to start</p>
  </div>
  <div id="controls">
    <button class="btn" id="btnStart">Start</button>
  </div>
  <div id="touch">
    <button class="btn" id="tLeft">◀</button>
    <button class="btn" id="tFire">▲</button>
    <button class="btn" id="tRight">▶</button>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  ASTEROIDS — classic arcade clone in one self-contained HTML file.
 *  Canvas + Web Audio. No dependencies, no build step.
 * ------------------------------------------------------------------ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const hiscoreEl = document.getElementById("hiscore");
const livesEl = document.getElementById("lives");
const msgEl = document.getElementById("msg");
const btnStart = document.getElementById("btnStart");

/* ------------------------------ tuning ---------------------------- */

const CFG = {
  width: 900,
  height: 640,
  shipAccel: 0.22,
  shipDecel: 0.985,
  maxSpeed: 6.5,
  rotSpeed: 0.085,
  fireCooldown: 220,      // ms between shots
  maxBullets: 4,
  bulletSpeed: 9,
  bulletLife: 900,        // ms
  shipRadius: 14,
  respawnTime: 1600,      // ms invulnerable on respawn
  startAsteroids: 4,
  maxAsteroids: 10,
  asteroidSpeed: [1.4, 1.9, 2.6],       // large, medium, small
  asteroidRadius: [46, 27, 14],
  asteroidScore: [20, 50, 100],
  saucerInterval: 20000,  // ms between saucers
  saucerLife: 14000,      // ms before it flies away
  saucerSpeed: 2.2,
  saucerFire: 1400,       // ms between saucer shots
  saucerScore: 300,
  powerupChance: 0.30,
  powerupLife: 9000,
};

const wrap = (v, m) => ((v % m) + m) % m;

/* ------------------------------ state ------------------------------ */

const state = {
  running: false,
  over: false,
  started: false,          // ever started (for first-press overlay)
  score: 0,
  lives: 3,
  level: 1,
  ship: null,
  bullets: [],
  asteroids: [],
  particles: [],
  saucers: [],
  saucerShots: [],
  powerups: [],
  stars: [],
  time: 0,
  levelPending: true,      // waiting to spawn wave
  respawnTimer: 0,
  saucerTimer: CFG.saucerInterval,
  shake: 0,
  flash: 0,
};

/* --------------------------- persistence --------------------------- */

let hiScore = 0;
try {
  hiScore = parseInt(localStorage.getItem("asteroids-hiscore") || "0", 10) || 0;
} catch (e) { hiScore = 0; }

function saveHiScore() {
  try { localStorage.setItem("asteroids-hiscore", String(hiScore)); } catch (e) {}
}

/* ------------------------------- audio ----------------------------- */

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

const rng = () => Math.random() * 2 - 1;
function blip(freq, dur, type = "square", vol = 0.15, slide = 0) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide !== 0) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol = 0.2) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = rng() * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(gain).connect(audioCtx.destination);
  src.start(t0);
}
const sfx = {
  fire: () => blip(420, 0.12, "square", 0.12, -160),
  thrust: () => blip(90, 0.08, "sawtooth", 0.04, 30),
  explosion: (big) => noiseBurst(big ? 0.5 : 0.25, big ? 0.28 : 0.18),
  shipExplode: () => { noiseBurst(0.7, 0.3); blip(200, 0.5, "sawtooth", 0.16, -150); },
  extra: () => { blip(660, 0.1, "square", 0.12); setTimeout(() => blip(880, 0.12, "square", 0.12), 90); },
  level: () => { [440, 554, 660].forEach((f, i) => setTimeout(() => blip(f, 0.14, "square", 0.12), i * 120)); },
  saucerShot: () => blip(700, 0.22, "sine", 0.1, -300),
  saucerHit: () => blip(1100, 0.1, "square", 0.12, -600),
};

/* ------------------------------- input ----------------------------- */

const keys = {};
const keyState = { up: false, left: false, right: false, fire: false };
const FIRE_KEY = " ", THRUST_KEY = "ArrowUp", LEFT_KEY = "ArrowLeft", RIGHT_KEY = "ArrowRight";
const ALT_THRUST = "KeyW", ALT_LEFT = "KeyA", ALT_RIGHT = "KeyD", ALT_FIRE = "ShiftLeft";

window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  ensureAudio();
  if (e.code === "Space" || e.code === "Enter") {
    if (!state.running && !state.over) startGame();
    else if (state.over) startGame();
  }
  if (e.code === FIRE_KEY) keyState.fire = true;
  if (e.code === THRUST_KEY || e.code === ALT_THRUST) keyState.up = true;
  if (e.code === LEFT_KEY || e.code === ALT_LEFT) keyState.left = true;
  if (e.code === RIGHT_KEY || e.code === ALT_RIGHT) keyState.right = true;
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  if (e.code === FIRE_KEY) keyState.fire = false;
  if (e.code === THRUST_KEY || e.code === ALT_THRUST) keyState.up = false;
  if (e.code === LEFT_KEY || e.code === ALT_LEFT) keyState.left = false;
  if (e.code === RIGHT_KEY || e.code === ALT_RIGHT) keyState.right = false;
  keys[e.code] = false;
});

/* ----------------------------- helpers ----------------------------- */

function dist2(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
}
function circleHit(a, ar, b, br) {
  const rr = ar + br;
  return dist2(a, b) <= rr * rr;
}

/* ------------------------------ entities --------------------------- */

function makeShip() {
  return {
    x: CFG.width / 2,
    y: CFG.height / 2,
    vx: 0, vy: 0,
    angle: -Math.PI / 2,
    thrusting: false,
    cooldown: 0,
    invuln: CFG.respawnTime,
    alive: true,
  };
}

function spawnShip() {
  state.ship = makeShip();
  state.respawnTimer = 0;
}

function makeAsteroid(radius, x, y) {
  const r = CFG.asteroidRadius[radius];
  const ang = Math.random() * Math.PI * 2;
  const sp = CFG.asteroidSpeed[radius] * (0.75 + Math.random() * 0.5);
  return {
    radius,                    // 0 large, 1 medium, 2 small
    x: x ?? Math.random() * CFG.width,
    y: y ?? Math.random() * CFG.height,
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    verts: makeRockShape(radius),
  };
}

function makeRockShape(radius) {
  const n = 12;
  const verts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = 0.72 + Math.random() * 0.35;
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return verts;
}

function fireBullet() {
  const s = state.ship;
  if (!s || !s.alive || s.cooldown > 0 || state.bullets.length >= CFG.maxBullets) return;
  s.cooldown = s.rapid ? 85 : CFG.fireCooldown;
  state.bullets.push({
    x: s.x + Math.cos(s.angle) * 22,
    y: s.y + Math.sin(s.angle) * 22,
    vx: s.vx + Math.cos(s.angle) * CFG.bulletSpeed,
    vy: s.vy + Math.sin(s.angle) * CFG.bulletSpeed,
    life: CFG.bulletLife,
  });
  sfx.fire();
}

function sprayBurst(x, y, count, speed, color, life) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.3 + Math.random() * 0.7);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: life * (0.5 + Math.random() * 0.5),
      maxLife: life,
      size: 1 + Math.random() * 2.4,
      color,
    });
  }
}

function explodeAsteroid(ast) {
  state.score += CFG.asteroidScore[ast.radius];
  if (state.score > hiScore) { hiScore = state.score; saveHiScore(); }
  sfx.explosion(ast.radius === 0);
  sprayBurst(ast.x, ast.y, Math.round(14 - ast.radius * 3), 3.4, ast.radius === 0 ? "#c9ffa8" : "#9bff6a", 500);
  if (ast.radius < 2) {
    state.asteroids = state.asteroids.filter(a => a !== ast);
    // chance for a powerup from a destroyed small rock
    if (Math.random() < CFG.powerupChance) {
      state.powerups.push({
        x: ast.x, y: ast.y,
        kind: Math.random() < 0.5 ? "rapid" : "shield",
        life: CFG.powerupLife,
        bob: 0,
      });
    }
    return;
  }
  const idx = state.asteroids.indexOf(ast);
  const kids = 2;
  for (let i = 0; i < kids; i++) {
    const child = makeAsteroid(ast.radius + 1, ast.x, ast.y);
    child.vx += (Math.random() - 0.5) * 1.6;
    child.vy += (Math.random() - 0.5) * 1.6;
    state.asteroids.push(child);
  }
  state.asteroids.splice(idx, 1);
}

function killShip() {
  const s = state.ship;
  if (!s || !s.alive) return;
  s.alive = false;
  sfx.shipExplode();
  sprayBurst(s.x, s.y, 40, 5, "#eafff0", 700);
  state.shake = 12;
  state.flash = 1;
  state.lives--;
  state.ship = null;
  if (state.lives < 0) {
    gameOver();
  } else {
    state.respawnTimer = CFG.respawnTime;
  }
}

function spawnWave() {
  state.levelPending = false;
  const count = Math.min(CFG.startAsteroids + state.level - 1, CFG.maxAsteroids);
  state.asteroids = [];
  const cx = CFG.width / 2, cy = CFG.height / 2;
  let guard = 0;
  while (state.asteroids.length < count && guard++ < 400) {
    const x = Math.random() * CFG.width;
    const y = Math.random() * CFG.height;
    // keep spawn clear of the player
    if (dist2({ x, y }, { x: cx, y: cy }) < 150 * 150) continue;
    state.asteroids.push(makeAsteroid(0, x, y));
  }
  sfx.level();
  state.saucerTimer = CFG.saucerInterval;
}

function spawnSaucer() {
  const fromLeft = Math.random() < 0.5;
  state.saucers.push({
    x: fromLeft ? -30 : CFG.width + 30,
    y: 40 + Math.random() * (CFG.height - 120),
    dir: fromLeft ? 1 : -1,
    fireTimer: 1200,
    life: CFG.saucerLife,
    bob: 0,
  });
}

function gameOver() {
  state.over = true;
  state.powerups = [];
  state.saucers = [];
  state.saucerShots = [];
  hiScore = Math.max(hiScore, state.score);
  if (state.bullets.length) sfx.explosion(true);
  msgEl.innerHTML =
    '<h1>GAME OVER</h1>' +
    `<p>Final score: ${String(state.score).padStart(4, "0")}</p>` +
    '<p class="big">Press <span class="kbd">SPACE</span> to play again</p>';
  msgEl.style.display = "block";
}

function startGame() {
  ensureAudio();
  state.running = true;
  state.over = false;
  state.started = true;
  state.score = 0;
  state.lives = 3;
  state.level = 1;
  state.bullets = [];
  state.asteroids = [];
  state.saucers = [];
  state.saucerShots = [];
  state.powerups = [];
  state.particles = [];
  state.levelPending = true;
  state.respawnTimer = 0;
  state.saucerTimer = CFG.saucerInterval;
  spawnShip();
  msgEl.style.display = "none";
}

/* ------------------------------ stars ------------------------------ */

function initStars() {
  state.stars = [];
  const n = 130;
  for (let i = 0; i < n; i++) {
    state.stars.push({
      x: Math.random() * CFG.width,
      y: Math.random() * CFG.height,
      size: Math.random() < 0.15 ? 1.8 : 0.8,
      tw: Math.random() * Math.PI * 2,
      speed: 0.02 + Math.random() * 0.05,
    });
  }
}

/* ------------------------------ update ----------------------------- */

function update(dt, t) {
  // dt is the number of 60fps frames elapsed (1.0 == one frame at 60fps)
  const s = state.ship;
  const ms = dt * (1000 / 60);

  // level spawn
  if (state.levelPending && state.asteroids.length === 0) spawnWave();

  // respawn
  if (state.respawnTimer > 0) {
    state.respawnTimer -= ms;
    if (state.respawnTimer <= 0 && state.ship === null && state.lives >= 0) spawnShip();
  }

  if (s && s.alive) {
    s.cooldown = Math.max(0, s.cooldown - ms);
    s.invuln = Math.max(0, s.invuln - ms);
    s.rapid = !!(s.rapidUntil && t < s.rapidUntil);
    if (s.rapidUntil && t >= s.rapidUntil) s.rapidUntil = null;

    if (keyState.left) s.angle -= CFG.rotSpeed * dt;
    if (keyState.right) s.angle += CFG.rotSpeed * dt;

    s.thrusting = keyState.up;
    if (s.thrusting) {
      s.vx += Math.cos(s.angle) * CFG.shipAccel * dt;
      s.vy += Math.sin(s.angle) * CFG.shipAccel * dt;
      sfx.thrust();
      // flame particles
      if (Math.random() < 0.5) {
        state.particles.push({
          x: s.x - Math.cos(s.angle) * 16,
          y: s.y - Math.sin(s.angle) * 16,
          vx: -Math.cos(s.angle) * 2 + (Math.random() - 0.5),
          vy: -Math.sin(s.angle) * 2 + (Math.random() - 0.5),
          life: 300, maxLife: 300, size: 2,
          color: "#ffd76a",
        });
      }
    }
    const sp = Math.hypot(s.vx, s.vy);
    if (sp > CFG.maxSpeed) {
      s.vx = s.vx / sp * CFG.maxSpeed;
      s.vy = s.vy / sp * CFG.maxSpeed;
    }
    s.vx *= Math.pow(CFG.shipDecel, dt);
    s.vy *= Math.pow(CFG.shipDecel, dt);
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.x = wrap(s.x, CFG.width);
    s.y = wrap(s.y, CFG.height);

    if (keyState.fire) fireBullet();
  }

  // bullets
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= ms;
    b.x = wrap(b.x, CFG.width);
    b.y = wrap(b.y, CFG.height);
    if (b.life <= 0) state.bullets.splice(i, 1);
  }

  // asteroids
  for (const a of state.asteroids) {
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rot += a.rotSpeed * dt;
    a.x = wrap(a.x, CFG.width);
    a.y = wrap(a.y, CFG.height);
  }

  // saucers
  if (state.running && !state.over && state.asteroids.length > 0) {
    state.saucerTimer -= ms;
    if (state.saucerTimer <= 0 && state.saucers.length === 0) spawnSaucer();
  }
  for (let i = state.saucers.length - 1; i >= 0; i--) {
    const u = state.saucers[i];
    u.x += u.dir * CFG.saucerSpeed * dt;
    u.bob += 0.05 * dt;
    u.y += Math.sin(u.bob * 0.05) * 0.5 * dt;
    u.life -= ms;
    u.fireTimer -= ms;
    if (u.fireTimer <= 0 && s && s.alive) {
      u.fireTimer = CFG.saucerFire;
      const ang = Math.atan2(s.y - u.y, s.x - u.x) + (Math.random() - 0.5) * 0.25;
      state.saucerShots.push({
        x: u.x, y: u.y,
        vx: Math.cos(ang) * 3.2,
        vy: Math.sin(ang) * 3.2,
        life: 4000,
      });
      sfx.saucerShot();
    }
    if (u.life <= 0 || u.x < -60 || u.x > CFG.width + 60) state.saucers.splice(i, 1);
  }
  for (let i = state.saucerShots.length - 1; i >= 0; i--) {
    const b = state.saucerShots[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= ms;
    if (b.life <= 0) state.saucerShots.splice(i, 1);
  }

  // powerups
  for (let i = state.powerups.length - 1; i >= 0; i--) {
    const p = state.powerups[i];
    p.life -= ms;
    p.bob += 0.08 * dt;
    if (p.life <= 0) state.powerups.splice(i, 1);
  }

  // particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= ms;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  /* ------------------------- collisions ------------------------- */

  // bullets vs asteroids
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    let hit = false;
    for (let j = state.asteroids.length - 1; j >= 0; j--) {
      const a = state.asteroids[j];
      if (circleHit(b, 2.5, a, CFG.asteroidRadius[a.radius])) {
        explodeAsteroid(a);
        state.bullets.splice(i, 1);
        hit = true;
        break;
      }
    }
    if (hit) continue;
    // bullets vs saucers
    for (let j = state.saucers.length - 1; j >= 0; j--) {
      const u = state.saucers[j];
      if (circleHit(b, 2.5, u, 18)) {
        state.score += CFG.saucerScore;
        if (state.score > hiScore) { hiScore = state.score; saveHiScore(); }
        sfx.saucerHit();
        sprayBurst(u.x, u.y, 26, 4, "#ffe9a8", 500);
        state.saucers.splice(j, 1);
        state.bullets.splice(i, 1);
        hit = true;
        break;
      }
    }
  }

  // ship vs saucer shots
  if (s && s.alive && s.invuln <= 0) {
    for (let i = state.saucerShots.length - 1; i >= 0; i--) {
      const b = state.saucerShots[i];
      if (circleHit(s, CFG.shipRadius, b, 3)) {
        state.saucerShots.splice(i, 1);
        killShip();
        break;
      }
    }
  }

  // ship vs asteroids
  if (s && s.alive && s.invuln <= 0) {
    for (let j = state.asteroids.length - 1; j >= 0; j--) {
      const a = state.asteroids[j];
      if (circleHit(s, CFG.shipRadius, a, CFG.asteroidRadius[a.radius])) {
        killShip();
        break;
      }
    }
  }

  // ship vs saucers
  if (s && s.alive && s.invuln <= 0) {
    for (let j = state.saucers.length - 1; j >= 0; j--) {
      const u = state.saucers[j];
      if (circleHit(s, CFG.shipRadius, u, 18)) {
        sfx.saucerHit();
        sprayBurst(u.x, u.y, 26, 4, "#ffe9a8", 500);
        state.saucers.splice(j, 1);
        state.score += CFG.saucerScore;
        if (state.score > hiScore) { hiScore = state.score; saveHiScore(); }
        killShip();
        break;
      }
    }
  }

  // ship vs powerups
  if (s && s.alive) {
    for (let i = state.powerups.length - 1; i >= 0; i--) {
      const p = state.powerups[i];
      if (circleHit(s, CFG.shipRadius, p, 14)) {
        state.powerups.splice(i, 1);
        sfx.extra();
        if (p.kind === "shield") {
          s.invuln = Math.max(s.invuln, 5000);
          flashText("SHIELD", "#7fd4ff");
        } else {
          s.rapidUntil = t + 8000;
          flashText("RAPID FIRE", "#ffd76a");
        }
      }
    }
  }

  // wave cleared -> next level
  if (state.running && !state.over && state.asteroids.length === 0) {
    state.level++;
    state.levelPending = true;
  }

  state.time += dt / 60;
  state.shake *= 0.9;
  state.flash *= 0.9;
}

/* ---------------------------- flash text --------------------------- */

let flashMsg = null;
function flashText(text, color) {
  flashMsg = { text, color, life: 1400 };
}

/* ------------------------------ render ----------------------------- */

function drawShip(s) {
  if (!s) return;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);

  const blink = s.invuln > 0 && Math.floor(state.time * 12) % 2 === 0;
  const alpha = blink ? 0.55 : 1;

  ctx.globalAlpha = 0.35;
  ctx.shadowColor = "#9bff6a";
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.moveTo(22, 0);
  ctx.lineTo(-14, 14);
  ctx.lineTo(-8, 0);
  ctx.lineTo(-14, -14);
  ctx.closePath();
  ctx.fillStyle = "#0a120c";
  ctx.strokeStyle = "#9bff6a";
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
  ctx.globalAlpha = alpha;

  // cockpit
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(-4, -5);
  ctx.lineTo(-4, 5);
  ctx.closePath();
  ctx.fillStyle = "#bfe8ff";
  ctx.fill();

  ctx.restore();

  // shield bubble
  if (s.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.14 + 0.08 * Math.sin(state.time * 10);
    ctx.strokeStyle = "#7fd4ff";
    ctx.shadowColor = "#7fd4ff";
    ctx.shadowBlur = 16;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, CFG.shipRadius + 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawAsteroid(a) {
  const r = CFG.asteroidRadius[a.radius];
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  a.verts.forEach((v, i) => {
    const px = v[0] * r, py = v[1] * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.fillStyle = "#0b0f0d";
  ctx.strokeStyle = a.radius === 0 ? "#8fd9a0" : "#b9e6c4";
  ctx.lineWidth = a.radius === 0 ? 2 : 1.5;
  ctx.shadowColor = "#6ecf8a";
  ctx.shadowBlur = a.radius === 0 ? 10 : 6;
  ctx.fill();
  ctx.stroke();
  // craters
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(120, 180, 140, 0.18)";
  for (const c of a.verts.slice(0, 3)) {
    ctx.beginPath();
    ctx.arc(c[0] * r * 0.5 + r * 0.15, c[1] * r * 0.5 + r * 0.15, r * 0.14, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSaucer(u) {
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.shadowColor = "#9bff6a";
  ctx.shadowBlur = 12;
  ctx.fillStyle = "#0b0f0d";
  ctx.strokeStyle = "#d0ffdd";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 3, 18, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -3, 12, 8, 0, Math.PI, 0);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#9bff6a";
  ctx.beginPath();
  ctx.arc(u.dir > 0 ? 8 : -8, 3, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPowerup(p) {
  const pulse = 1 + 0.15 * Math.sin(p.bob * 4);
  ctx.save();
  ctx.translate(p.x, p.y + Math.sin(p.bob) * 5);
  const col = p.kind === "shield" ? "#7fd4ff" : "#ffd76a";
  ctx.shadowColor = col;
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(0, 0, 11 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = "#0b0f0d";
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = col;
  ctx.font = "bold 12px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(p.kind === "shield" ? "S" : "R", 0, 1);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // shake
  if (state.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
  }

  // background
  ctx.fillStyle = "#05060a";
  ctx.fillRect(-20, -20, CFG.width + 40, CFG.height + 40);

  // stars
  for (const st of state.stars) {
    st.tw += st.speed;
    const a = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(st.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = st.size > 1 ? "#cfe6d5" : "#7f9c88";
    ctx.fillRect(st.x, st.y, st.size, st.size);
  }
  ctx.globalAlpha = 1;

  // powerups
  for (const p of state.powerups) drawPowerup(p);

  // asteroids
  for (const a of state.asteroids) drawAsteroid(a);

  // saucers + their shots
  for (const u of state.saucers) drawSaucer(u);
  for (const b of state.saucerShots) {
    ctx.save();
    ctx.shadowColor = "#ff8a6a";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ff8a6a";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // bullets
  ctx.save();
  ctx.shadowColor = "#9bff6a";
  ctx.shadowBlur = 8;
  ctx.fillStyle = "#eafff0";
  for (const b of state.bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ship
  drawShip(state.ship);

  // particles
  for (const p of state.particles) {
    const k = p.life / p.maxLife;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, p.size * k), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // flash overlay
  if (state.flash > 0.02) {
    ctx.fillStyle = `rgba(255, 255, 255, ${state.flash * 0.25})`;
    ctx.fillRect(-20, -20, CFG.width + 40, CFG.height + 40);
  }

  // flash message
  if (flashMsg) {
    flashMsg.life -= 16;
    if (flashMsg.life <= 0) flashMsg = null;
    else {
      ctx.save();
      ctx.globalAlpha = Math.min(1, flashMsg.life / 400);
      ctx.font = "bold 30px monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = flashMsg.color;
      ctx.shadowColor = flashMsg.color;
      ctx.shadowBlur = 16;
      ctx.fillText(flashMsg.text, CFG.width / 2, CFG.height / 2 - 60);
      ctx.restore();
    }
  }
}

/* ------------------------------- HUD ------------------------------- */

function updateHud() {
  scoreEl.textContent = String(state.score).padStart(4, "0");
  hiscoreEl.textContent = String(hiScore).padStart(4, "0");
  livesEl.textContent = String(Math.max(0, state.lives));
}

/* ------------------------------- loop ------------------------------ */

let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, Math.max(0.0001, (now - last) / 1000));
  last = now;

  // normalize update speed: design assumes 60fps
  const u = dt / (1 / 60);

  if (state.running && !state.over) {
    update(u, now);
  } else if (!state.over) {
    // idle drift: gently rotate ship preview
    if (state.ship) state.ship.angle += 0.01;
  }
  // continue animating particles after game over
  if (state.over) {
    state.time += dt;
    const f = dt / (1 / 60);
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.life -= f * (1000 / 60);
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    state.shake *= 0.9;
    state.flash *= 0.9;
  }

  render();
  updateHud();
  requestAnimationFrame(frame);
}

/* --------------------------- resize / init ------------------------- */

function fit() {
  const scale = Math.min(window.innerWidth / CFG.width, window.innerHeight / CFG.height) * 0.96;
  canvas.width = CFG.width;
  canvas.height = CFG.height;
  canvas.style.width = Math.round(CFG.width * scale) + "px";
  canvas.style.height = Math.round(CFG.height * scale) + "px";
}
window.addEventListener("resize", fit);

initStars();
if (state.ship === null) state.ship = makeShip();
fit();
requestAnimationFrame(frame);

/* --------------------------- start button -------------------------- */

btnStart.addEventListener("click", () => { ensureAudio(); startGame(); });

/* --------------------------- touch controls ------------------------ */

const tLeft = document.getElementById("tLeft");
const tRight = document.getElementById("tRight");
const tFire = document.getElementById("tFire");

function hold(el, setOn, setOff) {
  let down = false;
  const on = (e) => { e.preventDefault(); ensureAudio(); down = true; setOn(); };
  const off = () => { if (down) { down = false; setOff(); } };
  el.addEventListener("touchstart", on, { passive: false });
  el.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  el.addEventListener("touchend", off);
  el.addEventListener("touchcancel", off);
  el.addEventListener("mousedown", on);
  window.addEventListener("mouseup", off);
}
hold(tLeft, () => (keyState.left = true), () => (keyState.left = false));
hold(tRight, () => (keyState.right = true), () => (keyState.right = false));
hold(tFire, () => {
  keyState.up = true;
  keyState.fire = true;
  const rel = () => { keyState.up = false; keyState.fire = false; window.removeEventListener("mouseup", rel); };
  window.addEventListener("mouseup", rel);
}, () => {});
</script>
