<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
  :root {
    --bg: #0f1220;
    --face: #161a2e;
    --ring: #2a3050;
    --tick: #8a93b8;
    --hand-hour: #f5f7ff;
    --hand-min: #e8ecff;
    --hand-sec: #ff5c7a;
    --text: #eef1fb;
    --muted: #9aa3c7;
    --accent: #6ea8ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(1200px 800px at 50% 30%, #1a2040 0%, var(--bg) 60%, #0a0c16 100%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .dial {
    position: relative;
    width: min(72vmin, 420px);
    height: min(72vmin, 420px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 42%, #1d2340 0%, var(--face) 55%, #12152a 100%);
    border: 1px solid var(--ring);
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.55),
      0 8px 20px rgba(0, 0, 0, 0.35),
      inset 0 0 40px rgba(0, 0, 0, 0.5),
      inset 0 2px 6px rgba(255, 255, 255, 0.04);
  }

  /* Ticks */
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 8px;
    border-radius: 2px;
    background: var(--tick);
    transform-origin: 50% 0;
  }

  .tick.major {
    width: 4px;
    height: 16px;
    background: var(--text);
  }

  .tick.major::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 34px;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Numbers */
  .number {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(13px, 3.4vmin, 19px);
    font-weight: 600;
    color: var(--text);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 6px;
  }

  .hand.hour {
    width: 8px;
    height: 24%;
    margin: -24% 0 0 -4px;
    background: linear-gradient(to top, var(--hand-hour) 78%, transparent 78%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }

  .hand.minute {
    width: 6px;
    height: 36%;
    margin: -36% 0 0 -3px;
    background: linear-gradient(to top, var(--hand-min) 84%, transparent 84%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }

  .hand.second {
    width: 2px;
    height: 44%;
    margin: -44% 0 0 -1px;
    background: linear-gradient(to top, var(--hand-sec) 82%, transparent 82%);
  }

  .hand.second::after {
    content: "";
    position: absolute;
    bottom: -14%;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 14%;
    border-radius: 4px;
    background: var(--hand-sec);
  }

  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px var(--face), 0 0 14px rgba(255, 255, 255, 0.35);
  }

  .center::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--hand-sec);
  }

  .readout {
    text-align: center;
    user-select: none;
  }

  .digital {
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 9vmin, 56px);
    font-weight: 200;
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  .digital .sep { color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  .date {
    margin-top: 8px;
    font-size: clamp(13px, 3vmin, 16px);
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .badge {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main class="clock" role="img" aria-label="Analog clock showing the current time">
    <div class="dial" id="dial"></div>
    <div class="readout">
      <div class="digital" id="digital">00:00:00</div>
      <div class="date" id="date">&nbsp;</div>
      <div class="badge">Local Time</div>
    </div>
  </main>

<script>
  (function () {
    const dial = document.getElementById("dial");
    const digital = document.getElementById("digital");
    const dateEl = document.getElementById("date");

    const hourHand = document.createElement("div");
    hourHand.className = "hand hour";
    const minuteHand = document.createElement("div");
    minuteHand.className = "hand minute";
    const secondHand = document.createElement("div");
    secondHand.className = "hand second";

    dial.appendChild(hourHand);
    dial.appendChild(minuteHand);
    dial.appendChild(secondHand);

    const center = document.createElement("div");
    center.className = "center";
    dial.appendChild(center);

    // Tick marks every 6 degrees; majors at the hours.
    for (let i = 0; i < 60; i++) {
      const tick = document.createElement("div");
      tick.className = "tick" + (i % 5 === 0 ? " major" : "");
      tick.style.transform = "translate(-50%, -50%) rotate(" + (i * 6) + "deg) translateY(-" + (dial.offsetWidth / 2 - 10) + "px)";
      dial.appendChild(tick);
    }

    // Hour numbers 1-12 positioned around the face.
    const r = dial.offsetWidth / 2 - dial.offsetWidth * 0.16;
    for (let h = 1; h <= 12; h++) {
      const num = document.createElement("div");
      num.className = "number";
      num.textContent = h;
      const a = (h * 30 - 90) * Math.PI / 180;
      num.style.transform = "translate(" + (Math.cos(a) * r) + "px, " + (Math.sin(a) * r) + "px)";
      dial.appendChild(num);
    }

    const pad = function (n) { return n < 10 ? "0" + n : "" + n; };

    const MONTHS = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    function update() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const ms = now.getMilliseconds();

      // Smooth continuous hand motion.
      const secDeg = (s + ms / 1000) * 6;
      const minDeg = (m + s / 60 + ms / 60000) * 6;
      const hourDeg = ((h % 12) + m / 60 + s / 3600) * 30;

      secondHand.style.transform = "rotate(" + secDeg + "deg)";
      minuteHand.style.transform = "rotate(" + minDeg + "deg)";
      hourHand.style.transform = "rotate(" + hourDeg + "deg)";

      const h12 = h % 12 === 0 ? 12 : h % 12;
      digital.innerHTML = pad(h12) + '<span class="sep">:</span>' + pad(m) + '<span class="sep">:</span>' + pad(s) +
        (h >= 12 ? " PM" : " AM");
      dateEl.textContent = DAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
    }

    update();
    setInterval(update, 50);
  })();
</script>
</body>
</html>
