<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Satisfying Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --btn-size: clamp(150px, 30vmin, 205px);
    --ring-ratio: 1.2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
    color: #eef2ff;
    background: #0a0f1e;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
  .b1 {
    width: 60vmax; height: 60vmax; left: -18vmax; top: -22vmax;
    background: radial-gradient(circle at 35% 35%, #3b2f63, transparent 65%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .b2 {
    width: 55vmax; height: 55vmax; right: -20vmax; bottom: -24vmax;
    background: radial-gradient(circle at 60% 40%, #123b52, transparent 65%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .b3 {
    width: 34vmax; height: 34vmax; left: 30vw; bottom: -16vmax;
    background: radial-gradient(circle at 50% 50%, #4a1f3d, transparent 62%);
    animation: drift3 22s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(9vw, 7vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-8vw, -6vh) scale(1.12); } }
  @keyframes drift3 { to { transform: translate(6vw, -10vh) scale(1.2); } }

  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(2, 4, 10, .55) 100%);
  }

  #fx { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  .scene {
    position: relative; z-index: 3; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; padding: 24px; text-align: center;
  }
  .eyebrow {
    font-size: 13px; letter-spacing: .42em; text-transform: uppercase; font-weight: 600;
    background: linear-gradient(90deg, #ffd166, #ff8e6b, #ff5d8f);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .stage { position: relative; animation: float 3.6s ease-in-out infinite alternate; }
  @keyframes float { from { transform: translateY(-7px); } to { transform: translateY(7px); } }

  .btn {
    position: relative; display: grid; place-items: center;
    width: calc(var(--btn-size) * var(--ring-ratio));
    height: calc(var(--btn-size) * var(--ring-ratio));
    border: none; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    user-select: none; outline: none; border-radius: 50%;
  }
  .btn:focus-visible { outline: 3px solid rgba(255, 255, 255, .65); outline-offset: 12px; }

  .orbit {
    position: absolute; inset: 4%; border: 1px dashed rgba(255, 255, 255, .10);
    border-radius: 50%; animation: spin 40s linear infinite; pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .halo {
    position: absolute; inset: -6%;
    background: radial-gradient(circle, rgba(255, 120, 90, .34), rgba(255, 77, 110, .12) 45%, transparent 70%);
    filter: blur(22px); opacity: .5; border-radius: 50%;
    transition: opacity .18s ease; pointer-events: none;
  }
  .btn:hover .halo { opacity: .68; }

  .charge { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transform: rotate(-90deg); }
  .charge-track { fill: none; stroke: rgba(255, 255, 255, .09); stroke-width: 7; }
  #charge-ring {
    fill: none; stroke-width: 7; stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(255, 140, 90, .8));
  }

  .ground {
    position: absolute; left: 50%; bottom: -20px; width: 62%; height: 22px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, .55), transparent 68%);
    filter: blur(7px); transition: transform .12s ease, opacity .12s ease;
    pointer-events: none;
  }
  .btn.pressed .ground { transform: translateX(-50%) scaleY(.5); opacity: .55; }

  .btn-body {
    position: relative; width: var(--btn-size); height: var(--btn-size);
    border-radius: 50%; display: grid; place-items: center;
    background:
      radial-gradient(circle at 30% 24%, rgba(255, 255, 255, .4), rgba(255, 255, 255, 0) 42%),
      linear-gradient(150deg, #ffa06b 0%, #ff6b6b 46%, #ff3d6e 100%);
    box-shadow:
      0 26px 46px -14px rgba(255, 80, 95, .55),
      0 12px 22px rgba(0, 0, 0, .4),
      inset 0 -12px 20px rgba(178, 0, 66, .45),
      inset 0 7px 12px rgba(255, 255, 255, .4);
    transform: translateY(0) scale(calc(1 + var(--charge-s, 0) * .05));
    transition: transform .09s ease-out, box-shadow .14s ease-out, filter .18s ease-out;
  }
  .btn:hover .btn-body { filter: brightness(1.06) saturate(1.1); }
  .btn.pressed .btn-body {
    transform: translateY(8px) scale(calc(.96 + var(--charge-s, 0) * .06));
    box-shadow:
      0 8px 16px -8px rgba(255, 80, 95, .5),
      0 3px 8px rgba(0, 0, 0, .42),
      inset 0 8px 16px rgba(178, 0, 66, .55),
      inset 0 -4px 8px rgba(255, 255, 255, .18);
  }

  .btn-gloss {
    position: absolute; top: 9%; left: 12%; width: 44%; height: 26%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0));
    filter: blur(6px); transform: rotate(-18deg);
    pointer-events: none;
  }
  .btn.pressed .btn-gloss { opacity: .45; }

  .btn-icon { width: 27%; height: 27%; color: #fff; filter: drop-shadow(0 2px 4px rgba(120, 0, 40, .5)); }

  .counter { display: flex; align-items: baseline; gap: 10px; line-height: 1; }
  #count {
    font-size: clamp(56px, 10vmin, 84px); font-weight: 900;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #ffd9c9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block; min-width: 1.2ch;
  }
  .unit { font-size: 22px; font-weight: 600; color: rgba(238, 242, 255, .5); letter-spacing: .08em; }

  .hint {
    height: 26px; font-size: 15px; font-weight: 500; letter-spacing: .04em;
    color: rgba(238, 242, 255, .55);
  }

  .mute {
    position: fixed; z-index: 4; top: 18px; right: 18px;
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05);
    color: rgba(238, 242, 255, .8); cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s ease, transform .15s ease;
  }
  .mute:hover { background: rgba(255, 255, 255, .12); transform: scale(1.06); }
  .mute svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div class="vignette"></div>
  <canvas id="fx"></canvas>

  <div class="scene">
    <p class="eyebrow">Satisfying</p>

    <div class="stage">
      <button id="btn" class="btn" aria-label="Satisfying button — click or hold to charge">
        <span class="orbit"></span>
        <span class="halo" id="halo"></span>
        <svg class="charge" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="charge-track" cx="120" cy="120" r="110"></circle>
          <circle id="charge-ring" cx="120" cy="120" r="110"></circle>
        </svg>
        <span class="ground"></span>
        <span class="btn-body">
          <span class="btn-gloss"></span>
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5 14.6 9.4 21.5 12 14.6 14.6 12 21.5 9.4 14.6 2.5 12 9.4 9.4Z" fill="currentColor"></path>
          </svg>
        </span>
      </button>
    </div>

    <div class="counter" aria-live="polite">
      <span id="count">0</span>
      <span class="unit" id="unit">pops</span>
    </div>

    <p class="hint" id="hint">click it — or hold to charge</p>
  </div>

  <button class="mute" id="mute" aria-label="Mute sound">
    <svg id="mute-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      <path d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
    <svg id="mute-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

<script>
(() => {
  'use strict';

  // ---------- canvas / particles ----------
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const dust = [];
  for (let i = 0; i < 42; i++) {
    dust.push({
      x: Math.random() * W, y: Math.random() * H,
      r: .5 + Math.random() * 1.6,
      vx: (Math.random() - .5) * .06,
      vy: -(.04 + Math.random() * .16),
      tw: Math.random() * Math.PI * 2,
      tws: .5 + Math.random() * 1.1,
      a: .04 + Math.random() * .16,
    });
  }

  const particles = [];
  const waves = [];
  const COLORS = ['#ffd166', '#ff8e6b', '#ff3d6e', '#ffffff', '#4dd0e1'];

  function spawnBurst(x, y, charge) {
    const n = Math.round(26 + charge * 74);
    const speed = 3 + charge * 10;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = speed * (.3 + Math.random() * .95);
      const roll = Math.random();
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 2.4,
        r: (1.8 + Math.random() * 4.2) * (.7 + charge * .6),
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1,
        decay: .011 + Math.random() * .02,
        drag: .982,
        grav: .16,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - .5) * .35,
        shape: roll < .28 ? 'spark' : roll < .5 ? 'rect' : 'dot',
      });
    }
    waves.push({ x, y, r: 10, max: 80 + charge * 170, life: 1, decay: .055 + charge * .025, width: 3 + charge * 3.5 });
  }

  // ---------- dom refs ----------
  const btn = document.getElementById('btn');
  const btnBody = btn.querySelector('.btn-body');
  const halo = document.getElementById('halo');
  const ring = document.getElementById('charge-ring');
  const countEl = document.getElementById('count');
  const unitEl = document.getElementById('unit');
  const hintEl = document.getElementById('hint');
  const scene = document.querySelector('.scene');
  const muteBtn = document.getElementById('mute');
  const muteOn = document.getElementById('mute-on');
  const muteOff = document.getElementById('mute-off');

  const CIRC = 2 * Math.PI * 110;
  ring.style.strokeDasharray = CIRC.toFixed(2);
  ring.style.strokeDashoffset = CIRC.toFixed(2);

  function getBtnPos() {
    const r = btn.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function ringFill(v) {
    ring.style.strokeDashoffset = (CIRC * (1 - v)).toFixed(2);
    ring.style.stroke = `hsl(${(44 - v * 78).toFixed(0)}, 96%, ${(62 - v * 14).toFixed(0)}%)`;
  }

  // ---------- audio ----------
  let actx = null, master = null, muted = false;
  function ensureAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = .16;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function playPress() {
    if (muted) return;
    const ac = ensureAudio(); if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(185, t);
    o.frequency.exponentialRampToValueAtTime(92, t + .09);
    g.gain.setValueAtTime(.9, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .12);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + .14);

    const len = Math.floor(ac.sampleRate * .028);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 850;
    const ng = ac.createGain(); ng.gain.value = .5;
    src.connect(f); f.connect(ng); ng.connect(master);
    src.start(t);
  }
  function playPop(charge) {
    if (muted) return;
    const ac = ensureAudio(); if (!ac) return;
    const t = ac.currentTime;
    const f0 = 270 + charge * 430;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.min(f0 * 1.7, 1400), t + .05);
    o.frequency.exponentialRampToValueAtTime(120, t + .22);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.85, t + .012);
    g.gain.exponentialRampToValueAtTime(.001, t + .24);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + .26);

    const o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(f0 * 2, t);
    o2.frequency.exponentialRampToValueAtTime(f0 * 4, t + .06);
    g2.gain.setValueAtTime(.0001, t);
    g2.gain.exponentialRampToValueAtTime(.3, t + .01);
    g2.gain.exponentialRampToValueAtTime(.001, t + .16);
    o2.connect(g2); g2.connect(master);
    o2.start(t); o2.stop(t + .18);
  }

  // ---------- interaction state ----------
  let activeSource = null;   // 'pointer' | 'key' | null
  let charging = false;
  let charge = 0;
  let chargeStart = 0;
  let chargeRAF = 0;
  let pops = 0;
  let popAnim = null, bumpAnim = null, hintTimer = null;

  function setHint(text) {
    hintEl.textContent = text;
    hintEl.animate(
      [{ opacity: .35, transform: 'translateY(3px)' }, { opacity: 1, transform: 'translateY(0)' }],
      { duration: 220, easing: 'ease-out' }
    );
  }
  function scheduleIdleHint() {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => setHint('click it — or hold to charge'), 1200);
  }

  const BURSTS = ['satisfying ✦', 'again. again.', 'mmm, perfect', 'keep going…', 'one more ⚡'];

  function press(now) {
    if (charging) return;
    charging = true;
    btn.classList.add('pressed');
    charge = 0;
    chargeStart = now;
    ringFill(0);
    btnBody.style.setProperty('--charge-s', '0');
    halo.style.opacity = '.45';
    playPress();
    setHint('hold to charge up…');
    chargeRAF = requestAnimationFrame(tickCharge);
  }
  function tickCharge(now) {
    if (!charging) return;
    const p = Math.min(1, (now - chargeStart) / 1400);
    charge = p * (2 - p);
    ringFill(charge);
    btnBody.style.setProperty('--charge-s', charge.toFixed(3));
    halo.style.opacity = (.45 + charge * .55).toFixed(3);
    chargeRAF = requestAnimationFrame(tickCharge);
  }
  function release() {
    if (!charging) return;
    charging = false;
    cancelAnimationFrame(chargeRAF);
    btn.classList.remove('pressed');
    const c = charge;
    charge = 0;
    ringFill(0);
    btnBody.style.setProperty('--charge-s', '0');
    halo.style.opacity = '.5';

    const pos = getBtnPos();
    spawnBurst(pos.x, pos.y, c);
    playPop(c);

    pops++;
    countEl.textContent = pops;
    unitEl.textContent = pops === 1 ? 'pop' : 'pops';
    if (bumpAnim) bumpAnim.cancel();
    bumpAnim = countEl.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.32)', offset: .3 }, { transform: 'scale(.92)', offset: .68 }, { transform: 'scale(1)' }],
      { duration: 400, easing: 'ease-out' }
    );

    if (popAnim) popAnim.cancel();
    popAnim = btnBody.animate(
      [
        { transform: 'translateY(8px) scale(1)' },
        { transform: 'translateY(-8px) scale(1.08)', offset: .34 },
        { transform: 'translateY(2px) scale(.97)', offset: .7 },
        { transform: 'translateY(0) scale(1)' },
      ],
      { duration: 440, easing: 'cubic-bezier(.34,1.56,.64,1)' }
    );

    setHint(BURSTS[pops % BURSTS.length]);
    scheduleIdleHint();
    if (c > .5) shake(2 + c * 5);
    activeSource = null;
  }
  function shake(px) {
    scene.animate(
      [
        { transform: 'translate(0,0)' },
        { transform: `translate(${-px}px, ${px * .5}px)`, offset: .18 },
        { transform: `translate(${px * .8}px, ${-px * .4}px)`, offset: .4 },
        { transform: `translate(${-px * .55}px, ${px * .3}px)`, offset: .62 },
        { transform: `translate(${px * .3}px, ${-px * .2}px)`, offset: .82 },
        { transform: 'translate(0,0)' },
      ],
      { duration: 400, easing: 'ease-out' }
    );
  }

  // ---------- events ----------
  btn.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (activeSource) return;
    e.preventDefault();
    ensureAudio();
    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    activeSource = 'pointer';
    press(performance.now());
  });
  const finishPointer = () => { if (activeSource === 'pointer') release(); };
  btn.addEventListener('pointerup', finishPointer);
  btn.addEventListener('pointercancel', finishPointer);
  btn.addEventListener('lostpointercapture', finishPointer);

  btn.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (activeSource) return;
    e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    activeSource = 'key';
    press(performance.now());
  });
  btn.addEventListener('keyup', e => {
    if ((e.key === ' ' || e.key === 'Enter') && activeSource === 'key') release();
  });
  btn.addEventListener('contextmenu', e => e.preventDefault());

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteOn.style.display = muted ? 'none' : 'block';
    muteOff.style.display = muted ? 'block' : 'none';
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  });

  // ---------- render loop ----------
  function frame() {
    for (const d of dust) {
      d.x += d.vx; d.y += d.vy; d.tw += d.tws * .016;
      if (d.y < -12) { d.y = H + 12; d.x = Math.random() * W; }
      if (d.x < -12) d.x = W + 12; else if (d.x > W + 12) d.x = -12;
    }
    if (charging) {
      const pos = getBtnPos();
      const n = Math.round(1 + charge * 4);
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = .6 + Math.random() * 1.6 + charge * 1.6;
        particles.push({
          x: pos.x + (Math.random() - .5) * 80,
          y: pos.y + (Math.random() - .5) * 80,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - .9,
          r: 1.4 + Math.random() * 2.4,
          color: Math.random() < .5 ? '#ffd166' : '#ff6b6b',
          life: 1, decay: .028 + Math.random() * .03,
          drag: .962, grav: .07, rot: 0, vrot: 0, shape: 'dot',
        });
      }
      if (particles.length > 500) particles.splice(0, particles.length - 500);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.grav;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vrot;
    }
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.life -= w.decay;
      w.r += (w.max - w.r) * .12 + 1.4;
      if (w.life <= 0) waves.splice(i, 1);
    }
    ctx.clearRect(0, 0, W, H);
    for (const d of dust) {
      const a = d.a * (.55 + .45 * Math.sin(d.tw));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(a, 0).toFixed(3)})`;
      ctx.fill();
    }
    for (const w of waves) {
      ctx.beginPath();
      ctx.arc(w.x, w.y, Math.max(w.r, 0), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(w.life, 0).toFixed(3)})`;
      ctx.lineWidth = Math.max(w.width * w.life, .5);
      ctx.stroke();
    }
    for (const p of particles) {
      const a = Math.max(p.life, 0);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      if (p.shape === 'spark') {
        ctx.rotate(p.rot);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        const len = p.r * 2.4;
        ctx.beginPath();
        ctx.moveTo(-len, 0); ctx.lineTo(len, 0);
        ctx.stroke();
      } else if (p.shape === 'rect') {
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        const s = p.r * 1.6;
        ctx.fillRect(-s / 2, -s / 2, s, s);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
