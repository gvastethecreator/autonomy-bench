<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NodeForge — Visual Node Editor</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel-2:#1a2029; --line:#262d38;
    --text:#dbe2ec; --dim:#8b95a7; --faint:#5d6675;
    --blue:#60a5fa; --glow:rgba(96,165,250,.35);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #app{ display:grid; height:100vh; grid-template-rows:48px 1fr 26px; grid-template-columns:200px 1fr 252px;
        grid-template-areas:"head head head" "pal main insp" "foot foot foot"; }

  /* ---------- header ---------- */
  .app-header{ grid-area:head; display:flex; align-items:center; gap:10px; padding:0 14px;
    background:linear-gradient(180deg,#171d26,#12161d); border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; font-size:14px; }
  .brand .logo{ width:22px; height:22px; border-radius:6px;
    background:conic-gradient(from 210deg,#60a5fa,#a78bfa,#f472b6,#60a5fa);
    box-shadow:0 0 12px var(--glow); }
  .brand small{ color:var(--faint); font-weight:500; margin-left:2px; }
  .hdr-spacer{ flex:1; }
  .btn{ border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:7px;
    padding:5px 12px; font-size:12px; cursor:pointer; transition:.12s; }
  .btn:hover{ background:#222a36; border-color:#39424f; }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:#2563eb; border-color:#3b82f6; color:#fff; font-weight:600; }
  .btn.primary:hover{ background:#1d4ed8; }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* ---------- panes ---------- */
  .pane{ background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #palette{ grid-area:pal; }
  #inspector{ grid-area:insp; border-right:none; border-left:1px solid var(--line); }
  .pane-title{ font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--faint);
    padding:12px 12px 8px; display:flex; justify-content:space-between; align-items:center; }
  .pane-body{ overflow-y:auto; padding:0 10px 12px; flex:1; }

  /* ---------- palette ---------- */
  .pal-group{ margin-bottom:12px; }
  .pal-group h4{ font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); margin:0 4px 6px; }
  .pal-item{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px;
    border:1px solid transparent; cursor:pointer; transition:.12s; }
  .pal-item:hover{ background:var(--panel-2); border-color:var(--line); }
  .pal-item:active{ transform:scale(.97); }
  .pal-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; border:2px solid rgba(0,0,0,.45); }
  .pal-item .nm{ font-weight:600; font-size:12px; }
  .pal-item .dc{ color:var(--faint); font-size:10.5px; margin-top:1px; }

  /* ---------- viewport ---------- */
  #view{ grid-area:main; position:relative; overflow:hidden; background:var(--bg); touch-action:none; cursor:default; }
  #grid{ position:absolute; inset:0; z-index:0; }
  #scene{ position:absolute; top:0; left:0; z-index:1; transform-origin:0 0; will-change:transform; }
  #edgeLayer{ position:absolute; top:0; left:0; z-index:1; overflow:visible; pointer-events:none; }
  #edgeLayer path.edge{ pointer-events:none; }
  #edgeLayer path.edge.hit{ pointer-events:stroke; cursor:pointer; }
  #nodeLayer{ position:absolute; top:0; left:0; z-index:2; }

  /* ---------- nodes ---------- */
  .node{ position:absolute; width:172px; background:linear-gradient(180deg,#1d232d,#191f28);
    border:1px solid #2a323e; border-radius:12px; padding-bottom:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    cursor:grab; animation:pop .16s ease-out; }
  .node:active{ cursor:grabbing; }
  .node.sel{ border-color:var(--ac,var(--blue)); box-shadow:0 0 0 1px var(--ac,var(--blue)), 0 6px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04); }
  @keyframes pop{ from{ transform:scale(.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .n-head{ display:flex; align-items:center; gap:6px; height:34px; padding:0 10px; border-radius:11px 11px 0 0;
    background:rgba(96,165,250,.10);
    background:linear-gradient(90deg, color-mix(in srgb, var(--ac,#60a5fa) 22%, transparent), transparent 72%); }
  .n-accent{ width:4px; height:18px; border-radius:3px; background:var(--ac,#60a5fa); flex:0 0 auto; }
  .n-title{ font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .n-tag{ font-size:9px; color:var(--faint); letter-spacing:.6px; text-transform:uppercase; }
  .chip{ margin-left:auto; font:600 10px/1.2 ui-monospace,Consolas,monospace; color:#cfe; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08); padding:2px 6px; border-radius:6px; min-width:22px; text-align:center; }
  .chip.hi{ background:rgba(96,165,250,.18); border-color:rgba(96,165,250,.4); }
  .chip.err{ color:#fca5a5; background:rgba(239,68,68,.16); border-color:rgba(239,68,68,.45); }
  .num-input{ width:64px; font:600 11px ui-monospace,Consolas,monospace; color:var(--text);
    background:#10141b; border:1px solid #333c4a; border-radius:6px; padding:3px 6px; outline:none;
    text-align:right; user-select:text; -webkit-user-select:text; }
  .num-input:focus{ border-color:var(--ac,#60a5fa); box-shadow:0 0 0 2px var(--ac,var(--glow)); }
  .row{ position:relative; height:22px; display:flex; align-items:center; }
  .row .label{ flex:1; font-size:11px; color:var(--dim); padding:0 14px; font-weight:600; letter-spacing:.2px; }
  .row.out .label{ text-align:right; }
  .row .label small{ color:var(--faint); font-weight:500; }
  .port{ position:absolute; top:50%; width:12px; height:12px; border-radius:50%;
    background:var(--ac,#60a5fa); border:2px solid #0f1216; transform:translateY(-50%);
    cursor:crosshair; transition:transform .1s; z-index:3; }
  .row.in .port{ left:-7px; }
  .row.out .port{ right:-7px; }
  .port:hover{ transform:translateY(-50%) scale(1.35); }
  .port.hl{ box-shadow:0 0 0 3px rgba(255,255,255,.25); transform:translateY(-50%) scale(1.45); }

  /* ---------- edges ---------- */
  .edge{ fill:none; stroke:rgba(96,165,250,.6); stroke-width:2.2; stroke-linecap:round; }
  #edgeLayer g{ pointer-events:none; }
  .edge.hit{ stroke:transparent; stroke-width:12; }
  .edge.sel{ stroke:#ffd54d; stroke-width:3; filter:drop-shadow(0 0 3px rgba(255,213,77,.6)); }
  .edge.err{ stroke:rgba(239,68,68,.7); }
  .edge.pulse{ animation:flow 1.1s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-22; } }
  #tempEdge{ fill:none; stroke:rgba(96,165,250,.9); stroke-width:2.4; stroke-dasharray:6 4; pointer-events:none; }

  /* ---------- minimap ---------- */
  #miniWrap{ position:absolute; right:16px; bottom:16px; z-index:6; width:190px; height:118px;
    border:1px solid var(--line); border-radius:9px; background:rgba(10,13,17,.82);
    backdrop-filter:blur(3px); overflow:hidden; box-shadow:0 6px 16px rgba(0,0,0,.4); cursor:crosshair; }
  #minimap{ width:100%; height:100%; display:block; }

  /* ---------- hint ---------- */
  .hint{ position:absolute; left:14px; bottom:14px; z-index:6; font-size:11px; color:var(--faint); pointer-events:none; }
  .kbd{ display:inline-block; background:#20262f; border:1px solid #3a424f; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; font-size:10px; font-family:ui-monospace,Consolas,monospace; color:var(--dim); }

  /* ---------- inspector ---------- */
  #inspector .pane-body{ padding-bottom:20px; }
  .sec{ margin-bottom:16px; }
  .sec h3{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); margin-bottom:8px; }
  .card{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card h4{ font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .card .dot{ width:9px; height:9px; border-radius:50%; background:var(--ac,#60a5fa); }
  .kv{ display:flex; justify-content:space-between; gap:8px; font-size:11px; padding:3px 0; }
  .kv b{ color:var(--dim); font-weight:600; }
  .kv span{ font-family:ui-monospace,Consolas,monospace; color:var(--text); text-align:right; word-break:break-all; }
  .bigval{ font:700 26px/1.2 ui-monospace,Consolas,monospace; color:#7dd3fc; margin:6px 0 2px; }
  .bigval.muted{ color:var(--faint); font-size:18px; }
  .sect-label{ font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); margin:10px 0 5px; }
  .btn-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .btn-row .btn{ flex:1; padding:6px 8px; font-size:11px; }
  .statline{ font-size:11px; color:var(--dim); line-height:1.6; }
  .statline b{ color:var(--text); }
  .ok{ color:#4ade80; } .bad{ color:#f87171; }
  .dash{ border-top:1px dashed var(--line); margin:8px 0; }

  /* ---------- context menu ---------- */
  #menu{ position:fixed; z-index:50; min-width:180px; background:#1a2029; border:1px solid var(--line);
    border-radius:10px; padding:5px; box-shadow:0 12px 30px rgba(0,0,0,.55); animation:pop .1s ease-out;
    max-height:70vh; overflow-y:auto; }
  .menu-title{ font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--faint); padding:6px 8px 4px; }
  .menu-item{ display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:7px; font-size:12px; cursor:pointer; }
  .menu-item:hover{ background:#242c38; }
  .menu-item .pal-dot{ width:9px; height:9px; }
  .menu-item.danger{ color:#f87171; } .menu-item.danger:hover{ background:rgba(239,68,68,.14); }
  .menu-sep{ height:1px; background:var(--line); margin:4px 6px; }

  /* ---------- toast ---------- */
  #toast{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); z-index:60;
    background:#20262f; color:var(--text); border:1px solid var(--line); padding:8px 16px; border-radius:9px;
    font-size:12px; opacity:0; pointer-events:none; transition:.25s; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- footer ---------- */
  .app-footer{ grid-area:foot; display:flex; align-items:center; gap:14px; padding:0 12px;
    font-size:11px; color:var(--faint); background:var(--panel); border-top:1px solid var(--line); }
  .app-footer .sep{ color:#2e3642; }
  #statusEval{ margin-left:auto; }
  #savedDot{ width:7px; height:7px; border-radius:50%; background:#4ade80; display:inline-block; margin-right:5px; }

  ::-webkit-scrollbar{ width:9px; } 
  ::-webkit-scrollbar-thumb{ background:#2b333f; border-radius:6px; border:2px solid var(--panel); }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="brand"><div class="logo"></div>NodeForge <small>visual node editor</small></div>
    <div class="hdr-spacer"></div>
    <button class="btn primary" id="btnRun">▶ Run</button>
    <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <button class="btn" id="btnExport" title="Download graph as JSON">⤓ Export</button>
    <button class="btn" id="btnImport" title="Load a graph JSON file">⤒ Import</button>
    <button class="btn" id="btnReset" title="Reset graph">✕ Reset</button>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
  </header>

  <aside class="pane" id="palette">
    <div class="pane-title">Node Library <span>click to add</span></div>
    <div class="pane-body" id="palBody"></div>
  </aside>

  <main id="view">
    <canvas id="grid"></canvas>
    <div id="scene">
      <svg id="edgeLayer" xmlns="http://www.w3.org/2000/svg" width="20000" height="20000"></svg>
      <div id="nodeLayer"></div>
    </div>
    <div class="hint">
      Drag ports to connect &nbsp;·&nbsp; <span class="kbd">Wheel</span> zoom &nbsp;·&nbsp; drag empty space to pan &nbsp;·&nbsp;
      <span class="kbd">Del</span> delete &nbsp;·&nbsp; right-click / double-click for node menu
    </div>
    <div id="miniWrap"><canvas id="minimap"></canvas></div>
  </main>

  <aside class="pane" id="inspector">
    <div class="pane-title">Inspector</div>
    <div class="pane-body" id="inspBody"></div>
  </aside>

  <footer class="app-footer">
    <span id="statusCounts">0 nodes · 0 edges</span>
    <span class="sep">|</span>
    <span>zoom <span id="statusZoom">100%</span></span>
    <span class="sep">|</span>
    <span id="statusEval">no evaluation yet</span>
    <div style="flex:1"></div>
    <span id="statusSaved"><span id="savedDot"></span>auto-saved</span>
  </footer>
</div>

<div id="menu" hidden></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   NodeForge — a dependency-free visual node editor (single file)
   Types: number / arithmetic / unary math / mix & clamp / output
   ============================================================ */

const $$ = (s, r) => (r || document).querySelectorAll(s);
const $ = (s, r) => (r || document).querySelector(s);

const fmt = v => (v === null || v === undefined) ? "—" : (Math.abs(v) >= 1e9 || (Math.abs(v) < 1e-4 && v !== 0))
  ? v.toExponential(3) : (Math.round(v * 10000) / 10000).toLocaleString("en-US", { maximumFractionDigits: 4 });

/* ---------------- node type registry ---------------- */
const NODE_TYPES = {
  number : { label:"Number",  tag:"input",  color:"#60a5fa", inputs:[],              outputs:["val"],
             blurb:"Constant numeric value.", init:{ value:2 },
             eval:(d) => d.data.value },
  add    : { label:"Add",     tag:"math",   color:"#34d399", inputs:["A","B"],       outputs:["Out"],
             blurb:"A + B", init:{},
             eval:(d) => d.inputs[0] + d.inputs[1] },
  sub    : { label:"Subtract",tag:"math",   color:"#34d399", inputs:["A","B"],       outputs:["Out"],
             blurb:"A − B",   init:{},
             eval:(d) => d.inputs[0] - d.inputs[1] },
  mul    : { label:"Multiply",tag:"math",   color:"#34d399", inputs:["A","B"],       outputs:["Out"],
             blurb:"A × B",   init:{},
             eval:(d) => d.inputs[0] * d.inputs[1] },
  div     : { label:"Divide", tag:"math",   color:"#34d399", inputs:["A","B"],       outputs:["Out"],
             blurb:"A ÷ B",   init:{},
             eval:(d) => d.inputs[1] === 0 ? err() : d.inputs[0] / d.inputs[1] },
  pow    : { label:"Pow",     tag:"math",   color:"#34d399", inputs:["x","y"],       outputs:["Out"],
             blurb:"x ^ y",   init:{},
             eval:(d) => Math.pow(d.inputs[0], d.inputs[1]) },
  min    : { label:"Min",     tag:"math",   color:"#2dd4bf", inputs:["A","B"],       outputs:["Out"],
             blurb:"Smaller of A and B", init:{},
             eval:(d) => Math.min(d.inputs[0], d.inputs[1]) },
  max    : { label:"Max",     tag:"math",   color:"#2dd4bf", inputs:["A","B"],       outputs:["Out"],
             blurb:"Larger of A and B", init:{},
             eval:(d) => Math.max(d.inputs[0], d.inputs[1]) },
  negate : { label:"Negate",  tag:"unary",  color:"#a78bfa", inputs:["x"],           outputs:["Out"],
             blurb:"−x",      init:{},
             eval:(d) => -d.inputs[0] },
  abs    : { label:"Abs",     tag:"unary",  color:"#a78bfa", inputs:["x"],           outputs:["Out"],
             blurb:"|x|",     init:{},
             eval:(d) => Math.abs(d.inputs[0]) },
  sin    : { label:"Sin",     tag:"unary",  color:"#a78bfa", inputs:["x"],           outputs:["Out"],
             blurb:"sin(x) — radians", init:{},
             eval:(d) => Math.sin(d.inputs[0]) },
  cos    : { label:"Cos",     tag:"unary",  color:"#a78bfa", inputs:["x"],           outputs:["Out"],
             blurb:"cos(x) — radians", init:{},
             eval:(d) => Math.cos(d.inputs[0]) },
  sqrt   : { label:"Sqrt",    tag:"unary",  color:"#a78bfa", inputs:["x"],           outputs:["Out"],
             blurb:"√x — x must be ≥ 0", init:{},
             eval:(d) => d.inputs[0] < 0 ? err() : Math.sqrt(d.inputs[0]) },
  exp    : { label:"Exp",     tag:"unary",  color:"#a78bfa", inputs:["x"],           outputs:["Out"],
             blurb:"e ^ x",   init:{},
             eval:(d) => Math.exp(d.inputs[0]) },
  mix    : { label:"Mix",     tag:"blend",  color:"#f472b6", inputs:["A","B","T"],   outputs:["Out"],
             blurb:"A·(1−T) + B·T", init:{},
             eval:(d) => d.inputs[0] * (1 - d.inputs[2]) + d.inputs[1] * d.inputs[2] },
  clamp  : { label:"Clamp",   tag:"blend",  color:"#f472b6", inputs:["V","Lo","Hi"], outputs:["Out"],
             blurb:"Clamp V between Lo and Hi", init:{},
             eval:(d) => Math.max(d.inputs[1], Math.min(d.inputs[2], d.inputs[0])) },
  output : { label:"Result",  tag:"output", color:"#fbbf24", inputs:["in"],          outputs:[],
             blurb:"Displays the final value.", init:{},
             eval:(d) => d.connected[0] ? d.inputs[0] : null },
};

function err(){ throw new Error("math error"); }

/* ---------------- state ---------------- */
const SAVE_KEY = "nodeforge.graph.v1";
const state = {
  nodes:{}, edges:{}, order:[],
  pan:{ x:140, y:90 }, zoom:1,
  sel:null, runStamp:0, nextId:1, evalMs:0, evalOk:true
};
let undoStack = [], redoStack = [];
let conn = null, menuEl = null, toastTimer = null;

/* sample starter graph */
function defaultGraph(){
  const s = { nextId:1, nodes:{}, edges:{} };
  const mk = (t, x, y, data) => { const id = String(s.nextId++); s.nodes[id] = { id, type:t, x, y, data:JSON.parse(JSON.stringify(data || NODE_TYPES[t].init || {})) }; return id; };
  const a = mk("number", 40, 90, { value:3 });
  const b = mk("number", 40, 210, { value:5 });
  const add = mk("add", 280, 130);
  const mul = mk("mul", 520, 130);
  const out = mk("output", 760, 130);
  s.edges = {
    e1:{ id:"e1", from:{ node:a, port:0 }, to:{ node:add, port:0 } },
    e2:{ id:"e2", from:{ node:b, port:0 }, to:{ node:add, port:1 } },
    e3:{ id:"e3", from:{ node:add, port:0 }, to:{ node:mul, port:0 } },
    e4:{ id:"e4", from:{ node:b, port:0 }, to:{ node:mul, port:1 } },
    e5:{ id:"e5", from:{ node:mul, port:0 }, to:{ node:out, port:0 } },
  };
  s.nextId = 100;
  return s;
}
function freshState(){ const s = defaultGraph(); state.nodes=s.nodes; state.edges=s.edges; state.nextId=s.nextId; }

/* ---------------- serialization / persistence ---------------- */
function serialize(){
  return JSON.stringify({
    version:1, nextId:state.nextId, pan:state.pan, zoom:state.zoom,
    nodes:Object.values(state.nodes).map(n => ({ id:n.id, type:n.type, x:n.x, y:n.y, data:n.data })),
    edges:Object.values(state.edges),
  });
}
function deserialize(json){
  let p; try { p = JSON.parse(json); } catch(e){ return false; }
  if (!p || !Array.isArray(p.nodes)) return false;
  state.nodes = {}; state.edges = {}; state.nextId = p.nextId || 1000;
  for (const raw of p.nodes){
    if (!raw || !NODE_TYPES[raw.type]) continue;
    const n = { id:String(raw.id), type:raw.type, x:num(raw.x, 0), y:num(raw.y, 0),
                data:JSON.parse(JSON.stringify(raw.data || {})) };
    const init = NODE_TYPES[n.type].init || {};
    for (const k in init) if (n.data[k] === undefined) n.data[k] = init[k];
    state.nodes[n.id] = n;
    if (num(raw.id,0) >= state.nextId) state.nextId = num(raw.id,0) + 1;
  }
  if (Array.isArray(p.edges)) for (const e of p.edges){
    if (!e || !state.nodes[e.from && e.from.node] || !state.nodes[e.to && e.to.node]) continue;
    state.edges[e.id || "e" + state.nextId++] = e;
  }
  if (p.pan) state.pan = { x:num(p.pan.x,0), y:num(p.pan.y,0) };
  if (p.zoom) state.zoom = clamp(num(p.zoom,1), .25, 2.5);
  return true;
}
function num(v, d){ const n = parseFloat(v); return isFinite(n) ? n : d; }
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function autosave(){ try { localStorage.setItem(SAVE_KEY, serialize()); } catch(e){} }
function loadSaved(){
  let loaded = false;
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw && deserialize(raw)) loaded = true; } catch(e){}
  if (!loaded) freshState();
}

/* ---------------- undo / redo ---------------- */
function snapshot(){ return serialize(); }
function mutate(fn, opts){
  opts = opts || {};
  undoStack.push(snapshot());
  if (undoStack.length > 120) undoStack.shift();
  redoStack = [];
  fn();
  afterChange(opts);
}
function afterChange(opts){
  evaluate();
  render(opts);
  renderInspector();
  updateStatus();
  autosave();
  syncButtons();
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  const s = undoStack.pop();
  deserialize(s);
  state.sel = null;
  afterChange({ rebuild:true });
  applyViewport();
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  const s = redoStack.pop();
  deserialize(s);
  state.sel = null;
  afterChange({ rebuild:true });
  applyViewport();
}
function syncButtons(){
  $("#btnUndo").disabled = !undoStack.length;
  $("#btnRedo").disabled = !redoStack.length;
}

/* ---------------- graph ops ---------------- */
function addNode(type, x, y){
  mutate(() => {
    const init = JSON.parse(JSON.stringify(NODE_TYPES[type].init || {}));
    const n = { id:String(state.nextId++), type, x:Math.round(x), y:Math.round(y), data:init };
    state.nodes[n.id] = n;
    state.sel = { kind:"node", id:n.id };
  });
}
function deleteNode(id){
  mutate(() => {
    for (const eid in state.edges){
      const e = state.edges[eid];
      if (e.from.node === id || e.to.node === id) delete state.edges[eid];
    }
    delete state.nodes[id];
    state.sel = null;
  });
}
function duplicateNode(id){
  const src = state.nodes[id];
  if (!src) return;
  mutate(() => {
    const n = { id:String(state.nextId++), type:src.type, x:src.x + 28, y:src.y + 28,
                data:JSON.parse(JSON.stringify(src.data)) };
    state.nodes[n.id] = n;
    state.sel = { kind:"node", id:n.id };
  });
}
/* from & to are {node, port}; from is an output side, to an input side */
function connect(from, to){
  if (!from || !to || from.node === to.node) return;
  mutate(() => {
    // replace existing wire targeting the same input
    for (const eid in state.edges){
      const e = state.edges[eid];
      if (e.to.node === to.node && e.to.port === to.port) delete state.edges[eid];
    }
    const id = "e" + state.nextId++;
    state.edges[id] = { id, from:{ node:from.node, port:from.port }, to:{ node:to.node, port:to.port } };
    state.sel = { kind:"edge", id };
  });
}
function deleteEdge(id){
  mutate(() => { delete state.edges[id]; state.sel = null; });
}
function setNumber(id, value){
  const n = state.nodes[id];
  if (!n) return;
  const v = parseFloat(value);
  n.data.value = isFinite(v) ? v : 0;
  mutate(() => {}, { rebuild:false });
}

/* ---------------- evaluation ---------------- */
function evaluate(){
  const t0 = performance.now();
  const nodeIds = Object.keys(state.nodes);
  const indeg = {}, out = {};
  for (const id of nodeIds){ indeg[id] = 0; out[id] = []; }
  for (const e of Object.values(state.edges)){
    if (e.from.node === e.to.node) continue;
    out[e.from.node].push(e);
    if (e.from.node in indeg) indeg[e.to.node] = (indeg[e.to.node] || 0) + 1;
  }
  const q = nodeIds.filter(id => indeg[id] === 0);
  const order = [];
  while (q.length){
    const id = q.shift();
    order.push(id);
    const inc = indeg[id] || 0;
    for (const e of out[id]){
      indeg[e.to.node] = (indeg[e.to.node] || 0) - 1;
      if ((indeg[e.to.node]) === 0) q.push(e.to.node);
    }
  }
  state.order = order;
  const inCycle = new Set(nodeIds.filter(id => !order.includes(id)));
  let anyErr = false;

  const vals = {};
  for (const id of order){
    const n = state.nodes[id];
    const t = NODE_TYPES[n.type];
    const inputs = [], connected = [];
    for (let i = 0; i < t.inputs.length; i++){
      let found = null;
      for (const e of Object.values(state.edges))
        if (e.to.node === id && e.to.port === i){ found = e; break; }
      connected.push(!!found);
      inputs.push(found && vals[found.from.node] !== undefined ? vals[found.from.node] : 0);
    }
    n.data.error = inCycle.has(id) ? "loop" : n.data.error;
    try {
      const r = t.eval({ inputs, connected, data: n.data, nodeId:id });
      if (r === null || r === undefined || !isFinite(r)){
        if (r === null){ n.data.result = null; n.data.error = false; }
        else { n.data.result = null; n.data.error = "err"; anyErr = true; }
      } else {
        n.data.result = r; n.data.error = false;
      }
    } catch(e){
      n.data.result = null;
      n.data.error = n.data.error === "loop" ? "loop" : "err";
      anyErr = true;
    }
    vals[id] = n.data.result;
  }
  for (const id of inCycle){ const n = state.nodes[id]; n.data.result = null; n.data.error = "loop"; anyErr = true; }
  state.evalOk = !anyErr;
  state.evalMs = performance.now() - t0;
}

/* ---------------- rendering ---------------- */
const NODE_W = 172, HEAD_H = 34, ROW_H = 22;
function portWorld(node, side, idx){
  const t = NODE_TYPES[node.type];
  const y = HEAD_H + idx * ROW_H + ROW_H / 2;
  return { x: node.x + (side === "in" ? 2 : NODE_W - 2), y: node.y + y };
}

function buildNode(n){
  const t = NODE_TYPES[n.type];
  const el = document.createElement("div");
  el.className = "node" + (state.sel && state.sel.kind === "node" && state.sel.id === n.id ? " sel" : "");
  el.dataset.id = n.id;
  el.style.left = n.x + "px";
  el.style.top = n.y + "px";
  el.style.setProperty("--ac", t.color);

  let head = `<div class="n-head"><div class="n-accent"></div><div class="n-title">${t.label}</div><div class="n-tag">${t.tag}</div>`;
  if (n.type === "number"){
    head += `<input class="num-input" value="${num(n.data.value, 0)}" spellcheck="false">`;
  } else {
    head += `<span class="chip" data-chip="${n.id}"></span>`;
  }
  head += `</div>`;
  let rows = "";
  t.inputs.forEach((nm, i) => {
    rows += `<div class="row in"><span class="label"><small>▸</small>&nbsp;${nm}</span><span class="port" data-side="in" data-idx="${i}"></span></div>`;
  });
  t.outputs.forEach((nm, i) => {
    rows += `<div class="row out"><span class="label">${nm}&nbsp;<small>◂</small></span><span class="port" data-side="out" data-idx="${i}"></span></div>`;
  });
  el.innerHTML = head + rows;

  /* number input live edit */
  const inp = el.querySelector(".num-input");
  if (inp){
    inp.addEventListener("pointerdown", e => e.stopPropagation());
    inp.addEventListener("dblclick", e => e.stopPropagation());
    inp.addEventListener("change", () => setNumber(n.id, inp.value));
  }
  /* ports handle connections */
  el.querySelectorAll(".port").forEach(port => {
    port.style.setProperty("--ac", t.color);
    port.addEventListener("pointerdown", e => startConnection(e, port, n.id));
  });
  /* node drag + select */
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    select({ kind:"node", id:n.id });
    startNodeDrag(e, n.id);
  });
  el.addEventListener("contextmenu", e => {
    e.preventDefault(); e.stopPropagation();
    openMenu(e.clientX, e.clientY, [
      { label:"Duplicate", fn:() => duplicateNode(n.id) },
      { label:"Delete node", danger:true, fn:() => deleteNode(n.id) },
    ], "Node · " + t.label);
  });
  el.addEventListener("dblclick", e => e.stopPropagation());
  return el;
}

function render(opts){
  opts = opts || { rebuild:true };
  if (opts.rebuild !== false){
    const layer = $("#nodeLayer");
    layer.innerHTML = "";
    for (const n of Object.values(state.nodes)){
      layer.appendChild(buildNode(n));
    }
  }
  updateChips();
  layoutEdges();
  requestMap();
}

function updateChips(){
  $$(".chip[data-chip]").forEach(ch => {
    const n = state.nodes[ch.dataset.chip];
    if (!n) return;
    ch.className = "chip";
    if (n.type === "number"){ ch.textContent = fmt(n.data.value); ch.classList.add("hi"); return; }
    if (n.data.error === "loop"){ ch.textContent = "loop"; ch.classList.add("err"); return; }
    if (n.data.error === "err"){ ch.textContent = "err"; ch.classList.add("err"); return; }
    if (n.data.result === null || n.data.result === undefined){ ch.textContent = "—"; return; }
    ch.textContent = fmt(n.data.result);
    ch.classList.add("hi");
  });
}

function edgePath(from, to){
  const dx = Math.max(40, Math.min(170, Math.abs(to.x - from.x) * .45));
  return `M ${from.x} ${from.y} C ${from.x + dx} ${from.y}, ${to.x - dx} ${to.y}, ${to.x} ${to.y}`;
}

function layoutEdges(){
  const svg = $("#edgeLayer");
  let html = "";
  for (const e of Object.values(state.edges)){
    const a = state.nodes[e.from.node], b = state.nodes[e.to.node];
    if (!a || !b) continue;
    const pa = portWorld(a, "out", e.from.port);
    const pb = portWorld(b, "in", e.to.port);
    const d = edgePath(pa, pb);
    const sel = state.sel && state.sel.kind === "edge" && state.sel.id === e.id;
    const srcErr = a.data.error === "err" || a.data.error === "loop";
    let cls = "edge" + (sel ? " sel" : "") + (srcErr ? " err" : "");
    if (state.runStamp && state.runStamp === e.__run) cls += " pulse";
    html += `<g data-rid="${e.id}">
      <path class="edge hit ${sel?"sel":""}" d="${d}"/>
      <path class="${cls}" d="${d}"/>
    </g>`;
  }
  svg.innerHTML = html;
  svg.querySelectorAll("g").forEach(g => {
    g.addEventListener("pointerdown", ev => {
      ev.preventDefault(); ev.stopPropagation();
      select({ kind:"edge", id:g.dataset.rid });
    });
    g.addEventListener("contextmenu", ev => {
      ev.preventDefault(); ev.stopPropagation();
      const id = g.dataset.rid;
      openMenu(ev.clientX, ev.clientY, [
        { label:"Delete wire", danger:true, fn:() => deleteEdge(id) },
      ], "Wire");
    });
  });
  let t = $("#tempEdge");
  if (conn){
    if (!t){
      t = document.createElementNS("http://www.w3.org/2000/svg", "path");
      t.id = "tempEdge";
      svg.appendChild(t);
    }
    if (conn.path){
      t.setAttribute("d", conn.path);
      t.setAttribute("visibility", "visible");
    } else {
      t.setAttribute("visibility", "hidden");
    }
  } else if (t){
    t.setAttribute("visibility", "hidden");
  }
}

function select(sel){
  state.sel = sel;
  // apply selection classes to node layer (cheap, no rebuild)
  $$("#nodeLayer .node").forEach(el => {
    const on = sel && sel.kind === "node" && el.dataset.id === sel.id;
    el.classList.toggle("sel", !!on);
  });
  layoutEdges();
  renderInspector();
}

/* ---------------- interactions: pan / zoom ---------------- */
const view = $("#view"), scene = $("#scene"), nodeLayer = $("#nodeLayer");
let panning = null;

function applyViewport(){
  scene.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
  $("#statusZoom").textContent = Math.round(state.zoom * 100) + "%";
  requestGrid(); requestMap();
}
function screenToWorld(cx, cy){
  const r = view.getBoundingClientRect();
  return { x:(cx - r.left - state.pan.x)/state.zoom, y:(cy - r.top - state.pan.y)/state.zoom };
}
function worldPos(el){
  const nb = nodeLayer.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x:((r.left - nb.left) + r.width/2)/state.zoom, y:((r.top - nb.top) + r.height/2)/state.zoom };
}

view.addEventListener("pointerdown", e => {
  if (e.target === view || e.target.id === "grid"){
    select(null);
    if (e.button === 0 || e.button === 1){
      panning = { sx:e.clientX, sy:e.clientY, px:state.pan.x, py:state.pan.y };
      e.preventDefault();
    }
  }
});
window.addEventListener("pointermove", e => {
  if (panning){
    state.pan.x = panning.px + (e.clientX - panning.sx);
    state.pan.y = panning.py + (e.clientY - panning.sy);
    applyViewport();
  }
  if (conn){
    connMove(e.clientX, e.clientY);
  }
});
window.addEventListener("pointerup", e => {
  if (panning){ panning = null; }
  if (conn){ connUp(e); }
});
view.addEventListener("wheel", e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const wb = { x:(mx - state.pan.x)/state.zoom, y:(my - state.pan.y)/state.zoom };
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  state.zoom = clamp(state.zoom * factor, .25, 2.5);
  state.pan.x = mx - wb.x * state.zoom;
  state.pan.y = my - wb.y * state.zoom;
  applyViewport();
}, { passive:false });

function startNodeDrag(e, id){
  const start = { x:e.clientX, y:e.clientY, nx:state.nodes[id].x, ny:state.nodes[id].y };
  undoStack.push(snapshot());
  if (undoStack.length > 120) undoStack.shift();
  redoStack = [];
  const nodeEl = nodeLayer.querySelector(`.node[data-id="${id}"]`);
  const move = ev => {
    const dx = (ev.clientX - start.x)/state.zoom, dy = (ev.clientY - start.y)/state.zoom;
    state.nodes[id].x = start.nx + dx;
    state.nodes[id].y = start.ny + dy;
    nodeEl.style.left = state.nodes[id].x + "px";
    nodeEl.style.top  = state.nodes[id].y + "px";
    layoutEdges();
    requestMap();
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    autosave(); syncButtons();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

/* ---------------- connections ---------------- */
function startConnection(e, portEl, nodeId){
  e.stopPropagation(); e.preventDefault();
  const side = portEl.dataset.side, idx = +portEl.dataset.idx;
  conn = {
    from:{ node:nodeId, side, idx },
    p0: worldPos(portEl),
  };
  select(null);
  const svg = $("#edgeLayer");
  if (!$("#tempEdge")){
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.id = "tempEdge"; svg.appendChild(p);
  }
  const t = $("#tempEdge");
  t.setAttribute("visibility", "visible");
  t.setAttribute("d", edgePath(conn.p0, { x:conn.p0.x + 10, y:conn.p0.y }));
}
function connMove(cx, cy){
  conn.mx = cx; conn.my = cy;
  const w = screenToWorld(cx, cy);
  const t = $("#tempEdge");
  const from = conn.from.side === "out" ? conn.p0 : w;
  const to   = conn.from.side === "out" ? w   : conn.p0;
  conn.path = edgePath(from, to);
  t.setAttribute("d", conn.path);
  highlightCandidate();
}
function portCandidates(){
  const want = conn.from.side === "out" ? "in" : "out";
  return nodeLayer.querySelectorAll(`.port[data-side="${want}"]`);
}
function highlightCandidate(){
  $$(".port.hl").forEach(p => p.classList.remove("hl"));
  conn.candidate = null;
  for (const p of portCandidates()){
    const nodeId = p.closest(".node").dataset.id;
    if (nodeId === conn.from.node) continue;
    const r = p.getBoundingClientRect();
    const ccx = r.left + r.width/2, ccy = r.top + r.height/2;
    const m = { x:conn.mx||0, y:conn.my||0 };
    if (Math.hypot(ccx - m.x, ccy - m.y) < 20){
      p.classList.add("hl");
      conn.candidate = { node:nodeId, idx:+p.dataset.idx };
      break;
    }
  }
}
function connUp(e){
  if (!conn) return;
  const from = conn.from;
  try {
    highlightCandidate(); // ensure last state
    if (conn.candidate){
      const cand = conn.candidate;
      let outP, inP;
      if (from.side === "out"){ outP = { node:from.node, port:from.idx }; inP = { node:cand.node, port:cand.idx }; }
      else { outP = { node:cand.node, port:cand.idx }; inP = { node:from.node, port:from.idx }; }
      connect(outP, inP);
    }
  } finally {
    $$(".port.hl").forEach(p => p.classList.remove("hl"));
    conn = null;
    const t = $("#tempEdge");
    if (t) t.setAttribute("visibility", "hidden");
  }
}

/* ---------------- context menu ---------------- */
function openMenu(x, y, items, title){
  closeMenu();
  const m = $("#menu");
  m.hidden = false;
  let html = title ? `<div class="menu-title">${title}</div>` : "";
  for (const it of items){
    if (it.sep){ html += `<div class="menu-sep"></div>`; continue; }
    html += `<div class="menu-item ${it.danger?'danger':''}"><span class="pal-dot" style="background:${it.color||'#60a5fa'}"></span><span>${it.label}</span></div>`;
  }
  m.innerHTML = html;
  m.style.left = x + "px"; m.style.top = y + "px";
  m.querySelectorAll(".menu-item").forEach((el, i) => {
    el.addEventListener("click", ev => { ev.stopPropagation(); const it = items[i]; closeMenu(); it.fn(); });
  });
  menuEl = m;
  requestAnimationFrame(() => {
    const r = m.getBoundingClientRect();
    if (x + r.width > innerWidth) m.style.left = Math.max(4, innerWidth - r.width - 6) + "px";
    if (y + r.height > innerHeight) m.style.top = Math.max(4, innerHeight - r.height - 6) + "px";
  });
}
function closeMenu(){ if (menuEl){ menuEl.hidden = true; menuEl.innerHTML = ""; menuEl = null; } }
document.addEventListener("pointerdown", e => {
  if (menuEl && !menuEl.contains(e.target)) closeMenu();
});
document.addEventListener("contextmenu", e => e.preventDefault());

view.addEventListener("contextmenu", e => {
  const node = e.target.closest ? e.target.closest(".node") : null;
  const wire = e.target.closest && e.target.closest("g[data-rid]");
  if (node || wire) return; // handled by element handlers
  const w = screenToWorld(e.clientX, e.clientY);
  openMenu(e.clientX, e.clientY, menuItemsFor(w), "Add node");
});
view.addEventListener("dblclick", e => {
  const w = screenToWorld(e.clientX, e.clientY);
  openMenu(e.clientX, e.clientY, menuItemsFor(w), "Add node");
});
function menuItemsFor(w){
  const items = [];
  const groups = Object.entries(NODE_TYPES);
  for (const [id, t] of groups){
    items.push({ label:t.label, color:t.color, group:t.tag, fn:() => addNode(id, w.x, w.y) });
  }
  return items;
}

/* ---------------- palette ---------------- */
function buildPalette(){
  const body = $("#palBody");
  const byGroup = {};
  for (const [id, t] of Object.entries(NODE_TYPES)){ (byGroup[t.tag] = byGroup[t.tag] || []).push([id, t]); }
  let html = "";
  const titles = { input:"Input", math:"Math", unary:"Unary", blend:"Blend", output:"Output" };
  const ord = ["input","math","unary","blend","output"];
  for (const grp of ord){
    const list = byGroup[grp] || [];
    if (!list.length) continue;
    html += `<div class="pal-group"><h4>${titles[grp]||grp}</h4>`;
    for (const [id, t] of list){
      html += `<div class="pal-item" data-type="${id}"><div class="pal-dot" style="background:${t.color}"></div>
        <div><div class="nm" style="color:${t.color}">${t.label}</div><div class="dc">${t.blurb}</div></div></div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html;
  body.querySelectorAll(".pal-item").forEach(it => {
    it.addEventListener("click", () => {
      const r = view.getBoundingClientRect();
      const w = screenToWorld(r.left + r.width/2, r.top + r.height/2);
      addNode(it.dataset.type, w.x - NODE_W/2, w.y - 24);
    });
  });
}

/* ---------------- inspector ---------------- */
function renderInspector(){
  const body = $("#inspBody");
  let html = "";
  if (state.sel && state.sel.kind === "node"){
    const n = state.nodes[state.sel.id];
    if (!n){ html = emptyInsp(); body.innerHTML = html; return; }
    const t = NODE_TYPES[n.type];
    if (n.type === "number"){
      html += `<div class="card" style="--ac:${t.color}"><h4><span class="dot"></span>${t.label}</h4>
        <div class="sect-label">Value</div>
        <input type="number" step="any" class="num-input insp" value="${num(n.data.value,0)}" style="width:100%;padding:7px 9px;font-size:13px">
        <div class="btn-row"><button class="btn" data-del>Delete</button><button class="btn" data-dup>Duplicate</button></div>
      </div>`;
    } else {
      html += `<div class="card" style="--ac:${t.color}"><h4><span class="dot"></span>${t.label}</h4>
        <div class="bigval ${n.data.result===null?'muted':''}">${n.data.result===null?(n.data.error?"⚠ "+n.data.error:"—"):fmt(n.data.result)}</div>
        <div class="kv"><b>inputs</b><span>${t.inputs.length}</span></div>
        <div class="kv"><b>outputs</b><span>${t.outputs.length}</span></div>
        <div class="btn-row"><button class="btn" data-del>Delete</button><button class="btn" data-dup>Duplicate</button></div>
      </div>`;
    }
    html += `<div class="sec"><h3>Detail</h3><div class="card">
      <div class="kv"><b>node id</b><span>${n.id}</span></div>
      <div class="kv"><b>position</b><span>${Math.round(n.x)}, ${Math.round(n.y)}</span></div>
      <div class="kv"><b>evaluation</b><span>${n.data.error ? `<span class="bad">${n.data.error}</span>` : `<span class="ok">ok</span>`}</span></div>
    </div></div>`;
  } else if (state.sel && state.sel.kind === "edge"){
    const e = state.edges[state.sel.id];
    if (!e){ html = emptyInsp(); body.innerHTML = html; return; }
    const a = state.nodes[e.from.node], b = state.nodes[e.to.node];
    const ta = NODE_TYPES[a.type], tb = NODE_TYPES[b.type];
    const srcVal = a.data.result;
    html += `<div class="card" style="--ac:#ffd54d"><h4><span class="dot"></span>Wire</h4>
      <div class="sect-label">From</div>
      <div class="kv"><b>node</b><span>${ta.label}</span></div>
      <div class="kv"><b>port</b><span>${ta.outputs[e.from.port]} (out)</span></div>
      <div class="kv"><b>value</b><span>${srcVal===null||srcVal===undefined?"—":fmt(srcVal)}</span></div>
      <div class="dash"></div>
      <div class="sect-label">To</div>
      <div class="kv"><b>node</b><span>${tb.label}</span></div>
      <div class="kv"><b>port</b><span>${tb.inputs[e.to.port]} (in)</span></div>
      <div class="btn-row"><button class="btn danger-soft" data-del-wire>Delete wire</button></div>
    </div>`;
  } else {
    html = emptyInsp();
  }
  body.innerHTML = html;

  const nInp = body.querySelector(".num-input.insp");
  if (nInp){
    nInp.addEventListener("pointerdown", e => e.stopPropagation());
    nInp.addEventListener("change", () => setNumber(state.sel.id, nInp.value));
  }
  const delBtn = body.querySelector("[data-del]");
  if (delBtn) delBtn.addEventListener("click", () => { const id = state.sel && state.sel.id; if (id) deleteNode(id); });
  const dupBtn = body.querySelector("[data-dup]");
  if (dupBtn) dupBtn.addEventListener("click", () => duplicateNode(state.sel && state.sel.id));
  const dw = body.querySelector("[data-del-wire]");
  if (dw) dw.addEventListener("click", () => deleteEdge(state.sel && state.sel.id));
  const outNode = Object.values(state.nodes).find(n => n.type === "output");
  const outVal = outNode ? outNode.data.result : null;
  const stat = `status <b class="${state.evalOk?'ok':'bad'}">${state.evalOk?'ok':'error'}</b> · eval ${state.evalMs.toFixed(2)} ms`;
  $("#statusEval").innerHTML = `${stat}${outNode ? (outVal===null ? '' : ` · result <b>${fmt(outVal)}</b>`) : ''}`;
}
function emptyInsp(){
  const n = Object.keys(state.nodes).length, e = Object.keys(state.edges).length;
  const outNode = Object.values(state.nodes).find(x => x.type === "output");
  const outVal = outNode ? outNode.data.result : null;
  let html = `<div class="sec"><h3>Graph</h3><div class="card">
    <div class="statline"><b>${n}</b> nodes &nbsp;·&nbsp; <b>${e}</b> wires</div>
    <div class="statline">topology: <b class="${state.evalOk?'ok':'bad'}">${state.evalOk?'acyclic & solved':'cycle or error'}</b></div>
    <div class="statline">eval time: <b>${state.evalMs.toFixed(2)} ms</b></div>
    ${outNode ? `<div class="dash"></div><div class="sect-label">Graph result</div>
      <div class="bigval ${outVal===null?'muted':''}">${outVal===null?(outNode.data.error?"⚠ "+outNode.data.error:"—"):fmt(outVal)}</div>
      <div class="statline">from the <b>Result</b> node</div>` : `<div class="dash"></div>
      <div class="statline">No <b>Result</b> node yet — add one to see the graph output.</div>`}
    <div class="dash"></div>
    <div class="statline"><b>Tip:</b> select a node or wire to inspect it here.</div>
  </div></div>
  <div class="sec"><h3>Export / Import</h3><div class="card">
    <div class="statline">Graphs auto-save to localStorage. Export a JSON file to share or back up your graph.</div>
    <div class="btn-row"><button class="btn" id="inspExport">⤓ Export JSON</button><button class="btn" id="inspImport">⤒ Import</button></div>
  </div></div>`;
  return html;
}

/* ---------------- background grid ---------------- */
const gridCanvas = $("#grid"), gridCtx = gridCanvas.getContext("2d");
let gridDirty = true, mapDirty = true;
function sizeCanvas(cv, ctx){
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  if (cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return [w, h];
}
function requestGrid(){ gridDirty = true; }
function drawGrid(){
  const [w, h] = sizeCanvas(gridCanvas, gridCtx);
  const ctx = gridCtx;
  ctx.fillStyle = "#0e1116";
  ctx.fillRect(0, 0, w, h);
  const g = 24 * state.zoom;
  if (g < 6) return;
  const ox = mod(state.pan.x, g), oy = mod(state.pan.y, g);
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(255,255,255,.045)";
  ctx.beginPath();
  for (let x = -ox; x <= w; x += g){ ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = -oy; y <= h; y += g){ ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
  const g5 = g * 5;
  const ox5 = mod(state.pan.x, g5), oy5 = mod(state.pan.y, g5);
  ctx.strokeStyle = "rgba(255,255,255,.09)";
  ctx.beginPath();
  for (let x = -ox5; x <= w; x += g5){ ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = -oy5; y <= h; y += g5){ ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}
function mod(a, n){ return ((a % n) + n) % n; }

/* ---------------- minimap ---------------- */
const miniCanvas = $("#minimap"), miniCtx = miniCanvas.getContext("2d");
function requestMap(){ mapDirty = true; }
function drawMinimap(){
  const [w, h] = sizeCanvas(miniCanvas, miniCtx);
  const ctx = miniCtx;
  ctx.clearRect(0, 0, w, h);
  const nodes = Object.values(state.nodes);
  if (!nodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes){
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + 270);
  }
  const pad = 40;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const bw = maxX - minX, bh = maxY - minY;
  const s = Math.min(w / bw, h / bh);
  const ox = (w - bw*s)/2, oy = (h - bh*s)/2;
  const X = x => (x - minX)*s + ox, Y = y => (y - minY)*s + oy;

  ctx.lineWidth = 1;
  for (const e of Object.values(state.edges)){
    const a = state.nodes[e.from.node], b = state.nodes[e.to.node];
    if (!a || !b) continue;
    const pa = portWorld(a, "out", e.from.port), pb = portWorld(b, "in", e.to.port);
    ctx.strokeStyle = "rgba(96,165,250,.5)";
    ctx.beginPath(); ctx.moveTo(X(pa.x), Y(pa.y)); ctx.lineTo(X(pb.x), Y(pb.y)); ctx.stroke();
  }
  for (const n of nodes){
    const t = NODE_TYPES[n.type];
    ctx.fillStyle = t.color;
    ctx.fillRect(X(n.x), Y(n.y), NODE_W*s, 24*s);
  }
  // viewport rectangle
  const vw = view.clientWidth / state.zoom, vh = view.clientHeight / state.zoom;
  const vx = -state.pan.x / state.zoom, vy = -state.pan.y / state.zoom;
  ctx.strokeStyle = "rgba(255,255,255,.55)";
  ctx.strokeRect(X(vx), Y(vy), vw*s, vh*s);
}
miniCanvas.addEventListener("pointerdown", e => {
  const r = miniCanvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  // invert samples: recompute like drawMinimap
  const nodes = Object.values(state.nodes);
  if (!nodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes){
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + 270);
  }
  const pad = 40;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const bw = maxX - minX, bh = maxY - minY;
  const s = Math.min(r.width / bw, r.height / bh);
  const ox = (r.width - bw*s)/2, oy = (r.height - bh*s)/2;
  const wx = (mx - ox)/s + minX, wy = (my - oy)/s + minY;
  state.pan.x = -wx * state.zoom + r.width*0; // width compensated below
  state.pan.y = -wy * state.zoom + 0;
  // center the clicked point in the viewport
  const vr = view.getBoundingClientRect();
  state.pan.x = -(wx * state.zoom) + vr.width/2;
  state.pan.y = -(wy * state.zoom) + vr.height/2;
  applyViewport();
});

/* ---------------- run + toolbar ---------------- */
function runGraph(){
  evaluate();
  state.runStamp++;
  for (const e of Object.values(state.edges)) e.__run = state.runStamp;
  updateChips();
  layoutEdges();
  renderInspector();
  updateStatus();
  setTimeout(() => {
    for (const e of Object.values(state.edges)) if (e.__run === state.runStamp) e.__run = 0;
    layoutEdges();
  }, 1150);
  toast("Evaluated graph · " + state.evalMs.toFixed(2) + " ms");
}

function updateStatus(){
  $("#statusCounts").textContent = `${Object.keys(state.nodes).length} nodes · ${Object.keys(state.edges).length} wires`;
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e => {
  const ae = e.target;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  if (e.key === "Delete" || e.key === "Backspace"){
    if (!state.sel) return;
    e.preventDefault();
    if (state.sel.kind === "node") deleteNode(state.sel.id);
    else deleteEdge(state.sel.id);
    return;
  }
  if (e.key === "Escape"){ closeMenu(); if (conn){ conn = null; const t = $("#tempEdge"); if (t) t.setAttribute("visibility","hidden"); } }
});

/* ---------------- export / import / reset ---------------- */
function exportJSON(){
  const blob = new Blob([serialize()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nodeforge-graph.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Graph exported");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const act = t.dataset.action;
  if (act === "export") exportJSON();
  if (act === "import") $("#fileIn").click();
});

/* ---------------- boot ---------------- */
function boot(){
  loadSaved();
  buildPalette();
  evaluate();
  render({ rebuild:true });
  renderInspector();
  updateStatus();
  applyViewport();
  syncButtons();

  // toolbar wiring
  $("#btnRun").addEventListener("click", runGraph);
  $("#btnUndo").addEventListener("click", undo);
  $("#btnRedo").addEventListener("click", redo);
  $("#btnExport").addEventListener("click", exportJSON);
  $("#btnImport").addEventListener("click", () => $("#fileIn").click());
  $("#btnReset").addEventListener("click", () => {
    if (!confirm("Reset the graph to the starter example? This clears the current graph.")) return;
    undoStack.push(snapshot()); redoStack = [];
    freshState(); state.sel = null;
    afterChange({ rebuild:true });
    toast("Graph reset");
  });
  $("#fileIn").addEventListener("change", ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const ok = deserialize(rd.result);
      if (!ok){ toast("Invalid graph file"); return; }
      undoStack.push(snapshot()); redoStack = [];
      state.sel = null;
      afterChange({ rebuild:true });
      toast("Graph imported");
    };
    rd.readAsText(f);
    ev.target.value = "";
  });
  $("#inspExport") && $("#inspExport").addEventListener("click", exportJSON);
  $("#inspImport") && $("#inspImport").addEventListener("click", () => $("#fileIn").click());

  // inspector re-renders after dynamic additions; delegate via body listener
  document.addEventListener("click", e => {
    const t = e.target;
    if (t && (t.id === "inspExport" || t.id === "inspImport")){
      e.preventDefault();
      t.id === "inspExport" ? exportJSON() : $("#fileIn").click();
    }
  });

  // focus-in number inputs select content
  document.addEventListener("focusin", e => {
    if (e.target.classList && e.target.classList.contains("num-input")) e.target.select();
  });

  window.addEventListener("resize", () => { requestGrid(); requestMap(); });

  // rAF loop for grid + minimap
  requestGrid();
  (function loop(){
    if (gridDirty){ drawGrid(); gridDirty = false; }
    if (mapDirty){ drawMinimap(); mapDirty = false; }
    requestAnimationFrame(loop);
  })();

  // toast a welcome
  setTimeout(() => toast("Welcome to NodeForge — try connecting Number nodes into Add / Multiply"), 700);
}

boot();
</script>
