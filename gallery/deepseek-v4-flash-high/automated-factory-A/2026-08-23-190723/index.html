<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automated Factory Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0d10;
    color: #cfd6df;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px;
    background: #12151a;
    border-bottom: 1px solid #23272f;
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; letter-spacing: 2px; color: #e8edf3; font-weight: 600; }
  #status-dot { width: 9px; height: 9px; border-radius: 50%; background: #3f9c5f; box-shadow: 0 0 8px #3f9c5f; transition: background .2s, box-shadow .2s; }
  .chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip {
    background: #1a1e25; border: 1px solid #262c36; border-radius: 6px;
    padding: 4px 10px; font-size: 11px; color: #93a0ad; white-space: nowrap;
  }
  .chip b { color: #fff; font-weight: 600; }
  #stage-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { display: block; background: #101318; }
  footer {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 18px;
    background: #12151a;
    border-top: 1px solid #23272f;
    flex-wrap: wrap;
  }
  button {
    background: #1c2129; color: #dbe3ec; border: 1px solid #2c333f;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #262d38; }
  button.primary { background: #2c5c8f; border-color: #3d7ab8; }
  button.primary:hover { background: #356ba6; }
  button.danger { background: #7a2f2f; border-color: #a84444; }
  button.danger:hover { background: #8f3939; }
  label { font-size: 12px; color: #9aa4b1; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=range] { width: 100px; accent-color: #35c4f0; }
  select { background: #1c2129; color: #dbe3ec; border: 1px solid #2c333f; border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .legend { display: flex; gap: 10px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .lg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #8b96a3; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="status-dot"></span>
    <h1>AUTOMATION PLANT 07 &mdash; LIVE FLOOR</h1>
    <div class="chips">
      <div class="chip">EXPORTED <b id="c-exported">0</b></div>
      <div class="chip">REJECTED <b id="c-rejected">0</b></div>
      <div class="chip">THROUGHPUT <b id="c-throughput">0</b><span style="opacity:.6">/min</span></div>
      <div class="chip">UTIL <b id="c-util">0%</b></div>
      <div class="chip">FAULTS <b id="c-faults">0</b></div>
      <div class="chip">TIME <b id="c-time">00:00</b></div>
    </div>
  </header>
  <div id="stage-wrap"><canvas id="stage" width="1360" height="800"></canvas></div>
  <footer>
    <button id="btn-pause" class="primary">&#10074;&#10074; PAUSE</button>
    <button id="btn-reset">&#8635; RESET</button>
    <button id="btn-fault" class="danger">&#9888; TRIGGER FAULT</button>
    <label>Speed
      <select id="sel-speed">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </label>
    <label>Feed <input type="range" id="rng-feed" min="0.5" max="2" step="0.05" value="0.9"></label>
    <label><input type="checkbox" id="chk-auto" checked> auto-faults</label>
    <label><input type="checkbox" id="chk-sound"> sound</label>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:#c9a86a"></span>raw</span>
      <span class="lg"><span class="sw" style="background:#e8a33d"></span>part</span>
      <span class="lg"><span class="sw" style="background:#35c4f0"></span>assembly</span>
      <span class="lg"><span class="sw" style="background:#b07cf0"></span>inspected</span>
      <span class="lg"><span class="sw" style="background:#59d98a"></span>packed</span>
      <span class="lg"><span class="sw" style="background:#d05050"></span>scrap</span>
    </div>
  </footer>
</div>

<script>
'use strict';
/* ============================================================
   Automated Factory Simulation
   A single self-contained HTML file. No build step.
   ============================================================ */

// ---------- canvas & scaling ----------
const W = 1360, H = 800;
const LANE_Y = 400;                 // main production lane
const MW = 150, MH = 170;           // machine footprint
const TAU = Math.PI * 2;

const canvas = document.getElementById('stage');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
function resizeCanvas(){
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
const ctx = canvas.getContext('2d');

function fitCanvas(){
  const wrap = document.getElementById('stage-wrap');
  const r = wrap.getBoundingClientRect();
  const s = Math.max(0.05, Math.min((r.width - 10) / W, (r.height - 10) / H));
  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(H * s) + 'px';
}
if (window.ResizeObserver) {
  new ResizeObserver(fitCanvas).observe(document.getElementById('stage-wrap'));
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r + amt), 0, 255);
  g = clamp(Math.round(g + amt), 0, 255);
  b = clamp(Math.round(b + amt), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- state ----------
const state = {
  paused: false,
  speed: 1,
  feedInterval: 0.9,
  autoFault: true,
  sound: false,
};
let simTime = 0;
let exported = 0, rejected = 0, faultCount = 0;
const throughputTimes = [];
let spawnTimer = 0;
let autoFaultTimer = rand(20, 40);

// ---------- stage colors ----------
const STAGE_COLOR = { 0:'#c9a86a', 1:'#e8a33d', 2:'#35c4f0', 3:'#b07cf0', 4:'#59d98a', scrap:'#d05050' };

// ---------- machines ----------
const machines = [];
function addMachine(id, cx, name, color, processTime, failRate, outStage){
  const m = {
    id, cx, x: cx - MW/2, y: LANE_Y - MH/2, w: MW, h: MH,
    name, color, processTime, failRate, outStage,
    state: 'idle', progress: 0,
    buffered: null, pending: null,
    produced: 0, rejected: 0, busy: 0, faults: 0,
    errorTimer: 0, shake: 0,
  };
  machines.push(m);
  return m;
}
const press      = addMachine('press', 250,  'STAMPING PRESS',   '#e8a33d', 1.4, 0.00, 1);
const assembler  = addMachine('assembler', 470, 'ROBOT ASSEMBLER','#35c4f0', 1.6, 0.00, 2);
const qc         = addMachine('qc', 690,    'QUALITY CHECK',     '#b07cf0', 1.1, 0.12, 3);
const packer     = addMachine('packer', 1080,'PACKING STATION',  '#59d98a', 1.3, 0.00, 4);

// ---------- belts ----------
class Belt {
  constructor(points, opts){
    this.points = points;
    this.items = [];
    this.speed = opts.speed || 150;
    this.feeds = opts.feeds || null;   // machine that consumes at end
    this.sink  = opts.sink || null;    // 'dock' | 'scrap'
    this.segs = [];
    this.L = 0;
    for (let i = 0; i < points.length - 1; i++){
      const p1 = points[i], p2 = points[i + 1];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      this.L += len;
      this.segs.push({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, len, a: Math.atan2(dy, dx) });
    }
  }
  pointAt(d){
    let rem = d;
    for (const s of this.segs){
      if (rem <= s.len) return { x: s.x1 + (s.x2 - s.x1) * (rem / s.len), y: s.y1 + (s.y2 - s.y1) * (rem / s.len), a: s.a };
      rem -= s.len;
    }
    const last = this.points[this.points.length - 1], prev = this.points[this.points.length - 2];
    return { x: last.x, y: last.y, a: Math.atan2(last.y - prev.y, last.x - prev.x) };
  }
}
function mkBelt(pts, opts){ return new Belt(pts, opts); }

const bFeed = mkBelt([[130, LANE_Y],[175, LANE_Y]], { feeds: press });
const b1    = mkBelt([[325, LANE_Y],[395, LANE_Y]], { feeds: assembler });
const b2    = mkBelt([[545, LANE_Y],[615, LANE_Y]], { feeds: qc });
const b3    = mkBelt([[765, LANE_Y],[1005, LANE_Y]], { feeds: packer });
const b4    = mkBelt([[1155, LANE_Y],[1215, LANE_Y]], { sink: 'dock' });
const bRej  = mkBelt([[690, 485],[690, 575],[845, 575]], { sink: 'scrap', speed: 190 });
const belts = [bFeed, b1, b2, b3, b4, bRej];

press.outBelt = b1; assembler.outBelt = b2;
qc.outBelt = b3; qc.rejectBelt = bRej; packer.outBelt = b4;

// ---------- items / particles / popups ----------
function makeItem(stage){ return { stage, pos: 0, wob: rand(0, TAU) }; }
function beltBlocked(belt, pos, margin){
  for (const it of belt.items) if (Math.abs(it.pos - pos) < margin) return true;
  return false;
}
function spawnOnBelt(belt, stage){
  if (beltBlocked(belt, 0, 30)) return false;
  belt.items.push(makeItem(stage));
  return true;
}

const particles = [], popups = [];
function sparks(x, y, n, color){
  for (let i = 0; i < n; i++){
    const life = rand(0.35, 0.8);
    particles.push({ x, y, vx: rand(-75, 75), vy: rand(-110, 5), g: 320, life, maxLife: life, size: rand(1.4, 3), color });
  }
}
function smoke(x, y){
  const life = rand(0.9, 1.7);
  particles.push({ x: x + rand(-6, 6), y, vx: rand(-12, 12), vy: rand(-42, -18), g: -14, life, maxLife: life, size: rand(4, 9), color: 'rgba(110,105,100,0.55)' });
}
function popup(x, y, text, color){ popups.push({ x, y, text, color, life: 1.5 }); }

// ---------- simulation ----------
function updateSpawner(dt){
  spawnTimer -= dt;
  if (spawnTimer <= 0){
    if (!beltBlocked(bFeed, 0, 30)){
      bFeed.items.push(makeItem(0));
      spawnTimer = state.feedInterval;
    }
  }
}

function updateBelt(b, dt){
  if (!b.items.length) return;
  const sorted = b.items.slice().sort((a, c) => c.pos - a.pos);
  const SP = 36, end = b.L;
  for (let i = 0; i < sorted.length; i++){
    const it = sorted[i];
    if (i === 0){
      it.pos = Math.min(it.pos + b.speed * dt, end);
    } else {
      const front = sorted[i - 1];
      const target = Math.max(0, Math.min(end - 0.01, front.pos - SP));
      if (it.pos < target) it.pos = Math.min(it.pos + b.speed * dt, target);
    }
  }
  const front = sorted[0];
  if (front && front.pos >= end - 0.5){
    if (b.sink){
      b.items.splice(b.items.indexOf(front), 1);
      if (b.sink === 'dock'){
        exported++;
        throughputTimes.push(simTime);
        popup(1240, LANE_Y - 26, 'EXPORT +1', '#7fe0a8');
        if (state.sound) beep(880, 0.08);
      } else {
        rejected++;
        popup(880, 558, 'scrap', '#ff8585');
      }
    } else if (b.feeds && b.feeds.state === 'idle' && !b.feeds.buffered){
      b.items.splice(b.items.indexOf(front), 1);
      const m = b.feeds;
      m.buffered = { stage: front.stage };
      m.state = 'working'; m.progress = 0;
      if (m.id === 'press') sparks(175, LANE_Y, 4, m.color);
    }
  }
}

function finishMachine(m){
  m.produced++;
  let stage = m.outStage, belt = m.outBelt;
  if (m.failRate > 0 && Math.random() < m.failRate){
    stage = 'scrap'; belt = m.rejectBelt; m.rejected++;
    popup(m.cx, m.y + 20, 'REJECT', '#ff7b7b');
    if (state.sound) beep(300, 0.12, 'sawtooth');
  }
  if (!spawnOnBelt(belt, stage)) return { pending: { belt, stage } };
  sparks(m.cx, LANE_Y - 10, 5, m.color);
  if (m.id === 'packer' && state.sound) beep(660, 0.06);
  return { pending: null };
}

function updateMachine(m, dt){
  m.shake = Math.max(0, m.shake - dt * 2);
  if (m.errorTimer > 0){
    m.errorTimer -= dt;
    if (Math.random() < dt * 9) smoke(m.cx + rand(-38, 38), m.y + 8);
    if (m.errorTimer <= 0){
      m.state = m.buffered ? 'working' : 'idle';
      m.progress = 0;
    }
    return;
  }
  if (m.state === 'working'){
    m.busy += dt;
    m.progress += dt / m.processTime;
    if (m.id === 'press' && m.progress > 0.12 && m.progress - dt / m.processTime <= 0.12){
      sparks(m.cx, LANE_Y - 34, 7, m.color);
    }
    if (m.progress >= 1){
      m.progress = 0;
      m.buffered = null;
      const res = finishMachine(m);
      m.state = res.pending ? 'blocked' : 'idle';
      m.pending = res.pending;
    }
  } else if (m.state === 'blocked'){
    const p = m.pending;
    if (spawnOnBelt(p.belt, p.stage)){
      m.pending = null; m.state = 'idle';
      sparks(m.cx, LANE_Y + 30, 5, m.color);
    }
  }
}

function triggerFault(m){
  if (!m || m.errorTimer > 0) return;
  m.errorTimer = 6;
  m.state = 'error';
  m.progress = 0;
  m.faults++; faultCount++;
  m.shake = 1;
  smoke(m.cx, m.y + 10);
  popup(m.cx, m.y + 4, 'FAULT', '#ff6b6b');
  if (state.sound){ beep(180, 0.4, 'sawtooth', 0.05); setTimeout(() => beep(140, 0.5, 'sawtooth', 0.05), 250); }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += p.g * dt; p.vx *= (1 - dt * 1.5);
  }
  for (let i = popups.length - 1; i >= 0; i--){
    const p = popups[i];
    p.life -= dt; p.y -= 26 * dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

function update(dtSim, dt){
  updateSpawner(dtSim);
  for (const b of belts) updateBelt(b, dtSim);
  for (const m of machines) updateMachine(m, dtSim);
  updateParticles(dtSim);

  if (state.autoFault){
    autoFaultTimer -= dtSim;
    if (autoFaultTimer <= 0){
      autoFaultTimer = rand(22, 45);
      triggerFault(machines[Math.floor(Math.random() * machines.length)]);
    }
  }
}

// ---------- audio ----------
let actx = null;
function beep(freq, dur, type, gain){
  if (!state.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = gain || 0.04;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(gain || 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  }catch(e){ /* audio is best-effort */ }
}

// ---------- drawing ----------
function drawBackground(){
  // wall
  const wg = ctx.createLinearGradient(0, 0, 0, 220);
  wg.addColorStop(0, '#101318');
  wg.addColorStop(1, '#1b2029');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, W, 220);

  // windows on the wall
  for (let wx = 60; wx < W; wx += 170){
    const lit = (Math.floor(wx / 170) * 7 + Math.floor(simTime / 3)) % 5 === 0;
    ctx.fillStyle = lit ? 'rgba(120,180,220,0.28)' : 'rgba(40,55,75,0.55)';
    ctx.fillRect(wx, 46, 86, 74);
    ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.lineWidth = 3;
    ctx.strokeRect(wx, 46, 86, 74);
    ctx.beginPath();
    ctx.moveTo(wx + 43, 46); ctx.lineTo(wx + 43, 120);
    ctx.moveTo(wx, 83); ctx.lineTo(wx + 86, 83);
    ctx.stroke();
  }

  // wall sign
  ctx.textAlign = 'center';
  ctx.font = '700 22px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(160,175,190,0.55)';
  ctx.fillText('FACTORY 07 - AUTOMATED PRODUCTION', W / 2, 34);
  ctx.font = '600 11px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(120,135,150,0.45)';
  ctx.fillText('LIVE FLOOR FEED', W / 2, 186);

  // ceiling lamps + cones
  const lampXs = [140, 340, 540, 740, 940, 1140, 1260];
  for (const lx of lampXs){
    ctx.fillStyle = '#3c434f';
    ctx.fillRect(lx - 10, 138, 20, 12);
    ctx.fillStyle = 'rgba(255,236,180,0.85)';
    ctx.fillRect(lx - 4, 150, 8, 6);
    const cg = ctx.createLinearGradient(0, 150, 0, 800);
    cg.addColorStop(0, 'rgba(255,235,180,0.09)');
    cg.addColorStop(1, 'rgba(255,235,180,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(lx - 8, 154);
    ctx.lineTo(lx - 90, 780);
    ctx.lineTo(lx + 90, 780);
    ctx.closePath();
    ctx.fill();
  }

  // floor
  const fg = ctx.createLinearGradient(0, 220, 0, H);
  fg.addColorStop(0, '#1b1e24');
  fg.addColorStop(1, '#13151a');
  ctx.fillStyle = fg;
  ctx.fillRect(0, 220, W, H - 220);

  // faint floor grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  for (let gx = 40; gx < W; gx += 80){
    ctx.beginPath(); ctx.moveTo(gx, 220); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (let gy = 240; gy < H; gy += 44){
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  // hazard pads
  hazardPad(175 - 10, LANE_Y - MH / 2 - 8, MW + 20, MH + 16);
  hazardPad(395 - 10, LANE_Y - MH / 2 - 8, MW + 20, MH + 16);
  hazardPad(615 - 10, LANE_Y - MH / 2 - 8, MW + 20, MH + 16);
  hazardPad(1005 - 10, LANE_Y - MH / 2 - 8, MW + 20, MH + 16);
  hazardPad(838, 538, 102, 86);

  // walkway
  ctx.strokeStyle = 'rgba(230,200,90,0.28)';
  ctx.lineWidth = 2;
  ctx.setLineDash([18, 14]);
  ctx.beginPath(); ctx.moveTo(20, 668); ctx.lineTo(W - 20, 668); ctx.stroke();
  ctx.setLineDash([]);
}

function hazardPad(x, y, w, h){
  ctx.save();
  roundRect(x, y, w, h, 4);
  ctx.clip();
  ctx.fillStyle = 'rgba(40,40,30,0.55)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(230,190,70,0.10)';
  for (let i = -h; i < w + h; i += 16){
    ctx.save();
    ctx.translate(x + i, y);
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(0, 0, 8, h * 1.6);
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(230,190,70,0.14)';
  ctx.lineWidth = 1.5;
  roundRect(x, y, w, h, 4);
  ctx.stroke();
}

function drawHopper(){
  const hx = 58, hy = 296, hw = 74, funnelH = 108;
  const g = ctx.createLinearGradient(hx, 0, hx + hw, 0);
  g.addColorStop(0, '#333a44');
  g.addColorStop(1, '#1c2129');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx + hw, hy);
  ctx.lineTo(hx + 20, hy + funnelH);
  ctx.lineTo(hx + hw - 20, hy + funnelH);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c9a86a';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // material inside
  const lvl = hy + funnelH - 44 + Math.sin(simTime * 2.2) * 6;
  ctx.fillStyle = '#c9a86a';
  ctx.beginPath();
  ctx.moveTo(hx + 12, hy + funnelH);
  ctx.lineTo(hx + 20, lvl);
  ctx.lineTo(hx + hw - 20, lvl);
  ctx.lineTo(hx + hw - 12, hy + funnelH);
  ctx.closePath();
  ctx.fill();

  // chute to belt
  ctx.fillStyle = '#22262d';
  ctx.fillRect(hx + 16, hy + funnelH - 8, hw - 32, 20);
  ctx.strokeStyle = 'rgba(0,0,0,.4)';
  ctx.strokeRect(hx + 16, hy + funnelH - 8, hw - 32, 20);

  ctx.fillStyle = '#96a1ae';
  ctx.font = '600 11px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('RAW FEED', hx + hw / 2, hy - 10);

  // feed pulse light
  const feedReady = !beltBlocked(bFeed, 0, 30);
  ctx.save();
  ctx.shadowColor = feedReady ? '#7fe0a8' : '#ff7b6b';
  ctx.shadowBlur = 10;
  ctx.fillStyle = feedReady ? '#7fe0a8' : '#ff7b6b';
  ctx.beginPath(); ctx.arc(hx + hw / 2, hy + 30, 4.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawDock(){
  const x = 1220, y = 330, w = 134, h = 150;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#2c313b');
  g.addColorStop(1, '#1a1e25');
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = '#59d98a';
  ctx.lineWidth = 1.6;
  roundRect(x, y, w, h, 6);
  ctx.stroke();

  // container doors
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y + 14); ctx.lineTo(x + w / 2, y + h - 26);
  ctx.moveTo(x + 12, y + h - 46); ctx.lineTo(x + w - 12, y + h - 46);
  ctx.stroke();

  ctx.fillStyle = 'rgba(140,230,180,0.8)';
  ctx.font = '700 14px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXPORT', x + w / 2, y + h - 58);

  // wheels
  ctx.fillStyle = '#0d0f13';
  ctx.fillRect(x + 18, y + h - 4, 22, 10);
  ctx.fillRect(x + w - 40, y + h - 4, 22, 10);

  // blinking beacon
  const on = Math.sin(simTime * 4) > 0;
  ctx.save();
  ctx.shadowColor = '#59d98a';
  ctx.shadowBlur = on ? 14 : 4;
  ctx.fillStyle = on ? '#59d98a' : '#2a5c40';
  ctx.beginPath(); ctx.arc(x + w - 14, y - 10, 5, 0, TAU); ctx.fill();
  ctx.restore();

  // inbound arrow
  ctx.fillStyle = 'rgba(120,220,160,0.35)';
  ctx.beginPath();
  ctx.moveTo(1198, LANE_Y); ctx.lineTo(1212, LANE_Y - 7); ctx.lineTo(1212, LANE_Y + 7);
  ctx.closePath(); ctx.fill();
}

function drawScrap(){
  const x = 838, y = 538, w = 102, h = 86;
  ctx.fillStyle = '#20242c';
  roundRect(x, y, w, h, 5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(208,80,80,0.7)';
  ctx.lineWidth = 1.6;
  roundRect(x, y, w, h, 5);
  ctx.stroke();
  // stripes on rim
  ctx.save();
  roundRect(x + 4, y + 4, w - 8, 10, 2);
  ctx.clip();
  for (let i = 0; i < 12; i++){
    ctx.fillStyle = i % 2 ? '#3a2a2a' : '#d05050';
    ctx.fillRect(x + 4 + i * 10, y, 10, 18);
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(150,160,175,0.6)';
  ctx.font = '600 10px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SCRAP', x + w / 2, y + h - 8);
}

function drawBelt(b){
  for (const s of b.segs){
    ctx.save();
    ctx.translate((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2);
    ctx.rotate(s.a);
    const bw = 26;
    // bed
    ctx.fillStyle = '#14171c';
    ctx.fillRect(-s.len / 2, -bw / 2, s.len, bw);
    ctx.strokeStyle = '#2a2f38';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-s.len / 2, -bw / 2, s.len, bw);
    // inner track
    ctx.fillStyle = '#1d2229';
    ctx.fillRect(-s.len / 2 + 3, -bw / 2 + 3, s.len - 6, bw - 6);
    // moving chevrons (point along travel direction)
    const tile = 24;
    const off = (simTime * 140) % tile;
    ctx.strokeStyle = 'rgba(120,140,160,0.5)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let d = -off - tile; d < s.len + tile; d += tile){
      ctx.beginPath();
      ctx.moveTo(d - 5, -bw / 2 + 5);
      ctx.lineTo(d + 3, 0);
      ctx.lineTo(d - 5, bw / 2 - 5);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawItem(it){
  const p = it.belt.pointAt(it.pos);
  ctx.save();
  ctx.translate(p.x, p.y + Math.sin(it.wob + simTime * 6) * 1.5);
  ctx.rotate(p.a);
  const s = 13;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(-s, -s + 2.5, s * 2, s * 2);
  const col = STAGE_COLOR[it.stage] || '#888';
  ctx.save();
  ctx.shadowColor = col;
  ctx.shadowBlur = 6;
  ctx.fillStyle = col;
  roundRect(-s, -s, s * 2, s * 2, 3);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(-s, -s, s * 2, s * 2 * 0.42);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  roundRect(-s, -s, s * 2, s * 2, 3);
  ctx.stroke();
  ctx.restore();
}

function drawMachineBody(m){
  const { x, y, w, h, color } = m;
  ctx.save();
  if (m.shake > 0) ctx.translate(rand(-2, 2) * m.shake, rand(-2, 2) * m.shake);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(x + 3, y + 6, w, h, 10);
  ctx.fill();

  const g = ctx.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, shade(color, -55));
  g.addColorStop(0.18, '#242933');
  g.addColorStop(0.82, '#1c212a');
  g.addColorStop(1, shade(color, -60));
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  roundRect(x, y, w, h, 10);
  ctx.stroke();

  // inner dark panel (machine internals show here)
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  roundRect(x + 9, y + 34, w - 18, h - 74, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  roundRect(x + 9, y + 34, w - 18, h - 74, 6);
  ctx.stroke();

  // status light
  const sc = m.state === 'error' ? '#ff4b4b'
          : m.state === 'blocked' ? '#4bc9ff'
          : m.state === 'working' ? '#ffb04b' : '#5fbe7f';
  const pulse = m.state === 'working' ? 0.6 + 0.4 * Math.sin(simTime * 10)
              : m.state === 'error' ? (Math.sin(simTime * 14) > 0 ? 1 : 0.25) : 0.85;
  ctx.save();
  ctx.shadowColor = sc;
  ctx.shadowBlur = 12 * pulse + 4;
  ctx.fillStyle = sc;
  ctx.beginPath();
  ctx.arc(x + w / 2, y + 16, 5.5, 0, TAU);
  ctx.fill();
  ctx.restore();

  // name plate
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.font = '600 10.5px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(m.name, x + w / 2, y + h - 10);
  ctx.restore();
}

/* ---- per-machine animated internals ---- */
function drawPressOverlay(m){
  const { x, y, w, h } = m;
  const p = m.state === 'working' ? m.progress : 0;
  const cx = m.cx;
  const baseY = y + h - 48;
  // base plate
  ctx.fillStyle = '#3a4150';
  roundRect(cx - 42, baseY - 8, 84, 14, 3);
  ctx.fill();
  ctx.fillStyle = '#4d5768';
  roundRect(cx - 42, baseY - 8, 84, 4, 3);
  ctx.fill();
  // columns
  ctx.fillStyle = '#2c313c';
  ctx.fillRect(cx - 52, y + 26, 12, baseY - 26 - y);
  ctx.fillRect(cx + 40, y + 26, 12, baseY - 26 - y);
  // top beam
  ctx.fillStyle = '#343b48';
  roundRect(cx - 56, y + 20, 112, 16, 3);
  ctx.fill();
  // ram travel
  let ramT = 0;
  if (p > 0 && p < 0.12) ramT = p / 0.12;
  else if (p <= 0.42) ramT = 1;
  else if (p < 0.58) ramT = 1 - (p - 0.42) / 0.16;
  const ramY = lerp(y + 52, baseY - 16, ramT);
  ctx.fillStyle = '#4a5468';
  roundRect(cx - 28, ramY, 56, 20, 3);
  ctx.fill();
  ctx.fillStyle = '#5b6679';
  roundRect(cx - 28, ramY, 56, 5, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,163,61,0.5)';
  ctx.lineWidth = 1.5;
  roundRect(cx - 28, ramY, 56, 20, 3);
  ctx.stroke();
  // workpiece
  if (m.buffered){
    const squish = (p >= 0.12 && p <= 0.42) ? 0.35 : 1;
    ctx.save();
    ctx.translate(cx, baseY - 3 - 16 * (1 - squish));
    ctx.scale(1, squish);
    ctx.fillStyle = STAGE_COLOR[m.buffered.stage];
    roundRect(-10, -8, 20, 16, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    roundRect(-10, -8, 20, 16, 3);
    ctx.stroke();
    ctx.restore();
  }
}

function drawAssemblerOverlay(m){
  const { x, y, w } = m;
  const p = m.state === 'working' ? m.progress : 0;
  const railY = y + 26;
  // rail
  ctx.fillStyle = '#3a4150';
  ctx.fillRect(x + 14, railY - 3, w - 28, 5);

  // carriage position keyframed over the work cycle
  let cxt = 0.5;
  if (p > 0){
    if (p < 0.3) cxt = lerp(0.5, 0, p / 0.3);
    else if (p < 0.45) cxt = 0;
    else if (p < 0.75) cxt = lerp(0, 0.5, (p - 0.45) / 0.3);
    else cxt = 0.5;
  }
  const carX = lerp(x + 26, x + w - 26, cxt);
  const down = (p > 0.3 && p < 0.45) || (p > 0.75 && p < 0.9);
  const gripY = down ? lerp(railY + 8, LANE_Y - 2, 1) : railY + 12;

  ctx.fillStyle = '#4a5468';
  roundRect(carX - 16, railY - 7, 32, 15, 3);
  ctx.fill();
  ctx.strokeStyle = '#7f8ca0';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(carX, railY + 8);
  ctx.lineTo(carX, gripY - 7);
  ctx.stroke();
  ctx.fillStyle = '#8a97ab';
  roundRect(carX - 11, gripY - 7, 22, 13, 3);
  ctx.fill();
  // carried item
  if (p > 0.33 && p < 0.85){
    const col = STAGE_COLOR[m.buffered ? m.buffered.stage : 2];
    ctx.fillStyle = col;
    roundRect(carX - 8, gripY + 4, 16, 12, 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    roundRect(carX - 8, gripY + 4, 16, 12, 2);
    ctx.stroke();
  }
}

function drawQcOverlay(m){
  const { x, y, w, h } = m;
  const p = m.state === 'working' ? m.progress : 0;
  // scanner housing on top
  ctx.fillStyle = '#3a4150';
  roundRect(x + 16, y + 34, w - 32, 16, 3);
  ctx.fill();
  ctx.fillStyle = '#b07cf0';
  roundRect(x + 16, y + 34, w - 32, 4, 3);
  ctx.fill();
  // sweep beam
  const top = y + 56, bot = y + h - 46;
  const beamY = lerp(top, bot, Math.sin(p * Math.PI));
  ctx.fillStyle = 'rgba(176,124,240,0.14)';
  ctx.fillRect(x + 20, beamY, w - 40, bot - beamY);
  ctx.strokeStyle = 'rgba(196,150,255,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 20, beamY);
  ctx.lineTo(x + w - 20, beamY);
  ctx.stroke();
  // inspected item
  if (m.buffered){
    const col = STAGE_COLOR[m.buffered.stage];
    ctx.fillStyle = col;
    roundRect(m.cx - 12, LANE_Y - 14, 24, 20, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    roundRect(m.cx - 12, LANE_Y - 14, 24, 20, 3);
    ctx.stroke();
  }
  // verdict light
  const verdict = m.state === 'working' ? '#b07cf0' : '#5fbe7f';
  ctx.save();
  ctx.shadowColor = verdict;
  ctx.shadowBlur = 10;
  ctx.fillStyle = verdict;
  ctx.beginPath();
  ctx.arc(m.cx, y + 27, 6, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawPackerOverlay(m){
  const { x, y, w, h } = m;
  const p = m.state === 'working' ? m.progress : 0;
  const baseY = y + h - 42;
  if (m.buffered){
    const col = STAGE_COLOR[m.buffered.stage];
    // cardboard box
    ctx.fillStyle = '#8a6a3a';
    roundRect(m.cx - 16, baseY - 28, 34, 28, 3);
    ctx.fill();
    ctx.strokeStyle = '#c0a56e';
    roundRect(m.cx - 16, baseY - 28, 34, 28, 3);
    ctx.stroke();
    // item dropping in
    ctx.fillStyle = col;
    roundRect(m.cx - 11, baseY - 28 + p * 11, 22, 9, 2);
    ctx.fill();
  }
  // pusher ram
  const ramT = p > 0.82 ? (p - 0.82) / 0.18 : 0;
  ctx.fillStyle = '#4a5468';
  roundRect(m.x + w - 24 - 30 * ramT - 16, baseY - 30, 16, 34, 3);
  ctx.fill();
  // stacked packed boxes on the right
  for (let i = 0; i < 3; i++){
    ctx.fillStyle = i === 1 ? '#7a5f34' : '#6f5530';
    roundRect(m.x + w - 18 + i * 20, baseY - 30 - i * 20, 18, 18, 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    roundRect(m.x + w - 18 + i * 20, baseY - 30 - i * 20, 18, 18, 2);
    ctx.stroke();
  }
}

function drawMachineOverlays(){
  drawPressOverlay(press);
  drawAssemblerOverlay(assembler);
  drawQcOverlay(qc);
  drawPackerOverlay(packer);
}

function drawMachineLabels(){
  for (const m of machines){
    ctx.textAlign = 'center';
    const ly = LANE_Y + MH / 2 + 22;
    const st = m.state === 'error'
      ? ['FAULT', '#ff6b6b']
      : m.state === 'blocked'
        ? ['BLOCKED', '#4bc9ff']
        : m.state === 'working'
          ? ['RUNNING ' + Math.round(m.progress * 100) + '%', '#ffb04b']
          : ['READY', '#8be0a8'];
    ctx.font = '600 11px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(m.cx - 48, ly - 14, 96, 18, 9);
    ctx.fill();
    ctx.fillStyle = st[1];
    ctx.fillText(st[0], m.cx, ly + 1);
  }
}

function drawParticles(){
  for (const pt of particles){
    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const pp of popups){
    ctx.globalAlpha = clamp(pp.life / 0.8, 0, 1);
    ctx.font = '600 12px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = pp.color;
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.08);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawHopper();
  drawDock();
  drawScrap();
  for (const b of belts) drawBelt(b);
  for (const m of machines) drawMachineBody(m);
  for (const b of belts) for (const it of b.items) drawItem(it);
  drawMachineOverlays();
  drawMachineLabels();
  drawParticles();
  drawVignette();
}

// ---------- HUD ----------
const el = id => document.getElementById(id);
let hudTimer = 0;
function hudTick(dt){
  hudTimer -= dt;
  if (hudTimer > 0) return;
  hudTimer = 0.12;

  // prune throughput window
  while (throughputTimes.length && throughputTimes[0] < simTime - 60) throughputTimes.shift();
  const tph = throughputTimes.length; // exports in last 60s
  el('c-exported').textContent = exported;
  el('c-rejected').textContent = rejected;
  el('c-throughput').textContent = tph;
  const util = simTime > 5
    ? Math.round(machines.reduce((s, m) => s + m.busy, 0) / simTime / machines.length * 100)
    : 0;
  el('c-util').textContent = util + '%';
  el('c-faults').textContent = faultCount;
  const mins = Math.floor(simTime / 60), secs = Math.floor(simTime % 60);
  el('c-time').textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

  const dot = el('status-dot');
  if (state.paused){ dot.style.background = '#e0a83d'; dot.style.boxShadow = '0 0 8px #e0a83d'; }
  else { dot.style.background = '#3f9c5f'; dot.style.boxShadow = '0 0 8px #3f9c5f'; }
}

// ---------- controls ----------
el('btn-pause').addEventListener('click', () => {
  state.paused = !state.paused;
  el('btn-pause').innerHTML = state.paused ? '&#9654; RESUME' : '&#10074;&#10074; PAUSE';
});
el('btn-reset').addEventListener('click', resetSim);
el('btn-fault').addEventListener('click', () => {
  triggerFault(machines[Math.floor(Math.random() * machines.length)]);
});
el('sel-speed').addEventListener('change', e => { state.speed = parseFloat(e.target.value); });
el('rng-feed').addEventListener('input', e => { state.feedInterval = parseFloat(e.target.value); });
el('chk-auto').addEventListener('change', e => { state.autoFault = e.target.checked; });
el('chk-sound').addEventListener('change', e => { state.sound = e.target.checked; });

document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); el('btn-pause').click(); }
});

function resetSim(){
  for (const b of belts) b.items.length = 0;
  for (const m of machines){
    m.state = 'idle'; m.progress = 0; m.buffered = null; m.pending = null;
    m.busy = 0; m.produced = 0; m.rejected = 0; m.faults = 0;
    m.errorTimer = 0; m.shake = 0;
  }
  exported = 0; rejected = 0; faultCount = 0;
  throughputTimes.length = 0;
  particles.length = 0; popups.length = 0;
  spawnTimer = 0; simTime = 0;
  autoFaultTimer = rand(20, 40);
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  const dtSim = state.paused ? 0 : dt * state.speed;
  if (dtSim > 0) simTime += dtSim;
  update(dtSim, dt);
  draw();
  hudTick(dt);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
