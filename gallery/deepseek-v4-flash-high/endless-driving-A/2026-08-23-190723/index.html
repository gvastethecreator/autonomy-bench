<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NIGHT RUN — Endless Night Driving</title>
<style>
  :root{
    --amber:#ffc866;
    --dim:#9aa6b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060a;}
  body{
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    color:#e8edf3;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{position:fixed;inset:0;}
  #app canvas{display:block;}

  /* ---------- overlays ---------- */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(ellipse 120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(2,3,6,0.55) 78%, rgba(0,0,0,0.72) 100%);
  }
  #skyglow{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:linear-gradient(180deg, rgba(40,64,110,0.22) 0%, rgba(10,16,30,0.0) 32%);
  }
  #warn{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,30,30,0) 55%, rgba(255,40,40,0.34) 100%);
    transition:opacity .12s linear;
  }
  #nearflash{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(ellipse at center, rgba(180,210,255,0) 50%, rgba(190,220,255,0.35) 100%);
    transition:opacity .1s linear;
  }
  #crashflash{
    position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,60,40,0.25) 0%, rgba(180,10,10,0.75) 100%);
  }
  #title{
    position:fixed;top:34px;left:0;right:0;text-align:center;pointer-events:none;z-index:7;
    transition:opacity 1s ease;
  }
  #title h1{
    font-size:44px;letter-spacing:14px;font-weight:200;color:#f3f6fb;
    text-shadow:0 0 24px rgba(120,160,255,0.35), 0 0 60px rgba(0,0,0,0.8);
  }
  #title h1 em{font-style:normal;color:var(--amber);text-shadow:0 0 18px rgba(255,200,102,0.5);}
  #title p{
    margin-top:8px;font-size:13px;letter-spacing:5px;color:var(--dim);
    text-transform:uppercase;
  }

  /* ---------- HUD ---------- */
  .hud{position:fixed;pointer-events:none;z-index:7;text-shadow:0 1px 8px rgba(0,0,0,0.9);}
  #scorebox{top:22px;right:26px;text-align:right;}
  #scorebox .lbl{font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;}
  #score{font-size:34px;font-weight:300;color:#f0f4fa;font-variant-numeric:tabular-nums;}
  #high{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums;}

  #distbox{top:22px;left:26px;}
  #distbox .lbl{font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;}
  #dist{font-size:26px;font-weight:300;color:#e6ecf4;font-variant-numeric:tabular-nums;}

  #speedbox{bottom:26px;left:50%;transform:translateX(-50%);text-align:center;}
  #kmh{font-size:74px;line-height:1;font-weight:200;font-variant-numeric:tabular-nums;color:#f4f7fc;
    text-shadow:0 0 30px rgba(255,200,102,0.25);}
  #speedbox .lbl{font-size:12px;letter-spacing:5px;color:var(--dim);text-transform:uppercase;margin-top:2px;}

  #hintbox{bottom:22px;right:26px;text-align:right;font-size:12px;line-height:1.7;color:var(--dim);}
  #hintbox b{color:#dbe3ee;font-weight:600;}
  .key{display:inline-block;min-width:18px;padding:0 5px;margin-right:2px;border:1px solid #3b4350;
    border-radius:4px;background:#14181f;color:#cdd6e2;font-size:11px;text-align:center;}

  /* ---------- popup ---------- */
  #pop{
    position:fixed;top:30%;left:0;right:0;text-align:center;pointer-events:none;z-index:8;
    font-size:27px;letter-spacing:4px;color:#aed4ff;opacity:0;
    text-shadow:0 0 22px rgba(120,170,255,0.7);
  }
  #pop.on{animation:popup .9s ease forwards;}
  @keyframes popup{
    0%{opacity:0;transform:translateY(14px) scale(.85);}
    25%{opacity:1;transform:translateY(0) scale(1);}
    70%{opacity:1;}
    100%{opacity:0;transform:translateY(-16px) scale(1.02);}
  }

  /* ---------- game over ---------- */
  #gameover{
    position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:rgba(2,3,6,0.55);
    backdrop-filter:blur(2px);
  }
  #gameover.show{display:flex;}
  #gameover h2{font-size:64px;font-weight:200;letter-spacing:12px;color:#ff8a6a;text-shadow:0 0 40px rgba(255,70,40,0.5);}
  #gameover .stat{font-size:18px;letter-spacing:2px;color:#cdd6e2;}
  #gameover .stat b{color:#fff;font-weight:500;}
  #gameover .newrecord{font-size:14px;letter-spacing:4px;color:var(--amber);text-transform:uppercase;opacity:0;}
  #gameover .newrecord.show{opacity:1;}
  #gameover .restart{margin-top:14px;font-size:14px;letter-spacing:4px;color:var(--dim);text-transform:uppercase;}
  #gameover .restart b{color:#fff;font-weight:600;}
</style>
</head>
<body>
  <div id="app"></div>

  <div id="vignette"></div>
  <div id="skyglow"></div>
  <div id="warn"></div>
  <div id="nearflash"></div>
  <div id="crashflash"></div>

  <div id="title">
    <h1>NIGHT<em>RUN</em></h1>
    <p>endless night drive</p>
  </div>

  <div id="scorebox" class="hud">
    <div class="lbl">Score</div>
    <div id="score">0</div>
    <div id="high">best 0</div>
  </div>
  <div id="distbox" class="hud">
    <div class="lbl">Distance</div>
    <div id="dist">0.0 km</div>
  </div>
  <div id="speedbox" class="hud">
    <div id="kmh">0</div>
    <div class="lbl">km/h</div>
  </div>
  <div id="hintbox" class="hud">
    <div><span class="key">W</span>/<span class="key">S</span> or <span class="key">↑</span>/<span class="key">↓</span> throttle &amp; brake</div>
    <div><span class="key">A</span>/<span class="key">D</span> or <span class="key">←</span>/<span class="key">→</span> change lane</div>
    <div><span class="key">C</span> camera&nbsp;&nbsp;<span class="key">M</span> sound&nbsp;&nbsp;<span class="key">R</span> restart</div>
  </div>

  <div id="pop"></div>

  <div id="gameover">
    <h2>WRECKED</h2>
    <div class="stat">Score&nbsp;&nbsp;<b id="goScore">0</b></div>
    <div class="stat">Distance&nbsp;&nbsp;<b id="goDist">0.0 km</b></div>
    <div class="newrecord" id="newrecord">new record</div>
    <div class="restart">press <b>R</b> to drive again</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
'use strict';
(function () {

  /* ============================================================
     NIGHT RUN — endless night driving in Three.js
     ============================================================ */

  // ---------- renderer / scene / camera ----------
  var app = document.getElementById('app');

  var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.setClearColor(0x04060a, 1);
  app.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04060a);
  scene.fog = new THREE.FogExp2(0x04060a, 0.0108);

  var camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 4000);
  camera.position.set(0, 3.1, 8.6);

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0x27364f, 0x0b0d0a, 0.55));
  scene.add(new THREE.AmbientLight(0x141b26, 0.7));

  var moonLight = new THREE.DirectionalLight(0x8fa8e0, 0.5);
  moonLight.position.set(500, 800, -1200);
  scene.add(moonLight);

  var headTarget = new THREE.Object3D();
  headTarget.position.set(0, 0, -70);
  scene.add(headTarget);

  function makeHeadlight() {
    var l = new THREE.SpotLight(0xfff1d6, 2.0, 140, 0.55, 0.5, 1.5);
    l.position.set(0, 1.05, -1.9);
    l.target = headTarget;
    scene.add(l);
    return l;
  }
  var headL = makeHeadlight();
  var headR = makeHeadlight();
  headL.position.x = -0.62;
  headR.position.x =  0.62;

  // ---------- texture helpers ----------
  function makeCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  function asphaltTexture() {
    var c = makeCanvas(256, 256), g = c.getContext('2d');
    g.fillStyle = '#15171b'; g.fillRect(0, 0, 256, 256);
    for (var i = 0; i < 2600; i++) {
      var v = 20 + Math.random() * 24 | 0;
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.04 + Math.random() * 0.06) + ')';
      g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function grassTexture() {
    var c = makeCanvas(256, 256), g = c.getContext('2d');
    g.fillStyle = '#0b0e0a'; g.fillRect(0, 0, 256, 256);
    for (var i = 0; i < 3200; i++) {
      var t = Math.random();
      var col = t < 0.4 ? '#0d120c' : (t < 0.7 ? '#0a0d09' : '#10140d');
      g.fillStyle = col;
      g.fillRect(Math.random() * 256, Math.random() * 256, 1, 1);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function glowTexture(inner, mid) {
    var c = makeCanvas(128, 128), g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, inner);
    gr.addColorStop(0.35, mid);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  var glowWarm = glowTexture('rgba(255,244,214,1)', 'rgba(255,214,140,0.55)');
  var glowHead = glowTexture('rgba(255,255,255,1)', 'rgba(200,225,255,0.55)');
  var glowMoon = glowTexture('rgba(235,242,255,1)', 'rgba(150,180,240,0.5)');

  function skyTexture() {
    var c = makeCanvas(2, 512), g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, 512);
    gr.addColorStop(0.0, '#0d1626');
    gr.addColorStop(0.45, '#070b14');
    gr.addColorStop(1.0, '#03040a');
    g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function billboardTexture(ad) {
    var c = makeCanvas(512, 320), g = c.getContext('2d');
    g.fillStyle = ad.bg; g.fillRect(0, 0, 512, 320);
    g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 10;
    g.strokeRect(14, 14, 484, 292);
    g.fillStyle = ad.fg;
    g.font = 'bold 84px "Arial Black", Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 14;
    g.fillText(ad.t, 256, 128);
    g.shadowBlur = 0;
    g.font = '52px "Arial Narrow", Arial, sans-serif';
    g.fillStyle = ad.fg2;
    g.fillText(ad.s, 256, 232);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // ---------- world materials ----------
  var asphaltTex = asphaltTexture();
  var grassTex = grassTexture();
  asphaltTex.repeat.set(1, 2);
  grassTex.repeat.set(60, 60);

  var M = {
    road:   new THREE.MeshStandardMaterial({ color: 0x16181c, roughness: 0.96, metalness: 0.0, map: asphaltTex }),
    grass:  new THREE.MeshStandardMaterial({ color: 0xb0b4a8, roughness: 1.0, map: grassTex, transparent: true, opacity: 0.1 }),
    edge:   new THREE.MeshStandardMaterial({ color: 0xcfd6dd, roughness: 0.7 }),
    dash:   new THREE.MeshStandardMaterial({ color: 0xd7dde3, roughness: 0.55, emissive: 0x9aa4ad, emissiveIntensity: 0.4 }),
    rail:   new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.6 }),
    post:   new THREE.MeshStandardMaterial({ color: 0x565c62, roughness: 0.8 }),
    reflect:new THREE.MeshStandardMaterial({ color: 0xffa22a, emissive: 0xff8c1a, emissiveIntensity: 1.5, roughness: 0.5 }),
    pole:   new THREE.MeshStandardMaterial({ color: 0x41464c, roughness: 0.75, metalness: 0.4 }),
    lamp:   new THREE.MeshStandardMaterial({ color: 0xffe9bd, emissive: 0xffc866, emissiveIntensity: 1.7 }),
    tree1:  new THREE.MeshStandardMaterial({ color: 0x0d1a12, roughness: 1 }),
    tree2:  new THREE.MeshStandardMaterial({ color: 0x0a140e, roughness: 1 }),
    trunk:  new THREE.MeshStandardMaterial({ color: 0x1a1512, roughness: 1 }),
    rock:   new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 1 }),
    glass:  new THREE.MeshStandardMaterial({ color: 0x0a0e14, roughness: 0.1, metalness: 0.8 })
  };

  // ---------- shared geometry ----------
  var CHUNK_LEN = 50, CHUNK_COUNT = 14;
  var ROAD_HALF = 5.2;
  var PERIOD = CHUNK_LEN / 6; // dash period divides chunk len -> seamless recycling

  var G = {
    bed:      new THREE.BoxGeometry(10.6, 0.3, CHUNK_LEN),
    edge:     new THREE.BoxGeometry(0.14, 0.05, CHUNK_LEN),
    dash:     new THREE.BoxGeometry(0.16, 0.05, 2.8),
    rail:     new THREE.BoxGeometry(0.1, 0.75, CHUNK_LEN),
    post:     new THREE.BoxGeometry(0.14, 0.75, 0.14),
    reflect:  new THREE.BoxGeometry(0.07, 0.14, 0.07),
    pole:     new THREE.CylinderGeometry(0.09, 0.13, 7, 8),
    lamp:     new THREE.SphereGeometry(0.2, 10, 8),
    arm:      new THREE.BoxGeometry(0.08, 0.08, 1.4),
    trunk:    new THREE.CylinderGeometry(0.12, 0.2, 2.6, 7),
    cone:     new THREE.ConeGeometry(1.15, 3.6, 7),
    cone2:    new THREE.ConeGeometry(0.85, 2.6, 7),
    rock:     new THREE.IcosahedronGeometry(0.7, 0),
    slabFace: new THREE.BoxGeometry(4.4, 2.8, 0.1),
    slabFrame:new THREE.BoxGeometry(5.0, 3.4, 0.14),
    billPole: new THREE.CylinderGeometry(0.1, 0.15, 6.2, 8)
  };

  // ---------- sky ----------
  var skyMat = new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide, fog: false, depthWrite: false });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 24, 12), skyMat);
  scene.add(sky);

  var starsGeo = new THREE.BufferGeometry();
  var starN = 1300, starPos = new Float32Array(starN * 3);
  for (var i = 0; i < starN; i++) {
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(1 - Math.random() * 0.85); // band above horizon
    var r = 1350;
    starPos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    starPos[i * 3 + 1] = r * Math.cos(ph) * 0.6 + 120;
    starPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
    color: 0xffffff, size: 1.7, sizeAttenuation: true, transparent: true, opacity: 0.9,
    fog: false, toneMapped: false, depthWrite: false
  }));
  scene.add(stars);

  var moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowMoon, color: 0xf4f7ff, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: false, toneMapped: false
  }));
  moonSprite.position.set(-520, 460, -1150);
  moonSprite.scale.set(130, 130, 1);
  scene.add(moonSprite);

  // ---------- ground ----------
  var groundMat = M.grass;
  groundMat.map = grassTex;
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(4200, 4200), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.18;
  scene.add(ground);

  // ---------- road chunks ----------
  var chunks = [];
  function buildChunk(g, seq) {
    // clean old children (shared geometry is reused, never disposed here)
    if (g.userData.billMat) {
      if (g.userData.billMat.map) g.userData.billMat.map.dispose();
      g.userData.billMat.dispose();
      g.userData.billMat = null;
    }
    while (g.children.length) g.children.pop();
    var bed = new THREE.Mesh(G.bed, M.road);
    bed.position.set(0, -0.16, -CHUNK_LEN / 2);
    g.add(bed);

    // edge lines
    var eL = new THREE.Mesh(G.edge, M.edge); eL.position.set(-ROAD_HALF + 0.5, 0.02, -CHUNK_LEN / 2); g.add(eL);
    var eR = new THREE.Mesh(G.edge, M.edge); eR.position.set( ROAD_HALF - 0.5, 0.02, -CHUNK_LEN / 2); g.add(eR);

    // center dashes (period divides chunk => seamless across recycled chunks)
    for (var k = 0; k < 6; k++) {
      var d = new THREE.Mesh(G.dash, M.dash);
      d.position.set(0, 0.03, -((k + 0.5) * PERIOD));
      g.add(d);
    }

    // guardrails + posts + reflectors
    var railSide = [-1, 1];
    for (var s = 0; s < 2; s++) {
      var rx = (ROAD_HALF + 0.45) * railSide[s];
      var ra = new THREE.Mesh(G.rail, M.rail);
      ra.position.set(rx, 0.38, -CHUNK_LEN / 2);
      g.add(ra);
      for (var p = 0; p <= 6; p++) {
        var po = new THREE.Mesh(G.post, M.post);
        po.position.set(rx, 0.38, -(p * (CHUNK_LEN / 6)));
        g.add(po);
        var rp = new THREE.Mesh(G.reflect, M.reflect);
        rp.position.set(rx + 0.14 * railSide[s], 0.38, -(p * (CHUNK_LEN / 6) + 1.2));
        g.add(rp);
      }
    }

    // light poles
    var lampSide = (seq % 2 === 0) ? 1 : -1;
    for (var lp = 0; lp < 2; lp++) {
      var pole = new THREE.Mesh(G.pole, M.pole);
      pole.position.set((ROAD_HALF + 2.4) * lampSide, 3.5, -(lp * 26 + 10));
      g.add(pole);
      var arm = new THREE.Mesh(G.arm, M.pole);
      arm.position.set((ROAD_HALF + 1.6) * lampSide, 6.9, -(lp * 26 + 10));
      g.add(arm);
      var lamp = new THREE.Mesh(G.lamp, M.lamp);
      lamp.position.set((ROAD_HALF + 1.0) * lampSide, 6.85, -(lp * 26 + 10));
      g.add(lamp);
      var glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowWarm, color: 0xffd98c, transparent: true, blending: THREE.AdditiveBlending,
        depthWrite: false, fog: false, toneMapped: false
      }));
      glow.position.copy(lamp.position);
      glow.scale.set(7, 7, 1);
      g.add(glow);
    }

    // trees
    var nTrees = 5 + (Math.random() * 4 | 0);
    for (var t = 0; t < nTrees; t++) {
      var side = Math.random() < 0.5 ? -1 : 1;
      var x = (ROAD_HALF + 3.5 + Math.random() * 34) * side;
      var z = -Math.random() * CHUNK_LEN;
      addTree(g, x, z, 0.8 + Math.random() * 1.1);
    }

    // rocks
    var nRocks = Math.random() < 0.6 ? (1 + Math.random() * 2 | 0) : 0;
    for (var rk = 0; rk < nRocks; rk++) {
      var rSide = Math.random() < 0.5 ? -1 : 1;
      var rock = new THREE.Mesh(G.rock, M.rock);
      var sc = 0.5 + Math.random() * 1.1;
      rock.scale.set(sc, sc * (0.5 + Math.random() * 0.4), sc);
      rock.position.set((ROAD_HALF + 4 + Math.random() * 16) * rSide, sc * 0.22, -Math.random() * CHUNK_LEN);
      rock.rotation.y = Math.random() * Math.PI;
      g.add(rock);
    }

    // billboards
    if (Math.random() < 0.35) {
      var ad = ADS[Math.random() * ADS.length | 0];
      var bSide = Math.random() < 0.5 ? -1 : 1;
      var bp = new THREE.Mesh(G.billPole, M.pole);
      bp.position.set((ROAD_HALF + 9 + Math.random() * 6) * bSide, 3.2, -12 - Math.random() * 26);
      g.add(bp);
      var frame = new THREE.Mesh(G.slabFrame, M.post);
      frame.position.set(bp.position.x, 6.4, bp.position.z);
      g.add(frame);
      var face = new THREE.Mesh(G.slabFace, new THREE.MeshBasicMaterial({ map: billboardTexture(ad), toneMapped: false }));
      face.position.set(bp.position.x, 6.4, bp.position.z + 0.06);
      face.rotation.y = (bSide < 0 ? 1 : -1) * Math.PI / 2;
      g.userData.billMat = face.material;
      g.add(face);
    }
  }

  function addTree(g, x, z, s) {
    var trunk = new THREE.Mesh(G.trunk, M.trunk);
    trunk.position.set(x, 1.3 * s, z);
    trunk.scale.set(s, s, s);
    g.add(trunk);
    var c1 = new THREE.Mesh(G.cone, M.tree1);
    c1.position.set(x, (3.2) * s, z);
    c1.scale.set(s, s, s);
    g.add(c1);
    var c2 = new THREE.Mesh(G.cone2, M.tree2);
    c2.position.set(x, (5.1) * s, z);
    c2.scale.set(s, s, s);
    g.add(c2);
  }

  var ADS = [
    { t: 'MOONLIT', s: 'DINER · 24H',      bg: '#1b2233', fg: '#ffd9a0', fg2: '#cfe0ff' },
    { t: 'NIGHTRUN', s: 'FUEL AHEAD 2 KM', bg: '#231a26', fg: '#ff9a76', fg2: '#ffe0cf' },
    { t: 'STARLIGHT', s: 'MOTEL · VACANCY', bg: '#16242c', fg: '#a0e0ff', fg2: '#eaf7ff' },
    { t: 'COYOTE', s: 'RADIO 88.3 FM',      bg: '#241f12', fg: '#ffd23e', fg2: '#fff3c4' },
    { t: 'MIDNIGHT', s: 'ALL-NIGHT COFFEE', bg: '#201c2c', fg: '#c9b6ff', fg2: '#efe9ff' },
    { t: 'DUNE', s: 'CROSSING · SLOW',      bg: '#241a12', fg: '#ffb060', fg2: '#ffe3c0' }
  ];

  var totalLen = CHUNK_LEN * CHUNK_COUNT;
  for (var ci = 0; ci < CHUNK_COUNT; ci++) {
    var cg = new THREE.Group();
    cg.position.set(0, 0, -ci * CHUNK_LEN);
    buildChunk(cg, ci);
    scene.add(cg);
    chunks.push(cg);
  }

  // ---------- player car ----------
  var car = new THREE.Group();
  var bodyMat = new THREE.MeshStandardMaterial({ color: 0x7c1f24, metalness: 0.65, roughness: 0.35 });
  var cabinMat = new THREE.MeshStandardMaterial({ color: 0x111318, metalness: 0.4, roughness: 0.5 });
  var wheelMat = new THREE.MeshStandardMaterial({ color: 0x0d0e10, roughness: 0.9 });
  var bumpMat = new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 0.8 });
  var tailMat = new THREE.MeshStandardMaterial({ color: 0xff2211, emissive: 0xff1a08, emissiveIntensity: 2.0 });

  var body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 4.3), bodyMat);
  body.position.y = 0.62;
  car.add(body);
  var cabin = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.42, 2.15), cabinMat);
  cabin.position.set(0, 1.0, -0.15);
  car.add(cabin);
  var glass = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 0.06), M.glass);
  glass.position.set(0, 1.0, -1.28);
  car.add(glass);
  var bumperF = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.28, 0.3), bumpMat);
  bumperF.position.set(0, 0.45, -2.2);
  car.add(bumperF);
  var bumperB = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.28, 0.3), bumpMat);
  bumperB.position.set(0, 0.45, 2.2);
  car.add(bumperB);

  var wheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.28, 14);
  var wheels = [];
  [[-0.82, 1.45], [0.82, 1.45], [-0.82, -1.45], [0.82, -1.45]].forEach(function (w) {
    var wh = new THREE.Mesh(wheelGeo, wheelMat);
    wh.rotation.x = Math.PI / 2;
    wh.position.set(w[0], 0.36, w[1]);
    car.add(wh);
    wheels.push(wh);
  });
  // headlight glow sprites
  var hlGeo = new THREE.BoxGeometry(0.5, 0.16, 0.08);
  var hlMat = new THREE.MeshStandardMaterial({ color: 0xfff4cf, emissive: 0xfff4cf, emissiveIntensity: 3 });
  [-0.62, 0.62].forEach(function (x) {
    var hl = new THREE.Mesh(hlGeo, hlMat);
    hl.position.set(x, 0.6, -2.18);
    car.add(hl);
    var tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.08), tailMat);
    tl.position.set(x, 0.66, 2.18);
    car.add(tl);
  });
  car.position.y = 0;
  scene.add(car);

  var carShadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.7, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.42, depthWrite: false })
  );
  carShadow.rotation.x = -Math.PI / 2;
  carShadow.position.y = 0.03;
  scene.add(carShadow);

  // ---------- oncoming cars ----------
  var LANES = [-3.4, 0, 3.4];
  var ON_COLORS = [0x3b4a8f, 0x5a3b6e, 0x8f3b3b, 0x3b6e5a, 0x7a7a5a, 0x4a4f57, 0x98482f];
  var onCars = [];

  function createOncomingCar(colorIdx) {
    var g = new THREE.Group();
    var col = ON_COLORS[colorIdx % ON_COLORS.length];
    var mat = new THREE.MeshStandardMaterial({ color: col, metalness: 0.7, roughness: 0.3 });
    var b = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 4.1), mat);
    b.position.y = 0.58;
    g.add(b);
    var roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 2.0), cabinMat);
    roof.position.set(0, 0.94, 0.1);
    g.add(roof);
    var wgl = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.36, 0.06), M.glass);
    wgl.position.set(0, 0.94, -1.18);
    g.add(wgl);
    var rear = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.26, 0.28), bumpMat);
    rear.position.set(0, 0.44, 2.05);
    g.add(rear);
    var wheels2 = [];
    [[-0.78, 1.4], [0.78, 1.4], [-0.78, -1.4], [0.78, -1.4]].forEach(function (w) {
      var wh = new THREE.Mesh(wheelGeo, wheelMat);
      wh.rotation.x = Math.PI / 2;
      wh.position.set(w[0], 0.34, w[1]);
      g.add(wh);
      wheels2.push(wh);
    });
    // headlights facing +Z (toward camera) as glow sprites
    [-0.6, 0.6].forEach(function (x) {
      var s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowHead, color: 0xdfeaff, transparent: true, blending: THREE.AdditiveBlending,
        depthWrite: false, fog: false, toneMapped: false
      }));
      s.position.set(x, 0.62, 2.1);
      s.scale.set(2.4, 1.4, 1);
      g.add(s);
    });
    // taillights
    var tlMat = new THREE.MeshStandardMaterial({ color: 0xff2211, emissive: 0xff1a08, emissiveIntensity: 1.6 });
    [-0.6, 0.6].forEach(function (x) {
      var tl = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.13, 0.07), tlMat);
      tl.position.set(x, 0.62, -2.05);
      g.add(tl);
    });
    g.userData.wheels = wheels2;
    scene.add(g);
    return g;
  }

  function spawnOncoming(c, z, lane, speed, colorIdx) {
    if (!c.mesh) {
      c.mesh = createOncomingCar(colorIdx === undefined ? (Math.random() * ON_COLORS.length | 0) : colorIdx);
    }
    c.mesh.position.set(LANES[lane], 0, z);
    c.mesh.rotation.set(0, 0, 0); // model front (+z, headlights) faces the player
    c.z = z; c.lane = lane; c.speed = speed; c.scored = false; c.colorIdx = colorIdx;
  }

  function farthestZInLane(ln) {
    var minZ = 0;
    for (var i = 0; i < onCars.length; i++) {
      if (onCars[i].lane === ln && onCars[i].z < minZ) minZ = onCars[i].z;
    }
    return minZ;
  }

  for (var oc = 0; oc < 6; oc++) {
    var c = { mesh: null };
    onCars.push(c);
    var cLane = Math.random() * 3 | 0;
    var cz = -260 - oc * 110 - Math.random() * 60;
    spawnOncoming(c, cz, cLane, 24 + Math.random() * 14, undefined);
  }

  // ---------- game state ----------
  var state = 'run';      // run | dead
  var lane = 1;
  var lateralPos = 0;
  var lateralVel = 0;
  var speed = 20;          // m/s
  var SPEED_MIN = 8, SPEED_MAX = 62, ACCEL = 18, BRAKE = 34;
  var throttle = 0, brake = 0;
  var score = 0, distance = 0;
  var high = 0;
  try { high = +(localStorage.getItem('nightrun-high') || 0); } catch (e) { high = 0; }
  document.getElementById('high').textContent = 'best ' + (high | 0);
  var displayKmh = 0;
  var camMode = 0;         // 0 chase, 1 hood
  var camPos = new THREE.Vector3(0, 3.1, 8.6);
  var camLook = new THREE.Vector3(0, 0, -20);

  var keys = {};
  var soundOn = true;

  // ---------- audio ----------
  var AC = null, master, engineOsc, engineGain, windSrc, windGain, noiseBuf;

  function initAudio() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    master = AC.createGain();
    master.gain.value = 0.4;
    master.connect(AC.destination);

    engineOsc = AC.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 50;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 3;
    engineGain = AC.createGain(); engineGain.gain.value = 0;
    engineOsc.connect(lp); lp.connect(engineGain); engineGain.connect(master);
    engineOsc.start();

    var osc2 = AC.createOscillator();
    osc2.type = 'square';
    osc2.frequency.value = 26;
    var lp2 = AC.createBiquadFilter();
    lp2.type = 'lowpass'; lp2.frequency.value = 120;
    var g2 = AC.createGain(); g2.gain.value = 0;
    osc2.connect(lp2); lp2.connect(g2); g2.connect(master);
    osc2.start();
    engineOsc._g2 = g2;

    // wind noise
    var len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var data = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    windSrc = AC.createBufferSource();
    windSrc.buffer = noiseBuf; windSrc.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.7;
    windGain = AC.createGain(); windGain.gain.value = 0;
    windSrc.connect(bp); bp.connect(windGain); windGain.connect(master);
    windSrc.start();
  }

  function updateAudio() {
    if (!AC || state === 'dead') {
      if (engineGain) engineGain.gain.value = 0;
      if (windGain) windGain.gain.value = 0;
      if (engineOsc && engineOsc._g2) engineOsc._g2.gain.value = 0;
      return;
    }
    var targetFreq = 42 + speed * 1.35;
    engineOsc.frequency.setTargetAtTime(targetFreq, AC.currentTime, 0.1);
    var eg = 0.028 + (throttle > 0 ? 0.03 : 0);
    engineGain.gain.setTargetAtTime(eg, AC.currentTime, 0.15);
    if (engineOsc._g2) engineOsc._g2.gain.setTargetAtTime(speed > 40 ? 0.02 : 0, AC.currentTime, 0.2);
    windGain.gain.setTargetAtTime(Math.min(0.13, Math.max(0, (speed - 14) / 60) * 0.13), AC.currentTime, 0.2);
    if (!soundOn) master.gain.value = 0; else master.gain.value = 0.4;
  }

  function playCrash() {
    if (!AC) return;
    var src = AC.createBufferSource();
    src.buffer = noiseBuf;
    var f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 320;
    var gn = AC.createGain();
    gn.gain.setValueAtTime(0.7, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.8);
    src.connect(f); f.connect(gn); gn.connect(AC.destination);
    src.start();
  }

  // ---------- HUD hooks ----------
  var elScore = document.getElementById('score');
  var elHigh = document.getElementById('high');
  var elDist = document.getElementById('dist');
  var elKmh = document.getElementById('kmh');
  var elWarn = document.getElementById('warn');
  var elNear = document.getElementById('nearflash');
  var elCrash = document.getElementById('crashflash');
  var elPop = document.getElementById('pop');
  var elGameover = document.getElementById('gameover');
  var elTitle = document.getElementById('title');
  var warned = false;

  function popText(txt) {
    elPop.textContent = txt;
    elPop.classList.remove('on');
    void elPop.offsetWidth;
    elPop.classList.add('on');
  }

  function nearMiss() {
    score += 25;
    popText('+25 NEAR MISS');
    elNear.style.opacity = 1;
    setTimeout(function () { elNear.style.opacity = 0; }, 90);
  }

  // ---------- input ----------
  function handleKey(e, down) {
    if (!AC && down) initAudio();
    var code = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(code) >= 0) e.preventDefault();
    keys[code] = down;
    if (down && elTitle && elTitle.style.opacity !== '0') elTitle.style.opacity = '0';

    if (down) {
      if (code === 'ArrowUp' || code === 'w' || code === 'W') throttle = 1;
      if (code === 'ArrowDown' || code === 's' || code === 'S') brake = 1;
      if (code === 'ArrowLeft' || code === 'a' || code === 'A') { if (lane > 0) { lane--; warned = false; } }
      if (code === 'ArrowRight' || code === 'd' || code === 'D') { if (lane < 2) { lane++; warned = false; } }
      if (code === 'c' || code === 'C') camMode = 1 - camMode;
      if (code === 'm' || code === 'M') {
        soundOn = !soundOn;
        if (AC) master.gain.value = soundOn ? 0.4 : 0;
      }
      if (code === 'r' || code === 'R') { if (state === 'dead') resetGame(); }
      if (code === ' ' && state === 'run') brake = 1;
    } else {
      if (code === 'ArrowUp' || code === 'w' || code === 'W') throttle = 0;
      if (code === 'ArrowDown' || code === 's' || code === 'S') brake = 0;
      if (code === ' ' && state === 'run') brake = 0;
    }
  }
  window.addEventListener('keydown', function (e) { handleKey(e, true); });
  window.addEventListener('keyup', function (e) { handleKey(e, false); });
  window.addEventListener('blur', function () { throttle = 0; brake = 0; keys = {}; });
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- crash & reset ----------
  function crash() {
    if (state !== 'run') return;
    state = 'dead';
    playCrash();
    elCrash.style.opacity = 1;
    car.rotation.z = 0.5 + Math.random() * 0.4;
    car.rotation.x = -0.15 - Math.random() * 0.2;
    var newRec = false;
    if (score > high) { high = score; try { localStorage.setItem('nightrun-high', high); } catch (e) {} newRec = true; }
    elHigh.textContent = 'best ' + (high | 0);
    setTimeout(function () {
      elCrash.style.opacity = 0;
      elGameover.classList.add('show');
      document.getElementById('goScore').textContent = score | 0;
      document.getElementById('goDist').textContent = (distance / 1000).toFixed(1) + ' km';
      document.getElementById('newrecord').classList.toggle('show', newRec && score > 0);
    }, 700);
  }

  function resetGame() {
    state = 'run';
    lane = 1; lateralPos = 0; lateralVel = 0;
    speed = 20; throttle = 0; brake = 0;
    score = 0; distance = 0;
    car.rotation.set(0, 0, 0);
    elGameover.classList.remove('show');
    elWarn.style.opacity = 0; warned = false;
    for (var i = 0; i < chunks.length; i++) {
      chunks[i].position.z = -i * CHUNK_LEN;
      buildChunk(chunks[i], i);
    }
    for (var j = 0; j < onCars.length; j++) {
      var z = -300 - j * 110 - Math.random() * 60;
      spawnOncoming(onCars[j], z, (Math.random() * 3) | 0, 24 + Math.random() * 14, undefined);
      onCars[j].mesh.position.x = LANES[onCars[j].lane];
    }
  }

  // ---------- frame loop ----------
  var lastT = performance.now();
  var clock = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    clock += dt;
    update(dt);
    renderer.render(scene, camera);
  }

  function update(dt) {
    var i, c;

    // ---- physics ----
    if (state === 'run') {
      if (throttle) speed = Math.min(SPEED_MAX, speed + ACCEL * dt);
      if (brake) speed = Math.max(SPEED_MIN, speed - BRAKE * dt);
      distance += speed * dt;
      score += speed * dt * 0.06;

      // lateral lane movement
      var targetX = LANES[lane];
      var maxLat = 9 * dt;
      var prevX = lateralPos;
      if (targetX > lateralPos) lateralPos = Math.min(targetX, lateralPos + maxLat);
      else if (targetX < lateralPos) lateralPos = Math.max(targetX, lateralPos - maxLat);
      lateralVel = (lateralPos - prevX) / Math.max(dt, 0.0001);
      car.rotation.z = Math.max(-0.34, Math.min(0.34, -lateralVel * 0.06));
      car.rotation.y = Math.max(-0.16, Math.min(0.16, lateralVel * 0.045));
    } else {
      speed = Math.max(0, speed - 24 * dt);
      lateralVel = 0;
    }
    car.position.x = lateralPos;
    carShadow.position.x = lateralPos;

    // wheel spin
    var spin = (speed * dt) / 0.36;
    for (i = 0; i < wheels.length; i++) wheels[i].rotation.z += spin;

    // ---- road / chunks ----
    var totalMove = speed * dt;
    for (i = 0; i < chunks.length; i++) {
      var cg = chunks[i];
      cg.position.z += totalMove;
      if (cg.position.z > CHUNK_LEN + 35) {
        cg.position.z -= totalLen;
        buildChunk(cg, i);
      }
    }

    // ---- oncoming cars ----
    var threat = false;
    for (i = 0; i < onCars.length; i++) {
      c = onCars[i];
      var rel = (state === 'run') ? (speed + c.speed) : c.speed;
      c.mesh.position.z = c.z += rel * dt;
      // spin wheels opposite
      var ws = c.mesh.userData.wheels;
      if (ws) for (var w = 0; w < ws.length; w++) ws[w].rotation.z -= (c.speed * dt) / 0.36;

      if (c.z > 45) {
        // recycle to far end of its lane
        var farZ = farthestZInLane(c.lane);
        var nz = farZ - (70 + Math.random() * 90);
        var nl = (Math.random() * 3) | 0;
        spawnOncoming(c, nz, nl, 24 + Math.random() * 14, undefined);
        c.mesh.position.x = LANES[nl];
      } else {
        c.mesh.position.x = LANES[c.lane];
      }

      if (state === 'run') {
        // same-lane proximity warning
        if (c.lane === lane && c.z < -8 && c.z > -120) threat = true;
        // crash
        if (c.lane === lane && Math.abs(c.z) < 2.3) { crash(); }
        // near miss (adjacent lane, crossing player z)
        if (!c.scored && Math.abs(c.lane - lane) === 1 && Math.abs(c.z) < 2.3) {
          c.scored = true;
          nearMiss();
        }
      }
    }
    elWarn.style.opacity = threat && state === 'run' ? (0.5 + 0.5 * Math.sin(clock * 9)) : 0;

    // ---- headlights follow car ----
    headL.position.x = lateralPos - 0.62;
    headR.position.x = lateralPos + 0.62;
    headTarget.position.x = lateralPos * 0.6;

    // ---- camera ----
    var speedF = (speed - SPEED_MIN) / (SPEED_MAX - SPEED_MIN);
    var shake = speedF * speedF * 0.045;
    var cax, cay, caz, lax, lay, laz;
    if (camMode === 0) {
      cax = lateralPos * 0.55 + (Math.random() - 0.5) * shake;
      cay = 3.15 + Math.sin(clock * (4 + speed * 0.22)) * 0.028 * (0.4 + speedF);
      caz = 8.6;
      lax = lateralPos * 0.8;
      lay = 1.0;
      laz = -20;
    } else {
      cax = lateralPos * 0.85 + (Math.random() - 0.5) * shake * 0.6;
      cay = 1.42 + Math.sin(clock * (4 + speed * 0.22)) * 0.02;
      caz = -0.2;
      lax = lateralPos;
      lay = 0.8;
      laz = -1;
    }
    // chase cam fov kick
    var targetFov = 62 + speedF * 10 + (Math.random() - 0.5) * shake * 3;
    if (Math.abs(camera.fov - targetFov) > 0.01) {
      camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 5);
      camera.updateProjectionMatrix();
    }

    var k = 1 - Math.pow(0.0005, dt);
    var kL = 1 - Math.pow(0.0002, dt);
    camPos.x += (cax - camPos.x) * k;
    camPos.y += (cay - camPos.y) * k;
    camPos.z += (caz - camPos.z) * k;
    camLook.x += (lax - camLook.x) * kL;
    camLook.y += (lay - camLook.y) * kL;
    camLook.z += (laz - camLook.z) * kL;
    camera.position.copy(camPos);
    camera.lookAt(camLook);

    // stars / moon slow drift
    stars.rotation.y += dt * 0.0015;
    moonSprite.position.x += dt * 0.05;

    // ---- HUD ----
    displayKmh += (speed * 3.6 - displayKmh) * Math.min(1, dt * 6);
    elKmh.textContent = Math.round(displayKmh);
    elScore.textContent = (score | 0);
    elHigh.textContent = 'best ' + (high | 0);
    elDist.textContent = (distance / 1000).toFixed(1) + ' km';

    updateAudio();
  }

  // ---------- go ----------
  requestAnimationFrame(frame);

})();
  </script>
</body>
</html>
