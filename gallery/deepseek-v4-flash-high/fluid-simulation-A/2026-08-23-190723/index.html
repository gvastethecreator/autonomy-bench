<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fluid Simulation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas#fluid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hud {
    position: fixed;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    opacity: 1;
    transition: opacity 1.4s ease;
  }
  .hud.fade {
    opacity: 0;
  }
  .hud .title {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 1px 12px rgba(120, 80, 255, 0.55);
  }
  .hud .hint {
    color: rgba(255, 255, 255, 0.55);
    font-size: 12.5px;
    letter-spacing: 1px;
  }
  #error {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #f3d9ff;
    background: #080714;
    font-size: 15px;
    padding: 40px;
    text-align: center;
    z-index: 20;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <canvas id="fluid"></canvas>
  <div class="hud" id="hud">
    <div class="title">Fluid Simulation</div>
    <div class="hint">move to paint &nbsp;·&nbsp; drag to stir</div>
  </div>
  <div id="error">This fluid simulation needs WebGL2 (with float render-target support).<br>Please open this file in a recent version of Chrome, Edge, Firefox or Safari.</div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Configuration
   * ------------------------------------------------------------------ */
  var CONFIG = {
    simResolution: 128,          // velocity / pressure grid
    dyeResolution: 320,          // dye grid
    pressureIterations: 20,
    dt: 1 / 60,
    maxStepsPerFrame: 3,
    densityDissipation: 0.45,
    velocityDissipation: 0.12,
    vorticityStrength: 32,
    maxVelocity: 500,
    dyeRadius: 0.045,            // uv units
    velocityRadius: 0.013,
    hoverForce: 140,
    dragForce: 460,
    swirlFactor: 0.6,
    autoSplatInterval: 0.7,      // seconds between automatic splats
    intensity: 1.35,
    curlStrength: 0.55
  };

  var canvas = document.getElementById('fluid');
  var hud = document.getElementById('hud');
  var errorEl = document.getElementById('error');

  /* ------------------------------------------------------------------ *
   *  GL context (WebGL2 preferred, WebGL1 half-float fallback)
   * ------------------------------------------------------------------ */
  var gl = null;
  var isWebGL2 = false;
  var FLOAT_IF = null, FLOAT_TYPE = null, BYTE_IF = null, BYTE_TYPE = null;

  function initGL() {
    var attrs = { alpha: false, antialias: false, depth: false, stencil: false };
    var ctx = null;
    try { ctx = canvas.getContext('webgl2', attrs); } catch (e) { ctx = null; }
    if (ctx) {
      isWebGL2 = true;
      var floatBuf = ctx.getExtension('EXT_color_buffer_float');
      if (!floatBuf) ctx = null;
      else {
        FLOAT_IF = ctx.RGBA16F;
        FLOAT_TYPE = ctx.HALF_FLOAT;
      }
    }
    if (!ctx) {
      try { ctx = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs); } catch (e) { ctx = null; }
      if (ctx) {
        isWebGL2 = false;
        var hf = ctx.getExtension('OES_texture_half_float');
        var hfl = ctx.getExtension('OES_texture_half_float_linear');
        if (hf && hfl) {
          FLOAT_IF = ctx.RGBA;
          FLOAT_TYPE = hf.HALF_FLOAT_OES;
        } else {
          var f = ctx.getExtension('OES_texture_float');
          var fl = ctx.getExtension('OES_texture_float_linear');
          if (f && fl) {
            FLOAT_IF = ctx.RGBA;
            FLOAT_TYPE = ctx.FLOAT;
          } else {
            ctx = null;
          }
        }
      }
    }
    if (!ctx) {
      errorEl.style.display = 'flex';
      return false;
    }
    gl = ctx;
    BYTE_IF = gl.RGBA;
    BYTE_TYPE = gl.UNSIGNED_BYTE;
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.DITHER);
    return true;
  }

  /* ------------------------------------------------------------------ *
   *  Shaders (GLSL ES 1.00 — valid in WebGL1 and WebGL2)
   * ------------------------------------------------------------------ */
  var BASE_VERTEX = [
    'precision highp float;',
    'attribute vec2 aPosition;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform vec2 texelSize;',
    'void main () {',
    '  vUv = aPosition;',
    '  vL = vUv - vec2(texelSize.x, 0.0);',
    '  vR = vUv + vec2(texelSize.x, 0.0);',
    '  vT = vUv + vec2(0.0, texelSize.y);',
    '  vB = vUv - vec2(0.0, texelSize.y);',
    '  gl_Position = vec4(aPosition * 2.0 - 1.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var COPY_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uTexture;',
    'void main () {',
    '  gl_FragColor = texture2D(uTexture, vUv);',
    '}'
  ].join('\n');

  var CLEAR_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform vec4 uColor;',
    'void main () {',
    '  gl_FragColor = uColor;',
    '}'
  ].join('\n');

  var SPLAT_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uTarget;',
    'uniform float aspectRatio;',
    'uniform vec3 color;',
    'uniform vec2 point;',
    'uniform float radius;',
    'void main () {',
    '  vec2 p = vUv - point.xy;',
    '  p.x *= aspectRatio;',
    '  vec3 splat = exp(-dot(p, p) / radius) * color;',
    '  vec3 base = texture2D(uTarget, vUv).xyz;',
    '  gl_FragColor = vec4(base + splat, 1.0);',
    '}'
  ].join('\n');

  var ADVECTION_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uVelocity;',
    'uniform sampler2D uSource;',
    'uniform vec2 texelSize;',
    'uniform vec2 dyeTexelSize;',
    'uniform float dt;',
    'uniform float dissipation;',
    'uniform vec2 uClamp;',
    'vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {',
    '  vec2 st = uv / tsize - 0.5;',
    '  vec2 iuv = floor(st);',
    '  vec2 fuv = fract(st);',
    '  vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);',
    '  vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);',
    '  vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);',
    '  vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);',
    '  return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);',
    '}',
    'void main () {',
    '  vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;',
    '  vec4 result = bilerp(uSource, coord, dyeTexelSize);',
    '  float decay = 1.0 + dissipation * dt;',
    '  gl_FragColor = clamp(result / decay, uClamp.x, uClamp.y);',
    '}'
  ].join('\n');

  var DIVERGENCE_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uVelocity;',
    'uniform vec2 texelSize;',
    'void main () {',
    '  float L = texture2D(uVelocity, vL).x;',
    '  float R = texture2D(uVelocity, vR).x;',
    '  float T = texture2D(uVelocity, vT).y;',
    '  float B = texture2D(uVelocity, vB).y;',
    '  vec2 C = texture2D(uVelocity, vUv).xy;',
    '  if (vL.x < 0.0) L = -C.x;',
    '  if (vR.x > 1.0) R = -C.x;',
    '  if (vT.y > 1.0) T = -C.y;',
    '  if (vB.y < 0.0) B = -C.y;',
    '  float div = 0.5 * (R - L + T - B);',
    '  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var CURL_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uVelocity;',
    'uniform vec2 texelSize;',
    'void main () {',
    '  float L = texture2D(uVelocity, vL).y;',
    '  float R = texture2D(uVelocity, vR).y;',
    '  float T = texture2D(uVelocity, vT).x;',
    '  float B = texture2D(uVelocity, vB).x;',
    '  float vorticity = R - L - T + B;',
    '  gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var VORTICITY_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uVelocity;',
    'uniform sampler2D uCurl;',
    'uniform float curl;',
    'uniform float dt;',
    'uniform float maxVelocity;',
    'void main () {',
    '  float L = texture2D(uCurl, vL).x;',
    '  float R = texture2D(uCurl, vR).x;',
    '  float T = texture2D(uCurl, vT).x;',
    '  float B = texture2D(uCurl, vB).x;',
    '  float C = texture2D(uCurl, vUv).x;',
    '  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));',
    '  force /= length(force) + 0.0001;',
    '  force *= curl * C;',
    '  force.y *= -1.0;',
    '  vec2 velocity = texture2D(uVelocity, vUv).xy;',
    '  velocity += force * dt;',
    '  float len = length(velocity);',
    '  if (len > maxVelocity) velocity *= maxVelocity / len;',
    '  gl_FragColor = vec4(velocity, 0.0, 1.0);',
    '}'
  ].join('\n');

  var PRESSURE_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uPressure;',
    'uniform sampler2D uDivergence;',
    'uniform vec2 texelSize;',
    'void main () {',
    '  float L = texture2D(uPressure, vL).x;',
    '  float R = texture2D(uPressure, vR).x;',
    '  float T = texture2D(uPressure, vT).x;',
    '  float B = texture2D(uPressure, vB).x;',
    '  float divergence = texture2D(uDivergence, vUv).x;',
    '  float pressure = (L + R + B + T - divergence) * 0.25;',
    '  gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var GRADIENT_SUBTRACT_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec2 vL;',
    'varying vec2 vR;',
    'varying vec2 vT;',
    'varying vec2 vB;',
    'uniform sampler2D uPressure;',
    'uniform sampler2D uVelocity;',
    'uniform vec2 texelSize;',
    'void main () {',
    '  float L = texture2D(uPressure, vL).x;',
    '  float R = texture2D(uPressure, vR).x;',
    '  float T = texture2D(uPressure, vT).x;',
    '  float B = texture2D(uPressure, vB).x;',
    '  vec2 velocity = texture2D(uVelocity, vUv).xy;',
    '  velocity.xy -= vec2(R - L, T - B);',
    '  gl_FragColor = vec4(velocity, 0.0, 1.0);',
    '}'
  ].join('\n');

  var DISPLAY_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uDye;',
    'uniform sampler2D uCurl;',
    'uniform float intensity;',
    'uniform float curlStrength;',
    'void main () {',
    '  vec3 dye = texture2D(uDye, vUv).rgb;',
    '  float curl = texture2D(uCurl, vUv).x;',
    '  vec3 bg = mix(vec3(0.012, 0.015, 0.052), vec3(0.05, 0.016, 0.10), vUv.y);',
    '  float coverage = clamp(length(dye) * 3.0, 0.0, 1.0);',
    '  vec3 col = mix(bg, dye * intensity, coverage);',
    '  float m = clamp(abs(curl) * 2.2, 0.0, 1.0);',
    '  vec3 glow = 0.5 + 0.5 * cos(6.2831853 * (vec3(0.0, 0.25, 0.5) + curl * 0.30));',
    '  col += glow * m * curlStrength * coverage;',
    '  col = min(col, vec3(1.0));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* ------------------------------------------------------------------ *
   *  Program / resource helpers
   * ------------------------------------------------------------------ */
  function compileShader(type, source) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  function createProgram(vs, fs) {
    var vert = compileShader(gl.VERTEX_SHADER, vs);
    var frag = compileShader(gl.FRAGMENT_SHADER, fs);
    var prog = gl.createProgram();
    gl.attachShader(prog, vert);
    gl.attachShader(prog, frag);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(prog));
    }
    var uniforms = {};
    var numU = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < numU; i++) {
      var info = gl.getActiveUniform(prog, i);
      uniforms[info.name] = gl.getUniformLocation(prog, info.name);
    }
    return {
      program: prog,
      uniforms: uniforms,
      aPosition: gl.getAttribLocation(prog, 'aPosition')
    };
  }

  var quadBuffer = null;
  function setupQuad() {
    quadBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  }

  function blit(program) {
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.enableVertexAttribArray(program.aPosition);
    gl.vertexAttribPointer(program.aPosition, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(program.aPosition);
  }

  var texUnit = 0;
  function bindTextureSampler(program, name, tex) {
    var unit = texUnit++;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(program.uniforms[name], unit);
  }

  /* Render one pass into `target` = { fbo, tex, w, h } */
  function renderPass(program, uniforms, target) {
    texUnit = 0;
    gl.useProgram(program.program);
    for (var name in uniforms) {
      if (!uniforms.hasOwnProperty(name)) continue;
      var value = uniforms[name];
      var loc = program.uniforms[name];
      if (loc === null || loc === undefined) continue;
      if (value instanceof WebGLTexture) {
        bindTextureSampler(program, name, value);
      } else if (Array.isArray(value)) {
        if (value.length === 2) gl.uniform2f(loc, value[0], value[1]);
        else if (value.length === 3) gl.uniform3f(loc, value[0], value[1], value[2]);
        else gl.uniform4f(loc, value[0], value[1], value[2], value[3]);
      } else {
        gl.uniform1f(loc, value);
      }
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.w, target.h);
    blit(program);
  }

  function createTarget(w, h, internalFormat, format, type, filter) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo: fbo, tex: tex, w: w, h: h };
  }

  /* ------------------------------------------------------------------ *
   *  Simulation state
   * ------------------------------------------------------------------ */
  var programs = {};
  var files = {
    velocity: [null, null],   // RGBA16F
    dye: [null, null],        // RGBA8
    pressure: [null, null],   // RGBA16F
    curl: null,               // RGBA16F
    divergence: null          // RGBA16F
  };
  var velocity = { read: 0, write: 1 };
  var dye = { read: 0, write: 1 };
  var pressure = { read: 0, write: 1 };

  var simW = CONFIG.simResolution, simH = CONFIG.simResolution;
  var dyeW = CONFIG.dyeResolution, dyeH = CONFIG.dyeResolution;
  var velTexel = [1 / CONFIG.simResolution, 1 / CONFIG.simResolution];
  var dyeTexel = [1 / CONFIG.dyeResolution, 1 / CONFIG.dyeResolution];
  var aspect = 1;

  function buildPrograms() {
    programs.copy = createProgram(BASE_VERTEX, COPY_FRAG);
    programs.clear = createProgram(BASE_VERTEX, CLEAR_FRAG);
    programs.splat = createProgram(BASE_VERTEX, SPLAT_FRAG);
    programs.advection = createProgram(BASE_VERTEX, ADVECTION_FRAG);
    programs.divergence = createProgram(BASE_VERTEX, DIVERGENCE_FRAG);
    programs.curl = createProgram(BASE_VERTEX, CURL_FRAG);
    programs.vorticity = createProgram(BASE_VERTEX, VORTICITY_FRAG);
    programs.pressure = createProgram(BASE_VERTEX, PRESSURE_FRAG);
    programs.gradientSubtract = createProgram(BASE_VERTEX, GRADIENT_SUBTRACT_FRAG);
    programs.display = createProgram(BASE_VERTEX, DISPLAY_FRAG);
  }

  function allocTargets() {
    files.velocity = [
      createTarget(simW, simH, FLOAT_IF, gl.RGBA, FLOAT_TYPE, gl.LINEAR),
      createTarget(simW, simH, FLOAT_IF, gl.RGBA, FLOAT_TYPE, gl.LINEAR)
    ];
    files.dye = [
      createTarget(dyeW, dyeH, BYTE_IF, gl.RGBA, BYTE_TYPE, gl.LINEAR),
      createTarget(dyeW, dyeH, BYTE_IF, gl.RGBA, BYTE_TYPE, gl.LINEAR)
    ];
    files.pressure = [
      createTarget(simW, simH, FLOAT_IF, gl.RGBA, FLOAT_TYPE, gl.LINEAR),
      createTarget(simW, simH, FLOAT_IF, gl.RGBA, FLOAT_TYPE, gl.LINEAR)
    ];
    files.curl = createTarget(simW, simH, FLOAT_IF, gl.RGBA, FLOAT_TYPE, gl.LINEAR);
    files.divergence = createTarget(simW, simH, FLOAT_IF, gl.RGBA, FLOAT_TYPE, gl.LINEAR);
    velocity.read = 0; velocity.write = 1;
    dye.read = 0; dye.write = 1;
    pressure.read = 0; pressure.write = 1;
  }

  function clearAll() {
    var i;
    for (i = 0; i < 2; i++) {
      renderPass(programs.clear, { uColor: [0, 0, 0, 0] }, files.velocity[i]);
      renderPass(programs.clear, { uColor: [0, 0, 0, 0] }, files.dye[i]);
      renderPass(programs.clear, { uColor: [0, 0, 0, 0] }, files.pressure[i]);
    }
    renderPass(programs.clear, { uColor: [0, 0, 0, 0] }, files.curl);
    renderPass(programs.clear, { uColor: [0, 0, 0, 0] }, files.divergence);
  }

  function swapField(f) {
    var t = f.read; f.read = f.write; f.write = t;
  }

  /* ------------------------------------------------------------------ *
   *  Simulation step
   * ------------------------------------------------------------------ */
  function step(dt) {
    var c = CONFIG;

    /* vorticity field */
    renderPass(programs.curl, {
      uVelocity: files.velocity[velocity.read].tex,
      texelSize: velTexel
    }, files.curl);

    /* vorticity confinement */
    renderPass(programs.vorticity, {
      uVelocity: files.velocity[velocity.read].tex,
      uCurl: files.curl.tex,
      curl: c.vorticityStrength,
      dt: dt,
      maxVelocity: c.maxVelocity
    }, files.velocity[velocity.write]);
    swapField(velocity);

    /* divergence */
    renderPass(programs.divergence, {
      uVelocity: files.velocity[velocity.read].tex,
      texelSize: velTexel
    }, files.divergence);

    /* pressure (Jacobi iterations) */
    renderPass(programs.clear, { uColor: [0, 0, 0, 0] }, files.pressure[pressure.read]);
    for (var i = 0; i < c.pressureIterations; i++) {
      renderPass(programs.pressure, {
        uPressure: files.pressure[pressure.read].tex,
        uDivergence: files.divergence.tex,
        texelSize: velTexel
      }, files.pressure[pressure.write]);
      swapField(pressure);
    }

    /* subtract pressure gradient */
    renderPass(programs.gradientSubtract, {
      uPressure: files.pressure[pressure.read].tex,
      uVelocity: files.velocity[velocity.read].tex,
      texelSize: velTexel
    }, files.velocity[velocity.write]);
    swapField(velocity);

    /* advect velocity */
    renderPass(programs.advection, {
      uVelocity: files.velocity[velocity.read].tex,
      uSource: files.velocity[velocity.read].tex,
      texelSize: velTexel,
      dyeTexelSize: velTexel,
      dt: dt,
      dissipation: 0.0,
      uClamp: [-1e6, 1e6]
    }, files.velocity[velocity.write]);
    swapField(velocity);

    /* advect dye */
    renderPass(programs.advection, {
      uVelocity: files.velocity[velocity.read].tex,
      uSource: files.dye[dye.read].tex,
      texelSize: velTexel,
      dyeTexelSize: dyeTexel,
      dt: dt,
      dissipation: c.densityDissipation,
      uClamp: [0.0, 1.5]
    }, files.dye[dye.write]);
    swapField(dye);
  }

  /* ------------------------------------------------------------------ *
   *  Splatting
   * ------------------------------------------------------------------ */
  function splatScreen(u, v, du, dv, color, dyeRadiusFactor) {
    var c = CONFIG;

    renderPass(programs.splat, {
      uTarget: files.velocity[velocity.read].tex,
      aspectRatio: aspect,
      color: [du, dv, 0.0],
      point: [u, v],
      radius: c.velocityRadius * c.velocityRadius
    }, files.velocity[velocity.write]);
    swapField(velocity);

    renderPass(programs.splat, {
      uTarget: files.dye[dye.read].tex,
      aspectRatio: aspect,
      color: color,
      point: [u, v],
      radius: Math.pow(c.dyeRadius * dyeRadiusFactor, 2)
    }, files.dye[dye.write]);
    swapField(dye);
  }

  /* ------------------------------------------------------------------ *
   *  Color + randomness helpers
   * ------------------------------------------------------------------ */
  function hsv(h, s, v) {
    var r, g, b;
    var i = Math.floor(h * 6);
    var f = h * 6 - i;
    var p = v * (1 - s);
    var q = v * (1 - f * s);
    var t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: r = v; g = t; b = p; break;
      case 1: r = q; g = v; b = p; break;
      case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break;
      case 4: r = t; g = p; b = v; break;
      default: r = v; g = p; b = q; break;
    }
    return [r, g, b];
  }

  /* ------------------------------------------------------------------ *
   *  Sizing / resize
   * ------------------------------------------------------------------ */
  function canvasSize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    return [w, h];
  }

  function resize() {
    var sz = canvasSize();
    canvas.width = sz[0];
    canvas.height = sz[1];
    aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);

    simW = CONFIG.simResolution;
    simH = CONFIG.simResolution;
    dyeW = CONFIG.dyeResolution;
    dyeH = CONFIG.dyeResolution;
    velTexel = [1 / simW, 1 / simH];
    dyeTexel = [1 / dyeW, 1 / dyeH];

    var oldDyeImg = files.dye[dye.read] ? files.dye[dye.read].tex : null;

    allocTargets();

    if (oldDyeImg) {
      /* keep the dye across resize so the picture survives */
      renderPass(programs.copy, { uTexture: oldDyeImg }, files.dye[dye.read]);
    }
    clearAll();
  }

  /* ------------------------------------------------------------------ *
   *  Automatic splats (keeps the scene alive without input)
   * ------------------------------------------------------------------ */
  var autoTimer = 0;
  function autoSplat() {
    var u = Math.random();
    var v = 0.15 + Math.random() * 0.75;
    var ang = Math.random() * Math.PI * 2;
    var mag = 18 + Math.random() * 55;
    var hue = Math.random();
    splatScreen(
      u, v,
      Math.cos(ang) * mag, Math.sin(ang) * mag,
      hsv(hue, 1, 0.75 + Math.random() * 0.25),
      0.9 + Math.random() * 0.5
    );
  }

  /* ------------------------------------------------------------------ *
   *  Pointer interaction
   * ------------------------------------------------------------------ */
  var pointerDown = false;
  var lastX = 0, lastY = 0;
  var simTime = 0;

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      u: (e.clientX - rect.left) / Math.max(1, rect.width),
      v: 1 - (e.clientY - rect.top) / Math.max(1, rect.height)
    };
  }

  function onPointerDown(e) {
    pointerDown = true;
    var p = pointerPos(e);
    lastX = e.clientX;
    lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    /* burst */
    var ang = Math.random() * Math.PI * 2;
    splatScreen(p.u, p.v, Math.cos(ang) * 30, Math.sin(ang) * 30,
      hsv(p.u % 1, 1, 0.95), 1.4);
    hud.classList.add('fade');
  }

  function onPointerMove(e) {
    var p = pointerPos(e);
    var dx = (e.clientX - lastX) / Math.max(1, canvas.clientWidth);
    var dy = -(e.clientY - lastY) / Math.max(1, canvas.clientHeight);
    lastX = e.clientX;
    lastY = e.clientY;

    if (Math.abs(dx) + Math.abs(dy) < 0.0008 && !pointerDown) return;

    var c = CONFIG;
    var force = pointerDown ? c.dragForce : c.hoverForce;
    var swirl = force * c.swirlFactor;
    var hue = (p.u + simTime * 0.03) % 1;

    splatScreen(
      p.u, p.v,
      dx * force - dy * swirl,
      dy * force + dx * swirl,
      hsv(hue, 1, 0.85),
      pointerDown ? 1.25 : 0.8
    );
  }

  function onPointerUp(e) {
    pointerDown = false;
  }

  /* ------------------------------------------------------------------ *
   *  Render loop
   * ------------------------------------------------------------------ */
  var lastFrame = 0;
  var accumulator = 0;

  function display() {
    renderPass(programs.display, {
      uDye: files.dye[dye.read].tex,
      uCurl: files.curl.tex,
      intensity: CONFIG.intensity,
      curlStrength: CONFIG.curlStrength
    }, { fbo: null, tex: null, w: canvas.width, h: canvas.height });
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var delta = Math.min((now - lastFrame) / 1000, 0.1);
    if (lastFrame === 0) delta = 0;
    lastFrame = now;
    simTime += delta;

    accumulator += delta;
    var steps = 0;
    while (accumulator >= CONFIG.dt && steps < CONFIG.maxStepsPerFrame) {
      step(CONFIG.dt);
      accumulator -= CONFIG.dt;
      steps++;
    }
    if (steps >= CONFIG.maxStepsPerFrame) accumulator = 0;

    autoTimer += delta;
    if (autoTimer >= CONFIG.autoSplatInterval) {
      autoTimer -= CONFIG.autoSplatInterval;
      if (!document.hidden) autoSplat();
    }

    display();
  }

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */
  var running = false;

  function init() {
    if (!initGL()) return;
    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      running = false;
    });
    canvas.addEventListener('webglcontextrestored', function () {
      init(); // full rebuild with fresh context
    });
    if (!running) {
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
      canvas.addEventListener('pointerleave', onPointerUp);
    }
    buildPrograms();
    setupQuad();
    resize();
    /* opening splashes so the very first frame is already colorful */
    for (var i = 0; i < 6; i++) autoSplat();
    if (!running) {
      running = true;
      lastFrame = 0;
      accumulator = 0;
      autoTimer = 0;
      requestAnimationFrame(frame);
    }
    setTimeout(function () { hud.classList.add('fade'); }, 6000);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  if (!canvas.getContext || !window.requestAnimationFrame) {
    errorEl.style.display = 'flex';
    return;
  }
  try {
    init();
  } catch (err) {
    if (window.console && console.error) console.error(err);
    errorEl.style.display = 'flex';
    errorEl.innerHTML = 'The simulation could not start.<br>' +
      String(err && err.message ? err.message : err).replace(/</g, '&lt;');
  }
})();
</script>
</body>
</html>
