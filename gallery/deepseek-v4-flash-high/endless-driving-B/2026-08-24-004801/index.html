<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Endless Night Drive</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#04060c; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5;
         font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:#d7e0ee; user-select:none; }
  #title { position:absolute; top:30px; left:38px; }
  #title h1 { margin:0; font-size:15px; letter-spacing:8px; font-weight:600;
              text-transform:uppercase; color:#e8eef8;
              text-shadow:0 0 18px rgba(120,160,255,0.35); }
  #title p { margin:5px 0 0; font-size:10.5px; letter-spacing:3px; opacity:0.55; text-transform:uppercase; }
  #speedBox { position:absolute; left:38px; bottom:28px; }
  #speedVal { font-size:64px; line-height:1; font-weight:200;
              font-variant-numeric:tabular-nums; color:#f2f6ff;
              text-shadow:0 0 24px rgba(150,190,255,0.35); }
  #speedUnit { font-size:12px; letter-spacing:3px; opacity:0.7; margin-top:8px; }
  #distBox { position:absolute; right:38px; bottom:28px; text-align:right; }
  #distVal { font-size:22px; font-weight:300; font-variant-numeric:tabular-nums; opacity:0.92; }
  #distSub { font-size:10.5px; letter-spacing:2px; opacity:0.5; margin-top:5px; text-transform:uppercase; }
  #hint { position:absolute; left:50%; bottom:106px; transform:translateX(-50%);
          text-align:center; font-size:12px; letter-spacing:1.5px; opacity:0;
          transition:opacity 1.6s ease; color:#aebfd8; white-space:nowrap; }
  #soundBtn { position:absolute; top:26px; right:30px; pointer-events:auto; cursor:pointer;
              font:inherit; font-size:11px; letter-spacing:2px; color:#cdd9ea;
              background:rgba(20,28,46,0.55); border:1px solid rgba(140,170,220,0.25);
              border-radius:20px; padding:8px 16px; text-transform:uppercase;
              backdrop-filter:blur(4px); transition:0.25s; }
  #soundBtn:hover { background:rgba(40,56,88,0.7); border-color:rgba(170,200,255,0.5); }
  #bars::before, #bars::after { content:""; position:fixed; left:0; right:0; height:6vh;
      z-index:6; pointer-events:none; }
  #bars::before { top:0; background:linear-gradient(to bottom, rgba(0,0,2,0.92), transparent); }
  #bars::after { bottom:0; background:linear-gradient(to top, rgba(0,0,2,0.92), transparent); }
  #vignette { position:fixed; inset:0; z-index:4; pointer-events:none;
      background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(2,3,8,0.6) 100%); }
  #grain { position:fixed; inset:0; z-index:7; pointer-events:none; opacity:0.05; mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      animation:grain 0.9s steps(3) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 33%{transform:translate(-3px,2px)} 66%{transform:translate(2px,-3px)} 100%{transform:translate(0,0)} }
  #flash { position:fixed; inset:0; z-index:8; pointer-events:none; background:#fff; opacity:0; }
  #intro { position:fixed; inset:0; z-index:20; pointer-events:none;
      background:radial-gradient(ellipse at center,#05070f 0%,#020308 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      animation:introFade 3.4s ease forwards; }
  #intro h1 { margin:0; font-size:clamp(26px,6vw,54px); font-weight:200; letter-spacing:14px;
              color:#eaf1ff; text-shadow:0 0 30px rgba(130,170,255,0.45); }
  #intro p { margin:18px 0 0; font-size:11px; letter-spacing:5px; color:#8fa3c4;
             text-transform:uppercase; animation:introPulse 2s ease-in-out infinite; }
  @keyframes introFade { 0%{opacity:1} 60%{opacity:1} 100%{opacity:0;visibility:hidden} }
  @keyframes introPulse { 0%,100%{opacity:0.45} 50%{opacity:1} }
</style>
</head>
<body>

<div id="intro">
  <h1>ENDLESS NIGHT DRIVE</h1>
  <p>Turn on your sound · then press any key</p>
</div>

<div id="vignette"></div>
<div id="bars"></div>
<div id="flash"></div>
<div id="grain"></div>

<div id="hud">
  <div id="title"><h1>Night Drive</h1><p>an endless highway</p></div>
  <div id="speedBox"><div id="speedVal">0</div><div id="speedUnit">km/h</div></div>
  <div id="distBox"><div id="distVal">0.0 km</div><div id="distSub">of night</div></div>
  <div id="hint">&#8592; &#8594; or A / D &nbsp;steer&nbsp;&nbsp;·&nbsp;&nbsp; &#8593; / W accelerate&nbsp;&nbsp;·&nbsp;&nbsp; &#8595; / S brake</div>
  <button id="soundBtn">sound on</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // 0. Constants
  // ------------------------------------------------------------------
  var AHEAD = 660;
  var BEHIND = 40;
  var ROAD_HALF = 6.8;
  var SPEED_MIN = 15, SPEED_MAX = 56, SPEED_CRUISE = 0; // km/h = m/s * 3.6

  // ------------------------------------------------------------------
  // 1. Renderer / Scene / Camera
  // ------------------------------------------------------------------
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.style.position = 'fixed';
  renderer.domElement.style.inset = '0';
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1420);
  scene.fog = new THREE.FogExp2(0x0d1420, 0.0042);

  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4200);
  camera.position.set(0, 3.0, 10.5);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ------------------------------------------------------------------
  // 2. Helpers
  // ------------------------------------------------------------------
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeCanvas(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    return c;
  }

  function makeGlow(inner, mid, outer) {
    var t = new THREE.CanvasTexture(makeCanvas(128, 128, function (x, w, h) {
      var g = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, outer);
      x.fillStyle = g; x.fillRect(0, 0, w, h);
    }));
    return t;
  }

  function makeNoiseTexture(base, dark, light) {
    var t = new THREE.CanvasTexture(makeCanvas(256, 256, function (x, w, h) {
      x.fillStyle = base; x.fillRect(0, 0, w, h);
      for (var i = 0; i < 1600; i++) {
        x.fillStyle = Math.random() < 0.5 ? dark : light;
        x.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
      }
    }));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    var aniso = renderer.capabilities.getMaxAnisotropy();
    t.anisotropy = aniso;
    return t;
  }

  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  // Glow / light textures
  var T_GLOW = makeGlow('rgba(255,255,255,1)', 'rgba(255,255,255,0.30)', 'rgba(255,255,255,0)');
  var T_LAMP = makeGlow('rgba(255,214,150,1)', 'rgba(255,180,95,0.40)', 'rgba(255,170,80,0)');
  var T_POOL = makeGlow('rgba(255,200,120,0.85)', 'rgba(255,180,90,0.22)', 'rgba(255,160,70,0)');
  var T_TAIL = makeGlow('rgba(255,60,50,1)', 'rgba(255,40,40,0.35)', 'rgba(255,30,30,0)');
  var T_MOON = makeGlow('rgba(235,242,255,1)', 'rgba(200,215,245,0.28)', 'rgba(180,200,240,0)');
  var T_FOG  = makeGlow('rgba(150,175,210,0.9)', 'rgba(150,175,210,0.25)', 'rgba(150,175,210,0)');
  var T_CITY = makeGlow('rgba(255,190,120,0.9)', 'rgba(255,160,100,0.25)', 'rgba(255,150,90,0)');

  var T_ASPHALT = makeNoiseTexture('#262a2f', 'rgba(0,0,0,0.06)', 'rgba(255,255,255,0.04)');
  var T_GRASS   = makeNoiseTexture('#0e1610', 'rgba(0,0,0,0.10)', 'rgba(255,255,255,0.02)');

  function mergeGeometries(geos) {
    var pos = [], nor = [], idx = [], vi = 0;
    geos.forEach(function (g) {
      var p = g.attributes.position.array;
      var n = g.attributes.normal.array;
      for (var i = 0; i < p.length; i++) pos.push(p[i]);
      for (var i = 0; i < n.length; i++) nor.push(n[i]);
      var ind = g.index ? g.index.array : null;
      if (ind) { for (var i = 0; i < ind.length; i++) idx.push(ind[i] + vi); }
      else { for (var i = 0; i < p.length / 3; i++) idx.push(vi + i); }
      vi += p.length / 3;
    });
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setIndex(idx);
    return geo;
  }

  // ------------------------------------------------------------------
  // 3. Lights
  // ------------------------------------------------------------------
  scene.add(new THREE.AmbientLight(0x28324d, 0.7));
  var moonLight = new THREE.DirectionalLight(0x7c90c9, 0.32);
  moonLight.position.set(-560, 260, -1250);
  scene.add(moonLight);

  // ------------------------------------------------------------------
  // 4. Sky, Stars, Moon, City glow
  // ------------------------------------------------------------------
  var skyTex = new THREE.CanvasTexture(makeCanvas(512, 512, function (x, w, h) {
    var g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#04070f');
    g.addColorStop(0.45, '#0a1224');
    g.addColorStop(0.74, '#101a30');
    g.addColorStop(1, '#151d30');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }));
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(1600, 24, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  scene.add(sky);

  function makeStars(count, size, color) {
    var pos = new Float32Array(count * 3);
    var R = 1550;
    for (var i = 0; i < count; i++) {
      var u = Math.random() * 2 - 1;
      var th = Math.random() * Math.PI * 2;
      var rr = Math.sqrt(1 - u * u);
      pos[i * 3] = rr * Math.cos(th) * R;
      pos[i * 3 + 1] = Math.abs(u) * R * 0.96;
      pos[i * 3 + 2] = rr * Math.sin(th) * R;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({ size: size, sizeAttenuation: true, color: color,
      transparent: true, opacity: 0.85, fog: false, depthWrite: false });
    var pts = new THREE.Points(g, m);
    scene.add(pts);
    return { obj: pts, mat: m };
  }
  var stars1 = makeStars(1200, 4, 0xffffff);
  var stars2 = makeStars(70, 10, 0xfff3d8);

  // Moon
  var moon = new THREE.Mesh(new THREE.SphereGeometry(30, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xf0e8d6, fog: false }));
  moon.position.set(-560, 260, -1250);
  scene.add(moon);
  var moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: T_MOON, color: 0xffffff, blending: THREE.AdditiveBlending,
    transparent: true, opacity: 0.5, depthWrite: false, fog: false }));
  moonGlow.position.copy(moon.position);
  moonGlow.scale.set(260, 260, 1);
  scene.add(moonGlow);

  // Distant city glow on horizon ahead
  var makeCity = function (x, y, z, s, o) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: T_CITY, color: 0xffb060, blending: THREE.AdditiveBlending,
      transparent: true, opacity: o, depthWrite: false, fog: false }));
    sp.position.set(x, y, z); sp.scale.set(s, s * 0.5, 1);
    scene.add(sp);
    return sp;
  };
  makeCity(40, 34, -330, 320, 0.16);
  makeCity(-60, 40, -300, 260, 0.11);

  // ------------------------------------------------------------------
  // 5. World: ground, road, ridges
  // ------------------------------------------------------------------
  var LEN = AHEAD + 2 * BEHIND;

  // Ground
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(640, LEN),
    new THREE.MeshStandardMaterial({ color: 0x0a120d, roughness: 1, map: T_GRASS }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.04;
  ground.material.map.repeat.set(8, LEN / 40);
  scene.add(ground);

  // Road
  var road = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_HALF * 2, LEN),
    new THREE.MeshStandardMaterial({ color: 0x2b2e35, roughness: 0.95, metalness: 0.05, map: T_ASPHALT }));
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  road.material.map.repeat.set(1, LEN / 5);
  scene.add(road);

  // Solid edge lines
  var edgeMat = new THREE.MeshStandardMaterial({ color: 0xcfd6e0, roughness: 0.9 });
  var edgeLineGeo = new THREE.BoxGeometry(0.18, 0.045, LEN);
  var edgeL = new THREE.Mesh(edgeLineGeo, edgeMat);
  edgeL.position.set(-6.3, 0.035, 0);
  var edgeR = new THREE.Mesh(edgeLineGeo, edgeMat);
  edgeR.position.set(6.3, 0.035, 0);
  scene.add(edgeL, edgeR);

  // Mountain ridges (silhouette walls)
  function ridgeH(i, s, a1, a2, a3) {
    var v = Math.sin(i * 0.09 + s) * a1 + Math.sin(i * 0.23 + s * 1.7) * a2 + Math.sin(i * 0.043 + s * 3.1) * a3;
    return Math.max(v * 0.6 + a1 * 0.45, 0.5);
  }
  function buildRidge(xF, dir, baseY, a1, a2, a3, seed, color) {
    var steps = 90, zd = LEN / 2;
    var z0 = -zd, z1 = zd, dz = (z1 - z0) / steps;
    var pos = [], nor = [], idx = [];
    var top = function (i) { return baseY + ridgeH(i, seed, a1, a2, a3); };
    var xB = xF + dir * 7;
    var addStrip = function (x, nrm) {
      var base = pos.length / 3;
      for (var i = 0; i <= steps; i++) {
        var z = z0 + dz * i;
        pos.push(x, 0, z); nor.push(nrm[0], nrm[1], nrm[2]);
        pos.push(x, top(i), z); nor.push(nrm[0], nrm[1], nrm[2]);
      }
      for (var i = 0; i < steps; i++) {
        var a = base + i * 2, b = a + 1, c = a + 2, d = a + 3;
        idx.push(a, c, b, b, c, d);
      }
    };
    addStrip(xF, [dir, 0, 0]);
    addStrip(xB, [-dir, 0, 0]);
    var cap = pos.length / 3;
    for (var i = 0; i <= steps; i++) {
      var z = z0 + dz * i, t = top(i);
      pos.push(xF, t, z); nor.push(0, 1, 0);
      pos.push(xB, t, z); nor.push(0, 1, 0);
    }
    for (var i = 0; i < steps; i++) {
      var a = cap + i * 2, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, c, b, b, c, d);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setIndex(idx);
    var m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: color, roughness: 1, side: THREE.DoubleSide }));
    scene.add(m);
    return m;
  }
  var ridgeNearL = buildRidge(-125, 1, 5, 26, 15, 10, 1.3, 0x0c1120);
  var ridgeNearR = buildRidge(125, -1, 5, 26, 15, 10, 4.7, 0x0c1120);
  var ridgeFarL = buildRidge(-260, 1, 7, 40, 22, 14, 7.1, 0x0a0e1a);
  var ridgeFarR = buildRidge(260, -1, 7, 40, 22, 14, 2.9, 0x0a0e1a);
  var ridges = [ridgeNearL, ridgeNearR, ridgeFarL, ridgeFarR];

  // ------------------------------------------------------------------
  // 6. Scrolling instanced systems
  // ------------------------------------------------------------------
  var tmpP = new THREE.Vector3();
  var tmpQ = new THREE.Quaternion();
  var tmpS = new THREE.Vector3();
  var tmpE = new THREE.Euler();
  var tmpM = new THREE.Matrix4();

  function Scroller(mesh, count, spacing, make) {
    this.mesh = mesh;
    this.states = [];
    this.spacing = spacing;
    this.make = make;
    for (var i = 0; i < count; i++) {
      var st = { z: -i * spacing, rotY: 0, side: 1 };
      this.states.push(st);
      make(st, i);
    }
  }
  Scroller.prototype.update = function (carZ) {
    var S = this.states;
    for (var i = 0; i < S.length; i++) {
      var st = S[i];
      if (st.z > carZ + BEHIND) { st.z -= (AHEAD + BEHIND); this.make(st, i); }
      tmpP.set(st.x, st.y || 0, st.z);
      tmpE.set(0, st.rotY || 0, 0);
      tmpQ.setFromEuler(tmpE);
      tmpS.set(st.sx || st.s || 1, st.sy || st.s || 1, st.sz || st.s || 1);
      tmpM.compose(tmpP, tmpQ, tmpS);
      this.mesh.setMatrixAt(i, tmpM);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  };

  // Pine silhouettes (three variants)
  function makePine() {
    var parts = [];
    parts.push(new THREE.CylinderGeometry(0.22, 0.3, 1.6, 6).translate(0, 0.8, 0));
    var levels = [[0.9, 2.4, 0], [1.5, 1.9, 1.2], [2.1, 1.5, 2.4], [2.6, 1.1, 3.5]];
    levels.forEach(function (lv) {
      parts.push(new THREE.ConeGeometry(lv[0], lv[1], 6).translate(0, lv[2] + lv[1] / 2, 0));
    });
    return mergeGeometries(parts);
  }
  function makeRoundTree() {
    var parts = [];
    parts.push(new THREE.CylinderGeometry(0.18, 0.24, 1.2, 6).translate(0, 0.6, 0));
    var sph = new THREE.SphereGeometry(1.35, 8, 6);
    parts.push(sph);
    return mergeGeometries(parts);
  }
  var pineGeo = makePine();
  var roundGeo = makeRoundTree();

  function treeMakeFor(geo, mat) {
    var mesh = new THREE.InstancedMesh(geo, mat, 0);
    scene.add(mesh);
    return mesh;
  }
  function makeTreeState(st) {
    st.side = Math.random() < 0.5 ? -1 : 1;
    st.x = st.side * rand(13.5, 28);
    st.y = 0;
    st.s = rand(0.75, 2.0);
    st.rotY = Math.random() * Math.PI * 2;
  }

  var treeDefs = [
    { count: 55, spacing: 12, mat: new THREE.MeshStandardMaterial({ color: 0x1a2f26, roughness: 1 }) },
    { count: 50, spacing: 13.2, mat: new THREE.MeshStandardMaterial({ color: 0x14281f, roughness: 1 }) },
    { count: 45, spacing: 14.6, mat: new THREE.MeshStandardMaterial({ color: 0x17301f, roughness: 1 }) }
  ];
  var treeScrollers = treeDefs.map(function (d, di) {
    var geo = di < 2 ? pineGeo : roundGeo;
    var mesh = new THREE.InstancedMesh(geo, d.mat, d.count);
    scene.add(mesh);
    return new Scroller(mesh, d.count, d.spacing, makeTreeState);
  });

  // Rocks
  var rockGeo = new THREE.DodecahedronGeometry(0.9, 0);
  var rockMesh = new THREE.InstancedMesh(rockGeo,
    new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 1 }), 40);
  scene.add(rockMesh);
  var rockScroller = new Scroller(rockMesh, 40, 16.5, function (st) {
    st.side = Math.random() < 0.5 ? -1 : 1;
    st.x = st.side * rand(10.5, 17);
    st.y = 0.2;
    st.s = rand(0.5, 2.2);
    st.rotY = Math.random() * Math.PI;
  });

  // Lane dashes (center line)
  var dashGeo = new THREE.BoxGeometry(0.18, 0.04, 3.0);
  var dashMat = new THREE.MeshStandardMaterial({ color: 0xfff3c8, roughness: 0.85 });
  var dashMesh = new THREE.InstancedMesh(dashGeo, dashMat, 55);
  scene.add(dashMesh);
  var dashScroller = new Scroller(dashMesh, 55, 12, function (st) {
    st.x = 0; st.y = 0.035; st.s = 1; st.rotY = 0;
  });

  // Reflector posts at road edges
  var postGeo = new THREE.BoxGeometry(0.14, 0.34, 0.14);
  var postMat = new THREE.MeshStandardMaterial({
    color: 0x8a8f99, emissive: 0xd8dde6, emissiveIntensity: 0.7, roughness: 0.6
  });
  var postMesh = new THREE.InstancedMesh(postGeo, postMat, 78);
  scene.add(postMesh);
  var postScroller = new Scroller(postMesh, 78, 8.7, function (st, i) {
    st.side = i % 2 === 0 ? -1 : 1;
    st.x = st.side * 6.95;
    st.y = 0.17;
    st.s = 1;
    st.rotY = 0;
  });

  // ------------------------------------------------------------------
  // 7. Streetlights (custom — drives several meshes + lights)
  // ------------------------------------------------------------------
  var poleParts = [];
  var pole = new THREE.CylinderGeometry(0.1, 0.16, 7, 8);
  pole.translate(0, 3.5, 0);
  var arm = new THREE.CylinderGeometry(0.055, 0.055, 1.2, 6);
  arm.rotateZ(-Math.PI / 2);   // arm along +X
  arm.translate(0.7, 6.9, 0);
  poleParts.push(pole, arm);
  var poleGeo = mergeGeometries(poleParts);
  var poleMat = new THREE.MeshStandardMaterial({ color: 0x171a20, roughness: 0.8, metalness: 0.3 });

  var LAMPS = 15;
  var lampPoleMesh = new THREE.InstancedMesh(poleGeo, poleMat, LAMPS);
  scene.add(lampPoleMesh);
  var lampHeadGeo = new THREE.BoxGeometry(0.36, 0.16, 0.5);
  var lampHeadMat = new THREE.MeshStandardMaterial({
    color: 0x111111, emissive: 0xffc877, emissiveIntensity: 1.8 });
  var lampHeadMesh = new THREE.InstancedMesh(lampHeadGeo, lampHeadMat, LAMPS);
  scene.add(lampHeadMesh);

  var poolGeo = new THREE.PlaneGeometry(1, 1);
  poolGeo.rotateX(-Math.PI / 2);
  var poolMat = new THREE.MeshBasicMaterial({
    map: T_POOL, transparent: true, opacity: 0.5, depthWrite: false,
    blending: THREE.AdditiveBlending, color: 0xffffff
  });
  var poolMesh = new THREE.InstancedMesh(poolGeo, poolMat, LAMPS);
  scene.add(poolMesh);

  var lampStates = [];
  var lampGlows = [];
  var lampBlink = [];
  for (var li = 0; li < LAMPS; li++) {
    var st = {
      x: (li % 2 === 0 ? -1 : 1) * 8.0,
      z: -li * 45,
      side: li % 2 === 0 ? -1 : 1,
      phase: Math.random() * Math.PI * 2
    };
    lampStates.push(st);
    var gs = new THREE.Sprite(new THREE.SpriteMaterial({
      map: T_LAMP, color: 0xffffff, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 0.6, depthWrite: false, fog: false }));
    scene.add(gs);
    lampGlows.push(gs);
    if (li % 5 === 0) {
      var bs = new THREE.Sprite(new THREE.SpriteMaterial({
        map: T_TAIL, color: 0xff2222, blending: THREE.AdditiveBlending,
        transparent: true, opacity: 0, depthWrite: false, fog: false }));
      scene.add(bs);
      lampBlink.push({ sprite: bs, lampIndex: li });
    }
  }

  // Point lights that follow lamps near the camera's forward window
  var lampLights = [];
  for (var pj = 0; pj < 5; pj++) {
    var pl = new THREE.PointLight(0xffc77a, 0.85, 70, 2);
    scene.add(pl);
    lampLights.push(pl);
  }

  function updateLamps(carZ, t) {
    var m = tmpM;
    for (var i = 0; i < LAMPS; i++) {
      var st = lampStates[i];
      if (st.z > carZ + BEHIND) { st.z -= (AHEAD + BEHIND); st.phase = Math.random() * Math.PI * 2; }
      // pole (arm mirrored for right side)
      tmpP.set(st.x, 3.5, st.z);
      tmpE.set(0, st.side === -1 ? 0 : Math.PI, 0);
      tmpQ.setFromEuler(tmpE);
      tmpS.set(1, 1, 1);
      m.compose(tmpP, tmpQ, tmpS);
      lampPoleMesh.setMatrixAt(i, m);
      // head
      tmpP.set(st.side * 6.8, 6.9, st.z);
      tmpE.set(0, 0, 0);
      tmpQ.setFromEuler(tmpE);
      m.compose(tmpP, tmpQ, tmpS);
      lampHeadMesh.setMatrixAt(i, m);
      // pool on ground
      tmpP.set(st.side * 5.4, 0.06, st.z);
      tmpE.set(0, 0, 0);
      tmpQ.setFromEuler(tmpE);
      tmpS.set(16, 16, 16);
      m.compose(tmpP, tmpQ, tmpS);
      poolMesh.setMatrixAt(i, m);
      // sprite glow
      var gs = lampGlows[i];
      var sc = 6.5 + Math.sin(t * 2 + st.phase) * 0.4;
      gs.material.opacity = 0.55 + Math.sin(t * 2 + st.phase) * 0.08;
      gs.position.set(st.side * 6.8, 6.9, st.z);
      gs.scale.set(sc, sc, 1);
    }
    lampPoleMesh.instanceMatrix.needsUpdate = true;
    lampHeadMesh.instanceMatrix.needsUpdate = true;
    poolMesh.instanceMatrix.needsUpdate = true;
    // blinking aviation lights
    for (var b = 0; b < lampBlink.length; b++) {
      var bl = lampBlink[b];
      var s2 = lampStates[bl.lampIndex];
      bl.sprite.position.set(s2.side * 6.9, 7.4, s2.z);
      bl.sprite.material.opacity = (Math.sin(t * 3 + s2.phase) > 0) ? 0.75 : 0.05;
      bl.sprite.scale.set(1.8, 1.8, 1);
    }
    // snap point lights to nearest lamp in each forward window
    for (var w = 0; w < lampLights.length; w++) {
      var zc = carZ - 30 - w * 78;
      var best = 0, bd = 1e9;
      for (var k = 0; k < LAMPS; k++) {
        var d = Math.abs(lampStates[k].z - zc);
        if (d < bd) { bd = d; best = k; }
      }
      var ls = lampStates[best];
      lampLights[w].position.set(ls.side * 5.4, 6.0, ls.z);
    }
  }

  // ------------------------------------------------------------------
  // 8. Fog patches (drifting sprites)
  // ------------------------------------------------------------------
  var fogPatches = [];
  for (var fi = 0; fi < 6; fi++) {
    var fp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: T_FOG, color: 0xbfd0ee, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 0.08, depthWrite: false, fog: false }));
    fp.position.set((fi % 2 ? 1 : -1) * rand(15, 40), rand(10, 20), -60 - fi * 105);
    fp.scale.set(rand(180, 230), rand(70, 100), 1);
    scene.add(fp);
    fogPatches.push(fp);
  }
  function updateFog(speed, dt) {
    for (var i = 0; i < fogPatches.length; i++) {
      var fp = fogPatches[i];
      fp.position.z += speed * 0.12 * dt;
      fp.position.x += Math.sin(performance.now() * 0.0002 + i * 7) * dt * 0.5;
      fp.material.opacity = 0.06 + 0.03 * Math.sin(performance.now() * 0.0006 + i * 3);
      if (fp.position.z > BEHIND) fp.position.z -= (AHEAD + BEHIND);
    }
  }

  // ------------------------------------------------------------------
  // 9. Car builder
  // ------------------------------------------------------------------
  var box = function (w, h, d) { return new THREE.BoxGeometry(w, h, d); };
  var cyc = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 16);
  cyc.rotateZ(Math.PI / 2);

  function buildCar(paint) {
    var g = new THREE.Group();
    var bodyMat = new THREE.MeshStandardMaterial({ color: paint, metalness: 0.6, roughness: 0.35 });
    var glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0e16, metalness: 0.9, roughness: 0.2 });
    var darkMat = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.85 });
    var add = function (geo, mat, x, y, z) {
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      g.add(m);
      return m;
    };
    add(box(1.9, 0.5, 4.3), bodyMat, 0, 0.72, 0);
    add(box(1.72, 0.2, 1.1), bodyMat, 0, 0.9, -1.5);   // hood (front = -Z)
    add(box(1.7, 0.42, 1.6), glassMat, 0, 1.16, -0.2); // cabin
    add(box(1.78, 0.24, 1.2), bodyMat, 0, 0.92, 1.3);  // trunk
    add(box(1.9, 0.22, 0.7), darkMat, 0, 0.42, -0.55); // sills / skirt
    add(box(0.18, 0.2, 0.18), darkMat, -1.05, 1.05, -0.9); // left mirror
    add(box(0.18, 0.2, 0.18), darkMat, 1.05, 1.05, -0.9);  // right mirror
    // headlights
    add(box(0.52, 0.16, 0.05), new THREE.MeshBasicMaterial({ color: 0xfff5d0 }), -0.6, 0.8, -2.2);
    add(box(0.52, 0.16, 0.05), new THREE.MeshBasicMaterial({ color: 0xfff5d0 }), 0.6, 0.8, -2.2);
    // taillights
    add(box(0.52, 0.12, 0.05), new THREE.MeshBasicMaterial({ color: 0xff2424 }), -0.6, 0.78, 2.2);
    add(box(0.52, 0.12, 0.05), new THREE.MeshBasicMaterial({ color: 0xff2424 }), 0.6, 0.78, 2.2);
    // wheels
    var wheels = [];
    [[-0.88, -1.35], [0.88, -1.35], [-0.88, 1.35], [0.88, 1.35]].forEach(function (p) {
      var w = new THREE.Mesh(cyc, darkMat);
      w.position.set(p[0], 0.42, p[1]);
      g.add(w);
      wheels.push(w);
    });
    // glow sprites
    var headGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: T_GLOW, color: 0xfff0c0, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 0.85, depthWrite: false, fog: false }));
    headGlow.position.set(0, 0.85, -2.7); headGlow.scale.set(4.6, 4.6, 1);
    g.add(headGlow);
    var tailGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: T_TAIL, color: 0xff3030, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 0.8, depthWrite: false, fog: false }));
    tailGlow.position.set(0, 0.8, 2.35); tailGlow.scale.set(5.0, 5.0, 1);
    g.add(tailGlow);
    // blob shadow
    var blob = new THREE.Mesh(new THREE.CircleGeometry(1, 20),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5, depthWrite: false }));
    blob.rotation.x = -Math.PI / 2;
    blob.scale.set(4.6, 2.8, 1);
    blob.position.y = 0.035;
    g.add(blob);
    g.userData.wheels = wheels;
    return g;
  }

  function addHeadlightRig(car) {
    var spotGeoIntensity = 1.7;
    var mkSpot = function (x) {
      var s = new THREE.SpotLight(0xfff0c0, spotGeoIntensity, 130, 0.5, 0.55, 2);
      s.position.set(x, 0.9, -1.4);
      var t = new THREE.Object3D();
      t.position.set(x, -0.6, -32);
      car.add(s, t);
      s.target = t;
      return s;
    };
    var sL = mkSpot(-0.85);
    var sR = mkSpot(0.85);
    car.userData.spots = [sL, sR];
    // visible beam cones
    var coneMat = new THREE.MeshBasicMaterial({
      color: 0xfff1c0, transparent: true, opacity: 0.055,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
    var coneGeo = new THREE.ConeGeometry(3.4, 30, 12, 1, true);
    var mkCone = function (x) {
      var c = new THREE.Mesh(coneGeo, coneMat);
      c.rotation.x = -Math.PI / 2 + 0.16;
      c.position.set(x, 0.5, -9);
      car.add(c);
      return c;
    };
    mkCone(-0.9);
    mkCone(0.9);
  }

  // Player car
  var player = buildCar(0x8f1626);
  addHeadlightRig(player);
  scene.add(player);

  // Oncoming traffic
  var oncoming = [0x4a6b8a, 0x6b6a4a, 0x3c4a58].map(function (paint, i) {
    var g = buildCar(paint);
    g.rotation.y = Math.PI;
    g.position.set(-2.9 - Math.random(), 0, -240 - i * 200);
    scene.add(g);
    return { group: g, speed: rand(20, 28), x: -2.9 - Math.random(), t: Math.random() * 10 };
  });

  // ------------------------------------------------------------------
  // 10. Input state
  // ------------------------------------------------------------------
  var keys = { up: false, down: false, left: false, right: false };
  var touchSteer = 0;

  var kName = function (code) {
    return code === 'ArrowUp' || code === 'KeyW' ? 'up' :
           code === 'ArrowDown' || code === 'KeyS' ? 'down' :
           code === 'ArrowLeft' || code === 'KeyA' ? 'left' :
           code === 'ArrowRight' || code === 'KeyD' ? 'right' : null;
  };
  window.addEventListener('keydown', function (e) {
    var k = kName(e.code);
    if (k) { keys[k] = true; e.preventDefault(); }
    firstInteraction();
  });
  window.addEventListener('keyup', function (e) {
    var k = kName(e.code);
    if (k) keys[k] = false;
  });
  window.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    touchSteer = t.clientX < window.innerWidth / 2 ? -1 : 1;
    firstInteraction();
  }, { passive: true });
  window.addEventListener('touchend', function () { touchSteer = 0; }, { passive: true });
  window.addEventListener('pointerdown', firstInteraction, { passive: true });

  // ------------------------------------------------------------------
  // 11. Audio
  // ------------------------------------------------------------------
  var audioCtx = null, engineOsc, engineOsc2, engineGain, windSrc, windGain;
  var soundOn = true;

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    audioCtx = ctx;
    engineGain = ctx.createGain();
    engineGain.gain.value = 0;
    var filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 620; filt.Q.value = 3;
    engineOsc = ctx.createOscillator(); engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 70;
    engineOsc2 = ctx.createOscillator(); engineOsc2.type = 'triangle'; engineOsc2.frequency.value = 35;
    var sub = ctx.createGain(); sub.gain.value = 0.6;
    engineOsc.connect(filt); engineOsc2.connect(filt); filt.connect(engineGain);
    engineGain.connect(ctx.destination);
    engineOsc.start(); engineOsc2.start();
    // wind / road noise
    var len = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    windSrc = ctx.createBufferSource(); windSrc.buffer = buf; windSrc.loop = true;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.4;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    windSrc.connect(bp); bp.connect(windGain); windGain.connect(ctx.destination);
    windSrc.start();
  }

  function updateAudio(s) {
    if (!audioCtx) return;
    engineOsc.frequency.value = 55 + s * 175 + Math.sin(performance.now() * 0.04) * 2;
    engineOsc2.frequency.value = 28 + s * 85;
    engineGain.gain.value = soundOn ? (0.05 + s * 0.05) : 0;
    windGain.gain.value = soundOn ? s * s * 0.12 : 0;
  }

  function thud() {
    if (!audioCtx || !soundOn) return;
    var t = audioCtx.currentTime;
    var buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.25, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var g = audioCtx.createGain(); g.gain.value = 0.5;
    var f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t);
  }

  function firstInteraction() {
    if (soundOn) initAudio();
    showHint();
  }

  var hintShown = false;
  function showHint() {
    var h = document.getElementById('hint');
    if (!hintShown) {
      h.style.opacity = '0.85';
      hintShown = true;
    }
  }

  var soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'sound on' : 'sound off';
    if (soundOn) initAudio();
  });

  function flash(o) {
    var el = document.getElementById('flash');
    el.style.transition = 'none';
    el.style.opacity = o;
    requestAnimationFrame(function () {
      el.style.transition = 'opacity 450ms';
      el.style.opacity = '0';
    });
  }

  // ------------------------------------------------------------------
  // 12. Driving state
  // ------------------------------------------------------------------
  var speed = 30;
  var heading = 0;
  var distance = 0;
  var shake = 0;
  var crashCd = 0;
  var camLook = new THREE.Vector3(0, 1, -26);
  var camPos = new THREE.Vector3(0, 3.0, 10.5);

  function onCrash(dir, strong) {
    if (crashCd > 0) return;
    crashCd = strong ? 1.2 : 0.8;
    speed *= strong ? 0.35 : 0.55;
    heading += dir * 0.14;
    shake = Math.max(shake, strong ? 1 : 0.7);
    flash(strong ? 0.6 : 0.35);
    thud();
  }

  // ------------------------------------------------------------------
  // 13. HUD
  // ------------------------------------------------------------------
  var speedEl = document.getElementById('speedVal');
  var distEl = document.getElementById('distVal');

  // ------------------------------------------------------------------
  // 14. Main loop
  // ------------------------------------------------------------------
  var time = 0;
  var last = performance.now();
  var hudAccum = 0;
  var tstart = performance.now();

  function loop() {
    requestAnimationFrame(loop);
    var now = performance.now();
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    var carZ = player.position.z;

    // -- steering / speeding --
    var steer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0) + touchSteer;
    var accel = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);

    var speedFactor = clamp((speed - SPEED_MIN) / (SPEED_MAX - SPEED_MIN), 0, 1);
    heading += steer * (0.85 + speedFactor * 0.15) * dt;
    heading *= (1 - 0.55 * dt); // auto-straighten

    speed += accel * 30 * dt;
    speed = clamp(speed, SPEED_MIN, SPEED_MAX);

    // off-road drag / soft wall
    var absX = Math.abs(player.position.x);
    if (absX > ROAD_HALF) {
      var rumble = Math.min(1, (absX - ROAD_HALF) / 14);
      speed *= (1 - 1.5 * rumble * dt);
      shake = Math.max(shake, rumble * 0.5);
    }
    if (absX > 34) { // very far off-road — nudge back
      var dirx = -Math.sign(player.position.x);
      player.position.x += dirx * 8 * dt;
      onCrash(dirx, false);
    }

    // -- move car --
    var fwd = speed * dt;
    player.position.x += Math.sin(heading) * fwd;
    player.position.z -= Math.cos(heading) * fwd;
    player.rotation.y = heading;
    // body roll & pitch
    player.rotation.z = lerp(player.rotation.z, -steer * 0.02, Math.min(1, dt * 6));
    distance += fwd;

    // wheel spin
    var spin = speed / 0.42 * dt;
    player.userData.wheels.forEach(function (w) { w.rotation.x += spin; });

    // headlight flicker
    if (player.userData.spots) {
      var flick = 1 + Math.sin(time * 13) * 0.03 + Math.sin(time * 29) * 0.02;
      player.userData.spots.forEach(function (s) { s.intensity = 1.7 * flick; });
    }

    // -- crash: trees / oncoming --
    if (crashCd > 0) crashCd -= dt;
    var hitTree = false;
    treeScrollers.forEach(function (sc) {
      for (var i = 0; i < sc.states.length; i++) {
        var ts = sc.states[i];
        var dz = ts.z - player.position.z;
        if (dz > -6 && dz < 6) {
          var dx = ts.x - player.position.x;
          if (dx * dx + dz * dz < 3.4) { hitTree = true; break; }
        }
      }
    });
    if (hitTree) { onCrash(-Math.sign(player.position.x), true); }

    // -- scroll world --
    treeScrollers.forEach(function (sc) { sc.update(carZ); });
    rockScroller.update(carZ);
    dashScroller.update(carZ);
    postScroller.update(carZ);
    updateLamps(carZ, time);

    // move road-aligned statics
    var roadZ = carZ - AHEAD / 2;
    road.position.z = roadZ;
    ground.position.z = roadZ;
    edgeL.position.z = roadZ;
    edgeR.position.z = roadZ;
    ridges.forEach(function (r) { r.position.z = roadZ; });

    // -- oncoming traffic --
    oncoming.forEach(function (o) {
      o.group.position.z += (o.speed + speed) * dt;
      o.group.position.x = o.x + Math.sin(time * 0.6 + o.t) * 0.3;
      o.group.userData.wheels.forEach(function (w) { w.rotation.x += o.speed / 0.42 * dt; });
      if (o.group.position.z > carZ + 55) {
        o.group.position.z = carZ - 330 - Math.random() * 230;
        o.x = -2.6 - Math.random() * 1.0;
        o.speed = rand(19, 28);
      }
      var dcx = player.position.x - o.group.position.x;
      var dcz = player.position.z - o.group.position.z;
      if (Math.abs(dcx) < 2.0 && Math.abs(dcz) < 5.5) onCrash(Math.sign(dcx) || 1, true);
    });

    // -- fog patches --
    updateFog(speed, dt);

    // -- stars / moon --
    stars1.obj.rotation.y = time * 0.0017;
    stars2.obj.rotation.y = time * 0.0021;
    stars1.mat.opacity = 0.8 + Math.sin(time * 0.7) * 0.07;
    stars2.mat.opacity = 0.85 + Math.sin(time * 0.5 + 1) * 0.1;
    moonGlow.scale.set(260 + Math.sin(time * 0.6) * 6, 260 + Math.sin(time * 0.6) * 6, 1);

    // -- camera chase --
    var camDist = 10.5 + speedFactor * 3.0;
    var camH = 2.9 + speedFactor * 0.5;
    var tx = player.position.x - Math.sin(heading) * camDist;
    var tz = player.position.z + Math.cos(heading) * camDist;
    var ty = player.position.y + camH;
    var s = 1 - Math.exp(-5.5 * dt);
    camPos.x = lerp(camPos.x, tx, s);
    camPos.y = lerp(camPos.y, ty, s);
    camPos.z = lerp(camPos.z, tz, s);
    var lx = player.position.x - Math.sin(heading) * 30;
    var lz = player.position.z + Math.cos(heading) * 30;
    camLook.x = lerp(camLook.x, lx, s);
    camLook.y = lerp(camLook.y, player.position.y + 1.1, s);
    camLook.z = lerp(camLook.z, lz, s);

    var targetShake = speedFactor * 0.4 + (absX > ROAD_HALF ? rumble * 0.9 : 0) + (shake > 0 ? shake : 0);
    shake = Math.max(0, shake - dt * 2.2);
    targetShake = Math.min(targetShake, 1);
    var sh = targetShake;
    camera.position.set(
      camPos.x + (Math.random() - 0.5) * sh * 0.5,
      camPos.y + (Math.random() - 0.5) * sh * 0.4,
      camPos.z
    );
    camera.lookAt(camLook);
    camera.rotation.z = (Math.random() - 0.5) * sh * 0.02 - steer * 0.01;

    // FOV with speed
    var tgtFov = 58 + speedFactor * 16;
    camera.fov = lerp(camera.fov, tgtFov, Math.min(1, dt * 3));
    camera.updateProjectionMatrix();

    // -- audio --
    updateAudio(speedFactor);

    // -- HUD (throttled) --
    hudAccum += dt;
    if (hudAccum > 0.1) {
      hudAccum = 0;
      speedEl.textContent = Math.round(speed * 3.6);
      var km = distance / 1000;
      var mins = Math.floor((now - tstart) / 60000);
      var secs = Math.floor((now - tstart) / 1000) % 60;
      distEl.innerHTML = km.toFixed(1) + ' km';
      document.getElementById('distSub').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs + ' of night';
    }

    renderer.render(scene, camera);
  }

  loop();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
