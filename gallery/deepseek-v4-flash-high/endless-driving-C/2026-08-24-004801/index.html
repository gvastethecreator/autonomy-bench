<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Night Drive — Endless Asphalt</title>
<style>
  :root{
    --ink: #e6edfb;
    --dim: rgba(178,196,232,0.55);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

  /* ---- cinematic overlays ---- */
  #vignette{ position:fixed; inset:0; z-index:6; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, transparent 52%, rgba(0,0,0,0.42) 82%, rgba(0,0,0,0.78) 100%); }
  #grain{ position:fixed; inset:-120px; z-index:7; pointer-events:none; opacity:0.05;
    background-repeat:repeat; animation:grain 1.1s steps(5) infinite; }
  @keyframes grain{
    0%{ transform:translate(0,0); } 20%{ transform:translate(-26px,20px); }
    40%{ transform:translate(18px,-28px); } 60%{ transform:translate(-14px,-16px); }
    80%{ transform:translate(24px,22px); } 100%{ transform:translate(0,0); } }
  .bar{ position:fixed; left:0; right:0; height:6vh; background:#000; z-index:8; transition:height .6s cubic-bezier(.2,.8,.2,1); }
  #lbTop{ top:0; } #lbBot{ bottom:0; }
  body.boost .bar{ height:10.5vh; }

  #flash{ position:fixed; inset:0; background:#dce8ff; opacity:0; pointer-events:none; z-index:20; }

  /* ---- HUD ---- */
  #hud{ position:fixed; inset:0; z-index:10; pointer-events:none; color:var(--ink); }
  #speed{ position:absolute; right:36px; bottom:34px; text-align:right; }
  #kmh{ font-size:52px; font-weight:200; letter-spacing:.04em; line-height:1;
    font-variant-numeric:tabular-nums; text-shadow:0 1px 18px rgba(0,0,0,.6); }
  #speed small{ display:block; margin-top:4px; font-size:11px; letter-spacing:.42em; color:var(--dim); }
  #odo{ position:absolute; left:36px; bottom:34px; font-size:11px; letter-spacing:.28em; color:var(--dim);
    text-transform:uppercase; }
  #hintline{ position:absolute; left:36px; bottom:88px; font-size:10px; letter-spacing:.3em; color:rgba(150,170,210,.35);
    text-transform:uppercase; }
  #sound{ position:absolute; top:26px; right:30px; font-size:15px; letter-spacing:.1em; color:rgba(200,216,245,.6);
    pointer-events:auto; cursor:pointer; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12);
    padding:8px 14px; border-radius:999px; user-select:none; transition:all .25s; z-index:11; }
  #sound:hover{ background:rgba(255,255,255,.1); color:#fff; }
  #sound.off{ opacity:.45; }

  #hint{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:12; color:var(--dim);
    font-size:11px; letter-spacing:.34em; text-transform:uppercase; opacity:0; transition:opacity 1.2s; }
  #hint.show{ opacity:.75; }

  /* ---- title ---- */
  #title{ position:fixed; inset:0; z-index:12; display:flex; flex-direction:column; align-items:center;
    justify-content:center; pointer-events:none; opacity:0;
    animation:titleIn 3.4s ease .3s forwards; }
  @keyframes titleIn{
    0%{ opacity:0; } 8%{ opacity:1; } 30%{ opacity:1; } 100%{ opacity:0; } }
  #title h1{ font-size:52px; font-weight:300; letter-spacing:.38em; text-indent:.38em; color:rgba(232,240,255,.94);
    text-shadow:0 0 40px rgba(120,160,255,.25); }
  #title p{ margin-top:18px; font-size:11px; letter-spacing:.34em; text-indent:.34em; text-transform:uppercase;
    color:rgba(176,194,230,.5); }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="lbTop" class="bar"></div>
  <div id="lbBot" class="bar"></div>
  <div id="flash"></div>

  <div id="hud">
    <div id="speed"><span id="kmh">0</span><small>KM/H</small></div>
    <div id="odo">TRIP 0.0 KM</div>
    <div id="hintline">HOLD SHIFT &nbsp;·&nbsp; BOOST</div>
    <div id="sound" class="off">♪&nbsp; SOUND</div>
  </div>

  <div id="hint" class="show">CLICK FOR SOUND</div>

  <div id="title">
    <h1>NIGHT DRIVE</h1>
    <p>endless asphalt &nbsp;·&nbsp; keep your lights on</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

  // =========================================================================
  //  CONFIG
  // =========================================================================
  const CFG = {
    wrapLength: 4000,          // road is periodic every 4000 m
    roadWidth: 16,
    roadHalf: 8,
    ourLane: 2.6,
    oncomingLane: -2.6,
    repeatLen: 20,             // texture repeat per road metre group
    curveA1: 42, curveA2: 14, phase2: 1.7,
    cruiseBase: 40,            // m/s ~ 144 km/h
    cruiseDrift: 9,            // slow drift upward over minutes
    boost: 26,                 // m/s added while boosting
    fogDensity: 0.00155,
    fogDrift: 0.00042,         // extra fog added over the first two minutes
    cameraDist: 8.1, cameraHeight: 2.5,
    lookAhead: 3.0, lookHeight: 1.0,
    fovBase: 62,
    rainCount: 3400,
    streetlightSpacing: 40,
    reflectorSpacing: 16,
    treeSpacing: 55,
  };

  // =========================================================================
  //  RENDERER / SCENE / CAMERA
  // =========================================================================
  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('scene'),
    antialias: true,
    powerPreference: 'high-performance',
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.07;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const FOG_COLOR = 0x0a0f1a;
  scene.background = new THREE.Color(FOG_COLOR);
  scene.fog = new THREE.FogExp2(FOG_COLOR, CFG.fogDensity);

  const camera = new THREE.PerspectiveCamera(CFG.fovBase, window.innerWidth / window.innerHeight, 0.1, 5200);

  // =========================================================================
  //  ROAD CURVE (periodic, seamless)
  // =========================================================================
  const L = CFG.wrapLength;
  const W2PI = Math.PI * 2;
  function roadX(z){
    return CFG.curveA1 * Math.sin(W2PI * z / L)
         + CFG.curveA2 * Math.sin(W2PI * z / L * 2 + CFG.phase2);
  }
  function roadDX(z){
    const w = W2PI / L;
    return CFG.curveA1 * w * Math.cos(W2PI * z / L)
         + CFG.curveA2 * w * 2 * Math.cos(W2PI * z / L * 2 + CFG.phase2);
  }
  function roadD2X(z){
    const w = W2PI / L;
    return -CFG.curveA1 * w * w * Math.sin(W2PI * z / L)
           - CFG.curveA2 * w * w * 4 * Math.sin(W2PI * z / L * 2 + CFG.phase2);
  }
  const _t = new THREE.Vector3();
  function tangentAt(z, out){
    const dx = roadDX(z);
    const len = Math.hypot(dx, 1);
    out.set(dx / len, 0, 1 / len);
    return out;
  }

  // =========================================================================
  //  TEXTURE HELPERS
  // =========================================================================
  function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  function radialTexture(size, stops){
    const c = makeCanvas(size, size), x = c.getContext('2d');
    const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    for (const [o, col] of stops) g.addColorStop(o, col);
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }

  function streakTexture(){
    const c = makeCanvas(64, 256), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, 'rgba(190,210,240,0)');
    g.addColorStop(0.45, 'rgba(215,228,250,0.9)');
    g.addColorStop(0.55, 'rgba(215,228,250,0.9)');
    g.addColorStop(1, 'rgba(190,210,240,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 256);
    const gx = x.createLinearGradient(0, 0, 64, 0);
    gx.addColorStop(0, 'rgba(255,255,255,0)');
    gx.addColorStop(0.5, 'rgba(255,255,255,0.85)');
    gx.addColorStop(1, 'rgba(255,255,255,0)');
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = gx; x.fillRect(0, 0, 64, 256);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  function asphaltTexture(){
    const S = 512, H = 1024;
    const c = makeCanvas(S, H), x = c.getContext('2d');
    x.fillStyle = '#191b20'; x.fillRect(0, 0, S, H);
    for (let i = 0; i < 9000; i++){
      const g = 36 + Math.random() * 62 | 0;
      x.fillStyle = `rgba(${g},${g},${g + 8},${0.03 + Math.random() * 0.09})`;
      x.fillRect(Math.random() * S, Math.random() * H, 1 + Math.random() * 2, 1 + Math.random() * 3);
    }
    x.fillStyle = 'rgba(8,10,14,0.22)';
    x.fillRect(S * 0.24, 0, S * 0.10, H);
    x.fillRect(S * 0.66, 0, S * 0.10, H);
    for (let i = 0; i < 46; i++){
      x.fillStyle = `rgba(${8 + Math.random() * 22 | 0},${10 + Math.random() * 22 | 0},${14 + Math.random() * 24 | 0},0.14)`;
      x.fillRect(Math.random() * S, Math.random() * H, 40 + Math.random() * 130, 40 + Math.random() * 220);
    }
    // solid edge lines
    x.fillStyle = 'rgba(212,219,228,0.82)';
    x.fillRect(S * 0.045, 0, 6, H);
    x.fillRect(S * 0.955 - 6, 0, 6, H);
    // dashed centre line: 512 px period = 10 m -> 3.9 m dash
    x.fillStyle = 'rgba(226,230,236,0.9)';
    for (let y = 0; y < H; y += 512) x.fillRect(S * 0.5 - 3, y, 6, 200);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  // =========================================================================
  //  ENVIRONMENT (PMREM) — dark sky + warm lamps for wet-road reflections
  // =========================================================================
  function buildEnvironment(){
    const es = new THREE.Scene();
    es.background = new THREE.Color(0x05070d);

    const skyTex = makeCanvas(4, 512);
    {
      const x = skyTex.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, '#0b1220');
      g.addColorStop(0.6, '#05070d');
      g.addColorStop(1, '#000000');
      x.fillStyle = g; x.fillRect(0, 0, 4, 512);
    }
    const skyMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(skyTex), side: THREE.BackSide });
    const dome = new THREE.Mesh(new THREE.SphereGeometry(80, 8, 24), skyMat);
    dome.scale.y = 0.7;
    es.add(dome);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160),
      new THREE.MeshBasicMaterial({ color: 0x04060a }));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -8;
    es.add(ground);

    const lamp = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd9a0 }));
    const lamps = [];
    for (let i = 0; i < 10; i++){
      const m = lamp.clone();
      const a = (i / 10) * Math.PI * 2;
      m.position.set(Math.cos(a) * 34, 7 + (i % 3) * 6, Math.sin(a) * 34);
      es.add(m); lamps.push(m);
    }
    const moon = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xdce6f5 }));
    moon.position.set(-40, 42, -30); es.add(moon);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const rt = pmrem.fromScene(es, 0.03);
    pmrem.dispose();
    scene.environment = rt.texture;
  }

  // =========================================================================
  //  WORLD GROUP (scrolls) + static scenery
  // =========================================================================
  const world = new THREE.Group();
  scene.add(world);

  // ---- road ribbon -------------------------------------------------------
  function buildRoad(){
    const Z0 = -400, Z1 = L + 1500, step = 4;
    const n = Math.floor((Z1 - Z0) / step);
    const pos = new Float32Array((n + 1) * 2 * 3);
    const nor = new Float32Array((n + 1) * 2 * 3);
    const uv  = new Float32Array((n + 1) * 2 * 2);
    const idx = [];
    const half = CFG.roadHalf;
    for (let i = 0; i <= n; i++){
      const z = Z0 + i * step;
      const x = roadX(z);
      const t = tangentAt(z, _t);
      const px = -t.z, pz = t.x;               // perpendicular in XZ
      const lx = x + px * half, lz = z + pz * half;
      const rx = x - px * half, rz = z - pz * half;
      const o = i * 6;
      pos[o] = lx; pos[o+1] = 0; pos[o+2] = lz;
      pos[o+3] = rx; pos[o+4] = 0; pos[o+5] = rz;
      nor[o] = 0; nor[o+1] = 1; nor[o+2] = 0;
      nor[o+3] = 0; nor[o+4] = 1; nor[o+5] = 0;
      uv[o/3*2] = 0; uv[o/3*2+1] = (z - Z0) / CFG.repeatLen;
      uv[o/3*2+2] = 1; uv[o/3*2+3] = (z - Z0) / CFG.repeatLen;
      if (i < n){
        const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
        idx.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setIndex(idx);
    const mat = new THREE.MeshStandardMaterial({
      map: asphaltTexture(),
      roughness: 0.26,
      metalness: 0.12,
      envMapIntensity: 1.35,
    });
    const road = new THREE.Mesh(g, mat);
    road.receiveShadow = true;
    world.add(road);
    return road;
  }

  // ---- terrain ------------------------------------------------------------
  function buildTerrain(){
    const mat = new THREE.MeshStandardMaterial({ color: 0x0a0d13, roughness: 1, metalness: 0 });
    const t = new THREE.Mesh(new THREE.CircleGeometry(2800, 48), mat);
    t.rotation.x = -Math.PI / 2; t.position.y = -0.12;
    t.receiveShadow = true;
    scene.add(t);
  }

  // ---- mountains (two fog-faded silhouette rings) -------------------------
  function buildMountains(){
    const merge = (rad, count, hMin, hMax, wMin, wMax, col) => {
      const geos = [];
      const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 1 });
      for (let i = 0; i < count; i++){
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.12;
        const r = rad * (0.88 + Math.random() * 0.24);
        const w = wMin + Math.random() * (wMax - wMin);
        const h = hMin + Math.random() * (hMax - hMin);
        const d = 60 + Math.random() * 120;
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(Math.cos(a) * r, h / 2 - 2, Math.sin(a) * r);
        m.rotation.y = -a + Math.PI / 2;
        m.updateMatrix();
        geos.push(m.geometry.clone().applyMatrix4(m.matrix).toNonIndexed());
      }
      const mesh = new THREE.Mesh(mergeGeometries(geos), mat);
      mesh.frustumCulled = false;
      scene.add(mesh);
    };
    merge(1750, 30, 70, 240, 160, 420, 0x0b0f1c);
    merge(1180, 26, 40, 150, 110, 300, 0x0a0d18);
    merge(760, 22, 20, 90, 70, 200, 0x090c15);
  }

  // ---- stars + moon --------------------------------------------------------
  function buildSky(){
    const soft = radialTexture(64, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.5)'], [1, 'rgba(255,255,255,0)']]);
    for (let layer = 0; layer < 3; layer++){
      const N = 900;
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      for (let i = 0; i < N; i++){
        const a = Math.random() * Math.PI * 2;
        const e = Math.acos(1 - Math.random() * 0.95);      // upper hemisphere
        const r = 2850;
        pos[i*3] = Math.cos(a) * Math.sin(e) * r;
        pos[i*3+1] = Math.cos(e) * r + 120;
        pos[i*3+2] = Math.sin(a) * Math.sin(e) * r;
        const warm = Math.random();
        const b = 0.55 + Math.random() * 0.45;
        col[i*3] = (0.7 + warm * 0.3) * b;
        col[i*3+1] = (0.75 + warm * 0.15) * b;
        col[i*3+2] = b;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const m = new THREE.PointsMaterial({
        size: 1.5 + layer * 0.35, sizeAttenuation: false, map: soft, transparent: true,
        depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, opacity: 0.8, fog: false,
      });
      const p = new THREE.Points(g, m);
      p.frustumCulled = false;
      scene.add(p);
    }

    const moonDisc = radialTexture(128, [[0, 'rgba(240,246,255,1)'], [0.4, 'rgba(225,236,252,0.9)'], [1, 'rgba(225,236,252,0)']]);
    const moonGlow = radialTexture(256, [[0, 'rgba(190,214,255,0.5)'], [0.3, 'rgba(150,180,240,0.18)'], [1, 'rgba(150,180,240,0)']]);
    const disc = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonDisc, transparent: true, fog: false, depthWrite: false }));
    disc.position.set(-820, 980, 2150); disc.scale.set(150, 150, 1);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonGlow, transparent: true, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
    glow.position.copy(disc.position); glow.scale.set(460, 460, 1);
    scene.add(disc, glow);
  }

  // ---- streetlights --------------------------------------------------------
  const streetlights = [];
  function buildStreetlights(){
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x171a20, roughness: 0.55, metalness: 0.5 });
    const lampMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffcf8a, emissiveIntensity: 5 });
    const beamTex = makeCanvas(128, 256);
    {
      const x = beamTex.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, 'rgba(255,214,150,0.55)');
      g.addColorStop(0.4, 'rgba(255,205,140,0.16)');
      g.addColorStop(1, 'rgba(255,205,140,0)');
      x.fillStyle = g; x.fillRect(0, 0, 128, 256);
    }
    const beamTexT = new THREE.CanvasTexture(beamTex);
    beamTexT.colorSpace = THREE.SRGBColorSpace;
    const beamMat = new THREE.MeshBasicMaterial({
      map: beamTexT, transparent: true, opacity: 0.55, depthWrite: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    });
    const poolTex = radialTexture(256, [[0, 'rgba(255,196,120,0.85)'], [0.35, 'rgba(255,180,100,0.35)'], [1, 'rgba(255,170,90,0)']]);
    poolTex.colorSpace = THREE.SRGBColorSpace;
    const poolMat = new THREE.MeshBasicMaterial({
      map: poolTex, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending,
    });

    const Z0 = -400, Z1 = L + 1500, sp = CFG.streetlightSpacing;
    const count = Math.floor((Z1 - Z0) / sp);
    for (let i = 0; i <= count; i++){
      const baseZ = Z0 + i * sp;
      const side = (i % 2 === 0) ? 1 : -1;
      const x = roadX(baseZ);
      const g = new THREE.Group();

      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, 9.2, 6), poleMat);
      pole.position.set(x + side * 5.6, 4.6, baseZ);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.12, 0.12), poleMat);
      arm.position.set(x + side * 2.8, 8.9, baseZ);
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.16, 0.42), lampMat);
      lamp.position.set(x + side * 2.9, 8.75, baseZ);

      const beam = new THREE.Mesh(new THREE.ConeGeometry(4.4, 8.6, 12, 1, true), beamMat);
      beam.position.set(x + side * 2.9, 4.3, baseZ);

      const pool = new THREE.Mesh(new THREE.PlaneGeometry(13, 17), poolMat);
      pool.rotation.x = -Math.PI / 2;
      pool.position.set(x + side * 2.9, 0.04, baseZ);
      pool.renderOrder = 2;

      const light = new THREE.PointLight(0xffcf8a, 4200, 90, 2);
      light.position.set(x + side * 2.9, 7.4, baseZ);

      g.add(pole, arm, lamp, beam, pool, light);
      world.add(g);
      streetlights.push({ group: g, light, baseZ, side });
    }
  }

  // ---- reflector posts (instanced) ----------------------------------------
  function buildReflectors(){
    const Z0 = -400, Z1 = L + 1500, sp = CFG.reflectorSpacing;
    const n = Math.floor((Z1 - Z0) / sp) + 1;
    const geo = new THREE.BoxGeometry(0.12, 0.9, 0.12);
    const mk = (col) => {
      const m = new THREE.MeshStandardMaterial({
        color: 0x000000, emissive: col, emissiveIntensity: 2.6, roughness: 0.4,
      });
      const im = new THREE.InstancedMesh(geo, m, n);
      const d = new THREE.Object3D();
      for (let i = 0; i < n; i++){
        const baseZ = Z0 + i * sp;
        d.position.set(roadX(baseZ), 0.45, baseZ);
        d.rotation.set(0, 0, 0);
        d.scale.set(1, 1, 1);
        d.updateMatrix();
        im.setMatrixAt(i, d.matrix);
      }
      im.instanceMatrix.needsUpdate = true;
      world.add(im);
      return im;
    };

  // ---- trees (merged silhouettes) -----------------------------------------
  function buildTrees(){
    const Z0 = -400, Z1 = L + 1500, sp = CFG.treeSpacing;
    const n = Math.floor((Z1 - Z0) / sp);
    const geos = [];
    const mat = new THREE.MeshStandardMaterial({ color: 0x070a10, roughness: 1 });
    for (let i = 0; i < n; i++){
      const baseZ = Z0 + i * sp + (Math.random() - 0.5) * 18;
      if (Math.random() < 0.18) continue;              // occasional gap
      const side = (Math.random() < 0.5) ? 1 : -1;
      const s = 0.7 + Math.random() * 0.7;
      const x = roadX(baseZ) + side * (8.6 + Math.random() * 4.5);
      const trunk = new THREE.CylinderGeometry(0.16 * s, 0.28 * s, 2.8 * s, 5).toNonIndexed();
      trunk.translate(0, 1.4 * s, 0);
      const top = new THREE.ConeGeometry(2.0 * s, 5.4 * s, 6).toNonIndexed();
      top.translate(0, 4.6 * s, 0);
      let g = mergeGeometries([trunk, top]);
      g.applyMatrix4(new THREE.Matrix4().makeTranslation(x, 0, baseZ));
      geos.push(g);
    }
    const mesh = new THREE.Mesh(mergeGeometries(geos), mat);
    mesh.castShadow = true;
    mesh.frustumCulled = false;
    world.add(mesh);
  }

      map: beamTexT, transparent: true, opacity: 0.5, depthWrite: false,

      map: poolTexT, transparent: true, opacity: 0.42, depthWrite: false, blending: THREE.AdditiveBlending,
    });

  // =========================================================================
  //  AUDIO (procedural — rain, wind, engine, thunder)
  // =========================================================================
  let AC = null, master, engGain, engOsc1, engOsc2, engFilt, rainGain, windGain, windFilt;
  let soundOn = false;

  function initAudio(){
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);

      const len = AC.sampleRate * 2;
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      // rain
      rainGain = AC.createGain(); rainGain.gain.value = 0.06;
      const rSrc = AC.createBufferSource(); rSrc.buffer = buf; rSrc.loop = true;
      const rFilt = AC.createBiquadFilter(); rFilt.type = 'bandpass'; rFilt.frequency.value = 2600; rFilt.Q.value = 0.45;
      rSrc.connect(rFilt); rFilt.connect(rainGain); rainGain.connect(master); rSrc.start();

      // wind
      windGain = AC.createGain(); windGain.gain.value = 0.035;
      const wSrc = AC.createBufferSource(); wSrc.buffer = buf; wSrc.loop = true;
      windFilt = AC.createBiquadFilter(); windFilt.type = 'bandpass'; windFilt.frequency.value = 400; windFilt.Q.value = 1.6;
      wSrc.connect(windFilt); windFilt.connect(windGain); windGain.connect(master); wSrc.start();
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.13;
      const lfoG = AC.createGain(); lfoG.gain.value = 260;
      lfo.connect(lfoG); lfoG.connect(windFilt.frequency); lfo.start();

      // engine
      engGain = AC.createGain(); engGain.gain.value = 0.0;
      engFilt = AC.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.frequency.value = 320;
      engOsc1 = AC.createOscillator(); engOsc1.type = 'sawtooth'; engOsc1.frequency.value = 55;
      engOsc2 = AC.createOscillator(); engOsc2.type = 'sine'; engOsc2.frequency.value = 28;
      const engG = AC.createGain(); engG.gain.value = 0.5;
      engOsc1.connect(engFilt); engOsc2.connect(engFilt); engFilt.connect(engG); engG.connect(engGain); engGain.connect(master);
      engOsc1.start(); engOsc2.start();
    } catch (e) { AC = null; }
  }
  function setSound(on){
    soundOn = on;
    document.getElementById('sound').classList.toggle('off', !on);
    document.getElementById('sound').textContent = on ? '♪ SOUND ON' : '♪ SOUND OFF';
    if (!AC) return;
    const t = AC.currentTime;
    if (on){
      master.gain.cancelScheduledValues(t);
      master.gain.linearRampToValueAtTime(0.55, t + 1.2);
    } else {
      master.gain.cancelScheduledValues(t);
      master.gain.linearRampToValueAtTime(0.0001, t + 0.4);
    }
  }
  function updateAudio(dt){
    if (!AC || !soundOn) return;
    const f = 44 + speed * 1.7 + boost * 1.3;
    engOsc1.frequency.setTargetAtTime(f, AC.currentTime, 0.08);
    engOsc2.frequency.setTargetAtTime(f * 0.5, AC.currentTime, 0.08);
    engGain.gain.setTargetAtTime(0.085 + boost * 0.0012, AC.currentTime, 0.2);
    rainGain.gain.setTargetAtTime(0.055 + rainIntensity * 0.02, AC.currentTime, 0.3);
    windGain.gain.setTargetAtTime(0.03 + Math.min(1, speed / 55) * 0.025 + boost * 0.0006, AC.currentTime, 0.3);
  }
  function thunder(){
    if (!AC || !soundOn) return;
    try {
      const dur = 2.2 + Math.random() * 2;
      const src = AC.createBufferSource();
      const b = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      src.buffer = b;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 120 + Math.random() * 140;
      const g = AC.createGain();
      const now = AC.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.4 + Math.random() * 0.4, now + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(lp); lp.connect(g); g.connect(master);
      src.start(now);
      src.stop(now + dur + 0.2);
    } catch (e) {}
  }

  const clock = new THREE.Clock();

  // =========================================================================
  //  MAIN LOOP
  // =========================================================================
  function frame(){
    const dt = Math.min(0.05, clock.getDelta());
    t += dt;
    if (t < 5) rainIntensity += (1 - rainIntensity) * (1 - Math.exp(-dt * 1.5));

    // ---- cruise profile ----
    const cruise = CFG.cruiseBase
      + CFG.cruiseDrift * Math.min(1, t / 130)
      + Math.sin(t * 0.021) * 9
      + Math.sin(t * 0.047 + 1.3) * 5.5;
    const target = cruise + (boostHeld ? CFG.boost : 0);
    const k = boostHeld ? 1.6 : 1.1;
    speed += (target - speed) * (1 - Math.exp(-dt * k));
    boost = boostHeld ? Math.min(CFG.boost, speed - cruise) : 0;
    if (boost < 0) boost = 0;

    carZ = (carZ + speed * dt) % L;
    scroll = carZ;
    trip += speed * dt / 1000;
    world.position.z = -scroll;

    // intro camera dolly
    intro = Math.min(1, intro + dt / 5.5);
    const ease = intro * intro * (3 - 2 * intro);
    const dist = 12.6 + (CFG.cameraDist - 12.6) * ease;
    const height = 3.4 + (CFG.cameraHeight - 3.4) * ease;

    // ---- car pose ----
    tangentAt(carZ, T);
    const yaw = Math.atan2(T.x, T.z);
    carObj.group.rotation.y = yaw;
    carObj.group.position.x = CFG.ourLane;
    wheelRot += speed / 0.36 * dt;
    for (const w of carObj.wheels) w.rotation.x = wheelRot;
    const accel = roadD2X(carZ) * speed * speed;
    const bodyRoll = THREE.MathUtils.clamp(-accel * 0.00045, -0.02, 0.02);
    carObj.group.rotation.z = bodyRoll;
    carObj.group.position.y = Math.abs(Math.sin(wheelRot * 0.5)) * 0.012 + Math.abs(Math.sin(t * 0.7)) * 0.006;
    carObj.group.rotation.x = 0.018 + Math.sin(t * 0.55) * 0.004;

    // ---- camera ----
    camPos.set(CFG.ourLane - T.x * dist, height, -T.z * dist);
    camLook.set(CFG.ourLane + T.x * CFG.lookAhead, CFG.lookHeight, T.z * CFG.lookAhead);
    const cs = 1 - Math.exp(-dt * 4.2);
    smoothCam.lerp(camPos, cs);
    smoothLook.lerp(camLook, 1 - Math.exp(-dt * 5.2));
    camera.position.copy(smoothCam);
    camera.position.y += Math.sin(t * 9.3) * 0.018 * (0.5 + speed / 70);
    const fovT = CFG.fovBase + (speed - 38) * 0.11 + (boostHeld ? 5 : 0);
    camera.fov += (fovT - camera.fov) * (1 - Math.exp(-dt * 2.2));
    camera.updateProjectionMatrix();
    const roll = THREE.MathUtils.clamp(accel * 0.00035, -0.045, 0.045);
    camera.up.set(Math.sin(roll), Math.cos(roll), 0);
    camera.lookAt(smoothLook);

    // ---- headlights fade in ----
    const hk = Math.min(1, Math.max(0, (t - 1.6) / 1.6));
    for (const s of headlights) { s.intensity = 52000 * hk * hk; }

    // ---- streetlights: toggle point lights near camera ----
    const camWZ = -8;
    for (let i = 0; i < streetlights.length; i++){
      const sl = streetlights[i];
      const wz = sl.baseZ - scroll;
      sl.light.visible = (wz > camWZ - 40 && wz < camWZ + 240);
    }

    // ---- traffic ----
    for (let i = traffic.length - 1; i >= 0; i--){
      const tr = traffic[i];
      if (tr.type === 'oncoming'){
        tr.worldZ -= tr.speed * dt;
        tr.car.group.position.set(roadX(tr.worldZ) + tr.lane, 0, tr.worldZ);
        tr.car.group.rotation.y = Math.atan2(-roadDX(tr.worldZ), -1);
        for (const w of tr.car.wheels) w.rotation.x += tr.speed / 0.36 * dt;
        if (tr.worldZ < -30){ scene.remove(tr.car.group); traffic.splice(i, 1); }
      } else {
        tr.worldZ += tr.speed * dt;
        tr.car.group.position.set(roadX(tr.worldZ) + tr.lane, 0, tr.worldZ);
        tr.car.group.rotation.y = Math.atan2(roadDX(tr.worldZ), 1);
        for (const w of tr.car.wheels) w.rotation.x += tr.speed / 0.36 * dt;
        if (tr.worldZ < -28){ scene.remove(tr.car.group); traffic.splice(i, 1); }
      }
    }
    // oncoming light + tail light assignment
    oncomingLight.intensity = 0; tailLight.intensity = 0;
    for (const tr of traffic){
      const dz = tr.worldZ - camWZ;
      if (tr.type === 'oncoming' && dz > -10 && dz < 500){
        oncomingLight.position.set(tr.car.group.position.x, 1.4, tr.worldZ);
        oncomingLight.intensity = Math.min(3000, 140000 / (dz * dz + 200));
      }
      if (tr.type === 'overtake' && dz > -20 && dz < 120){
        tailLight.position.set(tr.car.group.position.x, 0.8, tr.worldZ);
        tailLight.intensity = Math.min(1400, 12000 / (dz * dz + 60));
      }
    }
    // spawn pacing
    distSinceOncoming += speed * dt;
    if (distSinceOncoming > nextOncomingGap){
      spawnOncoming();
      distSinceOncoming = 0;
      nextOncomingGap = 700 + Math.random() * 350;
    }
    overtakeTimer -= dt;
    if (overtakeTimer <= 0){
      spawnOvertake();
      overtakeTimer = 45 + Math.random() * 35;
    }

    // ---- lightning ----
    lightningT -= dt;
    if (lightningT <= 0){
      lightningPower = 1;
      lightningT = 18 + Math.random() * 27;
      setTimeout(() => thunder(), 300 + Math.random() * 900);
    }
    if (lightningPower > 0){
      lightningPower -= dt * 3.2;
      const lv = Math.max(0, lightningPower);
      lightning.intensity = lv * lv * 9;
      flashOpacity = Math.max(flashOpacity, lv * 0.28);
    }
    flashOpacity *= Math.exp(-dt * 6);
    el.flash.style.opacity = Math.min(1, flashOpacity).toFixed(3);

    // ---- rain ----
    {
      const p = rain.pos, b = rain.box;
      for (let i = 0; i < p.length; i += 3){
        p[i+1] -= 62 * dt;
        p[i] -= 2.2 * dt;
        if (p[i+1] < -4){
          p[i+1] = b.y + Math.random() * 6;
          p[i] = (Math.random() - 0.5) * b.x * 2;
          p[i+2] = (Math.random() - 0.5) * b.z * 2;
        }
      }
      rain.points.geometry.attributes.position.needsUpdate = true;
    }
    rain.points.material.opacity = 0.32 + rainIntensity * 0.2;
    scene.fog.density = CFG.fogDensity + CFG.fogDrift * Math.min(1, t / 130) + (boostHeld ? 0.00006 : 0);

    // ---- hud ----
    el.kmh.textContent = Math.round(speed * 3.6);
    el.odo.textContent = `TRIP ${trip.toFixed(1)} KM`;
    document.body.classList.toggle('boost', boostHeld);

    updateAudio(dt);

    renderer.render(scene, camera);
  }

  renderer.setAnimationLoop(frame);

  // ---- error surface ----
  window.addEventListener('error', e => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;bottom:10px;left:10px;color:#ff7b72;font:12px monospace;z-index:99;background:#000a;padding:6px 10px;border-radius:6px;white-space:pre-wrap;';
    d.textContent = '⚠ ' + e.message;
    document.body.appendChild(d);
  });
  </script>
</body>
</html>
