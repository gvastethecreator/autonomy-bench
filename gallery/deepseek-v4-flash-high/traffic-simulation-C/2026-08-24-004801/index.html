<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Traffic — Procedural Traffic Simulation</title>
<style>
  :root{
    --ink:#e8e6e0;
    --dim:rgba(232,230,224,.62);
    --panel:rgba(14,18,28,.55);
    --panel-brd:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#060a14;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
  #cv{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #cv.grabbing{cursor:grabbing}
  .hud{position:fixed;z-index:10;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.55)}
  #topleft{top:18px;left:20px}
  #topleft .kicker{font-size:10px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
  #topleft h1{font-size:19px;font-weight:600;letter-spacing:.02em;margin-top:3px}
  #topleft .sub{font-size:11px;color:var(--dim);margin-top:2px}
  #topright{top:18px;right:20px;text-align:right}
  #clock{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  #daystate{font-size:11px;color:var(--dim);margin-top:1px;letter-spacing:.12em;text-transform:uppercase}
  #stats{font-size:11px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
  #stats b{color:var(--ink);font-weight:600}
  #hint{bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);letter-spacing:.06em;white-space:nowrap;text-align:center}
  #hint kbd{font-family:inherit;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:4px;padding:0 6px;margin:0 2px;font-size:10px}
  #controls{bottom:16px;right:16px;display:flex;gap:8px;pointer-events:auto}
  .btn{pointer-events:auto;min-width:38px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--panel-brd);background:var(--panel);color:var(--ink);font-size:12px;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .06s}
  .btn:hover{background:rgba(38,46,66,.75)}
  .btn:active{transform:scale(.96)}
  .btn .ico{font-size:13px;opacity:.9}
  #pauseBtn.on{border-color:rgba(255,205,110,.45);color:#ffd98a}
  #speedBtn{min-width:64px}
  #intro{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 50% 30%,#0d1526 0%,#060a14 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.1s ease;pointer-events:none}
  #intro.hide{opacity:0}
  #intro .t{font-size:34px;font-weight:600;letter-spacing:.10em;text-transform:uppercase}
  #intro .s{font-size:13px;color:var(--dim);margin-top:10px;letter-spacing:.22em;text-transform:uppercase}
  #intro .bar{width:220px;height:2px;margin-top:22px;background:rgba(255,255,255,.10);overflow:hidden;border-radius:2px}
  #intro .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd98a,#ff8a6a);transition:width .1s linear}
  @media (max-width:640px){

</style>

<body>
<canvas id="cv"></canvas>

<div class="hud" id="topleft">
  <div class="kicker">Autonomy Bench · Live Simulation</div>
  <h1>City Traffic</h1>
  <div class="sub">procedural grid · signals · crosswalks · day / night</div>
</div>

<div class="hud" id="topright">
  <div id="clock">12:00</div>
  <div id="daystate">Noon</div>
  <div id="stats"><b id="statCars">0</b> vehicles &nbsp;·&nbsp; <b id="statPeds">0</b> pedestrians<br><span id="statFlow">—</span></div>
</div>

<div class="hud" id="hint"><kbd>drag</kbd> pan &nbsp; <kbd>scroll</kbd> zoom &nbsp; <kbd>space</kbd> pause &nbsp; <kbd>f</kbd> fit view</div>

<div class="hud" id="controls">
  <button class="btn" id="fitBtn" title="Fit view (F)"><span class="ico">⤢</span></button>
  <button class="btn" id="speedBtn" title="Day speed">1×</button>
  <button class="btn" id="pauseBtn" title="Pause (Space)"><span class="ico">❚❚</span></button>
</div>

<div id="intro"><div class="t">City Traffic</div><div class="s">a procedural traffic simulation</div><div class="bar"><i id="introBar"></i></div></div>

<script>
"use strict";
/* ============================================================================
   CITY TRAFFIC — a procedural single-file traffic simulation.
   Top-down isometric (dimetric) city with a signalized road grid, car-following
   traffic, turning logic, crosswalks, pedestrians, trees, buildings, and a full
   day/night cycle with night lighting.
   ========================================================================== */

/* ---------------------------------- utils --------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hash1 = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------------------------------- config -------------------------------- */
const TILE   = 64;
const SP     = 5;                 // road spacing in tiles
const COLS   = 26;                // tiles wide  (roads at 0,5,...,25)
const ROWS   = 21;                // tiles tall  (roads at 0,5,...,20)
const NX     = 6;                 // vertical road lines
const NY     = 5;                 // horizontal road lines
const BLK    = SP * TILE;         // 320 — center-to-center block distance
const LANE_O = 14;                // lane offset from road centerline
const STOP_D = 26;                // stop line distance from intersection center

const G_TIME = 13, Y_TIME = 3, AR_TIME = 1.2;   // signal phases (s)
const CYC    = (G_TIME + Y_TIME + AR_TIME) * 2; // full signal cycle
const DAY_LEN = 120;              // seconds for a full 24h day (x1 speed)

const CAR_L = 15, CAR_W = 7.2, CAR_H = 4.6;

/* ---------------------------------- canvas -------------------------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let vw = 0, vh = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeFit();
}
window.addEventListener('resize', resize);

/* camera: world-space center + zoom */
let cam = { x: 0, y: 0, z: 1 };
let camIsoX = 0, camIsoY = 0;
const CITY_CX = COLS * TILE / 2, CITY_CY = ROWS * TILE / 2;
let fitZoom = 1;
function computeFit() {
  const w = 1504, h = 920; // iso extents of map incl. building headroom
  fitZoom = Math.min((vw * 0.9) / w, (vh * 0.82) / h);
}
function syncCam() { camIsoX = (cam.x - cam.y) * 0.5; camIsoY = (cam.x + cam.y) * 0.25; }
/* world -> screen (fill out) */
function P(wx, wy, wz, out) {
  const ix = (wx - wy) * 0.5, iy = (wx + wy) * 0.25 - wz;
  out.x = vw * 0.5 + (ix - camIsoX) * cam.z;
  out.y = vh * 0.56 + (iy - camIsoY) * cam.z;
  return out;
}
function panByScreen(dx, dy) {
  const dIsoX = dx / cam.z, dIsoY = dy / cam.z;
  cam.x += dIsoX + 2 * dIsoY;
  cam.y += 2 * dIsoY - dIsoX;
  syncCam();
}
function zoomAt(sx, sy, factor) {
  // keep the world point under the cursor fixed
  const before = { x: 0, y: 0 };
  const wx = worldFromScreen(sx, sy, before);
  cam.z = clamp(cam.z * factor, 0.28, 3.2);
  syncCam();
  const after = worldFromScreen(sx, sy, { x: 0, y: 0 });
  cam.x += wx.x - after.x; cam.y += wx.y - after.y;
  syncCam();
}
function worldFromScreen(sx, sy, out) {
  const ix = camIsoX + (sx - vw * 0.5) / cam.z;
  const iy = camIsoY + (sy - vh * 0.56) / cam.z;
  out.x = ix + 2 * iy; out.y = 2 * iy - ix;
  return out;
}
function fitView() {
  cam.x = CITY_CX; cam.y = CITY_CY;
  cam.z = clamp(fitZoom * 1.06, 0.28, 3.2);
  syncCam();
}

/* ------------------------------- palette (time) --------------------------- */
/* keyframes: hour, sky top/bot, fog, ambient, window-lit, grade tint+alpha */
const PAL = [
  { h: 0.0, top: [6,10,24],   bot: [16,28,51],   fog: [10,18,34],  amb: 0.30, win: 0.92, g: [12,22,44],  ga: 0.30, moon: 1.0, star: 1.0 },
  { h: 4.5, top: [22,30,60],  bot: [74,72,104],  fog: [42,42,72],  amb: 0.46, win: 0.60, g: [80,60,100], ga: 0.10, moon: 0.9, star: 0.7 },
  { h: 6.5, top: [62,92,158], bot: [238,160,104],fog: [200,140,92],amb: 0.64, win: 0.30, g: [255,150,90],ga: 0.07, moon: 0.2, star: 0.1 },
  { h: 8.0, top: [74,143,208],bot: [214,234,244],fog: [182,208,224],amb: 0.84, win: 0.12, g: [255,255,255],ga: 0.00, moon: 0.0, star: 0.0 },
  { h: 12.0,top: [46,127,208],bot: [208,238,250],fog: [186,214,232],amb: 1.00, win: 0.06, g: [255,255,255],ga: 0.00, moon: 0.0, star: 0.0 },
  { h: 16.5,top: [62,124,192],bot: [232,222,196],fog: [194,198,172],amb: 0.92, win: 0.08, g: [255,255,255],ga: 0.00, moon: 0.0, star: 0.0 },
  { h: 18.5,top: [90,110,190],bot: [255,178,106],fog: [230,158,92], amb: 0.78, win: 0.16, g: [255,176,102],ga: 0.06, moon: 0.0, star: 0.0 },
  { h: 19.8,top: [60,42,98],  bot: [255,138,78], fog: [200,104,80],amb: 0.55, win: 0.48, g: [255,122,66],ga: 0.10, moon: 0.25,star: 0.35 },
  { h: 21.5,top: [18,26,60],  bot: [92,74,106],  fog: [46,42,74],  amb: 0.42, win: 0.76, g: [44,42,78],  ga: 0.18, moon: 0.85,star: 0.9 },
  { h: 23.9,top: [6,10,24],   bot: [16,28,51],   fog: [10,18,34],  amb: 0.30, win: 0.92, g: [12,22,44],  ga: 0.30, moon: 1.0, star: 1.0 },
];
function timePalette(hour) {
  const h = hour % 24;
  let a = PAL[0], b = PAL[PAL.length - 1];
  for (let i = 0; i < PAL.length - 1; i++) {
    if (h >= PAL[i].h && h <= PAL[i + 1].h) { a = PAL[i]; b = PAL[i + 1]; break; }
  }
  const t = (b.h === a.h) ? 0 : (h - a.h) / (b.h - a.h);
  const L = (x, y) => lerp(x, y, t);
  const col = (ca, cb) => [L(ca[0], cb[0]), L(ca[1], cb[1]), L(ca[2], cb[2])];
  return {
    top: col(a.top, b.top), bot: col(a.bot, b.bot), fog: col(a.fog, b.fog),
    amb: L(a.amb, b.amb), win: L(a.win, b.win), g: col(a.g, b.g), ga: L(a.ga, b.ga),
    moon: L(a.moon, b.moon), star: L(a.star, b.star),
  };
}
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const cssa = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ------------------------------ city generation --------------------------- */
const ISECTIONS = [];   // intersections
const LANES = [];       // directed lane segments
const CONNS = [];       // intersection connectors (turns)
const BLOCKS = [];
const TREES = [];
const POLES = [];       // streetlights
const SIGNALS = [];     // traffic signal boxes
const PEDNODES = [];    // sidewalk corner graph
let pedEdges = [];

function makeIntersections() {
  for (let xi = 0; xi < NX; xi++) {
    for (let yi = 0; yi < NY; yi++) {
      const cx = xi * BLK, cy = yi * BLK;
      ISECTIONS.push({
        xi, yi, cx, cy,
        off: (xi * 6.5 + yi * 1.7) % CYC,   // signal offset (green wave eastwards)
        zone: [],
      });
    }
  }
  const idx = (xi, yi) => yi * NX + xi;
  for (let xi = 0; xi < NX; xi++) for (let yi = 0; yi < NY; yi++) {
    const I = ISECTIONS[idx(xi, yi)];
    I.n = yi < NY - 1 ? ISECTIONS[idx(xi, yi + 1)] : null;
    I.s = yi > 0 ? ISECTIONS[idx(xi, yi - 1)] : null;
    I.e = xi < NX - 1 ? ISECTIONS[idx(xi + 1, yi)] : null;
    I.w = xi > 0 ? ISECTIONS[idx(xi - 1, yi)] : null;
  }
}

/* helper: build a directed lane from p0->p1 (world points), return id */
let laneSeq = 0;
function addLane(x0, y0, x1, y1, interStart, interEnd) {
  const pts = [];
  const n = Math.max(2, Math.round(dist2(x0, y0, x1, y1) / 12));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push({ x: lerp(x0, x1, t), y: lerp(y0, y1, t) });
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist2(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y));
  const dx = x1 - x0, dy = y1 - y0;
  const L = {
    id: laneSeq++, pts, cum, len: cum[cum.length - 1],
    ix: x0, iy: y0, fx: x1, fy: y1,
    dir: { x: dx / (Math.hypot(dx, dy) || 1), y: dy / (Math.hypot(dx, dy) || 1) },
    start: interStart, end: interEnd, cars: [],
    stopLen: cum[cum.length - 1],
  };
  LANES.push(L);
  return L;
}

function makeRoads() {
  // horizontal road segments (west -> east), rows at every road line
  for (let yi = 0; yi < NY; yi++) {
    for (let xi = 0; xi < NX - 1; xi++) {
      const ax = xi * BLK, ay = yi * BLK, bx = (xi + 1) * BLK;
      const I0 = ISECTIONS[yi * NX + xi], I1 = ISECTIONS[yi * NX + xi + 1];
      const east = addLane(ax + STOP_D, ay + LANE_O, bx - STOP_D, ay + LANE_O, I0, I1);
      const west = addLane(bx - STOP_D, ay - LANE_O, ax + STOP_D, ay - LANE_O, I1, I0);
      east.seg = { horiz: true, y: ay, xi, yi };
      west.seg = { horiz: true, y: ay, xi, yi };
      east.opp = west; west.opp = east;
    }
  }
  // vertical road segments (north -> south), cols at every road line
  for (let xi = 0; xi < NX; xi++) {
    for (let yi = 0; yi < NY - 1; yi++) {
      const ax = xi * BLK, ay = yi * BLK, by = (yi + 1) * BLK;
      const I0 = ISECTIONS[yi * NX + xi], I1 = ISECTIONS[(yi + 1) * NX + xi];
      const south = addLane(ax - LANE_O, ay + STOP_D, ax - LANE_O, by - STOP_D, I0, I1);
      const north = addLane(ax + LANE_O, by - STOP_D, ax + LANE_O, ay + STOP_D, I1, I0);
      south.seg = { horiz: false, x: ax, xi, yi };
      north.seg = { horiz: false, x: ax, xi, yi };
      south.opp = north; north.opp = south;
    }
  }
}

/* connectors: bezier from incoming lane end to outgoing lane start */
function bezierPts(ax, ay, bx, by, cx, cy, dx, dy, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push({
      x: u * u * u * ax + 3 * u * u * t * bx + 3 * u * t * t * cx + t * t * t * dx,
      y: u * u * u * ay + 3 * u * u * t * by + 3 * u * t * t * cy + t * t * t * dy,
    });
  }
  return pts;
}
function makeConnectors() {
  // for each lane, find its outgoing options at its end intersection
  for (const L of LANES) {
    const I = L.end;
    const cx = I.cx, cy = I.cy;
    const d = L.dir;
    const endP = { x: L.fx, y: L.fy };
    const options = [];
    const tryLane = (move, outLane) => {
      if (!outLane) return;
      const startP = { x: outLane.ix, y: outLane.iy };
      const k = move === 'straight' ? 10 : move === 'right' ? 16 : move === 'left' ? 22 : 6;
      const pts = bezierPts(endP.x, endP.y, startP.x, startP.y,
        endP.x + d.x * k, endP.y + d.y * k,
        startP.x - outLane.dir.x * k, startP.y - outLane.dir.y * k, 12);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist2(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y));
      const C = { id: CONNS.length, in: L, out: outLane, inter: I, move, pts, cum, len: cum[cum.length - 1], cars: [] };
      CONNS.push(C);
      options.push(C);
    };
    // find lanes leaving I (lanes whose start intersection is I)
    const outDirs = {};
    for (const L2 of LANES) {
      if (L2 === L) continue;
      if (L2.start === I) {
        const dd = L2.dir;
        outDirs[Math.round(dd.x * 10) + ',' + Math.round(dd.y * 10)] = L2;
      }
    }
    const get = (dx, dy) => outDirs[Math.round(dx * 10) + ',' + Math.round(dy * 10)];
    const straight = get(d.x, d.y);
    const right = get(-d.y, d.x);
    const left = get(d.y, -d.x);
    const uturn = get(-d.x, -d.y);
    if (straight && straight !== L.opp) tryLane('straight', straight);
    if (right) tryLane('right', right);
    if (left) tryLane('left', left);
    if (uturn && uturn !== L) tryLane('uturn', uturn);
    L.outs = options;
    // crosswalk rect for cars entering I from this lane
    const px = -d.y, py = d.x; // perpendicular
    const cxp = cx - d.x * 22, cyp = cy - d.y * 22;
    L.crossRect = {
      x0: Math.min(cxp - px * 26, cxp + px * 26) - 4,
      x1: Math.max(cxp - px * 26, cxp + px * 26) + 4,
      y0: Math.min(cyp - py * 26, cyp + py * 26) - 4,
      y1: Math.max(cyp - py * 26, cyp + py * 26) + 4,
    };
    L.isVertical = d.x === 0;
  }
}

/* ------------------------------- buildings --------------------------------- */
const DISTRICT = { res: 0, comm: 1, downtown: 2, wh: 3, park: 4, plaza: 5 };
const WALL_SW = {
  0: [ [196,138,94],  [178,122,82],  [122,90,60] ],  // residential brick
  1: [ [128,150,168], [110,132,152], [80,96,114] ],  // commercial
  2: [ [96,116,140],  [80,100,124],  [58,74,96] ],   // downtown
  3: [ [178,146,110], [158,128,94],  [108,86,64] ],  // warehouse
};
const GLASS = [ [124,156,176], [110,148,172], [96,140,166], [140,168,182] ];
const ROOF_C = [ [122,92,62], [70,86,102], [52,66,84], [94,76,56] ];

function blockType(bi, bj) {
  const dx = (bi + 0.5) - NX / 2 + 0.5, dy = (bj + 0.5) - NY / 2 + 0.5;
  const r = Math.hypot(dx * 1.0, dy * 1.25);
  const h = hash1(bi * 13.7 + bj * 7.3);
  // guaranteed public spaces so the city always has parks/plazas
  if ((bi === 1 && bj === 1) || (bi === 3 && bj === 2)) return DISTRICT.park;
  if (bi === 2 && bj === 2) return DISTRICT.plaza;
  if (h < 0.12) return DISTRICT.park;
  if (h < 0.16) return DISTRICT.plaza;
  if (r < 1.15) return DISTRICT.downtown;
  if (r < 2.1) return DISTRICT.comm;
  return (h < 0.42 && r > 3.4) ? DISTRICT.wh : DISTRICT.res;
}

function genBuildings() {
  for (let bj = 0; bj < NY - 1; bj++) {
    for (let bi = 0; bi < NX - 1; bi++) {
      const bx = bi * BLK + TILE, by = bj * BLK + TILE;
      const type = blockType(bi, bj);
      const blk = { bi, bj, x: bx, y: by, w: 4 * TILE, h: 4 * TILE, type, buildings: [], trees: 0 };
      BLOCKS.push(blk);
      const rnd = hash1(bi * 31.7 + bj * 17.9);
      if (type === DISTRICT.park) {
        blk.parks = true;
        const n = 12 + Math.floor(rnd * 8);
        for (let i = 0; i < n; i++) {
          const tx = bx + rand(24, 232), ty = by + rand(24, 232);
          TREES.push({ x: tx, y: ty, r: rand(10, 17), h: rand(16, 26), k: hash1(bi * 9 + bj * 3 + i) });
        }
        blk.pond = rnd > 0.55 ? { x: bx + rand(60, 170), y: by + rand(60, 170), r: rand(16, 26) } : null;
        continue;
      }
      if (type === DISTRICT.plaza) {
        blk.plaza = true;
        blk.fountain = { x: bx + 128, y: by + 128, r: 22 };
        TREES.push({ x: bx + rand(20, 50), y: by + rand(20, 50), r: 12, h: 20, k: rnd });
        TREES.push({ x: bx + rand(206, 236), y: by + rand(206, 236), r: 12, h: 20, k: rnd + 0.3 });
        continue;
      }
      // subdivide into parcels
      const cols = [], rows = [];
      const cut = (v) => {
        if (v < 26 || v > 206) return false;
        cols.push(v); return true;
      };
      let r2 = hash1(bi * 7.1 + bj * 3.9);

    pinch = { ...pinch, id2: e.pointerId, x2: e.clientX, y2: e.clientY };

});
cv.addEventListener('pointermove', e => {

    const p1 = pinch.id === e.pointerId ? e : { clientX: pinch.x, clientY: pinch.y };
    const p2 = pinch.id2 === e.pointerId ? e : { clientX: pinch.x2, clientY: pinch.y2 };
    const d0 = Math.hypot(pinch.x - pinch.x2, pinch.y - pinch.y2) || 1;
    const d1 = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
    const mx = (p1.clientX + p2.clientX) / 2, my = (p1.clientY + p2.clientY) / 2;
    zoomAt(mx, my, d1 / d0);
    pinch.x = p1.clientX; pinch.y = p1.clientY; pinch.x2 = p2.clientX; pinch.y2 = p2.clientY;
    return;
  }
  if (dragging && e.pointerId === pinch?.id) {
    panByScreen(e.clientX - lastPX, e.clientY - lastPY);
    lastPX = e.clientX; lastPY = e.clientY;

}
function updateSpeedBtn() {
  speedBtn.textContent = daySpeed === 0.25 ? '¼×' : daySpeed === 4 ? '4×' : '1×';
}
pauseBtn.addEventListener('click', togglePause);
speedBtn.addEventListener('click', () => {
  daySpeed = daySpeed === 1 ? 4 : daySpeed === 4 ? 0.25 : 1;
  updateSpeedBtn();
});
fitBtn.addEventListener('click', fitView);

/* ----------------------------------- init ---------------------------------- */
function init() {
  makeIntersections();
  makeRoads();
  makeConnectors();
  makePedGraph();
  genBuildings();
  // streetlight poles
  for (const I of ISECTIONS) {
    const r = Math.random();
    if (r < 0.5) POLES.push({ x: I.cx + 22, y: I.cy + 22 });
    if (r < 0.85) POLES.push({ x: I.cx - 22, y: I.cy - 22 });
  }
  // prefill cars for a lively start
  for (let i = 0; i < 64; i++) spawnCar(true);
  for (let i = 0; i < 34; i++) spawnPed();
  resize();
  cam.x = CITY_CX; cam.y = CITY_CY; cam.z = fitZoom * 0.5; syncCam();
  introT = 0;
  requestAnimationFrame(loop);
}
let introT = 0, introDoneAt = -1;
const introBar = document.getElementById('introBar');
const introEl = document.getElementById('intro');

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  // intro camera
  if (introT < 4.2) {
    introT += dt;
    const t = easeOutCubic(Math.min(1, introT / 3.2));
    cam.z = lerp(fitZoom * 0.5, clamp(fitZoom * 1.02, 0.4, 1.6), t);
    syncCam();
    if (introBar) introBar.style.width = Math.round(t * 100) + '%';
    if (introT >= 3.4 && introDoneAt < 0) { introDoneAt = 3.4; introEl.classList.add('hide'); }
    if (introT >= 4.6) introEl.remove();
  }
  update(dt);
  drawScene();
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

window.addEventListener('error', e => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:10px;left:10px;z-index:99;color:#f8a;background:#200;padding:6px 10px;font:12px monospace;white-space:pre-wrap';
  el.textContent = e.message;
  document.body.appendChild(el);
});
init();
</script>
