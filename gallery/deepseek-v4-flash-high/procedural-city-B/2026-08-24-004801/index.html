<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

'use strict';

/* ============================== helpers ============================== */
const R  = (a,b) => a + Math.random() * (b-a);
const RI = (a,b) => Math.floor(R(a, b+1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a)*t;
const easeInOut = t => t*t*(3 - 2*t);
const smooth = t => t*t*t*(t*(t*6 - 15) + 10);

/* ============================== setup ============================== */
const stage = document.getElementById('stage');
const errbox = document.getElementById('err');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch(e){
  errbox.style.display='block';
  errbox.textContent = 'WebGL could not be initialized.\n\n' + e.message +
    '\n\nThis experience needs a browser with WebGL enabled. The Three.js library is loaded from a CDN, so an internet connection is required on first run.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020308);
scene.fog = new THREE.FogExp2(0x06070f, 0.0046);

const camera = new THREE.PerspectiveCamera(56, window.innerWidth/window.innerHeight, 0.1, 3000);

/* moon direction (shared by shaders + light) */
const MOON_DIR = new THREE.Vector3(0.32, 0.5, -0.72).normalize();

/* lights */
scene.add(new THREE.HemisphereLight(0x26335c, 0x0a0c12, 0.5));
const moonLight = new THREE.DirectionalLight(0x93a9ff, 0.55);
moonLight.position.copy(MOON_DIR).multiplyScalar(400);
scene.add(moonLight);

/* ============================== canvas textures ============================== */
function makeCanvas(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h); return c; }
function toTex(c, srgb){ const t = new THREE.CanvasTexture(c); t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

function radialGlow(size, rgb, alpha){
  return toTex(makeCanvas(size,size,(g,s)=>{
    g.clearRect(0,0,s,s);
    const grd = g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    grd.addColorStop(0,   'rgba('+rgb+','+alpha+')');
    grd.addColorStop(0.4, 'rgba('+rgb+','+(alpha*0.35)+')');
    grd.addColorStop(1,   'rgba('+rgb+',0)');
    g.fillStyle = grd;
    g.fillRect(0,0,s,s);
  }), false);
}

/* road lane markings — orientation A: dashes run along V */
function laneTex(orientation){
  return toTex(makeCanvas(256,256,(g,s)=>{
    g.clearRect(0,0,s,s);
    const lanes = 4;
    const dashed = orientation; // true: stripes at constant-u (lanes along v)
    const gaps = [0.04, 0.92];         // outer solid edge lines
    const mids = [];
    for (let i=1;i<lanes;i++) mids.push(i/lanes);
    g.strokeStyle = 'rgba(215,222,235,0.5)';
    g.lineWidth = 5;
    if (dashed){
      for (const m of mids){
        for (let y=0;y<256;y+=22){
          g.beginPath();
          g.moveTo((m*256)+0.5, y); g.lineTo((m*256)+0.5, clamp(y+11,0,256));
          g.stroke();
        }
      }
      g.lineWidth=3; g.strokeStyle='rgba(210,218,232,0.22)';
      for (const gp of gaps){ g.beginPath(); g.moveTo(gp*256,0); g.lineTo(gp*256,256); g.stroke(); }
    } else {
      for (const m of mids){
        for (let x=0;x<256;x+=22){
          g.beginPath();
          g.moveTo(x, m*256+0.5); g.lineTo(clamp(x+11,0,256), m*256+0.5);
          g.stroke();
        }
      }
      g.lineWidth=3; g.strokeStyle='rgba(210,218,232,0.22)';
      for (const gp of gaps){ g.beginPath(); g.moveTo(0,gp*256); g.lineTo(256,gp*256); g.stroke(); }
    }
  }), false);
}
const texDashV = laneTex(true);
const texDashH = laneTex(false);

/* neon sign texture */
function neonTex(text, rgb){
  return toTex(makeCanvas(512,256,(g,s)=>{ // s=like h
    const w=512,h=256;
    g.clearRect(0,0,w,h);
    const font = '900 84px "Arial Black", Arial, sans-serif';
    g.font = font; g.textAlign='center'; g.textBaseline='middle';
    g.shadowColor = 'rgb('+rgb+')';
    g.shadowBlur = 46;
    g.fillStyle = 'rgb('+rgb+')';
    g.fillText(text, w/2, h/2+4);
    g.shadowBlur = 10;
    g.fillText(text, w/2, h/2+4);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,250,244,0.92)';
    g.fillText(text, w/2, h/2+4);
  }), true);
}

/* dynamic screen texture for billboards */
function liveScreenTex(w,h, draw){ return makeCanvas(w,h, draw); }

/* cloud texture */
function cloudTex(){
  return toTex(makeCanvas(512,128,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    for (let i=0;i<22;i++){
      const x=R(20,w-20), y=R(-20,h), r=R(24,84);
      const grd = g.createRadialGradient(x,y,0, x,y,r);
      grd.addColorStop(0, 'rgba(24,32,48,0.5)');
      grd.addColorStop(1, 'rgba(24,32,48,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
    }
  }), false);
}

/* ============================== city constants ============================== */
const BLOCK_SP = 80;   // road spacing
const ROAD_W   = 16;   // road width
const BLOCKS   = 12;   // blocks per side
const ZONE     = 26;   // building zone half-extent inside a block
const CITY_HALF = 480; // outermost road line

/* ============================== building facade material ============================== */
const facadeUniforms = {
  uTime:  { value: 0 },
  uMoonDir: { value: MOON_DIR.clone() },
  uFogDensity: { value: 0.0046 },
  uFogColor: { value: new THREE.Color(0x06070f) }
};
const facadeMat = new THREE.ShaderMaterial({
  uniforms: facadeUniforms,
  vertexShader: `
    varying vec3 vLocal;
    varying vec3 vNrm;
    varying vec3 vSeed;
    varying float vDepth;
    void main(){
      vec4 ip = instanceMatrix * vec4(position, 1.0);
      vLocal = ip.xyz;
      vNrm = normalize(mat3(instanceMatrix) * normal);
      vSeed = instanceColor;
      vec4 mv = modelViewMatrix * ip;
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uMoonDir;
    uniform float uFogDensity;
    uniform vec3 uFogColor;
    varying vec3 vLocal;
    varying vec3 vNrm;
    varying vec3 vSeed;
    varying float vDepth;
    float hash12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    void main(){
      vec3 n = normalize(vNrm);
      if (abs(n.y) > 0.5){
        float rv = 0.006 + 0.004 * hash12(vec2(vLocal.x,vLocal.z)*0.7 + vSeed.r*40.0);
        float edge = smoothstep(0.0, 0.7, min(abs(vLocal.x), abs(vLocal.z)));
        gl_FragColor = vec4(vec3(rv*(0.6+0.6*edge)), 1.0);
        return;
      }
      vec2 coord = (abs(n.x) > 0.5) ? vec2(vLocal.z, vLocal.y) : vec2(vLocal.x, vLocal.y);
      vec2 cell = vec2(2.2, 3.1);
      vec2 c = floor(coord / cell);
      vec2 f = fract(coord / cell);
      float mx = smoothstep(0.08, 0.24, f.x) * (1.0 - smoothstep(0.76, 0.92, f.x));
      float my = smoothstep(0.14, 0.32, f.y) * (1.0 - smoothstep(0.68, 0.86, f.y));
      float win = mx * my;
      float h1 = hash12(c + vec2(vSeed.r*91.7, vSeed.g*37.3));
      float h2 = hash12(c + vec2(vSeed.g*61.1, vSeed.r*13.9));
      float lit = step(vSeed.b, h1);
      float fl = 1.0;
      float k2 = hash12(c*1.37 + vec2(vSeed.g*23.5, vSeed.r*5.1));
      if (k2 < 0.05){
        float kh = hash12(c + vec2(floor(uTime*1.5), vSeed.r*7.7));
        fl = 0.25 + 0.75 * (0.5 + 0.5*sin(uTime*(3.0 + k2*7.0) + kh*6.2831));
      }
      vec3 warm = vec3(1.0, 0.76, 0.48);
      vec3 cool = vec3(0.50, 0.72, 1.0);
      vec3 winCol = mix(warm, cool, step(0.5, h2));
      vec3 winGlow = winCol * (win * lit * fl);

      vec3 baseCol = vec3(0.014, 0.016, 0.022) * (0.8 + 0.5*h1) * (0.7 + 0.4*vSeed.g);
      float up = 0.7 + 0.3 * smoothstep(0.0, 34.0, vLocal.y);
      float shade = 0.62 + 0.38 * max(dot(n, uMoonDir), 0.0);
      vec3 col = baseCol * shade * up;
      col += winGlow * 0.16;
      col += winGlow;
      float fogF = 1.0 - exp(-uFogDensity * uFogDensity * vDepth * vDepth);
      col = mix(col, uFogColor, clamp(fogF, 0.0, 1.0));
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
facadeMat.side = THREE.FrontSide;

/* ============================== city generation ============================== */
const dummy = new THREE.Object3D();
const M4 = new THREE.Matrix4();
const cityGroup = new THREE.Group();
scene.add(cityGroup);

const buildingDataAll = [];   // {px,pz,w,d,h,rot,mx}
const antennas = [];          // {x,y,z}
const waterTanks = [];
const signMounts = [];        // {px, py, pz, ry, w, h, text, rgb, phase, speed}

function addBuildingBlock(cx, cz, buildings, tier){
  const count = buildings.length;
  if (count === 0) return;
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), facadeMat, count);
  buildings.forEach((b, i) => {
    dummy.position.set(b.px, b.h/2, b.pz);
    dummy.rotation.set(0, b.rot, 0);
    dummy.scale.set(b.w, b.h, b.d);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, new THREE.Color(b.sa, b.sb, b.dens));
    buildingDataAll.push(b);
    if (b.h > 74){
      antennas.push({ x:b.px, z:b.pz, y:b.h, h:R(6,14) });
    } else if (b.h < 30){
      waterTanks.push({ x:R(b.px - b.w/2 + 3, b.px + b.w/2 - 3), z:R(b.pz - b.d/2 + 3, b.pz + b.d/2 - 3), y:b.h });
    }
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.frustumCulled = false;
  cityGroup.add(mesh);
}

function collectBuildings(cx, cz, tier){
  const out = [];
  const guard = 90;
  let fails = 0;
  while (out.length < 5){
    const w = R(tier==='high'?20: tier==='mid'?18:12,  tier==='high'?52: tier==='mid'?46: 34);
    const d = R(tier==='high'?20: tier==='mid'?18:12,  tier==='high'?52: tier==='mid'?46: 34);
    const hx = Math.max(1,(ZONE - w/2));
    const hz = Math.max(1,(ZONE - d/2));
    const x = R(-hx, hx), z = R(-hz, hz);
    let ok = true;
    for (const o of out){
      if (Math.abs(o.x - x) < (o.w + w)/2 + 2 && Math.abs(o.z - z) < (o.d + d)/2 + 2){ ok = false; break; }
    }
    if (!ok){ if (++fails > 60) break; continue; }
    fails = 0;
    let h;
    if (tier === 'high')      h = R(48, 132);
    else if (tier === 'mid')  h = R(26, 66);
    else                      h = R(9, 34);
    const dens = tier==='low' ? (Math.random()<0.5?0.22:0.1) : (tier==='mid'?R(0.35,0.55) : R(0.5,0.68));
    out.push({ x, z, w, d, h, rot: Math.random()<0.5 ? 0 : Math.PI/2,
               px: cx+x, pz: cz+z, sa:Math.random(), sb:Math.random(), dens });
    if (--guard <= 0) break;
  }
  if (out.length === 0){
    out.push({ x:0, z:0, w:40, d:40, h: tier==='high'?70: tier==='mid'?40: 20, rot:0,
               px:cx, pz:cz, sa:Math.random(), sb:Math.random(), dens:0.3 });
  }
  return out;
}

/* curbs around each block */
function addCurbs(){
  const geos = [];
  const mats = [];
  const tmp = new THREE.BoxGeometry(1,1,1);
  const positions = [];
  for (let bi=0; bi<BLOCKS; bi++){
    for (let bj=0; bj<BLOCKS; bj++){
      const cx=(bi-5.5)*BLOCK_SP, cz=(bj-5.5)*BLOCK_SP;
      // 4 curb bars
      const L = BLOCK_SP - 4;
      const t = 1.4;
      positions.push({ pos:[cx, 0.05, cz - (BLOCK_SP/2 - t/2)],  scl:[L, 0.1, t], rot:0 });
      positions.push({ pos:[cx, 0.05, cz + (BLOCK_SP/2 - t/2)],  scl:[L, 0.1, t], rot:0 });
      positions.push({ pos:[cx - (BLOCK_SP/2 - t/2), 0.05, cz],  scl:[t, 0.1, L], rot:0 });
      positions.push({ pos:[cx + (BLOCK_SP/2 - t/2), 0.05, cz],  scl:[t, 0.1, L], rot:0 });
    }
  }
  tmp.dispose();
  void geos; void mats;
  const curbMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
    new THREE.MeshLambertMaterial({ color:0x3a4150, roughness:0.9 }), positions.length);
  positions.forEach((p, i) => {
    dummy.position.set(p.pos[0], p.pos[1], p.pos[2]);
    dummy.rotation.set(0,p.rot,0);
    dummy.scale.set(p.scl[0], p.scl[1], p.scl[2]);
    dummy.updateMatrix();
    curbMesh.setMatrixAt(i, dummy.matrix);
  });
  curbMesh.instanceMatrix.needsUpdate = true;
  curbMesh.frustumCulled = false;
  cityGroup.add(curbMesh);
}

/* ground fill inside blocks (buildings sit on these) */
function addGroundBlocks(){
  const poss = [];
  for (let bi=0; bi<BLOCKS; bi++){
    for (let bj=0; bj<BLOCKS; bj++){
      if (bi===plazaBlock.bi && bj===plazaBlock.bj) continue;
      poss.push({ x:(bi-5.5)*BLOCK_SP, z:(bj-5.5)*BLOCK_SP });
    }
  }
  const gm = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
    new THREE.MeshLambertMaterial({ color:0x0d1016 }), poss.length);
  poss.forEach((s,i)=>{
    dummy.position.set(s.x, 0.05, s.z);
    dummy.rotation.set(0,0,0);
    dummy.scale.set(BLOCK_SP-8, 0.12, BLOCK_SP-8);
    dummy.updateMatrix();
    gm.setMatrixAt(i, dummy.matrix);
  });
  gm.instanceMatrix.needsUpdate = true;
  gm.frustumCulled = false;
  cityGroup.add(gm);
}

/* road mesh */
function addRoads(){
  const roadMat = new THREE.MeshLambertMaterial({ color:0x0e1117 });
  const markV  = new THREE.MeshBasicMaterial({ map:texDashV, transparent:true, opacity:0.55, depthWrite:false });
  const markH  = new THREE.MeshBasicMaterial({ map:texDashH, transparent:true, opacity:0.55, depthWrite:false });
  const len = CITY_HALF*2 + 200;
  const tilesV = Math.ceil(len/ (6));
  for (let k=0; k<=BLOCKS; k++){
    const line = (k-6)*BLOCK_SP;
    // vertical road (runs along z)
    const rv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, len), roadMat);
    rv.rotation.x = -Math.PI/2;
    rv.position.set(line, 0.02, 0);
    cityGroup.add(rv);
    const mv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, len), markV);
    mv.rotation.x = -Math.PI/2;
    mv.position.set(line, 0.05, 0);
    texDashV.repeat.set(1, tilesV);
    mv.material.map.needsUpdate = true;
    cityGroup.add(mv);
    // horizontal road (runs along x)
    const rh = new THREE.Mesh(new THREE.PlaneGeometry(len, ROAD_W), roadMat);
    rh.rotation.x = -Math.PI/2;
    rh.position.set(0, 0.021, line);
    cityGroup.add(rh);
    const mh = new THREE.Mesh(new THREE.PlaneGeometry(len, ROAD_W), markH);
    mh.rotation.x = -Math.PI/2;
    mh.position.set(0, 0.051, line);
    texDashH.repeat.set(tilesV, 1);
    mh.material.map.needsUpdate = true;
    cityGroup.add(mh);
  }
}

/* antennas + beacons + water tanks */
function addProps(){
  // antennas
  const poleGeo = new THREE.CylinderGeometry(0.22, 0.3, 1, 6);
  if (antennas.length > 0){
    const am = new THREE.InstancedMesh(poleGeo, new THREE.MeshLambertMaterial({ color:0x14171c }), antennas.length);
    antennas.forEach((a, i) => {
      dummy.position.set(a.x, a.y + a.h/2, a.z);
      dummy.rotation.set(0,0,0);
      dummy.scale.set(1, a.h, 1);
      dummy.updateMatrix();
      am.setMatrixAt(i, dummy.matrix);
    });
    am.instanceMatrix.needsUpdate = true;
    am.frustumCulled = false;
    cityGroup.add(am);

    // blinking beacons on antennas
    antennas.forEach((a, i) => {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 8),

/* neon signs + billboards */
function buildSigns(){
  const SIGNS = [
    ['NOIR BAR',   '255,61,129'], ['HOTEL LUNA','125,249,255'], ['24H DINER','255,177,78'],
    ['KARAOKE','200,107,255'], ['VELVET','255,92,138'], ['TAXI','255,225,78'],
    ['PIZZA','157,255,92'], ['CITY VIEW','92,200,255'], ['CASINO','106,255,158'], ['BURGER','255,122,61']
  ];
  const candidates = buildingDataAll.filter(b => b.h > 22);
  if (candidates.length === 0) return;
  const mtl = [];
  for (const [text, rgb] of SIGNS){
    const tex = neonTex(text, rgb);
    const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
    mat.userData.baseOpacity = 0.95;
    mat.userData.phase = Math.random()*Math.PI*2;
    mat.userData.speed = 0.8 + Math.random()*1.4;
    const b = pick(candidates);
    const signW = clamp(b.w*0.5, 8, 30);
    const signH = signW * 0.5;
    const face = Math.floor(Math.random()*4);
    let px, pz, ry;
    if (face === 0){ px = b.px + b.w/2 + 0.4; pz = b.pz; ry = Math.PI/2; }
    else if (face === 1){ px = b.px - b.w/2 - 0.4; pz = b.pz; ry = -Math.PI/2; }
    else if (face === 2){ px = b.px; pz = b.pz + b.d/2 + 0.4; ry = 0; }
    else { px = b.px; pz = b.pz - b.d/2 - 0.4; ry = Math.PI; }
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(signW, signH), mat);
    sign.position.set(px, b.h*R(0.45,0.8), pz);
    sign.rotation.y = ry;
    cityGroup.add(sign);
    mtl.push(mat);
  }
  // big animated billboards on tall towers
  const towers = buildingDataAll.filter(b => b.h > 90).slice(0,2);
  const screenMats = [];
  for (let i=0;i<2;i++){
    const t = towers[i] || towers[0] || null;
    if (!t) break;
    const cw = 96, ch = 256;
    const cv = liveScreenTex(cw, ch, (g,w,h)=>{
      const t2 = performance.now()/1000;
      g.fillStyle = '#04060c';
      g.fillRect(0,0,w,h);
      // shifting bars
      for (let k=0;k<22;k++){
        const y = ((k*14 + t2*30) % (h+60)) - 30;
        g.fillStyle = k%3===0 ? 'rgba(120,220,255,0.9)' : k%3===1 ? 'rgba(255,160,255,0.75)' : 'rgba(255,220,120,0.8)';
        g.fillRect(k*6, y, 4, t2*80 % 14 + 8);
      }
      g.font = '16px monospace'; g.textAlign='center';
      g.fillStyle = '#eef6ff';
      g.fillText('LIVE', w/2, 60);
      g.fillText('FEED 0'+(i+1), w/2, 80);
      const hh = Math.floor((t2/3) % 24);
      const mm = Math.floor((t2*20) % 60);
      g.fillText(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'), w/2, 210);
    });
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const mat = new THREE.MeshBasicMaterial({ map:tex });
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(18, 44), mat);
    const side = i%2===0 ? 1 : -1;
    screen.position.set(t.px + side*(t.w/2+0.3), t.h*0.62, t.pz);
    screen.rotation.y = side>0 ? Math.PI/2 : -Math.PI/2;
    // frame
    const frame = new THREE.Mesh(new THREE.BoxGeometry(19.4, 45.4, 0.8),
      new THREE.MeshLambertMaterial({ color:0x101318 }));
    frame.position.copy(screen.position);
    frame.rotation.y = screen.rotation.y;
    cityGroup.add(frame);
    cityGroup.add(screen);
    const bMat = new THREE.MeshBasicMaterial({ color:0xff4040 });
    const blink = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), bMat);
    blink.position.set(t.px + side*(t.w/2+0.3), t.h + 1.2, t.pz);
    cityGroup.add(blink);
    screenMats.push({ mat, cv, i });
  }
  return { signMats: mtl, screenMats };
}

const plazaBlock = { bi:5, bj:5 };

      if (bi===plazaBlock.bi && bj===plazaBlock.bj) continue;
      const dist = Math.max(Math.abs(bi-5.5), Math.abs(bj-5.5));

      const bs = collectBuildings(cx, cz, tier);

  addRoads();
  addProps();
  addStreetlights();

  addTrees(plaza);
  signs = buildSigns();
  trafficLights = addTrafficLights();
}

const carUp = new THREE.Vector3(0,1,0);
const carFwd = new THREE.Vector3();
const carQDummy = new THREE.Object3D();

function updateTraffic(dt, t){
  for (let i=0;i<CAR_N;i++){
    const c = cars[i];
    // gentle speed variation / occasional slow-down
    const near = Math.abs(c.pos) > CITY_HALF-60 ? 0.6 : 1;
    c.pos += c.dir * c.spd * near * dt;
    if (Math.abs(c.pos) > CITY_HALF + 30){
      c.type = Math.random()<0.5?0:1;
      c.line = (RI(0,BLOCKS)-6)*BLOCK_SP;
      c.dir = c.dir * (Math.random()<0.5?1:-1);
      c.pos = -Math.sign(c.pos) * CITY_HALF;
      c.off = Math.random()<0.5?-1:1;
      c.spd = R(7,13);
    }
    // turn at intersections
    const m = Math.round(c.pos / BLOCK_SP);
    const dCross = c.pos - m*BLOCK_SP;
    if (Math.abs(dCross) < c.spd*dt + 0.01){
      const turnP = (Math.abs(m) <= 6 && Math.abs(c.line/max1(c.line)) <= (2*BLOCK_SP+1)) ? 0.28 : 0.12;
      if (Math.random() < turnP){
        const oldType = c.type;
        const oldLine = c.line;
        const opos = c.pos;
        c.type = 1 - oldType;
        c.line = m*BLOCK_SP;
        c.pos = oldLine;
        c.dir = Math.random()<0.5?1:-1;
        c.off = Math.random()<0.5?-1:1;
        c.spd = R(7,13);
        void opos;
      }
    }
    // world pos & heading
    let wx, wz, hx, hz;
    if (c.type===0){ wx = c.line + c.off*3.1; wz = c.pos; hx = 0; hz = c.dir; }
    else           { wx = c.pos; wz = c.line + c.off*3.1; hx = c.dir; hz = 0; }
    carFwd.set(hx, 0, hz).normalize();
    carQDummy.position.set(wx, 0.55, wz);
    carQDummy.quaternion.setFromUnitVectors(carUp, carFwd);
    carQDummy.scale.set(1,1,1);
    carQDummy.updateMatrix();
    carMesh.setMatrixAt(i, carQDummy.matrix);

    carQDummy.position.set(wx + hx*2.15, 0.42, wz + hz*2.15);
    carQDummy.updateMatrix();
    hlMesh.setMatrixAt(i, carQDummy.matrix);
    carQDummy.position.set(wx - hx*2.15, 0.42, wz - hz*2.15);
    carQDummy.updateMatrix();
    tlMesh.setMatrixAt(i, carQDummy.matrix);
  }
  carMesh.instanceMatrix.needsUpdate = true;
  hlMesh.instanceMatrix.needsUpdate = true;
  tlMesh.instanceMatrix.needsUpdate = true;
}
function max1(v){ return v === 0 ? 1 : Math.abs(v); }

function addSky(){

    fragmentShader: `
      uniform vec3 uMoonDir;

      void main(){
        float h = normalize(vDir).y;

  wings.position.y = 0.06; plane.add(wings);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 0.3),
    new THREE.MeshLambertMaterial({ color:0x0e1116 }));
  tail.position.set(0, 1.2, -4); plane.add(tail);
  const navR = new THREE.Mesh(new THREE.SphereGeometry(1.1, 6,6), new THREE.MeshBasicMaterial({ color:0xff2020 }));
  navR.position.set(-6.6, 0.3, 0.6); plane.add(navR);
  const navG = new THREE.Mesh(new THREE.SphereGeometry(1.1, 6,6), new THREE.MeshBasicMaterial({ color:0x30ff60 }));
  navG.position.set(6.6, 0.3, 0.6); plane.add(navG);
  const strobe = new THREE.Mesh(new THREE.SphereGeometry(0.9, 6,6), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0 }));
  strobe.position.set(0, 1.6, -1.5); plane.add(strobe);
  plane.userData.strobe = strobe;
  plane.position.set(400, 330, -600);
  scene.add(plane);
  return { stars, starMat, plane };
}
const skyStuff = addSky();

/* ============================== searchlights ============================== */
function addSearchlights(){
  const beams = [];
  const specs = [
    { x:60, z:40, c:0xa8d4ff, o:0.05, ph:0 },
    { x:-80, z:-30, c:0xf2bfff, o:0.045, ph:2.1 }
  ];
  for (const s of specs){
    const geo = new THREE.ConeGeometry(8, 340, 16, 1, true);
    geo.translate(0, 170, 0);
    const mat = new THREE.MeshBasicMaterial({
      color:s.c, transparent:true, opacity:s.o, blending:THREE.AdditiveBlending,
      depthWrite:false, side:THREE.DoubleSide, fog:false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(s.x, 1, s.z);
    mesh.userData.ph = s.ph;
    beams.push(mesh);
    cityGroup.add(mesh);
  }
  return beams;
}
const beams = addSearchlights();

/* ============================== rain ============================== */
let rainOn = true;
const RAIN_N = 1500;
function makeRain(){
  const posA = new Float32Array(RAIN_N*3);
  const posB = new Float32Array(RAIN_N*3);
  const seed = [];
  for (let i=0;i<RAIN_N;i++){
    seed.push({ x:R(-260,260), y:R(20,260), z:R(-340,340), s:R(22,30) });
    posA[i*3]=seed[i].x; posA[i*3+1]=seed[i].y; posA[i*3+2]=seed[i].z;
    posB[i*3]=seed[i].x+0.4; posB[i*3+1]=seed[i].y-1.8; posB[i*3+2]=seed[i].z+0.15;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(RAIN_N*6), 3));
  const posAttr = geo.attributes.position;
  for (let i=0;i<RAIN_N;i++){
    posAttr.setXYZ(i*2,   posA[i*3], posA[i*3+1], posA[i*3+2]);
    posAttr.setXYZ(i*2+1, posB[i*3], posB[i*3+1], posB[i*3+2]);
  }
  const mat = new THREE.LineBasicMaterial({ color:0x9db4e8, transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, depthWrite:false, fog:false });
  const rain = new THREE.LineSegments(geo, mat);
  rain.frustumCulled = false;
  scene.add(rain);
  return { rain, seed };
}
const rainSys = makeRain();

function updateRain(dt, camPos){
  if (!rainOn){ rainSys.rain.visible = false; return; }
  rainSys.rain.visible = true;
  const posAttr = rainSys.rain.geometry.attributes.position;
  const s = rainSys.seed;
  for (let i=0;i<RAIN_N;i++){
    s[i].y -= s[i].s * dt;
    s[i].x += 2.2*dt;  // wind slant
    if (s[i].y < camPos.y - 30){ s[i].y = camPos.y + R(120,220); s[i].x = camPos.x + R(-260,260); s[i].z = camPos.z + R(-340,340); }
    const dx = s[i].x - camPos.x, dz = s[i].z - camPos.z;
    if (Math.abs(dx) > 320 || Math.abs(dz) > 420){
      s[i].x = camPos.x + R(-260,260);
      s[i].z = camPos.z + R(-340,340);
    }
    posAttr.setXYZ(i*2,   s[i].x, s[i].y, s[i].z);
    posAttr.setXYZ(i*2+1, s[i].x + 0.5, s[i].y - 1.9, s[i].z + 0.25);
  }
  posAttr.needsUpdate = true;
}

/* ============================== camera rig ============================== */
const CAM = [
  { t:0,   p:[46,4.5,112],    l:[30,7,56],    fov:60 },
  { t:9,   p:[12,5.5,76],     l:[4,9,32],     fov:58 },
  { t:17,  p:[-16,8,30],      l:[-20,13,-4],  fov:55 },
  { t:26,  p:[-64,26,-36],    l:[-8,18,6],    fov:49 },
  { t:40,  p:[-120,64,-108],  l:[-16,30,-30], fov:52 },
  { t:55,  p:[-70,128,-250],  l:[0,22,0],     fov:46 },
  { t:70,  p:[230,158,-140],  l:[12,26,12],   fov:45 }
];
const camState = {
  yaw:0, pitch:0, distScale:1, tgtDist:1, free:false
};
let controls = null;
const camT = new THREE.Vector3();
const camP = new THREE.Vector3();
const camDir = new THREE.Vector3();

function camSegment(t){
  if (t <= 70){
    for (let i=0;i<CAM.length-1;i++){
      if (t >= CAM[i].t && t < CAM[i+1].t){
        return { a:CAM[i], b:CAM[i+1], lt:(t-CAM[i].t)/(CAM[i+1].t-CAM[i].t) };
      }
    }
    return { a:CAM[CAM.length-1], b:CAM[CAM.length-1], lt:0 };
  }
  const lc = (t - 55) % 30;
  if (lc <= 15) return { a:CAM[5], b:CAM[6], lt:lc/15 };
  return { a:CAM[6], b:CAM[5], lt:(lc-15)/15 };
}

function updateCamera(dt, t){
  if (camState.free && controls){
    controls.update();
    return;
  }
  const seg = camSegment(t);
  const e = seg.a===seg.b ? 0 : easeInOut(seg.lt);
  const p = [
    lerp(seg.a.p[0], seg.b.p[0], e),
    lerp(seg.a.p[1], seg.b.p[1], e),
    lerp(seg.a.p[2], seg.b.p[2], e)
  ];
  const l = [
    lerp(seg.a.l[0], seg.b.l[0], e),
    lerp(seg.a.l[1], seg.b.l[1], e),
    lerp(seg.a.l[2], seg.b.l[2], e)
  ];
  camT.set(l[0],l[1],l[2]);
  camP.set(p[0],p[1],p[2]);

  camDir.subVectors(camP, camT);
  const r = camDir.length() * camState.distScale;
  let yawB = Math.atan2(camDir.x, camDir.z) + camState.yaw;
  let pitB = Math.asin(clamp(camDir.y / Math.max(camDir.length(), 1e-5), -1, 1)) + camState.pitch;
  pitB = clamp(pitB, 0.06, 1.35);
  const pos = new THREE.Vector3(
    camT.x + Math.sin(yawB)*Math.cos(pitB)*r,
    camT.y + Math.sin(pitB)*r,
    camT.z + Math.cos(yawB)*Math.cos(pitB)*r
  );
  // handheld sway — stronger at street level
  const swayAmp = 0.03 + 0.18 * clamp(1 - pos.y/70, 0, 1);
  pos.x += Math.sin(t*0.9)*swayAmp;
  pos.y += Math.cos(t*1.3)*swayAmp*0.7;
  pos.z += Math.sin(t*0.7+1.0)*swayAmp;

  camera.position.copy(pos);
  camera.lookAt(camT);
  // smooth fov
  const fovTarget = seg.a===seg.b ? seg.a.fov : lerp(seg.a.fov, seg.b.fov, e);
  camera.fov += (fovTarget - camera.fov) * Math.min(1, dt*3);
  camera.updateProjectionMatrix();
  camState.distScale += (camState.tgtDist - camState.distScale) * Math.min(1, dt*3);
}

/* ============================== bloom / composer ============================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.55, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let bloomOn = true;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
window.addEventListener('resize', resize);

/* ============================== input ============================== */
function setupControls(){
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enabled = false;
}
setupControls();

const drag = { on:false, x:0, y:0 };
canvasPointer(renderer.domElement);
function canvasPointer(el){
  el.addEventListener('pointerdown', e => {
    drag.on = true; drag.x = e.clientX; drag.y = e.clientY;
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  });
  el.addEventListener('pointermove', e => {
    if (!drag.on) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!camState.free){
      camState.yaw   = clamp(camState.yaw   + dx*0.004, -1.2, 1.2);
      camState.pitch = clamp(camState.pitch + dy*0.0028, -0.42, 0.42);
    }
  });
  el.addEventListener('pointerup',   () => drag.on = false);
  el.addEventListener('pointercancel',() => drag.on = false);
  el.addEventListener('wheel', e => {
    if (camState.free) return;
    camState.tgtDist = clamp(camState.tgtDist * (e.deltaY > 0 ? 1.12 : 0.89), 0.35, 2.6);
  }, { passive:true });
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'b'){
    bloomOn = !bloomOn; bloom.enabled = bloomOn;
  } else if (k === 'c'){
    camState.free = !camState.free;
    if (camState.free){
      controls.target.copy(camT);
      camera.position.copy(camera.position);
      controls.enabled = true;
    } else {
      controls.enabled = false;
    }
  } else if (k === 'k'){
    rainOn = !rainOn;
  } else if (k === 'r'){
    camState.yaw = 0; camState.pitch = 0; camState.tgtDist = 1;
  }
});

/* ============================== overlay / clock ============================== */
const bootEl = document.getElementById('boot');
const titleEl = document.getElementById('title');
const clockEl = document.getElementById('clock');
let simClock = 23*60 + 52;
function tickClock(){
  simClock = (simClock + 1) % (24*60);
  const hh = Math.floor(simClock/60), mm = simClock%60;
  clockEl.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
setInterval(tickClock, 30000);

let booted = false;
function hideBoot(){
  if (booted) return;
  booted = true;
  bootEl.classList.add('gone');
  setTimeout(()=>{ bootEl.style.display='none'; }, 1400);
  titleEl.classList.add('gone');
}

/* ============================== main loop ============================== */
const clock = new THREE.Clock();
const sprayPosAttr = plaza && plaza.spray ? plaza.spray.geometry.attributes.position : null;
let lastScreenT = 0;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  facadeUniforms.uTime.value = t;
  skyStuff.starMat.opacity = 0.8 + 0.12 * Math.sin(t*0.5);

  updateTraffic(dt, t);
  updateCamera(dt, t);
  updateRain(dt, camera.position);

  // fountain spray
  if (plaza && sprayPosAttr){
    const seed = plaza.spray.userData.spraySeed;
    for (let i=0;i<seed.length;i++){
      const s = seed[i];
      const y = 0.35 + Math.abs(Math.sin(t*s.sp + s.ph))*4.2;
      sprayPosAttr.setXYZ(i, Math.cos(s.a)*s.r, y, Math.sin(s.a)*s.r);
    }
    sprayPosAttr.needsUpdate = true;
  }

  // traffic lights
  if (trafficLights){
    const cyc = 8, dur = t % cyc;
    for (const tl of trafficLights){
      const d = (dur + tl.offset) % cyc;
      const st = d < 4 ? 'g' : d < 4.8 ? 'a' : 'r';
      tl.r.material.opacity = st==='r' ? 1 : 0.12;
      tl.a.material.opacity = st==='a' ? 1 : 0.1;
      tl.g_.material.opacity = st==='g' ? 1 : 0.12;
    }
  }

  // neon sign pulse + animated screens (throttled)
  if (signs){
    for (const m of signs.signMats){
      m.opacity = (0.7 + 0.3*Math.sin(t*m.userData.speed + m.userData.phase)) * m.userData.baseOpacity;
    }
    if (t - lastScreenT > 0.12){
      lastScreenT = t;
      for (const sm of signs.screenMats){
        drawScreenNow(sm.cv, sm.i);
      }
    }
  }

  // antenna beacons
  cityGroup.children.forEach(ch => {
    if (ch.userData && ch.userData.kind === 'beacon'){
      const ph = t + ch.userData.phase;
      const on = (Math.floor(ph*1.4) % 2) === 0;
      ch.material.opacity = on ? 1 : 0.15;
    }
  });

  // searchlight sweep
  for (const b of beams){
    b.rotation.y = t*0.22 + b.userData.ph;
    b.rotation.z = Math.PI/2 - 0.45 + Math.sin(t*0.11 + b.userData.ph)*0.4;
  }

  // aircraft
  {
    const pl = skyStuff.plane;
    const ang = t*0.018;
    const x = Math.cos(ang)*980 + 80, z = Math.sin(ang)*980 - 240;
    const y = 310 + Math.sin(t*0.07)*24;
    pl.position.set(x, y, z);
    const nx = Math.cos(ang+0.02)*980 + 80, nz = Math.sin(ang+0.02)*980 - 240;
    pl.lookAt(nx, y, nz);
    const st = pl.userData.strobe;
    st.material.opacity = (Math.floor(t*2) % 2) === 0 ? 1 : 0.05;
  }

  // drifting clouds
  cityGroup.children.forEach(ch => {
    if (ch.userData && ch.userData.kind === 'cloud'){
      ch.position.x += ch.userData.spd * dt;
      if (ch.position.x > 1300) ch.position.x = -1300;
    }
  });

  composer.render();

  if (!booted && t > 1.6) hideBoot();
}

/* small helper: redraw an animated screen */
function drawScreenNow(cv, idx){
  const g = cv.getContext('2d');
  const t = performance.now()/1000;
  const w = cv.width, h = cv.height;
  g.fillStyle = '#04060c'; g.fillRect(0,0,w,h);
  for (let k=0;k<22;k++){
    const yy = ((k*14 + t*30) % (h+60)) - 30;
    g.fillStyle = k%3===0 ? 'rgba(120,220,255,0.9)' : k%3===1 ? 'rgba(255,160,255,0.75)' : 'rgba(255,220,120,0.8)';
    g.fillRect(k*6, yy, 4, (t*80 % 14) + 8);
  }
  g.font = '16px monospace'; g.textAlign='center';
  g.fillStyle = '#eef6ff';
  g.fillText('LIVE', w/2, 58);
  g.fillText('FEED 0'+(idx+1), w/2, 78);
  const hh = Math.floor((t/3) % 24), mm = Math.floor((t*20) % 60);
  g.fillText(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'), w/2, 208);
  cv.imgDirty = true;
  if (cv.tex) cv.tex.needsUpdate = true;
}

/* seed screen textures */
function initScreens(){
  if (signs && signs.screenMats){
    for (const sm of signs.screenMats){
      sm.mat.map.needsUpdate = true;
      sm.cv.tex = sm.mat.map;
    }
  }
}
initScreens();

window.addEventListener('error', (e) => {
  errbox.style.display = 'block';
  errbox.textContent = 'Something went wrong: ' + (e.message || e.type);
});

resize();
updateCamera(0, 0);
frame();
</script>
</body>
