<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Infinite Maze — Autonomous First-Person Navigation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 4, 10, 0.6) 100%);
  }
  #hud {
    position: fixed; left: 20px; bottom: 16px; z-index: 10; pointer-events: none;
    user-select: none; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: rgba(150, 205, 255, 0.9); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9);
    letter-spacing: 3px;
  }
  #hud .badge { font-size: 12px; font-weight: 700; }
  #hud .sub { font-size: 10px; letter-spacing: 2px; opacity: 0.55; margin-top: 4px; }
  #hud .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3fe0ff; margin-right: 8px; animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px #3fe0ff; }
    50%      { opacity: 0.35; box-shadow: 0 0 2px #3fe0ff; }
  }
  #err {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9cf; font-family: monospace; font-size: 13px; letter-spacing: 1px;
    padding: 2em; text-align: center;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hud">
  <div class="badge"><span class="dot"></span>AUTONOMOUS MAZE · INFINITE</div>
  <div class="sub">self-navigating first-person · procedural corridors · three.js</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function () {
  if (typeof THREE === 'undefined') {
    document.body.innerHTML =
      '<div id="err">Could not load Three.js from the CDN.<br>' +
      'Open this file with network access, or check the console.</div>';
    return;
  }

  // ------------------------------------------------------------------
  // Constants
  // ------------------------------------------------------------------
  const S = 10;          // cell size (world units)
  const H = 4;           // wall height
  const T = 0.8;         // wall thickness
  const WALL_PCT = 42;   // probability (%) that an edge holds a wall
  const SPEED = 8;       // autonomous walking speed (units / second)
  const EYE = 1.6;       // eye height
  const R = 4;           // active render radius (cells)

  // ------------------------------------------------------------------
  // Infinite maze: deterministic per-cell hash. A wall exists on the
  // edge between two cells iff the canonical edge hash says so, and a
  // cell whose four edges would all be walls forces its most-openable
  // edge open, so no cell can ever trap the walker.
  // ------------------------------------------------------------------
  function hash2i(x, y) {
    let h = (Math.imul(x, 0x9E3779B1) ^ Math.imul(y, 0x85EBCA77)) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x45D9F3B) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x45D9F3B) >>> 0;
    return (h ^ (h >>> 16)) >>> 0;
  }

  function edgeKey(cx, cz, dx, dz) {
    let ax = cx, az = cz, bx = cx + dx, bz = cz + dz;
    if (bx < ax || (bx === ax && bz < az)) {
      let t = ax; ax = bx; bx = t;
      t = az; az = bz; bz = t;
    }
    let h = hash2i(ax, az);
    h = Math.imul(h ^ hash2i(bx, bz), 0x27D4EB2D) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 0x165667B1) >>> 0;
    return (h ^ (h >>> 15)) >>> 0;
  }

  function edgeWall(cx, cz, dx, dz) {
    return (edgeKey(cx, cz, dx, dz) % 100) < WALL_PCT;
  }

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function edgeOverrideOpen(cx, cz, dx, dz) {
    let allWalls = true;
    for (let i = 0; i < 4; i++) {
      if (!edgeWall(cx, cz, DIRS[i][0], DIRS[i][1])) { allWalls = false; break; }
    }
    if (!allWalls) return false;
    let best = DIRS[0], bestK = edgeKey(cx, cz, 1, 0);
    for (let i = 1; i < 4; i++) {
      const k = edgeKey(cx, cz, DIRS[i][0], DIRS[i][1]);
      if (k < bestK) { bestK = k; best = DIRS[i]; }
    }
    return dx === best[0] && dz === best[1];
  }

  function isOpen(cx, cz, dx, dz) {
    if (!edgeWall(cx, cz, dx, dz)) return true;
    return edgeOverrideOpen(cx, cz, dx, dz) ||
           edgeOverrideOpen(cx + dx, cz + dz, -dx, -dz);
  }

  // ------------------------------------------------------------------
  // Autonomous navigation: walk centre to centre, decide at each centre.
  // Prefer straight, then left/right; only turn back into a dead end
  // when no other passage is open.
  // ------------------------------------------------------------------
  function chooseNext(cx, cz, prev) {
    const open = DIRS.filter(function (d) {
      return isOpen(cx, cz, d[0], d[1]);
    });
    if (!open.length) return prev;
    const back = [-prev[0], -prev[1]];
    let cands = open.filter(function (d) {
      return !(d[0] === back[0] && d[1] === back[1]);
    });
    if (!cands.length) cands = open;
    const left = [-prev[1], prev[0]];
    const right = [prev[1], -prev[0]];
    let straight = null, l = null, r = null;
    for (let i = 0; i < cands.length; i++) {
      const d = cands[i];
      if (d[0] === prev[0] && d[1] === prev[1]) straight = d;
      else if (d[0] === left[0] && d[1] === left[1]) l = d;
      else if (d[0] === right[0] && d[1] === right[1]) r = d;
    }
    const roll = Math.random();
    if (straight && roll < 0.5) return straight;
    if (l && roll < 0.75) return l;
    if (r) return r;
    if (straight) return straight;
    if (l) return l;
    return cands[0];
  }

  let cx = 0, cz = 0;          // absolute cell coordinates of the walker
  let dir = [1, 0];            // current movement direction
  for (let i = 0; i < 4; i++) {
    if (isOpen(0, 0, DIRS[i][0], DIRS[i][1])) { dir = DIRS[i]; break; }
  }
  let progress = 0;            // distance travelled inside the current cell
  let heading = Math.atan2(-dir[0], -dir[1]);
  let targetHeading = heading;

  function updateNav(dt) {
    progress += SPEED * dt;
    let guard = 0;
    while (progress >= S && guard++ < 8) {
      cx += dir[0]; cz += dir[1];      // arrived at the next centre
      progress -= S;
      const nd = chooseNext(cx, cz, dir);
      const turned = nd[0] !== dir[0] || nd[1] !== dir[1];
      dir = nd;
      targetHeading = Math.atan2(-dir[0], -dir[1]);
      if (turned) progress = 0;        // start the new leg from the centre
    }
  }

  // ------------------------------------------------------------------
  // Textures (procedural canvases)
  // ------------------------------------------------------------------
  function makeWallTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#4c5a70';
    g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(10, 14, 24, 0.5)';
    g.lineWidth = 3;
    for (let i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
    g.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    g.lineWidth = 1;
    for (let i = 64; i < 256; i += 64) {
      g.beginPath(); g.moveTo(2, i - 2); g.lineTo(254, i - 2); g.stroke();
    }
    for (let i = 0; i < 1400; i++) {
      g.fillStyle = 'rgba(0, 0, 0, ' + (Math.random() * 0.12).toFixed(3) + ')';
      g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  function makeFloorTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#151c2a';
    g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(90, 190, 255, 0.16)';
    g.lineWidth = 2;
    for (let i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
    for (let i = 0; i < 500; i++) {
      g.fillStyle = 'rgba(255, 255, 255, ' + (Math.random() * 0.05).toFixed(3) + ')';
      g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  const wallTex = makeWallTexture();
  const floorTex = makeFloorTexture();

  // ------------------------------------------------------------------
  // Scene / renderer / camera / lights
  // ------------------------------------------------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f1e);
  scene.fog = new THREE.Fog(0x0a0f1e, 7, 30);

  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
  camera.rotation.order = 'YXZ';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0x9db8ff, 0x1c1526, 0.85));
  const dl = new THREE.DirectionalLight(0xffe8c8, 1.0);
  dl.position.set(25, 40, 15);
  scene.add(dl);
  const pl = new THREE.PointLight(0x66ccff, 0.55, 45);
  scene.add(pl);

  // ------------------------------------------------------------------
  // Instanced geometry for floors, walls and glowing wall caps
  // ------------------------------------------------------------------
  const Y_AXIS = new THREE.Vector3(0, 1, 0);
  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _qFloor = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
  const _s = new THREE.Vector3(1, 1, 1);
  const _p = new THREE.Vector3();
  const _c = new THREE.Color();

  const CELLS = (2 * R + 1) * (2 * R + 1);
  const MAX_WALLS = CELLS * 4;

  const floorMesh = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(S, S),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.95, metalness: 0.02 }),
    CELLS
  );
  floorMesh.frustumCulled = false;

  const wallMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(S, H, T),
    new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.85, metalness: 0.08 }),
    MAX_WALLS
  );
  wallMesh.frustumCulled = false;

  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x3fe0ff, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  });
  const glowMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(S, 0.08, T + 0.3),
    glowMat,
    MAX_WALLS
  );
  glowMesh.frustumCulled = false;

  scene.add(floorMesh);
  scene.add(wallMesh);
  scene.add(glowMesh);

  // ------------------------------------------------------------------
  // Floating dust motes
  // ------------------------------------------------------------------
  const PCOUNT = 320;
  const pArr = new Float32Array(PCOUNT * 3);
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
  const pMat = new THREE.PointsMaterial({
    color: 0x7fd8ff, size: 0.4, transparent: true, opacity: 0.5,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const pts = new THREE.Points(pGeo, pMat);
  pts.frustumCulled = false;
  scene.add(pts);

  function rebuildParticles() {
    const a = pGeo.attributes.position.array;
    const m = R * S + 6;
    for (let i = 0; i < PCOUNT; i++) {
      a[i * 3] = (Math.random() * 2 - 1) * m;
      a[i * 3 + 1] = 0.4 + Math.random() * (H + 4);
      a[i * 3 + 2] = (Math.random() * 2 - 1) * m;
    }
    pGeo.attributes.position.needsUpdate = true;
  }

  // ------------------------------------------------------------------
  // Anchored world: all geometry is rebuilt relative to the walker's
  // current cell, so coordinates never drift and precision never
  // degrades no matter how far the walker travels.
  // ------------------------------------------------------------------
  let anchor = { x: 0, z: 0 };

  function rebuild() {
    let wi = 0, fi = 0, gi = 0;
    for (let dx = -R; dx <= R; dx++) {
      for (let dz = -R; dz <= R; dz++) {
        const ccx = anchor.x + dx, ccz = anchor.z + dz;
        const lx = dx * S, lz = dz * S;
        const h = hash2i(ccx, ccz);
        const hue = 210 + (((h % 19) + 19) % 19 - 9) * 2.2;

        // floor
        _p.set(lx, 0, lz);
        _m.compose(_p, _qFloor, _s);
        floorMesh.setMatrixAt(fi, _m);
        _c.setHSL(hue / 360, 0.22, 0.15 + ((h >> 4) % 6) * 0.016);
        floorMesh.setColorAt(fi, _c);
        fi++;

        // walls (each edge is added once, from the canonical cell)
        for (let i = 0; i < 4; i++) {
          const edx = DIRS[i][0], edz = DIRS[i][1];
          const ecx = ccx + edx, ecz = ccz + edz;
          if (ecx < ccx || (ecx === ccx && ecz < ccz)) continue;
          if (isOpen(ccx, ccz, edx, edz)) continue; // passage, no wall
          let wx, wz, rotY = 0;
          if (edx === 1)       { wx = lx + S / 2; wz = lz; }
          else if (edx === -1) { wx = lx - S / 2; wz = lz; }
          else if (edz === 1)  { wx = lx; wz = lz + S / 2; rotY = Math.PI / 2; }
          else                 { wx = lx; wz = lz - S / 2; rotY = Math.PI / 2; }

          _p.set(wx, H / 2, wz);
          _q.setFromAxisAngle(Y_AXIS, rotY);
          _m.compose(_p, _q, _s);
          wallMesh.setMatrixAt(wi, _m);
          _c.setHSL(hue / 360, 0.28, 0.50 + ((h >> 8) % 6) * 0.018);
          wallMesh.setColorAt(wi, _c);
          wi++;

          _p.set(wx, H + 0.045, wz);
          _m.compose(_p, _q, _s);
          glowMesh.setMatrixAt(gi, _m);
          gi++;
        }
      }
    }
    floorMesh.count = fi;
    floorMesh.instanceMatrix.needsUpdate = true;
    if (floorMesh.instanceColor) floorMesh.instanceColor.needsUpdate = true;
    wallMesh.count = wi;
    wallMesh.instanceMatrix.needsUpdate = true;
    if (wallMesh.instanceColor) wallMesh.instanceColor.needsUpdate = true;
    glowMesh.count = gi;
    glowMesh.instanceMatrix.needsUpdate = true;
    rebuildParticles();
  }

  // ------------------------------------------------------------------
  // Per-frame update
  // ------------------------------------------------------------------
  let bobPhase = 0;
  let lastRebuild = -1;

  function updateCamera(dt) {
    let diff = targetHeading - heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    heading += diff * Math.min(1, dt * 10);

    bobPhase += SPEED * dt * 2.6;
    const bob = Math.sin(bobPhase) * 0.06;

    const px = cx * S + dir[0] * progress;
    const pz = cz * S + dir[1] * progress;

    const ax = Math.floor(px / S);
    const az = Math.floor(pz / S);
    if (ax !== anchor.x || az !== anchor.z) {
      anchor.x = ax; anchor.z = az;
      rebuild();
    }

    camera.position.set(px - anchor.x * S, EYE + bob, pz - anchor.z * S);
    camera.rotation.y = heading;
    pl.position.copy(camera.position);
  }

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    updateNav(dt);
    updateCamera(dt);
    glowMat.opacity = 0.55 + Math.sin(clock.elapsedTime * 1.4) * 0.2;
    pts.rotation.y += dt * 0.02;
    pts.position.y = (Math.sin(clock.elapsedTime * 0.4) * 0.5 + 0.5) * 4;
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  rebuild();
  animate();
})();
</script>
</body>
</html>
