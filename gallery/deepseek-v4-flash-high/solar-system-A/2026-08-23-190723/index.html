<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miniature Solar System</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 16px;
    left: 18px;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  }
  #hud .title { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  #hud .sub { font-size: 12px; color: rgba(255, 255, 255, 0.62); margin-top: 3px; }

  #controls {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #controls button {
    background: rgba(20, 26, 48, 0.75);
    border: 1px solid rgba(120, 150, 255, 0.35);
    color: #dfe6ff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #controls button:hover { background: rgba(40, 52, 96, 0.9); border-color: rgba(150, 180, 255, 0.6); }

  #hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    letter-spacing: 0.4px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="title">Miniature Solar System</div>
    <div class="sub">Three.js &middot; 8 planets + a moon</div>
  </div>

  <div id="controls">
    <button id="toggleLabels">Labels: on</button>
    <button id="toggleOrbits">Orbits: on</button>
    <button id="togglePause">Pause</button>
  </div>

  <div id="hint">Drag to rotate &middot; Scroll to zoom</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
  (function () {
    "use strict";

    var container = document.getElementById("app");

    // ---------- Renderer / Scene / Camera ----------
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060f);

    var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(22, 32, 88);

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 7;
    controls.maxDistance = 260;
    controls.target.set(0, 0, 0);

    // ---------- Lights ----------
    scene.add(new THREE.AmbientLight(0x334466, 0.55));
    var sunLight = new THREE.PointLight(0xfff2d9, 2.6, 0, 0);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // ---------- Star field ----------
    (function addStars() {
      var N = 4200;
      var pos = new Float32Array(N * 3);
      for (var i = 0; i < N; i++) {
        var r = 480 + Math.random() * 720;
        var theta = Math.random() * Math.PI * 2;
        var phi = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i * 3 + 2] = r * Math.cos(phi);
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      var mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false });
      scene.add(new THREE.Points(geo, mat));
    })();

    // ---------- The Sun ----------
    var sun = new THREE.Mesh(
      new THREE.SphereGeometry(5, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xffcc55 })
    );
    scene.add(sun);

    // Radial-gradient glow texture
    function makeGlowTexture() {
      var c = document.createElement("canvas");
      c.width = c.height = 256;
      var ctx = c.getContext("2d");
      var g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, "rgba(255,225,160,1)");
      g.addColorStop(0.25, "rgba(255,175,70,0.55)");
      g.addColorStop(0.6, "rgba(255,130,40,0.16)");
      g.addColorStop(1, "rgba(255,130,40,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      var tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    var glow = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: makeGlowTexture(),
        color: 0xffaa33,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })
    );
    glow.scale.set(30, 30, 1);
    scene.add(glow);

    // ---------- Planet catalog ----------
    var PLANETS = [
      { name: "Mercury", radius: 0.40, orbit: 9,  speed: 0.050, spin: 1.2, tilt: 0.03, color: 0x8b8b8b },
      { name: "Venus",   radius: 0.70, orbit: 12, speed: 0.035, spin: 0.6, tilt: 0.12, color: 0xe6c37f },
      { name: "Earth",   radius: 0.80, orbit: 16, speed: 0.027, spin: 1.0, tilt: 0.41, color: 0x5b8dff, moon: true },
      { name: "Mars",    radius: 0.55, orbit: 20, speed: 0.022, spin: 0.9, tilt: 0.30, color: 0xe2713d },
      { name: "Jupiter", radius: 2.20, orbit: 27, speed: 0.012, spin: 2.2, tilt: 0.05, color: 0xd9a066 },
      { name: "Saturn",  radius: 1.70, orbit: 34, speed: 0.009, spin: 2.0, tilt: 0.46, color: 0xe8d39a,
        ring: { inner: 2.4, outer: 4.2, color: 0xcbb079 } },
      { name: "Uranus",  radius: 1.20, orbit: 41, speed: 0.006, spin: 1.3, tilt: 1.45, color: 0x8fd8d8 },
      { name: "Neptune", radius: 1.20, orbit: 47, speed: 0.0045, spin: 1.3, tilt: 0.50, color: 0x4a6ff5 }
    ];

    // ---------- Text sprite labels ----------
    function makeTextSprite(text) {
      var canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 64;
      var ctx = canvas.getContext("2d");
      ctx.font = "Bold 40px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.fillText(text, 128, 32);

      var mat = new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(canvas),
        transparent: true,
        depthWrite: false,
      });
      var sprite = new THREE.Sprite(mat);
      sprite.scale.set(3.2, 0.8, 1);
      return sprite;
    }

    // ---------- Build the system ----------
    var planets = [];
    var orbitLines = [];
    var labelSprites = [];

    PLANETS.forEach(function (p) {
      // Orbit pivot at the sun. Rotating this group around Y moves the planet.
      var orbit = new THREE.Group();
      scene.add(orbit);

      // Spin pivot positioned on the orbit; spins the planet on its axis.
      var spin = new THREE.Group();
      spin.position.x = p.orbit;
      orbit.add(spin);

      // Tilt for an axial lean.
      var tilt = new THREE.Group();
      tilt.rotation.z = p.tilt;
      spin.add(tilt);

      var planetMesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.radius, 32, 32),
        new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.85, metalness: 0.08 })
      );
      tilt.add(planetMesh);

      // Saturn's ring.
      if (p.ring) {
        var ring = new THREE.Mesh(
          new THREE.RingGeometry(p.ring.inner, p.ring.outer, 80),
          new THREE.MeshBasicMaterial({
            color: p.ring.color,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.65,
          })
        );
        ring.rotation.x = -Math.PI / 2;
        tilt.add(ring);
      }

      // Earth's moon.
      if (p.moon) {
        var moonOrbit = new THREE.Group();
        moonOrbit.position.x = 1.7;
        tilt.add(moonOrbit);
        var moon = new THREE.Mesh(
          new THREE.SphereGeometry(0.22, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.95 })
        );
        moon.position.x = 1.7;
        moonOrbit.add(moon);
        p._moonOrbit = moonOrbit;
        p._moonSpeed = 0.10;
      }

      // Visible orbit path.
      var linePts = [];
      var segments = 160;
      for (var i = 0; i <= segments; i++) {
        var a = (i / segments) * Math.PI * 2;
        linePts.push(new THREE.Vector3(Math.cos(a) * p.orbit, 0, Math.sin(a) * p.orbit));
      }
      var line = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(linePts),
        new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.38 })
      );
      scene.add(line);
      orbitLines.push(line);

      // Name label, kept upright above the planet.
      var label = makeTextSprite(p.name);
      label.position.y = p.radius * 1.6 + 1.0;
      spin.add(label);
      labelSprites.push(label);

      planets.push({
        data: p,
        orbit: orbit,
        spin: spin,
        mesh: planetMesh,
        angle: Math.random() * Math.PI * 2,
      });
    });

    // ---------- UI wiring ----------
    var labelsOn = true;
    var orbitsOn = true;
    var paused = false;

    document.getElementById("toggleLabels").addEventListener("click", function () {
      labelsOn = !labelsOn;
      labelSprites.forEach(function (s) { s.visible = labelsOn; });
      this.textContent = "Labels: " + (labelsOn ? "on" : "off");
    });

    document.getElementById("toggleOrbits").addEventListener("click", function () {
      orbitsOn = !orbitsOn;
      orbitLines.forEach(function (l) { l.visible = orbitsOn; });
      this.textContent = "Orbits: " + (orbitsOn ? "on" : "off");
    });

    document.getElementById("togglePause").addEventListener("click", function () {
      paused = !paused;
      this.textContent = paused ? "Resume" : "Pause";
    });

    // ---------- Resize ----------
    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Animation loop ----------
    var clock = new THREE.Clock();
    var elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);

      var delta = Math.min(clock.getDelta(), 0.05);
      elapsed += delta;

      if (!paused) {
        planets.forEach(function (pl) {
          pl.angle += pl.data.speed * delta;
          pl.orbit.rotation.y = pl.angle;
          pl.spin.rotation.y += pl.data.spin * delta;
          if (pl.data._moonOrbit) {
            pl.data._moonOrbit.rotation.y += pl.data._moonSpeed * delta;
          }
        });
        // Gentle sun pulse.
        glow.material.opacity = 0.92 + Math.sin(elapsed * 1.6) * 0.05;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
</body>
</html>
