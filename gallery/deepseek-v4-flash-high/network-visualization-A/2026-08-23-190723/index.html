<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Mesh — Enterprise Network Topology</title>
<style>
  :root {
    --bg: #070b14;
    --panel: rgba(13, 20, 36, 0.72);
    --panel-border: rgba(120, 150, 220, 0.18);
    --text: #dbe6f7;
    --muted: #7f92b3;
    --accent: #38bdf8;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  #net { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #net:active { cursor: grabbing; }
  #net .grid-pattern { pointer-events: none; }

  /* ---------- header ---------- */
  #hud-top {
    position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 12px; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  #title-bar { padding: 10px 14px; display: flex; align-items: center; gap: 14px; pointer-events: auto; }
  #title-bar h1 { margin: 0; font-size: 15px; letter-spacing: .4px; font-weight: 700; }
  #title-bar .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .pill { border-radius: 999px; padding: 3px 9px; font-size: 10.5px; font-weight: 600; letter-spacing: .5px; border: 1px solid; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.25} }
  .pill.live { color: #6ee7a0; border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.08); }
  #clock { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: auto; white-space: nowrap; }

  #stat-strip { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { padding: 8px 12px; border-radius: 10px; pointer-events: auto; min-width: 88px; }
  .stat .k { font-size: 10px; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
  .stat .v { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 3px; }
  .stat .v small { font-size: 11px; color: var(--muted); font-weight: 500; }

  /* ---------- controls ---------- */
  #controls {
    position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 9; pointer-events: auto; width: 190px;
  }
  #controls .btns { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
  .btn {
    background: rgba(56,130,246,.12); color: var(--text); border: 1px solid rgba(90,150,255,.3); border-radius: 8px;
    padding: 6px 10px; font-size: 11.5px; cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: rgba(56,130,246,.28); }
  .btn.active { background: rgba(56,130,246,.35); border-color: var(--accent); }
  .field { padding: 0 10px 10px; font-size: 11px; color: var(--muted); }
  .field label { display: block; margin-bottom: 4px; letter-spacing: .5px; text-transform: uppercase; font-size: 10px; }
  .field select, .field input[type=text] {
    width: 100%; background: rgba(10,16,30,.85); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 7px; padding: 6px 8px; font-size: 11.5px; font-family: inherit; outline: none;
  }
  .field select:focus, .field input:focus { border-color: var(--accent); }

  /* ---------- legend ---------- */
  #legend { position: absolute; left: 14px; bottom: 14px; width: 236px; max-height: 52vh; overflow: auto; z-index: 9; padding: 12px; pointer-events: auto; scrollbar-width: thin; }
  #legend h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11.5px; }
  .legend-row .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-row .cnt { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  .legend-row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-sep { height: 1px; background: var(--panel-border); margin: 8px 0; }
  .link-legend { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 11px; color: var(--text); }
  .link-legend .ln { height: 0; flex: 0 0 26px; border-top: 2px solid; }
  .link-legend .cnt2 { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 10.5px; }

  /* ---------- details ---------- */
  #details { position: absolute; right: 14px; bottom: 14px; width: 300px; z-index: 9; padding: 14px; pointer-events: auto; max-height: 46vh; overflow: auto; display: none; }
  #details .d-canopy { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #details .d-badge { width: 16px; height: 16px; border-radius: 5px; flex: none; box-shadow: 0 0 12px rgba(255,255,255,.15); }
  #details h2 { margin: 0; font-size: 14px; line-height: 1.2; word-break: break-word; }
  #details .d-type { font-size: 10.5px; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; margin-top: 2px; }
  #details .d-desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 6px 0 10px; }
  #details .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; font-size: 11.5px; font-family: var(--mono); }
  #details .kv .k { color: var(--muted); }
  #details .kv .v { color: var(--text); }
  #details .neighbors { margin-top: 10px; }
  #details .neighbors .t { font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  #details .chip {
    display: inline-flex; align-items: center; gap: 5px; background: rgba(56,130,246,.12); border: 1px solid rgba(90,150,255,.25);
    border-radius: 999px; padding: 2px 9px; font-size: 10.5px; margin: 0 4px 4px 0; cursor: pointer;
  }
  #details .chip:hover { background: rgba(56,130,246,.3); }
  #details .chip .n-dot { width: 7px; height: 7px; border-radius: 50%; }
  #details .close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 6px; }
  #details .close:hover { color: #fff; }

  #summary-panel { position: absolute; right: 14px; bottom: 14px; width: 300px; z-index: 9; padding: 14px; pointer-events: auto; display: none; }
  #summary-panel h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  #summary-panel p { margin: 4px 0; font-size: 11.5px; color: var(--text); }

  /* ---------- footer ticker ---------- */
  #ticker { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 34px; z-index: 8; pointer-events: none; padding: 9px 14px; font-family: var(--mono); font-size: 11px; color: #a9c0e8; display: flex; align-items: center; gap: 10px; border-radius: 10px; }
  #ticker .tick-label { color: var(--muted); text-transform: uppercase; font-size: 9.5px; letter-spacing: 1px; flex: none; }
  #ticker span#tick-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend { bottom: 60px; }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 300px;
    background: rgba(10,16,30,.96); border: 1px solid rgba(120,150,220,.35); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #tooltip .tt-title { display: flex; align-items: center; gap: 7px; font-weight: 700; margin-bottom: 4px; }
  #tooltip .tt-title .dot { width: 9px; height: 9px; border-radius: 50%; }
  #tooltip .tt-meta { color: var(--muted); font-size: 11px; line-height: 1.5; font-family: var(--mono); }

  /* ---------- node states ---------- */
  .node { cursor: pointer; }
  .node.dimmed { opacity: .07; }
  .link.dimmed { opacity: .04; }
  .node.selected { stroke: #fff; }
  .link.hovered { stroke-opacity: 1 !important; }
  .node.hovered { filter: drop-shadow(0 0 8px rgba(255,255,255,.55)); }
  .packet { pointer-events: none; }

  #load-error {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50;
    background: var(--bg); color: var(--text); text-align: center; padding: 30px; font-size: 13px; line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(90,130,200,.3); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  #legend, #details, #summary-panel { scrollbar-width: thin; }
  @media (max-width: 900px) {
    #controls { width: 160px; }
    #legend { display: none; }
    #details, #summary-panel { max-width: calc(100vw - 28px); }
  }
</style>
</head>
<body>
<div id="load-error">The D3 library failed to load from the CDN.<br>Check your network connection and reload the page.</div>

<svg id="net" viewBox="-1200 -800 2400 1600" preserveAspectRatio="xMidYMid meet"></svg>

<div id="hud-top">
  <div id="title-bar" class="panel">
    <div>
      <h1>Global Mesh · Enterprise Network Topology</h1>
      <div class="sub">Live force-directed model — drag nodes · scroll to zoom · click for details</div>
    </div>
    <span class="pill live"><span class="dot"></span>LIVE SIMULATION</span>
    <span id="clock">—</span>
  </div>
</div>

<div id="controls" class="panel">
  <div class="btns">
    <button class="btn" id="btn-sim">⏸ Pause</button>
    <button class="btn" id="btn-reheat">⟳ Rearrange</button>
    <button class="btn" id="btn-fit">⤢ Fit view</button>
    <button class="btn active" id="btn-labels">⌘ Labels</button>
    <button class="btn active" id="btn-traffic">◉ Traffic</button>
  </div>
  <div class="field">
    <label for="type-filter">Highlight type</label>
    <select id="type-filter"><option value="">All node types</option></select>
  </div>
  <div class="field">
    <label for="search">Search node</label>
    <input type="text" id="search" placeholder="e.g. Core-2, DC-B, Madrid…">
  </div>
</div>

<div id="stat-strip" style="position:absolute; top:78px; left:14px; z-index:9;"></div>

<div id="legend" class="panel">
  <h3>Node types</h3>
  <div id="legend-nodes"></div>
  <div class="legend-sep"></div>
  <h3>Link types</h3>
  <div id="legend-links"></div>
</div>

<div id="details" class="panel"></div>
<div id="summary-panel" class="panel"></div>

<div id="ticker" class="panel"><span class="tick-label">EVENT LOG</span><span id="tick-msg"></span></div>
<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(function () {
  if (typeof d3 === "undefined") { document.getElementById("load-error").style.display = "flex"; return; }

  /* ================================================================
     Deterministic RNG so the network is identical on every load.
     ================================================================ */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const R = mulberry32(20260823);

  /* ================================================================
     Definitions
     ================================================================ */
  const TYPES = {
    internet:    { label: "Internet / ISP backbone", color: "#fbbf24", r: 19, desc: "Global transit and peering fabric interconnecting the enterprise WAN with external networks and cloud providers." },
    core_router: { label: "Core router",             color: "#f472b6", r: 12, desc: "High-capacity backbone router carrying inter-city and inter-data-center traffic on the optical core." },
    dc_router:   { label: "DC gateway router",       color: "#e879f9", r: 10, desc: "Edge router of a data center; terminates WAN circuits, hosts the perimeter firewall and balances traffic into the fabric." },
    spine:       { label: "Spine switch",            color: "#a78bfa", r: 8.5, desc: "Clos-fabric spine layer — non-blocking top tier connecting every leaf while east-west traffic crosses the fabric." },
    leaf:        { label: "Leaf switch",             color: "#818cf8", r: 6.5, desc: "Leaf tier of the Clos fabric; ToR-style switch owning server racks and layer-3 VXLAN/VLAN services." },
    server:      { label: "Server",                  color: "#38bdf8", r: 3.4, desc: "Compute host serving applications, databases and workloads. Runs in pods behind fabric leaf switches." },
    storage:     { label: "Storage array",           color: "#22d3ee", r: 7, desc: "Shared block/object storage tier with replicated volumes and snapshots." },
    firewall:    { label: "Firewall",                color: "#fb7185", r: 8.5, desc: "Perimeter security gateway enforcing zone policy between trust domains." },
    loadbal:     { label: "Load balancer",           color: "#fbbf24", r: 7.5, desc: "L4/L7 load balancer distributing client and service traffic across the server pool." },
    edge_router: { label: "Regional edge router",    color: "#2dd4bf", r: 9.5, desc: "Regional aggregation router connecting office LANs to the backbone, often over MPLS or SD-WAN." },
    dist_switch: { label: "Distribution switch",     color: "#34d399", r: 7, desc: "Campus/building distribution layer aggregating access switches to the WAN edge." },
    access_sw:   { label: "Access switch",           color: "#4ade80", r: 5.5, desc: "Building access switch providing PoE copper and port security to endpoint devices." },
    workstation: { label: "Workstation",             color: "#a3e635", r: 3, desc: "End-user desktop, laptop or thin client on the corporate LAN." },
    printer:     { label: "Printer / MFP",           color: "#facc15", r: 3.1, desc: "Networked multifunction printer exposed as a print server on the LAN." },
    voip:        { label: "VoIP handset",            color: "#60a5fa", r: 3.1, desc: "SIP handset registered to the central call controller." },
    wifi_ap:     { label: "Wireless access point",   color: "#c084fc", r: 6, desc: "802.11ax access point bridging client devices onto the corporate network." },
    cloud:       { label: "Cloud service",           color: "#f0abfc", r: 10.5, desc: "Managed public-cloud service (IaaS, object storage, CDN edges) reached over encrypted internet links." },
    special:     { label: "Critical service",        color: "#94a3b8", r: 8.5, desc: "Foundation services — DNS, NTP, monitoring, mail gateway — that every other system depends on." }
  };

  const LINKS = {
    fiber: { color: "#7dd3fc", width: 2.4, dash: null,     dist: 110, cap: 100, label: "Backbone fiber" },
    metro: { color: "#5eead4", width: 1.7, dash: null,     dist: 85,  cap: 40,  label: "Metro fiber" },
    dc:    { color: "#a5b4fc", width: 1.2, dash: null,     dist: 26,  cap: 50,  label: "Data-center fabric" },
    lan:   { color: "#86efac", width: 1.0, dash: null,     dist: 22,  cap: 10,  label: "Ethernet LAN" },
    wifi:  { color: "#c4b5fd", width: 0.9, dash: "3 4",    dist: 34,  cap: 4,   label: "Wi-Fi link" },
    cloud: { color: "#f0abfc", width: 1.5, dash: null,     dist: 140, cap: 40,  label: "Cloud / internet" },
    vpn:   { color: "#fcd34d", width: 1.5, dash: "6 4",    dist: 130, cap: 25,  label: "Site-to-site VPN" }
  };

  /* ================================================================
     Network generator
     ================================================================ */
  const nodes = [];
  const links = [];
  let seq = 0;

  function addNode(name, type, cluster, extra) {
    const n = { id: seq++, name, type, cluster, extra: extra || {} };
    n.r = TYPES[type].r;
    nodes.push(n);
    return n;
  }
  function addLink(a, b, type) {
    links.push({ source: a, target: b, type });
  }
  function ip(a, b, c, d) { return a + "." + b + "." + c + "." + d; }

  /* Cluster anchors — the force layout pulls members toward these */
  const CLUSTERS = {
    internet: { x: 0, y: -640 },
    core:     { x: 0, y: -120 },
    special:  { x: 0, y: -470 },
    cloud:    { x: 0, y: 590 },
    "dc-a":   { x: -600, y: -150 },
    "dc-b":   { x: 0,    y: -170 },
    "dc-c":   { x: 600,  y: -150 },
    reg1: { x: -1050, y: 330 }, reg2: { x: -520, y: 520 }, reg3: { x: 0, y: 590 }, reg4: { x: 520, y: 520 }, reg5: { x: 1050, y: 330 }
  };
  const CLUSTER_LIST = ["reg1", "reg2", "reg3", "reg4", "reg5"];

  /* ---- Internet & cloud ---- */
  const internet = addNode("Internet Cloud", "internet", "internet");
  const cloudCompute = addNode("Cloud · Compute (IaaS)", "cloud", "cloud");
  const cloudStorage = addNode("Cloud · Object Storage", "cloud", "cloud");
  const cloudCdn = addNode("Cloud · CDN Edge", "cloud", "cloud");
  addLink(internet, cloudCompute, "cloud");
  addLink(internet, cloudStorage, "cloud");
  addLink(internet, cloudCdn, "cloud");

  /* ---- Core backbone ---- */
  const cores = [
    addNode("Core-1 · AMS", "core_router", "core"),
    addNode("Core-2 · NYC", "core_router", "core"),
    addNode("Core-3 · SIN", "core_router", "core"),
    addNode("Core-4 · DAL", "core_router", "core"),
    addNode("Core-5 · FRA", "core_router", "core")
  ];
  const coreLoops = [[0,1],[1,2],[2,3],[3,4],[4,0],[1,3]];
  coreLoops.forEach(([a, b]) => addLink(cores[a], cores[b], "fiber"));
  cores.forEach(c => { const e = [2, 1, 2, 1, 2][c.id % cores.length]; for (let i = 0; i < e; i++) addLink(internet, c, i % 2 ? "cloud" : "fiber"); });

  /* ---- Critical services ---- */
  const svc = [
    addNode("DNS Root Cluster", "special", "special"),
    addNode("NTP Stratum-1", "special", "special"),
    addNode("SOC Monitoring", "special", "special"),
    addNode("Global Mail Gateway", "special", "special")
  ];
  svc.forEach(s => cores.forEach((c, i) => { if (i % 2 === 0 || s.id % 2 === 0) addLink(s, c, i % 3 ? "metro" : "vpn"); }));

  function makeDC(tag, name, cluster, seedOffset) {
    const gw = addNode(name + " · Gateway Router", "dc_router", cluster, { dc: seedOffset });
    const fw = addNode(name + " · Firewall", "firewall", cluster, { dc: seedOffset });
    addLink(gw, fw, "metro");
    const spines = [0, 1].map(i => addNode(name + " · Spine-" + (i + 1), "spine", cluster, { dc: seedOffset }));
    addLink(fw, spines[0], "dc");
    addLink(fw, spines[1], "dc");
    const lbs = [0, 1].map(i => addNode(name + " · LB-" + (i + 1), "loadbal", cluster, { dc: seedOffset }));
    const leaves = [0, 1, 2, 3].map(i => addNode(name + " · Leaf-" + (i + 1), "leaf", cluster, { dc: seedOffset }));
    spines.forEach(sp => leaves.forEach(lf => addLink(sp, lf, "dc")));
    lbs.forEach(lb => leaves.slice(lb.id % 2, leaves.length).forEach(lf => addLink(lb, lf, "dc")));
    const servers = [];
    let rack = 0, slot = 1;
    for (let i = 0; i < 24; i++) {
      const s = addNode(name + " · srv-" + rack + "-" + slot, "server", cluster, { dc: seedOffset, ip: ip(10, seedOffset, rack, slot) });
      servers.push(s);
      slot++; if (slot > 6) { slot = 1; rack++; }
    }
    servers.forEach((s, i) => addLink(s, leaves[Math.floor(i / 6)], "dc"));
    const storage = addNode(name + " · Storage-01", "storage", cluster, { dc: seedOffset });
    addLink(storage, leaves[0], "dc");
    addLink(storage, leaves[1], "dc");
    addLink(fw, storage, "dc");
    /* gateway peers to two cores */
    cores.forEach((c, i) => { if (i % 2 === 0) addLink(c, gw, "fiber"); });
    addLink(internet, gw, "cloud");
    /* mail gateway terminates in first DC */
    if (cluster === "dc-a") addLink(svc[3], gw, "vpn");
    return { gw, fw, spines, leaves, lbs, servers, storage };
  }

  const DCA = makeDC("DC-A", "DC-A · Frankfurt", "dc-a", 1);
  const DCB = makeDC("DC-B", "DC-B · Virginia", "dc-b", 2);
  const DCC = makeDC("DC-C", "DC-C · Tokyo", "dc-c", 3);

  /* ---- Regional edges & offices ---- */
  const REGIONS = [
    { cl: "reg1", name: "N. America East",  router: "EDGE-RTL · Raleigh",   offices: ["Boston", "Raleigh"] },
    { cl: "reg2", name: "Europe West",      router: "EDGE-PAR · Paris",     offices: ["Paris", "Madrid"] },
    { cl: "reg3", name: "Europe Central",   router: "EDGE-BER · Berlin",    offices: ["Berlin", "Prague"] },
    { cl: "reg4", name: "Asia Pacific",     router: "EDGE-SYD · Sydney",    offices: ["Sydney", "Singapore HQ"] },
    { cl: "reg5", name: "S. America",       router: "EDGE-GRU · São Paulo", offices: ["São Paulo", "Buenos Aires"] }
  ];

  const officeList = [];
  REGIONS.forEach((reg, ri) => {
    const edge = addNode(reg.router, "edge_router", reg.cl, { region: reg.name });
    cores.forEach((c, i) => { if (i === ri || i === (ri + 3) % 5) addLink(c, edge, "fiber"); });
    reg.offices.forEach((officeName, oi) => {
      const officeCluster = reg.cl;
      const dist = addNode(officeName + " · Dist-SW", "dist_switch", officeCluster, { office: officeName });
      addLink(edge, dist, oi % 2 ? "metro" : "vpn");
      const acc = [0, 1].map(i => addNode(officeName + " · Access-" + (i + 1), "access_sw", officeCluster, { office: officeName }));
      acc.forEach(a => addLink(dist, a, "lan"));
      const ap = addNode(officeName + " · AP-1", "wifi_ap", officeCluster, { office: officeName });
      addLink(ap, dist, "wifi");
      const voip = addNode(officeName + " · VoIP-01", "voip", officeCluster, { office: officeName });
      addLink(voip, dist, "lan");
      const printer = addNode(officeName + " · MFP-01", "printer", officeCluster, { office: officeName });
      const ws = [];
      for (let i = 0; i < 6; i++) {
        const w = addNode(officeName + " · WS-" + (i + 1), "workstation", officeCluster, { office: officeName, ip: ip(192 + ri, oi * 10 + 10, 0, i + 10) });
        ws.push(w);
      }
      ws.forEach((w, i) => {
        const targetAcc = i < 3 ? acc[0] : acc[1];
        addLink(w, targetAcc, i % 4 === 3 ? "wifi" : "lan");
      });
      addLink(printer, acc[0], "lan");
      addLink(voip, acc[1], "lan");
      /* a few cross-site links make the mesh denser */
      if (oi === 1 && ri % 2 === 0) addLink(dist, DCA.gw, "vpn");
      officeList.push({ office: officeName, dist, acc, ws, ap });
    });
  });

  /* ---- extra inter-office mesh: VPN mesh among HQ regions ---- */
  const hq = officeList.filter(o => /HQ/.test(o.office) || /Boston|Berlin|Paris|Sydney|São Paulo/.test(o.office));
  for (let i = 0; i < hq.length; i++) {
    for (let j = i + 1; j < hq.length; j++) {
      if (Math.abs(i - j) === 1 || R() < 0.4) addLink(hq[i].dist, hq[j].dist, "vpn");
    }
  }

  /* ---- classify ---- */
  nodes.forEach(n => { n.degree = 0; });
  links.forEach(l => { const a = typeof l.source === "object" ? l.source : nodes[l.source]; const b = typeof l.target === "object" ? l.target : nodes[l.target]; a.degree++; b.degree++; });

  /* ================================================================
     Static per-link metrics (deterministic)
     ================================================================ */
  links.forEach((l, i) => {
    const cfg = LINKS[l.type];
    const frac = 0.24 + 0.66 * (0.5 + 0.5 * Math.sin(i * 1.7 + l.type.length));
    l.cap = cfg.cap;
    l.busy = +(cfg.cap * frac * 0.9 + 0.3).toFixed(1);           // simulated Gbps
    l.util = +(Math.min(0.97, frac)).toFixed(2);                 // 0..1 utilization
    l.spawnTime = performance.now() + R() * 4000;
    l.interval = 260 + (1 - frac) * 1400;
  });

  /* ================================================================
     SVG mounting
     ================================================================ */
  const svg = d3.select("#net");
  const root = svg.append("g");
  root.append("rect")
    .attr("class", "grid-pattern")
    .attr("x", -2400).attr("y", -1600).attr("width", 4800).attr("height", 3200)
    .attr("fill", "url(#grid)");

  const defs = svg.append("defs");
  defs.append("pattern").attr("id", "grid").attr("width", 64).attr("height", 64).attr("patternUnits", "userSpaceOnUse")
    .append("path")
    .attr("d", "M 64 0 L 0 0 0 64")
    .attr("fill", "none").attr("stroke", "rgba(90,140,220,.08)").attr("stroke-width", 1);
  const glow = defs.append("radialGradient").attr("id", "glowGrad").attr("r", "60%");
  glow.append("stop").attr("offset", "0%").attr("stop-color", "#fff").attr("stop-opacity", ".95");
  glow.append("stop").attr("offset", "100%").attr("stop-color", "#fff").attr("stop-opacity", "0");

  /* ---- link groups ---- */
  const linkLayer = root.append("g");
  const hitLayer  = root.append("g");
  const packetLayer = root.append("g");
  const nodeLayer = root.append("g");
  const labelLayer = root.append("g");

  const linkSel = linkLayer.selectAll("line").data(links).join("line")
    .attr("class", "link")
    .attr("stroke", l => LINKS[l.type].color)
    .attr("stroke-width", l => LINKS[l.type].width)
    .attr("stroke-dasharray", l => LINKS[l.type].dash || null)
    .attr("stroke-opacity", l => 0.38 + 0.34 * l.util)
    .attr("x1", l => l.source.x).attr("y1", l => l.source.y)
    .attr("x2", l => l.target.x).attr("y2", l => l.target.y);

  const hitSel = hitLayer.selectAll("line").data(links).join("line")
    .attr("stroke", "transparent").attr("stroke-width", 10)
    .attr("x1", l => l.source.x).attr("y1", l => l.source.y)
    .attr("x2", l => l.target.x).attr("y2", l => l.target.y)
    .on("mouseenter", function (event, l) { showLinkTip(event, l); highlightLink(l, true); })
    .on("mousemove", function (event) { moveTip(event); })
    .on("mouseleave", function () { hideTip(); highlightLink(null, false); });

  function highlightLink(l, on) {
    linkSel.classed("hovered", d => on && d === l);
    nodeSel.classed("hovered", d => on && (d === l.source || d === l.target));
  }

  const nodeSel = nodeLayer.selectAll("g").data(nodes).join("g")
    .attr("class", "node")
    .attr("transform", d => "translate(" + d.x + "," + d.y + ")")
    .call(d3.drag()
      .on("start", dragStarted)
      .on("drag", dragged)
      .on("end", dragEnded));

  nodeSel.append("circle")
    .attr("r", d => Math.max(2, d.r))
    .attr("fill", d => TYPES[d.type].color)
    .attr("stroke", "rgba(10,14,26,.9)")
    .attr("stroke-width", 1.2);

  nodeSel.append("circle")
    .attr("r", d => d.r + 4)
    .attr("fill", "url(#glowGrad)")
    .attr("opacity", d => d.type === "core_router" || d.type === "internet" ? 0.35 : 0.14)
    .attr("pointer-events", "none");

  nodeSel
    .on("mouseenter", function (event, d) { showNodeTip(event, d); highlightNode(d, true); liftNode(d, true); })
    .on("mousemove", function (event) { moveTip(event); })
    .on("mouseleave", function () { hideTip(); highlightNode(null, false); liftNode(null, false); })
    .on("click", function (event, d) { event.stopPropagation(); selectNode(d); });

  function highlightNode(d, on) { nodeSel.classed("hovered", nd => on && nd === d); }
  function liftNode(d, on) {
    nodeSel.filter(nd => d && nd === d).raise();
  }

  const labelSel = labelLayer.selectAll("text").data(nodes).join("text")
    .attr("x", d => d.r + 5)
    .attr("y", 3.4)
    .attr("font-size", d => Math.max(7.5, Math.min(12, d.r * 0.9)))
    .attr("fill", "rgba(210,224,244,.85)")
    .attr("font-family", "ui-monospace, Consolas, monospace")
    .attr("text-anchor", "start")
    .attr("paint-order", "stroke")
    .attr("stroke", "rgba(7,11,20,.85)")
    .attr("stroke-width", 2.4)
    .attr("stroke-linejoin", "round")
    .text(d => defaultLabelVisible(d) ? d.name : "");
  function defaultLabelVisible(d) {
    return d.r >= 8 || d.type === "access_sw" || d.type === "leaf" || d.type === "dist_switch";
  }
  let labelsOn = true;
  function syncLabels() {
    labelSel.text(d => {
      if (!labelsOn) return "";
      if (filterType && d.type !== filterType) return "";
      if (searchQ && d.name.toLowerCase().indexOf(searchQ) < 0) return "";
      return d.name;
    });
  }

  /* ================================================================
     Filtering / search / selection
     ================================================================ */
  let filterType = "";
  let searchQ = "";
  let selectedNode = null;

  function applyFilters() {
    const active = filterType || searchQ;
    nodeSel.classed("dimmed", d => {
      if (!active) return false;
      if (searchQ && d.name.toLowerCase().indexOf(searchQ) >= 0 && (!filterType || d.type === filterType)) return false;
      if (filterType && d.type === filterType && (!searchQ || d.name.toLowerCase().indexOf(searchQ) >= 0)) return false;
      return true;
    });
    linkSel.classed("dimmed", l => {
      if (!active) return false;
      const s = typeof l.source === "object" ? l.source : nodes[l.source];
      const t = typeof l.target === "object" ? l.target : nodes[l.target];
      const sHit = !(filterType && s.type !== filterType) && (!searchQ || s.name.toLowerCase().indexOf(searchQ) >= 0);
      const tHit = !(filterType && t.type !== filterType) && (!searchQ || t.name.toLowerCase().indexOf(searchQ) >= 0);
      return !(sHit && tHit);
    });
    syncLabels();
  }

  d3.select("#type-filter").on("change", function () {
    filterType = this.value; applyFilters();
  });
  d3.select("#search").on("input", function () {
    searchQ = this.value.trim().toLowerCase(); applyFilters();
  });

  function selectNode(d) {
    selectedNode = d;
    nodeSel.classed("selected", nd => nd === d);
    renderDetails(d);
  }
  function clearSelection() {
    selectedNode = null;
    nodeSel.classed("selected", false);
    d3.select("#details").style("display", "none");
    d3.select("#summary-panel").style("display", "block");
  }
  svg.on("click", function (event) {
    if (event.target === this) clearSelection();
  });

  /* ================================================================
     Tooltip + details rendering
     ================================================================ */
  const tip = d3.select("#tooltip");
  function posTip(event) {
    tip.style("left", Math.min(event.clientX + 14, innerWidth - 320) + "px")
       .style("top", Math.min(event.clientY + 12, innerHeight - 120) + "px");
  }
  function showNodeTip(event, d) {
    tip.style("display", "block");
    posTip(event);
    tip.html(
      "<div class='tt-title'><span class='dot' style='background:" + TYPES[d.type].color + "'></span>" + esc(d.name) + "</div>" +
      "<div class='tt-meta'>" + TYPES[d.type].label + "<br>degree " + d.degree + " · " + d.extra.ip + "</div>"
    );
  }
  function showLinkTip(event, l) {
    tip.style("display", "block");
    posTip(event);
    const a = l.source, b = l.target;
    tip.html(
      "<div class='tt-title'><span class='dot' style='background:" + LINKS[l.type].color + "'></span>" + LINKS[l.type].label + "</div>" +
      "<div class='tt-meta'>" + esc(a.name) + " ↔ " + esc(b.name) + "<br>" + l.busy + " Gbps / " + l.cap + " Gbps · util " + Math.round(l.util * 100) + "%</div>"
    );
  }
  function moveTip(event) { posTip(event); }
  function hideTip() { tip.style("display", "none"); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function renderDetails(d) {
    d3.select("#summary-panel").style("display", "none");
    const det = d3.select("#details").style("display", "block");
    const neighborLinks = links.filter(l => (l.source === d) || (l.target === d));
    const neigh = neighborLinks.map(l => ({ n: l.source === d ? l.target : l.source, l }));
    det.html("");
    const canvas = det.append("div").attr("class", "d-canopy");
    canvas.append("div").attr("class", "d-badge").style("background", TYPES[d.type].color);
    const hdr = canvas.append("div");
    hdr.append("h2").text(d.name);
    hdr.append("div").attr("class", "d-type").text(TYPES[d.type].label);
    canvas.append("button").attr("class", "close").text("✕").on("click", clearSelection);
    det.append("div").attr("class", "d-desc").text(TYPES[d.type].desc);
    const kv = det.append("div").attr("class", "kv");
    kv.append("div").attr("class", "k").text("IPv4");
    kv.append("div").attr("class", "v").text(d.extra.ip || "—");
    kv.append("div").attr("class", "k").text("Degree");
    kv.append("div").attr("class", "v").text(d.degree);
    kv.append("div").attr("class", "k").text("Uplink traffic");
    const busy = neighborLinks.reduce((s, l) => s + l.busy, 0);
    kv.append("div").attr("class", "v").text(busy.toFixed(1) + " Gbps");
    kv.append("div").attr("class", "k").text("Role");
    kv.append("div").attr("class", "v").text(TYPES[d.type].label);
    const nt = det.append("div").attr("class", "neighbors");
    nt.append("div").attr("class", "t").text("Neighbors (" + neigh.length + ")");
    neigh.slice(0, 30).forEach(item => {
      nt.append("button").attr("class", "chip")
        .html("<span class='n-dot' style='background:" + TYPES[item.n.type].color + "'></span>" + esc(item.n.name))
        .on("click", () => selectNode(item.n));
    });
  }

  /* ================================================================
     Simulation
     ================================================================ */
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id)
      .distance(l => LINKS[l.type].dist)
      .strength(l => { const t = l.type; return (t === "lan" || t === "dc") ? 0.55 : (t === "fiber" ? 0.2 : 0.28); }))
    .force("charge", d3.forceManyBody().strength(d => (d.type === "server" || d.type === "workstation" || d.type === "access_sw") ? -20 : -85))
    .force("x", d3.forceX(d => CLUSTERS[d.cluster].x).strength(d => clustStr(d)))
    .force("y", d3.forceY(d => CLUSTERS[d.cluster].y).strength(d => clustStr(d)))
    .force("collide", d3.forceCollide().radius(d => d.r + 1.5).strength(0.75))
    .alphaDecay(0.022)
    .on("tick", ticked);

  function clustStr(d) {
    if (d.type === "server" || d.type === "leaf" || d.type === "spine" || d.type === "workstation" || d.type === "access_sw") return 0.22;
    if (d.type === "voip" || d.type === "printer" || d.type === "wifi_ap") return 0.3;
    return 0.1;
  }

  let simRunning = true;
  function ticked() {
    linkSel
      .attr("x1", l => l.source.x).attr("y1", l => l.source.y)
      .attr("x2", l => l.target.x).attr("y2", l => l.target.y);
    hitSel
      .attr("x1", l => l.source.x).attr("y1", l => l.source.y)
      .attr("x2", l => l.target.x).attr("y2", l => l.target.y);
    nodeSel.attr("transform", d => "translate(" + d.x + "," + d.y + ")");
    labelSel.attr("x", d => d.r + 5).attr("y", 3.4).attr("transform", d => "translate(" + d.x + "," + d.y + ")");
  }

  function dragStarted(event, d) {
    if (!event.active) sim.alphaTarget(0.25).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragEnded(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }

  /* ================================================================
     Traffic animation
     ================================================================ */
  const packets = new Map();   // link -> array of {t, dir, speed}
  let packetsTotal = 0;
  let trafficOn = true;
  const packetSel = packetLayer.selectAll("circle").data([]);

  function grab(l) {
    const key = l;
    let arr = packets.get(key);
    if (!arr) { arr = []; packets.set(key, arr); }
    return arr;
  }
  function spawnFor(link, now) {
    if (now < link.spawnTime) return;
    link.spawnTime = now + link.interval * (0.6 + R() * 0.8);
    if (!trafficOn) return;
    const arr = grab(link);
    const dir = R() < 0.5 ? 1 : -1;
    const speed = (0.55 + 2.1 * link.util) * (0.6 + R() * 0.5);
    arr.push({ t: 0, dir, speed, lw: LINKS[link.type].width });
    packetsTotal++;
  }
  function updatePackets(now, dt) {
    const g = packetLayer.selectAll("circle").data([]);
    /* remove dead packets */
    packets.forEach((arr, link) => {
      arr = arr.filter(p => p.t < 1);
      packets.set(link, arr);
    });
    const activePackets = [];
    packets.forEach((arr, link) => {
      for (const p of arr) {
        p.t += p.speed * dt * 0.00055;
        if (p.t >= 1) { packetsTotal--; continue; }
        const a = p.dir === 1 ? link.source : link.target;
        const b = p.dir === 1 ? link.target : link.source;
        activePackets.push([a.x + (b.x - a.x) * p.t, a.y + (b.y - a.y) * p.t, p.lw]);
      }
    });
    const bound = g.data(activePackets, (d, i) => i).join(
      enter => enter.append("circle").attr("class", "packet").attr("r", 2.1).attr("fill", "#e6f4ff")
        .attr("opacity", 0.95),
      update => update,
      exit => exit.remove()
    );
    bound.attr("cx", d => d[0]).attr("cy", d => d[1]);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last);
    last = now;
    if (trafficOn) {
      links.forEach(l => spawnFor(l, now));
      updatePackets(now, dt);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================================================================
     Zoom + fit
     ================================================================ */
  const zoom = d3.zoom().scaleExtent([0.12, 9]).on("zoom", e => root.attr("transform", e.transform));
  svg.call(zoom);
  function fitView() {
    const vb = svg.node().viewBox.baseVal;
    const w = vb.width, h = vb.height;
    const t = svg.node().getBoundingClientRect();
    const k = Math.min(t.width / w, t.height / h);
    svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate((t.width - w * k) / 2, (t.height - h * k) / 2).scale(k));
  }
  setTimeout(fitView, 50);

  /* ================================================================
     UI wiring
     ================================================================ */
  document.getElementById("btn-sim").addEventListener("click", function () {
    simRunning = !simRunning;
    this.textContent = simRunning ? "⏸ Pause" : "▶ Play";
    if (simRunning) sim.alphaTarget(0.15).restart();
    else sim.stop();
  });
  document.getElementById("btn-reheat").addEventListener("click", function () {
    sim.alpha(0.7).restart();
  });
  document.getElementById("btn-fit").addEventListener("click", fitView);
  document.getElementById("btn-labels").addEventListener("click", function () {
    labelsOn = !labelsOn; this.classList.toggle("active", labelsOn); syncLabels();
  });
  document.getElementById("btn-traffic").addEventListener("click", function () {
    trafficOn = !trafficOn; this.classList.toggle("active", trafficOn);
    if (!trafficOn) {
      packets.forEach((arr, link) => packetsTotal -= arr.length);
      packets.clear();
      packetLayer.selectAll("*").remove();
      packetsTotal = 0;
    }
  });

  /* ---- legend ---- */
  const legendNodeBox = d3.select("#legend-nodes");
  Object.keys(TYPES).forEach(t => {
    const count = nodes.filter(n => n.type === t).length;
    const row = legendNodeBox.append("div").attr("class", "legend-row");
    row.append("div").attr("class", "swatch").style("background", TYPES[t].color);
    row.append("div").attr("class", "lbl").text(TYPES[t].label);
    row.append("div").attr("class", "cnt").text(count);
  });
  const legendLinkBox = d3.select("#legend-links");
  Object.keys(LINKS).forEach(t => {
    const count = links.filter(l => l.type === t).length;
    const row = legendLinkBox.append("div").attr("class", "link-legend");
    const ln = row.append("div").attr("class", "ln");
    ln.style("border-top-color", LINKS[t].color);
    if (LINKS[t].dash) ln.style("border-top-style", "dashed");
    row.append("div").text(LINKS[t].label);
    row.append("div").attr("class", "cnt2").text(count);
  });

  /* ---- type filter options ---- */
  const filterSel = d3.select("#type-filter");
  Object.keys(TYPES).forEach(t => filterSel.append("option").attr("value", t).text(TYPES[t].label));

  /* ---- stats strip ---- */
  function buildStats() {
    const totalCap = links.reduce((s, l) => s + l.busy, 0);
    const strip = d3.select("#stat-strip").html("");
    const stats = [
      ["Nodes", nodes.length, ""],
      ["Links", links.length, ""],
      ["Active links", links.filter(l => l.util > 0.1).length, ""],
      ["Aggregate traffic", (totalCap * 3).toFixed(0), " Gbps"],
      ["Clusters", Object.keys(CLUSTERS).length, ""]
    ];
    stats.forEach(pair => {
      const el = strip.append("div").attr("class", "stat panel");
      el.append("div").attr("class", "k").text(pair[0]);
      el.append("div").attr("class", "v").html(pair[1] + (pair[2] ? "<small>" + pair[2] + "</small>" : ""));
    });
  }
  buildStats();

  /* ---- clock ---- */
  function clock() {
    const d = new Date();
    document.getElementById("clock").textContent =
      d.toISOString().replace("T", "  ").slice(0, 19) + " UTC";
  }
  setInterval(clock, 1000); clock();

  /* ---- event ticker ---- */
  const tickers = [
    "Backbone Core-1 → Core-5 fiber trunk at {b} Gbps ({u}%)",
    "DNS recursive queries served: {n} req/s across {r} zones",
    "Mail gateway quarantined {n} suspicious messages in the last minute",
    "VPN session re-key between {o} and {o2} completed (IPsec IKEv2)",
    "SOC monitoring: anomaly score {n} on {o} segment",
    "CDN edge purged {n} cached objects for {o}",
    "Load balancer {o} rebalanced {n} active connections",
    "Storage snapshot completed on {o}, retn {n} h"
  ];
  function tickWord() {
    const e = [1, 2][Math.floor(R() * 2)];
    const n1 = nodes[Math.floor(R() * nodes.length)];
    const n2 = nodes[Math.floor(R() * nodes.length)];
    const line = links[Math.floor(R() * links.length)];
    const name1 = n1 && n1.name.split(" · ").pop(), name2 = n2 && n2.name.split(" · ").pop();
    let m = tickers[Math.floor(R() * tickers.length)]
      .replace("{b}", "≤" + line.cap)
      .replace("{u}", Math.round(line.util * 100))
      .replace("{n}", (1 + Math.floor(R() * 9000)))
      .replace(/\{r\}/g, 3 + Math.floor(R() * 40))
      .replace(/\{o2\}/g, name2)
      .replace(/\{o\}/g, name1);
    document.getElementById("tick-msg").textContent = m;
  }
  tickWord(); setInterval(tickWord, 1400);

  /* ---- summary panel initial ---- */
  const summ = d3.select("#summary-panel").style("display", "block");
  summ.append("h3").text("Network summary");
  summ.append("p").text("This is a generative model of a multilayer enterprise network: an IP/MPLS backbone over optical fiber, three Clos-fabric data centers (Frankfurt, Virginia, Tokyo), five regional edges and eight office LANs (wired + Wi-Fi), plus cloud services and foundation services (DNS, NTP, SOC, mail).");
  summ.append("p").text("Drag nodes to explore, scroll to zoom, hover links to inspect utilization, click a node for its details, and use the filters to isolate a role.");
  summ.append("p").style("color", "var(--muted)").text("All traffic figures are simulated for visualization only.");

  /* kick-start some movement so the layout settles visibly */
  sim.alpha(0.9).restart();
})();
</script>
</body>
</html>
