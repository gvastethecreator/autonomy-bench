<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Biped — Walk Cycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  canvas { display: block; }
  #info {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    color: #cfe3ff; font: 13px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: rgba(10, 16, 28, 0.74); padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(120, 160, 255, 0.25); pointer-events: none;
    user-select: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    max-width: 300px;
  }
  #info b { color: #7fd0ff; }
  #info .dim { color: #7d8aa3; }
</style>
</head>
<body>
<div id="info">
  <b>Procedural biped</b> — walk cycle<br>
  <span class="dim">Every joint pose is computed each frame from sine functions (2-bone IK for the legs).<br>
  drag · orbit · scroll · zoom</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Scene setup
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 20, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4.6, 3.4, 7.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0x9ecfff, 0x2a2f3a, 1.15));

const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14;
sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -14;
sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0004;
scene.add(sun);

/* ------------------------------------------------------------------ *
 *  Ground + path props
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({ color: 0x1c2a44, roughness: 0.95, metalness: 0.04 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(90, 45, 0x3f5f8f, 0x26385a);
grid.position.y = 0.012;
scene.add(grid);

const RING_R = 6;
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(RING_R, 0.02, 6, 120),
  new THREE.MeshStandardMaterial({ color: 0x3f6f9f, roughness: 0.8 })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.02;
scene.add(ring);

const postMat = new THREE.MeshStandardMaterial({ color: 0x35507a, roughness: 0.7 });
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 1.5, 8), postMat);
  post.position.set(Math.cos(a) * RING_R, 0.75, Math.sin(a) * RING_R);
  post.castShadow = true;
  scene.add(post);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0x7fd0ff, emissive: 0x2a5a7a, emissiveIntensity: 0.5 }));
  cap.position.set(Math.cos(a) * RING_R, 1.53, Math.sin(a) * RING_R);
  scene.add(cap);
}

/* ------------------------------------------------------------------ *
 *  Creature geometry
 * ------------------------------------------------------------------ */
const THIGH = 0.55, SHIN = 0.55;
const THIGH_R = 0.085, SHIN_R = 0.07;
const UPPER = 0.42, FORE = 0.38;
const UPPER_R = 0.055, FORE_R = 0.045;
const HIP_Y = 1.02;
const HIP_X = 0.19;
const ANKLE_H = 0.05;

const bodyMat   = new THREE.MeshStandardMaterial({ color: 0x2fd0a8, roughness: 0.35, metalness: 0.12 });
const limbMat   = new THREE.MeshStandardMaterial({ color: 0x1fae8a, roughness: 0.42, metalness: 0.10 });
const darkMat   = new THREE.MeshStandardMaterial({ color: 0x14324a, roughness: 0.55, metalness: 0.15 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xffb44d, roughness: 0.45, metalness: 0.25 });
const eyeMat    = new THREE.MeshStandardMaterial({ color: 0x0e1c2c, emissive: 0x6dffe3, emissiveIntensity: 1.6 });

function limbSegment(length, radius, mat) {
  const geo = new THREE.CapsuleGeometry(radius, length, 4, 12);
  geo.translate(0, -(length / 2 + radius), 0); // joint at top, bone hangs downward
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

const creature = new THREE.Group();
const body = new THREE.Group();        // lateral weight shift
const upperBody = new THREE.Group();   // pitch (lean)
creature.add(body);
body.add(upperBody);

/* Pelvis */
const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.24, 0.30, 14), bodyMat);
pelvis.position.y = -0.03;
pelvis.castShadow = true;
body.add(pelvis);

/* Chest */
const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.30, 0.62, 14), bodyMat);
chest.position.y = 0.52;
chest.castShadow = true;
upperBody.add(chest);

const plate = new THREE.Mesh(new THREE.SphereGeometry(0.10, 16, 12), accentMat);
plate.scale.set(1, 1, 0.35);
plate.position.set(0, 0.40, 0.235);
upperBody.add(plate);

const collar = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.028, 8, 20), accentMat);
collar.rotation.x = Math.PI / 2;
collar.position.y = 0.85;
upperBody.add(collar);

/* Head */
const head = new THREE.Group();
const skull = new THREE.Mesh(new THREE.SphereGeometry(0.23, 24, 18), bodyMat);
skull.scale.set(1, 0.92, 1);
head.add(skull);
for (const s of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 10), eyeMat);
  eye.position.set(0.085 * s, 0.025, 0.205);
  head.add(eye);
}
const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.01, 0.22, 6), darkMat);
antenna.position.set(0, 0.36, 0);
antenna.rotation.z = 0.16;
head.add(antenna);
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.032, 10, 8), eyeMat);
tip.position.set(0.035, 0.47, -0.01);
head.add(tip);
head.position.y = 1.07;
upperBody.add(head);

/* Arms */
function buildArm(side) {
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.30, 0.70, 0);
  shoulder.add(limbSegment(UPPER, UPPER_R, limbMat));
  const elbow = new THREE.Group();
  elbow.position.y = -UPPER;
  elbow.add(limbSegment(FORE, FORE_R, limbMat));
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 10), darkMat);
  hand.position.y = -(FORE + FORE_R);
  hand.castShadow = true;
  elbow.add(hand);
  shoulder.add(elbow);
  return { shoulder, elbow };
}
const armL = buildArm(-1);
const armR = buildArm(1);
upperBody.add(armL.shoulder, armR.shoulder);

/* Legs */
function buildLeg(side) {
  const hip = new THREE.Group();
  hip.position.set(side * HIP_X, 0, 0);
  hip.add(limbSegment(THIGH, THIGH_R, limbMat));
  const knee = new THREE.Group();
  knee.position.y = -THIGH;
  knee.add(limbSegment(SHIN, SHIN_R, limbMat));
  const ankle = new THREE.Group();
  ankle.position.y = -(SHIN + SHIN_R);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.055, 0.26), darkMat);
  foot.position.set(0, -0.015, 0.065);
  foot.castShadow = true;
  ankle.add(foot);
  knee.add(ankle);
  hip.add(knee);
  body.add(hip);
  return { hip, knee, ankle };
}
const legL = buildLeg(-1);
const legR = buildLeg(1);

scene.add(creature);

/* ------------------------------------------------------------------ *
 *  Procedural walk
 * ------------------------------------------------------------------ */
const state = {
  t: 0,
  speed: 1.1,        // world units per second
  radius: RING_R,     // circular path radius
  stride: 0.30,       // foot reach (half stride) in body frame
  stepHeight: 0.17,   // foot lift during swing
  bob: 0.030,         // vertical body bob
  sway: 0.05,         // lateral weight shift
  armSwing: 0.55,     // shoulder pitch amplitude
  pitch: 0.045,       // upper-body lean amplitude
};

/* Analytic 2-bone IK in the sagittal plane.
 * hip/knee/ankle rotate only around X; foot target given as
 * (downward distance, forward offset) from the hip joint. */
function solveLeg(hip, knee, ankle, l1, l2, down, fwd) {
  let dist = Math.hypot(fwd, down);
  const minD = Math.abs(l1 - l2) + 0.02;
  const maxD = l1 + l2 - 0.02;
  dist = Math.max(minD, Math.min(maxD, dist));

  const theta = Math.atan2(fwd, down);
  const cosHip = THREE.MathUtils.clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const cosKnee = THREE.MathUtils.clamp((l1 * l1 + l2 * l2 - dist * dist) / (2 * l1 * l2), -1, 1);
  const hipAngle = THREE.MathUtils.clamp(theta + Math.acos(cosHip), -1.5, 1.5);
  const kneeInt = Math.acos(cosKnee);

  hip.rotation.x = -hipAngle;
  knee.rotation.x = Math.PI - kneeInt;
  ankle.rotation.x = -(hip.rotation.x + knee.rotation.x); // keep the foot flat on the ground
}

function poseLeg(leg, p, bobY) {
  const fwd = state.stride * Math.sin(p);
  const lift = state.stepHeight * Math.sin(p) * Math.sin(p); // C1 lift, zero at plant
  const down = HIP_Y + bobY - lift - ANKLE_H;
  solveLeg(leg.hip, leg.knee, leg.ankle, THIGH, SHIN, down, fwd);
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.t += dt;

  // --- circular path: local +Z stays tangent to the ring ---
  const th = state.t * state.speed / state.radius;
  creature.position.set(state.radius * Math.cos(th), 0, state.radius * Math.sin(th));
  creature.rotation.y = -th;

  // --- walk phases ---
  const omega = state.speed * Math.PI / (2 * state.stride); // no foot sliding: 2*stride per stance half-cycle
  const pL = state.t * omega;
  const pR = pL + Math.PI;
  const sL = Math.sin(pL);
  const sR = Math.sin(pR);

  // body bob (lowest at mid-stance) + lateral weight shift
  const bobY = -state.bob * sL * sL;
  creature.position.y = HIP_Y + bobY;
  body.position.x = state.sway * sL;

  // upper-body lean into the gait
  upperBody.rotation.x = state.pitch * Math.sin(pL);

  // legs: analytic IK to ground targets
  poseLeg(legL, pL, bobY);
  poseLeg(legR, pR, bobY);

  // arms swing opposite to the same-side leg
  armL.shoulder.rotation.x = state.armSwing * sL;
  armR.shoulder.rotation.x = state.armSwing * sR;
  armL.elbow.rotation.x = -0.55 - 0.30 * Math.max(0, -sL);
  armR.elbow.rotation.x = -0.55 - 0.30 * Math.max(0, -sR);

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
