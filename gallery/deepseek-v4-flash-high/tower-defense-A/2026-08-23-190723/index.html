<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d1117;
    color: #dbe4ee;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  #wrap { position: relative; width: 100%; max-width: 1260px; }
  #hud {
    display: flex; gap: 10px; flex-wrap: wrap;
    background: #151c26; border: 1px solid #28313f; border-bottom: none;
    padding: 10px 14px; border-radius: 10px 10px 0 0;
  }
  .stat {
    background: #1c2530; padding: 6px 12px; border-radius: 8px;
    font-weight: 600; font-size: 14px; white-space: nowrap;
  }
  .stat .v { color: #ffd166; }
  .stat .v.red { color: #ff7b7b; }
  #main { display: flex; gap: 12px; flex-wrap: wrap; }
  canvas {
    display: block; max-width: 100%; height: auto;
    border: 1px solid #28313f; background: #2f6f37;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    cursor: crosshair;
  }
  #panel { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 10px; }
  .sec {
    background: #151c26; border: 1px solid #28313f; border-radius: 10px;
    padding: 10px 12px;
  }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7d8b9f; margin-bottom: 8px; }
  #shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    background: #1c2530; border: 2px solid #2c3646; border-radius: 9px;
    padding: 8px; cursor: pointer; text-align: center; user-select: none;
    transition: transform .08s ease, border-color .08s ease, opacity .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #46586f; }
  .card.active { border-color: #ffd166; background: #242f3f; }
  .card.poor { opacity: .45; }
  .card .ico { font-size: 22px; line-height: 1.2; }
  .card .nm { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .card .cs { font-size: 12px; color: #ffd166; margin-top: 2px; }
  #info { min-height: 118px; }
  #infoTitle { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #eaf2fb; }
  #infoBody { font-size: 13px; color: #9fb2c8; line-height: 1.45; }
  #infoActions { margin-top: 10px; display: flex; gap: 8px; }
  .btn {
    background: #253044; color: #dbe4ee; border: 1px solid #3a4a63;
    border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .1s ease;
  }
  .btn:hover:not(:disabled) { background: #2f3d57; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.gold { background: #5c3d12; border-color: #9a6a1f; color: #ffd9a0; }
  .btn.gold:hover:not(:disabled) { background: #6f4a16; }
  .btn.danger { background: #4a1b1b; border-color: #8a3333; color: #ffb3b3; }
  .btn.danger:hover:not(:disabled) { background: #5c2323; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; }
  #controls .btn { flex: 1; min-width: 90px; }
  #hint { font-size: 12.5px; color: #7590ad; line-height: 1.5; }
  #hint b { color: #b7c9dd; }
  #overlay {
    position: absolute; inset: 0; z-index: 20; border-radius: 12px;
    background: rgba(8, 12, 18, .82); backdrop-filter: blur(4px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center;
  }
  #overlay.hidden { display: none; }
  #ovTitle { font-size: 40px; font-weight: 800; letter-spacing: .02em; }
  #ovSub { font-size: 17px; color: #9fb2c8; }
  #ovBtn { font-size: 16px; padding: 11px 26px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat">💰 <span class="v" id="gold">0</span></div>
    <div class="stat">❤️ <span class="v red" id="lives">0</span></div>
    <div class="stat">🌊 Wave <span class="v" id="wave">0/20</span></div>
    <div class="stat">👾 <span class="v" id="enemies">0</span></div>
    <div class="stat">⭐ <span class="v" id="score">0</span></div>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="panel">
      <div class="sec">
        <h3>Towers</h3>
        <div id="shop"></div>
      </div>
      <div class="sec" id="info">
        <div id="infoTitle">Welcome</div>
        <div id="infoBody"></div>
        <div id="infoActions">
          <button class="btn gold" id="upBtn" style="display:none">Upgrade</button>
          <button class="btn danger" id="sellBtn" style="display:none">Sell</button>
        </div>
      </div>
      <div class="sec">
        <h3>Controls</h3>
        <div id="controls">
          <button class="btn" id="waveBtn">Start Wave</button>
          <button class="btn" id="speedBtn">Speed x1</button>
          <button class="btn" id="soundBtn">Sound: On</button>
          <button class="btn" id="resetBtn">Restart</button>
        </div>
      </div>
      <div class="sec" id="hint">
        <b>How to play:</b> pick a tower (keys 1-4), click the map to build. Click a tower to upgrade/sell.
        Right-click or <b>Esc</b> to cancel. <b>Space</b> starts the next wave instantly.
      </div>
    </div>
  </div>
  <div id="overlay" class="hidden">
    <div id="ovTitle"></div>
    <div id="ovSub"></div>
    <button class="btn gold" id="ovBtn">Play again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- constants
  var TILE = 40, COLS = 24, ROWS = 16;
  var W = COLS * TILE, H = ROWS * TILE;
  var WAVES = 20, START_GOLD = 180, START_LIVES = 20, PREP_TIME = 12;

  var TOWER_TYPES = {
    gunner: { key: 'gunner', name: 'Gunner', icon: '⚔', color: '#ffd166', cost: 50,
      range: [118, 132, 147], rof: [3.4, 3.8, 4.3], damage: [13, 20, 31],
      projSpeed: 480, projColor: '#ffe9a3', projR: 4, splash: 0, slow: 0, slowDur: 0,
      desc: 'Fast single-target shots. Cheap and reliable.' },
    cannon: { key: 'cannon', name: 'Cannon', icon: '💣', color: '#93a7b8', cost: 100,
      range: [135, 150, 167], rof: [0.8, 0.9, 1.0], damage: [36, 58, 92],
      projSpeed: 330, projColor: '#c9d4dd', projR: 6, splash: [58, 68, 78], slow: 0, slowDur: 0,
      desc: 'Slow shells that splatter nearby enemies.' },
    frost: { key: 'frost', name: 'Frost', icon: '❄', color: '#6cd4ff', cost: 75,
      range: [110, 122, 136], rof: [1.7, 1.9, 2.2], damage: [8, 12, 18],
      projSpeed: 400, projColor: '#bfeaff', projR: 5, splash: 34, slow: 0.5, slowDur: [1.4, 1.6, 1.9],
      desc: 'Chills enemies and slows a splash area.' },
    sniper: { key: 'sniper', name: 'Sniper', icon: '◎', color: '#b18cff', cost: 150,
      range: [270, 296, 326], rof: [0.6, 0.7, 0.8], damage: [85, 135, 215],
      projSpeed: 1000, projColor: '#e4daff', projR: 5, splash: 0, slow: 0, slowDur: 0,
      desc: 'Extreme range, devastating single-target shots.' }
  };

  var ENEMY_TYPES = {
    basic: { name: 'Creep', hp: 42, speed: 66, radius: 9, bounty: 8, color: '#e05555' },
    fast:  { name: 'Runner', hp: 26, speed: 114, radius: 7, bounty: 10, color: '#f0a94a' },
    tank:  { name: 'Brute', hp: 155, speed: 44, radius: 13, bounty: 16, color: '#9a6be0' },
    boss:  { name: 'Boss', hp: 1500, speed: 30, radius: 19, bounty: 130, color: '#e0479e' }
  };

  // ---------------------------------------------------------------- path
  var waypoints = [[-1, 2], [5, 2], [5, 11], [12, 11], [12, 3], [19, 3], [19, 13], [24, 13]];
  var pathTiles = new Set();
  var pathPts = [];

  function buildPath() {
    var pts = [];
    for (var i = 0; i < waypoints.length - 1; i++) {
      var x0 = waypoints[i][0], y0 = waypoints[i][1];
      var x1 = waypoints[i + 1][0], y1 = waypoints[i + 1][1];
      var x = x0, y = y0;
      pts.push([(x + 0.5) * TILE, (y + 0.5) * TILE]);
      while (x !== x1 || y !== y1) {
        if (x < x1) x++; else if (x > x1) x--; else if (y < y1) y++; else y--;
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS) pathTiles.add(x + ',' + y);
        pts.push([(x + 0.5) * TILE, (y + 0.5) * TILE]);
      }
    }
    for (i = 0; i < pts.length; i++) {
      var p = pts[i], last = pathPts[pathPts.length - 1];
      if (!last || last[0] !== p[0] || last[1] !== p[1]) pathPts.push(p);
    }
  }
  buildPath();

  var START_XY = [(0 + 0.5) * TILE, (2 + 0.5) * TILE];
  var END_XY = [(COLS - 1 + 0.5) * TILE, (13 + 0.5) * TILE];

  // ---------------------------------------------------------------- canvas
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  // ---------------------------------------------------------------- dom refs
  function $(id) { return document.getElementById(id); }
  var goldEl = $('gold'), livesEl = $('lives'), waveEl = $('wave'),
      enemiesEl = $('enemies'), scoreEl = $('score'), waveBtn = $('waveBtn'),
      speedBtn = $('speedBtn'), soundBtn = $('soundBtn'), resetBtn = $('resetBtn'),
      shopEl = $('shop'), infoTitle = $('infoTitle'), infoBody = $('infoBody'),
      upBtn = $('upBtn'), sellBtn = $('sellBtn'),
      overlayEl = $('overlay'), ovTitle = $('ovTitle'), ovSub = $('ovSub'), ovBtn = $('ovBtn');

  // ---------------------------------------------------------------- audio
  var actx = null, muted = false, lastShotSound = 0;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') { actx.resume(); }
  }
  function beep(freq, dur, type, vol, slide, delay) {
    if (muted || !actx) return;
    try {
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function sfxShoot(type) {
    var now = performance.now();
    if (now - lastShotSound < 40) return;
    lastShotSound = now;
    if (type === 'cannon') beep(120, 0.22, 'sawtooth', 0.04, -40);
    else if (type === 'frost') beep(720, 0.08, 'sine', 0.03, 120);
    else if (type === 'sniper') beep(320, 0.12, 'triangle', 0.05, -140);
    else beep(520 + Math.random() * 120, 0.05, 'square', 0.015, -280);
  }
  function sfxHit() { beep(210, 0.045, 'square', 0.018, -60); }
  function sfxBoom() { beep(95, 0.3, 'sawtooth', 0.06, -55); beep(60, 0.35, 'triangle', 0.05, -20, 0.03); }
  function sfxCoin() { beep(660, 0.06, 'sine', 0.045); beep(990, 0.08, 'sine', 0.04, 0, 0.06); }
  function sfxLeak() { beep(220, 0.25, 'sawtooth', 0.06, -90); }
  function sfxWave() { beep(392, 0.12, 'triangle', 0.05); beep(523, 0.12, 'triangle', 0.05, 0, 0.12); }
  function sfxPlace() { beep(240, 0.1, 'square', 0.04, 90); }
  function sfxOver() { beep(392, 0.18, 'sawtooth', 0.05, -140); beep(311, 0.2, 'sawtooth', 0.05, -120, 0.16); beep(233, 0.4, 'sawtooth', 0.06, -100, 0.32); }

  // ---------------------------------------------------------------- state
  var gold = START_GOLD, lives = START_LIVES, wave = 0, score = 0;
  var speed = 1, state = 'idle'; // idle | wave | over | win
  var countdown = PREP_TIME;
  var spawnQueue = [], spawnTimer = 0;
  var placing = null, selected = null, hover = null;
  var enemies = [], towers = [], projectiles = [], parts = [], floats = [];
  var shopCards = [];

  function towerAt(tx, ty) {
    for (var i = 0; i < towers.length; i++) {
      if (towers[i].tx === tx && towers[i].ty === ty) return towers[i];
    }
    return null;
  }

  // ---------------------------------------------------------------- waves
  function buildQueue(w) {
    var q = [];
    var nBasic = Math.min(6 + Math.round(w * 1.5), 50);
    for (var i = 0; i < nBasic; i++) q.push({ type: 'basic', gap: i === 0 ? 0.3 : 0.55 });
    if (w >= 3) {
      var nFast = Math.min(2 + Math.floor(w / 2), 12);
      for (i = 0; i < nFast; i++) q.push({ type: 'fast', gap: i === 0 ? 0.8 : 0.7 });
    }
    if (w >= 4) {
      var nTank = Math.min(1 + Math.floor(w / 3), 9);
      for (i = 0; i < nTank; i++) q.push({ type: 'tank', gap: i === 0 ? 1.0 : 1.3 });
    }
    if (w % 5 === 0) q.push({ type: 'boss', gap: 2 });
    return q;
  }

  function spawnEnemy(type) {
    var t = ENEMY_TYPES[type];
    var hp = Math.round(t.hp * Math.pow(1.13, wave - 1));
    enemies.push({
      type: type, hp: hp, maxHp: hp, speed: t.speed, radius: t.radius,
      bounty: t.bounty, color: t.color, x: pathPts[0][0], y: pathPts[0][1],
      pidx: 0, dist: 0, slowT: 0, slowF: 1, flash: 0, dead: false, a: 0
    });
  }

  function startWave() {
    if (state !== 'idle') return;
    wave++;
    spawnQueue = buildQueue(wave);
    spawnTimer = 0.2;
    state = 'wave';
    sfxWave();
  }

  // ---------------------------------------------------------------- enemies
  function updateSpawning(dt) {
    if (state !== 'wave') return;
    if (spawnTimer > 0) { spawnTimer -= dt; return; }
    if (spawnQueue.length) {
      var item = spawnQueue.shift();
      spawnEnemy(item.type);
      spawnTimer = item.gap + Math.random() * 0.3;
    }
  }

  function moveEnemy(e, dt) {
    var remaining = e.speed * e.slowF * dt;
    while (remaining > 0 && e.pidx < pathPts.length - 1) {
      var x0 = pathPts[e.pidx][0], y0 = pathPts[e.pidx][1];
      var x1 = pathPts[e.pidx + 1][0], y1 = pathPts[e.pidx + 1][1];
      var dx = x1 - e.x, dy = y1 - e.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= 0.0001) {
        e.pidx++;
        e.a = Math.atan2(y1 - y0, x1 - x0);
        continue;
      }
      if (remaining >= d) {
        e.x = x1; e.y = y1; e.pidx++; e.dist += d;
        e.a = Math.atan2(dy, dx);
        remaining -= d;
      } else {
        e.x += dx / d * remaining; e.y += dy / d * remaining;
        e.dist += remaining;
        e.a = Math.atan2(dy, dx);
        remaining = 0;
      }
    }
    if (e.pidx >= pathPts.length - 1) leakEnemy(e);
  }

  function leakEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    var loss = e.type === 'boss' ? 5 : 1;
    lives -= loss;
    addText(END_XY[0], END_XY[1] - 24, '-' + loss + ' ❤', '#ff7b7b');
    burst(END_XY[0], END_XY[1], '#ff6b6b', 8, 70);
    sfxLeak();
    if (lives <= 0) {
      lives = 0;
      state = 'over';
      sfxOver();
      showOverlay('Game Over', 'You survived ' + wave + ' of ' + WAVES + ' waves.\nScore: ' + score);
    }
  }

  function damageEnemy(e, dmg) {
    if (e.dead) return;
    e.hp -= dmg;
    e.flash = 0.08;
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    gold += e.bounty;
    score += e.bounty;
    addText(e.x, e.y, '+' + e.bounty, '#ffd166');
    burst(e.x, e.y, e.color, 10, 95);
    sfxCoin();
  }

  function updateEnemies(dt) {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead) continue;
      if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 1; }
      if (e.flash > 0) e.flash -= dt;
      moveEnemy(e, dt);
    }
    enemies = enemies.filter(function (e) { return !e.dead; });
  }

  // ---------------------------------------------------------------- towers
  function tryPlace(tx, ty) {
    if (!placing) return;
    var t = TOWER_TYPES[placing];
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    if (pathTiles.has(tx + ',' + ty)) return;
    if (towerAt(tx, ty)) return;
    if (gold < t.cost) return;
    gold -= t.cost;
    towers.push({
      type: placing, tx: tx, ty: ty,
      x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE,
      level: 1, cd: 0, angle: -Math.PI / 2, invested: t.cost
    });
    burst((tx + 0.5) * TILE, (ty + 0.5) * TILE, t.color, 8, 60);
    sfxPlace();
  }

  function upgradeCost(tw) { return Math.round(TOWER_TYPES[tw.type].cost * 0.7 * tw.level); }
  function sellValue(tw) { return Math.round(tw.invested * 0.7); }

  function upgradeTower() {
    var tw = selected;
    if (!tw || tw.level >= 3) return;
    var c = upgradeCost(tw);
    if (gold < c) return;
    gold -= c;
    tw.level++;
    tw.invested += c;
    addText(tw.x, tw.y, '▲ Lv ' + tw.level, '#9dff9d');
    burst(tw.x, tw.y, TOWER_TYPES[tw.type].color, 8, 50);
    beep(520, 0.1, 'triangle', 0.05, 120);
    buildInfo();
  }

  function sellTower() {
    var tw = selected;
    if (!tw) return;
    gold += sellValue(tw);
    towers = towers.filter(function (t) { return t !== tw; });
    burst(tw.x, tw.y, '#dddddd', 12, 70);
    beep(300, 0.12, 'sine', 0.05, -110);
    selected = null;
    buildInfo();
  }

  function findTarget(tw, t) {
    var r = t.range[tw.level - 1];
    var rr = r * r;
    var best = null, bestD = -1;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead) continue;
      var dx = e.x - tw.x, dy = e.y - tw.y;
      if (dx * dx + dy * dy <= rr && e.dist > bestD) { best = e; bestD = e.dist; }
    }
    return best;
  }

  function fire(tw, t, enemy) {
    var tipx = tw.x + Math.cos(tw.angle) * 22;
    var tipy = tw.y + Math.sin(tw.angle) * 22;
    var lvl = tw.level - 1;
    projectiles.push({
      x: tipx, y: tipy, lx: tipx, ly: tipy,
      target: enemy, tx: enemy.x, ty: enemy.y,
      speed: t.projSpeed, dmg: t.damage[lvl],
      splash: t.splash ? t.splash[lvl] : 0,
      slow: t.slow, slowDur: t.slowDur ? t.slowDur[lvl] : 0,
      color: t.projColor, r: t.projR, type: tw.type
    });
    burst(tipx, tipy, t.projColor, 2, 40);
    sfxShoot(tw.type);
  }

  function updateTowers(dt) {
    for (var i = 0; i < towers.length; i++) {
      var tw = towers[i];
      tw.cd -= dt;
      var t = TOWER_TYPES[tw.type];
      var enemy = findTarget(tw, t);
      if (enemy) {
        var a = Math.atan2(enemy.y - tw.y, enemy.x - tw.x);
        var d = a - tw.angle;
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        tw.angle += d * Math.min(1, dt * 12);
        if (tw.cd <= 0) {
          fire(tw, t, enemy);
          tw.cd = 1 / t.rof[tw.level - 1];
        }
      }
    }
  }

  // ---------------------------------------------------------------- projectiles
  function updateProjectiles(dt) {
    for (var i = projectiles.length - 1; i >= 0; i--) {
      var p = projectiles[i];
      if (p.target && !p.target.dead) { p.tx = p.target.x; p.ty = p.target.y; }
      var dx = p.tx - p.x, dy = p.ty - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var step = p.speed * dt;
      p.lx = p.x; p.ly = p.y;
      if (d < Math.max(step, 2) + 4) {
        impact(p, p.tx, p.ty);
        projectiles.splice(i, 1);
      } else {
        p.x += dx / d * step;
        p.y += dy / d * step;
      }
    }
  }

  function impact(p, x, y) {
    if (p.splash > 0) {
      var hitAny = false;
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (e.dead) continue;
        var dx = e.x - x, dy = e.y - y;
        if (dx * dx + dy * dy <= (p.splash + e.radius) * (p.splash + e.radius)) {
          damageEnemy(e, p.dmg);
          hitAny = true;
          if (p.slow > 0) { e.slowT = Math.max(e.slowT, p.slowDur); e.slowF = 1 - p.slow; }
        }
      }
      boom(x, y, p.splash, p.color);
      if (hitAny) sfxBoom();
      else { burst(x, y, p.color, 5, 40); }
    } else {
      if (p.target && !p.target.dead) {
        damageEnemy(p.target, p.dmg);
        if (p.slow > 0) { p.target.slowT = Math.max(p.target.slowT, p.slowDur); p.target.slowF = 1 - p.slow; }
        burst(x, y, p.color, 5, 70);
        sfxHit();
      } else {
        burst(x, y, p.color, 3, 30);
      }
    }
  }

  // ---------------------------------------------------------------- fx
  function burst(x, y, color, n, spd) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = spd * (0.4 + Math.random() * 0.8);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.35 + Math.random() * 0.3, t: 0, color: color,
        size: 2 + Math.random() * 3, ring: false, r: 0, maxr: 0
      });
    }
  }
  function boom(x, y, radius, color) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = 60 + Math.random() * 90;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.3 + Math.random() * 0.25, t: 0, color: color,
        size: 3 + Math.random() * 4, ring: false, r: 0, maxr: 0
      });
    }
    parts.push({ x: x, y: y, vx: 0, vy: 0, life: 0.32, t: 0, color: '#ffffff',
      size: 0, ring: true, r: 4, maxr: radius });
  }
  function addText(x, y, str, color) {
    floats.push({ x: x, y: y, str: str, color: color, life: 0.95, t: 0 });
  }
  function updateFx(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      if (!p.ring) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.86; p.vy *= 0.86;
      } else {
        p.r += (p.maxr - p.r) * Math.min(1, dt * 12);
      }
    }
    for (var j = floats.length - 1; j >= 0; j--) {
      var f = floats[j];
      f.t += dt;
      if (f.t >= f.life) floats.splice(j, 1);
    }
  }

  // ---------------------------------------------------------------- wave flow
  function updateWave(dt) {
    if (state === 'idle') {
      countdown -= dt;
      if (countdown <= 0) startWave();
    }
    if (state === 'wave' && spawnQueue.length === 0 && enemies.length === 0) {
      var bonus = 20 + wave * 3;
      gold += bonus;
      score += bonus * 2;
      addText(W / 2, H * 0.35, 'Wave ' + wave + ' cleared! +' + bonus, '#ffffff');
      if (wave >= WAVES) {
        state = 'win';
        showOverlay('Victory!', 'All ' + WAVES + ' waves cleared.\nFinal score: ' + score);
      } else {
        state = 'idle';
        countdown = 8;
      }
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    if (state !== 'over' && state !== 'win') {
      updateSpawning(dt);
      updateEnemies(dt);
      updateTowers(dt);
      updateProjectiles(dt);
      updateWave(dt);
    }
    updateFx(dt);
  }

  // ---------------------------------------------------------------- draw
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

  function drawMap() {
    ctx.fillStyle = '#3a7d3e';
    ctx.fillRect(0, 0, W, H);
    for (var ty = 0; ty < ROWS; ty++) {
      for (var tx = 0; tx < COLS; tx++) {
        var isPath = pathTiles.has(tx + ',' + ty);
        if (isPath) {
          ctx.fillStyle = '#a5835a';
          ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
          ctx.fillStyle = '#b59368';
          ctx.fillRect(tx * TILE + 2, ty * TILE + 2, TILE - 4, TILE - 4);
        } else {
          ctx.fillStyle = (tx + ty) % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.03)';
          ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
        }
      }
    }
    // grid
    ctx.strokeStyle = 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < COLS; i++) { ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, H); }
    for (var j = 1; j < ROWS; j++) { ctx.moveTo(0, j * TILE); ctx.lineTo(W, j * TILE); }
    ctx.stroke();
    // dashed centerline
    ctx.strokeStyle = 'rgba(255,235,200,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 12]);
    ctx.beginPath();
    for (var k = 0; k < pathPts.length; k++) {
      if (k === 0) ctx.moveTo(pathPts[k][0], pathPts[k][1]);
      else ctx.lineTo(pathPts[k][0], pathPts[k][1]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // start portal
    ctx.fillStyle = '#22242a';
    circle(START_XY[0], START_XY[1], 17); ctx.fill();
    ctx.fillStyle = '#7c5cff';
    circle(START_XY[0], START_XY[1], 11); ctx.fill();
    ctx.strokeStyle = '#b7a8ff'; ctx.lineWidth = 2;
    circle(START_XY[0], START_XY[1], 11); ctx.stroke();
    // end beacon
    ctx.fillStyle = '#e0479e';
    circle(END_XY[0], END_XY[1], 13); ctx.fill();
    ctx.strokeStyle = '#ffd0ec'; ctx.lineWidth = 3;
    circle(END_XY[0], END_XY[1], 13); ctx.stroke();
  }

  function drawRange(cx, cy, r, fill) {
    ctx.fillStyle = fill || 'rgba(255,255,255,0.08)';
    circle(cx, cy, r); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    circle(cx, cy, r); ctx.stroke();
  }

  function drawTowerSprite(type, x, y, angle, level) {
    var t = TOWER_TYPES[type];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    // housing
    ctx.fillStyle = t.color;
    circle(0, 0, 11); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    circle(0, 0, 11); ctx.stroke();
    // barrel
    ctx.fillStyle = '#22282e';
    if (type === 'gunner') {
      ctx.fillRect(6, -2.5, 14, 5);
    } else if (type === 'cannon') {
      ctx.fillRect(4, -4, 10, 8);
      ctx.fillRect(-2, -5, 8, 10);
    } else if (type === 'frost') {
      ctx.fillRect(5, -2, 12, 4);
      ctx.fillStyle = '#cfefff';
      circle(0, 0, 5); ctx.fill();
    } else {
      ctx.fillRect(8, -1.5, 22, 3);
    }
    ctx.restore();
    // level pips
    ctx.fillStyle = '#ffd166';
    for (var i = 0; i < level; i++) {
      circle(x - 8 + i * 8, y + 16, 3); ctx.fill();
    }
  }

  function drawTowers() {
    for (var i = 0; i < towers.length; i++) {
      var tw = towers[i];
      var t = TOWER_TYPES[tw.type];
      // platform
      ctx.fillStyle = '#3b3b3f';
      circle(tw.x, tw.y, 15); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 2;
      circle(tw.x, tw.y, 15); ctx.stroke();
      if (selected === tw) drawRange(tw.x, tw.y, t.range[tw.level - 1], 'rgba(255,255,255,0.10)');
      drawTowerSprite(tw.type, tw.x, tw.y, tw.angle, tw.level);
      if (selected === tw) {
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(tw.x - 18, tw.y - 18, 36, 36);
      }
    }
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.slowT > 0) {
        ctx.fillStyle = 'rgba(120,200,255,0.30)';
        circle(e.x, e.y, e.radius + 3); ctx.fill();
      }
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1.5;
      if (e.type === 'basic') {
        circle(0, 0, e.radius); ctx.fill(); ctx.stroke();
      } else if (e.type === 'fast') {
        ctx.rotate(e.a || 0);
        ctx.beginPath();
        ctx.moveTo(e.radius * 1.6, 0);
        ctx.lineTo(-e.radius, -e.radius * 0.85);
        ctx.lineTo(-e.radius, e.radius * 0.85);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (e.type === 'tank') {
        rr(-e.radius, -e.radius, e.radius * 2, e.radius * 2, 5); ctx.fill(); ctx.stroke();
      } else {
        ctx.beginPath();
        for (var s = 0; s < 6; s++) {
          var a = Math.PI / 6 + s * Math.PI / 3;
          var px = Math.cos(a) * e.radius, py = Math.sin(a) * e.radius;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
      // hp bar
      var w = 26, pct = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - w / 2, e.y - e.radius - 10, w, 4);
      ctx.fillStyle = pct > 0.5 ? '#6fdc7c' : (pct > 0.25 ? '#ffcf4d' : '#ff5f5f');
      ctx.fillRect(e.x - w / 2, e.y - e.radius - 10, w * pct, 4);
    }
  }

  function drawProjectiles() {
    for (var i = 0; i < projectiles.length; i++) {
      var p = projectiles[i];
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.lx, p.ly);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      circle(p.x, p.y, p.r); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      circle(p.x, p.y, p.r * 0.6); ctx.stroke();
    }
  }

  function drawFx() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var alpha = 1 - p.t / p.life;
      if (p.ring) {
        ctx.globalAlpha = alpha * 0.7;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        circle(p.x, p.y, p.r); ctx.stroke();
      } else {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        circle(p.x, p.y, p.size); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (var j = 0; j < floats.length; j++) {
      var f = floats[j];
      ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
      ctx.font = 'bold 13px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = f.color;
      ctx.fillText(f.str, f.x, f.y - f.t * 26);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function drawPlacement() {
    if (!placing || !hover) return;
    var tx = hover.tx, ty = hover.ty;
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    var t = TOWER_TYPES[placing];
    var ok = !pathTiles.has(tx + ',' + ty) && !towerAt(tx, ty) && gold >= t.cost;
    ctx.fillStyle = ok ? 'rgba(120,255,120,0.35)' : 'rgba(255,80,80,0.35)';
    ctx.fillRect(tx * TILE + 1, ty * TILE + 1, TILE - 2, TILE - 2);
    ctx.strokeStyle = ok ? '#8fff8f' : '#ff8f8f';
    ctx.lineWidth = 2;
    ctx.strokeRect(tx * TILE + 1, ty * TILE + 1, TILE - 2, TILE - 2);
    drawRange((tx + 0.5) * TILE, (ty + 0.5) * TILE, t.range[0], 'rgba(255,255,255,0.08)');
    drawTowerSprite(placing, (tx + 0.5) * TILE, (ty + 0.5) * TILE, -Math.PI / 2, 1);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawMap();
    drawPlacement();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawFx();
  }

  // ---------------------------------------------------------------- ui
  function buildShop() {
    for (var key in TOWER_TYPES) {
      if (!TOWER_TYPES.hasOwnProperty(key)) continue;
      var t = TOWER_TYPES[key];
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.key = key;
      card.innerHTML = '<div class="ico">' + t.icon + '</div>' +
        '<div class="nm">' + t.name + '</div>' +
        '<div class="cs">💲' + t.cost + '</div>';
      card.addEventListener('click', function (k) {
        return function () { selectPlace(k); };
      }(key));
      shopEl.appendChild(card);
      shopCards.push(card);
    }
  }

  function selectPlace(key) {
    ensureAudio();
    placing = placing === key ? null : key;
    selected = null;
    buildInfo();
  }

  function buildInfo() {
    for (var i = 0; i < shopCards.length; i++) {
      var c = shopCards[i];
      c.classList.toggle('active', placing === c.dataset.key);
    }
    if (placing) {
      var t = TOWER_TYPES[placing];
      infoTitle.textContent = 'Placing: ' + t.name;
      infoBody.textContent = t.desc + '  ·  Cost 💲' + t.cost + '  ·  Click a green tile to build. Right-click or Esc to cancel.';
      upBtn.style.display = 'none';
      sellBtn.style.display = 'none';
      return;
    }
    if (selected) {
      var tw = selected, tt = TOWER_TYPES[tw.type], lv = tw.level - 1;
      infoTitle.textContent = tt.name + '  (Lv ' + tw.level + ')';
      var parts = 'Damage ' + tt.damage[lv] + '  ·  Range ' + tt.range[lv];
      if (tt.splash) parts += '  ·  Splash ' + tt.splash[lv];
      if (tt.slow) parts += '  ·  Slows';
      parts += '  ·  Rate ' + tt.rof[lv].toFixed(2) + '/s';
      infoBody.textContent = parts;
      upBtn.style.display = 'inline-block';
      sellBtn.style.display = 'inline-block';
      upBtn.disabled = tw.level >= 3 || gold < upgradeCost(tw);
      upBtn.textContent = tw.level >= 3 ? 'Max level' : 'Upgrade  💲' + upgradeCost(tw);
      sellBtn.textContent = 'Sell  💲' + sellValue(tw);
      return;
    }
    infoTitle.textContent = 'No tower selected';
    infoBody.textContent = 'Pick a tower below, then click the map to place it. Click a built tower to upgrade or sell it.';
    upBtn.style.display = 'none';
    sellBtn.style.display = 'none';
  }

  function syncDom() {
    goldEl.textContent = gold;
    livesEl.textContent = lives;
    waveEl.textContent = wave + '/' + WAVES;
    enemiesEl.textContent = enemies.length + (spawnQueue.length ? '+' + spawnQueue.length : '');
    scoreEl.textContent = score;
    if (state === 'wave') waveBtn.textContent = 'Wave in progress…';
    else if (state === 'over' || state === 'win') waveBtn.textContent = '—';
    else waveBtn.textContent = state === 'idle' ? 'Start Wave  (' + Math.ceil(countdown) + 's)' : 'Start Wave';
    speedBtn.textContent = 'Speed ×' + speed;
    soundBtn.textContent = muted ? '🔇 Sound' : '🔊 Sound';
    for (var i = 0; i < shopCards.length; i++) {
      shopCards[i].classList.toggle('poor', gold < TOWER_TYPES[shopCards[i].dataset.key].cost);
    }
  }

  // ---------------------------------------------------------------- overlay
  function showOverlay(title, sub) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    overlayEl.classList.remove('hidden');
  }
  ovBtn.addEventListener('click', function () { ensureAudio(); resetGame(); });

  // ---------------------------------------------------------------- reset
  function resetGame() {
    gold = START_GOLD; lives = START_LIVES; wave = 0; score = 0;
    speed = 1; state = 'idle'; countdown = PREP_TIME;
    spawnQueue = []; spawnTimer = 0;
    placing = null; selected = null;
    enemies = []; towers = []; projectiles = []; parts = []; floats = [];
    overlayEl.classList.add('hidden');
    buildInfo();
  }

  // ---------------------------------------------------------------- input
  function canvasPos(e) {
    var r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top) * (H / r.height)
    };
  }

  cv.addEventListener('mousemove', function (e) {
    var p = canvasPos(e);
    hover = { x: p.x, y: p.y, tx: Math.floor(p.x / TILE), ty: Math.floor(p.y / TILE) };
  });
  cv.addEventListener('mouseleave', function () { hover = null; });

  cv.addEventListener('click', function (e) {
    ensureAudio();
    if (!overlayEl.classList.contains('hidden')) return;
    if (!hover) return;
    var tx = hover.tx, ty = hover.ty;
    if (placing) { tryPlace(tx, ty); return; }
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    selected = towerAt(tx, ty) || null;
    buildInfo();
  });

  cv.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (placing) { placing = null; buildInfo(); }
    else if (selected) { selected = null; buildInfo(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'Escape') {
      if (placing) { placing = null; buildInfo(); }
      else if (selected) { selected = null; buildInfo(); }
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'idle') { startWave(); }
      return;
    }
    var keys = { Digit1: 'gunner', Digit2: 'cannon', Digit3: 'frost', Digit4: 'sniper' };
    if (keys[e.code]) { selectPlace(keys[e.code]); }
  });

  waveBtn.addEventListener('click', function () { ensureAudio(); if (state === 'idle') startWave(); });
  speedBtn.addEventListener('click', function () {
    ensureAudio();
    speed = speed === 1 ? 2 : (speed === 2 ? 3 : 1);
  });
  soundBtn.addEventListener('click', function () {
    ensureAudio();
    muted = !muted;
  });
  resetBtn.addEventListener('click', function () { ensureAudio(); resetGame(); });
  upBtn.addEventListener('click', function () { ensureAudio(); upgradeTower(); });
  sellBtn.addEventListener('click', function () { ensureAudio(); sellTower(); });

  document.addEventListener('pointerdown', function () { ensureAudio(); }, { passive: true });

  // ---------------------------------------------------------------- loop
  var last = performance.now();
  function frame(now) {
    var dtRaw = Math.min((now - last) / 1000, 0.05);
    last = now;
    var dt = dtRaw * speed;
    update(dt);
    draw();
    syncDom();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- start
  buildShop();
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
