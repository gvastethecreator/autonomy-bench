<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Living City of Aldercrown — Procedural Medieval City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }

  #hud { position: fixed; top: 14px; left: 16px; z-index: 10; color: #f2e5c8; font-family: Georgia, 'Times New Roman', serif; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  #hud h1 { font-size: 21px; letter-spacing: 2px; font-weight: normal; }
  #hud .sub { font-size: 12px; opacity: .82; margin-top: 2px; letter-spacing: .4px; }

  #clock { position: fixed; top: 14px; right: 16px; z-index: 10; background: rgba(22,16,9,.55); border: 1px solid rgba(255,214,150,.28); border-radius: 10px; padding: 9px 14px; color: #f6e7c4; font-family: Georgia, serif; text-align: center; backdrop-filter: blur(2px); }
  #clock .t { font-size: 22px; letter-spacing: 2px; }
  #clock .d { font-size: 11px; opacity: .85; margin-top: 3px; letter-spacing: 1px; }
  #clock .btns { margin-top: 7px; display: flex; gap: 4px; justify-content: center; }
  #clock button { pointer-events: auto; background: rgba(255,214,150,.14); color: #f6e7c4; border: 1px solid rgba(255,214,150,.32); border-radius: 5px; font-size: 11px; padding: 3px 9px; cursor: pointer; font-family: Georgia, serif; }
  #clock button:hover { background: rgba(255,214,150,.38); }
  #clock button.active { background: rgba(255,214,150,.5); }

  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10; color: rgba(255,240,214,.72); font-size: 12px; font-family: Georgia, serif; text-shadow: 0 1px 3px #000; letter-spacing: .5px; pointer-events: none; }

  #err { display: none; position: fixed; inset: 0; z-index: 50; background: #120d08; color: #f0ddb8; font-family: Georgia, serif; padding: 40px; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div id="hud">
    <h1>⚜ Aldercrown</h1>
    <div class="sub">a living procedural medieval city · 3D · Three.js</div>
  </div>
  <div id="clock">
    <div class="t" id="clockT">--:--</div>
    <div class="d" id="clockD">morning</div>
    <div class="btns">
      <button id="bPause" title="pause / resume time">⏸</button>
      <button data-sp="1" class="active" title="time speed 1x">1×</button>
      <button data-sp="8" title="time speed 8x">8×</button>
      <button data-sp="40" title="time speed 40x">40×</button>
    </div>
  </div>
  <div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
  <div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Aldercrown — a living procedural medieval city
   One file, no build step. Everything is generated at runtime.
   ===================================================================== */

try {

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd6ef, 280, 1150);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 4000);
camera.position.set(300, 175, 360);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.maxPolarAngle = 1.52;
controls.minDistance = 18;
controls.maxDistance = 1000;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.addEventListener('start', () => { controls.autoRotate = false; });

/* ---------------- deterministic RNG ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20260823);
const R2 = mulberry32(9911);

/* ---------------- canvas / texture helpers ---------------- */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, d) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n >> 16) & 255) * (1 + d)));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) * (1 + d)));
  const b = Math.max(0, Math.min(255, (n & 255) * (1 + d)));
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function toTex(c, rep) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}

/* ---------------- procedural facade textures (half-timbered) ---------------- */
function makeFacades() {
  const facades = [];
  const plasters = ['#e8d9bb', '#dcc9a3', '#e4d1ad', '#d0bd97', '#eadbc0', '#cdbd97', '#e2cfaa'];
  const wood = '#3a2a1c';
  for (let k = 0; k < plasters.length; k++) {
    const rng = mulberry32(777 + k * 13);
    const day = cv(256, 256), dc = day.getContext('2d');
    const emis = cv(256, 256), ec = emis.getContext('2d');
    dc.fillStyle = plasters[k]; dc.fillRect(0, 0, 256, 256);
    for (let n = 0; n < 1000; n++) {
      dc.fillStyle = `rgba(0,0,0,${(0.015 + rng() * 0.05).toFixed(3)})`;
      dc.fillRect(rng() * 256, rng() * 256, 2 + rng() * 2, 2 + rng() * 2);
    }
    // timber frame
    dc.fillStyle = wood;
    dc.fillRect(0, 0, 256, 7);      // bottom beam
    dc.fillRect(0, 124, 256, 7);    // mid beam
    dc.fillRect(0, 246, 256, 10);   // top beam
    for (const px of [6, 64, 128, 192, 250]) dc.fillRect(px, 0, 6, 256);
    dc.strokeStyle = wood; dc.lineWidth = 5; dc.lineCap = 'round';
    if (rng() < 0.75) { dc.beginPath(); dc.moveTo(70, 7);  dc.lineTo(124, 124); dc.stroke(); }
    if (rng() < 0.75) { dc.beginPath(); dc.moveTo(192, 124); dc.lineTo(250, 246); dc.stroke(); }
    if (rng() < 0.7)  { dc.beginPath(); dc.moveTo(128, 246); dc.lineTo(70, 124);  dc.stroke(); }
    if (rng() < 0.65) { dc.beginPath(); dc.moveTo(250, 124); dc.lineTo(192, 7);   dc.stroke(); }
    if (rng() < 0.6)  { dc.beginPath(); dc.moveTo(64, 246);  dc.lineTo(128, 124); dc.stroke(); }
    // windows
    const windows = [];
    const bands = [[30, 60], [150, 178], [214, 242]];
    const panels = [[14, 60], [70, 122], [134, 186], [196, 246]];
    const ww = 24, wh = 30;
    for (const [by, bh] of bands) {
      for (const [px, pe] of panels) {
        if (rng() < 0.26) continue;
        const wx = px + (pe - px - ww) / 2 + (rng() - 0.5) * 6;
        const wy = by + (bh - wh) / 2;
        dc.fillStyle = wood; dc.fillRect(wx - 3, wy - 3, ww + 6, wh + 6);
        dc.fillStyle = '#1d222d'; dc.fillRect(wx, wy, ww, wh);
        dc.fillStyle = wood;
        dc.fillRect(wx + ww / 2 - 1.5, wy, 3, wh);
        dc.fillRect(wx, wy + wh / 2 - 1.5, ww, 3);
        windows.push([wx, wy, ww, wh]);
      }
    }
    // arched door
    const dw = 26, dh = 36, dx = 128 - dw / 2, dy = 0;
    dc.fillStyle = wood; dc.fillRect(dx - 3, dy - 1, dw + 6, dh + 4);
    dc.fillStyle = '#3b2416'; dc.fillRect(dx, dy, dw, dh);
    dc.fillStyle = '#0000002c'; dc.fillRect(dx, dy, dw, dh / 2);
    dc.fillStyle = wood; dc.fillRect(dx + dw / 2 - 1.5, dy + 2, 3, dh - 4);
    // glow canvas: windows + lantern
    for (const [wx, wy, wwd, whd] of windows) {
      const g = ec.createRadialGradient(wx + wwd / 2, wy + whd / 2, 1, wx + wwd / 2, wy + whd / 2, wwd * 1.15);
      g.addColorStop(0, 'rgba(255,246,205,0.95)');
      g.addColorStop(0.45, 'rgba(255,205,115,0.55)');
      g.addColorStop(1, 'rgba(255,170,70,0)');
      ec.fillStyle = g; ec.fillRect(wx - wwd * 0.6, wy - whd * 0.6, wwd * 2.2, whd * 2.2);
      ec.fillStyle = '#fff3c4'; ec.fillRect(wx + 2, wy + 2, wwd - 4, whd - 4);
    }
    { const g = ec.createRadialGradient(dx + dw / 2, dy + 8, 1, dx + dw / 2, dy + 8, dw);
      g.addColorStop(0, 'rgba(255,225,160,0.9)'); g.addColorStop(1, 'rgba(255,180,90,0)');
      ec.fillStyle = g; ec.fillRect(dx - dw, dy - dh, dw * 3, dh * 3); }
    facades.push({ day: toTex(day), emis: toTex(emis) });
  }
  return facades;
}
const FACADES = makeFacades();

/* ---------------- roof / stone / ground textures ---------------- */
function roofTexture(slate) {
  const c = cv(128, 128), x = c.getContext('2d');
  x.fillStyle = slate ? '#4a4e5b' : '#a34e28'; x.fillRect(0, 0, 128, 128);
  for (let r = 0; r < 16; r++) for (let n = 0; n < 8; n++) {
    x.fillStyle = slate ? ((n % 2) ? '#565b6a' : '#434755') : ((n % 2) ? '#ba5b31' : '#93431f');
    x.fillRect(n * 16, r * 8, 16, 8);
  }
  x.strokeStyle = 'rgba(0,0,0,0.28)'; x.lineWidth = 1;
  for (let r = 0; r <= 16; r++) { x.beginPath(); x.moveTo(0, r * 8); x.lineTo(128, r * 8); x.stroke(); }
  x.strokeStyle = 'rgba(255,255,255,0.06)'; x.lineWidth = 1;
  for (let n = 0; n <= 8; n++) { x.beginPath(); x.moveTo(n * 16, 0); x.lineTo(n * 16, 128); x.stroke(); }
  return toTex(c);
}
function stoneTexture(rng) {
  const c = cv(128, 128), x = c.getContext('2d');
  x.fillStyle = '#82828b'; x.fillRect(0, 0, 128, 128);
  const cols = 6, rows = 8;
  for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) {
    const w = 21 + rng() * 4, h = 15 + rng() * 3;
    const ox = (cc / cols) * 128 + (r % 2 ? 6 : 0), oy = (r / rows) * 128;
    const gx = x.createLinearGradient(ox, oy, ox + w, oy + h);
    gx.addColorStop(0, shade('#87878f', (rng() - 0.5) * 0.3));
    gx.addColorStop(1, shade('#6f6f78', (rng() - 0.5) * 0.3));
    x.fillStyle = gx; x.fillRect(ox, oy, w, h);
    x.strokeStyle = '#5b5b64'; x.lineWidth = 1.5; x.strokeRect(ox, oy, w, h);
  }
  return toTex(c);
}
function grassTexture(rng) {
  const c = cv(128, 128), x = c.getContext('2d');
  x.fillStyle = '#5c7f3b'; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = rng() < 0.5 ? 'rgba(40,66,26,0.35)' : 'rgba(140,180,90,0.3)';
    x.fillRect(rng() * 128, rng() * 128, 1.5, 2.5);
  }
  for (let i = 0; i < 26; i++) {
    x.fillStyle = `rgba(0,0,0,${0.06 + rng() * 0.05})`;
    x.beginPath(); x.ellipse(rng() * 128, rng() * 128, 8 + rng() * 14, 6 + rng() * 8, rng() * 3, 0, 7); x.fill();
  }
  return toTex(c);
}
function cobbleTexture(rng, base) {
  const c = cv(128, 128), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 128, 128);
  for (let r = 0; r < 8; r++) {
    const off = (r % 2) * 10.5;
    for (let i = 0; i < 7; i++) {
      const cx = 9 + i * 18 + off, cy = 8 + r * 16;
      x.fillStyle = shade(base, (rng() - 0.5) * 0.28);
      x.beginPath(); x.ellipse(cx, cy, 8.4, 7.4, 0, 0, 7); x.fill();
      x.strokeStyle = 'rgba(0,0,0,0.30)'; x.lineWidth = 1.2; x.stroke();
    }
  }
  return toTex(c);
}
function bannerTexture(kind) {
  const c = cv(64, 48), x = c.getContext('2d');
  if (kind === 0) {
    x.fillStyle = '#8f1f24'; x.fillRect(0, 0, 64, 48);
    x.fillStyle = '#e8dcc0'; x.fillRect(28, 0, 8, 48); x.fillRect(0, 20, 64, 8);
  } else if (kind === 1) {
    for (let i = 0; i < 8; i++) { x.fillStyle = (i % 2) ? '#2b4a7e' : '#d8c27a'; x.fillRect(i * 8, 0, 8, 48); }
  } else {
    x.fillStyle = '#24482e'; x.fillRect(0, 0, 64, 48);
    x.fillStyle = '#c99a3f'; x.beginPath(); x.moveTo(32, 6); x.lineTo(58, 42); x.lineTo(6, 42); x.closePath(); x.fill();
  }
  return toTex(c);
}
function glowTexture(inner, outer) {
  const c = cv(128, 128), x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 2, 64, 64, 62);
  g.addColorStop(0, inner); g.addColorStop(0.4, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return toTex(c);
}
function smokeTex() {
  const c = cv(64, 64), x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.6, 'rgba(200,200,200,0.28)');
  g.addColorStop(1, 'rgba(160,160,160,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return toTex(c);
}
function woodDoorTexture() {
  const c = cv(128, 96), x = c.getContext('2d');
  x.fillStyle = '#4a2f1c'; x.fillRect(0, 0, 128, 96);
  for (let i = 0; i < 7; i++) {
    x.fillStyle = (i % 2) ? '#5c3a22' : '#402814';
    x.fillRect(i * 18 + 2, 0, 15, 96);
    x.strokeStyle = '#241505'; x.lineWidth = 1.5; x.strokeRect(i * 18 + 2, 0, 15, 96);
  }
  x.fillStyle = '#1a0f06'; x.fillRect(6, 34, 5, 26); x.fillRect(117, 34, 5, 26);
  return toTex(c);
}

const TILE_TEX = roofTexture(false), SLATE_TEX = roofTexture(true);
const STONE_TEX = stoneTexture(R), GRASS_TEX = grassTexture(R2), COBBLE_TEX = cobbleTexture(R, '#83838a');
const ROAD_TEX = cobbleTexture(R2, '#5e5e64');
const BANNER_TEX = [bannerTexture(0), bannerTexture(1), bannerTexture(2)];
const DOOR_TEX = woodDoorTexture();
const SMOKE_TEX = smokeTex();

/* ---------------- shared materials ---------------- */
const stoneMat = new THREE.MeshStandardMaterial({ map: STONE_TEX, roughness: 0.96, metalness: 0 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a3324, roughness: 0.9 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a2019, roughness: 1 });

/* ---------------- sky ---------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    topColor:    { value: new THREE.Color(0x2a5fc0) },
    horizonColor:{ value: new THREE.Color(0xbcd6ef) },
    bottomColor: { value: new THREE.Color(0x9db8d8) }
  },
  vertexShader: `
    varying vec3 vWP;
    void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWP = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    uniform vec3 topColor; uniform vec3 horizonColor; uniform vec3 bottomColor;
    varying vec3 vWP;
    void main(){
      float h = normalize(vWP).y;
      vec3 col = mix(horizonColor, topColor, pow(max(h,0.0), 0.62));
      col = mix(bottomColor, col, smoothstep(-0.08, 0.22, h));
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(850, 24, 16), skyMat));

/* stars */
const starGeo = new THREE.BufferGeometry();
{
  const N = 1400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const a = R() * Math.PI * 2, el = Math.asin(R());
    const r = 800;
    pos[i*3] = Math.cos(el) * Math.cos(a) * r;
    pos[i*3+1] = Math.sin(el) * r;
    pos[i*3+2] = Math.cos(el) * Math.sin(a) * r;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
scene.add(stars);

/* sun & moon sprites */
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(255,252,240,1)', 'rgba(255,190,110,0.55)'), color: 0xffffff, transparent: true, depthWrite: false, fog: false }));
sunSprite.scale.set(130, 130, 1); scene.add(sunSprite);
const moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(235,240,255,1)', 'rgba(170,190,235,0.45)'), color: 0xcfe0ff, transparent: true, depthWrite: false, fog: false }));
moonSprite.scale.set(70, 70, 1); scene.add(moonSprite);

/* ---------------- lights ---------------- */
scene.add(new THREE.AmbientLight(0x404860, 0.35));
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x3a4a32, 0.9);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff6e0, 1.5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -270; sunLight.shadow.camera.right = 270;
sunLight.shadow.camera.top = 270; sunLight.shadow.camera.bottom = -270;
sunLight.shadow.camera.near = 20; sunLight.shadow.camera.far = 1500;
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.03;
scene.add(sunLight);
const sunTarget = new THREE.Object3D(); scene.add(sunTarget); sunLight.target = sunTarget;
const moonLight = new THREE.DirectionalLight(0x93a6dd, 0);
scene.add(moonLight);

/* torch point lights (activated at night) */
const torchLights = [];
{
  const spots = [[0, 0, 0], [30, 0, 26], [-30, 0, 26], [30, 0, -26], [-30, 0, -26], [0, 0, 212], [0, 0, -212], [212, 0, 0], [-212, 0, 0]];
  for (let i = 0; i < spots.length; i++) {
    const pl = new THREE.PointLight(0xff9648, 0, 60, 1.8);
    pl.position.set(spots[i][0], 5 + (i === 0 ? 0 : 0), spots[i][2]);
    torchLights.push({ light: pl, phase: i * 1.7 });
    scene.add(pl);
  }
}

/* ---------------- flags (defined early; used by castle/gates/cathedral) ---------------- */
const flagMats = BANNER_TEX.map(t => new THREE.MeshStandardMaterial({ map: t, roughness: 0.9, side: THREE.DoubleSide }));
const flags = [];
function addFlag(x, y, z, texIdx, scale, phase, dir) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 3.6, 5), woodMat);
  pole.position.y = 1.8; g.add(pole);
  const banner = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.35), flagMats[texIdx]);
  banner.position.x = (dir === -1 ? -1.05 : 1.05);
  banner.position.y = 3.25;
  g.add(banner);
  g.position.set(x, y, z); g.scale.setScalar(scale);
  scene.add(g);
  flags.push({ banner, phase });
}

/* =====================================================================
   CITY GENERATION
   ===================================================================== */
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
const roofGeo = new THREE.ConeGeometry(1, 1, 4, 1);
roofGeo.rotateY(Math.PI / 4);

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
function setInst(mesh, idx, x, y, z, ry, sx, sy, sz) {
  _p.set(x, y, z); _e.set(0, ry, 0); _q.setFromEuler(_e); _s.set(sx, sy, sz);
  _m.compose(_p, _q, _s); mesh.setMatrixAt(idx, _m);
}

/* ---------------- ground ---------------- */
const groundMat = new THREE.MeshStandardMaterial({ map: GRASS_TEX, roughness: 1 });
groundMat.map.repeat.set(80, 80);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3400, 3400), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

/* cobble city floor */
const cobMat = new THREE.MeshStandardMaterial({ map: COBBLE_TEX, roughness: 1 });
cobMat.map.repeat.set(6, 6);
const cob = new THREE.Mesh(new THREE.CircleGeometry(204, 56), cobMat);
cob.rotation.x = -Math.PI / 2; cob.position.y = 0.02; cob.receiveShadow = true;
scene.add(cob);

/* roads */
const roadMat = new THREE.MeshStandardMaterial({ map: ROAD_TEX, roughness: 1 });
roadMat.map.repeat.set(4, 14);
function roadPlane(w, l, y, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), roadMat);
  m.rotation.x = -Math.PI / 2; m.rotation.y = ry || 0; m.position.y = y; m.receiveShadow = true;
  scene.add(m);
}
roadPlane(17, 470, 0.03, 0);            // N-S
roadPlane(17, 470, 0.03, Math.PI / 2);  // E-W
const ringMat = new THREE.MeshStandardMaterial({ map: ROAD_TEX, roughness: 1 });

const CASTLE_RECT = { x0: 30, x1: 160, z0: 125, z1: 205 };
const CATHEDRAL_RECT = { x0: -86, x1: -32, z0: -50, z1: 50 };
const GUILDHALL_RECT = { x0: 24, x1: 68, z0: -42, z1: 42 };

function inRect(x, z, r) { return x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1; }

const houses = [];
for (let i = -16; i <= 16; i++) {
  for (let j = -16; j <= 16; j++) {
    const x = i * 13 + (R() - 0.5) * 3;
    const z = j * 13 + (R() - 0.5) * 3;
    const r = Math.hypot(x, z);
    if (r > 190 || r < 37) continue;
    if (r > 70 && r < 86) continue;
    if (r > 140 && r < 156) continue;
    if (r > 166 && r < 198) continue;
    if (Math.abs(x) < 9.5 || Math.abs(z) < 9.5) continue;
    if (inRect(x, z, CASTLE_RECT) || inRect(x, z, CATHEDRAL_RECT) || inRect(x, z, GUILDHALL_RECT)) continue;
    if (R() < 0.13) continue;
    const w = 5 + R() * 4.3, d = 5 + R() * 4.3;
    const roll = R();
    let h;
    if (roll < 0.55) h = 4.6 + R() * 2.2;
    else if (roll < 0.88) h = 7.6 + R() * 2.4;
    else h = 11 + R() * 2.2;
    const rot = Math.floor(R() * 4) * (Math.PI / 2) + (R() - 0.5) * 0.18;
    houses.push({
      x, z, w, d, h, rot,
      wall: Math.floor(R() * FACADES.length),
      roof: R() < 0.72 ? 0 : 1,
      chimney: R() < 0.3
    });
  }
}

const WALL_R = 200;
const wallMesh = new THREE.InstancedMesh(unitBox, stoneMat, 40);

let wIdx = 0, cIdx = 0;
function nearGate(a) {
  const g = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2];
  let best = Math.PI;
  for (const gg of g) {
    let d = Math.abs(a - gg) % (Math.PI * 2);
    if (d > Math.PI) d = Math.PI * 2 - d;
    best = Math.min(best, d);
  }
  return best;
}
const WALL_SEG = 36;
for (let i = 0; i < WALL_SEG; i++) {
  const a0 = (i / WALL_SEG) * Math.PI * 2, a1 = ((i + 1) / WALL_SEG) * Math.PI * 2;
  const mid = (a0 + a1) / 2;
  if (nearGate(mid) < 0.105) continue;
  const L = 2 * WALL_R * Math.sin((a1 - a0) / 2);
  const rotY = Math.atan2(-Math.sin(mid), Math.cos(mid));
  setInst(wallMesh, wIdx++, Math.cos(mid) * WALL_R, 3.3, Math.sin(mid) * WALL_R, rotY, L, 6.6, 3.2);
  const n = Math.max(3, Math.round(L / 3.4));
  for (let k = 0; k < n; k++) {
    const t = (k + 0.5) / n;
    const cx = Math.cos(mid) * WALL_R - Math.sin(mid) * L * (t - 0.5);
    const cz = Math.sin(mid) * WALL_R + Math.cos(mid) * L * (t - 0.5);
    setInst(crenMesh, cIdx++, cx, 6.6, cz, rotY, 3.2, 1.1, 1.7);
  }
}

function buildGate(x, z, ry) {
  const g = new THREE.Group();
  const tMat = new THREE.MeshStandardMaterial({ map: STONE_TEX, roughness: 0.95 });
  const towerL = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 5.2, 13, 9), tMat);
  towerL.position.set(-12, 6.5, 0); towerL.castShadow = true;
  const towerR = towerL.clone(); towerR.position.x = 12;
  const span = new THREE.Mesh(new THREE.BoxGeometry(14, 9, 6), tMat);
  span.position.set(0, 6, 0); span.castShadow = true;
  const roofL = new THREE.Mesh(new THREE.ConeGeometry(5.8, 4.2, 9), new THREE.MeshStandardMaterial({ map: SLATE_TEX, roughness: 0.9 }));
  roofL.position.set(-12, 13 + 2.1, 0); roofL.castShadow = true;
  const roofR = roofL.clone(); roofR.position.x = 12;
  const roofS = new THREE.Mesh(new THREE.ConeGeometry(8, 3.6, 4), new THREE.MeshStandardMaterial({ map: SLATE_TEX, roughness: 0.9 }));
  roofS.rotation.y = Math.PI / 4; roofS.position.set(0, 10.8 + 1.8, 0); roofS.castShadow = true;
  const opening = new THREE.Mesh(new THREE.PlaneGeometry(7, 7.5), darkMat);
  opening.position.set(0, 3.75, -3.05);
  const doorL = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 7.4), new THREE.MeshStandardMaterial({ map: DOOR_TEX, roughness: 0.9, side: THREE.DoubleSide }));
  doorL.position.set(-1.8, 3.7, -2.9); doorL.rotation.y = -0.4;
  const doorR = doorL.clone(); doorR.position.x = 1.8; doorR.rotation.y = 0.4;
  g.add(towerL, towerR, span, roofL, roofR, roofS, opening, doorL, doorR);
  g.position.set(x, 0, z); g.rotation.y = ry;
  scene.add(g);
  addFlag(x, 13.5, z, 0, 1.1, 0.6, 1); addFlag(x, 13.5, z, 1, 1.1, 2.1, -1);
}

  if (inRect(x, z, CASTLE_RECT) || Math.abs(x) < 11 || Math.abs(z) < 11 || Math.hypot(x, z) < 150) continue;
  treePositions.push([x, z, 0.7 + R() * 0.9]);
}
for (let i = 0; i < 165; i++) {
  const a = R() * Math.PI * 2, r = 225 + R() * 420;
  treePositions.push([Math.cos(a) * r, Math.sin(a) * r, 0.7 + R() * 1.0]);
}
for (const [dx, dz] of [[39, -39], [39, 39], [-39, 39], [-39, -39]]) treePositions.push([dx, dz, 0.9]);
{
  const trunkGeo = new THREE.CylinderGeometry(0.3, 0.44, 1.7, 6); trunkGeo.translate(0, 0.85, 0);
  const canopyGeo = new THREE.ConeGeometry(2.3, 4.8, 7); canopyGeo.translate(0, 2.4, 0);
  const N = treePositions.length;
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x5a4026, roughness: 1 }), N);
  trunks.castShadow = true; scene.add(trunks);
  const canopies = new THREE.InstancedMesh(canopyGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }), N);
  canopies.castShadow = true;
  canopies.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
  scene.add(canopies);
  treePositions.forEach(([x, z, s], i) => {
    setInst(trunks, i, x, 0, z, 0, s, s, s);
    setInst(canopies, i, x, 0, z, 0, s, s, s);
    const col = new THREE.Color().setHSL(0.28 + R2() * 0.05, 0.5, 0.26 + R2() * 0.1);
    canopies.setColorAt(i, col);
  });
  trunks.instanceMatrix.needsUpdate = true;
  canopies.instanceMatrix.needsUpdate = true;
  canopies.instanceColor.needsUpdate = true;
}

/* ---------------- people ---------------- */
const gateN = [0, 214], gateS = [0, -214], gateE = [214, 0], gateW = [-214, 0];
const P = [0, 0], rN = [0, 82], rS = [0, -82], rE = [82, 0], rW = [-82, 0];
const routes = [
  [gateN, P, gateS, P],
  [gateS, P, gateN, P],
  [gateE, P, gateW, P],
  [gateW, P, gateE, P],
  [gateN, rN, P, rS, gateS],
  [gateS, rS, P, rN, gateN],
  [gateE, rE, P, rW, gateW],
  [gateW, rW, P, rE, gateE]
];
const N_PEOPLE = 30;
const legGeo = new THREE.BoxGeometry(0.13, 0.5, 0.15); legGeo.translate(0, 0.25, 0);
const bodyGeo = new THREE.CapsuleGeometry(0.22, 0.5, 3, 8); bodyGeo.translate(0, 0.47, 0);
const headGeo = new THREE.SphereGeometry(0.17, 10, 8);
const legL = new THREE.InstancedMesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x33261c, roughness: 0.95 }), N_PEOPLE);
const legR = new THREE.InstancedMesh(legGeo, legL.material, N_PEOPLE);
const bodyM = new THREE.InstancedMesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }), N_PEOPLE);
const headM = new THREE.InstancedMesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }), N_PEOPLE);
for (const m of [legL, legR, bodyM, headM]) { m.castShadow = true; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); }
bodyM.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_PEOPLE * 3), 3);
headM.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N_PEOPLE * 3), 3);
const people = [];
const tunicColors = [0x9c3b2e, 0x3b5f8a, 0x5c7a3a, 0x8a6b2f, 0x6b3f5e, 0x7a5230, 0x44543c, 0x8c3c48];
const skinColors = [0xd9a37a, 0xb5825c, 0xe3b58e, 0x8f5d3d];
for (let i = 0; i < N_PEOPLE; i++) {
  const rt = routes[i % routes.length];
  const route = rt.map(p => [p[0], p[1]]);
  const wi = Math.floor(R() * route.length);
  const cT = new THREE.Color(tunicColors[Math.floor(R() * tunicColors.length)]);
  const cS = new THREE.Color(skinColors[Math.floor(R() * skinColors.length)]);
  bodyM.setColorAt(i, cT); headM.setColorAt(i, cS);
  people.push({ route, wi, x: route[wi][0], z: route[wi][1], speed: 2.4 + R() * 1.4, phase: R() * 10, heading: 0, walkFreq: 7 + R() * 3 });
}
bodyM.instanceColor.needsUpdate = true; headM.instanceColor.needsUpdate = true;
const _tA = new THREE.Matrix4(), _legM = new THREE.Matrix4();
function legMatrix(out, x, z, ry, offx, swing, sc) {
  _p.set(x, 0, z); _e.set(0, ry, 0); _q.setFromEuler(_e); _s.set(1, 1, 1);
  out.compose(_p, _q, _s);
  _tA.makeTranslation(offx, 0, 0); out.multiply(_tA);
  _tA.makeRotationX(swing); out.multiply(_tA);
  _tA.makeScale(sc, sc, sc); out.multiply(_tA);
  return out;
}
function updatePeople(t, dt) {
  for (let i = 0; i < N_PEOPLE; i++) {
    const p = people[i];
    let wp = p.route[p.wi];
    let dx = wp[0] - p.x, dz = wp[1] - p.z;
    let dist = Math.hypot(dx, dz);
    if (dist < 0.7) {
      p.wi = (p.wi + 1) % p.route.length;
      wp = p.route[p.wi];
      dx = wp[0] - p.x; dz = wp[1] - p.z;
      dist = Math.hypot(dx, dz);
    }
    const sp = p.speed * dt;
    if (dist > 0.001) { p.x += (dx / dist) * sp; p.z += (dz / dist) * sp; }
    p.heading = Math.atan2(dx, dz);
    const ph = t * p.walkFreq + p.phase;
    const swing = Math.sin(ph) * 0.5, bob = Math.abs(Math.sin(ph)) * 0.06;
    const ry = p.heading, sc = 1 + bob;
    setInst(bodyM, i, p.x, 0.5, p.z, ry, sc, sc, sc);
    setInst(headM, i, p.x, 1.5, p.z, ry, 1, 1, 1);
    legL.setMatrixAt(i, legMatrix(_legM, p.x, p.z, ry, 0.115, swing, 1));
    legR.setMatrixAt(i, legMatrix(_legM, p.x, p.z, ry, -0.115, -swing, 1));
  }
  legL.instanceMatrix.needsUpdate = legR.instanceMatrix.needsUpdate = true;
  bodyM.instanceMatrix.needsUpdate = headM.instanceMatrix.needsUpdate = true;
}

/* ---------------- birds ---------------- */
const birds = [];
{
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x2c2c30, roughness: 0.8 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x33343a, roughness: 0.8 });
  for (let i = 0; i < 9; i++) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.18, 0.18), bodyMat);
    const lw = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.03, 0.85), wingMat); lw.position.z = 0.42;
    const rw = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.03, 0.85), wingMat); rw.position.z = -0.42;
    g.add(body, lw, rw);
    scene.add(g);
    birds.push({
      g, lw, rw,
      cx: (R() - 0.5) * 160, cz: (R() - 0.5) * 160,
      radius: 90 + R() * 140, height: 45 + R() * 55, angle: R() * Math.PI * 2,
      dir: R() < 0.5 ? 1 : -1, flapFreq: 4 + R() * 3, flapPhase: R() * 10
    });
  }
}
function updateBirds(t, dt) {
  for (const b of birds) {
    b.angle += dt * 0.12 * b.dir;
    const x = b.cx + Math.cos(b.angle) * b.radius;
    const z = b.cz + Math.sin(b.angle) * b.radius;
    const y = b.height + Math.sin(b.angle * 3) * 6;
    b.g.position.set(x, y, z);
    b.g.rotation.y = b.angle + (b.dir > 0 ? -Math.PI / 2 : Math.PI / 2);
    const flap = Math.sin(t * b.flapFreq + b.flapPhase) * 0.55;
    b.lw.rotation.x = flap; b.rw.rotation.x = -flap;
  }
}

/* ---------------- clouds ---------------- */
const clouds = [];
{
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.88, depthWrite: false });
  for (let i = 0; i < 7; i++) {
    const parts = [];
    const n = 3 + Math.floor(R() * 3);
    for (let k = 0; k < n; k++) {
      const s = new THREE.SphereGeometry(1, 8, 6);
      s.scale(8 + R() * 8, 2.2 + R() * 1.4, 5 + R() * 5);
      s.translate(R() * 14 - 7, R() * 1.6, R() * 8 - 4);
      parts.push(s);
    }
    const geo = mergeGeometries(parts);
    const m = new THREE.Mesh(geo, cloudMat);
    m.position.set((R() - 0.5) * 1200, 130 + R() * 90, (R() - 0.5) * 1200);
    m.rotation.y = R() * Math.PI;
    scene.add(m);
    clouds.push({ m, speed: 1.5 + R() * 2.5, baseX: m.position.x });
  }
}
function updateClouds(dt) {
  for (const c of clouds) {
    c.m.position.x += c.speed * dt;
    if (c.m.position.x > c.baseX + 700) c.m.position.x = c.baseX - 700;
  }
}

/* ---------------- chimney smoke ---------------- */
const N_SMOKE = 260;
const smokeData = new Float32Array(N_SMOKE * 3);
const smokeAlpha = new Float32Array(N_SMOKE);
const smokeSize = new Float32Array(N_SMOKE);
const smokeParts = [];
const emitters = chimneySpots.filter(() => R() < 0.5).slice(0, 14);
if (emitters.length < 1) emitters.push([30, 8, 30]);
for (let i = 0; i < N_SMOKE; i++) spawnSmoke(i, true);
function spawnSmoke(i, init) {
  const e = emitters[Math.floor(R() * emitters.length)];
  const p = { ex: e[0], ez: e[2], ey: e[1],
    x: e[0] + (R() - 0.5) * 0.6, y: e[1], z: e[2] + (R() - 0.5) * 0.6,
    vx: (R() - 0.5) * 0.5, vy: 1.0 + R() * 0.9, vz: (R() - 0.5) * 0.5,
    life: init ? R() * 5 : 4.5, maxLife: 4.5 + R() * 2.5, size: 5 + R() * 6 };
  smokeParts[i] = p;
}
const smokeGeo = new THREE.BufferGeometry();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokeData, 3));
smokeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(smokeAlpha, 1));
smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(smokeSize, 1));
const smokeMat2 = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: SMOKE_TEX }, uBright: { value: 0.8 } },
  vertexShader: `
    attribute float aAlpha; attribute float aSize;
    varying float vA;
    void main(){
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (260.0 / max(1.0, -mv.z));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uTex; uniform float uBright;
    varying float vA;
    void main(){
      vec4 c = texture2D(uTex, gl_PointCoord);
      float a = c.a * vA;
      if (a < 0.012) discard;
      gl_FragColor = vec4(vec3(0.6, 0.58, 0.55) * uBright, a);
    }`,
  transparent: true, depthWrite: false
});
const smokePoints = new THREE.Points(smokeGeo, smokeMat2);
scene.add(smokePoints);
function updateSmoke(dt) {
  for (let i = 0; i < N_SMOKE; i++) {
    const p = smokeParts[i];
    p.life -= dt;
    if (p.life <= 0) spawnSmoke(i, false);
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vx *= (1 - 0.25 * dt); p.vz *= (1 - 0.25 * dt);
    smokeData[i * 3] = p.x; smokeData[i * 3 + 1] = p.y; smokeData[i * 3 + 2] = p.z;
    const t = 1 - p.life / p.maxLife;
    smokeAlpha[i] = Math.min(1, t * 3) * (1 - Math.pow(t, 2));
    smokeSize[i] = p.size * (0.6 + t);
  }
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.aAlpha.needsUpdate = true;
  smokeGeo.attributes.aSize.needsUpdate = true;
}

/* =====================================================================
   DAY / NIGHT CYCLE
   ===================================================================== */
const skyCol = new THREE.Color(), horCol = new THREE.Color(), warmCol = new THREE.Color(1, 0.42, 0.2), tmpCol = new THREE.Color();
const cSkyDay = new THREE.Color(0x3d7fd9), cSkyNight = new THREE.Color(0x070a14);
const cHorDay = new THREE.Color(0xbcd6ef), cHorNight = new THREE.Color(0x0c1122);
const sunColor = new THREE.Color();
let dayTime = 8.5 / 24;       // start mid-morning
let speedMult = 1;
const DAY_SECONDS = 170;

function smoothstep(x, lo, hi) {
  let t = Math.max(0, Math.min(1, (x - lo) / (hi - lo)));
  return t * t * (3 - 2 * t);
}
const _sunDir = new THREE.Vector3();

function updateDayNight(dt) {
  dayTime = (dayTime + dt * speedMult / DAY_SECONDS) % 1;
  const ang = (dayTime - 0.25) * Math.PI * 2;
  const elev = Math.sin(ang);
  const az = ang + Math.PI;
  const dayF = smoothstep(elev, -0.07, 0.3);
  const nightF = 1 - dayF;
  const dusk = Math.exp(-Math.pow(elev / 0.14, 2));

  skyCol.copy(cSkyNight).lerp(cSkyDay, dayF);
  horCol.copy(cHorNight).lerp(cHorDay, dayF);
  skyCol.lerp(warmCol, dusk * 0.32 * Math.max(0, 1 - Math.abs(elev) * 1.6));
  horCol.lerp(warmCol, dusk * 0.5 * Math.max(0, 1 - Math.abs(elev) * 1.6));

  const e = Math.max(-0.95, Math.min(0.95, elev)) * (Math.PI / 2) * 0.95;
  const ce = Math.cos(e);
  _sunDir.set(Math.cos(az) * ce, Math.sin(e), Math.sin(az) * ce);
  _sunDir.multiplyScalar(700);

  sunLight.position.copy(_sunDir);
  sunLight.target.position.set(0, 0, 0);
  sunColor.setRGB(1, 1 - dusk * 0.45, 1 - dusk * 0.7).lerp(tmpCol.setRGB(0.5, 0.55, 0.9), nightF * 0.85);
  sunLight.color.copy(sunColor);
  sunLight.intensity = dayF * 1.55;
  moonLight.position.copy(_sunDir).multiplyScalar(-1);
  moonLight.intensity = nightF * 0.5;

  hemi.intensity = 0.16 + dayF * 0.85;
  hemi.color.copy(tmpCol.setHex(0xbfd9ff)).lerp(tmpCol.setHex(0x24344f), nightF);
  hemi.groundColor.copy(tmpCol.setHex(0x3a4a32)).lerp(tmpCol.setHex(0x0b1020), nightF);
  scene.fog.color.copy(horCol);

  skyMat.uniforms.topColor.value.copy(skyCol);
  skyMat.uniforms.horizonColor.value.copy(horCol);
  skyMat.uniforms.bottomColor.value.copy(horCol).multiplyScalar(0.92);

  stars.material.opacity = nightF * (1 - dayF * 0.6);
  sunSprite.position.copy(_sunDir);
  sunSprite.visible = elev > -0.045;
  sunSprite.material.opacity = dayF;
  moonSprite.position.copy(_sunDir).multiplyScalar(-1);
  moonSprite.visible = elev <= -0.045;
  moonSprite.material.opacity = nightF;

  for (const wm of wallMeshes) if (wm) wm.material.emissiveIntensity = nightF * 1.9;
  scene.userData.rose && (scene.userData.rose.material.emissiveIntensity = nightF * 2.2);
  scene.userData.clock && (scene.userData.clock.material.emissiveIntensity = nightF * 1.2);

  for (const tl of torchLights) {
    const flick = 0.85 + Math.sin(performance.now() / 90 + tl.phase) * 0.08 + Math.sin(performance.now() / 47 + tl.phase * 2) * 0.05;
    tl.light.intensity = nightF * 26 * flick;
  }

  smokeMat2.uniforms.uBright.value = 0.35 + dayF * 0.5;

  for (const c of clouds) c.m.material.opacity = 0.25 + dayF * 0.62;

  updateClockHUD(dayTime, dayF);
}

/* ---------------- HUD ---------------- */
const clockT = document.getElementById('clockT'), clockD = document.getElementById('clockD');
const dayNames = ['midnight', 'late night', 'early morning', 'morning', 'morning', 'midday', 'afternoon', 'evening', 'dusk', 'night', 'late night', 'night'];
function updateClockHUD(t, dayF) {
  const h = (t * 24) % 24;
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  clockT.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  const ic = dayF > 0.55 ? '☀' : '☾';
  clockD.textContent = `${ic} ${dayNames[Math.min(dayNames.length - 1, Math.floor((h / 24) * dayNames.length))]}`;
}
document.getElementById('bPause').addEventListener('click', function () {
  speedMult = speedMult === 0 ? 1 : 0;
  this.textContent = speedMult === 0 ? '▶' : '⏸';
});
document.querySelectorAll('#clock button[data-sp]').forEach(b => b.addEventListener('click', () => {
  speedMult = +b.dataset.sp;
  document.querySelectorAll('#clock button[data-sp]').forEach(x => x.classList.toggle('active', x === b));
  document.getElementById('bPause').textContent = '⏸';
}));

/* ---------------- resize / loop ---------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  updateDayNight(dt);
  updatePeople(elapsed, dt);
  updateBirds(elapsed, dt);
  updateClouds(dt);
  updateSmoke(dt);
  for (const f of flags) f.banner.rotation.z = Math.sin(elapsed * 2.2 + f.phase) * 0.2;
  controls.update();
  renderer.render(scene, camera);
}

/* pre-fill people + smoke so nothing starts at origin */
for (let i = 0; i < N_PEOPLE; i++) {
  const p = people[i];
  p.x = p.route[p.wi][0]; p.z = p.route[p.wi][1];
  setInst(bodyM, i, p.x, 0.9, p.z, 0, 1, 1, 1);
  setInst(headM, i, p.x, 1.5, p.z, 0, 1, 1, 1);
  legL.setMatrixAt(i, legMatrix(_tA, p.x, p.z, 0, 0.115, 0, 1));
  legR.setMatrixAt(i, legMatrix(_tA, p.x, p.z, 0, -0.115, 0, 1));
}
legL.instanceMatrix.needsUpdate = legR.instanceMatrix.needsUpdate = true;
bodyM.instanceMatrix.needsUpdate = headM.instanceMatrix.needsUpdate = true;

animate();

} catch (err) {
  const box = document.getElementById('err');
  box.style.display = 'block';
  box.innerHTML = `<b>Could not start the city.</b><br>${err.message}<br><br>This demo needs WebGL and a network connection to load Three.js from a CDN.`;
  console.error(err);
}
</script>
