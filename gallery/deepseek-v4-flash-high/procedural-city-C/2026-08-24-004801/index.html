<style>

                background:linear-gradient(90deg, transparent, rgba(140,170,255,.6), transparent); }

    mix-blend-mode:multiply; }

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
 * PROCEDURAL CITY · NIGHT
 * One file, no assets. A living city generated at load time:
 *   - street grid + diagonal avenue + central plaza
 *   - ~500 buildings rendered in a single InstancedMesh with a
 *     procedural "living window" shader (breathing, flicker, tv-flicker)
 *   - hero tower with two sweeping searchlights, neon strips, beacon
 *   - traffic (instanced cars with head/tail glows) on grid + avenue + ring
 *   - street lamps with warm pools, string lights, plaza fountain,
 *     wandering crowd, drifting haze, clouds, stars, moon, airliners
 *   - bloom + grain + vignette, cinematic camera with drag/zoom override
 * ===================================================================== */

const REDUCED = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------------------------------------------------------------- rng
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260824);
const rand = (a,b)=> a + (b-a)*rng();

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.setClearColor(0x04060c, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.5, 3200);

const FOG_COLOR = new THREE.Color(0x0b0f24);
const FOG_DENSITY = 0.0021;
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

// soft radial map factory
function radialMap(size, stops){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  for (const [o,col] of stops) grd.addColorStop(o,col);
  g.fillStyle = grd; g.fillRect(0,0,size,size);
  const t = new THREE.CanvasTexture(c);
  return t;
}
const T_SOFT = radialMap(128, [[0,'rgba(255,255,255,1)'],[0.35,'rgba(255,255,255,.6)'],[1,'rgba(255,255,255,0)']]);
const T_STAR = radialMap(64, [[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,255,255,.85)'],[1,'rgba(255,255,255,0)']]);
const T_MOON = radialMap(256,[[0,'rgba(240,236,214,1)'],[0.18,'rgba(240,236,214,.95)'],[0.5,'rgba(200,205,230,.18)'],[1,'rgba(255,255,255,0)']]);
const T_BEAM = (()=>{ const c=document.createElement('canvas'); c.width=64; c.height=256;
  const g=c.getContext('2d');
  for(let y=0;y<256;y++){ const a = Math.pow(1 - Math.abs(y-128)/128, 2)*0.9;
    g.fillStyle=`rgba(255,255,255,${a.toFixed(3)})`; g.fillRect(0,y,64,1);} // vertical soft bands
  for(let x=0;x<64;x+=3){ const a = Math.sin(x)*0.12+0.12; g.fillStyle=`rgba(0,0,0,${a})`; g.fillRect(x,0,1,256); }
  return new THREE.CanvasTexture(c); })();

const kap = renderer.capabilities.getMaxAnisotropy();

// ---------------------------------------------------------------- sky
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms: { uTop:{value:new THREE.Color(0x04060f)}, uMid:{value:new THREE.Color(0x101a38)},
              uBot:{value:new THREE.Color(0x1b223f)} },
  vertexShader:`varying vec3 vDir; void main(){ vDir = position; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`
    varying vec3 vDir; uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot;
    void main(){
      float h = clamp(normalize(vDir).y, 0.0, 1.0);
      vec3 c = mix(uBot, uMid, smoothstep(0.0, 0.28, h));
      c = mix(c, uTop, smoothstep(0.28, 0.8, h));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 24, 16), skyMat);
sky.renderOrder = -10; scene.add(sky);

// stars
function makeStars(count, size, color, yLow, yHigh){
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, el = Math.asin(Math.random());
    const r = 1300;
    const y = Math.sin(el)*r;
    if (y < 0) { continue; }
    const rr = Math.cos(el)*r;
    pos[i*3] = Math.cos(a)*rr; pos[i*3+1] = y; pos[i*3+2] = Math.sin(a)*rr;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({ size, map:T_STAR, transparent:true, opacity:.85,
      color, sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending });
  return new THREE.Points(g,m);
}
const stars1 = makeStars(700, 10, 0xd9def5, 0.08, 0.98);
const stars2 = makeStars(350, 6, 0xaab6e8, 0.1, 0.95);
scene.add(stars1, stars2);

// moon
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map:T_MOON, transparent:true, opacity:.95, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, color:0xf0ecd6 }));
moonGlow.scale.setScalar(260); moonGlow.position.set(720, 430, -600); scene.add(moonGlow);
const moonCore = new THREE.Mesh(new THREE.CircleGeometry(26, 32),
  new THREE.MeshBasicMaterial({ color:0xf5efd8, fog:false }));
moonCore.position.copy(moonGlow.position).add(new THREE.Vector3(0,0,6)); scene.add(moonCore);

// clouds
const clouds = [];
for(let i=0;i<9;i++){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:T_SOFT, transparent:true, opacity:0.16,
    color:0x2c3a66, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, depthTest:true }));
  const a = Math.random()*Math.PI*2, rr = 620 + Math.random()*420;
  s.position.set(Math.cos(a)*rr, 240 + Math.random()*160, Math.sin(a)*rr);
  const sc = 240 + Math.random()*360;
  s.scale.set(sc, sc*0.34, 1);
  s.userData.spd = 0.4 + Math.random()*0.9;
  scene.add(s); clouds.push(s);
}
// horizon glow bleed (distant city light on the horizon ring)
const horizonGlows = [];
for(let i=0;i<6;i++){
  const a = (i/6)*Math.PI*2 + 0.4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:T_SOFT, transparent:true, opacity:0.05,
    color:0x5266b8, depthWrite:false, blending:THREE.AdditiveBlending, fog:false }));
  s.position.set(Math.cos(a)*900, 14, Math.sin(a)*900);
  s.scale.set(700, 60, 1);
  scene.add(s); horizonGlows.push(s);
}

// ---------------------------------------------------------------- ground texture from real street map
const GROUND = 430;                 // texture covers [-430,430]
const TEX = 2048;
function px(v){ return (v + GROUND) / (2*GROUND) * TEX; }

// ---- city layout -------------------------------------------------
const CITY = 350;
const vStreets = []; // vertical street x positions
const hStreets = []; // horizontal street z positions
{ let x = -CITY;
  while (x < CITY){ vStreets.push(x); const gap = 46 + rng()*26 + (Math.abs(x)<150 ? -6 : 0); x += Math.max(30, gap); }
  let z = -CITY;
  while (z < CITY){ hStreets.push(z); const gap = 46 + rng()*26 + (Math.abs(z)<150 ? -6 : 0); z += Math.max(30, gap); }
}
// avenue (gentle diagonal, passes just north of the plaza)
const AV = { x1:-CITY, z1:-80-CITY*0.2, x2:CITY, z2:80+CITY*0.2 };

function drawGround(){
  const c = document.createElement('canvas'); c.width=c.height=TEX;
  const g = c.getContext('2d');
  g.fillStyle = '#0a0e19'; g.fillRect(0,0,TEX,TEX);

  // sidewalk blocks first
  g.fillStyle = '#101522';
  for(let i=0;i<vStreets.length-1;i++){
    for(let j=0;j<hStreets.length-1;j++){
      const x0=px(vStreets[i]+8), x1=px(vStreets[i+1]-8), z0=px(hStreets[j]+8), z1=px(hStreets[j+1]-8);
      g.fillRect(x0,z0,x1-x0,z1-z0);
    }
  }
  // roads
  const road = (x0,z0,x1,z1,w,fill)=>{ g.strokeStyle=fill; g.lineWidth=w; g.lineCap='square'; g.beginPath(); g.moveTo(x0,z0); g.lineTo(x1,z1); g.stroke(); };
  for(const x of vStreets){ road(px(x),0,px(x),TEX,px(15),'#0d1220'); }
  for(const z of hStreets){ road(0,px(z),TEX,px(z),px(15),'#0d1220'); }
  // avenue
  g.save(); g.translate(px((AV.x1+AV.x2)/2), px((AV.z1+AV.z2)/2));
  g.rotate(Math.atan2(AV.z2-AV.z1, AV.x2-AV.x1));
  g.strokeStyle='#0c111d'; g.lineWidth=px(24); g.beginPath(); g.moveTo(-TEX/2,0); g.lineTo(TEX/2,0); g.stroke();
  // avenue median dash
  g.strokeStyle='rgba(160,180,220,.28)'; g.lineWidth=px(0.7); g.setLineDash([px(4),px(4)]);
  g.beginPath(); g.moveTo(-TEX/2,0); g.lineTo(TEX/2,0); g.stroke(); g.setLineDash([]); g.restore();

  // lane dots on vertical/horizontal streets
  g.fillStyle = 'rgba(150,170,210,.20)';
  for(const x of vStreets){ for(let z=-CITY;z<CITY;z+=8){ g.fillRect(px(x)-px(.6), px(z)-px(.6), px(1.2), px(1.2)); } }
  for(const z of hStreets){ for(let x=-CITY;x<CITY;x+=8){ g.fillRect(px(x)-px(.6), px(z)-px(.6), px(1.2), px(1.2)); } }
  // crosswalks at intersections
  g.fillStyle = 'rgba(200,215,240,.34)';
  for(const x of vStreets){ for(const z of hStreets){
    if (Math.abs(x)>240 || Math.abs(z)>240) continue;
    for(let i=-5;i<=5;i++){ g.fillRect(px(x+ (i*0.7) - 0.28), px(z-8), px(.42), px(16)); }
    for(let i=-5;i<=5;i++){ g.fillRect(px(x-8), px(z + (i*0.7) - 0.28), px(16), px(.42)); }
  }}
  // plaza
  const pcx = px(0), pcz = px(0), pr = px(58);
  g.fillStyle = '#0c111e'; g.beginPath(); g.arc(pcx,pcz,pr,0,Math.PI*2); g.fill();
  g.strokeStyle = '#1a2336'; g.lineWidth=px(1.4); g.beginPath(); g.arc(pcx,pcz,pr,0,Math.PI*2); g.stroke();
  g.strokeStyle = 'rgba(150,170,215,.10)'; g.lineWidth=px(0.4); g.beginPath(); g.arc(pcx,pcz,px(40),0,Math.PI*2); g.stroke();

  const t = new THREE.CanvasTexture(c);
  t.anisotropy = kap; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const groundTex = drawGround();

// simple environment cube (wet-street sheen)
function makeEnvCube(){
  const arr=[];
  for(let i=0;i<6;i++){
    const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
    const grd=g.createLinearGradient(0,0,0,64);
    grd.addColorStop(0,'#05070f'); grd.addColorStop(0.55,'#0c1224'); grd.addColorStop(0.9,'#241f3d');
    g.fillStyle=grd; g.fillRect(0,0,64,64);
    for(let k=0;k<50;k++){ g.fillStyle=`rgba(255,190,120,${(Math.random()*0.45).toFixed(2)})`;
      g.fillRect(Math.random()*64, 42+Math.random()*20, 1.3, 1.3); }
    arr.push(c);
  }
  const t=new THREE.CubeTexture(arr); t.needsUpdate=true; return t;
}
const envCube = makeEnvCube();

const groundMat = new THREE.MeshStandardMaterial({ map:groundTex, roughness:0.42, metalness:0.28,
  envMap:envCube, envMapIntensity:0.5, color:0xffffff });
groundMat.envMap = envCube;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND*2, GROUND*2), groundMat);
ground.rotation.x = -Math.PI/2; scene.add(ground);

// outer backing plane (keeps horizon solid)
const outerMat = new THREE.MeshStandardMaterial({ color:0x0a0e1c, roughness:1, metalness:0 });
const outer = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600, 1, 1), outerMat);
outer.rotation.x = -Math.PI/2; outer.position.y = -0.06; scene.add(outer);

// ---------------------------------------------------------------- building shader
const BV = `
attribute vec3 aSize;
attribute vec3 aSeed;
attribute vec3 aTint;
attribute vec3 aWarm;
attribute vec3 aCool;
attribute float aElev;
uniform float uTime;
varying vec3 vLocal;
varying vec3 vWorldPos;
varying vec3 vWorldNormal;
varying vec3 vTint; varying vec3 vWarm; varying vec3 vCool;
varying vec3 vSeed; varying float vElev;
void main(){
  vec3 localPos = position * aSize;
  vec4 wp = instanceMatrix * vec4(localPos, 1.0);
  vLocal = localPos;
  vWorldPos = wp.xyz;
  vWorldNormal = normalize(mat3(instanceMatrix) * normal);
  vTint = aTint; vWarm = aWarm; vCool = aCool; vSeed = aSeed; vElev = aElev;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

const BF = `
precision highp float;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uFogColor;
uniform float uFogDensity;
uniform float uCells;
uniform float uEmissive;
varying vec3 vLocal; varying vec3 vWorldPos; varying vec3 vWorldNormal;
varying vec3 vTint; varying vec3 vWarm; varying vec3 vCool;
varying vec3 vSeed; varying float vElev;
float hash12(vec2 p){ p = fract(p*vec2(123.34,345.45)); p += dot(p, p+34.23); return fract(p.x*p.y); }

void main(){
  vec3 N = normalize(vWorldNormal);
  vec3 base = vTint * 0.60;
  vec3 emit = vec3(0.0);

  if (abs(N.y) < 0.45){
    vec3 hsize = abs(vLocal);
    vec2 lp;
    if (abs(N.x) > 0.5) lp = vec2(vLocal.z + hsize.z, vLocal.y + hsize.y);
    else                lp = vec2(vLocal.x + hsize.x, vLocal.y + hsize.y);
    vec2 cellId = floor(lp * uCells);
    vec2 wf = fract(lp * uCells) - 0.5;
    float pane = step(abs(wf.x), 0.27) * step(abs(wf.y), 0.34);
    float row = cellId.y;
    vec2 s2 = cellId + vSeed.xy;
    float h1 = hash12(s2);
    float h2 = hash12(s2.yx + vSeed.zz);
    float h3 = hash12(s2 * 2.17 + 7.7);
    float prob = 0.33 + 0.62 * step(row, 1.0) * 0.34;
    float litW = step(prob, h1);
    vec3 winCol = mix(vCool, vWarm, step(0.44, h2));
    float breath = 0.74 + 0.26 * sin(uTime * (1.3 + 3.2*h2) + h1*40.0);
    float tv = step(0.985, h3) * step(0.5, fract(uTime*6.0 + h2*30.0));
    float glow = clamp(litW * breath + tv, 0.0, 1.0);
    float hFrac = clamp(vLocal.y / max(hsize.y, 0.001), 0.0, 1.0);
    base = mix(base*0.82, base, smoothstep(0.0, 0.16, hFrac));
    emit = winCol * pane * glow * uEmissive * vElev;
    float accent = step(0.9985, h2);
    emit += mix(vec3(0.0), vec3(1.05,0.98,0.82)*uEmissive*3.4, pane*accent*breath);
  } else {
    base = vTint * 0.5;
    float rA = fract(dot(vSeed, vec3(7.1, 3.3, 1.7)));
    if (rA > 0.93) emit = vec3(0.55,0.72,1.0) * (0.3 + 0.45*sin(uTime*2.0 + vSeed.x*20.0));
  }

  vec3 col = base + emit;
  float d = distance(vWorldPos, uCamPos);
  float f = 1.0 - exp(-uFogDensity*uFogDensity*d*d);
  col = mix(col, uFogColor, clamp(f, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}
`;

// shared uniform objects (one update propagates everywhere)
const U = {
  time:    { value: 0 },
  camPos:  { value: new THREE.Vector3(0,120,0) },
  fogCol:  { value: FOG_COLOR.clone() },
  fogDen:  { value: FOG_DENSITY },
  cells:   { value: 0.95 },
  emissive:{ value: 1.7 },
};

const PALETTES = [
  { tint:0x10151f, warm:[1.0,0.56,0.24], cool:[0.44,0.64,1.0], elev:1.0 },
  { tint:0x171621, warm:[1.0,0.70,0.34], cool:[0.36,0.55,0.85], elev:1.0 },
  { tint:0x0c111c, warm:[0.85,0.55,0.5 ], cool:[0.50,0.72,1.0], elev:1.15 },
  { tint:0x1c1a26, warm:[1.0,0.48,0.20], cool:[0.30,0.45,0.80], elev:0.95 },
  { tint:0x0e1420, warm:[0.95,0.62,0.30], cool:[0.60,0.80,1.0], elev:1.35 },
];

// ---------------------------------------------------------------- generate buildings
const bData = [];          // all boxes (instanced)
const roofUnits = [];      // {x,y,z, sx,sy,sz, rot, kind}
const tallTowers = [];     // for crowns

const PLAZA_R = 58;
function inPlaza(x,z,m){ return (x*x + z*z) < (PLAZA_R + m)*(PLAZA_R + m); }
const HERO = { x:0, z:-118 };   // hero tower placement (north of plaza)
function nearHero(x,z,m){ const dx=x-HERO.x, dz=z-HERO.z; return (dx*dx+dz*dz) < m*m; }

function makeCity(){
  const blocks = [];
  for(let i=0;i<vStreets.length-1;i++){
    for(let j=0;j<hStreets.length-1;j++){
      const x0 = vStreets[i]+9, x1 = vStreets[i+1]-9;
      const z0 = hStreets[j]+9, z1 = hStreets[j+1]-9;
      const w = x1-x0, d = z1-z0;
      if (w < 12 || d < 12) continue;
      const cx=(x0+x1)/2, cz=(z0+z1)/2;
      if (cx*cx+cz*cz > 380*380) continue;          // stay inside lit region
      if (inPlaza(cx,cz,14)) continue;
      if (nearHero(cx,cz,30)) continue;
      blocks.push({x0,x1,z0,z1});
    }
  }
  for(const b of blocks){
    const w = b.x1-b.x0, d = b.z1-b.z0;
    let parts = 1;
    const rpart = rng();
    if (rpart < 0.42) parts = 1;
    else if (rpart < 0.78) parts = 2;
    else parts = 3;
    const alongX = w >= d * 1.25;
    const pw = alongX ? 0 : 1;
    const base = alongX ? b.x0+4 : b.z0+4;
    const span = alongX ? w-8 : d-8;
    const cell = span/parts;
    for(let k=0;k<parts;k++){
      const c0 = base + cell*k + 1.5, c1 = base + cell*(k+1) - 1.5;
      const sx = alongX ? c1-c0 : w-8;
      const sz = alongX ? d-8 : c1-c0;
      if (sx<6||sz<6) continue;
      const x = alongX ? (c0+c1)/2 : (b.x0+b.x1)/2;
      const z = alongX ? (b.z0+b.z1)/2 : (c0+c1)/2;
      if (inPlaza(x,z,8)) continue;
      if (nearHero(x,z,24)) continue;
      spawnBuild(x,z,sx,sz);
    }
  }
}

function spawnBuild(x, z, sx, sz){
  const dist = Math.sqrt(x*x+z*z);
  let sy;
  const roll = rng();
  if (dist < 150 && roll < 0.20){ sy = 100 + Math.pow(rng(),2.1)*150; }      // downtown towers
  else if (dist < 260 && roll < 0.16){ sy = 60 + Math.pow(rng(),2.0)*80; }
  else if (roll < 0.24){ sy = 34 + rng()*40; }
  else { sy = 10 + Math.pow(rng(),1.6)*34; }
  sy = Math.min(sy, 250);
  const rot = (rng()<0.07) ? (rng()<0.5 ? Math.PI/4 : Math.PI/6) : 0;
  const pal = PALETTES[Math.floor(rng()*PALETTES.length)];
  const elev = dist<180 ? pal.elev + 0.35 : pal.elev;
  bData.push({ x, z, sx, sy, sz, rot, pal, elev: Math.min(elev, 2.0) });

  // rooftop details (a portion)
  const rr = rng();
  const topY = sy;
  if (rr < 0.22){
    roofUnits.push({ x: x + (sx*0.18)*(rng()-0.5), y: topY, z: z + (sz*0.18)*(rng()-0.5),
      sx: Math.max(2,sx*0.16), sy: 2 + rng()*2.5, sz: Math.max(2,sz*0.16), rot: rot, kind:0 });
  } else if (rr < 0.32 && sy > 26){
    roofUnits.push({ x: x, y: topY, z: z, sx: 0.8, sy: 5 + rng()*10, sz: 0.8, rot: rot, kind:1 });
  }
  if (sy > 100) tallTowers.push({ x, z, y: topY, s: Math.max(sx,sz) });
}

function buildInstancedCity(){

    uniforms:{ uTime:U.time, uCamPos:U.camPos, uFogColor:U.fogCol, uFogDensity:U.fogDen, uCells:U.cells, uEmissive:U.emissive } });
  const mesh = new THREE.InstancedMesh(geo, mat, n);

  const aSize = new THREE.InstancedBufferAttribute(new Float32Array(n*3), 3);
  const aSeed = new THREE.InstancedBufferAttribute(new Float32Array(n*3), 3);
  const aTint = new THREE.InstancedBufferAttribute(new Float32Array(n*3), 3);
  const aWarm = new THREE.InstancedBufferAttribute(new Float32Array(n*3), 3);
  const aCool = new THREE.InstancedBufferAttribute(new Float32Array(n*3), 3);
  const aElev = new THREE.InstancedBufferAttribute(new Float32Array(n), 1);

  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3();
  const ONE = new THREE.Vector3(1,1,1), YAX = new THREE.Vector3(0,1,0);
  const tCol = new THREE.Color();
  for(let i=0;i<n;i++){
    const b = bData[i];
    V.set(b.x, 0, b.z);
    Q.setFromAxisAngle(YAX, b.rot);
    M.compose(V, Q, ONE);
    mesh.setMatrixAt(i, M);
    aSize.setXYZ(i, b.sx, b.sy, b.sz);
    aSeed.setXYZ(i, b.x*13.37+b.z, b.z*7.73+b.x+b.sx, i*1.618+5.13);
    tCol.setHex(b.pal.tint);
    aTint.setXYZ(i, tCol.r, tCol.g, tCol.b);
    aWarm.setXYZ(i, b.pal.warm[0], b.pal.warm[1], b.pal.warm[2]);
    aCool.setXYZ(i, b.pal.cool[0], b.pal.cool[1], b.pal.cool[2]);
    aElev.setX(i, b.elev);
  }
  geo.setAttribute('aSize', aSize);
  geo.setAttribute('aSeed', aSeed);
  geo.setAttribute('aTint', aTint);
  geo.setAttribute('aWarm', aWarm);
  geo.setAttribute('aCool', aCool);
  geo.setAttribute('aElev', aElev);
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  scene.add(mesh);

}

function makeSignTexture(str, hex){
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  const g = c.getContext('2d');
  const hs = (typeof hex === 'number' ? hex.toString(16).padStart(6,'0') : hex.slice(1));
  const r = parseInt(hs.slice(0,2),16), gg=parseInt(hs.slice(2,4),16), bb=parseInt(hs.slice(4,6),16);
  const grad = g.createLinearGradient(0,0,512,0);
  grad.addColorStop(0,`rgba(${r},${gg},${bb},.10)`); grad.addColorStop(0.5,`rgba(${r},${gg},${bb},.95)`); grad.addColorStop(1,`rgba(${r},${gg},${bb},.10)`);
  g.fillStyle=grad; g.fillRect(0,24,512,80);
  g.shadowColor=`rgb(${r},${gg},${bb})`; g.shadowBlur=26;
  g.fillStyle=`rgb(${r},${gg},${bb})`;

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

  const mat = new THREE.MeshStandardMaterial({ color:0x232733, roughness:.85, metalness:.05,
    emissive:0x05070c, emissiveIntensity:0.8 });
  const mesh = new THREE.InstancedMesh(geo, mat, N);
  const people = [];
  for(let i=0;i<N;i++){
    const a = Math.random()*Math.PI*2;
    const r = 10 + Math.random()*(PLAZA_R-16);
    const spd = 0.4 + Math.random()*0.9;
    const dir = Math.random()<0.5?1:-1;
    people.push({ a, r, spd, dir, rot:Math.random()*6.28, ph:Math.random()*10 });
    const c = Math.random();
    mesh.setColorAt(i, c<0.4 ? new THREE.Color(0x3d4658) : c<0.7 ? new THREE.Color(0x50423d) : new THREE.Color(0x37415a));
  }
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
  return { mesh, people };
})();

// ---------------------------------------------------------------- traffic
const carColors = [0x242a36, 0x323a4a, 0x1b1e26, 0x3a2f2e, 0x303644, 0x2a3a34];
const traffic = [];

function makePaths(){
  const paths = [];
  // grid lines (ping-pong)
  for(const x of vStreets){ paths.push({ type:'line', p0:{x, z:-CITY+30}, p1:{x, z:CITY-30} }); }
  for(const z of hStreets){ paths.push({ type:'line', p0:{x:-CITY+30, z}, p1:{x:CITY-30, z} }); }
  // avenue
  paths.push({ type:'line', p0:{x:AV.x1, z:AV.z1}, p1:{x:AV.x2, z:AV.z2} });
  // plaza ring
  paths.push({ type:'ring', cx:0, cz:0, r:PLAZA_R-5 });
  return paths;
}
function spawnTraffic(){
  const paths = makePaths();
  for(let i=0;i<52;i++){
    const p = paths[Math.floor(rng()*paths.length)];
    const car = {
      path:p, t:rng(), dir: rng()<0.5?1:-1,
      lane: (rng()-0.5)*5.5,
      speed: p.type==='ring' ? 0.22 : (10 + rng()*8),
      acc: 0, color: carColors[Math.floor(rng()*carColors.length)],
      isRing: p.type==='ring',
      ringA: Math.random()*Math.PI*2,
    };
    traffic.push(car);
  }
  // a couple of parked cars near plaza edge
  for(let k=0;k<4;k++){
    const a = Math.random()*Math.PI*2;
    traffic.push({ parked:true, path:null, color:carColors[Math.floor(rng()*carColors.length)],
      px: Math.cos(a)*(PLAZA_R+9), pz: Math.sin(a)*(PLAZA_R+9), pyaw: a + Math.PI/2 });
  }
}
spawnTraffic();

// car part meshes
function buildCarParts(){
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3(1,1,1);
  const yawAxis = new THREE.Vector3(0,1,0);
  function buildPart(geo, mat, n){
    const m = new THREE.InstancedMesh(geo, mat, n);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(m);
    return m;
  }
  const nCars = traffic.length;

  const bodyGeo = new THREE.BoxGeometry(1.8,0.78,4.2); bodyGeo.translate(0,0.58,0);
  const bodyMat = new THREE.MeshStandardMaterial({ metalness:.75, roughness:.32, envMap:envCube, envMapIntensity:.9 });
  const body = buildPart(bodyGeo, bodyMat, nCars);

  const cabGeo = new THREE.BoxGeometry(1.52,0.62,2.3); cabGeo.translate(0,1.18,0);
  const cabMat = new THREE.MeshStandardMaterial({ color:0x0c1016, metalness:.9, roughness:.28, transparent:true, opacity:.85, envMap:envCube, envMapIntensity:.8 });
  const cab = buildPart(cabGeo, cabMat, nCars);

  const headGeo = new THREE.BoxGeometry(0.72,0.2,0.12); headGeo.translate(0,0.62,2.14);
  const headMat = new THREE.MeshBasicMaterial({ color:0xfff3d6 });
  const headM = buildPart(headGeo, headMat, nCars);

  const tailGeo = new THREE.BoxGeometry(0.7,0.2,0.12); tailGeo.translate(0,0.62,-2.14);
  const tailMat = new THREE.MeshBasicMaterial({ color:0xff2a33 });
  const tailM = buildPart(tailGeo, tailMat, nCars);

  const poolGeo = new THREE.CircleGeometry(2.6,20); poolGeo.rotateX(-Math.PI/2); poolGeo.translate(0,0.02,0);
  const poolMat = new THREE.MeshBasicMaterial({ color:0xffc47a, transparent:true, opacity:0.24, depthWrite:false, blending:THREE.AdditiveBlending });
  const poolM = buildPart(poolGeo, poolMat, nCars);

  const splashGeo = new THREE.CircleGeometry(1.0,16); splashGeo.rotateX(-Math.PI/2); splashGeo.translate(0.45,0.03,2.1);
  const splashMat = new THREE.MeshBasicMaterial({ color:0xffe9c4, transparent:true, opacity:0.20, depthWrite:false, blending:THREE.AdditiveBlending });
  const splashM = buildPart(splashGeo, splashMat, nCars);

  // per-car colors
  for(let i=0;i<nCars;i++){
    if (traffic[i].parked){ body.setColorAt(i, new THREE.Color(traffic[i].color)); continue; }
    const c = new THREE.Color(traffic[i].color);
    if (Math.random()<0.10) c.setHex(0xffb53c); // taxi
    body.setColorAt(i, c);
  }
  if (body.instanceColor) body.instanceColor.needsUpdate = true;

  function place(i, x, z, yaw){
    Q.setFromAxisAngle(yawAxis, yaw);
    V.set(x, 0, z);
    M.compose(V, Q, S);
    body.setMatrixAt(i, M);
    cab.setMatrixAt(i, M);
    headM.setMatrixAt(i, M);
    tailM.setMatrixAt(i, M);
    // pool slightly wider for motion
    if (traffic[i] && !traffic[i].parked){
      V.set(x, 0, z); M.compose(V, Q, new THREE.Vector3(1.5,1,2.6));
    }
    poolM.setMatrixAt(i, M);
    splashM.setMatrixAt(i, M);
  }
  return { place, body, cab, headM, tailM, poolM, splashM };
}
const carParts = buildCarParts();

// ---------------------------------------------------------------- airliners (tiny blinking dots crossing the sky)
const airliners = (()=>{
  const list = [];
  for(let k=0;k<2;k++){
    const g = new THREE.Group();
    const fus = new THREE.Mesh(new THREE.BoxGeometry(4.2,0.8,0.9), new THREE.MeshStandardMaterial({ color:0x0c0f18, emissive:0x0c1422, roughness:.4 }));
    g.add(fus);
    const blink = new THREE.Mesh(new THREE.SphereGeometry(0.22,6,6), new THREE.MeshBasicMaterial({ color:0xff4444 }));
    blink.position.y = 0.5; g.add(blink);
    const y = 500 + k*90;
    const z = 300 - k*500;
    g.position.set(-1600, y, z);
    g.userData = { speed: 60*(k+1), blink, t:0 };
    scene.add(g); list.push(g);
  }
  return list;
})();

// ---------------------------------------------------------------- lights (ambient / point)
scene.add(new THREE.HemisphereLight(0x16203a, 0x0a0812, 0.5));
{
  const l1 = new THREE.PointLight(0x6fd8ff, 2.2, 95, 2);
  l1.position.set(HERO.x, 60, HERO.z); scene.add(l1);

// ---------------------------------------------------------------- post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.05, 0.78, 0.55);
composer.addPass(bloom);
const grainPass = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uAmount:{value: REDUCED?0.015:0.05} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uAmount; varying vec2 vUv;
    float h21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float g = (h21(vUv*720.0 + fract(uTime)*41.0) - 0.5)*2.0*uAmount;
      c.rgb += g;
      vec2 d = vUv-0.5; float r = dot(d,d);
      c.rgb *= 1.0 - 0.6*r;
      gl_FragColor = c;
    }`
});
composer.addPass(grainPass);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- HUD / title
const titleEl = document.getElementById('title');

// ---------------------------------------------------------------- camera control
const cam = {
  t: 0,
  manual:false, lastX:0, lastY:0, lastMove:0,
  phi: Math.PI*0.18, radius: 230, height: 110,
  weight: 0,
  parX:0, parY:0, tparX:0, tparY:0,
};
const canvasEl = renderer.domElement;
let dragging = false;

canvasEl.addEventListener('pointerdown', e=>{
  dragging = true; cam.manual = true; cam.lastX = e.clientX; cam.lastY = e.clientY; cam.lastMove = performance.now();
  document.body.classList.add('dragging');
});
window.addEventListener('pointermove', e=>{
  cam.tparX = (e.clientX/innerWidth)*2 - 1;
  cam.tparY = (e.clientY/innerHeight)*2 - 1;
  if (dragging){
    const dx = e.clientX - cam.lastX, dy = e.clientY - cam.lastY;
    cam.lastX = e.clientX; cam.lastY = e.clientY;
    cam.phi -= dx*0.005;
    cam.height += dy*0.35;
    cam.height = Math.max(35, Math.min(320, cam.height));
    cam.lastMove = performance.now();
  }
});
window.addEventListener('pointerup', ()=>{ dragging=false; document.body.classList.remove('dragging'); });
window.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.manual = true; cam.lastMove = performance.now();
  cam.radius = Math.max(60, Math.min(430, cam.radius + e.deltaY*0.12));
  cam.height = Math.max(35, Math.min(320, cam.height + e.deltaY*0.03));
}, { passive:false });

const YU = new THREE.Vector3(0,1,0);
const _pos = new THREE.Vector3(), _look = new THREE.Vector3(), _u = new THREE.Vector3(),
      _r = new THREE.Vector3(), _w = new THREE.Vector3(), _tmp = new THREE.Vector3(),
      _newV = () => new THREE.Vector3();

function cinePath(t, pos, look){
  const ang = t*0.054 + Math.sin(t*0.013)*0.6;
  const r = 195 + 72*Math.sin(t*0.021) + 40*Math.sin(t*0.009 + 1.7);
  const y = 80 + 44*Math.sin(t*0.027 + 0.8) + 15*Math.sin(t*0.061);
  const minY = 88 + Math.max(0, 200 - r)*0.5;
  pos.set(Math.cos(ang)*r, Math.max(y, minY), Math.sin(ang)*r);
  const a2 = (t+1.1)*0.054;
  const r2 = 195 + 72*Math.sin((t+1.1)*0.021);
  look.set(Math.cos(a2)*r2*0.33, 12 + 5*Math.sin(t*0.047), Math.sin(a2)*r2*0.33);
}
function applyCamera(t, dt){
  const introP = Math.min(1, t/11);
  const easeIn = introP*introP*(3-2*introP);   // smoothstep
  cinePath(cam.t, _pos, _look);
  cam.t += dt;

  // manual override
  const userPos = _tmp.set(
    Math.cos(cam.phi)*cam.radius,
    cam.height,
    Math.sin(cam.phi)*cam.radius);

  // blend weight
  if (cam.manual && performance.now() - cam.lastMove > 6000) cam.manual = false;
  const targetW = cam.manual ? 1 : 0;
  cam.weight += (targetW - cam.weight)*Math.min(1, dt*0.9);
  const w = cam.weight;

  // intro pull-down from above
  const intPos = new THREE.Vector3(180, 560, 320);
  let pos = _newV(); let look = _newV();
  pos.lerpVectors(_pos, userPos, w);
  if (introP < 1){
    const s = easeIn;
    pos.lerp(intPos, 1-s);
    look.set(0, 0, 0);
  } else if (w < 1){
    look.copy(_look);
  } else {
    look.set(0, 14, 0);
  }

  // parallax
  cam.parX += (cam.tparX - cam.parX)*Math.min(1, dt*3.2);
  cam.parY += (cam.tparY - cam.parY)*Math.min(1, dt*3.2);
  _w.subVectors(look, pos).normalize();
  _r.crossVectors(_w, YU).normalize();
  _u.crossVectors(_r, _w);
  pos.addScaledVector(_r, cam.parX*16);
  pos.addScaledVector(_u, cam.parY*9);
  look.addScaledVector(_r, cam.parX*24);
  look.addScaledVector(_u, cam.parY*13);

  camera.position.copy(pos);
  camera.lookAt(look);
}

// ---------------------------------------------------------------- animated updates
const fountainAlive = REDUCED ? 0.4 : 1;
function updateFountain(dt, t){
  const { pos, vel, life, aLife, drops } = fountain;
  const g = -11;
  const N = fountain.pos.length/3;
  for(let i=0;i<N;i++){
    life[i] -= dt*0.55;
    if (life[i] <= 0){
      // respawn
      const a = Math.random()*Math.PI*2;
      pos[i*3] = Math.cos(a)*(1.6+Math.random()*1.2);
      pos[i*3+1] = 2.3;
      pos[i*3+2] = Math.sin(a)*(1.6+Math.random()*1.2);
      vel[i*3] = Math.cos(a)*(0.6+Math.random()*1.4);
      vel[i*3+1] = 5.5 + Math.random()*4.5;
      vel[i*3+2] = Math.sin(a)*(0.6+Math.random()*1.4);
      life[i] = 1.0;
      continue;
    }
    vel[i*3+1] += g*dt;
    pos[i*3]   += vel[i*3]*dt;
    pos[i*3+1] += vel[i*3+1]*dt;
    pos[i*3+2] += vel[i*3+2]*dt;
    if (pos[i*3+1] < 1.4 && vel[i*3+1] < 0){ // splash
      vel[i*3+1] = 1.4;
      vel[i*3] *= 0.4; vel[i*3+2] *= 0.4;
    }
    aLife[i] = life[i];
  }
  drops.geometry.attributes.position.needsUpdate = true;
  drops.geometry.attributes.aLife.needsUpdate = true;
}

function updateTraffic(dt, t){
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3(1,1,1);
  const Yax = new THREE.Vector3(0,1,0);
  for(let i=0;i<traffic.length;i++){
    const c = traffic[i];
    if (c.parked){
      V.set(c.px, 0, c.pz);
      Q.setFromAxisAngle(Yax, c.pyaw); M.compose(V,Q,S);
      // skip placing into instanced arrays for parked? we made room; place on a dummy lane
      carParts.place(i, c.px, c.pz, c.pyaw - Math.PI/2);
      continue;
    }
    if (c.path.type === 'ring'){
      c.ringA += dt*c.dir*0.30;
      const x = c.path.cx + Math.cos(c.ringA)*c.path.r;
      const z = c.path.cz + Math.sin(c.ringA)*c.path.r;
      const yaw = c.ringA + Math.PI/2;
      carParts.place(i, x, z, yaw);
    } else {
      const p = c.path;
      c.t += dt * c.dir * c.speed / 640;
      if (c.t > 1){ c.t = 1; c.dir *= -1; }
      if (c.t < 0){ c.t = 0; c.dir *= -1; }
      const ex = p.p0.x + (p.p1.x-p.p0.x)*c.t;
      const ez = p.p0.z + (p.p1.z-p.p0.z)*c.t;
      // lane offset perpendicular
      const dxn = p.p1.x-p.p0.x, dzn = p.p1.z-p.p0.z;
      const len = Math.hypot(dxn,dzn)||1;
      const perp = c.lane + Math.sin(t*0.7 + i)*0.4;
      const x = ex - dzn/len*perp;
      const z = ez + dxn/len*perp;
      const yaw = Math.atan2(dxn, dzn);
      carParts.place(i, x, z, yaw);
    }
  }
  carParts.body.instanceMatrix.needsUpdate = true;
  carParts.cab.instanceMatrix.needsUpdate = true;
  carParts.headM.instanceMatrix.needsUpdate = true;
  carParts.tailM.instanceMatrix.needsUpdate = true;
  carParts.poolM.instanceMatrix.needsUpdate = true;
  carParts.splashM.instanceMatrix.needsUpdate = true;
}

function updateCrowd(dt, t){
  const { mesh, people } = crowd;
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3(1,1,1);
  const Yax = new THREE.Vector3(0,1,0);
  for(let i=0;i<people.length;i++){
    const p = people[i];
    p.a += p.dir*p.spd*dt*0.04;
    const drift = p.r;
    const x = Math.cos(p.a)*drift, z = Math.sin(p.a)*drift;
    const bob = Math.sin(t*2.2 + p.ph)*0.03;
    V.set(x, bob, z);
    Q.setFromAxisAngle(Yax, p.a + Math.PI/2 + Math.sin(t*0.5+p.ph)*0.2);
    M.compose(V,Q,S);
    mesh.setMatrixAt(i,M);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

function updateHero(dt, t){
  // searchlights sweep
  for(let i=0;i<hero.userData.beams.length;i++){
    const b = hero.userData.beams[i];
    const sp = i===0 ? 0.5 : -0.36;
    b.grp.rotation.y += dt*sp;
    b.cone.material.opacity = 0.12 + 0.05*Math.sin(t*0.9 + i*2.1);
  }
  // beacon blink
  const blink = (Math.sin(t*4.5) > 0.25) ? 1 : 0.12;
  hero.userData.beacon.material.opacity = blink;
  hero.userData.beacon.scale.setScalar(10 + blink*14);
  // band sweep
  const band = hero.userData.band;
  const my = 5 + ((t*14) % 222);
  band.position.y = REDUCED ? 60 : my;
  band.material.opacity = 0.10 + 0.08*Math.sin(t*2.1);
  // strips pulse
  const st = hero.userData.strips;
  st[0].material.color.setRGB(1, 0.22*(0.5+0.5*Math.sin(t*2.4)), 0.62*(0.5+0.5*Math.sin(t*2.4)));
  st[1].material.color.setRGB(0.1, 0.75*(0.5+0.5*Math.sin(t*1.8+2)), 1);
  st[2].material.color.setRGB(0.1, 0.75*(0.5+0.5*Math.sin(t*1.8+4)), 1);
}

function updateSkyAndFX(dt, t){
  stars1.rotation.y += dt*0.0025;
  stars2.rotation.y -= dt*0.0038;
  stars1.material.opacity = 0.7 + 0.15*Math.sin(t*0.5);
  for(const c of clouds){ c.position.x += c.userData.spd*dt;
    if (c.position.x > 1200) c.position.x = -1200; }
  for(let i=0;i<airliners.length;i++){
    const a = airliners[i].userData;
    airliners[i].position.x += a.speed*dt;
    const b = Math.sin(t*6 + i*3) > 0.4;
    a.blink.material.color.setRGB(b?1:0.08, 0.1, 0.1);
    if (airliners[i].position.x > 1700) airliners[i].position.x = -1700;
  }
  for(const cs of crownSprites){
    cs.material.opacity = cs.userData.base + 0.25*Math.sin(t*1.4 + cs.userData.ph);
  }
  grainPass.uniforms.uTime.value = t;
}

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  U.time.value = t;
  U.camPos.value.copy(camera.position);

  applyCamera(t, dt);
  updateTraffic(dt, t);
  updateFountain(dt, t);
  updateCrowd(dt, t);
  updateHero(dt, t);
  updateSkyAndFX(dt, t);

  composer.render();
}
requestAnimationFrame(frame);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
