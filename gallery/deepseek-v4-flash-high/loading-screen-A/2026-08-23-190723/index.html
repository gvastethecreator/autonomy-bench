<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading…</title>
<style>
  :root {
    --bg-0: #070b18;
    --bg-1: #0b1026;
    --accent: #5b8cff;
    --accent-2: #9d6bff;
    --accent-3: #38d6c4;
    --ink: #eef2ff;
    --ink-dim: #9aa5c6;
    --track: rgba(255, 255, 255, 0.08);
    --glow: rgba(91, 140, 255, 0.45);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    background: var(--bg-0);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Ambient background ---------- */

  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .aurora::before,
  .aurora::after {
    content: "";
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    animation: drift 18s ease-in-out infinite alternate;
  }

  .aurora::before {
    top: -30vmax;
    left: -15vmax;
    background: radial-gradient(circle, var(--accent), transparent 65%);
  }

  .aurora::after {
    bottom: -32vmax;
    right: -18vmax;
    background: radial-gradient(circle, var(--accent-2), transparent 65%);
    animation-delay: -9s;
  }

  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(6vmax, 4vmax, 0) scale(1.15); }
  }

  /* ---------- Shell ---------- */

  .screen {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    padding: 32px;
    transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
  }

  .screen.done {
    opacity: 0;
    transform: scale(1.03);
    pointer-events: none;
  }

  /* ---------- Mark ---------- */

  .mark {
    position: relative;
    width: 128px;
    height: 128px;
  }

  .mark .core {
    position: absolute;
    inset: 26px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #ffffff, transparent 45%),
      linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:
      0 0 24px var(--glow),
      0 0 64px rgba(157, 107, 255, 0.25),
      inset 0 0 12px rgba(255, 255, 255, 0.35);
    animation: breathe 2.6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: rgba(91, 140, 255, 0.25);
    animation: spin 1.4s linear infinite;
  }

  .ring--outer {
    inset: -6px;
    border-top-color: var(--accent-3);
    border-right-color: rgba(56, 214, 196, 0.2);
    animation-duration: 2.4s;
    animation-direction: reverse;
  }

  .ring--inner {
    inset: 14px;
    border-top-color: var(--accent-2);
    animation-duration: 1s;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .orbit {
    position: absolute;
    inset: -14px;
    animation: spin 5s linear infinite;
  }

  .orbit i {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    margin: -4px;
    border-radius: 50%;
    background: var(--accent-3);
    box-shadow: 0 0 10px var(--accent-3);
  }

  .orbit i:nth-child(1) { transform: translateX(72px); }
  .orbit i:nth-child(2) { transform: rotate(120deg) translateX(72px); }
  .orbit i:nth-child(3) { transform: rotate(240deg) translateX(72px); }

  /* ---------- Label ---------- */

  .label {
    text-align: center;
  }

  .label h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .label p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }

  /* ---------- Progress ---------- */

  .progress {
    width: min(340px, 78vw);
  }

  .progress__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .progress__status {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 72%;
  }

  .progress__pct {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-weight: 600;
  }

  .progress__track {
    height: 6px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    position: relative;
  }

  .progress__bar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
    background-size: 200% 100%;
    animation: sheen 1.6s linear infinite;
    box-shadow: 0 0 12px var(--glow);
    transition: width 0.35s var(--ease-out);
  }

  @keyframes sheen {
    from { background-position: 0% 0; }
    to   { background-position: 200% 0; }
  }

  /* ---------- Exit overlay ---------- */

  .reveal {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: var(--bg-0);
    transform: translateY(100%);
    transition: transform 0.7s var(--ease-out);
    pointer-events: none;
  }

  .reveal.up { transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .aurora::before, .aurora::after,
    .mark .core, .ring, .orbit, .progress__bar { animation: none !important; }
    .orbit { animation: none; }
  }
</style>
</head>
<body>

  <div class="aurora" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main class="screen" id="screen" aria-live="polite" aria-busy="true">
    <div class="mark" aria-hidden="true">
      <div class="ring ring--inner"></div>
      <div class="core"></div>
      <div class="ring ring--outer"></div>
      <div class="orbit"><i></i><i></i><i></i></div>
    </div>

    <div class="label">
      <h1>Launching experience</h1>
      <p>Preparing everything you need</p>
    </div>

    <div class="progress">
      <div class="progress__head">
        <span class="progress__status" id="status">Starting up…</span>
        <span class="progress__pct" id="pct">0%</span>
      </div>
      <div class="progress__track">
        <div class="progress__bar" id="bar"></div>
      </div>
    </div>
  </main>

  <div class="reveal" id="reveal" aria-hidden="true"></div>

<script>
  (function () {
    "use strict";

    var statuses = [
      [0,   "Starting up…"],
      [18,  "Loading modules…"],
      [34,  "Compiling assets…"],
      [51,  "Calibrating engine…"],
      [67,  "Optimizing shaders…"],
      [83,  "Warming caches…"],
      [94,  "Final touches…"]
    ];

    var screen  = document.getElementById("screen");
    var bar     = document.getElementById("bar");
    var pctEl   = document.getElementById("pct");
    var status  = document.getElementById("status");
    var reveal  = document.getElementById("reveal");

    var value = 0;
    var idx = 0;

    // Ease from one progress step to the next, ~3.6s total load.
    function tick() {
      var target = statuses[Math.min(idx, statuses.length - 1)][0];

      // Snap displayed status text when crossing into the next band.
      if (idx < statuses.length - 1 && value >= statuses[idx + 1][0] - 1) {
        idx++;
      }
      status.textContent = statuses[idx][1];

      var eased = Math.min(value, 100);
      bar.style.width = eased + "%";
      pctEl.textContent = Math.round(eased) + "%";

      if (value >= 100) {
        finish();
        return;
      }

      // ~1.1s of easing per segment: 7 segments ≈ 3.6s.
      var step = (target - value) / 7;
      value = Math.min(target, value + step + (Math.random() * 0.35));
      setTimeout(tick, 32);
    }

    function finish() {
      screen.classList.add("done");
      screen.setAttribute("aria-busy", "false");
      setTimeout(function () {
        reveal.classList.add("up");
        document.title = "Ready";
      }, 500);
    }

    // Begin after a short beat so the opening animation is visible.
    setTimeout(tick, 350);
  })();
</script>
</body>
</html>
