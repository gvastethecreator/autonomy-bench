<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon District — A Living Procedural City at Night</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #03050b;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #c7d0e4;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* subtle vignette + grade overlay (non-interactive) */
  #grade {
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(2,3,10,0.42) 100%),
      linear-gradient(180deg, rgba(10,16,38,0.18), transparent 30%, transparent 70%, rgba(2,4,12,0.35));
    z-index: 2;
  }

  #hud {
    position: fixed;
    left: 16px; bottom: 14px;
    z-index: 3;
    pointer-events: none;
    font-size: 12px;
    line-height: 1.55;
    letter-spacing: 0.02em;
    background: rgba(8,12,24,0.55);
    border: 1px solid rgba(120,150,220,0.18);
    border-radius: 10px;
    padding: 10px 14px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    max-width: 340px;
  }
  #hud .title {
    font-size: 13px; font-weight: 600;
    color: #e8eefc;
    display: flex; align-items: center; gap: 8px;
  }
  #hud .title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffd9a0; box-shadow: 0 0 8px 2px rgba(255,200,120,0.8);
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  #hud .sub { color: #93a0c0; margin-top: 2px; }
  #hud .hint { color: #6f7ea5; margin-top: 6px; font-size: 11px; }
  #stats {
    position: fixed; right: 14px; bottom: 14px;
    z-index: 3; pointer-events: none;
    font-size: 11px; color: #6f7ea5;
    font-variant-numeric: tabular-nums;
    background: rgba(8,12,24,0.45);
    border: 1px solid rgba(120,150,220,0.14);
    border-radius: 8px;
    padding: 6px 10px;
  }
  #error {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #04060c; color: #aeb9d6; font-size: 14px;
    padding: 40px; text-align: center; display: none;
  }
  #error code { color: #ffd9a0; }
</style>
</head>
<body>

<div id="app"></div>
<div id="grade"></div>
<div id="hud">
  <div class="title"><span class="dot"></span>NEON DISTRICT</div>
  <div class="sub">A living procedural city at night · generated on load with a fixed seed</div>
  <div class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; <b>B</b> toggles bloom</div>
</div>
<div id="stats">fps —</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================================
   RENDERER / SCENE / CAMERA
   ========================================================================= */

const appEl = document.getElementById('app');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  const el = document.getElementById('error');
  el.style.display = 'flex';
  el.innerHTML = 'WebGL is not available in this browser.<br><code>' + err.message + '</code>';
  throw err;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
appEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);
scene.fog = new THREE.FogExp2(0x0a0f1e, 0.0041);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 1, 4200);
camera.position.set(170, 130, 250);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.target.set(0, 18, 0);
controls.minDistance = 18;
controls.maxDistance = 950;
controls.maxPolarAngle = Math.PI * 0.492;
controls.addEventListener('start', () => { controls.autoRotate = false; });

/* =========================================================================
   LIGHTS
   ========================================================================= */

scene.add(new THREE.AmbientLight(0x232b44, 0.55));
scene.add(new THREE.HemisphereLight(0x2a3a5e, 0x0a0c14, 0.6));

const moonLight = new THREE.DirectionalLight(0x9db2ff, 1.05);
moonLight.position.set(-360, 460, -240);
scene.add(moonLight);

/* =========================================================================
   UTILITIES
   ========================================================================= */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260823);
const rand = (a, b) => a + (b - a) * rng();
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
function wrapRange(p, a, b) { const s = b - a; return a + ((((p - a) % s) + s) % s); }

/* =========================================================================
   CITY GRID CONSTANTS
   ========================================================================= */

const CITY   = 900;   // city extents per axis (meters/units)
const GRID   = 90;    // pitch between roads
const ROAD_W = 12;    // road width
const BLOCK  = GRID - ROAD_W;   // 78 — building block size
const HALF   = CITY / 2;        // 450
const ROADS  = Array.from({ length: 11 }, (_, k) => -HALF + k * GRID);

const blockMin  = (i) => -HALF + ROAD_W / 2 + i * GRID;
const blockCenX = (i) => blockMin(i) + BLOCK / 2;
const blockCenZ = (j) => blockMin(j) + BLOCK / 2;

/* =========================================================================
   CANVAS TEXTURE HELPERS
   ========================================================================= */

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function canvasTexture(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// Soft radial glow used for lamps, glows and the moon.
function radialGlowTexture(inner = 'rgba(255,240,210,1)', mid = 'rgba(255,200,120,0.22)', edge = 'rgba(255,180,90,0)') {
  const c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  gr.addColorStop(0, inner);
  gr.addColorStop(0.35, mid);
  gr.addColorStop(1, edge);
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return canvasTexture(c, false);
}

const lampGlowTex = radialGlowTexture();

/* =========================================================================
   GROUND + ROADS
   ========================================================================= */

// Outer dark land beyond the city.
{
  const g = new THREE.PlaneGeometry(6000, 6000);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 1, metalness: 0 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.y = -0.05;
  scene.add(mesh);
}
// City base slab.
{
  const g = new THREE.PlaneGeometry(CITY + ROAD_W, CITY + ROAD_W);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.MeshStandardMaterial({ color: 0x11151d, roughness: 0.95, metalness: 0.05 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.y = 0;
  scene.add(mesh);
}

function buildRoadTexture(vertical) {
  const c = makeCanvas(160, 64);
  const g = c.getContext('2d');
  // asphalt
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#171a21');
  gr.addColorStop(0.5, '#101319');
  gr.addColorStop(1, '#161920');
  g.fillStyle = gr;
  g.fillRect(0, 0, 160, 64);
  // faint noise
  for (let i = 0; i < 260; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.018).toFixed(4) + ')';
    g.fillRect(Math.random() * 160, Math.random() * 64, 1, 1);
  }
  // edge lines
  g.fillStyle = 'rgba(200,215,235,0.10)';
  g.fillRect(0, 3, 160, 1.5);
  g.fillRect(0, 59.5, 160, 1.5);
  // center dashed line
  g.fillStyle = 'rgba(210,220,235,0.20)';
  for (let x = 4; x < 160; x += 26) {
    g.fillRect(x, 31, 13, 2.5);
  }
  if (vertical) {
    const c2 = makeCanvas(64, 160);
    const g2 = c2.getContext('2d');
    g2.translate(32, 80); g2.rotate(Math.PI / 2); g2.translate(-80, -32);
    g2.drawImage(c, 0, 0);
    return c2;
  }
  return c;
}

const roadTexEW = canvasTexture(buildRoadTexture(false), true);
roadTexEW.wrapS = THREE.RepeatWrapping;
roadTexEW.repeat.set(CITY / 18, 1);

const roadTexNS = canvasTexture(buildRoadTexture(true), true);
roadTexNS.wrapT = THREE.RepeatWrapping;
roadTexNS.repeat.set(1, CITY / 18);

{
  const roadMatEW = new THREE.MeshStandardMaterial({ map: roadTexEW, roughness: 0.92, metalness: 0.02 });
  const roadMatNS = new THREE.MeshStandardMaterial({ map: roadTexNS, roughness: 0.92, metalness: 0.02 });

  const geomsEW = [];
  const geomsNS = [];
  for (let k = 0; k < ROADS.length; k++) {
    const gEW = new THREE.PlaneGeometry(CITY, ROAD_W);
    gEW.rotateX(-Math.PI / 2);
    gEW.translate(0, 0.05, ROADS[k]);
    geomsEW.push(gEW);

    const gNS = new THREE.PlaneGeometry(ROAD_W, CITY);
    gNS.rotateX(-Math.PI / 2);
    gNS.translate(ROADS[k], 0.05, 0);
    geomsNS.push(gNS);
  }
  scene.add(new THREE.Mesh(mergeGeometries(geomsEW), roadMatEW));
  scene.add(new THREE.Mesh(mergeGeometries(geomsNS), roadMatNS));
}

/* =========================================================================
   COLLECTORS FOR INSTANCED / ANIMATED ELEMENTS
   ========================================================================= */

const pentMats = [];         // rooftop penthouses (instanced box)
const antMats  = [];         // rooftop antennas (instanced slim cylinder)
const treeTrunkMats = [];    // park trees
const treeCanopyMats = [];
const lampPoleMats = [];     // street lamp poles
const lampHeadMats = [];     // street lamp heads
const lampGlowMats = [];     // street lamp ground glows
const beacons = [];          // blinking red rooftop lights
const signs = [];            // neon signs

/* =========================================================================
   BUILDINGS
   ========================================================================= */

const WINDOW_PALETTES = [
  ['#ffe4b3', '#ffd9a0', '#fff0c9'],   // warm amber
  ['#d6ecff', '#cfe6ff', '#e6f3ff'],   // cool blue-white
  ['#ffe9bf', '#fff3d6', '#ffd9a0'],   // soft gold
  ['#e9e2ff', '#dcd4ff', '#ffffff'],   // violet-white
];

// Facade: wall base + window grid, and a matching emissive map (only lit windows).
function makeFacadeTexture(rng, w, h) {
  const cols = Math.max(3, Math.min(14, Math.round(w / 7.5)));
  const rows = Math.max(4, Math.min(26, Math.round(h / 8.5)));
  const cell = 7;
  const CW = cols * cell, CH = rows * cell;

  const wallC = makeCanvas(CW, CH);
  const emitC = makeCanvas(CW, CH);

  const bg = wallC.getContext('2d');
  const eg = emitC.getContext('2d');

  const base  = 26 + Math.floor(rng() * 30);
  const warm  = 8 + Math.floor(rng() * 16);
  const grad = bg.createLinearGradient(0, 0, 0, CH);
  grad.addColorStop(0, 'rgb(' + (base + 14) + ',' + (base + warm + 16) + ',' + (base + 30) + ')');
  grad.addColorStop(1, 'rgb(' + (base) + ',' + (base + warm + 4) + ',' + (base + 18) + ')');
  bg.fillStyle = grad;
  bg.fillRect(0, 0, CW, CH);

  const litFrac = 0.24 + rng() * 0.42;
  const palette = pick(WINDOW_PALETTES);
  const dimPalette = pick(WINDOW_PALETTES);

  for (let r = 0; r < rows; r++) {
    const offset = (r % 2) * cell * 0.5;
    for (let c = 0; c < cols; c++) {
      const x = Math.ceil(c * cell + offset);
      if (x + cell > CW) continue;
      const y = r * cell;
      const p = rng();
      let lit = 0;                       // 0 unlit, 1 lit, 2 dim
      if (p < litFrac) lit = 1;
      else if (p < litFrac + 0.10) lit = 2;

      // window frame (mullion)
      bg.fillStyle = wallCtxFrame(base);
      bg.fillRect(x, y, cell, cell);

      const gx = x + 1, gy = y + 1, gw = cell - 2, gh = cell - 2;

      if (lit === 1) {
        const col = pick(palette);
        bg.fillStyle = col;
        bg.fillRect(gx, gy, gw, gh);
        bg.fillStyle = 'rgba(255,255,255,0.28)';         // top glint
        bg.fillRect(gx, gy, gw, Math.max(1, gh * 0.3));
        eg.fillStyle = col;
        eg.fillRect(gx, gy, gw, gh);
      } else if (lit === 2) {
        const col = pick(dimPalette);
        bg.fillStyle = col;
        bg.globalAlpha = 0.38;
        bg.fillRect(gx, gy, gw, gh);
        bg.globalAlpha = 1;
        eg.fillStyle = col;
        eg.globalAlpha = 0.34;
        eg.fillRect(gx, gy, gw, gh);
        eg.globalAlpha = 1;
      } else {
        // unlit glass — slightly lighter than wall, bluish
        bg.fillStyle = 'rgb(' + (base + 24) + ',' + (base + warm + 22) + ',' + (base + 44) + ')';
        bg.fillRect(gx, gy, gw, gh);
      }
    }
  }

  // soft vignette/darkening toward bottom & edges for depth
  bg.fillStyle = 'rgba(0,0,0,0.20)';
  bg.fillRect(0, 0, CW, 2);
  bg.fillRect(0, CH - 2, CW, 2);
  bg.fillRect(0, 0, 2, CH);
  bg.fillRect(CW - 2, 0, 2, CH);
  const bottomShade = bg.createLinearGradient(0, CH * 0.6, 0, CH);
  bottomShade.addColorStop(0, 'rgba(0,0,0,0)');
  bottomShade.addColorStop(1, 'rgba(0,0,0,0.28)');
  bg.fillStyle = bottomShade;
  bg.fillRect(0, 0, CW, CH);

  return { wall: canvasTexture(wallC), emit: canvasTexture(emitC) };
}

function wallCtxFrame(base) { return 'rgb(' + (base + 30) + ',' + (base + 12) + ',' + (base + 48) + ')'; }

const buildings = [];
const parks = [];

function addBuilding(bx, bz, w, d, h) {
  const cx = bx + w / 2, cz = bz + d / 2;
  const fac = makeFacadeTexture(rng, w, h);
  const distFrac = Math.sqrt(cx * cx + cz * cz) / (HALF * 0.95);
  const cool = (cx < 0 ? -0.02 : 0.01) + (cz < 0 ? -0.02 : 0.01);
  const mat = new THREE.MeshLambertMaterial({
    color: new THREE.Color().setHSL(0.60 + rng() * 0.06 + cool, 0.10 + rng() * 0.10, 0.15 + rng() * 0.09),
    map: fac.wall,
    emissive: 0xffffff,
    emissiveMap: fac.emit,
    emissiveIntensity: 0.8 + rng() * 0.35,
  });
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(cx, h / 2, cz);
  scene.add(mesh);
  buildings.push(mesh);

  // ---- rooftops ----
  const topY = h;

  if (rng() < 0.5) {
    pentMats.push(scaledMatrix(cx, topY, cz, 0, w * (0.22 + rng() * 0.18), h * (0.05 + rng() * 0.08), d * (0.22 + rng() * 0.18)));
  }
  if (h > 38 && rng() < 0.65) {
    antMats.push(scaledMatrix(cx, topY, cz, 0, 0.09, h * (0.28 + rng() * 0.3), 0.09));
    if (rng() < 0.8) {
      const beacon = makeBeacon(cx, topY + h * 0.35, cz);
      beacons.push(beacon);
    }
  } else if (h > 55) {
    const beacon = makeBeacon(cx, topY + 2.5, cz);
    beacons.push(beacon);
  }

  // ---- neon signs on a random outward-facing wall ----
  if (h > 14 && rng() < 0.17) {
    addSign(mesh, w, d, h);
  }
}

function scaledMatrix(x, y, z, ry, sx, sy, sz) {
  const m = new THREE.Matrix4();
  m.compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry),
    new THREE.Vector3(sx, sy, sz)
  );
  return m;
}

function makeBeacon(x, y, z) {
  const geo = new THREE.SphereGeometry(0.45, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return { mesh, phase: rng() * 6.28, speed: 0.8 + rng() * 0.4 };
}

function addSign(build, w, d, h) {
  const side = pick(['px', 'nx', 'pz', 'nz']);
  const hw = w / 2, hd = d / 2, hh = h / 2;

  const sw = 6 + rng() * 3;
  const sh = 2.2 + rng() * 1.1;

  const text = pick(['HOTEL', 'BAR', 'LOUNGE', 'CLUB', 'SAKE', 'NEO', 'SUNSET', 'CAFE', 'AKIRA', 'BLUE', 'REDS', 'STAR', 'MOTEL', 'KARAOKE']);
  const neon = pick(['#ff4d6d', '#37e0ff', '#ffd166', '#bf6bff', '#7dffb2', '#ff9f45']);
  const sign = makeSignCanvas(text, neon);

  let pos, rotY;
  if (side === 'px') { pos = [hw + 0.35, h * (0.45 + rng() * 0.3), (rng() * 2 - 1) * hd * 0.45]; rotY = Math.PI / 2; }
  if (side === 'nx') { pos = [-hw - 0.35, h * (0.45 + rng() * 0.3), (rng() * 2 - 1) * hd * 0.45]; rotY = -Math.PI / 2; }
  if (side === 'pz') { pos = [(rng() * 2 - 1) * hw * 0.45, h * (0.45 + rng() * 0.3), hd + 0.35]; rotY = 0; }
  if (side === 'nz') { pos = [(rng() * 2 - 1) * hw * 0.45, h * (0.45 + rng() * 0.3), -hd - 0.35]; rotY = Math.PI; }

  const mat = new THREE.MeshBasicMaterial({ map: sign, transparent: true, opacity: 1, toneMapped: false, side: THREE.DoubleSide });
  const geo = new THREE.PlaneGeometry(sw, sh);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.rotation.y = rotY;
  build.add(mesh);

  const kind = pick(['blink', 'pulse', 'stutter']);
  signs.push({ mesh, mat, kind, phase: rng() * 6.28, speed: 0.7 + rng() * 1.4 });

  // small secondary accent sign sometimes
  if (rng() < 0.5) {
    const mat2 = new THREE.MeshBasicMaterial({ color: neon, transparent: true, opacity: 0.9, toneMapped: false, side: THREE.DoubleSide });
    const g2 = new THREE.PlaneGeometry(0.5, 3.4);
    const m2 = new THREE.Mesh(g2, mat2);
    if (side === 'px' || side === 'nx') {
      m2.position.set(side === 'px' ? hw + 0.3 : -hw - 0.3, h * 0.7, (rng() * 2 - 1) * hd * 0.5);
      m2.rotation.y = side === 'px' ? Math.PI / 2 : -Math.PI / 2;
    } else {
      m2.position.set((rng() * 2 - 1) * hw * 0.5, h * 0.7, side === 'pz' ? hd + 0.3 : -hd - 0.3);
      m2.rotation.y = side === 'pz' ? 0 : Math.PI;
    }
    build.add(m2);
    signs.push({ mesh: m2, mat: mat2, kind: pick(['blink', 'pulse']), phase: rng() * 6.28, speed: 0.7 + rng() * 1.4 });
  }
}

function makeSignCanvas(text, color) {
  const c = makeCanvas(256, 96);
  const g = c.getContext('2d');
  g.fillStyle = '#000000';
  g.fillRect(0, 0, 256, 96);
  g.strokeStyle = color;
  g.lineWidth = 6;
  g.strokeRect(4, 4, 248, 88);
  g.strokeStyle = 'rgba(255,255,255,0.25)';
  g.lineWidth = 1;
  g.strokeRect(10, 10, 236, 76);

  g.font = 'bold 46px "Segoe UI", Arial, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = color;
  g.shadowBlur = 22;
  g.fillStyle = color;
  g.fillText(text, 128, 50);
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,0.85)';
  g.fillText(text, 128, 50);
  return canvasTexture(c);
}

/* -------------------------------------------------------------------------
   Distribute buildings across blocks (with a few parks)
   ------------------------------------------------------------------------- */

for (let bi = 0; bi < 10; bi++) {
  for (let bj = 0; bj < 10; bj++) {

    if (rng() < 0.055) {
      parks.push({ cx: blockCenX(bi), cz: blockCenZ(bj), s: BLOCK - 6 });
      continue;
    }

    const bmin = blockMin(bi);
    const n = rng() < 0.45 ? 1 : (rng() < 0.6 ? 2 : 3);
    const gap = 1.6;
    const usable = BLOCK - 2.4 - gap * (n - 1);

    let widths = [];
    let rem = usable;
    for (let s = 0; s < n; s++) {
      const w = (s === n - 1) ? rem : rem * (0.3 + rng() * 0.3);
      widths.push(Math.max(8, w));
      rem -= w;
    }

    let x0 = bmin + 1.2;
    for (let s = 0; s < n; s++) {
      const w = widths[s];
      const d = BLOCK - (1.5 + rng() * 7);
      const dOff = rng() < 0.4 ? (rng() * 2 - 1) * (BLOCK - d) * 0.5 : 0;

      const r = Math.hypot(blockCenX(bi) + w / 2, blockCenZ(bj) + d / 2) / (HALF * 0.92);
      const h = (8 + Math.pow(1 - Math.min(r, 1), 1.55) * 54) * (0.72 + rng() * 0.6);
      const height = Math.max(5, Math.min(82, h));

      addBuilding(x0, blockMin(bj) + (BLOCK - d) / 2 + dOff, w, d, height);
      x0 += w + gap;
    }
  }
}

/* -------------------------------------------------------------------------
   Parks with trees
   ------------------------------------------------------------------------- */

const parkCount = parks.length;
for (let p = 0; p < parkCount; p++) {
  const park = parks[p];
  const g = new THREE.PlaneGeometry(park.s, park.s);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.MeshStandardMaterial({ color: 0x0d2216, roughness: 1 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(park.cx, 0.02, park.cz);
  scene.add(mesh);

  const trees = 8 + Math.floor(rng() * 6);
  for (let t = 0; t < trees; t++) {
    const tx = park.cx + rand(-1, 1) * (park.s / 2 - 2);
    const tz = park.cz + rand(-1, 1) * (park.s / 2 - 2);
    const scale = 0.8 + rng() * 0.9;
    const trunkH = 2.2 * scale, canopyS = (1.5 + rng() * 0.8) * scale;
    treeTrunkMats.push(scaledMatrix(tx, trunkH / 2, tz, rng() * 6.28, 0.16 * scale, trunkH, 0.16 * scale));
    treeCanopyMats.push(scaledMatrix(tx, trunkH + canopyS * 0.45, tz, rng() * 6.28, canopyS, canopyS, canopyS));
  }
}

/* -------------------------------------------------------------------------
   Commit instanced roof / park geometry
   ------------------------------------------------------------------------- */

const ONE = new THREE.Vector3(1, 1, 1);

function commitInstanced(matrices, geometry, material) {
  if (matrices.length === 0) return null;
  const im = new THREE.InstancedMesh(geometry, material, matrices.length);
  matrices.forEach((m, i) => im.setMatrixAt(i, m));
  im.instanceMatrix.needsUpdate = true;
  im.frustumCulled = false;
  scene.add(im);
  return im;
}

commitInstanced(pentMats, new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x14171e, roughness: 0.9, metalness: 0.2 }));
commitInstanced(antMats, new THREE.CylinderGeometry(1, 1, 1, 6),
  new THREE.MeshStandardMaterial({ color: 0x0c0e13, roughness: 0.8, metalness: 0.35 }));

commitInstanced(treeTrunkMats, new THREE.CylinderGeometry(1, 1, 1, 6),
  new THREE.MeshStandardMaterial({ color: 0x24180f, roughness: 1 }));
commitInstanced(treeCanopyMats, new THREE.ConeGeometry(1, 1, 7),
  new THREE.MeshStandardMaterial({ color: 0x0e2215, roughness: 1 }));

/* -------------------------------------------------------------------------
   STREET LAMPS (instanced) + real point light pools
   ------------------------------------------------------------------------- */

const lampTex = radialGlowTexture('rgba(255,226,170,1)', 'rgba(255,190,110,0.20)', 'rgba(255,180,90,0)');

for (let k = 0; k < ROADS.length; k++) {
  for (let l = 0; l < ROADS.length; l++) {
    const ix = ROADS[k], iz = ROADS[l];
    if (Math.abs(ix) > HALF - 6 || Math.abs(iz) > HALF - 6) continue;
    for (let q = 0; q < 2; q++) {
      const dx = (q === 0 ? 5.5 : -5.5);
      const dz = (q === 0 ? 5.5 : -4.5);
      const px = ix + dx, pz = iz + dz;

      lampPoleMats.push(scaledMatrix(px, 2.9, pz, 0, 1, 1, 1));
      // arm towards the intersection centre + head
      const armLen = 3.4;
      const hx = px - Math.sign(dx) * 0.2 * armLen * 0.2; // keep near pole
      const ax = px + Math.sign(dx) * armLen * 0.35;
      const az = pz + Math.sign(dz) * armLen * 0.35;
      lampHeadMats.push(new THREE.Matrix4().compose(
        new THREE.Vector3(ax, 5.25, az),
        new THREE.Quaternion(),
        ONE
      ));
      lampGlowMats.push(new THREE.Matrix4().compose(
        new THREE.Vector3(ax, 0.07, az),
        new THREE.Quaternion(),
        new THREE.Vector3(4.6, 1, 4.6)
      ));
      // duplicate glow for variety brightness handled by instanceColor
    }
  }
}

const lampPole = commitInstanced(lampPoleMats, new THREE.CylinderGeometry(0.14, 0.22, 5.8, 6),
  new THREE.MeshStandardMaterial({ color: 0x1b1f28, roughness: 0.7, metalness: 0.4 }));
const lampHead = commitInstanced(lampHeadMats, new THREE.SphereGeometry(0.34, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0xffe0a8, toneMapped: false }));

{
  const glowMat = new THREE.MeshBasicMaterial({
    map: lampTex, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  });
  const glow = commitInstanced(lampGlowMats, new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), glowMat);
  if (glow) {
    for (let i = 0; i < lampGlowMats.length; i++) {
      const v = 0.5 + rng() * 0.5;
      glow.setColorAt(i, new THREE.Color(v, v * 0.9, v * 0.72));
    }
    if (glow.instanceColor) glow.instanceColor.needsUpdate = true;
  }
}

// Real point-light pools — a handful near downtown so lamp light actually falls on cars.
const warmPoolColor = 0xffb46a;
const pools = [];
for (let a = 2; a <= 6; a += 2) {
  for (let b = 2; b <= 6; b += 2) {
    const pl = new THREE.PointLight(warmPoolColor, 55, 260, 2);
    pl.position.set(ROADS[a] + 30, 6, ROADS[b] + 30);
    scene.add(pl);
    pools.push(pl);
  }
}
if (pools.length) {
  pools[pools.length - 1].intensity = 90; // the "downtown pulse"
  pools[pools.length - 1].position.set(0, 8, 0);
}

/* =========================================================================
   SKY — stars, moon, clouds, searchlight
   ========================================================================= */

// Gradient sky dome
{
  const c = makeCanvas(2, 512);
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#04060f');
  gr.addColorStop(0.55, '#0a1024');
  gr.addColorStop(0.85, '#16203a');
  gr.addColorStop(1, '#1c2844');
  g.fillStyle = gr;
  g.fillRect(0, 0, 2, 512);
  const tex = canvasTexture(c, true);
  const geo = new THREE.SphereGeometry(2700, 24, 12);
  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false });
  const dome = new THREE.Mesh(geo, mat);
  dome.renderOrder = -10;
  scene.add(dome);
}

// Stars
const starCount = 1300;
{
  const positions = new Float32Array(starCount * 3);
  const sizes = new Float32Array(starCount);
  for (let i = 0; i < starCount; i++) {
    const u = rng() * 2 - 1;
    const th = rng() * Math.PI * 2;
    const v = Math.sqrt(1 - u * u);
    const r = 2500;
    positions[i * 3]     = v * Math.cos(th) * r;
    positions[i * 3 + 1] = u * r * 0.72 + 260;   // keep mostly overhead
    positions[i * 3 + 2] = v * Math.sin(th) * r;
    sizes[i] = rng() < 0.06 ? 3.2 : 1.4 + rng() * 1.4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({
    color: 0xd7e4ff, size: 2.1, sizeAttenuation: true,
    transparent: true, opacity: 0.9, fog: false, depthWrite: false,
  });
  const stars = new THREE.Points(geo, mat);
  stars.renderOrder = -9;
  scene.add(stars);
  window.__stars = stars;
}

// Moon + halo
{
  const glow = radialGlowTexture('rgba(255,252,240,1)', 'rgba(255,250,230,0.20)', 'rgba(255,250,230,0)');
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialGlowTexture('rgba(230,240,255,0.5)', 'rgba(200,220,255,0.14)', 'rgba(180,210,255,0)'),
    transparent: true, depthWrite: false, opacity: 0.55, blending: THREE.AdditiveBlending, fog: false,
  }));
  halo.position.set(-260, 400, -210);
  halo.scale.setScalar(320);
  scene.add(halo);

  const disc = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glow, transparent: true, depthWrite: false, fog: false, toneMapped: false,
  }));
  disc.position.set(-260, 400, -210);
  disc.scale.setScalar(95);
  scene.add(disc);
}

// Drifting clouds
const clouds = [];
{
  const c = makeCanvas(256, 128);
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 128);
  g.shadowColor = '#aebedf'; g.shadowBlur = 18;
  for (let i = 0; i < 26; i++) {
    g.beginPath();
    g.arc(60 + rng() * 160, 30 + rng() * 70, 10 + rng() * 26, 0, 7);
    g.fillStyle = 'rgba(190,205,235,0.5)';
    g.fill();
  }
  const tex = canvasTexture(c, false);
  const matBase = { map: tex, transparent: true, depthWrite: false, fog: false, opacity: 1 };

  for (let i = 0; i < 7; i++) {
    const mat = new THREE.MeshBasicMaterial({ ...matBase, opacity: 0.10 + rng() * 0.08 });
    const geo = new THREE.PlaneGeometry(rand(500, 1100), rand(140, 260));
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-1600, 1600), rand(560, 1050), rand(-1600, 600));
    mesh.rotation.z = rng() * 0.4 - 0.2;
    mesh.rotation.y = rng() * 6.28;
    scene.add(mesh);
    clouds.push({ mesh, speed: rand(1.5, 5), dir: rng() < 0.5 ? 1 : -1 });
  }
}

// Centre searchlight beam
const searchlight = (() => {
  const geo = new THREE.CylinderGeometry(5, 130, 340, 24, 1, true);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffe9c0, transparent: true, opacity: 0.035,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: false, toneMapped: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(135, 170, 135);
  scene.add(mesh);
  return mesh;
})();

/* =========================================================================
   TRAFFIC — instanced cars with headlights, taillights, cabin
   ========================================================================= */

const DRIVING = {
  x: [1, -1, 0, 0],
  z: [0, 0, 1, -1],
  ang: [Math.PI / 2, -Math.PI / 2, 0, Math.PI],
};

const CAR_COLORS = [0x44556b, 0x3a4a5c, 0x6b5638, 0x8a2f2c, 0x2c5a52, 0x70757c, 0x27364a, 0xb04a2f, 0x1e3f57, 0xd8dde4];
const TAXI = 0xffc83d;

const carCount = 92;
const cars = [];

for (let i = 0; i < carCount; i++) {
  const dir = Math.floor(rng() * 4);
  const roadIdx = 1 + Math.floor(rng() * 9);
  const roadCoord = ROADS[roadIdx];
  const lat = rand(-1, 1) * (ROAD_W / 2 - 2.4);
  const start = rand(-1, 1) * (CITY / 2 - 24);
  const speed = rand(20, 46) * (dir === 0 || dir === 1 ? 1 : 1);
  const isTaxi = rng() < 0.075;
  const isPolice = i === 5;
  cars.push({
    dir, roadCoord, lat, speed, p: start,
    color: isPolice ? 0x14182a : (isTaxi ? TAXI : pick(CAR_COLORS)),
    police: isPolice,
  });
}

// Shared geometries
const bodyGeo   = new THREE.BoxGeometry(3.8, 1.05, 1.9);
const cabinGeo  = new THREE.BoxGeometry(2.0, 0.6, 1.55);
const lightGeo  = new THREE.PlaneGeometry(0.55, 0.28);

const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const cabinMat = new THREE.MeshLambertMaterial({ color: 0x0b0e14, emissive: 0x0d1420, emissiveIntensity: 0.35 });
const headMat = new THREE.MeshBasicMaterial({ color: 0xfff3cc, blending: THREE.AdditiveBlending, toneMapped: false, transparent: true, opacity: 0.9 });
const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2330, blending: THREE.AdditiveBlending, toneMapped: false, transparent: true, opacity: 0.95 });
const barMat  = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });

const bodies   = new THREE.InstancedMesh(bodyGeo, bodyMat, carCount);
const cabins   = new THREE.InstancedMesh(cabinGeo, cabinMat, carCount);
const heads    = new THREE.InstancedMesh(lightGeo, headMat, carCount * 2);
const tails    = new THREE.InstancedMesh(lightGeo, tailMat, carCount * 2);
const rooflight = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.7, 0.5), barMat, 2);
bodies.frustumCulled = false; cabins.frustumCulled = false;
heads.frustumCulled = false; tails.frustumCulled = false;
rooflight.frustumCulled = false;

const carGroupObj = new THREE.Group();
carGroupObj.add(bodies, cabins, heads, tails, rooflight);
scene.add(carGroupObj);

for (let i = 0; i < carCount; i++) {
  bodies.setColorAt(i, new THREE.Color(cars[i].color));
  heads.setColorAt(i * 2, new THREE.Color(0xfff3cc));
  heads.setColorAt(i * 2 + 1, new THREE.Color(0xfff3cc));
  tails.setColorAt(i * 2, new THREE.Color(0xff2a35));
  tails.setColorAt(i * 2 + 1, new THREE.Color(0xff2a35));
}
rooflight.setColorAt(0, new THREE.Color(0xff2222));
rooflight.setColorAt(1, new THREE.Color(0x2233ff));

const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _p = new THREE.Vector3();
const _o = new THREE.Vector3();
const _s = new THREE.Vector3(1, 1, 1);
const _bodyScale = new THREE.Vector3(1, 1, 1);
const _Y = new THREE.Vector3(0, 1, 0);

function updateCars(dt, time) {
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i];
    c.p = wrapRange(c.p + c.speed * dt, -(CITY / 2 - 20), CITY / 2 - 20);

    const dir = c.dir;
    let x, z;
    if (dir === 0 || dir === 1) { x = c.p; z = c.roadCoord + c.lat; }
    else { z = c.p; x = c.roadCoord + c.lat; }

    _q.setFromAxisAngle(_Y, DRIVING.ang[dir]);
    _p.set(x, 0.66, z);

    _m.compose(_p, _q, _bodyScale);
    bodies.setMatrixAt(i, _m);

    // cabin
    _o.set(0, 0.72, 0).applyQuaternion(_q).add(_p);
    _m.compose(_o, _q, _bodyScale);
    cabins.setMatrixAt(i, _m);

    // headlights (2) & taillights (2)
    for (let hl = 0; hl < 2; hl++) {
      const sx = hl === 0 ? 0.52 : -0.52;
      _o.set(sx, 0.06, 1.95).applyQuaternion(_q).add(_p);
      _m.compose(_o, _q, _s);
      heads.setMatrixAt(i * 2 + hl, _m);

      _o.set(sx, 0.06, -1.95).applyQuaternion(_q).add(_p);
      _m.compose(_o, _q, _s);
      tails.setMatrixAt(i * 2 + hl, _m);
    }

    // police light bar — flashing red/blue, follows the car
    if (c.police) {
      const on = (time * 2.2) % 1;
      const red = new THREE.Color(0xff2222);
      const blue = new THREE.Color(0x2233ff);
      rooflight.setColorAt(0, on < 0.5 ? red : blue);
      rooflight.setColorAt(1, on < 0.5 ? blue : red);

      _o.set(0, 0.66, 0).applyQuaternion(_q).add(_p);
      _m.compose(_o, _q, _s);
      rooflight.setMatrixAt(0, _m);
      _o.set(0.25, 0.66, 0).applyQuaternion(_q).add(_p);
      _m.compose(_o, _q, _s);
      rooflight.setMatrixAt(1, _m);

      rooflight.instanceMatrix.needsUpdate = true;
      if (rooflight.instanceColor) rooflight.instanceColor.needsUpdate = true;
    }
  }
  bodies.instanceMatrix.needsUpdate = true;
  cabins.instanceMatrix.needsUpdate = true;
  heads.instanceMatrix.needsUpdate = true;
  tails.instanceMatrix.needsUpdate = true;
}

/* =========================================================================
   PLANE CROSSING THE SKY
   ========================================================================= */

const plane = new THREE.Group();
{
  const fus = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.1, 14),
    new THREE.MeshLambertMaterial({ color: 0x33405c, emissive: 0x151e33, emissiveIntensity: 0.4 }));
  const wingL = new THREE.Mesh(new THREE.BoxGeometry(9, 0.2, 1.6),
    new THREE.MeshLambertMaterial({ color: 0x2b364f }));
  wingL.position.set(-4.2, 0, 0);
  const wingR = wingL.clone();
  wingR.position.x = 4.2;

  const navL = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3333, toneMapped: false }));
  navL.position.set(-2.5, 0, 7.2);
  const navR = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0x33ff66, toneMapped: false }));
  navR.position.set(2.5, 0, 7.2);
  const strobe = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }));
  strobe.position.set(0, 0.2, -7.4);

  plane.add(fus, wingL, wingR, navL, navR, strobe);
  scene.add(plane);
}

/* =========================================================================
   POST-PROCESSING (bloom) with graceful fallback
   ========================================================================= */

let composer = null;
let bloomPass = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.45, 0.6);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('Bloom disabled:', err);
  composer = null;
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'b' || e.key === 'B') {
    if (bloomPass) bloomPass.enabled = !bloomPass.enabled;
  }
});

/* =========================================================================
   RESIZE
   ========================================================================= */

// Read-only diagnostics hook (used by automated verification; harmless in-app)
window.__cityDebug = { calls: 0, triangles: 0, frames: 0, staticTriangles: 0 };
{
  let st = 0;
  scene.traverse((o) => {
    if (!o.geometry) return;
    const g = o.geometry;
    const n = g.index ? g.index.count : (g.attributes.position ? g.attributes.position.count : 0);
    st += Math.floor(n / 3) * (o.count || 1);
  });
  window.__cityDebug.staticTriangles = st;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) {
    composer.setSize(innerWidth, innerHeight);
    if (bloomPass) bloomPass.resolution.set(innerWidth, innerHeight);
  }
});

/* =========================================================================
   ANIMATION LOOP
   ========================================================================= */

function signMult(kind, t, phase, speed) {
  if (kind === 'blink') return ((t * 0.72 + phase) % 1.35) < 0.9 ? 1 : 0.06;
  if (kind === 'pulse') return 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * (0.7 + speed) + phase * 7));
  // stutter
  const s = Math.sin(t * 6.4 + phase * 13);
  return s > 0.55 ? 1 : (s > 0.1 ? 0.3 : 0.04);
}

const clock = new THREE.Clock();
let frames = 0, lastFps = performance.now(), fpsText = 0;
const statsEl = document.getElementById('stats');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateCars(dt, t);

  // Neon signs
  for (const s of signs) {
    s.mat.opacity = signMult(s.kind, t, s.phase, s.speed);
  }

  // Rooftop beacons
  for (const b of beacons) {
    const ph = (t * b.speed + b.phase) % 2.6;
    const on = ph < 0.22 ? Math.min(1, (0.22 - ph) * 22) : 0;
    b.mesh.material.opacity = on;
  }

  // Stars twinkle + slow rotation
  const stars = window.__stars;
  if (stars) {
    stars.material.opacity = 0.72 + 0.2 * Math.sin(t * 0.8);
    stars.rotation.y += dt * 0.004;
  }

  // Clouds drift
  for (const cld of clouds) {
    cld.mesh.position.x += cld.speed * cld.dir * dt;
    if (cld.mesh.position.x > 1800) cld.mesh.position.x = -1800;
    if (cld.mesh.position.x < -1800) cld.mesh.position.x = 1800;
  }

  // Searchlight rotation
  searchlight.rotation.y += dt * 0.35;

  // Flickering downtown pool light
  const pool = pools[pools.length - 1];
  pool.intensity += (pool.__target || 55 - pool.intensity) * dt * 6;
  if (Math.random() < 0.02) pool.__target = 25 + Math.random() * 70;

  // Airplane loop
  const pr = 1250, ph0 = t * 0.055;
  plane.position.set(Math.cos(ph0) * pr, 620, Math.sin(ph0) * pr * 0.9);
  plane.rotation.y = Math.PI / 2 + ph0;
  const turn = Math.floor(t * 1.15) % 2 === 0;
  plane.children[3].material.color.setHex(turn ? 0xff3333 : 0x2a2a2a);
  plane.children[4].material.color.setHex(turn ? 0x2a2a2a : 0x33ff66);
  plane.children[5].material.opacity = (Math.sin(t * 2.4) > 0.4) ? 1 : 0.15;
  plane.children[5].material.transparent = true;

  controls.update();

  if (composer) composer.render();
  else renderer.render(scene, camera);

  // diagnostics
  window.__cityDebug.calls = renderer.info.render.calls;
  window.__cityDebug.triangles = renderer.info.render.triangles;
  window.__cityDebug.frames++;

  // FPS readout
  frames++;
  const now = performance.now();
  if (now - lastFps > 500) {
    fpsText = Math.round((frames * 1000) / (now - lastFps));
    frames = 0;
    lastFps = now;
    statsEl.textContent = 'fps ' + fpsText + ' · ' + bodies.count + ' cars · ' + buildings.length + ' buildings';
  }
}

animate();

</script>
