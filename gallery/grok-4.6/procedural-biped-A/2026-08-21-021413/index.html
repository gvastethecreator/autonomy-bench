<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Biped</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);
    scene.fog = new THREE.Fog(0x0b1020, 12, 36);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(4.2, 2.4, 6.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x8ec5ff, 0x2a1a12, 0.55));

    const key = new THREE.DirectionalLight(0xfff2d8, 1.35);
    key.position.set(6, 10, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 24;
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    key.shadow.bias = -0.0008;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x66d2ff, 0.45);
    rim.position.set(-5, 3, -4);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(18, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2233, roughness: 0.92, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.35, 2.55, 64),
      new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 0.6, metalness: 0.2, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    const palette = {
      hide: 0x3ec6b2,
      dark: 0x1f4d4a,
      accent: 0xff7a59,
      eye: 0xf4f1c9,
      pupil: 0x14202a,
    };

    function mat(color, extras = {}) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.42,
        metalness: 0.12,
        ...extras,
      });
    }

    function limb(radius, length, color) {
      const mesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(radius, length, 6, 12),
        mat(color)
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.y = -length / 2;
      return mesh;
    }

    function ball(radius, color) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 18, 14), mat(color));
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function makeLeg(side) {
      const root = new THREE.Group();
      const hip = ball(0.11, palette.dark);
      hip.position.set(side * 0.22, 0, 0);
      root.add(hip);

      const thighPivot = new THREE.Group();
      thighPivot.position.set(side * 0.22, 0, 0);
      const thigh = limb(0.09, 0.62, palette.hide);
      thighPivot.add(thigh);

      const knee = new THREE.Group();
      knee.position.y = -0.72;
      knee.add(ball(0.08, palette.dark));
      const shin = limb(0.075, 0.58, palette.hide);
      shin.material = mat(palette.dark);
      knee.add(shin);

      const ankle = new THREE.Group();
      ankle.position.y = -0.66;
      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.08, 0.34),
        mat(palette.accent)
      );
      foot.castShadow = true;
      foot.position.set(0, -0.05, 0.08);
      ankle.add(foot);
      const toe = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.05, 0.12),
        mat(palette.accent)
      );
      toe.castShadow = true;
      toe.position.set(0, -0.055, 0.26);
      ankle.add(toe);

      knee.add(ankle);
      thighPivot.add(knee);
      root.add(thighPivot);
      return { root, thighPivot, knee, ankle };
    }

    function makeArm(side) {
      const root = new THREE.Group();
      const shoulder = ball(0.09, palette.dark);
      shoulder.position.set(side * 0.38, 0, 0);
      root.add(shoulder);

      const upperPivot = new THREE.Group();
      upperPivot.position.set(side * 0.38, 0, 0);
      const upper = limb(0.065, 0.42, palette.hide);
      upperPivot.add(upper);

      const elbow = new THREE.Group();
      elbow.position.y = -0.5;
      elbow.add(ball(0.06, palette.dark));
      const forearm = limb(0.055, 0.38, palette.dark);
      elbow.add(forearm);

      const wrist = new THREE.Group();
      wrist.position.y = -0.44;
      const hand = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 0.08, 0.12),
        mat(palette.accent)
      );
      hand.castShadow = true;
      hand.position.y = -0.05;
      wrist.add(hand);

      elbow.add(wrist);
      upperPivot.add(elbow);
      root.add(upperPivot);
      return { root, upperPivot, elbow, wrist };
    }

    const biped = new THREE.Group();
    scene.add(biped);

    const pelvis = new THREE.Group();
    pelvis.position.y = 1.28;
    biped.add(pelvis);

    const hips = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 20, 16),
      mat(palette.hide)
    );
    hips.scale.set(1.15, 0.72, 0.9);
    hips.castShadow = true;
    pelvis.add(hips);

    const spine = new THREE.Group();
    spine.position.y = 0.18;
    pelvis.add(spine);

    const torso = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.28, 0.42, 8, 16),
      mat(palette.hide)
    );
    torso.castShadow = true;
    torso.position.y = 0.38;
    spine.add(torso);

    const chestPlate = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 16, 12),
      mat(palette.dark)
    );
    chestPlate.scale.set(1.15, 0.7, 0.55);
    chestPlate.position.set(0, 0.42, 0.16);
    spine.add(chestPlate);

    const neck = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.08, 0.12, 6, 10),
      mat(palette.dark)
    );
    neck.position.y = 0.78;
    neck.castShadow = true;
    spine.add(neck);

    const headPivot = new THREE.Group();
    headPivot.position.y = 0.96;
    spine.add(headPivot);

    const skull = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 20, 16),
      mat(palette.hide)
    );
    skull.scale.set(0.95, 1.05, 1.05);
    skull.castShadow = true;
    headPivot.add(skull);

    const snout = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 14, 10),
      mat(palette.hide)
    );
    snout.scale.set(0.85, 0.7, 1.2);
    snout.position.set(0, -0.04, 0.18);
    headPivot.add(snout);

    const crest = new THREE.Mesh(
      new THREE.ConeGeometry(0.08, 0.28, 8),
      mat(palette.accent)
    );
    crest.position.set(0, 0.28, -0.04);
    crest.rotation.x = -0.35;
    crest.castShadow = true;
    headPivot.add(crest);

    function makeEye(side) {
      const eye = ball(0.055, palette.eye);
      eye.position.set(side * 0.1, 0.04, 0.17);
      const pupil = ball(0.028, palette.pupil);
      pupil.position.z = 0.038;
      eye.add(pupil);
      headPivot.add(eye);
    }
    makeEye(-1);
    makeEye(1);

    const leftArm = makeArm(-1);
    const rightArm = makeArm(1);
    leftArm.root.position.set(0, 0.58, 0);
    rightArm.root.position.set(0, 0.58, 0);
    spine.add(leftArm.root, rightArm.root);

    const leftLeg = makeLeg(-1);
    const rightLeg = makeLeg(1);
    pelvis.add(leftLeg.root, rightLeg.root);

    const clock = new THREE.Clock();
    const walkSpeed = 5.4;
    const stride = 0.55;

    function limbCycle(phase) {
      const swing = Math.sin(phase);
      const lift = Math.max(0, Math.sin(phase));
      const plant = Math.max(0, -Math.sin(phase));
      return {
        thigh: swing * stride,
        knee: lift * 1.05 + plant * 0.12,
        ankle: -swing * 0.28 - lift * 0.18,
        lift,
      };
    }

    function armCycle(phase) {
      const swing = Math.sin(phase);
      return {
        upper: swing * 0.55,
        elbow: 0.35 + Math.max(0, -swing) * 0.45,
      };
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const phase = t * walkSpeed;

      const L = limbCycle(phase);
      const R = limbCycle(phase + Math.PI);
      const aL = armCycle(phase + Math.PI);
      const aR = armCycle(phase);

      leftLeg.thighPivot.rotation.x = L.thigh;
      leftLeg.knee.rotation.x = L.knee;
      leftLeg.ankle.rotation.x = L.ankle;
      rightLeg.thighPivot.rotation.x = R.thigh;
      rightLeg.knee.rotation.x = R.knee;
      rightLeg.ankle.rotation.x = R.ankle;

      leftArm.upperPivot.rotation.x = aL.upper;
      leftArm.elbow.rotation.x = aL.elbow;
      rightArm.upperPivot.rotation.x = aR.upper;
      rightArm.elbow.rotation.x = aR.elbow;

      pelvis.position.y = 1.28 + Math.abs(Math.sin(phase)) * 0.045;
      pelvis.rotation.y = Math.sin(phase) * 0.08;
      pelvis.rotation.z = Math.sin(phase) * 0.05;
      spine.rotation.y = -Math.sin(phase) * 0.12;
      spine.rotation.x = 0.06 + Math.sin(phase * 2) * 0.03;
      headPivot.rotation.y = Math.sin(phase) * 0.1;
      headPivot.rotation.x = -0.08 + Math.sin(phase * 2) * 0.04;

      const orbit = t * 0.18;
      camera.position.set(Math.cos(orbit) * 7.2, 2.5, Math.sin(orbit) * 7.2);
      camera.lookAt(0, 1.15, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
