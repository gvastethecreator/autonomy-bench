<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First-Person Rollercoaster</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1220;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 80, 420);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xb8d4ff, 0x4a6b3a, 0.85);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4d6, 1.35);
    sun.position.set(80, 140, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.left = -160;
    sun.shadow.camera.right = 160;
    sun.shadow.camera.top = 160;
    sun.shadow.camera.bottom = -160;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x88aaff, 0.25);
    fill.position.set(-40, 30, -60);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(280, 64),
      new THREE.MeshStandardMaterial({ color: 0x3d7a3a, roughness: 0.92 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const plaza = new THREE.Mesh(
      new THREE.CircleGeometry(38, 48),
      new THREE.MeshStandardMaterial({ color: 0x6b6b6b, roughness: 0.8 })
    );
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.02;
    plaza.receiveShadow = true;
    scene.add(plaza);

    function addTree(x, z, scale) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28 * scale, 0.4 * scale, 2.4 * scale, 6),
        new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.9 })
      );
      trunk.position.y = 1.2 * scale;
      trunk.castShadow = true;
      const foliage = new THREE.Mesh(
        new THREE.ConeGeometry(1.8 * scale, 4.2 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x2e6b32, roughness: 0.85 })
      );
      foliage.position.y = 3.6 * scale;
      foliage.castShadow = true;
      group.add(trunk, foliage);
      group.position.set(x, 0, z);
      scene.add(group);
    }

    const treeRng = mulberry32(42);
    for (let i = 0; i < 70; i++) {
      const a = treeRng() * Math.PI * 2;
      const r = 50 + treeRng() * 200;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (Math.hypot(x, z) < 42) continue;
      addTree(x, z, 0.8 + treeRng() * 1.4);
    }

    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const trackPoints = [
      new THREE.Vector3(0, 6, 0),
      new THREE.Vector3(18, 8, 12),
      new THREE.Vector3(32, 18, 8),
      new THREE.Vector3(38, 28, -10),
      new THREE.Vector3(22, 34, -28),
      new THREE.Vector3(-4, 22, -36),
      new THREE.Vector3(-24, 10, -22),
      new THREE.Vector3(-18, 8, 4),
      new THREE.Vector3(-8, 16, 22),
      new THREE.Vector3(10, 26, 34),
      new THREE.Vector3(28, 40, 24),
      new THREE.Vector3(36, 48, 4),
      new THREE.Vector3(20, 36, -16),
      new THREE.Vector3(-6, 14, -18),
      new THREE.Vector3(-28, 12, 6),
      new THREE.Vector3(-22, 20, 28),
      new THREE.Vector3(4, 12, 18),
      new THREE.Vector3(8, 7, 4)
    ];

    const curve = new THREE.CatmullRomCurve3(trackPoints, true, "catmullrom", 0.35);
    const frames = curve.computeFrenetFrames(400, true);

    const railMat = new THREE.MeshStandardMaterial({
      color: 0xc9d4e0,
      metalness: 0.85,
      roughness: 0.28
    });
    const spineMat = new THREE.MeshStandardMaterial({
      color: 0x1f3a73,
      metalness: 0.35,
      roughness: 0.45
    });
    const woodMat = new THREE.MeshStandardMaterial({
      color: 0x6b3b1f,
      roughness: 0.82
    });
    const supportMat = new THREE.MeshStandardMaterial({
      color: 0x2a2f38,
      metalness: 0.5,
      roughness: 0.4
    });

    const spine = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 420, 0.18, 10, true),
      spineMat
    );
    spine.castShadow = true;
    spine.receiveShadow = true;
    scene.add(spine);

    function offsetCurve(offset) {
      const pts = [];
      const n = 280;
      const binormal = new THREE.Vector3();
      const pos = new THREE.Vector3();
      for (let i = 0; i < n; i++) {
        const t = i / n;
        curve.getPointAt(t, pos);
        const idx = Math.min(Math.floor(t * frames.binormals.length), frames.binormals.length - 1);
        binormal.copy(frames.binormals[idx]).normalize();
        pts.push(pos.clone().addScaledVector(binormal, offset));
      }
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.2);
    }

    const leftRail = new THREE.Mesh(
      new THREE.TubeGeometry(offsetCurve(0.55), 360, 0.07, 8, true),
      railMat
    );
    const rightRail = new THREE.Mesh(
      new THREE.TubeGeometry(offsetCurve(-0.55), 360, 0.07, 8, true),
      railMat
    );
    leftRail.castShadow = true;
    rightRail.castShadow = true;
    scene.add(leftRail, rightRail);

    const tieGeom = new THREE.BoxGeometry(1.35, 0.08, 0.16);
    const supportGeom = new THREE.CylinderGeometry(0.12, 0.18, 1, 8);
    const pos = new THREE.Vector3();
    const tangent = new THREE.Vector3();
    const normal = new THREE.Vector3();
    const binormal = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const up = new THREE.Vector3(0, 1, 0);
    const look = new THREE.Matrix4();

    for (let i = 0; i < 220; i++) {
      const t = i / 220;
      curve.getPointAt(t, pos);
      curve.getTangentAt(t, tangent);
      const idx = Math.min(Math.floor(t * frames.normals.length), frames.normals.length - 1);
      normal.copy(frames.normals[idx]);
      binormal.copy(frames.binormals[idx]);
      look.makeBasis(binormal, normal, tangent);
      quat.setFromRotationMatrix(look);

      const tie = new THREE.Mesh(tieGeom, woodMat);
      tie.position.copy(pos);
      tie.quaternion.copy(quat);
      tie.castShadow = true;
      scene.add(tie);

      if (i % 4 === 0 && pos.y > 1.2) {
        const height = pos.y;
        const support = new THREE.Mesh(supportGeom, supportMat);
        support.scale.y = height;
        support.position.set(pos.x, height / 2, pos.z);
        support.castShadow = true;
        scene.add(support);
      }
    }

    const car = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.32, 1.15),
      new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.25, roughness: 0.4 })
    );
    body.position.y = 0.05;
    body.castShadow = true;
    const nose = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.22, 0.28),
      new THREE.MeshStandardMaterial({ color: 0x8e1b14, metalness: 0.3, roughness: 0.4 })
    );
    nose.position.set(0, 0.02, 0.68);
    const seat = new THREE.Mesh(
      new THREE.BoxGeometry(0.58, 0.28, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 })
    );
    seat.position.set(0, 0.22, -0.18);
    car.add(body, nose, seat);
    scene.add(car);

    const lookAhead = new THREE.Vector3();
    const camPos = new THREE.Vector3();
    const camTarget = new THREE.Vector3();
    const worldUp = new THREE.Vector3(0, 1, 0);
    const camOffset = new THREE.Vector3();

    let t = 0;
    let last = performance.now();
    const duration = 42;

    function speedAt(u) {
      const sample = curve.getPointAt(u);
      const heightFactor = THREE.MathUtils.clamp((52 - sample.y) / 48, 0.55, 1.55);
      return heightFactor;
    }

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      t = (t + (dt / duration) * speedAt(t)) % 1;

      curve.getPointAt(t, pos);
      curve.getTangentAt(t, tangent);
      const idx = Math.min(Math.floor(t * frames.normals.length), frames.normals.length - 1);
      normal.copy(frames.normals[idx]);
      if (normal.y < 0) normal.negate();
      binormal.copy(frames.binormals[idx]);

      look.makeBasis(binormal, normal, tangent);
      quat.setFromRotationMatrix(look);
      car.position.copy(pos).addScaledVector(normal, 0.42);
      car.quaternion.copy(quat);

      camOffset.copy(normal).multiplyScalar(0.62).addScaledVector(tangent, -0.12);
      camPos.copy(pos).add(camOffset);
      const ahead = (t + 0.012) % 1;
      curve.getPointAt(ahead, lookAhead);
      camTarget.copy(lookAhead).addScaledVector(normal, 0.45);
      camera.position.copy(camPos);
      camera.up.lerp(worldUp, 0.15).normalize();
      camera.lookAt(camTarget);

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>
