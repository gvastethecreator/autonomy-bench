<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First-Person Rollercoaster</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xc9a078, 0.0048);
    scene.background = new THREE.Color(0xc9a078);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.12, 2800);
    const cart = new THREE.Object3D();
    cart.matrixAutoUpdate = false;
    scene.add(cart);
    cart.add(camera);
    camera.position.set(0, 1.02, 0.18);

    function makeSkyTexture() {
      const c = document.createElement("canvas");
      c.width = 4;
      c.height = 512;
      const g = c.getContext("2d");
      const grd = g.createLinearGradient(0, 0, 0, 512);
      grd.addColorStop(0, "#0a1630");
      grd.addColorStop(0.38, "#3a4a8a");
      grd.addColorStop(0.55, "#e07038");
      grd.addColorStop(0.72, "#f0b060");
      grd.addColorStop(1, "#f6d9a8");
      g.fillStyle = grd;
      g.fillRect(0, 0, 4, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(1600, 32, 16),
      new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, depthWrite: false, fog: false })
    );
    scene.add(sky);

    const hemi = new THREE.HemisphereLight(0xffd4a8, 0x3a4a28, 0.72);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffe2b0, 2.15);
    sun.position.set(-180, 220, 90);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 700;
    sun.shadow.camera.left = -220;
    sun.shadow.camera.right = 220;
    sun.shadow.camera.top = 220;
    sun.shadow.camera.bottom = -220;
    sun.shadow.bias = -0.00025;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x406080, 0.22));

    const sunBall = new THREE.Mesh(
      new THREE.SphereGeometry(28, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xfff1c2, fog: false })
    );
    sunBall.position.copy(sun.position).setLength(900);
    scene.add(sunBall);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(900, 72),
      new THREE.MeshStandardMaterial({ color: 0x4a6a38, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const lake = new THREE.Mesh(
      new THREE.CircleGeometry(58, 48),
      new THREE.MeshStandardMaterial({
        color: 0x2a6a88,
        roughness: 0.18,
        metalness: 0.55,
        envMapIntensity: 0.8
      })
    );
    lake.rotation.x = -Math.PI / 2;
    lake.position.set(42, 0.12, 118);
    lake.receiveShadow = true;
    scene.add(lake);

    function addMountainRing() {
      const geo = new THREE.ConeGeometry(1, 1, 5);
      const mat = new THREE.MeshStandardMaterial({ color: 0x5a5348, roughness: 1, flatShading: true });
      const count = 28;
      const mesh = new THREE.InstancedMesh(geo, mat, count);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      const dummy = new THREE.Object3D();
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + 0.2;
        const r = 420 + (i % 5) * 38;
        dummy.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        const h = 70 + (i * 37) % 130;
        dummy.scale.set(38 + (i % 7) * 8, h, 38 + (i % 4) * 10);
        dummy.rotation.y = a;
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      scene.add(mesh);
    }
    addMountainRing();

    function buildPath() {
      const pts = [];
      pts.push(new THREE.Vector3(0, 7.2, -95));
      pts.push(new THREE.Vector3(0, 7.2, -62));
      pts.push(new THREE.Vector3(4, 7.4, -28));
      pts.push(new THREE.Vector3(8, 18, 8));
      pts.push(new THREE.Vector3(10, 38, 42));
      pts.push(new THREE.Vector3(10, 58, 78));
      pts.push(new THREE.Vector3(12, 64, 96));
      pts.push(new THREE.Vector3(22, 62, 112));
      pts.push(new THREE.Vector3(38, 28, 128));
      pts.push(new THREE.Vector3(58, 9.5, 132));
      pts.push(new THREE.Vector3(86, 12, 118));
      pts.push(new THREE.Vector3(108, 18, 88));
      pts.push(new THREE.Vector3(112, 24, 52));
      pts.push(new THREE.Vector3(92, 16, 22));
      pts.push(new THREE.Vector3(62, 11, 8));
      pts.push(new THREE.Vector3(28, 26, -2));
      pts.push(new THREE.Vector3(4, 12, -8));
      pts.push(new THREE.Vector3(-22, 32, -6));
      pts.push(new THREE.Vector3(-48, 14, 8));
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        const a = Math.PI * 0.15 + t * Math.PI * 2.15;
        const r = 26 - t * 4;
        pts.push(new THREE.Vector3(-72 + Math.cos(a) * r, 11 + t * 16, 36 + Math.sin(a) * r));
      }
      pts.push(new THREE.Vector3(-58, 22, -18));
      pts.push(new THREE.Vector3(-36, 13, -48));
      pts.push(new THREE.Vector3(-14, 9, -74));
      pts.push(new THREE.Vector3(-4, 7.4, -88));
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.32);
    }

    const curve = buildPath();
    const FRAME_N = 1800;
    const frames = (() => {
      const tangents = [];
      const normals = [];
      const binormals = [];
      for (let i = 0; i <= FRAME_N; i++) {
        tangents.push(curve.getTangentAt(i / FRAME_N).normalize());
      }
      const n0 = new THREE.Vector3(0, 1, 0);
      n0.addScaledVector(tangents[0], -n0.dot(tangents[0]));
      if (n0.lengthSq() < 1e-6) n0.set(1, 0, 0).cross(tangents[0]);
      n0.normalize();
      normals.push(n0);
      binormals.push(new THREE.Vector3().crossVectors(tangents[0], n0).normalize());
      const q = new THREE.Quaternion();
      const axis = new THREE.Vector3();
      for (let i = 1; i <= FRAME_N; i++) {
        axis.crossVectors(tangents[i - 1], tangents[i]);
        const s = axis.length();
        if (s > 1e-8) {
          axis.multiplyScalar(1 / s);
          q.setFromAxisAngle(axis, Math.asin(Math.min(1, s)));
          normals.push(normals[i - 1].clone().applyQuaternion(q));
        } else {
          normals.push(normals[i - 1].clone());
        }
        normals[i].addScaledVector(tangents[i], -normals[i].dot(tangents[i])).normalize();
        if (normals[i].y < 0) normals[i].negate();
        binormals.push(new THREE.Vector3().crossVectors(tangents[i], normals[i]).normalize());
      }
      const twist = normals[0].clone();
      const endN = normals[FRAME_N];
      const close = new THREE.Quaternion().setFromUnitVectors(endN, twist);
      for (let i = 1; i <= FRAME_N; i++) {
        const t = i / FRAME_N;
        const qi = new THREE.Quaternion().slerpQuaternions(new THREE.Quaternion(), close, t);
        normals[i].applyQuaternion(qi);
        normals[i].addScaledVector(tangents[i], -normals[i].dot(tangents[i])).normalize();
        if (normals[i].y < 0) normals[i].negate();
        binormals[i].crossVectors(tangents[i], normals[i]).normalize();
      }
      return { tangents, normals, binormals };
    })();

    function frameAt(u) {
      const t = ((u % 1) + 1) % 1;
      const x = t * FRAME_N;
      const i = Math.floor(x) % FRAME_N;
      const f = x - Math.floor(x);
      const j = (i + 1) % FRAME_N;
      const pos = curve.getPointAt(t);
      const tan = frames.tangents[i].clone().lerp(frames.tangents[j], f).normalize();
      const nrm = frames.normals[i].clone().lerp(frames.normals[j], f).normalize();
      const bin = frames.binormals[i].clone().lerp(frames.binormals[j], f).normalize();
      return { pos, tan, nrm, bin };
    }

    function offsetSamples(side, up) {
      const pts = [];
      for (let i = 0; i <= FRAME_N; i++) {
        const p = curve.getPointAt(i / FRAME_N);
        pts.push(
          p.clone()
            .addScaledVector(frames.binormals[i], side)
            .addScaledVector(frames.normals[i], up)
        );
      }
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.15);
    }

    const railL = offsetSamples(-0.48, 0.08);
    const railR = offsetSamples(0.48, 0.08);
    const spine = offsetSamples(0, -0.12);

    const steel = new THREE.MeshStandardMaterial({
      color: 0xcfd6de,
      metalness: 0.82,
      roughness: 0.28
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x2a3038,
      metalness: 0.7,
      roughness: 0.4
    });
    const wood = new THREE.MeshStandardMaterial({
      color: 0x6b4423,
      roughness: 0.82,
      metalness: 0.05
    });

    function addTube(path, radius, segs, mat) {
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, segs, radius, 8, true), mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }
    addTube(railL, 0.09, 700, steel);
    addTube(railR, 0.09, 700, steel);
    addTube(spine, 0.07, 700, darkSteel);

    const tieGeo = new THREE.BoxGeometry(1.12, 0.08, 0.16);
    const tieCount = 420;
    const ties = new THREE.InstancedMesh(tieGeo, wood, tieCount);
    ties.castShadow = true;
    ties.receiveShadow = true;
    const dummy = new THREE.Object3D();
    const basis = new THREE.Matrix4();
    for (let i = 0; i < tieCount; i++) {
      const fr = frameAt(i / tieCount);
      dummy.position.copy(fr.pos).addScaledVector(fr.nrm, -0.02);
      basis.makeBasis(fr.bin, fr.nrm, fr.tan.clone().negate());
      dummy.quaternion.setFromRotationMatrix(basis);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      ties.setMatrixAt(i, dummy.matrix);
    }
    scene.add(ties);

    const supportGeo = new THREE.CylinderGeometry(0.09, 0.14, 1, 6);
    const supportMat = new THREE.MeshStandardMaterial({ color: 0x889199, metalness: 0.55, roughness: 0.45 });
    const supportN = 160;
    const supports = new THREE.InstancedMesh(supportGeo, supportMat, supportN * 2);
    supports.castShadow = true;
    supports.receiveShadow = true;
    const upY = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3();
    let si = 0;
    for (let i = 0; i < supportN; i++) {
      const fr = frameAt(i / supportN);
      if (fr.pos.y < 9.5) continue;
      for (const side of [-1, 1]) {
        const top = fr.pos.clone().addScaledVector(fr.bin, side * 0.7).addScaledVector(fr.nrm, -0.15);
        const bot = new THREE.Vector3(top.x + side * 1.6, 0, top.z);
        const len = top.distanceTo(bot);
        dummy.position.copy(bot).add(top).multiplyScalar(0.5);
        dir.subVectors(top, bot).normalize();
        dummy.quaternion.setFromUnitVectors(upY, dir);
        dummy.scale.set(1, len, 1);
        dummy.updateMatrix();
        supports.setMatrixAt(si++, dummy.matrix);
      }
    }
    supports.count = si;
    scene.add(supports);

    const treeTrunk = new THREE.CylinderGeometry(0.28, 0.42, 3.2, 5);
    const treeCanopy = new THREE.ConeGeometry(2.4, 6.2, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3424, roughness: 1, flatShading: true });
    const canopyMat = new THREE.MeshStandardMaterial({ color: 0x2f5a28, roughness: 0.9, flatShading: true });
    const TREE_N = 90;
    const trunks = new THREE.InstancedMesh(treeTrunk, trunkMat, TREE_N);
    const canopies = new THREE.InstancedMesh(treeCanopy, canopyMat, TREE_N);
    trunks.castShadow = true;
    canopies.castShadow = true;
    canopies.receiveShadow = true;
    const trackXZ = [];
    for (let i = 0; i < 80; i++) {
      const p = curve.getPointAt(i / 80);
      trackXZ.push(p);
    }
    let planted = 0;
    let guard = 0;
    while (planted < TREE_N && guard < 800) {
      guard++;
      const a = Math.random() * Math.PI * 2;
      const r = 40 + Math.random() * 280;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      let ok = true;
      for (const p of trackXZ) {
        const dx = p.x - x;
        const dz = p.z - z;
        if (dx * dx + dz * dz < 220) { ok = false; break; }
      }
      if ((x - 42) * (x - 42) + (z - 118) * (z - 118) < 70 * 70) ok = false;
      if (!ok) continue;
      const s = 0.7 + Math.random() * 1.1;
      dummy.position.set(x, 1.6 * s, z);
      dummy.scale.set(s, s, s);
      dummy.quaternion.identity();
      dummy.updateMatrix();
      trunks.setMatrixAt(planted, dummy.matrix);
      dummy.position.y = 4.8 * s;
      dummy.updateMatrix();
      canopies.setMatrixAt(planted, dummy.matrix);
      planted++;
    }
    scene.add(trunks);
    scene.add(canopies);

    const barMat = new THREE.MeshStandardMaterial({ color: 0x1a1c20, metalness: 0.4, roughness: 0.5 });
    const lap = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.035, 8, 18, Math.PI), barMat);
    lap.rotation.x = Math.PI * 0.55;
    lap.position.set(0, 0.62, -0.22);
    cart.add(lap);
    const nose = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.06, 0.55), barMat);
    nose.position.set(0, 0.28, -0.85);
    cart.add(nose);
    for (const sx of [-0.46, 0.46]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 1.4), steel);
      rail.position.set(sx, 0.32, -0.35);
      cart.add(rail);
    }

    const lengths = curve.getLengths(FRAME_N);
    const totalLen = lengths[lengths.length - 1];
    let hMax = 0;
    for (let i = 0; i <= 200; i++) hMax = Math.max(hMax, curve.getPointAt(i / 200).y);

    let arc = 12;
    const clock = new THREE.Clock();
    const look = new THREE.Vector3();
    const zAxis = new THREE.Vector3();

    function uFromArc(s) {
      const d = ((s % totalLen) + totalLen) % totalLen;
      let lo = 0;
      let hi = FRAME_N;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (lengths[mid] < d) lo = mid + 1;
        else hi = mid;
      }
      const i = Math.max(1, lo);
      const a0 = lengths[i - 1];
      const a1 = lengths[i];
      const f = a1 === a0 ? 0 : (d - a0) / (a1 - a0);
      return (i - 1 + f) / FRAME_N;
    }

    function tick() {
      const dt = Math.min(0.05, clock.getDelta());
      const u = uFromArc(arc);
      const fr = frameAt(u);
      const speed = Math.max(7.5, Math.sqrt(Math.max(0.4, 2 * 9.81 * (hMax + 3.5 - fr.pos.y))) * 1.05);
      arc += speed * dt;

      dummy.position.copy(fr.pos).addScaledVector(fr.nrm, 0.42);
      zAxis.copy(fr.tan).negate();
      basis.makeBasis(fr.bin, fr.nrm, zAxis);
      dummy.quaternion.setFromRotationMatrix(basis);
      dummy.updateMatrix();
      cart.matrix.copy(dummy.matrix);

      look.copy(fr.tan);
      camera.up.copy(fr.nrm);
      sky.position.copy(fr.pos);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
