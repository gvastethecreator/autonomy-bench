<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dusk Line — First-Person Rollercoaster</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #e8eef8;
    }
    #title {
      position: absolute;
      top: 28px;
      left: 32px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 12px;
      opacity: 0.72;
    }
    #title strong {
      display: block;
      margin-top: 6px;
      letter-spacing: 0.08em;
      font-size: 22px;
      font-weight: 650;
      opacity: 1;
    }
    #stats {
      position: absolute;
      right: 32px;
      bottom: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      opacity: 0.8;
    }
    #vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.55) 100%);
    }
    #bar {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 54px;
      background: linear-gradient(#2a3038, #12151a);
      border-top: 3px solid #8a93a0;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
    }
    #bar::before, #bar::after {
      content: "";
      position: absolute;
      top: -42px;
      width: 14px;
      height: 42px;
      background: #6d7580;
      border-radius: 3px 3px 0 0;
    }
    #bar::before { left: 18%; }
    #bar::after { right: 18%; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">Amusement Park<div><strong>Dusk Line</strong></div></div>
    <div id="stats">continuous circuit</div>
    <div id="vignette"></div>
    <div id="bar"></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1220);
    scene.fog = new THREE.FogExp2(0x0a1220, 0.012);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 900);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x6a86b8, 0x1a120c, 0.55));
    const sun = new THREE.DirectionalLight(0xffc38a, 1.15);
    sun.position.set(-40, 80, 30);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x223044, 0.35));

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(280, 64),
      new THREE.MeshStandardMaterial({ color: 0x1c3a24, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const plaza = new THREE.Mesh(
      new THREE.CircleGeometry(18, 32),
      new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.8 })
    );
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.set(-36, 0.04, 0);
    scene.add(plaza);

    function makeTrackPoints() {
      const pts = [];
      pts.push(new THREE.Vector3(-48, 6.2, 0));
      pts.push(new THREE.Vector3(-18, 6.2, 2));
      pts.push(new THREE.Vector3(18, 7.5, 6));
      pts.push(new THREE.Vector3(52, 22, 10));
      pts.push(new THREE.Vector3(82, 46, 8));
      pts.push(new THREE.Vector3(108, 62, 2));
      pts.push(new THREE.Vector3(128, 64, -8));
      pts.push(new THREE.Vector3(148, 38, -18));
      pts.push(new THREE.Vector3(168, 14, -32));
      pts.push(new THREE.Vector3(182, 8.5, -58));
      pts.push(new THREE.Vector3(176, 11, -92));
      pts.push(new THREE.Vector3(146, 14, -118));
      pts.push(new THREE.Vector3(104, 16, -122));
      pts.push(new THREE.Vector3(68, 13, -100));
      pts.push(new THREE.Vector3(52, 10, -68));
      pts.push(new THREE.Vector3(46, 9, -36));

      const loopR = 18;
      const loopX = 44;
      const loopZ = -8;
      for (let i = 1; i <= 16; i++) {
        const t = (i / 16) * Math.PI * 2;
        pts.push(new THREE.Vector3(
          loopX + i * 0.42,
          8 + loopR * (1 - Math.cos(t)),
          loopZ + loopR * Math.sin(t)
        ));
      }

      pts.push(new THREE.Vector3(54, 9, 22));
      pts.push(new THREE.Vector3(72, 16, 48));

      for (let i = 0; i <= 20; i++) {
        const t = (i / 20) * Math.PI * 3.2;
        const rad = 30 - i * 0.35;
        pts.push(new THREE.Vector3(
          102 + Math.cos(t) * rad,
          14 + Math.sin(i / 20 * Math.PI) * 16,
          72 + Math.sin(t) * rad
        ));
      }

      pts.push(new THREE.Vector3(70, 22, 28));
      pts.push(new THREE.Vector3(28, 18, 14));
      pts.push(new THREE.Vector3(-8, 10, 8));
      pts.push(new THREE.Vector3(-32, 6.6, 3));
      return pts;
    }

    const curve = new THREE.CatmullRomCurve3(makeTrackPoints(), true, "catmullrom", 0.18);
    const FRAME_N = 900;
    const frames = curve.computeFrenetFrames(FRAME_N, true);
    const lengths = curve.getLengths(FRAME_N);
    const totalLen = lengths[lengths.length - 1];

    function sampleFrame(u) {
      const wrapped = ((u % 1) + 1) % 1;
      const t = wrapped * FRAME_N;
      const i = Math.floor(t) % FRAME_N;
      const j = (i + 1) % FRAME_N;
      const f = t - Math.floor(t);
      const tangent = frames.tangents[i].clone().lerp(frames.tangents[j], f).normalize();
      const normal = frames.normals[i].clone().lerp(frames.normals[j], f).normalize();
      const binormal = frames.binormals[i].clone().lerp(frames.binormals[j], f).normalize();
      const point = curve.getPointAt(wrapped);
      return { point, tangent, normal, binormal };
    }

    function offsetPath(lateral, up) {
      const pts = [];
      for (let i = 0; i < FRAME_N; i++) {
        const f = sampleFrame(i / FRAME_N);
        pts.push(
          f.point.clone()
            .addScaledVector(f.binormal, lateral)
            .addScaledVector(f.normal, up)
        );
      }
      return new THREE.CatmullRomCurve3(pts, true);
    }

    const railMat = new THREE.MeshStandardMaterial({
      color: 0xc5ccd6,
      metalness: 0.92,
      roughness: 0.22,
      envMapIntensity: 1.2
    });
    const spineMat = new THREE.MeshStandardMaterial({
      color: 0x1a1f28,
      metalness: 0.4,
      roughness: 0.55,
      emissive: 0x3a1408,
      emissiveIntensity: 0.35
    });

    const leftRail = new THREE.Mesh(new THREE.TubeGeometry(offsetPath(-0.52, 0.16), 700, 0.07, 7, true), railMat);
    const rightRail = new THREE.Mesh(new THREE.TubeGeometry(offsetPath(0.52, 0.16), 700, 0.07, 7, true), railMat);
    const spine = new THREE.Mesh(new THREE.TubeGeometry(offsetPath(0, -0.08), 500, 0.16, 6, true), spineMat);
    scene.add(leftRail, rightRail, spine);

    const tieGeo = new THREE.BoxGeometry(1.28, 0.08, 0.16);
    const tieMat = new THREE.MeshStandardMaterial({ color: 0x4a3424, roughness: 0.9 });
    const tieCount = 220;
    const ties = new THREE.InstancedMesh(tieGeo, tieMat, tieCount);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < tieCount; i++) {
      const f = sampleFrame(i / tieCount);
      dummy.position.copy(f.point).addScaledVector(f.normal, 0.02);
      dummy.up.copy(f.normal);
      dummy.lookAt(f.point.clone().add(f.tangent));
      dummy.updateMatrix();
      ties.setMatrixAt(i, dummy.matrix);
    }
    scene.add(ties);

    const supportGeo = new THREE.CylinderGeometry(0.12, 0.18, 1, 6);
    const supportMat = new THREE.MeshStandardMaterial({ color: 0x2c313a, metalness: 0.55, roughness: 0.4 });
    const supportCount = 70;
    const supports = new THREE.InstancedMesh(supportGeo, supportMat, supportCount);
    let placed = 0;
    for (let i = 0; i < supportCount; i++) {
      const f = sampleFrame(i / supportCount);
      const h = Math.max(0.6, f.point.y - 0.2);
      dummy.position.set(f.point.x, h / 2, f.point.z);
      dummy.scale.set(1, h, 1);
      dummy.rotation.set(0, 0, 0);
      dummy.quaternion.identity();
      dummy.updateMatrix();
      supports.setMatrixAt(placed++, dummy.matrix);
    }
    supports.count = placed;
    scene.add(supports);

    const treeMat = new THREE.MeshStandardMaterial({ color: 0x16351c, roughness: 0.85 });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2416, roughness: 0.9 });
    for (let i = 0; i < 42; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = 38 + Math.random() * 150;
      const x = Math.cos(ang) * rad;
      const z = Math.sin(ang) * rad;
      if (Math.hypot(x + 36, z) < 22) continue;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 2.4, 5), trunkMat);
      trunk.position.set(x, 1.2, z);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.8 + Math.random(), 4.2, 7), treeMat);
      crown.position.set(x, 4.1, z);
      scene.add(trunk, crown);
    }

    const ferris = new THREE.Group();
    ferris.position.set(-90, 22, -70);
    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(16, 0.35, 8, 32),
      new THREE.MeshStandardMaterial({ color: 0x8890a0, metalness: 0.7, roughness: 0.3 })
    );
    ferris.add(wheel);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0xc45a4a, roughness: 0.45 });
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 1.4), cabinMat);
      cabin.position.set(Math.cos(a) * 16, Math.sin(a) * 16, 0);
      ferris.add(cabin);
    }
    const axle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 6, 8),
      new THREE.MeshStandardMaterial({ color: 0x555c66, metalness: 0.6, roughness: 0.4 })
    );
    axle.rotation.x = Math.PI / 2;
    ferris.add(axle);
    scene.add(ferris);

    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) {
      const r = 220 + Math.random() * 180;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(0.15 + Math.random() * 0.7);
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.cos(phi);
      starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xe8f0ff, size: 0.7 })));

    const lampColors = [0xff6b3d, 0x4ec6ff, 0xffd15c, 0xe05cff];
    for (let i = 0; i < 12; i++) {
      const f = sampleFrame(i / 12);
      const light = new THREE.PointLight(lampColors[i % lampColors.length], 6.5, 28, 2);
      light.position.copy(f.point).add(new THREE.Vector3(0, 1.4, 0));
      scene.add(light);
    }

    const stationLight = new THREE.PointLight(0xffe0b0, 12, 36, 2);
    stationLight.position.set(-36, 8, 0);
    scene.add(stationLight);

    let minH = Infinity;
    let maxH = -Infinity;
    for (let i = 0; i <= 200; i++) {
      const y = curve.getPointAt(i / 200).y;
      minH = Math.min(minH, y);
      maxH = Math.max(maxH, y);
    }

    let distance = 0;
    const clock = new THREE.Clock();
    const statsEl = document.getElementById("stats");
    const lookTarget = new THREE.Vector3();
    const camPos = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      ferris.rotation.z += dt * 0.18;

      const u = (distance / totalLen) % 1;
      const f = sampleFrame(u);
      const energy = Math.max(0, maxH + 4 - f.point.y);
      const speed = 7.5 + Math.sqrt(energy * 18);
      distance += speed * dt;

      camPos.copy(f.point)
        .addScaledVector(f.normal, 1.05)
        .addScaledVector(f.tangent, 0.35);
      lookTarget.copy(f.point)
        .addScaledVector(f.tangent, 8)
        .addScaledVector(f.normal, 1.0);
      camera.up.copy(f.normal);
      camera.position.copy(camPos);
      camera.lookAt(lookTarget);
      camera.fov = 68 + Math.min(18, speed * 0.35);
      camera.updateProjectionMatrix();

      statsEl.textContent =
        `${speed.toFixed(0)} m/s  ·  ${f.point.y.toFixed(0)} m  ·  lap ${(u * 100).toFixed(0)}%`;

      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
