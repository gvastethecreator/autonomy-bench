<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05040a; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";

const CELL = 4.2;
const WALL_H = 3.15;
const CHUNK = 10;
const KEEP_RADIUS = 2;
const GEN_RADIUS = 2;
const EYE = 1.52;
const WALK_SPEED = 2.35;

const N = 0, E = 1, S = 2, W = 3;
const DX = [0, 1, 0, -1];
const DZ = [-1, 0, 1, 0];
const OPP = [S, W, N, E];

function u32(n) {
  return n >>> 0;
}

function mix(a, b) {
  let x = u32(a);
  x ^= u32(Math.imul(b, 0x9e3779b9));
  x = u32(Math.imul(x ^ (x >>> 16), 0x85ebca6b));
  x = u32(Math.imul(x ^ (x >>> 13), 0xc2b2ae35));
  return u32(x ^ (x >>> 16));
}

function mulberry(seed) {
  let s = u32(seed || 1);
  return () => {
    s = u32(s + 0x6d2b79f5);
    let t = s;
    t = u32(Math.imul(t ^ (t >>> 15), t | 1));
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return u32(t ^ (t >>> 14)) / 4294967296;
  };
}

function cellKey(x, z) {
  return x + "," + z;
}

function chunkOf(x, z) {
  return [Math.floor(x / CHUNK), Math.floor(z / CHUNK)];
}

function edgeSeed(ax, az, bx, bz) {
  if (ax > bx || (ax === bx && az > bz)) {
    const t = ax; ax = bx; bx = t;
    const u = az; az = bz; bz = u;
  }
  return mix(mix(ax + 19, az + 41), mix(bx + 73, bz + 97));
}

class Maze {
  constructor() {
    this.cells = new Map();
    this.chunks = new Set();
  }

  ensureCell(x, z) {
    const k = cellKey(x, z);
    let c = this.cells.get(k);
    if (!c) {
      c = { x, z, open: [false, false, false, false] };
      this.cells.set(k, c);
    }
    return c;
  }

  carve(x, z, dir) {
    const a = this.ensureCell(x, z);
    const b = this.ensureCell(x + DX[dir], z + DZ[dir]);
    a.open[dir] = true;
    b.open[OPP[dir]] = true;
  }

  portalsForEdge(cx, cz, nx, nz) {
    const seed = edgeSeed(cx, cz, nx, nz);
    const rng = mulberry(seed);
    const count = 1 + Math.floor(rng() * 2);
    const picks = new Set();
    while (picks.size < count) picks.add(Math.floor(rng() * CHUNK));
    return [...picks];
  }

  generateChunk(cx, cz) {
    const id = cellKey(cx, cz);
    if (this.chunks.has(id)) return;
    this.chunks.add(id);

    const rng = mulberry(mix(cx * 7919 + 3, cz * 104729 + 11));
    const ox = cx * CHUNK;
    const oz = cz * CHUNK;
    const visited = new Set();
    const stack = [];

    const startX = ox + Math.floor(rng() * CHUNK);
    const startZ = oz + Math.floor(rng() * CHUNK);
    visited.add(cellKey(startX, startZ));
    stack.push([startX, startZ]);
    this.ensureCell(startX, startZ);

    while (stack.length) {
      const [x, z] = stack[stack.length - 1];
      const opts = [];
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d];
        const nz = z + DZ[d];
        if (Math.floor(nx / CHUNK) !== cx || Math.floor(nz / CHUNK) !== cz) continue;
        if (visited.has(cellKey(nx, nz))) continue;
        opts.push(d);
      }
      if (!opts.length) {
        stack.pop();
        continue;
      }
      const d = opts[Math.floor(rng() * opts.length)];
      this.carve(x, z, d);
      const nx = x + DX[d];
      const nz = z + DZ[d];
      visited.add(cellKey(nx, nz));
      stack.push([nx, nz]);
    }

    const neighbors = [
      [cx + 1, cz, E],
      [cx - 1, cz, W],
      [cx, cz + 1, S],
      [cx, cz - 1, N],
    ];
    for (const [nx, nz, dir] of neighbors) {
      const slots = this.portalsForEdge(cx, cz, nx, nz);
      for (const slot of slots) {
        let x, z;
        if (dir === E) { x = ox + CHUNK - 1; z = oz + slot; }
        else if (dir === W) { x = ox; z = oz + slot; }
        else if (dir === S) { x = ox + slot; z = oz + CHUNK - 1; }
        else { x = ox + slot; z = oz; }
        this.carve(x, z, dir);
      }
    }
  }

  ensureAround(x, z, radius) {
    const [ccx, ccz] = chunkOf(x, z);
    for (let dz = -radius; dz <= radius; dz++) {
      for (let dx = -radius; dx <= radius; dx++) {
        this.generateChunk(ccx + dx, ccz + dz);
      }
    }
  }

  prune(x, z, keep) {
    const [ccx, ccz] = chunkOf(x, z);
    const drop = [];
    for (const id of this.chunks) {
      const [cx, cz] = id.split(",").map(Number);
      if (Math.abs(cx - ccx) > keep || Math.abs(cz - ccz) > keep) drop.push(id);
    }
    for (const id of drop) {
      this.chunks.delete(id);
      const [cx, cz] = id.split(",").map(Number);
      for (let zc = 0; zc < CHUNK; zc++) {
        for (let xc = 0; xc < CHUNK; xc++) {
          this.cells.delete(cellKey(cx * CHUNK + xc, cz * CHUNK + zc));
        }
      }
    }
    return drop;
  }
}

const maze = new Maze();
maze.ensureAround(0, 0, GEN_RADIUS);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060e);
scene.fog = new THREE.FogExp2(0x0b0914, 0.085);

const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.08, 80);
camera.position.set(0, EYE, 0);

scene.add(new THREE.HemisphereLight(0x6e7aa8, 0x1a120c, 0.28));
const fill = new THREE.DirectionalLight(0xc9b48a, 0.18);
fill.position.set(6, 12, 4);
scene.add(fill);

const lantern = new THREE.PointLight(0xffc28a, 2.6, 14, 1.6);
lantern.position.set(0, 1.7, 0);
scene.add(lantern);
const lanternGlow = new THREE.PointLight(0x7ab8ff, 0.55, 18, 2);
scene.add(lanternGlow);

const wallMat = new THREE.MeshStandardMaterial({
  color: 0x2a3344,
  roughness: 0.78,
  metalness: 0.08,
});
const trimMat = new THREE.MeshStandardMaterial({
  color: 0xc9a15b,
  emissive: 0x6a4a18,
  emissiveIntensity: 0.55,
  roughness: 0.42,
  metalness: 0.35,
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x16141c,
  roughness: 0.9,
  metalness: 0.04,
});
const ceilMat = new THREE.MeshStandardMaterial({
  color: 0x101018,
  roughness: 0.95,
  metalness: 0.02,
});
const runeMat = new THREE.MeshStandardMaterial({
  color: 0x3a6a8a,
  emissive: 0x1c6d9a,
  emissiveIntensity: 0.9,
  roughness: 0.35,
  metalness: 0.1,
});
const pillarMat = new THREE.MeshStandardMaterial({
  color: 0x1e2430,
  roughness: 0.7,
  metalness: 0.12,
});

const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, 0.28);
const trimGeo = new THREE.BoxGeometry(CELL * 0.92, 0.06, 0.32);
const floorGeo = new THREE.BoxGeometry(CELL, 0.12, CELL);
const ceilGeo = new THREE.BoxGeometry(CELL, 0.1, CELL);
const runeGeo = new THREE.BoxGeometry(0.55, 0.03, 0.12);
const pillarGeo = new THREE.BoxGeometry(0.42, WALL_H + 0.2, 0.42);

const chunkGroups = new Map();

function addMesh(group, geo, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  group.add(m);
}

function buildChunk(cx, cz) {
  const id = cellKey(cx, cz);
  if (chunkGroups.has(id)) return;
  maze.generateChunk(cx, cz);
  const group = new THREE.Group();
  group.name = id;

  for (let lz = 0; lz < CHUNK; lz++) {
    for (let lx = 0; lx < CHUNK; lx++) {
      const x = cx * CHUNK + lx;
      const z = cz * CHUNK + lz;
      const cell = maze.ensureCell(x, z);
      const wx = (x + 0.5) * CELL;
      const wz = (z + 0.5) * CELL;

      addMesh(group, floorGeo, floorMat, wx, -0.06, wz);
      addMesh(group, ceilGeo, ceilMat, wx, WALL_H + 0.04, wz);
      addMesh(group, runeGeo, runeMat, wx, 0.02, wz, (x + z) % 2 ? 0.7 : 0);

      if (!cell.open[N]) {
        addMesh(group, wallGeo, wallMat, wx, WALL_H * 0.5, wz - CELL * 0.5);
        addMesh(group, trimGeo, trimMat, wx, 0.42, wz - CELL * 0.5);
        addMesh(group, trimGeo, trimMat, wx, WALL_H - 0.28, wz - CELL * 0.5);
      }
      if (!cell.open[W]) {
        addMesh(group, wallGeo, wallMat, wx - CELL * 0.5, WALL_H * 0.5, wz, Math.PI / 2);
        addMesh(group, trimGeo, trimMat, wx - CELL * 0.5, 0.42, wz, Math.PI / 2);
        addMesh(group, trimGeo, trimMat, wx - CELL * 0.5, WALL_H - 0.28, wz, Math.PI / 2);
      }
      if (lx === CHUNK - 1 && !cell.open[E]) {
        addMesh(group, wallGeo, wallMat, wx + CELL * 0.5, WALL_H * 0.5, wz, Math.PI / 2);
        addMesh(group, trimGeo, trimMat, wx + CELL * 0.5, 0.42, wz, Math.PI / 2);
        addMesh(group, trimGeo, trimMat, wx + CELL * 0.5, WALL_H - 0.28, wz, Math.PI / 2);
      }
      if (lz === CHUNK - 1 && !cell.open[S]) {
        addMesh(group, wallGeo, wallMat, wx, WALL_H * 0.5, wz + CELL * 0.5);
        addMesh(group, trimGeo, trimMat, wx, 0.42, wz + CELL * 0.5);
        addMesh(group, trimGeo, trimMat, wx, WALL_H - 0.28, wz + CELL * 0.5);
      }

      addMesh(group, pillarGeo, pillarMat, x * CELL, WALL_H * 0.5, z * CELL);
    }
  }

  scene.add(group);
  chunkGroups.set(id, group);
}

function syncChunks(x, z) {
  maze.ensureAround(x, z, GEN_RADIUS);
  const [ccx, ccz] = chunkOf(x, z);
  for (let dz = -GEN_RADIUS; dz <= GEN_RADIUS; dz++) {
    for (let dx = -GEN_RADIUS; dx <= GEN_RADIUS; dx++) {
      buildChunk(ccx + dx, ccz + dz);
    }
  }
  const dropped = maze.prune(x, z, KEEP_RADIUS);
  for (const id of dropped) {
    const g = chunkGroups.get(id);
    if (g) {
      scene.remove(g);
      g.traverse((obj) => {
        if (obj.geometry && obj.geometry !== wallGeo && obj.geometry !== trimGeo &&
            obj.geometry !== floorGeo && obj.geometry !== ceilGeo &&
            obj.geometry !== runeGeo && obj.geometry !== pillarGeo) {
          obj.geometry.dispose();
        }
      });
      chunkGroups.delete(id);
    }
  }
}

const visited = new Map();
let gx = 0;
let gz = 0;
let dir = E;
let fromX = 0;
let fromZ = 0;
let toX = 1;
let toZ = 0;
let t = 0;
let yaw = Math.PI / 2;
let yawTarget = Math.PI / 2;
let bob = 0;

function openings(x, z) {
  maze.ensureAround(x, z, GEN_RADIUS);
  return maze.ensureCell(x, z).open;
}

function chooseNext(x, z, incoming) {
  maze.ensureAround(x, z, GEN_RADIUS);
  const open = openings(x, z);
  const opts = [];
  for (let d = 0; d < 4; d++) {
    if (!open[d]) continue;
    opts.push(d);
  }
  if (!opts.length) return incoming;

  const back = OPP[incoming];
  const forward = opts.filter((d) => d !== back);
  const pool = forward.length ? forward : opts;

  let best = pool[0];
  let bestScore = -1e9;
  for (const d of pool) {
    const nx = x + DX[d];
    const nz = z + DZ[d];
    const seen = visited.get(cellKey(nx, nz)) || 0;
    let score = -seen * 4;
    score += mulberry(mix(nx * 13 + 5, nz * 29 + 7) ^ visited.size)() * 1.4;
    if (d === incoming) score += 2.8;
    if ((nx | 0) !== nx) score += 0;
    const branches = openings(nx, nz).filter(Boolean).length;
    score += branches * 0.15;
    if (score > bestScore) {
      bestScore = score;
      best = d;
    }
  }
  return best;
}

function cellCenter(x, z) {
  return new THREE.Vector3((x + 0.5) * CELL, EYE, (z + 0.5) * CELL);
}

dir = chooseNext(0, 0, E);
toX = gx + DX[dir];
toZ = gz + DZ[dir];
yawTarget = Math.atan2(DX[dir], DX[dir] === 0 && DZ[dir] === 0 ? 1 : DZ[dir]);
yaw = yawTarget;
syncChunks(0, 0);
visited.set(cellKey(0, 0), 1);

const look = new THREE.Vector3();
const pos = new THREE.Vector3();
const clock = new THREE.Clock();

function easeInOut(u) {
  return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += (WALK_SPEED / CELL) * dt;

  while (t >= 1) {
    t -= 1;
    gx = toX;
    gz = toZ;
    fromX = gx;
    fromZ = gz;
    visited.set(cellKey(gx, gz), (visited.get(cellKey(gx, gz)) || 0) + 1);
    dir = chooseNext(gx, gz, dir);
    toX = gx + DX[dir];
    toZ = gz + DZ[dir];
    yawTarget = Math.atan2(DX[dir], DZ[dir]);
    syncChunks(gx, gz);
  }

  const u = easeInOut(t);
  const a = cellCenter(fromX, fromZ);
  const b = cellCenter(toX, toZ);
  pos.lerpVectors(a, b, u);

  let dy = yawTarget - yaw;
  while (dy > Math.PI) dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  yaw += dy * Math.min(1, dt * 6.2);

  bob += dt * 7.4;
  const bobY = Math.sin(bob) * 0.032;
  const sway = Math.cos(bob * 0.5) * 0.012;

  camera.position.set(pos.x + Math.cos(yaw) * sway, pos.y + bobY, pos.z + Math.sin(yaw) * sway);
  look.set(
    camera.position.x + Math.sin(yaw),
    EYE - 0.04 + Math.sin(bob * 0.5) * 0.01,
    camera.position.z + Math.cos(yaw)
  );
  camera.lookAt(look);

  lantern.position.set(camera.position.x, 1.55 + bobY * 0.4, camera.position.z);
  lanternGlow.position.set(
    camera.position.x + Math.sin(yaw) * 1.2,
    1.1,
    camera.position.z + Math.cos(yaw) * 1.2
  );

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

requestAnimationFrame(frame);
</script>
</body>
</html>
