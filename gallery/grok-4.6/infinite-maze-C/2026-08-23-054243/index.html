<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Endless Labyrinth</title>
  <style>
    :root {
      --ink: #e8dcc8;
      --mute: rgba(232, 220, 200, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050308;
      font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
      color: var(--ink);
      cursor: none;
    }
    #c { display: block; width: 100%; height: 100%; }
    .letterbox {
      position: fixed; left: 0; right: 0; height: 7.5vh;
      background: #000; z-index: 6; pointer-events: none;
      transition: transform 1.6s cubic-bezier(.22,1,.36,1);
    }
    .letterbox.top { top: 0; }
    .letterbox.bot { bottom: 0; }
    .vignette {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.55) 100%),
        linear-gradient(to bottom, rgba(0,0,0,.28), transparent 18%, transparent 82%, rgba(0,0,0,.38));
    }
    .grain {
      position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: .09;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.85'/></svg>");
      animation: grain 0.35s steps(2) infinite;
    }
    @keyframes grain {
      0% { transform: translate(0,0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, 2%); }
      100% { transform: translate(0,0); }
    }
    #titlecard {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 42%, rgba(18,10,8,.35), rgba(0,0,0,.72));
      transition: opacity 2.4s ease;
      pointer-events: none;
    }
    #titlecard.gone { opacity: 0; }
    .titlewrap { text-align: center; letter-spacing: .42em; }
    .kicker {
      font-size: 11px; text-transform: uppercase; color: var(--mute);
      letter-spacing: .55em; margin-bottom: 18px;
    }
    h1 {
      font-weight: 400; font-size: clamp(22px, 3.4vw, 42px);
      text-transform: uppercase; line-height: 1.25;
      text-shadow: 0 0 40px rgba(255,180,90,.18);
    }
    .rule {
      width: 88px; height: 1px; margin: 22px auto;
      background: linear-gradient(90deg, transparent, #d4af77, transparent);
    }
    .sub {
      font-size: 12px; letter-spacing: .28em; color: var(--mute);
      font-style: italic; text-transform: none;
    }
    #hud {
      position: fixed; left: 28px; right: 28px; bottom: 9.2vh; z-index: 8;
      display: flex; justify-content: space-between; align-items: flex-end;
      opacity: 0; transition: opacity 1.2s ease .8s;
      pointer-events: none;
    }
    #hud.show { opacity: 1; pointer-events: auto; }
    #hud.hidden { opacity: 0; pointer-events: none; }
    .place {
      font-size: 13px; letter-spacing: .32em; text-transform: uppercase;
      text-shadow: 0 2px 16px #000;
    }
    .place small {
      display: block; margin-top: 6px; font-size: 10px; letter-spacing: .22em;
      color: var(--mute); text-transform: none; font-style: italic;
    }
    .controls {
      display: flex; gap: 8px; align-items: center;
    }
    button, .chip {
      appearance: none; border: 1px solid rgba(232,220,200,.22);
      background: rgba(8,6,10,.42); color: var(--ink);
      padding: 8px 12px; font: 11px/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
      backdrop-filter: blur(8px);
    }
    button:hover { border-color: rgba(212,175,119,.7); }
    input[type="range"] {
      width: 92px; accent-color: #d4af77; cursor: pointer;
    }
    .hint {
      position: fixed; top: 8.4vh; right: 28px; z-index: 8;
      font: 10px/1.6 "Segoe UI", system-ui, sans-serif;
      letter-spacing: .18em; text-transform: uppercase; color: var(--mute);
      text-align: right; opacity: 0; transition: opacity 1.4s ease 2s;
      pointer-events: none;
    }
    .hint.show { opacity: .7; }
    .hint.fade { opacity: 0; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="letterbox top"></div>
  <div class="letterbox bot"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div id="titlecard">
    <div class="titlewrap">
      <div class="kicker">A self-guided passage</div>
      <h1>The Endless<br>Labyrinth</h1>
      <div class="rule"></div>
      <div class="sub">walk without walking</div>
    </div>
  </div>
  <div class="hint" id="hint">Space pause · +/− pace · H hide · F frame</div>
  <div id="hud">
    <div class="place">
      <span id="placename">The Ember Crypt</span>

    </div>
    <div class="controls">
      <button id="btnPause" type="button">Pause</button>
      <span class="chip">Pace</span>
      <input id="spd" type="range" min="0.45" max="1.7" step="0.05" value="1" />

    </div>
  </div>
  <script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const CELL = 7.2;
const WALL_T = 0.42;
const LOOKAHEAD = 36;
const KEEP_BEHIND = 18;
const GEN_AHEAD = 72;

const DIRS = [
  { dx: 0, dz: -1, name: "n", opp: "s" },
  { dx: 1, dz: 0, name: "e", opp: "w" },
  { dx: 0, dz: 1, name: "s", opp: "n" },
  { dx: -1, dz: 0, name: "w", opp: "e" }
];
const OPP = { n: "s", s: "n", e: "w", w: "e" };

const THEMES = [
  {
    id: "crypt",
    name: "The Ember Crypt",
    desc: "torchlight in the first stone",
    fog: 0x120805, fogD: 0.046,
    hemiSky: 0x6a3a22, hemiGnd: 0x1a0a06,
    amb: 0x1c0c08, ambI: 0.22,
    wall: 0x4a3228, wallR: 0.92, wallM: 0.08,
    floor: 0x2a1a14, ceil: 0x1a100c,
    trim: 0x6a4a32, accent: 0xff7a32,
    light: 0xff6a28, lightI: 2.8,
    height: 3.55, openCeil: 0,
    particle: 0xffaa66, dust: 48
  },
  {
    id: "cloister",
    name: "Moonwell Cloister",
    desc: "silver hush between the arches",
    fog: 0x081018, fogD: 0.032,
    hemiSky: 0x6a88bb, hemiGnd: 0x0a1420,
    amb: 0x101828, ambI: 0.32,
    wall: 0x3a4658, wallR: 0.55, wallM: 0.18,
    floor: 0x1c2430, ceil: 0x141c28,
    trim: 0x8aa4c4, accent: 0xa8d4ff,
    light: 0x88c4ff, lightI: 2.4,
    height: 6.4, openCeil: 0.08,
    particle: 0xc8e4ff, dust: 36
  },
  {
    id: "verdant",
    name: "The Green Collapse",
    desc: "roots remember the masons",
    fog: 0x0a140c, fogD: 0.038,
    hemiSky: 0x4a7a48, hemiGnd: 0x101408,
    amb: 0x10180c, ambI: 0.28,
    wall: 0x3a4430, wallR: 0.86, wallM: 0.04,
    floor: 0x24301c, ceil: 0x182014,
    trim: 0x6a8a44, accent: 0x88ee77,
    light: 0x66dd77, lightI: 2.2,
    height: 4.8, openCeil: 0.22,
    particle: 0xb8ee88, dust: 56
  },
  {
    id: "observatory",
    name: "Amber Orrery",
    desc: "a hall that learned the sky",
    fog: 0x140c04, fogD: 0.022,
    hemiSky: 0xcc8844, hemiGnd: 0x181008,
    amb: 0x201408, ambI: 0.3,
    wall: 0x4a3820, wallR: 0.48, wallM: 0.28,
    floor: 0x2a1e10, ceil: 0x0c0810,
    trim: 0xd4af77, accent: 0xffd078,
    light: 0xffb030, lightI: 3.1,
    height: 11.5, openCeil: 0.55,
    particle: 0xffe0a0, dust: 40
  },
  {
    id: "void",
    name: "The Chromatic Rift",
    desc: "geometry that refuses rest",
    fog: 0x060510, fogD: 0.04,
    hemiSky: 0x442266, hemiGnd: 0x050510,
    amb: 0x0c0818, ambI: 0.2,
    wall: 0x16141f, wallR: 0.22, wallM: 0.72,
    floor: 0x0c0a14, ceil: 0x080812,
    trim: 0x00e8ff, accent: 0xff2bd6,
    light: 0x00d4ff, lightI: 2.6,
    height: 7.2, openCeil: 0.12,
    particle: 0xff66cc, dust: 70
  },
  {
    id: "sanctum",
    name: "Ivory Sanctum",
    desc: "a quiet that has weight",
    fog: 0x161410, fogD: 0.018,
    hemiSky: 0xfff0d0, hemiGnd: 0x2a2418,
    amb: 0x2a241c, ambI: 0.42,
    wall: 0xd8cfc2, wallR: 0.34, wallM: 0.12,
    floor: 0xb8aa96, ceil: 0xc8beae,
    trim: 0xbfa06a, accent: 0xfff6e0,
    light: 0xffe8c0, lightI: 3.4,
    height: 14.2, openCeil: 0.18,
    particle: 0xfff4dc, dust: 28
  }
];

function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, z) {
  let n = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263);
  n = (n ^ (n >>> 13)) >>> 0;
  return n;
}
function key(x, z) { return x + "," + z; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpHex(a, b, t) {
  const ca = new THREE.Color(a), cb = new THREE.Color(b);
  return ca.lerp(cb, t);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
function damp(cur, tgt, lambda, dt) {
  return tgt + (cur - tgt) * Math.exp(-lambda * dt);
}

function themeAt(dist) {
  const span = 42;
  const cycle = THEMES.length * span;
  const u = ((dist % cycle) + cycle) % cycle;
  const i = Math.floor(u / span) % THEMES.length;
  const local = u - i * span;
  const blend = smoothstep(span - 8, span, local);
  const j = (i + 1) % THEMES.length;
  return { a: THEMES[i], b: THEMES[j], mix: blend, i, dist };
}

function mixedTheme(tm) {
  const t = tm.mix;
  const A = tm.a, B = tm.b;
  return {
    id: t < 0.5 ? A.id : B.id,
    name: t < 0.35 ? A.name : B.name,
    desc: t < 0.35 ? A.desc : B.desc,
    fog: lerpHex(A.fog, B.fog, t).getHex(),
    fogD: lerp(A.fogD, B.fogD, t),
    hemiSky: lerpHex(A.hemiSky, B.hemiSky, t).getHex(),
    hemiGnd: lerpHex(A.hemiGnd, B.hemiGnd, t).getHex(),
    amb: lerpHex(A.amb, B.amb, t).getHex(),
    ambI: lerp(A.ambI, B.ambI, t),
    wall: lerpHex(A.wall, B.wall, t).getHex(),
    wallR: lerp(A.wallR, B.wallR, t),
    wallM: lerp(A.wallM, B.wallM, t),
    floor: lerpHex(A.floor, B.floor, t).getHex(),
    ceil: lerpHex(A.ceil, B.ceil, t).getHex(),
    trim: lerpHex(A.trim, B.trim, t).getHex(),
    accent: lerpHex(A.accent, B.accent, t).getHex(),
    light: lerpHex(A.light, B.light, t).getHex(),
    lightI: lerp(A.lightI, B.lightI, t),
    height: lerp(A.height, B.height, t),
    openCeil: lerp(A.openCeil, B.openCeil, t),
    particle: lerpHex(A.particle, B.particle, t).getHex(),
    dust: lerp(A.dust, B.dust, t)
  };
}

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120805);
scene.fog = new THREE.FogExp2(0x120805, 0.046);

const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.12, 180);
camera.position.set(0, 1.62, 0);

const hemi = new THREE.HemisphereLight(0x6a3a22, 0x1a0a06, 0.55);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x1c0c08, 0.22);
scene.add(amb);

const pathLights = [0, 1, 2].map((i) => {
  const l = new THREE.PointLight(0xff6a28, 2.4, 18, 1.6);
  l.position.set(0, 2.2, -i * 8);
  scene.add(l);
  return l;
});
const rim = new THREE.PointLight(0xffd0a0, 0.8, 14, 2);
scene.add(rim);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.55, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const world = new THREE.Group();
scene.add(world);

const geo = {
  floor: new THREE.BoxGeometry(CELL - 0.04, 0.18, CELL - 0.04),
  wallZ: new THREE.BoxGeometry(CELL + WALL_T, 1, WALL_T),
  wallX: new THREE.BoxGeometry(WALL_T, 1, CELL + WALL_T),
  col: new THREE.CylinderGeometry(0.18, 0.22, 1, 10),
  cap: new THREE.CylinderGeometry(0.28, 0.28, 0.1, 10),
  arch: new THREE.TorusGeometry(1.15, 0.1, 8, 14, Math.PI),
  tile: new THREE.PlaneGeometry(1.15, 1.15),
  lantern: new THREE.SphereGeometry(0.12, 12, 12),
  chain: new THREE.CylinderGeometry(0.018, 0.018, 1, 6),
  crystal: new THREE.OctahedronGeometry(0.32, 0),
  plinth: new THREE.BoxGeometry(0.9, 0.55, 0.9),
  statue: new THREE.CapsuleGeometry(0.28, 1.1, 6, 10),
  head: new THREE.SphereGeometry(0.26, 10, 8),
  beam: new THREE.PlaneGeometry(0.7, 6.5),
  rug: new THREE.PlaneGeometry(3.2, 1.7),
  water: new THREE.PlaneGeometry(CELL * 0.72, CELL * 0.72, 12, 12),
  star: new THREE.SphereGeometry(0.045, 6, 6),
  vine: new THREE.CylinderGeometry(0.04, 0.07, 2.4, 5),
  rail: new THREE.BoxGeometry(CELL, 0.08, 0.08),
  orb: new THREE.IcosahedronGeometry(0.55, 0),
  ring: new THREE.TorusGeometry(1.6, 0.045, 8, 32),
  disc: new THREE.CircleGeometry(1.8, 24)
};

const matCache = new Map();
function wallMat(th) {
  const k = th.id + "|w|" + (th.wall >>> 0);
  if (matCache.has(k)) return matCache.get(k);
  const m = new THREE.MeshStandardMaterial({
    color: th.wall, roughness: th.wallR, metalness: th.wallM,
    emissive: new THREE.Color(th.accent).multiplyScalar(0.015)
  });
  matCache.set(k, m);
  return m;
}
function floorMat(th) {
  const k = th.id + "|f|" + (th.floor >>> 0);
  if (matCache.has(k)) return matCache.get(k);
  const m = new THREE.MeshStandardMaterial({
    color: th.floor, roughness: 0.82, metalness: 0.06
  });
  matCache.set(k, m);
  return m;
}
function ceilMat(th) {
  const k = th.id + "|c|" + (th.ceil >>> 0);
  if (matCache.has(k)) return matCache.get(k);
  const m = new THREE.MeshStandardMaterial({
    color: th.ceil, roughness: 0.9, metalness: 0.02
  });
  matCache.set(k, m);
  return m;
}
function trimMat(th) {
  const k = th.id + "|t|" + (th.trim >>> 0);
  if (matCache.has(k)) return matCache.get(k);
  const m = new THREE.MeshStandardMaterial({
    color: th.trim, roughness: 0.4, metalness: 0.35,
    emissive: new THREE.Color(th.trim).multiplyScalar(0.08)
  });
  matCache.set(k, m);
  return m;
}
function emitMat(hex, gain = 2.4) {
  const k = "e|" + hex + "|" + gain;
  if (matCache.has(k)) return matCache.get(k);
  const c = new THREE.Color(hex);
  const m = new THREE.MeshStandardMaterial({
    color: c, emissive: c, emissiveIntensity: gain,
    roughness: 0.25, metalness: 0.1
  });
  matCache.set(k, m);
  return m;
}

const cells = new Map();
const groups = new Map();
const spine = [];
const rngRoot = mulberry32(0xA11CE);

function getCell(x, z) {
  const k = key(x, z);
  let c = cells.get(k);
  if (!c) {
    c = { x, z, walls: { n: true, e: true, s: true, w: true }, kind: "corridor", dist: 0 };
    cells.set(k, c);
  }
  return c;
}
function openWall(x, z, dir) {
  const c = getCell(x, z);
  c.walls[dir] = false;
  const d = DIRS.find((q) => q.name === dir);
  const n = getCell(x + d.dx, z + d.dz);
  n.walls[OPP[dir]] = false;
}

function carveRoom(cx, cz, w, h, dist) {
  for (let z = cz; z < cz + h; z++) {
    for (let x = cx; x < cx + w; x++) {
      const c = getCell(x, z);
      c.kind = "room";
      c.dist = dist;
      if (x > cx) openWall(x, z, "w");
      if (z > cz) openWall(x, z, "n");
    }
  }
}

function pickLandmark(dist, rnd) {
  const tm = mixedTheme(themeAt(dist));
  if (rnd() < 0.55) return "none";
  const pool = {
    crypt: ["brazier", "statue", "alcove"],
    cloister: ["pool", "archway", "lanternrow"],
    verdant: ["tree", "roots", "well"],
    observatory: ["orrery", "skycircle", "bridge"],
    void: ["rift", "crystals", "rings"],
    sanctum: ["idol", "nave", "lightwell"]
  };
  const list = pool[tm.id] || ["statue"];
  return list[Math.floor(rnd() * list.length)];
}

function extendSpine() {
  if (spine.length === 0) {
    const c = getCell(0, 0);
    c.kind = "start";
    c.dist = 0;
    openWall(0, 0, "s");
    spine.push({ x: 0, z: 0, dist: 0, landmark: "none" });
    return;
  }
  const last = spine[spine.length - 1];
  const prev = spine.length > 1 ? spine[spine.length - 2] : { x: 0, z: -1 };
  const fdx = last.x - prev.x;
  const fdz = last.z - prev.z;
  const recent = new Set();
  for (let i = Math.max(0, spine.length - 140); i < spine.length; i++) {
    recent.add(key(spine[i].x, spine[i].z));
  }
  let dist = last.dist + 1;
  const rnd = mulberry32(hash2(last.x * 13 + dist, last.z * 29) ^ 0x51);
  const tm = mixedTheme(themeAt(dist));

  const wantRoom = (dist % 17 === 0) || (tm.height > 8 && dist % 11 === 0 && rnd() < 0.55);
  if (wantRoom) {
    const ahead = DIRS.find((d) => d.dx === fdx && d.dz === fdz) || DIRS[2];
    const left = DIRS.find((d) => d.dx === -ahead.dz && d.dz === ahead.dx);
    const right = DIRS.find((d) => d.dx === ahead.dz && d.dz === -ahead.dx);
    let cx = last.x, cz = last.z;
    for (let s = 0; s < 3; s++) {
      openWall(cx, cz, ahead.name);
      if (left) openWall(cx, cz, left.name);
      if (right) openWall(cx, cz, right.name);
      cx += ahead.dx;
      cz += ahead.dz;
      const hall = getCell(cx, cz);
      hall.kind = "room";
      hall.dist = dist;
      if (left) {
        openWall(cx, cz, left.name);
        const lc = getCell(cx + left.dx, cz + left.dz);
        lc.kind = "room";
        lc.dist = dist;
      }
      if (right) {
        openWall(cx, cz, right.name);
        const rc = getCell(cx + right.dx, cz + right.dz);
        rc.kind = "room";
        rc.dist = dist;
      }
      spine.push({
        x: cx, z: cz, dist,
        landmark: s === 1 ? pickLandmark(dist, rnd) : "none",
        kind: "room"
      });
      dist++;
    }
    maybeBranch(cx, cz, ahead.name, rnd);
    return;
  }

  const options = [];
  for (const d of DIRS) {
    const nx = last.x + d.dx, nz = last.z + d.dz;
    const k = key(nx, nz);
    if (d.dx === -fdx && d.dz === -fdz) continue;
    let score = 1;
    if (d.dx === fdx && d.dz === fdz) score += 2.8;
    else score += 1.15;
    if (recent.has(k)) score *= 0.08;
    const wind = Math.sin(dist * 0.17 + last.x * 0.05);
    if (d.dx !== 0 && wind > 0.15 && d.dx > 0) score += 0.7;
    if (d.dx !== 0 && wind < -0.15 && d.dx < 0) score += 0.7;
    if (d.dz !== 0 && Math.cos(dist * 0.11) > 0.4 && d.dz === fdz) score += 0.4;
    if (tm.id === "void" && (dist + nx) % 5 === 0 && d.dx !== fdx) score += 0.6;
    options.push({ d, nx, nz, score });
  }
  if (!options.length) {
    const back = DIRS.find((d) => d.dx === -fdx && d.dz === -fdz) || DIRS[0];
    options.push({ d: DIRS.find((d) => d.dx === fdx && d.dz === fdz) || DIRS[2], nx: last.x + fdx, nz: last.z + fdz, score: 1 });
    options.push({ d: back, nx: last.x + back.dx, nz: last.z + back.dz, score: 0.2 });
  }
  let sum = 0;
  for (const o of options) sum += Math.max(o.score, 0.02);
  let pick = rnd() * sum;
  let chosen = options[0];
  for (const o of options) {
    pick -= Math.max(o.score, 0.02);
    if (pick <= 0) { chosen = o; break; }
  }
  openWall(last.x, last.z, chosen.d.name);
  const nc = getCell(chosen.nx, chosen.nz);
  nc.dist = dist;
  if (rnd() < 0.18) maybeBranch(last.x, last.z, chosen.d.name, rnd);
  spine.push({
    x: chosen.nx, z: chosen.nz, dist,
    landmark: (dist % 23 === 0) ? pickLandmark(dist, rnd) : "none"
  });
}

function dirBetween(x, z, nx, nz) {
  if (nx > x) return "e";
  if (nx < x) return "w";
  if (nz > z) return "s";
  return "n";
}
function openToward(x, z, nx, nz) {
  if (x === nx && z === nz) return;
  if (Math.abs(nx - x) + Math.abs(nz - z) === 1) openWall(x, z, dirBetween(x, z, nx, nz));
  else {
    const mx = x + Math.sign(nx - x);
    const mz = z + Math.sign(nz - z);
    if (mx !== x) openWall(x, z, dirBetween(x, z, mx, z));
    if (mz !== z) openWall(mx || x, z, dirBetween(mx || x, z, mx || x, mz));
  }
}

function maybeBranch(x, z, avoid, rnd) {
  const sides = DIRS.filter((d) => d.name !== avoid && d.name !== OPP[avoid]);
  const d = sides[Math.floor(rnd() * sides.length)];
  if (!d) return;
  let cx = x, cz = z;
  const len = 2 + Math.floor(rnd() * 3);
  for (let i = 0; i < len; i++) {
    openWall(cx, cz, d.name);
    cx += d.dx; cz += d.dz;
    const c = getCell(cx, cz);
    c.kind = "spur";
    if (rnd() < 0.3) c.kind = "alcove";
  }
}

function cellWorld(x, z) {
  return new THREE.Vector3(x * CELL, 0, z * CELL);
}

function makeLantern(th, h, rnd) {
  const g = new THREE.Group();
  const chainLen = 0.45 + rnd() * (h * 0.18);
  const chain = new THREE.Mesh(geo.chain, trimMat(th));
  chain.scale.y = chainLen;
  chain.position.y = h - chainLen * 0.5 - 0.12;
  g.add(chain);
  const bulb = new THREE.Mesh(geo.lantern, emitMat(th.light, 3.2));
  bulb.position.y = h - chainLen - 0.22;
  bulb.scale.setScalar(0.9 + rnd() * 0.5);
  g.add(bulb);
  const halo = new THREE.Mesh(geo.disc, new THREE.MeshBasicMaterial({
    color: th.light, transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide
  }));
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = bulb.position.y;
  halo.scale.setScalar(0.35);
  g.add(halo);
  return g;
}

function buildCellMesh(cell) {
  const th = mixedTheme(themeAt(cell.dist));
  const rnd = mulberry32(hash2(cell.x, cell.z));
  const g = new THREE.Group();
  g.position.copy(cellWorld(cell.x, cell.z));
  const h = th.height * (cell.kind === "room" ? 1.12 : 1);
  const open = cell.kind === "room" ? Math.min(1, th.openCeil + 0.35) : th.openCeil;

  const floor = new THREE.Mesh(geo.floor, floorMat(th));
  floor.position.y = 0;
  g.add(floor);

  if (cell.kind === "room") {
    const rug = new THREE.Mesh(geo.rug, new THREE.MeshStandardMaterial({
      color: th.trim, roughness: 0.9, metalness: 0.05,
      emissive: new THREE.Color(th.accent).multiplyScalar(0.04)
    }));
    rug.rotation.x = -Math.PI / 2;
    rug.position.y = 0.1;
    g.add(rug);
  }

  if (open < 0.62) {
    const ceil = new THREE.Mesh(geo.floor, ceilMat(th));
    ceil.position.y = h;
    ceil.scale.set(1, 0.7, 1);
    g.add(ceil);
  } else {
    const stars = 8 + Math.floor(rnd() * 10);
    for (let i = 0; i < stars; i++) {
      const s = new THREE.Mesh(geo.star, emitMat(0xfff4d8, 2));
      s.position.set((rnd() - 0.5) * CELL * 0.9, h + 2 + rnd() * 6, (rnd() - 0.5) * CELL * 0.9);
      g.add(s);
    }
  }

  const openings = ["n", "e", "s", "w"].filter((d) => !cell.walls[d]).length;

  for (const d of DIRS) {
    if (!cell.walls[d.name]) {
      if (rnd() < 0.7 && h > 3.8) {
        const arch = new THREE.Mesh(geo.arch, trimMat(th));
        arch.position.y = 1.35;
        if (d.name === "n") { arch.position.z = -CELL / 2 + 0.08; }
        if (d.name === "s") { arch.position.z = CELL / 2 - 0.08; arch.rotation.y = Math.PI; }
        if (d.name === "e") { arch.position.x = CELL / 2 - 0.08; arch.rotation.y = -Math.PI / 2; }
        if (d.name === "w") { arch.position.x = -CELL / 2 + 0.08; arch.rotation.y = Math.PI / 2; }
        g.add(arch);
      }
      continue;
    }
    const wall = new THREE.Mesh(d.dx === 0 ? geo.wallZ : geo.wallX, wallMat(th));
    wall.scale.y = h;
    wall.position.y = h * 0.5;
    wall.position.x = d.dx * (CELL / 2);
    wall.position.z = d.dz * (CELL / 2);
    g.add(wall);

    const molding = new THREE.Mesh(d.dx === 0 ? geo.wallZ : geo.wallX, trimMat(th));
    molding.scale.set(d.dx === 0 ? 1 : 1, 0.06, d.dx === 0 ? 1 : 1);
    molding.scale.y = 0.08;
    molding.position.copy(wall.position);
    molding.position.y = 0.28;
    if (d.dx === 0) molding.scale.x = 1;
    g.add(molding);

    if (th.id === "void" && rnd() < 0.45) {
      const neon = new THREE.Mesh(d.dx === 0 ? geo.wallZ : geo.wallX, emitMat(rnd() < 0.5 ? th.light : th.accent, 1.6));
      neon.scale.y = 0.03;
      neon.position.copy(wall.position);
      neon.position.y = 1.1 + rnd() * (h - 1.6);
      g.add(neon);
    }
    if (th.id === "verdant" && rnd() < 0.5) {
      const vine = new THREE.Mesh(geo.vine, new THREE.MeshStandardMaterial({ color: 0x2a5a28, roughness: 1 }));
      vine.position.set(d.dx * (CELL / 2 - 0.3) + (rnd() - 0.5) * 1.4, 1.3, d.dz * (CELL / 2 - 0.3) + (rnd() - 0.5) * 1.4);
      vine.rotation.z = (rnd() - 0.5) * 0.5;
      g.add(vine);
    }
    if ((th.id === "cloister" || th.id === "sanctum") && rnd() < 0.28) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.6), emitMat(th.light, 1.1));
      win.position.set(d.dx * (CELL / 2 - 0.22), 2.1, d.dz * (CELL / 2 - 0.22));
      if (d.dx !== 0) win.rotation.y = Math.PI / 2;
      g.add(win);
    }
  }

  if (openings >= 2) {
    for (const corner of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      if (rnd() > 0.55 && cell.kind !== "room") continue;
      const col = new THREE.Mesh(geo.col, trimMat(th));
      col.scale.y = h;
      col.position.set(corner[0] * (CELL / 2 - 0.38), h * 0.5, corner[1] * (CELL / 2 - 0.38));
      g.add(col);
      const cap = new THREE.Mesh(geo.cap, trimMat(th));
      cap.position.set(col.position.x, h - 0.08, col.position.z);
      g.add(cap);
    }
  }

  if (rnd() < 0.42 || cell.kind === "room") {
    const lantern = makeLantern(th, h, rnd);
    lantern.position.set((rnd() - 0.5) * 1.6, 0, (rnd() - 0.5) * 1.6);
    g.add(lantern);
  }

  const lm = cell.landmark || "none";
  if (lm === "statue" || lm === "idol" || lm === "alcove") addStatue(g, th, h, rnd);
  if (lm === "orrery" || lm === "skycircle") addOrrery(g, th);
  if (lm === "pool" || lm === "well" || lm === "lightwell") addPool(g, th);
  if (lm === "rift" || lm === "crystals" || lm === "rings") addRift(g, th, h);
  if (lm === "tree" || lm === "roots") addTree(g, th, h);
  if (lm === "nave" || lm === "bridge") {
    const beam = new THREE.Mesh(geo.beam, new THREE.MeshBasicMaterial({
      color: th.accent, transparent: true, opacity: 0.08, depthWrite: false, side: THREE.DoubleSide
    }));
    beam.position.y = h * 0.45;
    beam.rotation.x = 0.08;
    g.add(beam);
  }
  if (lm === "brazier") {
    const bowl = new THREE.Mesh(geo.cap, trimMat(th));
    bowl.scale.set(2.2, 2, 2.2);
    bowl.position.y = 0.7;
    g.add(bowl);
    const fire = new THREE.Mesh(geo.lantern, emitMat(th.light, 4.2));
    fire.position.y = 1.05;
    fire.scale.setScalar(1.6);
    fire.name = "bob";
    fire.userData.baseY = 1.05;
    fire.userData.ph = rnd() * 6;
    g.add(fire);
  }

  if (cell.kind === "room" && th.id === "observatory") {
    const rail = new THREE.Mesh(geo.rail, trimMat(th));
    rail.position.set(0, 1.05, -CELL * 0.28);
    g.add(rail);
  }

  world.add(g);
  groups.set(key(cell.x, cell.z), g);
}

function disposeGroup(g) {
  g.traverse((o) => {
    if (o.isMesh) {
      if (o.geometry && !Object.values(geo).includes(o.geometry)) o.geometry.dispose();
    }
  });
  world.remove(g);
}

while (spine.length < GEN_AHEAD + 8) extendSpine();
for (const n of spine) {
  const c = getCell(n.x, n.z);
  c.dist = n.dist;
  c.landmark = n.landmark;
  if (n.kind) c.kind = n.kind;
}

function syncMeshes(camIndex) {
  const lo = Math.max(0, camIndex - KEEP_BEHIND);
  const hi = Math.min(spine.length - 1, camIndex + LOOKAHEAD);
  const need = new Set();
  for (let i = lo; i <= hi; i++) {
    const n = spine[i];
    need.add(key(n.x, n.z));
    for (const d of DIRS) {
      const k = key(n.x + d.dx, n.z + d.dz);
      if (cells.has(k)) need.add(k);
    }
  }
  for (const [k, g] of groups) {
    if (!need.has(k)) {
      disposeGroup(g);
      groups.delete(k);
    }
  }
  for (const k of need) {
    if (!groups.has(k)) {
      const [x, z] = k.split(",").map(Number);
      buildCellMesh(getCell(x, z));
    }
  }
}

function sampleSpine(t) {
  const max = spine.length - 1;
  const i = clamp(Math.floor(t), 0, max - 1);
  const f = t - i;
  const a = spine[i];
  const b = spine[Math.min(i + 1, max)];
  const c = spine[Math.min(i + 2, max)];
  const p = spine[Math.max(i - 1, 0)];
  const pa = cellWorld(p.x, p.z);
  const pb = cellWorld(a.x, a.z);
  const pc = cellWorld(b.x, b.z);
  const pd = cellWorld(c.x, c.z);
  const pos = new THREE.Vector3();
  pos.x = catmull(pa.x, pb.x, pc.x, pd.x, f);
  pos.z = catmull(pa.z, pb.z, pc.z, pd.z, f);
  const ha = mixedTheme(themeAt(a.dist)).height;
  const hb = mixedTheme(themeAt(b.dist)).height;
  pos.y = 1.58 + Math.min(ha, hb) * 0.01;
  return { pos, a, b, f, i };
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function curvatureAt(t) {
  const s0 = sampleSpine(t);
  const s1 = sampleSpine(t + 0.35);
  const d0 = new THREE.Vector3().subVectors(sampleSpine(t + 0.05).pos, s0.pos).normalize();
  const d1 = new THREE.Vector3().subVectors(sampleSpine(t + 0.4).pos, s1.pos).normalize();
  return 1 - clamp(d0.dot(d1), -1, 1);
}

let paused = false;
let speedMul = 1;
let travel = 0.12;
let vel = 0;
let lookBlend = 0;
let mouseX = 0, mouseY = 0;
let hudOn = true;
let clock = new THREE.Clock();
let titleGone = false;

const placename = document.getElementById("placename");
const placedesc = document.getElementById("placedesc");
const hud = document.getElementById("hud");
const hint = document.getElementById("hint");
const titlecard = document.getElementById("titlecard");

const btnFs = document.getElementById("btnFs");
const spd = document.getElementById("spd");

setTimeout(() => {
  titlecard.classList.add("gone");
  hud.classList.add("show");
  hint.classList.add("show");
  titleGone = true;
}, 2800);
setTimeout(() => hint.classList.add("fade"), 11000);

btnPause.addEventListener("click", () => togglePause());
btnFs.addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
});
spd.addEventListener("input", () => { speedMul = parseFloat(spd.value); });

function togglePause() {
  paused = !paused;
  btnPause.textContent = paused ? "Resume" : "Pause";
}

addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  if (e.key === "+" || e.key === "=") { speedMul = clamp(speedMul + 0.1, 0.45, 1.7); spd.value = speedMul; }
  if (e.key === "-" || e.key === "_") { speedMul = clamp(speedMul - 0.1, 0.45, 1.7); spd.value = speedMul; }
  if (e.key === "h" || e.key === "H") {
    hudOn = !hudOn;
    hud.classList.toggle("hidden", !hudOn);
    hint.classList.toggle("fade", !hudOn);
  }
  if (e.key === "f" || e.key === "F") btnFs.click();
});
addEventListener("mousemove", (e) => {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = (e.clientY / innerHeight) * 2 - 1;
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;

  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);

const tmpUp = new THREE.Vector3(0, 1, 0);
const desiredPos = new THREE.Vector3();
const lookPos = new THREE.Vector3();
const camPos = new THREE.Vector3(0, 1.62, 0.2);
const camLook = new THREE.Vector3(0, 1.62, 4);
let fovTarget = 64;
let lastPlace = "";

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const tAbs = clock.elapsedTime;

  while (spine.length - travel < GEN_AHEAD) extendSpine();
  const idx = Math.floor(travel);
  syncMeshes(idx);

  const here = sampleSpine(travel);
  const th = mixedTheme(themeAt(here.a.dist + here.f));
  scene.fog.color.setHex(th.fog);
  scene.background.setHex(th.fog);
  scene.fog.density = th.fogD;
  hemi.color.setHex(th.hemiSky);
  hemi.groundColor.setHex(th.hemiGnd);
  amb.color.setHex(th.amb);
  amb.intensity = th.ambI;

  const curve = curvatureAt(travel);
  const inRoom = here.a.kind === "room" || here.b.kind === "room" || (here.a.landmark && here.a.landmark !== "none");
  let targetVel = (inRoom ? 0.42 : 0.78) * speedMul;
  targetVel *= 1 - curve * 0.55;
  if (tAbs < 3.2) targetVel *= smoothstep(0.4, 3.2, tAbs);
  if (!paused) vel = damp(vel, targetVel, 1.6, dt);
  else vel = damp(vel, 0, 4.5, dt);
  travel += vel * dt * 0.92;

  const now = sampleSpine(travel);
  const ahead = sampleSpine(travel + 0.85 + (1 - curve) * 0.35);
  const further = sampleSpine(travel + 1.65);

  desiredPos.copy(now.pos);
  desiredPos.y = 1.55 + Math.sin(tAbs * 1.05) * 0.018 + Math.sin(travel * 0.7) * 0.01;
  if (inRoom) desiredPos.y += 0.08;

  lookPos.copy(ahead.pos);
  lookPos.y = desiredPos.y + 0.04 + (inRoom ? 0.22 : 0);
  lookPos.x += mouseX * 0.55;
  lookPos.y -= mouseY * 0.28;

  camPos.lerp(desiredPos, 1 - Math.exp(-5.4 * dt));
  camLook.lerp(lookPos, 1 - Math.exp(-4.2 * dt));
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  const bank = (ahead.pos.x - now.pos.x) * 0.012;
  camera.rotateZ(-bank * 0.15);

  fovTarget = inRoom ? 70 : 62;
  camera.fov = damp(camera.fov, fovTarget, 1.4, dt);
  camera.updateProjectionMatrix();
  bloom.strength = inRoom ? 0.52 : 0.36;
  renderer.toneMappingExposure = th.id === "sanctum" ? 1.18 : th.id === "void" ? 0.92 : 1.04;

  const lightAlong = [0.15, 1.1, 2.3];
  for (let i = 0; i < pathLights.length; i++) {
    const s = sampleSpine(travel + lightAlong[i]);
    const lth = mixedTheme(themeAt(s.a.dist));
    pathLights[i].position.copy(s.pos);
    pathLights[i].position.y = Math.min(lth.height * 0.55, 3.4);
    pathLights[i].color.setHex(lth.light);
    pathLights[i].intensity = lth.lightI * (i === 0 ? 1 : 0.72);
    pathLights[i].distance = 16 + lth.height * 0.4;
  }
  rim.position.copy(camPos).add(new THREE.Vector3(0.6, 1.4, 0.2));
  rim.color.setHex(th.accent);
  rim.intensity = 0.55;

  farGlow.position.copy(further.pos);
  farGlow.position.y = mixedTheme(themeAt(further.a.dist)).height * 0.4;
  farGlow.material.color.setHex(th.accent);
  farGlow.scale.setScalar(1.2 + Math.sin(tAbs * 0.6) * 0.2);

  const dp = dust.attributes.position;
  const dc = dust.attributes.color;
  const pc = new THREE.Color(th.particle);
  for (let i = 0; i < DUST_N; i++) {
    let x = dp.getX(i) + Math.sin(tAbs * 0.2 + i) * 0.004;
    let y = dp.getY(i) + 0.12 * dt;
    let z = dp.getZ(i) + Math.cos(tAbs * 0.15 + i * 0.3) * 0.004;
    if (y > 9) y = 0.2;
    const wx = camPos.x + ((x - camPos.x + 22) % 44) - 22;
    const wz = camPos.z + ((z - camPos.z + 22) % 44) - 22;
    dp.setXYZ(i, wx, y, wz);
    dc.setXYZ(i, pc.r, pc.g, pc.b);
  }
  dp.needsUpdate = true;
  dc.needsUpdate = true;
  dustMat.opacity = 0.28 + th.dust / 280;

  for (const g of groups.values()) {
    g.traverse((o) => {
      if (o.name === "spin") {
        o.rotation.y += dt * (o.userData.spd || 0.25);
        o.rotation.x += dt * 0.05;
      }
      if (o.name === "orbit") {
        const a = tAbs * o.userData.spd;
        o.position.x = Math.cos(a) * o.userData.radius;
        o.position.z = Math.sin(a) * o.userData.radius;
        o.position.y = o.userData.baseY + Math.sin(a * 2) * 0.12;
      }
      if (o.name === "bob") {
        o.position.y = o.userData.baseY + Math.sin(tAbs * 2.2 + o.userData.ph) * 0.08;
      }
      if (o.name === "water") {
        o.rotation.z = Math.sin(tAbs * 0.4) * 0.01;
      }
    });
  }

  if (th.name !== lastPlace) {
    lastPlace = th.name;
    placename.textContent = th.name;
    placedesc.textContent = th.desc;
  }

  composer.render();
  requestAnimationFrame(tick);
}

syncMeshes(0);
const boot = sampleSpine(0.12);
camera.position.copy(boot.pos);
camera.position.y = 1.55;
camera.lookAt(sampleSpine(1.2).pos);
tick();
  </script>
</body>
