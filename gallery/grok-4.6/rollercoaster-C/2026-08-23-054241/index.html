<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse Run</title>
  <style>
    :root {
      --gold: #f4c56d;
      --rose: #ff6b9d;
      --cyan: #6ee7ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03030a; }
    body {
      font-family: "Segoe UI", "Avenir Next", Futura, system-ui, sans-serif;
      color: #f6efe4;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #veil {
      position: fixed; inset: 0; pointer-events: none; z-index: 4;
      background:
        radial-gradient(ellipse at 50% 120%, transparent 40%, rgba(3,3,10,.55) 100%),
        linear-gradient(180deg, rgba(3,3,12,.28), transparent 18%, transparent 82%, rgba(3,3,12,.5));
    }
    #grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: .07;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>");
      mix-blend-mode: overlay;
    }
    #hud {
      position: fixed; inset: 0; z-index: 6; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 36px 24px;
    }
    #wordmark {
      display: flex; justify-content: space-between; align-items: flex-start;
      letter-spacing: .34em; font-size: 11px; text-transform: uppercase;
      color: rgba(246,239,228,.55);
    }
    #wordmark strong { color: var(--gold); font-weight: 600; letter-spacing: .42em; }
    #titlecard {
      position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 42%, rgba(18,10,28,.2), rgba(3,3,10,.72) 62%);
      transition: opacity 1.8s ease, visibility 1.8s;
    }
    #titlecard.hide { opacity: 0; visibility: hidden; }
    #titlecard .inner { text-align: center; transform: translateY(-6vh); }
    #titlecard .kicker {
      letter-spacing: .5em; font-size: 11px; text-transform: uppercase;
      color: var(--cyan); margin-bottom: 18px; opacity: .85;
    }
    #titlecard h1 {
      font-weight: 500; font-size: clamp(42px, 8vw, 92px); letter-spacing: .18em;
      text-transform: uppercase; line-height: .92;
      background: linear-gradient(180deg, #fff6e5 0%, var(--gold) 42%, #c4843a 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 20px 80px rgba(244,197,109,.15);
    }
    #titlecard p {
      margin-top: 22px; font-size: 14px; letter-spacing: .28em; text-transform: uppercase;
      color: rgba(246,239,228,.62);
    }
    #rail {
      height: 2px; background: rgba(255,255,255,.08); position: relative; overflow: hidden;
      border-radius: 2px;
    }
    #rail > i {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--rose), var(--cyan));
      box-shadow: 0 0 16px rgba(244,197,109,.55);
    }
    #meta {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
      margin-bottom: 10px; font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
      color: rgba(246,239,228,.5);
    }
    #meta b { color: var(--gold); font-weight: 600; }
    button#sound {
      pointer-events: auto; cursor: pointer; align-self: flex-start;
      background: rgba(255,255,255,.04); border: 1px solid rgba(244,197,109,.28);
      color: rgba(246,239,228,.7); letter-spacing: .28em; text-transform: uppercase;
      font-size: 10px; padding: 8px 12px; border-radius: 999px;
    }
    button#sound:hover { border-color: var(--gold); color: #fff; }
  </style>
</head>
<body>
  <div id="veil"></div>
  <div id="grain"></div>
  <div id="hud">
    <div id="wordmark">
      <strong>Eclipse Run</strong>
      <span>Night Circuit · Automatic</span>
    </div>
    <div>
      <div id="meta">
        <span id="phase">Boarding</span>
        <b id="speed">00</b>
        <button id="sound" type="button">Sound</button>
      </div>
      <div id="rail"><i id="fill"></i></div>
    </div>
  </div>
  <div id="titlecard">
    <div class="inner">
      <div class="kicker">A complete night ride</div>
      <h1>Eclipse<br>Run</h1>
      <p>Hold still. The drop is coming.</p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const GOLD = 0xf4c56d;
    const ROSE = 0xff6b9d;
    const CYAN = 0x6ee7ff;
    const INK = 0x070714;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04040e);
    scene.fog = new THREE.FogExp2(0x07071a, 0.00155);

    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.12, 2400);
    const clock = new THREE.Clock();

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.55, 0.22);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    scene.add(new THREE.AmbientLight(0x1a2244, 0.55));
    const moonLight = new THREE.DirectionalLight(0xc9d7ff, 0.55);
    moonLight.position.set(-180, 260, 40);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.near = 20;
    moonLight.shadow.camera.far = 900;
    moonLight.shadow.camera.left = -280;
    moonLight.shadow.camera.right = 280;
    moonLight.shadow.camera.top = 280;
    moonLight.shadow.camera.bottom = -280;
    scene.add(moonLight);
    const hemi = new THREE.HemisphereLight(0x6b7cff, 0x1a0c18, 0.42);
    scene.add(hemi);

    const curve = buildCurve();
    const frames = curve.computeFrenetFrames(900, true);
    buildWorld(scene, curve, frames);
    const rideLights = attachRideLights(scene, curve);

    const sparks = makeSparks();
    scene.add(sparks);

    const fireworks = makeFireworks();
    scene.add(fireworks.points);

    let t = 0.012;
    let speed = 0.012;
    let roll = 0;
    let fov = 62;
    let lookSmoothed = new THREE.Vector3();
    let posSmoothed = new THREE.Vector3();
    let upSmoothed = new THREE.Vector3(0, 1, 0);
    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const tmp3 = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const mat = new THREE.Matrix4();

    const fill = document.getElementById("fill");
    const phaseEl = document.getElementById("phase");
    const speedEl = document.getElementById("speed");
    const card = document.getElementById("titlecard");
    setTimeout(() => card.classList.add("hide"), 2800);

    const audio = createAudio();
    document.getElementById("sound").addEventListener("click", () => {
      audio.toggle();
      document.getElementById("sound").textContent = audio.enabled ? "Mute" : "Sound";
    });

    function buildCurve() {
      const pts = [];
      const push = (x, y, z) => pts.push(new THREE.Vector3(x, y, z));

      push(0, 8.2, 70);
      push(0, 8.2, 28);
      push(0, 8.4, -18);
      push(2, 14, -72);
      push(4, 32, -128);
      push(6, 58, -178);
      push(8, 88, -218);
      push(10, 108, -248);
      push(16, 114, -272);
      push(28, 108, -292);
      push(48, 72, -318);
      push(68, 34, -348);
      push(86, 10, -386);
      push(102, 6.5, -430);
      push(118, 8, -478);
      push(128, 18, -518);
      for (let i = 0; i <= 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        const r = 26;
        push(138 + Math.sin(a) * 4, 18 + (1 - Math.cos(a)) * r, -548 - Math.sin(a) * r * 0.15);
      }
      push(148, 10, -590);
      push(132, 16, -640);
      push(88, 28, -678);
      push(28, 22, -700);
      push(-32, 14, -672);
      push(-78, 20, -620);
      for (let i = 0; i <= 10; i++) {
        const u = i / 10;
        const a = u * Math.PI * 2.15;
        push(-92 + Math.sin(a) * 18, 16 + Math.sin(u * Math.PI) * 22, -560 - u * 55 + Math.cos(a) * 10);
      }
      push(-70, 24, -470);
      push(-20, 40, -420);
      for (let i = 0; i <= 22; i++) {
        const u = i / 22;
        const a = u * Math.PI * 4.2;
        const radius = 58 - u * 10;
        push(
          30 + Math.cos(a) * radius,
          28 + u * 36 + Math.sin(u * Math.PI) * 8,
          -340 + Math.sin(a) * radius
        );
      }
      push(70, 42, -250);
      push(48, 22, -170);
      push(22, 12, -90);
      push(8, 8.6, -20);
      push(2, 8.2, 36);

      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.18);
    }

    function buildWorld(scene, curve, frames) {
      addSky();
      addTerrain();
      addMountains();
      addTrack(curve, frames);
      addStation();
      addCathedral();
      addEclipseOrb();
      addLanterns(curve);
      addGarden();
      addRingGate();
    }

    function addSky() {
      const starGeo = new THREE.BufferGeometry();
      const n = 1800;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = 900 + Math.random() * 700;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(THREE.MathUtils.randFloat(0.02, 0.92));
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph);
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.2, 0.35, 0.7 + Math.random() * 0.3);
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      starGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
        size: 1.6, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false
      })));

      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(38, 48, 48),
        new THREE.MeshBasicMaterial({ color: 0xf3e7c8 })
      );
      moon.position.set(-220, 210, -80);
      scene.add(moon);
      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(52, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x9bb7ff, transparent: true, opacity: 0.08 })
      );
      halo.position.copy(moon.position);
      scene.add(halo);

      const auroraGeo = new THREE.PlaneGeometry(980, 220, 80, 20);
      const auroraMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
          varying vec2 vUv;
          void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
        `,
        fragmentShader: `
          uniform float uTime; varying vec2 vUv;
          void main(){
            float w = sin(vUv.x * 8.0 + uTime * 0.15) * 0.5 + 0.5;
            float w2 = sin(vUv.x * 13.0 - uTime * 0.22 + 1.7) * 0.5 + 0.5;
            float band = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.35, vUv.y);
            vec3 a = vec3(0.35, 0.95, 0.85);
            vec3 b = vec3(0.72, 0.28, 1.0);
            vec3 c = mix(a, b, w2);
            float alpha = band * (0.18 + 0.32 * w) * (0.35 + 0.65 * w2);
            gl_FragColor = vec4(c, alpha);
          }
        `
      });
      const aurora = new THREE.Mesh(auroraGeo, auroraMat);
      aurora.position.set(40, 210, -420);
      aurora.rotation.x = -0.18;
      aurora.name = "aurora";
      scene.add(aurora);
    }

    function addTerrain() {
      const g = new THREE.PlaneGeometry(2200, 2200, 90, 90);
      g.rotateX(-Math.PI / 2);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const d = Math.hypot(x, z);
        const h = Math.sin(x * 0.012) * 4.5 + Math.cos(z * 0.01) * 5.5 + Math.sin((x + z) * 0.007) * 3.2;
        const bowl = Math.max(0, (d - 120) * 0.012);
        pos.setY(i, h * 0.35 - 2.4 + bowl * 0.15);
      }
      g.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x0b1020, roughness: 0.92, metalness: 0.08,
        emissive: 0x0a1428, emissiveIntensity: 0.18
      });
      const ground = new THREE.Mesh(g, mat);
      ground.receiveShadow = true;
      scene.add(ground);

      const water = new THREE.Mesh(
        new THREE.CircleGeometry(420, 72),
        new THREE.MeshStandardMaterial({
          color: 0x0c1c33, metalness: 0.86, roughness: 0.18,
          emissive: 0x102040, emissiveIntensity: 0.25
        })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = -1.6;
      scene.add(water);
    }

    function addMountains() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x121428, roughness: 0.95, metalness: 0.05, flatShading: true
      });
      for (let i = 0; i < 18; i++) {
        const h = 80 + Math.random() * 160;
        const mesh = new THREE.Mesh(new THREE.ConeGeometry(40 + Math.random() * 50, h, 5), mat);
        const a = (i / 18) * Math.PI * 2 + Math.random() * 0.2;
        const r = 520 + Math.random() * 220;
        mesh.position.set(Math.cos(a) * r, h * 0.32 - 10, Math.sin(a) * r - 80);
        mesh.rotation.y = Math.random() * 6;
        scene.add(mesh);
      }
    }

    function addTrack(curve, frames) {
      const railMat = new THREE.MeshStandardMaterial({
        color: 0xd9b36a, metalness: 0.95, roughness: 0.18,
        emissive: GOLD, emissiveIntensity: 0.42
      });
      const glowMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.22 });
      const spineMat = new THREE.MeshStandardMaterial({
        color: 0x1a1420, metalness: 0.6, roughness: 0.4,
        emissive: ROSE, emissiveIntensity: 0.18
      });

      const spine = new THREE.Mesh(new THREE.TubeGeometry(curve, 900, 0.28, 8, true), spineMat);
      spine.castShadow = true;
      scene.add(spine);

      const left = offsetCurve(curve, frames, 0.72);
      const right = offsetCurve(curve, frames, -0.72);
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(left, 900, 0.11, 7, true), railMat));
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(right, 900, 0.11, 7, true), railMat));
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(left, 400, 0.32, 6, true), glowMat));
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(right, 400, 0.32, 6, true), glowMat));

      const tieGeo = new THREE.BoxGeometry(1.7, 0.08, 0.22);
      const tieMat = new THREE.MeshStandardMaterial({
        color: 0x2a2230, metalness: 0.4, roughness: 0.55, emissive: 0x3a2040, emissiveIntensity: 0.2
      });
      const ties = new THREE.InstancedMesh(tieGeo, tieMat, 420);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < 420; i++) {
        const u = i / 420;
        const p = curve.getPointAt(u);
        const tng = curve.getTangentAt(u);
        dummy.position.copy(p);
        dummy.lookAt(p.clone().add(tng));
        dummy.updateMatrix();
        ties.setMatrixAt(i, dummy.matrix);
      }
      scene.add(ties);

      const postGeo = new THREE.CylinderGeometry(0.16, 0.28, 1, 6);
      const postMat = new THREE.MeshStandardMaterial({ color: 0x1c1824, metalness: 0.5, roughness: 0.45 });
      const posts = new THREE.InstancedMesh(postGeo, postMat, 160);
      let pi = 0;
      for (let i = 0; i < 160; i++) {
        const u = i / 160;
        const p = curve.getPointAt(u);
        if (p.y < 7) continue;
        const h = p.y + 1.8;
        dummy.position.set(p.x, h / 2 - 1.8, p.z);
        dummy.scale.set(1, h, 1);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        posts.setMatrixAt(pi++, dummy.matrix);
      }
      posts.count = pi;
      scene.add(posts);
    }

    function offsetCurve(curve, frames, side) {
      const pts = [];
      const N = 400;
      for (let i = 0; i <= N; i++) {
        const u = i / N;
        const p = curve.getPointAt(u);
        const bin = frames.binormals[Math.min(frames.binormals.length - 1, Math.floor(u * (frames.binormals.length - 1)))];
        pts.push(p.clone().addScaledVector(bin, side));
      }
      return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.2);
    }

    function addStation() {
      const deck = new THREE.Mesh(
        new THREE.BoxGeometry(18, 0.6, 42),
        new THREE.MeshStandardMaterial({ color: 0x16101c, metalness: 0.4, roughness: 0.5, emissive: 0x221018, emissiveIntensity: 0.2 })
      );
      deck.position.set(0, 6.6, 52);
      scene.add(deck);

      const colMat = new THREE.MeshStandardMaterial({
        color: 0x2a2118, metalness: 0.7, roughness: 0.3, emissive: GOLD, emissiveIntensity: 0.15
      });
      for (const z of [36, 52, 68]) {
        for (const x of [-7.5, 7.5]) {
          const c = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 14, 10), colMat);
          c.position.set(x, 13.5, z);
          scene.add(c);
        }
      }
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(20, 0.35, 44),
        new THREE.MeshStandardMaterial({ color: 0x1a1018, metalness: 0.3, roughness: 0.6, emissive: ROSE, emissiveIntensity: 0.08 })
      );
      roof.position.set(0, 21, 52);
      scene.add(roof);

      const lamp = new THREE.PointLight(GOLD, 18, 48, 2);
      lamp.position.set(0, 16, 52);
      scene.add(lamp);
    }

    function addCathedral() {
      const archMat = new THREE.MeshStandardMaterial({
        color: 0x140c22, metalness: 0.25, roughness: 0.7,
        emissive: CYAN, emissiveIntensity: 0.22
      });
      const neon = new THREE.MeshBasicMaterial({ color: CYAN });
      for (let i = 0; i < 9; i++) {
        const z = -390 - i * 14;
        const x = 96 + i * 3.2;
        const arch = new THREE.Mesh(new THREE.TorusGeometry(16 + i * 0.4, 0.55, 10, 48, Math.PI), archMat);
        arch.rotation.y = Math.PI / 2;
        arch.position.set(x, 16, z);
        scene.add(arch);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(16.2 + i * 0.4, 0.08, 8, 48, Math.PI), neon);
        rim.rotation.y = Math.PI / 2;
        rim.position.copy(arch.position);
        scene.add(rim);
        const light = new THREE.PointLight(i % 2 ? CYAN : ROSE, 10, 40, 2);
        light.position.set(x, 10, z);
        scene.add(light);
      }
      const floorGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(28, 130),
        new THREE.MeshBasicMaterial({ color: 0x3a2060, transparent: true, opacity: 0.18 })
      );
      floorGlow.rotation.x = -Math.PI / 2;
      floorGlow.position.set(108, 1.2, -450);
      scene.add(floorGlow);
    }

    function addEclipseOrb() {
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(22, 48, 48),
        new THREE.MeshStandardMaterial({
          color: 0x050308, metalness: 0.9, roughness: 0.25,
          emissive: 0x140818, emissiveIntensity: 0.8
        })
      );
      core.position.set(30, 46, -340);
      scene.add(core);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(34, 0.55, 12, 80),
        new THREE.MeshBasicMaterial({ color: GOLD })
      );
      ring.rotation.x = Math.PI / 2.35;
      ring.position.copy(core.position);
      ring.name = "eclipseRing";
      scene.add(ring);

      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(40, 0.18, 8, 80),
        new THREE.MeshBasicMaterial({ color: ROSE })
      );
      ring2.rotation.x = Math.PI / 1.7;
      ring2.position.copy(core.position);
      ring2.name = "eclipseRing2";
      scene.add(ring2);

      const corona = new THREE.PointLight(GOLD, 40, 160, 1.6);
      corona.position.copy(core.position);
      scene.add(corona);
      const inner = new THREE.PointLight(ROSE, 18, 90, 2);
      inner.position.copy(core.position);
      scene.add(inner);
    }

    function addRingGate() {
      const gate = new THREE.Mesh(
        new THREE.TorusGeometry(12, 0.45, 12, 64),
        new THREE.MeshBasicMaterial({ color: ROSE })
      );
      gate.position.set(70, 18, -350);
      gate.lookAt(90, 10, -400);
      scene.add(gate);
      const g2 = new THREE.Mesh(
        new THREE.TorusGeometry(14.5, 0.12, 8, 64),
        new THREE.MeshBasicMaterial({ color: CYAN })
      );
      g2.position.copy(gate.position);
      g2.rotation.copy(gate.rotation);
      scene.add(g2);
    }

    function addLanterns(curve) {
      const geo = new THREE.SphereGeometry(0.55, 10, 10);
      const mats = [
        new THREE.MeshBasicMaterial({ color: GOLD }),
        new THREE.MeshBasicMaterial({ color: ROSE }),
        new THREE.MeshBasicMaterial({ color: CYAN })
      ];
      for (let i = 0; i < 70; i++) {
        const u = (i + 0.35) / 70;
        const p = curve.getPointAt(u);
        const side = i % 2 ? 1 : -1;
        const tng = curve.getTangentAt(u);
        const sideV = tmp.crossVectors(tng, new THREE.Vector3(0, 1, 0)).normalize();
        const lantern = new THREE.Mesh(geo, mats[i % 3]);
        lantern.position.copy(p).addScaledVector(sideV, side * (6 + (i % 5))).add(new THREE.Vector3(0, 2.2, 0));
        scene.add(lantern);
        if (i % 4 === 0) {
          const l = new THREE.PointLight(i % 3 === 0 ? GOLD : i % 3 === 1 ? ROSE : CYAN, 6, 22, 2);
          l.position.copy(lantern.position);
          scene.add(l);
        }
      }
    }

    function addGarden() {
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1210, roughness: 0.9 });
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0x2a1830, emissive: ROSE, emissiveIntensity: 0.35, roughness: 0.7
      });
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 90 + Math.random() * 280;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r - 80;
        if (Math.hypot(x, z + 340) < 50) continue;
        const h = 6 + Math.random() * 10;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, h, 5), trunkMat);
        trunk.position.set(x, h * 0.5, z);
        scene.add(trunk);
        const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4 + Math.random() * 1.6, 0), leafMat);
        canopy.position.set(x, h + 1.4, z);
        scene.add(canopy);
      }

      const fireflyGeo = new THREE.BufferGeometry();
      const n = 400;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        pos[i * 3] = THREE.MathUtils.randFloatSpread(700);
        pos[i * 3 + 1] = Math.random() * 40 + 2;
        pos[i * 3 + 2] = THREE.MathUtils.randFloatSpread(800) - 80;
      }
      fireflyGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const flies = new THREE.Points(fireflyGeo, new THREE.PointsMaterial({
        color: GOLD, size: 0.7, transparent: true, opacity: 0.85, depthWrite: false
      }));
      flies.name = "fireflies";
      scene.add(flies);
    }

    function attachRideLights(scene, curve) {
      const a = new THREE.PointLight(GOLD, 12, 28, 2);
      const b = new THREE.PointLight(CYAN, 7, 22, 2);
      scene.add(a, b);
      return { a, b };
    }

    function makeSparks() {
      const geo = new THREE.BufferGeometry();
      const n = 80;
      const pos = new Float32Array(n * 3);
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffe6a8, size: 0.18, transparent: true, opacity: 0.85, depthWrite: false
      });
      const pts = new THREE.Points(geo, mat);
      pts.userData.n = n;
      return pts;
    }

    function makeFireworks() {
      const n = 600;
      const pos = new Float32Array(n * 3);
      const vel = [];
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffc978, size: 0.9, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geo, mat);
      for (let i = 0; i < n; i++) vel.push(new THREE.Vector3());
      return { points, vel, burstT: -1 };
    }

    function burstFireworks(origin) {
      const pos = fireworks.points.geometry.attributes.position;
      for (let i = 0; i < fireworks.vel.length; i++) {
        const dir = new THREE.Vector3().randomDirection().multiplyScalar(6 + Math.random() * 18);
        fireworks.vel[i].copy(dir);
        pos.setXYZ(i, origin.x, origin.y, origin.z);
      }
      pos.needsUpdate = true;
      fireworks.points.material.opacity = 1;
      fireworks.burstT = 0;
    }

    function updateFireworks(dt) {
      if (fireworks.burstT < 0) return;
      fireworks.burstT += dt;
      const pos = fireworks.points.geometry.attributes.position;
      for (let i = 0; i < fireworks.vel.length; i++) {
        fireworks.vel[i].y -= 14 * dt;
        pos.setXYZ(
          i,
          pos.getX(i) + fireworks.vel[i].x * dt,
          pos.getY(i) + fireworks.vel[i].y * dt,
          pos.getZ(i) + fireworks.vel[i].z * dt
        );
      }
      pos.needsUpdate = true;
      fireworks.points.material.opacity = Math.max(0, 1 - fireworks.burstT / 2.4);
      fireworks.points.material.color.setHSL((0.08 + fireworks.burstT * 0.12) % 1, 0.75, 0.6);
      if (fireworks.burstT > 2.5) fireworks.burstT = -1;
    }

    function speedAt(u) {
      const climb = smoothPulse(u, 0.05, 0.22);
      const hang = smoothPulse(u, 0.22, 0.27);
      const drop = smoothPulse(u, 0.27, 0.42);
      const loop = smoothPulse(u, 0.42, 0.55);
      const twist = smoothPulse(u, 0.55, 0.7);
      const helix = smoothPulse(u, 0.7, 0.88);
      const brake = smoothPulse(u, 0.88, 1.0) + smoothPulse(u, 0.0, 0.05);
      return (
        0.011 * (1 - climb) * 0.35 +
        0.009 * climb +
        0.006 * hang +
        0.055 * drop +
        0.038 * loop +
        0.034 * twist +
        0.028 * helix +
        0.01 * brake +
        0.012
      );
    }

    function smoothPulse(u, a, b) {
      if (u < a || u > b) return 0;
      const x = (u - a) / (b - a);
      return Math.sin(x * Math.PI);
    }

    function phaseName(u) {
      if (u < 0.08) return "Departure";
      if (u < 0.24) return "Lift Hill";
      if (u < 0.3) return "Crest";
      if (u < 0.42) return "The Descent";
      if (u < 0.55) return "Cathedral Loop";
      if (u < 0.7) return "Corkscrew";
      if (u < 0.88) return "Eclipse Helix";
      return "Finale";
    }

    let lastBurst = -1;
    function sampleRide(u, outPos, outLook, outUp) {
      const p = curve.getPointAt(u);
      const ahead = curve.getPointAt((u + 0.018) % 1);
      const tng = curve.getTangentAt(u);
      const idx = Math.min(frames.normals.length - 1, Math.floor(u * (frames.normals.length - 1)));
      const nrm = frames.normals[idx];
      const bin = frames.binormals[idx];
      const nextU = (u + 0.012) % 1;
      const nextIdx = Math.min(frames.binormals.length - 1, Math.floor(nextU * (frames.binormals.length - 1)));
      const yawDelta = bin.dot(frames.binormals[nextIdx]);
      const targetRoll = THREE.MathUtils.clamp((1 - yawDelta) * Math.sign(tng.x + 0.001) * 1.1, -0.7, 0.7);
      roll = THREE.MathUtils.damp(roll, targetRoll + nrm.x * 0.15, 6, 0.016);

      outPos.copy(p).addScaledVector(nrm, 0.95).addScaledVector(new THREE.Vector3(0, 1, 0), 1.15);
      outLook.copy(ahead).add(new THREE.Vector3(0, 1.05, 0));
      outUp.set(0, 1, 0).applyAxisAngle(tng, roll);
    }

    const ridePos = new THREE.Vector3();
    const rideLook = new THREE.Vector3();
    const rideUp = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      const elapsed = clock.elapsedTime;

      const targetSpeed = speedAt(t);
      speed = THREE.MathUtils.damp(speed, targetSpeed, 3.2, dt);
      t = (t + speed * dt * 0.85) % 1;

      sampleRide(t, ridePos, rideLook, rideUp);
      if (posSmoothed.lengthSq() === 0) {
        posSmoothed.copy(ridePos);
        lookSmoothed.copy(rideLook);
        upSmoothed.copy(rideUp);
      }
      posSmoothed.lerp(ridePos, 1 - Math.exp(-10 * dt));
      lookSmoothed.lerp(rideLook, 1 - Math.exp(-8 * dt));
      upSmoothed.lerp(rideUp, 1 - Math.exp(-6 * dt)).normalize();

      const shake = Math.max(0, speed - 0.03) * 0.35;
      tmp.set(
        Math.sin(elapsed * 37) * shake,
        Math.cos(elapsed * 41) * shake * 0.6,
        Math.sin(elapsed * 23) * shake * 0.4
      );
      camera.position.copy(posSmoothed).add(tmp);
      camera.up.copy(upSmoothed);
      camera.lookAt(lookSmoothed);

      const targetFov = 58 + speed * 520;
      fov = THREE.MathUtils.damp(fov, targetFov, 4, dt);
      camera.fov = fov;
      camera.updateProjectionMatrix();

      bloom.strength = 0.55 + speed * 4.5;
      renderer.toneMappingExposure = 1.05 + (t > 0.27 && t < 0.42 ? 0.18 : 0);

      rideLights.a.position.copy(posSmoothed);
      rideLights.b.position.copy(lookSmoothed);

      const sparkPos = sparks.geometry.attributes.position;
      const tng = curve.getTangentAt(t);
      for (let i = 0; i < sparks.userData.n; i++) {
        const back = posSmoothed.clone()
          .addScaledVector(tng, -0.8 - Math.random() * 2.2)
          .add(new THREE.Vector3((Math.random() - 0.5) * 0.8, -0.4 - Math.random() * 0.6, (Math.random() - 0.5) * 0.8));
        sparkPos.setXYZ(i, back.x, back.y, back.z);
      }
      sparkPos.needsUpdate = true;
      sparks.material.opacity = THREE.MathUtils.clamp((speed - 0.02) * 12, 0.05, 0.9);

      const aurora = scene.getObjectByName("aurora");
      if (aurora) aurora.material.uniforms.uTime.value = elapsed;
      const ring = scene.getObjectByName("eclipseRing");
      if (ring) ring.rotation.z = elapsed * 0.18;
      const ring2 = scene.getObjectByName("eclipseRing2");
      if (ring2) ring2.rotation.z = -elapsed * 0.12;
      const flies = scene.getObjectByName("fireflies");
      if (flies) flies.rotation.y = elapsed * 0.02;

      if (t > 0.82 && t < 0.9 && lastBurst < 0.82) {
        burstFireworks(new THREE.Vector3(30, 70, -340));
        lastBurst = t;
      }
      if (t < 0.1) lastBurst = -1;
      updateFireworks(dt);

      fill.style.width = `${(t * 100).toFixed(2)}%`;
      phaseEl.textContent = phaseName(t);
      speedEl.textContent = String(Math.round(40 + speed * 2800)).padStart(2, "0");

      audio.tick(speed, t);
      composer.render();
    }

    function createAudio() {
      let ctx, master, wind, rumble, lift, enabled = false;
      function ensure() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.0;
        master.connect(ctx.destination);

        const makeNoise = () => {
          const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;
          const f = ctx.createBiquadFilter();
          f.type = "bandpass";
          src.connect(f);
          const g = ctx.createGain();
          g.gain.value = 0.0001;
          f.connect(g);
          g.connect(master);
          src.start();
          return { filter: f, gain: g };
        };
        wind = makeNoise();
        wind.filter.frequency.value = 800;
        rumble = makeNoise();
        rumble.filter.frequency.value = 80;
        rumble.filter.Q.value = 0.6;

        lift = ctx.createOscillator();
        lift.type = "square";
        lift.frequency.value = 4;
        const liftG = ctx.createGain();
        liftG.gain.value = 0.0001;
        lift.connect(liftG);
        liftG.connect(master);
        lift.start();
        lift.gain = liftG;
      }
      return {
        get enabled() { return enabled; },
        toggle() {
          ensure();
          enabled = !enabled;
          if (ctx.state === "suspended") ctx.resume();
          master.gain.setTargetAtTime(enabled ? 0.22 : 0.0, ctx.currentTime, 0.15);
        },
        tick(spd, u) {
          if (!ctx || !enabled) return;
          const now = ctx.currentTime;
          wind.gain.gain.setTargetAtTime(0.04 + spd * 1.8, now, 0.1);
          wind.filter.frequency.setTargetAtTime(500 + spd * 18000, now, 0.1);
          rumble.gain.gain.setTargetAtTime(0.03 + spd * 1.4, now, 0.1);
          const climbing = u > 0.06 && u < 0.24;
          lift.gain.gain.setTargetAtTime(climbing ? 0.012 : 0.0001, now, 0.08);
        }
      };
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
