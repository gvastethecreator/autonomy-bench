<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightfall — Cliffside Coaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #071018;
      --gold: #e8c990;
      --mist: rgba(232, 236, 244, 0.78);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: #f4f1ea;
      font-family: Outfit, system-ui, sans-serif;
      cursor: none;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(3, 6, 12, 0.55) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, transparent 18%, transparent 78%, rgba(0,0,0,0.42) 100%);
      z-index: 2;
    }
    .speed-streaks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 46%,
        rgba(255, 255, 255, 0.035) 50%,
        transparent 54% 100%
      );
      mix-blend-mode: screen;
      transform: scaleY(1.4);
    }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      padding: 28px 34px;
    }
    .brand {
      position: absolute;
      top: 28px;
      left: 34px;
      opacity: 0.92;
    }
    .brand small {
      display: block;
      letter-spacing: 0.42em;
      font-size: 10px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .brand h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 0.08em;
      line-height: 1;
    }
    .telemetry {
      position: absolute;
      right: 34px;
      bottom: 30px;
      text-align: right;
      display: grid;
      gap: 10px;
    }
    .stat label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(232, 201, 144, 0.7);
      margin-bottom: 2px;
    }
    .stat b {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .hint {
      position: absolute;
      left: 34px;
      bottom: 30px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mist);
      opacity: 0.7;
    }
    .letterbox {
      position: fixed;
      left: 0;
      right: 0;
      height: 0;
      background: #000;
      z-index: 5;
      pointer-events: none;
      transition: height 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .letterbox.top { top: 0; }
    .letterbox.bottom { bottom: 0; }
    body.intro .letterbox { height: 12vh; }
    .gate {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(24, 48, 72, 0.35), transparent 48%),
        linear-gradient(180deg, rgba(4, 8, 14, 0.42), rgba(4, 8, 14, 0.78));
      backdrop-filter: blur(8px);
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    .gate.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .gate-card {
      text-align: center;
      max-width: 560px;
      padding: 24px;
      pointer-events: auto;
      cursor: pointer;
    }
    .gate-card .kicker {
      letter-spacing: 0.5em;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }
    .gate-card h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(48px, 8vw, 84px);
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 0.9;
    }
    .gate-card p {
      margin: 22px auto 36px;
      max-width: 38ch;
      color: var(--mist);
      font-weight: 300;
      line-height: 1.65;
      font-size: 16px;
    }
    .ride-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(232, 201, 144, 0.55);
      background: rgba(232, 201, 144, 0.08);
      color: #f7ecd4;
      padding: 14px 28px;
      letter-spacing: 0.34em;
      font-size: 12px;
      text-transform: uppercase;
      border-radius: 999px;
      transition: background 0.25s ease, transform 0.25s ease;
    }
    .gate-card:hover .ride-btn {
      background: rgba(232, 201, 144, 0.18);
      transform: translateY(-1px);
    }
    .paused-flag {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 0.4em;
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    body.paused .paused-flag { opacity: 0.9; }
    .cursor-dot {
      position: fixed;
      width: 10px;
      height: 10px;
      border: 1px solid rgba(232, 201, 144, 0.85);
      border-radius: 50%;
      pointer-events: none;
      z-index: 12;
      mix-blend-mode: difference;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body class="intro">
  <div id="canvas-wrap"></div>
  <div class="vignette"></div>
  <div class="speed-streaks" id="streaks"></div>
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>
  <div class="hud">
    <div class="brand">
      <small>Aurora Range</small>
      <h1>Nightfall</h1>
    </div>
    <div class="hint" id="hint">Space pause · F fullscreen · M mute</div>
    <div class="telemetry">
      <div class="stat"><label>Speed</label><b id="speed">00</b></div>
      <div class="stat"><label>Height</label><b id="height">00 m</b></div>
      <div class="stat"><label>Force</label><b id="gforce">1.00 g</b></div>
    </div>
  </div>
  <div class="paused-flag">PAUSED</div>
  <div class="gate" id="gate">
    <div class="gate-card" id="start">
      <div class="kicker">First-person · Continuous ride</div>
      <h2>NIGHTFALL</h2>
      <p>A twilight drop along the cliff, through the helix, and back under the aurora. The train never stops.</p>
      <div class="ride-btn">Begin ride</div>
    </div>
  </div>
  <div class="cursor-dot" id="cursor"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const wrap = document.getElementById("canvas-wrap");
    const gate = document.getElementById("gate");
    const streaks = document.getElementById("streaks");
    const cursor = document.getElementById("cursor");
    const elSpeed = document.getElementById("speed");
    const elHeight = document.getElementById("height");
    const elG = document.getElementById("gforce");

    let playing = false;
    let paused = false;
    let muted = false;
    let audio;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07131f);
    scene.fog = new THREE.FogExp2(0x0b1a28, 0.00235);

    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.12, 2400);
    camera.position.set(0, 10, 20);

    const clock = new THREE.Clock();

    scene.add(new THREE.HemisphereLight(0x6ea0c8, 0x1a120c, 0.55));
    const moonLight = new THREE.DirectionalLight(0xcfe6ff, 1.15);
    moonLight.position.set(-180, 220, 60);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.near = 20;
    moonLight.shadow.camera.far = 700;
    moonLight.shadow.camera.left = -260;
    moonLight.shadow.camera.right = 260;
    moonLight.shadow.camera.top = 260;
    moonLight.shadow.camera.bottom = -260;
    scene.add(moonLight);

    const fill = new THREE.DirectionalLight(0xff9a62, 0.22);
    fill.position.set(80, 30, -120);
    scene.add(fill);

    function makeTrackPoints() {
      const pts = [];
      const add = (x, y, z) => pts.push(new THREE.Vector3(x, y, z));

      add(0, 8.2, -46);
      add(0, 8.2, -8);
      add(0, 8.2, 36);
      add(2, 10.5, 78);
      add(6, 22, 118);
      add(10, 40, 156);
      add(14, 62, 194);
      add(18, 84, 228);
      add(28, 92, 258);
      add(46, 78, 286);
      add(68, 42, 312);
      add(92, 16, 328);
      add(128, 9, 336);
      add(168, 11, 322);
      add(198, 16, 288);
      add(212, 22, 246);
      add(204, 48, 208);
      add(176, 22, 176);
      add(148, 11, 158);

      const loopX = 118;
      const loopZ = 150;
      const r = 21;
      for (let i = 0; i <= 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        add(loopX - 8 - r * Math.sin(a), 9 + r * (1 - Math.cos(a)), loopZ - i * 0.35);
      }

      add(86, 11, 138);
      add(54, 14, 128);
      add(18, 18, 132);
      add(-18, 26, 150);
      add(-46, 38, 178);

      for (let i = 0; i <= 28; i++) {
        const u = i / 28;
        const ang = u * Math.PI * 3.15;
        const rad = 42 - u * 10;
        add(-70 + Math.cos(ang) * rad, 18 + u * 16 + Math.sin(u * Math.PI) * 8, 210 + Math.sin(ang) * rad);
      }

      add(-92, 28, 248);
      add(-108, 14, 276);
      add(-96, 36, 312);
      add(-62, 18, 338);
      add(-18, 42, 348);
      add(24, 16, 336);
      add(40, 30, 300);
      add(28, 12, 258);
      add(8, 22, 214);
      add(-4, 10, 168);
      add(-6, 14, 118);
      add(-4, 9.5, 64);
      add(-1, 8.4, 12);
      add(0, 8.2, -24);

      return pts;
    }

    const trackPts = makeTrackPoints();
    const curve = new THREE.CatmullRomCurve3(trackPts, true, "catmullrom", 0.42);
    const totalLen = curve.getLength();
    const SEG = 720;
    const frames = curve.computeFrenetFrames(SEG, true);

    const railMat = new THREE.MeshStandardMaterial({
      color: 0xd7b07a,
      metalness: 0.88,
      roughness: 0.22,
      envMapIntensity: 1.2
    });
    const spineMat = new THREE.MeshStandardMaterial({
      color: 0x2a333c,
      metalness: 0.55,
      roughness: 0.48
    });
    const tieMat = new THREE.MeshStandardMaterial({
      color: 0x8d5a32,
      metalness: 0.35,
      roughness: 0.62
    });
    const supportMat = new THREE.MeshStandardMaterial({
      color: 0x3c4550,
      metalness: 0.7,
      roughness: 0.4
    });

    function offsetPath(sign, lift = 0.06) {
      const out = [];
      for (let i = 0; i <= SEG; i++) {
        const t = i / SEG;
        const p = curve.getPointAt(t);
        const b = frames.binormals[i];
        const n = frames.normals[i];
        out.push(p.clone().addScaledVector(b, sign * 0.52).addScaledVector(n, lift));
      }
      return new THREE.CatmullRomCurve3(out, true);
    }

    const leftRail = new THREE.Mesh(new THREE.TubeGeometry(offsetPath(1), SEG, 0.075, 7, true), railMat);
    const rightRail = new THREE.Mesh(new THREE.TubeGeometry(offsetPath(-1), SEG, 0.075, 7, true), railMat);
    const spine = new THREE.Mesh(new THREE.TubeGeometry(offsetPath(0, -0.18), Math.floor(SEG / 2), 0.055, 5, true), spineMat);
    leftRail.castShadow = rightRail.castShadow = spine.castShadow = true;
    scene.add(leftRail, rightRail, spine);

    const ties = new THREE.Group();
    const tieGeo = new THREE.BoxGeometry(1.18, 0.07, 0.16);
    for (let i = 0; i < SEG; i += 3) {
      const t = i / SEG;
      const p = curve.getPointAt(t);
      const tan = curve.getTangentAt(t);
      const b = frames.binormals[i];
      const n = frames.normals[i];
      const mesh = new THREE.Mesh(tieGeo, tieMat);
      mesh.position.copy(p).addScaledVector(n, -0.08);
      mesh.up.copy(n);
      mesh.lookAt(p.clone().add(tan));
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan.clone().normalize());
      const xAxis = b.clone().normalize();
      const yAxis = n.clone().normalize();
      const zAxis = tan.clone().normalize();
      const m = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
      mesh.setRotationFromMatrix(m);
      mesh.castShadow = true;
      ties.add(mesh);
    }
    scene.add(ties);

    const supports = new THREE.Group();
    const capGeo = new THREE.CylinderGeometry(0.28, 0.34, 0.18, 8);
    for (let i = 0; i < SEG; i += 14) {
      const t = i / SEG;
      const p = curve.getPointAt(t);
      if (p.y < 9.5) continue;
      const groundY = terrainHeight(p.x, p.z);
      const h = Math.max(1.2, p.y - groundY - 0.4);
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.22, h, 6), supportMat);
      cyl.position.set(p.x, groundY + h / 2, p.z);
      cyl.castShadow = true;
      const cap = new THREE.Mesh(capGeo, supportMat);
      cap.position.set(p.x, p.y - 0.35, p.z);
      supports.add(cyl, cap);
    }
    scene.add(supports);

    const glowMat = new THREE.MeshBasicMaterial({ color: 0x7ecbff, transparent: true, opacity: 0.85 });
    const glowGeo = new THREE.SphereGeometry(0.18, 8, 8);
    for (let i = 0; i < SEG; i += 18) {
      const t = i / SEG;
      const p = curve.getPointAt(t);
      const n = frames.normals[i];
      const bulb = new THREE.Mesh(glowGeo, glowMat);
      bulb.position.copy(p).addScaledVector(n, 0.55);
      scene.add(bulb);
      if (i % 54 === 0) {
        const lamp = new THREE.PointLight(0x9ad4ff, 2.4, 28, 2);
        lamp.position.copy(bulb.position);
        scene.add(lamp);
      }
    }

    function terrainHeight(x, z) {
      const n =
        Math.sin(x * 0.012) * 6.5 +
        Math.cos(z * 0.01) * 5.2 +
        Math.sin((x + z) * 0.007) * 9 +
        Math.cos(x * 0.004 - z * 0.006) * 14;
      const ridge = Math.max(0, Math.abs(x) - 210) * 0.18 + Math.max(0, Math.abs(z) - 260) * 0.12;
      return Math.max(-2.5, 1.4 + n * 0.45 + ridge);
    }

    const groundGeo = new THREE.PlaneGeometry(1400, 1400, 120, 120);
    groundGeo.rotateX(-Math.PI / 2);
    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
      const x = gPos.getX(i);
      const z = gPos.getZ(i);
      gPos.setY(i, terrainHeight(x, z));
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({
        color: 0x1c2d24,
        roughness: 0.92,
        metalness: 0.04,
        flatShading: false
      })
    );
    ground.receiveShadow = true;
    scene.add(ground);

    const waterGeo = new THREE.PlaneGeometry(900, 520, 40, 24);
    waterGeo.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(
      waterGeo,
      new THREE.MeshPhysicalMaterial({
        color: 0x12364c,
        metalness: 0.15,
        roughness: 0.18,
        transmission: 0.18,
        transparent: true,
        opacity: 0.86,
        reflectivity: 0.7
      })
    );
    water.position.set(40, -1.6, 40);
    scene.add(water);

    const treeGroup = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2618, roughness: 0.9 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x163326, roughness: 0.78 });
    const trunkGeo = new THREE.CylinderGeometry(0.18, 0.32, 2.4, 5);
    const leafGeo = new THREE.ConeGeometry(1.6, 4.4, 7);
    const rng = (s) => {
      let x = Math.sin(s * 999) * 10000;
      return x - Math.floor(x);
    };
    for (let i = 0; i < 220; i++) {
      const x = (rng(i + 2) - 0.5) * 780;
      const z = (rng(i + 9) - 0.5) * 780;
      if (Math.hypot(x, z) < 55) continue;
      const y = terrainHeight(x, z);
      if (y < 0.6) continue;
      const scale = 0.7 + rng(i + 21) * 1.6;
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.set(x, y + 1.2 * scale, z);
      trunk.scale.setScalar(scale);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(x, y + 4.1 * scale, z);
      leaf.scale.setScalar(scale);
      leaf.castShadow = true;
      treeGroup.add(trunk, leaf);
    }
    scene.add(treeGroup);

    const rockMat = new THREE.MeshStandardMaterial({ color: 0x4a5360, roughness: 0.86 });
    for (let i = 0; i < 28; i++) {
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(4 + rng(i) * 8, 0), rockMat);
      const x = (rng(i + 40) - 0.5) * 620;
      const z = (rng(i + 70) - 0.5) * 620;
      rock.position.set(x, terrainHeight(x, z) - 1.2, z);
      rock.rotation.set(rng(i) * 2, rng(i + 1) * 3, rng(i + 2));
      rock.scale.set(1, 0.55 + rng(i + 3) * 0.7, 1.15);
      rock.castShadow = true;
      scene.add(rock);
    }

    const starGeo = new THREE.BufferGeometry();
    const starCount = 1400;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 680 + rng(i) * 400;
      const theta = rng(i + 3) * Math.PI * 2;
      const phi = rng(i + 6) * Math.PI * 0.42;
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = 80 + r * Math.cos(phi) * 0.55;
      starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xeef6ff, size: 1.15 })));

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(16, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xe9f2ff })
    );
    moon.position.set(-220, 250, 80);
    scene.add(moon);
    const moonGlow = new THREE.Mesh(
      new THREE.SphereGeometry(28, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x9ab8e0, transparent: true, opacity: 0.12 })
    );
    moonGlow.position.copy(moon.position);
    scene.add(moonGlow);

    const aurora = new THREE.Group();
    const auroraColors = [0x4dffc2, 0x6ea8ff, 0xc38cff];
    for (let a = 0; a < 3; a++) {
      const g = new THREE.PlaneGeometry(520, 90, 40, 6);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setZ(i, Math.sin(pos.getX(i) * 0.02 + a) * 18);
      }
      const mat = new THREE.MeshBasicMaterial({
        color: auroraColors[a],
        transparent: true,
        opacity: 0.09 + a * 0.03,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const mesh = new THREE.Mesh(g, mat);
      mesh.position.set(-40, 160 + a * 18, -180);
      mesh.rotation.y = 0.4 + a * 0.12;
      aurora.add(mesh);
    }
    scene.add(aurora);

    const station = new THREE.Group();
    const wood = new THREE.MeshStandardMaterial({ color: 0x5b3a24, roughness: 0.8 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x1c2228, roughness: 0.6, metalness: 0.3 });
    const platform = new THREE.Mesh(new THREE.BoxGeometry(10, 0.6, 38), wood);
    platform.position.set(0, 7.6, -8);
    platform.receiveShadow = true;
    const roof = new THREE.Mesh(new THREE.BoxGeometry(12, 0.25, 40), dark);
    roof.position.set(0, 13.4, -8);
    for (const sx of [-4.4, 4.4]) {
      for (const sz of [-22, -8, 6]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 5.6, 8), dark);
        post.position.set(sx, 10.4, sz);
        station.add(post);
      }
    }
    const lampA = new THREE.PointLight(0xffc27a, 3.5, 22, 2);
    lampA.position.set(3.6, 12.2, -16);
    const lampB = lampA.clone();
    lampB.position.set(-3.6, 12.2, 2);
    station.add(platform, roof, lampA, lampB);
    scene.add(station);

    const signCanvas = document.createElement("canvas");
    signCanvas.width = 512;
    signCanvas.height = 128;
    const sctx = signCanvas.getContext("2d");
    sctx.fillStyle = "#1a140f";
    sctx.fillRect(0, 0, 512, 128);
    sctx.strokeStyle = "#e8c990";
    sctx.lineWidth = 8;
    sctx.strokeRect(10, 10, 492, 108);
    sctx.fillStyle = "#e8c990";
    sctx.font = "600 54px serif";
    sctx.textAlign = "center";
    sctx.fillText("NIGHTFALL", 256, 80);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 2),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(signCanvas) })
    );
    sign.position.set(0, 12.2, -27.4);
    scene.add(sign);

    const cart = new THREE.Group();
    const barMat = new THREE.MeshStandardMaterial({ color: 0x22282e, metalness: 0.8, roughness: 0.3 });
    const lap = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.045, 8, 24, Math.PI), barMat);
    lap.rotation.x = Math.PI;
    lap.position.set(0, -0.55, 0.35);
    const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 1.4), barMat);
    frameL.position.set(-0.42, -0.72, 0.15);
    const frameR = frameL.clone();
    frameR.position.x = 0.42;
    cart.add(lap, frameL, frameR);
    camera.add(cart);
    scene.add(camera);

    const sparkGeo = new THREE.BufferGeometry();
    const sparkN = 80;
    const sparkArr = new Float32Array(sparkN * 3);
    sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkArr, 3));
    const sparks = new THREE.Points(
      sparkGeo,
      new THREE.PointsMaterial({ color: 0xffe6b0, size: 0.12, transparent: true, opacity: 0.0 })
    );
    scene.add(sparks);

    let distance = 8;
    let dispSpeed = 0;
    let dispG = 1;
    let prevVel = new THREE.Vector3();
    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const look = new THREE.Vector3();
    const bankedUp = new THREE.Vector3();
    const desiredUp = new THREE.Vector3();

    const lengths = curve.getLengths(SEG);
    function tFromDistance(d) {
      const target = ((d % totalLen) + totalLen) % totalLen;
      let lo = 0;
      let hi = lengths.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (lengths[mid] < target) lo = mid + 1;
        else hi = mid;
      }
      const i = Math.max(1, lo);
      const a = lengths[i - 1];
      const b = lengths[i];
      const u = (i - 1 + (b === a ? 0 : (target - a) / (b - a))) / (lengths.length - 1);
      return Math.min(0.99999, Math.max(0, u));
    }

    function liftFactor(t) {
      return t > 0.03 && t < 0.165 ? 1 : 0;
    }

    function createAudio() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = 0.0;
      master.connect(ctx.destination);

      const rumble = ctx.createOscillator();
      rumble.type = "sawtooth";
      rumble.frequency.value = 42;
      const rumbleG = ctx.createGain();
      rumbleG.gain.value = 0.04;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 180;
      rumble.connect(filter);
      filter.connect(rumbleG);
      rumbleG.connect(master);
      rumble.start();

      const whoosh = ctx.createOscillator();
      whoosh.type = "triangle";
      whoosh.frequency.value = 180;
      const whooshG = ctx.createGain();
      whooshG.gain.value = 0;
      whoosh.connect(whooshG);
      whooshG.connect(master);
      whoosh.start();

      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const noiseF = ctx.createBiquadFilter();
      noiseF.type = "bandpass";
      noiseF.frequency.value = 900;
      const noiseG = ctx.createGain();
      noiseG.gain.value = 0;
      noise.connect(noiseF);
      noiseF.connect(noiseG);
      noiseG.connect(master);
      noise.start();

      return { ctx, master, rumble, rumbleG, whoosh, whooshG, noiseG, filter };
    }

    function startRide() {
      if (playing) return;
      playing = true;
      document.body.classList.remove("intro");
      gate.classList.add("hide");
      if (!audio) audio = createAudio();
      audio.ctx.resume();
      audio.master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, audio.ctx.currentTime + 0.4);
    }

    document.getElementById("start").addEventListener("click", startRide);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (!playing) {
          startRide();
          return;
        }
        paused = !paused;
        document.body.classList.toggle("paused", paused);
        if (audio) {
          if (paused) audio.ctx.suspend();
          else audio.ctx.resume();
        }
      }
      if (e.code === "KeyF") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      }
      if (e.code === "KeyM" && audio) {
        muted = !muted;
        audio.master.gain.setTargetAtTime(muted ? 0 : 0.9, audio.ctx.currentTime, 0.05);
      }
      if (e.code === "Enter" && !playing) startRide();
    });

    window.addEventListener("mousemove", (e) => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let hudTick = 0;
    const hMax = 92;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());
      const tWorld = clock.elapsedTime;

      aurora.children.forEach((m, i) => {
        m.position.x = -40 + Math.sin(tWorld * 0.12 + i) * 16;
        m.material.opacity = 0.08 + Math.sin(tWorld * 0.4 + i) * 0.03;
      });
      water.position.y = -1.6 + Math.sin(tWorld * 0.4) * 0.08;

      const t = tFromDistance(distance);
      const pos = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const idx = Math.floor(t * SEG) % frames.binormals.length;
      const binormal = frames.binormals[idx].clone();
      const normal = frames.normals[idx].clone();

      const lift = liftFactor(t);
      const energy = Math.sqrt(Math.max(2.8, 2 * 9.81 * Math.max(0, hMax - pos.y)));
      const speed = lift > 0 ? 7.2 : THREE.MathUtils.clamp(energy * 0.62, 9, 46);
      if (playing && !paused) distance = (distance + speed * dt) % totalLen;

      const lookT = tFromDistance(distance + Math.max(4.5, speed * 0.22));
      look.copy(curve.getPointAt(lookT));

      const vel = tangent.clone().multiplyScalar(speed);
      const accel = vel.clone().sub(prevVel).divideScalar(Math.max(dt, 1 / 90));
      prevVel.copy(vel);
      const lateral = accel.clone().addScaledVector(tangent, -accel.dot(tangent));
      const bank = THREE.MathUtils.clamp(-lateral.dot(binormal) * 0.0042, -0.72, 0.72);
      desiredUp.copy(normal).applyAxisAngle(tangent, bank * 0.85).normalize();
      if (desiredUp.y < 0.08) desiredUp.lerp(new THREE.Vector3(0, 1, 0), 0.65).normalize();
      bankedUp.lerp(desiredUp, 1 - Math.pow(0.001, dt)).normalize();

      const seat = tmp.copy(pos).addScaledVector(bankedUp, 1.12);
      camera.position.lerp(seat, playing ? 0.85 : 0.04);
      camera.up.copy(bankedUp);
      tmp2.copy(look).addScaledVector(bankedUp, 0.9);
      if (playing) camera.lookAt(tmp2);
      else {
        camera.position.set(18, 22, -70);
        camera.up.set(0, 1, 0);
        camera.lookAt(0, 18, 40);
      }

      const shake = (speed / 46) * (lift ? 0.015 : 0.05);
      if (playing && !paused) {
        camera.position.x += Math.sin(tWorld * 37) * shake;
        camera.position.y += Math.cos(tWorld * 41) * shake * 0.6;
      }

      camera.fov = THREE.MathUtils.lerp(camera.fov, 66 + (speed / 46) * 14, 0.08);
      camera.updateProjectionMatrix();

      const gEst = 1 + (accel.y / 9.81) * 0.12 + Math.abs(bank) * 0.55;
      dispSpeed += (speed * 2.05 - dispSpeed) * 0.12;
      dispG += (gEst - dispG) * 0.14;
      hudTick += dt;
      if (hudTick > 0.08) {
        hudTick = 0;
        elSpeed.textContent = String(Math.round(dispSpeed)).padStart(2, "0");
        elHeight.textContent = `${Math.max(0, pos.y - 8).toFixed(0)} m`;
        elG.textContent = `${Math.max(0.2, dispG).toFixed(2)} g`;
      }

      const rush = THREE.MathUtils.smoothstep(speed, 18, 42);
      streaks.style.opacity = playing && !paused ? String(rush * 0.55) : "0";
      sparks.material.opacity = rush * 0.65;
      const sp = sparks.geometry.attributes.position.array;
      for (let i = 0; i < sparkN; i++) {
        const back = tangent.clone().multiplyScalar(-0.4 - rng(i + 1) * 2.8 * rush);
        const side = binormal.clone().multiplyScalar((rng(i + 4) - 0.5) * 0.9);
        const down = bankedUp.clone().multiplyScalar(-0.4 - rng(i + 7) * 0.5);
        const p = pos.clone().add(back).add(side).add(down);
        sp[i * 3] = p.x;
        sp[i * 3 + 1] = p.y;
        sp[i * 3 + 2] = p.z;
      }
      sparks.geometry.attributes.position.needsUpdate = true;

      if (audio && playing && !paused) {
        audio.rumble.frequency.setTargetAtTime(28 + speed * 1.1, audio.ctx.currentTime, 0.08);
        audio.filter.frequency.setTargetAtTime(120 + speed * 8, audio.ctx.currentTime, 0.08);
        audio.whoosh.frequency.setTargetAtTime(140 + speed * 6, audio.ctx.currentTime, 0.1);
        audio.whooshG.gain.setTargetAtTime(rush * 0.03, audio.ctx.currentTime, 0.1);
        audio.noiseG.gain.setTargetAtTime(rush * 0.045, audio.ctx.currentTime, 0.1);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
