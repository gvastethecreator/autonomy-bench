<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070605; }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(40, 28, 18, 0.35), rgba(6, 5, 4, 0.92) 62%),
        #070605;
      color: #e8dcc8;
      font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      user-select: none;
    }
    #overlay h1 {
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.4rem);
      text-transform: uppercase;
      color: #f3e6d0;
      text-shadow: 0 0 28px rgba(210, 140, 60, 0.28);
    }
    #overlay .rule {
      width: 7.5rem; height: 1px; margin: 1.1rem 0 1.25rem;
      background: linear-gradient(90deg, transparent, #c4a574, transparent);
    }
    #overlay p { font-size: 0.92rem; opacity: 0.78; max-width: 26rem; text-align: center; line-height: 1.55; }
    #overlay kbd {
      font-family: ui-monospace, Consolas, monospace;
      letter-spacing: 0.04em;
      color: #f0d9a8;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
    #hud {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
    }
    #crosshair {
      position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      opacity: 0.55;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: #f0e6d4;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    #crosshair::before { left: 4px; top: 0; width: 2px; height: 10px; }
    #crosshair::after { left: 0; top: 4px; width: 10px; height: 2px; }
    #vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.55) 100%);
    }
    #hint {
      position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(232, 220, 200, 0.55);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Infinite Maze</h1>
    <div class="rule"></div>
    <p>A first-person labyrinth that never ends. Click to enter.<br />
      <kbd>W A S D</kbd> move &nbsp;·&nbsp; <kbd>Shift</kbd> hurry &nbsp;·&nbsp; mouse look &nbsp;·&nbsp; <kbd>Esc</kbd> release</p>
  </div>
  <div id="hud">
    <div id="vignette"></div>
    <div id="crosshair"></div>
    <div id="hint">the corridors continue</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const CELL = 3.6;
    const WALL_H = 3.35;
    const WALL_T = 0.28;
    const PILLAR = 0.34;
    const CHUNK = 8;
    const LOAD_R = 2;
    const EYE = 1.62;
    const RADIUS = 0.27;

    const overlay = document.getElementById("overlay");

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.setClearColor(0x0a0807, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x100c0a, 0.068);
    scene.background = new THREE.Color(0x100c0a);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 80);
    camera.position.set(CELL * 0.5, EYE, CELL * 0.5);
    scene.add(camera);

    const hemi = new THREE.HemisphereLight(0x6a5a48, 0x1a120e, 0.22);
    scene.add(hemi);
    const ambient = new THREE.AmbientLight(0x2a221c, 0.18);
    scene.add(ambient);

    const flashlight = new THREE.SpotLight(0xffe6c8, 7.5, 24, Math.PI / 6.2, 0.42, 1.15);
    flashlight.position.set(0.18, -0.12, 0.08);
    camera.add(flashlight);
    camera.add(flashlight.target);
    flashlight.target.position.set(0, -0.05, -1);

    const fill = new THREE.PointLight(0xffc27a, 0.55, 6.5, 2);
    fill.position.set(0, -0.2, 0.15);
    camera.add(fill);

    // --- deterministic hash ------------------------------------------------
    function u32(n) { return n >>> 0; }
    function hash2(x, z) {
      let h = u32(x * 374761393 + z * 668265263 + 0x9e3779b9);
      h = u32((h ^ (h >>> 13)) * 1274126177);
      h ^= h >>> 16;
      return u32(h);
    }
    function rand01(x, z, salt) {
      return hash2(x * 31 + salt, z * 17 + salt * 13) / 4294967295;
    }

    // Infinite maze: binary-tree spanning structure + arterial corridors + sparse loops.
    // Every cell carves east or south; every 5th lane is a through-street so distant
    // regions stay reachable; occasional extra doors keep the plan from feeling rigid.
    function openEast(x, z) {
      const h = hash2(x, z);
      const carveEast = (h & 1) === 0;
      const artery = ((z % 5) + 5) % 5 === 0;
      const loop = (h % 17) === 0;
      return carveEast || artery || loop;
    }
    function openSouth(x, z) {
      const h = hash2(x, z);
      const carveSouth = (h & 1) === 1;
      const artery = ((x % 5) + 5) % 5 === 0;
      const loop = (h % 19) === 0;
      return carveSouth || artery || loop;
    }
    function hasEastWall(x, z) { return !openEast(x, z); }
    function hasSouthWall(x, z) { return !openSouth(x, z); }
    function isTorchCell(x, z) {
      return hash2(x + 91, z + 53) % 23 === 0;
    }

    // --- canvas textures ---------------------------------------------------
    function noise(g, w, h, alpha, tint) {
      const img = g.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * alpha;
        d[i] = Math.max(0, Math.min(255, d[i] + n + tint));
        d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n + tint * 0.8));
        d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n * 0.7));
      }
      g.putImageData(img, 0, 0);
    }

    function makeWallAlbedo() {
      const s = 512;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      g.fillStyle = "#6a5c4e";
      g.fillRect(0, 0, s, s);
      const bw = 86, bh = 42, mortar = 6;
      for (let row = 0, y = 0; y < s + bh; row++, y += bh) {
        const off = (row % 2) * (bw * 0.5);
        for (let x = -bw; x < s + bw; x += bw) {
          const shade = 0.78 + Math.random() * 0.22;
          const r = Math.floor(118 * shade + Math.random() * 18);
          const gg = Math.floor(102 * shade + Math.random() * 14);
          const b = Math.floor(88 * shade + Math.random() * 10);
          g.fillStyle = `rgb(${r},${gg},${b})`;
          g.fillRect(x + off + mortar * 0.5, y + mortar * 0.5, bw - mortar, bh - mortar);
          if (Math.random() < 0.12) {
            g.fillStyle = `rgba(40, 70, 38, ${0.08 + Math.random() * 0.12})`;
            g.beginPath();
            g.ellipse(x + off + bw * 0.4, y + bh * 0.7, 18 + Math.random() * 22, 8, 0.4, 0, Math.PI * 2);
            g.fill();
          }
          if (Math.random() < 0.18) {
            g.strokeStyle = `rgba(40,32,26,${0.15 + Math.random() * 0.25})`;
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(x + off + 8, y + 10);
            g.lineTo(x + off + 20 + Math.random() * 30, y + 8 + Math.random() * 16);
            g.stroke();
          }
        }
      }
      g.fillStyle = "rgba(30, 22, 16, 0.18)";
      g.fillRect(0, s * 0.82, s, s * 0.18);
      g.fillStyle = "rgba(18, 14, 10, 0.22)";
      g.fillRect(0, 0, s, s * 0.08);
      noise(g, s, s, 18, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      return tex;
    }

    function makeFloorAlbedo() {
      const s = 512;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      g.fillStyle = "#3a322c";
      g.fillRect(0, 0, s, s);
      const tiles = 8, ts = s / tiles, gap = 5;
      for (let iy = 0; iy < tiles; iy++) {
        for (let ix = 0; ix < tiles; ix++) {
          const shade = 0.72 + Math.random() * 0.28;
          const wet = Math.random() < 0.08;
          const r = Math.floor((wet ? 52 : 78) * shade);
          const gg = Math.floor((wet ? 46 : 68) * shade);
          const b = Math.floor((wet ? 40 : 58) * shade);
          g.fillStyle = `rgb(${r},${gg},${b})`;
          const jitter = (Math.random() - 0.5) * 2;
          g.fillRect(ix * ts + gap + jitter, iy * ts + gap, ts - gap * 2, ts - gap * 2);
        }
      }
      noise(g, s, s, 22, -4);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      tex.repeat.set(CHUNK, CHUNK);
      return tex;
    }

    function makeCeilAlbedo() {
      const s = 256;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      g.fillStyle = "#2a221c";
      g.fillRect(0, 0, s, s);
      g.fillStyle = "#1c1612";
      for (let i = 0; i < 4; i++) g.fillRect(0, 12 + i * 64, s, 14);
      g.fillStyle = "#241c16";
      for (let i = 0; i < 4; i++) g.fillRect(18 + i * 64, 0, 10, s);
      noise(g, s, s, 16, -6);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      tex.repeat.set(CHUNK, CHUNK);
      return tex;
    }

    function makeRoughness(base) {
      const s = 256;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      g.fillStyle = `rgb(${base},${base},${base})`;
      g.fillRect(0, 0, s, s);
      noise(g, s, s, 40, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const wallMap = makeWallAlbedo();
    wallMap.repeat.set(1.15, WALL_H / CELL);
    const floorMap = makeFloorAlbedo();
    const ceilMap = makeCeilAlbedo();

    const wallMat = new THREE.MeshStandardMaterial({
      map: wallMap,
      roughnessMap: makeRoughness(150),
      roughness: 0.92,
      metalness: 0.02,
      color: 0xd8c8b4,
    });
    const pillarMat = new THREE.MeshStandardMaterial({
      map: wallMap,
      roughness: 0.9,
      metalness: 0.03,
      color: 0xc4b49c,
    });
    const floorMat = new THREE.MeshStandardMaterial({
      map: floorMap,
      roughnessMap: makeRoughness(90),
      roughness: 0.78,
      metalness: 0.04,
      color: 0xb8a894,
    });
    const ceilMat = new THREE.MeshStandardMaterial({
      map: ceilMap,
      roughness: 0.96,
      metalness: 0.0,
      color: 0x8a7a6a,
      side: THREE.DoubleSide,
    });

    const wallGeoH = new THREE.BoxGeometry(CELL + WALL_T, WALL_H, WALL_T);
    const wallGeoV = new THREE.BoxGeometry(WALL_T, WALL_H, CELL + WALL_T);
    const pillarGeo = new THREE.BoxGeometry(PILLAR, WALL_H, PILLAR);
    const floorGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL);
    floorGeo.rotateX(-Math.PI / 2);
    const ceilGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL);
    ceilGeo.rotateX(Math.PI / 2);

    const dummy = new THREE.Object3D();
    const chunks = new Map();
    const torchPool = [];
    const MAX_TORCHES = 10;

    function flameTexture() {
      const s = 64;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      const grd = g.createRadialGradient(32, 40, 2, 32, 28, 28);
      grd.addColorStop(0, "rgba(255,245,210,0.95)");
      grd.addColorStop(0.25, "rgba(255,170,50,0.85)");
      grd.addColorStop(0.6, "rgba(220,70,10,0.35)");
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, s, s);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const flameMap = flameTexture();
    const flameMat = new THREE.SpriteMaterial({
      map: flameMap,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      color: 0xffcc88,
    });

    function makeSconce() {
      const g = new THREE.Group();
      const iron = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.05, 0.28, 6),
        new THREE.MeshStandardMaterial({ color: 0x2a2420, roughness: 0.7, metalness: 0.45 })
      );
      iron.position.y = 0.08;
      g.add(iron);
      const bowl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.09, 0.06, 0.07, 8),
        new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.55, metalness: 0.5, emissive: 0x331800, emissiveIntensity: 0.4 })
      );
      bowl.position.y = 0.24;
      g.add(bowl);
      const sprite = new THREE.Sprite(flameMat.clone());
      sprite.scale.set(0.38, 0.55, 1);
      sprite.position.y = 0.48;
      g.add(sprite);
      const light = new THREE.PointLight(0xff9a48, 2.6, 9.5, 1.6);
      light.position.y = 0.42;
      g.add(light);
      g.userData = { sprite, light, phase: Math.random() * Math.PI * 2 };
      return g;
    }

    for (let i = 0; i < MAX_TORCHES; i++) {
      const t = makeSconce();
      t.visible = false;
      scene.add(t);
      torchPool.push(t);
    }

    function chunkKey(cx, cz) { return `${cx},${cz}`; }

    function buildChunk(ccx, ccz) {
      const group = new THREE.Group();
      group.userData.torches = [];

      const east = [];
      const south = [];
      const pillars = [];

      const x0 = ccx * CHUNK;
      const z0 = ccz * CHUNK;

      for (let lz = 0; lz < CHUNK; lz++) {
        for (let lx = 0; lx < CHUNK; lx++) {
          const x = x0 + lx;
          const z = z0 + lz;
          if (hasEastWall(x, z)) east.push([x, z]);
          if (hasSouthWall(x, z)) south.push([x, z]);
          if (lx === 0 && hasEastWall(x - 1, z)) east.push([x - 1, z]);
          if (lz === 0 && hasSouthWall(x, z - 1)) south.push([x, z - 1]);
          pillars.push([x, z]);
          if (isTorchCell(x, z)) group.userData.torches.push([x, z]);
        }
      }
      for (let i = 0; i <= CHUNK; i++) {
        pillars.push([x0 + CHUNK, z0 + i]);
        if (i < CHUNK) pillars.push([x0 + i, z0 + CHUNK]);
      }

      const eastMesh = new THREE.InstancedMesh(wallGeoV, wallMat, Math.max(east.length, 1));
      east.forEach((p, i) => {
        dummy.position.set((p[0] + 1) * CELL, WALL_H * 0.5, (p[1] + 0.5) * CELL);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        eastMesh.setMatrixAt(i, dummy.matrix);
        const tint = 0.88 + (hash2(p[0], p[1]) % 40) / 200;
        eastMesh.setColorAt(i, new THREE.Color(tint, tint * 0.97, tint * 0.93));
      });
      eastMesh.instanceMatrix.needsUpdate = true;
      if (eastMesh.instanceColor) eastMesh.instanceColor.needsUpdate = true;
      group.add(eastMesh);

      const southMesh = new THREE.InstancedMesh(wallGeoH, wallMat, Math.max(south.length, 1));
      south.forEach((p, i) => {
        dummy.position.set((p[0] + 0.5) * CELL, WALL_H * 0.5, (p[1] + 1) * CELL);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        southMesh.setMatrixAt(i, dummy.matrix);
        const tint = 0.9 + (hash2(p[0] + 3, p[1]) % 36) / 220;
        southMesh.setColorAt(i, new THREE.Color(tint, tint * 0.96, tint * 0.92));
      });
      southMesh.instanceMatrix.needsUpdate = true;
      if (southMesh.instanceColor) southMesh.instanceColor.needsUpdate = true;
      group.add(southMesh);

      const pillarMesh = new THREE.InstancedMesh(pillarGeo, pillarMat, Math.max(pillars.length, 1));
      pillars.forEach((p, i) => {
        dummy.position.set(p[0] * CELL, WALL_H * 0.5, p[1] * CELL);
        dummy.updateMatrix();
        pillarMesh.setMatrixAt(i, dummy.matrix);
      });
      pillarMesh.instanceMatrix.needsUpdate = true;
      group.add(pillarMesh);

      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.set((x0 + CHUNK * 0.5) * CELL, 0, (z0 + CHUNK * 0.5) * CELL);
      group.add(floor);

      const ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.position.set((x0 + CHUNK * 0.5) * CELL, WALL_H, (z0 + CHUNK * 0.5) * CELL);
      group.add(ceil);

      scene.add(group);
      return group;
    }

    function syncChunks(px, pz) {
      const ccx = Math.floor(px / (CHUNK * CELL));
      const ccz = Math.floor(pz / (CHUNK * CELL));
      const needed = new Set();
      for (let dz = -LOAD_R; dz <= LOAD_R; dz++) {
        for (let dx = -LOAD_R; dx <= LOAD_R; dx++) {
          needed.add(chunkKey(ccx + dx, ccz + dz));
        }
      }
      for (const [k, g] of chunks) {
        if (!needed.has(k)) {
          scene.remove(g);
          g.traverse((o) => {
            if (o.isInstancedMesh) o.dispose();
          });
          chunks.delete(k);
        }
      }
      for (const k of needed) {
        if (!chunks.has(k)) {
          const [sx, sz] = k.split(",").map(Number);
          chunks.set(k, buildChunk(sx, sz));
        }
      }
      placeTorches(px, pz);
    }

    function placeTorches(px, pz) {
      const candidates = [];
      for (const g of chunks.values()) {
        for (const [x, z] of g.userData.torches) {
          const wx = (x + 0.5) * CELL;
          const wz = (z + 0.5) * CELL;
          const d2 = (wx - px) ** 2 + (wz - pz) ** 2;
          candidates.push({ x, z, wx, wz, d2 });
        }
      }
      candidates.sort((a, b) => a.d2 - b.d2);
      for (let i = 0; i < torchPool.length; i++) {
        const t = torchPool[i];
        const c = candidates[i];
        if (!c || c.d2 > 42 * 42) {
          t.visible = false;
          continue;
        }
        t.visible = true;
        const wallBias = hasEastWall(c.x, c.z) ? -0.15 : hasSouthWall(c.x, c.z) ? 0 : 0.1;
        t.position.set(c.wx + wallBias, 1.55, c.wz - CELL * 0.42 + 0.2);
      }
    }

    // --- collision ---------------------------------------------------------
    function circleAABB(px, pz, r, minX, maxX, minZ, maxZ) {
      const cx = Math.max(minX, Math.min(px, maxX));
      const cz = Math.max(minZ, Math.min(pz, maxZ));
      let dx = px - cx;
      let dz = pz - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 > r * r) return [px, pz];
      if (d2 < 1e-10) {
        const left = px - minX, right = maxX - px, up = pz - minZ, down = maxZ - pz;
        const m = Math.min(left, right, up, down);
        if (m === left) return [minX - r, pz];
        if (m === right) return [maxX + r, pz];
        if (m === up) return [px, minZ - r];
        return [px, maxZ + r];
      }
      const d = Math.sqrt(d2);
      const k = (r - d) / d + 1e-4;
      return [px + dx * k, pz + dz * k];
    }

    function collide(px, pz) {
      const cx = Math.floor(px / CELL);
      const cz = Math.floor(pz / CELL);
      const ht = WALL_T * 0.5;
      const hp = PILLAR * 0.5;
      for (let dz = -1; dz <= 1; dz++) {
        for (let dx = -1; dx <= 1; dx++) {
          const x = cx + dx;
          const z = cz + dz;
          if (hasEastWall(x, z)) {
            [px, pz] = circleAABB(px, pz, RADIUS,
              (x + 1) * CELL - ht, (x + 1) * CELL + ht,
              z * CELL - ht, (z + 1) * CELL + ht);
          }
          if (hasSouthWall(x, z)) {
            [px, pz] = circleAABB(px, pz, RADIUS,
              x * CELL - ht, (x + 1) * CELL + ht,
              (z + 1) * CELL - ht, (z + 1) * CELL + ht);
          }
          [px, pz] = circleAABB(px, pz, RADIUS,
            x * CELL - hp, x * CELL + hp,
            z * CELL - hp, z * CELL + hp);
        }
      }
      return [px, pz];
    }

    // --- dust motes --------------------------------------------------------
    const DUST = 220;
    const dustPos = new Float32Array(DUST * 3);
    for (let i = 0; i < DUST; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 18;
      dustPos[i * 3 + 1] = 0.3 + Math.random() * 2.6;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0xc8b090,
      size: 0.035,
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    // --- controls ----------------------------------------------------------
    let yaw = 0.15;
    let pitch = -0.04;
    const keys = Object.create(null);
    const vel = new THREE.Vector3();
    let bob = 0;
    let pointerLocked = false;

    overlay.addEventListener("click", () => {
      renderer.domElement.requestPointerLock();
    });
    document.addEventListener("pointerlockchange", () => {
      pointerLocked = document.pointerLockElement === renderer.domElement;
      overlay.classList.toggle("hidden", pointerLocked);
    });
    document.addEventListener("mousemove", (e) => {
      if (!pointerLocked) return;
      yaw -= e.movementX * 0.0022;
      pitch -= e.movementY * 0.0022;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
    });
    document.addEventListener("keydown", (e) => { keys[e.code] = true; });
    document.addEventListener("keyup", (e) => { keys[e.code] = false; });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let lastChunk = "";

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      const look = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0, "YXZ"));
      camera.quaternion.copy(look);

      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(look);
      forward.y = 0;
      if (forward.lengthSq() > 1e-6) forward.normalize();
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(look);
      right.y = 0;
      if (right.lengthSq() > 1e-6) right.normalize();

      const wish = new THREE.Vector3();
      if (keys.KeyW) wish.add(forward);
      if (keys.KeyS) wish.sub(forward);
      if (keys.KeyD) wish.add(right);
      if (keys.KeyA) wish.sub(right);
      const speeding = keys.ShiftLeft || keys.ShiftRight;
      const speed = speeding ? 5.6 : 3.15;
      if (wish.lengthSq() > 0) {
        wish.normalize().multiplyScalar(speed);
      }
      vel.x += (wish.x - vel.x) * (1 - Math.exp(-dt * 12));
      vel.z += (wish.z - vel.z) * (1 - Math.exp(-dt * 12));

      let px = camera.position.x + vel.x * dt;
      let pz = camera.position.z + vel.z * dt;
      [px, pz] = collide(px, pz);
      [px, pz] = collide(px, pz);

      const moving = Math.hypot(vel.x, vel.z);
      if (moving > 0.4) bob += dt * moving * 2.15;
      const bobY = Math.sin(bob) * Math.min(moving / 5.6, 1) * 0.045;
      const bobX = Math.cos(bob * 0.5) * Math.min(moving / 5.6, 1) * 0.02;
      camera.position.set(px + bobX * 0.15, EYE + bobY, pz);

      flashlight.intensity = 7.2 + Math.sin(t * 1.7) * 0.25;
      fill.intensity = 0.45 + Math.sin(t * 2.1) * 0.06;

      for (const torch of torchPool) {
        if (!torch.visible) continue;
        const u = torch.userData;
        const f = 0.82 + Math.sin(t * 11 + u.phase) * 0.1 + Math.sin(t * 23 + u.phase * 2) * 0.06;
        u.light.intensity = 2.15 + f * 1.1;
        u.sprite.scale.set(0.32 + f * 0.12, 0.48 + f * 0.18, 1);
        u.sprite.material.rotation = Math.sin(t * 9 + u.phase) * 0.08;
      }

      dust.position.set(px, 0, pz);
      const dp = dustGeo.attributes.position.array;
      for (let i = 0; i < DUST; i++) {
        dp[i * 3 + 1] += dt * 0.12;
        if (dp[i * 3 + 1] > 3.1) dp[i * 3 + 1] = 0.15;
      }
      dustGeo.attributes.position.needsUpdate = true;

      const ck = `${Math.floor(px / (CHUNK * CELL))},${Math.floor(pz / (CHUNK * CELL))}`;
      if (ck !== lastChunk) {
        lastChunk = ck;
        syncChunks(px, pz);
      } else if ((Math.floor(t * 2) % 2) === 0) {
        placeTorches(px, pz);
      }

      renderer.render(scene, camera);
    }

    syncChunks(camera.position.x, camera.position.z);
    animate();
  </script>
</body>
</html>
