<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const CELL = 4;
const WALL_H = 3.35;
const WALL_T = 0.42;
const EYE = 1.58;
const VIEW_R = 14;
const SPEED = 2.65;

const DX = [0, 1, 0, -1];
const DZ = [-1, 0, 1, 0];

function hash2(x, z) {
  let n = (x * 374761393 + z * 668265263) | 0;
  n = (n ^ (n >>> 13)) * 1274126177;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function edgeOpen(ax, az, dir) {
  const bx = ax + DX[dir];
  const bz = az + DZ[dir];
  const carveA = (hash2(ax, az) * 2) | 0;
  if (dir === carveA) return true;
  const carveB = (hash2(bx, bz) * 2) | 0;
  if (((dir + 2) & 3) === carveB) return true;
  const x0 = ax < bx ? ax : bx;
  const z0 = az < bz ? az : bz;
  const axis = ax === bx ? 1 : 0;
  return hash2(x0 * 3 + axis * 17, z0 * 5 + 91) < 0.16;
}

function makeNoiseTexture(size, base, variation, grout) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * variation;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n * 0.9));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n * 0.75));
  }
  ctx.putImageData(img, 0, 0);
  if (grout) {
    ctx.strokeStyle = grout;
    ctx.lineWidth = 2;
    const step = size / 4;
    for (let i = 0; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * step);
      ctx.lineTo(size, i * step);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(i * step, 0);
      ctx.lineTo(i * step, size);
      ctx.stroke();
    }
    for (let row = 0; row < 4; row++) {
      const ox = (row % 2) * (step * 0.5);
      ctx.beginPath();
      ctx.moveTo(ox, row * step);
      ctx.lineTo(ox, (row + 1) * step);
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const wallTex = makeNoiseTexture(256, '#3a342c', 28, 'rgba(18,16,14,0.55)');
wallTex.repeat.set(1.2, 1);
const floorTex = makeNoiseTexture(256, '#1c1914', 22, 'rgba(8,7,6,0.4)');
floorTex.repeat.set(8, 8);
const ceilTex = makeNoiseTexture(256, '#161410', 16, 'rgba(6,5,4,0.5)');
ceilTex.repeat.set(8, 8);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080c);
scene.fog = new THREE.FogExp2(0x07080c, 0.072);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 90);
camera.position.set(0, EYE, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x4a5a78, 0x1a120c, 0.38));

const lantern = new THREE.PointLight(0xffc27a, 18, 16, 1.6);
lantern.position.set(0.12, -0.18, -0.22);
camera.add(lantern);
scene.add(camera);

const fill = new THREE.PointLight(0x6ea8ff, 3.4, 22, 1.8);
camera.add(fill);
fill.position.set(-0.4, 0.3, 0.2);

const wallMat = new THREE.MeshStandardMaterial({
  map: wallTex,
  roughness: 0.88,
  metalness: 0.04,
  color: 0xc8b89a
});
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTex,
  roughness: 0.92,
  metalness: 0.02,
  color: 0x8a7a62
});
const ceilMat = new THREE.MeshStandardMaterial({
  map: ceilTex,
  roughness: 0.95,
  metalness: 0.0,
  color: 0x6a6258
});
const trimMat = new THREE.MeshStandardMaterial({
  color: 0x1a1612,
  roughness: 0.7,
  metalness: 0.15
});
const glowMat = new THREE.MeshStandardMaterial({
  color: 0x7ad0ff,
  emissive: 0x3ec4ff,
  emissiveIntensity: 2.4,
  roughness: 0.35,
  metalness: 0.1
});
const torchMat = new THREE.MeshStandardMaterial({
  color: 0xff9a4a,
  emissive: 0xff7020,
  emissiveIntensity: 3.2,
  roughness: 0.4
});

const wallGeoH = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
const wallGeoV = new THREE.BoxGeometry(WALL_T, WALL_H, CELL);
const capGeo = new THREE.BoxGeometry(WALL_T * 1.35, WALL_H + 0.12, WALL_T * 1.35);
const runeGeo = new THREE.BoxGeometry(0.18, 0.72, 0.06);
const torchGeo = new THREE.SphereGeometry(0.09, 10, 8);

const MAX_WALLS = 1800;
const wallsH = new THREE.InstancedMesh(wallGeoH, wallMat, MAX_WALLS);
const wallsV = new THREE.InstancedMesh(wallGeoV, wallMat, MAX_WALLS);
const caps = new THREE.InstancedMesh(capGeo, trimMat, MAX_WALLS);
const runes = new THREE.InstancedMesh(runeGeo, glowMat, 400);
const torches = new THREE.InstancedMesh(torchGeo, torchMat, 220);
wallsH.frustumCulled = false;
wallsV.frustumCulled = false;
caps.frustumCulled = false;
runes.frustumCulled = false;
torches.frustumCulled = false;
scene.add(wallsH, wallsV, caps, runes, torches);

const dummy = new THREE.Object3D();
const built = new Set();
let countH = 0, countV = 0, countCap = 0, countRune = 0, countTorch = 0;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(CELL * 36, CELL * 36), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(CELL * 36, CELL * 36), ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = WALL_H;
scene.add(ceiling);

const torchLights = [];
for (let i = 0; i < 8; i++) {
  const l = new THREE.PointLight(0xff8a3a, 0, 9, 1.7);
  scene.add(l);
  torchLights.push({ light: l, cx: 0, cz: 0, on: false });
}

function placeWall(mesh, index, x, y, z, ry) {
  dummy.position.set(x, y, z);
  dummy.rotation.set(0, ry, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  mesh.setMatrixAt(index, dummy.matrix);
}

function ensureCell(cx, cz) {
  const key = cx + ',' + cz;
  if (built.has(key)) return;
  built.add(key);
  const wx = cx * CELL;
  const wz = cz * CELL;

  for (let dir = 0; dir < 4; dir++) {
    if (edgeOpen(cx, cz, dir)) continue;
    if (dir === 1 || dir === 3) {
      if (dir === 3 && built.has((cx - 1) + ',' + cz)) continue;
      if (dir === 1 && built.has((cx + 1) + ',' + cz)) continue;
      if (countV >= MAX_WALLS) continue;
      const x = wx + DX[dir] * CELL * 0.5;
      placeWall(wallsV, countV++, x, WALL_H * 0.5, wz, 0);
    } else {
      if (dir === 0 && built.has(cx + ',' + (cz - 1))) continue;
      if (dir === 2 && built.has(cx + ',' + (cz + 1))) continue;
      if (countH >= MAX_WALLS) continue;
      const z = wz + DZ[dir] * CELL * 0.5;
      placeWall(wallsH, countH++, wx, WALL_H * 0.5, z, 0);
    }
  }

  if (countCap < MAX_WALLS) {
    placeWall(caps, countCap++, wx - CELL * 0.5, WALL_H * 0.5, wz - CELL * 0.5, 0);
  }

  const h = hash2(cx, cz);
  if (h > 0.72 && countRune < 400) {
    const side = (h * 17) | 0;
    const openDir = [0, 1, 2, 3].find((d) => edgeOpen(cx, cz, d));
    const wallDir = side & 3;
    if (!edgeOpen(cx, cz, wallDir) && wallDir !== openDir) {
      const x = wx + DX[wallDir] * (CELL * 0.5 - WALL_T * 0.55);
      const z = wz + DZ[wallDir] * (CELL * 0.5 - WALL_T * 0.55);
      dummy.position.set(x, 1.55, z);
      dummy.rotation.set(0, -wallDir * Math.PI / 2, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      runes.setMatrixAt(countRune++, dummy.matrix);
    }
  }

  if (h > 0.82 && h < 0.94 && countTorch < 220) {
    const td = (h * 8) | 0;
    if (!edgeOpen(cx, cz, td & 3)) {
      const d = td & 3;
      const x = wx + DX[d] * (CELL * 0.5 - WALL_T * 0.7);
      const z = wz + DZ[d] * (CELL * 0.5 - WALL_T * 0.7);
      dummy.position.set(x, 2.15, z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      torches.setMatrixAt(countTorch++, dummy.matrix);
    }
  }
}

function rebuildAround(cx, cz) {
  const x0 = cx - VIEW_R;
  const z0 = cz - VIEW_R;
  const x1 = cx + VIEW_R;
  const z1 = cz + VIEW_R;
  for (let z = z0; z <= z1; z++) {
    for (let x = x0; x <= x1; x++) ensureCell(x, z);
  }
  wallsH.count = countH;
  wallsV.count = countV;
  caps.count = countCap;
  runes.count = countRune;
  torches.count = countTorch;
  wallsH.instanceMatrix.needsUpdate = true;
  wallsV.instanceMatrix.needsUpdate = true;
  caps.instanceMatrix.needsUpdate = true;
  runes.instanceMatrix.needsUpdate = true;
  torches.instanceMatrix.needsUpdate = true;
}

let facing = 1;
let cellX = 0;
let cellZ = 0;
const path = [{ x: 0, z: 0 }];

function chooseNext(cx, cz, face) {
  const order = [(face + 1) & 3, face, (face + 3) & 3, (face + 2) & 3];
  for (let i = 0; i < 4; i++) {
    const d = order[i];
    if (edgeOpen(cx, cz, d)) return d;
  }
  return face;
}

function extendPath() {
  while (path.length < 12) {
    const last = path[path.length - 1];
    const d = chooseNext(last.x, last.z, facing);
    facing = d;
    path.push({ x: last.x + DX[d], z: last.z + DZ[d] });
  }
}

rebuildAround(0, 0);
extendPath();

let segIndex = 0;
let segT = 0;
let lookYaw = Math.PI / 2;
let distTravel = 0;
let lastGenX = 0;
let lastGenZ = 0;

function yawOf(dx, dz) {
  return Math.atan2(dx, dz);
}

function shortestAngle(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function updateTorchLights(px, pz) {
  const cx = Math.round(px / CELL);
  const cz = Math.round(pz / CELL);
  const candidates = [];
  for (let z = cz - 5; z <= cz + 5; z++) {
    for (let x = cx - 5; x <= cx + 5; x++) {
      const h = hash2(x, z);
      if (h > 0.82 && h < 0.94) {
        const d = (h * 8) | 0 & 3;
        if (!edgeOpen(x, z, d)) {
          const wx = x * CELL + DX[d] * (CELL * 0.5 - WALL_T * 0.7);
          const wz = z * CELL + DZ[d] * (CELL * 0.5 - WALL_T * 0.7);
          const dd = (wx - px) * (wx - px) + (wz - pz) * (wz - pz);
          candidates.push({ x: wx, z: wz, d: dd });
        }
      }
    }
  }
  candidates.sort((a, b) => a.d - b.d);
  for (let i = 0; i < torchLights.length; i++) {
    const slot = torchLights[i];
    if (i < candidates.length && candidates[i].d < 81) {
      slot.light.position.set(candidates[i].x, 2.15, candidates[i].z);
      slot.light.intensity = 5.5;
    } else {
      slot.light.intensity = 0;
    }
  }
}

const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  extendPath();

  const a = path[segIndex];
  const b = path[segIndex + 1];
  const dx = (b.x - a.x) * CELL;
  const dz = (b.z - a.z) * CELL;
  const len = Math.hypot(dx, dz) || CELL;
  segT += (SPEED * dt) / len;
  distTravel += SPEED * dt;

  while (segT >= 1) {
    segT -= 1;
    segIndex += 1;
    if (segIndex > 4) {
      path.splice(0, 4);
      segIndex -= 4;
    }
    extendPath();
  }

  const a2 = path[segIndex];
  const b2 = path[segIndex + 1];
  const px = (a2.x + (b2.x - a2.x) * segT) * CELL;
  const pz = (a2.z + (b2.z - a2.z) * segT) * CELL;

  const bob = Math.sin(distTravel * 7.2) * 0.028 + Math.sin(distTravel * 14.1) * 0.008;
  const sway = Math.sin(distTravel * 3.6) * 0.012;
  camera.position.set(px + Math.cos(lookYaw) * sway, EYE + bob, pz);

  const ahead = path[Math.min(segIndex + 1, path.length - 1)];
  const ahead2 = path[Math.min(segIndex + 2, path.length - 1)];
  const lookBlend = THREE.MathUtils.smoothstep(segT, 0.55, 0.92);
  const yawNow = yawOf(b2.x - a2.x, b2.z - a2.z);
  const yawNext = yawOf(ahead2.x - ahead.x, ahead2.z - ahead.z);
  const targetYaw = yawNow + shortestAngle(yawNow, yawNext) * lookBlend;
  lookYaw += shortestAngle(lookYaw, targetYaw) * Math.min(1, dt * 5.4);

  camera.rotation.set(0, 0, 0);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = lookYaw;
  camera.rotation.x = Math.sin(distTravel * 5.1) * 0.012 - 0.02;
  camera.rotation.z = Math.sin(distTravel * 3.6) * 0.01;

  cellX = Math.round(px / CELL);
  cellZ = Math.round(pz / CELL);
  if (Math.abs(cellX - lastGenX) + Math.abs(cellZ - lastGenZ) >= 2) {
    rebuildAround(cellX, cellZ);
    lastGenX = cellX;
    lastGenZ = cellZ;
  }

  floor.position.set(cellX * CELL, 0, cellZ * CELL);
  ceiling.position.set(cellX * CELL, WALL_H, cellZ * CELL);
  updateTorchLights(px, pz);

  lantern.intensity = 16.5 + Math.sin(distTravel * 9.0) * 1.6;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

requestAnimationFrame(tick);
</script>
</body>
</html>
