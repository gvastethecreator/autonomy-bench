<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesper — Dusk Walker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8dcc8;
      --muted: #9a8d78;
      --gold: #d4a574;
      --line: rgba(232, 220, 200, 0.14);
      --glass: rgba(8, 9, 14, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07080d; color: var(--ink); }
    body { font-family: "IBM Plex Mono", ui-monospace, monospace; cursor: grab; }
    body.is-dragging { cursor: grabbing; }
    #view { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.08;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 2;
      background: radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(4, 5, 10, 0.72) 100%);
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px 32px 24px;
    }
    header { max-width: 28rem; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .lede {
      margin-top: 14px;
      max-width: 22rem;
      font-size: 12px;
      line-height: 1.65;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .hud {
      pointer-events: auto;
      align-self: end;
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      align-items: center;
      padding: 14px 16px;
      width: fit-content;
      max-width: min(92vw, 720px);
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    button {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      padding: 8px 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    button:hover { border-color: var(--gold); color: var(--gold); }
    button.on {
      background: rgba(212, 165, 116, 0.12);
      border-color: var(--gold);
      color: var(--gold);
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 2px;
      background: var(--line);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hint { opacity: 0.8; }
    #readout { color: var(--gold); font-variant-numeric: tabular-nums; }

    @media (max-width: 640px) {
      #ui { padding: 18px 16px 16px; }
      h1 { font-size: 40px; }
      .meta { flex-direction: column; align-items: start; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="view"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div id="ui">
    <header>
      <p class="kicker">Procedural gait · dusk study</p>
      <h1>Vesper</h1>
      <p class="lede">A tall dusk-striding construct. No animation clips — every joint is solved from a walking clock, inverse kinematics, and a little vanity.</p>
    </header>
    <div></div>
    <div class="dock">
      <div class="hud">
        <button id="btnWalk" class="on" type="button">Walk</button>
        <button id="btnIdle" type="button">Still</button>
        <label>Cadence <input id="cadence" type="range" min="0.45" max="1.65" step="0.01" value="0.92" /></label>
        <label>Stride <input id="stride" type="range" min="0.18" max="0.52" step="0.01" value="0.34" /></label>
      </div>
      <div class="meta">
        <p class="hint">Drag to orbit · Scroll to frame · Space pauses</p>
        <p id="readout">gait 0.00 · heading 000°</p>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const THIGH = 0.50;
    const SHIN = 0.54;
    const FOOT = 0.22;
    const HIP_Y = THIGH + SHIN + 0.06;
    const PATH_R = 2.65;

    const mats = {
      hide: new THREE.MeshStandardMaterial({
        color: 0x1c1814,
        roughness: 0.42,
        metalness: 0.62,
        envMapIntensity: 0.8
      }),
      plate: new THREE.MeshStandardMaterial({
        color: 0x2a241c,
        roughness: 0.28,
        metalness: 0.78
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0xb08a58,
        roughness: 0.35,
        metalness: 0.85,
        emissive: 0x3a2410,
        emissiveIntensity: 0.18
      }),
      ember: new THREE.MeshStandardMaterial({
        color: 0xff7a32,
        roughness: 0.25,
        metalness: 0.1,
        emissive: 0xff6a22,
        emissiveIntensity: 2.1,
        toneMapped: false
      }),
      visor: new THREE.MeshStandardMaterial({
        color: 0xffc878,
        roughness: 0.2,
        metalness: 0.05,
        emissive: 0xffb14a,
        emissiveIntensity: 2.4,
        toneMapped: false
      }),
      stone: new THREE.MeshStandardMaterial({
        color: 0x141820,
        roughness: 0.9,
        metalness: 0.08
      }),
      ring: new THREE.MeshStandardMaterial({
        color: 0x2c2620,
        roughness: 0.55,
        metalness: 0.4
      }),
      shadow: new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.38,
        depthWrite: false
      })
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07080d);
    scene.fog = new THREE.FogExp2(0x07080d, 0.046);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.08, 80);
    camera.position.set(6.4, 3.4, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("view").appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.48, 0.82);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.2;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(0, 1.15, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    renderer.domElement.addEventListener("pointerdown", () => document.body.classList.add("is-dragging"));
    addEventListener("pointerup", () => document.body.classList.remove("is-dragging"));

    scene.add(new THREE.HemisphereLight(0x8aa0c8, 0x1a120c, 0.55));

    const moon = new THREE.DirectionalLight(0xc9d6ff, 1.35);
    moon.position.set(-6, 10, 4);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    moon.shadow.camera.near = 1;
    moon.shadow.camera.far = 28;
    moon.shadow.camera.left = -10;
    moon.shadow.camera.right = 10;
    moon.shadow.camera.top = 10;
    moon.shadow.camera.bottom = -10;
    moon.shadow.bias = -0.00025;
    scene.add(moon);

    const rim = new THREE.DirectionalLight(0xff8a4a, 0.55);
    rim.position.set(4, 2.2, -6);
    scene.add(rim);

    const fill = new THREE.PointLight(0xff7a3a, 2.4, 8, 1.6);
    scene.add(fill);

    function addMesh(geo, mat, parent, x, y, z, cast = true) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = cast;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    function makeEnvironment() {
      const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 72), mats.stone);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const plaza = new THREE.Mesh(new THREE.CylinderGeometry(5.4, 5.4, 0.08, 72), mats.plate);
      plaza.position.y = 0.04;
      plaza.receiveShadow = true;
      scene.add(plaza);

      for (const [r, h, mat] of [[3.15, 0.035, mats.brass], [4.05, 0.02, mats.ring], [5.35, 0.05, mats.ring]]) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(r, h, 8, 96), mat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.09;
        ring.receiveShadow = true;
        scene.add(ring);
      }

      const obeliskGeo = new THREE.BoxGeometry(0.22, 1, 0.22);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 + 0.12;
        const h = 1.1 + ((i * 17) % 5) * 0.22;
        const m = new THREE.Mesh(obeliskGeo, i % 3 === 0 ? mats.brass : mats.plate);
        m.scale.y = h;
        m.position.set(Math.cos(a) * 6.4, h * 0.5, Math.sin(a) * 6.4);
        m.rotation.y = a;
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
        if (i % 2 === 0) {
          const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 12), mats.ember);
          lamp.position.set(Math.cos(a) * 6.4, h + 0.12, Math.sin(a) * 6.4);
          scene.add(lamp);
        }
      }

      const moonOrb = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 24), new THREE.MeshBasicMaterial({ color: 0xe8f0ff }));
      moonOrb.position.set(-10, 8.5, -6);
      scene.add(moonOrb);
      const moonGlow = new THREE.Mesh(
        new THREE.SphereGeometry(0.95, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x9bb4ff, transparent: true, opacity: 0.16, depthWrite: false })
      );
      moonOrb.add(moonGlow);
    }

    function makeLimbSegment(parent, length, radius, material, flare = 1) {
      const pivot = new THREE.Group();
      parent.add(pivot);
      const geo = new THREE.CapsuleGeometry(radius, Math.max(0.02, length - radius * 2), 6, 10);
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.y = -length * 0.5;
      mesh.scale.x = flare;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      pivot.add(mesh);
      const joint = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.15, 12, 12), mats.brass);
      joint.position.y = 0;
      joint.castShadow = true;
      pivot.add(joint);
      const child = new THREE.Group();
      child.position.y = -length;
      pivot.add(child);
      return { pivot, child, mesh };
    }

    function makeCreature() {
      const root = new THREE.Group();
      scene.add(root);

      const blob = new THREE.Mesh(new THREE.CircleGeometry(0.42, 24), mats.shadow);
      blob.rotation.x = -Math.PI / 2;
      blob.position.y = 0.02;
      root.add(blob);

      const pelvis = new THREE.Group();
      pelvis.position.y = HIP_Y;
      root.add(pelvis);
      addMesh(new THREE.SphereGeometry(0.16, 16, 16), mats.plate, pelvis, 0, 0.02, 0);
      addMesh(new THREE.BoxGeometry(0.34, 0.12, 0.18), mats.hide, pelvis, 0, 0.02, 0);

      const chest = new THREE.Group();
      chest.position.y = 0.22;
      pelvis.add(chest);
      addMesh(new THREE.CapsuleGeometry(0.16, 0.28, 6, 12), mats.hide, chest, 0, 0.18, 0);
      addMesh(new THREE.BoxGeometry(0.42, 0.08, 0.16), mats.plate, chest, 0, 0.34, 0);
      const core = addMesh(new THREE.OctahedronGeometry(0.09, 0), mats.ember, chest, 0, 0.16, 0.12);
      const coreLight = new THREE.PointLight(0xff6a28, 1.8, 4.5, 1.8);
      coreLight.position.set(0, 0.16, 0.18);
      chest.add(coreLight);

      const neck = addMesh(new THREE.CapsuleGeometry(0.055, 0.1, 4, 8), mats.plate, chest, 0, 0.46, 0);
      const head = new THREE.Group();
      head.position.y = 0.58;
      chest.add(head);
      addMesh(new THREE.SphereGeometry(0.13, 16, 16), mats.hide, head, 0, 0.06, 0.02);
      addMesh(new THREE.BoxGeometry(0.18, 0.16, 0.14), mats.plate, head, 0, 0.05, 0.04);
      addMesh(new THREE.BoxGeometry(0.04, 0.1, 0.02), mats.visor, head, 0, 0.06, 0.12);
      addMesh(new THREE.ConeGeometry(0.04, 0.16, 8), mats.brass, head, 0.08, 0.16, -0.02).rotation.z = -0.4;
      addMesh(new THREE.ConeGeometry(0.04, 0.16, 8), mats.brass, head, -0.08, 0.16, -0.02).rotation.z = 0.4;

      function makeArm(side) {
        const shoulder = new THREE.Group();
        shoulder.position.set(side * 0.22, 0.32, 0);
        chest.add(shoulder);
        addMesh(new THREE.SphereGeometry(0.07, 12, 12), mats.brass, shoulder, 0, 0, 0);
        const upper = makeLimbSegment(shoulder, 0.34, 0.045, mats.hide, 1.15);
        const lower = makeLimbSegment(upper.child, 0.32, 0.038, mats.plate, 0.9);
        const hand = addMesh(new THREE.SphereGeometry(0.045, 10, 10), mats.brass, lower.child, 0, -0.02, 0.02);
        for (let f = -1; f <= 1; f++) {
          const finger = addMesh(new THREE.BoxGeometry(0.018, 0.07, 0.016), mats.hide, lower.child, f * 0.028, -0.08, 0.03);
          finger.rotation.x = 0.35;
        }
        return { shoulder, upper, lower, hand };
      }

      function makeLeg(side) {
        const hip = new THREE.Group();
        hip.position.set(side * 0.11, 0, 0);
        pelvis.add(hip);
        const thigh = makeLimbSegment(hip, THIGH, 0.055, mats.hide, 1.2);
        const shin = makeLimbSegment(thigh.child, SHIN, 0.042, mats.plate, 0.85);
        const ankle = shin.child;
        const foot = new THREE.Group();
        ankle.add(foot);
        addMesh(new THREE.BoxGeometry(0.09, 0.05, FOOT), mats.plate, foot, 0, -0.02, 0.06);
        addMesh(new THREE.BoxGeometry(0.08, 0.03, 0.08), mats.brass, foot, 0, -0.03, 0.14);
        return { hip, thigh, shin, ankle, foot };
      }

      const armL = makeArm(-1);
      const armR = makeArm(1);
      const legL = makeLeg(-1);
      const legR = makeLeg(1);

      return { root, pelvis, chest, head, neck, core, coreLight, blob, armL, armR, legL, legR };
    }

    function makeMotes() {
      const count = 140;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const phase = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 1.2 + Math.random() * 7;
        pos[i * 3] = Math.cos(a) * r;
        pos[i * 3 + 1] = 0.2 + Math.random() * 3.4;
        pos[i * 3 + 2] = Math.sin(a) * r;
        phase[i] = Math.random() * Math.PI * 2;
      }
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const points = new THREE.Points(
        geo,
        new THREE.PointsMaterial({
          color: 0xffc07a,
          size: 0.045,
          transparent: true,
          opacity: 0.7,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        })
      );
      scene.add(points);
      return { points, phase, pos };
    }

    makeEnvironment();
    const vesper = makeCreature();
    const motes = makeMotes();

    const state = {
      walking: true,
      cadence: 0.92,
      stride: 0.34,
      heading: 0,
      gait: 0,
      idle: 0,
      intro: 0
    };

    const btnWalk = document.getElementById("btnWalk");
    const btnIdle = document.getElementById("btnIdle");
    const cadenceEl = document.getElementById("cadence");
    const strideEl = document.getElementById("stride");
    const readout = document.getElementById("readout");

    function setWalking(on) {
      state.walking = on;
      btnWalk.classList.toggle("on", on);
      btnIdle.classList.toggle("on", !on);
    }
    btnWalk.addEventListener("click", () => setWalking(true));
    btnIdle.addEventListener("click", () => setWalking(false));
    cadenceEl.addEventListener("input", () => { state.cadence = Number(cadenceEl.value); });
    strideEl.addEventListener("input", () => { state.stride = Number(strideEl.value); });
    addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        setWalking(!state.walking);
      }
    });

    const tmp = new THREE.Vector3();

    function footCycle(phase, stride, lift) {
      const n = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2);
      const duty = 0.64;
      const swingT = 1 - duty;
      if (n < swingT) {
        const u = n / swingT;
        const s = u * u * (3 - 2 * u);
        return {
          z: THREE.MathUtils.lerp(-stride, stride, s),
          y: Math.sin(u * Math.PI) * lift,
          plant: false,
          u
        };
      }
      const u = (n - swingT) / duty;
      return {
        z: THREE.MathUtils.lerp(stride, -stride, u),
        y: -0.01,
        plant: true,
        u
      };
    }

    function solveLeg(leg, targetY, targetZ) {
      const maxReach = THIGH + SHIN - 0.02;
      const minReach = 0.12;
      let dx = targetZ;
      let dy = -targetY;
      let dist = Math.hypot(dx, dy);
      if (dist < 1e-4) dist = 1e-4;
      const clamped = THREE.MathUtils.clamp(dist, minReach, maxReach);
      if (clamped !== dist) {
        const s = clamped / dist;
        dx *= s;
        dy *= s;
        dist = clamped;
      }
      const cosKnee = THREE.MathUtils.clamp((THIGH * THIGH + SHIN * SHIN - dist * dist) / (2 * THIGH * SHIN), -1, 1);
      const kneeBend = Math.PI - Math.acos(cosKnee);
      const cosHip = THREE.MathUtils.clamp((THIGH * THIGH + dist * dist - SHIN * SHIN) / (2 * THIGH * dist), -1, 1);
      const hipOff = Math.acos(cosHip);
      const reach = Math.atan2(dx, dy);
      leg.thigh.pivot.rotation.x = -reach - hipOff;
      leg.shin.pivot.rotation.x = kneeBend;
    }

    const clock = new THREE.Clock();
    const camHome = new THREE.Vector3(6.4, 3.4, 7.2);

    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      state.intro = Math.min(1, state.intro + dt * 0.45);

      if (state.walking) {
        state.gait += dt * state.cadence * Math.PI * 2 * 0.85;
        const stepRate = state.cadence * 0.85;
        const travel = stepRate * state.stride * 2;
        state.heading += dt * travel / PATH_R;
      } else {
        state.idle += dt;
      }

      const breath = Math.sin(t * 1.7) * 0.012;
      const bob = state.walking ? Math.abs(Math.sin(state.gait)) * 0.045 : breath * 0.6;
      vesper.pelvis.position.y = HIP_Y + bob;
      vesper.pelvis.rotation.y = state.walking ? Math.sin(state.gait) * 0.11 : Math.sin(t * 0.6) * 0.03;
      vesper.pelvis.rotation.z = state.walking ? Math.sin(state.gait) * 0.07 : Math.sin(t * 0.5) * 0.02;
      vesper.chest.rotation.y = -vesper.pelvis.rotation.y * 0.55;
      vesper.chest.rotation.x = (state.walking ? 0.06 : 0.02) + breath * 0.8;
      vesper.head.rotation.y = -vesper.chest.rotation.y * 0.7 + Math.sin(t * 0.35) * 0.04;
      vesper.head.rotation.x = -0.04 + Math.sin(t * 0.8) * 0.03;

      vesper.core.rotation.y = t * 0.7;
      vesper.core.rotation.x = t * 0.35;
      const pulse = 1.7 + Math.sin(t * 2.3) * 0.5;
      mats.ember.emissiveIntensity = pulse;
      mats.visor.emissiveIntensity = 2.1 + Math.sin(t * 3.1) * 0.35;
      vesper.coreLight.intensity = 1.4 + Math.sin(t * 2.3) * 0.4;

      const lift = 0.16 + state.cadence * 0.04;
      const left = footCycle(state.gait, state.stride, lift);
      const right = footCycle(state.gait + Math.PI, state.stride, lift);

      if (!state.walking) {
        const sway = Math.sin(t * 0.7) * 0.04;
        solveLeg(vesper.legL, -HIP_Y - bob + 0.06, sway);
        solveLeg(vesper.legR, -HIP_Y - bob + 0.06, -sway * 0.4);
        vesper.legL.foot.rotation.x = -vesper.legL.thigh.pivot.rotation.x - vesper.legL.shin.pivot.rotation.x;
        vesper.legR.foot.rotation.x = -vesper.legR.thigh.pivot.rotation.x - vesper.legR.shin.pivot.rotation.x;
      } else {
        solveLeg(vesper.legL, -HIP_Y - bob + left.y, left.z);
        solveLeg(vesper.legR, -HIP_Y - bob + right.y, right.z);
        const toeL = left.plant ? 0.05 : -0.18 + left.u * 0.1;
        const toeR = right.plant ? 0.05 : -0.18 + right.u * 0.1;
        vesper.legL.foot.rotation.x = -vesper.legL.thigh.pivot.rotation.x - vesper.legL.shin.pivot.rotation.x + toeL;
        vesper.legR.foot.rotation.x = -vesper.legR.thigh.pivot.rotation.x - vesper.legR.shin.pivot.rotation.x + toeR;
      }

      const armAmp = state.walking ? 0.55 : 0.08;
      const aL = Math.sin(state.gait + Math.PI);
      const aR = Math.sin(state.gait);
      vesper.armL.shoulder.rotation.x = aL * armAmp + 0.12;
      vesper.armR.shoulder.rotation.x = aR * armAmp + 0.12;
      vesper.armL.shoulder.rotation.z = 0.12;
      vesper.armR.shoulder.rotation.z = -0.12;
      vesper.armL.upper.pivot.rotation.x = 0;
      vesper.armR.upper.pivot.rotation.x = 0;
      vesper.armL.lower.pivot.rotation.x = 0.28 + Math.max(0, aL) * 0.35;
      vesper.armR.lower.pivot.rotation.x = 0.28 + Math.max(0, aR) * 0.35;

      vesper.root.position.set(Math.sin(state.heading) * PATH_R, 0, Math.cos(state.heading) * PATH_R);
      vesper.root.rotation.y = state.heading + Math.PI / 2;
      vesper.blob.scale.setScalar(0.92 + bob * 2.4);

      fill.position.copy(vesper.root.position);
      fill.position.y = 1.4;

      tmp.copy(vesper.root.position);
      tmp.y = 1.15;
      controls.target.lerp(tmp, 1 - Math.pow(0.001, dt));

      const introK = 1 - Math.pow(1 - state.intro, 3);
      if (state.intro < 1) {
        camera.position.lerpVectors(new THREE.Vector3(2.1, 1.7, 2.4).add(vesper.root.position), camHome.clone().setY(3.4), introK);
      }

      const arr = motes.points.geometry.attributes.position.array;
      for (let i = 0; i < motes.phase.length; i++) {
        arr[i * 3 + 1] += Math.sin(t * 0.6 + motes.phase[i]) * 0.0018;
      }
      motes.points.geometry.attributes.position.needsUpdate = true;
      motes.points.rotation.y = t * 0.02;

      controls.update();
      composer.render();

      const deg = ((state.heading % (Math.PI * 2)) * 180 / Math.PI + 360) % 360;
      readout.textContent = `${state.walking ? "gait" : "idle"} ${state.gait.toFixed(2)} · heading ${deg.toFixed(0).padStart(3, "0")}°`;
      requestAnimationFrame(frame);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>
