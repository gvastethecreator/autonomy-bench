<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOCTURNE — Endless Night Drive</title>
  <style>
    :root {
      --ink: #07090f;
      --mist: #c9d4ee;
      --amber: #ffc46a;
      --cyan: #6ef0ff;
      --magenta: #ff4d9d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--mist);
    }
    #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .letterbox {
      position: fixed; left: 0; right: 0; height: 7.2vh;
      background: linear-gradient(#000, #0008 70%, transparent);
      pointer-events: none; z-index: 4; transition: height 1.4s ease;
    }
    .letterbox.top { top: 0; }
    .letterbox.bot {
      bottom: 0;
      background: linear-gradient(transparent, #0008 30%, #000);
    }
    .letterbox.thick { height: 11vh; }
    #hud {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      display: grid; grid-template-rows: auto 1fr auto;
      padding: 4.8vh 4.2vw 3.6vh;
    }
    .toprow {
      display: flex; justify-content: space-between; align-items: flex-start;
      opacity: 0; animation: fadeIn 2.4s 2.2s ease forwards;
    }
    .brand {
      letter-spacing: 0.46em; font-size: 11px; font-weight: 600;
      text-transform: uppercase; color: #d7e3ffcc;
    }
    .brand span { display: block; margin-top: 7px; letter-spacing: 0.18em; font-size: 10px; color: #8ea0c8aa; }
    .clock {
      text-align: right; font-variant-numeric: tabular-nums;
      letter-spacing: 0.22em; font-size: 12px; color: #d7e3ffcc;
    }
    .clock small { display: block; margin-top: 6px; letter-spacing: 0.28em; font-size: 9px; color: #8ea0c8aa; text-transform: uppercase; }
    .mid {
      display: flex; flex-direction: column; justify-content: flex-end;
      padding-bottom: 1.4vh;
    }
    #loc {
      font-size: clamp(22px, 3.4vw, 46px); font-weight: 300;
      letter-spacing: 0.16em; text-transform: uppercase;
      text-shadow: 0 8px 40px #000a;
      opacity: 0; transform: translateY(12px);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }
    #loc.show { opacity: 1; transform: none; }
    #sub {
      margin-top: 8px; font-size: 11px; letter-spacing: 0.38em;
      text-transform: uppercase; color: #9eb0d4bb;
      opacity: 0; transition: opacity 1.2s ease 0.15s;
    }
    #sub.show { opacity: 1; }
    .botrow {
      display: flex; justify-content: space-between; align-items: flex-end;
      opacity: 0; animation: fadeIn 2s 2.8s ease forwards;
    }
    .speed {
      font-size: 42px; font-weight: 200; letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .speed em {
      font-style: normal; font-size: 11px; letter-spacing: 0.34em;
      margin-left: 10px; color: #9eb0d4bb; vertical-align: 12px;
    }
    .lane {
      text-align: right; font-size: 10px; letter-spacing: 0.32em;
      text-transform: uppercase; color: #9eb0d4bb;
    }
    .lane b { display: block; margin-top: 6px; font-weight: 500; color: #e8f0ff; letter-spacing: 0.22em; }
    #title {
      position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 40%, #10141fcc, #000 72%);
      transition: opacity 1.8s ease, visibility 1.8s ease;
    }
    #title.hide { opacity: 0; visibility: hidden; }
    #title h1 {
      font-weight: 200; letter-spacing: 0.62em; font-size: clamp(28px, 5vw, 64px);
      text-transform: uppercase;
    }
    #title p {
      margin-top: 18px; letter-spacing: 0.48em; font-size: 11px;
      text-transform: uppercase; color: #8ea0c8; text-align: center;
    }
    .grain {
      position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 48%, #00000088 100%);
    }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="letterbox top" id="lbTop"></div>
  <div class="letterbox bot" id="lbBot"></div>
  <div class="grain"></div>
  <div id="hud">
    <div class="toprow">
      <div class="brand">NOCTURNE<span>Pacific Arterial · Night Run</span></div>
      <div class="clock" id="clock">02:14:08<small id="wx">Rain · 11°C</small></div>
    </div>
    <div class="mid">
      <div id="loc">Kiln Coast</div>
      <div id="sub">Westbound · Lane 2</div>
    </div>
    <div class="botrow">
      <div class="speed"><span id="spd">118</span><em>KM/H</em></div>
      <div class="lane">Auto cruise<b id="beat">Hood cam</b></div>
    </div>
  </div>
  <div id="title">
    <div>
      <h1>Nocturne</h1>
      <p>An endless night</p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const canvas = document.getElementById("c");
    const locEl = document.getElementById("loc");
    const subEl = document.getElementById("sub");
    const spdEl = document.getElementById("spd");
    const beatEl = document.getElementById("beat");
    const clockEl = document.getElementById("clock");
    const wxEl = document.getElementById("wx");
    const titleEl = document.getElementById("title");
    const lbTop = document.getElementById("lbTop");
    const lbBot = document.getElementById("lbBot");

    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070d);
    scene.fog = new THREE.FogExp2(0x070a12, 0.0145);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.12, 520);
    camera.position.set(0, 2.2, 7.4);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.62, 0.22);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const hemi = new THREE.HemisphereLight(0x3a4a78, 0x08060a, 0.35);
    scene.add(hemi);
    const moonLight = new THREE.DirectionalLight(0xb8c8ff, 0.38);
    moonLight.position.set(-40, 70, -30);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(1024, 1024);
    moonLight.shadow.camera.near = 10;
    moonLight.shadow.camera.far = 220;
    moonLight.shadow.camera.left = -50;
    moonLight.shadow.camera.right = 50;
    moonLight.shadow.camera.top = 50;
    moonLight.shadow.camera.bottom = -50;
    scene.add(moonLight);

    const lightningLight = new THREE.PointLight(0xddeeff, 0, 280, 1.4);
    lightningLight.position.set(20, 48, -40);
    scene.add(lightningLight);

    const fill = new THREE.PointLight(0xff4d9d, 0.18, 80);
    fill.position.set(-12, 8, 4);
    scene.add(fill);

    function hash(n) {
      const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function smoothstep(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    const ZONES = [
      { id: "coast", name: "Kiln Coast", sub: "Westbound · Sea wall", fog: 0.012, bloom: 0.62, rain: 0.55, wx: "Mist · 12°C" },
      { id: "city", name: "Neon Arterial", sub: "Downtown · Lane 3", fog: 0.016, bloom: 0.92, rain: 0.85, wx: "Rain · 11°C" },
      { id: "tunnel", name: "Cathedral Cut", sub: "Underpass · No exit", fog: 0.028, bloom: 1.18, rain: 0.05, wx: "Enclosed · 16°C" },
      { id: "bridge", name: "Saint Elmo Span", sub: "High span · Storm cell", fog: 0.011, bloom: 0.84, rain: 1.0, wx: "Storm · 9°C" },
      { id: "woods", name: "Blackpine Grade", sub: "Forest · Sparse lights", fog: 0.019, bloom: 0.55, rain: 0.7, wx: "Drizzle · 8°C" }
    ];
    const ZONE_LEN = 280;

    const world = new THREE.Group();
    scene.add(world);

    const roadMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uWet: { value: 0.85 },
        uZone: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uWet;
        varying vec2 vUv;
        varying vec3 vPos;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
        void main() {
          float x = vPos.x;
          float z = vPos.z;
          vec3 asphalt = mix(vec3(0.045,0.05,0.07), vec3(0.07,0.075,0.09), hash(floor(vec2(x,z)*2.4)));
          float center = smoothstep(0.08, 0.04, abs(x));
          float dash = step(0.45, fract(z * 0.085 + uTime * 0.0));
          vec3 mark = vec3(0.95, 0.82, 0.32) * center * dash;
          float edge = smoothstep(4.55, 4.72, abs(x)) * smoothstep(5.05, 4.85, abs(x));
          mark += vec3(0.85,0.88,0.95) * edge;
          float lane = smoothstep(0.04, 0.0, abs(abs(x) - 2.35));
          float laneDash = step(0.55, fract(z * 0.12));
          mark += vec3(0.75) * lane * laneDash * 0.55;
          float wet = uWet * (0.55 + 0.45 * sin(z * 0.31 + x * 1.7));
          vec3 col = mix(asphalt, asphalt * 0.55 + vec3(0.04,0.06,0.1), wet);
          col += mark;
          float glow = exp(-abs(x) * 0.35) * 0.04;
          col += vec3(0.15, 0.22, 0.35) * glow;
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    const road = new THREE.Mesh(new THREE.PlaneGeometry(11.2, 420, 1, 80), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -140;
    road.receiveShadow = true;
    world.add(road);

    const shoulderGeo = new THREE.PlaneGeometry(18, 420);
    const shoulderMat = new THREE.MeshStandardMaterial({
      color: 0x12151c, roughness: 0.92, metalness: 0.08
    });
    const shoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
    shoulder.rotation.x = -Math.PI / 2;
    shoulder.position.set(0, -0.03, -140);
    shoulder.receiveShadow = true;
    world.add(shoulder);

    const railMat = new THREE.MeshStandardMaterial({ color: 0x2a3344, metalness: 0.7, roughness: 0.35, emissive: 0x101820, emissiveIntensity: 0.2 });
    function makeRail(x) {
      const g = new THREE.Group();
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 420), railMat);
      bar.position.set(x, 0.55, -140);
      g.add(bar);
      const bar2 = bar.clone();
      bar2.position.y = 0.32;
      g.add(bar2);
      world.add(g);
      return g;
    }
    makeRail(-5.55);
    makeRail(5.55);

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(380, 32, 20),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { uFlash: { value: 0 } },
        vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          varying vec3 vPos; uniform float uFlash;
          void main(){
            float h = normalize(vPos).y;
            vec3 zen = vec3(0.02,0.03,0.07);
            vec3 hor = vec3(0.07,0.06,0.1);
            vec3 col = mix(hor, zen, smoothstep(-0.1, 0.55, h));
            col += vec3(0.08,0.05,0.12) * smoothstep(0.15, -0.05, h);
            col += vec3(0.55,0.65,0.9) * uFlash * (0.25 + 0.75 * smoothstep(0.2, 0.8, h));
            gl_FragColor = vec4(col, 1.0);
          }
        `
      })
    );
    scene.add(sky);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(10, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xe8f0ff })
    );
    moon.position.set(-48, 62, -120);
    scene.add(moon);
    const moonGlow = new THREE.Mesh(
      new THREE.SphereGeometry(16, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0x9bb4ff, transparent: true, opacity: 0.12, depthWrite: false })
    );
    moonGlow.position.copy(moon.position);
    scene.add(moonGlow);

    const starsGeo = new THREE.BufferGeometry();
    const starCount = 900;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 160 + hash(i) * 180;
      const th = hash(i + 2) * Math.PI * 0.55 + 0.15;
      const ph = hash(i + 5) * Math.PI * 2;
      starPos[i * 3] = r * Math.sin(th) * Math.cos(ph);
      starPos[i * 3 + 1] = r * Math.cos(th);
      starPos[i * 3 + 2] = r * Math.sin(th) * Math.sin(ph) - 40;
    }
    starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 0.55, transparent: true, opacity: 0.75, depthWrite: false }));
    scene.add(stars);

    function makeCar(opts) {
      const g = new THREE.Group();
      const bodyCol = opts.color;
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.72, 0.42, 4.15),
        new THREE.MeshStandardMaterial({ color: bodyCol, metalness: 0.78, roughness: 0.28 })
      );
      body.position.y = 0.52;
      body.castShadow = true;
      g.add(body);
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.52, 0.38, 1.7),
        new THREE.MeshStandardMaterial({ color: 0x0b1018, metalness: 0.4, roughness: 0.2, emissive: 0x142032, emissiveIntensity: 0.35 })
      );
      cabin.position.set(0, 0.88, -0.22);
      cabin.castShadow = true;
      g.add(cabin);
      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(1.46, 0.28, 1.55),
        new THREE.MeshStandardMaterial({ color: 0x7ec8ff, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.28, emissive: 0x1a3048, emissiveIntensity: 0.4 })
      );
      glass.position.set(0, 0.92, -0.18);
      g.add(glass);
      const hood = new THREE.Mesh(
        new THREE.BoxGeometry(1.62, 0.1, 1.2),
        new THREE.MeshStandardMaterial({ color: bodyCol, metalness: 0.82, roughness: 0.22 })
      );
      hood.position.set(0, 0.68, 1.22);
      hood.rotation.x = -0.08;
      g.add(hood);
      const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.9, roughness: 0.25 });
      const wheels = [];
      [[-0.78, 0.32, 1.22], [0.78, 0.32, 1.22], [-0.78, 0.32, -1.28], [0.78, 0.32, -1.28]].forEach((p) => {
        const w = new THREE.Group();
        const tire = new THREE.Mesh(wheelGeo, wheelMat);
        tire.rotation.z = Math.PI / 2;
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.24, 12), rimMat);
        rim.rotation.z = Math.PI / 2;
        w.add(tire, rim);
        w.position.set(...p);
        g.add(w);
        wheels.push(w);
      });
      function lamp(x, z, color, s = 0.12) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.1, s),
          new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 3.4 })
        );
        m.position.set(x, 0.48, z);
        g.add(m);
        return m;
      }
      lamp(-0.55, 2.1, 0xffe9b0, 0.08);
      lamp(0.55, 2.1, 0xffe9b0, 0.08);
      lamp(-0.55, -2.12, 0xff2244, 0.08);
      lamp(0.55, -2.12, 0xff2244, 0.08);
      if (opts.player) {
        const under = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 0.02, 3.6),
          new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x00c8ff, emissiveIntensity: 0.8, transparent: true, opacity: 0.55 })
        );
        under.position.y = 0.18;
        g.add(under);
        const dash = new THREE.Mesh(
          new THREE.BoxGeometry(1.1, 0.04, 0.3),
          new THREE.MeshStandardMaterial({ color: 0x66eeff, emissive: 0x33ddff, emissiveIntensity: 2.2 })
        );
        dash.position.set(0, 0.72, 0.42);
        g.add(dash);
      }
      g.userData.wheels = wheels;
      return g;
    }

    const player = makeCar({ color: 0x1a2330, player: true });
    player.position.set(0.9, 0, 0);
    scene.add(player);

    const headL = new THREE.SpotLight(0xffe6b8, 18, 48, 0.42, 0.42, 1.15);
    headL.position.set(-0.5, 0.55, 2.05);
    headL.target.position.set(-0.5, 0.05, 18);
    headL.castShadow = true;
    headL.shadow.mapSize.set(512, 512);
    player.add(headL, headL.target);
    const headR = headL.clone();
    headR.position.x = 0.5;
    headR.target.position.x = 0.5;
    player.add(headR, headR.target);

    const traffic = [];
    const trafficColors = [0x141820, 0x2a1018, 0x102018, 0x22180c, 0x0c1422, 0x1a1a1a];
    for (let i = 0; i < 14; i++) {
      const car = makeCar({ color: trafficColors[i % trafficColors.length], player: false });
      const lane = (i % 4) - 1.5;
      car.position.set(lane * 1.7, 0, -28 - i * 22 - hash(i + 9) * 18);
      car.userData.speed = 0.55 + hash(i + 3) * 0.7;
      car.userData.lane = car.position.x;
      car.userData.oncoming = i % 3 === 0;
      if (car.userData.oncoming) {
        car.rotation.y = Math.PI;
        car.position.x = -Math.abs(car.position.x) - 0.4;
        car.userData.speed = 1.35 + hash(i) * 0.5;
      }
      world.add(car);
      traffic.push(car);
    }

    const props = [];
    const lampMat = new THREE.MeshStandardMaterial({ color: 0x222830, metalness: 0.6, roughness: 0.4 });
    const lampGlow = new THREE.MeshStandardMaterial({ color: 0xffd29a, emissive: 0xffc878, emissiveIntensity: 2.8 });
    const neonMats = [
      new THREE.MeshStandardMaterial({ color: 0xff3d8a, emissive: 0xff2d7a, emissiveIntensity: 3.2 }),
      new THREE.MeshStandardMaterial({ color: 0x3df0ff, emissive: 0x2ad8ff, emissiveIntensity: 3.2 }),
      new THREE.MeshStandardMaterial({ color: 0x8a6bff, emissive: 0x6a4dff, emissiveIntensity: 2.6 }),
      new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0xff9a2e, emissiveIntensity: 2.4 })
    ];
    const bldgMat = new THREE.MeshStandardMaterial({ color: 0x10141c, roughness: 0.86, metalness: 0.15 });
    const winMat = new THREE.MeshStandardMaterial({ color: 0xffe0a0, emissive: 0xffc66a, emissiveIntensity: 1.6 });
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x0b120e, roughness: 0.95 });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.9 });

    function addStreetLamp(x, z) {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 4.2, 6), lampMat);
      pole.position.y = 2.1;
      const arm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.07, 0.07), lampMat);
      arm.position.set(x > 0 ? -0.6 : 0.6, 4.05, 0);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), lampGlow);
      bulb.position.set(x > 0 ? -1.15 : 1.15, 3.9, 0);
      const light = new THREE.PointLight(0xffd4a0, 2.4, 14, 1.6);
      light.position.copy(bulb.position);
      g.add(pole, arm, bulb, light);
      g.position.set(x, 0, z);
      world.add(g);
      props.push({ mesh: g, kind: "lamp" });
    }

    function addBuilding(x, z, seed) {
      const g = new THREE.Group();
      const w = 3.2 + hash(seed) * 4.5;
      const d = 3.4 + hash(seed + 1) * 5;
      const h = 6 + hash(seed + 2) * 28;
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
      body.position.y = h / 2;
      body.castShadow = true;
      g.add(body);
      const floors = Math.floor(h / 1.6);
      const cols = Math.max(2, Math.floor(w / 0.9));
      for (let fy = 0; fy < floors; fy++) {
        for (let cx = 0; cx < cols; cx++) {
          if (hash(seed + fy * 11 + cx) < 0.28) continue;
          const win = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.04), winMat);
          const side = x > 0 ? -1 : 1;
          win.position.set((cx - (cols - 1) / 2) * 0.72, 1.1 + fy * 1.55, side * d * 0.51);
          g.add(win);
        }
      }
      if (hash(seed + 8) > 0.45) {
        const sign = new THREE.Mesh(new THREE.BoxGeometry(w * 0.7, 0.45, 0.12), neonMats[seed % neonMats.length]);
        sign.position.set(0, h * 0.62, (x > 0 ? -1 : 1) * d * 0.52);
        g.add(sign);
      }
      g.position.set(x, 0, z);
      world.add(g);
      props.push({ mesh: g, kind: "bldg" });
    }

    function addTree(x, z, seed) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.6, 5), trunkMat);
      trunk.position.y = 0.8;
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.1 + hash(seed) * 0.8, 3.4 + hash(seed + 1) * 2.2, 6), treeMat);
      crown.position.y = 2.8;
      g.add(trunk, crown);
      g.position.set(x, 0, z);
      world.add(g);
      props.push({ mesh: g, kind: "tree" });
    }

    function addBillboard(x, z, seed) {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.BoxGeometry(0.16, 5.2, 0.16), lampMat);
      pole.position.y = 2.6;
      const board = new THREE.Mesh(new THREE.BoxGeometry(4.4, 2.1, 0.12), neonMats[seed % neonMats.length]);
      board.position.y = 5.4;
      g.add(pole, board);
      g.position.set(x, 0, z);
      world.add(g);
      props.push({ mesh: g, kind: "sign" });
    }

    for (let i = 0; i < 18; i++) {
      addStreetLamp(-6.3, -12 - i * 22);
      addStreetLamp(6.3, -22 - i * 22);
    }
    for (let i = 0; i < 22; i++) {
      addBuilding(-(10 + hash(i) * 8), -8 - i * 18, i * 3);
      addBuilding(10 + hash(i + 4) * 9, -16 - i * 18, i * 3 + 1);
    }
    for (let i = 0; i < 30; i++) {
      addTree(-(8.5 + hash(i + 20) * 10), -6 - i * 14, i);
      addTree(8.2 + hash(i + 40) * 11, -10 - i * 14, i + 7);
    }
    for (let i = 0; i < 8; i++) {
      addBillboard((i % 2 ? 1 : -1) * (8.4 + hash(i) * 2), -40 - i * 48, i + 2);
    }

    const tunnelGroup = new THREE.Group();
    const tunnelWallMat = new THREE.MeshStandardMaterial({ color: 0x12151c, roughness: 0.7, metalness: 0.25 });
    const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(5.4, 5.4, 96, 20, 1, true), tunnelWallMat);
    tunnel.rotation.x = Math.PI / 2;
    tunnel.position.set(0, 2.2, 0);
    tunnelGroup.add(tunnel);
    const rings = [];
    for (let i = 0; i < 18; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(5.15, 0.07, 8, 40),
        new THREE.MeshStandardMaterial({
          color: i % 2 ? 0xff3da8 : 0x3df0ff,
          emissive: i % 2 ? 0xff2d90 : 0x2adfff,
          emissiveIntensity: 3.6
        })
      );
      ring.rotation.y = Math.PI / 2;
      ring.position.set(0, 2.2, 42 - i * 5.2);
      tunnelGroup.add(ring);
      rings.push(ring);
    }
    tunnelGroup.position.z = -900;
    world.add(tunnelGroup);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(220, 420, 1, 1),
      new THREE.MeshStandardMaterial({
        color: 0x071018, metalness: 0.85, roughness: 0.18, emissive: 0x041018, emissiveIntensity: 0.4
      })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(18, -1.6, -140);
    world.add(water);

    const rainCount = 1400;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);
    const rainVel = new Float32Array(rainCount);
    for (let i = 0; i < rainCount; i++) {
      rainPos[i * 3] = (hash(i) - 0.5) * 28;
      rainPos[i * 3 + 1] = hash(i + 1) * 16;
      rainPos[i * 3 + 2] = -hash(i + 2) * 40;
      rainVel[i] = 14 + hash(i + 3) * 12;
    }
    rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.Points(
      rainGeo,
      new THREE.PointsMaterial({
        color: 0xa8c4e8, size: 0.045, transparent: true, opacity: 0.45, depthWrite: false
      })
    );
    scene.add(rain);

    const shots = [
      { name: "Hood cam", dur: 7.2, pos: [0.15, 1.08, 1.55], look: [0.15, 0.85, 8], fov: 58, box: false },
      { name: "Three-quarter", dur: 6.4, pos: [3.6, 1.35, 4.8], look: [0.4, 0.7, -1.2], fov: 42, box: true },
      { name: "Low chase", dur: 6.8, pos: [0.9, 0.55, 6.8], look: [0.9, 0.85, -4], fov: 50, box: false },
      { name: "Side track", dur: 5.8, pos: [5.4, 1.1, 0.4], look: [0.4, 0.8, -1.5], fov: 40, box: true },
      { name: "Aerial crane", dur: 7.5, pos: [-2.8, 9.5, 8.5], look: [1.2, 0.2, -12], fov: 46, box: true },
      { name: "Cabin glow", dur: 5.5, pos: [0.35, 1.22, 0.15], look: [0.5, 0.95, 6], fov: 62, box: false },
      { name: "Reveal", dur: 9.2, pos: [0.2, 2.4, 11.5], look: [0.6, 1.6, -18], fov: 38, box: true }
    ];

    let distance = 40;
    let speed = 32;
    let shotIndex = 0;
    let shotT = 0;
    let camPos = new THREE.Vector3(0.15, 1.08, 1.55);
    let camLook = new THREE.Vector3(0.15, 0.85, 8);
    let lightningT = 0;
    let nextStrike = 6;
    let locName = "";
    let revealArmed = false;
    const clock = new THREE.Clock();
    const tmp = new THREE.Vector3();
    const lookTmp = new THREE.Vector3();

    setTimeout(() => titleEl.classList.add("hide"), 2400);
    locEl.classList.add("show");
    subEl.classList.add("show");

    function zoneAt(d) {
      const i = Math.floor(((d % (ZONE_LEN * ZONES.length)) + ZONE_LEN * ZONES.length) / ZONE_LEN) % ZONES.length;
      return ZONES[i];
    }

    function wrapZ(z, span = 380) {
      while (z > 40) z -= span;
      while (z < -span + 40) z += span;
      return z;
    }

    function setLocation(z) {
      if (z.name === locName) return;
      locName = z.name;
      locEl.classList.remove("show");
      subEl.classList.remove("show");
      setTimeout(() => {
        locEl.textContent = z.name;
        subEl.textContent = z.sub;
        locEl.classList.add("show");
        subEl.classList.add("show");
      }, 280);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.045);
      const t = clock.elapsedTime;
      distance += speed * dt;
      speed = lerp(speed, 28 + 10 * Math.sin(t * 0.07) + 6 * Math.sin(t * 0.19), 0.04);

      const zone = zoneAt(distance);
      const next = zoneAt(distance + 40);
      const zonePhase = (distance % ZONE_LEN) / ZONE_LEN;
      scene.fog.density = lerp(scene.fog.density, zone.fog, 0.04);
      bloom.strength = lerp(bloom.strength, zone.bloom, 0.05);
      rain.material.opacity = lerp(rain.material.opacity, 0.18 + zone.rain * 0.4, 0.05);
      wxEl.textContent = zone.wx;
      setLocation(zone);

      const inTunnel = zone.id === "tunnel" || (next.id === "tunnel" && zonePhase > 0.78);
      const onBridge = zone.id === "bridge";
      tunnelGroup.position.z = wrapZ(tunnelGroup.position.z + speed * dt, 1400);
      if (inTunnel && Math.abs(tunnelGroup.position.z + 48) > 120) {
        tunnelGroup.position.z = -48;
      }

      player.position.x = lerp(player.position.x, 0.85 + Math.sin(t * 0.23) * 0.55, 0.03);
      player.position.y = Math.sin(t * 11.5) * 0.012 + Math.sin(t * 3.1) * 0.01;
      player.rotation.y = Math.sin(t * 0.21) * 0.04;
      player.rotation.z = Math.sin(t * 0.21) * 0.025;
      player.userData.wheels.forEach((w) => { w.rotation.x -= speed * dt * 0.72; });

      traffic.forEach((car, i) => {
        const dir = car.userData.oncoming ? 1 : -1;
        const rel = car.userData.oncoming ? speed + car.userData.speed * 24 : speed - car.userData.speed * 10;
        car.position.z += dir * (car.userData.oncoming ? rel : -rel) * dt * 0.04 + (car.userData.oncoming ? speed * dt : -speed * dt * 0.15);
        car.position.z = wrapZ(car.position.z, 320);
        car.position.x = lerp(car.position.x, car.userData.lane + Math.sin(t * 0.4 + i) * 0.12, 0.02);
        car.userData.wheels.forEach((w) => { w.rotation.x -= (car.userData.oncoming ? 1.4 : 0.7) * speed * dt * 0.5; });
      });

      const scroll = speed * dt;
      props.forEach((p, i) => {
        p.mesh.position.z += scroll;
        p.mesh.position.z = wrapZ(p.mesh.position.z, 400);
        const zid = zone.id;
        if (p.kind === "bldg") p.mesh.visible = zid === "city" || zid === "bridge" || (zid === "coast" && i % 3 === 0);
        if (p.kind === "tree") p.mesh.visible = zid === "woods" || zid === "coast" || zid === "bridge";
        if (p.kind === "lamp") p.mesh.visible = zid !== "woods" || i % 2 === 0;
        if (p.kind === "sign") p.mesh.visible = zid === "city" || zid === "bridge";
        if (zid === "tunnel") p.mesh.visible = p.kind === "lamp" ? false : p.mesh.visible && Math.abs(p.mesh.position.x) > 12;
      });
      water.visible = zone.id === "coast" || zone.id === "bridge";
      water.position.x = zone.id === "bridge" ? 0 : 22;
      water.position.y = zone.id === "bridge" ? -8 : -1.6;
      tunnelGroup.visible = zone.id === "tunnel" || next.id === "tunnel" || zone.id === "bridge";

      rings.forEach((r, i) => {
        const pulse = 2.4 + Math.sin(t * 3.2 - i * 0.45) * 1.8;
        r.material.emissiveIntensity = pulse;
        r.rotation.z = t * 0.15 + i * 0.2;
      });

      const rp = rain.geometry.attributes.position.array;
      const rainAmt = zone.rain;
      for (let i = 0; i < rainCount; i++) {
        rp[i * 3 + 1] -= rainVel[i] * dt * rainAmt;
        rp[i * 3 + 2] += scroll * 0.35;
        if (rp[i * 3 + 1] < 0) {
          rp[i * 3] = player.position.x + (hash(i + t) - 0.5) * 24;
          rp[i * 3 + 1] = 8 + hash(i + 9) * 10;
          rp[i * 3 + 2] = (hash(i + 4) - 0.5) * 36 - 8;
        }
      }
      rain.geometry.attributes.position.needsUpdate = true;
      rain.visible = rainAmt > 0.12;

      lightningT -= dt;
      nextStrike -= dt;
      if (onBridge && nextStrike < 0) {
        lightningT = 0.12 + hash(t) * 0.1;
        nextStrike = 2.8 + hash(t + 3) * 4.5;
        lightningLight.position.set((hash(t) - 0.5) * 60, 40 + hash(t + 1) * 20, -20 - hash(t + 2) * 50);
      }
      const flash = lightningT > 0 ? (lightningT > 0.08 ? 2.8 : 1.1 * (lightningT / 0.08)) : 0;
      lightningLight.intensity = flash * 40;
      sky.material.uniforms.uFlash.value = flash;
      if (onBridge && flash > 1.5) bloom.strength = 1.35;

      const reveal = zone.id === "bridge" && zonePhase < 0.22;
      if (reveal && !revealArmed) {
        revealArmed = true;
        shotIndex = 6;
        shotT = 0;
      }
      if (zone.id !== "bridge") revealArmed = false;

      shotT += dt;
      let shot = shots[shotIndex];
      if (shotT > shot.dur) {
        shotT = 0;
        shotIndex = (shotIndex + 1) % (shots.length - (reveal ? 0 : 1));
        if (!reveal && shotIndex === 6) shotIndex = 0;
        shot = shots[shotIndex];
      }
      const blend = smoothstep(0, 1.35, shotT);
      tmp.set(shot.pos[0] + player.position.x * 0.15, shot.pos[1], shot.pos[2]);
      if (shot.name === "Aerial crane") {
        tmp.y += Math.sin(shotT * 0.25) * 1.2;
        tmp.x += shotT * 0.12;
      }
      if (shot.name === "Reveal") {
        tmp.set(lerp(1.2, -0.4, shotT / shot.dur), lerp(1.1, 7.8, shotT / shot.dur), lerp(6.5, 16, shotT / shot.dur));
      }
      camPos.lerp(tmp, 0.045 + blend * 0.03);
      lookTmp.set(player.position.x + shot.look[0] * 0.2, shot.look[1], shot.look[2]);
      if (shot.name === "Reveal") lookTmp.set(0.4, lerp(0.8, 2.4, shotT / shot.dur), lerp(-6, -28, shotT / shot.dur));
      camLook.lerp(lookTmp, 0.06);
      camera.position.copy(camPos);
      camera.lookAt(camLook);
      camera.fov = lerp(camera.fov, shot.fov, 0.04);
      camera.updateProjectionMatrix();
      const thick = shot.box;
      lbTop.classList.toggle("thick", thick);
      lbBot.classList.toggle("thick", thick);
      beatEl.textContent = shot.name;

      const shown = Math.round(108 + Math.sin(t * 0.3) * 9 + speed * 0.35);
      spdEl.textContent = String(shown);
      const night = 2 * 3600 + 14 * 60 + (t * 6) % 46;
      const hh = String(Math.floor(night / 3600) % 24).padStart(2, "0");
      const mm = String(Math.floor((night % 3600) / 60)).padStart(2, "0");
      const ss = String(Math.floor(night % 60)).padStart(2, "0");
      clockEl.firstChild.textContent = `${hh}:${mm}:${ss}`;

      roadMat.uniforms.uTime.value = t;
      roadMat.uniforms.uWet.value = 0.55 + zone.rain * 0.4;
      renderer.toneMappingExposure = 0.98 + flash * 0.25 + (zone.id === "tunnel" ? 0.12 : 0);

      composer.render();
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) clock.getDelta();
    });

    animate();
  </script>
</body>
</html>
