<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Biped</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
    canvas { display: block; }
    #overlay {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 24px 28px;
      pointer-events: none;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: rgba(255,255,255,0.85);
    }
    #overlay h1 {
      font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: #7dd3fc;
    }
    #overlay p {
      margin-top: 6px; font-size: 0.82rem; color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Procedural Biped</h1>
    <p>Drag to orbit · Scroll to zoom</p>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Scene setup ──────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);
    scene.fog = new THREE.Fog(0x0a0e14, 12, 38);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.4, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.minDistance = 3;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.update();

    // ── Lighting ─────────────────────────────────────────────────
    const hemi = new THREE.HemisphereLight(0x7dd3fc, 0x1a2332, 0.55);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4e0, 1.4);
    sun.position.set(5, 9, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.bias = -0.0008;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x38bdf8, 0.35);
    rim.position.set(-4, 3, -6);
    scene.add(rim);

    // ── Ground ───────────────────────────────────────────────────
    const groundGeo = new THREE.CircleGeometry(14, 64);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x141c28,
      roughness: 0.92,
      metalness: 0.05,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(14, 28, 0x1e3a52, 0x152030);
    grid.position.y = 0.002;
    scene.add(grid);

    // ── Materials ────────────────────────────────────────────────
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.45, metalness: 0.15 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.35, metalness: 0.25 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.4, metalness: 0.3, emissive: 0xfbbf24, emissiveIntensity: 0.15 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1, emissive: 0xffffff, emissiveIntensity: 0.4 });
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0a0e14, roughness: 0.5 });

    function limb(length, radius, mat) {
      const g = new THREE.CylinderGeometry(radius, radius * 0.88, length, 10);
      g.translate(0, -length / 2, 0);
      return new THREE.Mesh(g, mat);
    }

    function joint(r, mat) {
      return new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat);
    }

    // ── Biped hierarchy ──────────────────────────────────────────
    const biped = new THREE.Group();
    scene.add(biped);

    const pelvis = new THREE.Group();
    pelvis.position.y = 1.05;
    biped.add(pelvis);

    const hipBlock = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.22, 0.32),
      bodyMat
    );
    hipBlock.castShadow = true;
    pelvis.add(hipBlock);

    const torso = new THREE.Group();
    torso.position.y = 0.18;
    pelvis.add(torso);

    const chest = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.28, 0.52, 6, 12),
      bodyMat
    );
    chest.position.y = 0.38;
    chest.castShadow = true;
    torso.add(chest);

    const neck = joint(0.1, jointMat);
    neck.position.y = 0.72;
    neck.castShadow = true;
    torso.add(neck);

    const head = new THREE.Group();
    head.position.y = 0.88;
    torso.add(head);

    const skull = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 14, 12),
      bodyMat
    );
    skull.scale.set(1, 1.08, 0.95);
    skull.castShadow = true;
    head.add(skull);

    const snout = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 0.1, 0.18),
      accentMat
    );
    snout.position.set(0, -0.04, 0.18);
    snout.castShadow = true;
    head.add(snout);

    const antennaL = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.025, 0.35, 6), accentMat);
    antennaL.position.set(-0.08, 0.22, 0);
    antennaL.rotation.z = 0.25;
    head.add(antennaL);
    const antennaR = antennaL.clone();
    antennaR.position.x = 0.08;
    antennaR.rotation.z = -0.25;
    head.add(antennaR);

    function makeEye(x) {
      const g = new THREE.Group();
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), eyeMat);
      eye.position.set(x, 0.04, 0.17);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), pupilMat);
      pupil.position.set(x * 0.5, 0.04, 0.21);
      g.add(eye, pupil);
      return g;
    }
    head.add(makeEye(-0.09), makeEye(0.09));

    // ── Leg factory ──────────────────────────────────────────────
    function createLeg(side) {
      const sign = side === 'L' ? 1 : -1;
      const root = new THREE.Group();
      root.position.set(sign * 0.16, -0.02, 0);

      const hip = joint(0.09, jointMat);
      hip.castShadow = true;
      root.add(hip);

      const thighLen = 0.48;
      const shinLen = 0.44;
      const footLen = 0.22;

      const thighPivot = new THREE.Group();
      root.add(thighPivot);
      const thigh = limb(thighLen, 0.07, bodyMat);
      thigh.castShadow = true;
      thighPivot.add(thigh);

      const knee = joint(0.075, jointMat);
      knee.position.y = -thighLen;
      knee.castShadow = true;
      thighPivot.add(knee);

      const shinPivot = new THREE.Group();
      shinPivot.position.y = -thighLen;
      thighPivot.add(shinPivot);
      const shin = limb(shinLen, 0.055, bodyMat);
      shin.castShadow = true;
      shinPivot.add(shin);

      const ankle = joint(0.065, jointMat);
      ankle.position.y = -shinLen;
      ankle.castShadow = true;
      shinPivot.add(ankle);

      const footPivot = new THREE.Group();
      footPivot.position.y = -shinLen;
      shinPivot.add(footPivot);
      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.06, footLen),
        accentMat
      );
      foot.position.set(0, -0.03, footLen * 0.35);
      foot.castShadow = true;
      footPivot.add(foot);

      return { root, thighPivot, shinPivot, footPivot, sign, thighLen, shinLen, footLen };
    }

    const legL = createLeg('L');
    const legR = createLeg('R');
    pelvis.add(legL.root, legR.root);

    // ── Arm factory ──────────────────────────────────────────────
    function createArm(side) {
      const sign = side === 'L' ? 1 : -1;
      const root = new THREE.Group();
      root.position.set(sign * 0.34, 0.58, 0);

      const shoulder = joint(0.08, jointMat);
      shoulder.castShadow = true;
      root.add(shoulder);

      const upperLen = 0.34;
      const foreLen = 0.3;

      const upperPivot = new THREE.Group();
      root.add(upperPivot);
      const upper = limb(upperLen, 0.055, bodyMat);
      upper.castShadow = true;
      upperPivot.add(upper);

      const elbow = joint(0.065, jointMat);
      elbow.position.y = -upperLen;
      elbow.castShadow = true;
      upperPivot.add(elbow);

      const forePivot = new THREE.Group();
      forePivot.position.y = -upperLen;
      upperPivot.add(forePivot);
      const fore = limb(foreLen, 0.045, bodyMat);
      fore.castShadow = true;
      forePivot.add(fore);

      const hand = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 8, 6),
        accentMat
      );
      hand.position.y = -foreLen;
      hand.castShadow = true;
      forePivot.add(hand);

      return { root, upperPivot, forePivot, sign, upperLen, foreLen };
    }

    const armL = createArm('L');
    const armR = createArm('R');
    torso.add(armL.root, armR.root);

    // ── Procedural walk IK-lite ──────────────────────────────────
    const strideLen = 0.38;
    const stepHeight = 0.14;
    const hipWidth = 0.16;
    const legLen = legL.thighLen + legL.shinLen;
    const walkSpeed = 2.8;

    function solveLeg(leg, phase, bodyBob) {
      const t = phase * Math.PI * 2;
      const forward = Math.sin(t) * strideLen * 0.5;
      const lift = Math.max(0, Math.cos(t)) * stepHeight;
      const hipX = leg.sign * hipWidth;
      const hipY = -0.02 + bodyBob;
      const hipZ = forward;

      const footTarget = new THREE.Vector3(hipX, lift, hipZ + 0.12);
      const hipPos = new THREE.Vector3(hipX, hipY, 0);

      const toFoot = footTarget.clone().sub(hipPos);
      const dist = Math.min(toFoot.length(), legLen - 0.001);
      toFoot.normalize().multiplyScalar(dist);

      const kneeDir = new THREE.Vector3(leg.sign * 0.3, 0, 1).normalize();
      const thighLen = leg.thighLen;
      const shinLen = leg.shinLen;

      const a = thighLen;
      const b = shinLen;
      const c = dist;
      const cosKnee = THREE.MathUtils.clamp((a * a + b * b - c * c) / (2 * a * b), -1, 1);
      const kneeAngle = Math.PI - Math.acos(cosKnee);

      const cosThigh = THREE.MathUtils.clamp((a * a + c * c - b * b) / (2 * a * c), -1, 1);
      const thighAngle = Math.acos(cosThigh);

      const flatDist = Math.sqrt(toFoot.x * toFoot.x + toFoot.z * toFoot.z);
      const pitchToTarget = Math.atan2(-toFoot.y, flatDist);

      leg.thighPivot.rotation.x = pitchToTarget + thighAngle - Math.PI * 0.5;
      leg.thighPivot.rotation.z = leg.sign * -0.08;
      leg.shinPivot.rotation.x = -(kneeAngle - Math.PI * 0.5);
      leg.footPivot.rotation.x = -(leg.thighPivot.rotation.x + leg.shinPivot.rotation.x) * 0.35;
    }

    function animateArm(arm, phase, bodySway) {
      const t = phase * Math.PI * 2;
      const swing = Math.sin(t) * 0.55;
      arm.upperPivot.rotation.x = swing + 0.15;
      arm.upperPivot.rotation.z = arm.sign * 0.12;
      arm.forePivot.rotation.x = Math.max(0, -swing * 0.6 - 0.3);
      arm.root.rotation.y = bodySway * arm.sign * 0.15;
    }

    // ── Path & motion state ──────────────────────────────────────
    let time = 0;
    const pathRadius = 3.2;
    const pathSpeed = 0.55;

    function animateWalk(dt) {
      time += dt;
      const cycle = (time * walkSpeed) % 1;
      const phaseL = cycle;
      const phaseR = (cycle + 0.5) % 1;

      const bodyBob = Math.abs(Math.sin(cycle * Math.PI * 2)) * 0.035;
      const bodySway = Math.sin(cycle * Math.PI * 2) * 0.06;

      pelvis.position.y = 1.05 + bodyBob;
      pelvis.rotation.z = bodySway * 0.5;
      torso.rotation.z = -bodySway * 0.35;
      torso.rotation.x = 0.06 + Math.sin(cycle * Math.PI * 2) * 0.03;
      head.rotation.y = Math.sin(time * 1.2) * 0.12;
      head.rotation.x = Math.sin(time * 0.9) * 0.05;

      solveLeg(legL, phaseL, bodyBob);
      solveLeg(legR, phaseR, bodyBob);
      animateArm(armL, phaseR, bodySway);
      animateArm(armR, phaseL, bodySway);

      const pathAngle = time * pathSpeed;
      biped.position.x = Math.sin(pathAngle) * pathRadius;
      biped.position.z = Math.cos(pathAngle) * pathRadius;
      biped.rotation.y = pathAngle + Math.PI;

      const shadowScale = 1 + bodyBob * 2;
      ground.scale.setScalar(shadowScale);
    }

    // ── Ambient particles ────────────────────────────────────────
    const particleCount = 120;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 1] = Math.random() * 6 + 0.5;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particles = new THREE.Points(
      particleGeo,
      new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.04, transparent: true, opacity: 0.35 })
    );
    scene.add(particles);

    // ── Render loop ──────────────────────────────────────────────
    const clock = new THREE.Clock();

    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);
      animateWalk(dt);
      particles.rotation.y += dt * 0.04;
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    tick();
  </script>
</body>
</html>
