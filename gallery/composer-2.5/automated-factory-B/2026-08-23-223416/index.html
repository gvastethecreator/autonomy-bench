<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automated Factory — Nexus Assembly Line</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --panel: #121820;
    --panel-border: #1e2a3a;
    --accent: #00d4aa;
    --accent-dim: #00a888;
    --warn: #ffb020;
    --danger: #ff4466;
    --text: #c8d4e0;
    --text-dim: #6a8099;
    --glow: rgba(0, 212, 170, 0.35);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  #app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100vw;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: linear-gradient(180deg, #141c28 0%, var(--panel) 100%);
    border-bottom: 1px solid var(--panel-border);
    z-index: 10;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
  }

  header h1 span {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 0.75rem;
    margin-left: 12px;
    letter-spacing: 0.05em;
  }

  .status-bar {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .status-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  .status-pill.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .status-pill.danger .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  main {
    position: relative;
    overflow: hidden;
  }

  #factory-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .overlay-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    align-items: center;
  }

  .metrics {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .metric {
    min-width: 100px;
  }

  .metric-label {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }

  .metric-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }

  .metric-value.warn { color: var(--warn); }
  .metric-value.danger { color: var(--danger); }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 8px 16px;
    border: 1px solid var(--panel-border);
    background: #1a2432;
    color: var(--text);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  button:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px var(--glow);
  }

  button.active {
    background: rgba(0, 212, 170, 0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  .legend {
    display: flex;
    gap: 16px;
    justify-content: flex-end;
    font-size: 0.6rem;
    color: var(--text-dim);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 12px; height: 12px;
    border-radius: 2px;
  }

  .toast {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 10px 16px;
    background: rgba(18, 24, 32, 0.92);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-size: 0.7rem;
    color: var(--accent);
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 20;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>NEXUS FACTORY<span>Automated Assembly Line v3.2</span></h1>
    <div class="status-bar">
      <div class="status-pill" id="status-system"><span class="dot"></span> SYSTEM ONLINE</div>
      <div class="status-pill" id="status-shift"><span class="dot"></span> SHIFT ACTIVE</div>
    </div>
  </header>

  <main>
    <canvas id="factory-canvas"></canvas>
    <div class="overlay-grid"></div>
    <div class="toast" id="toast"></div>
  </main>

  <footer>
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Units Produced</div>
        <div class="metric-value" id="m-produced">0</div>
      </div>
      <div class="metric">
        <div class="metric-label">Throughput / min</div>
        <div class="metric-value" id="m-throughput">0</div>
      </div>
      <div class="metric">
        <div class="metric-label">Efficiency</div>
        <div class="metric-value" id="m-efficiency">100%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Defect Rate</div>
        <div class="metric-value" id="m-defects">0.0%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Queue Depth</div>
        <div class="metric-value" id="m-queue">0</div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-pause">⏸ PAUSE</button>
      <button id="btn-speed" data-speed="1">⚡ 1×</button>
      <button id="btn-spark">✦ SPARK TEST</button>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#4a6080"></div> Raw</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ffb020"></div> Processing</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#00d4aa"></div> Complete</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ff4466"></div> Defect</div>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('factory-canvas');
  const ctx = canvas.getContext('2d');
  const toast = document.getElementById('toast');

  let W, H, scale = 1;
  let paused = false;
  let speedMult = 1;
  let time = 0;
  let lastFrame = 0;
  let produced = 0;
  let defects = 0;
  let recentProduces = [];
  let toastTimer = null;

  const STAGES = ['raw', 'welding', 'assembly', 'paint', 'qc', 'complete'];
  const STAGE_COLORS = {
    raw: '#4a6080',
    welding: '#ff8844',
    assembly: '#ffb020',
    paint: '#6688cc',
    qc: '#aa88ff',
    complete: '#00d4aa',
    defect: '#ff4466'
  };

  // ── Factory layout ──────────────────────────────────────────
  const belts = [
    { x: 80, y: 0.35, len: 0.55, dir: 1, speed: 60, lane: 0 },
    { x: 0.15, y: 0.55, len: 0.35, dir: 1, speed: 50, lane: 1 },
    { x: 0.52, y: 0.55, len: 0.38, dir: 1, speed: 50, lane: 1 },
    { x: 0.78, y: 0.35, len: 0.18, dir: 1, speed: 55, lane: 0 },
  ];

  const stations = [
    { id: 'intake', x: 0.06, y: 0.35, w: 0.07, h: 0.12, label: 'INTAKE', color: '#1e3a5f' },
    { id: 'welder', x: 0.28, y: 0.28, w: 0.09, h: 0.18, label: 'WELD', color: '#3a2010', stage: 'welding' },
    { id: 'assembler', x: 0.42, y: 0.28, w: 0.1, h: 0.18, label: 'ASSEMBLE', color: '#2a2510', stage: 'assembly' },
    { id: 'painter', x: 0.58, y: 0.28, w: 0.09, h: 0.18, label: 'PAINT', color: '#102040', stage: 'paint' },
    { id: 'qc', x: 0.72, y: 0.28, w: 0.08, h: 0.18, label: 'Q/C', color: '#201040', stage: 'qc' },
    { id: 'pack', x: 0.88, y: 0.28, w: 0.08, h: 0.18, label: 'PACK', color: '#0a3020', stage: 'complete' },
    { id: 'storage', x: 0.06, y: 0.52, w: 0.07, h: 0.14, label: 'PARTS', color: '#1a2030' },
    { id: 'feeder', x: 0.52, y: 0.52, w: 0.1, h: 0.14, label: 'FEEDER', color: '#1a2530' },
  ];

  const robots = [
    { x: 0.30, y: 0.22, reach: 55, angle: 0, target: 0.5, speed: 1.2, color: '#8899aa', station: 'welder' },
    { x: 0.47, y: 0.22, reach: 60, angle: -0.3, target: 0.8, speed: 1.5, color: '#99aabb', station: 'assembler' },
    { x: 0.62, y: 0.22, reach: 50, angle: 0.2, target: 0.3, speed: 1.0, color: '#8899aa', station: 'painter' },
    { x: 0.08, y: 0.48, reach: 45, angle: 0.6, target: 0.7, speed: 0.9, color: '#778899', station: 'storage' },
  ];

  // ── Entities ────────────────────────────────────────────────
  const items = [];
  const particles = [];
  const sparks = [];
  let spawnTimer = 0;
  const SPAWN_INTERVAL = 2.8;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(W, H) / 800;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function spawnItem() {
    items.push({
      belt: 0,
      t: 0,
      stage: 'raw',
      stageProgress: 0,
      w: 22,
      h: 16,
      defect: Math.random() < 0.04,
      id: produced + items.length + 1,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function beltPos(beltIdx, t) {
    const b = belts[beltIdx];
    const bx = (b.x / (W > 0 ? 1 : 1));
    const px = (bx + t * b.len) * W;
    const py = b.y * H + (b.lane === 1 ? 0 : 0);
    return { x: px, y: py * (b.lane === 0 ? 1 : 1) + (b.lane === 1 ? 0 : 0) };
  }

  function getItemPos(item) {
    const b = belts[item.belt];
    const px = (b.x + item.t * b.len) * W;
    const py = b.y * H;
    return { x: px, y: py };
  }

  function stationAt(x, y) {
    for (const s of stations) {
      const sx = s.x * W, sy = s.y * H, sw = s.w * W, sh = s.h * H;
      if (x >= sx && x <= sx + sw && y >= sy && y <= sy + sh) return s;
    }
    return null;
  }

  function addSpark(x, y, count = 12) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 80;
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 30,
        life: 0.3 + Math.random() * 0.4,
        maxLife: 0.7,
        size: 1 + Math.random() * 2,
        color: Math.random() > 0.5 ? '#ffaa44' : '#ffdd88'
      });
    }
  }

  function addParticle(x, y, color, count = 5) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 30,
        vy: (Math.random() - 0.5) * 30,
        life: 0.5 + Math.random() * 0.5,
        maxLife: 1,
        size: 2 + Math.random() * 3,
        color
      });
    }
  }

  // ── Drawing helpers ─────────────────────────────────────────
  function drawFloor() {
    ctx.fillStyle = '#0c1018';
    ctx.fillRect(0, 0, W, H);

    // Ambient lighting zones
    const zones = [
      { x: 0.25, y: 0.25, r: 0.2, color: 'rgba(255,120,40,0.04)' },
      { x: 0.50, y: 0.25, r: 0.18, color: 'rgba(255,180,40,0.04)' },
      { x: 0.65, y: 0.25, r: 0.15, color: 'rgba(80,120,200,0.04)' },
      { x: 0.80, y: 0.25, r: 0.12, color: 'rgba(0,212,170,0.05)' },
    ];
    for (const z of zones) {
      const grd = ctx.createRadialGradient(z.x * W, z.y * H, 0, z.x * W, z.y * H, z.r * Math.min(W, H));
      grd.addColorStop(0, z.color);
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawBelt(belt) {
    const x = belt.x * W;
    const y = belt.y * H - 14;
    const len = belt.len * W;
    const h = 28;

    // Belt frame
    ctx.fillStyle = '#1a2230';
    ctx.beginPath();
    ctx.roundRect(x - 4, y - 4, len + 8, h + 8, 4);
    ctx.fill();

    // Belt surface
    const grd = ctx.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, '#2a3545');
    grd.addColorStop(0.5, '#1e2838');
    grd.addColorStop(1, '#2a3545');
    ctx.fillStyle = grd;
    ctx.fillRect(x, y, len, h);

    // Rollers
    ctx.fillStyle = '#3a4555';
    const rollerSpacing = 30;
    const offset = (time * belt.speed * 0.5) % rollerSpacing;
    for (let rx = x + offset; rx < x + len; rx += rollerSpacing) {
      ctx.beginPath();
      ctx.ellipse(rx, y + h / 2, 3, h / 2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Moving stripes
    ctx.strokeStyle = 'rgba(255,180,40,0.15)';
    ctx.lineWidth = 2;
    const stripeOff = (time * belt.speed) % 40;
    for (let sx = x - stripeOff; sx < x + len; sx += 40) {
      ctx.beginPath();
      ctx.moveTo(sx, y + 2);
      ctx.lineTo(sx + 15, y + h - 2);
      ctx.stroke();
    }

    // Side rails
    ctx.strokeStyle = '#445566';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, len, h);
  }

  function drawStation(s) {
    const x = s.x * W, y = s.y * H, w = s.w * W, h = s.h * H;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x + 3, y + 3, w, h);

    // Body
    const grd = ctx.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, lighten(s.color, 20));
    grd.addColorStop(1, s.color);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 3);
    ctx.fill();

    // Border glow if active
    const active = s.stage && items.some(it => {
      const pos = getItemPos(it);
      const cx = x + w / 2, cy = y + h / 2;
      return Math.hypot(pos.x - cx, pos.y - cy) < w;
    });

    ctx.strokeStyle = active ? 'rgba(0,212,170,0.6)' : '#334455';
    ctx.lineWidth = active ? 2 : 1;
    ctx.stroke();

    // Label
    ctx.fillStyle = active ? '#00d4aa' : '#6a8099';
    ctx.font = `600 ${Math.max(8, 9 * scale)}px JetBrains Mono`;
    ctx.textAlign = 'center';
    ctx.fillText(s.label, x + w / 2, y + h - 8);

    // Status LEDs
    const ledY = y + 10;
    const ledColors = active ? ['#00d4aa', '#ffb020', '#00d4aa'] : ['#334455', '#334455', '#334455'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = ledColors[i];
      ctx.beginPath();
      ctx.arc(x + 12 + i * 10, ledY, 3, 0, Math.PI * 2);
      ctx.fill();
      if (active) {
        ctx.shadowColor = ledColors[i];
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Station-specific details
    if (s.id === 'welder') drawWelderDetail(x, y, w, h);
    if (s.id === 'assembler') drawAssemblerDetail(x, y, w, h);
    if (s.id === 'painter') drawPainterDetail(x, y, w, h);
    if (s.id === 'qc') drawQCDetail(x, y, w, h);
  }

  function drawWelderDetail(x, y, w, h) {
    const flicker = Math.sin(time * 20) > 0.7;
    if (flicker) {
      ctx.fillStyle = 'rgba(255,150,50,0.3)';
      ctx.fillRect(x + w * 0.3, y + h * 0.2, w * 0.4, h * 0.3);
    }
  }

  function drawAssemblerDetail(x, y, w, h) {
    const armAngle = Math.sin(time * 3) * 0.4;
    ctx.save();
    ctx.translate(x + w / 2, y + h * 0.35);
    ctx.rotate(armAngle);
    ctx.fillStyle = '#556677';
    ctx.fillRect(-3, 0, 6, h * 0.35);
    ctx.fillStyle = '#778899';
    ctx.beginPath();
    ctx.arc(0, h * 0.35, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPainterDetail(x, y, w, h) {
    ctx.fillStyle = 'rgba(100,140,220,0.2)';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.4, y);
    ctx.lineTo(x + w * 0.3, y - 20);
    ctx.lineTo(x + w * 0.5, y - 20);
    ctx.closePath();
    ctx.fill();
  }

  function drawQCDetail(x, y, w, h) {
    const scanY = y + ((time * 40) % h);
    ctx.strokeStyle = 'rgba(170,136,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 4, scanY);
    ctx.lineTo(x + w - 4, scanY);
    ctx.stroke();
  }

  function drawRobot(robot) {
    const x = robot.x * W, y = robot.y * H;
    const reach = robot.reach * scale;
    robot.angle += (robot.target - robot.angle) * 0.02 * robot.speed;
    if (Math.abs(robot.target - robot.angle) < 0.01) {
      robot.target = (Math.random() - 0.5) * 1.2;
    }

    // Base
    ctx.fillStyle = '#2a3545';
    ctx.beginPath();
    ctx.arc(x, y, 14 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#445566';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Arm segments
    const a1 = robot.angle;
    const a2 = robot.angle + 0.8 + Math.sin(time * 2 + robot.x * 10) * 0.2;
    const seg1 = reach * 0.55;
    const seg2 = reach * 0.45;

    const j1x = x + Math.cos(a1) * seg1;
    const j1y = y + Math.sin(a1) * seg1;
    const ex = j1x + Math.cos(a2) * seg2;
    const ey = j1y + Math.sin(a2) * seg2;

    ctx.strokeStyle = robot.color;
    ctx.lineWidth = 5 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(j1x, j1y);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    // Joints
    ctx.fillStyle = '#667788';
    for (const [jx, jy] of [[x, y], [j1x, j1y]]) {
      ctx.beginPath();
      ctx.arc(jx, jy, 5 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // Gripper
    ctx.fillStyle = '#99aabb';
    ctx.beginPath();
    ctx.arc(ex, ey, 4 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Occasional weld spark at end effector
    if (robot.station === 'welder' && Math.random() < 0.02) {
      addSpark(ex, ey, 4);
    }
  }

  function drawItem(item) {
    const pos = getItemPos(item);
    const color = item.defect && item.stage === 'complete' ? STAGE_COLORS.defect
      : STAGE_COLORS[item.stage] || STAGE_COLORS.raw;

    item.pulse += 0.05;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(pos.x - item.w / 2 + 2, pos.y - item.h / 2 + 3, item.w, item.h);

    // Body
    const grd = ctx.createLinearGradient(pos.x - item.w / 2, pos.y - item.h / 2, pos.x + item.w / 2, pos.y + item.h / 2);
    grd.addColorStop(0, lighten(color, 30));
    grd.addColorStop(1, color);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect(pos.x - item.w / 2, pos.y - item.h / 2, item.w, item.h, 3);
    ctx.fill();

    // Stage indicator stripe
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(pos.x - item.w / 2 + 3, pos.y - item.h / 2 + 3, item.w - 6, 3);

    // Processing glow
    if (item.stageProgress > 0 && item.stageProgress < 1) {
      ctx.strokeStyle = `rgba(255,180,40,${0.3 + Math.sin(item.pulse) * 0.2})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // ID tag
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = `600 ${Math.max(7, 8 * scale)}px JetBrains Mono`;
    ctx.textAlign = 'center';
    ctx.fillText('#' + item.id, pos.x, pos.y + 4);
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= 0.016;
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks() {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= 0.016;
      s.vy += 120 * 0.016;
      s.x += s.vx * 0.016;
      s.y += s.vy * 0.016;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = s.life / s.maxLife;
      ctx.fillStyle = s.color;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawPipes() {
    ctx.strokeStyle = '#2a3545';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0.06 * W + 40, 0.44 * H);
    ctx.lineTo(0.15 * W, 0.44 * H);
    ctx.lineTo(0.15 * W, 0.55 * H);
    ctx.stroke();

    ctx.strokeStyle = '#334455';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(0.52 * W, 0.44 * H);
    ctx.lineTo(0.52 * W, 0.52 * H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawHUD() {
    // Mini throughput graph
    const gx = W - 160, gy = 16, gw = 140, gh = 50;
    ctx.fillStyle = 'rgba(18,24,32,0.85)';
    ctx.strokeStyle = '#1e2a3a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(gx, gy, gw, gh, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#6a8099';
    ctx.font = `600 ${Math.max(7, 8 * scale)}px JetBrains Mono`;
    ctx.textAlign = 'left';
    ctx.fillText('OUTPUT RATE', gx + 8, gy + 14);

    const hist = recentProduces.slice(-30);
    if (hist.length > 1) {
      const maxV = Math.max(...hist, 1);
      ctx.strokeStyle = '#00d4aa';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < hist.length; i++) {
        const px = gx + 8 + (i / 29) * (gw - 16);
        const py = gy + gh - 8 - (hist[i] / maxV) * (gh - 24);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  function lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = Math.min(255, ((n >> 16) & 0xff) + amt);
    let g = Math.min(255, ((n >> 8) & 0xff) + amt);
    let b = Math.min(255, (n & 0xff) + amt);
    return `rgb(${r},${g},${b})`;
  }

  // ── Simulation update ─────────────────────────────────────
  function update(dt) {
    if (paused) return;
    dt *= speedMult;
    time += dt;

    spawnTimer += dt;
    if (spawnTimer >= SPAWN_INTERVAL / speedMult) {
      spawnTimer = 0;
      if (items.length < 18) spawnItem();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      const belt = belts[item.belt];
      item.t += (belt.speed * dt) / (belt.len * W);

      const pos = getItemPos(item);

      // Stage transitions based on position
      const stageThresholds = [
        { t: 0.15, stage: 'raw' },
        { t: 0.30, stage: 'welding', progress: true },
        { t: 0.48, stage: 'assembly', progress: true },
        { t: 0.62, stage: 'paint', progress: true },
        { t: 0.76, stage: 'qc', progress: true },
        { t: 0.90, stage: 'complete' },
      ];

      for (const st of stageThresholds) {
        if (item.t >= st.t) {
          if (item.stage !== st.stage) {
            item.stage = st.stage;
            item.stageProgress = 0;
            if (st.progress) {
              addSpark(pos.x, pos.y, 6);
            }
            if (st.stage === 'complete') {
              addParticle(pos.x, pos.y, item.defect ? '#ff4466' : '#00d4aa', 8);
            }
          }
        }
      }

      if (item.stageProgress < 1 && ['welding', 'assembly', 'paint', 'qc'].includes(item.stage)) {
        item.stageProgress = Math.min(1, item.stageProgress + dt * 0.8);
      }

      // Transfer to secondary belt
      if (item.belt === 0 && item.t >= 0.92) {
        item.belt = 3;
        item.t = 0;
      }

      // Complete
      if (item.belt === 3 && item.t >= 0.95) {
        produced++;
        if (item.defect) defects++;
        recentProduces.push(1);
        if (recentProduces.length > 60) recentProduces.shift();
        items.splice(i, 1);
      }

      // Remove off-screen
      if (item.t > 1.05) items.splice(i, 1);
    }

    // Secondary belt items (parts feeder simulation)
    // Keep queue metric updated
    updateMetrics();
  }

  let metricsTimer = 0;
  function updateMetrics() {
    document.getElementById('m-produced').textContent = produced;
    document.getElementById('m-queue').textContent = items.length;

    const oneMinAgo = time - 60;
    const recentCount = recentProduces.length;
    const throughput = Math.round(recentCount * (60 / Math.max(recentProduces.length, 1)) * (speedMult > 0 ? 1 : 0));
    const tputEl = document.getElementById('m-throughput');
    tputEl.textContent = Math.round(recentProduces.filter((_, i) => i >= recentProduces.length - 10).length * 6);
    
    const eff = items.length > 15 ? 72 : items.length > 10 ? 88 : 100 - items.length;
    const effEl = document.getElementById('m-efficiency');
    effEl.textContent = Math.max(60, eff) + '%';
    effEl.className = 'metric-value' + (eff < 80 ? ' warn' : '');

    const defectRate = produced > 0 ? (defects / produced * 100).toFixed(1) : '0.0';
    const defEl = document.getElementById('m-defects');
    defEl.textContent = defectRate + '%';
    defEl.className = 'metric-value' + (parseFloat(defectRate) > 5 ? ' danger' : parseFloat(defectRate) > 2 ? ' warn' : '');

    const sysStatus = document.getElementById('status-system');
    if (eff < 75) {
      sysStatus.className = 'status-pill warn';
      sysStatus.innerHTML = '<span class="dot"></span> HIGH LOAD';
    } else {
      sysStatus.className = 'status-pill';
      sysStatus.innerHTML = '<span class="dot"></span> SYSTEM ONLINE';
    }
  }

  // ── Render loop ─────────────────────────────────────────────
  function render() {
    drawFloor();
    drawPipes();

    for (const b of belts) drawBelt(b);
    for (const s of stations) drawStation(s);
    for (const r of robots) drawRobot(r);
    for (const item of items) drawItem(item);

    drawSparks();
    drawParticles();
    drawHUD();
  }

  function loop(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ── Controls ────────────────────────────────────────────────
  document.getElementById('btn-pause').addEventListener('click', function() {
    paused = !paused;
    this.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
    this.classList.toggle('active', paused);
    showToast(paused ? 'Production paused' : 'Production resumed');
  });

  document.getElementById('btn-speed').addEventListener('click', function() {
    const speeds = [1, 2, 4];
    const idx = speeds.indexOf(speedMult);
    speedMult = speeds[(idx + 1) % speeds.length];
    this.textContent = '⚡ ' + speedMult + '×';
    this.dataset.speed = speedMult;
    showToast('Speed: ' + speedMult + '×');
  });

  document.getElementById('btn-spark').addEventListener('click', function() {
    addSpark(W * 0.30, H * 0.35, 30);
    showToast('Welding test initiated');
  });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const s = stationAt(mx, my);
    if (s) showToast(s.label + ' station selected');
  });

  window.addEventListener('resize', resize);
  resize();
  spawnItem();
  spawnItem();
  requestAnimationFrame(loop);
})();
</script>
</body>
