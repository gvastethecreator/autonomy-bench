<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Hub — Live Airport Operations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0e17;
    --panel: rgba(12, 18, 32, 0.82);
    --panel-border: rgba(120, 180, 255, 0.12);
    --accent: #4ecdc4;
    --accent-warm: #ff8c42;
    --accent-gold: #f4c95d;
    --text: #e8eef7;
    --text-dim: rgba(232, 238, 247, 0.55);
    --runway: #2a3344;
    --grass: #1a2e1f;
    --danger: #ff5e5e;
    --success: #5effa0;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Outfit', sans-serif;
    color: var(--text);
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  canvas#main {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  /* ── HUD overlay ── */
  .hud {
    position: absolute;
    pointer-events: none;
    inset: 0;
    z-index: 10;
  }

  .hud > * { pointer-events: auto; }

  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(180deg, rgba(6,10,18,0.92) 0%, transparent 100%);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent) 0%, #2a8a82 100%);
    display: grid;
    place-items: center;
    font-size: 18px;
    box-shadow: 0 4px 20px rgba(78,205,196,0.35);
  }

  .brand h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .brand span {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .clock-block {
    text-align: center;
  }

  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-shadow: 0 0 30px rgba(78,205,196,0.4);
  }

  .clock-date {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  .weather-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(12px);
    font-size: 0.82rem;
  }

  /* ── Side panels ── */
  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .panel-left {
    top: 80px; left: 20px;
    width: 260px;
    max-height: calc(100vh - 180px);
    overflow: hidden;
  }

  .panel-right {
    top: 80px; right: 20px;
    width: 280px;
    max-height: calc(100vh - 180px);
    overflow: hidden;
  }

  .panel-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.06);
    transition: border-color 0.3s, transform 0.2s;
  }

  .stat-card:hover { border-color: rgba(78,205,196,0.3); transform: translateY(-1px); }

  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 600;
    line-height: 1;
  }

  .stat-val.green { color: var(--success); }
  .stat-val.orange { color: var(--accent-warm); }
  .stat-val.cyan { color: var(--accent); }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Flight board ── */
  .flight-list {
    overflow-y: auto;
    max-height: 320px;
    scrollbar-width: thin;
    scrollbar-color: rgba(78,205,196,0.3) transparent;
  }

  .flight-row {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    font-size: 0.78rem;
    background: rgba(255,255,255,0.02);
    border-left: 3px solid transparent;
    transition: background 0.2s, border-color 0.3s;
    animation: slideIn 0.4s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .flight-row.arrival { border-left-color: var(--accent); }
  .flight-row.departure { border-left-color: var(--accent-warm); }
  .flight-row.active { background: rgba(78,205,196,0.08); }

  .flight-code {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 0.72rem;
  }

  .flight-route { color: var(--text-dim); font-size: 0.7rem; }

  .flight-status {
    font-size: 0.62rem;
    padding: 3px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    white-space: nowrap;
  }

  .status-landed { background: rgba(94,255,160,0.15); color: var(--success); }
  .status-taxi { background: rgba(78,205,196,0.15); color: var(--accent); }
  .status-gate { background: rgba(244,201,93,0.15); color: var(--accent-gold); }
  .status-board { background: rgba(255,140,66,0.15); color: var(--accent-warm); }
  .status-takeoff { background: rgba(255,94,94,0.15); color: var(--danger); }
  .status-approach { background: rgba(120,180,255,0.15); color: #78b4ff; }
  .status-queue { background: rgba(255,255,255,0.08); color: var(--text-dim); }

  /* ── Runway status ── */
  .runway-status {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .runway-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    font-size: 0.78rem;
  }

  .runway-indicator {
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .runway-indicator.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .runway-indicator.occupied { background: var(--accent-warm); box-shadow: 0 0 8px var(--accent-warm); }
  .runway-indicator.closed { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ── Bottom controls ── */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px 24px 20px;
    background: linear-gradient(0deg, rgba(6,10,18,0.92) 0%, transparent 100%);
  }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 24px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(12px);
  }

  .speed-control label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .speed-btns {
    display: flex;
    gap: 4px;
  }

  .speed-btn {
    width: 36px; height: 32px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .speed-btn:hover { background: rgba(78,205,196,0.15); border-color: var(--accent); }
  .speed-btn.active {
    background: rgba(78,205,196,0.25);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(78,205,196,0.3);
  }

  .legend {
    display: flex;
    gap: 16px;
    font-size: 0.68rem;
    color: var(--text-dim);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* ── Toast notifications ── */
  .toast-container {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    z-index: 20;
  }

  .toast {
    padding: 10px 20px;
    border-radius: 10px;
    background: rgba(12,18,32,0.95);
    border: 1px solid var(--panel-border);
    font-size: 0.78rem;
    backdrop-filter: blur(12px);
    animation: toastIn 0.35s ease-out, toastOut 0.35s ease-in 2.8s forwards;
    white-space: nowrap;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-8px); }
  }

  /* ── Vignette ── */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
    z-index: 5;
  }

  .scanline {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.015) 2px,
      rgba(0,0,0,0.015) 4px
    );
    z-index: 6;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="main"></canvas>
  <div class="vignette"></div>
  <div class="scanline"></div>

  <div class="hud">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">✈</div>
        <div>
          <h1>Skyline Hub</h1>
          <span>International · Live Operations</span>
        </div>
      </div>
      <div class="clock-block">
        <div class="clock-time" id="clock">06:42</div>
        <div class="clock-date" id="date">Sunday · Aug 23</div>
      </div>
      <div class="weather-chip">
        <span id="weather-icon">🌅</span>
        <span id="weather-text">Clear · 18 kt NW · Vis 10+ mi</span>
      </div>
    </div>

    <div class="panel panel-left">
      <div class="panel-title">Operations Overview</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val cyan" id="stat-active">0</div>
          <div class="stat-label">Active Flights</div>
        </div>
        <div class="stat-card">
          <div class="stat-val green" id="stat-landed">0</div>
          <div class="stat-label">Landed Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-val orange" id="stat-departed">0</div>
          <div class="stat-label">Departed</div>
        </div>
        <div class="stat-card">
          <div class="stat-val cyan" id="stat-gates">0/8</div>
          <div class="stat-label">Gates Used</div>
        </div>
      </div>
      <div class="panel-title">Runway Status</div>
      <div class="runway-status" id="runway-status"></div>
    </div>

    <div class="panel panel-right">
      <div class="panel-title">Flight Board</div>
      <div class="flight-list" id="flight-board"></div>
    </div>

    <div class="bottom-bar">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div> Arriving</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent-warm)"></div> Departing</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent-gold)"></div> At Gate</div>
        <div class="legend-item"><div class="legend-dot" style="background:#78b4ff"></div> Ground Crew</div>
      </div>
      <div class="speed-control">
        <label>Sim Speed</label>
        <div class="speed-btns">
          <button class="speed-btn" data-speed="0.5">½×</button>
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="4">4×</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toasts"></div>
  </div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
let W, H, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Simulation state ──
let simSpeed = 1;
let simTime = 6 * 3600 + 42 * 60; // 06:42 in seconds
let landedToday = 0;
let departedToday = 0;
let tick = 0;

const AIRLINES = ['SLH','NVA','AER','PAC','ATL','EUR','SKY','JET','WNG','HBR'];
const CITIES = [
  ['JFK','New York'],['LHR','London'],['NRT','Tokyo'],['DXB','Dubai'],
  ['SIN','Singapore'],['CDG','Paris'],['FRA','Frankfurt'],['SYD','Sydney'],
  ['LAX','Los Angeles'],['ORD','Chicago'],['AMS','Amsterdam'],['HKG','Hong Kong']
];

function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1, y2-y1); }

// ── Airport layout (normalized coords, scaled to canvas) ──
const LAYOUT = {
  runways: [
    { id: '09L/27R', x1: 0.08, y1: 0.72, x2: 0.92, y2: 0.72, width: 0.045, heading: 90 },
    { id: '09R/27L', x1: 0.08, y1: 0.58, x2: 0.92, y2: 0.58, width: 0.035, heading: 90 }
  ],
  taxiways: [
    { pts: [[0.15,0.58],[0.15,0.72],[0.35,0.72],[0.35,0.58]] },
    { pts: [[0.55,0.58],[0.55,0.72]] },
    { pts: [[0.75,0.58],[0.75,0.72]] },
    { pts: [[0.35,0.58],[0.35,0.42],[0.65,0.42],[0.65,0.58]] },
    { pts: [[0.65,0.42],[0.65,0.28],[0.82,0.28]] },
    { pts: [[0.35,0.42],[0.35,0.28],[0.18,0.28]] }
  ],
  terminal: { x: 0.28, y: 0.18, w: 0.44, h: 0.14 },
  tower: { x: 0.72, y: 0.22, r: 0.025 },
  gates: [
    { id: 'A1', x: 0.30, y: 0.32, occupied: false },
    { id: 'A2', x: 0.37, y: 0.32, occupied: false },
    { id: 'A3', x: 0.44, y: 0.32, occupied: false },
    { id: 'A4', x: 0.51, y: 0.32, occupied: false },
    { id: 'B1', x: 0.58, y: 0.32, occupied: false },
    { id: 'B2', x: 0.65, y: 0.32, occupied: false },
    { id: 'B3', x: 0.30, y: 0.38, occupied: false },
    { id: 'B4', x: 0.65, y: 0.38, occupied: false }
  ],
  hangars: [
    { x: 0.06, y: 0.22, w: 0.10, h: 0.08 },
    { x: 0.84, y: 0.38, w: 0.10, h: 0.08 }
  ]
};

function toScreen(nx, ny) { return { x: nx * W, y: ny * H }; }

// ── Runway occupancy ──
const runwayState = LAYOUT.runways.map(r => ({ ...r, occupied: false, plane: null }));

// ── Particles ──
const particles = [];

function spawnParticle(x, y, type) {
  const p = { x, y, type, life: 1, vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8 };
  if (type === 'exhaust') { p.vy = -Math.random()*1.5 - 0.5; p.life = 0.6 + Math.random()*0.4; }
  if (type === 'spark') { p.life = 0.3 + Math.random()*0.3; p.vx *= 2; p.vy *= 2; }
  if (type === 'smoke') { p.vy = -0.3 - Math.random()*0.5; p.life = 1.5 + Math.random(); }
  particles.push(p);
}

// ── Ground vehicles ──
const vehicles = [];

function spawnVehicle(type, tx, ty) {
  vehicles.push({
    type, x: tx, y: ty, tx, ty,
    progress: 0, speed: 0.003 + Math.random()*0.002,
    active: true, blink: 0
  });
}

// ── Aircraft ──
const planes = [];
let flightCounter = 100;

const STATUSES = {
  QUEUE: 'queue', APPROACH: 'approach', LANDING: 'landing', TAXI_IN: 'taxi_in',
  AT_GATE: 'at_gate', BOARDING: 'boarding', PUSHBACK: 'pushback',
  TAXI_OUT: 'taxi_out', TAKEOFF: 'takeoff', DEPARTED: 'departed'
};

function makeFlight(isArrival) {
  flightCounter++;
  const airline = randChoice(AIRLINES);
  const num = flightCounter;
  const code = `${airline}${num}`;
  const [cityCode, cityName] = randChoice(CITIES);
  const gate = isArrival ? null : randChoice(LAYOUT.gates.filter(g => !g.occupied));
  if (!isArrival && !gate) return null;

  return {
    code,
    airline,
    isArrival,
    origin: isArrival ? cityCode : 'SLH',
    dest: isArrival ? 'SLH' : cityCode,
    cityName,
    status: isArrival ? STATUSES.QUEUE : STATUSES.AT_GATE,
    gate,
    x: isArrival ? -0.05 : gate.x,
    y: isArrival ? 0.65 + Math.random()*0.1 : gate.y,
    angle: isArrival ? 90 : 180,
    alt: isArrival ? 800 : 0,
    speed: 0,
    targetSpeed: 0,
    path: [],
    pathIdx: 0,
    progress: 0,
    boardingTimer: 0,
    pushbackTimer: 0,
    landingTimer: 0,
    color: `hsl(${randInt(180,220)}, ${randInt(55,75)}%, ${randInt(45,60)}%)`,
    tailColor: `hsl(${randInt(0,360)}, ${randInt(40,60)}%, ${randInt(35,50)}%)`,
    size: 0.018 + Math.random()*0.004,
    trail: [],
    assignedRunway: randChoice(runwayState)
  };
}

function initFlights() {
  for (let i = 0; i < 4; i++) {
    const f = makeFlight(true);
    if (f) { f.status = STATUSES.APPROACH; f.x = 0.1 + i*0.15; f.alt = 200 + i*100; planes.push(f); }
  }
  for (let i = 0; i < 2; i++) {
    const gate = LAYOUT.gates[i];
    gate.occupied = true;
    const f = makeFlight(false);
    if (f) { f.gate = gate; f.status = STATUSES.BOARDING; f.boardingTimer = randInt(20,60); planes.push(f); }
  }
}
initFlights();

function findFreeGate() {
  return LAYOUT.gates.find(g => !g.occupied);
}

function buildTaxiPath(fromX, fromY, toGate) {
  return [
    { x: fromX, y: fromY },
    { x: 0.55, y: fromY },
    { x: 0.55, y: 0.42 },
    { x: toGate.x, y: 0.42 },
    { x: toGate.x, y: toGate.y }
  ];
}

function buildDepartPath(fromGate, runway) {
  return [
    { x: fromGate.x, y: fromGate.y },
    { x: fromGate.x, y: 0.42 },
    { x: 0.55, y: 0.42 },
    { x: 0.55, y: runway.y1 },
    { x: 0.85, y: runway.y1 }
  ];
}

function showToast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ── Spawn schedule ──
let spawnTimer = 0;

function trySpawnFlight() {
  spawnTimer++;
  if (spawnTimer < 180 / simSpeed) return;
  spawnTimer = 0;

  if (Math.random() < 0.65) {
    const gate = findFreeGate();
    if (gate && planes.filter(p => p.isArrival && p.status !== STATUSES.DEPARTED).length < 6) {
      const f = makeFlight(true);
      if (f) { f.status = STATUSES.APPROACH; f.x = -0.08; f.alt = 600 + Math.random()*400; planes.push(f); showToast(`Incoming ${f.code} from ${f.origin}`); }
    }
  } else {
    const gate = LAYOUT.gates.find(g => g.occupied && !planes.some(p => !p.isArrival && p.gate === g && p.status !== STATUSES.DEPARTED));
    if (!gate) {
      const freeGate = findFreeGate();
      if (freeGate) {
        freeGate.occupied = true;
        const f = makeFlight(false);
        if (f) { f.gate = freeGate; f.x = freeGate.x; f.y = freeGate.y; f.status = STATUSES.BOARDING; f.boardingTimer = randInt(80,160); planes.push(f); showToast(`Departure ${f.code} to ${f.dest} at gate ${freeGate.id}`); }
      }
    }
  }
}

// ── Update planes ──
function updatePlane(p, dt) {
  p.trail.push({ x: p.x, y: p.y, alt: p.alt });
  if (p.trail.length > 30) p.trail.shift();

  switch (p.status) {
    case STATUSES.QUEUE:
      p.x += 0.0003 * dt;
      if (p.x > 0.5 && !runwayState[0].occupied) {
        p.status = STATUSES.APPROACH;
        p.assignedRunway = runwayState[0];
      }
      break;

    case STATUSES.APPROACH: {
      const rw = p.assignedRunway;
      const targetY = rw.y1;
      p.x += 0.0012 * dt * simSpeed;
      p.alt = Math.max(0, p.alt - 3 * dt * simSpeed);
      p.y = lerp(p.y, targetY, 0.02 * dt);
      p.angle = 90;
      if (p.x > 0.7 && p.alt < 50) {
        p.status = STATUSES.LANDING;
        p.landingTimer = 0;
        rw.occupied = true;
        rw.plane = p;
        showToast(`${p.code} landing RWY ${rw.id.split('/')[0]}`);
      }
      break;
    }

    case STATUSES.LANDING:
      p.landingTimer += dt;
      p.x += 0.0008 * dt * simSpeed;
      p.alt = Math.max(0, p.alt - 5 * dt * simSpeed);
      if (p.landingTimer > 5) spawnParticle(p.x * W, p.y * H, 'spark');
      if (p.alt <= 0 && p.landingTimer > 15) {
        p.status = STATUSES.TAXI_IN;
        p.alt = 0;
        p.assignedRunway.occupied = false;
        p.assignedRunway.plane = null;
        landedToday++;
        const gate = findFreeGate();
        if (gate) {
          gate.occupied = true;
          p.gate = gate;
          p.path = buildTaxiPath(p.x, p.y, gate);
          p.pathIdx = 0;
          p.progress = 0;
          showToast(`${p.code} taxiing to gate ${gate.id}`);
        }
      }
      break;

    case STATUSES.TAXI_IN:
      followPath(p, 0.0006 * simSpeed, dt, () => {
        p.status = STATUSES.AT_GATE;
        p.angle = 180;
        spawnVehicle('fuel', p.gate.x - 0.02, p.gate.y);
        spawnVehicle('baggage', p.gate.x + 0.02, p.gate.y + 0.02);
        showToast(`${p.code} arrived at gate ${p.gate.id}`);
      });
      break;

    case STATUSES.AT_GATE:
      p.boardingTimer += dt * simSpeed * 0.5;
      if (p.boardingTimer > 60) {
        p.status = STATUSES.BOARDING;
        p.boardingTimer = randInt(100, 200);
      }
      break;

    case STATUSES.BOARDING:
      p.boardingTimer -= dt * simSpeed;
      if (Math.random() < 0.02 * simSpeed) spawnVehicle('stairs', p.gate.x, p.gate.y - 0.015);
      if (p.boardingTimer <= 0) {
        p.status = STATUSES.PUSHBACK;
        p.pushbackTimer = 40;
        showToast(`${p.code} pushback initiated`);
      }
      break;

    case STATUSES.PUSHBACK:
      p.pushbackTimer -= dt * simSpeed;
      p.y += 0.0003 * dt * simSpeed;
      p.angle = lerp(p.angle, 90, 0.03 * dt);
      if (p.pushbackTimer <= 0) {
        p.status = STATUSES.TAXI_OUT;
        const rw = runwayState.find(r => !r.occupied) || runwayState[1];
        p.assignedRunway = rw;
        p.path = buildDepartPath(p.gate, rw);
        p.pathIdx = 0;
        p.progress = 0;
        p.gate.occupied = false;
        showToast(`${p.code} taxiing to runway`);
      }
      break;

    case STATUSES.TAXI_OUT:
      followPath(p, 0.0007 * simSpeed, dt, () => {
        p.status = STATUSES.TAKEOFF;
        p.assignedRunway.occupied = true;
        p.assignedRunway.plane = p;
        showToast(`${p.code} cleared for takeoff`);
      });
      break;

    case STATUSES.TAKEOFF:
      p.x += 0.0015 * dt * simSpeed;
      p.alt += 4 * dt * simSpeed;
      p.angle = 90;
      if (Math.random() < 0.3) spawnParticle(p.x * W, p.y * H, 'exhaust');
      if (p.x > 1.05) {
        p.status = STATUSES.DEPARTED;
        p.assignedRunway.occupied = false;
        p.assignedRunway.plane = null;
        departedToday++;
        showToast(`${p.code} departed to ${p.dest}`);
      }
      break;
  }
}

function followPath(p, speed, dt, onDone) {
  if (!p.path || p.path.length < 2) return;
  p.progress += speed * dt;
  while (p.progress >= 1 && p.pathIdx < p.path.length - 2) {
    p.progress -= 1;
    p.pathIdx++;
  }
  if (p.pathIdx >= p.path.length - 1) { onDone(); return; }
  const a = p.path[p.pathIdx];
  const b = p.path[p.pathIdx + 1];
  p.x = lerp(a.x, b.x, p.progress);
  p.y = lerp(a.y, b.y, p.progress);
  p.angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

function updateVehicles(dt) {
  for (const v of vehicles) {
    if (!v.active) continue;
    v.blink += dt * 0.1;
    const d = dist(v.x, v.y, v.tx, v.ty);
    if (d < 0.005) { v.active = false; continue; }
    const dx = (v.tx - v.x) / d;
    const dy = (v.ty - v.y) / d;
    v.x += dx * v.speed * dt * simSpeed;
    v.y += dy * v.speed * dt * simSpeed;
  }
  while (vehicles.length > 20) vehicles.shift();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= 0.015 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ── Rendering ──
function drawBackground(t) {
  const hour = (simTime / 3600) % 24;
  let skyTop, skyBot, sunOpacity;

  if (hour >= 5 && hour < 8) {
    const p = (hour - 5) / 3;
    skyTop = lerpColor('#0a1628', '#3d5a80', p);
    skyBot = lerpColor('#1a2840', '#f4a261', p);
    sunOpacity = p * 0.6;
  } else if (hour >= 8 && hour < 17) {
    skyTop = '#4a7ab0';
    skyBot = '#87b8de';
    sunOpacity = 0.85;
  } else if (hour >= 17 && hour < 20) {
    const p = (hour - 17) / 3;
    skyTop = lerpColor('#4a7ab0', '#2d1b4e', p);
    skyBot = lerpColor('#87b8de', '#e76f51', p);
    sunOpacity = 0.85 - p * 0.5;
  } else {
    skyTop = '#0a0e1a';
    skyBot = '#141828';
    sunOpacity = 0.05;
  }

  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Sun / moon
  const sunX = W * (0.15 + (hour / 24) * 0.7);
  const sunY = H * (0.15 + Math.sin((hour - 6) / 12 * Math.PI) * 0.12);
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 60);
  if (hour >= 6 && hour < 19) {
    sunGrad.addColorStop(0, `rgba(255,220,150,${sunOpacity})`);
    sunGrad.addColorStop(0.4, `rgba(255,180,80,${sunOpacity * 0.3})`);
    sunGrad.addColorStop(1, 'rgba(255,180,80,0)');
  } else {
    sunGrad.addColorStop(0, 'rgba(220,230,255,0.7)');
    sunGrad.addColorStop(1, 'rgba(220,230,255,0)');
  }
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Clouds
  ctx.globalAlpha = 0.12 + sunOpacity * 0.08;
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 237 + t * 0.008 * (i % 2 ? 1 : -1)) % (W + 200)) - 100;
    const cy = H * (0.06 + i * 0.035);
    drawCloud(cx, cy, 50 + i * 12);
  }
  ctx.globalAlpha = 1;

  // Grass airfield
  const grassGrad = ctx.createLinearGradient(0, H * 0.45, 0, H);
  grassGrad.addColorStop(0, '#1e3a24');
  grassGrad.addColorStop(0.3, '#162e1a');
  grassGrad.addColorStop(1, '#0f2012');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, H * 0.45, W, H * 0.55);

  // Subtle grass texture
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 80; i++) {
    const gx = (i * 173 + Math.floor(t * 0.01)) % W;
    const gy = H * 0.45 + (i * 97) % (H * 0.55);
    ctx.fillStyle = i % 2 ? '#2a5a30' : '#1a4020';
    ctx.fillRect(gx, gy, 2, 8);
  }
  ctx.globalAlpha = 1;
}

function lerpColor(a, b, t) {
  const parse = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [ar,ag,ab] = parse(a);
  const [br,bg,bb] = parse(b);
  const r = Math.round(lerp(ar,br,t));
  const g = Math.round(lerp(ag,bg,t));
  const bl = Math.round(lerp(ab,bb,t));
  return `rgb(${r},${g},${bl})`;
}

function drawCloud(x, y, size) {
  ctx.beginPath();
  ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y - size * 0.1, size * 0.35, 0, Math.PI * 2);
  ctx.arc(x + size * 0.7, y, size * 0.4, 0, Math.PI * 2);
  ctx.arc(x + size * 0.3, y + size * 0.15, size * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
}

function drawRunways() {
  for (const rw of LAYOUT.runways) {
    const p1 = toScreen(rw.x1, rw.y1);
    const p2 = toScreen(rw.x2, rw.y2);
    const rwW = rw.width * H;

    // Runway surface
    ctx.save();
    ctx.strokeStyle = '#3a4555';
    ctx.lineWidth = rwW;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    // Center line
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 16]);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Edge lights
    const steps = 20;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const lx = lerp(p1.x, p2.x, t);
      const ly = lerp(p1.y, p2.y, t);
      const pulse = 0.5 + 0.5 * Math.sin(tick * 0.05 + i * 0.8);
      ctx.fillStyle = rw.occupied
        ? `rgba(255,140,66,${0.6 + pulse * 0.4})`
        : `rgba(255,255,255,${0.3 + pulse * 0.3})`;
      ctx.beginPath();
      ctx.arc(lx, ly - rwW * 0.45, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(lx, ly + rwW * 0.45, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Runway numbers
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `bold ${rwW * 0.35}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(rw.id.split('/')[0], p1.x + 40, p1.y + 6);
    ctx.fillText(rw.id.split('/')[1], p2.x - 40, p2.y + 6);

    ctx.restore();
  }
}

function drawTaxiways() {
  ctx.strokeStyle = '#2a3545';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const tw of LAYOUT.taxiways) {
    ctx.beginPath();
    const first = toScreen(tw.pts[0][0], tw.pts[0][1]);
    ctx.moveTo(first.x, first.y);
    for (let i = 1; i < tw.pts.length; i++) {
      const p = toScreen(tw.pts[i][0], tw.pts[i][1]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  // Taxiway center dashes
  ctx.strokeStyle = 'rgba(255,220,100,0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([8, 12]);
  for (const tw of LAYOUT.taxiways) {
    ctx.beginPath();
    const first = toScreen(tw.pts[0][0], tw.pts[0][1]);
    ctx.moveTo(first.x, first.y);
    for (let i = 1; i < tw.pts.length; i++) {
      const p = toScreen(tw.pts[i][0], tw.pts[i][1]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawTerminal() {
  const t = LAYOUT.terminal;
  const pos = toScreen(t.x, t.y);
  const tw = t.w * W;
  const th = t.h * H;

  // Terminal building
  const termGrad = ctx.createLinearGradient(pos.x, pos.y, pos.x, pos.y + th);
  termGrad.addColorStop(0, '#2a3f5f');
  termGrad.addColorStop(1, '#1a2840');
  ctx.fillStyle = termGrad;
  roundRect(pos.x, pos.y, tw, th, 6);
  ctx.fill();

  // Glass facade
  ctx.fillStyle = 'rgba(120,180,255,0.15)';
  for (let i = 0; i < 12; i++) {
    ctx.fillRect(pos.x + 10 + i * (tw - 20) / 12, pos.y + 8, (tw - 20) / 12 - 4, th - 16);
  }

  // Roof highlight
  ctx.strokeStyle = 'rgba(78,205,196,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  ctx.lineTo(pos.x + tw, pos.y);
  ctx.stroke();

  // Label
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '600 11px Outfit, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TERMINAL A–B', pos.x + tw / 2, pos.y + th / 2 + 4);

  // Control tower
  const tower = toScreen(LAYOUT.tower.x, LAYOUT.tower.y);
  const tr = LAYOUT.tower.r * W;
  ctx.fillStyle = '#1a2840';
  ctx.fillRect(tower.x - tr * 0.3, tower.y, tr * 0.6, tr * 2.5);
  ctx.fillStyle = '#2a4060';
  ctx.beginPath();
  ctx.arc(tower.x, tower.y, tr, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,200,255,0.3)';
  ctx.beginPath();
  ctx.arc(tower.x, tower.y, tr * 0.7, 0, Math.PI * 2);
  ctx.fill();
  // Tower beacon
  const beaconPulse = 0.4 + 0.6 * Math.sin(tick * 0.08);
  ctx.fillStyle = `rgba(255,60,60,${beaconPulse})`;
  ctx.beginPath();
  ctx.arc(tower.x, tower.y - tr * 0.5, 3, 0, Math.PI * 2);
  ctx.fill();

  // Hangars
  for (const h of LAYOUT.hangars) {
    const hp = toScreen(h.x, h.y);
    const hw = h.w * W;
    const hh = h.h * H;
    ctx.fillStyle = '#1e2838';
    roundRect(hp.x, hp.y, hw, hh, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(hp.x + 4, hp.y + 4, hw - 8, hh * 0.4);
  }
}

function drawGates() {
  for (const g of LAYOUT.gates) {
    const p = toScreen(g.x, g.y);
    const occupied = g.occupied;

    // Gate marker
    ctx.strokeStyle = occupied ? 'rgba(244,201,93,0.6)' : 'rgba(78,205,196,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Gate label
    ctx.fillStyle = occupied ? 'rgba(244,201,93,0.8)' : 'rgba(255,255,255,0.35)';
    ctx.font = '600 9px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(g.id, p.x, p.y + 28);

    // Jet bridge
    const termY = toScreen(LAYOUT.terminal.x + LAYOUT.terminal.w * 0.5, LAYOUT.terminal.y + LAYOUT.terminal.h).y;
    ctx.strokeStyle = occupied ? 'rgba(244,201,93,0.25)' : 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 10);
    ctx.lineTo(p.x, termY + 20);
    ctx.stroke();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawPlane(p) {
  if (p.status === STATUSES.DEPARTED) return;

  const pos = toScreen(p.x, p.y);
  const size = p.size * W;
  const altScale = 1 + (p.alt / 800) * 0.5;
  const s = size * altScale;

  // Shadow
  if (p.alt > 0) {
    ctx.globalAlpha = clamp(0.4 - p.alt / 2000, 0.05, 0.35);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y + p.alt * 0.08, s * 1.8, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Contrail for high altitude
  if (p.alt > 100 && p.trail.length > 2) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < p.trail.length; i++) {
      const tp = toScreen(p.trail[i].x, p.trail[i].y);
      if (i === 0) ctx.moveTo(tp.x, tp.y);
      else ctx.lineTo(tp.x, tp.y);
    }
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(pos.x, pos.y - p.alt * 0.06);
  ctx.rotate(p.angle * Math.PI / 180);
  ctx.scale(s / 30, s / 30);

  // Fuselage
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail
  ctx.fillStyle = p.tailColor;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.lineTo(-24, -8);
  ctx.lineTo(-22, 0);
  ctx.lineTo(-24, 2);
  ctx.closePath();
  ctx.fill();

  // Wings
  ctx.fillStyle = p.color;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(-2, 0);
  ctx.lineTo(4, -14);
  ctx.lineTo(8, -14);
  ctx.lineTo(6, 0);
  ctx.lineTo(8, 14);
  ctx.lineTo(4, 14);
  ctx.closePath();
  ctx.fill();

  // Engines
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(2, -10, 3, 1.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(2, 10, 3, 1.8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Cockpit
  ctx.fillStyle = 'rgba(120,200,255,0.6)';
  ctx.beginPath();
  ctx.ellipse(18, 0, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Nav lights
  const blink = Math.sin(tick * 0.1 + p.x * 100) > 0;
  if (blink) {
    ctx.fillStyle = '#ff3333';
    ctx.beginPath();
    ctx.arc(-20, -3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#33ff33';
    ctx.beginPath();
    ctx.arc(-20, 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Landing lights when low
  if (p.alt < 80 && p.alt > 0) {
    ctx.globalAlpha = 0.3;
    const lg = ctx.createLinearGradient(20, 0, 60, 0);
    lg.addColorStop(0, 'rgba(255,255,200,0.8)');
    lg.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(20, -2);
    ctx.lineTo(70, -15);
    ctx.lineTo(70, 15);
    ctx.lineTo(20, 2);
    ctx.closePath();
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  // Flight code label
  if (p.alt < 200) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '600 9px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.code, pos.x, pos.y - s - 8 - p.alt * 0.06);
  }
}

function drawVehicle(v) {
  if (!v.active) return;
  const p = toScreen(v.x, v.y);
  const blink = Math.sin(v.blink) > 0;

  ctx.save();
  ctx.translate(p.x, p.y);

  if (v.type === 'fuel') {
    ctx.fillStyle = '#2a6030';
    ctx.fillRect(-8, -5, 16, 10);
    ctx.fillStyle = blink ? '#ffcc00' : '#cc9900';
    ctx.fillRect(-6, -3, 8, 6);
  } else if (v.type === 'baggage') {
    ctx.fillStyle = '#ff8c42';
    ctx.fillRect(-10, -4, 14, 8);
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.arc(6, 0, 3, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#556';
    ctx.fillRect(-6, -4, 12, 8);
    ctx.fillStyle = '#889';
    ctx.fillRect(-4, -6, 8, 3);
  }

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    if (p.type === 'exhaust') {
      ctx.fillStyle = 'rgba(180,190,200,0.6)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'spark') {
      ctx.fillStyle = '#ffcc66';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(200,200,200,0.4)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawApproachLines() {
  for (const p of planes) {
    if (p.status !== STATUSES.APPROACH && p.status !== STATUSES.LANDING) continue;
    const pos = toScreen(p.x, p.y);
    ctx.strokeStyle = 'rgba(78,205,196,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineTo(pos.x - 120, pos.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Glide slope indicator
    ctx.fillStyle = 'rgba(78,205,196,0.5)';
    ctx.font = '8px JetBrains Mono';
    ctx.textAlign = 'left';
    ctx.fillText(`ALT ${Math.round(p.alt)}ft`, pos.x - 115, pos.y - 8);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawBackground(tick);
  drawRunways();
  drawTaxiways();
  drawTerminal();
  drawGates();
  drawApproachLines();

  for (const v of vehicles) drawVehicle(v);
  for (const p of planes) drawPlane(p);
  drawParticles();

  // Ambient runway glow at night
  const hour = (simTime / 3600) % 24;
  if (hour < 6 || hour > 19) {
    ctx.globalAlpha = 0.06;
    for (const rw of LAYOUT.runways) {
      const p1 = toScreen(rw.x1, rw.y1);
      const p2 = toScreen(rw.x2, rw.y2);
      const lg = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(0.5, 'rgba(255,255,200,0.8)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = rw.width * H;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

// ── HUD updates ──
function formatTime(seconds) {
  const h = Math.floor(seconds / 3600) % 24;
  const m = Math.floor((seconds % 3600) / 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function statusLabel(s) {
  const map = {
    [STATUSES.QUEUE]: ['Queued', 'queue'],
    [STATUSES.APPROACH]: ['On Approach', 'approach'],
    [STATUSES.LANDING]: ['Landing', 'approach'],
    [STATUSES.TAXI_IN]: ['Taxi In', 'taxi'],
    [STATUSES.AT_GATE]: ['At Gate', 'gate'],
    [STATUSES.BOARDING]: ['Boarding', 'board'],
    [STATUSES.PUSHBACK]: ['Pushback', 'board'],
    [STATUSES.TAXI_OUT]: ['Taxi Out', 'taxi'],
    [STATUSES.TAKEOFF]: ['Takeoff', 'takeoff'],
    [STATUSES.DEPARTED]: ['Departed', 'queue']
  };
  return map[s] || ['Unknown', 'queue'];
}

function updateHUD() {
  document.getElementById('clock').textContent = formatTime(simTime);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const d = new Date(2026, 7, 23);
  document.getElementById('date').textContent = `${days[d.getDay()]} · Aug 23`;

  const active = planes.filter(p => p.status !== STATUSES.DEPARTED).length;
  const gatesUsed = LAYOUT.gates.filter(g => g.occupied).length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-landed').textContent = landedToday;
  document.getElementById('stat-departed').textContent = departedToday;
  document.getElementById('stat-gates').textContent = `${gatesUsed}/8`;

  const hour = (simTime / 3600) % 24;
  const weatherIcon = document.getElementById('weather-icon');
  const weatherText = document.getElementById('weather-text');
  if (hour >= 6 && hour < 18) {
    weatherIcon.textContent = '☀️';
    weatherText.textContent = 'Clear · 12 kt NW · Vis 10+ mi';
  } else if (hour >= 18 && hour < 21) {
    weatherIcon.textContent = '🌅';
    weatherText.textContent = 'Clear · 18 kt NW · Vis 10+ mi';
  } else {
    weatherIcon.textContent = '🌙';
    weatherText.textContent = 'Clear · 8 kt NW · Vis 10+ mi';
  }

  // Runway status
  const rsEl = document.getElementById('runway-status');
  rsEl.innerHTML = runwayState.map(rw => {
    const cls = rw.occupied ? 'occupied' : 'active';
    const txt = rw.occupied ? 'Occupied' : 'Active';
    return `<div class="runway-item"><span>RWY ${rw.id}</span><span style="display:flex;align-items:center;gap:6px"><span>${txt}</span><div class="runway-indicator ${cls}"></div></span></div>`;
  }).join('');

  // Flight board
  const board = document.getElementById('flight-board');
  const sorted = [...planes].filter(p => p.status !== STATUSES.DEPARTED)
    .sort((a, b) => {
      const order = [STATUSES.LANDING, STATUSES.APPROACH, STATUSES.TAKEOFF, STATUSES.TAXI_OUT, STATUSES.TAXI_IN, STATUSES.PUSHBACK, STATUSES.BOARDING, STATUSES.AT_GATE, STATUSES.QUEUE];
      return order.indexOf(a.status) - order.indexOf(b.status);
    });

  board.innerHTML = sorted.map(p => {
    const [label, cls] = statusLabel(p.status);
    const type = p.isArrival ? 'arrival' : 'departure';
    const active = [STATUSES.LANDING, STATUSES.TAKEOFF, STATUSES.APPROACH].includes(p.status) ? ' active' : '';
    const route = p.isArrival ? `${p.origin} → SLH` : `SLH → ${p.dest}`;
    const gateStr = p.gate ? ` · ${p.gate.id}` : '';
    return `<div class="flight-row ${type}${active}"><div class="flight-code">${p.code}</div><div><div>${route}</div><div class="flight-route">${p.cityName}${gateStr}</div></div><div class="flight-status status-${cls}">${label}</div></div>`;
  }).join('');
}

// ── Speed controls ──
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    simSpeed = parseFloat(btn.dataset.speed);
  });
});

// ── Main loop ──
let lastTime = performance.now();
let hudTimer = 0;

function loop(now) {
  const rawDt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;
  const dt = rawDt;

  tick++;
  simTime += dt * 0.5 * simSpeed;
  hudTimer += dt;

  trySpawnFlight();

  for (const p of planes) updatePlane(p, dt);
  updateVehicles(dt);
  updateParticles(dt);

  // Clean departed
  for (let i = planes.length - 1; i >= 0; i--) {
    if (planes[i].status === STATUSES.DEPARTED && planes[i].x > 1.2) {
      planes.splice(i, 1);
    }
  }

  render();

  if (hudTimer > 8) {
    updateHUD();
    hudTimer = 0;
  }

  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);

})();
</script>
