<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #12151c;
      --accent: #5eead4;
      --accent-dim: #2dd4bf66;
      --text: #e2e8f0;
      --muted: #64748b;
      --glow: #5eead433;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 30%, #0a0c10cc 100%);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.04;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        #fff 2px,
        #fff 3px
      );
    }

    main {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 3rem;
    }

    .logo-ring {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .logo-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .logo-ring .track {
      fill: none;
      stroke: #1e293b;
      stroke-width: 3;
    }

    .logo-ring .arc {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      filter: drop-shadow(0 0 8px var(--accent));
      transition: stroke-dashoffset 0.15s ease-out;
    }

    .logo-core {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-core .diamond {
      width: 28px;
      height: 28px;
      background: var(--accent);
      transform: rotate(45deg);
      box-shadow: 0 0 24px var(--glow), 0 0 48px var(--accent-dim);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: rotate(45deg) scale(1); }
      50% { opacity: 0.7; transform: rotate(45deg) scale(0.92); }
    }

    .content {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .status {
      font-size: 1.125rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      min-height: 1.6em;
      transition: opacity 0.4s ease;
    }

    .status.fade { opacity: 0; }

    .progress-wrap {
      margin-top: 2rem;
    }

    .progress-bar {
      height: 2px;
      background: #1e293b;
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent), var(--accent-dim));
      background-size: 200% 100%;
      animation: shimmer 1.8s linear infinite;
      border-radius: 1px;
      box-shadow: 0 0 12px var(--glow);
      transition: width 0.12s ease-out;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .steps {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.35;
      transition: opacity 0.5s ease, color 0.5s ease;
    }

    .step.active {
      opacity: 1;
      color: var(--text);
    }

    .step.done {
      opacity: 0.55;
      color: var(--accent);
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .step.active .step-dot {
      box-shadow: 0 0 8px var(--accent);
      animation: dot-pulse 1s ease-in-out infinite;
    }

    .step.done .step-dot {
      background: var(--accent);
    }

    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); }
    }

    .complete-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .complete-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .complete-msg {
      text-align: center;
      transform: translateY(12px);
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    }

    .complete-overlay.visible .complete-msg {
      transform: translateY(0);
      opacity: 1;
    }

    .complete-msg h2 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 30px var(--glow);
    }

    .complete-msg p {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <main>
    <div class="logo-ring" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="45"/>
        <circle class="arc" id="arc" cx="50" cy="50" r="45"/>
      </svg>
      <div class="logo-core"><div class="diamond"></div></div>
    </div>

    <div class="content">
      <h1>Initializing</h1>
      <p class="status" id="status">Preparing environment…</p>

      <div class="progress-wrap">
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar">
          <div class="progress-fill" id="progress"></div>
        </div>
        <div class="progress-meta">
          <span id="phase">Phase 1 / 5</span>
          <span id="percent">0%</span>
        </div>
      </div>

      <div class="steps" id="steps"></div>
    </div>
  </main>

  <div class="complete-overlay" id="complete">
    <div class="complete-msg">
      <h2>Ready</h2>
      <p>All systems online</p>
    </div>
  </div>

  <script>
    (function () {
      const CIRC = 2 * Math.PI * 45;

      const phases = [
        { label: 'Allocating memory pools', duration: 900, weight: 12 },
        { label: 'Loading core modules', duration: 1100, weight: 22 },
        { label: 'Compiling shaders', duration: 1400, weight: 28 },
        { label: 'Syncing data streams', duration: 800, weight: 18 },
        { label: 'Finalizing handshake', duration: 700, weight: 20 },
      ];

      const stepsEl = document.getElementById('steps');
      const statusEl = document.getElementById('status');
      const progressEl = document.getElementById('progress');
      const progressBar = document.getElementById('progressbar');
      const percentEl = document.getElementById('percent');
      const phaseEl = document.getElementById('phase');
      const arcEl = document.getElementById('arc');
      const completeEl = document.getElementById('complete');

      arcEl.style.strokeDasharray = CIRC;

      phases.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'step' + (i === 0 ? ' active' : '');
        div.innerHTML = '<span class="step-dot"></span><span>' + p.label + '</span>';
        div.dataset.index = i;
        stepsEl.appendChild(div);
      });

      const stepEls = stepsEl.querySelectorAll('.step');

      function setStatus(text) {
        statusEl.classList.add('fade');
        setTimeout(() => {
          statusEl.textContent = text;
          statusEl.classList.remove('fade');
        }, 200);
      }

      function updateUI(pct, phaseIdx) {
        const clamped = Math.min(100, Math.max(0, pct));
        progressEl.style.width = clamped + '%';
        progressBar.setAttribute('aria-valuenow', Math.round(clamped));
        percentEl.textContent = Math.round(clamped) + '%';
        phaseEl.textContent = 'Phase ' + (phaseIdx + 1) + ' / ' + phases.length;
        arcEl.style.strokeDashoffset = CIRC - (CIRC * clamped / 100);

        stepEls.forEach((el, i) => {
          el.classList.remove('active', 'done');
          if (i < phaseIdx) el.classList.add('done');
          else if (i === phaseIdx) el.classList.add('active');
        });
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function runPhase(phaseIdx, startPct) {
        return new Promise(resolve => {
          const phase = phases[phaseIdx];
          const endPct = startPct + phase.weight;
          setStatus(phase.label);
          updateUI(startPct, phaseIdx);

          const t0 = performance.now();

          function tick(now) {
            const raw = Math.min(1, (now - t0) / phase.duration);
            const eased = easeOutCubic(raw);
            const pct = startPct + phase.weight * eased;
            updateUI(pct, phaseIdx);

            if (raw < 1) {
              requestAnimationFrame(tick);
            } else {
              stepEls[phaseIdx].classList.remove('active');
              stepEls[phaseIdx].classList.add('done');
              resolve(endPct);
            }
          }

          requestAnimationFrame(tick);
        });
      }

      async function runLoader() {
        let pct = 0;
        for (let i = 0; i < phases.length; i++) {
          pct = await runPhase(i, pct);
        }

        updateUI(100, phases.length - 1);
        stepEls.forEach(el => { el.classList.remove('active'); el.classList.add('done'); });
        setStatus('Complete');

        await new Promise(r => setTimeout(r, 600));
        completeEl.classList.add('visible');
      }

      /* Ambient particle field */
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');
      let W, H, particles;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        initParticles();
      }

      function initParticles() {
        const count = Math.floor((W * H) / 14000);
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.2 + 0.3,
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15,
            a: Math.random() * 0.3 + 0.05,
          });
        }
      }

      function drawBg() {
        ctx.fillStyle = '#0a0c10';
        ctx.fillRect(0, 0, W, H);

        /* subtle grid */
        ctx.strokeStyle = '#1e293b22';
        ctx.lineWidth = 1;
        const grid = 48;
        for (let x = 0; x < W; x += grid) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += grid) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        /* particles */
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(94, 234, 212, ' + p.a + ')';
          ctx.fill();
        }

        /* connect nearby */
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 90) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = 'rgba(94, 234, 212, ' + (0.06 * (1 - dist / 90)) + ')';
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(drawBg);
      }

      window.addEventListener('resize', resize);
      resize();
      drawBg();
      runLoader();
    })();
  </script>
</body>
</html>
