{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Constants ───────────────────────────────────────────────────────────────
const CELL = 4;
const WALL_H = 3.2;
const CHUNK = 11;
const HALF = Math.floor(CHUNK / 2);
const EYE = 1.65;
const SEED = 847291;

// ─── Biomes ──────────────────────────────────────────────────────────────────
const BIOMES = [
  {
    name: 'Cathedral Vault',
    reveal: 'Sanctuary of Stone',
    wall: 0x3a3530, floor: 0x1a1815, ceil: 0x0e0d0c,
    accent: 0xc9a86c, fog: 0x0a0908, fogD: 28,
    light: 0xffd4a0, amb: 0x201810, bloom: 0.35,
    arch: true, pillars: true, glow: false, particles: 'dust'
  },
  {
    name: 'Neon Underpass',
    reveal: 'Electric Horizon',
    wall: 0x12141a, floor: 0x08090e, ceil: 0x050608,
    accent: 0x00e5ff, fog: 0x020408, fogD: 22,
    light: 0x00ccff, amb: 0x080818, bloom: 0.85,
    arch: false, pillars: false, glow: true, particles: 'rain'
  },
  {
    name: 'Crystal Cavern',
    reveal: 'Frozen Light',
    wall: 0x1a2535, floor: 0x0c1520, ceil: 0x060a12,
    accent: 0x88ccff, fog: 0x040810, fogD: 32,
    light: 0xaaddff, amb: 0x101828, bloom: 0.6,
    arch: false, pillars: true, glow: true, particles: 'sparkle'
  },
  {
    name: 'Ember Gallery',
    reveal: 'Warmth Below',
    wall: 0x2a1810, floor: 0x120a06, ceil: 0x080404,
    accent: 0xff6622, fog: 0x100604, fogD: 26,
    light: 0xff8844, amb: 0x180808, bloom: 0.5,
    arch: true, pillars: false, glow: true, particles: 'ember'
  },
  {
    name: 'Verdant Cloister',
    reveal: 'Garden of Echoes',
    wall: 0x1a2820, floor: 0x0c1810, ceil: 0x061008,
    accent: 0x66cc88, fog: 0x040c08, fogD: 30,
    light: 0x88ffaa, amb: 0x081810, bloom: 0.4,
    arch: true, pillars: true, glow: false, particles: 'pollen'
  },
  {
    name: 'Obsidian Spire',
    reveal: 'Depth Without End',
    wall: 0x0a0a12, floor: 0x040408, ceil: 0x020204,
    accent: 0x8866ff, fog: 0x020208, fogD: 20,
    light: 0x9988ff, amb: 0x080818, bloom: 0.7,
    arch: false, pillars: true, glow: true, particles: 'void'
  }
];

// ─── Seeded RNG ──────────────────────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hash2(x, y) {
  let h = SEED ^ (x * 374761393) ^ (y * 668265263);
  h = (h ^ (h >>> 13)) * 1274126177;
  return (h ^ (h >>> 16)) >>> 0;
}

// ─── Maze world ──────────────────────────────────────────────────────────────
class MazeWorld {
  constructor() {
    this.chunks = new Map();
    this.globalCells = new Map();
    this.visited = new Set();
    this.pathHistory = [];
    this.cellCount = 0;
    this.currentBiome = 0;
    this.biomeCellStart = 0;
    this.landmarks = [];
    this.pendingLandmarks = [];
  }

  key(cx, cy) { return cx + ',' + cy; }
  gkey(gx, gy) { return gx + ',' + gy; }

  generateChunk(cx, cy) {
    const k = this.key(cx, cy);
    if (this.chunks.has(k)) return this.chunks.get(k);
    const rng = mulberry32(hash2(cx, cy));
    const grid = Array.from({ length: CHUNK }, () => Array(CHUNK).fill(1));
    const stack = [[1, 1]];
    grid[1][1] = 0;
    const dirs = [[0, -2], [2, 0], [0, 2], [-2, 0]];

    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const neighbors = dirs.filter(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        return nx > 0 && nx < CHUNK - 1 && ny > 0 && ny < CHUNK - 1 && grid[ny][nx] === 1;
      }).sort(() => rng() - 0.5);

      if (!neighbors.length) { stack.pop(); continue; }
      const [dx, dy] = neighbors[0];
      grid[y + dy / 2][x + dx / 2] = 0;
      grid[y + dy][x + dx] = 0;
      stack.push([x + dx, y + dy]);
    }

    // Connect to adjacent chunks
    if (cx > 0) {
      const left = this.chunks.get(this.key(cx - 1, cy));
      if (left) {
        for (let y = 1; y < CHUNK - 1; y += 2) {
          if (left.grid[y][CHUNK - 2] === 0) { grid[y][0] = 0; grid[y][1] = 0; }
        }
      }
    }
    if (cy > 0) {
      const up = this.chunks.get(this.key(cx, cy - 1));
      if (up) {
        for (let x = 1; x < CHUNK - 1; x += 2) {
          if (up.grid[CHUNK - 2][x] === 0) { grid[0][x] = 0; grid[1][x] = 0; }
        }
      }
    }

    const chunk = { cx, cy, grid };
    this.chunks.set(k, chunk);

    for (let y = 0; y < CHUNK; y++) {
      for (let x = 0; x < CHUNK; x++) {
        const gx = cx * (CHUNK - 2) + x - 1;
        const gy = cy * (CHUNK - 2) + y - 1;
        this.globalCells.set(this.gkey(gx, gy), grid[y][x] === 0 ? 0 : 1);
      }
    }
    return chunk;
  }

  isOpen(gx, gy) {
    const v = this.globalCells.get(this.gkey(gx, gy));
    return v === 0;
  }

  getNeighbors(gx, gy) {
    const n = [];
    if (this.isOpen(gx, gy - 1)) n.push([gx, gy - 1]);
    if (this.isOpen(gx + 1, gy)) n.push([gx + 1, gy]);
    if (this.isOpen(gx, gy + 1)) n.push([gx, gy + 1]);
    if (this.isOpen(gx - 1, gy)) n.push([gx - 1, gy]);
    return n;
  }

  ensureAround(gx, gy, radius = 3) {
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const wx = gx + dx, wy = gy + dy;
        const cx = Math.floor((wx + 1) / (CHUNK - 2));
        const cy = Math.floor((wy + 1) / (CHUNK - 2));
        for (let cy2 = cy - 1; cy2 <= cy + 1; cy2++) {
          for (let cx2 = cx - 1; cx2 <= cx + 1; cx2++) {
            this.generateChunk(cx2, cy2);
          }
        }
      }
    }
  }

  bfs(from, goalSet) {
    const q = [from];
    const prev = new Map();
    prev.set(this.gkey(...from), null);
    const goalKeys = new Set([...goalSet].map(g => this.gkey(...g)));
    while (q.length) {
      const [x, y] = q.shift();
      if (goalKeys.has(this.gkey(x, y))) {
        const path = [];
        let cur = [x, y];
        while (cur) { path.unshift(cur); cur = prev.get(this.gkey(...cur)); }
        return path;
      }
      for (const [nx, ny] of this.getNeighbors(x, y)) {
        const nk = this.gkey(nx, ny);
        if (!prev.has(nk)) { prev.set(nk, [x, y]); q.push([nx, ny]); }
      }
    }
    return null;
  }

  chooseNext(current, prev) {
    this.ensureAround(current[0], current[1], 4);
    const neighbors = this.getNeighbors(current[0], current[1]);
    const unvisited = neighbors.filter(n => !this.visited.has(this.gkey(...n)));
    const pk = prev ? this.gkey(...prev) : null;

    if (unvisited.length) {
      const rng = mulberry32(hash2(current[0], current[1]) ^ this.cellCount);
      unvisited.sort((a, b) => {
        const scoreA = this.exploreScore(a, pk, rng);
        const scoreB = this.exploreScore(b, pk, rng);
        return scoreB - scoreA;
      });
      const target = unvisited[0];
      return this.bfs(current, [target]) || [current, target];
    }

    // Dead end — backtrack via BFS to nearest unvisited
    const targets = [];
    for (const [k] of this.globalCells) {
      if (this.globalCells.get(k) === 0 && !this.visited.has(k)) {
        const [gx, gy] = k.split(',').map(Number);
        targets.push([gx, gy]);
        if (targets.length > 20) break;
      }
    }
    if (targets.length) {
      const rng = mulberry32(this.cellCount);
      const goal = targets[Math.floor(rng() * Math.min(targets.length, 8))];
      return this.bfs(current, [goal]);
    }
    const alt = neighbors.filter(n => this.gkey(...n) !== pk);
    if (alt.length) return [current, alt[0]];
    return [current];
  }

  exploreScore(cell, prevKey, rng) {
    let score = rng() * 2;
    const n = this.getNeighbors(cell[0], cell[1]).length;
    if (n >= 3) score += 3;
    if (n === 1) score -= 1;
    if (prevKey && this.gkey(...cell) === prevKey) score -= 10;
    const openAround = this.countOpenRadius(cell[0], cell[1], 3);
    score += openAround * 0.3;
    return score;
  }

  countOpenRadius(gx, gy, r) {
    let c = 0;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (this.isOpen(gx + dx, gy + dy)) c++;
      }
    }
    return c;
  }

  getBiome() {
    return BIOMES[this.currentBiome % BIOMES.length];
  }

  maybeAdvanceBiome() {
    const cellsInBiome = this.cellCount - this.biomeCellStart;
    if (cellsInBiome >= 45 + (this.currentBiome * 7)) {
      this.currentBiome++;
      this.biomeCellStart = this.cellCount;
      return true;
    }
    return false;
  }
}

// ─── Scene builder ───────────────────────────────────────────────────────────
class SceneBuilder {
  constructor(scene) {
    this.scene = scene;
    this.meshes = new Map();
    this.lights = [];
    this.particles = null;
    this.biomeIdx = -1;
    this.materialCache = {};
  }

  disposeChunk(k) {
    const g = this.meshes.get(k);
    if (g) { this.scene.remove(g); g.traverse(c => { if (c.geometry) c.geometry.dispose(); }); this.meshes.delete(k); }
  }

  buildChunk(world, cx, cy, biome) {
    const k = world.key(cx, cy);
    if (this.meshes.has(k)) return;
    const chunk = world.chunks.get(k);
    if (!chunk) return;

    const group = new THREE.Group();
    const rng = mulberry32(hash2(cx, cy) ^ biome.name.length);

    const wallMat = new THREE.MeshStandardMaterial({
      color: biome.wall, roughness: 0.85, metalness: biome.glow ? 0.3 : 0.05
    });
    const floorMat = new THREE.MeshStandardMaterial({
      color: biome.floor, roughness: 0.9, metalness: 0.1
    });
    const ceilMat = new THREE.MeshStandardMaterial({
      color: biome.ceil, roughness: 0.95, metalness: 0.0, side: THREE.BackSide
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: biome.accent, emissive: biome.accent, emissiveIntensity: biome.glow ? 1.2 : 0.3,
      roughness: 0.4, metalness: 0.6
    });

    const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
    const floorGeo = new THREE.BoxGeometry(CELL, 0.15, CELL);
    const ceilGeo = new THREE.BoxGeometry(CELL, 0.1, CELL);

    const offsetX = (cx * (CHUNK - 2) - 1) * CELL;
    const offsetZ = (cy * (CHUNK - 2) - 1) * CELL;

    for (let y = 0; y < CHUNK; y++) {
      for (let x = 0; x < CHUNK; x++) {
        const wx = offsetX + x * CELL;
        const wz = offsetZ + y * CELL;

        if (chunk.grid[y][x] === 1) {
          const wall = new THREE.Mesh(wallGeo, wallMat);
          wall.position.set(wx, WALL_H / 2, wz);
          wall.castShadow = true;
          wall.receiveShadow = true;
          group.add(wall);

          if (biome.arch && rng() > 0.7) {
            const arch = new THREE.Mesh(
              new THREE.TorusGeometry(CELL * 0.45, 0.08, 6, 12, Math.PI),
              accentMat
            );
            arch.rotation.x = Math.PI / 2;
            arch.position.set(wx, WALL_H * 0.85, wz);
            group.add(arch);
          }
        } else {
          const floor = new THREE.Mesh(floorGeo, floorMat);
          floor.position.set(wx, 0, wz);
          floor.receiveShadow = true;
          group.add(floor);

          const ceil = new THREE.Mesh(ceilGeo, ceilMat);
          ceil.position.set(wx, WALL_H + 0.5, wz);
          group.add(ceil);

          if (biome.pillars && rng() > 0.92) {
            const pillar = new THREE.Mesh(
              new THREE.CylinderGeometry(0.12, 0.15, WALL_H, 6),
              accentMat
            );
            pillar.position.set(wx, WALL_H / 2, wz);
            group.add(pillar);
          }

          if (biome.glow && rng() > 0.88) {
            const strip = new THREE.Mesh(
              new THREE.BoxGeometry(CELL * 0.8, 0.04, 0.04),
              accentMat
            );
            strip.position.set(wx, 0.05, wz - CELL * 0.4);
            group.add(strip);
          }
        }
      }
    }

    // Landmark in chunk center occasionally
    const gx = cx * (CHUNK - 2) + HALF - 1;
    const gy = cy * (CHUNK - 2) + HALF - 1;
    if (world.isOpen(gx, gy) && rng() > 0.65) {
      this.addLandmark(group, wx = offsetX + HALF * CELL, wz = offsetZ + HALF * CELL, biome, rng);
    }

    this.scene.add(group);
    this.meshes.set(k, group);
  }

  addLandmark(group, wx, wz, biome, rng) {
    const type = Math.floor(rng() * 4);
    const mat = new THREE.MeshStandardMaterial({
      color: biome.accent, emissive: biome.accent, emissiveIntensity: 2,
      roughness: 0.2, metalness: 0.8, transparent: true, opacity: 0.9
    });

    if (type === 0) {
      const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 1), mat);
      orb.position.set(wx, 1.2, wz);
      group.add(orb);
      group.userData.landmark = orb;
    } else if (type === 1) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.03, 8, 32), mat);
      ring.position.set(wx, 2, wz);
      ring.rotation.x = Math.PI / 2;
      group.add(ring);
    } else if (type === 2) {
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.2, 2.5, 8), mat);
      col.position.set(wx, 1.25, wz);
      group.add(col);
      const top = new THREE.Mesh(new THREE.OctahedronGeometry(0.25), mat);
      top.position.set(wx, 2.6, wz);
      group.add(top);
    } else {
      for (let i = 0; i < 5; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), mat);
        const a = (i / 5) * Math.PI * 2;
        p.position.set(wx + Math.cos(a) * 0.5, 0.8 + i * 0.25, wz + Math.sin(a) * 0.5);
        group.add(p);
      }
    }
  }

  setBiome(scene, biome, renderer) {
    if (this.biomeIdx === BIOMES.indexOf(biome)) return;
    this.biomeIdx = BIOMES.indexOf(biome);
    scene.background = new THREE.Color(biome.fog);
    scene.fog = new THREE.FogExp2(biome.fog, 0.012);
    this.clearLights();
    const amb = new THREE.AmbientLight(biome.amb, 0.6);
    scene.add(amb);
    this.lights.push(amb);
    this.setupParticles(biome);
  }

  clearLights() {
    for (const l of this.lights) this.scene.remove(l);
    this.lights = [];
    if (this.particles) { this.scene.remove(this.particles); this.particles.geometry.dispose(); this.particles = null; }
  }

  setupParticles(biome) {
    const count = 400;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 80;
      pos[i * 3 + 1] = Math.random() * WALL_H;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: biome.accent, size: biome.particles === 'sparkle' ? 0.08 : 0.04,
      transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.particles = new THREE.Points(geo, mat);
    this.scene.add(this.particles);
  }

  updateParticles(camera, dt) {
    if (!this.particles) return;
    this.particles.position.x = camera.position.x;
    this.particles.position.z = camera.position.z;
    const arr = this.particles.geometry.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i + 1] += dt * (0.2 + (i % 7) * 0.05);
      if (arr[i + 1] > WALL_H) arr[i + 1] = 0;
    }
    this.particles.geometry.attributes.position.needsUpdate = true;
  }

  addCellLight(scene, x, z, biome) {
    const light = new THREE.PointLight(biome.light, 1.2, CELL * 3.5, 2);
    light.position.set(x * CELL, WALL_H - 0.3, z * CELL);
    scene.add(light);
    this.lights.push(light);
    if (this.lights.length > 40) {
      const old = this.lights.shift();
      if (old.isAmbientLight === undefined || !old.isAmbientLight) this.scene.remove(old);
    }
  }

  prune(world, cx, cy) {
    for (const [k] of this.meshes) {
      const [pcx, pcy] = k.split(',').map(Number);
      if (Math.abs(pcx - cx) > 2 || Math.abs(pcy - cy) > 2) this.disposeChunk(k);
    }
  }
}

// ─── Navigator ───────────────────────────────────────────────────────────────
class Navigator {
  constructor(world) {
    this.world = world;
    this.gridPos = [0, 0];
    this.prevGrid = null;
    this.waypoints = [];
    this.wpIndex = 0;
    this.progress = 0;
    this.speed = 2.8;
    this.speedTarget = 2.8;
    this.yaw = 0;
    this.pitch = 0;
    this.targetYaw = 0;
    this.targetPitch = 0;
    this.velocity = new THREE.Vector3();
    this.pos = new THREE.Vector3(0, EYE, 0);
    this.lookAt = new THREE.Vector3(0, EYE, -1);
    this.paused = false;
    this.speedMul = 1;
    this.fovWide = false;
    this.totalDist = 0;
    this.planNext();
  }

  planNext() {
    const path = this.world.chooseNext(this.gridPos, this.prevGrid);
    if (!path || path.length < 2) return;
    this.waypoints = path.slice(1).map(([gx, gy]) => new THREE.Vector3(gx * CELL, EYE, gy * CELL));
    this.wpIndex = 0;
    this.progress = 0;
  }

  worldPos() {
    return this.pos.clone();
  }

  update(dt) {
    if (this.paused) return;

    const effSpeed = this.speed * this.speedMul;
    this.speed += (this.speedTarget * this.speedMul - this.speed) * dt * 2;

    if (this.waypoints.length === 0 || this.wpIndex >= this.waypoints.length) {
      this.planNext();
      return;
    }

    const target = this.waypoints[this.wpIndex];
    const toTarget = new THREE.Vector3().subVectors(target, this.pos);
    const dist = toTarget.length();

    if (dist < 0.05) {
      this.prevGrid = [...this.gridPos];
      this.gridPos = [
        Math.round(target.x / CELL),
        Math.round(target.z / CELL)
      ];
      this.world.visited.add(this.world.gkey(...this.gridPos));
      this.world.cellCount++;
      this.totalDist = this.world.cellCount;
      this.wpIndex++;
      this.progress = 0;

      const advanced = this.world.maybeAdvanceBiome();
      if (advanced) window.dispatchEvent(new CustomEvent('biomeChange'));

      if (this.wpIndex >= this.waypoints.length) this.planNext();
      return;
    }

    toTarget.normalize();
    const move = Math.min(dist, this.speed * dt);
    this.pos.addScaledVector(toTarget, move);
    this.totalDist += move / CELL;
    this.progress += move / CELL;

    // Smooth look direction with anticipation
    const lookAhead = this.wpIndex + 1 < this.waypoints.length
      ? this.waypoints[this.wpIndex + 1] : target;
    const lookDir = new THREE.Vector3().subVectors(lookAhead, this.pos);
    lookDir.y *= 0.3;
    if (lookDir.lengthSq() > 0.001) {
      this.targetYaw = Math.atan2(-lookDir.x, -lookDir.z);
      this.targetPitch = Math.atan2(lookDir.y, Math.sqrt(lookDir.x ** 2 + lookDir.z ** 2)) * 0.15;
    }

    // Smooth yaw wrap
    let dy = this.targetYaw - this.yaw;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    this.yaw += dy * Math.min(1, dt * 3.5);
    this.pitch += (this.targetPitch - this.pitch) * Math.min(1, dt * 2);

    // Subtle head bob
    const bob = Math.sin(this.totalDist * 8) * 0.025;
    this.pos.y = EYE + bob;
  }

  applyToCamera(camera) {
    camera.position.copy(this.pos);
    const lookDist = 6;
    this.lookAt.set(
      this.pos.x - Math.sin(this.yaw) * lookDist,
      this.pos.y + Math.sin(this.pitch) * lookDist * 0.5,
      this.pos.z - Math.cos(this.yaw) * lookDist
    );
    camera.lookAt(this.lookAt);
  }

  getChunkCoords() {
    const gx = this.gridPos[0], gy = this.gridPos[1];
    return [
      Math.floor((gx + 1) / (CHUNK - 2)),
      Math.floor((gy + 1) / (CHUNK - 2))
    ];
  }
}

// ─── Main ────────────────────────────────────────────────────────────────────
const world = new MazeWorld();
world.generateChunk(0, 0);
world.visited.add(world.gkey(0, 0));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const builder = new SceneBuilder(scene);
const nav = new Navigator(world);

let biome = world.getBiome();
builder.setBiome(scene, biome, renderer);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), biome.bloom, 0.5, 0.85);
composer.addPass(bloomPass);

// Initial build
for (let cy = -1; cy <= 1; cy++) {
  for (let cx = -1; cx <= 1; cx++) {
    world.generateChunk(cx, cy);
    builder.buildChunk(world, cx, cy, biome);
  }
}

// UI
const titleCard = document.getElementById('title-card');
const revealText = document.getElementById('reveal-text');
const zoneName = document.getElementById('zone-name');
const distEl = document.getElementById('distance');
const vignettePulse = document.getElementById('vignette-pulse');

setTimeout(() => titleCard.classList.add('hidden'), 3500);

function showReveal(text) {
  revealText.textContent = text;
  revealText.classList.remove('fade');
  revealText.classList.add('show');
  vignettePulse.style.opacity = '0.6';
  setTimeout(() => { revealText.classList.add('fade'); vignettePulse.style.opacity = '0'; }, 3500);
}

window.addEventListener('biomeChange', () => {
  biome = world.getBiome();
  builder.setBiome(scene, biome, renderer);
  bloomPass.strength = biome.bloom;
  zoneName.textContent = biome.name;
  showReveal(biome.reveal);
});

zoneName.textContent = biome.name;

// Optional controls
document.getElementById('btn-pause').onclick = () => {
  nav.paused = !nav.paused;
  document.getElementById('btn-pause').textContent = nav.paused ? 'Resume' : 'Pause';
};
document.getElementById('btn-speed').onclick = () => {
  nav.speedMul = nav.speedMul === 1 ? 1.8 : nav.speedMul === 1.8 ? 0.6 : 1;
  document.getElementById('btn-speed').textContent = nav.speedMul === 1 ? 'Pace' : nav.speedMul > 1 ? 'Swift' : 'Drift';
};
document.getElementById('btn-fov').onclick = () => {
  nav.fovWide = !nav.fovWide;
  camera.fov = nav.fovWide ? 82 : 68;
  camera.updateProjectionMatrix();
  document.getElementById('btn-fov').textContent = nav.fovWide ? 'Wide' : 'Focus';
};

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btn-pause').click(); }
  if (e.code === 'KeyS') document.getElementById('btn-speed').click();
  if (e.code === 'KeyF') document.getElementById('btn-fov').click();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// Animation loop
const clock = new THREE.Clock();
let lastChunk = '';
let lightTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  nav.update(dt);
  nav.applyToCamera(camera);

  const [ccx, ccy] = nav.getChunkCoords();
  const ck = ccx + ',' + ccy;
  if (ck !== lastChunk) {
    lastChunk = ck;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        world.generateChunk(ccx + dx, ccy + dy);
        builder.buildChunk(world, ccx + dx, ccy + dy, biome);
      }
    }
    builder.prune(world, ccx, ccy);
  }

  lightTimer += dt;
  if (lightTimer > 0.4) {
    lightTimer = 0;
    builder.addCellLight(scene, nav.gridPos[0], nav.gridPos[1], biome);
  }

  builder.updateParticles(camera, dt);

  // Animate landmarks
  for (const [, group] of builder.meshes) {
    if (group.userData.landmark) {
      group.userData.landmark.rotation.y += dt * 0.8;
      group.userData.landmark.position.y = 1.2 + Math.sin(clock.elapsedTime * 2) * 0.1;
    }
  }

  distEl.textContent = world.cellCount;

  composer.render();
}

animate();
</script>
</body>
</html>
