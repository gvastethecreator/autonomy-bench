<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Maze</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
    background: radial-gradient(ellipse at center, rgba(12,8,24,0.92) 0%, rgba(2,2,6,0.98) 70%);
    transition: opacity 1.2s ease, visibility 1.2s ease;
    cursor: pointer;
  }
  #overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #overlay h1 {
    font-size: clamp(1.8rem, 5vw, 3.2rem); font-weight: 200; letter-spacing: 0.35em;
    text-transform: uppercase; color: #c8b8ff; text-shadow: 0 0 40px rgba(140,100,255,0.5);
    margin-bottom: 0.5rem;
  }
  #overlay p {
    font-size: 0.85rem; letter-spacing: 0.15em; color: rgba(180,170,220,0.6);
    text-align: center; line-height: 1.8; max-width: 420px; padding: 0 1rem;
  }
  #overlay .pulse {
    margin-top: 2rem; font-size: 0.7rem; letter-spacing: 0.25em;
    color: rgba(200,180,255,0.45); animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    opacity: 0; transition: opacity 1s ease 0.5s;
  }
  #hud.visible { opacity: 1; }
  #compass {
    position: absolute; top: 24px; right: 24px; width: 72px; height: 72px;
    border: 1px solid rgba(180,150,255,0.2); border-radius: 50%;
    background: rgba(8,6,16,0.55); backdrop-filter: blur(6px);
  }
  #compass-needle {
    position: absolute; top: 50%; left: 50%; width: 2px; height: 28px;
    margin: -28px 0 0 -1px; background: linear-gradient(to top, transparent, #a080ff);
    transform-origin: bottom center; transition: transform 0.08s linear;
  }
  #compass-needle::after {
    content: ''; position: absolute; top: 0; left: -3px; width: 8px; height: 8px;
    border-radius: 50%; background: #c8a8ff; box-shadow: 0 0 12px #9060ff;
  }
  #stats {
    position: absolute; bottom: 24px; left: 24px;
    font-size: 0.65rem; letter-spacing: 0.12em; color: rgba(160,140,200,0.45);
    line-height: 1.7;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    opacity: 0; transition: opacity 1.5s ease;
  }
  #vignette.visible { opacity: 1; }
  #mode-badge {
    position: absolute; top: 24px; left: 24px;
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(180,160,240,0.5); padding: 6px 12px;
    border: 1px solid rgba(140,100,255,0.15); border-radius: 2px;
    background: rgba(10,8,18,0.5);
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>Labyrinth</h1>
  <p>An infinite corridor that builds itself ahead of you.<br>
  WASD to move · Mouse to look · Shift to sprint · Space to toggle autopilot</p>
  <div class="pulse">CLICK TO ENTER</div>
</div>
<div id="vignette"></div>
<div id="hud">
  <div id="mode-badge">MANUAL</div>
  <div id="compass"><div id="compass-needle"></div></div>
  <div id="stats">
    <span id="stat-chunks">CHUNKS: 0</span><br>
    <span id="stat-dist">DISTANCE: 0m</span><br>
    <span id="stat-fps">FPS: —</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  const CELL = 4;
  const WALL_H = 3.2;
  const WALL_T = 0.18;
  const CHUNK = 8;
  const VIEW_RADIUS = 3;
  const EYE_H = 1.65;
  const MOVE_SPEED = 4.2;
  const SPRINT_MULT = 1.85;
  const MOUSE_SENS = 0.0022;
  const BOB_FREQ = 9;
  const BOB_AMP = 0.035;

  const palette = {
    floorA: 0x12101a,
    floorB: 0x181420,
    wall: 0x1e1828,
    wallTop: 0x2a2040,
    accent: 0x6040a0,
    glow: 0x8060d0,
    fog: 0x080610,
    light: 0xb090ff
  };

  let scene, camera, renderer, clock;
  let chunks = new Map();
  let chunkGroup;
  let dustPoints, dustGeo;
  let torchLight, ambientLight, hemiLight;
  let keys = {};
  let yaw = 0, pitch = 0;
  let pos = new THREE.Vector3(CELL * 0.5, EYE_H, CELL * 0.5);
  let vel = new THREE.Vector3();
  let bobPhase = 0;
  let pointerLocked = false;
  let started = false;
  let autopilot = false;
  let autopilotTarget = new THREE.Vector3();
  let autopilotTimer = 0;
  let totalDist = 0;
  let lastPos = pos.clone();
  let frameCount = 0, lastFpsTime = 0, fps = 0;

  const overlay = document.getElementById('overlay');
  const hud = document.getElementById('hud');
  const vignette = document.getElementById('vignette');
  const compassNeedle = document.getElementById('compass-needle');
  const modeBadge = document.getElementById('mode-badge');
  const statChunks = document.getElementById('stat-chunks');
  const statDist = document.getElementById('stat-dist');
  const statFps = document.getElementById('stat-fps');

  function hash2(x, y) {
    let h = x * 374761393 + y * 668265263;
    h = (h ^ (h >> 13)) * 1274126177;
    return (h ^ (h >> 16)) >>> 0;
  }

  function seededRand(seed) {
    let s = seed;
    return function() {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function generateMaze(cx, cy) {
    const seed = hash2(cx, cy);
    const rng = seededRand(seed);
    const w = CHUNK, h = CHUNK;
    const grid = [];
    for (let y = 0; y < h * 2 + 1; y++) {
      grid[y] = [];
      for (let x = 0; x < w * 2 + 1; x++) grid[y][x] = 1;
    }
    const visited = [];
    for (let y = 0; y < h; y++) {
      visited[y] = [];
      for (let x = 0; x < w; x++) visited[y][x] = false;
    }
    function carve(x, y) {
      visited[y][x] = true;
      grid[y * 2 + 1][x * 2 + 1] = 0;
      const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
      }
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < w && ny >= 0 && ny < h && !visited[ny][nx]) {
          grid[y * 2 + 1 + dy][x * 2 + 1 + dx] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(0, 0);

    const borderSeed = hash2(cx * 7 + 3, cy * 11 + 5);
    const borderRng = seededRand(borderSeed);
    if (borderRng() > 0.3) {
      const edge = Math.floor(borderRng() * 4);
      const mid = Math.floor(rng() * w);
      if (edge === 0) grid[1][mid * 2 + 1] = 0;
      else if (edge === 1) grid[mid * 2 + 1][w * 2 - 1] = 0;
      else if (edge === 2) grid[h * 2 - 1][mid * 2 + 1] = 0;
      else grid[mid * 2 + 1][1] = 0;
    }
    return grid;
  }

  function worldCell(gx, gz) {
    const cx = Math.floor(gx / CHUNK);
    const cz = Math.floor(gz / CHUNK);
    const lx = ((gx % CHUNK) + CHUNK) % CHUNK;
    const lz = ((gz % CHUNK) + CHUNK) % CHUNK;
    const key = cx + ',' + cz;
    if (!chunks.has(key)) return 1;
    const grid = chunks.get(key).grid;
    const gx2 = lx * 2 + 1;
    const gz2 = lz * 2 + 1;
    if (gz2 < 0 || gz2 >= grid.length || gx2 < 0 || gx2 >= grid[0].length) return 1;
    return grid[gz2][gx2];
  }

  function isWall(wx, wz) {
    const gx = Math.floor(wx / CELL);
    const gz = Math.floor(wz / CELL);
    const margin = WALL_T + 0.25;
    const fx = wx / CELL - gx;
    const fz = wz / CELL - gz;
    if (worldCell(gx, gz) === 1) return true;
    const neighbors = [[gx+1,gz],[gx-1,gz],[gx,gz+1],[gx,gz-1]];
    for (const [nx, nz] of neighbors) {
      if (worldCell(nx, nz) === 1) {
        if (nx > gx && fx > 1 - margin) return true;
        if (nx < gx && fx < margin) return true;
        if (nz > gz && fz > 1 - margin) return true;
        if (nz < gz && fz < margin) return true;
      }
    }
    return false;
  }

  function makeWallMaterial(seed) {
    const rng = seededRand(seed);
    const base = new THREE.Color(palette.wall);
    base.offsetHSL(0, 0, (rng() - 0.5) * 0.06);
    return new THREE.MeshStandardMaterial({
      color: base,
      roughness: 0.88,
      metalness: 0.08,
      emissive: new THREE.Color(palette.accent),
      emissiveIntensity: 0.02 + rng() * 0.03
    });
  }

  function buildChunk(cx, cz) {
    const key = cx + ',' + cz;
    if (chunks.has(key)) return;
    const grid = generateMaze(cx, cz);
    const group = new THREE.Group();
    group.position.set(cx * CHUNK * CELL, 0, cz * CHUNK * CELL);

    const floorGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL, CHUNK, CHUNK);
    floorGeo.rotateX(-Math.PI / 2);
    const floorMat = new THREE.MeshStandardMaterial({
      color: palette.floorA,
      roughness: 0.75,
      metalness: 0.15
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.receiveShadow = true;
    group.add(floor);

    const ceilGeo = new THREE.PlaneGeometry(CHUNK * CELL, CHUNK * CELL);
    ceilGeo.rotateX(Math.PI / 2);
    ceilGeo.translate(0, WALL_H, 0);
    const ceilMat = new THREE.MeshStandardMaterial({
      color: 0x0a0812,
      roughness: 0.95,
      metalness: 0.05,
      side: THREE.BackSide
    });
    const ceil = new THREE.Mesh(ceilGeo, ceilMat);
    group.add(ceil);

    const wallGeoH = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
    const wallGeoV = new THREE.BoxGeometry(WALL_T, WALL_H, CELL);

    for (let gy = 0; gy < grid.length; gy++) {
      for (let gx = 0; gx < grid[gy].length; gx++) {
        if (grid[gy][gx] !== 1) continue;
        const wx = gx * CELL / 2;
        const wz = gy * CELL / 2;
        const seed = hash2(cx * 100 + gx, cz * 100 + gy);
        const mat = makeWallMaterial(seed);
        const isH = (gx % 2 === 0);
        const geo = isH ? wallGeoH : wallGeoV;
        const wall = new THREE.Mesh(geo, mat);
        wall.position.set(wx, WALL_H / 2, wz);
        wall.castShadow = true;
        wall.receiveShadow = true;
        group.add(wall);

        if (seed % 17 === 0) {
          const stripGeo = new THREE.BoxGeometry(isH ? CELL * 0.8 : WALL_T * 0.5, 0.04, isH ? WALL_T * 0.5 : CELL * 0.8);
          const stripMat = new THREE.MeshStandardMaterial({
            color: palette.glow,
            emissive: palette.glow,
            emissiveIntensity: 0.6,
            roughness: 0.3,
            metalness: 0.5
          });
          const strip = new THREE.Mesh(stripGeo, stripMat);
          strip.position.set(wx, 0.05 + (seed % 5) * 0.6, wz);
          group.add(strip);
        }
      }
    }

    const rng = seededRand(hash2(cx, cz));
    const lightCount = 2 + Math.floor(rng() * 3);
    for (let i = 0; i < lightCount; i++) {
      const lx = (Math.floor(rng() * CHUNK) + 0.5) * CELL;
      const lz = (Math.floor(rng() * CHUNK) + 0.5) * CELL;
      const pl = new THREE.PointLight(palette.light, 0.35, CELL * 3.5, 2);
      pl.position.set(lx, WALL_H - 0.3, lz);
      group.add(pl);
    }

    chunkGroup.add(group);
    chunks.set(key, { grid, group, cx, cz });
  }

  function unloadDistantChunks() {
    const pcx = Math.floor(pos.x / (CHUNK * CELL));
    const pcz = Math.floor(pos.z / (CHUNK * CELL));
    for (const [key, data] of chunks) {
      if (Math.abs(data.cx - pcx) > VIEW_RADIUS + 1 || Math.abs(data.cz - pcz) > VIEW_RADIUS + 1) {
        chunkGroup.remove(data.group);
        data.group.traverse(obj => {
          if (obj.geometry && obj.geometry !== sharedGeos.wallH) obj.geometry.dispose();
          if (obj.material && !Array.isArray(obj.material)) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        chunks.delete(key);
      }
    }
  }

  const sharedGeos = { wallH: null, wallV: null };

  function updateChunks() {
    const pcx = Math.floor(pos.x / (CHUNK * CELL));
    const pcz = Math.floor(pos.z / (CHUNK * CELL));
    for (let dz = -VIEW_RADIUS; dz <= VIEW_RADIUS; dz++) {
      for (let dx = -VIEW_RADIUS; dx <= VIEW_RADIUS; dx++) {
        buildChunk(pcx + dx, pcz + dz);
      }
    }
    unloadDistantChunks();
    statChunks.textContent = 'CHUNKS: ' + chunks.size;
  }

  function findOpenNeighbors(gx, gz) {
    const dirs = [[0,-1,'n'],[1,0,'e'],[0,1,'s'],[-1,0,'w']];
    const open = [];
    for (const [dx, dz, name] of dirs) {
      if (worldCell(gx + dx, gz + dz) === 0) open.push({ gx: gx + dx, gz: gz + dz, dir: name });
    }
    return open;
  }

  function pickAutopilotTarget() {
    const gx = Math.floor(pos.x / CELL);
    const gz = Math.floor(pos.z / CELL);
    const open = findOpenNeighbors(gx, gz);
    if (open.length === 0) {
      autopilotTarget.set((gx + 0.5) * CELL, EYE_H, (gz + 0.5) * CELL);
      return;
    }
    const h = hash2(gx, gz) ^ (Date.now() >> 12);
    const choice = open[h % open.length];
    autopilotTarget.set((choice.gx + 0.5) * CELL, EYE_H, (choice.gz + 0.5) * CELL);
    const dx = autopilotTarget.x - pos.x;
    const dz = autopilotTarget.z - pos.z;
    yaw = Math.atan2(-dx, -dz);
  }

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(palette.fog);
    scene.fog = new THREE.FogExp2(palette.fog, 0.045);

    camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 80);
    camera.position.copy(pos);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    ambientLight = new THREE.AmbientLight(0x302050, 0.35);
    scene.add(ambientLight);

    hemiLight = new THREE.HemisphereLight(0x403080, 0x100810, 0.4);
    scene.add(hemiLight);

    torchLight = new THREE.PointLight(palette.light, 1.2, 14, 2);
    torchLight.castShadow = true;
    torchLight.shadow.mapSize.set(512, 512);
    torchLight.shadow.bias = -0.002;
    scene.add(torchLight);

    chunkGroup = new THREE.Group();
    scene.add(chunkGroup);

    sharedGeos.wallH = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
    sharedGeos.wallV = new THREE.BoxGeometry(WALL_T, WALL_H, CELL);

    const dustCount = 800;
    dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 30;
      dustPos[i * 3 + 1] = Math.random() * WALL_H;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0xc0a0ff,
      size: 0.04,
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    updateChunks();
    pickAutopilotTarget();

    window.addEventListener('resize', onResize);
    document.addEventListener('keydown', e => { keys[e.code] = true; });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    document.addEventListener('mousemove', onMouseMove);
    overlay.addEventListener('click', startExperience);
    renderer.domElement.addEventListener('click', () => {
      if (started && !pointerLocked) renderer.domElement.requestPointerLock();
    });
  }

  function startExperience() {
    if (started) return;
    started = true;
    overlay.classList.add('hidden');
    hud.classList.add('visible');
    vignette.classList.add('visible');
    renderer.domElement.requestPointerLock();
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }

  function onMouseMove(e) {
    if (!pointerLocked || autopilot) return;
    yaw -= e.movementX * MOUSE_SENS;
    pitch -= e.movementY * MOUSE_SENS;
    pitch = Math.max(-0.4, Math.min(0.4, pitch));
  }

  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === renderer.domElement;
  });

  function tryMove(dx, dz) {
    const newX = pos.x + dx;
    const newZ = pos.z + dz;
    if (!isWall(newX, pos.z)) pos.x = newX;
    if (!isWall(pos.x, newZ)) pos.z = newZ;
  }

  function updateMovement(dt) {
    if (keys['Space'] && !keys._spaceHandled) {
      keys._spaceHandled = true;
      autopilot = !autopilot;
      modeBadge.textContent = autopilot ? 'AUTOPILOT' : 'MANUAL';
      if (autopilot) pickAutopilotTarget();
    }
    if (!keys['Space']) keys._spaceHandled = false;

    let speed = MOVE_SPEED * (keys['ShiftLeft'] || keys['ShiftRight'] ? SPRINT_MULT : 1);

    if (autopilot) {
      autopilotTimer -= dt;
      const dx = autopilotTarget.x - pos.x;
      const dz = autopilotTarget.z - pos.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < 0.3 || autopilotTimer <= 0) {
        pickAutopilotTarget();
        autopilotTimer = 2 + Math.random() * 3;
      }
      const targetYaw = Math.atan2(-dx, -dz);
      let yawDiff = targetYaw - yaw;
      while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
      while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
      yaw += yawDiff * Math.min(1, dt * 3);
      speed *= 0.85;
      const mx = -Math.sin(yaw) * speed * dt;
      const mz = -Math.cos(yaw) * speed * dt;
      tryMove(mx, mz);
    } else if (pointerLocked) {
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const move = new THREE.Vector3();
      if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
      if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
      if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(speed * dt);
        tryMove(move.x, move.z);
        bobPhase += dt * BOB_FREQ * (keys['ShiftLeft'] ? 1.3 : 1);
      }
    }

    totalDist += pos.distanceTo(lastPos);
    lastPos.copy(pos);
    statDist.textContent = 'DISTANCE: ' + Math.floor(totalDist) + 'm';
  }

  function updateCamera() {
    const bob = Math.sin(bobPhase) * BOB_AMP * (vel.length() > 0.1 ? 1 : 0);
    camera.position.set(pos.x, pos.y + bob, pos.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    torchLight.position.set(pos.x, pos.y + 0.1, pos.z);
    torchLight.position.x += Math.sin(yaw) * 0.3;
    torchLight.position.z += Math.cos(yaw) * 0.3;

    dustPoints.position.copy(pos);
    const dustArr = dustGeo.attributes.position.array;
    for (let i = 0; i < dustArr.length; i += 3) {
      dustArr[i + 1] += 0.002;
      if (dustArr[i + 1] > WALL_H) dustArr[i + 1] = 0;
    }
    dustGeo.attributes.position.needsUpdate = true;

    compassNeedle.style.transform = 'rotate(' + (-yaw * 180 / Math.PI) + 'deg)';

    updateChunks();
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (started) {
      updateMovement(dt);
      updateCamera();
    }

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 500) {
      fps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
      frameCount = 0;
      lastFpsTime = now;
      statFps.textContent = 'FPS: ' + fps;
    }

    renderer.render(scene, camera);
  }

  init();
  animate();
})();
</script>
</body>
</html>
