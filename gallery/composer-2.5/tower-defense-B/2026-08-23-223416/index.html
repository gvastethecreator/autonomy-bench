<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironhold — Tower Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    color: #c8d6e5;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  #header {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: linear-gradient(180deg, #141c2b 0%, #0f1520 100%);
    border-bottom: 1px solid #1e2d45;
  }
  #header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #5dade2;
    text-transform: uppercase;
  }
  .stats { display: flex; gap: 20px; font-size: 0.85rem; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-icon { font-size: 1rem; }
  .stat-val { font-weight: 700; color: #fff; min-width: 32px; }
  #game-wrap {
    position: relative;
    margin-top: 8px;
    border: 2px solid #1e2d45;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(93, 173, 226, 0.08);
  }
  canvas { display: block; cursor: crosshair; }
  #sidebar {
    position: absolute;
    right: -170px;
    top: 0;
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tower-btn {
    background: #141c2b;
    border: 2px solid #2c3e5a;
    border-radius: 6px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }
  .tower-btn:hover { border-color: #5dade2; background: #1a2540; }
  .tower-btn.selected { border-color: #f39c12; background: #1f2d1a; box-shadow: 0 0 12px rgba(243,156,18,0.3); }
  .tower-btn.disabled { opacity: 0.4; pointer-events: none; }
  .tower-btn .name { font-weight: 700; font-size: 0.8rem; color: #fff; }
  .tower-btn .cost { font-size: 0.75rem; color: #f1c40f; margin-top: 2px; }
  .tower-btn .desc { font-size: 0.65rem; color: #7f8c9b; margin-top: 3px; line-height: 1.3; }
  .tower-color {
    width: 14px; height: 14px; border-radius: 50%;
    display: inline-block; vertical-align: middle; margin-right: 4px;
  }
  #controls {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    gap: 12px;
  }
  button.action {
    background: linear-gradient(180deg, #2980b9, #1a5276);
    border: none;
    color: #fff;
    padding: 8px 20px;
    border-radius: 4px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: filter 0.15s;
  }
  button.action:hover { filter: brightness(1.15); }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  button.danger { background: linear-gradient(180deg, #c0392b, #922b21); }
  #wave-info { font-size: 0.85rem; color: #7f8c9b; }
  #wave-info span { color: #5dade2; font-weight: 700; }
  #tooltip {
    position: absolute;
    background: rgba(10,14,23,0.92);
    border: 1px solid #2c3e5a;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.75rem;
    pointer-events: none;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(5,8,15,0.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    font-size: 2.2rem; color: #5dade2;
    margin-bottom: 12px; letter-spacing: 0.1em;
  }
  #overlay p { color: #7f8c9b; margin-bottom: 24px; font-size: 0.95rem; max-width: 400px; text-align: center; line-height: 1.6; }
  #overlay .big-btn {
    background: linear-gradient(180deg, #2980b9, #1a5276);
    border: none; color: #fff;
    padding: 14px 40px; border-radius: 6px;
    font-size: 1rem; font-weight: 700;
    cursor: pointer; letter-spacing: 0.06em;
  }
  #overlay .big-btn:hover { filter: brightness(1.15); }
  .upgrade-panel {
    position: absolute;
    background: rgba(10,14,23,0.95);
    border: 1px solid #2c3e5a;
    border-radius: 6px;
    padding: 10px;
    display: none;
    z-index: 20;
    min-width: 140px;
  }
  .upgrade-panel.visible { display: block; }
  .upgrade-panel h4 { font-size: 0.75rem; color: #5dade2; margin-bottom: 6px; }
  .upgrade-panel button {
    display: block; width: 100%;
    background: #1a2540; border: 1px solid #2c3e5a;
    color: #c8d6e5; padding: 5px 8px; border-radius: 3px;
    font-size: 0.7rem; cursor: pointer; margin-top: 4px;
  }
  .upgrade-panel button:hover { border-color: #5dade2; }
  .upgrade-panel .sell { color: #e74c3c; margin-top: 8px; }
</style>
</head>
<body>

<div id="header">
  <h1>⚔ Ironhold</h1>
  <div class="stats">
    <div class="stat"><span class="stat-icon">❤</span> <span class="stat-val" id="lives">20</span></div>
    <div class="stat"><span class="stat-icon">🪙</span> <span class="stat-val" id="gold">150</span></div>
    <div class="stat"><span class="stat-icon">🌊</span> <span class="stat-val" id="wave-num">0</span></div>
    <div class="stat"><span class="stat-icon">⭐</span> <span class="stat-val" id="score">0</span></div>
  </div>
</div>

<div id="game-wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="sidebar"></div>
  <div id="tooltip"></div>
  <div class="upgrade-panel" id="upgrade-panel">
    <h4 id="upg-title">Tower</h4>
    <button id="upg-btn">Upgrade (50g)</button>
    <button class="sell" id="sell-btn">Sell (25g)</button>
  </div>
</div>

<div id="controls">
  <div id="wave-info">Wave <span id="wave-label">—</span> · Enemies remaining: <span id="enemies-left">0</span></div>
  <div>
    <button class="action" id="start-wave">Start Wave</button>
    <button class="action danger" id="speed-btn">Speed ×1</button>
  </div>
</div>

<div id="overlay">
  <h2 id="overlay-title">IRONHOLD</h2>
  <p id="overlay-msg">Defend the citadel! Place towers along the path, upgrade them, and survive 15 waves of invaders.</p>
  <button class="big-btn" id="overlay-btn">Begin Defense</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CELL = 48;
  const COLS = Math.floor(W / CELL), ROWS = Math.floor(H / CELL);

  const PATH = [
    {x:0,y:4},{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:4,y:4},
    {x:4,y:3},{x:4,y:2},{x:4,y:1},
    {x:5,y:1},{x:6,y:1},{x:7,y:1},{x:8,y:1},{x:9,y:1},{x:10,y:1},{x:11,y:1},{x:12,y:1},{x:13,y:1},{x:14,y:1},{x:15,y:1},{x:16,y:1},{x:17,y:1},{x:18,y:1},{x:19,y:1},
    {x:19,y:2},{x:19,y:3},{x:19,y:4},{x:19,y:5},{x:19,y:6},{x:19,y:7},{x:19,y:8},
    {x:18,y:8},{x:17,y:8},{x:16,y:8},{x:15,y:8},{x:14,y:8},
    {x:14,y:7},{x:14,y:6},{x:14,y:5},
    {x:13,y:5},{x:12,y:5},{x:11,y:5},{x:10,y:5},{x:9,y:5},{x:8,y:5},{x:7,y:5},{x:6,y:5},{x:5,y:5},
    {x:5,y:6},{x:5,y:7},{x:5,y:8},{x:5,y:9},{x:5,y:10},
    {x:6,y:10},{x:7,y:10},{x:8,y:10},{x:9,y:10},{x:10,y:10},{x:11,y:10},
    {x:11,y:9},{x:11,y:8},{x:11,y:7},
    {x:12,y:7},{x:13,y:7},{x:14,y:7},{x:15,y:7},{x:16,y:7},{x:17,y:7},{x:18,y:7},{x:19,y:7}
  ];

  const pathSet = new Set(PATH.map(p => `${p.x},${p.y}`));
  const pathPoints = PATH.map(p => ({ x: p.x * CELL + CELL/2, y: p.y * CELL + CELL/2 }));

  const TOWER_TYPES = {
    arrow: { name: 'Arrow', cost: 50, color: '#2ecc71', range: 120, damage: 12, fireRate: 0.8, projSpeed: 400, desc: 'Fast, cheap' },
    cannon: { name: 'Cannon', cost: 100, color: '#e74c3c', range: 100, damage: 40, fireRate: 1.8, projSpeed: 280, splash: 40, desc: 'Splash damage' },
    frost: { name: 'Frost', cost: 80, color: '#3498db', range: 90, damage: 6, fireRate: 0.6, projSpeed: 350, slow: 0.5, slowDur: 2, desc: 'Slows enemies' },
    sniper: { name: 'Sniper', cost: 150, color: '#9b59b6', range: 220, damage: 80, fireRate: 2.5, projSpeed: 600, desc: 'Long range' }
  };

  const ENEMY_TYPES = {
    grunt: { hp: 40, speed: 60, reward: 8, color: '#c0392b', radius: 12 },
    runner: { hp: 25, speed: 110, reward: 10, color: '#e67e22', radius: 10 },
    tank: { hp: 120, speed: 35, reward: 20, color: '#7f8c8d', radius: 16 },
    boss: { hp: 500, speed: 25, reward: 100, color: '#8e44ad', radius: 22 }
  };

  const WAVES = [
    [{type:'grunt', count:8, interval:0.9}],
    [{type:'grunt', count:12, interval:0.7}],
    [{type:'grunt', count:8, interval:0.8}, {type:'runner', count:4, interval:0.6}],
    [{type:'runner', count:10, interval:0.5}],
    [{type:'grunt', count:6, interval:0.6}, {type:'tank', count:2, interval:1.5}],
    [{type:'runner', count:8, interval:0.4}, {type:'tank', count:3, interval:1.2}],
    [{type:'grunt', count:15, interval:0.5}],
    [{type:'tank', count:5, interval:1.0}, {type:'runner', count:6, interval:0.4}],
    [{type:'runner', count:12, interval:0.35}, {type:'tank', count:4, interval:0.9}],
    [{type:'grunt', count:10, interval:0.4}, {type:'tank', count:6, interval:0.8}],
    [{type:'runner', count:15, interval:0.3}, {type:'tank', count:5, interval:0.7}],
    [{type:'tank', count:10, interval:0.6}],
    [{type:'grunt', count:20, interval:0.3}, {type:'runner', count:10, interval:0.25}, {type:'tank', count:5, interval:0.8}],
    [{type:'tank', count:8, interval:0.5}, {type:'runner', count:12, interval:0.25}],
    [{type:'boss', count:1, interval:0}, {type:'tank', count:6, interval:0.7}, {type:'runner', count:10, interval:0.3}]
  ];

  let state = {
    lives: 20, gold: 150, score: 0, wave: 0,
    towers: [], enemies: [], projectiles: [], particles: [],
    selectedTowerType: null, selectedTower: null,
    waveActive: false, spawnQueue: [], spawnTimer: 0,
    gameOver: false, won: false, paused: true,
    speed: 1, time: 0
  };

  function resetGame() {
    state = {
      lives: 20, gold: 150, score: 0, wave: 0,
      towers: [], enemies: [], projectiles: [], particles: [],
      selectedTowerType: null, selectedTower: null,
      waveActive: false, spawnQueue: [], spawnTimer: 0,
      gameOver: false, won: false, paused: false,
      speed: 1, time: 0
    };
    updateUI();
  }

  function upgradeCost(tower) {
    return Math.floor(TOWER_TYPES[tower.type].cost * 0.7 * tower.level);
  }

  function sellValue(tower) {
    let val = Math.floor(TOWER_TYPES[tower.type].cost * 0.5);
    for (let i = 2; i <= tower.level; i++) val += Math.floor(TOWER_TYPES[tower.type].cost * 0.7 * (i-1) * 0.6);
    return val;
  }

  function buildSidebar() {
    const sb = document.getElementById('sidebar');
    sb.innerHTML = '';
    for (const [key, t] of Object.entries(TOWER_TYPES)) {
      const btn = document.createElement('div');
      btn.className = 'tower-btn';
      btn.dataset.type = key;
      btn.innerHTML = `<div class="name"><span class="tower-color" style="background:${t.color}"></span>${t.name}</div><div class="cost">🪙 ${t.cost}</div><div class="desc">${t.desc}</div>`;
      btn.addEventListener('click', () => {
        if (state.gold < t.cost) return;
        state.selectedTowerType = state.selectedTowerType === key ? null : key;
        state.selectedTower = null;
        hideUpgradePanel();
        document.querySelectorAll('.tower-btn').forEach(b => b.classList.toggle('selected', b.dataset.type === state.selectedTowerType));
      });
      sb.appendChild(btn);
    }
  }

  function updateUI() {
    document.getElementById('lives').textContent = state.lives;
    document.getElementById('gold').textContent = state.gold;
    document.getElementById('wave-num').textContent = state.wave;
    document.getElementById('score').textContent = state.score;
    document.getElementById('wave-label').textContent = state.waveActive ? state.wave : '—';
    document.getElementById('enemies-left').textContent = state.enemies.length + state.spawnQueue.length;
    document.getElementById('start-wave').disabled = state.waveActive || state.wave >= WAVES.length || state.paused;
    document.querySelectorAll('.tower-btn').forEach(b => {
      const t = TOWER_TYPES[b.dataset.type];
      b.classList.toggle('disabled', state.gold < t.cost);
    });
  }

  function startWave() {
    if (state.waveActive || state.wave >= WAVES.length) return;
    state.wave++;
    state.spawnQueue = [];
    const waveDef = WAVES[state.wave - 1];
    let delay = 0;
    for (const group of waveDef) {
      for (let i = 0; i < group.count; i++) {
        state.spawnQueue.push({ type: group.type, delay });
        delay += group.interval;
      }
    }
    state.waveActive = true;
    state.spawnTimer = 0;
    updateUI();
  }

  function spawnEnemy(type) {
    const def = ENEMY_TYPES[type];
    state.enemies.push({
      type, ...def,
      maxHp: def.hp * (1 + state.wave * 0.08),
      hp: def.hp * (1 + state.wave * 0.08),
      pathIndex: 0, progress: 0,
      slowTimer: 0, slowFactor: 1,
      x: pathPoints[0].x, y: pathPoints[0].y
    });
  }

  function placeTower(gx, gy) {
    if (!state.selectedTowerType) return;
    const type = state.selectedTowerType;
    const def = TOWER_TYPES[type];
    if (state.gold < def.cost) return;
    if (pathSet.has(`${gx},${gy}`)) return;
    if (state.towers.some(t => t.gx === gx && t.gy === gy)) return;
    if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;

    state.gold -= def.cost;
    state.towers.push({
      type, gx, gy,
      x: gx * CELL + CELL/2, y: gy * CELL + CELL/2,
      level: 1, cooldown: 0,
      ...def
    });
    state.selectedTowerType = null;
    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
    spawnParticles(gx * CELL + CELL/2, gy * CELL + CELL/2, def.color, 8);
    updateUI();
  }

  function getTowerStats(tower) {
    const base = TOWER_TYPES[tower.type];
    const mult = 1 + (tower.level - 1) * 0.35;
    return {
      damage: base.damage * mult,
      range: base.range * (1 + (tower.level - 1) * 0.1),
      fireRate: base.fireRate / (1 + (tower.level - 1) * 0.15),
      ...base
    };
  }

  function findTarget(tower, stats) {
    let best = null, bestProgress = -1;
    for (const e of state.enemies) {
      const dx = e.x - tower.x, dy = e.y - tower.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= stats.range) {
        const prog = e.pathIndex + e.progress;
        if (prog > bestProgress) { bestProgress = prog; best = e; }
      }
    }
    return best;
  }

  function fireProjectile(tower, target, stats) {
    state.projectiles.push({
      x: tower.x, y: tower.y,
      tx: target.x, ty: target.y,
      target,
      speed: stats.projSpeed,
      damage: stats.damage,
      color: stats.color,
      splash: stats.splash || 0,
      slow: stats.slow || 0,
      slowDur: stats.slowDur || 0,
      type: tower.type
    });
  }

  function damageEnemy(enemy, dmg) {
    enemy.hp -= dmg;
    if (enemy.hp <= 0 && enemy.hp + dmg > 0) {
      state.gold += enemy.reward;
      state.score += enemy.reward * 2;
      spawnParticles(enemy.x, enemy.y, enemy.color, 12);
      const idx = state.enemies.indexOf(enemy);
      if (idx >= 0) state.enemies.splice(idx, 1);
      updateUI();
    }
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 40 + Math.random() * 80;
      state.particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 0.3 + Math.random() * 0.4, maxLife: 0.7,
        color, size: 2 + Math.random() * 3
      });
    }
  }

  function hideUpgradePanel() {
    document.getElementById('upgrade-panel').classList.remove('visible');
  }

  function showUpgradePanel(tower) {
    const panel = document.getElementById('upgrade-panel');
    const stats = getTowerStats(tower);
    const base = TOWER_TYPES[tower.type];
    document.getElementById('upg-title').textContent = `${base.name} Lv.${tower.level}`;
    const cost = upgradeCost(tower);
    const upgBtn = document.getElementById('upg-btn');
    if (tower.level >= 4) {
      upgBtn.textContent = 'Max Level';
      upgBtn.disabled = true;
    } else {
      upgBtn.textContent = `Upgrade (${cost}g)`;
      upgBtn.disabled = state.gold < cost;
    }
    document.getElementById('sell-btn').textContent = `Sell (${sellValue(tower)}g)`;

    const wrap = document.getElementById('game-wrap');
    const rect = wrap.getBoundingClientRect();
    panel.style.left = (tower.gx * CELL + CELL + 4) + 'px';
    panel.style.top = (tower.gy * CELL) + 'px';
    panel.classList.add('visible');
  }

  // Input
  canvas.addEventListener('click', (e) => {
    if (state.paused || state.gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const gx = Math.floor(mx / CELL), gy = Math.floor(my / CELL);

    const clicked = state.towers.find(t => t.gx === gx && t.gy === gy);
    if (clicked) {
      state.selectedTower = clicked;
      state.selectedTowerType = null;
      document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
      showUpgradePanel(clicked);
      return;
    }

    hideUpgradePanel();
    state.selectedTower = null;
    placeTower(gx, gy);
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const tip = document.getElementById('tooltip');
    if (state.selectedTowerType) {
      tip.style.display = 'block';
      tip.style.left = (e.clientX - rect.left + 14) + 'px';
      tip.style.top = (e.clientY - rect.top - 10) + 'px';
      tip.textContent = `Place ${TOWER_TYPES[state.selectedTowerType].name}`;
    } else {
      tip.style.display = 'none';
    }
  });

  document.getElementById('start-wave').addEventListener('click', startWave);
  document.getElementById('speed-btn').addEventListener('click', () => {
    state.speed = state.speed >= 3 ? 1 : state.speed + 1;
    document.getElementById('speed-btn').textContent = `Speed ×${state.speed}`;
  });

  document.getElementById('upg-btn').addEventListener('click', () => {
    const t = state.selectedTower;
    if (!t || t.level >= 4) return;
    const cost = upgradeCost(t);
    if (state.gold < cost) return;
    state.gold -= cost;
    t.level++;
    spawnParticles(t.x, t.y, TOWER_TYPES[t.type].color, 10);
    showUpgradePanel(t);
    updateUI();
  });

  document.getElementById('sell-btn').addEventListener('click', () => {
    const t = state.selectedTower;
    if (!t) return;
    state.gold += sellValue(t);
    state.towers = state.towers.filter(x => x !== t);
    state.selectedTower = null;
    hideUpgradePanel();
    updateUI();
  });

  document.getElementById('overlay-btn').addEventListener('click', () => {
    document.getElementById('overlay').classList.add('hidden');
    resetGame();
    buildSidebar();
  });

  function showEndScreen(won) {
    state.gameOver = true;
    state.paused = true;
    const ov = document.getElementById('overlay');
    ov.classList.remove('hidden');
    document.getElementById('overlay-title').textContent = won ? 'VICTORY!' : 'DEFEAT';
    document.getElementById('overlay-msg').textContent = won
      ? `The citadel stands! Final score: ${state.score}`
      : `The citadel has fallen. Score: ${state.score}`;
    document.getElementById('overlay-btn').textContent = 'Play Again';
  }

  // Update loop
  let lastTime = 0;
  function update(dt) {
    if (state.paused || state.gameOver) return;
    dt *= state.speed;
    state.time += dt;

    // Spawning
    if (state.waveActive && state.spawnQueue.length > 0) {
      state.spawnTimer += dt;
      while (state.spawnQueue.length > 0 && state.spawnQueue[0].delay <= state.spawnTimer) {
        spawnEnemy(state.spawnQueue.shift().type);
      }
    }

    // Move enemies
    for (const e of state.enemies) {
      if (e.slowTimer > 0) { e.slowTimer -= dt; if (e.slowTimer <= 0) e.slowFactor = 1; }
      const speed = e.speed * e.slowFactor;
      if (e.pathIndex >= pathPoints.length - 1) {
        state.lives--;
        const idx = state.enemies.indexOf(e);
        if (idx >= 0) state.enemies.splice(idx, 1);
        if (state.lives <= 0) showEndScreen(false);
        updateUI();
        continue;
      }
      const from = pathPoints[e.pathIndex];
      const to = pathPoints[e.pathIndex + 1];
      const segLen = Math.hypot(to.x - from.x, to.y - from.y);
      e.progress += (speed * dt) / segLen;
      if (e.progress >= 1) {
        e.pathIndex++;
        e.progress = 0;
        if (e.pathIndex >= pathPoints.length - 1) continue;
      }
      const f = pathPoints[e.pathIndex];
      const t = pathPoints[Math.min(e.pathIndex + 1, pathPoints.length - 1)];
      e.x = f.x + (t.x - f.x) * e.progress;
      e.y = f.y + (t.y - f.y) * e.progress;
    }

    // Towers
    for (const tower of state.towers) {
      tower.cooldown -= dt;
      const stats = getTowerStats(tower);
      if (tower.cooldown <= 0) {
        const target = findTarget(tower, stats);
        if (target) {
          fireProjectile(tower, target, stats);
          tower.cooldown = stats.fireRate;
        }
      }
    }

    // Projectiles
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 8 || !state.enemies.includes(p.target)) {
        if (p.splash) {
          for (const e of state.enemies) {
            if (Math.hypot(e.x - p.x, e.y - p.y) < p.splash) damageEnemy(e, p.damage * 0.7);
          }
          spawnParticles(p.x, p.y, p.color, 6);
        } else if (state.enemies.includes(p.target)) {
          damageEnemy(p.target, p.damage);
          if (p.slow) { p.target.slowFactor = p.slow; p.target.slowTimer = p.slowDur; }
        }
        state.projectiles.splice(i, 1);
        continue;
      }
      const move = p.speed * dt;
      p.x += (dx / dist) * move;
      p.y += (dy / dist) * move;
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) { state.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.95; p.vy *= 0.95;
    }

    // Wave complete
    if (state.waveActive && state.spawnQueue.length === 0 && state.enemies.length === 0) {
      state.waveActive = false;
      state.gold += 25 + state.wave * 5;
      if (state.wave >= WAVES.length) showEndScreen(true);
      updateUI();
    }
  }

  // Render
  function drawGrid() {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const isPath = pathSet.has(`${x},${y}`);
        ctx.fillStyle = isPath ? '#1a2332' : '#111822';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        ctx.strokeStyle = '#1e2d40';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // Path overlay
    ctx.strokeStyle = '#2c4058';
    ctx.lineWidth = CELL * 0.55;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    ctx.stroke();

    // Start / end markers
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(pathPoints[0].x, pathPoints[0].y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.arc(pathPoints[pathPoints.length-1].x, pathPoints[pathPoints.length-1].y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('IN', pathPoints[0].x, pathPoints[0].y + 4);
    ctx.fillText('⚑', pathPoints[pathPoints.length-1].x, pathPoints[pathPoints.length-1].y + 4);
  }

  function drawPlacementPreview() {
    if (!state.selectedTowerType || state.paused) return;
    const def = TOWER_TYPES[state.selectedTowerType];
    const mx = canvas._mx || 0, my = canvas._my || 0;
    const gx = Math.floor(mx / CELL), gy = Math.floor(my / CELL);
    const cx = gx * CELL + CELL/2, cy = gy * CELL + CELL/2;
    const valid = !pathSet.has(`${gx},${gy}`) && !state.towers.some(t => t.gx === gx && t.gy === gy) && gx >= 0 && gy >= 0 && gx < COLS && gy < ROWS;

    ctx.globalAlpha = 0.25;
    ctx.fillStyle = valid ? '#2ecc71' : '#e74c3c';
    ctx.beginPath();
    ctx.arc(cx, cy, def.range, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = valid ? def.color : '#555';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawTowerRange(tower) {
    const stats = getTowerStats(tower);
    ctx.strokeStyle = 'rgba(93,173,226,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, stats.range, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawTowers() {
    for (const t of state.towers) {
      const base = TOWER_TYPES[t.type];
      const r = 14 + t.level * 2;

      if (state.selectedTower === t) drawTowerRange(t);

      // Base
      ctx.fillStyle = '#1a2540';
      ctx.beginPath();
      ctx.arc(t.x, t.y, r + 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = base.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Level indicator
      if (t.level > 1) {
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('★'.repeat(Math.min(t.level, 4)), t.x, t.y - r - 4);
      }

      // Barrel direction
      const target = findTarget(t, getTowerStats(t));
      if (target) {
        const angle = Math.atan2(target.y - t.y, target.x - t.x);
        ctx.strokeStyle = base.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.x + Math.cos(angle) * (r + 6), t.y + Math.sin(angle) * (r + 6));
        ctx.stroke();
      }
    }
  }

  function drawEnemies() {
    for (const e of state.enemies) {
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(e.x, e.y + e.radius * 0.5, e.radius * 0.8, e.radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fill();

      // HP bar
      const barW = e.radius * 2;
      const hpPct = e.hp / e.maxHp;
      ctx.fillStyle = '#222';
      ctx.fillRect(e.x - barW/2, e.y - e.radius - 8, barW, 4);
      ctx.fillStyle = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f1c40f' : '#e74c3c';
      ctx.fillRect(e.x - barW/2, e.y - e.radius - 8, barW * hpPct, 4);

      if (e.slowTimer > 0) {
        ctx.strokeStyle = '#3498db';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius + 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawProjectiles() {
    for (const p of state.projectiles) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      if (p.type === 'cannon') {
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      } else if (p.type === 'sniper') {
        ctx.fillRect(p.x - 6, p.y - 2, 12, 4);
      } else {
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }

  function drawParticles() {
    for (const p of state.particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    canvas._mx = e.clientX - rect.left;
    canvas._my = e.clientY - rect.top;
  });

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    drawPlacementPreview();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawParticles();
  }

  function loop(ts) {
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  buildSidebar();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
