<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satisfying Button</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0a12;
    --bg-mid: #12121f;
    --accent: #6ee7b7;
    --accent-glow: #34d399;
    --accent-hot: #fbbf24;
    --text: #e2e8f0;
    --text-dim: #64748b;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 120%, rgba(52, 211, 153, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 0%, rgba(110, 231, 183, 0.05) 0%, transparent 50%),
      var(--bg-deep);
  }

  .ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .ambient span {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(110, 231, 183, 0.15) 0%, transparent 70%);
    animation: float 12s ease-in-out infinite;
  }

  .ambient span:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 15%; animation-delay: 0s; }
  .ambient span:nth-child(2) { width: 200px; height: 200px; top: 60%; right: 10%; animation-delay: -4s; }
  .ambient span:nth-child(3) { width: 150px; height: 150px; bottom: 20%; left: 30%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    50% { transform: translate(20px, -30px) scale(1.1); opacity: 0.7; }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }

  .header {
    text-align: center;
  }

  .header h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }

  .counter {
    font-size: clamp(3rem, 12vw, 5.5rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hot) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .counter.pop {
    transform: scale(1.12);
  }

  .label {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 0.25rem;
  }

  .button-stage {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(110, 231, 183, 0.15);
    animation: ring-pulse 3s ease-in-out infinite;
  }

  .ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
  .ring:nth-child(2) { width: 130%; height: 130%; animation-delay: -1s; opacity: 0.5; }
  .ring:nth-child(3) { width: 160%; height: 160%; animation-delay: -2s; opacity: 0.25; }

  @keyframes ring-pulse {
    0%, 100% { transform: scale(1); opacity: inherit; }
    50% { transform: scale(1.03); opacity: calc(inherit * 1.5); }
  }

  .the-button {
    position: relative;
    width: 160px;
    height: 160px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    outline: none;
    background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
    box-shadow:
      0 0 0 1px rgba(110, 231, 183, 0.2),
      0 8px 32px rgba(0, 0, 0, 0.5),
      0 0 60px rgba(52, 211, 153, 0.1),
      inset 0 2px 4px rgba(255, 255, 255, 0.05),
      inset 0 -4px 8px rgba(0, 0, 0, 0.3);
    transition:
      transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.15s ease;
    -webkit-appearance: none;
  }

  .the-button::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: linear-gradient(145deg, #2a2a4a 0%, #1a1a30 50%, #12121f 100%);
    box-shadow:
      inset 0 2px 8px rgba(255, 255, 255, 0.08),
      inset 0 -2px 6px rgba(0, 0, 0, 0.4);
    transition: background 0.1s ease;
  }

  .the-button::after {
    content: '';
    position: absolute;
    inset: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent) 0%, var(--accent-glow) 40%, #059669 100%);
    box-shadow:
      0 0 20px rgba(52, 211, 153, 0.5),
      0 0 40px rgba(52, 211, 153, 0.2),
      inset 0 -4px 8px rgba(0, 0, 0, 0.2),
      inset 0 2px 4px rgba(255, 255, 255, 0.3);
    transition:
      transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.1s ease,
      background 0.1s ease;
  }

  .the-button:hover::after {
    box-shadow:
      0 0 30px rgba(52, 211, 153, 0.7),
      0 0 60px rgba(52, 211, 153, 0.3),
      inset 0 -4px 8px rgba(0, 0, 0, 0.2),
      inset 0 2px 4px rgba(255, 255, 255, 0.3);
  }

  .the-button:active,
  .the-button.pressed {
    transform: scale(0.92);
    box-shadow:
      0 0 0 1px rgba(110, 231, 183, 0.4),
      0 2px 8px rgba(0, 0, 0, 0.6),
      0 0 80px rgba(52, 211, 153, 0.3),
      inset 0 4px 12px rgba(0, 0, 0, 0.5);
  }

  .the-button:active::after,
  .the-button.pressed::after {
    transform: scale(0.88);
    background: radial-gradient(circle at 35% 30%, var(--accent-hot) 0%, #f59e0b 40%, #d97706 100%);
    box-shadow:
      0 0 40px rgba(251, 191, 36, 0.8),
      0 0 80px rgba(251, 191, 36, 0.4),
      inset 0 4px 8px rgba(0, 0, 0, 0.3);
  }

  .the-button:focus-visible {
    box-shadow:
      0 0 0 3px var(--bg-deep),
      0 0 0 5px var(--accent),
      0 8px 32px rgba(0, 0, 0, 0.5);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    opacity: 0.7;
    animation: hint-fade 4s ease-in-out infinite;
  }

  @keyframes hint-fade {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  .streak-bar {
    width: 200px;
    height: 4px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    overflow: hidden;
    margin-top: -1rem;
  }

  .streak-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-glow), var(--accent-hot));
    border-radius: 2px;
    transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
  }

  .streak-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 0.4rem;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .streak-label.visible { opacity: 1; }

  canvas.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .ripple-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--accent);
    transform: translate(-50%, -50%) scale(0);
    animation: ripple-out 0.6s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple-out {
    to {
      transform: translate(-50%, -50%) scale(3);
      opacity: 0;
      border-width: 1px;
    }
  }

  .combo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent-hot);
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
    pointer-events: none;
    z-index: 20;
    opacity: 0;
  }

  .combo.show {
    animation: combo-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes combo-pop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <span></span><span></span><span></span>
</div>

<canvas class="particles" id="particles"></canvas>
<div class="combo" id="combo"></div>

<main class="container">
  <header class="header">
    <h1>Satisfying Button</h1>
    <div class="counter" id="counter" aria-live="polite">0</div>
    <div class="label">presses</div>
  </header>

  <div class="button-stage" id="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ripple-container" id="ripples"></div>
    <button class="the-button" id="btn" aria-label="Press the satisfying button"></button>
  </div>

  <div class="streak-bar" aria-hidden="true">
    <div class="streak-fill" id="streakFill"></div>
  </div>
  <div class="streak-label" id="streakLabel">streak ×0</div>

  <p class="hint">click · tap · space</p>
</main>

<script>
(function () {
  'use strict';

  const btn = document.getElementById('btn');
  const counter = document.getElementById('counter');
  const stage = document.getElementById('stage');
  const ripples = document.getElementById('ripples');
  const streakFill = document.getElementById('streakFill');
  const streakLabel = document.getElementById('streakLabel');
  const comboEl = document.getElementById('combo');
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');

  let count = 0;
  let streak = 0;
  let lastPress = 0;
  let particles = [];
  let audioCtx = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playClick(streakLevel) {
    try {
      const ac = initAudio();
      const now = ac.currentTime;
      const baseFreq = 180 + Math.min(streakLevel, 20) * 12;

      const osc = ac.createOscillator();
      const gain = ac.createGain();
      const filter = ac.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq * 1.5, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.06);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2000 + streakLevel * 100, now);
      filter.Q.value = 2;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25 + Math.min(streakLevel * 0.02, 0.3), now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.15);

      const osc2 = ac.createOscillator();
      const gain2 = ac.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(baseFreq * 2.5, now);
      gain2.gain.setValueAtTime(0.0001, now);
      gain2.gain.exponentialRampToValueAtTime(0.08, now + 0.005);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
      osc2.connect(gain2);
      gain2.connect(ac.destination);
      osc2.start(now);
      osc2.stop(now + 0.08);
    } catch (_) {}
  }

  function spawnParticles(x, y, streakLevel) {
    const n = 12 + Math.min(streakLevel * 2, 24);
    const hues = streakLevel >= 10
      ? ['#fbbf24', '#f59e0b', '#6ee7b7', '#34d399']
      : ['#6ee7b7', '#34d399', '#a7f3d0', '#6ee7b7'];

    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const speed = 3 + Math.random() * 6 + streakLevel * 0.3;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        size: 3 + Math.random() * 5,
        color: hues[Math.floor(Math.random() * hues.length)],
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.3,
        shape: Math.random() > 0.5 ? 'circle' : 'rect'
      });
    }
  }

  function spawnRipple() {
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const stageRect = stage.getBoundingClientRect();
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = (cx - stageRect.left) + 'px';
    ripple.style.top = (cy - stageRect.top) + 'px';
    ripple.style.width = rect.width + 'px';
    ripple.style.height = rect.height + 'px';
    ripples.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  function showCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
  }

  function updateStreakUI() {
    const pct = Math.min(streak / 15, 1) * 100;
    streakFill.style.width = pct + '%';
    if (streak >= 2) {
      streakLabel.textContent = 'streak ×' + streak;
      streakLabel.classList.add('visible');
    } else {
      streakLabel.classList.remove('visible');
    }
  }

  function press() {
    const now = Date.now();
    if (now - lastPress < 600) {
      streak++;
    } else {
      streak = 1;
    }
    lastPress = now;
    count++;

    counter.textContent = count;
    counter.classList.remove('pop');
    void counter.offsetWidth;
    counter.classList.add('pop');

    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 120);

    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    spawnParticles(cx, cy, streak);
    spawnRipple();
    playClick(streak);
    updateStreakUI();

    if (streak === 5) showCombo('nice!');
    else if (streak === 10) showCombo('on fire!');
    else if (streak === 15) showCombo('legendary!');
    else if (streak === 25) showCombo('unstoppable!');
    else if (streak % 50 === 0 && streak >= 50) showCombo(streak + '!');
  }

  btn.addEventListener('click', press);
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    press();
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement !== btn) {
      e.preventDefault();
      press();
    }
  });

  function tickParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.life > 0);

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.vx *= 0.98;
      p.life -= p.decay;
      p.rotation += p.rotSpeed;

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;

      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size * p.life, p.size * p.life);
      }
      ctx.restore();
    }

    requestAnimationFrame(tickParticles);
  }
  tickParticles();

  let streakDecayTimer = null;
  setInterval(() => {
    if (Date.now() - lastPress > 1200 && streak > 0) {
      streak = 0;
      updateStreakUI();
    }
  }, 200);
})();
</script>
</body>
</html>
