<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor Experiment A</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #06060f;
      font-family: "Segoe UI", system-ui, sans-serif;
      cursor: none;
      user-select: none;
    }
    canvas { display: block; position: fixed; inset: 0; }
    .ui {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      color: rgba(255,255,255,0.85);
    }
    .title {
      top: 28px; left: 32px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.7;
    }
    .hint {
      bottom: 28px; left: 32px;
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.45;
      max-width: 320px;
    }
    .panel {
      top: 24px; right: 24px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(12,12,24,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 16px;
      min-width: 180px;
    }
    .panel label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 2px;
    }
    .panel button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .panel button:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    .panel button.active {
      background: rgba(120, 180, 255, 0.18);
      border-color: rgba(120, 180, 255, 0.45);
      color: #c8e0ff;
    }
    .panel input[type="range"] {
      width: 100%;
      accent-color: #78b4ff;
      cursor: none;
    }
    .stats {
      bottom: 28px; right: 32px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      opacity: 0.35;
      text-align: right;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="ui title">Cursor Experiment A</div>
  <div class="ui hint">
    Move to attract orbs · Click for ripples · Space to burst · 1–3 switch modes
  </div>
  <div class="ui stats" id="stats"></div>

  <div class="ui panel">
    <label>Mode</label>
    <button data-mode="attract" class="active">Attract</button>
    <button data-mode="repel">Repel</button>
    <button data-mode="orbit">Orbit</button>
    <label style="margin-top:6px">Trail length</label>
    <input type="range" id="trail" min="8" max="80" value="32" />
    <label>Force</label>
    <input type="range" id="force" min="1" max="100" value="55" />
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const statsEl = document.getElementById("stats");
    const trailSlider = document.getElementById("trail");
    const forceSlider = document.getElementById("force");

    let W, H, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const mouse = { x: W / 2, y: H / 2, vx: 0, vy: 0, px: W / 2, py: H / 2, down: false };
    const trail = [];
    let mode = "attract";
    let ripples = [];
    let bursts = [];
    let hueBase = 210;

    const ORB_COUNT = 48;
    const orbs = Array.from({ length: ORB_COUNT }, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 3 + Math.random() * 5,
      hue: (i / ORB_COUNT) * 360,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8,
    }));

    window.addEventListener("mousemove", (e) => {
      mouse.px = mouse.x;
      mouse.py = mouse.y;
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.vx = mouse.x - mouse.px;
      mouse.vy = mouse.y - mouse.py;
      trail.unshift({ x: mouse.x, y: mouse.y, life: 1 });
      const maxTrail = +trailSlider.value;
      while (trail.length > maxTrail) trail.pop();
    });

    window.addEventListener("mousedown", (e) => {
      mouse.down = true;
      ripples.push({ x: e.clientX, y: e.clientY, r: 0, life: 1, hue: hueBase });
    });
    window.addEventListener("mouseup", () => { mouse.down = false; });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        bursts.push({ x: mouse.x, y: mouse.y, life: 1, count: 24 });
      }
      if (e.key === "1") setMode("attract");
      if (e.key === "2") setMode("repel");
      if (e.key === "3") setMode("orbit");
    });

    function setMode(m) {
      mode = m;
      document.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === m);
      });
    }

    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    function drawBackground(t) {
      ctx.fillStyle = "rgba(6, 6, 15, 0.22)";
      ctx.fillRect(0, 0, W, H);

      const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.55);
      g.addColorStop(0, `hsla(${hueBase + Math.sin(t * 0.0003) * 20}, 60%, 12%, 0.08)`);
      g.addColorStop(1, "rgba(6,6,15,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function updateOrbs(t, force) {
      for (const o of orbs) {
        const dx = mouse.x - o.x;
        const dy = mouse.y - o.y;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        if (mode === "attract") {
          const f = (force * 0.0012) / (dist * 0.01 + 1);
          o.x += nx * f * 60;
          o.y += ny * f * 60;
        } else if (mode === "repel") {
          const f = (force * 0.0018) / (dist * 0.008 + 0.5);
          o.x -= nx * f * 60;
          o.y -= ny * f * 60;
        } else {
          const tangent = Math.atan2(dy, dx) + Math.PI / 2;
          const orbitR = 80 + Math.sin(o.phase + t * 0.002) * 40;
          const targetX = mouse.x + Math.cos(tangent + t * 0.001 * o.speed) * orbitR;
          const targetY = mouse.y + Math.sin(tangent + t * 0.001 * o.speed) * orbitR;
          o.x += (targetX - o.x) * 0.04;
          o.y += (targetY - o.y) * 0.04;
        }

        o.x += Math.sin(t * 0.001 + o.phase) * 0.3;
        o.y += Math.cos(t * 0.0013 + o.phase) * 0.3;

        if (o.x < -20) o.x = W + 20;
        if (o.x > W + 20) o.x = -20;
        if (o.y < -20) o.y = H + 20;
        if (o.y > H + 20) o.y = -20;
      }
    }

    function drawConnections() {
      for (let i = 0; i < orbs.length; i++) {
        for (let j = i + 1; j < orbs.length; j++) {
          const a = orbs[i], b = orbs[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d > 120) continue;
          const alpha = (1 - d / 120) * 0.35;
          ctx.strokeStyle = `hsla(${(a.hue + b.hue) / 2}, 70%, 65%, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    function drawOrbs() {
      for (const o of orbs) {
        const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * 3);
        grad.addColorStop(0, `hsla(${o.hue}, 85%, 72%, 0.95)`);
        grad.addColorStop(1, `hsla(${o.hue}, 85%, 50%, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTrail() {
      for (let i = 0; i < trail.length; i++) {
        const p = trail[i];
        p.life *= 0.92;
        const alpha = p.life * (1 - i / trail.length);
        const size = 6 * p.life * (1 - i / trail.length * 0.5);
        ctx.fillStyle = `hsla(${hueBase + i * 2}, 80%, 70%, ${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      trail.splice(trail.findIndex((p) => p.life < 0.02), trail.length);
    }

    function drawRipples() {
      ripples = ripples.filter((r) => r.life > 0.02);
      for (const r of ripples) {
        r.r += (1 - r.life) * 8 + 2;
        r.life *= 0.94;
        ctx.strokeStyle = `hsla(${r.hue}, 80%, 65%, ${r.life * 0.5})`;
        ctx.lineWidth = 2 * r.life;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawBursts() {
      bursts = bursts.filter((b) => b.life > 0.02);
      for (const b of bursts) {
        for (let i = 0; i < b.count; i++) {
          const angle = (i / b.count) * Math.PI * 2 + (1 - b.life) * 3;
          const dist = (1 - b.life) * 180 + 10;
          const x = b.x + Math.cos(angle) * dist;
          const y = b.y + Math.sin(angle) * dist;
          ctx.fillStyle = `hsla(${hueBase + i * 8}, 90%, 70%, ${b.life * 0.7})`;
          ctx.beginPath();
          ctx.arc(x, y, 3 * b.life, 0, Math.PI * 2);
          ctx.fill();
        }
        b.life *= 0.92;
      }
    }

    function drawCursor(t) {
      const speed = Math.hypot(mouse.vx, mouse.vy);
      const pulse = 1 + Math.sin(t * 0.008) * 0.08;
      const outerR = (14 + speed * 0.4) * pulse;

      ctx.strokeStyle = `hsla(${hueBase}, 90%, 75%, 0.55)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, outerR, 0, Math.PI * 2);
      ctx.stroke();

      const cross = 6 + speed * 0.15;
      ctx.strokeStyle = `hsla(${hueBase}, 90%, 85%, 0.8)`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(mouse.x - cross, mouse.y);
      ctx.lineTo(mouse.x + cross, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - cross);
      ctx.lineTo(mouse.x, mouse.y + cross);
      ctx.stroke();

      ctx.fillStyle = `hsla(${hueBase}, 95%, 80%, 0.95)`;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    let last = performance.now();
    let frames = 0;
    let fps = 60;

    function loop(now) {
      const dt = now - last;
      last = now;
      frames++;
      if (frames % 30 === 0) fps = Math.round(1000 / dt);

      hueBase = (hueBase + 0.05) % 360;
      const force = +forceSlider.value;

      drawBackground(now);
      updateOrbs(now, force);
      drawConnections();
      drawOrbs();
      drawTrail();
      drawRipples();
      drawBursts();
      drawCursor(now);

      statsEl.textContent = `${mode} · ${fps} fps · ${orbs.length} orbs`;
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
