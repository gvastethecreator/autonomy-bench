<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — Image Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0d10;--surface:#15171c;--surface2:#1e2128;--border:#2a2e38;
  --text:#e8eaef;--muted:#7a8294;--accent:#6c8cff;--accent2:#8b5cf6;
  --success:#34d399;--danger:#f87171;--radius:10px;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);
  gap:12px;z-index:10;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
.logo-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:14px;
}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface2);
  color:var(--text);font-size:.82rem;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn:hover{background:#282c36;border-color:#3a4050}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px;flex-shrink:0}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.main{display:grid;grid-template-columns:1fr 280px;overflow:hidden}
.canvas-area{
  position:relative;overflow:hidden;
  background:
    repeating-conic-gradient(#1a1c22 0% 25%,#14161a 0% 50%) 50%/20px 20px;
  display:flex;align-items:center;justify-content:center;
}
.canvas-wrap{position:relative;box-shadow:var(--shadow);line-height:0}
#canvas{display:block;cursor:crosshair;max-width:100%;max-height:calc(100vh - 120px)}
.drop-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  background:rgba(12,13,16,.88);backdrop-filter:blur(6px);
  pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;
}
.drop-overlay.visible{opacity:1;pointer-events:all}
.drop-overlay.dragging{background:rgba(108,140,255,.12);border:2px dashed var(--accent)}
.drop-icon{font-size:48px;opacity:.7}
.drop-overlay h2{font-size:1.3rem;font-weight:600}
.drop-overlay p{color:var(--muted);font-size:.9rem}
.sidebar{
  background:var(--surface);border-left:1px solid var(--border);
  overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;
}
.panel h3{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:10px;font-weight:600;
}
.slider-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.slider-row label{display:flex;justify-content:space-between;font-size:.82rem}
.slider-row label span{color:var(--muted);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;border-radius:2px;
  background:var(--border);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--surface);
}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filter-btn{
  padding:10px 8px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface2);color:var(--text);font-size:.78rem;cursor:pointer;
  transition:all .15s;text-align:center;
}
.filter-btn:hover{border-color:var(--accent)}
.filter-btn.active{border-color:var(--accent);background:rgba(108,140,255,.15)}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .12s;
}
.swatch:hover{transform:scale(1.15)}
.swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.brush-size{display:flex;align-items:center;gap:8px}
.brush-preview{
  border-radius:50%;background:var(--accent);flex-shrink:0;
  border:1px solid rgba(255,255,255,.2);
}
.status{
  position:absolute;bottom:12px;left:12px;
  background:rgba(21,23,28,.85);backdrop-filter:blur(8px);
  padding:6px 12px;border-radius:8px;font-size:.75rem;color:var(--muted);
  border:1px solid var(--border);pointer-events:none;
}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--border);padding:10px 20px;
  border-radius:10px;font-size:.85rem;box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:100;
}
.toast.show{transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      Lumen
    </div>
    <div class="toolbar">
      <button class="btn" id="btnOpen" title="Open image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Open
      </button>
      <div class="sep"></div>
      <button class="btn" id="btnUndo" disabled title="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      </button>
      <button class="btn" id="btnRedo" disabled title="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg>
      </button>
      <div class="sep"></div>
      <button class="btn" id="btnRotateL" disabled title="Rotate left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 109.36-2.13L1 10"/></svg>
      </button>
      <button class="btn" id="btnRotateR" disabled title="Rotate right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-9.36-2.13L23 10"/></svg>
      </button>
      <button class="btn" id="btnFlipH" disabled title="Flip horizontal">↔</button>
      <button class="btn" id="btnFlipV" disabled title="Flip vertical">↕</button>
      <div class="sep"></div>
      <button class="btn" id="btnReset" disabled title="Reset adjustments">Reset</button>
      <button class="btn primary" id="btnExport" disabled title="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
    </div>
  </header>

  <div class="main">
    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
      <div class="drop-overlay visible" id="dropOverlay">
        <div class="drop-icon">🖼</div>
        <h2>Drop an image here</h2>
        <p>or click Open to browse files</p>
        <button class="btn primary" id="btnOpenOverlay">Choose Image</button>
      </div>
      <div class="status" id="status">No image loaded</div>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <h3>Tools</h3>
        <div class="filter-grid" id="toolGrid">
          <button class="filter-btn active" data-tool="adjust">Adjust</button>
          <button class="filter-btn" data-tool="brush">Brush</button>
          <button class="filter-btn" data-tool="eraser">Eraser</button>
        </div>
        <div id="brushPanel" style="display:none;margin-top:10px">
          <div class="brush-size">
            <div class="brush-preview" id="brushPreview" style="width:12px;height:12px"></div>
            <input type="range" id="brushSize" min="1" max="80" value="8">
          </div>
          <div class="color-row" id="colorRow"></div>
        </div>
      </div>

      <div class="panel" id="adjustPanel">
        <h3>Adjustments</h3>
        <div class="slider-row">
          <label>Brightness <span id="valBrightness">0</span></label>
          <input type="range" id="brightness" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label>Contrast <span id="valContrast">0</span></label>
          <input type="range" id="contrast" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label>Saturation <span id="valSaturation">0</span></label>
          <input type="range" id="saturation" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label>Hue <span id="valHue">0</span></label>
          <input type="range" id="hue" min="-180" max="180" value="0">
        </div>
        <div class="slider-row">
          <label>Blur <span id="valBlur">0</span></label>
          <input type="range" id="blur" min="0" max="20" value="0">
        </div>
        <div class="slider-row">
          <label>Exposure <span id="valExposure">0</span></label>
          <input type="range" id="exposure" min="-100" max="100" value="0">
        </div>
      </div>

      <div class="panel">
        <h3>Filters</h3>
        <div class="filter-grid" id="filterGrid">
          <button class="filter-btn active" data-filter="none">Original</button>
          <button class="filter-btn" data-filter="grayscale">B&amp;W</button>
          <button class="filter-btn" data-filter="sepia">Sepia</button>
          <button class="filter-btn" data-filter="vintage">Vintage</button>
          <button class="filter-btn" data-filter="cool">Cool</button>
          <button class="filter-btn" data-filter="warm">Warm</button>
          <button class="filter-btn" data-filter="dramatic">Dramatic</button>
          <button class="filter-btn" data-filter="fade">Fade</button>
        </div>
      </div>
    </aside>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*">
<div class="toast" id="toast"></div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const drawCanvas = document.createElement('canvas');
  const drawCtx = drawCanvas.getContext('2d');

  let sourceImage = null;
  let rotation = 0;
  let flipH = false, flipV = false;
  let currentTool = 'adjust';
  let currentFilter = 'none';
  let brushColor = '#6c8cff';
  let brushSize = 8;
  let isDrawing = false;
  let lastX = 0, lastY = 0;
  let undoStack = [];
  let redoStack = [];
  let drawLayer = null;

  const adjustments = {
    brightness: 0, contrast: 0, saturation: 0,
    hue: 0, blur: 0, exposure: 0
  };

  const colors = ['#6c8cff','#f87171','#34d399','#fbbf24','#ffffff','#000000','#8b5cf6','#ec4899'];

  const $ = id => document.getElementById(id);

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function setEnabled(enabled) {
    ['btnUndo','btnRedo','btnRotateL','btnRotateR','btnFlipH','btnFlipV','btnReset','btnExport'].forEach(id => {
      $(id).disabled = !enabled;
    });
  }

  function updateStatus() {
    if (!sourceImage) {
      $('status').textContent = 'No image loaded';
      return;
    }
    $('status').textContent = `${canvas.width} × ${canvas.height}px · ${currentTool} · ${currentFilter === 'none' ? 'no filter' : currentFilter}`;
  }

  function buildColorRow() {
    const row = $('colorRow');
    colors.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch' + (c === brushColor ? ' active' : '');
      s.style.background = c;
      s.addEventListener('click', () => {
        brushColor = c;
        row.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
        s.classList.add('active');
      });
      row.appendChild(s);
    });
  }

  function saveState() {
    undoStack.push(canvas.toDataURL('image/png'));
    if (undoStack.length > 30) undoStack.shift();
    redoStack = [];
    $('btnUndo').disabled = undoStack.length === 0;
    $('btnRedo').disabled = true;
  }

  function restoreFromDataURL(dataURL) {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      drawCanvas.width = img.width;
      drawCanvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      drawLayer = ctx.getImageData(0, 0, canvas.width, canvas.height);
      updateStatus();
    };
    img.src = dataURL;
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(canvas.toDataURL('image/png'));
    restoreFromDataURL(undoStack.pop());
    $('btnUndo').disabled = undoStack.length === 0;
    $('btnRedo').disabled = false;
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(canvas.toDataURL('image/png'));
    restoreFromDataURL(redoStack.pop());
    $('btnUndo').disabled = false;
    $('btnRedo').disabled = redoStack.length === 0;
  }

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        sourceImage = img;
        rotation = 0; flipH = false; flipV = false;
        resetAdjustments(false);
        currentFilter = 'none';
        document.querySelectorAll('#filterGrid .filter-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.filter === 'none');
        });
        undoStack = []; redoStack = [];
        render();
        $('dropOverlay').classList.remove('visible');
        setEnabled(true);
        toast('Image loaded');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function resetAdjustments(rerender = true) {
    Object.keys(adjustments).forEach(k => adjustments[k] = 0);
    ['brightness','contrast','saturation','hue','blur','exposure'].forEach(id => {
      $(id).value = 0;
      $('val' + id.charAt(0).toUpperCase() + id.slice(1)).textContent = '0';
    });
    if (rerender && sourceImage) render();
  }

  function getTransformDims(w, h, rot) {
    const rad = (rot % 360) * Math.PI / 180;
    const cos = Math.abs(Math.cos(rad));
    const sin = Math.abs(Math.sin(rad));
    return { width: Math.round(w * cos + h * sin), height: Math.round(w * sin + h * cos) };
  }

  function buildCSSFilter() {
    const { brightness, contrast, saturation, hue, blur, exposure } = adjustments;
    const bVal = 1 + brightness / 100 + exposure / 200;
    const cVal = 1 + contrast / 100;
    const sVal = 1 + saturation / 100;
    let filter = `brightness(${bVal}) contrast(${cVal}) saturate(${sVal}) hue-rotate(${hue}deg)`;
    if (blur > 0) filter += ` blur(${blur}px)`;

    const presets = {
      grayscale: 'grayscale(1)',
      sepia: 'sepia(.8)',
      vintage: 'sepia(.4) contrast(1.1) brightness(.95) saturate(.7)',
      cool: 'saturate(1.2) hue-rotate(15deg) brightness(1.05)',
      warm: 'sepia(.25) saturate(1.3) brightness(1.05)',
      dramatic: 'contrast(1.4) saturate(1.2) brightness(.9)',
      fade: 'contrast(.85) brightness(1.1) saturate(.6)'
    };
    if (currentFilter !== 'none' && presets[currentFilter]) {
      filter += ' ' + presets[currentFilter];
    }
    return filter;
  }

  function render() {
    if (!sourceImage) return;

    const sw = sourceImage.width;
    const sh = sourceImage.height;
    const dims = getTransformDims(sw, sh, rotation);

    canvas.width = dims.width;
    canvas.height = dims.height;
    drawCanvas.width = dims.width;
    drawCanvas.height = dims.height;

    ctx.save();
    ctx.clearRect(0, 0, dims.width, dims.height);
    ctx.filter = buildCSSFilter();
    ctx.translate(dims.width / 2, dims.height / 2);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
    ctx.drawImage(sourceImage, -sw / 2, -sh / 2);
    ctx.restore();
    ctx.filter = 'none';

    if (drawLayer && drawLayer.width === dims.width && drawLayer.height === dims.height) {
      const temp = document.createElement('canvas');
      temp.width = dims.width;
      temp.height = dims.height;
      const tctx = temp.getContext('2d');
      tctx.putImageData(drawLayer, 0, 0);
      ctx.drawImage(temp, 0, 0);
    } else {
      drawLayer = null;
    }

    fitCanvas();
    updateStatus();
  }

  function fitCanvas() {
    const area = $('canvasArea');
    const maxW = area.clientWidth - 40;
    const maxH = area.clientHeight - 60;
    const scale = Math.min(1, maxW / canvas.width, maxH / canvas.height);
    canvas.style.width = Math.round(canvas.width * scale) + 'px';
    canvas.style.height = Math.round(canvas.height * scale) + 'px';
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    if (!sourceImage || currentTool === 'adjust') return;
    isDrawing = true;
    const { x, y } = getCanvasCoords(e);
    lastX = x; lastY = y;
    saveState();
    draw(e);
  }

  function draw(e) {
    if (!isDrawing) return;
    const { x, y } = getCanvasCoords(e);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = brushSize;

    if (currentTool === 'brush') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = brushColor;
    } else {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    }

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastX = x; lastY = y;
  }

  function endDraw() {
    if (isDrawing) {
      isDrawing = false;
      drawLayer = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
  }

  function exportImage() {
    if (!sourceImage) return;
    const link = document.createElement('a');
    link.download = 'lumen-edit-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('Image exported');
  }

  function openFile() { $('fileInput').click(); }

  $('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) loadImage(e.target.files[0]);
    e.target.value = '';
  });

  $('btnOpen').addEventListener('click', openFile);
  $('btnOpenOverlay').addEventListener('click', openFile);
  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);
  $('btnExport').addEventListener('click', exportImage);
  $('btnReset').addEventListener('click', () => {
    resetAdjustments();
    currentFilter = 'none';
    document.querySelectorAll('#filterGrid .filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === 'none');
    });
    toast('Adjustments reset');
  });

  $('btnRotateL').addEventListener('click', () => { rotation = (rotation - 90 + 360) % 360; saveState(); render(); });
  $('btnRotateR').addEventListener('click', () => { rotation = (rotation + 90) % 360; saveState(); render(); });
  $('btnFlipH').addEventListener('click', () => { flipH = !flipH; saveState(); render(); });
  $('btnFlipV').addEventListener('click', () => { flipV = !flipV; saveState(); render(); });

  ['brightness','contrast','saturation','hue','blur','exposure'].forEach(id => {
    $(id).addEventListener('input', e => {
      adjustments[id] = parseFloat(e.target.value);
      $('val' + id.charAt(0).toUpperCase() + id.slice(1)).textContent = e.target.value;
      render();
    });
  });

  document.querySelectorAll('#filterGrid .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('#filterGrid .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.querySelectorAll('#toolGrid .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTool = btn.dataset.tool;
      document.querySelectorAll('#toolGrid .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $('brushPanel').style.display = currentTool !== 'adjust' ? 'block' : 'none';
      $('adjustPanel').style.opacity = currentTool === 'adjust' ? '1' : '.4';
      canvas.style.cursor = currentTool === 'adjust' ? 'default' : 'crosshair';
      updateStatus();
    });
  });

  $('brushSize').addEventListener('input', e => {
    brushSize = parseInt(e.target.value);
    const preview = $('brushPreview');
    const s = Math.max(4, brushSize / 2);
    preview.style.width = s + 'px';
    preview.style.height = s + 'px';
  });

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e.touches[0]); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); }, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  const area = $('canvasArea');
  area.addEventListener('dragover', e => { e.preventDefault(); $('dropOverlay').classList.add('dragging'); });
  area.addEventListener('dragleave', () => $('dropOverlay').classList.remove('dragging'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    $('dropOverlay').classList.remove('dragging');
    if (e.dataTransfer.files[0]?.type.startsWith('image/')) loadImage(e.dataTransfer.files[0]);
  });

  window.addEventListener('resize', fitCanvas);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'z') { e.preventDefault(); undo(); }
      if (e.key === 'y') { e.preventDefault(); redo(); }
      if (e.key === 's') { e.preventDefault(); exportImage(); }
      if (e.key === 'o') { e.preventDefault(); openFile(); }
    }
  });

  buildColorRow();
  setEnabled(false);

  ctx.fillStyle = '#1a1c22';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#3a4050';
  ctx.font = '16px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Lumen Image Editor', canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = '13px Segoe UI, sans-serif';
  ctx.fillStyle = '#5a6270';
  ctx.fillText('Load an image to begin editing', canvas.width / 2, canvas.height / 2 + 16);
})();
</script>
</body>
</html>
