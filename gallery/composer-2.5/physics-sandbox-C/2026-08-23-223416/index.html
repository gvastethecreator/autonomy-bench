<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Sandbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0e17;
    --bg-mid: #111827;
    --accent-cyan: #22d3ee;
    --accent-violet: #a78bfa;
    --accent-rose: #fb7185;
    --accent-amber: #fbbf24;
    --accent-emerald: #34d399;
    --glass: rgba(17, 24, 39, 0.72);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --shadow-glow: 0 0 40px rgba(34, 211, 238, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    user-select: none;
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── HUD ── */
  .hud {
    position: fixed;
    z-index: 10;
    pointer-events: none;
  }

  .hud > * { pointer-events: auto; }

  .title-bar {
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    background: linear-gradient(180deg, rgba(10,14,23,0.85) 0%, transparent 100%);
  }

  .title-bar h1 {
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .title-bar .subtitle {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-weight: 300;
    margin-top: 2px;
  }

  .stats {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: right;
    font-variant-numeric: tabular-nums;
    line-height: 1.5;
  }

  /* ── Toolbar ── */
  .toolbar {
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--shadow-glow), 0 8px 32px rgba(0,0,0,0.4);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .toolbar:hover { transform: translateX(-50%) translateY(-2px); }

  .tool-btn {
    position: relative;
    width: 44px; height: 44px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    font-size: 1.15rem;
  }

  .tool-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    transform: scale(1.08);
  }

  .tool-btn.active {
    background: rgba(34, 211, 238, 0.15);
    color: var(--accent-cyan);
    box-shadow: 0 0 16px rgba(34, 211, 238, 0.25);
  }

  .tool-btn .tip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--bg-mid);
    border: 1px solid var(--glass-border);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.68rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    color: var(--text);
  }

  .tool-btn:hover .tip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tool-sep {
    width: 1px;
    background: var(--glass-border);
    margin: 6px 2px;
  }

  /* ── Side panel ── */
  .panel {
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    width: 220px;
    padding: 16px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: opacity 0.4s, transform 0.4s;
  }

  .panel h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-weight: 500;
  }

  .control {
    margin-bottom: 14px;
  }

  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .control label span.val {
    color: var(--accent-cyan);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent-cyan);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
    transition: transform 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .color-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .color-swatch {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #fff; transform: scale(1.1); }

  .action-btn {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .action-btn:hover {
    background: rgba(251, 113, 133, 0.12);
    color: var(--accent-rose);
    border-color: rgba(251, 113, 133, 0.3);
  }

  /* ── Intro overlay ── */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 23, 0.92);
    backdrop-filter: blur(12px);
    transition: opacity 0.8s ease, visibility 0.8s;
  }

  .intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .intro-card {
    text-align: center;
    max-width: 420px;
    padding: 48px 40px;
    animation: fadeUp 0.8s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .intro-card h2 {
    font-size: 2rem;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet), var(--accent-rose));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .intro-card p {
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 28px;
    font-weight: 300;
  }

  .intro-card kbd {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    font-size: 0.75rem;
    font-family: inherit;
  }

  .start-btn {
    padding: 12px 36px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
    color: var(--bg-deep);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.03em;
  }

  .start-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
  }

  /* ── Collision flash ── */
  .flash-overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(circle at var(--fx,50%) var(--fy,50%), rgba(34,211,238,0.08) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.15s;
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="intro-card">
    <h2>Physics Sandbox</h2>
    <p>
      A zero-gravity playground of shapes, forces, and collisions.
      Click to spawn bodies, drag to throw, draw walls with the pen tool.
      Press <kbd>Space</kbd> to pause, <kbd>R</kbd> to reset.
    </p>
    <button class="start-btn" id="startBtn">Enter Sandbox</button>
  </div>
</div>

<div class="flash-overlay" id="flash"></div>

<div id="canvas-wrap"><canvas id="world"></canvas></div>

<div class="hud title-bar">
  <div>
    <h1>Physics Sandbox</h1>
    <div class="subtitle">Interactive 2D simulation</div>
  </div>
  <div class="stats" id="stats">
    Bodies: 0 &nbsp;|&nbsp; FPS: 60<br>
    Collisions: 0
  </div>
</div>

<div class="hud toolbar" id="toolbar">
  <button class="tool-btn active" data-tool="grab" title="Grab">
    ✋<span class="tip">Grab & Throw</span>
  </button>
  <button class="tool-btn" data-tool="box" title="Box">
    ▢<span class="tip">Spawn Box</span>
  </button>
  <button class="tool-btn" data-tool="circle" title="Circle">
    ●<span class="tip">Spawn Circle</span>
  </button>
  <button class="tool-btn" data-tool="polygon" title="Polygon">
    ⬡<span class="tip">Spawn Polygon</span>
  </button>
  <button class="tool-btn" data-tool="ball" title="Ball">
    ⚽<span class="tip">Bouncy Ball</span>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" data-tool="pen" title="Pen">
    ✏<span class="tip">Draw Walls</span>
  </button>
  <button class="tool-btn" data-tool="blast" title="Blast">
    💥<span class="tip">Explosion</span>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" data-tool="chain" title="Chain">
    ⛓<span class="tip">Chain Link</span>
  </button>
  <button class="tool-btn" data-tool="domino" title="Domino">
    ▮<span class="tip">Domino Row</span>
  </button>
</div>

<div class="hud panel">
  <h3>Environment</h3>
  <div class="control">
    <label>Gravity <span class="val" id="gravVal">0.0</span></label>
    <input type="range" id="gravity" min="0" max="2" step="0.05" value="0">
  </div>
  <div class="control">
    <label>Restitution <span class="val" id="restVal">0.85</span></label>
    <input type="range" id="restitution" min="0" max="1.2" step="0.05" value="0.85">
  </div>
  <div class="control">
    <label>Air Friction <span class="val" id="fricVal">0.01</span></label>
    <input type="range" id="friction" min="0" max="0.1" step="0.005" value="0.01">
  </div>
  <div class="control">
    <label>Spawn Size <span class="val" id="sizeVal">40</span></label>
    <input type="range" id="spawnSize" min="15" max="80" step="5" value="40">
  </div>
  <h3 style="margin-top:18px">Color</h3>
  <div class="color-row" id="colors"></div>
  <button class="action-btn" id="clearBtn">Clear All Bodies</button>
  <button class="action-btn" id="pauseBtn">Pause (Space)</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  'use strict';

  const { Engine, Render, Runner, Bodies, Body, Composite, Composites, Constraint, Mouse, MouseConstraint, Events, Vector, World } = Matter;

  // ── Palette ──
  const PALETTE = [
    { fill: '#22d3ee', glow: 'rgba(34,211,238,0.4)' },
    { fill: '#a78bfa', glow: 'rgba(167,139,250,0.4)' },
    { fill: '#fb7185', glow: 'rgba(251,113,133,0.4)' },
    { fill: '#fbbf24', glow: 'rgba(251,191,36,0.4)' },
    { fill: '#34d399', glow: 'rgba(52,211,153,0.4)' },
    { fill: '#f472b6', glow: 'rgba(244,114,182,0.4)' },
  ];
  let colorIdx = 0;

  // ── State ──
  let tool = 'grab';
  let paused = false;
  let collisionCount = 0;
  let penPoints = [];
  let isDrawing = false;
  let spawnSize = 40;
  let restitution = 0.85;
  let airFriction = 0.01;
  let trails = new Map();
  let bgParticles = [];
  let time = 0;
  let lastFpsTime = performance.now();
  let frameCount = 0;
  let fps = 60;

  // ── Engine setup ──
  const canvas = document.getElementById('world');
  const engine = Engine.create({ gravity: { x: 0, y: 0 } });
  const world = engine.world;

  const W = () => canvas.width = window.innerWidth;
  const H = () => canvas.height = window.innerHeight;
  W(); H();

  // Boundaries (soft, invisible)
  const wallOpts = { isStatic: true, render: { visible: false }, friction: 0.3, restitution: 0.6 };
  let walls = [];

  function buildWalls() {
    Composite.remove(world, walls);
    const w = canvas.width, h = canvas.height, t = 60;
    walls = [
      Bodies.rectangle(w / 2, -t / 2, w + 200, t, wallOpts),
      Bodies.rectangle(w / 2, h + t / 2, w + 200, t, wallOpts),
      Bodies.rectangle(-t / 2, h / 2, t, h + 200, wallOpts),
      Bodies.rectangle(w + t / 2, h / 2, t, h + 200, wallOpts),
    ];
    Composite.add(world, walls);
  }
  buildWalls();

  // Mouse
  const mouse = Mouse.create(canvas);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: { stiffness: 0.15, render: { visible: false } }
  });
  Composite.add(world, mouseConstraint);
  engine.gravity.scale = 0.001;

  // ── Background particles ──
  function initBgParticles() {
    bgParticles = [];
    for (let i = 0; i < 80; i++) {
      bgParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.3 + 0.1,
        angle: Math.random() * Math.PI * 2,
        alpha: Math.random() * 0.3 + 0.05,
      });
    }
  }
  initBgParticles();

  // ── Color picker UI ──
  const colorsEl = document.getElementById('colors');
  PALETTE.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c.fill;
    sw.addEventListener('click', () => {
      colorIdx = i;
      colorsEl.querySelectorAll('.color-swatch').forEach((s, j) => s.classList.toggle('active', j === i));
    });
    colorsEl.appendChild(sw);
  });

  function nextColor() {
    const c = PALETTE[colorIdx];
    colorIdx = (colorIdx + 1) % PALETTE.length;
    colorsEl.querySelectorAll('.color-swatch').forEach((s, j) => s.classList.toggle('active', j === colorIdx));
    return c;
  }

  // ── Body factory ──
  function bodyOpts(color) {
    return {
      restitution,
      friction: 0.05,
      frictionAir: airFriction,
      render: { fillStyle: color.fill },
      _color: color,
    };
  }

  function spawnBox(x, y, size) {
    const c = nextColor();
    const b = Bodies.rectangle(x, y, size, size * (0.7 + Math.random() * 0.6), {
      ...bodyOpts(c),
      chamfer: { radius: 4 },
      angle: Math.random() * Math.PI,
    });
    Composite.add(world, b);
    trails.set(b.id, []);
    return b;
  }

  function spawnCircle(x, y, r) {
    const c = nextColor();
    const b = Bodies.circle(x, y, r, bodyOpts(c));
    Composite.add(world, b);
    trails.set(b.id, []);
    return b;
  }

  function spawnPolygon(x, y, r) {
    const c = nextColor();
    const sides = 5 + Math.floor(Math.random() * 4);
    const b = Bodies.polygon(x, y, sides, r, {
      ...bodyOpts(c),
      angle: Math.random() * Math.PI,
    });
    Composite.add(world, b);
    trails.set(b.id, []);
    return b;
  }

  function spawnBall(x, y, r) {
    const c = nextColor();
    const b = Bodies.circle(x, y, r, { ...bodyOpts(c), restitution: 0.95, density: 0.002 });
    Composite.add(world, b);
    trails.set(b.id, []);
    return b;
  }

  function spawnDominoRow(x, y) {
    for (let i = 0; i < 12; i++) {
      const c = PALETTE[i % PALETTE.length];
      const b = Bodies.rectangle(x + i * 22, y, 12, 50, {
        ...bodyOpts(c),
        chamfer: { radius: 2 },
        friction: 0.4,
      });
      Composite.add(world, b);
      trails.set(b.id, []);
    }
  }

  function spawnChain(x, y) {
    const group = Body.nextGroup(true);
    const links = [];
    const linkW = 30, linkH = 14;
    for (let i = 0; i < 8; i++) {
      const c = PALETTE[i % PALETTE.length];
      const link = Bodies.rectangle(x, y + i * (linkH + 4), linkW, linkH, {
        ...bodyOpts(c),
        collisionFilter: { group },
        chamfer: { radius: 3 },
      });
      links.push(link);
      trails.set(link.id, []);
    }
    Composite.add(world, links);
    for (let i = 0; i < links.length - 1; i++) {
      const c = Constraint.create({
        bodyA: links[i], bodyB: links[i + 1],
        pointA: { x: 0, y: linkH / 2 + 2 },
        pointB: { x: 0, y: -linkH / 2 - 2 },
        stiffness: 0.9,
        render: { visible: false },
      });
      Composite.add(world, c);
    }
    // Pin top
    const pin = Constraint.create({
      bodyA: links[0],
      pointB: { x: links[0].position.x, y: links[0].position.y - 80 },
      stiffness: 0.8,
      length: 80,
      render: { visible: false },
    });
    Composite.add(world, pin);
  }

  function finishPenWall() {
    if (penPoints.length < 2) { penPoints = []; return; }
    const c = nextColor();
    for (let i = 0; i < penPoints.length - 1; i++) {
      const p1 = penPoints[i], p2 = penPoints[i + 1];
      const cx = (p1.x + p2.x) / 2, cy = (p1.y + p2.y) / 2;
      const len = Vector.magnitude(Vector.sub(p2, p1));
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const seg = Bodies.rectangle(cx, cy, len + 4, 8, {
        isStatic: true,
        angle,
        ...bodyOpts(c),
        restitution: 0.5,
        render: { fillStyle: c.fill + '99' },
      });
      Composite.add(world, seg);
    }
    penPoints = [];
  }

  function blast(x, y, power = 0.08) {
    const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
    bodies.forEach(b => {
      const dir = Vector.sub(b.position, { x, y });
      const dist = Vector.magnitude(dir) || 1;
      if (dist < 300) {
        const force = Vector.mult(Vector.normalise(dir), power * (300 - dist));
        Body.applyForce(b, b.position, force);
      }
    });
    // Visual
    const flash = document.getElementById('flash');
    flash.style.setProperty('--fx', (x / canvas.width * 100) + '%');
    flash.style.setProperty('--fy', (y / canvas.height * 100) + '%');
    flash.style.opacity = '1';
    setTimeout(() => flash.style.opacity = '0', 150);
  }

  // ── Initial scene ──
  function seedScene() {
    const cx = canvas.width / 2, cy = canvas.height / 2;
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const r = 120;
      spawnCircle(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, 20 + Math.random() * 15);
    }
    spawnBox(cx, cy, 50);
    spawnPolygon(cx - 80, cy + 60, 28);
  }

  // ── Collision events ──
  Events.on(engine, 'collisionStart', (e) => {
    collisionCount += e.pairs.length;
    e.pairs.forEach(pair => {
      const impact = Vector.magnitude(Vector.sub(
        pair.bodyA.velocity, pair.bodyB.velocity
      ));
      if (impact > 5) {
        const flash = document.getElementById('flash');
        const mx = (pair.collision.supports[0]?.x || pair.bodyA.position.x);
        const my = (pair.collision.supports[0]?.y || pair.bodyA.position.y);
        flash.style.setProperty('--fx', (mx / canvas.width * 100) + '%');
        flash.style.setProperty('--fy', (my / canvas.height * 100) + '%');
        flash.style.opacity = String(Math.min(impact / 30, 0.15));
        setTimeout(() => flash.style.opacity = '0', 80);
      }
    });
  });

  // ── Custom renderer ──
  const ctx = canvas.getContext('2d');

  function drawBackground() {
    const w = canvas.width, h = canvas.height;
    const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
    grad.addColorStop(0, '#131b2e');
    grad.addColorStop(0.5, '#0a0e17');
    grad.addColorStop(1, '#060810');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    for (let x = 0; x < w; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Ambient particles
    bgParticles.forEach(p => {
      p.x += Math.cos(p.angle) * p.speed;
      p.y += Math.sin(p.angle) * p.speed;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(34, 211, 238, ${p.alpha})`;
      ctx.fill();
    });
  }

  function drawTrails() {
    const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
    bodies.forEach(b => {
      if (!trails.has(b.id)) trails.set(b.id, []);
      const trail = trails.get(b.id);
      trail.push({ x: b.position.x, y: b.position.y });
      if (trail.length > 12) trail.shift();

      const color = b._color || PALETTE[0];
      if (trail.length > 1 && Vector.magnitude(b.velocity) > 1) {
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = color.glow;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    });
  }

  function drawBody(b) {
    if (b.isStatic && b.render?.fillStyle?.includes('99')) {
      // Pen wall segment
      ctx.save();
      ctx.translate(b.position.x, b.position.y);
      ctx.rotate(b.angle);
      const c = b._color || PALETTE[0];
      ctx.fillStyle = c.fill + '55';
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 8;
      const verts = b.vertices;
      const hw = Vector.magnitude(Vector.sub(verts[1], verts[0])) / 2;
      const hh = Vector.magnitude(Vector.sub(verts[3], verts[0])) / 2;
      ctx.fillRect(-hw, -hh, hw * 2, hh * 2);
      ctx.restore();
      return;
    }
    if (b.isStatic) return;

    const color = b._color || PALETTE[0];
    const verts = b.vertices;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();

    // Glow
    ctx.shadowColor = color.glow;
    ctx.shadowBlur = 16;

    const grad = ctx.createRadialGradient(
      b.position.x, b.position.y, 0,
      b.position.x, b.position.y,
      b.circleRadius || 30
    );
    grad.addColorStop(0, color.fill);
    grad.addColorStop(1, shadeColor(color.fill, -30));
    ctx.fillStyle = grad;
    ctx.fill();

    // Highlight edge
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Inner shine
    ctx.beginPath();
    const cx = b.position.x - (b.circleRadius || 15) * 0.25;
    const cy = b.position.y - (b.circleRadius || 15) * 0.25;
    ctx.arc(cx, cy, (b.circleRadius || 12) * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fill();

    ctx.restore();
  }

  function drawPenPreview() {
    if (penPoints.length < 1) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(penPoints[0].x, penPoints[0].y);
    for (let i = 1; i < penPoints.length; i++) ctx.lineTo(penPoints[i].x, penPoints[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawConstraints() {
    const constraints = Composite.allConstraints(world);
    constraints.forEach(c => {
      if (!c.bodyA || !c.pointB) return;
      const a = c.bodyA.position;
      const b = c.pointB;
      ctx.beginPath();
      ctx.moveTo(a.x + (c.pointA?.x || 0), a.y + (c.pointA?.y || 0));
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(167, 139, 250, 0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }

  function shadeColor(hex, amt) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  function render() {
    if (paused) return;
    Engine.update(engine, 1000 / 60);
    time += 0.016;

    drawBackground();
    drawTrails();
    drawConstraints();

    Composite.allBodies(world).forEach(drawBody);
    drawPenPreview();

    // Stats
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fps = frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
    const bodyCount = Composite.allBodies(world).filter(b => !b.isStatic).length;
    document.getElementById('stats').innerHTML =
      `Bodies: ${bodyCount} &nbsp;|&nbsp; FPS: ${fps}<br>Collisions: ${collisionCount}`;
  }

  // ── Render loop ──
  function loop() {
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ── Input ──
  canvas.addEventListener('mousedown', (e) => {
    if (tool === 'pen') {
      isDrawing = true;
      penPoints = [{ x: e.clientX, y: e.clientY }];
      return;
    }
    if (tool === 'grab') return;

    const x = e.clientX, y = e.clientY;
    switch (tool) {
      case 'box': spawnBox(x, y, spawnSize); break;
      case 'circle': spawnCircle(x, y, spawnSize * 0.5); break;
      case 'polygon': spawnPolygon(x, y, spawnSize * 0.55); break;
      case 'ball': spawnBall(x, y, spawnSize * 0.45); break;
      case 'blast': blast(x, y); break;
      case 'chain': spawnChain(x, y); break;
      case 'domino': spawnDominoRow(x, y); break;
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if (tool === 'pen' && isDrawing) {
      const last = penPoints[penPoints.length - 1];
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      if (dx * dx + dy * dy > 36) {
        penPoints.push({ x: e.clientX, y: e.clientY });
      }
    }
  });

  canvas.addEventListener('mouseup', () => {
    if (tool === 'pen' && isDrawing) {
      isDrawing = false;
      finishPenWall();
    }
  });

  // Touch support
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    canvas.dispatchEvent(new MouseEvent('mouseup', {}));
  });

  // ── Toolbar ──
  document.getElementById('toolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('.tool-btn');
    if (!btn) return;
    tool = btn.dataset.tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b === btn));
    mouseConstraint.constraint.stiffness = tool === 'grab' ? 0.15 : 0;
  });

  // ── Controls ──
  document.getElementById('gravity').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    engine.gravity.y = v;
    document.getElementById('gravVal').textContent = v.toFixed(2);
  });

  document.getElementById('restitution').addEventListener('input', (e) => {
    restitution = parseFloat(e.target.value);
    document.getElementById('restVal').textContent = restitution.toFixed(2);
  });

  document.getElementById('friction').addEventListener('input', (e) => {
    airFriction = parseFloat(e.target.value);
    document.getElementById('fricVal').textContent = airFriction.toFixed(3);
  });

  document.getElementById('spawnSize').addEventListener('input', (e) => {
    spawnSize = parseInt(e.target.value);
    document.getElementById('sizeVal').textContent = spawnSize;
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    const toRemove = Composite.allBodies(world).filter(b => !b.isStatic && !walls.includes(b));
    Composite.remove(world, toRemove);
    Composite.allConstraints(world).forEach(c => Composite.remove(world, c));
    trails.clear();
    collisionCount = 0;
  });

  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  function togglePause() {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'Resume (Space)' : 'Pause (Space)';
  }

  // ── Keyboard ──
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.code === 'KeyR') {
      document.getElementById('clearBtn').click();
      seedScene();
    }
  });

  // ── Resize ──
  window.addEventListener('resize', () => {
    W(); H();
    buildWalls();
    initBgParticles();
  });

  // ── Intro ──
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('intro').classList.add('hidden');
    seedScene();
  });

})();
</script>
</body>
</html>
