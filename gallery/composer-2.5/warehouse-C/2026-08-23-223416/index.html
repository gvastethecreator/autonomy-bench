<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Flow — Logistics Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --panel: rgba(12, 18, 28, 0.82);
    --accent: #f0a030;
    --accent-dim: #c07820;
    --cyan: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: rgba(240, 160, 48, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Outfit', sans-serif;
    color: var(--text);
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Intro overlay */
  #intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #141c2a 0%, #080c12 70%);
    z-index: 100;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #intro h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }
  #intro p {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 2.5rem;
    font-weight: 300;
  }
  #start-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    padding: 0.85rem 2.5rem;
    border: 1px solid var(--accent);
    background: rgba(240, 160, 48, 0.08);
    color: var(--accent);
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.25s;
  }
  #start-btn:hover {
    background: var(--accent);
    color: #0a0e14;
    box-shadow: 0 0 30px rgba(240, 160, 48, 0.35);
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1.2rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transform: translateY(-12px);
    transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
  }
  #hud.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .hud-panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .brand-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  .brand span {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }
  .brand small {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 1.5rem;
  }
  .stat {
    text-align: center;
    min-width: 70px;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 600;
    line-height: 1;
    transition: color 0.3s;
  }
  .stat-value.pulse { animation: pulse 0.4s ease; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); color: var(--green); }
  }
  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.25rem;
  }

  #clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    color: var(--cyan);
  }

  /* Bottom bar */
  #bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: center;
    gap: 2rem;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease 0.5s, transform 0.6s ease 0.5s;
  }
  #bottom-bar.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.4rem 0.9rem;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* Speed control */
  #speed-control {
    position: absolute;
    bottom: 1.2rem;
    right: 1.5rem;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.6s ease 0.6s;
    pointer-events: none;
  }
  #speed-control.visible { opacity: 1; pointer-events: auto; }
  #speed-control button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.5rem 0.8rem;
    margin-left: 0.3rem;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  #speed-control button.active,
  #speed-control button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="intro">
    <h1>Warehouse Flow</h1>
    <p>Incoming trucks → workers → outgoing trucks</p>
    <button id="start-btn">Start Simulation</button>
  </div>

  <div id="hud">
    <div class="hud-panel brand">
      <div class="brand-icon">⬡</div>
      <div>
        <span>Warehouse Flow</span>
        <small>Logistics Hub · Shift Active</small>
      </div>
    </div>
    <div class="hud-panel stats">
      <div class="stat">
        <div class="stat-value" id="stat-in">0</div>
        <div class="stat-label">Received</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-stored">0</div>
        <div class="stat-label">In Storage</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-out">0</div>
        <div class="stat-label">Shipped</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-workers">0</div>
        <div class="stat-label">Workers</div>
      </div>
    </div>
    <div class="hud-panel">
      <div id="clock">06:00</div>
    </div>
  </div>

  <div id="bottom-bar">
    <div class="legend-item"><div class="legend-dot" style="background:#f0a030"></div>Incoming Dock</div>
    <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div>Storage Racks</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Outgoing Dock</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>Workers</div>
  </div>

  <div id="speed-control">
    <button data-speed="0.5">0.5×</button>
    <button data-speed="1" class="active">1×</button>
    <button data-speed="2">2×</button>
    <button data-speed="4">4×</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Config ---
  const COLS = 18, ROWS = 12;
  let tileW = 48, tileH = 24;
  let originX = 0, originY = 0;
  let speedMul = 1;
  let running = false;
  let simTime = 6 * 3600; // 6 AM in seconds
  let stats = { in: 0, stored: 0, out: 0 };

  const PACKAGE_COLORS = ['#e879f9','#38bdf8','#4ade80','#fb923c','#a78bfa','#f472b6','#2dd4bf'];

  // --- Grid helpers (isometric) ---
  function gridToScreen(col, row) {
    return {
      x: originX + (col - row) * (tileW / 2),
      y: originY + (col + row) * (tileH / 2)
    };
  }

  function updateLayout() {
    tileW = Math.min(W / (COLS + ROWS + 2) * 1.8, 56);
    tileH = tileW * 0.5;
    originX = W / 2 - (COLS - ROWS) * tileW / 4;
    originY = H * 0.18;
  }
  updateLayout();
  window.addEventListener('resize', updateLayout);

  // --- Tile types ---
  const TILE = { FLOOR: 0, INCOMING: 1, OUTGOING: 2, RACK: 3, PATH: 4 };

  function buildMap() {
    const map = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE.FLOOR));
    // Incoming dock (left)
    for (let r = 2; r <= 9; r++) map[r][1] = TILE.INCOMING;
    for (let r = 2; r <= 9; r++) map[r][2] = TILE.PATH;
    // Outgoing dock (right)
    for (let r = 2; r <= 9; r++) map[r][COLS - 2] = TILE.OUTGOING;
    for (let r = 2; r <= 9; r++) map[r][COLS - 3] = TILE.PATH;
    // Storage racks (center columns)
    for (let c = 5; c <= 12; c++) {
      for (let r = 1; r <= ROWS - 2; r++) {
        if ((c + r) % 2 === 0) map[r][c] = TILE.RACK;
      }
    }
    // Main aisles
    for (let c = 3; c < COLS - 3; c++) {
      map[5][c] = TILE.PATH;
      map[6][c] = TILE.PATH;
    }
    for (let r = 2; r <= 9; r++) {
      map[r][4] = TILE.PATH;
      map[r][13] = TILE.PATH;
    }
    return map;
  }
  const map = buildMap();

  // --- Pathfinding (BFS) ---
  function findPath(start, end) {
    const key = (c, r) => `${c},${r}`;
    const walkable = (c, r) =>
      c >= 0 && c < COLS && r >= 0 && r < ROWS &&
      map[r][c] !== TILE.RACK;

    const queue = [{ c: start.c, r: start.r, path: [] }];
    const visited = new Set([key(start.c, start.r)]);

    while (queue.length) {
      const { c, r, path } = queue.shift();
      if (c === end.c && r === end.r) return path;
      for (const [dc, dr] of [[0,1],[0,-1],[1,0],[-1,0]]) {
        const nc = c + dc, nr = r + dr;
        const k = key(nc, nr);
        if (walkable(nc, nr) && !visited.has(k)) {
          visited.add(k);
          queue.push({ c: nc, r: nr, path: [...path, { c: nc, r: nr }] });
        }
      }
    }
    return [];
  }

  // --- Entities ---
  class Package {
    constructor(col, row, color) {
      this.col = col;
      this.row = row;
      this.color = color;
      this.targetCol = col;
      this.targetRow = row;
      this.progress = 1;
      this.onRack = false;
      this.rackSlot = null;
      this.scale = 0;
      this.spawnAnim = 0;
    }

    update(dt) {
      if (this.spawnAnim < 1) {
        this.spawnAnim = Math.min(1, this.spawnAnim + dt * 3);
        this.scale = easeOutBack(this.spawnAnim);
      }
      if (this.progress < 1) {
        this.progress = Math.min(1, this.progress + dt * 4 * speedMul);
      } else {
        this.col = this.targetCol;
        this.row = this.targetRow;
      }
    }

    getScreenPos() {
      const from = gridToScreen(this.col, this.row);
      const to = gridToScreen(this.targetCol, this.targetRow);
      const t = easeInOutCubic(this.progress);
      return {
        x: from.x + (to.x - from.x) * t,
        y: from.y + (to.y - from.y) * t
      };
    }
  }

  class Worker {
    constructor(id, col, row) {
      this.id = id;
      this.col = col;
      this.row = row;
      this.targetCol = col;
      this.targetRow = row;
      this.progress = 1;
      this.path = [];
      this.state = 'idle'; // idle, toPickup, carrying, toDrop, toRack, fromRack
      this.package = null;
      this.targetPackage = null;
      this.targetTruck = null;
      this.idleTimer = Math.random() * 2;
      this.bobPhase = Math.random() * Math.PI * 2;
      this.dir = 1;
      this.hatColor = ['#a78bfa','#38bdf8','#f472b6','#4ade80','#fb923c','#e879f9'][id % 6];
    }

    update(dt, packages, trucks, racks) {
      this.bobPhase += dt * 4 * speedMul;

      if (this.progress < 1) {
        this.progress = Math.min(1, this.progress + dt * 3.5 * speedMul);
        if (this.progress >= 1) {
          this.col = this.targetCol;
          this.row = this.targetRow;
          this.onPathStep(packages, trucks, racks);
        }
        return;
      }

      if (this.state === 'idle') {
        this.idleTimer -= dt;
        if (this.idleTimer <= 0) this.decide(packages, trucks, racks);
        return;
      }

      if (this.state === 'carrying') {
        // Wait at destination handled by onPathStep
      }
    }

    onPathStep(packages, trucks, racks) {
      if (this.path.length > 0) {
        const next = this.path.shift();
        this.targetCol = next.c;
        this.targetRow = next.r;
        this.progress = 0;
        this.dir = next.c > this.col ? 1 : next.c < this.col ? -1 : this.dir;
        return;
      }

      // Arrived at destination
      if (this.state === 'toPickup' && this.targetPackage) {
        const pkg = this.targetPackage;
        if (pkg.col === this.col && pkg.row === this.row) {
          this.package = pkg;
          pkg.carriedBy = null;
          this.targetPackage = null;
          this.state = 'carrying';
          // Decide drop: rack or outgoing
          const outTruck = trucks.find(t => t.type === 'out' && t.waiting && t.packages.length < t.capacity);
          if (outTruck && Math.random() > 0.3) {
            this.targetTruck = outTruck;
            this.path = findPath({ c: this.col, r: this.row }, { c: outTruck.dockCol, r: outTruck.dockRow });
            this.state = 'toDrop';
          } else {
            const slot = racks.findEmpty();
            if (slot) {
              slot.reserve(this.package);
              this.rackTarget = slot;
              this.path = findPath({ c: this.col, r: this.row }, { c: slot.col, r: slot.row });
              this.state = 'toRack';
            } else {
              this.package = null;
              this.state = 'idle';
              this.idleTimer = 0.5;
            }
          }
        }
      } else if (this.state === 'toDrop' && this.targetTruck) {
        this.targetTruck.loadPackage(this.package);
        this.package = null;
        this.targetTruck = null;
        this.state = 'idle';
        this.idleTimer = 0.3 + Math.random();
        stats.out++;
        pulseStat('stat-out');
      } else if (this.state === 'toRack' && this.rackTarget) {
        this.rackTarget.store(this.package);
        this.package = null;
        this.rackTarget = null;
        this.state = 'idle';
        this.idleTimer = 0.3 + Math.random();
        stats.stored++;
        pulseStat('stat-stored');
      } else if (this.state === 'fromRack' && this.targetTruck) {
        this.targetTruck.loadPackage(this.package);
        this.package = null;
        this.targetTruck = null;
        this.state = 'idle';
        this.idleTimer = 0.3 + Math.random();
        stats.out++;
        stats.stored = Math.max(0, stats.stored - 1);
        pulseStat('stat-out');
      } else if (this.state === 'carrying') {
        // fallback
        this.state = 'idle';
        this.idleTimer = 0.5;
      }
    }

    decide(packages, trucks, racks) {
      // Priority 1: unload incoming truck packages
      const loosePackages = packages.filter(p => !p.onRack && !p.carriedBy);
      if (loosePackages.length > 0) {
        const nearest = loosePackages.reduce((best, p) => {
          const d = Math.abs(p.col - this.col) + Math.abs(p.row - this.row);
          return d < best.d ? { p, d } : best;
        }, { p: null, d: Infinity });
        if (nearest.p) {
          nearest.p.carriedBy = this;
          this.targetPackage = nearest.p;
          this.path = findPath({ c: this.col, r: this.row }, { c: nearest.p.col, r: nearest.p.row });
          if (this.path.length > 0) {
            this.state = 'toPickup';
            return;
          }
          nearest.p.carriedBy = null;
          this.targetPackage = null;
        }
      }

      // Priority 2: load outgoing truck from rack
      const outTruck = trucks.find(t => t.type === 'out' && t.waiting && t.packages.length < t.capacity);
      if (outTruck) {
        const slot = racks.findOccupied();
        if (slot) {
          const pkg = slot.take();
          this.package = pkg;
          this.targetTruck = outTruck;
          this.path = findPath({ c: this.col, r: this.row }, { c: outTruck.dockCol, r: outTruck.dockRow });
          this.state = 'fromRack';
          return;
        }
      }

      this.idleTimer = 0.5 + Math.random() * 1.5;
    }

    getScreenPos() {
      const from = gridToScreen(this.col, this.row);
      const to = gridToScreen(this.targetCol, this.targetRow);
      const t = easeInOutCubic(this.progress);
      const bob = Math.sin(this.bobPhase) * 2;
      return {
        x: from.x + (to.x - from.x) * t,
        y: from.y + (to.y - from.y) * t + bob
      };
    }
  }

  class Truck {
    constructor(type, dockCol, dockRow, lane) {
      this.type = type; // 'in' or 'out'
      this.dockCol = dockCol;
      this.dockRow = dockRow;
      this.lane = lane;
      this.packages = [];
      this.capacity = 6;
      this.waiting = false;
      this.timer = 0;
      this.arriveProgress = 0;
      this.departProgress = 0;
      this.state = 'approaching'; // approaching, docked, departing, gone
      this.color = type === 'in' ? '#f0a030' : '#4ade80';
      this.unloadIndex = 0;
      this.unloadTimer = 0;
    }

    update(dt, packages) {
      if (this.state === 'approaching') {
        this.arriveProgress = Math.min(1, this.arriveProgress + dt * 0.8 * speedMul);
        if (this.arriveProgress >= 1) {
          this.state = 'docked';
          this.waiting = true;
          this.timer = 0;
        }
      } else if (this.state === 'docked') {
        this.timer += dt * speedMul;
        if (this.type === 'in') {
          this.unloadTimer -= dt;
          if (this.unloadTimer <= 0 && this.unloadIndex < this.capacity) {
            this.unloadTimer = 0.6 + Math.random() * 0.4;
            const pos = gridToScreen(this.dockCol, this.dockRow);
            const pkg = new Package(this.dockCol, this.dockRow, PACKAGE_COLORS[this.unloadIndex % PACKAGE_COLORS.length]);
            packages.push(pkg);
            this.packages.push(pkg);
            this.unloadIndex++;
            stats.in++;
            pulseStat('stat-in');
            spawnParticles(pos.x, pos.y - 20, this.color, 4);
          }
          if (this.unloadIndex >= this.capacity && this.timer > 3) {
            const remaining = packages.filter(p =>
              Math.abs(p.col - this.dockCol) <= 1 && Math.abs(p.row - this.dockRow) <= 1 && !p.onRack && !p.carriedBy
            );
            if (remaining.length === 0) this.depart();
          }
        } else {
          if (this.packages.length >= this.capacity || this.timer > 12) {
            this.depart();
          }
        }
      } else if (this.state === 'departing') {
        this.departProgress = Math.min(1, this.departProgress + dt * 0.6 * speedMul);
        if (this.departProgress >= 1) this.state = 'gone';
      }
    }

    depart() {
      this.state = 'departing';
      this.waiting = false;
      this.departProgress = 0;
      const pos = gridToScreen(this.dockCol, this.dockRow);
      spawnParticles(pos.x, pos.y, this.color, 8);
    }

    loadPackage(pkg) {
      this.packages.push(pkg);
      const idx = allPackages.indexOf(pkg);
      if (idx >= 0) allPackages.splice(idx, 1);
      const pos = gridToScreen(this.dockCol, this.dockRow);
      spawnParticles(pos.x, pos.y - 10, pkg.color, 6);
    }

    getOffset() {
      const base = gridToScreen(this.dockCol, this.dockRow);
      const laneOffset = this.lane * 30;
      if (this.type === 'in') {
        const off = (1 - this.arriveProgress) * 200 + (this.departProgress * 200);
        return { x: base.x - 80 - off - laneOffset, y: base.y - 40 };
      } else {
        const off = (1 - this.arriveProgress) * 200 + (this.departProgress * 200);
        return { x: base.x + 80 + off + laneOffset, y: base.y - 40 };
      }
    }
  }

  class RackSlot {
    constructor(col, row) {
      this.col = col;
      this.row = row;
      this.package = null;
      this.reserved = false;
    }
    reserve(pkg) { this.reserved = true; this.pending = pkg; }
    store(pkg) { this.package = pkg; pkg.onRack = true; pkg.rackSlot = this; this.reserved = false; pkg.targetCol = this.col; pkg.targetRow = this.row; pkg.progress = 0; }
    take() { const p = this.package; this.package = null; if (p) { p.onRack = false; p.rackSlot = null; } return p; }
    isEmpty() { return !this.package && !this.reserved; }
    isOccupied() { return !!this.package; }
  }

  class RackManager {
    constructor() {
      this.slots = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (map[r][c] === TILE.RACK) this.slots.push(new RackSlot(c, r));
        }
      }
    }
    findEmpty() { return this.slots.find(s => s.isEmpty()) || null; }
    findOccupied() { return this.slots.find(s => s.isOccupied()) || null; }
  }

  // --- Particles ---
  const particles = [];
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 80,
        vy: -Math.random() * 60 - 20,
        life: 1,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  // --- Dust motes (ambient) ---
  const dust = Array.from({ length: 40 }, () => ({
    x: Math.random(), y: Math.random(),
    speed: 0.02 + Math.random() * 0.04,
    size: 1 + Math.random() * 2,
    alpha: 0.1 + Math.random() * 0.2
  }));

  // --- Easing ---
  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
  function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2); }

  // --- State ---
  let allPackages = [];
  let workers = [];
  let trucks = [];
  let racks;
  let truckSpawnTimer = 0;
  let ambientPhase = 0;

  function initSimulation() {
    racks = new RackManager();
    workers = [];
    const spawnPoints = [{c:3,r:3},{c:3,r:6},{c:3,r:9},{c:14,r:3},{c:14,r:6},{c:14,r:9},{c:8,r:3},{c:8,r:9}];
    spawnPoints.forEach((p, i) => workers.push(new Worker(i, p.c, p.r)));

    trucks = [];
    allPackages = [];
    stats = { in: 0, stored: 0, out: 0 };
    truckSpawnTimer = 0;
    simTime = 6 * 3600;

    // Initial trucks
    spawnTruck('in', 2);
    spawnTruck('out', 3);
    setTimeout(() => spawnTruck('in', 5), 2000);
    setTimeout(() => spawnTruck('out', 7), 3500);

    updateStats();
  }

  function spawnTruck(type, row) {
    const dockCol = type === 'in' ? 1 : COLS - 2;
    const lane = trucks.filter(t => t.type === type && t.state !== 'gone').length;
    trucks.push(new Truck(type, dockCol, row, lane));
  }

  function pulseStat(id) {
    const el = document.getElementById(id);
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  function updateStats() {
    document.getElementById('stat-in').textContent = stats.in;
    document.getElementById('stat-stored').textContent = stats.stored;
    document.getElementById('stat-out').textContent = stats.out;
    document.getElementById('stat-workers').textContent = workers.length;
    const h = Math.floor(simTime / 3600);
    const m = Math.floor((simTime % 3600) / 60);
    document.getElementById('clock').textContent =
      `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  // --- Drawing ---
  function drawTile(col, row, type) {
    const { x, y } = gridToScreen(col, row);
    const hw = tileW / 2, hh = tileH / 2;

    let top, left, right, bottom;
    switch (type) {
      case TILE.INCOMING:
        top = '#3d3020'; left = '#2a2218'; right = '#4a3828'; bottom = '#1e1810';
        break;
      case TILE.OUTGOING:
        top = '#1a3028'; left = '#122820'; right = '#224038'; bottom = '#0e2018';
        break;
      case TILE.RACK:
        top = '#1e2838'; left = '#141e2c'; right = '#283448'; bottom = '#0e1620';
        break;
      case TILE.PATH:
        top = '#222830'; left = '#181e26'; right = '#2c343e'; bottom = '#12161c';
        break;
      default:
        top = '#1a1e26'; left = '#12161c'; right = '#222830'; bottom = '#0e1218';
    }

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + hw, y + hh);
    ctx.lineTo(x, y + tileH);
    ctx.lineTo(x - hw, y + hh);
    ctx.closePath();
    ctx.fillStyle = top;
    ctx.fill();

    // Left face
    ctx.beginPath();
    ctx.moveTo(x - hw, y + hh);
    ctx.lineTo(x, y + tileH);
    ctx.lineTo(x, y + tileH + hh * 0.6);
    ctx.lineTo(x - hw, y + hh + hh * 0.6);
    ctx.closePath();
    ctx.fillStyle = left;
    ctx.fill();

    // Right face
    ctx.beginPath();
    ctx.moveTo(x + hw, y + hh);
    ctx.lineTo(x, y + tileH);
    ctx.lineTo(x, y + tileH + hh * 0.6);
    ctx.lineTo(x + hw, y + hh + hh * 0.6);
    ctx.closePath();
    ctx.fillStyle = right;
    ctx.fill();

    // Path markings
    if (type === TILE.PATH) {
      ctx.strokeStyle = 'rgba(240,160,48,0.08)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(x - hw * 0.5, y + hh * 0.8);
      ctx.lineTo(x + hw * 0.5, y + hh * 1.2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawRack(col, row) {
    const { x, y } = gridToScreen(col, row);
    const hw = tileW * 0.35, hh = tileH * 0.5;
    const h = 28;

    // Rack structure
    ctx.fillStyle = '#3a4555';
    ctx.fillRect(x - hw, y - h, hw * 2, h);

    ctx.fillStyle = '#4a5568';
    ctx.fillRect(x - hw + 2, y - h + 4, hw * 2 - 4, 4);
    ctx.fillRect(x - hw + 2, y - h + 14, hw * 2 - 4, 4);

    // Side posts
    ctx.fillStyle = '#2a3444';
    ctx.fillRect(x - hw, y - h, 3, h);
    ctx.fillRect(x + hw - 3, y - h, 3, h);
  }

  function drawPackage(x, y, color, scale = 1, height = 0) {
    const s = 10 * scale;
    const py = y - height;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, s * 0.8, s * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Box
    ctx.fillStyle = color;
    ctx.fillRect(x - s/2, py - s, s, s);

    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(x - s/2, py - s, s, s * 0.3);

    // Tape
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x - 1, py - s, 2, s);
    ctx.fillRect(x - s/2, py - s/2 - 1, s, 2);
  }

  function drawWorker(x, y, worker) {
    const s = 14;
    const carrying = worker.package !== null;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 4, s * 0.7, s * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.ellipse(x, y - s * 0.3, s * 0.35, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Vest
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(x - s * 0.3, y - s * 0.7, s * 0.6, s * 0.45);

    // Head
    ctx.fillStyle = '#fcd9b6';
    ctx.beginPath();
    ctx.arc(x, y - s * 0.85, s * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // Hard hat
    ctx.fillStyle = worker.hatColor;
    ctx.beginPath();
    ctx.arc(x, y - s * 1.05, s * 0.32, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x - s * 0.32, y - s * 1.05, s * 0.64, 3);

    // Carried package
    if (carrying) {
      drawPackage(x, y - s * 1.5, worker.package.color, 0.7, 0);
    }

    // Legs animation
    const legSwing = Math.sin(worker.bobPhase * 2) * 3;
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 3, y - 2);
    ctx.lineTo(x - 3 + legSwing, y + 4);
    ctx.moveTo(x + 3, y - 2);
    ctx.lineTo(x + 3 - legSwing, y + 4);
    ctx.stroke();
  }

  function drawTruck(truck) {
    const pos = truck.getOffset();
    const x = pos.x, y = pos.y;
    const w = 90, h = 40;
    const isIn = truck.type === 'in';

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h + 4, w * 0.45, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Trailer
    ctx.fillStyle = isIn ? '#c07820' : '#2d8a50';
    ctx.fillRect(x + 20, y + 5, w - 30, h - 10);

    // Stripe
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 20, y + h/2 - 2, w - 30, 4);

    // Cab
    ctx.fillStyle = isIn ? '#8a5a18' : '#1a6038';
    ctx.beginPath();
    ctx.moveTo(x, y + 10);
    ctx.lineTo(x + 22, y + 5);
    ctx.lineTo(x + 22, y + h - 5);
    ctx.lineTo(x, y + h - 2);
    ctx.closePath();
    ctx.fill();

    // Windshield
    ctx.fillStyle = 'rgba(100,180,220,0.5)';
    ctx.fillRect(x + 3, y + 12, 14, 14);

    // Wheels
    ctx.fillStyle = '#1a1a1a';
    [x + 15, x + 35, x + w - 25, x + w - 10].forEach(wx => {
      ctx.beginPath();
      ctx.arc(wx, y + h - 2, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#444';
      ctx.beginPath();
      ctx.arc(wx, y + h - 2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1a1a';
    });

    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `600 ${Math.max(9, tileW * 0.18)}px Outfit, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(isIn ? 'INBOUND' : 'OUTBOUND', x + w/2 + 5, y + h/2 + 3);

    // Loaded packages visible in trailer
    truck.packages.forEach((pkg, i) => {
      const px = x + 28 + (i % 3) * 16;
      const py = y + 10 + Math.floor(i / 3) * 14;
      drawPackage(px, py + 10, pkg.color || '#888', 0.55, 10);
    });

    // Dock indicator
    if (truck.waiting) {
      ctx.fillStyle = isIn ? 'rgba(240,160,48,0.6)' : 'rgba(74,222,128,0.6)';
      ctx.beginPath();
      ctx.arc(x + w/2, y - 8, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0c1420');
    grad.addColorStop(0.4, '#101820');
    grad.addColorStop(1, '#0a0e14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Ambient light cone
    ambientPhase += 0.003 * speedMul;
    const lx = W/2 + Math.sin(ambientPhase) * 60;
    const lightGrad = ctx.createRadialGradient(lx, H * 0.3, 0, lx, H * 0.3, W * 0.6);
    lightGrad.addColorStop(0, 'rgba(240,160,48,0.04)');
    lightGrad.addColorStop(1, 'rgba(240,160,48,0)');
    ctx.fillStyle = lightGrad;
    ctx.fillRect(0, 0, W, H);

    // Dust
    dust.forEach(d => {
      d.y -= d.speed * speedMul * 0.016;
      if (d.y < 0) { d.y = 1; d.x = Math.random(); }
      ctx.fillStyle = `rgba(240,200,120,${d.alpha})`;
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawZoneLabels() {
    ctx.font = `500 ${Math.max(10, tileW * 0.22)}px Outfit, sans-serif`;
    ctx.textAlign = 'center';

    const inPos = gridToScreen(1, 0);
    ctx.fillStyle = 'rgba(240,160,48,0.5)';
    ctx.fillText('INCOMING DOCK', inPos.x - 20, inPos.y - 20);

    const outPos = gridToScreen(COLS - 2, 0);
    ctx.fillStyle = 'rgba(74,222,128,0.5)';
    ctx.fillText('OUTGOING DOCK', outPos.x + 20, outPos.y - 20);

    const storPos = gridToScreen(8, 0);
    ctx.fillStyle = 'rgba(56,189,248,0.4)';
    ctx.fillText('STORAGE', storPos.x, storPos.y - 30);
  }

  function drawSortEntities() {
    const entities = [];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === TILE.RACK) {
          entities.push({ sort: r + c, draw: () => drawRack(c, r) });
        }
      }
    }

    allPackages.forEach(pkg => {
      if (!pkg.carriedBy) {
        const pos = pkg.getScreenPos();
        entities.push({
          sort: pkg.row + pkg.col + (pkg.onRack ? 0.1 : 0.5),
          draw: () => drawPackage(pos.x, pos.y, pkg.color, pkg.scale || 1, pkg.onRack ? 18 : 8)
        });
      }
    });

    workers.forEach(w => {
      const pos = w.getScreenPos();
      entities.push({
        sort: w.row + w.col + 0.8,
        draw: () => drawWorker(pos.x, pos.y, w)
      });
    });

    trucks.filter(t => t.state !== 'gone').forEach(t => {
      entities.push({
        sort: t.dockRow + t.dockCol,
        draw: () => drawTruck(t)
      });
    });

    entities.sort((a, b) => a.sort - b.sort);
    entities.forEach(e => e.draw());
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt * speedMul;
      p.y += p.vy * dt * speedMul;
      p.vy += 120 * dt;
      p.life -= dt * 1.5;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // --- Main loop ---
  let lastTime = 0;
  function loop(timestamp) {
    requestAnimationFrame(loop);
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (!running) {
      drawBackground();
      // Draw preview map
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          drawTile(c, r, map[r][c]);
      drawZoneLabels();
      return;
    }

    updateLayout();

    // Update simulation
    simTime += dt * 60 * speedMul;
    if (simTime >= 18 * 3600) simTime = 6 * 3600;

    truckSpawnTimer += dt * speedMul;
    if (truckSpawnTimer > 8) {
      truckSpawnTimer = 0;
      const inCount = trucks.filter(t => t.type === 'in' && t.state !== 'gone').length;
      const outCount = trucks.filter(t => t.type === 'out' && t.state !== 'gone').length;
      if (inCount < 3) spawnTruck('in', 2 + Math.floor(Math.random() * 7));
      if (outCount < 3) spawnTruck('out', 2 + Math.floor(Math.random() * 7));
    }

    trucks.forEach(t => t.update(dt, allPackages));
    trucks = trucks.filter(t => t.state !== 'gone');

    allPackages.forEach(p => p.update(dt));
    workers.forEach(w => w.update(dt, allPackages, trucks, racks));

    updateStats();

    // Draw
    drawBackground();

    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        drawTile(c, r, map[r][c]);

    drawZoneLabels();
    drawSortEntities();
    drawParticles(dt);

    // Vignette
    const vig = ctx.createRadialGradient(W/2, H/2, W * 0.3, W/2, H/2, W * 0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(loop);

  // --- Controls ---
  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('hud').classList.add('visible');
    document.getElementById('bottom-bar').classList.add('visible');
    document.getElementById('speed-control').classList.add('visible');
    initSimulation();
    running = true;
  });

  document.querySelectorAll('#speed-control button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#speed-control button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      speedMul = parseFloat(btn.dataset.speed);
    });
  });

})();
</script>
</body>
</html>
