<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Night Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hud {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 200, 120, 0.85); font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 0.15em; text-shadow: 0 0 8px rgba(255, 160, 60, 0.6);
      pointer-events: none; user-select: none; text-align: center;
    }
    #speed { font-size: 28px; font-weight: bold; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="speed">0</div>
    <div>MPH &nbsp;·&nbsp; ENDLESS NIGHT DRIVE</div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ── Scene setup ──────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);
    scene.fog = new THREE.FogExp2(0x080818, 0.012);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 800);
    camera.position.set(0, 1.35, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.35, 0.82);
    composer.addPass(bloom);

    // ── Constants ────────────────────────────────────────────────
    const SEG_LEN = 40;
    const SEG_COUNT = 24;
    const ROAD_W = 7;
    const LANE_W = ROAD_W / 2;
    let speed = 0;
    const MAX_SPEED = 1.4;
    const ACCEL = 0.008;
    const DECEL = 0.004;
    let steer = 0;
    let carX = 0;
    let distance = 0;
    let time = 0;

    // ── Sky dome with stars ──────────────────────────────────────
    function makeSky() {
      const geo = new THREE.SphereGeometry(400, 32, 16);
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#020210');
      grad.addColorStop(0.35, '#0a0a28');
      grad.addColorStop(0.55, '#121230');
      grad.addColorStop(0.72, '#1a1030');
      grad.addColorStop(1, '#0d0818');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);
      for (let i = 0; i < 1800; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 280;
        const r = Math.random() * 1.2 + 0.2;
        const a = Math.random() * 0.5 + 0.3;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      // Moon
      ctx.fillStyle = 'rgba(240, 235, 210, 0.9)';
      ctx.beginPath();
      ctx.arc(780, 90, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(200, 195, 170, 0.15)';
      ctx.beginPath();
      ctx.arc(790, 82, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(770, 98, 4, 0, Math.PI * 2);
      ctx.fill();
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false });
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
    }
    makeSky();

    // ── Moon glow ────────────────────────────────────────────────
    const moonGlow = new THREE.PointLight(0xaabbee, 0.35, 300);
    moonGlow.position.set(60, 80, -120);
    scene.add(moonGlow);

    // ── Ambient + headlights ─────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x1a1a30, 0.6));
    const headLight = new THREE.SpotLight(0xfff0d0, 12, 80, 0.55, 0.6, 1.2);
    headLight.position.set(0, 1.2, -0.5);
    headLight.target.position.set(0, 0.5, -30);
    camera.add(headLight, headLight.target);
    scene.add(camera);

    // ── Road segments (recycled) ─────────────────────────────────
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    function makeRoadSegment() {
      const g = new THREE.Group();
      const asphalt = new THREE.Mesh(
        new THREE.PlaneGeometry(ROAD_W + 4, SEG_LEN),
        new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.95 })
      );
      asphalt.rotation.x = -Math.PI / 2;
      asphalt.receiveShadow = true;
      g.add(asphalt);

      // Shoulders
      for (const side of [-1, 1]) {
        const shoulder = new THREE.Mesh(
          new THREE.PlaneGeometry(3, SEG_LEN),
          new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 1 })
        );
        shoulder.rotation.x = -Math.PI / 2;
        shoulder.position.set(side * (ROAD_W / 2 + 1.5), 0.01, 0);
        g.add(shoulder);
      }

      // Center dashed line
      const dashCount = 8;
      for (let i = 0; i < dashCount; i++) {
        const dash = new THREE.Mesh(
          new THREE.PlaneGeometry(0.12, 2.2),
          new THREE.MeshBasicMaterial({ color: 0xcccc66 })
        );
        dash.rotation.x = -Math.PI / 2;
        dash.position.set(0, 0.02, -SEG_LEN / 2 + (i + 0.5) * (SEG_LEN / dashCount));
        g.add(dash);
      }

      // Edge lines
      for (const side of [-1, 1]) {
        const edge = new THREE.Mesh(
          new THREE.PlaneGeometry(0.1, SEG_LEN),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        edge.rotation.x = -Math.PI / 2;
        edge.position.set(side * (ROAD_W / 2 - 0.15), 0.02, 0);
        g.add(edge);
      }

      // Side posts / reflectors
      for (let i = 0; i < 5; i++) {
        for (const side of [-1, 1]) {
          const post = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.6, 0.08),
            new THREE.MeshStandardMaterial({ color: 0x333338, emissive: 0x442200, emissiveIntensity: 0.3 })
          );
          post.position.set(side * (ROAD_W / 2 + 0.6), 0.3, -SEG_LEN / 2 + i * (SEG_LEN / 4));
          g.add(post);
        }
      }

      g.userData.type = 'road';
      return g;
    }

    const segments = [];
    for (let i = 0; i < SEG_COUNT; i++) {
      const seg = makeRoadSegment();
      seg.position.z = -i * SEG_LEN;
      roadGroup.add(seg);
      segments.push(seg);
    }

    // ── Ground plane (distant terrain) ───────────────────────────
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    scene.add(ground);

    // ── Distant hills silhouette ───────────────────────────────────
    function makeHills() {
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const t = i / 40;
        const x = (t - 0.5) * 500;
        const h = Math.sin(t * 8) * 8 + Math.sin(t * 3.5) * 12 + Math.cos(t * 15) * 3 + 6;
        pts.push(new THREE.Vector2(x, h));
      }
      pts.push(new THREE.Vector2(250, -5));
      pts.push(new THREE.Vector2(-250, -5));
      const shape = new THREE.Shape(pts);
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 400, bevelEnabled: false });
      const mat = new THREE.MeshBasicMaterial({ color: 0x060610 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(0, -0.1, -180);
      scene.add(mesh);
    }
    makeHills();

    // ── Street lights (pooled) ─────────────────────────────────────
    const lights = [];
    const LIGHT_SPACING = 28;

    function makeStreetLight(z) {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.08, 5.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x2a2a30 })
      );
      pole.position.y = 2.75;
      g.add(pole);
      const arm = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.06, 0.06),
        new THREE.MeshStandardMaterial({ color: 0x2a2a30 })
      );
      arm.position.set(-0.5, 5.3, 0);
      g.add(arm);
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffaa55 })
      );
      bulb.position.set(-1.0, 5.15, 0);
      g.add(bulb);
      const pl = new THREE.PointLight(0xffaa44, 1.8, 22, 2);
      pl.position.set(-1.0, 5.0, 0);
      g.add(pl);
      // Light pool on road
      const pool = new THREE.Mesh(
        new THREE.CircleGeometry(3.5, 16),
        new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.08 })
      );
      pool.rotation.x = -Math.PI / 2;
      pool.position.set(-1.0, 0.03, 0);
      g.add(pool);
      g.position.set(ROAD_W / 2 + 1.8, 0, z);
      g.userData.type = 'light';
      scene.add(g);
      return g;
    }

    for (let i = 0; i < 20; i++) {
      lights.push(makeStreetLight(-i * LIGHT_SPACING));
    }

    // ── Oncoming traffic (simple boxes with taillights/headlights) ─
    const traffic = [];

    function makeCar(isOncoming) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.7, 3.2),
        new THREE.MeshStandardMaterial({
          color: isOncoming ? 0x223344 : 0x1a1a28,
          metalness: 0.6, roughness: 0.4
        })
      );
      body.position.y = 0.55;
      g.add(body);
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.3, 0.5, 1.6),
        new THREE.MeshStandardMaterial({ color: 0x111118, metalness: 0.8, roughness: 0.2 })
      );
      cabin.position.set(0, 1.0, -0.2);
      g.add(cabin);
      if (isOncoming) {
        const hl = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 0.12, 0.05),
          new THREE.MeshBasicMaterial({ color: 0xffffcc })
        );
        hl.position.set(-0.45, 0.55, 1.65);
        g.add(hl);
        const hl2 = hl.clone();
        hl2.position.x = 0.45;
        g.add(hl2);
        const spot = new THREE.SpotLight(0xffffcc, 2, 30, 0.5, 0.5, 1);
        spot.position.set(0, 0.6, 1.8);
        spot.target.position.set(0, 0, 10);
        g.add(spot, spot.target);
      } else {
        for (const sx of [-0.5, 0.5]) {
          const tl = new THREE.Mesh(
            new THREE.BoxGeometry(0.25, 0.1, 0.05),
            new THREE.MeshBasicMaterial({ color: 0xff2200 })
          );
          tl.position.set(sx, 0.55, -1.65);
          g.add(tl);
        }
      }
      g.userData.isOncoming = isOncoming;
      g.userData.lane = isOncoming ? (Math.random() > 0.5 ? -1 : 1) : (Math.random() > 0.5 ? -0.5 : 0.5);
      g.userData.speed = isOncoming ? 0.5 + Math.random() * 0.4 : 0;
      return g;
    }

    for (let i = 0; i < 8; i++) {
      const oncoming = i % 2 === 0;
      const car = makeCar(oncoming);
      car.position.set(
        (oncoming ? -1 : 1) * LANE_W * 0.5 * (Math.random() > 0.5 ? 1 : -1),
        0,
        -60 - i * (25 + Math.random() * 30)
      );
      scene.add(car);
      traffic.push(car);
    }

    // ── Dashboard / steering wheel hint ────────────────────────────
    const dashGroup = new THREE.Group();
    const dash = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.5, 0.4),
      new THREE.MeshStandardMaterial({ color: 0x0a0a0e, roughness: 0.8 })
    );
    dash.position.set(0, 0.85, 0.6);
    dashGroup.add(dash);
    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(0.22, 0.03, 8, 24),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
    );
    wheel.position.set(-0.35, 1.05, 0.55);
    wheel.rotation.x = -0.3;
    dashGroup.add(wheel);
    const windshield = new THREE.Mesh(
      new THREE.PlaneGeometry(2.0, 0.9),
      new THREE.MeshBasicMaterial({ color: 0x111122, transparent: true, opacity: 0.15 })
    );
    windshield.position.set(0, 1.3, 0.3);
    dashGroup.add(windshield);
    camera.add(dashGroup);

    // ── Rain particles ───────────────────────────────────────────
    const RAIN_COUNT = 600;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(RAIN_COUNT * 3);
    for (let i = 0; i < RAIN_COUNT; i++) {
      rainPos[i * 3] = (Math.random() - 0.5) * 30;
      rainPos[i * 3 + 1] = Math.random() * 15;
      rainPos[i * 3 + 2] = -Math.random() * 60;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.Points(
      rainGeo,
      new THREE.PointsMaterial({ color: 0x8899bb, size: 0.06, transparent: true, opacity: 0.5 })
    );
    camera.add(rain);

    // ── Input ──────────────────────────────────────────────────────
    const keys = {};
    addEventListener('keydown', e => { keys[e.code] = true; });
    addEventListener('keyup', e => { keys[e.code] = false; });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloom.resolution.set(innerWidth, innerHeight);
    });

    // ── Recycle helpers ────────────────────────────────────────────
    function recycleSegment(seg) {
      let minZ = Infinity;
      for (const s of segments) minZ = Math.min(minZ, s.position.z);
      seg.position.z = minZ - SEG_LEN;
    }

    function recycleLight(light) {
      let minZ = Infinity;
      for (const l of lights) minZ = Math.min(minZ, l.position.z);
      light.position.z = minZ - LIGHT_SPACING;
      light.position.x = ROAD_W / 2 + 1.8;
    }

    function recycleCar(car) {
      const oncoming = car.userData.isOncoming;
      if (oncoming) {
        car.position.z = -120 - Math.random() * 80;
        car.position.x = (Math.random() > 0.5 ? -1 : 1) * LANE_W * 0.45;
      } else {
        car.position.z = -30 - Math.random() * 100;
        car.position.x = (Math.random() > 0.5 ? -0.5 : 0.5) * LANE_W;
      }
    }

    // ── Animation loop ─────────────────────────────────────────────
    const speedEl = document.getElementById('speed');

    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;

      // Acceleration
      if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(speed + ACCEL, MAX_SPEED);
      else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(speed - ACCEL * 1.5, 0);
      else speed = Math.max(speed - DECEL, 0.15);

      // Steering
      const steerInput = (keys['ArrowLeft'] || keys['KeyA'] ? 1 : 0) - (keys['ArrowRight'] || keys['KeyD'] ? 1 : 0);
      steer += (steerInput * 0.035 - steer) * 0.08;
      carX += steer * speed * 0.12;
      carX = THREE.MathUtils.clamp(carX, -LANE_W * 0.85, LANE_W * 0.85);

      distance += speed;
      const moveZ = speed;

      // Camera sway
      camera.position.x = carX;
      camera.rotation.z = -steer * 0.08;
      camera.rotation.y = steer * 0.04;
      camera.position.y = 1.35 + Math.sin(time * 8) * 0.008 * speed;

      // Move road segments
      for (const seg of segments) {
        seg.position.z += moveZ;
        if (seg.position.z > SEG_LEN) recycleSegment(seg);
      }

      // Move street lights
      for (const light of lights) {
        light.position.z += moveZ;
        if (light.position.z > 10) recycleLight(light);
      }

      // Move traffic
      for (const car of traffic) {
        const relSpeed = car.userData.isOncoming
          ? moveZ + car.userData.speed
          : moveZ - car.userData.speed * 0.3;
        car.position.z += relSpeed;
        if (car.userData.isOncoming && car.position.z > 15) recycleCar(car);
        if (!car.userData.isOncoming && car.position.z > 10) recycleCar(car);
      }

      // Rain
      const rp = rainGeo.attributes.position.array;
      for (let i = 0; i < RAIN_COUNT; i++) {
        rp[i * 3 + 1] -= 0.4 + speed * 0.3;
        rp[i * 3 + 2] += moveZ * 0.5;
        if (rp[i * 3 + 1] < 0) {
          rp[i * 3] = carX + (Math.random() - 0.5) * 30;
          rp[i * 3 + 1] = 8 + Math.random() * 7;
          rp[i * 3 + 2] = -Math.random() * 50;
        }
      }
      rainGeo.attributes.position.needsUpdate = true;

      // HUD
      speedEl.textContent = Math.round(speed / MAX_SPEED * 85 + 15);

      // Subtle headlight flicker
      headLight.intensity = 11 + Math.sin(time * 20) * 0.3;

      composer.render();
    }

    animate();
  </script>
</body>
</html>
