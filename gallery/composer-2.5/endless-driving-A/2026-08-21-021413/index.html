<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Night Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hud {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 180, 80, 0.85); font: 13px/1.4 'Segoe UI', system-ui, sans-serif;
      text-align: center; pointer-events: none; text-shadow: 0 0 8px rgba(255, 120, 40, 0.6);
      letter-spacing: 0.08em;
    }
    #speed {
      position: fixed; bottom: 52px; right: 32px;
      color: rgba(255, 200, 120, 0.9); font: 28px/1 'Courier New', monospace;
      pointer-events: none; text-shadow: 0 0 12px rgba(255, 140, 40, 0.7);
    }
    #speed span { font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="speed">0 <span>km/h</span></div>
  <div id="hud">← → steer &nbsp;·&nbsp; ↑ ↓ speed &nbsp;·&nbsp; space brake</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const clock = new THREE.Clock();
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);
    scene.fog = new THREE.FogExp2(0x080818, 0.012);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 800);
    camera.position.set(0, 1.35, 0);

    // --- Lighting ---
    const moonLight = new THREE.DirectionalLight(0x8899cc, 0.35);
    moonLight.position.set(-40, 80, -120);
    scene.add(moonLight);
    scene.add(new THREE.AmbientLight(0x111122, 0.4));

    const headLightL = new THREE.SpotLight(0xfff0cc, 80, 120, 0.55, 0.6, 1.2);
    headLightL.position.set(-0.6, 1.0, 0.2);
    headLightL.target.position.set(-0.8, 0, 30);
    scene.add(headLightL, headLightL.target);

    const headLightR = new THREE.SpotLight(0xfff0cc, 80, 120, 0.55, 0.6, 1.2);
    headLightR.position.set(0.6, 1.0, 0.2);
    headLightR.target.position.set(0.8, 0, 30);
    scene.add(headLightR, headLightR.target);

    // --- Starfield ---
    function makeStars(count) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 200 + Math.random() * 300;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 20;
        pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 100;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true, transparent: true, opacity: 0.85 });
      return new THREE.Points(geo, mat);
    }
    scene.add(makeStars(2500));

    // --- Moon ---
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(6, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xdde8ff })
    );
    moon.position.set(-60, 55, -180);
    scene.add(moon);
    const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      color: 0x6688cc, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending
    }));
    moonGlow.scale.set(40, 40, 1);
    moon.add(moonGlow);

    // --- Distant mountains silhouette ---
    function makeMountains() {
      const segs = 80;
      const geo = new THREE.PlaneGeometry(600, 80, segs, 1);
      const pos = geo.attributes.position;
      for (let i = 0; i <= segs; i++) {
        const x = (i / segs - 0.5) * 600;
        const h = 8 + Math.sin(i * 0.3) * 12 + Math.sin(i * 0.7 + 2) * 8 + Math.random() * 6;
        pos.setY(i * 2, h);
        pos.setY(i * 2 + 1, h * 0.6);
      }
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x0a0a14, side: THREE.DoubleSide }));
    }
    const mountains = makeMountains();
    mountains.rotation.x = -Math.PI / 2;
    mountains.position.set(0, -2, -120);
    scene.add(mountains);

    // --- Road system ---
    const SEG_LEN = 40;
    const SEG_COUNT = 14;
    const ROAD_W = 8;
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    function createRoadSegment(z) {
      const g = new THREE.Group();
      g.userData.baseZ = z;

      const asphalt = new THREE.Mesh(
        new THREE.PlaneGeometry(ROAD_W, SEG_LEN),
        new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.95, metalness: 0.05 })
      );
      asphalt.rotation.x = -Math.PI / 2;
      g.add(asphalt);

      const shoulderL = new THREE.Mesh(
        new THREE.PlaneGeometry(6, SEG_LEN),
        new THREE.MeshStandardMaterial({ color: 0x121018, roughness: 1 })
      );
      shoulderL.rotation.x = -Math.PI / 2;
      shoulderL.position.x = -ROAD_W / 2 - 3;
      g.add(shoulderL);

      const shoulderR = shoulderL.clone();
      shoulderR.position.x = ROAD_W / 2 + 3;
      g.add(shoulderR);

      const dashMat = new THREE.MeshBasicMaterial({ color: 0xffcc66 });
      const dashCount = Math.floor(SEG_LEN / 4);
      for (let i = 0; i < dashCount; i++) {
        const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.8), dashMat);
        dash.rotation.x = -Math.PI / 2;
        dash.position.set(0, 0.02, -SEG_LEN / 2 + i * 4 + 1);
        g.add(dash);

        [-ROAD_W / 2 + 0.3, ROAD_W / 2 - 0.3].forEach(x => {
          const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 2.5), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
          edge.rotation.x = -Math.PI / 2;
          edge.position.set(x, 0.02, -SEG_LEN / 2 + i * 4 + 1);
          g.add(edge);
        });
      }

      const poleMat = new THREE.MeshStandardMaterial({ color: 0x333340, metalness: 0.6, roughness: 0.4 });
      for (let side of [-1, 1]) {
        if (Math.random() > 0.35) continue;
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 6), poleMat);
        pole.position.set(side * (ROAD_W / 2 + 2.5), 2.5, (Math.random() - 0.5) * SEG_LEN * 0.7);
        g.add(pole);

        const lamp = new THREE.PointLight(0xffaa55, 2.5, 18, 2);
        lamp.position.set(pole.position.x, 5, pole.position.z);
        g.add(lamp);

        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xffcc77 })
        );
        bulb.position.copy(lamp.position);
        g.add(bulb);
      }

      g.position.z = z;
      return g;
    }

    const segments = [];
    for (let i = 0; i < SEG_COUNT; i++) {
      const seg = createRoadSegment(-i * SEG_LEN);
      segments.push(seg);
      roadGroup.add(seg);
    }

    // --- Distant traffic (taillights) ---
    const traffic = [];
    function spawnTraffic() {
      const car = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.7, 3.2),
        new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.5 })
      );
      body.position.y = 0.45;
      car.add(body);

      [-0.5, 0.5].forEach(x => {
        const tail = new THREE.Mesh(
          new THREE.BoxGeometry(0.25, 0.15, 0.05),
          new THREE.MeshBasicMaterial({ color: 0xff2200 })
        );
        tail.position.set(x, 0.5, 1.65);
        car.add(tail);
        const glow = new THREE.PointLight(0xff3300, 0.8, 6, 2);
        glow.position.copy(tail.position);
        car.add(glow);
      });

      car.position.set((Math.random() - 0.5) * 2, 0, -80 - Math.random() * 200);
      car.userData.speed = 0.6 + Math.random() * 0.4;
      car.userData.lane = Math.random() > 0.5 ? 1.5 : -1.5;
      car.position.x = car.userData.lane;
      scene.add(car);
      traffic.push(car);
    }
    for (let i = 0; i < 8; i++) spawnTraffic();

    // --- Dashboard / windshield frame ---
    const dashGroup = new THREE.Group();
    const dashMat = new THREE.MeshStandardMaterial({ color: 0x0d0d12, roughness: 0.8 });
    const dash = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.5, 0.8), dashMat);
    dash.position.set(0, 0.55, -0.6);
    dashGroup.add(dash);

    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(0.35, 0.06, 8, 24),
      new THREE.MeshStandardMaterial({ color: 0x1a1a20, roughness: 0.6 })
    );
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(-0.55, 0.85, -0.5);
    dashGroup.add(wheel);

    const windshield = new THREE.Mesh(
      new THREE.PlaneGeometry(3.4, 1.6),
      new THREE.MeshPhysicalMaterial({
        color: 0x111122, transparent: true, opacity: 0.08,
        roughness: 0, metalness: 0, transmission: 0.1
      })
    );
    windshield.position.set(0, 1.5, -0.3);
    dashGroup.add(windshield);

    const frameMat = new THREE.MeshStandardMaterial({ color: 0x080810 });
    [[-1.7, 0.9], [1.7, 0.9]].forEach(([x, y]) => {
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.8, 0.12), frameMat);
      pillar.position.set(x, y, -0.35);
      dashGroup.add(pillar);
    });
    scene.add(dashGroup);

    // --- Headlight cone on road (visual) ---
    const coneGeo = new THREE.ConeGeometry(12, 50, 32, 1, true);
    const coneMat = new THREE.MeshBasicMaterial({
      color: 0xffeebb, transparent: true, opacity: 0.04,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const headCone = new THREE.Mesh(coneGeo, coneMat);
    headCone.rotation.x = -Math.PI / 2;
    headCone.position.set(0, 0.05, 25);
    scene.add(headCone);

    // --- State ---
    let speed = 28;
    let steer = 0;
    let roadOffset = 0;
    let sway = 0;
    const maxSpeed = 140;
    const minSpeed = 0;

    function recycleSegments() {
      segments.forEach(seg => {
        const worldZ = seg.position.z + roadGroup.position.z;
        if (worldZ > SEG_LEN) {
          seg.position.z -= SEG_COUNT * SEG_LEN;
          seg.children.slice().forEach(c => {
            if (c.isPointLight) seg.remove(c);
            if (c.geometry && c.geometry.type === 'CylinderGeometry') {
              seg.remove(c);
              c.parent?.remove(c);
            }
          });
        }
      });
    }

    function updateTraffic(dt, moveZ) {
      traffic.forEach(car => {
        car.position.z += moveZ * car.userData.speed;
        if (car.position.z > 20) {
          car.position.z = -180 - Math.random() * 120;
          car.userData.lane = Math.random() > 0.5 ? 1.5 : -1.5;
          car.position.x = car.userData.lane + (Math.random() - 0.5) * 0.3;
        }
      });
    }

    const speedEl = document.getElementById('speed');

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (keys['ArrowUp']) speed += 40 * dt;
      if (keys['ArrowDown']) speed -= 40 * dt;
      if (keys['Space']) speed -= 70 * dt;
      speed = THREE.MathUtils.clamp(speed, minSpeed, maxSpeed);

      const targetSteer = (keys['ArrowLeft'] ? 1 : 0) - (keys['ArrowRight'] ? 1 : 0);
      steer = THREE.MathUtils.lerp(steer, targetSteer * 0.35, 4 * dt);

      const moveSpeed = speed * 0.08;
      roadOffset += moveSpeed * dt;
      roadGroup.position.z = roadOffset % SEG_LEN;

      recycleSegments();
      updateTraffic(dt, moveSpeed * dt * 10);

      sway += dt * (speed * 0.02 + 1);
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, steer * 2.5 + Math.sin(sway) * 0.04, 3 * dt);
      camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, -steer * 0.04, 3 * dt);
      camera.rotation.y = THREE.MathUtils.lerp(camera.rotation.y, steer * 0.06, 3 * dt);

      dashGroup.position.x = camera.position.x * 0.15;
      dashGroup.rotation.z = camera.rotation.z * 0.3;
      dashGroup.rotation.y = camera.rotation.y * 0.2;

      headLightL.target.position.set(-0.8 + steer, 0, 30);
      headLightR.target.position.set(0.8 + steer, 0, 30);

      speedEl.innerHTML = Math.round(speed) + ' <span>km/h</span>';

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
