<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Network Topology</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e17;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --internet: #f97316;
      --dmz: #ef4444;
      --corp: #3b82f6;
      --datacenter: #8b5cf6;
      --cloud: #06b6d4;
      --iot: #22c55e;
      --remote: #eab308;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .stats {
      display: flex;
      gap: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stats strong { color: var(--text); font-weight: 600; }

    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      height: 100%;
      overflow: hidden;
    }

    #network {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(56,189,248,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(139,92,246,0.04) 0%, transparent 50%),
        var(--bg);
    }

    aside {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-section h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend { display: flex; flex-direction: column; gap: 8px; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .legend-item:hover { background: rgba(255,255,255,0.05); }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .detail-placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: center;
      padding-top: 40px;
    }

    .detail-card { animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-card h3 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .detail-card .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .detail-card dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      font-size: 0.8rem;
    }

    .detail-card dt { color: var(--muted); }
    .detail-card dd { font-family: 'Consolas', monospace; font-size: 0.78rem; }

    .status-bar {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(34,197,94,0.15);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.3);
    }

    .status-pill.warn {
      background: rgba(234,179,8,0.15);
      color: #facc15;
      border-color: rgba(234,179,8,0.3);
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    button {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover {
      background: rgba(56,189,248,0.12);
      border-color: var(--accent);
    }

    button.active {
      background: rgba(56,189,248,0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .traffic-indicator {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
  </style>
</head>

      // Remote branch
      { from: 'vpn-gw', to: 'branch-fw', label: 'IPSec VPN', width: 2, type: 'vpn' },
      { from: 'branch-fw', to: 'branch-sw', label: '1G', width: 2, type: 'trunk' },
      { from: 'branch-sw', to: 'branch-srv', label: '1G', width: 1, type: 'access' },
      { from: 'branch-sw', to: 'branch-ws1', label: '1G', width: 1, type: 'access' },
      { from: 'branch-sw', to: 'branch-ws2', label: '1G', width: 1, type: 'access' },
      { from: 'branch-srv', to: 'file-srv', label: 'DFS repl', width: 1, dashes: true, color: { color: '#eab308' }, type: 'sync' },
    ];

    const visNodes = new vis.DataSet(nodes.map(n => ({
      id: n.id,
      label: n.label,
      group: n.group,
      shape: SHAPES[n.type] || 'dot',
      font: { color: '#e2e8f0', size: 11, face: 'Segoe UI' },
      borderWidth: n.status === 'warn' ? 3 : 1,
      borderWidthSelected: 3,
    })));

    const edgeColors = {
      wan: '#f97316', trunk: '#3b82f6', access: '#64748b', vpn: '#eab308',
      sync: '#94a3b8', storage: '#8b5cf6', cloud: '#06b6d4', ot: '#22c55e',
      iot: '#22c55e', mgmt: '#64748b',
    };

    const visEdges = new vis.DataSet(edges.map((e, i) => ({
      id: i,
      from: e.from,
      to: e.to,
      label: e.label,
      width: e.width || 1,
      dashes: e.dashes || false,
      font: { size: 9, color: '#64748b', strokeWidth: 0 },
      color: e.color || { color: edgeColors[e.type] || '#475569', highlight: '#38bdf8', hover: '#38bdf8' },
      smooth: { type: 'curvedCW', roundness: 0.15 },
      _meta: e,
    })));

    const groups = {};
    for (const [key, z] of Object.entries(ZONES)) {
      groups[key] = {
        color: { background: z.bg, border: z.color, highlight: { background: z.bg, border: '#fff' } },
        shape: 'dot',
        size: 20,
      };
    }
    groups.dc = { ...groups.dc, size: 22 };
    groups.internet = { ...groups.internet, size: 24 };
    groups.cloud = { ...groups.cloud, shape: 'star', size: 22 };

    const container = document.getElementById('network');
    const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
      groups,
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.008, springLength: 120, springConstant: 0.04, damping: 0.5 },
        stabilization: { iterations: 200, fit: true },
      },
      interaction: { hover: true, tooltipDelay: 100, navigationButtons: false, keyboard: true },
      layout: { improvedLayout: true },
      edges: { arrows: { to: { enabled: true, scaleFactor: 0.5 } } },
    });

    document.getElementById('node-count').textContent = nodes.length;
    document.getElementById('link-count').textContent = edges.length;

    // Legend
    const legendEl = document.getElementById('legend');
    for (const [key, z] of Object.entries(ZONES)) {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${z.color}"></div>${z.label}`;
      item.addEventListener('click', () => {
        const zoneNodes = nodes.filter(n => n.group === key).map(n => n.id);
        network.selectNodes(zoneNodes);
        network.focus(zoneNodes[0], { scale: 1.2, animation: true });
      });
      legendEl.appendChild(item);
    }

    // Detail panel
    const detailEl = document.getElementById('detail');
    const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));

    function showNodeDetail(id) {
      const n = nodeMap[id];
      if (!n) return;
      const z = ZONES[n.group];
      detailEl.innerHTML = `
        <div class="detail-card">
          <h3>${n.label.replace('\n', ' ')}</h3>
          <span class="badge" style="background:${z.bg};color:${z.color}">${z.label}</span>
          <dl>
            <dt>Type</dt><dd>${n.type}</dd>
            <dt>IP Address</dt><dd>${n.ip}</dd>
            <dt>VLAN</dt><dd>${n.vlan}</dd>
            <dt>Platform</dt><dd>${n.os}</dd>
          </dl>
          <div class="status-bar">
            <span class="status-pill${n.status === 'warn' ? ' warn' : ''}">${n.status === 'warn' ? '⚠ Degraded' : '● Online'}</span>
            <span class="status-pill">${edges.filter(e => e.from === id || e.to === id).length} connections</span>
          </div>
        </div>`;
    }

    function showEdgeDetail(edgeId) {
      const edge = visEdges.get(edgeId);
      const meta = edge._meta;
      const fromNode = nodeMap[edge.from];
      const toNode = nodeMap[edge.to];
      detailEl.innerHTML = `
        <div class="detail-card">
          <h3>Link: ${edge.label}</h3>
          <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8">${meta.type.toUpperCase()}</span>
          <dl>
            <dt>Source</dt><dd>${fromNode.label.replace('\n', ' ')} (${fromNode.ip})</dd>
            <dt>Destination</dt><dd>${toNode.label.replace('\n', ' ')} (${toNode.ip})</dd>
            <dt>Bandwidth</dt><dd>${edge.label}</dd>
            <dt>Status</dt><dd>Active</dd>
          </dl>
          <div class="status-bar">
            <span class="status-pill">● Up</span>
            <span class="status-pill">Latency: ${Math.floor(Math.random() * 8 + 1)}ms</span>
          </div>
        </div>`;
    }

    network.on('click', params => {
      if (params.nodes.length) showNodeDetail(params.nodes[0]);
      else if (params.edges.length) showEdgeDetail(params.edges[0]);
    });

    network.on('hoverNode', () => { container.style.cursor = 'pointer'; });
    network.on('blurNode', () => { container.style.cursor = 'default'; });

    // Controls
    document.getElementById('btn-fit').addEventListener('click', () => network.fit({ animation: true }));
    let physicsOn = true;
    document.getElementById('btn-physics').addEventListener('click', function() {
      physicsOn = !physicsOn;
      network.setOptions({ physics: { enabled: physicsOn } });
      this.classList.toggle('active', physicsOn);
    });

    let trafficOn = false;
    let trafficInterval;
    document.getElementById('btn-traffic').addEventListener('click', function() {
      trafficOn = !trafficOn;
      this.classList.toggle('active', trafficOn);
      if (trafficOn) {
        trafficInterval = setInterval(() => {
          const mbps = Math.floor(Math.random() * 200 + 700);
          document.getElementById('traffic-status').textContent = `Monitoring ${mbps} Mbps aggregate throughput`;
          const randomEdge = Math.floor(Math.random() * edges.length);
          const e = visEdges.get(randomEdge);
          visEdges.update({ id: randomEdge, width: (e.width || 1) + 2, color: { color: '#38bdf8', highlight: '#38bdf8' } });
          setTimeout(() => {
            const orig = edges[randomEdge];
            visEdges.update({ id: randomEdge, width: orig.width, color: orig.color || { color: edgeColors[orig.type] } });
          }, 400);
        }, 800);
      } else {
        clearInterval(trafficInterval);
        document.getElementById('traffic-status').textContent = 'Monitoring 847 Mbps aggregate throughput';
      }
    });

    // Clock
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    network.once('stabilizationIterationsDone', () => network.fit({ animation: { duration: 800 } }));
  </script>
</body>
</html>
