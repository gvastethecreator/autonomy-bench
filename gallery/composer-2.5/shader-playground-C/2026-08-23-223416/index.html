<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shader Playground</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0a0f;
    --bg-panel: rgba(14, 14, 22, 0.85);
    --bg-editor: rgba(8, 8, 14, 0.95);
    --border: rgba(255, 255, 255, 0.06);
    --border-glow: rgba(120, 180, 255, 0.15);
    --text: #e8eaf0;
    --text-dim: #6b7280;
    --accent: #6ea8fe;
    --accent-warm: #f0a060;
    --accent-violet: #a78bfa;
    --error: #f87171;
    --success: #4ade80;
    --radius: 12px;
    --font-ui: 'Outfit', system-ui, sans-serif;
    --font-code: 'JetBrains Mono', 'Fira Code', monospace;
    --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--text);
    font-family: var(--font-ui);
  }

  /* Ambient background layers */
  .ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, rgba(110, 168, 254, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 15%, rgba(167, 139, 250, 0.07) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(240, 160, 96, 0.04) 0%, transparent 50%),
      var(--bg-deep);
    animation: ambientShift 20s ease-in-out infinite alternate;
  }

  @keyframes ambientShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(25deg); }
  }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  /* Layout */
  .app {
    position: relative; z-index: 2;
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    padding: 16px;
    gap: 12px;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.1s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-violet));
    display: grid; place-items: center;
    font-size: 18px;
    box-shadow: 0 4px 20px rgba(110, 168, 254, 0.3);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(110, 168, 254, 0.3); }
    50% { box-shadow: 0 4px 30px rgba(167, 139, 250, 0.45); }
  }

  .logo h1 {
    font-size: 1.25rem; font-weight: 500; letter-spacing: -0.02em;
  }

  .logo span {
    font-size: 0.75rem; color: var(--text-dim); font-weight: 300;
  }

  .header-actions {
    display: flex; gap: 8px; align-items: center;
  }

  /* Buttons */
  .btn {
    font-family: var(--font-ui);
    font-size: 0.8rem; font-weight: 500;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    cursor: pointer;
    transition: all var(--transition);
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--border-glow);
    transform: translateY(-1px);
  }

  .btn:active { transform: translateY(0); }

  .btn.primary {
    background: linear-gradient(135deg, rgba(110, 168, 254, 0.25), rgba(167, 139, 250, 0.2));
    border-color: rgba(110, 168, 254, 0.3);
  }

  .btn.primary:hover {
    background: linear-gradient(135deg, rgba(110, 168, 254, 0.35), rgba(167, 139, 250, 0.3));
    box-shadow: 0 4px 20px rgba(110, 168, 254, 0.15);
  }

  .btn.icon-btn {
    padding: 8px 10px;
    font-size: 1rem;
    line-height: 1;
  }

  /* Main content */
  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 12px;
    min-height: 0;
  }

  /* Canvas panel */
  .canvas-panel {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 20px 60px rgba(0,0,0,0.5);
  }

  #glcanvas {
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
  }

  .canvas-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.2) 100%);
  }

  .canvas-info {
    position: absolute; bottom: 12px; left: 12px;
    display: flex; gap: 16px;
    font-size: 0.7rem; color: rgba(255,255,255,0.5);
    font-family: var(--font-code);
    pointer-events: none;
  }

  .canvas-info span { display: flex; align-items: center; gap: 4px; }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-dot.error { background: var(--error); animation: none; }

  /* Side panel */
  .side-panel {
    display: flex; flex-direction: column; gap: 12px;
    min-height: 0;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    overflow: hidden;
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  /* Presets */
  .presets {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 14px;
    max-height: 120px; overflow-y: auto;
  }

  .preset-chip {
    font-family: var(--font-ui);
    font-size: 0.72rem;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    cursor: pointer;
    transition: all var(--transition);
  }

  .preset-chip:hover {
    color: var(--text);
    border-color: var(--border-glow);
    background: rgba(110, 168, 254, 0.08);
  }

  .preset-chip.active {
    color: var(--accent);
    border-color: rgba(110, 168, 254, 0.4);
    background: rgba(110, 168, 254, 0.12);
  }

  /* Editor */
  .editor-panel {
    flex: 1; display: flex; flex-direction: column;
    min-height: 0;
  }

  .editor-wrap {
    flex: 1; position: relative; min-height: 0;
    background: var(--bg-editor);
  }

  #editor {
    width: 100%; height: 100%;
    padding: 14px;
    border: none; outline: none; resize: none;
    background: transparent;
    color: #c9d1d9;
    font-family: var(--font-code);
    font-size: 0.78rem;
    line-height: 1.6;
    tab-size: 2;
    caret-color: var(--accent);
  }

  .line-numbers {
    position: absolute; top: 14px; left: 0;
    width: 36px; text-align: right;
    padding-right: 8px;
    font-family: var(--font-code);
    font-size: 0.78rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.15);
    pointer-events: none;
    user-select: none;
  }

  /* Error bar */
  .error-bar {
    padding: 8px 14px;
    font-family: var(--font-code);
    font-size: 0.72rem;
    color: var(--error);
    background: rgba(248, 113, 113, 0.08);
    border-top: 1px solid rgba(248, 113, 113, 0.15);
    max-height: 60px; overflow-y: auto;
    display: none;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .error-bar.visible { display: block; }

  /* Uniforms */
  .uniforms {
    padding: 10px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .uniform-row {
    display: flex; align-items: center; gap: 10px;
  }

  .uniform-row label {
    font-size: 0.72rem; color: var(--text-dim);
    width: 70px; flex-shrink: 0;
    font-family: var(--font-code);
  }

  .uniform-row input[type="range"] {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.08);
    border-radius: 2px; outline: none;
  }

  .uniform-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(110, 168, 254, 0.4);
  }

  .uniform-value {
    font-family: var(--font-code);
    font-size: 0.68rem; color: var(--text-dim);
    width: 40px; text-align: right;
  }

  /* Footer */
  footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
    font-size: 0.7rem; color: var(--text-dim);
  }

  footer kbd {
    font-family: var(--font-code);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    font-size: 0.65rem;
  }

  /* Fullscreen */
  .app.fullscreen main {
    grid-template-columns: 1fr;
  }

  .app.fullscreen .side-panel {
    display: none;
  }

  .app.fullscreen .canvas-panel {
    border-radius: 8px;
  }

  /* Responsive */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 300px; }
    .side-panel { flex-direction: row; }
    .editor-panel { flex: 2; }
    .panel:not(.editor-panel) { flex: 1; }
  }

  /* Compile flash */
  @keyframes compileFlash {
    0% { box-shadow: 0 0 0 0 rgba(110, 168, 254, 0.4); }
    100% { box-shadow: 0 0 0 8px rgba(110, 168, 254, 0); }
  }

  .canvas-panel.compiled {
    animation: compileFlash 0.6s ease;
  }
</style>
</head>
<body>
<div class="ambient"></div>
<div class="grain"></div>

<div class="app" id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">◈</div>
      <div>
        <h1>Shader Playground</h1>
        <span>Live GLSL fragment editor</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btnReset">Reset</button>
      <button class="btn primary" id="btnCompile">Compile</button>
      <button class="btn icon-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
    </div>
  </header>

  <main>
    <div class="canvas-panel" id="canvasPanel">
      <canvas id="glcanvas"></canvas>
      <div class="canvas-overlay"></div>
      <div class="canvas-info">
        <span><div class="status-dot" id="statusDot"></div> <span id="fpsLabel">60 fps</span></span>
        <span id="resLabel">1920 × 1080</span>
        <span id="timeLabel">0.00s</span>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel">
        <div class="panel-header">Presets</div>
        <div class="presets" id="presets"></div>
      </div>

      <div class="panel">
        <div class="panel-header">Uniforms</div>
        <div class="uniforms">
          <div class="uniform-row">
            <label>speed</label>
            <input type="range" id="uSpeed" min="0" max="3" step="0.01" value="1">
            <span class="uniform-value" id="uSpeedVal">1.00</span>
          </div>
          <div class="uniform-row">
            <label>scale</label>
            <input type="range" id="uScale" min="0.1" max="5" step="0.01" value="1">
            <span class="uniform-value" id="uScaleVal">1.00</span>
          </div>
          <div class="uniform-row">
            <label>iterations</label>
            <input type="range" id="uIter" min="1" max="128" step="1" value="64">
            <span class="uniform-value" id="uIterVal">64</span>
          </div>
        </div>
      </div>

      <div class="panel editor-panel">
        <div class="panel-header">
          <span>Fragment Shader</span>
          <span id="charCount">0 chars</span>
        </div>
        <div class="editor-wrap">
          <div class="line-numbers" id="lineNumbers"></div>
          <textarea id="editor" spellcheck="false"></textarea>
        </div>
        <div class="error-bar" id="errorBar"></div>
      </div>
    </div>
  </main>

  <footer>
    <span>Drag on canvas to set mouse · Scroll to zoom</span>
    <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> compile · <kbd>F</kbd> fullscreen</span>
  </footer>
</div>

<script>
(function() {
  'use strict';

  const VERTEX_SRC = `#version 300 es
    in vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const DEFAULT_FRAGMENT = `#version 300 es
    precision highp float;

    uniform vec2 u_resolution;
    uniform float u_time;
    uniform vec2 u_mouse;
    uniform float u_speed;
    uniform float u_scale;
    uniform int u_iterations;

    out vec4 fragColor;

    // Hash functions
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
      for (int i = 0; i < 6; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / min(u_resolution.x, u_resolution.y);
      uv *= u_scale;

      float t = u_time * u_speed;
      vec2 mp = (u_mouse - 0.5 * u_resolution) / min(u_resolution.x, u_resolution.y);

      // Domain warp
      vec2 q = vec2(
        fbm(uv + t * 0.1),
        fbm(uv + vec2(5.2, 1.3) + t * 0.12)
      );
      vec2 r = vec2(
        fbm(uv + 4.0 * q + vec2(1.7, 9.2) + t * 0.08),
        fbm(uv + 4.0 * q + vec2(8.3, 2.8) + t * 0.1)
      );

      float f = fbm(uv + 3.5 * r);

      // Color palette
      vec3 col = mix(
        vec3(0.05, 0.08, 0.18),
        vec3(0.15, 0.35, 0.65),
        clamp(f * 1.8, 0.0, 1.0)
      );
      col = mix(col, vec3(0.6, 0.3, 0.85), clamp(length(q) * 0.6, 0.0, 1.0));
      col = mix(col, vec3(0.95, 0.55, 0.25), clamp(length(r.x) * 0.5, 0.0, 1.0));

      // Mouse glow
      float dist = length(uv - mp * u_scale);
      col += vec3(0.4, 0.6, 1.0) * 0.15 * exp(-dist * 8.0);

      // Vignette
      float vig = 1.0 - dot(uv * 0.4, uv * 0.4);
      col *= vig;

      // Subtle grain
      col += (hash(gl_FragCoord.xy + t) - 0.5) * 0.03;

      fragColor = vec4(col, 1.0);
    }
  `;

  const PRESETS = {
    'Aurora Flow': DEFAULT_FRAGMENT,
    'Raymarch Sphere': `#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_speed;
uniform float u_scale;
uniform int u_iterations;
out vec4 fragColor;

mat2 rot(float a) { float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

float map(vec3 p) {
  p.xz *= rot(u_time * u_speed * 0.3);
  p.yz *= rot(u_time * u_speed * 0.2);
  float d = length(p) - 0.8 * u_scale;
  d = min(d, length(p - vec3(1.2, 0.0, 0.0)) - 0.4);
  d = min(d, length(p - vec3(-1.0, 0.5, 0.3)) - 0.3);
  return d;
}

vec3 normal(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(
    map(p+e.xyy)-map(p-e.xyy),
    map(p+e.yxy)-map(p-e.yxy),
    map(p+e.yyx)-map(p-e.yyx)
  ));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5*u_resolution)/min(u_resolution.x,u_resolution.y);
  vec3 ro = vec3(0.0, 0.0, -3.5);
  vec3 rd = normalize(vec3(uv, 1.2));
  float t = 0.0;
  vec3 col = vec3(0.02, 0.03, 0.06);
  for(int i=0; i<128; i++) {
    if(i >= u_iterations) break;
    vec3 p = ro + rd * t;
    float d = map(p);
    if(d < 0.001) {
      vec3 n = normal(p);
      vec3 light = normalize(vec3(1.0, 2.0, -1.0));
      float diff = max(dot(n, light), 0.0);
      float spec = pow(max(dot(reflect(-light,n),-rd),0.0), 32.0);
      vec3 base = 0.5 + 0.5*cos(p*2.0 + vec3(0.0,2.0,4.0) + u_time*u_speed);
      col = base * diff + spec * vec3(1.0);
      break;
    }
    t += d;
    if(t > 20.0) break;
  }
  col = mix(col, vec3(0.02,0.03,0.06), 1.0-exp(-0.08*t));
  fragColor = vec4(pow(col, vec3(0.4545)), 1.0);
}`,

    'Kaleidoscope': `#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_speed;
uniform float u_scale;
uniform int u_iterations;
out vec4 fragColor;

#define PI 3.14159265

vec2 kaleid(vec2 uv, float n) {
  float a = atan(uv.y, uv.x);
  float r = length(uv);
  a = mod(a, PI*2.0/n);
  a = abs(a - PI/n);
  return vec2(cos(a), sin(a)) * r;
}

float pattern(vec2 p) {
  float t = u_time * u_speed;
  p *= u_scale * 3.0;
  p = kaleid(p, 6.0 + 2.0*sin(t*0.3));
  float v = sin(p.x*8.0+t)*sin(p.y*8.0-t*1.3);
  v += 0.5*sin(length(p)*12.0 - t*2.0);
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5*u_resolution)/min(u_resolution.x,u_resolution.y);
  vec2 mp = (u_mouse - 0.5*u_resolution)/min(u_resolution.x,u_resolution.y);
  uv -= mp * 0.3;
  float f = pattern(uv);
  vec3 col = 0.5 + 0.5*cos(vec3(0.0,2.0,4.0) + f*3.0 + u_time*u_speed*0.5);
  col *= 0.8 + 0.2*sin(length(uv)*10.0 - u_time);
  fragColor = vec4(col, 1.0);
}`,

    'Plasma Storm': `#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_speed;
uniform float u_scale;
uniform int u_iterations;
out vec4 fragColor;

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float t = u_time * u_speed;
  vec2 mp = u_mouse / u_resolution;
  float v = 0.0;
  uv = (uv - 0.5) * u_scale + 0.5;
  for(int i=0; i<128; i++) {
    if(i >= u_iterations) break;
    float fi = float(i);
    v += sin(uv.x * (fi+1.0)*3.0 + t + mp.x*5.0);
    v += sin(uv.y * (fi+1.0)*2.5 - t*1.2 + mp.y*5.0);
    v += sin((uv.x+uv.y) * (fi+1.0)*2.0 + t*0.8);
  }
  v /= float(min(u_iterations, 128));
  vec3 col;
  col.r = sin(v*PI + t)*0.5+0.5;
  col.g = sin(v*PI + t + 2.094)*0.5+0.5;
  col.b = sin(v*PI + t + 4.189)*0.5+0.5;
  col = pow(col, vec3(1.2));
  fragColor = vec4(col, 1.0);
}`,

    'Voronoi Cells': `#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_speed;
uniform float u_scale;
uniform int u_iterations;
out vec4 fragColor;

vec2 hash2(vec2 p) {
  p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
  return fract(sin(p)*43758.5453);
}

void main() {
  vec2 uv = (gl_FragCoord.xy)/min(u_resolution.x,u_resolution.y) * u_scale;
  vec2 gv = fract(uv) - 0.5;
  vec2 id = floor(uv);
  float t = u_time * u_speed;
  float md = 8.0;
  vec2 mr;
  for(int y=-1; y<=1; y++) {
    for(int x=-1; x<=1; x++) {
      vec2 offs = vec2(float(x), float(y));
      vec2 h = hash2(id + offs);
      h = 0.5 + 0.5*sin(t + 6.2831*h);
      float d = length(offs + h - gv);
      if(d < md) { md = d; mr = h; }
    }
  }
  vec3 col = 0.5 + 0.5*cos(6.2831*mr.xyx + vec3(0.0,1.0,2.0) + t*0.5);
  col *= 1.0 - smoothstep(0.0, 0.08, md);
  col += vec3(0.1) * (1.0 - smoothstep(0.0, 0.02, md));
  fragColor = vec4(col, 1.0);
}`,

    'Starfield Warp': `#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_speed;
uniform float u_scale;
uniform int u_iterations;
out vec4 fragColor;

float hash(float n) { return fract(sin(n)*43758.5453); }

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5*u_resolution)/min(u_resolution.x,u_resolution.y);
  vec2 mp = (u_mouse - 0.5*u_resolution)/min(u_resolution.x,u_resolution.y);
  float t = u_time * u_speed;
  vec3 col = vec3(0.0);
  float warp = length(mp) * 2.0;
  for(int i=0; i<128; i++) {
    if(i >= u_iterations) break;
    float fi = float(i);
    float h = hash(fi * 127.0);
    float h2 = hash(fi * 311.0);
    vec2 pos = vec2(h, h2) * 2.0 - 1.0;
    pos *= (1.0 + fi * 0.02) * u_scale;
    float z = fract(fi * 0.1 - t * (0.5 + warp));
    z = pow(z, 3.0);
    vec2 star = pos / z + mp * 0.5;
    float d = length(uv - star);
    float b = 0.002 / (d + 0.001) * z;
    vec3 sc = mix(vec3(0.6,0.7,1.0), vec3(1.0,0.8,0.5), h);
    col += sc * b;
  }
  col = 1.0 - exp(-col * 1.5);
  fragColor = vec4(col, 1.0);
}`
  };

  // DOM refs
  const canvas = document.getElementById('glcanvas');
  const editor = document.getElementById('editor');
  const errorBar = document.getElementById('errorBar');
  const statusDot = document.getElementById('statusDot');
  const fpsLabel = document.getElementById('fpsLabel');
  const resLabel = document.getElementById('resLabel');
  const timeLabel = document.getElementById('timeLabel');
  const charCount = document.getElementById('charCount');
  const lineNumbers = document.getElementById('lineNumbers');
  const presetsEl = document.getElementById('presets');
  const canvasPanel = document.getElementById('canvasPanel');
  const app = document.getElementById('app');

  // Uniform sliders
  const uSpeed = document.getElementById('uSpeed');
  const uScale = document.getElementById('uScale');
  const uIter = document.getElementById('uIter');
  const uSpeedVal = document.getElementById('uSpeedVal');
  const uScaleVal = document.getElementById('uScaleVal');
  const uIterVal = document.getElementById('uIterVal');

  // WebGL state
  let gl, program, vao;
  let compileTimeout = null;
  let startTime = performance.now();
  let mouse = { x: 0, y: 0, down: false };
  let zoom = 1.0;
  let activePreset = 'Aurora Flow';
  let frameCount = 0, lastFpsTime = performance.now(), fps = 60;

  const uniforms = {};

  function initGL() {
    gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) {
      showError('WebGL2 not supported in this browser.');
      return false;
    }

    // Fullscreen quad
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    return true;
  }

  function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(log);
    }
    return shader;
  }

  function createProgram(vsSrc, fsSrc) {
    const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(prog));
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return prog;
  }

  function cacheUniforms() {
    const names = ['u_resolution', 'u_time', 'u_mouse', 'u_speed', 'u_scale', 'u_iterations'];
    names.forEach(n => { uniforms[n] = gl.getUniformLocation(program, n); });
  }

  function compile(source) {
    try {
      if (program) gl.deleteProgram(program);
      program = createProgram(VERTEX_SRC, source);
      cacheUniforms();
      hideError();
      statusDot.classList.remove('error');
      canvasPanel.classList.remove('compiled');
      void canvasPanel.offsetWidth;
      canvasPanel.classList.add('compiled');
      return true;
    } catch (e) {
      showError(e.message);
      statusDot.classList.add('error');
      return false;
    }
  }

  function showError(msg) {
    errorBar.textContent = msg;
    errorBar.classList.add('visible');
  }

  function hideError() {
    errorBar.classList.remove('visible');
  }

  function resize() {
    const panel = canvas.parentElement;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = panel.clientWidth;
    const h = panel.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    resLabel.textContent = canvas.width + ' × ' + canvas.height;
  }

  function render() {
    if (!gl || !program) return;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(program);
    gl.bindVertexArray(vao);

    const t = (performance.now() - startTime) / 1000;
    timeLabel.textContent = t.toFixed(2) + 's';

    if (uniforms.u_resolution) gl.uniform2f(uniforms.u_resolution, canvas.width, canvas.height);
    if (uniforms.u_time) gl.uniform1f(uniforms.u_time, t);
    if (uniforms.u_mouse) gl.uniform2f(uniforms.u_mouse, mouse.x, canvas.height - mouse.y);
    if (uniforms.u_speed) gl.uniform1f(uniforms.u_speed, parseFloat(uSpeed.value));
    if (uniforms.u_scale) gl.uniform1f(uniforms.u_scale, parseFloat(uScale.value) * zoom);
    if (uniforms.u_iterations) gl.uniform1i(uniforms.u_iterations, parseInt(uIter.value));

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);

    // FPS
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fps = frameCount;
      frameCount = 0;
      lastFpsTime = now;
      fpsLabel.textContent = fps + ' fps';
    }

    requestAnimationFrame(render);
  }

  function updateLineNumbers() {
    const lines = editor.value.split('\n');
    lineNumbers.textContent = lines.map((_, i) => i + 1).join('\n');
    charCount.textContent = editor.value.length + ' chars';
  }

  function scheduleCompile() {
    clearTimeout(compileTimeout);
    compileTimeout = setTimeout(() => compile(editor.value), 400);
  }

  function loadPreset(name) {
    activePreset = name;
    editor.value = PRESETS[name];
    updateLineNumbers();
    compile(editor.value);
    document.querySelectorAll('.preset-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.name === name);
    });
  }

  function buildPresets() {
    Object.keys(PRESETS).forEach(name => {
      const chip = document.createElement('button');
      chip.className = 'preset-chip' + (name === activePreset ? ' active' : '');
      chip.textContent = name;
      chip.dataset.name = name;
      chip.addEventListener('click', () => loadPreset(name));
      presetsEl.appendChild(chip);
    });
  }

  // Events
  editor.addEventListener('input', () => {
    updateLineNumbers();
    scheduleCompile();
  });

  editor.addEventListener('scroll', () => {
    lineNumbers.scrollTop = editor.scrollTop;
  });

  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      updateLineNumbers();
      scheduleCompile();
    }
  });

  document.getElementById('btnCompile').addEventListener('click', () => compile(editor.value));
  document.getElementById('btnReset').addEventListener('click', () => loadPreset(activePreset));

  document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

  [uSpeed, uScale, uIter].forEach((el, i) => {
    const vals = [uSpeedVal, uScaleVal, uIterVal];
    el.addEventListener('input', () => {
      vals[i].textContent = i === 2 ? el.value : parseFloat(el.value).toFixed(2);
    });
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const dpr = canvas.width / rect.width;
    mouse.x = (e.clientX - rect.left) * dpr;
    mouse.y = (e.clientY - rect.top) * dpr;
  });

  canvas.addEventListener('mousedown', () => { mouse.down = true; });
  canvas.addEventListener('mouseup', () => { mouse.down = false; });
  canvas.addEventListener('mouseleave', () => { mouse.down = false; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom *= e.deltaY > 0 ? 0.95 : 1.05;
    zoom = Math.max(0.1, Math.min(10, zoom));
  }, { passive: false });

  window.addEventListener('resize', resize);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); compile(editor.value); }
    if (e.key === 'f' && !e.ctrlKey && document.activeElement !== editor) {
      e.preventDefault();
      toggleFullscreen();
    }
  });

  function toggleFullscreen() {
    app.classList.toggle('fullscreen');
    setTimeout(resize, 50);
  }

  // Init
  if (initGL()) {
    buildPresets();
    editor.value = DEFAULT_FRAGMENT;
    updateLineNumbers();
    resize();
    compile(editor.value);
    if (!mouse.x) {
      mouse.x = canvas.width / 2;
      mouse.y = canvas.height / 2;
    }
    requestAnimationFrame(render);
  }
})();
</script>
</body>
</html>
