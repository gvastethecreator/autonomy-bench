<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdant Cycle — Living Ecosystem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a1208;
    font-family: 'Cormorant Garamond', Georgia, serif;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%; height: 100%;
  }

  #overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #title-card {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #e8f0dc;
    opacity: 1;
    transition: opacity 2s ease, transform 2s ease;
    pointer-events: none;
  }

  #title-card.hidden {
    opacity: 0;
    transform: translate(-50%, -60%);
  }

  #title-card h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 2px 40px rgba(120, 180, 80, 0.4);
    margin-bottom: 0.5rem;
  }

  #title-card p {
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-style: italic;
    opacity: 0.75;
    letter-spacing: 0.05em;
  }

  #hud {
    position: absolute;
    top: 1.5rem; left: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    opacity: 0;
    transition: opacity 1.5s ease 1s;
  }

  #hud.visible { opacity: 1; }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    color: rgba(232, 240, 220, 0.85);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .stat-bar {
    width: 80px; height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .stat-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  #time-display {
    position: absolute;
    top: 1.5rem; right: 1.5rem;
    text-align: right;
    opacity: 0;
    transition: opacity 1.5s ease 1.2s;
  }

  #time-display.visible { opacity: 1; }

  #time-display .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: rgba(232, 240, 220, 0.7);
    letter-spacing: 0.1em;
  }

  #time-display .phase {
    font-size: 1.1rem;
    color: rgba(232, 240, 220, 0.9);
    margin-top: 0.2rem;
  }

  #legend {
    position: absolute;
    bottom: 1.5rem; left: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    opacity: 0;
    transition: opacity 1.5s ease 1.5s;
  }

  #legend.visible { opacity: 1; }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: rgba(232, 240, 220, 0.5);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .legend-swatch {
    width: 12px; height: 12px;
    border-radius: 2px;
  }

  #hint {
    position: absolute;
    bottom: 1.5rem; right: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: rgba(232, 240, 220, 0.35);
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 1.5s ease 2s;
  }

  #hint.visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="overlay">
  <div id="title-card">
    <h1>Verdant Cycle</h1>
    <p>A self-sustaining living world</p>
  </div>
  <div id="hud">
    <div class="stat-row"><span class="stat-dot" style="background:#6dba4a"></span>Flora <div class="stat-bar"><div class="stat-fill" id="bar-flora" style="background:#6dba4a;width:60%"></div></div></div>
    <div class="stat-row"><span class="stat-dot" style="background:#c4a35a"></span>Herbivores <div class="stat-bar"><div class="stat-fill" id="bar-herb" style="background:#c4a35a;width:40%"></div></div></div>
    <div class="stat-row"><span class="stat-dot" style="background:#8b4513"></span>Predators <div class="stat-bar"><div class="stat-fill" id="bar-pred" style="background:#8b4513;width:25%"></div></div></div>
    <div class="stat-row"><span class="stat-dot" style="background:#5a9fd4"></span>Water <div class="stat-bar"><div class="stat-fill" id="bar-water" style="background:#5a9fd4;width:70%"></div></div></div>
    <div class="stat-row"><span class="stat-dot" style="background:#d4a843"></span>Soil <div class="stat-bar"><div class="stat-fill" id="bar-soil" style="background:#d4a843;width:55%"></div></div></div>
  </div>
  <div id="time-display">
    <div class="clock" id="clock">06:00</div>
    <div class="phase" id="phase">Dawn</div>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#4a8c32"></div>Grass</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#2d6b22"></div>Trees</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#c4a35a"></div>Rabbits</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#8b4513"></div>Foxes</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#f0c040"></div>Bees</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#88ccff"></div>Butterflies</div>
  </div>
  <div id="hint">Click to seed life · Hold for rain</div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
let W, H, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─── Time & Weather ───
const DAY_LENGTH = 120; // seconds per full cycle
let timeOfDay = 0.25; // 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk
let rainIntensity = 0;
let targetRain = 0;
let windAngle = 0.3;
let windStrength = 0.5;
let soilNutrients = 0.6;
let waterLevel = 0.7;
let sunEnergy = 0;

function getSunIntensity() {
  const t = timeOfDay;
  if (t < 0.2 || t > 0.8) return 0;
  if (t < 0.3) return (t - 0.2) / 0.1;
  if (t > 0.7) return (0.8 - t) / 0.1;
  return 1;
}

function getSkyColors() {
  const sun = getSunIntensity();
  const t = timeOfDay;
  const night = Math.max(0, 1 - sun * 3);
  const dawn = t > 0.15 && t < 0.35 ? Math.sin((t - 0.15) / 0.2 * Math.PI) : 0;
  const dusk = t > 0.65 && t < 0.85 ? Math.sin((t - 0.65) / 0.2 * Math.PI) : 0;
  const twilight = Math.max(dawn, dusk) * 0.7;

  const top = lerpColor([10, 15, 35], [70, 140, 200], sun);
  const mid = lerpColor([20, 25, 50], lerpColor([255, 180, 100], [120, 190, 230], sun), sun + twilight * 0.5);
  const bot = lerpColor([15, 20, 30], lerpColor([255, 140, 60], [180, 210, 160], sun), sun + twilight * 0.3);

  return { top, mid, bot, night, sun, twilight };
}

function lerpColor(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}

function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }
function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ─── Terrain ───
const terrain = [];
const TERRAIN_RES = 80;

function initTerrain() {
  terrain.length = 0;
  for (let i = 0; i <= TERRAIN_RES; i++) {
    const x = i / TERRAIN_RES;
    const h = 0.55
      + Math.sin(x * 3.7 + 1.2) * 0.08
      + Math.sin(x * 7.3 + 0.5) * 0.04
      + Math.sin(x * 1.1) * 0.06;
    terrain.push({ x: x * W, h: h * H, moisture: 0.3 + Math.random() * 0.4 });
  }
}

function terrainHeightAt(x) {
  const t = x / W * TERRAIN_RES;
  const i = Math.floor(t);
  const f = t - i;
  if (i >= TERRAIN_RES) return terrain[TERRAIN_RES].h;
  const a = terrain[i], b = terrain[i + 1];
  const h = a.h + (b.h - a.h) * f;
  const m = a.moisture + (b.moisture - a.moisture) * f;
  return { h, moisture: m };
}

// ─── Entities ───
const plants = [];
const herbivores = [];
const predators = [];
const pollinators = [];
const particles = [];
const organicMatter = [];

class Plant {
  constructor(x, type) {
    this.x = x;
    this.type = type; // 'grass', 'flower', 'tree', 'bush'
    this.health = 0.3 + Math.random() * 0.3;
    this.maxHealth = 1;
    this.age = 0;
    this.growth = 0.1 + Math.random() * 0.2;
    this.seeded = false;
    const th = terrainHeightAt(x);
    this.groundY = th.h;
    this.moisture = th.moisture;

    if (type === 'grass') { this.maxH = 8 + Math.random() * 12; this.hue = 90 + Math.random() * 40; }
    else if (type === 'flower') { this.maxH = 15 + Math.random() * 10; this.hue = Math.random() * 360; this.pollen = 0; }
    else if (type === 'tree') { this.maxH = 60 + Math.random() * 40; this.hue = 100 + Math.random() * 30; this.canopy = 20 + Math.random() * 15; }
    else { this.maxH = 25 + Math.random() * 15; this.hue = 85 + Math.random() * 35; }
  }

  update(dt) {
    this.age += dt;
    const sun = getSunIntensity();
    const water = rainIntensity * 0.5 + this.moisture * 0.3 + waterLevel * 0.2;
    const nutrients = soilNutrients;
    const growthRate = sun * water * nutrients * 0.15;

    if (this.health < this.maxHealth) {
      this.health = Math.min(this.maxHealth, this.health + growthRate * dt);
    }

    this.growth = Math.min(1, this.growth + growthRate * dt * 0.5);

    if (this.type === 'flower') {
      this.pollen = Math.min(1, (this.pollen || 0) + sun * 0.02 * dt);
    }

    // Seed dispersal
    if (this.health > 0.7 && this.growth > 0.8 && !this.seeded && Math.random() < 0.002 * dt * 60) {
      this.seeded = true;
      const nx = this.x + (Math.random() - 0.5) * 80;
      if (nx > 20 && nx < W - 20) {
        const nt = terrainHeightAt(nx);
        if (nt.h < H * 0.75) {
          const types = this.type === 'tree' ? ['tree', 'bush'] : ['grass', 'flower', 'grass'];
          plants.push(new Plant(nx, types[Math.floor(Math.random() * types.length)]));
        }
      }
    }

    // Eaten
    return this.health > 0.05;
  }

  draw() {
    const h = this.maxH * this.growth * this.health;
    const sway = Math.sin(Date.now() * 0.002 + this.x * 0.01) * 2 * windStrength;
    const x = this.x + sway;

    if (this.type === 'grass') {
      ctx.save();
      ctx.translate(x, this.groundY);
      const blades = 3 + Math.floor(this.growth * 4);
      for (let i = 0; i < blades; i++) {
        const ox = (i - blades / 2) * 3;
        const bh = h * (0.7 + Math.random() * 0.3);
        const grad = ctx.createLinearGradient(ox, 0, ox + sway, -bh);
        grad.addColorStop(0, `hsl(${this.hue}, 45%, 30%)`);
        grad.addColorStop(1, `hsl(${this.hue + 15}, 55%, 45%)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ox, 0);
        ctx.quadraticCurveTo(ox + sway * 0.5, -bh * 0.6, ox + sway, -bh);
        ctx.stroke();
      }
      ctx.restore();
    } else if (this.type === 'flower') {
      ctx.save();
      ctx.translate(x, this.groundY);
      ctx.strokeStyle = `hsl(${120}, 40%, 35%)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(sway, -h * 0.5, sway * 0.3, -h);
      ctx.stroke();
      const petalCount = 5 + Math.floor(this.growth * 3);
      for (let i = 0; i < petalCount; i++) {
        const a = (i / petalCount) * Math.PI * 2 + Date.now() * 0.0005;
        const px = Math.cos(a) * 5 * this.growth;
        const py = -h + Math.sin(a) * 5 * this.growth;
        ctx.fillStyle = `hsl(${this.hue}, 70%, ${50 + this.health * 15}%)`;
        ctx.beginPath();
        ctx.ellipse(px + sway * 0.3, py, 4 * this.growth, 3 * this.growth, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = `hsl(45, 90%, 55%)`;
      ctx.beginPath();
      ctx.arc(sway * 0.3, -h, 3 * this.growth, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (this.type === 'tree') {
      ctx.save();
      ctx.translate(x, this.groundY);
      const trunkW = 4 + this.growth * 6;
      const trunkH = h * 0.6;
      const grad = ctx.createLinearGradient(-trunkW, 0, trunkW, 0);
      grad.addColorStop(0, `hsl(${this.hue - 10}, 30%, 22%)`);
      grad.addColorStop(0.5, `hsl(${this.hue}, 35%, 30%)`);
      grad.addColorStop(1, `hsl(${this.hue - 10}, 30%, 18%)`);
      ctx.fillStyle = grad;
      ctx.fillRect(-trunkW / 2 + sway * 0.1, -trunkH, trunkW, trunkH);
      const canopyR = this.canopy * this.growth * this.health;
      const cg = ctx.createRadialGradient(sway * 0.2, -trunkH - canopyR * 0.3, 0, sway * 0.2, -trunkH - canopyR * 0.3, canopyR);
      cg.addColorStop(0, `hsla(${this.hue + 10}, 50%, 40%, 0.9)`);
      cg.addColorStop(0.6, `hsla(${this.hue}, 45%, 30%, 0.85)`);
      cg.addColorStop(1, `hsla(${this.hue - 5}, 40%, 22%, 0.6)`);
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(sway * 0.2, -trunkH - canopyR * 0.4, canopyR, canopyR * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(sway * 0.3 - canopyR * 0.3, -trunkH - canopyR * 0.2, canopyR * 0.7, canopyR * 0.55, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(sway * 0.1 + canopyR * 0.25, -trunkH - canopyR * 0.15, canopyR * 0.65, canopyR * 0.5, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(x, this.groundY);
      ctx.fillStyle = `hsl(${this.hue}, 40%, 28%)`;
      ctx.fillRect(-3, -h * 0.5, 6, h * 0.5);
      const br = 12 * this.growth;
      ctx.fillStyle = `hsla(${this.hue + 5}, 45%, 32%, 0.85)`;
      ctx.beginPath();
      ctx.ellipse(sway * 0.2, -h * 0.5 - br * 0.3, br, br * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  get eaten() {
    return this.health;
  }

  set eaten(v) {
    this.health = Math.max(0, v);
    if (this.health <= 0) {
      organicMatter.push({ x: this.x, y: this.groundY, amount: 0.3 + this.growth * 0.4, age: 0 });
    }
  }
}

class Herbivore {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 30;
    this.vy = 0;
    this.energy = 0.5 + Math.random() * 0.3;
    this.age = 0;
    this.maxAge = 40 + Math.random() * 30;
    this.speed = 25 + Math.random() * 15;
    this.hopTimer = Math.random() * 2;
    this.facing = Math.random() > 0.5 ? 1 : -1;
    this.state = 'grazing';
    this.fleeTimer = 0;
  }

  update(dt) {
    this.age += dt;
    if (this.age > this.maxAge || this.energy <= 0) {
      organicMatter.push({ x: this.x, y: this.y, amount: 0.5, age: 0 });
      return false;
    }

    this.energy -= 0.008 * dt;

    // Find nearest predator
    let nearestPred = null, predDist = Infinity;
    for (const p of predators) {
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d < predDist) { predDist = d; nearestPred = p; }
    }

    if (nearestPred && predDist < 120) {
      this.state = 'fleeing';
      this.fleeTimer = 2;
      const angle = Math.atan2(this.y - nearestPred.y, this.x - nearestPred.x);
      this.vx = Math.cos(angle) * this.speed * 2;
      this.facing = this.vx > 0 ? 1 : -1;
    } else if (this.fleeTimer > 0) {
      this.fleeTimer -= dt;
      if (this.fleeTimer <= 0) this.state = 'grazing';
    }

    if (this.state === 'grazing') {
      let nearestPlant = null, plantDist = Infinity;
      for (const pl of plants) {
        if (pl.type === 'tree') continue;
        const d = Math.abs(pl.x - this.x);
        if (d < plantDist && d < 40) { plantDist = d; nearestPlant = pl; }
      }

      if (nearestPlant && plantDist < 15) {
        nearestPlant.eaten -= 0.03 * dt;
        this.energy = Math.min(1, this.energy + 0.04 * dt);
        this.hopTimer -= dt;
      } else if (nearestPlant) {
        this.vx = (nearestPlant.x > this.x ? 1 : -1) * this.speed * 0.5;
        this.facing = this.vx > 0 ? 1 : -1;
      } else {
        this.vx += (Math.random() - 0.5) * 10 * dt;
        this.vx = Math.max(-this.speed * 0.3, Math.min(this.speed * 0.3, this.vx));
        if (Math.abs(this.vx) > 1) this.facing = this.vx > 0 ? 1 : -1;
      }
    }

    this.x += this.vx * dt;
    this.vx *= 0.98;

    const th = terrainHeightAt(this.x);
    this.y = th.h - 4;

    if (this.x < 10) { this.x = 10; this.vx = Math.abs(this.vx); }
    if (this.x > W - 10) { this.x = W - 10; this.vx = -Math.abs(this.vx); }

    // Reproduce
    if (this.energy > 0.75 && Math.random() < 0.001 * dt * 60) {
      this.energy *= 0.5;
      herbivores.push(new Herbivore(this.x + (Math.random() - 0.5) * 20, this.y));
    }

    return true;
  }

  draw() {
    const hop = this.state === 'fleeing' ? Math.abs(Math.sin(Date.now() * 0.02)) * 4 : Math.abs(Math.sin(Date.now() * 0.008 + this.x)) * 1.5;
    ctx.save();
    ctx.translate(this.x, this.y - hop);
    ctx.scale(this.facing, 1);

    ctx.fillStyle = `rgba(196, 163, 90, ${0.6 + this.energy * 0.4})`;
    ctx.beginPath();
    ctx.ellipse(0, -3, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(180, 145, 75, ${0.7 + this.energy * 0.3})`;
    ctx.beginPath();
    ctx.ellipse(5, -6, 4, 3.5, 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(220, 200, 180, 0.6)';
    ctx.beginPath();
    ctx.ellipse(7, -7, 1.5, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(50, 30, 20, 0.8)';
    ctx.beginPath();
    ctx.arc(8, -7.5, 0.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(196, 163, 90, 0.5)';
    ctx.beginPath();
    ctx.ellipse(-4, -1, 3, 2, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Predator {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 40;
    this.energy = 0.6 + Math.random() * 0.3;
    this.age = 0;
    this.maxAge = 60 + Math.random() * 40;
    this.speed = 45 + Math.random() * 20;
    this.facing = Math.random() > 0.5 ? 1 : -1;
    this.state = 'hunting';
    this.tailPhase = Math.random() * Math.PI * 2;
  }

  update(dt) {
    this.age += dt;
    if (this.age > this.maxAge || this.energy <= 0) {
      organicMatter.push({ x: this.x, y: this.y, amount: 0.6, age: 0 });
      return false;
    }

    this.energy -= 0.005 * dt;
    this.tailPhase += dt * 3;

    let target = null, targetDist = Infinity;
    for (const h of herbivores) {
      const d = Math.hypot(h.x - this.x, h.y - this.y);
      if (d < targetDist) { targetDist = d; target = h; }
    }

    if (target && targetDist < 200) {
      const angle = Math.atan2(target.y - this.y, target.x - this.x);
      this.vx = Math.cos(angle) * this.speed;
      this.facing = this.vx > 0 ? 1 : -1;

      if (targetDist < 12) {
        target.energy -= 0.5;
        this.energy = Math.min(1, this.energy + 0.3);
        if (target.energy <= 0) {
          const idx = herbivores.indexOf(target);
          if (idx >= 0) {
            organicMatter.push({ x: target.x, y: target.y, amount: 0.4, age: 0 });
            herbivores.splice(idx, 1);
          }
        }
      }
    } else {
      this.vx += (Math.random() - 0.5) * 20 * dt;
      this.vx = Math.max(-this.speed * 0.4, Math.min(this.speed * 0.4, this.vx));
      if (Math.abs(this.vx) > 2) this.facing = this.vx > 0 ? 1 : -1;
    }

    this.x += this.vx * dt;
    this.vx *= 0.97;

    const th = terrainHeightAt(this.x);
    this.y = th.h - 6;

    if (this.x < 10) { this.x = 10; this.vx = Math.abs(this.vx); }
    if (this.x > W - 10) { this.x = W - 10; this.vx = -Math.abs(this.vx); }

    if (this.energy > 0.8 && Math.random() < 0.0005 * dt * 60) {
      this.energy *= 0.6;
      predators.push(new Predator(this.x + (Math.random() - 0.5) * 30, this.y));
    }

    return true;
  }

  draw() {
    const prowl = Math.sin(Date.now() * 0.004 + this.x * 0.02) * 1;
    ctx.save();
    ctx.translate(this.x, this.y - prowl);
    ctx.scale(this.facing, 1);

    ctx.fillStyle = `rgba(139, 69, 19, ${0.65 + this.energy * 0.35})`;
    ctx.beginPath();
    ctx.ellipse(0, -4, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(160, 82, 25, ${0.7 + this.energy * 0.3})`;
    ctx.beginPath();
    ctx.ellipse(8, -8, 5, 4.5, 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 200, 100, 0.7)';
    ctx.beginPath();
    ctx.arc(10, -9, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = `rgba(120, 60, 15, ${0.6 + this.energy * 0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-10, -3);
    ctx.quadraticCurveTo(-18, -8 + Math.sin(this.tailPhase) * 4, -22, -2 + Math.sin(this.tailPhase + 1) * 3);
    ctx.stroke();

    ctx.fillStyle = 'rgba(100, 50, 10, 0.5)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(-2 + i * 5, -2, 2, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(180, 100, 40, 0.6)';
    ctx.beginPath();
    ctx.moveTo(6, -11);
    ctx.lineTo(5, -14);
    ctx.lineTo(7, -11);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10, -11);
    ctx.lineTo(11, -14);
    ctx.lineTo(9, -11);
    ctx.fill();

    ctx.restore();
  }
}

class Pollinator {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'bee' or 'butterfly'
    this.vx = (Math.random() - 0.5) * 40;
    this.vy = (Math.random() - 0.5) * 20;
    this.target = null;
    this.wingPhase = Math.random() * Math.PI * 2;
    this.energy = 0.5 + Math.random() * 0.5;
    this.age = 0;
    this.hue = type === 'butterfly' ? Math.random() * 360 : 45;
  }

  update(dt) {
    this.age += dt;
    this.wingPhase += dt * (this.type === 'bee' ? 30 : 8);
    this.energy -= 0.003 * dt;

    if (this.energy <= 0 || this.age > 50) return false;

    if (!this.target || Math.random() < 0.01) {
      const flowers = plants.filter(p => p.type === 'flower' && p.health > 0.3);
      if (flowers.length) {
        this.target = flowers[Math.floor(Math.random() * flowers.length)];
      } else {
        this.target = null;
      }
    }

    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = (this.target.groundY - this.target.maxH * 0.5) - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 5) {
        this.vx = dx / dist * 50;
        this.vy = dy / dist * 50;
      } else {
        this.target.health = Math.min(this.target.maxHealth, this.target.health + 0.01 * dt);
        this.energy = Math.min(1, this.energy + 0.02 * dt);
        if (this.target.pollen > 0.5 && Math.random() < 0.003 * dt * 60) {
          const nx = this.x + (Math.random() - 0.5) * 60;
          if (nx > 20 && nx < W - 20) {
            plants.push(new Plant(nx, 'flower'));
          }
        }
        this.vx *= 0.9;
        this.vy *= 0.9;
      }
    } else {
      this.vx += (Math.random() - 0.5) * 30 * dt;
      this.vy += (Math.random() - 0.5) * 20 * dt;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= 0.98;
    this.vy *= 0.98;

    this.y += Math.sin(this.wingPhase) * 0.5;

    if (this.x < 5) this.x = 5;
    if (this.x > W - 5) this.x = W - 5;
    if (this.y < H * 0.15) this.y = H * 0.15;
    if (this.y > H * 0.7) this.y = H * 0.7;

    return true;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.type === 'bee') {
      const wingFlap = Math.sin(this.wingPhase) * 0.4;
      ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
      ctx.beginPath();
      ctx.ellipse(-3, -2 + wingFlap * 3, 4, 2, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(3, -2 + wingFlap * 3, 4, 2, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `hsl(${this.hue}, 80%, 50%)`;
      ctx.beginPath();
      ctx.ellipse(0, 0, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(30, 20, 10, 0.8)';
      ctx.fillRect(-2, -1.5, 1.5, 3);
      ctx.fillRect(0.5, -1.5, 1.5, 3);
    } else {
      const wingFlap = Math.sin(this.wingPhase) * 0.3;
      ctx.fillStyle = `hsla(${this.hue}, 60%, 60%, 0.4)`;
      ctx.beginPath();
      ctx.ellipse(-4, -1 + wingFlap * 2, 6, 4, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(4, -1 + wingFlap * 2, 6, 4, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `hsl(${this.hue}, 50%, 35%)`;
      ctx.beginPath();
      ctx.ellipse(0, 0, 1.5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

// ─── Particles ───
function spawnRain() {
  if (rainIntensity < 0.1) return;
  for (let i = 0; i < rainIntensity * 3; i++) {
    particles.push({
      x: Math.random() * W,
      y: -10,
      vx: windStrength * 30 * Math.cos(windAngle),
      vy: 200 + rainIntensity * 300,
      life: 1,
      type: 'rain',
      len: 8 + Math.random() * 12
    });
  }
}

function spawnPollen() {
  if (getSunIntensity() < 0.3) return;
  if (Math.random() > 0.3) return;
  particles.push({
    x: Math.random() * W,
    y: H * 0.3 + Math.random() * H * 0.3,
    vx: windStrength * 10 * Math.cos(windAngle) + (Math.random() - 0.5) * 5,
    vy: -5 + Math.random() * 10,
    life: 0.5 + Math.random() * 0.5,
    type: 'pollen',
    size: 1 + Math.random() * 2,
    hue: 40 + Math.random() * 30
  });
}

function spawnFirefly() {
  if (getSunIntensity() > 0.1) return;
  if (Math.random() > 0.05) return;
  particles.push({
    x: Math.random() * W,
    y: terrainHeightAt(Math.random() * W).h - 10 - Math.random() * 40,
    vx: (Math.random() - 0.5) * 10,
    vy: (Math.random() - 0.5) * 10,
    life: 1 + Math.random() * 2,
    type: 'firefly',
    phase: Math.random() * Math.PI * 2,
    size: 1.5 + Math.random()
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * (p.type === 'rain' ? 0 : 0.3);

    if (p.type === 'firefly') {
      p.phase += dt * 4;
      p.vx += (Math.random() - 0.5) * 20 * dt;
      p.vy += (Math.random() - 0.5) * 20 * dt;
    }

    if (p.life <= 0 || p.y > H + 20 || p.x < -20 || p.x > W + 20) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    if (p.type === 'rain') {
      ctx.strokeStyle = `rgba(180, 200, 230, ${0.15 + rainIntensity * 0.25})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.vx * 0.02, p.y + p.len);
      ctx.stroke();
    } else if (p.type === 'pollen') {
      ctx.fillStyle = `hsla(${p.hue}, 60%, 70%, ${p.life * 0.4})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'firefly') {
      const glow = Math.max(0, Math.sin(p.phase)) ** 2;
      ctx.fillStyle = `rgba(200, 255, 100, ${glow * p.life * 0.8})`;
      ctx.shadowColor = 'rgba(200, 255, 100, 0.5)';
      ctx.shadowBlur = 8 * glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * glow, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

// ─── Stars ───
const stars = Array.from({ length: 120 }, () => ({
  x: Math.random(),
  y: Math.random() * 0.55,
  size: 0.5 + Math.random() * 1.5,
  twinkle: Math.random() * Math.PI * 2
}));

function drawStars(nightAmount) {
  if (nightAmount < 0.1) return;
  for (const s of stars) {
    s.twinkle += 0.02;
    const alpha = nightAmount * (0.3 + Math.sin(s.twinkle) * 0.2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─── Clouds ───
const clouds = Array.from({ length: 6 }, (_, i) => ({
  x: Math.random() * W,
  y: H * 0.05 + Math.random() * H * 0.15,
  scale: 0.6 + Math.random() * 0.8,
  speed: 5 + Math.random() * 10,
  opacity: 0.3 + Math.random() * 0.3
}));

function drawClouds(skyAlpha) {
  for (const c of clouds) {
    c.x += c.speed * 0.016;
    if (c.x > W + 200) c.x = -200;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale * 0.5);
    ctx.fillStyle = `rgba(255, 255, 255, ${c.opacity * skyAlpha})`;
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, Math.PI * 2);
    ctx.arc(35, -5, 30, 0, Math.PI * 2);
    ctx.arc(-30, -3, 28, 0, Math.PI * 2);
    ctx.arc(15, -12, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─── Sun / Moon ───
function drawCelestialBody() {
  const sun = getSunIntensity();
  const t = timeOfDay;
  const angle = t * Math.PI * 2 - Math.PI / 2;
  const cx = W * 0.5 + Math.cos(angle) * W * 0.35;
  const cy = H * 0.35 + Math.sin(angle) * H * 0.25;

  if (sun > 0.05) {
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
    glow.addColorStop(0, `rgba(255, 240, 180, ${sun * 0.6})`);
    glow.addColorStop(0.3, `rgba(255, 200, 80, ${sun * 0.2})`);
    glow.addColorStop(1, 'rgba(255, 180, 50, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, 80, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255, 230, 150, ${sun})`;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  const night = 1 - sun * 2;
  if (night > 0.1) {
    const mx = W * 0.5 + Math.cos(angle + Math.PI) * W * 0.3;
    const my = H * 0.2 + Math.sin(angle + Math.PI) * H * 0.15;
    ctx.fillStyle = `rgba(220, 225, 240, ${night * 0.8})`;
    ctx.beginPath();
    ctx.arc(mx, my, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(getSkyColors().top, night * 0.8);
    ctx.beginPath();
    ctx.arc(mx + 5, my - 3, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─── Background ───
function drawBackground() {
  const sky = getSkyColors();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, rgb(sky.top));
  grad.addColorStop(0.45, rgb(sky.mid));
  grad.addColorStop(0.75, rgb(sky.bot));
  grad.addColorStop(1, rgb(lerpColor(sky.bot, [30, 50, 25], 0.5)));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawStars(sky.night);
  drawClouds(0.5 + rainIntensity * 0.5);
  drawCelestialBody();

  // Distant hills
  ctx.fillStyle = `rgba(40, 70, 35, ${0.3 + sky.sun * 0.2})`;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.5);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, H * 0.45 + Math.sin(x * 0.005 + 1) * 30 + Math.sin(x * 0.012) * 15);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  ctx.fillStyle = `rgba(50, 85, 40, ${0.4 + sky.sun * 0.2})`;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.55);
  for (let x = 0; x <= W; x += 15) {
    ctx.lineTo(x, H * 0.52 + Math.sin(x * 0.008 + 2) * 25 + Math.sin(x * 0.018 + 0.5) * 10);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();
}

function drawTerrain() {
  const sky = getSkyColors();

  // Ground fill
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i <= TERRAIN_RES; i++) {
    ctx.lineTo(terrain[i].x, terrain[i].h);
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  const groundGrad = ctx.createLinearGradient(0, H * 0.5, 0, H);
  groundGrad.addColorStop(0, rgb(lerpColor([60, 90, 40], [80, 120, 50], sky.sun)));
  groundGrad.addColorStop(0.5, rgb(lerpColor([45, 70, 30], [65, 100, 40], sky.sun)));
  groundGrad.addColorStop(1, rgb(lerpColor([30, 45, 20], [40, 60, 25], sky.sun)));
  ctx.fillStyle = groundGrad;
  ctx.fill();

  // Water pool
  const waterY = H * 0.72;
  ctx.fillStyle = `rgba(50, 100, 140, ${0.5 + waterLevel * 0.3})`;
  ctx.beginPath();
  ctx.moveTo(W * 0.6, terrain[Math.floor(TERRAIN_RES * 0.6)].h);
  ctx.quadraticCurveTo(W * 0.75, waterY, W * 0.9, terrain[Math.floor(TERRAIN_RES * 0.9)].h);
  ctx.lineTo(W, H);
  ctx.lineTo(W * 0.55, H);
  ctx.closePath();
  ctx.fill();

  // Water shimmer
  if (getSunIntensity() > 0.2) {
    const shimmer = Math.sin(Date.now() * 0.003) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(150, 200, 255, ${shimmer * 0.15 * getSunIntensity()})`;
    ctx.beginPath();
    ctx.ellipse(W * 0.75, waterY + 10, 60, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Terrain line highlight
  ctx.strokeStyle = `rgba(100, 140, 60, ${0.3 + sky.sun * 0.2})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= TERRAIN_RES; i++) {
    if (i === 0) ctx.moveTo(terrain[i].x, terrain[i].h);
    else ctx.lineTo(terrain[i].x, terrain[i].h);
  }
  ctx.stroke();
}

function drawOrganicMatter() {
  for (const om of organicMatter) {
    const alpha = Math.max(0, 1 - om.age / 15) * om.amount;
    ctx.fillStyle = `rgba(80, 50, 25, ${alpha * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(om.x, om.groundY || om.y, 6 * om.amount, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─── Ecosystem Balance ───
function updateOrganicMatter(dt) {
  for (let i = organicMatter.length - 1; i >= 0; i--) {
    const om = organicMatter[i];
    om.age += dt;
    soilNutrients = Math.min(1, soilNutrients + om.amount * 0.001 * dt);
    if (om.age > 15) organicMatter.splice(i, 1);
  }
}

function balanceEcosystem(dt) {
  // Count populations
  const floraCount = plants.filter(p => p.health > 0.2).length;
  const herbCount = herbivores.length;
  const predCount = predators.length;
  const pollCount = pollinators.length;

  // Auto-seed if flora too low
  if (floraCount < 15 && Math.random() < 0.02 * dt * 60) {
    const x = 30 + Math.random() * (W - 60);
    const types = ['grass', 'grass', 'flower', 'bush'];
    plants.push(new Plant(x, types[Math.floor(Math.random() * types.length)]));
  }

  if (floraCount < 8 && Math.random() < 0.005 * dt * 60) {
    plants.push(new Plant(50 + Math.random() * (W - 100), 'tree'));
  }

  // Spawn herbivores if too few and enough food
  if (herbCount < 3 && floraCount > 10 && Math.random() < 0.003 * dt * 60) {
    const x = 50 + Math.random() * (W - 100);
    herbivores.push(new Herbivore(x, terrainHeightAt(x).h));
  }

  // Spawn predators if too few and enough prey
  if (predCount < 2 && herbCount > 4 && Math.random() < 0.001 * dt * 60) {
    const x = 50 + Math.random() * (W - 100);
    predators.push(new Predator(x, terrainHeightAt(x).h));
  }

  // Spawn pollinators
  if (pollCount < 4 && plants.some(p => p.type === 'flower') && Math.random() < 0.002 * dt * 60) {
    pollinators.push(new Pollinator(
      Math.random() * W, H * 0.3 + Math.random() * H * 0.3,
      Math.random() > 0.5 ? 'bee' : 'butterfly'
    ));
  }

  // Cap populations
  while (plants.length > 200) plants.shift();
  while (herbivores.length > 25) herbivores.shift();
  while (predators.length > 8) predators.shift();
  while (pollinators.length > 15) pollinators.shift();

  // Update HUD
  document.getElementById('bar-flora').style.width = Math.min(100, floraCount / 80 * 100) + '%';
  document.getElementById('bar-herb').style.width = Math.min(100, herbCount / 15 * 100) + '%';
  document.getElementById('bar-pred').style.width = Math.min(100, predCount / 6 * 100) + '%';
  document.getElementById('bar-water').style.width = (waterLevel * 100) + '%';
  document.getElementById('bar-soil').style.width = (soilNutrients * 100) + '%';
}

function updateTimeDisplay() {
  const hours = Math.floor(timeOfDay * 24);
  const mins = Math.floor((timeOfDay * 24 - hours) * 60);
  document.getElementById('clock').textContent =
    String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');

  let phase;
  if (timeOfDay < 0.2) phase = 'Night';
  else if (timeOfDay < 0.3) phase = 'Dawn';
  else if (timeOfDay < 0.45) phase = 'Morning';
  else if (timeOfDay < 0.55) phase = 'Noon';
  else if (timeOfDay < 0.7) phase = 'Afternoon';
  else if (timeOfDay < 0.8) phase = 'Dusk';
  else phase = 'Night';
  document.getElementById('phase').textContent = phase;
}

// ─── Interaction ───
let mouseDown = false;
let mouseX = 0;

canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  mouseX = e.clientX;
  seedAt(e.clientX);
});

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  if (mouseDown) targetRain = Math.min(1, targetRain + 0.02);
});

canvas.addEventListener('mouseup', () => { mouseDown = false; targetRain = 0; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; targetRain = 0; });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  seedAt(e.touches[0].clientX);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (mouseDown) targetRain = Math.min(1, targetRain + 0.02);
}, { passive: false });

canvas.addEventListener('touchend', () => { mouseDown = false; targetRain = 0; });

function seedAt(x) {
  const types = ['grass', 'grass', 'flower', 'bush', 'tree'];
  const type = types[Math.floor(Math.random() * types.length)];
  plants.push(new Plant(x + (Math.random() - 0.5) * 30, type));
  soilNutrients = Math.min(1, soilNutrients + 0.02);

  for (let i = 0; i < 5; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: terrainHeightAt(x).h,
      vx: (Math.random() - 0.5) * 30,
      vy: -20 - Math.random() * 30,
      life: 0.5 + Math.random() * 0.5,
      type: 'pollen',
      size: 2 + Math.random() * 2,
      hue: 80 + Math.random() * 40
    });
  }
}

// ─── Init ───
function initWorld() {
  initTerrain();

  for (let i = 0; i < 40; i++) {
    const x = 20 + Math.random() * (W - 40);
    const types = ['grass', 'grass', 'grass', 'flower', 'bush'];
    plants.push(new Plant(x, types[Math.floor(Math.random() * types.length)]));
  }

  for (let i = 0; i < 5; i++) {
    plants.push(new Plant(50 + Math.random() * (W - 100), 'tree'));
  }

  for (let i = 0; i < 6; i++) {
    const x = 50 + Math.random() * (W - 100);
    herbivores.push(new Herbivore(x, terrainHeightAt(x).h));
  }

  for (let i = 0; i < 2; i++) {
    const x = 100 + Math.random() * (W - 200);
    predators.push(new Predator(x, terrainHeightAt(x).h));
  }

  for (let i = 0; i < 5; i++) {
    pollinators.push(new Pollinator(
      Math.random() * W, H * 0.3 + Math.random() * H * 0.3,
      i % 2 === 0 ? 'bee' : 'butterfly'
    ));
  }
}

// ─── Main Loop ───
let lastTime = 0;
let introDone = false;

function frame(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  if (!introDone && timestamp > 3000) {
    introDone = true;
    document.getElementById('title-card').classList.add('hidden');
    document.getElementById('hud').classList.add('visible');
    document.getElementById('time-display').classList.add('visible');
    document.getElementById('legend').classList.add('visible');
    document.getElementById('hint').classList.add('visible');
  }

  // Time
  timeOfDay = (timeOfDay + dt / DAY_LENGTH) % 1;
  sunEnergy = getSunIntensity();

  // Weather
  rainIntensity += (targetRain - rainIntensity) * 0.05;
  if (rainIntensity > 0.01) {
    waterLevel = Math.min(1, waterLevel + rainIntensity * 0.001 * dt * 60);
    spawnRain();
  } else if (sunEnergy > 0.5) {
    waterLevel = Math.max(0.3, waterLevel - 0.0002 * dt * 60);
  }

  windAngle += (Math.random() - 0.5) * 0.01;
  windStrength = 0.3 + Math.sin(timestamp * 0.0003) * 0.2 + rainIntensity * 0.3;

  // Update
  for (let i = plants.length - 1; i >= 0; i--) {
    if (!plants[i].update(dt)) plants.splice(i, 1);
  }
  for (let i = herbivores.length - 1; i >= 0; i--) {
    if (!herbivores[i].update(dt)) herbivores.splice(i, 1);
  }
  for (let i = predators.length - 1; i >= 0; i--) {
    if (!predators[i].update(dt)) predators.splice(i, 1);
  }
  for (let i = pollinators.length - 1; i >= 0; i--) {
    if (!pollinators[i].update(dt)) pollinators.splice(i, 1);
  }

  updateOrganicMatter(dt);
  balanceEcosystem(dt);
  updateParticles(dt);
  spawnPollen();
  spawnFirefly();
  updateTimeDisplay();

  // Draw
  drawBackground();
  drawTerrain();

  // Sort entities by y for depth
  const entities = [
    ...plants.map(p => ({ draw: () => p.draw(), y: p.groundY })),
    ...organicMatter.map(om => ({ draw: () => {}, y: om.y || 0 })),
    ...herbivores.map(h => ({ draw: () => h.draw(), y: h.y })),
    ...predators.map(p => ({ draw: () => p.draw(), y: p.y })),
    ...pollinators.map(p => ({ draw: () => p.draw(), y: p.y }))
  ];
  entities.sort((a, b) => a.y - b.y);
  for (const e of entities) e.draw();
  drawOrganicMatter();

  drawParticles();

  // Atmospheric overlay
  const sky = getSkyColors();
  if (sky.night > 0.3) {
    ctx.fillStyle = `rgba(10, 15, 40, ${sky.night * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (sky.twilight > 0.1) {
    ctx.fillStyle = `rgba(255, 120, 60, ${sky.twilight * 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (rainIntensity > 0.1) {
    ctx.fillStyle = `rgba(100, 120, 150, ${rainIntensity * 0.1})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

initWorld();
requestAnimationFrame(frame);

window.addEventListener('resize', () => {
  initTerrain();
});

})();
</script>
</body>
</html>
