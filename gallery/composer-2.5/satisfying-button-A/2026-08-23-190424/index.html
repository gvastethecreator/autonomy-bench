<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satisfying Button</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0f0f1a 60%, #080810 100%);
      overflow: hidden;
      user-select: none;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb:nth-child(1) { width: 400px; height: 400px; background: #6366f1; top: -10%; left: 20%; }
    .orb:nth-child(2) { width: 300px; height: 300px; background: #ec4899; bottom: 10%; right: 15%; animation-delay: -4s; }
    .orb:nth-child(3) { width: 250px; height: 250px; background: #06b6d4; top: 50%; left: -5%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, -30px) scale(1.1); }
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .counter {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
    }

    .counter span {
      display: block;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.1;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .counter span.pop {
      transform: scale(1.25);
    }

    .btn-wrap {
      position: relative;
    }

    .btn-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid rgba(99, 102, 241, 0.3);
      animation: pulse-ring 2.5s ease-out infinite;
      pointer-events: none;
    }

    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    #satisfy-btn {
      position: relative;
      width: 160px;
      height: 160px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: linear-gradient(145deg, #818cf8 0%, #6366f1 40%, #4f46e5 100%);
      box-shadow:
        0 0 0 4px rgba(99, 102, 241, 0.15),
        0 8px 32px rgba(99, 102, 241, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -4px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.08s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    #satisfy-btn::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: linear-gradient(160deg, rgba(255,255,255,0.18) 0%, transparent 50%);
      pointer-events: none;
    }

    #satisfy-btn::after {
      content: "✦";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #satisfy-btn:hover {
      box-shadow:
        0 0 0 6px rgba(99, 102, 241, 0.2),
        0 12px 48px rgba(99, 102, 241, 0.55),
        0 4px 12px rgba(0, 0, 0, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        inset 0 -4px 8px rgba(0, 0, 0, 0.15);
    }

    #satisfy-btn:active,
    #satisfy-btn.pressed {
      transform: scale(0.88);
      box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.25),
        0 2px 12px rgba(99, 102, 241, 0.35),
        inset 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    #satisfy-btn:active::after,
    #satisfy-btn.pressed::after {
      transform: scale(0.85) rotate(72deg);
    }

    .hint {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.05em;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: particle-fly var(--dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes particle-fly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      pointer-events: none;
      animation: ripple-out 0.6s ease-out forwards;
    }

    @keyframes ripple-out {
      from { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      to   { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    .flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at var(--fx) var(--fy), rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      transition: opacity 0.05s;
    }

    .flash.on { opacity: 1; }

    .combo {
      position: absolute;
      top: -2.5rem;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 1.1rem;
      font-weight: 700;
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
      white-space: nowrap;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      opacity: 0;
    }

    .combo.show {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="particles" id="particles"></div>

  <div class="stage">
    <div class="counter">
      presses
      <span id="count">0</span>
    </div>

    <div class="btn-wrap">
      <div class="combo" id="combo"></div>
      <div class="btn-ring"></div>
      <button id="satisfy-btn" aria-label="Satisfying button">Press me</button>
    </div>

    <p class="hint">click for maximum satisfaction</p>
  </div>

  <script>
    const btn = document.getElementById("satisfy-btn");
    const countEl = document.getElementById("count");
    const particlesEl = document.getElementById("particles");
    const flash = document.getElementById("flash");
    const comboEl = document.getElementById("combo");

    let count = 0;
    let combo = 0;
    let lastClick = 0;
    let comboTimer = null;

    const hues = [250, 280, 320, 190, 160, 45];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPop(pitch = 1) {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(180 * pitch, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.start(t);
      osc.stop(t + 0.15);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(600 * pitch, t);
      osc2.frequency.exponentialRampToValueAtTime(200, t + 0.08);
      gain2.gain.setValueAtTime(0.08, t);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc2.start(t);
      osc2.stop(t + 0.1);
    }

    function spawnParticles(x, y, n = 14) {
      const hue = hues[Math.floor(Math.random() * hues.length)];
      for (let i = 0; i < n; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
        const dist = 60 + Math.random() * 80;
        const size = 4 + Math.random() * 8;
        p.style.cssText = `
          left: ${x}px; top: ${y}px;
          width: ${size}px; height: ${size}px;
          background: hsl(${hue + Math.random() * 30}, 90%, 65%);
          --tx: ${Math.cos(angle) * dist}px;
          --ty: ${Math.sin(angle) * dist}px;
          --dur: ${0.5 + Math.random() * 0.4}s;
        `;
        particlesEl.appendChild(p);
        p.addEventListener("animationend", () => p.remove());
      }
    }

    function spawnRipple(x, y, parent) {
      const r = document.createElement("div");
      r.className = "ripple";
      r.style.left = x + "px";
      r.style.top = y + "px";
      r.style.width = "80px";
      r.style.height = "80px";
      parent.appendChild(r);
      r.addEventListener("animationend", () => r.remove());
    }

    function updateCombo() {
      const now = Date.now();
      if (now - lastClick < 600) {
        combo++;
      } else {
        combo = 1;
      }
      lastClick = now;

      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => { combo = 0; comboEl.classList.remove("show"); }, 800);

      if (combo >= 3) {
        comboEl.textContent = combo >= 10 ? `${combo}x LEGENDARY` : `${combo}x combo!`;
        comboEl.classList.add("show");
      }
    }

    function satisfy(e) {
      if (audioCtx.state === "suspended") audioCtx.resume();

      count++;
      countEl.textContent = count;
      countEl.classList.add("pop");
      requestAnimationFrame(() => setTimeout(() => countEl.classList.remove("pop"), 150));

      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const localX = e.clientX - rect.left;
      const localY = e.clientY - rect.top;

      spawnRipple(localX, localY, btn.parentElement);
      spawnParticles(cx, cy, 10 + Math.min(combo, 8));

      flash.style.setProperty("--fx", cx + "px");
      flash.style.setProperty("--fy", cy + "px");
      flash.classList.add("on");
      requestAnimationFrame(() => flash.classList.remove("on"));

      const pitch = 1 + (combo * 0.05) + Math.min(count * 0.002, 0.3);
      playPop(pitch);

      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 120);

      const hueShift = (count * 7) % 360;
      btn.style.background = `linear-gradient(145deg,
        hsl(${hueShift + 30}, 85%, 72%) 0%,
        hsl(${hueShift + 10}, 80%, 62%) 40%,
        hsl(${hueShift}, 75%, 52%) 100%)`;

      updateCombo();

      if (navigator.vibrate) navigator.vibrate(12);
    }

    btn.addEventListener("click", satisfy);
    btn.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        satisfy({ clientX: btn.getBoundingClientRect().left + 80, clientY: btn.getBoundingClientRect().top + 80 });
      }
    });
  </script>
</body>
</html>
