<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automated Factory — Nexus Assembly Line</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #00e5ff;
    --accent-dim: #0099aa;
    --warn: #ff6b35;
    --success: #39ff14;
    --bg-deep: #0a0e17;
    --panel: rgba(12, 20, 35, 0.85);
    --border: rgba(0, 229, 255, 0.25);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Rajdhani', sans-serif;
    color: #c8d6e5;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, transparent 100%);
  }

  .title-block h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #fff;
    text-shadow: 0 0 30px rgba(0,229,255,0.5);
  }

  .title-block .subtitle {
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 4px;
    opacity: 0.8;
  }

  .stats-panel {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 18px;
    min-width: 120px;
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6b8299;
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  .stat-value.accent { color: var(--accent); }
  .stat-value.success { color: var(--success); }
  .stat-value.warn { color: var(--warn); }

  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(0deg, rgba(10,14,23,0.95) 0%, transparent 100%);
  }

  .station-indicators {
    display: flex;
    gap: 8px;
  }

  .station-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #334;
    border: 1px solid #556;
    transition: all 0.3s;
  }

  .station-dot.active {
    background: var(--success);
    box-shadow: 0 0 12px var(--success);
    border-color: var(--success);
  }

  .station-dot.processing {
    background: var(--warn);
    box-shadow: 0 0 12px var(--warn);
    border-color: var(--warn);
    animation: pulse 0.6s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  .legend {
    display: flex;
    gap: 20px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b8299;
  }

  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  .scanline {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    opacity: 0.4;
  }
</style>
</head>
<body>
<canvas id="factory"></canvas>
<div class="overlay">
  <div class="header">
    <div class="title-block">
      <h1>NEXUS FACTORY</h1>
      <div class="subtitle">Automated Assembly Line · Sector 7-G</div>
    </div>
    <div class="stats-panel">
      <div class="stat-card">
        <div class="stat-label">Throughput</div>
        <div class="stat-value accent" id="throughput">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Units / Min</div>
        <div class="stat-value success" id="rate">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Efficiency</div>
        <div class="stat-value" id="efficiency">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Arms</div>
        <div class="stat-value warn" id="arms">6/6</div>
      </div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="station-indicators" id="stations"></div>
    <div class="legend">
      <span><i style="background:#888"></i> Raw</span>
      <span><i style="background:#00e5ff"></i> Machined</span>
      <span><i style="background:#ff6b35"></i> Painted</span>
      <span><i style="background:#39ff14"></i> Complete</span>
    </div>
  </div>
  <div class="vignette"></div>
  <div class="scanline"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('factory');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  let time = 0;
  let totalProduced = 0;
  let lastMinuteCount = 0;
  let minuteStart = performance.now();
  let producedThisMinute = 0;

  const STAGES = ['raw', 'machined', 'painted', 'complete'];
  const STAGE_COLORS = {
    raw: { fill: '#666', glow: '#888', label: 'RAW' },
    machined: { fill: '#0088aa', glow: '#00e5ff', label: 'MACH' },
    painted: { fill: '#cc4422', glow: '#ff6b35', label: 'PAINT' },
    complete: { fill: '#22aa11', glow: '#39ff14', label: 'DONE' }
  };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Particles ---
  const particles = [];
  class Particle {
    constructor(x, y, type) {
      this.x = x; this.y = y;
      this.type = type;
      this.life = 1;
      this.vx = (Math.random() - 0.5) * (type === 'spark' ? 4 : 1);
      this.vy = type === 'spark' ? -Math.random() * 3 - 1 : -Math.random() * 0.5 - 0.2;
      this.size = type === 'spark' ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
      this.color = type === 'spark'
        ? `hsl(${30 + Math.random() * 30}, 100%, ${50 + Math.random() * 30}%)`
        : `rgba(180, 200, 220, ${Math.random() * 0.3 + 0.1})`;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.type === 'spark' ? 0.04 : 0.008;
      if (this.type === 'steam') this.vx *= 0.98;
    }
    draw(c) {
      c.globalAlpha = this.life;
      c.fillStyle = this.color;
      c.beginPath();
      c.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
      c.fill();
      c.globalAlpha = 1;
    }
  }

  function emitSparks(x, y, count = 8) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, 'spark'));
  }
  function emitSteam(x, y, count = 2) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, 'steam'));
  }

  // --- Products on conveyor ---
  const products = [];
  let spawnTimer = 0;
  const SPAWN_INTERVAL = 2.8;

  class Product {
    constructor() {
      this.stage = 0;
      this.progress = 0;
      this.x = -30;
      this.y = 0;
      this.size = 18;
      this.processing = false;
      this.processTimer = 0;
      this.id = Math.random().toString(36).slice(2, 6).toUpperCase();
    }
    get stageName() { return STAGES[this.stage]; }
    get color() { return STAGE_COLORS[this.stageName]; }
  }

  // --- Conveyor path ---
  function getConveyorY() { return H * 0.58; }
  function getConveyorPath(t) {
    const cy = getConveyorY();
    const startX = W * 0.05;
    const endX = W * 0.95;
    const x = startX + t * (endX - startX);
    return { x, y: cy };
  }

  const STATION_POSITIONS = [0.18, 0.42, 0.66, 0.88];
  const STATION_NAMES = ['INTAKE', 'CNC MILL', 'PAINT BOOTH', 'QC & PACK'];

  // --- Robotic Arms ---
  class RoboArm {
    constructor(stationIndex, side) {
      this.stationIndex = stationIndex;
      this.side = side; // 'top' or 'bottom'
      this.angle1 = 0;
      this.angle2 = 0;
      this.targetAngle1 = 0;
      this.targetAngle2 = 0;
      this.state = 'idle'; // idle, reaching, gripping, returning
      this.stateTimer = 0;
      this.gripOpen = 1;
      this.baseX = 0;
      this.baseY = 0;
    }

    update(dt, stationActive) {
      this.stateTimer += dt;
      const t = STATION_POSITIONS[this.stationIndex];
      const pos = getConveyorPath(t);
      this.baseX = pos.x;
      this.baseY = this.side === 'top' ? pos.y - 90 : pos.y + 70;

      if (stationActive && this.state === 'idle') {
        this.state = 'reaching';
        this.stateTimer = 0;
        this.targetAngle1 = this.side === 'top' ? 0.6 : -0.6;
        this.targetAngle2 = this.side === 'top' ? -0.8 : 0.8;
      }

      if (this.state === 'reaching' && this.stateTimer > 0.4) {
        this.state = 'gripping';
        this.stateTimer = 0;
        this.gripOpen = 0.3;
      }
      if (this.state === 'gripping' && this.stateTimer > 0.3) {
        this.state = 'returning';
        this.stateTimer = 0;
        this.targetAngle1 = 0;
        this.targetAngle2 = this.side === 'top' ? -0.3 : 0.3;
        this.gripOpen = 1;
      }
      if (this.state === 'returning' && this.stateTimer > 0.5) {
        this.state = 'idle';
        this.stateTimer = 0;
      }

      this.angle1 += (this.targetAngle1 - this.angle1) * 0.08;
      this.angle2 += (this.targetAngle2 - this.angle2) * 0.1;
      this.gripOpen += ((this.state === 'gripping' ? 0.3 : 1) - this.gripOpen) * 0.15;
    }

    draw(c) {
      const len1 = 45, len2 = 38;
      c.save();
      c.translate(this.baseX, this.baseY);

      // Base pedestal
      c.fillStyle = '#1a2535';
      c.strokeStyle = '#334';
      c.lineWidth = 2;
      c.beginPath();
      c.ellipse(0, 0, 22, 8, 0, 0, Math.PI * 2);
      c.fill(); c.stroke();

      // Column
      c.fillStyle = '#2a3545';
      c.fillRect(-8, -15, 16, 15);

      c.translate(0, -15);
      c.rotate(this.angle1);

      // Segment 1
      const g1 = c.createLinearGradient(0, 0, len1, 0);
      g1.addColorStop(0, '#3a4555');
      g1.addColorStop(0.5, '#5a6575');
      g1.addColorStop(1, '#4a5565');
      c.fillStyle = g1;
      c.strokeStyle = '#667';
      c.lineWidth = 1.5;
      c.beginPath();
      c.roundRect(-6, -5, len1, 10, 3);
      c.fill(); c.stroke();

      // Joint
      c.fillStyle = '#ff6b35';
      c.beginPath();
      c.arc(len1, 0, 6, 0, Math.PI * 2);
      c.fill();

      c.translate(len1, 0);
      c.rotate(this.angle2);

      // Segment 2
      const g2 = c.createLinearGradient(0, 0, len2, 0);
      g2.addColorStop(0, '#4a5565');
      g2.addColorStop(1, '#6a7585');
      c.fillStyle = g2;
      c.beginPath();
      c.roundRect(-5, -4, len2, 8, 2);
      c.fill(); c.stroke();

      // Gripper
      c.translate(len2, 0);
      const go = this.gripOpen * 8;
      c.fillStyle = '#889';
      c.fillRect(-2, -go - 2, 4, 4);
      c.fillRect(-2, go - 2, 4, 4);

      // LED
      c.fillStyle = this.state === 'idle' ? '#39ff14' : '#ff6b35';
      c.shadowColor = c.fillStyle;
      c.shadowBlur = 8;
      c.beginPath();
      c.arc(-3, 0, 2, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0;

      c.restore();
    }
  }

  const arms = [];
  for (let i = 0; i < 4; i++) {
    arms.push(new RoboArm(i, i % 2 === 0 ? 'top' : 'bottom'));
  }
  arms.push(new RoboArm(1, 'top'));
  arms.push(new RoboArm(2, 'bottom'));

  // --- Station processing state ---
  const stationStates = STATION_POSITIONS.map(() => ({ active: false, timer: 0 }));

  // --- Background elements ---
  function drawBackground(c) {
    // Sky gradient
    const sky = c.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a0e17');
    sky.addColorStop(0.4, '#0f1520');
    sky.addColorStop(1, '#141c28');
    c.fillStyle = sky;
    c.fillRect(0, 0, W, H);

    // Distant city silhouette
    c.fillStyle = '#0d1219';
    for (let i = 0; i < 20; i++) {
      const bx = (i / 20) * W + Math.sin(i * 3.7) * 20;
      const bh = 40 + Math.sin(i * 2.1) * 30 + Math.cos(i * 5.3) * 20;
      c.fillRect(bx, H * 0.25 - bh, 30 + Math.sin(i) * 15, bh);
    }

    // Ambient glow windows
    const t = time * 0.001;
    for (let i = 0; i < 30; i++) {
      const wx = (i * 137.5) % W;
      const wy = H * 0.15 + (i * 97) % (H * 0.15);
      const flicker = 0.3 + Math.sin(t * 2 + i) * 0.15;
      c.fillStyle = `rgba(255, 180, 80, ${flicker * 0.15})`;
      c.fillRect(wx, wy, 3, 4);
    }

    // Floor
    const floorY = H * 0.72;
    const floorGrad = c.createLinearGradient(0, floorY, 0, H);
    floorGrad.addColorStop(0, '#1a2030');
    floorGrad.addColorStop(1, '#0a0e17');
    c.fillStyle = floorGrad;
    c.fillRect(0, floorY, W, H - floorY);

    // Floor grid
    c.strokeStyle = 'rgba(0, 229, 255, 0.04)';
    c.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < W; x += gridSize) {
      c.beginPath(); c.moveTo(x, floorY); c.lineTo(x - (H - floorY) * 0.5, H); c.stroke();
    }
    for (let y = floorY; y < H; y += gridSize * 0.6) {
      c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    }

    // Overhead pipes
    c.strokeStyle = '#2a3545';
    c.lineWidth = 8;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, H * 0.12);
    c.bezierCurveTo(W * 0.3, H * 0.08, W * 0.7, H * 0.16, W, H * 0.1);
    c.stroke();
    c.lineWidth = 4;
    c.strokeStyle = '#3a4555';
    c.stroke();

    // Hanging lights
    for (let i = 0; i < 5; i++) {
      const lx = W * (0.1 + i * 0.2);
      const sway = Math.sin(t + i * 1.5) * 3;
      c.strokeStyle = '#445';
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(lx, H * 0.1); c.lineTo(lx + sway, H * 0.22); c.stroke();

      // Light cone
      const lg = c.createRadialGradient(lx + sway, H * 0.22, 0, lx + sway, H * 0.22, 80);
      lg.addColorStop(0, 'rgba(255, 200, 100, 0.08)');
      lg.addColorStop(1, 'transparent');
      c.fillStyle = lg;
      c.beginPath();
      c.moveTo(lx + sway - 30, H * 0.22);
      c.lineTo(lx + sway, H * 0.22 + 5);
      c.lineTo(lx + sway + 30, H * 0.22);
      c.lineTo(lx + sway + 60, getConveyorY());
      c.lineTo(lx + sway - 60, getConveyorY());
      c.closePath();
      c.fill();
    }
  }

  function drawConveyor(c) {
    const cy = getConveyorY();
    const startX = W * 0.03;
    const endX = W * 0.97;
    const beltH = 24;

    // Support structure
    c.fillStyle = '#1a2535';
    for (let i = 0; i < 8; i++) {
      const sx = startX + (endX - startX) * (i / 7);
      c.fillRect(sx - 3, cy + beltH / 2, 6, H * 0.72 - cy - beltH / 2);
    }

    // Belt frame
    c.fillStyle = '#2a3545';
    c.strokeStyle = '#445566';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(startX - 10, cy - beltH / 2 - 4, endX - startX + 20, beltH + 8, 4);
    c.fill(); c.stroke();

    // Belt surface
    const beltGrad = c.createLinearGradient(0, cy - beltH / 2, 0, cy + beltH / 2);
    beltGrad.addColorStop(0, '#3a4555');
    beltGrad.addColorStop(0.5, '#4a5565');
    beltGrad.addColorStop(1, '#3a4555');
    c.fillStyle = beltGrad;
    c.fillRect(startX, cy - beltH / 2, endX - startX, beltH);

    // Moving stripes
    c.save();
    c.beginPath();
    c.rect(startX, cy - beltH / 2, endX - startX, beltH);
    c.clip();
    const stripeW = 30;
    const offset = (time * 0.08) % stripeW;
    c.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    c.lineWidth = 2;
    for (let x = startX - stripeW + offset; x < endX; x += stripeW) {
      c.beginPath(); c.moveTo(x, cy - beltH / 2); c.lineTo(x, cy + beltH / 2); c.stroke();
    }
    // Yellow safety stripe
    c.fillStyle = 'rgba(255, 200, 0, 0.15)';
    c.fillRect(startX, cy + beltH / 2 - 3, endX - startX, 3);
    c.restore();

    // Rollers at ends
    c.fillStyle = '#556';
    c.beginPath(); c.arc(startX, cy, beltH / 2 + 2, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(endX, cy, beltH / 2 + 2, 0, Math.PI * 2); c.fill();
  }

  function drawStation(c, index) {
    const t = STATION_POSITIONS[index];
    const pos = getConveyorPath(t);
    const sx = pos.x;
    const sy = pos.y;
    const state = stationStates[index];

    // Platform
    c.fillStyle = '#1a2535';
    c.strokeStyle = state.active ? '#ff6b35' : '#334455';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(sx - 50, sy - 55, 100, 110, 6);
    c.fill(); c.stroke();

    // Station-specific visuals
    c.save();
    c.translate(sx, sy);

    if (index === 0) {
      // Intake hopper
      c.fillStyle = '#3a4555';
      c.beginPath();
      c.moveTo(-25, -50); c.lineTo(25, -50); c.lineTo(15, -70); c.lineTo(-15, -70);
      c.closePath(); c.fill();
      c.fillStyle = '#556';
      c.fillRect(-20, -70, 40, 5);
    } else if (index === 1) {
      // CNC machine
      c.fillStyle = '#2a3545';
      c.fillRect(-35, -48, 70, 30);
      c.fillStyle = state.active ? '#ff6b35' : '#00e5ff';
      c.shadowColor = c.fillStyle;
      c.shadowBlur = state.active ? 15 : 5;
      c.fillRect(-30, -45, 60, 4);
      c.shadowBlur = 0;
      // Spindle
      if (state.active) {
        c.save();
        c.translate(0, -30);
        c.rotate(time * 0.02);
        c.fillStyle = '#889';
        c.fillRect(-2, -8, 4, 16);
        c.restore();
      }
    } else if (index === 2) {
      // Paint booth
      c.strokeStyle = '#445';
      c.lineWidth = 3;
      c.strokeRect(-30, -48, 60, 50);
      if (state.active) {
        const pg = c.createRadialGradient(0, -25, 0, 0, -25, 25);
        pg.addColorStop(0, 'rgba(255, 107, 53, 0.3)');
        pg.addColorStop(1, 'transparent');
        c.fillStyle = pg;
        c.fillRect(-30, -48, 60, 50);
      }
    } else {
      // QC scanner
      c.fillStyle = '#2a3545';
      c.fillRect(-30, -50, 60, 8);
      c.fillStyle = state.active ? '#39ff14' : '#008844';
      c.shadowColor = c.fillStyle;
      c.shadowBlur = 10;
      c.fillRect(-28, -48, 56, 4);
      c.shadowBlur = 0;
      // Scan line
      if (state.active) {
        const scanY = -45 + (time * 0.05) % 40;
        c.strokeStyle = 'rgba(57, 255, 20, 0.6)';
        c.lineWidth = 1;
        c.beginPath(); c.moveTo(-25, scanY); c.lineTo(25, scanY); c.stroke();
      }
    }

    c.restore();

    // Label
    c.fillStyle = '#6b8299';
    c.font = '10px Rajdhani, sans-serif';
    c.textAlign = 'center';
    c.fillText(STATION_NAMES[index], sx, sy + 50);

    // Active indicator ring
    if (state.active) {
      c.strokeStyle = `rgba(255, 107, 53, ${0.3 + Math.sin(time * 0.008) * 0.2})`;
      c.lineWidth = 2;
      c.beginPath();
      c.arc(sx, sy, 58, 0, Math.PI * 2);
      c.stroke();
    }
  }

  function drawProduct(c, p) {
    const pos = getConveyorPath(p.progress);
    const col = p.color;
    const s = p.size;

    c.save();
    c.translate(pos.x, pos.y - s * 0.3);

    // Shadow
    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.beginPath();
    c.ellipse(0, s * 0.5, s * 0.6, s * 0.15, 0, 0, Math.PI * 2);
    c.fill();

    // Glow when processing
    if (p.processing) {
      c.shadowColor = col.glow;
      c.shadowBlur = 20;
    }

    // Body - evolves with stage
    if (p.stage === 0) {
      // Raw block
      c.fillStyle = col.fill;
      c.fillRect(-s / 2, -s / 2, s, s);
      c.strokeStyle = '#555';
      c.lineWidth = 1;
      c.strokeRect(-s / 2, -s / 2, s, s);
    } else if (p.stage === 1) {
      // Machined - rounded with details
      c.fillStyle = col.fill;
      c.beginPath();
      c.roundRect(-s / 2, -s / 2, s, s, 4);
      c.fill();
      c.strokeStyle = col.glow;
      c.lineWidth = 1.5;
      c.stroke();
      c.fillStyle = col.glow;
      c.fillRect(-s / 4, -s / 4, s / 2, s / 2);
    } else if (p.stage === 2) {
      // Painted
      const pg = c.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
      pg.addColorStop(0, '#ff8855');
      pg.addColorStop(0.5, col.fill);
      pg.addColorStop(1, '#cc3300');
      c.fillStyle = pg;
      c.beginPath();
      c.roundRect(-s / 2, -s / 2, s, s * 0.8, 3);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.3)';
      c.lineWidth = 1;
      c.stroke();
    } else {
      // Complete - assembled unit with antenna
      c.fillStyle = col.fill;
      c.beginPath();
      c.roundRect(-s / 2, -s / 3, s, s * 0.7, 3);
      c.fill();
      c.fillStyle = '#fff';
      c.fillRect(-s / 6, -s / 3 - 6, 2, 8);
      c.fillStyle = col.glow;
      c.shadowColor = col.glow;
      c.shadowBlur = 8;
      c.beginPath();
      c.arc(0, -s / 3 - 8, 3, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0;
    }

    c.shadowBlur = 0;
    c.restore();
  }

  function updateProducts(dt) {
    spawnTimer += dt;
    if (spawnTimer >= SPAWN_INTERVAL) {
      spawnTimer = 0;
      products.push(new Product());
    }

    const speed = 0.045;

    for (let i = products.length - 1; i >= 0; i--) {
      const p = products[i];

      if (!p.processing) {
        p.progress += speed * dt;

        // Check station interactions
        for (let s = 0; s < STATION_POSITIONS.length; s++) {
          const st = STATION_POSITIONS[s];
          if (p.stage === s && Math.abs(p.progress - st) < 0.008) {
            p.processing = true;
            p.processTimer = 0;
            stationStates[s].active = true;
            stationStates[s].timer = 0;

            // Trigger arm
            arms.filter(a => a.stationIndex === s).forEach(a => {
              if (a.state === 'idle') { a.state = 'reaching'; a.stateTimer = 0; }
            });

            // Effects
            const pos = getConveyorPath(st);
            if (s === 1) emitSparks(pos.x, pos.y - 20, 12);
            if (s === 2) emitSteam(pos.x, pos.y - 30, 4);
          }
        }
      } else {
        p.processTimer += dt;
        const processDuration = 1.2;
        if (p.processTimer >= processDuration * 60) {
          p.processing = false;
          p.stage++;
          stationStates[p.stage - 1].active = false;

          if (p.stage >= STAGES.length) {
            totalProduced++;
            producedThisMinute++;
            products.splice(i, 1);
            continue;
          }

          const pos = getConveyorPath(STATION_POSITIONS[p.stage - 1]);
          if (p.stage - 1 === 1) emitSparks(pos.x, pos.y - 20, 6);
        }
      }

      // Remove if off screen
      if (p.progress > 1.05) products.splice(i, 1);
    }
  }

  function updateArms(dt) {
    arms.forEach(arm => {
      const active = stationStates[arm.stationIndex].active;
      arm.update(dt / 60, active);
    });
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
  }

  function updateUI() {
    document.getElementById('throughput').textContent = totalProduced.toLocaleString();

    const now = performance.now();
    if (now - minuteStart > 60000) {
      lastMinuteCount = producedThisMinute;
      producedThisMinute = 0;
      minuteStart = now;
    }
    const rate = lastMinuteCount + (now - minuteStart) / 60000 * producedThisMinute;
    document.getElementById('rate').textContent = Math.round(rate * (60000 / (now - minuteStart + 1)));

    const activeArms = arms.filter(a => a.state !== 'idle').length;
    const efficiency = Math.min(99, 85 + Math.sin(time * 0.001) * 5 + (totalProduced > 0 ? 5 : 0));
    document.getElementById('efficiency').textContent = efficiency.toFixed(1) + '%';
    document.getElementById('arms').textContent = `${6 - Math.floor(activeArms / 2)}/6`;

    // Station dots
    const container = document.getElementById('stations');
    if (container.children.length === 0) {
      STATION_NAMES.forEach(name => {
        const dot = document.createElement('div');
        dot.className = 'station-dot';
        dot.title = name;
        container.appendChild(dot);
      });
    }
    stationStates.forEach((s, i) => {
      const dot = container.children[i];
      dot.className = 'station-dot' + (s.active ? ' processing' : (products.some(p => p.stage > i) ? ' active' : ''));
    });
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastTime) / 16.67, 3);
    lastTime = now;
    time = now;

    updateProducts(dt);
    updateArms(dt);
    updateParticles();

    ctx.clearRect(0, 0, W, H);
    drawBackground(ctx);
    drawConveyor(ctx);

    STATION_POSITIONS.forEach((_, i) => drawStation(ctx, i));
    products.forEach(p => drawProduct(ctx, p));
    arms.forEach(a => a.draw(ctx));
    particles.forEach(p => p.draw(ctx));

    updateUI();
    requestAnimationFrame(loop);
  }

  // Polyfill roundRect for older browsers
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
    };
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
