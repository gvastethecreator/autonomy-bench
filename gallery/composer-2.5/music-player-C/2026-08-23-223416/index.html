<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOCTURNE — Desktop Music Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0a0f;
    --bg-panel: rgba(18, 18, 28, 0.72);
    --bg-glass: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8e4df;
    --text-muted: rgba(232, 228, 223, 0.45);
    --accent: #e8a849;
    --accent-glow: rgba(232, 168, 73, 0.35);
    --accent-soft: rgba(232, 168, 73, 0.12);
    --rose: #c45c7a;
    --teal: #4a9e8e;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'DM Sans', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font-sans);
    background: var(--bg-deep);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient background */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .ambient__gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, var(--ambient-1, rgba(196, 92, 122, 0.18)) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 20%, var(--ambient-2, rgba(232, 168, 73, 0.14)) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(74, 158, 142, 0.06) 0%, transparent 50%),
      linear-gradient(180deg, #0d0d14 0%, #0a0a0f 40%, #080810 100%);
    transition: background 1.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .ambient__grain {
    position: absolute;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  .ambient__orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: orbFloat 12s ease-in-out infinite;
  }

  .ambient__orb--1 {
    width: 420px; height: 420px;
    top: -10%; left: -5%;
    background: var(--ambient-1, rgba(196, 92, 122, 0.3));
    animation-delay: 0s;
  }

  .ambient__orb--2 {
    width: 360px; height: 360px;
    bottom: -5%; right: -5%;
    background: var(--ambient-2, rgba(232, 168, 73, 0.25));
    animation-delay: -4s;
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 15px) scale(0.95); }
  }

  /* App shell */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 16px;
  }

  /* Title bar */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 20px;
    flex-shrink: 0;
  }

  .titlebar__brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .titlebar__logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--rose) 100%);
    display: grid;
    place-items: center;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .titlebar__logo svg { width: 16px; height: 16px; fill: var(--bg-deep); }

  .titlebar__name {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .titlebar__name em {
    font-style: italic;
    color: var(--accent);
  }

  .titlebar__controls {
    display: flex;
    gap: 8px;
  }

  .window-btn {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    cursor: default;
    opacity: 0.7;
  }
  .window-btn--close { background: #ff5f57; }
  .window-btn--min { background: #febc2e; }
  .window-btn--max { background: #28c840; }

  /* Main layout */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    min-height: 0;
  }

  /* Now playing panel */
  .now-playing {
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }

  .now-playing__visual {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 40px;
  }

  .album-frame {
    position: relative;
    width: min(320px, 70%);
    aspect-ratio: 1;
    perspective: 800px;
  }

  .album-disc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #111 0%, #111 18%, transparent 19%),
      repeating-conic-gradient(from 0deg, #1a1a1a 0deg 2deg, #222 2deg 4deg);
    box-shadow:
      0 0 0 3px rgba(255,255,255,0.06),
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 0 40px rgba(0,0,0,0.5);
    transform: translateX(28%) scale(0.92);
    opacity: 0.85;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s;
  }

  .album-disc.spinning {
    animation: spin 4s linear infinite;
  }

  @keyframes spin {
    from { transform: translateX(28%) scale(0.92) rotate(0deg); }
    to { transform: translateX(28%) scale(0.92) rotate(360deg); }
  }

  .album-cover {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 24px 64px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.08);
    transform: rotateY(-4deg);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.6s;
  }

  .album-cover:hover {
    transform: rotateY(0deg) scale(1.02);
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow);
  }

  .album-cover canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .album-cover__shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%, transparent 100%);
    pointer-events: none;
  }

  /* Visualizer overlay */
  .visualizer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    opacity: 0.7;
    mask-image: linear-gradient(to top, black 30%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%);
  }

  .visualizer canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Track info */
  .track-info {
    padding: 24px 32px 28px;
    border-top: 1px solid var(--border);
    background: linear-gradient(to top, rgba(0,0,0,0.3), transparent);
  }

  .track-info__label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .track-info__title {
    font-family: var(--font-serif);
    font-size: 2rem;
    line-height: 1.15;
    margin-bottom: 6px;
    transition: opacity 0.4s;
  }

  .track-info__artist {
    font-size: 0.95rem;
    color: var(--text-muted);
    transition: opacity 0.4s;
  }

  .track-info__meta {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .track-info__meta span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Playlist panel */
  .playlist-panel {
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .playlist-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .playlist-header__title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
  }

  .playlist-header__count {
    font-size: 0.7rem;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .playlist {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    position: relative;
    border: 1px solid transparent;
  }

  .track-item:hover {
    background: var(--bg-glass);
  }

  .track-item.active {
    background: var(--accent-soft);
    border-color: rgba(232, 168, 73, 0.2);
  }

  .track-item.active .track-item__num {
    color: var(--accent);
  }

  .track-item__num {
    width: 22px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .track-item__thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .track-item__thumb canvas { width: 100%; height: 100%; display: block; }

  .track-item__details {
    flex: 1;
    min-width: 0;
  }

  .track-item__name {
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-item__artist {
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-item__duration {
    font-size: 0.72rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .track-item__playing-indicator {
    position: absolute;
    right: 12px;
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
  }

  .track-item.active .track-item__playing-indicator { display: flex; }
  .track-item.active .track-item__duration { display: none; }

  .bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: eqBar 0.8s ease-in-out infinite alternate;
  }

  .bar:nth-child(1) { height: 6px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 12px; animation-delay: 0.2s; }
  .bar:nth-child(3) { height: 8px; animation-delay: 0.4s; }

  @keyframes eqBar {
    from { transform: scaleY(0.4); }
    to { transform: scaleY(1); }
  }

  /* Transport bar */
  .transport {
    flex-shrink: 0;
    margin-top: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow);
    padding: 16px 24px 18px;
  }

  /* Progress */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .progress-time {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    width: 38px;
    flex-shrink: 0;
  }

  .progress-time--end { text-align: right; }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: visible;
  }

  .progress-bar__fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--rose));
    border-radius: 4px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
  }

  .progress-bar__thumb {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 12px;
    height: 12px;
    background: var(--text);
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.15s;
  }

  .progress-bar:hover .progress-bar__thumb,
  .progress-bar.dragging .progress-bar__thumb {
    transform: translateY(-50%) scale(1);
  }

  /* Controls row */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .controls__left,
  .controls__right {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 180px;
  }

  .controls__right { justify-content: flex-end; }

  .controls__center {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: color 0.2s, background 0.2s, transform 0.15s;
    position: relative;
  }

  .btn:hover { color: var(--text); }
  .btn:active { transform: scale(0.92); }

  .btn--sm {
    width: 36px;
    height: 36px;
  }

  .btn--sm svg { width: 16px; height: 16px; fill: currentColor; }

  .btn--lg {
    width: 56px;
    height: 56px;
    background: var(--text);
    color: var(--bg-deep);
    box-shadow: 0 4px 20px rgba(255,255,255,0.15);
  }

  .btn--lg:hover {
    background: var(--accent);
    color: var(--bg-deep);
    box-shadow: 0 4px 24px var(--accent-glow);
  }

  .btn--lg svg { width: 22px; height: 22px; fill: currentColor; }

  .btn.active { color: var(--accent); }

  .btn__tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: rgba(0,0,0,0.85);
    color: var(--text);
    font-size: 0.65rem;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }

  .btn:hover .btn__tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Volume slider */
  .volume {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .volume__slider {
    width: 80px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  .volume__slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--text);
    border-radius: 50%;
    cursor: pointer;
  }

  .volume__slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: var(--text);
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }

  /* Fade transitions */
  .fade-out { opacity: 0 !important; }

  /* Responsive */
  @media (max-width: 800px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .playlist-panel { max-height: 220px; }
    .album-frame { width: min(240px, 60%); }
    .track-info__title { font-size: 1.5rem; }
  }

  /* Start overlay */
  .start-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.92);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity 0.6s, visibility 0.6s;
  }

  .start-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .start-overlay__icon {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--rose));
    display: grid;
    place-items: center;
    box-shadow: 0 8px 40px var(--accent-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 8px 40px var(--accent-glow); }
    50% { transform: scale(1.05); box-shadow: 0 12px 60px var(--accent-glow); }
  }

  .start-overlay__icon svg { width: 36px; height: 36px; fill: var(--bg-deep); }

  .start-overlay__title {
    font-family: var(--font-serif);
    font-size: 2.2rem;
    text-align: center;
  }

  .start-overlay__sub {
    color: var(--text-muted);
    font-size: 0.9rem;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }

  .start-btn {
    margin-top: 8px;
    padding: 14px 36px;
    background: var(--accent);
    color: var(--bg-deep);
    border: none;
    border-radius: 40px;
    font-family: var(--font-sans);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 24px var(--accent-glow);
  }

  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px var(--accent-glow);
  }
</style>
</head>
<body>

<div class="ambient">
  <div class="ambient__gradient" id="ambientGrad"></div>
  <div class="ambient__orb ambient__orb--1" id="orb1"></div>
  <div class="ambient__orb ambient__orb--2" id="orb2"></div>
  <div class="ambient__grain"></div>
</div>

<div class="start-overlay" id="startOverlay">
  <div class="start-overlay__icon">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <h1 class="start-overlay__title">Nocturne</h1>
  <p class="start-overlay__sub">A desktop music experience with procedurally generated ambient compositions. Click to begin.</p>
  <button class="start-btn" id="startBtn">Enter Studio</button>
</div>

<div class="app">
  <header class="titlebar">
    <div class="titlebar__brand">
      <div class="titlebar__logo">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <span class="titlebar__name">Nocturne<em> Studio</em></span>
    </div>
    <div class="titlebar__controls">
      <div class="window-btn window-btn--close"></div>
      <div class="window-btn window-btn--min"></div>
      <div class="window-btn window-btn--max"></div>
    </div>
  </header>

  <div class="main">
    <section class="now-playing">
      <div class="now-playing__visual">
        <div class="album-frame">
          <div class="album-disc" id="albumDisc"></div>
          <div class="album-cover" id="albumCover">
            <canvas id="coverCanvas" width="400" height="400"></canvas>
            <div class="album-cover__shine"></div>
          </div>
        </div>
        <div class="visualizer">
          <canvas id="vizCanvas"></canvas>
        </div>
      </div>
      <div class="track-info">
        <div class="track-info__label">Now Playing</div>
        <h2 class="track-info__title" id="trackTitle">—</h2>
        <p class="track-info__artist" id="trackArtist">—</p>
        <div class="track-info__meta">
          <span id="trackGenre">Ambient</span>
          <span id="trackBpm">— BPM</span>
          <span id="trackKey">—</span>
        </div>
      </div>
    </section>

    <aside class="playlist-panel">
      <div class="playlist-header">
        <span class="playlist-header__title">Queue</span>
        <span class="playlist-header__count" id="trackCount">6 tracks</span>
      </div>
      <div class="playlist" id="playlist"></div>
    </aside>
  </div>

  <footer class="transport">
    <div class="progress-wrap">
      <span class="progress-time" id="timeCurrent">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-bar__fill" id="progressFill">
          <div class="progress-bar__thumb"></div>
        </div>
      </div>
      <span class="progress-time progress-time--end" id="timeTotal">0:00</span>
    </div>
    <div class="controls">
      <div class="controls__left">
        <button class="btn btn--sm" id="shuffleBtn" aria-label="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          <span class="btn__tooltip">Shuffle</span>
        </button>
        <button class="btn btn--sm" id="repeatBtn" aria-label="Repeat">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <span class="btn__tooltip">Repeat</span>
        </button>
      </div>
      <div class="controls__center">
        <button class="btn btn--sm" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
          <span class="btn__tooltip">Previous</span>
        </button>
        <button class="btn btn--lg" id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn btn--sm" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          <span class="btn__tooltip">Next</span>
        </button>
      </div>
      <div class="controls__right">
        <div class="volume">
          <button class="btn btn--sm" id="muteBtn" aria-label="Mute">
            <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <span class="btn__tooltip">Volume</span>
          </button>
          <input type="range" class="volume__slider" id="volumeSlider" min="0" max="100" value="75">
        </div>
      </div>
    </div>
  </footer>
</div>

<script>
(function() {
  'use strict';

  const TRACKS = [
    { title: 'Midnight Reverie', artist: 'Luna Cascade', genre: 'Ambient', bpm: 72, key: 'Am', duration: 48, palette: ['#1a1035', '#c45c7a', '#e8a849'], mood: 'ethereal' },
    { title: 'Golden Hour Drift', artist: 'Solstice Fields', genre: 'Downtempo', bpm: 90, key: 'Dm', duration: 42, palette: ['#2a1810', '#e8a849', '#c45c7a'], mood: 'warm' },
    { title: 'Neon Rain', artist: 'Cipher Bloom', genre: 'Synthwave', bpm: 118, key: 'Em', duration: 55, palette: ['#0a1628', '#4a9e8e', '#c45c7a'], mood: 'cyber' },
    { title: 'Velvet Horizon', artist: 'Aurora Vale', genre: 'Chillwave', bpm: 85, key: 'Fmaj', duration: 50, palette: ['#1a0a20', '#9b6bca', '#e8a849'], mood: 'dreamy' },
    { title: 'Deep Current', artist: 'Mariana Echo', genre: 'Deep House', bpm: 122, key: 'Gm', duration: 60, palette: ['#0a1a18', '#4a9e8e', '#2a6080'], mood: 'deep' },
    { title: 'Ember & Ash', artist: 'Phoenix Noir', genre: 'Trip Hop', bpm: 95, key: 'Cm', duration: 45, palette: ['#1a0a08', '#c45c7a', '#802020'], mood: 'dark' }
  ];

  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let currentTrack = 0;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false;
  let elapsed = 0;
  let duration = 48;
  let animFrame = null;
  let oscillators = [];
  let noiseNode = null;
  let filterNode = null;
  let lfoNode = null;
  let progressInterval = null;
  let shuffledOrder = [];

  const $ = id => document.getElementById(id);

  const els = {
    startOverlay: $('startOverlay'),
    startBtn: $('startBtn'),
    playlist: $('playlist'),
    trackTitle: $('trackTitle'),
    trackArtist: $('trackArtist'),
    trackGenre: $('trackGenre'),
    trackBpm: $('trackBpm'),
    trackKey: $('trackKey'),
    trackCount: $('trackCount'),
    playBtn: $('playBtn'),
    playIcon: $('playIcon'),
    pauseIcon: $('pauseIcon'),
    prevBtn: $('prevBtn'),
    nextBtn: $('nextBtn'),
    shuffleBtn: $('shuffleBtn'),
    repeatBtn: $('repeatBtn'),
    muteBtn: $('muteBtn'),
    volumeSlider: $('volumeSlider'),
    progressBar: $('progressBar'),
    progressFill: $('progressFill'),
    timeCurrent: $('timeCurrent'),
    timeTotal: $('timeTotal'),
    albumDisc: $('albumDisc'),
    coverCanvas: $('coverCanvas'),
    vizCanvas: $('vizCanvas'),
    ambientGrad: $('ambientGrad'),
    orb1: $('orb1'),
    orb2: $('orb2')
  };

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function hashSeed(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function seededRandom(seed) {
    return function() {
      seed = (seed * 16807 + 0) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  function drawCover(canvas, track, size) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = size || 400;
    const h = canvas.height = size || 400;
    const rng = seededRandom(hashSeed(track.title + track.artist));
    const [c1, c2, c3] = track.palette;

    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, c1);
    grad.addColorStop(0.5, c2);
    grad.addColorStop(1, c3);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'overlay';
    for (let i = 0; i < 8; i++) {
      const x = rng() * w;
      const y = rng() * h;
      const r = rng() * w * 0.4 + 20;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,255,255,${rng() * 0.15})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    const cx = w / 2, cy = h / 2;
    const mood = track.mood;

    if (mood === 'ethereal' || mood === 'dreamy') {
      for (let i = 0; i < 60; i++) {
        const angle = rng() * Math.PI * 2;
        const dist = rng() * w * 0.35;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, rng() * 3 + 1, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${rng() * 0.6})`;
        ctx.fill();
      }
    } else if (mood === 'cyber') {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const y = (h / 12) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.fillStyle = c3;
      ctx.fillRect(w * 0.3, h * 0.4, w * 0.4, 4);
    } else if (mood === 'warm') {
      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.25, 0, Math.PI * 2);
      const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.25);
      sg.addColorStop(0, 'rgba(255,220,150,0.8)');
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.fill();
    } else if (mood === 'deep') {
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.ellipse(cx, cy + i * 15, w * (0.3 - i * 0.04), 8, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${0.1 - i * 0.015})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(cx, h * 0.2);
      ctx.lineTo(cx + w * 0.2, h * 0.8);
      ctx.lineTo(cx - w * 0.2, h * 0.8);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = `italic ${w * 0.07}px Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.fillText(track.title.split(' ')[0], cx, h * 0.88);
  }

  function setAmbient(track) {
    const [c1, , c2] = track.palette;
    document.documentElement.style.setProperty('--ambient-1', c1 + '55');
    document.documentElement.style.setProperty('--ambient-2', c2 + '44');
    els.orb1.style.background = c1 + '66';
    els.orb2.style.background = c2 + '55';
  }

  function buildPlaylist() {
    els.playlist.innerHTML = '';
    TRACKS.forEach((track, i) => {
      const item = document.createElement('div');
      item.className = 'track-item' + (i === currentTrack ? ' active' : '');
      item.dataset.index = i;

      const thumbCanvas = document.createElement('canvas');
      thumbCanvas.width = 80;
      thumbCanvas.height = 80;
      drawCover(thumbCanvas, track, 80);

      item.innerHTML = `
        <span class="track-item__num">${i + 1}</span>
        <div class="track-item__thumb"></div>
        <div class="track-item__details">
          <div class="track-item__name">${track.title}</div>
          <div class="track-item__artist">${track.artist}</div>
        </div>
        <span class="track-item__duration">${formatTime(track.duration)}</span>
        <div class="track-item__playing-indicator">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      `;
      item.querySelector('.track-item__thumb').appendChild(thumbCanvas);
      item.addEventListener('click', () => selectTrack(i, true));
      els.playlist.appendChild(item);
    });
    els.trackCount.textContent = TRACKS.length + ' tracks';
  }

  function updateTrackUI(track) {
    els.trackTitle.classList.add('fade-out');
    els.trackArtist.classList.add('fade-out');
    setTimeout(() => {
      els.trackTitle.textContent = track.title;
      els.trackArtist.textContent = track.artist;
      els.trackGenre.textContent = track.genre;
      els.trackBpm.textContent = track.bpm + ' BPM';
      els.trackKey.textContent = track.key;
      els.timeTotal.textContent = formatTime(track.duration);
      drawCover(els.coverCanvas, track);
      setAmbient(track);
      els.trackTitle.classList.remove('fade-out');
      els.trackArtist.classList.remove('fade-out');
    }, 200);

    document.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentTrack);
    });
  }

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
    masterGain.gain.value = els.volumeSlider.value / 100;
  }

  function stopSynth() {
    oscillators.forEach(o => { try { o.stop(); o.disconnect(); } catch(e) {} });
    oscillators = [];
    if (noiseNode) { try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {} noiseNode = null; }
    if (filterNode) { filterNode.disconnect(); filterNode = null; }
    if (lfoNode) { try { lfoNode.stop(); lfoNode.disconnect(); } catch(e) {} lfoNode = null; }
  }

  const KEY_FREQS = {
    'Am': [220, 261.63, 329.63, 392, 440],
    'Dm': [293.66, 349.23, 440, 523.25, 587.33],
    'Em': [164.81, 196, 246.94, 329.63, 392],
    'Fmaj': [174.61, 220, 261.63, 349.23, 392],
    'Gm': [196, 233.08, 293.66, 349.23, 392],
    'Cm': [130.81, 155.56, 196, 233.08, 261.63]
  };

  function startSynth(track) {
    stopSynth();
    const freqs = KEY_FREQS[track.key] || KEY_FREQS['Am'];
    const now = audioCtx.currentTime;

    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.value = track.mood === 'cyber' ? 2000 : 800;
    filterNode.Q.value = 1.2;
    filterNode.connect(masterGain);

    lfoNode = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfoNode.frequency.value = 0.08;
    lfoGain.gain.value = track.mood === 'cyber' ? 600 : 200;
    lfoNode.connect(lfoGain);
    lfoGain.connect(filterNode.frequency);
    lfoNode.start(now);

    if (track.mood === 'cyber' || track.mood === 'deep') {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = buffer;
      noiseNode.loop = true;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.value = 0.04;
      noiseNode.connect(noiseGain);
      noiseGain.connect(filterNode);
      noiseNode.start(now);
    }

    const waveforms = track.mood === 'cyber' ? ['sawtooth', 'square'] : ['sine', 'triangle'];
    freqs.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = waveforms[i % waveforms.length];
      osc.frequency.value = freq;
      gain.gain.value = 0.06 / (i + 1);
      osc.connect(gain);
      gain.connect(filterNode);
      osc.start(now);
      oscillators.push(osc);

      if (track.bpm > 100) {
        const arp = audioCtx.createOscillator();
        const arpGain = audioCtx.createGain();
        arp.type = 'sine';
        arp.frequency.value = freqs[(i + 2) % freqs.length] * 2;
        arpGain.gain.value = 0;
        arp.connect(arpGain);
        arpGain.connect(filterNode);
        arp.start(now);
        oscillators.push(arp);

        const beat = 60 / track.bpm;
        let step = 0;
        const arpInterval = setInterval(() => {
          if (!isPlaying) { clearInterval(arpInterval); return; }
          arp.frequency.setTargetAtTime(freqs[step % freqs.length] * (step % 2 ? 2 : 1), audioCtx.currentTime, 0.05);
          arpGain.gain.setTargetAtTime(0.03, audioCtx.currentTime, 0.02);
          setTimeout(() => arpGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05), beat * 400);
          step++;
        }, beat * 500);
      }
    });

    if (track.mood === 'warm' || track.mood === 'ethereal') {
      const pad = audioCtx.createOscillator();
      const padGain = audioCtx.createGain();
      pad.type = 'sine';
      pad.frequency.value = freqs[0] / 2;
      padGain.gain.value = 0.08;
      pad.connect(padGain);
      padGain.connect(filterNode);
      pad.start(now);
      oscillators.push(pad);
    }
  }

  function selectTrack(index, autoPlay) {
    currentTrack = index;
    const track = TRACKS[index];
    duration = track.duration;
    elapsed = 0;
    updateTrackUI(track);
    updateProgress();
    stopSynth();
    if (autoPlay && isPlaying) {
      startSynth(track);
      startProgress();
    }
  }

  function togglePlay() {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isPlaying = !isPlaying;
    els.playIcon.style.display = isPlaying ? 'none' : 'block';
    els.pauseIcon.style.display = isPlaying ? 'block' : 'none';
    els.albumDisc.classList.toggle('spinning', isPlaying);

    if (isPlaying) {
      startSynth(TRACKS[currentTrack]);
      startProgress();
      startVisualizer();
    } else {
      stopSynth();
      stopProgress();
    }
  }

  function startProgress() {
    stopProgress();
    progressInterval = setInterval(() => {
      elapsed += 0.25;
      if (elapsed >= duration) {
        if (repeat) {
          elapsed = 0;
          stopSynth();
          startSynth(TRACKS[currentTrack]);
        } else {
          nextTrack();
        }
      }
      updateProgress();
    }, 250);
  }

  function stopProgress() {
    if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
  }

  function updateProgress() {
    const pct = Math.min(elapsed / duration * 100, 100);
    els.progressFill.style.width = pct + '%';
    els.timeCurrent.textContent = formatTime(elapsed);
  }

  function nextTrack() {
    if (shuffle) {
      if (shuffledOrder.length === 0) {
        shuffledOrder = TRACKS.map((_, i) => i).filter(i => i !== currentTrack);
        for (let i = shuffledOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
        }
      }
      const next = shuffledOrder.shift();
      selectTrack(next, isPlaying);
    } else {
      selectTrack((currentTrack + 1) % TRACKS.length, isPlaying);
    }
  }

  function prevTrack() {
    if (elapsed > 3) {
      elapsed = 0;
      updateProgress();
      return;
    }
    selectTrack((currentTrack - 1 + TRACKS.length) % TRACKS.length, isPlaying);
  }

  function seek(e) {
    const rect = els.progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    elapsed = pct * duration;
    updateProgress();
  }

  function startVisualizer() {
    const canvas = els.vizCanvas;
    const ctx = canvas.getContext('2d');
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function resize() {
      canvas.width = canvas.offsetWidth * devicePixelRatio;
      canvas.height = canvas.offsetHeight * devicePixelRatio;
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      if (!isPlaying) return;
      animFrame = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const barCount = 64;
      const barW = w / barCount;
      const track = TRACKS[currentTrack];

      for (let i = 0; i < barCount; i++) {
        const idx = Math.floor(i * bufferLength / barCount);
        const v = dataArray[idx] / 255;
        const barH = v * h * 0.85;
        const x = i * barW;

        const grad = ctx.createLinearGradient(0, h, 0, h - barH);
        grad.addColorStop(0, track.palette[2] + 'cc');
        grad.addColorStop(0.5, track.palette[1] + '88');
        grad.addColorStop(1, track.palette[0] + '22');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x + 1, h - barH, barW - 2, barH, [2, 2, 0, 0]);
        ctx.fill();
      }
    }
    draw();
  }

  function stopVisualizer() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  }

  els.startBtn.addEventListener('click', () => {
    els.startOverlay.classList.add('hidden');
    initAudio();
    buildPlaylist();
    selectTrack(0, false);
    togglePlay();
  });

  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', nextTrack);
  els.prevBtn.addEventListener('click', prevTrack);

  els.shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    els.shuffleBtn.classList.toggle('active', shuffle);
    shuffledOrder = [];
  });

  els.repeatBtn.addEventListener('click', () => {
    repeat = !repeat;
    els.repeatBtn.classList.toggle('active', repeat);
  });

  els.volumeSlider.addEventListener('input', () => {
    if (masterGain) masterGain.gain.value = els.volumeSlider.value / 100;
  });

  els.muteBtn.addEventListener('click', () => {
    if (masterGain) {
      const muted = masterGain.gain.value === 0;
      masterGain.gain.value = muted ? els.volumeSlider.value / 100 : 0;
    }
  });

  els.progressBar.addEventListener('click', seek);
  els.progressBar.addEventListener('mousedown', () => els.progressBar.classList.add('dragging'));
  document.addEventListener('mouseup', () => els.progressBar.classList.remove('dragging'));

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
    if (e.code === 'ArrowUp') { els.volumeSlider.value = Math.min(100, +els.volumeSlider.value + 5); els.volumeSlider.dispatchEvent(new Event('input')); }
    if (e.code === 'ArrowDown') { els.volumeSlider.value = Math.max(0, +els.volumeSlider.value - 5); els.volumeSlider.dispatchEvent(new Event('input')); }
  });

  buildPlaylist();
  selectTrack(0, false);
})();
</script>
</body>
</html>
