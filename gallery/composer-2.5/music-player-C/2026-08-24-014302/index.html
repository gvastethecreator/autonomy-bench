<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon City — Music Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0612;
    --bg-mid: #120a1f;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-hover: rgba(255, 255, 255, 0.1);
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2d95;
    --neon-purple: #a855f7;
    --neon-amber: #ffb347;
    --text-primary: #f0eef5;
    --text-secondary: rgba(240, 238, 245, 0.55);
    --text-muted: rgba(240, 238, 245, 0.3);
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-glow-cyan: 0 0 40px rgba(0, 240, 255, 0.15);
    --shadow-glow-pink: 0 0 40px rgba(255, 45, 149, 0.15);
    --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    --titlebar-h: 38px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    user-select: none;
  }

  /* ── App Shell ── */
  .app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ── Animated Sky ── */
  .sky {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(255, 45, 149, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse 50% 35% at 80% 70%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
      linear-gradient(180deg, #0d0820 0%, #1a0a2e 40%, #0f0618 100%);
    z-index: 0;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 10%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 8%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 5%, rgba(255,255,255,0.6) 0%, transparent 100%);
    animation: twinkle 6s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* ── City Skyline ── */
  .cityscape {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45%;
    z-index: 1;
    pointer-events: none;
  }

  .cityscape svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .window-light {
    animation: windowFlicker var(--flicker-dur, 4s) ease-in-out infinite;
    animation-delay: var(--flicker-delay, 0s);
  }

  @keyframes windowFlicker {
    0%, 100% { opacity: var(--flicker-min, 0.3); }
    50% { opacity: var(--flicker-max, 1); }
  }

  .neon-sign {
    animation: neonPulse 3s ease-in-out infinite;
  }

  @keyframes neonPulse {
    0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px currentColor); }
    50% { opacity: 1; filter: drop-shadow(0 0 12px currentColor); }
  }

  /* ── Title Bar ── */
  .titlebar {
    position: relative;
    z-index: 100;
    height: var(--titlebar-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(10, 6, 18, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    -webkit-app-region: drag;
  }

  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-icon {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
  }

  .app-title {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
  }

  .window-controls {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  .win-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
  }

  .win-btn:hover { transform: scale(1.15); filter: brightness(1.2); }
  .win-btn.close { background: #ff5f57; }
  .win-btn.minimize { background: #febc2e; }
  .win-btn.maximize { background: #28c840; }

  /* ── Main Layout ── */
  .main {
    position: relative;
    z-index: 10;
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 0;
    overflow: hidden;
    padding: 0 24px 24px;
  }

  /* ── Sidebar / Playlist ── */
  .sidebar {
    display: flex;
    flex-direction: column;
    padding-top: 20px;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 0 8px 16px;
  }

  .sidebar-header h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .search-box {
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .search-box input:focus {
    border-color: rgba(0, 240, 255, 0.4);
    box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.08);
  }

  .search-box input::placeholder { color: var(--text-muted); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    opacity: 0.4;
  }

  .playlist {
    flex: 1;
    overflow-y: auto;
    padding: 8px 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--transition), transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .track-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: linear-gradient(180deg, var(--neon-cyan), var(--neon-pink));
    border-radius: 2px;
    transition: height var(--transition);
  }

  .track-item:hover { background: var(--glass-hover); }
  .track-item.active {
    background: rgba(0, 240, 255, 0.08);
  }
  .track-item.active::before { height: 60%; }

  .track-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .track-item.active .track-num { color: var(--neon-cyan); }

  .track-thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .track-duration {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .playing-indicator {
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
    flex-shrink: 0;
  }

  .track-item.active .playing-indicator { display: flex; }
  .track-item.active .track-duration { display: none; }

  .playing-indicator span {
    width: 2px;
    background: var(--neon-cyan);
    border-radius: 1px;
    animation: eqBar 0.8s ease-in-out infinite;
  }

  .playing-indicator span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .playing-indicator span:nth-child(2) { height: 70%; animation-delay: 0.15s; }
  .playing-indicator span:nth-child(3) { height: 50%; animation-delay: 0.3s; }
  .playing-indicator span:nth-child(4) { height: 90%; animation-delay: 0.1s; }

  @keyframes eqBar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .drop-zone {
    margin-top: 12px;
    padding: 16px;
    border: 1.5px dashed rgba(255,255,255,0.12);
    border-radius: var(--radius-md);
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    transition: border-color var(--transition), background var(--transition);
    cursor: pointer;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: rgba(0, 240, 255, 0.35);
    background: rgba(0, 240, 255, 0.04);
    color: var(--text-secondary);
  }

  .drop-zone svg {
    width: 24px;
    height: 24px;
    margin-bottom: 6px;
    opacity: 0.4;
  }

  /* ── Player Panel ── */
  .player-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 40px;
    position: relative;
  }

  .player-glass {
    width: 100%;
    max-width: 520px;
    background: var(--glass);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 36px 40px 32px;
    box-shadow:
      var(--shadow-glow-cyan),
      var(--shadow-glow-pink),
      0 24px 80px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .player-glass::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 180deg at 50% 50%,
      transparent 0deg,
      rgba(0, 240, 255, 0.03) 60deg,
      transparent 120deg,
      rgba(255, 45, 149, 0.03) 180deg,
      transparent 240deg,
      rgba(168, 85, 247, 0.03) 300deg,
      transparent 360deg);
    animation: shimmer 12s linear infinite;
    pointer-events: none;
  }

  @keyframes shimmer {
    to { transform: rotate(360deg); }
  }

  .player-glass > * { position: relative; z-index: 1; }

  /* ── Album Art ── */
  .art-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 28px;
  }

  .vinyl-ring {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.06);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }

  .vinyl-ring.playing { animation-play-state: running; }

  .vinyl-ring::after {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.04);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .art-glow {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(0, 240, 255, 0.2) 0%,
      rgba(255, 45, 149, 0.1) 40%,
      transparent 70%);
    filter: blur(20px);
    opacity: 0;
    transition: opacity 0.6s;
  }

  .art-glow.active { opacity: 1; }

  .album-art {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.5),
      inset 0 0 0 3px rgba(255, 255, 255, 0.08);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .album-art.playing {
    animation: artPulse 2s ease-in-out infinite;
  }

  @keyframes artPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  .art-center-hole {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--bg-deep);
    border: 3px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    z-index: 2;
  }

  /* ── Visualizer ── */
  .visualizer {
    width: 100%;
    height: 48px;
    margin-bottom: 20px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    opacity: 0.7;
    transition: opacity var(--transition);
  }

  .visualizer.active { opacity: 1; }

  .visualizer canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Track Meta ── */
  .now-playing {
    text-align: center;
    margin-bottom: 24px;
  }

  .now-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    transition: opacity 0.3s;
  }

  .now-artist {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .now-album {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── Progress ── */
  .progress-wrap {
    margin-bottom: 20px;
  }

  .progress-bar {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    cursor: pointer;
    overflow: visible;
  }

  .progress-bar:hover { height: 6px; }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    border-radius: 2px;
    position: relative;
    transition: width 0.1s linear;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    transition: transform 0.2s;
  }

  .progress-bar:hover .progress-fill::after {
    transform: translateY(-50%) scale(1);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: color var(--transition), background var(--transition), transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ctrl-btn:hover {
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
  }

  .ctrl-btn:active { transform: scale(0.92); }

  .ctrl-btn.active { color: var(--neon-cyan); }

  .ctrl-btn svg { width: 20px; height: 20px; }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 4px 24px rgba(0, 240, 255, 0.3),
      0 0 0 0 rgba(0, 240, 255, 0.4);
    transition: transform 0.2s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }

  .play-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .play-btn:hover {
    transform: scale(1.06);
    box-shadow:
      0 6px 32px rgba(0, 240, 255, 0.4),
      0 0 0 8px rgba(0, 240, 255, 0.08);
  }

  .play-btn:hover::before { opacity: 1; }
  .play-btn:active { transform: scale(0.96); }

  .play-btn svg {
    width: 24px;
    height: 24px;
    fill: white;
    position: relative;
    z-index: 1;
    margin-left: 2px;
  }

  .play-btn .icon-pause { margin-left: 0; }

  /* ── Volume & Extras ── */
  .extras {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
  }

  .volume-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 160px;
  }

  .volume-group svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
    cursor: pointer;
  }

  .shuffle-repeat {
    display: flex;
    gap: 4px;
  }

  .shuffle-repeat .ctrl-btn svg { width: 16px; height: 16px; }

  /* ── Keyboard Hints ── */
  .hints {
    position: absolute;
    bottom: 8px;
    right: 32px;
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 20;
  }

  .hints.visible { opacity: 0.5; }

  .hints kbd {
    display: inline-block;
    padding: 1px 5px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.08);
    margin: 0 2px;
  }

  /* ── Transitions ── */
  .fade-enter {
    animation: fadeSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 800px) {
    .main {
      grid-template-columns: 1fr;
      padding: 0 16px 16px;
    }
    .sidebar { display: none; }
    .player-glass { padding: 28px 24px 24px; }
    .art-container { width: 220px; height: 220px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sky"><div class="stars"></div></div>

  <!-- City Skyline SVG -->
  <div class="cityscape">
    <svg viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a0a2e"/>
          <stop offset="100%" stop-color="#0a0612"/>
        </linearGradient>
        <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00f0ff"/>
          <stop offset="100%" stop-color="#ff2d95"/>
        </linearGradient>
      </defs>
      <!-- Buildings -->
      <rect x="0" y="180" width="80" height="220" fill="url(#buildingGrad)"/>
      <rect x="70" y="120" width="60" height="280" fill="url(#buildingGrad)"/>
      <rect x="120" y="200" width="90" height="200" fill="url(#buildingGrad)"/>
      <rect x="200" y="80" width="70" height="320" fill="url(#buildingGrad)"/>
      <rect x="260" y="150" width="55" height="250" fill="url(#buildingGrad)"/>
      <rect x="305" y="100" width="85" height="300" fill="url(#buildingGrad)"/>
      <rect x="380" y="170" width="65" height="230" fill="url(#buildingGrad)"/>
      <rect x="435" y="60" width="100" height="340" fill="url(#buildingGrad)"/>
      <rect x="525" y="140" width="75" height="260" fill="url(#buildingGrad)"/>
      <rect x="590" y="90" width="60" height="310" fill="url(#buildingGrad)"/>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
(function() {
  'use strict';

  const GRADIENTS = [
    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
    'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)',
    'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
  ];

  const DEFAULT_TRACKS = [
    { title: 'Midnight Drive', artist: 'Neon Pulse', album: 'City Lights', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', color: 0 },
    { title: 'Electric Dreams', artist: 'Synthwave Collective', album: 'Retro Future', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', color: 1 },
    { title: 'Rain on Glass', artist: 'Lo-Fi District', album: 'Urban Echoes', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', color: 2 },
    { title: 'Neon Boulevard', artist: 'City Nights', album: 'Downtown', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', color: 3 },
    { title: 'Starlight Serenade', artist: 'Aurora Beats', album: 'Cosmic Jazz', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', color: 4 },
    { title: 'Velvet Underground', artist: 'Deep House NYC', album: 'Subway Sessions', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3', color: 5 },
    { title: 'Chromatic', artist: 'Pixel Drift', album: 'Digital Sunset', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3', color: 6 },
    { title: 'Last Train Home', artist: 'Metro Soul', album: 'Night Shift', duration: 0, src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3', color: 7 },
  ];

  let tracks = [...DEFAULT_TRACKS];
  let currentIndex = 0;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false;
  let shuffledOrder = [];

  const audio = document.getElementById('audio');
  const playlist = document.getElementById('playlist');
  const albumArt = document.getElementById('albumArt');
  const artGlow = document.getElementById('artGlow');
  const vinylRing = document.getElementById('vinylRing');
  const nowTitle = document.getElementById('nowTitle');
  const nowArtist = document.getElementById('nowArtist');
  const nowAlbum = document.getElementById('nowAlbum');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeTotal = document.getElementById('timeTotal');
  const btnPlay = document.getElementById('btnPlay');
  const iconPlay = btnPlay.querySelector('.icon-play');
  const iconPause = btnPlay.querySelector('.icon-pause');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnShuffle = document.getElementById('btnShuffle');
  const btnRepeat = document.getElementById('btnRepeat');
  const volumeSlider = document.getElementById('volumeSlider');
  const searchInput = document.getElementById('searchInput');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const visualizerWrap = document.getElementById('visualizerWrap');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const hints = document.getElementById('hints');

  /* ── Audio Context & Visualizer ── */
  let audioCtx, analyser, sourceNode, animFrame;
  let visualizerInitialized = false;

  function initVisualizer() {
    if (visualizerInitialized) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      visualizerInitialized = true;
    } catch (e) {
      console.warn('Visualizer unavailable:', e);
    }
  }

  function drawVisualizer() {
    if (!analyser || !isPlaying) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const barCount = 64;
    const barWidth = canvas.width / barCount;
    const gap = 2;

    for (let i = 0; i < barCount; i++) {
      const idx = Math.floor(i * bufferLength / barCount);
      const value = dataArray[idx];
      const barHeight = (value / 255) * canvas.height * 0.9;
      const x = i * barWidth;
      const y = canvas.height - barHeight;

      const hue = 180 + (i / barCount) * 80;
      const gradient = ctx.createLinearGradient(x, y, x, canvas.height);
      gradient.addColorStop(0, `hsla(${hue}, 100%, 65%, 0.9)`);
      gradient.addColorStop(1, `hsla(${hue + 40}, 100%, 50%, 0.3)`);
      ctx.fillStyle = gradient;

      const w = barWidth - gap;
      ctx.beginPath();
      ctx.roundRect(x + gap / 2, y, w, barHeight, [2, 2, 0, 0]);
      ctx.fill();
    }

    animFrame = requestAnimationFrame(drawVisualizer);
  }

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
  }

  /* ── Art Generation ── */
  function generateArt(title, colorIdx) {
    const c = document.createElement('canvas');
    c.width = 400; c.height = 400;
    const cx = c.getContext('2d');
    const idx = colorIdx % GRADIENTS.length;

    const colors = [
      ['#667eea', '#764ba2'],
      ['#f093fb', '#f5576c'],
      ['#4facfe', '#00f2fe'],
      ['#43e97b', '#38f9d7'],
      ['#fa709a', '#fee140'],
      ['#a18cd1', '#fbc2eb'],
      ['#ff9a9e', '#fecfef'],
      ['#667eea', '#764ba2'],
    ][idx];

    const grad = cx.createLinearGradient(0, 0, 400, 400);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    cx.fillStyle = grad;
    cx.fillRect(0, 0, 400, 400);

    cx.globalAlpha = 0.15;
    for (let i = 0; i < 8; i++) {
      cx.beginPath();
      cx.arc(200 + Math.sin(i * 1.5) * 80, 200 + Math.cos(i * 1.5) * 80, 60 + i * 15, 0, Math.PI * 2);
      cx.fillStyle = '#fff';
      cx.fill();
    }

    cx.globalAlpha = 0.9;
    cx.fillStyle = '#fff';
    cx.font = 'bold 28px Outfit, sans-serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    const words = title.split(' ');
    if (words.length > 1) {
      cx.fillText(words[0], 200, 185);
      cx.font = '500 22px Outfit, sans-serif';
      cx.globalAlpha = 0.7;
      cx.fillText(words.slice(1).join(' '), 200, 220);
    } else {
      cx.fillText(title, 200, 200);
    }

    return c.toDataURL();
  }

  /* ── Utilities ── */
  function formatTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + sec.toString().padStart(2, '0');
  }

  function getNextIndex() {
    if (shuffle) {
      if (shuffledOrder.length === 0) {
        shuffledOrder = tracks.map((_, i) => i).filter(i => i !== currentIndex);
        for (let i = shuffledOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
        }
      }
      return shuffledOrder.shift();
    }
    return (currentIndex + 1) % tracks.length;
  }

  function getPrevIndex() {
    return currentIndex === 0 ? tracks.length - 1 : currentIndex - 1;
  }

  /* ── Playlist Render ── */
  function renderPlaylist(filter = '') {
    const q = filter.toLowerCase();
    playlist.innerHTML = '';
    tracks.forEach((track, i) => {
      if (q && !track.title.toLowerCase().includes(q) && !track.artist.toLowerCase().includes(q)) return;

      const art = track.art || generateArt(track.title, track.color ?? i);
      if (!track.art) track.art = art;

      const el = document.createElement('div');
      el.className = 'track-item' + (i === currentIndex ? ' active' : '');
      el.innerHTML = `
        <span class="track-num">${i + 1}</span>
        <img class="track-thumb" src="${art}" alt="">
        <div class="track-info">
          <div class="track-title">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
        </div>
        <span class="track-duration">${track.duration ? formatTime(track.duration) : '—:——'}</span>
        <div class="playing-indicator"><span></span><span></span><span></span><span></span></div>
      `;
      el.addEventListener('click', () => loadTrack(i, true));
      playlist.appendChild(el);
    });
  }

  /* ── Load & Play ── */
  function loadTrack(index, autoplay = false) {
    if (index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const track = tracks[index];

    nowTitle.style.opacity = '0';
    setTimeout(() => {
      nowTitle.textContent = track.title;
      nowArtist.textContent = track.artist;
      nowAlbum.textContent = track.album || '';
      nowTitle.style.opacity = '1';
    }, 150);

    const art = track.art || generateArt(track.title, track.color ?? index);
    albumArt.src = art;
    albumArt.style.background = GRADIENTS[(track.color ?? index) % GRADIENTS.length];

    audio.src = track.src;
    audio.load();

    renderPlaylist(searchInput.value);

    if (autoplay) play();
    else updatePlayState(false);
  }

  function play() {
    initVisualizer();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    audio.play().then(() => {
      isPlaying = true;
      updatePlayState(true);
      cancelAnimationFrame(animFrame);
      drawVisualizer();
    }).catch(() => {
      isPlaying = false;
      updatePlayState(false);
    });
  }

  function pause() {
    audio.pause();
    isPlaying = false;
    updatePlayState(false);
    cancelAnimationFrame(animFrame);
  }

  function togglePlay() {
    if (isPlaying) pause();
    else play();
  }

  function updatePlayState(playing) {
    iconPlay.style.display = playing ? 'none' : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
    albumArt.classList.toggle('playing', playing);
    vinylRing.classList.toggle('playing', playing);
    artGlow.classList.toggle('active', playing);
    visualizerWrap.classList.toggle('active', playing);
    renderPlaylist(searchInput.value);
  }

  /* ── Event Listeners ── */
  audio.addEventListener('loadedmetadata', () => {
    tracks[currentIndex].duration = audio.duration;
    timeTotal.textContent = formatTime(audio.duration);
    renderPlaylist(searchInput.value);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = (audio.currentTime / audio.duration) * 100 || 0;
    progressFill.style.width = pct + '%';
    timeCurrent.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    if (repeat) {
      audio.currentTime = 0;
      play();
    } else {
      const next = getNextIndex();
      if (next !== undefined) loadTrack(next, true);
      else pause();
    }
  });

  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
  });

  btnPlay.addEventListener('click', togglePlay);
  btnPrev.addEventListener('click', () => loadTrack(getPrevIndex(), isPlaying));
  btnNext.addEventListener('click', () => { shuffledOrder = []; loadTrack(getNextIndex(), isPlaying); });

  btnShuffle.addEventListener('click', () => {
    shuffle = !shuffle;
    btnShuffle.classList.toggle('active', shuffle);
    shuffledOrder = [];
  });

  btnRepeat.addEventListener('click', () => {
    repeat = !repeat;
    btnRepeat.classList.toggle('active', repeat);
  });

  volumeSlider.addEventListener('input', () => {
    audio.volume = volumeSlider.value / 100;
  });

  searchInput.addEventListener('input', () => renderPlaylist(searchInput.value));

  /* ── Drag & Drop ── */
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  function handleFiles(files) {
    Array.from(files).forEach((file, i) => {
      if (!file.type.startsWith('audio/')) return;
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^.]+$/, '');
      tracks.push({
        title: name,
        artist: 'Local File',
        album: 'Imported',
        duration: 0,
        src: url,
        color: (tracks.length + i) % GRADIENTS.length,
        local: true
      });
    });
    renderPlaylist(searchInput.value);
    if (tracks.length > DEFAULT_TRACKS.length && !isPlaying) {
      loadTrack(tracks.length - Array.from(files).filter(f => f.type.startsWith('audio/')).length, false);
    }
  }

  /* ── Keyboard ── */
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowRight':
        if (audio.duration) audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
        break;
      case 'ArrowLeft':
        audio.currentTime = Math.max(audio.currentTime - 5, 0);
        break;
      case 'ArrowUp':
        volumeSlider.value = Math.min(+volumeSlider.value + 5, 100);
        audio.volume = volumeSlider.value / 100;
        break;
      case 'ArrowDown':
        volumeSlider.value = Math.max(+volumeSlider.value - 5, 0);
        audio.volume = volumeSlider.value / 100;
        break;
    }
  });

  /* ── Hints fade in ── */
  setTimeout(() => hints.classList.add('visible'), 2000);
  setTimeout(() => hints.classList.remove('visible'), 8000);

  /* ── Init ── */
  audio.volume = 0.8;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  renderPlaylist();
  loadTrack(0, false);

  /* Pre-generate art for default tracks */
  tracks.forEach((t, i) => { t.art = generateArt(t.title, t.color ?? i); });
  renderPlaylist();
})();
</script>
</body>
</html>
