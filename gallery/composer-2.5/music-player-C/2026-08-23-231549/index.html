<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon City — Music Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0b14;
    --bg-panel: rgba(14, 16, 28, 0.72);
    --glass: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --neon-pink: #ff2d78;
    --neon-cyan: #00e5ff;
    --neon-purple: #a855f7;
    --neon-amber: #ffb347;
    --text-primary: #f0f2ff;
    --text-muted: rgba(240, 242, 255, 0.45);
    --accent-glow: 0 0 40px rgba(255, 45, 120, 0.35);
    --radius-lg: 20px;
    --radius-md: 12px;
    --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Skyline backdrop ── */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .sky-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(255, 45, 120, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse 50% 35% at 80% 75%, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
      linear-gradient(180deg, #06070f 0%, #0d0f1e 40%, #12152a 70%, #1a1030 100%);
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 5%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 12%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 18%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 7%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 28%, rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 35%, rgba(255,255,255,0.25) 0%, transparent 100%);
    animation: twinkle 8s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  .cityscape {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45%;
    pointer-events: none;
  }

  .cityscape svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .window-light {
    animation: windowFlicker var(--dur, 4s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }

  @keyframes windowFlicker {
    0%, 100% { opacity: var(--base, 0.6); }
    50% { opacity: calc(var(--base, 0.6) * 0.4); }
  }

  .fog {
    position: absolute;
    bottom: 0;
    left: -10%;
    right: -10%;
    height: 30%;
    background: linear-gradient(0deg, rgba(10, 11, 20, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }

  .reflection {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8%;
    background: linear-gradient(0deg,
      rgba(255, 45, 120, 0.06) 0%,
      rgba(0, 229, 255, 0.04) 50%,
      transparent 100%);
    filter: blur(8px);
  }

  /* ── App shell ── */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 24px;
  }

  .player-window {
    display: grid;
    grid-template-columns: 1fr 320px;
    width: min(960px, 100%);
    height: min(620px, calc(100vh - 48px));
    background: var(--bg-panel);
    backdrop-filter: blur(40px) saturate(1.4);
    -webkit-backdrop-filter: blur(40px) saturate(1.4);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 32px 80px rgba(0, 0, 0, 0.6),
      var(--accent-glow);
    overflow: hidden;
    animation: windowIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes windowIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Title bar ── */
  .titlebar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    z-index: 10;
    -webkit-app-region: drag;
  }

  .traffic-lights {
    display: flex;
    gap: 7px;
  }

  .traffic-lights span {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: block;
  }

  .traffic-lights span:nth-child(1) { background: #ff5f57; }
  .traffic-lights span:nth-child(2) { background: #febc2e; }
  .traffic-lights span:nth-child(3) { background: #28c840; }

  .titlebar-label {
    flex: 1;
    text-align: center;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 46px;
  }

  /* ── Main panel ── */
  .main-panel {
    display: flex;
    flex-direction: column;
    padding: 48px 36px 28px;
    position: relative;
    overflow: hidden;
  }

  .main-panel::before {
    content: '';
    position: absolute;
    top: -60%;
    left: -20%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Album art ── */
  .art-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  .vinyl-container {
    position: relative;
    width: min(280px, 60vw);
    aspect-ratio: 1;
  }

  .vinyl-glow {
    position: absolute;
    inset: -20%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 45, 120, 0.25) 0%,
      rgba(168, 85, 247, 0.15) 40%,
      transparent 70%);
    filter: blur(30px);
    transition: opacity var(--transition);
    opacity: 0.5;
  }

  .vinyl-container.playing .vinyl-glow {
    opacity: 1;
    animation: glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .album-disc {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 0 0 3px rgba(255,255,255,0.06),
      0 0 0 6px rgba(0,0,0,0.3),
      0 20px 60px rgba(0,0,0,0.5);
    transition: transform var(--transition);
  }

  .album-disc.spinning {
    animation: spin 4s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.6s ease;
  }

  .album-art.fade { opacity: 0; }

  .disc-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: var(--bg-deep);
    border: 2px solid rgba(255,255,255,0.1);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .disc-center::after {
    content: '';
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }

  /* ── Visualizer ── */
  .visualizer {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 48px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .visualizer.active { opacity: 1; }

  .viz-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(0deg, var(--neon-pink), var(--neon-cyan));
    height: 4px;
    transition: height 0.08s ease;
  }

  /* ── Track info ── */
  .track-info {
    text-align: center;
    padding: 20px 0 8px;
    position: relative;
  }

  .track-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .track-title.changing {
    opacity: 0;
    transform: translateY(8px);
  }

  .track-artist {
    font-size: 0.875rem;
    color: var(--text-muted);
    font-weight: 300;
    transition: opacity 0.3s ease;
  }

  .track-artist.changing { opacity: 0; }

  /* ── Progress ── */
  .progress-section {
    padding: 8px 0 4px;
  }

  .progress-bar {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    cursor: pointer;
    overflow: visible;
  }

  .progress-bar:hover { height: 6px; }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
    border-radius: 2px;
    position: relative;
    transition: width 0.1s linear;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px rgba(255, 45, 120, 0.6);
    transition: transform 0.2s ease;
  }

  .progress-bar:hover .progress-fill::after {
    transform: translateY(-50%) scale(1);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 16px 0 8px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, transform 0.2s, background 0.2s;
  }

  .ctrl-btn:hover {
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
  }

  .ctrl-btn:active { transform: scale(0.92); }

  .ctrl-btn.active { color: var(--neon-cyan); }

  .ctrl-btn svg { width: 20px; height: 20px; }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 24px rgba(255, 45, 120, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .play-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 32px rgba(255, 45, 120, 0.55);
  }

  .play-btn:active { transform: scale(0.96); }

  .play-btn svg { width: 24px; height: 24px; margin-left: 2px; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }

  .volume-row svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }

  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-primary);
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
  }

  /* ── Sidebar / playlist ── */
  .sidebar {
    border-left: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }

  .sidebar-header {
    padding: 48px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .upload-btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .upload-btn:hover {
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
  }

  #file-input { display: none; }

  .playlist {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .track-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--neon-pink), var(--neon-cyan));
    border-radius: 0 2px 2px 0;
    transform: scaleY(0);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .track-item:hover { background: rgba(255,255,255,0.04); }
  .track-item.active { background: rgba(255, 45, 120, 0.08); }
  .track-item.active::before { transform: scaleY(1); }

  .track-thumb {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .track-meta { flex: 1; min-width: 0; }

  .track-meta-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .track-meta-artist {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-duration {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .playing-indicator {
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
    flex-shrink: 0;
  }

  .track-item.active .playing-indicator { display: flex; }
  .track-item.active .track-duration { display: none; }

  .playing-indicator span {
    width: 2px;
    background: var(--neon-pink);
    border-radius: 1px;
    animation: eq 0.8s ease-in-out infinite alternate;
  }

  .playing-indicator span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .playing-indicator span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
  .playing-indicator span:nth-child(3) { height: 5px; animation-delay: 0.3s; }

  @keyframes eq {
    0% { height: 4px; }
    100% { height: 14px; }
  }

  .sidebar-footer {
    padding: 12px 20px 20px;
    border-top: 1px solid var(--glass-border);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
  }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    .player-window {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
      height: 100%;
      border-radius: 0;
    }
    .sidebar {
      border-left: none;
      border-top: 1px solid var(--glass-border);
      max-height: 220px;
    }
    .main-panel { padding: 44px 24px 20px; }
    .vinyl-container { width: min(220px, 50vw); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sky-gradient"></div>
  <div class="stars"></div>
  <div class="cityscape" id="cityscape"></div>
  <div class="fog"></div>
  <div class="reflection"></div>
</div>

<div class="app">
  <div class="player-window">
    <div class="titlebar">
      <div class="traffic-lights">
        <span></span><span></span><span></span>
      </div>
      <div class="titlebar-label">Neon City Player</div>
    </div>

    <div class="main-panel">
      <div class="art-stage">
        <div class="vinyl-container" id="vinyl">
          <div class="vinyl-glow"></div>
          <div class="album-disc" id="disc">
            <canvas id="album-canvas" class="album-art" width="560" height="560"></canvas>
            <div class="disc-center"></div>
          </div>
        </div>
        <div class="visualizer" id="visualizer"></div>
      </div>

      <div class="track-info">
        <div class="track-title" id="track-title">Midnight Drive</div>
        <div class="track-artist" id="track-artist">Neon District</div>
      </div>

      <div class="progress-section">
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-prev" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="play-btn" id="btn-play" title="Play">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" class="volume-slider" id="volume" min="0" max="100" value="75">
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Queue</h2>
        <button class="upload-btn" id="upload-btn">+ Add Files</button>
        <input type="file" id="file-input" accept="audio/*" multiple>
      </div>
      <div class="playlist" id="playlist"></div>
      <div class="sidebar-footer">6 tracks · Neon City Sessions</div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ── Cityscape SVG generator ── */
  function buildCityscape() {
    const container = document.getElementById('cityscape');
    const w = 1200, h = 400;
    let buildings = '';
    const palette = ['#0e1020', '#12152a', '#0a0c18', '#151830', '#0d0f22'];
    let x = 0;
    const rng = (seed) => { seed = Math.sin(seed) * 10000; return seed - Math.floor(seed); };

    for (let i = 0; i < 40; i++) {
      const bw = 20 + rng(i * 7) * 60;
      const bh = 80 + rng(i * 13) * 280;
      const col = palette[Math.floor(rng(i * 3) * palette.length)];
      buildings += `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" fill="${col}"/>`;

      const rows = Math.floor(bh / 18);
      const cols = Math.floor(bw / 14);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (rng(i * 100 + r * 10 + c) > 0.55) {
            const wx = x + 4 + c * 14;
            const wy = h - bh + 8 + r * 18;
            const wc = rng(i + r + c) > 0.7 ? '#ffb347' : (rng(i + r) > 0.5 ? '#00e5ff' : '#ff2d78');
            const base = 0.3 + rng(i + c) * 0.5;
            const dur = 2 + rng(i * 5 + r) * 6;
            const delay = rng(i + r + c * 3) * 4;
            buildings += `<rect class="window-light" x="${wx}" y="${wy}" width="6" height="8" rx="1" fill="${wc}" style="--base:${base};--dur:${dur}s;--delay:${delay}s" opacity="${base}"/>`;
          }
        }
      }
      x += bw - 2;
    }

    container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax slice">${buildings}</svg>`;
  }
  buildCityscape();

  /* ── Album art generator ── */
  const ART_PALETTES = [
    { bg: ['#1a0533', '#ff2d78', '#a855f7'], accent: '#00e5ff' },
    { bg: ['#0a1628', '#0066ff', '#00e5ff'], accent: '#ffb347' },
    { bg: ['#1a0a2e', '#ff6b35', '#ff2d78'], accent: '#a855f7' },
    { bg: ['#0d1b2a', '#7209b7', '#3a0ca3'], accent: '#00e5ff' },
    { bg: ['#1b1025', '#e040fb', '#7c4dff'], accent: '#ff2d78' },
    { bg: ['#0a1a1a', '#00b4d8', '#0077b6'], accent: '#ffb347' },
  ];

  function generateAlbumArt(index, title) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 280;
    const ctx = canvas.getContext('2d');
    const pal = ART_PALETTES[index % ART_PALETTES.length];
    const rng = (s) => { s = Math.sin(s * 127.1 + index) * 43758.5453; return s - Math.floor(s); };

    const grad = ctx.createLinearGradient(0, 0, 280, 280);
    grad.addColorStop(0, pal.bg[0]);
    grad.addColorStop(0.5, pal.bg[1]);
    grad.addColorStop(1, pal.bg[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 280, 280);

    for (let i = 0; i < 8; i++) {
      const cx = rng(i * 3) * 280;
      const cy = rng(i * 7) * 280;
      const r = 20 + rng(i * 11) * 80;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.03 + rng(i) * 0.06})`;
      ctx.fill();
    }

    ctx.strokeStyle = pal.accent;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.4;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      const sy = 40 + i * 50;
      ctx.moveTo(0, sy);
      for (let x = 0; x <= 280; x += 8) {
        ctx.lineTo(x, sy + Math.sin(x * 0.04 + i + index) * 12);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.font = 'bold 22px Syne, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.textAlign = 'center';
    const words = title.split(' ');
    words.forEach((w, i) => {
      ctx.fillText(w, 140, 130 + i * 28);
    });

    ctx.font = '11px DM Sans, sans-serif';
    ctx.fillStyle = pal.accent;
    ctx.fillText('NEON CITY', 140, 240);

    return canvas.toDataURL();
  }

  /* ── Demo playlist with Web Audio synthesis ── */
  const DEMO_TRACKS = [
    { title: 'Midnight Drive', artist: 'Neon District', duration: 32, bpm: 118, key: 'Am', mood: 'drive' },
    { title: 'Glass Towers', artist: 'Skyline Echo', duration: 28, bpm: 95, key: 'Dm', mood: 'ambient' },
    { title: 'Pulse Avenue', artist: 'Metro Wave', duration: 30, bpm: 128, key: 'Em', mood: 'pulse' },
    { title: 'Rain on Neon', artist: 'Cipher Rain', duration: 35, bpm: 82, key: 'Fm', mood: 'rain' },
    { title: 'Elevator Jazz', artist: 'Penthouse FM', duration: 26, bpm: 105, key: 'Cm', mood: 'jazz' },
    { title: 'Rooftop Dawn', artist: 'Horizon Unit', duration: 33, bpm: 110, key: 'Gm', mood: 'dawn' },
  ];

  let tracks = DEMO_TRACKS.map((t, i) => ({
    ...t,
    id: i,
    art: generateAlbumArt(i, t.title),
    audio: null,
    isLocal: false,
  }));

  let currentIndex = 0;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false;
  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let currentSource = null;
  let startTime = 0;
  let pauseOffset = 0;
  let animFrame = null;
  let synthNodes = [];

  /* ── Web Audio synthesizer ── */
  const SCALES = {
    Am: [220, 246.94, 261.63, 293.66, 329.63, 349.23, 392],
    Dm: [293.66, 329.63, 349.23, 392, 440, 466.16, 523.25],
    Em: [329.63, 369.99, 392, 440, 493.88, 523.25, 587.33],
    Fm: [174.61, 196, 207.65, 233.08, 261.63, 277.18, 311.13],
    Cm: [261.63, 293.66, 311.13, 349.23, 392, 415.30, 466.16],
    Gm: [196, 220, 233.08, 261.63, 293.66, 311.13, 349.23],
  };

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
    masterGain.gain.value = 0.75;
  }

  function stopSynth() {
    synthNodes.forEach(n => { try { n.stop(); n.disconnect(); } catch(e) {} });
    synthNodes = [];
    if (currentSource) {
      try { currentSource.stop(); currentSource.disconnect(); } catch(e) {}
      currentSource = null;
    }
  }

  function playSynthTrack(track, offset) {
    stopSynth();
    const scale = SCALES[track.key] || SCALES.Am;
    const bpm = track.bpm;
    const beatDur = 60 / bpm;
    const now = audioCtx.currentTime;
    const dur = track.duration;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = track.mood === 'ambient' ? 800 : 2000;
    filter.Q.value = 1;
    filter.connect(masterGain);
    synthNodes.push(filter);

    const patterns = {
      drive: [0, 2, 4, 2, 3, 4, 2, 0],
      ambient: [0, 2, 4, 6, 4, 2, 0, 4],
      pulse: [0, 0, 4, 0, 2, 0, 4, 0],
      rain: [0, 1, 3, 4, 3, 1, 0, 2],
      jazz: [0, 2, 3, 2, 4, 3, 2, 0],
      dawn: [0, 2, 4, 5, 4, 2, 0, 1],
    };
    const pattern = patterns[track.mood] || patterns.drive;
    const totalBeats = Math.floor(dur / beatDur);

    for (let b = 0; b < totalBeats; b++) {
      const beatTime = now + b * beatDur - offset;
      if (beatTime < now - 0.05) continue;
      if (beatTime > now + dur) break;

      const noteIdx = pattern[b % pattern.length];
      const freq = scale[noteIdx % scale.length];

      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.type = track.mood === 'jazz' ? 'triangle' : (track.mood === 'pulse' ? 'square' : 'sine');
      osc.frequency.value = freq;

      env.gain.setValueAtTime(0, beatTime);
      env.gain.linearRampToValueAtTime(0.12, beatTime + 0.02);
      env.gain.exponentialRampToValueAtTime(0.001, beatTime + beatDur * 0.85);

      osc.connect(env);
      env.connect(filter);
      osc.start(beatTime);
      osc.stop(beatTime + beatDur * 0.9);
      synthNodes.push(osc, env);
    }

    if (track.mood !== 'ambient') {
      const bassOsc = audioCtx.createOscillator();
      const bassEnv = audioCtx.createGain();
      bassOsc.type = 'sine';
      bassOsc.frequency.value = scale[0] / 2;
      bassEnv.gain.setValueAtTime(0.08, now - offset);
      bassEnv.gain.setValueAtTime(0.08, now - offset + dur - 0.5);
      bassEnv.gain.linearRampToValueAtTime(0, now - offset + dur);
      bassOsc.connect(bassEnv);
      bassEnv.connect(filter);
      bassOsc.start(now - offset);
      bassOsc.stop(now - offset + dur);
      synthNodes.push(bassOsc, bassEnv);
    }

    startTime = audioCtx.currentTime - offset;
    scheduleEnd(dur, offset);
  }

  function playLocalTrack(track, offset) {
    stopSynth();
    if (!track.audio) return;
    currentSource = audioCtx.createMediaElementSource(track.audio);
    currentSource.connect(masterGain);
    track.audio.currentTime = offset;
    track.audio.play();
    startTime = audioCtx.currentTime - offset;

    track.audio.onended = () => {
      if (isPlaying) nextTrack();
    };

    function checkEnd() {
      if (!isPlaying || !track.audio) return;
      updateProgressLocal(track.audio);
      if (track.audio.ended) return;
      animFrame = requestAnimationFrame(checkEnd);
    }
    checkEnd();
  }

  function scheduleEnd(dur, offset) {
    const elapsed = () => audioCtx.currentTime - startTime;
    function tick() {
      if (!isPlaying) return;
      const t = elapsed();
      updateProgress(t, dur);
      if (t >= dur) {
        nextTrack();
        return;
      }
      animFrame = requestAnimationFrame(tick);
    }
    tick();
  }

  /* ── UI helpers ── */
  function fmtTime(s) {
    s = Math.max(0, Math.floor(s));
    return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
  }

  function updateProgress(current, total) {
    const pct = (current / total) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('time-current').textContent = fmtTime(current);
    document.getElementById('time-total').textContent = fmtTime(total);
  }

  function updateProgressLocal(audio) {
    updateProgress(audio.currentTime, audio.duration || tracks[currentIndex].duration);
  }

  function setTrackInfo(title, artist) {
    const tEl = document.getElementById('track-title');
    const aEl = document.getElementById('track-artist');
    tEl.classList.add('changing');
    aEl.classList.add('changing');
    setTimeout(() => {
      tEl.textContent = title;
      aEl.textContent = artist;
      tEl.classList.remove('changing');
      aEl.classList.remove('changing');
    }, 200);
  }

  function updateAlbumArt(src) {
    const canvas = document.getElementById('album-canvas');
    const img = new Image();
    img.onload = () => {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 560, 560);
      ctx.drawImage(img, 0, 0, 560, 560);
    };
    img.src = src;
  }

  function renderPlaylist() {
    const list = document.getElementById('playlist');
    list.innerHTML = tracks.map((t, i) => `
      <div class="track-item ${i === currentIndex ? 'active' : ''}" data-index="${i}">
        <img class="track-thumb" src="${t.art}" alt="">
        <div class="track-meta">
          <div class="track-meta-name">${t.title}</div>
          <div class="track-meta-artist">${t.artist}</div>
        </div>
        <span class="track-duration">${fmtTime(t.duration)}</span>
        <div class="playing-indicator"><span></span><span></span><span></span></div>
      </div>
    `).join('');

    list.querySelectorAll('.track-item').forEach(el => {
      el.addEventListener('click', () => loadTrack(+el.dataset.index, true));
    });

    document.querySelector('.sidebar-footer').textContent =
      `${tracks.length} track${tracks.length !== 1 ? 's' : ''} · Neon City Sessions`;
  }

  /* ── Playback ── */
  function loadTrack(index, autoplay) {
    if (index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const track = tracks[index];

    setTrackInfo(track.title, track.artist);
    updateAlbumArt(track.art);
    renderPlaylist();
    pauseOffset = 0;
    updateProgress(0, track.duration);

    if (autoplay) play();
    else pause();
  }

  function play() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isPlaying = true;
    document.getElementById('icon-play').style.display = 'none';
    document.getElementById('icon-pause').style.display = 'block';
    document.getElementById('disc').classList.add('spinning');
    document.getElementById('vinyl').classList.add('playing');
    document.getElementById('visualizer').classList.add('active');

    const track = tracks[currentIndex];
    if (track.isLocal && track.audio) {
      playLocalTrack(track, pauseOffset);
    } else {
      playSynthTrack(track, pauseOffset);
    }
    startVisualizer();
  }

  function pause() {
    isPlaying = false;
    if (animFrame) cancelAnimationFrame(animFrame);

    const track = tracks[currentIndex];
    if (track.isLocal && track.audio) {
      pauseOffset = track.audio.currentTime;
      track.audio.pause();
    } else if (audioCtx) {
      pauseOffset = audioCtx.currentTime - startTime;
    }

    stopSynth();
    document.getElementById('icon-play').style.display = 'block';
    document.getElementById('icon-pause').style.display = 'none';
    document.getElementById('disc').classList.remove('spinning');
    document.getElementById('vinyl').classList.remove('playing');
  }

  function togglePlay() {
    isPlaying ? pause() : play();
  }

  function nextTrack() {
    let next;
    if (shuffle) {
      next = currentIndex;
      while (next === currentIndex && tracks.length > 1) {
        next = Math.floor(Math.random() * tracks.length);
      }
    } else {
      next = currentIndex + 1;
      if (next >= tracks.length) next = repeat ? 0 : currentIndex;
    }
    if (next !== currentIndex || repeat) {
      pauseOffset = 0;
      loadTrack(next, true);
    } else {
      pause();
    }
  }

  function prevTrack() {
    const track = tracks[currentIndex];
    let currentTime = pauseOffset;
    if (track.isLocal && track.audio) currentTime = track.audio.currentTime;

    if (currentTime > 3) {
      pauseOffset = 0;
      loadTrack(currentIndex, isPlaying);
    } else {
      const prev = currentIndex - 1 < 0 ? (repeat ? tracks.length - 1 : 0) : currentIndex - 1;
      pauseOffset = 0;
      loadTrack(prev, isPlaying);
    }
  }

  function seek(ratio) {
    const track = tracks[currentIndex];
    pauseOffset = ratio * track.duration;
    if (isPlaying) {
      if (track.isLocal && track.audio) {
        track.audio.currentTime = pauseOffset;
      } else {
        playSynthTrack(track, pauseOffset);
      }
    }
    updateProgress(pauseOffset, track.duration);
  }

  /* ── Visualizer ── */
  function buildVisualizer() {
    const viz = document.getElementById('visualizer');
    for (let i = 0; i < 32; i++) {
      const bar = document.createElement('div');
      bar.className = 'viz-bar';
      viz.appendChild(bar);
    }
  }
  buildVisualizer();

  function startVisualizer() {
    if (!analyser) return;
    const bars = document.querySelectorAll('.viz-bar');
    const data = new Uint8Array(analyser.frequencyBinCount);

    function draw() {
      if (!isPlaying) return;
      analyser.getByteFrequencyData(data);
      bars.forEach((bar, i) => {
        const val = data[i % data.length];
        bar.style.height = Math.max(4, (val / 255) * 48) + 'px';
      });
      animFrame = requestAnimationFrame(draw);
    }
    draw();
  }

  /* ── File upload ── */
  document.getElementById('upload-btn').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach((file, fi) => {
      const url = URL.createObjectURL(file);
      const audio = new Audio(url);
      audio.addEventListener('loadedmetadata', () => {
        const name = file.name.replace(/\.[^.]+$/, '');
        const idx = tracks.length;
        tracks.push({
          id: idx,
          title: name,
          artist: 'Local File',
          duration: Math.floor(audio.duration),
          art: generateAlbumArt(idx, name.substring(0, 12)),
          audio,
          isLocal: true,
          bpm: 120,
          key: 'Am',
          mood: 'drive',
        });
        renderPlaylist();
      });
    });
    e.target.value = '';
  });

  /* ── Event bindings ── */
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-next').addEventListener('click', nextTrack);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);

  document.getElementById('btn-shuffle').addEventListener('click', function() {
    shuffle = !shuffle;
    this.classList.toggle('active', shuffle);
  });

  document.getElementById('btn-repeat').addEventListener('click', function() {
    repeat = !repeat;
    this.classList.toggle('active', repeat);
  });

  document.getElementById('volume').addEventListener('input', function() {
    if (masterGain) masterGain.gain.value = this.value / 100;
  });

  document.getElementById('progress-bar').addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    seek((e.clientX - rect.left) / rect.width);
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
  });

  /* ── Init ── */
  renderPlaylist();
  loadTrack(0, false);
  updateAlbumArt(tracks[0].art);
})();
</script>
</body>
</html>
