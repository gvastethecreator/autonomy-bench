<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City — Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #title {
    position: fixed; top: 28px; left: 32px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.18em; text-transform: uppercase;
    font-size: 11px; font-weight: 300;
    text-shadow: 0 0 20px rgba(120,180,255,0.4);
    opacity: 0; animation: fadeIn 2.5s ease 0.5s forwards;
  }
  #subtitle {
    position: fixed; top: 48px; left: 32px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: rgba(160,190,230,0.55);
    font-size: 10px; letter-spacing: 0.08em;
    opacity: 0; animation: fadeIn 2.5s ease 1.2s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title">Nocturne District</div>
<div id="subtitle">Procedural skyline · living lights</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ── Seeded RNG ──────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = 847291;
const rand = mulberry32(SEED);
const randRange = (a, b) => a + rand() * (b - a);
const randInt = (a, b) => Math.floor(randRange(a, b + 1));
const pick = arr => arr[randInt(0, arr.length - 1)];

// ── Scene setup ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040612);
scene.fog = new THREE.FogExp2(0x0a1020, 0.0042);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 800);
camera.position.set(80, 42, 80);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55, 0.35, 0.82
);
composer.addPass(bloom);

// ── Lighting ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2040, 0.35));

const moonLight = new THREE.DirectionalLight(0x8899cc, 0.45);
moonLight.position.set(-60, 120, -40);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 10;
moonLight.shadow.camera.far = 300;
moonLight.shadow.camera.left = -120;
moonLight.shadow.camera.right = 120;
moonLight.shadow.camera.top = 120;
moonLight.shadow.camera.bottom = -120;
scene.add(moonLight);

const rimLight = new THREE.HemisphereLight(0x334466, 0x080810, 0.5);
scene.add(rimLight);

// ── Sky dome ────────────────────────────────────────────────
function createSky() {
  const geo = new THREE.SphereGeometry(400, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      uTime: { value: 0 },
      uHorizon: { value: new THREE.Color(0x1a2848) },
      uZenith: { value: new THREE.Color(0x020408) },
      uGlow: { value: new THREE.Color(0x334466) },
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uHorizon, uZenith, uGlow;
      varying vec3 vPos;
      void main() {
        float h = normalize(vPos).y * 0.5 + 0.5;
        vec3 col = mix(uHorizon, uZenith, pow(h, 0.7));
        float glow = exp(-abs(h - 0.08) * 18.0) * 0.35;
        col += uGlow * glow;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.name = 'sky';
  scene.add(sky);
  return mat;
}
const skyMat = createSky();

// ── Stars ───────────────────────────────────────────────────
function createStars() {
  const count = 2800;
  const pos = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const theta = rand() * Math.PI * 2;
    const phi = rand() * Math.PI * 0.45;
    const r = 350;
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    sizes[i] = rand() * 1.8 + 0.3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size;
      uniform float uTime;
      varying float vAlpha;
      void main() {
        vAlpha = 0.4 + 0.6 * sin(uTime * 1.5 + position.x * 0.05 + position.z * 0.03);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * vAlpha;
        gl_FragColor = vec4(0.9, 0.95, 1.0, a);
      }
    `,
  });
  const stars = new THREE.Points(geo, mat);
  stars.name = 'stars';
  scene.add(stars);
  return mat;
}
const starMat = createStars();

// ── Moon ────────────────────────────────────────────────────
function createMoon() {
  const g = new THREE.SphereGeometry(6, 32, 32);
  const m = new THREE.MeshBasicMaterial({ color: 0xdde8ff });
  const moon = new THREE.Mesh(g, m);
  moon.position.set(-90, 95, -120);
  scene.add(moon);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    color: 0x6688bb, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending,
  }));
  glow.scale.set(40, 40, 1);
  moon.add(glow);
}
createMoon();

// ── Ground & roads ──────────────────────────────────────────
const CITY_SIZE = 14;
const BLOCK = 12;
const ROAD_W = 3.5;
const half = (CITY_SIZE * BLOCK) / 2;

const groundGeo = new THREE.PlaneGeometry(CITY_SIZE * BLOCK + 40, CITY_SIZE * BLOCK + 40);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0c0e14, roughness: 0.85, metalness: 0.15,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Wet reflection plane
const wetGeo = new THREE.PlaneGeometry(CITY_SIZE * BLOCK, CITY_SIZE * BLOCK);
const wetMat = new THREE.MeshStandardMaterial({
  color: 0x080a12, roughness: 0.05, metalness: 0.92,
  transparent: true, opacity: 0.35,
});
const wet = new THREE.Mesh(wetGeo, wetMat);
wet.rotation.x = -Math.PI / 2;
wet.position.y = 0.02;
scene.add(wet);

function createRoads() {
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x141820, roughness: 0.9, metalness: 0.05 });
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x334455 });
  const group = new THREE.Group();
  const total = CITY_SIZE * BLOCK;

  for (let i = 0; i <= CITY_SIZE; i++) {
    const offset = -half + i * BLOCK;
    // Horizontal road
    const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(total, ROAD_W), roadMat);
    hRoad.rotation.x = -Math.PI / 2;
    hRoad.position.set(0, 0.03, offset);
    hRoad.receiveShadow = true;
    group.add(hRoad);
    // Vertical road
    const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, total), roadMat);
    vRoad.rotation.x = -Math.PI / 2;
    vRoad.position.set(offset, 0.03, 0);
    vRoad.receiveShadow = true;
    group.add(vRoad);
    // Center dashes
    if (i < CITY_SIZE) {
      for (let d = -half + BLOCK * 0.5; d < half; d += 8) {
        const dash = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 0.15), lineMat);
        dash.rotation.x = -Math.PI / 2;
        dash.position.set(offset + BLOCK * 0.5, 0.04, d);
        group.add(dash);
        const dash2 = dash.clone();
        dash2.position.set(d, 0.04, offset + BLOCK * 0.5);
        dash2.rotation.z = Math.PI / 2;
        group.add(dash2);
      }
    }
  }
  scene.add(group);
}
createRoads();

// ── Building materials palette ──────────────────────────────
const FACADE_COLORS = [
  0x1a1e28, 0x141820, 0x1c2230, 0x181c26, 0x222830, 0x101418,
  0x1e2430, 0x161a22, 0x242830,
];
const ACCENT_COLORS = [
  0xff6644, 0x44aaff, 0xffcc44, 0xaa66ff, 0x44ffaa, 0xff4488,
];
const windowLights = [];
const neonMeshes = [];
const cityGroup = new THREE.Group();

function createWindowTexture(w, h, litRatio) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a0c12';
  ctx.fillRect(0, 0, w, h);
  const cols = Math.floor(w / 8);
  const rows = Math.floor(h / 12);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (rand() < litRatio) {
        const warm = rand() > 0.3;
        const hue = warm ? `hsl(${35 + randInt(0, 20)}, 80%, ${55 + randInt(0, 25)}%)`
                         : `hsl(${200 + randInt(0, 40)}, 60%, ${45 + randInt(0, 20)}%)`;
        ctx.fillStyle = hue;
        ctx.globalAlpha = 0.7 + rand() * 0.3;
        ctx.fillRect(c * 8 + 1, r * 12 + 2, 5, 8);
      }
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function addNeonSign(parent, x, y, z, color, scale = 1) {
  const geo = new THREE.PlaneGeometry(3 * scale, 0.8 * scale);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  parent.add(mesh);
  neonMeshes.push({ mesh, base: 0.9, phase: rand() * Math.PI * 2 });
  // Glow sprite
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    color, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending,
  }));
  sprite.scale.set(6 * scale, 3 * scale, 1);
  sprite.position.set(x, y, z + 0.5);
  parent.add(sprite);
  neonMeshes.push({ mesh: sprite, base: 0.3, phase: rand() * Math.PI * 2 });
}

function createBuilding(bx, bz, lotW, lotD) {
  const type = rand();
  const group = new THREE.Group();
  group.position.set(bx, 0, bz);

  let height, width, depth;
  if (type < 0.15) {
    // Tower
    width = lotW * randRange(0.5, 0.75);
    depth = lotD * randRange(0.5, 0.75);
    height = randRange(35, 85);
  } else if (type < 0.45) {
    // Mid-rise
    width = lotW * randRange(0.65, 0.9);
    depth = lotD * randRange(0.65, 0.9);
    height = randRange(15, 40);
  } else if (type < 0.7) {
    // Low block
    width = lotW * randRange(0.7, 0.95);
    depth = lotD * randRange(0.7, 0.95);
    height = randRange(6, 18);
  } else {
    // Wide slab
    width = lotW * randRange(0.8, 0.98);
    depth = lotD * randRange(0.4, 0.6);
    height = randRange(20, 55);
  }

  const facadeColor = pick(FACADE_COLORS);
  const litRatio = randRange(0.25, 0.65);
  const winTex = createWindowTexture(64, 128, litRatio);
  winTex.repeat.set(Math.max(1, width / 4), Math.max(1, height / 6));

  const bodyMat = new THREE.MeshStandardMaterial({
    color: facadeColor, roughness: 0.75, metalness: 0.1,
    map: winTex,
    emissive: new THREE.Color(0x111520),
    emissiveMap: winTex,
    emissiveIntensity: 0.8,
  });

  const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
  body.position.y = height / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Roof detail
  if (height > 25 && rand() > 0.4) {
    const roofH = randRange(2, 6);
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(width * 0.85, roofH, depth * 0.85),
      new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.8, metalness: 0.2 })
    );
    roof.position.y = height + roofH / 2;
    roof.castShadow = true;
    group.add(roof);
  }

  // Antenna / spire
  if (height > 50 && rand() > 0.5) {
    const spireH = randRange(8, 20);
    const spire = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.4, spireH, 6),
      new THREE.MeshStandardMaterial({ color: 0x222830, metalness: 0.6, roughness: 0.3 })
    );
    spire.position.y = height + spireH / 2 + (height > 25 ? 4 : 0);
    group.add(spire);
    const blink = new THREE.PointLight(0xff2200, 0.8, 12);
    blink.position.y = height + spireH + (height > 25 ? 4 : 0);
    group.add(blink);
    windowLights.push({ light: blink, phase: rand() * 6, interval: 1.2 });
  }

  // Neon on taller buildings
  if (height > 20 && rand() > 0.55) {
    const accent = pick(ACCENT_COLORS);
    const side = rand() > 0.5 ? 1 : -1;
    addNeonSign(group, side * (width / 2 + 0.1), height * randRange(0.3, 0.7), 0, accent, randRange(0.8, 1.4));
  }

  // Ground floor shop glow
  if (rand() > 0.3) {
    const shopLight = new THREE.PointLight(pick([0xffaa66, 0xaaccff, 0xff8866]), randRange(0.4, 1.2), randRange(8, 16));
    shopLight.position.set(0, 2.5, depth / 2 + 0.5);
    group.add(shopLight);
    windowLights.push({ light: shopLight, phase: rand() * 10, interval: randRange(3, 8), flicker: true });
  }

  // Store window lights for animation
  windowLights.push({ texture: winTex, phase: rand() * 20, interval: randRange(4, 12), retexture: true, litRatio });

  cityGroup.add(group);
  return group;
}

// Generate city grid
for (let gx = 0; gx < CITY_SIZE; gx++) {
  for (let gz = 0; gz < CITY_SIZE; gz++) {
    const cx = -half + gx * BLOCK + BLOCK / 2;
    const cz = -half + gz * BLOCK + BLOCK / 2;
    const lotSize = BLOCK - ROAD_W - 1;
    // Sometimes split lot into two buildings
    if (rand() > 0.65) {
      createBuilding(cx - lotSize * 0.22, cz, lotSize * 0.45, lotSize * 0.85);
      createBuilding(cx + lotSize * 0.22, cz, lotSize * 0.45, lotSize * 0.85);
    } else {
      createBuilding(cx, cz, lotSize * 0.88, lotSize * 0.88);
    }
  }
}
scene.add(cityGroup);

// ── Street lamps ────────────────────────────────────────────
const lampGroup = new THREE.Group();
const lampPositions = [];
for (let i = -half + BLOCK * 0.5; i < half; i += BLOCK) {
  for (let j = -half + BLOCK * 0.5; j < half; j += BLOCK) {
    const offsets = [
      [i - BLOCK * 0.42, j - BLOCK * 0.42],
      [i + BLOCK * 0.42, j - BLOCK * 0.42],
      [i - BLOCK * 0.42, j + BLOCK * 0.42],
      [i + BLOCK * 0.42, j + BLOCK * 0.42],
    ];
    for (const [lx, lz] of offsets) {
      if (rand() > 0.25) continue;
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, 5, 6),
        new THREE.MeshStandardMaterial({ color: 0x1a1e24, metalness: 0.7, roughness: 0.4 })
      );
      pole.position.set(lx, 2.5, lz);
      pole.castShadow = true;
      lampGroup.add(pole);

      const arm = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.08, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x1a1e24, metalness: 0.7, roughness: 0.4 })
      );
      arm.position.set(lx + 0.5, 4.8, lz);
      lampGroup.add(arm);

      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffeecc })
      );
      bulb.position.set(lx + 1.0, 4.7, lz);
      lampGroup.add(bulb);

      const light = new THREE.PointLight(0xffddaa, randRange(0.6, 1.4), randRange(14, 22));
      light.position.set(lx + 1.0, 4.5, lz);
      light.castShadow = rand() > 0.7;
      if (light.castShadow) {
        light.shadow.mapSize.set(512, 512);
      }
      lampGroup.add(light);
      lampPositions.push({ light, phase: rand() * 8 });
    }
  }
}
scene.add(lampGroup);

// ── Distant skyline silhouette ──────────────────────────────
function createDistantSkyline() {
  const group = new THREE.Group();
  const dist = 180;
  for (let a = 0; a < 360; a += 8) {
    const rad = a * Math.PI / 180;
    const count = randInt(3, 8);
    let offset = 0;
    for (let i = 0; i < count; i++) {
      const bw = randRange(8, 25);
      const bh = randRange(20, 70);
      const bd = randRange(8, 20);
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(bw, bh, bd),
        new THREE.MeshBasicMaterial({ color: 0x060810 })
      );
      b.position.set(
        Math.cos(rad) * dist + Math.cos(rad + Math.PI / 2) * offset,
        bh / 2,
        Math.sin(rad) * dist + Math.sin(rad + Math.PI / 2) * offset
      );
      group.add(b);
      offset += bw + randRange(2, 8);
    }
  }
  scene.add(group);
}
createDistantSkyline();

// ── Traffic particles (headlights) ──────────────────────────
function createTraffic() {
  const count = 60;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const speeds = [];
  const routes = [];

  for (let i = 0; i < count; i++) {
    const horizontal = rand() > 0.5;
    const lane = randInt(0, CITY_SIZE) * BLOCK - half + (rand() > 0.5 ? -1 : 1);
    const start = randRange(-half, half);
    routes.push({ horizontal, lane, t: start, dir: rand() > 0.5 ? 1 : -1 });
    speeds.push(randRange(15, 45));
    const warm = rand() > 0.4;
    colors[i * 3] = warm ? 1.0 : 0.4;
    colors[i * 3 + 1] = warm ? 0.85 : 0.6;
    colors[i * 3 + 2] = warm ? 0.5 : 1.0;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 2.5, vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const traffic = new THREE.Points(geo, mat);
  traffic.name = 'traffic';
  scene.add(traffic);
  return { traffic, routes, speeds };
}
const trafficData = createTraffic();

// ── Floating dust / atmosphere particles ────────────────────
function createAtmosphere() {
  const count = 400;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = randRange(-half, half);
    pos[i * 3 + 1] = randRange(1, 60);
    pos[i * 3 + 2] = randRange(-half, half);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x8899bb, size: 0.8, transparent: true, opacity: 0.15,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  return new THREE.Points(geo, mat);
}
const atmosphere = createAtmosphere();
scene.add(atmosphere);

// ── Camera path ─────────────────────────────────────────────
const camPath = [];
const pathPoints = [
  new THREE.Vector3(90, 50, 90),
  new THREE.Vector3(40, 35, 70),
  new THREE.Vector3(-20, 28, 50),
  new THREE.Vector3(-60, 22, 10),
  new THREE.Vector3(-40, 30, -40),
  new THREE.Vector3(10, 38, -60),
  new THREE.Vector3(60, 45, -30),
  new THREE.Vector3(85, 52, 30),
  new THREE.Vector3(90, 50, 90),
];
const curve = new THREE.CatmullRomCurve3(pathPoints, true, 'catmullrom', 0.4);

// ── Animation state ─────────────────────────────────────────
const clock = new THREE.Clock();
let pathT = 0;
const lookTarget = new THREE.Vector3(0, 15, 0);

function updateTraffic(dt) {
  const pos = trafficData.traffic.geometry.attributes.position.array;
  for (let i = 0; i < trafficData.routes.length; i++) {
    const r = trafficData.routes[i];
    const s = trafficData.speeds[i];
    r.t += s * dt * r.dir;
    if (r.t > half + 10) r.t = -half - 10;
    if (r.t < -half - 10) r.t = half + 10;
    if (r.horizontal) {
      pos[i * 3] = r.t;
      pos[i * 3 + 1] = 0.6 + Math.sin(clock.elapsedTime * 3 + i) * 0.05;
      pos[i * 3 + 2] = r.lane;
    } else {
      pos[i * 3] = r.lane;
      pos[i * 3 + 1] = 0.6;
      pos[i * 3 + 2] = r.t;
    }
  }
  trafficData.traffic.geometry.attributes.position.needsUpdate = true;
}

function updateLights(t) {
  for (const item of windowLights) {
    if (item.light && item.interval) {
      const blink = Math.sin(t * 2 + item.phase);
      if (item.flicker) {
        item.light.intensity = item.light.intensity * 0.95 + (0.5 + blink * 0.3) * 0.05;
      } else if (Math.floor(t + item.phase) % Math.ceil(item.interval) === 0) {
        item.light.intensity = blink > 0 ? 0.8 : 0.1;
      }
    }
    if (item.retexture && Math.floor(t) % Math.ceil(item.interval) === 0 && Math.random() > 0.7) {
      item.litRatio = Math.max(0.15, Math.min(0.75, item.litRatio + (Math.random() - 0.5) * 0.15));
      const newTex = createWindowTexture(64, 128, item.litRatio);
      item.texture.image = newTex.image;
      item.texture.needsUpdate = true;
    }
  }
  for (const n of neonMeshes) {
    n.mesh.material.opacity = n.base + Math.sin(t * 2.5 + n.phase) * 0.15;
  }
  for (const lp of lampPositions) {
    lp.light.intensity = 0.8 + Math.sin(t * 1.5 + lp.phase) * 0.15;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  pathT = (pathT + dt * 0.012) % 1;
  const camPos = curve.getPointAt(pathT);
  const ahead = curve.getPointAt((pathT + 0.008) % 1);
  camera.position.lerp(camPos, 0.06);
  lookTarget.lerp(new THREE.Vector3(ahead.x * 0.3, 12 + Math.sin(t * 0.3) * 4, ahead.z * 0.3), 0.04);
  camera.lookAt(lookTarget);

  skyMat.uniforms.uTime.value = t;
  starMat.uniforms.uTime.value = t;

  atmosphere.rotation.y = t * 0.01;
  const apos = atmosphere.geometry.attributes.position.array;
  for (let i = 0; i < apos.length; i += 3) {
    apos[i + 1] += Math.sin(t + apos[i] * 0.1) * 0.002;
  }
  atmosphere.geometry.attributes.position.needsUpdate = true;

  updateTraffic(dt);
  updateLights(t);

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
