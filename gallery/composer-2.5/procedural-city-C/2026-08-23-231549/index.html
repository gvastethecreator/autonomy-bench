<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City at Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, transparent 40%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }
  #title {
    position: fixed; left: 2rem; bottom: 2rem;
    font: 300 0.75rem/1.6 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: rgba(180, 200, 255, 0.35);
    pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #020208; color: rgba(200, 210, 255, 0.5);
    font: 300 0.85rem "Segoe UI", system-ui, sans-serif; letter-spacing: 0.2em;
    transition: opacity 1.2s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">Generating city…</div>
<div id="overlay"></div>
<div id="title">Nocturne District</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ── Seeded RNG ──────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xC17A2024);

// ── Palette ─────────────────────────────────────────────────
const PALETTE = {
  skyTop: 0x050818,
  skyHorizon: 0x1a0f28,
  fog: 0x0a0618,
  street: 0x080810,
  asphalt: 0x0c0c14,
  neon: [0xff2d6a, 0x00f0ff, 0xffaa00, 0xb040ff, 0x40ff90, 0xff4060],
  building: [0x12121c, 0x161622, 0x101018, 0x1a1a28, 0x141420],
  windowWarm: '#ffd080',
  windowCool: '#80c0ff',
};

// ── Scene setup ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.skyTop);
scene.fog = new THREE.FogExp2(PALETTE.fog, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 400);
camera.position.set(0, 8, 30);

// ── Lighting ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a1830, 0.35));
const moon = new THREE.DirectionalLight(0x8090c0, 0.25);
moon.position.set(-40, 80, -30);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 200;
moon.shadow.camera.left = moon.shadow.camera.bottom = -60;
moon.shadow.camera.right = moon.shadow.camera.top = 60;
scene.add(moon);

const hemi = new THREE.HemisphereLight(0x3040a0, 0x080410, 0.4);
scene.add(hemi);

// ── Textures ────────────────────────────────────────────────
function makeWindowTexture(w, h, litRatio) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, w, h);
  const cols = Math.floor(w / 8);
  const rows = Math.floor(h / 12);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (rng() > litRatio) continue;
      const warm = rng() > 0.45;
      const alpha = 0.4 + rng() * 0.6;
      ctx.fillStyle = warm
        ? `rgba(255, ${180 + rng() * 40 | 0}, ${80 + rng() * 60 | 0}, ${alpha})`
        : `rgba(${100 + rng() * 80 | 0}, ${160 + rng() * 60 | 0}, 255, ${alpha * 0.8})`;
      ctx.fillRect(x * 8 + 1, y * 12 + 2, 5, 7);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeNeonTexture(text, color) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.font = 'bold 28px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ── Ground & streets ────────────────────────────────────────
const GROUND_SIZE = 220;
const BLOCK = 14;
const STREET = 6;
const GRID = 7;

const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
const groundMat = new THREE.MeshStandardMaterial({
  color: PALETTE.asphalt,
  roughness: 0.15,
  metalness: 0.65,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Wet reflection shimmer
const wetGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
const wetMat = new THREE.MeshStandardMaterial({
  color: 0x101020,
  roughness: 0.05,
  metalness: 0.9,
  transparent: true,
  opacity: 0.35,
});
const wet = new THREE.Mesh(wetGeo, wetMat);
wet.rotation.x = -Math.PI / 2;
wet.position.y = 0.02;
scene.add(wet);

// Street markings
const streetGroup = new THREE.Group();
const markMat = new THREE.MeshBasicMaterial({ color: 0x303040 });
const centerLineMat = new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.6 });

for (let i = -GRID; i <= GRID; i++) {
  const pos = i * (BLOCK + STREET);
  // Horizontal streets
  const hStreet = new THREE.Mesh(
    new THREE.PlaneGeometry(GROUND_SIZE, STREET),
    new THREE.MeshStandardMaterial({ color: PALETTE.street, roughness: 0.2, metalness: 0.5 })
  );
  hStreet.rotation.x = -Math.PI / 2;
  hStreet.position.set(0, 0.01, pos);
  hStreet.receiveShadow = true;
  streetGroup.add(hStreet);

  // Vertical streets
  const vStreet = new THREE.Mesh(
    new THREE.PlaneGeometry(STREET, GROUND_SIZE),
    new THREE.MeshStandardMaterial({ color: PALETTE.street, roughness: 0.2, metalness: 0.5 })
  );
  vStreet.rotation.x = -Math.PI / 2;
  vStreet.position.set(pos, 0.01, 0);
  vStreet.receiveShadow = true;
  streetGroup.add(vStreet);

  // Center dashes
  if (i !== 0) {
    for (let d = -GROUND_SIZE / 2; d < GROUND_SIZE / 2; d += 8) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), centerLineMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(pos, 0.03, d);
      streetGroup.add(dash);
    }
  }
}
scene.add(streetGroup);

// ── Buildings ───────────────────────────────────────────────
const cityGroup = new THREE.Group();
const neonSigns = [];
const windowMeshes = [];

const NEON_WORDS = ['OPEN', 'BAR', 'HOTEL', 'CLUB', 'RAMEN', 'ARCADE', 'PIZZA', 'LOUNGE', 'CYBER', 'NEON'];

function createBuilding(bx, bz, footprint, height, isLandmark) {
  const group = new THREE.Group();
  group.position.set(bx, 0, bz);

  const baseColor = PALETTE.building[rng() * PALETTE.building.length | 0];
  const w = footprint * (0.7 + rng() * 0.25);
  const d = footprint * (0.7 + rng() * 0.25);
  const h = height * (isLandmark ? 1.4 + rng() * 0.6 : 0.8 + rng() * 0.5);

  // Main body
  const bodyGeo = new THREE.BoxGeometry(w, h, d);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: baseColor,
    roughness: 0.85,
    metalness: 0.1,
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Window facade (front)
  const winTex = makeWindowTexture(64, 128, 0.35 + rng() * 0.3);
  winTex.repeat.set(w / 3, h / 5);
  const winMat = new THREE.MeshStandardMaterial({
    map: winTex,
    emissiveMap: winTex,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 0.8,
    roughness: 0.9,
    metalness: 0.0,
  });
  const winMesh = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.92, h * 0.95), winMat);
  winMesh.position.set(0, h / 2, d / 2 + 0.05);
  group.add(winMesh);
  windowMeshes.push({ mesh: winMesh, phase: rng() * Math.PI * 2, speed: 0.3 + rng() * 1.5 });

  // Side windows
  const sideTex = makeWindowTexture(48, 128, 0.25 + rng() * 0.25);
  sideTex.repeat.set(d / 3, h / 5);
  const sideMat = new THREE.MeshStandardMaterial({
    map: sideTex,
    emissiveMap: sideTex,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 0.6,
    roughness: 0.9,
  });
  const sideWin = new THREE.Mesh(new THREE.PlaneGeometry(d * 0.9, h * 0.95), sideMat);
  sideWin.position.set(w / 2 + 0.05, h / 2, 0);
  sideWin.rotation.y = Math.PI / 2;
  group.add(sideWin);
  windowMeshes.push({ mesh: sideWin, phase: rng() * Math.PI * 2, speed: 0.2 + rng() * 1.2 });

  // Roof details
  if (rng() > 0.5 || isLandmark) {
    const roofH = 1 + rng() * 3;
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.6, roofH, d * 0.6),
      new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.7 })
    );
    roof.position.y = h + roofH / 2;
    roof.castShadow = true;
    group.add(roof);

    // Antenna / beacon
    if (isLandmark) {
      const beacon = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 4 + rng() * 6, 6),
        new THREE.MeshStandardMaterial({ color: 0x222230, metalness: 0.8, roughness: 0.3 })
      );
      beacon.position.y = h + roofH + 2;
      group.add(beacon);

      const beaconLight = new THREE.PointLight(0xff2040, 2, 20);
      beaconLight.position.copy(beacon.position);
      beaconLight.position.y += 3;
      group.add(beaconLight);
      neonSigns.push({ light: beaconLight, phase: 0, blink: true });
    }
  }

  // Neon sign
  if (rng() > 0.35 || isLandmark) {
    const neonColor = PALETTE.neon[rng() * PALETTE.neon.length | 0];
    const word = NEON_WORDS[rng() * NEON_WORDS.length | 0];
    const colorHex = '#' + neonColor.toString(16).padStart(6, '0');
    const neonTex = makeNeonTexture(word, colorHex);
    const signW = 3 + rng() * 2;
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(signW, signW * 0.25),
      new THREE.MeshBasicMaterial({ map: neonTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    sign.position.set((rng() - 0.5) * w * 0.5, 2 + rng() * (h * 0.4), d / 2 + 0.3);
    group.add(sign);

    const neonLight = new THREE.PointLight(neonColor, 1.5, 12);
    neonLight.position.copy(sign.position);
    neonLight.position.z += 0.5;
    group.add(neonLight);
    neonSigns.push({ light: neonLight, sign, phase: rng() * Math.PI * 2, blink: rng() > 0.7 });
  }

  // Street-level shop glow
  if (rng() > 0.3) {
    const shopColor = PALETTE.neon[rng() * PALETTE.neon.length | 0];
    const shopLight = new THREE.PointLight(shopColor, 0.8, 10);
    shopLight.position.set(0, 1.5, d / 2 + 1);
    group.add(shopLight);
    neonSigns.push({ light: shopLight, phase: rng() * 6, blink: false });
  }

  cityGroup.add(group);
  return group;
}

// Generate city blocks
const halfGrid = Math.floor(GRID / 2);
for (let gx = -halfGrid; gx <= halfGrid; gx++) {
  for (let gz = -halfGrid; gz <= halfGrid; gz++) {
    if (gx === 0 && gz === 0) continue; // central plaza

    const cx = gx * (BLOCK + STREET);
    const cz = gz * (BLOCK + STREET);
    const isLandmark = Math.abs(gx) <= 1 && Math.abs(gz) <= 1 && rng() > 0.5;
    const numBuildings = isLandmark ? 1 : 1 + (rng() * 3 | 0);

    for (let b = 0; b < numBuildings; b++) {
      const ox = (rng() - 0.5) * (BLOCK - 2);
      const oz = (rng() - 0.5) * (BLOCK - 2);
      const footprint = isLandmark ? BLOCK * 0.85 : 4 + rng() * 5;
      const height = isLandmark ? 18 + rng() * 25 : 6 + rng() * 18;
      createBuilding(cx + ox, cz + oz, footprint, height, isLandmark);
    }
  }
}

// Central plaza fountain / glow
const plazaLight = new THREE.PointLight(0x6080ff, 3, 30);
plazaLight.position.set(0, 3, 0);
scene.add(plazaLight);

const plazaRing = new THREE.Mesh(
  new THREE.RingGeometry(2, 2.3, 32),
  new THREE.MeshBasicMaterial({ color: 0x4060ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
plazaRing.rotation.x = -Math.PI / 2;
plazaRing.position.y = 0.04;
scene.add(plazaRing);

scene.add(cityGroup);

// ── Distant skyline silhouettes ─────────────────────────────
const skylineGroup = new THREE.Group();
for (let i = 0; i < 40; i++) {
  const angle = (i / 40) * Math.PI * 2;
  const dist = 90 + rng() * 30;
  const sh = 20 + rng() * 50;
  const sw = 4 + rng() * 10;
  const sil = new THREE.Mesh(
    new THREE.BoxGeometry(sw, sh, sw),
    new THREE.MeshBasicMaterial({ color: 0x080812 })
  );
  sil.position.set(Math.cos(angle) * dist, sh / 2, Math.sin(angle) * dist);
  skylineGroup.add(sil);

  // Distant window dots
  if (rng() > 0.4) {
    const dotCount = 3 + (rng() * 8 | 0);
    for (let d = 0; d < dotCount; d++) {
      const dot = new THREE.Mesh(
        new THREE.PlaneGeometry(0.3, 0.4),
        new THREE.MeshBasicMaterial({
          color: rng() > 0.5 ? 0xffd080 : 0x80a0ff,
          transparent: true,
          opacity: 0.3 + rng() * 0.5,
        })
      );
      dot.position.set(
        sil.position.x + (rng() - 0.5) * sw,
        2 + rng() * (sh - 4),
        sil.position.z + sw / 2 + 0.1
      );
      dot.lookAt(0, dot.position.y, 0);
      skylineGroup.add(dot);
    }
  }
}
scene.add(skylineGroup);

// ── Street lamps ────────────────────────────────────────────
const lampGroup = new THREE.Group();
const lampPositions = [];
for (let gx = -halfGrid; gx <= halfGrid; gx++) {
  for (let gz = -halfGrid; gz <= halfGrid; gz++) {
    const cx = gx * (BLOCK + STREET);
    const cz = gz * (BLOCK + STREET);
    for (const [dx, dz] of [[-STREET / 2, 0], [STREET / 2, 0], [0, -STREET / 2], [0, STREET / 2]]) {
      if (rng() > 0.6) continue;
      const lx = cx + dx + (rng() - 0.5) * 2;
      const lz = cz + dz + (rng() - 0.5) * 2;

      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.08, 4, 6),
        new THREE.MeshStandardMaterial({ color: 0x1a1a24, metalness: 0.6, roughness: 0.4 })
      );
      pole.position.set(lx, 2, lz);
      pole.castShadow = true;
      lampGroup.add(pole);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.15, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x222230, emissive: 0xffcc66, emissiveIntensity: 0.5 })
      );
      head.position.set(lx, 4, lz);
      lampGroup.add(head);

      const lampLight = new THREE.PointLight(0xffaa55, 0.6, 14);
      lampLight.position.set(lx, 3.8, lz);
      lampGroup.add(lampLight);
      lampPositions.push(lx, lz);
    }
  }
}
scene.add(lampGroup);

// ── Traffic (moving light trails) ───────────────────────────
const trafficGroup = new THREE.Group();
const trafficCars = [];
const TRAFFIC_COUNT = 48;

for (let i = 0; i < TRAFFIC_COUNT; i++) {
  const horizontal = rng() > 0.5;
  const lane = (rng() > 0.5 ? 1 : -1) * (STREET * 0.22);
  const row = ((rng() * GRID * 2 | 0) - GRID) * (BLOCK + STREET);
  const speed = 8 + rng() * 18;
  const dir = rng() > 0.5 ? 1 : -1;
  const isHeadlight = rng() > 0.5;

  const car = new THREE.Group();
  const bodyColor = isHeadlight ? 0xffffee : 0xff3030;
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 6, 6),
    new THREE.MeshBasicMaterial({ color: bodyColor })
  );
  car.add(glow);

  const tail = new THREE.PointLight(bodyColor, isHeadlight ? 1.2 : 0.8, 8);
  car.add(tail);

  car.userData = {
    horizontal,
    lane,
    row,
    speed: speed * dir,
    offset: rng() * GROUND_SIZE,
    isHeadlight,
  };

  trafficGroup.add(car);
  trafficCars.push(car);
}
scene.add(trafficGroup);

// ── Rain particles ──────────────────────────────────────────
const RAIN_COUNT = 3000;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_COUNT * 3);
const rainVel = new Float32Array(RAIN_COUNT);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainPos[i * 3] = (rng() - 0.5) * GROUND_SIZE;
  rainPos[i * 3 + 1] = rng() * 40;
  rainPos[i * 3 + 2] = (rng() - 0.5) * GROUND_SIZE;
  rainVel[i] = 12 + rng() * 18;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({
  color: 0x8090b0,
  size: 0.08,
  transparent: true,
  opacity: 0.35,
  depthWrite: false,
});
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

// ── Stars ───────────────────────────────────────────────────
const STAR_COUNT = 800;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  const theta = rng() * Math.PI * 2;
  const phi = rng() * Math.PI * 0.35;
  const r = 180;
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = r * Math.cos(phi);
  starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xc0c8e0, size: 0.6, transparent: true, opacity: 0.6, sizeAttenuation: true,
}));
scene.add(stars);

// ── Camera path ─────────────────────────────────────────────
const camPoints = [
  new THREE.Vector3(50, 18, 50),
  new THREE.Vector3(30, 12, 20),
  new THREE.Vector3(10, 6, 8),
  new THREE.Vector3(-5, 4, -10),
  new THREE.Vector3(-25, 8, -5),
  new THREE.Vector3(-40, 14, 15),
  new THREE.Vector3(-20, 20, 40),
  new THREE.Vector3(10, 25, 45),
  new THREE.Vector3(45, 16, 25),
  new THREE.Vector3(55, 22, -10),
  new THREE.Vector3(50, 18, 50),
];
const camCurve = new THREE.CatmullRomCurve3(camPoints, true, 'catmullrom', 0.4);
const lookTarget = new THREE.Vector3(0, 6, 0);

// ── Post-processing ─────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55, 0.5, 0.82
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ── Animation ───────────────────────────────────────────────
const clock = new THREE.Clock();
let camT = 0;

function updateTraffic(dt) {
  for (const car of trafficCars) {
    const ud = car.userData;
    ud.offset += ud.speed * dt;

    if (ud.horizontal) {
      let x = ((ud.offset % GROUND_SIZE) + GROUND_SIZE) % GROUND_SIZE - GROUND_SIZE / 2;
      car.position.set(x, 0.6, ud.row + ud.lane);
      car.rotation.y = ud.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
    } else {
      let z = ((ud.offset % GROUND_SIZE) + GROUND_SIZE) % GROUND_SIZE - GROUND_SIZE / 2;
      car.position.set(ud.row + ud.lane, 0.6, z);
      car.rotation.y = ud.speed > 0 ? 0 : Math.PI;
    }
  }
}

function updateRain(dt) {
  const pos = rainGeo.attributes.position.array;
  for (let i = 0; i < RAIN_COUNT; i++) {
    pos[i * 3 + 1] -= rainVel[i] * dt;
    if (pos[i * 3 + 1] < 0) {
      pos[i * 3 + 1] = 30 + rng() * 10;
      pos[i * 3] = camera.position.x + (rng() - 0.5) * 80;
      pos[i * 3 + 2] = camera.position.z + (rng() - 0.5) * 80;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function updateWindows(t) {
  for (const w of windowMeshes) {
    const flicker = 0.7 + 0.3 * Math.sin(t * w.speed + w.phase);
    w.mesh.material.emissiveIntensity = flicker * (0.6 + 0.2 * Math.sin(t * 0.7 + w.phase * 2));
  }
}

function updateNeon(t) {
  for (const n of neonSigns) {
    if (n.blink) {
      const on = Math.sin(t * 3 + n.phase) > 0.2;
      n.light.intensity = on ? (n.light === plazaLight ? 3 : 1.5) : 0.05;
      if (n.sign) n.sign.visible = on;
    } else {
      n.light.intensity = 0.6 + 0.4 * Math.sin(t * 1.5 + n.phase);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  camT = (camT + dt * 0.012) % 1;
  const camPos = camCurve.getPointAt(camT);
  const camAhead = camCurve.getPointAt((camT + 0.02) % 1);
  camera.position.lerp(camPos, 0.06);
  lookTarget.lerp(new THREE.Vector3(camAhead.x * 0.3, 5 + Math.sin(t * 0.3) * 2, camAhead.z * 0.3), 0.04);
  camera.lookAt(lookTarget);

  updateTraffic(dt);
  updateRain(dt);
  updateWindows(t);
  updateNeon(t);

  // Subtle wet plane shimmer
  wetMat.opacity = 0.28 + 0.08 * Math.sin(t * 0.8);

  // Plaza pulse
  plazaRing.material.opacity = 0.35 + 0.2 * Math.sin(t * 2);
  plazaLight.intensity = 2.5 + Math.sin(t * 1.5) * 0.8;

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Hide loading screen
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 600);

animate();
</script>
</body>
</html>
