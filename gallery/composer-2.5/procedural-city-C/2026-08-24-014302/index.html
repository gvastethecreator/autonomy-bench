<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City — Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 100%, transparent 40%, rgba(0,0,20,0.5) 100%);
    mix-blend-mode: multiply; z-index: 2;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.65) 100%);
    z-index: 3;
  }
  #title {
    position: fixed; bottom: 2rem; left: 2rem; z-index: 4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: rgba(255,255,255,0.35); font-size: 0.7rem;
    letter-spacing: 0.35em; text-transform: uppercase;
    animation: fadeTitle 4s ease-out forwards;
  }
  @keyframes fadeTitle {
    0% { opacity: 0; transform: translateY(8px); }
    30% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0.6; }
  }
  #film-grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grain 0.5s steps(2) infinite;
  }
  @keyframes grain {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(-2%, -1%); }
  }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="vignette"></div>
<div id="film-grain"></div>
<div id="title">Nocturne District</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ─── Seeded RNG ───────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xC17A42);

// ─── Palette ──────────────────────────────────────────────────
const PAL = {
  skyTop: 0x040818,
  skyHorizon: 0x1a1035,
  fog: 0x0a0820,
  street: 0x0c0c14,
  neon: [0xff2d6a, 0x00f0ff, 0xffe066, 0x7b5cff, 0x39ff8a, 0xff6b35],
  windowWarm: 0xffd080,
  windowCool: 0x88ccff,
  headlight: 0xfff8e0,
  taillight: 0xff2244,
};

// ─── Scene setup ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.skyTop);
scene.fog = new THREE.FogExp2(PAL.fog, 0.012);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 500);
camera.position.set(0, 18, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ─── Post-processing ──────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.5, 0.15);
composer.addPass(bloom);

const colorGradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec3 col = c.rgb;
      col = pow(col, vec3(1.05));
      col.r *= 1.02; col.b *= 0.92;
      float vig = 1.0 - dot(vUv - 0.5, vUv - 0.5) * 1.6;
      col *= vig;
      gl_FragColor = vec4(col, c.a);
    }
  `
};
const colorGrade = new ShaderPass(colorGradeShader);
composer.addPass(colorGrade);

// ─── Lights ───────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a1840, 0.35));

const moonLight = new THREE.DirectionalLight(0x8899cc, 0.25);
moonLight.position.set(-40, 80, -30);
scene.add(moonLight);

const cityGlow = new THREE.HemisphereLight(0x334466, 0x110822, 0.4);
scene.add(cityGlow);

// ─── Sky dome with stars ──────────────────────────────────────
(function buildSky() {
  const starCount = 1200;
  const pos = new Float32Array(starCount * 3);
  const sizes = new Float32Array(starCount);
  for (let i = 0; i < starCount; i++) {
    const theta = rng() * Math.PI * 2;
    const phi = rng() * Math.PI * 0.45;
    const r = 180 + rng() * 40;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi) + 20;
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    sizes[i] = rng() * 1.5 + 0.3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size;
      varying float vAlpha;
      uniform float uTime;
      void main() {
        vAlpha = 0.4 + 0.6 * sin(uTime * 1.5 + position.x * 0.1 + position.z * 0.07);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (200.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.1, d) * vAlpha;
        gl_FragColor = vec4(0.9, 0.95, 1.0, a);
      }
    `
  });
  const stars = new THREE.Points(geo, mat);
  stars.userData.isStars = true;
  scene.add(stars);
})();

// ─── Ground & streets ─────────────────────────────────────────
const GRID = 14;
const BLOCK = 8;
const STREET_W = 2.2;
const CITY = GRID * BLOCK;

const groundGeo = new THREE.PlaneGeometry(CITY * 2.5, CITY * 2.5);
const groundMat = new THREE.MeshStandardMaterial({
  color: PAL.street, roughness: 0.15, metalness: 0.6,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// Wet reflection plane
const wetGeo = new THREE.PlaneGeometry(CITY * 2, CITY * 2, 1, 1);
const wetMat = new THREE.MeshStandardMaterial({
  color: 0x080810, roughness: 0.05, metalness: 0.95,
  transparent: true, opacity: 0.35,
});
const wet = new THREE.Mesh(wetGeo, wetMat);
wet.rotation.x = -Math.PI / 2;
wet.position.y = 0.02;
scene.add(wet);

// Street grid lines (emissive strips)
const streetLights = [];
function addStreetLine(x1, z1, x2, z2) {
  const len = Math.hypot(x2 - x1, z2 - z1);
  const geo = new THREE.PlaneGeometry(len, 0.08);
  const mat = new THREE.MeshBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set((x1+x2)/2, 0.03, (z1+z2)/2);
  mesh.rotation.z = -Math.atan2(z2-z1, x2-x1);
  scene.add(mesh);
}

for (let i = -GRID; i <= GRID; i++) {
  const p = i * BLOCK;
  addStreetLine(-CITY, p, CITY, p);
  addStreetLine(p, -CITY, p, CITY);
}

// ─── Building generation ──────────────────────────────────────
const buildings = [];
const windowLights = [];
const neonSigns = [];
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);

function createWindowTexture(w, h, seed) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, w, h);
  const cols = Math.floor(w / 8);
  const rows = Math.floor(h / 12);
  const r = mulberry32(seed);
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      if (r() > 0.55) {
        const lit = r() > 0.3;
        const warm = r() > 0.4;
        ctx.fillStyle = lit ? (warm ? '#ffd080' : '#6699cc') : '#111118';
        const wx = col * 8 + 2, wy = row * 12 + 3;
        ctx.fillRect(wx, wy, 4, 7);
        if (lit) {
          windowLights.push({
            x: wx / w, y: wy / h, w: 4/w, h: 7/h,
            phase: r() * Math.PI * 2,
            speed: 0.5 + r() * 2,
            warm,
            canvas: c, ctx, seed
          });
        }
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function buildBuilding(bx, bz, gw, gd, floors) {
  const height = floors * 2.8 + rng() * 4;
  const style = Math.floor(rng() * 4);
  const geo = new THREE.BoxGeometry(gw, height, gd);
  
  let mat;
  const seed = Math.floor(rng() * 99999);
  if (style === 0 || style === 1) {
    const tex = createWindowTexture(64, Math.min(256, Math.floor(height * 8)), seed);
    tex.repeat.set(gw * 0.5, height * 0.35);
    mat = new THREE.MeshStandardMaterial({
      map: tex, roughness: 0.7, metalness: 0.2,
      color: style === 0 ? 0x1a1a28 : 0x222230,
    });
  } else {
    mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.65 + rng()*0.1, 0.15, 0.12 + rng()*0.08),
      roughness: 0.5, metalness: 0.35,
    });
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(bx, height / 2, bz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  buildingGroup.add(mesh);
  buildings.push({ mesh, height, bx, bz, seed, mat, style });

  // Roof details
  if (rng() > 0.5 && height > 15) {
    const antennaH = 2 + rng() * 6;
    const antGeo = new THREE.CylinderGeometry(0.05, 0.08, antennaH, 6);
    const antMat = new THREE.MeshStandardMaterial({ color: 0x333340, metalness: 0.8, roughness: 0.3 });
    const ant = new THREE.Mesh(antGeo, antMat);
    ant.position.set(bx + (rng()-0.5)*2, height + antennaH/2, bz + (rng()-0.5)*2);
    buildingGroup.add(ant);
    if (rng() > 0.6) {
      const blink = new THREE.PointLight(0xff0000, 0.8, 8);
      blink.position.copy(ant.position);
      blink.position.y += antennaH/2;
      blink.userData.blink = true;
      blink.userData.phase = rng() * Math.PI * 2;
      scene.add(blink);
      streetLights.push(blink);
    }
  }

  // Neon sign on some buildings
  if (rng() > 0.65 && height > 8) {
    const neonColor = PAL.neon[Math.floor(rng() * PAL.neon.length)];
    const signW = 1.5 + rng() * 2;
    const signGeo = new THREE.PlaneGeometry(signW, 0.6);
    const signMat = new THREE.MeshBasicMaterial({
      color: neonColor, transparent: true, opacity: 0.9,
      side: THREE.DoubleSide,
    });
    const sign = new THREE.Mesh(signGeo, signMat);
    const side = Math.floor(rng() * 4);
    const offset = 0.05;
    sign.position.set(bx, 3 + rng() * Math.min(height * 0.4, 12), bz);
    if (side === 0) { sign.position.x = bx + gw/2 + offset; sign.rotation.y = Math.PI/2; }
    else if (side === 1) { sign.position.x = bx - gw/2 - offset; sign.rotation.y = -Math.PI/2; }
    else if (side === 2) { sign.position.z = bz + gd/2 + offset; }
    else { sign.position.z = bz - gd/2 - offset; sign.rotation.y = Math.PI; }
    buildingGroup.add(sign);

    const glow = new THREE.PointLight(neonColor, 1.2, 12);
    glow.position.copy(sign.position);
    glow.position.y -= 0.5;
    scene.add(glow);
    neonSigns.push({ sign, glow, color: neonColor, phase: rng() * Math.PI * 2, speed: 1 + rng() * 2 });
  }

  // Ground floor shop glow
  if (rng() > 0.4) {
    const shopColor = PAL.neon[Math.floor(rng() * PAL.neon.length)];
    const shopLight = new THREE.PointLight(shopColor, 0.6, 10);
    shopLight.position.set(bx, 2, bz + gd/2 + 0.5);
    scene.add(shopLight);
    neonSigns.push({ glow: shopLight, color: shopColor, phase: rng() * 6, speed: 0.8, shop: true });
  }
}

// Place buildings on grid cells
const halfCity = (GRID * BLOCK) / 2;
for (let gx = -GRID/2; gx < GRID/2; gx++) {
  for (let gz = -GRID/2; gz < GRID/2; gz++) {
    if (Math.abs(gx) < 1 && Math.abs(gz) < 1) continue; // central plaza
    const cx = gx * BLOCK + (rng()-0.5) * 1.5;
    const cz = gz * BLOCK + (rng()-0.5) * 1.5;
    const dist = Math.hypot(cx, cz);
    const maxFloors = dist < 20 ? 18 + rng()*12 : dist < 40 ? 8 + rng()*10 : 3 + rng()*6;
    const floors = Math.floor(maxFloors);
    const bw = BLOCK - STREET_W - 0.5 + rng() * 0.8;
    const bd = BLOCK - STREET_W - 0.5 + rng() * 0.8;
    buildBuilding(cx, cz, bw, bd, floors);
  }
}

// Central plaza fountain / landmark
(function buildLandmark() {
  const baseGeo = new THREE.CylinderGeometry(3, 3.5, 1.5, 32);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a1a30, metalness: 0.5, roughness: 0.4 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.set(0, 0.75, 0);
  buildingGroup.add(base);

  const spireGeo = new THREE.ConeGeometry(0.8, 12, 8);
  const spireMat = new THREE.MeshStandardMaterial({
    color: 0x8899bb, metalness: 0.9, roughness: 0.15, emissive: 0x223355, emissiveIntensity: 0.3
  });
  const spire = new THREE.Mesh(spireGeo, spireMat);
  spire.position.set(0, 7.5, 0);
  buildingGroup.add(spire);

  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2 + i * 0.8, 0.06, 8, 32),
      new THREE.MeshBasicMaterial({ color: PAL.neon[i], transparent: true, opacity: 0.8 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 2 + i * 1.5;
    ring.userData.landmarkRing = i;
    buildingGroup.add(ring);
    neonSigns.push({
      sign: ring, glow: null, color: PAL.neon[i],
      phase: i * 2, speed: 0.5 + i * 0.3, landmark: true
    });
  }

  const landmarkLight = new THREE.PointLight(0x6688ff, 2, 25);
  landmarkLight.position.set(0, 8, 0);
  scene.add(landmarkLight);
  neonSigns.push({ glow: landmarkLight, color: 0x6688ff, phase: 0, speed: 1, landmark: true });
})();

// ─── Traffic lights ───────────────────────────────────────────
const trafficLights = [];
function addTrafficLight(x, z) {
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.08, 3, 6),
    new THREE.MeshStandardMaterial({ color: 0x222228, metalness: 0.6, roughness: 0.4 })
  );
  pole.position.set(x, 1.5, z);
  buildingGroup.add(pole);

  const colors = [0xff0000, 0xffff00, 0x00ff00];
  const lights = colors.map((c, i) => {
    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0x111111 })
    );
    bulb.position.set(x + 0.3, 2.8 - i * 0.35, z);
    buildingGroup.add(bulb);
    const pl = new THREE.PointLight(c, 0, 4);
    pl.position.copy(bulb.position);
    scene.add(pl);
    return { bulb, pl, color: c };
  });
  trafficLights.push({ lights, timer: rng() * 10, state: Math.floor(rng() * 3) });
}

for (let i = -3; i <= 3; i++) {
  if (i === 0) continue;
  addTrafficLight(i * BLOCK * 0.5, 0);
  addTrafficLight(0, i * BLOCK * 0.5);
}

// ─── Cars ─────────────────────────────────────────────────────
const cars = [];
const CAR_COUNT = 28;

function createCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.5, 0.9),
    new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.7 })
  );
  body.position.y = 0.35;
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.35, 0.75),
    new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.7 })
  );
  cabin.position.set(-0.1, 0.65, 0);
  g.add(cabin);

  const headL = new THREE.PointLight(PAL.headlight, 1.5, 8);
  headL.position.set(0.95, 0.35, 0.25);
  g.add(headL);
  const headR = headL.clone();
  headR.position.z = -0.25;
  g.add(headR);

  const tailL = new THREE.PointLight(PAL.taillight, 0.6, 4);
  tailL.position.set(-0.95, 0.35, 0.25);
  g.add(tailL);
  const tailR = tailL.clone();
  tailR.position.z = -0.25;
  g.add(tailR);

  g.userData.headlights = [headL, headR];
  return g;
}

const carColors = [0xcc2222, 0xeeeeee, 0x222233, 0x2244aa, 0x333333, 0x886644];
for (let i = 0; i < CAR_COUNT; i++) {
  const car = createCar(carColors[Math.floor(rng() * carColors.length)]);
  const lane = Math.floor(rng() * 4);
  const horizontal = lane < 2;
  const dir = rng() > 0.5 ? 1 : -1;
  const laneOffset = (lane % 2 === 0 ? 1 : -1) * (STREET_W * 0.25);
  const speed = 8 + rng() * 14;

  car.userData = {
    horizontal, dir, speed, laneOffset,
    pos: horizontal ? (rng() - 0.5) * CITY * 1.8 : laneOffset * BLOCK * 0.3,
    axis: horizontal ? 'x' : 'z',
    line: horizontal ? laneOffset * BLOCK * 0.15 : (rng()-0.5) * CITY * 1.8,
  };

  if (horizontal) {
    car.position.set(car.userData.pos, 0, car.userData.line);
    car.rotation.y = dir > 0 ? Math.PI/2 : -Math.PI/2;
  } else {
    car.position.set(car.userData.line, 0, car.userData.pos);
    car.rotation.y = dir > 0 ? 0 : Math.PI;
  }

  scene.add(car);
  cars.push(car);
}

// ─── Particles (rain + distant dust) ──────────────────────────
const rainCount = 4000;
const rainPos = new Float32Array(rainCount * 3);
const rainVel = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
  rainPos[i*3]   = (rng()-0.5) * CITY * 1.5;
  rainPos[i*3+1] = rng() * 60;
  rainPos[i*3+2] = (rng()-0.5) * CITY * 1.5;
  rainVel[i] = 15 + rng() * 20;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({
  color: 0x8899bb, size: 0.08, transparent: true, opacity: 0.35, sizeAttenuation: true
});
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

// ─── Distant smoke plumes ─────────────────────────────────────
const smokeGroup = new THREE.Group();
for (let i = 0; i < 5; i++) {
  const sx = (rng()-0.5) * CITY * 0.8;
  const sz = (rng()-0.5) * CITY * 0.8;
  const stack = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.5, 20 + rng()*15, 8),
    new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.8 })
  );
  stack.position.set(sx, 10, sz);
  smokeGroup.add(stack);
}
scene.add(smokeGroup);

// ─── Camera path ──────────────────────────────────────────────
const camPath = [];
const PATH_POINTS = 120;
for (let i = 0; i < PATH_POINTS; i++) {
  const t = i / PATH_POINTS;
  const angle = t * Math.PI * 2 * 1.5;
  const radius = 35 + Math.sin(t * Math.PI * 4) * 12;
  camPath.push({
    x: Math.sin(angle) * radius,
    y: 12 + Math.sin(t * Math.PI * 6) * 6 + Math.cos(t * Math.PI * 2) * 4,
    z: Math.cos(angle) * radius,
    lookX: Math.sin(angle + 0.3) * 8,
    lookZ: Math.cos(angle + 0.3) * 8,
  });
}

// ─── Intro transition ─────────────────────────────────────────
let introT = 0;
const INTRO_DUR = 3.5;

// ─── Animation loop ───────────────────────────────────────────
const clock = new THREE.Clock();
let elapsed = 0;

function updateTrafficLights(dt) {
  trafficLights.forEach(tl => {
    tl.timer += dt;
    const cycle = 8;
    const phase = (tl.timer % cycle) / cycle;
    let active = 0;
    if (phase < 0.4) active = 2;
    else if (phase < 0.45) active = 1;
    else if (phase < 0.5) active = 0;
    else if (phase < 0.9) active = 0;
    else if (phase < 0.95) active = 1;
    else active = 2;

    tl.lights.forEach((l, i) => {
      const on = i === active;
      l.bulb.material.color.setHex(on ? l.color : 0x111111);
      l.pl.intensity = on ? (i === 1 ? 0.3 : 0.8) : 0;
    });
  });
}

function updateCars(dt) {
  const limit = CITY * 0.9;
  cars.forEach(car => {
    const d = car.userData;
    d.pos += d.speed * d.dir * dt;
    if (d.pos > limit) d.pos = -limit;
    if (d.pos < -limit) d.pos = limit;

    if (d.horizontal) {
      car.position.x = d.pos;
      car.position.z = d.line;
    } else {
      car.position.z = d.pos;
      car.position.x = d.line;
    }
  });
}

function updateRain(dt) {
  const pos = rainGeo.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    pos[i*3+1] -= rainVel[i] * dt;
    if (pos[i*3+1] < 0) {
      pos[i*3+1] = 50 + rng() * 10;
      pos[i*3]   = camera.position.x + (rng()-0.5) * 80;
      pos[i*3+2] = camera.position.z + (rng()-0.5) * 80;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function updateNeon(time) {
  neonSigns.forEach(n => {
    const pulse = 0.6 + 0.4 * Math.sin(time * n.speed + n.phase);
    if (n.sign && n.sign.material) {
      n.sign.material.opacity = n.landmark ? 0.5 + pulse * 0.5 : 0.4 + pulse * 0.5;
      if (n.landmark && n.sign.geometry.type === 'TorusGeometry') {
        n.sign.rotation.z = time * 0.2 * (n.phase + 1);
      }
    }
    if (n.glow) {
      n.glow.intensity = (n.shop ? 0.4 : n.landmark ? 1.5 : 0.8) * pulse;
    }
  });

  streetLights.forEach(l => {
    if (l.userData.blink) {
      l.intensity = Math.sin(time * 3 + l.userData.phase) > 0.7 ? 0.8 : 0.05;
    }
  });
}

function updateCamera(time, dt) {
  introT = Math.min(introT + dt, INTRO_DUR);
  const introEase = 1 - Math.pow(1 - introT / INTRO_DUR, 3);

  const pathT = (time * 0.025) % 1;
  const idx = Math.floor(pathT * (PATH_POINTS - 1));
  const frac = (pathT * (PATH_POINTS - 1)) - idx;
  const a = camPath[idx];
  const b = camPath[(idx + 1) % PATH_POINTS];

  const tx = THREE.MathUtils.lerp(a.x, b.x, frac);
  const ty = THREE.MathUtils.lerp(a.y, b.y, frac);
  const tz = THREE.MathUtils.lerp(a.z, b.z, frac);
  const lx = THREE.MathUtils.lerp(a.lookX, b.lookX, frac);
  const lz = THREE.MathUtils.lerp(a.lookZ, b.lookZ, frac);

  const startY = 55, startZ = 80;
  camera.position.x = THREE.MathUtils.lerp(0, tx, introEase);
  camera.position.y = THREE.MathUtils.lerp(startY, ty, introEase);
  camera.position.z = THREE.MathUtils.lerp(startZ, tz, introEase);

  const lookY = THREE.MathUtils.lerp(20, 8, introEase);
  camera.lookAt(
    THREE.MathUtils.lerp(0, lx, introEase),
    lookY,
    THREE.MathUtils.lerp(0, lz, introEase)
  );

  // Subtle handheld drift
  camera.position.x += Math.sin(time * 0.7) * 0.15;
  camera.position.y += Math.cos(time * 0.5) * 0.08;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateTrafficLights(dt);
  updateCars(dt);
  updateRain(dt);
  updateNeon(elapsed);
  updateCamera(elapsed, dt);

  scene.children.forEach(c => {
    if (c.userData.isStars && c.material.uniforms) {
      c.material.uniforms.uTime.value = elapsed;
    }
  });

  colorGradeShader.uniforms.uTime.value = elapsed;
  composer.render();
}

// ─── Resize ───────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
