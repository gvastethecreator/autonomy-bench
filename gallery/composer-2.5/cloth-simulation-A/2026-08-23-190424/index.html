<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloth Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0e17;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #c8d6e5;
    }
    canvas { display: block; }
    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid rgba(100, 180, 255, 0.25);
      border-radius: 10px;
      padding: 14px 18px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.6;
      max-width: 260px;
      user-select: none;
      z-index: 10;
    }
    #ui h1 {
      font-size: 15px;
      font-weight: 600;
      color: #64b4ff;
      margin-bottom: 8px;
    }
    #ui label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
    }
    #ui input[type="range"] {
      flex: 1;
      accent-color: #64b4ff;
    }
    #ui .val { color: #64b4ff; min-width: 32px; text-align: right; }
    #ui p { opacity: 0.7; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Cloth Simulation</h1>
    <label>
      Wind
      <input type="range" id="wind" min="0" max="100" value="30">
      <span class="val" id="windVal">0.30</span>
    </label>
    <label>
      Gravity
      <input type="range" id="gravity" min="0" max="100" value="50">
      <span class="val" id="gravityVal">0.50</span>
    </label>
    <label>
      <input type="checkbox" id="pinCorners" checked> Pin top corners
    </label>
    <p>Drag cloth to interact · Scroll to zoom</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Physics constants ──
    const SEGS_X = 32;
    const SEGS_Y = 24;
    const CLOTH_W = 4;
    const CLOTH_H = 3;
    const ITERATIONS = 6;
    const DAMPING = 0.99;
    const TIMESTEP = 1 / 60;

    let windStrength = 0.3;
    let gravityStrength = 0.5;
    let pinTopCorners = true;

    // ── Scene setup ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);
    scene.fog = new THREE.Fog(0x0a0e17, 8, 22);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.2, 0);
    controls.maxPolarAngle = Math.PI * 0.85;

    // ── Lights ──
    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(5, 8, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 20;
    sun.shadow.camera.left = -6;
    sun.shadow.camera.right = 6;
    sun.shadow.camera.top = 6;
    sun.shadow.camera.bottom = -6;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x6080ff, 0.3);
    fill.position.set(-4, 2, -3);
    scene.add(fill);

    // ── Ground & sphere obstacle ──
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x1a2233,
      roughness: 0.9,
      metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(20, 40, 0x2a3a55, 0x1a2535);
    grid.position.y = 0.001;
    scene.add(grid);

    const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0xff6b6b,
      roughness: 0.4,
      metalness: 0.3
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.set(0, 0.6, 0.3);
    sphere.castShadow = true;
    sphere.receiveShadow = true;
    scene.add(sphere);

    // ── Cloth particle system ──
    const numParticles = (SEGS_X + 1) * (SEGS_Y + 1);
    const positions = new Float32Array(numParticles * 3);
    const prevPositions = new Float32Array(numParticles * 3);
    const accelerations = new Float32Array(numParticles * 3);
    const pinned = new Uint8Array(numParticles);
    const invMass = new Float32Array(numParticles);

    function idx(x, y) { return y * (SEGS_X + 1) + x; }

    function initCloth() {
      for (let y = 0; y <= SEGS_Y; y++) {
        for (let x = 0; x <= SEGS_X; x++) {
          const i = idx(x, y);
          const px = (x / SEGS_X - 0.5) * CLOTH_W;
          const py = 3.5 - (y / SEGS_Y) * CLOTH_H;
          const pz = 0;
          positions[i * 3] = px;
          positions[i * 3 + 1] = py;
          positions[i * 3 + 2] = pz;
          prevPositions[i * 3] = px;
          prevPositions[i * 3 + 1] = py;
          prevPositions[i * 3 + 2] = pz;
          invMass[i] = 1;
          pinned[i] = 0;
        }
      }
      updatePins();
    }

    function updatePins() {
      for (let i = 0; i < numParticles; i++) pinned[i] = 0;
      if (pinTopCorners) {
        pinned[idx(0, 0)] = 1;
        pinned[idx(SEGS_X, 0)] = 1;
      }
    }

    // ── Constraints (springs) ──
    const constraints = [];

    function addConstraint(a, b, rest, stiffness) {
      constraints.push({ a, b, rest, stiffness });
    }

    function buildConstraints() {
      constraints.length = 0;
      const dx = CLOTH_W / SEGS_X;
      const dy = CLOTH_H / SEGS_Y;
      const diag = Math.sqrt(dx * dx + dy * dy);

      for (let y = 0; y <= SEGS_Y; y++) {
        for (let x = 0; x <= SEGS_X; x++) {
          const i = idx(x, y);
          if (x < SEGS_X) addConstraint(i, idx(x + 1, y), dx, 0.95);
          if (y < SEGS_Y) addConstraint(i, idx(x, y + 1), dy, 0.95);
          if (x < SEGS_X && y < SEGS_Y) addConstraint(i, idx(x + 1, y + 1), diag, 0.7);
          if (x > 0 && y < SEGS_Y) addConstraint(i, idx(x - 1, y + 1), diag, 0.7);
          // bending (skip one)
          if (x < SEGS_X - 1) addConstraint(i, idx(x + 2, y), dx * 2, 0.3);
          if (y < SEGS_Y - 1) addConstraint(i, idx(x, y + 2), dy * 2, 0.3);
        }
      }
    }

    initCloth();
    buildConstraints();

    // ── Cloth mesh ──
    const clothGeo = new THREE.PlaneGeometry(CLOTH_W, CLOTH_H, SEGS_X, SEGS_Y);
    clothGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    clothGeo.computeVertexNormals();

    const clothMat = new THREE.MeshStandardMaterial({
      color: 0x4ecdc4,
      side: THREE.DoubleSide,
      roughness: 0.65,
      metalness: 0.05,
      flatShading: false
    });
    const clothMesh = new THREE.Mesh(clothGeo, clothMat);
    clothMesh.castShadow = true;
    clothMesh.receiveShadow = true;
    scene.add(clothMesh);

    // Wireframe overlay
    const wireGeo = new THREE.WireframeGeometry(clothGeo);
    const wireMat = new THREE.LineBasicMaterial({ color: 0x2a8a82, transparent: true, opacity: 0.15 });
    const wireMesh = new THREE.LineSegments(wireGeo, wireMat);
    clothMesh.add(wireMesh);

    // ── Physics helpers ──
    function getPos(i, out) {
      out[0] = positions[i * 3];
      out[1] = positions[i * 3 + 1];
      out[2] = positions[i * 3 + 2];
    }

    function setPos(i, x, y, z) {
      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;
    }

    const tmpA = [0, 0, 0];
    const tmpB = [0, 0, 0];
    const tmpDiff = [0, 0, 0];
    let time = 0;

    function applyForces() {
      accelerations.fill(0);
      time += TIMESTEP;

      for (let i = 0; i < numParticles; i++) {
        if (pinned[i]) continue;
        accelerations[i * 3 + 1] -= gravityStrength * 9.8 * TIMESTEP;

        // Wind with turbulence
        const wx = Math.sin(time * 2.1 + positions[i * 3] * 1.5) * 0.5 +
                   Math.sin(time * 0.7 + positions[i * 3 + 1]) * 0.3;
        const wz = Math.cos(time * 1.8 + positions[i * 3 + 2] * 2) * 0.4;
        accelerations[i * 3] += wx * windStrength * 2;
        accelerations[i * 3 + 2] += wz * windStrength * 2;
      }
    }

    function integrate() {
      for (let i = 0; i < numParticles; i++) {
        if (pinned[i]) continue;

        const px = prevPositions[i * 3];
        const py = prevPositions[i * 3 + 1];
        const pz = prevPositions[i * 3 + 2];

        let x = positions[i * 3];
        let y = positions[i * 3 + 1];
        let z = positions[i * 3 + 2];

        const vx = (x - px) * DAMPING;
        const vy = (y - py) * DAMPING;
        const vz = (z - pz) * DAMPING;

        prevPositions[i * 3] = x;
        prevPositions[i * 3 + 1] = y;
        prevPositions[i * 3 + 2] = z;

        x += vx + accelerations[i * 3];
        y += vy + accelerations[i * 3 + 1];
        z += vz + accelerations[i * 3 + 2];

        setPos(i, x, y, z);
      }
    }

    function satisfyConstraints() {
      for (let iter = 0; iter < ITERATIONS; iter++) {
        for (const c of constraints) {
          getPos(c.a, tmpA);
          getPos(c.b, tmpB);

          tmpDiff[0] = tmpB[0] - tmpA[0];
          tmpDiff[1] = tmpB[1] - tmpA[1];
          tmpDiff[2] = tmpB[2] - tmpA[2];

          const dist = Math.sqrt(tmpDiff[0] ** 2 + tmpDiff[1] ** 2 + tmpDiff[2] ** 2);
          if (dist < 1e-6) continue;

          const diff = (dist - c.rest) / dist * c.stiffness;
          const wA = pinned[c.a] ? 0 : invMass[c.a];
          const wB = pinned[c.b] ? 0 : invMass[c.b];
          const wSum = wA + wB;
          if (wSum === 0) continue;

          const corrX = tmpDiff[0] * diff;
          const corrY = tmpDiff[1] * diff;
          const corrZ = tmpDiff[2] * diff;

          if (!pinned[c.a]) {
            setPos(c.a,
              tmpA[0] + corrX * (wA / wSum),
              tmpA[1] + corrY * (wA / wSum),
              tmpA[2] + corrZ * (wA / wSum)
            );
          }
          if (!pinned[c.b]) {
            setPos(c.b,
              tmpB[0] - corrX * (wB / wSum),
              tmpB[1] - corrY * (wB / wSum),
              tmpB[2] - corrZ * (wB / wSum)
            );
          }
        }
      }
    }

    function collideSphere() {
      const sr = 0.6;
      const sx = sphere.position.x;
      const sy = sphere.position.y;
      const sz = sphere.position.z;

      for (let i = 0; i < numParticles; i++) {
        if (pinned[i]) continue;
        let x = positions[i * 3];
        let y = positions[i * 3 + 1];
        let z = positions[i * 3 + 2];

        const dx = x - sx;
        const dy = y - sy;
        const dz = z - sz;
        const distSq = dx * dx + dy * dy + dz * dz;

        if (distSq < sr * sr) {
          const dist = Math.sqrt(distSq) || 0.001;
          const pen = sr - dist;
          x += (dx / dist) * pen;
          y += (dy / dist) * pen;
          z += (dz / dist) * pen;
          setPos(i, x, y, z);
        }
      }
    }

    function collideFloor() {
      for (let i = 0; i < numParticles; i++) {
        if (pinned[i]) continue;
        if (positions[i * 3 + 1] < 0.01) {
          positions[i * 3 + 1] = 0.01;
          const vy = positions[i * 3 + 1] - prevPositions[i * 3 + 1];
          prevPositions[i * 3 + 1] = positions[i * 3 + 1] + vy * 0.3;
        }
      }
    }

    function simulate() {
      applyForces();
      integrate();
      satisfyConstraints();
      collideSphere();
      collideFloor();
      clothGeo.attributes.position.needsUpdate = true;
      clothGeo.computeVertexNormals();
      wireGeo.dispose();
      clothMesh.remove(wireMesh);
      const newWire = new THREE.WireframeGeometry(clothGeo);
      wireMesh.geometry = newWire;
      clothMesh.add(wireMesh);
    }

    // ── Mouse interaction (raycast drag) ──
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let dragging = false;
    let dragParticle = -1;

    function findNearestParticle(point) {
      let best = -1;
      let bestDist = 0.4;
      for (let i = 0; i < numParticles; i++) {
        const dx = positions[i * 3] - point.x;
        const dy = positions[i * 3 + 1] - point.y;
        const dz = positions[i * 3 + 2] - point.z;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d < bestDist) { bestDist = d; best = i; }
      }
      return best;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(clothMesh);
      if (hits.length) {
        dragging = true;
        dragParticle = findNearestParticle(hits[0].point);
        if (dragParticle >= 0) {
          pinned[dragParticle] = 1;
          controls.enabled = false;
        }
      }
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!dragging || dragParticle < 0) return;
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const target = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, target);
      if (target) {
        setPos(dragParticle, target.x, target.y, target.z);
        prevPositions[dragParticle * 3] = target.x;
        prevPositions[dragParticle * 3 + 1] = target.y;
        prevPositions[dragParticle * 3 + 2] = target.z;
      }
    });

    function endDrag() {
      if (dragParticle >= 0 && !(pinTopCorners && (dragParticle === idx(0, 0) || dragParticle === idx(SEGS_X, 0)))) {
        pinned[dragParticle] = 0;
      }
      updatePins();
      dragging = false;
      dragParticle = -1;
      controls.enabled = true;
    }

    renderer.domElement.addEventListener('pointerup', endDrag);
    renderer.domElement.addEventListener('pointerleave', endDrag);

    // ── UI controls ──
    const windSlider = document.getElementById('wind');
    const gravitySlider = document.getElementById('gravity');
    const pinCheck = document.getElementById('pinCorners');

    windSlider.addEventListener('input', () => {
      windStrength = windSlider.value / 100;
      document.getElementById('windVal').textContent = windStrength.toFixed(2);
    });
    gravitySlider.addEventListener('input', () => {
      gravityStrength = gravitySlider.value / 100;
      document.getElementById('gravityVal').textContent = gravityStrength.toFixed(2);
    });
    pinCheck.addEventListener('change', () => {
      pinTopCorners = pinCheck.checked;
      updatePins();
    });

    // ── Resize ──
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Animate ──
    function animate() {
      requestAnimationFrame(animate);
      simulate();
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
