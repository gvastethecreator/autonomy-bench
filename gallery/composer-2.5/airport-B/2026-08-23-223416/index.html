<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPort Live — Airport Operations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --border: #1e293b;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 span { color: var(--accent); }
  .clock {
    font-family: 'Consolas', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
  }
  .weather-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 20px;
    font-size: 0.85rem;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 280px;
    min-height: 0;
  }
  #canvas-wrap {
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  aside {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-section h2 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat {
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .stat .val {
    font-size: 1.5rem;
    font-weight: 700;
    font-family: 'Consolas', monospace;
  }
  .stat .lbl {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }
  .stat .val.green { color: var(--green); }
  .stat .val.amber { color: var(--amber); }
  .stat .val.red { color: var(--red); }
  .stat .val.blue { color: var(--accent); }
  .flight-list {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  .flight-list::-webkit-scrollbar { width: 4px; }
  .flight-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .flight-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 0.8rem;
    transition: background 0.2s;
  }
  .flight-item:hover { background: rgba(255,255,255,0.03); }
  .flight-code {
    font-family: 'Consolas', monospace;
    font-weight: 700;
    color: var(--accent2);
    min-width: 52px;
  }
  .flight-detail { color: var(--muted); font-size: 0.72rem; }
  .flight-status {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-landing { background: rgba(52,211,153,0.15); color: var(--green); }
  .status-departing { background: rgba(56,189,248,0.15); color: var(--accent); }
  .status-boarding { background: rgba(251,191,36,0.15); color: var(--amber); }
  .status-taxi { background: rgba(129,140,248,0.15); color: var(--accent2); }
  .status-queued { background: rgba(100,116,139,0.15); color: var(--muted); }
  .controls {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  button {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
    transition: all 0.15s;
  }
  button:hover { background: rgba(56,189,248,0.15); border-color: var(--accent); }
  button.active { background: rgba(56,189,248,0.25); border-color: var(--accent); color: var(--accent); }
  .speed-controls { display: flex; gap: 4px; }
  .speed-controls button { flex: 1; min-width: 0; padding: 6px 4px; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(17,24,39,0.95);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.75rem;
    z-index: 100;
    display: none;
    max-width: 200px;
    backdrop-filter: blur(8px);
  }
  .tooltip .tt-title { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .tooltip .tt-row { color: var(--muted); margin: 2px 0; }
  .alert-bar {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(248,113,113,0.15);
    border: 1px solid rgba(248,113,113,0.4);
    color: var(--red);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    display: none;
    z-index: 50;
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .legend {
    position: absolute;
    bottom: 12px;
    left: 12px;
    display: flex;
    gap: 12px;
    font-size: 0.65rem;
    color: var(--muted);
    background: rgba(17,24,39,0.8);
    padding: 6px 12px;
    border-radius: 8px;
    backdrop-filter: blur(4px);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
<header>
  <h1>✈ <span>SKYPORT</span> LIVE OPS</h1>
  <div class="weather-badge" id="weather">☀ Clear · 22°C · Wind 8kt NW</div>
  <div class="clock" id="clock">06:00:00</div>
</header>
<main>
  <div id="canvas-wrap">
    <canvas id="airport"></canvas>
    <div class="tooltip" id="tooltip"></div>
    <div class="alert-bar" id="alert"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div> Landing</div>
      <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div> Departing</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div> At Gate</div>
      <div class="legend-item"><div class="legend-dot" style="background:#818cf8"></div> Taxiing</div>
    </div>
  </div>
  <aside>
    <div class="panel-section">
      <h2>Operations</h2>
      <div class="stat-grid">
        <div class="stat"><div class="val blue" id="s-flights">0</div><div class="lbl">Active</div></div>
        <div class="stat"><div class="val green" id="s-landed">0</div><div class="lbl">Landed</div></div>
        <div class="stat"><div class="val amber" id="s-gates">0/6</div><div class="lbl">Gates</div></div>
        <div class="stat"><div class="val blue" id="s-queue">0</div><div class="lbl">Queue</div></div>
      </div>
    </div>
    <div class="panel-section">
      <h2>Runway Status</h2>
      <div class="stat-grid">
        <div class="stat"><div class="val green" id="s-rwy1">OPEN</div><div class="lbl">RWY 09/27</div></div>
        <div class="stat"><div class="val green" id="s-rwy2">OPEN</div><div class="lbl">RWY 18/36</div></div>
      </div>
    </div>
    <div class="panel-section" style="padding-bottom:6px">
      <h2>Flight Board</h2>
    </div>
    <div class="flight-list" id="flight-list"></div>
    <div class="controls">
      <div class="speed-controls">
        <button onclick="setSpeed(0.5)">½×</button>
        <button onclick="setSpeed(1)" class="active" id="btn-1x">1×</button>
        <button onclick="setSpeed(2)">2×</button>
        <button onclick="setSpeed(4)">4×</button>
      </div>
    </div>
    <div class="controls" style="border-top:none;padding-top:0">
      <button onclick="togglePause()" id="btn-pause">⏸ Pause</button>
      <button onclick="spawnFlight()">+ Flight</button>
    </div>
  </aside>
</main>
<script>
(() => {
'use strict';

const canvas = document.getElementById('airport');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');
const tooltip = document.getElementById('tooltip');
const alertBar = document.getElementById('alert');

let W, H, dpr;
let simTime = 6 * 3600; // 06:00 in seconds
let speed = 1;
let paused = false;
let landed = 0;
let departed = 0;
let mouseX = 0, mouseY = 0;

const AIRLINES = ['SKY','NVA','ATL','PAC','EUR','JET','WNG','BLU'];
const CITIES = ['LHR','JFK','DXB','NRT','SYD','CDG','FRA','SIN','HND','ORD','LAX','MIA'];
const WEATHER = [
  { icon:'☀', desc:'Clear', temp:22, wind:8, dir:'NW', vis:10 },
  { icon:'⛅', desc:'Partly Cloudy', temp:18, wind:12, dir:'W', vis:8 },
  { icon:'🌧', desc:'Light Rain', temp:14, wind:18, dir:'SW', vis:4 },
  { icon:'🌫', desc:'Fog', temp:10, wind:3, dir:'N', vis:1 },
  { icon:'⛈', desc:'Thunderstorm', temp:16, wind:25, dir:'SE', vis:2 },
];
let weatherIdx = 0;
let weatherTimer = 0;

const GATES = [
  { id:'A1', x:0.12, y:0.22, occupied:false, plane:null },
  { id:'A2', x:0.12, y:0.38, occupied:false, plane:null },
  { id:'A3', x:0.12, y:0.54, occupied:false, plane:null },
  { id:'B1', x:0.88, y:0.22, occupied:false, plane:null },
  { id:'B2', x:0.88, y:0.38, occupied:false, plane:null },
  { id:'B3', x:0.88, y:0.54, occupied:false, plane:null },
];

const RUNWAYS = [
  { id:'09/27', x1:0.05, y1:0.72, x2:0.95, y2:0.72, active:true },
  { id:'18/36', x1:0.5, y1:0.62, x2:0.5, y2:0.92, active:true },
];

const TAXI_WAYS = [
  [{x:0.5,y:0.72},{x:0.5,y:0.62}],
  [{x:0.12,y:0.22},{x:0.25,y:0.22},{x:0.25,y:0.62},{x:0.5,y:0.62}],
  [{x:0.12,y:0.38},{x:0.25,y:0.38},{x:0.25,y:0.62},{x:0.5,y:0.62}],
  [{x:0.12,y:0.54},{x:0.25,y:0.54},{x:0.25,y:0.62},{x:0.5,y:0.62}],
  [{x:0.88,y:0.22},{x:0.75,y:0.22},{x:0.75,y:0.62},{x:0.5,y:0.62}],
  [{x:0.88,y:0.38},{x:0.75,y:0.38},{x:0.75,y:0.62},{x:0.5,y:0.62}],
  [{x:0.88,y:0.54},{x:0.75,y:0.54},{x:0.75,y:0.62},{x:0.5,y:0.62}],
];

let planes = [];
let vehicles = [];
let particles = [];
let nextId = 1;
let spawnTimer = 0;
let alertMsg = '';
let alertTimer = 0;

function rand(a,b) { return a + Math.random() * (b - a); }
function randInt(a,b) { return Math.floor(rand(a,b+1)); }
function pick(arr) { return arr[randInt(0, arr.length-1)]; }
function lerp(a,b,t) { return a + (b-a)*t; }
function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1, y2-y1); }

function flightCode() {
  return pick(AIRLINES) + randInt(100,999);
}

function formatTime(s) {
  s = Math.floor(s) % 86400;
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

class Plane {
  constructor(type) {
    this.id = nextId++;
    this.code = flightCode();
    this.origin = pick(CITIES);
    this.dest = pick(CITIES.filter(c => c !== this.origin));
    this.type = type; // 'arrival' | 'departure'
    this.state = type === 'arrival' ? 'approach' : 'gate';
    this.gate = null;
    this.path = [];
    this.pathIdx = 0;
    this.progress = 0;
    this.x = type === 'arrival' ? W * 1.1 : 0;
    this.y = type === 'arrival' ? H * rand(0.3, 0.5) : 0;
    this.angle = type === 'arrival' ? Math.PI : 0;
    this.speed = rand(0.8, 1.2);
    this.altitude = type === 'arrival' ? rand(800, 2000) : 0;
    this.targetAlt = 0;
    this.boardProgress = 0;
    this.size = rand(0.9, 1.1);
    this.color = `hsl(${randInt(200,260)}, ${randInt(50,70)}%, ${randInt(55,70)}%)`;
    this.waitTime = 0;
    this.selected = false;

    if (type === 'departure') {
      const freeGates = GATES.filter(g => !g.occupied);
      if (freeGates.length) {
        this.gate = pick(freeGates);
        this.gate.occupied = true;
        this.gate.plane = this;
        this.x = this.gate.x * W;
        this.y = this.gate.y * H;
        this.angle = this.gate.x < 0.5 ? 0 : Math.PI;
        this.state = 'boarding';
      } else {
        this.state = 'queued';
        this.x = W * 0.5;
        this.y = H * 0.15;
      }
    }
  }

  getStatus() {
    const map = {
      approach: 'LANDING', landing: 'LANDING', taxi_in: 'TAXI',
      gate: 'AT GATE', boarding: 'BOARDING', taxi_out: 'TAXI',
      takeoff: 'DEPARTING', queued: 'QUEUED', departed: 'DEPARTED'
    };
    return map[this.state] || this.state.toUpperCase();
  }

  statusClass() {
    const map = {
      approach:'status-landing', landing:'status-landing', taxi_in:'status-taxi',
      gate:'status-boarding', boarding:'status-boarding', taxi_out:'status-taxi',
      takeoff:'status-departing', queued:'status-queued'
    };
    return map[this.state] || 'status-queued';
  }

  assignPath(wayIdx) {
    if (wayIdx >= TAXI_WAYS.length) return;
    this.path = TAXI_WAYS[wayIdx].map(p => ({ x: p.x * W, y: p.y * H }));
    this.pathIdx = 0;
    this.progress = 0;
  }

  update(dt) {
    switch(this.state) {
      case 'approach':
        this.x -= this.speed * dt * 120;
        this.altitude = lerp(this.altitude, 200, dt * 0.5);
        if (this.x < W * 0.55) {
          this.state = 'landing';
          this.targetAlt = 0;
        }
        break;

      case 'landing':
        this.x -= this.speed * dt * 80;
        this.altitude = lerp(this.altitude, 0, dt * 2);
        if (this.altitude < 5) {
          this.altitude = 0;
          this.state = 'taxi_in';
          const freeGates = GATES.filter(g => !g.occupied);
          if (freeGates.length) {
            this.gate = freeGates.reduce((a,b) => a.y < b.y ? a : b);
            const gi = GATES.indexOf(this.gate);
            this.assignPath(gi);
          } else {
            this.state = 'queued';
            this.waitTime = 0;
          }
        }
        break;

      case 'taxi_in':
        this.followPath(dt, () => {
          this.gate.occupied = true;
          this.gate.plane = this;
          this.state = 'gate';
          this.angle = this.gate.x < 0.5 ? 0 : Math.PI;
          landed++;
          spawnVehicle(this.gate.x * W, this.gate.y * H, 'baggage');
          spawnVehicle(this.gate.x * W, this.gate.y * H, 'fuel');
        });
        break;

      case 'gate':
        this.boardProgress += dt * 0.08;
        if (this.boardProgress >= 1) {
          this.state = 'boarding';
          this.boardProgress = 0;
        }
        break;

      case 'boarding':
        this.boardProgress += dt * 0.06;
        if (this.boardProgress >= 1) {
          this.state = 'taxi_out';
          this.gate.occupied = false;
          this.gate.plane = null;
          this.gate = null;
          const gi = GATES.findIndex(g => dist(g.x*W, g.y*H, this.x, this.y) < 50);
          if (gi >= 0) this.assignPath(gi);
          else this.assignPath(0);
          this.path = [...this.path].reverse();
          this.pathIdx = 0;
          this.progress = 0;
          // Check queued arrivals
          planes.filter(p => p.state === 'queued' && p.type === 'arrival').forEach(p => {
            const fg = GATES.filter(g => !g.occupied);
            if (fg.length) {
              p.gate = fg[0];
              p.state = 'taxi_in';
              const gi2 = GATES.indexOf(p.gate);
              p.assignPath(gi2);
              p.x = W * 0.5;
              p.y = H * 0.62;
            }
          });
        }
        break;

      case 'taxi_out':
        this.followPath(dt, () => {
          this.state = 'takeoff';
          this.angle = 0;
        });
        break;

      case 'takeoff':
        this.x += this.speed * dt * 100;
        this.altitude = lerp(this.altitude, 3000, dt * 0.8);
        if (this.x > W * 1.2) {
          this.state = 'departed';
          departed++;
          return false;
        }
        break;

      case 'queued':
        this.waitTime += dt;
        if (this.type === 'departure') {
          const fg = GATES.filter(g => !g.occupied);
          if (fg.length) {
            this.gate = fg[0];
            this.gate.occupied = true;
            this.gate.plane = this;
            this.x = this.gate.x * W;
            this.y = this.gate.y * H;
            this.angle = this.gate.x < 0.5 ? 0 : Math.PI;
            this.state = 'boarding';
          }
        }
        break;
    }
    return true;
  }

  followPath(dt, onComplete) {
    if (!this.path.length || this.pathIdx >= this.path.length) {
      onComplete();
      return;
    }
    const target = this.path[this.pathIdx];
    const dx = target.x - this.x;
    const dy = target.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 3) {
      this.pathIdx++;
      if (this.pathIdx >= this.path.length) { onComplete(); return; }
    } else {
      const move = this.speed * dt * 60;
      this.x += (dx/d) * move;
      this.y += (dy/d) * move;
      this.angle = Math.atan2(dy, dx);
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y - this.altitude * 0.02);
    ctx.rotate(this.angle);

    const s = 18 * this.size;

    // Shadow
    if (this.altitude > 0) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(this.altitude * 0.015, this.altitude * 0.02, s * 0.8, s * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Fuselage
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.roundRect(-s, -s * 0.25, s * 2, s * 0.5, 3);
    ctx.fill();

    // Wings
    ctx.fillStyle = shade(this.color, -20);
    ctx.beginPath();
    ctx.moveTo(-s * 0.2, -s * 0.25);
    ctx.lineTo(s * 0.1, -s * 0.9);
    ctx.lineTo(s * 0.4, -s * 0.9);
    ctx.lineTo(s * 0.5, -s * 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * 0.2, s * 0.25);
    ctx.lineTo(s * 0.1, s * 0.9);
    ctx.lineTo(s * 0.4, s * 0.9);
    ctx.lineTo(s * 0.5, s * 0.25);
    ctx.closePath();
    ctx.fill();

    // Tail
    ctx.fillStyle = shade(this.color, -30);
    ctx.beginPath();
    ctx.moveTo(-s, -s * 0.25);
    ctx.lineTo(-s * 1.2, -s * 0.6);
    ctx.lineTo(-s * 0.8, -s * 0.25);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(s * 0.85, 0, s * 0.15, 0, Math.PI * 2);
    ctx.fill();

    // Landing lights
    if (this.state === 'approach' || this.state === 'landing') {
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(s * 0.9, 0, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Boarding progress bar
    if (this.state === 'boarding' || this.state === 'gate') {
      ctx.rotate(-this.angle);
      const bw = s * 1.5;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-bw/2, -s * 1.5, bw, 4);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-bw/2, -s * 1.5, bw * this.boardProgress, 4);
    }

    // Label
    ctx.rotate(-this.angle);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 9px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.code, 0, s * 1.8);

    ctx.restore();
  }

  hitTest(mx, my) {
    return dist(mx, my, this.x, this.y) < 25;
  }
}

function shade(color, amt) {
  const m = color.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
  if (!m) return color;
  return `hsl(${m[1]}, ${m[2]}%, ${Math.max(10, Math.min(90, +m[3] + amt))}%)`;
}

class Vehicle {
  constructor(x, y, type) {
    this.x = x + rand(-20, 20);
    this.y = y + rand(-10, 10);
    this.type = type;
    this.life = 1;
    this.targetX = x + rand(-60, 60);
    this.targetY = y + rand(30, 80);
    this.speed = rand(20, 40);
  }
  update(dt) {
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 2) { this.life -= dt * 0.5; return this.life > 0; }
    const move = this.speed * dt;
    this.x += (dx/d) * move;
    this.y += (dy/d) * move;
    return true;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.min(1, this.life);
    ctx.fillStyle = this.type === 'baggage' ? '#f59e0b' : '#ef4444';
    ctx.fillRect(this.x - 4, this.y - 2, 8, 4);
    ctx.restore();
  }
}

function spawnVehicle(x, y, type) {
  vehicles.push(new Vehicle(x, y, type));
}

function spawnFlight() {
  const type = Math.random() < 0.55 ? 'arrival' : 'departure';
  if (type === 'departure') {
    const fg = GATES.filter(g => !g.occupied);
    if (!fg.length && planes.filter(p => p.state === 'queued').length > 3) return;
  }
  planes.push(new Plane(type));
  showAlert(`New ${type}: ${planes[planes.length-1].code}`);
}

function showAlert(msg) {
  alertMsg = msg;
  alertTimer = 3;
  alertBar.textContent = msg;
  alertBar.style.display = 'block';
}

function drawAirport() {
  // Sky gradient based on time
  const hour = (simTime / 3600) % 24;
  let skyTop, skyBot;
  if (hour >= 6 && hour < 18) {
    const t = hour < 12 ? (hour - 6) / 6 : (18 - hour) / 6;
    skyTop = lerpColor('#1a3a5c', '#4a90c2', t);
    skyBot = lerpColor('#2d5a3f', '#87ceab', t);
  } else {
    skyTop = '#0a0e1a';
    skyBot = '#141828';
  }
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Grass
  ctx.fillStyle = hour >= 6 && hour < 20 ? '#2d5a2d' : '#1a3a1a';
  ctx.fillRect(0, H * 0.58, W, H * 0.42);

  // Terminal building
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(W * 0.08, H * 0.12, W * 0.84, H * 0.48);
  ctx.fillStyle = '#334155';
  ctx.fillRect(W * 0.1, H * 0.14, W * 0.8, H * 0.44);

  // Terminal windows
  ctx.fillStyle = hour >= 6 && hour < 22 ? 'rgba(251,191,36,0.3)' : 'rgba(56,189,248,0.15)';
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 12; col++) {
      ctx.fillRect(
        W * (0.12 + col * 0.065),
        H * (0.17 + row * 0.12),
        W * 0.04, H * 0.06
      );
    }
  }

  // Control tower
  const tx = W * 0.5, ty = H * 0.08;
  ctx.fillStyle = '#475569';
  ctx.fillRect(tx - 8, ty, 16, H * 0.08);
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.moveTo(tx - 18, ty);
  ctx.lineTo(tx + 18, ty);
  ctx.lineTo(tx + 14, ty - H * 0.04);
  ctx.lineTo(tx - 14, ty - H * 0.04);
  ctx.closePath();
  ctx.fill();
  // Tower windows
  ctx.fillStyle = hour >= 6 && hour < 22 ? '#fbbf24' : '#38bdf8';
  ctx.globalAlpha = 0.6;
  ctx.fillRect(tx - 10, ty - H * 0.035, 20, H * 0.025);
  ctx.globalAlpha = 1;

  // Runways
  RUNWAYS.forEach(rwy => {
    ctx.strokeStyle = rwy.active ? '#64748b' : '#ef4444';
    ctx.lineWidth = rwy.id === '09/27' ? 28 : 18;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(rwy.x1 * W, rwy.y1 * H);
    ctx.lineTo(rwy.x2 * W, rwy.y2 * H);
    ctx.stroke();

    // Center line
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(rwy.x1 * W, rwy.y1 * H);
    ctx.lineTo(rwy.x2 * W, rwy.y2 * H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Runway label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Consolas';
    ctx.textAlign = 'center';
    const mx = (rwy.x1 + rwy.x2) / 2 * W;
    const my = (rwy.y1 + rwy.y2) / 2 * H;
    ctx.fillText(rwy.id, mx, my - 18);
  });

  // Taxiways
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 10;
  TAXI_WAYS.forEach(path => {
    ctx.beginPath();
    path.forEach((p, i) => {
      const px = p.x * W, py = p.y * H;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
  });

  // Gates
  GATES.forEach(g => {
    const gx = g.x * W, gy = g.y * H;
    ctx.fillStyle = g.occupied ? '#fbbf24' : '#334155';
    ctx.fillRect(gx - (g.x < 0.5 ? 30 : 0), gy - 8, 30, 16);
    ctx.strokeStyle = g.occupied ? '#fbbf24' : '#64748b';
    ctx.lineWidth = 1;
    ctx.strokeRect(gx - (g.x < 0.5 ? 30 : 0), gy - 8, 30, 16);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px Consolas';
    ctx.textAlign = g.x < 0.5 ? 'right' : 'left';
    ctx.fillText(g.id, g.x < 0.5 ? gx - 34 : gx + 34, gy + 3);

    // Jet bridge
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(g.x < 0.5 ? gx + 40 : gx - 40, gy);
    ctx.stroke();
  });

  // Weather effects
  const w = WEATHER[weatherIdx];
  if (w.desc === 'Light Rain' || w.desc === 'Thunderstorm') {
    ctx.strokeStyle = 'rgba(174,194,224,0.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 80; i++) {
      const rx = (i * 137 + simTime * 200) % W;
      const ry = (i * 97 + simTime * 400) % H;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 3, ry + 12);
      ctx.stroke();
    }
  }
  if (w.desc === 'Fog') {
    ctx.fillStyle = 'rgba(200,210,220,0.25)';
    ctx.fillRect(0, 0, W, H);
  }
}

function lerpColor(c1, c2, t) {
  const p = (c) => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const a = p(c1), b = p(c2);
  const r = Math.round(lerp(a[0], b[0], t));
  const g = Math.round(lerp(a[1], b[1], t));
  const bl = Math.round(lerp(a[2], b[2], t));
  return `rgb(${r},${g},${bl})`;
}

function updateUI() {
  document.getElementById('clock').textContent = formatTime(simTime);
  const w = WEATHER[weatherIdx];
  document.getElementById('weather').textContent =
    `${w.icon} ${w.desc} · ${w.temp}°C · Wind ${w.wind}kt ${w.dir}`;

  const active = planes.filter(p => p.state !== 'departed').length;
  const queued = planes.filter(p => p.state === 'queued').length;
  const gatesUsed = GATES.filter(g => g.occupied).length;

  document.getElementById('s-flights').textContent = active;
  document.getElementById('s-landed').textContent = landed;
  document.getElementById('s-gates').textContent = `${gatesUsed}/6`;
  document.getElementById('s-queue').textContent = queued;

  // Runway status based on weather
  const rwyClosed = w.desc === 'Thunderstorm' || w.vis < 2;
  document.getElementById('s-rwy1').textContent = rwyClosed ? 'CLOSED' : 'OPEN';
  document.getElementById('s-rwy1').className = 'val ' + (rwyClosed ? 'red' : 'green');
  document.getElementById('s-rwy2').textContent = rwyClosed ? 'CLOSED' : 'OPEN';
  document.getElementById('s-rwy2').className = 'val ' + (rwyClosed ? 'red' : 'green');

  const list = document.getElementById('flight-list');
  list.innerHTML = planes
    .filter(p => p.state !== 'departed')
    .sort((a,b) => {
      const order = {approach:0,landing:1,taxi_in:2,gate:3,boarding:4,taxi_out:5,takeoff:6,queued:7};
      return (order[a.state]||9) - (order[b.state]||9);
    })
    .map(p => `
      <div class="flight-item">
        <div class="flight-code">${p.code}</div>
        <div>
          <div>${p.type === 'arrival' ? p.origin : p.dest}${p.gate ? ' · Gate '+p.gate.id : ''}</div>
          <div class="flight-detail">${p.type === 'arrival' ? 'From '+p.origin : 'To '+p.dest}</div>
        </div>
        <div class="flight-status ${p.statusClass()}">${p.getStatus()}</div>
      </div>
    `).join('');
}

function updateTooltip() {
  const hit = planes.find(p => p.state !== 'departed' && p.hitTest(mouseX, mouseY));
  if (hit) {
    tooltip.style.display = 'block';
    tooltip.style.left = (mouseX + 14) + 'px';
    tooltip.style.top = (mouseY - 10) + 'px';
    tooltip.innerHTML = `
      <div class="tt-title">${hit.code}</div>
      <div class="tt-row">${hit.origin} → ${hit.dest}</div>
      <div class="tt-row">Status: ${hit.getStatus()}</div>
      ${hit.gate ? `<div class="tt-row">Gate: ${hit.gate.id}</div>` : ''}
      ${hit.altitude > 0 ? `<div class="tt-row">Alt: ${Math.round(hit.altitude)}ft</div>` : ''}
    `;
  } else {
    tooltip.style.display = 'none';
  }
}

let lastTime = 0;
function loop(timestamp) {
  const rawDt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  const dt = paused ? 0 : rawDt * speed;

  if (!paused) {
    simTime += dt * 60;
    spawnTimer += dt;
    weatherTimer += dt;

    if (spawnTimer > rand(8, 15) / speed) {
      spawnTimer = 0;
      if (planes.filter(p => p.state !== 'departed').length < 12) spawnFlight();
    }

    if (weatherTimer > 45) {
      weatherTimer = 0;
      weatherIdx = (weatherIdx + 1) % WEATHER.length;
      const w = WEATHER[weatherIdx];
      showAlert(`Weather update: ${w.desc}`);
    }

    if (alertTimer > 0) {
      alertTimer -= dt;
      if (alertTimer <= 0) alertBar.style.display = 'none';
    }

    planes = planes.filter(p => p.update(dt));
    vehicles = vehicles.filter(v => v.update(dt));
  }

  drawAirport();
  vehicles.forEach(v => v.draw());
  planes.filter(p => p.state !== 'departed').forEach(p => p.draw());

  updateUI();
  updateTooltip();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

window.setSpeed = function(s) {
  speed = s;
  document.querySelectorAll('.speed-controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + (s === 1 ? '1x' : ''))?.classList.add('active');
  event?.target?.classList.add('active');
};
window.togglePause = function() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Resume' : '⏸ Pause';
};
window.spawnFlight = spawnFlight;

// Initial flights
for (let i = 0; i < 4; i++) setTimeout(() => spawnFlight(), i * 800);

requestAnimationFrame(loop);
})();
</script>
</body>
