<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #060810;
    --bg-mid: #0c1220;
    --accent: #5eead4;
    --accent-dim: #2dd4bf66;
    --accent-glow: #5eead488;
    --warm: #fbbf24;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --line: #1e293b;
    --progress-track: #1a2332;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, transparent 0%, var(--bg-deep) 85%),
      radial-gradient(circle at 50% 100%, #5eead410 0%, transparent 50%);
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.04;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.03) 2px,
      rgba(255,255,255,0.03) 4px
    );
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 3.5rem;
    opacity: 0;
    transform: translateY(24px);
    animation: riseIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  .logo-ring {
    position: relative;
    width: 88px;
    height: 88px;
  }

  .logo-ring svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px var(--accent-glow));
  }

  .logo-ring .ring-outer {
    fill: none;
    stroke: var(--accent-dim);
    stroke-width: 1.5;
    stroke-dasharray: 251;
    stroke-dashoffset: 251;
    animation: drawRing 2s ease-out 0.6s forwards, pulseRing 3s ease-in-out 2.6s infinite;
    transform-origin: center;
  }

  .logo-ring .ring-inner {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 188;
    stroke-dashoffset: 188;
    animation: drawRingInner 1.6s ease-out 1s forwards;
    transform-origin: center;
  }

  .logo-ring .core {
    fill: var(--accent);
    opacity: 0;
    animation: coreGlow 0.8s ease-out 2s forwards;
  }

  .brand-name {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .brand-name span {
    color: var(--accent);
  }

  .loader-panel {
    width: min(420px, 90vw);
    opacity: 0;
    transform: translateY(16px);
    animation: riseIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.75rem;
    font-size: 0.8125rem;
  }

  .status-label {
    color: var(--text-dim);
    letter-spacing: 0.05em;
    transition: color 0.4s ease;
  }

  .status-label.active {
    color: var(--accent);
  }

  .status-percent {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--text);
    font-size: 0.875rem;
  }

  .progress-track {
    position: relative;
    height: 3px;
    background: var(--progress-track);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.25rem;
  }

  .progress-track::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: shimmer 2.5s ease-in-out infinite;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2dd4bf, var(--accent), #67e8f9);
    border-radius: 2px;
    box-shadow: 0 0 12px var(--accent-glow), 0 0 24px #5eead433;
    transition: width 0.15s ease-out;
    position: relative;
  }

  .progress-fill::after {
    content: "";
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff, 0 0 16px var(--accent);
    opacity: 0.9;
  }

  .phase-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .phase-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    opacity: 0.4;
    transform: translateX(-8px);
    transition: opacity 0.5s ease, transform 0.5s ease, color 0.4s ease;
  }

  .phase-item.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .phase-item.done {
    color: var(--text-dim);
    opacity: 0.6;
  }

  .phase-item.active {
    color: var(--text);
    opacity: 1;
  }

  .phase-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  .phase-item.active .phase-dot {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: dotPulse 1.5s ease-in-out infinite;
  }

  .phase-item.done .phase-dot {
    background: var(--accent);
    opacity: 0.5;
  }

  .phase-item.done .phase-dot::after {
    content: "✓";
    display: block;
    font-size: 4px;
    text-align: center;
    line-height: 6px;
    color: var(--bg-deep);
  }

  .complete-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-deep);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }

  .complete-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .complete-content {
    text-align: center;
    transform: scale(0.92);
    opacity: 0;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
  }

  .complete-overlay.show .complete-content {
    transform: scale(1);
    opacity: 1;
  }

  .complete-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 1.5rem;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px var(--accent-glow);
    animation: completePulse 2s ease-in-out infinite;
  }

  .complete-icon svg {
    width: 28px;
    height: 28px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
    animation: checkDraw 0.6s ease-out 0.3s forwards;
  }

  .complete-title {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }

  .complete-sub {
    font-size: 0.8125rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .corner-meta {
    position: fixed;
    bottom: 1.5rem;
    left: 1.5rem;
    z-index: 10;
    font-size: 0.625rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    opacity: 0;
    animation: fadeIn 1s ease 1.5s forwards;
  }

  .corner-meta .version {
    color: var(--accent);
    opacity: 0.7;
  }

  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 0.5; }
  }

  @keyframes drawRing {
    to { stroke-dashoffset: 0; }
  }

  @keyframes drawRingInner {
    to { stroke-dashoffset: 0; }
  }

  @keyframes coreGlow {
    to { opacity: 0.85; }
  }

  @keyframes pulseRing {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  @keyframes shimmer {
    0%, 100% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
  }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  @keyframes completePulse {
    0%, 100% { box-shadow: 0 0 30px var(--accent-glow); }
    50% { box-shadow: 0 0 50px var(--accent-glow), 0 0 80px #5eead422; }
  }

  @keyframes checkDraw {
    to { stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="container" id="loader">
  <div class="brand">
    <div class="logo-ring">
      <svg viewBox="0 0 88 88">
        <circle class="ring-outer" cx="44" cy="44" r="40"/>
        <circle class="ring-inner" cx="44" cy="44" r="30"/>
        <circle class="core" cx="44" cy="44" r="6"/>
      </svg>
    </div>
    <div class="brand-name"><span>Nexus</span> Systems</div>
  </div>

  <div class="loader-panel">
    <div class="status-row">
      <span class="status-label active" id="statusText">Initializing</span>
      <span class="status-percent" id="percentText">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <ul class="phase-list" id="phaseList"></ul>
  </div>
</div>

<div class="complete-overlay" id="completeOverlay">
  <div class="complete-content">
    <div class="complete-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="complete-title">Ready</h1>
    <p class="complete-sub">All systems online</p>
  </div>
</div>

<div class="corner-meta">BUILD <span class="version">7.4.2</span> · SECURE BOOT</div>

<script>
(function () {
  const phases = [
    { label: "Verifying integrity", duration: 1200 },
    { label: "Loading core modules", duration: 1400 },
    { label: "Establishing connection", duration: 1600 },
    { label: "Syncing environment", duration: 1300 },
    { label: "Preparing interface", duration: 1100 },
  ];

  const phaseList = document.getElementById("phaseList");
  const progressFill = document.getElementById("progressFill");
  const percentText = document.getElementById("percentText");
  const statusText = document.getElementById("statusText");
  const completeOverlay = document.getElementById("completeOverlay");

  phases.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = "phase-item";
    li.innerHTML = `<span class="phase-dot"></span><span>${p.label}</span>`;
    li.dataset.index = i;
    phaseList.appendChild(li);
  });

  const items = phaseList.querySelectorAll(".phase-item");
  let progress = 0;
  let phaseIndex = 0;
  const totalDuration = phases.reduce((s, p) => s + p.duration, 0);

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function setProgress(value) {
    progress = Math.min(100, Math.max(0, value));
    progressFill.style.width = progress + "%";
    percentText.textContent = Math.round(progress) + "%";
  }

  function updatePhases(index) {
    items.forEach((item, i) => {
      item.classList.remove("active", "done", "visible");
      if (i < index) {
        item.classList.add("done", "visible");
      } else if (i === index) {
        item.classList.add("active", "visible");
        statusText.textContent = phases[i].label;
      } else if (i <= index + 1) {
        item.classList.add("visible");
      }
    });
  }

  function runPhase(index) {
    if (index >= phases.length) {
      setProgress(100);
      statusText.textContent = "Complete";
      statusText.classList.add("active");
      setTimeout(() => {
        completeOverlay.classList.add("show");
      }, 600);
      return;
    }

    updatePhases(index);
    const phase = phases[index];
    const startProgress = (phases.slice(0, index).reduce((s, p) => s + p.duration, 0) / totalDuration) * 100;
    const endProgress = (phases.slice(0, index + 1).reduce((s, p) => s + p.duration, 0) / totalDuration) * 100;
    const startTime = performance.now();

    function tick(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / phase.duration);
      const eased = easeOutCubic(t);
      setProgress(startProgress + (endProgress - startProgress) * eased);

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        items[index].classList.remove("active");
        items[index].classList.add("done");
        runPhase(index + 1);
      }
    }

    requestAnimationFrame(tick);
  }

  setTimeout(() => runPhase(0), 1800);

  /* Starfield */
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    const count = Math.floor((w * h) / 8000);
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.2 + 0.3,
        speed: Math.random() * 0.15 + 0.05,
        opacity: Math.random() * 0.6 + 0.2,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  }

  function drawStars(time) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      const flicker = 0.5 + 0.5 * Math.sin(time * 0.001 + s.twinkle);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 220, 255, ${s.opacity * flicker})`;
      ctx.fill();
      s.y -= s.speed;
      if (s.y < -2) {
        s.y = h + 2;
        s.x = Math.random() * w;
      }
    }
    requestAnimationFrame(drawStars);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(drawStars);
})();
</script>
</body>
</html>
