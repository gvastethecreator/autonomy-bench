<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloth — Wind & Thread</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0c12;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #c8d0dc;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#gl {
    display: block;
    width: 100%; height: 100%;
    cursor: crosshair;
  }

  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 70% at 50% 45%,
      transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px;
  }

  .header {
    position: absolute;
    top: 2.2rem;
    left: 2.5rem;
    opacity: 0;
    animation: fadeIn 2s ease 0.8s forwards;
  }

  .header h1 {
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(220, 225, 235, 0.85);
    text-shadow: 0 0 40px rgba(120, 160, 220, 0.3);
  }

  .header p {
    margin-top: 0.5rem;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    font-style: italic;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(160, 175, 200, 0.55);
  }

  .hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(140, 155, 180, 0.4);
    opacity: 0;
    animation: fadeIn 2s ease 2.2s forwards, pulse 4s ease-in-out 4s infinite;
  }

  .wind-indicator {
    position: absolute;
    top: 50%;
    right: 2.5rem;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    opacity: 0;
    animation: fadeIn 1.5s ease 1.5s forwards;
  }

  .wind-label {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(130, 150, 180, 0.45);
    writing-mode: vertical-rl;
  }

  .wind-bar {
    width: 3px;
    height: 80px;
    background: rgba(80, 100, 140, 0.2);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .wind-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30%;
    background: linear-gradient(to top, rgba(100, 160, 230, 0.6), rgba(180, 200, 240, 0.3));
    border-radius: 2px;
    transition: height 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint { animation: fadeIn 2s ease 2.2s forwards, pulse 4s ease-in-out 4s infinite; }
  .hint { transform: translateX(-50%); }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.7; }
  }

  .intro-curtain {
    position: fixed;
    inset: 0;
    background: #0a0c12;
    z-index: 100;
    animation: curtainUp 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
  }

  @keyframes curtainUp {
    to { transform: translateY(-100%); opacity: 0; pointer-events: none; }
  }
</style>
</head>
<body>

<div class="intro-curtain"></div>

<canvas id="gl"></canvas>

<div class="overlay">
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="header">
    <h1>Cloth</h1>
    <p>A study in wind, weight, and thread</p>
  </div>
  <div class="wind-indicator">
    <span class="wind-label">Wind</span>
    <div class="wind-bar"><div class="wind-fill" id="windFill"></div></div>
  </div>
  <div class="hint">Drag to pull &nbsp;·&nbsp; Move to wind</div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('gl');
  const windFill = document.getElementById('windFill');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false })
            || canvas.getContext('experimental-webgl');

  if (!gl) {
    document.body.innerHTML = '<p style="color:#fff;padding:2rem">WebGL not supported</p>';
    return;
  }

  // ── Resize ──────────────────────────────────────────────────────────
  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Shaders ─────────────────────────────────────────────────────────
  const vertSrc = `
    attribute vec3 aPos;
    attribute vec3 aNormal;
    attribute vec2 aUV;
    uniform mat4 uVP;
    uniform mat4 uModel;
    uniform mat3 uNormalMat;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying vec2 vUV;
    void main() {
      vec4 wp = uModel * vec4(aPos, 1.0);
      vWorldPos = wp.xyz;
      vNormal = normalize(uNormalMat * aNormal);
      vUV = aUV;
      gl_Position = uVP * wp;
    }
  `;

  const fragSrc = `
    precision mediump float;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying vec2 vUV;
    uniform vec3 uLightDir;
    uniform vec3 uLightColor;
    uniform vec3 uAmbient;
    uniform vec3 uClothColor;
    uniform float uTime;
    uniform float uWindStrength;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main() {
      vec3 N = normalize(vNormal);
      vec3 L = normalize(uLightDir);
      vec3 V = normalize(-vWorldPos);
      vec3 H = normalize(L + V);

      float diff = max(dot(N, L), 0.0);
      float spec = pow(max(dot(N, H), 0.0), 32.0);

      // Fabric weave pattern
      float weaveU = sin(vUV.x * 80.0) * sin(vUV.y * 80.0);
      float weaveV = sin(vUV.x * 40.0 + 0.5) * sin(vUV.y * 40.0 + 0.5);
      float weave = mix(weaveU, weaveV, 0.5) * 0.5 + 0.5;
      weave = smoothstep(0.35, 0.65, weave);

      // Subtle color variation
      float noise = hash(vUV * 120.0) * 0.08;
      vec3 baseColor = uClothColor * (0.92 + weave * 0.12 + noise);

      // Rim light from wind side
      float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 rimColor = vec3(0.4, 0.55, 0.8) * rim * uWindStrength * 0.6;

      // Fresnel sheen
      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);
      vec3 sheen = vec3(0.6, 0.65, 0.75) * fresnel * 0.15;

      vec3 col = uAmbient * baseColor;
      col += baseColor * diff * uLightColor;
      col += vec3(1.0) * spec * 0.18;
      col += rimColor + sheen;

      // Subtle shadow in folds
      float fold = 1.0 - diff * 0.3;
      col *= fold;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  const bgVert = `
    attribute vec2 aPos;
    varying vec2 vUV;
    void main() {
      vUV = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  const bgFrag = `
    precision mediump float;
    varying vec2 vUV;
    uniform float uTime;
    uniform vec2 uRes;

    void main() {
      vec2 uv = vUV;
      float aspect = uRes.x / uRes.y;

      // Deep atmospheric gradient
      vec3 topColor = vec3(0.04, 0.06, 0.12);
      vec3 midColor = vec3(0.06, 0.09, 0.16);
      vec3 botColor = vec3(0.03, 0.04, 0.08);

      float t = uv.y;
      vec3 col = mix(botColor, midColor, smoothstep(0.0, 0.5, t));
      col = mix(col, topColor, smoothstep(0.5, 1.0, t));

      // Soft light bloom from upper-left
      vec2 lightPos = vec2(0.15, 0.85);
      float glow = exp(-length((uv - lightPos) * vec2(aspect, 1.0)) * 2.8) * 0.35;
      col += vec3(0.15, 0.22, 0.38) * glow;

      // Secondary warm accent lower-right
      vec2 warmPos = vec2(0.85, 0.15);
      float warm = exp(-length((uv - warmPos) * vec2(aspect, 1.0)) * 4.0) * 0.08;
      col += vec3(0.25, 0.15, 0.08) * warm;

      // Subtle animated aurora band
      float aurora = sin(uv.x * 3.0 + uTime * 0.15) * 0.5 + 0.5;
      aurora *= exp(-pow((uv.y - 0.72) * 4.0, 2.0)) * 0.06;
      col += vec3(0.1, 0.2, 0.35) * aurora;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  function linkProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(p));
      return null;
    }
    return p;
  }

  const clothProg = linkProgram(compileShader(gl.VERTEX_SHADER, vertSrc),
                                 compileShader(gl.FRAGMENT_SHADER, fragSrc));
  const bgProg = linkProgram(compileShader(gl.VERTEX_SHADER, bgVert),
                              compileShader(gl.FRAGMENT_SHADER, bgFrag));

  // ── Cloth Physics ───────────────────────────────────────────────────
  const COLS = 36;
  const ROWS = 28;
  const SPACING = 0.065;
  const GRAVITY = -0.00018;
  const DAMPING = 0.992;
  const ITERATIONS = 6;

  const numPts = COLS * ROWS;
  const positions = new Float32Array(numPts * 3);
  const prevPositions = new Float32Array(numPts * 3);
  const pinned = new Uint8Array(numPts);

  // Pin top row corners and a few middle points for natural drape
  for (let c = 0; c < COLS; c++) {
    pinned[c] = 1; // top row fully pinned
  }

  function initCloth() {
    const offsetX = -(COLS - 1) * SPACING * 0.5;
    const offsetY = 0.6;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const i = r * COLS + c;
        positions[i * 3]     = offsetX + c * SPACING;
        positions[i * 3 + 1] = offsetY - r * SPACING;
        positions[i * 3 + 2] = 0;
        prevPositions[i * 3]     = positions[i * 3];
        prevPositions[i * 3 + 1] = positions[i * 3 + 1];
        prevPositions[i * 3 + 2] = positions[i * 3 + 2];
      }
    }
  }
  initCloth();

  // Constraints
  const constraints = [];
  function addConstraint(a, b, rest, type) {
    constraints.push({ a, b, rest, type });
  }

  function buildConstraints() {
    constraints.length = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const i = r * COLS + c;
        if (c < COLS - 1) addConstraint(i, i + 1, SPACING, 'struct');
        if (r < ROWS - 1) addConstraint(i, i + COLS, SPACING, 'struct');
        // Shear
        if (c < COLS - 1 && r < ROWS - 1) {
          addConstraint(i, i + COLS + 1, SPACING * Math.SQRT2, 'shear');
          addConstraint(i + 1, i + COLS, SPACING * Math.SQRT2, 'shear');
        }
        // Bend (skip one)
        if (c < COLS - 2) addConstraint(i, i + 2, SPACING * 2, 'bend');
        if (r < ROWS - 2) addConstraint(i, i + COLS * 2, SPACING * 2, 'bend');
      }
    }
  }
  buildConstraints();

  const STIFFNESS = { struct: 0.95, shear: 0.7, bend: 0.3 };

  // ── Input ───────────────────────────────────────────────────────────
  const mouse = { x: 0, y: 0, px: 0, py: 0, down: false, id: -1 };
  const wind = { x: 0, y: 0, strength: 0.3, target: 0.3 };

  function screenToWorld(sx, sy) {
    const aspect = W / H;
    const fov = 45 * Math.PI / 180;
    const dist = 2.8;
    const ndcX = (sx / W) * 2 - 1;
    const ndcY = 1 - (sy / H) * 2;
    const halfH = Math.tan(fov / 2) * dist;
    const halfW = halfH * aspect;
    return {
      x: ndcX * halfW,
      y: ndcY * halfH + 0.1,
      z: 0
    };
  }

  function onPointerDown(e) {
    mouse.down = true;
    mouse.id = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
    mouse.px = mouse.x;
    mouse.py = mouse.y;
  }

  function onPointerMove(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

    const dx = (mouse.x - mouse.px) / W;
    const dy = (mouse.y - mouse.py) / H;
    const speed = Math.sqrt(dx * dx + dy * dy);

    if (!mouse.down) {
      wind.x += (dx * 8 - wind.x) * 0.15;
      wind.y += (-dy * 4 - wind.y) * 0.15;
      wind.target = Math.min(0.15 + speed * 12, 1.0);
    }
  }

  function onPointerUp(e) {
    mouse.down = false;
    canvas.releasePointerCapture(e.pointerId);
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  // Touch fallback wind on mobile
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && !mouse.down) {
      e.preventDefault();
    }
  }, { passive: false });

  function findNearestPoint(wx, wy) {
    let best = -1, bestD = 0.15;
    for (let i = 0; i < numPts; i++) {
      const dx = positions[i * 3] - wx;
      const dy = positions[i * 3 + 1] - wy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  let grabbedPoint = -1;

  // ── Physics Step ────────────────────────────────────────────────────
  function simulate(dt) {
    wind.strength += (wind.target - wind.strength) * 0.02;
    if (!mouse.down) wind.target += (0.25 - wind.target) * 0.01;

    // Ambient wind oscillation
    const t = performance.now() * 0.001;
    const ambientWindX = Math.sin(t * 0.7) * 0.0004 + Math.sin(t * 1.3 + 1.0) * 0.0002;
    const ambientWindY = Math.cos(t * 0.5) * 0.00005;

    const wx = wind.x * 0.0006 * wind.strength + ambientWindX;
    const wy = wind.y * 0.0003 * wind.strength + ambientWindY;
    const wz = Math.sin(t * 0.9) * 0.00015 * wind.strength;

    // Grab point
    if (mouse.down) {
      const w = screenToWorld(mouse.x, mouse.y);
      if (grabbedPoint < 0) grabbedPoint = findNearestPoint(w.x, w.y);
      if (grabbedPoint >= 0) {
        positions[grabbedPoint * 3]     = w.x;
        positions[grabbedPoint * 3 + 1] = w.y;
        positions[grabbedPoint * 3 + 2] = w.z;
        prevPositions[grabbedPoint * 3]     = w.x;
        prevPositions[grabbedPoint * 3 + 1] = w.y;
        prevPositions[grabbedPoint * 3 + 2] = w.z;
      }
    } else {
      grabbedPoint = -1;
    }

    // Verlet integration
    for (let i = 0; i < numPts; i++) {
      if (pinned[i] || i === grabbedPoint) continue;

      const ix = i * 3;
      let vx = (positions[ix]     - prevPositions[ix])     * DAMPING;
      let vy = (positions[ix + 1] - prevPositions[ix + 1]) * DAMPING;
      let vz = (positions[ix + 2] - prevPositions[ix + 2]) * DAMPING;

      prevPositions[ix]     = positions[ix];
      prevPositions[ix + 1] = positions[ix + 1];
      prevPositions[ix + 2] = positions[ix + 2];

      // Wind force varies by height (more at top)
      const row = Math.floor(i / COLS);
      const heightFactor = 1.0 - row / ROWS * 0.5;
      vx += wx * heightFactor + (Math.random() - 0.5) * 0.00002 * wind.strength;
      vy += GRAVITY + wy * heightFactor;
      vz += wz * heightFactor;

      positions[ix]     += vx;
      positions[ix + 1] += vy;
      positions[ix + 2] += vz;
    }

    // Constraint satisfaction
    for (let iter = 0; iter < ITERATIONS; iter++) {
      for (let k = 0; k < constraints.length; k++) {
        const { a, b, rest, type } = constraints[k];
        const ax = a * 3, bx = b * 3;

        let dx = positions[bx]     - positions[ax];
        let dy = positions[bx + 1] - positions[ax + 1];
        let dz = positions[bx + 2] - positions[ax + 2];
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < 0.0001) continue;

        const diff = (dist - rest) / dist;
        const stiff = STIFFNESS[type];
        const corr = diff * stiff * 0.5;

        dx *= corr; dy *= corr; dz *= corr;

        const pinA = pinned[a] || a === grabbedPoint;
        const pinB = pinned[b] || b === grabbedPoint;

        if (!pinA && !pinB) {
          positions[ax]     += dx; positions[ax + 1] += dy; positions[ax + 2] += dz;
          positions[bx]     -= dx; positions[bx + 1] -= dy; positions[bx + 2] -= dz;
        } else if (!pinA) {
          positions[ax]     += dx * 2; positions[ax + 1] += dy * 2; positions[ax + 2] += dz * 2;
        } else if (!pinB) {
          positions[bx]     -= dx * 2; positions[bx + 1] -= dy * 2; positions[bx + 2] -= dz * 2;
        }
      }
    }
  }

  // ── Mesh Data ───────────────────────────────────────────────────────
  const numTris = (COLS - 1) * (ROWS - 1) * 2;
  const indices = new Uint16Array(numTris * 3);
  const uvs = new Float32Array(numPts * 2);
  let idx = 0;
  for (let r = 0; r < ROWS - 1; r++) {
    for (let c = 0; c < COLS - 1; c++) {
      const tl = r * COLS + c;
      const tr = tl + 1;
      const bl = tl + COLS;
      const br = bl + 1;
      indices[idx++] = tl; indices[idx++] = bl; indices[idx++] = tr;
      indices[idx++] = tr; indices[idx++] = bl; indices[idx++] = br;
    }
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c;
      uvs[i * 2]     = c / (COLS - 1);
      uvs[i * 2 + 1] = r / (ROWS - 1);
    }
  }

  const normals = new Float32Array(numPts * 3);

  function computeNormals() {
    normals.fill(0);
    for (let r = 0; r < ROWS - 1; r++) {
      for (let c = 0; c < COLS - 1; c++) {
        const tl = r * COLS + c;
        const tr = tl + 1;
        const bl = tl + COLS;
        const br = bl + 1;

        const triPairs = [[tl, bl, tr], [tr, bl, br]];
        for (const [i0, i1, i2] of triPairs) {
          const ax = positions[i1 * 3] - positions[i0 * 3];
          const ay = positions[i1 * 3 + 1] - positions[i0 * 3 + 1];
          const az = positions[i1 * 3 + 2] - positions[i0 * 3 + 2];
          const bx = positions[i2 * 3] - positions[i0 * 3];
          const by = positions[i2 * 3 + 1] - positions[i0 * 3 + 1];
          const bz = positions[i2 * 3 + 2] - positions[i0 * 3 + 2];

          let nx = ay * bz - az * by;
          let ny = az * bx - ax * bz;
          let nz = ax * by - ay * bx;

          for (const vi of [i0, i1, i2]) {
            normals[vi * 3]     += nx;
            normals[vi * 3 + 1] += ny;
            normals[vi * 3 + 2] += nz;
          }
        }
      }
    }
    for (let i = 0; i < numPts; i++) {
      const ix = i * 3;
      const len = Math.sqrt(normals[ix] ** 2 + normals[ix + 1] ** 2 + normals[ix + 2] ** 2);
      if (len > 0.0001) {
        normals[ix] /= len; normals[ix + 1] /= len; normals[ix + 2] /= len;
      } else {
        normals[ix + 2] = 1;
      }
    }
  }

  // ── GL Buffers ──────────────────────────────────────────────────────
  function createBuffer(data, usage) {
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, usage);
    return buf;
  }

  const posBuf = createBuffer(positions, gl.DYNAMIC_DRAW);
  const normBuf = createBuffer(normals, gl.DYNAMIC_DRAW);
  const uvBuf = createBuffer(uvs, gl.STATIC_DRAW);

  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

  // Background quad
  const bgVerts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const bgBuf = createBuffer(bgVerts, gl.STATIC_DRAW);

  // ── Matrix helpers ──────────────────────────────────────────────────
  function mat4Perspective(out, fov, aspect, near, far) {
    const f = 1 / Math.tan(fov / 2);
    out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
    out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
    out[8] = 0; out[9] = 0; out[10] = (far + near) / (near - far); out[11] = -1;
    out[12] = 0; out[13] = 0; out[14] = (2 * far * near) / (near - far); out[15] = 0;
    return out;
  }

  function mat4LookAt(out, eye, center, up) {
    let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    let len = Math.sqrt(zx*zx + zy*zy + zz*zz);
    zx /= len; zy /= len; zz /= len;
    let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
    len = Math.sqrt(xx*xx + xy*xy + xz*xz);
    xx /= len; xy /= len; xz /= len;
    const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
    out[0]=xx; out[1]=yx; out[2]=zx; out[3]=0;
    out[4]=xy; out[5]=yy; out[6]=zy; out[7]=0;
    out[8]=xz; out[9]=yz; out[10]=zz; out[11]=0;
    out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
    out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
    out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
    out[15]=1;
    return out;
  }

  function mat4Identity(out) {
    out.fill(0); out[0]=out[5]=out[10]=out[15]=1;
    return out;
  }

  function mat4Multiply(out, a, b) {
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        out[i*4+j] = a[i*4]*b[j] + a[i*4+1]*b[4+j] + a[i*4+2]*b[8+j] + a[i*4+3]*b[12+j];
      }
    }
    return out;
  }

  function mat3FromMat4(out, m) {
    out[0]=m[0]; out[1]=m[1]; out[2]=m[2];
    out[3]=m[4]; out[4]=m[5]; out[5]=m[6];
    out[6]=m[8]; out[7]=m[9]; out[8]=m[10];
    return out;
  }

  function mat3Invert(out, m) {
    const a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],g=m[6],h=m[7],i=m[9];
    const det = a*(e*i - f*h) - b*(d*i - f*g) + c*(d*h - e*g);
    if (Math.abs(det) < 1e-8) return out;
    const inv = 1 / det;
    out[0]=(e*i-f*h)*inv; out[1]=(c*h-b*i)*inv; out[2]=(b*f-c*e)*inv;
    out[3]=(f*g-d*i)*inv; out[4]=(a*i-c*g)*inv; out[5]=(c*d-a*f)*inv;
    out[6]=(d*h-e*g)*inv; out[7]=(b*g-a*h)*inv; out[8]=(a*e-b*d)*inv;
    return out;
  }

  const proj = new Float32Array(16);
  const view = new Float32Array(16);
  const vp = new Float32Array(16);
  const model = new Float32Array(16);
  const normalMat = new Float32Array(9);

  // ── Particles (atmospheric dust) ────────────────────────────────────
  const NUM_PARTICLES = 60;
  const particles = [];
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
      x: (Math.random() - 0.5) * 4,
      y: (Math.random() - 0.5) * 3,
      z: (Math.random() - 0.5) * 2 - 1,
      size: 1 + Math.random() * 2,
      speed: 0.2 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2
    });
  }

  const particleVert = `
    attribute vec2 aPos;
    attribute float aSize;
    attribute float aAlpha;
    uniform mat4 uVP;
    uniform vec3 uOffset;
    varying float vAlpha;
    void main() {
      vAlpha = aAlpha;
      vec4 wp = vec4(aPos.x + uOffset.x, aPos.y + uOffset.y, uOffset.z, 1.0);
      gl_Position = uVP * wp;
      gl_PointSize = aSize;
    }
  `;

  const particleFrag = `
    precision mediump float;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = (1.0 - d * 2.0) * vAlpha;
      gl_FragColor = vec4(0.7, 0.8, 0.95, alpha * 0.4);
    }
  `;

  const particleProg = linkProgram(compileShader(gl.VERTEX_SHADER, particleVert),
                                    compileShader(gl.FRAGMENT_SHADER, particleFrag));

  const particleData = new Float32Array(NUM_PARTICLES * 4); // x,y,size,alpha
  const particleBuf = createBuffer(particleData, gl.DYNAMIC_DRAW);

  // ── Render Loop ─────────────────────────────────────────────────────
  let lastTime = performance.now();
  let introProgress = 0;

  function render(now) {
    const dt = Math.min((now - lastTime) / 16.667, 2);
    lastTime = now;
    const time = now * 0.001;

    introProgress = Math.min(introProgress + dt * 0.008, 1);

    simulate(dt);
    computeNormals();

    // Update buffers
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions);
    gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, normals);

    // Update particles
    for (let i = 0; i < NUM_PARTICLES; i++) {
      const p = particles[i];
      p.x += (wind.x * 0.003 + 0.002) * p.speed;
      p.y += Math.sin(time * p.speed + p.phase) * 0.0008;
      if (p.x > 2.5) p.x = -2.5;
      particleData[i * 4]     = p.x;
      particleData[i * 4 + 1] = p.y;
      particleData[i * 4 + 2] = p.size;
      particleData[i * 4 + 3] = 0.3 + Math.sin(time + p.phase) * 0.2;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, particleBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, particleData);

    // Wind UI
    windFill.style.height = (wind.strength * 100) + '%';

    const aspect = W / H;
    mat4Perspective(proj, 45 * Math.PI / 180, aspect, 0.1, 50);

    const camSway = Math.sin(time * 0.3) * 0.05;
    mat4LookAt(view,
      [camSway, 0.05 + introProgress * 0.1, 2.8],
      [0, -0.05, 0],
      [0, 1, 0]
    );
    mat4Multiply(vp, proj, view);
    mat4Identity(model);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);

    // ── Background ──
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(bgProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);
    const bgPosLoc = gl.getAttribLocation(bgProg, 'aPos');
    gl.enableVertexAttribArray(bgPosLoc);
    gl.vertexAttribPointer(bgPosLoc, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1f(gl.getUniformLocation(bgProg, 'uTime'), time);
    gl.uniform2f(gl.getUniformLocation(bgProg, 'uRes'), W, H);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ── Particles ──
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(particleProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(particleProg, 'uVP'), false, vp);
    gl.bindBuffer(gl.ARRAY_BUFFER, particleBuf);
    const pPosLoc = gl.getAttribLocation(particleProg, 'aPos');
    const pSizeLoc = gl.getAttribLocation(particleProg, 'aSize');
    const pAlphaLoc = gl.getAttribLocation(particleProg, 'aAlpha');
    gl.enableVertexAttribArray(pPosLoc);
    gl.enableVertexAttribArray(pSizeLoc);
    gl.enableVertexAttribArray(pAlphaLoc);
    gl.vertexAttribPointer(pPosLoc, 2, gl.FLOAT, false, 16, 0);
    gl.vertexAttribPointer(pSizeLoc, 1, gl.FLOAT, false, 16, 8);
    gl.vertexAttribPointer(pAlphaLoc, 1, gl.FLOAT, false, 16, 12);
    gl.uniform3f(gl.getUniformLocation(particleProg, 'uOffset'), 0, 0, -0.5);
    gl.drawArrays(gl.POINTS, 0, NUM_PARTICLES);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    // ── Cloth ──
    gl.useProgram(clothProg);

    gl.uniformMatrix4fv(gl.getUniformLocation(clothProg, 'uVP'), false, vp);
    gl.uniformMatrix4fv(gl.getUniformLocation(clothProg, 'uModel'), false, model);

    const nm = new Float32Array(9);
    mat3FromMat4(nm, model);
    mat3Invert(normalMat, nm);
    gl.uniformMatrix3fv(gl.getUniformLocation(clothProg, 'uNormalMat'), false, normalMat);

    gl.uniform3f(gl.getUniformLocation(clothProg, 'uLightDir'), 0.4, 0.6, 0.7);
    gl.uniform3f(gl.getUniformLocation(clothProg, 'uLightColor'), 0.9, 0.92, 1.0);
    gl.uniform3f(gl.getUniformLocation(clothProg, 'uAmbient'), 0.12, 0.14, 0.2);
    gl.uniform3f(gl.getUniformLocation(clothProg, 'uClothColor'), 0.55, 0.62, 0.78);
    gl.uniform1f(gl.getUniformLocation(clothProg, 'uTime'), time);
    gl.uniform1f(gl.getUniformLocation(clothProg, 'uWindStrength'), wind.strength);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.enableVertexAttribArray(gl.getAttribLocation(clothProg, 'aPos'));
    gl.vertexAttribPointer(gl.getAttribLocation(clothProg, 'aPos'), 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
    gl.enableVertexAttribArray(gl.getAttribLocation(clothProg, 'aNormal'));
    gl.vertexAttribPointer(gl.getAttribLocation(clothProg, 'aNormal'), 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
    gl.enableVertexAttribArray(gl.getAttribLocation(clothProg, 'aUV'));
    gl.vertexAttribPointer(gl.getAttribLocation(clothProg, 'aUV'), 2, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    gl.drawElements(gl.TRIANGLES, numTris * 3, gl.UNSIGNED_SHORT, 0);

    gl.disable(gl.BLEND);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
