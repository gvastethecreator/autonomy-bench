<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Physics Sandbox</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1117;
      color: #e8eaed;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2f3d;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    button, select {
      background: #252936;
      color: #e8eaed;
      border: 1px solid #3a4050;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover, select:hover {
      background: #2f3444;
      border-color: #4a5570;
    }

    button.active {
      background: #3d5afe;
      border-color: #5c7cff;
    }

    button.danger:hover {
      background: #4a2028;
      border-color: #c0392b;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #aab0bc;
    }

    input[type="range"] {
      width: 90px;
      accent-color: #3d5afe;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 29, 39, 0.85);
      border: 1px solid #2a2f3d;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.78rem;
      color: #8891a0;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .stats {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(26, 29, 39, 0.85);
      border: 1px solid #2a2f3d;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.75rem;
      color: #8891a0;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <header>
    <h1>2D Physics Sandbox</h1>
    <div class="toolbar">
      <button id="btn-box" class="active" data-tool="box">Box</button>
      <button id="btn-circle" data-tool="circle">Circle</button>
      <button id="btn-polygon" data-tool="polygon">Polygon</button>
      <button id="btn-plank" data-tool="plank">Plank</button>
      <button id="btn-chain" data-tool="chain">Chain</button>
      <button id="btn-domino" data-tool="domino">Domino</button>
      <button id="btn-bomb" data-tool="bomb">Bomb</button>
      <select id="material">
        <option value="normal">Normal</option>
        <option value="bouncy">Bouncy</option>
        <option value="heavy">Heavy</option>
        <option value="light">Light</option>
        <option value="static">Static</option>
      </select>
      <label>
        Gravity
        <input type="range" id="gravity" min="0" max="2" step="0.05" value="1">
      </label>
      <button id="btn-pause">Pause</button>
      <button id="btn-clear" class="danger">Clear</button>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="world"></canvas>
    <div class="stats" id="stats"></div>
    <div class="hint">Click to spawn &middot; Drag to move &middot; Right-click to remove</div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Body, Composite, Composites, Constraint, Mouse, MouseConstraint, Events, Vector } = Matter;

    const canvas = document.getElementById('world');
    const container = document.getElementById('canvas-container');
    const statsEl = document.getElementById('stats');

    const engine = Engine.create({ gravity: { x: 0, y: 1 } });
    const world = engine.world;

    const render = Render.create({
      canvas,
      engine,
      options: {
        width: container.clientWidth,
        height: container.clientHeight,
        wireframes: false,
        background: '#12151c',
        pixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    const WALL_THICK = 60;
    let walls = [];

    function buildWalls() {
      Composite.remove(world, walls);
      const w = render.options.width;
      const h = render.options.height;
      const opts = { isStatic: true, render: { fillStyle: '#2a3040' }, friction: 0.8, restitution: 0.2 };
      walls = [
        Bodies.rectangle(w / 2, h + WALL_THICK / 2 - 1, w + WALL_THICK * 2, WALL_THICK, opts),
        Bodies.rectangle(w / 2, -WALL_THICK / 2 + 1, w + WALL_THICK * 2, WALL_THICK, opts),
        Bodies.rectangle(-WALL_THICK / 2 + 1, h / 2, WALL_THICK, h + WALL_THICK * 2, opts),
        Bodies.rectangle(w + WALL_THICK / 2 - 1, h / 2, WALL_THICK, h + WALL_THICK * 2, opts)
      ];
      Composite.add(world, walls);
    }

    buildWalls();

    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse,
      constraint: { stiffness: 0.15, render: { visible: false } }
    });
    Composite.add(world, mouseConstraint);
    render.mouse = mouse;

    render.canvas.addEventListener('contextmenu', e => e.preventDefault());

    const MATERIALS = {
      normal:  { density: 0.002, friction: 0.4, restitution: 0.3, render: { fillStyle: '#4a6cf7' } },
      bouncy:  { density: 0.0015, friction: 0.1, restitution: 0.92, render: { fillStyle: '#00c896' } },
      heavy:   { density: 0.008, friction: 0.6, restitution: 0.15, render: { fillStyle: '#e07040' } },
      light:   { density: 0.0005, friction: 0.3, restitution: 0.5, render: { fillStyle: '#c084fc' } },
      static:  { isStatic: true, friction: 0.8, restitution: 0.1, render: { fillStyle: '#6b7280' } }
    };

    let currentTool = 'box';
    let paused = false;
    let bodyCount = 0;

    function getMaterial() {
      const key = document.getElementById('material').value;
      return { ...MATERIALS[key] };
    }

    function randomColor() {
      const hues = [210, 250, 280, 160, 30, 350];
      const h = hues[Math.floor(Math.random() * hues.length)];
      return `hsl(${h}, 65%, 58%)`;
    }

    function spawnAt(x, y) {
      const mat = getMaterial();
      if (!mat.isStatic) {
        mat.render = { ...mat.render, fillStyle: randomColor() };
      }
      let body;

      switch (currentTool) {
        case 'box':
          body = Bodies.rectangle(x, y, 40 + Math.random() * 30, 40 + Math.random() * 30, {
            ...mat,
            chamfer: { radius: 4 }
          });
          break;

        case 'circle':
          body = Bodies.circle(x, y, 18 + Math.random() * 22, mat);
          break;

        case 'polygon': {
          const sides = 5 + Math.floor(Math.random() * 4);
          body = Bodies.polygon(x, y, sides, 22 + Math.random() * 18, mat);
          break;
        }

        case 'plank':
          body = Bodies.rectangle(x, y, 120 + Math.random() * 80, 14, {
            ...mat,
            chamfer: { radius: 2 }
          });
          break;

        case 'chain':
          spawnChain(x, y);
          return;

        case 'domino':
          spawnDominoes(x, y);
          return;

        case 'bomb':
          spawnBomb(x, y);
          return;
      }

      Composite.add(world, body);
      bodyCount++;
    }

    function spawnChain(x, y) {
      const mat = getMaterial();
      const count = 8;
      const linkW = 18;
      const linkH = 28;
      const parts = [];

      for (let i = 0; i < count; i++) {
        const part = Bodies.rectangle(x, y + i * (linkH + 4), linkW, linkH, {
          ...mat,
          render: { fillStyle: randomColor() },
          chamfer: { radius: 3 }
        });
        parts.push(part);
      }

      const chain = Composites.chain(Composite.create({ bodies: parts }), 0, -linkH / 2, 0, linkH / 2, {
        stiffness: 0.9,
        length: 2,
        render: { strokeStyle: '#8891a0', lineWidth: 2 }
      });

      const anchor = Constraint.create({
        pointA: { x, y: y - 40 },
        bodyB: parts[0],
        pointB: { x: 0, y: -linkH / 2 },
        stiffness: 1,
        length: 0
      });

      Composite.add(world, [chain, anchor]);
      bodyCount += count;
    }

    function spawnDominoes(x, y) {
      const mat = getMaterial();
      const count = 10;
      const spacing = 22;
      for (let i = 0; i < count; i++) {
        const domino = Bodies.rectangle(x + i * spacing, y, 10, 40, {
          ...mat,
          render: { fillStyle: randomColor() },
          chamfer: { radius: 2 }
        });
        Composite.add(world, domino);
        bodyCount++;
      }
    }

    function spawnBomb(x, y) {
      const core = Bodies.circle(x, y, 16, {
        density: 0.003,
        friction: 0.3,
        restitution: 0.4,
        render: { fillStyle: '#ef4444' },
        label: 'bomb'
      });
      Composite.add(world, core);
      bodyCount++;

      setTimeout(() => {
        if (!Composite.get(world, core.id, 'body')) return;
        const pos = core.position;
        const radius = 180;
        const force = 0.08;

        Composite.allBodies(world).forEach(b => {
          if (b.isStatic || b.label === 'bomb') return;
          const dx = b.position.x - pos.x;
          const dy = b.position.y - pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < radius) {
            const strength = (1 - dist / radius) * force;
            Body.applyForce(b, b.position, {
              x: (dx / dist) * strength * b.mass * 50,
              y: (dy / dist) * strength * b.mass * 50
            });
          }
        });

        Composite.remove(world, core);
        bodyCount--;

        for (let i = 0; i < 12; i++) {
          const angle = (Math.PI * 2 * i) / 12;
          const fragment = Bodies.circle(
            pos.x + Math.cos(angle) * 8,
            pos.y + Math.sin(angle) * 8,
            4 + Math.random() * 4,
            {
              density: 0.001,
              friction: 0.2,
              restitution: 0.6,
              render: { fillStyle: '#f97316' }
            }
          );
          Body.setVelocity(fragment, {
            x: Math.cos(angle) * (4 + Math.random() * 6),
            y: Math.sin(angle) * (4 + Math.random() * 6)
          });
          Composite.add(world, fragment);
          bodyCount++;
        }
      }, 1500);
    }

    let spawnPending = false;

    Events.on(mouseConstraint, 'mouseup', () => {
      if (spawnPending) {
        spawnPending = false;
        return;
      }
      if (mouseConstraint.body) return;
      spawnAt(mouse.position.x, mouse.position.y);
    });

    Events.on(mouseConstraint, 'mousedown', () => {
      if (mouseConstraint.body) return;
      spawnPending = true;
    });

    Events.on(render, 'afterRender', () => {
      const ctx = render.context;
      if (currentTool === 'bomb') {
        Composite.allBodies(world).forEach(b => {
          if (b.label !== 'bomb') return;
          const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 100);
          ctx.beginPath();
          ctx.arc(b.position.x, b.position.y, 22 * pulse, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(239, 68, 68, ${0.3 + pulse * 0.3})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }
    });

    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
      });
    });

    document.getElementById('gravity').addEventListener('input', e => {
      engine.gravity.y = parseFloat(e.target.value);
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
      paused = !paused;
      runner.enabled = !paused;
      document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      Composite.allBodies(world).forEach(b => {
        if (!b.isStatic || !walls.includes(b)) {
          if (!walls.includes(b)) Composite.remove(world, b);
        }
      });
      bodyCount = 0;
    });

    Events.on(mouseConstraint, 'mousedown', e => {
      if (e.source.body && e.mouse.button === 2) {
        if (!walls.includes(e.source.body)) {
          Composite.remove(world, e.source.body);
          bodyCount = Math.max(0, bodyCount - 1);
        }
      }
    });

    Events.on(engine, 'afterUpdate', () => {
      const bodies = Composite.allBodies(world).filter(b => !walls.includes(b));
      statsEl.innerHTML =
        `Bodies: ${bodies.length}<br>` +
        `Gravity: ${engine.gravity.y.toFixed(2)}<br>` +
        `FPS: ~${Math.round(1000 / (engine.timing.lastDelta || 16))}`;
    });

    function resize() {
      render.options.width = container.clientWidth;
      render.options.height = container.clientHeight;
      render.canvas.width = render.options.width * render.options.pixelRatio;
      render.canvas.height = render.options.height * render.options.pixelRatio;
      render.canvas.style.width = render.options.width + 'px';
      render.canvas.style.height = render.options.height + 'px';
      buildWalls();
    }

    window.addEventListener('resize', resize);

    (function seedScene() {
      const w = render.options.width;
      const h = render.options.height;

      const platform = Bodies.rectangle(w * 0.5, h * 0.72, w * 0.55, 16, {
        isStatic: true,
        angle: -0.08,
        render: { fillStyle: '#3a4050' },
        friction: 0.8
      });

      const ramp = Bodies.rectangle(w * 0.25, h * 0.55, w * 0.35, 16, {
        isStatic: true,
        angle: 0.35,
        render: { fillStyle: '#3a4050' },
        friction: 0.6
      });

      Composite.add(world, [platform, ramp]);

      for (let i = 0; i < 6; i++) {
        const bx = w * 0.55 + i * 35;
        const by = h * 0.65 - i * 42;
        Composite.add(world, Bodies.rectangle(bx, by, 32, 32, {
          density: 0.002,
          friction: 0.4,
          restitution: 0.2,
          render: { fillStyle: `hsl(${210 + i * 15}, 60%, 55%)` },
          chamfer: { radius: 3 }
        }));
        bodyCount++;
      }

      for (let i = 0; i < 4; i++) {
        Composite.add(world, Bodies.circle(w * 0.3 + i * 40, h * 0.42, 16, {
          density: 0.0015,
          restitution: 0.5,
          render: { fillStyle: `hsl(${160 + i * 20}, 65%, 55%)` }
        }));
        bodyCount++;
      }
    })();
  </script>
</body>
</html>
