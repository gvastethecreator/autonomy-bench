<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Signal Lost</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e17;
    --fg: #c8d6e5;
    --accent: #00f5d4;
    --accent-dim: #00f5d433;
    --warn: #ff6b6b;
    --glow: #00f5d488;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  canvas#field {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .overlay {
    position: fixed; inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 2rem;
  }

  .code {
    font-size: clamp(6rem, 18vw, 14rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    color: transparent;
    background: linear-gradient(135deg, var(--accent) 0%, #7bfff0 40%, var(--warn) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 40px var(--glow));
    animation: pulse 3s ease-in-out infinite;
    user-select: none;
    position: relative;
  }

  .code.glitch::before,
  .code.glitch::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    background: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .code.glitch::before {
    animation: glitch1 2.5s infinite linear;
    clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
  }

  .code.glitch::after {
    animation: glitch2 2.5s infinite linear;
    clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.01); }
  }

  @keyframes glitch1 {
    0%, 90%, 100% { transform: translate(0); }
    92% { transform: translate(-4px, 2px); }
    94% { transform: translate(3px, -1px); }
    96% { transform: translate(-2px, -2px); }
  }

  @keyframes glitch2 {
    0%, 90%, 100% { transform: translate(0); }
    91% { transform: translate(3px, -2px); }
    93% { transform: translate(-3px, 1px); }
    95% { transform: translate(2px, 2px); }
  }

  .subtitle {
    margin-top: 1.25rem;
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.7;
    text-align: center;
  }

  .message {
    margin-top: 2rem;
    max-width: 28rem;
    text-align: center;
    font-size: 1.05rem;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    min-height: 3.2em;
  }

  .message.visible {
    opacity: 0.85;
    transform: translateY(0);
  }

  .controls {
    margin-top: 2.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  button, a.btn {
    appearance: none;
    border: 1px solid var(--accent-dim);
    background: #0a0e17cc;
    color: var(--accent);
    padding: 0.75rem 1.75rem;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    text-decoration: none;
    transition: background 0.25s, box-shadow 0.25s, transform 0.15s;
    backdrop-filter: blur(8px);
  }

  button:hover, a.btn:hover {
    background: var(--accent-dim);
    box-shadow: 0 0 24px var(--glow);
    transform: translateY(-1px);
  }

  button:active, a.btn:active { transform: translateY(0); }

  .hint {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.35;
    z-index: 2;
    pointer-events: none;
    animation: fadeHint 4s ease-in-out infinite;
  }

  @keyframes fadeHint {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.5; }
  }

  .scan-ring {
    position: fixed;
    width: 80px; height: 80px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }

  .scan-ring.active {
    animation: ringExpand 0.8s ease-out forwards;
  }

  @keyframes ringExpand {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }

  .coords {
    position: fixed;
    top: 1rem; left: 1rem;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    opacity: 0.4;
    z-index: 2;
    pointer-events: none;
    line-height: 1.7;
  }

  .fragments {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .fragment {
    position: absolute;
    font-family: "Consolas", monospace;
    font-size: 0.65rem;
    color: var(--accent);
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.4s;
  }

  .fragment.found { opacity: 0.55; }

  .progress-bar {
    position: fixed;
    bottom: 0; left: 0;
    height: 2px;
    background: var(--accent);
    width: 0%;
    transition: width 0.4s ease;
    z-index: 3;
    box-shadow: 0 0 8px var(--glow);
  }

  .victory {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e17ee;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  .victory.show {
    opacity: 1;
    pointer-events: auto;
  }

  .victory-inner {
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .victory.show .victory-inner { transform: scale(1); }

  .victory h2 {
    font-size: 2rem;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .victory p {
    opacity: 0.7;
    margin-bottom: 2rem;
    max-width: 24rem;
    line-height: 1.5;
  }
</style>
</head>
<body>

<canvas id="field"></canvas>

<div class="fragments" id="fragments"></div>

<div class="overlay">
  <div class="code glitch" id="code" data-text="404">404</div>
  <p class="subtitle">Signal Lost</p>
  <p class="message" id="message"></p>
  <div class="controls">
    <button id="pingBtn">Send Ping</button>
    <button id="scanBtn">Deep Scan</button>
    <a class="btn" href="/">Return Home</a>
  </div>
</div>

<div class="coords" id="coords">
  LAT ---.------<br>
  LNG ---.------<br>
  SIG ░░░░░░░░░░
</div>

<p class="hint">Click anywhere to ping · Find all 5 signal fragments</p>
<div class="progress-bar" id="progress"></div>

<div class="victory" id="victory">
  <div class="victory-inner">
    <h2>Signal Restored</h2>
    <p>You found every fragment of the lost transmission. The page may be gone, but the connection endures.</p>
    <a class="btn" href="/">Go Home</a>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const codeEl = document.getElementById('code');
  const messageEl = document.getElementById('message');
  const coordsEl = document.getElementById('coords');
  const fragmentsEl = document.getElementById('fragments');
  const progressEl = document.getElementById('progress');
  const victoryEl = document.getElementById('victory');

  let W, H, mx = 0, my = 0;
  const particles = [];
  const pings = [];
  const stars = [];

  const messages = [
    "This coordinate doesn't exist in our navigation grid.",
    "The page drifted beyond the event horizon.",
    "Nothing here but cosmic static and regret.",
    "Your request reached the void. It didn't ping back.",
    "404: The universe forgot to save this URL.",
    "Transmission failed. Destination unreachable.",
    "Somewhere, a server shrugged.",
  ];

  const fragmentTexts = [
    'ERR_NULL_PTR',
    'PAGE_NOT_FOUND',
    'ROUTE_EXPIRED',
    'CACHE_MISS',
    'GHOST_LINK',
  ];

  const foundFragments = new Set();
  let msgIndex = 0;
  let deepScanActive = false;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        tw: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005,
      });
    }
  }

  function spawnParticle(x, y, burst) {
    const count = burst ? 24 : 3;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = burst ? Math.random() * 3 + 1 : Math.random() * 0.8 + 0.2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: burst ? 60 + Math.random() * 40 : 80 + Math.random() * 60,
        maxLife: burst ? 100 : 140,
        size: burst ? Math.random() * 2.5 + 1 : Math.random() * 1.5 + 0.5,
      });
    }
  }

  function addPing(x, y) {
    pings.push({ x, y, r: 0, maxR: Math.min(W, H) * 0.35, life: 0, maxLife: 90 });
    spawnParticle(x, y, true);
    showMessage(messages[msgIndex % messages.length]);
    msgIndex++;
    checkFragmentHit(x, y);
    spawnScanRing(x, y);
  }

  function spawnScanRing(x, y) {
    const ring = document.createElement('div');
    ring.className = 'scan-ring active';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    document.body.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
  }

  function showMessage(text) {
    messageEl.classList.remove('visible');
    setTimeout(() => {
      messageEl.textContent = text;
      messageEl.classList.add('visible');
    }, 200);
  }

  function placeFragments() {
    fragmentsEl.innerHTML = '';
    fragmentTexts.forEach((text, i) => {
      const el = document.createElement('span');
      el.className = 'fragment';
      el.textContent = text;
      el.dataset.index = i;
      const margin = 80;
      el.style.left = (margin + Math.random() * (W - margin * 2)) + 'px';
      el.style.top = (margin + Math.random() * (H - margin * 2)) + 'px';
      el.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
      fragmentsEl.appendChild(el);
    });
  }

  function checkFragmentHit(px, py) {
    document.querySelectorAll('.fragment:not(.found)').forEach(el => {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.hypot(px - cx, py - cy);
      if (dist < 60) {
        const idx = el.dataset.index;
        foundFragments.add(idx);
        el.classList.add('found');
        spawnParticle(cx, cy, true);
        updateProgress();
      }
    });
  }

  function updateProgress() {
    const pct = (foundFragments.size / fragmentTexts.length) * 100;
    progressEl.style.width = pct + '%';
    if (foundFragments.size === fragmentTexts.length) {
      setTimeout(() => victoryEl.classList.add('show'), 600);
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0e17';
    ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      s.tw += s.speed;
      const alpha = 0.3 + Math.sin(s.tw) * 0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 214, 229, ${alpha})`;
      ctx.fill();
    }

    // scanner sweep
    const sweepAngle = (Date.now() * 0.0008) % (Math.PI * 2);
    const grad = ctx.createConicGradient(sweepAngle, mx, my);
    grad.addColorStop(0, 'rgba(0, 245, 212, 0)');
    grad.addColorStop(0.08, 'rgba(0, 245, 212, 0.06)');
    grad.addColorStop(0.15, 'rgba(0, 245, 212, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // crosshair at mouse
    ctx.strokeStyle = 'rgba(0, 245, 212, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx, 0); ctx.lineTo(mx, H);
    ctx.moveTo(0, my); ctx.lineTo(W, my);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(mx, my, 20, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 245, 212, 0.25)';
    ctx.stroke();

    // pings
    for (let i = pings.length - 1; i >= 0; i--) {
      const p = pings[i];
      p.life++;
      p.r = (p.life / p.maxLife) * p.maxR;
      const alpha = 1 - p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 245, 212, ${alpha * 0.5})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      if (p.life >= p.maxLife) pings.splice(i, 1);
    }

    // deep scan waves
    if (deepScanActive) {
      const waveR = (Date.now() % 3000) / 3000 * Math.max(W, H) * 0.6;
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, waveR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 107, 107, 0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.01;
      p.life--;
      const alpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 245, 212, ${alpha * 0.8})`;
      ctx.fill();
      if (p.life <= 0) particles.splice(i, 1);
    }

    // ambient drift particles
    if (Math.random() < 0.15) {
      spawnParticle(Math.random() * W, Math.random() * H, false);
    }

    // update coords display
    const lat = ((my / H) * 180 - 90).toFixed(4);
    const lng = ((mx / W) * 360 - 180).toFixed(4);
    const sigStr = '█'.repeat(Math.floor(foundFragments.size * 2)) +
                   '░'.repeat(10 - Math.floor(foundFragments.size * 2));
    coordsEl.innerHTML = `LAT ${lat}<br>LNG ${lng}<br>SIG ${sigStr}`;

    requestAnimationFrame(draw);
  }

  // glitch intensity on idle
  let idleTimer;
  function resetIdle() {
    clearTimeout(idleTimer);
    codeEl.classList.add('glitch');
    idleTimer = setTimeout(() => {
      codeEl.classList.remove('glitch');
      setTimeout(() => codeEl.classList.add('glitch'), 200);
    }, 8000);
  }

  document.getElementById('pingBtn').addEventListener('click', () => {
    addPing(mx || W / 2, my || H / 2);
  });

  document.getElementById('scanBtn').addEventListener('click', () => {
    deepScanActive = !deepScanActive;
    document.getElementById('scanBtn').textContent = deepScanActive ? 'Scanning…' : 'Deep Scan';
    if (deepScanActive) {
      showMessage('Deep scan initiated. Hidden fragments may appear…');
      document.querySelectorAll('.fragment:not(.found)').forEach(el => {
        el.style.opacity = '0.25';
      });
      setTimeout(() => {
        deepScanActive = false;
        document.getElementById('scanBtn').textContent = 'Deep Scan';
        document.querySelectorAll('.fragment:not(.found)').forEach(el => {
          el.style.opacity = '';
        });
      }, 5000);
    }
  });

  canvas.addEventListener('click', e => addPing(e.clientX, e.clientY));
  canvas.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
    resetIdle();
  });

  window.addEventListener('resize', () => { resize(); placeFragments(); });
  window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      addPing(mx || W / 2, my || H / 2);
    }
  });

  resize();
  placeFragments();
  showMessage(messages[0]);
  resetIdle();
  draw();
})();
</script>
</body>
</html>
