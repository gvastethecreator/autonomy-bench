<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep: #0a0e17;
      --bg-mid: #111827;
      --accent: #6366f1;
      --accent-glow: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --ring-track: rgba(255, 255, 255, 0.08);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99, 102, 241, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139, 92, 246, 0.12) 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      z-index: 0;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 75%);
      z-index: 0;
      animation: grid-drift 20s linear infinite;
    }

    @keyframes grid-drift {
      from { transform: translateY(0); }
      to   { transform: translateY(48px); }
    }

    .loader {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 2rem;
      animation: fade-in 0.8s ease-out both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ring-wrap {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--ring-track);
    }

    .ring--spin {
      border-color: transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-glow);
      animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.5));
    }

    .ring--pulse {
      inset: -8px;
      border: 1px solid var(--accent-soft);
      animation: pulse-ring 2.4s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%       { transform: scale(1.08); opacity: 0.2; }
    }

    .core {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .core-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(99, 102, 241, 0.4);
      animation: core-breathe 1.8s ease-in-out infinite;
    }

    @keyframes core-breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(0.75); opacity: 0.7; }
    }

    .content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .title {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      font-size: 0.875rem;
      color: var(--text-muted);
      min-height: 1.25rem;
      transition: opacity 0.3s ease;
    }

    .progress-track {
      width: min(280px, 72vw);
      height: 4px;
      background: var(--ring-track);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-glow));
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    }

    .progress-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 100%
      );
      animation: shimmer 1.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .percent {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .dots {
      display: flex;
      gap: 6px;
      margin-top: 0.25rem;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.3;
      animation: dot-wave 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-wave {
      0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
      40%           { opacity: 1; transform: scale(1.3); }
    }

    .loaded {
      animation: loaded-out 0.6s ease-in forwards;
    }

    @keyframes loaded-out {
      to {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
    }

    .done-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .done-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .done-msg {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
      animation: fade-in 0.5s ease-out both;
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="ring-wrap" aria-hidden="true">
      <div class="ring ring--pulse"></div>
      <div class="ring ring--spin"></div>
      <div class="core"><div class="core-dot"></div></div>
    </div>

    <div class="content">
      <h1 class="title">Loading</h1>
      <p class="status" id="status">Initializing…</p>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress"></div>
        <div class="progress-shimmer"></div>
      </div>

      <span class="percent" id="percent">0%</span>

      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </div>
  </main>

  <div class="done-screen" id="done" aria-hidden="true">
    <p class="done-msg">Ready</p>
  </div>

  <script>
    (function () {
      const messages = [
        'Initializing…',
        'Loading assets…',
        'Preparing interface…',
        'Almost there…',
        'Finishing up…'
      ];

      const progressEl = document.getElementById('progress');
      const statusEl = document.getElementById('status');
      const percentEl = document.getElementById('percent');
      const loaderEl = document.getElementById('loader');
      const doneEl = document.getElementById('done');

      let progress = 0;
      let msgIndex = 0;
      const totalDuration = 4200;
      const tick = 40;
      const steps = totalDuration / tick;
      const increment = 100 / steps;

      const interval = setInterval(function () {
        progress = Math.min(100, progress + increment + (Math.random() * 0.6));

        const msgThreshold = (msgIndex + 1) * (100 / messages.length);
        if (progress >= msgThreshold && msgIndex < messages.length - 1) {
          msgIndex++;
          statusEl.style.opacity = '0';
          setTimeout(function () {
            statusEl.textContent = messages[msgIndex];
            statusEl.style.opacity = '1';
          }, 150);
        }

        progressEl.style.width = progress + '%';
        percentEl.textContent = Math.floor(progress) + '%';

        if (progress >= 100) {
          clearInterval(interval);
          progressEl.style.width = '100%';
          percentEl.textContent = '100%';
          statusEl.textContent = 'Complete';

          setTimeout(function () {
            loaderEl.classList.add('loaded');
            doneEl.classList.add('visible');
            doneEl.setAttribute('aria-hidden', 'false');
            loaderEl.setAttribute('aria-hidden', 'true');
          }, 400);
        }
      }, tick);
    })();
  </script>
</body>
</html>
