<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; color: #8cf;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      text-shadow: 0 0 8px rgba(0,180,255,.6);
      pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="hud">Self-navigating infinite maze</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
(function () {
  "use strict";

  const CELL = 2;
  const WALL_H = 2.6;
  const EYE = 1.55;
  const CHUNK = 10;
  const VIEW = 5;
  const MOVE_SPEED = 2.4;
  const TURN_SPEED = 2.8;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 6, 38);

  const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 80);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x334466, 0.55));
  const torch = new THREE.PointLight(0x88ccff, 1.4, 22, 1.6);
  scene.add(torch);
  const fill = new THREE.DirectionalLight(0x446688, 0.25);
  fill.position.set(3, 8, -2);
  scene.add(fill);

  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x3a4a6a, roughness: 0.85, metalness: 0.08
  });
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x1a2233, roughness: 0.95, metalness: 0.02
  });
  const ceilMat = new THREE.MeshStandardMaterial({
    color: 0x121820, roughness: 1, metalness: 0
  });
  const accentMat = new THREE.MeshStandardMaterial({
    color: 0x5a8aaa, emissive: 0x224466, emissiveIntensity: 0.35,
    roughness: 0.6, metalness: 0.15
  });

  const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const floorGeo = new THREE.BoxGeometry(CELL, 0.12, CELL);
  const ceilGeo = new THREE.BoxGeometry(CELL, 0.08, CELL);
  const pillarGeo = new THREE.BoxGeometry(0.18, WALL_H, 0.18);

  const chunks = new Map();
  const meshes = [];

  function seed(x, z) {
    let h = (x * 374761393 + z * 668265263) ^ 0x9e3779b9;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  function rng(s) {
    s = Math.imul(s ^ (s >>> 15), s | 1);
    s ^= s + Math.imul(s ^ (s >>> 7), s | 61);
    return ((s ^ (s >>> 14)) >>> 0) / 4294967296;
  }

  function chunkKey(cx, cz) { return cx + "," + cz; }

  function generateChunk(cx, cz) {
    const key = chunkKey(cx, cz);
    if (chunks.has(key)) return chunks.get(key);

    const size = CHUNK * 2 + 1;
    const grid = new Uint8Array(size * size);
    const visited = new Uint8Array(size * size);
    const stack = [];

    function idx(gx, gz) { return gz * size + gx; }
    function inBounds(gx, gz) { return gx >= 0 && gz >= 0 && gx < size && gz < size; }

    let sx = 1, sz = 1;
    visited[idx(sx, sz)] = 1;
    stack.push([sx, sz]);

    while (stack.length) {
      const [x, z] = stack[stack.length - 1];
      const dirs = [[0, -2], [2, 0], [0, 2], [-2, 0]];
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = Math.floor(rng(seed(cx, cz) + x * 97 + z * 131 + i) * (i + 1));
        [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
      }
      let carved = false;
      for (const [dx, dz] of dirs) {
        const nx = x + dx, nz = z + dz;
        if (!inBounds(nx, nz) || visited[idx(nx, nz)]) continue;
        grid[idx(x + dx / 2, z + dz / 2)] = 1;
        grid[idx(nx, nz)] = 1;
        visited[idx(nx, nz)] = 1;
        stack.push([nx, nz]);
        carved = true;
        break;
      }
      if (!carved) stack.pop();
    }

    for (let gz = 0; gz < size; gz++) {
      for (let gx = 0; gx < size; gx++) {
        if (grid[idx(gx, gz)] === 0) grid[idx(gx, gz)] = 2;
      }
    }

    const worldOriginX = cx * CHUNK * CELL;
    const worldOriginZ = cz * CHUNK * CELL;

    const data = { grid, size, worldOriginX, worldOriginZ, cx, cz };
    chunks.set(key, data);
    return data;
  }

  function worldToCell(wx, wz) {
    return [Math.floor(wx / CELL + 0.5), Math.floor(wz / CELL + 0.5)];
  }

  function cellToWorld(gx, gz) {
    return [gx * CELL, gz * CELL];
  }

  function getCell(gx, gz) {
    const cx = Math.floor(gx / CHUNK);
    const cz = Math.floor(gz / CHUNK);
    const chunk = generateChunk(cx, cz);
    const lx = ((gx % CHUNK) + CHUNK) % CHUNK;
    const lz = ((gz % CHUNK) + CHUNK) % CHUNK;
    const size = chunk.size;
    const ix = lx * 2 + 1;
    const iz = lz * 2 + 1;
    if (ix < 0 || iz < 0 || ix >= size || iz >= size) return 2;
    return chunk.grid[iz * size + ix];
  }

  function isPassage(gx, gz) {
    return getCell(gx, gz) === 1;
  }

  function buildChunkMeshes(cx, cz) {
    const chunk = generateChunk(cx, cz);
    const group = new THREE.Group();
    const { grid, size, worldOriginX, worldOriginZ } = chunk;

    for (let gz = 0; gz < size; gz++) {
      for (let gx = 0; gx < size; gx++) {
        const val = grid[gz * size + gx];
        const wx = worldOriginX + (gx - size / 2) * CELL * 0.5 + CELL * 0.5;
        const wz = worldOriginZ + (gz - size / 2) * CELL * 0.5 + CELL * 0.5;

        if (val === 1) {
          const floor = new THREE.Mesh(floorGeo, floorMat);
          floor.position.set(wx, -0.06, wz);
          group.add(floor);
          const ceil = new THREE.Mesh(ceilGeo, ceilMat);
          ceil.position.set(wx, WALL_H + 0.04, wz);
          group.add(ceil);
        } else if (val === 2) {
          const wall = new THREE.Mesh(wallGeo, wallMat);
          wall.position.set(wx, WALL_H / 2, wz);
          group.add(wall);
          if ((gx + gz) % 5 === 0) {
            const pillar = new THREE.Mesh(pillarGeo, accentMat);
            pillar.position.set(wx, WALL_H / 2, wz);
            group.add(pillar);
          }
        }
      }
    }

    scene.add(group);
    meshes.push({ cx, cz, group });
  }

  function pruneMeshes(px, pz) {
    const pcx = Math.floor(px / (CHUNK * CELL));
    const pcz = Math.floor(pz / (CHUNK * CELL));
    for (let i = meshes.length - 1; i >= 0; i--) {
      const m = meshes[i];
      if (Math.abs(m.cx - pcx) > VIEW + 1 || Math.abs(m.cz - pcz) > VIEW + 1) {
        scene.remove(m.group);
        m.group.traverse(o => {
          if (o.geometry && o.geometry !== wallGeo && o.geometry !== floorGeo &&
              o.geometry !== ceilGeo && o.geometry !== pillarGeo) o.geometry.dispose();
        });
        meshes.splice(i, 1);
      }
    }
  }

  function updateVisibleChunks(px, pz) {
    const pcx = Math.floor(px / (CHUNK * CELL));
    const pcz = Math.floor(pz / (CHUNK * CELL));
    for (let dz = -VIEW; dz <= VIEW; dz++) {
      for (let dx = -VIEW; dx <= VIEW; dx++) {
        const cx = pcx + dx, cz = pcz + dz;
        if (!meshes.some(m => m.cx === cx && m.cz === cz)) buildChunkMeshes(cx, cz);
      }
    }
    pruneMeshes(px, pz);
  }

  const DIRS = [
    { dx: 0, dz: -1, angle: 0 },
    { dx: 1, dz: 0, angle: -Math.PI / 2 },
    { dx: 0, dz: 1, angle: Math.PI },
    { dx: -1, dz: 0, angle: Math.PI / 2 }
  ];

  let gridX = 0, gridZ = 0, dir = 0;
  let posX = 0, posZ = 0;
  let yaw = 0, targetYaw = 0;
  let moving = false;
  let targetGX = 0, targetGZ = 0;
  let moveT = 0;
  let fromX = 0, fromZ = 0;

  function leftDir(d) { return (d + 3) % 4; }
  function rightDir(d) { return (d + 1) % 4; }
  function backDir(d) { return (d + 2) % 4; }

  function canMoveFrom(gx, gz, d) {
    const { dx, dz } = DIRS[d];
    return isPassage(gx + dx, gz + dz);
  }

  function chooseNextDirection() {
    const gx = gridX, gz = gridZ;
    const left = leftDir(dir);
    const right = rightDir(dir);
    const back = backDir(dir);

    if (canMoveFrom(gx, gz, dir)) return dir;
    if (canMoveFrom(gx, gz, left)) return left;
    if (canMoveFrom(gx, gz, right)) return right;
    if (canMoveFrom(gx, gz, back)) return back;
    return dir;
  }

  function startMove() {
    const nextDir = chooseNextDirection();
    if (nextDir !== dir) {
      dir = nextDir;
      targetYaw = DIRS[dir].angle;
      moving = false;
      return;
    }
    const { dx, dz } = DIRS[dir];
    const ngx = gridX + dx, ngz = gridZ + dz;
    if (!isPassage(ngx, ngz)) {
      targetYaw = DIRS[chooseNextDirection()].angle;
      dir = chooseNextDirection();
      return;
    }
    fromX = posX;
    fromZ = posZ;
    targetGX = ngx;
    targetGZ = ngz;
    moveT = 0;
    moving = true;
  }

  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function lerpAngle(a, b, t) {
    let d = normalizeAngle(b - a);
    if (d > Math.PI) d -= Math.PI * 2;
    return a + d * t;
  }

  generateChunk(0, 0);
  gridX = 0; gridZ = 0;
  [posX, posZ] = cellToWorld(gridX, gridZ);
  targetYaw = yaw = DIRS[dir].angle;
  updateVisibleChunks(posX, posZ);

  let last = performance.now();

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    const yawDiff = normalizeAngle(targetYaw - yaw);
    if (Math.abs(yawDiff) > 0.02) {
      yaw = lerpAngle(yaw, targetYaw, Math.min(1, TURN_SPEED * dt));
    } else {
      yaw = targetYaw;
      if (!moving) startMove();
    }

    if (moving) {
      moveT += MOVE_SPEED * dt;
      if (moveT >= 1) {
        moveT = 1;
        gridX = targetGX;
        gridZ = targetGZ;
        [posX, posZ] = cellToWorld(gridX, gridZ);
        moving = false;
      } else {
        const [tx, tz] = cellToWorld(targetGX, targetGZ);
        const ease = moveT * moveT * (3 - 2 * moveT);
        posX = fromX + (tx - fromX) * ease;
        posZ = fromZ + (tz - fromZ) * ease;
      }
    }

    const bob = moving ? Math.sin(moveT * Math.PI) * 0.04 : 0;
    camera.position.set(posX, EYE + bob, posZ);
    camera.rotation.set(0, yaw, 0, "YXZ");

    torch.position.set(posX, EYE + 0.1, posZ);
    torch.position.x += Math.sin(yaw) * 0.3;
    torch.position.z += Math.cos(yaw) * 0.3;

    updateVisibleChunks(posX, posZ);
    renderer.render(scene, camera);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  requestAnimationFrame(tick);
})();
  </script>
</body>
</html>
