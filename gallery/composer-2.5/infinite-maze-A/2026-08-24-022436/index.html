<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Self-Navigating Maze</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 16px; left: 16px;
      font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
      color: rgba(180, 220, 255, 0.85);
      pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    #hud span { color: #7ec8ff; font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">Infinite Maze · <span id="pos">0, 0</span> · cells <span id="cells">0</span></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ── Config ──────────────────────────────────────────────────────────────
    const CELL = 4;
    const WALL_H = 3.2;
    const EYE = 1.55;
    const CHUNK = 8;
    const VIEW = 3;
    const SPEED = 3.2;
    const TURN = 2.4;
    const WALL_T = 0.18;

    // ── Seeded RNG (deterministic per cell) ─────────────────────────────────
    function hash2(x, y) {
      let h = (x * 374761393 + y * 668265263) ^ 0xdeadbeef;
      h = (h ^ (h >>> 13)) * 1274126177;
      return (h ^ (h >>> 16)) >>> 0;
    }
    function rng(seed) {
      let s = seed;
      return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    }

    // ── Maze topology: perfect maze per chunk, stitched at borders ──────────
    // Each cell stores wall bits: N=1 E=2 S=4 W=8 (1 = wall present)
    const maze = new Map();

    function key(cx, cy) { return cx + ',' + cy; }
    function cellKey(gx, gy) { return gx + ',' + gy; }

    function getCell(gx, gy) {
      const k = cellKey(gx, gy);
      if (!maze.has(k)) generateCell(gx, gy);
      return maze.get(k);
    }

    function generateCell(gx, gy) {
      const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
      const ck = key(cx, cy);
      if (!maze.has('chunk:' + ck)) generateChunk(cx, cy);
      return maze.get(cellKey(gx, gy));
    }

    function generateChunk(cx, cy) {
      const local = [];
      for (let y = 0; y < CHUNK; y++) {
        for (let x = 0; x < CHUNK; x++) {
          local.push({ gx: cx * CHUNK + x, gy: cy * CHUNK + y, walls: 15 });
        }
      }
      const idx = (x, y) => y * CHUNK + x;
      const rand = rng(hash2(cx, cy));

      // Recursive backtracker within chunk
      const visited = new Set();
      const stack = [[0, 0]];
      visited.add('0,0');

      while (stack.length) {
        const [x, y] = stack[stack.length - 1];
        const dirs = [[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
        for (let i = dirs.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
        }
        let carved = false;
        for (const [dx, dy, wHere, wThere] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= CHUNK || ny >= CHUNK) continue;
          if (visited.has(nx + ',' + ny)) continue;
          local[idx(x,y)].walls &= ~wHere;
          local[idx(nx,ny)].walls &= ~wThere;
          visited.add(nx + ',' + ny);
          stack.push([nx, ny]);
          carved = true;
          break;
        }
        if (!carved) stack.pop();
      }

      // Stitch to existing neighbors
      for (const c of local) {
        const { gx, gy, walls } = c;
        let w = walls;
        if (gx % CHUNK === 0) {
          const nb = maze.get(cellKey(gx - 1, gy));
          if (nb) w = (w & ~8) | (nb.walls & 2 ? 8 : 0);
        }
        if (gy % CHUNK === 0) {
          const nb = maze.get(cellKey(gx, gy - 1));
          if (nb) w = (w & ~1) | (nb.walls & 4 ? 1 : 0);
        }
        maze.set(cellKey(gx, gy), { walls: w });
      }
      maze.set('chunk:' + key(cx, cy), true);
    }

    function hasWall(gx, gy, dir) {
      const c = getCell(gx, gy);
      const bit = [1, 2, 4, 8][dir];
      return (c.walls & bit) !== 0;
    }

    function worldPos(gx, gy) {
      return { x: gx * CELL, z: gy * CELL };
    }

    // ── Three.js scene ──────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);
    scene.fog = new THREE.Fog(0x0a0a14, 8, 55);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x334466, 0.45));
    const torch = new THREE.PointLight(0xffeedd, 1.8, 22, 1.6);
    scene.add(torch);
    const fill = new THREE.DirectionalLight(0x6688cc, 0.25);
    fill.position.set(0, 10, 0);
    scene.add(fill);

    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x8899aa, roughness: 0.85, metalness: 0.05
    });
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x1a2233, roughness: 0.95
    });
    const ceilMat = new THREE.MeshStandardMaterial({
      color: 0x121820, roughness: 1, side: THREE.BackSide
    });
    const trimMat = new THREE.MeshStandardMaterial({
      color: 0x44aaff, emissive: 0x113355, emissiveIntensity: 0.35, roughness: 0.5
    });

    const chunksBuilt = new Set();
    const chunkGroup = new THREE.Group();
    scene.add(chunkGroup);

    function buildChunk(cx, cy) {
      const ck = key(cx, cy);
      if (chunksBuilt.has(ck)) return;
      chunksBuilt.add(ck);
      generateChunk(cx, cy);

      const g = new THREE.Group();
      g.name = ck;

      for (let ly = 0; ly < CHUNK; ly++) {
        for (let lx = 0; lx < CHUNK; lx++) {
          const gx = cx * CHUNK + lx, gy = cy * CHUNK + ly;
          const c = getCell(gx, gy);
          const { x, z } = worldPos(gx, gy);
          const cxw = x + CELL / 2, czw = z + CELL / 2;

          // Floor
          const fl = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), floorMat);
          fl.rotation.x = -Math.PI / 2;
          fl.position.set(cxw, 0, czw);
          g.add(fl);

          // Ceiling
          const ce = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), ceilMat);
          ce.rotation.x = Math.PI / 2;
          ce.position.set(cxw, WALL_H, czw);
          g.add(ce);

          const wallGeoH = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
          const wallGeoV = new THREE.BoxGeometry(WALL_T, WALL_H, CELL);

          if (c.walls & 1) {
            const w = new THREE.Mesh(wallGeoH, wallMat);
            w.position.set(cxw, WALL_H / 2, z);
            g.add(w);
            addTrim(g, cxw, WALL_H * 0.92, z, CELL, true);
          }
          if (c.walls & 2) {
            const w = new THREE.Mesh(wallGeoV, wallMat);
            w.position.set(x + CELL, WALL_H / 2, czw);
            g.add(w);
            addTrim(g, x + CELL, WALL_H * 0.92, czw, CELL, false);
          }
          if (c.walls & 4) {
            const w = new THREE.Mesh(wallGeoH, wallMat);
            w.position.set(cxw, WALL_H / 2, z + CELL);
            g.add(w);
            addTrim(g, cxw, WALL_H * 0.92, z + CELL, CELL, true);
          }
          if (c.walls & 8) {
            const w = new THREE.Mesh(wallGeoV, wallMat);
            w.position.set(x, WALL_H / 2, czw);
            g.add(w);
            addTrim(g, x, WALL_H * 0.92, czw, CELL, false);
          }
        }
      }
      chunkGroup.add(g);
    }

    function addTrim(g, x, y, z, len, horizontal) {
      const geo = horizontal
        ? new THREE.BoxGeometry(len, 0.06, 0.04)
        : new THREE.BoxGeometry(0.04, 0.06, len);
      const m = new THREE.Mesh(geo, trimMat);
      m.position.set(x, y, z);
      g.add(m);
    }

    function updateVisibleChunks(gx, gy) {
      const ccx = Math.floor(gx / CHUNK), ccy = Math.floor(gy / CHUNK);
      for (let dy = -VIEW; dy <= VIEW; dy++) {
        for (let dx = -VIEW; dx <= VIEW; dx++) {
          buildChunk(ccx + dx, ccy + dy);
        }
      }
      // Cull distant chunks
      for (const child of [...chunkGroup.children]) {
        const [cx, cy] = child.name.split(',').map(Number);
        if (Math.abs(cx - ccx) > VIEW + 1 || Math.abs(cy - ccy) > VIEW + 1) {
          chunkGroup.remove(child);
          chunksBuilt.delete(child.name);
        }
      }
    }

    // ── Navigator state (continuous self-navigation) ────────────────────────
    let navX = 2.1, navZ = 2.1;
    let navAngle = 0;
    let cellGX = 0, cellGY = 0;
    let subX = 0.525, subZ = 0.525;
    let dir = 1; // 0=N(-Z), 1=E(+X), 2=S(+Z), 3=W(-X)
    let turnQueue = 0;
    let turnTarget = null;
    let cellsVisited = 0;
    const visited = new Set();

    function markVisited(gx, gy) {
      const k = cellKey(gx, gy);
      if (!visited.has(k)) { visited.add(k); cellsVisited++; }
    }

    function localWall(gx, gy, d) {
      if (d === 0) return hasWall(gx, gy, 0);
      if (d === 1) return hasWall(gx, gy, 1);
      if (d === 2) return hasWall(gx, gy, 2);
      if (d === 3) return hasWall(gx, gy, 3);
      return true;
    }

    function leftOf(d) { return (d + 3) % 4; }
    function rightOf(d) { return (d + 1) % 4; }
    function backOf(d) { return (d + 2) % 4; }

    // Left-hand wall follower with lookahead for smooth corners
    function chooseNav() {
      const gx = cellGX, gy = cellGY;
      if (!localWall(gx, gy, leftOf(dir))) {
        return 'turnLeft';
      }
      if (!localWall(gx, gy, dir)) {
        return 'forward';
      }
      if (!localWall(gx, gy, rightOf(dir))) {
        return 'turnRight';
      }
      return 'turnAround';
    }

    let navAction = 'forward';
    let actionTimer = 0;

    function startTurn(deltaDir) {
      turnQueue = deltaDir;
      turnTarget = dir + deltaDir;
      if (turnTarget < 0) turnTarget += 4;
      if (turnTarget >= 4) turnTarget -= 4;
    }

    function applyTurnStep(dt) {
      if (turnQueue === 0) return false;
      const targetAngle = turnTarget * (Math.PI / 2);
      let diff = targetAngle - navAngle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const step = TURN * dt;
      if (Math.abs(diff) <= step) {
        navAngle = targetAngle;
        dir = turnTarget;
        turnQueue = 0;
        turnTarget = null;
        return false;
      }
      navAngle += Math.sign(diff) * step;
      return true;
    }

    function moveForward(dt) {
      const dx = [0, 1, 0, -1][dir];
      const dy = [1, 0, -1, 0][dir]; // grid y maps to -z
      const dist = SPEED * dt;
      subX += dx * (dist / CELL);
      subZ += dy * (dist / CELL);

      while (subX >= 1) { subX -= 1; cellGX++; }
      while (subX < 0) { subX += 1; cellGX--; }
      while (subZ >= 1) { subZ -= 1; cellGY--; }
      while (subZ < 0) { subZ += 1; cellGY++; }

      navX = cellGX * CELL + subX * CELL;
      navZ = cellGY * CELL + subZ * CELL;
      markVisited(cellGX, cellGY);
    }

    function collides(wx, wz, radius) {
      const gx = Math.floor(wx / CELL);
      const gy = Math.floor(wz / CELL);
      const lx = (wx / CELL) - gx;
      const lz = (wz / CELL) - gy;
      const c = getCell(gx, gy);
      if (c.walls & 1 && lz < radius / CELL) return true;
      if (c.walls & 2 && lx > 1 - radius / CELL) return true;
      if (c.walls & 4 && lz > 1 - radius / CELL) return true;
      if (c.walls & 8 && lx < radius / CELL) return true;
      return false;
    }

    // ── Boot ────────────────────────────────────────────────────────────────
    generateChunk(0, 0);
    buildChunk(0, 0);
    markVisited(0, 0);

    const posEl = document.getElementById('pos');
    const cellsEl = document.getElementById('cells');

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let last = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (turnQueue !== 0) {
        applyTurnStep(dt);
      } else {
        if (navAction === 'forward') {
          const prevX = navX, prevZ = navZ;
          moveForward(dt);
          if (collides(navX, navZ, 0.35)) {
            navX = prevX; navZ = prevZ;
            subX = (navX / CELL) - cellGX;
            subZ = (navZ / CELL) - cellGY;
            navAction = chooseNav();
            if (navAction === 'turnLeft') startTurn(-1);
            else if (navAction === 'turnRight') startTurn(1);
            else if (navAction === 'turnAround') startTurn(2);
          }
        } else {
          navAction = chooseNav();
          if (navAction === 'turnLeft') startTurn(-1);
          else if (navAction === 'turnRight') startTurn(1);
          else if (navAction === 'turnAround') startTurn(2);
          else navAction = 'forward';
        }
      }

      updateVisibleChunks(cellGX, cellGY);

      const bob = Math.sin(now * 0.004) * 0.04;
      camera.position.set(navX, EYE + bob, navZ);
      camera.rotation.order = 'YXZ';
      camera.rotation.y = navAngle;
      camera.rotation.x = Math.sin(now * 0.002) * 0.015;

      torch.position.copy(camera.position);
      torch.position.y = EYE - 0.2;

      posEl.textContent = cellGX + ', ' + cellGY;
      cellsEl.textContent = cellsVisited;

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
