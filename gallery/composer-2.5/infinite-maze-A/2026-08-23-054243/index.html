<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Maze</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const CELL = 2.4;
const WALL_H = 2.8;
const CHUNK = 16;
const EYE = 1.55;
const SPEED = 3.2;
const TURN_SPEED = 2.4;
const VIEW = 28;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1018);
scene.fog = new THREE.Fog(0x0c1018, 6, VIEW);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, VIEW + 8);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8899bb, 0.45));
const key = new THREE.PointLight(0xffeedd, 1.6, 14, 2);
key.position.set(0, EYE, 0);
scene.add(key);
const fill = new THREE.DirectionalLight(0x6688cc, 0.25);
fill.position.set(3, 8, -2);
scene.add(fill);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a6478, roughness: 0.85, metalness: 0.05 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2230, roughness: 0.95 });
const ceilMat = new THREE.MeshStandardMaterial({ color: 0x121820, roughness: 1 });
const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
const floorGeo = new THREE.PlaneGeometry(CELL, CELL);
const ceilGeo = new THREE.PlaneGeometry(CELL, CELL);

const chunks = new Map();
const chunkGroup = new THREE.Group();
scene.add(chunkGroup);

function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return (h ^ (h >>> 16)) >>> 0;
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function generateMaze(cx, cy) {
  const w = CHUNK, h = CHUNK;
  const cells = new Uint8Array(w * h);
  const visited = new Uint8Array(w * h);
  const rng = mulberry32(hash(cx, cy) || 1);

  function idx(x, y) { return y * w + x; }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < w && y < h; }

  const stack = [[1, 1]];
  visited[idx(1, 1)] = 1;

  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    for (let i = dirs.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
    }
    let carved = false;
    for (const [dx, dy] of dirs) {
      const nx = x + dx * 2, ny = y + dy * 2;
      if (inBounds(nx, ny) && !visited[idx(nx, ny)]) {
        visited[idx(nx, ny)] = 1;
        cells[idx(x + dx, y + dy)] = 1;
        cells[idx(nx, ny)] = 1;
        stack.push([nx, ny]);
        carved = true;
        break;
      }
    }
    if (!carved) stack.pop();
  }

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (x === 0 || y === 0 || x === w - 1 || y === h - 1) cells[idx(x, y)] = 0;
    }
  }

  const exits = [
    [Math.floor(w / 2), 0, 0, -1],
    [w - 1, Math.floor(h / 2), 1, 0],
    [Math.floor(w / 2), h - 1, 0, 1],
    [0, Math.floor(h / 2), -1, 0]
  ];
  for (const [ex, ey, dx, dy] of exits) {
    cells[idx(ex, ey)] = 1;
    const nx = ex + dx, ny = ey + dy;
    if (inBounds(nx, ny)) cells[idx(nx, ny)] = 1;
  }

  return cells;
}

function chunkKey(cx, cy) { return cx + ',' + cy; }

function buildChunk(cx, cy) {
  const keyStr = chunkKey(cx, cy);
  if (chunks.has(keyStr)) return chunks.get(keyStr);

  const data = generateMaze(cx, cy);
  const group = new THREE.Group();
  group.userData = { cx, cy, data };

  for (let y = 0; y < CHUNK; y++) {
    for (let x = 0; x < CHUNK; x++) {
      const open = data[y * CHUNK + x] === 1;
      const wx = (cx * CHUNK + x) * CELL + CELL * 0.5;
      const wz = (cy * CHUNK + y) * CELL + CELL * 0.5;

      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(wx, 0, wz);
      floor.receiveShadow = true;
      group.add(floor);

      const ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.set(wx, WALL_H, wz);
      group.add(ceil);

      if (!open) {
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(wx, WALL_H * 0.5, wz);
        group.add(wall);
      }
    }
  }

  chunkGroup.add(group);
  chunks.set(keyStr, { group, data, cx, cy });
  return chunks.get(keyStr);
}

function worldToCell(wx, wz) {
  const gx = Math.floor(wx / CELL);
  const gz = Math.floor(wz / CELL);
  const cx = Math.floor(gx / CHUNK);
  const cy = Math.floor(gz / CHUNK);
  const lx = ((gx % CHUNK) + CHUNK) % CHUNK;
  const ly = ((gz % CHUNK) + CHUNK) % CHUNK;
  return { cx, cy, lx, ly, gx, gz };
}

function isOpen(gx, gz) {
  const { cx, cy, lx, ly } = worldToCell(gx * CELL + CELL * 0.5, gz * CELL + CELL * 0.5);
  const ch = buildChunk(cx, cy);
  return ch.data[ly * CHUNK + lx] === 1;
}

function ensureNearby(wx, wz) {
  const { cx, cy } = worldToCell(wx, wz);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      buildChunk(cx + dx, cy + dy);
    }
  }
}

function pruneFar(wx, wz) {
  const { cx, cy } = worldToCell(wx, wz);
  for (const [k, ch] of chunks) {
    if (Math.abs(ch.cx - cx) > 2 || Math.abs(ch.cy - cy) > 2) {
      chunkGroup.remove(ch.group);
      chunks.delete(k);
    }
  }
}

const DIRS = [
  { dx: 0, dz: -1, angle: 0 },
  { dx: 1, dz: 0, angle: -Math.PI / 2 },
  { dx: 0, dz: 1, angle: Math.PI },
  { dx: -1, dz: 0, angle: Math.PI / 2 }
];

let dirIdx = 0;
let pos = new THREE.Vector3(CELL * 1.5, EYE, CELL * 1.5);
let yaw = 0;
let targetYaw = 0;
let moveState = 'forward';
let pauseT = 0;

function cellCenter(gx, gz) {
  return new THREE.Vector3(gx * CELL + CELL * 0.5, EYE, gz * CELL + CELL * 0.5);
}

function currentCell() {
  const gx = Math.floor(pos.x / CELL);
  const gz = Math.floor(pos.z / CELL);
  return { gx, gz };
}

function canMove(gx, gz, d) {
  const nx = gx + DIRS[d].dx;
  const nz = gz + DIRS[d].dz;
  return isOpen(nx, nz);
}

function pickDirection(gx, gz) {
  const left = (dirIdx + 3) % 4;
  const right = (dirIdx + 1) % 4;
  const back = (dirIdx + 2) % 4;

  if (canMove(gx, gz, dirIdx)) return dirIdx;
  if (canMove(gx, gz, left)) return left;
  if (canMove(gx, gz, right)) return right;
  if (canMove(gx, gz, back)) return back;
  return dirIdx;
}

function atCellCenter(threshold = 0.12) {
  const c = cellCenter(currentCell().gx, currentCell().gz);
  const dx = pos.x - c.x;
  const dz = pos.z - c.z;
  return Math.hypot(dx, dz) < threshold;
}

ensureNearby(pos.x, pos.z);
targetYaw = DIRS[dirIdx].angle;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  ensureNearby(pos.x, pos.z);
  pruneFar(pos.x, pos.z);

  if (pauseT > 0) {
    pauseT -= dt;
  } else if (moveState === 'turn') {
    let diff = targetYaw - yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    if (Math.abs(diff) < 0.04) {
      yaw = targetYaw;
      moveState = 'forward';
    } else {
      yaw += Math.sign(diff) * TURN_SPEED * dt;
    }
  } else {
    const { gx, gz } = currentCell();
    const center = cellCenter(gx, gz);
    const fwd = DIRS[dirIdx];
    const aheadGx = gx + fwd.dx;
    const aheadGz = gz + fwd.dz;

    if (atCellCenter()) {
      if (!canMove(gx, gz, dirIdx)) {
        const next = pickDirection(gx, gz);
        if (next !== dirIdx) {
          dirIdx = next;
          targetYaw = DIRS[dirIdx].angle;
          moveState = 'turn';
          pauseT = 0.05;
        }
      }
    }

    const moveDir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).normalize();
    pos.addScaledVector(moveDir, SPEED * dt);

    const snapStrength = atCellCenter(0.35) ? 4 : 1.2;
    pos.x += (center.x - pos.x) * snapStrength * dt;
    pos.z += (center.z - pos.z) * snapStrength * dt;

    if (canMove(gx, gz, dirIdx) && atCellCenter(0.08)) {
      const nextCenter = cellCenter(aheadGx, aheadGz);
      const toNext = new THREE.Vector3().subVectors(nextCenter, pos);
      toNext.y = 0;
      if (toNext.lengthSq() > 0.001) {
        toNext.normalize();
        pos.addScaledVector(toNext, SPEED * 0.15 * dt);
      }
    }
  }

  camera.position.copy(pos);
  camera.rotation.set(0, yaw, 0, 'YXZ');
  key.position.copy(pos);

  const sway = Math.sin(clock.elapsedTime * 2.2) * 0.025;
  camera.position.y += sway;

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
