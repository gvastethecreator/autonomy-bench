<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Airport Operations Simulation</title>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #121a2a;
      --border: #1e2d45;
      --accent: #3b9eff;
      --green: #2ecc71;
      --amber: #f39c12;
      --red: #e74c3c;
      --text: #e8eef7;
      --muted: #7a8ba3;
      --runway: #2a3344;
      --grass: #1a2e1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(180deg, #141e30 0%, var(--panel) 100%);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 span.badge {
      font-size: 0.65rem;
      background: var(--green);
      color: #000;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .clock {
      font-family: "Consolas", monospace;
      font-size: 1.4rem;
      color: var(--accent);
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button, select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #000; border-color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 60px);
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; height: auto; }
    }
    .map-wrap {
      grid-row: span 2;
      position: relative;
      background: var(--grass);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 420px;
    }
    #airfield {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay-stats {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
    }
    .stat-pill strong { color: var(--accent); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }
    .panel-body {
      padding: 10px 14px;
      overflow-y: auto;
      flex: 1;
      font-size: 0.82rem;
    }
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .weather-item {
      background: rgba(0,0,0,0.25);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .weather-item .val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .weather-item .lbl { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .runway-status {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .runway-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
      border-left: 3px solid var(--green);
    }
    .runway-row.busy { border-left-color: var(--amber); }
    .runway-row.closed { border-left-color: var(--red); opacity: 0.7; }
    .flight-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }
    .flight-table th {
      text-align: left;
      color: var(--muted);
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    .flight-table td {
      padding: 7px 4px;
      border-bottom: 1px solid rgba(30,45,69,0.5);
    }
    .status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .status.landed { background: rgba(46,204,113,0.2); color: var(--green); }
    .status.taxi { background: rgba(59,158,255,0.2); color: var(--accent); }
    .status.approach { background: rgba(243,156,18,0.2); color: var(--amber); }
    .status.departed { background: rgba(155,89,182,0.2); color: #bb8fce; }
    .status.boarding { background: rgba(52,152,219,0.2); color: #5dade2; }
    .log-entry {
      padding: 6px 0;
      border-bottom: 1px solid rgba(30,45,69,0.4);
      font-size: 0.72rem;
      line-height: 1.4;
    }
    .log-entry .time { color: var(--muted); margin-right: 6px; }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .metric {
      text-align: center;
      padding: 8px;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
    }
    .metric .num { font-size: 1.2rem; font-weight: 700; }
    .metric .lbl { font-size: 0.65rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>✈ METRO INTL <span class="badge">LIVE OPS</span></h1>
    <div class="clock" id="simClock">00:00:00</div>
    <div class="controls">
      <label style="font-size:0.75rem;color:var(--muted)">Speed</label>
      <button data-speed="1">1×</button>
      <button data-speed="5" class="active">5×</button>
      <button data-speed="20">20×</button>
      <button data-speed="60">60×</button>
      <select id="weatherSelect">
        <option value="clear">Clear</option>
        <option value="cloudy">Cloudy</option>
        <option value="rain">Rain</option>
        <option value="fog">Fog</option>
      </select>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
  </header>

  <main>
    <div class="map-wrap">
      <canvas id="airfield"></canvas>
      <div class="overlay-stats">
        <div class="stat-pill">Active: <strong id="activeAircraft">0</strong></div>
        <div class="stat-pill">Runway: <strong id="activeRunway">09L/27R</strong></div>
        <div class="stat-pill">Wind: <strong id="windDisplay">270° 12kt</strong></div>
        <div class="stat-pill">Visibility: <strong id="visDisplay">10+ SM</strong></div>
      </div>
    </div>

    <div class="panel">
      <h2>Operations Center</h2>
      <div class="panel-body">
        <div class="metrics-row">
          <div class="metric"><div class="num" id="mLandings">0</div><div class="lbl">Landings/hr</div></div>
          <div class="metric"><div class="num" id="mDepartures">0</div><div class="lbl">Departures/hr</div></div>
          <div class="metric"><div class="num" id="mOnTime">94%</div><div class="lbl">On-time</div></div>
        </div>
        <div class="weather-grid">
          <div class="weather-item"><div class="val" id="wTemp">18°C</div><div class="lbl">Temperature</div></div>
          <div class="weather-item"><div class="val" id="wWind">12 kt</div><div class="lbl">Wind</div></div>
          <div class="weather-item"><div class="val" id="wCeiling">8500 ft</div><div class="lbl">Ceiling</div></div>
          <div class="weather-item"><div class="val" id="wQnh">1013 hPa</div><div class="lbl">QNH</div></div>
        </div>
        <h2 style="margin-top:12px;border:none;background:none;padding:8px 0 6px">Runway Status</h2>
        <div class="runway-status" id="runwayStatus"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Flight Board & ATC Log</h2>
      <div class="panel-body" style="padding:0">
        <table class="flight-table" style="padding:0 14px">
          <thead><tr><th>Flight</th><th>Route</th><th>Gate</th><th>Status</th></tr></thead>
          <tbody id="flightBoard"></tbody>
        </table>
        <div style="padding:10px 14px;max-height:140px;overflow-y:auto" id="atcLog"></div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById('airfield');
      const ctx = canvas.getContext('2d');
      let W, H, dpr = 1;

      const AIRLINES = ['UAL','AAL','DAL','SWA','BAW','AFR','DLH','QFA','JAL','KLM','UAE','SIA'];
      const CITIES = [
        ['JFK','New York'],['LAX','Los Angeles'],['ORD','Chicago'],['DFW','Dallas'],
        ['LHR','London'],['CDG','Paris'],['FRA','Frankfurt'],['DXB','Dubai'],
        ['SIN','Singapore'],['NRT','Tokyo'],['SYD','Sydney'],['MIA','Miami']
      ];

      let simTime = 14 * 3600;
      let speed = 5;
      let paused = false;
      let weather = 'clear';
      let windDir = 270;
      let windSpd = 12;
      let landingsHour = 0;
      let departuresHour = 0;
      let hourCounter = 0;
      let lastHourTick = 0;

      const runways = [
        { id: '09L/27R', heading: 90, x: 0.15, y: 0.35, len: 0.7, w: 0.04, active: true, busy: false },
        { id: '09R/27L', heading: 90, x: 0.15, y: 0.62, len: 0.7, w: 0.035, active: true, busy: false },
        { id: '18/36', heading: 180, x: 0.55, y: 0.08, len: 0.35, w: 0.03, active: false, busy: false }
      ];

      const gates = [];
      for (let t = 0; t < 3; t++) {
        for (let g = 0; g < 6; g++) {
          gates.push({
            id: String.fromCharCode(65 + t) + (g + 1),
            x: 0.02 + t * 0.08,
            y: 0.12 + g * 0.12,
            occupied: Math.random() > 0.5,
            terminal: t + 1
          });
        }
      }

      const flights = [];
      const aircraft = [];
      const vehicles = [];
      const log = [];

      function rand(a, b) { return a + Math.random() * (b - a); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function flightNum() { return pick(AIRLINES) + Math.floor(rand(100, 9999)); }

      function createFlight(type) {
        const city = pick(CITIES);
        const gate = pick(gates.filter(g => type === 'dep' ? !g.occupied : g.occupied) || gates);
        return {
          id: flightNum(),
          type,
          city: city[0],
          name: city[1],
          gate: gate ? gate.id : '—',
          status: type === 'arr' ? 'approach' : 'boarding',
          eta: simTime + rand(60, 900)
        };
      }

      for (let i = 0; i < 8; i++) flights.push(createFlight(i % 2 ? 'arr' : 'dep'));

      function addLog(msg) {
        const t = formatTime(simTime);
        log.unshift({ t, msg });
        if (log.length > 30) log.pop();
        renderLog();
      }

      function formatTime(s) {
        s = Math.floor(s) % 86400;
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
      }

      function spawnAircraft(type) {
        const f = flights.find(x => x.status === (type === 'land' ? 'approach' : 'boarding'));
        if (!f) return;
        const rw = runways.find(r => r.active && r.id.startsWith('09'));
        if (!rw) return;

        if (type === 'land') {
          f.status = 'approach';
          const startX = W * (rw.x + rw.len + 0.08);
          const startY = H * (rw.y + rw.w / 2);
          aircraft.push({
            flight: f.id, type: 'jet', phase: 'final',
            x: startX, y: startY, angle: Math.PI,
            speed: rand(2.5, 3.5), alt: rand(800, 1200),
            targetGate: f.gate, flightRef: f, trail: []
          });
          rw.busy = true;
          addLog(`${f.id} cleared to land runway ${rw.id.split('/')[0]}`);
        } else {
          f.status = 'taxi';
          const gateObj = gates.find(g => g.id === f.gate);
          const gx = gateObj ? W * (gateObj.x + 0.04) : W * 0.1;
          const gy = gateObj ? H * gateObj.y : H * 0.5;
          aircraft.push({
            flight: f.id, type: 'jet', phase: 'taxi-out',
            x: gx, y: gy, angle: 0,
            speed: rand(0.8, 1.2), alt: 0,
            targetRunway: rw, flightRef: f, trail: []
          });
          if (gateObj) gateObj.occupied = false;
          addLog(`${f.id} taxi to runway ${rw.id.split('/')[0]} via Alpha`);
        }
      }

      function spawnVehicle() {
        const types = ['tug', 'fuel', 'baggage'];
        vehicles.push({
          type: pick(types),
          x: rand(W * 0.05, W * 0.25),
          y: rand(H * 0.15, H * 0.85),
          tx: rand(W * 0.05, W * 0.25),
          ty: rand(H * 0.15, H * 0.85),
          speed: rand(0.3, 0.6)
        });
      }

      for (let i = 0; i < 6; i++) spawnVehicle();

      function resize() {
        dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawAirfield() {
        ctx.fillStyle = '#1a2e1a';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#152515';
        for (let i = 0; i < 8; i++) {
          ctx.fillRect(W * 0.01, H * (0.1 + i * 0.11), W * 0.22, H * 0.08);
        }

        ctx.fillStyle = '#1a2535';
        ctx.fillRect(W * 0.28, H * 0.05, W * 0.68, H * 0.9);

        runways.forEach(rw => {
          const rx = W * rw.x;
          const ry = H * rw.y;
          const rwW = H * rw.w;
          const rwL = W * rw.len;

          ctx.fillStyle = rw.active ? '#3a4555' : '#2a2f38';
          ctx.fillRect(rx, ry, rwL, rwW);

          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.setLineDash([12, 8]);
          ctx.beginPath();
          ctx.moveTo(rx + rwL / 2, ry + 4);
          ctx.lineTo(rx + rwL / 2, ry + rwW - 4);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(rw.id.split('/')[0], rx + 8, ry + rwW / 2 + 4);
          ctx.fillText(rw.id.split('/')[1], rx + rwL - 28, ry + rwW / 2 + 4);

          if (rw.active) {
            ctx.fillStyle = rw.busy ? '#f39c12' : '#2ecc71';
            ctx.beginPath();
            ctx.arc(rx + rwL - 15, ry + 8, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.strokeStyle = '#4a5568';
        ctx.lineWidth = W * 0.012;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(W * 0.24, H * 0.38);
        ctx.lineTo(W * 0.24, H * 0.55);
        ctx.lineTo(W * 0.35, H * 0.55);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(W * 0.24, H * 0.65);
        ctx.lineTo(W * 0.40, H * 0.65);
        ctx.stroke();

        gates.forEach(g => {
          const gx = W * g.x;
          const gy = H * g.y;
          ctx.fillStyle = g.occupied ? '#2c5282' : '#1e3a5f';
          ctx.fillRect(gx, gy, W * 0.06, H * 0.06);
          ctx.strokeStyle = g.occupied ? '#63b3ed' : '#4a5568';
          ctx.lineWidth = 1;
          ctx.strokeRect(gx, gy, W * 0.06, H * 0.06);
          ctx.fillStyle = '#a0aec0';
          ctx.font = '9px sans-serif';
          ctx.fillText(g.gate || g.id, gx + 4, gy + H * 0.04);
        });

        ctx.fillStyle = '#2d3748';
        ctx.fillRect(W * 0.88, H * 0.02, W * 0.1, H * 0.12);
        ctx.fillStyle = '#718096';
        ctx.font = '10px sans-serif';
        ctx.fillText('TWR', W * 0.905, H * 0.07);

        if (weather === 'rain') {
          ctx.fillStyle = 'rgba(150,180,220,0.15)';
          ctx.fillRect(0, 0, W, H);
          for (let i = 0; i < 80; i++) {
            const rx = (Date.now() * 0.3 + i * 47) % W;
            const ry = (Date.now() * 0.8 + i * 31) % H;
            ctx.strokeStyle = 'rgba(180,200,255,0.4)';
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - 2, ry + 8);
            ctx.stroke();
          }
        }
        if (weather === 'fog') {
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, 'rgba(200,210,220,0.05)');
          grad.addColorStop(0.5, 'rgba(200,210,220,0.25)');
          grad.addColorStop(1, 'rgba(200,210,220,0.45)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function drawAircraft(a) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);

        if (a.trail.length > 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.15)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          a.trail.forEach((p, i) => i === 0 ? ctx.moveTo(p.x - a.x, p.y - a.y) : ctx.lineTo(p.x - a.x, p.y - a.y));
          ctx.stroke();
        }

        const scale = a.phase === 'airborne' || a.phase === 'final' ? 1.2 : 0.9;
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.moveTo(14 * scale, 0);
        ctx.lineTo(-10 * scale, -5 * scale);
        ctx.lineTo(-6 * scale, 0);
        ctx.lineTo(-10 * scale, 5 * scale);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#4299e1';
        ctx.fillRect(-4 * scale, -8 * scale, 8 * scale, 3 * scale);
        ctx.fillRect(-4 * scale, 5 * scale, 8 * scale, 3 * scale);

        if (a.alt > 0) {
          ctx.fillStyle = '#fff';
          ctx.font = '8px monospace';
          ctx.fillText(Math.round(a.alt) + 'ft', -12, -14);
        }

        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = '9px monospace';
        ctx.fillText(a.flight, a.x + 10, a.y - 8);
      }

      function drawVehicle(v) {
        ctx.save();
        ctx.translate(v.x, v.y);
        const colors = { tug: '#ecc94b', fuel: '#f56565', baggage: '#48bb78' };
        ctx.fillStyle = colors[v.type] || '#aaa';
        ctx.fillRect(-5, -3, 10, 6);
        ctx.restore();
      }

      function updateAircraft(a, dt) {
        a.trail.push({ x: a.x, y: a.y });
        if (a.trail.length > 20) a.trail.shift();

        if (a.phase === 'final') {
          a.x -= a.speed * dt * 60;
          a.alt = Math.max(0, a.alt - a.speed * dt * 80);
          if (a.alt <= 5) {
            a.phase = 'landed';
            a.flightRef.status = 'taxi';
            landingsHour++;
            addLog(`${a.flight} landed runway 09L, vacating via Bravo`);
            runways[0].busy = false;
          }
        } else if (a.phase === 'landed') {
          a.x -= a.speed * 0.4 * dt * 60;
          a.y += a.speed * 0.2 * dt * 60;
          a.angle = -0.3;
          if (a.x < W * 0.25) {
            a.phase = 'taxi-in';
            a.flightRef.status = 'landed';
            const g = gates.find(x => x.id === a.targetGate);
            if (g) g.occupied = true;
          }
        } else if (a.phase === 'taxi-in') {
          const g = gates.find(x => x.id === a.targetGate);
          if (g) {
            const tx = W * (g.x + 0.03);
            const ty = H * g.y + H * 0.03;
            const dx = tx - a.x, dy = ty - a.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 5) {
              a.phase = 'parked';
              a.flightRef.status = 'landed';
              flights.splice(flights.indexOf(a.flightRef), 1);
              flights.push(createFlight('dep'));
              return true;
            }
            a.angle = Math.atan2(dy, dx);
            a.x += Math.cos(a.angle) * a.speed * 0.5 * dt * 60;
            a.y += Math.sin(a.angle) * a.speed * 0.5 * dt * 60;
          }
        } else if (a.phase === 'taxi-out') {
          const rw = a.targetRunway;
          const tx = W * (rw.x + 0.1);
          const ty = H * (rw.y + rw.w / 2);
          const dx = tx - a.x, dy = ty - a.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 8) {
            a.phase = 'takeoff';
            a.angle = 0;
            rw.busy = true;
            addLog(`${a.flight} cleared for takeoff runway 09L`);
          } else {
            a.angle = Math.atan2(dy, dx);
            a.x += Math.cos(a.angle) * a.speed * 0.5 * dt * 60;
            a.y += Math.sin(a.angle) * a.speed * 0.5 * dt * 60;
          }
        } else if (a.phase === 'takeoff') {
          a.x += a.speed * 1.5 * dt * 60;
          a.alt += a.speed * dt * 200;
          if (a.alt > 500) {
            a.phase = 'airborne';
            a.flightRef.status = 'departed';
            departuresHour++;
            runways[0].busy = false;
            addLog(`${a.flight} departed, contact departure 124.75`);
          }
        } else if (a.phase === 'airborne') {
          a.x += a.speed * 2 * dt * 60;
          a.alt += a.speed * dt * 50;
          if (a.x > W + 50 || a.alt > 3000) return true;
        } else if (a.phase === 'parked') {
          return true;
        }
        return false;
      }

      function updateVehicle(v, dt) {
        const dx = v.tx - v.x, dy = v.ty - v.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 3) {
          v.tx = rand(W * 0.05, W * 0.25);
          v.ty = rand(H * 0.15, H * 0.85);
        } else {
          v.x += (dx / dist) * v.speed * dt * 60;
          v.y += (dy / dist) * v.speed * dt * 60;
        }
      }

      let spawnTimer = 0;

      function update(dt) {
        if (paused) return;
        simTime += dt * speed;
        if (simTime >= 86400) simTime -= 86400;

        spawnTimer += dt * speed;
        if (spawnTimer > 25) {
          spawnTimer = 0;
          if (Math.random() > 0.4) spawnAircraft(Math.random() > 0.5 ? 'land' : 'dep');
          if (Math.random() > 0.7) spawnVehicle();
        }

        if (simTime - lastHourTick >= 3600) {
          lastHourTick = simTime;
          document.getElementById('mLandings').textContent = landingsHour;
          document.getElementById('mDepartures').textContent = departuresHour;
          document.getElementById('mOnTime').textContent = Math.floor(rand(88, 98)) + '%';
          landingsHour = 0;
          departuresHour = 0;
        }

        windDir = (windDir + rand(-2, 2) * dt * speed) % 360;
        if (windDir < 0) windDir += 360;
        windSpd = Math.max(3, Math.min(28, windSpd + rand(-0.5, 0.5) * dt * speed));

        for (let i = aircraft.length - 1; i >= 0; i--) {
          if (updateAircraft(aircraft[i], dt)) aircraft.splice(i, 1);
        }
        vehicles.forEach(v => updateVehicle(v, dt));

        flights.forEach(f => {
          if (f.status === 'approach' && !aircraft.find(a => a.flight === f.id)) {
            if (Math.random() < 0.002 * speed) spawnAircraft('land');
          }
          if (f.status === 'boarding' && Math.random() < 0.001 * speed) {
            spawnAircraft('dep');
          }
        });

        updateUI();
      }

      function updateUI() {
        document.getElementById('simClock').textContent = 'ZULU ' + formatTime(simTime);
        document.getElementById('activeAircraft').textContent = aircraft.length;
        document.getElementById('activeRunway').textContent = runways.find(r => r.active)?.id || '—';
        document.getElementById('windDisplay').textContent = Math.round(windDir) + '° ' + Math.round(windSpd) + 'kt';
        document.getElementById('visDisplay').textContent = weather === 'fog' ? '1/4 SM' : weather === 'rain' ? '3 SM' : '10+ SM';

        const temps = { clear: 22, cloudy: 16, rain: 12, fog: 8 };
        document.getElementById('wTemp').textContent = Math.round(temps[weather] + rand(-1, 1)) + '°C';
        document.getElementById('wWind').textContent = Math.round(windSpd) + ' kt';
        document.getElementById('wCeiling').textContent = weather === 'fog' ? '200 ft' : weather === 'rain' ? '2500 ft' : '8500 ft';
        document.getElementById('wQnh').textContent = Math.round(1013 + rand(-3, 3)) + ' hPa';

        document.getElementById('runwayStatus').innerHTML = runways.map(rw =>
          `<div class="runway-row ${rw.busy ? 'busy' : ''} ${!rw.active ? 'closed' : ''}">
            <span>${rw.id}</span>
            <span>${!rw.active ? 'CLOSED' : rw.busy ? 'OCCUPIED' : 'OPEN'}</span>
          </div>`
        ).join('');

        document.getElementById('flightBoard').innerHTML = flights.slice(0, 8).map(f =>
          `<tr>
            <td>${f.id}</td>
            <td>${f.type === 'arr' ? f.city + '→MET' : 'MET→' + f.city}</td>
            <td>${f.gate}</td>
            <td><span class="status ${f.status}">${f.status.toUpperCase()}</span></td>
          </tr>`
        ).join('');
      }

      function renderLog() {
        document.getElementById('atcLog').innerHTML = log.slice(0, 12).map(e =>
          `<div class="log-entry"><span class="time">${e.t}</span>${e.msg}</div>`
        ).join('');
      }

      function render() {
        drawAirfield();
        vehicles.forEach(drawVehicle);
        aircraft.forEach(drawAircraft);
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      document.querySelectorAll('[data-speed]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          speed = parseInt(btn.dataset.speed, 10);
        });
      });

      document.getElementById('pauseBtn').addEventListener('click', function () {
        paused = !paused;
        this.textContent = paused ? '▶ Resume' : '⏸ Pause';
      });

      document.getElementById('weatherSelect').addEventListener('change', function () {
        weather = this.value;
        addLog('METAR updated: weather now ' + weather);
      });

      window.addEventListener('resize', () => { resize(); render(); });
      resize();
      addLog('Metro International operations online');
      addLog('Runway 09L/27R active, wind ' + Math.round(windDir) + ' at ' + Math.round(windSpd));
      updateUI();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
