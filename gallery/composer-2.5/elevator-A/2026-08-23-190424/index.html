<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Elevator Simulation</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --up: #3fb950;
      --down: #f85149;
      --elevator-a: #58a6ff;
      --elevator-b: #a371f7;
      --elevator-c: #f0883e;
      --elevator-d: #39c5cf;
      --lobby: #238636;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      background: var(--panel);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .controls {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    button, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    button:hover, select:hover { border-color: var(--accent); }
    button.primary { background: #1f6feb; border-color: #388bfd; }
    button.primary:hover { background: #388bfd; }
    button.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    main {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 0;
      height: calc(100vh - 64px);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }

    .building-wrap {
      overflow: auto;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .building {
      display: flex;
      gap: 0;
      min-width: min(100%, 720px);
    }

    .floor-labels {
      display: flex;
      flex-direction: column-reverse;
      padding-right: 0.5rem;
      padding-top: 28px;
    }

    .floor-label {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 2.5rem;
    }

    .floor-label.lobby { color: var(--lobby); font-weight: 600; }

    .shafts {
      flex: 1;
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: linear-gradient(180deg, #1a2332 0%, #0d1117 100%);
    }

    .shaft-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 100%;
    }

    .shaft {
      position: relative;
      border-right: 1px solid var(--border);
    }

    .shaft:last-child { border-right: none; }

    .shaft-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 0;
      color: var(--muted);
    }

    .shaft-header.e1 { color: var(--elevator-a); }
    .shaft-header.e2 { color: var(--elevator-b); }
    .shaft-header.e3 { color: var(--elevator-c); }
    .shaft-header.e4 { color: var(--elevator-d); }

    .shaft-body {
      position: relative;
      height: calc(36px * 20);
    }

    .floor-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 36px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.6);
      pointer-events: none;
    }

    .floor-line.lobby {
      border-bottom: 2px solid var(--lobby);
      background: rgba(35, 134, 54, 0.08);
    }

    .elevator-car {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 32px;
      border-radius: 4px;
      transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 5;
    }

    .elevator-car.e1 { background: linear-gradient(135deg, var(--elevator-a), #1f6feb); }
    .elevator-car.e2 { background: linear-gradient(135deg, var(--elevator-b), #8957e5); }
    .elevator-car.e3 { background: linear-gradient(135deg, var(--elevator-c), #db6d28); }
    .elevator-car.e4 { background: linear-gradient(135deg, var(--elevator-d), #2ea8b0); }

    .elevator-car.door-open {
      animation: doorPulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes doorPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.25); }
    }

    .hall-calls {
      width: 72px;
      display: flex;
      flex-direction: column-reverse;
      padding-left: 0.5rem;
      padding-top: 28px;
    }

    .hall-call-row {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .call-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #21262d;
      border: 1px solid var(--border);
    }

    .call-light.up.active { background: var(--up); box-shadow: 0 0 6px var(--up); }
    .call-light.down.active { background: var(--down); box-shadow: 0 0 6px var(--down); }

    .waiting-dots {
      display: flex;
      gap: 2px;
      margin-left: 2px;
    }

    .waiting-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.5;
    }

    .sidebar {
      border-left: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem;
    }

    .stat-card .label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .elevator-status {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .elev-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      padding: 0.4rem 0.5rem;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .elev-badge {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .elev-info { flex: 1; min-width: 0; }
    .elev-info .dir { color: var(--muted); font-size: 0.7rem; }

    .log {
      flex: 1;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.72rem;
      font-family: ui-monospace, monospace;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
    }

    .log-entry { color: var(--muted); margin-bottom: 3px; line-height: 1.35; }
    .log-entry .time { color: #484f58; }
    .log-entry.event { color: var(--text); }

    .time-display {
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .legend span { display: flex; align-items: center; gap: 4px; }
    .legend .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🏢 Meridian Tower — Elevator Simulation</h1>
      <p>20-floor busy office building · 4 elevators · Rush-hour traffic</p>
    </div>
    <div class="controls">
      <span class="time-display" id="clock">08:00:00</span>
      <select id="trafficMode" title="Traffic pattern">
        <option value="mixed">Mixed traffic</option>
        <option value="morning">Morning rush (↑)</option>
        <option value="evening">Evening rush (↓)</option>
        <option value="lunch">Lunch hour</option>
      </select>
      <button id="btnPause">⏸ Pause</button>
      <button id="btnSpeed" class="primary">Speed: 1×</button>
      <button id="btnReset">Reset</button>
    </div>
  </header>

  <main>
    <div class="building-wrap">
      <div class="building">
        <div class="floor-labels" id="floorLabels"></div>
        <div class="shafts">
          <div class="shaft-grid" id="shaftGrid"></div>
        </div>
        <div class="hall-calls" id="hallCalls"></div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Waiting</div>
          <div class="value" id="statWaiting">0</div>
        </div>
        <div class="stat-card">
          <div class="label">In transit</div>
          <div class="value" id="statRiding">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Avg wait</div>
          <div class="value" id="statAvgWait">0s</div>
        </div>
        <div class="stat-card">
          <div class="label">Trips today</div>
          <div class="value" id="statTrips">0</div>
        </div>
      </div>

      <div>
        <div class="section-title">Elevator status</div>
        <div class="elevator-status" id="elevStatus"></div>
      </div>

      <div class="legend">
        <span><span class="swatch" style="background:var(--elevator-a)"></span> Car A</span>
        <span><span class="swatch" style="background:var(--elevator-b)"></span> Car B</span>
        <span><span class="swatch" style="background:var(--elevator-c)"></span> Car C</span>
        <span><span class="swatch" style="background:var(--elevator-d)"></span> Car D</span>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div class="section-title">Activity log</div>
        <div class="log" id="activityLog"></div>
      </div>
    </aside>
  </main>

  <script>
    const FLOORS = 20;
    const LOBBY = 1;
    const NUM_ELEVATORS = 4;
    const CAPACITY = 10;
    const FLOOR_HEIGHT = 36;
    const TRAVEL_MS_PER_FLOOR = 800;
    const DOOR_MS = 1200;
    const TICK_MS = 100;

    const ELEV_COLORS = ['e1', 'e2', 'e3', 'e4'];
    const ELEV_NAMES = ['A', 'B', 'C', 'D'];

    let simTime = 8 * 3600;
    let paused = false;
    let speed = 1;
    let tickInterval = null;
    let totalTrips = 0;
    let waitTimes = [];
    let nextPersonId = 1;

    const hallCalls = {};
    for (let f = 1; f <= FLOORS; f++) {
      hallCalls[f] = { up: false, down: false, waiting: [] };
    }

    const elevators = Array.from({ length: NUM_ELEVATORS }, (_, i) => ({
      id: i,
      floor: i === 0 ? LOBBY : (i === 1 ? 10 : i === 2 ? 5 : 15),
      targetFloor: null,
      direction: 0,
      passengers: [],
      state: 'idle',
      doorTimer: 0,
      moveProgress: 0,
      stops: new Set(),
      assignedCalls: [],
    }));

    let people = [];

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600) % 24;
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function log(msg, isEvent = false) {
      const el = document.getElementById('activityLog');
      const entry = document.createElement('div');
      entry.className = 'log-entry' + (isEvent ? ' event' : '');
      entry.innerHTML = `<span class="time">${formatTime(simTime)}</span> ${msg}`;
      el.prepend(entry);
      while (el.children.length > 60) el.removeChild(el.lastChild);
    }

    function getTrafficMode() {
      return document.getElementById('trafficMode').value;
    }

    function spawnPerson() {
      const mode = getTrafficMode();
      let from, to;

      if (mode === 'morning') {
        from = LOBBY;
        to = 2 + Math.floor(Math.random() * (FLOORS - 1));
      } else if (mode === 'evening') {
        from = 2 + Math.floor(Math.random() * (FLOORS - 1));
        to = LOBBY;
      } else if (mode === 'lunch') {
        if (Math.random() < 0.5) {
          from = LOBBY;
          to = 2 + Math.floor(Math.random() * (FLOORS - 1));
        } else {
          from = 2 + Math.floor(Math.random() * (FLOORS - 1));
          to = LOBBY;
        }
      } else {
        from = 1 + Math.floor(Math.random() * FLOORS);
        do { to = 1 + Math.floor(Math.random() * FLOORS); } while (to === from);
      }

      const person = {
        id: nextPersonId++,
        from,
        to,
        waitStart: simTime,
        state: 'waiting',
        assignedElev: null,
      };
      people.push(person);

      const dir = to > from ? 'up' : 'down';
      hallCalls[from][dir] = true;
      hallCalls[from].waiting.push(person);

      if (people.filter(p => p.state === 'waiting').length <= 3) {
        log(`Person #${person.id} wants ${from} → ${to}`, true);
      }
    }

    function getSpawnRate() {
      const mode = getTrafficMode();
      const hour = (simTime / 3600) % 24;
      let base = 0.015;
      if (mode === 'morning' || (hour >= 7.5 && hour < 9.5)) base = 0.04;
      if (mode === 'evening' || (hour >= 17 && hour < 19)) base = 0.035;
      if (mode === 'lunch' || (hour >= 12 && hour < 13.5)) base = 0.03;
      return base * speed;
    }

    function hallCallPending(floor, dir) {
      if (hallCalls[floor][dir]) return true;
      return hallCalls[floor].waiting.some(p => {
        const pDir = p.to > p.from ? 'up' : 'down';
        return pDir === dir;
      });
    }

    function collectStops() {
      for (const elev of elevators) {
        elev.stops.clear();

        for (let f = 1; f <= FLOORS; f++) {
          if (elev.passengers.some(p => p.to === f)) elev.stops.add(f);
        }

        for (let f = 1; f <= FLOORS; f++) {
          if (hallCallPending(f, 'up') || hallCallPending(f, 'down')) {
            if (shouldStopAt(elev, f)) elev.stops.add(f);
          }
        }
      }
    }

    function shouldStopAt(elev, floor) {
      if (elev.passengers.some(p => p.to === floor)) return true;

      const hasUp = hallCallPending(floor, 'up');
      const hasDown = hallCallPending(floor, 'down');

      if (elev.direction === 0) return hasUp || hasDown;
      if (elev.direction === 1) {
        if (floor >= elev.floor && hasUp) return true;
        if (floor === elev.floor && hasDown) return true;
      }
      if (elev.direction === -1) {
        if (floor <= elev.floor && hasDown) return true;
        if (floor === elev.floor && hasUp) return true;
      }
      return false;
    }

    function pickDirection(elev) {
      if (elev.stops.size === 0) return 0;

      const floors = [...elev.stops].sort((a, b) => a - b);
      const above = floors.filter(f => f > elev.floor);
      const below = floors.filter(f => f < elev.floor);

      if (elev.direction === 1 && above.length) return 1;
      if (elev.direction === -1 && below.length) return -1;
      if (above.length && below.length) {
        return above[0] - elev.floor <= elev.floor - below[below.length - 1] ? 1 : -1;
      }
      if (above.length) return 1;
      if (below.length) return -1;
      if (floors.includes(elev.floor)) return elev.direction || 0;
      return 0;
    }

    function nearestIdleElevator(floor, dir) {
      let best = null;
      let bestScore = Infinity;

      for (const elev of elevators) {
        if (elev.state === 'moving' || elev.state === 'doors') continue;
        const dist = Math.abs(elev.floor - floor);
        let score = dist;
        if (elev.direction === dir && ((dir === 1 && elev.floor <= floor) || (dir === -1 && elev.floor >= floor))) {
          score -= 5;
        }
        if (score < bestScore) { bestScore = score; best = elev; }
      }
      return best;
    }

    function processElevators(dt) {
      collectStops();

      for (const elev of elevators) {
        if (elev.state === 'doors') {
          elev.doorTimer -= dt;
          if (elev.doorTimer <= 0) {
            unloadPassengers(elev);
            loadPassengers(elev);
            elev.stops.delete(elev.floor);
            collectStops();
            elev.direction = pickDirection(elev);
            elev.state = elev.direction !== 0 ? 'moving' : 'idle';
          }
          continue;
        }

        if (elev.state === 'moving') {
          elev.moveProgress += dt;
          const travelTime = TRAVEL_MS_PER_FLOOR / speed;

          if (elev.moveProgress >= travelTime) {
            elev.moveProgress = 0;
            elev.floor += elev.direction;

            if (elev.stops.has(elev.floor) || elev.passengers.some(p => p.to === elev.floor)) {
              elev.state = 'doors';
              elev.doorTimer = DOOR_MS / speed;
              totalTrips++;
            } else {
              elev.direction = pickDirection(elev);
              if (elev.direction === 0) elev.state = 'idle';
            }
          }
          continue;
        }

        elev.direction = pickDirection(elev);
        if (elev.direction !== 0) {
          elev.state = 'moving';
          elev.moveProgress = 0;
        }
      }
    }

    function unloadPassengers(elev) {
      const exiting = elev.passengers.filter(p => p.to === elev.floor);
      elev.passengers = elev.passengers.filter(p => p.to !== elev.floor);
      for (const p of exiting) {
        p.state = 'done';
        waitTimes.push(simTime - p.waitStart);
      }
    }

    function loadPassengers(elev) {
      const floor = elev.floor;
      const available = CAPACITY - elev.passengers.length;
      if (available <= 0) return;

      const waiting = hallCalls[floor].waiting.filter(p => {
        const dir = p.to > p.from ? 'up' : 'down';
        if (elev.direction === 0) return true;
        if (elev.direction === 1) return dir === 'up' || p.to === floor;
        return dir === 'down' || p.to === floor;
      });

      let loaded = 0;
      for (const p of waiting) {
        if (loaded >= available) break;
        const dir = p.to > p.from ? 'up' : 'down';
        if (elev.direction !== 0) {
          if (elev.direction === 1 && dir === 'down' && p.from !== floor) continue;
          if (elev.direction === -1 && dir === 'up' && p.from !== floor) continue;
        }
        hallCalls[floor].waiting = hallCalls[floor].waiting.filter(x => x.id !== p.id);
        p.state = 'riding';
        p.assignedElev = elev.id;
        p.waitStart = simTime;
        elev.passengers.push(p);
        loaded++;
      }

      hallCalls[floor].up = hallCalls[floor].waiting.some(p => p.to > p.from);
      hallCalls[floor].down = hallCalls[floor].waiting.some(p => p.to < p.from);
    }

    function cleanupPeople() {
      people = people.filter(p => p.state !== 'done');
    }

    function tick() {
      if (paused) return;

      const dt = TICK_MS * speed;
      simTime += dt / 1000;

      if (Math.random() < getSpawnRate()) spawnPerson();

      processElevators(dt);
      cleanupPeople();
      updateUI();
    }

    function buildDOM() {
      const floorLabels = document.getElementById('floorLabels');
      const shaftGrid = document.getElementById('shaftGrid');
      const hallCallsEl = document.getElementById('hallCalls');

      for (let f = 1; f <= FLOORS; f++) {
        const label = document.createElement('div');
        label.className = 'floor-label' + (f === LOBBY ? ' lobby' : '');
        label.textContent = f === LOBBY ? 'L' : f;
        floorLabels.appendChild(label);

        const hallRow = document.createElement('div');
        hallRow.className = 'hall-call-row';
        hallRow.id = `hall-${f}`;
        hallRow.innerHTML = `
          <div class="call-light up" id="call-up-${f}"></div>
          <div class="call-light down" id="call-down-${f}"></div>
          <div class="waiting-dots" id="wait-${f}"></div>
        `;
        hallCallsEl.appendChild(hallRow);
      }

      for (let e = 0; e < NUM_ELEVATORS; e++) {
        const shaft = document.createElement('div');
        shaft.className = 'shaft';
        shaft.innerHTML = `
          <div class="shaft-header ${ELEV_COLORS[e]}">Car ${ELEV_NAMES[e]}</div>
          <div class="shaft-body" id="shaft-${e}"></div>
        `;
        shaftGrid.appendChild(shaft);

        const body = document.getElementById(`shaft-${e}`);
        for (let f = 1; f <= FLOORS; f++) {
          const line = document.createElement('div');
          line.className = 'floor-line' + (f === LOBBY ? ' lobby' : '');
          line.style.bottom = `${(f - 1) * FLOOR_HEIGHT}px`;
          body.appendChild(line);
        }

        const car = document.createElement('div');
        car.className = `elevator-car ${ELEV_COLORS[e]}`;
        car.id = `car-${e}`;
        car.textContent = ELEV_NAMES[e];
        body.appendChild(car);
      }

      const statusEl = document.getElementById('elevStatus');
      for (let e = 0; e < NUM_ELEVATORS; e++) {
        const row = document.createElement('div');
        row.className = 'elev-row';
        row.id = `status-${e}`;
        row.innerHTML = `
          <div class="elev-badge ${ELEV_COLORS[e]}">${ELEV_NAMES[e]}</div>
          <div class="elev-info">
            <div id="status-floor-${e}">Floor L · Idle</div>
            <div class="dir" id="status-detail-${e}">0 passengers</div>
          </div>
        `;
        statusEl.appendChild(row);
      }
    }

    function updateUI() {
      document.getElementById('clock').textContent = formatTime(simTime);

      const waiting = people.filter(p => p.state === 'waiting').length;
      const riding = people.filter(p => p.state === 'riding').length;
      document.getElementById('statWaiting').textContent = waiting;
      document.getElementById('statRiding').textContent = riding;
      document.getElementById('statTrips').textContent = totalTrips;

      const avg = waitTimes.length
        ? (waitTimes.reduce((a, b) => a + b, 0) / waitTimes.length).toFixed(1)
        : '0';
      document.getElementById('statAvgWait').textContent = avg + 's';

      for (let f = 1; f <= FLOORS; f++) {
        const upEl = document.getElementById(`call-up-${f}`);
        const downEl = document.getElementById(`call-down-${f}`);
        upEl.classList.toggle('active', hallCalls[f].up);
        downEl.classList.toggle('active', hallCalls[f].down);

        const waitEl = document.getElementById(`wait-${f}`);
        const count = hallCalls[f].waiting.length;
        waitEl.innerHTML = Array.from({ length: Math.min(count, 8) }, () =>
          '<div class="waiting-dot"></div>'
        ).join('');
      }

      for (let e = 0; e < NUM_ELEVATORS; e++) {
        const elev = elevators[e];
        const car = document.getElementById(`car-${e}`);
        const bottom = (elev.floor - 1) * FLOOR_HEIGHT + 2;
        car.style.bottom = `${bottom}px`;
        car.classList.toggle('door-open', elev.state === 'doors');
        car.textContent = `${ELEV_NAMES[e]} ${elev.passengers.length}`;

        const floorLabel = elev.floor === LOBBY ? 'L' : elev.floor;
        const dirLabel = elev.direction === 1 ? '↑ Up' : elev.direction === -1 ? '↓ Down' : '● Idle';
        const stateLabel = elev.state === 'doors' ? '🚪 Doors' : elev.state === 'moving' ? 'Moving' : 'Idle';

        document.getElementById(`status-floor-${e}`).textContent =
          `Floor ${floorLabel} · ${stateLabel} ${elev.direction ? dirLabel : ''}`;
        document.getElementById(`status-detail-${e}`).textContent =
          `${elev.passengers.length}/${CAPACITY} passengers`;
      }
    }

    function resetSimulation() {
      simTime = 8 * 3600;
      totalTrips = 0;
      waitTimes = [];
      nextPersonId = 1;
      people = [];

      for (let f = 1; f <= FLOORS; f++) {
        hallCalls[f] = { up: false, down: false, waiting: [] };
      }

      elevators.forEach((elev, i) => {
        elev.floor = i === 0 ? LOBBY : (i === 1 ? 10 : i === 2 ? 5 : 15);
        elev.targetFloor = null;
        elev.direction = 0;
        elev.passengers = [];
        elev.state = 'idle';
        elev.doorTimer = 0;
        elev.moveProgress = 0;
        elev.stops.clear();
      });

      document.getElementById('activityLog').innerHTML = '';
      log('Simulation reset — morning rush begins', true);
      updateUI();
    }

    function init() {
      buildDOM();
      resetSimulation();

      document.getElementById('btnPause').addEventListener('click', () => {
        paused = !paused;
        document.getElementById('btnPause').textContent = paused ? '▶ Resume' : '⏸ Pause';
      });

      document.getElementById('btnSpeed').addEventListener('click', () => {
        const speeds = [1, 2, 4, 8];
        const idx = speeds.indexOf(speed);
        speed = speeds[(idx + 1) % speeds.length];
        document.getElementById('btnSpeed').textContent = `Speed: ${speed}×`;
      });

      document.getElementById('btnReset').addEventListener('click', resetSimulation);
      document.getElementById('trafficMode').addEventListener('change', () => {
        log(`Traffic mode: ${document.getElementById('trafficMode').selectedOptions[0].text}`, true);
      });

      tickInterval = setInterval(tick, TICK_MS);
    }

    init();
  </script>
</body>
</html>
