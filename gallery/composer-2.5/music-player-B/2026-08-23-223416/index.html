<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance — Desktop Music Player</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0f;--surface:#141419;--surface2:#1c1c24;--surface3:#252530;
  --accent:#7c6aef;--accent2:#a78bfa;--accent-glow:rgba(124,106,239,.35);
  --text:#eeeef2;--muted:#8b8b9e;--dim:#55556a;
  --success:#34d399;--radius:12px;--sidebar:280px;
  --titlebar:38px;--playerbar:88px;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);user-select:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}

/* Title bar */
.titlebar{
  height:var(--titlebar);display:flex;align-items:center;padding:0 16px;
  background:var(--surface);border-bottom:1px solid #1e1e28;
  -webkit-app-region:drag;
}
.titlebar-logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.titlebar-logo svg{width:18px;height:18px;color:var(--accent)}
.titlebar-center{flex:1;text-align:center;font-size:12px;color:var(--dim)}
.titlebar-controls{margin-left:auto;display:flex;gap:6px;-webkit-app-region:no-drag}
.win-btn{width:12px;height:12px;border-radius:50%}
.win-btn.close{background:#ff5f57}.win-btn.min{background:#febc2e}.win-btn.max{background:#28c840}

/* Layout */
.app{display:flex;height:calc(100% - var(--titlebar));position:relative}

/* Sidebar */
.sidebar{
  width:var(--sidebar);background:var(--surface);border-right:1px solid #1e1e28;
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
}
.sidebar-header{padding:20px 16px 12px}
.sidebar-header h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin-bottom:10px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  font-size:13px;color:var(--muted);transition:all .15s;margin-bottom:2px;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent2);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.playlist-section{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0 8px 8px}
.playlist-section h3{
  font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
  padding:16px 8px 8px;
}
.track-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
.track-list::-webkit-scrollbar{width:4px}
.track-list::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
.track-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background .12s;font-size:13px;
}
.track-item:hover{background:var(--surface2)}
.track-item.active{background:var(--accent-glow)}
.track-item.playing .track-name{color:var(--accent2)}
.track-num{width:20px;text-align:center;font-size:11px;color:var(--dim);flex-shrink:0}
.track-item.playing .track-num{color:var(--accent)}
.track-info{flex:1;min-width:0}
.track-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.track-artist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-dur{font-size:11px;color:var(--dim);flex-shrink:0}
.eq-bars{display:flex;align-items:flex-end;gap:1px;height:12px;width:14px;flex-shrink:0}
.eq-bar{width:3px;background:var(--accent);border-radius:1px;animation:eq 0.8s ease-in-out infinite alternate}
.eq-bar:nth-child(1){animation-delay:0s;height:40%}
.eq-bar:nth-child(2){animation-delay:.2s;height:70%}
.eq-bar:nth-child(3){animation-delay:.4s;height:50%}
@keyframes eq{to{height:100%}}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.main-content{flex:1;display:flex;overflow:hidden}

/* Now playing */
.now-playing{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px;position:relative;overflow:hidden;
}
.bg-glow{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 40%,var(--accent-glow),transparent 70%);
  opacity:.5;transition:opacity 1s;
}
.album-art{
  width:min(320px,55vw);aspect-ratio:1;border-radius:16px;position:relative;z-index:1;
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.album-art.playing{transform:scale(1.02)}
.album-art img{width:100%;height:100%;object-fit:cover;display:block}
.album-art-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--surface2),var(--surface3));
}
.album-art-placeholder svg{width:40%;height:40%;color:var(--dim);opacity:.5}
.vinyl-ring{
  position:absolute;inset:12%;border-radius:50%;border:2px solid rgba(255,255,255,.08);
  pointer-events:none;
}
.track-meta{text-align:center;margin-top:28px;z-index:1;max-width:400px}
.track-meta h1{font-size:22px;font-weight:600;margin-bottom:4px;letter-spacing:-.3px}
.track-meta p{font-size:14px;color:var(--muted)}

/* Visualizer */
.visualizer-wrap{
  width:100%;height:120px;margin-top:24px;position:relative;z-index:1;
  mask-image:linear-gradient(to right,transparent,black 10%,black 90%,transparent);
  -webkit-mask-image:linear-gradient(to right,transparent,black 10%,black 90%,transparent);
}
#visualizer{width:100%;height:100%;display:block}

/* Queue panel */
.queue-panel{
  width:300px;background:var(--surface);border-left:1px solid #1e1e28;
  display:flex;flex-direction:column;overflow:hidden;transition:width .25s,margin .25s;
}
.queue-panel.collapsed{width:0;border:none}
.queue-header{padding:16px;display:flex;align-items:center;justify-content:space-between}
.queue-header h3{font-size:13px;font-weight:600}
.queue-clear{font-size:11px;color:var(--muted);padding:4px 8px;border-radius:6px}
.queue-clear:hover{background:var(--surface2);color:var(--text)}
.up-next{flex:1;overflow-y:auto;padding:0 8px 8px}
.up-next-item{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;
  font-size:12px;cursor:pointer;
}
.up-next-item:hover{background:var(--surface2)}

/* Player bar */
.player-bar{
  height:var(--playerbar);background:var(--surface);border-top:1px solid #1e1e28;
  display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;
}
.mini-art{
  width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0;
  background:var(--surface2);cursor:pointer;
}
.mini-art img{width:100%;height:100%;object-fit:cover}
.mini-info{min-width:140px;max-width:200px}
.mini-info .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-info .artist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-area{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.progress-times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.progress-track{
  height:4px;background:var(--surface3);border-radius:2px;cursor:pointer;position:relative;
  transition:height .12s;
}
.progress-track:hover{height:6px}
.progress-fill{
  height:100%;background:var(--accent);border-radius:2px;width:0%;position:relative;
  transition:width .05s linear;
}
.progress-fill::after{
  content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%) scale(0);
  width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4);
  transition:transform .12s;
}
.progress-track:hover .progress-fill::after,.progress-track.dragging .progress-fill::after{transform:translateY(-50%) scale(1)}
.controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ctrl-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .12s,color .12s;
}
.ctrl-btn:hover{background:var(--surface2)}
.ctrl-btn svg{width:18px;height:18px}
.ctrl-btn.active{color:var(--accent)}
.ctrl-btn.play-btn{
  width:44px;height:44px;background:var(--accent);color:#fff;
  box-shadow:0 4px 16px var(--accent-glow);
}
.ctrl-btn.play-btn:hover{background:var(--accent2);transform:scale(1.05)}
.ctrl-btn.play-btn svg{width:20px;height:20px}
.volume-area{display:flex;align-items:center;gap:6px;flex-shrink:0;width:120px}
.volume-area svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.volume-slider{flex:1;height:4px;-webkit-appearance:none;background:var(--surface3);border-radius:2px;outline:none}
.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;background:#fff;border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}

/* Drop overlay */
.drop-overlay{
  position:absolute;inset:0;background:rgba(12,12,15,.85);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.drop-overlay.visible{opacity:1;pointer-events:all}
.drop-box{
  border:2px dashed var(--accent);border-radius:20px;padding:48px 64px;text-align:center;
}
.drop-box svg{width:48px;height:48px;color:var(--accent);margin-bottom:16px}
.drop-box h2{font-size:18px;margin-bottom:6px}
.drop-box p{font-size:13px;color:var(--muted)}

/* Empty state */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--muted);padding:32px;text-align:center;
}
.empty-state svg{width:48px;height:48px;opacity:.4}
.empty-state p{font-size:13px;max-width:240px;line-height:1.5}
.add-btn{
  margin-top:8px;padding:10px 20px;background:var(--accent);color:#fff;
  border-radius:8px;font-size:13px;font-weight:500;transition:background .15s,transform .1s;
}
.add-btn:hover{background:var(--accent2);transform:translateY(-1px)}

/* Toast */
.toast{
  position:fixed;bottom:calc(var(--playerbar) + 16px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--surface3);padding:10px 20px;border-radius:8px;
  font-size:13px;opacity:0;transition:all .3s;z-index:200;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}
input[type=file]{display:none}
</style>
</head>
<body>

<div class="titlebar">
  <div class="titlebar-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v4M12 18v4"/></svg>
    Resonance
  </div>
  <div class="titlebar-center" id="titleNow">Desktop Music Player</div>
  <div class="titlebar-controls">
    <div class="win-btn min"></div>
    <div class="win-btn max"></div>
    <div class="win-btn close"></div>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Library</h2>
      <button class="nav-item active" data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        All Tracks
      </button>
      <button class="nav-item" id="addFilesBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Add Music
      </button>
    </div>
    <div class="playlist-section">
      <h3>Playlist</h3>
      <div class="track-list" id="trackList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="main-content">
      <section class="now-playing" id="nowPlaying">
        <div class="bg-glow" id="bgGlow"></div>
        <div id="playerView">
          <div class="album-art" id="albumArt">
            <div class="album-art-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
            </div>
          </div>
          <div class="track-meta">
            <h1 id="metaTitle">No track selected</h1>
            <p id="metaArtist">Add music to begin</p>
          </div>
          <div class="visualizer-wrap">
            <canvas id="visualizer"></canvas>
          </div>
        </div>
        <div class="empty-state hidden" id="emptyState">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <p>Drop audio files here or click below to build your library</p>
          <button class="add-btn" id="emptyAddBtn">Add Music Files</button>
        </div>
      </section>
      <aside class="queue-panel" id="queuePanel">
        <div class="queue-header">
          <h3>Up Next</h3>
          <button class="queue-clear" id="clearQueue">Clear</button>
        </div>
        <div class="up-next" id="upNext"></div>
      </aside>
    </div>

    <footer class="player-bar">
      <div class="mini-art" id="miniArt">
        <div class="album-art-placeholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--surface2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:24px;height:24px;color:var(--dim)"><circle cx="12" cy="12" r="10"/></svg>
        </div>
      </div>
      <div class="mini-info">
        <div class="name" id="miniTitle">—</div>
        <div class="artist" id="miniArtist">—</div>
      </div>
      <div class="progress-area">
        <div class="progress-times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>
      <div class="volume-area">
        <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </footer>

    <div class="drop-overlay" id="dropOverlay">
      <div class="drop-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
        <h2>Drop to add music</h2>
        <p>MP3, WAV, OGG, FLAC, M4A supported</p>
      </div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple>
<div class="toast" id="toast"></div>
<audio id="audio" crossorigin="anonymous"></audio>

<script>
(function(){
  'use strict';

  const COLORS = [
    ['#7c6aef','#a78bfa'],['#ec4899','#f472b6'],['#06b6d4','#22d3ee'],
    ['#f59e0b','#fbbf24'],['#10b981','#34d399'],['#6366f1','#818cf8']
  ];

  const DEMO_TRACKS = [
    { title:'Midnight Drive', artist:'Neon Pulse', duration:0, demo:true, genre:'Synthwave' },
    { title:'Golden Hour', artist:'Amber Fields', duration:0, demo:true, genre:'Ambient' },
    { title:'City Lights', artist:'Urban Echo', duration:0, demo:true, genre:'Electronic' },
    { title:'Ocean Depths', artist:'Deep Current', duration:0, demo:true, genre:'Chill' },
    { title:'Starfall', artist:'Cosmic Drift', duration:0, demo:true, genre:'Space' }
  ];

  let tracks = [];
  let currentIndex = -1;
  let isPlaying = false;
  let shuffle = false;
  let repeat = 0; // 0 off, 1 all, 2 one
  let shuffledOrder = [];
  let audioCtx, analyser, sourceNode, animFrame;
  let objectUrls = [];

  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const trackList = $('trackList');
  const playBtn = $('playBtn');
  const playIcon = $('playIcon');
  const progressTrack = $('progressTrack');
  const progressFill = $('progressFill');
  const volumeSlider = $('volumeSlider');
  const fileInput = $('fileInput');
  const dropOverlay = $('dropOverlay');
  const visualizer = $('visualizer');
  const vCtx = visualizer.getContext('2d');

  function fmtTime(s){
    if(!s||!isFinite(s)) return '0:00';
    const m=Math.floor(s/60), sec=Math.floor(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }

  function showToast(msg){
    const t=$('toast');
    t.textContent=msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
  }

  function genArt(title, idx){
    const [c1,c2]=COLORS[idx%COLORS.length];
    const initials=title.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
      <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
      </linearGradient></defs>
      <rect width="400" height="400" fill="url(#g)"/>
      <circle cx="200" cy="200" r="80" fill="rgba(0,0,0,.25)"/>
      <text x="200" y="215" text-anchor="middle" fill="white" font-family="Segoe UI,sans-serif" font-size="48" font-weight="600">${initials}</text>
    </svg>`;
    return 'data:image/svg+xml,'+encodeURIComponent(svg);
  }

  /* Demo audio synthesis */
  function createDemoAudio(track, idx){
    return new Promise(resolve=>{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const dur=45+idx*8;
      const sr=ctx.sampleRate;
      const len=sr*dur;
      const buf=ctx.createBuffer(2,len,sr);
      const bpm=track.genre==='Synthwave'?118:track.genre==='Ambient'?72:100;
      const beat=60/bpm;

      for(let ch=0;ch<2;ch++){
        const d=buf.getChannelData(ch);
        const scales={
          Synthwave:[261.63,311.13,349.23,392,466.16,523.25],
          Ambient:[220,261.63,329.63,392,440],
          Electronic:[130.81,164.81,196,261.63,329.63],
          Chill:[174.61,207.65,261.63,311.13,349.23],
          Space:[110,138.59,164.81,220,277.18]
        };
        const scale=scales[track.genre]||scales.Ambient;

        for(let i=0;i<len;i++){
          const t=i/sr;
          let s=0;
          const prog=Math.floor(t/(dur/scale.length))%scale.length;
          const freq=scale[(prog+ch)%scale.length];

          // Pad
          s+=Math.sin(2*Math.PI*freq*t)*0.08;
          s+=Math.sin(2*Math.PI*freq*1.005*t)*0.06;
          s+=Math.sin(2*Math.PI*freq*2*t)*0.03;

          // Bass on beats
          const beatPhase=t%beat;
          if(beatPhase<0.08){
            const bassFreq=freq/2;
            s+=Math.sin(2*Math.PI*bassFreq*t)*0.12*(1-beatPhase/0.08);
          }

          // Hi-hat shimmer
          if(Math.floor(t/beat)%2===1 && beatPhase>beat*0.5 && beatPhase<beat*0.55){
            s+=(Math.random()-0.5)*0.04;
          }

          // Envelope sections
          const section=t/dur;
          let env=1;
          if(section<0.05) env=section/0.05;
          if(section>0.92) env=(1-section)/0.08;

          d[i]=s*env*0.7;
        }
      }

      const wav=encodeWav(buf);
      const blob=new Blob([wav],{type:'audio/wav'});
      const url=URL.createObjectURL(blob);
      objectUrls.push(url);
      track.url=url;
      track.duration=dur;
      ctx.close();
      resolve(track);
    });
  }

  function encodeWav(buffer){
    const numCh=buffer.numberOfChannels, sr=buffer.sampleRate;
    const samples=buffer.length;
    const bytes=44+samples*numCh*2;
    const arr=new ArrayBuffer(bytes);
    const v=new DataView(arr);
    const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    ws(0,'RIFF');v.setUint32(4,bytes-8,true);ws(8,'WAVE');ws(12,'fmt ');
    v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,numCh,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*numCh*2,true);
    v.setUint16(32,numCh*2,true);v.setUint16(34,16,true);
    ws(36,'data');v.setUint32(40,samples*numCh*2,true);
    let off=44;
    for(let i=0;i<samples;i++){
      for(let ch=0;ch<numCh;ch++){
        const s=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]));
        v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;
      }
    }
    return arr;
  }

  async function initDemoTracks(){
    for(let i=0;i<DEMO_TRACKS.length;i++){
      const t={...DEMO_TRACKS[i],id:'demo-'+i,art:genArt(DEMO_TRACKS[i].title,i)};
      await createDemoAudio(t,i);
      tracks.push(t);
    }
    renderTrackList();
    if(tracks.length) selectTrack(0);
  }

  function addFiles(files){
    const audioFiles=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|ogg|flac|m4a|aac|webm)$/i.test(f.name));
    if(!audioFiles.length){showToast('No audio files found');return;}

    audioFiles.forEach((file,i)=>{
      const url=URL.createObjectURL(file);
      objectUrls.push(url);
      const name=file.name.replace(/\.[^.]+$/,'');
      const parts=name.split(' - ');
      tracks.push({
        id:'file-'+Date.now()+'-'+i,
        title:parts.length>1?parts.slice(1).join(' - '):name,
        artist:parts.length>1?parts[0]:'Unknown Artist',
        url, duration:0, art:genArt(parts.length>1?parts.slice(1).join(' - '):name, tracks.length+i)
      });
    });

    renderTrackList();
    $('emptyState').classList.add('hidden');
    $('playerView').classList.remove('hidden');
    if(currentIndex<0) selectTrack(tracks.length-audioFiles.length);
    showToast(`Added ${audioFiles.length} track${audioFiles.length>1?'s':''}`);
  }

  function renderTrackList(){
    trackList.innerHTML='';
    tracks.forEach((t,i)=>{
      const el=document.createElement('div');
      el.className='track-item'+(i===currentIndex?' active':'')+(i===currentIndex&&isPlaying?' playing':'');
      el.innerHTML=`
        <span class="track-num">${i===currentIndex&&isPlaying?'<div class="eq-bars"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>':i+1}</span>
        <div class="track-info"><div class="track-name">${esc(t.title)}</div><div class="track-artist">${esc(t.artist)}</div></div>
        <span class="track-dur">${t.duration?fmtTime(t.duration):'—'}</span>`;
      el.onclick=()=>selectTrack(i);
      trackList.appendChild(el);
    });
    renderQueue();
  }

  function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  function renderQueue(){
    const upNext=$('upNext');
    upNext.innerHTML='';
    if(currentIndex<0||!tracks.length) return;
    const order=getPlayOrder();
    const curPos=order.indexOf(currentIndex);
    for(let i=curPos+1;i<order.length&&i<curPos+8;i++){
      const t=tracks[order[i]];
      const el=document.createElement('div');
      el.className='up-next-item';
      el.innerHTML=`<span style="color:var(--dim);width:16px">${i-curPos}</span><div style="flex:1;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</div><div style="font-size:11px;color:var(--muted)">${esc(t.artist)}</div></div>`;
      el.onclick=()=>selectTrack(order[i]);
      upNext.appendChild(el);
    }
  }

  function getPlayOrder(){
    if(shuffle){
      if(!shuffledOrder.length||shuffledOrder.length!==tracks.length){
        shuffledOrder=tracks.map((_,i)=>i);
        for(let i=shuffledOrder.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [shuffledOrder[i],shuffledOrder[j]]=[shuffledOrder[j],shuffledOrder[i]];
        }
        if(currentIndex>=0){
          const ci=shuffledOrder.indexOf(currentIndex);
          if(ci>0)[shuffledOrder[0],shuffledOrder[ci]]=[shuffledOrder[ci],shuffledOrder[0]];
        }
      }
      return shuffledOrder;
    }
    return tracks.map((_,i)=>i);
  }

  function selectTrack(idx){
    if(idx<0||idx>=tracks.length) return;
    currentIndex=idx;
    const t=tracks[idx];
    audio.src=t.url;
    audio.load();
    updateUI(t);
    renderTrackList();
    if(isPlaying) play();
  }

  function updateUI(t){
    if(!t) return;
    $('metaTitle').textContent=t.title;
    $('metaArtist').textContent=t.artist;
    $('miniTitle').textContent=t.title;
    $('miniArtist').textContent=t.artist;
    $('titleNow').textContent=t.title+' — '+t.artist;
    setAlbumArt(t.art);
  }

  function setAlbumArt(src){
    const art=$('albumArt');
    art.innerHTML=`<img src="${src}" alt=""><div class="vinyl-ring"></div>`;
    $('miniArt').innerHTML=`<img src="${src}" alt="">`;
  }

  function play(){
    if(currentIndex<0&&tracks.length){selectTrack(0);return;}
    if(currentIndex<0) return;

    initAudioContext();
    audio.play().then(()=>{
      isPlaying=true;
      $('albumArt').classList.add('playing');
      playIcon.innerHTML='<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
      renderTrackList();
      startVisualizer();
    }).catch(()=>showToast('Unable to play'));
  }

  function pause(){
    audio.pause();
    isPlaying=false;
    $('albumArt').classList.remove('playing');
    playIcon.innerHTML='<path d="M8 5v14l11-7L8 5z"/>';
    renderTrackList();
    stopVisualizer();
  }

  function togglePlay(){
    isPlaying?pause():play();
  }

  function nextTrack(){
    if(!tracks.length) return;
    const order=getPlayOrder();
    const pos=order.indexOf(currentIndex);
    if(pos<order.length-1) selectTrack(order[pos+1]);
    else if(repeat>=1) selectTrack(order[0]);
    if(isPlaying) play();
  }

  function prevTrack(){
    if(audio.currentTime>3){audio.currentTime=0;return;}
    if(!tracks.length) return;
    const order=getPlayOrder();
    const pos=order.indexOf(currentIndex);
    if(pos>0) selectTrack(order[pos-1]);
    else if(repeat>=1) selectTrack(order[order.length-1]);
    if(isPlaying) play();
  }

  function initAudioContext(){
    if(audioCtx) return;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    sourceNode=audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function startVisualizer(){
    if(!analyser) return;
    const buf=new Uint8Array(analyser.frequencyBinCount);
    function draw(){
      animFrame=requestAnimationFrame(draw);
      analyser.getByteFrequencyData(buf);
      const w=visualizer.width=visualizer.clientWidth*devicePixelRatio;
      const h=visualizer.height=visualizer.clientHeight*devicePixelRatio;
      vCtx.clearRect(0,0,w,h);
      const bars=64;
      const bw=w/bars;
      for(let i=0;i<bars;i++){
        const idx=Math.floor(i/bars*buf.length);
        const val=buf[idx]/255;
        const bh=val*h*0.85;
        const x=i*bw;
        const grad=vCtx.createLinearGradient(0,h-bh,0,h);
        grad.addColorStop(0,'rgba(124,106,239,0.9)');
        grad.addColorStop(1,'rgba(124,106,239,0.15)');
        vCtx.fillStyle=grad;
        vCtx.beginPath();
        vCtx.roundRect(x+bw*0.15,h-bh,bw*0.7,bh,[2,2,0,0]);
        vCtx.fill();
      }
    }
    draw();
  }

  function stopVisualizer(){
    cancelAnimationFrame(animFrame);
    vCtx.clearRect(0,0,visualizer.width,visualizer.height);
  }

  /* Progress */
  audio.addEventListener('timeupdate',()=>{
    const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;
    progressFill.style.width=pct+'%';
    $('timeCurrent').textContent=fmtTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata',()=>{
    $('timeTotal').textContent=fmtTime(audio.duration);
    if(currentIndex>=0) tracks[currentIndex].duration=audio.duration;
    renderTrackList();
  });

  audio.addEventListener('ended',()=>{
    if(repeat===2){audio.currentTime=0;play();return;}
    nextTrack();
  });

  let dragging=false;
  progressTrack.addEventListener('mousedown',e=>{dragging=true;progressTrack.classList.add('dragging');seek(e);});
  document.addEventListener('mousemove',e=>{if(dragging)seek(e);});
  document.addEventListener('mouseup',()=>{dragging=false;progressTrack.classList.remove('dragging');});

  function seek(e){
    const rect=progressTrack.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    if(audio.duration) audio.currentTime=pct*audio.duration;
  }

  /* Volume */
  audio.volume=0.8;
  volumeSlider.addEventListener('input',()=>{
    audio.volume=volumeSlider.value/100;
    updateVolIcon();
  });

  function updateVolIcon(){
    const v=audio.volume;
    const icon=$('volIcon');
    if(v===0) icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    else if(v<0.5) icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/>';
    else icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>';
  }

  /* Controls */
  playBtn.onclick=togglePlay;
  $('nextBtn').onclick=nextTrack;
  $('prevBtn').onclick=prevTrack;

  $('shuffleBtn').onclick=function(){
    shuffle=!shuffle;
    this.classList.toggle('active',shuffle);
    shuffledOrder=[];
    renderQueue();
  };

  $('repeatBtn').onclick=function(){
    repeat=(repeat+1)%3;
    this.classList.toggle('active',repeat>0);
    this.style.opacity=repeat===2?'1':'';
    if(repeat===2) this.querySelector('svg').innerHTML+='<text x="12" y="16" text-anchor="middle" fill="currentColor" font-size="8" font-weight="bold">1</text>';
  };

  /* File handling */
  fileInput.onchange=e=>{if(e.target.files.length)addFiles(e.target.files);fileInput.value='';};
  $('addFilesBtn').onclick=()=>fileInput.click();
  $('emptyAddBtn').onclick=()=>fileInput.click();

  let dragCounter=0;
  document.addEventListener('dragenter',e=>{e.preventDefault();dragCounter++;dropOverlay.classList.add('visible');});
  document.addEventListener('dragleave',e=>{e.preventDefault();dragCounter--;if(dragCounter<=0){dragCounter=0;dropOverlay.classList.remove('visible');}});
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>{
    e.preventDefault();dragCounter=0;dropOverlay.classList.remove('visible');
    if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  /* Keyboard */
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    switch(e.code){
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': if(e.shiftKey) nextTrack(); else audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5); break;
      case 'ArrowLeft': if(e.shiftKey) prevTrack(); else audio.currentTime=Math.max(0,audio.currentTime-5); break;
      case 'ArrowUp': volumeSlider.value=Math.min(100,+volumeSlider.value+5);audio.volume=volumeSlider.value/100;updateVolIcon();break;
      case 'ArrowDown': volumeSlider.value=Math.max(0,+volumeSlider.value-5);audio.volume=volumeSlider.value/100;updateVolIcon();break;
    }
  });

  window.addEventListener('resize',()=>{
    if(isPlaying) startVisualizer();
  });

  window.addEventListener('beforeunload',()=>{
    objectUrls.forEach(u=>URL.revokeObjectURL(u));
  });

  initDemoTracks();
})();
</script>
</body>
</html>
