<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon City — Desktop Music Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #0a0b12;
      --bg-panel: rgba(18, 20, 32, 0.82);
      --bg-elevated: rgba(28, 32, 52, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaf4;
      --text-muted: #8b90a8;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.45);
      --cyan: #2dd4bf;
      --pink: #f472b6;
      --orange: #fb923c;
      --radius: 14px;
      --radius-sm: 8px;
      --sidebar-w: 260px;
      --player-h: 96px;
      --titlebar-h: 42px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg-deep);
    }

    /* City skyline backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(124, 92, 255, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(45, 212, 191, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse 50% 35% at 80% 70%, rgba(244, 114, 182, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, #0d0e18 0%, #0a0b12 40%, #080910 100%);
    }

    .skyline {
      position: absolute;
      bottom: var(--player-h);
      left: 0;
      right: 0;
      height: 180px;
      opacity: 0.35;
      pointer-events: none;
    }

    .skyline svg { width: 100%; height: 100%; }

    .window {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.04);
      backdrop-filter: blur(2px);
    }

    /* Title bar */
    .titlebar {
      height: var(--titlebar-h);
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: rgba(12, 14, 24, 0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
      margin-right: 16px;
    }

    .traffic-lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .traffic-lights span:nth-child(1) { background: #ff5f57; }
    .traffic-lights span:nth-child(2) { background: #febc2e; }
    .traffic-lights span:nth-child(3) { background: #28c840; }

    .titlebar-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .titlebar-title strong { color: var(--text); }

    /* Main layout */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 18px 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      display: grid;
      place-items: center;
      font-size: 16px;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .nav {
      padding: 8px 10px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 8px 8px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active {
      background: rgba(124, 92, 255, 0.15);
      color: var(--text);
    }

    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
    }

    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px dashed rgba(124, 92, 255, 0.4);
      background: rgba(124, 92, 255, 0.08);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .add-btn:hover {
      background: rgba(124, 92, 255, 0.16);
      border-color: var(--accent);
    }

    #fileInput { display: none; }

    /* Content area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: rgba(10, 11, 18, 0.5);
    }

    .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .view.active { display: flex; }

    /* Now Playing view */
    .now-playing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      gap: 28px;
      position: relative;
    }

    .art-container {
      position: relative;
      width: min(320px, 60vw);
      height: min(320px, 60vw);
    }

    .art-glow {
      position: absolute;
      inset: -30%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color, var(--accent-glow)) 0%, transparent 70%);
      filter: blur(40px);
      opacity: 0.6;
      transition: background 0.8s ease;
    }

    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.1);
      background: var(--bg-elevated);
    }

    .art-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .art-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(145deg, rgba(124,92,255,0.2), rgba(45,212,191,0.1));
    }

    .art-placeholder .vinyl {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #1a1a2e 18%, transparent 19%),
        repeating-radial-gradient(circle at center, #222 0px, #222 2px, #333 2px, #333 4px);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.06), inset 0 0 30px rgba(0,0,0,0.5);
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }

    .art-placeholder .vinyl.playing { animation-play-state: running; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .art-placeholder span {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 0 20px;
    }

    canvas#visualizer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      width: 100%;
      opacity: 0.85;
    }

    .track-info {
      text-align: center;
      max-width: 400px;
    }

    .track-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Library view */
    .library-header {
      padding: 24px 28px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .library-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .library-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      margin: 0 28px 12px;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
    }

    .track-list-header {
      display: grid;
      grid-template-columns: 36px 1fr 120px 60px;
      gap: 12px;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      margin: 0 16px 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 36px 1fr 120px 60px;
      gap: 12px;
      align-items: center;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.12s;
      font-size: 13.5px;
    }

    .track-row:hover { background: rgba(255,255,255,0.04); }
    .track-row.playing {
      background: rgba(124, 92, 255, 0.12);
    }

    .track-row .num {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    .track-row.playing .num { color: var(--accent); }

    .track-row .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .track-row .name small {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .track-row .duration {
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .track-row .actions {
      opacity: 0;
      transition: opacity 0.12s;
      text-align: right;
    }

    .track-row:hover .actions { opacity: 1; }

    .track-row .actions button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      font-family: inherit;
    }

    .track-row .actions button:hover { color: var(--pink); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      padding: 40px;
      text-align: center;
    }

    .empty-state .icon { font-size: 48px; opacity: 0.4; }
    .empty-state p { font-size: 14px; max-width: 280px; line-height: 1.5; }

    /* Drop zone overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(124, 92, 255, 0.15);
      border: 3px dashed var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      backdrop-filter: blur(4px);
    }

    .drop-overlay.active { display: flex; }

    /* Player bar */
    .player-bar {
      height: var(--player-h);
      background: rgba(12, 14, 24, 0.97);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
    }

    .player-track {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .player-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: var(--bg-elevated);
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .player-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .player-meta { min-width: 0; }
    .player-meta .title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-meta .artist {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: color 0.12s, background 0.12s, transform 0.1s;
      font-family: inherit;
    }

    .ctrl:hover { color: var(--text); }
    .ctrl.active { color: var(--accent); }

    .ctrl-sm { width: 32px; height: 32px; font-size: 14px; }
    .ctrl-lg {
      width: 44px;
      height: 44px;
      background: var(--text);
      color: var(--bg-deep);
      font-size: 18px;
    }

    .ctrl-lg:hover {
      transform: scale(1.06);
      background: #fff;
      color: var(--bg-deep);
    }

    .progress-area {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 520px;
    }

    .time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar:hover { height: 6px; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      border-radius: 2px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.12s;
    }

    .progress-bar:hover .progress-fill::after { transform: translateY(-50%) scale(1); }

    .player-volume {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .volume-slider {
      width: 90px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(var(--player-h) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 700px) {
      .sidebar { width: 200px; }
      .player-bar { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; padding: 12px; }
      .player-volume { display: none; }
      .track-list-header, .track-row { grid-template-columns: 30px 1fr 50px; }
      .track-list-header span:nth-child(3),
      .track-row .duration { display: none; }
    }
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="skyline">
      <svg viewBox="0 0 1200 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect fill="#12141f" x="0" y="80" width="60" height="100"/>
        <rect fill="#161825" x="70" y="50" width="45" height="130"/>
        <rect fill="#1a1c2e" x="125" y="70" width="55" height="110"/>
        <rect fill="#141622" x="190" y="30" width="40" height="150"/>
        <rect fill="#181a28" x="240" y="60" width="50" height="120"/>
        <rect fill="#1e2035" x="300" y="20" width="35" height="160"/>
        <rect fill="#151722" x="345" y="55" width="60" height="125"/>
        <rect fill="#1a1c2e" x="415" y="40" width="45" height="140"/>
        <rect fill="#12141f" x="470" y="65" width="70" height="115"/>
        <rect fill="#181a28" x="550" y="25" width="38" height="155"/>
        <rect fill="#1e2035" x="598" y="50" width="52" height="130"/>
        <rect fill="#161825" x="660" y="35" width="42" height="145"/>
        <rect fill="#141622" x="712" y="60" width="58" height="120"/>
        <rect fill="#1a1c2e" x="780" y="15" width="44" height="165"/>
        <rect fill="#181a28" x="834" y="45" width="50" height="135"/>
        <rect fill="#12141f" x="894" y="70" width="65" height="110"/>
        <rect fill="#1e2035" x="969" y="30" width="40" height="150"/>
        <rect fill="#161825" x="1019" y="55" width="55" height="125"/>
        <rect fill="#141622" x="1084" y="40" width="48" height="140"/>
        <rect fill="#1a1c2e" x="1142" y="65" width="58" height="115"/>
        <!-- Neon windows -->
        <g opacity="0.6">
          <rect fill="#7c5cff" x="80" y="60" width="4" height="6" rx="1"/>
          <rect fill="#2dd4bf" x="88" y="60" width="4" height="6" rx="1"/>
          <rect fill="#f472b6" x="80" y="72" width="4" height="6" rx="1"/>
          <rect fill="#fb923c" x="310" y="35" width="4" height="6" rx="1"/>
          <rect fill="#7c5cff" x="318" y="35" width="4" height="6" rx="1"/>
          <rect fill="#2dd4bf" x="310" y="47" width="4" height="6" rx="1"/>
          <rect fill="#f472b6" x="560" y="40" width="4" height="6" rx="1"/>
          <rect fill="#7c5cff" x="568" y="40" width="4" height="6" rx="1"/>
          <rect fill="#2dd4bf" x="610" y="65" width="4" height="6" rx="1"/>
          <rect fill="#fb923c" x="790" y="30" width="4" height="6" rx="1"/>
          <rect fill="#f472b6" x="798" y="30" width="4" height="6" rx="1"/>
          <rect fill="#7c5cff" x="980" y="45" width="4" height="6" rx="1"/>
          <rect fill="#2dd4bf" x="988" y="45" width="4" height="6" rx="1"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="drop-overlay" id="dropOverlay">Drop audio files here</div>
  <div class="toast" id="toast"></div>

  <div class="window">
    <div class="titlebar">
      <div class="traffic-lights"><span></span><span></span><span></span></div>
      <div class="titlebar-title"><strong>Neon City</strong> — Music Player</div>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">♪</div>
            Neon City
          </div>
        </div>
        <nav class="nav">
          <div class="nav-label">Browse</div>
          <button class="nav-item active" data-view="now-playing">
            <span class="icon">▶</span> Now Playing
          </button>
          <button class="nav-item" data-view="library">
            <span class="icon">☰</span> Library
          </button>
          <div class="nav-label" style="margin-top:12px">Playlists</div>
          <button class="nav-item" data-view="library" data-filter="all">
            <span class="icon">♫</span> All Tracks
          </button>
        </nav>
        <div class="sidebar-footer">
          <button class="add-btn" id="addBtn">+ Add Music</button>
          <input type="file" id="fileInput" accept="audio/*" multiple>
        </div>
      </aside>

      <div class="content">
        <div class="view active" id="view-now-playing">
          <div class="now-playing">
            <div class="art-container">
              <div class="art-glow" id="artGlow"></div>
              <div class="art-frame" id="artFrame">
                <div class="art-placeholder" id="artPlaceholder">
                  <div class="vinyl" id="vinyl"></div>
                  <span>Drop audio files or click Add Music</span>
                </div>
                <img id="artImg" style="display:none" alt="Album art">
                <canvas id="visualizer"></canvas>
              </div>
            </div>
            <div class="track-info">
              <div class="track-title" id="npTitle">No track selected</div>
              <div class="track-artist" id="npArtist">Add your music to begin</div>
            </div>
          </div>
        </div>

        <div class="view" id="view-library">
          <div class="library-header">
            <h2>Your Library</h2>
            <span class="library-count" id="libraryCount">0 tracks</span>
          </div>
          <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search tracks…">
          </div>
          <div class="track-list" id="trackList">
            <div class="empty-state" id="emptyState">
              <div class="icon">🎵</div>
              <p>Your library is empty. Add MP3, WAV, FLAC, or other audio files to get started.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="player-bar">
      <div class="player-track">
        <div class="player-thumb" id="playerThumb">♪</div>
        <div class="player-meta">
          <div class="title" id="barTitle">—</div>
          <div class="artist" id="barArtist">—</div>
        </div>
      </div>

      <div class="player-controls">
        <div class="control-buttons">
          <button class="ctrl ctrl-sm" id="btnShuffle" title="Shuffle">🔀</button>
          <button class="ctrl ctrl-sm" id="btnPrev" title="Previous">⏮</button>
          <button class="ctrl ctrl-lg" id="btnPlay" title="Play">▶</button>
          <button class="ctrl ctrl-sm" id="btnNext" title="Next">⏭</button>
          <button class="ctrl ctrl-sm" id="btnRepeat" title="Repeat">🔁</button>
        </div>
        <div class="progress-area">
          <span class="time" id="timeCurrent">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time" id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="player-volume">
        <button class="ctrl ctrl-sm" id="btnMute" title="Mute">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    (function () {
      const COLORS = ['#7c5cff', '#2dd4bf', '#f472b6', '#fb923c', '#60a5fa', '#a78bfa'];
      const DEMO_TRACKS = [
        { title: 'Midnight Drive', artist: 'Neon Pulse', duration: 0, demo: true },
        { title: 'City Lights', artist: 'Skyline Echo', duration: 0, demo: true },
        { title: 'Rain on Glass', artist: 'Lo-Fi District', duration: 0, demo: true },
      ];

      const state = {
        tracks: [],
        currentIndex: -1,
        shuffle: false,
        repeat: 'off',
        shuffledOrder: [],
        searchQuery: '',
        audioCtx: null,
        analyser: null,
        sourceNode: null,
        visualizerRunning: false,
      };

      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => document.querySelectorAll(sel);

      const audio = $('#audio');
      const fileInput = $('#fileInput');
      const addBtn = $('#addBtn');
      const dropOverlay = $('#dropOverlay');
      const toast = $('#toast');

      const btnPlay = $('#btnPlay');
      const btnPrev = $('#btnPrev');
      const btnNext = $('#btnNext');
      const btnShuffle = $('#btnShuffle');
      const btnRepeat = $('#btnRepeat');
      const btnMute = $('#btnMute');
      const volumeSlider = $('#volumeSlider');
      const progressBar = $('#progressBar');
      const progressFill = $('#progressFill');
      const timeCurrent = $('#timeCurrent');
      const timeTotal = $('#timeTotal');

      const npTitle = $('#npTitle');
      const npArtist = $('#npArtist');
      const barTitle = $('#barTitle');
      const barArtist = $('#barArtist');
      const artImg = $('#artImg');
      const artPlaceholder = $('#artPlaceholder');
      const artGlow = $('#artGlow');
      const vinyl = $('#vinyl');
      const playerThumb = $('#playerThumb');
      const trackList = $('#trackList');
      const emptyState = $('#emptyState');
      const libraryCount = $('#libraryCount');
      const searchInput = $('#searchInput');
      const visualizerCanvas = $('#visualizer');
      const vCtx = visualizerCanvas.getContext('2d');

      audio.volume = 0.8;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      function parseFilename(name) {
        const base = name.replace(/\.[^.]+$/, '');
        const parts = base.split(/[-–—]/);
        if (parts.length >= 2) {
          return { title: parts.slice(1).join('-').trim() || base, artist: parts[0].trim() };
        }
        const byMatch = base.match(/^(.+?)\s+by\s+(.+)$/i);
        if (byMatch) return { title: byMatch[1].trim(), artist: byMatch[2].trim() };
        return { title: base, artist: 'Unknown Artist' };
      }

      function hashColor(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
        return COLORS[Math.abs(h) % COLORS.length];
      }

      function addTracks(files) {
        const audioFiles = [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|aac|webm)$/i.test(f.name));
        if (!audioFiles.length) {
          showToast('No audio files found');
          return;
        }

        audioFiles.forEach(file => {
          const meta = parseFilename(file.name);
          const url = URL.createObjectURL(file);
          state.tracks.push({
            title: meta.title,
            artist: meta.artist,
            file,
            url,
            duration: 0,
            color: hashColor(meta.title + meta.artist),
          });
        });

        renderLibrary();
        showToast(`Added ${audioFiles.length} track${audioFiles.length > 1 ? 's' : ''}`);

        if (state.currentIndex === -1) playTrack(0);
      }

      function getFilteredTracks() {
        const q = state.searchQuery.toLowerCase();
        return state.tracks
          .map((t, i) => ({ ...t, index: i }))
          .filter(t => !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
      }

      function renderLibrary() {
        const filtered = getFilteredTracks();
        libraryCount.textContent = `${state.tracks.length} track${state.tracks.length !== 1 ? 's' : ''}`;

        if (!state.tracks.length) {
          trackList.innerHTML = '';
          trackList.appendChild(emptyState);
          emptyState.style.display = '';
          return;
        }

        emptyState.style.display = 'none';
        const header = document.createElement('div');
        header.className = 'track-list-header';
        header.innerHTML = '<span>#</span><span>Title</span><span>Album</span><span>Time</span>';

        const frag = document.createDocumentFragment();
        frag.appendChild(header);

        filtered.forEach((track, i) => {
          const row = document.createElement('div');
          row.className = 'track-row' + (track.index === state.currentIndex ? ' playing' : '');
          row.innerHTML = `
            <span class="num">${track.index === state.currentIndex && !audio.paused ? '♪' : i + 1}</span>
            <span class="name">${track.title}<small>${track.artist}</small></span>
            <span class="duration">${track.artist}</span>
            <span class="duration">${formatTime(track.duration)}</span>
          `;
          row.addEventListener('dblclick', () => playTrack(track.index));
          row.addEventListener('click', () => {
            if (track.index === state.currentIndex) togglePlay();
            else playTrack(track.index);
          });
          frag.appendChild(row);
        });

        trackList.innerHTML = '';
        trackList.appendChild(frag);
      }

      function updateUI() {
        const track = state.tracks[state.currentIndex];
        if (!track) {
          npTitle.textContent = 'No track selected';
          npArtist.textContent = 'Add your music to begin';
          barTitle.textContent = '—';
          barArtist.textContent = '—';
          btnPlay.textContent = '▶';
          vinyl.classList.remove('playing');
          artImg.style.display = 'none';
          artPlaceholder.style.display = '';
          playerThumb.textContent = '♪';
          return;
        }

        npTitle.textContent = track.title;
        npArtist.textContent = track.artist;
        barTitle.textContent = track.title;
        barArtist.textContent = track.artist;
        artGlow.style.setProperty('--glow-color', track.color + '66');

        if (track.artUrl) {
          artImg.src = track.artUrl;
          artImg.style.display = 'block';
          artPlaceholder.style.display = 'none';
          playerThumb.innerHTML = `<img src="${track.artUrl}" alt="">`;
        } else {
          artImg.style.display = 'none';
          artPlaceholder.style.display = '';
          playerThumb.textContent = '♪';
          playerThumb.style.background = `linear-gradient(135deg, ${track.color}44, ${track.color}22)`;
        }

        btnPlay.textContent = audio.paused ? '▶' : '⏸';
        vinyl.classList.toggle('playing', !audio.paused);
        renderLibrary();
      }

      function initAudioContext() {
        if (state.audioCtx) return;
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        state.analyser = state.audioCtx.createAnalyser();
        state.analyser.fftSize = 128;
        state.analyser.smoothingTimeConstant = 0.8;

        state.sourceNode = state.audioCtx.createMediaElementSource(audio);
        state.sourceNode.connect(state.analyser);
        state.analyser.connect(state.audioCtx.destination);
      }

      function resizeVisualizer() {
        const rect = visualizerCanvas.parentElement.getBoundingClientRect();
        visualizerCanvas.width = rect.width * devicePixelRatio;
        visualizerCanvas.height = 60 * devicePixelRatio;
        vCtx.scale(devicePixelRatio, devicePixelRatio);
      }

      function drawVisualizer() {
        if (!state.analyser || audio.paused) {
          state.visualizerRunning = false;
          return;
        }

        state.visualizerRunning = true;
        const w = visualizerCanvas.width / devicePixelRatio;
        const h = 60;
        const bufferLength = state.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        state.analyser.getByteFrequencyData(dataArray);

        vCtx.clearRect(0, 0, w, h);
        const barCount = 48;
        const step = Math.floor(bufferLength / barCount);
        const barW = w / barCount - 2;
        const track = state.tracks[state.currentIndex];
        const color = track ? track.color : '#7c5cff';

        for (let i = 0; i < barCount; i++) {
          const v = dataArray[i * step] / 255;
          const barH = v * h * 0.9;
          const x = i * (barW + 2);
          const grad = vCtx.createLinearGradient(0, h, 0, h - barH);
          grad.addColorStop(0, color + '00');
          grad.addColorStop(1, color);
          vCtx.fillStyle = grad;
          vCtx.fillRect(x, h - barH, barW, barH);
        }

        requestAnimationFrame(drawVisualizer);
      }

      function extractArt(file, trackIndex) {
        if (!file.type.includes('mp3') && !file.type.includes('mpeg')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const view = new DataView(e.target.result);
          if (view.getUint32(0) !== 0x494433) return;
          let offset = 10;
          const flags = view.getUint8(5);
          if (flags & 0x40) offset += 4 + view.getUint32(offset);
          if (flags & 0x20) offset += 4 + view.getUint32(offset);

          while (offset < view.byteLength - 10) {
            const id = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
            const size = view.getUint32(offset + 4);
            if (id === 'APIC' || id === 'PIC ') {
              let picOffset = offset + 10;
              const encoding = view.getUint8(picOffset);
              picOffset++;
              while (picOffset < offset + 10 + size && view.getUint8(picOffset) !== 0) picOffset++;
              picOffset++;
              while (picOffset < offset + 10 + size && view.getUint8(picOffset) !== 0) picOffset++;
              picOffset++;
              const mimeEnd = picOffset;
              while (picOffset < offset + 10 + size && view.getUint8(picOffset) !== 0) picOffset++;
              picOffset = mimeEnd;
              const imgData = e.target.result.slice(picOffset, offset + 10 + size);
              const blob = new Blob([imgData], { type: 'image/jpeg' });
              const artUrl = URL.createObjectURL(blob);
              state.tracks[trackIndex].artUrl = artUrl;
              if (trackIndex === state.currentIndex) updateUI();
              break;
            }
            offset += 10 + size;
          }
        };
        reader.readAsArrayBuffer(file.slice(0, Math.min(file.size, 512000)));
      }

      function playTrack(index) {
        if (index < 0 || index >= state.tracks.length) return;

        state.currentIndex = index;
        const track = state.tracks[index];

        audio.src = track.url;
        audio.play().catch(() => {});
        initAudioContext();
        if (state.audioCtx.state === 'suspended') state.audioCtx.resume();

        extractArt(track.file, index);
        updateUI();
        resizeVisualizer();
        if (!state.visualizerRunning) drawVisualizer();
      }

      function togglePlay() {
        if (state.currentIndex === -1) {
          if (state.tracks.length) playTrack(0);
          return;
        }
        if (audio.paused) {
          audio.play();
          initAudioContext();
          if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
          if (!state.visualizerRunning) drawVisualizer();
        } else {
          audio.pause();
        }
        updateUI();
      }

      function getNextIndex() {
        if (!state.tracks.length) return -1;
        if (state.shuffle) {
          if (!state.shuffledOrder.length || state.shuffledOrder.length !== state.tracks.length) {
            state.shuffledOrder = state.tracks.map((_, i) => i).sort(() => Math.random() - 0.5);
          }
          const pos = state.shuffledOrder.indexOf(state.currentIndex);
          return state.shuffledOrder[(pos + 1) % state.shuffledOrder.length];
        }
        return (state.currentIndex + 1) % state.tracks.length;
      }

      function getPrevIndex() {
        if (!state.tracks.length) return -1;
        if (audio.currentTime > 3) return state.currentIndex;
        if (state.shuffle) {
          if (!state.shuffledOrder.length) state.shuffledOrder = state.tracks.map((_, i) => i).sort(() => Math.random() - 0.5);
          const pos = state.shuffledOrder.indexOf(state.currentIndex);
          return state.shuffledOrder[(pos - 1 + state.shuffledOrder.length) % state.shuffledOrder.length];
        }
        return (state.currentIndex - 1 + state.tracks.length) % state.tracks.length;
      }

      function seek(e) {
        const rect = progressBar.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (audio.duration) audio.currentTime = ratio * audio.duration;
      }

      // Event listeners
      addBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => { addTracks(e.target.files); fileInput.value = ''; });

      ['dragenter', 'dragover'].forEach(ev => {
        document.addEventListener(ev, (e) => { e.preventDefault(); dropOverlay.classList.add('active'); });
      });
      ['dragleave', 'drop'].forEach(ev => {
        document.addEventListener(ev, (e) => { e.preventDefault(); dropOverlay.classList.remove('active'); });
      });
      document.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) addTracks(e.dataTransfer.files); });

      btnPlay.addEventListener('click', togglePlay);
      btnPrev.addEventListener('click', () => playTrack(getPrevIndex()));
      btnNext.addEventListener('click', () => playTrack(getNextIndex()));

      btnShuffle.addEventListener('click', () => {
        state.shuffle = !state.shuffle;
        btnShuffle.classList.toggle('active', state.shuffle);
        state.shuffledOrder = [];
        showToast(state.shuffle ? 'Shuffle on' : 'Shuffle off');
      });

      btnRepeat.addEventListener('click', () => {
        const modes = ['off', 'all', 'one'];
        const idx = modes.indexOf(state.repeat);
        state.repeat = modes[(idx + 1) % modes.length];
        btnRepeat.classList.toggle('active', state.repeat !== 'off');
        btnRepeat.textContent = state.repeat === 'one' ? '🔂' : '🔁';
        showToast(`Repeat: ${state.repeat}`);
      });

      volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value / 100;
        btnMute.textContent = audio.volume === 0 ? '🔇' : '🔊';
      });

      btnMute.addEventListener('click', () => {
        if (audio.volume > 0) {
          btnMute.dataset.prevVol = volumeSlider.value;
          audio.volume = 0;
          volumeSlider.value = 0;
          btnMute.textContent = '🔇';
        } else {
          const prev = btnMute.dataset.prevVol || 80;
          audio.volume = prev / 100;
          volumeSlider.value = prev;
          btnMute.textContent = '🔊';
        }
      });

      progressBar.addEventListener('click', seek);

      audio.addEventListener('timeupdate', () => {
        timeCurrent.textContent = formatTime(audio.currentTime);
        if (audio.duration) {
          progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = formatTime(audio.duration);
        if (state.currentIndex >= 0) {
          state.tracks[state.currentIndex].duration = audio.duration;
          renderLibrary();
        }
      });

      audio.addEventListener('ended', () => {
        if (state.repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
        if (state.repeat === 'all' || state.currentIndex < state.tracks.length - 1) {
          playTrack(getNextIndex());
        } else {
          updateUI();
        }
      });

      audio.addEventListener('play', updateUI);
      audio.addEventListener('pause', updateUI);

      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderLibrary();
      });

      $$('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          $$('.nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');
          const view = item.dataset.view;
          $$('.view').forEach(v => v.classList.remove('active'));
          $(`#view-${view}`).classList.add('active');
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.code) {
          case 'Space': e.preventDefault(); togglePlay(); break;
          case 'ArrowRight': if (e.shiftKey) playTrack(getNextIndex()); else if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); break;
          case 'ArrowLeft': if (e.shiftKey) playTrack(getPrevIndex()); else audio.currentTime = Math.max(0, audio.currentTime - 5); break;
          case 'ArrowUp': audio.volume = Math.min(1, audio.volume + 0.05); volumeSlider.value = audio.volume * 100; break;
          case 'ArrowDown': audio.volume = Math.max(0, audio.volume - 0.05); volumeSlider.value = audio.volume * 100; break;
        }
      });

      window.addEventListener('resize', resizeVisualizer);
      resizeVisualizer();

      // Seed demo library entries for visual polish when empty
      renderLibrary();
    })();
  </script>
</body>
</html>
