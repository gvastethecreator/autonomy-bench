<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon City — Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #0a0b12;
      --bg-panel: rgba(18, 20, 32, 0.72);
      --bg-glass: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaf0;
      --text-muted: #7a8099;
      --neon-cyan: #00e5ff;
      --neon-pink: #ff2d95;
      --neon-purple: #a855f7;
      --glow-cyan: 0 0 24px rgba(0, 229, 255, 0.35);
      --glow-pink: 0 0 24px rgba(255, 45, 149, 0.35);
      --radius: 16px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      user-select: none;
    }

    /* City skyline background */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 50% 35% at 80% 75%, rgba(255, 45, 149, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0a0b12 0%, #12141f 40%, #1a1028 100%);
    }

    .skyline {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35vh;
      z-index: 0;
      opacity: 0.5;
    }

    .skyline svg {
      width: 100%;
      height: 100%;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      opacity: var(--op, 0.4);
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--op, 0.4); }
      50% { opacity: 0.1; }
    }

    /* Main app shell */
    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 1fr auto;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      gap: 20px;
    }

    /* Sidebar playlist */
    .sidebar {
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .logo span {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sidebar-sub {
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .playlist {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .playlist::-webkit-scrollbar { width: 4px; }
    .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .track-item:hover {
      background: var(--bg-glass);
    }

    .track-item.active {
      background: rgba(0, 229, 255, 0.08);
      border-color: rgba(0, 229, 255, 0.2);
    }

    .track-num {
      width: 24px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .track-item.active .track-num { color: var(--neon-cyan); }

    .track-thumb {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .track-meta {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-dur {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .drop-zone {
      margin: 8px 12px 12px;
      padding: 16px;
      border: 1.5px dashed rgba(255,255,255,0.12);
      border-radius: 10px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .drop-zone.dragover {
      border-color: var(--neon-cyan);
      background: rgba(0, 229, 255, 0.06);
      color: var(--neon-cyan);
    }

    /* Main stage */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 20px;
    }

    .album-frame {
      position: relative;
      width: min(340px, 70vw);
      aspect-ratio: 1;
    }

    .album-glow {
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle, var(--glow-color, rgba(0,229,255,0.3)) 0%, transparent 70%);
      filter: blur(40px);
      transition: var(--transition);
      opacity: 0.6;
    }

    .album-art {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      object-fit: cover;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .album-art.playing {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.01); }
    }

    .vinyl-ring {
      position: absolute;
      inset: -8px;
      border-radius: 24px;
      border: 2px solid transparent;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .album-frame.playing .vinyl-ring { opacity: 0.7; }

    /* Visualizer */
    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 48px;
      width: 100%;
      max-width: 400px;
    }

    .viz-bar {
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(to top, var(--neon-pink), var(--neon-cyan));
      height: 4px;
      transition: height 0.08s ease;
    }

    /* Now playing info */
    .now-playing {
      text-align: center;
      max-width: 400px;
    }

    .now-title {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .now-artist {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .now-album {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Transport bar */
    .transport {
      grid-column: 2;
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      width: 40px;
      flex-shrink: 0;
    }

    .time.end { text-align: right; }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: visible;
    }

    .progress-bar:hover { height: 6px; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      border-radius: 4px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: var(--glow-cyan);
      transition: transform 0.15s;
    }

    .progress-bar:hover .progress-thumb { transform: translateY(-50%) scale(1); }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 160px;
    }

    .controls-right { justify-content: flex-end; }

    .controls-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: var(--transition);
      line-height: 0;
    }

    .btn:hover { color: var(--text); background: var(--bg-glass); }
    .btn.active { color: var(--neon-cyan); }
    .btn svg { width: 20px; height: 20px; }

    .btn-play {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      color: var(--bg-deep);
      border-radius: 50%;
      box-shadow: var(--glow-cyan);
    }

    .btn-play:hover {
      transform: scale(1.06);
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      color: var(--bg-deep);
    }

    .btn-play svg { width: 24px; height: 24px; }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--neon-cyan);
      border-radius: 50%;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--neon-cyan);
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    /* Equalizer badge */
    .eq-badge {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }

    .badge {
      padding: 6px 12px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge.live {
      color: var(--neon-cyan);
      border-color: rgba(0,229,255,0.3);
    }

    .badge.live::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--neon-cyan);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        padding: 12px;
      }
      .sidebar { grid-row: 3; max-height: 200px; }
      .transport { grid-column: 1; }
      .stage { padding: 12px; gap: 16px; }
      .now-title { font-size: 1.2rem; }
      .controls-left, .controls-right { width: auto; }
      .volume-slider { width: 60px; }
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>

  <div class="skyline">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a1028" stop-opacity="0"/>
          <stop offset="100%" stop-color="#0a0b12" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <rect width="1440" height="320" fill="url(#skyGrad)"/>
      <path fill="#141622" d="M0,320 L0,200 L40,200 L40,160 L80,160 L80,120 L120,120 L120,180 L160,180 L160,100 L200,100 L200,140 L240,140 L240,80 L280,80 L280,160 L320,160 L320,60 L360,60 L360,120 L400,120 L400,90 L440,90 L440,150 L480,150 L480,70 L520,70 L520,130 L560,130 L560,50 L600,50 L600,110 L640,110 L640,80 L680,80 L680,140 L720,140 L720,40 L760,40 L760,100 L800,100 L800,60 L840,60 L840,120 L880,120 L880,90 L920,90 L920,150 L960,150 L960,70 L1000,70 L1000,130 L1040,130 L1040,55 L1080,55 L1080,115 L1120,115 L1120,85 L1160,85 L1160,145 L1200,145 L1200,65 L1240,65 L1240,125 L1280,125 L1280,75 L1320,75 L1320,135 L1360,135 L1360,95 L1400,95 L1400,155 L1440,155 L1440,320 Z"/>
      <rect x="200" y="100" width="8" height="12" fill="#ff2d95" opacity="0.6"/>
      <rect x="520" y="70" width="6" height="8" fill="#00e5ff" opacity="0.5"/>
      <rect x="720" y="40" width="10" height="14" fill="#a855f7" opacity="0.5"/>
      <rect x="960" y="70" width="8" height="10" fill="#ff2d95" opacity="0.4"/>
      <rect x="1120" y="85" width="6" height="8" fill="#00e5ff" opacity="0.6"/>
      <rect x="320" y="60" width="8" height="12" fill="#00e5ff" opacity="0.4"/>
    </svg>
  </div>

  <div class="stars" id="stars"></div>

  <div class="eq-badge">
    <div class="badge live" id="statusBadge">Standby</div>
    <div class="badge">320kbps</div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">♪</div>
          <span>Neon City</span>
        </div>
        <div class="sidebar-sub">Midnight Sessions · 8 tracks</div>
      </div>
      <div class="playlist" id="playlist"></div>
      <div class="drop-zone" id="dropZone">Drop audio files here</div>
    </aside>

    <main class="stage">
      <div class="album-frame" id="albumFrame">
        <div class="album-glow" id="albumGlow"></div>
        <div class="vinyl-ring"></div>
        <img class="album-art" id="albumArt" src="" alt="Album art">
      </div>

      <div class="visualizer" id="visualizer"></div>

      <div class="now-playing">
        <div class="now-title" id="nowTitle">—</div>
        <div class="now-artist" id="nowArtist">—</div>
        <div class="now-album" id="nowAlbum">—</div>
      </div>
    </main>

    <footer class="transport">
      <div class="progress-wrap">
        <span class="time" id="timeCurrent">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <span class="time end" id="timeTotal">0:00</span>
      </div>
      <div class="controls-row">
        <div class="controls-left">
          <button class="btn" id="btnShuffle" title="Shuffle (S)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
        </div>
        <div class="controls-center">
          <button class="btn" id="btnPrev" title="Previous (←)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="btn btn-play" id="btnPlay" title="Play/Pause (Space)">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="btn" id="btnNext" title="Next (→)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-6v0zm3.5 0l8.5 6V6l-8.5 6z"/></svg>
          </button>
        </div>
        <div class="controls-right">
          <button class="btn" id="btnRepeat" title="Repeat (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          </button>
          <div class="volume-wrap">
            <button class="btn" id="btnMute" title="Mute (M)">
              <svg id="iconVol" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>
    </footer>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    const GRADIENTS = [
      ['#00e5ff', '#ff2d95'],
      ['#a855f7', '#00e5ff'],
      ['#ff2d95', '#a855f7'],
      ['#06b6d4', '#8b5cf6'],
      ['#f472b6', '#38bdf8'],
      ['#c084fc', '#22d3ee'],
      ['#fb7185', '#818cf8'],
      ['#34d399', '#a78bfa'],
    ];

    const COVERS = [
      'https://picsum.photos/seed/neon1/400/400',
      'https://picsum.photos/seed/neon2/400/400',
      'https://picsum.photos/seed/neon3/400/400',
      'https://picsum.photos/seed/neon4/400/400',
      'https://picsum.photos/seed/neon5/400/400',
      'https://picsum.photos/seed/neon6/400/400',
      'https://picsum.photos/seed/neon7/400/400',
      'https://picsum.photos/seed/neon8/400/400',
    ];

    const TRACKS = [
      { title: 'Midnight Drive', artist: 'Neon Pulse', album: 'City Lights', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
      { title: 'Rain on Glass', artist: 'Echo District', album: 'Urban Echoes', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
      { title: 'Skyline Glow', artist: 'Metro Waves', album: 'Horizon', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
      { title: 'Neon Alley', artist: 'Cipher', album: 'After Hours', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
      { title: 'Velvet Static', artist: 'Luna Frame', album: 'Signals', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
      { title: 'Harbor Lights', artist: 'Coastal Drift', album: 'Tide', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' },
      { title: 'Parallel Lines', artist: 'Grid Theory', album: 'Construct', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3' },
      { title: 'Last Train Home', artist: 'Night Transit', album: 'Final Stop', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3' },
    ];

    const audio = document.getElementById('audio');
    const playlist = document.getElementById('playlist');
    const albumArt = document.getElementById('albumArt');
    const albumFrame = document.getElementById('albumFrame');
    const albumGlow = document.getElementById('albumGlow');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const nowAlbum = document.getElementById('nowAlbum');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const btnPlay = document.getElementById('btnPlay');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnRepeat = document.getElementById('btnRepeat');
    const btnMute = document.getElementById('btnMute');
    const volumeSlider = document.getElementById('volumeSlider');
    const visualizer = document.getElementById('visualizer');
    const statusBadge = document.getElementById('statusBadge');
    const dropZone = document.getElementById('dropZone');

    let currentIndex = 0;
    let isPlaying = false;
    let shuffle = false;
    let repeat = 'none';
    let tracks = [...TRACKS];
    let audioCtx, analyser, source, dataArray, animFrame;

    function initStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 60 + '%';
        s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
        s.style.setProperty('--op', (0.2 + Math.random() * 0.5).toFixed(2));
        container.appendChild(s);
      }
    }

    function initVisualizer() {
      for (let i = 0; i < 32; i++) {
        const bar = document.createElement('div');
        bar.className = 'viz-bar';
        visualizer.appendChild(bar);
      }
    }

    function setupAudioContext() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function animateVisualizer() {
      if (!analyser || !isPlaying) {
        visualizer.querySelectorAll('.viz-bar').forEach(b => b.style.height = '4px');
        return;
      }
      analyser.getByteFrequencyData(dataArray);
      const bars = visualizer.querySelectorAll('.viz-bar');
      const step = Math.floor(dataArray.length / bars.length);
      bars.forEach((bar, i) => {
        const val = dataArray[i * step] || 0;
        bar.style.height = Math.max(4, (val / 255) * 48) + 'px';
      });
      animFrame = requestAnimationFrame(animateVisualizer);
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + sec.toString().padStart(2, '0');
    }

    function setGlow(index) {
      const [c1, c2] = GRADIENTS[index % GRADIENTS.length];
      albumGlow.style.setProperty('--glow-color', `rgba(${hexToRgb(c1)}, 0.35)`);
      albumGlow.style.background = `radial-gradient(circle, rgba(${hexToRgb(c1)}, 0.35) 0%, rgba(${hexToRgb(c2)}, 0.15) 50%, transparent 70%)`;
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `${r},${g},${b}`;
    }

    function renderPlaylist() {
      playlist.innerHTML = '';
      tracks.forEach((track, i) => {
        const el = document.createElement('div');
        el.className = 'track-item' + (i === currentIndex ? ' active' : '');
        el.innerHTML = `
          <span class="track-num">${i === currentIndex && isPlaying ? '▶' : (i + 1).toString().padStart(2, '0')}</span>
          <img class="track-thumb" src="${track.cover || COVERS[i % COVERS.length]}" alt="">
          <div class="track-meta">
            <div class="track-title">${track.title}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
          <span class="track-dur">${track.duration || '—:——'}</span>
        `;
        el.addEventListener('click', () => loadTrack(i, true));
        playlist.appendChild(el);
      });
      document.querySelector('.sidebar-sub').textContent = `Midnight Sessions · ${tracks.length} tracks`;
    }

    function loadTrack(index, autoplay = false) {
      currentIndex = index;
      const track = tracks[index];
      audio.src = track.src;
      albumArt.src = track.cover || COVERS[index % COVERS.length];
      nowTitle.textContent = track.title;
      nowArtist.textContent = track.artist;
      nowAlbum.textContent = track.album || '';
      setGlow(index);
      renderPlaylist();

      audio.onloadedmetadata = () => {
        timeTotal.textContent = formatTime(audio.duration);
        tracks[index].duration = formatTime(audio.duration);
        renderPlaylist();
      };

      if (autoplay) play();
      else updatePlayState(false);
    }

    function play() {
      setupAudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().then(() => {
        isPlaying = true;
        updatePlayState(true);
        cancelAnimationFrame(animFrame);
        animateVisualizer();
      }).catch(() => {});
    }

    function pause() {
      audio.pause();
      isPlaying = false;
      updatePlayState(false);
      cancelAnimationFrame(animFrame);
      animateVisualizer();
    }

    function togglePlay() {
      isPlaying ? pause() : play();
    }

    function updatePlayState(playing) {
      iconPlay.style.display = playing ? 'none' : 'block';
      iconPause.style.display = playing ? 'block' : 'none';
      albumArt.classList.toggle('playing', playing);
      albumFrame.classList.toggle('playing', playing);
      statusBadge.textContent = playing ? 'Now Playing' : 'Standby';
      renderPlaylist();
    }

    function getNextIndex() {
      if (shuffle) {
        let next;
        do { next = Math.floor(Math.random() * tracks.length); } while (next === currentIndex && tracks.length > 1);
        return next;
      }
      return (currentIndex + 1) % tracks.length;
    }

    function getPrevIndex() {
      if (audio.currentTime > 3) return currentIndex;
      if (shuffle) {
        let prev;
        do { prev = Math.floor(Math.random() * tracks.length); } while (prev === currentIndex && tracks.length > 1);
        return prev;
      }
      return (currentIndex - 1 + tracks.length) % tracks.length;
    }

    function nextTrack() {
      if (repeat === 'one') { audio.currentTime = 0; play(); return; }
      const next = getNextIndex();
      if (next === 0 && repeat === 'none' && !shuffle && currentIndex === tracks.length - 1) {
        pause();
        audio.currentTime = 0;
        return;
      }
      loadTrack(next, true);
    }

    function prevTrack() {
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }
      loadTrack(getPrevIndex(), isPlaying);
    }

    function seek(e) {
      const rect = progressBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pct * audio.duration;
    }

    function toggleShuffle() {
      shuffle = !shuffle;
      btnShuffle.classList.toggle('active', shuffle);
    }

    function toggleRepeat() {
      const modes = ['none', 'all', 'one'];
      repeat = modes[(modes.indexOf(repeat) + 1) % modes.length];
      btnRepeat.classList.toggle('active', repeat !== 'none');
      btnRepeat.style.color = repeat === 'one' ? 'var(--neon-pink)' : '';
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      btnMute.style.opacity = audio.muted ? '0.4' : '1';
    }

    function addLocalFiles(files) {
      Array.from(files).filter(f => f.type.startsWith('audio/')).forEach(file => {
        const url = URL.createObjectURL(file);
        const name = file.name.replace(/\.[^.]+$/, '');
        tracks.push({
          title: name,
          artist: 'Local File',
          album: 'Imported',
          src: url,
          cover: COVERS[tracks.length % COVERS.length],
        });
      });
      renderPlaylist();
      if (tracks.length === TRACKS.length + 1) loadTrack(tracks.length - 1, true);
    }

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('ended', nextTrack);

    progressBar.addEventListener('click', seek);

    btnPlay.addEventListener('click', togglePlay);
    btnPrev.addEventListener('click', prevTrack);
    btnNext.addEventListener('click', () => loadTrack(getNextIndex(), true));
    btnShuffle.addEventListener('click', toggleShuffle);
    btnRepeat.addEventListener('click', toggleRepeat);
    btnMute.addEventListener('click', toggleMute);

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
      audio.muted = false;
      btnMute.style.opacity = '1';
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.code) {
        case 'Space': e.preventDefault(); togglePlay(); break;
        case 'ArrowRight': loadTrack(getNextIndex(), isPlaying); break;
        case 'ArrowLeft': prevTrack(); break;
        case 'KeyS': toggleShuffle(); break;
        case 'KeyR': toggleRepeat(); break;
        case 'KeyM': toggleMute(); break;
        case 'ArrowUp': volumeSlider.value = Math.min(1, +volumeSlider.value + 0.05); volumeSlider.dispatchEvent(new Event('input')); break;
        case 'ArrowDown': volumeSlider.value = Math.max(0, +volumeSlider.value - 0.05); volumeSlider.dispatchEvent(new Event('input')); break;
      }
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      addLocalFiles(e.dataTransfer.files);
    });

    initStars();
    initVisualizer();
    audio.volume = 0.8;
    loadTrack(0, false);
  </script>
</body>
</html>
