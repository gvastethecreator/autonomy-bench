<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Signal Lost</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --void: #07080f;
    --deep: #0d1020;
    --glow: #6ee7ff;
    --glow-dim: #2a8fa8;
    --amber: #ffb347;
    --rose: #ff6b9d;
    --text: #e8edf5;
    --muted: #6b7a8f;
    --glass: rgba(14, 20, 40, 0.65);
    --glass-border: rgba(110, 231, 255, 0.12);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--void);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    cursor: crosshair;
  }

  canvas#stars { position: fixed; inset: 0; z-index: 0; }
  canvas#noise { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.04; mix-blend-mode: overlay; }

  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 30%, rgba(0,0,0,0.7) 100%);
  }

  .scanline {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }

  .container {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem;
  }

  .status-bar {
    position: absolute; top: 1.5rem; left: 1.5rem; right: 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); opacity: 0.7;
  }

  .status-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--rose); margin-right: 0.5rem;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--rose); }
    50% { opacity: 0.3; box-shadow: none; }
  }

  .hero {
    text-align: center;
    position: relative;
    user-select: none;
  }

  .code-display {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(7rem, 22vw, 14rem);
    font-weight: 400;
    line-height: 0.85;
    letter-spacing: -0.04em;
    background: linear-gradient(160deg, var(--text) 0%, var(--glow) 45%, var(--rose) 80%, var(--amber) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 40px rgba(110,231,255,0.25));
    position: relative;
    transition: filter 0.4s ease;
  }

  .code-display.glitch {
    animation: glitch-skew 0.3s steps(2) infinite;
  }

  @keyframes glitch-skew {
    0% { transform: skew(0deg); filter: drop-shadow(2px 0 var(--glow)) drop-shadow(-2px 0 var(--rose)); }
    25% { transform: skew(2deg) translateX(-3px); }
    50% { transform: skew(-1deg) translateX(3px); filter: drop-shadow(-2px 0 var(--glow)) drop-shadow(2px 0 var(--rose)); }
    75% { transform: skew(1deg); }
    100% { transform: skew(0deg); }
  }

  .code-display::after {
    content: '404';
    position: absolute; inset: 0;
    background: linear-gradient(160deg, transparent 40%, rgba(110,231,255,0.08) 50%, transparent 60%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-4px); }
  }

  .subtitle {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: var(--muted);
    margin-top: 0.5rem;
    opacity: 0;
    animation: fade-up 1s ease 0.4s forwards;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message {
    max-width: 420px;
    text-align: center;
    font-size: 0.75rem;
    line-height: 1.8;
    color: var(--muted);
    margin: 2rem auto 2.5rem;
    opacity: 0;
    animation: fade-up 1s ease 0.7s forwards;
  }

  .message .highlight { color: var(--glow); }

  /* Tuner panel */
  .tuner-panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 1.8rem 2.2rem;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    opacity: 0;
    animation: fade-up 1s ease 1s forwards;
    min-width: min(90vw, 380px);
  }

  .tuner-label {
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--glow-dim); margin-bottom: 1rem; display: flex; justify-content: space-between;
  }

  .freq-readout {
    font-size: 1.4rem; color: var(--glow); font-weight: 500;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }

  .freq-readout.locked { color: var(--amber); }

  .slider-wrap {
    position: relative; height: 48px; margin: 0.5rem 0 1rem;
    display: flex; align-items: center;
  }

  .slider-track {
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--deep), var(--glow-dim), var(--deep));
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }

  .slider-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: linear-gradient(90deg, var(--glow-dim), var(--glow));
    border-radius: 2px;
    width: 50%;
    transition: width 0.05s linear;
    box-shadow: 0 0 12px rgba(110,231,255,0.5);
  }

  .slider-thumb {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, var(--glow));
    box-shadow: 0 0 16px rgba(110,231,255,0.8), 0 2px 8px rgba(0,0,0,0.5);
    cursor: grab; left: 50%;
    transition: box-shadow 0.3s, transform 0.1s;
    z-index: 2;
  }

  .slider-thumb:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.15); }

  .slider-thumb.locked {
    background: radial-gradient(circle at 35% 35%, #fff, var(--amber));
    box-shadow: 0 0 20px rgba(255,179,71,0.9), 0 2px 8px rgba(0,0,0,0.5);
    animation: lock-pulse 1.5s ease-in-out infinite;
  }

  @keyframes lock-pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,179,71,0.9); }
    50% { box-shadow: 0 0 32px rgba(255,179,71,0.6), 0 0 60px rgba(255,179,71,0.2); }
  }

  input[type=range] {
    position: absolute; width: 100%; height: 48px;
    opacity: 0; cursor: pointer; z-index: 3; margin: 0;
    -webkit-appearance: none;
  }

  .waveform {
    height: 40px; display: flex; align-items: center; gap: 2px;
    margin-bottom: 0.8rem; overflow: hidden;
  }

  .waveform span {
    flex: 1; background: var(--glow-dim);
    border-radius: 1px;
    min-width: 2px;
    transition: height 0.08s ease, background 0.3s;
  }

  .waveform.locked span { background: var(--amber); }

  .tuner-hint {
    font-size: 0.58rem; color: var(--muted); text-align: center;
    letter-spacing: 0.08em;
  }

  /* Hidden message reveal */
  .hidden-msg {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.7rem;
    color: var(--amber);
    letter-spacing: 0.1em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s, transform 0.6s;
    min-height: 1.2em;
  }

  .hidden-msg.visible { opacity: 1; transform: translateY(0); }

  /* CTA */
  .actions {
    display: flex; gap: 1rem; margin-top: 2rem;
    opacity: 0; animation: fade-up 1s ease 1.3s forwards;
    flex-wrap: wrap; justify-content: center;
  }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.85rem 1.8rem; border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: transparent; color: var(--text);
    cursor: pointer; text-decoration: none;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    position: relative; overflow: hidden;
  }

  .btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--glow), var(--rose));
    opacity: 0; transition: opacity 0.35s;
    border-radius: inherit;
  }

  .btn span { position: relative; z-index: 1; }

  .btn:hover {
    border-color: var(--glow);
    color: var(--void);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(110,231,255,0.25);
  }

  .btn:hover::before { opacity: 1; }

  .btn-secondary {
    border-color: rgba(255,255,255,0.08);
    color: var(--muted);
  }

  .btn-secondary:hover {
    border-color: var(--muted);
    color: var(--text);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .btn-secondary::before { background: rgba(255,255,255,0.06); opacity: 1; }
  .btn-secondary:hover::before { opacity: 1; background: rgba(255,255,255,0.1); }

  /* Floating orbs */
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 4;
    filter: blur(60px); opacity: 0.35;
    transition: transform 0.1s linear;
  }

  .orb-1 { width: 300px; height: 300px; background: var(--glow); top: 10%; left: 5%; }
  .orb-2 { width: 250px; height: 250px; background: var(--rose); bottom: 15%; right: 8%; opacity: 0.2; }
  .orb-3 { width: 180px; height: 180px; background: var(--amber); top: 60%; left: 60%; opacity: 0.15; }

  /* Coordinates footer */
  .coords {
    position: absolute; bottom: 1.5rem; right: 1.5rem;
    font-size: 0.58rem; color: var(--muted); letter-spacing: 0.1em;
    opacity: 0.5; font-variant-numeric: tabular-nums;
  }

  /* Particle burst on lock */
  .burst {
    position: fixed; pointer-events: none; z-index: 20;
    width: 4px; height: 4px; border-radius: 50%;
    animation: burst-fly 1s ease-out forwards;
  }

  @keyframes burst-fly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(0); }
  }

  @media (max-width: 480px) {
    .tuner-panel { padding: 1.4rem 1.5rem; }
    .status-bar { font-size: 0.55rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="noise"></canvas>
<div class="vignette"></div>
<div class="scanline"></div>

<div class="orb orb-1" id="orb1"></div>
<div class="orb orb-2" id="orb2"></div>
<div class="orb orb-3" id="orb3"></div>

<div class="container">
  <div class="status-bar">
    <span><span class="status-dot"></span>signal lost</span>
    <span id="clock">--:--:--</span>
  </div>

  <div class="hero">
    <div class="code-display" id="code404">404</div>
    <p class="subtitle">The page drifted beyond reach</p>
  </div>

  <p class="message">
    This coordinate no longer resolves in our navigation grid.
    Tune the frequency below — you might catch a fragment of where it went.
  </p>

  <div class="tuner-panel">
    <div class="tuner-label">
      <span>Frequency Scanner</span>
      <span class="freq-readout" id="freqDisplay">88.40 MHz</span>
    </div>
    <div class="waveform" id="waveform"></div>
    <div class="slider-wrap">
      <div class="slider-track">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-thumb" id="sliderThumb"></div>
      </div>
      <input type="range" id="tuner" min="0" max="100" value="50" step="0.1">
    </div>
    <p class="tuner-hint" id="tunerHint">Drag to scan the void</p>
    <p class="hidden-msg" id="hiddenMsg"></p>
  </div>

  <div class="actions">
    <a href="/" class="btn"><span>Return Home</span></a>
    <button class="btn btn-secondary" id="retryBtn"><span>Retry Signal</span></button>
  </div>

  <div class="coords" id="coords">RA 04h 12m · DEC −32° 41′</div>
</div>

<script>
(function() {
  'use strict';

  // ── Starfield ──
  const starCanvas = document.getElementById('stars');
  const starCtx = starCanvas.getContext('2d');
  let stars = [], W, H, mouseX = 0.5, mouseY = 0.5;

  function resize() {
    W = starCanvas.width = window.innerWidth;
    H = starCanvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = [];
    const count = Math.floor((W * H) / 3500);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: Math.random() * 2 + 0.3,
        r: Math.random() * 1.5 + 0.3,
        twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.3 + 0.05
      });
    }
  }

  function drawStars(t) {
    starCtx.fillStyle = 'rgba(7,8,15,0.25)';
    starCtx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const parallaxX = (mouseX - 0.5) * s.z * 30;
      const parallaxY = (mouseY - 0.5) * s.z * 30;
      const alpha = 0.3 + Math.sin(t * 0.001 * s.speed + s.twinkle) * 0.3 + s.z * 0.2;
      starCtx.beginPath();
      starCtx.arc(s.x + parallaxX, s.y + parallaxY, s.r * s.z, 0, Math.PI * 2);
      starCtx.fillStyle = `rgba(200, 220, 255, ${Math.min(alpha, 1)})`;
      starCtx.fill();
    }
  }

  // ── Noise overlay ──
  const noiseCanvas = document.getElementById('noise');
  const noiseCtx = noiseCanvas.getContext('2d');
  let noiseFrame = 0;

  function drawNoise() {
    noiseCanvas.width = 256;
    noiseCanvas.height = 256;
    const img = noiseCtx.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 30;
    }
    noiseCtx.putImageData(img, 0, 0);
    noiseFrame++;
  }

  // ── Clock ──
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toTimeString().slice(0, 8) + ' UTC';
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Coordinates drift ──
  const coordsEl = document.getElementById('coords');
  let ra = 4.2, dec = -32.68;
  setInterval(() => {
    ra += (Math.random() - 0.5) * 0.02;
    dec += (Math.random() - 0.5) * 0.05;
    const raH = Math.floor(Math.abs(ra));
    const raM = Math.floor((Math.abs(ra) - raH) * 60);
    const decD = Math.floor(Math.abs(dec));
    const decM = Math.floor((Math.abs(dec) - decD) * 60);
    coordsEl.textContent = `RA ${raH.toString().padStart(2,'0')}h ${raM.toString().padStart(2,'0')}m · DEC ${dec >= 0 ? '+' : '−'}${decD}° ${decM.toString().padStart(2,'0')}′`;
  }, 800);

  // ── Waveform bars ──
  const waveform = document.getElementById('waveform');
  const BAR_COUNT = 48;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const span = document.createElement('span');
    span.style.height = '4px';
    waveform.appendChild(span);
    bars.push(span);
  }

  // ── Tuner logic ──
  const tuner = document.getElementById('tuner');
  const freqDisplay = document.getElementById('freqDisplay');
  const sliderFill = document.getElementById('sliderFill');
  const sliderThumb = document.getElementById('sliderThumb');
  const hiddenMsg = document.getElementById('hiddenMsg');
  const tunerHint = document.getElementById('tunerHint');
  const code404 = document.getElementById('code404');

  const LOCK_FREQ = 73.7;
  const LOCK_RANGE = 2.5;
  let isLocked = false;
  let lockTimer = null;

  const fragments = [
    '…found a trace: /home/dashboard/v2',
    '…echo from 2024-03-17 archive',
    '…fragment: "the page moved silently"',
    '…carrier wave: redirect loop detected',
    '…whisper: it was never here',
    '…signal decay: 99.7% entropy',
    '…last ping: 847 days ago',
    '…coordinates corrupted beyond repair'
  ];

  function freqFromVal(v) {
    return 40 + (v / 100) * 108;
  }

  function updateTuner() {
    const val = parseFloat(tuner.value);
    const freq = freqFromVal(val);
    freqDisplay.textContent = freq.toFixed(2) + ' MHz';

    sliderFill.style.width = val + '%';
    sliderThumb.style.left = val + '%';

    const dist = Math.abs(freq - LOCK_FREQ);
    const nearLock = dist < LOCK_RANGE;

    // Waveform animation
    for (let i = 0; i < BAR_COUNT; i++) {
      const centerDist = Math.abs(i - BAR_COUNT / 2) / (BAR_COUNT / 2);
      let h;
      if (nearLock) {
        h = 8 + Math.sin(Date.now() * 0.008 + i * 0.4) * 20 * (1 - dist / LOCK_RANGE);
      } else {
        h = 3 + Math.random() * 12 * (1 - centerDist * 0.5);
      }
      bars[i].style.height = Math.max(2, h) + 'px';
    }

    if (nearLock && !isLocked) {
      if (!lockTimer) {
        lockTimer = setTimeout(() => lockSignal(freq), 600);
      }
    } else if (!nearLock) {
      clearTimeout(lockTimer);
      lockTimer = null;
      if (isLocked) unlockSignal();
    }

    if (!isLocked) {
      code404.classList.toggle('glitch', Math.random() < 0.08);
    }
  }

  function lockSignal(freq) {
    isLocked = true;
    lockTimer = null;
    freqDisplay.textContent = LOCK_FREQ.toFixed(2) + ' MHz';
    freqDisplay.classList.add('locked');
    sliderThumb.classList.add('locked');
    waveform.classList.add('locked');
    code404.classList.remove('glitch');
    tunerHint.textContent = 'Signal acquired';
    hiddenMsg.textContent = fragments[Math.floor(Math.random() * fragments.length)];
    hiddenMsg.classList.add('visible');
    spawnBurst(window.innerWidth / 2, window.innerHeight / 2);
  }

  function unlockSignal() {
    isLocked = false;
    freqDisplay.classList.remove('locked');
    sliderThumb.classList.remove('locked');
    waveform.classList.remove('locked');
    tunerHint.textContent = 'Drag to scan the void';
    hiddenMsg.classList.remove('visible');
  }

  tuner.addEventListener('input', updateTuner);
  updateTuner();

  // ── Particle burst ──
  function spawnBurst(x, y) {
    const colors = ['#6ee7ff', '#ffb347', '#ff6b9d', '#e8edf5'];
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'burst';
      const angle = (Math.PI * 2 / 24) * i + Math.random() * 0.3;
      const dist = 60 + Math.random() * 120;
      p.style.cssText = `
        left:${x}px; top:${y}px;
        background:${colors[i % colors.length]};
        --bx:${Math.cos(angle) * dist}px;
        --by:${Math.sin(angle) * dist}px;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  // ── Retry button ──
  document.getElementById('retryBtn').addEventListener('click', () => {
    tuner.value = 50 + (Math.random() - 0.5) * 30;
    unlockSignal();
    updateTuner();
    code404.classList.add('glitch');
    setTimeout(() => code404.classList.remove('glitch'), 400);
  });

  // ── Mouse parallax ──
  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX / W;
    mouseY = e.clientY / H;

    document.getElementById('orb1').style.transform =
      `translate(${(mouseX - 0.5) * -40}px, ${(mouseY - 0.5) * -30}px)`;
    document.getElementById('orb2').style.transform =
      `translate(${(mouseX - 0.5) * 30}px, ${(mouseY - 0.5) * 20}px)`;
    document.getElementById('orb3').style.transform =
      `translate(${(mouseX - 0.5) * -20}px, ${(mouseY - 0.5) * -40}px)`;
  });

  // ── Main loop ──
  let lastNoise = 0;
  function loop(t) {
    drawStars(t);
    if (t - lastNoise > 100) { drawNoise(); lastNoise = t; }
    if (!isLocked) {
      for (let i = 0; i < BAR_COUNT; i++) {
        if (Math.random() < 0.15) {
          bars[i].style.height = (3 + Math.random() * 10) + 'px';
        }
      }
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
