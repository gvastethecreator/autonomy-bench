<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
  }
  #hud {
    position: absolute; bottom: 0; left: 0; right: 0; height: 140px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    display: flex; align-items: flex-end; justify-content: center; padding: 0 40px 24px;
  }
  .dash-panel {
    display: flex; align-items: flex-end; gap: 48px; width: 100%; max-width: 900px;
  }
  .speed-block { text-align: left; min-width: 120px; }
  .speed-value {
    font-size: 52px; font-weight: 200; color: #e8f4ff; letter-spacing: 2px; line-height: 1;
    text-shadow: 0 0 20px rgba(100,180,255,0.5);
  }
  .speed-label { font-size: 11px; color: #5a8ab0; text-transform: uppercase; letter-spacing: 3px; margin-top: 4px; }
  .gear-block { text-align: center; }
  .gear-value {
    font-size: 28px; font-weight: 600; color: #ff6b35;
    text-shadow: 0 0 12px rgba(255,107,53,0.6);
  }
  .gear-label { font-size: 10px; color: #5a8ab0; text-transform: uppercase; letter-spacing: 2px; }
  .rpm-bar-wrap { flex: 1; max-width: 320px; }
  .rpm-label { font-size: 10px; color: #5a8ab0; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .rpm-bar {
    height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
  }
  .rpm-fill {
    height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
    transition: width 0.08s linear;
    box-shadow: 0 0 8px rgba(241,196,15,0.4);
  }
  .time-block { text-align: right; min-width: 100px; }
  .time-value { font-size: 22px; font-weight: 300; color: #a8c8e8; letter-spacing: 1px; }
  .time-label { font-size: 10px; color: #5a8ab0; text-transform: uppercase; letter-spacing: 2px; margin-top: 2px; }
  #title-screen {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at 50% 30%, #0a1628 0%, #020408 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #title-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  h1 {
    font-size: clamp(36px, 6vw, 72px); font-weight: 100; color: #e8f4ff;
    letter-spacing: 12px; text-transform: uppercase; margin-bottom: 8px;
    text-shadow: 0 0 40px rgba(100,180,255,0.3);
  }
  .subtitle { font-size: 14px; color: #5a8ab0; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 48px; }
  .start-btn {
    pointer-events: auto; cursor: pointer;
    padding: 16px 48px; border: 1px solid rgba(100,180,255,0.4);
    background: rgba(100,180,255,0.08); color: #c8e0ff;
    font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
    border-radius: 2px; transition: all 0.3s;
  }
  .start-btn:hover { background: rgba(100,180,255,0.18); border-color: rgba(100,180,255,0.7); box-shadow: 0 0 30px rgba(100,180,255,0.2); }
  .controls-hint { margin-top: 32px; font-size: 12px; color: #3a5a78; letter-spacing: 1px; line-height: 2; text-align: center; }
  kbd {
    display: inline-block; padding: 2px 8px; border: 1px solid #3a5a78;
    border-radius: 3px; font-size: 11px; color: #6a9ac0; margin: 0 2px;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0.03;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.5) 2px, rgba(0,0,0,0.5) 4px);
  }
</style>
</head>
<body>
<div id="title-screen">
  <h1>Midnight Drive</h1>
  <p class="subtitle">Endless Highway</p>
  <button class="start-btn" id="startBtn">Start Engine</button>
  <p class="controls-hint">
    <kbd>W</kbd><kbd>↑</kbd> Accelerate &nbsp;·&nbsp;
    <kbd>S</kbd><kbd>↓</kbd> Brake &nbsp;·&nbsp;
    <kbd>A</kbd><kbd>D</kbd> Steer &nbsp;·&nbsp;
    <kbd>Space</kbd> Handbrake
  </p>
</div>
<div id="vignette"></div>
<div id="scanlines"></div>
<div id="overlay">
  <div id="hud">
    <div class="dash-panel">
      <div class="speed-block">
        <div class="speed-value" id="speedDisplay">0</div>
        <div class="speed-label">km/h</div>
      </div>
      <div class="gear-block">
        <div class="gear-value" id="gearDisplay">N</div>
        <div class="gear-label">Gear</div>
      </div>
      <div class="rpm-bar-wrap">
        <div class="rpm-label">Engine</div>
        <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
      </div>
      <div class="time-block">
        <div class="time-value" id="timeDisplay">00:00</div>
        <div class="time-label">Night Run</div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  speed: 0,
  maxSpeed: 220,
  accel: 85,
  brake: 120,
  friction: 28,
  steer: 0,
  steerSpeed: 2.2,
  laneOffset: 0,
  maxLane: 3.2,
  gear: 0,
  rpm: 0,
  started: false,
  startTime: 0,
  keys: {},
  roadOffset: 0,
  curve: 0,
  targetCurve: 0,
  shake: 0,
};

// ─── Renderer ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020408, 0.012);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(0, 1.15, 0.3);

// ─── Post-processing ─────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.85);
composer.addPass(bloom);

const vignetteShader = {
  uniforms: { tDiffuse: { value: null }, offset: { value: 1.1 }, darkness: { value: 1.3 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float offset; uniform float darkness;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 uv = (vUv - 0.5) * vec2(offset);
      float vig = 1.0 - dot(uv, uv);
      c.rgb *= clamp(pow(vig, darkness), 0.0, 1.0);
      gl_FragColor = c;
    }`
};
const vignettePass = new ShaderPass(vignetteShader);
composer.addPass(vignettePass);

// ─── Lighting ────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x1a2840, 0.4);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0x8899cc, 0.35);
moonLight.position.set(-30, 80, -50);
scene.add(moonLight);

const headLightL = new THREE.SpotLight(0xfff5e0, 80, 120, Math.PI / 5, 0.5, 1.5);
headLightL.position.set(-0.6, 0.9, 0.5);
headLightL.target.position.set(-0.3, 0, 30);
headLightL.castShadow = true;
headLightL.shadow.mapSize.set(1024, 1024);
scene.add(headLightL, headLightL.target);

const headLightR = new THREE.SpotLight(0xfff5e0, 80, 120, Math.PI / 5, 0.5, 1.5);
headLightR.position.set(0.6, 0.9, 0.5);
headLightR.target.position.set(0.3, 0, 30);
headLightR.castShadow = true;
scene.add(headLightR, headLightR.target);

const dashGlow = new THREE.PointLight(0xff6633, 0.8, 3);
dashGlow.position.set(0, 0.6, -0.2);
scene.add(dashGlow);

// ─── Sky ─────────────────────────────────────────────────────────────────────
function createStars(count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 180 + Math.random() * 120;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.45;
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) + 20;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 80;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.85 });
  return new THREE.Points(geo, mat);
}
scene.add(createStars(2500));

const moonGeo = new THREE.SphereGeometry(4, 32, 32);
const moonMat = new THREE.MeshBasicMaterial({ color: 0xdde8ff });
const moon = new THREE.Mesh(moonGeo, moonMat);
moon.position.set(-60, 55, -120);
scene.add(moon);

const moonGlow = new THREE.Mesh(
  new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x6688cc, transparent: true, opacity: 0.15 })
);
moonGlow.position.copy(moon.position);
scene.add(moonGlow);

// ─── Mountains silhouette ────────────────────────────────────────────────────
function createMountains() {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0x0a1020 });
  for (let i = 0; i < 24; i++) {
    const w = 30 + Math.random() * 50;
    const h = 15 + Math.random() * 35;
    const mesh = new THREE.Mesh(new THREE.ConeGeometry(w, h, 4), mat);
    mesh.position.set((i - 12) * 35 + (Math.random() - 0.5) * 20, h * 0.5 - 2, -80 - Math.random() * 60);
    mesh.rotation.y = Math.random() * Math.PI;
    group.add(mesh);
  }
  return group;
}
const mountains = createMountains();
scene.add(mountains);

// ─── Road system ─────────────────────────────────────────────────────────────
const ROAD_SEGMENTS = 40;
const SEG_LEN = 12;
const ROAD_WIDTH = 8;

const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a22, roughness: 0.85, metalness: 0.1,
});
const lineMat = new THREE.MeshBasicMaterial({ color: 0xcccc55 });
const sideMat = new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.9 });
const barrierMat = new THREE.MeshStandardMaterial({ color: 0x2a3040, metalness: 0.6, roughness: 0.4 });

const segments = [];
const streetLights = [];
const trees = [];

function makeRoadSegment(z) {
  const group = new THREE.Group();
  group.userData.baseZ = z;

  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, SEG_LEN), roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0;
  road.receiveShadow = true;
  group.add(road);

  // Center dashed line
  for (let d = -SEG_LEN / 2 + 1; d < SEG_LEN / 2; d += 3) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.8), lineMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(0, 0.01, d);
    group.add(dash);
  }

  // Edge lines
  [-ROAD_WIDTH / 2 + 0.2, ROAD_WIDTH / 2 - 0.2].forEach(x => {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.12, SEG_LEN), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(x, 0.01, 0);
    group.add(edge);
  });

  // Shoulders
  [-1, 1].forEach(side => {
    const shoulder = new THREE.Mesh(new THREE.PlaneGeometry(4, SEG_LEN), sideMat);
    shoulder.rotation.x = -Math.PI / 2;
    shoulder.position.set(side * (ROAD_WIDTH / 2 + 2), -0.02, 0);
    group.add(shoulder);

    const barrier = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, SEG_LEN), barrierMat);
    barrier.position.set(side * (ROAD_WIDTH / 2 + 4.2), 0.35, 0);
    group.add(barrier);
  });

  // Wet reflection strip
  const wet = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_WIDTH * 0.6, SEG_LEN),
    new THREE.MeshStandardMaterial({ color: 0x222230, roughness: 0.15, metalness: 0.7, transparent: true, opacity: 0.3 })
  );
  wet.rotation.x = -Math.PI / 2;
  wet.position.y = 0.005;
  group.add(wet);

  group.position.z = z;
  roadGroup.add(group);
  return group;
}

function makeStreetLight(z, side) {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 5, 8), barrierMat);
  pole.position.y = 2.5;
  group.add(pole);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 0.06), barrierMat);
  arm.position.set(side * 0.6, 4.8, 0);
  group.add(arm);

  const lamp = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.15, 0.3),
    new THREE.MeshBasicMaterial({ color: 0xffaa55 })
  );
  lamp.position.set(side * 1.1, 4.75, 0);
  group.add(lamp);

  const light = new THREE.PointLight(0xffaa66, 3, 25, 2);
  light.position.set(side * 1.1, 4.5, 0);
  group.add(light);

  group.position.set(side * (ROAD_WIDTH / 2 + 3.5), 0, z);
  group.userData.baseZ = z;
  scene.add(group);
  return group;
}

function makeTree(z, side) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 2, 6), new THREE.MeshStandardMaterial({ color: 0x1a1510 }));
  trunk.position.y = 1;
  group.add(trunk);
  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(1.2 + Math.random() * 0.8, 3 + Math.random() * 2, 7),
    new THREE.MeshStandardMaterial({ color: 0x0a1808 })
  );
  crown.position.y = 3;
  group.add(crown);
  group.position.set(side * (ROAD_WIDTH / 2 + 8 + Math.random() * 6), 0, z);
  group.userData.baseZ = z;
  scene.add(group);
  return group;
}

for (let i = 0; i < ROAD_SEGMENTS; i++) {
  const z = -i * SEG_LEN;
  segments.push(makeRoadSegment(z));
  if (i % 3 === 0) {
    streetLights.push(makeStreetLight(z, i % 2 === 0 ? -1 : 1));
  }
  if (i % 2 === 0 && Math.random() > 0.3) {
    trees.push(makeTree(z + (Math.random() - 0.5) * 4, Math.random() > 0.5 ? -1 : 1));
  }
}

// ─── Rain ────────────────────────────────────────────────────────────────────
const rainCount = 4000;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(rainCount * 3);
const rainVel = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
  rainPos[i * 3] = (Math.random() - 0.5) * 30;
  rainPos[i * 3 + 1] = Math.random() * 20;
  rainPos[i * 3 + 2] = Math.random() * 60 - 10;
  rainVel[i] = 0.3 + Math.random() * 0.5;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
  color: 0xaaccff, size: 0.08, transparent: true, opacity: 0.5, depthWrite: false
}));
scene.add(rain);

// ─── Dashboard interior ───────────────────────────────────────────────────────
const dashGroup = new THREE.Group();
const dashMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.8 });
const dashMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.4), dashMat);
dashMesh.position.set(0, 0.35, -0.5);
dashGroup.add(dashMesh);

const wheelGeo = new THREE.TorusGeometry(0.22, 0.04, 8, 24);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.3 });
const steeringWheel = new THREE.Mesh(wheelGeo, wheelMat);
steeringWheel.position.set(0, 0.75, -0.35);
steeringWheel.rotation.x = -0.3;
dashGroup.add(steeringWheel);

const windshield = new THREE.Mesh(
  new THREE.PlaneGeometry(2.4, 1.2),
  new THREE.MeshStandardMaterial({ color: 0x111820, transparent: true, opacity: 0.15, roughness: 0.05, metalness: 0.9, side: THREE.DoubleSide })
);
windshield.position.set(0, 1.0, -0.15);
windshield.rotation.x = -0.15;
dashGroup.add(windshield);

camera.add(dashGroup);
scene.add(camera);

// ─── Oncoming car lights (distant) ───────────────────────────────────────────
const distantLights = [];
for (let i = 0; i < 8; i++) {
  const light = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );
  light.userData = { offset: Math.random() * 200, side: Math.random() > 0.5 ? 1 : -1, speed: 0.5 + Math.random() * 0.5 };
  scene.add(light);
  distantLights.push(light);
}

// ─── Audio (engine) ──────────────────────────────────────────────────────────
let audioCtx, engineOsc, engineGain, noiseNode;
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 60;
  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();

  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  noiseNode = audioCtx.createBufferSource();
  noiseNode.buffer = noiseBuffer;
  noiseNode.loop = true;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.015;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 800;
  noiseNode.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  noiseNode.start();
}

function updateAudio() {
  if (!engineOsc) return;
  const t = state.speed / state.maxSpeed;
  engineOsc.frequency.value = 55 + t * 180;
  engineGain.gain.value = state.started ? 0.04 + t * 0.06 : 0;
}

// ─── Input ───────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => { state.keys[e.code] = true; });
window.addEventListener('keyup', e => { state.keys[e.code] = false; });

document.getElementById('startBtn').addEventListener('click', () => {
  state.started = true;
  state.startTime = performance.now();
  document.getElementById('title-screen').classList.add('hidden');
  initAudio();
});

// ─── HUD update ──────────────────────────────────────────────────────────────
const speedEl = document.getElementById('speedDisplay');
const gearEl = document.getElementById('gearDisplay');
const rpmEl = document.getElementById('rpmFill');
const timeEl = document.getElementById('timeDisplay');

function updateHUD() {
  speedEl.textContent = Math.round(state.speed);
  const gears = ['N', '1', '2', '3', '4', '5', '6'];
  gearEl.textContent = gears[state.gear];
  rpmEl.style.width = (state.rpm * 100) + '%';
  if (state.started) {
    const elapsed = Math.floor((performance.now() - state.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timeEl.textContent = `${m}:${s}`;
  }
}

// ─── Recycle world objects ─────────────────────────────────────────────────────
const totalRoadLen = ROAD_SEGMENTS * SEG_LEN;

function recycleObject(obj, playerZ) {
  const relZ = obj.userData.baseZ - playerZ;
  if (relZ > 30) {
    obj.userData.baseZ -= totalRoadLen;
    obj.position.z = obj.userData.baseZ;
    if (obj.position.x !== undefined && Math.abs(obj.position.x) > ROAD_WIDTH) {
      obj.position.x = (Math.random() > 0.5 ? -1 : 1) * (ROAD_WIDTH / 2 + 8 + Math.random() * 6);
    }
  }
}

// ─── Main loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function updatePhysics(dt) {
  if (!state.started) return;

  const accel = state.keys['KeyW'] || state.keys['ArrowUp'];
  const brake = state.keys['KeyS'] || state.keys['ArrowDown'];
  const left = state.keys['KeyA'] || state.keys['ArrowLeft'];
  const right = state.keys['KeyD'] || state.keys['ArrowRight'];
  const handbrake = state.keys['Space'];

  if (accel) state.speed += state.accel * dt;
  if (brake || handbrake) state.speed -= (handbrake ? state.brake * 1.8 : state.brake) * dt;
  state.speed -= state.friction * dt * (state.speed / state.maxSpeed);
  state.speed = THREE.MathUtils.clamp(state.speed, 0, state.maxSpeed);

  const steerInput = (right ? 1 : 0) - (left ? 1 : 0);
  const steerFactor = 1 - state.speed / state.maxSpeed * 0.5;
  state.laneOffset += steerInput * state.steerSpeed * steerFactor * dt;
  state.laneOffset = THREE.MathUtils.clamp(state.laneOffset, -state.maxLane, state.maxLane);

  state.targetCurve = Math.sin(state.roadOffset * 0.008) * 0.6 + Math.sin(state.roadOffset * 0.023) * 0.3;
  state.curve += (state.targetCurve - state.curve) * dt * 1.5;
  state.laneOffset += state.curve * state.speed * 0.0003 * dt;

  state.roadOffset += state.speed * dt * 0.05;
  state.shake = state.speed / state.maxSpeed * 0.008;

  state.rpm = state.speed / state.maxSpeed;
  state.gear = state.speed < 1 ? 0 : Math.min(6, Math.ceil(state.rpm * 6));

  steeringWheel.rotation.z = -steerInput * 0.6 - state.curve * 0.3;

  updateAudio();
}

function updateWorld() {
  const playerZ = state.roadOffset * 2;

  segments.forEach(s => {
    s.position.z = s.userData.baseZ + playerZ;
    s.position.x = state.curve * Math.max(0, -s.position.z) * 0.15;
    if (s.position.z > 30) {
      s.userData.baseZ -= totalRoadLen;
    }
  });

  streetLights.forEach(l => {
    l.position.z = l.userData.baseZ + playerZ;
    l.position.x = (l.position.x > 0 ? 1 : -1) * (ROAD_WIDTH / 2 + 3.5) + state.curve * Math.max(0, -l.position.z) * 0.15;
    recycleObject(l, -playerZ);
  });

  trees.forEach(t => {
    t.position.z = t.userData.baseZ + playerZ;
    recycleObject(t, -playerZ);
  });

  mountains.position.z = (playerZ * 0.1) % 100;

  distantLights.forEach(l => {
    const d = l.userData;
    let z = (d.offset - playerZ * d.speed * 0.3) % 180;
    if (z < 5) z += 180;
    l.position.set(d.side * (1.5 + Math.random() * 0.5), 0.6, -z);
    l.visible = z > 10 && z < 150;
  });

  // Rain
  const rp = rainGeo.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    rp[i * 3 + 1] -= rainVel[i] * (1 + state.speed * 0.01);
    rp[i * 3 + 2] -= state.speed * 0.08;
    if (rp[i * 3 + 1] < 0) {
      rp[i * 3 + 1] = 15 + Math.random() * 5;
      rp[i * 3] = (Math.random() - 0.5) * 30;
      rp[i * 3 + 2] = Math.random() * 40;
    }
    if (rp[i * 3 + 2] < -10) rp[i * 3 + 2] = 40;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function updateCamera(dt) {
  const sway = Math.sin(clock.elapsedTime * 1.5) * state.shake;
  camera.position.x = state.laneOffset + state.curve * 2 + sway;
  camera.position.y = 1.15 + Math.sin(clock.elapsedTime * 2) * state.shake * 0.5;
  camera.rotation.z = -state.laneOffset * 0.04 - state.curve * 0.08 + sway * 0.5;
  camera.rotation.y = -state.laneOffset * 0.06 - state.curve * 0.12;
  camera.rotation.x = 0.02 + state.speed / state.maxSpeed * 0.015;

  headLightL.target.position.set(camera.position.x - 0.3, 0, camera.position.z + 30);
  headLightR.target.position.set(camera.position.x + 0.3, 0, camera.position.z + 30);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updatePhysics(dt);
  updateWorld();
  updateCamera(dt);
  updateHUD();

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
