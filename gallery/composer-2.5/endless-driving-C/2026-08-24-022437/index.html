<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Night Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 50% 55%, transparent 40%, rgba(0,0,20,0.55) 100%);
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 50%, rgba(0,0,0,0.7) 100%);
  }
  #title {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(14px, 2vw, 18px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(180, 210, 255, 0.85);
    text-shadow: 0 0 30px rgba(100, 160, 255, 0.5);
    opacity: 1;
    transition: opacity 2.5s ease 1s;
    white-space: nowrap;
  }
  #title.fade { opacity: 0; }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(140, 170, 210, 0.35);
    pointer-events: none;
    transition: opacity 1.5s ease 4s;
  }
  #hint.fade { opacity: 0; }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="vignette"></div>
<div id="title">Endless Night Drive</div>
<div id="hint">Hold click to accelerate</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Config ───────────────────────────────────────────────────────────────
const CFG = {
  baseSpeed: 0.38,
  maxSpeed: 1.15,
  accel: 0.004,
  decel: 0.0025,
  steerMax: 0.55,
  steerReturn: 0.04,
  fogNear: 8,
  fogFar: 140,
  roadWidth: 14,
  segmentLen: 4,
  segments: 80,
};

// ─── Scene setup ──────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x020208);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080818, 0.012);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 1.35, 0);

// ─── Post-processing ────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55, 0.35, 0.88
);
composer.addPass(bloom);

// ─── Lights ─────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x1a2040, 0.35);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0x8899cc, 0.25);
moonLight.position.set(-30, 80, -60);
scene.add(moonLight);

const headL = new THREE.SpotLight(0xfff4d0, 18, 90, 0.55, 0.6, 1.2);
headL.position.set(-0.55, 1.05, 0.2);
headL.target.position.set(-0.55, -0.5, -40);
scene.add(headL, headL.target);

const headR = new THREE.SpotLight(0xfff4d0, 18, 90, 0.55, 0.6, 1.2);
headR.position.set(0.55, 1.05, 0.2);
headR.target.position.set(0.55, -0.5, -40);
scene.add(headR, headR.target);

const dashGlow = new THREE.PointLight(0x2244aa, 0.6, 3);
dashGlow.position.set(0, 0.85, 0.5);
scene.add(dashGlow);

// ─── Sky dome ───────────────────────────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(300, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uTime: { value: 0 },
    uMoon: { value: new THREE.Vector3(-0.6, 0.35, -0.7).normalize() },
  },
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uMoon;
    varying vec3 vPos;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main() {
      vec3 dir = vPos;
      float h = dir.y * 0.5 + 0.5;
      vec3 zenith = vec3(0.02, 0.03, 0.09);
      vec3 horizon = vec3(0.06, 0.05, 0.12);
      vec3 col = mix(horizon, zenith, pow(h, 0.6));

      // Stars
      vec2 uv = dir.xz / (dir.y + 1.0);
      float star = 0.0;
      for (float i = 0.0; i < 3.0; i++) {
        vec2 g = floor(uv * (120.0 + i * 40.0));
        float n = hash(g);
        if (n > 0.992) {
          vec2 c = (g + 0.5) / (120.0 + i * 40.0);
          float d = length(uv - c);
          star += smoothstep(0.015, 0.0, d) * (0.5 + 0.5 * sin(uTime * 2.0 + n * 60.0));
        }
      }
      col += vec3(0.7, 0.8, 1.0) * star * smoothstep(-0.05, 0.15, dir.y);

      // Moon glow
      float moonD = dot(dir, uMoon);
      col += vec3(0.85, 0.9, 1.0) * smoothstep(0.9992, 0.9998, moonD) * 2.5;
      col += vec3(0.15, 0.18, 0.28) * smoothstep(0.995, 0.999, moonD);

      // Horizon haze band
      col += vec3(0.08, 0.06, 0.14) * exp(-abs(dir.y) * 8.0) * 0.4;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ─── Infinite road shader mesh ──────────────────────────────────────────────
const roadGroup = new THREE.Group();
scene.add(roadGroup);

const roadVert = `
  varying vec2 vUv;
  varying float vDist;
  uniform float uOffset;
  void main() {
    vUv = uv;
    vec3 p = position;
    p.z = mod(p.z + uOffset, ${CFG.segmentLen * CFG.segments}.0) - ${CFG.segmentLen * CFG.segments * 0.5}.0;
    vDist = -p.z;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }
`;

const roadFrag = `
  varying vec2 vUv;
  varying float vDist;
  uniform float uTime;
  uniform float uCurve;
  uniform vec3 uFogColor;

  float hash(float n) { return fract(sin(n) * 43758.5453); }

  void main() {
    float x = (vUv.x - 0.5) * ${CFG.roadWidth}.0;
    float curveShift = uCurve * vDist * vDist * 0.00008;
    x -= curveShift;

    float halfW = ${CFG.roadWidth * 0.5};
    float edgeW = 0.15;
    float onRoad = smoothstep(halfW + 0.3, halfW - 0.1, abs(x));
    float edgeLine = smoothstep(0.08, 0.02, abs(abs(x) - halfW + 0.12));

    // Lane dashes
    float lane = smoothstep(0.04, 0.01, abs(abs(x) - 2.5));
    float dash = step(0.5, fract(vDist * 0.5 + uTime * 0.0));
    lane *= dash;

    // Center double yellow
    float center = smoothstep(0.06, 0.02, abs(x));
    float centerDash = step(0.55, fract(vDist * 0.35));

    vec3 asphalt = vec3(0.04, 0.04, 0.06);
    vec3 wet = vec3(0.06, 0.07, 0.1);
    vec3 roadCol = mix(asphalt, wet, 0.35 + 0.15 * sin(vDist * 0.3));

    // Headlight pool approximation
    float headPool = exp(-vDist * 0.035) * exp(-x * x * 0.015) * 0.5;
    roadCol += vec3(0.9, 0.85, 0.6) * headPool * onRoad;

    // Reflective streaks
    float streak = hash(floor(vDist * 2.0)) * smoothstep(halfW, 0.0, abs(x));
    roadCol += vec3(0.12, 0.14, 0.2) * streak * exp(-vDist * 0.04) * 0.3;

    vec3 col = roadCol * onRoad;
    col += vec3(0.95, 0.92, 0.7) * edgeLine * onRoad;
    col += vec3(0.95, 0.85, 0.3) * center * centerDash * onRoad;
    col += vec3(0.85, 0.85, 0.9) * lane * onRoad * 0.7;

    // Shoulder gravel
    float shoulder = (1.0 - onRoad) * smoothstep(halfW + 2.0, halfW + 0.2, abs(x));
    col = mix(col, vec3(0.03, 0.035, 0.04), shoulder);

    // Fog
    float fogAmt = 1.0 - exp(-vDist * 0.018);
    col = mix(col, uFogColor, fogAmt * 0.85);

    // Fade near camera (under hood)
    col *= smoothstep(-2.0, 1.0, vDist);

    gl_FragColor = vec4(col, 1.0);
  }
`;

const roadUniforms = {
  uOffset: { value: 0 },
  uTime: { value: 0 },
  uCurve: { value: 0 },
  uFogColor: { value: new THREE.Color(0x080818) },
};

const roadGeo = new THREE.PlaneGeometry(CFG.roadWidth + 8, CFG.segmentLen * CFG.segments, 1, CFG.segments);
roadGeo.rotateX(-Math.PI / 2);
roadGeo.translate(0, -0.02, -CFG.segmentLen * CFG.segments * 0.5 + 2);

const roadMesh = new THREE.Mesh(roadGeo, new THREE.ShaderMaterial({
  uniforms: roadUniforms,
  vertexShader: roadVert,
  fragmentShader: roadFrag,
}));
roadGroup.add(roadMesh);

// ─── Mountain silhouettes ───────────────────────────────────────────────────
function makeMountainLayer(zScale, color, yBase, segments) {
  const pts = [];
  const w = 400;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = (t - 0.5) * w;
    const h = yBase
      + Math.sin(t * 8 + 1.2) * 12 * zScale
      + Math.sin(t * 21 + 3.7) * 6 * zScale
      + Math.sin(t * 45 + 0.5) * 3 * zScale
      + Math.pow(Math.sin(t * Math.PI), 2) * 18 * zScale;
    pts.push(new THREE.Vector2(x, h));
  }
  pts.push(new THREE.Vector2(w * 0.5, -5));
  pts.push(new THREE.Vector2(-w * 0.5, -5));
  const shape = new THREE.Shape(pts);
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, fog: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.z = -80;
  mesh.rotation.x = -0.08;
  return mesh;
}

const mountainsFar = makeMountainLayer(1.4, 0x060610, 8, 64);
mountainsFar.position.z = -120;
mountainsFar.material.color.setHex(0x050510);
scene.add(mountainsFar);

const mountainsMid = makeMountainLayer(1.0, 0x080818, 4, 48);
mountainsMid.position.z = -70;
scene.add(mountainsMid);

// ─── Distant city glow ──────────────────────────────────────────────────────
const cityCanvas = document.createElement('canvas');
cityCanvas.width = 512;
cityCanvas.height = 64;
const cx = cityCanvas.getContext('2d');
const cityGrad = cx.createLinearGradient(0, 64, 0, 0);
cityGrad.addColorStop(0, 'rgba(255,180,80,0)');
cityGrad.addColorStop(0.3, 'rgba(255,140,60,0.15)');
cityGrad.addColorStop(0.6, 'rgba(200,120,255,0.08)');
cityGrad.addColorStop(1, 'rgba(80,100,200,0.02)');
cx.fillStyle = cityGrad;
cx.fillRect(0, 0, 512, 64);
for (let i = 0; i < 120; i++) {
  const bx = Math.random() * 512;
  const bh = 4 + Math.random() * 28;
  const bw = 2 + Math.random() * 6;
  const hue = Math.random() > 0.7 ? 'rgba(255,200,120,' : 'rgba(180,200,255,';
  cx.fillStyle = hue + (0.3 + Math.random() * 0.5) + ')';
  cx.fillRect(bx, 64 - bh, bw, bh);
  if (Math.random() > 0.6) {
    cx.fillStyle = `rgba(255,255,200,${0.2 + Math.random() * 0.3})`;
    cx.fillRect(bx, 64 - bh - 2, 1, 2);
  }
}
const cityTex = new THREE.CanvasTexture(cityCanvas);
const cityPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 20),
  new THREE.MeshBasicMaterial({ map: cityTex, transparent: true, depthWrite: false, fog: true })
);
cityPlane.position.set(0, 12, -130);
scene.add(cityPlane);

// ─── Roadside elements (poles, trees) ───────────────────────────────────────
const sideGroup = new THREE.Group();
scene.add(sideGroup);

function createPole() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.06, 5, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.9 })
  );
  pole.position.y = 2.5;
  g.add(pole);
  const lamp = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.12, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x334466, emissive: 0xffaa55, emissiveIntensity: 2 })
  );
  lamp.position.set(0.2, 4.9, 0);
  g.add(lamp);
  const light = new THREE.PointLight(0xffaa66, 0.8, 18, 1.5);
  light.position.set(0.2, 4.7, 0);
  g.add(light);
  return g;
}

function createTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.12, 1.5, 5),
    new THREE.MeshStandardMaterial({ color: 0x1a1510, roughness: 1 })
  );
  trunk.position.y = 0.75;
  g.add(trunk);
  const foliage = new THREE.Mesh(
    new THREE.ConeGeometry(0.9, 2.8, 6),
    new THREE.MeshStandardMaterial({ color: 0x0a1208, roughness: 1 })
  );
  foliage.position.y = 2.6;
  g.add(foliage);
  return g;
}

const sideObjects = [];
const sideCount = 60;
for (let i = 0; i < sideCount; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  const obj = Math.random() > 0.55 ? createPole() : createTree();
  obj.userData = {
    z: -i * (CFG.segmentLen * 1.8) - Math.random() * 10,
    x: side * (CFG.roadWidth * 0.5 + 2 + Math.random() * 6),
    type: obj.children.length > 2 ? 'pole' : 'tree',
  };
  obj.position.set(obj.userData.x, 0, obj.userData.z);
  sideGroup.add(obj);
  sideObjects.push(obj);
}

// ─── Oncoming / passing car lights ──────────────────────────────────────────
const trafficGroup = new THREE.Group();
scene.add(trafficGroup);

function createTrafficCar(lane) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.7, 4),
    new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3, metalness: 0.6 })
  );
  body.position.y = 0.45;
  g.add(body);
  const tailL = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff2200 })
  );
  tailL.position.set(-0.6, 0.5, 2);
  g.add(tailL);
  const tailR = tailL.clone();
  tailR.position.x = 0.6;
  g.add(tailR);
  const tailLightL = new THREE.PointLight(0xff2200, 1.2, 8, 2);
  tailLightL.position.copy(tailL.position);
  g.add(tailLightL);
  const tailLightR = new THREE.PointLight(0xff2200, 1.2, 8, 2);
  tailLightR.position.copy(tailR.position);
  g.add(tailLightR);
  g.userData = { lane, speed: 0.5 + Math.random() * 0.4, z: 0 };
  return g;
}

const traffic = [];
for (let i = 0; i < 8; i++) {
  const car = createTrafficCar(i % 2 === 0 ? -2.5 : 2.5);
  car.userData.z = -30 - i * 35 - Math.random() * 20;
  car.position.set(car.userData.lane, 0, car.userData.z);
  trafficGroup.add(car);
  traffic.push(car);
}

// ─── Rain particles ─────────────────────────────────────────────────────────
const rainCount = 4000;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(rainCount * 3);
const rainVel = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
  rainPos[i * 3] = (Math.random() - 0.5) * 40;
  rainPos[i * 3 + 1] = Math.random() * 20;
  rainPos[i * 3 + 2] = (Math.random() - 0.5) * 60 - 10;
  rainVel[i] = 0.15 + Math.random() * 0.2;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({
  color: 0xaaccff,
  size: 0.06,
  transparent: true,
  opacity: 0.35,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const rain = new THREE.Points(rainGeo, rainMat);
rain.position.y = 5;
scene.add(rain);

// ─── Dashboard / cockpit interior ───────────────────────────────────────────
const dashGroup = new THREE.Group();
dashGroup.position.set(0, 0.6, 0.85);
scene.add(dashGroup);

const dashShape = new THREE.Shape();
dashShape.moveTo(-2.2, 0);
dashShape.quadraticCurveTo(-2.0, 0.55, -1.2, 0.65);
dashShape.lineTo(1.2, 0.65);
dashShape.quadraticCurveTo(2.0, 0.55, 2.2, 0);
dashShape.lineTo(2.2, -0.5);
dashShape.lineTo(-2.2, -0.5);
const dashMesh = new THREE.Mesh(
  new THREE.ExtrudeGeometry(dashShape, { depth: 0.35, bevelEnabled: false }),
  new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.85, metalness: 0.2 })
);
dashMesh.position.set(0, -0.15, 0);
dashGroup.add(dashMesh);

// Steering wheel
const wheelGeo = new THREE.TorusGeometry(0.28, 0.035, 8, 24);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151520, roughness: 0.7, metalness: 0.3 });
const wheel = new THREE.Mesh(wheelGeo, wheelMat);
wheel.position.set(0, 0.35, -0.05);
wheel.rotation.x = -0.35;
dashGroup.add(wheel);

// Speedometer ring
const speedCanvas = document.createElement('canvas');
speedCanvas.width = 128;
speedCanvas.height = 128;
const sx = speedCanvas.getContext('2d');
function drawSpeedo(val) {
  sx.clearRect(0, 0, 128, 128);
  sx.beginPath();
  sx.arc(64, 64, 50, 0, Math.PI * 2);
  sx.strokeStyle = 'rgba(40,60,100,0.6)';
  sx.lineWidth = 6;
  sx.stroke();
  sx.beginPath();
  sx.arc(64, 64, 50, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * val, false);
  sx.strokeStyle = 'rgba(100,180,255,0.9)';
  sx.lineWidth = 4;
  sx.stroke();
  sx.fillStyle = 'rgba(180,210,255,0.9)';
  sx.font = 'bold 22px monospace';
  sx.textAlign = 'center';
  sx.fillText(Math.round(val * 160), 64, 72);
  sx.font = '10px monospace';
  sx.fillStyle = 'rgba(120,150,200,0.6)';
  sx.fillText('KM/H', 64, 88);
}
drawSpeedo(0);
const speedTex = new THREE.CanvasTexture(speedCanvas);
const speedo = new THREE.Mesh(
  new THREE.CircleGeometry(0.18, 32),
  new THREE.MeshBasicMaterial({ map: speedTex, transparent: true })
);
speedo.position.set(0.55, 0.2, 0.2);
speedo.rotation.x = -0.5;
dashGroup.add(speedo);

// Windshield frame
const frameMat = new THREE.MeshStandardMaterial({ color: 0x080810, roughness: 0.9 });
const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.5), frameMat);
frameL.position.set(-1.05, 0.55, -0.1);
dashGroup.add(frameL);
const frameR = frameL.clone();
frameR.position.x = 1.05;
dashGroup.add(frameR);
const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.06, 0.5), frameMat);
frameTop.position.set(0, 0.92, -0.1);
dashGroup.add(frameTop);

// Windshield rain streak overlay (screen-space feel via transparent plane)
const streakCanvas = document.createElement('canvas');
streakCanvas.width = 256;
streakCanvas.height = 256;
const stx = streakCanvas.getContext('2d');
const streakTex = new THREE.CanvasTexture(streakCanvas);
const streakPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2.0, 1.1),
  new THREE.MeshBasicMaterial({ map: streakTex, transparent: true, opacity: 0.12, depthWrite: false })
);
streakPlane.position.set(0, 0.55, -0.15);
dashGroup.add(streakPlane);

function updateStreaks(t) {
  stx.fillStyle = 'rgba(0,0,0,0.08)';
  stx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3; i++) {
    const x = (Math.sin(t * 0.5 + i * 2.1) * 0.5 + 0.5) * 256;
    stx.strokeStyle = `rgba(180,200,255,${0.03 + Math.random() * 0.04})`;
    stx.lineWidth = 1 + Math.random();
    stx.beginPath();
    stx.moveTo(x, 0);
    stx.lineTo(x + (Math.random() - 0.5) * 8, 256);
    stx.stroke();
  }
  streakTex.needsUpdate = true;
}

// Rear-view mirror glow
const mirror = new THREE.Mesh(
  new THREE.PlaneGeometry(0.35, 0.12),
  new THREE.MeshBasicMaterial({ color: 0x111118 })
);
mirror.position.set(0, 0.78, 0.15);
mirror.rotation.x = -0.3;
dashGroup.add(mirror);

// ─── State ──────────────────────────────────────────────────────────────────
let speed = CFG.baseSpeed;
let targetSpeed = CFG.baseSpeed;
let steer = 0;
let roadOffset = 0;
let curve = 0;
let curveTarget = 0;
let time = 0;
let accelerating = false;
let mouseX = 0;

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousedown', () => { accelerating = true; });
window.addEventListener('mouseup', () => { accelerating = false; });
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
});
window.addEventListener('touchstart', () => { accelerating = true; }, { passive: true });
window.addEventListener('touchend', () => { accelerating = false; });

setTimeout(() => {
  document.getElementById('title').classList.add('fade');
  document.getElementById('hint').classList.add('fade');
}, 500);

// ─── Animation loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  // Speed control
  if (accelerating || keys['ArrowUp'] || keys['KeyW']) {
    targetSpeed = CFG.maxSpeed;
  } else if (keys['ArrowDown'] || keys['KeyS']) {
    targetSpeed = CFG.baseSpeed * 0.5;
  } else {
    targetSpeed = CFG.baseSpeed;
  }
  speed += (targetSpeed - speed) * (speed < targetSpeed ? CFG.accel : CFG.decel) * 60 * dt;

  // Steering
  let steerInput = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) steerInput -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) steerInput += 1;
  steerInput += mouseX * 0.3;
  steer += (steerInput * CFG.steerMax - steer) * CFG.steerReturn * 60 * dt;

  // Procedural curve
  curveTarget = Math.sin(time * 0.08) * 30 + Math.sin(time * 0.023) * 50;
  curve += (curveTarget - curve) * 0.01;

  roadOffset += speed * 60 * dt;
  roadUniforms.uOffset.value = roadOffset;
  roadUniforms.uTime.value = time;
  roadUniforms.uCurve.value = curve + steer * 40;

  // Camera motion
  const sway = Math.sin(time * 1.8) * 0.008 + Math.sin(time * 3.7) * 0.004;
  const bob = Math.sin(time * 2.2) * 0.006 * speed;
  camera.position.x = steer * 0.35 + sway;
  camera.position.y = 1.35 + bob;
  camera.rotation.z = -steer * 0.04 + sway * 0.5;
  camera.rotation.y = steer * 0.06;
  camera.rotation.x = -0.02 + Math.sin(time * 1.5) * 0.003;

  // Headlights follow steer
  headL.target.position.x = -0.55 + steer * 0.3;
  headR.target.position.x = 0.55 + steer * 0.3;

  // Side objects recycle
  const recycleZ = 10;
  const spawnZ = -CFG.segmentLen * CFG.segments * 0.5;
  for (const obj of sideObjects) {
    obj.position.z += speed * 60 * dt;
    obj.position.x = obj.userData.x + curve * 0.0003 * obj.position.z * obj.position.z;
    if (obj.position.z > recycleZ) {
      obj.position.z = spawnZ - Math.random() * 20;
      obj.userData.x = (Math.random() > 0.5 ? -1 : 1) * (CFG.roadWidth * 0.5 + 2 + Math.random() * 6);
      obj.position.x = obj.userData.x;
    }
  }

  // Traffic
  for (const car of traffic) {
    car.position.z += (speed - car.userData.speed) * 60 * dt;
    car.position.x = car.userData.lane + curve * 0.0003 * car.position.z * car.position.z;
    if (car.position.z > 15) {
      car.position.z = -120 - Math.random() * 80;
      car.userData.lane = Math.random() > 0.5 ? -2.5 : 2.5;
      car.userData.speed = 0.4 + Math.random() * 0.5;
    }
  }

  // Rain
  const rp = rainGeo.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    rp[i * 3 + 1] -= rainVel[i] * speed * 120 * dt;
    rp[i * 3] += steer * 0.02;
    if (rp[i * 3 + 1] < 0) {
      rp[i * 3 + 1] = 12 + Math.random() * 8;
      rp[i * 3] = (Math.random() - 0.5) * 40;
      rp[i * 3 + 2] = -Math.random() * 80;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;

  // Dashboard
  wheel.rotation.z = steer * 0.8;
  drawSpeedo(speed / CFG.maxSpeed);
  speedTex.needsUpdate = true;
  if (Math.floor(time * 10) % 3 === 0) updateStreaks(time);

  // Sky
  skyMat.uniforms.uTime.value = time;

  // Subtle bloom pulse
  bloom.strength = 0.45 + Math.sin(time * 0.5) * 0.08 + speed * 0.08;

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
});

animate();
</script>
