<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 60%, transparent 40%, rgba(0,0,20,0.55) 100%);
    z-index: 2;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.85), inset 0 0 40px rgba(0,0,0,0.5);
    z-index: 3;
  }
  #hud {
    position: fixed; bottom: 0; left: 0; right: 0; height: 28vh;
    pointer-events: none; z-index: 4;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 55%, transparent 100%);
  }
  #speed {
    position: fixed; bottom: 6vh; right: 6vw;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 200; letter-spacing: 0.08em;
    color: rgba(180,220,255,0.85);
    text-shadow: 0 0 20px rgba(80,160,255,0.4);
    z-index: 5; pointer-events: none;
  }
  #speed span { font-size: 0.35em; opacity: 0.6; vertical-align: super; }
  #title {
    position: fixed; top: 4vh; left: 50%; transform: translateX(-50%);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(0.7rem, 1.8vw, 0.95rem);
    letter-spacing: 0.45em; text-transform: uppercase;
    color: rgba(200,180,255,0.35);
    z-index: 5; pointer-events: none;
    animation: fadeTitle 4s ease forwards;
  }
  @keyframes fadeTitle {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    30% { opacity: 1; transform: translateX(-50%) translateY(0); }
    70% { opacity: 1; }
    100% { opacity: 0.5; }
  }
  #hint {
    position: fixed; bottom: 2vh; left: 50%; transform: translateX(-50%);
    font-family: system-ui, sans-serif; font-size: 0.7rem;
    color: rgba(255,255,255,0.25); letter-spacing: 0.15em;
    z-index: 5; pointer-events: none;
    animation: fadeHint 6s ease forwards;
  }
  @keyframes fadeHint {
    0%, 60% { opacity: 0.6; } 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="vignette"></div>
<div id="hud"></div>
<div id="title">Midnight Run</div>
<div id="speed"><span id="spd">0</span> <span>km/h</span></div>
<div id="hint">click to start engine</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const SEG_LEN = 40;
  const SEG_COUNT = 14;
  const ROAD_W = 14;
  const BASE_SPEED = 0.85;
  let speed = 0;
  let targetSpeed = BASE_SPEED;
  let started = false;
  let time = 0;
  let steer = 0;
  let mouseX = 0;

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030510);
  scene.fog = new THREE.FogExp2(0x0a0a18, 0.012);

  const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 600);
  camera.position.set(0, 1.35, 0.6);

  // ── Audio ──
  let audioCtx, engineOsc, engineGain, windGain, windNoise;
  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineGain.connect(audioCtx.destination);

    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 180;
    engineOsc.connect(filt);
    filt.connect(engineGain);
    engineOsc.start();

    const bufSize = 2 * audioCtx.sampleRate;
    const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    windNoise = audioCtx.createBufferSource();
    windNoise.buffer = noiseBuf;
    windNoise.loop = true;
    const windFilt = audioCtx.createBiquadFilter();
    windFilt.type = 'bandpass';
    windFilt.frequency.value = 400;
    windFilt.Q.value = 0.5;
    windGain = audioCtx.createGain();
    windGain.gain.value = 0;
    windNoise.connect(windFilt);
    windFilt.connect(windGain);
    windGain.connect(audioCtx.destination);
    windNoise.start();
  }

  function updateAudio() {
    if (!audioCtx) return;
    const t = speed / BASE_SPEED;
    engineGain.gain.setTargetAtTime(started ? 0.04 + t * 0.06 : 0, audioCtx.currentTime, 0.1);
    engineOsc.frequency.setTargetAtTime(45 + t * 35, audioCtx.currentTime, 0.08);
    windGain.gain.setTargetAtTime(started ? 0.015 + t * 0.025 : 0, audioCtx.currentTime, 0.1);
  }

  document.body.addEventListener('click', () => {
    if (!started) {
      started = true;
      initAudio();
      targetSpeed = BASE_SPEED;
    }
  });

  // ── Lights ──
  const ambient = new THREE.AmbientLight(0x1a2040, 0.35);
  scene.add(ambient);

  const moonLight = new THREE.DirectionalLight(0x8899cc, 0.25);
  moonLight.position.set(-30, 80, -60);
  scene.add(moonLight);

  const headLight = new THREE.SpotLight(0xfff4e0, 2.2, 120, 0.55, 0.6, 1.2);
  headLight.position.set(0, 1.2, 1.5);
  headLight.target.position.set(0, 0, -40);
  headLight.castShadow = true;
  headLight.shadow.mapSize.set(1024, 1024);
  scene.add(headLight);
  scene.add(headLight.target);

  const dashGlow = new THREE.PointLight(0x2244aa, 0.15, 3);
  dashGlow.position.set(0, 0.9, 0.3);
  scene.add(dashGlow);

  // ── Sky dome ──
  const skyGeo = new THREE.SphereGeometry(400, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      uTime: { value: 0 }
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vPos;
      uniform float uTime;
      void main() {
        float h = normalize(vPos).y * 0.5 + 0.5;
        vec3 horizon = vec3(0.08, 0.06, 0.14);
        vec3 zenith = vec3(0.01, 0.015, 0.05);
        vec3 col = mix(horizon, zenith, pow(h, 0.7));
        float moon = smoothstep(0.015, 0.0, length(vPos - vec3(-80.0, 120.0, -200.0)));
        col += vec3(0.9, 0.92, 1.0) * moon * 0.6;
        float stars = step(0.997, fract(sin(dot(floor(vPos.xz * 0.3), vec2(12.9898, 78.233))) * 43758.5453));
        stars *= smoothstep(0.15, 0.5, h);
        col += vec3(0.8, 0.85, 1.0) * stars * 0.7;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // ── Road segment factory ──
  function makeRoadSegment() {
    const g = new THREE.Group();

    const asphalt = new THREE.Mesh(
      new THREE.PlaneGeometry(ROAD_W, SEG_LEN),
      new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.95, metalness: 0.05 })
    );
    asphalt.rotation.x = -Math.PI / 2;
    asphalt.position.y = 0;
    asphalt.receiveShadow = true;
    g.add(asphalt);

    const shoulderL = new THREE.Mesh(
      new THREE.PlaneGeometry(6, SEG_LEN),
      new THREE.MeshStandardMaterial({ color: 0x121018, roughness: 1 })
    );
    shoulderL.rotation.x = -Math.PI / 2;
    shoulderL.position.set(-ROAD_W / 2 - 3, -0.01, 0);
    g.add(shoulderL);

    const shoulderR = shoulderL.clone();
    shoulderR.position.x = ROAD_W / 2 + 3;
    g.add(shoulderR);

    const lineMat = new THREE.MeshBasicMaterial({ color: 0xccccaa });
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xddddbb });
    for (let z = -SEG_LEN / 2 + 2; z < SEG_LEN / 2; z += 6) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 2.5), dashMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(0, 0.02, z);
      g.add(dash);
    }
    const edgeL = new THREE.Mesh(new THREE.PlaneGeometry(0.12, SEG_LEN), lineMat);
    edgeL.rotation.x = -Math.PI / 2;
    edgeL.position.set(-ROAD_W / 2 + 0.3, 0.02, 0);
    g.add(edgeL);
    const edgeR = edgeL.clone();
    edgeR.position.x = ROAD_W / 2 - 0.3;
    g.add(edgeR);

    return g;
  }

  const roadSegments = [];
  for (let i = 0; i < SEG_COUNT; i++) {
    const seg = makeRoadSegment();
    seg.position.z = -i * SEG_LEN;
    scene.add(seg);
    roadSegments.push(seg);
  }

  // ── Distant city skyline ──
  function makeBuilding(w, h, d, color) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.1 })
    );
    m.position.y = h / 2;
    return m;
  }

  function addWindowLights(building, w, h, d) {
    const group = new THREE.Group();
    const cols = Math.floor(w / 1.2);
    const rows = Math.floor(h / 1.5);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.55) continue;
        const win = new THREE.Mesh(
          new THREE.PlaneGeometry(0.5, 0.7),
          new THREE.MeshBasicMaterial({
            color: Math.random() > 0.3 ? 0xffdd88 : 0x88aaff,
            transparent: true,
            opacity: 0.4 + Math.random() * 0.5
          })
        );
        win.position.set(
          -w / 2 + 0.8 + c * 1.2,
          1 + r * 1.5,
          d / 2 + 0.01
        );
        group.add(win);
      }
    }
    building.add(group);
  }

  const skyline = new THREE.Group();
  for (let i = 0; i < 60; i++) {
    const w = 4 + Math.random() * 12;
    const h = 15 + Math.random() * 55;
    const d = 4 + Math.random() * 8;
    const side = Math.random() > 0.5 ? 1 : -1;
    const b = makeBuilding(w, h, d, new THREE.Color().setHSL(0.65, 0.15, 0.08 + Math.random() * 0.06));
    b.position.set(side * (35 + Math.random() * 80), 0, -80 - Math.random() * 200);
    addWindowLights(b, w, h, d);
    skyline.add(b);
  }
  scene.add(skyline);

  // ── Street lamps ──
  const lampPool = [];
  function makeLamp(x) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.12, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0x333340, metalness: 0.6, roughness: 0.4 })
    );
    pole.position.y = 3;
    g.add(pole);

    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.08, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x333340, metalness: 0.6 })
    );
    arm.position.set(x > 0 ? -0.6 : 0.6, 5.8, 0);
    g.add(arm);

    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff5cc })
    );
    bulb.position.set(x > 0 ? -1.2 : 1.2, 5.6, 0);
    g.add(bulb);

    const light = new THREE.PointLight(0xffeecc, 0.8, 18, 2);
    light.position.copy(bulb.position);
    g.add(light);

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(3, 8, 8, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xfff8e0, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
    );
    cone.position.set(light.position.x, 2, 0);
    cone.rotation.x = Math.PI;
    g.add(cone);

    g.userData.x = x;
    return g;
  }

  for (let i = 0; i < 24; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const lamp = makeLamp(side * (ROAD_W / 2 + 2.5));
    lamp.position.set(side * (ROAD_W / 2 + 2.5), 0, -i * 18 - 5);
    scene.add(lamp);
    lampPool.push(lamp);
  }

  // ── Trees / silhouettes ──
  const treePool = [];
  function makeTree() {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.25, 2.5, 5),
      new THREE.MeshStandardMaterial({ color: 0x0a0a0e })
    );
    trunk.position.y = 1.25;
    g.add(trunk);
    const foliage = new THREE.Mesh(
      new THREE.ConeGeometry(1.2 + Math.random() * 0.8, 3 + Math.random() * 2, 6),
      new THREE.MeshStandardMaterial({ color: 0x080810 })
    );
    foliage.position.y = 3.5;
    g.add(foliage);
    return g;
  }

  for (let i = 0; i < 40; i++) {
    const side = Math.random() > 0.5 ? 1 : -1;
    const tree = makeTree();
    tree.position.set(side * (ROAD_W / 2 + 4 + Math.random() * 8), 0, -Math.random() * 400);
    tree.scale.setScalar(0.8 + Math.random() * 0.6);
    scene.add(tree);
    treePool.push({ mesh: tree, side });
  }

  // ── Neon signs ──
  const neonPool = [];
  const neonColors = [0xff2288, 0x22ffaa, 0x4488ff, 0xffaa22, 0xaa44ff];
  function makeNeonSign() {
    const color = neonColors[Math.floor(Math.random() * neonColors.length)];
    const g = new THREE.Group();
    const board = new THREE.Mesh(
      new THREE.BoxGeometry(3 + Math.random() * 4, 1.2 + Math.random(), 0.2),
      new THREE.MeshStandardMaterial({
        color: 0x111118,
        emissive: color,
        emissiveIntensity: 0.8,
        roughness: 0.5
      })
    );
    board.position.y = 3 + Math.random() * 2;
    g.add(board);

    const glow = new THREE.PointLight(color, 0.6, 12, 2);
    glow.position.copy(board.position);
    g.add(glow);
    g.userData.color = color;
    g.userData.phase = Math.random() * Math.PI * 2;
    return g;
  }

  for (let i = 0; i < 16; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const sign = makeNeonSign();
    sign.position.set(side * (ROAD_W / 2 + 6 + Math.random() * 4), 0, -i * 35 - 10);
    scene.add(sign);
    neonPool.push(sign);
  }

  // ── Passing cars ──
  const trafficPool = [];
  function makeCar(color) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.7, 3.8),
      new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.6 })
    );
    body.position.y = 0.55;
    g.add(body);
    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.5, 1.8),
      new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.2, metalness: 0.8 })
    );
    cabin.position.set(0, 1.0, -0.2);
    g.add(cabin);
    [[-0.7, 0.35, 1.5], [0.7, 0.35, 1.5]].forEach(p => {
      const tl = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xffeedd })
      );
      tl.position.set(...p);
      g.add(tl);
    });
    [[-0.7, 0.35, -1.5], [0.7, 0.35, -1.5]].forEach(p => {
      const tl = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xff2222 })
      );
      tl.position.set(...p);
      g.add(tl);
    });
    return g;
  }

  const carColors = [0x224466, 0x662233, 0x333333, 0x445533, 0x553344];
  for (let i = 0; i < 8; i++) {
    const car = makeCar(carColors[i % carColors.length]);
    car.visible = false;
    scene.add(car);
    trafficPool.push({
      mesh: car,
      lane: (Math.random() > 0.5 ? 1 : -1) * 3.2,
      speed: 0.4 + Math.random() * 0.3,
      offset: -50 - Math.random() * 300
    });
  }

  // ── Rain particles ──
  const RAIN_COUNT = 800;
  const rainGeo = new THREE.BufferGeometry();
  const rainPos = new Float32Array(RAIN_COUNT * 3);
  const rainVel = [];
  for (let i = 0; i < RAIN_COUNT; i++) {
    rainPos[i * 3] = (Math.random() - 0.5) * 30;
    rainPos[i * 3 + 1] = Math.random() * 15;
    rainPos[i * 3 + 2] = (Math.random() - 0.5) * 40 - 10;
    rainVel.push(0.3 + Math.random() * 0.2);
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
  const rainMat = new THREE.PointsMaterial({
    color: 0xaabbdd,
    size: 0.06,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });
  const rain = new THREE.Points(rainGeo, rainMat);
  scene.add(rain);

  // ── Dashboard / cockpit ──
  const dashGroup = new THREE.Group();
  const dashMat = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.7, metalness: 0.2 });
  const dashPanel = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.8), dashMat);
  dashPanel.position.set(0, 0.55, 0.8);
  dashGroup.add(dashPanel);

  const wheel = new THREE.Mesh(
    new THREE.TorusGeometry(0.32, 0.04, 8, 24),
    new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.5, metalness: 0.3 })
  );
  wheel.position.set(-0.55, 0.85, 0.65);
  wheel.rotation.x = -0.3;
  dashGroup.add(wheel);

  const windshield = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 1.1),
    new THREE.MeshPhysicalMaterial({
      color: 0x111122,
      transparent: true,
      opacity: 0.08,
      roughness: 0,
      metalness: 0,
      transmission: 0.1
    })
  );
  windshield.position.set(0, 1.5, 0.5);
  dashGroup.add(windshield);

  const speedNeedle = new THREE.Mesh(
    new THREE.BoxGeometry(0.02, 0.25, 0.01),
    new THREE.MeshBasicMaterial({ color: 0xff4466 })
  );
  speedNeedle.position.set(0.6, 0.75, 0.85);
  speedNeedle.geometry.translate(0, 0.12, 0);
  dashGroup.add(speedNeedle);

  const dashAccent = new THREE.Mesh(
    new THREE.PlaneGeometry(0.4, 0.02),
    new THREE.MeshBasicMaterial({ color: 0x2244aa })
  );
  dashAccent.position.set(0.6, 0.62, 0.86);
  dashGroup.add(dashAccent);

  scene.add(dashGroup);

  // ── Wet road reflection strip ──
  const reflectGeo = new THREE.PlaneGeometry(ROAD_W * 0.6, 60);
  const reflectMat = new THREE.MeshBasicMaterial({
    color: 0x334466,
    transparent: true,
    opacity: 0.08,
    depthWrite: false
  });
  const reflectPlane = new THREE.Mesh(reflectGeo, reflectMat);
  reflectPlane.rotation.x = -Math.PI / 2;
  reflectPlane.position.set(0, 0.03, -25);
  scene.add(reflectPlane);

  // ── Input ──
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') targetSpeed = BASE_SPEED * 1.6;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') targetSpeed = BASE_SPEED * 0.4;
  });
  document.addEventListener('keyup', e => {
    if (['ArrowUp', 'KeyW', 'ArrowDown', 'KeyS'].includes(e.code)) targetSpeed = BASE_SPEED;
  });

  // ── Recycle helpers ──
  let farthestZ = -(SEG_COUNT - 1) * SEG_LEN;

  function recycleRoad() {
    roadSegments.forEach(seg => {
      seg.position.z += speed;
      if (seg.position.z > SEG_LEN) {
        seg.position.z = farthestZ;
        farthestZ -= SEG_LEN;
      }
    });
  }

  function recyclePool(pool, spacing, spreadX) {
    pool.forEach(obj => {
      const mesh = obj.mesh || obj;
      mesh.position.z += speed;
      if (mesh.position.z > 20) {
        mesh.position.z = -spacing * (0.5 + Math.random());
        if (spreadX) {
          const side = Math.random() > 0.5 ? 1 : -1;
          mesh.position.x = side * spreadX * (0.8 + Math.random() * 0.4);
        }
      }
    });
  }

  function recycleLamps() {
    lampPool.forEach(lamp => {
      lamp.position.z += speed;
      if (lamp.position.z > 15) {
        lamp.position.z = -300 - Math.random() * 100;
      }
    });
  }

  function recycleNeon() {
    neonPool.forEach(sign => {
      sign.position.z += speed;
      if (sign.position.z > 15) {
        sign.position.z = -350 - Math.random() * 150;
      }
      const flicker = 0.7 + 0.3 * Math.sin(time * 3 + sign.userData.phase);
      sign.children[0].material.emissiveIntensity = 0.5 + flicker * 0.5;
    });
  }

  function updateTraffic() {
    trafficPool.forEach(t => {
      if (!t.active && Math.random() < 0.0008 * (speed / BASE_SPEED)) {
        t.active = true;
        t.mesh.visible = true;
        t.mesh.position.set(t.lane, 0, -80);
      }
      if (t.active) {
        t.mesh.position.z += speed - t.speed;
        if (t.mesh.position.z > 15) {
          t.active = false;
          t.mesh.visible = false;
        }
      }
    });
  }

  function updateRain() {
    const pos = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_COUNT; i++) {
      pos[i * 3 + 1] -= rainVel[i] * (0.5 + speed * 2);
      pos[i * 3 + 2] += speed * 0.5;
      if (pos[i * 3 + 1] < 0) {
        pos[i * 3 + 1] = 12 + Math.random() * 3;
        pos[i * 3] = (Math.random() - 0.5) * 30;
        pos[i * 3 + 2] = -15 - Math.random() * 20;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  // ── Animation loop ──
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    time += dt;

    if (started) {
      speed += (targetSpeed - speed) * 0.02;
    } else {
      speed *= 0.95;
    }

    steer += (mouseX * 0.35 - steer) * 0.04;

    recycleRoad();
    recycleLamps();
    recycleNeon();
    recyclePool(treePool, 80, ROAD_W / 2 + 5);
    updateTraffic();
    updateRain();

    skyline.position.z = (skyline.position.z + speed * 0.15) % 50;

    const sway = Math.sin(time * 1.2) * 0.008;
    const bounce = Math.sin(time * 8) * 0.004 * (speed / BASE_SPEED);
    camera.position.x = steer * 0.6 + sway;
    camera.position.y = 1.35 + bounce;
    camera.rotation.z = -steer * 0.015 + sway * 0.5;
    camera.rotation.x = -0.02 + Math.sin(time * 0.7) * 0.003;

    headLight.position.x = camera.position.x;
    headLight.target.position.set(camera.position.x, 0, -40);

    reflectPlane.position.z = -20 - (time * speed * 5) % 30;

    speedNeedle.rotation.z = -0.5 - (speed / (BASE_SPEED * 1.6)) * 1.8;

    skyMat.uniforms.uTime.value = time;

    const kmh = Math.round(speed * 95);
    document.getElementById('spd').textContent = started ? kmh : '—';

    updateAudio();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>
</body>
</html>
