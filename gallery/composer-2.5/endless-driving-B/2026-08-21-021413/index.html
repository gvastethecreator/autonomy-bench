<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Night Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", system-ui, sans-serif;
      color: rgba(255, 220, 180, 0.85); text-shadow: 0 0 8px rgba(255, 140, 60, 0.4);
    }
    #speed {
      position: absolute; bottom: 28px; right: 36px; font-size: 42px; font-weight: 300; letter-spacing: 2px;
    }
    #speed span { font-size: 16px; opacity: 0.6; margin-left: 4px; }
    #hint {
      position: absolute; bottom: 28px; left: 36px; font-size: 13px; opacity: 0.45; letter-spacing: 0.5px;
    }
    #title {
      position: absolute; top: 28px; left: 36px; font-size: 11px; text-transform: uppercase;
      letter-spacing: 4px; opacity: 0.35;
    }
    #steer-bar {
      position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px;
    }
    #steer-dot {
      position: absolute; top: -4px; left: 50%; width: 11px; height: 11px; margin-left: -5px;
      border-radius: 50%; background: rgba(255, 180, 100, 0.7); box-shadow: 0 0 12px rgba(255,120,40,0.6);
      transition: left 0.08s linear;
    }
    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    #dash {
      position: fixed; bottom: 0; left: 0; right: 0; height: 18vh; pointer-events: none;
      background: linear-gradient(to top, rgba(8,6,12,0.95) 0%, rgba(8,6,12,0.6) 40%, transparent 100%);
    }
    #windshield-reflection {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.04;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">Endless Night Drive</div>
    <div id="speed">0<span>km/h</span></div>
    <div id="hint">← → steer &nbsp;·&nbsp; ↑ ↓ speed</div>
    <div id="steer-bar"><div id="steer-dot"></div></div>
  </div>
  <div id="vignette"></div>
  <div id="dash"></div>
  <div id="windshield-reflection"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
(function () {
  "use strict";

  const ROAD_SEGMENTS = 24;
  const SEGMENT_LENGTH = 40;
  const ROAD_WIDTH = 14;
  const LANE_COUNT = 3;

  let speed = 0.55;
  let targetSpeed = 0.55;
  let steer = 0;
  let roadOffset = 0;
  let elapsed = 0;

  const keys = { left: false, right: false, up: false, down: false };

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x020208);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x080818, 0.012);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 600);
  camera.position.set(0, 1.35, 2.2);
  camera.rotation.x = -0.08;

  // --- Sky dome with gradient ---
  const skyGeo = new THREE.SphereGeometry(400, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      uTop: { value: new THREE.Color(0x060612) },
      uHorizon: { value: new THREE.Color(0x181028) },
      uGlow: { value: new THREE.Color(0x2a1848) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uTop, uHorizon, uGlow;
      varying vec3 vPos;
      void main() {
        float h = normalize(vPos).y * 0.5 + 0.5;
        vec3 col = mix(uHorizon, uTop, smoothstep(0.0, 0.6, h));
        col += uGlow * exp(-abs(h - 0.12) * 18.0) * 0.35;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // --- Stars ---
  const starCount = 2500;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 280 + Math.random() * 80;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 20;
    starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, sizeAttenuation: true, transparent: true, opacity: 0.85 });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // --- Moon ---
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(8, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xdde8ff })
  );
  moon.position.set(-80, 90, -200);
  scene.add(moon);
  const moonGlow = new THREE.Mesh(
    new THREE.SphereGeometry(14, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x8899cc, transparent: true, opacity: 0.08 })
  );
  moon.add(moonGlow);

  // --- Lighting ---
  const ambient = new THREE.AmbientLight(0x1a1830, 0.35);
  scene.add(ambient);

  const headlightL = new THREE.SpotLight(0xfff4dd, 1.8, 120, 0.55, 0.4, 1.2);
  headlightL.position.set(-0.6, 0.8, 1.5);
  headlightL.target.position.set(-1.5, 0, -40);
  scene.add(headlightL);
  scene.add(headlightL.target);

  const headlightR = new THREE.SpotLight(0xfff4dd, 1.8, 120, 0.55, 0.4, 1.2);
  headlightR.position.set(0.6, 0.8, 1.5);
  headlightR.target.position.set(1.5, 0, -40);
  scene.add(headlightR);
  scene.add(headlightR.target);

  // --- Road shader material ---
  const roadUniforms = {
    uOffset: { value: 0 },
    uSegmentLen: { value: SEGMENT_LENGTH },
    uRoadWidth: { value: ROAD_WIDTH }
  };
  const roadMat = new THREE.ShaderMaterial({
    uniforms: roadUniforms,
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uOffset, uSegmentLen, uRoadWidth;
      varying vec2 vUv;
      varying vec3 vWorldPos;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      void main() {
        float z = vWorldPos.z + uOffset;
        float laneW = uRoadWidth / 3.0;
        float x = vWorldPos.x;

        // Asphalt
        float noise = hash(floor(vWorldPos.xz * 0.5)) * 0.04;
        vec3 asphalt = vec3(0.06, 0.06, 0.08) + noise;

        // Edge lines
        float edgeDist = abs(abs(x) - uRoadWidth * 0.5);
        float edge = 1.0 - smoothstep(0.0, 0.12, edgeDist);
        asphalt = mix(asphalt, vec3(0.85, 0.82, 0.7), edge * 0.9);

        // Center dashed line
        float dash = mod(z, 6.0);
        float centerLine = (1.0 - smoothstep(0.0, 0.08, abs(x))) * step(dash, 3.0);

        // Lane dividers
        float lane1 = abs(x + laneW * 0.5);
        float lane2 = abs(x - laneW * 0.5);
        float div1 = (1.0 - smoothstep(0.0, 0.06, lane1)) * step(mod(z + 1.5, 8.0), 4.0);
        float div2 = (1.0 - smoothstep(0.0, 0.06, lane2)) * step(mod(z + 1.5, 8.0), 4.0);

        vec3 lines = vec3(0.9, 0.88, 0.75);
        asphalt = mix(asphalt, lines, centerLine * 0.85);
        asphalt = mix(asphalt, lines, max(div1, div2) * 0.7);

        // Shoulder
        float shoulder = smoothstep(uRoadWidth * 0.5, uRoadWidth * 0.65, abs(x));
        asphalt = mix(asphalt, vec3(0.04, 0.05, 0.04), shoulder);

        // Headlight wash
        float headGlow = exp(-abs(x) * 0.15) * exp(-mod(z, uSegmentLen) * 0.02) * 0.15;
        asphalt += vec3(0.12, 0.1, 0.06) * headGlow;

        gl_FragColor = vec4(asphalt, 1.0);
      }
    `
  });

  const roadSegments = [];
  const roadGroup = new THREE.Group();
  scene.add(roadGroup);

  for (let i = 0; i < ROAD_SEGMENTS; i++) {
    const geo = new THREE.PlaneGeometry(ROAD_WIDTH + 8, SEGMENT_LENGTH, 1, 1);
    geo.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geo, roadMat);
    mesh.receiveShadow = true;
    mesh.position.z = -i * SEGMENT_LENGTH;
    mesh.position.y = 0;
    roadGroup.add(mesh);
    roadSegments.push(mesh);
  }

  // --- Ground shoulders ---
  const shoulderMat = new THREE.MeshLambertMaterial({ color: 0x0a0c0a });
  for (let i = 0; i < ROAD_SEGMENTS; i++) {
    [-1, 1].forEach(function (side) {
      const g = new THREE.PlaneGeometry(30, SEGMENT_LENGTH);
      g.rotateX(-Math.PI / 2);
      const m = new THREE.Mesh(g, shoulderMat);
      m.position.set(side * (ROAD_WIDTH * 0.5 + 15), -0.01, -i * SEGMENT_LENGTH);
      roadGroup.add(m);
      roadSegments.push(m);
    });
  }

  // --- Street lights ---
  const lightPoles = [];
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x1a1a22 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffeedd });

  function createPole(side) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 6), poleMat);
    pole.position.y = 2.5;
    g.add(pole);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 0.06), poleMat);
    arm.position.set(side * 0.5, 4.8, 0);
    g.add(arm);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.3), lampMat);
    lamp.position.set(side * 1.0, 4.75, 0);
    g.add(lamp);

    const spot = new THREE.PointLight(0xffaa66, 0.6, 35, 1.8);
    spot.position.set(side * 1.0, 4.5, 0);
    g.add(spot);
    return g;
  }

  for (let i = 0; i < 40; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const pole = createPole(side);
    pole.position.set(side * (ROAD_WIDTH * 0.5 + 2.5), 0, -i * 18 - 5);
    scene.add(pole);
    lightPoles.push({ mesh: pole, baseZ: pole.position.z });
  }

  // --- Distant city silhouettes ---
  const cityGroup = new THREE.Group();
  const buildingMat = new THREE.MeshBasicMaterial({ color: 0x0c0a14 });
  const windowMat = new THREE.MeshBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.6 });

  for (let i = 0; i < 60; i++) {
    const w = 4 + Math.random() * 12;
    const h = 8 + Math.random() * 35;
    const d = 4 + Math.random() * 8;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    b.position.set((Math.random() - 0.5) * 200, h * 0.5 - 2, -80 - Math.random() * 120);
    cityGroup.add(b);

    if (Math.random() > 0.4) {
      const rows = Math.floor(h / 3);
      const cols = Math.floor(w / 2.5);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.random() > 0.55) continue;
          const win = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), windowMat.clone());
          win.material.opacity = 0.3 + Math.random() * 0.5;
          win.material.color.setHSL(0.08 + Math.random() * 0.05, 0.8, 0.5 + Math.random() * 0.3);
          win.position.set(
            b.position.x - w * 0.5 + 1.5 + c * 2.5,
            b.position.y - h * 0.5 + 2 + r * 3,
            b.position.z + d * 0.5 + 0.01
          );
          cityGroup.add(win);
        }
      }
    }
  }
  scene.add(cityGroup);

  // --- Neon signs along road ---
  const neonColors = [0xff2266, 0x22ffaa, 0x4488ff, 0xff8844, 0xcc44ff];
  const signs = [];
  for (let i = 0; i < 20; i++) {
    const color = neonColors[i % neonColors.length];
    const signGeo = new THREE.PlaneGeometry(3 + Math.random() * 4, 1 + Math.random() * 2);
    const signMat = new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide
    });
    const sign = new THREE.Mesh(signGeo, signMat);
    const side = i % 2 === 0 ? -1 : 1;
    sign.position.set(side * (ROAD_WIDTH * 0.5 + 6 + Math.random() * 4), 3 + Math.random() * 3, -i * 35 - 10);
    sign.rotation.y = side * -0.3;
    scene.add(sign);
    signs.push(sign);

    const glow = new THREE.PointLight(color, 0.15, 12, 2);
    glow.position.copy(sign.position);
    glow.position.y -= 0.5;
    scene.add(glow);
  }

  // --- Rain ---
  const rainCount = 4000;
  const rainPos = new Float32Array(rainCount * 3);
  const rainVel = new Float32Array(rainCount);
  for (let i = 0; i < rainCount; i++) {
    rainPos[i * 3] = (Math.random() - 0.5) * 40;
    rainPos[i * 3 + 1] = Math.random() * 20;
    rainPos[i * 3 + 2] = (Math.random() - 0.5) * 80 - 20;
    rainVel[i] = 0.3 + Math.random() * 0.5;
  }
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
  const rainMat = new THREE.PointsMaterial({
    color: 0xaaccff, size: 0.06, transparent: true, opacity: 0.35, sizeAttenuation: true
  });
  const rain = new THREE.Points(rainGeo, rainMat);
  scene.add(rain);

  // --- Oncoming car headlights (distant) ---
  const oncoming = [];
  for (let i = 0; i < 8; i++) {
    const car = new THREE.Group();
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffeedd })
    );
    glow.scale.set(2, 1, 1);
    car.add(glow);
    car.position.set((Math.random() - 0.5) * ROAD_WIDTH * 0.6, 0.5, -60 - i * 45);
    scene.add(car);
    oncoming.push({ mesh: car, lane: (Math.random() - 0.5) * ROAD_WIDTH * 0.5, speed: 0.3 + Math.random() * 0.2 });
  }

  // --- Input ---
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    if (e.key === "ArrowUp" || e.key === "w") keys.up = true;
    if (e.key === "ArrowDown" || e.key === "s") keys.down = true;
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    if (e.key === "ArrowUp" || e.key === "w") keys.up = false;
    if (e.key === "ArrowDown" || e.key === "s") keys.down = false;
  });

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const speedEl = document.getElementById("speed");
  const steerDot = document.getElementById("steer-dot");

  function recycleRoad() {
    roadSegments.forEach(function (seg) {
      if (seg.position.z > SEGMENT_LENGTH) {
        seg.position.z -= ROAD_SEGMENTS * SEGMENT_LENGTH;
      }
    });
  }

  function updatePoles() {
    lightPoles.forEach(function (p) {
      p.mesh.position.z += speed * 1.2;
      if (p.mesh.position.z > 10) {
        p.mesh.position.z -= 40 * 18;
      }
    });
  }

  function updateRain(dt) {
    const pos = rainGeo.attributes.position.array;
    for (let i = 0; i < rainCount; i++) {
      pos[i * 3 + 1] -= rainVel[i] * (0.5 + speed * 2) * dt * 60;
      pos[i * 3 + 2] += speed * 1.5 * dt * 60;
      if (pos[i * 3 + 1] < 0) {
        pos[i * 3 + 1] = 15 + Math.random() * 5;
        pos[i * 3] = camera.position.x + (Math.random() - 0.5) * 40;
        pos[i * 3 + 2] = camera.position.z - 10 - Math.random() * 60;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  function updateOncoming(dt) {
    oncoming.forEach(function (c) {
      c.mesh.position.z += (speed + c.speed) * dt * 60;
      c.mesh.position.x += Math.sin(elapsed * 0.5 + c.mesh.position.z * 0.01) * 0.002;
      if (c.mesh.position.z > 15) {
        c.mesh.position.z = -200 - Math.random() * 100;
        c.mesh.position.x = c.lane;
      }
    });
  }

  function updateSigns() {
    signs.forEach(function (s) {
      s.position.z += speed * 1.2;
      if (s.position.z > 15) s.position.z -= 20 * 35;
      s.material.opacity = 0.5 + Math.sin(elapsed * 3 + s.position.z) * 0.2;
    });
  }

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if (keys.left) steer = Math.max(steer - dt * 1.8, -1);
    else if (keys.right) steer = Math.min(steer + dt * 1.8, 1);
    else steer *= Math.pow(0.02, dt);

    if (keys.up) targetSpeed = Math.min(targetSpeed + dt * 0.4, 1.4);
    else if (keys.down) targetSpeed = Math.max(targetSpeed - dt * 0.4, 0.15);
    else targetSpeed = 0.55 + Math.sin(elapsed * 0.15) * 0.05;

    speed += (targetSpeed - speed) * dt * 2;

    roadOffset += speed * dt * 60;
    roadUniforms.uOffset.value = roadOffset;

    roadGroup.position.z += speed * dt * 60;
    if (roadGroup.position.z > SEGMENT_LENGTH) {
      roadGroup.position.z -= SEGMENT_LENGTH;
    }
    recycleRoad();

    camera.position.x += steer * dt * 3;
    camera.rotation.z = -steer * 0.04;
    camera.rotation.y = steer * 0.015;

    headlightL.intensity = 1.6 + Math.sin(elapsed * 8) * 0.05;
    headlightR.intensity = 1.6 + Math.sin(elapsed * 8 + 1) * 0.05;

    updatePoles();
    updateRain(dt);
    updateOncoming(dt);
    updateSigns();

    cityGroup.position.z = (roadOffset * 0.05) % 40;

    const kmh = Math.round(speed * 120);
    speedEl.innerHTML = kmh + "<span>km/h</span>";
    steerDot.style.left = (50 + steer * 45) + "%";

    renderer.render(scene, camera);
  }

  animate();
})();
  </script>
</body>
</html>
