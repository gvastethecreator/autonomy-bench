<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Biped Walker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0e17; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #info {
      position: fixed;
      bottom: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div id="info">Procedural biped walk cycle</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);
    scene.fog = new THREE.Fog(0x0a0e17, 12, 40);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(4, 3.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.update();

    const hemi = new THREE.HemisphereLight(0x88aaff, 0x223344, 0.6);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4e0, 1.4);
    sun.position.set(5, 10, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 30;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(20, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2438, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(20, 40, 0x2a3a55, 0x182030);
    grid.position.y = 0.001;
    scene.add(grid);

    const skinMat = new THREE.MeshStandardMaterial({ color: 0x4ecdc4, roughness: 0.55, metalness: 0.1 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0x2a9d8f, roughness: 0.4, metalness: 0.15 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.6 });
    const glowMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0xff3333, emissiveIntensity: 0.35, roughness: 0.5 });

    function makeLimb(length, radius, material) {
      const mesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(radius, length, 6, 12),
        material
      );
      mesh.castShadow = true;
      mesh.position.y = -length / 2;
      return mesh;
    }

    function makeJoint(radius) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 16, 16),
        jointMat
      );
      mesh.castShadow = true;
      return mesh;
    }

    function buildLeg(side) {
      const root = new THREE.Group();
      root.position.set(side * 0.22, 0.95, 0);

      const hip = makeJoint(0.11);
      root.add(hip);

      const thighPivot = new THREE.Group();
      thighPivot.position.y = -0.05;
      hip.add(thighPivot);

      const thigh = makeLimb(0.42, 0.09, skinMat);
      thighPivot.add(thigh);

      const knee = makeJoint(0.09);
      knee.position.y = -0.42;
      thighPivot.add(knee);

      const shinPivot = new THREE.Group();
      knee.add(shinPivot);

      const shin = makeLimb(0.4, 0.075, skinMat);
      shinPivot.add(shin);

      const ankle = makeJoint(0.07);
      ankle.position.y = -0.4;
      shinPivot.add(ankle);

      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.06, 0.28),
        skinMat
      );
      foot.castShadow = true;
      foot.position.set(0, -0.04, 0.08);
      ankle.add(foot);

      return { root, thighPivot, shinPivot, foot };
    }

    function buildArm(side) {
      const root = new THREE.Group();
      root.position.set(side * 0.38, 1.55, 0);

      const shoulder = makeJoint(0.09);
      root.add(shoulder);

      const upperPivot = new THREE.Group();
      shoulder.add(upperPivot);

      const upper = makeLimb(0.32, 0.065, skinMat);
      upperPivot.add(upper);

      const elbow = makeJoint(0.07);
      elbow.position.y = -0.32;
      upperPivot.add(elbow);

      const lowerPivot = new THREE.Group();
      elbow.add(lowerPivot);

      const lower = makeLimb(0.28, 0.055, skinMat);
      lowerPivot.add(lower);

      return { root, upperPivot, lowerPivot };
    }

    const biped = new THREE.Group();
    scene.add(biped);

    const pelvis = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.22, 0.28),
      skinMat
    );
    pelvis.castShadow = true;
    pelvis.position.y = 1.05;
    biped.add(pelvis);

    const spine = new THREE.Group();
    spine.position.y = 1.18;
    pelvis.add(spine);

    const torso = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.55, 0.25),
      skinMat
    );
    torso.castShadow = true;
    torso.position.y = 0.28;
    spine.add(torso);

    const chestGlow = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 12, 12),
      glowMat
    );
    chestGlow.position.set(0, 0.1, 0.14);
    torso.add(chestGlow);

    const neck = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.09, 0.12, 12),
      skinMat
    );
    neck.castShadow = true;
    neck.position.y = 0.62;
    spine.add(neck);

    const head = new THREE.Group();
    head.position.y = 0.72;
    spine.add(head);

    const skull = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 20, 20),
      skinMat
    );
    skull.castShadow = true;
    skull.scale.set(1, 1.05, 0.95);
    head.add(skull);

    const eyeGeo = new THREE.SphereGeometry(0.04, 10, 10);
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.08, 0.03, 0.18);
    head.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.08;
    head.add(eyeR);

    const antenna = new THREE.Mesh(
      new THREE.CylinderGeometry(0.015, 0.025, 0.25, 8),
      glowMat
    );
    antenna.position.set(0, 0.28, 0);
    head.add(antenna);

    const leftLeg = buildLeg(-1);
    const rightLeg = buildLeg(1);
    pelvis.add(leftLeg.root, rightLeg.root);

    const leftArm = buildArm(-1);
    const rightArm = buildArm(1);
    spine.add(leftArm.root, rightArm.root);

    const walkParams = {
      speed: 4.2,
      stride: 0.55,
      kneeLift: 0.85,
      hipSwing: 0.45,
      armSwing: 0.55,
      bob: 0.04,
      sway: 0.06,
      lean: 0.08
    };

    let time = 0;
    const clock = new THREE.Clock();

    function proceduralWalk(t) {
      const phase = t * walkParams.speed;
      const sin = Math.sin(phase);
      const cos = Math.cos(phase);
      const sin2 = Math.sin(phase * 2);
      const absSin = Math.abs(sin);

      biped.position.x = sin * 0.3;
      biped.position.z = t * 0.35;
      biped.rotation.y = Math.atan2(Math.cos(phase) * 0.35, 1);

      pelvis.position.y = 1.05 + absSin * walkParams.bob;
      pelvis.rotation.z = sin * walkParams.sway;
      pelvis.rotation.x = walkParams.lean;

      spine.rotation.x = -walkParams.lean * 0.5 + sin2 * 0.03;
      spine.rotation.y = sin * 0.04;

      head.rotation.x = -sin2 * 0.05;
      head.rotation.y = -sin * 0.06;
      head.rotation.z = -sin * 0.03;

      function animateLeg(leg, sign) {
        const thighAngle = sin * sign * walkParams.hipSwing;
        const kneeAngle = Math.max(0, -sin * sign) * walkParams.kneeLift;
        const shinAngle = kneeAngle * 0.85;
        const footAngle = -thighAngle - shinAngle + 0.15;

        leg.thighPivot.rotation.x = thighAngle;
        leg.shinPivot.rotation.x = shinAngle;
        leg.foot.rotation.x = footAngle;
      }

      animateLeg(leftLeg, 1);
      animateLeg(rightLeg, -1);

      function animateArm(arm, sign) {
        arm.upperPivot.rotation.x = -sin * sign * walkParams.armSwing;
        arm.lowerPivot.rotation.x = Math.abs(sin * sign) * 0.35 + 0.15;
      }

      animateArm(leftArm, -1);
      animateArm(rightArm, 1);

      antenna.rotation.z = sin2 * 0.15;
      chestGlow.material.emissiveIntensity = 0.25 + absSin * 0.25;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      time += dt;
      proceduralWalk(time);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
