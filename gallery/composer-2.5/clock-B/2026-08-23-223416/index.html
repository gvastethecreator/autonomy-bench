<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #1a1f3c 0%, #0a0c14 55%, #050508 100%);
    color: #e8eaf0;
  }

  /* ambient stars */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: var(--peak, 0.7); transform: scale(1.2); }
  }

  .clock-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    z-index: 1;
  }

  .face {
    position: relative;
    width: min(78vw, 420px);
    height: min(78vw, 420px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 32%, #2a3055 0%, #141828 45%, #0e1018 100%);
    box-shadow:
      0 0 0 3px rgba(180, 190, 220, 0.08),
      0 0 0 8px rgba(0, 0, 0, 0.35),
      0 24px 80px rgba(0, 0, 0, 0.65),
      inset 0 2px 24px rgba(255, 255, 255, 0.04),
      inset 0 -8px 32px rgba(0, 0, 0, 0.5);
  }

  .face::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.06);
    pointer-events: none;
  }

  .tick {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 14px;
    margin-left: -1px;
    margin-top: calc(-1 * min(39vw, 210px) + 22px);
    transform-origin: 50% calc(min(39vw, 210px) - 22px);
    background: rgba(200, 210, 230, 0.35);
    border-radius: 1px;
  }

  .tick.major {
    width: 3px;
    height: 22px;
    margin-left: -1.5px;
    margin-top: calc(-1 * min(39vw, 210px) + 18px);
    transform-origin: 50% calc(min(39vw, 210px) - 18px);
    background: rgba(220, 228, 245, 0.75);
  }

  .numeral {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 32px;
    height: 32px;
    margin: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(13px, 3.2vw, 17px);
    font-weight: 300;
    letter-spacing: 0.02em;
    color: rgba(210, 218, 240, 0.85);
    transform: rotate(var(--angle)) translateY(calc(-1 * min(33vw, 178px))) rotate(calc(-1 * var(--angle)));
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: 50% 100%;
    border-radius: 999px;
    will-change: transform;
  }

  .hand-hour {
    width: 7px;
    height: 28%;
    margin-left: -3.5px;
    background: linear-gradient(to top, #c8d0e8, #eef2ff);
    box-shadow: 0 0 12px rgba(180, 200, 255, 0.25);
    z-index: 3;
  }

  .hand-minute {
    width: 5px;
    height: 38%;
    margin-left: -2.5px;
    background: linear-gradient(to top, #a8b8e0, #dce4ff);
    box-shadow: 0 0 10px rgba(160, 190, 255, 0.3);
    z-index: 4;
  }

  .hand-second {
    width: 2px;
    height: 42%;
    margin-left: -1px;
    background: linear-gradient(to top, #ff6b6b 0%, #ff8a8a 60%, transparent 100%);
    z-index: 5;
  }

  .hand-second::after {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff6b6b;
    box-shadow: 0 0 8px rgba(255, 100, 100, 0.6);
  }

  .center-cap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin: -7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #8898c0);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    z-index: 6;
  }

  .digital {
    text-align: center;
    letter-spacing: 0.12em;
  }

  .time-digits {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: rgba(230, 235, 250, 0.92);
    text-shadow: 0 0 30px rgba(120, 160, 255, 0.15);
  }

  .time-digits .sep {
    display: inline-block;
    animation: blink 1s step-end infinite;
    opacity: 0.7;
  }

  @keyframes blink {
    0%, 49% { opacity: 0.7; }
    50%, 100% { opacity: 0.15; }
  }

  .date-line {
    margin-top: 0.5rem;
    font-size: clamp(0.75rem, 2.2vw, 0.95rem);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(160, 175, 210, 0.55);
  }

  .glow-ring {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100, 140, 255, 0.06) 0%, transparent 70%);
    pointer-events: none;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.02); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="clock-container">
  <div class="face" id="face">
    <div class="glow-ring"></div>
    <div class="center-cap"></div>
    <div class="hand hand-hour" id="hourHand"></div>
    <div class="hand hand-minute" id="minuteHand"></div>
    <div class="hand hand-second" id="secondHand"></div>
  </div>
  <div class="digital">
    <div class="time-digits" id="timeDigits"></div>
    <div class="date-line" id="dateLine"></div>
  </div>
</div>

<script>
(function () {
  const face = document.getElementById("face");
  const hourHand = document.getElementById("hourHand");
  const minuteHand = document.getElementById("minuteHand");
  const secondHand = document.getElementById("secondHand");
  const timeDigits = document.getElementById("timeDigits");
  const dateLine = document.getElementById("dateLine");
  const starsEl = document.getElementById("stars");

  /* build tick marks and numerals */
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement("div");
    tick.className = "tick" + (i % 5 === 0 ? " major" : "");
    tick.style.transform = `rotate(${i * 6}deg)`;
    face.appendChild(tick);
  }

  for (let h = 1; h <= 12; h++) {
    const num = document.createElement("div");
    num.className = "numeral";
    num.textContent = h;
    num.style.setProperty("--angle", `${h * 30}deg`);
    face.appendChild(num);
  }

  /* ambient stars */
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--dur", (2 + Math.random() * 5) + "s");
    s.style.setProperty("--delay", (Math.random() * 6) + "s");
    s.style.setProperty("--peak", (0.3 + Math.random() * 0.6).toFixed(2));
    starsEl.appendChild(s);
  }

  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function update() {
    const now = new Date();
    const ms = now.getMilliseconds();
    const sec = now.getSeconds() + ms / 1000;
    const min = now.getMinutes() + sec / 60;
    const hr = (now.getHours() % 12) + min / 60;

    secondHand.style.transform = `rotate(${sec * 6}deg)`;
    minuteHand.style.transform = `rotate(${min * 6}deg)`;
    hourHand.style.transform = `rotate(${hr * 30}deg)`;

    const h24 = now.getHours();
    const h12 = h24 % 12 || 12;
    timeDigits.innerHTML =
      pad(h12) + '<span class="sep">:</span>' +
      pad(now.getMinutes()) + '<span class="sep">:</span>' +
      pad(now.getSeconds());

    dateLine.textContent =
      DAYS[now.getDay()] + " · " +
      MONTHS[now.getMonth()] + " " +
      now.getDate() + ", " +
      now.getFullYear();
  }

  update();
  requestAnimationFrame(function loop() {
    update();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
