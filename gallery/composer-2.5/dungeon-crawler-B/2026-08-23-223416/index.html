<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depths Below</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #c8b896;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #game-wrap {
    position: relative;
    border: 3px solid #3a2a1a;
    box-shadow: 0 0 40px rgba(200, 120, 40, 0.15), inset 0 0 60px rgba(0,0,0,0.5);
    border-radius: 4px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    font-size: 13px;
    pointer-events: none;
    z-index: 2;
  }
  #hud span { margin-right: 16px; }
  .hp-bar-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .hp-bar {
    width: 80px; height: 10px;
    background: #1a0a0a;
    border: 1px solid #5a3a2a;
    border-radius: 2px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(to bottom, #c44, #822);
    transition: width 0.2s;
  }
  #msg-log {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 8px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    font-size: 12px;
    min-height: 28px;
    z-index: 2;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 28px;
    color: #e8a040;
    text-shadow: 0 0 20px rgba(232,160,64,0.5);
    margin-bottom: 8px;
    letter-spacing: 4px;
  }
  #overlay p { font-size: 13px; color: #8a7860; margin-bottom: 20px; line-height: 1.6; }
  #overlay .keys {
    font-size: 11px;
    color: #6a5840;
    margin-top: 16px;
    line-height: 2;
  }
  .btn {
    background: #3a2a10;
    border: 2px solid #8a6830;
    color: #e8c870;
    padding: 10px 28px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
    letter-spacing: 2px;
    transition: background 0.15s;
  }
  .btn:hover { background: #5a4020; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div>
      <span id="h-floor">Floor 1</span>
      <span class="hp-bar-wrap">HP <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div> <span id="h-hp">20/20</span></span>
      <span id="h-atk">ATK 4</span>
      <span id="h-gold">Gold: 0</span>
    </div>
    <div>
      <span id="h-pots">Potions: 0</span>
      <span id="h-keys">Keys: 0</span>
    </div>
  </div>
  <div id="msg-log">Welcome to the Depths Below...</div>
  <div id="overlay">
    <h1>DEPTHS BELOW</h1>
    <p>A procedural dungeon awaits.<br>Descend five floors. Slay what lurks. Claim the exit.</p>
    <button class="btn" id="start-btn">ENTER</button>
    <div class="keys">
      WASD / Arrows — Move &nbsp;|&nbsp; Space — Wait &nbsp;|&nbsp; Q — Use Potion<br>
      Bump enemies to attack &nbsp;|&nbsp; Collect keys to open doors
    </div>
  </div>
</div>
<script>
(() => {
'use strict';

const TILE = 24;
const VIEW_W = 21, VIEW_H = 15;
const CANVAS_W = VIEW_W * TILE, CANVAS_H = VIEW_H * TILE;
const MAP_W = 51, MAP_H = 37;
const MAX_FLOOR = 5;

const T = { WALL: 0, FLOOR: 1, DOOR: 2, STAIRS: 3, EXIT: 4 };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

const overlay = document.getElementById('overlay');
const msgLog = document.getElementById('msg-log');
const startBtn = document.getElementById('start-btn');

let map, explored, visible;
let player, enemies, items, particles;
let floor, gold, message, messageTimer, gameOver, won, turnCount;
let animating = false;
let rng;

function seedRng(s) {
  let state = s >>> 0;
  return () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
}

function randInt(a, b) { return Math.floor(rng() * (b - a + 1)) + a; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function setMessage(msg) {
  message = msg;
  messageTimer = 120;
  msgLog.textContent = msg;
}

function initArrays() {
  map = Array.from({ length: MAP_H }, () => new Uint8Array(MAP_W).fill(T.WALL));
  explored = Array.from({ length: MAP_H }, () => new Uint8Array(MAP_W));
  visible = Array.from({ length: MAP_H }, () => new Uint8Array(MAP_W));
  enemies = [];
  items = [];
  particles = [];
}

function carveRoom(x, y, w, h) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (i > 0 && i < MAP_W - 1 && j > 0 && j < MAP_H - 1)
        map[j][i] = T.FLOOR;
}

function carveHorz(x1, x2, y) {
  const [a, b] = x1 < x2 ? [x1, x2] : [x2, x1];
  for (let i = a; i <= b; i++) map[y][i] = T.FLOOR;
}

function carveVert(y1, y2, x) {
  const [a, b] = y1 < y2 ? [y1, y2] : [y2, y1];
  for (let j = a; j <= b; j++) map[j][x] = T.FLOOR;
}

function generateDungeon() {
  initArrays();
  const rooms = [];
  const attempts = 80;
  for (let a = 0; a < attempts; a++) {
    const w = randInt(5, 11), h = randInt(4, 9);
    const x = randInt(1, MAP_W - w - 2);
    const y = randInt(1, MAP_H - h - 2);
    let overlap = false;
    for (const r of rooms) {
      if (x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y) {
        overlap = true; break;
      }
    }
    if (!overlap) {
      rooms.push({ x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) });
      carveRoom(x, y, w, h);
    }
  }
  if (rooms.length < 4) return generateDungeon();
  shuffle(rooms);
  for (let i = 1; i < rooms.length; i++) {
    const prev = rooms[i - 1], cur = rooms[i];
    if (rng() < 0.5) {
      carveHorz(prev.cx, cur.cx, prev.cy);
      carveVert(prev.cy, cur.cy, cur.cx);
    } else {
      carveVert(prev.cy, cur.cy, prev.cx);
      carveHorz(prev.cx, cur.cx, cur.cy);
    }
  }
  return rooms;
}

function isWalkable(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return false;
  const t = map[y][x];
  return t === T.FLOOR || t === T.STAIRS || t === T.EXIT;
}

function isBlocked(x, y) {
  if (!isWalkable(x, y)) return true;
  if (enemies.some(e => e.alive && e.x === x && e.y === y)) return true;
  return false;
}

function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

function computeFOV() {
  for (let j = 0; j < MAP_H; j++) visible[j].fill(0);
  const r = 8;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r + 1) continue;
      const tx = player.x + dx, ty = player.y + dy;
      if (tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H) {
        visible[ty][tx] = 1;
        explored[ty][tx] = 1;
      }
    }
  }
}

function spawnEnemies(rooms, startRoom) {
  const types = [
    { name: 'Rat', ch: 'r', color: '#886644', hp: 4, atk: 2, xp: 3 },
    { name: 'Skeleton', ch: 's', color: '#ccccaa', hp: 8, atk: 4, xp: 8 },
    { name: 'Ghoul', ch: 'g', color: '#66aa66', hp: 12, atk: 5, xp: 12 },
    { name: 'Wraith', ch: 'w', color: '#8888ff', hp: 10, atk: 6, xp: 15 },
    { name: 'Demon', ch: 'D', color: '#cc3333', hp: 20, atk: 8, xp: 25 },
  ];
  const count = Math.min(rooms.length * 2 + floor, 18);
  const pool = rooms.filter(r => r !== startRoom);
  for (let i = 0; i < count; i++) {
    const room = pool[randInt(0, pool.length - 1)];
    const ex = randInt(room.x + 1, room.x + room.w - 2);
    const ey = randInt(room.y + 1, room.y + room.h - 2);
    if (ex === player.x && ey === player.y) continue;
    if (enemies.some(e => e.x === ex && e.y === ey)) continue;
    const tier = Math.min(Math.floor(floor / 1.5), types.length - 1);
    const t = types[randInt(Math.max(0, tier - 1), tier)];
    enemies.push({ x: ex, y: ey, ...t, maxHp: t.hp, alive: true, id: i });
  }
}

function spawnItems(rooms, endRoom) {
  const floorTiles = [];
  for (let j = 0; j < MAP_H; j++)
    for (let i = 0; i < MAP_W; i++)
      if (map[j][i] === T.FLOOR && !(i === player.x && j === player.y))
        floorTiles.push({ x: i, y: j });
  shuffle(floorTiles);

  const potCount = randInt(2, 4);
  for (let i = 0; i < potCount && floorTiles.length; i++) {
    const p = floorTiles.pop();
    items.push({ x: p.x, y: p.y, type: 'potion', ch: '!', color: '#44cc44' });
  }

  if (floor < MAX_FLOOR) {
    const keyCount = randInt(1, 2);
    for (let i = 0; i < keyCount && floorTiles.length; i++) {
      const p = floorTiles.pop();
      items.push({ x: p.x, y: p.y, type: 'key', ch: 'k', color: '#ccaa44' });
    }
  }

  const goldCount = randInt(4, 8);
  for (let i = 0; i < goldCount && floorTiles.length; i++) {
    const p = floorTiles.pop();
    const amt = randInt(3, 12) + floor * 2;
    items.push({ x: p.x, y: p.y, type: 'gold', ch: '$', color: '#ddaa22', amount: amt });
  }

  // Place doors blocking some corridors
  const doorCandidates = [];
  for (let j = 1; j < MAP_H - 1; j++)
    for (let i = 1; i < MAP_W - 1; i++) {
      if (map[j][i] !== T.FLOOR) continue;
      const n = [map[j-1][i], map[j+1][i], map[j][i-1], map[j][i+1]].filter(t => t === T.FLOOR).length;
      if (n === 2) doorCandidates.push({ x: i, y: j });
    }
  shuffle(doorCandidates);
  const doorCount = Math.min(randInt(1, 3), doorCandidates.length);
  for (let i = 0; i < doorCount; i++) {
    const d = doorCandidates[i];
    map[d.y][d.x] = T.DOOR;
  }

  // Stairs in end room
  const ex = randInt(endRoom.x + 1, endRoom.x + endRoom.w - 2);
  const ey = randInt(endRoom.y + 1, endRoom.y + endRoom.h - 2);
  if (floor < MAX_FLOOR) {
    map[ey][ex] = T.STAIRS;
  } else {
    map[ey][ex] = T.EXIT;
  }
}

function newFloor() {
  const rooms = generateDungeon();
  const startRoom = rooms[0];
  const endRoom = rooms[rooms.length - 1];
  player.x = startRoom.cx;
  player.y = startRoom.cy;
  spawnEnemies(rooms, startRoom);
  spawnItems(rooms, endRoom);
  computeFOV();
  updateHUD();
  setMessage(`Floor ${floor}. The darkness stirs...`);
}

function startGame() {
  rng = seedRng(Date.now());
  floor = 1;
  gold = 0;
  gameOver = false;
  won = false;
  turnCount = 0;
  player = { x: 0, y: 0, hp: 24, maxHp: 24, atk: 4, potions: 1, keys: 0 };
  overlay.classList.add('hidden');
  newFloor();
  render();
}

function updateHUD() {
  document.getElementById('h-floor').textContent = `Floor ${floor}`;
  document.getElementById('h-hp').textContent = `${player.hp}/${player.maxHp}`;
  document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
  document.getElementById('h-atk').textContent = `ATK ${player.atk}`;
  document.getElementById('h-gold').textContent = `Gold: ${gold}`;
  document.getElementById('h-pots').textContent = `Potions: ${player.potions}`;
  document.getElementById('h-keys').textContent = `Keys: ${player.keys}`;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x * TILE + TILE / 2,
      y: y * TILE + TILE / 2,
      vx: (rng() - 0.5) * 4,
      vy: (rng() - 0.5) * 4 - 1,
      life: randInt(15, 30),
      color
    });
  }
}

function attack(attacker, defender, isPlayer) {
  const dmg = Math.max(1, attacker.atk + randInt(-1, 1));
  defender.hp -= dmg;
  spawnParticles(defender.x, defender.y, isPlayer ? '#ffaa44' : '#cc4444', 6);
  if (defender.hp <= 0) {
    if (!isPlayer) {
      defender.alive = false;
      const g = randInt(2, 8) + floor;
      gold += g;
      setMessage(`${defender.name} slain! +${g} gold`);
      player.atk += defender.name === 'Demon' ? 1 : 0;
      if (player.maxHp < 40) player.maxHp += defender.xp > 10 ? 1 : 0;
    } else {
      gameOver = true;
      showEnd(false);
    }
  } else if (isPlayer) {
    setMessage(`You hit ${defender.name} for ${dmg}. (${defender.hp} HP left)`);
  } else {
    setMessage(`${attacker.name} hits you for ${dmg}!`);
  }
  updateHUD();
}

function moveEnemy(e) {
  if (!e.alive) return;
  if (dist(e, player) === 1) {
    attack(e, player, false);
    return;
  }
  if (dist(e, player) > 10) return;
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]].sort(() => rng() - 0.5);
  let best = null, bestD = dist(e, player);
  for (const [dx, dy] of dirs) {
    const nx = e.x + dx, ny = e.y + dy;
    if (isBlocked(nx, ny) && !(nx === player.x && ny === player.y)) continue;
    const d = Math.abs(nx - player.x) + Math.abs(ny - player.y);
    if (d < bestD) { bestD = d; best = { x: nx, y: ny }; }
  }
  if (best) { e.x = best.x; e.y = best.y; }
}

function tryMove(dx, dy) {
  if (gameOver || won || animating) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return;

  const tile = map[ny][nx];
  if (tile === T.WALL) return;

  if (tile === T.DOOR) {
    if (player.keys > 0) {
      player.keys--;
      map[ny][nx] = T.FLOOR;
      setMessage('You unlock the door.');
      updateHUD();
    } else {
      setMessage('Locked. You need a key.');
      return;
    }
  }

  const foe = enemies.find(e => e.alive && e.x === nx && e.y === ny);
  if (foe) {
    attack(player, foe, true);
    if (!gameOver) enemyTurn();
    computeFOV();
    render();
    return;
  }

  player.x = nx;
  player.y = ny;
  turnCount++;

  const item = items.find(it => it.x === nx && it.y === ny);
  if (item) {
    if (item.type === 'potion') {
      player.potions++;
      setMessage('Found a health potion!');
    } else if (item.type === 'key') {
      player.keys++;
      setMessage('Found a rusty key.');
    } else if (item.type === 'gold') {
      gold += item.amount;
      setMessage(`Found ${item.amount} gold!`);
    }
    items = items.filter(it => it !== item);
    updateHUD();
  }

  if (tile === T.STAIRS) {
    floor++;
    player.hp = Math.min(player.maxHp, player.hp + 4);
    player.atk++;
    setMessage(`Descending to floor ${floor}...`);
    newFloor();
    render();
    return;
  }

  if (tile === T.EXIT) {
    won = true;
    showEnd(true);
    render();
    return;
  }

  enemyTurn();
  computeFOV();
  render();
}

function enemyTurn() {
  const living = enemies.filter(e => e.alive);
  shuffle(living);
  for (const e of living) {
    if (!e.alive || gameOver) continue;
    moveEnemy(e);
    if (gameOver) break;
  }
}

function usePotion() {
  if (gameOver || won) return;
  if (player.potions <= 0) { setMessage('No potions left.'); return; }
  if (player.hp >= player.maxHp) { setMessage('Already at full health.'); return; }
  player.potions--;
  const heal = randInt(8, 14);
  player.hp = Math.min(player.maxHp, player.hp + heal);
  setMessage(`You drink a potion and heal ${heal} HP.`);
  updateHUD();
  enemyTurn();
  computeFOV();
  render();
}

function wait() {
  if (gameOver || won) return;
  setMessage('You wait, listening...');
  enemyTurn();
  computeFOV();
  render();
}

function showEnd(victory) {
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = victory ? 'ESCAPED!' : 'YOU DIED';
  overlay.querySelector('p').innerHTML = victory
    ? `You conquered all ${MAX_FLOOR} floors.<br>Gold collected: ${gold}<br>Turns: ${turnCount}`
    : `Slain on floor ${floor}.<br>Gold collected: ${gold}<br>Turns: ${turnCount}`;
  startBtn.textContent = 'TRY AGAIN';
}

function drawTile(tx, ty, screenX, screenY) {
  const t = map[ty][tx];
  const exp = explored[ty][tx];
  const vis = visible[ty][tx];
  if (!exp) {
    ctx.fillStyle = '#080810';
    ctx.fillRect(screenX, screenY, TILE, TILE);
    return;
  }

  const dim = vis ? 1 : 0.35;
  if (t === T.WALL) {
    ctx.fillStyle = `rgba(30,25,20,${dim})`;
    ctx.fillRect(screenX, screenY, TILE, TILE);
    ctx.fillStyle = `rgba(50,40,30,${dim})`;
    ctx.fillRect(screenX + 2, screenY + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = `rgba(20,15,10,${dim * 0.8})`;
    ctx.fillRect(screenX + 4, screenY + TILE - 6, TILE - 8, 4);
  } else if (t === T.DOOR) {
    ctx.fillStyle = `rgba(40,30,20,${dim})`;
    ctx.fillRect(screenX, screenY, TILE, TILE);
    ctx.fillStyle = `rgba(100,70,30,${dim})`;
    ctx.fillRect(screenX + 4, screenY + 3, TILE - 8, TILE - 6);
    ctx.fillStyle = `rgba(180,140,50,${dim})`;
    ctx.beginPath();
    ctx.arc(screenX + TILE - 7, screenY + TILE / 2, 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (t === T.STAIRS) {
    ctx.fillStyle = `rgba(35,30,25,${dim})`;
    ctx.fillRect(screenX, screenY, TILE, TILE);
    ctx.fillStyle = `rgba(120,100,70,${dim})`;
    for (let s = 0; s < 4; s++) {
      ctx.fillRect(screenX + 3, screenY + 4 + s * 5, TILE - 6, 3);
    }
    if (vis) {
      ctx.fillStyle = '#aa8844';
      ctx.font = '10px monospace';
      ctx.fillText('>', screenX + 8, screenY + 16);
    }
  } else if (t === T.EXIT) {
    ctx.fillStyle = `rgba(35,30,25,${dim})`;
    ctx.fillRect(screenX, screenY, TILE, TILE);
    const pulse = 0.6 + Math.sin(Date.now() / 300) * 0.4;
    ctx.fillStyle = vis ? `rgba(80,200,120,${pulse})` : `rgba(40,80,50,${dim})`;
    ctx.beginPath();
    ctx.arc(screenX + TILE / 2, screenY + TILE / 2, 7, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = `rgba(${Math.floor(35*dim)},${Math.floor(32*dim)},${Math.floor(28*dim)},1)`;
    ctx.fillRect(screenX, screenY, TILE, TILE);
    if ((tx + ty) % 2 === 0) {
      ctx.fillStyle = `rgba(${Math.floor(40*dim)},${Math.floor(36*dim)},${Math.floor(30*dim)},0.5)`;
      ctx.fillRect(screenX, screenY, TILE, TILE);
    }
  }
}

function drawEntity(sx, sy, ch, color, vis) {
  if (!vis) return;
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(ch, sx + TILE / 2 + 1, sy + TILE / 2 + 1);
  ctx.fillStyle = color;
  ctx.fillText(ch, sx + TILE / 2, sy + TILE / 2);
}

function render() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  const camX = player.x - Math.floor(VIEW_W / 2);
  const camY = player.y - Math.floor(VIEW_H / 2);

  for (let vy = 0; vy < VIEW_H; vy++) {
    for (let vx = 0; vx < VIEW_W; vx++) {
      const tx = camX + vx, ty = camY + vy;
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
      drawTile(tx, ty, vx * TILE, vy * TILE);
    }
  }

  for (const it of items) {
    const vx = it.x - camX, vy = it.y - camY;
    if (vx < 0 || vy < 0 || vx >= VIEW_W || vy >= VIEW_H) continue;
    if (!visible[it.y][it.x]) continue;
    drawEntity(vx * TILE, vy * TILE, it.ch, it.color, true);
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const vx = e.x - camX, vy = e.y - camY;
    if (vx < 0 || vy < 0 || vx >= VIEW_W || vy >= VIEW_H) continue;
    const vis = visible[e.y][e.x];
    drawEntity(vx * TILE, vy * TILE, e.ch, e.color, vis);
    if (vis && e.hp < e.maxHp) {
      const bx = vx * TILE + 2, by = vy * TILE + 1;
      ctx.fillStyle = '#300';
      ctx.fillRect(bx, by, TILE - 4, 3);
      ctx.fillStyle = '#c44';
      ctx.fillRect(bx, by, (TILE - 4) * (e.hp / e.maxHp), 3);
    }
  }

  const pvx = player.x - camX, pvy = player.y - camY;
  drawEntity(pvx * TILE, pvy * TILE, '@', '#e8a040', true);

  // Vignette
  const grad = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.3, CANVAS_W/2, CANVAS_H/2, CANVAS_W*0.7);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Particles
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
  }
  ctx.globalAlpha = 1;

  if (messageTimer > 0) messageTimer--;
}

function gameLoop() {
  render();
  requestAnimationFrame(gameLoop);
}

const keys = {};
document.addEventListener('keydown', e => {
  if (keys[e.code]) return;
  keys[e.code] = true;

  if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); tryMove(0, -1); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); tryMove(0, 1); }
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); tryMove(-1, 0); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); tryMove(1, 0); }
  else if (e.code === 'Space') { e.preventDefault(); wait(); }
  else if (e.code === 'KeyQ') { e.preventDefault(); usePotion(); }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

startBtn.addEventListener('click', startGame);
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
