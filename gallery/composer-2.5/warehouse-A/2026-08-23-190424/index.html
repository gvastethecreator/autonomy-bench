<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .stats {
      display: flex;
      gap: 24px;
      font-size: 0.85rem;
    }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: #e94560; }
    .stat-label { color: #8892b0; font-size: 0.7rem; text-transform: uppercase; }
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(22, 33, 62, 0.9);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.8;
      border: 1px solid #0f3460;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <h1>📦 Warehouse Logistics Simulation</h1>
    <div class="stats">
      <div class="stat"><span class="stat-value" id="stat-delivered">0</span><span class="stat-label">Delivered</span></div>
      <div class="stat"><span class="stat-value" id="stat-pending">0</span><span class="stat-label">In Queue</span></div>
      <div class="stat"><span class="stat-value" id="stat-workers">0</span><span class="stat-label">Active Workers</span></div>
      <div class="stat"><span class="stat-value" id="stat-trucks-in">0</span><span class="stat-label">Incoming</span></div>
      <div class="stat"><span class="stat-value" id="stat-trucks-out">0</span><span class="stat-label">Outgoing</span></div>
    </div>
  </header>
  <div id="canvas-wrap">
    <canvas id="sim"></canvas>
    <div class="legend">
      <div><span class="legend-dot" style="background:#4ecca3"></span>Incoming dock</div>
      <div><span class="legend-dot" style="background:#e94560"></span>Outgoing dock</div>
      <div><span class="legend-dot" style="background:#ffd93d"></span>Workers</div>
      <div><span class="legend-dot" style="background:#6c5ce7"></span>Packages</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('sim');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      const wrap = document.getElementById('canvas-wrap');
      W = canvas.width = wrap.clientWidth;
      H = canvas.height = wrap.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Layout zones
    const INCOMING_X = 40;
    const OUTGOING_X = () => W - 140;
    const DOCK_Y_START = 80;
    const DOCK_SPACING = 90;
    const STAGING_X = () => W * 0.38;
    const STAGING_W = () => W * 0.24;

    const COLORS = {
      floor: '#0d1b2a',
      floorGrid: '#1b2838',
      incoming: '#4ecca3',
      outgoing: '#e94560',
      worker: '#ffd93d',
      workerCarrying: '#ff9f43',
      package: '#6c5ce7',
      packageAlt: '#a29bfe',
      truck: '#2d4059',
      truckCab: '#3d5a73',
      shelf: '#415a77',
      text: '#ccd6f6',
      shadow: 'rgba(0,0,0,0.3)'
    };

    let delivered = 0;
    let tick = 0;

    // --- Entities ---

    class Package {
      constructor(id, destZone) {
        this.id = id;
        this.destZone = destZone; // 0-3 outgoing slot
        this.x = 0;
        this.y = 0;
        this.w = 22;
        this.h = 18;
        this.color = Math.random() > 0.5 ? COLORS.package : COLORS.packageAlt;
        this.carried = false;
        this.inStaging = false;
        this.onTruck = null; // 'incoming' | 'outgoing'
        this.truckSlot = 0;
      }
    }

    class Truck {
      constructor(type, slot) {
        this.type = type; // 'incoming' | 'outgoing'
        this.slot = slot;
        this.x = type === 'incoming' ? INCOMING_X : OUTGOING_X();
        this.y = DOCK_Y_START + slot * DOCK_SPACING;
        this.packages = [];
        this.capacity = 6;
        this.state = 'idle'; // idle, loading, unloading, departing, arriving
        this.progress = 0;
        this.timer = 0;
        this.departTimer = 0;
      }

      get dockX() { return this.x + (this.type === 'incoming' ? 90 : 0); }

      update(dt) {
        if (this.type === 'incoming') {
          if (this.state === 'idle' && this.packages.length === 0) {
            this.timer += dt;
            if (this.timer > 120 + Math.random() * 180) {
              this.arrive();
            }
          } else if (this.state === 'unloading') {
            this.progress += dt * 0.015;
            if (this.progress >= 1) {
              this.state = 'idle';
              this.progress = 0;
            }
          } else if (this.state === 'departing') {
            this.departTimer += dt;
            this.x -= dt * 0.4;
            if (this.departTimer > 200) {
              this.reset();
            }
          }
        } else {
          if (this.state === 'idle') {
            this.timer += dt;
            if (this.timer > 200 + Math.random() * 300 && this.packages.length >= this.capacity) {
              this.depart();
            }
          } else if (this.state === 'departing') {
            this.departTimer += dt;
            this.x += dt * 0.5;
            if (this.departTimer > 250) {
              this.reset();
            }
          }
        }
      }

      arrive() {
        this.state = 'unloading';
        this.progress = 0;
        const count = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          const pkg = new Package(nextPkgId++, Math.floor(Math.random() * 4));
          pkg.onTruck = 'incoming';
          pkg.truckSlot = this.slot;
          pkg.x = this.dockX;
          pkg.y = this.y + 20 + (i % 3) * 14;
          this.packages.push(pkg);
          allPackages.push(pkg);
        }
        stats.pending += count;
      }

      depart() {
        this.state = 'departing';
        this.departTimer = 0;
        delivered += this.packages.length;
        stats.pending -= this.packages.length;
        this.packages.forEach(p => {
          const idx = allPackages.indexOf(p);
          if (idx >= 0) allPackages.splice(idx, 1);
        });
        this.packages = [];
      }

      reset() {
        this.state = 'idle';
        this.timer = 0;
        this.departTimer = 0;
        this.x = this.type === 'incoming' ? INCOMING_X : OUTGOING_X();
        this.progress = 0;
      }

      draw() {
        const w = 100, h = 55;
        ctx.save();
        ctx.fillStyle = COLORS.shadow;
        ctx.fillRect(this.x + 4, this.y + h + 2, w, 8);

        // Trailer
        ctx.fillStyle = this.type === 'incoming' ? '#1b4332' : '#4a1942';
        ctx.fillRect(this.x, this.y + 10, w - 20, h - 10);
        ctx.strokeStyle = this.type === 'incoming' ? COLORS.incoming : COLORS.outgoing;
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y + 10, w - 20, h - 10);

        // Cab
        ctx.fillStyle = COLORS.truckCab;
        const cabX = this.type === 'incoming' ? this.x + w - 30 : this.x;
        ctx.fillRect(cabX, this.y + 18, 30, h - 18);
        ctx.strokeStyle = '#555';
        ctx.strokeRect(cabX, this.y + 18, 30, h - 18);

        // Label
        ctx.fillStyle = COLORS.text;
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        const label = this.type === 'incoming' ? 'IN' : 'OUT';
        ctx.fillText(label + ' #' + (this.slot + 1), this.x + w / 2 - 10, this.y + h + 16);

        // Package count
        ctx.fillStyle = this.type === 'incoming' ? COLORS.incoming : COLORS.outgoing;
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(this.packages.length + '/' + this.capacity, this.x + w / 2 - 10, this.y + 8);

        // State indicator
        if (this.state === 'unloading') {
          ctx.fillStyle = 'rgba(78, 204, 163, 0.3)';
          ctx.fillRect(this.x, this.y + 10, (w - 20) * this.progress, h - 10);
        } else if (this.state === 'departing') {
          ctx.globalAlpha = 0.6;
        }

        ctx.restore();
      }
    }

    class Worker {
      constructor(id) {
        this.id = id;
        this.x = STAGING_X() + STAGING_W() / 2;
        this.y = H / 2 + (id - 2) * 35;
        this.targetX = this.x;
        this.targetY = this.y;
        this.speed = 1.2 + Math.random() * 0.4;
        this.state = 'idle'; // idle, toIncoming, pickup, toStaging, toOutgoing, dropoff
        this.carrying = null;
        this.targetTruck = null;
        this.targetPkg = null;
        this.idleTimer = 0;
        this.radius = 12;
      }

      assignTask() {
        if (this.carrying) {
          // Go to outgoing truck matching dest
          const dest = this.carrying.destZone;
          const truck = outgoingTrucks[dest];
          if (truck && truck.state === 'idle' && truck.packages.length < truck.capacity) {
            this.state = 'toOutgoing';
            this.targetTruck = truck;
            this.targetX = truck.dockX - 15;
            this.targetY = truck.y + 30;
            return true;
          }
          // Staging fallback
          this.state = 'toStaging';
          this.targetX = STAGING_X() + 20 + (this.id * 30) % STAGING_W();
          this.targetY = H / 2 - 40 + (this.id * 25) % 80;
          return true;
        }

        // Find package on incoming truck
        for (const truck of incomingTrucks) {
          if (truck.state !== 'idle' && truck.state !== 'unloading') continue;
          const available = truck.packages.filter(p => !p.carried && !p.inStaging);
          if (available.length > 0) {
            const pkg = available[0];
            this.state = 'toIncoming';
            this.targetTruck = truck;
            this.targetPkg = pkg;
            this.targetX = truck.dockX + 10;
            this.targetY = truck.y + 35;
            return true;
          }
        }

        // Pick from staging
        const staged = stagingPackages.filter(p => !p.carried);
        if (staged.length > 0) {
          const pkg = staged[0];
          this.state = 'toStaging';
          this.targetPkg = pkg;
          this.targetX = pkg.x;
          this.targetY = pkg.y;
          return true;
        }

        return false;
      }

      update(dt) {
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (this.state === 'idle') {
          this.idleTimer += dt;
          if (this.idleTimer > 20) {
            this.idleTimer = 0;
            this.assignTask();
          }
          return;
        }

        if (dist > 3) {
          this.x += (dx / dist) * this.speed * dt * 0.08;
          this.y += (dy / dist) * this.speed * dt * 0.08;
        } else {
          this.x = this.targetX;
          this.y = this.targetY;

          if (this.state === 'toIncoming' && this.targetPkg) {
            this.carrying = this.targetPkg;
            this.targetPkg.carried = true;
            this.targetPkg.onTruck = null;
            const truck = this.targetTruck;
            const idx = truck.packages.indexOf(this.targetPkg);
            if (idx >= 0) truck.packages.splice(idx, 1);
            if (truck.packages.length === 0 && truck.state === 'idle') {
              truck.state = 'departing';
              truck.departTimer = 0;
            }
            this.state = 'pickup';
            this.targetPkg = null;
            this.assignTask();
          } else if (this.state === 'toStaging' && this.targetPkg && !this.carrying) {
            this.carrying = this.targetPkg;
            this.targetPkg.carried = true;
            this.targetPkg.inStaging = false;
            const idx = stagingPackages.indexOf(this.targetPkg);
            if (idx >= 0) stagingPackages.splice(idx, 1);
            this.targetPkg = null;
            this.assignTask();
          } else if (this.state === 'toStaging' && this.carrying) {
            this.carrying.inStaging = true;
            this.carrying.carried = false;
            this.carrying.x = this.x;
            this.carrying.y = this.y - 20;
            stagingPackages.push(this.carrying);
            this.carrying = null;
            this.state = 'idle';
          } else if (this.state === 'toOutgoing' && this.carrying && this.targetTruck) {
            const truck = this.targetTruck;
            if (truck.packages.length < truck.capacity) {
              this.carrying.carried = false;
              this.carrying.onTruck = 'outgoing';
              this.carrying.x = truck.dockX + 5 + (truck.packages.length % 3) * 18;
              this.carrying.y = truck.y + 18 + Math.floor(truck.packages.length / 3) * 14;
              truck.packages.push(this.carrying);
              this.carrying = null;
              this.targetTruck = null;
            }
            this.state = 'idle';
          } else if (this.state === 'pickup') {
            this.state = 'idle';
          } else {
            this.state = 'idle';
          }
        }

        if (this.carrying) {
          this.carrying.x = this.x;
          this.carrying.y = this.y - 22;
        }
      }

      draw() {
        ctx.save();
        // Shadow
        ctx.fillStyle = COLORS.shadow;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 14, 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = this.carrying ? COLORS.workerCarrying : COLORS.worker;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c8a415';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Hard hat
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(this.x, this.y - 6, 8, Math.PI, 0);
        ctx.fill();

        // Face direction dot
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(this.x, this.y - 2, 3, 0, Math.PI * 2);
        ctx.fill();

        // ID badge
        ctx.fillStyle = '#fff';
        ctx.font = '8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('W' + this.id, this.x, this.y + 4);

        ctx.restore();
      }
    }

    function drawPackage(pkg) {
      if (pkg.carried) return;
      ctx.save();
      ctx.fillStyle = COLORS.shadow;
      ctx.fillRect(pkg.x + 2, pkg.y + pkg.h, pkg.w - 2, 3);
      ctx.fillStyle = pkg.color;
      ctx.fillRect(pkg.x, pkg.y, pkg.w, pkg.h);
      ctx.strokeStyle = '#4834d4';
      ctx.lineWidth = 1;
      ctx.strokeRect(pkg.x, pkg.y, pkg.w, pkg.h);
      // Tape cross
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.moveTo(pkg.x + pkg.w / 2, pkg.y);
      ctx.lineTo(pkg.x + pkg.w / 2, pkg.y + pkg.h);
      ctx.moveTo(pkg.x, pkg.y + pkg.h / 2);
      ctx.lineTo(pkg.x + pkg.w, pkg.y + pkg.h / 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawEnvironment() {
      // Floor
      ctx.fillStyle = COLORS.floor;
      ctx.fillRect(0, 0, W, H);

      // Grid
      ctx.strokeStyle = COLORS.floorGrid;
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Staging area
      const sx = STAGING_X(), sw = STAGING_W();
      ctx.fillStyle = 'rgba(65, 90, 119, 0.4)';
      ctx.fillRect(sx, H / 2 - 60, sw, 120);
      ctx.strokeStyle = COLORS.shelf;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 4]);
      ctx.strokeRect(sx, H / 2 - 60, sw, 120);
      ctx.setLineDash([]);

      ctx.fillStyle = COLORS.text;
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('STAGING AREA', sx + sw / 2, H / 2 - 68);

      // Conveyor path hints
      ctx.strokeStyle = 'rgba(78, 204, 163, 0.15)';
      ctx.lineWidth = 30;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(INCOMING_X + 100, H / 2);
      ctx.quadraticCurveTo(W * 0.3, H / 2 - 30, STAGING_X(), H / 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(233, 69, 96, 0.15)';
      ctx.beginPath();
      ctx.moveTo(STAGING_X() + sw, H / 2);
      ctx.quadraticCurveTo(W * 0.7, H / 2 + 30, OUTGOING_X(), H / 2);
      ctx.stroke();

      // Zone labels
      ctx.fillStyle = COLORS.incoming;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('INCOMING DOCK', INCOMING_X, 30);

      ctx.fillStyle = COLORS.outgoing;
      ctx.textAlign = 'right';
      ctx.fillText('OUTGOING DOCK', W - 20, 30);
    }

    // --- Init ---
    let nextPkgId = 1;
    const allPackages = [];
    const stagingPackages = [];
    const incomingTrucks = [];
    const outgoingTrucks = [];
    const workers = [];

    for (let i = 0; i < 4; i++) {
      incomingTrucks.push(new Truck('incoming', i));
      outgoingTrucks.push(new Truck('outgoing', i));
    }
    for (let i = 1; i <= 5; i++) {
      workers.push(new Worker(i));
    }

    const stats = {
      pending: 0,
      get delivered() { return delivered; },
      get workersActive() { return workers.filter(w => w.state !== 'idle').length; },
      get trucksIn() { return incomingTrucks.filter(t => t.state !== 'idle' || t.packages.length > 0).length; },
      get trucksOut() { return outgoingTrucks.filter(t => t.packages.length > 0).length; }
    };

    // Stagger initial arrivals
    incomingTrucks[0].timer = 200;
    incomingTrucks[1].timer = 350;
    incomingTrucks[2].timer = 500;

    function updateStats() {
      document.getElementById('stat-delivered').textContent = delivered;
      document.getElementById('stat-pending').textContent = stats.pending;
      document.getElementById('stat-workers').textContent = stats.workersActive;
      document.getElementById('stat-trucks-in').textContent = stats.trucksIn;
      document.getElementById('stat-trucks-out').textContent = stats.trucksOut;
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(now - lastTime, 50);
      lastTime = now;
      tick += dt;

      incomingTrucks.forEach(t => t.update(dt));
      outgoingTrucks.forEach(t => t.update(dt));
      workers.forEach(w => w.update(dt));

      drawEnvironment();
      incomingTrucks.forEach(t => t.draw());
      outgoingTrucks.forEach(t => t.draw());

      allPackages.forEach(drawPackage);
      stagingPackages.forEach(drawPackage);

      workers.forEach(w => w.draw());

      // Carried packages on top
      workers.filter(w => w.carrying).forEach(w => drawPackage(w.carrying));

      if (tick % 30 < dt) updateStats();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
