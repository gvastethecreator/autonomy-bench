<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252936;
      --border: #2e3344;
      --text: #e8eaef;
      --muted: #8b92a5;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 8px;
      --toolbar-w: 280px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--border); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.danger { border-color: var(--danger); color: var(--danger); }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: var(--toolbar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tool-btn svg { width: 20px; height: 20px; }
    .tool-btn:hover { color: var(--text); border-color: var(--accent); }
    .tool-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .control-row:last-child { margin-bottom: 0; }

    .control-row label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .control-row label span { color: var(--text); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      padding: 2px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-row .btn { flex: 1; justify-content: center; min-width: 0; padding: 7px 8px; font-size: 12px; }

    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: #0a0c10;
      background-image:
        linear-gradient(45deg, #14161c 25%, transparent 25%),
        linear-gradient(-45deg, #14161c 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #14161c 75%),
        linear-gradient(-45deg, transparent 75%, #14161c 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      position: relative;
    }

    .canvas-wrap {
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      line-height: 0;
    }

    #canvas, #overlay {
      display: block;
      cursor: crosshair;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .drop-zone {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      background: rgba(99, 102, 241, 0.1);
      border: 2px dashed var(--accent);
      z-index: 10;
    }

    .drop-zone.visible { opacity: 1; pointer-events: all; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }

    .empty-state svg { width: 64px; height: 64px; opacity: 0.4; }
    .empty-state p { font-size: 14px; max-width: 280px; line-height: 1.5; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-bar span { color: var(--text); }

    .crop-rect {
      position: absolute;
      border: 2px dashed #fff;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
      pointer-events: none;
      display: none;
    }

    .filter-preview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .filter-btn {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); }

    #file-input { display: none; }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .zoom-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-controls button:hover { background: var(--border); }
    .zoom-controls span { min-width: 48px; text-align: center; font-size: 12px; color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>Image Editor</h1>
    <button class="btn" id="btn-open" title="Open image">Open</button>
    <button class="btn" id="btn-undo" disabled title="Undo">Undo</button>
    <button class="btn" id="btn-redo" disabled title="Redo">Redo</button>
    <button class="btn" id="btn-reset" disabled title="Reset">Reset</button>
    <button class="btn primary" id="btn-export" disabled title="Export">Export PNG</button>
    <input type="file" id="file-input" accept="image/*">
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Tools</div>
        <div class="tool-grid">
          <button class="tool-btn active" data-tool="select" title="Select / Pan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
            Select
          </button>
          <button class="tool-btn" data-tool="brush" title="Brush">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3z"/><path d="M9 8 5 12l7 7 4-4"/></svg>
            Brush
          </button>
          <button class="tool-btn" data-tool="eraser" title="Eraser">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            Eraser
          </button>
          <button class="tool-btn" data-tool="crop" title="Crop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
            Crop
          </button>
          <button class="tool-btn" data-tool="text" title="Text">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            Text
          </button>
          <button class="tool-btn" data-tool="picker" title="Color Picker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
            Picker
          </button>
        </div>
      </div>

      <div class="panel" id="brush-panel">
        <div class="panel-title">Brush Settings</div>
        <div class="control-row">
          <label>Color <span id="color-val">#ff0000</span></label>
          <input type="color" id="brush-color" value="#ff0000">
        </div>
        <div class="control-row">
          <label>Size <span id="size-val">8</span>px</label>
          <input type="range" id="brush-size" min="1" max="100" value="8">
        </div>
        <div class="control-row">
          <label>Opacity <span id="opacity-val">100</span>%</label>
          <input type="range" id="brush-opacity" min="1" max="100" value="100">
        </div>
      </div>

      <div class="panel" id="text-panel" style="display:none">
        <div class="panel-title">Text Settings</div>
        <div class="control-row">
          <label>Text</label>
          <input type="text" id="text-input" placeholder="Enter text..." value="Hello">
        </div>
        <div class="control-row">
          <label>Font Size <span id="font-size-val">32</span>px</label>
          <input type="range" id="font-size" min="12" max="120" value="32">
        </div>
        <div class="control-row">
          <label>Color</label>
          <input type="color" id="text-color" value="#ffffff">
        </div>
        <div class="control-row">
          <label>Font</label>
          <select id="font-family">
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Courier New">Courier New</option>
            <option value="Impact">Impact</option>
            <option value="Times New Roman">Times New Roman</option>
          </select>
        </div>
        <button class="btn primary" id="btn-add-text" style="width:100%;margin-top:8px">Click canvas to place</button>
      </div>

      <div class="panel">
        <div class="panel-title">Adjustments</div>
        <div class="control-row">
          <label>Brightness <span id="brightness-val">0</span></label>
          <input type="range" id="brightness" min="-100" max="100" value="0">
        </div>
        <div class="control-row">
          <label>Contrast <span id="contrast-val">0</span></label>
          <input type="range" id="contrast" min="-100" max="100" value="0">
        </div>
        <div class="control-row">
          <label>Saturation <span id="saturation-val">0</span></label>
          <input type="range" id="saturation" min="-100" max="100" value="0">
        </div>
        <div class="control-row">
          <label>Blur <span id="blur-val">0</span>px</label>
          <input type="range" id="blur" min="0" max="20" value="0">
        </div>
        <button class="btn" id="btn-apply-adjust" style="width:100%;margin-top:4px">Apply Adjustments</button>
      </div>

      <div class="panel">
        <div class="panel-title">Filters</div>
        <div class="filter-preview">
          <button class="filter-btn" data-filter="none">Original</button>
          <button class="filter-btn" data-filter="grayscale">Grayscale</button>
          <button class="filter-btn" data-filter="sepia">Sepia</button>
          <button class="filter-btn" data-filter="invert">Invert</button>
          <button class="filter-btn" data-filter="vintage">Vintage</button>
          <button class="filter-btn" data-filter="cool">Cool</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Transform</div>
        <div class="btn-row">
          <button class="btn" id="btn-rotate-left">↺ 90°</button>
          <button class="btn" id="btn-rotate-right">↻ 90°</button>
        </div>
        <div class="btn-row" style="margin-top:6px">
          <button class="btn" id="btn-flip-h">Flip H</button>
          <button class="btn" id="btn-flip-v">Flip V</button>
        </div>
        <div class="btn-row" style="margin-top:6px">
          <button class="btn" id="btn-resize">Resize 50%</button>
          <button class="btn" id="btn-resize-up">Resize 200%</button>
        </div>
      </div>
    </aside>

    <div class="canvas-area" id="canvas-area">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        <p>Drop an image here or click <strong>Open</strong> to start editing</p>
        <button class="btn primary" id="btn-open-empty">Open Image</button>
      </div>
      <div class="canvas-wrap" id="canvas-wrap" style="display:none">
        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>
        <div class="crop-rect" id="crop-rect"></div>
      </div>
      <div class="drop-zone" id="drop-zone">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span style="color:var(--accent);font-size:14px">Drop image to open</span>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div>Size: <span id="status-size">—</span></div>
    <div>Tool: <span id="status-tool">Select</span></div>
    <div>Cursor: <span id="status-cursor">—</span></div>
    <div class="zoom-controls">
      <button id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit to view" style="width:auto;padding:0 8px;font-size:11px">Fit</button>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const overlay = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const octx = overlay.getContext('2d');
      const canvasWrap = document.getElementById('canvas-wrap');
      const emptyState = document.getElementById('empty-state');
      const cropRect = document.getElementById('crop-rect');
      const fileInput = document.getElementById('file-input');
      const dropZone = document.getElementById('drop-zone');
      const canvasArea = document.getElementById('canvas-area');

      let originalImage = null;
      let currentTool = 'select';
      let isDrawing = false;
      let lastX = 0, lastY = 0;
      let zoom = 1;
      let history = [];
      let historyIndex = -1;
      let cropStart = null;
      let cropEnd = null;
      let textPlacing = false;
      let adjustments = { brightness: 0, contrast: 0, saturation: 0, blur: 0 };

      const $ = id => document.getElementById(id);

      function setEnabled(enabled) {
        ['btn-undo', 'btn-redo', 'btn-reset', 'btn-export'].forEach(id => {
          $(id).disabled = !enabled;
        });
      }

      function updateStatus() {
        if (originalImage) {
          $('status-size').textContent = canvas.width + ' × ' + canvas.height;
        }
        $('status-tool').textContent = currentTool.charAt(0).toUpperCase() + currentTool.slice(1);
        $('zoom-label').textContent = Math.round(zoom * 100) + '%';
      }

      function saveState() {
        history = history.slice(0, historyIndex + 1);
        history.push(canvas.toDataURL('image/png'));
        historyIndex = history.length - 1;
        if (history.length > 30) {
          history.shift();
          historyIndex--;
        }
        $('btn-undo').disabled = historyIndex <= 0;
        $('btn-redo').disabled = historyIndex >= history.length - 1;
      }

      function restoreState(index) {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          overlay.width = img.width;
          overlay.height = img.height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          applyZoom();
          updateStatus();
        };
        img.src = history[index];
        historyIndex = index;
        $('btn-undo').disabled = historyIndex <= 0;
        $('btn-redo').disabled = historyIndex >= history.length - 1;
      }

      function loadImage(src) {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            const scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          canvas.width = w;
          canvas.height = h;
          overlay.width = w;
          overlay.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          emptyState.style.display = 'none';
          canvasWrap.style.display = 'block';
          setEnabled(true);
          history = [];
          historyIndex = -1;
          saveState();
          resetAdjustments(false);
          applyZoom();
          updateStatus();
        };
        img.src = src;
      }

      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }

      function applyZoom() {
        canvas.style.width = (canvas.width * zoom) + 'px';
        canvas.style.height = (canvas.height * zoom) + 'px';
        overlay.style.width = canvas.style.width;
        overlay.style.height = canvas.style.height;
        updateStatus();
      }

      function resetAdjustments(updateUI) {
        adjustments = { brightness: 0, contrast: 0, saturation: 0, blur: 0 };
        if (updateUI !== false) {
          ['brightness', 'contrast', 'saturation', 'blur'].forEach(k => {
            const el = $(k);
            if (el) { el.value = k === 'blur' ? 0 : 0; $(k + '-val').textContent = '0'; }
          });
        }
      }

      function applyAdjustmentsToCanvas() {
        const { brightness, contrast, saturation, blur } = adjustments;
        if (brightness === 0 && contrast === 0 && saturation === 0 && blur === 0) return;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tctx = tempCanvas.getContext('2d');
        tctx.drawImage(canvas, 0, 0);

        const imageData = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imageData.data;
        const bFactor = brightness * 2.55;
        const cFactor = (259 * (contrast + 255)) / (255 * (259 - contrast));
        const satFactor = 1 + saturation / 100;

        for (let i = 0; i < data.length; i += 4) {
          let r = data[i], g = data[i + 1], b = data[i + 2];

          if (satFactor !== 1) {
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            r = gray + satFactor * (r - gray);
            g = gray + satFactor * (g - gray);
            b = gray + satFactor * (b - gray);
          }

          r = cFactor * (r - 128) + 128 + bFactor;
          g = cFactor * (g - 128) + 128 + bFactor;
          b = cFactor * (b - 128) + 128 + bFactor;

          data[i] = Math.max(0, Math.min(255, r));
          data[i + 1] = Math.max(0, Math.min(255, g));
          data[i + 2] = Math.max(0, Math.min(255, b));
        }

        tctx.putImageData(imageData, 0, 0);

        if (blur > 0) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.filter = `blur(${blur}px)`;
          ctx.drawImage(tempCanvas, 0, 0);
          ctx.filter = 'none';
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(tempCanvas, 0, 0);
        }

        resetAdjustments(true);
        saveState();
      }

      function applyFilter(filter) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tctx = tempCanvas.getContext('2d');
        tctx.drawImage(canvas, 0, 0);
        const imageData = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          let r = data[i], g = data[i + 1], b = data[i + 2];

          switch (filter) {
            case 'grayscale': {
              const gray = 0.299 * r + 0.587 * g + 0.114 * b;
              data[i] = data[i + 1] = data[i + 2] = gray;
              break;
            }
            case 'sepia':
              data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
              data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
              data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
              break;
            case 'invert':
              data[i] = 255 - r;
              data[i + 1] = 255 - g;
              data[i + 2] = 255 - b;
              break;
            case 'vintage':
              data[i] = Math.min(255, r * 1.1 + 20);
              data[i + 1] = Math.min(255, g * 0.95 + 10);
              data[i + 2] = Math.min(255, b * 0.8);
              break;
            case 'cool':
              data[i] = Math.max(0, r * 0.9);
              data[i + 1] = Math.min(255, g * 1.05);
              data[i + 2] = Math.min(255, b * 1.2 + 10);
              break;
          }
        }

        tctx.putImageData(imageData, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 0, 0);
        saveState();
      }

      function rotateCanvas(degrees) {
        const tempCanvas = document.createElement('canvas');
        const rad = degrees * Math.PI / 180;
        const sin = Math.abs(Math.sin(rad));
        const cos = Math.abs(Math.cos(rad));
        tempCanvas.width = canvas.width * cos + canvas.height * sin;
        tempCanvas.height = canvas.width * sin + canvas.height * cos;
        const tctx = tempCanvas.getContext('2d');
        tctx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
        tctx.rotate(rad);
        tctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
        canvas.width = tempCanvas.width;
        canvas.height = tempCanvas.height;
        overlay.width = canvas.width;
        overlay.height = canvas.height;
        ctx.drawImage(tempCanvas, 0, 0);
        saveState();
        applyZoom();
      }

      function flipCanvas(direction) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tctx = tempCanvas.getContext('2d');
        if (direction === 'h') {
          tctx.translate(canvas.width, 0);
          tctx.scale(-1, 1);
        } else {
          tctx.translate(0, canvas.height);
          tctx.scale(1, -1);
        }
        tctx.drawImage(canvas, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 0, 0);
        saveState();
      }

      function resizeCanvas(factor) {
        const newW = Math.round(canvas.width * factor);
        const newH = Math.round(canvas.height * factor);
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = newW;
        tempCanvas.height = newH;
        const tctx = tempCanvas.getContext('2d');
        tctx.drawImage(canvas, 0, 0, newW, newH);
        canvas.width = newW;
        canvas.height = newH;
        overlay.width = newW;
        overlay.height = newH;
        ctx.drawImage(tempCanvas, 0, 0);
        saveState();
        applyZoom();
      }

      function applyCrop() {
        if (!cropStart || !cropEnd) return;
        const x = Math.min(cropStart.x, cropEnd.x);
        const y = Math.min(cropStart.y, cropEnd.y);
        const w = Math.abs(cropEnd.x - cropStart.x);
        const h = Math.abs(cropEnd.y - cropStart.y);
        if (w < 5 || h < 5) return;

        const imageData = ctx.getImageData(x, y, w, h);
        canvas.width = w;
        canvas.height = h;
        overlay.width = w;
        overlay.height = h;
        ctx.putImageData(imageData, 0, 0);
        cropRect.style.display = 'none';
        cropStart = cropEnd = null;
        saveState();
        applyZoom();
      }

      function updateCropRect() {
        if (!cropStart || !cropEnd) return;
        const rect = canvas.getBoundingClientRect();
        const wrapRect = canvasWrap.getBoundingClientRect();
        const scaleX = rect.width / canvas.width;
        const scaleY = rect.height / canvas.height;
        const x = Math.min(cropStart.x, cropEnd.x) * scaleX + rect.left - wrapRect.left;
        const y = Math.min(cropStart.y, cropEnd.y) * scaleY + rect.top - wrapRect.top;
        const w = Math.abs(cropEnd.x - cropStart.x) * scaleX;
        const h = Math.abs(cropEnd.y - cropStart.y) * scaleY;
        cropRect.style.display = 'block';
        cropRect.style.left = x + 'px';
        cropRect.style.top = y + 'px';
        cropRect.style.width = w + 'px';
        cropRect.style.height = h + 'px';
      }

      function draw(e) {
        if (!isDrawing) return;
        const { x, y } = getCanvasCoords(e);
        const size = parseInt($('brush-size').value);
        const color = $('brush-color').value;
        const opacity = parseInt($('brush-opacity').value) / 100;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = size;

        if (currentTool === 'brush') {
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (currentTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = size;
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.globalCompositeOperation = 'source-over';
        }

        lastX = x;
        lastY = y;
      }

      function placeText(x, y) {
        const text = $('text-input').value;
        if (!text) return;
        const fontSize = parseInt($('font-size').value);
        const fontFamily = $('font-family').value;
        const color = $('text-color').value;
        ctx.font = `${fontSize}px ${fontFamily}`;
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        saveState();
        textPlacing = false;
      }

      // Tool selection
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTool = btn.dataset.tool;
          canvas.style.cursor = currentTool === 'picker' ? 'copy' : currentTool === 'text' ? 'text' : 'crosshair';
          $('brush-panel').style.display = (currentTool === 'brush' || currentTool === 'eraser') ? 'block' : 'none';
          $('text-panel').style.display = currentTool === 'text' ? 'block' : 'none';
          if (currentTool === 'text') textPlacing = true;
          cropRect.style.display = 'none';
          cropStart = cropEnd = null;
          updateStatus();
        });
      });

      // Canvas events
      canvas.addEventListener('mousedown', e => {
        if (!originalImage) return;
        const { x, y } = getCanvasCoords(e);
        lastX = x; lastY = y;

        if (currentTool === 'brush' || currentTool === 'eraser') {
          isDrawing = true;
        } else if (currentTool === 'crop') {
          cropStart = { x, y };
          cropEnd = { x, y };
        } else if (currentTool === 'text' && textPlacing) {
          placeText(x, y);
        } else if (currentTool === 'picker') {
          const pixel = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
          const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, '0')).join('');
          $('brush-color').value = hex;
          $('color-val').textContent = hex;
        }
      });

      canvas.addEventListener('mousemove', e => {
        const { x, y } = getCanvasCoords(e);
        $('status-cursor').textContent = Math.round(x) + ', ' + Math.round(y);
        if (currentTool === 'crop' && cropStart) {
          cropEnd = { x, y };
          updateCropRect();
        }
        draw(e);
      });

      canvas.addEventListener('mouseup', () => {
        if (isDrawing) {
          isDrawing = false;
          saveState();
        }
        if (currentTool === 'crop' && cropStart && cropEnd) {
          applyCrop();
        }
      });

      canvas.addEventListener('mouseleave', () => {
        if (isDrawing) {
          isDrawing = false;
          saveState();
        }
      });

      // File handling
      function openFile() { fileInput.click(); }

      $('btn-open').addEventListener('click', openFile);
      $('btn-open-empty').addEventListener('click', openFile);

      fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => loadImage(ev.target.result);
          reader.readAsDataURL(file);
        }
        fileInput.value = '';
      });

      // Drag and drop
      canvasArea.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('visible');
      });

      canvasArea.addEventListener('dragleave', e => {
        if (!canvasArea.contains(e.relatedTarget)) {
          dropZone.classList.remove('visible');
        }
      });

      canvasArea.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('visible');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = ev => loadImage(ev.target.result);
          reader.readAsDataURL(file);
        }
      });

      // Header buttons
      $('btn-undo').addEventListener('click', () => {
        if (historyIndex > 0) restoreState(historyIndex - 1);
      });

      $('btn-redo').addEventListener('click', () => {
        if (historyIndex < history.length - 1) restoreState(historyIndex + 1);
      });

      $('btn-reset').addEventListener('click', () => {
        if (originalImage && confirm('Reset all edits?')) {
          loadImage(originalImage.src);
        }
      });

      $('btn-export').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'edited-image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      // Adjustments
      ['brightness', 'contrast', 'saturation', 'blur'].forEach(key => {
        $(key).addEventListener('input', e => {
          adjustments[key] = parseInt(e.target.value);
          $(key + '-val').textContent = e.target.value;
        });
      });

      $('btn-apply-adjust').addEventListener('click', applyAdjustmentsToCanvas);

      // Filters
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (btn.dataset.filter !== 'none') {
            applyFilter(btn.dataset.filter);
          }
        });
      });

      // Transform
      $('btn-rotate-left').addEventListener('click', () => rotateCanvas(-90));
      $('btn-rotate-right').addEventListener('click', () => rotateCanvas(90));
      $('btn-flip-h').addEventListener('click', () => flipCanvas('h'));
      $('btn-flip-v').addEventListener('click', () => flipCanvas('v'));
      $('btn-resize').addEventListener('click', () => resizeCanvas(0.5));
      $('btn-resize-up').addEventListener('click', () => resizeCanvas(2));

      // Brush controls
      $('brush-color').addEventListener('input', e => {
        $('color-val').textContent = e.target.value;
      });
      $('brush-size').addEventListener('input', e => {
        $('size-val').textContent = e.target.value;
      });
      $('brush-opacity').addEventListener('input', e => {
        $('opacity-val').textContent = e.target.value;
      });
      $('font-size').addEventListener('input', e => {
        $('font-size-val').textContent = e.target.value;
      });

      $('btn-add-text').addEventListener('click', () => { textPlacing = true; });

      // Zoom
      $('zoom-in').addEventListener('click', () => {
        zoom = Math.min(4, zoom + 0.25);
        applyZoom();
      });
      $('zoom-out').addEventListener('click', () => {
        zoom = Math.max(0.25, zoom - 0.25);
        applyZoom();
      });
      $('zoom-fit').addEventListener('click', () => {
        if (!canvas.width) return;
        const area = canvasArea.getBoundingClientRect();
        const scaleX = (area.width - 40) / canvas.width;
        const scaleY = (area.height - 40) / canvas.height;
        zoom = Math.min(1, Math.min(scaleX, scaleY));
        applyZoom();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === 'z') { e.preventDefault(); $('btn-undo').click(); }
          if (e.key === 'y') { e.preventDefault(); $('btn-redo').click(); }
          if (e.key === 's') { e.preventDefault(); $('btn-export').click(); }
          if (e.key === 'o') { e.preventDefault(); openFile(); }
        }
      });

      updateStatus();
    })();
  </script>
</body>
</html>
