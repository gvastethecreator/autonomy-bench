<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Colorful Fluid Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a12;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font: 13px/1.4 'Segoe UI', system-ui, sans-serif;
    pointer-events: none;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    transition: opacity 1.2s ease;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">Move mouse or touch to paint fluid</div>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('canvas');
  const hint = document.getElementById('hint');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false });

  if (!gl) {
    document.body.innerHTML = '<p style="color:#fff;padding:2rem;font-family:sans-serif">WebGL2 required.</p>';
    return;
  }

  const isMobile = /Mobi|Android/i.test(navigator.userAgent);
  let SIM_RES = isMobile ? 128 : 256;
  let DYE_RES = isMobile ? 512 : 1024;

  const config = {
    SIM_RES,
    DYE_RES,
    DENSITY_DISSIPATION: 0.97,
    VELOCITY_DISSIPATION: 0.98,
    PRESSURE_ITERATIONS: 20,
    CURL: 30,
    SPLAT_RADIUS: 0.25,
    SPLAT_FORCE: 6000,
    SHADING: true,
    COLORFUL: true,
    PAUSED: false,
    TRANSPARENT: false,
    BLOOM: true,
    BLOOM_ITERATIONS: 8,
    BLOOM_RESOLUTION: 256,
    BLOOM_INTENSITY: 0.8,
    BLOOM_THRESHOLD: 0.6,
    SUNRAYS: true,
    SUNRAYS_RESOLUTION: 196,
    SUNRAYS_WEIGHT: 1.0,
  };

  function pointerPrototype() {
    this.id = -1;
    this.texcoordX = 0;
    this.texcoordY = 0;
    this.prevTexcoordX = 0;
    this.prevTexcoordY = 0;
    this.deltaX = 0;
    this.deltaY = 0;
    this.down = false;
    this.moved = false;
    this.color = [30, 0, 300];
  }

  const pointers = [];
  const splatStack = [];
  pointers.push(new pointerPrototype());

  let bloomFramebuffers = [];
  let sunraysFramebuffers = [];
  let dye, velocity, divergence, curl, pressure;
  let bloom, bloomBlur, sunrays, sunraysTemp;
  let displayMaterial, blurMaterial, copyMaterial, clearMaterial;
  let splatMaterial, advectionMaterial, divergenceMaterial, curlMaterial;
  let vorticityMaterial, pressureMaterial, gradientSubtractMaterial;
  let bloomPrefilterMaterial, bloomBlurMaterial, bloomFinalMaterial;
  let sunraysMaskMaterial, sunraysMaterial, displayShadingMaterial;

  const ext = {
    formatRGBA: getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT),
    formatRG: getSupportedFormat(gl, gl.RG16F, gl.RG, gl.HALF_FLOAT),
    formatR: getSupportedFormat(gl, gl.R16F, gl.RED, gl.HALF_FLOAT),
    halfFloatTexType: gl.HALF_FLOAT,
    supportLinearFiltering: gl.getExtension('OES_texture_float_linear'),
  };

  gl.getExtension('EXT_color_buffer_float');
  config.DYE_RES = getResolution(config.DYE_RES);
  config.SIM_RES = getResolution(config.SIM_RES);

  function getResolution(resolution) {
    let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspectRatio < 1) aspectRatio = 1 / aspectRatio;
    const min = Math.round(resolution);
    const max = Math.round(resolution * aspectRatio);
    return gl.drawingBufferWidth > gl.drawingBufferHeight
      ? { width: max, height: min }
      : { width: min, height: max };
  }

  function getSupportedFormat(gl, internalFormat, format, type) {
    if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
      switch (internalFormat) {
        case gl.R16F: return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
        case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
        default: return null;
      }
    }
    return { internalFormat, format };
  }

  function supportRenderTextureFormat(gl, internalFormat, format, type) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    return status === gl.FRAMEBUFFER_COMPLETE;
  }

  class Material {
    constructor(vertexShader, fragmentShaderSource) {
      this.vertexShader = vertexShader;
      this.fragmentShaderSource = fragmentShaderSource;
      this.programs = [];
      this.activeProgram = null;
      this.uniforms = [];
    }
    setKeywords(keywords) {
      let hash = 0;
      for (let i = 0; i < keywords.length; i++) hash += hashCode(keywords[i]);
      let program = this.programs[hash];
      if (program == null) {
        const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, this.fragmentShaderSource, keywords);
        program = createProgram(this.vertexShader, fragmentShader);
        this.programs[hash] = program;
      }
      if (program === this.activeProgram) return;
      this.uniforms = getUniforms(program);
      this.activeProgram = program;
    }
    bind() { gl.useProgram(this.activeProgram); }
  }

  class Program {
    constructor(vertexShader, fragmentShader) {
      this.uniforms = {};
      this.program = createProgram(vertexShader, fragmentShader);
      this.uniforms = getUniforms(this.program);
    }
    bind() { gl.useProgram(this.program); }
  }

  class FBO {
    constructor(w, h, internalFormat, format, type, param) {
      this.texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
      this.fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.texture, 0);
      gl.viewport(0, 0, w, h);
      gl.clear(gl.COLOR_BUFFER_BIT);
      this.width = w;
      this.height = h;
      this.texelSizeX = 1 / w;
      this.texelSizeY = 1 / h;
    }
    attach(id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, this.texture);
      return id;
    }
  }

  class DoubleFBO {
    constructor(w, h, internalFormat, format, type, param) {
      this.width = w;
      this.height = h;
      this.texelSizeX = 1 / w;
      this.texelSizeY = 1 / h;
      this.read = new FBO(w, h, internalFormat, format, type, param);
      this.write = new FBO(w, h, internalFormat, format, type, param);
    }
    swap() { const t = this.read; this.read = this.write; this.write = t; }
  }

  function createFBO(w, h, internalFormat, format, type, param) {
    return new FBO(w, h, internalFormat, format, type, param);
  }

  function createDoubleFBO(w, h, internalFormat, format, type, param) {
    return new DoubleFBO(w, h, internalFormat, format, type, param);
  }

  function compileShader(gl, type, source, keywords) {
    source = addKeywords(source, keywords);
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
      console.error(gl.getShaderInfoLog(shader));
    return shader;
  }

  function addKeywords(source, keywords) {
    if (!keywords) return source;
    let s = '';
    keywords.forEach(k => { s += '#define ' + k + '\n'; });
    return s + source;
  }

  function createProgram(vs, fs) {
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
      console.error(gl.getProgramInfoLog(program));
    return program;
  }

  function getUniforms(program) {
    const uniforms = {};
    const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(program, i);
      uniforms[info.name] = gl.getUniformLocation(program, info.name);
    }
    return uniforms;
  }

  function blit(target, clear = false) {
    if (target == null) {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    if (clear) {
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
  }

  const baseVertexShader = compileShader(gl, gl.VERTEX_SHADER, `
    precision highp float;
    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform vec2 texelSize;
    void main () {
      vUv = aPosition * 0.5 + 0.5;
      vL = vUv - vec2(texelSize.x, 0.0);
      vR = vUv + vec2(texelSize.x, 0.0);
      vT = vUv + vec2(0.0, texelSize.y);
      vB = vUv - vec2(0.0, texelSize.y);
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `);

  const copyShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    void main () { gl_FragColor = texture2D(uTexture, vUv); }
  `);

  const clearShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    uniform float value;
    void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
  `);

  const displayShaderSource = `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uTexture;
    uniform sampler2D uDithering;
    uniform vec2 ditherScale;
    uniform vec2 texelSize;
    void main () {
      vec3 c = texture2D(uTexture, vUv).rgb;
      #ifdef SHADING
        vec3 lc = texture2D(uTexture, vL).rgb;
        vec3 rc = texture2D(uTexture, vR).rgb;
        vec3 tc = texture2D(uTexture, vT).rgb;
        vec3 bc = texture2D(uTexture, vB).rgb;
        float dx = length(rc) - length(lc);
        float dy = length(tc) - length(bc);
        vec3 n = normalize(vec3(dx, dy, length(texelSize)));
        vec3 l = vec3(0.0, 0.0, 1.0);
        float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
        c *= diffuse;
      #endif
      float a = max(c.r, max(c.g, c.b));
      gl_FragColor = vec4(c, a);
    }
  `;

  const splatShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;
    void main () {
      vec2 p = vUv - point.xy;
      p.x *= aspectRatio;
      vec3 splat = exp(-dot(p, p) / radius) * color;
      vec3 base = texture2D(uTarget, vUv).xyz;
      gl_FragColor = vec4(base + splat, 1.0);
    }
  `);

  const advectionShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 dyeTexelSize;
    uniform float dt;
    uniform float dissipation;
    vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
      vec2 st = uv / tsize - 0.5;
      vec2 iuv = floor(st);
      vec2 fuv = fract(st);
      vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
      vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
      vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
      vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
      return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
    }
    void main () {
      #ifdef MANUAL_FILTERING
        vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
        vec4 result = bilerp(uSource, coord, dyeTexelSize);
      #else
        vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
        vec4 result = texture2D(uSource, coord);
      #endif
      float decay = 1.0 + dissipation * dt;
      gl_FragColor = result / decay;
    }
  `);

  const divergenceShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uVelocity, vL).x;
      float R = texture2D(uVelocity, vR).x;
      float T = texture2D(uVelocity, vT).y;
      float B = texture2D(uVelocity, vB).y;
      vec2 C = texture2D(uVelocity, vUv).xy;
      if (vL.x < 0.0) { L = -C.x; }
      if (vR.x > 1.0) { R = -C.x; }
      if (vT.y > 1.0) { T = -C.y; }
      if (vB.y < 0.0) { B = -C.y; }
      float div = 0.5 * (R - L + T - B);
      gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }
  `);

  const curlShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uVelocity, vL).y;
      float R = texture2D(uVelocity, vR).y;
      float T = texture2D(uVelocity, vT).x;
      float B = texture2D(uVelocity, vB).x;
      float vorticity = R - L - T + B;
      gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }
  `);

  const vorticityShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;
    void main () {
      float L = texture2D(uCurl, vL).x;
      float R = texture2D(uCurl, vR).x;
      float T = texture2D(uCurl, vT).x;
      float B = texture2D(uCurl, vB).x;
      float C = texture2D(uCurl, vUv).x;
      vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      force /= length(force) + 0.0001;
      force *= curl * C;
      force.y *= -1.0;
      vec2 velocity = texture2D(uVelocity, vUv).xy;
      velocity += force * dt;
      velocity = min(max(velocity, -1000.0), 1000.0);
      gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
  `);

  const pressureShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uDivergence;
    void main () {
      float L = texture2D(uPressure, vL).x;
      float R = texture2D(uPressure, vR).x;
      float T = texture2D(uPressure, vT).x;
      float B = texture2D(uPressure, vB).x;
      float C = texture2D(uDivergence, vUv).x;
      float pressure = (L + R + B + T - C) * 0.25;
      gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }
  `);

  const gradientSubtractShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uPressure, vL).x;
      float R = texture2D(uPressure, vR).x;
      float T = texture2D(uPressure, vT).x;
      float B = texture2D(uPressure, vB).x;
      vec2 velocity = texture2D(uVelocity, vUv).xy;
      velocity.xy -= vec2(R - L, T - B);
      gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
  `);

  const bloomPrefilterShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTexture;
    uniform vec3 curve;
    uniform float threshold;
    void main () {
      vec3 c = texture2D(uTexture, vUv).rgb;
      float br = max(c.r, max(c.g, c.b));
      float rq = clamp(br - curve.x, 0.0, curve.y);
      rq = curve.z * rq * rq;
      c *= max(rq, br - threshold) / max(br, 0.0001);
      gl_FragColor = vec4(c, 0.0);
    }
  `);

  const bloomBlurShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uTexture;
    void main () {
      vec4 sum = vec4(0.0);
      sum += texture2D(uTexture, vL);
      sum += texture2D(uTexture, vR);
      sum += texture2D(uTexture, vT);
      sum += texture2D(uTexture, vB);
      sum *= 0.25;
      gl_FragColor = sum;
    }
  `);

  const bloomFinalShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;
    precision mediump sampler2D;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uTexture;
    uniform float intensity;
    void main () {
      vec4 sum = vec4(0.0);
      sum += texture2D(uTexture, vL);
      sum += texture2D(uTexture, vR);
      sum += texture2D(uTexture, vT);
      sum += texture2D(uTexture, vB);
      sum *= 0.25;
      gl_FragColor = sum * intensity;
    }
  `);

  const sunraysMaskShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTexture;
    void main () {
      vec4 c = texture2D(uTexture, vUv);
      float br = max(c.r, max(c.g, c.b));
      c.a = clamp(mix(0.0, 1.0, br * 20.0), 0.0, 1.0);
      gl_FragColor = c;
    }
  `);

  const sunraysShader = compileShader(gl, gl.FRAGMENT_SHADER, `
    precision highp float;
    precision highp sampler2D;
    varying vec2 vUv;
    uniform sampler2D uTexture;
    uniform float weight;
    #define ITERATIONS 16
    void main () {
      float Density = 0.3;
      float Decay = 0.95;
      float Exposure = 0.7;
      vec2 coord = vUv;
      vec2 dir = vUv - 0.5;
      dir *= 1.0 / float(ITERATIONS) * Density;
      float illuminationDecay = 1.0;
      float color = texture2D(uTexture, vUv).a;
      for (int i = 0; i < ITERATIONS; i++) {
        coord -= dir;
        float col = texture2D(uTexture, coord).a;
        color += col * illuminationDecay * weight;
        illuminationDecay *= Decay;
      }
      gl_FragColor = vec4(color * Exposure, 0.0, 0.0, 1.0);
    }
  `);

  copyMaterial = new Program(baseVertexShader, copyShader);
  clearMaterial = new Program(baseVertexShader, clearShader);
  splatMaterial = new Program(baseVertexShader, splatShader);
  advectionMaterial = new Material(baseVertexShader, advectionShader);
  divergenceMaterial = new Program(baseVertexShader, divergenceShader);
  curlMaterial = new Program(baseVertexShader, curlShader);
  vorticityMaterial = new Program(baseVertexShader, vorticityShader);
  pressureMaterial = new Program(baseVertexShader, pressureShader);
  gradientSubtractMaterial = new Program(baseVertexShader, gradientSubtractShader);
  displayMaterial = new Material(baseVertexShader, displayShaderSource);
  bloomPrefilterMaterial = new Program(baseVertexShader, bloomPrefilterShader);
  bloomBlurMaterial = new Program(baseVertexShader, bloomBlurShader);
  bloomFinalMaterial = new Program(baseVertexShader, bloomFinalShader);
  sunraysMaskMaterial = new Program(baseVertexShader, sunraysMaskShader);
  sunraysMaterial = new Program(baseVertexShader, sunraysShader);

  const quadBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,-1,1,1,1,1,-1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function initFramebuffers() {
    const simRes = getResolution(config.SIM_RES);
    const dyeRes = getResolution(config.DYE_RES);
    const texType = ext.halfFloatTexType;
    const rgba = ext.formatRGBA;
    const rg = ext.formatRG;
    const r = ext.formatR;
    const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

    gl.disable(gl.BLEND);

    if (!dye) {
      dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
    } else {
      dye.read = createFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
      dye.write = createFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
      dye.width = dyeRes.width;
      dye.height = dyeRes.height;
      dye.texelSizeX = 1 / dyeRes.width;
      dye.texelSizeY = 1 / dyeRes.height;
    }

    if (!velocity) {
      velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
    } else {
      velocity.read = createFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
      velocity.write = createFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
      velocity.width = simRes.width;
      velocity.height = simRes.height;
      velocity.texelSizeX = 1 / simRes.width;
      velocity.texelSizeY = 1 / simRes.height;
    }

    divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);

    initBloomFramebuffers();
    initSunraysFramebuffers();
  }

  function initBloomFramebuffers() {
    const res = getResolution(config.BLOOM_RESOLUTION);
    const rgba = ext.formatRGBA;
    const texType = ext.halfFloatTexType;
    bloom = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, gl.LINEAR);
    bloomFramebuffers.length = 0;
    for (let i = 0; i < config.BLOOM_ITERATIONS; i++) {
      const w = res.width >> (i + 1);
      const h = res.height >> (i + 1);
      if (w < 2 || h < 2) break;
      bloomFramebuffers.push(createFBO(w, h, rgba.internalFormat, rgba.format, texType, gl.LINEAR));
    }
  }

  function initSunraysFramebuffers() {
    const res = getResolution(config.SUNRAYS_RESOLUTION);
    const rgba = ext.formatRGBA;
    const texType = ext.halfFloatTexType;
    sunrays = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, gl.LINEAR);
    sunraysTemp = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, gl.LINEAR);
  }

  function HSVtoRGB(h, s, v) {
    let r, g, b, i = Math.floor(h * 6);
    let f = h * 6 - i;
    let p = v * (1 - s);
    let q = v * (1 - f * s);
    let t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: r = v; g = t; b = p; break;
      case 1: r = q; g = v; b = p; break;
      case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break;
      case 4: r = t; g = p; b = v; break;
      case 5: r = v; g = p; b = q; break;
    }
    return { r, g, b };
  }

  function generateColor() {
    const c = HSVtoRGB(Math.random(), 1.0, 1.0);
    c.r *= 0.15; c.g *= 0.15; c.b *= 0.15;
    return c;
  }

  function wrap(value, min, max) {
    const range = max - min;
    if (range === 0) return min;
    return ((value - min) % range + range) % range + min;
  }

  function getForPointer(pointer) {
    return pointer.color;
  }

  function updatePointerDownData(pointer, id, x, y) {
    pointer.id = id;
    pointer.down = true;
    pointer.moved = false;
    pointer.texcoordX = x / canvas.clientWidth;
    pointer.texcoordY = 1.0 - y / canvas.clientHeight;
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.deltaX = 0;
    pointer.deltaY = 0;
    pointer.color = generateColor();
  }

  function updatePointerMoveData(pointer, x, y) {
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.texcoordX = x / canvas.clientWidth;
    pointer.texcoordY = 1.0 - y / canvas.clientHeight;
    pointer.deltaX = correctDeltaX(pointer.texcoordX - pointer.prevTexcoordX);
    pointer.deltaY = correctDeltaY(pointer.texcoordY - pointer.prevTexcoordY);
    pointer.moved = Math.abs(pointer.deltaX) > 0 || Math.abs(pointer.deltaY) > 0;
  }

  function updatePointerUpData(pointer) { pointer.down = false; }

  function correctDeltaX(delta) {
    const aspect = canvas.clientWidth / canvas.clientHeight;
    if (aspect < 1) delta *= aspect;
    return delta;
  }

  function correctDeltaY(delta) {
    const aspect = canvas.clientWidth / canvas.clientHeight;
    if (aspect > 1) delta /= aspect;
    return delta;
  }

  function splat(x, y, dx, dy, color) {
    splatMaterial.bind();
    gl.uniform1i(splatMaterial.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(splatMaterial.uniforms.aspectRatio, canvas.clientWidth / canvas.clientHeight);
    gl.uniform2f(splatMaterial.uniforms.point, x, y);
    gl.uniform3f(splatMaterial.uniforms.color, dx, dy, 0.0);
    gl.uniform1f(splatMaterial.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(splatMaterial.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(splatMaterial.uniforms.color, color.r, color.g, color.b);
    blit(dye.write);
    dye.swap();
  }

  function correctRadius(radius) {
    const aspect = canvas.clientWidth / canvas.clientHeight;
    if (aspect > 1) radius *= aspect;
    return radius;
  }

  function splatPointer(pointer) {
    const dx = pointer.deltaX * config.SPLAT_FORCE;
    const dy = pointer.deltaY * config.SPLAT_FORCE;
    splat(pointer.texcoordX, pointer.texcoordY, dx, dy, pointer.color);
  }

  function multipleSplats(amount) {
    for (let i = 0; i < amount; i++) {
      const color = generateColor();
      color.r *= 10; color.g *= 10; color.b *= 10;
      const x = Math.random();
      const y = Math.random();
      const dx = 1000 * (Math.random() - 0.5);
      const dy = 1000 * (Math.random() - 0.5);
      splat(x, y, dx, dy, color);
    }
  }

  function step(dt) {
    gl.disable(gl.BLEND);

    curlMaterial.bind();
    gl.uniform2f(curlMaterial.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(curlMaterial.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl);

    vorticityMaterial.bind();
    gl.uniform2f(vorticityMaterial.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(vorticityMaterial.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityMaterial.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(vorticityMaterial.uniforms.curl, config.CURL);
    gl.uniform1f(vorticityMaterial.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    divergenceMaterial.bind();
    gl.uniform2f(divergenceMaterial.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(divergenceMaterial.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    clearMaterial.bind();
    gl.uniform1i(clearMaterial.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(clearMaterial.uniforms.value, 0.0);
    blit(pressure.write);
    pressure.swap();

    pressureMaterial.bind();
    gl.uniform2f(pressureMaterial.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(pressureMaterial.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
      gl.uniform1i(pressureMaterial.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write);
      pressure.swap();
    }

    gradientSubtractMaterial.bind();
    gl.uniform2f(gradientSubtractMaterial.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(gradientSubtractMaterial.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradientSubtractMaterial.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write);
    velocity.swap();

    advectionMaterial.bind();
    gl.uniform2f(advectionMaterial.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    if (!ext.supportLinearFiltering)
      advectionMaterial.setKeywords(['MANUAL_FILTERING']);
    else
      advectionMaterial.setKeywords([]);
    gl.uniform1i(advectionMaterial.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionMaterial.uniforms.uSource, velocity.read.attach(0));
    gl.uniform2f(advectionMaterial.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1f(advectionMaterial.uniforms.dt, dt);
    gl.uniform1f(advectionMaterial.uniforms.dissipation, config.VELOCITY_DISSIPATION);
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(advectionMaterial.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionMaterial.uniforms.uSource, dye.read.attach(1));
    gl.uniform2f(advectionMaterial.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1f(advectionMaterial.uniforms.dissipation, config.DENSITY_DISSIPATION);
    blit(dye.write);
    dye.swap();
  }

  function applyBloom(source, destination) {
    if (bloomFramebuffers.length < 2) return;

    bloomPrefilterMaterial.bind();
    const knee = config.BLOOM_THRESHOLD * 0.7;
    const curve0 = config.BLOOM_THRESHOLD - knee;
    const curve1 = knee * 2;
    const curve2 = 0.25 / knee;
    gl.uniform3f(bloomPrefilterMaterial.uniforms.curve, curve0, curve1, curve2);
    gl.uniform1f(bloomPrefilterMaterial.uniforms.threshold, config.BLOOM_THRESHOLD);
    gl.uniform1i(bloomPrefilterMaterial.uniforms.uTexture, source.attach(0));
    blit(bloom);

    bloomBlurMaterial.bind();
    for (let i = 0; i < bloomFramebuffers.length; i++) {
      const dest = bloomFramebuffers[i];
      gl.uniform2f(bloomBlurMaterial.uniforms.texelSize, bloom.texelSizeX, bloom.texelSizeY);
      gl.uniform1i(bloomBlurMaterial.uniforms.uTexture, bloom.attach(0));
      blit(dest);
      bloom = dest;
    }

    bloomFinalMaterial.bind();
    gl.uniform2f(bloomFinalMaterial.uniforms.texelSize, bloom.texelSizeX, bloom.texelSizeY);
    gl.uniform1i(bloomFinalMaterial.uniforms.uTexture, bloom.attach(0));
    gl.uniform1f(bloomFinalMaterial.uniforms.intensity, config.BLOOM_INTENSITY);
    blit(destination);
  }

  function applySunrays(source, mask, destination) {
    sunraysMaskMaterial.bind();
    gl.uniform1i(sunraysMaskMaterial.uniforms.uTexture, source.attach(0));
    blit(mask);

    sunraysMaterial.bind();
    gl.uniform1i(sunraysMaterial.uniforms.uTexture, mask.attach(0));
    gl.uniform1f(sunraysMaterial.uniforms.weight, config.SUNRAYS_WEIGHT);
    blit(destination);
  }

  function drawDisplay(target) {
    const width = target == null ? gl.drawingBufferWidth : target.width;
    const height = target == null ? gl.drawingBufferHeight : target.height;

    displayMaterial.bind();
    if (config.SHADING) displayMaterial.setKeywords(['SHADING']);
    else displayMaterial.setKeywords([]);
    gl.uniform2f(displayMaterial.uniforms.texelSize, 1 / width, 1 / height);

    if (config.BLOOM) applyBloom(dye.read, bloom);

    gl.bindFramebuffer(gl.FRAMEBUFFER, target == null ? null : target.fbo);
    gl.viewport(0, 0, width, height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform1i(displayMaterial.uniforms.uTexture, dye.read.attach(0));
    blit(null);

    if (config.BLOOM) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.uniform1i(displayMaterial.uniforms.uTexture, bloom.attach(0));
      blit(null);
      gl.disable(gl.BLEND);
    }

    if (config.SUNRAYS) {
      applySunrays(dye.read, sunraysTemp, sunrays);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.uniform1i(displayMaterial.uniforms.uTexture, sunrays.attach(0));
      blit(null);
      gl.disable(gl.BLEND);
    }
  }

  function hashCode(s) {
    if (s.length === 0) return 0;
    let hash = 0;
    for (let i = 0; i < s.length; i++) {
      hash = ((hash << 5) - hash) + s.charCodeAt(i);
      hash |= 0;
    }
    return hash;
  }

  function resizeCanvas() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      return true;
    }
    return false;
  }

  let lastTime = Date.now();
  let colorUpdateTimer = 0;

  function update() {
    const now = Date.now();
    let dt = Math.min((now - lastTime) / 1000, 0.016666);
    lastTime = now;

    if (resizeCanvas()) initFramebuffers();

    if (!config.PAUSED) {
      step(dt);
      colorUpdateTimer += dt * config.COLOR_UPDATE_SPEED;
      if (colorUpdateTimer >= 1) {
        colorUpdateTimer = wrap(colorUpdateTimer, 0, 1);
        pointers.forEach(p => {
          p.color = generateColor();
        });
      }
    }

    while (splatStack.length > 0) multipleSplats(splatStack.pop());

    pointers.forEach(p => {
      if (p.moved) {
        p.moved = false;
        splatPointer(p);
      }
    });

    drawDisplay(null);
    requestAnimationFrame(update);
  }

  config.COLOR_UPDATE_SPEED = 10;

  canvas.addEventListener('mousedown', e => {
    hint.classList.add('hidden');
    const posX = scaleByPixelRatio(e.clientX);
    const posY = scaleByPixelRatio(e.clientY);
    let pointer = pointers.find(p => p.id === -1);
    if (pointer == null) {
      pointer = new pointerPrototype();
      pointers.push(pointer);
    }
    updatePointerDownData(pointer, e.button, posX, posY);
  });

  canvas.addEventListener('mousemove', e => {
    const pointer = pointers[0];
    if (!pointer.down) return;
    const posX = scaleByPixelRatio(e.clientX);
    const posY = scaleByPixelRatio(e.clientY);
    updatePointerMoveData(pointer, posX, posY);
  });

  window.addEventListener('mouseup', () => {
    pointers.forEach(p => updatePointerUpData(p));
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    hint.classList.add('hidden');
    const touches = e.targetTouches;
    for (let i = 0; i < touches.length; i++) {
      const posX = scaleByPixelRatio(touches[i].clientX);
      const posY = scaleByPixelRatio(touches[i].clientY);
      let pointer = pointers.find(p => p.id === -1);
      if (pointer == null) {
        pointer = new pointerPrototype();
        pointers.push(pointer);
      }
      updatePointerDownData(pointer, touches[i].identifier, posX, posY);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const touches = e.targetTouches;
    for (let i = 0; i < touches.length; i++) {
      const pointer = pointers.find(p => p.id === touches[i].identifier);
      if (pointer == null) continue;
      const posX = scaleByPixelRatio(touches[i].clientX);
      const posY = scaleByPixelRatio(touches[i].clientY);
      updatePointerMoveData(pointer, posX, posY);
    }
  }, { passive: false });

  window.addEventListener('touchend', e => {
    const touches = e.changedTouches;
    for (let i = 0; i < touches.length; i++) {
      const pointer = pointers.find(p => p.id === touches[i].identifier);
      if (pointer == null) continue;
      updatePointerUpData(pointer);
    }
  });

  function scaleByPixelRatio(input) {
    const ratio = window.devicePixelRatio || 1;
    return Math.floor(input * ratio);
  }

  initFramebuffers();
  multipleSplats(parseInt(Math.random() * 20) + 5);
  update();
})();
</script>
</body>
</html>
