<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 100%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #e8e8f0;
    }

    .clock-container {
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .time {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 200;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .time .seconds {
      font-size: 0.45em;
      opacity: 0.6;
      font-weight: 300;
    }

    .date {
      margin-top: 1rem;
      font-size: clamp(0.9rem, 3vw, 1.25rem);
      font-weight: 400;
      opacity: 0.7;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .analog {
      margin-top: 2rem;
      position: relative;
      width: 180px;
      height: 180px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.2);
    }

    .analog .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }

    .analog .hour {
      width: 4px;
      height: 45px;
      margin-left: -2px;
      background: #e8e8f0;
    }

    .analog .minute {
      width: 3px;
      height: 65px;
      margin-left: -1.5px;
      background: #a0a0c0;
    }

    .analog .second {
      width: 2px;
      height: 75px;
      margin-left: -1px;
      background: #6c8cff;
    }

    .analog .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: #6c8cff;
    }

    .tick {
      position: absolute;
      width: 2px;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      top: 6px;
      left: 50%;
      margin-left: -1px;
      transform-origin: 1px 84px;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="time" id="digital">
      <span id="hours">00</span>:<span id="minutes">00</span><span class="seconds">:<span id="seconds">00</span></span>
    </div>
    <div class="date" id="date"></div>
    <div class="analog" id="analog">
      <div class="hand hour" id="hour-hand"></div>
      <div class="hand minute" id="minute-hand"></div>
      <div class="hand second" id="second-hand"></div>
      <div class="center-dot"></div>
    </div>
  </div>

  <script>
    (function () {
      const hoursEl = document.getElementById("hours");
      const minutesEl = document.getElementById("minutes");
      const secondsEl = document.getElementById("seconds");
      const dateEl = document.getElementById("date");
      const hourHand = document.getElementById("hour-hand");
      const minuteHand = document.getElementById("minute-hand");
      const secondHand = document.getElementById("second-hand");
      const analog = document.getElementById("analog");

      for (let i = 0; i < 12; i++) {
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.transform = "rotate(" + (i * 30) + "deg)";
        analog.appendChild(tick);
      }

      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function update() {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        const ms = now.getMilliseconds();

        hoursEl.textContent = pad(h);
        minutesEl.textContent = pad(m);
        secondsEl.textContent = pad(s);

        dateEl.textContent = now.toLocaleDateString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });

        const secDeg = (s + ms / 1000) * 6;
        const minDeg = (m + s / 60) * 6;
        const hourDeg = ((h % 12) + m / 60 + s / 3600) * 30;

        secondHand.style.transform = "rotate(" + secDeg + "deg)";
        minuteHand.style.transform = "rotate(" + minDeg + "deg)";
        hourHand.style.transform = "rotate(" + hourDeg + "deg)";

        requestAnimationFrame(update);
      }

      update();
    })();
  </script>
</body>
</html>
