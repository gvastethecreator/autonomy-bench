<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTEROIDS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W, H, cx, cy;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrap = (v, max) => { v %= max; return v < 0 ? v + max : v; };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyP') togglePause();
    if (e.code === 'Enter' && (state === 'title' || state === 'gameover')) startGame();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  let state = 'title';
  let score = 0;
  let lives = 3;
  let level = 1;
  let highScore = parseInt(localStorage.getItem('asteroids_hi') || '0', 10);
  let paused = false;
  let shake = 0;
  let flash = 0;
  let waveTimer = 0;
  let respawnTimer = 0;
  let invincible = 0;

  const ship = {
    x: 0, y: 0, vx: 0, vy: 0,
    angle: -Math.PI / 2,
    radius: 14,
    thrust: false,
    dead: false
  };

  let bullets = [];
  let asteroids = [];
  let particles = [];
  let stars = [];

  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: rand(0.3, 1),
        twinkle: rand(0, TAU)
      });
    }
  }
  initStars();

  function resetShip() {
    ship.x = cx; ship.y = cy;
    ship.vx = 0; ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.thrust = false;
    ship.dead = false;
    invincible = 180;
  }

  function makeAsteroid(x, y, size, vx, vy) {
    const verts = [];
    const n = Math.floor(rand(7, 11));
    const r = size === 3 ? rand(38, 52) : size === 2 ? rand(22, 32) : rand(12, 18);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      verts.push({ a, r: r * rand(0.75, 1.0) });
    }
    if (vx === undefined) {
      const spd = rand(0.4, 1.2 + level * 0.08);
      const ang = rand(0, TAU);
      vx = Math.cos(ang) * spd;
      vy = Math.sin(ang) * spd;
    }
    return { x, y, vx, vy, size, verts, rot: rand(-0.02, 0.02), angle: rand(0, TAU), r };
  }

  function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
      let x, y;
      do {
        x = rand(0, W);
        y = rand(0, H);
      } while (dist({ x, y }, ship) < 150);
      asteroids.push(makeAsteroid(x, y, 3));
    }
  }

  function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    bullets = [];
    asteroids = [];
    particles = [];
    paused = false;
    resetShip();
    spawnAsteroids(4);
    state = 'playing';
    waveTimer = 0;
  }

  function nextLevel() {
    level++;
    waveTimer = 90;
    bullets = [];
    const count = 3 + level;
    spawnAsteroids(Math.min(count, 12));
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: cx, y: cy,
        vx: rand(-3, 3), vy: rand(-3, 3),
        life: rand(30, 60),
        maxLife: 60,
        color: `hsl(${rand(180, 220)}, 80%, 70%)`,
        size: rand(1, 3)
      });
    }
  }

  function togglePause() {
    if (state === 'playing') paused = !paused;
  }

  function fireBullet() {
    if (ship.dead || invincible > 0 && invincible > 170) return;
    const speed = 9;
    const bx = ship.x + Math.cos(ship.angle) * ship.radius;
    const by = ship.y + Math.sin(ship.angle) * ship.radius;
    bullets.push({
      x: bx, y: by,
      vx: ship.vx + Math.cos(ship.angle) * speed,
      vy: ship.vy + Math.sin(ship.angle) * speed,
      life: 70
    });
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: bx, y: by,
        vx: Math.cos(ship.angle + Math.PI + rand(-0.3, 0.3)) * rand(1, 3),
        vy: Math.sin(ship.angle + Math.PI + rand(-0.3, 0.3)) * rand(1, 3),
        life: rand(8, 16),
        maxLife: 16,
        color: '#ffaa44',
        size: rand(1, 2)
      });
    }
  }

  let fireCooldown = 0;

  function explode(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const s = rand(0.5, speed);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(20, 50),
        maxLife: 50,
        color,
        size: rand(1, 3)
      });
    }
  }

  function splitAsteroid(a) {
    const pts = a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
    score += pts;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('asteroids_hi', String(highScore));
    }
    explode(a.x, a.y, '#aaaacc', 12 + a.size * 4, 4 + a.size);
    shake = a.size * 2;

    if (a.size > 1) {
      for (let i = 0; i < 2; i++) {
        const ang = rand(0, TAU);
        const spd = rand(1.5, 3);
        asteroids.push(makeAsteroid(
          a.x + rand(-5, 5), a.y + rand(-5, 5),
          a.size - 1,
          a.vx + Math.cos(ang) * spd,
          a.vy + Math.sin(ang) * spd
        ));
      }
    }
  }

  function killShip() {
    if (invincible > 0 || ship.dead) return;
    ship.dead = true;
    explode(ship.x, ship.y, '#66ccff', 30, 5);
    shake = 8;
    flash = 12;
    lives--;
    bullets = [];
    if (lives <= 0) {
      state = 'gameover';
    } else {
      respawnTimer = 120;
    }
  }

  function circlePolyCollision(px, py, pr, ax, ay, verts, aAngle) {
    let closest = Infinity;
    const n = verts.length;
    const pts = verts.map(v => ({
      x: ax + Math.cos(v.a + aAngle) * v.r,
      y: ay + Math.sin(v.a + aAngle) * v.r
    }));
    for (let i = 0; i < n; i++) {
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len2 = dx * dx + dy * dy;
      let t = len2 ? clamp(((px - p1.x) * dx + (py - p1.y) * dy) / len2, 0, 1) : 0;
      const nx = p1.x + t * dx, ny = p1.y + t * dy;
      closest = Math.min(closest, Math.hypot(px - nx, py - ny));
    }
    return closest < pr;
  }

  function update() {
    if (state !== 'playing' || paused) return;

    if (waveTimer > 0) { waveTimer--; return; }

    if (respawnTimer > 0) {
      respawnTimer--;
      if (respawnTimer <= 0) resetShip();
      return;
    }

    if (invincible > 0) invincible--;

    // Ship controls
    if (!ship.dead) {
      if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.065;
      if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.065;
      ship.thrust = keys['ArrowUp'] || keys['KeyW'];
      if (ship.thrust) {
        ship.vx += Math.cos(ship.angle) * 0.12;
        ship.vy += Math.sin(ship.angle) * 0.12;
      }
      ship.vx *= 0.992;
      ship.vy *= 0.992;
      const maxSpd = 7;
      const spd = Math.hypot(ship.vx, ship.vy);
      if (spd > maxSpd) {
        ship.vx = (ship.vx / spd) * maxSpd;
        ship.vy = (ship.vy / spd) * maxSpd;
      }
      ship.x += ship.vx;
      ship.y += ship.vy;
      ship.x = wrap(ship.x, W);
      ship.y = wrap(ship.y, H);

      if (fireCooldown > 0) fireCooldown--;
      if (keys['Space'] && fireCooldown <= 0) {
        fireBullet();
        fireCooldown = 8;
      }

      if (ship.thrust && Math.random() < 0.7) {
        const ex = ship.x - Math.cos(ship.angle) * ship.radius;
        const ey = ship.y - Math.sin(ship.angle) * ship.radius;
        particles.push({
          x: ex + rand(-3, 3), y: ey + rand(-3, 3),
          vx: ship.vx * 0.3 + Math.cos(ship.angle + Math.PI + rand(-0.4, 0.4)) * rand(1, 2.5),
          vy: ship.vy * 0.3 + Math.sin(ship.angle + Math.PI + rand(-0.4, 0.4)) * rand(1, 2.5),
          life: rand(6, 14),
          maxLife: 14,
          color: `hsl(${rand(20, 40)}, 100%, ${rand(50, 70)}%)`,
          size: rand(1.5, 3)
        });
      }
    }

    // Bullets
    bullets = bullets.filter(b => {
      b.x += b.vx; b.y += b.vy;
      b.life--;
      b.x = wrap(b.x, W);
      b.y = wrap(b.y, H);
      return b.life > 0;
    });

    // Asteroids
    for (const a of asteroids) {
      a.x += a.vx; a.y += a.vy;
      a.angle += a.rot;
      a.x = wrap(a.x, W);
      a.y = wrap(a.y, H);
    }

    // Bullet-asteroid collisions
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (circlePolyCollision(b.x, b.y, 2, a.x, a.y, a.verts, a.angle)) {
          bullets.splice(i, 1);
          splitAsteroid(a);
          asteroids.splice(j, 1);
          break;
        }
      }
    }

    // Ship-asteroid collisions
    if (!ship.dead && invincible <= 0) {
      for (const a of asteroids) {
        if (circlePolyCollision(ship.x, ship.y, ship.radius - 4, a.x, a.y, a.verts, a.angle)) {
          killShip();
          break;
        }
      }
    }

    // Level complete
    if (asteroids.length === 0 && respawnTimer <= 0) {
      nextLevel();
    }

    // Particles
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.97; p.vy *= 0.97;
      p.life--;
      return p.life > 0;
    });

    if (shake > 0) shake *= 0.85;
    if (flash > 0) flash--;
  }

  function drawStars() {
    for (const s of stars) {
      s.twinkle += 0.03;
      const b = 0.4 + Math.sin(s.twinkle) * 0.3;
      ctx.fillStyle = `rgba(255,255,255,${b * s.z * 0.6})`;
      ctx.fillRect(s.x, s.y, s.z * 1.5, s.z * 1.5);
    }
  }

  function drawShip() {
    if (ship.dead) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);

    if (invincible > 0 && Math.floor(invincible / 4) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    // Glow
    ctx.shadowColor = '#44ddff';
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.moveTo(ship.radius, 0);
    ctx.lineTo(-ship.radius * 0.7, -ship.radius * 0.65);
    ctx.lineTo(-ship.radius * 0.35, 0);
    ctx.lineTo(-ship.radius * 0.7, ship.radius * 0.65);
    ctx.closePath();
    ctx.fillStyle = '#aeeeff';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.beginPath();
    const v = a.verts;
    ctx.moveTo(Math.cos(v[0].a) * v[0].r, Math.sin(v[0].a) * v[0].r);
    for (let i = 1; i < v.length; i++) {
      ctx.lineTo(Math.cos(v[i].a) * v[i].r, Math.sin(v[i].a) * v[i].r);
    }
    ctx.closePath();
    ctx.fillStyle = '#1a1a2e';
    ctx.fill();
    ctx.strokeStyle = '#8899bb';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Courier New, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE  ${String(score).padStart(6, '0')}`, 20, 32);
    ctx.textAlign = 'right';
    ctx.fillText(`HI  ${String(highScore).padStart(6, '0')}`, W - 20, 32);
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${level}`, cx, 32);

    // Lives
    for (let i = 0; i < lives; i++) {
      const lx = 20 + i * 28;
      const ly = 52;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(-Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-7, -6);
      ctx.lineTo(-3.5, 0);
      ctx.lineTo(-7, 6);
      ctx.closePath();
      ctx.fillStyle = '#66ccff';
      ctx.fill();
      ctx.restore();
    }

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', cx, cy);
      ctx.font = '16px Courier New, monospace';
      ctx.fillText('Press P to resume', cx, cy + 30);
    }

    if (waveTimer > 0) {
      ctx.fillStyle = '#ffcc44';
      ctx.font = 'bold 28px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`WAVE ${level}`, cx, cy);
    }
  }

  function drawTitle() {
    drawStars();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 64px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur = 20;
    ctx.fillText('ASTEROIDS', cx, cy - 60);
    ctx.shadowBlur = 0;

    ctx.font = '18px Courier New, monospace';
    ctx.fillStyle = '#8899aa';
    ctx.fillText('Destroy asteroids. Survive the void.', cx, cy - 10);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px Courier New, monospace';
    const pulse = 0.6 + Math.sin(Date.now() / 400) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.fillText('PRESS ENTER TO START', cx, cy + 50);
    ctx.globalAlpha = 1;

    ctx.font = '14px Courier New, monospace';
    ctx.fillStyle = '#667788';
    ctx.fillText('↑ / W — thrust    ← → / A D — rotate    SPACE — fire    P — pause', cx, cy + 100);
    ctx.fillText(`HIGH SCORE: ${highScore}`, cx, cy + 130);
  }

  function drawGameOver() {
    drawStars();
    for (const a of asteroids) drawAsteroid(a);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff4466';
    ctx.font = 'bold 48px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', cx, cy - 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = '24px Courier New, monospace';
    ctx.fillText(`SCORE: ${score}`, cx, cy + 10);
    ctx.fillText(`HIGH SCORE: ${highScore}`, cx, cy + 45);

    const pulse = 0.6 + Math.sin(Date.now() / 400) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.font = '18px Courier New, monospace';
    ctx.fillText('PRESS ENTER TO RETRY', cx, cy + 90);
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    let sx = 0, sy = 0;
    if (shake > 0.5) {
      sx = rand(-shake, shake);
      sy = rand(-shake, shake);
    }
    ctx.translate(sx, sy);

    ctx.fillStyle = '#050510';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    if (state === 'title') {
      drawTitle();
      ctx.restore();
      return;
    }

    if (state === 'gameover') {
      drawGameOver();
      ctx.restore();
      return;
    }

    drawStars();

    for (const a of asteroids) drawAsteroid(a);

    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, TAU);
      ctx.fillStyle = '#ffffaa';
      ctx.shadowColor = '#ffff44';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    drawShip();
    drawHUD();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,100,100,${flash / 20})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
