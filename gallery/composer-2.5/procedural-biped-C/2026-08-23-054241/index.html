<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember Strider — Procedural Biped</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0612; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 40%, rgba(8,4,16,0.55) 100%);
  }
  #title {
    position: fixed; top: 28px; left: 32px;
    font: 300 13px/1.4 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: rgba(255,180,120,0.75);
    text-shadow: 0 0 24px rgba(255,120,40,0.4);
    opacity: 0; animation: fadeIn 2s 1.2s forwards;
  }
  #title span { display: block; font-size: 10px; letter-spacing: 0.5em; color: rgba(180,140,255,0.5); margin-top: 6px; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title">Ember Strider<span>procedural gait · twilight traverse</span></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Scene setup ───────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0818);
scene.fog = new THREE.FogExp2(0x1a1028, 0.011);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(-8, 6, 14);

// ─── Lighting ──────────────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0x8866cc, 0x221008, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffaa66, 1.4);
sun.position.set(-30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = sun.shadow.camera.bottom = -40;
sun.shadow.camera.right = sun.shadow.camera.top = 40;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x6644ff, 0.35);
rim.position.set(20, 8, -15);
scene.add(rim);

const glowLight = new THREE.PointLight(0xff6622, 0, 18);
scene.add(glowLight);

// ─── Terrain ───────────────────────────────────────────────────
const TERRAIN_SIZE = 180;
const TERRAIN_SEG = 128;

function terrainHeight(x, z) {
  const d = Math.sqrt(x * x + z * z);
  const ridge = Math.sin(x * 0.04) * Math.cos(z * 0.035) * 3.5;
  const hills = Math.sin(x * 0.018 + 1.2) * Math.cos(z * 0.022) * 5;
  const valley = -Math.exp(-((x - 25) ** 2 + (z - 8) ** 2) / 800) * 4;
  const plateau = Math.max(0, Math.sin((x + 40) * 0.012) * 2.5);
  const edgeFalloff = Math.max(0, 1 - d / 85) ** 2;
  return (ridge + hills + valley + plateau) * edgeFalloff;
}

function terrainNormal(x, z) {
  const e = 0.4;
  const h = terrainHeight(x, z);
  const hx = terrainHeight(x + e, z) - h;
  const hz = terrainHeight(x, z + e) - h;
  return new THREE.Vector3(-hx, e, -hz).normalize();
}

const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);
const pos = terrainGeo.attributes.position;
const colors = [];
const cLow = new THREE.Color(0x1a1020);
const cMid = new THREE.Color(0x2a1838);
const cHigh = new THREE.Color(0x3d2850);
const cRock = new THREE.Color(0x554466);

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const y = terrainHeight(x, z);
  pos.setY(i, y);
  const t = THREE.MathUtils.clamp((y + 2) / 10, 0, 1);
  const col = cLow.clone().lerp(cMid, t).lerp(cHigh, t * t).lerp(cRock, Math.max(0, (y - 4) / 6));
  colors.push(col.r, col.g, col.b);
}
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.92, metalness: 0.05, flatShading: false
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// Path curve — creature follows this
const pathPoints = [];
for (let i = 0; i <= 200; i++) {
  const t = i / 200;
  const angle = t * Math.PI * 1.35 - 0.4;
  const radius = 12 + t * 38 + Math.sin(t * 8) * 4;
  const x = Math.cos(angle) * radius - 5;
  const z = Math.sin(angle) * radius + 3;
  const y = terrainHeight(x, z);
  pathPoints.push(new THREE.Vector3(x, y, z));
}
const pathCurve = new THREE.CatmullRomCurve3(pathPoints);
const pathLineGeo = new THREE.BufferGeometry().setFromPoints(pathCurve.getPoints(300));
const pathGlow = new THREE.Line(pathLineGeo, new THREE.LineBasicMaterial({ color: 0xff6622, transparent: true, opacity: 0.08 }));
scene.add(pathGlow);

// ─── Environment props ─────────────────────────────────────────
const propGroup = new THREE.Group();
scene.add(propGroup);

function addCrystal(x, z, scale = 1) {
  const y = terrainHeight(x, z);
  const g = new THREE.OctahedronGeometry(0.5 * scale, 0);
  const m = new THREE.MeshStandardMaterial({
    color: 0xaa66ff, emissive: 0x6622cc, emissiveIntensity: 0.8,
    roughness: 0.15, metalness: 0.6, transparent: true, opacity: 0.85
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y + 0.3 * scale, z);
  mesh.rotation.set(Math.random(), Math.random(), Math.random());
  mesh.castShadow = true;
  propGroup.add(mesh);
  return mesh;
}

const crystals = [];
for (let i = 0; i < 45; i++) {
  const t = Math.random();
  const p = pathCurve.getPointAt(t);
  const off = (Math.random() - 0.5) * 14;
  const px = p.x + off, pz = p.z + (Math.random() - 0.5) * 10;
  if (Math.abs(off) > 3) crystals.push(addCrystal(px, pz, 0.6 + Math.random() * 1.8));
}

// Arch — memorable moment landmark
const archGroup = new THREE.Group();
const archT = 0.62;
const archCenter = pathCurve.getPointAt(archT);
const archY = terrainHeight(archCenter.x, archCenter.z);
const archNormal = terrainNormal(archCenter.x, archCenter.z);

function makeArchPillar(offset) {
  const g = new THREE.CylinderGeometry(0.35, 0.55, 7, 8);
  const m = new THREE.MeshStandardMaterial({ color: 0x3a2048, roughness: 0.7, metalness: 0.2 });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true;
  mesh.position.set(offset, 3.5, 0);
  return mesh;
}

const archMat = new THREE.MeshStandardMaterial({
  color: 0xff8844, emissive: 0xff4400, emissiveIntensity: 1.2,
  roughness: 0.3, metalness: 0.5
});

archGroup.position.copy(archCenter);
archGroup.position.y = archY;
const tangent = pathCurve.getTangentAt(archT);
archGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent.clone().setY(0).normalize());

archGroup.add(makeArchPillar(-3.2));
archGroup.add(makeArchPillar(3.2));
const beam = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.5, 0.6), archMat);
beam.position.y = 7;
beam.castShadow = true;
archGroup.add(beam);

const archGlow = new THREE.PointLight(0xff6622, 3, 22);
archGlow.position.y = 6;
archGroup.add(archGlow);
propGroup.add(archGroup);

// Floating spores
const sporeCount = 600;
const sporeGeo = new THREE.BufferGeometry();
const sporePos = new Float32Array(sporeCount * 3);
const sporeVel = [];
for (let i = 0; i < sporeCount; i++) {
  sporePos[i * 3] = (Math.random() - 0.5) * 80;
  sporePos[i * 3 + 1] = Math.random() * 12 + 1;
  sporePos[i * 3 + 2] = (Math.random() - 0.5) * 80;
  sporeVel.push({ y: 0.003 + Math.random() * 0.008, phase: Math.random() * Math.PI * 2 });
}
sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
const sporeMat = new THREE.PointsMaterial({
  color: 0xffaa66, size: 0.12, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const spores = new THREE.Points(sporeGeo, sporeMat);
scene.add(spores);

// ─── Biped creature ────────────────────────────────────────────
const creature = new THREE.Group();
scene.add(creature);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a1830, roughness: 0.65, metalness: 0.15 });
const jointMat = new THREE.MeshStandardMaterial({ color: 0x1a0e20, roughness: 0.5, metalness: 0.3 });
const glowMat = new THREE.MeshStandardMaterial({
  color: 0xff6622, emissive: 0xff4400, emissiveIntensity: 1.5, roughness: 0.2, metalness: 0.4
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0xffcc88, emissive: 0xffaa44, emissiveIntensity: 2, roughness: 0.1
});

function limb(length, radiusTop, radiusBot, mat) {
  const g = new THREE.CylinderGeometry(radiusTop, radiusBot, length, 8);
  g.translate(0, -length / 2, 0);
  return new THREE.Mesh(g, mat);
}

function joint(r, mat) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat);
}

// Pelvis
const pelvis = new THREE.Group();
creature.add(pelvis);
const pelvisMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.55), bodyMat);
pelvisMesh.castShadow = true;
pelvis.add(pelvisMesh);

// Torso
const torso = new THREE.Group();
torso.position.y = 0.35;
pelvis.add(torso);
const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.1, 0.45), bodyMat);
torsoMesh.position.y = 0.55;
torsoMesh.castShadow = true;
torso.add(torsoMesh);

// Chest glow core
const core = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), glowMat);
core.position.set(0, 0.7, 0.15);
torso.add(core);

// Head
const head = new THREE.Group();
head.position.y = 1.15;
torso.add(head);
const skull = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.5), bodyMat);
skull.castShadow = true;
head.add(skull);
const snout = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.35), bodyMat);
snout.position.set(0, -0.05, 0.28);
head.add(snout);
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), eyeMat);
eyeL.position.set(-0.14, 0.08, 0.22);
head.add(eyeL);
const eyeR = eyeL.clone();
eyeR.position.x = 0.14;
head.add(eyeR);

// Antennae (secondary motion)
const antennae = [];
for (const side of [-1, 1]) {
  const ant = new THREE.Group();
  ant.position.set(side * 0.15, 0.28, 0);
  const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.04, 0.55, 6), glowMat);
  seg.position.y = 0.28;
  seg.rotation.z = side * 0.35;
  ant.add(seg);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), glowMat);
  tip.position.set(side * 0.12, 0.55, 0);
  ant.add(tip);
  head.add(ant);
  antennae.push(ant);
}

// Tail
const tail = new THREE.Group();
tail.position.set(0, 0.3, -0.35);
torso.add(tail);
for (let i = 0; i < 4; i++) {
  const seg = new THREE.Mesh(new THREE.SphereGeometry(0.12 - i * 0.02, 8, 6), i < 2 ? bodyMat : glowMat);
  seg.position.set(0, -0.05, -i * 0.22);
  seg.castShadow = true;
  tail.add(seg);
}

function buildLeg(side) {
  const hip = new THREE.Group();
  hip.position.set(side * 0.38, 0, 0);
  pelvis.add(hip);
  hip.add(joint(0.14, jointMat));

  const upper = limb(0.75, 0.13, 0.1, bodyMat);
  upper.castShadow = true;
  hip.add(upper);

  const knee = new THREE.Group();
  knee.position.y = -0.75;
  hip.add(knee);
  knee.add(joint(0.11, jointMat));

  const lower = limb(0.78, 0.1, 0.07, bodyMat);
  lower.castShadow = true;
  knee.add(lower);

  const foot = new THREE.Group();
  foot.position.y = -0.78;
  knee.add(foot);
  const footMesh = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.38), jointMat);
  footMesh.position.set(0, -0.05, 0.08);
  footMesh.castShadow = true;
  foot.add(footMesh);
  const toeGlow = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), glowMat);
  toeGlow.position.set(0, -0.02, 0.28);
  foot.add(toeGlow);

  return { hip, knee, foot, side };
}

const legs = [buildLeg(-1), buildLeg(1)];

function buildArm(side) {
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.48, 0.85, 0);
  torso.add(shoulder);
  shoulder.add(joint(0.1, jointMat));
  const upper = limb(0.55, 0.09, 0.07, bodyMat);
  upper.castShadow = true;
  shoulder.add(upper);
  const elbow = new THREE.Group();
  elbow.position.y = -0.55;
  shoulder.add(elbow);
  const lower = limb(0.5, 0.07, 0.05, bodyMat);
  lower.castShadow = true;
  elbow.add(lower);
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), glowMat);
  hand.position.y = -0.52;
  elbow.add(hand);
  return { shoulder, elbow, side };
}

const arms = [buildArm(-1), buildArm(1)];

// ─── Gait / IK helpers ─────────────────────────────────────────
const STRIDE = 0.55;
const STEP_H = 0.22;
const LEG_LEN = 1.53;

function solveLeg(leg, phase, leanX, leanZ) {
  const s = leg.side;
  const swing = Math.sin(phase);
  const lift = Math.max(0, Math.sin(phase)) * STEP_H;
  const strideOffset = swing * STRIDE * 0.5;

  const hipX = s * 0.06 + leanX * 0.15;
  const hipZ = strideOffset + leanZ * 0.1;
  leg.hip.rotation.x = -0.15 + leanX * 0.4 + Math.max(0, swing) * 0.35;
  leg.hip.rotation.z = s * -0.08 + leanZ * 0.2;

  const targetY = -LEG_LEN + lift;
  const target = new THREE.Vector3(hipZ, targetY, 0);
  const dist = Math.min(target.length(), LEG_LEN * 0.999);
  const kneeAngle = Math.acos(
    THREE.MathUtils.clamp(
      (0.75 * 0.75 + 0.78 * 0.78 - dist * dist) / (2 * 0.75 * 0.78), -1, 1
    )
  );
  const hipAngle = Math.atan2(target.z, -target.y) + Math.asin(0.78 * Math.sin(kneeAngle) / dist);

  leg.hip.rotation.x = hipAngle + leanX * 0.3;
  leg.knee.rotation.x = -(Math.PI - kneeAngle);
  leg.foot.rotation.x = -leg.hip.rotation.x - leg.knee.rotation.x + 0.1;
}

function animateCreature(t, speed, dt) {
  const cycle = t * speed * Math.PI * 2;
  const leftPhase = cycle;
  const rightPhase = cycle + Math.PI;

  const bob = Math.abs(Math.sin(cycle)) * 0.06;
  const sway = Math.sin(cycle * 0.5) * 0.04;
  const leanX = Math.sin(cycle) * 0.08;

  torso.position.y = 0.35 + bob;
  torso.rotation.z = sway;
  torso.rotation.x = leanX * 0.5;
  head.rotation.y = Math.sin(t * 1.2) * 0.12;
  head.rotation.x = -leanX * 0.3 + Math.sin(t * 2.5) * 0.04;

  solveLeg(legs[0], leftPhase, leanX, 0);
  solveLeg(legs[1], rightPhase, leanX, 0);

  for (const arm of arms) {
    const phase = arm.side === -1 ? leftPhase : rightPhase;
    arm.shoulder.rotation.x = 0.5 - Math.sin(phase) * 0.45 + leanX * 0.2;
    arm.elbow.rotation.x = -0.4 - Math.max(0, Math.sin(phase)) * 0.3;
  }

  // Secondary motion
  for (let i = 0; i < antennae.length; i++) {
    const a = antennae[i];
    const s = i === 0 ? -1 : 1;
    a.rotation.x = Math.sin(t * 3 + i) * 0.15 - leanX * 0.5;
    a.rotation.z = s * (0.35 + Math.sin(t * 2.2 + i * 0.7) * 0.12);
  }
  tail.rotation.x = Math.sin(t * 2.8) * 0.2 - leanX * 0.4;
  tail.rotation.y = Math.sin(t * 1.5) * 0.1;

  core.material.emissiveIntensity = 1.2 + Math.sin(t * 4) * 0.4;
  glowLight.intensity = 1.5 + Math.sin(t * 3) * 0.5;
}

// ─── Post-processing ───────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.35, 0.72);
composer.addPass(bloom);

// ─── State ─────────────────────────────────────────────────────
let pathT = 0;
const walkSpeed = 0.018;
let elapsed = 0;
let archMoment = 0;
let momentTriggered = false;

function placeCreature(t) {
  const pos = pathCurve.getPointAt(t);
  const tan = pathCurve.getTangentAt(t).normalize();
  const y = terrainHeight(pos.x, pos.z);
  creature.position.set(pos.x, y + 0.05, pos.z);
  const angle = Math.atan2(tan.x, tan.z);
  creature.rotation.y = angle;

  const n = terrainNormal(pos.x, pos.z);
  const up = new THREE.Vector3(0, 1, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(up, n);
  creature.quaternion.premultiply(q);
  creature.rotation.y = angle;

  glowLight.position.copy(creature.position);
  glowLight.position.y += 1.2;
}

// ─── Camera rig ────────────────────────────────────────────────
const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();
let camShake = 0;

function updateCamera(t) {
  const pos = pathCurve.getPointAt(pathT);
  const tan = pathCurve.getTangentAt(pathT);
  const side = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

  const dist = 7.5 + Math.sin(t * 0.3) * 0.8;
  const height = 3.8 + Math.sin(t * 0.5) * 0.4;

  camTarget.copy(pos);
  camTarget.y = terrainHeight(pos.x, pos.z) + 1.4;

  camDesired.copy(pos);
  camDesired.addScaledVector(tan, -dist);
  camDesired.addScaledVector(side, 2.2 + Math.sin(t * 0.25) * 1.2);
  camDesired.y = terrainHeight(camDesired.x, camDesired.z) + height;

  if (camShake > 0) {
    camDesired.x += (Math.random() - 0.5) * camShake;
    camDesired.y += (Math.random() - 0.5) * camShake * 0.5;
    camShake *= 0.92;
  }

  camera.position.lerp(camDesired, 0.04);
  camera.lookAt(camTarget);
}

// ─── Memorable moment: arch passage ────────────────────────────
function triggerArchMoment() {
  if (momentTriggered) return;
  momentTriggered = true;
  archMoment = 1;
  camShake = 0.15;
  bloom.strength = 1.1;
  archGlow.intensity = 8;
  setTimeout(() => { bloom.strength = 0.55; }, 2500);
}

// ─── Loop ──────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  pathT += walkSpeed * dt;
  if (pathT >= 1) pathT = 0;

  if (!momentTriggered && pathT > archT - 0.02 && pathT < archT + 0.04) {
    triggerArchMoment();
  }

  if (archMoment > 0) {
    archMoment = Math.max(0, archMoment - dt * 0.35);
    archGlow.intensity = 3 + archMoment * 6;
    archMat.emissiveIntensity = 1.2 + archMoment * 2;
    beam.scale.y = 1 + Math.sin(elapsed * 8) * 0.05 * archMoment;
  }

  placeCreature(pathT);
  const slope = pathCurve.getTangentAt(pathT);
  const speed = 1.1 + Math.abs(slope.y) * 0.5;
  animateCreature(elapsed, speed, dt);
  updateCamera(elapsed);

  // Animate spores
  const sp = sporeGeo.attributes.position.array;
  for (let i = 0; i < sporeCount; i++) {
    sp[i * 3 + 1] += sporeVel[i].y;
    sp[i * 3] += Math.sin(elapsed + sporeVel[i].phase) * 0.002;
    if (sp[i * 3 + 1] > 16) sp[i * 3 + 1] = 1;
  }
  sporeGeo.attributes.position.needsUpdate = true;

  // Crystal shimmer
  for (let i = 0; i < crystals.length; i++) {
    const c = crystals[i];
    c.rotation.y += dt * (0.3 + i * 0.02);
    c.material.emissiveIntensity = 0.6 + Math.sin(elapsed * 2 + i) * 0.3;
  }

  // Sky color shift
  const skyT = (Math.sin(elapsed * 0.08) + 1) * 0.5;
  scene.background.lerpColors(new THREE.Color(0x0c0818), new THREE.Color(0x180818), skyT * 0.3);
  scene.fog.color.copy(scene.background);

  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

placeCreature(0);
animate();
</script>
</body>
</html>
