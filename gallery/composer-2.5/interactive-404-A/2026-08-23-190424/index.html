<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text: #e2e8f0;
      --muted: #64748b;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    canvas#stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .code {
      display: flex;
      gap: 0.15em;
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      user-select: none;
      cursor: default;
    }

    .digit {
      display: inline-block;
      background: linear-gradient(135deg, #818cf8 0%, #6366f1 40%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.15s ease-out;
      will-change: transform;
    }

    .digit.zero {
      position: relative;
    }

    .digit.zero::after {
      content: '';
      position: absolute;
      inset: 15% 20%;
      border: 3px solid rgba(99, 102, 241, 0.3);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    h1 {
      margin-top: 1.5rem;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      color: var(--text);
    }

    p {
      margin-top: 0.75rem;
      max-width: 28rem;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .hint {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: rgba(100, 116, 139, 0.6);
      animation: fadeIn 2s ease 1s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 0.75rem 1.25rem;
      background: rgba(30, 30, 45, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 0.75rem;
      font-size: 0.875rem;
      color: var(--text);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 10;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="container">
    <div class="code" id="code" aria-label="404">
      <span class="digit" data-tilt>4</span>
      <span class="digit zero" data-tilt>0</span>
      <span class="digit" data-tilt>4</span>
    </div>

    <h1>Lost in space</h1>
    <p>The page you're looking for drifted off into the void. It might have been moved, deleted, or never existed in this dimension.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary" id="homeBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to safety
      </a>
      <button type="button" class="btn btn-secondary" id="warpBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        Warp speed
      </button>
    </div>

    <p class="hint">Move your cursor — the digits follow you through the stars</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let w, h, stars = [], mouse = { x: 0.5, y: 0.5 };
      let warp = false;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        stars = Array.from({ length: Math.floor((w * h) / 8000) }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          z: Math.random() * 2 + 0.5,
          size: Math.random() * 1.5 + 0.5
        }));
      }

      function drawStars() {
        ctx.fillStyle = 'rgba(10, 10, 15, 0.25)';
        ctx.fillRect(0, 0, w, h);

        const cx = mouse.x * w;
        const cy = mouse.y * h;
        const speed = warp ? 12 : 1;

        for (const s of stars) {
          const dx = (s.x - cx) * 0.002 * s.z;
          const dy = (s.y - cy) * 0.002 * s.z;
          s.x += dx * speed;
          s.y += dy * speed;

          if (s.x < 0) s.x = w;
          if (s.x > w) s.x = 0;
          if (s.y < 0) s.y = h;
          if (s.y > h) s.y = 0;

          const alpha = warp ? 0.9 : 0.3 + s.z * 0.25;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * (warp ? 2 : 1), 0, Math.PI * 2);
          ctx.fillStyle = warp
            ? `rgba(167, 139, 250, ${alpha})`
            : `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();

          if (warp) {
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x - dx * 20, s.y - dy * 20);
            ctx.strokeStyle = `rgba(99, 102, 241, 0.4)`;
            ctx.lineWidth = s.size;
            ctx.stroke();
          }
        }
        requestAnimationFrame(drawStars);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX / w;
        mouse.y = e.clientY / h;

        document.querySelectorAll('[data-tilt]').forEach((el) => {
          const rect = el.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) / rect.width;
          const dy = (e.clientY - cy) / rect.height;
          el.style.transform = `translate(${dx * 12}px, ${dy * 12}px) rotateX(${-dy * 8}deg) rotateY(${dx * 8}deg)`;
        });
      });

      resize();
      drawStars();

      const toast = document.getElementById('toast');
      let toastTimer;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
      }

      document.getElementById('warpBtn').addEventListener('click', () => {
        warp = !warp;
        showToast(warp ? 'Engaging warp drive…' : 'Returning to impulse power');
      });

      document.getElementById('homeBtn').addEventListener('click', (e) => {
        if (window.history.length > 1) {
          e.preventDefault();
          window.history.back();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'W') {
          document.getElementById('warpBtn').click();
        }
      });
    })();
  </script>
</body>
</html>
