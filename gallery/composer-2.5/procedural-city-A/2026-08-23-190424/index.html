<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural City at Night</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
    canvas { display: block; }
    #overlay {
      position: fixed; bottom: 24px; left: 24px;
      color: rgba(180, 200, 255, 0.55);
      font: 12px/1.4 'Segoe UI', system-ui, sans-serif;
      pointer-events: none; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="overlay">Procedural City · Night</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ── Seeded RNG ──────────────────────────────────────────────
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(0xC17A2026);

    // ── Scene setup ─────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030312);
    scene.fog = new THREE.FogExp2(0x060818, 0.0045);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 800);
    camera.position.set(38, 28, 38);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 8;
    controls.maxDistance = 120;
    controls.target.set(0, 6, 0);

    // ── Post-processing bloom ───────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.55, 0.45, 0.15
    );
    composer.addPass(bloom);

    // ── Lighting ────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x1a2040, 0.35));
    const moonLight = new THREE.DirectionalLight(0x8899cc, 0.25);
    moonLight.position.set(-40, 80, -30);
    scene.add(moonLight);

    const cityGroup = new THREE.Group();
    scene.add(cityGroup);

    const animatedLights = [];
    const cars = [];
    const neonMeshes = [];

    const GRID = 14;
    const BLOCK = 10;
    const STREET = 4;
    const CELL = BLOCK + STREET;

    // ── Ground & streets ────────────────────────────────────────
    const groundGeo = new THREE.PlaneGeometry(GRID * CELL + 40, GRID * CELL + 40);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.95, metalness: 0.05 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    cityGroup.add(ground);

    function addStreetLines() {
      const lineMat = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 });
      const half = (GRID * CELL) / 2;
      for (let i = 0; i <= GRID; i++) {
        const pos = -half + i * CELL - STREET / 2;
        const hGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-half, 0.02, pos),
          new THREE.Vector3(half, 0.02, pos)
        ]);
        cityGroup.add(new THREE.Line(hGeo, lineMat));
        const vGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(pos, 0.02, -half),
          new THREE.Vector3(pos, 0.02, half)
        ]);
        cityGroup.add(new THREE.Line(vGeo, lineMat));
      }
    }
    addStreetLines();

    // ── Window texture atlas ────────────────────────────────────
    function createWindowTexture(litRatio) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#111118';
      ctx.fillRect(0, 0, 64, 64);
      const cols = 8, rows = 8;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (rand() < litRatio) {
            const warm = rand() > 0.3;
            ctx.fillStyle = warm
              ? `hsl(${38 + rand() * 18}, 80%, ${55 + rand() * 25}%)`
              : `hsl(${200 + rand() * 30}, 60%, ${45 + rand() * 20}%)`;
            ctx.fillRect(x * 8 + 1, y * 8 + 1, 6, 6);
          }
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ── Building generator ──────────────────────────────────────
    function createBuilding(x, z, seed) {
      const r = mulberry32(seed);
      const style = r();
      const w = 3 + Math.floor(r() * 4);
      const d = 3 + Math.floor(r() * 4);
      const floors = 4 + Math.floor(r() * 22);
      const h = floors * (1.1 + r() * 0.4);

      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const bodyColor = new THREE.Color().setHSL(0.62 + r() * 0.08, 0.15 + r() * 0.1, 0.08 + r() * 0.06);
      const winTex = createWindowTexture(0.35 + r() * 0.4);
      winTex.repeat.set(w * 1.2, h * 0.8);

      const bodyGeo = new THREE.BoxGeometry(w, h, d);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: bodyColor,
        map: winTex,
        emissive: 0x111122,
        emissiveMap: winTex,
        emissiveIntensity: 1.8,
        roughness: 0.85,
        metalness: 0.1
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = h / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Roof detail
      if (r() > 0.5) {
        const roofH = 0.8 + r() * 2;
        const roofGeo = new THREE.BoxGeometry(w * 0.85, roofH, d * 0.85);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.7, metalness: 0.3 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = h + roofH / 2;
        roof.castShadow = true;
        group.add(roof);
      }

      // Antenna / spire
      if (r() > 0.65 && h > 12) {
        const spireH = 2 + r() * 6;
        const spireGeo = new THREE.CylinderGeometry(0.08, 0.15, spireH, 6);
        const spireMat = new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.8, roughness: 0.3 });
        const spire = new THREE.Mesh(spireGeo, spireMat);
        spire.position.y = h + spireH / 2 + 0.5;
        group.add(spire);

        const blinkGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const blinkMat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
        const blink = new THREE.Mesh(blinkGeo, blinkMat);
        blink.position.y = h + spireH + 0.5;
        group.add(blink);
        animatedLights.push({ mesh: blink, phase: r() * Math.PI * 2, speed: 2 + r() * 3 });
      }

      // Neon sign
      if (r() > 0.55) {
        const neonColors = [0xff2266, 0x22ffaa, 0x4488ff, 0xffaa22, 0xcc44ff];
        const nc = neonColors[Math.floor(r() * neonColors.length)];
        const signW = w * 0.6;
        const signGeo = new THREE.PlaneGeometry(signW, 0.6);
        const signMat = new THREE.MeshBasicMaterial({ color: nc, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
        const sign = new THREE.Mesh(signGeo, signMat);
        sign.position.set(0, h * 0.3 + r() * h * 0.4, d / 2 + 0.06);
        group.add(sign);
        neonMeshes.push({ mesh: sign, base: nc, phase: r() * Math.PI * 2, speed: 1 + r() * 2 });
      }

      // Flickering windows (point lights)
      if (r() > 0.4) {
        const lightCount = 1 + Math.floor(r() * 3);
        for (let i = 0; i < lightCount; i++) {
          const pl = new THREE.PointLight(
            r() > 0.5 ? 0xffcc66 : 0x88bbff,
            0.3 + r() * 0.5, 8, 2
          );
          pl.position.set(
            (r() - 0.5) * w * 0.7,
            2 + r() * (h - 2),
            d / 2 + 0.5
          );
          group.add(pl);
          animatedLights.push({ mesh: pl, phase: r() * Math.PI * 2, speed: 0.5 + r() * 2, isLight: true });
        }
      }

      cityGroup.add(group);
      return { x, z, w, d, h };
    }

    // ── Populate city grid ──────────────────────────────────────
    const halfGrid = (GRID * CELL) / 2;
    const buildingInfos = [];

    for (let gx = 0; gx < GRID; gx++) {
      for (let gz = 0; gz < GRID; gz++) {
        if (rand() < 0.08) continue; // empty lot / park
        const cx = -halfGrid + gx * CELL + BLOCK / 2;
        const cz = -halfGrid + gz * CELL + BLOCK / 2;
        const offsetX = (rand() - 0.5) * 1.5;
        const offsetZ = (rand() - 0.5) * 1.5;
        const seed = (gx * 7919 + gz * 6271) ^ 0xDEADBEEF;
        buildingInfos.push(createBuilding(cx + offsetX, cz + offsetZ, seed));
      }
    }

    // ── Street lamps ────────────────────────────────────────────
    function addStreetLamp(x, z) {
      const poleGeo = new THREE.CylinderGeometry(0.06, 0.08, 5, 6);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x333340, metalness: 0.6, roughness: 0.5 });
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(x, 2.5, z);
      cityGroup.add(pole);

      const armGeo = new THREE.BoxGeometry(1.2, 0.08, 0.08);
      const arm = new THREE.Mesh(armGeo, poleMat);
      arm.position.set(x + 0.5, 4.8, z);
      cityGroup.add(arm);

      const bulbGeo = new THREE.SphereGeometry(0.18, 8, 8);
      const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffeeaa });
      const bulb = new THREE.Mesh(bulbGeo, bulbMat);
      bulb.position.set(x + 1, 4.7, z);
      cityGroup.add(bulb);

      const sl = new THREE.PointLight(0xffdd88, 1.2, 14, 2);
      sl.position.set(x + 1, 4.5, z);
      sl.castShadow = true;
      sl.shadow.mapSize.set(256, 256);
      cityGroup.add(sl);
    }

    for (let i = -halfGrid; i <= halfGrid; i += CELL) {
      for (let j = -halfGrid + CELL / 2; j <= halfGrid; j += CELL / 2) {
        if (rand() > 0.35) addStreetLamp(i + STREET / 2, j);
        if (rand() > 0.35) addStreetLamp(j, i + STREET / 2);
      }
    }

    // ── Moving cars ─────────────────────────────────────────────
    function createCar(color, speed, axis, lanePos, direction) {
      const carGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.6, 0.5, 0.9);
      const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.6, roughness: 0.35 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.35;
      body.castShadow = true;
      carGroup.add(body);

      const cabinGeo = new THREE.BoxGeometry(0.9, 0.35, 0.75);
      const cabin = new THREE.Mesh(cabinGeo, bodyMat);
      cabin.position.set(-0.1, 0.72, 0);
      carGroup.add(cabin);

      const headGeo = new THREE.BoxGeometry(0.15, 0.12, 0.6);
      const headMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
      const headL = new THREE.Mesh(headGeo, headMat);
      headL.position.set(0.85, 0.35, 0.22);
      carGroup.add(headL);
      const headR = headL.clone();
      headR.position.z = -0.22;
      carGroup.add(headR);

      const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
      const tailL = new THREE.Mesh(headGeo, tailMat);
      tailL.position.set(-0.85, 0.35, 0.22);
      carGroup.add(tailL);
      const tailR = tailL.clone();
      tailR.position.z = -0.22;
      carGroup.add(tailR);

      const hl = new THREE.SpotLight(0xffffdd, 3, 12, Math.PI / 6, 0.5, 2);
      hl.position.set(0.9, 0.35, 0);
      hl.target.position.set(3, 0, 0);
      carGroup.add(hl);
      carGroup.add(hl.target);

      carGroup.position.set(
        axis === 'x' ? -halfGrid - 5 : lanePos,
        0.05,
        axis === 'z' ? -halfGrid - 5 : lanePos
      );
      if (direction < 0) carGroup.rotation.y = Math.PI;

      cityGroup.add(carGroup);
      cars.push({ group: carGroup, speed, axis, lanePos, direction, limit: halfGrid + 5 });
    }

    for (let i = 0; i < 18; i++) {
      const axis = rand() > 0.5 ? 'x' : 'z';
      const lane = -halfGrid + Math.floor(rand() * GRID) * CELL + (rand() > 0.5 ? STREET * 0.3 : STREET * 0.7);
      const dir = rand() > 0.5 ? 1 : -1;
      const colors = [0xcc2222, 0xeeeeee, 0x2244aa, 0x333333, 0xffcc00, 0x44aa66];
      createCar(colors[Math.floor(rand() * colors.length)], 0.06 + rand() * 0.12, axis, lane, dir);
    }

    // ── Stars ───────────────────────────────────────────────────
    (function addStars() {
      const count = 2500;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const theta = rand() * Math.PI * 2;
        const phi = rand() * Math.PI * 0.45;
        const r = 180 + rand() * 60;
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0.7, sizeAttenuation: true });
      scene.add(new THREE.Points(starGeo, starMat));
    })();

    // ── Moon ────────────────────────────────────────────────────
    (function addMoon() {
      const moonGeo = new THREE.SphereGeometry(4, 32, 32);
      const moonMat = new THREE.MeshBasicMaterial({ color: 0xddeeff });
      const moon = new THREE.Mesh(moonGeo, moonMat);
      moon.position.set(-60, 90, -70);
      scene.add(moon);

      const glowGeo = new THREE.SphereGeometry(6, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0x446688, transparent: true, opacity: 0.15 });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.position.copy(moon.position);
      scene.add(glow);
    })();

    // ── Distant skyline silhouette ──────────────────────────────
    (function addSkyline() {
      const skylineGroup = new THREE.Group();
      for (let i = 0; i < 80; i++) {
        const bw = 2 + rand() * 5;
        const bh = 15 + rand() * 50;
        const bx = -120 + i * 3 + rand() * 2;
        const geo = new THREE.BoxGeometry(bw, bh, 4);
        const mat = new THREE.MeshBasicMaterial({ color: 0x08081a });
        const b = new THREE.Mesh(geo, mat);
        b.position.set(bx, bh / 2, -90 - rand() * 20);
        skylineGroup.add(b);
      }
      scene.add(skylineGroup);
    })();

    // ── Helicopter ────────────────────────────────────────────────
    const heli = new THREE.Group();
    const heliBodyGeo = new THREE.BoxGeometry(1.2, 0.5, 0.6);
    const heliMat = new THREE.MeshStandardMaterial({ color: 0x334455, metalness: 0.5, roughness: 0.4 });
    heli.add(new THREE.Mesh(heliBodyGeo, heliMat));
    const rotorGeo = new THREE.BoxGeometry(4, 0.04, 0.15);
    const rotorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const rotor = new THREE.Mesh(rotorGeo, rotorMat);
    rotor.position.y = 0.4;
    heli.add(rotor);
    const heliLight = new THREE.PointLight(0xff0000, 0.8, 6);
    heliLight.position.set(0, 0.2, -0.4);
    heli.add(heliLight);
    heli.position.set(20, 35, 10);
    scene.add(heli);

    // ── Animation loop ──────────────────────────────────────────
    const clock = new THREE.Clock();
    let heliAngle = 0;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = clock.getDelta();

      // Flickering lights & neon
      for (const item of animatedLights) {
        const flicker = 0.5 + 0.5 * Math.sin(t * item.speed + item.phase);
        if (item.isLight) {
          item.mesh.intensity = 0.15 + flicker * 0.5;
        } else {
          item.mesh.material.opacity = flicker > 0.3 ? 1 : 0.2;
        }
      }

      for (const n of neonMeshes) {
        const pulse = 0.6 + 0.4 * Math.sin(t * n.speed + n.phase);
        n.mesh.material.opacity = pulse;
        n.mesh.material.color.setHex(n.base);
        n.mesh.material.color.multiplyScalar(0.7 + pulse * 0.5);
      }

      // Cars
      for (const car of cars) {
        if (car.axis === 'x') {
          car.group.position.x += car.speed * car.direction;
          car.group.position.z = car.lanePos;
          if (Math.abs(car.group.position.x) > car.limit) {
            car.group.position.x = -car.limit * car.direction;
          }
        } else {
          car.group.position.z += car.speed * car.direction;
          car.group.position.x = car.lanePos;
          if (Math.abs(car.group.position.z) > car.limit) {
            car.group.position.z = -car.limit * car.direction;
          }
        }
      }

      // Helicopter orbit
      heliAngle += dt * 0.15;
      heli.position.x = Math.cos(heliAngle) * 45;
      heli.position.z = Math.sin(heliAngle) * 45;
      heli.position.y = 30 + Math.sin(t * 0.8) * 3;
      heli.rotation.y = -heliAngle + Math.PI / 2;
      rotor.rotation.y = t * 15;

      // Gentle camera drift when idle
      if (!controls.enabled || true) {
        camera.position.x += Math.sin(t * 0.08) * 0.008;
        camera.position.z += Math.cos(t * 0.06) * 0.008;
      }

      controls.update();
      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.resolution.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
