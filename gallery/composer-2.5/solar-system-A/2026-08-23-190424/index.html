<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniature Solar System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="info">Miniature Solar System · drag to orbit · scroll to zoom</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 28, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 8;
    controls.maxDistance = 120;

    // Starfield
    const starCount = 3000;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 80 + Math.random() * 120;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, sizeAttenuation: true })
    );
    scene.add(stars);

    // Sun
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xffcc33 })
    );
    scene.add(sun);

    const sunGlow = new THREE.Mesh(
      new THREE.SphereGeometry(2.8, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.15 })
    );
    scene.add(sunGlow);

    const sunLight = new THREE.PointLight(0xfff4cc, 3, 200);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x222244, 0.4));

    // Planet data: name, radius, orbitRadius, orbitSpeed, color, tilt, hasRing
    const planetDefs = [
      { name: 'Mercury', radius: 0.28, orbit: 5, speed: 4.8, color: 0xaaaaaa, tilt: 0 },
      { name: 'Venus', radius: 0.45, orbit: 7, speed: 3.5, color: 0xe8cda0, tilt: 177 },
      { name: 'Earth', radius: 0.5, orbit: 9.5, speed: 3.0, color: 0x4488cc, tilt: 23 },
      { name: 'Mars', radius: 0.38, orbit: 12, speed: 2.4, color: 0xcc5533, tilt: 25 },
      { name: 'Jupiter', radius: 1.1, orbit: 16, speed: 1.3, color: 0xd4a574, tilt: 3 },
      { name: 'Saturn', radius: 0.95, orbit: 20, speed: 1.0, color: 0xe8d5a3, tilt: 27, ring: true },
      { name: 'Uranus', radius: 0.7, orbit: 24, speed: 0.7, color: 0x88ccdd, tilt: 98 },
      { name: 'Neptune', radius: 0.68, orbit: 28, speed: 0.55, color: 0x3355aa, tilt: 28 },
    ];

    const planets = [];

    planetDefs.forEach((def) => {
      const pivot = new THREE.Object3D();
      scene.add(pivot);

      const orbitLine = new THREE.Mesh(
        new THREE.RingGeometry(def.orbit - 0.02, def.orbit + 0.02, 128),
        new THREE.MeshBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
      );
      orbitLine.rotation.x = -Math.PI / 2;
      scene.add(orbitLine);

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(def.radius, 32, 32),
        new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.85, metalness: 0.05 })
      );
      body.position.x = def.orbit;
      body.rotation.z = (def.tilt * Math.PI) / 180;
      pivot.add(body);

      if (def.ring) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(def.radius * 1.4, def.radius * 2.2, 64),
          new THREE.MeshBasicMaterial({ color: 0xc9b896, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
        );
        ring.rotation.x = Math.PI / 2;
        body.add(ring);
      }

      // Earth's moon
      if (def.name === 'Earth') {
        const moonPivot = new THREE.Object3D();
        body.add(moonPivot);
        const moon = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 1 })
        );
        moon.position.x = 1.1;
        moonPivot.add(moon);
        planets.push({ pivot, body, moonPivot, moonSpeed: 8, ...def });
      } else {
        planets.push({ pivot, body, moonPivot: null, moonSpeed: 0, ...def });
      }
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      sun.rotation.y = t * 0.15;
      sunGlow.scale.setScalar(1 + Math.sin(t * 2) * 0.04);

      planets.forEach((p) => {
        p.pivot.rotation.y = t * p.speed * 0.12;
        p.body.rotation.y = t * 0.8;
        if (p.moonPivot) {
          p.moonPivot.rotation.y = t * p.moonSpeed * 0.12;
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
