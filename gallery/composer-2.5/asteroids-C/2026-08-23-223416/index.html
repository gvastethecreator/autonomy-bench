<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTEROIDS // VOID DRIFT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #020208;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W, H, cx, cy;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Audio ──────────────────────────────────────────────
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function playTone(freq, dur, type = 'square', vol = 0.08, decay = 0.015) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur + 0.05);
  }
  function sfxShoot() { playTone(880, 0.06, 'square', 0.05); }
  function sfxExplode(size) {
    const f = 60 + size * 20;
    playTone(f, 0.15 + size * 0.05, 'sawtooth', 0.1);
    playTone(f * 0.5, 0.2 + size * 0.08, 'triangle', 0.06);
  }
  function sfxThrust() { playTone(55, 0.04, 'sawtooth', 0.02); }
  function sfxHit() { playTone(200, 0.3, 'sawtooth', 0.12); }
  function sfxLevelUp() {
    [440, 554, 659, 880].forEach((f, i) => setTimeout(() => playTone(f, 0.12, 'sine', 0.07), i * 80));
  }
  function sfxDeath() {
    [660, 440, 220, 110].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sawtooth', 0.1), i * 120));
  }

  // ── Input ──────────────────────────────────────────────
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && state === 'title') startGame();
    if (e.code === 'Space' && state === 'gameover') { score = 0; level = 1; lives = 3; startGame(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // ── Utilities ──────────────────────────────────────────
  const TAU = Math.PI * 2;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function wrap(x, y) {
    let wx = x, wy = y;
    if (wx < 0) wx += W; if (wx > W) wx -= W;
    if (wy < 0) wy += H; if (wy > H) wy -= H;
    return [wx, wy];
  }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // ── Starfield ──────────────────────────────────────────
  const stars = [];
  const nebulae = [];
  function initBackground() {
    stars.length = 0;
    nebulae.length = 0;
    for (let i = 0; i < 280; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: Math.random(), brightness: rand(0.2, 1),
        twinkle: rand(0, TAU), speed: rand(0.002, 0.008)
      });
    }
    for (let i = 0; i < 5; i++) {
      nebulae.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(120, 280),
        hue: rand(200, 280),
        alpha: rand(0.015, 0.04)
      });
    }
  }
  initBackground();

  function drawBackground(dt) {
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(0.5, '#060610');
    grad.addColorStop(1, '#020208');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (const n of nebulae) {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      g.addColorStop(0, `hsla(${n.hue}, 60%, 40%, ${n.alpha})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
    }

    for (const s of stars) {
      s.twinkle += s.speed;
      const b = s.brightness * (0.6 + 0.4 * Math.sin(s.twinkle));
      const sz = (0.5 + s.z * 1.5) * b;
      ctx.fillStyle = `rgba(${180 + s.z * 75}, ${190 + s.z * 65}, 255, ${b * 0.8})`;
      ctx.fillRect(s.x, s.y, sz, sz);
    }
  }

  // ── Particles ──────────────────────────────────────────
  const particles = [];
  function spawnParticles(x, y, count, color, speed, life, size) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const sp = rand(0.5, 1) * speed;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rand(0.5, 1) * life, maxLife: life,
        size: rand(0.5, 1.5) * size, color
      });
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.97; p.vy *= 0.97;
      [p.x, p.y] = wrap(p.x, p.y);
    }
  }
  function drawParticles() {
    for (const p of particles) {
      const t = p.life / p.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * t, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // ── Ship ───────────────────────────────────────────────
  class Ship {
    constructor() {
      this.reset();
      this.invincible = 0;
      this.dead = false;
    }
    reset() {
      this.x = cx; this.y = cy;
      this.vx = 0; this.vy = 0;
      this.angle = -Math.PI / 2;
      this.radius = 14;
      this.thrusting = false;
      this.shootCooldown = 0;
    }
    update(dt) {
      if (this.dead) return;
      if (this.invincible > 0) this.invincible -= dt;

      const rotSpeed = 4.5;
      if (keys['ArrowLeft'] || keys['KeyA']) this.angle -= rotSpeed * dt;
      if (keys['ArrowRight'] || keys['KeyD']) this.angle += rotSpeed * dt;

      this.thrusting = keys['ArrowUp'] || keys['KeyW'];
      if (this.thrusting) {
        const thrust = 280;
        this.vx += Math.cos(this.angle) * thrust * dt;
        this.vy += Math.sin(this.angle) * thrust * dt;
        if (Math.random() < 0.4) sfxThrust();
        const tx = this.x - Math.cos(this.angle) * 18;
        const ty = this.y - Math.sin(this.angle) * 18;
        spawnParticles(tx, ty, 2, '#ff8844', 80, 0.3, 2);
        spawnParticles(tx, ty, 1, '#ffcc66', 60, 0.2, 1.5);
      }

      const maxSpeed = 420;
      const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (spd > maxSpeed) {
        this.vx = (this.vx / spd) * maxSpeed;
        this.vy = (this.vy / spd) * maxSpeed;
      }

      this.vx *= 0.992;
      this.vy *= 0.992;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      [this.x, this.y] = wrap(this.x, this.y);

      if (this.shootCooldown > 0) this.shootCooldown -= dt;
      if (keys['Space'] && this.shootCooldown <= 0) {
        this.shoot();
        this.shootCooldown = 0.18;
      }
    }
    shoot() {
      const bx = this.x + Math.cos(this.angle) * 20;
      const by = this.y + Math.sin(this.angle) * 20;
      bullets.push(new Bullet(bx, by, this.angle, this.vx, this.vy));
      sfxShoot();
      this.vx -= Math.cos(this.angle) * 15;
      this.vy -= Math.sin(this.angle) * 15;
    }
    draw() {
      if (this.dead) return;
      if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#44ddff';

      // Ship body
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-12, -10);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-12, 10);
      ctx.closePath();
      ctx.fillStyle = '#aaddff';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Cockpit
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-2, -3);
      ctx.lineTo(-2, 3);
      ctx.closePath();
      ctx.fillStyle = '#2266aa';
      ctx.fill();

      // Engine glow when thrusting
      if (this.thrusting) {
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ff6622';
        ctx.beginPath();
        ctx.moveTo(-10, -4);
        ctx.lineTo(-10 - rand(8, 16), 0);
        ctx.lineTo(-10, 4);
        ctx.closePath();
        ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100 | 0}, 50, 0.9)`;
        ctx.fill();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }
    hit() {
      if (this.invincible > 0 || this.dead) return;
      sfxHit();
      spawnParticles(this.x, this.y, 30, '#44ddff', 200, 0.8, 3);
      spawnParticles(this.x, this.y, 15, '#ffffff', 150, 0.5, 2);
      screenShake = 0.4;
      lives--;
      if (lives <= 0) {
        this.dead = true;
        gameOver();
      } else {
        this.reset();
        this.invincible = 2.5;
      }
    }
  }

  // ── Bullets ────────────────────────────────────────────
  class Bullet {
    constructor(x, y, angle, svx, svy) {
      this.x = x; this.y = y;
      const speed = 550;
      this.vx = Math.cos(angle) * speed + svx * 0.3;
      this.vy = Math.sin(angle) * speed + svy * 0.3;
      this.life = 1.2;
      this.radius = 2;
    }
    update(dt) {
      this.life -= dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      [this.x, this.y] = wrap(this.x, this.y);
    }
    draw() {
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffff88';
      ctx.fillStyle = '#ffffcc';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, TAU);
      ctx.fill();
      // Trail
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#ffaa44';
      ctx.beginPath();
      ctx.arc(this.x - this.vx * 0.008, this.y - this.vy * 0.008, this.radius * 0.7, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Asteroids ──────────────────────────────────────────
  function makeAsteroidShape(r, verts) {
    const points = [];
    for (let i = 0; i < verts; i++) {
      const a = (i / verts) * TAU;
      const r2 = r * rand(0.65, 1.0);
      points.push({ x: Math.cos(a) * r2, y: Math.sin(a) * r2 });
    }
    return points;
  }

  class Asteroid {
    constructor(x, y, size) {
      this.x = x; this.y = y;
      this.size = size; // 3=large, 2=medium, 1=small
      this.radius = [0, 14, 28, 48][size];
      this.points = makeAsteroidShape(this.radius, 8 + size * 2);
      this.vx = rand(-80, 80);
      this.vy = rand(-80, 80);
      if (this.size === 3) { this.vx *= 0.6; this.vy *= 0.6; }
      this.rotation = rand(0, TAU);
      this.rotSpeed = rand(-1.5, 1.5);
      this.hue = rand(20, 45);
      this.dead = false;
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.rotation += this.rotSpeed * dt;
      [this.x, this.y] = wrap(this.x, this.y);
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      const r = this.radius;
      ctx.shadowBlur = 6;
      ctx.shadowColor = `hsl(${this.hue}, 30%, 30%)`;

      ctx.beginPath();
      ctx.moveTo(this.points[0].x, this.points[0].y);
      for (let i = 1; i < this.points.length; i++) {
        ctx.lineTo(this.points[i].x, this.points[i].y);
      }
      ctx.closePath();

      const grad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, 0, 0, 0, r);
      grad.addColorStop(0, `hsl(${this.hue}, 25%, ${35 + this.size * 5}%)`);
      grad.addColorStop(0.7, `hsl(${this.hue}, 20%, ${22 + this.size * 3}%)`);
      grad.addColorStop(1, `hsl(${this.hue}, 15%, 12%)`);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = `hsla(${this.hue}, 20%, 50%, 0.5)`;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Crater details
      ctx.fillStyle = `hsla(${this.hue}, 15%, 18%, 0.6)`;
      for (let i = 0; i < this.size + 1; i++) {
        const ca = rand(0, TAU);
        const cr = r * rand(0.15, 0.4);
        ctx.beginPath();
        ctx.arc(Math.cos(ca) * cr, Math.sin(ca) * cr, r * rand(0.06, 0.12), 0, TAU);
        ctx.fill();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }
    destroy() {
      this.dead = true;
      sfxExplode(this.size);
      const colors = [`hsl(${this.hue}, 40%, 50%)`, '#aa8866', '#665544'];
      spawnParticles(this.x, this.y, 8 + this.size * 6, colors[0], 120 + this.size * 40, 0.6 + this.size * 0.2, 2 + this.size);
      spawnParticles(this.x, this.y, 4 + this.size * 3, colors[1], 80, 0.4, 1.5);

      const pts = [0, 100, 200, 400][this.size];
      score += pts;
      scorePopups.push({ x: this.x, y: this.y, text: '+' + pts, life: 1.0 });

      if (this.size > 1) {
        for (let i = 0; i < 2; i++) {
          const a = rand(0, TAU);
          const child = new Asteroid(
            this.x + Math.cos(a) * 10,
            this.y + Math.sin(a) * 10,
            this.size - 1
          );
          child.vx = this.vx + Math.cos(a) * rand(40, 100);
          child.vy = this.vy + Math.sin(a) * rand(40, 100);
          asteroids.push(child);
        }
      }
    }
  }

  function spawnAsteroids(count, avoidX, avoidY) {
    for (let i = 0; i < count; i++) {
      let x, y, d;
      do {
        x = rand(0, W);
        y = rand(0, H);
        d = dist(x, y, avoidX || cx, avoidY || cy);
      } while (d < 180);
      asteroids.push(new Asteroid(x, y, 3));
    }
  }

  // ── UFO (bonus enemy) ──────────────────────────────────
  class UFO {
    constructor() {
      this.x = Math.random() < 0.5 ? -30 : W + 30;
      this.y = rand(H * 0.1, H * 0.9);
      this.vx = this.x < 0 ? rand(60, 120) : rand(-120, -60);
      this.vy = rand(-30, 30);
      this.radius = 16;
      this.shootTimer = rand(1.5, 3);
      this.dead = false;
      this.wobble = rand(0, TAU);
    }
    update(dt) {
      this.wobble += dt * 3;
      this.y += Math.sin(this.wobble) * 20 * dt;
      this.x += this.vx * dt;
      this.shootTimer -= dt;
      if (this.shootTimer <= 0) {
        this.shootTimer = rand(2, 4);
        if (ship && !ship.dead) {
          const a = Math.atan2(ship.y - this.y, ship.x - this.x);
          enemyBullets.push(new EnemyBullet(this.x, this.y, a));
        }
      }
      if (this.x < -60 || this.x > W + 60) this.dead = true;
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff4466';

      // Saucer body
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 7, 0, 0, TAU);
      ctx.fillStyle = '#cc2244';
      ctx.fill();
      ctx.strokeStyle = '#ff6688';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Dome
      ctx.beginPath();
      ctx.arc(0, -4, 8, Math.PI, 0);
      ctx.fillStyle = 'rgba(100, 200, 255, 0.5)';
      ctx.fill();
      ctx.strokeStyle = '#88ccff';
      ctx.stroke();

      // Lights
      const t = Date.now() * 0.005;
      for (let i = -2; i <= 2; i++) {
        const c = ['#ff0000', '#ffff00', '#00ff00', '#ffff00', '#ff0000'][i + 2];
        ctx.fillStyle = c;
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t + i);
        ctx.beginPath();
        ctx.arc(i * 7, 2, 2, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.shadowBlur = 0;
    }
    destroy() {
      this.dead = true;
      sfxExplode(2);
      spawnParticles(this.x, this.y, 20, '#ff4466', 150, 0.7, 2.5);
      score += 500;
      scorePopups.push({ x: this.x, y: this.y, text: '+500', life: 1.2 });
    }
  }

  class EnemyBullet {
    constructor(x, y, angle) {
      this.x = x; this.y = y;
      const speed = 250;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 3;
      this.radius = 3;
    }
    update(dt) {
      this.life -= dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }
    draw() {
      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff2244';
      ctx.fillStyle = '#ff4466';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Game State ─────────────────────────────────────────
  let state = 'title'; // title, playing, levelTransition, gameover
  let ship, bullets, asteroids, ufos, enemyBullets;
  let score = 0, level = 1, lives = 3;
  let screenShake = 0;
  let scorePopups = [];
  let levelTransitionTimer = 0;
  let ufoTimer = 0;
  let highScore = parseInt(localStorage.getItem('asteroids_hs') || '0');
  let gameTime = 0;
  let titlePulse = 0;

  function startGame() {
    initAudio();
    state = 'playing';
    ship = new Ship();
    bullets = [];
    asteroids = [];
    ufos = [];
    enemyBullets = [];
    scorePopups = [];
    screenShake = 0;
    gameTime = 0;
    ufoTimer = rand(8, 15);
    spawnAsteroids(3 + level, ship.x, ship.y);
  }

  function nextLevel() {
    state = 'levelTransition';
    levelTransitionTimer = 2.0;
    level++;
    sfxLevelUp();
    bullets = [];
    enemyBullets = [];
    ufos = [];
    ship.reset();
    ship.invincible = 2;
  }

  function gameOver() {
    state = 'gameover';
    sfxDeath();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('asteroids_hs', highScore);
    }
    spawnParticles(ship.x, ship.y, 50, '#44ddff', 250, 1.2, 4);
    spawnParticles(ship.x, ship.y, 30, '#ffffff', 180, 0.8, 2);
    screenShake = 0.6;
  }

  // ── Collision ──────────────────────────────────────────
  function checkCollisions() {
    // Bullets vs asteroids
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (dist(b.x, b.y, a.x, a.y) < a.radius + b.radius) {
          a.destroy();
          asteroids.splice(j, 1);
          bullets.splice(i, 1);
          break;
        }
      }
    }

    // Bullets vs UFOs
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = ufos.length - 1; j >= 0; j--) {
        const u = ufos[j];
        if (dist(b.x, b.y, u.x, u.y) < u.radius + b.radius) {
          u.destroy();
          ufos.splice(j, 1);
          bullets.splice(i, 1);
          break;
        }
      }
    }

    if (!ship || ship.dead || ship.invincible > 0) return;

    // Ship vs asteroids
    for (const a of asteroids) {
      if (dist(ship.x, ship.y, a.x, a.y) < a.radius + ship.radius - 4) {
        ship.hit();
        return;
      }
    }

    // Ship vs UFOs
    for (const u of ufos) {
      if (dist(ship.x, ship.y, u.x, u.y) < u.radius + ship.radius - 2) {
        ship.hit();
        return;
      }
    }

    // Ship vs enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const eb = enemyBullets[i];
      if (dist(ship.x, ship.y, eb.x, eb.y) < ship.radius + eb.radius) {
        enemyBullets.splice(i, 1);
        ship.hit();
        return;
      }
    }
  }

  // ── HUD ────────────────────────────────────────────────
  function drawHUD() {
    ctx.save();
    ctx.font = '600 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE', 24, 32);
    ctx.font = '700 28px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#44ddff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#44ddff';
    ctx.fillText(String(score).padStart(6, '0'), 24, 62);

    ctx.shadowBlur = 0;
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'right';
    ctx.fillText('HIGH', W - 24, 32);
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255, 200, 100, 0.8)';
    ctx.fillText(String(highScore).padStart(6, '0'), W - 24, 58);

    // Lives
    ctx.textAlign = 'center';
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('LIVES', cx, 32);
    for (let i = 0; i < lives; i++) {
      const lx = cx + (i - (lives - 1) / 2) * 28;
      drawMiniShip(lx, 52, 0.7);
    }

    // Level
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`WAVE ${level}`, 24, H - 24);

    ctx.restore();
  }

  function drawMiniShip(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-Math.PI / 2);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#44ddff';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-6, -6);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-6, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawScorePopups(dt) {
    for (let i = scorePopups.length - 1; i >= 0; i--) {
      const p = scorePopups[i];
      p.life -= dt;
      if (p.life <= 0) { scorePopups.splice(i, 1); continue; }
      const t = p.life;
      ctx.save();
      ctx.globalAlpha = Math.min(1, t * 2);
      ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#ffcc44';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ffcc44';
      ctx.fillText(p.text, p.x, p.y - (1 - t) * 40);
      ctx.restore();
    }
  }

  // ── Title / Game Over screens ──────────────────────────
  function drawTitle() {
    titlePulse += 0.02;
    const pulse = 0.85 + 0.15 * Math.sin(titlePulse * 2);

    ctx.save();
    ctx.textAlign = 'center';

    // Title
    ctx.font = '900 64px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = `rgba(68, 221, 255, ${pulse})`;
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#44ddff';
    ctx.fillText('ASTEROIDS', cx, cy - 60);

    ctx.font = '300 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255, 200, 100, 0.7)';
    ctx.shadowBlur = 0;
    ctx.fillText('VOID DRIFT', cx, cy - 20);

    // Decorative asteroids in title
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 3; i++) {
      const ax = cx + Math.cos(titlePulse + i * 2) * (180 + i * 40);
      const ay = cy + Math.sin(titlePulse * 0.7 + i * 2) * (80 + i * 30);
      ctx.beginPath();
      const r = 20 + i * 8;
      for (let j = 0; j < 7; j++) {
        const a = (j / 7) * TAU + titlePulse;
        const rr = r * (0.7 + 0.3 * Math.sin(j * 1.7));
        const px = ax + Math.cos(a) * rr;
        const py = ay + Math.sin(a) * rr;
        j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = '#886644';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Instructions
    ctx.font = '400 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('ARROWS / WASD — MOVE    SPACE — FIRE', cx, cy + 50);

    ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + 0.4 * pulse})`;
    ctx.fillText('[ PRESS SPACE TO START ]', cx, cy + 100);

    if (highScore > 0) {
      ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
      ctx.fillText(`HIGH SCORE: ${highScore}`, cx, cy + 140);
    }

    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    ctx.textAlign = 'center';

    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.font = '900 52px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ff4466';
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#ff2244';
    ctx.fillText('GAME OVER', cx, cy - 40);

    ctx.shadowBlur = 0;
    ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`FINAL SCORE: ${score}`, cx, cy + 10);

    ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255, 200, 100, 0.7)';
    ctx.fillText(`HIGH SCORE: ${highScore}`, cx, cy + 40);
    ctx.fillText(`WAVES SURVIVED: ${level}`, cx, cy + 65);

    titlePulse += 0.02;
    const pulse = 0.4 + 0.4 * Math.sin(titlePulse * 2);
    ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    ctx.fillText('[ PRESS SPACE TO RETRY ]', cx, cy + 110);

    ctx.restore();
  }

  function drawLevelTransition(dt) {
    ctx.save();
    ctx.textAlign = 'center';
    const t = levelTransitionTimer;
    const alpha = t > 1.5 ? (2 - t) * 2 : t < 0.5 ? t * 2 : 1;

    ctx.globalAlpha = alpha;
    ctx.font = '800 48px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#44ddff';
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#44ddff';
    ctx.fillText(`WAVE ${level}`, cx, cy - 10);

    ctx.font = '400 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 0;
    ctx.fillText('GET READY', cx, cy + 30);
    ctx.restore();
  }

  // ── Screen border glow ─────────────────────────────────
  function drawBorder() {
    const g = 20;
    const grd = ctx.createLinearGradient(0, 0, W, 0);
    grd.addColorStop(0, 'rgba(68, 221, 255, 0.08)');
    grd.addColorStop(0.5, 'transparent');
    grd.addColorStop(1, 'rgba(68, 221, 255, 0.08)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, g);
    ctx.fillRect(0, H - g, W, g);
  }

  // ── Main Loop ──────────────────────────────────────────
  let lastTime = 0;
  function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    // Screen shake
    let shakeX = 0, shakeY = 0;
    if (screenShake > 0) {
      screenShake -= dt;
      const intensity = screenShake * 12;
      shakeX = (Math.random() - 0.5) * intensity;
      shakeY = (Math.random() - 0.5) * intensity;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawBackground(dt);

    if (state === 'title') {
      // Ambient asteroids on title
      if (asteroids.length === 0) {
        for (let i = 0; i < 6; i++) {
          asteroids.push(new Asteroid(rand(0, W), rand(0, H), rand(1, 3) | 0));
        }
      }
      for (const a of asteroids) { a.update(dt * 0.3); a.draw(); }
      drawTitle();
    }
    else if (state === 'playing') {
      gameTime += dt;

      ship.update(dt);

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update(dt);
        if (bullets[i].life <= 0) bullets.splice(i, 1);
      }

      for (const a of asteroids) a.update(dt);

      ufoTimer -= dt;
      if (ufoTimer <= 0) {
        ufos.push(new UFO());
        ufoTimer = rand(12, 25);
      }
      for (let i = ufos.length - 1; i >= 0; i--) {
        ufos[i].update(dt);
        if (ufos[i].dead) ufos.splice(i, 1);
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].update(dt);
        if (enemyBullets[i].life <= 0) enemyBullets.splice(i, 1);
      }

      checkCollisions();
      updateParticles(dt);

      // Level complete
      if (asteroids.length === 0) nextLevel();

      // Draw entities
      for (const a of asteroids) a.draw();
      for (const u of ufos) u.draw();
      for (const eb of enemyBullets) eb.draw();
      for (const b of bullets) b.draw();
      ship.draw();
      drawParticles();
      drawScorePopups(dt);
      drawHUD();
      drawBorder();
    }
    else if (state === 'levelTransition') {
      levelTransitionTimer -= dt;
      ship.draw();
      drawParticles();
      updateParticles(dt);
      drawLevelTransition(dt);
      drawHUD();

      if (levelTransitionTimer <= 0) {
        state = 'playing';
        spawnAsteroids(2 + level, ship.x, ship.y);
        ufoTimer = rand(8, 15);
      }
    }
    else if (state === 'gameover') {
      updateParticles(dt);
      for (const a of asteroids) { a.update(dt * 0.2); a.draw(); }
      drawParticles();
      drawGameOver();
    }

    ctx.restore();
    requestAnimationFrame(loop);
  }

  // Init title asteroids
  asteroids = [];
  bullets = [];
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
