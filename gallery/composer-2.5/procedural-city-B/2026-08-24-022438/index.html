<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Horizon — Procedural City at Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 100%, transparent 50%, rgba(0,0,8,0.55) 100%);
  }
  #title {
    position: fixed; top: 28px; left: 32px; pointer-events: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: rgba(200, 220, 255, 0.85);
    letter-spacing: 0.35em; text-transform: uppercase; font-size: 11px; font-weight: 300;
    text-shadow: 0 0 20px rgba(100, 180, 255, 0.4);
    opacity: 0; animation: fadeIn 3s ease 1s forwards;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    pointer-events: none; font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 11px; color: rgba(160, 180, 210, 0.45); letter-spacing: 0.12em;
    opacity: 0; animation: fadeIn 2s ease 4s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title">Neon Horizon</div>
<div id="hint">Click &amp; drag to look · Scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ── Seeded RNG ──────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xC17A2024);

function rand(min, max) { return min + rng() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

// ── Scene setup ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020210);
scene.fog = new THREE.FogExp2(0x080818, 0.008);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 800);
camera.position.set(60, 45, 80);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 15;
controls.maxDistance = 200;
controls.target.set(0, 8, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

// ── Post-processing ─────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55, 0.5, 0.82
);
composer.addPass(bloom);

// ── Lighting ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2040, 0.35));

const moonLight = new THREE.DirectionalLight(0x8899cc, 0.25);
moonLight.position.set(-80, 120, -60);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 10;
moonLight.shadow.camera.far = 400;
moonLight.shadow.camera.left = moonLight.shadow.camera.bottom = -120;
moonLight.shadow.camera.right = moonLight.shadow.camera.top = 120;
scene.add(moonLight);

// ── City parameters ─────────────────────────────────────────
const BLOCK = 14;
const GRID = 11;
const HALF = (GRID * BLOCK) / 2;
const ROAD = 3.2;
const BUILDING_PAD = BLOCK - ROAD;

const NEON = [
  0xff2266, 0x00eeff, 0xffaa00, 0xaa44ff, 0x44ff88, 0xff4488, 0x6688ff
];
const BUILDING_COLORS = [
  0x0c0e18, 0x101220, 0x0a0c14, 0x141828, 0x0e101a, 0x121624
];

const cityGroup = new THREE.Group();
scene.add(cityGroup);

const windowLights = [];
const neonMeshes = [];
const trafficLights = [];
const animatedMaterials = [];

// ── Ground & roads ──────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(GRID * BLOCK + 40, GRID * BLOCK + 40);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x060810, roughness: 0.95, metalness: 0.05 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
cityGroup.add(ground);

function createRoadMarkings() {
  const markMat = new THREE.MeshBasicMaterial({ color: 0xcccc55, transparent: true, opacity: 0.35 });
  const dashGeo = new THREE.PlaneGeometry(0.15, 1.8);
  for (let i = -HALF; i <= HALF; i += BLOCK) {
    for (let j = -HALF + 1; j <= HALF - 1; j += 2.5) {
      const dash = new THREE.Mesh(dashGeo, markMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(i, 0.02, j);
      cityGroup.add(dash);
      const dash2 = dash.clone();
      dash2.position.set(j, 0.02, i);
      cityGroup.add(dash2);
    }
  }
}
createRoadMarkings();

// ── Building generator ──────────────────────────────────────
function createBuilding(bx, bz, seed) {
  const localRng = mulberry32(seed);
  const lr = (a, b) => a + localRng() * (b - a);
  const li = (a, b) => Math.floor(lr(a, b + 1));

  const footprint = lr(5, BUILDING_PAD - 1);
  const floors = li(3, 28);
  const height = floors * lr(2.8, 3.4);
  const width = footprint;
  const depth = footprint * lr(0.7, 1.0);

  const group = new THREE.Group();
  group.position.set(bx, 0, bz);

  const bodyColor = pick(BUILDING_COLORS);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.85, metalness: 0.15
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
  body.position.y = height / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Roof detail
  if (localRng() > 0.5 && floors > 8) {
    const roofH = lr(1.5, 4);
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(width * 0.6, roofH, depth * 0.6),
      new THREE.MeshStandardMaterial({ color: 0x181a28, roughness: 0.7, metalness: 0.3 })
    );
    roof.position.y = height + roofH / 2;
    roof.castShadow = true;
    group.add(roof);

    // Antenna / beacon
    if (localRng() > 0.4) {
      const antH = lr(3, 12);
      const ant = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, antH, 6),
        new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.8, roughness: 0.3 })
      );
      ant.position.y = height + roofH + antH / 2;
      group.add(ant);
      const beacon = new THREE.PointLight(0xff2200, 0.8, 25);
      beacon.position.y = height + roofH + antH;
      group.add(beacon);
      animatedMaterials.push({ light: beacon, phase: lr(0, Math.PI * 2), speed: lr(2, 5) });
    }
  }

  // Windows
  const winRows = Math.floor(floors * 0.85);
  const winCols = Math.floor(width / 1.6);
  const winGeo = new THREE.PlaneGeometry(0.7, 1.0);
  const faces = [
    { axis: 'z', sign: 1, rotY: 0, w: width, d: depth },
    { axis: 'z', sign: -1, rotY: Math.PI, w: width, d: depth },
    { axis: 'x', sign: 1, rotY: Math.PI / 2, w: depth, d: width },
    { axis: 'x', sign: -1, rotY: -Math.PI / 2, w: depth, d: width },
  ];

  for (const face of faces) {
    for (let row = 1; row <= winRows; row++) {
      for (let col = 0; col < winCols; col++) {
        if (localRng() > 0.72) continue;
        const lit = localRng() > 0.35;
        const warmth = lr(0.6, 1.0);
        const color = lit
          ? new THREE.Color().setHSL(0.08 + lr(-0.02, 0.06), 0.5, 0.45 + warmth * 0.25)
          : new THREE.Color(0x080810);
        const winMat = new THREE.MeshBasicMaterial({
          color, transparent: true, opacity: lit ? 0.85 + lr(0, 0.15) : 0.15
        });
        const win = new THREE.Mesh(winGeo, winMat);
        const y = row * (height / (winRows + 1));
        const offset = (col - (winCols - 1) / 2) * (face.w / winCols);
        if (face.axis === 'z') {
          win.position.set(offset, y, face.sign * (depth / 2 + 0.06));
        } else {
          win.position.set(face.sign * (face.d / 2 + 0.06), y, offset);
        }
        win.rotation.y = face.rotY;
        group.add(win);
        if (lit) {
          windowLights.push({ mat: winMat, phase: lr(0, Math.PI * 2), speed: lr(0.3, 1.5), base: winMat.opacity });
        }
      }
    }
  }

  // Neon sign
  if (localRng() > 0.55 && floors > 4) {
    const neonColor = pick(NEON);
    const signW = lr(2, 5);
    const signH = lr(0.6, 1.4);
    const signMat = new THREE.MeshBasicMaterial({ color: neonColor, transparent: true, opacity: 0.9 });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(signW, signH), signMat);
    const signY = lr(height * 0.3, height * 0.75);
    const side = li(0, 3);
    const offsets = [
      [0, signY, depth / 2 + 0.15, 0],
      [0, signY, -depth / 2 - 0.15, Math.PI],
      [width / 2 + 0.15, signY, 0, Math.PI / 2],
      [-width / 2 - 0.15, signY, 0, -Math.PI / 2],
    ];
    const [sx, sy, sz, sr] = offsets[side];
    sign.position.set(sx, sy, sz);
    sign.rotation.y = sr;
    group.add(sign);

    const glow = new THREE.PointLight(neonColor, 0.6, 18);
    glow.position.set(sx, sy, sz);
    group.add(glow);
    neonMeshes.push({ mat: signMat, light: glow, color: neonColor, phase: lr(0, Math.PI * 2) });
  }

  cityGroup.add(group);
  return { x: bx, z: bz, height };
}

// ── Generate city grid ──────────────────────────────────────
const buildings = [];
let seedCounter = 1;
for (let gx = 0; gx < GRID; gx++) {
  for (let gz = 0; gz < GRID; gz++) {
    const cx = gx * BLOCK - HALF + BLOCK / 2;
    const cz = gz * BLOCK - HALF + BLOCK / 2;
    if (Math.abs(cx) < ROAD * 1.5 && Math.abs(cz) < ROAD * 1.5) continue;
    if (localRng() > 0.92) continue;
    const b = createBuilding(cx + rand(-1.5, 1.5), cz + rand(-1.5, 1.5), seedCounter++);
    buildings.push(b);
  }
}

function localRng() { return rng(); }

// ── Central plaza / landmark tower ────────────────────────────
function createLandmark() {
  const group = new THREE.Group();
  const baseH = 55;
  const tiers = [
    { w: 12, d: 12, h: baseH, y: baseH / 2 },
    { w: 9, d: 9, h: 22, y: baseH + 11 },
    { w: 6, d: 6, h: 16, y: baseH + 22 + 8 },
    { w: 3.5, d: 3.5, h: 10, y: baseH + 22 + 16 + 5 },
  ];
  tiers.forEach((t, i) => {
    const mat = new THREE.MeshStandardMaterial({
      color: i === 0 ? 0x141830 : 0x1a2040,
      roughness: 0.4, metalness: 0.5,
      emissive: new THREE.Color(0x112244),
      emissiveIntensity: 0.15
    });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), mat);
    mesh.position.y = t.y;
    mesh.castShadow = true;
    group.add(mesh);

    // Horizontal light bands
    const bandMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.7 });
    const band = new THREE.Mesh(new THREE.BoxGeometry(t.w + 0.2, 0.15, t.d + 0.2), bandMat);
    band.position.y = t.y + t.h / 2 - 0.5;
    group.add(band);
    neonMeshes.push({ mat: bandMat, light: null, color: 0x00ccff, phase: i * 1.2 });
  });

  const spire = new THREE.Mesh(
    new THREE.ConeGeometry(1.2, 18, 8),
    new THREE.MeshStandardMaterial({ color: 0x8899bb, metalness: 0.9, roughness: 0.2 })
  );
  spire.position.y = baseH + 22 + 16 + 10 + 9;
  group.add(spire);

  const crown = new THREE.PointLight(0xffeedd, 2, 40);
  crown.position.y = baseH + 22 + 16 + 10 + 18;
  group.add(crown);

  cityGroup.add(group);
}
createLandmark();

// ── Street lamps ────────────────────────────────────────────
function createStreetLamps() {
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x222230, metalness: 0.6, roughness: 0.4 });
  for (let i = -HALF + BLOCK / 2; i <= HALF; i += BLOCK) {
    for (let j = -HALF + BLOCK / 2; j <= HALF; j += BLOCK) {
      if (Math.abs(i) < 2 && Math.abs(j) < 2) continue;
      const positions = [
        [i + ROAD, j + ROAD / 2],
        [i - ROAD, j - ROAD / 2],
      ];
      positions.forEach(([px, pz]) => {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 6), poleMat);
        pole.position.set(px, 2.5, pz);
        pole.castShadow = true;
        cityGroup.add(pole);

        const arm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.08), poleMat);
        arm.position.set(px + 0.5, 4.8, pz);
        cityGroup.add(arm);

        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.18, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xffeeaa })
        );
        bulb.position.set(px + 1.0, 4.7, pz);
        cityGroup.add(bulb);

        const light = new THREE.PointLight(0xffcc77, 0.5, 16);
        light.position.set(px + 1.0, 4.5, pz);
        light.castShadow = false;
        cityGroup.add(light);
      });
    }
  }
}
createStreetLamps();

// ── Traffic (moving light streaks) ──────────────────────────
function createTraffic() {
  const routes = [];
  for (let i = -HALF; i <= HALF; i += BLOCK) {
    routes.push({ axis: 'x', pos: i, min: -HALF, max: HALF, dir: 1 });
    routes.push({ axis: 'z', pos: i, min: -HALF, max: HALF, dir: -1 });
  }
  const carColors = [0xff3333, 0xffffff, 0x33aaff, 0xffaa33];
  for (let c = 0; c < 40; c++) {
    const route = pick(routes);
    const color = pick(carColors);
    const geo = new THREE.SphereGeometry(0.25, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color });
    const car = new THREE.Mesh(geo, mat);
    const headLight = new THREE.PointLight(color, 0.4, 8);
    car.add(headLight);
    headLight.position.set(0, 0, route.dir > 0 ? 0.5 : -0.5);
    cityGroup.add(car);
    trafficLights.push({
      mesh: car,
      route,
      t: rand(0, 1),
      speed: rand(0.08, 0.22)
    });
  }
}

createTraffic();

// ── Sky: stars & moon ───────────────────────────────────────
function createSky() {
  const starCount = 2500;
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const theta = rand(0, Math.PI * 2);
    const phi = rand(0, Math.PI * 0.45);
    const r = 350;
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xddeeff, size: 0.8, transparent: true, opacity: 0.7, sizeAttenuation: true });
  scene.add(new THREE.Points(starGeo, starMat));

  const moonGeo = new THREE.SphereGeometry(8, 32, 32);
  const moonMat = new THREE.MeshBasicMaterial({ color: 0xdde8ff });
  const moon = new THREE.Mesh(moonGeo, moonMat);
  moon.position.set(-100, 130, -80);
  scene.add(moon);

  const moonGlow = new THREE.Mesh(
    new THREE.SphereGeometry(14, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.08 })
  );
  moonGlow.position.copy(moon.position);
  scene.add(moonGlow);
}
createSky();

// ── Distant skyline silhouette ──────────────────────────────
function createDistantSkyline() {
  const group = new THREE.Group();
  for (let i = 0; i < 60; i++) {
    const w = rand(8, 25);
    const h = rand(20, 80);
    const d = rand(8, 20);
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshBasicMaterial({ color: 0x060810 })
    );
    const angle = rand(0, Math.PI * 2);
    const dist = rand(160, 220);
    mesh.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
    group.add(mesh);
  }
  scene.add(group);
}
createDistantSkyline();

// ── Particle atmosphere (light dust / rain mist) ────────────
function createAtmosphere() {
  const count = 800;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = rand(-HALF, HALF);
    positions[i * 3 + 1] = rand(0, 60);
    positions[i * 3 + 2] = rand(-HALF, HALF);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x6688cc, size: 0.15, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
}
const atmosphere = createAtmosphere();

// ── Animation loop ──────────────────────────────────────────
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;

  controls.update();

  // Flickering windows
  windowLights.forEach(w => {
    if (Math.sin(elapsed * w.speed + w.phase) > 0.97) {
      w.mat.opacity = w.base * 0.2;
    } else {
      w.mat.opacity = w.base + Math.sin(elapsed * w.speed * 0.5 + w.phase) * 0.05;
    }
  });

  // Pulsing neon
  neonMeshes.forEach(n => {
    const pulse = 0.65 + Math.sin(elapsed * 2 + n.phase) * 0.35;
    n.mat.opacity = pulse;
    if (n.light) n.light.intensity = pulse * 0.7;
  });

  // Beacon lights
  animatedMaterials.forEach(a => {
    a.light.intensity = 0.3 + (Math.sin(elapsed * a.speed + a.phase) > 0.8 ? 1.2 : 0);
  });

  // Traffic
  trafficLights.forEach(t => {
    t.t += t.speed * dt;
    if (t.t > 1) t.t -= 1;
    const pos = t.route.min + t.t * (t.route.max - t.route.min);
    if (t.route.axis === 'x') {
      t.mesh.position.set(pos, 0.4, t.route.pos + t.route.dir * 1.2);
    } else {
      t.mesh.position.set(t.route.pos + t.route.dir * 1.2, 0.4, pos);
    }
  });

  // Drifting atmosphere
  const ap = atmosphere.geometry.attributes.position;
  for (let i = 0; i < ap.count; i++) {
    ap.setY(i, ap.getY(i) - dt * 0.8);
    if (ap.getY(i) < 0) ap.setY(i, 60);
    ap.setX(i, ap.getX(i) + Math.sin(elapsed + i) * dt * 0.05);
  }
  ap.needsUpdate = true;

  // Subtle camera breathe
  bloom.strength = 0.5 + Math.sin(elapsed * 0.3) * 0.08;

  composer.render();
}

// ── Resize ──────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
});

// Pause auto-rotate on interaction
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });

animate();
</script>
</body>
</html>
