<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City at Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #title {
    position: fixed; top: 28px; left: 32px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: rgba(255,255,255,0.72); letter-spacing: 0.35em;
    font-size: 11px; text-transform: uppercase;
    text-shadow: 0 0 24px rgba(120,180,255,0.4);
  }
  #hint {
    position: fixed; bottom: 24px; right: 28px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 10px; color: rgba(255,255,255,0.28);
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title">Nocturne District</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Seeded RNG ──────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xC17A);

// ── Scene setup ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040612);
scene.fog = new THREE.FogExp2(0x080818, 0.0085);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 800);
camera.position.set(42, 38, 52);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 12;
controls.maxDistance = 120;
controls.target.set(0, 8, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

// ── Lighting ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2040, 0.35));
const moon = new THREE.DirectionalLight(0x8899cc, 0.45);
moon.position.set(-60, 90, -40);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.near = 10;
moon.shadow.camera.far = 200;
moon.shadow.camera.left = moon.shadow.camera.bottom = -80;
moon.shadow.camera.right = moon.shadow.camera.top = 80;
scene.add(moon);

const cityGlow = new THREE.HemisphereLight(0x334466, 0x0a0812, 0.5);
scene.add(cityGlow);

// ── Sky dome with stars ─────────────────────────────────────
function createSky() {
  const starCount = 2200;
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const theta = rng() * Math.PI * 2;
    const phi = Math.acos(2 * rng() - 1);
    const r = 280 + rng() * 40;
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 20;
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const b = 0.5 + rng() * 0.5;
    colors[i * 3] = b * (0.8 + rng() * 0.2);
    colors[i * 3 + 1] = b * (0.85 + rng() * 0.15);
    colors[i * 3 + 2] = b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({ size: 0.9, vertexColors: true, transparent: true, opacity: 0.85, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}
scene.add(createSky());

// Moon disc
const moonGeo = new THREE.SphereGeometry(6, 32, 32);
const moonMat = new THREE.MeshBasicMaterial({ color: 0xe8eef8 });
const moonMesh = new THREE.Mesh(moonGeo, moonMat);
moonMesh.position.set(-70, 95, -55);
scene.add(moonMesh);

// ── Ground & roads ──────────────────────────────────────────
const GRID = 14;
const BLOCK = 8;
const ROAD = 2.2;
const CELL = BLOCK + ROAD;
const HALF = (GRID * CELL) / 2;

const groundGeo = new THREE.PlaneGeometry(GRID * CELL + 40, GRID * CELL + 40);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0c0e14, roughness: 0.95, metalness: 0.05 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x141820, roughness: 0.85, metalness: 0.1 });
const roadLines = [];
for (let i = 0; i <= GRID; i++) {
  const offset = -HALF + i * CELL - ROAD / 2;
  const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(GRID * CELL, ROAD), roadMat);
  hRoad.rotation.x = -Math.PI / 2;
  hRoad.position.set(0, 0.02, offset);
  scene.add(hRoad);
  const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(ROAD, GRID * CELL), roadMat);
  vRoad.rotation.x = -Math.PI / 2;
  vRoad.position.set(offset, 0.02, 0);
  scene.add(vRoad);
}

// Road center dashes
const dashMat = new THREE.MeshBasicMaterial({ color: 0x3a3a20 });
for (let i = 0; i < GRID; i++) {
  for (let j = 0; j < 6; j++) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.2), dashMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(-HALF + i * CELL + ROAD / 2, 0.03, -HALF + j * (GRID * CELL / 6) + 2);
    scene.add(dash);
  }
}

// ── Building palette ────────────────────────────────────────
const facadeColors = [0x1a1e28, 0x222630, 0x181c24, 0x2a2430, 0x1e2228, 0x242028];
const windowColors = [0xffcc66, 0xffaa44, 0xaaccff, 0xff8866, 0xccddff, 0xffdd88];
const neonColors = [0xff2266, 0x22ffaa, 0x4488ff, 0xff44cc, 0x44ffee, 0xffaa22];

const buildings = [];
const windowLights = [];
const neonSigns = [];
const streetLights = [];

function createWindowTexture(w, h, lit) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a0c12';
  ctx.fillRect(0, 0, w, h);
  const cols = Math.floor(w / 12);
  const rows = Math.floor(h / 12);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const on = lit[r * cols + c];
      if (on) {
        const hue = windowColors[Math.floor(rng() * windowColors.length)];
        const hex = '#' + hue.toString(16).padStart(6, '0');
        ctx.fillStyle = hex;
        ctx.globalAlpha = 0.6 + rng() * 0.4;
      } else {
        ctx.fillStyle = '#080a10';
        ctx.globalAlpha = 0.3;
      }
      ctx.fillRect(c * 12 + 2, r * 12 + 2, 8, 8);
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}

function addBuilding(gx, gz) {
  const roll = rng();
  if (roll < 0.08) return; // empty lot / plaza

  const w = 3 + rng() * 4;
  const d = 3 + rng() * 4;
  const floors = 2 + Math.floor(rng() * rng() * 18);
  const h = floors * 1.8 + rng() * 2;

  const x = -HALF + gx * CELL + ROAD + BLOCK / 2 + (rng() - 0.5) * 1.5;
  const z = -HALF + gz * CELL + ROAD + BLOCK / 2 + (rng() - 0.5) * 1.5;

  const cols = Math.max(2, Math.floor(w * 2));
  const rows = Math.max(2, Math.floor(h / 1.8));
  const lit = new Array(cols * rows);
  for (let i = 0; i < lit.length; i++) lit[i] = rng() > 0.35;

  const texW = cols * 12;
  const texH = rows * 12;
  const winTex = createWindowTexture(texW, texH, lit);

  const color = facadeColors[Math.floor(rng() * facadeColors.length)];
  const mat = new THREE.MeshStandardMaterial({
    map: winTex,
    color,
    roughness: 0.75,
    metalness: 0.15,
    emissive: 0x111118,
    emissiveIntensity: 0.15,
  });

  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const bData = { mesh, winTex, lit, cols, rows, texW, texH, flickerPhase: rng() * 100 };
  buildings.push(bData);

  // Roof detail
  if (floors > 6 && rng() > 0.5) {
    const antenna = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 3 + rng() * 4, 6),
      new THREE.MeshStandardMaterial({ color: 0x333340, metalness: 0.6, roughness: 0.4 })
    );
    antenna.position.set(x, h + 1.5, z);
    scene.add(antenna);
    const blink = new THREE.PointLight(0xff2222, 0.8, 8);
    blink.position.set(x, h + 3.5, z);
    scene.add(blink);
    windowLights.push({ light: blink, phase: rng() * 50, type: 'blink' });
  }

  // Neon sign
  if (rng() > 0.65 && floors > 3) {
    const neonColor = neonColors[Math.floor(rng() * neonColors.length)];
    const signW = 1.2 + rng() * 1.5;
    const sign = new THREE.Mesh(
      new THREE.BoxGeometry(signW, 0.35, 0.08),
      new THREE.MeshStandardMaterial({
        color: neonColor,
        emissive: neonColor,
        emissiveIntensity: 2,
        roughness: 0.3,
        metalness: 0.5,
      })
    );
    const side = Math.floor(rng() * 4);
    const yOff = 2 + rng() * (h - 4);
    const offsets = [
      [0, yOff, d / 2 + 0.06],
      [0, yOff, -d / 2 - 0.06],
      [w / 2 + 0.06, yOff, 0],
      [-w / 2 - 0.06, yOff, 0],
    ];
    sign.position.set(x + offsets[side][0], offsets[side][1], z + offsets[side][2]);
    scene.add(sign);
    const nLight = new THREE.PointLight(neonColor, 0.6, 12);
    nLight.position.copy(sign.position);
    scene.add(nLight);
    neonSigns.push({ sign, light: nLight, color: neonColor, phase: rng() * 30, speed: 0.5 + rng() * 2 });
  }
}

for (let gx = 0; gx < GRID; gx++) {
  for (let gz = 0; gz < GRID; gz++) {
    addBuilding(gx, gz);
  }
}

// ── Street lamps ────────────────────────────────────────────
for (let i = 0; i < GRID + 1; i++) {
  for (let j = 0; j < 4; j++) {
    if (rng() > 0.55) continue;
    const lx = -HALF + i * CELL + (j % 2 === 0 ? 0.4 : CELL - 0.4);
    const lz = -HALF + (j + 0.5) * (GRID * CELL / 4);
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.08, 4.5, 6),
      new THREE.MeshStandardMaterial({ color: 0x2a2a30, metalness: 0.5, roughness: 0.5 })
    );
    pole.position.set(lx, 2.25, lz);
    scene.add(pole);
    const lamp = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xffeeaa, emissive: 0xffdd88, emissiveIntensity: 3 })
    );
    lamp.position.set(lx, 4.6, lz);
    scene.add(lamp);
    const sLight = new THREE.PointLight(0xffdd99, 0.5, 14);
    sLight.position.set(lx, 4.5, lz);
    scene.add(sLight);
    streetLights.push(sLight);
  }
}

// ── Traffic (moving head/tail lights) ───────────────────────
const traffic = [];
const trafficMatHead = new THREE.MeshBasicMaterial({ color: 0xffffff });
const trafficMatTail = new THREE.MeshBasicMaterial({ color: 0xff2222 });

function spawnCar(lane, dir, axis) {
  const car = new THREE.Group();
  const headL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), trafficMatHead);
  const headR = headL.clone();
  const tailL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), trafficMatTail);
  const tailR = tailL.clone();
  headL.position.set(-0.3, 0.15, 0.5);
  headR.position.set(0.3, 0.15, 0.5);
  tailL.position.set(-0.3, 0.15, -0.5);
  tailR.position.set(0.3, 0.15, -0.5);
  car.add(headL, headR, tailL, tailR);
  const speed = 8 + rng() * 14;
  const offset = rng() * GRID * CELL;
  traffic.push({ car, lane, dir, axis, speed, offset });
  scene.add(car);
}

for (let i = 0; i < 24; i++) {
  spawnCar(Math.floor(rng() * (GRID + 1)), rng() > 0.5 ? 1 : -1, rng() > 0.5 ? 'x' : 'z');
}

function updateTraffic(dt) {
  for (const t of traffic) {
    t.offset += t.speed * dt * t.dir;
    const span = GRID * CELL;
    if (t.offset > span) t.offset -= span;
    if (t.offset < 0) t.offset += span;
    const base = -HALF + t.lane * CELL + ROAD / 2;
    if (t.axis === 'x') {
      t.car.position.set(-HALF + t.offset, 0.2, base);
      t.car.rotation.y = t.dir > 0 ? 0 : Math.PI;
    } else {
      t.car.position.set(base, 0.2, -HALF + t.offset);
      t.car.rotation.y = t.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
  }
}

// ── Atmospheric particles (dust / rain mist) ────────────────
const mistCount = 600;
const mistPos = new Float32Array(mistCount * 3);
const mistVel = [];
for (let i = 0; i < mistCount; i++) {
  mistPos[i * 3] = (rng() - 0.5) * GRID * CELL;
  mistPos[i * 3 + 1] = rng() * 40;
  mistPos[i * 3 + 2] = (rng() - 0.5) * GRID * CELL;
  mistVel.push({ x: (rng() - 0.5) * 0.3, y: -0.05 - rng() * 0.15, z: (rng() - 0.5) * 0.3 });
}
const mistGeo = new THREE.BufferGeometry();
mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
const mist = new THREE.Points(mistGeo, new THREE.PointsMaterial({ color: 0x8899bb, size: 0.35, transparent: true, opacity: 0.12, depthWrite: false }));
scene.add(mist);

function updateMist(dt) {
  const arr = mistGeo.attributes.position.array;
  for (let i = 0; i < mistCount; i++) {
    arr[i * 3] += mistVel[i].x * dt;
    arr[i * 3 + 1] += mistVel[i].y * dt;
    arr[i * 3 + 2] += mistVel[i].z * dt;
    if (arr[i * 3 + 1] < 0) {
      arr[i * 3 + 1] = 35 + rng() * 10;
      arr[i * 3] = (rng() - 0.5) * GRID * CELL;
      arr[i * 3 + 2] = (rng() - 0.5) * GRID * CELL;
    }
  }
  mistGeo.attributes.position.needsUpdate = true;
}

// ── Window flicker ──────────────────────────────────────────
let flickerTimer = 0;
function updateWindows(dt, time) {
  flickerTimer += dt;
  if (flickerTimer < 0.15) return;
  flickerTimer = 0;
  for (let b = 0; b < 3; b++) {
    const bd = buildings[Math.floor(rng() * buildings.length)];
    if (!bd) continue;
    const idx = Math.floor(rng() * bd.lit.length);
    bd.lit[idx] = rng() > 0.25;
    bd.winTex.dispose();
    bd.winTex = createWindowTexture(bd.texW, bd.texH, bd.lit);
    bd.mesh.material.map = bd.winTex;
    bd.mesh.material.needsUpdate = true;
  }
}

// ── Neon pulse ──────────────────────────────────────────────
function updateNeon(time) {
  for (const n of neonSigns) {
    const pulse = 0.5 + 0.5 * Math.sin(time * n.speed + n.phase);
    const flicker = rng() > 0.997 ? 0.1 : 1;
    n.sign.material.emissiveIntensity = (1.5 + pulse * 1.5) * flicker;
    n.light.intensity = (0.3 + pulse * 0.5) * flicker;
  }
  for (const wl of windowLights) {
    if (wl.type === 'blink') {
      wl.light.intensity = Math.sin(time * 3 + wl.phase) > 0.7 ? 0.9 : 0.05;
    }
  }
}

// ── Resize ──────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Loop ────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  controls.update();
  updateTraffic(dt);
  updateMist(dt);
  updateWindows(dt, time);
  updateNeon(time);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
