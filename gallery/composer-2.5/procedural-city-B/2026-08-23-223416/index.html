<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural City at Night</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
    canvas { display: block; }
    #overlay {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 100%, transparent 40%, rgba(0,0,20,0.6) 100%);
    }
    #title {
      position: fixed; top: 24px; left: 28px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: rgba(200, 210, 255, 0.85);
      font-size: 13px; letter-spacing: 0.35em; text-transform: uppercase;
      text-shadow: 0 0 20px rgba(100, 140, 255, 0.4);
    }
    #hint {
      position: fixed; bottom: 20px; right: 24px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: rgba(150, 160, 200, 0.45);
      font-size: 11px; letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="title">Nocturne District</div>
  <div id="hint">drag to orbit · scroll to zoom</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ── Seeded RNG ──
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(0xC17A2025);

    // ── Scene setup ──
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020210);
    scene.fog = new THREE.FogExp2(0x080818, 0.006);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 800);
    camera.position.set(80, 55, 80);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 20;
    controls.maxDistance = 200;
    controls.target.set(0, 8, 0);

    // ── Post-processing ──
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.55, 0.35, 0.85
    );
    composer.addPass(bloom);

    // ── Lighting ──
    scene.add(new THREE.AmbientLight(0x1a1a3a, 0.35));
    const moonLight = new THREE.DirectionalLight(0x8899cc, 0.25);
    moonLight.position.set(-60, 100, -40);
    scene.add(moonLight);

    const cityGlow = new THREE.HemisphereLight(0x334466, 0x0a0812, 0.4);
    scene.add(cityGlow);

    // ── Moon & stars ──
    const moonGeo = new THREE.SphereGeometry(6, 32, 32);
    const moonMat = new THREE.MeshBasicMaterial({ color: 0xddeeff });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.set(-80, 120, -100);
    scene.add(moon);

    const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      color: 0x6688bb, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    moonGlow.scale.set(40, 40, 1);
    moonGlow.position.copy(moon.position);
    scene.add(moonGlow);

    const starCount = 1200;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 180 + rng() * 120;
      const theta = rng() * Math.PI * 2;
      const phi = rng() * Math.PI * 0.45;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.cos(phi) + 40;
      starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.6, transparent: true, opacity: 0.7, sizeAttenuation: true
    }));
    scene.add(stars);

    // ── Ground & roads ──
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.95, metalness: 0.05 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.85, metalness: 0.1 });
    const roadMarkMat = new THREE.MeshBasicMaterial({ color: 0x333340 });

    function createRoad(x, z, w, d, rotY = 0) {
      const g = new THREE.Group();
      const road = new THREE.Mesh(new THREE.PlaneGeometry(w, d), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.y = 0.02;
      g.add(road);
      const markCount = Math.floor(Math.max(w, d) / 8);
      for (let i = 0; i < markCount; i++) {
        const mark = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), roadMarkMat);
        mark.rotation.x = -Math.PI / 2;
        mark.position.y = 0.03;
        if (w > d) mark.position.set(-w / 2 + (i + 0.5) * (w / markCount), 0, 0);
        else mark.position.set(0, 0, -d / 2 + (i + 0.5) * (d / markCount));
        g.add(mark);
      }
      g.position.set(x, 0, z);
      g.rotation.y = rotY;
      scene.add(g);
    }

    createRoad(0, 0, 400, 14);
    createRoad(0, 0, 14, 400);
    for (let i = -3; i <= 3; i++) {
      if (i === 0) continue;
      createRoad(i * 28, 0, 8, 400);
      createRoad(0, i * 28, 400, 8);
    }

    // ── Building materials (instanced) ──
    const buildingColors = [
      0x1a1a28, 0x151520, 0x12121e, 0x181828, 0x141422, 0x101018
    ];
    const accentColors = [0xffaa44, 0x44aaff, 0xff6644, 0x88ccff, 0xffcc66, 0xaa88ff];

    const windowLitMat = new THREE.MeshBasicMaterial({ color: 0xffdd88 });
    const windowDarkMat = new THREE.MeshBasicMaterial({ color: 0x080810 });

    const animatedWindows = [];
    const neonSigns = [];
    const trafficLights = [];
    const drones = [];

    // ── Procedural city grid ──
    const BLOCK = 26;
    const GRID = 7;
    const halfGrid = Math.floor(GRID / 2);

    function isRoadBlock(bx, bz) {
      return bx === 0 || bz === 0;
    }

    function createBuilding(x, z, lotW, lotD) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const style = rng();
      const floors = Math.floor(3 + rng() * 18);
      const floorH = 2.8 + rng() * 0.8;
      const height = floors * floorH;
      const width = lotW * (0.55 + rng() * 0.35);
      const depth = lotD * (0.55 + rng() * 0.35);
      const colorIdx = Math.floor(rng() * buildingColors.length);

      const bodyMat = new THREE.MeshStandardMaterial({
        color: buildingColors[colorIdx],
        roughness: 0.75 + rng() * 0.2,
        metalness: 0.1 + rng() * 0.15
      });

      const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
      body.position.y = height / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Roof detail
      if (rng() > 0.4) {
        const roofH = 1 + rng() * 3;
        const roof = new THREE.Mesh(
          new THREE.BoxGeometry(width * 0.7, roofH, depth * 0.7),
          new THREE.MeshStandardMaterial({ color: 0x0e0e18, roughness: 0.8, metalness: 0.2 })
        );
        roof.position.y = height + roofH / 2;
        group.add(roof);
      }

      // Antenna / spire
      if (rng() > 0.7) {
        const spireH = 5 + rng() * 15;
        const spire = new THREE.Mesh(
          new THREE.CylinderGeometry(0.15, 0.4, spireH, 6),
          new THREE.MeshStandardMaterial({ color: 0x222230, metalness: 0.6, roughness: 0.3 })
        );
        spire.position.y = height + spireH / 2 + 1;
        group.add(spire);
        const beacon = new THREE.PointLight(0xff2244, 0.8, 12);
        beacon.position.y = height + spireH + 1;
        group.add(beacon);
        trafficLights.push({ light: beacon, phase: rng() * Math.PI * 2, speed: 1.5 + rng() });
      }

      // Windows
      const winW = 0.9, winH = 1.4, gap = 0.5;
      const cols = Math.floor((width - 1) / (winW + gap));
      const rows = Math.floor((height - 2) / (winH + gap));

      for (let face = 0; face < 4; face++) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (rng() > 0.72) continue;
            const lit = rng() > 0.35;
            const win = new THREE.Mesh(
              new THREE.PlaneGeometry(winW, winH),
              lit ? windowLitMat.clone() : windowDarkMat
            );
            const offsetX = -width / 2 + 1 + c * (winW + gap) + winW / 2;
            const offsetY = 1.5 + r * (winH + gap) + winH / 2;
            const offsetZ = depth / 2 + 0.05;

            if (face === 0) { win.position.set(offsetX, offsetY, offsetZ); }
            else if (face === 1) { win.position.set(offsetX, offsetY, -offsetZ); win.rotation.y = Math.PI; }
            else if (face === 2) {
              win.position.set(width / 2 + 0.05, offsetY, -depth / 2 + 1 + c * (winW + gap) + winW / 2);
              win.rotation.y = Math.PI / 2;
            } else {
              win.position.set(-width / 2 - 0.05, offsetY, -depth / 2 + 1 + c * (winW + gap) + winW / 2);
              win.rotation.y = -Math.PI / 2;
            }
            group.add(win);
            if (lit) {
              animatedWindows.push({
                mesh: win,
                baseColor: new THREE.Color(0xffdd88),
                offColor: new THREE.Color(0x080810),
                phase: rng() * Math.PI * 2,
                speed: 0.3 + rng() * 1.2,
                on: true
              });
            }
          }
        }
      }

      // Neon sign
      if (rng() > 0.55 && height > 15) {
        const accent = accentColors[Math.floor(rng() * accentColors.length)];
        const signW = width * 0.5;
        const sign = new THREE.Mesh(
          new THREE.PlaneGeometry(signW, 1.2),
          new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: 0.9 })
        );
        sign.position.set(0, height * 0.65, depth / 2 + 0.1);
        group.add(sign);
        const signLight = new THREE.PointLight(accent, 1.2, 18);
        signLight.position.copy(sign.position);
        group.add(signLight);
        neonSigns.push({ mesh: sign, light: signLight, color: accent, phase: rng() * 6, speed: 0.8 + rng() * 2 });
      }

      scene.add(group);
      return { group, height, width, depth };
    }

    const buildings = [];
    for (let bx = -halfGrid; bx <= halfGrid; bx++) {
      for (let bz = -halfGrid; bz <= halfGrid; bz++) {
        if (isRoadBlock(bx, bz)) continue;
        const cx = bx * BLOCK + (rng() - 0.5) * 4;
        const cz = bz * BLOCK + (rng() - 0.5) * 4;
        const lot = BLOCK - 4;
        const count = rng() > 0.6 ? 2 : 1;
        for (let i = 0; i < count; i++) {
          const ox = count > 1 ? (i - 0.5) * lot * 0.45 : 0;
          const oz = count > 1 ? (rng() - 0.5) * 4 : 0;
          buildings.push(createBuilding(cx + ox, cz + oz, lot / count, lot / count));
        }
      }
    }

    // ── Street lamps ──
    const lampPositions = [];
    for (let i = -halfGrid; i <= halfGrid; i++) {
      for (let side = -1; side <= 1; side += 2) {
        if (i === 0) continue;
        const px = i * BLOCK;
        for (let j = -halfGrid * BLOCK; j <= halfGrid * BLOCK; j += 18) {
          lampPositions.push([px + side * 8, j]);
          lampPositions.push([j, px + side * 8]);
        }
      }
    }

    lampPositions.forEach(([x, z], idx) => {
      const pole = new THREE.Group();
      pole.position.set(x, 0, z);
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, 5, 6),
        new THREE.MeshStandardMaterial({ color: 0x222230, metalness: 0.5, roughness: 0.4 })
      );
      post.position.y = 2.5;
      pole.add(post);
      const arm = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.08, 0.08),
        post.material
      );
      arm.position.set(0.5, 5, 0);
      pole.add(arm);
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffeeaa })
      );
      bulb.position.set(1, 4.85, 0);
      pole.add(bulb);
      const light = new THREE.PointLight(0xffcc77, 1.5, 22);
      light.position.set(1, 4.5, 0);
      light.castShadow = idx % 8 === 0;
      pole.add(light);
      scene.add(pole);
      trafficLights.push({ light, phase: rng() * Math.PI * 2, speed: 0.05 + rng() * 0.1, flicker: true });
    });

    // ── Traffic (car lights as moving points) ──
    const carCount = 40;
    const cars = [];
    const carColors = [0xff3333, 0xffffff, 0xffaa00, 0x44ff44];

    for (let i = 0; i < carCount; i++) {
      const horizontal = rng() > 0.5;
      const lane = (Math.floor(rng() * 6) - 3) * BLOCK;
      const dir = rng() > 0.5 ? 1 : -1;
      const speed = 15 + rng() * 25;
      const headLight = new THREE.PointLight(0xffeedd, 0.6, 8);
      const tailLight = new THREE.PointLight(0xff2222, 0.4, 6);
      const carGroup = new THREE.Group();
      carGroup.add(headLight);
      carGroup.add(tailLight);
      headLight.position.set(0, 0.5, dir * 1.2);
      tailLight.position.set(0, 0.5, -dir * 1.2);
      scene.add(carGroup);
      cars.push({
        group: carGroup, horizontal, lane, dir, speed,
        pos: (rng() - 0.5) * GRID * BLOCK * 2,
        headLight, tailLight
      });
    }

    // ── Drones ──
    for (let i = 0; i < 8; i++) {
      const drone = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.15, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x333344, emissive: 0x112244, emissiveIntensity: 0.5 })
      );
      drone.add(body);
      const glow = new THREE.PointLight(0x44aaff, 0.5, 6);
      glow.position.y = -0.2;
      drone.add(glow);
      drone.position.set(
        (rng() - 0.5) * GRID * BLOCK,
        25 + rng() * 40,
        (rng() - 0.5) * GRID * BLOCK
      );
      scene.add(drone);
      drones.push({
        mesh: drone, glow,
        radius: 15 + rng() * 25,
        height: drone.position.y,
        speed: 0.2 + rng() * 0.5,
        angle: rng() * Math.PI * 2,
        center: new THREE.Vector3(drone.position.x, 0, drone.position.z)
      });
    }

    // ── Distant skyline silhouette ──
    const skylineGroup = new THREE.Group();
    for (let i = 0; i < 60; i++) {
      const h = 30 + rng() * 80;
      const w = 4 + rng() * 8;
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, w),
        new THREE.MeshBasicMaterial({ color: 0x060610 })
      );
      b.position.set((i - 30) * 8 + (rng() - 0.5) * 4, h / 2, -120 - rng() * 40);
      skylineGroup.add(b);
      if (rng() > 0.5) {
        const win = new THREE.Mesh(
          new THREE.PlaneGeometry(w * 0.6, h * 0.3),
          new THREE.MeshBasicMaterial({ color: 0x1a1a30, transparent: true, opacity: 0.6 })
        );
        win.position.copy(b.position);
        win.position.z += w / 2 + 0.1;
        skylineGroup.add(win);
      }
    }
    scene.add(skylineGroup);

    // ── Subtle camera drift ──
    let time = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      time += dt;

      // Window flicker
      animatedWindows.forEach(w => {
        const flicker = Math.sin(time * w.speed + w.phase);
        if (flicker > 0.85 && rng() > 0.998) w.on = !w.on;
        w.mesh.material.color.copy(w.on ? w.baseColor : w.offColor);
        if (w.on && flicker > 0.95) {
          w.mesh.material.color.multiplyScalar(0.85 + rng() * 0.15);
        }
      });

      // Neon pulse
      neonSigns.forEach(n => {
        const pulse = 0.5 + 0.5 * Math.sin(time * n.speed + n.phase);
        n.mesh.material.opacity = 0.4 + pulse * 0.6;
        n.light.intensity = 0.5 + pulse * 1.5;
      });

      // Street lamp subtle flicker
      trafficLights.forEach(t => {
        if (t.flicker) {
          t.light.intensity = 1.3 + Math.sin(time * 3 + t.phase) * 0.15 + (rng() > 0.999 ? -0.5 : 0);
        } else {
          t.light.intensity = 0.4 + 0.4 * Math.sin(time * t.speed + t.phase);
        }
      });

      // Traffic
      cars.forEach(car => {
        car.pos += car.dir * car.speed * dt;
        const limit = GRID * BLOCK;
        if (car.pos > limit) car.pos = -limit;
        if (car.pos < -limit) car.pos = limit;
        if (car.horizontal) {
          car.group.position.set(car.pos, 0.6, car.lane);
          car.group.rotation.y = car.dir > 0 ? 0 : Math.PI;
        } else {
          car.group.position.set(car.lane, 0.6, car.pos);
          car.group.rotation.y = car.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        }
      });

      // Drones orbit
      drones.forEach(d => {
        d.angle += d.speed * dt;
        d.mesh.position.x = d.center.x + Math.cos(d.angle) * d.radius;
        d.mesh.position.z = d.center.z + Math.sin(d.angle) * d.radius;
        d.mesh.position.y = d.height + Math.sin(time * 0.5 + d.angle) * 3;
        d.glow.intensity = 0.3 + 0.2 * Math.sin(time * 2 + d.angle);
      });

      // Star twinkle
      stars.rotation.y = time * 0.002;

      // Gentle auto-orbit when idle
      if (!controls.enabled) {
        camera.position.x = 80 * Math.cos(time * 0.05);
        camera.position.z = 80 * Math.sin(time * 0.05);
        camera.lookAt(0, 10, 0);
      }

      controls.update();
      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.resolution.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
