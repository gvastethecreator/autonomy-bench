<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural City at Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020208; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #title {
    position: fixed; left: 28px; bottom: 28px;
    font: 300 13px/1.5 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(180, 200, 255, 0.45);
  }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title">Nocturne District</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ── Seeded RNG ── */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0xC17A2026);

/* ── Scene setup ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030510);
scene.fog = new THREE.FogExp2(0x060818, 0.0042);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 800);
camera.position.set(48, 38, 58);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.85, 0.55, 0.18
);
composer.addPass(bloom);

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0x1a2040, 0.35));
const moon = new THREE.DirectionalLight(0x8899cc, 0.55);
moon.position.set(-80, 120, -60);
scene.add(moon);
const rim = new THREE.DirectionalLight(0xff6644, 0.12);
rim.position.set(60, 20, -40);
scene.add(rim);

/* ── City parameters ── */
const BLOCK = 14;
const STREET = 6;
const CELL = BLOCK + STREET;
const GRID = 11;
const HALF = (GRID * CELL) / 2;
const groundY = 0;

const buildingGroup = new THREE.Group();
const windowLights = [];
const neonMeshes = [];
const traffic = [];

/* ── Materials ── */
const roadMat = new THREE.MeshStandardMaterial({
  color: 0x0a0c14, roughness: 0.15, metalness: 0.6
});
const sidewalkMat = new THREE.MeshStandardMaterial({
  color: 0x141820, roughness: 0.85, metalness: 0.05
});
const windowOffMat = new THREE.MeshBasicMaterial({ color: 0x0a0c18 });
const windowOnMats = [
  new THREE.MeshBasicMaterial({ color: 0xffe8a8 }),
  new THREE.MeshBasicMaterial({ color: 0xa8d8ff }),
  new THREE.MeshBasicMaterial({ color: 0xffc4a0 }),
  new THREE.MeshBasicMaterial({ color: 0xc8ffe0 }),
  new THREE.MeshBasicMaterial({ color: 0xff99cc }),
];

function buildingColor() {
  const palette = [0x1a2238, 0x222a3a, 0x1e2838, 0x2a3048, 0x181e30, 0x242838];
  return palette[(rand() * palette.length) | 0];
}

function isRoad(gx, gz) {
  return gx % (BLOCK + STREET) >= BLOCK || gz % (BLOCK + STREET) >= BLOCK;
}

function roadCenter(g) {
  const mod = g % CELL;
  if (mod >= BLOCK) return g - mod + BLOCK + STREET * 0.5;
  return null;
}

/* ── Ground & roads ── */
const groundGeo = new THREE.PlaneGeometry(GRID * CELL + 40, GRID * CELL + 40);
const ground = new THREE.Mesh(groundGeo, roadMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY - 0.02;
ground.receiveShadow = true;
scene.add(ground);

const lineMat = new THREE.MeshBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 });
for (let i = 0; i <= GRID; i++) {
  const pos = i * CELL - HALF;
  for (let axis = 0; axis < 2; axis++) {
    const geo = new THREE.PlaneGeometry(axis ? GRID * CELL : 0.15, axis ? 0.15 : GRID * CELL);
    const line = new THREE.Mesh(geo, lineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(axis ? 0 : pos, 0.01, axis ? pos : 0);
    scene.add(line);
  }
}

/* ── Procedural buildings ── */
function addBuilding(bx, bz, bw, bd) {
  const floors = 3 + (rand() * 22 | 0);
  const floorH = 2.8 + rand() * 0.8;
  const h = floors * floorH;
  const cx = bx + bw * 0.5;
  const cz = bz + bd * 0.5;

  const bodyGeo = new THREE.BoxGeometry(bw * 0.92, h, bd * 0.92);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
    color: buildingColor(), roughness: 0.72, metalness: 0.18,
    emissive: 0x080810, emissiveIntensity: 0.15
  }));
  body.position.set(cx, h * 0.5, cz);
  buildingGroup.add(body);

  /* Roof detail */
  if (rand() > 0.55) {
    const roofH = 1.2 + rand() * 2.5;
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(bw * 0.5, roofH, bd * 0.5),
      new THREE.MeshStandardMaterial({ color: 0x101828, roughness: 0.5, metalness: 0.4 })
    );
    roof.position.set(cx, h + roofH * 0.5, cz);
    buildingGroup.add(roof);
  }

  /* Antenna */
  if (rand() > 0.7) {
    const antH = 4 + rand() * 12;
    const ant = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.12, antH, 6),
      new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.8, roughness: 0.3 })
    );
    ant.position.set(cx + (rand() - 0.5) * bw * 0.3, h + antH * 0.5, cz + (rand() - 0.5) * bd * 0.3);
    buildingGroup.add(ant);
    const blink = new THREE.PointLight(0xff4444, 0, 8);
    blink.position.copy(ant.position);
    blink.position.y += antH * 0.45;
    scene.add(blink);
    windowLights.push({ light: blink, phase: rand() * 6, type: 'blink' });
  }

  /* Windows */
  const cols = Math.max(2, (bw / 2.2) | 0);
  const rows = floors;
  const winW = Math.min(1.4, bw / (cols + 1) * 0.55);
  const winH = floorH * 0.42;
  const winGeo = new THREE.PlaneGeometry(winW, winH);

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      if (rand() > 0.82) continue;
      const lit = rand() > 0.38;
      const mat = lit ? windowOnMats[(rand() * windowOnMats.length) | 0].clone()
                      : windowOffMat.clone();
      const y = row * floorH + floorH * 0.55;
      const u = (col + 1) / (cols + 1);

      for (const side of [0, 1, 2, 3]) {
        if (side > 1 && rand() > 0.65) continue;
        const win = new THREE.Mesh(winGeo, mat);
        const inset = 0.06;
        if (side === 0) { win.position.set(cx - bw * 0.46 + inset, y, cz + (u - 0.5) * bd * 0.85); win.rotation.y = -Math.PI / 2; }
        if (side === 1) { win.position.set(cx + bw * 0.46 - inset, y, cz + (u - 0.5) * bd * 0.85); win.rotation.y = Math.PI / 2; }
        if (side === 2) { win.position.set(cx + (u - 0.5) * bw * 0.85, y, cz - bd * 0.46 + inset); }
        if (side === 3) { win.position.set(cx + (u - 0.5) * bw * 0.85, y, cz + bd * 0.46 - inset); win.rotation.y = Math.PI; }
        buildingGroup.add(win);
        if (lit) {
          windowLights.push({
            mesh: win, phase: rand() * 10, speed: 0.4 + rand() * 1.2,
            base: mat.color.getHex(), type: 'window'
          });
        }
      }
    }
  }

  /* Neon sign on some buildings */
  if (rand() > 0.78 && h > 12) {
    const neonColors = [0xff4488, 0x44ffcc, 0xffaa22, 0x6688ff, 0xff6644];
    const nc = neonColors[(rand() * neonColors.length) | 0];
    const signW = bw * 0.6;
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(signW, 1.2),
      new THREE.MeshBasicMaterial({ color: nc, transparent: true, opacity: 0.9 })
    );
    const face = rand() > 0.5 ? 0 : 1;
    const sy = 4 + rand() * (h * 0.4);
    if (face === 0) {
      sign.position.set(cx - bw * 0.47, sy, cz);
      sign.rotation.y = -Math.PI / 2;
    } else {
      sign.position.set(cx, sy, cz + bd * 0.47);
    }
    buildingGroup.add(sign);
    const nLight = new THREE.PointLight(nc, 1.2, 18);
    nLight.position.copy(sign.position);
    nLight.position.y -= 0.5;
    scene.add(nLight);
    neonMeshes.push({ mesh: sign, light: nLight, phase: rand() * 8, color: nc });
  }
}

/* ── Fill city grid ── */
for (let gz = 0; gz < GRID; gz++) {
  for (let gx = 0; gx < GRID; gx++) {
    const wx = gx * CELL - HALF;
    const wz = gz * CELL - HALF;

    if (rand() > 0.92) {
      /* Small plaza / park */
      const park = new THREE.Mesh(
        new THREE.PlaneGeometry(BLOCK * 0.95, BLOCK * 0.95),
        new THREE.MeshStandardMaterial({ color: 0x0a1810, roughness: 1 })
      );
      park.rotation.x = -Math.PI / 2;
      park.position.set(wx + BLOCK * 0.5, 0.02, wz + BLOCK * 0.5);
      scene.add(park);
      continue;
    }

    const pad = 0.8 + rand() * 1.2;
    const bw = BLOCK - pad * 2;
    const bd = BLOCK - pad * 2;
    addBuilding(wx + pad, wz + pad, bw, bd);
  }
}
scene.add(buildingGroup);

/* ── Sidewalks along streets ── */
const swGeo = new THREE.BoxGeometry(STREET * 0.85, 0.12, CELL);
for (let i = 0; i < GRID; i++) {
  for (let j = 0; j <= GRID; j++) {
    const xPos = j * CELL - HALF + BLOCK + STREET * 0.5;
    const zPos = i * CELL - HALF + BLOCK + STREET * 0.5;
    const sw1 = new THREE.Mesh(swGeo, sidewalkMat);
    sw1.position.set(xPos, 0.06, i * CELL - HALF + CELL * 0.5);
    scene.add(sw1);
    const sw2 = new THREE.Mesh(
      new THREE.BoxGeometry(CELL, 0.12, STREET * 0.85), sidewalkMat
    );
    sw2.position.set(i * CELL - HALF + CELL * 0.5, 0.06, zPos);
    scene.add(sw2);
  }
}

/* ── Street lamps ── */
const lampGeo = new THREE.CylinderGeometry(0.08, 0.1, 5, 8);
const lampMat = new THREE.MeshStandardMaterial({ color: 0x333844, metalness: 0.7, roughness: 0.4 });
for (let i = 1; i < GRID; i++) {
  for (let j = 0; j < GRID; j++) {
    if (rand() > 0.55) continue;
    const lx = roadCenter(i * CELL - HALF + BLOCK);
    const lz = j * CELL - HALF + CELL * 0.5;
    if (lx === null) continue;
    const pole = new THREE.Mesh(lampGeo, lampMat);
    pole.position.set(lx, 2.5, lz);
    scene.add(pole);
    const bulb = new THREE.PointLight(0xffcc88, 0.8, 16);
    bulb.position.set(lx, 5.2, lz);
    scene.add(bulb);
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffdd99, transparent: true, opacity: 0.7 })
    );
    glow.position.copy(bulb.position);
    scene.add(glow);
  }
}

/* ── Traffic ── */
function createCar(color, axis, lane, speed) {
  const car = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(axis ? 3.8 : 1.6, 0.7, axis ? 1.6 : 3.8),
    new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.5 })
  );
  body.position.y = 0.55;
  car.add(body);
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
  const tlMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
  const hlGeo = new THREE.BoxGeometry(0.35, 0.25, 0.15);
  if (axis) {
    const hl = new THREE.Mesh(hlGeo, hlMat); hl.position.set(1.9, 0.55, 0.45); car.add(hl);
    const hl2 = new THREE.Mesh(hlGeo, hlMat); hl2.position.set(1.9, 0.55, -0.45); car.add(hl2);
    const tl = new THREE.Mesh(hlGeo, tlMat); tl.position.set(-1.9, 0.55, 0.45); car.add(tl);
    const tl2 = new THREE.Mesh(hlGeo, tlMat); tl2.position.set(-1.9, 0.55, -0.45); car.add(tl2);
  } else {
    const hl = new THREE.Mesh(hlGeo, hlMat); hl.position.set(0.45, 0.55, 1.9); car.add(hl);
    const hl2 = new THREE.Mesh(hlGeo, hlMat); hl2.position.set(-0.45, 0.55, 1.9); car.add(hl2);
    const tl = new THREE.Mesh(hlGeo, tlMat); tl.position.set(0.45, 0.55, -1.9); car.add(tl);
    const tl2 = new THREE.Mesh(hlGeo, tlMat); tl2.position.set(-0.45, 0.55, -1.9); car.add(tl2);
  }
  scene.add(car);
  return { mesh: car, axis, lane, speed, offset: rand() * GRID * CELL };
}

const carColors = [0x224466, 0x662233, 0x334433, 0x443322, 0x223344, 0x553344];
for (let i = 0; i < 36; i++) {
  const axis = rand() > 0.5 ? 1 : 0;
  const laneIdx = 1 + (rand() * (GRID - 1) | 0);
  const lane = laneIdx * CELL - HALF + BLOCK + STREET * (0.35 + rand() * 0.3);
  const speed = (8 + rand() * 14) * (rand() > 0.5 ? 1 : -1);
  traffic.push(createCar(carColors[(rand() * carColors.length) | 0], axis, lane, speed));
}

/* ── Stars ── */
const starCount = 1200;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 180 + rand() * 120;
  const theta = rand() * Math.PI * 2;
  const phi = rand() * Math.PI * 0.45;
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = r * Math.cos(phi) + 20;
  starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
const stars = new THREE.Points(
  new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos, 3)),
  new THREE.PointsMaterial({ color: 0xddeeff, size: 0.55, transparent: true, opacity: 0.75, sizeAttenuation: true })
);
scene.add(stars);

/* ── Moon glow ── */
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xdde8ff })
);
moonMesh.position.set(-90, 95, -70);
scene.add(moonMesh);
const moonGlow = new THREE.Mesh(
  new THREE.SphereGeometry(10, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x6688cc, transparent: true, opacity: 0.12 })
);
moonGlow.position.copy(moonMesh.position);
scene.add(moonGlow);

/* ── Distant skyline haze ── */
const hazeGeo = new THREE.PlaneGeometry(400, 80);
const hazeMat = new THREE.MeshBasicMaterial({ color: 0x101830, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
for (let a = 0; a < 4; a++) {
  const haze = new THREE.Mesh(hazeGeo, hazeMat);
  haze.position.y = 25;
  haze.rotation.y = a * Math.PI * 0.5;
  haze.position.x = Math.sin(a * Math.PI * 0.5) * 120;
  haze.position.z = Math.cos(a * Math.PI * 0.5) * 120;
  scene.add(haze);
}

/* ── Camera path ── */
const clock = new THREE.Clock();
let camAngle = 0.8;
const camRadius = 72;
const camHeight = 34;

function updateCamera(t) {
  camAngle += 0.035 * 0.016;
  const breathe = Math.sin(t * 0.15) * 4;
  const radius = camRadius + Math.sin(t * 0.08) * 8;
  camera.position.x = Math.cos(camAngle) * radius;
  camera.position.z = Math.sin(camAngle) * radius;
  camera.position.y = camHeight + breathe + Math.sin(t * 0.11) * 3;
  camera.lookAt(
    Math.sin(t * 0.05) * 8,
    14 + Math.sin(t * 0.09) * 2,
    Math.cos(t * 0.04) * 6
  );
}

/* ── Animation loop ── */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  updateCamera(t);

  for (const w of windowLights) {
    if (w.type === 'window') {
      const flicker = 0.55 + 0.45 * Math.sin(t * w.speed + w.phase);
      w.mesh.material.opacity = flicker;
      if (Math.random() < 0.002) {
        w.mesh.material.color.setHex(rand() > 0.5 ? w.base : 0x0a0c18);
      }
    } else if (w.type === 'blink') {
      w.light.intensity = Math.sin(t * 3 + w.phase) > 0.85 ? 1.5 : 0;
    }
  }

  for (const n of neonMeshes) {
    const pulse = 0.65 + 0.35 * Math.sin(t * 2.2 + n.phase);
    n.mesh.material.opacity = pulse;
    n.light.intensity = pulse * 1.4;
  }

  const limit = GRID * CELL;
  for (const c of traffic) {
    const pos = (t * c.speed + c.offset) % limit;
    const p = pos - HALF;
    if (c.axis) {
      c.mesh.position.set(p, 0, c.lane);
      c.mesh.rotation.y = c.speed > 0 ? 0 : Math.PI;
    } else {
      c.mesh.position.set(c.lane, 0, p);
      c.mesh.rotation.y = c.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
  }

  stars.rotation.y = t * 0.002;
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
});
</script>
</body>
</html>
