<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Maze — Self-Navigating</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #hud {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font: 300 11px/1.4 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(180, 200, 220, 0.45); pointer-events: none;
    text-align: center;
  }
  #title {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    font: 200 13px/1 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: rgba(140, 170, 210, 0.35); pointer-events: none;
  }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title">Infinite Maze</div>
<div id="hud">Self-navigating</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ─── Config ───────────────────────────────────────────────────────────────
const CELL = 4;
const WALL_H = 3.2;
const CHUNK = 8;
const VIEW_RADIUS = 3;
const MOVE_SPEED = 3.2;
const TURN_SPEED = 1.8;
const FOG_NEAR = 6;
const FOG_FAR = 38;

// ─── Seeded RNG ───────────────────────────────────────────────────────────
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) ^ (x * 1274126177);
  h = (h ^ (h >>> 13)) * 1274126177;
  return (h ^ (h >>> 16)) >>> 0;
}
function chunkRng(cx, cy) {
  let s = hash2(cx, cy) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// ─── Maze generation (perfect maze per chunk, edge-aligned) ───────────────
const chunkCache = new Map();

function getChunk(cx, cy) {
  const key = cx + ',' + cy;
  if (chunkCache.has(key)) return chunkCache.get(key);

  const rng = chunkRng(cx, cy);
  const W = CHUNK, H = CHUNK;
  const walls = new Uint8Array(W * H * 4);
  const visited = new Uint8Array(W * H);

  function idx(x, y) { return y * W + x; }
  function wallIndex(x, y, dir) { return (y * W + x) * 4 + dir; }
  // dir: 0=N, 1=E, 2=S, 3=W

  const stack = [[Math.floor(rng() * W), Math.floor(rng() * H)]];
  visited[idx(stack[0][0], stack[0][1])] = 1;

  const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
  const opp = [2, 3, 0, 1];

  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const neighbors = [];
    for (let d = 0; d < 4; d++) {
      const nx = x + dirs[d][0], ny = y + dirs[d][1];
      if (nx >= 0 && nx < W && ny >= 0 && ny < H && !visited[idx(nx, ny)])
        neighbors.push([nx, ny, d]);
    }
    if (neighbors.length === 0) { stack.pop(); continue; }
    const pick = neighbors[Math.floor(rng() * neighbors.length)];
    const [nx, ny, d] = pick;
    walls[wallIndex(x, y, d)] = 0;
    walls[wallIndex(nx, ny, opp[d])] = 0;
    visited[idx(nx, ny)] = 1;
    stack.push([nx, ny]);
  }

  // Border walls: open toward adjacent chunks if their edge aligns
  for (let x = 0; x < W; x++) {
    walls[wallIndex(x, 0, 0)] = isBorderOpen(cx, cy - 1, x, CHUNK - 1, 2) ? 0 : 1;
    walls[wallIndex(x, H - 1, 2)] = isBorderOpen(cx, cy + 1, x, 0, 0) ? 0 : 1;
  }
  for (let y = 0; y < H; y++) {
    walls[wallIndex(0, y, 3)] = isBorderOpen(cx - 1, cy, CHUNK - 1, y, 1) ? 0 : 1;
    walls[wallIndex(W - 1, y, 1)] = isBorderOpen(cx + 1, cy, 0, y, 3) ? 0 : 1;
  }

  const data = { walls, W, H };
  chunkCache.set(key, data);
  return data;
}

function isBorderOpen(ncx, ncy, nx, ny, fromDir) {
  if (!chunkCache.has(ncx + ',' + ncy)) return true;
  const nc = chunkCache.get(ncx + ',' + ncy);
  const wi = (ny * nc.W + nx) * 4 + fromDir;
  return nc.walls[wi] === 0;
}

function hasWall(gx, gy, dir) {
  const cx = Math.floor(gx / CHUNK);
  const cy = Math.floor(gy / CHUNK);
  let lx = ((gx % CHUNK) + CHUNK) % CHUNK;
  let ly = ((gy % CHUNK) + CHUNK) % CHUNK;
  const chunk = getChunk(cx, cy);
  return chunk.walls[(ly * CHUNK + lx) * 4 + dir] !== 0;
}

function isPassable(gx, gy) {
  return !hasWall(gx, gy, 0) || !hasWall(gx, gy, 1) || !hasWall(gx, gy, 2) || !hasWall(gx, gy, 3);
}

function worldPos(gx, gy) {
  return { x: gx * CELL + CELL * 0.5, z: gy * CELL + CELL * 0.5 };
}

// ─── Scene setup ──────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06060c);
scene.fog = new THREE.FogExp2(0x080812, 0.028);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 80);
camera.position.set(CELL * 0.5, 1.55, CELL * 0.5);

const ambient = new THREE.AmbientLight(0x1a2040, 0.35);
scene.add(ambient);

const torch = new THREE.PointLight(0xffaa66, 2.8, 22, 1.6);
torch.castShadow = true;
torch.shadow.mapSize.set(512, 512);
torch.shadow.bias = -0.002;
scene.add(torch);

const fillLight = new THREE.PointLight(0x4466aa, 0.6, 30, 2);
fillLight.position.set(0, 2.5, -3);
camera.add(fillLight);
scene.add(camera);

// Materials
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x2a3048,
  roughness: 0.82,
  metalness: 0.08,
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x12141c,
  roughness: 0.95,
  metalness: 0.02,
});
const ceilMat = new THREE.MeshStandardMaterial({
  color: 0x0c0e16,
  roughness: 1,
  metalness: 0,
  side: THREE.BackSide,
});
const markerMat = new THREE.MeshStandardMaterial({
  color: 0x88bbff,
  emissive: 0x2244aa,
  emissiveIntensity: 0.9,
  roughness: 0.4,
  metalness: 0.3,
});

const chunkMeshes = new Map();
const markerGroup = new THREE.Group();
scene.add(markerGroup);

function buildChunkMesh(cx, cy) {
  const key = cx + ',' + cy;
  if (chunkMeshes.has(key)) return;
  getChunk(cx, cy);

  const group = new THREE.Group();
  const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, 0.18);
  const floorGeo = new THREE.PlaneGeometry(CELL, CELL);
  const ceilGeo = new THREE.PlaneGeometry(CELL, CELL);

  const ox = cx * CHUNK * CELL;
  const oz = cy * CHUNK * CELL;

  for (let ly = 0; ly < CHUNK; ly++) {
    for (let lx = 0; lx < CHUNK; lx++) {
      const gx = cx * CHUNK + lx;
      const gy = cy * CHUNK + ly;
      const wx = ox + lx * CELL + CELL * 0.5;
      const wz = oz + ly * CELL + CELL * 0.5;

      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(wx, 0, wz);
      floor.receiveShadow = true;
      group.add(floor);

      const ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.set(wx, WALL_H, wz);
      group.add(ceil);

      if (hasWall(gx, gy, 0)) {
        const w = new THREE.Mesh(wallGeo, wallMat);
        w.position.set(wx, WALL_H / 2, wz - CELL / 2);
        w.castShadow = true;
        w.receiveShadow = true;
        group.add(w);
      }
      if (hasWall(gx, gy, 1)) {
        const w = new THREE.Mesh(wallGeo, wallMat);
        w.rotation.y = Math.PI / 2;
        w.position.set(wx + CELL / 2, WALL_H / 2, wz);
        w.castShadow = true;
        w.receiveShadow = true;
        group.add(w);
      }
      if (hasWall(gx, gy, 2)) {
        const w = new THREE.Mesh(wallGeo, wallMat);
        w.position.set(wx, WALL_H / 2, wz + CELL / 2);
        w.castShadow = true;
        w.receiveShadow = true;
        group.add(w);
      }
      if (hasWall(gx, gy, 3)) {
        const w = new THREE.Mesh(wallGeo, wallMat);
        w.rotation.y = Math.PI / 2;
        w.position.set(wx - CELL / 2, WALL_H / 2, wz);
        w.castShadow = true;
        w.receiveShadow = true;
        group.add(w);
      }
    }
  }

  scene.add(group);
  chunkMeshes.set(key, group);
}

function unloadDistantChunks(cx, cy) {
  for (const [key, mesh] of chunkMeshes) {
    const [kcx, kcy] = key.split(',').map(Number);
    if (Math.abs(kcx - cx) > VIEW_RADIUS + 1 || Math.abs(kcy - cy) > VIEW_RADIUS + 1) {
      scene.remove(mesh);
      mesh.traverse(o => {
        if (o.geometry) o.geometry.dispose();
      });
      chunkMeshes.delete(key);
    }
  }
}

function updateVisibleChunks(gx, gy) {
  const cx = Math.floor(gx / CHUNK);
  const cy = Math.floor(gy / CHUNK);
  for (let dy = -VIEW_RADIUS; dy <= VIEW_RADIUS; dy++) {
    for (let dx = -VIEW_RADIUS; dx <= VIEW_RADIUS; dx++) {
      buildChunkMesh(cx + dx, cy + dy);
    }
  }
  unloadDistantChunks(cx, cy);
}

// ─── Navigation (self-driving explorer) ───────────────────────────────────
const visited = new Set();
const visitOrder = [];
let navTarget = null;
let navPath = [];
let navIdx = 0;
let yaw = 0;
let targetYaw = 0;
let bobPhase = 0;

function cellKey(gx, gy) { return gx + ',' + gy; }

function neighbors(gx, gy) {
  const result = [];
  const dirs = [[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];
  for (const [dx, dy, d] of dirs) {
    if (!hasWall(gx, gy, d)) result.push([gx + dx, gy + dy]);
  }
  return result;
}

function bfs(startX, startY, goalX, goalY) {
  const sk = cellKey(startX, startY);
  const gk = cellKey(goalX, goalY);
  if (sk === gk) return [[startX, startY]];
  const q = [[startX, startY]];
  const prev = new Map();
  prev.set(sk, null);
  const seen = new Set([sk]);
  while (q.length) {
    const [x, y] = q.shift();
    for (const [nx, ny] of neighbors(x, y)) {
      const nk = cellKey(nx, ny);
      if (seen.has(nk)) continue;
      seen.add(nk);
      prev.set(nk, [x, y]);
      if (nk === gk) {
        const path = [[goalX, goalY]];
        let cur = [x, y];
        while (cur) { path.unshift(cur); cur = prev.get(cellKey(cur[0], cur[1])); }
        return path;
      }
      q.push([nx, ny]);
    }
  }
  return null;
}

function pickExplorationTarget(gx, gy) {
  const unvisited = [];
  const frontier = [];
  const queue = [[gx, gy]];
  const seen = new Set([cellKey(gx, gy)]);
  while (queue.length) {
    const [x, y] = queue.shift();
    for (const [nx, ny] of neighbors(x, y)) {
      const k = cellKey(nx, ny);
      if (seen.has(k)) continue;
      seen.add(k);
      if (!visited.has(k)) {
        unvisited.push([nx, ny]);
      } else {
        frontier.push([nx, ny]);
      }
      queue.push([nx, ny]);
    }
  }
  if (unvisited.length) {
    unvisited.sort((a, b) => {
      const da = (a[0]-gx)**2 + (a[1]-gy)**2;
      const db = (b[0]-gx)**2 + (b[1]-gy)**2;
      return da - db;
    });
    return unvisited[0];
  }
  if (frontier.length) {
    const pick = frontier[Math.floor(Math.random() * frontier.length)];
    return pick;
  }
  const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
  const d = dirs[Math.floor(Math.random() * 4)];
  return [gx + d[0], gy + d[1]];
}

function setNavTo(gx, gy, tx, ty) {
  const path = bfs(gx, gy, tx, ty);
  if (!path || path.length < 2) {
    navPath = [];
    navTarget = null;
    return;
  }
  navPath = path.slice(1);
  navIdx = 0;
  navTarget = navPath[0];
}

function markVisited(gx, gy) {
  const k = cellKey(gx, gy);
  if (!visited.has(k)) {
    visited.add(k);
    visitOrder.push([gx, gy]);
    if (visitOrder.length % 12 === 0) spawnMarker(gx, gy);
  }
}

const markerGeo = new THREE.SphereGeometry(0.08, 8, 8);

function spawnMarker(gx, gy) {
  const p = worldPos(gx, gy);
  const m = new THREE.Mesh(markerGeo, markerMat);
  m.position.set(p.x, 1.6, p.z);
  markerGroup.add(m);
  if (markerGroup.children.length > 40) {
    const old = markerGroup.children[0];
    markerGroup.remove(old);
    old.geometry.dispose();
  }
}

// ─── Particles (ambient dust) ─────────────────────────────────────────────
const particleCount = 120;
const pPositions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  pPositions[i * 3] = (Math.random() - 0.5) * 30;
  pPositions[i * 3 + 1] = Math.random() * WALL_H;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * 30;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x8899bb, size: 0.04, transparent: true, opacity: 0.35, depthWrite: false,
});
const particles = new THREE.Points(pGeo, pMat);
camera.add(particles);

// ─── Init position ────────────────────────────────────────────────────────
let gridX = 0, gridY = 0;
markVisited(gridX, gridY);
updateVisibleChunks(gridX, gridY);
setNavTo(gridX, gridY, ...pickExplorationTarget(gridX, gridY));

let camX = worldPos(gridX, gridY).x;
let camZ = worldPos(gridX, gridY).z;

// ─── Loop ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!navTarget || navIdx >= navPath.length) {
    const [tx, ty] = pickExplorationTarget(gridX, gridY);
    setNavTo(gridX, gridY, tx, ty);
  }

  if (navTarget) {
    const tp = worldPos(navTarget[0], navTarget[1]);
    const dx = tp.x - camX;
    const dz = tp.z - camZ;
    const dist = Math.hypot(dx, dz);

    if (dist < 0.08) {
      gridX = navTarget[0];
      gridY = navTarget[1];
      markVisited(gridX, gridY);
      navIdx++;
      if (navIdx < navPath.length) {
        navTarget = navPath[navIdx];
      } else {
        navTarget = null;
      }
    } else {
      targetYaw = Math.atan2(dx, dz);
      const step = MOVE_SPEED * dt;
      camX += (dx / dist) * Math.min(step, dist);
      camZ += (dz / dist) * Math.min(step, dist);
    }
  }

  yaw = lerpAngle(yaw, targetYaw, 1 - Math.exp(-TURN_SPEED * dt));
  bobPhase += dt * (navTarget ? 5.5 : 1.2);

  const bob = Math.sin(bobPhase) * 0.035;
  camera.position.set(camX, 1.55 + bob, camZ);
  camera.rotation.set(0, yaw, 0, 'YXZ');
  camera.rotation.x = Math.sin(bobPhase * 0.5) * 0.012;

  torch.position.set(camX, 1.55 + bob + 0.1, camZ);

  updateVisibleChunks(gridX, gridY);

  pPositions.forEach((_, i) => {
    const ix = i * 3;
    pPositions[ix] += Math.sin(clock.elapsedTime * 0.3 + i) * 0.002;
    pPositions[ix + 1] += Math.cos(clock.elapsedTime * 0.2 + i * 0.7) * 0.001;
  });
  pGeo.attributes.position.needsUpdate = true;
  particles.position.set(-camX, -1.55, -camZ);

  const pulse = 0.85 + Math.sin(clock.elapsedTime * 2.1) * 0.15;
  torch.intensity = 2.8 * pulse;
  markerMat.emissiveIntensity = 0.6 + Math.sin(clock.elapsedTime * 1.5) * 0.3;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
