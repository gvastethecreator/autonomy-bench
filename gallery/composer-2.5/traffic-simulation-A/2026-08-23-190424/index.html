<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Traffic Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1419;
      color: #e8eaed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: linear-gradient(180deg, #1a2332 0%, #141c28 100%);
      border-bottom: 1px solid #2a3a4f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    h1 span { color: #4fc3f7; }
    .stats {
      display: flex;
      gap: 24px;
      font-size: 0.82rem;
      color: #9aa8b8;
    }
    .stats strong { color: #fff; font-weight: 600; }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #243447;
      border: 1px solid #3a5068;
      color: #e8eaed;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }
    button:hover { background: #2e4258; }
    button.active { background: #1565c0; border-color: #1976d2; }
    #canvas {
      flex: 1;
      display: block;
      width: 100%;
      cursor: crosshair;
    }
    .legend {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(20, 28, 40, 0.92);
      border: 1px solid #2a3a4f;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.75rem;
      color: #9aa8b8;
      backdrop-filter: blur(8px);
    }
    .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>
  <header>
    <h1><span>City</span> Traffic Simulation</h1>
    <div class="stats">
      <div>Vehicles: <strong id="vehicleCount">0</strong></div>
      <div>Throughput: <strong id="throughput">0</strong>/min</div>
      <div>Avg Speed: <strong id="avgSpeed">0</strong> mph</div>
      <div>Time: <strong id="simTime">00:00</strong></div>
    </div>
    <div class="controls">
      <button id="btnPause">Pause</button>
      <button id="btnSpawn">+ Cars</button>
      <button id="btnReset">Reset</button>
    </div>
  </header>
  <canvas id="canvas"></canvas>
  <div class="legend">
    <div><span class="dot" style="background:#4caf50"></span> Green light</div>
    <div><span class="dot" style="background:#f44336"></span> Red light</div>
    <div><span class="dot" style="background:#ffc107"></span> Yellow light</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const GRID_COLS = 8;
    const GRID_ROWS = 6;
    const BLOCK_SIZE = 120;
    const ROAD_WIDTH = 44;
    const LANE_WIDTH = ROAD_WIDTH / 2;

    let paused = false;
    let simTime = 0;
    let vehicles = [];
    let trafficLights = [];
    let buildings = [];
    let spawnTimer = 0;
    let exitCount = 0;
    let lastExitTime = 0;

    const CAR_COLORS = ['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00acc1','#fdd835','#6d4c41','#ec407a','#5c6bc0'];
    const DIRECTIONS = { N: 0, E: 1, S: 2, W: 3 };
    const DIR_VECTORS = [
      { x: 0, y: -1, name: 'N' },
      { x: 1, y: 0, name: 'E' },
      { x: 0, y: 1, name: 'S' },
      { x: -1, y: 0, name: 'W' }
    ];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 52;
    }
    window.addEventListener('resize', resize);
    resize();

    function gridToPixel(col, row) {
      const offsetX = (canvas.width - (GRID_COLS * BLOCK_SIZE + ROAD_WIDTH)) / 2;
      const offsetY = (canvas.height - (GRID_ROWS * BLOCK_SIZE + ROAD_WIDTH)) / 2;
      return {
        x: offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2,
        y: offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2,
        offsetX, offsetY
      };
    }

    function getOffsets() {
      const offsetX = (canvas.width - (GRID_COLS * BLOCK_SIZE + ROAD_WIDTH)) / 2;
      const offsetY = (canvas.height - (GRID_ROWS * BLOCK_SIZE + ROAD_WIDTH)) / 2;
      return { offsetX, offsetY };
    }

    function initBuildings() {
      buildings = [];
      const { offsetX, offsetY } = getOffsets();
      for (let row = 0; row < GRID_ROWS; row++) {
        for (let col = 0; col < GRID_COLS; col++) {
          const bx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH + 4;
          const by = offsetY + row * BLOCK_SIZE + ROAD_WIDTH + 4;
          const bw = BLOCK_SIZE - ROAD_WIDTH - 8;
          const bh = BLOCK_SIZE - ROAD_WIDTH - 8;
          const hue = 210 + Math.random() * 30;
          const sat = 15 + Math.random() * 20;
          const lit = 18 + Math.random() * 12;
          buildings.push({
            x: bx, y: by, w: bw, h: bh,
            color: `hsl(${hue}, ${sat}%, ${lit}%)`,
            windows: generateWindows(bw, bh),
            height: 0.6 + Math.random() * 0.4
          });
        }
      }
    }

    function generateWindows(w, h) {
      const wins = [];
      const cols = Math.floor(w / 14);
      const rows = Math.floor(h / 16);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.random() > 0.35) {
            wins.push({
              x: 6 + c * 14,
              y: 6 + r * 16,
              lit: Math.random() > 0.4
            });
          }
        }
      }
      return wins;
    }

    function initTrafficLights() {
      trafficLights = [];
      const { offsetX, offsetY } = getOffsets();
      for (let row = 0; row <= GRID_ROWS; row++) {
        for (let col = 0; col <= GRID_COLS; col++) {
          const cx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2;
          const cy = offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2;
          if (col < GRID_COLS && row < GRID_ROWS) {
            trafficLights.push({
              x: cx, y: cy,
              phase: Math.random() * 12000,
              cycleTime: 8000 + Math.random() * 4000,
              yellowTime: 1500,
              nsGreen: Math.random() > 0.5
            });
          }
        }
      }
    }

    function getLightState(light, dir) {
      const elapsed = (simTime + light.phase) % light.cycleTime;
      const greenDuration = light.cycleTime - light.yellowTime * 2;
      const isNS = dir === 'N' || dir === 'S';
      const nsGreen = light.nsGreen;

      if (elapsed < greenDuration) {
        return (isNS === nsGreen) ? 'green' : 'red';
      } else if (elapsed < greenDuration + light.yellowTime) {
        return (isNS === nsGreen) ? 'yellow' : 'red';
      } else if (elapsed < greenDuration + light.yellowTime * 2) {
        return (isNS === nsGreen) ? 'red' : 'yellow';
      } else {
        return (isNS === nsGreen) ? 'red' : 'green';
      }
    }

    class Vehicle {
      constructor(x, y, dir, lane) {
        this.x = x;
        this.y = y;
        this.dir = dir;
        this.lane = lane;
        this.speed = 1.2 + Math.random() * 0.8;
        this.maxSpeed = 2.5 + Math.random() * 0.5;
        this.color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
        this.width = 10;
        this.length = 18;
        this.waiting = false;
        this.turnIntent = Math.random();
        this.hasTurned = false;
        this.id = Math.random();
      }

      getVector() { return DIR_VECTORS[this.dir]; }

      getLaneOffset() {
        const perp = (this.dir + 1) % 4;
        const pv = DIR_VECTORS[perp];
        const offset = this.lane === 0 ? -LANE_WIDTH / 4 : LANE_WIDTH / 4;
        return { x: pv.x * offset, y: pv.y * offset };
      }

      getFrontPosition() {
        const v = this.getVector();
        const lo = this.getLaneOffset();
        return {
          x: this.x + lo.x + v.x * (this.length / 2 + 4),
          y: this.y + lo.y + v.y * (this.length / 2 + 4)
        };
      }

      distTo(other) {
        const dx = this.x - other.x;
        const dy = this.y - other.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      isSameRoad(other) {
        const v1 = this.getVector();
        const v2 = other.getVector();
        if (v1.x !== v2.x || v1.y !== v2.y) return false;
        if (this.lane !== other.lane) return false;
        const perp1 = (this.dir + 1) % 4;
        const perp2 = (other.dir + 1) % 4;
        const pv = DIR_VECTORS[perp1];
        const pos1 = this.x * pv.x + this.y * pv.y;
        const pos2 = other.x * pv.x + other.y * pv.y;
        return Math.abs(pos1 - pos2) < LANE_WIDTH;
      }

      isAhead(other) {
        const v = this.getVector();
        const dx = other.x - this.x;
        const dy = other.y - this.y;
        return dx * v.x + dy * v.y > 0;
      }

      nearIntersection() {
        const { offsetX, offsetY } = getOffsets();
        const v = this.getVector();
        const front = this.getFrontPosition();
        for (let row = 0; row <= GRID_ROWS; row++) {
          for (let col = 0; col <= GRID_COLS; col++) {
            const cx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2;
            const cy = offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2;
            const dist = Math.sqrt((front.x - cx) ** 2 + (front.y - cy) ** 2);
            if (dist < ROAD_WIDTH * 0.6) {
              const approach = Math.abs(front.x - cx) > Math.abs(front.y - cy);
              const dirName = v.name;
              const isApproaching =
                (dirName === 'E' && front.x < cx && approach) ||
                (dirName === 'W' && front.x > cx && approach) ||
                (dirName === 'S' && front.y < cy && !approach) ||
                (dirName === 'N' && front.y > cy && !approach);
              if (isApproaching || dist < 15) {
                return { light: trafficLights[row * (GRID_COLS + 1) + col], cx, cy, dist };
              }
            }
          }
        }
        return null;
      }

      update() {
        let targetSpeed = this.maxSpeed;
        this.waiting = false;

        const front = this.getFrontPosition();
        for (const other of vehicles) {
          if (other === this) continue;
          if (!this.isSameRoad(other)) continue;
          if (!this.isAhead(other)) continue;
          const d = this.distTo(other);
          if (d < this.length + 8) {
            targetSpeed = 0;
            this.waiting = true;
            break;
          } else if (d < this.length + 25) {
            targetSpeed = Math.min(targetSpeed, other.speed * 0.8);
          }
        }

        const intersection = this.nearIntersection();
        if (intersection && intersection.dist < ROAD_WIDTH * 0.55) {
          const state = getLightState(intersection.light, this.getVector().name);
          if (state === 'red' || state === 'yellow') {
            if (intersection.dist < ROAD_WIDTH * 0.45) {
              targetSpeed = 0;
              this.waiting = true;
            } else {
              targetSpeed = Math.min(targetSpeed, 0.5);
            }
          }
        }

        this.speed += (targetSpeed - this.speed) * 0.15;
        if (this.speed < 0.05) this.speed = 0;

        const v = this.getVector();
        this.x += v.x * this.speed;
        this.y += v.y * this.speed;

        this.checkTurn();
        this.checkBounds();
      }

      checkTurn() {
        if (this.hasTurned) return;
        const { offsetX, offsetY } = getOffsets();
        const v = this.getVector();

        for (let row = 0; row <= GRID_ROWS; row++) {
          for (let col = 0; col <= GRID_COLS; col++) {
            const cx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2;
            const cy = offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2;
            const dist = Math.sqrt((this.x - cx) ** 2 + (this.y - cy) ** 2);
            if (dist < 8 && this.turnIntent < 0.3) {
              const turnDir = Math.random() > 0.5 ? 1 : -1;
              this.dir = (this.dir + turnDir + 4) % 4;
              this.lane = Math.random() > 0.5 ? 0 : 1;
              this.hasTurned = true;
              return;
            }
          }
        }
      }

      checkBounds() {
        const { offsetX, offsetY } = getOffsets();
        const margin = 30;
        const minX = offsetX - margin;
        const maxX = offsetX + GRID_COLS * BLOCK_SIZE + ROAD_WIDTH + margin;
        const minY = offsetY - margin;
        const maxY = offsetY + GRID_ROWS * BLOCK_SIZE + ROAD_WIDTH + margin;

        if (this.x < minX || this.x > maxX || this.y < minY || this.y > maxY) {
          this.remove = true;
          exitCount++;
          lastExitTime = simTime;
        }
      }

      draw() {
        const v = this.getVector();
        const lo = this.getLaneOffset();
        const px = this.x + lo.x;
        const py = this.y + lo.y;
        const angle = this.dir * Math.PI / 2;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle);

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-this.length / 2, -this.width / 2, this.length, this.width, 3);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(this.length / 2 - 5, -this.width / 2 + 1, 4, this.width - 2);

        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(-this.length / 2 + 2, -this.width / 2 + 1, 5, this.width - 2);

        if (this.waiting) {
          ctx.fillStyle = '#ff5722';
          ctx.beginPath();
          ctx.arc(-this.length / 2 + 3, 0, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function spawnVehicle() {
      const { offsetX, offsetY } = getOffsets();
      const edges = [];

      for (let col = 0; col <= GRID_COLS; col++) {
        const cx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2;
        edges.push({ x: cx, y: offsetY - 20, dir: DIRECTIONS.S, lane: col % 2 });
        edges.push({ x: cx, y: offsetY + GRID_ROWS * BLOCK_SIZE + ROAD_WIDTH + 20, dir: DIRECTIONS.N, lane: col % 2 });
      }
      for (let row = 0; row <= GRID_ROWS; row++) {
        const cy = offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2;
        edges.push({ x: offsetX - 20, y: cy, dir: DIRECTIONS.E, lane: row % 2 });
        edges.push({ x: offsetX + GRID_COLS * BLOCK_SIZE + ROAD_WIDTH + 20, y: cy, dir: DIRECTIONS.W, lane: row % 2 });
      }

      const spawn = edges[Math.floor(Math.random() * edges.length)];
      const tooClose = vehicles.some(v => {
        return v.distTo({ x: spawn.x, y: spawn.y }) < 30 && v.dir === spawn.dir;
      });
      if (!tooClose && vehicles.length < 80) {
        vehicles.push(new Vehicle(spawn.x, spawn.y, spawn.dir, spawn.lane));
      }
    }

    function drawRoads() {
      const { offsetX, offsetY } = getOffsets();
      const totalW = GRID_COLS * BLOCK_SIZE + ROAD_WIDTH;
      const totalH = GRID_ROWS * BLOCK_SIZE + ROAD_WIDTH;

      ctx.fillStyle = '#2d3748';
      ctx.fillRect(offsetX, offsetY - ROAD_WIDTH, totalW + ROAD_WIDTH, totalH + ROAD_WIDTH * 2);

      for (let col = 0; col <= GRID_COLS; col++) {
        const x = offsetX + col * BLOCK_SIZE;
        ctx.fillStyle = '#3d4f63';
        ctx.fillRect(x, offsetY, ROAD_WIDTH, totalH);

        ctx.strokeStyle = '#f0e68c';
        ctx.lineWidth = 1;
        ctx.setLineDash([8, 12]);
        for (let row = 0; row < GRID_ROWS; row++) {
          const ry = offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2;
          ctx.beginPath();
          ctx.moveTo(x + ROAD_WIDTH / 2, ry - BLOCK_SIZE / 2 + ROAD_WIDTH);
          ctx.lineTo(x + ROAD_WIDTH / 2, ry + BLOCK_SIZE / 2 - ROAD_WIDTH);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }

      for (let row = 0; row <= GRID_ROWS; row++) {
        const y = offsetY + row * BLOCK_SIZE;
        ctx.fillStyle = '#3d4f63';
        ctx.fillRect(offsetX, y, totalW, ROAD_WIDTH);

        ctx.strokeStyle = '#f0e68c';
        ctx.lineWidth = 1;
        ctx.setLineDash([8, 12]);
        for (let col = 0; col < GRID_COLS; col++) {
          const rx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2;
          ctx.beginPath();
          ctx.moveTo(rx - BLOCK_SIZE / 2 + ROAD_WIDTH, y + ROAD_WIDTH / 2);
          ctx.lineTo(rx + BLOCK_SIZE / 2 - ROAD_WIDTH, y + ROAD_WIDTH / 2);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }

      for (let row = 0; row <= GRID_ROWS; row++) {
        for (let col = 0; col <= GRID_COLS; col++) {
          const cx = offsetX + col * BLOCK_SIZE + ROAD_WIDTH / 2;
          const cy = offsetY + row * BLOCK_SIZE + ROAD_WIDTH / 2;
          ctx.fillStyle = '#4a5568';
          ctx.beginPath();
          ctx.arc(cx, cy, ROAD_WIDTH / 2 + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawBuildings() {
      for (const b of buildings) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h * b.height);

        for (const w of b.windows) {
          ctx.fillStyle = w.lit ? 'rgba(255, 220, 120, 0.7)' : 'rgba(30, 40, 60, 0.8)';
          ctx.fillRect(b.x + w.x, b.y + w.y, 8, 10);
        }
      }
    }

    function drawTrafficLights() {
      for (const light of trafficLights) {
        const nsState = getLightState(light, 'N');
        const ewState = getLightState(light, 'E');

        drawLightBulb(light.x - 6, light.y - ROAD_WIDTH / 2 + 4, nsState);
        drawLightBulb(light.x + 6, light.y + ROAD_WIDTH / 2 - 12, getLightState(light, 'S'));
        drawLightBulb(light.x - ROAD_WIDTH / 2 + 4, light.y - 6, ewState);
        drawLightBulb(light.x + ROAD_WIDTH / 2 - 12, light.y + 6, getLightState(light, 'W'));
      }
    }

    function drawLightBulb(x, y, state) {
      const colors = { green: '#4caf50', yellow: '#ffc107', red: '#f44336' };
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(x - 1, y - 1, 10, 10);
      ctx.fillStyle = colors[state];
      ctx.shadowColor = colors[state];
      ctx.shadowBlur = state === 'green' ? 6 : 3;
      ctx.beginPath();
      ctx.arc(x + 4, y + 4, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function draw() {
      ctx.fillStyle = '#1a2332';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawRoads();
      drawBuildings();
      drawTrafficLights();

      for (const v of vehicles) v.draw();
    }

    function updateStats() {
      document.getElementById('vehicleCount').textContent = vehicles.length;
      const throughput = simTime > 0 ? Math.round(exitCount / (simTime / 60000)) : 0;
      document.getElementById('throughput').textContent = throughput;
      const avgSpeed = vehicles.length > 0
        ? Math.round(vehicles.reduce((s, v) => s + v.speed, 0) / vehicles.length * 15)
        : 0;
      document.getElementById('avgSpeed').textContent = avgSpeed;
      const secs = Math.floor(simTime / 1000);
      const mins = Math.floor(secs / 60);
      document.getElementById('simTime').textContent =
        `${String(mins).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    }

    let lastTime = 0;
    function loop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;

      if (!paused) {
        simTime += dt;
        spawnTimer += dt;
        if (spawnTimer > 800) {
          spawnVehicle();
          spawnTimer = 0;
        }

        for (const v of vehicles) v.update();
        vehicles = vehicles.filter(v => !v.remove);
      }

      draw();
      updateStats();
      requestAnimationFrame(loop);
    }

    document.getElementById('btnPause').addEventListener('click', () => {
      paused = !paused;
      document.getElementById('btnPause').textContent = paused ? 'Resume' : 'Pause';
      document.getElementById('btnPause').classList.toggle('active', paused);
    });

    document.getElementById('btnSpawn').addEventListener('click', () => {
      for (let i = 0; i < 5; i++) spawnVehicle();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      vehicles = [];
      simTime = 0;
      exitCount = 0;
      initTrafficLights();
    });

    initBuildings();
    initTrafficLights();
    for (let i = 0; i < 15; i++) spawnVehicle();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
