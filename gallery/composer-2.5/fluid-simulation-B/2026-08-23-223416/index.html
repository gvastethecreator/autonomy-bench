<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fluid Dreams</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    cursor: crosshair;
  }
  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(16px, 3vw, 32px);
  }
  .title {
    color: rgba(255,255,255,0.85);
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(120,180,255,0.4);
    opacity: 0;
    animation: fadeIn 2s ease 0.5s forwards;
  }
  .hint {
    align-self: center;
    color: rgba(255,255,255,0.35);
    font-size: clamp(0.75rem, 1.5vw, 0.9rem);
    letter-spacing: 0.08em;
    opacity: 0;
    animation: fadeIn 2s ease 2s forwards, pulse 4s ease-in-out 4s infinite;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.15; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="title">Fluid Dreams</div>
  <div class="hint">Move to paint · Click to burst</div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', {
    alpha: false, antialias: false, depth: false, preserveDrawingBuffer: false
  });
  if (!gl) {
    document.body.innerHTML = '<p style="color:#fff;padding:2rem">WebGL2 required.</p>';
    return;
  }

  const ext = gl.getExtension('EXT_color_buffer_float');
  if (!ext) {
    document.body.innerHTML = '<p style="color:#fff;padding:2rem">Float textures required.</p>';
    return;
  }

  const RES = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, SIM = 128;

  function resize() {
    W = Math.floor(window.innerWidth * RES);
    H = Math.floor(window.innerHeight * RES);
    canvas.width = W;
    canvas.height = H;
    SIM = Math.min(256, Math.max(96, Math.floor(Math.min(W, H) / 4)));
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---- Shader helpers ---- */
  const vsQuad = `#version 300 es
    in vec2 a_pos;
    out vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error('Shader compile failed');
    }
    return s;
  }

  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(p));
      throw new Error('Program link failed');
    }
    return p;
  }

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  function bindQuad(prog) {
    const loc = gl.getAttribLocation(prog, 'a_pos');
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  }

  function fbo(w, h, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter || gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter || gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }

  function pingPong(w, h, filter) {
    return { read: fbo(w, h, filter), write: fbo(w, h, filter), swap() {
      const t = this.read; this.read = this.write; this.write = t;
    }};
  }

  /* ---- Simulation shaders ---- */
  const fsAdvect = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_field;
    uniform sampler2D u_vel;
    uniform vec2 u_texel;
    uniform float u_diss;
    uniform float u_dt;
    out vec4 outColor;
    void main() {
      vec2 vel = texture(u_vel, v_uv).xy;
      vec2 coord = v_uv - u_dt * vel * u_texel * float(textureSize(u_field, 0));
      outColor = u_diss * texture(u_field, coord);
    }`;

  const fsDivergence = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_vel;
    uniform vec2 u_texel;
    out vec4 outColor;
    void main() {
      float L = texture(u_vel, v_uv - vec2(u_texel.x, 0)).x;
      float R = texture(u_vel, v_uv + vec2(u_texel.x, 0)).x;
      float B = texture(u_vel, v_uv - vec2(0, u_texel.y)).y;
      float T = texture(u_vel, v_uv + vec2(0, u_texel.y)).y;
      outColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
    }`;

  const fsPressure = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_pressure;
    uniform sampler2D u_div;
    uniform vec2 u_texel;
    out vec4 outColor;
    void main() {
      float L = texture(u_pressure, v_uv - vec2(u_texel.x, 0)).x;
      float R = texture(u_pressure, v_uv + vec2(u_texel.x, 0)).x;
      float B = texture(u_pressure, v_uv - vec2(0, u_texel.y)).x;
      float T = texture(u_pressure, v_uv + vec2(0, u_texel.y)).x;
      float div = texture(u_div, v_uv).x;
      outColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
    }`;

  const fsGradient = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_vel;
    uniform sampler2D u_pressure;
    uniform vec2 u_texel;
    out vec4 outColor;
    void main() {
      float L = texture(u_pressure, v_uv - vec2(u_texel.x, 0)).x;
      float R = texture(u_pressure, v_uv + vec2(u_texel.x, 0)).x;
      float B = texture(u_pressure, v_uv - vec2(0, u_texel.y)).x;
      float T = texture(u_pressure, v_uv + vec2(0, u_texel.y)).x;
      vec2 v = texture(u_vel, v_uv).xy;
      outColor = vec4(v - vec2(R - L, T - B) * 0.5, 0.0, 1.0);
    }`;

  const fsCurl = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_vel;
    uniform vec2 u_texel;
    out vec4 outColor;
    void main() {
      float L = texture(u_vel, v_uv - vec2(u_texel.x, 0)).y;
      float R = texture(u_vel, v_uv + vec2(u_texel.x, 0)).y;
      float B = texture(u_vel, v_uv - vec2(0, u_texel.y)).x;
      float T = texture(u_vel, v_uv + vec2(0, u_texel.y)).x;
      outColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
    }`;

  const fsVorticity = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_vel;
    uniform sampler2D u_curl;
    uniform vec2 u_texel;
    uniform float u_strength;
    uniform float u_dt;
    out vec4 outColor;
    void main() {
      float L = abs(texture(u_curl, v_uv - vec2(u_texel.x, 0)).x);
      float R = abs(texture(u_curl, v_uv + vec2(u_texel.x, 0)).x);
      float B = abs(texture(u_curl, v_uv - vec2(0, u_texel.y)).x);
      float T = abs(texture(u_curl, v_uv + vec2(0, u_texel.y)).x);
      vec2 grad = vec2(R - L, T - B) / (L + R + B + T + 1e-5);
      float c = texture(u_curl, v_uv).x;
      vec2 force = u_strength * vec2(grad.y, -grad.x) * c;
      vec2 v = texture(u_vel, v_uv).xy;
      outColor = vec4(v + force * u_dt, 0.0, 1.0);
    }`;

  const fsSplatVel = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_target;
    uniform vec2 u_point;
    uniform vec3 u_color;
    uniform float u_radius;
    out vec4 outColor;
    void main() {
      vec2 p = v_uv - u_point;
      p.x *= u_radius;
      vec4 base = texture(u_target, v_uv);
      float d = dot(p, p);
      float m = exp(-d * 80.0);
      outColor = base + vec4(u_color.xy * m, 0.0, 0.0);
    }`;

  const fsSplatDye = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_target;
    uniform vec2 u_point;
    uniform vec3 u_color;
    uniform float u_radius;
    out vec4 outColor;
    void main() {
      vec2 p = v_uv - u_point;
      p.x *= u_radius;
      vec4 base = texture(u_target, v_uv);
      float d = dot(p, p);
      float m = exp(-d * 60.0);
      outColor = base + vec4(u_color * m, 0.0);
    }`;

  const fsDisplay = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_dye;
    uniform float u_time;
    out vec4 outColor;
    void main() {
      vec3 dye = texture(u_dye, v_uv).rgb;
      float lum = dot(dye, vec3(0.299, 0.587, 0.114));
      vec3 bloom = dye * dye * 2.5;
      vec3 bg = vec3(0.02, 0.025, 0.06);
      vec3 vignette = vec3(1.0 - 0.35 * length(v_uv - 0.5));
      vec3 col = bg + (dye + bloom * 0.6) * vignette;
      col = pow(col, vec3(0.92));
      float grain = fract(sin(dot(v_uv * u_time, vec2(12.9898, 78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.015;
      outColor = vec4(col, 1.0);
    }`;

  const fsClear = `#version 300 es
    precision highp float;
    in vec2 v_uv;
    uniform sampler2D u_tex;
    uniform float u_val;
    out vec4 outColor;
    void main() {
      outColor = u_val * texture(u_tex, v_uv);
    }`;

  const progAdvect = program(vsQuad, fsAdvect);
  const progDiv = program(vsQuad, fsDivergence);
  const progPressure = program(vsQuad, fsPressure);
  const progGrad = program(vsQuad, fsGradient);
  const progCurl = program(vsQuad, fsCurl);
  const progVort = program(vsQuad, fsVorticity);
  const progSplatVel = program(vsQuad, fsSplatVel);
  const progSplatDye = program(vsQuad, fsSplatDye);
  const progDisplay = program(vsQuad, fsDisplay);
  const progClear = program(vsQuad, fsClear);

  let vel, dye, pressure, divergence, curl;
  let lastSim = 0;

  function initBuffers() {
    vel = pingPong(SIM, SIM, gl.LINEAR);
    dye = pingPong(SIM, SIM, gl.LINEAR);
    pressure = pingPong(SIM, SIM, gl.NEAREST);
    divergence = fbo(SIM, SIM, gl.NEAREST);
    curl = fbo(SIM, SIM, gl.NEAREST);
    lastSim = SIM;
  }
  initBuffers();

  function blit(prog, target, uniforms) {
    gl.useProgram(prog);
    bindQuad(prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    if (target) {
      gl.viewport(0, 0, target.w, target.h);
    } else {
      gl.viewport(0, 0, W, H);
    }
    for (const [name, val] of Object.entries(uniforms)) {
      const loc = gl.getUniformLocation(prog, name);
      if (val instanceof WebGLTexture) {
        gl.activeTexture(gl.TEXTURE0 + val._unit);
        gl.bindTexture(gl.TEXTURE_2D, val);
        gl.uniform1i(loc, val._unit);
      } else if (typeof val === 'number') {
        gl.uniform1f(loc, val);
      } else if (val.length === 2) {
        gl.uniform2fv(loc, val);
      } else if (val.length === 3) {
        gl.uniform3fv(loc, val);
      }
    }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function texUnit(tex, unit) {
    tex._unit = unit;
    return tex;
  }

  const texel = () => [1 / SIM, 1 / SIM];
  const DT = 0.016;
  const PRESSURE_ITERS = 20;
  const VEL_DISS = 0.99;
  const DYE_DISS = 0.985;
  const VORTICITY = 25.0;

  function step() {
    if (SIM !== lastSim) initBuffers();

    const t = texel();

    blit(progCurl, curl, {
      u_vel: texUnit(vel.read.tex, 0),
      u_texel: t
    });

    blit(progVort, vel.write, {
      u_vel: texUnit(vel.read.tex, 0),
      u_curl: texUnit(curl.tex, 1),
      u_texel: t,
      u_strength: VORTICITY,
      u_dt: DT
    });
    vel.swap();

    blit(progAdvect, vel.write, {
      u_field: texUnit(vel.read.tex, 0),
      u_vel: texUnit(vel.read.tex, 1),
      u_texel: t,
      u_diss: VEL_DISS,
      u_dt: DT
    });
    vel.swap();

    blit(progDiv, divergence, {
      u_vel: texUnit(vel.read.tex, 0),
      u_texel: t
    });

    blit(progClear, pressure.read, { u_tex: texUnit(pressure.read.tex, 0), u_val: 0.0 });

    for (let i = 0; i < PRESSURE_ITERS; i++) {
      blit(progPressure, pressure.write, {
        u_pressure: texUnit(pressure.read.tex, 0),
        u_div: texUnit(divergence.tex, 1),
        u_texel: t
      });
      pressure.swap();
    }

    blit(progGrad, vel.write, {
      u_vel: texUnit(vel.read.tex, 0),
      u_pressure: texUnit(pressure.read.tex, 1),
      u_texel: t
    });
    vel.swap();

    blit(progAdvect, dye.write, {
      u_field: texUnit(dye.read.tex, 0),
      u_vel: texUnit(vel.read.tex, 1),
      u_texel: t,
      u_diss: DYE_DISS,
      u_dt: DT
    });
    dye.swap();
  }

  function splat(point, velColor, dyeColor, radius) {
    const aspect = W / H;
    const p = [point.x, 1.0 - point.y];
    const r = aspect;

    blit(progSplatVel, vel.write, {
      u_target: texUnit(vel.read.tex, 0),
      u_point: p,
      u_color: velColor,
      u_radius: r
    });
    vel.swap();

    blit(progSplatDye, dye.write, {
      u_target: texUnit(dye.read.tex, 0),
      u_point: p,
      u_color: dyeColor,
      u_radius: r
    });
    dye.swap();
  }

  /* ---- Input ---- */
  const pointer = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, down: false, moved: false };
  let hue = 0;

  function hsvToRgb(h, s, v) {
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  function normPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width,
      y: (e.clientY - r.top) / r.height
    };
  }

  function onMove(e) {
    const p = normPos(e);
    pointer.moved = true;
    pointer.px = pointer.x;
    pointer.py = pointer.y;
    pointer.x = p.x;
    pointer.y = p.y;
  }

  function onDown(e) {
    pointer.down = true;
    onMove(e);
    burst(p.x, p.y, 1.5);
  }

  function onUp() { pointer.down = false; }

  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0]); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0]); }, { passive: false });
  canvas.addEventListener('touchend', onUp);

  function burst(x, y, scale) {
    hue = (hue + 0.07 + Math.random() * 0.05) % 1;
    const rgb = hsvToRgb(hue, 0.85 + Math.random() * 0.15, 0.95 + Math.random() * 0.05);
    const angle = Math.random() * Math.PI * 2;
    const force = (800 + Math.random() * 400) * scale;
    const vx = Math.cos(angle) * force;
    const vy = Math.sin(angle) * force;
    splat({ x, y }, [vx, vy, 0], rgb.map(c => c * (1.8 + Math.random() * 0.4)), 0.003 + Math.random() * 0.002);
  }

  /* ---- Ambient motion ---- */
  const orbs = Array.from({ length: 5 }, (_, i) => ({
    x: 0.2 + i * 0.15,
    y: 0.3 + (i % 3) * 0.2,
    vx: (Math.random() - 0.5) * 0.0008,
    vy: (Math.random() - 0.5) * 0.0008,
    phase: Math.random() * Math.PI * 2,
    speed: 0.3 + Math.random() * 0.4
  }));

  let startTime = performance.now();
  let lastFrame = startTime;
  let idleTime = 0;

  function animate(now) {
    requestAnimationFrame(animate);
    const elapsed = (now - startTime) * 0.001;
    const frameDt = Math.min((now - lastFrame) * 0.001, 0.033);
    lastFrame = now;

    if (SIM !== lastSim) {
      SIM = Math.min(256, Math.max(96, Math.floor(Math.min(W, H) / 4)));
    }

    /* Pointer splats */
    if (pointer.moved) {
      const dx = pointer.x - pointer.px;
      const dy = pointer.y - pointer.py;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.001) {
        idleTime = 0;
        hue = (hue + dist * 2.5) % 1;
        const rgb = hsvToRgb(hue, 0.9, 1.0);
        const force = 12000;
        splat(
          { x: pointer.x, y: pointer.y },
          [dx * force, -dy * force, 0],
          rgb.map(c => c * 1.5),
          0.0025
        );
      }
      pointer.moved = false;
    }

    idleTime += frameDt;

    /* Ambient orbs when idle */
    for (const o of orbs) {
      o.x += o.vx + Math.sin(elapsed * o.speed + o.phase) * 0.0003;
      o.y += o.vy + Math.cos(elapsed * o.speed * 0.7 + o.phase) * 0.0003;
      if (o.x < 0.05 || o.x > 0.95) o.vx *= -1;
      if (o.y < 0.05 || o.y > 0.95) o.vy *= -1;
      if (idleTime > 1.5 && Math.random() < 0.02) {
        burst(o.x, o.y, 0.4);
      }
    }

    /* Initial splash */
    if (elapsed < 0.1) {
      for (let i = 0; i < 6; i++) {
        burst(0.3 + Math.random() * 0.4, 0.3 + Math.random() * 0.4, 0.8);
      }
    }

    step();

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    blit(progDisplay, null, {
      u_dye: texUnit(dye.read.tex, 0),
      u_time: elapsed
    });
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
