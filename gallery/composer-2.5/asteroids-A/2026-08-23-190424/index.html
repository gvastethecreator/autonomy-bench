<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Courier New", Courier, monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      let W = 800;
      let H = 600;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      window.addEventListener("resize", resize);
      resize();

      const TAU = Math.PI * 2;
      const FRICTION = 0.992;
      const MAX_BULLETS = 4;
      const BULLET_SPEED = 520;
      const BULLET_LIFE = 1.1;
      const SHIP_THRUST = 280;
      const SHIP_ROT_SPEED = 4.8;
      const SHIP_RADIUS = 14;
      const INVULN_TIME = 2.5;
      const HYPERSPACE_COOLDOWN = 2.0;

      const ASTEROID_SIZES = [
        { radius: 48, speed: 70, points: 20, verts: 10 },
        { radius: 28, speed: 100, points: 50, verts: 9 },
        { radius: 16, speed: 140, points: 100, verts: 8 },
      ];

      const keys = {};
      window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
          e.preventDefault();
        }
        if (e.code === "Space" && state === "start") startGame();
        if (e.code === "Space" && state === "over") restartGame();
      });
      window.addEventListener("keyup", (e) => { keys[e.code] = false; });

      let state = "start";
      let score = 0;
      let lives = 3;
      let level = 1;
      let waveClearTimer = 0;

      const ship = {
        x: 0, y: 0, vx: 0, vy: 0, angle: -Math.PI / 2,
        thrusting: false, invuln: 0, hyperspaceCd: 0, dead: false,
      };

      let bullets = [];
      let asteroids = [];
      let particles = [];
      let stars = [];

      function rand(min, max) { return min + Math.random() * (max - min); }
      function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

      function wrap(obj) {
        if (obj.x < -50) obj.x = W + 50;
        if (obj.x > W + 50) obj.x = -50;
        if (obj.y < -50) obj.y = H + 50;
        if (obj.y > H + 50) obj.y = -50;
      }

      function dist(ax, ay, bx, by) {
        const dx = ax - bx;
        const dy = ay - by;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function initStars() {
        stars = [];
        for (let i = 0; i < 120; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() < 0.7 ? 1 : 2,
            alpha: rand(0.2, 0.9),
          });
        }
      }

      function resetShip() {
        ship.x = W / 2;
        ship.y = H / 2;
        ship.vx = 0;
        ship.vy = 0;
        ship.angle = -Math.PI / 2;
        ship.thrusting = false;
        ship.invuln = INVULN_TIME;
        ship.hyperspaceCd = 0;
        ship.dead = false;
      }

      function makeAsteroid(x, y, sizeIndex, vx, vy) {
        const cfg = ASTEROID_SIZES[sizeIndex];
        const verts = [];
        for (let i = 0; i < cfg.verts; i++) {
          const a = (i / cfg.verts) * TAU;
          const r = cfg.radius * rand(0.75, 1.0);
          verts.push({ angle: a, dist: r });
        }
        if (vx === undefined) {
          const dir = rand(0, TAU);
          const spd = cfg.speed * rand(0.6, 1.2);
          vx = Math.cos(dir) * spd;
          vy = Math.sin(dir) * spd;
        }
        return {
          x: x ?? rand(0, W),
          y: y ?? rand(0, H),
          vx, vy,
          sizeIndex,
          radius: cfg.radius,
          verts,
          rot: rand(-1.5, 1.5),
          angle: rand(0, TAU),
        };
      }

      function spawnAsteroids(count) {
        for (let i = 0; i < count; i++) {
          let ax, ay;
          do {
            ax = rand(0, W);
            ay = rand(0, H);
          } while (dist(ax, ay, ship.x, ship.y) < 120);
          asteroids.push(makeAsteroid(ax, ay, 0));
        }
      }

      function spawnParticles(x, y, count, color, speed) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, TAU);
          const s = speed * rand(0.4, 1.0);
          particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: rand(0.3, 0.8),
            maxLife: 0.8,
            color,
            size: rand(1, 3),
          });
        }
      }

      function startGame() {
        score = 0;
        lives = 3;
        level = 1;
        bullets = [];
        asteroids = [];
        particles = [];
        resetShip();
        initStars();
        spawnAsteroids(4);
        state = "playing";
        waveClearTimer = 0;
      }

      function restartGame() {
        startGame();
      }

      function nextLevel() {
        level++;
        bullets = [];
        resetShip();
        spawnAsteroids(3 + level);
        waveClearTimer = 0;
      }

      function fireBullet() {
        if (bullets.length >= MAX_BULLETS) return;
        const bx = ship.x + Math.cos(ship.angle) * (SHIP_RADIUS + 4);
        const by = ship.y + Math.sin(ship.angle) * (SHIP_RADIUS + 4);
        bullets.push({
          x: bx, y: by,
          vx: ship.vx + Math.cos(ship.angle) * BULLET_SPEED,
          vy: ship.vy + Math.sin(ship.angle) * BULLET_SPEED,
          life: BULLET_LIFE,
        });
      }

      function hyperspace() {
        if (ship.hyperspaceCd > 0 || ship.dead) return;
        ship.hyperspaceCd = HYPERSPACE_COOLDOWN;
        ship.x = rand(SHIP_RADIUS, W - SHIP_RADIUS);
        ship.y = rand(SHIP_RADIUS, H - SHIP_RADIUS);
        ship.vx = 0;
        ship.vy = 0;
        ship.invuln = INVULN_TIME;
        spawnParticles(ship.x, ship.y, 12, "#88ccff", 80);
        if (Math.random() < 0.08) {
          killShip();
        }
      }

      function killShip() {
        if (ship.dead) return;
        ship.dead = true;
        spawnParticles(ship.x, ship.y, 30, "#fff", 180);
        spawnParticles(ship.x, ship.y, 20, "#ff6600", 140);
        lives--;
        bullets = [];
        if (lives <= 0) {
          state = "over";
        } else {
          setTimeout(() => {
            if (state === "playing") resetShip();
          }, 1200);
        }
      }

      function splitAsteroid(ast) {
        const idx = ast.sizeIndex;
        score += ASTEROID_SIZES[idx].points;
        spawnParticles(ast.x, ast.y, 14, "#aaa", 100);
        if (idx < ASTEROID_SIZES.length - 1) {
          for (let i = 0; i < 2; i++) {
            const dir = rand(0, TAU);
            const spd = ASTEROID_SIZES[idx + 1].speed * rand(0.8, 1.3);
            asteroids.push(makeAsteroid(
              ast.x, ast.y, idx + 1,
              Math.cos(dir) * spd,
              Math.sin(dir) * spd
            ));
          }
        }
      }

      function pointInPolygon(px, py, verts, cx, cy, angle) {
        let inside = false;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const pts = verts.map(v => {
          const lx = Math.cos(v.angle) * v.dist;
          const ly = Math.sin(v.angle) * v.dist;
          return { x: cx + lx * cos - ly * sin, y: cy + lx * sin + ly * cos };
        });
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const xi = pts[i].x, yi = pts[i].y;
          const xj = pts[j].x, yj = pts[j].y;
          if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
            inside = !inside;
          }
        }
        return inside;
      }

      function circleHit(ax, ay, ar, bx, by, br) {
        const d = dist(ax, ay, bx, by);
        return d < ar + br;
      }

      let shootHeld = false;
      let hyperspaceHeld = false;

      function update(dt) {
        if (state !== "playing") return;

        if (ship.dead) return;

        ship.invuln = Math.max(0, ship.invuln - dt);
        ship.hyperspaceCd = Math.max(0, ship.hyperspaceCd - dt);

        const left = keys["ArrowLeft"] || keys["KeyA"];
        const right = keys["ArrowRight"] || keys["KeyD"];
        const up = keys["ArrowUp"] || keys["KeyW"];
        const shoot = keys["Space"];
        const hyper = keys["ShiftLeft"] || keys["ShiftRight"];

        if (left) ship.angle -= SHIP_ROT_SPEED * dt;
        if (right) ship.angle += SHIP_ROT_SPEED * dt;

        ship.thrusting = up;
        if (up) {
          ship.vx += Math.cos(ship.angle) * SHIP_THRUST * dt;
          ship.vy += Math.sin(ship.angle) * SHIP_THRUST * dt;
        }

        ship.vx *= FRICTION;
        ship.vy *= FRICTION;
        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;
        wrap(ship);

        if (shoot && !shootHeld) fireBullet();
        shootHeld = shoot;

        if (hyper && !hyperspaceHeld) hyperspace();
        hyperspaceHeld = hyper;

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
          wrap(b);
          if (b.life <= 0) bullets.splice(i, 1);
        }

        for (let i = asteroids.length - 1; i >= 0; i--) {
          const a = asteroids[i];
          a.x += a.vx * dt;
          a.y += a.vy * dt;
          a.angle += a.rot * dt;
          wrap(a);

          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (circleHit(a.x, a.y, a.radius * 0.85, b.x, b.y, 2)) {
              bullets.splice(j, 1);
              splitAsteroid(a);
              asteroids.splice(i, 1);
              break;
            }
          }
        }

        if (ship.invuln <= 0) {
          for (const a of asteroids) {
            if (circleHit(ship.x, ship.y, SHIP_RADIUS * 0.7, a.x, a.y, a.radius * 0.8)) {
              killShip();
              break;
            }
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          p.vx *= 0.97;
          p.vy *= 0.97;
          if (p.life <= 0) particles.splice(i, 1);
        }

        if (asteroids.length === 0) {
          waveClearTimer += dt;
          if (waveClearTimer > 1.5) nextLevel();
        }
      }

      function drawStars() {
        for (const s of stars) {
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = "#fff";
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }
        ctx.globalAlpha = 1;
      }

      function drawShip() {
        if (ship.dead) return;
        if (ship.invuln > 0 && Math.floor(ship.invuln * 10) % 2 === 0) return;

        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);

        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(SHIP_RADIUS, 0);
        ctx.lineTo(-SHIP_RADIUS * 0.7, SHIP_RADIUS * 0.6);
        ctx.lineTo(-SHIP_RADIUS * 0.4, 0);
        ctx.lineTo(-SHIP_RADIUS * 0.7, -SHIP_RADIUS * 0.6);
        ctx.closePath();
        ctx.stroke();

        if (ship.thrusting) {
          ctx.strokeStyle = "#ff8844";
          ctx.beginPath();
          ctx.moveTo(-SHIP_RADIUS * 0.5, 0);
          ctx.lineTo(-SHIP_RADIUS * 1.3 - rand(0, 6), rand(-4, 4));
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawAsteroid(a) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.strokeStyle = "#bbb";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < a.verts.length; i++) {
          const v = a.verts[i];
          const px = Math.cos(v.angle) * v.dist;
          const py = Math.sin(v.angle) * v.dist;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      function drawBullets() {
        ctx.fillStyle = "#fff";
        for (const b of bullets) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2, 0, TAU);
          ctx.fill();
        }
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      function drawHUD() {
        ctx.fillStyle = "#fff";
        ctx.font = "18px 'Courier New', monospace";
        ctx.textAlign = "left";
        ctx.fillText("SCORE " + score, 16, 28);
        ctx.textAlign = "right";
        ctx.fillText("LIVES " + lives, W - 16, 28);
        ctx.textAlign = "center";
        ctx.fillText("LEVEL " + level, W / 2, 28);
      }

      function drawCenterText(lines, pulse) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff";
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (line.size) ctx.font = line.size + " 'Courier New', monospace";
          if (line.color) ctx.fillStyle = line.color;
          else ctx.fillStyle = "#fff";
          const alpha = pulse && i === lines.length - 1 ? (0.5 + 0.5 * Math.sin(Date.now() / 300)) : 1;
          ctx.globalAlpha = alpha;
          ctx.fillText(line.text, W / 2, H / 2 + (line.y || 0));
        }
        ctx.globalAlpha = 1;
      }

      function render() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        drawStars();

        if (state === "start") {
          drawCenterText([
            { text: "ASTEROIDS", size: "52px", y: -60 },
            { text: "ARROWS / WASD — MOVE", size: "16px", y: 20 },
            { text: "SPACE — SHOOT", size: "16px", y: 44 },
            { text: "SHIFT — HYPERSPACE", size: "16px", y: 68 },
            { text: "PRESS SPACE TO START", size: "20px", y: 120, color: "#ffcc00" },
          ], true);
          return;
        }

        for (const a of asteroids) drawAsteroid(a);
        drawBullets();
        drawParticles();
        drawShip();
        drawHUD();

        if (asteroids.length === 0 && waveClearTimer > 0) {
          drawCenterText([
            { text: "WAVE CLEAR", size: "28px", y: 0 },
            { text: "LEVEL " + (level + 1), size: "18px", y: 36 },
          ], false);
        }

        if (state === "over") {
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(0, 0, W, H);
          drawCenterText([
            { text: "GAME OVER", size: "48px", y: -40 },
            { text: "FINAL SCORE: " + score, size: "22px", y: 10 },
            { text: "PRESS SPACE TO RESTART", size: "18px", y: 60, color: "#ffcc00" },
          ], true);
        }
      }

      let lastTime = performance.now();

      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      initStars();
      resetShip();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
