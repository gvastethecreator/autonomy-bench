<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Field Experiment</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0f;
    cursor: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; }

  #hud {
    position: fixed;
    top: 24px; left: 24px;
    color: rgba(255,255,255,0.85);
    pointer-events: none;
    z-index: 10;
  }
  #hud h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 12px;
  }
  #mode-label {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    transition: color 0.4s;
  }
  #mode-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    max-width: 260px;
    line-height: 1.5;
  }
  #stats {
    margin-top: 20px;
    font-size: 11px;
    font-family: 'Consolas', monospace;
    color: rgba(255,255,255,0.25);
    line-height: 1.8;
  }

  #modes {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
    pointer-events: all;
  }
  .mode-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: none;
    transition: all 0.25s;
    backdrop-filter: blur(8px);
  }
  .mode-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
  .mode-btn.active {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  #hint {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.08em;
    pointer-events: none;
    animation: fadeHint 4s ease forwards;
  }
  @keyframes fadeHint {
    0%, 60% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1>Cursor Field Experiment</h1>
  <div id="mode-label">Attract</div>
  <div id="mode-desc">Particles drift toward your cursor like iron filings near a magnet.</div>
  <div id="stats">
    <div>particles: <span id="s-count">0</span></div>
    <div>fps: <span id="s-fps">60</span></div>
    <div>cursor: <span id="s-pos">—</span></div>
  </div>
</div>

<div id="hint">click to pulse · scroll to change intensity · 1–4 to switch modes</div>

<div id="modes">
  <button class="mode-btn active" data-mode="0">Attract</button>
  <button class="mode-btn" data-mode="1">Repel</button>
  <button class="mode-btn" data-mode="2">Orbit</button>
  <button class="mode-btn" data-mode="3">Trail</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const modeLabel = document.getElementById('mode-label');
  const modeDesc = document.getElementById('mode-desc');
  const sCount = document.getElementById('s-count');
  const sFps = document.getElementById('s-fps');
  const sPos = document.getElementById('s-pos');
  const modeBtns = document.querySelectorAll('.mode-btn');

  const MODES = [
    { name: 'Attract', desc: 'Particles drift toward your cursor like iron filings near a magnet.', color: '#6ee7ff' },
    { name: 'Repel', desc: 'Your cursor pushes particles away, carving tunnels through the field.', color: '#ff6eb4' },
    { name: 'Orbit', desc: 'Particles spiral around your cursor in elliptical paths.', color: '#a78bfa' },
    { name: 'Trail', desc: 'Your cursor leaves a glowing wake; particles follow the path you draw.', color: '#fbbf24' }
  ];

  let W, H, dpr;
  let mouse = { x: -9999, y: -9999, px: -9999, py: -9999, down: false };
  let mode = 0;
  let intensity = 1;
  let particles = [];
  let ripples = [];
  let trail = [];
  const TRAIL_MAX = 80;
  const PARTICLE_COUNT = 420;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
  }

  function initParticles() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: Math.random() * 2 + 0.8,
        alpha: Math.random() * 0.5 + 0.3,
        phase: Math.random() * Math.PI * 2,
        orbitR: Math.random() * 60 + 30
      });
    }
    sCount.textContent = PARTICLE_COUNT;
  }

  function setMode(m) {
    mode = m;
    const info = MODES[m];
    modeLabel.textContent = info.name;
    modeLabel.style.color = info.color;
    modeDesc.textContent = info.desc;
    modeBtns.forEach((btn, i) => btn.classList.toggle('active', i === m));
    trail = [];
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => setMode(+btn.dataset.mode));
  });

  window.addEventListener('mousemove', e => {
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (mode === 3) {
      trail.push({ x: mouse.x, y: mouse.y, life: 1 });
      if (trail.length > TRAIL_MAX) trail.shift();
    }
  });

  window.addEventListener('mousedown', () => {
    mouse.down = true;
    ripples.push({ x: mouse.x, y: mouse.y, r: 0, maxR: 180, life: 1 });
  });
  window.addEventListener('mouseup', () => mouse.down = false);

  window.addEventListener('wheel', e => {
    intensity = Math.max(0.2, Math.min(3, intensity - e.deltaY * 0.002));
  }, { passive: true });

  window.addEventListener('keydown', e => {
    const n = +e.key;
    if (n >= 1 && n <= 4) setMode(n - 1);
  });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    if (mode === 3) {
      trail.push({ x: mouse.x, y: mouse.y, life: 1 });
      if (trail.length > TRAIL_MAX) trail.shift();
    }
  }, { passive: false });

  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    ripples.push({ x: mouse.x, y: mouse.y, r: 0, maxR: 180, life: 1 });
  });

  function updateParticle(p, dt) {
    const dx = mouse.x - p.x;
    const dy = mouse.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = intensity * 120 / (dist + 40);

    switch (mode) {
      case 0: // attract
        p.vx += (dx / dist) * force * dt;
        p.vy += (dy / dist) * force * dt;
        break;
      case 1: // repel
        p.vx -= (dx / dist) * force * dt * 1.4;
        p.vy -= (dy / dist) * force * dt * 1.4;
        break;
      case 2: { // orbit
        const angle = Math.atan2(dy, dx);
        const tangent = angle + Math.PI / 2;
        const pull = force * 0.6;
        const spin = force * 1.8;
        p.vx += Math.cos(tangent) * spin * dt + (dx / dist) * pull * dt * 0.3;
        p.vy += Math.sin(tangent) * spin * dt + (dy / dist) * pull * dt * 0.3;
        break;
      }
      case 3: { // trail follow
        if (trail.length > 2) {
          let best = trail[0], bestD = Infinity;
          for (const pt of trail) {
            const d = (pt.x - p.x) ** 2 + (pt.y - p.y) ** 2;
            if (d < bestD) { bestD = d; best = pt; }
          }
          const tdx = best.x - p.x;
          const tdy = best.y - p.y;
          const td = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
          p.vx += (tdx / td) * force * dt * 0.8;
          p.vy += (tdy / td) * force * dt * 0.8;
        }
        break;
      }
    }

    // ripple disturbance
    for (const rip of ripples) {
      const rdx = p.x - rip.x;
      const rdy = p.y - rip.y;
      const rd = Math.sqrt(rdx * rdx + rdy * rdy);
      const ring = Math.abs(rd - rip.r);
      if (ring < 20 && rip.life > 0.2) {
        const push = (20 - ring) * 0.04 * rip.life;
        p.vx += (rdx / (rd || 1)) * push;
        p.vy += (rdy / (rd || 1)) * push;
      }
    }

    // gentle drift + damping
    p.vx += Math.sin(p.phase + performance.now() * 0.001) * 0.02;
    p.vy += Math.cos(p.phase + performance.now() * 0.0013) * 0.02;
    p.vx *= 0.96;
    p.vy *= 0.96;

    p.x += p.vx;
    p.y += p.vy;

    // wrap edges
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#12121f');
    g.addColorStop(0.5, '#0c0c16');
    g.addColorStop(1, '#06060b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    const step = 48;
    for (let x = 0; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawRipples(color) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rip = ripples[i];
      rip.r += 3.5;
      rip.life -= 0.018;
      if (rip.life <= 0) { ripples.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
      ctx.strokeStyle = color.replace(')', `, ${rip.life * 0.35})`).replace('rgb', 'rgba').replace('#', '');
      ctx.globalAlpha = rip.life * 0.5;
      ctx.strokeStyle = hexToRgba(color, rip.life * 0.4);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function hexToRgba(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawParticles(color) {
    const rgb = hexToRgb(color);
    for (const p of particles) {
      const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      const glow = Math.min(speed * 0.3, 0.6);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + glow, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${p.alpha})`;
      ctx.fill();
    }

    // connection lines for nearby particles
    ctx.lineWidth = 0.4;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (d < 3600) {
          const alpha = (1 - d / 3600) * 0.12;
          ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  function hexToRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    };
  }

  function drawTrail(color) {
    if (trail.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) {
      const t = trail[i];
      t.life *= 0.985;
      const prev = trail[i - 1];
      const alpha = (i / trail.length) * t.life * 0.7;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(t.x, t.y);
      ctx.strokeStyle = hexToRgba(color, alpha);
      ctx.lineWidth = (i / trail.length) * 4 + 0.5;
      ctx.stroke();
    }
    trail = trail.filter(t => t.life > 0.05);
  }

  function drawCursor(color) {
    if (mouse.x < 0) return;
    const rgb = hexToRgb(color);

    // outer ring
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 18 + Math.sin(performance.now() * 0.004) * 3, 0, Math.PI * 2);
    ctx.strokeStyle = hexToRgba(color, 0.35);
    ctx.lineWidth = 1;
    ctx.stroke();

    // crosshair
    ctx.strokeStyle = hexToRgba(color, 0.6);
    ctx.lineWidth = 1.2;
    const s = 8;
    ctx.beginPath();
    ctx.moveTo(mouse.x - s, mouse.y); ctx.lineTo(mouse.x + s, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - s); ctx.lineTo(mouse.x, mouse.y + s);
    ctx.stroke();

    // center dot
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.9)`;
    ctx.fill();

    // velocity streak
    const vx = mouse.x - mouse.px;
    const vy = mouse.y - mouse.py;
    const speed = Math.sqrt(vx * vx + vy * vy);
    if (speed > 2) {
      ctx.beginPath();
      ctx.moveTo(mouse.x, mouse.y);
      ctx.lineTo(mouse.x - vx * 2, mouse.y - vy * 2);
      ctx.strokeStyle = hexToRgba(color, Math.min(speed * 0.03, 0.5));
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  let lastTime = performance.now();
  let frameCount = 0;
  let fpsTime = lastTime;

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    frameCount++;
    if (now - fpsTime > 500) {
      sFps.textContent = Math.round(frameCount / ((now - fpsTime) / 1000));
      frameCount = 0;
      fpsTime = now;
    }
    if (mouse.x >= 0) {
      sPos.textContent = `${Math.round(mouse.x)}, ${Math.round(mouse.y)}`;
    }

    const color = MODES[mode].color;

    drawBackground();

    for (const p of particles) updateParticle(p, dt);

    drawParticles(color);
    drawTrail(color);
    drawRipples(color);
    drawCursor(color);

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  setMode(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
