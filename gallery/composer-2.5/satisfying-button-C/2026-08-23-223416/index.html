<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satisfying Button</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0612;
    --bg-mid: #12081f;
    --accent: #ff6b9d;
    --accent-glow: #ff9ec4;
    --accent-hot: #ff4081;
    --gold: #ffd166;
    --cyan: #4ecdc4;
    --purple: #a855f7;
    --text: rgba(255, 255, 255, 0.85);
    --text-dim: rgba(255, 255, 255, 0.45);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Ambient background */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 120%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(255, 107, 157, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 80% 30%, rgba(78, 205, 196, 0.06) 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #0d0618 100%);
  }

  .bg-noise {
    position: absolute;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  .bg-orbs {
    position: absolute;
    inset: 0;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: orb-drift 12s ease-in-out infinite;
  }

  .orb-1 {
    width: 300px; height: 300px;
    background: rgba(255, 107, 157, 0.12);
    top: 10%; left: 15%;
    animation-delay: 0s;
  }

  .orb-2 {
    width: 250px; height: 250px;
    background: rgba(168, 85, 247, 0.1);
    bottom: 15%; right: 10%;
    animation-delay: -4s;
  }

  .orb-3 {
    width: 180px; height: 180px;
    background: rgba(78, 205, 196, 0.08);
    top: 50%; left: 60%;
    animation-delay: -8s;
  }

  @keyframes orb-drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 15px) scale(0.95); }
  }

  #particle-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* UI layer */
  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }

  .header {
    text-align: center;
    animation: fade-down 1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .header h1 {
    font-size: clamp(0.75rem, 2.5vw, 0.85rem);
    font-weight: 500;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }

  .score-display {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(135deg, #fff 0%, var(--accent-glow) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .score-display.bump {
    transform: scale(1.12);
  }

  .combo-label {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s, transform 0.3s;
    margin-top: 0.4rem;
    height: 1.2em;
  }

  .combo-label.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Button container */
  .button-zone {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fade-up 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
  }

  .ring-track {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
  }

  .ring-track svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.06);
    stroke-width: 3;
  }

  .ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 628;
    stroke-dashoffset: 628;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.5));
  }

  .pulse-ring {
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 1px solid rgba(255, 107, 157, 0.15);
    animation: pulse-expand 3s ease-out infinite;
    pointer-events: none;
  }

  .pulse-ring:nth-child(2) { animation-delay: 1s; }
  .pulse-ring:nth-child(3) { animation-delay: 2s; }

  @keyframes pulse-expand {
    0% { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* The button */
  .satisfy-btn {
    position: relative;
    width: 160px;
    height: 160px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    outline: none;
    background: transparent;
    -webkit-appearance: none;
    touch-action: manipulation;
  }

  .btn-face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, #ff8fb3 0%, var(--accent) 40%, #c2185b 100%);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.1) inset,
      0 8px 32px rgba(255, 64, 129, 0.35),
      0 2px 8px rgba(0, 0, 0, 0.3),
      0 20px 60px rgba(255, 107, 157, 0.2);
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.15s ease;
    will-change: transform;
  }

  .btn-face::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.15) 0%, transparent 60%);
    pointer-events: none;
  }

  .btn-face::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, rgba(255, 209, 102, 0.3), transparent, rgba(78, 205, 196, 0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    animation: spin 8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .satisfy-btn:hover .btn-face {
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.15) inset,
      0 12px 40px rgba(255, 64, 129, 0.45),
      0 4px 12px rgba(0, 0, 0, 0.3),
      0 24px 70px rgba(255, 107, 157, 0.3);
  }

  .satisfy-btn:hover .btn-face::after { opacity: 0.6; }

  .satisfy-btn:active .btn-face,
  .satisfy-btn.pressed .btn-face {
    transform: scale(0.88) translateY(4px);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 2px 8px rgba(255, 64, 129, 0.3),
      0 1px 4px rgba(0, 0, 0, 0.4);
    transition: transform 0.08s cubic-bezier(0.4, 0, 1, 1),
                box-shadow 0.08s ease;
  }

  .satisfy-btn.released .btn-face {
    animation: spring-back 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes spring-back {
    0% { transform: scale(0.88) translateY(4px); }
    50% { transform: scale(1.06) translateY(-2px); }
    75% { transform: scale(0.98) translateY(0); }
    100% { transform: scale(1) translateY(0); }
  }

  .btn-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 1;
  }

  .btn-icon svg {
    width: 48px;
    height: 48px;
    fill: rgba(255, 255, 255, 0.9);
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .satisfy-btn:active .btn-icon svg,
  .satisfy-btn.pressed .btn-icon svg {
    transform: scale(0.85);
  }

  .satisfy-btn.released .btn-icon svg {
    animation: icon-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes icon-pop {
    0% { transform: scale(0.85); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* Ripple on button surface */
  .btn-ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    transform: scale(0);
    pointer-events: none;
    z-index: 2;
  }

  .btn-ripple.animate {
    animation: ripple-out 0.6s ease-out forwards;
  }

  @keyframes ripple-out {
    to { transform: scale(4); opacity: 0; }
  }

  /* Footer hint */
  .hint {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    animation: fade-up 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    opacity: 0.6;
  }

  /* Floating +N labels */
  .float-label {
    position: fixed;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--gold);
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 20px rgba(255, 209, 102, 0.6);
    animation: float-up 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
  }

  @keyframes fade-down {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Screen flash */
  .flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255, 107, 157, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.1s;
  }

  .flash.active {
    opacity: 1;
    transition: opacity 0.05s;
  }

  /* Milestone celebration */
  .milestone-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    font-weight: 300;
    letter-spacing: 0.1em;
    color: #fff;
    text-shadow: 0 0 40px rgba(255, 107, 157, 0.8);
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    white-space: nowrap;
  }

  .milestone-banner.show {
    animation: milestone-pop 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes milestone-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    40% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
</div>

<canvas id="particle-canvas"></canvas>
<div class="flash" id="flash"></div>
<div class="milestone-banner" id="milestone"></div>

<div class="stage">
  <div class="header">
    <h1>Satisfying Button</h1>
    <div class="score-display" id="score">0</div>
    <div class="combo-label" id="combo"></div>
  </div>

  <div class="button-zone">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>

    <div class="ring-track">
      <svg viewBox="0 0 220 220">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6b9d"/>
            <stop offset="50%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#4ecdc4"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="110" cy="110" r="100"/>
        <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="100"/>
      </svg>
    </div>

    <button class="satisfy-btn" id="btn" aria-label="Press the satisfying button">
      <div class="btn-face"></div>
      <div class="btn-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </div>
    </button>
  </div>

  <p class="hint">Press &amp; hold for extra satisfaction</p>
</div>

<script>
(function() {
  'use strict';

  const btn = document.getElementById('btn');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const ringFill = document.getElementById('ringFill');
  const flash = document.getElementById('flash');
  const milestone = document.getElementById('milestone');
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  let score = 0;
  let combo = 0;
  let lastClickTime = 0;
  let holdStart = 0;
  let holdInterval = null;
  let particles = [];
  let audioCtx = null;

  const CIRCUMFERENCE = 2 * Math.PI * 100;
  const MILESTONES = [10, 25, 50, 100, 250, 500, 1000];
  const COLORS = ['#ff6b9d', '#ffd166', '#4ecdc4', '#a855f7', '#ff4081', '#fff'];

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume || 0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playClickSound(intensity) {
    initAudio();
    const base = 220 + Math.min(combo, 20) * 20;
    playTone(base, 0.12, 'sine', 0.06 + intensity * 0.04);
    setTimeout(() => playTone(base * 1.5, 0.08, 'triangle', 0.03), 30);
  }

  function playMilestoneSound() {
    initAudio();
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.3, 'sine', 0.07), i * 80);
    });
  }

  function updateRing() {
    const progress = (score % 100) / 100;
    ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
  }

  function updateCombo() {
    const now = Date.now();
    if (now - lastClickTime < 600) {
      combo++;
    } else {
      combo = 1;
    }
    lastClickTime = now;

    if (combo >= 3) {
      comboEl.textContent = combo + 'x combo';
      comboEl.classList.add('visible');
    } else {
      comboEl.classList.remove('visible');
    }
  }

  function bumpScore() {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 300);
  }

  function showFloatLabel(x, y, text) {
    const el = document.createElement('div');
    el.className = 'float-label';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function checkMilestone() {
    if (MILESTONES.includes(score)) {
      milestone.textContent = score + '!';
      milestone.classList.remove('show');
      void milestone.offsetWidth;
      milestone.classList.add('show');
      playMilestoneSound();
      burstParticles(window.innerWidth / 2, window.innerHeight / 2, 60, 1.5);
    }
  }

  function createRipple(e) {
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('div');
    ripple.className = 'btn-ripple';
    const size = 40;
    ripple.style.width = ripple.style.height = size + 'px';
    const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
    const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    btn.appendChild(ripple);
    requestAnimationFrame(() => ripple.classList.add('animate'));
    setTimeout(() => ripple.remove(), 600);
  }

  function burstParticles(x, y, count, speedMult) {
    speedMult = speedMult || 1;
    const n = count || (15 + Math.min(combo, 10) * 3);
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const speed = (3 + Math.random() * 6) * speedMult;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        size: 3 + Math.random() * 5,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        gravity: 0.12,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.2,
        shape: Math.random() > 0.5 ? 'circle' : 'rect'
      });
    }
  }

  function spawnAmbientParticles() {
    if (Math.random() > 0.92) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + 10,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -0.5 - Math.random() * 1,
        life: 1,
        decay: 0.003,
        size: 1 + Math.random() * 2,
        color: 'rgba(255, 107, 157, 0.4)',
        gravity: 0,
        rotation: 0,
        rotSpeed: 0,
        shape: 'circle',
        ambient: true
      });
    }
  }

  function updateParticles() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles = particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.life -= p.decay;
      p.rotation += p.rotSpeed;

      if (p.life <= 0) return false;

      ctx.save();
      ctx.globalAlpha = p.life * (p.ambient ? 0.5 : 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;

      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size * p.life, p.size * p.life * 0.6);
      }
      ctx.restore();
      return true;
    });
    spawnAmbientParticles();
    requestAnimationFrame(updateParticles);
  }
  updateParticles();

  function press(e) {
    initAudio();
    btn.classList.add('pressed');
    btn.classList.remove('released');
    holdStart = Date.now();

    if (holdInterval) clearInterval(holdInterval);
    holdInterval = setInterval(() => {
      if (Date.now() - holdStart > 400) {
        doClick(e, 0.5, true);
      }
    }, 150);
  }

  function release(e) {
    btn.classList.remove('pressed');
    btn.classList.add('released');
    if (holdInterval) {
      clearInterval(holdInterval);
      holdInterval = null;
    }
    setTimeout(() => btn.classList.remove('released'), 500);
  }

  function doClick(e, intensity, isHold) {
    intensity = intensity || 1;
    const increment = isHold ? 1 : (combo >= 5 ? 2 : 1);
    score += increment;
    scoreEl.textContent = score;
    updateRing();
    updateCombo();
    bumpScore();

    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    createRipple(e || { clientX: cx, clientY: cy });
    burstParticles(cx, cy, undefined, intensity);

    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 80);

    playClickSound(intensity);

    const label = combo >= 3 ? '+' + increment + ' (' + combo + 'x)' : '+' + increment;
    showFloatLabel(
      (e && e.clientX ? e.clientX : cx) + (Math.random() - 0.5) * 40,
      (e && e.clientY ? e.clientY : cy) - 30,
      label
    );

    checkMilestone();
  }

  btn.addEventListener('mousedown', (e) => { e.preventDefault(); press(e); });
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', () => {
    if (btn.classList.contains('pressed')) release();
  });

  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    press(e.touches[0]);
  }, { passive: false });
  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    release(e);
  });

  btn.addEventListener('click', (e) => {
    if (!holdInterval || Date.now() - holdStart < 400) {
      doClick(e, 1, false);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      press(e);
      doClick({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 }, 1, false);
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') release(e);
  });
})();
</script>
</body>
</html>
