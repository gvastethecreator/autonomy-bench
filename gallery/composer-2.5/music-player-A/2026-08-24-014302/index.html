<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music City — Desktop Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #0a0a0f;
      --bg-panel: #12121a;
      --bg-elevated: #1a1a26;
      --bg-hover: #222233;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.35);
      --accent-soft: rgba(124, 92, 255, 0.15);
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --border: rgba(255,255,255,0.06);
      --radius: 12px;
      --radius-lg: 20px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr auto;
      height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(124,92,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(255,100,150,0.05) 0%, transparent 50%),
        var(--bg-deep);
    }

    /* Sidebar */
    .sidebar {
      grid-row: 1 / 3;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #ff6b9d);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .add-btn {
      margin: 16px 20px;
      padding: 10px 16px;
      background: var(--accent-soft);
      border: 1px dashed rgba(124,92,255,0.4);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .add-btn:hover {
      background: rgba(124,92,255,0.25);
      border-color: var(--accent);
    }

    .playlist-label {
      padding: 8px 20px 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .playlist {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--bg-hover) transparent;
    }

    .playlist::-webkit-scrollbar { width: 4px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
    }

    .track-item:hover { background: var(--bg-hover); }
    .track-item.active { background: var(--accent-soft); }
    .track-item.active .track-num { color: var(--accent); }

    .track-num {
      width: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .track-info { flex: 1; min-width: 0; }

    .track-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-duration {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state svg { margin-bottom: 12px; opacity: 0.4; }

    /* Main area */
    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .visualizer-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      padding-bottom: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    .viz-bar {
      width: 4px;
      background: linear-gradient(to top, var(--accent), #ff6b9d);
      border-radius: 2px 2px 0 0;
      transition: height 0.08s ease;
      min-height: 4px;
    }

    .now-playing {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 420px;
      width: 100%;
    }

    .album-art {
      width: 280px;
      height: 280px;
      border-radius: var(--radius-lg);
      background: var(--bg-elevated);
      box-shadow: var(--shadow), 0 0 60px var(--accent-glow);
      overflow: hidden;
      position: relative;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .album-art.playing {
      transform: scale(1.02);
      box-shadow: var(--shadow), 0 0 80px var(--accent-glow);
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-art-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-elevated), var(--bg-hover));
    }

    .album-art-placeholder svg { opacity: 0.3; }

    .vinyl-ring {
      position: absolute;
      inset: 20%;
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .song-meta {
      text-align: center;
      width: 100%;
    }

    .song-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Progress */
    .progress-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-hover);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar:hover { height: 6px; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff6b9d);
      border-radius: 2px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform var(--transition);
    }

    .progress-bar:hover .progress-fill::after { transform: translateY(-50%) scale(1); }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .ctrl-btn.active { color: var(--accent); }
    .ctrl-btn:disabled { opacity: 0.3; cursor: default; }
    .ctrl-btn:disabled:hover { background: none; color: var(--text-secondary); }

    .play-btn {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #9b7dff);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: var(--transition);
    }

    .play-btn:hover { transform: scale(1.06); box-shadow: 0 6px 28px var(--accent-glow); }
    .play-btn:active { transform: scale(0.96); }
    .play-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    /* Bottom bar */
    .bottom-bar {
      grid-column: 2;
      padding: 12px 24px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mini-art {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--bg-elevated);
      overflow: hidden;
      flex-shrink: 0;
    }

    .mini-art img { width: 100%; height: 100%; object-fit: cover; }

    .mini-info { flex: 1; min-width: 0; }
    .mini-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 11px; color: var(--text-secondary); }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .volume-slider {
      width: 100px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-hover);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--text-primary);
      border-radius: 50%;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--text-primary);
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    #file-input { display: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .playing-indicator {
      animation: pulse 1.5s ease infinite;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">♪</div>
          Music City
        </div>
      </div>
      <button class="add-btn" id="add-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Add Music Files
      </button>
      <div class="playlist-label">Queue</div>
      <div class="playlist" id="playlist">
        <div class="empty-state" id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
          <p>No tracks yet.<br>Click "Add Music Files" to get started.</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="visualizer-bg" id="visualizer"></div>
      <div class="now-playing">
        <div class="album-art" id="album-art">
          <div class="album-art-placeholder">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
          <div class="vinyl-ring"></div>
        </div>
        <div class="song-meta">
          <div class="song-title" id="song-title">No track selected</div>
          <div class="song-artist" id="song-artist">Add music to begin</div>
        </div>
        <div class="progress-section">
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="time-labels">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="ctrl-btn" id="prev-btn" title="Previous" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="play-btn" id="play-btn" disabled title="Play">
            <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
            <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="next-btn" title="Next" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6l8.5 6V6l-8.5 6zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button class="ctrl-btn" id="repeat-btn" title="Repeat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          </button>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <div class="mini-art" id="mini-art"></div>
      <div class="mini-info">
        <div class="mini-title" id="mini-title">—</div>
        <div class="mini-artist" id="mini-artist">—</div>
      </div>
      <div class="volume-group">
        <button class="ctrl-btn" id="mute-btn" title="Mute">
          <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
      </div>
    </footer>
  </div>

  <input type="file" id="file-input" accept="audio/*" multiple>

  <script>
    (function () {
      const audio = new Audio();
      audio.volume = 0.8;

      let tracks = [];
      let currentIndex = -1;
      let shuffle = false;
      let repeat = false;
      let isPlaying = false;
      let audioCtx, analyser, sourceNode, animFrame;
      let vizBars = [];

      const $ = id => document.getElementById(id);

      const els = {
        fileInput: $('file-input'),
        addBtn: $('add-btn'),
        playlist: $('playlist'),
        emptyState: $('empty-state'),
        albumArt: $('album-art'),
        songTitle: $('song-title'),
        songArtist: $('song-artist'),
        progressBar: $('progress-bar'),
        progressFill: $('progress-fill'),
        timeCurrent: $('time-current'),
        timeTotal: $('time-total'),
        playBtn: $('play-btn'),
        playIcon: $('play-icon'),
        pauseIcon: $('pause-icon'),
        prevBtn: $('prev-btn'),
        nextBtn: $('next-btn'),
        shuffleBtn: $('shuffle-btn'),
        repeatBtn: $('repeat-btn'),
        volumeSlider: $('volume-slider'),
        muteBtn: $('mute-btn'),
        miniArt: $('mini-art'),
        miniTitle: $('mini-title'),
        miniArtist: $('mini-artist'),
        visualizer: $('visualizer'),
      };

      function formatTime(s) {
        if (!s || !isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + String(sec).padStart(2, '0');
      }

      function parseFilename(name) {
        const base = name.replace(/\.[^.]+$/, '');
        const parts = base.split(' - ');
        if (parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
        return { artist: 'Unknown Artist', title: base };
      }

      function initVisualizer() {
        for (let i = 0; i < 48; i++) {
          const bar = document.createElement('div');
          bar.className = 'viz-bar';
          bar.style.height = '4px';
          els.visualizer.appendChild(bar);
          vizBars.push(bar);
        }
      }

      function setupAudioContext() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      }

      function animateVisualizer() {
        if (!analyser || !isPlaying) {
          vizBars.forEach(b => b.style.height = '4px');
          return;
        }
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        const step = Math.floor(data.length / vizBars.length);
        vizBars.forEach((bar, i) => {
          const val = data[i * step] || 0;
          bar.style.height = Math.max(4, (val / 255) * 120) + 'px';
        });
        animFrame = requestAnimationFrame(animateVisualizer);
      }

      function renderPlaylist() {
        if (tracks.length === 0) {
          els.emptyState.style.display = '';
          els.playlist.querySelectorAll('.track-item').forEach(el => el.remove());
          return;
        }
        els.emptyState.style.display = 'none';
        els.playlist.querySelectorAll('.track-item').forEach(el => el.remove());

        tracks.forEach((track, i) => {
          const item = document.createElement('div');
          item.className = 'track-item' + (i === currentIndex ? ' active' : '');
          item.innerHTML =
            '<span class="track-num">' + (i === currentIndex && isPlaying ? '♪' : (i + 1)) + '</span>' +
            '<div class="track-info"><div class="track-title">' + esc(track.title) + '</div>' +
            '<div class="track-artist">' + esc(track.artist) + '</div></div>' +
            '<span class="track-duration">' + formatTime(track.duration) + '</span>';
          item.addEventListener('click', () => playTrack(i));
          els.playlist.appendChild(item);
        });
      }

      function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function updateUI() {
        const track = tracks[currentIndex];
        const hasTracks = tracks.length > 0;

        els.playBtn.disabled = !hasTracks;
        els.prevBtn.disabled = !hasTracks;
        els.nextBtn.disabled = !hasTracks;

        if (!track) {
          els.songTitle.textContent = 'No track selected';
          els.songArtist.textContent = 'Add music to begin';
          els.miniTitle.textContent = '—';
          els.miniArtist.textContent = '—';
          els.albumArt.classList.remove('playing');
          return;
        }

        els.songTitle.textContent = track.title;
        els.songArtist.textContent = track.artist;
        els.miniTitle.textContent = track.title;
        els.miniArtist.textContent = track.artist;
        els.timeTotal.textContent = formatTime(track.duration);

        if (track.artUrl) {
          els.albumArt.innerHTML = '<img src="' + track.artUrl + '" alt="Album art"><div class="vinyl-ring"></div>';
          els.miniArt.innerHTML = '<img src="' + track.artUrl + '" alt="">';
        } else {
          els.albumArt.innerHTML =
            '<div class="album-art-placeholder"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="vinyl-ring"></div>';
          els.miniArt.innerHTML = '';
        }

        els.albumArt.classList.toggle('playing', isPlaying);
        els.playIcon.style.display = isPlaying ? 'none' : '';
        els.pauseIcon.style.display = isPlaying ? '' : 'none';
        renderPlaylist();
      }

      function playTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentIndex = index;
        const track = tracks[index];
        audio.src = track.url;
        setupAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().then(() => {
          isPlaying = true;
          updateUI();
          cancelAnimationFrame(animFrame);
          animateVisualizer();
        }).catch(() => {});
      }

      function togglePlay() {
        if (tracks.length === 0) return;
        if (currentIndex === -1) { playTrack(0); return; }
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          cancelAnimationFrame(animFrame);
          animateVisualizer();
        } else {
          setupAudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          audio.play();
          isPlaying = true;
          animateVisualizer();
        }
        updateUI();
      }

      function nextTrack() {
        if (tracks.length === 0) return;
        let next;
        if (shuffle) {
          next = currentIndex;
          while (next === currentIndex && tracks.length > 1) next = Math.floor(Math.random() * tracks.length);
        } else {
          next = (currentIndex + 1) % tracks.length;
        }
        playTrack(next);
      }

      function prevTrack() {
        if (tracks.length === 0) return;
        if (audio.currentTime > 3) { audio.currentTime = 0; return; }
        const prev = (currentIndex - 1 + tracks.length) % tracks.length;
        playTrack(prev);
      }

      async function extractArt(file) {
        try {
          const buffer = await file.arrayBuffer();
          const view = new DataView(buffer);
          if (String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2)) !== 'ID3') return null;
          const ver = view.getUint8(3);
          let offset = ver === 3 || ver === 4 ? 10 : 10;
          const size = (view.getUint8(6) << 21) | (view.getUint8(7) << 14) | (view.getUint8(8) << 7) | view.getUint8(9);
          let pos = offset;
          while (pos < offset + size) {
            const frameId = String.fromCharCode(view.getUint8(pos), view.getUint8(pos+1), view.getUint8(pos+2), view.getUint8(pos+3));
            const frameSize = ver === 4
              ? (view.getUint8(pos+4) << 24 | view.getUint8(pos+5) << 16 | view.getUint8(pos+6) << 8 | view.getUint8(pos+7)) >>> 0
              : (view.getUint8(pos+4) << 16 | view.getUint8(pos+5) << 8 | view.getUint8(pos+6));
            if (frameId === 'APIC' || frameId === 'PIC ') {
              let imgStart = pos + 10;
              if (ver === 3) imgStart = pos + 10;
              else imgStart = pos + 10;
              const enc = view.getUint8(imgStart); imgStart++;
              while (view.getUint8(imgStart) !== 0) imgStart++;
              imgStart++;
              while (view.getUint8(imgStart) !== 0) imgStart++;
              imgStart++;
              const imgData = buffer.slice(imgStart, pos + 10 + frameSize);
              const blob = new Blob([imgData]);
              return URL.createObjectURL(blob);
            }
            pos += 10 + frameSize;
          }
        } catch (e) {}
        return null;
      }

      async function addFiles(fileList) {
        for (const file of fileList) {
          if (!file.type.startsWith('audio/')) continue;
          const meta = parseFilename(file.name);
          const url = URL.createObjectURL(file);
          const artUrl = await extractArt(file);
          const track = { ...meta, url, artUrl, duration: 0, file };
          tracks.push(track);

          const temp = new Audio(url);
          temp.addEventListener('loadedmetadata', () => {
            track.duration = temp.duration;
            renderPlaylist();
            if (currentIndex >= 0) els.timeTotal.textContent = formatTime(tracks[currentIndex].duration);
          });
        }
        renderPlaylist();
        updateUI();
        if (currentIndex === -1 && tracks.length > 0) playTrack(0);
      }

      els.addBtn.addEventListener('click', () => els.fileInput.click());
      els.fileInput.addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); e.target.value = ''; });
      els.playBtn.addEventListener('click', togglePlay);
      els.prevBtn.addEventListener('click', prevTrack);
      els.nextBtn.addEventListener('click', nextTrack);

      els.shuffleBtn.addEventListener('click', () => {
        shuffle = !shuffle;
        els.shuffleBtn.classList.toggle('active', shuffle);
      });

      els.repeatBtn.addEventListener('click', () => {
        repeat = !repeat;
        els.repeatBtn.classList.toggle('active', repeat);
      });

      els.progressBar.addEventListener('click', e => {
        if (!audio.duration) return;
        const rect = els.progressBar.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      });

      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        els.progressFill.style.width = pct + '%';
        els.timeCurrent.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('ended', () => {
        if (repeat && currentIndex >= 0) { playTrack(currentIndex); return; }
        if (currentIndex < tracks.length - 1 || shuffle) nextTrack();
        else { isPlaying = false; updateUI(); cancelAnimationFrame(animFrame); animateVisualizer(); }
      });

      els.volumeSlider.addEventListener('input', e => {
        audio.volume = e.target.value / 100;
        audio.muted = false;
      });

      els.muteBtn.addEventListener('click', () => {
        audio.muted = !audio.muted;
        els.muteBtn.style.opacity = audio.muted ? '0.5' : '1';
      });

      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.code) {
          case 'Space': e.preventDefault(); togglePlay(); break;
          case 'ArrowRight': if (e.shiftKey) nextTrack(); else audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); break;
          case 'ArrowLeft': if (e.shiftKey) prevTrack(); else audio.currentTime = Math.max(0, audio.currentTime - 5); break;
          case 'ArrowUp': els.volumeSlider.value = Math.min(100, +els.volumeSlider.value + 5); audio.volume = els.volumeSlider.value / 100; break;
          case 'ArrowDown': els.volumeSlider.value = Math.max(0, +els.volumeSlider.value - 5); audio.volume = els.volumeSlider.value / 100; break;
        }
      });

      document.body.addEventListener('dragover', e => { e.preventDefault(); });
      document.body.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
      });

      initVisualizer();
      updateUI();
    })();
  </script>
</body>
</html>
