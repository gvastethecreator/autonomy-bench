<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Music Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #0a0a0f;
      --bg-panel: #12121a;
      --bg-elevated: #1a1a26;
      --bg-hover: #252535;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.45);
      --accent-soft: rgba(124, 92, 255, 0.15);
      --text: #f0f0f5;
      --text-muted: #8888a0;
      --border: rgba(255, 255, 255, 0.06);
      --success: #4ade80;
      --radius: 12px;
      --radius-lg: 20px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--text);
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124, 92, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(255, 92, 180, 0.08) 0%, transparent 55%),
        var(--bg-deep);
    }

    .app {
      width: min(960px, 96vw);
      height: min(640px, 92vh);
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .titlebar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      -webkit-app-region: drag;
    }

    .titlebar-dots { display: flex; gap: 7px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green { background: #28c840; }
    .titlebar-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .main {
      display: grid;
      grid-template-columns: 280px 1fr;
      padding-top: 36px;
      min-height: 0;
    }

    .sidebar {
      background: rgba(0, 0, 0, 0.2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-header {
      padding: 20px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .btn-add {
      width: 28px; height: 28px;
      border: none;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-add:hover { background: rgba(124, 92, 255, 0.28); transform: scale(1.05); }

    .playlist {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--bg-hover) transparent;
    }

    .playlist::-webkit-scrollbar { width: 5px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }

    .track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .track-item:hover { background: var(--bg-hover); }
    .track-item.active { background: var(--accent-soft); }
    .track-item.active::before {
      content: "";
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 60%;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .track-num {
      width: 20px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
    }

    .track-item.active .track-num { color: var(--accent); }

    .track-info { flex: 1; min-width: 0; }
    .track-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-duration {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state svg { opacity: 0.35; margin-bottom: 12px; }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 32px;
      min-height: 0;
      position: relative;
    }

    .album-art-wrap {
      position: relative;
      width: min(240px, 40vw);
      height: min(240px, 40vw);
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .album-art {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-lg);
      object-fit: cover;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s ease;
    }

    .album-art.playing { animation: pulse-art 4s ease-in-out infinite; }

    @keyframes pulse-art {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .vinyl-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(124, 92, 255, 0.2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .album-art-wrap.playing .vinyl-ring {
      opacity: 1;
      animation: spin-ring 8s linear infinite;
    }

    @keyframes spin-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    canvas#visualizer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      width: 100%;
      opacity: 0.6;
      pointer-events: none;
    }

    .now-playing {
      text-align: center;
      max-width: 400px;
      z-index: 1;
    }

    .now-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-artist {
      font-size: 14px;
      color: var(--text-muted);
    }

    .controls-bar {
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      padding: 14px 24px 18px;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      width: 38px;
    }

    .time.end { text-align: right; }

    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--bg-hover);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 4px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      right: -6px; top: 50%;
      transform: translateY(-50%);
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-glow);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .progress-track:hover .progress-fill::after { opacity: 1; }

    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-ctrl {
      border: none;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s, transform 0.1s;
    }

    .btn-ctrl:hover { color: var(--text); background: var(--bg-hover); }
    .btn-ctrl:active { transform: scale(0.92); }
    .btn-ctrl.active { color: var(--accent); }

    .btn-ctrl.sm { width: 36px; height: 36px; }
    .btn-ctrl.md { width: 44px; height: 44px; }
    .btn-ctrl.lg {
      width: 52px; height: 52px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-ctrl.lg:hover {
      background: #8b6dff;
      color: #fff;
      transform: scale(1.06);
    }

    .extras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .volume-slider {
      width: 90px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-hover);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    #file-input { display: none; }

    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(124, 92, 255, 0.15);
      border: 3px dashed var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      backdrop-filter: blur(4px);
    }

    .drop-overlay.visible { display: flex; }

    @media (max-width: 640px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="drop-overlay" id="drop-overlay">Drop audio files here</div>

  <div class="app" id="app">
    <div class="titlebar">
      <div class="titlebar-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="titlebar-title">Desktop Music Player</div>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Library</h2>
          <button class="btn-add" id="btn-add" title="Add music">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="playlist" id="playlist">
          <div class="empty-state" id="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <p>No tracks yet.<br>Click + or drop audio files.</p>
          </div>
        </div>
      </aside>

      <section class="content">
        <canvas id="visualizer"></canvas>
        <div class="album-art-wrap" id="art-wrap">
          <div class="vinyl-ring"></div>
          <img class="album-art" id="album-art" src="" alt="Album art" hidden>
          <svg id="art-placeholder" width="240" height="240" viewBox="0 0 240 240" style="border-radius:20px">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#7c5cff"/>
                <stop offset="100%" style="stop-color:#ff5cb4"/>
              </linearGradient>
            </defs>
            <rect width="240" height="240" rx="20" fill="url(#grad)" opacity="0.3"/>
            <circle cx="120" cy="120" r="60" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
            <circle cx="120" cy="120" r="20" fill="rgba(255,255,255,0.1)"/>
            <path d="M90 80 Q120 60 150 80 L150 160 Q120 180 90 160 Z" fill="rgba(255,255,255,0.08)"/>
          </svg>
        </div>
        <div class="now-playing">
          <div class="now-title" id="now-title">No track selected</div>
          <div class="now-artist" id="now-artist">Add music to begin</div>
        </div>
      </section>
    </div>

    <footer class="controls-bar">
      <div class="progress-wrap">
        <span class="time" id="time-current">0:00</span>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="time end" id="time-total">0:00</span>
      </div>

      <div class="transport">
        <button class="btn-ctrl sm" id="btn-shuffle" title="Shuffle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
        <button class="btn-ctrl md" id="btn-prev" title="Previous">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="5" width="3" height="14" rx="1"/><path d="M18 5v14l-10-7z"/>
          </svg>
        </button>
        <button class="btn-ctrl lg" id="btn-play" title="Play">
          <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" hidden>
            <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>
        <button class="btn-ctrl md" id="btn-next" title="Next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="15" y="5" width="3" height="14" rx="1"/><path d="M6 5v14l10-7z"/>
          </svg>
        </button>
        <button class="btn-ctrl sm" id="btn-repeat" title="Repeat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
          </svg>
        </button>
      </div>

      <div class="extras">
        <div></div>
        <div class="volume-wrap">
          <button class="btn-ctrl sm" id="btn-mute" title="Mute">
            <svg id="icon-vol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/>
            </svg>
          </button>
          <input type="range" class="volume-slider" id="volume" min="0" max="100" value="80">
        </div>
      </div>
    </footer>
  </div>

  <input type="file" id="file-input" accept="audio/*" multiple>

  <audio id="audio" preload="metadata"></audio>

  <script>
    (function () {
      const audio = document.getElementById('audio');
      const playlistEl = document.getElementById('playlist');
      const emptyState = document.getElementById('empty-state');
      const fileInput = document.getElementById('file-input');
      const dropOverlay = document.getElementById('drop-overlay');

      const nowTitle = document.getElementById('now-title');
      const nowArtist = document.getElementById('now-artist');
      const albumArt = document.getElementById('album-art');
      const artPlaceholder = document.getElementById('art-placeholder');
      const artWrap = document.getElementById('art-wrap');

      const progressTrack = document.getElementById('progress-track');
      const progressFill = document.getElementById('progress-fill');
      const timeCurrent = document.getElementById('time-current');
      const timeTotal = document.getElementById('time-total');

      const btnPlay = document.getElementById('btn-play');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnShuffle = document.getElementById('btn-shuffle');
      const btnRepeat = document.getElementById('btn-repeat');
      const btnAdd = document.getElementById('btn-add');
      const btnMute = document.getElementById('btn-mute');
      const volumeSlider = document.getElementById('volume');

      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');

      let tracks = [];
      let currentIndex = -1;
      let shuffle = false;
      let repeat = 'off'; // off | all | one
      let shuffledOrder = [];
      let audioCtx = null;
      let analyser = null;
      let sourceNode = null;
      let animFrame = null;
      let prevVolume = 0.8;

      audio.volume = 0.8;

      function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + String(s).padStart(2, '0');
      }

      function parseFilename(name) {
        const base = name.replace(/\.[^.]+$/, '');
        const parts = base.split(' - ');
        if (parts.length >= 2) {
          return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
        }
        return { artist: 'Unknown Artist', title: base };
      }

      function addFiles(fileList) {
        const files = Array.from(fileList).filter(f => f.type.startsWith('audio/'));
        if (!files.length) return;

        files.forEach(file => {
          const meta = parseFilename(file.name);
          tracks.push({
            file,
            url: URL.createObjectURL(file),
            title: meta.title,
            artist: meta.artist,
            duration: 0
          });
        });

        renderPlaylist();
        if (currentIndex === -1) loadTrack(0);
      }

      function renderPlaylist() {
        playlistEl.querySelectorAll('.track-item').forEach(el => el.remove());

        if (tracks.length === 0) {
          emptyState.style.display = '';
          return;
        }
        emptyState.style.display = 'none';

        tracks.forEach((track, i) => {
          const el = document.createElement('div');
          el.className = 'track-item' + (i === currentIndex ? ' active' : '');
          el.innerHTML =
            '<span class="track-num">' + (i === currentIndex && !audio.paused ? '▶' : (i + 1)) + '</span>' +
            '<div class="track-info">' +
              '<div class="track-title">' + escapeHtml(track.title) + '</div>' +
              '<div class="track-artist">' + escapeHtml(track.artist) + '</div>' +
            '</div>' +
            '<span class="track-duration">' + (track.duration ? formatTime(track.duration) : '--:--') + '</span>';
          el.addEventListener('click', () => { loadTrack(i); play(); });
          playlistEl.appendChild(el);
        });
      }

      function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      function buildShuffleOrder() {
        shuffledOrder = tracks.map((_, i) => i);
        for (let i = shuffledOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
        }
      }

      function getNextIndex(dir) {
        if (tracks.length === 0) return -1;
        if (shuffle) {
          if (!shuffledOrder.length) buildShuffleOrder();
          const pos = shuffledOrder.indexOf(currentIndex);
          const nextPos = (pos + dir + shuffledOrder.length) % shuffledOrder.length;
          return shuffledOrder[nextPos];
        }
        return (currentIndex + dir + tracks.length) % tracks.length;
      }

      function loadTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentIndex = index;
        const track = tracks[index];

        disconnectAudio();
        audio.src = track.url;
        audio.load();

        nowTitle.textContent = track.title;
        nowArtist.textContent = track.artist;

        extractCover(track.file);

        renderPlaylist();
        updatePlayUI(false);
      }

      function extractCover(file) {
        artPlaceholder.hidden = false;
        albumArt.hidden = true;

        if (!window.jsmediatags) {
          loadJsMediaTags().then(() => extractCover(file));
          return;
        }

        window.jsmediatags.read(file, {
          onSuccess(tag) {
            const pic = tag.tags.picture;
            if (pic) {
              const blob = new Blob([new Uint8Array(pic.data)], { type: pic.format });
              albumArt.src = URL.createObjectURL(blob);
              albumArt.hidden = false;
              artPlaceholder.hidden = true;
            }
          },
          onError() {}
        });
      }

      function loadJsMediaTags() {
        return new Promise((resolve, reject) => {
          if (window.jsmediatags) { resolve(); return; }
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function initAudioContext() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        resizeCanvas();
        drawVisualizer();
      }

      function disconnectAudio() {
        /* MediaElementSource can only be created once per element */
      }

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = 80;
      }

      function drawVisualizer() {
        if (!analyser) { animFrame = requestAnimationFrame(drawVisualizer); return; }

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!audio.paused) {
          const barWidth = canvas.width / bufferLength * 1.5;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height * 0.85;
            const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
            gradient.addColorStop(0, 'rgba(124, 92, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(124, 92, 255, 0.7)');
            ctx.fillStyle = gradient;
            ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
            x += barWidth;
          }
        }

        animFrame = requestAnimationFrame(drawVisualizer);
      }

      function play() {
        if (currentIndex === -1 && tracks.length) loadTrack(0);
        if (currentIndex === -1) return;
        initAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audio.play();
      }

      function pause() {
        audio.pause();
      }

      function togglePlay() {
        if (audio.paused) play();
        else pause();
      }

      function updatePlayUI(playing) {
        iconPlay.hidden = playing;
        iconPause.hidden = !playing;
        artWrap.classList.toggle('playing', playing);
        albumArt.classList.toggle('playing', playing);
        renderPlaylist();
      }

      function seek(e) {
        const rect = progressTrack.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (audio.duration) audio.currentTime = ratio * audio.duration;
      }

      btnPlay.addEventListener('click', togglePlay);
      btnPrev.addEventListener('click', () => { loadTrack(getNextIndex(-1)); play(); });
      btnNext.addEventListener('click', () => { loadTrack(getNextIndex(1)); play(); });

      btnShuffle.addEventListener('click', () => {
        shuffle = !shuffle;
        btnShuffle.classList.toggle('active', shuffle);
        if (shuffle) buildShuffleOrder();
      });

      btnRepeat.addEventListener('click', () => {
        const modes = ['off', 'all', 'one'];
        const idx = modes.indexOf(repeat);
        repeat = modes[(idx + 1) % modes.length];
        btnRepeat.classList.toggle('active', repeat !== 'off');
        btnRepeat.title = 'Repeat: ' + repeat;
      });

      btnAdd.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });

      progressTrack.addEventListener('click', seek);

      volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value / 100;
        audio.muted = false;
      });

      btnMute.addEventListener('click', () => {
        if (audio.muted || audio.volume === 0) {
          audio.muted = false;
          audio.volume = prevVolume;
          volumeSlider.value = prevVolume * 100;
        } else {
          prevVolume = audio.volume;
          audio.muted = true;
          volumeSlider.value = 0;
        }
      });

      audio.addEventListener('play', () => updatePlayUI(true));
      audio.addEventListener('pause', () => updatePlayUI(false));
      audio.addEventListener('timeupdate', () => {
        const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
        progressFill.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = formatTime(audio.duration);
        if (tracks[currentIndex]) tracks[currentIndex].duration = audio.duration;
        renderPlaylist();
      });

      audio.addEventListener('ended', () => {
        if (repeat === 'one') { audio.currentTime = 0; play(); return; }
        if (repeat === 'all' || currentIndex < tracks.length - 1) {
          loadTrack(getNextIndex(1));
          play();
        } else {
          updatePlayUI(false);
        }
      });

      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.code) {
          case 'Space': e.preventDefault(); togglePlay(); break;
          case 'ArrowRight': audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); break;
          case 'ArrowLeft': audio.currentTime = Math.max(0, audio.currentTime - 5); break;
          case 'ArrowUp':
            audio.volume = Math.min(1, audio.volume + 0.05);
            volumeSlider.value = audio.volume * 100;
            break;
          case 'ArrowDown':
            audio.volume = Math.max(0, audio.volume - 0.05);
            volumeSlider.value = audio.volume * 100;
            break;
        }
      });

      let dragCounter = 0;
      document.addEventListener('dragenter', e => {
        e.preventDefault();
        dragCounter++;
        dropOverlay.classList.add('visible');
      });
      document.addEventListener('dragleave', () => {
        dragCounter--;
        if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('visible'); }
      });
      document.addEventListener('dragover', e => e.preventDefault());
      document.addEventListener('drop', e => {
        e.preventDefault();
        dragCounter = 0;
        dropOverlay.classList.remove('visible');
        addFiles(e.dataTransfer.files);
      });

      window.addEventListener('resize', resizeCanvas);
    })();
  </script>
</body>
</html>
