<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Medieval City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }

  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
  }
  #title {
    position: absolute; top: 28px; left: 32px;
    color: #f5e6c8; font-size: 1.55rem; font-weight: 300; letter-spacing: 0.18em;
    text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    opacity: 0; animation: fadeIn 2s ease 0.5s forwards;
  }
  #subtitle {
    position: absolute; top: 62px; left: 32px;
    color: rgba(245,230,200,0.55); font-size: 0.78rem; letter-spacing: 0.12em;
    opacity: 0; animation: fadeIn 2s ease 1s forwards;
  }
  #hint {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    color: rgba(245,230,200,0.4); font-size: 0.72rem; letter-spacing: 0.08em;
    opacity: 0; animation: fadeIn 2s ease 2.5s forwards;
  }
  #time-badge {
    position: absolute; top: 28px; right: 32px;
    background: rgba(10,14,20,0.55); border: 1px solid rgba(245,230,200,0.15);
    border-radius: 20px; padding: 8px 18px; color: #f5e6c8;
    font-size: 0.75rem; letter-spacing: 0.06em; backdrop-filter: blur(8px);
    opacity: 0; animation: fadeIn 2s ease 1.5s forwards;
  }
  #loading {
    position: fixed; inset: 0; background: #0a0e14; z-index: 100;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    transition: opacity 1s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading span { color: #c4a574; font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase; }
  .spinner {
    width: 36px; height: 36px; border: 2px solid rgba(196,165,116,0.2);
    border-top-color: #c4a574; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span>Building the city…</span></div>
<div id="overlay">
  <div id="title">Aldermark</div>
  <div id="subtitle">A living medieval city</div>
  <div id="time-badge">☀ Dawn</div>
  <div id="hint">Drag to orbit · Scroll to zoom · Right-click to pan</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Seeded RNG ── */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = 42;
const rng = mulberry32(SEED);
const rand = (a = 0, b = 1) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];

/* ── Palette ── */
const COL = {
  stone: 0x8a8278, stoneDark: 0x5c564e, stoneLight: 0xa09888,
  roof: 0x6b3a2a, roofAlt: 0x4a3020, roofBlue: 0x3a4a5a,
  wood: 0x5c4030, woodLight: 0x7a5a3a,
  grass: 0x4a6b3a, grassDark: 0x3a5530,
  dirt: 0x7a6a50, water: 0x3a6a8a, waterDeep: 0x2a5070,
  gold: 0xc4a050, torch: 0xff8830, smoke: 0xcccccc,
  banner: 0x8b2020, bannerAlt: 0x204080,
};

/* ── Scene setup ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc8d4e0, 0.004);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 600);
camera.position.set(80, 55, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.15;
controls.minDistance = 20;
controls.maxDistance = 180;
controls.target.set(0, 8, 0);

/* ── Lighting ── */
const sun = new THREE.DirectionalLight(0xfff0d0, 1.6);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
sun.shadow.camera.left = sun.shadow.camera.bottom = -90;
sun.shadow.camera.right = sun.shadow.camera.top = 90;
sun.shadow.bias = -0.0005;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x88aacc, 0x554433, 0.5);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x404060, 0.3);
scene.add(ambient);

const torchLights = [];

/* ── Materials cache ── */
const mats = {
  stone: new THREE.MeshLambertMaterial({ color: COL.stone }),
  stoneDark: new THREE.MeshLambertMaterial({ color: COL.stoneDark }),
  stoneLight: new THREE.MeshLambertMaterial({ color: COL.stoneLight }),
  wood: new THREE.MeshLambertMaterial({ color: COL.wood }),
  woodLight: new THREE.MeshLambertMaterial({ color: COL.woodLight }),
  roof: new THREE.MeshLambertMaterial({ color: COL.roof }),
  roofAlt: new THREE.MeshLambertMaterial({ color: COL.roofAlt }),
  roofBlue: new THREE.MeshLambertMaterial({ color: COL.roofBlue }),
  grass: new THREE.MeshLambertMaterial({ color: COL.grass }),
  dirt: new THREE.MeshLambertMaterial({ color: COL.dirt }),
  water: new THREE.MeshStandardMaterial({ color: COL.water, roughness: 0.15, metalness: 0.3, transparent: true, opacity: 0.85 }),
  gold: new THREE.MeshStandardMaterial({ color: COL.gold, metalness: 0.6, roughness: 0.35 }),
  banner: new THREE.MeshLambertMaterial({ color: COL.banner, side: THREE.DoubleSide }),
  bannerAlt: new THREE.MeshLambertMaterial({ color: COL.bannerAlt, side: THREE.DoubleSide }),
};

/* ── Animated objects registry ── */
const animSmoke = [];
const animFlags = [];
const animBirds = [];
const animCitizens = [];
const animTorches = [];

/* ── Ground ── */
function buildTerrain() {
  const size = 200;
  const geo = new THREE.PlaneGeometry(size, size, 64, 64);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const d = Math.sqrt(x * x + y * y);
    let h = Math.sin(x * 0.04) * Math.cos(y * 0.035) * 1.5;
    h += Math.sin(x * 0.08 + 2) * Math.cos(y * 0.07) * 0.8;
    if (d > 70) h += (d - 70) * 0.08;
    if (d < 25) h *= 0.3;
    pos.setZ(i, h);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mats.grass);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  scene.add(mesh);

  // River
  const riverGeo = new THREE.PlaneGeometry(200, 14, 1, 1);
  const river = new THREE.Mesh(riverGeo, mats.water);
  river.rotation.x = -Math.PI / 2;
  river.position.set(0, 0.15, -55);
  scene.add(river);

  // Bridge
  buildBridge(0, 0.5, -55);
}

function buildBridge(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(18, 0.6, 5), mats.stone);
  deck.position.y = 2;
  deck.castShadow = deck.receiveShadow = true;
  g.add(deck);

  for (let i = -1; i <= 1; i += 2) {
    const arch = new THREE.Mesh(new THREE.TorusGeometry(3, 0.5, 8, 16, Math.PI), mats.stoneDark);
    arch.rotation.x = Math.PI / 2;
    arch.rotation.z = Math.PI;
    arch.position.set(i * 4, 0.5, 0);
    arch.castShadow = true;
    g.add(arch);
  }

  for (let s = -7; s <= 7; s += 3.5) {
    for (let side of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.5, 0.4), mats.wood);
      post.position.set(s, 3.2, side * 2.2);
      post.castShadow = true;
      g.add(post);
    }
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 0.2), mats.woodLight);
  rail.position.set(0, 4.3, 2.2);
  g.add(rail.clone());
  g.children[g.children.length - 1].position.z = -2.2;

  scene.add(g);
}

/* ── Building helpers ── */
function box(w, h, d, mat, x, y, z, parent, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  (parent || scene).add(m);
  return m;
}

function roof(w, h, d, mat, x, y, z, parent) {
  const geo = new THREE.ConeGeometry(Math.max(w, d) * 0.72, h, 4);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y + h / 2, z);
  m.rotation.y = Math.PI / 4;
  m.castShadow = true;
  (parent || scene).add(m);
  return m;
}

function addChimney(x, y, z, parent) {
  box(0.6, 2, 0.6, mats.stoneDark, x, y, z, parent);
  animSmoke.push({ x, y: y + 2.5, z, phase: rand(0, Math.PI * 2), speed: rand(0.8, 1.4) });
}

function addWindow(x, y, z, parent, lit = false) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.9), new THREE.MeshBasicMaterial({
    color: lit ? 0xffcc66 : 0x1a1a2a, transparent: true, opacity: lit ? 0.9 : 0.7
  }));
  w.position.set(x, y, z);
  if (lit) animTorches.push({ mesh: w, phase: rand(0, 6) });
  (parent || scene).add(w);
}

/* ── House ── */
function buildHouse(x, z, opts = {}) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const w = opts.w || rand(3, 5);
  const d = opts.d || rand(3, 5);
  const h = opts.h || rand(3, 6);
  const rot = opts.rot || rand(0, Math.PI * 2);

  const body = box(w, h, d, pick([mats.stone, mats.stoneLight, mats.woodLight]), 0, 0, 0, g);
  const rm = pick([mats.roof, mats.roofAlt, mats.roofBlue]);
  roof(w * 1.1, h * 0.55, d * 1.1, rm, 0, h, 0, g);

  if (rng() > 0.4) addChimney(w * 0.3, h, d * 0.3, g);
  addWindow(0, h * 0.5, d / 2 + 0.01, g, rng() > 0.6);

  // Door
  box(1, 1.8, 0.1, mats.wood, 0, 0.9, d / 2 + 0.05, g, false);

  g.rotation.y = rot;
  scene.add(g);
  return g;
}

/* ── Tower ── */
function buildTower(x, z, h = 14, r = 2.5) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.1, h, 8), mats.stone);
  cyl.position.y = h / 2;
  cyl.castShadow = cyl.receiveShadow = true;
  g.add(cyl);

  const battlement = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.15, r * 1.15, 1.2, 8), mats.stoneDark);
  battlement.position.y = h + 0.6;
  battlement.castShadow = true;
  g.add(battlement);

  const cone = new THREE.Mesh(new THREE.ConeGeometry(r * 1.3, 4, 8), mats.roof);
  cone.position.y = h + 3;
  cone.castShadow = true;
  g.add(cone);

  // Flag
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3, 4), mats.wood);
  pole.position.set(0, h + 5, 0);
  g.add(pole);

  const flagGeo = new THREE.PlaneGeometry(2, 1.2, 8, 4);
  const flag = new THREE.Mesh(flagGeo, pick([mats.banner, mats.bannerAlt]));
  flag.position.set(1, h + 6, 0);
  g.add(flag);
  animFlags.push({ mesh: flag, geo: flagGeo, phase: rand(0, 6) });

  // Torch
  if (rng() > 0.3) {
    const tl = new THREE.PointLight(COL.torch, 0.8, 12);
    tl.position.set(r * 0.8, h * 0.4, 0);
    g.add(tl);
    torchLights.push(tl);
    animTorches.push({ light: tl, phase: rand(0, 6) });
  }

  scene.add(g);
  return g;
}

/* ── Cathedral ── */
function buildCathedral(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  // Nave
  box(10, 8, 18, mats.stoneLight, 0, 0, 0, g);
  roof(10, 5, 18, mats.roofBlue, 0, 8, 0, g);

  // Transept
  box(16, 7, 6, mats.stone, 0, 0, 0, g);
  roof(16, 4.5, 6, mats.roofBlue, 0, 7, 0, g);

  // Towers
  for (let sx of [-5, 5]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(3.5, 16, 3.5), mats.stone);
    t.position.set(sx, 8, -7);
    t.castShadow = t.receiveShadow = true;
    g.add(t);

    const spire = new THREE.Mesh(new THREE.ConeGeometry(2.5, 8, 4), mats.gold);
    spire.position.set(sx, 20, -7);
    spire.rotation.y = Math.PI / 4;
    spire.castShadow = true;
    g.add(spire);
  }

  // Rose window
  const rose = new THREE.Mesh(new THREE.CircleGeometry(1.5, 16), new THREE.MeshBasicMaterial({ color: 0x6688bb, transparent: true, opacity: 0.7 }));
  rose.position.set(0, 5, 9.01);
  g.add(rose);

  // Stained glass side windows
  for (let i = -6; i <= 6; i += 4) {
    const sw = new THREE.Mesh(new THREE.PlaneGeometry(1, 2.5), new THREE.MeshBasicMaterial({
      color: pick([0x884444, 0x446688, 0x886644, 0x448844]), transparent: true, opacity: 0.75
    }));
    sw.position.set(i, 4, 9.02);
    g.add(sw);
  }

  scene.add(g);
}

/* ── Market stalls ── */
function buildMarket(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  for (let i = 0; i < 6; i++) {
    const sx = (i % 3 - 1) * 4;
    const sz = Math.floor(i / 3) * 4 - 2;

    // Posts
    for (let px of [-1.2, 1.2]) {
      for (let pz of [-0.8, 0.8]) {
        box(0.15, 2.5, 0.15, mats.wood, sx + px, 0, sz + pz, g);
      }
    }
    // Awning
    const awning = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 2), pick([mats.banner, mats.bannerAlt, mats.roof]));
    awning.position.set(sx, 2.5, sz);
    awning.rotation.x = 0.15;
    awning.castShadow = true;
    g.add(awning);

    // Table
    box(2, 0.8, 1.2, mats.woodLight, sx, 0.8, sz, g);

    // Goods (simple boxes)
    if (rng() > 0.3) {
      box(0.5, 0.4, 0.5, pick([mats.roof, mats.gold, mats.grass]), sx + rand(-0.5, 0.5), 1.4, sz + rand(-0.3, 0.3), g);
    }
  }

  scene.add(g);
}

/* ── City walls ── */
function buildWalls(radius) {
  const segments = 32;
  const g = new THREE.Group();

  for (let i = 0; i < segments; i++) {
    const a1 = (i / segments) * Math.PI * 2;
    const a2 = ((i + 1) / segments) * Math.PI * 2;
    const mid = (a1 + a2) / 2;
    const len = radius * (a2 - a1) * 1.02;

    // Skip gate opening
    if (Math.abs(mid) < 0.25 || Math.abs(Math.abs(mid) - Math.PI) < 0.25) continue;

    const wall = new THREE.Mesh(new THREE.BoxGeometry(len, 6, 2), mats.stone);
    wall.position.set(Math.cos(mid) * radius, 3, Math.sin(mid) * radius);
    wall.rotation.y = -mid + Math.PI / 2;
    wall.castShadow = wall.receiveShadow = true;
    g.add(wall);

    // Crenellations
    const numCren = Math.floor(len / 1.5);
    for (let c = 0; c < numCren; c++) {
      const t = (c + 0.5) / numCren - 0.5;
      const cx = Math.cos(mid) * radius + Math.cos(mid + Math.PI / 2) * t * len;
      const cz = Math.sin(mid) * radius + Math.sin(mid + Math.PI / 2) * t * len;
      const cr = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 2), mats.stoneDark);
      cr.position.set(cx, 6.6, cz);
      cr.rotation.y = -mid + Math.PI / 2;
      cr.castShadow = true;
      g.add(cr);
    }
  }

  // Gatehouse
  buildGatehouse(radius);
  scene.add(g);
}

function buildGatehouse(r) {
  const g = new THREE.Group();
  g.position.set(0, 0, r);

  box(8, 8, 4, mats.stone, 0, 0, 0, g);
  box(3, 10, 3, mats.stoneDark, -4, 0, 0, g);
  box(3, 10, 3, mats.stoneDark, 4, 0, 0, g);

  for (let tx of [-4, 4]) {
    roof(3.5, 3, 3.5, mats.roof, tx, 10, 0, g);
  }

  // Portcullis
  const port = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 0.2), mats.wood);
  port.position.set(0, 4, 2.1);
  g.add(port);

  // Arch
  const arch = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.4, 8, 16, Math.PI), mats.stoneDark);
  arch.rotation.x = Math.PI / 2;
  arch.rotation.z = Math.PI;
  arch.position.set(0, 0, 2.1);
  g.add(arch);

  scene.add(g);
}

/* ── Trees ── */
function buildTree(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 2.5, 6), mats.wood);
  trunk.position.y = 1.25;
  trunk.castShadow = true;
  g.add(trunk);

  const foliage = new THREE.Mesh(new THREE.SphereGeometry(rand(1.5, 2.2), 8, 6), new THREE.MeshLambertMaterial({
    color: pick([0x3a6830, 0x4a7838, 0x3a5830])
  }));
  foliage.position.y = 3.2;
  foliage.castShadow = true;
  g.add(foliage);

  scene.add(g);
}

/* ── Well ── */
function buildWell(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.6, 1.2, 12), mats.stone);
  base.position.y = 0.6;
  base.castShadow = base.receiveShadow = true;
  g.add(base);

  for (let a = 0; a < 4; a++) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.15), mats.wood);
    const ang = (a / 4) * Math.PI * 2;
    post.position.set(Math.cos(ang) * 1.2, 1.8, Math.sin(ang) * 1.2);
    post.castShadow = true;
    g.add(post);
  }

  const roof2 = new THREE.Mesh(new THREE.ConeGeometry(2, 1.5, 4), mats.roof);
  roof2.position.y = 3.5;
  roof2.rotation.y = Math.PI / 4;
  g.add(roof2);

  scene.add(g);
}

/* ── Citizens (simple animated capsules) ── */
function buildCitizen(x, z) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: pick([0x553322, 0x334455, 0x665544, 0x444433]) });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 0.7, 4, 8), bodyMat);
  body.position.y = 0.85;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), new THREE.MeshLambertMaterial({ color: 0xd4a878 }));
  head.position.y = 1.55;
  g.add(head);

  g.position.set(x, 0, z);
  scene.add(g);

  const path = [];
  const cx = x, cz = z;
  for (let i = 0; i < 4; i++) {
    path.push({ x: cx + rand(-12, 12), z: cz + rand(-12, 12) });
  }

  animCitizens.push({
    group: g, path, idx: 0, t: 0,
    speed: rand(0.3, 0.7), phase: rand(0, 6)
  });
}

/* ── Birds ── */
function buildBirds() {
  for (let i = 0; i < 8; i++) {
    const bird = new THREE.Group();
    const wingMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 4), wingMat);
    bird.add(body);
    const wingL = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.15), wingMat);
    wingL.position.set(-0.25, 0, 0);
    bird.add(wingL);
    const wingR = wingL.clone();
    wingR.position.x = 0.25;
    bird.add(wingR);

    bird.position.set(rand(-60, 60), rand(25, 45), rand(-60, 60));
    scene.add(bird);

    animBirds.push({
      group: bird, wingL, wingR,
      speed: rand(0.2, 0.5), phase: rand(0, 6),
      dir: new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize(),
      height: bird.position.y
    });
  }
}

/* ── Smoke particles ── */
const smokeGroup = new THREE.Group();
scene.add(smokeGroup);
const smokeGeo = new THREE.SphereGeometry(0.3, 6, 4);
const smokeMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.3 });

function initSmoke() {
  for (const s of animSmoke) {
    for (let i = 0; i < 3; i++) {
      const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
      p.position.set(s.x, s.y, s.z);
      p.userData = { src: s, offset: i * 0.5, scale: rand(0.5, 1) };
      smokeGroup.add(p);
    }
  }
}

/* ── Build city ── */
function buildCity() {
  buildTerrain();

  const wallR = 45;
  buildWalls(wallR);

  // Corner towers
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    buildTower(Math.cos(a) * wallR, Math.sin(a) * wallR, rand(12, 16), rand(2, 3));
  }

  buildCathedral(0, -5);
  buildMarket(15, 10);
  buildWell(-12, 8);

  // Residential rings
  const housePositions = [];
  for (let ring = 0; ring < 3; ring++) {
    const count = 8 + ring * 6;
    const r = 12 + ring * 10;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + ring * 0.3;
      const x = Math.cos(a) * r + rand(-2, 2);
      const z = Math.sin(a) * r + rand(-2, 2);
      if (Math.abs(x) < 6 && Math.abs(z) < 10) continue;
      buildHouse(x, z);
      housePositions.push({ x, z });
    }
  }

  // Trees outside walls
  for (let i = 0; i < 40; i++) {
    const a = rand(0, Math.PI * 2);
    const r = rand(wallR + 8, 85);
    buildTree(Math.cos(a) * r, Math.sin(a) * r);
  }

  // Citizens
  for (let i = 0; i < 12; i++) {
    buildCitizen(rand(-30, 30), rand(-30, 30));
  }

  buildBirds();
  initSmoke();

  // Central plaza cobblestone
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(8, 32), mats.dirt);
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.y = 0.05;
  plaza.receiveShadow = true;
  scene.add(plaza);
}

buildCity();

/* ── Day/night cycle ── */
let timeOfDay = 0.25; // 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk
const timeBadge = document.getElementById('time-badge');
const timeLabels = ['🌙 Night', '🌅 Dawn', '☀ Noon', '🌇 Dusk'];

function updateDayNight(dt) {
  timeOfDay = (timeOfDay + dt * 0.008) % 1;

  const sunAngle = timeOfDay * Math.PI * 2 - Math.PI / 2;
  const sunY = Math.sin(sunAngle);
  const sunX = Math.cos(sunAngle);

  sun.position.set(sunX * 80, Math.max(sunY * 80, -10), 40);
  sun.intensity = Math.max(0, sunY) * 1.8 + 0.05;

  const isNight = sunY < 0.1;
  const warm = sunY > 0 && sunY < 0.4;
  const sunColor = warm ? 0xffaa66 : 0xfff0d0;
  sun.color.setHex(isNight ? 0x334466 : sunColor);

  const skyColors = [
    { top: 0x0a1020, bot: 0x1a2030, fog: 0x0a1020 },
    { top: 0xff8866, bot: 0xffcc88, fog: 0xd4b898 },
    { top: 0x66aacc, bot: 0xbbddff, fog: 0xc8d4e0 },
    { top: 0xcc6644, bot: 0xffaa66, fog: 0xc89878 },
  ];
  const seg = Math.floor(timeOfDay * 4) % 4;
  const next = (seg + 1) % 4;
  const blend = (timeOfDay * 4) % 1;

  const c1 = skyColors[seg], c2 = skyColors[next];
  const topC = new THREE.Color(c1.top).lerp(new THREE.Color(c2.top), blend);
  const botC = new THREE.Color(c1.bot).lerp(new THREE.Color(c2.bot), blend);
  const fogC = new THREE.Color(c1.fog).lerp(new THREE.Color(c2.fog), blend);

  scene.background = topC;
  scene.fog.color = fogC;
  hemi.color.copy(topC);
  hemi.groundColor.copy(botC);
  ambient.intensity = isNight ? 0.45 : 0.3;

  for (const tl of torchLights) {
    tl.intensity = isNight ? 1.2 : 0;
  }

  timeBadge.textContent = timeLabels[seg];
}

/* ── Animation loop ── */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  controls.update();
  updateDayNight(dt);

  // Smoke
  smokeGroup.children.forEach(p => {
    const s = p.userData.src;
    const age = (t * s.speed + p.userData.offset) % 4;
    p.position.set(
      s.x + Math.sin(t * 0.5 + s.phase) * age * 0.3,
      s.y + age * 0.8,
      s.z + Math.cos(t * 0.4 + s.phase) * age * 0.2
    );
    const sc = p.userData.scale * (0.5 + age * 0.3);
    p.scale.set(sc, sc, sc);
    p.material.opacity = Math.max(0, 0.35 - age * 0.08);
  });

  // Flags
  animFlags.forEach(f => {
    const pos = f.geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      pos.setZ(i, Math.sin(x * 3 + t * 4 + f.phase) * 0.15 * Math.abs(x));
    }
    pos.needsUpdate = true;
    f.geo.computeVertexNormals();
  });

  // Torches flicker
  animTorches.forEach(tor => {
    const flicker = 0.7 + Math.sin(t * 12 + tor.phase) * 0.15 + Math.sin(t * 23 + tor.phase * 2) * 0.1;
    if (tor.light) tor.light.intensity *= flicker / (tor.light.intensity > 0 ? tor.light.intensity / 1.2 : 1);
    if (tor.mesh) tor.mesh.material.opacity = 0.6 + flicker * 0.3;
  });

  // Citizens
  animCitizens.forEach(c => {
    c.t += dt * c.speed * 0.3;
    if (c.t >= 1) { c.t = 0; c.idx = (c.idx + 1) % c.path.length; }
    const from = c.path[c.idx];
    const to = c.path[(c.idx + 1) % c.path.length];
    c.group.position.x = from.x + (to.x - from.x) * c.t;
    c.group.position.z = from.z + (to.z - from.z) * c.t;
    c.group.position.y = Math.abs(Math.sin(t * 8 + c.phase)) * 0.05;
    const dx = to.x - from.x, dz = to.z - from.z;
    if (dx * dx + dz * dz > 0.01) c.group.rotation.y = Math.atan2(dx, dz);
  });

  // Birds
  animBirds.forEach(b => {
    b.group.position.addScaledVector(b.dir, b.speed * 15 * dt);
    b.group.position.y = b.height + Math.sin(t * 2 + b.phase) * 2;
    const flap = Math.sin(t * 10 + b.phase) * 0.6;
    b.wingL.rotation.z = flap;
    b.wingR.rotation.z = -flap;
    if (b.group.position.length() > 90) b.dir.multiplyScalar(-1);
  });

  // Water shimmer
  mats.water.emissive = new THREE.Color(0x224466);
  mats.water.emissiveIntensity = 0.1 + Math.sin(t * 1.5) * 0.05;

  renderer.render(scene, camera);
}

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Start ── */
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 800);

animate();
</script>
