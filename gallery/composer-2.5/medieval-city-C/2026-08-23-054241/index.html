<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medieval City — Living Procedural Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0806; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
  }
  #title-card {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 2.2rem 2.8rem; pointer-events: none;
    opacity: 0; transform: translateY(-12px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #title-card.visible { opacity: 1; transform: translateY(0); }
  #title-card h1 {
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    font-size: clamp(1.4rem, 3.2vw, 2.6rem);
    font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255, 236, 200, 0.92);
    text-shadow: 0 2px 24px rgba(0,0,0,0.7);
  }
  #title-card p {
    margin-top: 0.5rem; font-family: Georgia, serif; font-style: italic;
    font-size: clamp(0.85rem, 1.6vw, 1.1rem);
    color: rgba(220, 195, 150, 0.75); letter-spacing: 0.06em;
  }
  #location-tag {
    position: fixed; bottom: 2.4rem; left: 2.8rem; z-index: 20;
    pointer-events: none; opacity: 0; transform: translateY(10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  #location-tag.visible { opacity: 1; transform: translateY(0); }
  #location-tag span {
    display: inline-block; padding: 0.55rem 1.1rem;
    background: rgba(12, 8, 4, 0.55); border-left: 3px solid rgba(210, 170, 90, 0.85);
    font-family: 'Palatino Linotype', Georgia, serif;
    font-size: clamp(0.75rem, 1.4vw, 0.95rem); letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255, 230, 180, 0.88);
    backdrop-filter: blur(6px);
  }
  #time-badge {
    position: fixed; top: 2rem; right: 2.4rem; z-index: 20;
    pointer-events: none; opacity: 0; transition: opacity 1s ease 0.5s;
    font-family: Georgia, serif; font-size: 0.85rem; font-style: italic;
    color: rgba(200, 175, 130, 0.7); letter-spacing: 0.08em;
  }
  #time-badge.visible { opacity: 1; }
  #vignette-flash {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    background: radial-gradient(circle, rgba(255,200,100,0.35) 0%, transparent 70%);
    opacity: 0; transition: opacity 2s ease;
  }
  #vignette-flash.active { opacity: 1; }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="title-card">
  <h1>Aldermark</h1>
  <p>A living city at the edge of dawn</p>
</div>
<div id="location-tag"><span>Outer Walls</span></div>
<div id="time-badge">Before sunrise</div>
<div id="vignette-flash"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ─── Seeded RNG ───────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = 847291;
const rand = mulberry32(SEED);

function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function range(a, b) { return a + rand() * (b - a); }

// ─── Palette ──────────────────────────────────────────────────
const COL = {
  skyNight: new THREE.Color(0x0c1220),
  skyDawn: new THREE.Color(0xc4783a),
  skyDay: new THREE.Color(0x6eb5e0),
  skyDusk: new THREE.Color(0xb85a30),
  fogNight: 0x0a0c14,
  fogDay: 0xc8d4e0,
  fogDawn: 0x8a6040,
  stone: 0x8a8278,
  stoneDark: 0x5a5248,
  timber: 0x5c3a22,
  timberLight: 0x7a5030,
  roofRed: 0x6b2820,
  roofBrown: 0x4a3020,
  roofSlate: 0x3a4048,
  thatch: 0xb89850,
  plaster: 0xd4c4a8,
  plasterWarm: 0xe8d8b8,
  market: 0xc04030,
  banner: 0x1a3060,
  gold: 0xd4a840,
  grass: 0x3a5a28,
  dirt: 0x6a5038,
  cobble: 0x5a5550,
  water: 0x3a6070,
  fire: 0xff8030,
  lantern: 0xffc060,
};

// ─── Scene setup ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(COL.fogNight, 0.012);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 400);
camera.position.set(0, 30, 80);

// ─── Lighting ─────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x404060, 0.35);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffd090, 0.0);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.0005;
scene.add(sun);

const moon = new THREE.DirectionalLight(0x6080c0, 0.25);
moon.position.set(-40, 60, -30);
scene.add(moon);

const hemi = new THREE.HemisphereLight(0x8090b0, 0x201810, 0.3);
scene.add(hemi);

// ─── Materials cache ──────────────────────────────────────────
const mats = {};
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!mats[key]) {
    mats[key] = new THREE.MeshStandardMaterial({
      color, roughness: opts.roughness ?? 0.85, metalness: opts.metalness ?? 0.05,
      emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.emissiveIntensity ?? 0,
      flatShading: opts.flat ?? false,
    });
  }
  return mats[key];
}

// ─── City constants ───────────────────────────────────────────
const BLOCK = 8;
const GRID = 9;
const CITY_SIZE = GRID * BLOCK;
const HALF = CITY_SIZE / 2;

const cityGroup = new THREE.Group();
scene.add(cityGroup);

const animated = [];
const lanterns = [];
const smokes = [];
const flags = [];
const npcs = [];
const marketStalls = [];

// ─── Geometry helpers ─────────────────────────────────────────
function box(w, h, d, material, x, y, z, parent, castShadow = true) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, material);
  m.position.set(x, y + h / 2, z);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  (parent || cityGroup).add(m);
  return m;
}

function roof(w, d, h, material, x, y, z, parent) {
  const g = new THREE.ConeGeometry(Math.max(w, d) * 0.72, h, 4);
  const m = new THREE.Mesh(g, material);
  m.position.set(x, y + h / 2, z);
  m.rotation.y = Math.PI / 4;
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || cityGroup).add(m);
  return m;
}

function cylinder(r, h, material, x, y, z, parent, segs = 8) {
  const g = new THREE.CylinderGeometry(r, r, h, segs);
  const m = new THREE.Mesh(g, material);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || cityGroup).add(m);
  return m;
}

// ─── Ground ───────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(CITY_SIZE + 60, CITY_SIZE + 60, 1, 1);
const ground = new THREE.Mesh(groundGeo, mat(COL.grass, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
cityGroup.add(ground);

// Cobble plaza
const plazaGeo = new THREE.PlaneGeometry(CITY_SIZE * 0.55, CITY_SIZE * 0.55);
const plaza = new THREE.Mesh(plazaGeo, mat(COL.cobble, { roughness: 0.95 }));
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 0.01;
cityGroup.add(plaza);

// ─── Street grid ──────────────────────────────────────────────
const streetMat = mat(COL.dirt, { roughness: 1 });
for (let i = 0; i <= GRID; i++) {
  const pos = -HALF + i * BLOCK;
  box(CITY_SIZE + 4, 0.08, 2.2, streetMat, 0, 0, pos, cityGroup, false);
  box(2.2, 0.08, CITY_SIZE + 4, streetMat, pos, 0, 0, cityGroup, false);
}

// ─── Building generators ──────────────────────────────────────
function buildHouse(bx, bz, type) {
  const g = new THREE.Group();
  g.position.set(bx, 0, bz);
  const w = range(3.5, 5.5), d = range(3.5, 5.5), h = range(3.5, 6);

  const wallCol = type === 'workshop' ? COL.plasterWarm : pick([COL.plaster, COL.plasterWarm, COL.timberLight]);
  const wallMat = mat(wallCol);
  const frameMat = mat(COL.timber);

  box(w, h, d, wallMat, 0, 0, 0, g);
  // Timber frame accents
  box(0.25, h, d + 0.1, frameMat, -w/2, 0, 0, g);
  box(0.25, h, d + 0.1, frameMat, w/2, 0, 0, g);
  box(w + 0.1, h, 0.25, frameMat, 0, 0, -d/2, g);

  const roofCol = pick([COL.roofRed, COL.roofBrown, COL.thatch, COL.roofSlate]);
  roof(w * 1.15, d * 1.15, range(2, 3.2), mat(roofCol), 0, h, 0, g);

  // Door
  box(0.9, 1.8, 0.15, mat(COL.timber, { roughness: 0.9 }), 0, 0, d/2 + 0.05, g);

  // Window with lantern at night
  const win = box(0.7, 0.7, 0.1, mat(0x1a2030, { emissive: COL.lantern, emissiveIntensity: 0 }), 0, h * 0.55, d/2 + 0.06, g);
  lanterns.push({ mesh: win, base: 0, flicker: rand() * 10 });

  if (type === 'workshop') {
    // Forge chimney
    cylinder(0.35, 2.5, mat(COL.stoneDark), w * 0.3, h, -d * 0.2, g, 6);
    const smokeOrigin = new THREE.Vector3(bx + w * 0.3, h + 2.5, bz - d * 0.2);
    smokes.push({ origin: smokeOrigin, rate: 0.4 + rand() * 0.3, particles: [] });
    // Anvil
    box(0.8, 0.4, 0.5, mat(COL.stoneDark, { metalness: 0.4 }), w * 0.2, 0, d * 0.15, g);
    // Warm forge glow
    const forge = box(0.6, 0.5, 0.6, mat(COL.fire, { emissive: COL.fire, emissiveIntensity: 0.8 }), w * 0.2, 0.3, d * 0.15, g);
    animated.push({ update: (t, day) => {
      forge.material.emissiveIntensity = day > 0.3 && day < 0.75 ? 0.2 : 0.6 + Math.sin(t * 8) * 0.3;
    }});
  }

  if (type === 'home') {
    // Small garden patch
    box(w * 0.6, 0.05, d * 0.4, mat(COL.grass), -w * 0.15, 0, -d * 0.55, g, false);
    // Clothes line
    const line = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, w * 0.7, 4),
      mat(0xcccccc)
    );
    line.rotation.z = Math.PI / 2;
    line.position.set(0, h * 0.4, d * 0.6);
    g.add(line);
  }

  // Chimney smoke for homes
  if (rand() > 0.4) {
    cylinder(0.25, 1.5, mat(COL.stoneDark), -w * 0.25, h, -d * 0.25, g, 5);
    smokes.push({
      origin: new THREE.Vector3(bx - w * 0.25, h + 1.5, bz - d * 0.25),
      rate: 0.15 + rand() * 0.2, particles: []
    });
  }

  cityGroup.add(g);
  return g;
}

function buildMarketStall(bx, bz, idx) {
  const g = new THREE.Group();
  g.position.set(bx, 0, bz);
  const awningCol = pick([COL.market, 0x306040, 0x604030, COL.gold]);
  box(3, 0.15, 2, mat(COL.timber), 0, 0.9, 0, g);
  box(3.2, 0.08, 2.2, mat(awningCol), 0, 1.85, 0, g);
  // Awning slope
  const awning = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.06, 1.5), mat(awningCol, { roughness: 0.7 }));
  awning.position.set(0, 2.1, 0.3);
  awning.rotation.x = -0.35;
  g.add(awning);
  // Goods crates
  for (let c = 0; c < 3; c++) {
    box(0.5, 0.4, 0.5, mat(pick([COL.roofBrown, COL.gold, 0x804020])), -0.8 + c * 0.7, 0, 0.5, g);
  }
  // Banner
  const banner = box(0.05, 1.2, 0.7, mat(pick([COL.banner, COL.market, COL.gold])), 1.4, 1.2, 0, g);
  flags.push({ mesh: banner, phase: rand() * 6.28 });

  marketStalls.push(g);
  cityGroup.add(g);
  return g;
}

function buildCathedral(bx, bz) {
  const g = new THREE.Group();
  g.position.set(bx, 0, bz);

  // Nave
  box(10, 8, 18, mat(COL.stone), 0, 0, 0, g);
  // Transept
  box(16, 7, 6, mat(COL.stone), 0, 0, -2, g);
  // Tower
  box(5, 22, 5, mat(COL.stoneDark), 0, 8, 6, g);
  // Spire
  const spire = new THREE.Mesh(new THREE.ConeGeometry(2.5, 12, 4), mat(COL.roofSlate));
  spire.position.set(0, 36, 6);
  spire.rotation.y = Math.PI / 4;
  spire.castShadow = true;
  g.add(spire);
  // Rose window glow
  const rose = new THREE.Mesh(
    new THREE.CircleGeometry(1.5, 16),
    mat(COL.gold, { emissive: COL.gold, emissiveIntensity: 0.3, side: THREE.DoubleSide })
  );
  rose.position.set(0, 5, 9.05);
  g.add(rose);
  animated.push({ update: (t, day) => {
    rose.material.emissiveIntensity = day < 0.35 ? 0.1 : (day > 0.7 ? 0.5 : 0.3 + Math.sin(t) * 0.1);
  }});

  // Bells reference point for memorable moment
  g.userData.bellTower = new THREE.Vector3(bx, 30, bz + 6);
  cityGroup.add(g);
  return g;
}

function buildWallSegment(x, z, rotY, length) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  const segments = Math.ceil(length / 4);
  for (let i = 0; i < segments; i++) {
    const lx = -length / 2 + i * 4 + 2;
    box(3.5, 5, 2, mat(COL.stone), lx, 0, 0, g);
    // Crenellations
    for (let c = 0; c < 3; c++) {
      box(0.8, 0.8, 0.8, mat(COL.stoneDark), lx - 1 + c * 1, 5, 0, g);
    }
  }
  cityGroup.add(g);
  return g;
}

function buildTower(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  cylinder(2.5, 12, mat(COL.stoneDark), 0, 0, 0, g, 8);
  box(4, 1, 4, mat(COL.stone), 0, 12, 0, g);
  // Flag
  const pole = cylinder(0.08, 4, mat(COL.timber), 0, 12, 0, g, 4);
  const flagMesh = box(1.5, 1, 0.05, mat(COL.banner), 0.75, 15, 0, g);
  flags.push({ mesh: flagMesh, phase: rand() * 6.28 });
  // Torch
  const torch = box(0.2, 0.4, 0.2, mat(COL.fire, { emissive: COL.fire, emissiveIntensity: 1.2 }), 2, 6, 0, g);
  lanterns.push({ mesh: torch, base: 1.2, flicker: rand() * 10 });
  cityGroup.add(g);
  return g;
}

function buildWell(bx, bz) {
  const g = new THREE.Group();
  g.position.set(bx, 0, bz);
  cylinder(1.2, 0.8, mat(COL.stone), 0, 0, 0, g, 12);
  cylinder(0.9, 0.3, mat(COL.water, { roughness: 0.2, metalness: 0.1 }), 0, 0.5, 0, g, 12);
  // Roof frame
  box(0.15, 3, 0.15, mat(COL.timber), -1, 0.8, 0, g);
  box(0.15, 3, 0.15, mat(COL.timber), 1, 0.8, 0, g);
  box(2.2, 0.15, 0.15, mat(COL.timber), 0, 3.6, 0, g);
  cityGroup.add(g);
}

function createNPC(x, z, path) {
  const g = new THREE.Group();
  const bodyCol = pick([0x4a3828, 0x283848, 0x483828, 0x384838, 0x583830]);
  box(0.35, 0.9, 0.25, mat(bodyCol), 0, 0, 0, g);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), mat(0xd4a878));
  head.position.set(0, 1.05, 0);
  head.castShadow = true;
  g.add(head);
  // Simple hat/hood
  if (rand() > 0.5) {
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.35, 6), mat(pick([COL.roofBrown, COL.timber, 0x2a3040])));
    hat.position.set(0, 1.25, 0);
    g.add(hat);
  }
  g.position.set(x, 0, z);
  cityGroup.add(g);
  npcs.push({ group: g, path, progress: rand(), speed: range(0.04, 0.09) });
}

// ─── Procedural city layout ───────────────────────────────────
const occupied = new Set();
function key(gx, gz) { return gx + ',' + gz; }
function mark(gx, gz) { occupied.add(key(gx, gz)); }
function free(gx, gz) { return gx >= 1 && gx < GRID - 1 && gz >= 1 && gz < GRID - 1 && !occupied.has(key(gx, gz)); }

// Market center (blocks 4,4 area)
for (let dx = -1; dx <= 1; dx++) {
  for (let dz = -1; dz <= 1; dz++) {
    mark(4 + dx, 4 + dz);
  }
}
const marketCenter = { x: -HALF + 4.5 * BLOCK, z: -HALF + 4.5 * BLOCK };
buildWell(marketCenter.x + 3, marketCenter.z - 2);

// Market stalls ring
const stallPositions = [
  [-5, -3], [-2, -5], [2, -5], [5, -3],
  [5, 2], [2, 5], [-2, 5], [-5, 2],
  [-3, 0], [3, 0], [0, -3], [0, 3],
];
stallPositions.forEach(([ox, oz], i) => {
  buildMarketStall(marketCenter.x + ox, marketCenter.z + oz, i);
});

// Cathedral at north
const cathedralPos = { x: -HALF + 4.5 * BLOCK, z: -HALF + 1.5 * BLOCK };
buildCathedral(cathedralPos.x, cathedralPos.z);
for (let dx = -1; dx <= 1; dx++) mark(4 + dx, 1);

// Fill remaining blocks
for (let gx = 1; gx < GRID - 1; gx++) {
  for (let gz = 1; gz < GRID - 1; gz++) {
    if (!free(gx, gz)) continue;
    mark(gx, gz);
    const bx = -HALF + (gx + 0.5) * BLOCK;
    const bz = -HALF + (gz + 0.5) * BLOCK;
    const dist = Math.hypot(gx - 4, gz - 4);
    let type = 'home';
    if (dist > 3.5) type = 'home';
    else if (dist > 2) type = pick(['home', 'workshop']);
    else type = 'workshop';
    // Near market = more workshops
    if (Math.abs(gx - 4) <= 2 && Math.abs(gz - 4) <= 2 && rand() > 0.5) type = 'workshop';
    buildHouse(bx + range(-1, 1), bz + range(-1, 1), type);
  }
}

// City walls
const wallOffset = HALF + 3;
buildWallSegment(0, -wallOffset, 0, CITY_SIZE + 8);
buildWallSegment(0, wallOffset, 0, CITY_SIZE + 8);
buildWallSegment(-wallOffset, 0, Math.PI / 2, CITY_SIZE + 8);
buildWallSegment(wallOffset, 0, Math.PI / 2, CITY_SIZE + 8);

// Corner towers
buildTower(-wallOffset, -wallOffset);
buildTower(wallOffset, -wallOffset);
buildTower(-wallOffset, wallOffset);
buildTower(wallOffset, wallOffset);

// Gate house (south)
const gateG = new THREE.Group();
gateG.position.set(0, 0, wallOffset);
box(8, 7, 4, mat(COL.stone), 0, 0, 0, gateG);
box(3, 5, 4.2, mat(0x0a0a0a), 0, 0, 0, gateG, false); // arch opening
box(8, 1.5, 4.5, mat(COL.stoneDark), 0, 7, 0, gateG);
// Portcullis hint
for (let i = -3; i <= 3; i += 1.5) {
  box(0.12, 6, 0.12, mat(COL.stoneDark, { metalness: 0.5 }), i, 0, 0, gateG);
}
cityGroup.add(gateG);

// Trees outside walls
for (let i = 0; i < 24; i++) {
  const angle = rand() * Math.PI * 2;
  const dist = HALF + 8 + rand() * 20;
  const tx = Math.cos(angle) * dist;
  const tz = Math.sin(angle) * dist;
  const tree = new THREE.Group();
  tree.position.set(tx, 0, tz);
  cylinder(0.3, range(2, 4), mat(COL.timber), 0, 0, 0, tree, 6);
  const foliage = new THREE.Mesh(
    new THREE.ConeGeometry(range(1.5, 2.5), range(3, 5), 6),
    mat(rand() > 0.5 ? 0x2a5020 : 0x3a6830)
  );
  foliage.position.y = range(3, 5);
  foliage.castShadow = true;
  tree.add(foliage);
  cityGroup.add(tree);
}

// ─── NPC paths ────────────────────────────────────────────────
const pathMarket = [
  new THREE.Vector3(-15, 0, 20), new THREE.Vector3(-8, 0, 10), new THREE.Vector3(0, 0, 5),
  new THREE.Vector3(8, 0, 0), new THREE.Vector3(12, 0, -8), new THREE.Vector3(5, 0, -15),
];
const pathStreet = [
  new THREE.Vector3(-30, 0, -30), new THREE.Vector3(-10, 0, -10), new THREE.Vector3(10, 0, 10),
  new THREE.Vector3(30, 0, 30),
];
const pathWall = [
  new THREE.Vector3(-35, 0, -35), new THREE.Vector3(0, 0, -38), new THREE.Vector3(35, 0, -35),
  new THREE.Vector3(38, 0, 0), new THREE.Vector3(35, 0, 35),
];

for (let i = 0; i < 8; i++) createNPC(0, 0, pathMarket);
for (let i = 0; i < 5; i++) createNPC(0, 0, pathStreet);
for (let i = 0; i < 3; i++) createNPC(0, 0, pathWall);

// ─── Smoke particle system ────────────────────────────────────
const smokeGeo = new THREE.SphereGeometry(0.15, 4, 4);
const smokeMat = mat(0xaaaaaa, { transparent: true, opacity: 0.4, roughness: 1 });

function spawnSmoke(s) {
  const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
  p.material.opacity = range(0.2, 0.5);
  p.position.copy(s.origin);
  p.userData = { vy: range(0.02, 0.05), life: 0, maxLife: range(2, 4), vx: range(-0.01, 0.01) };
  scene.add(p);
  s.particles.push(p);
}

// ─── Birds ────────────────────────────────────────────────────
const birds = [];
const birdGroup = new THREE.Group();
scene.add(birdGroup);
for (let i = 0; i < 12; i++) {
  const b = new THREE.Group();
  const wing = mat(0x1a1a1a);
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.12, 4, 4), wing);
  b.add(body);
  const w1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.04, 0.12), wing);
  w1.position.set(0.1, 0, 0);
  w1.name = 'wingL';
  b.add(w1);
  const w2 = w1.clone();
  w2.name = 'wingR';
  b.add(w2);
  b.position.set(range(-40, 40), range(15, 35), range(-40, 40));
  b.userData = { speed: range(0.3, 0.8), phase: rand() * 6.28, orbit: range(20, 50) };
  birdGroup.add(b);
  birds.push(b);
}

// ─── Sun mesh for visual ──────────────────────────────────────
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(4, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffdd88, transparent: true, opacity: 0.9 })
);
scene.add(sunMesh);

// God rays / memorable moment particles
const rayGroup = new THREE.Group();
scene.add(rayGroup);
const rayCount = 40;
const rayMeshes = [];
for (let i = 0; i < rayCount; i++) {
  const r = new THREE.Mesh(
    new THREE.PlaneGeometry(0.4, range(20, 50)),
    new THREE.MeshBasicMaterial({
      color: 0xffcc66, transparent: true, opacity: 0, side: THREE.DoubleSide,
      depthWrite: false, blending: THREE.AdditiveBlending
    })
  );
  r.userData.baseAngle = (i / rayCount) * Math.PI * 2;
  rayMeshes.push(r);
  rayGroup.add(r);
}

// ─── Camera tour keyframes ────────────────────────────────────
const tour = [
  { pos: [0, 28, 55], look: [0, 8, 0], label: 'Outer Walls', duration: 6, timeLabel: 'Before sunrise' },
  { pos: [-38, 18, -38], look: [0, 10, 0], label: 'Ramparts at Dawn', duration: 7, timeLabel: 'First light' },
  { pos: [25, 12, 25], look: [0, 3, 0], label: 'Market Square', duration: 8, timeLabel: 'Morning market' },
  { pos: [8, 6, 12], look: [0, 2, 5], label: 'Artisan Quarter', duration: 7, timeLabel: 'Workshops awake' },
  { pos: [-12, 5, -8], look: [0, 4, -15], label: 'Residential Lanes', duration: 7, timeLabel: 'Daily life' },
  { pos: [0, 14, -25], look: [0, 20, 5], label: 'Cathedral Spire', duration: 8, timeLabel: 'Golden hour' },
  { pos: [0, 45, 60], look: [0, 15, 0], label: 'City Overview', duration: 9, timeLabel: 'Sunset glow' },
  { pos: [0, 22, 42], look: [0, 8, 0], label: 'Evening Return', duration: 7, timeLabel: 'Lanterns lit' },
];

let tourIndex = 0, tourT = 0;
const lookTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();
const tempVec = new THREE.Vector3();

// ─── UI elements ──────────────────────────────────────────────
const titleCard = document.getElementById('title-card');
const locationTag = document.getElementById('location-tag');
const timeBadge = document.getElementById('time-badge');
const vignetteFlash = document.getElementById('vignette-flash');
setTimeout(() => titleCard.classList.add('visible'), 400);
setTimeout(() => timeBadge.classList.add('visible'), 1200);

function setLocation(text, timeText) {
  locationTag.querySelector('span').textContent = text;
  locationTag.classList.remove('visible');
  void locationTag.offsetWidth;
  locationTag.classList.add('visible');
  if (timeText) timeBadge.textContent = timeText;
}

// ─── Day cycle ────────────────────────────────────────────────
const CYCLE_DURATION = 59; // seconds for full day
let memorableTriggered = false;

function dayPhase(elapsed) {
  return (elapsed % CYCLE_DURATION) / CYCLE_DURATION;
}

function updateDayNight(day, elapsed) {
  // day: 0=night, 0.25=dawn, 0.5=noon, 0.75=dusk, 1=night
  let sunAngle, sunInt, ambInt, fogCol, fogDens, skyCol, moonInt;

  if (day < 0.2) {
    const t = day / 0.2;
    sunAngle = -0.5 + t * 0.3;
    sunInt = t * 0.3;
    ambInt = 0.15 + t * 0.1;
    fogCol = new THREE.Color(COL.fogNight).lerp(new THREE.Color(COL.fogDawn), t);
    fogDens = 0.014 - t * 0.004;
    skyCol = COL.skyNight.clone().lerp(COL.skyDawn, t * 0.5);
    moonInt = 0.3 - t * 0.15;
  } else if (day < 0.35) {
    const t = (day - 0.2) / 0.15;
    sunAngle = -0.2 + t * 0.8;
    sunInt = 0.3 + t * 1.2;
    ambInt = 0.25 + t * 0.2;
    fogCol = new THREE.Color(COL.fogDawn).lerp(new THREE.Color(COL.fogDay), t);
    fogDens = 0.01 - t * 0.005;
    skyCol = COL.skyDawn.clone().lerp(COL.skyDay, t);
    moonInt = 0.15 - t * 0.1;
  } else if (day < 0.65) {
    const t = (day - 0.35) / 0.3;
    sunAngle = 0.6 + t * 0.5;
    sunInt = 1.5 - t * 0.3;
    ambInt = 0.45;
    fogCol = new THREE.Color(COL.fogDay);
    fogDens = 0.004;
    skyCol = COL.skyDay.clone();
    moonInt = 0.05;
  } else if (day < 0.8) {
    const t = (day - 0.65) / 0.15;
    sunAngle = 1.1 + t * 0.4;
    sunInt = 1.2 - t * 0.8;
    ambInt = 0.4 - t * 0.15;
    fogCol = new THREE.Color(COL.fogDay).lerp(new THREE.Color(COL.fogDawn), t);
    fogDens = 0.004 + t * 0.006;
    skyCol = COL.skyDay.clone().lerp(COL.skyDusk, t);
    moonInt = 0.05 + t * 0.15;
  } else {
    const t = (day - 0.8) / 0.2;
    sunAngle = 1.5 + t * 0.5;
    sunInt = 0.4 - t * 0.35;
    ambInt = 0.25 - t * 0.1;
    fogCol = new THREE.Color(COL.fogDawn).lerp(new THREE.Color(COL.fogNight), t);
    fogDens = 0.01 + t * 0.004;
    skyCol = COL.skyDusk.clone().lerp(COL.skyNight, t);
    moonInt = 0.2 + t * 0.1;
  }

  const sunDist = 100;
  const sx = Math.cos(sunAngle) * sunDist;
  const sy = Math.sin(sunAngle) * sunDist + 10;
  sun.position.set(sx, sy, 40);
  sun.intensity = sunInt;
  sun.color.setHSL(0.08 + (day > 0.6 ? (day - 0.6) * 0.05 : 0), 0.8, 0.55);
  moon.intensity = moonInt;
  ambient.intensity = ambInt;
  hemi.intensity = ambInt * 0.7;
  scene.fog.color.copy(fogCol);
  scene.fog.density = fogDens;
  scene.background = skyCol;
  renderer.setClearColor(skyCol);

  sunMesh.position.copy(sun.position).multiplyScalar(0.85);
  sunMesh.material.opacity = sunInt > 0.1 ? 0.7 : 0;

  // Lanterns
  const lanternOn = day < 0.22 || day > 0.78;
  lanterns.forEach(l => {
    const flicker = lanternOn ? l.base + Math.sin(elapsed * 6 + l.flicker) * 0.3 + Math.sin(elapsed * 13 + l.flicker) * 0.15 : 0;
    l.mesh.material.emissiveIntensity = flicker;
  });

  // Memorable moment: golden rays at cathedral during dawn tour
  const inGoldenMoment = day >= 0.28 && day <= 0.42 && tourIndex >= 4 && tourIndex <= 5;
  rayGroup.position.set(cathedralPos.x, 18, cathedralPos.z);
  rayMeshes.forEach((r, i) => {
    const a = r.userData.baseAngle + elapsed * 0.05;
    r.position.set(Math.cos(a) * 3, 0, Math.sin(a) * 3);
    r.rotation.y = a;
    r.rotation.x = -0.3;
    r.material.opacity = inGoldenMoment ? range(0.08, 0.18) * (0.7 + Math.sin(elapsed * 2 + i) * 0.3) : 0;
  });

  if (inGoldenMoment && !memorableTriggered) {
    memorableTriggered = true;
    vignetteFlash.classList.add('active');
    setTimeout(() => vignetteFlash.classList.remove('active'), 3000);
  }
  if (day < 0.25 || day > 0.5) memorableTriggered = false;
}

// ─── Camera interpolation ─────────────────────────────────────
function updateCamera(dt, elapsed) {
  tourT += dt;
  const cur = tour[tourIndex];
  const nxt = tour[(tourIndex + 1) % tour.length];
  const segDur = cur.duration;
  const t = Math.min(tourT / segDur, 1);
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  if (t < 0.05 && tourT - dt <= 0) setLocation(cur.label, cur.timeLabel);

  camPos.set(
    THREE.MathUtils.lerp(cur.pos[0], nxt.pos[0], ease),
    THREE.MathUtils.lerp(cur.pos[1], nxt.pos[1], ease),
    THREE.MathUtils.lerp(cur.pos[2], nxt.pos[2], ease)
  );
  lookTarget.set(
    THREE.MathUtils.lerp(cur.look[0], nxt.look[0], ease),
    THREE.MathUtils.lerp(cur.look[1], nxt.look[1], ease),
    THREE.MathUtils.lerp(cur.look[2], nxt.look[2], ease)
  );

  // Subtle sway
  camPos.x += Math.sin(elapsed * 0.4) * 0.3;
  camPos.y += Math.sin(elapsed * 0.25) * 0.15;

  camera.position.lerp(camPos, 0.06);
  tempVec.copy(lookTarget);
  camera.lookAt(tempVec);

  if (tourT >= segDur) {
    tourT = 0;
    tourIndex = (tourIndex + 1) % tour.length;
    setLocation(tour[tourIndex].label, tour[tourIndex].timeLabel);
  }
}

// ─── NPC update ───────────────────────────────────────────────
function updateNPCs(dt) {
  npcs.forEach(n => {
    n.progress += n.speed * dt;
    if (n.progress >= 1) n.progress -= 1;
    const path = n.path;
    const total = path.length;
    const fp = n.progress * total;
    const idx = Math.floor(fp) % total;
    const frac = fp - Math.floor(fp);
    const a = path[idx];
    const b = path[(idx + 1) % total];
    n.group.position.lerpVectors(a, b, frac);
    n.group.position.y = 0;
    const dir = tempVec.subVectors(b, a);
    if (dir.lengthSq() > 0.01) n.group.rotation.y = Math.atan2(dir.x, dir.z);
    // Bob walk
    n.group.position.y = Math.abs(Math.sin(n.progress * total * Math.PI * 2)) * 0.08;
  });
}

// ─── Smoke update ─────────────────────────────────────────────
function updateSmoke(dt, elapsed) {
  smokes.forEach(s => {
    if (rand() < s.rate * dt) spawnSmoke(s);
    s.particles.forEach((p, i) => {
      p.userData.life += dt;
      p.position.y += p.userData.vy;
      p.position.x += p.userData.vx;
      p.scale.setScalar(1 + p.userData.life * 0.5);
      p.material.opacity = Math.max(0, 0.4 * (1 - p.userData.life / p.userData.maxLife));
      if (p.userData.life > p.userData.maxLife) {
        scene.remove(p);
        s.particles.splice(i, 1);
      }
    });
  });
}

// ─── Flags ────────────────────────────────────────────────────
function updateFlags(elapsed) {
  flags.forEach(f => {
    f.mesh.rotation.y = Math.sin(elapsed * 2 + f.phase) * 0.2;
    f.mesh.scale.x = 1 + Math.sin(elapsed * 3 + f.phase) * 0.08;
  });
}

// ─── Birds ────────────────────────────────────────────────────
function updateBirds(elapsed, day) {
  const birdVis = day > 0.25 && day < 0.85 ? 1 : 0.2;
  birds.forEach(b => {
    const ud = b.userData;
    const angle = elapsed * ud.speed + ud.phase;
    b.position.x = Math.cos(angle) * ud.orbit;
    b.position.z = Math.sin(angle) * ud.orbit * 0.7;
    b.position.y = 18 + Math.sin(elapsed + ud.phase) * 5;
    b.rotation.y = angle + Math.PI / 2;
    b.visible = birdVis > 0.3;
    const wL = b.getObjectByName('wingL');
    const wR = b.getObjectByName('wingR');
    const flap = Math.sin(elapsed * 12 + ud.phase) * 0.5;
    if (wL) wL.rotation.z = flap;
    if (wR) wR.rotation.z = -flap;
  });
}

// ─── Market animation ─────────────────────────────────────────
function updateMarket(elapsed, day) {
  const active = day > 0.3 && day < 0.75;
  marketStalls.forEach((s, i) => {
    s.scale.y = active ? 1 : 0.95;
    s.children.forEach(c => {
      if (c.material && c.material.emissive) {
        c.material.emissiveIntensity = active ? 0.05 : 0;
      }
    });
  });
}

// ─── Main loop ────────────────────────────────────────────────
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const day = dayPhase(elapsed);
  updateDayNight(day, elapsed);
  updateCamera(dt, elapsed);
  updateNPCs(dt);
  updateSmoke(dt, elapsed);
  updateFlags(elapsed);
  updateBirds(elapsed, day);
  updateMarket(elapsed, day);

  animated.forEach(a => a.update(elapsed, day));

  renderer.render(scene, camera);
}

setLocation(tour[0].label, tour[0].timeLabel);
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
