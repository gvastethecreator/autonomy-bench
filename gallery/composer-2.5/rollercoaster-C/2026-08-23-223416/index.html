<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Velocity — First-Person Coaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
    background: radial-gradient(ellipse at 50% 40%, #1a1030 0%, #080810 70%);
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #overlay h1 {
    font-size: clamp(1.8rem, 5vw, 3.2rem); font-weight: 300; letter-spacing: 0.35em;
    text-transform: uppercase; color: #e8d5ff; text-shadow: 0 0 40px rgba(180,120,255,0.5);
    margin-bottom: 0.5rem;
  }
  #overlay p { color: rgba(200,180,230,0.6); font-size: 0.85rem; letter-spacing: 0.15em; margin-bottom: 2rem; }
  #overlay .bar-wrap { width: 220px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  #overlay .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #7b4dff, #ff6ec7); transition: width 0.3s; }
  #hud {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 32px; align-items: center; z-index: 5;
    pointer-events: none; opacity: 0; transition: opacity 1s 0.5s;
  }
  #hud.visible { opacity: 1; }
  .hud-item { text-align: center; }
  .hud-label { font-size: 0.6rem; letter-spacing: 0.2em; color: rgba(200,180,255,0.45); text-transform: uppercase; }
  .hud-value { font-size: 1.1rem; font-weight: 200; color: rgba(230,210,255,0.85); font-variant-numeric: tabular-nums; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
  }
  #speed-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: rgba(255,200,255,0); transition: background 0.08s;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>Midnight Velocity</h1>
  <p>Continuous first-person ride</p>
  <div class="bar-wrap"><div class="bar" id="loadBar"></div></div>
</div>
<div id="vignette"></div>
<div id="speed-flash"></div>
<div id="hud">
  <div class="hud-item"><div class="hud-label">Speed</div><div class="hud-value" id="speedVal">0</div></div>
  <div class="hud-item"><div class="hud-label">Altitude</div><div class="hud-value" id="altVal">0</div></div>
  <div class="hud-item"><div class="hud-label">G-Force</div><div class="hud-value" id="gVal">1.0</div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Track control points — dramatic pacing: climb, drop, loop, corkscrew, finale ───
const TRACK_POINTS = [
  new THREE.Vector3(0, 8, 0),
  new THREE.Vector3(30, 12, -20),
  new THREE.Vector3(60, 35, -40),
  new THREE.Vector3(90, 55, -30),
  new THREE.Vector3(110, 48, 0),
  new THREE.Vector3(100, 18, 40),
  new THREE.Vector3(70, 5, 70),
  new THREE.Vector3(40, 22, 90),
  new THREE.Vector3(10, 45, 80),
  new THREE.Vector3(-20, 60, 50),
  new THREE.Vector3(-50, 52, 20),
  new THREE.Vector3(-70, 30, -10),
  new THREE.Vector3(-80, 15, -40),
  new THREE.Vector3(-60, 8, -70),
  new THREE.Vector3(-30, 20, -90),
  new THREE.Vector3(0, 42, -80),
  new THREE.Vector3(35, 58, -60),
  new THREE.Vector3(65, 50, -35),
  new THREE.Vector3(85, 28, -5),
  new THREE.Vector3(75, 12, 25),
  new THREE.Vector3(50, 6, 45),
  new THREE.Vector3(20, 10, 35),
  new THREE.Vector3(0, 8, 0),
];

const curve = new THREE.CatmullRomCurve3(TRACK_POINTS, true, 'catmullrom', 0.4);
const TRACK_LENGTH = curve.getLength();
const SEGMENTS = 800;

// ─── Scene setup ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0818);
scene.fog = new THREE.FogExp2(0x120a20, 0.0045);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 0.82);
composer.addPass(bloomPass);

// ─── Lighting — twilight carnival atmosphere ───
const ambient = new THREE.AmbientLight(0x3a2860, 0.45);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0xaabbff, 0.55);
moonLight.position.set(-80, 120, -60);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 10;
moonLight.shadow.camera.far = 300;
moonLight.shadow.camera.left = moonLight.shadow.camera.bottom = -120;
moonLight.shadow.camera.right = moonLight.shadow.camera.top = 120;
scene.add(moonLight);

const rimLight = new THREE.DirectionalLight(0xff8866, 0.25);
rimLight.position.set(60, 40, 80);
scene.add(rimLight);

// Track accent lights along curve
const accentColors = [0x7b4dff, 0xff6ec7, 0x44ddff, 0xffaa44];
for (let i = 0; i < 24; i++) {
  const t = i / 24;
  const pos = curve.getPointAt(t);
  const light = new THREE.PointLight(accentColors[i % accentColors.length], 2.5, 45, 2);
  light.position.copy(pos).add(new THREE.Vector3(0, 3, 0));
  scene.add(light);
}

// ─── Build track geometry ───
function buildTrack() {
  const group = new THREE.Group();
  const railMat = new THREE.MeshStandardMaterial({
    color: 0x8899bb, metalness: 0.85, roughness: 0.25,
  });
  const tieMat = new THREE.MeshStandardMaterial({
    color: 0x2a2035, metalness: 0.3, roughness: 0.7,
  });
  const spineMat = new THREE.MeshStandardMaterial({
    color: 0x5544aa, metalness: 0.6, roughness: 0.4, emissive: 0x221144, emissiveIntensity: 0.3,
  });

  const railRadius = 0.12;
  const railSpacing = 1.1;
  const tieWidth = 2.8;
  const tieDepth = 0.15;
  const tieHeight = 0.12;

  const frames = curve.computeFrenetFrames(SEGMENTS, true);
  const positions = curve.getSpacedPoints(SEGMENTS);

  // Rails — tubular extrusion along offset curves
  function makeRail(offset) {
    const pts = [];
    for (let i = 0; i <= SEGMENTS; i++) {
      const p = positions[i];
      const N = frames.normals[i];
      const B = frames.binormals[i];
      pts.push(p.clone().add(N.clone().multiplyScalar(offset)));
    }
    const railCurve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.4);
    const geo = new THREE.TubeGeometry(railCurve, SEGMENTS, railRadius, 8, true);
    return new THREE.Mesh(geo, railMat);
  }

  group.add(makeRail(railSpacing / 2));
  group.add(makeRail(-railSpacing / 2));

  // Ties
  const tieGeo = new THREE.BoxGeometry(tieWidth, tieHeight, tieDepth);
  for (let i = 0; i <= SEGMENTS; i += 3) {
    const p = positions[i];
    const T = frames.tangents[i];
    const N = frames.normals[i];
    const tie = new THREE.Mesh(tieGeo, tieMat);
    tie.position.copy(p);
    const m = new THREE.Matrix4();
    m.makeBasis(N, new THREE.Vector3(0, 1, 0), T);
    tie.setRotationFromMatrix(m);
    tie.castShadow = true;
    tie.receiveShadow = true;
    group.add(tie);
  }

  // Spine glow tube
  const spinePts = positions.slice();
  const spineCurve = new THREE.CatmullRomCurve3(spinePts, true, 'catmullrom', 0.4);
  const spineGeo = new THREE.TubeGeometry(spineCurve, SEGMENTS, 0.06, 6, true);
  group.add(new THREE.Mesh(spineGeo, spineMat));

  return group;
}

// ─── Support pillars ───
function buildSupports() {
  const group = new THREE.Group();
  const pillarMat = new THREE.MeshStandardMaterial({
    color: 0x1a1528, metalness: 0.5, roughness: 0.6,
  });
  const braceMat = new THREE.MeshStandardMaterial({
    color: 0x332255, metalness: 0.4, roughness: 0.5,
  });

  for (let i = 0; i <= SEGMENTS; i += 12) {
    const t = i / SEGMENTS;
    const p = curve.getPointAt(t);
    if (p.y < 14) {
      const height = p.y - 0.5;
      if (height > 2) {
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.5, height, 8),
          pillarMat
        );
        pillar.position.set(p.x, height / 2, p.z);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        group.add(pillar);

        // Cross brace
        const brace = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.8), braceMat);
        brace.position.set(p.x, height * 0.7, p.z);
        brace.rotation.y = Math.random() * Math.PI;
        group.add(brace);
      }
    }
  }
  return group;
}

// ─── Ground terrain ───
function buildTerrain() {
  const geo = new THREE.PlaneGeometry(500, 500, 80, 80);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const h = Math.sin(x * 0.02) * Math.cos(y * 0.018) * 4
            + Math.sin(x * 0.05 + y * 0.03) * 2
            + (Math.random() - 0.5) * 0.8;
    pos.setZ(i, h);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: 0x0e0a18, roughness: 0.95, metalness: 0.05,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = -0.5;
  mesh.receiveShadow = true;
  return mesh;
}

// ─── Decorative trees ───
function buildTrees() {
  const group = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1020, roughness: 0.9 });
  const foliageMat = new THREE.MeshStandardMaterial({
    color: 0x152515, roughness: 0.85, emissive: 0x081008, emissiveIntensity: 0.2,
  });

  for (let i = 0; i < 180; i++) {
    const x = (Math.random() - 0.5) * 400;
    const z = (Math.random() - 0.5) * 400;
    const dist = Math.sqrt(x * x + z * z);
    if (dist < 25 || dist > 190) continue;

    const scale = 0.6 + Math.random() * 1.8;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * scale, 0.25 * scale, 2 * scale, 6), trunkMat);
    const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.2 * scale, 3.5 * scale, 7), foliageMat);
    trunk.position.set(x, scale, z);
    foliage.position.set(x, 2.2 * scale, z);
    trunk.castShadow = true;
    group.add(trunk, foliage);
  }
  return group;
}

// ─── Distant city glow ───
function buildSkyline() {
  const group = new THREE.Group();
  const buildingMat = new THREE.MeshStandardMaterial({
    color: 0x120818, emissive: 0x331155, emissiveIntensity: 0.4, roughness: 0.8,
  });
  for (let i = 0; i < 40; i++) {
    const w = 4 + Math.random() * 12;
    const h = 15 + Math.random() * 45;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), buildingMat);
    const angle = (i / 40) * Math.PI * 2;
    const r = 180 + Math.random() * 40;
    b.position.set(Math.cos(angle) * r, h / 2 - 5, Math.sin(angle) * r);
    group.add(b);

    // Window lights
    if (Math.random() > 0.4) {
      const win = new THREE.PointLight(0xffaa66, 0.8, 20, 2);
      win.position.copy(b.position);
      win.position.y += h * 0.2;
      scene.add(win);
    }
  }
  return group;
}

// ─── Starfield ───
function buildStars() {
  const count = 3000;
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 250 + Math.random() * 100;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.45;
    arr[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    arr[i * 3 + 1] = r * Math.cos(phi) + 30;
    arr[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const mat = new THREE.PointsMaterial({ color: 0xdddfff, size: 0.6, transparent: true, opacity: 0.7, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}

// ─── Assemble scene ───
const loadBar = document.getElementById('loadBar');
loadBar.style.width = '30%';

scene.add(buildTrack());
loadBar.style.width = '50%';
scene.add(buildSupports());
scene.add(buildTerrain());
scene.add(buildTrees());
scene.add(buildSkyline());
scene.add(buildStars());

// Moon mesh
const moonGeo = new THREE.SphereGeometry(8, 32, 32);
const moonMat = new THREE.MeshBasicMaterial({ color: 0xe8e0ff });
const moon = new THREE.Mesh(moonGeo, moonMat);
moon.position.set(-100, 90, -120);
scene.add(moon);

// Moon halo
const haloGeo = new THREE.SphereGeometry(12, 32, 32);
const haloMat = new THREE.MeshBasicMaterial({ color: 0x8866cc, transparent: true, opacity: 0.08 });
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.position.copy(moon.position);
scene.add(halo);

loadBar.style.width = '100%';

// ─── Ride physics — energy-conserving speed model ───
const GRAVITY = 9.81;
const FRICTION = 0.12;
const MIN_SPEED = 8;
const MAX_SPEED = 55;
const BASE_ENERGY = GRAVITY * 60 + 0.5 * MAX_SPEED * MAX_SPEED;

let rideT = 0;
let rideSpeed = 18;
let prevSpeed = rideSpeed;
let prevCamPos = new THREE.Vector3();
let prevCamQuat = new THREE.Quaternion();
const camOffset = new THREE.Vector3(0, 0.35, 0);
const lookAhead = 0.008;

const frames = curve.computeFrenetFrames(SEGMENTS, true);

function getHeightAt(t) {
  return curve.getPointAt(t % 1).y;
}

function updateSpeed(dt) {
  const h = getHeightAt(rideT);
  const potential = GRAVITY * h;
  const targetKin = Math.max(BASE_ENERGY - potential, 0.5 * MIN_SPEED * MIN_SPEED);
  let targetSpeed = Math.sqrt(2 * targetKin);

  // Boost through low sections for pacing
  if (h < 15) targetSpeed = Math.max(targetSpeed, 22);

  targetSpeed = THREE.MathUtils.clamp(targetSpeed, MIN_SPEED, MAX_SPEED);
  rideSpeed += (targetSpeed - rideSpeed) * (1 - Math.pow(FRICTION, dt * 60));
  rideT += (rideSpeed * dt) / TRACK_LENGTH;
  if (rideT >= 1) rideT -= 1;
}

function updateCamera(dt) {
  const t = rideT % 1;
  const pos = curve.getPointAt(t);
  const lookT = (t + lookAhead) % 1;

  const T = curve.getTangentAt(t).normalize();
  const Tlook = curve.getTangentAt(lookT).normalize();

  // Banking from curvature
  const idx = Math.floor(t * SEGMENTS) % SEGMENTS;
  const N = frames.normals[idx];
  const B = frames.binormals[idx];

  // Compute banking angle from lateral acceleration estimate
  const nextIdx = (idx + 2) % SEGMENTS;
  const curvature = frames.tangents[idx].angleTo(frames.tangents[nextIdx]) * 60;
  const bankAngle = THREE.MathUtils.clamp(curvature * rideSpeed * 0.015, -0.6, 0.6);

  camera.position.copy(pos).add(camOffset);
  camera.position.add(N.clone().multiplyScalar(Math.sin(bankAngle) * 0.3));

  const target = pos.clone().add(Tlook.clone().multiplyScalar(12)).add(new THREE.Vector3(0, 0.2, 0));
  camera.lookAt(target);

  // Roll from banking
  camera.rotateZ(-bankAngle * 0.85);

  // Dynamic FOV on speed
  const speedRatio = (rideSpeed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED);
  camera.fov = THREE.MathUtils.lerp(72, 88, speedRatio * speedRatio);
  camera.updateProjectionMatrix();

  // G-force estimate from speed change + curvature
  const accel = (rideSpeed - prevSpeed) / Math.max(dt, 0.001);
  const gForce = 1 + Math.abs(accel) * 0.04 + curvature * 0.8;
  document.getElementById('gVal').textContent = gForce.toFixed(1);
  document.getElementById('speedVal').textContent = Math.round(rideSpeed * 3.6);
  document.getElementById('altVal').textContent = Math.round(pos.y);

  // Speed flash on drops
  const dropRate = (rideSpeed - prevSpeed) / dt;
  const flash = document.getElementById('speed-flash');
  if (dropRate > 15) {
    flash.style.background = `rgba(180,100,255,${Math.min(dropRate * 0.004, 0.12)})`;
  } else {
    flash.style.background = 'rgba(255,200,255,0)';
  }

  prevSpeed = rideSpeed;
}

// ─── Particle wind streaks ───
const streakCount = 200;
const streakGeo = new THREE.BufferGeometry();
const streakPos = new Float32Array(streakCount * 6);
streakGeo.setAttribute('position', new THREE.BufferAttribute(streakPos, 3));
const streakMat = new THREE.LineBasicMaterial({ color: 0xaa88ff, transparent: true, opacity: 0.15 });
const streaks = new THREE.LineSegments(streakGeo, streakMat);
scene.add(streaks);

function updateStreaks() {
  const arr = streakGeo.attributes.position.array;
  for (let i = 0; i < streakCount; i++) {
    const speedFactor = rideSpeed / MAX_SPEED;
    const ox = (Math.random() - 0.5) * 30;
    const oy = (Math.random() - 0.5) * 20;
    const oz = -Math.random() * 15 * speedFactor - 2;
    const len = 0.5 + speedFactor * 3;
    const base = i * 6;
    arr[base] = ox; arr[base + 1] = oy; arr[base + 2] = oz;
    arr[base + 3] = ox; arr[base + 4] = oy; arr[base + 5] = oz + len;
  }
  streakGeo.attributes.position.needsUpdate = true;
  streakMat.opacity = 0.05 + (rideSpeed / MAX_SPEED) * 0.25;
}

// ─── Subtle camera shake on high G ───
function applyShake(dt) {
  const idx = Math.floor(rideT * SEGMENTS) % SEGMENTS;
  const curvature = frames.tangents[idx].angleTo(frames.tangents[(idx + 2) % SEGMENTS]) * 60;
  const shake = curvature * rideSpeed * 0.0003;
  if (shake > 0.002) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake * 0.5;
  }
}

// ─── Animation loop ───
let started = false;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (started) {
    updateSpeed(dt);
    updateCamera(dt);
    updateStreaks();
    applyShake(dt);

    // Gentle moon drift
    moon.position.x += Math.sin(clock.elapsedTime * 0.05) * 0.002;
    halo.position.copy(moon.position);

    // Fog breathing
    scene.fog.density = 0.004 + Math.sin(clock.elapsedTime * 0.3) * 0.0005;
  }

  composer.render();
}

// ─── Start sequence ───
setTimeout(() => {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('hud').classList.add('visible');
  started = true;
  clock.start();
}, 1800);

animate();

// ─── Resize ───
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.resolution.set(innerWidth, innerHeight);
});
</script>
</body>
</html>
