<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniature Solar System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #030308;
      --panel: rgba(8, 12, 24, 0.72);
      --border: rgba(120, 160, 255, 0.18);
      --text: #e8edf8;
      --muted: rgba(200, 210, 240, 0.55);
      --accent: #7eb8ff;
      --glow: rgba(126, 184, 255, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--text);
    }

    canvas { display: block; }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 50%, transparent 0%, rgba(3, 3, 8, 0.15) 70%, rgba(3, 3, 8, 0.55) 100%),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
      z-index: 2;
    }

    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: radial-gradient(ellipse at center, #0a0e1a 0%, #030308 70%);
      transition: opacity 1.4s ease, visibility 1.4s ease;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      background: linear-gradient(135deg, #fff 0%, #7eb8ff 50%, #ffd080 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #intro p {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-bottom: 2.5rem;
    }

    #intro button {
      pointer-events: auto;
      padding: 0.85rem 2.4rem;
      border: 1px solid var(--border);
      background: rgba(20, 30, 60, 0.6);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }

    #intro button:hover {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--glow);
      transform: translateY(-2px);
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.4rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
    }

    #hud.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .brand {
      pointer-events: auto;
    }

    .brand h2 {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .brand span {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    #info-panel {
      pointer-events: auto;
      width: min(320px, 42vw);
      padding: 1.2rem 1.4rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      transition: border-color 0.4s;
    }

    #info-panel:focus-within { border-color: rgba(126, 184, 255, 0.35); }

    #planet-name {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.15rem;
      transition: color 0.4s;
    }

    #planet-type {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.8rem;
    }

    #planet-desc {
      font-size: 0.88rem;
      line-height: 1.55;
      color: rgba(220, 228, 250, 0.78);
      margin-bottom: 1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      font-size: 0.78rem;
    }

    .stat-label { color: var(--muted); letter-spacing: 0.06em; }
    .stat-value { color: var(--text); font-weight: 500; text-align: right; }

    #planet-nav {
      position: fixed;
      bottom: 1.6rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 5;
      display: flex;
      gap: 0.45rem;
      padding: 0.5rem 0.7rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(20px);
      pointer-events: auto;
      opacity: 0;
      transition: opacity 1s ease 0.7s, transform 1s ease 0.7s;
      max-width: calc(100vw - 2rem);
      overflow-x: auto;
      scrollbar-width: none;
    }

    #planet-nav::-webkit-scrollbar { display: none; }

    #planet-nav.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .nav-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      position: relative;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    .nav-btn:hover { transform: scale(1.12); border-color: var(--border); }
    .nav-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
      transform: scale(1.15);
    }

    .nav-btn .dot {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
    }

    .nav-btn[data-id="sun"] .dot {
      background: radial-gradient(circle, #fff8e0 0%, #ffb830 40%, #ff6010 100%);
      box-shadow: 0 0 10px #ffb830;
    }

    #hint {
      position: fixed;
      bottom: 5.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 4;
      opacity: 0;
      transition: opacity 1s ease 1s;
      pointer-events: none;
    }

    #hint.visible { opacity: 1; }

    #time-control {
      position: fixed;
      bottom: 1.6rem;
      right: 1.6rem;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      opacity: 0;
      transition: opacity 1s ease 0.8s;
      pointer-events: auto;
    }

    #time-control.visible { opacity: 1; }

    #time-control label {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #speed-slider {
      width: 120px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    #speed-val {
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="intro">
    <h1>Solar System</h1>
    <p>A miniature voyage through our cosmic neighborhood</p>
    <button id="enter-btn">Enter Orbit</button>
  </div>

  <div id="hud">
    <div class="brand">
      <h2>Observatory</h2>
      <span id="view-label">Overview</span>
    </div>
    <div id="info-panel">
      <div id="planet-name">Overview</div>
      <div id="planet-type">System View</div>
      <div id="planet-desc">Drag to orbit. Scroll to zoom. Select a world below to fly closer and learn its story.</div>
      <div class="stats" id="stats" style="display:none">
        <span class="stat-label">Diameter</span><span class="stat-value" id="stat-diam">—</span>
        <span class="stat-label">Orbit</span><span class="stat-value" id="stat-orbit">—</span>
        <span class="stat-label">Day</span><span class="stat-value" id="stat-day">—</span>
        <span class="stat-label">Moons</span><span class="stat-value" id="stat-moons">—</span>
      </div>
    </div>
  </div>

  <nav id="planet-nav"></nav>
  <div id="hint" class="">Drag · Scroll · Click worlds</div>

  <div id="time-control">
    <label>Time Flow</label>
    <input type="range" id="speed-slider" min="0" max="100" value="35" />
    <span id="speed-val">1.0×</span>
  </div>

  <div id="overlay"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const PLANETS = [
      {
        id: 'mercury', name: 'Mercury', type: 'Terrestrial Planet',
        color: 0x9a9588, emissive: 0x1a1815, size: 0.38, orbit: 5.8, speed: 4.15,
        tilt: 0.03, desc: 'The swift messenger — a scorched, cratered world closest to the Sun, where days blaze and nights freeze.',
        diam: '4,879 km', orbitPeriod: '88 Earth days', dayLength: '59 Earth days', moons: '0'
      },
      {
        id: 'venus', name: 'Venus', type: 'Terrestrial Planet',
        color: 0xe8c88a, emissive: 0x2a2010, size: 0.95, orbit: 8.2, speed: 1.62,
        tilt: 2.6, desc: 'Veiled in sulfuric clouds, Venus spins backward beneath a crushing atmosphere hotter than Mercury\'s surface.',
        diam: '12,104 km', orbitPeriod: '225 Earth days', dayLength: '243 Earth days', moons: '0'
      },
      {
        id: 'earth', name: 'Earth', type: 'Terrestrial Planet',
        color: 0x4a90c8, emissive: 0x0a1828, size: 1.0, orbit: 11.5, speed: 1.0,
        tilt: 0.41, hasClouds: true, cloudColor: 0xffffff, moon: { size: 0.27, orbit: 1.8, speed: 13 },
        desc: 'Our blue oasis — the only known harbor of life, wrapped in nitrogen, oxygen, and liquid water.',
        diam: '12,742 km', orbitPeriod: '365 days', dayLength: '24 hours', moons: '1'
      },
      {
        id: 'mars', name: 'Mars', type: 'Terrestrial Planet',
        color: 0xc45c3a, emissive: 0x1a0805, size: 0.53, orbit: 15.5, speed: 0.53,
        tilt: 0.44, desc: 'The rust-red desert world — home to Olympus Mons and whispered dreams of ancient rivers.',
        diam: '6,779 km', orbitPeriod: '687 Earth days', dayLength: '24.6 hours', moons: '2'
      },
      {
        id: 'jupiter', name: 'Jupiter', type: 'Gas Giant',
        color: 0xd4a574, emissive: 0x151008, size: 2.8, orbit: 24, speed: 0.084,
        tilt: 0.05, bands: true,
        moons: [{ size: 0.12, orbit: 3.2, speed: 8 }, { size: 0.11, orbit: 4.1, speed: 6 }],
        desc: 'King of planets — a storm-wreathed colossus whose Great Red Spot has raged for centuries.',
        diam: '139,820 km', orbitPeriod: '12 Earth years', dayLength: '9.9 hours', moons: '95+'
      },
      {
        id: 'saturn', name: 'Saturn', type: 'Gas Giant',
        color: 0xe8d4a8, emissive: 0x181510, size: 2.35, orbit: 32, speed: 0.034,
        tilt: 0.47, rings: true,
        desc: 'Jewel of the solar system — golden bands and icy rings cast in perpetual twilight.',
        diam: '116,460 km', orbitPeriod: '29 Earth years', dayLength: '10.7 hours', moons: '146+'
      },
      {
        id: 'uranus', name: 'Uranus', type: 'Ice Giant',
        color: 0x8ec8d8, emissive: 0x081820, size: 1.6, orbit: 40, speed: 0.012,
        tilt: 1.71, desc: 'The sideways giant — a cyan ice world rolling on its side through the outer dark.',
        diam: '50,724 km', orbitPeriod: '84 Earth years', dayLength: '17 hours', moons: '28'
      },
      {
        id: 'neptune', name: 'Neptune', type: 'Ice Giant',
        color: 0x4060c8, emissive: 0x080818, size: 1.55, orbit: 47, speed: 0.006,
        tilt: 0.49, desc: 'Deep azure and winds faster than sound — the farthest full planet, guardian of the edge.',
        diam: '49,244 km', orbitPeriod: '165 Earth years', dayLength: '16 hours', moons: '16'
      }
    ];

    const OVERVIEW = {
      name: 'Overview', type: 'System View',
      desc: 'Drag to orbit. Scroll to zoom. Select a world below to fly closer and learn its story.',
      color: '#7eb8ff'
    };

    let started = false;
    let timeSpeed = 1;
    let selectedId = 'overview';
    let focusTarget = null;
    let focusProgress = 1;
    const focusFrom = new THREE.Vector3();
    const focusTo = new THREE.Vector3();
    const lookFrom = new THREE.Vector3();
    const lookTo = new THREE.Vector3(0, 0, 0);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030308, 0.0012);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 45, 75);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.prepend(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.45, 0.15);
    composer.addPass(bloomPass);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 8;
    controls.maxDistance = 180;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.25;
    controls.target.set(0, 0, 0);

    const sunGroup = new THREE.Group();
    scene.add(sunGroup);

    const sunCore = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0xffeecc })
    );
    sunGroup.add(sunCore);

    const sunGlow = new THREE.Mesh(
      new THREE.SphereGeometry(2.6, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.35 })
    );
    sunGroup.add(sunGlow);

    const coronaMat = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 0 },
        color1: { value: new THREE.Color(0xff6600) },
        color2: { value: new THREE.Color(0xffcc44) }
      },
      vertexShader: `
        varying vec3 vNormal;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform vec3 color1;
        uniform vec3 color2;
        varying vec3 vNormal;
        void main() {
          float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
          float pulse = 0.85 + 0.15 * sin(time * 2.0);
          vec3 col = mix(color1, color2, intensity);
          gl_FragColor = vec4(col, intensity * pulse * 0.7);
        }
      `,
      transparent: true,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const corona = new THREE.Mesh(new THREE.SphereGeometry(3.2, 32, 32), coronaMat);
    sunGroup.add(corona);

    const sunLight = new THREE.PointLight(0xfff0d0, 3.5, 300, 1.2);
    sunGroup.add(sunLight);

    const ambient = new THREE.AmbientLight(0x1a2040, 0.35);
    scene.add(ambient);

    const planetMeshes = {};
    const orbitGroups = {};

    function createOrbitRing(radius) {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.25 });
      return new THREE.Line(geo, mat);
    }

    function createPlanetMesh(data) {
      const geo = new THREE.SphereGeometry(data.size, 48, 48);
      let mat;

      if (data.bands) {
        mat = new THREE.MeshStandardMaterial({
          color: data.color,
          emissive: data.emissive,
          emissiveIntensity: 0.15,
          roughness: 0.85,
          metalness: 0.05
        });
      } else {
        mat = new THREE.MeshStandardMaterial({
          color: data.color,
          emissive: data.emissive,
          emissiveIntensity: 0.2,
          roughness: 0.75,
          metalness: 0.08
        });
      }

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.z = data.tilt || 0;

      const group = new THREE.Group();
      group.add(mesh);

      if (data.hasClouds) {
        const cloudGeo = new THREE.SphereGeometry(data.size * 1.02, 32, 32);
        const cloudMat = new THREE.MeshStandardMaterial({
          color: data.cloudColor,
          transparent: true,
          opacity: 0.35,
          roughness: 1,
          depthWrite: false
        });
        const clouds = new THREE.Mesh(cloudGeo, cloudMat);
        group.add(clouds);
        group.userData.clouds = clouds;
      }

      if (data.rings) {
        const ringGeo = new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xc8b898,
          transparent: true,
          opacity: 0.55,
          side: THREE.DoubleSide
        });
        const rings = new THREE.Mesh(ringGeo, ringMat);
        rings.rotation.x = Math.PI / 2 + 0.15;
        group.add(rings);
      }

      if (data.moon) {
        const moonGroup = new THREE.Group();
        const moonMesh = new THREE.Mesh(
          new THREE.SphereGeometry(data.moon.size, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 })
        );
        moonGroup.add(moonMesh);
        moonGroup.userData.orbit = data.moon.orbit;
        moonGroup.userData.speed = data.moon.speed;
        group.add(moonGroup);
        group.userData.moons = [moonGroup];
      }

      if (data.moons) {
        group.userData.moons = data.moons.map(m => {
          const mg = new THREE.Group();
          const mm = new THREE.Mesh(
            new THREE.SphereGeometry(m.size, 12, 12),
            new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.85 })
          );
          mg.add(mm);
          mg.userData.orbit = m.orbit;
          mg.userData.speed = m.speed;
          group.add(mg);
          return mg;
        });
      }

      return group;
    }

    PLANETS.forEach(p => {
      const orbitGroup = new THREE.Group();
      const planetGroup = createPlanetMesh(p);
      planetGroup.position.x = p.orbit;
      orbitGroup.add(planetGroup);

      const orbitLine = createOrbitRing(p.orbit);
      scene.add(orbitLine);

      scene.add(orbitGroup);
      orbitGroups[p.id] = orbitGroup;
      planetMeshes[p.id] = { group: planetGroup, data: p, orbitGroup };
    });

    const asteroidCount = 800;
    const asteroidGeo = new THREE.BufferGeometry();
    const asteroidPositions = new Float32Array(asteroidCount * 3);
    const asteroidColors = new Float32Array(asteroidCount * 3);
    for (let i = 0; i < asteroidCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = 17.5 + Math.random() * 2.5;
      const y = (Math.random() - 0.5) * 0.8;
      asteroidPositions[i * 3] = Math.cos(angle) * r;
      asteroidPositions[i * 3 + 1] = y;
      asteroidPositions[i * 3 + 2] = Math.sin(angle) * r;
      const c = 0.4 + Math.random() * 0.3;
      asteroidColors[i * 3] = c;
      asteroidColors[i * 3 + 1] = c * 0.85;
      asteroidColors[i * 3 + 2] = c * 0.7;
    }
    asteroidGeo.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
    asteroidGeo.setAttribute('color', new THREE.BufferAttribute(asteroidColors, 3));
    const asteroids = new THREE.Points(asteroidGeo, new THREE.PointsMaterial({
      size: 0.12, vertexColors: true, transparent: true, opacity: 0.7, sizeAttenuation: true
    }));
    scene.add(asteroids);

    const starLayers = [];
    [1200, 800, 400].forEach((count, layer) => {
      const positions = new Float32Array(count * 3);
      const radius = 400 + layer * 80;
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = radius * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const opacity = 0.5 + layer * 0.15;
      const size = 0.6 + layer * 0.3;
      const stars = new THREE.Points(geo, new THREE.PointsMaterial({
        color: layer === 0 ? 0xffffff : layer === 1 ? 0xd0e0ff : 0xffe0c0,
        size, transparent: true, opacity, sizeAttenuation: true
      }));
      scene.add(stars);
      starLayers.push({ mesh: stars, speed: 0.00005 * (layer + 1) });
    });

    const nav = document.getElementById('planet-nav');
    const allNavItems = [{ id: 'overview', name: 'Overview', color: '#7eb8ff' }, ...PLANETS.map(p => ({ id: p.id, name: p.name, color: '#' + p.color.toString(16).padStart(6, '0') }))];

    allNavItems.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (item.id === 'overview' ? ' active' : '');
      btn.dataset.id = item.id;
      btn.title = item.name;
      if (item.id === 'sun') {
        btn.innerHTML = '<span class="dot"></span>';
      } else if (item.id === 'overview') {
        btn.innerHTML = '<span class="dot" style="background:radial-gradient(circle,#7eb8ff,#3040a0);box-shadow:0 0 8px #7eb8ff"></span>';
      } else {
        btn.innerHTML = `<span class="dot" style="background:${item.color};box-shadow:0 0 6px ${item.color}"></span>`;
      }
      btn.addEventListener('click', () => selectPlanet(item.id));
      nav.appendChild(btn);
    });

    const sunBtn = document.createElement('button');
    sunBtn.className = 'nav-btn';
    sunBtn.dataset.id = 'sun';
    sunBtn.title = 'Sun';
    sunBtn.innerHTML = '<span class="dot"></span>';
    sunBtn.addEventListener('click', () => selectPlanet('sun'));
    nav.insertBefore(sunBtn, nav.children[1]);

    function updateInfo(id) {
      const nameEl = document.getElementById('planet-name');
      const typeEl = document.getElementById('planet-type');
      const descEl = document.getElementById('planet-desc');
      const statsEl = document.getElementById('stats');
      const viewLabel = document.getElementById('view-label');

      if (id === 'overview') {
        nameEl.textContent = OVERVIEW.name;
        typeEl.textContent = OVERVIEW.type;
        descEl.textContent = OVERVIEW.desc;
        statsEl.style.display = 'none';
        viewLabel.textContent = 'Overview';
        nameEl.style.color = OVERVIEW.color;
        return;
      }

      if (id === 'sun') {
        nameEl.textContent = 'The Sun';
        typeEl.textContent = 'G-type Main Sequence Star';
        descEl.textContent = 'Our star — a fusion furnace converting hydrogen into light, binding every planet in its gravitational embrace.';
        statsEl.style.display = 'grid';
        document.getElementById('stat-diam').textContent = '1.39M km';
        document.getElementById('stat-orbit').textContent = 'Galactic orbit';
        document.getElementById('stat-day').textContent = '27 Earth days';
        document.getElementById('stat-moons').textContent = '8 planets';
        viewLabel.textContent = 'The Sun';
        nameEl.style.color = '#ffb830';
        return;
      }

      const p = PLANETS.find(x => x.id === id);
      if (!p) return;
      nameEl.textContent = p.name;
      typeEl.textContent = p.type;
      descEl.textContent = p.desc;
      statsEl.style.display = 'grid';
      document.getElementById('stat-diam').textContent = p.diam;
      document.getElementById('stat-orbit').textContent = p.orbitPeriod;
      document.getElementById('stat-day').textContent = p.dayLength;
      document.getElementById('stat-moons').textContent = p.moons;
      viewLabel.textContent = p.name;
      nameEl.style.color = '#' + p.color.toString(16).padStart(6, '0');
    }

    function getFocusPosition(id) {
      if (id === 'overview') return new THREE.Vector3(0, 45, 75);
      if (id === 'sun') return new THREE.Vector3(0, 3, 10);
      const pm = planetMeshes[id];
      if (!pm) return camera.position.clone();
      const worldPos = new THREE.Vector3();
      pm.group.getWorldPosition(worldPos);
      const offset = pm.data.size * 4 + 3;
      return new THREE.Vector3(worldPos.x + offset * 0.5, worldPos.y + offset * 0.35, worldPos.z + offset);
    }

    function getLookTarget(id) {
      if (id === 'overview') return new THREE.Vector3(0, 0, 0);
      if (id === 'sun') return new THREE.Vector3(0, 0, 0);
      const pm = planetMeshes[id];
      if (!pm) return new THREE.Vector3(0, 0, 0);
      const worldPos = new THREE.Vector3();
      pm.group.getWorldPosition(worldPos);
      return worldPos;
    }

    function selectPlanet(id) {
      if (!started) return;
      selectedId = id;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
      updateInfo(id);

      focusFrom.copy(camera.position);
      lookFrom.copy(controls.target);
      focusTo.copy(getFocusPosition(id));
      lookTo.copy(getLookTarget(id));
      focusProgress = 0;

      controls.autoRotate = id === 'overview';
    }

    document.getElementById('enter-btn').addEventListener('click', () => {
      started = true;
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('hud').classList.add('visible');
      document.getElementById('planet-nav').classList.add('visible');
      document.getElementById('hint').classList.add('visible');
      document.getElementById('time-control').classList.add('visible');
    });

    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    speedSlider.addEventListener('input', () => {
      const t = speedSlider.value / 35;
      timeSpeed = t;
      speedVal.textContent = t.toFixed(1) + '×';
    });

    let elapsed = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      elapsed += dt;

      if (started) {
        coronaMat.uniforms.time.value = elapsed;

        PLANETS.forEach(p => {
          const og = orbitGroups[p.id];
          og.rotation.y += p.speed * 0.08 * timeSpeed * dt;

          const pg = planetMeshes[p.id].group;
          pg.rotation.y += 0.5 * dt * timeSpeed;

          if (pg.userData.clouds) {
            pg.userData.clouds.rotation.y += 0.15 * dt * timeSpeed;
          }

          if (pg.userData.moons) {
            pg.userData.moons.forEach(m => {
              const a = elapsed * m.userData.speed * 0.3 * timeSpeed;
              m.position.set(
                Math.cos(a) * m.userData.orbit,
                0,
                Math.sin(a) * m.userData.orbit
              );
            });
          }
        });

        asteroids.rotation.y += 0.015 * timeSpeed * dt;
        sunGroup.rotation.y += 0.05 * dt;

        starLayers.forEach(s => {
          s.mesh.rotation.y += s.speed * timeSpeed;
        });

        if (focusProgress < 1) {
          focusProgress = Math.min(1, focusProgress + dt * 0.8);
          const ease = 1 - Math.pow(1 - focusProgress, 3);
          camera.position.lerpVectors(focusFrom, focusTo, ease);
          controls.target.lerpVectors(lookFrom, lookTo, ease);
        } else if (selectedId !== 'overview' && selectedId !== 'sun') {
          const newFocus = getFocusPosition(selectedId);
          const newLook = getLookTarget(selectedId);
          camera.position.lerp(newFocus, 0.02);
          controls.target.lerp(newLook, 0.04);
        }

        sunCore.scale.setScalar(1 + Math.sin(elapsed * 1.5) * 0.015);
        sunGlow.scale.setScalar(1 + Math.sin(elapsed * 2) * 0.02);
      }

      controls.update();
      composer.render();
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.resolution.set(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
