<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observatory Clock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #d4a853;
    --gold-bright: #f0d080;
    --gold-dim: #8a6a2a;
    --brass: #b8924a;
    --face: #0e1220;
    --face-inner: #141a2e;
    --tick: rgba(212, 168, 83, 0.35);
    --tick-major: rgba(212, 168, 83, 0.7);
    --glow: rgba(212, 168, 83, 0.4);
    --text: #e8dcc8;
    --text-dim: rgba(232, 220, 200, 0.45);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #060810;
    transition: background 8s ease;
  }

  /* Ambient sky gradient — shifts with time of day */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%,
      var(--sky-mid, #0a1020) 0%,
      var(--sky-deep, #060810) 70%);
    transition: --sky-mid 8s ease, --sky-deep 8s ease;
  }

  .sky::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  /* Star field canvas */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Aurora shimmer */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 12s ease;
    background:
      radial-gradient(ellipse 60% 40% at 30% 20%, rgba(80, 120, 200, 0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 70% 25%, rgba(120, 80, 180, 0.06) 0%, transparent 70%);
    animation: aurora-drift 20s ease-in-out infinite alternate;
  }

  .aurora.visible { opacity: 1; }

  @keyframes aurora-drift {
    0%   { transform: translateX(-2%) translateY(0); }
    100% { transform: translateX(2%) translateY(-1%); }
  }

  /* Main layout */
  .stage {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 2rem;
    animation: stage-in 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes stage-in {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Clock housing */
  .housing {
    position: relative;
    width: min(72vw, 420px);
    height: min(72vw, 420px);
    filter: drop-shadow(0 0 60px rgba(212, 168, 83, 0.12))
            drop-shadow(0 20px 60px rgba(0, 0, 0, 0.6));
  }

  /* Outer ring — brass bezel */
  .bezel {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 200deg,
      #6a5020 0deg,
      var(--gold) 60deg,
      var(--gold-bright) 120deg,
      var(--brass) 180deg,
      #5a4018 240deg,
      var(--gold-dim) 300deg,
      #6a5020 360deg
    );
    padding: 5px;
    box-shadow:
      inset 0 2px 4px rgba(255, 220, 140, 0.3),
      inset 0 -3px 6px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(0,0,0,0.4);
  }

  .bezel-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(145deg, #1a1428 0%, #0a0814 100%);
    padding: 14px;
    box-shadow:
      inset 0 4px 12px rgba(0,0,0,0.8),
      inset 0 -1px 3px rgba(212, 168, 83, 0.1);
  }

  /* Clock face */
  .face {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 32%, rgba(255,255,255,0.04) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, var(--face-inner) 0%, var(--face) 100%);
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.6),
      inset 0 0 80px rgba(212, 168, 83, 0.03);
    overflow: hidden;
  }

  /* Subtle texture overlay */
  .face::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      transparent 0deg 29deg,
      rgba(212, 168, 83, 0.015) 29deg 30deg
    );
    pointer-events: none;
  }

  /* Tick marks via SVG */
  .face svg.ticks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Hand container — centered rotation origin */
  .hands {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: 50% 100%;
    border-radius: 3px;
    will-change: transform;
  }

  .hand-hour {
    width: 7px;
    height: 28%;
    margin-left: -3.5px;
    background: linear-gradient(to top, var(--gold-dim), var(--gold));
    box-shadow: 0 0 12px var(--glow);
    border-radius: 3px 3px 1px 1px;
    z-index: 3;
    transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .hand-minute {
    width: 4px;
    height: 38%;
    margin-left: -2px;
    background: linear-gradient(to top, var(--brass), var(--gold-bright));
    box-shadow: 0 0 10px var(--glow);
    border-radius: 2px 2px 1px 1px;
    z-index: 4;
    transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .hand-second {
    width: 2px;
    height: 42%;
    margin-left: -1px;
    background: linear-gradient(to top, transparent 8%, #e06050 8%, #ff9070);
    box-shadow: 0 0 8px rgba(255, 120, 80, 0.5);
    z-index: 5;
    transition: none;
  }

  .hand-second::after {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff8060;
    box-shadow: 0 0 10px rgba(255, 100, 60, 0.7);
  }

  /* Center cap */
  .center-cap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold-dim));
    box-shadow:
      0 0 8px var(--glow),
      inset 0 1px 2px rgba(255,255,255,0.3);
    z-index: 6;
  }

  /* Inner ring decoration */
  .inner-ring {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    border: 1px solid rgba(212, 168, 83, 0.12);
    pointer-events: none;
  }

  /* Roman numerals area — subtle markers at 12,3,6,9 */
  .numeral {
    position: absolute;
    font-size: clamp(11px, 2.8vw, 15px);
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--tick-major);
    transform: translate(-50%, -50%);
    user-select: none;
  }

  /* Sweep second trail */
  .sweep-trail {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    opacity: 0.15;
    background: conic-gradient(
      from var(--sweep-angle, 0deg),
      transparent 0deg,
      rgba(255, 100, 60, 0.3) 2deg,
      transparent 4deg
    );
    transition: --sweep-angle 0.05s linear;
  }

  /* Digital readout panel */
  .readout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    animation: stage-in 1.4s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .time-digital {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 200;
    letter-spacing: 0.35em;
    color: var(--text);
    text-shadow: 0 0 20px rgba(212, 168, 83, 0.2);
    font-variant-numeric: tabular-nums;
    padding-left: 0.35em;
  }

  .time-digital .colon {
    display: inline-block;
    animation: colon-blink 1s step-start infinite;
    color: var(--gold);
    letter-spacing: 0;
  }

  @keyframes colon-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .date-line {
    font-size: clamp(0.7rem, 2vw, 0.85rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 300;
  }

  .phase-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.3rem;
    padding: 0.35rem 1rem;
    border-radius: 999px;
    border: 1px solid rgba(212, 168, 83, 0.15);
    background: rgba(212, 168, 83, 0.04);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    backdrop-filter: blur(8px);
    transition: border-color 8s ease, background 8s ease;
  }

  .phase-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--phase-color, var(--gold));
    box-shadow: 0 0 8px var(--phase-color, var(--gold));
    transition: background 8s ease, box-shadow 8s ease;
  }

  /* Decorative corner brackets */
  .bracket {
    position: fixed;
    width: 40px;
    height: 40px;
    border-color: rgba(212, 168, 83, 0.15);
    border-style: solid;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    animation: bracket-in 2s 0.8s ease both;
  }

  .bracket-tl { top: 2rem; left: 2rem; border-width: 1px 0 0 1px; }
  .bracket-tr { top: 2rem; right: 2rem; border-width: 1px 1px 0 0; }
  .bracket-bl { bottom: 2rem; left: 2rem; border-width: 0 0 1px 1px; }
  .bracket-br { bottom: 2rem; right: 2rem; border-width: 0 1px 1px 0; }

  @keyframes bracket-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Pulse ring on minute change */
  .pulse-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(212, 168, 83, 0);
    pointer-events: none;
    z-index: 20;
  }

  .pulse-ring.active {
    animation: pulse-out 1.2s ease-out forwards;
  }

  @keyframes pulse-out {
    0%   { inset: -4px; border-color: rgba(212, 168, 83, 0.5); opacity: 1; }
    100% { inset: -20px; border-color: rgba(212, 168, 83, 0); opacity: 0; }
  }

  @media (max-width: 480px) {
    .stage { gap: 1.8rem; }
    .bracket { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>
<canvas id="stars"></canvas>
<div class="aurora" id="aurora"></div>

<div class="bracket bracket-tl"></div>
<div class="bracket bracket-tr"></div>
<div class="bracket bracket-bl"></div>
<div class="bracket bracket-br"></div>

<div class="stage">
  <div class="housing">
    <div class="pulse-ring" id="pulseRing"></div>
    <div class="bezel">
      <div class="bezel-inner">
        <div class="face" id="face">
          <svg class="ticks" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <g id="tickGroup"></g>
          </svg>
          <div class="inner-ring"></div>
          <div class="sweep-trail" id="sweepTrail"></div>
          <div class="hands">
            <div class="hand hand-hour" id="handHour"></div>
            <div class="hand hand-minute" id="handMinute"></div>
            <div class="hand hand-second" id="handSecond"></div>
          </div>
          <div class="center-cap"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="readout">
    <div class="time-digital" id="timeDigital"></div>
    <div class="date-line" id="dateLine"></div>
    <div class="phase-badge">
      <span class="phase-dot" id="phaseDot"></span>
      <span id="phaseLabel">Night</span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const NUMERALS = [
    { n: 'XII', x: 50, y: 14 },
    { n: 'III', x: 86, y: 50 },
    { n: 'VI',  x: 50, y: 86 },
    { n: 'IX',  x: 14, y: 50 }
  ];

  const handHour   = document.getElementById('handHour');
  const handMinute = document.getElementById('handMinute');
  const handSecond = document.getElementById('handSecond');
  const sweepTrail = document.getElementById('sweepTrail');
  const timeDigital = document.getElementById('timeDigital');
  const dateLine    = document.getElementById('dateLine');
  const phaseLabel  = document.getElementById('phaseLabel');
  const phaseDot    = document.getElementById('phaseDot');
  const sky         = document.getElementById('sky');
  const aurora      = document.getElementById('aurora');
  const pulseRing   = document.getElementById('pulseRing');
  const face        = document.getElementById('face');
  const tickGroup   = document.getElementById('tickGroup');

  let lastMinute = -1;

  /* Build tick marks */
  (function buildTicks() {
    const cx = 100, cy = 100, rOuter = 92, rInnerMajor = 78, rInnerMinor = 84;
    for (let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const isMajor = i % 5 === 0;
      const rIn = isMajor ? rInnerMajor : rInnerMinor;
      const x1 = cx + rOuter * Math.cos(angle);
      const y1 = cy + rOuter * Math.sin(angle);
      const x2 = cx + rIn * Math.cos(angle);
      const y2 = cy + rIn * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1.toFixed(2));
      line.setAttribute('y1', y1.toFixed(2));
      line.setAttribute('x2', x2.toFixed(2));
      line.setAttribute('y2', y2.toFixed(2));
      line.setAttribute('stroke', isMajor ? 'rgba(212,168,83,0.7)' : 'rgba(212,168,83,0.3)');
      line.setAttribute('stroke-width', isMajor ? '1.5' : '0.8');
      line.setAttribute('stroke-linecap', 'round');
      tickGroup.appendChild(line);
    }
  })();

  /* Roman numerals */
  NUMERALS.forEach(({ n, x, y }) => {
    const el = document.createElement('div');
    el.className = 'numeral';
    el.textContent = n;
    el.style.left = x + '%';
    el.style.top  = y + '%';
    face.appendChild(el);
  });

  /* Star field */
  (function initStars() {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function resize() {
      w = canvas.width  = window.innerWidth;
      h = canvas.height = window.innerHeight;
      stars = Array.from({ length: Math.floor(w * h / 8000) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.2 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 1.2
      }));
    }

    function drawStars(t) {
      ctx.clearRect(0, 0, w, h);
      stars.forEach(s => {
        const alpha = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 210, 190, ${alpha})`;
        ctx.fill();
      });
    }

    resize();
    window.addEventListener('resize', resize);

    function starLoop(t) {
      drawStars(t);
      requestAnimationFrame(starLoop);
    }
    requestAnimationFrame(starLoop);
  })();

  /* Time-of-day atmosphere */
  function updateAtmosphere(hour) {
    let mid, deep, phase, color, showAurora;

    if (hour >= 5 && hour < 7) {
      mid = '#1a1028'; deep = '#0a0618'; phase = 'Dawn'; color = '#c08060'; showAurora = true;
    } else if (hour >= 7 && hour < 17) {
      mid = '#101828'; deep = '#080e18'; phase = 'Day'; color = '#d4a853'; showAurora = false;
    } else if (hour >= 17 && hour < 20) {
      mid = '#180e20'; deep = '#0a0614'; phase = 'Dusk'; color = '#c07050'; showAurora = true;
    } else {
      mid = '#0a1020'; deep = '#060810'; phase = 'Night'; color = '#8090c0'; showAurora = true;
    }

    sky.style.setProperty('--sky-mid', mid);
    sky.style.setProperty('--sky-deep', deep);
    phaseLabel.textContent = phase;
    phaseDot.style.setProperty('--phase-color', color);
    aurora.classList.toggle('visible', showAurora);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secAngle  = (s + ms / 1000) * 6;
    const minAngle  = (m + s / 60) * 6;
    const hourAngle = ((h % 12) + m / 60 + s / 3600) * 30;

    handSecond.style.transform  = `rotate(${secAngle}deg)`;
    handMinute.style.transform  = `rotate(${minAngle}deg)`;
    handHour.style.transform    = `rotate(${hourAngle}deg)`;
    sweepTrail.style.setProperty('--sweep-angle', `${secAngle - 90}deg`);

    const h12 = h % 12 || 12;
    timeDigital.innerHTML =
      `${pad(h12)}<span class="colon">:</span>${pad(m)}<span class="colon">:</span>${pad(s)}`;

    dateLine.textContent =
      `${DAYS[now.getDay()]} · ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

    updateAtmosphere(h);

    if (m !== lastMinute && lastMinute !== -1) {
      pulseRing.classList.remove('active');
      void pulseRing.offsetWidth;
      pulseRing.classList.add('active');
    }
    lastMinute = m;

    requestAnimationFrame(updateClock);
  }

  requestAnimationFrame(updateClock);
})();
</script>
</body>
</html>
