<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading</title>
  <style>
    :root {
      --bg-0: #07090f;
      --bg-1: #0d1220;
      --ink: #e8eefc;
      --muted: #8b97b8;
      --accent: #5b8cff;
      --accent-2: #7c5cff;
      --glow: rgba(91, 140, 255, 0.45);
      --track: rgba(255, 255, 255, 0.08);
      --fill: linear-gradient(90deg, #5b8cff, #7c5cff, #4fd1c5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(91, 140, 255, 0.18), transparent 55%),
        radial-gradient(900px 500px at 80% 100%, rgba(124, 92, 255, 0.12), transparent 50%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1));
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(420px, calc(100vw - 2.5rem));
      text-align: center;
      z-index: 1;
    }

    .orb {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 1.75rem;
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-2);
      animation: spin 1.15s linear infinite;
      filter: drop-shadow(0 0 12px var(--glow));
    }

    .orb-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #4fd1c5;
      border-left-color: rgba(79, 209, 197, 0.35);
      animation: spin 1.8s linear infinite reverse;
    }

    .orb-core {
      position: absolute;
      inset: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.35), transparent 45%),
        linear-gradient(145deg, #5b8cff, #7c5cff 55%, #3a4f9a);
      box-shadow:
        0 0 28px var(--glow),
        inset 0 0 18px rgba(255, 255, 255, 0.18);
      animation: pulse 2.2s ease-in-out infinite;
    }

    .brand {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.7rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
      min-height: 1.4em;
      margin-bottom: 1.6rem;
      transition: opacity 0.25s ease;
    }

    .meter {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--fill);
      background-size: 200% 100%;
      box-shadow: 0 0 16px rgba(91, 140, 255, 0.55);
      animation: sheen 1.8s linear infinite;
      transition: width 0.2s ease-out;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.7rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .pct {
      color: var(--ink);
      font-weight: 600;
    }

    .dots span {
      display: inline-block;
      width: 0.35em;
      animation: blink 1.2s infinite;
      opacity: 0;
    }

    .dots span:nth-child(1) { animation-delay: 0s; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    .done {
      display: none;
      margin-top: 1.4rem;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(79, 209, 197, 0.35);
      background: rgba(79, 209, 197, 0.1);
      color: #9aefe4;
      font-size: 0.9rem;
    }

    .done.show {
      display: block;
      animation: fadeUp 0.45s ease;
    }

    .floaters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floater {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(232, 238, 252, 0.55);
      box-shadow: 0 0 10px rgba(91, 140, 255, 0.6);
      animation: drift linear infinite;
      opacity: 0.35;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.06); filter: brightness(1.12); }
    }

    @keyframes sheen {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @keyframes blink {
      0%, 20% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes drift {
      0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
      15% { opacity: 0.45; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb-ring,
      .orb-ring::before,
      .orb-core,
      .meter-fill,
      .floater,
      .dots span {
        animation: none !important;
      }

      .orb-ring {
        border-color: rgba(91, 140, 255, 0.45);
      }
    }
  </style>
</head>
<body>
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <main class="stage" role="status" aria-live="polite" aria-busy="true" id="loader">
    <div class="orb" aria-hidden="true">
      <div class="orb-ring"></div>
      <div class="orb-core"></div>
    </div>

    <p class="brand">System</p>
    <h1>Preparing workspace</h1>
    <p class="status" id="status">Initializing modules<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>

    <div class="meter" aria-hidden="true">
      <div class="meter-fill" id="fill"></div>
    </div>
    <div class="meta">
      <span id="phase">Boot sequence</span>
      <span class="pct"><span id="pct">0</span>%</span>
    </div>

    <div class="done" id="done">Ready. All systems online.</div>
  </main>

  <script>
    (function () {
      const messages = [
        "Initializing modules",
        "Loading assets",
        "Calibrating interface",
        "Syncing preferences",
        "Warming caches",
        "Almost there"
      ];

      const phases = [
        "Boot sequence",
        "Asset pipeline",
        "UI hydration",
        "State sync",
        "Cache warm-up",
        "Final checks"
      ];

      const fill = document.getElementById("fill");
      const pctEl = document.getElementById("pct");
      const statusEl = document.getElementById("status");
      const phaseEl = document.getElementById("phase");
      const doneEl = document.getElementById("done");
      const loader = document.getElementById("loader");
      const floaters = document.getElementById("floaters");

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!reduceMotion) {
        for (let i = 0; i < 18; i++) {
          const d = document.createElement("span");
          d.className = "floater";
          d.style.left = Math.random() * 100 + "%";
          d.style.animationDuration = 6 + Math.random() * 8 + "s";
          d.style.animationDelay = Math.random() * 8 + "s";
          d.style.width = d.style.height = 2 + Math.random() * 3 + "px";
          floaters.appendChild(d);
        }
      }

      let progress = 0;
      let msgIndex = 0;

      function setProgress(value) {
        progress = Math.min(100, Math.max(0, value));
        fill.style.width = progress + "%";
        pctEl.textContent = Math.round(progress);
      }

      function setMessage(index) {
        msgIndex = index;
        const dots = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
        statusEl.innerHTML = messages[index] + dots;
        phaseEl.textContent = phases[index];
      }

      function finish() {
        setProgress(100);
        statusEl.textContent = "Complete";
        phaseEl.textContent = "Done";
        loader.setAttribute("aria-busy", "false");
        doneEl.classList.add("show");
      }

      if (reduceMotion) {
        setMessage(messages.length - 1);
        setProgress(100);
        finish();
        return;
      }

      const duration = 4200;
      const start = performance.now();

      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 2.4);
        setProgress(eased * 100);

        const nextMsg = Math.min(messages.length - 1, Math.floor(t * messages.length));
        if (nextMsg !== msgIndex) setMessage(nextMsg);

        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          finish();
        }
      }

      setMessage(0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
