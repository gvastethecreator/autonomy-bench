<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora — Desktop Music Player</title>
<style>
  :root {
    --bg: #0c0d10;
    --bg-elevated: #14161c;
    --bg-panel: #181a22;
    --bg-hover: #1e212b;
    --bg-active: #252836;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.1);
    --text: #f2f3f7;
    --text-secondary: #9aa0b4;
    --text-muted: #6b7287;
    --accent: #7c6cff;
    --accent-soft: rgba(124,108,255,0.18);
    --accent-glow: rgba(124,108,255,0.35);
    --warm: #ff8f6b;
    --success: #4ade80;
    --danger: #f87171;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", "SF Mono", Consolas, monospace;
    --player-h: 92px;
    --sidebar-w: 240px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 1fr var(--player-h);
    height: 100%;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,108,255,0.14), transparent 55%),
      radial-gradient(900px 500px at 90% 0%, rgba(255,143,107,0.08), transparent 50%),
      var(--bg);
  }

  /* Sidebar */
  .sidebar {
    grid-row: 1 / 2;
    display: flex;
    flex-direction: column;
    gap: 28px;
    padding: 22px 16px 16px;
    border-right: 1px solid var(--border);
    background: rgba(12,13,16,0.55);
    backdrop-filter: blur(20px);
    overflow: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 8px;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--warm));
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand span {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 1px;
  }

  .nav-section { display: flex; flex-direction: column; gap: 4px; }
  .nav-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 12px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text); }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--text);
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }

  .playlist-mini {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 4px;
  }
  .playlist-mini button {
    text-align: left;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .playlist-mini button:hover,
  .playlist-mini button.active {
    background: var(--bg-hover);
    color: var(--text);
  }
  .playlist-mini button.active { color: #c4bfff; }

  /* Main */
  .main {
    grid-row: 1 / 2;
    overflow: auto;
    padding: 28px 32px 40px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.12) transparent;
  }
  .main::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  .hero {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 28px;
    align-items: end;
    margin-bottom: 32px;
    padding: 8px 0 8px;
  }
  .cover {
    width: 220px;
    height: 220px;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 1px var(--border);
  }
  .cover-art {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    position: relative;
  }
  .cover-art::before {
    content: "";
    position: absolute;
    inset: 0;
    background: inherit;
    filter: saturate(1.1);
  }
  .cover-glyph {
    position: relative;
    z-index: 1;
    font-size: 64px;
    opacity: 0.9;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.35));
  }
  .cover-ring {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.18);
    z-index: 1;
  }
  .cover-ring::after {
    content: "";
    position: absolute;
    inset: 28%;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.12);
  }

  .hero-meta { padding-bottom: 8px; min-width: 0; }
  .hero-kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .hero h2 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 750;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .hero-sub {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.12s, background 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: var(--accent);
    color: white;
    box-shadow: 0 10px 28px var(--accent-glow);
  }
  .btn-primary:hover { background: #8d80ff; }
  .btn-ghost {
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    color: var(--text);
  }
  .btn-ghost:hover { background: var(--bg-hover); }
  .btn svg { width: 16px; height: 16px; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .toolbar h3 {
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    min-width: 220px;
  }
  .search svg { width: 15px; height: 15px; color: var(--text-muted); }
  .search input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    min-width: 0;
  }
  .search input::placeholder { color: var(--text-muted); }

  .track-table {
    width: 100%;
    border-collapse: collapse;
  }
  .track-table thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 12px 12px;
    border-bottom: 1px solid var(--border);
  }
  .track-table thead th:first-child { width: 44px; }
  .track-table thead th:last-child { width: 70px; text-align: right; }
  .track-row td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    vertical-align: middle;
  }
  .track-row {
    border-radius: 10px;
    transition: background 0.12s;
    cursor: pointer;
  }
  .track-row:hover td { background: var(--bg-hover); }
  .track-row.active td { background: var(--accent-soft); }
  .track-row td:first-child { border-radius: 10px 0 0 10px; }
  .track-row td:last-child { border-radius: 0 10px 10px 0; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .idx {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }
  .track-row:hover .idx-num,
  .track-row.active .idx-num { display: none; }
  .idx-play { display: none; width: 14px; height: 14px; }
  .track-row:hover .idx-play,
  .track-row.active .idx-play { display: block; color: var(--text); }
  .track-row.active .idx-play { color: #c4bfff; }

  .track-title-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mini-cover {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 16px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .track-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { color: var(--text-secondary); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq-bars {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .track-row.active.playing .eq-bars { display: inline-flex; }
  .track-row.active.playing .idx-play { display: none; }
  .eq-bars span {
    width: 3px;
    background: #c4bfff;
    border-radius: 2px;
    animation: eq 0.8s ease-in-out infinite alternate;
  }
  .eq-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .eq-bars span:nth-child(2) { height: 100%; animation-delay: 0.15s; }
  .eq-bars span:nth-child(3) { height: 65%; animation-delay: 0.3s; }
  @keyframes eq {
    from { transform: scaleY(0.45); }
    to { transform: scaleY(1); }
  }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Player bar */
  .player {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    align-items: center;
    gap: 20px;
    padding: 0 22px;
    border-top: 1px solid var(--border);
    background: rgba(16,18,24,0.92);
    backdrop-filter: blur(24px);
    box-shadow: 0 -12px 40px rgba(0,0,0,0.35);
    position: relative;
    z-index: 5;
  }

  .now {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .now-art {
    width: 58px;
    height: 58px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.08);
    transition: transform 0.35s ease;
  }
  .now-art.spinning { animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .now-text { min-width: 0; }
  .now-title {
    font-size: 14px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-artist {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .like-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }
  .like-btn:hover { background: var(--bg-hover); color: var(--text); }
  .like-btn.liked { color: var(--warm); }
  .like-btn svg { width: 16px; height: 16px; }

  .transport { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .controls { display: flex; align-items: center; gap: 6px; }
  .ctrl {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text-secondary);
    transition: background 0.15s, color 0.15s, transform 0.12s;
  }
  .ctrl:hover { background: var(--bg-hover); color: var(--text); }
  .ctrl.active { color: var(--accent); }
  .ctrl svg { width: 18px; height: 18px; }
  .ctrl-play {
    width: 44px;
    height: 44px;
    background: var(--text);
    color: #111;
    margin: 0 4px;
  }
  .ctrl-play:hover { background: #fff; transform: scale(1.04); }
  .ctrl-play svg { width: 20px; height: 20px; }

  .scrub {
    display: grid;
    grid-template-columns: 42px 1fr 42px;
    align-items: center;
    gap: 10px;
    width: min(100%, 520px);
  }
  .time {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
  }
  .time.end { text-align: right; }

  .slider {
    height: 18px;
    display: flex;
    align-items: center;
    position: relative;
  }
  .slider input[type="range"] {
    width: 100%;
    height: 18px;
    cursor: pointer;
  }
  .slider input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--pos, 0%), rgba(255,255,255,0.12) var(--pos, 0%));
  }
  .slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    margin-top: -4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .slider:hover input[type="range"]::-webkit-slider-thumb { opacity: 1; }
  .slider input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
  }
  .slider input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: var(--accent);
  }
  .slider input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
  }
  .slider:hover input[type="range"]::-moz-range-thumb { opacity: 1; }

  .extras {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .volume {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 140px;
  }
  .volume .ctrl { width: 32px; height: 32px; }
  .volume .ctrl svg { width: 16px; height: 16px; }
  .viz {
    width: 72px;
    height: 28px;
    border-radius: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .viz canvas { width: 100%; height: 100%; display: block; }

  .toast {
    position: fixed;
    bottom: calc(var(--player-h) + 18px);
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 20;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 980px) {
    :root { --sidebar-w: 200px; }
    .hero { grid-template-columns: 160px 1fr; gap: 20px; }
    .cover { width: 160px; height: 160px; }
    .player { grid-template-columns: 1fr 1.2fr auto; }
    .viz { display: none; }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .hero { grid-template-columns: 1fr; }
    .cover { width: 140px; height: 140px; }
    .player { grid-template-columns: 1fr; padding: 10px 14px 14px; gap: 8px; }
    .now { justify-content: center; }
    .extras { justify-content: center; }
    .search { min-width: 0; flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div>
          <h1>Aurora</h1>
          <span>Desktop Player</span>
        </div>
      </div>

      <nav class="nav-section" aria-label="Library">
        <div class="nav-label">Library</div>
        <button class="nav-item active" data-view="all" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          All Tracks
        </button>
        <button class="nav-item" data-view="liked" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          Liked
        </button>
        <button class="nav-item" data-view="recent" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Recently Played
        </button>
      </nav>

      <div class="nav-section">
        <div class="nav-label">Collections</div>
        <div class="playlist-mini" id="playlistNav"></div>
      </div>
    </aside>

    <main class="main">
      <section class="hero">
        <div class="cover">
          <div class="cover-art" id="heroCover">
            <div class="cover-ring"></div>
            <div class="cover-glyph" id="heroGlyph">✦</div>
          </div>
        </div>
        <div class="hero-meta">
          <div class="hero-kicker" id="heroKicker">Collection</div>
          <h2 id="heroTitle">Midnight Circuit</h2>
          <p class="hero-sub" id="heroSub">8 synthesized tracks · procedural audio · ready to play</p>
          <div class="hero-actions">
            <button class="btn btn-primary" id="playAllBtn" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Play
            </button>
            <button class="btn btn-ghost" id="shuffleAllBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              Shuffle
            </button>
          </div>
        </div>
      </section>

      <div class="toolbar">
        <h3 id="listTitle">Tracks</h3>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="Search titles or artists" autocomplete="off" />
        </label>
      </div>

      <table class="track-table" aria-label="Track list">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Album</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody id="trackBody"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>No tracks match your search.</div>
    </main>

    <footer class="player" role="region" aria-label="Now playing">
      <div class="now">
        <div class="now-art" id="nowArt">♪</div>
        <div class="now-text">
          <div class="now-title" id="nowTitle">Select a track</div>
          <div class="now-artist" id="nowArtist">Aurora Player</div>
        </div>
        <button class="like-btn" id="likeBtn" type="button" aria-label="Like track" title="Like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
      </div>

      <div class="transport">
        <div class="controls">
          <button class="ctrl" id="shuffleBtn" type="button" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="ctrl" id="prevBtn" type="button" aria-label="Previous" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="ctrl ctrl-play" id="playBtn" type="button" aria-label="Play" title="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl" id="nextBtn" type="button" aria-label="Next" title="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button class="ctrl" id="repeatBtn" type="button" aria-label="Repeat" title="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
        <div class="scrub">
          <span class="time" id="curTime">0:00</span>
          <div class="slider">
            <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          </div>
          <span class="time end" id="durTime">0:00</span>
        </div>
      </div>

      <div class="extras">
        <div class="viz" title="Spectrum">
          <canvas id="vizCanvas" width="144" height="56"></canvas>
        </div>
        <div class="volume">
          <button class="ctrl" id="muteBtn" type="button" aria-label="Mute" title="Mute">
            <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          </button>
          <div class="slider" style="flex:1">
            <input type="range" id="volume" min="0" max="100" value="75" aria-label="Volume" />
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const TRACKS = [
    { id: "t1", title: "Neon Drift", artist: "Lumen Field", album: "Midnight Circuit", collection: "Midnight Circuit", duration: 42, bpm: 96, key: "A", mood: "chill", color: ["#5b4dff", "#2a1f6e"], glyph: "◈" },
    { id: "t2", title: "Glass Elevator", artist: "Lumen Field", album: "Midnight Circuit", collection: "Midnight Circuit", duration: 38, bpm: 110, key: "D", mood: "up", color: ["#7c6cff", "#ff8f6b"], glyph: "◇" },
    { id: "t3", title: "Harbor Lights", artist: "North Harbor", album: "Soft Arrival", collection: "Soft Arrival", duration: 45, bpm: 78, key: "C", mood: "soft", color: ["#3d8bfd", "#0f2a4a"], glyph: "○" },
    { id: "t4", title: "Paper Planes", artist: "North Harbor", album: "Soft Arrival", collection: "Soft Arrival", duration: 36, bpm: 88, key: "F", mood: "soft", color: ["#56cfe1", "#22577a"], glyph: "△" },
    { id: "t5", title: "Voltage Garden", artist: "Kite & Coil", album: "Afterglow Labs", collection: "Afterglow Labs", duration: 40, bpm: 124, key: "E", mood: "drive", color: ["#ff6b9d", "#5a189a"], glyph: "✦" },
    { id: "t6", title: "Static Bloom", artist: "Kite & Coil", album: "Afterglow Labs", collection: "Afterglow Labs", duration: 34, bpm: 118, key: "G", mood: "drive", color: ["#f72585", "#4361ee"], glyph: "✶" },
    { id: "t7", title: "Copper Hour", artist: "Atlas Loom", album: "Warm Rooms", collection: "Warm Rooms", duration: 44, bpm: 84, key: "Bb", mood: "warm", color: ["#e09f3e", "#540b0e"], glyph: "▣" },
    { id: "t8", title: "Late Signal", artist: "Atlas Loom", album: "Warm Rooms", collection: "Warm Rooms", duration: 39, bpm: 92, key: "D", mood: "warm", color: ["#f4a261", "#264653"], glyph: "◉" },
  ];

  const COLLECTIONS = [...new Set(TRACKS.map(t => t.collection))];
  const KEYS = {
    C: [261.63, 329.63, 392.00, 523.25],
    D: [293.66, 369.99, 440.00, 587.33],
    E: [329.63, 415.30, 493.88, 659.25],
    F: [349.23, 440.00, 523.25, 698.46],
    G: [392.00, 493.88, 587.33, 783.99],
    A: [440.00, 554.37, 659.25, 880.00],
    Bb: [466.16, 587.33, 698.46, 932.33],
  };

  const state = {
    view: "all",
    collection: null,
    query: "",
    queue: TRACKS.map(t => t.id),
    index: 0,
    playing: false,
    shuffle: false,
    repeat: "off", // off | all | one
    liked: new Set(JSON.parse(localStorage.getItem("aurora-liked") || "[]")),
    recent: JSON.parse(localStorage.getItem("aurora-recent") || "[]"),
    volume: 0.75,
    muted: false,
    seeking: false,
    trackElapsed: 0,
    startedAt: 0,
    raf: 0,
  };

  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let activeNodes = [];
  let clockTimer = null;

  const $ = (id) => document.getElementById(id);
  const els = {
    trackBody: $("trackBody"),
    emptyState: $("emptyState"),
    playlistNav: $("playlistNav"),
    heroCover: $("heroCover"),
    heroGlyph: $("heroGlyph"),
    heroKicker: $("heroKicker"),
    heroTitle: $("heroTitle"),
    heroSub: $("heroSub"),
    listTitle: $("listTitle"),
    searchInput: $("searchInput"),
    nowArt: $("nowArt"),
    nowTitle: $("nowTitle"),
    nowArtist: $("nowArtist"),
    likeBtn: $("likeBtn"),
    playBtn: $("playBtn"),
    playIcon: $("playIcon"),
    prevBtn: $("prevBtn"),
    nextBtn: $("nextBtn"),
    shuffleBtn: $("shuffleBtn"),
    repeatBtn: $("repeatBtn"),
    seek: $("seek"),
    volume: $("volume"),
    muteBtn: $("muteBtn"),
    volIcon: $("volIcon"),
    curTime: $("curTime"),
    durTime: $("durTime"),
    toast: $("toast"),
    vizCanvas: $("vizCanvas"),
    playAllBtn: $("playAllBtn"),
    shuffleAllBtn: $("shuffleAllBtn"),
  };

  const vizCtx = els.vizCanvas.getContext("2d");
  const freqData = new Uint8Array(64);

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove("show"), 1800);
  }

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = state.muted ? 0 : state.volume;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function stopEngine() {
    activeNodes.forEach(n => {
      try { n.stop?.(); } catch (_) {}
      try { n.disconnect?.(); } catch (_) {}
    });
    activeNodes = [];
    if (clockTimer) { clearTimeout(clockTimer); clockTimer = null; }
  }

  function note(freq, when, dur, type, gainVal, detune = 0) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    const peak = gainVal;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(peak, when + 0.02);
    g.gain.exponentialRampToValueAtTime(peak * 0.7, when + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(when);
    osc.stop(when + dur + 0.02);
    activeNodes.push(osc, g);
  }

  function noiseHit(when, dur, gainVal) {
    const frames = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, frames, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = 1200;
    src.buffer = buffer;
    g.gain.value = gainVal;
    src.connect(f);
    f.connect(g);
    g.connect(masterGain);
    src.start(when);
    activeNodes.push(src, g, f);
  }

  function kick(when) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(140, when);
    osc.frequency.exponentialRampToValueAtTime(45, when + 0.18);
    g.gain.setValueAtTime(0.9, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.28);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(when);
    osc.stop(when + 0.3);
    activeNodes.push(osc, g);
  }

  function scheduleTrack(track, offsetSec = 0) {
    stopEngine();
    ensureAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();

    const start = audioCtx.currentTime + 0.05;
    const remaining = Math.max(0.5, track.duration - offsetSec);
    const beat = 60 / track.bpm;
    const chords = KEYS[track.key] || KEYS.A;
    const stepsFrom = Math.floor(offsetSec / beat);
    const totalSteps = Math.ceil(track.duration / beat);
    const endStep = Math.min(totalSteps, stepsFrom + Math.ceil(remaining / beat) + 1);

    for (let step = stepsFrom; step < endStep; step++) {
      const t = start + (step * beat - offsetSec);
      if (t < start - 0.01) continue;
      const bar = step % 8;
      const soft = track.mood === "soft" || track.mood === "warm" || track.mood === "chill";

      if (bar % 2 === 0) kick(t);
      if (!soft && (bar === 2 || bar === 6)) noiseHit(t, 0.08, 0.12);
      if (bar === 4) noiseHit(t, 0.05, soft ? 0.05 : 0.1);

      // bass
      if (bar % 2 === 0) {
        note(chords[0] / 2, t, beat * 1.6, "triangle", soft ? 0.14 : 0.18);
      }

      // pads
      if (bar === 0 || bar === 4) {
        const chordGain = soft ? 0.05 : 0.04;
        note(chords[0], t, beat * 3.5, "sine", chordGain);
        note(chords[1], t, beat * 3.5, "sine", chordGain * 0.85, 4);
        note(chords[2], t, beat * 3.5, "triangle", chordGain * 0.55, -3);
      }

      // melody
      const melodies = {
        chill: [0, 2, 3, 2, 1, 2, 0, 3],
        up: [0, 1, 2, 3, 2, 1, 3, 2],
        soft: [2, 1, 0, 1, 2, 3, 2, 1],
        drive: [0, 3, 1, 2, 3, 0, 2, 1],
        warm: [1, 0, 2, 1, 3, 2, 1, 0],
      };
      const seq = melodies[track.mood] || melodies.chill;
      const deg = seq[bar];
      if (bar % 2 === 1 || track.mood === "drive") {
        note(chords[deg], t + beat * 0.05, beat * 0.85, "sine", soft ? 0.07 : 0.09, 2);
      }
      if (track.mood === "up" && bar % 4 === 3) {
        note(chords[3], t + beat * 0.5, beat * 0.4, "triangle", 0.05);
      }
    }

    state.trackElapsed = offsetSec;
    state.startedAt = performance.now() - offsetSec * 1000;
    clockTimer = setTimeout(() => onTrackEnded(), remaining * 1000);
  }

  function currentTrack() {
    const id = state.queue[state.index];
    return TRACKS.find(t => t.id === id) || TRACKS[0];
  }

  function visibleTracks() {
    let list = TRACKS.slice();
    if (state.view === "liked") list = list.filter(t => state.liked.has(t.id));
    else if (state.view === "recent") {
      list = state.recent.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
    } else if (state.view === "collection" && state.collection) {
      list = list.filter(t => t.collection === state.collection);
    }
    const q = state.query.trim().toLowerCase();
    if (q) {
      list = list.filter(t =>
        t.title.toLowerCase().includes(q) ||
        t.artist.toLowerCase().includes(q) ||
        t.album.toLowerCase().includes(q)
      );
    }
    return list;
  }

  function gradient(colors) {
    return `linear-gradient(145deg, ${colors[0]}, ${colors[1]})`;
  }

  function setSliderPos(el, pct) {
    el.style.setProperty("--pos", `${Math.min(100, Math.max(0, pct))}%`);
  }

  function updateHero() {
    const list = visibleTracks();
    const focus = list[0] || currentTrack();
    els.heroCover.style.background = gradient(focus.color);
    els.heroGlyph.textContent = focus.glyph;
    if (state.view === "liked") {
      els.heroKicker.textContent = "Playlist";
      els.heroTitle.textContent = "Liked";
      els.heroSub.textContent = `${list.length} track${list.length === 1 ? "" : "s"} you marked`;
    } else if (state.view === "recent") {
      els.heroKicker.textContent = "Activity";
      els.heroTitle.textContent = "Recently Played";
      els.heroSub.textContent = list.length ? `${list.length} recent picks` : "Play something to fill this list";
    } else if (state.view === "collection") {
      els.heroKicker.textContent = "Collection";
      els.heroTitle.textContent = state.collection;
      els.heroSub.textContent = `${list.length} tracks · ${focus.artist}`;
    } else {
      els.heroKicker.textContent = "Library";
      els.heroTitle.textContent = "Midnight Circuit";
      els.heroSub.textContent = `${TRACKS.length} synthesized tracks · procedural audio · ready to play`;
    }
    els.listTitle.textContent =
      state.view === "liked" ? "Liked tracks" :
      state.view === "recent" ? "Listening history" :
      state.view === "collection" ? state.collection :
      "Tracks";
  }

  function renderList() {
    const list = visibleTracks();
    const cur = currentTrack();
    els.trackBody.innerHTML = "";
    els.emptyState.hidden = list.length > 0;

    list.forEach((t, i) => {
      const tr = document.createElement("tr");
      tr.className = "track-row";
      if (t.id === cur.id) {
        tr.classList.add("active");
        if (state.playing) tr.classList.add("playing");
      }
      tr.dataset.id = t.id;
      tr.innerHTML = `
        <td>
          <div class="idx">
            <span class="idx-num">${i + 1}</span>
            <svg class="idx-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span class="eq-bars" aria-hidden="true"><span></span><span></span><span></span></span>
          </div>
        </td>
        <td>
          <div class="track-title-cell">
            <div class="mini-cover" style="background:${gradient(t.color)}">${t.glyph}</div>
            <div style="min-width:0">
              <div class="track-name">${t.title}</div>
              <div class="track-artist">${t.artist}</div>
            </div>
          </div>
        </td>
        <td style="color:var(--text-secondary)">${t.album}</td>
        <td>${fmt(t.duration)}</td>
      `;
      tr.addEventListener("click", () => playTrackId(t.id, true));
      els.trackBody.appendChild(tr);
    });
  }

  function renderPlaylists() {
    els.playlistNav.innerHTML = "";
    COLLECTIONS.forEach(name => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = name;
      if (state.view === "collection" && state.collection === name) btn.classList.add("active");
      btn.addEventListener("click", () => {
        state.view = "collection";
        state.collection = name;
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        updateHero();
        renderList();
        renderPlaylists();
      });
      els.playlistNav.appendChild(btn);
    });
  }

  function updateNowPlaying() {
    const t = currentTrack();
    els.nowTitle.textContent = t.title;
    els.nowArtist.textContent = `${t.artist} · ${t.album}`;
    els.nowArt.textContent = t.glyph;
    els.nowArt.style.background = gradient(t.color);
    els.nowArt.classList.toggle("spinning", state.playing);
    els.likeBtn.classList.toggle("liked", state.liked.has(t.id));
    els.durTime.textContent = fmt(t.duration);
    els.playIcon.innerHTML = state.playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    els.playBtn.setAttribute("aria-label", state.playing ? "Pause" : "Play");
    els.playBtn.title = state.playing ? "Pause" : "Play";
    els.shuffleBtn.classList.toggle("active", state.shuffle);
    els.repeatBtn.classList.toggle("active", state.repeat !== "off");
    els.repeatBtn.title = state.repeat === "one" ? "Repeat one" : state.repeat === "all" ? "Repeat all" : "Repeat";
  }

  function pushRecent(id) {
    state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 12);
    localStorage.setItem("aurora-recent", JSON.stringify(state.recent));
  }

  function rebuildQueueFromView(startId) {
    const list = visibleTracks();
    const ids = list.map(t => t.id);
    if (!ids.length) return false;
    if (state.shuffle) {
      const shuffled = ids.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      if (startId) {
        const ix = shuffled.indexOf(startId);
        if (ix > 0) {
          shuffled.splice(ix, 1);
          shuffled.unshift(startId);
        }
      }
      state.queue = shuffled;
    } else {
      state.queue = ids.length ? ids : TRACKS.map(t => t.id);
    }
    state.index = Math.max(0, state.queue.indexOf(startId || state.queue[0]));
    return true;
  }

  function playTrackId(id, fromClick) {
    ensureAudio();
    if (fromClick) rebuildQueueFromView(id);
    else {
      const ix = state.queue.indexOf(id);
      if (ix >= 0) state.index = ix;
    }
    const track = currentTrack();
    pushRecent(track.id);
    scheduleTrack(track, 0);
    state.playing = true;
    updateNowPlaying();
    updateHero();
    renderList();
    drawViz();
  }

  function togglePlay() {
    ensureAudio();
    if (!state.queue.length) rebuildQueueFromView(TRACKS[0].id);
    const track = currentTrack();
    if (state.playing) {
      state.trackElapsed = Math.min(track.duration, (performance.now() - state.startedAt) / 1000);
      stopEngine();
      state.playing = false;
      updateNowPlaying();
      renderList();
      return;
    }
    if (state.trackElapsed >= track.duration - 0.05) state.trackElapsed = 0;
    scheduleTrack(track, state.trackElapsed);
    state.playing = true;
    if (!state.recent.includes(track.id)) pushRecent(track.id);
    updateNowPlaying();
    renderList();
    drawViz();
  }

  function onTrackEnded() {
    if (!state.playing) return;
    if (state.repeat === "one") {
      playTrackId(currentTrack().id, false);
      return;
    }
    if (state.index < state.queue.length - 1) {
      state.index += 1;
      playTrackId(state.queue[state.index], false);
      return;
    }
    if (state.repeat === "all") {
      state.index = 0;
      playTrackId(state.queue[0], false);
      return;
    }
    state.playing = false;
    state.trackElapsed = 0;
    stopEngine();
    setSliderPos(els.seek, 0);
    els.seek.value = 0;
    els.curTime.textContent = "0:00";
    updateNowPlaying();
    renderList();
  }

  function nextTrack() {
    if (state.shuffle && state.queue.length > 1) {
      let next;
      do { next = Math.floor(Math.random() * state.queue.length); } while (next === state.index);
      state.index = next;
    } else if (state.index < state.queue.length - 1) {
      state.index += 1;
    } else if (state.repeat === "all") {
      state.index = 0;
    } else {
      toast("End of queue");
      return;
    }
    playTrackId(state.queue[state.index], false);
  }

  function prevTrack() {
    const elapsed = state.playing
      ? (performance.now() - state.startedAt) / 1000
      : state.trackElapsed;
    if (elapsed > 3) {
      playTrackId(currentTrack().id, false);
      return;
    }
    state.index = state.index > 0 ? state.index - 1 : state.queue.length - 1;
    playTrackId(state.queue[state.index], false);
  }

  function tick() {
    const track = currentTrack();
    if (state.playing && !state.seeking) {
      const elapsed = Math.min(track.duration, (performance.now() - state.startedAt) / 1000);
      state.trackElapsed = elapsed;
      const pct = (elapsed / track.duration) * 100;
      els.seek.value = Math.round((elapsed / track.duration) * 1000);
      setSliderPos(els.seek, pct);
      els.curTime.textContent = fmt(elapsed);
    }
    if (state.playing && analyser) {
      analyser.getByteFrequencyData(freqData);
      const w = els.vizCanvas.width;
      const h = els.vizCanvas.height;
      vizCtx.clearRect(0, 0, w, h);
      const bars = 16;
      const gap = 2;
      const bw = (w - gap * (bars - 1)) / bars;
      for (let i = 0; i < bars; i++) {
        const v = freqData[i + 2] / 255;
        const bh = Math.max(2, v * h);
        const x = i * (bw + gap);
        const grad = vizCtx.createLinearGradient(0, h - bh, 0, h);
        grad.addColorStop(0, "#a99cff");
        grad.addColorStop(1, "#ff8f6b");
        vizCtx.fillStyle = grad;
        vizCtx.fillRect(x, h - bh, bw, bh);
      }
    } else {
      vizCtx.clearRect(0, 0, els.vizCanvas.width, els.vizCanvas.height);
      vizCtx.fillStyle = "rgba(255,255,255,0.08)";
      for (let i = 0; i < 16; i++) {
        const bh = 4 + (i % 3) * 3;
        vizCtx.fillRect(i * 9, els.vizCanvas.height - bh, 7, bh);
      }
    }
    state.raf = requestAnimationFrame(tick);
  }

  function drawViz() { /* driven by tick */ }

  function applyVolume() {
    if (masterGain) masterGain.gain.value = state.muted ? 0 : state.volume;
    setSliderPos(els.volume, state.muted ? 0 : state.volume * 100);
    const level = state.muted ? 0 : state.volume;
    els.volIcon.innerHTML = level === 0
      ? '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6M17 9l6 6"/>'
      : level < 0.45
        ? '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'
        : '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>';
  }

  // Events
  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      btn.classList.add("active");
      state.view = btn.dataset.view;
      state.collection = null;
      updateHero();
      renderList();
      renderPlaylists();
    });
  });

  els.searchInput.addEventListener("input", () => {
    state.query = els.searchInput.value;
    renderList();
  });

  els.playBtn.addEventListener("click", togglePlay);
  els.prevBtn.addEventListener("click", prevTrack);
  els.nextBtn.addEventListener("click", nextTrack);

  els.shuffleBtn.addEventListener("click", () => {
    state.shuffle = !state.shuffle;
    const cur = currentTrack().id;
    rebuildQueueFromView(cur);
    updateNowPlaying();
    toast(state.shuffle ? "Shuffle on" : "Shuffle off");
  });

  els.repeatBtn.addEventListener("click", () => {
    state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
    updateNowPlaying();
    toast(state.repeat === "off" ? "Repeat off" : state.repeat === "all" ? "Repeat all" : "Repeat one");
  });

  els.likeBtn.addEventListener("click", () => {
    const id = currentTrack().id;
    if (state.liked.has(id)) state.liked.delete(id);
    else state.liked.add(id);
    localStorage.setItem("aurora-liked", JSON.stringify([...state.liked]));
    updateNowPlaying();
    if (state.view === "liked") renderList();
    toast(state.liked.has(id) ? "Added to Liked" : "Removed from Liked");
  });

  els.playAllBtn.addEventListener("click", () => {
    const list = visibleTracks();
    if (!list.length) { toast("Nothing to play"); return; }
    state.shuffle = false;
    rebuildQueueFromView(list[0].id);
    playTrackId(list[0].id, false);
  });

  els.shuffleAllBtn.addEventListener("click", () => {
    const list = visibleTracks();
    if (!list.length) { toast("Nothing to play"); return; }
    state.shuffle = true;
    rebuildQueueFromView(list[Math.floor(Math.random() * list.length)].id);
    playTrackId(state.queue[0], false);
    updateNowPlaying();
  });

  els.seek.addEventListener("pointerdown", () => { state.seeking = true; });
  els.seek.addEventListener("input", () => {
    const track = currentTrack();
    const pct = Number(els.seek.value) / 10;
    setSliderPos(els.seek, pct);
    els.curTime.textContent = fmt((pct / 100) * track.duration);
  });
  const commitSeek = () => {
    const track = currentTrack();
    const pct = Number(els.seek.value) / 10;
    state.trackElapsed = (pct / 100) * track.duration;
    state.seeking = false;
    if (state.playing) scheduleTrack(track, state.trackElapsed);
    else {
      state.startedAt = performance.now() - state.trackElapsed * 1000;
      setSliderPos(els.seek, pct);
    }
  };
  els.seek.addEventListener("pointerup", commitSeek);
  els.seek.addEventListener("change", commitSeek);

  els.volume.addEventListener("input", () => {
    state.volume = Number(els.volume.value) / 100;
    state.muted = state.volume === 0;
    ensureAudio();
    applyVolume();
  });

  els.muteBtn.addEventListener("click", () => {
    state.muted = !state.muted;
    ensureAudio();
    applyVolume();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input")) return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.code === "ArrowRight") nextTrack();
    else if (e.code === "ArrowLeft") prevTrack();
    else if (e.code === "KeyM") { state.muted = !state.muted; ensureAudio(); applyVolume(); }
  });

  // Init
  setSliderPos(els.volume, state.volume * 100);
  setSliderPos(els.seek, 0);
  applyVolume();
  updateHero();
  renderPlaylists();
  renderList();
  updateNowPlaying();
  state.raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
