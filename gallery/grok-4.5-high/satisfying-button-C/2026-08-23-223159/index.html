<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satisfying Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@450;550;650&family=JetBrains+Mono:wght@450&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --bg-0: #07080d;
      --bg-1: #0e1018;
      --ink: #eef1f8;
      --ink-muted: #8b93a7;
      --accent: #7cf0c2;
      --accent-hot: #ff8f6b;
      --accent-cool: #6ea8ff;
      --glow: rgba(124, 240, 194, 0.45);
      --press-ms: 140ms;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg-0);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: clamp(1.5rem, 4vw, 3rem);
      background:
        radial-gradient(ellipse 80% 55% at 50% 115%, rgba(110, 168, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 60% 40% at 20% 0%, rgba(255, 143, 107, 0.08), transparent 50%),
        radial-gradient(ellipse 50% 35% at 85% 10%, rgba(124, 240, 194, 0.07), transparent 45%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
    }

    .noise {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.035;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 1;
    }

    .orb {
      pointer-events: none;
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      z-index: 0;
      transition: transform 800ms var(--ease-out), opacity 600ms var(--ease-out);
    }

    .orb-a {
      width: min(42vw, 340px);
      height: min(42vw, 340px);
      background: radial-gradient(circle, rgba(124, 240, 194, 0.55), transparent 70%);
      top: 18%;
      left: 22%;
      animation: drift-a 14s var(--ease-in-out) infinite alternate;
    }

    .orb-b {
      width: min(38vw, 300px);
      height: min(38vw, 300px);
      background: radial-gradient(circle, rgba(110, 168, 255, 0.4), transparent 70%);
      bottom: 16%;
      right: 18%;
      animation: drift-b 18s var(--ease-in-out) infinite alternate;
    }

    .orb-c {
      width: min(28vw, 220px);
      height: min(28vw, 220px);
      background: radial-gradient(circle, rgba(255, 143, 107, 0.28), transparent 70%);
      top: 55%;
      left: 55%;
      animation: drift-c 12s var(--ease-in-out) infinite alternate;
    }

    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(40px, 30px, 0) scale(1.08); }
    }

    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-35px, -25px, 0) scale(1.12); }
    }

    @keyframes drift-c {
      from { transform: translate3d(-20px, 10px, 0) scale(0.95); }
      to { transform: translate3d(25px, -30px, 0) scale(1.05); }
    }

    .frame {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.75rem, 4vw, 2.75rem);
      width: min(100%, 28rem);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(238, 241, 248, 0.08);
      background: rgba(238, 241, 248, 0.03);
      color: var(--ink-muted);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      animation: rise-in 700ms var(--ease-out) 80ms forwards;
    }

    .eyebrow-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--glow);
      animation: pulse-dot 2.4s var(--ease-in-out) infinite;
    }

    .copy h1 {
      font-size: clamp(1.85rem, 5vw, 2.6rem);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 0.65rem;
      opacity: 0;
      transform: translateY(12px);
      animation: rise-in 750ms var(--ease-out) 160ms forwards;
    }

    .copy p {
      color: var(--ink-muted);
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      line-height: 1.55;
      max-width: 24ch;
      margin-inline: auto;
      opacity: 0;
      transform: translateY(12px);
      animation: rise-in 750ms var(--ease-out) 240ms forwards;
    }

    @keyframes rise-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 18rem);
      height: 9.5rem;
      opacity: 0;
      transform: translateY(16px) scale(0.97);
      animation: stage-in 850ms var(--ease-out) 320ms forwards;
    }

    @keyframes stage-in {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .halo {
      pointer-events: none;
      position: absolute;
      width: 14rem;
      height: 14rem;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow), transparent 68%);
      opacity: 0.35;
      filter: blur(8px);
      transition: opacity 280ms var(--ease-out), transform 280ms var(--ease-out);
    }

    .stage:has(.satisfying:hover) .halo,
    .stage:has(.satisfying:focus-visible) .halo {
      opacity: 0.7;
      transform: scale(1.08);
    }

    .stage:has(.satisfying.is-pressed) .halo {
      opacity: 0.25;
      transform: scale(0.92);
    }

    .stage:has(.satisfying.is-fired) .halo {
      opacity: 0.95;
      transform: scale(1.18);
    }

    .ripple-layer,
    .spark-layer {
      pointer-events: none;
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    .ripple {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      border: 2px solid rgba(124, 240, 194, 0.55);
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 0;
      animation: ripple-out 700ms var(--ease-out) forwards;
    }

    @keyframes ripple-out {
      0% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(0.45);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.4);
      }
    }

    .spark {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      background: var(--color);
      box-shadow: 0 0 10px var(--color);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      animation: spark-fly 680ms var(--ease-out) forwards;
      animation-delay: var(--delay);
    }

    @keyframes spark-fly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.15);
      }
    }

    .satisfying {
      --mx: 50%;
      --my: 50%;
      position: relative;
      appearance: none;
      border: 0;
      cursor: pointer;
      width: min(100%, 15.5rem);
      height: 4.25rem;
      border-radius: 1.35rem;
      color: #06110c;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      background:
        radial-gradient(120% 180% at var(--mx) var(--my), rgba(255, 255, 255, 0.55), transparent 42%),
        linear-gradient(160deg, #b8ffe0 0%, var(--accent) 42%, #4fd6a8 100%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.55) inset,
        0 -2px 0 rgba(18, 84, 62, 0.18) inset,
        0 18px 40px rgba(0, 0, 0, 0.35),
        0 8px 18px rgba(124, 240, 194, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      transform: translateY(0) scale(1);
      transition:
        transform var(--press-ms) var(--ease-out),
        box-shadow 220ms var(--ease-out),
        filter 220ms var(--ease-out);
      will-change: transform;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    .satisfying::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: calc(1.35rem - 1px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent 42%);
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 200ms var(--ease-out);
    }

    .satisfying::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 1.5rem;
      border: 1px solid transparent;
      background:
        linear-gradient(var(--bg-0), var(--bg-0)) padding-box,
        linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(124, 240, 194, 0.05), rgba(110, 168, 255, 0.35)) border-box;
      opacity: 0;
      z-index: -1;
      transition: opacity 220ms var(--ease-out);
    }

    .satisfying .label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .satisfying .glyph {
      display: grid;
      place-items: center;
      width: 1.15rem;
      height: 1.15rem;
      transition: transform 220ms var(--ease-spring);
    }

    .satisfying .glyph svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .satisfying .glyph-check {
      position: absolute;
      opacity: 0;
      filter: blur(4px);
      transform: scale(0.25);
      transition:
        opacity 220ms cubic-bezier(0.2, 0, 0, 1),
        filter 220ms cubic-bezier(0.2, 0, 0, 1),
        transform 220ms cubic-bezier(0.2, 0, 0, 1);
    }

    .satisfying .glyph-bolt {
      transition:
        opacity 220ms cubic-bezier(0.2, 0, 0, 1),
        filter 220ms cubic-bezier(0.2, 0, 0, 1),
        transform 220ms cubic-bezier(0.2, 0, 0, 1);
    }

    .satisfying.is-success .glyph-bolt {
      opacity: 0;
      filter: blur(4px);
      transform: scale(0.25);
    }

    .satisfying.is-success .glyph-check {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    @media (hover: hover) and (pointer: fine) {
      .satisfying:hover {
        transform: translateY(-3px) scale(1.015);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.65) inset,
          0 -2px 0 rgba(18, 84, 62, 0.16) inset,
          0 26px 50px rgba(0, 0, 0, 0.38),
          0 12px 28px rgba(124, 240, 194, 0.28),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        filter: saturate(1.05);
      }

      .satisfying:hover::after {
        opacity: 1;
      }

      .satisfying:hover .glyph {
        transform: rotate(-8deg) scale(1.08);
      }
    }

    .satisfying:focus-visible {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.65) inset,
        0 -2px 0 rgba(18, 84, 62, 0.16) inset,
        0 18px 40px rgba(0, 0, 0, 0.35),
        0 0 0 3px rgba(7, 8, 13, 0.95),
        0 0 0 6px rgba(124, 240, 194, 0.75);
    }

    .satisfying.is-pressed,
    .satisfying:active {
      transform: translateY(2px) scale(0.96);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 2px 0 rgba(18, 84, 62, 0.22) inset,
        0 6px 14px rgba(0, 0, 0, 0.28),
        0 2px 8px rgba(124, 240, 194, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      filter: brightness(0.97);
      transition-duration: 90ms;
    }

    .satisfying.is-pressed::before,
    .satisfying:active::before {
      opacity: 0.35;
    }

    .satisfying.is-fired {
      animation: fire-bloom 480ms var(--ease-out);
    }

    @keyframes fire-bloom {
      0% { filter: brightness(1) saturate(1); }
      35% { filter: brightness(1.18) saturate(1.2); }
      100% { filter: brightness(1) saturate(1); }
    }

    .meter {
      display: grid;
      gap: 0.7rem;
      width: min(100%, 15.5rem);
      opacity: 0;
      transform: translateY(10px);
      animation: rise-in 700ms var(--ease-out) 420ms forwards;
    }

    .meter-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .meter-label {
      color: var(--ink-muted);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }

    .count {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      min-width: 2ch;
      text-align: right;
      transition: color 200ms var(--ease-out), transform 200ms var(--ease-spring);
    }

    .count.is-bump {
      color: var(--accent);
      transform: scale(1.18);
    }

    .track {
      position: relative;
      height: 0.4rem;
      border-radius: 999px;
      background: rgba(238, 241, 248, 0.08);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-cool), var(--accent), var(--accent-hot));
      box-shadow: 0 0 16px rgba(124, 240, 194, 0.45);
      transition: width 320ms var(--ease-out);
    }

    .hint {
      color: color-mix(in srgb, var(--ink-muted) 80%, transparent);
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      opacity: 0;
      transform: translateY(8px);
      animation: rise-in 700ms var(--ease-out) 520ms forwards;
    }

    .toast {
      position: absolute;
      bottom: clamp(1.25rem, 4vh, 2.5rem);
      left: 50%;
      translate: -50% 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(238, 241, 248, 0.1);
      background: rgba(14, 16, 24, 0.78);
      backdrop-filter: blur(14px);
      color: var(--ink);
      font-size: 0.85rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(12px) scale(0.97);
      pointer-events: none;
      transition:
        opacity 220ms var(--ease-out),
        transform 220ms var(--ease-out);
    }

    .toast.is-on {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toast-pip {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--glow);
    }

    @media (prefers-reduced-motion: reduce) {
      .orb-a,
      .orb-b,
      .orb-c,
      .eyebrow-dot,
      .satisfying.is-fired {
        animation: none;
      }

      .eyebrow,
      .copy h1,
      .copy p,
      .stage,
      .meter,
      .hint {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .satisfying,
      .halo,
      .toast,
      .fill,
      .count,
      .glyph,
      .glyph-bolt,
      .glyph-check {
        transition-duration: 1ms !important;
      }

      .ripple,
      .spark {
        animation-duration: 1ms !important;
        opacity: 0 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="noise" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div class="orb orb-c" aria-hidden="true"></div>

    <div class="frame">
      <div class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        Tactile prototype
      </div>

      <div class="copy">
        <h1>The satisfying button</h1>
        <p>Press it. Feel the give, the bloom, the little reward that makes you want one more.</p>
      </div>

      <div class="stage">
        <div class="halo" aria-hidden="true"></div>
        <div class="ripple-layer" aria-hidden="true"></div>
        <div class="spark-layer" aria-hidden="true"></div>

        <button class="satisfying" type="button" aria-describedby="hint" aria-live="polite">
          <span class="label">
            <span class="glyph" aria-hidden="true">
              <svg class="glyph-bolt" viewBox="0 0 24 24">
                <path d="M13 2 4 14h7l-1 8 10-14h-7l0-6z" />
              </svg>
              <svg class="glyph-check" viewBox="0 0 24 24">
                <path d="M5 13.5 9.5 18 19 7" />
              </svg>
            </span>
            <span class="text">Press me</span>
          </span>
        </button>
      </div>

      <div class="meter" aria-hidden="true">
        <div class="meter-top">
          <span class="meter-label">Satisfaction</span>
          <span class="count" id="count">0</span>
        </div>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
      </div>

      <p class="hint" id="hint">Hover for lift · Click for the click · Keyboard works too</p>
    </div>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true">
      <span class="toast-pip" aria-hidden="true"></span>
      <span class="toast-text">Nice.</span>
    </div>
  </main>

  <script>
    (() => {
      const button = document.querySelector(".satisfying");
      const labelText = button.querySelector(".text");
      const countEl = document.getElementById("count");
      const fillEl = document.getElementById("fill");
      const rippleLayer = document.querySelector(".ripple-layer");
      const sparkLayer = document.querySelector(".spark-layer");
      const toast = document.querySelector(".toast");
      const toastText = document.querySelector(".toast-text");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const phrases = [
        "Nice.",
        "Again?",
        "That hit.",
        "Clean click.",
        "Keep going.",
        "Chef’s kiss.",
        "One more.",
        "Peak button.",
      ];

      let presses = 0;
      let toastTimer = 0;
      let successTimer = 0;
      let audioCtx = null;

      const labels = ["Press me", "Again", "Harder", "Yes", "More", "Delicious"];

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playClick(strength = 1) {
        const ctx = ensureAudio();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(180 + strength * 40, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);

        filter.type = "lowpass";
        filter.frequency.value = 1800;

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.12 * strength, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.16);

        const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);

        const noise = ctx.createBufferSource();
        const noiseGain = ctx.createGain();
        noise.buffer = noiseBuffer;
        noiseGain.gain.setValueAtTime(0.05 * strength, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
        noise.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);
      }

      function spawnRipple() {
        if (reduceMotion) return;
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        rippleLayer.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove());
      }

      function spawnSparks() {
        if (reduceMotion) return;
        const colors = ["#7cf0c2", "#6ea8ff", "#ff8f6b", "#ffffff", "#b8ffe0"];
        const count = 14;
        for (let i = 0; i < count; i++) {
          const spark = document.createElement("span");
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
          const dist = 48 + Math.random() * 70;
          spark.className = "spark";
          spark.style.setProperty("--x", "50%");
          spark.style.setProperty("--y", "50%");
          spark.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
          spark.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
          spark.style.setProperty("--size", `${3 + Math.random() * 4}px`);
          spark.style.setProperty("--color", colors[i % colors.length]);
          spark.style.setProperty("--delay", `${Math.random() * 40}ms`);
          sparkLayer.appendChild(spark);
          spark.addEventListener("animationend", () => spark.remove());
        }
      }

      function bumpCount() {
        presses += 1;
        countEl.textContent = String(presses);
        countEl.classList.remove("is-bump");
        void countEl.offsetWidth;
        countEl.classList.add("is-bump");
        const progress = Math.min(100, (presses % 12) / 12 * 100);
        fillEl.style.width = `${progress === 0 && presses > 0 ? 100 : progress}%`;
        if (presses % 12 === 0) {
          window.setTimeout(() => {
            fillEl.style.width = "0%";
          }, 360);
        }
        window.setTimeout(() => countEl.classList.remove("is-bump"), 220);
      }

      function showToast() {
        const phrase = phrases[Math.min(phrases.length - 1, Math.floor(Math.random() * phrases.length))];
        toastText.textContent = phrase;
        toast.classList.add("is-on");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-on"), 1200);
      }

      function setPressed(on) {
        button.classList.toggle("is-pressed", on);
      }

      function fire() {
        button.classList.remove("is-fired");
        void button.offsetWidth;
        button.classList.add("is-fired");
        button.classList.add("is-success");
        labelText.textContent = labels[Math.min(labels.length - 1, presses % labels.length)];

        spawnRipple();
        spawnSparks();
        bumpCount();
        showToast();
        playClick(0.85 + Math.min(presses, 8) * 0.02);

        window.clearTimeout(successTimer);
        successTimer = window.setTimeout(() => {
          button.classList.remove("is-success", "is-fired");
          if (presses > 0) labelText.textContent = labels[Math.min(labels.length - 1, presses % labels.length)];
        }, 700);
      }

      button.addEventListener("pointermove", (e) => {
        const rect = button.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        button.style.setProperty("--mx", `${x}%`);
        button.style.setProperty("--my", `${y}%`);
      });

      button.addEventListener("pointerleave", () => {
        button.style.setProperty("--mx", "50%");
        button.style.setProperty("--my", "40%");
        setPressed(false);
      });

      button.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        setPressed(true);
        ensureAudio();
      });

      button.addEventListener("pointerup", (e) => {
        if (!button.classList.contains("is-pressed")) return;
        setPressed(false);
        if (e.pointerType === "mouse" && e.button !== 0) return;
        fire();
      });

      button.addEventListener("pointercancel", () => setPressed(false));

      button.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          if (!button.classList.contains("is-pressed")) {
            setPressed(true);
            ensureAudio();
          }
        }
      });

      button.addEventListener("keyup", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          if (button.classList.contains("is-pressed")) {
            setPressed(false);
            fire();
          }
        }
      });

      button.addEventListener("click", (e) => {
        // Handled by pointer/keyboard for consistent press feel
        e.preventDefault();
      });
    })();
  </script>
</body>
</html>
