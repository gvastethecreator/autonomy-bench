<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze — Drift</title>
  <style>
    :root {
      --bg: #05070c;
      --ink: #e8f4ff;
      --muted: #8aa0b8;
      --accent: #5ef0d0;
      --warm: #ffb074;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      cursor: default;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-host {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 65% at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(180deg, rgba(5, 8, 14, 0.35) 0%, transparent 18%, transparent 78%, rgba(5, 8, 14, 0.55) 100%);
      mix-blend-mode: multiply;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grainShift 0.35s steps(3) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-1%, 1%); }
      66% { transform: translate(1%, -1%); }
      100% { transform: translate(0, 0); }
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 32px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.9;
      text-shadow: 0 0 18px rgba(94, 240, 208, 0.35);
    }

    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .meter {
      text-align: right;
      font-variant-numeric: tabular-nums;
      min-width: 120px;
    }

    .meter-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .meter-value {
      font-size: 22px;
      font-weight: 300;
      color: var(--ink);
      letter-spacing: 0.06em;
    }

    .meter-value span {
      color: var(--accent);
      font-size: 13px;
      margin-left: 6px;
      letter-spacing: 0.12em;
    }

    .center-hint {
      align-self: end;
      justify-self: center;
      margin-bottom: 8vh;
      text-align: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .center-hint.visible { opacity: 1; }

    .hint-line {
      width: 48px;
      height: 1px;
      margin: 0 auto 14px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 12px rgba(94, 240, 208, 0.5);
    }

    .hint-text {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .status {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 280px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(94, 240, 208, 0.8);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .path-bar {
      width: min(220px, 40vw);
      height: 2px;
      background: rgba(138, 160, 184, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .path-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--warm));
      box-shadow: 0 0 10px rgba(94, 240, 208, 0.55);
      transition: width 0.25s ease;
    }

    .compass {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid rgba(138, 160, 184, 0.25);
      background: rgba(8, 12, 20, 0.45);
      backdrop-filter: blur(8px);
      position: relative;
      box-shadow: inset 0 0 20px rgba(94, 240, 208, 0.08);
    }

    .compass-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed rgba(94, 240, 208, 0.2);
    }

    .compass-needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 22px;
      margin-left: -1px;
      margin-top: -22px;
      transform-origin: bottom center;
      background: linear-gradient(180deg, var(--warm), transparent);
      border-radius: 2px;
      transition: transform 0.15s linear;
    }

    .compass-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(94, 240, 208, 0.7);
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, #0c1220 0%, #030508 70%);
      transition: opacity 1.6s ease, visibility 1.6s ease;
    }

    .intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      text-align: center;
      padding: 32px;
      max-width: 420px;
    }

    .intro-kicker {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
      opacity: 0;
      animation: rise 1s ease 0.2s forwards;
    }

    .intro-title {
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 200;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
      opacity: 0;
      animation: rise 1.1s ease 0.45s forwards;
    }

    .intro-body {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 28px;
      opacity: 0;
      animation: rise 1.1s ease 0.7s forwards;
    }

    .intro-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border: 1px solid rgba(94, 240, 208, 0.35);
      border-radius: 999px;
      background: rgba(94, 240, 208, 0.06);
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      opacity: 0;
      animation: rise 1s ease 1s forwards;
    }

    .intro-cta:hover,
    .intro-cta:focus-visible {
      background: rgba(94, 240, 208, 0.14);
      border-color: rgba(94, 240, 208, 0.7);
      box-shadow: 0 0 28px rgba(94, 240, 208, 0.2);
      outline: none;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-flash {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(94, 240, 208, 0.18), transparent 55%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .fade-flash.on { opacity: 1; }

    @media (max-width: 640px) {
      .meter-value { font-size: 18px; }
      .compass { width: 52px; height: 52px; }
      .brand-sub { display: none; }
      .center-hint { margin-bottom: 12vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain { animation: none; }
      .pulse { animation: none; }
      .intro-kicker, .intro-title, .intro-body, .intro-cta {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-host" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="fade-flash" id="flash" aria-hidden="true"></div>

  <div class="hud" aria-live="polite">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-title">Drift Protocol</div>
        <div class="brand-sub">Autonomous corridor survey</div>
      </div>
      <div class="meter">
        <div class="meter-label">Depth</div>
        <div class="meter-value" id="depth">0<span>cells</span></div>
      </div>
    </div>

    <div class="center-hint" id="hint">
      <div class="hint-line"></div>
      <div class="hint-text">Self-navigating</div>
    </div>

    <div class="bottom-bar">
      <div class="status">
        <div class="status-row">
          <span class="pulse" aria-hidden="true"></span>
          <span id="mode">Seeking path</span>
        </div>
        <div class="path-bar" aria-hidden="true">
          <div class="path-fill" id="pathFill"></div>
        </div>
        <div class="status-row" id="choice">Junction: —</div>
      </div>
      <div class="compass" aria-hidden="true" title="Heading">
        <div class="compass-ring"></div>
        <div class="compass-needle" id="needle"></div>
        <div class="compass-hub"></div>
      </div>
    </div>
  </div>

  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro-card">
      <div class="intro-kicker">Presentation build</div>
      <h1 class="intro-title" id="intro-title">INFINITE</h1>
      <p class="intro-body">
        A first-person corridor that never ends. The camera walks itself —
        choosing turns, lingering at junctions, and drifting deeper into
        bioluminescent stone.
      </p>
      <button class="intro-cta" id="enterBtn" type="button">Enter the drift</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
import * as THREE from 'three';

/* ============================================================
   Infinite self-navigating first-person maze
   Art direction: bioluminescent ruin corridors
   ============================================================ */

const CELL = 5;
const WALL_H = 3.4;
const WALL_T = 0.28;
const VIEW_RADIUS = 10;
const KEEP_RADIUS = 14;
const MOVE_SPEED = 2.35;
const LOOK_LERP = 4.2;
const TURN_PAUSE = 0.55;
const JUNCTION_LOOK = 0.85;

const DIRS = [
  { dx: 0, dz: -1, bit: 1, name: 'N', yaw: Math.PI },
  { dx: 1, dz: 0, bit: 2, name: 'E', yaw: -Math.PI / 2 },
  { dx: 0, dz: 1, bit: 4, name: 'S', yaw: 0 },
  { dx: -1, dz: 0, bit: 8, name: 'W', yaw: Math.PI / 2 },
];

const OPP = [2, 3, 0, 1];

/* ---------- Deterministic hash ---------- */
function hash2(x, z) {
  let n = (x * 374761393 + z * 668265263) | 0;
  n = (n ^ (n >>> 13)) * 1274126177;
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967295;
}

function edgeOpen(x1, z1, x2, z2) {
  const ax = Math.min(x1, x2);
  const az = Math.min(z1, z2);
  const bx = Math.max(x1, x2);
  const bz = Math.max(z1, z2);
  const h = hash2(ax * 73856093 ^ bx, az * 19349663 ^ bz);
  // Spanning-tree bias: always open toward "parent" for connectivity
  const parentPrefer =
    (bx > ax && hash2(ax, az) > 0.5) ||
    (bz > az && hash2(ax + 17, az + 31) > 0.5);
  if (parentPrefer && h < 0.72) return true;
  // Extra loops for interesting junctions
  return h < 0.38;
}

function cellPassages(x, z) {
  let mask = 0;
  for (let i = 0; i < 4; i++) {
    const nx = x + DIRS[i].dx;
    const nz = z + DIRS[i].dz;
    if (edgeOpen(x, z, nx, nz)) mask |= DIRS[i].bit;
  }
  // Guarantee at least one exit (rare dead-end fix)
  if (mask === 0) {
    const i = Math.floor(hash2(x, z) * 4) % 4;
    mask |= DIRS[i].bit;
  }
  return mask;
}

/* ---------- Canvas textures ---------- */
function makeNoiseTexture(size, tint, contrast = 0.35) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = Math.random();
    const v = Math.floor((0.35 + n * contrast) * 255);
    img.data[i] = Math.floor(v * tint[0]);
    img.data[i + 1] = Math.floor(v * tint[1]);
    img.data[i + 2] = Math.floor(v * tint[2]);
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // Vein overlays
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 18; i++) {
    ctx.strokeStyle = `rgba(70, 220, 200, ${0.04 + Math.random() * 0.08})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath();
    let x = Math.random() * size;
    let y = Math.random() * size;
    ctx.moveTo(x, y);
    for (let s = 0; s < 6; s++) {
      x += (Math.random() - 0.5) * size * 0.35;
      y += (Math.random() - 0.5) * size * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeFloorTexture() {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0b1018';
  ctx.fillRect(0, 0, size, size);
  // Stone tiles
  ctx.strokeStyle = 'rgba(90, 120, 140, 0.18)';
  ctx.lineWidth = 1;
  const tile = 32;
  for (let y = 0; y <= size; y += tile) {
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(size, y + 0.5);
    ctx.stroke();
  }
  for (let x = 0; x <= size; x += tile) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, size);
    ctx.stroke();
  }
  // Soft glow runes
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 18);
    g.addColorStop(0, 'rgba(94, 240, 208, 0.16)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(x - 18, y - 18, 36, 36);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------- Scene bootstrap ---------- */
const host = document.getElementById('canvas-host');
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.fog = new THREE.FogExp2(0x070b14, 0.085);

const camera = new THREE.PerspectiveCamera(
  68,
  window.innerWidth / window.innerHeight,
  0.08,
  80
);
camera.position.set(0, 1.55, 0);

const amb = new THREE.AmbientLight(0x1a2436, 0.55);
scene.add(amb);

const hemi = new THREE.HemisphereLight(0x3a5a78, 0x0a0806, 0.35);
scene.add(hemi);

const playerLight = new THREE.PointLight(0x7ee8d8, 1.8, 14, 2);
playerLight.position.set(0, 1.4, 0);
scene.add(playerLight);

const warmLight = new THREE.PointLight(0xffa060, 0.9, 10, 2);
warmLight.position.set(0, 1.2, 0);
scene.add(warmLight);

const wallTex = makeNoiseTexture(256, [0.55, 0.62, 0.72], 0.4);
wallTex.repeat.set(1.2, 1);
const wallMat = new THREE.MeshStandardMaterial({
  map: wallTex,
  color: 0x8aa0b4,
  roughness: 0.88,
  metalness: 0.08,
  emissive: 0x0a2a28,
  emissiveIntensity: 0.15,
});

const accentMat = new THREE.MeshStandardMaterial({
  color: 0x5ef0d0,
  emissive: 0x5ef0d0,
  emissiveIntensity: 1.4,
  roughness: 0.35,
  metalness: 0.2,
});

const floorTex = makeFloorTexture();
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTex,
  color: 0x6a7a8c,
  roughness: 0.72,
  metalness: 0.15,
  emissive: 0x041814,
  emissiveIntensity: 0.2,
});

const ceilMat = new THREE.MeshStandardMaterial({
  color: 0x1a2230,
  roughness: 0.95,
  metalness: 0.05,
  emissive: 0x050810,
  emissiveIntensity: 0.3,
});

/* ---------- Instanced / pooled geometry ---------- */
const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
const pillarGeo = new THREE.BoxGeometry(WALL_T * 1.4, WALL_H, WALL_T * 1.4);
const stripGeo = new THREE.BoxGeometry(CELL * 0.92, 0.04, 0.04);
const floorGeo = new THREE.PlaneGeometry(CELL, CELL);
const ceilGeo = new THREE.PlaneGeometry(CELL, CELL);
const orbGeo = new THREE.SphereGeometry(0.08, 10, 10);

const cells = new Map(); // key -> cell visual group data
const visited = new Set();

function keyOf(x, z) {
  return `${x},${z}`;
}

function worldPos(x, z) {
  return new THREE.Vector3(x * CELL, 0, z * CELL);
}

function addCell(x, z) {
  const k = keyOf(x, z);
  if (cells.has(k)) return cells.get(k);

  const mask = cellPassages(x, z);
  const group = new THREE.Group();
  group.position.set(x * CELL, 0, z * CELL);

  // Floor
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  group.add(floor);

  // Ceiling
  const ceil = new THREE.Mesh(ceilGeo, ceilMat);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = WALL_H;
  group.add(ceil);

  // Walls for closed sides
  for (let i = 0; i < 4; i++) {
    if (mask & DIRS[i].bit) continue;
    const wall = new THREE.Mesh(wallGeo, wallMat);
    const d = DIRS[i];
    wall.position.set(d.dx * (CELL / 2 - WALL_T / 2), WALL_H / 2, d.dz * (CELL / 2 - WALL_T / 2));
    if (i % 2 === 1) wall.rotation.y = Math.PI / 2;
    group.add(wall);

    // Bioluminescent strip near base
    const strip = new THREE.Mesh(stripGeo, accentMat);
    strip.position.set(
      d.dx * (CELL / 2 - WALL_T - 0.02),
      0.35,
      d.dz * (CELL / 2 - WALL_T - 0.02)
    );
    if (i % 2 === 1) strip.rotation.y = Math.PI / 2;
    group.add(strip);
  }

  // Corner pillars always
  const offsets = [
    [1, 1], [1, -1], [-1, 1], [-1, -1],
  ];
  for (const [ox, oz] of offsets) {
    const pillar = new THREE.Mesh(pillarGeo, wallMat);
    pillar.position.set(ox * (CELL / 2 - WALL_T * 0.3), WALL_H / 2, oz * (CELL / 2 - WALL_T * 0.3));
    group.add(pillar);
  }

  // Junction / landmark orbs
  const exits = popcount(mask);
  let light = null;
  if (exits >= 3 || hash2(x, z) > 0.82) {
    const orb = new THREE.Mesh(orbGeo, accentMat);
    orb.position.set(0, 2.55, 0);
    group.add(orb);
    const warm = hash2(x + 3, z + 7) > 0.55;
    light = new THREE.PointLight(warm ? 0xffa060 : 0x5ef0d0, warm ? 1.1 : 0.85, 8, 2);
    light.position.set(0, 2.4, 0);
    group.add(light);
  }

  scene.add(group);
  const data = { x, z, mask, group, light, exits };
  cells.set(k, data);
  return data;
}

function popcount(n) {
  let c = 0;
  while (n) {
    c += n & 1;
    n >>= 1;
  }
  return c;
}

function pruneCells(cx, cz) {
  for (const [k, data] of cells) {
    const dx = data.x - cx;
    const dz = data.z - cz;
    if (dx * dx + dz * dz > KEEP_RADIUS * KEEP_RADIUS) {
      scene.remove(data.group);
      data.group.traverse((obj) => {
        if (obj.isPointLight) obj.dispose?.();
      });
      cells.delete(k);
    }
  }
}

function ensureNeighborhood(cx, cz) {
  for (let z = cz - VIEW_RADIUS; z <= cz + VIEW_RADIUS; z++) {
    for (let x = cx - VIEW_RADIUS; x <= cx + VIEW_RADIUS; x++) {
      const dx = x - cx;
      const dz = z - cz;
      if (dx * dx + dz * dz <= VIEW_RADIUS * VIEW_RADIUS) addCell(x, z);
    }
  }
  pruneCells(cx, cz);
}

/* ---------- Dust particles ---------- */
const DUST_COUNT = 400;
const dustPositions = new Float32Array(DUST_COUNT * 3);
const dustVel = [];
for (let i = 0; i < DUST_COUNT; i++) {
  dustPositions[i * 3] = (Math.random() - 0.5) * 30;
  dustPositions[i * 3 + 1] = Math.random() * WALL_H;
  dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 30;
  dustVel.push({
    y: 0.05 + Math.random() * 0.12,
    phase: Math.random() * Math.PI * 2,
  });
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xa8e8ff,
  size: 0.035,
  transparent: true,
  opacity: 0.45,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* ---------- Navigator state ---------- */
const nav = {
  cellX: 0,
  cellZ: 0,
  from: new THREE.Vector3(0, 1.55, 0),
  to: new THREE.Vector3(0, 1.55, 0),
  yaw: 0,
  targetYaw: 0,
  t: 1,
  speed: MOVE_SPEED,
  state: 'move', // move | pause | look
  timer: 0,
  depth: 0,
  pathProgress: 0,
  lastChoice: 'Origin',
  headingBit: 4, // start facing south
};

visited.add(keyOf(0, 0));
ensureNeighborhood(0, 0);

function openDirs(mask) {
  const list = [];
  for (let i = 0; i < 4; i++) {
    if (mask & DIRS[i].bit) list.push(i);
  }
  return list;
}

function chooseNextDir(cellX, cellZ, incomingBit) {
  const cell = addCell(cellX, cellZ);
  const options = openDirs(cell.mask);
  const reverse = OPP[DIRS.findIndex((d) => d.bit === incomingBit)];

  // Prefer unvisited
  const scored = options.map((dirIdx) => {
    const d = DIRS[dirIdx];
    const nx = cellX + d.dx;
    const nz = cellZ + d.dz;
    const k = keyOf(nx, nz);
    let score = hash2(nx * 13 + nav.depth, nz * 29 + cellX) * 0.4;
    if (!visited.has(k)) score += 2.5;
    if (dirIdx === reverse) score -= 1.8; // avoid immediate U-turn
    // Slight forward bias
    if (d.bit === incomingBit) score += 0.6;
    // Prefer junctions ahead
    const ahead = cellPassages(nx, nz);
    if (popcount(ahead) >= 3) score += 0.45;
    return { dirIdx, score, nx, nz };
  });

  scored.sort((a, b) => b.score - a.score);

  // Soft random among top choices
  let pick = scored[0];
  if (scored.length > 1 && hash2(cellX + nav.depth, cellZ) > 0.72) {
    pick = scored[Math.min(1, scored.length - 1)];
  }
  return pick;
}

function beginSegment(dirIdx) {
  const d = DIRS[dirIdx];
  const nx = nav.cellX + d.dx;
  const nz = nav.cellZ + d.dz;
  visited.add(keyOf(nx, nz));
  nav.from.set(nav.cellX * CELL, 1.55, nav.cellZ * CELL);
  nav.to.set(nx * CELL, 1.55, nz * CELL);
  nav.targetYaw = d.yaw;
  nav.headingBit = d.bit;
  nav.t = 0;
  nav.cellX = nx;
  nav.cellZ = nz;
  nav.depth += 1;
  nav.state = 'move';
  nav.lastChoice = d.name;
  ensureNeighborhood(nx, nz);
}

function arriveAtCell() {
  const cell = addCell(nav.cellX, nav.cellZ);
  const exits = openDirs(cell.mask);
  const isJunction = exits.length >= 3;
  const pick = chooseNextDir(nav.cellX, nav.cellZ, nav.headingBit);

  if (isJunction) {
    nav.state = 'look';
    nav.timer = JUNCTION_LOOK * (0.7 + hash2(nav.cellX, nav.cellZ) * 0.6);
    nav.pending = pick;
    nav.lastChoice = `Junction → ${DIRS[pick.dirIdx].name}`;
    flashMoment();
  } else if (exits.length === 1) {
    nav.state = 'pause';
    nav.timer = TURN_PAUSE * 0.6;
    nav.pending = pick;
    nav.lastChoice = `Turn → ${DIRS[pick.dirIdx].name}`;
  } else {
    // Check if we need a turn
    const turning = DIRS[pick.dirIdx].bit !== nav.headingBit;
    if (turning) {
      nav.state = 'pause';
      nav.timer = TURN_PAUSE * (0.5 + hash2(nav.cellZ, nav.cellX) * 0.5);
      nav.pending = pick;
      nav.lastChoice = `Turn → ${DIRS[pick.dirIdx].name}`;
    } else {
      nav.pending = pick;
      beginSegment(pick.dirIdx);
      nav.lastChoice = `Forward · ${DIRS[pick.dirIdx].name}`;
    }
  }
}

function flashMoment() {
  const el = document.getElementById('flash');
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 350);
}

// Kick off first move south
{
  const pick = chooseNextDir(0, 0, 4);
  beginSegment(pick.dirIdx);
}

/* ---------- Audio (procedural drone) ---------- */
let audioCtx = null;
let masterGain = null;

function startAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0;
  masterGain.connect(audioCtx.destination);

  const makeDrone = (freq, type, gainVal, detune = 0) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    f.type = 'lowpass';
    f.frequency.value = 600;
    g.gain.value = gainVal;
    osc.connect(f);
    f.connect(g);
    g.connect(masterGain);
    osc.start();
    return { osc, g, f };
  };

  makeDrone(55, 'sine', 0.22);
  makeDrone(82.5, 'triangle', 0.08, 6);
  makeDrone(110, 'sine', 0.05, -4);

  // Soft noise bed
  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.04;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 400;
  nf.Q.value = 0.6;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(masterGain);
  noise.start();

  masterGain.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 2.5);
}

/* ---------- UI refs ---------- */
const depthEl = document.getElementById('depth');
const modeEl = document.getElementById('mode');
const choiceEl = document.getElementById('choice');
const pathFill = document.getElementById('pathFill');
const needle = document.getElementById('needle');
const hint = document.getElementById('hint');
const intro = document.getElementById('intro');
const enterBtn = document.getElementById('enterBtn');

let running = false;
let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

enterBtn.addEventListener('click', () => {
  intro.classList.add('hidden');
  running = true;
  startAudio();
  hint.classList.add('visible');
  setTimeout(() => hint.classList.remove('visible'), 3200);
});

enterBtn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    enterBtn.click();
  }
});

/* ---------- Animation loop ---------- */
const clock = new THREE.Clock();
let bobPhase = 0;
let uiAccum = 0;

function shortestAngle(from, to) {
  let d = to - from;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (running) {
    updateNav(dt, t);
  } else {
    // Idle sway on intro
    camera.position.y = 1.55 + Math.sin(t * 0.7) * 0.02;
    camera.rotation.y = Math.sin(t * 0.15) * 0.08;
  }

  // Dust follows camera
  const positions = dust.geometry.attributes.position.array;
  for (let i = 0; i < DUST_COUNT; i++) {
    const ix = i * 3;
    positions[ix + 1] += dustVel[i].y * dt;
    positions[ix] += Math.sin(t * 0.4 + dustVel[i].phase) * 0.01;
    if (positions[ix + 1] > WALL_H) {
      positions[ix] = camera.position.x + (Math.random() - 0.5) * 24;
      positions[ix + 1] = 0.1;
      positions[ix + 2] = camera.position.z + (Math.random() - 0.5) * 24;
    }
    // Keep near camera
    const dx = positions[ix] - camera.position.x;
    const dz = positions[ix + 2] - camera.position.z;
    if (dx * dx + dz * dz > 18 * 18) {
      positions[ix] = camera.position.x + (Math.random() - 0.5) * 16;
      positions[ix + 2] = camera.position.z + (Math.random() - 0.5) * 16;
    }
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Lights track player with offset
  playerLight.position.x = camera.position.x;
  playerLight.position.y = camera.position.y + 0.2;
  playerLight.position.z = camera.position.z;
  playerLight.intensity = 1.55 + Math.sin(t * 2.1) * 0.15;

  warmLight.position.x = camera.position.x + Math.sin(nav.yaw) * -1.2;
  warmLight.position.y = 1.1;
  warmLight.position.z = camera.position.z + Math.cos(nav.yaw) * -1.2;
  warmLight.intensity = 0.7 + Math.sin(t * 1.3) * 0.12;

  // Subtle FOV breath
  if (!reducedMotion) {
    camera.fov = 68 + Math.sin(t * 0.35) * 0.8;
    camera.updateProjectionMatrix();
  }

  // Fog pulse
  scene.fog.density = 0.078 + Math.sin(t * 0.2) * 0.006;

  uiAccum += dt;
  if (uiAccum > 0.1) {
    uiAccum = 0;
    updateUI();
  }

  renderer.render(scene, camera);
}

function updateNav(dt, t) {
  // Smooth yaw always
  const yawDelta = shortestAngle(nav.yaw, nav.targetYaw);
  nav.yaw += yawDelta * Math.min(1, LOOK_LERP * dt);

  if (nav.state === 'move') {
    const dist = nav.from.distanceTo(nav.to);
    const dur = Math.max(dist / nav.speed, 0.001);
    nav.t = Math.min(1, nav.t + dt / dur);
    // Smoothstep
    const s = nav.t * nav.t * (3 - 2 * nav.t);
    camera.position.lerpVectors(nav.from, nav.to, s);
    bobPhase += dt * (reducedMotion ? 0 : 7.5);
    const bob = Math.sin(bobPhase) * 0.028;
    const sway = Math.cos(bobPhase * 0.5) * 0.012;
    camera.position.y = 1.55 + bob;
    nav.pathProgress = s;

    if (nav.t >= 1) {
      camera.position.x = nav.to.x;
      camera.position.z = nav.to.z;
      arriveAtCell();
    }
    camera.rotation.order = 'YXZ';
    camera.rotation.y = nav.yaw;
    camera.rotation.x = Math.sin(bobPhase * 0.5) * 0.015;
    camera.rotation.z = sway * 0.4;
  } else if (nav.state === 'pause' || nav.state === 'look') {
    nav.timer -= dt;
    camera.position.y = 1.55 + Math.sin(t * 1.4) * 0.01;
    camera.rotation.order = 'YXZ';

    if (nav.state === 'look' && nav.pending) {
      // Glance toward chosen exit before committing
      const glanceYaw = DIRS[nav.pending.dirIdx].yaw;
      const mix = 1 - Math.max(0, nav.timer / JUNCTION_LOOK);
      const gy = nav.yaw + shortestAngle(nav.yaw, glanceYaw) * Math.min(1, mix * 1.4);
      camera.rotation.y = gy;
      camera.rotation.x = Math.sin(t * 0.8) * 0.02;
    } else {
      camera.rotation.y = nav.yaw;
      camera.rotation.x = Math.sin(t * 0.9) * 0.012;
    }
    camera.rotation.z = 0;

    if (nav.timer <= 0 && nav.pending) {
      const pick = nav.pending;
      nav.pending = null;
      beginSegment(pick.dirIdx);
    }
  }
}

function updateUI() {
  depthEl.innerHTML = `${nav.depth}<span>cells</span>`;
  pathFill.style.width = `${Math.floor(nav.pathProgress * 100)}%`;
  choiceEl.textContent = `Path: ${nav.lastChoice}`;

  if (nav.state === 'move') modeEl.textContent = 'Drifting corridor';
  else if (nav.state === 'look') modeEl.textContent = 'Reading junction';
  else modeEl.textContent = 'Aligning heading';

  const deg = (-nav.yaw * 180) / Math.PI;
  needle.style.transform = `rotate(${deg}deg)`;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Space / click anywhere after intro also works via button focus
window.addEventListener('keydown', (e) => {
  if (!running && (e.key === 'Enter' || e.key === ' ')) {
    enterBtn.click();
  }
});

animate();
  </script>
