<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #d8e0f0;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    #title {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      font-weight: 300;
      font-size: clamp(0.75rem, 2vw, 1rem);
      color: rgba(180, 210, 255, 0.55);
      transition: opacity 2.5s ease;
    }
    #title.fade { opacity: 0; }
    #stats {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(160, 190, 230, 0.45);
    }
    #stats span strong {
      display: block;
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(200, 225, 255, 0.85);
      font-variant-numeric: tabular-nums;
    }
    #hint {
      position: absolute;
      bottom: 2.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(140, 170, 210, 0.28);
    }
    #scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="vignette"></div>
    <div id="scan"></div>
    <div id="title">Infinite Maze</div>
    <div id="stats">
      <span>Depth<strong id="depth">0</strong></span>
      <span>Turns<strong id="turns">0</strong></span>
      <span>Elapsed<strong id="elapsed">0:00</strong></span>
    </div>
    <div id="hint">Autopilot · Endless corridors</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from "three";

/* ── Config ─────────────────────────────────────────────── */
const CELL = 4;
const WALL_H = 3.2;
const WALL_T = 0.28;
const EYE = 1.55;
const MOVE_SPEED = 2.35;      // cells per second equivalent via world units
const TURN_SPEED = 1.85;      // rad/s
const LOOKAHEAD = 0.55;
const FOG_COLOR = 0x07070c;
const FOG_NEAR = 4;
const FOG_FAR = 28;
const GEN_RADIUS = 10;
const CULL_RADIUS = 16;
const LIGHT_SPACING = 3;

/* ── Seeded RNG ─────────────────────────────────────────── */
function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
const rand = mulberry32(seed);

/* ── Maze graph (sparse infinite grid) ──────────────────── */
const N = [0, -1], S = [0, 1], E = [1, 0], W = [-1, 0];
const DIRS = [N, E, S, W];
const DIR_NAMES = ["N", "E", "S", "W"];
const OPP = { N: "S", S: "N", E: "W", W: "E" };
const DIR_VEC = { N: N, E: E, S: S, W: W };
// yaw 0 looks down -Z (North); +yaw turns toward +X (East)
const YAW = { N: 0, E: Math.PI / 2, S: Math.PI, W: -Math.PI / 2 };

const cells = new Map(); // "x,z" -> { walls: {N,E,S,W:bool}, carved }

function key(x, z) { return x + "," + z; }

function ensureCell(x, z) {
  const k = key(x, z);
  let c = cells.get(k);
  if (!c) {
    c = { x, z, walls: { N: true, E: true, S: true, W: true }, carved: false };
    cells.set(k, c);
  }
  return c;
}

function carve(x, z, dirName) {
  const a = ensureCell(x, z);
  const [dx, dz] = DIR_VEC[dirName];
  const b = ensureCell(x + dx, z + dz);
  a.walls[dirName] = false;
  b.walls[OPP[dirName]] = false;
  a.carved = true;
  b.carved = true;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (rand() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** Grow maze around (cx,cz) with recursive backtracking into uncarved neighbors. */
function growMaze(cx, cz, budget = 80) {
  ensureCell(cx, cz).carved = true;
  const stack = [[cx, cz]];
  let carved = 0;

  while (stack.length && carved < budget) {
    const [x, z] = stack[stack.length - 1];
    const options = shuffle(
      DIR_NAMES.filter((d) => {
        const [dx, dz] = DIR_VEC[d];
        const n = ensureCell(x + dx, z + dz);
        return !n.carved;
      })
    );
    if (!options.length) {
      stack.pop();
      continue;
    }
    const d = options[0];
    carve(x, z, d);
    const [dx, dz] = DIR_VEC[d];
    stack.push([x + dx, z + dz]);
    carved++;
  }

  // Occasional loops for more interesting topology
  if (rand() < 0.35) {
    const candidates = [];
    for (const c of cells.values()) {
      const dx = c.x - cx, dz = c.z - cz;
      if (dx * dx + dz * dz > GEN_RADIUS * GEN_RADIUS) continue;
      for (const d of DIR_NAMES) {
        if (!c.walls[d]) continue;
        const [ox, oz] = DIR_VEC[d];
        const n = cells.get(key(c.x + ox, c.z + oz));
        if (n && n.carved) candidates.push([c.x, c.z, d]);
      }
    }
    if (candidates.length) {
      const [x, z, d] = candidates[(rand() * candidates.length) | 0];
      carve(x, z, d);
    }
  }
}

function openDirs(x, z) {
  const c = cells.get(key(x, z));
  if (!c) return [];
  return DIR_NAMES.filter((d) => !c.walls[d]);
}

/* ── Three.js scene ─────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.Fog(FOG_COLOR, FOG_NEAR, FOG_FAR);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.08, 60);
camera.position.set(0, EYE, 0);

scene.add(new THREE.AmbientLight(0x1a2030, 0.55));
const hemi = new THREE.HemisphereLight(0x3a4560, 0x0a0806, 0.35);
scene.add(hemi);

/* Materials */
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x1c2230,
  roughness: 0.88,
  metalness: 0.08,
  flatShading: false,
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x10141c,
  roughness: 0.95,
  metalness: 0.05,
});
const ceilMat = new THREE.MeshStandardMaterial({
  color: 0x0c1018,
  roughness: 0.92,
  metalness: 0.04,
});
const trimMat = new THREE.MeshStandardMaterial({
  color: 0x2a3548,
  roughness: 0.55,
  metalness: 0.35,
  emissive: 0x0a1525,
  emissiveIntensity: 0.4,
});
const lightGlowMat = new THREE.MeshBasicMaterial({
  color: 0x6ec8ff,
  transparent: true,
  opacity: 0.85,
});

/* Shared geometries */
const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, WALL_T);
const floorGeo = new THREE.PlaneGeometry(CELL, CELL);
const ceilGeo = new THREE.PlaneGeometry(CELL, CELL);
const trimGeo = new THREE.BoxGeometry(CELL * 0.92, 0.06, WALL_T * 1.15);
const bulbGeo = new THREE.SphereGeometry(0.08, 10, 8);
const postGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.35, 8);

const wallGroup = new THREE.Group();
const floorGroup = new THREE.Group();
const decorGroup = new THREE.Group();
scene.add(wallGroup, floorGroup, decorGroup);

const built = new Set(); // cells with meshes
const lights = [];

function cellWorld(x, z) {
  return new THREE.Vector3(x * CELL, 0, z * CELL);
}

function addWall(x, z, dir) {
  const mesh = new THREE.Mesh(wallGeo, wallMat);
  const cx = x * CELL, cz = z * CELL;
  mesh.position.y = WALL_H / 2;
  if (dir === "N") {
    mesh.position.set(cx, WALL_H / 2, cz - CELL / 2);
  } else if (dir === "S") {
    mesh.position.set(cx, WALL_H / 2, cz + CELL / 2);
  } else if (dir === "E") {
    mesh.rotation.y = Math.PI / 2;
    mesh.position.set(cx + CELL / 2, WALL_H / 2, cz);
  } else {
    mesh.rotation.y = Math.PI / 2;
    mesh.position.set(cx - CELL / 2, WALL_H / 2, cz);
  }
  wallGroup.add(mesh);

  // Base trim
  const trim = new THREE.Mesh(trimGeo, trimMat);
  trim.position.copy(mesh.position);
  trim.position.y = 0.08;
  trim.rotation.y = mesh.rotation.y;
  wallGroup.add(trim);

  // Top trim
  const trim2 = trim.clone();
  trim2.position.y = WALL_H - 0.1;
  wallGroup.add(trim2);
}

function addCellMeshes(x, z) {
  const k = key(x, z);
  if (built.has(k)) return;
  const c = cells.get(k);
  if (!c || !c.carved) return;
  built.add(k);

  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(x * CELL, 0, z * CELL);
  floorGroup.add(floor);

  const ceil = new THREE.Mesh(ceilGeo, ceilMat);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.set(x * CELL, WALL_H, z * CELL);
  floorGroup.add(ceil);

  for (const d of DIR_NAMES) {
    if (c.walls[d]) addWall(x, z, d);
  }

  // Ceiling light every few cells
  if (((x + z * 3) % LIGHT_SPACING) === 0) {
    const bulb = new THREE.Mesh(bulbGeo, lightGlowMat);
    bulb.position.set(x * CELL, WALL_H - 0.12, z * CELL);
    decorGroup.add(bulb);

    const post = new THREE.Mesh(postGeo, trimMat);
    post.position.set(x * CELL, WALL_H - 0.28, z * CELL);
    decorGroup.add(post);

    const pl = new THREE.PointLight(0x7ec8ff, 1.35, CELL * 3.2, 1.6);
    pl.position.set(x * CELL, WALL_H - 0.35, z * CELL);
    scene.add(pl);
    lights.push({ light: pl, x, z });

    // Warm accent occasionally
    if (rand() < 0.22) {
      const warm = new THREE.PointLight(0xffaa66, 0.55, CELL * 2.2, 2);
      warm.position.set(
        x * CELL + (rand() - 0.5) * 1.2,
        0.9,
        z * CELL + (rand() - 0.5) * 1.2
      );
      scene.add(warm);
      lights.push({ light: warm, x, z });
    }
  }
}

function syncWorld(px, pz) {
  growMaze(px, pz, 100);
  for (let dx = -GEN_RADIUS; dx <= GEN_RADIUS; dx++) {
    for (let dz = -GEN_RADIUS; dz <= GEN_RADIUS; dz++) {
      if (dx * dx + dz * dz > GEN_RADIUS * GEN_RADIUS) continue;
      const x = px + dx, z = pz + dz;
      ensureCell(x, z);
      if (!cells.get(key(x, z)).carved) {
        // Connect frontier cells into the maze
        const neighbors = DIR_NAMES.filter((d) => {
          const [ox, oz] = DIR_VEC[d];
          const n = cells.get(key(x + ox, z + oz));
          return n && n.carved;
        });
        if (neighbors.length) {
          carve(x, z, neighbors[(rand() * neighbors.length) | 0]);
          growMaze(x, z, 40);
        }
      }
      addCellMeshes(x, z);
    }
  }

  // Cull distant lights for performance
  for (let i = lights.length - 1; i >= 0; i--) {
    const L = lights[i];
    const ddx = L.x - px, ddz = L.z - pz;
    if (ddx * ddx + ddz * ddz > CULL_RADIUS * CULL_RADIUS) {
      scene.remove(L.light);
      L.light.dispose?.();
      lights.splice(i, 1);
    }
  }
}

/* ── Navigation AI ──────────────────────────────────────── */
let cellX = 0, cellZ = 0;
let facing = "S";
let targetYaw = YAW[facing];
let camYaw = targetYaw;
let pos = new THREE.Vector3(0, EYE, 0);
let vel = 0;
let bobPhase = 0;
let turnCount = 0;
let depthMax = 0;
let startTime = performance.now();
let turnLock = false; // true while rotating in place at a junction

growMaze(0, 0, 200);
syncWorld(0, 0);

function pickDirection(x, z, current) {
  const opens = openDirs(x, z);
  if (!opens.length) return current;
  if (opens.includes(current) && rand() < 0.58) return current;

  const forwardish = opens.filter((d) => d !== OPP[current]);
  const pool = forwardish.length ? forwardish : opens;

  let best = pool[0];
  let bestScore = -Infinity;
  for (const d of pool) {
    const [dx, dz] = DIR_VEC[d];
    const nx = x + dx, nz = z + dz;
    let score = rand() * 0.9;
    if (d === current) score += 1.0;
    const nextOpens = openDirs(nx, nz).length;
    if (nextOpens === 2) score += 0.4;
    if (nextOpens >= 3) score += 0.2;
    if (nextOpens === 1) score -= 0.55;
    score += (Math.abs(nx) + Math.abs(nz)) * 0.025;
    if (score > bestScore) {
      bestScore = score;
      best = d;
    }
  }
  return best;
}

function shortestAngle(from, to) {
  let d = to - from;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function commitTurn(next) {
  if (next === facing) return;
  turnCount++;
  facing = next;
  targetYaw = YAW[facing];
  turnLock = true;
}

/* ── Particles (dust motes) ─────────────────────────────── */
const DUST_N = 180;
const dustPos = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3] = (rand() - 0.5) * 40;
  dustPos[i * 3 + 1] = rand() * WALL_H;
  dustPos[i * 3 + 2] = (rand() - 0.5) * 40;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xa8c8ff,
  size: 0.035,
  transparent: true,
  opacity: 0.35,
  depthWrite: false,
  sizeAttenuation: true,
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* ── UI ─────────────────────────────────────────────────── */
const elDepth = document.getElementById("depth");
const elTurns = document.getElementById("turns");
const elElapsed = document.getElementById("elapsed");
const elTitle = document.getElementById("title");
setTimeout(() => elTitle.classList.add("fade"), 3500);

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}

/* ── Resize ─────────────────────────────────────────────── */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── Main loop ──────────────────────────────────────────── */
const clock = new THREE.Clock();
let lastGenX = 0, lastGenZ = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  const yawErr = shortestAngle(camYaw, targetYaw);

  // Rotate toward target yaw; slow while turning
  if (Math.abs(yawErr) > 0.002) {
    const step = Math.sign(yawErr) * Math.min(Math.abs(yawErr), TURN_SPEED * dt);
    camYaw += step;
    vel = THREE.MathUtils.lerp(vel, MOVE_SPEED * 0.15, 1 - Math.exp(-4 * dt));
  } else {
    camYaw = targetYaw;
    turnLock = false;
    vel = THREE.MathUtils.lerp(vel, MOVE_SPEED, 1 - Math.exp(-2.8 * dt));
  }

  const forward = new THREE.Vector3(Math.sin(camYaw), 0, -Math.cos(camYaw));
  if (!turnLock) pos.addScaledVector(forward, vel * dt);

  // Stay centered in the corridor
  const idealX = cellX * CELL;
  const idealZ = cellZ * CELL;
  if (facing === "N" || facing === "S") {
    pos.x = THREE.MathUtils.lerp(pos.x, idealX, 1 - Math.exp(-5 * dt));
  } else {
    pos.z = THREE.MathUtils.lerp(pos.z, idealZ, 1 - Math.exp(-5 * dt));
  }

  // Snap decision when approaching next cell center along facing
  const [fdx, fdz] = DIR_VEC[facing];
  const nextCX = (cellX + fdx) * CELL;
  const nextCZ = (cellZ + fdz) * CELL;
  const distToNext = Math.hypot(pos.x - nextCX, pos.z - nextCZ);

  // Entered a new cell?
  const nx = Math.round(pos.x / CELL);
  const nz = Math.round(pos.z / CELL);
  if (nx !== cellX || nz !== cellZ) {
    cellX = nx;
    cellZ = nz;
    const d = Math.abs(cellX) + Math.abs(cellZ);
    if (d > depthMax) depthMax = d;

    const cx = cellX * CELL, cz = cellZ * CELL;
    if (!turnLock && Math.hypot(pos.x - cx, pos.z - cz) < CELL * 0.4) {
      commitTurn(pickDirection(cellX, cellZ, facing));
    }
  }

  // Pre-turn near center if junction ahead requires it
  if (!turnLock && distToNext < LOOKAHEAD * CELL) {
    const opens = openDirs(cellX, cellZ);
    if (opens.length && !opens.includes(facing)) {
      commitTurn(pickDirection(cellX, cellZ, facing));
    }
  }

  // Wall collision safety: if facing a wall, force a turn
  const here = cells.get(key(cellX, cellZ));
  if (here && here.walls[facing] && !turnLock) {
    commitTurn(pickDirection(cellX, cellZ, facing));
  }

  // Head bob & sway
  bobPhase += dt * vel * 1.8;
  const bob = Math.sin(bobPhase) * 0.028 * (vel / MOVE_SPEED);
  const sway = Math.cos(bobPhase * 0.5) * 0.012;

  camera.position.set(pos.x + sway, EYE + bob, pos.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = camYaw;
  camera.rotation.x = Math.sin(bobPhase * 0.5) * 0.012;
  camera.rotation.z = sway * 0.4;

  // World generation
  if (Math.abs(cellX - lastGenX) + Math.abs(cellZ - lastGenZ) >= 2) {
    syncWorld(cellX, cellZ);
    lastGenX = cellX;
    lastGenZ = cellZ;
  }

  // Drift dust with camera
  const dp = dust.geometry.attributes.position.array;
  for (let i = 0; i < DUST_N; i++) {
    let x = dp[i * 3] + Math.sin(t * 0.2 + i) * 0.002;
    let y = dp[i * 3 + 1] + 0.004 * dt * 60;
    let z = dp[i * 3 + 2] + Math.cos(t * 0.15 + i * 1.7) * 0.002;
    if (y > WALL_H) y = 0.1;
    // Wrap around camera
    if (x - pos.x > 20) x -= 40;
    if (x - pos.x < -20) x += 40;
    if (z - pos.z > 20) z -= 40;
    if (z - pos.z < -20) z += 40;
    dp[i * 3] = x;
    dp[i * 3 + 1] = y;
    dp[i * 3 + 2] = z;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Subtle light pulse
  for (const L of lights) {
    if (L.light.isPointLight && L.light.color.b > 0.7) {
      L.light.intensity = 1.2 + Math.sin(t * 2.1 + L.x * 0.7 + L.z) * 0.18;
    }
  }

  // HUD
  elDepth.textContent = String(depthMax);
  elTurns.textContent = String(turnCount);
  elElapsed.textContent = formatTime(performance.now() - startTime);

  renderer.render(scene, camera);
}

animate();
  </script>
</body>
</html>
