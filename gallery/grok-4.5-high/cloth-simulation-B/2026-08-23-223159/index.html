<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloth — Soft Body Studio</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: rgba(16, 20, 28, 0.82);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #7eb8ff;
      --accent-soft: rgba(126, 184, 255, 0.18);
      --danger: #ff8b7a;
      --ok: #7ddea2;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      background:
        radial-gradient(1200px 700px at 70% 15%, rgba(90, 130, 220, 0.16), transparent 55%),
        radial-gradient(900px 600px at 15% 85%, rgba(180, 90, 140, 0.10), transparent 50%),
        linear-gradient(160deg, #090b10 0%, #10141c 45%, #0c1018 100%);
    }

    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: min(100vw, 100%);
      height: min(100vh, 100%);
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }

    .hud {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    .hud > * { pointer-events: auto; }

    .brand {
      top: 20px;
      left: 22px;
      max-width: min(420px, calc(100vw - 44px));
    }

    .brand h1 {
      font-size: clamp(1.15rem, 2.4vw, 1.55rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .panel {
      top: 20px;
      right: 20px;
      width: min(280px, calc(100vw - 40px));
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .panel h2 {
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .row label {
      font-size: 0.84rem;
      color: var(--text);
    }

    .row output {
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      color: var(--accent);
      min-width: 2.6rem;
      text-align: right;
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      outline: none;
      margin-top: -2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #0b0d12;
      box-shadow: 0 0 0 4px var(--accent-soft);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #0b0d12;
      box-shadow: 0 0 0 4px var(--accent-soft);
      cursor: pointer;
    }

    .toggles {
      display: grid;
      gap: 8px;
      margin: 4px 0 14px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
    }

    .toggle:hover { border-color: rgba(255, 255, 255, 0.08); }
    .toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .toggle span { font-size: 0.84rem; }

    .switch {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      position: relative;
      flex-shrink: 0;
      transition: background 0.18s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.18s ease;
    }

    .toggle[aria-pressed="true"] .switch {
      background: var(--accent);
    }

    .toggle[aria-pressed="true"] .switch::after {
      transform: translateX(16px);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.action {
      appearance: none;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button.action:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.16);
    }

    button.action:active { transform: translateY(1px); }

    button.action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button.action.primary {
      background: var(--accent-soft);
      border-color: rgba(126, 184, 255, 0.35);
      color: #d7eaff;
    }

    .hint {
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(10, 12, 18, 0.72);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      color: var(--muted);
      font-size: 0.8rem;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats {
      bottom: 18px;
      right: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      .brand { top: 14px; left: 14px; }
      .panel {
        top: auto;
        bottom: 58px;
        right: 12px;
        left: 12px;
        width: auto;
        padding: 12px;
      }
      .hint { display: none; }
      .stats { bottom: 14px; right: 14px; left: 14px; text-align: left; }
      .brand p { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle .switch,
      .toggle .switch::after,
      button.action { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="cloth" aria-label="Interactive cloth simulation canvas"></canvas>
  </div>

  <header class="hud brand">
    <h1>Cloth</h1>
    <p>Drag the fabric. Gusts of wind and a soft collision sphere keep the sheet alive.</p>
  </header>

  <aside class="hud panel" aria-label="Simulation controls">
    <h2>Studio</h2>

    <div class="row">
      <label for="wind">Wind</label>
      <output id="windOut" for="wind">0.35</output>
      <input id="wind" type="range" min="0" max="1" step="0.01" value="0.35" />
    </div>

    <div class="row">
      <label for="gravity">Gravity</label>
      <output id="gravityOut" for="gravity">0.55</output>
      <input id="gravity" type="range" min="0" max="1" step="0.01" value="0.55" />
    </div>

    <div class="row">
      <label for="stiffness">Stiffness</label>
      <output id="stiffnessOut" for="stiffness">0.70</output>
      <input id="stiffness" type="range" min="0.2" max="1" step="0.01" value="0.70" />
    </div>

    <div class="toggles">
      <div class="toggle" id="pinsToggle" role="button" tabindex="0" aria-pressed="true">
        <span>Pinned corners</span>
        <div class="switch" aria-hidden="true"></div>
      </div>
      <div class="toggle" id="fillToggle" role="button" tabindex="0" aria-pressed="true">
        <span>Shaded fabric</span>
        <div class="switch" aria-hidden="true"></div>
      </div>
      <div class="toggle" id="sphereToggle" role="button" tabindex="0" aria-pressed="true">
        <span>Collision sphere</span>
        <div class="switch" aria-hidden="true"></div>
      </div>
    </div>

    <div class="actions">
      <button class="action primary" id="gustBtn" type="button">Gust</button>
      <button class="action" id="resetBtn" type="button">Reset</button>
    </div>
  </aside>

  <div class="hud hint">Click and drag the cloth · Press G for a gust · R to reset</div>
  <div class="hud stats" id="stats">—</div>

  <script>
(() => {
  const canvas = document.getElementById("cloth");
  const ctx = canvas.getContext("2d", { alpha: false });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const windSlider = document.getElementById("wind");
  const gravitySlider = document.getElementById("gravity");
  const stiffnessSlider = document.getElementById("stiffness");
  const windOut = document.getElementById("windOut");
  const gravityOut = document.getElementById("gravityOut");
  const stiffnessOut = document.getElementById("stiffnessOut");
  const pinsToggle = document.getElementById("pinsToggle");
  const fillToggle = document.getElementById("fillToggle");
  const sphereToggle = document.getElementById("sphereToggle");
  const gustBtn = document.getElementById("gustBtn");
  const resetBtn = document.getElementById("resetBtn");
  const statsEl = document.getElementById("stats");

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const state = {
    wind: +windSlider.value,
    gravity: +gravitySlider.value,
    stiffness: +stiffnessSlider.value,
    pins: true,
    fill: true,
    sphere: true,
    gust: 0,
    pointer: { x: 0, y: 0, down: false, id: null },
    grabbed: null,
    grabRadius: 38,
    time: 0,
    frames: 0,
    fps: 0,
    lastFpsAt: performance.now(),
  };

  let W = 0, H = 0;
  let cloth = null;
  let sphere = { x: 0, y: 0, r: 70 };

  class Particle {
    constructor(x, y, pinned = false) {
      this.x = x;
      this.y = y;
      this.ox = x;
      this.oy = y;
      this.px = x;
      this.py = y;
      this.pinned = pinned;
      this.grabbed = false;
    }

    addForce(fx, fy, dt) {
      if (this.pinned || this.grabbed) return;
      this.x += fx * dt * dt;
      this.y += fy * dt * dt;
    }

    integrate(damping) {
      if (this.pinned || this.grabbed) {
        this.px = this.x;
        this.py = this.y;
        return;
      }
      const vx = (this.x - this.px) * damping;
      const vy = (this.y - this.py) * damping;
      this.px = this.x;
      this.py = this.y;
      this.x += vx;
      this.y += vy;
    }
  }

  class Constraint {
    constructor(a, b, rest = null) {
      this.a = a;
      this.b = b;
      this.rest = rest != null ? rest : Math.hypot(a.x - b.x, a.y - b.y);
    }

    solve(stiffness) {
      const dx = this.b.x - this.a.x;
      const dy = this.b.y - this.a.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const diff = (dist - this.rest) / dist;
      const offsetX = dx * diff * 0.5 * stiffness;
      const offsetY = dy * diff * 0.5 * stiffness;

      const aFree = !this.a.pinned && !this.a.grabbed;
      const bFree = !this.b.pinned && !this.b.grabbed;

      if (aFree && bFree) {
        this.a.x += offsetX;
        this.a.y += offsetY;
        this.b.x -= offsetX;
        this.b.y -= offsetY;
      } else if (aFree) {
        this.a.x += offsetX * 2;
        this.a.y += offsetY * 2;
      } else if (bFree) {
        this.b.x -= offsetX * 2;
        this.b.y -= offsetY * 2;
      }
    }
  }

  class Cloth {
    constructor(cols, rows, spacing, originX, originY) {
      this.cols = cols;
      this.rows = rows;
      this.spacing = spacing;
      this.particles = [];
      this.constraints = [];
      this.faces = [];

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const pinned = state.pins && y === 0 && (x === 0 || x === cols - 1 || x === Math.floor(cols / 2));
          this.particles.push(new Particle(originX + x * spacing, originY + y * spacing, pinned));
        }
      }

      const idx = (x, y) => y * cols + x;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (x < cols - 1) this.constraints.push(new Constraint(this.particles[idx(x, y)], this.particles[idx(x + 1, y)]));
          if (y < rows - 1) this.constraints.push(new Constraint(this.particles[idx(x, y)], this.particles[idx(x, y + 1)]));
          if (x < cols - 1 && y < rows - 1) {
            this.constraints.push(new Constraint(this.particles[idx(x, y)], this.particles[idx(x + 1, y + 1)]));
            this.constraints.push(new Constraint(this.particles[idx(x + 1, y)], this.particles[idx(x, y + 1)]));
          }
          if (x < cols - 2) this.constraints.push(new Constraint(this.particles[idx(x, y)], this.particles[idx(x + 2, y)], spacing * 2));
          if (y < rows - 2) this.constraints.push(new Constraint(this.particles[idx(x, y)], this.particles[idx(x, y + 2)], spacing * 2));
        }
      }

      for (let y = 0; y < rows - 1; y++) {
        for (let x = 0; x < cols - 1; x++) {
          this.faces.push([
            this.particles[idx(x, y)],
            this.particles[idx(x + 1, y)],
            this.particles[idx(x + 1, y + 1)],
            this.particles[idx(x, y + 1)],
          ]);
        }
      }
    }

    setPins(enabled) {
      const { cols } = this;
      for (let i = 0; i < this.particles.length; i++) {
        const x = i % cols;
        const y = (i / cols) | 0;
        const shouldPin = enabled && y === 0 && (x === 0 || x === cols - 1 || x === Math.floor(cols / 2));
        const p = this.particles[i];
        if (shouldPin) {
          p.pinned = true;
          p.x = p.ox;
          p.y = p.oy;
          p.px = p.ox;
          p.py = p.oy;
        } else {
          p.pinned = false;
        }
      }
    }

    reset() {
      for (const p of this.particles) {
        p.x = p.ox;
        p.y = p.oy;
        p.px = p.ox;
        p.py = p.oy;
        p.grabbed = false;
      }
      this.setPins(state.pins);
      state.grabbed = null;
      state.gust = 0;
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const targetWidth = Math.min(520, W * 0.72);
    const cols = W < 640 ? 18 : 26;
    const rows = W < 640 ? 14 : 20;
    const spacing = targetWidth / (cols - 1);
    const originX = (W - targetWidth) * 0.5;
    const originY = Math.max(88, H * 0.14);

    cloth = new Cloth(cols, rows, spacing, originX, originY);
    sphere.x = W * 0.5;
    sphere.y = originY + rows * spacing * 0.72;
    sphere.r = Math.max(48, Math.min(90, spacing * 4.2));
    state.grabRadius = Math.max(28, spacing * 2.2);
  }

  function bindToggle(el, key) {
    const sync = () => el.setAttribute("aria-pressed", String(state[key]));
    const flip = () => {
      state[key] = !state[key];
      sync();
      if (key === "pins" && cloth) cloth.setPins(state.pins);
    };
    el.addEventListener("click", flip);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        flip();
      }
    });
    sync();
  }

  function syncOutputs() {
    windOut.textContent = (+windSlider.value).toFixed(2);
    gravityOut.textContent = (+gravitySlider.value).toFixed(2);
    stiffnessOut.textContent = (+stiffnessSlider.value).toFixed(2);
    state.wind = +windSlider.value;
    state.gravity = +gravitySlider.value;
    state.stiffness = +stiffnessSlider.value;
  }

  windSlider.addEventListener("input", syncOutputs);
  gravitySlider.addEventListener("input", syncOutputs);
  stiffnessSlider.addEventListener("input", syncOutputs);
  bindToggle(pinsToggle, "pins");
  bindToggle(fillToggle, "fill");
  bindToggle(sphereToggle, "sphere");
  syncOutputs();

  gustBtn.addEventListener("click", () => { state.gust = 1; });
  resetBtn.addEventListener("click", () => { if (cloth) cloth.reset(); });

  window.addEventListener("keydown", (e) => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === "g" || e.key === "G") state.gust = 1;
    if (e.key === "r" || e.key === "R") cloth && cloth.reset();
  });

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (rect.width ? W / rect.width : 1),
      y: (e.clientY - rect.top) * (rect.height ? H / rect.height : 1),
    };
  }

  function nearestParticle(x, y, radius) {
    let best = null;
    let bestD = radius * radius;
    for (const p of cloth.particles) {
      if (p.pinned) continue;
      const dx = p.x - x;
      const dy = p.y - y;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD) {
        bestD = d2;
        best = p;
      }
    }
    return best;
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!cloth) return;
    canvas.setPointerCapture(e.pointerId);
    const pos = pointerPos(e);
    state.pointer.x = pos.x;
    state.pointer.y = pos.y;
    state.pointer.down = true;
    state.pointer.id = e.pointerId;
    const hit = nearestParticle(pos.x, pos.y, state.grabRadius);
    if (hit) {
      state.grabbed = hit;
      hit.grabbed = true;
      hit.x = pos.x;
      hit.y = pos.y;
      hit.px = pos.x;
      hit.py = pos.y;
      canvas.classList.add("dragging");
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    const pos = pointerPos(e);
    state.pointer.x = pos.x;
    state.pointer.y = pos.y;
    if (state.grabbed) {
      state.grabbed.x = pos.x;
      state.grabbed.y = pos.y;
      state.grabbed.px = pos.x;
      state.grabbed.py = pos.y;
    }
  });

  function endPointer(e) {
    if (state.pointer.id != null && e.pointerId !== state.pointer.id) return;
    if (state.grabbed) {
      state.grabbed.grabbed = false;
      state.grabbed = null;
    }
    state.pointer.down = false;
    state.pointer.id = null;
    canvas.classList.remove("dragging");
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("lostpointercapture", endPointer);

  function collideSphere() {
    if (!state.sphere) return;
    const { x: cx, y: cy, r } = sphere;
    const r2 = r * r;
    for (const p of cloth.particles) {
      if (p.pinned || p.grabbed) continue;
      const dx = p.x - cx;
      const dy = p.y - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 < r2 && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const nx = dx / d;
        const ny = dy / d;
        p.x = cx + nx * r;
        p.y = cy + ny * r;
      }
    }
  }

  function collideBounds() {
    const pad = 4;
    for (const p of cloth.particles) {
      if (p.pinned || p.grabbed) continue;
      if (p.x < pad) { p.x = pad; p.px = p.x + (p.x - p.px) * 0.3; }
      if (p.x > W - pad) { p.x = W - pad; p.px = p.x + (p.x - p.px) * 0.3; }
      if (p.y > H - pad) { p.y = H - pad; p.px = p.y + (p.y - p.py) * 0.15; p.py = p.y; }
      if (p.y < pad) { p.y = pad; }
    }
  }

  function step(dt) {
    state.time += dt;
    if (state.gust > 0) state.gust = Math.max(0, state.gust - dt * 1.4);

    const g = 980 * (0.15 + state.gravity * 1.35);
    const windBase = state.wind * 420;
    const gustBoost = state.gust * 1400;
    const flutter = Math.sin(state.time * 1.7) * 0.35 + Math.sin(state.time * 0.63 + 1.2) * 0.25;
    const windX = (windBase + gustBoost) * (0.75 + flutter);
    const windY = Math.sin(state.time * 2.1) * windBase * 0.12 - state.gust * 80;

    for (const p of cloth.particles) {
      p.addForce(0, g, dt);
      const along = (p.ox / Math.max(1, W)) * Math.PI * 2;
      const local = Math.sin(state.time * 2.4 + along * 3.0) * 0.4 + 0.8;
      p.addForce(windX * local, windY * local, dt);
    }

    const damping = reducedMotion ? 0.985 : 0.992;
    for (const p of cloth.particles) p.integrate(damping);

    const iterations = reducedMotion ? 2 : 4;
    const stiff = 0.35 + state.stiffness * 0.65;
    for (let i = 0; i < iterations; i++) {
      for (const c of cloth.constraints) c.solve(stiff);
      collideSphere();
      collideBounds();
    }
  }

  function shadeColor(t) {
    // Fabric palette: cool indigo → soft rose highlight
    const r = Math.round(58 + t * 140);
    const g = Math.round(78 + t * 70);
    const b = Math.round(128 + t * 90);
    return `rgb(${r},${g},${b})`;
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0d1118");
    g.addColorStop(0.55, "#121821");
    g.addColorStop(1, "#0a0d13");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Soft vignette / atmosphere
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.35, 40, W * 0.5, H * 0.4, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(120,160,255,0.05)");
    vg.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSphere() {
    if (!state.sphere) return;
    const { x, y, r } = sphere;
    const grd = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    grd.addColorStop(0, "rgba(210, 225, 255, 0.55)");
    grd.addColorStop(0.45, "rgba(110, 140, 190, 0.28)");
    grd.addColorStop(1, "rgba(30, 40, 60, 0.08)");
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = "rgba(180, 200, 240, 0.22)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawCloth() {
    if (state.fill) {
      for (const face of cloth.faces) {
        const [a, b, c, d] = face;
        const cx = (a.x + b.x + c.x + d.x) * 0.25;
        const cy = (a.y + b.y + c.y + d.y) * 0.25;
        // Approximate facing from cross of diagonals in 2D → brightness
        const e1x = b.x - d.x;
        const e1y = b.y - d.y;
        const e2x = c.x - a.x;
        const e2y = c.y - a.y;
        const cross = e1x * e2y - e1y * e2x;
        const shade = 0.35 + Math.max(0, Math.min(1, (cross / (cloth.spacing * cloth.spacing * 2.2) + 1) * 0.5)) * 0.65;
        const depth = Math.max(0, Math.min(1, 1 - (cy - cloth.particles[0].y) / (H * 0.7)));
        const t = shade * 0.7 + depth * 0.3;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y);
        ctx.lineTo(d.x, d.y);
        ctx.closePath();
        ctx.fillStyle = shadeColor(t);
        ctx.globalAlpha = 0.92;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = state.fill ? "rgba(230, 240, 255, 0.18)" : "rgba(170, 200, 255, 0.72)";
    ctx.lineWidth = state.fill ? 0.7 : 1.1;

    const { cols, rows, particles } = cloth;
    const idx = (x, y) => y * cols + x;

    ctx.beginPath();
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols - 1; x++) {
        const a = particles[idx(x, y)];
        const b = particles[idx(x + 1, y)];
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
      }
    }
    for (let x = 0; x < cols; x++) {
      for (let y = 0; y < rows - 1; y++) {
        const a = particles[idx(x, y)];
        const b = particles[idx(x, y + 1)];
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
      }
    }
    ctx.stroke();

    // Pin markers
    if (state.pins) {
      ctx.fillStyle = "rgba(255, 210, 150, 0.95)";
      for (const p of particles) {
        if (!p.pinned) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (state.grabbed) {
      ctx.beginPath();
      ctx.arc(state.grabbed.x, state.grabbed.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(126, 184, 255, 0.9)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function drawWindHint() {
    if (state.wind < 0.02 && state.gust <= 0) return;
    const strength = state.wind + state.gust;
    const lines = 5;
    ctx.save();
    ctx.globalAlpha = 0.12 + strength * 0.18;
    ctx.strokeStyle = "#9ec5ff";
    ctx.lineWidth = 1;
    for (let i = 0; i < lines; i++) {
      const y = H * 0.22 + i * 18 + Math.sin(state.time * 2 + i) * 4;
      const x0 = W * 0.08 + ((state.time * (40 + i * 12) + i * 50) % (W * 0.35));
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.bezierCurveTo(x0 + 30, y - 6, x0 + 50, y + 6, x0 + 80, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  let last = performance.now();
  let acc = 0;
  const fixedDt = 1 / 60;

  function frame(now) {
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += raw;

    const steps = reducedMotion ? 1 : 2;
    let guard = 0;
    while (acc >= fixedDt && guard < 5) {
      for (let s = 0; s < steps; s++) step(fixedDt / steps);
      acc -= fixedDt;
      guard++;
    }

    drawBackground();
    drawWindHint();
    drawSphere();
    drawCloth();

    state.frames++;
    if (now - state.lastFpsAt >= 500) {
      state.fps = Math.round((state.frames * 1000) / (now - state.lastFpsAt));
      state.frames = 0;
      state.lastFpsAt = now;
      const pts = cloth ? cloth.particles.length : 0;
      const cons = cloth ? cloth.constraints.length : 0;
      statsEl.textContent = `${state.fps} fps · ${pts} points · ${cons} links`;
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => {
    const pinned = state.pins;
    const fill = state.fill;
    const sph = state.sphere;
    resize();
    state.pins = pinned;
    state.fill = fill;
    state.sphere = sph;
    cloth.setPins(state.pins);
  });

  resize();
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
