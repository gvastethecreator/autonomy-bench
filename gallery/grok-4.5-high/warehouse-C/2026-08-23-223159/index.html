<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bay 7 — Night Shift</title>
<style>
  :root {
    --bg-deep: #0b1018;
    --bg-panel: rgba(14, 20, 32, 0.82);
    --bg-panel-solid: #121a28;
    --line: rgba(140, 170, 210, 0.18);
    --line-strong: rgba(180, 210, 255, 0.28);
    --text: #e8eef8;
    --text-dim: #8b9bb3;
    --amber: #f0a54a;
    --amber-soft: rgba(240, 165, 74, 0.18);
    --cyan: #5ec8d8;
    --cyan-soft: rgba(94, 200, 216, 0.16);
    --green: #6dce8a;
    --red: #e87474;
    --violet: #a78bfa;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    background:
      radial-gradient(1200px 700px at 70% 10%, rgba(94, 200, 216, 0.08), transparent 55%),
      radial-gradient(900px 600px at 15% 90%, rgba(240, 165, 74, 0.07), transparent 50%),
      linear-gradient(160deg, #070b12 0%, #101826 45%, #0a1019 100%);
  }

  .app {
    width: min(1180px, calc(100vw - 24px));
    height: min(780px, calc(100dvh - 24px));
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 12px;
    position: relative;
  }

  .topbar, .dockbar, .panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background:
      linear-gradient(145deg, rgba(240,165,74,0.25), rgba(94,200,216,0.12)),
      #172033;
    border: 1px solid var(--line-strong);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .logo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.12), transparent 70%);
    animation: sheen 4.5s ease-in-out infinite;
  }

  @keyframes sheen {
    0%, 100% { transform: translateX(-120%); }
    50% { transform: translateX(120%); }
  }

  .logo svg { width: 22px; height: 22px; position: relative; z-index: 1; }

  .titles { min-width: 0; }
  .titles h1 {
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .titles p {
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 2px;
  }

  .status-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .pill strong {
    color: var(--text);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    font-size: 0.8rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(109, 206, 138, 0.18);
    animation: pulse 2s ease-in-out infinite;
  }

  .dot.warn { background: var(--amber); box-shadow: 0 0 0 3px rgba(240,165,74,0.18); }
  .dot.idle { background: var(--text-dim); box-shadow: none; animation: none; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.85); opacity: 0.7; }
  }

  .stage-wrap {
    position: relative;
    border-radius: calc(var(--radius) + 2px);
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    background: #0d1420;
    min-height: 0;
  }

  canvas#world {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .overlay-hint {
    position: absolute;
    left: 14px;
    bottom: 14px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(8, 12, 20, 0.72);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 0.75rem;
    pointer-events: none;
    backdrop-filter: blur(8px);
    transition: opacity 0.4s ease;
  }

  .overlay-hint kbd {
    display: inline-block;
    padding: 1px 6px;
    margin: 0 2px;
    border-radius: 5px;
    border: 1px solid var(--line-strong);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.7rem;
  }

  .toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(18, 28, 42, 0.92);
    border: 1px solid var(--line-strong);
    color: var(--text);
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    max-width: min(420px, calc(100% - 28px));
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .dockbar {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 12px;
    padding: 12px;
  }

  .panel {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .panel h2 {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 650;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  button, .select-wrap {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: var(--line-strong);
  }

  button:active { transform: translateY(1px); }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  button.primary {
    background: linear-gradient(180deg, rgba(240,165,74,0.28), rgba(240,165,74,0.12));
    border-color: rgba(240,165,74,0.45);
    color: #ffe7c2;
  }

  button.primary:hover {
    background: linear-gradient(180deg, rgba(240,165,74,0.38), rgba(240,165,74,0.18));
  }

  button[aria-pressed="true"] {
    background: var(--cyan-soft);
    border-color: rgba(94,200,216,0.45);
    color: #c9f4fb;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 160px;
  }

  .slider-row label {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--amber);
    height: 4px;
  }

  .meter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .meter {
    padding: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    min-width: 0;
  }

  .meter .label {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .meter .value {
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  .meter .sub {
    margin-top: 2px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .bar {
    margin-top: 8px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--cyan), var(--amber));
    transition: width 0.25s ease;
  }

  .log {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 78px;
    overflow: hidden;
  }

  .log-item {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 0.76rem;
    color: var(--text-dim);
    animation: fadeIn 0.35s ease;
  }

  .log-item time {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: rgba(139,155,179,0.7);
    flex-shrink: 0;
  }

  .log-item span { color: var(--text); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    border: 0;
  }

  @media (max-width: 860px) {
    .app {
      width: calc(100vw - 12px);
      height: calc(100dvh - 12px);
      gap: 8px;
    }
    .dockbar {
      grid-template-columns: 1fr;
      padding: 10px;
      gap: 8px;
      max-height: 42%;
      overflow: auto;
    }
    .meter-grid { grid-template-columns: repeat(3, 1fr); }
    .titles h1 { font-size: 0.95rem; }
    .overlay-hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo::after, .dot { animation: none; }
    .toast, .log-item, .bar > span, button { transition: none; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f0a54a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 12 4l9 5.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5Z"/>
            <path d="M9 21V12h6v9"/>
          </svg>
        </div>
        <div class="titles">
          <h1>Bay 7 — Night Shift</h1>
          <p>Inbound docks → staging → outbound trucks</p>
        </div>
      </div>
      <div class="status-pills" aria-live="polite">
        <div class="pill"><span class="dot" id="shiftDot"></span> <span id="shiftLabel">Live</span></div>
        <div class="pill">Moved <strong id="statMoved">0</strong></div>
        <div class="pill">Queue <strong id="statQueue">0</strong></div>
        <div class="pill">Trucks <strong id="statTrucks">0</strong></div>
      </div>
    </header>

    <div class="stage-wrap" id="stageWrap">
      <canvas id="world" role="img" aria-label="Warehouse floor simulation showing workers moving packages between trucks"></canvas>
      <div class="toast" id="toast" role="status"></div>
      <div class="overlay-hint" id="hint">
        Click a bay to prioritize · <kbd>Space</kbd> pause · <kbd>1</kbd>–<kbd>3</kbd> speed · <kbd>R</kbd> reset
      </div>
    </div>

    <footer class="dockbar">
      <section class="panel" aria-label="Controls">
        <h2>Floor Control</h2>
        <div class="controls">
          <button type="button" class="primary" id="btnPause" aria-pressed="false">Pause</button>
          <button type="button" id="btnHire">Call Worker</button>
          <button type="button" id="btnRush">Rush Order</button>
          <button type="button" id="btnReset">Reset Shift</button>
          <div class="slider-row">
            <label for="speed">Pace</label>
            <input type="range" id="speed" min="0.4" max="2.2" step="0.1" value="1" />
            <strong id="speedVal" style="font-family:var(--mono);font-size:0.78rem;min-width:2.4rem">1.0×</strong>
          </div>
        </div>
        <div class="log" id="log" aria-live="polite"></div>
      </section>

      <section class="panel" aria-label="Shift metrics">
        <h2>Shift Pulse</h2>
        <div class="meter-grid">
          <div class="meter">
            <div class="label">Throughput</div>
            <div class="value" id="mThroughput">0<span style="font-size:0.7rem;color:var(--text-dim)">/m</span></div>
            <div class="sub">packages / min</div>
            <div class="bar"><span id="barThroughput"></span></div>
          </div>
          <div class="meter">
            <div class="label">Bay Load</div>
            <div class="value" id="mLoad">0%</div>
            <div class="sub">staging occupancy</div>
            <div class="bar"><span id="barLoad"></span></div>
          </div>
          <div class="meter">
            <div class="label">Crew</div>
            <div class="value" id="mCrew">3</div>
            <div class="sub" id="mCrewSub">active on floor</div>
            <div class="bar"><span id="barCrew"></span></div>
          </div>
        </div>
      </section>
    </footer>
  </div>

  <p class="sr-only" id="liveRegion" aria-live="polite"></p>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("world");
  const ctx = canvas.getContext("2d");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // --- Layout constants (logical space) ---
  const W = 1100;
  const H = 620;
  const inboundBays = [
    { id: 0, x: 90, y: 120, label: "IN-A" },
    { id: 1, x: 90, y: 310, label: "IN-B" },
    { id: 2, x: 90, y: 500, label: "IN-C" },
  ];
  const outboundBays = [
    { id: 0, x: 1010, y: 120, label: "OUT-1" },
    { id: 1, x: 1010, y: 310, label: "OUT-2" },
    { id: 2, x: 1010, y: 500, label: "OUT-3" },
  ];
  const staging = { x: 550, y: 310, w: 220, h: 280 };

  const PACKAGE_COLORS = [
    { body: "#c4a574", stripe: "#8b6914", label: "#3a2a12" },
    { body: "#7aa3c4", stripe: "#3d6a8c", label: "#102030" },
    { body: "#9a7bb8", stripe: "#5c3d7a", label: "#201028" },
    { body: "#7eb89a", stripe: "#3d7a5c", label: "#102018" },
    { body: "#c48a7a", stripe: "#8c4d3d", label: "#301810" },
  ];

  const WORKER_PALETTES = [
    { suit: "#3d5a80", vest: "#f0a54a", skin: "#e8c4a8", hair: "#2a2430" },
    { suit: "#2f4858", vest: "#5ec8d8", skin: "#d4a574", hair: "#4a3020" },
    { suit: "#4a5568", vest: "#6dce8a", skin: "#c49a78", hair: "#1a1a22" },
    { suit: "#3a4a5c", vest: "#e87474", skin: "#f0d0b0", hair: "#5a4030" },
    { suit: "#455a64", vest: "#a78bfa", skin: "#dbb090", hair: "#222230" },
  ];

  // --- State ---
  const state = {
    running: true,
    speed: 1,
    time: 0,
    clock: 0, // shift seconds
    moved: 0,
    trucksServed: 0,
    movedWindow: [],
    priorityBay: null,
    toastTimer: 0,
    nextWorkerId: 1,
    nextPkgId: 1,
    nextTruckId: 1,
    particles: [],
    sparks: [],
    dust: [],
    logs: [],
    inbound: [],
    outbound: [],
    packages: [],
    workers: [],
    stagingSlots: [],
    message: "",
  };

  function initStagingSlots() {
    state.stagingSlots = [];
    const cols = 4, rows = 5;
    const startX = staging.x - 70;
    const startY = staging.y - 100;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        state.stagingSlots.push({
          x: startX + c * 44,
          y: startY + r * 42,
          pkg: null,
        });
      }
    }
  }

  function log(msg) {
    const t = formatClock(state.clock);
    state.logs.unshift({ t, msg });
    if (state.logs.length > 6) state.logs.pop();
    renderLog();
  }

  function toast(msg) {
    state.message = msg;
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
    document.getElementById("liveRegion").textContent = msg;
  }

  function formatClock(sec) {
    const h = 22 + Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return `${String(h % 24).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    return Math.hypot(dx, dy);
  }

  // --- Entities ---
  function makeTruck(bay, side, rush = false) {
    const capacity = rush ? rand(4, 6) | 0 : (3 + (Math.random() * 4) | 0);
    const truck = {
      id: state.nextTruckId++,
      bay,
      side, // 'in' | 'out'
      x: side === "in" ? -180 : W + 180,
      y: bay.y,
      targetX: bay.x,
      phase: "arriving", // arriving | docked | loading | departing | gone
      progress: 0,
      capacity,
      loaded: side === "in" ? capacity : 0,
      packages: [],
      doorOpen: 0,
      bob: Math.random() * Math.PI * 2,
      color: side === "in"
        ? pick(["#c45c3a", "#3a7a9c", "#5a6a3a", "#7a4a6a"])
        : pick(["#2a5a8a", "#3a6a5a", "#6a4a2a", "#4a4a7a"]),
      cab: "#1a2430",
      rush,
      wait: 0,
      label: side === "in" ? `IN-${String(100 + state.nextTruckId).slice(-3)}` : `OUT-${String(200 + state.nextTruckId).slice(-3)}`,
    };
    if (side === "in") {
      for (let i = 0; i < capacity; i++) {
        truck.packages.push(makePackage(truck.x, truck.y, true));
      }
    }
    return truck;
  }

  function makePackage(x, y, inTruck = false) {
    const c = pick(PACKAGE_COLORS);
    return {
      id: state.nextPkgId++,
      x, y,
      z: 0,
      w: 22 + Math.random() * 6,
      h: 16 + Math.random() * 5,
      color: c,
      code: `${String.fromCharCode(65 + (Math.random()*26)|0)}${(Math.random()*900+100)|0}`,
      carrier: null,
      slot: null,
      truck: null,
      state: inTruck ? "truck" : "ground",
      bob: Math.random() * Math.PI * 2,
      priority: false,
      glow: 0,
    };
  }

  function makeWorker(x, y) {
    const pal = WORKER_PALETTES[(state.nextWorkerId - 1) % WORKER_PALETTES.length];
    return {
      id: state.nextWorkerId++,
      x, y,
      tx: x, ty: y,
      vx: 0, vy: 0,
      speed: 55 + Math.random() * 25,
      state: "idle", // idle | to_inbound | pick | to_staging | drop_staging | to_package | to_outbound | load | wander
      carrying: null,
      targetPkg: null,
      targetTruck: null,
      targetSlot: null,
      walkPhase: Math.random() * Math.PI * 2,
      palette: pal,
      name: pick(["Kim","Ravi","Jess","Omar","Lee","Ana","Mo","Sam","Priya","Chris"]),
      tired: 0,
      wait: 0,
      pathNudge: 0,
    };
  }

  function spawnDust() {
    for (let i = 0; i < 48; i++) {
      state.dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.6, 1.8),
        a: rand(0.04, 0.14),
        vx: rand(-4, 4),
        vy: rand(-2, 2),
        tw: Math.random() * Math.PI * 2,
      });
    }
  }

  function burst(x, y, color, n = 10) {
    if (reducedMotion) return;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = rand(20, 80);
      state.sparks.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 20,
        life: rand(0.35, 0.8),
        max: 0.8,
        color,
        r: rand(1.5, 3.2),
      });
    }
  }

  // --- Simulation setup ---
  function reset() {
    state.time = 0;
    state.clock = 0;
    state.moved = 0;
    state.trucksServed = 0;
    state.movedWindow = [];
    state.priorityBay = null;
    state.nextWorkerId = 1;
    state.nextPkgId = 1;
    state.nextTruckId = 1;
    state.particles = [];
    state.sparks = [];
    state.inbound = [null, null, null];
    state.outbound = [null, null, null];
    state.packages = [];
    state.workers = [];
    state.logs = [];
    initStagingSlots();
    spawnDust();

    // Seed workers
    for (let i = 0; i < 3; i++) {
      state.workers.push(makeWorker(400 + i * 60, 280 + (i % 2) * 40));
    }

    // Seed trucks
    for (let i = 0; i < 3; i++) {
      if (Math.random() > 0.25) {
        const t = makeTruck(inboundBays[i], "in");
        t.phase = "docked";
        t.x = t.targetX;
        t.doorOpen = 1;
        state.inbound[i] = t;
      }
      if (Math.random() > 0.35) {
        const t = makeTruck(outboundBays[i], "out");
        t.phase = "docked";
        t.x = t.targetX;
        t.doorOpen = 1;
        state.outbound[i] = t;
      }
    }

    // A few packages already in staging
    for (let i = 0; i < 4; i++) {
      const slot = state.stagingSlots[i];
      const pkg = makePackage(slot.x, slot.y);
      pkg.state = "staging";
      pkg.slot = slot;
      slot.pkg = pkg;
      state.packages.push(pkg);
    }

    log("Night shift online — Bay 7 clear to receive.");
    toast("Shift started. Keep the docks moving.");
    updateHUD();
    renderLog();
  }

  // --- Truck management ---
  function freeInboundBay() {
    for (let i = 0; i < 3; i++) if (!state.inbound[i]) return i;
    return -1;
  }
  function freeOutboundBay() {
    for (let i = 0; i < 3; i++) if (!state.outbound[i]) return i;
    return -1;
  }

  function maybeSpawnTrucks(dt) {
    // Inbound
    if (Math.random() < 0.22 * dt * state.speed) {
      const bay = freeInboundBay();
      if (bay >= 0 && !state.inbound.some(t => t && t.phase === "arriving")) {
        state.inbound[bay] = makeTruck(inboundBays[bay], "in");
        log(`Inbound ${state.inbound[bay].label} rolling to ${inboundBays[bay].label}.`);
      }
    }
    // Outbound
    if (Math.random() < 0.18 * dt * state.speed) {
      const bay = freeOutboundBay();
      if (bay >= 0 && !state.outbound.some(t => t && t.phase === "arriving")) {
        state.outbound[bay] = makeTruck(outboundBays[bay], "out");
        log(`Outbound ${state.outbound[bay].label} backing into ${outboundBays[bay].label}.`);
      }
    }
  }

  function updateTrucks(dt) {
    const lists = [
      { arr: state.inbound, side: "in" },
      { arr: state.outbound, side: "out" },
    ];
    for (const { arr, side } of lists) {
      for (let i = 0; i < arr.length; i++) {
        const t = arr[i];
        if (!t) continue;
        t.bob += dt * 2;

        if (t.phase === "arriving") {
          const dir = Math.sign(t.targetX - t.x) || 1;
          t.x += dir * 140 * dt * state.speed;
          if ((side === "in" && t.x >= t.targetX) || (side === "out" && t.x <= t.targetX)) {
            t.x = t.targetX;
            t.phase = "docked";
            t.doorOpen = 0;
            burst(t.x + (side === "in" ? 40 : -40), t.y, "rgba(240,165,74,0.7)", 8);
            log(`${t.label} docked at bay.`);
          }
        } else if (t.phase === "docked" || t.phase === "loading") {
          t.doorOpen = Math.min(1, t.doorOpen + dt * 1.8);
          // Inbound empty → depart
          if (side === "in" && t.packages.length === 0) {
            t.wait += dt;
            if (t.wait > 1.2) {
              t.phase = "departing";
              t.doorOpen = 1;
            }
          }
          // Outbound full → depart
          if (side === "out" && t.loaded >= t.capacity) {
            t.wait += dt;
            if (t.wait > 0.8) {
              t.phase = "departing";
              state.trucksServed++;
              burst(t.x - 30, t.y, "rgba(109,206,138,0.8)", 14);
              log(`${t.label} loaded — rolling out (${t.capacity} pkgs).`);
              toast(`${t.label} dispatched · ${t.capacity} packages aboard`);
            }
          }
        } else if (t.phase === "departing") {
          t.doorOpen = Math.max(0, t.doorOpen - dt * 2.5);
          const outDir = side === "in" ? -1 : 1;
          if (t.doorOpen <= 0.05) {
            t.x += outDir * 160 * dt * state.speed;
          }
          if (t.x < -220 || t.x > W + 220) {
            arr[i] = null;
          }
        }
      }
    }
  }

  function freeStagingSlot() {
    return state.stagingSlots.find(s => !s.pkg) || null;
  }

  function stagingCount() {
    return state.stagingSlots.filter(s => s.pkg).length;
  }

  function inboundPackagesAvailable() {
    const pkgs = [];
    for (const t of state.inbound) {
      if (!t || t.phase === "arriving" || t.phase === "departing") continue;
      if (t.doorOpen < 0.7) continue;
      for (const p of t.packages) pkgs.push({ pkg: p, truck: t });
    }
    return pkgs;
  }

  function outboundNeedingLoad() {
    return state.outbound.filter(t =>
      t && (t.phase === "docked" || t.phase === "loading") && t.doorOpen > 0.7 && t.loaded < t.capacity
    );
  }

  // --- Worker AI ---
  function assignWorker(w) {
    // Prefer completing carry
    if (w.carrying) {
      // If outbound needs packages, deliver there; else staging
      const outs = outboundNeedingLoad();
      if (outs.length) {
        // Priority bay preference
        let target = outs[0];
        if (state.priorityBay != null) {
          const pref = outs.find(t => t.bay.id === state.priorityBay);
          if (pref) target = pref;
        } else {
          target = outs.sort((a, b) => (a.capacity - a.loaded) - (b.capacity - b.loaded))[0];
        }
        w.state = "to_outbound";
        w.targetTruck = target;
        w.tx = target.x - 55;
        w.ty = target.y + rand(-12, 12);
        return;
      }
      const slot = freeStagingSlot();
      if (slot) {
        w.state = "to_staging";
        w.targetSlot = slot;
        w.tx = slot.x;
        w.ty = slot.y + 18;
        return;
      }
      // No space — wander near staging
      w.state = "wander";
      w.tx = staging.x + rand(-40, 40);
      w.ty = staging.y + rand(-40, 40);
      return;
    }

    // Not carrying — decide pick up from inbound or staging for outbound
    const outs = outboundNeedingLoad();
    const staged = state.stagingSlots.filter(s => s.pkg);
    const inbound = inboundPackagesAvailable();

    // If outbound waiting and staging has goods, serve outbound first
    if (outs.length && staged.length) {
      let slot = staged[(Math.random() * staged.length) | 0];
      if (state.priorityBay != null) {
        // still just pick staging
      }
      w.state = "to_package";
      w.targetPkg = slot.pkg;
      w.targetSlot = slot;
      w.tx = slot.x;
      w.ty = slot.y + 16;
      return;
    }

    // Else unload inbound into staging (or directly if outbound ready)
    if (inbound.length && (freeStagingSlot() || outs.length)) {
      // Prefer priority inbound bay
      let choice = inbound[0];
      if (state.priorityBay != null) {
        const pref = inbound.find(x => x.truck.bay.id === state.priorityBay);
        if (pref) choice = pref;
      } else {
        choice = pick(inbound);
      }
      w.state = "to_inbound";
      w.targetPkg = choice.pkg;
      w.targetTruck = choice.truck;
      w.tx = choice.truck.x + 50;
      w.ty = choice.truck.y + rand(-18, 18);
      return;
    }

    // Idle wander on floor lanes
    w.state = "wander";
    w.tx = rand(280, 820);
    w.ty = pick([160, 310, 460]) + rand(-30, 30);
    w.wait = rand(0.4, 1.4);
  }

  function updateWorkers(dt) {
    for (const w of state.workers) {
      // Move toward target
      const dx = w.tx - w.x;
      const dy = w.ty - w.y;
      const d = Math.hypot(dx, dy);
      const spd = w.speed * state.speed * (w.carrying ? 0.78 : 1);

      if (d > 3) {
        w.vx = (dx / d) * spd;
        w.vy = (dy / d) * spd;
        // Soft lane following — avoid extreme diagonals through racks
        w.x += w.vx * dt;
        w.y += w.vy * dt;
        w.walkPhase += dt * (w.carrying ? 8 : 10) * state.speed;
        w.tired = Math.min(1, w.tired + dt * 0.01);
      } else {
        w.vx = 0; w.vy = 0;
        // Arrived — act
        actWorker(w, dt);
      }

      if (w.carrying) {
        w.carrying.x = w.x;
        w.carrying.y = w.y - 18;
        w.carrying.bob += dt * 6;
      }
    }
  }

  function actWorker(w, dt) {
    if (w.state === "wander") {
      w.wait -= dt;
      if (w.wait <= 0) assignWorker(w);
      return;
    }

    if (w.state === "to_inbound" || w.state === "to_package") {
      const pkg = w.targetPkg;
      if (!pkg || (pkg.carrier && pkg.carrier !== w)) {
        w.targetPkg = null;
        assignWorker(w);
        return;
      }
      // Pick up
      if (pkg.state === "truck" && w.targetTruck) {
        const t = w.targetTruck;
        const idx = t.packages.indexOf(pkg);
        if (idx >= 0) t.packages.splice(idx, 1);
        pkg.state = "carried";
        pkg.carrier = w;
        pkg.truck = null;
        w.carrying = pkg;
        burst(w.x, w.y - 10, "rgba(94,200,216,0.6)", 6);
      } else if (pkg.state === "staging" && w.targetSlot) {
        w.targetSlot.pkg = null;
        pkg.slot = null;
        pkg.state = "carried";
        pkg.carrier = w;
        w.carrying = pkg;
        burst(w.x, w.y - 10, "rgba(167,139,250,0.55)", 5);
      } else {
        assignWorker(w);
        return;
      }
      assignWorker(w);
      return;
    }

    if (w.state === "to_staging") {
      const slot = w.targetSlot;
      if (!slot || slot.pkg) {
        // Slot taken — reassign
        assignWorker(w);
        return;
      }
      if (!w.carrying) { assignWorker(w); return; }
      const pkg = w.carrying;
      pkg.x = slot.x;
      pkg.y = slot.y;
      pkg.state = "staging";
      pkg.carrier = null;
      pkg.slot = slot;
      slot.pkg = pkg;
      if (!state.packages.includes(pkg)) state.packages.push(pkg);
      w.carrying = null;
      burst(slot.x, slot.y, "rgba(240,165,74,0.5)", 5);
      assignWorker(w);
      return;
    }

    if (w.state === "to_outbound") {
      const t = w.targetTruck;
      if (!t || t.phase === "departing" || t.loaded >= t.capacity) {
        assignWorker(w);
        return;
      }
      if (!w.carrying) { assignWorker(w); return; }
      const pkg = w.carrying;
      pkg.state = "shipped";
      pkg.carrier = null;
      w.carrying = null;
      t.loaded++;
      t.phase = "loading";
      state.moved++;
      state.movedWindow.push(state.clock);
      // Keep ~60s window
      state.movedWindow = state.movedWindow.filter(t0 => state.clock - t0 < 60);
      if (pkg.priority) toast(`Rush package ${pkg.code} loaded onto ${t.label}`);
      burst(t.x - 40, t.y, "rgba(109,206,138,0.7)", 8);
      // Remove from packages list
      const pi = state.packages.indexOf(pkg);
      if (pi >= 0) state.packages.splice(pi, 1);
      assignWorker(w);
      return;
    }

    assignWorker(w);
  }

  // --- Input / UI ---
  function updateHUD() {
    document.getElementById("statMoved").textContent = String(state.moved);
    document.getElementById("statQueue").textContent = String(
      inboundPackagesAvailable().length + stagingCount()
    );
    document.getElementById("statTrucks").textContent = String(state.trucksServed);

    const thr = state.movedWindow.length;
    document.getElementById("mThroughput").innerHTML =
      `${thr}<span style="font-size:0.7rem;color:var(--text-dim)">/m</span>`;
    document.getElementById("barThroughput").style.width = `${clamp(thr / 20 * 100, 0, 100)}%`;

    const load = stagingCount() / state.stagingSlots.length;
    document.getElementById("mLoad").textContent = `${Math.round(load * 100)}%`;
    document.getElementById("barLoad").style.width = `${load * 100}%`;

    document.getElementById("mCrew").textContent = String(state.workers.length);
    const busy = state.workers.filter(w => w.state !== "wander" && w.state !== "idle").length;
    document.getElementById("mCrewSub").textContent = `${busy} tasked · ${state.workers.length - busy} open`;
    document.getElementById("barCrew").style.width = `${clamp(busy / Math.max(1, state.workers.length) * 100, 8, 100)}%`;

    const dot = document.getElementById("shiftDot");
    const label = document.getElementById("shiftLabel");
    if (!state.running) {
      dot.className = "dot idle";
      label.textContent = "Paused";
    } else if (load > 0.85) {
      dot.className = "dot warn";
      label.textContent = "Staging tight";
    } else {
      dot.className = "dot";
      label.textContent = "Live · " + formatClock(state.clock);
    }
  }

  function renderLog() {
    const el = document.getElementById("log");
    el.innerHTML = state.logs.map(l =>
      `<div class="log-item"><time>${l.t}</time><span>${escapeHtml(l.msg)}</span></div>`
    ).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    })[c]);
  }

  // --- Rendering ---
  function resize() {
    const wrap = document.getElementById("stageWrap");
    const rect = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, rect.width * dpr);
    canvas.height = Math.max(1, rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const sx = rect.width / W;
    const sy = rect.height / H;
    ctx.save();
    ctx.scale(sx, sy);
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawFloor();
    drawRacks();
    drawBays();
    drawStaging();
    drawTrucks();
    drawPackages();
    drawWorkers();
    drawSparks();
    drawDust();
    drawAtmosphere();
    drawBayLabels();

    ctx.restore();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#121c2c");
    g.addColorStop(0.5, "#0e1624");
    g.addColorStop(1, "#0a101a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Ceiling beams
    ctx.strokeStyle = "rgba(80,100,130,0.15)";
    ctx.lineWidth = 3;
    for (let x = 80; x < W; x += 140) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    // Overhead lights glow
    for (let i = 0; i < 5; i++) {
      const x = 180 + i * 190;
      const glow = ctx.createRadialGradient(x, 40, 10, x, 80, 160);
      glow.addColorStop(0, "rgba(255, 210, 140, 0.10)");
      glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow;
      ctx.fillRect(x - 160, 0, 320, 280);
    }
  }

  function drawFloor() {
    // Concrete floor
    const floor = ctx.createLinearGradient(0, 80, 0, H);
    floor.addColorStop(0, "#1a2436");
    floor.addColorStop(1, "#141c2a");
    ctx.fillStyle = floor;
    ctx.fillRect(40, 60, W - 80, H - 90);

    // Floor grid / lane markings
    ctx.save();
    ctx.beginPath();
    ctx.rect(40, 60, W - 80, H - 90);
    ctx.clip();

    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (let y = 80; y < H; y += 28) {
      ctx.beginPath();
      ctx.moveTo(40, y);
      ctx.lineTo(W - 40, y);
      ctx.stroke();
    }
    for (let x = 60; x < W; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, 60);
      ctx.lineTo(x, H - 30);
      ctx.stroke();
    }

    // Yellow safety lanes
    ctx.strokeStyle = "rgba(240, 180, 60, 0.28)";
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    // Horizontal lanes
    [160, 310, 460].forEach(y => {
      ctx.beginPath();
      ctx.moveTo(200, y);
      ctx.lineTo(900, y);
      ctx.stroke();
    });
    ctx.setLineDash([]);

    // Hazard stripes near docks
    drawHazard(150, 60, 24, H - 90, 1);
    drawHazard(W - 174, 60, 24, H - 90, -1);

    ctx.restore();

    // Floor edge shadow
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(40.5, 60.5, W - 81, H - 91);
  }

  function drawHazard(x, y, w, h, dir) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    for (let i = -h; i < h + w; i += 14) {
      ctx.fillStyle = i % 28 === 0 ? "rgba(240,180,60,0.2)" : "rgba(20,24,32,0.35)";
      ctx.beginPath();
      ctx.moveTo(x + dir * i, y);
      ctx.lineTo(x + dir * (i + 10), y);
      ctx.lineTo(x + dir * (i + 10 + h), y + h);
      ctx.lineTo(x + dir * (i + h), y + h);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawRacks() {
    // Background rack silhouettes for depth
    const racks = [
      { x: 260, y: 90, rows: 3 },
      { x: 260, y: 480, rows: 3 },
      { x: 760, y: 90, rows: 3 },
      { x: 760, y: 480, rows: 3 },
    ];
    for (const r of racks) {
      for (let i = 0; i < r.rows; i++) {
        const x = r.x + i * 36;
        ctx.fillStyle = "rgba(30, 42, 60, 0.55)";
        roundRect(x, r.y, 28, 70, 3);
        ctx.fill();
        ctx.strokeStyle = "rgba(100,130,170,0.12)";
        ctx.stroke();
        // shelf lines
        ctx.strokeStyle = "rgba(240,165,74,0.12)";
        ctx.beginPath();
        ctx.moveTo(x + 3, r.y + 22);
        ctx.lineTo(x + 25, r.y + 22);
        ctx.moveTo(x + 3, r.y + 44);
        ctx.lineTo(x + 25, r.y + 44);
        ctx.stroke();
      }
    }
  }

  function drawBays() {
    for (const bay of inboundBays) drawBayDoor(bay, "in");
    for (const bay of outboundBays) drawBayDoor(bay, "out");
  }

  function drawBayDoor(bay, side) {
    const x = side === "in" ? 40 : W - 100;
    const y = bay.y - 55;
    const prioritized = state.priorityBay === bay.id && (
      (side === "in") || (side === "out")
    );
    // Only highlight matching priority on both for simplicity when set
    const active = state.priorityBay === bay.id;

    // Dock frame
    ctx.fillStyle = "#182234";
    roundRect(x, y, 60, 110, 4);
    ctx.fill();

    // Door opening (dark)
    ctx.fillStyle = "#070b12";
    ctx.fillRect(x + 8, y + 14, 44, 82);

    // Light spill from bay
    const truck = side === "in" ? state.inbound[bay.id] : state.outbound[bay.id];
    const open = truck ? truck.doorOpen : 0;
    if (open > 0.1) {
      const spill = ctx.createRadialGradient(
        side === "in" ? x + 60 : x, bay.y,
        10,
        side === "in" ? x + 60 : x, bay.y,
        120
      );
      spill.addColorStop(0, side === "in" ? "rgba(240,165,74,0.14)" : "rgba(94,200,216,0.12)");
      spill.addColorStop(1, "transparent");
      ctx.fillStyle = spill;
      ctx.fillRect(x - 80, y - 40, 200, 200);
    }

    // Door panels sliding
    const doorH = 82 * (1 - open * 0.85);
    ctx.fillStyle = "#243044";
    ctx.fillRect(x + 8, y + 14, 44, doorH);
    ctx.strokeStyle = "rgba(140,170,200,0.15)";
    ctx.strokeRect(x + 8, y + 14, 44, doorH);

    if (active) {
      ctx.strokeStyle = "rgba(240,165,74,0.7)";
      ctx.lineWidth = 2;
      roundRect(x - 3, y - 3, 66, 116, 6);
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  function drawBayLabels() {
    ctx.font = "600 11px Segoe UI, system-ui, sans-serif";
    ctx.textAlign = "center";
    for (const bay of inboundBays) {
      ctx.fillStyle = state.priorityBay === bay.id ? "#f0a54a" : "rgba(180,200,220,0.55)";
      ctx.fillText(bay.label, 70, bay.y - 62);
    }
    for (const bay of outboundBays) {
      ctx.fillStyle = state.priorityBay === bay.id ? "#5ec8d8" : "rgba(180,200,220,0.55)";
      ctx.fillText(bay.label, W - 70, bay.y - 62);
    }
  }

  function drawStaging() {
    const x = staging.x - staging.w / 2;
    const y = staging.y - staging.h / 2;

    ctx.fillStyle = "rgba(94, 200, 216, 0.04)";
    roundRect(x, y, staging.w, staging.h, 10);
    ctx.fill();
    ctx.strokeStyle = "rgba(94, 200, 216, 0.22)";
    ctx.setLineDash([6, 6]);
    roundRect(x, y, staging.w, staging.h, 10);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "rgba(94, 200, 216, 0.55)";
    ctx.font = "650 10px Segoe UI, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("STAGING", staging.x, y + 16);

    // Slot marks
    for (const s of state.stagingSlots) {
      ctx.fillStyle = s.pkg ? "transparent" : "rgba(255,255,255,0.03)";
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      roundRect(s.x - 14, s.y - 10, 28, 22, 3);
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawTrucks() {
    for (const t of state.inbound) if (t) drawTruck(t, "in");
    for (const t of state.outbound) if (t) drawTruck(t, "out");
  }

  function drawTruck(t, side) {
    const bob = Math.sin(t.bob) * 0.6;
    const y = t.y + bob;
    const facing = side === "in" ? 1 : -1;

    ctx.save();
    ctx.translate(t.x, y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(facing * 10, 38, 70, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Trailer body
    ctx.fillStyle = t.color;
    roundRect(facing === 1 ? -20 : -100, -36, 120, 64, 6);
    ctx.fill();

    // Trailer stripe
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(facing === 1 ? -20 : -100, -10, 120, 8);

    // Cab
    ctx.fillStyle = t.cab;
    const cabX = facing === 1 ? -70 : 50;
    roundRect(cabX, -28, 50, 56, 5);
    ctx.fill();

    // Windshield
    ctx.fillStyle = "rgba(140, 200, 230, 0.35)";
    roundRect(cabX + (facing === 1 ? 8 : 18), -20, 24, 18, 3);
    ctx.fill();

    // Wheels
    ctx.fillStyle = "#0d1018";
    for (const wx of (facing === 1 ? [-55, 20, 55] : [-55, -20, 55])) {
      ctx.beginPath();
      ctx.arc(wx, 30, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(180,180,190,0.3)";
      ctx.stroke();
    }

    // Cargo door gap / interior
    if (t.doorOpen > 0.05) {
      const ix = facing === 1 ? 70 : -100;
      ctx.fillStyle = "rgba(10,14,22,0.85)";
      ctx.fillRect(facing === 1 ? 55 : -100, -30, 30 * t.doorOpen + 10, 52);
      // Packages still in truck (inbound)
      if (side === "in") {
        t.packages.forEach((p, i) => {
          const col = i % 3;
          const row = (i / 3) | 0;
          drawPackageAt(
            (facing === 1 ? 62 : -88) + col * 8,
            -18 + row * 14,
            p, 0.75
          );
        });
      } else {
        // Loaded fill indicator
        const fill = t.loaded / t.capacity;
        ctx.fillStyle = "rgba(109,206,138,0.35)";
        ctx.fillRect(
          facing === 1 ? 58 : -95,
          20 - 48 * fill,
          22,
          48 * fill
        );
      }
    }

    // Rush badge
    if (t.rush) {
      ctx.fillStyle = "#e87474";
      roundRect(facing === 1 ? 10 : -50, -48, 36, 12, 3);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "700 8px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("RUSH", facing === 1 ? 28 : -32, -39);
    }

    // Label plate
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    roundRect(facing === 1 ? -10 : -40, 8, 52, 12, 3);
    ctx.fill();
    ctx.fillStyle = "#e8eef8";
    ctx.font = "600 8px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.fillText(t.label, facing === 1 ? 16 : -14, 17);

    // Capacity pips for outbound
    if (side === "out") {
      for (let i = 0; i < t.capacity; i++) {
        ctx.fillStyle = i < t.loaded ? "#6dce8a" : "rgba(255,255,255,0.15)";
        ctx.beginPath();
        ctx.arc(facing === 1 ? -5 + i * 8 : -30 + i * 8, -42, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = "rgba(240,165,74,0.85)";
      ctx.font = "600 9px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${t.packages.length} left`, facing === 1 ? 30 : -30, -44);
    }

    ctx.restore();
  }

  function drawPackages() {
    // Staging packages
    for (const s of state.stagingSlots) {
      if (s.pkg && s.pkg.state === "staging") {
        drawPackageAt(s.pkg.x, s.pkg.y, s.pkg, 1);
      }
    }
  }

  function drawPackageAt(x, y, pkg, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const bob = pkg.state === "carried" ? Math.sin(pkg.bob) * 1.5 : 0;
    ctx.translate(0, bob);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(0, pkg.h * 0.55, pkg.w * 0.45, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Box
    const bw = pkg.w, bh = pkg.h;
    ctx.fillStyle = pkg.color.body;
    roundRect(-bw / 2, -bh / 2, bw, bh, 2);
    ctx.fill();

    // Top face hint
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.moveTo(-bw / 2, -bh / 2 + 2);
    ctx.lineTo(0, -bh / 2 - 5);
    ctx.lineTo(bw / 2, -bh / 2 + 2);
    ctx.closePath();
    ctx.fill();

    // Stripe
    ctx.fillStyle = pkg.color.stripe;
    ctx.fillRect(-bw / 2, -3, bw, 5);

    // Label
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillRect(-6, 4, 12, 5);

    if (pkg.priority) {
      ctx.strokeStyle = "#e87474";
      ctx.lineWidth = 1.5;
      roundRect(-bw / 2 - 2, -bh / 2 - 2, bw + 4, bh + 4, 3);
      ctx.stroke();
    }

    if (pkg.glow > 0) {
      ctx.strokeStyle = `rgba(94,200,216,${pkg.glow})`;
      roundRect(-bw / 2 - 3, -bh / 2 - 3, bw + 6, bh + 6, 3);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawWorkers() {
    // Sort by y for depth
    const sorted = [...state.workers].sort((a, b) => a.y - b.y);
    for (const w of sorted) drawWorker(w);
  }

  function drawWorker(w) {
    const moving = Math.hypot(w.vx, w.vy) > 5;
    const swing = moving ? Math.sin(w.walkPhase) : 0;
    const facing = w.vx >= 0 ? 1 : -1;

    ctx.save();
    ctx.translate(w.x, w.y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(0, 4, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.strokeStyle = w.palette.suit;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-3, -6);
    ctx.lineTo(-3 - swing * 5, 2);
    ctx.moveTo(3, -6);
    ctx.lineTo(3 + swing * 5, 2);
    ctx.stroke();

    // Body / vest
    ctx.fillStyle = w.palette.suit;
    roundRect(-8, -24, 16, 18, 4);
    ctx.fill();
    ctx.fillStyle = w.palette.vest;
    roundRect(-7, -22, 14, 8, 2);
    ctx.fill();

    // Arms
    ctx.strokeStyle = w.palette.suit;
    ctx.lineWidth = 2.5;
    if (w.carrying) {
      ctx.beginPath();
      ctx.moveTo(-8, -18);
      ctx.lineTo(-10, -28);
      ctx.moveTo(8, -18);
      ctx.lineTo(10, -28);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-8, -18);
      ctx.lineTo(-10 - swing * 4, -8);
      ctx.moveTo(8, -18);
      ctx.lineTo(10 + swing * 4, -8);
      ctx.stroke();
    }

    // Head
    ctx.fillStyle = w.palette.skin;
    ctx.beginPath();
    ctx.arc(0, -30, 6, 0, Math.PI * 2);
    ctx.fill();
    // Hair
    ctx.fillStyle = w.palette.hair;
    ctx.beginPath();
    ctx.arc(0, -32, 5.5, Math.PI, 0);
    ctx.fill();
    // Hard hat
    ctx.fillStyle = "#f0a54a";
    ctx.beginPath();
    ctx.ellipse(0, -34, 7, 4, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-7, -34, 14, 3);

    // Name tag
    ctx.fillStyle = "rgba(232,238,248,0.7)";
    ctx.font = "600 8px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(w.name, 0, 14);

    ctx.restore();

    if (w.carrying) {
      drawPackageAt(w.carrying.x, w.carrying.y, w.carrying, 1);
    }
  }

  function drawSparks() {
    for (const s of state.sparks) {
      const a = s.life / s.max;
      ctx.fillStyle = s.color.replace(/[\d.]+\)$/, `${a})`);
      if (!s.color.endsWith(")")) ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawDust() {
    for (const d of state.dust) {
      ctx.fillStyle = `rgba(200, 210, 230, ${d.a * (0.6 + 0.4 * Math.sin(d.tw))})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawAtmosphere() {
    // Vignette
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
    v.addColorStop(0, "transparent");
    v.addColorStop(1, "rgba(4, 8, 14, 0.55)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Scanline-ish film grain (subtle)
    if (!reducedMotion) {
      ctx.fillStyle = "rgba(255,255,255,0.015)";
      for (let i = 0; i < 40; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        ctx.fillRect(x, y, 1.2, 1.2);
      }
    }

    // Priority banner
    if (state.priorityBay != null) {
      ctx.fillStyle = "rgba(240,165,74,0.12)";
      ctx.font = "650 12px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(240,165,74,0.85)";
      ctx.fillText(`Priority lane: Bay ${state.priorityBay === 0 ? "A/1" : state.priorityBay === 1 ? "B/2" : "C/3"}`, W / 2, 36);
    }
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  // --- Main loop ---
  let last = performance.now();
  function frame(now) {
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    const dt = reducedMotion ? raw * 0.7 : raw;

    if (state.running) {
      state.time += dt * state.speed;
      state.clock += dt * state.speed * 6; // accelerated shift clock
      maybeSpawnTrucks(dt);
      updateTrucks(dt);
      updateWorkers(dt);

      // Sparks
      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const s = state.sparks[i];
        s.life -= dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 60 * dt;
        if (s.life <= 0) state.sparks.splice(i, 1);
      }
      // Dust
      for (const d of state.dust) {
        d.x += d.vx * dt * state.speed;
        d.y += d.vy * dt * state.speed;
        d.tw += dt;
        if (d.x < 0) d.x = W;
        if (d.x > W) d.x = 0;
        if (d.y < 0) d.y = H;
        if (d.y > H) d.y = 0;
      }

      if ((now / 200 | 0) !== ((now - raw * 1000) / 200 | 0)) updateHUD();
    }

    draw();
    requestAnimationFrame(frame);
  }

  // --- Events ---
  function togglePause() {
    state.running = !state.running;
    const btn = document.getElementById("btnPause");
    btn.textContent = state.running ? "Pause" : "Resume";
    btn.setAttribute("aria-pressed", state.running ? "false" : "true");
    updateHUD();
    toast(state.running ? "Floor is live." : "Shift paused.");
  }

  document.getElementById("btnPause").addEventListener("click", togglePause);

  document.getElementById("btnHire").addEventListener("click", () => {
    if (state.workers.length >= 7) {
      toast("Crew cap reached for Bay 7.");
      return;
    }
    const w = makeWorker(staging.x + rand(-30, 30), staging.y + 80);
    state.workers.push(w);
    assignWorker(w);
    log(`${w.name} punched in — crew at ${state.workers.length}.`);
    toast(`${w.name} joined the floor.`);
    updateHUD();
  });

  document.getElementById("btnRush").addEventListener("click", () => {
    const bay = freeInboundBay();
    const idx = bay >= 0 ? bay : (Math.random() * 3 | 0);
    // Replace or force a rush truck
    if (state.inbound[idx] && state.inbound[idx].phase !== "departing") {
      // Mark remaining packages priority
      for (const p of state.inbound[idx].packages) p.priority = true;
      state.inbound[idx].rush = true;
      toast(`Rush flagged on ${state.inbound[idx].label}`);
      log(`Rush order on ${state.inbound[idx].label}.`);
    } else {
      const t = makeTruck(inboundBays[idx], "in", true);
      for (const p of t.packages) p.priority = true;
      state.inbound[idx] = t;
      log(`Rush inbound ${t.label} en route.`);
      toast("Rush truck inbound — clear a path.");
    }
    // Auto priority that bay
    state.priorityBay = inboundBays[idx].id;
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    reset();
    state.workers.forEach(assignWorker);
  });

  const speedEl = document.getElementById("speed");
  speedEl.addEventListener("input", () => {
    state.speed = parseFloat(speedEl.value);
    document.getElementById("speedVal").textContent = state.speed.toFixed(1) + "×";
  });

  canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * W;
    const y = ((e.clientY - rect.top) / rect.height) * H;

    // Hit test bays
    let hit = null;
    for (const bay of inboundBays) {
      if (Math.abs(x - 70) < 50 && Math.abs(y - bay.y) < 55) hit = bay.id;
    }
    for (const bay of outboundBays) {
      if (Math.abs(x - (W - 70)) < 50 && Math.abs(y - bay.y) < 55) hit = bay.id;
    }
    if (hit != null) {
      state.priorityBay = state.priorityBay === hit ? null : hit;
      toast(state.priorityBay != null
        ? `Priority set: lane ${hit === 0 ? "A/1" : hit === 1 ? "B/2" : "C/3"}`
        : "Priority cleared.");
      // Re-think idle workers
      for (const w of state.workers) {
        if (w.state === "wander" || !w.carrying) assignWorker(w);
      }
    }
  });

  window.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea, select, button")) return;
    if (e.code === "Space") {
      e.preventDefault();
      togglePause();
    } else if (e.key === "1") {
      speedEl.value = "0.6"; speedEl.dispatchEvent(new Event("input"));
    } else if (e.key === "2") {
      speedEl.value = "1"; speedEl.dispatchEvent(new Event("input"));
    } else if (e.key === "3") {
      speedEl.value = "1.8"; speedEl.dispatchEvent(new Event("input"));
    } else if (e.key === "r" || e.key === "R") {
      reset();
      state.workers.forEach(assignWorker);
    } else if (e.key === "p" || e.key === "P") {
      togglePause();
    }
  });

  window.addEventListener("resize", resize);

  // Boot
  resize();
  reset();
  state.workers.forEach(assignWorker);
  requestAnimationFrame(frame);

  // Hide hint after a while
  setTimeout(() => {
    const h = document.getElementById("hint");
    if (h) h.style.opacity = "0.35";
  }, 8000);
})();
</script>
</body>
</html>
