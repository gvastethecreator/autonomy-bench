<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colorful Fluid Simulation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --panel: rgba(12, 14, 22, 0.72);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f4f6ff;
      --muted: rgba(244, 246, 255, 0.68);
      --accent: #7cf0ff;
      --accent-2: #ff7ad9;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(1200px 800px at 20% 10%, #1a1140 0%, var(--bg) 55%, #020308 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: min(360px, calc(100vw - 32px));
      pointer-events: none;
    }

    .card {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button, label.toggle {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    button:hover, label.toggle:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(124, 240, 255, 0.45);
    }

    button:active, label.toggle:active {
      transform: translateY(1px);
    }

    button.primary {
      background: linear-gradient(135deg, rgba(124, 240, 255, 0.28), rgba(255, 122, 217, 0.24));
      border-color: rgba(124, 240, 255, 0.35);
    }

    .sliders {
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      gap: 6px;
    }

    .row header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .row strong {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    label.toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
    }

    label.toggle input {
      accent-color: var(--accent-2);
    }

    .hint {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      pointer-events: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(8, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      font-size: 0.8rem;
      backdrop-filter: blur(12px);
    }

    @media (max-width: 640px) {
      .hud {
        top: 10px;
        left: 10px;
        max-width: calc(100vw - 20px);
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .hint {
        left: 10px;
        right: 10px;
        bottom: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <div class="hud">
    <div class="card">
      <h1>Colorful Fluid</h1>
      <p>Drag to stir rainbow dye through a real-time Navier–Stokes flow field.</p>
    </div>

    <div class="card controls">
      <button class="primary" id="btn-splat" type="button">Burst Color</button>
      <button id="btn-clear" type="button">Clear</button>
      <button id="btn-pause" type="button">Pause</button>
      <label class="toggle">
        <input id="chk-bloom" type="checkbox" checked />
        Bloom
      </label>
    </div>

    <div class="card sliders">
      <div class="row">
        <header><span>Dye amount</span><strong id="val-dye">0.85</strong></header>
        <input id="rng-dye" type="range" min="0.1" max="1.5" step="0.05" value="0.85" />
      </div>
      <div class="row">
        <header><span>Force</span><strong id="val-force">4200</strong></header>
        <input id="rng-force" type="range" min="1000" max="9000" step="100" value="4200" />
      </div>
      <div class="row">
        <header><span>Curl</span><strong id="val-curl">28</strong></header>
        <input id="rng-curl" type="range" min="0" max="50" step="1" value="28" />
      </div>
      <div class="row">
        <header><span>Dissipation</span><strong id="val-dissipate">0.98</strong></header>
        <input id="rng-dissipate" type="range" min="0.9" max="1" step="0.005" value="0.98" />
      </div>
    </div>
  </div>

  <div class="hint">Click and drag · touch works too</div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("glcanvas");
      const gl = canvas.getContext("webgl", {
        alpha: false,
        depth: false,
        stencil: false,
        antialias: false,
        preserveDrawingBuffer: false,
      });

      if (!gl) {
        document.body.innerHTML = "<p style='padding:2rem;font:16px system-ui'>WebGL is required for this fluid simulation.</p>";
        return;
      }

      const ext = {
        textureFloat: gl.getExtension("OES_texture_float"),
        textureHalfFloat: gl.getExtension("OES_texture_half_float"),
        colorBufferFloat: gl.getExtension("WEBGL_color_buffer_float") || gl.getExtension("EXT_color_buffer_float"),
        linearFloat: gl.getExtension("OES_texture_float_linear"),
        linearHalfFloat: gl.getExtension("OES_texture_half_float_linear"),
      };

      class GLProgram {
        constructor(vertexSource, fragmentSource) {
          this.uniforms = {};
          this.program = gl.createProgram();
          const vs = compileShader(gl.VERTEX_SHADER, vertexSource);
          const fs = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
          gl.attachShader(this.program, vs);
          gl.attachShader(this.program, fs);
          gl.linkProgram(this.program);
          if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(this.program));
          }
          const uniformCount = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
          for (let i = 0; i < uniformCount; i++) {
            const info = gl.getActiveUniform(this.program, i);
            this.uniforms[info.name] = gl.getUniformLocation(this.program, info.name);
          }
        }

        bind() {
          gl.useProgram(this.program);
        }
      }

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
      }

      function getSupportedFormat(internalFormat, format, type) {
        if (!supportRenderTextureFormat(internalFormat, format, type)) {
          switch (internalFormat) {
            case gl.RGBA16F:
              return getSupportedFormat(gl.RGBA, format, type);
            default:
              return null;
          }
        }
        return { internalFormat, format, type };
      }

      function supportRenderTextureFormat(internalFormat, format, type) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        return status === gl.FRAMEBUFFER_COMPLETE;
      }

      let texType = gl.UNSIGNED_BYTE;
      let rgba = { internalFormat: gl.RGBA, format: gl.RGBA, type: gl.UNSIGNED_BYTE };
      let filtering = gl.LINEAR;

      if (ext.textureHalfFloat) {
        texType = ext.textureHalfFloat.HALF_FLOAT_OES;
        rgba = getSupportedFormat(gl.RGBA, gl.RGBA, texType) || rgba;
        filtering = ext.linearHalfFloat ? gl.LINEAR : gl.NEAREST;
      } else if (ext.textureFloat) {
        texType = gl.FLOAT;
        rgba = getSupportedFormat(gl.RGBA, gl.RGBA, texType) || rgba;
        filtering = ext.linearFloat ? gl.LINEAR : gl.NEAREST;
      }

      function createFBO(w, h, internalFormat, format, type, param) {
        gl.activeTexture(gl.TEXTURE0);
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        gl.viewport(0, 0, w, h);
        gl.clear(gl.COLOR_BUFFER_BIT);

        return {
          texture,
          fbo,
          width: w,
          height: h,
          attach(id) {
            gl.activeTexture(gl.TEXTURE0 + id);
            gl.bindTexture(gl.TEXTURE_2D, texture);
            return id;
          },
        };
      }

      function createDoubleFBO(w, h, internalFormat, format, type, param) {
        let fbo1 = createFBO(w, h, internalFormat, format, type, param);
        let fbo2 = createFBO(w, h, internalFormat, format, type, param);
        return {
          width: w,
          height: h,
          get read() { return fbo1; },
          set read(v) { fbo1 = v; },
          get write() { return fbo2; },
          set write(v) { fbo2 = v; },
          swap() {
            const temp = fbo1;
            fbo1 = fbo2;
            fbo2 = temp;
          },
        };
      }

      const baseVertex = `
        precision highp float;
        attribute vec2 aPosition;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform vec2 texelSize;
        void main () {
          vUv = aPosition * 0.5 + 0.5;
          vL = vUv - vec2(texelSize.x, 0.0);
          vR = vUv + vec2(texelSize.x, 0.0);
          vT = vUv + vec2(0.0, texelSize.y);
          vB = vUv - vec2(0.0, texelSize.y);
          gl_Position = vec4(aPosition, 0.0, 1.0);
        }
      `;

      const clearShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        uniform sampler2D uTexture;
        uniform float value;
        void main () {
          gl_FragColor = value * texture2D(uTexture, vUv);
        }
      `;

      const displayShader = `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform sampler2D uBloom;
        uniform float bloomEnabled;
        void main () {
          vec3 c = texture2D(uTexture, vUv).rgb;
          vec3 b = texture2D(uBloom, vUv).rgb;
          c += b * bloomEnabled * 0.55;
          float vigor = max(c.r, max(c.g, c.b));
          c = mix(c, c / (1.0 + vigor * 0.35), 0.35);
          gl_FragColor = vec4(c, 1.0);
        }
      `;

      const splatShader = `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTarget;
        uniform float aspectRatio;
        uniform vec3 color;
        uniform vec2 point;
        uniform float radius;
        void main () {
          vec2 p = vUv - point.xy;
          p.x *= aspectRatio;
          vec3 splat = exp(-dot(p, p) / radius) * color;
          vec3 base = texture2D(uTarget, vUv).xyz;
          gl_FragColor = vec4(base + splat, 1.0);
        }
      `;

      const advectionShader = `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform float dt;
        uniform float dissipation;
        void main () {
          vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
          gl_FragColor = dissipation * texture2D(uSource, coord);
        }
      `;

      const divergenceShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
          float L = texture2D(uVelocity, vL).x;
          float R = texture2D(uVelocity, vR).x;
          float T = texture2D(uVelocity, vT).y;
          float B = texture2D(uVelocity, vB).y;
          vec2 C = texture2D(uVelocity, vUv).xy;
          if (vL.x < 0.0) { L = -C.x; }
          if (vR.x > 1.0) { R = -C.x; }
          if (vT.y > 1.0) { T = -C.y; }
          if (vB.y < 0.0) { B = -C.y; }
          float div = 0.5 * (R - L + T - B);
          gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
        }
      `;

      const curlShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
          float L = texture2D(uVelocity, vL).y;
          float R = texture2D(uVelocity, vR).y;
          float T = texture2D(uVelocity, vT).x;
          float B = texture2D(uVelocity, vB).x;
          float vorticity = R - L - T + B;
          gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
        }
      `;

      const vorticityShader = `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uVelocity;
        uniform sampler2D uCurl;
        uniform float curl;
        uniform float dt;
        void main () {
          float L = texture2D(uCurl, vL).x;
          float R = texture2D(uCurl, vR).x;
          float T = texture2D(uCurl, vT).x;
          float B = texture2D(uCurl, vB).x;
          float C = texture2D(uCurl, vUv).x;
          vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
          force /= length(force) + 0.0001;
          force *= curl * C;
          force.y *= -1.0;
          vec2 vel = texture2D(uVelocity, vUv).xy;
          gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
        }
      `;

      const pressureShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uDivergence;
        void main () {
          float L = texture2D(uPressure, vL).x;
          float R = texture2D(uPressure, vR).x;
          float T = texture2D(uPressure, vT).x;
          float B = texture2D(uPressure, vB).x;
          float C = texture2D(uPressure, vUv).x;
          float divergence = texture2D(uDivergence, vUv).x;
          float pressure = (L + R + B + T - divergence) * 0.25;
          gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
        }
      `;

      const gradientSubtractShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uVelocity;
        void main () {
          float L = texture2D(uPressure, vL).x;
          float R = texture2D(uPressure, vR).x;
          float T = texture2D(uPressure, vT).x;
          float B = texture2D(uPressure, vB).x;
          vec2 velocity = texture2D(uVelocity, vUv).xy;
          velocity.xy -= vec2(R - L, T - B);
          gl_FragColor = vec4(velocity, 0.0, 1.0);
        }
      `;

      const bloomPrefilterShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform float threshold;
        void main () {
          vec3 c = texture2D(uTexture, vUv).rgb;
          float br = max(c.r, max(c.g, c.b));
          vec3 bloom = max(c - threshold, 0.0) / max(br - threshold + 0.001, 0.001) * max(br - threshold, 0.0);
          gl_FragColor = vec4(bloom, 1.0);
        }
      `;

      const bloomBlurShader = `
        precision mediump float;
        precision mediump sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform vec2 direction;
        void main () {
          vec3 c = texture2D(uTexture, vUv).rgb * 0.29411764;
          c += texture2D(uTexture, vUv + direction).rgb * 0.35294117;
          c += texture2D(uTexture, vUv - direction).rgb * 0.35294117;
          gl_FragColor = vec4(c, 1.0);
        }
      `;

      const blit = (() => {
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(0);
        return (destination) => {
          gl.bindFramebuffer(gl.FRAMEBUFFER, destination);
          gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        };
      })();

      const clearProgram = new GLProgram(baseVertex, clearShader);
      const displayProgram = new GLProgram(baseVertex, displayShader);
      const splatProgram = new GLProgram(baseVertex, splatShader);
      const advectionProgram = new GLProgram(baseVertex, advectionShader);
      const divergenceProgram = new GLProgram(baseVertex, divergenceShader);
      const curlProgram = new GLProgram(baseVertex, curlShader);
      const vorticityProgram = new GLProgram(baseVertex, vorticityShader);
      const pressureProgram = new GLProgram(baseVertex, pressureShader);
      const gradientSubtractProgram = new GLProgram(baseVertex, gradientSubtractShader);
      const bloomPrefilterProgram = new GLProgram(baseVertex, bloomPrefilterShader);
      const bloomBlurProgram = new GLProgram(baseVertex, bloomBlurShader);

      let dye, velocity, divergence, curl, pressure, bloom;
      const config = {
        SIM_RESOLUTION: 128,
        DYE_RESOLUTION: 512,
        DENSITY_DISSIPATION: 0.98,
        VELOCITY_DISSIPATION: 0.99,
        PRESSURE_ITERATIONS: 20,
        CURL: 28,
        SPLAT_RADIUS: 0.22,
        SPLAT_FORCE: 4200,
        DYE_AMOUNT: 0.85,
        BLOOM: true,
        PAUSED: false,
      };

      function getResolution(resolution) {
        let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
        if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
        const min = Math.round(resolution);
        const max = Math.round(resolution * aspectRatio);
        if (gl.drawingBufferWidth > gl.drawingBufferHeight) {
          return { width: max, height: min };
        }
        return { width: min, height: max };
      }

      function initFramebuffers() {
        const simRes = getResolution(config.SIM_RESOLUTION);
        const dyeRes = getResolution(config.DYE_RESOLUTION);
        const texTypeLocal = rgba.type;
        const rgbaLocal = rgba;
        const filteringLocal = filtering;

        dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgbaLocal.internalFormat, rgbaLocal.format, texTypeLocal, filteringLocal);
        velocity = createDoubleFBO(simRes.width, simRes.height, rgbaLocal.internalFormat, rgbaLocal.format, texTypeLocal, filteringLocal);
        divergence = createFBO(simRes.width, simRes.height, rgbaLocal.internalFormat, rgbaLocal.format, texTypeLocal, gl.NEAREST);
        curl = createFBO(simRes.width, simRes.height, rgbaLocal.internalFormat, rgbaLocal.format, texTypeLocal, gl.NEAREST);
        pressure = createDoubleFBO(simRes.width, simRes.height, rgbaLocal.internalFormat, rgbaLocal.format, texTypeLocal, gl.NEAREST);
        bloom = createFBO(dyeRes.width, dyeRes.height, rgbaLocal.internalFormat, rgbaLocal.format, texTypeLocal, filteringLocal);
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.floor(canvas.clientWidth * dpr);
        const height = Math.floor(canvas.clientHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          initFramebuffers();
          return true;
        }
        return false;
      }

      function HSVtoRGB(h, s, v) {
        let r, g, b;
        const i = Math.floor(h * 6);
        const f = h * 6 - i;
        const p = v * (1 - s);
        const q = v * (1 - f * s);
        const t = v * (1 - (1 - f) * s);
        switch (i % 6) {
          case 0: r = v; g = t; b = p; break;
          case 1: r = q; g = v; b = p; break;
          case 2: r = p; g = v; b = t; break;
          case 3: r = p; g = q; b = v; break;
          case 4: r = t; g = p; b = v; break;
          case 5: r = v; g = p; b = q; break;
        }
        return { r, g, b };
      }

      function generateColor() {
        const c = HSVtoRGB(Math.random(), 1.0, 1.0);
        c.r *= 0.35 * config.DYE_AMOUNT;
        c.g *= 0.35 * config.DYE_AMOUNT;
        c.b *= 0.35 * config.DYE_AMOUNT;
        return c;
      }

      function splat(x, y, dx, dy, color) {
        splatProgram.bind();
        gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
        gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
        gl.uniform2f(splatProgram.uniforms.point, x, y);
        gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
        gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
        blit(velocity.write.fbo);
        velocity.swap();

        gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
        gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
        blit(dye.write.fbo);
        dye.swap();
      }

      function correctRadius(radius) {
        const aspectRatio = canvas.width / canvas.height;
        if (aspectRatio > 1) radius *= aspectRatio;
        return radius;
      }

      function multipleSplats(amount) {
        for (let i = 0; i < amount; i++) {
          const color = generateColor();
          color.r *= 8.0;
          color.g *= 8.0;
          color.b *= 8.0;
          const x = Math.random();
          const y = Math.random();
          const dx = 1000 * (Math.random() - 0.5);
          const dy = 1000 * (Math.random() - 0.5);
          splat(x, y, dx, dy, color);
        }
      }

      function step(dt) {
        gl.disable(gl.BLEND);

        curlProgram.bind();
        gl.uniform2f(curlProgram.uniforms.texelSize, 1.0 / velocity.width, 1.0 / velocity.height);
        gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(curl.fbo);

        vorticityProgram.bind();
        gl.uniform2f(vorticityProgram.uniforms.texelSize, 1.0 / velocity.width, 1.0 / velocity.height);
        gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
        gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
        gl.uniform1f(vorticityProgram.uniforms.dt, dt);
        blit(velocity.write.fbo);
        velocity.swap();

        divergenceProgram.bind();
        gl.uniform2f(divergenceProgram.uniforms.texelSize, 1.0 / velocity.width, 1.0 / velocity.height);
        gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(divergence.fbo);

        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, 0.8);
        blit(pressure.write.fbo);
        pressure.swap();

        pressureProgram.bind();
        gl.uniform2f(pressureProgram.uniforms.texelSize, 1.0 / velocity.width, 1.0 / velocity.height);
        gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
        for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
          gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
          blit(pressure.write.fbo);
          pressure.swap();
        }

        gradientSubtractProgram.bind();
        gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, 1.0 / velocity.width, 1.0 / velocity.height);
        gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
        gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
        blit(velocity.write.fbo);
        velocity.swap();

        advectionProgram.bind();
        gl.uniform2f(advectionProgram.uniforms.texelSize, 1.0 / velocity.width, 1.0 / velocity.height);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(advectionProgram.uniforms.uSource, velocity.read.attach(0));
        gl.uniform1f(advectionProgram.uniforms.dt, dt);
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.uniform2f(advectionProgram.uniforms.texelSize, 1.0 / dye.width, 1.0 / dye.height);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
        blit(dye.write.fbo);
        dye.swap();
      }

      function applyBloom() {
        bloomPrefilterProgram.bind();
        gl.uniform1i(bloomPrefilterProgram.uniforms.uTexture, dye.read.attach(0));
        gl.uniform1f(bloomPrefilterProgram.uniforms.threshold, 0.55);
        blit(bloom.fbo);

        bloomBlurProgram.bind();
        const texelX = 1.0 / bloom.width;
        const texelY = 1.0 / bloom.height;
        for (let i = 0; i < 4; i++) {
          gl.uniform1i(bloomBlurProgram.uniforms.uTexture, bloom.attach(0));
          gl.uniform2f(bloomBlurProgram.uniforms.direction, texelX * (i + 1), 0.0);
          blit(dye.write.fbo);
          gl.uniform1i(bloomBlurProgram.uniforms.uTexture, dye.write.attach(0));
          gl.uniform2f(bloomBlurProgram.uniforms.direction, 0.0, texelY * (i + 1));
          blit(bloom.fbo);
        }
      }

      function render() {
        if (config.BLOOM) applyBloom();

        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.enable(gl.BLEND);

        displayProgram.bind();
        gl.uniform1i(displayProgram.uniforms.uTexture, dye.read.attach(0));
        gl.uniform1i(displayProgram.uniforms.uBloom, bloom.attach(1));
        gl.uniform1f(displayProgram.uniforms.bloomEnabled, config.BLOOM ? 1.0 : 0.0);
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        blit(null);
      }

      const pointers = [{
        id: -1,
        texcoordX: 0,
        texcoordY: 0,
        prevTexcoordX: 0,
        prevTexcoordY: 0,
        deltaX: 0,
        deltaY: 0,
        down: false,
        moved: false,
        color: generateColor(),
      }];

      function updatePointerDownData(pointer, id, posX, posY) {
        pointer.id = id;
        pointer.down = true;
        pointer.moved = false;
        pointer.texcoordX = posX / canvas.width;
        pointer.texcoordY = 1.0 - posY / canvas.height;
        pointer.prevTexcoordX = pointer.texcoordX;
        pointer.prevTexcoordY = pointer.texcoordY;
        pointer.deltaX = 0;
        pointer.deltaY = 0;
        pointer.color = generateColor();
      }

      function updatePointerMoveData(pointer, posX, posY) {
        pointer.prevTexcoordX = pointer.texcoordX;
        pointer.prevTexcoordY = pointer.texcoordY;
        pointer.texcoordX = posX / canvas.width;
        pointer.texcoordY = 1.0 - posY / canvas.height;
        pointer.deltaX = correctDeltaX(pointer.texcoordX - pointer.prevTexcoordX);
        pointer.deltaY = correctDeltaY(pointer.texcoordY - pointer.prevTexcoordY);
        pointer.moved = Math.abs(pointer.deltaX) > 0 || Math.abs(pointer.deltaY) > 0;
      }

      function updatePointerUpData(pointer) {
        pointer.down = false;
      }

      function correctDeltaX(delta) {
        const aspectRatio = canvas.width / canvas.height;
        if (aspectRatio < 1) delta *= aspectRatio;
        return delta;
      }

      function correctDeltaY(delta) {
        const aspectRatio = canvas.width / canvas.height;
        if (aspectRatio > 1) delta /= aspectRatio;
        return delta;
      }

      function scaleByPixelRatio(input) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        return Math.floor(input * dpr);
      }

      canvas.addEventListener("mousedown", (e) => {
        const posX = scaleByPixelRatio(e.offsetX);
        const posY = scaleByPixelRatio(e.offsetY);
        updatePointerDownData(pointers[0], -1, posX, posY);
      });

      canvas.addEventListener("mousemove", (e) => {
        const pointer = pointers[0];
        if (!pointer.down) return;
        const posX = scaleByPixelRatio(e.offsetX);
        const posY = scaleByPixelRatio(e.offsetY);
        updatePointerMoveData(pointer, posX, posY);
      });

      window.addEventListener("mouseup", () => {
        updatePointerUpData(pointers[0]);
      });

      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
          if (i >= pointers.length) pointers.push({ ...pointers[0], color: generateColor() });
          const posX = scaleByPixelRatio(touches[i].clientX);
          const posY = scaleByPixelRatio(touches[i].clientY);
          updatePointerDownData(pointers[i], touches[i].identifier, posX, posY);
        }
      }, { passive: false });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
          const pointer = pointers[i];
          if (!pointer.down) continue;
          const posX = scaleByPixelRatio(touches[i].clientX);
          const posY = scaleByPixelRatio(touches[i].clientY);
          updatePointerMoveData(pointer, posX, posY);
        }
      }, { passive: false });

      window.addEventListener("touchend", (e) => {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
          for (let j = 0; j < pointers.length; j++) {
            if (touches[i].identifier === pointers[j].id) {
              updatePointerUpData(pointers[j]);
            }
          }
        }
      });

      const btnSplat = document.getElementById("btn-splat");
      const btnClear = document.getElementById("btn-clear");
      const btnPause = document.getElementById("btn-pause");
      const chkBloom = document.getElementById("chk-bloom");
      const rngDye = document.getElementById("rng-dye");
      const rngForce = document.getElementById("rng-force");
      const rngCurl = document.getElementById("rng-curl");
      const rngDissipate = document.getElementById("rng-dissipate");
      const valDye = document.getElementById("val-dye");
      const valForce = document.getElementById("val-force");
      const valCurl = document.getElementById("val-curl");
      const valDissipate = document.getElementById("val-dissipate");

      btnSplat.addEventListener("click", () => multipleSplats(8));
      btnClear.addEventListener("click", () => {
        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, dye.read.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, 0.0);
        blit(dye.write.fbo);
        dye.swap();
        gl.uniform1i(clearProgram.uniforms.uTexture, velocity.read.attach(0));
        blit(velocity.write.fbo);
        velocity.swap();
      });
      btnPause.addEventListener("click", () => {
        config.PAUSED = !config.PAUSED;
        btnPause.textContent = config.PAUSED ? "Resume" : "Pause";
      });
      chkBloom.addEventListener("change", () => {
        config.BLOOM = chkBloom.checked;
      });
      rngDye.addEventListener("input", () => {
        config.DYE_AMOUNT = parseFloat(rngDye.value);
        valDye.textContent = config.DYE_AMOUNT.toFixed(2);
      });
      rngForce.addEventListener("input", () => {
        config.SPLAT_FORCE = parseFloat(rngForce.value);
        valForce.textContent = String(Math.round(config.SPLAT_FORCE));
      });
      rngCurl.addEventListener("input", () => {
        config.CURL = parseFloat(rngCurl.value);
        valCurl.textContent = String(Math.round(config.CURL));
      });
      rngDissipate.addEventListener("input", () => {
        config.DENSITY_DISSIPATION = parseFloat(rngDissipate.value);
        valDissipate.textContent = config.DENSITY_DISSIPATION.toFixed(3);
      });

      resizeCanvas();
      multipleSplats(12);

      let lastTime = Date.now();
      function update() {
        const now = Date.now();
        let dt = (now - lastTime) / 1000;
        lastTime = now;
        if (dt > 0.05) dt = 0.05;

        if (resizeCanvas()) {
          // framebuffers rebuilt
        }

        for (const p of pointers) {
          if (p.moved) {
            p.moved = false;
            splat(
              p.texcoordX,
              p.texcoordY,
              p.deltaX * config.SPLAT_FORCE,
              p.deltaY * config.SPLAT_FORCE,
              p.color
            );
          }
        }

        if (!config.PAUSED) step(dt);
        render();
        requestAnimationFrame(update);
      }

      update();
    })();
  </script>
</body>
</html>
