<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse — Desktop Music Player</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-elevated: #12151c;
    --bg-panel: #161a24;
    --bg-hover: #1e2433;
    --bg-active: #252c3d;
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.12);
    --text: #f2f4f8;
    --text-muted: #8b93a7;
    --text-dim: #5c6478;
    --accent: #7c5cff;
    --accent-2: #2ee6a6;
    --accent-soft: rgba(124, 92, 255, 0.18);
    --danger: #ff5c7a;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    --radius: 14px;
    --radius-sm: 10px;
    --player-h: 92px;
    --sidebar-w: 260px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  button, input { font: inherit; color: inherit; }
  button {
    background: none;
    border: none;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 1fr var(--player-h);
    height: 100%;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124, 92, 255, 0.16), transparent 55%),
      radial-gradient(900px 500px at 90% 0%, rgba(46, 230, 166, 0.08), transparent 50%),
      var(--bg);
  }

  /* Sidebar */
  .sidebar {
    grid-row: 1 / 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 20px 14px 16px;
    border-right: 1px solid var(--border);
    background: rgba(10, 12, 18, 0.72);
    backdrop-filter: blur(16px);
    overflow: hidden;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px 18px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #4f8cff 55%, var(--accent-2));
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
  }

  .brand-mark svg { width: 18px; height: 18px; fill: white; }

  .brand h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .brand p {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 12px;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
    text-align: left;
  }

  .nav-btn:hover { background: var(--bg-hover); color: var(--text); }
  .nav-btn.active {
    background: var(--accent-soft);
    color: #d9d0ff;
  }

  .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }

  .sidebar-section {
    margin-top: 18px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-section span {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }

  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }

  .playlist-list {
    flex: 1;
    overflow-y: auto;
    margin-top: 8px;
    padding: 0 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .playlist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    color: var(--text-muted);
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }

  .playlist-item:hover { background: var(--bg-hover); color: var(--text); }
  .playlist-item.active {
    background: var(--bg-active);
    color: var(--text);
  }

  .playlist-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 10px;
  }

  .drop-hint {
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    line-height: 1.45;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }

  .drop-hint.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: #d9d0ff;
  }

  .drop-hint strong { color: var(--text-muted); }

  /* Main */
  .main {
    grid-row: 1 / 2;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 28px 10px;
  }

  .search {
    flex: 1;
    max-width: 420px;
    position: relative;
  }

  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    pointer-events: none;
  }

  .search input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 11px 16px 11px 42px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search input::placeholder { color: var(--text-dim); }
  .search input:focus {
    border-color: rgba(124, 92, 255, 0.55);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .top-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn:active { transform: scale(0.98); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #5a8dff);
    border-color: transparent;
    box-shadow: 0 8px 22px rgba(124, 92, 255, 0.28);
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn svg { width: 16px; height: 16px; }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 10px 28px 28px;
  }

  .hero {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 24px;
    align-items: end;
    padding: 18px 0 26px;
  }

  .hero-art {
    width: 180px;
    height: 180px;
    border-radius: 18px;
    background: linear-gradient(145deg, #2a2450, #1a3040 50%, #243018);
    box-shadow: var(--shadow);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero-art::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.18), transparent 40%),
      linear-gradient(160deg, transparent 40%, rgba(0,0,0,0.35));
  }

  .hero-art .eq {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 48px;
    z-index: 1;
  }

  .hero-art .eq span {
    width: 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.85);
    animation: none;
  }

  .hero-art.playing .eq span {
    animation: eq 0.9s ease-in-out infinite;
  }

  .hero-art .eq span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .hero-art .eq span:nth-child(2) { height: 75%; animation-delay: 0.12s; }
  .hero-art .eq span:nth-child(3) { height: 55%; animation-delay: 0.24s; }
  .hero-art .eq span:nth-child(4) { height: 90%; animation-delay: 0.08s; }
  .hero-art .eq span:nth-child(5) { height: 45%; animation-delay: 0.2s; }

  @keyframes eq {
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(1); }
  }

  .hero-meta .eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 8px;
  }

  .hero-meta h2 {
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .hero-meta .sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 18px;
  }

  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .track-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }

  .track-table th {
    text-align: left;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .track-table th:first-child { width: 48px; text-align: center; }
  .track-table th.dur { width: 72px; text-align: right; }
  .track-table th.actions { width: 56px; }

  .track-row {
    cursor: pointer;
    transition: background 0.12s;
  }

  .track-row:hover td { background: rgba(255,255,255,0.03); }
  .track-row.active td { background: var(--accent-soft); }
  .track-row td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .track-row td:first-child {
    text-align: center;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
  }

  .track-row.active td:first-child,
  .track-row:hover td:first-child { color: transparent; }

  .idx-wrap {
    position: relative;
    width: 24px;
    height: 24px;
    margin: 0 auto;
    display: grid;
    place-items: center;
  }

  .idx-wrap .num { transition: opacity 0.1s; }
  .idx-wrap .play-mini {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    color: var(--text);
  }

  .track-row:hover .idx-wrap .num,
  .track-row.active .idx-wrap .num { opacity: 0; }
  .track-row:hover .idx-wrap .play-mini,
  .track-row.active .idx-wrap .play-mini { opacity: 1; }

  .track-row.active .idx-wrap .play-mini { color: #cbbdff; }

  .track-title {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .track-thumb {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
  }

  .track-title-text { min-width: 0; }
  .track-title-text .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-row.active .track-title-text .name { color: #d7ceff; }
  .track-title-text .artist {
    font-size: 0.82rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dur-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-family: var(--mono);
  }

  .like-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.12s, color 0.12s, background 0.12s;
  }

  .track-row:hover .like-btn,
  .like-btn.liked { opacity: 1; }
  .like-btn:hover { background: var(--bg-hover); color: var(--danger); }
  .like-btn.liked { color: var(--danger); }
  .like-btn svg { width: 16px; height: 16px; }

  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-muted);
  }

  .empty h3 { color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 0.92rem; line-height: 1.5; }

  /* Player bar */
  .player {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    align-items: center;
    gap: 16px;
    padding: 0 22px;
    border-top: 1px solid var(--border);
    background: rgba(12, 14, 20, 0.92);
    backdrop-filter: blur(18px);
  }

  .now {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .now-art {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }

  .now-art canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .now-text { min-width: 0; }
  .now-text .title {
    font-weight: 700;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-text .artist {
    color: var(--text-muted);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .now-like {
    margin-left: 4px;
    color: var(--text-dim);
  }
  .now-like.liked { color: var(--danger); }
  .now-like svg { width: 18px; height: 18px; }

  .transport {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ctrl {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }

  .ctrl:hover { background: var(--bg-hover); color: var(--text); }
  .ctrl:active { transform: scale(0.94); }
  .ctrl.on { color: var(--accent-2); }
  .ctrl svg { width: 18px; height: 18px; }

  .ctrl.play {
    width: 46px;
    height: 46px;
    background: var(--text);
    color: #111;
    margin: 0 4px;
  }

  .ctrl.play:hover {
    background: white;
    color: #111;
    filter: brightness(1.05);
  }

  .ctrl.play svg { width: 20px; height: 20px; }

  .timeline {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }

  .time {
    font-size: 0.72rem;
    font-family: var(--mono);
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .time.end { text-align: right; }

  .slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 999px;
    background: var(--bg-active);
    outline: none;
    cursor: pointer;
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.0);
    transition: box-shadow 0.15s, transform 0.1s;
  }

  .slider:hover::-webkit-slider-thumb {
    transform: scale(1.12);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .slider::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: white;
  }

  .extras {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .volume {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 140px;
  }

  .volume .ctrl { width: 32px; height: 32px; }
  .volume .ctrl svg { width: 16px; height: 16px; }

  .toast {
    position: fixed;
    bottom: calc(var(--player-h) + 18px);
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .hidden-file { display: none; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 72px 1fr; }
    .brand p, .nav-btn span, .sidebar-section, .playlist-list, .sidebar-footer, .playlist-item span { display: none; }
    .brand { justify-content: center; padding: 6px 0 14px; }
    .nav-btn { justify-content: center; padding: 12px; }
    .hero { grid-template-columns: 120px 1fr; }
    .hero-art { width: 120px; height: 120px; }
    .player { grid-template-columns: 1fr; padding: 10px 16px; height: auto; min-height: var(--player-h); }
    .now, .extras { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l12-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div>
        <h1>Pulse</h1>
        <p>Desktop player</p>
      </div>
    </div>

    <nav class="nav" aria-label="Library">
      <button class="nav-btn active" data-view="library" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Library</span>
      </button>
      <button class="nav-btn" data-view="liked" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span>Liked</span>
      </button>
      <button class="nav-btn" data-view="recent" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Recent</span>
      </button>
    </nav>

    <div class="sidebar-section">
      <span>Playlists</span>
      <button class="icon-btn" id="newPlaylistBtn" type="button" title="New playlist" aria-label="New playlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="playlist-list" id="playlistList" role="list"></div>

    <div class="sidebar-footer">
      <div class="drop-hint" id="dropHint">
        Drop audio files here<br />or <strong>click Add music</strong>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="searchInput" type="search" placeholder="Search tracks, artists…" autocomplete="off" />
      </div>
      <div class="top-actions">
        <button class="btn" id="addMusicBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add music
        </button>
        <button class="btn primary" id="playAllBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Play all
        </button>
      </div>
    </div>

    <div class="content">
      <section class="hero">
        <div class="hero-art" id="heroArt">
          <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="hero-meta">
          <div class="eyebrow" id="viewEyebrow">Collection</div>
          <h2 id="viewTitle">Your Library</h2>
          <p class="sub" id="viewSub">Demo synth tracks plus anything you add from disk.</p>
          <div class="hero-actions">
            <button class="btn primary" id="shufflePlayBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              Shuffle play
            </button>
          </div>
        </div>
      </section>

      <table class="track-table" aria-label="Tracks">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Album</th>
            <th class="dur">Time</th>
            <th class="actions"></th>
          </tr>
        </thead>
        <tbody id="trackBody"></tbody>
      </table>
      <div class="empty hidden" id="emptyState" hidden>
        <h3>No tracks here</h3>
        <p>Add audio files or switch to another view.</p>
      </div>
    </div>
  </main>

  <footer class="player" aria-label="Playback controls">
    <div class="now">
      <div class="now-art" id="nowArt" style="background: linear-gradient(145deg, #2a2450, #1a3040);">
        <canvas id="vizCanvas" width="58" height="58" aria-hidden="true"></canvas>
      </div>
      <div class="now-text">
        <div class="title" id="nowTitle">Nothing playing</div>
        <div class="artist" id="nowArtist">Choose a track to start</div>
      </div>
      <button class="icon-btn now-like" id="nowLikeBtn" type="button" title="Like" aria-label="Like track" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
    </div>

    <div class="transport">
      <div class="controls">
        <button class="ctrl" id="shuffleBtn" type="button" title="Shuffle" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="ctrl" id="prevBtn" type="button" title="Previous" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl play" id="playBtn" type="button" title="Play" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl" id="nextBtn" type="button" title="Next" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-11 6 8.5-6v12z"/></svg>
        </button>
        <button class="ctrl" id="repeatBtn" type="button" title="Repeat" aria-label="Repeat" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="timeline">
        <span class="time" id="curTime">0:00</span>
        <input class="slider" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <span class="time end" id="durTime">0:00</span>
      </div>
    </div>

    <div class="extras">
      <div class="volume">
        <button class="ctrl" id="muteBtn" type="button" title="Mute" aria-label="Mute">
          <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
        </button>
        <input class="slider" id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" />
      </div>
    </div>
  </footer>
</div>

<input class="hidden-file" id="fileInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" multiple />
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  const PALETTES = [
    ["#7c5cff", "#2ee6a6"],
    ["#ff5c7a", "#ffb020"],
    ["#4f8cff", "#7c5cff"],
    ["#2ee6a6", "#4f8cff"],
    ["#ffb020", "#ff5c7a"],
    ["#c084fc", "#22d3ee"],
  ];

  const DEMO_TRACKS = [
    { id: "demo-aurora", title: "Aurora Drift", artist: "Pulse Demo", album: "Synth Sketches", duration: 32, demo: "aurora", color: 0 },
    { id: "demo-neon", title: "Neon Boulevard", artist: "Pulse Demo", album: "Synth Sketches", duration: 28, demo: "neon", color: 1 },
    { id: "demo-glass", title: "Glass Harbor", artist: "Pulse Demo", album: "Night Signals", duration: 36, demo: "glass", color: 2 },
    { id: "demo-ember", title: "Ember Circuit", artist: "Pulse Demo", album: "Night Signals", duration: 30, demo: "ember", color: 3 },
    { id: "demo-orbit", title: "Quiet Orbit", artist: "Pulse Demo", album: "Soft Machines", duration: 40, demo: "orbit", color: 4 },
  ];

  const state = {
    tracks: DEMO_TRACKS.map((t) => ({ ...t, liked: false, objectUrl: null })),
    playlists: [
      { id: "pl-focus", name: "Focus Flow", color: "#7c5cff", trackIds: ["demo-aurora", "demo-orbit", "demo-glass"] },
      { id: "pl-drive", name: "Late Drive", color: "#2ee6a6", trackIds: ["demo-neon", "demo-ember"] },
    ],
    view: "library",
    activePlaylistId: null,
    query: "",
    queue: [],
    index: -1,
    playing: false,
    shuffle: false,
    repeat: "off", // off | all | one
    volume: 0.8,
    muted: false,
    recentIds: [],
    seekDragging: false,
  };

  // Audio engine
  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let htmlAudio = null;
  let demoNodes = [];
  let demoTimer = null;
  let demoStart = 0;
  let demoDuration = 0;
  let demoTrackId = null;
  let rafId = 0;
  let objectUrls = new Set();

  const $ = (id) => document.getElementById(id);
  const els = {
    trackBody: $("trackBody"),
    emptyState: $("emptyState"),
    playlistList: $("playlistList"),
    searchInput: $("searchInput"),
    viewEyebrow: $("viewEyebrow"),
    viewTitle: $("viewTitle"),
    viewSub: $("viewSub"),
    heroArt: $("heroArt"),
    nowTitle: $("nowTitle"),
    nowArtist: $("nowArtist"),
    nowArt: $("nowArt"),
    nowLikeBtn: $("nowLikeBtn"),
    playBtn: $("playBtn"),
    playIcon: $("playIcon"),
    prevBtn: $("prevBtn"),
    nextBtn: $("nextBtn"),
    shuffleBtn: $("shuffleBtn"),
    repeatBtn: $("repeatBtn"),
    seek: $("seek"),
    curTime: $("curTime"),
    durTime: $("durTime"),
    volume: $("volume"),
    muteBtn: $("muteBtn"),
    volIcon: $("volIcon"),
    fileInput: $("fileInput"),
    addMusicBtn: $("addMusicBtn"),
    playAllBtn: $("playAllBtn"),
    shufflePlayBtn: $("shufflePlayBtn"),
    newPlaylistBtn: $("newPlaylistBtn"),
    dropHint: $("dropHint"),
    toast: $("toast"),
    vizCanvas: $("vizCanvas"),
    app: $("app"),
  };

  const vizCtx = els.vizCanvas.getContext("2d");

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = state.muted ? 0 : state.volume;
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      masterGain.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return "0:00";
    const s = Math.floor(sec % 60);
    const m = Math.floor(sec / 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  function gradientFor(colorIndex) {
    const [a, b] = PALETTES[colorIndex % PALETTES.length];
    return `linear-gradient(145deg, ${a}, ${b})`;
  }

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove("show"), 2200);
  }

  function getTrack(id) {
    return state.tracks.find((t) => t.id === id);
  }

  function visibleTracks() {
    let list;
    if (state.view === "liked") {
      list = state.tracks.filter((t) => t.liked);
    } else if (state.view === "recent") {
      list = state.recentIds.map(getTrack).filter(Boolean);
    } else if (state.view === "playlist" && state.activePlaylistId) {
      const pl = state.playlists.find((p) => p.id === state.activePlaylistId);
      list = (pl ? pl.trackIds : []).map(getTrack).filter(Boolean);
    } else {
      list = state.tracks.slice();
    }
    const q = state.query.trim().toLowerCase();
    if (q) {
      list = list.filter((t) =>
        [t.title, t.artist, t.album].some((x) => (x || "").toLowerCase().includes(q))
      );
    }
    return list;
  }

  function currentTrack() {
    if (state.index < 0 || state.index >= state.queue.length) return null;
    return getTrack(state.queue[state.index]);
  }

  function stopDemo() {
    if (demoTimer) {
      clearTimeout(demoTimer);
      demoTimer = null;
    }
    demoNodes.forEach((n) => {
      try { n.stop(); } catch (_) {}
      try { n.disconnect(); } catch (_) {}
    });
    demoNodes = [];
    demoTrackId = null;
  }

  function stopHtmlAudio() {
    if (htmlAudio) {
      htmlAudio.pause();
      htmlAudio.removeAttribute("src");
      htmlAudio.load();
    }
  }

  function stopAll() {
    stopDemo();
    stopHtmlAudio();
    state.playing = false;
    els.heroArt.classList.remove("playing");
    updatePlayButton();
  }

  // Procedural demo synth patterns
  function scheduleDemo(kind, duration) {
    ensureAudio();
    stopDemo();
    const ctx = audioCtx;
    const now = ctx.currentTime;
    demoStart = now;
    demoDuration = duration;
    demoTrackId = kind;

    const tempo = { aurora: 96, neon: 118, glass: 88, ember: 128, orbit: 72 }[kind] || 100;
    const beat = 60 / tempo;
    const steps = Math.floor(duration / beat);

    const scales = {
      aurora: [57, 60, 64, 67, 72, 76],
      neon: [50, 53, 57, 60, 65, 69],
      glass: [62, 64, 67, 69, 74, 76],
      ember: [48, 51, 55, 58, 63, 67],
      orbit: [55, 58, 62, 65, 70, 74],
    };
    const scale = scales[kind] || scales.aurora;

    function tone(freq, t0, dur, type, gainVal, filterFreq) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      const f = ctx.createBiquadFilter();
      osc.type = type;
      osc.frequency.value = freq;
      f.type = "lowpass";
      f.frequency.value = filterFreq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gainVal, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(f);
      f.connect(g);
      g.connect(masterGain);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
      demoNodes.push(osc);
    }

    function noiseHit(t0, dur, gainVal) {
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      const f = ctx.createBiquadFilter();
      f.type = "highpass";
      f.frequency.value = 1800;
      g.gain.value = gainVal;
      src.connect(f);
      f.connect(g);
      g.connect(masterGain);
      src.start(t0);
      demoNodes.push(src);
    }

    // Pad drone
    const root = 440 * Math.pow(2, (scale[0] - 69) / 12);
    tone(root / 2, now, duration, "sine", 0.06, 600);
    tone(root, now, duration, "triangle", 0.04, 900);

    for (let i = 0; i < steps; i++) {
      const t = now + i * beat;
      const note = scale[i % scale.length];
      const freq = 440 * Math.pow(2, (note - 69) / 12);
      const pattern = i % 8;

      if (kind === "aurora" || kind === "orbit" || kind === "glass") {
        if (pattern % 2 === 0) tone(freq, t, beat * 1.6, "sine", 0.09, 1400);
        if (pattern === 0 || pattern === 4) tone(freq * 1.5, t + beat * 0.5, beat, "triangle", 0.05, 1800);
      } else {
        if (pattern === 0 || pattern === 3 || pattern === 5) tone(freq, t, beat * 0.45, "square", 0.045, 1200);
        if (pattern === 2 || pattern === 6) tone(freq * 2, t, beat * 0.3, "sawtooth", 0.03, 2000);
      }

      if (i % 2 === 0) noiseHit(t, 0.05, kind === "neon" || kind === "ember" ? 0.04 : 0.02);
      if (i % 4 === 0) {
        const bass = 440 * Math.pow(2, (scale[0] - 24 - 69) / 12);
        tone(bass, t, beat * 1.2, "sine", 0.12, 300);
      }
    }

    demoTimer = setTimeout(() => {
      if (state.playing && demoTrackId === kind) onTrackEnded();
    }, duration * 1000 + 40);
  }

  function ensureHtmlAudio() {
    if (!htmlAudio) {
      htmlAudio = new Audio();
      htmlAudio.preload = "auto";
      htmlAudio.addEventListener("timeupdate", onHtmlTime);
      htmlAudio.addEventListener("ended", onTrackEnded);
      htmlAudio.addEventListener("loadedmetadata", () => {
        els.durTime.textContent = formatTime(htmlAudio.duration);
      });
      htmlAudio.addEventListener("error", () => {
        toast("Could not play this file");
        stopAll();
      });
    }
    return htmlAudio;
  }

  function connectHtmlToGraph() {
    ensureAudio();
    if (!htmlAudio._connected) {
      try {
        const src = audioCtx.createMediaElementSource(htmlAudio);
        src.connect(masterGain);
        htmlAudio._connected = true;
      } catch (_) {
        // Already connected or CORS — volume still works via element
      }
    }
  }

  function onHtmlTime() {
    if (state.seekDragging || !htmlAudio) return;
    const d = htmlAudio.duration || 0;
    const c = htmlAudio.currentTime || 0;
    els.curTime.textContent = formatTime(c);
    els.durTime.textContent = formatTime(d);
    if (d > 0) els.seek.value = Math.round((c / d) * 1000);
  }

  function getDemoProgress() {
    if (!audioCtx || !demoDuration) return { c: 0, d: demoDuration };
    const c = Math.min(demoDuration, Math.max(0, audioCtx.currentTime - demoStart));
    return { c, d: demoDuration };
  }

  function tick() {
    const track = currentTrack();
    if (track && track.demo && state.playing && !state.seekDragging) {
      const { c, d } = getDemoProgress();
      els.curTime.textContent = formatTime(c);
      els.durTime.textContent = formatTime(d);
      els.seek.value = d ? Math.round((c / d) * 1000) : 0;
    }
    drawViz();
    rafId = requestAnimationFrame(tick);
  }

  function drawViz() {
    const w = els.vizCanvas.width;
    const h = els.vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    const track = currentTrack();
    const colors = track ? PALETTES[track.color % PALETTES.length] : ["#7c5cff", "#2ee6a6"];
    const grd = vizCtx.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, colors[0]);
    grd.addColorStop(1, colors[1]);
    vizCtx.fillStyle = grd;
    vizCtx.fillRect(0, 0, w, h);

    if (!analyser || !state.playing) {
      vizCtx.fillStyle = "rgba(255,255,255,0.2)";
      for (let i = 0; i < 5; i++) {
        const bh = 8 + (i % 3) * 6;
        vizCtx.fillRect(12 + i * 8, h / 2 - bh / 2, 4, bh);
      }
      return;
    }

    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const bars = 8;
    const gap = 2;
    const bw = (w - 16 - gap * (bars - 1)) / bars;
    vizCtx.fillStyle = "rgba(255,255,255,0.85)";
    for (let i = 0; i < bars; i++) {
      const v = data[i + 2] / 255;
      const bh = Math.max(4, v * (h - 16));
      const x = 8 + i * (bw + gap);
      const y = (h - bh) / 2;
      vizCtx.beginPath();
      vizCtx.roundRect(x, y, bw, bh, 2);
      vizCtx.fill();
    }
  }

  function updatePlayButton() {
    if (state.playing) {
      els.playIcon.innerHTML = '<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>';
      els.playBtn.title = "Pause";
      els.playBtn.setAttribute("aria-label", "Pause");
      els.heroArt.classList.add("playing");
    } else {
      els.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      els.playBtn.title = "Play";
      els.playBtn.setAttribute("aria-label", "Play");
      els.heroArt.classList.remove("playing");
    }
  }

  function updateNowPlaying() {
    const track = currentTrack();
    if (!track) {
      els.nowTitle.textContent = "Nothing playing";
      els.nowArtist.textContent = "Choose a track to start";
      els.nowArt.style.background = "linear-gradient(145deg, #2a2450, #1a3040)";
      els.nowLikeBtn.disabled = true;
      els.nowLikeBtn.classList.remove("liked");
      els.durTime.textContent = "0:00";
      els.curTime.textContent = "0:00";
      els.seek.value = 0;
      return;
    }
    els.nowTitle.textContent = track.title;
    els.nowArtist.textContent = track.artist;
    els.nowArt.style.background = gradientFor(track.color);
    els.heroArt.style.background = gradientFor(track.color);
    els.nowLikeBtn.disabled = false;
    els.nowLikeBtn.classList.toggle("liked", !!track.liked);
    els.durTime.textContent = formatTime(track.duration || 0);
  }

  function pushRecent(id) {
    state.recentIds = [id, ...state.recentIds.filter((x) => x !== id)].slice(0, 30);
  }

  async function playAt(index) {
    if (index < 0 || index >= state.queue.length) return;
    state.index = index;
    const track = currentTrack();
    if (!track) return;

    stopDemo();
    stopHtmlAudio();
    ensureAudio();
    pushRecent(track.id);
    updateNowPlaying();
    render();

    try {
      if (track.demo) {
        scheduleDemo(track.demo, track.duration);
        state.playing = true;
      } else if (track.objectUrl) {
        const audio = ensureHtmlAudio();
        connectHtmlToGraph();
        audio.src = track.objectUrl;
        audio.volume = state.muted ? 0 : state.volume;
        await audio.play();
        state.playing = true;
      } else {
        toast("Track has no audio source");
        state.playing = false;
      }
    } catch (err) {
      toast("Playback blocked — press play again");
      state.playing = false;
    }

    updatePlayButton();
    applyVolume();
  }

  function togglePlay() {
    const track = currentTrack();
    if (!track) {
      const list = visibleTracks();
      if (!list.length) {
        toast("No tracks to play");
        return;
      }
      setQueueFrom(list, 0, false);
      return;
    }

    if (state.playing) {
      pausePlayback();
    } else {
      resumePlayback();
    }
  }

  function pausePlayback() {
    if (currentTrack()?.demo) {
      if (audioCtx) audioCtx.suspend();
    } else if (htmlAudio) {
      htmlAudio.pause();
    }
    state.playing = false;
    updatePlayButton();
  }

  async function resumePlayback() {
    ensureAudio();
    const track = currentTrack();
    if (!track) return;
    if (track.demo) {
      if (!demoTrackId) {
        await playAt(state.index);
        return;
      }
      await audioCtx.resume();
      state.playing = true;
    } else if (htmlAudio && htmlAudio.src) {
      try {
        await htmlAudio.play();
        state.playing = true;
      } catch (_) {
        await playAt(state.index);
      }
    } else {
      await playAt(state.index);
    }
    updatePlayButton();
  }

  function onTrackEnded() {
    if (state.repeat === "one") {
      playAt(state.index);
      return;
    }
    const next = nextIndex(1);
    if (next === null) {
      stopAll();
      updateNowPlaying();
      return;
    }
    playAt(next);
  }

  function nextIndex(dir) {
    if (!state.queue.length) return null;
    if (state.shuffle && dir === 1) {
      if (state.queue.length === 1) return state.repeat === "all" ? 0 : null;
      let n;
      do {
        n = Math.floor(Math.random() * state.queue.length);
      } while (n === state.index && state.queue.length > 1);
      return n;
    }
    let n = state.index + dir;
    if (n >= state.queue.length) return state.repeat === "all" ? 0 : null;
    if (n < 0) return state.repeat === "all" ? state.queue.length - 1 : 0;
    return n;
  }

  function setQueueFrom(tracks, startIndex, shuffleFirst) {
    state.queue = tracks.map((t) => t.id);
    if (shuffleFirst) {
      state.shuffle = true;
      els.shuffleBtn.classList.add("on");
      els.shuffleBtn.setAttribute("aria-pressed", "true");
      // Fisher-Yates
      for (let i = state.queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.queue[i], state.queue[j]] = [state.queue[j], state.queue[i]];
      }
      playAt(0);
    } else {
      playAt(startIndex);
    }
  }

  function applyVolume() {
    const v = state.muted ? 0 : state.volume;
    if (masterGain) masterGain.gain.value = v;
    if (htmlAudio) htmlAudio.volume = v;
    updateVolIcon();
  }

  function updateVolIcon() {
    const muted = state.muted || state.volume === 0;
    els.volIcon.innerHTML = muted
      ? '<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/>'
      : '<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/>';
  }

  function seekTo(ratio) {
    const track = currentTrack();
    if (!track) return;
    if (track.demo) {
      // Restart demo at offset by rescheduling shorter remaining — approximate via restart
      const offset = ratio * track.duration;
      ensureAudio();
      stopDemo();
      // Simple approach: restart and fast-forward timeline display; full mid-seek synth is complex
      scheduleDemo(track.demo, track.duration);
      demoStart = audioCtx.currentTime - offset;
      // Stop early relative to remaining
      if (demoTimer) clearTimeout(demoTimer);
      const remaining = Math.max(0.05, track.duration - offset);
      demoTimer = setTimeout(() => {
        if (state.playing && demoTrackId === track.demo) onTrackEnded();
      }, remaining * 1000);
      if (!state.playing) {
        audioCtx.suspend();
      }
    } else if (htmlAudio && htmlAudio.duration) {
      htmlAudio.currentTime = ratio * htmlAudio.duration;
    }
  }

  function renderPlaylists() {
    els.playlistList.innerHTML = "";
    state.playlists.forEach((pl) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "playlist-item" + (state.view === "playlist" && state.activePlaylistId === pl.id ? " active" : "");
      btn.setAttribute("role", "listitem");
      btn.innerHTML = `<span class="playlist-dot" style="background:${pl.color}"></span><span>${escapeHtml(pl.name)}</span>`;
      btn.addEventListener("click", () => {
        state.view = "playlist";
        state.activePlaylistId = pl.id;
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
        render();
      });
      els.playlistList.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function updateViewHeader(list) {
    if (state.view === "liked") {
      els.viewEyebrow.textContent = "Collection";
      els.viewTitle.textContent = "Liked songs";
      els.viewSub.textContent = `${list.length} liked track${list.length === 1 ? "" : "s"}`;
    } else if (state.view === "recent") {
      els.viewEyebrow.textContent = "Collection";
      els.viewTitle.textContent = "Recently played";
      els.viewSub.textContent = list.length ? "Your latest listens" : "Play something to fill this list";
    } else if (state.view === "playlist") {
      const pl = state.playlists.find((p) => p.id === state.activePlaylistId);
      els.viewEyebrow.textContent = "Playlist";
      els.viewTitle.textContent = pl ? pl.name : "Playlist";
      els.viewSub.textContent = `${list.length} track${list.length === 1 ? "" : "s"}`;
    } else {
      els.viewEyebrow.textContent = "Collection";
      els.viewTitle.textContent = "Your Library";
      els.viewSub.textContent = `${list.length} track${list.length === 1 ? "" : "s"} · demo synth + local files`;
    }
  }

  function renderTracks() {
    const list = visibleTracks();
    updateViewHeader(list);
    els.trackBody.innerHTML = "";

    if (!list.length) {
      els.emptyState.hidden = false;
      return;
    }
    els.emptyState.hidden = true;

    const playingId = currentTrack()?.id;

    list.forEach((track, i) => {
      const tr = document.createElement("tr");
      tr.className = "track-row" + (playingId === track.id ? " active" : "");
      tr.dataset.id = track.id;

      tr.innerHTML = `
        <td>
          <div class="idx-wrap">
            <span class="num">${i + 1}</span>
            <span class="play-mini" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </div>
        </td>
        <td>
          <div class="track-title">
            <div class="track-thumb" style="background:${gradientFor(track.color)}"></div>
            <div class="track-title-text">
              <div class="name">${escapeHtml(track.title)}</div>
              <div class="artist">${escapeHtml(track.artist)}</div>
            </div>
          </div>
        </td>
        <td style="color:var(--text-muted);font-size:0.9rem">${escapeHtml(track.album || "—")}</td>
        <td class="dur-cell">${formatTime(track.duration || 0)}</td>
        <td>
          <button class="like-btn${track.liked ? " liked" : ""}" data-like="${track.id}" type="button" title="Like" aria-label="Like ${escapeHtml(track.title)}">
            <svg viewBox="0 0 24 24" fill="${track.liked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </td>`;

      tr.addEventListener("click", (e) => {
        if (e.target.closest("[data-like]")) return;
        const visible = visibleTracks();
        const idx = visible.findIndex((t) => t.id === track.id);
        setQueueFrom(visible, Math.max(0, idx), false);
      });

      tr.querySelector("[data-like]").addEventListener("click", (e) => {
        e.stopPropagation();
        track.liked = !track.liked;
        render();
        updateNowPlaying();
      });

      els.trackBody.appendChild(tr);
    });
  }

  function render() {
    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.view === state.view && state.view !== "playlist");
    });
    renderPlaylists();
    renderTracks();
    updateNowPlaying();
    updatePlayButton();
  }

  function addFiles(fileList) {
    const files = [...fileList].filter((f) => f.type.startsWith("audio/") || /\.(mp3|wav|ogg|flac|m4a|aac)$/i.test(f.name));
    if (!files.length) {
      toast("No audio files found");
      return;
    }

    files.forEach((file, i) => {
      const url = URL.createObjectURL(file);
      objectUrls.add(url);
      const id = "file-" + Date.now() + "-" + i + "-" + Math.random().toString(36).slice(2, 7);
      const name = file.name.replace(/\.[^.]+$/, "");
      state.tracks.push({
        id,
        title: name,
        artist: "Local file",
        album: "Imported",
        duration: 0,
        demo: null,
        objectUrl: url,
        liked: false,
        color: (state.tracks.length + i) % PALETTES.length,
      });

      // Probe duration
      const a = new Audio();
      a.src = url;
      a.addEventListener("loadedmetadata", () => {
        const t = getTrack(id);
        if (t) {
          t.duration = a.duration;
          render();
        }
      });
    });

    toast(`Added ${files.length} track${files.length === 1 ? "" : "s"}`);
    state.view = "library";
    state.activePlaylistId = null;
    render();
  }

  // Events
  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.view = btn.dataset.view;
      state.activePlaylistId = null;
      render();
    });
  });

  els.searchInput.addEventListener("input", () => {
    state.query = els.searchInput.value;
    renderTracks();
  });

  els.playBtn.addEventListener("click", togglePlay);
  els.prevBtn.addEventListener("click", () => {
    const track = currentTrack();
    if (track?.demo) {
      const { c } = getDemoProgress();
      if (c > 3) {
        playAt(state.index);
        return;
      }
    } else if (htmlAudio && htmlAudio.currentTime > 3) {
      htmlAudio.currentTime = 0;
      return;
    }
    const n = nextIndex(-1);
    if (n !== null) playAt(n);
  });
  els.nextBtn.addEventListener("click", () => {
    const n = nextIndex(1);
    if (n !== null) playAt(n);
    else toast("End of queue");
  });

  els.shuffleBtn.addEventListener("click", () => {
    state.shuffle = !state.shuffle;
    els.shuffleBtn.classList.toggle("on", state.shuffle);
    els.shuffleBtn.setAttribute("aria-pressed", String(state.shuffle));
    toast(state.shuffle ? "Shuffle on" : "Shuffle off");
  });

  els.repeatBtn.addEventListener("click", () => {
    state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
    els.repeatBtn.classList.toggle("on", state.repeat !== "off");
    els.repeatBtn.setAttribute("aria-pressed", String(state.repeat !== "off"));
    els.repeatBtn.title = state.repeat === "one" ? "Repeat one" : state.repeat === "all" ? "Repeat all" : "Repeat";
    toast(state.repeat === "off" ? "Repeat off" : state.repeat === "all" ? "Repeat all" : "Repeat one");
  });

  els.seek.addEventListener("pointerdown", () => { state.seekDragging = true; });
  els.seek.addEventListener("pointerup", () => {
    state.seekDragging = false;
    seekTo(Number(els.seek.value) / 1000);
  });
  els.seek.addEventListener("change", () => {
    seekTo(Number(els.seek.value) / 1000);
    state.seekDragging = false;
  });
  els.seek.addEventListener("input", () => {
    const track = currentTrack();
    if (!track) return;
    const d = track.demo ? track.duration : (htmlAudio?.duration || track.duration || 0);
    els.curTime.textContent = formatTime((Number(els.seek.value) / 1000) * d);
  });

  els.volume.addEventListener("input", () => {
    state.volume = Number(els.volume.value) / 100;
    if (state.volume > 0) state.muted = false;
    applyVolume();
  });

  els.muteBtn.addEventListener("click", () => {
    state.muted = !state.muted;
    applyVolume();
  });

  els.nowLikeBtn.addEventListener("click", () => {
    const track = currentTrack();
    if (!track) return;
    track.liked = !track.liked;
    render();
  });

  els.addMusicBtn.addEventListener("click", () => els.fileInput.click());
  els.dropHint.addEventListener("click", () => els.fileInput.click());
  els.fileInput.addEventListener("change", () => {
    if (els.fileInput.files?.length) addFiles(els.fileInput.files);
    els.fileInput.value = "";
  });

  els.playAllBtn.addEventListener("click", () => {
    const list = visibleTracks();
    if (!list.length) return toast("No tracks to play");
    setQueueFrom(list, 0, false);
  });

  els.shufflePlayBtn.addEventListener("click", () => {
    const list = visibleTracks();
    if (!list.length) return toast("No tracks to play");
    setQueueFrom(list, 0, true);
  });

  els.newPlaylistBtn.addEventListener("click", () => {
    const name = prompt("Playlist name", "New playlist");
    if (!name || !name.trim()) return;
    const id = "pl-" + Date.now();
    const color = PALETTES[state.playlists.length % PALETTES.length][0];
    const ids = visibleTracks().slice(0, 5).map((t) => t.id);
    state.playlists.push({ id, name: name.trim(), color, trackIds: ids.length ? ids : state.tracks.slice(0, 3).map((t) => t.id) });
    state.view = "playlist";
    state.activePlaylistId = id;
    document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
    render();
    toast("Playlist created");
  });

  // Drag and drop
  ["dragenter", "dragover"].forEach((ev) => {
    window.addEventListener(ev, (e) => {
      e.preventDefault();
      els.dropHint.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach((ev) => {
    window.addEventListener(ev, (e) => {
      if (ev === "dragleave" && e.target !== document.documentElement) return;
      els.dropHint.classList.remove("dragover");
    });
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    els.dropHint.classList.remove("dragover");
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });

  // Keyboard
  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.code === "Space") {
      e.preventDefault();
      togglePlay();
    } else if (e.code === "ArrowRight") {
      els.nextBtn.click();
    } else if (e.code === "ArrowLeft") {
      els.prevBtn.click();
    } else if (e.code === "ArrowUp") {
      e.preventDefault();
      state.volume = Math.min(1, state.volume + 0.05);
      els.volume.value = Math.round(state.volume * 100);
      state.muted = false;
      applyVolume();
    } else if (e.code === "ArrowDown") {
      e.preventDefault();
      state.volume = Math.max(0, state.volume - 0.05);
      els.volume.value = Math.round(state.volume * 100);
      applyVolume();
    } else if (e.key === "m" || e.key === "M") {
      els.muteBtn.click();
    } else if (e.key === "s" || e.key === "S") {
      els.shuffleBtn.click();
    } else if (e.key === "r" || e.key === "R") {
      els.repeatBtn.click();
    }
  });

  window.addEventListener("beforeunload", () => {
    objectUrls.forEach((u) => URL.revokeObjectURL(u));
  });

  // Polyfill roundRect if needed
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const radius = typeof r === "number" ? r : 0;
      this.moveTo(x + radius, y);
      this.arcTo(x + w, y, x + w, y + h, radius);
      this.arcTo(x + w, y + h, x, y + h, radius);
      this.arcTo(x, y + h, x, y, radius);
      this.arcTo(x, y, x + w, y, radius);
      this.closePath();
    };
  }

  // Init
  render();
  applyVolume();
  tick();
})();
</script>
</body>
</html>
