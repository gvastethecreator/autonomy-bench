<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen District — Night City</title>
  <style>
    :root {
      --ink: #070b14;
      --panel: rgba(8, 12, 22, 0.72);
      --stroke: rgba(140, 190, 255, 0.22);
      --text: #e8f0ff;
      --muted: #8aa0c0;
      --accent: #5ce1ff;
      --warm: #ffb454;
      --magenta: #ff5ec8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    }

    #canvas-host {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(180deg, rgba(4, 8, 18, 0.35) 0%, transparent 18%, transparent 78%, rgba(4, 8, 18, 0.5) 100%);
      z-index: 2;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(14px, 2.4vw, 28px);
    }

    .top, .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .bottom { align-items: flex-end; }

    .brand {
      pointer-events: none;
      max-width: min(420px, 92vw);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      opacity: 0.9;
    }

    h1 {
      font-weight: 600;
      font-size: clamp(1.35rem, 2.6vw, 2rem);
      letter-spacing: 0.02em;
      line-height: 1.1;
      text-shadow: 0 0 24px rgba(92, 225, 255, 0.25);
    }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .stats {
      min-width: 160px;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
    }

    .stats strong {
      color: var(--text);
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, .chip {
      appearance: none;
      border: 1px solid var(--stroke);
      background: rgba(16, 24, 40, 0.85);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    button:hover, button:focus-visible {
      border-color: rgba(92, 225, 255, 0.55);
      background: rgba(28, 42, 68, 0.95);
      outline: none;
    }

    button:active { transform: translateY(1px); }

    button[aria-pressed="true"] {
      border-color: rgba(92, 225, 255, 0.7);
      box-shadow: inset 0 0 0 1px rgba(92, 225, 255, 0.25), 0 0 18px rgba(92, 225, 255, 0.15);
      color: var(--accent);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      max-width: 340px;
      line-height: 1.45;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 40%, #121a2e, #05070e 70%);
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      text-align: center;
      padding: 28px;
    }

    .loader-card .pulse {
      width: 46px;
      height: 46px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 2px solid rgba(92, 225, 255, 0.2);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .tagline { display: none; }
      .hint { max-width: 100%; }
      .stats { min-width: 0; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-host" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="pulse" aria-hidden="true"></div>
      <p class="eyebrow">Bootstrapping district</p>
      <h1 style="font-size:1.25rem">Lumen District</h1>
    </div>
  </div>

  <div class="hud">
    <div class="top">
      <div class="brand">
        <p class="eyebrow">Procedural nocturne</p>
        <h1>Lumen District</h1>
        <p class="tagline">A living night city — towers breathing light, traffic weaving arteries, fog holding the glow.</p>
      </div>
      <div class="panel stats" id="stats" aria-live="polite">
        <div>Seed <strong id="seedLabel">—</strong></div>
        <div>Buildings <strong id="buildLabel">—</strong></div>
        <div>Traffic <strong id="trafficLabel">—</strong></div>
        <div>FPS <strong id="fpsLabel">—</strong></div>
      </div>
    </div>

    <div></div>

    <div class="bottom">
      <p class="hint">Drag to look · Scroll to zoom · Auto-tour keeps a cinematic path when free-look is off.</p>
      <div class="controls panel">
        <button type="button" id="btnTour" aria-pressed="true">Auto tour</button>
        <button type="button" id="btnRain" aria-pressed="true">Rain</button>
        <button type="button" id="btnReseed">New district</button>
        <span class="sr-only" id="live" aria-live="assertive"></span>
      </div>
    </div>
  </div>

  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- seeded RNG ---------- */
function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/* ---------- palette ---------- */
const PAL = {
  skyTop: new THREE.Color(0x02050d),
  skyHorizon: new THREE.Color(0x1a1638),
  fog: new THREE.Color(0x0a1020),
  asphalt: new THREE.Color(0x0c1018),
  building: [
    new THREE.Color(0x121824),
    new THREE.Color(0x161c2a),
    new THREE.Color(0x10151f),
    new THREE.Color(0x1a2030),
    new THREE.Color(0x0e1420)
  ],
  windowWarm: new THREE.Color(0xffc978),
  windowCool: new THREE.Color(0x8ad7ff),
  neonCyan: new THREE.Color(0x4de8ff),
  neonMagenta: new THREE.Color(0xff4ec8),
  neonAmber: new THREE.Color(0xffb14a),
  street: new THREE.Color(0xffd9a0)
};

/* ---------- app state ---------- */
const state = {
  seed: (Date.now() ^ (Math.random() * 1e9)) >>> 0,
  autoTour: true,
  rainOn: true,
  buildingCount: 0,
  trafficCount: 0,
  reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
};

const el = {
  host: document.getElementById('canvas-host'),
  loader: document.getElementById('loader'),
  seed: document.getElementById('seedLabel'),
  builds: document.getElementById('buildLabel'),
  traffic: document.getElementById('trafficLabel'),
  fps: document.getElementById('fpsLabel'),
  btnTour: document.getElementById('btnTour'),
  btnRain: document.getElementById('btnRain'),
  btnReseed: document.getElementById('btnReseed'),
  live: document.getElementById('live')
};

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
el.host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = PAL.skyTop.clone();
scene.fog = new THREE.FogExp2(PAL.fog.getHex(), 0.0048);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(80, 42, 110);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 30;
controls.maxDistance = 280;
controls.target.set(0, 18, 0);
controls.enabled = !state.autoTour;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.72,
  0.55,
  0.82
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- shared materials ---------- */
const matGround = new THREE.MeshStandardMaterial({
  color: PAL.asphalt,
  roughness: 0.55,
  metalness: 0.35
});

const matRoad = new THREE.MeshStandardMaterial({
  color: 0x0a0d14,
  roughness: 0.4,
  metalness: 0.45,
  emissive: 0x101820,
  emissiveIntensity: 0.15
});

const matSidewalk = new THREE.MeshStandardMaterial({
  color: 0x151a24,
  roughness: 0.85,
  metalness: 0.1
});

/* ---------- groups ---------- */
const cityRoot = new THREE.Group();
scene.add(cityRoot);

const trafficGroup = new THREE.Group();
cityRoot.add(trafficGroup);

const neonGroup = new THREE.Group();
cityRoot.add(neonGroup);

const rainGroup = new THREE.Group();
scene.add(rainGroup);

/* ---------- sky dome ---------- */
function makeSky() {
  const geo = new THREE.SphereGeometry(600, 48, 24);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: PAL.skyTop },
      horizonColor: { value: PAL.skyHorizon },
      glowColor: { value: new THREE.Color(0x3a2a6a) },
      offset: { value: 0.12 }
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 horizonColor;
      uniform vec3 glowColor;
      uniform float offset;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld).y;
        float t = clamp(h + offset, 0.0, 1.0);
        vec3 col = mix(horizonColor, topColor, pow(t, 0.85));
        float band = smoothstep(0.05, -0.15, h) * smoothstep(-0.55, -0.1, h);
        col += glowColor * band * 0.55;
        float stars = 0.0;
        if (h > 0.15) {
          vec2 uv = vWorld.xz * 0.08;
          float n = fract(sin(dot(floor(uv * 40.0), vec2(12.9898, 78.233))) * 43758.5453);
          stars = step(0.992, n) * smoothstep(0.15, 0.6, h);
        }
        col += vec3(0.75, 0.85, 1.0) * stars;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  return mesh;
}

/* ---------- moon ---------- */
function makeMoon() {
  const g = new THREE.Group();
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(8, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xe8f0ff })
  );
  moon.position.set(-120, 90, -180);
  g.add(moon);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(14, 32, 32),
    new THREE.MeshBasicMaterial({
      color: 0xa8c4ff,
      transparent: true,
      opacity: 0.12,
      depthWrite: false
    })
  );
  halo.position.copy(moon.position);
  g.add(halo);

  const light = new THREE.DirectionalLight(0xb8c8ff, 0.35);
  light.position.copy(moon.position);
  g.add(light);

  scene.add(g);
  return g;
}

/* ---------- ground / grid ---------- */
function makeGround(rng) {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), matGround);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.02;
  cityRoot.add(ground);

  // wet reflection sheen via subtle grid lines
  const grid = new THREE.GridHelper(360, 72, 0x1c3048, 0x121a28);
  grid.position.y = 0.01;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  cityRoot.add(grid);

  // harbor water strip
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x061018,
    roughness: 0.2,
    metalness: 0.85,
    emissive: 0x061828,
    emissiveIntensity: 0.4
  });
  const water = new THREE.Mesh(new THREE.PlaneGeometry(420, 70), waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -0.01, 175);
  cityRoot.add(water);

  // shimmer lines on water
  for (let i = 0; i < 18; i++) {
    const w = 8 + rng() * 40;
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(w, 0.35),
      new THREE.MeshBasicMaterial({
        color: rng() > 0.5 ? PAL.neonCyan : PAL.neonMagenta,
        transparent: true,
        opacity: 0.12 + rng() * 0.18,
        depthWrite: false
      })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set((rng() - 0.5) * 360, 0.05, 150 + rng() * 45);
    cityRoot.add(line);
  }
}

/* ---------- building factory ---------- */
function createWindowTexture(rng, cols, rows, warmBias) {
  const c = document.createElement('canvas');
  c.width = cols * 8;
  c.height = rows * 8;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0e16';
  ctx.fillRect(0, 0, c.width, c.height);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const lit = rng() > 0.38;
      if (!lit) continue;
      const warm = rng() < warmBias;
      const a = 0.45 + rng() * 0.55;
      if (warm) {
        ctx.fillStyle = `rgba(255, ${180 + ((rng() * 50) | 0)}, ${90 + ((rng() * 60) | 0)}, ${a})`;
      } else {
        ctx.fillStyle = `rgba(${120 + ((rng() * 80) | 0)}, ${200 + ((rng() * 40) | 0)}, 255, ${a})`;
      }
      const pad = 1 + (rng() > 0.85 ? 0 : 1);
      ctx.fillRect(x * 8 + pad, y * 8 + pad, 8 - pad * 2, 8 - pad * 2);
    }
  }

  // occasional neon band
  if (rng() > 0.65) {
    const y = ((rng() * rows) | 0) * 8;
    ctx.fillStyle = rng() > 0.5 ? 'rgba(77,232,255,0.85)' : 'rgba(255,78,200,0.75)';
    ctx.fillRect(0, y + 2, c.width, 2);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function addBuilding(x, z, w, d, h, rng) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  const bodyColor = PAL.building[(rng() * PAL.building.length) | 0].clone();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({
      color: bodyColor,
      roughness: 0.72,
      metalness: 0.28,
      emissive: bodyColor.clone().multiplyScalar(0.08)
    })
  );
  body.position.y = h * 0.5;
  group.add(body);

  // facade windows
  const cols = Math.max(3, Math.floor(w * 1.1));
  const rows = Math.max(4, Math.floor(h * 0.85));
  const winTex = createWindowTexture(rng, cols, rows, 0.55 + rng() * 0.3);
  winTex.repeat.set(1, 1);

  const facadeMat = new THREE.MeshBasicMaterial({
    map: winTex,
    transparent: true,
    opacity: 0.92,
    toneMapped: false
  });

  const inset = 0.06;
  const faces = [
    { pos: [0, h * 0.5, d / 2 + inset], rot: [0, 0, 0], size: [w * 0.92, h * 0.92] },
    { pos: [0, h * 0.5, -d / 2 - inset], rot: [0, Math.PI, 0], size: [w * 0.92, h * 0.92] },
    { pos: [w / 2 + inset, h * 0.5, 0], rot: [0, Math.PI / 2, 0], size: [d * 0.92, h * 0.92] },
    { pos: [-w / 2 - inset, h * 0.5, 0], rot: [0, -Math.PI / 2, 0], size: [d * 0.92, h * 0.92] }
  ];

  for (const f of faces) {
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(f.size[0], f.size[1]), facadeMat);
    plane.position.set(...f.pos);
    plane.rotation.set(...f.rot);
    group.add(plane);
  }

  // setback crown / antenna
  if (h > 28 && rng() > 0.35) {
    const crownH = 2 + rng() * 6;
    const crown = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.55, crownH, d * 0.55),
      new THREE.MeshStandardMaterial({
        color: bodyColor.clone().offsetHSL(0, 0, 0.05),
        roughness: 0.5,
        metalness: 0.5,
        emissive: rng() > 0.5 ? PAL.neonCyan : PAL.neonAmber,
        emissiveIntensity: 0.35
      })
    );
    crown.position.y = h + crownH * 0.5;
    group.add(crown);

    if (rng() > 0.4) {
      const mast = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.18, 4 + rng() * 8, 6),
        new THREE.MeshStandardMaterial({
          color: 0x8899aa,
          metalness: 0.8,
          roughness: 0.3,
          emissive: PAL.neonMagenta,
          emissiveIntensity: 0.5
        })
      );
      mast.position.y = h + crownH + 3;
      group.add(mast);

      const beacon = new THREE.PointLight(
        rng() > 0.5 ? 0xff4ec8 : 0x4de8ff,
        1.2,
        28,
        2
      );
      beacon.position.y = h + crownH + 6;
      group.add(beacon);
      group.userData.beacon = beacon;
    }
  }

  // rooftop HVAC blocks
  if (rng() > 0.45) {
    const boxes = 1 + ((rng() * 3) | 0);
    for (let i = 0; i < boxes; i++) {
      const bw = 1 + rng() * (w * 0.25);
      const bd = 1 + rng() * (d * 0.25);
      const bh = 0.6 + rng() * 1.8;
      const hx = new THREE.Mesh(
        new THREE.BoxGeometry(bw, bh, bd),
        new THREE.MeshStandardMaterial({ color: 0x1a2230, roughness: 0.7, metalness: 0.4 })
      );
      hx.position.set((rng() - 0.5) * w * 0.5, h + bh * 0.5, (rng() - 0.5) * d * 0.5);
      group.add(hx);
    }
  }

  // neon sign strip on some mid buildings
  if (h > 16 && h < 45 && rng() > 0.72) {
    const neonCol = [PAL.neonCyan, PAL.neonMagenta, PAL.neonAmber][(rng() * 3) | 0];
    const sign = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.7, 0.55, 0.2),
      new THREE.MeshBasicMaterial({ color: neonCol, toneMapped: false })
    );
    sign.position.set(0, 8 + rng() * (h * 0.4), d / 2 + 0.2);
    group.add(sign);
    neonGroup.add(sign);

    const glow = new THREE.PointLight(neonCol.getHex(), 1.4, 18, 2);
    glow.position.copy(sign.position);
    glow.position.z += 1;
    group.add(glow);
  }

  cityRoot.add(group);
  return group;
}

function makeRoads(rng) {
  const block = 22;
  const roadW = 6;
  const extent = 7;

  for (let i = -extent; i <= extent; i++) {
    const z = i * block;
    const road = new THREE.Mesh(new THREE.PlaneGeometry(extent * 2 * block + 40, roadW), matRoad);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.03, z);
    cityRoot.add(road);

    // center dashed line as emissive strip
    const dash = new THREE.Mesh(
      new THREE.PlaneGeometry(extent * 2 * block + 30, 0.18),
      new THREE.MeshBasicMaterial({
        color: 0xffe0a0,
        transparent: true,
        opacity: 0.25,
        toneMapped: false
      })
    );
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(0, 0.05, z);
    cityRoot.add(dash);

    const roadX = new THREE.Mesh(new THREE.PlaneGeometry(roadW, extent * 2 * block + 40), matRoad);
    roadX.rotation.x = -Math.PI / 2;
    roadX.position.set(z, 0.03, 0);
    cityRoot.add(roadX);
  }

  // sidewalks near waterfront promenade
  const prom = new THREE.Mesh(new THREE.PlaneGeometry(360, 10), matSidewalk);
  prom.rotation.x = -Math.PI / 2;
  prom.position.set(0, 0.04, 138);
  cityRoot.add(prom);

  // street lamps
  for (let i = -extent; i <= extent; i++) {
    for (let j = -extent; j <= extent; j++) {
      if (rng() > 0.55) continue;
      const lx = i * block + (rng() > 0.5 ? roadW * 0.55 : -roadW * 0.55);
      const lz = j * block + (rng() > 0.5 ? roadW * 0.55 : -roadW * 0.55);
      addLamp(lx, lz, rng);
    }
  }
}

function addLamp(x, z, rng) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.14, 5.5, 6),
    new THREE.MeshStandardMaterial({ color: 0x222833, metalness: 0.7, roughness: 0.4 })
  );
  pole.position.y = 2.75;
  g.add(pole);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 10, 10),
    new THREE.MeshBasicMaterial({ color: PAL.street, toneMapped: false })
  );
  head.position.y = 5.5;
  g.add(head);

  const light = new THREE.PointLight(0xffd9a0, 0.55 + rng() * 0.35, 16, 2);
  light.position.y = 5.3;
  g.add(light);
  cityRoot.add(g);
}

/* ---------- traffic ---------- */
const vehicles = [];

function spawnTraffic(rng) {
  while (trafficGroup.children.length) {
    const c = trafficGroup.children.pop();
    c.geometry?.dispose?.();
    c.material?.dispose?.();
  }
  vehicles.length = 0;

  const block = 22;
  const lanes = [];
  for (let i = -7; i <= 7; i++) {
    lanes.push({ axis: 'x', z: i * block - 1.2, dir: 1 });
    lanes.push({ axis: 'x', z: i * block + 1.2, dir: -1 });
    lanes.push({ axis: 'z', x: i * block - 1.2, dir: 1 });
    lanes.push({ axis: 'z', x: i * block + 1.2, dir: -1 });
  }

  const count = 90;
  for (let i = 0; i < count; i++) {
    const lane = lanes[(rng() * lanes.length) | 0];
    const col = [0x4de8ff, 0xff4ec8, 0xffb14a, 0xffffff, 0x7cffb2][(rng() * 5) | 0];
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.45, 0.7),
      new THREE.MeshBasicMaterial({ color: col, toneMapped: false })
    );
    const glow = new THREE.PointLight(col, 0.8, 8, 2);
    mesh.add(glow);

    const speed = 10 + rng() * 18;
    const pos = (rng() - 0.5) * 300;
    if (lane.axis === 'x') {
      mesh.position.set(pos, 0.5, lane.z);
      mesh.rotation.y = lane.dir > 0 ? 0 : Math.PI;
    } else {
      mesh.position.set(lane.x, 0.5, pos);
      mesh.rotation.y = lane.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
    }

    trafficGroup.add(mesh);
    vehicles.push({ mesh, lane, speed, phase: rng() * Math.PI * 2 });
  }
  state.trafficCount = count;
}

/* ---------- flying drones ---------- */
const drones = [];

function spawnDrones(rng) {
  drones.length = 0;
  for (let i = 0; i < 24; i++) {
    const body = new THREE.Mesh(
      new THREE.ConeGeometry(0.35, 1.2, 4),
      new THREE.MeshBasicMaterial({
        color: rng() > 0.5 ? 0x4de8ff : 0xff4ec8,
        toneMapped: false
      })
    );
    body.rotation.x = Math.PI / 2;
    const light = new THREE.PointLight(body.material.color.getHex(), 0.9, 12, 2);
    body.add(light);
    body.position.set((rng() - 0.5) * 220, 20 + rng() * 50, (rng() - 0.5) * 220);
    cityRoot.add(body);
    drones.push({
      mesh: body,
      radius: 40 + rng() * 90,
      height: body.position.y,
      speed: 0.15 + rng() * 0.35,
      angle: rng() * Math.PI * 2,
      cx: (rng() - 0.5) * 80,
      cz: (rng() - 0.5) * 80
    });
  }
}

/* ---------- rain ---------- */
let rainGeo, rainPositions, rainVel;

function makeRain() {
  const count = 6000;
  rainPositions = new Float32Array(count * 3);
  rainVel = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    rainPositions[i * 3] = (Math.random() - 0.5) * 280;
    rainPositions[i * 3 + 1] = Math.random() * 120;
    rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 280;
    rainVel[i] = 28 + Math.random() * 40;
  }
  rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xa8c4e8,
    size: 0.15,
    transparent: true,
    opacity: 0.45,
    depthWrite: false
  });
  const points = new THREE.Points(rainGeo, mat);
  rainGroup.clear();
  rainGroup.add(points);
  rainGroup.visible = state.rainOn;
}

function updateRain(dt) {
  if (!state.rainOn || !rainPositions) return;
  for (let i = 0; i < rainVel.length; i++) {
    rainPositions[i * 3 + 1] -= rainVel[i] * dt;
    rainPositions[i * 3] -= dt * 4;
    if (rainPositions[i * 3 + 1] < 0) {
      rainPositions[i * 3 + 1] = 60 + Math.random() * 60;
      rainPositions[i * 3] = camera.position.x + (Math.random() - 0.5) * 200;
      rainPositions[i * 3 + 2] = camera.position.z + (Math.random() - 0.5) * 200;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;
}

/* ---------- district generation ---------- */
function clearCity() {
  while (cityRoot.children.length) {
    const obj = cityRoot.children.pop();
    obj.traverse((c) => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) {
        if (Array.isArray(c.material)) c.material.forEach(disposeMat);
        else disposeMat(c.material);
      }
    });
  }
  cityRoot.add(trafficGroup);
  cityRoot.add(neonGroup);
  trafficGroup.clear();
  neonGroup.clear();
  vehicles.length = 0;
  drones.length = 0;
}

function disposeMat(m) {
  if (m.map) m.map.dispose();
  m.dispose();
}

function generateDistrict(seed) {
  clearCity();
  const rng = mulberry32(seed);
  state.seed = seed;

  makeGround(rng);
  makeRoads(rng);

  const block = 22;
  const extent = 7;
  let buildings = 0;

  for (let ix = -extent; ix <= extent; ix++) {
    for (let iz = -extent; iz <= extent; iz++) {
      // leave roads clear — buildings in block interiors
      const cx = ix * block;
      const cz = iz * block;

      // waterfront: fewer / shorter near +z
      const waterBias = cz > 120 ? 0.35 : 1;

      const plots = 1 + ((rng() * 2) | 0);
      for (let p = 0; p < plots; p++) {
        if (rng() > 0.82 * waterBias) continue;

        const maxW = 8 + rng() * 8;
        const maxD = 8 + rng() * 8;
        const w = THREE.MathUtils.clamp(maxW, 5, 14);
        const d = THREE.MathUtils.clamp(maxD, 5, 14);

        // downtown taller near center
        const dist = Math.hypot(cx, cz);
        const centerBoost = Math.max(0, 1 - dist / 140);
        let h = 8 + rng() * 18 + centerBoost * (25 + rng() * 45);
        if (cz > 100) h *= 0.45 + rng() * 0.3;
        if (rng() > 0.92) h *= 1.4; // landmark spikes

        const ox = (rng() - 0.5) * (block - w - 8);
        const oz = (rng() - 0.5) * (block - d - 8);

        // skip if too close to road center
        if (Math.abs(ox) < 2 && Math.abs(oz) < 2) continue;

        addBuilding(cx + ox, cz + oz, w, d, h, rng);
        buildings++;
      }
    }
  }

  // landmark tower cluster
  for (let i = 0; i < 5; i++) {
    const a = rng() * Math.PI * 2;
    const r = 8 + rng() * 20;
    addBuilding(
      Math.cos(a) * r,
      Math.sin(a) * r,
      10 + rng() * 6,
      10 + rng() * 6,
      55 + rng() * 40,
      rng
    );
    buildings++;
  }

  // billboard towers near harbor
  for (let i = 0; i < 6; i++) {
    addBuilding(
      (rng() - 0.5) * 200,
      110 + rng() * 20,
      6 + rng() * 4,
      6 + rng() * 4,
      12 + rng() * 18,
      rng
    );
    buildings++;
  }

  spawnTraffic(rng);
  spawnDrones(rng);
  state.buildingCount = buildings;

  el.seed.textContent = seed.toString(16).toUpperCase();
  el.builds.textContent = String(buildings);
  el.traffic.textContent = String(state.trafficCount);
}

/* ---------- camera tour ---------- */
const tour = {
  t: 0,
  radius: 118,
  height: 38,
  lookY: 16
};

function updateTour(dt) {
  if (!state.autoTour) return;
  const speed = state.reducedMotion ? 0.04 : 0.085;
  tour.t += dt * speed;
  const t = tour.t;
  const r = tour.radius + Math.sin(t * 0.35) * 18;
  const y = tour.height + Math.sin(t * 0.55) * 10 + Math.sin(t * 0.17) * 6;
  camera.position.set(
    Math.cos(t * 0.4) * r,
    y,
    Math.sin(t * 0.4) * r * 0.85
  );
  const lx = Math.cos(t * 0.4 + 0.9) * 25;
  const lz = Math.sin(t * 0.4 + 0.9) * 20;
  controls.target.set(lx, tour.lookY + Math.sin(t * 0.3) * 4, lz);
  camera.lookAt(controls.target);
}

/* ---------- ambient lights ---------- */
scene.add(new THREE.AmbientLight(0x334466, 0.35));
const hemi = new THREE.HemisphereLight(0x6a80c0, 0x0a1018, 0.45);
scene.add(hemi);

const fill = new THREE.DirectionalLight(0x4466aa, 0.25);
fill.position.set(40, 60, 20);
scene.add(fill);

/* ---------- boot ---------- */
makeSky();
makeMoon();
makeRain();
generateDistrict(state.seed);

requestAnimationFrame(() => {
  el.loader.classList.add('hide');
});

/* ---------- UI ---------- */
el.btnTour.addEventListener('click', () => {
  state.autoTour = !state.autoTour;
  el.btnTour.setAttribute('aria-pressed', String(state.autoTour));
  controls.enabled = !state.autoTour;
  el.live.textContent = state.autoTour ? 'Auto tour on' : 'Free look on';
});

el.btnRain.addEventListener('click', () => {
  state.rainOn = !state.rainOn;
  rainGroup.visible = state.rainOn;
  el.btnRain.setAttribute('aria-pressed', String(state.rainOn));
  el.live.textContent = state.rainOn ? 'Rain on' : 'Rain off';
});

el.btnReseed.addEventListener('click', () => {
  const next = (Math.random() * 0xffffffff) >>> 0;
  generateDistrict(next);
  el.live.textContent = `New district ${next.toString(16).toUpperCase()}`;
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    el.btnTour.click();
  } else if (e.code === 'KeyR' && !e.metaKey && !e.ctrlKey) {
    el.btnReseed.click();
  } else if (e.code === 'KeyP') {
    el.btnRain.click();
  }
});

/* ---------- resize ---------- */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ---------- animate ---------- */
const clock = new THREE.Clock();
let frames = 0;
let fpsAccum = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateTour(dt);
  if (!state.autoTour) controls.update();

  // traffic
  for (const v of vehicles) {
    const { mesh, lane, speed } = v;
    if (lane.axis === 'x') {
      mesh.position.x += speed * lane.dir * dt;
      if (mesh.position.x > 160) mesh.position.x = -160;
      if (mesh.position.x < -160) mesh.position.x = 160;
    } else {
      mesh.position.z += speed * lane.dir * dt;
      if (mesh.position.z > 160) mesh.position.z = -160;
      if (mesh.position.z < -160) mesh.position.z = 160;
    }
    // soft pulse
    mesh.material.opacity = 1;
    const pulse = 0.7 + Math.sin(t * 3 + v.phase) * 0.3;
    if (mesh.children[0]) mesh.children[0].intensity = pulse;
  }

  // drones
  for (const d of drones) {
    d.angle += d.speed * dt;
    d.mesh.position.x = d.cx + Math.cos(d.angle) * d.radius;
    d.mesh.position.z = d.cz + Math.sin(d.angle) * d.radius * 0.7;
    d.mesh.position.y = d.height + Math.sin(d.angle * 2.3) * 4;
    d.mesh.lookAt(
      d.mesh.position.x + Math.cos(d.angle + 0.2),
      d.mesh.position.y,
      d.mesh.position.z + Math.sin(d.angle + 0.2)
    );
  }

  // beacon blinks
  cityRoot.traverse((obj) => {
    if (obj.userData && obj.userData.beacon) {
      const b = obj.userData.beacon;
      b.intensity = 0.4 + (Math.sin(t * 4 + obj.id) * 0.5 + 0.5) * 1.4;
    }
  });

  updateRain(dt);

  // gentle exposure breathing
  renderer.toneMappingExposure = 1.0 + Math.sin(t * 0.25) * 0.04;

  composer.render();

  frames++;
  fpsAccum += dt;
  if (fpsAccum >= 0.5) {
    el.fps.textContent = String(Math.round(frames / fpsAccum));
    frames = 0;
    fpsAccum = 0;
  }
}

animate();
  </script>
