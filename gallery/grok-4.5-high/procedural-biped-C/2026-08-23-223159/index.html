<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stride — Procedural Biped</title>
  <style>
    :root {
      --bg: #0a0c12;
      --panel: rgba(12, 16, 28, 0.72);
      --line: rgba(140, 190, 255, 0.18);
      --text: #e8eefc;
      --muted: #8b9bb8;
      --accent: #6ee7ff;
      --accent-2: #a78bfa;
      --warm: #ffb86b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 18%, rgba(70, 90, 160, 0.22), transparent 60%),
        radial-gradient(ellipse 70% 50% at 70% 80%, rgba(255, 140, 80, 0.08), transparent 55%),
        linear-gradient(180deg, #070910 0%, #0c1220 45%, #101018 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 18%, transparent 78%, rgba(0,0,0,0.4) 100%);
      z-index: 2;
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.045;
      z-index: 3;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 32px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .brand {
      pointer-events: none;
      max-width: min(420px, 70vw);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .eyebrow::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    h1 {
      font-size: clamp(28px, 4.5vw, 44px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 8px;
      text-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }

    .sub {
      color: var(--muted);
      font-size: clamp(13px, 1.5vw, 15px);
      line-height: 1.5;
      max-width: 34ch;
    }

    .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
      min-width: 220px;
    }

    .panel h2 {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .row:last-child { margin-bottom: 0; }

    .row label {
      font-size: 13px;
      color: var(--text);
      opacity: 0.9;
    }

    .row output {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--accent);
      min-width: 2.5ch;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px rgba(110, 231, 255, 0.55);
      border: 2px solid #0b1020;
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    button:hover {
      background: rgba(110, 231, 255, 0.1);
      border-color: rgba(110, 231, 255, 0.35);
    }

    button:active { transform: translateY(1px); }

    button.active {
      background: linear-gradient(135deg, rgba(110,231,255,0.18), rgba(167,139,250,0.16));
      border-color: rgba(110, 231, 255, 0.45);
      color: #fff;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .meter {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meter-bar {
      width: 84px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--warm));
      box-shadow: 0 0 10px rgba(110, 231, 255, 0.5);
      transition: width 0.08s linear;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: #070910;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .loading.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loading-inner {
      text-align: center;
    }

    .loading-title {
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .top { flex-direction: column; align-items: stretch; }
      .panel { width: 100%; }
      .bottom { flex-direction: column; align-items: flex-start; }
      .sub { max-width: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-title">Assembling gait</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <div class="hud">
    <div class="top">
      <div class="brand">
        <div class="eyebrow">Procedural locomotion</div>
        <h1>Stride</h1>
        <p class="sub">A lanky biped walks forever — hips, knees, and arms driven by phase-linked sine waves, not keyframes.</p>
      </div>
      <aside class="panel" aria-label="Walk controls">
        <h2>Gait desk</h2>
        <div class="row">
          <label for="speed">Cadence</label>
          <input id="speed" type="range" min="0.4" max="2.2" step="0.01" value="1.0" />
          <output id="speedOut" for="speed">1.0</output>
        </div>
        <div class="row">
          <label for="stride">Stride</label>
          <input id="stride" type="range" min="0.4" max="1.6" step="0.01" value="1.0" />
          <output id="strideOut" for="stride">1.0</output>
        </div>
        <div class="row">
          <label for="bounce">Bounce</label>
          <input id="bounce" type="range" min="0" max="1.5" step="0.01" value="1.0" />
          <output id="bounceOut" for="bounce">1.0</output>
        </div>
        <div class="btns">
          <button id="btnPause" type="button">Pause</button>
          <button id="btnOrbit" type="button" class="active">Orbit</button>
          <button id="btnReset" type="button">Reset</button>
        </div>
      </aside>
    </div>
    <div></div>
    <div class="bottom">
      <p class="hint">Drag to look · Scroll to zoom · Space to pause</p>
      <div class="meter">
        <span>Phase</span>
        <div class="meter-bar"><div class="meter-fill" id="phaseFill"></div></div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const wrap = document.getElementById("canvas-wrap");
    const loading = document.getElementById("loading");
    const phaseFill = document.getElementById("phaseFill");
    const speedInput = document.getElementById("speed");
    const strideInput = document.getElementById("stride");
    const bounceInput = document.getElementById("bounce");
    const speedOut = document.getElementById("speedOut");
    const strideOut = document.getElementById("strideOut");
    const bounceOut = document.getElementById("bounceOut");
    const btnPause = document.getElementById("btnPause");
    const btnOrbit = document.getElementById("btnOrbit");
    const btnReset = document.getElementById("btnReset");

    const state = {
      paused: false,
      autoOrbit: true,
      speed: 1,
      stride: 1,
      bounce: 1,
      phase: 0,
      time: 0,
    };

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b1020, 0.028);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      120
    );
    camera.position.set(4.8, 2.6, 6.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.2;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 1.35, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;

    // —— Lights ——
    const hemi = new THREE.HemisphereLight(0x9eb7ff, 0x2a1a12, 0.55);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff0dd, 1.55);
    key.position.set(5.5, 9.5, 3.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 30;
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    key.shadow.bias = -0.00025;
    key.shadow.normalBias = 0.02;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x6ee7ff, 0.85);
    rim.position.set(-6, 3.5, -4);
    scene.add(rim);

    const fill = new THREE.PointLight(0xa78bfa, 18, 18, 2);
    fill.position.set(-2.5, 2.2, 3.5);
    scene.add(fill);

    const groundGlow = new THREE.PointLight(0xff9a5c, 8, 12, 2);
    groundGlow.position.set(0, 0.2, 0);
    scene.add(groundGlow);

    // —— Ground ——
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x121722,
      roughness: 0.92,
      metalness: 0.08,
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 72), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const ringGeo = new THREE.RingGeometry(3.2, 3.28, 96);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x6ee7ff,
      transparent: true,
      opacity: 0.22,
      side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    const ring2 = ring.clone();
    ring2.scale.setScalar(1.35);
    ring2.material = ringMat.clone();
    ring2.material.opacity = 0.1;
    ring2.material.color.set(0xa78bfa);
    scene.add(ring2);

    // Soft path disc under feet
    const path = new THREE.Mesh(
      new THREE.CircleGeometry(2.4, 48),
      new THREE.MeshStandardMaterial({
        color: 0x1a2233,
        roughness: 0.85,
        metalness: 0.05,
        emissive: 0x132033,
        emissiveIntensity: 0.35,
      })
    );
    path.rotation.x = -Math.PI / 2;
    path.position.y = 0.005;
    path.receiveShadow = true;
    scene.add(path);

    // —— Atmosphere particles ——
    const dustCount = 140;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    const dustSpeed = new Float32Array(dustCount);
    for (let i = 0; i < dustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 14;
      dustPos[i * 3 + 1] = Math.random() * 6 + 0.2;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
      dustSpeed[i] = 0.15 + Math.random() * 0.35;
    }
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(
      dustGeo,
      new THREE.PointsMaterial({
        color: 0xb8d4ff,
        size: 0.035,
        transparent: true,
        opacity: 0.45,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      })
    );
    scene.add(dust);

    // Distant soft orbs
    function makeOrb(color, r, x, y, z, opacity = 0.18) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(r, 24, 24),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity,
          depthWrite: false,
        })
      );
      m.position.set(x, y, z);
      scene.add(m);
      return m;
    }
    makeOrb(0x6ee7ff, 0.35, -5.5, 3.8, -4, 0.12);
    makeOrb(0xa78bfa, 0.55, 6.5, 4.2, -3, 0.1);
    makeOrb(0xffb86b, 0.28, 2.5, 5.5, -6, 0.1);

    // —— Materials ——
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0xd7dde8,
      roughness: 0.42,
      metalness: 0.28,
    });
    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x2a3348,
      roughness: 0.55,
      metalness: 0.35,
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: 0x6ee7ff,
      emissive: 0x6ee7ff,
      emissiveIntensity: 0.85,
      roughness: 0.25,
      metalness: 0.55,
    });
    const jointMat = new THREE.MeshStandardMaterial({
      color: 0xa78bfa,
      emissive: 0xa78bfa,
      emissiveIntensity: 0.55,
      roughness: 0.3,
      metalness: 0.6,
    });
    const visorMat = new THREE.MeshStandardMaterial({
      color: 0x091018,
      emissive: 0x38bdf8,
      emissiveIntensity: 1.4,
      roughness: 0.2,
      metalness: 0.8,
    });

    function box(w, h, d, mat, cast = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      return mesh;
    }

    function cyl(rTop, rBot, h, mat, segs = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, segs), mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function sphere(r, mat, segs = 18) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, segs, segs), mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // —— Biped hierarchy ——
    const biped = new THREE.Group();
    biped.position.set(0, 0, 0);
    scene.add(biped);

    const root = new THREE.Group();
    biped.add(root);

    // Hips / pelvis
    const hips = new THREE.Group();
    hips.position.y = 1.55;
    root.add(hips);

    const pelvis = box(0.48, 0.22, 0.28, darkMat);
    hips.add(pelvis);
    const hipGlow = box(0.18, 0.06, 0.3, accentMat, false);
    hipGlow.position.set(0, 0.02, 0);
    hips.add(hipGlow);

    // Torso
    const torsoPivot = new THREE.Group();
    torsoPivot.position.y = 0.12;
    hips.add(torsoPivot);

    const chest = box(0.52, 0.62, 0.34, bodyMat);
    chest.position.y = 0.42;
    torsoPivot.add(chest);

    const sternum = box(0.12, 0.38, 0.36, accentMat, false);
    sternum.position.set(0, 0.42, 0.01);
    torsoPivot.add(sternum);

    const abs = box(0.38, 0.22, 0.26, darkMat);
    abs.position.y = 0.08;
    torsoPivot.add(abs);

    // Shoulders
    const shoulders = new THREE.Group();
    shoulders.position.y = 0.72;
    torsoPivot.add(shoulders);
    const clavicle = box(0.72, 0.1, 0.18, darkMat);
    shoulders.add(clavicle);

    // Head
    const neck = cyl(0.08, 0.1, 0.18, darkMat);
    neck.position.y = 0.86;
    torsoPivot.add(neck);

    const headPivot = new THREE.Group();
    headPivot.position.y = 1.02;
    torsoPivot.add(headPivot);

    const head = box(0.34, 0.34, 0.32, bodyMat);
    headPivot.add(head);
    const visor = box(0.28, 0.1, 0.08, visorMat, false);
    visor.position.set(0, 0.04, 0.14);
    headPivot.add(visor);
    const crest = box(0.08, 0.16, 0.22, accentMat, false);
    crest.position.set(0, 0.22, -0.02);
    headPivot.add(crest);

    // Antenna
    const antenna = new THREE.Group();
    antenna.position.set(0.1, 0.18, -0.05);
    headPivot.add(antenna);
    const antRod = cyl(0.015, 0.02, 0.28, darkMat, 8);
    antRod.position.y = 0.14;
    antenna.add(antRod);
    const antTip = sphere(0.04, jointMat, 12);
    antTip.position.y = 0.3;
    antenna.add(antTip);

    // Arms
    function makeArm(side) {
      const s = side; // -1 left, 1 right
      const arm = {
        shoulder: new THREE.Group(),
        upper: null,
        elbow: new THREE.Group(),
        lower: null,
        hand: null,
      };

      arm.shoulder.position.set(s * 0.4, 0, 0);
      shoulders.add(arm.shoulder);

      const shoulderBall = sphere(0.09, jointMat, 14);
      arm.shoulder.add(shoulderBall);

      arm.upper = cyl(0.07, 0.08, 0.42, bodyMat);
      arm.upper.position.y = -0.22;
      arm.shoulder.add(arm.upper);

      arm.elbow.position.y = -0.44;
      arm.shoulder.add(arm.elbow);
      const elbowBall = sphere(0.07, jointMat, 12);
      arm.elbow.add(elbowBall);

      arm.lower = cyl(0.055, 0.065, 0.38, darkMat);
      arm.lower.position.y = -0.2;
      arm.elbow.add(arm.lower);

      arm.hand = box(0.1, 0.12, 0.1, bodyMat);
      arm.hand.position.y = -0.42;
      arm.elbow.add(arm.hand);

      // Rest pose: slight hang
      arm.shoulder.rotation.z = s * 0.12;
      arm.elbow.rotation.x = -0.15;

      return arm;
    }

    const leftArm = makeArm(-1);
    const rightArm = makeArm(1);

    // Legs
    function makeLeg(side) {
      const s = side;
      const leg = {
        hip: new THREE.Group(),
        upper: null,
        knee: new THREE.Group(),
        lower: null,
        ankle: new THREE.Group(),
        foot: null,
      };

      leg.hip.position.set(s * 0.16, -0.05, 0);
      hips.add(leg.hip);

      const hipBall = sphere(0.095, jointMat, 14);
      leg.hip.add(hipBall);

      leg.upper = cyl(0.09, 0.1, 0.5, bodyMat);
      leg.upper.position.y = -0.28;
      leg.hip.add(leg.upper);

      leg.knee.position.y = -0.54;
      leg.hip.add(leg.knee);
      const kneeBall = sphere(0.08, accentMat, 12);
      leg.knee.add(kneeBall);

      leg.lower = cyl(0.07, 0.08, 0.48, darkMat);
      leg.lower.position.y = -0.26;
      leg.knee.add(leg.lower);

      leg.ankle.position.y = -0.52;
      leg.knee.add(leg.ankle);
      const ankleBall = sphere(0.06, jointMat, 10);
      leg.ankle.add(ankleBall);

      leg.foot = box(0.14, 0.08, 0.28, bodyMat);
      leg.foot.position.set(0, -0.04, 0.06);
      leg.ankle.add(leg.foot);

      const toe = box(0.12, 0.05, 0.1, accentMat, false);
      toe.position.set(0, -0.01, 0.18);
      leg.ankle.add(toe);

      return leg;
    }

    const leftLeg = makeLeg(-1);
    const rightLeg = makeLeg(1);

    // Soft contact blob shadows under feet
    const footShadowMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.28,
      depthWrite: false,
    });
    const leftShadow = new THREE.Mesh(new THREE.CircleGeometry(0.22, 24), footShadowMat);
    leftShadow.rotation.x = -Math.PI / 2;
    leftShadow.position.y = 0.02;
    scene.add(leftShadow);
    const rightShadow = leftShadow.clone();
    rightShadow.material = footShadowMat.clone();
    scene.add(rightShadow);

    // —— Walk solver ——
    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function smoothstep(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    // Returns hip pitch, knee bend, ankle pitch, foot lift for one leg phase in [0, 1)
    function legPose(phase, strideAmp, bounceAmp) {
      // 0..0.5 stance, 0.5..1 swing
      const swing = phase >= 0.5;
      const local = swing ? (phase - 0.5) * 2 : phase * 2;

      let hipX, kneeX, ankleX, lift;

      if (!swing) {
        // Stance: plant and push
        const push = Math.sin(local * Math.PI);
        hipX = THREE.MathUtils.lerp(0.42, -0.38, local) * strideAmp;
        kneeX = (0.08 + push * 0.12) * bounceAmp;
        ankleX = THREE.MathUtils.lerp(-0.12, 0.22, local);
        lift = 0;
      } else {
        // Swing: lift and reach
        const arc = Math.sin(local * Math.PI);
        hipX = THREE.MathUtils.lerp(-0.38, 0.42, local) * strideAmp;
        kneeX = (0.15 + arc * 1.05) * (0.75 + 0.25 * bounceAmp);
        ankleX = THREE.MathUtils.lerp(0.35, -0.25, smoothstep(0, 1, local));
        lift = arc * 0.18 * bounceAmp;
      }

      return { hipX, kneeX, ankleX, lift };
    }

    function armPose(phase, strideAmp) {
      // Opposite to legs, milder
      const swing = Math.sin(phase * Math.PI * 2);
      const shoulderX = -swing * 0.55 * strideAmp;
      const elbowX = -0.25 - Math.max(0, -swing) * 0.55 * strideAmp;
      return { shoulderX, elbowX };
    }

    const worldPos = new THREE.Vector3();

    function updateBiped(dt) {
      if (!state.paused) {
        state.phase = (state.phase + dt * state.speed * 1.35) % 1;
        state.time += dt;
      }

      const p = state.phase;
      const sa = state.stride;
      const ba = state.bounce;

      // Body vertical bob + slight forward lean
      const bob = Math.abs(Math.sin(p * Math.PI * 2)) * 0.06 * ba;
      const sway = Math.sin(p * Math.PI * 2) * 0.04;
      const lean = 0.05 + state.speed * 0.03;

      root.position.y = bob;
      root.rotation.z = sway * 0.35;
      root.rotation.x = lean * 0.25;

      hips.rotation.y = Math.sin(p * Math.PI * 2) * 0.08 * sa;
      torsoPivot.rotation.y = -hips.rotation.y * 1.35;
      torsoPivot.rotation.x = Math.sin(p * Math.PI * 4) * 0.03 * ba - lean * 0.15;
      shoulders.rotation.y = -torsoPivot.rotation.y * 0.4;

      headPivot.rotation.y = -torsoPivot.rotation.y * 0.5;
      headPivot.rotation.x = Math.sin(state.time * 1.7) * 0.03 - 0.04;
      antenna.rotation.z = Math.sin(state.time * 3.2 + p * Math.PI * 2) * 0.25;
      antenna.rotation.x = Math.sin(state.time * 2.4) * 0.15;

      // Legs (left offset by half cycle)
      const L = legPose(p, sa, ba);
      const R = legPose((p + 0.5) % 1, sa, ba);

      leftLeg.hip.rotation.x = L.hipX;
      leftLeg.hip.position.y = -0.05 + L.lift;
      leftLeg.knee.rotation.x = L.kneeX;
      leftLeg.ankle.rotation.x = L.ankleX;

      rightLeg.hip.rotation.x = R.hipX;
      rightLeg.hip.position.y = -0.05 + R.lift;
      rightLeg.knee.rotation.x = R.kneeX;
      rightLeg.ankle.rotation.x = R.ankleX;

      // Arms opposite
      const LA = armPose((p + 0.5) % 1, sa);
      const RA = armPose(p, sa);

      leftArm.shoulder.rotation.x = LA.shoulderX;
      leftArm.elbow.rotation.x = LA.elbowX;
      leftArm.shoulder.rotation.z = -0.12 + Math.sin(p * Math.PI * 2) * 0.04;

      rightArm.shoulder.rotation.x = RA.shoulderX;
      rightArm.elbow.rotation.x = RA.elbowX;
      rightArm.shoulder.rotation.z = 0.12 + Math.sin(p * Math.PI * 2) * 0.04;

      // Travel along a gentle circle so orbit framing stays lively
      const pathR = 0.0; // stay centered — walk-in-place with convincing gait
      biped.position.x = Math.sin(state.time * 0.15) * pathR;
      biped.position.z = Math.cos(state.time * 0.15) * pathR;

      // Foot contact shadows
      leftLeg.ankle.getWorldPosition(worldPos);
      leftShadow.position.x = worldPos.x;
      leftShadow.position.z = worldPos.z;
      const leftH = Math.max(0, worldPos.y);
      leftShadow.material.opacity = clamp(0.32 - leftH * 0.9, 0.04, 0.32);
      leftShadow.scale.setScalar(clamp(1.15 - leftH * 1.8, 0.45, 1.15));

      rightLeg.ankle.getWorldPosition(worldPos);
      rightShadow.position.x = worldPos.x;
      rightShadow.position.z = worldPos.z;
      const rightH = Math.max(0, worldPos.y);
      rightShadow.material.opacity = clamp(0.32 - rightH * 0.9, 0.04, 0.32);
      rightShadow.scale.setScalar(clamp(1.15 - rightH * 1.8, 0.45, 1.15));

      // Accent pulse with cadence
      const pulse = 0.7 + Math.sin(p * Math.PI * 2) * 0.25;
      accentMat.emissiveIntensity = pulse;
      visorMat.emissiveIntensity = 1.15 + Math.sin(state.time * 4) * 0.25;

      phaseFill.style.width = `${(p * 100).toFixed(1)}%`;
    }

    function updateDust(dt) {
      const arr = dust.geometry.attributes.position.array;
      for (let i = 0; i < dustCount; i++) {
        arr[i * 3 + 1] += dustSpeed[i] * dt * 0.35;
        if (arr[i * 3 + 1] > 6.2) {
          arr[i * 3 + 1] = 0.15;
          arr[i * 3] = (Math.random() - 0.5) * 14;
          arr[i * 3 + 2] = (Math.random() - 0.5) * 14;
        }
      }
      dust.geometry.attributes.position.needsUpdate = true;
      dust.rotation.y += dt * 0.02;
    }

    // —— UI ——
    function syncOutputs() {
      speedOut.textContent = state.speed.toFixed(1);
      strideOut.textContent = state.stride.toFixed(1);
      bounceOut.textContent = state.bounce.toFixed(1);
    }

    speedInput.addEventListener("input", () => {
      state.speed = parseFloat(speedInput.value);
      syncOutputs();
    });
    strideInput.addEventListener("input", () => {
      state.stride = parseFloat(strideInput.value);
      syncOutputs();
    });
    bounceInput.addEventListener("input", () => {
      state.bounce = parseFloat(bounceInput.value);
      syncOutputs();
    });

    function setPaused(v) {
      state.paused = v;
      btnPause.textContent = v ? "Play" : "Pause";
      btnPause.classList.toggle("active", v);
    }

    btnPause.addEventListener("click", () => setPaused(!state.paused));
    btnOrbit.addEventListener("click", () => {
      state.autoOrbit = !state.autoOrbit;
      controls.autoRotate = state.autoOrbit;
      btnOrbit.classList.toggle("active", state.autoOrbit);
    });
    btnReset.addEventListener("click", () => {
      state.speed = 1;
      state.stride = 1;
      state.bounce = 1;
      state.phase = 0;
      speedInput.value = "1";
      strideInput.value = "1";
      bounceInput.value = "1";
      syncOutputs();
      setPaused(false);
      camera.position.set(4.8, 2.6, 6.2);
      controls.target.set(0, 1.35, 0);
      controls.update();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        setPaused(!state.paused);
      }
    });

    // Pause auto-orbit while user drags
    controls.addEventListener("start", () => {
      controls.autoRotate = false;
    });
    controls.addEventListener("end", () => {
      controls.autoRotate = state.autoOrbit;
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // —— Loop ——
    const clock = new THREE.Clock();
    let ready = false;

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.05);

      updateBiped(dt);
      updateDust(dt);

      ring.rotation.z += dt * 0.08;
      ring2.rotation.z -= dt * 0.05;

      controls.update();
      renderer.render(scene, camera);

      if (!ready) {
        ready = true;
        requestAnimationFrame(() => {
          loading.classList.add("hide");
        });
      }
    }

    syncOutputs();
    updateBiped(0);
    frame();
  </script>
</body>
</html>
