<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nocturne — Observatory Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #06080f;
      --night: #0b1020;
      --ink: #121a2e;
      --mist: #8b9bb8;
      --fog: #c5d0e0;
      --pearl: #eef2f8;
      --gold: #d4a574;
      --gold-bright: #f0c896;
      --amber: #e8b86d;
      --aurora: #6b8cae;
      --glow: rgba(212, 165, 116, 0.45);
      --ring: rgba(238, 242, 248, 0.08);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      background: var(--void);
      color: var(--pearl);
      display: grid;
      place-items: center;
      min-height: 100dvh;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Atmosphere layers ── */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(107, 140, 174, 0.18), transparent 55%),
        radial-gradient(ellipse 50% 40% at 20% 20%, rgba(212, 165, 116, 0.06), transparent 50%),
        radial-gradient(ellipse 40% 35% at 85% 15%, rgba(107, 140, 174, 0.1), transparent 45%),
        linear-gradient(180deg, #04060c 0%, var(--night) 40%, #0a1224 100%);
    }

    .aurora {
      position: fixed;
      inset: -20% -10%;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 45% 30% at 30% 0%, rgba(107, 140, 174, 0.22), transparent 70%),
        radial-gradient(ellipse 35% 25% at 70% 5%, rgba(212, 165, 116, 0.12), transparent 65%);
      animation: aurora-drift 28s ease-in-out infinite alternate;
      filter: blur(40px);
      opacity: 0.85;
    }

    @keyframes aurora-drift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      50% { transform: translate(3%, 2%) scale(1.05); opacity: 0.95; }
      100% { transform: translate(-2%, 1%) scale(1.02); opacity: 0.8; }
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: var(--pearl);
      animation: twinkle var(--dur, 4s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--min, 0.15); transform: scale(1); }
      50% { opacity: var(--max, 0.9); transform: scale(1.3); }
    }

    /* ── Main stage ── */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.5rem, 4vw, 2.75rem);
      padding: 2rem;
      animation: stage-enter 1.4s var(--ease-out) both;
    }

    @keyframes stage-enter {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .brand {
      text-align: center;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fade-up 1s var(--ease-out) 0.35s both;
    }

    .brand span {
      display: block;
      margin-top: 0.35rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: var(--mist);
      font-weight: 300;
      opacity: 0.7;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Clock vessel ── */
    .vessel {
      position: relative;
      width: min(78vw, 380px);
      aspect-ratio: 1;
      animation: fade-up 1.1s var(--ease-out) 0.15s both;
    }

    .vessel::before {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 65%);
      opacity: 0.35;
      filter: blur(30px);
      animation: pulse-glow 6s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.28; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.04); }
    }

    .bezel {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, #1a2438, #2a3548, #1c2638, #3a2e22, #1a2438),
        linear-gradient(145deg, #2a3548, #0e1524);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 25px 60px rgba(0, 0, 0, 0.55),
        0 8px 20px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -2px 8px rgba(0, 0, 0, 0.4);
    }

    .bezel-ring {
      position: absolute;
      inset: 4.5%;
      border-radius: 50%;
      border: 1px solid rgba(212, 165, 116, 0.25);
      box-shadow:
        inset 0 0 20px rgba(0, 0, 0, 0.5),
        0 0 12px rgba(212, 165, 116, 0.08);
    }

    .face {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.06), transparent 45%),
        radial-gradient(circle at 50% 55%, #141c30 0%, #0a101c 70%, #070c16 100%);
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.6),
        inset 0 2px 4px rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .face-grain {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* Minute ticks */
    .ticks {
      position: absolute;
      inset: 0;
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1.5px;
      height: 8px;
      margin-left: -0.75px;
      background: rgba(197, 208, 224, 0.28);
      border-radius: 1px;
      transform-origin: 50% 0;
    }

    .tick.hour {
      width: 2.5px;
      height: 14px;
      margin-left: -1.25px;
      background: rgba(212, 165, 116, 0.55);
    }

    .tick.major {
      width: 3px;
      height: 18px;
      margin-left: -1.5px;
      background: var(--gold);
      box-shadow: 0 0 6px rgba(212, 165, 116, 0.4);
    }

    .numerals {
      position: absolute;
      inset: 0;
    }

    .numeral {
      position: absolute;
      left: 50%;
      top: 50%;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(0.95rem, 3.2vw, 1.2rem);
      font-weight: 500;
      color: var(--fog);
      letter-spacing: 0.02em;
      transform-origin: 0 0;
      width: 1.6em;
      text-align: center;
      margin-left: -0.8em;
      opacity: 0.85;
      text-shadow: 0 0 12px rgba(238, 242, 248, 0.15);
    }

    .numeral.cardinal {
      color: var(--gold-bright);
      font-weight: 600;
      opacity: 1;
      text-shadow: 0 0 16px rgba(212, 165, 116, 0.35);
    }

    /* Hands */
    .hands {
      position: absolute;
      inset: 0;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 2px 2px 1px 1px;
      will-change: transform;
    }

    .hand.hour-hand {
      width: 5px;
      height: 24%;
      margin-left: -2.5px;
      background: linear-gradient(180deg, var(--pearl) 0%, var(--fog) 60%, var(--mist) 100%);
      border-radius: 3px 3px 1.5px 1.5px;
      box-shadow:
        0 0 8px rgba(238, 242, 248, 0.2),
        1px 0 2px rgba(0, 0, 0, 0.4);
    }

    .hand.hour-hand::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 9px;
      height: 55%;
      margin-left: -4.5px;
      background: linear-gradient(180deg, var(--pearl), rgba(197, 208, 224, 0.7));
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(238, 242, 248, 0.15);
    }

    .hand.minute-hand {
      width: 3.5px;
      height: 34%;
      margin-left: -1.75px;
      background: linear-gradient(180deg, var(--pearl) 0%, var(--fog) 70%, var(--mist) 100%);
      border-radius: 2px;
      box-shadow:
        0 0 8px rgba(238, 242, 248, 0.18),
        1px 0 2px rgba(0, 0, 0, 0.35);
    }

    .hand.minute-hand::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 7px;
      height: 62%;
      margin-left: -3.5px;
      background: linear-gradient(180deg, #fff, rgba(197, 208, 224, 0.65));
      border-radius: 3.5px;
    }

    .hand.second-hand {
      width: 1.5px;
      height: 40%;
      margin-left: -0.75px;
      background: linear-gradient(180deg, var(--gold-bright), var(--gold) 70%, transparent);
      border-radius: 1px;
      box-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
      z-index: 5;
    }

    .hand.second-hand::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -12%;
      width: 6px;
      height: 12%;
      margin-left: -3px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(212, 165, 116, 0.5);
    }

    .hand.second-hand::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -4%;
      width: 5px;
      height: 5px;
      margin-left: -2.5px;
      background: var(--gold-bright);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--glow);
    }

    .pivot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--gold-bright), var(--gold) 50%, #8a6540);
      box-shadow:
        0 0 0 3px rgba(12, 16, 28, 0.9),
        0 0 0 4.5px rgba(212, 165, 116, 0.35),
        0 0 16px rgba(212, 165, 116, 0.45);
      z-index: 10;
    }

    .inner-ring {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(238, 242, 248, 0.04);
      pointer-events: none;
    }

    /* Sweep trail on second hand */
    .second-trail {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      margin: -21% 0 0 -21%;
      border-radius: 50%;
      background: conic-gradient(
        from calc(var(--sec-angle, 0deg) - 24deg),
        transparent 0deg,
        rgba(212, 165, 116, 0.12) 18deg,
        transparent 28deg
      );
      pointer-events: none;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    /* ── Digital readout ── */
    .readout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      opacity: 0;
      animation: fade-up 1s var(--ease-out) 0.55s both;
    }

    .digital {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(1.75rem, 6vw, 2.6rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--pearl);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px rgba(238, 242, 248, 0.2);
      display: flex;
      align-items: baseline;
      gap: 0.05em;
    }

    .digital .sep {
      color: var(--gold);
      opacity: 0.7;
      animation: blink 1s steps(1) infinite;
      font-weight: 400;
    }

    @keyframes blink {
      0%, 49% { opacity: 0.7; }
      50%, 100% { opacity: 0.2; }
    }

    .digital .ms {
      font-size: 0.42em;
      color: var(--mist);
      letter-spacing: 0.08em;
      margin-left: 0.25em;
      opacity: 0.65;
      min-width: 2.2em;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mist);
    }

    .meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
    }

    .date-line {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      font-style: italic;
      font-weight: 400;
      color: var(--fog);
      letter-spacing: 0.04em;
      opacity: 0.9;
    }

    /* ── Footer controls ── */
    .controls {
      display: flex;
      gap: 0.6rem;
      opacity: 0;
      animation: fade-up 1s var(--ease-out) 0.75s both;
    }

    .chip {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mist);
      background: rgba(238, 242, 248, 0.04);
      border: 1px solid rgba(238, 242, 248, 0.08);
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      transition:
        color 0.35s var(--ease-soft),
        background 0.35s var(--ease-soft),
        border-color 0.35s var(--ease-soft),
        box-shadow 0.35s var(--ease-soft),
        transform 0.25s var(--ease-soft);
      backdrop-filter: blur(8px);
    }

    .chip:hover {
      color: var(--pearl);
      background: rgba(212, 165, 116, 0.1);
      border-color: rgba(212, 165, 116, 0.3);
      box-shadow: 0 0 20px rgba(212, 165, 116, 0.12);
    }

    .chip:active {
      transform: scale(0.96);
    }

    .chip.active {
      color: var(--gold-bright);
      background: rgba(212, 165, 116, 0.14);
      border-color: rgba(212, 165, 116, 0.4);
      box-shadow: 0 0 24px rgba(212, 165, 116, 0.15);
    }

    .chip:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    /* Ambient vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, rgba(4, 6, 12, 0.55) 100%);
    }

    /* Horizon glow */
    .horizon {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30%;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(to top, rgba(107, 140, 174, 0.08), transparent);
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .aurora,
      .star,
      .vessel::before,
      .digital .sep {
        animation: none !important;
      }
      .stage,
      .brand,
      .vessel,
      .readout,
      .controls {
        animation: none !important;
        opacity: 1;
        transform: none;
        filter: none;
      }
      .hand {
        transition: none !important;
      }
    }

    @media (max-width: 420px) {
      .stage { gap: 1.25rem; padding: 1.25rem; }
      .meta { letter-spacing: 0.1em; gap: 0.5rem; font-size: 0.58rem; }
      .digital .ms { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>

  <main class="stage">
    <header class="brand">
      Nocturne
      <span>Observatory Timepiece</span>
    </header>

    <div class="vessel" role="img" aria-label="Analog clock">
      <div class="bezel"></div>
      <div class="bezel-ring"></div>
      <div class="face">
        <div class="face-grain"></div>
        <div class="inner-ring"></div>
        <div class="second-trail" id="trail"></div>
        <div class="ticks" id="ticks"></div>
        <div class="numerals" id="numerals"></div>
        <div class="hands">
          <div class="hand hour-hand" id="hourHand"></div>
          <div class="hand minute-hand" id="minuteHand"></div>
          <div class="hand second-hand" id="secondHand"></div>
          <div class="pivot"></div>
        </div>
      </div>
    </div>

    <section class="readout" aria-live="polite" aria-atomic="true">
      <div class="digital" id="digital">
        <span id="hDigits">00</span><span class="sep">:</span><span id="mDigits">00</span><span class="sep">:</span><span id="sDigits">00</span><span class="ms" id="msDigits">000</span>
      </div>
      <p class="date-line" id="dateLine">—</p>
      <div class="meta">
        <span id="weekday">—</span>
        <span class="dot" aria-hidden="true"></span>
        <span id="tzLabel">Local</span>
      </div>
    </section>

    <div class="controls" role="group" aria-label="Display options">
      <button type="button" class="chip active" id="btn24" aria-pressed="true">24h</button>
      <button type="button" class="chip" id="btn12" aria-pressed="false">12h</button>
      <button type="button" class="chip" id="btnSweep" aria-pressed="false">Sweep</button>
    </div>
  </main>

  <div class="vignette" aria-hidden="true"></div>

  <script>
    (function () {
      const ticksEl = document.getElementById("ticks");
      const numeralsEl = document.getElementById("numerals");
      const starsEl = document.getElementById("stars");
      const hourHand = document.getElementById("hourHand");
      const minuteHand = document.getElementById("minuteHand");
      const secondHand = document.getElementById("secondHand");
      const trail = document.getElementById("trail");
      const hDigits = document.getElementById("hDigits");
      const mDigits = document.getElementById("mDigits");
      const sDigits = document.getElementById("sDigits");
      const msDigits = document.getElementById("msDigits");
      const dateLine = document.getElementById("dateLine");
      const weekday = document.getElementById("weekday");
      const tzLabel = document.getElementById("tzLabel");
      const btn24 = document.getElementById("btn24");
      const btn12 = document.getElementById("btn12");
      const btnSweep = document.getElementById("btnSweep");

      let use24 = true;
      let sweep = false;
      let lastSecond = -1;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* Build clock ticks once */
      for (let i = 0; i < 60; i++) {
        const tick = document.createElement("div");
        tick.className = "tick" + (i % 15 === 0 ? " major" : i % 5 === 0 ? " hour" : "");
        ticksEl.appendChild(tick);
      }

      function layoutTicks() {
        const face = ticksEl.parentElement;
        const size = face.clientWidth;
        const radius = size * 0.42;
        [...ticksEl.children].forEach((tick, i) => {
          const angle = (i * 6 - 90) * (Math.PI / 180);
          const len = tick.classList.contains("major")
            ? Math.max(14, size * 0.048)
            : tick.classList.contains("hour")
              ? Math.max(11, size * 0.038)
              : Math.max(6, size * 0.022);
          const cx = size / 2 + Math.cos(angle) * radius;
          const cy = size / 2 + Math.sin(angle) * radius;
          tick.style.left = cx + "px";
          tick.style.top = cy + "px";
          tick.style.marginLeft = "0";
          tick.style.height = len + "px";
          tick.style.transform = `translate(-50%, -50%) rotate(${i * 6}deg)`;
          tick.style.transformOrigin = "center center";
        });
      }

      /* Roman / Arabic numerals at cardinal + intermediate hours */
      const labels = [
        { n: "12", a: 0, cardinal: true },
        { n: "1", a: 30 },
        { n: "2", a: 60 },
        { n: "3", a: 90, cardinal: true },
        { n: "4", a: 120 },
        { n: "5", a: 150 },
        { n: "6", a: 180, cardinal: true },
        { n: "7", a: 210 },
        { n: "8", a: 240 },
        { n: "9", a: 270, cardinal: true },
        { n: "10", a: 300 },
        { n: "11", a: 330 },
      ];

      function layoutNumerals() {
        const face = numeralsEl.parentElement;
        const size = face.clientWidth;
        const radius = size * 0.33;
        numeralsEl.innerHTML = "";
        labels.forEach(({ n, a, cardinal }) => {
          const el = document.createElement("span");
          el.className = "numeral" + (cardinal ? " cardinal" : "");
          el.textContent = n;
          const rad = (a - 90) * (Math.PI / 180);
          const x = size / 2 + Math.cos(rad) * radius;
          const y = size / 2 + Math.sin(rad) * radius;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.marginLeft = "0";
          el.style.transform = "translate(-50%, -50%)";
          numeralsEl.appendChild(el);
        });
      }

      /* Starfield */
      function spawnStars() {
        const count = reduceMotion ? 40 : 90;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = Math.random() * 2.2 + 0.4;
          s.style.width = size + "px";
          s.style.height = size + "px";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.setProperty("--dur", 2.5 + Math.random() * 5 + "s");
          s.style.setProperty("--delay", Math.random() * 6 + "s");
          s.style.setProperty("--min", 0.08 + Math.random() * 0.2);
          s.style.setProperty("--max", 0.5 + Math.random() * 0.5);
          if (Math.random() > 0.85) {
            s.style.boxShadow = "0 0 " + (3 + Math.random() * 4) + "px rgba(238,242,248,0.6)";
          }
          frag.appendChild(s);
        }
        starsEl.appendChild(frag);
      }

      function pad(n, w) {
        return String(n).padStart(w || 2, "0");
      }

      function updateTimezone() {
        try {
          const parts = new Intl.DateTimeFormat(undefined, {
            timeZoneName: "short",
          }).formatToParts(new Date());
          const tz = parts.find((p) => p.type === "timeZoneName");
          tzLabel.textContent = tz ? tz.value : "Local";
        } catch {
          tzLabel.textContent = "Local";
        }
      }

      function updateDate(now) {
        const opts = { month: "long", day: "numeric", year: "numeric" };
        dateLine.textContent = now.toLocaleDateString(undefined, opts);
        weekday.textContent = now.toLocaleDateString(undefined, { weekday: "long" });
      }

      function setHands(now) {
        const ms = now.getMilliseconds();
        const s = now.getSeconds() + (sweep ? ms / 1000 : 0);
        const m = now.getMinutes() + s / 60;
        const h = (now.getHours() % 12) + m / 60;

        const secAngle = s * 6;
        const minAngle = m * 6;
        const hourAngle = h * 30;

        secondHand.style.transform = `rotate(${secAngle}deg)`;
        minuteHand.style.transform = `rotate(${minAngle}deg)`;
        hourHand.style.transform = `rotate(${hourAngle}deg)`;
        trail.style.setProperty("--sec-angle", secAngle + "deg");
      }

      function setDigital(now) {
        let hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ms = now.getMilliseconds();

        if (!use24) {
          const ampm = hours >= 12 ? "PM" : "AM";
          hours = hours % 12 || 12;
          hDigits.textContent = pad(hours);
          /* Show AM/PM subtly via ms slot when 12h — keep ms when 24h */
          msDigits.textContent = ampm;
          msDigits.style.fontSize = "0.38em";
          msDigits.style.letterSpacing = "0.14em";
        } else {
          hDigits.textContent = pad(hours);
          msDigits.textContent = pad(ms, 3);
          msDigits.style.fontSize = "";
          msDigits.style.letterSpacing = "";
        }

        mDigits.textContent = pad(minutes);
        sDigits.textContent = pad(seconds);

        if (seconds !== lastSecond) {
          lastSecond = seconds;
          if (seconds === 0) updateDate(now);
        }
      }

      function tick() {
        const now = new Date();
        setHands(now);
        setDigital(now);
        requestAnimationFrame(tick);
      }

      /* Controls */
      function setMode(mode24) {
        use24 = mode24;
        btn24.classList.toggle("active", use24);
        btn12.classList.toggle("active", !use24);
        btn24.setAttribute("aria-pressed", use24);
        btn12.setAttribute("aria-pressed", !use24);
      }

      btn24.addEventListener("click", () => setMode(true));
      btn12.addEventListener("click", () => setMode(false));
      btnSweep.addEventListener("click", () => {
        sweep = !sweep;
        btnSweep.classList.toggle("active", sweep);
        btnSweep.setAttribute("aria-pressed", sweep);
        trail.style.opacity = sweep ? "0.7" : "0.35";
      });

      /* Init */
      spawnStars();
      layoutTicks();
      layoutNumerals();
      updateTimezone();
      updateDate(new Date());
      trail.style.opacity = "0.35";

      window.addEventListener("resize", () => {
        layoutTicks();
        layoutNumerals();
      });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
