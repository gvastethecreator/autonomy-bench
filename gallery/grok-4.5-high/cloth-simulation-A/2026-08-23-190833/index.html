<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloth Simulation</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(16, 22, 40, 0.88);
      --border: rgba(140, 170, 255, 0.22);
      --text: #e8eefc;
      --muted: #9aabc8;
      --accent: #7aa2ff;
      --accent-2: #56d4c8;
      --danger: #ff6b8a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 20% -10%, #1a2750 0%, transparent 55%),
        radial-gradient(900px 600px at 90% 10%, #14343a 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
      width: min(320px, calc(100vw - 32px));
      padding: 14px 16px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .hud h1 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .hud p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .row {
      display: grid;
      grid-template-columns: 78px 1fr 42px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .row label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .row output {
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      text-align: right;
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin: 10px 0 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .checks label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(122, 162, 255, 0.18), rgba(122, 162, 255, 0.08));
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover {
      border-color: rgba(122, 162, 255, 0.55);
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    button.danger {
      background: linear-gradient(180deg, rgba(255, 107, 138, 0.22), rgba(255, 107, 138, 0.08));
      border-color: rgba(255, 107, 138, 0.35);
    }

    .hint {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      max-width: min(280px, calc(100vw - 32px));
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(10, 14, 28, 0.72);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      pointer-events: none;
    }

    .hint strong { color: var(--accent-2); font-weight: 600; }

    @media (max-width: 640px) {
      .hud { top: 10px; left: 10px; padding: 12px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="cloth" aria-label="Interactive cloth simulation canvas"></canvas>

    <aside class="hud" aria-label="Simulation controls">
      <h1>Cloth Simulation</h1>
      <p>Drag the fabric. Hold <strong>Shift</strong> and drag to tear. Pins hold the top edge.</p>

      <div class="row">
        <label for="gravity">Gravity</label>
        <input id="gravity" type="range" min="0" max="3000" step="10" value="1200" />
        <output id="gravityOut" for="gravity">1200</output>
      </div>
      <div class="row">
        <label for="wind">Wind</label>
        <input id="wind" type="range" min="-1800" max="1800" step="10" value="220" />
        <output id="windOut" for="wind">220</output>
      </div>
      <div class="row">
        <label for="stiffness">Stiffness</label>
        <input id="stiffness" type="range" min="1" max="12" step="1" value="4" />
        <output id="stiffnessOut" for="stiffness">4</output>
      </div>
      <div class="row">
        <label for="friction">Friction</label>
        <input id="friction" type="range" min="0.90" max="1.00" step="0.005" value="0.985" />
        <output id="frictionOut" for="friction">0.985</output>
      </div>

      <div class="checks">
        <label><input id="showPoints" type="checkbox" /> Points</label>
        <label><input id="colorize" type="checkbox" checked /> Strain color</label>
        <label><input id="paused" type="checkbox" /> Pause</label>
      </div>

      <div class="actions">
        <button id="resetBtn" type="button">Reset</button>
        <button id="unpinBtn" type="button">Drop pins</button>
        <button id="gustBtn" type="button">Gust</button>
        <button id="cutBtn" type="button" class="danger">Slash</button>
      </div>
    </aside>

    <div class="hint">
      <strong>Tip:</strong> drag anywhere on the cloth. Use Slash for a diagonal cut, or Shift-drag to tear seams.
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("cloth");
      const ctx = canvas.getContext("2d", { alpha: false });

      const gravityEl = document.getElementById("gravity");
      const windEl = document.getElementById("wind");
      const stiffnessEl = document.getElementById("stiffness");
      const frictionEl = document.getElementById("friction");
      const gravityOut = document.getElementById("gravityOut");
      const windOut = document.getElementById("windOut");
      const stiffnessOut = document.getElementById("stiffnessOut");
      const frictionOut = document.getElementById("frictionOut");
      const showPointsEl = document.getElementById("showPoints");
      const colorizeEl = document.getElementById("colorize");
      const pausedEl = document.getElementById("paused");

      const COLS = 28;
      const ROWS = 22;
      const SPACING = 18;
      const TEAR_THRESHOLD = 42;
      const CONSTRAINT_ITERS_BASE = 3;

      let dpr = 1;
      let width = 0;
      let height = 0;
      let points = [];
      let constraints = [];
      let dragPoint = null;
      let mouse = { x: 0, y: 0, down: false, tearing: false };
      let gust = 0;
      let windPhase = 0;
      let lastTime = performance.now();

      class Point {
        constructor(x, y, pinned = false) {
          this.x = x;
          this.y = y;
          this.px = x;
          this.py = y;
          this.ax = 0;
          this.ay = 0;
          this.pinned = pinned;
          this.pinX = x;
          this.pinY = y;
        }

        addForce(fx, fy) {
          this.ax += fx;
          this.ay += fy;
        }

        update(dt, friction) {
          if (this.pinned) {
            this.x = this.pinX;
            this.y = this.pinY;
            this.px = this.pinX;
            this.py = this.pinY;
            this.ax = 0;
            this.ay = 0;
            return;
          }

          const vx = (this.x - this.px) * friction;
          const vy = (this.y - this.py) * friction;
          this.px = this.x;
          this.py = this.y;
          this.x += vx + this.ax * dt * dt;
          this.y += vy + this.ay * dt * dt;
          this.ax = 0;
          this.ay = 0;

          if (this.x < 0) { this.x = 0; this.px = this.x + vx * 0.4; }
          if (this.x > width) { this.x = width; this.px = this.x + vx * 0.4; }
          if (this.y > height) { this.y = height; this.py = this.y + vy * 0.25; }
          if (this.y < 0) { this.y = 0; this.py = this.y + vy * 0.4; }
        }
      }

      class Constraint {
        constructor(p1, p2) {
          this.p1 = p1;
          this.p2 = p2;
          const dx = p1.x - p2.x;
          const dy = p1.y - p2.y;
          this.length = Math.hypot(dx, dy);
          this.active = true;
        }

        resolve() {
          if (!this.active) return 0;
          const dx = this.p2.x - this.p1.x;
          const dy = this.p2.y - this.p1.y;
          const dist = Math.hypot(dx, dy) || 0.0001;
          if (dist > TEAR_THRESHOLD) {
            this.active = false;
            return 0;
          }
          const diff = (this.length - dist) / dist;
          const ox = dx * diff * 0.5;
          const oy = dy * diff * 0.5;
          if (!this.p1.pinned) {
            this.p1.x -= ox;
            this.p1.y -= oy;
          }
          if (!this.p2.pinned) {
            this.p2.x += ox;
            this.p2.y += oy;
          }
          return Math.abs(dist - this.length) / this.length;
        }
      }

      function idx(c, r) {
        return r * COLS + c;
      }

      function buildCloth() {
        points = [];
        constraints = [];

        const clothW = (COLS - 1) * SPACING;
        const startX = Math.round((width - clothW) / 2);
        const startY = Math.max(48, Math.round(height * 0.08));

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const pinned = r === 0 && (c % 3 === 0 || c === COLS - 1);
            points.push(new Point(startX + c * SPACING, startY + r * SPACING, pinned));
          }
        }

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const p = points[idx(c, r)];
            if (c < COLS - 1) constraints.push(new Constraint(p, points[idx(c + 1, r)]));
            if (r < ROWS - 1) constraints.push(new Constraint(p, points[idx(c, r + 1)]));
            if (c < COLS - 1 && r < ROWS - 1) {
              constraints.push(new Constraint(p, points[idx(c + 1, r + 1)]));
              constraints.push(new Constraint(points[idx(c + 1, r)], points[idx(c, r + 1)]));
            }
          }
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!points.length) buildCloth();
      }

      function nearestPoint(x, y, maxDist = 28) {
        let best = null;
        let bestD = maxDist * maxDist;
        for (const p of points) {
          const dx = p.x - x;
          const dy = p.y - y;
          const d = dx * dx + dy * dy;
          if (d < bestD) {
            bestD = d;
            best = p;
          }
        }
        return best;
      }

      function tearNear(x, y, radius = 16) {
        const r2 = radius * radius;
        for (const c of constraints) {
          if (!c.active) continue;
          const mx = (c.p1.x + c.p2.x) * 0.5;
          const my = (c.p1.y + c.p2.y) * 0.5;
          const dx = mx - x;
          const dy = my - y;
          if (dx * dx + dy * dy < r2) c.active = false;
        }
      }

      function slashCloth() {
        const mid = Math.floor(COLS / 2);
        for (let r = 3; r < ROWS - 2; r++) {
          for (const c of constraints) {
            if (!c.active) continue;
            const a = points.indexOf(c.p1);
            const b = points.indexOf(c.p2);
            const ca = a % COLS;
            const cb = b % COLS;
            const ra = Math.floor(a / COLS);
            const rb = Math.floor(b / COLS);
            if ((ca === mid || cb === mid) && Math.min(ra, rb) === r && Math.abs(ca - cb) + Math.abs(ra - rb) === 1) {
              c.active = false;
            }
          }
        }
      }

      function pointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const src = e.touches && e.touches[0] ? e.touches[0] : e;
        return {
          x: src.clientX - rect.left,
          y: src.clientY - rect.top,
          shift: !!(e.shiftKey || (e.touches && e.touches.length > 1))
        };
      }

      function onPointerDown(e) {
        e.preventDefault();
        const p = pointerPos(e);
        mouse.x = p.x;
        mouse.y = p.y;
        mouse.down = true;
        mouse.tearing = p.shift || e.button === 2;
        canvas.classList.add("dragging");
        if (mouse.tearing) {
          tearNear(mouse.x, mouse.y, 18);
          dragPoint = null;
        } else {
          dragPoint = nearestPoint(mouse.x, mouse.y, 36);
        }
      }

      function onPointerMove(e) {
        const p = pointerPos(e);
        mouse.x = p.x;
        mouse.y = p.y;
        if (!mouse.down) return;
        if (mouse.tearing || p.shift) {
          mouse.tearing = true;
          tearNear(mouse.x, mouse.y, 14);
        } else if (dragPoint && !dragPoint.pinned) {
          dragPoint.x = mouse.x;
          dragPoint.y = mouse.y;
          dragPoint.px = mouse.x;
          dragPoint.py = mouse.y;
        }
      }

      function onPointerUp() {
        mouse.down = false;
        mouse.tearing = false;
        dragPoint = null;
        canvas.classList.remove("dragging");
      }

      canvas.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("touchstart", onPointerDown, { passive: false });
      canvas.addEventListener("touchmove", (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
      canvas.addEventListener("touchend", onPointerUp);
      canvas.addEventListener("touchcancel", onPointerUp);

      function syncOutputs() {
        gravityOut.textContent = gravityEl.value;
        windOut.textContent = windEl.value;
        stiffnessOut.textContent = stiffnessEl.value;
        frictionOut.textContent = Number(frictionEl.value).toFixed(3);
      }

      [gravityEl, windEl, stiffnessEl, frictionEl].forEach((el) => {
        el.addEventListener("input", syncOutputs);
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        buildCloth();
        gust = 0;
      });

      document.getElementById("unpinBtn").addEventListener("click", () => {
        for (const p of points) p.pinned = false;
      });

      document.getElementById("gustBtn").addEventListener("click", () => {
        gust = 2400 * (Math.random() > 0.4 ? 1 : -1);
      });

      document.getElementById("cutBtn").addEventListener("click", slashCloth);

      function step(dt) {
        const gravity = Number(gravityEl.value);
        const windBase = Number(windEl.value);
        const friction = Number(frictionEl.value);
        const iters = CONSTRAINT_ITERS_BASE + Number(stiffnessEl.value);

        windPhase += dt * 0.0022;
        const wind =
          windBase +
          Math.sin(windPhase) * 180 +
          Math.sin(windPhase * 2.7) * 90 +
          gust;
        gust *= 0.94;
        if (Math.abs(gust) < 8) gust = 0;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const p = points[idx(c, r)];
            const flap = Math.sin(windPhase * 1.6 + c * 0.25 + r * 0.15) * 0.35 + 1;
            p.addForce(wind * flap, gravity);
          }
        }

        if (dragPoint && mouse.down && !mouse.tearing && !dragPoint.pinned) {
          dragPoint.x = mouse.x;
          dragPoint.y = mouse.y;
          dragPoint.px = mouse.x;
          dragPoint.py = mouse.y;
        }

        for (const p of points) p.update(dt, friction);
        for (let i = 0; i < iters; i++) {
          for (const c of constraints) c.resolve();
        }
      }

      function strainColor(t) {
        const u = Math.min(1, Math.max(0, t));
        const r = Math.round(90 + u * 165);
        const g = Math.round(150 - u * 90);
        const b = Math.round(255 - u * 140);
        return `rgba(${r},${g},${b},0.85)`;
      }

      function draw() {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, "#10182f");
        g.addColorStop(1, "#070b16");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalAlpha = 0.18;
        for (let i = 0; i < 5; i++) {
          const y = ((performance.now() * 0.02 + i * 90) % (height + 120)) - 40;
          ctx.fillStyle = i % 2 ? "#7aa2ff" : "#56d4c8";
          ctx.fillRect(0, y, width, 18);
        }
        ctx.restore();

        const useColor = colorizeEl.checked;
        ctx.lineWidth = 1.15;
        ctx.lineCap = "round";

        for (const c of constraints) {
          if (!c.active) continue;
          const dx = c.p2.x - c.p1.x;
          const dy = c.p2.y - c.p1.y;
          const dist = Math.hypot(dx, dy);
          const strain = Math.abs(dist - c.length) / c.length;
          ctx.strokeStyle = useColor ? strainColor(strain * 4.5) : "rgba(170, 195, 255, 0.72)";
          ctx.beginPath();
          ctx.moveTo(c.p1.x, c.p1.y);
          ctx.lineTo(c.p2.x, c.p2.y);
          ctx.stroke();
        }

        if (showPointsEl.checked) {
          for (const p of points) {
            ctx.beginPath();
            ctx.fillStyle = p.pinned ? "#ffd27a" : "#dce7ff";
            ctx.arc(p.x, p.y, p.pinned ? 2.6 : 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          for (const p of points) {
            if (!p.pinned) continue;
            ctx.beginPath();
            ctx.fillStyle = "#ffd27a";
            ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (dragPoint && mouse.down && !mouse.tearing) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(86, 212, 200, 0.9)";
          ctx.lineWidth = 1.5;
          ctx.arc(dragPoint.x, dragPoint.y, 10, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function frame(now) {
        const raw = Math.min(32, now - lastTime);
        lastTime = now;
        if (!pausedEl.checked) {
          const steps = raw > 18 ? 2 : 1;
          const dt = (raw / steps);
          for (let i = 0; i < steps; i++) step(dt);
        }
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", () => {
        const oldW = width;
        const oldH = height;
        resize();
        if (Math.abs(oldW - width) > 40 || Math.abs(oldH - height) > 40) {
          buildCloth();
        }
      });

      syncOutputs();
      resize();
      buildCloth();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
