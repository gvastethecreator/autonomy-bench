<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Drive — Endless Highway</title>
  <style>
    :root {
      --ink: #070b14;
      --mist: #9eb6d4;
      --amber: #ffb454;
      --cyan: #6ec8ff;
      --panel: rgba(6, 10, 18, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--mist);
      font-family: "Segoe UI", system-ui, sans-serif;
      cursor: none;
    }
    #c {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to top, rgba(0,0,0,0.35), transparent 28%);
      pointer-events: none;
    }
    .hud-top {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .hud-top.visible { opacity: 1; }
    .stat {
      background: var(--panel);
      border: 1px solid rgba(158, 182, 212, 0.18);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      min-width: 7.5rem;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .stat .label {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(158, 182, 212, 0.65);
      margin-bottom: 0.2rem;
    }
    .stat .value {
      font-variant-numeric: tabular-nums;
      font-size: 1.35rem;
      font-weight: 600;
      color: #e8f1ff;
    }
    .stat .value span {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(158, 182, 212, 0.7);
      margin-left: 0.25rem;
    }
    .speed-wrap { text-align: right; }
    .speed-wrap .value { color: var(--amber); }
    .lane-hint {
      position: absolute;
      bottom: 1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(158, 182, 212, 0.55);
      background: var(--panel);
      border: 1px solid rgba(158, 182, 212, 0.12);
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      opacity: 0;
      transition: opacity 0.8s ease;
      white-space: nowrap;
    }
    .lane-hint.visible { opacity: 1; }
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(40, 70, 120, 0.35), transparent 55%),
        linear-gradient(180deg, rgba(4,7,14,0.55), rgba(4,7,14,0.92));
      pointer-events: auto;
      cursor: default;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .card {
      width: min(34rem, calc(100% - 2.5rem));
      text-align: center;
      padding: 2.4rem 2rem 2rem;
      border-radius: 20px;
      background: rgba(8, 12, 22, 0.78);
      border: 1px solid rgba(158, 182, 212, 0.16);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.9rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #f2f6ff;
      line-height: 1.05;
      margin-bottom: 0.85rem;
    }
    .lede {
      color: rgba(190, 210, 235, 0.82);
      font-size: 1.02rem;
      line-height: 1.55;
      margin: 0 auto 1.6rem;
      max-width: 28rem;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-bottom: 1.6rem;
      text-align: left;
    }
    .ctrl {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(158, 182, 212, 0.1);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      font-size: 0.86rem;
      color: rgba(200, 216, 236, 0.85);
    }
    .ctrl kbd {
      display: inline-block;
      min-width: 1.5rem;
      padding: 0.1rem 0.35rem;
      margin-right: 0.15rem;
      border-radius: 5px;
      border: 1px solid rgba(158, 182, 212, 0.28);
      background: rgba(110, 140, 180, 0.15);
      font-family: inherit;
      font-size: 0.78rem;
      color: #e8f1ff;
      text-align: center;
    }
    #startBtn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.95rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #081018;
      background: linear-gradient(135deg, #ffd089, #ff9e4a);
      box-shadow: 0 10px 30px rgba(255, 160, 70, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #startBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px rgba(255, 160, 70, 0.45);
    }
    #startBtn:active { transform: translateY(1px); }
    .flash {
      position: absolute;
      inset: 0;
      background: rgba(255, 120, 80, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .flash.on { opacity: 1; }
    @media (max-width: 640px) {
      .controls { grid-template-columns: 1fr; }
      .lane-hint { font-size: 0.68rem; bottom: 1rem; }
      .stat { min-width: 0; padding: 0.55rem 0.75rem; }
      .stat .value { font-size: 1.1rem; }
      body { cursor: auto; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>
    <div class="hud-top" id="hud">
      <div class="stat">
        <div class="label">Distance</div>
        <div class="value" id="distance">0<span>km</span></div>
      </div>
      <div class="stat speed-wrap">
        <div class="label">Speed</div>
        <div class="value" id="speed">0<span>km/h</span></div>
      </div>
    </div>
    <div class="lane-hint" id="hint">WASD / Arrows · Space brake · Esc pause</div>
  </div>

  <div id="overlay">
    <div class="card">
      <div class="eyebrow">Endless night highway</div>
      <h1>Night Drive</h1>
      <p class="lede">
        Soft asphalt, sodium lamps, and a road that never ends.
        Keep the lane, chase the horizon, and let the night stretch on.
      </p>
      <div class="controls">
        <div class="ctrl"><kbd>W</kbd><kbd>↑</kbd> Accelerate</div>
        <div class="ctrl"><kbd>S</kbd><kbd>↓</kbd> Brake / reverse feel</div>
        <div class="ctrl"><kbd>A</kbd><kbd>←</kbd> Steer left</div>
        <div class="ctrl"><kbd>D</kbd><kbd>→</kbd> Steer right</div>
      </div>
      <button id="startBtn" type="button">Enter the night</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

/* =========================================================
   Night Drive — endless procedural highway
   ========================================================= */

const canvas = document.getElementById('c');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const hint = document.getElementById('hint');
const distanceEl = document.getElementById('distance');
const speedEl = document.getElementById('speed');
const flashEl = document.getElementById('flash');

const LANES = [-3.4, 0, 3.4];
const ROAD_HALF = 7.2;
const SEGMENT_LEN = 40;
const SEGMENT_COUNT = 28;
const WORLD_AHEAD = SEGMENT_LEN * SEGMENT_COUNT;

const state = {
  playing: false,
  paused: false,
  speed: 0,          // m/s
  targetSpeed: 0,
  maxSpeed: 42,      // ~151 km/h
  laneX: 0,
  steer: 0,
  distance: 0,       // meters
  roadOffset: 0,
  shake: 0,
  time: 0,
};

const keys = Object.create(null);

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x050914, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08101c, 0.018);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 420);
camera.position.set(0, 3.2, 8);

/* ---------- lighting ---------- */
scene.add(new THREE.AmbientLight(0x2a3550, 0.55));
const moon = new THREE.DirectionalLight(0xb8c8ff, 0.35);
moon.position.set(-40, 60, -20);
scene.add(moon);

const hemi = new THREE.HemisphereLight(0x1a2740, 0x05070c, 0.45);
scene.add(hemi);

/* ---------- sky / stars / moon disc ---------- */
function makeStars() {
  const count = 1800;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 180 + Math.random() * 160;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(THREE.MathUtils.randFloat(0.05, 0.92));
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 40;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xdde8ff,
    size: 0.55,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
  });
  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
  return stars;
}
const stars = makeStars();

const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(6, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xe8eefc })
);
moonMesh.position.set(-70, 55, -160);
scene.add(moonMesh);
const moonGlow = new THREE.Mesh(
  new THREE.SphereGeometry(10, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x9ab0ff, transparent: true, opacity: 0.12, depthWrite: false })
);
moonGlow.position.copy(moonMesh.position);
scene.add(moonGlow);

/* city glow band on horizon */
const horizon = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 28),
  new THREE.MeshBasicMaterial({
    color: 0x1a2a55,
    transparent: true,
    opacity: 0.35,
    depthWrite: false,
  })
);
horizon.position.set(0, 4, -220);
scene.add(horizon);

/* ---------- ground & road ---------- */
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0a1018,
  roughness: 1,
  metalness: 0,
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, WORLD_AHEAD + 80), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.z = -WORLD_AHEAD * 0.35;
ground.position.y = -0.05;
scene.add(ground);

const roadGroup = new THREE.Group();
scene.add(roadGroup);

const asphaltMat = new THREE.MeshStandardMaterial({
  color: 0x151a22,
  roughness: 0.92,
  metalness: 0.05,
});
const lineMat = new THREE.MeshBasicMaterial({ color: 0xd8e2f0 });
const dashMat = new THREE.MeshBasicMaterial({ color: 0xd0a040 });
const shoulderMat = new THREE.MeshStandardMaterial({
  color: 0x1c1410,
  roughness: 1,
});

function createRoadSegment(z) {
  const g = new THREE.Group();
  g.position.z = z;

  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF * 2, SEGMENT_LEN), asphaltMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  g.add(road);

  // shoulders
  for (const side of [-1, 1]) {
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(3.2, SEGMENT_LEN), shoulderMat);
    sh.rotation.x = -Math.PI / 2;
    sh.position.set(side * (ROAD_HALF + 1.5), 0.005, 0);
    g.add(sh);
  }

  // edge lines
  for (const side of [-1, 1]) {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.12, SEGMENT_LEN), lineMat);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(side * (ROAD_HALF - 0.25), 0.02, 0);
    g.add(edge);
  }

  // dashed center / lane markers
  const dashCount = 5;
  for (let i = 0; i < dashCount; i++) {
    for (const lx of [-1.7, 1.7]) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 3.2), dashMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(lx, 0.025, -SEGMENT_LEN / 2 + 4 + i * 7.5);
      g.add(dash);
    }
  }

  // guardrails
  const railMat = new THREE.MeshStandardMaterial({ color: 0x3a4455, metalness: 0.6, roughness: 0.4 });
  for (const side of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, SEGMENT_LEN), railMat);
    rail.position.set(side * (ROAD_HALF + 0.35), 0.4, 0);
    g.add(rail);
    const postGeo = new THREE.BoxGeometry(0.12, 0.9, 0.12);
    for (let i = 0; i < 4; i++) {
      const post = new THREE.Mesh(postGeo, railMat);
      post.position.set(side * (ROAD_HALF + 0.35), 0.35, -SEGMENT_LEN / 2 + 5 + i * 10);
      g.add(post);
    }
  }

  return g;
}

const segments = [];
for (let i = 0; i < SEGMENT_COUNT; i++) {
  const seg = createRoadSegment(-i * SEGMENT_LEN);
  roadGroup.add(seg);
  segments.push(seg);
}

/* ---------- roadside props (pooled) ---------- */
const props = new THREE.Group();
scene.add(props);

const lampMat = new THREE.MeshStandardMaterial({ color: 0x2a3038, metalness: 0.7, roughness: 0.35 });
const lampGlowMat = new THREE.MeshBasicMaterial({ color: 0xffc978 });
const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 1 });
const treeCanopyMat = new THREE.MeshStandardMaterial({ color: 0x0d1a12, roughness: 1 });
const signMat = new THREE.MeshStandardMaterial({ color: 0x102038, emissive: 0x1a4060, emissiveIntensity: 0.4 });

function makeLamp() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5.2, 6), lampMat);
  pole.position.y = 2.6;
  g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.08), lampMat);
  arm.position.set(0.7, 5.1, 0);
  g.add(arm);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), lampGlowMat);
  bulb.position.set(1.35, 5.0, 0);
  g.add(bulb);
  const light = new THREE.PointLight(0xffb86a, 1.8, 22, 2);
  light.position.copy(bulb.position);
  g.add(light);
  // pool of light on road
  const puddle = new THREE.Mesh(
    new THREE.CircleGeometry(2.4, 16),
    new THREE.MeshBasicMaterial({ color: 0xffc070, transparent: true, opacity: 0.07, depthWrite: false })
  );
  puddle.rotation.x = -Math.PI / 2;
  puddle.position.set(0.4, 0.03, 0);
  g.add(puddle);
  return g;
}

function makeTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 2.4, 5), treeTrunkMat);
  trunk.position.y = 1.2;
  g.add(trunk);
  const canopy = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.2, 6), treeCanopyMat);
  canopy.position.y = 3.4;
  g.add(canopy);
  return g;
}

function makeNeonSign() {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 4.5, 0.15), lampMat);
  post.position.y = 2.25;
  g.add(post);
  const board = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.4, 0.12), signMat);
  board.position.set(0, 4.2, 0);
  g.add(board);
  const glow = new THREE.PointLight(0x4aa8ff, 1.2, 18, 2);
  glow.position.set(0, 4.2, 0.4);
  g.add(glow);
  return g;
}

const lampPool = [];
const treePool = [];
const signPool = [];
for (let i = 0; i < 24; i++) {
  const lamp = makeLamp();
  lamp.visible = false;
  props.add(lamp);
  lampPool.push(lamp);
}
for (let i = 0; i < 40; i++) {
  const tree = makeTree();
  tree.visible = false;
  props.add(tree);
  treePool.push(tree);
}
for (let i = 0; i < 6; i++) {
  const sign = makeNeonSign();
  sign.visible = false;
  props.add(sign);
  signPool.push(sign);
}

function seedProps() {
  lampPool.forEach((lamp, i) => {
    const side = i % 2 === 0 ? 1 : -1;
    lamp.visible = true;
    lamp.position.set(side * (ROAD_HALF + 2.2), 0, -i * 18);
    lamp.scale.x = side;
  });
  treePool.forEach((tree, i) => {
    const side = i % 2 === 0 ? -1 : 1;
    tree.visible = true;
    const sx = side * (12 + (i % 5) * 3.5 + Math.random() * 6);
    tree.position.set(sx, 0, -8 - i * 11);
    const s = 0.8 + Math.random() * 0.7;
    tree.scale.setScalar(s);
  });
  signPool.forEach((sign, i) => {
    const side = i % 2 === 0 ? 1 : -1;
    sign.visible = true;
    sign.position.set(side * (ROAD_HALF + 5.5), 0, -50 - i * 95);
  });
}

function wrapProp(obj, farZ, nearZ, reseat) {
  if (obj.position.z > nearZ) {
    obj.position.z = farZ - Math.random() * 20;
    if (reseat) reseat(obj);
  }
}

seedProps();

/* ---------- player car ---------- */
function makeCar(bodyColor = 0x1a2330, accent = 0x6ec8ff) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.55, 4.2),
    new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.55, roughness: 0.35 })
  );
  body.position.y = 0.55;
  g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.55, 0.5, 2.0),
    new THREE.MeshStandardMaterial({ color: 0x101820, metalness: 0.4, roughness: 0.25 })
  );
  cabin.position.set(0, 1.05, -0.15);
  g.add(cabin);
  const glass = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.35, 1.7),
    new THREE.MeshStandardMaterial({
      color: 0x88aacc,
      metalness: 0.9,
      roughness: 0.1,
      transparent: true,
      opacity: 0.45,
    })
  );
  glass.position.set(0, 1.15, -0.1);
  g.add(glass);

  const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.28, 10);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
  const wheelPos = [
    [-0.95, 0.32, 1.25],
    [0.95, 0.32, 1.25],
    [-0.95, 0.32, -1.35],
    [0.95, 0.32, -1.35],
  ];
  for (const [x, y, z] of wheelPos) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.position.set(x, y, z);
    g.add(w);
  }

  // headlights
  for (const sx of [-0.55, 0.55]) {
    const hl = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.14, 0.08),
      new THREE.MeshBasicMaterial({ color: 0xfff2c8 })
    );
    hl.position.set(sx, 0.55, 2.12);
    g.add(hl);
  }
  // taillights
  for (const sx of [-0.55, 0.55]) {
    const tl = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.12, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xff3355 })
    );
    tl.position.set(sx, 0.6, -2.12);
    g.add(tl);
  }

  // accent stripe
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.06, 3.6),
    new THREE.MeshBasicMaterial({ color: accent })
  );
  stripe.position.set(0, 0.84, 0.1);
  g.add(stripe);

  return g;
}

const player = makeCar(0x1c2838, 0xffb454);
player.position.set(0, 0, 0);
scene.add(player);

const headLightL = new THREE.SpotLight(0xfff0d0, 2.4, 55, Math.PI / 7, 0.45, 1);
headLightL.position.set(-0.5, 0.7, 2.1);
headLightL.target.position.set(-0.5, 0, 18);
player.add(headLightL);
player.add(headLightL.target);
const headLightR = new THREE.SpotLight(0xfff0d0, 2.4, 55, Math.PI / 7, 0.45, 1);
headLightR.position.set(0.5, 0.7, 2.1);
headLightR.target.position.set(0.5, 0, 18);
player.add(headLightR);
player.add(headLightR.target);

/* ---------- traffic ---------- */
const traffic = [];
const trafficColors = [0x222830, 0x2a1a1a, 0x1a2a20, 0x241828, 0x1a2030];

function spawnTrafficCar(z, lane) {
  const car = makeCar(
    trafficColors[(Math.random() * trafficColors.length) | 0],
    Math.random() > 0.5 ? 0x6ec8ff : 0xff8866
  );
  car.userData = {
    lane,
    speed: 12 + Math.random() * 16,
    oncoming: false,
    baseZ: z,
  };
  car.position.set(LANES[lane], 0, z);
  scene.add(car);
  traffic.push(car);
  return car;
}

function spawnOncoming(z, lane) {
  const car = makeCar(
    trafficColors[(Math.random() * trafficColors.length) | 0],
    0xff6644
  );
  car.rotation.y = Math.PI;
  car.userData = {
    lane,
    speed: 18 + Math.random() * 14,
    oncoming: true,
    baseZ: z,
  };
  // oncoming uses left lanes mirrored: use negative of right lanes
  car.position.set(-LANES[lane], 0, z);
  scene.add(car);
  traffic.push(car);
  return car;
}

for (let i = 0; i < 8; i++) {
  spawnTrafficCar(-(40 + i * 55 + Math.random() * 20), (Math.random() * 3) | 0);
}
for (let i = 0; i < 6; i++) {
  spawnOncoming(-(60 + i * 70 + Math.random() * 30), (Math.random() * 2) | 0);
}

/* ---------- rain particles ---------- */
const rainCount = 900;
const rainPositions = new Float32Array(rainCount * 3);
for (let i = 0; i < rainCount; i++) {
  rainPositions[i * 3] = (Math.random() - 0.5) * 40;
  rainPositions[i * 3 + 1] = Math.random() * 18;
  rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 50;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
const rain = new THREE.Points(
  rainGeo,
  new THREE.PointsMaterial({
    color: 0xa8c4e0,
    size: 0.08,
    transparent: true,
    opacity: 0.35,
    depthWrite: false,
  })
);
scene.add(rain);

/* ---------- audio (procedural) ---------- */
let audioCtx = null;
let engineGain = null;
let engineOsc = null;
let windGain = null;

function initAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0;
  engineGain.connect(audioCtx.destination);

  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 320;
  const engSoft = audioCtx.createGain();
  engSoft.gain.value = 0.04;
  engineOsc.connect(filter);
  filter.connect(engSoft);
  engSoft.connect(engineGain);
  engineOsc.start();

  // wind / road noise
  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 800;
  windGain = audioCtx.createGain();
  windGain.gain.value = 0;
  noise.connect(noiseFilter);
  noiseFilter.connect(windGain);
  windGain.connect(audioCtx.destination);
  noise.start();
}

function updateAudio() {
  if (!audioCtx || !engineGain) return;
  const t = audioCtx.currentTime;
  const sp = state.speed;
  const eng = state.playing && !state.paused ? THREE.MathUtils.clamp(sp / state.maxSpeed, 0, 1) : 0;
  engineGain.gain.setTargetAtTime(eng * 0.9, t, 0.12);
  if (engineOsc) engineOsc.frequency.setTargetAtTime(48 + sp * 2.8, t, 0.08);
  if (windGain) windGain.gain.setTargetAtTime(eng * 0.035, t, 0.2);
}

/* ---------- input ---------- */
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Escape' && state.playing) {
    state.paused = !state.paused;
    overlay.classList.toggle('hidden', !state.paused);
    if (state.paused) {
      overlay.querySelector('h1').textContent = 'Paused';
      overlay.querySelector('.lede').textContent = 'The night waits. Press Esc or the button to continue.';
      startBtn.textContent = 'Resume drive';
    }
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

let pointerSteer = 0;
window.addEventListener('pointermove', (e) => {
  if (!state.playing || state.paused) return;
  pointerSteer = (e.clientX / window.innerWidth) * 2 - 1;
});
window.addEventListener('pointerdown', () => { keys['PointerGas'] = true; });
window.addEventListener('pointerup', () => { keys['PointerGas'] = false; });

startBtn.addEventListener('click', () => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  state.playing = true;
  state.paused = false;
  overlay.classList.add('hidden');
  hud.classList.add('visible');
  hint.classList.add('visible');
  overlay.querySelector('h1').textContent = 'Night Drive';
  overlay.querySelector('.lede').textContent =
    'Soft asphalt, sodium lamps, and a road that never ends. Keep the lane, chase the horizon, and let the night stretch on.';
  startBtn.textContent = 'Enter the night';
});

/* ---------- resize ---------- */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);

/* ---------- helpers ---------- */
function recycleSegment(seg) {
  let minZ = Infinity;
  for (const s of segments) minZ = Math.min(minZ, s.position.z);
  seg.position.z = minZ - SEGMENT_LEN;
}

function flashHit() {
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 120);
}

function carAABB(obj, halfW = 0.95, halfL = 2.1) {
  return {
    x: obj.position.x,
    z: obj.position.z,
    hw: halfW,
    hl: halfL,
  };
}

function overlap(a, b) {
  return Math.abs(a.x - b.x) < a.hw + b.hw && Math.abs(a.z - b.z) < a.hl + b.hl;
}

/* ---------- update loop ---------- */
let last = performance.now();

function update(dt) {
  state.time += dt;

  // input → speed / steer
  let accel = 0;
  let steerInput = 0;
  if (state.playing && !state.paused) {
    if (keys['KeyW'] || keys['ArrowUp'] || keys['PointerGas']) accel += 1;
    if (keys['KeyS'] || keys['ArrowDown'] || keys['Space']) accel -= 1.4;
    if (keys['KeyA'] || keys['ArrowLeft']) steerInput -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) steerInput += 1;
    // mild pointer assist on touch / mouse
    if (!keys['KeyA'] && !keys['KeyD'] && !keys['ArrowLeft'] && !keys['ArrowRight']) {
      if (Math.abs(pointerSteer) > 0.12) steerInput += pointerSteer * 0.85;
    }
  } else if (!state.playing) {
    // idle crawl on title
    state.speed = THREE.MathUtils.damp(state.speed, 8, 1.2, dt);
  }

  if (state.playing && !state.paused) {
    const want = accel > 0
      ? state.maxSpeed * (0.45 + 0.55 * accel)
      : accel < 0
        ? Math.max(0, state.speed - 28 * dt)
        : state.speed * Math.exp(-0.35 * dt);
    if (accel > 0) {
      state.speed = THREE.MathUtils.damp(state.speed, want, 1.6, dt);
    } else if (accel < 0) {
      state.speed = Math.max(0, state.speed + accel * 22 * dt);
    } else {
      state.speed = THREE.MathUtils.damp(state.speed, Math.max(6, state.speed * 0.98), 0.8, dt);
    }
    // auto cruise floor once started
    if (state.speed < 6) state.speed = THREE.MathUtils.damp(state.speed, 6, 2, dt);

    const steerScale = THREE.MathUtils.clamp(state.speed / 18, 0.35, 1);
    state.steer = THREE.MathUtils.damp(state.steer, steerInput * 5.5 * steerScale, 8, dt);
    state.laneX += state.steer * dt;
    // soft road edges
    const limit = ROAD_HALF - 1.1;
    if (state.laneX > limit) {
      state.laneX = limit;
      state.steer *= 0.3;
      state.shake = Math.max(state.shake, 0.35);
      state.speed *= 0.992;
    } else if (state.laneX < -limit) {
      state.laneX = -limit;
      state.steer *= 0.3;
      state.shake = Math.max(state.shake, 0.35);
      state.speed *= 0.992;
    }
  }

  const move = state.speed * dt;
  state.distance += move;
  state.roadOffset += move;

  // scroll world toward camera (player stays near z=0)
  for (const seg of segments) {
    seg.position.z += move;
    if (seg.position.z > SEGMENT_LEN) recycleSegment(seg);
  }
  ground.position.z = ((state.roadOffset * 0.25) % 40) - WORLD_AHEAD * 0.35;

  // props scroll + wrap
  for (const lamp of lampPool) {
    lamp.position.z += move;
    wrapProp(lamp, -WORLD_AHEAD + 40, SEGMENT_LEN, (o) => {
      const side = Math.random() < 0.5 ? 1 : -1;
      o.position.x = side * (ROAD_HALF + 2.2);
      o.scale.x = side;
    });
  }
  for (const tree of treePool) {
    tree.position.z += move;
    wrapProp(tree, -WORLD_AHEAD + 20, SEGMENT_LEN + 10, (o) => {
      const side = Math.random() < 0.5 ? 1 : -1;
      o.position.x = side * (12 + Math.random() * 20);
      o.scale.setScalar(0.8 + Math.random() * 0.7);
    });
  }
  for (const sign of signPool) {
    sign.position.z += move;
    wrapProp(sign, -WORLD_AHEAD + 60, SEGMENT_LEN + 20, (o) => {
      const side = Math.random() < 0.5 ? 1 : -1;
      o.position.x = side * (ROAD_HALF + 5.5);
    });
  }

  // player transform
  player.position.x = THREE.MathUtils.damp(player.position.x, state.laneX, 12, dt);
  player.position.z = 0;
  player.rotation.y = -state.steer * 0.04;
  player.rotation.z = -state.steer * 0.025;
  // subtle bob
  player.position.y = Math.sin(state.time * 9) * 0.015 * Math.min(1, state.speed / 20);

  // traffic
  const playerBox = carAABB(player);
  for (const car of traffic) {
    const u = car.userData;
    if (u.oncoming) {
      car.position.z += move + u.speed * dt;
      car.position.x = THREE.MathUtils.damp(car.position.x, -LANES[u.lane], 3, dt);
    } else {
      car.position.z += move - u.speed * dt;
      car.position.x = THREE.MathUtils.damp(car.position.x, LANES[u.lane], 3, dt);
    }

    // recycle far behind or far ahead
    if (car.position.z > 30) {
      car.position.z = -180 - Math.random() * 120;
      u.lane = (Math.random() * (u.oncoming ? 2 : 3)) | 0;
      u.speed = (u.oncoming ? 18 : 12) + Math.random() * 16;
    } else if (car.position.z < -320) {
      car.position.z = -40 - Math.random() * 80;
      u.lane = (Math.random() * (u.oncoming ? 2 : 3)) | 0;
    }

    if (state.playing && !state.paused && overlap(playerBox, carAABB(car))) {
      state.shake = 1;
      state.speed *= 0.82;
      flashHit();
      // nudge apart
      car.position.z -= u.oncoming ? -8 : 8;
      state.laneX += Math.sign(state.laneX - car.position.x || 1) * 0.6;
    }
  }

  // rain relative to camera
  const rp = rain.geometry.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    rp[i * 3 + 1] -= (14 + state.speed * 0.15) * dt;
    rp[i * 3 + 2] += move * 0.85;
    if (rp[i * 3 + 1] < 0) {
      rp[i * 3 + 1] = 12 + Math.random() * 8;
      rp[i * 3] = player.position.x + (Math.random() - 0.5) * 36;
      rp[i * 3 + 2] = player.position.z + (Math.random() - 0.5) * 40 - 10;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;

  // camera chase
  state.shake = THREE.MathUtils.damp(state.shake, 0, 4, dt);
  const sh = state.shake;
  const camTargetX = player.position.x * 0.85;
  const camX = camTargetX + (Math.random() - 0.5) * sh * 0.35;
  const camY = 2.8 + Math.min(1.2, state.speed * 0.02) + (Math.random() - 0.5) * sh * 0.2;
  const camZ = 7.5 + Math.min(2.5, state.speed * 0.04);
  camera.position.x = THREE.MathUtils.damp(camera.position.x, camX, 5, dt);
  camera.position.y = THREE.MathUtils.damp(camera.position.y, camY, 5, dt);
  camera.position.z = THREE.MathUtils.damp(camera.position.z, camZ, 5, dt);
  camera.lookAt(player.position.x * 0.9, 0.9, player.position.z - 12);

  // stars drift slowly
  stars.rotation.y = state.time * 0.003;

  // HUD
  if (state.playing) {
    const km = state.distance / 1000;
    distanceEl.childNodes[0].textContent = km < 10 ? km.toFixed(2) : km.toFixed(1);
    const kmh = Math.round(state.speed * 3.6);
    speedEl.childNodes[0].textContent = String(kmh);
  }

  updateAudio();
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
  </script>
</body>
</html>
