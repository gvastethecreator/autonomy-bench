<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ant Colony</title>
<style>
  :root {
    --bg: #0c0a08;
    --panel: #16120e;
    --panel-border: #2a2218;
    --text: #e8dcc8;
    --muted: #9a8b72;
    --accent: #e8a54b;
    --accent-dim: #a06d28;
    --food: #7ecf6a;
    --danger: #c45c4a;
    --nest: #d4a574;
    --trail-food: #5a9e4a;
    --trail-home: #c9a06a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    background: linear-gradient(180deg, #1a1510 0%, #120e0a 100%);
    border-bottom: 1px solid var(--panel-border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 40% 35%, #f0c080 0%, #c4893a 45%, #6b4420 100%);
    box-shadow: 0 0 12px rgba(232, 165, 75, 0.35);
  }

  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.1rem;
  }

  .stats {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .stat {
    text-align: right;
    min-width: 4.5rem;
  }

  .stat-label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .stat-value {
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
  }

  main {
    position: relative;
    min-height: 0;
    background:
      radial-gradient(ellipse at 50% 40%, #1a140e 0%, #0c0a08 70%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    padding: 0.45rem 0.9rem;
    background: rgba(22, 18, 14, 0.85);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    font-size: 0.75rem;
    color: var(--muted);
    pointer-events: none;
    backdrop-filter: blur(6px);
    transition: opacity 0.4s ease;
  }

  .hint.fade { opacity: 0; }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.25rem;
    padding: 0.7rem 1.25rem;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }

  button, .tool {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: #1e1914;
    color: var(--text);
    font: inherit;
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  button:hover, .tool:hover {
    background: #2a2218;
    border-color: var(--accent-dim);
  }

  button:active { transform: translateY(1px); }

  button.primary {
    background: linear-gradient(180deg, #c4893a, #8f5f22);
    border-color: #e8a54b;
    color: #1a1208;
    font-weight: 600;
  }

  button.primary:hover {
    background: linear-gradient(180deg, #d49a4a, #a06d28);
  }

  .tool.active {
    background: #2e2418;
    border-color: var(--accent);
    color: var(--accent);
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.75rem;
  }

  input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
  }

  .legend {
    display: flex;
    gap: 0.9rem;
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .swatch.nest { background: var(--nest); }
  .swatch.food { background: var(--food); }
  .swatch.ant { background: #3a2a1a; box-shadow: inset 0 0 0 1px #8a7050; }
  .swatch.trail { background: var(--trail-food); }

  @media (max-width: 720px) {
    header { flex-direction: column; align-items: flex-start; }
    .stats { justify-content: flex-start; }
    .legend { margin-left: 0; width: 100%; }
    footer { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Ant Colony</h1>
        <div class="subtitle">Pheromone foraging · click to place food</div>
      </div>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><span class="stat-label">Ants</span><span class="stat-value" id="statAnts">0</span></div>
      <div class="stat"><span class="stat-label">Stored</span><span class="stat-value" id="statFood">0</span></div>
      <div class="stat"><span class="stat-label">Foraging</span><span class="stat-value" id="statForaging">0</span></div>
      <div class="stat"><span class="stat-label">Carrying</span><span class="stat-value" id="statCarrying">0</span></div>
    </div>
  </header>

  <main>
    <canvas id="world" aria-label="Ant colony simulation"></canvas>
    <div class="hint" id="hint">Click anywhere to drop a food pile · ants will find it and leave trails</div>
  </main>

  <footer>
    <div class="controls">
      <button type="button" class="primary" id="btnPause">Pause</button>
      <button type="button" id="btnReset">Reset</button>
      <button type="button" class="tool active" id="toolFood" data-tool="food">Place Food</button>
      <button type="button" class="tool" id="toolObstacle" data-tool="obstacle">Place Rock</button>
      <button type="button" id="btnClearFood">Clear Food</button>
    </div>
    <div class="slider-group">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.25" max="3" step="0.25" value="1" />
      <span id="speedVal">1×</span>
    </div>
    <div class="slider-group">
      <label for="ants">Colony</label>
      <input type="range" id="ants" min="20" max="200" step="10" value="80" />
      <span id="antsVal">80</span>
    </div>
    <div class="legend">
      <span><i class="swatch nest"></i> Nest</span>
      <span><i class="swatch food"></i> Food</span>
      <span><i class="swatch ant"></i> Ant</span>
      <span><i class="swatch trail"></i> Trail</span>
    </div>
  </footer>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("world");
  const ctx = canvas.getContext("2d", { alpha: false });

  const el = {
    ants: document.getElementById("statAnts"),
    food: document.getElementById("statFood"),
    foraging: document.getElementById("statForaging"),
    carrying: document.getElementById("statCarrying"),
    pause: document.getElementById("btnPause"),
    reset: document.getElementById("btnReset"),
    clearFood: document.getElementById("btnClearFood"),
    speed: document.getElementById("speed"),
    speedVal: document.getElementById("speedVal"),
    antsSlider: document.getElementById("ants"),
    antsVal: document.getElementById("antsVal"),
    hint: document.getElementById("hint"),
    toolFood: document.getElementById("toolFood"),
    toolObstacle: document.getElementById("toolObstacle"),
  };

  // Simulation grid (pheromones + obstacles)
  const CELL = 6;
  let cols = 0, rows = 0;
  let foodTrail, homeTrail, blocked;
  let W = 0, H = 0;
  let dpr = 1;

  const nest = { x: 0, y: 0, r: 28, stored: 0 };
  let ants = [];
  let foods = [];
  let obstacles = [];
  let tool = "food";
  let running = true;
  let speed = 1;
  let targetAntCount = 80;
  let tick = 0;
  let hintTimer = null;

  const TWO_PI = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (ax, ay, bx, by) => {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  };

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, Math.floor(rect.width));
    H = Math.max(240, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const newCols = Math.ceil(W / CELL);
    const newRows = Math.ceil(H / CELL);
    const oldFood = foodTrail, oldHome = homeTrail, oldBlocked = blocked;
    const oldCols = cols, oldRows = rows;

    cols = newCols;
    rows = newRows;
    foodTrail = new Float32Array(cols * rows);
    homeTrail = new Float32Array(cols * rows);
    blocked = new Uint8Array(cols * rows);

    // Preserve overlapping region
    if (oldFood) {
      const mc = Math.min(cols, oldCols);
      const mr = Math.min(rows, oldRows);
      for (let y = 0; y < mr; y++) {
        for (let x = 0; x < mc; x++) {
          const ni = y * cols + x;
          const oi = y * oldCols + x;
          foodTrail[ni] = oldFood[oi];
          homeTrail[ni] = oldHome[oi];
          blocked[ni] = oldBlocked[oi];
        }
      }
    }

    nest.x = W * 0.5;
    nest.y = H * 0.5;
  }

  function cellIndex(px, py) {
    const cx = clamp(Math.floor(px / CELL), 0, cols - 1);
    const cy = clamp(Math.floor(py / CELL), 0, rows - 1);
    return cy * cols + cx;
  }

  function isBlocked(px, py) {
    if (px < 4 || py < 4 || px >= W - 4 || py >= H - 4) return true;
    return blocked[cellIndex(px, py)] === 1;
  }

  function stampBlock(px, py, radius) {
    const r = Math.ceil(radius / CELL);
    const cx = Math.floor(px / CELL);
    const cy = Math.floor(py / CELL);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
        blocked[y * cols + x] = 1;
      }
    }
  }

  function clearBlockDisk(px, py, radius) {
    const r = Math.ceil(radius / CELL);
    const cx = Math.floor(px / CELL);
    const cy = Math.floor(py / CELL);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
        blocked[y * cols + x] = 0;
      }
    }
  }

  function deposit(trail, px, py, amount, radius = 1.2) {
    const r = Math.ceil(radius);
    const cx = Math.floor(px / CELL);
    const cy = Math.floor(py / CELL);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
        const d = Math.hypot(dx, dy);
        if (d > radius) continue;
        const i = y * cols + x;
        if (blocked[i]) continue;
        trail[i] = Math.min(255, trail[i] + amount * (1 - d / (radius + 0.01)));
      }
    }
  }

  function sampleTrail(trail, px, py, angle, senseAngle, senseDist) {
    // Three sensors: left, center, right
    const sensors = [-senseAngle, 0, senseAngle];
    let best = -1;
    let bestA = angle;
    for (const off of sensors) {
      const a = angle + off;
      const sx = px + Math.cos(a) * senseDist;
      const sy = py + Math.sin(a) * senseDist;
      if (isBlocked(sx, sy)) continue;
      const i = cellIndex(sx, sy);
      const v = trail[i];
      // Slight preference for center when tied
      const score = v + (off === 0 ? 0.01 : 0);
      if (score > best) {
        best = score;
        bestA = a;
      }
    }
    return { strength: best, angle: bestA };
  }

  function createAnt(nearNest = true) {
    const a = rand(0, TWO_PI);
    const r = nearNest ? rand(8, nest.r + 10) : rand(0, Math.min(W, H) * 0.4);
    return {
      x: nest.x + Math.cos(a) * r,
      y: nest.y + Math.sin(a) * r,
      angle: rand(0, TWO_PI),
      speed: rand(1.1, 1.55),
      state: "seek", // seek | carry
      energy: rand(0.7, 1),
      wobble: rand(0, TWO_PI),
      age: rand(0, 1000),
    };
  }

  function syncAntCount() {
    while (ants.length < targetAntCount) ants.push(createAnt(true));
    if (ants.length > targetAntCount) ants.length = targetAntCount;
  }

  function placeFood(x, y, amount = 80) {
    // Don't place inside nest
    if (dist2(x, y, nest.x, nest.y) < (nest.r + 20) ** 2) return;
    if (isBlocked(x, y)) return;
    // Merge with nearby pile
    for (const f of foods) {
      if (dist2(f.x, f.y, x, y) < 28 * 28) {
        f.amount = Math.min(200, f.amount + amount);
        f.r = 6 + Math.sqrt(f.amount) * 0.9;
        return;
      }
    }
    foods.push({
      x, y,
      amount,
      r: 6 + Math.sqrt(amount) * 0.9,
    });
  }

  function placeObstacle(x, y) {
    if (dist2(x, y, nest.x, nest.y) < (nest.r + 24) ** 2) return;
    const r = rand(10, 18);
    obstacles.push({ x, y, r });
    stampBlock(x, y, r);
  }

  function seedWorld() {
    foods = [];
    obstacles = [];
    ants = [];
    nest.stored = 0;
    foodTrail.fill(0);
    homeTrail.fill(0);
    blocked.fill(0);

    // Ring of starter food
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TWO_PI + rand(-0.2, 0.2);
      const d = rand(Math.min(W, H) * 0.28, Math.min(W, H) * 0.38);
      placeFood(nest.x + Math.cos(a) * d, nest.y + Math.sin(a) * d, rand(60, 110));
    }

    // A few rocks
    for (let i = 0; i < 6; i++) {
      const a = rand(0, TWO_PI);
      const d = rand(90, Math.min(W, H) * 0.42);
      const x = nest.x + Math.cos(a) * d;
      const y = nest.y + Math.sin(a) * d;
      if (x > 40 && y > 40 && x < W - 40 && y < H - 40) placeObstacle(x, y);
    }

    syncAntCount();
  }

  function evaporate() {
    const foodDecay = 0.992;
    const homeDecay = 0.988;
    for (let i = 0; i < foodTrail.length; i++) {
      foodTrail[i] *= foodDecay;
      homeTrail[i] *= homeDecay;
      if (foodTrail[i] < 0.05) foodTrail[i] = 0;
      if (homeTrail[i] < 0.05) homeTrail[i] = 0;
    }
  }

  function nearestFood(ax, ay, maxDist) {
    let best = null;
    let bestD = maxDist * maxDist;
    for (const f of foods) {
      if (f.amount <= 0) continue;
      const d = dist2(ax, ay, f.x, f.y);
      if (d < bestD) {
        bestD = d;
        best = f;
      }
    }
    return best;
  }

  function stepAnt(ant, dt) {
    ant.age += dt;
    ant.wobble += dt * 0.15;
    const senseDist = 14;
    const senseAngle = 0.55;
    let turn = Math.sin(ant.wobble * 2.1) * 0.08;

    if (ant.state === "seek") {
      // Follow food pheromone, else wander
      const sense = sampleTrail(foodTrail, ant.x, ant.y, ant.angle, senseAngle, senseDist);
      if (sense.strength > 2) {
        ant.angle = sense.angle;
      } else {
        ant.angle += rand(-0.35, 0.35) + turn;
      }

      // Direct attraction when close to food
      const food = nearestFood(ant.x, ant.y, 55);
      if (food) {
        const dx = food.x - ant.x;
        const dy = food.y - ant.y;
        const d = Math.hypot(dx, dy);
        if (d < food.r + 3) {
          food.amount -= 1;
          food.r = 6 + Math.sqrt(Math.max(0, food.amount)) * 0.9;
          ant.state = "carry";
          ant.angle += Math.PI + rand(-0.3, 0.3);
        } else if (d < 55) {
          ant.angle = Math.atan2(dy, dx) + rand(-0.15, 0.15);
        }
      }

      // Weak home trail while seeking helps leave nest area
      deposit(homeTrail, ant.x, ant.y, 0.35, 1.1);
    } else {
      // Carry food home — follow home pheromone / go to nest
      const sense = sampleTrail(homeTrail, ant.x, ant.y, ant.angle, senseAngle, senseDist);
      const toNest = Math.atan2(nest.y - ant.y, nest.x - ant.x);
      const nd = Math.hypot(nest.x - ant.x, nest.y - ant.y);

      if (nd < nest.r - 4) {
        nest.stored += 1;
        ant.state = "seek";
        ant.angle += Math.PI + rand(-0.5, 0.5);
      } else if (sense.strength > 1.5 && nd > nest.r + 10) {
        // Blend pheromone direction with nest bearing
        const blend = 0.55;
        let da = sense.angle - toNest;
        while (da > Math.PI) da -= TWO_PI;
        while (da < -Math.PI) da += TWO_PI;
        ant.angle = toNest + da * blend;
      } else {
        ant.angle = toNest + rand(-0.2, 0.2) + turn * 0.5;
      }

      deposit(foodTrail, ant.x, ant.y, 1.8, 1.4);
    }

    // Move with collision bounce
    let spd = ant.speed * (ant.state === "carry" ? 0.9 : 1) * dt;
    let nx = ant.x + Math.cos(ant.angle) * spd;
    let ny = ant.y + Math.sin(ant.angle) * spd;

    if (isBlocked(nx, ny)) {
      // Try slide along
      const tryA = [0.6, -0.6, 1.2, -1.2, Math.PI];
      let moved = false;
      for (const da of tryA) {
        const a2 = ant.angle + da;
        const tx = ant.x + Math.cos(a2) * spd;
        const ty = ant.y + Math.sin(a2) * spd;
        if (!isBlocked(tx, ty)) {
          ant.angle = a2;
          nx = tx; ny = ty;
          moved = true;
          break;
        }
      }
      if (!moved) {
        ant.angle += rand(1.5, 2.5) * (Math.random() < 0.5 ? 1 : -1);
        nx = ant.x;
        ny = ant.y;
      }
    }

    ant.x = clamp(nx, 2, W - 2);
    ant.y = clamp(ny, 2, H - 2);
  }

  function update(dt) {
    const steps = Math.max(1, Math.round(speed));
    const sub = dt * (speed / steps);
    for (let s = 0; s < steps; s++) {
      tick++;
      for (const ant of ants) stepAnt(ant, sub);
      if (tick % 2 === 0) evaporate();
    }
    // Remove empty food
    foods = foods.filter(f => f.amount > 0.5);
    syncAntCount();
  }

  function drawGround() {
    // Warm dirt base
    const g = ctx.createRadialGradient(nest.x, nest.y, 20, nest.x, nest.y, Math.max(W, H) * 0.7);
    g.addColorStop(0, "#1c1510");
    g.addColorStop(0.45, "#14100c");
    g.addColorStop(1, "#0a0806");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Subtle grain
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 80; i++) {
      const x = ((i * 97) % W);
      const y = ((i * 53 + tick * 0.01) % H);
      ctx.fillStyle = i % 2 ? "#c9a06a" : "#000";
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawTrails() {
    // Draw pheromone as soft cells
    const img = ctx.createImageData(cols, rows);
    const data = img.data;
    for (let i = 0; i < cols * rows; i++) {
      const f = foodTrail[i];
      const h = homeTrail[i];
      const o = i * 4;
      if (f < 0.8 && h < 0.8) {
        data[o + 3] = 0;
        continue;
      }
      // Food trail: green, home: amber — blend
      const fr = Math.min(1, f / 40);
      const hr = Math.min(1, h / 40);
      data[o] = Math.floor(90 * hr + 40 * fr);
      data[o + 1] = Math.floor(70 * hr + 140 * fr);
      data[o + 2] = Math.floor(40 * hr + 50 * fr);
      data[o + 3] = Math.floor(Math.min(160, (fr + hr) * 140));
    }

    // Scale cell image onto canvas via temporary canvas
    const tmp = drawTrails._tmp || (drawTrails._tmp = document.createElement("canvas"));
    if (tmp.width !== cols || tmp.height !== rows) {
      tmp.width = cols;
      tmp.height = rows;
    }
    const tctx = tmp.getContext("2d");
    tctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(tmp, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function drawObstacles() {
    for (const o of obstacles) {
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, o.r * 1.1, o.r * 0.85, 0.3, 0, TWO_PI);
      const rg = ctx.createRadialGradient(o.x - 3, o.y - 4, 2, o.x, o.y, o.r);
      rg.addColorStop(0, "#5a4a3a");
      rg.addColorStop(0.7, "#3a2e24");
      rg.addColorStop(1, "#1e1812");
      ctx.fillStyle = rg;
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawNest() {
    // Mound rings
    for (let i = 3; i >= 0; i--) {
      const rr = nest.r * (0.55 + i * 0.22);
      ctx.beginPath();
      ctx.ellipse(nest.x, nest.y + 2, rr * 1.15, rr * 0.78, 0, 0, TWO_PI);
      ctx.fillStyle = `rgba(${40 + i * 18}, ${28 + i * 10}, ${16 + i * 6}, ${0.35 + i * 0.12})`;
      ctx.fill();
    }
    // Entrance
    ctx.beginPath();
    ctx.ellipse(nest.x, nest.y + 1, nest.r * 0.38, nest.r * 0.26, 0, 0, TWO_PI);
    ctx.fillStyle = "#060504";
    ctx.fill();
    // Soft glow of stored food
    const glow = Math.min(1, nest.stored / 200);
    if (glow > 0) {
      ctx.beginPath();
      ctx.arc(nest.x, nest.y, nest.r * 0.7, 0, TWO_PI);
      ctx.fillStyle = `rgba(232, 165, 75, ${0.06 + glow * 0.12})`;
      ctx.fill();
    }
  }

  function drawFood() {
    for (const f of foods) {
      const pulses = 0.92 + Math.sin(tick * 0.05 + f.x * 0.01) * 0.08;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * pulses, 0, TWO_PI);
      const rg = ctx.createRadialGradient(f.x - 2, f.y - 2, 1, f.x, f.y, f.r);
      rg.addColorStop(0, "#b8f0a0");
      rg.addColorStop(0.55, "#6bbf55");
      rg.addColorStop(1, "#2d6a28");
      ctx.fillStyle = rg;
      ctx.fill();
      // crumbs
      ctx.fillStyle = "rgba(180, 240, 140, 0.5)";
      for (let i = 0; i < 3; i++) {
        const a = i * 2.1 + f.x;
        ctx.beginPath();
        ctx.arc(
          f.x + Math.cos(a) * f.r * 0.7,
          f.y + Math.sin(a) * f.r * 0.7,
          1.5, 0, TWO_PI
        );
        ctx.fill();
      }
    }
  }

  function drawAnts() {
    for (const ant of ants) {
      const c = Math.cos(ant.angle);
      const s = Math.sin(ant.angle);
      const len = 4.2;
      const wid = 1.7;

      ctx.save();
      ctx.translate(ant.x, ant.y);
      ctx.rotate(ant.angle);

      // Body segments
      ctx.fillStyle = ant.state === "carry" ? "#4a3424" : "#2e2218";
      ctx.beginPath();
      ctx.ellipse(-2.2, 0, 2.1, 1.4, 0, 0, TWO_PI); // abdomen
      ctx.ellipse(0.2, 0, 1.5, 1.15, 0, 0, TWO_PI); // thorax
      ctx.ellipse(2.0, 0, 1.2, 1.0, 0, 0, TWO_PI); // head
      ctx.fill();

      // Food crumb
      if (ant.state === "carry") {
        ctx.beginPath();
        ctx.arc(3.2, 0, 1.6, 0, TWO_PI);
        ctx.fillStyle = "#7ecf6a";
        ctx.fill();
      }

      // Antennae hint
      ctx.strokeStyle = "rgba(90, 70, 50, 0.7)";
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(2.6, -0.4);
      ctx.lineTo(4.2, -1.8);
      ctx.moveTo(2.6, 0.4);
      ctx.lineTo(4.2, 1.8);
      ctx.stroke();

      ctx.restore();
    }
  }

  function drawUIOverlay() {
    // Soft vignette
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,0,0.45)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    drawGround();
    drawTrails();
    drawObstacles();
    drawNest();
    drawFood();
    drawAnts();
    drawUIOverlay();
  }

  function updateStats() {
    let foraging = 0, carrying = 0;
    for (const a of ants) {
      if (a.state === "carry") carrying++;
      else foraging++;
    }
    el.ants.textContent = String(ants.length);
    el.food.textContent = String(Math.floor(nest.stored));
    el.foraging.textContent = String(foraging);
    el.carrying.textContent = String(carrying);
  }

  let last = performance.now();
  let acc = 0;
  const FIXED = 1000 / 60;

  function frame(now) {
    const raw = Math.min(50, now - last);
    last = now;
    if (running) {
      acc += raw;
      while (acc >= FIXED) {
        update(1);
        acc -= FIXED;
      }
    }
    render();
    if ((tick & 7) === 0) updateStats();
    requestAnimationFrame(frame);
  }

  // Events
  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * W,
      y: ((e.clientY - r.top) / r.height) * H,
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    const p = canvasPos(e);
    if (tool === "food") placeFood(p.x, p.y, rand(70, 120));
    else placeObstacle(p.x, p.y);
    el.hint.classList.add("fade");
  });

  el.pause.addEventListener("click", () => {
    running = !running;
    el.pause.textContent = running ? "Pause" : "Resume";
  });

  el.reset.addEventListener("click", () => {
    seedWorld();
    el.hint.classList.remove("fade");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => el.hint.classList.add("fade"), 8000);
  });

  el.clearFood.addEventListener("click", () => {
    foods = [];
    foodTrail.fill(0);
  });

  el.speed.addEventListener("input", () => {
    speed = parseFloat(el.speed.value);
    el.speedVal.textContent = speed + "×";
  });

  el.antsSlider.addEventListener("input", () => {
    targetAntCount = parseInt(el.antsSlider.value, 10);
    el.antsVal.textContent = String(targetAntCount);
    syncAntCount();
  });

  function setTool(name) {
    tool = name;
    el.toolFood.classList.toggle("active", name === "food");
    el.toolObstacle.classList.toggle("active", name === "obstacle");
  }
  el.toolFood.addEventListener("click", () => setTool("food"));
  el.toolObstacle.addEventListener("click", () => setTool("obstacle"));

  window.addEventListener("resize", () => {
    // Rebuild block map from obstacles after resize
    const savedFoods = foods.map(f => ({ ...f }));
    const savedObs = obstacles.map(o => ({ ...o }));
    const savedAnts = ants.map(a => ({ ...a }));
    const stored = nest.stored;
    resize();
    foods = [];
    obstacles = [];
    blocked.fill(0);
    for (const o of savedObs) {
      if (o.x < W && o.y < H) {
        obstacles.push(o);
        stampBlock(o.x, o.y, o.r);
      }
    }
    foods = savedFoods.filter(f => f.x < W && f.y < H);
    ants = savedAnts.map(a => {
      a.x = clamp(a.x, 2, W - 2);
      a.y = clamp(a.y, 2, H - 2);
      return a;
    });
    nest.stored = stored;
  });

  // Boot
  resize();
  seedWorld();
  updateStats();
  hintTimer = setTimeout(() => el.hint.classList.add("fade"), 8000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
