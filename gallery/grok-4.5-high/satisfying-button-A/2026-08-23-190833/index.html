<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satisfying Button</title>
  <style>
    :root {
      --bg-0: #0b1020;
      --bg-1: #121a33;
      --ink: #f4f7ff;
      --muted: #a9b4d0;
      --accent: #7c5cff;
      --accent-2: #36d6ff;
      --accent-3: #ff6bcb;
      --glow: rgba(124, 92, 255, 0.55);
      --shadow: rgba(4, 8, 20, 0.55);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(124, 92, 255, 0.22), transparent 60%),
        radial-gradient(900px 500px at 80% 100%, rgba(54, 214, 255, 0.12), transparent 55%),
        radial-gradient(700px 500px at 10% 90%, rgba(255, 107, 203, 0.1), transparent 50%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1));
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .stage {
      position: relative;
      width: min(92vw, 420px);
      text-align: center;
      padding: 2rem 1rem 2.5rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.85rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 12px var(--glow);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .sub {
      margin: 0 0 2.25rem;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .button-wrap {
      position: relative;
      display: inline-grid;
      place-items: center;
      isolation: isolate;
    }

    .aura {
      position: absolute;
      inset: -28%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(124, 92, 255, 0.35), transparent 62%),
        radial-gradient(circle at 30% 70%, rgba(54, 214, 255, 0.2), transparent 55%);
      filter: blur(18px);
      opacity: 0.75;
      transform: scale(0.92);
      transition: opacity 0.45s var(--ease-out), transform 0.55s var(--ease-out);
      pointer-events: none;
      z-index: -1;
    }

    .button-wrap:hover .aura,
    .button-wrap:focus-within .aura {
      opacity: 1;
      transform: scale(1);
    }

    .satisfying {
      --press: 0;
      position: relative;
      appearance: none;
      border: 0;
      cursor: pointer;
      color: white;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      padding: 1.05rem 2.1rem 1.15rem;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 42%),
        linear-gradient(135deg, #8f74ff 0%, var(--accent) 42%, #5a3dff 100%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35) inset,
        0 -2px 0 rgba(40, 10, 120, 0.35) inset,
        0 14px 28px var(--shadow),
        0 8px 18px rgba(124, 92, 255, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      transform:
        translateY(calc(var(--press) * 3px))
        scale(calc(1 - var(--press) * 0.045));
      transition:
        transform 0.18s var(--ease-spring),
        box-shadow 0.18s var(--ease-out),
        filter 0.18s var(--ease-out);
      outline: none;
      min-width: 11.5rem;
      overflow: hidden;
      will-change: transform;
    }

    .satisfying::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        120deg,
        transparent 20%,
        rgba(255, 255, 255, 0.35) 45%,
        transparent 70%
      );
      transform: translateX(-130%) skewX(-18deg);
      transition: transform 0.7s var(--ease-out);
      pointer-events: none;
    }

    .button-wrap:hover .satisfying::before {
      transform: translateX(130%) skewX(-18deg);
    }

    .satisfying:hover {
      filter: brightness(1.05);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 -2px 0 rgba(40, 10, 120, 0.35) inset,
        0 18px 34px var(--shadow),
        0 10px 24px rgba(124, 92, 255, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .satisfying:focus-visible {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 -2px 0 rgba(40, 10, 120, 0.35) inset,
        0 14px 28px var(--shadow),
        0 8px 18px rgba(124, 92, 255, 0.35),
        0 0 0 3px rgba(54, 214, 255, 0.35),
        0 0 0 6px rgba(124, 92, 255, 0.2);
    }

    .satisfying.is-pressed,
    .satisfying:active {
      --press: 1;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 -1px 0 rgba(40, 10, 120, 0.45) inset,
        0 6px 12px var(--shadow),
        0 4px 10px rgba(124, 92, 255, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .satisfying.is-pop {
      animation: pop 0.42s var(--ease-spring);
    }

    @keyframes pop {
      0% { transform: translateY(3px) scale(0.955); }
      55% { transform: translateY(-2px) scale(1.045); }
      100% { transform: translateY(0) scale(1); }
    }

    .label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .label svg {
      width: 1.05rem;
      height: 1.05rem;
      flex: none;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55), transparent 70%);
      transform: scale(0);
      opacity: 0.7;
      pointer-events: none;
      animation: ripple 0.65s var(--ease-out) forwards;
    }

    @keyframes ripple {
      to {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    .ring {
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    .ring.flash {
      animation: ring-flash 0.55s var(--ease-out) forwards;
    }

    @keyframes ring-flash {
      0% {
        opacity: 0.8;
        transform: scale(0.92);
      }
      100% {
        opacity: 0;
        transform: scale(1.18);
      }
    }

    canvas#fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .meter {
      margin: 1.75rem auto 0;
      width: min(100%, 260px);
      display: grid;
      gap: 0.45rem;
      justify-items: center;
    }

    .meter-label {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .meter-label strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .track {
      width: 100%;
      height: 0.45rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
      box-shadow: 0 0 16px rgba(124, 92, 255, 0.45);
      transition: width 0.35s var(--ease-out);
    }

    .hint {
      margin-top: 1.35rem;
      color: rgba(169, 180, 208, 0.85);
      font-size: 0.8rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .satisfying,
      .aura,
      .satisfying::before,
      .fill {
        transition: none !important;
      }

      .satisfying.is-pop,
      .ripple,
      .ring.flash {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="eyebrow">Press me</p>
    <h1>A satisfying button</h1>
    <p class="sub">Soft press, bright pop, tiny fireworks. Keep clicking.</p>

    <div class="button-wrap">
      <div class="aura" aria-hidden="true"></div>
      <button class="satisfying" id="btn" type="button" aria-describedby="hint">
        <span class="label">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3l1.6 5.2L19 10l-5.4 1.8L12 17l-1.6-5.2L5 10l5.4-1.8L12 3z" fill="currentColor" opacity="0.95"/>
            <path d="M18.5 14.2l.7 2.2 2.3.8-2.3.8-.7 2.2-.7-2.2-2.3-.8 2.3-.8.7-2.2z" fill="currentColor" opacity="0.7"/>
          </svg>
          Click for joy
        </span>
      </button>
      <span class="ring" id="ring" aria-hidden="true"></span>
    </div>

    <div class="meter" aria-live="polite">
      <div class="meter-label">Satisfaction: <strong id="count">0</strong></div>
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
    </div>
    <p class="hint" id="hint">Space or Enter also works when focused.</p>
  </main>

  <script>
    (() => {
      const btn = document.getElementById("btn");
      const ring = document.getElementById("ring");
      const countEl = document.getElementById("count");
      const fill = document.getElementById("fill");
      const canvas = document.getElementById("fx");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let clicks = 0;
      let particles = [];
      let raf = 0;
      let audioCtx = null;

      const labels = [
        "Click for joy",
        "Again!",
        "Nice.",
        "So good",
        "One more",
        "Keep going",
        "Delightful",
        "Chef's kiss",
        "Peak button",
        "Unreasonably fun"
      ];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playPop(intensity = 1) {
        const ac = ensureAudio();
        if (!ac) return;

        const now = ac.currentTime;
        const t = Math.max(0.6, Math.min(intensity, 1.8));

        const osc = ac.createOscillator();
        const gain = ac.createGain();
        const filter = ac.createBiquadFilter();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(220 * t, now);
        osc.frequency.exponentialRampToValueAtTime(880 * t, now + 0.04);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.18);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(2400, now);
        filter.frequency.exponentialRampToValueAtTime(900, now + 0.16);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);

        osc.start(now);
        osc.stop(now + 0.22);

        // Soft click layer
        const noiseDur = 0.08;
        const buffer = ac.createBuffer(1, ac.sampleRate * noiseDur, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;
        const nGain = ac.createGain();
        const nFilter = ac.createBiquadFilter();
        nFilter.type = "highpass";
        nFilter.frequency.value = 900;
        nGain.gain.setValueAtTime(0.05, now);
        nGain.gain.exponentialRampToValueAtTime(0.0001, now + noiseDur);
        noise.connect(nFilter);
        nFilter.connect(nGain);
        nGain.connect(ac.destination);
        noise.start(now);
      }

      function spawnRipple(e) {
        if (reduceMotion) return;
        const rect = btn.getBoundingClientRect();
        const x = (e?.clientX ?? rect.left + rect.width / 2) - rect.left;
        const y = (e?.clientY ?? rect.top + rect.height / 2) - rect.top;
        const size = Math.max(rect.width, rect.height) * 1.15;
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${x - size / 2}px`;
        ripple.style.top = `${y - size / 2}px`;
        btn.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove());
      }

      function burst(x, y, power = 1) {
        if (reduceMotion) return;
        const count = Math.floor(18 + 14 * power);
        const palette = ["#ffffff", "#7c5cff", "#36d6ff", "#ff6bcb", "#ffd166", "#9bffb0"];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
          const speed = (2.2 + Math.random() * 4.8) * (0.75 + power * 0.4);
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.2,
            life: 1,
            decay: 0.016 + Math.random() * 0.02,
            size: 2 + Math.random() * 3.5 * power,
            color: palette[(Math.random() * palette.length) | 0],
            spin: (Math.random() - 0.5) * 0.3,
            rot: Math.random() * Math.PI,
            kind: Math.random() > 0.55 ? "spark" : "dot"
          });
        }
        if (!raf) raf = requestAnimationFrame(tick);
      }

      function tick() {
        raf = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.12;
          p.vx *= 0.985;
          p.life -= p.decay;
          p.rot += p.spin;
          ctx.globalAlpha = Math.max(p.life, 0);
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          if (p.kind === "spark") {
            ctx.fillRect(-p.size * 1.4, -1, p.size * 2.8, 2);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        if (particles.length) raf = requestAnimationFrame(tick);
      }

      function updateMeter() {
        countEl.textContent = String(clicks);
        const pct = Math.min(100, clicks * 4);
        fill.style.width = `${pct}%`;
        const label = labels[Math.min(labels.length - 1, Math.floor(clicks / 3))];
        btn.querySelector(".label").lastChild.textContent = " " + label;
      }

      function celebrate(e) {
        clicks += 1;
        const power = 0.75 + Math.min(clicks, 20) * 0.03;
        const rect = btn.getBoundingClientRect();
        const x = e?.clientX ?? rect.left + rect.width / 2;
        const y = e?.clientY ?? rect.top + rect.height / 2;

        spawnRipple(e);
        burst(x, y, power);
        playPop(power);

        ring.classList.remove("flash");
        void ring.offsetWidth;
        ring.classList.add("flash");

        btn.classList.remove("is-pop");
        void btn.offsetWidth;
        btn.classList.add("is-pop");

        updateMeter();

        if (navigator.vibrate) {
          try { navigator.vibrate(clicks % 5 === 0 ? [12, 30, 12] : 10); } catch (_) {}
        }
      }

      function setPressed(on) {
        btn.classList.toggle("is-pressed", on);
      }

      btn.addEventListener("pointerdown", (e) => {
        if (e.button != null && e.button !== 0) return;
        setPressed(true);
        btn.setPointerCapture?.(e.pointerId);
      });

      btn.addEventListener("pointerup", (e) => {
        if (!btn.classList.contains("is-pressed")) return;
        setPressed(false);
        celebrate(e);
      });

      btn.addEventListener("pointercancel", () => setPressed(false));
      btn.addEventListener("pointerleave", () => {
        if (!btn.hasPointerCapture?.()) setPressed(false);
      });

      btn.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          if (!btn.classList.contains("is-pressed")) setPressed(true);
        }
      });

      btn.addEventListener("keyup", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          if (btn.classList.contains("is-pressed")) {
            setPressed(false);
            celebrate();
          }
        }
      });

      // Prevent double-firing from synthetic click after pointerup
      btn.addEventListener("click", (e) => {
        e.preventDefault();
      });

      window.addEventListener("resize", resize);
      resize();
      btn.focus();
    })();
  </script>
</body>
</html>
