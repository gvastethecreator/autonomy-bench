<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chromatic Flow</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05060a;
    --panel: rgba(12, 14, 22, 0.72);
    --panel-border: rgba(255, 255, 255, 0.1);
    --text: #f4f6fb;
    --muted: rgba(244, 246, 251, 0.62);
    --accent: #7ef0ff;
    --accent-2: #ff6ad5;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  body {
    position: relative;
    min-height: 100dvh;
  }

  canvas#fluid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    background: radial-gradient(120% 90% at 50% 20%, #121528 0%, #07080f 55%, #03040a 100%);
  }

  .vignette {
    pointer-events: none;
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.42) 100%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.22), transparent 18%, transparent 78%, rgba(0, 0, 0, 0.35));
    z-index: 1;
  }

  .hud {
    position: fixed;
    z-index: 2;
    inset: auto auto calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));
    width: min(340px, calc(100vw - 40px));
    padding: 16px 16px 14px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: var(--shadow);
  }

  .brand {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: 0.02em;
  }

  .brand p {
    margin: 4px 0 0;
    font-size: 0.78rem;
    line-height: 1.35;
    color: var(--muted);
  }

  .badge {
    flex: none;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #041018;
    background: linear-gradient(120deg, var(--accent), #b6ff8a 55%, var(--accent-2));
    border-radius: 999px;
    padding: 6px 10px;
    font-weight: 700;
  }

  .controls {
    display: grid;
    gap: 10px;
  }

  .row {
    display: grid;
    grid-template-columns: 78px 1fr 42px;
    align-items: center;
    gap: 8px;
  }

  label {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .value {
    font-variant-numeric: tabular-nums;
    font-size: 0.75rem;
    color: var(--text);
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(126, 240, 255, 0.2), rgba(255, 106, 213, 0.35));
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(126, 240, 255, 0.35);
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(126, 240, 255, 0.35);
    cursor: pointer;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  button {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
  }

  button:active { transform: translateY(1px); }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.active {
    background: linear-gradient(120deg, rgba(126, 240, 255, 0.28), rgba(255, 106, 213, 0.28));
    border-color: rgba(126, 240, 255, 0.45);
  }

  .hint {
    margin-top: 12px;
    font-size: 0.74rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .topbar {
    position: fixed;
    z-index: 2;
    top: calc(16px + var(--safe-top));
    right: calc(16px + var(--safe-right));
    display: flex;
    gap: 8px;
  }

  .stat {
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 999px;
    padding: 8px 12px;
    box-shadow: var(--shadow);
  }

  .stat strong {
    color: var(--text);
    font-weight: 650;
    margin-left: 6px;
  }

  @media (max-width: 640px) {
    .hud {
      inset: auto calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
      width: auto;
      padding: 14px;
    }

    .brand h1 { font-size: 0.98rem; }
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="fluid" aria-label="Interactive colorful fluid simulation canvas"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="topbar" aria-live="polite">
    <div class="stat">FPS<strong id="fps">—</strong></div>
    <div class="stat">Palette<strong id="paletteName">Aurora</strong></div>
  </div>

  <aside class="hud" aria-label="Fluid controls">
    <div class="brand">
      <div>
        <h1>Chromatic Flow</h1>
        <p>Paint luminous dye into a living fluid field.</p>
      </div>
      <span class="badge">Live</span>
    </div>

    <div class="controls">
      <div class="row">
        <label for="viscosity">Viscosity</label>
        <input id="viscosity" type="range" min="0" max="100" value="35" />
        <span class="value" id="viscosityVal">0.35</span>
      </div>
      <div class="row">
        <label for="vorticity">Swirl</label>
        <input id="vorticity" type="range" min="0" max="100" value="55" />
        <span class="value" id="vorticityVal">2.2</span>
      </div>
      <div class="row">
        <label for="force">Force</label>
        <input id="force" type="range" min="10" max="100" value="55" />
        <span class="value" id="forceVal">0.55</span>
      </div>
      <div class="row">
        <label for="dissipation">Fade</label>
        <input id="dissipation" type="range" min="0" max="100" value="18" />
        <span class="value" id="dissipationVal">0.018</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="btnPalette" title="Cycle color palette">Palette</button>
      <button type="button" id="btnBloom" class="active" aria-pressed="true" title="Toggle bloom glow">Bloom</button>
      <button type="button" id="btnAuto" class="active" aria-pressed="true" title="Toggle ambient motion">Ambient</button>
      <button type="button" id="btnClear" title="Clear the fluid">Clear</button>
    </div>

    <p class="hint">Drag to stir color. Tap or click to burst dye. Ambient ribbons keep the field alive when idle.</p>
  </aside>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("fluid");
  const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: "high-performance"
  });

  if (!gl) {
    document.body.innerHTML = "<p style='padding:2rem;font-family:sans-serif;color:#fff'>WebGL is required for Chromatic Flow.</p>";
    return;
  }

  const ext = gl.getExtension("OES_texture_half_float") || gl.getExtension("OES_texture_half_float_linear");
  const halfFloat = gl.getExtension("OES_texture_half_float");
  const supportLinear = !!gl.getExtension("OES_texture_half_float_linear");
  const FLOAT = halfFloat ? halfFloat.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
  const filter = (halfFloat && supportLinear) ? gl.LINEAR : gl.NEAREST;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || "Shader compile failed");
    }
    return shader;
  }

  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p) || "Program link failed");
    }
    const uniforms = {};
    const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(p, i);
      uniforms[info.name] = gl.getUniformLocation(p, info.name);
    }
    return { program: p, uniforms };
  }

  const baseVS = `
    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform vec2 texelSize;
    void main () {
      vUv = aPosition * 0.5 + 0.5;
      vL = vUv - vec2(texelSize.x, 0.0);
      vR = vUv + vec2(texelSize.x, 0.0);
      vT = vUv + vec2(0.0, texelSize.y);
      vB = vUv - vec2(0.0, texelSize.y);
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `;

  const clearFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform float value;
    void main () {
      gl_FragColor = vec4(value);
    }
  `;

  const displayFS = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTexture;
    uniform float bloom;
    void main () {
      vec3 c = texture2D(uTexture, vUv).rgb;
      float lum = max(c.r, max(c.g, c.b));
      vec3 glow = c * smoothstep(0.35, 1.1, lum) * bloom;
      c = c + glow * 0.55;
      c = c / (1.0 + c * 0.35);
      float vignette = smoothstep(1.25, 0.25, length(vUv - 0.5));
      c *= 0.82 + 0.18 * vignette;
      gl_FragColor = vec4(c, 1.0);
    }
  `;

  const splatFS = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;
    void main () {
      vec2 p = vUv - point.xy;
      p.x *= aspectRatio;
      vec3 splat = exp(-dot(p, p) / radius) * color;
      vec3 base = texture2D(uTarget, vUv).xyz;
      gl_FragColor = vec4(base + splat, 1.0);
    }
  `;

  const advectionFS = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform float dt;
    uniform float dissipation;
    void main () {
      vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
      gl_FragColor = dissipation * texture2D(uSource, coord);
    }
  `;

  const divergenceFS = `
    precision mediump float;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uVelocity, vL).x;
      float R = texture2D(uVelocity, vR).x;
      float T = texture2D(uVelocity, vT).y;
      float B = texture2D(uVelocity, vB).y;
      vec2 C = texture2D(uVelocity, vUv).xy;
      if (vL.x < 0.0) { L = -C.x; }
      if (vR.x > 1.0) { R = -C.x; }
      if (vT.y > 1.0) { T = -C.y; }
      if (vB.y < 0.0) { B = -C.y; }
      float div = 0.5 * (R - L + T - B);
      gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }
  `;

  const curlFS = `
    precision mediump float;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uVelocity, vL).y;
      float R = texture2D(uVelocity, vR).y;
      float T = texture2D(uVelocity, vT).x;
      float B = texture2D(uVelocity, vB).x;
      float vorticity = R - L - T + B;
      gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }
  `;

  const vorticityFS = `
    precision highp float;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;
    void main () {
      float L = texture2D(uCurl, vL).x;
      float R = texture2D(uCurl, vR).x;
      float T = texture2D(uCurl, vT).x;
      float B = texture2D(uCurl, vB).x;
      float C = texture2D(uCurl, vUv).x;
      vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
      force /= length(force) + 0.0001;
      force *= curl * C;
      force.y *= -1.0;
      vec2 vel = texture2D(uVelocity, vUv).xy;
      gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
    }
  `;

  const pressureFS = `
    precision mediump float;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uDivergence;
    void main () {
      float L = texture2D(uPressure, vL).x;
      float R = texture2D(uPressure, vR).x;
      float T = texture2D(uPressure, vT).x;
      float B = texture2D(uPressure, vB).x;
      float C = texture2D(uPressure, vUv).x;
      float divergence = texture2D(uDivergence, vUv).x;
      float pressure = (L + R + B + T - divergence) * 0.25;
      gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }
  `;

  const gradientSubtractFS = `
    precision mediump float;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uVelocity;
    void main () {
      float L = texture2D(uPressure, vL).x;
      float R = texture2D(uPressure, vR).x;
      float T = texture2D(uPressure, vT).x;
      float B = texture2D(uPressure, vB).x;
      vec2 velocity = texture2D(uVelocity, vUv).xy;
      velocity.xy -= vec2(R - L, T - B);
      gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
  `;

  const bloomBlurFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uTexture;
    uniform vec2 direction;
    void main () {
      vec3 c = texture2D(uTexture, vUv).rgb * 0.294117;
      c += texture2D(uTexture, vUv + direction).rgb * 0.352941;
      c += texture2D(uTexture, vUv - direction).rgb * 0.352941;
      gl_FragColor = vec4(c, 1.0);
    }
  `;

  const bloomCompositeFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uBase;
    uniform sampler2D uBloom;
    uniform float intensity;
    void main () {
      vec3 base = texture2D(uBase, vUv).rgb;
      vec3 bloom = texture2D(uBloom, vUv).rgb;
      vec3 color = base + bloom * intensity;
      color = color / (1.0 + color * 0.4);
      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const blit = (() => {
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    const index = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, index);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    const attr = 0;
    return (destination) => {
      if (destination == null) {
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      } else {
        gl.viewport(0, 0, destination.width, destination.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, destination.fbo);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.vertexAttribPointer(attr, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(attr);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, index);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    };
  })();

  function createFBO(w, h, format) {
    gl.activeTexture(gl.TEXTURE0);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, format, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return {
      texture,
      fbo,
      width: w,
      height: h,
      texelSizeX: 1 / w,
      texelSizeY: 1 / h,
      attach(id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      }
    };
  }

  function createDoubleFBO(w, h, format) {
    let fbo1 = createFBO(w, h, format);
    let fbo2 = createFBO(w, h, format);
    return {
      width: w,
      height: h,
      texelSizeX: 1 / w,
      texelSizeY: 1 / h,
      get read() { return fbo1; },
      set read(v) { fbo1 = v; },
      get write() { return fbo2; },
      set write(v) { fbo2 = v; },
      swap() {
        const temp = fbo1;
        fbo1 = fbo2;
        fbo2 = temp;
      }
    };
  }

  const programs = {
    clear: program(baseVS, clearFS),
    display: program(baseVS, displayFS),
    splat: program(baseVS, splatFS),
    advection: program(baseVS, advectionFS),
    divergence: program(baseVS, divergenceFS),
    curl: program(baseVS, curlFS),
    vorticity: program(baseVS, vorticityFS),
    pressure: program(baseVS, pressureFS),
    gradientSubtract: program(baseVS, gradientSubtractFS),
    bloomBlur: program(baseVS, bloomBlurFS),
    bloomComposite: program(baseVS, bloomCompositeFS)
  };

  let dye, velocity, divergence, curl, pressure, bloomTarget;
  let simWidth = 0;
  let simHeight = 0;
  let dyeWidth = 0;
  let dyeHeight = 0;

  const config = {
    simResolution: 128,
    dyeResolution: 512,
    densityDissipation: 0.982,
    velocityDissipation: 0.98,
    pressureIterations: 18,
    curl: 22,
    splatRadius: 0.22,
    splatForce: 5500,
    bloom: true,
    bloomIntensity: 0.55,
    ambient: true
  };

  const palettes = [
    {
      name: "Aurora",
      colors: [
        [0.15, 0.95, 0.85],
        [0.45, 0.55, 1.0],
        [0.95, 0.35, 0.85],
        [0.35, 1.0, 0.55]
      ]
    },
    {
      name: "Ember",
      colors: [
        [1.0, 0.35, 0.12],
        [1.0, 0.72, 0.18],
        [0.95, 0.2, 0.45],
        [1.0, 0.9, 0.35]
      ]
    },
    {
      name: "Nebula",
      colors: [
        [0.55, 0.25, 1.0],
        [0.2, 0.65, 1.0],
        [1.0, 0.35, 0.75],
        [0.4, 0.95, 1.0]
      ]
    },
    {
      name: "Citrus",
      colors: [
        [1.0, 0.85, 0.15],
        [0.35, 1.0, 0.45],
        [1.0, 0.45, 0.15],
        [0.55, 1.0, 0.85]
      ]
    }
  ];
  let paletteIndex = 0;

  function getResolution(resolution) {
    let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspect < 1) aspect = 1 / aspect;
    const min = Math.round(resolution);
    const max = Math.round(resolution * aspect);
    if (gl.drawingBufferWidth > gl.drawingBufferHeight) {
      return { width: max, height: min };
    }
    return { width: min, height: max };
  }

  function initFramebuffers() {
    const simRes = getResolution(config.simResolution);
    const dyeRes = getResolution(config.dyeResolution);
    const texType = FLOAT;

    simWidth = simRes.width;
    simHeight = simRes.height;
    dyeWidth = dyeRes.width;
    dyeHeight = dyeRes.height;

    dye = createDoubleFBO(dyeWidth, dyeHeight, texType);
    velocity = createDoubleFBO(simWidth, simHeight, texType);
    divergence = createFBO(simWidth, simHeight, texType);
    curl = createFBO(simWidth, simHeight, texType);
    pressure = createDoubleFBO(simWidth, simHeight, texType);
    bloomTarget = createDoubleFBO(Math.max(64, dyeWidth >> 2), Math.max(64, dyeHeight >> 2), texType);
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      initFramebuffers();
      return true;
    }
    return false;
  }

  function setTexture(programUniforms, name, id) {
    gl.uniform1i(programUniforms[name], id);
  }

  function splat(x, y, dx, dy, color) {
    gl.useProgram(programs.splat.program);
    gl.uniform1i(programs.splat.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(programs.splat.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(programs.splat.uniforms.point, x, y);
    gl.uniform3f(programs.splat.uniforms.color, dx, dy, 0);
    gl.uniform1f(programs.splat.uniforms.radius, correctRadius(config.splatRadius / 100));
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(programs.splat.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(programs.splat.uniforms.color, color[0] * 0.35, color[1] * 0.35, color[2] * 0.35);
    blit(dye.write);
    dye.swap();
  }

  function correctRadius(radius) {
    const aspect = canvas.width / canvas.height;
    if (aspect > 1) radius *= aspect;
    return radius;
  }

  function multipleSplats(amount) {
    for (let i = 0; i < amount; i++) {
      const color = randomColor();
      const x = Math.random();
      const y = Math.random();
      const dx = 1000 * (Math.random() - 0.5);
      const dy = 1000 * (Math.random() - 0.5);
      splat(x, y, dx, dy, color);
    }
  }

  function randomColor() {
    const colors = palettes[paletteIndex].colors;
    const c = colors[(Math.random() * colors.length) | 0];
    const boost = 0.75 + Math.random() * 0.55;
    return [c[0] * boost, c[1] * boost, c[2] * boost];
  }

  function step(dt) {
    gl.disable(gl.BLEND);

    gl.useProgram(programs.curl.program);
    gl.uniform2f(programs.curl.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.curl.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl);

    gl.useProgram(programs.vorticity.program);
    gl.uniform2f(programs.vorticity.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.vorticity.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.vorticity.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(programs.vorticity.uniforms.curl, config.curl);
    gl.uniform1f(programs.vorticity.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    gl.useProgram(programs.divergence.program);
    gl.uniform2f(programs.divergence.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.divergence.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    gl.useProgram(programs.clear.program);
    gl.uniform1i(programs.clear.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(programs.clear.uniforms.value, 0.8);
    blit(pressure.write);
    pressure.swap();

    gl.useProgram(programs.pressure.program);
    gl.uniform2f(programs.pressure.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.pressure.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < config.pressureIterations; i++) {
      gl.uniform1i(programs.pressure.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write);
      pressure.swap();
    }

    gl.useProgram(programs.gradientSubtract.program);
    gl.uniform2f(programs.gradientSubtract.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.gradientSubtract.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(programs.gradientSubtract.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write);
    velocity.swap();

    gl.useProgram(programs.advection.program);
    gl.uniform2f(programs.advection.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.advection.uniforms.uSource, velocity.read.attach(0));
    gl.uniform1f(programs.advection.uniforms.dt, dt);
    gl.uniform1f(programs.advection.uniforms.dissipation, config.velocityDissipation);
    blit(velocity.write);
    velocity.swap();

    gl.uniform2f(programs.advection.uniforms.texelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.advection.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(programs.advection.uniforms.dissipation, config.densityDissipation);
    blit(dye.write);
    dye.swap();
  }

  function render() {
    if (config.bloom) {
      gl.useProgram(programs.display.program);
      gl.uniform1i(programs.display.uniforms.uTexture, dye.read.attach(0));
      gl.uniform1f(programs.display.uniforms.bloom, 0.0);
      blit(bloomTarget.write);
      bloomTarget.swap();

      gl.useProgram(programs.bloomBlur.program);
      for (let i = 0; i < 4; i++) {
        const dx = (i % 2 === 0 ? 1.2 : 0) / bloomTarget.width;
        const dy = (i % 2 === 1 ? 1.2 : 0) / bloomTarget.height;
        gl.uniform1i(programs.bloomBlur.uniforms.uTexture, bloomTarget.read.attach(0));
        gl.uniform2f(programs.bloomBlur.uniforms.direction, dx, dy);
        blit(bloomTarget.write);
        bloomTarget.swap();
      }

      gl.useProgram(programs.bloomComposite.program);
      gl.uniform1i(programs.bloomComposite.uniforms.uBase, dye.read.attach(0));
      gl.uniform1i(programs.bloomComposite.uniforms.uBloom, bloomTarget.read.attach(1));
      gl.uniform1f(programs.bloomComposite.uniforms.intensity, config.bloomIntensity);
      blit(null);
    } else {
      gl.useProgram(programs.display.program);
      gl.uniform1i(programs.display.uniforms.uTexture, dye.read.attach(0));
      gl.uniform1f(programs.display.uniforms.bloom, 0.85);
      blit(null);
    }
  }

  const pointers = [{
    id: -1,
    down: false,
    moved: false,
    texcoordX: 0,
    texcoordY: 0,
    prevTexcoordX: 0,
    prevTexcoordY: 0,
    deltaX: 0,
    deltaY: 0,
    color: [0.8, 0.4, 1]
  }];

  function updatePointerDown(p, x, y) {
    p.down = true;
    p.moved = false;
    p.texcoordX = x / canvas.width;
    p.texcoordY = 1 - y / canvas.height;
    p.prevTexcoordX = p.texcoordX;
    p.prevTexcoordY = p.texcoordY;
    p.deltaX = 0;
    p.deltaY = 0;
    p.color = randomColor();
  }

  function updatePointerMove(p, x, y) {
    p.prevTexcoordX = p.texcoordX;
    p.prevTexcoordY = p.texcoordY;
    p.texcoordX = x / canvas.width;
    p.texcoordY = 1 - y / canvas.height;
    p.deltaX = correctDeltaX(p.texcoordX - p.prevTexcoordX);
    p.deltaY = correctDeltaY(p.texcoordY - p.prevTexcoordY);
    p.moved = Math.abs(p.deltaX) > 0 || Math.abs(p.deltaY) > 0;
  }

  function correctDeltaX(delta) {
    const aspect = canvas.width / canvas.height;
    if (aspect < 1) delta *= aspect;
    return delta;
  }

  function correctDeltaY(delta) {
    const aspect = canvas.width / canvas.height;
    if (aspect > 1) delta /= aspect;
    return delta;
  }

  function scaleByPixelRatio(input) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    return Math.floor(input * dpr);
  }

  canvas.addEventListener("mousedown", (e) => {
    const p = pointers[0];
    updatePointerDown(p, scaleByPixelRatio(e.offsetX), scaleByPixelRatio(e.offsetY));
  });

  canvas.addEventListener("mousemove", (e) => {
    const p = pointers[0];
    if (!p.down) return;
    updatePointerMove(p, scaleByPixelRatio(e.offsetX), scaleByPixelRatio(e.offsetY));
  });

  window.addEventListener("mouseup", () => {
    pointers[0].down = false;
  });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const touches = e.targetTouches;
    for (let i = 0; i < touches.length; i++) {
      if (!pointers[i]) {
        pointers[i] = {
          id: -1, down: false, moved: false,
          texcoordX: 0, texcoordY: 0, prevTexcoordX: 0, prevTexcoordY: 0,
          deltaX: 0, deltaY: 0, color: [1, 1, 1]
        };
      }
      const rect = canvas.getBoundingClientRect();
      const x = scaleByPixelRatio(touches[i].clientX - rect.left);
      const y = scaleByPixelRatio(touches[i].clientY - rect.top);
      updatePointerDown(pointers[i], x, y);
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const touches = e.targetTouches;
    for (let i = 0; i < touches.length; i++) {
      const p = pointers[i];
      if (!p) continue;
      const rect = canvas.getBoundingClientRect();
      const x = scaleByPixelRatio(touches[i].clientX - rect.left);
      const y = scaleByPixelRatio(touches[i].clientY - rect.top);
      updatePointerMove(p, x, y);
    }
  }, { passive: false });

  window.addEventListener("touchend", (e) => {
    const touches = e.changedTouches;
    for (let i = 0; i < touches.length; i++) {
      const p = pointers[i];
      if (p) p.down = false;
    }
  });

  // UI wiring
  const viscosityEl = document.getElementById("viscosity");
  const vorticityEl = document.getElementById("vorticity");
  const forceEl = document.getElementById("force");
  const dissipationEl = document.getElementById("dissipation");
  const viscosityVal = document.getElementById("viscosityVal");
  const vorticityVal = document.getElementById("vorticityVal");
  const forceVal = document.getElementById("forceVal");
  const dissipationVal = document.getElementById("dissipationVal");
  const fpsEl = document.getElementById("fps");
  const paletteNameEl = document.getElementById("paletteName");
  const btnPalette = document.getElementById("btnPalette");
  const btnBloom = document.getElementById("btnBloom");
  const btnAuto = document.getElementById("btnAuto");
  const btnClear = document.getElementById("btnClear");

  function syncLabels() {
    const vis = Number(viscosityEl.value) / 100;
    const curl = 0.5 + Number(vorticityEl.value) / 100 * 40;
    const force = Number(forceEl.value) / 100;
    const fade = Number(dissipationEl.value) / 1000;

    config.velocityDissipation = 0.96 + (1 - vis) * 0.035;
    config.densityDissipation = 1 - Math.max(0.004, fade);
    config.curl = curl;
    config.splatForce = 2500 + force * 8000;
    config.splatRadius = 0.14 + force * 0.2;

    viscosityVal.textContent = vis.toFixed(2);
    vorticityVal.textContent = curl.toFixed(1);
    forceVal.textContent = force.toFixed(2);
    dissipationVal.textContent = fade.toFixed(3);
  }

  [viscosityEl, vorticityEl, forceEl, dissipationEl].forEach((el) => {
    el.addEventListener("input", syncLabels);
  });
  syncLabels();

  btnPalette.addEventListener("click", () => {
    paletteIndex = (paletteIndex + 1) % palettes.length;
    paletteNameEl.textContent = palettes[paletteIndex].name;
    multipleSplats(4);
  });

  btnBloom.addEventListener("click", () => {
    config.bloom = !config.bloom;
    btnBloom.classList.toggle("active", config.bloom);
    btnBloom.setAttribute("aria-pressed", String(config.bloom));
  });

  btnAuto.addEventListener("click", () => {
    config.ambient = !config.ambient;
    btnAuto.classList.toggle("active", config.ambient);
    btnAuto.setAttribute("aria-pressed", String(config.ambient));
  });

  btnClear.addEventListener("click", () => {
    gl.useProgram(programs.clear.program);
    gl.uniform1f(programs.clear.uniforms.value, 0);
    gl.uniform1i(programs.clear.uniforms.uTexture, dye.read.attach(0));
    blit(dye.write);
    dye.swap();
    gl.uniform1i(programs.clear.uniforms.uTexture, velocity.read.attach(0));
    blit(velocity.write);
    velocity.swap();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "c" || e.key === "C") btnClear.click();
    if (e.key === "p" || e.key === "P") btnPalette.click();
    if (e.key === "b" || e.key === "B") btnBloom.click();
    if (e.key === "a" || e.key === "A") btnAuto.click();
  });

  let lastTime = 0;
  let frames = 0;
  let fpsTimer = 0;
  let ambientTimer = 0;
  let ambientPhase = Math.random() * Math.PI * 2;

  function ambientPulse(dt) {
    if (!config.ambient) return;
    ambientTimer += dt;
    ambientPhase += dt * 0.35;
    if (ambientTimer > 0.85) {
      ambientTimer = 0;
      const colors = palettes[paletteIndex].colors;
      for (let i = 0; i < 2; i++) {
        const t = ambientPhase + i * 2.1;
        const x = 0.5 + Math.cos(t * 0.9) * 0.28;
        const y = 0.5 + Math.sin(t * 1.15) * 0.24;
        const dx = Math.cos(t * 1.7) * 900;
        const dy = Math.sin(t * 1.3) * 900;
        const c = colors[(i + (Date.now() / 1000 | 0)) % colors.length];
        splat(x, y, dx, dy, [c[0] * 0.9, c[1] * 0.9, c[2] * 0.9]);
      }
    }
  }

  function applyInputs() {
    for (const p of pointers) {
      if (!p || !p.down || !p.moved) continue;
      splat(
        p.texcoordX,
        p.texcoordY,
        p.deltaX * config.splatForce,
        p.deltaY * config.splatForce,
        p.color
      );
      p.moved = false;
    }
  }

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;
    frames++;
    fpsTimer += dt;
    if (fpsTimer >= 0.5) {
      fpsEl.textContent = String(Math.round(frames / fpsTimer));
      frames = 0;
      fpsTimer = 0;
    }

    resizeCanvas();
    applyInputs();
    ambientPulse(dt);
    step(dt);
    render();
    requestAnimationFrame(frame);
  }

  resizeCanvas();
  multipleSplats(12);
  requestAnimationFrame((t) => {
    lastTime = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
