<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satisfying Button</title>
  <style>
    :root {
      --bg-0: #0c0e14;
      --bg-1: #12151f;
      --ink: #f4efe6;
      --ink-muted: rgba(244, 239, 230, 0.55);
      --btn-face: #f7f0e4;
      --btn-face-deep: #e8dcc8;
      --btn-rim: #fffaf2;
      --accent: #ff7a45;
      --accent-soft: #ffb088;
      --glow: rgba(255, 122, 69, 0.45);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-hi: rgba(255, 255, 255, 0.55);
      --shadow-lo: rgba(20, 12, 8, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 50% 42%, #1a2030 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(255, 122, 69, 0.08), transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .stage {
      position: relative;
      width: min(100vw, 420px);
      height: min(70vh, 420px);
      display: grid;
      place-items: center;
    }

    .ambient {
      position: absolute;
      inset: 18% 22%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow), transparent 70%);
      filter: blur(28px);
      opacity: 0.55;
      animation: breathe 4.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.92); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    .fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border-radius: 50%;
      border: 2px solid rgba(255, 176, 136, 0.7);
      opacity: 0;
      transform: scale(0.55);
      pointer-events: none;
    }

    .particle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: var(--accent-soft);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .meta {
      position: absolute;
      top: clamp(1.25rem, 4vh, 2.5rem);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      width: min(90vw, 360px);
    }

    .meta h1 {
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.65rem;
    }

    .count {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--ink);
      transition: transform 160ms var(--ease-out), color 200ms ease;
    }

    .count.pop {
      transform: scale(1.08);
      color: var(--accent-soft);
    }

    .hint {
      margin-top: 0.55rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
      letter-spacing: 0.01em;
    }

    .button-wrap {
      position: relative;
      z-index: 3;
    }

    .btn {
      --press: 0;
      position: relative;
      width: 148px;
      height: 148px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      touch-action: manipulation;
    }

    .btn:focus-visible .face {
      box-shadow:
        0 0 0 3px var(--bg-0),
        0 0 0 5px var(--accent-soft),
        inset 0 2px 3px var(--shadow-hi),
        inset 0 -10px 18px rgba(180, 130, 80, 0.18),
        0 calc(14px - (var(--press) * 12px)) calc(28px - (var(--press) * 18px)) rgba(0, 0, 0, 0.45),
        0 calc(4px - (var(--press) * 3px)) 0 var(--btn-face-deep);
    }

    .base {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: linear-gradient(180deg, #2a2430, #1a161e);
      box-shadow:
        inset 0 8px 16px rgba(0, 0, 0, 0.55),
        0 1px 0 rgba(255, 255, 255, 0.04);
      transform: translateY(10px);
      z-index: 0;
    }

    .face {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #fffdf8 0%, var(--btn-face) 42%, var(--btn-face-deep) 100%);
      box-shadow:
        inset 0 2px 3px var(--shadow-hi),
        inset 0 -10px 18px rgba(180, 130, 80, 0.18),
        0 14px 28px rgba(0, 0, 0, 0.45),
        0 4px 0 var(--btn-face-deep);
      transform: translateY(calc(var(--press) * 8px)) scale(calc(1 - var(--press) * 0.035));
      transition:
        transform 140ms var(--ease-out),
        box-shadow 140ms var(--ease-out),
        filter 140ms ease;
      z-index: 1;
      display: grid;
      place-items: center;
    }

    .btn[data-pressed="true"] .face {
      transition-duration: 70ms;
      box-shadow:
        inset 0 3px 8px rgba(120, 80, 40, 0.28),
        inset 0 -4px 10px rgba(255, 255, 255, 0.35),
        0 2px 8px rgba(0, 0, 0, 0.35),
        0 1px 0 var(--btn-face-deep);
      filter: brightness(0.97);
    }

    .btn[data-released="true"] .face {
      transition:
        transform 280ms var(--ease-spring),
        box-shadow 220ms var(--ease-out),
        filter 220ms ease;
    }

    .glyph {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, var(--accent-soft), var(--accent) 70%);
      box-shadow:
        0 6px 16px rgba(255, 122, 69, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.55);
      transform: scale(calc(1 - var(--press) * 0.08));
      transition: transform 140ms var(--ease-out);
    }

    .btn[data-released="true"] .glyph {
      transition: transform 280ms var(--ease-spring);
    }

    .milestone {
      position: absolute;
      bottom: clamp(1.25rem, 5vh, 2.75rem);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--accent-soft);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 220ms var(--ease-out),
        transform 220ms var(--ease-out);
      z-index: 2;
      text-align: center;
      white-space: nowrap;
    }

    .milestone.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .mute {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      border: 1px solid rgba(244, 239, 230, 0.12);
      background: rgba(18, 21, 31, 0.72);
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition:
        color 160ms ease,
        border-color 160ms ease,
        background 160ms ease;
    }

    .mute:hover {
      color: var(--ink);
      border-color: rgba(244, 239, 230, 0.28);
    }

    .mute:focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 2px;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn:hover:not([data-pressed="true"]) .face {
        filter: brightness(1.03);
        box-shadow:
          inset 0 2px 3px var(--shadow-hi),
          inset 0 -10px 18px rgba(180, 130, 80, 0.18),
          0 16px 32px rgba(0, 0, 0, 0.48),
          0 5px 0 var(--btn-face-deep),
          0 0 40px rgba(255, 122, 69, 0.18);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient {
        animation: none;
        opacity: 0.5;
      }

      .face,
      .glyph,
      .count,
      .milestone {
        transition-duration: 0.01ms !important;
      }

      .btn[data-released="true"] .face,
      .btn[data-released="true"] .glyph {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <button class="mute" type="button" id="muteBtn" aria-pressed="false" title="Toggle sound">Sound on</button>

  <header class="meta">
    <h1>Satisfying Button</h1>
    <div class="count" id="count" aria-live="polite">0</div>
    <p class="hint" id="hint">Press it. Again.</p>
  </header>

  <main class="stage" aria-label="Button playground">
    <div class="ambient" aria-hidden="true"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <div class="button-wrap">
      <button
        class="btn"
        id="btn"
        type="button"
        aria-label="Satisfying button"
      >
        <span class="base" aria-hidden="true"></span>
        <span class="face" aria-hidden="true">
          <span class="glyph"></span>
        </span>
      </button>
    </div>
  </main>

  <p class="milestone" id="milestone" aria-live="polite"></p>

  <script>
    (() => {
      const btn = document.getElementById("btn");
      const countEl = document.getElementById("count");
      const hintEl = document.getElementById("hint");
      const fx = document.getElementById("fx");
      const milestoneEl = document.getElementById("milestone");
      const muteBtn = document.getElementById("muteBtn");

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let presses = 0;
      let muted = false;
      let audioCtx = null;
      let milestoneTimer = null;
      let releaseTimer = null;

      const hints = [
        "Press it. Again.",
        "Nice.",
        "Keep going.",
        "That click though.",
        "One more?",
        "You're locked in.",
        "Pure dopamine.",
        "Don't stop now."
      ];

      const milestones = {
        10: "Warming up",
        25: "Getting good at this",
        50: "Certified button presser",
        100: "Unreasonably satisfying",
        250: "Touch grass? Later.",
        500: "Legendary thumb"
      };

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playThock(intensity = 1) {
        if (muted) return;
        const ctx = ensureAudio();
        if (!ctx) return;

        const now = ctx.currentTime;
        const wobble = 0.92 + Math.random() * 0.16;

        // Soft body thud
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = "sine";
        osc.frequency.setValueAtTime(180 * wobble, now);
        osc.frequency.exponentialRampToValueAtTime(55 * wobble, now + 0.09);
        filter.type = "lowpass";
        filter.frequency.value = 900;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.28 * intensity, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);

        // Bright click transient
        const click = ctx.createOscillator();
        const clickGain = ctx.createGain();
        click.type = "triangle";
        click.frequency.setValueAtTime(920 * wobble, now);
        click.frequency.exponentialRampToValueAtTime(240, now + 0.04);
        clickGain.gain.setValueAtTime(0.0001, now);
        clickGain.gain.exponentialRampToValueAtTime(0.12 * intensity, now + 0.004);
        clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        click.connect(clickGain);
        clickGain.connect(ctx.destination);
        click.start(now);
        click.stop(now + 0.06);

        // Soft noise puff
        const bufferSize = Math.floor(ctx.sampleRate * 0.05);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.2);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = 1400;
        noiseFilter.Q.value = 0.7;
        const noiseGain = ctx.createGain();
        noiseGain.gain.value = 0.08 * intensity;
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);
      }

      function playChime() {
        if (muted) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "sine";
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, now + i * 0.05);
          g.gain.exponentialRampToValueAtTime(0.07, now + i * 0.05 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.35);
          o.connect(g);
          g.connect(ctx.destination);
          o.start(now + i * 0.05);
          o.stop(now + i * 0.05 + 0.4);
        });
      }

      function spawnRing(strong) {
        if (reduceMotion) return;
        const ring = document.createElement("span");
        ring.className = "ring";
        fx.appendChild(ring);
        const scale = strong ? 2.6 : 1.85;
        const anim = ring.animate(
          [
            { opacity: 0.75, transform: "scale(0.55)", borderWidth: "3px" },
            { opacity: 0, transform: `scale(${scale})`, borderWidth: "0px" }
          ],
          {
            duration: strong ? 520 : 380,
            easing: "cubic-bezier(0.23, 1, 0.32, 1)",
            fill: "forwards"
          }
        );
        anim.onfinish = () => ring.remove();
      }

      function spawnParticles(strong) {
        if (reduceMotion) return;
        const n = strong ? 18 : 10;
        const colors = ["#ff7a45", "#ffb088", "#ffe0c8", "#fff6ea", "#ff9a6a"];
        for (let i = 0; i < n; i++) {
          const p = document.createElement("span");
          p.className = "particle";
          const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.4;
          const dist = (strong ? 90 : 64) + Math.random() * 50;
          const x = Math.cos(angle) * dist;
          const y = Math.sin(angle) * dist - 10;
          const size = 4 + Math.random() * 6;
          p.style.width = `${size}px`;
          p.style.height = `${size}px`;
          p.style.background = colors[i % colors.length];
          p.style.borderRadius = Math.random() > 0.6 ? "2px" : "50%";
          fx.appendChild(p);
          const anim = p.animate(
            [
              { opacity: 1, transform: "translate(0, 0) scale(1)" },
              { opacity: 0, transform: `translate(${x}px, ${y}px) scale(0.2)` }
            ],
            {
              duration: 420 + Math.random() * 220,
              easing: "cubic-bezier(0.23, 1, 0.32, 1)",
              delay: Math.random() * 30,
              fill: "forwards"
            }
          );
          anim.onfinish = () => p.remove();
        }
      }

      function setPressed(pressed) {
        btn.dataset.pressed = pressed ? "true" : "false";
        btn.style.setProperty("--press", pressed ? "1" : "0");
        if (!pressed) {
          btn.dataset.released = "true";
          clearTimeout(releaseTimer);
          releaseTimer = setTimeout(() => {
            btn.dataset.released = "false";
          }, 320);
        } else {
          btn.dataset.released = "false";
        }
      }

      function showMilestone(text) {
        clearTimeout(milestoneTimer);
        milestoneEl.textContent = text;
        milestoneEl.classList.add("show");
        milestoneTimer = setTimeout(() => {
          milestoneEl.classList.remove("show");
        }, 1600);
      }

      function onPress() {
        presses += 1;
        countEl.textContent = String(presses);
        countEl.classList.remove("pop");
        void countEl.offsetWidth;
        countEl.classList.add("pop");

        const strong = presses % 10 === 0;
        const intensity = strong ? 1.25 : 1;

        playThock(intensity);
        spawnRing(strong);
        spawnParticles(strong);

        if (strong) {
          playChime();
          const label = milestones[presses] || `${presses} presses`;
          showMilestone(label);
        }

        const hintIndex = Math.min(
          hints.length - 1,
          Math.floor(presses / 3)
        );
        hintEl.textContent = hints[hintIndex];
      }

      let pointerDown = false;

      function down(e) {
        if (e.button != null && e.button !== 0) return;
        pointerDown = true;
        ensureAudio();
        setPressed(true);
        onPress();
        if (typeof btn.setPointerCapture === "function" && e.pointerId != null) {
          try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        }
      }

      function up() {
        if (!pointerDown) return;
        pointerDown = false;
        setPressed(false);
      }

      btn.addEventListener("pointerdown", down);
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("lostpointercapture", up);

      btn.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "Enter") {
          if (e.repeat) return;
          e.preventDefault();
          ensureAudio();
          setPressed(true);
          onPress();
        }
      });

      btn.addEventListener("keyup", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          setPressed(false);
        }
      });

      muteBtn.addEventListener("click", () => {
        muted = !muted;
        muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
        muteBtn.textContent = muted ? "Sound off" : "Sound on";
        if (!muted) ensureAudio();
      });
    })();
  </script>
</body>
</html>
