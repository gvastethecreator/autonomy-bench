<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS — Network Operations Theater</title>
<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0a1020;
    --bg-2: #10182c;
    --panel: rgba(12, 18, 34, 0.78);
    --panel-border: rgba(120, 180, 255, 0.16);
    --text: #e8eefc;
    --muted: #8b9bb8;
    --cyan: #3de0ff;
    --blue: #4d7cff;
    --violet: #a78bfa;
    --magenta: #f472b6;
    --amber: #fbbf24;
    --emerald: #34d399;
    --rose: #fb7185;
    --glow: 0 0 24px rgba(61, 224, 255, 0.25);
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg-0);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    isolation: isolate;
  }

  .atmosphere {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(61, 224, 255, 0.12), transparent 55%),
      radial-gradient(ellipse 50% 40% at 85% 80%, rgba(167, 139, 250, 0.1), transparent 50%),
      radial-gradient(ellipse 40% 35% at 10% 70%, rgba(244, 114, 182, 0.08), transparent 50%),
      linear-gradient(180deg, #070b14 0%, #05070d 100%);
  }
  .atmosphere::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(120, 180, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 180, 255, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }
  .atmosphere::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
    opacity: 0.35;
    animation: scanDrift 12s linear infinite;
  }
  @keyframes scanDrift {
    from { transform: translateY(0); }
    to { transform: translateY(4px); }
  }

  header.topbar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: calc(0.85rem + var(--safe-top)) 1.25rem 0.85rem;
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(8, 12, 24, 0.92), rgba(8, 12, 24, 0.55));
    backdrop-filter: blur(16px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    min-width: 0;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background:
      radial-gradient(circle at 30% 30%, #7cf9ff, transparent 45%),
      linear-gradient(135deg, #1a3a6a, #0c1830);
    border: 1px solid rgba(61, 224, 255, 0.45);
    box-shadow: var(--glow);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 20px; height: 20px; }
  .brand h1 {
    font-size: 0.95rem;
    font-weight: 650;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .brand p {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 0.15rem;
  }

  .status-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    justify-content: flex-end;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.38rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: rgba(16, 24, 44, 0.7);
    font-size: 0.72rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .pill strong { color: var(--text); font-weight: 600; }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
    animation: pulseDot 2.2s ease-in-out infinite;
  }
  .dot.warn { background: var(--amber); box-shadow: 0 0 10px rgba(251, 191, 36, 0.75); }
  .dot.crit { background: var(--rose); box-shadow: 0 0 10px rgba(251, 113, 133, 0.8); }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.75); opacity: 0.65; }
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr minmax(260px, 320px);
  }

  .viewport {
    position: relative;
    min-width: 0;
    overflow: hidden;
    cursor: grab;
  }
  .viewport.dragging { cursor: grabbing; }
  #net {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hud-float {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    inset: 0;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .zone-chips, .hint-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    pointer-events: auto;
  }
  .zone-chip {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: rgba(10, 16, 32, 0.72);
    color: var(--muted);
    font: 600 0.68rem/1 var(--font);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.45rem 0.65rem;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .zone-chip:hover, .zone-chip:focus-visible {
    color: var(--text);
    border-color: rgba(61, 224, 255, 0.45);
    outline: none;
  }
  .zone-chip.active {
    color: #041018;
    background: linear-gradient(135deg, var(--cyan), #7cf9ff);
    border-color: transparent;
    box-shadow: 0 0 18px rgba(61, 224, 255, 0.35);
  }
  .hint {
    font-size: 0.72rem;
    color: var(--muted);
    background: rgba(8, 12, 22, 0.65);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 0.5rem 0.7rem;
    backdrop-filter: blur(8px);
    max-width: 28rem;
  }

  aside.panel {
    position: relative;
    z-index: 2;
    border-left: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(10, 15, 28, 0.92), rgba(7, 10, 18, 0.96));
    backdrop-filter: blur(18px);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .panel-head {
    padding: 1rem 1.1rem 0.75rem;
    border-bottom: 1px solid var(--panel-border);
  }
  .panel-head .eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 0.35rem;
  }
  .panel-head h2 {
    font-size: 1.05rem;
    font-weight: 650;
  }
  .panel-body {
    padding: 0.9rem 1.1rem 1.2rem;
    overflow: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55rem;
  }
  .stat {
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 0.65rem 0.7rem;
    background: rgba(16, 24, 44, 0.55);
  }
  .stat span {
    display: block;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .stat strong {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 600;
  }
  .meta-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  .meta-list li {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.8rem;
    padding: 0.45rem 0;
    border-bottom: 1px solid rgba(120, 180, 255, 0.08);
  }
  .meta-list li span:first-child { color: var(--muted); }
  .meta-list li span:last-child {
    font-family: var(--mono);
    text-align: right;
    color: var(--text);
  }
  .traffic-bars {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 72px 1fr 42px;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .bar-track {
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: inherit;
    width: 0%;
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .event-feed {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  .event {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.55rem;
    padding: 0.55rem 0.6rem;
    border-radius: 10px;
    border: 1px solid rgba(120, 180, 255, 0.1);
    background: rgba(255, 255, 255, 0.02);
    font-size: 0.74rem;
    animation: eventIn 0.45s ease both;
  }
  @keyframes eventIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .event time {
    font-family: var(--mono);
    color: var(--muted);
    font-size: 0.68rem;
  }
  .event p { color: var(--text); line-height: 1.35; }
  .badge {
    display: inline-block;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.18rem 0.4rem;
    border-radius: 6px;
    margin-right: 0.35rem;
    font-weight: 700;
  }
  .badge.info { background: rgba(61, 224, 255, 0.15); color: var(--cyan); }
  .badge.warn { background: rgba(251, 191, 36, 0.15); color: var(--amber); }
  .badge.ok { background: rgba(52, 211, 153, 0.15); color: var(--emerald); }
  .badge.crit { background: rgba(251, 113, 133, 0.15); color: var(--rose); }

  footer.controls {
    position: relative;
    z-index: 3;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.25rem;
    padding: 0.75rem 1.25rem calc(0.85rem + var(--safe-bottom));
    border-top: 1px solid var(--panel-border);
    background: linear-gradient(0deg, rgba(8, 12, 24, 0.95), rgba(8, 12, 24, 0.6));
    backdrop-filter: blur(16px);
  }
  .control-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55rem;
  }
  .control-group label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .btn {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: rgba(16, 24, 44, 0.8);
    color: var(--text);
    font: 600 0.75rem/1 var(--font);
    padding: 0.55rem 0.85rem;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .btn:hover, .btn:focus-visible {
    border-color: rgba(61, 224, 255, 0.5);
    outline: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(135deg, rgba(61, 224, 255, 0.25), rgba(77, 124, 255, 0.25));
    border-color: rgba(61, 224, 255, 0.4);
  }
  .slider {
    width: min(180px, 28vw);
    accent-color: var(--cyan);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem 0.9rem;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .legend i {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 0.35rem;
    vertical-align: middle;
    box-shadow: 0 0 8px currentColor;
  }

  .tooltip {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, calc(-100% - 12px)) scale(0.96);
    transition: opacity 0.15s ease, transform 0.15s ease;
    background: rgba(8, 12, 22, 0.92);
    border: 1px solid rgba(61, 224, 255, 0.35);
    border-radius: 10px;
    padding: 0.55rem 0.7rem;
    min-width: 140px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), var(--glow);
    backdrop-filter: blur(10px);
  }
  .tooltip.visible {
    opacity: 1;
    transform: translate(-50%, calc(-100% - 14px)) scale(1);
  }
  .tooltip strong {
    display: block;
    font-size: 0.8rem;
    margin-bottom: 0.2rem;
  }
  .tooltip span {
    font-size: 0.68rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside.panel {
      border-left: none;
      border-top: 1px solid var(--panel-border);
      max-height: 38vh;
    }
    .brand p { display: none; }
    .status-strip .pill:nth-child(n+3) { display: none; }
  }
  @media (max-width: 560px) {
    header.topbar { padding-inline: 0.85rem; }
    footer.controls { padding-inline: 0.85rem; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .atmosphere::after, .dot { animation: none; }
    .event { animation: none; }
    .bar-fill { transition: none; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9ef7ff" stroke-width="1.7">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
          </svg>
        </div>
        <div>
          <h1>Nexus</h1>
          <p>Network Operations Theater · Live Topology</p>
        </div>
      </div>
      <div class="status-strip" aria-live="polite">
        <div class="pill"><span class="dot" id="healthDot"></span> Health <strong id="healthLabel">Nominal</strong></div>
        <div class="pill">Nodes <strong id="nodeCount">0</strong></div>
        <div class="pill">Links <strong id="linkCount">0</strong></div>
        <div class="pill">Throughput <strong id="throughput">0</strong> Gbps</div>
        <div class="pill">UTC <strong id="clock">00:00:00</strong></div>
      </div>
    </header>

    <div class="stage">
      <section class="viewport" id="viewport" aria-label="Network topology canvas">
        <canvas id="net" role="img" aria-label="Animated computer network graph"></canvas>
        <div class="hud-float">
          <div class="zone-chips" id="zoneChips" role="toolbar" aria-label="Filter by zone"></div>
          <div class="hint-row">
            <p class="hint">Drag to pan · Scroll to zoom · Click a node for intel · Filters isolate zones</p>
          </div>
        </div>
        <div class="tooltip" id="tooltip" role="tooltip"></div>
      </section>

      <aside class="panel" aria-label="Node intelligence panel">
        <div class="panel-head">
          <div class="eyebrow" id="panelEyebrow">Selection</div>
          <h2 id="panelTitle">Network Overview</h2>
        </div>
        <div class="panel-body">
          <div class="stat-grid" id="statGrid"></div>
          <ul class="meta-list" id="metaList"></ul>
          <div>
            <div class="eyebrow" style="color:var(--muted);margin-bottom:0.55rem">Traffic mix</div>
            <div class="traffic-bars" id="trafficBars"></div>
          </div>
          <div>
            <div class="eyebrow" style="color:var(--muted);margin-bottom:0.55rem">Event stream</div>
            <div class="event-feed" id="eventFeed" aria-live="polite"></div>
          </div>
        </div>
      </aside>
    </div>

    <footer class="controls">
      <div class="control-group">
        <button class="btn primary" type="button" id="btnReset" title="Reset camera">Reset view</button>
        <button class="btn" type="button" id="btnPause" aria-pressed="false">Pause</button>
        <button class="btn" type="button" id="btnBurst">Traffic burst</button>
      </div>
      <div class="control-group">
        <label for="intensity">Flow intensity</label>
        <input class="slider" id="intensity" type="range" min="0.2" max="2.2" step="0.1" value="1" />
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:#3de0ff;color:#3de0ff"></i>Core</span>
        <span><i style="background:#4d7cff;color:#4d7cff"></i>Edge</span>
        <span><i style="background:#a78bfa;color:#a78bfa"></i>Cloud</span>
        <span><i style="background:#34d399;color:#34d399"></i>Data</span>
        <span><i style="background:#fbbf24;color:#fbbf24"></i>Security</span>
        <span><i style="background:#f472b6;color:#f472b6"></i>IoT</span>
      </div>
    </footer>
  </div>

    { id: "ot-gw", name: "OT Gateway", type: "router", zone: "iot", x: 0.42, y: 0.72, role: "Protocol broker", status: "ok", cpu: 35, lat: 6 },
    { id: "plant", name: "Plant Controllers", type: "sensor", zone: "iot", x: 0.34, y: 0.84, role: "PLC / SCADA", status: "warn", cpu: 46, lat: 8 },
    { id: "cam", name: "Camera Grid", type: "ap", zone: "iot", x: 0.50, y: 0.86, role: "NVR uplink", status: "ok", cpu: 51, lat: 5 },
    { id: "bldg", name: "Building BMS", type: "sensor", zone: "iot", x: 0.58, y: 0.76, role: "HVAC / access", status: "ok", cpu: 24, lat: 7 },
    { id: "wifi", name: "Campus Wi‑Fi", type: "ap", zone: "edge", x: 0.24, y: 0.64, role: "Controller cluster", status: "ok", cpu: 38, lat: 3 },
    { id: "users", name: "User LAN", type: "client", zone: "edge", x: 0.18, y: 0.78, role: "Endpoints", status: "ok", cpu: 15, lat: 4 },
  ];

  const links = [
    ["inet", "fw-ext"], ["inet", "cdn"], ["inet", "isp"], ["cdn", "waf"], ["isp", "vpn"],
    ["fw-ext", "waf"], ["fw-ext", "vpn"], ["fw-ext", "bastion"], ["waf", "lb"], ["vpn", "edge-sw"],
    ["bastion", "edge-sw"], ["lb", "dns"], ["lb", "core-a"], ["edge-sw", "core-a"], ["edge-sw", "core-b"],
    ["dns", "k8s"], ["core-a", "core-b"], ["core-a", "ids"], ["core-a", "leaf-1"], ["core-b", "leaf-2"],
    ["core-b", "sdwan"], ["ids", "k8s"], ["leaf-1", "app-a"], ["leaf-1", "app-b"], ["leaf-2", "db-pri"],
    ["leaf-2", "db-rep"], ["leaf-2", "obj"], ["app-a", "app-b"], ["app-a", "db-pri"], ["app-b", "db-pri"],
    ["db-pri", "db-rep"], ["db-rep", "obj"], ["k8s", "saas"], ["k8s", "backup"], ["obj", "backup"],
    ["sdwan", "ot-gw"], ["ot-gw", "plant"], ["ot-gw", "cam"], ["ot-gw", "bldg"], ["edge-sw", "wifi"],
    ["wifi", "users"], ["vpn", "wifi"], ["saas", "lb"], ["cam", "obj"],
  ].map(([a, b], i) => ({
    id: `L${i}`,
    a, b,
    weight: 0.4 + Math.random() * 0.8,
    kind: Math.random() > 0.7 ? "secure" : "data",
  }));

  const nodeMap = Object.fromEntries(nodes.map((n) => [n.id, n]));
  nodes.forEach((n) => {
    n.px = n.x;
    n.py = n.y;
    n.r = n.type === "router" || n.type === "firewall" ? 11 : n.type === "db" || n.type === "cloud" ? 10 : 8;
    n.pulse = Math.random() * Math.PI * 2;
    n.load = 0.3 + Math.random() * 0.5;
  });

  // Runtime state
  const canvas = document.getElementById("net");
  const ctx = canvas.getContext("2d");
  const viewport = document.getElementById("viewport");
  const tooltip = document.getElementById("tooltip");

  const state = {
    dpr: 1,
    w: 0,
    h: 0,
    camX: 0,
    camY: 0,
    scale: 1,
    dragging: false,
    lastX: 0,
    lastY: 0,
    selected: null,
    hover: null,
    zoneFilter: "all",
    paused: false,
    intensity: 1,
    t: 0,
    packets: [],
    events: [],
    throughput: 12.4,
    burstUntil: 0,
  };

  // UI wiring
  const zoneChips = document.getElementById("zoneChips");
  const allChip = document.createElement("button");
  allChip.className = "zone-chip active";
  allChip.type = "button";
  allChip.textContent = "All zones";
  allChip.dataset.zone = "all";
  zoneChips.appendChild(allChip);
  Object.values(ZONES).forEach((z) => {
    const b = document.createElement("button");
    b.className = "zone-chip";
    b.type = "button";
    b.textContent = z.label;
    b.dataset.zone = z.id;
    b.style.setProperty("--c", z.color);
    zoneChips.appendChild(b);
  });
  zoneChips.addEventListener("click", (e) => {
    const btn = e.target.closest(".zone-chip");
    if (!btn) return;
    state.zoneFilter = btn.dataset.zone;
    zoneChips.querySelectorAll(".zone-chip").forEach((c) => c.classList.toggle("active", c === btn));
    if (state.selected && state.zoneFilter !== "all" && nodeMap[state.selected].zone !== state.zoneFilter) {
      selectNode(null);
    }
  });

  document.getElementById("btnReset").addEventListener("click", resetCamera);
  document.getElementById("btnPause").addEventListener("click", () => {
    state.paused = !state.paused;
    const b = document.getElementById("btnPause");
    b.textContent = state.paused ? "Resume" : "Pause";
    b.setAttribute("aria-pressed", String(state.paused));
  });
  document.getElementById("btnBurst").addEventListener("click", () => {
    state.burstUntil = state.t + 4.5;
    spawnBurst(48);
    pushEvent("warn", "Synthetic traffic burst injected across core fabric");
  });
  document.getElementById("intensity").addEventListener("input", (e) => {
    state.intensity = Number(e.target.value);
  });

  function resetCamera() {
    state.camX = 0;
    state.camY = 0;
    state.scale = 1;
  }

  function resize() {
    const rect = viewport.getBoundingClientRect();
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.w = rect.width;
    state.h = rect.height;
    canvas.width = Math.max(1, Math.floor(rect.width * state.dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * state.dpr));
    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function worldFromNorm(n) {
    return {
      x: n.px * state.w,
      y: n.py * state.h,
    };
  }

  function screenOf(n) {
    const p = worldFromNorm(n);
    return {
      x: (p.x + state.camX) * state.scale + state.w * (1 - state.scale) * 0.5,
      y: (p.y + state.camY) * state.scale + state.h * (1 - state.scale) * 0.5,
    };
  }

  function hitTest(mx, my) {
    let best = null;
    let bestD = 18;
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const s = screenOf(n);
      const d = Math.hypot(s.x - mx, s.y - my);
      const r = n.r * state.scale + 8;
      if (d < r && d < bestD + n.r) {
        best = n;
        bestD = d;
      }
    }
    return best;
  }

  function nodeVisible(n) {
    return state.zoneFilter === "all" || n.zone === state.zoneFilter;
  }

  function linkVisible(l) {
    const a = nodeMap[l.a];
    const b = nodeMap[l.b];
    if (state.zoneFilter === "all") return true;
    return a.zone === state.zoneFilter || b.zone === state.zoneFilter;
  }

  // Pointer interactions
  viewport.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".zone-chip")) return;
    viewport.setPointerCapture(e.pointerId);
    state.dragging = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    viewport.classList.add("dragging");
  });
  viewport.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (state.dragging) {
      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;
      state.camX += dx / state.scale;
      state.camY += dy / state.scale;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      tooltip.classList.remove("visible");
      return;
    }
    const hit = hitTest(mx, my);
    state.hover = hit ? hit.id : null;
    canvas.style.cursor = hit ? "pointer" : state.dragging ? "grabbing" : "grab";
    if (hit) {
      tooltip.innerHTML = `<strong>${hit.name}</strong><span>${ZONES[hit.zone].label} · ${hit.role}</span>`;
      const s = screenOf(hit);
      tooltip.style.left = `${s.x}px`;
      tooltip.style.top = `${s.y}px`;
      tooltip.classList.add("visible");
    } else {
      tooltip.classList.remove("visible");
    }
  });
  viewport.addEventListener("pointerup", (e) => {
    const wasDrag = Math.hypot(e.clientX - state.lastX, e.clientY - state.lastY);
    state.dragging = false;
    viewport.classList.remove("dragging");
    if (wasDrag > 4) return;
    const rect = canvas.getBoundingClientRect();
    const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    selectNode(hit ? hit.id : null);
  });
  viewport.addEventListener("pointerleave", () => {
    state.hover = null;
    tooltip.classList.remove("visible");
  });
  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const next = Math.min(2.4, Math.max(0.55, state.scale * (e.deltaY < 0 ? 1.08 : 0.92)));
    state.scale = next;
  }, { passive: false });

  // Keyboard
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") selectNode(null);
    if (e.key === " " && e.target === document.body) {
      e.preventDefault();
      document.getElementById("btnPause").click();
    }
    if (e.key === "0") resetCamera();
  });

  function selectNode(id) {
    state.selected = id;
    renderPanel();
  }

  function renderPanel() {
    const eyebrow = document.getElementById("panelEyebrow");
    const title = document.getElementById("panelTitle");
    const stats = document.getElementById("statGrid");
    const meta = document.getElementById("metaList");
    const bars = document.getElementById("trafficBars");

    if (!state.selected) {
      eyebrow.textContent = "Fleet posture";
      title.textContent = "Network Overview";
      const warn = nodes.filter((n) => n.status === "warn").length;
      const crit = nodes.filter((n) => n.status === "crit").length;
      stats.innerHTML = `
        <div class="stat"><span>Active nodes</span><strong>${nodes.length}</strong></div>
        <div class="stat"><span>Live links</span><strong>${links.length}</strong></div>
        <div class="stat"><span>Alerts</span><strong>${warn + crit}</strong></div>
        <div class="stat"><span>Mean latency</span><strong>${avgLat().toFixed(1)} ms</strong></div>`;
      meta.innerHTML = `
        <li><span>Architecture</span><span>Hybrid spine-leaf</span></li>
        <li><span>Security model</span><span>Zero-trust / microseg</span></li>
        <li><span>Observability</span><span>Flow + NDR + logs</span></li>
        <li><span>Change window</span><span>Frozen · read-only</span></li>`;
      bars.innerHTML = trafficBarsHTML({ eastWest: 62, northSouth: 28, cloud: 41, ot: 18 });
      return;
    }

    const n = nodeMap[state.selected];
    eyebrow.textContent = `${ZONES[n.zone].label} · ${n.type}`;
    title.textContent = n.name;
    stats.innerHTML = `
      <div class="stat"><span>CPU</span><strong>${Math.round(n.cpu)}%</strong></div>
      <div class="stat"><span>Latency</span><strong>${n.lat.toFixed(1)} ms</strong></div>
      <div class="stat"><span>Status</span><strong style="color:${statusColor(n.status)}">${n.status.toUpperCase()}</strong></div>
      <div class="stat"><span>Load</span><strong>${Math.round(n.load * 100)}%</strong></div>`;
    const neighbors = links
      .filter((l) => l.a === n.id || l.b === n.id)
      .map((l) => nodeMap[l.a === n.id ? l.b : l.a].name)
      .slice(0, 4);
    meta.innerHTML = `
      <li><span>Role</span><span>${n.role}</span></li>
      <li><span>Zone</span><span>${ZONES[n.zone].label}</span></li>
      <li><span>Adjacency</span><span>${neighbors.join(" · ") || "—"}</span></li>
      <li><span>Policy</span><span>${n.zone === "dmz" || n.type === "firewall" ? "Inspect all" : "Allow-list"}</span></li>`;
    bars.innerHTML = trafficBarsHTML({
      eastWest: 40 + n.load * 40,
      northSouth: 20 + (n.zone === "dmz" || n.zone === "edge" ? 35 : 10),
      cloud: n.zone === "cloud" ? 70 : 25,
      ot: n.zone === "iot" ? 65 : 12,
    });
  }

  function trafficBarsHTML(m) {
    const rows = [
      ["E/W", m.eastWest, "#3de0ff"],
      ["N/S", m.northSouth, "#4d7cff"],
      ["Cloud", m.cloud, "#a78bfa"],
      ["OT", m.ot, "#f472b6"],
    ];
    return rows.map(([label, val, color]) => `
      <div class="bar-row">
        <span>${label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, val)}%;background:${color}"></div></div>
        <span>${Math.round(val)}%</span>
      </div>`).join("");
  }

  function statusColor(s) {
    return s === "ok" ? "#34d399" : s === "warn" ? "#fbbf24" : "#fb7185";
  }

  function avgLat() {
    return nodes.reduce((a, n) => a + n.lat, 0) / nodes.length;
  }

  function pushEvent(level, text) {
    const now = new Date();
    const stamp = now.toISOString().slice(11, 19);
    state.events.unshift({ level, text, stamp });
    if (state.events.length > 6) state.events.pop();
    const feed = document.getElementById("eventFeed");
    feed.innerHTML = state.events.map((ev) => `
      <article class="event">
        <time>${ev.stamp}</time>
        <p><span class="badge ${ev.level === "warn" ? "warn" : ev.level === "crit" ? "crit" : ev.level === "ok" ? "ok" : "info"}">${ev.level}</span>${ev.text}</p>
      </article>`).join("");
  }

  // Packets
  function spawnPacket(link) {
    const speed = (0.18 + Math.random() * 0.35) * state.intensity * (state.t < state.burstUntil ? 1.8 : 1);
    state.packets.push({
      link,
      t: Math.random() * 0.15,
      speed,
      dir: Math.random() > 0.5 ? 1 : -1,
      hue: link.kind === "secure" ? 190 : Math.random() > 0.5 ? 280 : 160,
      size: 1.4 + Math.random() * 1.8,
    });
  }

  function spawnBurst(count) {
    for (let i = 0; i < count; i++) {
      const link = links[(Math.random() * links.length) | 0];
      if (linkVisible(link)) spawnPacket(link);
    }
  }

  function maintainPackets() {
    const target = Math.floor(28 * state.intensity * (state.t < state.burstUntil ? 2.2 : 1));
    let guard = 0;
    while (state.packets.length < target && guard++ < 40) {
      const link = links[(Math.random() * links.length) | 0];
      if (linkVisible(link)) spawnPacket(link);
    }
    if (state.packets.length > target * 1.4) {
      state.packets.length = Math.floor(target * 1.2);
    }
  }

  // Ambient node drift for living feel
  function updateNodes(dt) {
    nodes.forEach((n, i) => {
      n.pulse += dt * (0.8 + n.load);
      if (!prefersReduced) {
        const ox = Math.sin(state.t * 0.35 + i * 0.7) * 0.0022;
        const oy = Math.cos(state.t * 0.28 + i * 0.9) * 0.002;
        n.px = n.x + ox;
        n.py = n.y + oy;
      }
      // Soft load oscillation
      n.load = 0.35 + 0.3 * Math.sin(state.t * 0.4 + i) * 0.5 + 0.25 * (n.cpu / 100);
      if (Math.random() < 0.002) n.cpu = Math.max(8, Math.min(92, n.cpu + (Math.random() - 0.5) * 8));
    });
  }

  function drawZones() {
    const groups = {};
    nodes.forEach((n) => {
      if (!nodeVisible(n)) return;
      (groups[n.zone] ||= []).push(screenOf(n));
    });
    Object.entries(groups).forEach(([zone, pts]) => {
      if (pts.length < 2) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      pts.forEach((p) => {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
      });
      const pad = 36 * state.scale;
      const color = ZONES[zone].color;
      ctx.save();
      roundRect(ctx, minX - pad, minY - pad, maxX - minX + pad * 2, maxY - minY + pad * 2, 22);
      ctx.fillStyle = hexAlpha(color, 0.045);
      ctx.fill();
      ctx.strokeStyle = hexAlpha(color, 0.14);
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = hexAlpha(color, 0.55);
      ctx.font = `600 ${11 * Math.min(state.scale, 1.2)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText(ZONES[zone].label.toUpperCase(), minX - pad + 10, minY - pad + 16);
      ctx.restore();
    });
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function hexAlpha(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawLinks() {
    links.forEach((l) => {
      if (!linkVisible(l)) return;
      const a = nodeMap[l.a];
      const b = nodeMap[l.b];
      const sa = screenOf(a);
      const sb = screenOf(b);
      const dim = state.zoneFilter !== "all" && a.zone !== state.zoneFilter && b.zone !== state.zoneFilter;
      const selectedRelated = state.selected && (l.a === state.selected || l.b === state.selected);
      const mx = (sa.x + sb.x) / 2 + (sb.y - sa.y) * 0.08;
      const my = (sa.y + sb.y) / 2 - (sb.x - sa.x) * 0.08;

      ctx.beginPath();
      ctx.moveTo(sa.x, sa.y);
      ctx.quadraticCurveTo(mx, my, sb.x, sb.y);
      ctx.strokeStyle = selectedRelated
        ? hexAlpha("#3de0ff", 0.75)
        : hexAlpha(l.kind === "secure" ? "#fbbf24" : "#7dd3fc", dim ? 0.08 : 0.22 + l.weight * 0.15);
      ctx.lineWidth = (selectedRelated ? 2.2 : 1 + l.weight) * state.scale;
      ctx.stroke();

      // soft glow underlay
      if (selectedRelated || state.t < state.burstUntil) {
        ctx.beginPath();
        ctx.moveTo(sa.x, sa.y);
        ctx.quadraticCurveTo(mx, my, sb.x, sb.y);
        ctx.strokeStyle = hexAlpha("#3de0ff", 0.12);
        ctx.lineWidth = 6 * state.scale;
        ctx.stroke();
      }

      l._mx = mx; l._my = my; l._sa = sa; l._sb = sb;
    });
  }

  function drawPackets(dt) {
    for (let i = state.packets.length - 1; i >= 0; i--) {
      const p = state.packets[i];
      const l = p.link;
      if (!linkVisible(l) || !l._sa) {
        state.packets.splice(i, 1);
        continue;
      }
      if (!state.paused) p.t += dt * p.speed * p.dir;
      if (p.t > 1 || p.t < 0) {
        state.packets.splice(i, 1);
        continue;
      }
      const t = p.t;
      const x = (1 - t) * (1 - t) * l._sa.x + 2 * (1 - t) * t * l._mx + t * t * l._sb.x;
      const y = (1 - t) * (1 - t) * l._sa.y + 2 * (1 - t) * t * l._my + t * t * l._sb.y;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 6 * p.size * state.scale);
      g.addColorStop(0, `hsla(${p.hue}, 95%, 70%, 0.95)`);
      g.addColorStop(1, `hsla(${p.hue}, 95%, 60%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 5 * p.size * state.scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawNodes() {
    nodes.forEach((n) => {
      if (!nodeVisible(n)) return;
      const s = screenOf(n);
      const color = ZONES[n.zone].color;
      const isSel = state.selected === n.id;
      const isHov = state.hover === n.id;
      const r = (n.r + (isSel || isHov ? 2 : 0)) * state.scale;
      const pulse = 0.5 + 0.5 * Math.sin(n.pulse);

      // outer aura
      const aura = ctx.createRadialGradient(s.x, s.y, r * 0.2, s.x, s.y, r * (2.8 + pulse));
      aura.addColorStop(0, hexAlpha(color, isSel ? 0.45 : 0.22));
      aura.addColorStop(1, hexAlpha(color, 0));
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * (2.8 + pulse * 0.4), 0, Math.PI * 2);
      ctx.fill();

      // ring
      ctx.beginPath();
      ctx.arc(s.x, s.y, r + 3 * state.scale, 0, Math.PI * 2);
      ctx.strokeStyle = hexAlpha(color, isSel ? 0.9 : 0.35 + pulse * 0.2);
      ctx.lineWidth = (isSel ? 2 : 1) * state.scale;
      ctx.stroke();

      // body
      const body = ctx.createLinearGradient(s.x - r, s.y - r, s.x + r, s.y + r);
      body.addColorStop(0, "#1a2b44");
      body.addColorStop(1, "#0a1220");
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hexAlpha(color, 0.85);
      ctx.lineWidth = 1.5 * state.scale;
      ctx.stroke();

      // status pip
      ctx.beginPath();
      ctx.arc(s.x + r * 0.55, s.y - r * 0.55, 2.4 * state.scale, 0, Math.PI * 2);
      ctx.fillStyle = statusColor(n.status);
      ctx.fill();

      // label
      if (state.scale > 0.7 || isSel || isHov) {
        ctx.font = `${isSel ? 600 : 500} ${Math.max(10, 11 * state.scale)}px Segoe UI, system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.fillStyle = hexAlpha("#e8eefc", isSel || isHov ? 0.95 : 0.7);
        ctx.fillText(n.name, s.x, s.y + r + 14 * state.scale);
        ctx.textAlign = "left";
      }

      // type glyph
      ctx.font = `${Math.max(8, 9 * state.scale)}px Segoe UI, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = hexAlpha(color, 0.95);
      ctx.fillText(TYPE_ICON[n.type] || "●", s.x, s.y + 0.5);
      ctx.textBaseline = "alphabetic";
      ctx.textAlign = "left";
    });
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(state.w * 0.5, state.h * 0.45, state.h * 0.2, state.w * 0.5, state.h * 0.5, state.h * 0.85);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(2,4,10,0.55)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, state.w, state.h);
  }

  // Clock + stats
  function updateChrome() {
    const d = new Date();
    document.getElementById("clock").textContent = d.toISOString().slice(11, 19);
    document.getElementById("nodeCount").textContent = String(nodes.length);
    document.getElementById("linkCount").textContent = String(links.length);
    const burst = state.t < state.burstUntil;
    state.throughput = 10 + Math.sin(state.t * 0.7) * 2.5 + state.intensity * 4 + (burst ? 18 : 0) + state.packets.length * 0.05;
    document.getElementById("throughput").textContent = state.throughput.toFixed(1);
    const warns = nodes.filter((n) => n.status !== "ok").length;
    const health = document.getElementById("healthLabel");
    const dot = document.getElementById("healthDot");
    if (warns >= 3) {
      health.textContent = "Degraded";
      dot.className = "dot crit";
    } else if (warns > 0) {
      health.textContent = "Watch";
      dot.className = "dot warn";
    } else {
      health.textContent = "Nominal";
      dot.className = "dot";
    }
  }

  // Occasional ambient events
  const AMBIENT = [
    ["info", "Flow exporter rotated · collectors healthy"],
    ["ok", "Certificate renewals completed on edge LB"],
    ["warn", "Elevated SYN rate near Perimeter FW — rate-limited"],
    ["info", "SD-WAN path rebalanced toward lower-loss peer"],
    ["ok", "DB replica lag within SLO (42 ms)"],
    ["warn", "OT Gateway protocol anomaly — signature matched"],
    ["info", "CDN cache hit ratio 94.2% over last window"],
    ["ok", "Spine ECMP hash stable after leaf drain"],
  ];
  let nextEventAt = 2.5;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!state.paused) state.t += dt;

    if (!state.paused) {
      updateNodes(dt);
      maintainPackets();
      if (state.t > nextEventAt) {
        const ev = AMBIENT[(Math.random() * AMBIENT.length) | 0];
        pushEvent(ev[0], ev[1]);
        nextEventAt = state.t + 3.5 + Math.random() * 5;
      }
      // rare status flip
      if (Math.random() < 0.0015) {
        const n = nodes[(Math.random() * nodes.length) | 0];
        if (n.status === "ok" && Math.random() > 0.6) {
          n.status = "warn";
          pushEvent("warn", `${n.name} crossed warning threshold`);
        } else if (n.status === "warn" && Math.random() > 0.4) {
          n.status = "ok";
          pushEvent("ok", `${n.name} recovered to nominal`);
        }
      }
    }

    ctx.clearRect(0, 0, state.w, state.h);

    // subtle starfield / nodes dust
    ctx.fillStyle = "rgba(180,210,255,0.035)";
    for (let i = 0; i < 40; i++) {
      const x = ((i * 97 + state.t * 3) % state.w);
      const y = ((i * 53 + 20) % state.h);
      ctx.fillRect(x, y, 1.2, 1.2);
    }

    drawZones();
    drawLinks();
    drawPackets(dt);
    drawNodes();
    drawVignette();
    updateChrome();

    requestAnimationFrame(frame);
  }

  // Init
  document.getElementById("nodeCount").textContent = String(nodes.length);
  document.getElementById("linkCount").textContent = String(links.length);
  renderPanel();
  pushEvent("info", "NEXUS theater online — telemetry stream attached");
  pushEvent("ok", "All critical paths reporting heartbeats");
  spawnBurst(20);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
