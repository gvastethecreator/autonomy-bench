<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen — Loading</title>
  <style>
    :root {
      --bg-0: #07080c;
      --bg-1: #0c1018;
      --ink: #e8eef8;
      --ink-dim: rgba(232, 238, 248, 0.55);
      --ink-faint: rgba(232, 238, 248, 0.28);
      --accent: #7eb6ff;
      --accent-hot: #c4e0ff;
      --accent-deep: #3d7fd4;
      --glow: rgba(126, 182, 255, 0.45);
      --track: rgba(232, 238, 248, 0.08);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "Cascadia Code", "SF Mono", "Consolas", ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg-0);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .stage {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      isolation: isolate;
    }

    /* Atmosphere */
    .aurora {
      position: absolute;
      inset: -20%;
      z-index: 0;
      background:
        radial-gradient(ellipse 55% 40% at 50% 42%, rgba(61, 127, 212, 0.22), transparent 70%),
        radial-gradient(ellipse 40% 30% at 70% 65%, rgba(120, 80, 200, 0.1), transparent 65%),
        radial-gradient(ellipse 35% 28% at 28% 70%, rgba(70, 160, 200, 0.08), transparent 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 55%, #05060a 100%);
      animation: aurora-drift 14s var(--ease-in-out) infinite alternate;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0.04;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      mix-blend-mode: overlay;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(232, 238, 248, 0.7);
      box-shadow: 0 0 6px rgba(196, 224, 255, 0.5);
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0.35;
    }

    /* Main card */
    .panel {
      position: relative;
      z-index: 3;
      width: min(100%, 26rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      animation: panel-enter 700ms var(--ease-out) both;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
    }

    .wordmark {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .title {
      font-size: clamp(1.35rem, 3.5vw, 1.65rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    /* Orbital mark */
    .orb-wrap {
      position: relative;
      width: 9.5rem;
      height: 9.5rem;
      margin: 0.25rem 0 0.5rem;
    }

    .orb-glow {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
      filter: blur(12px);
      animation: glow-pulse 2.8s var(--ease-in-out) infinite;
      pointer-events: none;
    }

    .orb {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .orb svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ring-outer {
      fill: none;
      stroke: rgba(126, 182, 255, 0.22);
      stroke-width: 1.25;
      stroke-dasharray: 4 7;
      transform-origin: 50% 50%;
      animation: spin 28s linear infinite;
    }

    .ring-mid {
      fill: none;
      stroke: rgba(126, 182, 255, 0.45);
      stroke-width: 1.5;
      stroke-dasharray: 70 180;
      stroke-linecap: round;
      transform-origin: 50% 50%;
      animation: spin-rev 9s linear infinite;
    }

    .ring-inner {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 40 100;
      stroke-linecap: round;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 0 6px var(--glow));
      animation: spin 4.5s linear infinite;
    }

    .core {
      fill: url(#coreGrad);
      filter: drop-shadow(0 0 10px var(--glow));
      transform-origin: 50% 50%;
      animation: core-breathe 2.4s var(--ease-in-out) infinite;
    }

    .core-ring {
      fill: none;
      stroke: rgba(196, 224, 255, 0.55);
      stroke-width: 1;
    }

    .node {
      fill: var(--accent-hot);
      filter: drop-shadow(0 0 4px var(--glow));
    }

    .node-orbit {
      transform-origin: 50% 50%;
      animation: spin 6s linear infinite;
    }

    /* Progress */
    .progress-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      min-height: 1.25rem;
    }

    .status {
      font-size: 0.8125rem;
      color: var(--ink-dim);
      letter-spacing: 0.01em;
      transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
    }

    .status.is-swap {
      opacity: 0;
      transform: translateY(4px);
    }

    .pct {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: var(--accent-hot);
      min-width: 3.2em;
      text-align: right;
    }

    .track {
      position: relative;
      height: 3px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(232, 238, 248, 0.06), transparent);
      animation: track-sheen 2.8s linear infinite;
    }

    .fill {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent) 55%, var(--accent-hot));
      box-shadow: 0 0 12px var(--glow);
      transition: width 160ms linear;
    }

    .fill::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -1px;
      width: 8px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-hot);
      box-shadow: 0 0 10px 2px var(--glow);
      opacity: 0.9;
    }

    .phases {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      width: 100%;
      list-style: none;
    }

    .phase {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .phase-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(232, 238, 248, 0.15);
      transition: background 250ms var(--ease-out), box-shadow 250ms var(--ease-out), transform 250ms var(--ease-out);
    }

    .phase.is-active .phase-dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--glow);
      transform: scale(1.25);
    }

    .phase.is-done .phase-dot {
      background: var(--accent-hot);
      box-shadow: 0 0 6px rgba(196, 224, 255, 0.4);
      transform: scale(1);
    }

    .phase-label {
      font-size: 0.625rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
      transition: color 250ms var(--ease-out);
    }

    .phase.is-active .phase-label,
    .phase.is-done .phase-label {
      color: var(--ink-dim);
    }

    .hint {
      font-size: 0.7rem;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: -0.35rem;
    }

    /* Ready state */
    .ready {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      background: rgba(7, 8, 12, 0.72);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 500ms var(--ease-out), visibility 500ms;
    }

    .ready.is-on {
      opacity: 1;
      visibility: visible;
    }

    .ready-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      padding: 2rem 2.25rem;
      border-radius: 1.25rem;
      background: linear-gradient(160deg, rgba(20, 28, 42, 0.92), rgba(10, 14, 22, 0.95));
      border: 1px solid rgba(126, 182, 255, 0.18);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 24px 64px rgba(0, 0, 0, 0.45),
        0 0 48px rgba(61, 127, 212, 0.15);
      transform: translateY(10px) scale(0.96);
      opacity: 0;
      transition: transform 520ms var(--ease-out), opacity 520ms var(--ease-out);
    }

    .ready.is-on .ready-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .ready-icon {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 40% 35%, rgba(126, 182, 255, 0.35), rgba(61, 127, 212, 0.12));
      border: 1px solid rgba(126, 182, 255, 0.35);
      box-shadow: 0 0 24px rgba(126, 182, 255, 0.25);
    }

    .ready-icon svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: var(--accent-hot);
      stroke-width: 2.25;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ready-icon .check {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
    }

    .ready.is-on .ready-icon .check {
      animation: check-draw 480ms 180ms var(--ease-out) forwards;
    }

    .ready h2 {
      font-size: 1.2rem;
      font-weight: 550;
      letter-spacing: -0.02em;
    }

    .ready p {
      font-size: 0.8125rem;
      color: var(--ink-dim);
      max-width: 16rem;
      line-height: 1.45;
    }

    .replay {
      margin-top: 0.35rem;
      appearance: none;
      border: 1px solid rgba(126, 182, 255, 0.28);
      background: rgba(126, 182, 255, 0.08);
      color: var(--ink);
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 100ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .replay:hover {
        background: rgba(126, 182, 255, 0.16);
        border-color: rgba(126, 182, 255, 0.45);
      }
    }

    .replay:active {
      transform: scale(0.97);
    }

    .replay:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Screen-reader live region */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes aurora-drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(0, -2%, 0) scale(1.04); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.4); }
    }

    @keyframes panel-enter {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
      to { transform: rotate(-360deg); }
    }

    @keyframes core-breathe {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @keyframes track-sheen {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    @keyframes check-draw {
      to { stroke-dashoffset: 0; }
    }

    @media (max-width: 420px) {
      .panel { gap: 1.5rem; }
      .orb-wrap { width: 7.75rem; height: 7.75rem; }
      .phases { gap: 0.25rem; }
      .phase-label { font-size: 0.55rem; letter-spacing: 0.05em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora,
      .star,
      .orb-glow,
      .ring-outer,
      .ring-mid,
      .ring-inner,
      .core,
      .node-orbit,
      .track::before,
      .panel {
        animation: none !important;
      }

      .panel {
        opacity: 1;
        transform: none;
      }

      .status,
      .fill,
      .phase-dot,
      .phase-label,
      .ready,
      .ready-card,
      .replay {
        transition-duration: 0.01ms !important;
      }

      .ready.is-on .ready-icon .check {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>
  <div class="stage" role="main">
    <div class="aurora" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="panel" id="panel">
      <div class="brand">
        <div class="wordmark">Lumen</div>
        <h1 class="title">Initializing workspace</h1>
      </div>

      <div class="orb-wrap" aria-hidden="true">
        <div class="orb-glow"></div>
        <div class="orb">
          <svg viewBox="0 0 120 120" role="presentation">
            <defs>
              <radialGradient id="coreGrad" cx="40%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#e8f2ff" />
                <stop offset="45%" stop-color="#7eb6ff" />
                <stop offset="100%" stop-color="#2a5a9e" />
              </radialGradient>
            </defs>
            <circle class="ring-outer" cx="60" cy="60" r="54" />
            <circle class="ring-mid" cx="60" cy="60" r="42" />
            <circle class="ring-inner" cx="60" cy="60" r="30" />
            <circle class="core-ring" cx="60" cy="60" r="16" />
            <circle class="core" cx="60" cy="60" r="11" />
            <g class="node-orbit">
              <circle class="node" cx="60" cy="18" r="2.4" />
              <circle class="node" cx="98" cy="72" r="1.8" opacity="0.7" />
            </g>
          </svg>
        </div>
      </div>

      <div class="progress-block"
           role="progressbar"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0"
           aria-labelledby="statusText"
           id="progressBar">
        <div class="status-row">
          <p class="status" id="statusText">Calibrating optical field…</p>
          <span class="pct" id="pctText" aria-hidden="true">0%</span>
        </div>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
      </div>

      <ul class="phases" id="phases" aria-hidden="true">
        <li class="phase is-active" data-phase="0">
          <span class="phase-dot"></span>
          <span class="phase-label">Sync</span>
        </li>
        <li class="phase" data-phase="1">
          <span class="phase-dot"></span>
          <span class="phase-label">Map</span>
        </li>
        <li class="phase" data-phase="2">
          <span class="phase-dot"></span>
          <span class="phase-label">Bind</span>
        </li>
        <li class="phase" data-phase="3">
          <span class="phase-dot"></span>
          <span class="phase-label">Open</span>
        </li>
      </ul>

      <p class="hint">Secure session · local only</p>
    </div>

    <div class="ready" id="ready" aria-hidden="true">
      <div class="ready-card">
        <div class="ready-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path class="check" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h2>Ready</h2>
        <p>Workspace is online. Systems are warm and waiting for you.</p>
        <button type="button" class="replay" id="replay">Replay sequence</button>
      </div>
    </div>

    <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    (function () {
      const MESSAGES = [
        { at: 0, text: "Calibrating optical field…", phase: 0 },
        { at: 18, text: "Mapping spatial anchors…", phase: 1 },
        { at: 42, text: "Binding interface layers…", phase: 2 },
        { at: 68, text: "Warming render pipeline…", phase: 2 },
        { at: 86, text: "Opening the gate…", phase: 3 },
        { at: 98, text: "Almost there…", phase: 3 }
      ];

      const fill = document.getElementById("fill");
      const pctText = document.getElementById("pctText");
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");
      const phases = Array.from(document.querySelectorAll(".phase"));
      const ready = document.getElementById("ready");
      const live = document.getElementById("live");
      const replay = document.getElementById("replay");
      const stars = document.getElementById("stars");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let raf = 0;
      let start = 0;
      let msgIndex = 0;
      const DURATION = reduceMotion ? 1800 : 5200;

      function spawnStars() {
        const count = reduceMotion ? 18 : 42;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const s = document.createElement("span");
          s.className = "star";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.setProperty("--dur", 2.4 + Math.random() * 3.6 + "s");
          s.style.setProperty("--delay", Math.random() * -4 + "s");
          const size = 1 + Math.random() * 1.5;
          s.style.width = size + "px";
          s.style.height = size + "px";
          frag.appendChild(s);
        }
        stars.appendChild(frag);
      }

      function setPhase(index) {
        phases.forEach((el, i) => {
          el.classList.toggle("is-active", i === index);
          el.classList.toggle("is-done", i < index);
        });
      }

      function setStatus(text) {
        if (statusText.textContent === text) return;
        if (reduceMotion) {
          statusText.textContent = text;
          live.textContent = text;
          return;
        }
        statusText.classList.add("is-swap");
        window.setTimeout(() => {
          statusText.textContent = text;
          live.textContent = text;
          statusText.classList.remove("is-swap");
        }, 160);
      }

      function setProgress(pct) {
        const clamped = Math.max(0, Math.min(100, pct));
        const rounded = Math.round(clamped);
        fill.style.width = clamped + "%";
        pctText.textContent = rounded + "%";
        progressBar.setAttribute("aria-valuenow", String(rounded));

        while (msgIndex < MESSAGES.length - 1 && clamped >= MESSAGES[msgIndex + 1].at) {
          msgIndex += 1;
          setStatus(MESSAGES[msgIndex].text);
          setPhase(MESSAGES[msgIndex].phase);
        }
      }

      function showReady() {
        setProgress(100);
        setPhase(4);
        setStatus("Complete");
        live.textContent = "Workspace ready";
        ready.classList.add("is-on");
        ready.setAttribute("aria-hidden", "false");
        window.setTimeout(() => replay.focus(), reduceMotion ? 50 : 420);
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function tick(now) {
        if (!start) start = now;
        const t = Math.min(1, (now - start) / DURATION);
        /* Ease overall progress; slight plateaus via piecewise shaping */
        const shaped = easeOutCubic(t);
        const wobble = reduceMotion ? 0 : Math.sin(t * Math.PI * 3) * 0.012 * (1 - t);
        const pct = Math.min(100, (shaped + wobble) * 100);
        setProgress(pct);

        if (t < 1) {
          raf = requestAnimationFrame(tick);
        } else {
          window.setTimeout(showReady, reduceMotion ? 120 : 380);
        }
      }

      function reset() {
        cancelAnimationFrame(raf);
        start = 0;
        msgIndex = 0;
        ready.classList.remove("is-on");
        ready.setAttribute("aria-hidden", "true");
        setPhase(0);
        statusText.classList.remove("is-swap");
        statusText.textContent = MESSAGES[0].text;
        live.textContent = MESSAGES[0].text;
        setProgress(0);
        raf = requestAnimationFrame(tick);
      }

      replay.addEventListener("click", reset);

      spawnStars();
      setPhase(0);
      live.textContent = MESSAGES[0].text;
      raf = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
