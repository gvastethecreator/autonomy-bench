<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Node Editor</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-elevated: #171a21;
    --bg-panel: #1c212b;
    --border: #2a3140;
    --border-strong: #3a4458;
    --text: #e8ecf4;
    --text-muted: #8b95a8;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.18);
    --danger: #ff6b7a;
    --success: #3dd68c;
    --warning: #f5a524;
    --grid: #1a1f2a;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    --radius: 10px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", "Consolas", "SF Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    user-select: none;
  }

  button, input, select { font: inherit; color: inherit; }

  #app {
    display: grid;
    grid-template-columns: 220px 1fr 260px;
    grid-template-rows: 48px 1fr 28px;
    width: 100%;
    height: 100%;
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 650;
    letter-spacing: 0.02em;
  }

  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, #5b8cff, #8b5cf6);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-panel);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .btn:hover { background: #242a36; border-color: var(--border-strong); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 4px;
  }

  aside, .inspector {
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .inspector {
    border-right: none;
    border-left: 1px solid var(--border);
  }

  .panel-title {
    padding: 14px 14px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .palette {
    padding: 4px 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: auto;
  }

  .palette-item {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg-panel);
    cursor: grab;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }

  .palette-item:hover {
    border-color: var(--accent);
    background: #222836;
  }

  .palette-item:active { cursor: grabbing; transform: scale(0.98); }

  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.06);
  }

  .palette-item .meta {
    font-size: 11px;
    color: var(--text-muted);
  }

  .hint-box {
    margin-top: auto;
    padding: 12px 14px 16px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .hint-box kbd {
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
  }

  #stage-wrap {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(91,140,255,0.08), transparent 55%),
      radial-gradient(900px 500px at 90% 100%, rgba(139,92,246,0.07), transparent 50%),
      var(--bg);
    cursor: default;
  }

  #stage-wrap.panning { cursor: grabbing; }
  #stage-wrap.connecting { cursor: crosshair; }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #world {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  .node {
    position: absolute;
    min-width: 180px;
    background: linear-gradient(180deg, #232a38 0%, #1b212d 100%);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: visible;
  }

  .node.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), var(--shadow);
  }

  .node-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius) var(--radius) 0 0;
    cursor: grab;
    background: rgba(255,255,255,0.02);
  }

  .node.selected .node-header { background: var(--accent-soft); }
  .node-header:active { cursor: grabbing; }

  .node-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .node-title {
    font-weight: 650;
    flex: 1;
    white-space: nowrap;
  }

  .node-type {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .node-body {
    padding: 8px 0 10px;
  }

  .port-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    min-height: 26px;
    position: relative;
  }

  .port {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 12px;
    position: relative;
    font-size: 12px;
    color: var(--text-muted);
  }

  .port.out {
    justify-content: flex-end;
    grid-column: 2;
  }

  .port.in { grid-column: 1; }

  .port-socket {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #9aa8c7;
    background: #12151c;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    cursor: crosshair;
    z-index: 2;
    transition: transform 0.12s, background 0.12s, border-color 0.12s;
  }

  .port.in .port-socket { left: -7px; }
  .port.out .port-socket { right: -7px; }

  .port-socket:hover,
  .port-socket.hot {
    transform: translateY(-50%) scale(1.25);
    background: var(--accent);
    border-color: #fff;
  }

  .port-socket.connected { background: #9aa8c7; }

  .node-field {
    padding: 6px 12px 2px;
  }

  .node-field label {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .node-field input,
  .node-field select,
  .inspector-body input,
  .inspector-body select,
  .inspector-body textarea {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #12161f;
    outline: none;
  }

  .node-field input:focus,
  .inspector-body input:focus,
  .inspector-body select:focus,
  .inspector-body textarea:focus {
    border-color: var(--accent);
  }

  .inspector-body textarea {
    height: 72px;
    padding: 8px;
    resize: vertical;
  }

  .value-preview {
    margin: 4px 12px 0;
    padding: 8px 10px;
    border-radius: 6px;
    background: #10141c;
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--success);
    word-break: break-all;
  }

  .inspector-body {
    padding: 4px 14px 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { color: var(--text-muted); font-size: 11px; }

  .empty-state {
    color: var(--text-muted);
    padding: 8px 0;
    line-height: 1.5;
  }

  footer {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 14px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
  }

  footer .stat strong { color: var(--text); font-weight: 600; }

  .zoom-badge {
    margin-left: auto;
    font-family: var(--mono);
  }

  #wires {
    position: absolute;
    left: 0;
    top: 0;
    overflow: visible;
    pointer-events: none;
  }

  #wires path {
    fill: none;
    stroke-linecap: round;
    pointer-events: stroke;
    cursor: pointer;
  }

  #temp-wire {
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    opacity: 0.9;
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(28, 33, 43, 0.95);
    border: 1px solid var(--border-strong);
    color: var(--text);
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 20;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  @media (max-width: 900px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 48px 42px 1fr 200px 28px;
    }
    aside {
      border-right: none;
      border-bottom: 1px solid var(--border);
      flex-direction: row;
      overflow-x: auto;
    }
    .panel-title, .hint-box { display: none; }
    .palette {
      flex-direction: row;
      padding: 6px 10px;
      width: max-content;
    }
    .palette-item { min-width: 140px; }
    .inspector {
      border-left: none;
      border-top: 1px solid var(--border);
    }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <span>Node Editor</span>
    </div>
    <div class="toolbar">
      <button class="btn" id="btn-fit" title="Fit to view">Fit</button>
      <button class="btn" id="btn-reset-view" title="Reset view">Reset View</button>
      <div class="sep"></div>
      <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button class="btn" id="btn-redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
      <div class="sep"></div>
      <button class="btn danger" id="btn-clear" title="Clear graph">Clear</button>
      <button class="btn primary" id="btn-demo">Load Demo</button>
    </div>
  </header>

  <aside>
    <div class="panel-title">Nodes</div>
    <div class="palette" id="palette"></div>
    <div class="hint-box">
      Drag a node onto the canvas.<br>
      Drag ports to connect.<br>
      <kbd>Space</kbd> + drag or middle-mouse to pan.<br>
      Scroll to zoom. <kbd>Del</kbd> removes selection.
    </div>
  </aside>

  <div id="stage-wrap">
    <canvas id="canvas"></canvas>
    <div id="world">
      <svg id="wires" xmlns="http://www.w3.org/2000/svg">
        <path id="temp-wire" d="" visibility="hidden"></path>
      </svg>
      <div id="nodes"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <section class="inspector">
    <div class="panel-title">Inspector</div>
    <div class="inspector-body" id="inspector">
      <div class="empty-state">Select a node to edit its properties.</div>
    </div>
  </section>

  <footer>
    <span class="stat">Nodes: <strong id="stat-nodes">0</strong></span>
    <span class="stat">Wires: <strong id="stat-wires">0</strong></span>
    <span class="stat" id="stat-selection">Nothing selected</span>
    <span class="zoom-badge" id="stat-zoom">100%</span>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const COLORS = {
    number: "#5b8cff",
    math: "#3dd68c",
    logic: "#f5a524",
    string: "#c084fc",
    util: "#67e8f9",
    output: "#ff6b7a",
  };

  const NODE_DEFS = {
    number: {
      title: "Number",
      category: "number",
      color: COLORS.number,
      inputs: [],
      outputs: [{ id: "value", label: "Value" }],
      defaults: { value: 1 },
      evaluate(node) { return { value: Number(node.data.value) || 0 }; },
    },
    add: {
      title: "Add",
      category: "math",
      color: COLORS.math,
      inputs: [{ id: "a", label: "A" }, { id: "b", label: "B" }],
      outputs: [{ id: "out", label: "Sum" }],
      defaults: {},
      evaluate(node, get) {
        return { out: (get("a") ?? 0) + (get("b") ?? 0) };
      },
    },
    subtract: {
      title: "Subtract",
      category: "math",
      color: COLORS.math,
      inputs: [{ id: "a", label: "A" }, { id: "b", label: "B" }],
      outputs: [{ id: "out", label: "Diff" }],
      defaults: {},
      evaluate(node, get) {
        return { out: (get("a") ?? 0) - (get("b") ?? 0) };
      },
    },
    multiply: {
      title: "Multiply",
      category: "math",
      color: COLORS.math,
      inputs: [{ id: "a", label: "A" }, { id: "b", label: "B" }],
      outputs: [{ id: "out", label: "Product" }],
      defaults: {},
      evaluate(node, get) {
        return { out: (get("a") ?? 0) * (get("b") ?? 0) };
      },
    },
    divide: {
      title: "Divide",
      category: "math",
      color: COLORS.math,
      inputs: [{ id: "a", label: "A" }, { id: "b", label: "B" }],
      outputs: [{ id: "out", label: "Quotient" }],
      defaults: {},
      evaluate(node, get) {
        const b = get("b") ?? 0;
        return { out: b === 0 ? Infinity : (get("a") ?? 0) / b };
      },
    },
    compare: {
      title: "Compare",
      category: "logic",
      color: COLORS.logic,
      inputs: [{ id: "a", label: "A" }, { id: "b", label: "B" }],
      outputs: [{ id: "gt", label: "A > B" }, { id: "eq", label: "A = B" }],
      defaults: {},
      evaluate(node, get) {
        const a = get("a") ?? 0;
        const b = get("b") ?? 0;
        return { gt: a > b, eq: a === b };
      },
    },
    branch: {
      title: "Branch",
      category: "logic",
      color: COLORS.logic,
      inputs: [
        { id: "cond", label: "Condition" },
        { id: "then", label: "If True" },
        { id: "else", label: "If False" },
      ],
      outputs: [{ id: "out", label: "Result" }],
      defaults: {},
      evaluate(node, get) {
        return { out: get("cond") ? (get("then") ?? 0) : (get("else") ?? 0) };
      },
    },
    text: {
      title: "Text",
      category: "string",
      color: COLORS.string,
      inputs: [],
      outputs: [{ id: "value", label: "Text" }],
      defaults: { value: "Hello" },
      evaluate(node) { return { value: String(node.data.value ?? "") }; },
    },
    concat: {
      title: "Concat",
      category: "string",
      color: COLORS.string,
      inputs: [{ id: "a", label: "A" }, { id: "b", label: "B" }],
      outputs: [{ id: "out", label: "Text" }],
      defaults: {},
      evaluate(node, get) {
        return { out: String(get("a") ?? "") + String(get("b") ?? "") };
      },
    },
    clamp: {
      title: "Clamp",
      category: "util",
      color: COLORS.util,
      inputs: [
        { id: "value", label: "Value" },
        { id: "min", label: "Min" },
        { id: "max", label: "Max" },
      ],
      outputs: [{ id: "out", label: "Clamped" }],
      defaults: {},
      evaluate(node, get) {
        const v = get("value") ?? 0;
        const min = get("min") ?? 0;
        const max = get("max") ?? 1;
        return { out: Math.min(max, Math.max(min, v)) };
      },
    },
    display: {
      title: "Display",
      category: "output",
      color: COLORS.output,
      inputs: [{ id: "in", label: "In" }],
      outputs: [],
      defaults: { label: "Result" },
      evaluate(node, get) {
        node._preview = get("in");
        return {};
      },
    },
  };

  const PALETTE = [
    { type: "number", hint: "Constant" },
    { type: "add", hint: "A + B" },
    { type: "subtract", hint: "A − B" },
    { type: "multiply", hint: "A × B" },
    { type: "divide", hint: "A ÷ B" },
    { type: "compare", hint: "Relations" },
    { type: "branch", hint: "If / else" },
    { type: "text", hint: "String" },
    { type: "concat", hint: "Join text" },
    { type: "clamp", hint: "Limit range" },
    { type: "display", hint: "Show value" },
  ];

  const state = {
    nodes: new Map(),
    wires: new Map(),
    selectedNodeId: null,
    selectedWireId: null,
    view: { x: 80, y: 60, scale: 1 },
    connecting: null,
    dragging: null,
    panning: null,
    spaceDown: false,
    history: [],
    future: [],
    evalCache: new Map(),
    idSeq: 1,
  };

  const els = {
    stage: document.getElementById("stage-wrap"),
    canvas: document.getElementById("canvas"),
    world: document.getElementById("world"),
    nodes: document.getElementById("nodes"),
    wires: document.getElementById("wires"),
    tempWire: document.getElementById("temp-wire"),
    palette: document.getElementById("palette"),
    inspector: document.getElementById("inspector"),
    toast: document.getElementById("toast"),
    statNodes: document.getElementById("stat-nodes"),
    statWires: document.getElementById("stat-wires"),
    statSelection: document.getElementById("stat-selection"),
    statZoom: document.getElementById("stat-zoom"),
    btnUndo: document.getElementById("btn-undo"),
    btnRedo: document.getElementById("btn-redo"),
  };

  const ctx = els.canvas.getContext("2d");

  function uid(prefix = "id") {
    return `${prefix}_${state.idSeq++}_${Math.random().toString(36).slice(2, 7)}`;
  }

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove("show"), 1600);
  }

  function cloneGraph() {
    return {
      nodes: [...state.nodes.values()].map((n) => ({
        id: n.id,
        type: n.type,
        x: n.x,
        y: n.y,
        data: { ...n.data },
      })),
      wires: [...state.wires.values()].map((w) => ({ ...w })),
      idSeq: state.idSeq,
    };
  }

  function pushHistory() {
    state.history.push(cloneGraph());
    if (state.history.length > 60) state.history.shift();
    state.future = [];
    updateHistoryButtons();
  }

  function restoreGraph(snap) {
    state.nodes.clear();
    state.wires.clear();
    state.selectedNodeId = null;
    state.selectedWireId = null;
    state.idSeq = snap.idSeq;
    for (const n of snap.nodes) {
      state.nodes.set(n.id, {
        id: n.id,
        type: n.type,
        x: n.x,
        y: n.y,
        data: { ...n.data },
        el: null,
      });
    }
    for (const w of snap.wires) state.wires.set(w.id, { ...w });
    renderAll();
    evaluateGraph();
    updateInspector();
    updateStats();
  }

  function undo() {
    if (!state.history.length) return;
    state.future.push(cloneGraph());
    restoreGraph(state.history.pop());
    updateHistoryButtons();
    toast("Undo");
  }

  function redo() {
    if (!state.future.length) return;
    state.history.push(cloneGraph());
    restoreGraph(state.future.pop());
    updateHistoryButtons();
    toast("Redo");
  }

  function updateHistoryButtons() {
    els.btnUndo.disabled = !state.history.length;
    els.btnRedo.disabled = !state.future.length;
  }

  function applyView() {
    const { x, y, scale } = state.view;
    els.world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    els.statZoom.textContent = `${Math.round(scale * 100)}%`;
    drawGrid();
  }

  function screenToWorld(clientX, clientY) {
    const rect = els.stage.getBoundingClientRect();
    return {
      x: (clientX - rect.left - state.view.x) / state.view.scale,
      y: (clientY - rect.top - state.view.y) / state.view.scale,
    };
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = els.stage.getBoundingClientRect();
    els.canvas.width = Math.floor(rect.width * dpr);
    els.canvas.height = Math.floor(rect.height * dpr);
    els.canvas.style.width = `${rect.width}px`;
    els.canvas.style.height = `${rect.height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGrid();
  }

  function drawGrid() {
    const rect = els.stage.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);

    const { x, y, scale } = state.view;
    const major = 80;
    const minor = 20;

    const startX = Math.floor((-x) / scale / minor) * minor;
    const startY = Math.floor((-y) / scale / minor) * minor;
    const endX = startX + w / scale + minor * 2;
    const endY = startY + h / scale + minor * 2;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.beginPath();
    for (let gx = startX; gx <= endX; gx += minor) {
      ctx.moveTo(gx, startY);
      ctx.lineTo(gx, endY);
    }
    for (let gy = startY; gy <= endY; gy += minor) {
      ctx.moveTo(startX, gy);
      ctx.lineTo(endX, gy);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1 / scale;
    ctx.stroke();

    ctx.beginPath();
    for (let gx = Math.floor(startX / major) * major; gx <= endX; gx += major) {
      ctx.moveTo(gx, startY);
      ctx.lineTo(gx, endY);
    }
    for (let gy = Math.floor(startY / major) * major; gy <= endY; gy += major) {
      ctx.moveTo(startX, gy);
      ctx.lineTo(endX, gy);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 1 / scale;
    ctx.stroke();
    ctx.restore();
  }

  function bezierPath(x1, y1, x2, y2) {
    const dx = Math.max(Math.abs(x2 - x1) * 0.5, 40);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }

  function getSocketCenter(nodeId, portId, dir) {
    const node = state.nodes.get(nodeId);
    if (!node || !node.el) return { x: 0, y: 0 };
    const socket = node.el.querySelector(
      `.port[data-port="${portId}"][data-dir="${dir}"] .port-socket`
    );
    if (!socket) return { x: node.x, y: node.y };
    const stageRect = els.stage.getBoundingClientRect();
    const r = socket.getBoundingClientRect();
    return {
      x: (r.left + r.width / 2 - stageRect.left - state.view.x) / state.view.scale,
      y: (r.top + r.height / 2 - stageRect.top - state.view.y) / state.view.scale,
    };
  }

  function updateWires() {
    const existing = new Map();
    for (const path of [...els.wires.querySelectorAll("path[data-wire]")]) {
      existing.set(path.dataset.wire, path);
    }

    for (const wire of state.wires.values()) {
      const from = getSocketCenter(wire.fromNode, wire.fromPort, "out");
      const to = getSocketCenter(wire.toNode, wire.toPort, "in");
      let path = existing.get(wire.id);
      if (!path) {
        path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.dataset.wire = wire.id;
        path.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          selectWire(wire.id);
        });
        els.wires.appendChild(path);
      } else {
        existing.delete(wire.id);
      }
      const selected = state.selectedWireId === wire.id;
      path.setAttribute("d", bezierPath(from.x, from.y, to.x, to.y));
      path.setAttribute("stroke", selected ? "#5b8cff" : "#7f8aa3");
      path.setAttribute("stroke-width", selected ? "3.5" : "2.25");
      path.style.opacity = selected ? "1" : "0.85";
    }

    for (const path of existing.values()) path.remove();

    const bounds = [...state.nodes.values()].reduce(
      (acc, n) => ({
        w: Math.max(acc.w, n.x + 320),
        h: Math.max(acc.h, n.y + 220),
      }),
      { w: 2000, h: 1400 }
    );
    els.wires.setAttribute("width", bounds.w);
    els.wires.setAttribute("height", bounds.h);
    els.wires.style.width = `${bounds.w}px`;
    els.wires.style.height = `${bounds.h}px`;
  }

  function markConnectedSockets() {
    document.querySelectorAll(".port-socket.connected").forEach((el) => {
      el.classList.remove("connected");
    });
    for (const wire of state.wires.values()) {
      const fromNode = state.nodes.get(wire.fromNode);
      const toNode = state.nodes.get(wire.toNode);
      fromNode?.el
        ?.querySelector(`.port[data-port="${wire.fromPort}"][data-dir="out"] .port-socket`)
        ?.classList.add("connected");
      toNode?.el
        ?.querySelector(`.port[data-port="${wire.toPort}"][data-dir="in"] .port-socket`)
        ?.classList.add("connected");
    }
  }

  function createNodeEl(node) {
    const def = NODE_DEFS[node.type];
    const el = document.createElement("div");
    el.className = "node" + (state.selectedNodeId === node.id ? " selected" : "");
    el.dataset.id = node.id;
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    const inCount = def.inputs.length;
    const outCount = def.outputs.length;
    const rows = Math.max(inCount, outCount, 1);

    let portsHtml = "";
    for (let i = 0; i < rows; i++) {
      const inp = def.inputs[i];
      const out = def.outputs[i];
      portsHtml += `<div class="port-row">`;
      if (inp) {
        portsHtml += `<div class="port in" data-port="${inp.id}" data-dir="in">
          <span class="port-socket" data-port="${inp.id}" data-dir="in"></span>
          <span>${inp.label}</span>
        </div>`;
      } else {
        portsHtml += `<div></div>`;
      }
      if (out) {
        portsHtml += `<div class="port out" data-port="${out.id}" data-dir="out">
          <span>${out.label}</span>
          <span class="port-socket" data-port="${out.id}" data-dir="out"></span>
        </div>`;
      }
      portsHtml += `</div>`;
    }

    let fields = "";
    if (node.type === "number") {
      fields = `<div class="node-field"><label>Value</label>
        <input type="number" step="any" data-field="value" value="${node.data.value ?? 0}" /></div>`;
    } else if (node.type === "text") {
      fields = `<div class="node-field"><label>Text</label>
        <input type="text" data-field="value" value="${escapeAttr(node.data.value ?? "")}" /></div>`;
    } else if (node.type === "display") {
      fields = `<div class="node-field"><label>Label</label>
        <input type="text" data-field="label" value="${escapeAttr(node.data.label ?? "Result")}" /></div>
        <div class="value-preview" data-preview>—</div>`;
    }

    el.innerHTML = `
      <div class="node-header">
        <span class="node-dot" style="background:${def.color}"></span>
        <span class="node-title">${def.title}</span>
        <span class="node-type">${def.category}</span>
      </div>
      <div class="node-body">
        ${fields}
        ${portsHtml}
      </div>
    `;

    el.querySelector(".node-header").addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      selectNode(node.id);
      const start = screenToWorld(e.clientX, e.clientY);
      state.dragging = {
        id: node.id,
        ox: start.x - node.x,
        oy: start.y - node.y,
        moved: false,
      };
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".port-socket") || e.target.matches("input,select,textarea")) return;
      e.stopPropagation();
      selectNode(node.id);
    });

    el.querySelectorAll(".port-socket").forEach((socket) => {
      socket.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        e.preventDefault();
        beginConnect(node.id, socket.dataset.port, socket.dataset.dir, e);
      });
    });

    el.querySelectorAll("input[data-field]").forEach((input) => {
      input.addEventListener("pointerdown", (e) => e.stopPropagation());
      input.addEventListener("change", () => {
        pushHistory();
        const key = input.dataset.field;
        node.data[key] = input.type === "number" ? Number(input.value) : input.value;
        evaluateGraph();
        updateInspector();
      });
      input.addEventListener("input", () => {
        const key = input.dataset.field;
        node.data[key] = input.type === "number" ? Number(input.value) : input.value;
        evaluateGraph();
        if (state.selectedNodeId === node.id) syncInspectorFields();
      });
    });

    node.el = el;
    els.nodes.appendChild(el);
    return el;
  }

  function escapeAttr(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;");
  }

  function renderAll() {
    els.nodes.innerHTML = "";
    for (const node of state.nodes.values()) createNodeEl(node);
    updateWires();
    markConnectedSockets();
    applyView();
    updateStats();
  }

  function addNode(type, x, y, data, record = true) {
    const def = NODE_DEFS[type];
    if (!def) return null;
    if (record) pushHistory();
    const node = {
      id: uid("node"),
      type,
      x,
      y,
      data: { ...def.defaults, ...(data || {}) },
      el: null,
    };
    state.nodes.set(node.id, node);
    createNodeEl(node);
    selectNode(node.id);
    evaluateGraph();
    updateWires();
    updateStats();
    return node;
  }

  function removeNode(id, record = true) {
    if (!state.nodes.has(id)) return;
    if (record) pushHistory();
    for (const [wid, wire] of [...state.wires.entries()]) {
      if (wire.fromNode === id || wire.toNode === id) state.wires.delete(wid);
    }
    const node = state.nodes.get(id);
    node.el?.remove();
    state.nodes.delete(id);
    if (state.selectedNodeId === id) state.selectedNodeId = null;
    updateWires();
    markConnectedSockets();
    evaluateGraph();
    updateInspector();
    updateStats();
  }

  function canConnect(fromNode, fromPort, toNode, toPort) {
    if (fromNode === toNode) return false;
    const a = state.nodes.get(fromNode);
    const b = state.nodes.get(toNode);
    if (!a || !b) return false;
    const aDef = NODE_DEFS[a.type];
    const bDef = NODE_DEFS[b.type];
    if (!aDef.outputs.some((p) => p.id === fromPort)) return false;
    if (!bDef.inputs.some((p) => p.id === toPort)) return false;
    for (const w of state.wires.values()) {
      if (w.toNode === toNode && w.toPort === toPort) return false;
    }
    // cycle check
    const adj = new Map();
    for (const n of state.nodes.keys()) adj.set(n, []);
    for (const w of state.wires.values()) adj.get(w.fromNode).push(w.toNode);
    adj.get(fromNode).push(toNode);
    const seen = new Set();
    const stack = [toNode];
    while (stack.length) {
      const cur = stack.pop();
      if (cur === fromNode) return false;
      if (seen.has(cur)) continue;
      seen.add(cur);
      for (const next of adj.get(cur) || []) stack.push(next);
    }
    return true;
  }

  function addWire(fromNode, fromPort, toNode, toPort, record = true) {
    if (!canConnect(fromNode, fromPort, toNode, toPort)) {
      toast("Invalid connection");
      return null;
    }
    if (record) pushHistory();
    const wire = {
      id: uid("wire"),
      fromNode,
      fromPort,
      toNode,
      toPort,
    };
    state.wires.set(wire.id, wire);
    updateWires();
    markConnectedSockets();
    evaluateGraph();
    updateStats();
    return wire;
  }

  function removeWire(id, record = true) {
    if (!state.wires.has(id)) return;
    if (record) pushHistory();
    state.wires.delete(id);
    if (state.selectedWireId === id) state.selectedWireId = null;
    updateWires();
    markConnectedSockets();
    evaluateGraph();
    updateStats();
    updateInspector();
  }

  function selectNode(id) {
    state.selectedNodeId = id;
    state.selectedWireId = null;
    document.querySelectorAll(".node.selected").forEach((n) => n.classList.remove("selected"));
    const node = state.nodes.get(id);
    node?.el?.classList.add("selected");
    updateWires();
    updateInspector();
    updateStats();
  }

  function selectWire(id) {
    state.selectedWireId = id;
    state.selectedNodeId = null;
    document.querySelectorAll(".node.selected").forEach((n) => n.classList.remove("selected"));
    updateWires();
    updateInspector();
    updateStats();
  }

  function clearSelection() {
    state.selectedNodeId = null;
    state.selectedWireId = null;
    document.querySelectorAll(".node.selected").forEach((n) => n.classList.remove("selected"));
    updateWires();
    updateInspector();
    updateStats();
  }

  function beginConnect(nodeId, portId, dir, e) {
    let fromNode = nodeId;
    let fromPort = portId;
    let fromDir = dir;

    // Always drag from output toward input visually
    if (dir === "in") {
      // start from this input backwards only if already connected? allow reverse connect
      fromDir = "in";
    }

    const start = getSocketCenter(nodeId, portId, dir);
    state.connecting = {
      nodeId,
      portId,
      dir,
      x: start.x,
      y: start.y,
    };
    els.stage.classList.add("connecting");
    els.tempWire.setAttribute("visibility", "visible");
    updateTempWire(start.x, start.y);
    window.addEventListener("pointermove", onConnectMove);
    window.addEventListener("pointerup", onConnectUp, { once: true });
  }

  function onConnectMove(e) {
    if (!state.connecting) return;
    const p = screenToWorld(e.clientX, e.clientY);
    updateTempWire(p.x, p.y);
    document.querySelectorAll(".port-socket.hot").forEach((s) => s.classList.remove("hot"));
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const socket = target?.closest?.(".port-socket");
    if (socket) socket.classList.add("hot");
  }

  function updateTempWire(x, y) {
    const c = state.connecting;
    if (!c) return;
    if (c.dir === "out") {
      els.tempWire.setAttribute("d", bezierPath(c.x, c.y, x, y));
    } else {
      els.tempWire.setAttribute("d", bezierPath(x, y, c.x, c.y));
    }
  }

  function onConnectUp(e) {
    window.removeEventListener("pointermove", onConnectMove);
    els.stage.classList.remove("connecting");
    els.tempWire.setAttribute("visibility", "hidden");
    document.querySelectorAll(".port-socket.hot").forEach((s) => s.classList.remove("hot"));

    const c = state.connecting;
    state.connecting = null;
    if (!c) return;

    const target = document.elementFromPoint(e.clientX, e.clientY);
    const socket = target?.closest?.(".port-socket");
    if (!socket) return;

    const nodeEl = socket.closest(".node");
    if (!nodeEl) return;
    const toNode = nodeEl.dataset.id;
    const toPort = socket.dataset.port;
    const toDir = socket.dataset.dir;

    if (c.dir === "out" && toDir === "in") {
      addWire(c.nodeId, c.portId, toNode, toPort);
    } else if (c.dir === "in" && toDir === "out") {
      addWire(toNode, toPort, c.nodeId, c.portId);
    } else {
      toast("Connect output → input");
    }
  }

  function topologicalOrder() {
    const indeg = new Map();
    const adj = new Map();
    for (const id of state.nodes.keys()) {
      indeg.set(id, 0);
      adj.set(id, []);
    }
    for (const w of state.wires.values()) {
      adj.get(w.fromNode).push(w.toNode);
      indeg.set(w.toNode, (indeg.get(w.toNode) || 0) + 1);
    }
    const q = [...indeg.entries()].filter(([, d]) => d === 0).map(([id]) => id);
    const order = [];
    while (q.length) {
      const id = q.shift();
      order.push(id);
      for (const next of adj.get(id)) {
        indeg.set(next, indeg.get(next) - 1);
        if (indeg.get(next) === 0) q.push(next);
      }
    }
    return order.length === state.nodes.size ? order : [...state.nodes.keys()];
  }

  function evaluateGraph() {
    state.evalCache.clear();
    const outputs = new Map();

    const getInputValue = (nodeId, portId) => {
      for (const w of state.wires.values()) {
        if (w.toNode === nodeId && w.toPort === portId) {
          const fromOut = outputs.get(w.fromNode);
          if (!fromOut) return undefined;
          return fromOut[w.fromPort];
        }
      }
      return undefined;
    };

    for (const id of topologicalOrder()) {
      const node = state.nodes.get(id);
      const def = NODE_DEFS[node.type];
      const get = (port) => getInputValue(id, port);
      const result = def.evaluate(node, get) || {};
      outputs.set(id, result);
      state.evalCache.set(id, result);

      if (node.type === "display" && node.el) {
        const preview = node.el.querySelector("[data-preview]");
        if (preview) {
          const v = node._preview;
          preview.textContent = formatValue(v);
        }
      }
    }

    if (state.selectedNodeId) syncInspectorPreview();
  }

  function formatValue(v) {
    if (v === undefined) return "—";
    if (typeof v === "number") {
      if (!Number.isFinite(v)) return String(v);
      return Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/\.?0+$/, "");
    }
    if (typeof v === "boolean") return v ? "true" : "false";
    return JSON.stringify(v);
  }

  function updateInspector() {
    const box = els.inspector;
    if (state.selectedWireId) {
      const w = state.wires.get(state.selectedWireId);
      box.innerHTML = `
        <div class="field"><span>Wire</span><strong>${w.id}</strong></div>
        <div class="field"><span>From</span><div>${w.fromNode} · ${w.fromPort}</div></div>
        <div class="field"><span>To</span><div>${w.toNode} · ${w.toPort}</div></div>
        <button class="btn danger" id="insp-delete-wire">Delete wire</button>
      `;
      box.querySelector("#insp-delete-wire").onclick = () => removeWire(w.id);
      return;
    }

    const node = state.nodes.get(state.selectedNodeId);
    if (!node) {
      box.innerHTML = `<div class="empty-state">Select a node to edit its properties.</div>`;
      return;
    }

    const def = NODE_DEFS[node.type];
    const out = state.evalCache.get(node.id) || {};

    let fields = `
      <div class="field"><span>Name</span><strong>${def.title}</strong></div>
      <div class="field"><span>Type</span><div>${node.type}</div></div>
      <div class="field"><span>Position</span><div>${Math.round(node.x)}, ${Math.round(node.y)}</div></div>
    `;

    if (node.type === "number") {
      fields += `<div class="field"><span>Value</span>
        <input type="number" step="any" data-insp="value" value="${node.data.value ?? 0}" /></div>`;
    }
    if (node.type === "text") {
      fields += `<div class="field"><span>Text</span>
        <input type="text" data-insp="value" value="${escapeAttr(node.data.value ?? "")}" /></div>`;
    }
    if (node.type === "display") {
      fields += `<div class="field"><span>Label</span>
        <input type="text" data-insp="label" value="${escapeAttr(node.data.label ?? "")}" /></div>
        <div class="field"><span>Preview</span>
        <div class="value-preview" data-insp-preview>${formatValue(node._preview)}</div></div>`;
    }

    if (Object.keys(out).length) {
      fields += `<div class="field"><span>Outputs</span>
        <div class="value-preview">${Object.entries(out)
          .map(([k, v]) => `${k}: ${formatValue(v)}`)
          .join("\n")}</div></div>`;
    }

    fields += `<button class="btn danger" id="insp-delete-node">Delete node</button>`;
    box.innerHTML = fields;

    box.querySelectorAll("[data-insp]").forEach((input) => {
      const apply = () => {
        const key = input.dataset.insp;
        const prev = node.data[key];
        const next = input.type === "number" ? Number(input.value) : input.value;
        if (prev === next) return;
        pushHistory();
        node.data[key] = next;
        const live = node.el?.querySelector(`[data-field="${key}"]`);
        if (live) live.value = input.value;
        evaluateGraph();
      };
      input.addEventListener("change", apply);
      input.addEventListener("input", () => {
        const key = input.dataset.insp;
        node.data[key] = input.type === "number" ? Number(input.value) : input.value;
        const live = node.el?.querySelector(`[data-field="${key}"]`);
        if (live) live.value = input.value;
        evaluateGraph();
      });
    });

    box.querySelector("#insp-delete-node").onclick = () => removeNode(node.id);
  }

  function syncInspectorFields() {
    const node = state.nodes.get(state.selectedNodeId);
    if (!node) return;
    els.inspector.querySelectorAll("[data-insp]").forEach((input) => {
      const key = input.dataset.insp;
      if (document.activeElement === input) return;
      input.value = node.data[key] ?? "";
    });
  }

  function syncInspectorPreview() {
    const node = state.nodes.get(state.selectedNodeId);
    if (!node) return;
    const preview = els.inspector.querySelector("[data-insp-preview]");
    if (preview) preview.textContent = formatValue(node._preview);
    const outs = state.evalCache.get(node.id);
    // refresh outputs block only when not editing
  }

  function updateStats() {
    els.statNodes.textContent = String(state.nodes.size);
    els.statWires.textContent = String(state.wires.size);
    if (state.selectedNodeId) {
      const n = state.nodes.get(state.selectedNodeId);
      els.statSelection.textContent = `Selected: ${NODE_DEFS[n.type].title}`;
    } else if (state.selectedWireId) {
      els.statSelection.textContent = "Selected: wire";
    } else {
      els.statSelection.textContent = "Nothing selected";
    }
  }

  function fitView() {
    if (!state.nodes.size) {
      state.view = { x: 80, y: 60, scale: 1 };
      applyView();
      return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of state.nodes.values()) {
      const w = n.el?.offsetWidth || 180;
      const h = n.el?.offsetHeight || 100;
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + w);
      maxY = Math.max(maxY, n.y + h);
    }
    const rect = els.stage.getBoundingClientRect();
    const pad = 60;
    const gw = maxX - minX || 1;
    const gh = maxY - minY || 1;
    const scale = Math.min(1.4, Math.max(0.35, Math.min((rect.width - pad * 2) / gw, (rect.height - pad * 2) / gh)));
    state.view.scale = scale;
    state.view.x = (rect.width - gw * scale) / 2 - minX * scale;
    state.view.y = (rect.height - gh * scale) / 2 - minY * scale;
    applyView();
    updateWires();
  }

  function loadDemo() {
    pushHistory();
    state.nodes.clear();
    state.wires.clear();
    state.selectedNodeId = null;
    state.selectedWireId = null;
    els.nodes.innerHTML = "";

    const a = addNode("number", 80, 120, { value: 12 }, false);
    const b = addNode("number", 80, 280, { value: 5 }, false);
    const add = addNode("add", 340, 140, {}, false);
    const mul = addNode("multiply", 340, 300, {}, false);
    const cmp = addNode("compare", 600, 120, {}, false);
    const branch = addNode("branch", 860, 200, {}, false);
    const t1 = addNode("text", 600, 320, { value: "big" }, false);
    const t2 = addNode("text", 600, 420, { value: "small" }, false);
    const concat = addNode("concat", 860, 360, {}, false);
    const dispNum = addNode("display", 1120, 180, { label: "Chosen number" }, false);
    const dispTxt = addNode("display", 1120, 340, { label: "Label" }, false);

    addWire(a.id, "value", add.id, "a", false);
    addWire(b.id, "value", add.id, "b", false);
    addWire(a.id, "value", mul.id, "a", false);
    addWire(b.id, "value", mul.id, "b", false);
    addWire(add.id, "out", cmp.id, "a", false);
    addWire(mul.id, "out", cmp.id, "b", false);
    addWire(cmp.id, "gt", branch.id, "cond", false);
    addWire(add.id, "out", branch.id, "then", false);
    addWire(mul.id, "out", branch.id, "else", false);
    addWire(t1.id, "value", concat.id, "a", false);
    addWire(t2.id, "value", concat.id, "b", false);
    addWire(branch.id, "out", dispNum.id, "in", false);
    addWire(concat.id, "out", dispTxt.id, "in", false);

    evaluateGraph();
    fitView();
    toast("Demo graph loaded");
  }

  function clearGraph() {
    if (!state.nodes.size && !state.wires.size) return;
    pushHistory();
    state.nodes.clear();
    state.wires.clear();
    state.selectedNodeId = null;
    state.selectedWireId = null;
    els.nodes.innerHTML = "";
    updateWires();
    evaluateGraph();
    updateInspector();
    updateStats();
    toast("Graph cleared");
  }

  // Palette
  for (const item of PALETTE) {
    const def = NODE_DEFS[item.type];
    const btn = document.createElement("button");
    btn.className = "palette-item";
    btn.type = "button";
    btn.draggable = true;
    btn.innerHTML = `<span class="swatch" style="background:${def.color}"></span>
      <span>${def.title}<div class="meta">${item.hint}</div></span>`;
    btn.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("application/x-node-type", item.type);
      e.dataTransfer.effectAllowed = "copy";
    });
    btn.addEventListener("click", () => {
      const rect = els.stage.getBoundingClientRect();
      const world = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
      addNode(item.type, world.x - 90, world.y - 40);
      toast(`Added ${def.title}`);
    });
    els.palette.appendChild(btn);
  }

  els.stage.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });

  els.stage.addEventListener("drop", (e) => {
    e.preventDefault();
    const type = e.dataTransfer.getData("application/x-node-type");
    if (!type) return;
    const p = screenToWorld(e.clientX, e.clientY);
    addNode(type, p.x - 90, p.y - 20);
  });

  els.stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".node") || e.target.closest("#wires path")) return;
    if (e.button === 1 || (e.button === 0 && state.spaceDown)) {
      state.panning = {
        x: e.clientX - state.view.x,
        y: e.clientY - state.view.y,
      };
      els.stage.classList.add("panning");
      els.stage.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 0) clearSelection();
  });

  els.stage.addEventListener("pointermove", (e) => {
    if (state.panning) {
      state.view.x = e.clientX - state.panning.x;
      state.view.y = e.clientY - state.panning.y;
      applyView();
      return;
    }
    if (state.dragging) {
      const p = screenToWorld(e.clientX, e.clientY);
      const node = state.nodes.get(state.dragging.id);
      if (!node) return;
      const nx = p.x - state.dragging.ox;
      const ny = p.y - state.dragging.oy;
      if (!state.dragging.moved) {
        if (Math.hypot(nx - node.x, ny - node.y) < 2) return;
        state.dragging.moved = true;
        pushHistory();
      }
      node.x = nx;
      node.y = ny;
      node.el.style.left = `${nx}px`;
      node.el.style.top = `${ny}px`;
      updateWires();
    }
  });

  els.stage.addEventListener("pointerup", () => {
    if (state.panning) {
      state.panning = null;
      els.stage.classList.remove("panning");
    }
    if (state.dragging) {
      if (state.dragging.moved) {
        evaluateGraph();
        updateInspector();
      }
      state.dragging = null;
    }
  });

  els.stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = els.stage.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const before = screenToWorld(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    state.view.scale = Math.min(2.5, Math.max(0.25, state.view.scale * factor));
    state.view.x = mx - before.x * state.view.scale;
    state.view.y = my - before.y * state.view.scale;
    applyView();
    updateWires();
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !e.repeat && !isTyping(e)) {
      state.spaceDown = true;
      e.preventDefault();
    }
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === "z" && !e.shiftKey) {
      e.preventDefault();
      undo();
      return;
    }
    if (meta && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) {
      e.preventDefault();
      redo();
      return;
    }
    if ((e.key === "Delete" || e.key === "Backspace") && !isTyping(e)) {
      e.preventDefault();
      if (state.selectedWireId) removeWire(state.selectedWireId);
      else if (state.selectedNodeId) removeNode(state.selectedNodeId);
    }
  });

  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") state.spaceDown = false;
  });

  function isTyping(e) {
    const t = e.target;
    return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
  }

  document.getElementById("btn-fit").onclick = fitView;
  document.getElementById("btn-reset-view").onclick = () => {
    state.view = { x: 80, y: 60, scale: 1 };
    applyView();
    updateWires();
  };
  document.getElementById("btn-undo").onclick = undo;
  document.getElementById("btn-redo").onclick = redo;
  document.getElementById("btn-clear").onclick = clearGraph;
  document.getElementById("btn-demo").onclick = loadDemo;

  window.addEventListener("resize", () => {
    resizeCanvas();
    updateWires();
  });

  // Boot
  resizeCanvas();
  applyView();
  updateHistoryButtons();
  loadDemo();
  // loadDemo already pushed history awkwardly — reset history after demo seed
  state.history = [];
  state.future = [];
  updateHistoryButtons();
})();
</script>
</body>
</html>
