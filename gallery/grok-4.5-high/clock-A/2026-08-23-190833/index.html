<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --face: #121a2f;
      --ring: #2a3a5c;
      --tick: #8ea0c4;
      --hour: #e8eefc;
      --minute: #c5d2ef;
      --second: #ff6b6b;
      --accent: #6ec6ff;
      --text: #e8eefc;
      --muted: #8ea0c4;
      --glow: rgba(110, 198, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at top, #16203a 0%, transparent 55%),
        radial-gradient(ellipse at bottom, #1a1030 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      width: min(100%, 28rem);
    }

    .clock-face {
      position: relative;
      width: min(80vw, 22rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #1a2540 0%, var(--face) 55%, #0d1426 100%);
      border: 0.35rem solid var(--ring);
      box-shadow:
        0 0 0 0.15rem #0a0f1c,
        0 1.5rem 3rem rgba(0, 0, 0, 0.45),
        0 0 2.5rem var(--glow);
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.18rem;
      height: 0.75rem;
      background: var(--tick);
      border-radius: 999px;
      transform-origin: center calc(min(40vw, 11rem) - 0.9rem);
      transform: translate(-50%, calc(-1 * (min(40vw, 11rem) - 0.9rem))) rotate(var(--angle));
      opacity: 0.7;
    }

    .tick.hour {
      width: 0.28rem;
      height: 1.1rem;
      background: var(--hour);
      opacity: 1;
      transform-origin: center calc(min(40vw, 11rem) - 1.05rem);
      transform: translate(-50%, calc(-1 * (min(40vw, 11rem) - 1.05rem))) rotate(var(--angle));
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 999px;
      translate: -50% 0;
    }

    .hand.hour {
      width: 0.45rem;
      height: 28%;
      background: var(--hour);
      z-index: 2;
    }

    .hand.minute {
      width: 0.32rem;
      height: 38%;
      background: var(--minute);
      z-index: 3;
    }

    .hand.second {
      width: 0.16rem;
      height: 42%;
      background: var(--second);
      z-index: 4;
      box-shadow: 0 0 0.75rem rgba(255, 107, 107, 0.45);
    }

    .hand.second::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 0.16rem;
      height: 18%;
      background: var(--second);
      transform: translateX(-50%);
      border-radius: 999px;
    }

    .pivot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      background: var(--accent);
      border: 0.18rem solid var(--face);
      transform: translate(-50%, -50%);
      z-index: 5;
      box-shadow: 0 0 0.8rem var(--glow);
    }

    .digital {
      text-align: center;
      display: grid;
      gap: 0.35rem;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .time .seconds {
      color: var(--second);
      font-weight: 500;
    }

    .date {
      color: var(--muted);
      font-size: clamp(0.95rem, 2.8vw, 1.1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .timezone {
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Clock">
    <div class="clock-face" id="face" aria-hidden="true">
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
      <div class="pivot"></div>
    </div>

    <section class="digital" aria-live="polite">
      <div class="time" id="digitalTime">00:00:00</div>
      <div class="date" id="digitalDate">Loading…</div>
      <div class="timezone" id="timezone"></div>
    </section>
  </main>

  <script>
    (function () {
      const face = document.getElementById("face");
      const hourHand = document.getElementById("hourHand");
      const minuteHand = document.getElementById("minuteHand");
      const secondHand = document.getElementById("secondHand");
      const digitalTime = document.getElementById("digitalTime");
      const digitalDate = document.getElementById("digitalDate");
      const timezoneEl = document.getElementById("timezone");

      for (let i = 0; i < 60; i++) {
        const tick = document.createElement("div");
        tick.className = "tick" + (i % 5 === 0 ? " hour" : "");
        tick.style.setProperty("--angle", (i * 6) + "deg");
        face.appendChild(tick);
      }

      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const dateFormatter = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      timezoneEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function update() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ms = now.getMilliseconds();

        const secondDeg = (seconds + ms / 1000) * 6;
        const minuteDeg = (minutes + seconds / 60) * 6;
        const hourDeg = ((hours % 12) + minutes / 60) * 30;

        hourHand.style.transform = "rotate(" + hourDeg + "deg)";
        minuteHand.style.transform = "rotate(" + minuteDeg + "deg)";
        secondHand.style.transform = "rotate(" + secondDeg + "deg)";

        digitalTime.innerHTML =
          pad(hours) + ":" + pad(minutes) + ':<span class="seconds">' + pad(seconds) + "</span>";
        digitalDate.textContent = dateFormatter.format(now);
      }

      update();
      setInterval(update, 50);
    })();
  </script>
</body>
</html>
