<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", Courier, monospace;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #000;
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    font-size: 18px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
  }
  #hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #score, #high, #lives, #level {
    line-height: 1.4;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0,0,0,0.55);
    pointer-events: none;
    transition: opacity 0.25s;
  }
  #overlay.hidden { opacity: 0; }
  #overlay h1 {
    font-size: clamp(36px, 8vw, 72px);
    letter-spacing: 10px;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }
  #overlay p {
    font-size: clamp(14px, 2.5vw, 18px);
    letter-spacing: 2px;
    opacity: 0.9;
    margin: 6px 0;
    line-height: 1.6;
  }
  #overlay .blink {
    animation: blink 1.1s step-end infinite;
    margin-top: 28px;
    font-size: clamp(16px, 3vw, 20px);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  #controls-hint {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.55;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="hud">
    <div id="hud-top">
      <div>
        <div id="score">SCORE 0</div>
        <div id="lives">SHIPS ▲▲▲</div>
      </div>
      <div style="text-align:right">
        <div id="high">HI 0</div>
        <div id="level">WAVE 1</div>
      </div>
    </div>
  </div>
  <div id="overlay">
    <h1>ASTEROIDS</h1>
    <p>DESTROY THE ROCKS · SURVIVE THE VOID</p>
    <p class="blink">PRESS ENTER OR SPACE TO START</p>
  </div>
  <div id="controls-hint">← → ROTATE · ↑ THRUST · SPACE FIRE · DOWN / H HYPERSPACE · P PAUSE</div>
</div>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const highEl = document.getElementById("high");
  const levelEl = document.getElementById("level");

  const W = canvas.width;
  const H = canvas.height;
  const TAU = Math.PI * 2;

  const STATE = { TITLE: 0, PLAYING: 1, DYING: 2, GAMEOVER: 3, PAUSED: 4 };
  let state = STATE.TITLE;
  let score = 0;
  let highScore = Number(localStorage.getItem("asteroids-hi") || 0);
  let lives = 3;
  let wave = 1;
  let invuln = 0;
  let dieTimer = 0;
  let spawnTimer = 0;
  let flash = 0;

  const keys = Object.create(null);
  const ship = {
    x: W / 2, y: H / 2, vx: 0, vy: 0,
    angle: -Math.PI / 2, radius: 12, thrusting: false
  };
  let asteroids = [];
  let bullets = [];
  let particles = [];
  let saucer = null;
  let saucerBullets = [];
  let saucerTimer = 0;
  let hyperspaceCooldown = 0;

  // --- Audio (Web Audio beeps) ---
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, vol, slide) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function sfxFire() { beep(880, 0.08, "square", 0.06, 220); }
  function sfxThrust() { beep(55 + Math.random() * 30, 0.05, "sawtooth", 0.03); }
  function sfxBoom(size) {
    const f = size === 3 ? 80 : size === 2 ? 120 : 180;
    beep(f, 0.35, "sawtooth", 0.12, 40);
    beep(f * 1.5, 0.2, "square", 0.06, 60);
  }
  function sfxDie() { beep(200, 0.5, "sawtooth", 0.1, 40); beep(150, 0.6, "triangle", 0.08, 30); }
  function sfxHyper() { beep(400, 0.15, "sine", 0.08, 1200); }
  function sfxExtra() { beep(523, 0.1, "square", 0.08); setTimeout(() => beep(659, 0.1, "square", 0.08), 100); setTimeout(() => beep(784, 0.15, "square", 0.08), 200); }
  function sfxSaucer() { beep(600 + Math.sin(performance.now() / 80) * 80, 0.06, "triangle", 0.04); }

  // --- Helpers ---
  function rand(a, b) { return a + Math.random() * (b - a); }
  function wrap(v, max) { return ((v % max) + max) % max; }
  function dist(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function polar(angle, len) {
    return { x: Math.cos(angle) * len, y: Math.sin(angle) * len };
  }

  function updateHUD() {
    scoreEl.textContent = "SCORE " + score;
    highEl.textContent = "HI " + highScore;
    levelEl.textContent = "WAVE " + wave;
    const icons = "▲".repeat(Math.max(0, lives));
    livesEl.textContent = "SHIPS " + (icons || "—");
  }

  function setOverlay(html, show) {
    if (show === false) {
      overlay.classList.add("hidden");
      return;
    }
    overlay.innerHTML = html;
    overlay.classList.remove("hidden");
  }

  // --- Entities ---
  function makeAsteroid(x, y, size) {
    const verts = 8 + Math.floor(Math.random() * 5);
    const radii = [];
    for (let i = 0; i < verts; i++) radii.push(rand(0.65, 1.1));
    const speed = size === 3 ? rand(0.4, 1.1) : size === 2 ? rand(0.8, 1.8) : rand(1.2, 2.6);
    const a = rand(0, TAU);
    return {
      x, y,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      angle: rand(0, TAU),
      spin: rand(-0.03, 0.03),
      size, // 3 large, 2 med, 1 small
      radius: size === 3 ? 42 : size === 2 ? 24 : 12,
      verts, radii
    };
  }

  function spawnWave(n) {
    asteroids = [];
    const count = Math.min(4 + n, 12);
    for (let i = 0; i < count; i++) {
      let x, y;
      do {
        x = rand(0, W);
        y = rand(0, H);
      } while (dist(x, y, ship.x, ship.y) < 160);
      asteroids.push(makeAsteroid(x, y, 3));
    }
  }

  function resetShip() {
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.thrusting = false;
    invuln = 2.5;
  }

  function explode(x, y, n, color, speed) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU);
      const s = rand(0.5, speed || 4);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(0.3, 1.0),
        max: 1,
        color: color || "#fff",
        size: rand(1, 2.5)
      });
    }
  }

  function splitAsteroid(a) {
    sfxBoom(a.size);
    const pts = a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
    score += pts;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem("asteroids-hi", String(highScore));
    }
    // Extra life every 10000
    if (Math.floor((score - pts) / 10000) < Math.floor(score / 10000)) {
      lives++;
      sfxExtra();
    }
    updateHUD();
    explode(a.x, a.y, 8 + a.size * 4, "#fff", 3 + a.size);
    if (a.size > 1) {
      for (let i = 0; i < 2; i++) {
        const child = makeAsteroid(a.x, a.y, a.size - 1);
        child.vx += a.vx * 0.3;
        child.vy += a.vy * 0.3;
        asteroids.push(child);
      }
    }
  }

  function fireBullet() {
    if (bullets.length >= 6) return;
    const tip = polar(ship.angle, ship.radius + 2);
    bullets.push({
      x: ship.x + tip.x,
      y: ship.y + tip.y,
      vx: Math.cos(ship.angle) * 9 + ship.vx * 0.2,
      vy: Math.sin(ship.angle) * 9 + ship.vy * 0.2,
      life: 1.1
    });
    sfxFire();
  }

  function doHyperspace() {
    if (hyperspaceCooldown > 0 || invuln > 0) return;
    sfxHyper();
    explode(ship.x, ship.y, 12, "#8cf", 2);
    ship.x = rand(40, W - 40);
    ship.y = rand(40, H - 40);
    ship.vx *= 0.2;
    ship.vy *= 0.2;
    hyperspaceCooldown = 1.5;
    // 10% chance to die on hyperspace (classic risk)
    if (Math.random() < 0.1) {
      killShip();
      return;
    }
    invuln = 1.2;
  }

  function killShip() {
    if (state !== STATE.PLAYING) return;
    sfxDie();
    explode(ship.x, ship.y, 30, "#fff", 5);
    explode(ship.x, ship.y, 12, "#f84", 3);
    lives--;
    updateHUD();
    state = STATE.DYING;
    dieTimer = 1.8;
    ship.thrusting = false;
  }

  function spawnSaucer() {
    const big = Math.random() < 0.45 || score < 10000;
    const fromLeft = Math.random() < 0.5;
    saucer = {
      x: fromLeft ? -20 : W + 20,
      y: rand(60, H - 60),
      vx: (fromLeft ? 1 : -1) * (big ? 1.4 : 2.2),
      vy: 0,
      big,
      radius: big ? 18 : 10,
      shootTimer: rand(0.8, 1.6),
      wobble: 0
    };
  }

  function startGame() {
    ensureAudio();
    score = 0;
    lives = 3;
    wave = 1;
    bullets = [];
    particles = [];
    saucer = null;
    saucerBullets = [];
    saucerTimer = 12;
    hyperspaceCooldown = 0;
    resetShip();
    spawnWave(wave);
    state = STATE.PLAYING;
    setOverlay("", false);
    updateHUD();
  }

  function nextWave() {
    wave++;
    updateHUD();
    spawnTimer = 1.5;
    bullets = [];
    saucerBullets = [];
    flash = 0.4;
  }

  // --- Input ---
  let fireHeld = false;
  let fireCooldown = 0;
  let hyperHeld = false;

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," ","space","enter","p","h","w","a","s","d"].includes(k) ||
        e.code === "Space") {
      e.preventDefault();
    }
    keys[e.code] = true;
    keys[k] = true;

    if (state === STATE.TITLE || state === STATE.GAMEOVER) {
      if (e.code === "Enter" || e.code === "Space") startGame();
      return;
    }
    if (e.code === "KeyP" || k === "p") {
      if (state === STATE.PLAYING) {
        state = STATE.PAUSED;
        setOverlay('<h1>PAUSED</h1><p class="blink">PRESS P TO RESUME</p>', true);
      } else if (state === STATE.PAUSED) {
        state = STATE.PLAYING;
        setOverlay("", false);
      }
    }
  });

  window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
    keys[e.key.toLowerCase()] = false;
    if (e.code === "Space") fireHeld = false;
    if (e.code === "ArrowDown" || e.code === "KeyH" || e.code === "KeyS") hyperHeld = false;
  });

  // Touch / click to start
  canvas.addEventListener("pointerdown", () => {
    ensureAudio();
    if (state === STATE.TITLE || state === STATE.GAMEOVER) startGame();
  });

  // --- Update ---
  function update(dt) {
    if (flash > 0) flash -= dt;
    if (state === STATE.PAUSED || state === STATE.TITLE) return;

    // Particles always
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state === STATE.DYING) {
      dieTimer -= dt;
      // Still move rocks
      updateAsteroids(dt);
      updateSaucer(dt);
      if (dieTimer <= 0) {
        if (lives <= 0) {
          state = STATE.GAMEOVER;
          setOverlay(
            '<h1>GAME OVER</h1><p>SCORE ' + score + '</p><p class="blink">PRESS ENTER OR SPACE TO RESTART</p>',
            true
          );
        } else {
          resetShip();
          state = STATE.PLAYING;
        }
      }
      return;
    }

    if (state !== STATE.PLAYING) return;

    if (spawnTimer > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) spawnWave(wave);
    }

    if (invuln > 0) invuln -= dt;
    if (hyperspaceCooldown > 0) hyperspaceCooldown -= dt;
    if (fireCooldown > 0) fireCooldown -= dt;

    // Ship controls
    const left = keys["ArrowLeft"] || keys["KeyA"] || keys["a"];
    const right = keys["ArrowRight"] || keys["KeyD"] || keys["d"];
    const thrust = keys["ArrowUp"] || keys["KeyW"] || keys["w"];
    const fire = keys["Space"] || keys[" "];
    const hyper = keys["ArrowDown"] || keys["KeyH"] || keys["KeyS"] || keys["h"] || keys["s"];

    if (left) ship.angle -= 4.2 * dt;
    if (right) ship.angle += 4.2 * dt;

    ship.thrusting = !!thrust;
    if (thrust) {
      const acc = 180 * dt;
      ship.vx += Math.cos(ship.angle) * acc * 0.016 * 60;
      ship.vy += Math.sin(ship.angle) * acc * 0.016 * 60;
      // Normalize thrust feel
      ship.vx += Math.cos(ship.angle) * 0.12;
      ship.vy += Math.sin(ship.angle) * 0.12;
      if (Math.random() < 0.4) sfxThrust();
      // Exhaust
      const back = polar(ship.angle + Math.PI, ship.radius);
      particles.push({
        x: ship.x + back.x + rand(-2, 2),
        y: ship.y + back.y + rand(-2, 2),
        vx: -Math.cos(ship.angle) * rand(1, 3) + ship.vx * 0.2,
        vy: -Math.sin(ship.angle) * rand(1, 3) + ship.vy * 0.2,
        life: rand(0.15, 0.35),
        max: 0.35,
        color: Math.random() < 0.5 ? "#fd4" : "#f84",
        size: rand(1, 2)
      });
    }

    // Drag
    ship.vx *= 0.995;
    ship.vy *= 0.995;
    const spd = Math.hypot(ship.vx, ship.vy);
    if (spd > 8) {
      ship.vx = (ship.vx / spd) * 8;
      ship.vy = (ship.vy / spd) * 8;
    }

    ship.x = wrap(ship.x + ship.vx, W);
    ship.y = wrap(ship.y + ship.vy, H);

    if (fire && fireCooldown <= 0) {
      fireBullet();
      fireCooldown = 0.18;
    }

    if (hyper && !hyperHeld) {
      hyperHeld = true;
      doHyperspace();
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x = wrap(b.x + b.vx, W);
      b.y = wrap(b.y + b.vy, H);
      b.life -= dt;
      if (b.life <= 0) bullets.splice(i, 1);
    }

    updateAsteroids(dt);
    updateSaucer(dt);

    // Collisions: bullets vs asteroids
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (dist(b.x, b.y, a.x, a.y) < a.radius) {
          bullets.splice(i, 1);
          asteroids.splice(j, 1);
          splitAsteroid(a);
          hit = true;
          break;
        }
      }
      if (hit) continue;
      // Bullets vs saucer
      if (saucer && dist(b.x, b.y, saucer.x, saucer.y) < saucer.radius) {
        bullets.splice(i, 1);
        score += saucer.big ? 200 : 1000;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("asteroids-hi", String(highScore));
        }
        updateHUD();
        sfxBoom(saucer.big ? 2 : 1);
        explode(saucer.x, saucer.y, 20, "#8f8", 4);
        saucer = null;
        saucerTimer = rand(10, 20);
      }
    }

    // Ship vs asteroids
    if (invuln <= 0) {
      for (const a of asteroids) {
        if (dist(ship.x, ship.y, a.x, a.y) < a.radius + ship.radius * 0.7) {
          killShip();
          break;
        }
      }
      if (state === STATE.PLAYING && saucer &&
          dist(ship.x, ship.y, saucer.x, saucer.y) < saucer.radius + ship.radius * 0.7) {
        killShip();
      }
      // Saucer bullets
      if (state === STATE.PLAYING) {
        for (let i = saucerBullets.length - 1; i >= 0; i--) {
          const b = saucerBullets[i];
          if (dist(ship.x, ship.y, b.x, b.y) < ship.radius) {
            saucerBullets.splice(i, 1);
            killShip();
            break;
          }
        }
      }
    }

    // Wave clear
    if (asteroids.length === 0 && spawnTimer <= 0 && state === STATE.PLAYING) {
      nextWave();
    }
  }

  function updateAsteroids(dt) {
    for (const a of asteroids) {
      a.x = wrap(a.x + a.vx, W);
      a.y = wrap(a.y + a.vy, H);
      a.angle += a.spin;
    }
  }

  function updateSaucer(dt) {
    // Saucer bullets
    for (let i = saucerBullets.length - 1; i >= 0; i--) {
      const b = saucerBullets[i];
      b.x = wrap(b.x + b.vx, W);
      b.y = wrap(b.y + b.vy, H);
      b.life -= dt;
      if (b.life <= 0) saucerBullets.splice(i, 1);
    }

    if (state !== STATE.PLAYING && state !== STATE.DYING) return;

    if (!saucer) {
      saucerTimer -= dt;
      if (saucerTimer <= 0 && state === STATE.PLAYING && asteroids.length > 0) {
        spawnSaucer();
      }
      return;
    }

    saucer.wobble += dt;
    saucer.vy = Math.sin(saucer.wobble * 2.2) * 1.2;
    saucer.x += saucer.vx;
    saucer.y = wrap(saucer.y + saucer.vy, H);

    if (Math.random() < 0.08) sfxSaucer();

    saucer.shootTimer -= dt;
    if (saucer.shootTimer <= 0 && state === STATE.PLAYING) {
      saucer.shootTimer = saucer.big ? rand(1.0, 1.8) : rand(0.6, 1.1);
      let ang;
      if (saucer.big) {
        ang = rand(0, TAU);
      } else {
        // Small saucer aims at ship with slight error
        ang = Math.atan2(ship.y - saucer.y, ship.x - saucer.x) + rand(-0.25, 0.25);
      }
      const spd = saucer.big ? 4 : 5.5;
      saucerBullets.push({
        x: saucer.x, y: saucer.y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 2.2
      });
      beep(300, 0.05, "square", 0.05);
    }

    if (saucer.x < -40 || saucer.x > W + 40) {
      saucer = null;
      saucerTimer = rand(12, 22);
    }
  }

  // --- Draw ---
  function strokePoly(pts, closed) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    if (closed !== false) ctx.closePath();
    ctx.stroke();
  }

  function drawShip(x, y, angle, thrusting, ghost) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.strokeStyle = ghost ? "rgba(255,255,255,0.35)" : "#fff";
    ctx.lineWidth = 1.5;
    strokePoly([
      { x: 14, y: 0 },
      { x: -10, y: 9 },
      { x: -6, y: 0 },
      { x: -10, y: -9 }
    ]);
    if (thrusting && (!ghost || Math.random() > 0.3)) {
      ctx.strokeStyle = ghost ? "rgba(255,180,80,0.4)" : "#fd6";
      strokePoly([
        { x: -6, y: 0 },
        { x: -14 - Math.random() * 4, y: 0 },
        { x: -8, y: 4 },
        { x: -6, y: 0 },
        { x: -8, y: -4 }
      ], false);
    }
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < a.verts; i++) {
      const ang = (i / a.verts) * TAU;
      const r = a.radius * a.radii[i];
      const px = Math.cos(ang) * r;
      const py = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawSaucer(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.strokeStyle = "#8f8";
    ctx.lineWidth = 1.5;
    const r = s.radius;
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(-r * 0.5, -r * 0.45);
    ctx.lineTo(r * 0.5, -r * 0.45);
    ctx.lineTo(r, 0);
    ctx.lineTo(r * 0.55, r * 0.35);
    ctx.lineTo(-r * 0.55, r * 0.35);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 0.45);
    ctx.quadraticCurveTo(0, -r * 0.9, r * 0.5, -r * 0.45);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(r, 0);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // Starfield
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 97) % W);
      const sy = ((i * 53) % H);
      const twinkle = (Math.sin(performance.now() / 400 + i) + 1) * 0.5;
      ctx.globalAlpha = 0.15 + twinkle * 0.35;
      ctx.fillRect(sx, sy, (i % 5 === 0) ? 2 : 1, (i % 5 === 0) ? 2 : 1);
    }
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.25) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    // Asteroids
    for (const a of asteroids) drawAsteroid(a);

    // Bullets
    ctx.fillStyle = "#fff";
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = "#8f8";
    for (const b of saucerBullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.2, 0, TAU);
      ctx.fill();
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / (p.max || 1));
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    if (saucer) drawSaucer(saucer);

    // Ship
    if (state === STATE.PLAYING || state === STATE.PAUSED) {
      const ghost = invuln > 0 && Math.floor(invuln * 10) % 2 === 0;
      if (!(invuln > 0 && Math.floor(invuln * 12) % 2 === 0)) {
        drawShip(ship.x, ship.y, ship.angle, ship.thrusting, false);
      }
      // Screen wrap ghosts near edges
      const m = 20;
      if (ship.x < m) drawShip(ship.x + W, ship.y, ship.angle, ship.thrusting, true);
      if (ship.x > W - m) drawShip(ship.x - W, ship.y, ship.angle, ship.thrusting, true);
      if (ship.y < m) drawShip(ship.x, ship.y + H, ship.angle, ship.thrusting, true);
      if (ship.y > H - m) drawShip(ship.x, ship.y - H, ship.angle, ship.thrusting, true);
    }

    // Title idle rocks
    if (state === STATE.TITLE && asteroids.length === 0) {
      spawnWave(1);
    }
  }

  // --- Loop ---
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  updateHUD();
  // Gentle drift on title
  spawnWave(1);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
