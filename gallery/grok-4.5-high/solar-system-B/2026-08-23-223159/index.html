<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniature Solar System</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --panel: rgba(8, 12, 24, 0.72);
      --panel-border: rgba(160, 190, 255, 0.18);
      --text: #e8eefc;
      --muted: #93a0c0;
      --accent: #7eb6ff;
      --accent-soft: rgba(126, 182, 255, 0.15);
      --danger: #ff8b7a;
      --ok: #7dffb3;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #10182b 0%, var(--bg) 65%);
      color: var(--text);
      font-family: var(--font);
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .hud > * { pointer-events: auto; }

    .top-bar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      max-width: min(420px, 100%);
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: var(--shadow);
    }

    button, select {
      appearance: none;
      border: 1px solid transparent;
      background: var(--accent-soft);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.84rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 120ms ease;
    }

    button:hover, select:hover {
      background: rgba(126, 182, 255, 0.28);
      border-color: rgba(126, 182, 255, 0.35);
    }

    button:active { transform: translateY(1px); }

    button:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button[aria-pressed="true"] {
      background: rgba(126, 255, 179, 0.18);
      border-color: rgba(126, 255, 179, 0.4);
      color: var(--ok);
    }

    select {
      padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .speed {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px 0 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .speed input[type="range"] {
      width: 110px;
      accent-color: var(--accent);
    }

    .info {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: min(340px, calc(100% - 36px));
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      min-height: 118px;
    }

    .info .label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    .info h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 650;
    }

    .info p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .hint {
      position: absolute;
      right: 18px;
      bottom: 18px;
      color: var(--muted);
      font-size: 0.78rem;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: var(--shadow);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    @media (max-width: 720px) {
      .top-bar { top: 12px; left: 12px; right: 12px; }
      .info { left: 12px; bottom: 12px; }
      .hint {
        left: 12px;
        right: 12px;
        bottom: auto;
        top: auto;
        position: absolute;
        transform: translateY(-100%);
        bottom: calc(12px + 130px);
        text-align: center;
      }
      .brand h1 { font-size: 1rem; }
      .speed input[type="range"] { width: 80px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button, select { transition: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap" aria-hidden="true"></div>

  <div class="hud">
    <div class="top-bar">
      <header class="brand">
        <h1>Miniature Solar System</h1>
        <p>A quiet orbitarium — drag to look around, scroll to zoom, click a world to learn its story.</p>
      </header>

      <div class="controls" role="toolbar" aria-label="Simulation controls">
        <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
        <button type="button" id="btn-orbits" aria-pressed="true">Orbits</button>
        <button type="button" id="btn-reset">Reset view</button>
        <label class="speed" for="speed">
          Speed
          <input id="speed" type="range" min="0" max="4" step="0.05" value="1" />
        </label>
        <label class="sr-only" for="focus">Focus body</label>
        <select id="focus" aria-label="Focus body">
          <option value="system">Whole system</option>
        </select>
      </div>
    </div>

    <aside class="info" aria-live="polite">
      <div class="label">Selected</div>
      <h2 id="info-title">Sol</h2>
      <p id="info-body">The heart of this miniature system — a warm point of light that keeps every orbit in time.</p>
    </aside>

    <div class="hint">Drag · Scroll · Click planets · Space pauses</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const BODIES = [
      {
        id: "sun",
        name: "Sol",
        kind: "star",
        radius: 2.4,
        color: 0xffd27a,
        emissive: 0xffb347,
        distance: 0,
        period: 0,
        tilt: 0,
        spin: 0.004,
        description: "The heart of this miniature system — a warm point of light that keeps every orbit in time."
      },
      {
        id: "mercury",
        name: "Mercury",
        kind: "planet",
        radius: 0.28,
        color: 0xb1b1b1,
        distance: 4.2,
        period: 8.8,
        tilt: 0.03,
        spin: 0.01,
        description: "A swift grey pebble hugging the sun, finishing a year while Earth is still waking up."
      },
      {
        id: "venus",
        name: "Venus",
        kind: "planet",
        radius: 0.42,
        color: 0xe8c38a,
        distance: 5.6,
        period: 16.2,
        tilt: 177 * Math.PI / 180,
        spin: -0.004,
        description: "Veiled in pale gold, Venus turns the other way — a bright neighbor with a stubborn spin."
      },
      {
        id: "earth",
        name: "Earth",
        kind: "planet",
        radius: 0.46,
        color: 0x4f8fdd,
        secondary: 0x3f9b6a,
        distance: 7.2,
        period: 24,
        tilt: 23.4 * Math.PI / 180,
        spin: 0.02,
        description: "Home scale for this model: blue oceans, green continents, and one loyal moon in tow.",
        moons: [{ name: "Moon", radius: 0.14, color: 0xc9c9c9, distance: 1.05, period: 4.2 }]
      },
      {
        id: "mars",
        name: "Mars",
        kind: "planet",
        radius: 0.34,
        color: 0xc45a3a,
        distance: 9.0,
        period: 36,
        tilt: 25 * Math.PI / 180,
        spin: 0.018,
        description: "A rust-red wanderer with a longer year and the quiet romance of distant deserts."
      },
      {
        id: "jupiter",
        name: "Jupiter",
        kind: "planet",
        radius: 1.15,
        color: 0xd6b089,
        bands: true,
        distance: 12.6,
        period: 72,
        tilt: 3 * Math.PI / 180,
        spin: 0.04,
        description: "The system’s gentle giant — striped and steady, sweeping a wide quiet lane."
      },
      {
        id: "saturn",
        name: "Saturn",
        kind: "planet",
        radius: 0.95,
        color: 0xe6d3a3,
        distance: 16.4,
        period: 100,
        tilt: 26.7 * Math.PI / 180,
        spin: 0.035,
        rings: { inner: 1.25, outer: 2.15, color: 0xd8c7a0, opacity: 0.7 },
        description: "Famous for its lace of rings: a soft halo that turns every glance into a postcard."
      },
      {
        id: "uranus",
        name: "Uranus",
        kind: "planet",
        radius: 0.62,
        color: 0x9ad7e0,
        distance: 19.8,
        period: 140,
        tilt: 97.8 * Math.PI / 180,
        spin: 0.02,
        description: "Ice-blue and tipped on its side, Uranus rolls along its orbit like a quiet clockwork oddity."
      },
      {
        id: "neptune",
        name: "Neptune",
        kind: "planet",
        radius: 0.6,
        color: 0x4169e8,
        distance: 23.2,
        period: 180,
        tilt: 28 * Math.PI / 180,
        spin: 0.022,
        description: "The outer deep-blue world — farthest lantern in this miniature night."
      }
    ];

    const wrap = document.getElementById("canvas-wrap");
    const infoTitle = document.getElementById("info-title");
    const infoBody = document.getElementById("info-body");
    const btnPause = document.getElementById("btn-pause");
    const btnOrbits = document.getElementById("btn-orbits");
    const btnReset = document.getElementById("btn-reset");
    const speedInput = document.getElementById("speed");
    const focusSelect = document.getElementById("focus");

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070f, 0.012);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 18, 32);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);
    renderer.domElement.setAttribute("tabindex", "0");
    renderer.domElement.setAttribute("aria-label", "Interactive 3D solar system canvas");

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 4;
    controls.maxDistance = 90;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.set(0, 0, 0);

    // Starfield
    {
      const count = 2800;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();
      for (let i = 0; i < count; i++) {
        const r = 60 + Math.random() * 140;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
        const t = Math.random();
        if (t > 0.85) color.setHSL(0.6, 0.4, 0.85);
        else if (t > 0.7) color.setHSL(0.08, 0.5, 0.8);
        else color.setHSL(0.55, 0.05, 0.7 + Math.random() * 0.3);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.18,
        vertexColors: true,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      });
      scene.add(new THREE.Points(geo, mat));
    }

    // Soft ambient + sun light
    scene.add(new THREE.AmbientLight(0x1a2238, 0.55));
    const sunLight = new THREE.PointLight(0xfff0d0, 120, 80, 2);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    scene.add(new THREE.HemisphereLight(0x224466, 0x08060a, 0.35));

    const root = new THREE.Group();
    scene.add(root);

    const orbitGroup = new THREE.Group();
    root.add(orbitGroup);

    const bodyNodes = new Map();
    const pickables = [];
    const clock = new THREE.Clock();
    let simTime = 0;
    let paused = reducedMotion;
    let speed = reducedMotion ? 0.35 : 1;
    let showOrbits = true;
    let focusId = "system";
    let selectedId = "sun";

    function makePlanetTexture(base, options = {}) {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const c = new THREE.Color(base);
      ctx.fillStyle = `#${c.getHexString()}`;
      ctx.fillRect(0, 0, size, size);

      if (options.bands) {
        for (let y = 0; y < size; y++) {
          const n = Math.sin(y * 0.35) * 0.5 + Math.sin(y * 0.11) * 0.5;
          const shade = 0.85 + n * 0.15;
          ctx.fillStyle = `rgba(0,0,0,${0.12 + (1 - shade) * 0.25})`;
          ctx.fillRect(0, y, size, 1);
          ctx.fillStyle = `rgba(255,255,255,${0.04 + shade * 0.05})`;
          ctx.fillRect(0, y + 1, size, 1);
        }
      } else if (options.secondary != null) {
        const c2 = new THREE.Color(options.secondary);
        ctx.fillStyle = `#${c2.getHexString()}`;
        for (let i = 0; i < 18; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const w = 10 + Math.random() * 28;
          const h = 6 + Math.random() * 16;
          ctx.globalAlpha = 0.45 + Math.random() * 0.35;
          ctx.beginPath();
          ctx.ellipse(x, y, w, h, Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else {
        for (let i = 0; i < 40; i++) {
          const shade = Math.random() > 0.5 ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.12)";
          ctx.fillStyle = shade;
          ctx.beginPath();
          ctx.arc(Math.random() * size, Math.random() * size, 1 + Math.random() * 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function makeOrbitLine(radius) {
      const pts = [];
      const segments = 128;
      for (let i = 0; i <= segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({
        color: 0x6f88b8,
        transparent: true,
        opacity: 0.28,
        depthWrite: false
      });
      return new THREE.LineLoop(geo, mat);
    }

    function createBody(def) {
      const pivot = new THREE.Object3D();
      root.add(pivot);

      const meshGroup = new THREE.Group();
      pivot.add(meshGroup);

      let mesh;
      if (def.kind === "star") {
        const geo = new THREE.SphereGeometry(def.radius, 48, 48);
        const mat = new THREE.MeshBasicMaterial({ color: def.color });
        mesh = new THREE.Mesh(geo, mat);

        const glowGeo = new THREE.SphereGeometry(def.radius * 1.35, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
          color: def.emissive,
          transparent: true,
          opacity: 0.22,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        mesh.add(new THREE.Mesh(glowGeo, glowMat));

        const coronaGeo = new THREE.SphereGeometry(def.radius * 1.9, 32, 32);
        const coronaMat = new THREE.MeshBasicMaterial({
          color: 0xffc978,
          transparent: true,
          opacity: 0.08,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        mesh.add(new THREE.Mesh(coronaGeo, coronaMat));
      } else {
        const geo = new THREE.SphereGeometry(def.radius, 40, 40);
        const mat = new THREE.MeshStandardMaterial({
          map: makePlanetTexture(def.color, { bands: def.bands, secondary: def.secondary }),
          roughness: 0.72,
          metalness: 0.08,
          color: 0xffffff
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = false;
        mesh.receiveShadow = false;

        if (def.rings) {
          const ringGeo = new THREE.RingGeometry(def.radius * def.rings.inner, def.radius * def.rings.outer, 96);
          const pos = ringGeo.attributes.position;
          const uv = ringGeo.attributes.uv;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            const len = Math.sqrt(x * x + y * y);
            uv.setXY(i, (len - def.radius * def.rings.inner) / (def.radius * (def.rings.outer - def.rings.inner)), 0.5);
          }
          const ringMat = new THREE.MeshBasicMaterial({
            color: def.rings.color,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: def.rings.opacity,
            depthWrite: false
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2;
          mesh.add(ring);
        }
      }

      mesh.userData.bodyId = def.id;
      meshGroup.add(mesh);
      meshGroup.rotation.z = def.tilt || 0;
      pickables.push(mesh);

      const moons = [];
      if (def.moons) {
        for (const m of def.moons) {
          const moonPivot = new THREE.Object3D();
          meshGroup.add(moonPivot);
          const moonGeo = new THREE.SphereGeometry(m.radius, 20, 20);
          const moonMat = new THREE.MeshStandardMaterial({
            color: m.color,
            roughness: 0.9,
            metalness: 0.05
          });
          const moonMesh = new THREE.Mesh(moonGeo, moonMat);
          moonMesh.position.x = m.distance;
          moonMesh.userData.bodyId = def.id;
          moonPivot.add(moonMesh);
          pickables.push(moonMesh);
          moons.push({ pivot: moonPivot, period: m.period, angle: Math.random() * Math.PI * 2 });

          const moonOrbit = makeOrbitLine(m.distance);
          moonOrbit.material.opacity = 0.18;
          meshGroup.add(moonOrbit);
        }
      }

      let orbitLine = null;
      if (def.distance > 0) {
        orbitLine = makeOrbitLine(def.distance);
        orbitGroup.add(orbitLine);
      }

      const node = {
        def,
        pivot,
        meshGroup,
        mesh,
        orbitLine,
        moons,
        angle: Math.random() * Math.PI * 2
      };
      bodyNodes.set(def.id, node);

      const opt = document.createElement("option");
      opt.value = def.id;
      opt.textContent = def.name;
      focusSelect.appendChild(opt);

      return node;
    }

    for (const def of BODIES) createBody(def);

    // Subtle ecliptic dust disc
    {
      const discGeo = new THREE.RingGeometry(3.5, 24, 96);
      const discMat = new THREE.MeshBasicMaterial({
        color: 0x6a7fb0,
        transparent: true,
        opacity: 0.035,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const disc = new THREE.Mesh(discGeo, discMat);
      disc.rotation.x = -Math.PI / 2;
      root.add(disc);
    }

    function setSelected(id) {
      const def = BODIES.find((b) => b.id === id) || BODIES[0];
      selectedId = def.id;
      infoTitle.textContent = def.name;
      infoBody.textContent = def.description;
    }

    function setFocus(id) {
      focusId = id;
      focusSelect.value = id;
      if (id === "system") {
        controls.minDistance = 4;
        animateCameraTo(new THREE.Vector3(0, 18, 32), new THREE.Vector3(0, 0, 0), 1.1);
      } else {
        const node = bodyNodes.get(id);
        if (!node) return;
        const world = new THREE.Vector3();
        node.mesh.getWorldPosition(world);
        const offset = new THREE.Vector3(2.8 + node.def.radius * 2.2, 1.4 + node.def.radius, 3.2 + node.def.radius * 2);
        animateCameraTo(world.clone().add(offset), world, 0.9);
        setSelected(id);
      }
    }

    let camTween = null;
    function animateCameraTo(pos, target, duration) {
      if (reducedMotion) {
        camera.position.copy(pos);
        controls.target.copy(target);
        controls.update();
        return;
      }
      camTween = {
        t0: performance.now(),
        duration: duration * 1000,
        fromPos: camera.position.clone(),
        toPos: pos.clone(),
        fromTarget: controls.target.clone(),
        toTarget: target.clone()
      };
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    // Raycasting selection
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;

    function ndcFromEvent(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    renderer.domElement.addEventListener("pointerdown", (e) => {
      pointerDown = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener("pointerup", (e) => {
      if (!pointerDown) return;
      const dx = e.clientX - pointerDown.x;
      const dy = e.clientY - pointerDown.y;
      pointerDown = null;
      if (dx * dx + dy * dy > 16) return;
      ndcFromEvent(e);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickables, true);
      if (hits.length) {
        let obj = hits[0].object;
        while (obj && !obj.userData.bodyId) obj = obj.parent;
        if (obj && obj.userData.bodyId) {
          setSelected(obj.userData.bodyId);
          focusSelect.value = obj.userData.bodyId;
          setFocus(obj.userData.bodyId);
        }
      }
    });

    btnPause.addEventListener("click", () => {
      paused = !paused;
      btnPause.setAttribute("aria-pressed", String(paused));
      btnPause.textContent = paused ? "Resume" : "Pause";
    });

    btnOrbits.addEventListener("click", () => {
      showOrbits = !showOrbits;
      orbitGroup.visible = showOrbits;
      btnOrbits.setAttribute("aria-pressed", String(showOrbits));
    });

    btnReset.addEventListener("click", () => {
      setFocus("system");
      setSelected("sun");
    });

    speedInput.value = String(speed);
    speedInput.addEventListener("input", () => {
      speed = Number(speedInput.value);
    });

    focusSelect.addEventListener("change", () => {
      setFocus(focusSelect.value);
    });

    window.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.code === "Space") {
        e.preventDefault();
        btnPause.click();
      }
      if (e.key === "r" || e.key === "R") btnReset.click();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    if (paused) {
      btnPause.setAttribute("aria-pressed", "true");
      btnPause.textContent = "Resume";
    }

    setSelected("sun");

    // Gentle intro camera
    if (!reducedMotion) {
      camera.position.set(0, 28, 48);
      animateCameraTo(new THREE.Vector3(0, 18, 32), new THREE.Vector3(0, 0, 0), 2.2);
    }

    const tmpFocus = new THREE.Vector3();

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const running = !paused ? speed : 0;
      simTime += dt * running;

      if (camTween) {
        const u = Math.min(1, (performance.now() - camTween.t0) / camTween.duration);
        const e = easeInOut(u);
        camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
        controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, e);
        if (u >= 1) camTween = null;
      } else if (focusId !== "system") {
        const node = bodyNodes.get(focusId);
        if (node) {
          node.mesh.getWorldPosition(tmpFocus);
          controls.target.lerp(tmpFocus, 1 - Math.pow(0.001, dt));
        }
      }

      for (const node of bodyNodes.values()) {
        const def = node.def;
        if (def.distance > 0 && def.period > 0) {
          node.angle += (Math.PI * 2 * running * dt) / def.period;
          node.pivot.position.set(
            Math.cos(node.angle) * def.distance,
            0,
            Math.sin(node.angle) * def.distance
          );
        }
        node.meshGroup.rotation.y += def.spin * running;
        for (const moon of node.moons) {
          moon.angle += (Math.PI * 2 * running * dt) / moon.period;
          moon.pivot.rotation.y = moon.angle;
        }
      }

      // Soft sun pulse
      const sun = bodyNodes.get("sun");
      if (sun) {
        const pulse = 1 + Math.sin(performance.now() * 0.0012) * 0.03;
        sun.mesh.scale.setScalar(pulse);
        sunLight.intensity = 110 + Math.sin(performance.now() * 0.001) * 12;
      }

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
