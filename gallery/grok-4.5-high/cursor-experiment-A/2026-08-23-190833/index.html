<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor Experiment</title>
  <style>
    :root {
      --bg: #07070b;
      --bg-elevated: #101018;
      --text: #f4f4f8;
      --muted: #9a9ab0;
      --accent: #7c5cff;
      --accent-2: #2ee6a6;
      --accent-3: #ff5c8a;
      --panel: rgba(16, 16, 24, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --radius: 18px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      cursor: none;
    }

    body.touch-mode {
      cursor: auto;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(124, 92, 255, 0.18), transparent 60%),
        radial-gradient(700px 420px at 85% 80%, rgba(46, 230, 166, 0.12), transparent 55%),
        radial-gradient(600px 400px at 50% 50%, rgba(255, 92, 138, 0.08), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      z-index: 20;
      pointer-events: none;
    }

    .hud > * {
      pointer-events: auto;
    }

    .top-bar {
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      max-width: min(420px, 100%);
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .chip strong {
      color: var(--text);
      font-weight: 600;
    }

    .dock {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, calc(100% - 24px));
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: stretch;
    }

    .modes, .controls {
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
      padding: 10px;
    }

    .modes {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .mode-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 118px;
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .mode-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, rgba(124, 92, 255, 0.22), rgba(124, 92, 255, 0.08));
      border-color: rgba(124, 92, 255, 0.45);
      color: var(--text);
    }

    .mode-btn .label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 2px;
    }

    .mode-btn .hint {
      display: block;
      font-size: 11px;
      opacity: 0.72;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      appearance: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .icon-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-btn[aria-pressed="true"] {
      background: rgba(46, 230, 166, 0.16);
      border-color: rgba(46, 230, 166, 0.4);
    }

    .help {
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: min(280px, calc(100% - 40px));
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      display: none;
    }

    .help.open {
      display: block;
    }

    .help h2 {
      font-size: 13px;
      margin-bottom: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .help ul {
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .help li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .help kbd {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
    }

    .cursor-dot,
    .cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform;
    }

    .cursor-dot {
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      background: #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.55);
      mix-blend-mode: difference;
    }

    .cursor-ring {
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      transition: width 180ms ease, height 180ms ease, margin 180ms ease, border-color 180ms ease, opacity 180ms ease;
    }

    .cursor-ring.pressed {
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border-color: var(--accent-2);
    }

    .cursor-ring.hovering {
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      border-color: var(--accent);
    }

    body.touch-mode .cursor-dot,
    body.touch-mode .cursor-ring,
    body.hide-cursor .cursor-dot,
    body.hide-cursor .cursor-ring {
      opacity: 0;
    }

    .targets {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .magnet {
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: auto;
      cursor: none;
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
      will-change: transform;
    }

    .magnet:hover,
    .magnet.near {
      border-color: rgba(124, 92, 255, 0.55);
      color: var(--text);
      background: linear-gradient(160deg, rgba(124, 92, 255, 0.18), rgba(255, 255, 255, 0.03));
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 50;
      background: rgba(16, 16, 24, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: transform 280ms ease, opacity 280ms ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 720px) {
      .dock {
        grid-template-columns: 1fr;
        bottom: 12px;
      }

      .controls {
        justify-content: center;
      }

      .help {
        top: auto;
        bottom: 120px;
        right: 12px;
        left: 12px;
        width: auto;
        transform: none;
      }

      .brand {
        padding: 12px 14px;
      }

      .mode-btn {
        min-width: 104px;
        padding: 10px 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mode-btn,
      .icon-btn,
      .cursor-ring,
      .toast,
      .magnet {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="canvas"></canvas></div>

  <div class="targets" id="targets" aria-hidden="true"></div>

  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <div class="hud top-bar">
    <div class="brand">
      <h1>Cursor Experiment</h1>
      <p id="modeCopy">Move slowly. The field remembers your path.</p>
    </div>
    <div class="stats">
      <div class="chip">mode <strong id="statMode">Trail</strong></div>
      <div class="chip">speed <strong id="statSpeed">0</strong></div>
      <div class="chip">particles <strong id="statCount">0</strong></div>
    </div>
  </div>

  <div class="hud help" id="help">
    <h2>Controls</h2>
    <ul>
      <li><span>Next / prev mode</span><span><kbd>]</kbd> <kbd>[</kbd></span></li>
      <li><span>Pause field</span><span><kbd>Space</kbd></span></li>
      <li><span>Clear canvas</span><span><kbd>C</kbd></span></li>
      <li><span>Toggle help</span><span><kbd>?</kbd></span></li>
      <li><span>Click / drag</span><span>boost effect</span></li>
    </ul>
  </div>

  <div class="hud dock">
    <div class="modes" role="tablist" aria-label="Cursor modes" id="modeList"></div>
    <div class="controls">
      <button class="icon-btn" id="pauseBtn" type="button" aria-pressed="false" title="Pause" aria-label="Pause">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>
      </button>
      <button class="icon-btn" id="clearBtn" type="button" title="Clear" aria-label="Clear">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4h10M6 4V3h4v1M5 4l.6 9h4.8L11 4"/></svg>
      </button>
      <button class="icon-btn" id="helpBtn" type="button" aria-pressed="false" title="Help" aria-label="Help">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.4 6.2a1.7 1.7 0 0 1 3.2.9c0 1-1.6 1.4-1.6 2.4"/><circle cx="8" cy="11.4" r="0.7" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const MODES = [
        {
          id: "trail",
          label: "Trail",
          hint: "Soft memory",
          copy: "Move slowly. The field remembers your path.",
        },
        {
          id: "ribbon",
          label: "Ribbon",
          hint: "Elastic stroke",
          copy: "Drag to stretch a luminous ribbon behind the cursor.",
        },
        {
          id: "orbit",
          label: "Orbit",
          hint: "Satellite swarm",
          copy: "Hold still and satellites settle. Move and they chase.",
        },
        {
          id: "magnetic",
          label: "Magnetic",
          hint: "Pull objects",
          copy: "Approach the tiles. They lean toward your cursor.",
        },
        {
          id: "ripple",
          label: "Ripple",
          hint: "Click waves",
          copy: "Click or move quickly to send ripples through the grid.",
        },
        {
          id: "pixels",
          label: "Pixels",
          hint: "Reveal mosaic",
          copy: "Paint with light. The mosaic wakes where you linger.",
        },
      ];

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: true });
      const cursorDot = document.getElementById("cursorDot");
      const cursorRing = document.getElementById("cursorRing");
      const modeList = document.getElementById("modeList");
      const modeCopy = document.getElementById("modeCopy");
      const statMode = document.getElementById("statMode");
      const statSpeed = document.getElementById("statSpeed");
      const statCount = document.getElementById("statCount");
      const pauseBtn = document.getElementById("pauseBtn");
      const clearBtn = document.getElementById("clearBtn");
      const helpBtn = document.getElementById("helpBtn");
      const help = document.getElementById("help");
      const toast = document.getElementById("toast");
      const targets = document.getElementById("targets");

      const state = {
        modeIndex: 0,
        paused: false,
        width: 0,
        height: 0,
        dpr: 1,
        pointer: { x: -9999, y: -9999, tx: -9999, ty: -9999, down: false, inside: false },
        prev: { x: -9999, y: -9999 },
        speed: 0,
        particles: [],
        ribbon: [],
        orbits: [],
        ripples: [],
        magnets: [],
        mosaic: null,
        mosaicCols: 0,
        mosaicRows: 0,
        grid: null,
        lastToast: 0,
        reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
        isTouch: false,
      };

      function currentMode() {
        return MODES[state.modeIndex];
      }

      function showToast(message) {
        const now = performance.now();
        if (now - state.lastToast < 500) return;
        state.lastToast = now;
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
      }

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        canvas.style.width = state.width + "px";
        canvas.style.height = state.height + "px";
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        buildMosaic();
        buildGrid();
        layoutMagnets();
      }

      function buildMosaic() {
        const cell = 18;
        state.mosaicCols = Math.ceil(state.width / cell);
        state.mosaicRows = Math.ceil(state.height / cell);
        state.mosaic = new Float32Array(state.mosaicCols * state.mosaicRows);
      }

      function buildGrid() {
        const gap = 42;
        const cols = Math.ceil(state.width / gap) + 1;
        const rows = Math.ceil(state.height / gap) + 1;
        state.grid = { gap, cols, rows, points: [] };
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            state.grid.points.push({
              x: x * gap,
              y: y * gap,
              ox: x * gap,
              oy: y * gap,
              vx: 0,
              vy: 0,
            });
          }
        }
      }

      function layoutMagnets() {
        targets.innerHTML = "";
        state.magnets = [];
        const labels = ["Pull", "Bend", "Snap", "Hold", "Drift", "Lock"];
        const positions = [
          [0.22, 0.32], [0.5, 0.28], [0.78, 0.34],
          [0.28, 0.62], [0.55, 0.68], [0.76, 0.60],
        ];
        positions.forEach((pos, i) => {
          const el = document.createElement("div");
          el.className = "magnet";
          el.textContent = labels[i];
          el.style.left = (pos[0] * state.width - 44) + "px";
          el.style.top = (pos[1] * state.height - 44) + "px";
          targets.appendChild(el);
          state.magnets.push({
            el,
            x: pos[0] * state.width,
            y: pos[1] * state.height,
            tx: pos[0] * state.width,
            ty: pos[1] * state.height,
            ox: pos[0] * state.width,
            oy: pos[1] * state.height,
          });
        });
        syncMagnetVisibility();
      }

      function syncMagnetVisibility() {
        const on = currentMode().id === "magnetic";
        targets.style.display = on ? "block" : "none";
        targets.setAttribute("aria-hidden", on ? "false" : "true");
      }

      function setMode(index, announce) {
        state.modeIndex = (index + MODES.length) % MODES.length;
        const mode = currentMode();
        [...modeList.children].forEach((btn, i) => {
          const active = i === state.modeIndex;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        modeCopy.textContent = mode.copy;
        statMode.textContent = mode.label;
        syncMagnetVisibility();
        if (announce) showToast(mode.label + " mode");
      }

      function buildModeButtons() {
        modeList.innerHTML = "";
        MODES.forEach((mode, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mode-btn" + (i === 0 ? " active" : "");
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
          btn.innerHTML = `<span class="label">${mode.label}</span><span class="hint">${mode.hint}</span>`;
          btn.addEventListener("click", () => setMode(i, true));
          btn.addEventListener("pointerenter", () => cursorRing.classList.add("hovering"));
          btn.addEventListener("pointerleave", () => cursorRing.classList.remove("hovering"));
          modeList.appendChild(btn);
        });
      }

      function clearField() {
        state.particles.length = 0;
        state.ribbon.length = 0;
        state.ripples.length = 0;
        if (state.mosaic) state.mosaic.fill(0);
        if (state.grid) {
          state.grid.points.forEach((p) => {
            p.x = p.ox;
            p.y = p.oy;
            p.vx = 0;
            p.vy = 0;
          });
        }
        state.magnets.forEach((m) => {
          m.tx = m.ox;
          m.ty = m.oy;
          m.x = m.ox;
          m.y = m.oy;
          m.el.style.transform = "translate3d(0,0,0)";
          m.el.classList.remove("near");
        });
        ctx.clearRect(0, 0, state.width, state.height);
        showToast("Cleared");
      }

      function spawnTrail(x, y, speed, boost) {
        const count = boost ? 10 : 3;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * (boost ? 18 : 8);
          state.particles.push({
            x: x + Math.cos(angle) * dist,
            y: y + Math.sin(angle) * dist,
            vx: Math.cos(angle) * (0.2 + Math.random() * 0.8) * (boost ? 2 : 1),
            vy: Math.sin(angle) * (0.2 + Math.random() * 0.8) * (boost ? 2 : 1),
            life: 1,
            decay: 0.012 + Math.random() * 0.02,
            size: 1.5 + Math.random() * 3 + Math.min(speed * 0.05, 4),
            hue: 250 + Math.random() * 80,
          });
        }
      }

      function ensureOrbits() {
        if (state.orbits.length) return;
        for (let i = 0; i < 18; i++) {
          const angle = (i / 18) * Math.PI * 2;
          const radius = 28 + (i % 6) * 10;
          state.orbits.push({
            angle,
            radius,
            speed: 0.02 + (i % 5) * 0.004,
            size: 2 + (i % 4),
            lag: 0.05 + (i % 7) * 0.01,
            x: state.pointer.x,
            y: state.pointer.y,
          });
        }
      }

      function addRipple(x, y, force) {
        state.ripples.push({
          x,
          y,
          r: 4,
          max: 80 + force * 40,
          alpha: 0.55,
          width: 2 + force * 0.5,
        });
        if (state.grid) {
          state.grid.points.forEach((p) => {
            const dx = p.x - x;
            const dy = p.y - y;
            const d = Math.hypot(dx, dy) || 1;
            if (d < 180) {
              const f = (1 - d / 180) * (1.8 + force);
              p.vx += (dx / d) * f;
              p.vy += (dy / d) * f;
            }
          });
        }
      }

      function paintMosaic(x, y, radius, amount) {
        if (!state.mosaic) return;
        const cell = 18;
        const col = Math.floor(x / cell);
        const row = Math.floor(y / cell);
        const reach = Math.ceil(radius / cell);
        for (let j = -reach; j <= reach; j++) {
          for (let i = -reach; i <= reach; i++) {
            const c = col + i;
            const r = row + j;
            if (c < 0 || r < 0 || c >= state.mosaicCols || r >= state.mosaicRows) continue;
            const cx = c * cell + cell * 0.5;
            const cy = r * cell + cell * 0.5;
            const d = Math.hypot(cx - x, cy - y);
            if (d > radius) continue;
            const idx = r * state.mosaicCols + c;
            state.mosaic[idx] = Math.min(1, state.mosaic[idx] + amount * (1 - d / radius));
          }
        }
      }

      function updatePointerVisuals() {
        const { tx, ty, down } = state.pointer;
        cursorDot.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
        const ringX = state.pointer.x;
        const ringY = state.pointer.y;
        cursorRing.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;
        cursorRing.classList.toggle("pressed", down);
      }

      function onPointerMove(e) {
        if (e.pointerType === "touch") {
          state.isTouch = true;
          document.body.classList.add("touch-mode");
        }
        state.pointer.inside = true;
        state.pointer.tx = e.clientX;
        state.pointer.ty = e.clientY;
        if (state.pointer.x < -1000) {
          state.pointer.x = e.clientX;
          state.pointer.y = e.clientY;
          state.prev.x = e.clientX;
          state.prev.y = e.clientY;
        }
      }

      function onPointerDown(e) {
        state.pointer.down = true;
        onPointerMove(e);
        const mode = currentMode().id;
        if (mode === "ripple") addRipple(e.clientX, e.clientY, 2.4);
        if (mode === "trail" || mode === "pixels") {
          spawnTrail(e.clientX, e.clientY, state.speed, true);
        }
      }

      function onPointerUp() {
        state.pointer.down = false;
      }

      function onPointerLeave() {
        state.pointer.inside = false;
        state.pointer.down = false;
      }

      function updatePhysics(dt) {
        const mode = currentMode().id;
        const lerp = state.reducedMotion ? 1 : 0.18;
        state.pointer.x += (state.pointer.tx - state.pointer.x) * lerp;
        state.pointer.y += (state.pointer.ty - state.pointer.y) * lerp;

        const dx = state.pointer.x - state.prev.x;
        const dy = state.pointer.y - state.prev.y;
        state.speed = Math.hypot(dx, dy);
        state.prev.x = state.pointer.x;
        state.prev.y = state.pointer.y;

        if (!state.pointer.inside || state.paused) {
          updatePointerVisuals();
          return;
        }

        if (mode === "trail" || mode === "ribbon" || mode === "pixels") {
          if (state.speed > 0.2 || state.pointer.down) {
            spawnTrail(
              state.pointer.x,
              state.pointer.y,
              state.speed,
              state.pointer.down
            );
          }
        }

        if (mode === "ribbon") {
          state.ribbon.push({ x: state.pointer.x, y: state.pointer.y, life: 1 });
          if (state.ribbon.length > 48) state.ribbon.shift();
        } else if (state.ribbon.length) {
          state.ribbon.forEach((p) => (p.life -= 0.05));
          state.ribbon = state.ribbon.filter((p) => p.life > 0);
        }

        if (mode === "orbit") {
          ensureOrbits();
        }

        if (mode === "ripple" && state.speed > 8 && Math.random() < 0.2) {
          addRipple(state.pointer.x, state.pointer.y, Math.min(state.speed / 10, 2));
        }

        if (mode === "pixels") {
          paintMosaic(
            state.pointer.x,
            state.pointer.y,
            state.pointer.down ? 54 : 28,
            state.pointer.down ? 0.28 : 0.12
          );
        }

        if (mode === "magnetic") {
          state.magnets.forEach((m) => {
            const mdx = state.pointer.x - m.ox;
            const mdy = state.pointer.y - m.oy;
            const dist = Math.hypot(mdx, mdy);
            const radius = 160;
            if (dist < radius) {
              const force = (1 - dist / radius) * 42;
              m.tx = m.ox + (mdx / (dist || 1)) * force;
              m.ty = m.oy + (mdy / (dist || 1)) * force;
              m.el.classList.add("near");
            } else {
              m.tx = m.ox;
              m.ty = m.oy;
              m.el.classList.remove("near");
            }
            m.x += (m.tx - m.x) * 0.16;
            m.y += (m.ty - m.y) * 0.16;
            m.el.style.transform = `translate3d(${m.x - m.ox}px, ${m.y - m.oy}px, 0)`;
          });
        }

        updatePointerVisuals();
      }

      function drawBackground() {
        ctx.clearRect(0, 0, state.width, state.height);
        if (currentMode().id !== "pixels") {
          ctx.fillStyle = "rgba(7, 7, 11, 0.22)";
          ctx.fillRect(0, 0, state.width, state.height);
        } else {
          ctx.fillStyle = "rgba(7, 7, 11, 0.55)";
          ctx.fillRect(0, 0, state.width, state.height);
        }
      }

      function drawParticles() {
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.life -= p.decay;
          if (p.life <= 0) {
            state.particles.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue}, 85%, 68%, ${p.life * 0.9})`;
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawRibbon() {
        if (state.ribbon.length < 2) return;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = 1; i < state.ribbon.length; i++) {
          const a = state.ribbon[i - 1];
          const b = state.ribbon[i];
          const t = i / state.ribbon.length;
          ctx.strokeStyle = `hsla(${280 - t * 60}, 90%, ${60 + t * 15}%, ${b.life * 0.85})`;
          ctx.lineWidth = 2 + t * 14;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          a.life -= 0.004;
          b.life -= 0.004;
        }
        state.ribbon = state.ribbon.filter((p) => p.life > 0);
      }

      function drawOrbits() {
        ensureOrbits();
        const cx = state.pointer.x;
        const cy = state.pointer.y;
        state.orbits.forEach((o, i) => {
          o.angle += o.speed * (state.pointer.down ? 2.2 : 1);
          const tx = cx + Math.cos(o.angle) * o.radius;
          const ty = cy + Math.sin(o.angle) * o.radius;
          o.x += (tx - o.x) * o.lag * 4;
          o.y += (ty - o.y) * o.lag * 4;
          const hue = 160 + (i * 12) % 140;
          ctx.beginPath();
          ctx.fillStyle = `hsla(${hue}, 85%, 65%, 0.9)`;
          ctx.arc(o.x, o.y, o.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.strokeStyle = `hsla(${hue}, 85%, 65%, 0.18)`;
          ctx.lineWidth = 1;
          ctx.moveTo(cx, cy);
          ctx.lineTo(o.x, o.y);
          ctx.stroke();
        });

        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1;
        ctx.arc(cx, cy, 56, 0, Math.PI * 2);
        ctx.stroke();
      }

      function drawRipples() {
        if (state.grid) {
          state.grid.points.forEach((p) => {
            p.vx *= 0.9;
            p.vy *= 0.9;
            p.x += p.vx;
            p.y += p.vy;
            p.x += (p.ox - p.x) * 0.05;
            p.y += (p.oy - p.y) * 0.05;

            const d = Math.hypot(p.x - state.pointer.x, p.y - state.pointer.y);
            const alpha = d < 220 ? 0.35 - d / 800 : 0.12;
            ctx.fillStyle = `rgba(124, 92, 255, ${Math.max(alpha, 0.05)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        for (let i = state.ripples.length - 1; i >= 0; i--) {
          const r = state.ripples[i];
          r.r += 3.2;
          r.alpha *= 0.96;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(46, 230, 166, ${r.alpha})`;
          ctx.lineWidth = r.width;
          ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
          ctx.stroke();
          if (r.r > r.max || r.alpha < 0.03) state.ripples.splice(i, 1);
        }
      }

      function drawPixels() {
        if (!state.mosaic) return;
        const cell = 18;
        for (let r = 0; r < state.mosaicRows; r++) {
          for (let c = 0; c < state.mosaicCols; c++) {
            const idx = r * state.mosaicCols + c;
            let v = state.mosaic[idx];
            if (v <= 0.01) {
              state.mosaic[idx] *= 0.995;
              continue;
            }
            state.mosaic[idx] = v * 0.994;
            const x = c * cell;
            const y = r * cell;
            const hue = 210 + v * 120;
            ctx.fillStyle = `hsla(${hue}, 85%, ${45 + v * 30}%, ${0.15 + v * 0.75})`;
            ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
          }
        }
      }

      function drawMagneticGuides() {
        if (!state.pointer.inside) return;
        ctx.beginPath();
        ctx.strokeStyle = "rgba(124, 92, 255, 0.18)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        ctx.arc(state.pointer.x, state.pointer.y, 160, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawCursorGlow() {
        if (!state.pointer.inside) return;
        const g = ctx.createRadialGradient(
          state.pointer.x,
          state.pointer.y,
          0,
          state.pointer.x,
          state.pointer.y,
          90
        );
        g.addColorStop(0, "rgba(255,255,255,0.16)");
        g.addColorStop(0.4, "rgba(124,92,255,0.08)");
        g.addColorStop(1, "rgba(124,92,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(state.pointer.x, state.pointer.y, 90, 0, Math.PI * 2);
        ctx.fill();
      }

      function render() {
        if (!state.paused) {
          updatePhysics(1);
          drawBackground();
          drawCursorGlow();

          const mode = currentMode().id;
          if (mode === "trail") drawParticles();
          if (mode === "ribbon") {
            drawRibbon();
            drawParticles();
          }
          if (mode === "orbit") drawOrbits();
          if (mode === "ripple") drawRipples();
          if (mode === "pixels") {
            drawPixels();
            drawParticles();
          }
          if (mode === "magnetic") drawMagneticGuides();
        }

        statSpeed.textContent = state.speed.toFixed(1);
        statCount.textContent = String(
          state.particles.length +
            state.ribbon.length +
            state.orbits.length +
            state.ripples.length
        );

        requestAnimationFrame(render);
      }

      function togglePause() {
        state.paused = !state.paused;
        pauseBtn.setAttribute("aria-pressed", state.paused ? "true" : "false");
        pauseBtn.title = state.paused ? "Resume" : "Pause";
        showToast(state.paused ? "Paused" : "Running");
      }

      function toggleHelp() {
        const open = !help.classList.contains("open");
        help.classList.toggle("open", open);
        helpBtn.setAttribute("aria-pressed", open ? "true" : "false");
      }

      function onKeyDown(e) {
        if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
        if (e.key === " ") {
          e.preventDefault();
          togglePause();
        } else if (e.key === "]" || e.key === "ArrowRight") {
          setMode(state.modeIndex + 1, true);
        } else if (e.key === "[" || e.key === "ArrowLeft") {
          setMode(state.modeIndex - 1, true);
        } else if (e.key === "c" || e.key === "C") {
          clearField();
        } else if (e.key === "?" || e.key === "h" || e.key === "H") {
          toggleHelp();
        }
      }

      // Interactive HUD cursor states
      document.querySelectorAll(".icon-btn, .mode-btn, .brand, .chip").forEach((el) => {
        el.addEventListener("pointerenter", () => cursorRing.classList.add("hovering"));
        el.addEventListener("pointerleave", () => cursorRing.classList.remove("hovering"));
      });

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", onPointerMove, { passive: true });
      window.addEventListener("pointerdown", onPointerDown, { passive: true });
      window.addEventListener("pointerup", onPointerUp, { passive: true });
      window.addEventListener("pointercancel", onPointerUp, { passive: true });
      window.addEventListener("pointerleave", onPointerLeave, { passive: true });
      window.addEventListener("keydown", onKeyDown);

      pauseBtn.addEventListener("click", togglePause);
      clearBtn.addEventListener("click", clearField);
      helpBtn.addEventListener("click", toggleHelp);

      // Hide native cursor on fine pointers only
      const fine = window.matchMedia("(hover: hover) and (pointer: fine)");
      function syncCursorMode() {
        if (!fine.matches || state.isTouch) {
          document.body.classList.add("touch-mode");
        } else {
          document.body.classList.remove("touch-mode");
        }
      }
      fine.addEventListener?.("change", syncCursorMode);
      syncCursorMode();

      buildModeButtons();
      resize();
      setMode(0, false);
      showToast("Move your cursor");
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
