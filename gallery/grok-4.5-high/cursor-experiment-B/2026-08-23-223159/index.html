<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Echo Field — Cursor Experiment</title>
  <style>
    :root {
      --bg: #07080c;
      --ink: #e8e6df;
      --muted: #8a8790;
      --accent: #ffb454;
      --cool: #7ec8ff;
      --panel: rgba(12, 14, 20, 0.72);
      --line: rgba(232, 230, 223, 0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(126, 200, 255, 0.06), transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(255, 180, 84, 0.05), transparent 50%);
    }

    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .hud {
      position: fixed;
      z-index: 3;
      inset: auto auto calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));
      max-width: min(360px, calc(100vw - 40px));
      padding: 16px 18px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .hud.dim {
      opacity: 0.28;
      transform: translateY(6px);
    }

    .hud h1 {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .hud p {
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .hud .hint {
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .hud kbd {
      display: inline-block;
      min-width: 1.35em;
      padding: 0.1em 0.4em;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      font: 0.72rem/1.3 ui-monospace, "Cascadia Code", Consolas, monospace;
      color: var(--cool);
      text-align: center;
    }

    .mode-bar {
      position: fixed;
      z-index: 3;
      top: calc(16px + var(--safe-top));
      right: calc(16px + var(--safe-right));
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: min(420px, calc(100vw - 32px));
      pointer-events: auto;
    }

    .mode-bar button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font: 0.72rem/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .mode-bar button:hover {
      color: var(--ink);
      border-color: rgba(232, 230, 223, 0.28);
    }

    .mode-bar button:focus-visible {
      outline: 2px solid var(--cool);
      outline-offset: 2px;
    }

    .mode-bar button[aria-pressed="true"] {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
    }

    .mode-bar button:active {
      transform: scale(0.97);
    }

    .status {
      position: fixed;
      z-index: 3;
      top: calc(16px + var(--safe-top));
      left: calc(16px + var(--safe-left));
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }

    .status strong {
      color: var(--cool);
      font-weight: 600;
    }

    .cursor-dot {
      position: fixed;
      z-index: 4;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 16px rgba(232, 230, 223, 0.55);
      pointer-events: none;
      mix-blend-mode: screen;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform;
    }

    .cursor-ring {
      position: fixed;
      z-index: 4;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border: 1.5px solid rgba(232, 230, 223, 0.45);
      border-radius: 50%;
      pointer-events: none;
      transform: translate3d(-100px, -100px, 0) scale(1);
      will-change: transform, opacity;
      opacity: 0.85;
    }

    @media (max-width: 640px) {
      .hud {
        inset: auto auto calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
        max-width: calc(100vw - 24px);
        padding: 12px 14px;
      }

      .hud p { font-size: 0.85rem; }

      .mode-bar {
        top: auto;
        bottom: calc(12px + var(--safe-bottom));
        right: calc(12px + var(--safe-right));
        left: calc(12px + var(--safe-left));
        justify-content: center;
      }

      .hud {
        bottom: calc(64px + var(--safe-bottom));
      }

      .status {
        top: calc(12px + var(--safe-top));
        left: calc(12px + var(--safe-left));
        font-size: 0.65rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud { transition: none; }
      .mode-bar button { transition: none; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <div class="cursor-dot" id="cursorDot" hidden></div>
  <div class="cursor-ring" id="cursorRing" hidden></div>

  <p class="status" id="status" aria-live="polite">
    Mode <strong id="modeLabel">Ripple</strong>
  </p>

  <div class="mode-bar" role="toolbar" aria-label="Field modes">
    <button type="button" data-mode="ripple" aria-pressed="true">Ripple</button>
    <button type="button" data-mode="orbit" aria-pressed="false">Orbit</button>
    <button type="button" data-mode="ink" aria-pressed="false">Ink</button>
    <button type="button" data-mode="lattice" aria-pressed="false">Lattice</button>
  </div>

  <aside class="hud" id="hud">
    <h1>Echo Field</h1>
    <p>Move to disturb the field. Click or hold to plant a pulse. Your cursor is the only instrument.</p>
    <p class="hint">
      <kbd>1</kbd>–<kbd>4</kbd> modes · <kbd>C</kbd> clear · <kbd>H</kbd> hide tips · drag on touch
    </p>
  </aside>

  <p class="sr-only" id="announce">
    Interactive cursor experiment. Use pointer movement, click to pulse, and number keys one through four to change modes.
  </p>

  <script>
(function () {
  "use strict";

  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d", { alpha: false });
  const hud = document.getElementById("hud");
  const modeLabel = document.getElementById("modeLabel");
  const cursorDot = document.getElementById("cursorDot");
  const cursorRing = document.getElementById("cursorRing");
  const buttons = Array.from(document.querySelectorAll(".mode-bar button"));

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isCoarse = window.matchMedia("(pointer: coarse)").matches;

  const MODES = ["ripple", "orbit", "ink", "lattice"];
  const MODE_NAMES = {
    ripple: "Ripple",
    orbit: "Orbit",
    ink: "Ink",
    lattice: "Lattice"
  };

  let mode = "ripple";
  let dpr = 1;
  let w = 0;
  let h = 0;
  let running = true;
  let hudDimTimer = 0;
  let hudHidden = false;

  const pointer = {
    x: 0,
    y: 0,
    sx: 0,
    sy: 0,
    vx: 0,
    vy: 0,
    down: false,
    active: false,
    lastX: 0,
    lastY: 0
  };

  const ripples = [];
  const sparks = [];
  const inkStrokes = [];
  let lattice = [];
  let orbiters = [];
  let inkCurrent = null;
  let time = 0;
  let lastFrame = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildLattice();
    if (!orbiters.length) spawnOrbiters();
  }

  function buildLattice() {
    lattice = [];
    const gap = Math.max(28, Math.min(44, Math.floor(Math.min(w, h) / 22)));
    const cols = Math.ceil(w / gap) + 1;
    const rows = Math.ceil(h / gap) + 1;
    const ox = (w - (cols - 1) * gap) / 2;
    const oy = (h - (rows - 1) * gap) / 2;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        lattice.push({
          bx: ox + i * gap,
          by: oy + j * gap,
          x: ox + i * gap,
          y: oy + j * gap,
          px: 0,
          py: 0
        });
      }
    }
  }

  function spawnOrbiters() {
    orbiters = [];
    const count = Math.min(48, Math.floor((w * h) / 28000) + 18);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      orbiters.push({
        angle: a,
        radius: 40 + (i % 7) * 18 + Math.random() * 30,
        speed: 0.4 + (i % 5) * 0.12,
        size: 1.2 + (i % 4) * 0.6,
        phase: Math.random() * Math.PI * 2,
        hue: i % 2 === 0 ? 0 : 1
      });
    }
  }

  function setMode(next) {
    if (!MODES.includes(next) || next === mode) {
      mode = next;
      syncModeUI();
      return;
    }
    mode = next;
    inkCurrent = null;
    syncModeUI();
  }

  function syncModeUI() {
    modeLabel.textContent = MODE_NAMES[mode];
    buttons.forEach((btn) => {
      const on = btn.dataset.mode === mode;
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function clearField() {
    ripples.length = 0;
    sparks.length = 0;
    inkStrokes.length = 0;
    inkCurrent = null;
    for (const n of lattice) {
      n.x = n.bx;
      n.y = n.by;
      n.px = 0;
      n.py = 0;
    }
  }

  function plantRipple(x, y, power) {
    ripples.push({
      x, y,
      r: 4,
      max: 120 + power * 180,
      life: 1,
      decay: reducedMotion ? 0.045 : 0.012 + Math.random() * 0.008,
      warm: Math.random() > 0.45
    });

    const burst = reducedMotion ? 6 : 14 + Math.floor(power * 18);
    for (let i = 0; i < burst; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 160 * (0.4 + power);
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.012 + Math.random() * 0.02,
        size: 1 + Math.random() * 2.4,
        warm: Math.random() > 0.5
      });
    }
  }

  function updatePointerSmooth(dt) {
    const ease = reducedMotion ? 1 : 1 - Math.exp(-dt * 14);
    const ringEase = reducedMotion ? 1 : 1 - Math.exp(-dt * 8);
    const prevX = pointer.sx;
    const prevY = pointer.sy;
    pointer.sx += (pointer.x - pointer.sx) * ease;
    pointer.sy += (pointer.y - pointer.sy) * ease;
    pointer.vx = (pointer.sx - prevX) / Math.max(dt, 0.001);
    pointer.vy = (pointer.sy - prevY) / Math.max(dt, 0.001);

    if (pointer.active && !isCoarse) {
      cursorDot.hidden = false;
      cursorRing.hidden = false;
      cursorDot.style.transform = "translate3d(" + pointer.x + "px," + pointer.y + "px,0)";
      const speed = Math.min(1, Math.hypot(pointer.vx, pointer.vy) / 900);
      const scale = 1 + speed * 0.85 + (pointer.down ? 0.35 : 0);
      const ringX = pointer.sx;
      const ringY = pointer.sy;
      cursorRing.style.transform =
        "translate3d(" + ringX + "px," + ringY + "px,0) scale(" + scale + ")";
      cursorRing.style.opacity = String(0.35 + speed * 0.5);
    }
  }

  function updateRipples(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += (r.max - r.r) * Math.min(1, dt * 1.6);
      r.life -= r.decay * (60 * dt);
      if (r.life <= 0) ripples.splice(i, 1);
    }
  }

  function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(0.92, dt * 60);
      s.vy *= Math.pow(0.92, dt * 60);
      s.vy += 20 * dt;
      s.life -= s.decay * (60 * dt);
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  function updateInk(dt) {
    if (mode !== "ink") return;
    const speed = Math.hypot(pointer.vx, pointer.vy);
    if (pointer.active && (pointer.down || speed > 30)) {
      if (!inkCurrent || inkCurrent.points.length > 120) {
        inkCurrent = { points: [], life: 1, warm: speed > 400 };
        inkStrokes.push(inkCurrent);
      }
      const last = inkCurrent.points[inkCurrent.points.length - 1];
      if (!last || Math.hypot(pointer.sx - last.x, pointer.sy - last.y) > 2) {
        inkCurrent.points.push({
          x: pointer.sx,
          y: pointer.sy,
          w: 1.2 + Math.min(10, speed / 120),
          a: 0.55 + Math.min(0.4, speed / 1400)
        });
      }
    } else {
      inkCurrent = null;
    }

    for (let i = inkStrokes.length - 1; i >= 0; i--) {
      const stroke = inkStrokes[i];
      if (stroke !== inkCurrent) {
        stroke.life -= (reducedMotion ? 0.04 : 0.008) * (60 * dt);
      }
      if (stroke.life <= 0 || stroke.points.length < 2) {
        inkStrokes.splice(i, 1);
      }
    }
    if (inkStrokes.length > 28) inkStrokes.splice(0, inkStrokes.length - 28);
  }

  function updateLattice(dt) {
    if (mode !== "lattice" && mode !== "ripple") return;
    const influence = mode === "lattice" ? 1 : 0.35;
    const radius = mode === "lattice" ? 160 : 110;
    const spring = reducedMotion ? 1 : 1 - Math.exp(-dt * 10);

    for (const n of lattice) {
      let fx = 0;
      let fy = 0;
      const dx = n.bx - pointer.sx;
      const dy = n.by - pointer.sy;
      const dist = Math.hypot(dx, dy) + 0.001;
      if (dist < radius && pointer.active) {
        const t = 1 - dist / radius;
        const push = t * t * (mode === "lattice" ? 42 : 18) * influence;
        fx += (dx / dist) * push;
        fy += (dy / dist) * push;
        if (mode === "lattice") {
          const swirl = t * 18;
          fx += (-dy / dist) * swirl;
          fy += (dx / dist) * swirl;
        }
      }

      for (let i = 0; i < ripples.length; i++) {
        const r = ripples[i];
        const rdx = n.bx - r.x;
        const rdy = n.by - r.y;
        const rd = Math.hypot(rdx, rdy) + 0.001;
        const band = Math.abs(rd - r.r);
        if (band < 28) {
          const wave = (1 - band / 28) * r.life * 22;
          fx += (rdx / rd) * wave;
          fy += (rdy / rd) * wave;
        }
      }

      n.px += (fx - n.px) * spring;
      n.py += (fy - n.py) * spring;
      n.x = n.bx + n.px;
      n.y = n.by + n.py;
    }
  }

  function updateOrbiters(dt) {
    if (mode !== "orbit") return;
    const cx = pointer.active ? pointer.sx : w * 0.5;
    const cy = pointer.active ? pointer.sy : h * 0.5;
    const speedBoost = 1 + Math.min(2.5, Math.hypot(pointer.vx, pointer.vy) / 500);
    for (const o of orbiters) {
      o.angle += o.speed * 0.015 * speedBoost * (60 * dt);
      const breathe = 1 + Math.sin(time * 1.4 + o.phase) * 0.08;
      o._x = cx + Math.cos(o.angle) * o.radius * breathe;
      o._y = cy + Math.sin(o.angle) * o.radius * breathe * 0.86;
    }
  }

  function drawBackground() {
    ctx.fillStyle = "#07080c";
    ctx.fillRect(0, 0, w, h);

    const g = ctx.createRadialGradient(
      pointer.active ? pointer.sx : w * 0.5,
      pointer.active ? pointer.sy : h * 0.4,
      0,
      pointer.active ? pointer.sx : w * 0.5,
      pointer.active ? pointer.sy : h * 0.4,
      Math.max(w, h) * 0.55
    );
    g.addColorStop(0, "rgba(126, 200, 255, 0.05)");
    g.addColorStop(0.45, "rgba(255, 180, 84, 0.03)");
    g.addColorStop(1, "rgba(7, 8, 12, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  function drawRipples() {
    for (const r of ripples) {
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = r.warm
        ? "rgba(255, 180, 84," + (0.45 * r.life) + ")"
        : "rgba(126, 200, 255," + (0.4 * r.life) + ")";
      ctx.lineWidth = 1.5 + (1 - r.life) * 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(r.x, r.y, Math.max(0, r.r * 0.72), 0, Math.PI * 2);
      ctx.strokeStyle = r.warm
        ? "rgba(255, 210, 140," + (0.18 * r.life) + ")"
        : "rgba(180, 220, 255," + (0.16 * r.life) + ")";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawSparks() {
    for (const s of sparks) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
      ctx.fillStyle = s.warm
        ? "rgba(255, 180, 84," + (0.85 * s.life) + ")"
        : "rgba(126, 200, 255," + (0.8 * s.life) + ")";
      ctx.fill();
    }
  }

  function drawInk() {
    for (const stroke of inkStrokes) {
      const pts = stroke.points;
      if (pts.length < 2) continue;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1];
        const b = pts[i];
        const alpha = stroke.life * b.a;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = stroke.warm
          ? "rgba(255, 180, 84," + alpha + ")"
          : "rgba(200, 220, 240," + alpha + ")";
        ctx.lineWidth = b.w * (0.6 + stroke.life * 0.6);
        ctx.stroke();
      }
    }
  }

  function drawLattice() {
    if (mode !== "lattice" && mode !== "ripple") return;
    const showLinks = mode === "lattice";
    if (showLinks) {
      ctx.lineWidth = 0.7;
      for (let i = 0; i < lattice.length; i++) {
        const n = lattice[i];
        const right = lattice[i + 1];
        const belowGap = Math.max(28, Math.min(44, Math.floor(Math.min(w, h) / 22)));
        const cols = Math.ceil(w / belowGap) + 1;
        const down = lattice[i + cols];
        if (right && (i + 1) % cols !== 0) {
          const dist = Math.hypot(right.x - n.x, right.y - n.y);
          if (dist < belowGap * 1.8) {
            ctx.strokeStyle = "rgba(232, 230, 223," + (0.04 + Math.min(0.12, Math.hypot(n.px, n.py) / 80)) + ")";
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(right.x, right.y);
            ctx.stroke();
          }
        }
        if (down) {
          const dist = Math.hypot(down.x - n.x, down.y - n.y);
          if (dist < belowGap * 1.8) {
            ctx.strokeStyle = "rgba(232, 230, 223," + (0.04 + Math.min(0.12, Math.hypot(n.px, n.py) / 80)) + ")";
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(down.x, down.y);
            ctx.stroke();
          }
        }
      }
    }

    for (const n of lattice) {
      const energy = Math.min(1, Math.hypot(n.px, n.py) / 36);
      const size = mode === "lattice" ? 1.1 + energy * 2.2 : 0.7 + energy * 1.4;
      ctx.beginPath();
      ctx.arc(n.x, n.y, size, 0, Math.PI * 2);
      ctx.fillStyle = energy > 0.35
        ? "rgba(255, 180, 84," + (0.25 + energy * 0.55) + ")"
        : "rgba(232, 230, 223," + (0.12 + energy * 0.45) + ")";
      ctx.fill();
    }
  }

  function drawOrbiters() {
    if (mode !== "orbit") return;
    const cx = pointer.active ? pointer.sx : w * 0.5;
    const cy = pointer.active ? pointer.sy : h * 0.5;

    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 180, 84, 0.9)";
    ctx.fill();

    for (const o of orbiters) {
      if (o._x == null) continue;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(o._x, o._y);
      ctx.strokeStyle = o.hue
        ? "rgba(126, 200, 255, 0.08)"
        : "rgba(255, 180, 84, 0.07)";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(o._x, o._y, o.size, 0, Math.PI * 2);
      ctx.fillStyle = o.hue
        ? "rgba(126, 200, 255, 0.85)"
        : "rgba(255, 180, 84, 0.9)";
      ctx.fill();
    }
  }

  function drawPresence() {
    if (!pointer.active) return;
    const speed = Math.min(1, Math.hypot(pointer.vx, pointer.vy) / 800);
    const radius = 18 + speed * 28 + (pointer.down ? 10 : 0);

    const glow = ctx.createRadialGradient(
      pointer.sx, pointer.sy, 0,
      pointer.sx, pointer.sy, radius * 2.2
    );
    glow.addColorStop(0, "rgba(255, 220, 170," + (0.18 + speed * 0.2) + ")");
    glow.addColorStop(0.4, "rgba(126, 200, 255," + (0.08 + speed * 0.1) + ")");
    glow.addColorStop(1, "rgba(7, 8, 12, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(pointer.sx, pointer.sy, radius * 2.2, 0, Math.PI * 2);
    ctx.fill();

    if (speed > 0.05 && mode !== "ink") {
      ctx.beginPath();
      ctx.moveTo(pointer.sx, pointer.sy);
      ctx.lineTo(pointer.sx - pointer.vx * 0.04, pointer.sy - pointer.vy * 0.04);
      ctx.strokeStyle = "rgba(232, 230, 223," + (0.15 + speed * 0.35) + ")";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.stroke();
    }
  }

  function maybeAmbientTrail(dt) {
    if (!pointer.active || mode === "ink") return;
    const speed = Math.hypot(pointer.vx, pointer.vy);
    if (speed < 220) return;
    if (Math.random() > (reducedMotion ? 0.2 : 0.55)) return;
    sparks.push({
      x: pointer.sx,
      y: pointer.sy,
      vx: -pointer.vx * 0.05 + (Math.random() - 0.5) * 40,
      vy: -pointer.vy * 0.05 + (Math.random() - 0.5) * 40,
      life: 0.7,
      decay: 0.03,
      size: 1 + Math.random(),
      warm: speed > 500
    });
  }

  function holdPulse(dt) {
    if (!pointer.down || !pointer.active) return;
    if (reducedMotion) return;
    if (Math.random() > 0.08) return;
    plantRipple(pointer.sx, pointer.sy, 0.25);
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.033, (now - lastFrame) / 1000) || 0.016;
    lastFrame = now;
    time += dt;

    updatePointerSmooth(dt);
    updateRipples(dt);
    updateSparks(dt);
    updateInk(dt);
    updateLattice(dt);
    updateOrbiters(dt);
    maybeAmbientTrail(dt);
    holdPulse(dt);

    drawBackground();
    if (mode === "lattice" || mode === "ripple") drawLattice();
    if (mode === "orbit") drawOrbiters();
    if (mode === "ink") drawInk();
    drawRipples();
    drawSparks();
    drawPresence();

    requestAnimationFrame(frame);
  }

  function onPointerMove(e) {
    const x = e.clientX;
    const y = e.clientY;
    if (!pointer.active) {
      pointer.sx = x;
      pointer.sy = y;
    }
    pointer.x = x;
    pointer.y = y;
    pointer.active = true;
    bumpHud();
  }

  function onPointerDown(e) {
    pointer.down = true;
    pointer.active = true;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    if (!pointer.sx && !pointer.sy) {
      pointer.sx = pointer.x;
      pointer.sy = pointer.y;
    }
    plantRipple(pointer.x, pointer.y, 0.7 + Math.random() * 0.3);
    bumpHud();
    if (e.target === canvas || e.target === document.body) {
      e.preventDefault();
    }
  }

  function onPointerUp() {
    pointer.down = false;
    inkCurrent = null;
  }

  function onPointerLeave() {
    if (!isCoarse) {
      pointer.active = false;
      cursorDot.hidden = true;
      cursorRing.hidden = true;
    }
    pointer.down = false;
  }

  function bumpHud() {
    if (hudHidden) return;
    hud.classList.remove("dim");
    clearTimeout(hudDimTimer);
    hudDimTimer = setTimeout(function () {
      hud.classList.add("dim");
    }, 3200);
  }

  function toggleHud() {
    hudHidden = !hudHidden;
    hud.style.display = hudHidden ? "none" : "";
    if (!hudHidden) bumpHud();
  }

  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", onPointerMove, { passive: true });
  window.addEventListener("pointerdown", onPointerDown, { passive: false });
  window.addEventListener("pointerup", onPointerUp, { passive: true });
  window.addEventListener("pointercancel", onPointerUp, { passive: true });
  window.addEventListener("pointerleave", onPointerLeave, { passive: true });

  window.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key >= "1" && key <= "4") {
      setMode(MODES[Number(key) - 1]);
      bumpHud();
      e.preventDefault();
    } else if (key === "c") {
      clearField();
      bumpHud();
    } else if (key === "h") {
      toggleHud();
    } else if (key === " ") {
      plantRipple(pointer.sx || w / 2, pointer.sy || h / 2, 1);
      bumpHud();
      e.preventDefault();
    }
  });

  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      setMode(btn.dataset.mode);
      bumpHud();
    });
  });

  document.addEventListener("visibilitychange", function () {
    running = !document.hidden;
    if (running) {
      lastFrame = performance.now();
      requestAnimationFrame(frame);
    }
  });

  pointer.x = w / 2;
  pointer.y = h / 2;
  pointer.sx = w / 2;
  pointer.sy = h / 2;

  resize();
  pointer.x = w / 2;
  pointer.y = h / 2;
  pointer.sx = w / 2;
  pointer.sy = h / 2;
  syncModeUI();
  bumpHud();
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
