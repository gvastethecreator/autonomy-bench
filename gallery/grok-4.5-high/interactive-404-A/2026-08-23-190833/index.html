<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page not found</title>
  <style>
    :root {
      --bg: #0b0d12;
      --bg-elevated: #12151c;
      --ink: #f4f1ea;
      --muted: #9aa3b2;
      --accent: #ff6b4a;
      --accent-soft: rgba(255, 107, 74, 0.16);
      --line: rgba(244, 241, 234, 0.12);
      --glow: rgba(255, 107, 74, 0.35);
      --radius: 18px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 107, 74, 0.18), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(80, 120, 255, 0.12), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      line-height: 1.5;
    }

    .shell {
      width: min(100%, 40rem);
      display: grid;
      gap: 1.5rem;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 40%), var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      padding: clamp(1.75rem, 4vw, 2.5rem);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 24px 48px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -20% -40% auto;
      width: 16rem;
      height: 16rem;
      background: radial-gradient(circle, var(--glow), transparent 65%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(255, 107, 74, 0.28);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      margin-bottom: 1.25rem;
    }

    .eyebrow span {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 107, 74, 0.2);
    }

    .code {
      margin: 0;
      font-family: var(--mono);
      font-size: clamp(4.5rem, 18vw, 7rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.06em;
      background: linear-gradient(135deg, #fff 20%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 0.85rem 0 0.6rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 34ch;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .btn-primary {
      color: #1a0d09;
      background: var(--accent);
      box-shadow: 0 10px 24px rgba(255, 107, 74, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      background: #ff7d61;
    }

    .btn-secondary {
      color: var(--ink);
      background: transparent;
      border-color: var(--line);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(244, 241, 234, 0.22);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
    }

    .meta strong {
      color: var(--ink);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }

      .btn-primary:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card" aria-labelledby="title">
      <div class="eyebrow"><span aria-hidden="true"></span> Error · Not found</div>
      <p class="code" aria-hidden="true">404</p>
      <h1 id="title">This page wandered off the map</h1>
      <p>
        The address you followed doesn’t match anything here.
        It may have moved, been renamed, or never existed.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-secondary" href="javascript:history.back()">Go back</a>
      </div>
    </article>
    <p class="meta">
      <span><strong>Status</strong> 404</span>
      <span><strong>Hint</strong> Check the URL for typos</span>
    </p>
  </main>
</body>
</html>
