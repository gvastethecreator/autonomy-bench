<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether — Shader Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080c;
      --bg-elevated: rgba(14, 16, 24, 0.78);
      --bg-panel: rgba(12, 14, 22, 0.86);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #e8eaf0;
      --text-dim: #8b90a0;
      --text-faint: #5c6170;
      --accent: #7dd3fc;
      --accent-2: #c4b5fd;
      --accent-warm: #fbbf24;
      --danger: #fb7185;
      --success: #34d399;
      --glow: rgba(125, 211, 252, 0.25);
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: "Instrument Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, #12141e 0%, #07080c 55%, #040508 100%);
    }

    #gl {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      opacity: 0;
      transition: opacity 0.9s var(--ease);
    }

    #gl.ready { opacity: 1; }

    #veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(0,0,0,0.55), transparent 60%),
        linear-gradient(180deg, rgba(7,8,12,0.35) 0%, transparent 18%, transparent 78%, rgba(7,8,12,0.5) 100%);
      transition: opacity 0.6s var(--ease);
    }

    #flash {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: #07080c;
      opacity: 0;
      transition: opacity 0.35s var(--ease);
    }

    #flash.active { opacity: 0.72; }

    .chrome {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .chrome > * { pointer-events: auto; }

    header.topbar {
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      background: linear-gradient(180deg, rgba(7,8,12,0.72) 0%, rgba(7,8,12,0.28) 70%, transparent 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background:
        radial-gradient(circle at 30% 30%, #e0f2fe, transparent 40%),
        radial-gradient(circle at 70% 70%, #c4b5fd, transparent 45%),
        linear-gradient(135deg, #0ea5e9, #8b5cf6 55%, #f472b6);
      box-shadow: 0 0 28px var(--glow), inset 0 1px 0 rgba(255,255,255,0.35);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mark::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 48%, transparent 62%);
      animation: sheen 4.5s var(--ease) infinite;
    }

    @keyframes sheen {
      0%, 100% { transform: translateX(-120%); }
      40%, 60% { transform: translateX(120%); }
    }

    .brand-copy h1 {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-copy p {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      font: 500 12px/1 var(--font);
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    .pill:hover {
      border-color: var(--border-strong);
      background: rgba(22, 26, 38, 0.9);
      box-shadow: 0 0 0 1px rgba(125,211,252,0.08);
    }

    .pill:active { transform: translateY(1px); }
    .pill.active {
      border-color: rgba(125, 211, 252, 0.45);
      box-shadow: 0 0 24px rgba(125, 211, 252, 0.12);
      color: var(--accent);
    }

    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-faint);
    }

    .pill.active .dot {
      background: var(--success);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.7);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.85); }
    }

    .stat {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      padding: 0 10px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(8, 10, 16, 0.55);
      backdrop-filter: blur(12px);
    }

    .stat b {
      color: var(--text);
      font-weight: 500;
    }

    .panel {
      position: fixed;
      z-index: 10;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.45s var(--ease), opacity 0.35s var(--ease);
    }

    .panel.hidden-ui {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
    }

    .sidebar {
      top: 84px;
      left: 22px;
      width: min(292px, calc(100vw - 44px));
      max-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .panel-head h2 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .preset-list {
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .preset {
      position: relative;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }

    .preset:hover {
      background: rgba(255,255,255,0.045);
      border-color: var(--border);
    }

    .preset.active {
      background: linear-gradient(135deg, rgba(125,211,252,0.1), rgba(196,181,253,0.08));
      border-color: rgba(125, 211, 252, 0.35);
      box-shadow: inset 0 0 0 1px rgba(125,211,252,0.08);
    }

    .preset:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .swatch {
      width: 56px;
      height: 42px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .swatch::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 40%, rgba(0,0,0,0.25));
    }

    .preset-meta strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .preset-meta span {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.35;
    }

    .controls {
      right: 22px;
      bottom: 22px;
      width: min(340px, calc(100vw - 44px));
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .controls .panel-head { padding-bottom: 12px; }

    .control-body {
      padding: 4px 16px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .control label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .control .val {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      min-width: 42px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(125,211,252,0.55), rgba(196,181,253,0.35));
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2px solid #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14,165,233,0.15), 0 4px 12px rgba(0,0,0,0.35);
      transition: transform 0.15s;
    }

    input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.08); }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(0.96); }

    .hint-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .kbd {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      padding: 4px 7px;
    }

    .footer-bar {
      left: 22px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 400px);
    }

    .scene-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      backdrop-filter: blur(16px);
      font-size: 12px;
      color: var(--text-dim);
    }

    .scene-chip strong {
      color: var(--text);
      font-weight: 600;
    }

    .toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 30;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(12, 14, 22, 0.92);
      backdrop-filter: blur(16px);
      font-size: 12px;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s var(--ease);
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .code-drawer {
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 44px));
      max-height: 42vh;
      display: none;
      flex-direction: column;
    }

    .code-drawer.open { display: flex; }

    .code-drawer pre {
      margin: 0;
      padding: 14px 16px 18px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
      color: #c9d1e0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .boot {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #05060a;
      transition: opacity 0.7s var(--ease), visibility 0.7s;
    }

    .boot.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-inner {
      text-align: center;
      animation: rise 0.9s var(--ease) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .boot-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 30% 30%, #e0f2fe, transparent 40%),
        linear-gradient(135deg, #0ea5e9, #8b5cf6 55%, #f472b6);
      box-shadow: 0 0 48px rgba(125,211,252,0.35);
    }

    .boot h2 {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .boot p {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .loader {
      width: 140px;
      height: 2px;
      margin: 0 auto;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .loader span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: load 1.1s ease-in-out infinite;
    }

    @keyframes load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    .error-banner {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      place-items: center;
      padding: 24px;
      background: #07080c;
      text-align: center;
    }

    .error-banner.show { display: grid; }
    .error-banner h2 { margin-bottom: 8px; }
    .error-banner p { color: var(--text-dim); max-width: 420px; }

    @media (max-width: 860px) {
      .sidebar {
        top: auto;
        bottom: 96px;
        left: 12px;
        width: calc(100vw - 24px);
        max-height: 38vh;
      }
      .controls {
        right: 12px;
        bottom: 12px;
        left: 12px;
        width: auto;
        max-height: none;
      }
      .controls .control-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 16px;
      }
      .footer-bar { display: none; }
      header.topbar { padding: 14px 12px; }
      .stat { display: none; }
    }

    @media (max-width: 560px) {
      .controls .control-body { grid-template-columns: 1fr; }
      .brand-copy p { display: none; }
      .pill span.label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-mark" aria-hidden="true"></div>
      <h2>Aether</h2>
      <p>Warming the GPU atelier…</p>
      <div class="loader"><span></span></div>
    </div>
  </div>

  <div class="error-banner" id="errorBanner">
    <div>
      <h2>WebGL unavailable</h2>
      <p>This playground needs a browser with WebGL support enabled.</p>
    </div>
  </div>

  <div id="stage">
    <canvas id="gl" aria-label="Shader canvas"></canvas>
    <div id="veil"></div>
    <div id="flash"></div>
  </div>

  <header class="chrome topbar" id="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand-copy">
        <h1>Aether</h1>
        <p>Realtime shader atelier</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="stat" title="Performance">
        <span><b id="fps">60</b> fps</span>
        <span><b id="clock">0.0</b>s</span>
      </div>
      <button class="pill active" id="btnPlay" type="button" aria-pressed="true">
        <span class="dot"></span><span class="label">Live</span>
      </button>
      <button class="pill" id="btnUi" type="button" title="Toggle UI (H)">
        <span class="label">UI</span>
      </button>
      <button class="pill" id="btnCode" type="button" title="Toggle source (C)">
        <span class="label">GLSL</span>
      </button>
      <button class="pill" id="btnShot" type="button" title="Capture frame">
        <span class="label">Capture</span>
      </button>
      <button class="pill" id="btnFull" type="button" title="Fullscreen (F)">
        <span class="label">Full</span>
      </button>
    </div>
  </header>

  <aside class="chrome panel sidebar" id="sidebar" aria-label="Shader presets">
    <div class="panel-head">
      <h2>Scenes</h2>
      <span class="kbd" id="sceneIndex">01 / 06</span>
    </div>
    <div class="preset-list" id="presetList" role="listbox" aria-label="Preset scenes"></div>
  </aside>

  <section class="chrome panel controls" id="controls" aria-label="Shader parameters">
    <div class="panel-head">
      <h2>Parameters</h2>
      <button class="pill" id="btnReset" type="button" style="height:28px;padding:0 10px;">Reset</button>
    </div>
    <div class="control-body" id="controlBody"></div>
    <div style="padding:0 16px 14px">
      <div class="hint-row">
        <span class="kbd">1–6 scenes</span>
        <span class="kbd">Space pause</span>
        <span class="kbd">R reset</span>
        <span class="kbd">H hide UI</span>
        <span class="kbd">drag canvas</span>
      </div>
    </div>
  </section>

  <div class="chrome footer-bar" id="footerBar">
    <div class="scene-chip">
      Now rendering <strong id="sceneName">Nebula Drift</strong>
    </div>
  </div>

  <section class="chrome panel code-drawer" id="codeDrawer" aria-label="Fragment shader source">
    <div class="panel-head">
      <h2>Fragment source</h2>
      <button class="pill" id="btnCloseCode" type="button" style="height:28px;padding:0 10px;">Close</button>
    </div>
    <pre id="codeView"></pre>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    const VERT = `
attribute vec2 a_pos;
void main() {
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

    const COMMON = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_intensity;
uniform float u_speed;
uniform float u_contrast;
uniform float u_hue;
uniform float u_detail;
uniform float u_bloom;
uniform float u_warp;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 6; i++) {
    v += a * noise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}

vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
  return a + b * cos(6.28318 * (c * t + d));
}

vec3 hueShift(vec3 col, float h) {
  float angle = h * 6.28318;
  float s = sin(angle), c = cos(angle);
  mat3 m = mat3(
    0.299 + 0.701 * c + 0.168 * s, 0.587 - 0.587 * c + 0.330 * s, 0.114 - 0.114 * c - 0.497 * s,
    0.299 - 0.299 * c - 0.328 * s, 0.587 + 0.413 * c + 0.035 * s, 0.114 - 0.114 * c + 0.292 * s,

        el.classList.toggle("hidden-ui", !on);
      });
      els.btnUi.classList.toggle("active", on);
      if (!on) {
        els.codeDrawer.classList.remove("open");
        state.codeOpen = false;
        els.btnCode.classList.remove("active");
      }
    }

    function setCodeOpen(on) {
      state.codeOpen = on;
      els.codeDrawer.classList.toggle("open", on);
      els.btnCode.classList.toggle("active", on);
      if (on) setUiVisible(true);
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.dpr = dpr;
      const w = Math.floor(window.innerWidth * dpr);
      const h = Math.floor(window.innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function capture() {
      resize();
      renderFrame(state.time, true);
      const a = document.createElement("a");
      a.download = "aether-" + PRESETS[state.index].id + "-" + Date.now() + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
      toast("Frame captured");
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function renderFrame(t, force) {
      const prog = programs[state.index];
      const u = uniformCache[state.index];
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.enableVertexAttribArray(u.a_pos);
      gl.vertexAttribPointer(u.a_pos, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(u.u_res, canvas.width, canvas.height);
      gl.uniform1f(u.u_time, t);
      gl.uniform2f(u.u_mouse, state.mouse.x, 1.0 - state.mouse.y);
      gl.uniform1f(u.u_intensity, state.params.intensity);
      gl.uniform1f(u.u_speed, state.params.speed);
      gl.uniform1f(u.u_contrast, state.params.contrast);
      gl.uniform1f(u.u_hue, state.params.hue);
      gl.uniform1f(u.u_detail, state.params.detail);
      gl.uniform1f(u.u_bloom, state.params.bloom);
      gl.uniform1f(u.u_warp, state.params.warp);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    function frame(ts) {
      if (!state.lastTs) state.lastTs = ts;
      const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
      state.lastTs = ts;

      if (state.playing) state.time += dt;

      state.mouse.x += (state.mouse.tx - state.mouse.x) * Math.min(1, dt * 6);
      state.mouse.y += (state.mouse.ty - state.mouse.y) * Math.min(1, dt * 6);

      PARAMS.forEach((p) => {
        const cur = state.params[p.key];
        const tgt = state.targetParams[p.key];
        state.params[p.key] = cur + (tgt - cur) * Math.min(1, dt * 4.5);
      });

      renderFrame(state.time, false);

      state.frames++;
      if (!state.fpsTs) state.fpsTs = ts;
      if (ts - state.fpsTs >= 500) {
        state.fps = Math.round((state.frames * 1000) / (ts - state.fpsTs));
        state.frames = 0;
        state.fpsTs = ts;
        els.fps.textContent = String(state.fps);
      }
      els.clock.textContent = state.time.toFixed(1);

      requestAnimationFrame(frame);
    }

    // Pointer
    window.addEventListener("pointermove", (e) => {
      state.mouse.tx = e.clientX / window.innerWidth;
      state.mouse.ty = e.clientY / window.innerHeight;
    });

    window.addEventListener("pointerdown", (e) => {
      if (e.target === canvas) {
        state.mouse.tx = e.clientX / window.innerWidth;
        state.mouse.ty = e.clientY / window.innerHeight;
      }
    });

    window.addEventListener("resize", resize);

    window.addEventListener("keydown", (e) => {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      const key = e.key.toLowerCase();
      if (key === " ") {
        e.preventDefault();
        setPlaying(!state.playing);
      } else if (key === "h") {
        setUiVisible(!state.uiVisible);
      } else if (key === "c") {
        setCodeOpen(!state.codeOpen);
      } else if (key === "r") {
        resetParams();
      } else if (key === "f") {
        toggleFullscreen();
      } else if (key === "arrowright" || key === "]") {
        selectPreset(state.index + 1);
      } else if (key === "arrowleft" || key === "[") {
        selectPreset(state.index - 1);
      } else if (/^[1-6]$/.test(key)) {
        selectPreset(parseInt(key, 10) - 1);
      }
    });

    els.btnPlay.addEventListener("click", () => setPlaying(!state.playing));
    els.btnUi.addEventListener("click", () => setUiVisible(!state.uiVisible));
    els.btnCode.addEventListener("click", () => setCodeOpen(!state.codeOpen));
    els.btnCloseCode.addEventListener("click", () => setCodeOpen(false));
    els.btnShot.addEventListener("click", capture);
    els.btnFull.addEventListener("click", toggleFullscreen);
    els.btnReset.addEventListener("click", resetParams);

    buildUI();
    resize();
    applyPreset(0);
    canvas.classList.add("ready");

    setTimeout(() => els.boot.classList.add("done"), 700);
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
