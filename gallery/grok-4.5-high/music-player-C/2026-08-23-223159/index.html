<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afterglow — Listening Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #0a090c;
      --bg-1: #121016;
      --bg-2: #1a1620;
      --bg-3: #231e2c;
      --glass: rgba(28, 24, 36, 0.72);
      --glass-edge: rgba(255, 255, 255, 0.08);
      --text: #f4efe8;
      --text-dim: #9a9088;
      --text-faint: #5e564f;
      --accent: #e8a87c;
      --accent-soft: #c4785a;
      --accent-glow: rgba(232, 168, 124, 0.35);
      --rose: #d4a5a5;
      --mint: #8fbcb0;
      --violet: #9b8ec4;
      --danger: #e07a7a;
      --radius: 18px;
      --radius-sm: 10px;
      --shadow-deep: 0 24px 80px rgba(0, 0, 0, 0.55);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: "Instrument Sans", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --track-hue: 28;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-0);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; color: inherit; border: none; background: none; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    ::selection { background: rgba(232, 168, 124, 0.35); color: #fff; }

    /* —— Atmosphere —— */
    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .atmosphere .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      transition: background 1.2s var(--ease), transform 8s var(--ease);
      will-change: transform;
    }
    .atmosphere .orb-a {
      width: 55vmax;
      height: 55vmax;
      top: -20%;
      left: -10%;
      background: hsl(var(--track-hue) 55% 42% / 0.55);
      animation: drift-a 22s ease-in-out infinite alternate;
    }
    .atmosphere .orb-b {
      width: 40vmax;
      height: 40vmax;
      bottom: -15%;
      right: -8%;
      background: hsl(calc(var(--track-hue) + 40) 40% 30% / 0.4);
      animation: drift-b 28s ease-in-out infinite alternate;
    }
    .atmosphere .orb-c {
      width: 30vmax;
      height: 30vmax;
      top: 40%;
      left: 45%;
      background: hsl(calc(var(--track-hue) + 180) 30% 25% / 0.25);
      animation: drift-c 18s ease-in-out infinite alternate;
    }
    .atmosphere .grain {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .atmosphere .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    @keyframes drift-a {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(8%, 6%) scale(1.08); }
    }
    @keyframes drift-b {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-10%, -5%) scale(1.12); }
    }
    @keyframes drift-c {
      from { transform: translate(0, 0); }
      to { transform: translate(-6%, 8%); }
    }

    /* —— Shell —— */
    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 1fr auto;
      height: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 20px 0;
      gap: 0 20px;
    }

    /* —— Sidebar —— */
    .sidebar {
      grid-row: 1 / 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 4px 16px;
      min-height: 0;
      animation: rise 0.8s var(--ease) both;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px 20px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      box-shadow: 0 8px 24px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.55);
      border-top-color: transparent;
      border-left-color: transparent;
    }
    .brand h1 {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .brand span {
      display: block;
      font-family: var(--font);
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .nav-section {
      padding: 0 8px;
    }
    .nav-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding: 12px 10px 6px;
      font-weight: 600;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s, transform 0.2s var(--ease);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active {
      background: rgba(232, 168, 124, 0.12);
      color: var(--accent);
    }
    .nav-item.active svg { opacity: 1; }

    .playlist-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }
    .pl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 12px;
      text-align: left;
      transition: background 0.2s;
    }
    .pl-item:hover { background: rgba(255,255,255,0.04); }
    .pl-item.active { background: rgba(255,255,255,0.06); }
    .pl-swatch {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }
    .pl-meta { min-width: 0; }
    .pl-meta strong {
      display: block;
      font-size: 0.82rem;
      font-weight: 560;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl-meta small {
      color: var(--text-faint);
      font-size: 0.72rem;
    }

    /* —— Main —— */
    .main {
      grid-row: 1 / 2;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      min-width: 0;
      animation: rise 0.9s var(--ease) 0.08s both;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 4px 18px;
    }
    .search {
      flex: 1;
      max-width: 380px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-edge);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .search:focus-within {
      border-color: rgba(232, 168, 124, 0.4);
      box-shadow: 0 0 0 3px rgba(232, 168, 124, 0.12);
    }
    .search svg { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }
    .search input {
      flex: 1;
      min-width: 0;
      outline: none;
      font-size: 0.88rem;
    }
    .search input::placeholder { color: var(--text-faint); }
    .clock {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .stage {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 24px;
      min-height: 0;
      padding-bottom: 12px;
    }

    /* —— Now Playing Hero —— */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
      border-radius: calc(var(--radius) + 6px);
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(28px) saturate(1.2);
      overflow: hidden;
      min-height: 0;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, hsl(var(--track-hue) 60% 50% / 0.28), transparent 55%),
        radial-gradient(ellipse at 80% 80%, hsl(calc(var(--track-hue) + 50) 40% 40% / 0.18), transparent 50%);
      transition: background 1s var(--ease);
      pointer-events: none;
    }
    .hero-art-wrap {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: min(52%, 280px);
      aspect-ratio: 1;
      z-index: 1;
    }
    .hero-art {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.1);
      transition: transform 0.6s var(--ease), box-shadow 0.6s;
      object-fit: cover;
      background: #1a1620;
    }
    .hero.playing .hero-art {
      transform: scale(1.02);
      box-shadow:
        0 36px 70px rgba(0,0,0,0.5),
        0 0 40px hsl(var(--track-hue) 60% 50% / 0.35),
        0 0 0 1px rgba(255,255,255,0.12);
      animation: float-art 6s ease-in-out infinite;
    }
    @keyframes float-art {
      0%, 100% { transform: scale(1.02) translateY(0); }
      50% { transform: scale(1.02) translateY(-6px); }
    }
    .hero-art-ring {
      position: absolute;
      inset: -14px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.06);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .hero.playing .hero-art-ring { opacity: 1; }

    .hero-body {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding-top: min(48%, 260px);
    }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .hero.playing .pulse-dot { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.75); }
    }
    .hero-title {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3.2vw, 2.6rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 6px;
      transition: opacity 0.35s, transform 0.35s var(--ease);
    }
    .hero-artist {
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 450;
      margin-bottom: 22px;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-dim);
    }

    .viz {
      height: 48px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      margin-bottom: 8px;
      opacity: 0.85;
    }
    .viz span {
      flex: 1;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(to top, var(--accent-soft), var(--accent));
      height: 12%;
      transition: height 0.08s linear;
      opacity: 0.75;
    }

    /* —— Track list panel —— */
    .queue-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: rgba(18, 16, 22, 0.55);
      border: 1px solid var(--glass-edge);
      border-radius: calc(var(--radius) + 6px);
      backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow: var(--shadow-deep);
    }
    .queue-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 20px 22px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .queue-head h2 {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 400;
    }
    .queue-head span {
      font-size: 0.75rem;
      color: var(--text-faint);
    }
    .track-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }
    .track {
      display: grid;
      grid-template-columns: 36px 44px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.25s var(--ease);
      animation: track-in 0.45s var(--ease) both;
    }
    .track:hover { background: rgba(255,255,255,0.045); }
    .track.active {
      background: rgba(232, 168, 124, 0.1);
    }
    .track:active { transform: scale(0.985); }
    .track-idx {
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      color: var(--text-faint);
      text-align: center;
    }
    .track.active .track-idx { color: var(--accent); }
    .track-eq {
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      height: 14px;
    }
    .track.active.playing .track-idx { display: none; }
    .track.active.playing .track-eq { display: flex; }
    .track-eq i {
      width: 3px;
      background: var(--accent);
      border-radius: 1px;
      animation: eq 0.9s ease-in-out infinite;
    }
    .track-eq i:nth-child(1) { height: 40%; animation-delay: 0s; }
    .track-eq i:nth-child(2) { height: 80%; animation-delay: 0.15s; }
    .track-eq i:nth-child(3) { height: 55%; animation-delay: 0.3s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }
    .track-thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      background: var(--bg-3);
    }
    .track-info { min-width: 0; }
    .track-info strong {
      display: block;
      font-size: 0.88rem;
      font-weight: 560;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track.active .track-info strong { color: var(--accent); }
    .track-info small {
      color: var(--text-faint);
      font-size: 0.75rem;
    }
    .track-album {
      font-size: 0.75rem;
      color: var(--text-faint);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-dur {
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
      color: var(--text-faint);
      padding-right: 4px;
    }
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-faint);
    }
    .empty-state p { margin-top: 8px; font-size: 0.88rem; }

    @keyframes track-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    /* —— Player bar —— */
    .player {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      align-items: center;
      gap: 20px;
      padding: 16px 22px 20px;
      margin: 0 -4px;
      background: linear-gradient(to top, rgba(10,9,12,0.95), rgba(18,16,22,0.82));
      border-top: 1px solid var(--glass-edge);
      backdrop-filter: blur(24px);
      animation: rise 1s var(--ease) 0.15s both;
    }
    .now-mini {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .now-mini img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      background: var(--bg-3);
      transition: transform 0.4s var(--ease);
    }
    .player.is-playing .now-mini img {
      animation: spin-slow 24s linear infinite;
      border-radius: 50%;
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .now-mini-text { min-width: 0; }
    .now-mini-text strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-mini-text small {
      color: var(--text-dim);
      font-size: 0.78rem;
    }
    .like-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text-faint);
      transition: color 0.2s, background 0.2s, transform 0.25s var(--ease);
      flex-shrink: 0;
    }
    .like-btn:hover { background: rgba(255,255,255,0.06); color: var(--rose); }
    .like-btn.liked { color: var(--rose); }
    .like-btn.liked svg { fill: currentColor; }
    .like-btn:active { transform: scale(0.9); }
    .like-btn svg { width: 18px; height: 18px; }

    .transport {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text-dim);
      transition: color 0.2s, background 0.2s, transform 0.2s var(--ease);
    }
    .ctrl:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .ctrl:active { transform: scale(0.92); }
    .ctrl.on { color: var(--accent); }
    .ctrl svg { width: 18px; height: 18px; }
    .ctrl-play {
      width: 48px;
      height: 48px;
      margin: 0 6px;
      background: var(--text);
      color: var(--bg-0);
      box-shadow: 0 8px 28px rgba(244, 239, 232, 0.2);
    }
    .ctrl-play:hover {
      background: #fff;
      color: var(--bg-0);
      transform: scale(1.05);
    }
    .ctrl-play svg { width: 22px; height: 22px; }

    .scrub {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 0.7rem;
      color: var(--text-faint);
    }
    .time.end { text-align: right; }

    .range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      outline: none;
      cursor: pointer;
      position: relative;
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 0 0 transparent;
      transition: box-shadow 0.2s, transform 0.2s;
      margin-top: -4px;
    }
    .range:hover::-webkit-slider-thumb,
    .range:focus-visible::-webkit-slider-thumb {
      transform: scale(1.15);
      box-shadow: 0 0 0 4px rgba(232, 168, 124, 0.25);
    }
    .range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: var(--text);
    }
    .range::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
    }

    .extras {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .vol {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 140px;
    }
    .vol .ctrl { width: 34px; height: 34px; }
    .vol .range { max-width: 90px; }

    /* —— Toast —— */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      padding: 10px 18px;
      background: rgba(28, 24, 36, 0.92);
      border: 1px solid var(--glass-edge);
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--text);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.35s var(--ease);
      z-index: 50;
      box-shadow: var(--shadow-deep);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* —— Reduced motion —— */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 220px 1fr; gap: 0 14px; }
      .stage { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 42vh) 1fr; }
      .hero-art-wrap { width: min(40%, 200px); top: 24px; }
      .hero-body { padding-top: min(38%, 200px); }
      .track-album { display: none; }
      .player { grid-template-columns: minmax(140px, 1fr) 1.6fr minmax(100px, 0.8fr); }
    }
    @media (max-width: 780px) {
      .app {
        grid-template-columns: 1fr;
        padding: 12px 12px 0;
      }
      .sidebar { display: none; }
      .player {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 14px 16px 18px;
      }
      .now-mini { order: 2; }
      .transport { order: 1; }
      .extras { order: 3; justify-content: center; }
      .vol { width: 160px; }
    }
  </style>
</head>
<body>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>

        <div class="vol">
          <button class="ctrl" id="muteBtn" type="button" aria-label="Mute" title="Mute">
            <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
          </button>

        </div>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
  (() => {
    const CATALOG = [
      { id: "t1", title: "Soft Amber", artist: "Mira Vale", album: "Window Light", collection: "Evening mix", genre: "Ambient", mood: "Warm", duration: 48, hue: 28, seed: 11, progression: [0, 5, 7, 4], tempo: 72 },
      { id: "t2", title: "Glass Harbor", artist: "Northline", album: "Quiet Ports", collection: "Evening mix", genre: "Downtempo", mood: "Cool", duration: 52, hue: 200, seed: 22, progression: [0, 3, 5, 7], tempo: 84 },
      { id: "t3", title: "Paper Lanterns", artist: "Kite & Loom", album: "Night Market", collection: "Evening mix", genre: "Indie", mood: "Tender", duration: 44, hue: 12, seed: 33, progression: [0, 7, 9, 5], tempo: 96 },
      { id: "t4", title: "Copper Static", artist: "Field Relay", album: "Signal Bloom", collection: "Focus lane", genre: "Electronic", mood: "Focused", duration: 56, hue: 18, seed: 44, progression: [0, 2, 7, 5], tempo: 110 },
      { id: "t5", title: "Blue Hour Study", artist: "Elena Moss", album: "Desk Lamp", collection: "Focus lane", genre: "Neo-classical", mood: "Clear", duration: 60, hue: 220, seed: 55, progression: [0, 4, 5, 2], tempo: 68 },
      { id: "t6", title: "Velvet Orbit", artist: "Sable Arc", album: "Low Gravity", collection: "Focus lane", genre: "Synth", mood: "Deep", duration: 50, hue: 275, seed: 66, progression: [0, 5, 3, 7], tempo: 90 },
      { id: "t7", title: "Rain on Tile", artist: "Juniper Coast", album: "Porch Songs", collection: "Late night", genre: "Folk ambient", mood: "Soft", duration: 46, hue: 160, seed: 77, progression: [0, 7, 4, 9], tempo: 76 },
      { id: "t8", title: "Midnight Lobby", artist: "Hotel Atlas", album: "After Hours", collection: "Late night", genre: "Jazztronica", mood: "Noir", duration: 54, hue: 340, seed: 88, progression: [0, 3, 8, 5], tempo: 88 },
      { id: "t9", title: "Ember Cartography", artist: "Lumen Atlas", album: "Warm Maps", collection: "Late night", genre: "Cinematic", mood: "Wide", duration: 58, hue: 35, seed: 99, progression: [0, 5, 7, 2], tempo: 64 },
      { id: "t10", title: "Silver Thrum", artist: "Northline", album: "Quiet Ports", collection: "Favorites", genre: "Downtempo", mood: "Bright", duration: 42, hue: 190, seed: 17, progression: [0, 7, 5, 9], tempo: 100 },
      { id: "t11", title: "Hearth Frequency", artist: "Mira Vale", album: "Window Light", collection: "Favorites", genre: "Ambient", mood: "Cozy", duration: 55, hue: 22, seed: 28, progression: [0, 4, 7, 5], tempo: 70 },
      { id: "t12", title: "Orbit Notes", artist: "Sable Arc", album: "Low Gravity", collection: "Favorites", genre: "Synth", mood: "Curious", duration: 49, hue: 255, seed: 39, progression: [0, 2, 5, 7], tempo: 104 }
    ];

    const COLLECTIONS = [
      { id: "Evening mix", desc: "Warm fade into night", hue: 28 },
      { id: "Focus lane", desc: "Steady & spacious", hue: 210 },
      { id: "Late night", desc: "Low lights, slow pulse", hue: 340 },
      { id: "Favorites", desc: "Kept close", hue: 45 }
    ];

    const state = {
      view: "all",
      collection: "Evening mix",
      query: "",
      index: 0,
      queue: [],
      playing: false,
      shuffle: false,
      repeat: false, // false | true | 'one'
      volume: 0.78,
      muted: false,
      liked: new Set(JSON.parse(localStorage.getItem("afterglow-liked") || '["t1","t9","t11"]')),
      recent: JSON.parse(localStorage.getItem("afterglow-recent") || "[]"),
      seekDragging: false,
      trackStart: 0,
      elapsed: 0,
      raf: 0
    };

    // —— DOM ——
    const $ = (s) => document.querySelector(s);
    const hero = $("#hero");
    const heroArt = $("#heroArt");
    const miniArt = $("#miniArt");
    const heroTitle = $("#heroTitle");
    const heroArtist = $("#heroArtist");
    const heroMeta = $("#heroMeta");
    const heroStatus = $("#heroStatus");
    const trackList = $("#trackList");
    const queueTitle = $("#queueTitle");
    const queueCount = $("#queueCount");
    const playBtn = $("#playBtn");
    const playIcon = $("#playIcon");
    const playerBar = $("#playerBar");
    const seek = $("#seek");
    const volume = $("#volume");
    const timeCur = $("#timeCur");
    const timeEnd = $("#timeEnd");
    const viz = $("#viz");
    const toastEl = $("#toast");
    const likeBtn = $("#likeBtn");

    for (let i = 0; i < 28; i++) {
      const s = document.createElement("span");
      viz.appendChild(s);
    }
    const vizBars = [...viz.children];

    // —— Audio engine (procedural, self-contained) ——
    let audioCtx = null;
    let masterGain = null;
    let analyser = null;
    let voiceNodes = [];
    let schedulerTimer = null;
    let nextNoteTime = 0;
    let noteIndex = 0;
    let currentRoot = 220;

    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = state.muted ? 0 : state.volume;
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      masterGain.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function stopVoices() {
      voiceNodes.forEach((n) => {
        try { n.stop?.(); n.disconnect?.(); } catch (_) {}
      });
      voiceNodes = [];
      if (schedulerTimer) {
        clearTimeout(schedulerTimer);
        schedulerTimer = null;
      }
    }

    function playChord(freqs, when, dur, tone) {
      const now = when;
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = tone.wave;
        osc.frequency.value = f * (1 + (i * 0.0008));
        filter.type = "lowpass";
        filter.frequency.value = tone.cutoff;
        filter.Q.value = 0.7;
        const peak = tone.amp * (i === 0 ? 1 : 0.55);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(peak, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(peak * 0.7, now + dur * 0.4);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + dur + 0.05);
        voiceNodes.push(osc, gain, filter);
      });

      // soft pulse / sub
      const sub = audioCtx.createOscillator();
      const sg = audioCtx.createGain();
      sub.type = "sine";
      sub.frequency.value = freqs[0] / 2;
      sg.gain.setValueAtTime(0.0001, now);
      sg.gain.exponentialRampToValueAtTime(tone.amp * 0.35, now + 0.1);
      sg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      sub.connect(sg);
      sg.connect(masterGain);
      sub.start(now);
      sub.stop(now + dur + 0.05);
      voiceNodes.push(sub, sg);

      // shimmer high
      const shim = audioCtx.createOscillator();
      const shg = audioCtx.createGain();
      shim.type = "triangle";
      shim.frequency.value = freqs[0] * 2;
      shg.gain.setValueAtTime(0.0001, now + 0.05);
      shg.gain.exponentialRampToValueAtTime(tone.amp * 0.12, now + 0.2);
      shg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.85);
      shim.connect(shg);
      shg.connect(masterGain);
      shim.start(now);
      shim.stop(now + dur);
      voiceNodes.push(shim, shg);
    }

    function schedule() {
      if (!state.playing || !audioCtx) return;
      const track = state.queue[state.index];
      if (!track) return;

      const beat = 60 / track.tempo;
      const bar = beat * 4;
      const lookAhead = 0.18;

      while (nextNoteTime < audioCtx.currentTime + lookAhead) {
        const step = noteIndex % track.progression.length;
        const degree = track.progression[step];
        const rootMidi = 57 + (track.seed % 5); // around A3-ish
        const chordMidi = [
          rootMidi + degree,
          rootMidi + degree + 4,
          rootMidi + degree + 7,
          rootMidi + degree + 11
        ];
        const freqs = chordMidi.map(midiToFreq);
        const tone = {
          wave: track.hue > 200 ? "sine" : track.tempo > 95 ? "triangle" : "sine",
          cutoff: 900 + (track.hue % 100) * 8 + step * 40,
          amp: 0.085
        };
        playChord(freqs, nextNoteTime, bar * 0.95, tone);
        nextNoteTime += bar;
        noteIndex++;
      }

      // track progress
      const elapsed = (performance.now() - state.trackStart) / 1000;
      state.elapsed = Math.min(elapsed, track.duration);
      if (!state.seekDragging) {
        seek.value = Math.round((state.elapsed / track.duration) * 1000);
        timeCur.textContent = fmt(state.elapsed);
      }

      if (state.elapsed >= track.duration) {
        onTrackEnd();
        return;
      }

      schedulerTimer = setTimeout(schedule, 40);
    }

    function startPlayback() {
      ensureAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      stopVoices();
      const track = state.queue[state.index];
      if (!track) return;
      noteIndex = 0;
      nextNoteTime = audioCtx.currentTime + 0.05;
      currentRoot = midiToFreq(57 + (track.seed % 5));
      state.trackStart = performance.now() - state.elapsed * 1000;
      state.playing = true;
      updatePlayingUI();
      schedule();
      startViz();
      pushRecent(track.id);
    }

    function pausePlayback() {
      state.playing = false;
      stopVoices();
      updatePlayingUI();
    }

    function onTrackEnd() {
      if (state.repeat === "one") {
        state.elapsed = 0;
        startPlayback();
        return;
      }
      const next = nextIndex();
      if (next === null) {
        pausePlayback();
        state.elapsed = 0;
        seek.value = 0;
        timeCur.textContent = "0:00";
        return;
      }
      loadTrack(next, true);
    }

    function nextIndex() {
      if (!state.queue.length) return null;
      if (state.shuffle) {
        if (state.queue.length === 1) return state.repeat ? 0 : null;
        let n;
        do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.index);
        return n;
      }
      if (state.index < state.queue.length - 1) return state.index + 1;
      return state.repeat ? 0 : null;
    }

    function prevIndex() {
      if (!state.queue.length) return null;
      if (state.elapsed > 3) return state.index;
      if (state.shuffle) return nextIndex();
      if (state.index > 0) return state.index - 1;
      return state.repeat ? state.queue.length - 1 : 0;
    }

    // —— Visualizer ——
    let vizRaf = 0;
    const freqData = new Uint8Array(32);

    function startViz() {
      cancelAnimationFrame(vizRaf);
      const tick = () => {
        if (analyser && state.playing) {
          analyser.getByteFrequencyData(freqData);
          vizBars.forEach((bar, i) => {
            const v = freqData[i % freqData.length] / 255;
            const h = Math.max(8, v * 100);
            bar.style.height = h + "%";
            bar.style.opacity = 0.35 + v * 0.65;
          });
        } else {
          vizBars.forEach((bar, i) => {
            bar.style.height = (8 + Math.sin(Date.now() / 600 + i) * 4) + "%";
            bar.style.opacity = 0.35;
          });
        }
        vizRaf = requestAnimationFrame(tick);
      };
      tick();
    }

    // —— Generative album art ——
    function drawArt(canvas, track, size) {
      const ctx = canvas.getContext("2d");
      const w = size, h = size;
      canvas.width = w;
      canvas.height = h;
      const g = ctx.createLinearGradient(0, 0, w, h);
      const h1 = track.hue;
      g.addColorStop(0, `hsl(${h1} 48% 28%)`);
      g.addColorStop(0.45, `hsl(${(h1 + 30) % 360} 40% 18%)`);
      g.addColorStop(1, `hsl(${(h1 + 60) % 360} 35% 12%)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // soft orbs
      const rnd = mulberry(track.seed);
      for (let i = 0; i < 5; i++) {
        const x = rnd() * w;
        const y = rnd() * h;
        const r = (0.15 + rnd() * 0.35) * w;
        const og = ctx.createRadialGradient(x, y, 0, x, y, r);
        og.addColorStop(0, `hsla(${(h1 + i * 25) % 360} 70% 60% / ${0.35 - i * 0.04})`);
        og.addColorStop(1, "transparent");
        ctx.fillStyle = og;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // arc motif
      ctx.strokeStyle = `hsla(${h1} 70% 75% / 0.35)`;
      ctx.lineWidth = w * 0.012;
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.55, w * 0.28, -0.2, Math.PI * 1.1);
      ctx.stroke();
      ctx.strokeStyle = `hsla(${(h1 + 40) % 360} 60% 80% / 0.2)`;
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.55, w * 0.38, 0.4, Math.PI * 1.4);
      ctx.stroke();

      // grain dots
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let i = 0; i < 80; i++) {
        ctx.fillRect(rnd() * w, rnd() * h, 1.5, 1.5);
      }

      // monogram
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = `500 ${Math.round(w * 0.09)}px "Instrument Serif", serif`;
      ctx.textAlign = "center";
      ctx.fillText(track.title.slice(0, 1), w * 0.5, h * 0.58);
    }

    function mulberry(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // —— UI helpers ——
    function fmt(sec) {
      sec = Math.max(0, Math.floor(sec));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function persist() {
      localStorage.setItem("afterglow-liked", JSON.stringify([...state.liked]));
      localStorage.setItem("afterglow-recent", JSON.stringify(state.recent.slice(0, 20)));
    }

    function pushRecent(id) {
      state.recent = [id, ...state.recent.filter((x) => x !== id)].slice(0, 20);
      persist();
    }

    function filteredTracks() {
      let list = [...CATALOG];
      if (state.view === "liked") list = list.filter((t) => state.liked.has(t.id));
      else if (state.view === "recent") {
        list = state.recent.map((id) => CATALOG.find((t) => t.id === id)).filter(Boolean);
      } else if (state.view === "collection") {
        list = list.filter((t) => t.collection === state.collection);
      }
      const q = state.query.trim().toLowerCase();
      if (q) {
        list = list.filter((t) =>
          [t.title, t.artist, t.album, t.genre, t.mood].join(" ").toLowerCase().includes(q)
        );
      }
      return list;
    }

    function renderPlaylists() {
      const nav = $("#playlistNav");
      nav.innerHTML = `<p class="nav-label">Collections</p>` + COLLECTIONS.map((c) => `
        <button class="pl-item ${state.view === "collection" && state.collection === c.id ? "active" : ""}" data-collection="${c.id}" type="button">
          <div class="pl-swatch" style="background:linear-gradient(135deg,hsl(${c.hue} 50% 42%),hsl(${(c.hue+40)%360} 40% 22%))"></div>
          <div class="pl-meta">
            <strong>${c.id}</strong>
            <small>${c.desc}</small>
          </div>
        </button>
      `).join("");
      nav.querySelectorAll("[data-collection]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.view = "collection";
          state.collection = btn.dataset.collection;
          document.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
          renderPlaylists();
          rebuildQueue(true);
        });
      });
    }

    function renderList() {
      const list = filteredTracks();
      queueCount.textContent = list.length + (list.length === 1 ? " track" : " tracks");
      if (state.view === "liked") queueTitle.textContent = "Liked";
      else if (state.view === "recent") queueTitle.textContent = "Recently played";
      else if (state.view === "collection") queueTitle.textContent = state.collection;
      else queueTitle.textContent = "All tracks";

      if (!list.length) {
        trackList.innerHTML = `<div class="empty-state"><strong>Nothing here yet</strong><p>Try another collection or clear your search.</p></div>`;
        return;
      }

      const currentId = state.queue[state.index]?.id;
      trackList.innerHTML = list.map((t, i) => {
        const active = t.id === currentId;
        return `
          <div class="track ${active ? "active" : ""} ${active && state.playing ? "playing" : ""}" role="listitem" data-id="${t.id}" style="animation-delay:${Math.min(i, 12) * 0.03}s">
            <div class="track-idx">${String(i + 1).padStart(2, "0")}</div>
            <div class="track-eq" aria-hidden="true"><i></i><i></i><i></i></div>
            <canvas class="track-thumb" width="88" height="88" data-art="${t.id}"></canvas>
            <div class="track-info">
              <strong>${escapeHtml(t.title)}</strong>
              <small>${escapeHtml(t.artist)}</small>
            </div>
            <span class="track-album">${escapeHtml(t.album)}</span>
            <span class="track-dur">${fmt(t.duration)}</span>
          </div>`;
      }).join("");

      trackList.querySelectorAll(".track").forEach((el) => {
        el.addEventListener("click", () => {
          const id = el.dataset.id;
          const idx = state.queue.findIndex((t) => t.id === id);
          if (idx >= 0) {
            if (idx === state.index && state.playing) pausePlayback();
            else loadTrack(idx, true);
          } else {
            // rebuild queue from current filter and play
            state.queue = filteredTracks();
            const n = state.queue.findIndex((t) => t.id === id);
            if (n >= 0) loadTrack(n, true);
          }
        });
        el.addEventListener("dblclick", () => {
          const id = el.dataset.id;
          state.queue = filteredTracks();
          const n = state.queue.findIndex((t) => t.id === id);
          if (n >= 0) loadTrack(n, true);
        });
      });

      trackList.querySelectorAll("canvas[data-art]").forEach((c) => {
        const t = CATALOG.find((x) => x.id === c.dataset.art);
        if (t) drawArt(c, t, 88);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }

    function updatePlayingUI() {
      const track = state.queue[state.index];
      playerBar.classList.toggle("is-playing", state.playing);
      hero.classList.toggle("playing", state.playing);
      playBtn.setAttribute("aria-label", state.playing ? "Pause" : "Play");
      playBtn.title = state.playing ? "Pause" : "Play";
      playIcon.innerHTML = state.playing
        ? '<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>'
        : '<path d="M8 5v14l11-7z"/>';
      heroStatus.textContent = state.playing ? "Now playing" : track ? "Paused" : "Ready";
      document.querySelectorAll(".track").forEach((el) => {
        const on = el.dataset.id === track?.id;
        el.classList.toggle("active", on);
        el.classList.toggle("playing", on && state.playing);
      });
    }

    function updateNowPlaying() {
      const track = state.queue[state.index];
      if (!track) return;
      document.documentElement.style.setProperty("--track-hue", track.hue);
      heroTitle.style.opacity = "0";
      heroTitle.style.transform = "translateY(6px)";
      setTimeout(() => {
        heroTitle.textContent = track.title;
        heroArtist.textContent = track.artist;
        heroTitle.style.opacity = "1";
        heroTitle.style.transform = "none";
      }, 180);

      heroMeta.innerHTML = `
        <span class="chip">${escapeHtml(track.album)}</span>
        <span class="chip">${escapeHtml(track.genre)}</span>
        <span class="chip">${escapeHtml(track.mood)}</span>
        <span class="chip">${fmt(track.duration)}</span>`;

      $("#miniTitle").textContent = track.title;
      $("#miniArtist").textContent = track.artist;
      timeEnd.textContent = fmt(track.duration);
      drawArt(heroArt, track, 400);
      drawArt(miniArt, track, 112);
      likeBtn.classList.toggle("liked", state.liked.has(track.id));
      likeBtn.setAttribute("aria-pressed", state.liked.has(track.id) ? "true" : "false");
      updatePlayingUI();
    }

    function loadTrack(index, autoplay) {
      if (!state.queue.length) return;
      state.index = ((index % state.queue.length) + state.queue.length) % state.queue.length;
      state.elapsed = 0;
      seek.value = 0;
      timeCur.textContent = "0:00";
      updateNowPlaying();
      renderList();
      if (autoplay) startPlayback();
      else {
        pausePlayback();
        startViz();
      }
    }

    function rebuildQueue(keepCurrent) {
      const prevId = state.queue[state.index]?.id;
      state.queue = filteredTracks();
      renderPlaylists();
      renderList();
      if (!state.queue.length) {
        pausePlayback();
        return;
      }
      let idx = 0;
      if (keepCurrent && prevId) {
        const found = state.queue.findIndex((t) => t.id === prevId);
        idx = found >= 0 ? found : 0;
      }
      if (!keepCurrent || !prevId) {
        loadTrack(0, false);
      } else {
        state.index = idx;
        updateNowPlaying();
        renderList();
      }
    }

    function updateClock() {
      const d = new Date();
      $("#clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    // —— Events ——
    document.querySelectorAll(".nav-item[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        document.querySelectorAll(".nav-item").forEach((n) => n.classList.toggle("active", n === btn));
        renderPlaylists();
        rebuildQueue(true);
      });
    });

    $("#search").addEventListener("input", (e) => {
      state.query = e.target.value;
      renderList();
    });

    playBtn.addEventListener("click", () => {
      if (!state.queue.length) return;
      if (state.playing) pausePlayback();
      else startPlayback();
    });

    $("#nextBtn").addEventListener("click", () => {
      const n = nextIndex();
      if (n !== null) loadTrack(n, true);
      else toast("End of queue");
    });

    $("#prevBtn").addEventListener("click", () => {
      const n = prevIndex();
      if (n !== null) {
        if (n === state.index && state.elapsed > 3) {
          state.elapsed = 0;
          if (state.playing) startPlayback();
          else { seek.value = 0; timeCur.textContent = "0:00"; }
        } else loadTrack(n, true);
      }
    });

    $("#shuffleBtn").addEventListener("click", () => {
      state.shuffle = !state.shuffle;
      $("#shuffleBtn").classList.toggle("on", state.shuffle);
      $("#shuffleBtn").setAttribute("aria-pressed", String(state.shuffle));
      toast(state.shuffle ? "Shuffle on" : "Shuffle off");
    });

    $("#repeatBtn").addEventListener("click", () => {
      if (!state.repeat) state.repeat = true;
      else if (state.repeat === true) state.repeat = "one";
      else state.repeat = false;
      const on = !!state.repeat;
      $("#repeatBtn").classList.toggle("on", on);
      $("#repeatBtn").setAttribute("aria-pressed", String(on));
      toast(state.repeat === "one" ? "Repeat one" : state.repeat ? "Repeat all" : "Repeat off");
    });

    likeBtn.addEventListener("click", () => {
      const t = state.queue[state.index];
      if (!t) return;
      if (state.liked.has(t.id)) {
        state.liked.delete(t.id);
        toast("Removed from liked");
      } else {
        state.liked.add(t.id);
        toast("Added to liked");
      }
      persist();
      likeBtn.classList.toggle("liked", state.liked.has(t.id));
      if (state.view === "liked") renderList();
    });

    seek.addEventListener("pointerdown", () => { state.seekDragging = true; });
    seek.addEventListener("pointerup", () => {
      const track = state.queue[state.index];
      if (track) {
        state.elapsed = (seek.value / 1000) * track.duration;
        state.trackStart = performance.now() - state.elapsed * 1000;
        timeCur.textContent = fmt(state.elapsed);
        if (state.playing) {
          stopVoices();
          noteIndex = Math.floor(state.elapsed / ((60 / track.tempo) * 4));
          nextNoteTime = audioCtx.currentTime + 0.05;
          schedule();
        }
      }
      state.seekDragging = false;
    });
    seek.addEventListener("input", () => {
      const track = state.queue[state.index];
      if (track) timeCur.textContent = fmt((seek.value / 1000) * track.duration);
    });

    volume.addEventListener("input", () => {
      state.volume = volume.value / 100;
      state.muted = false;
      if (masterGain) masterGain.gain.setTargetAtTime(state.volume, audioCtx.currentTime, 0.02);
      updateVolIcon();
    });

    $("#muteBtn").addEventListener("click", () => {
      state.muted = !state.muted;
      if (masterGain) masterGain.gain.setTargetAtTime(state.muted ? 0 : state.volume, audioCtx.currentTime, 0.02);
      updateVolIcon();
    });

    function updateVolIcon() {
      const muted = state.muted || state.volume === 0;
      $("#volIcon").innerHTML = muted
        ? '<path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M18 10l4 4M22 10l-4 4"/>'
        : '<path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/>';
    }

    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.code === "Space") {
        e.preventDefault();
        playBtn.click();
      } else if (e.code === "ArrowRight") $("#nextBtn").click();
      else if (e.code === "ArrowLeft") $("#prevBtn").click();
      else if (e.key === "s" || e.key === "S") $("#shuffleBtn").click();
      else if (e.key === "r" || e.key === "R") $("#repeatBtn").click();
      else if (e.key === "l" || e.key === "L") likeBtn.click();
      else if (e.key === "m" || e.key === "M") $("#muteBtn").click();
    });

    // —— Boot ——
    renderPlaylists();
    state.view = "collection";
    state.collection = "Evening mix";
    document.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
    state.queue = filteredTracks();
    renderList();
    loadTrack(0, false);
    updateClock();
    setInterval(updateClock, 30000);
    startViz();
    volume.value = Math.round(state.volume * 100);
  })();
  </script>
</body>
</html>
