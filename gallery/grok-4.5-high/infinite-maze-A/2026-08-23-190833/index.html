<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Maze — Auto Navigator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070c;
      --hud: #d7e6ff;
      --muted: #8fa3c4;
      --accent: #5ce1ff;
      --panel: rgba(8, 14, 28, 0.72);
      --line: rgba(92, 225, 255, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--hud);
    }

    #canvas-host {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .panel {
      position: absolute;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .top-left {
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      min-width: min(280px, calc(100vw - 32px));
    }

    .top-right {
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      text-align: right;
    }

    .bottom {
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    h1 {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9dffb0;
    }

    .status.paused { color: #ffd18a; }

    .stat-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }

    .stat-grid span:nth-child(odd) {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.35;
      max-width: 18rem;
    }

    button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(20, 34, 58, 0.9);
      color: var(--hud);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: rgba(36, 58, 94, 0.95);
      border-color: rgba(92, 225, 255, 0.55);
    }

    button:active { transform: translateY(1px); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.28));
      pointer-events: none;
    }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      opacity: 0.55;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(215, 230, 255, 0.85);
      box-shadow: 0 0 8px rgba(92, 225, 255, 0.45);
    }

    .crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    .crosshair::after {
      top: 50%;
      left: 0;
      height: 2px;
      width: 100%;
      transform: translateY(-50%);
    }

    @media (max-width: 640px) {
      .top-right { display: none; }
      .stat-grid { font-size: 0.84rem; }
      .bottom { width: calc(100vw - 24px); justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="canvas-host" aria-hidden="true"></div>
  <div id="hud">
    <div class="vignette"></div>
    <div class="crosshair" aria-hidden="true"></div>

    <div class="panel top-left">
      <div class="title-row">
        <h1>Infinite Maze</h1>
        <div id="run-status" class="status">Auto-navigating</div>
      </div>
      <div class="stat-grid">
        <span>Cell</span><strong id="stat-cell">0, 0</strong>
        <span>Heading</span><strong id="stat-heading">North</strong>
        <span>Explored</span><strong id="stat-explored">1</strong>
        <span>Distance</span><strong id="stat-distance">0</strong>
        <span>Decision</span><strong id="stat-decision">starting</strong>
      </div>
    </div>

    <div class="panel top-right">
      <p class="hint">
        The camera walks forever through a procedurally endless first-person maze.
        New corridors generate ahead as it explores.
      </p>
    </div>

    <div class="panel bottom">
      <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
      <button type="button" id="btn-speed">Speed ×1</button>
      <button type="button" id="btn-reset">Reset</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from "three";

const CELL_SIZE = 3.2;
const WALL_HEIGHT = 2.55;
const WALL_THICKNESS = 0.22;
const CHUNK_SIZE = 10;
const VIEW_RADIUS = 14;
const EYE_HEIGHT = 1.35;
const MOVE_DURATION = 0.78;
const TURN_DURATION = 0.48;
const SPEEDS = [0.65, 1, 1.6, 2.4];

const DIRS = [
  { name: "North", dx: 0, dz: -1, yaw: Math.PI },
  { name: "East",  dx: 1, dz: 0,  yaw: -Math.PI / 2 },
  { name: "South", dx: 0, dz: 1,  yaw: 0 },
  { name: "West",  dx: -1, dz: 0, yaw: Math.PI / 2 },
];

const OPPOSITE = [2, 3, 0, 1];

function cellKey(x, z) {
  return `${x},${z}`;
}

function chunkKey(cx, cz) {
  return `${cx},${cz}`;
}

function floorDiv(n, d) {
  return Math.floor(n / d);
}

/** Deterministic 32-bit hash */
function hash2(x, z) {
  let h = (x * 374761393 + z * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return h >>> 0;
}

function mulberry32(seed) {
  let t = seed >>> 0;
  return function rand() {
    t += 0x6d2b79f5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

class InfiniteMaze {
  constructor() {
    this.cells = new Map();
    this.chunks = new Set();
  }

  ensureChunk(cx, cz) {
    const key = chunkKey(cx, cz);
    if (this.chunks.has(key)) return;
    this.chunks.add(key);
    this._generateChunk(cx, cz);
    this._openBoundary(cx, cz, cx - 1, cz);
    this._openBoundary(cx, cz, cx + 1, cz);
    this._openBoundary(cx, cz, cx, cz - 1);
    this._openBoundary(cx, cz, cx, cz + 1);
  }

  ensureAround(x, z, radius = VIEW_RADIUS) {
    const minCX = floorDiv(x - radius, CHUNK_SIZE);
    const maxCX = floorDiv(x + radius, CHUNK_SIZE);
    const minCZ = floorDiv(z - radius, CHUNK_SIZE);
    const maxCZ = floorDiv(z + radius, CHUNK_SIZE);
    for (let cz = minCZ; cz <= maxCZ; cz++) {
      for (let cx = minCX; cx <= maxCX; cx++) {
        this.ensureChunk(cx, cz);
      }
    }
  }

  getCell(x, z) {
    this.ensureChunk(floorDiv(x, CHUNK_SIZE), floorDiv(z, CHUNK_SIZE));
    return this.cells.get(cellKey(x, z));
  }

  isOpen(x, z, dir) {
    const cell = this.getCell(x, z);
    return cell ? !cell.walls[dir] : false;
  }

  openDirs(x, z) {
    const out = [];
    for (let d = 0; d < 4; d++) {
      if (this.isOpen(x, z, d)) out.push(d);
    }
    return out;
  }

  _generateChunk(cx, cz) {
    const rand = mulberry32(hash2(cx * 131, cz * 917));
    const x0 = cx * CHUNK_SIZE;
    const z0 = cz * CHUNK_SIZE;

    const local = [];
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        const x = x0 + lx;
        const z = z0 + lz;
        const cell = {
          x, z,
          walls: [true, true, true, true],
          visited: false,
        };
        this.cells.set(cellKey(x, z), cell);
        local.push(cell);
      }
    }

    // Recursive backtracker for a perfect maze inside the chunk
    const start = local[(rand() * local.length) | 0];
    const stack = [start];
    start.visited = true;

    while (stack.length) {
      const current = stack[stack.length - 1];
      const lx = current.x - x0;
      const lz = current.z - z0;
      const neighbors = [];

      for (let d = 0; d < 4; d++) {
        const nx = lx + DIRS[d].dx;
        const nz = lz + DIRS[d].dz;
        if (nx < 0 || nz < 0 || nx >= CHUNK_SIZE || nz >= CHUNK_SIZE) continue;
        const neighbor = this.cells.get(cellKey(x0 + nx, z0 + nz));
        if (neighbor && !neighbor.visited) neighbors.push({ neighbor, d });
      }

      if (!neighbors.length) {
        stack.pop();
        continue;
      }

      const pick = neighbors[(rand() * neighbors.length) | 0];
      current.walls[pick.d] = false;
      pick.neighbor.walls[OPPOSITE[pick.d]] = false;
      pick.neighbor.visited = true;
      stack.push(pick.neighbor);
    }

    for (const cell of local) delete cell.visited;
  }

  _openBoundary(cx, cz, ox, oz) {
    if (!this.chunks.has(chunkKey(ox, oz))) return;

    const horizontal = cz === oz;
    const rand = mulberry32(hash2(
      Math.min(cx, ox) * 92821 + Math.max(cx, ox),
      Math.min(cz, oz) * 68987 + Math.max(cz, oz) + (horizontal ? 1 : 7)
    ));

    const openings = 1 + ((rand() * 2) | 0);

    if (horizontal) {
      const xEdge = cx > ox ? cx * CHUNK_SIZE : ox * CHUNK_SIZE;
      const zBase = cz * CHUNK_SIZE;
      const used = new Set();
      for (let i = 0; i < openings; i++) {
        let lz;
        do { lz = (rand() * CHUNK_SIZE) | 0; } while (used.has(lz) && used.size < CHUNK_SIZE);
        used.add(lz);
        const z = zBase + lz;
        const left = this.cells.get(cellKey(xEdge - 1, z));
        const right = this.cells.get(cellKey(xEdge, z));
        if (left && right) {
          left.walls[1] = false;
          right.walls[3] = false;
        }
      }
    } else {
      const zEdge = cz > oz ? cz * CHUNK_SIZE : oz * CHUNK_SIZE;
      const xBase = cx * CHUNK_SIZE;
      const used = new Set();
      for (let i = 0; i < openings; i++) {
        let lx;
        do { lx = (rand() * CHUNK_SIZE) | 0; } while (used.has(lx) && used.size < CHUNK_SIZE);
        used.add(lx);
        const x = xBase + lx;
        const north = this.cells.get(cellKey(x, zEdge - 1));
        const south = this.cells.get(cellKey(x, zEdge));
        if (north && south) {
          north.walls[2] = false;
          south.walls[0] = false;
        }
      }
    }
  }
}

class MazeWorld {
  constructor(scene, maze) {
    this.scene = scene;
    this.maze = maze;
    this.group = new THREE.Group();
    this.scene.add(this.group);
    this.meshes = new Map();
    this.geoWall = new THREE.BoxGeometry(1, 1, 1);
    this.matWall = new THREE.MeshStandardMaterial({
      color: 0x6f87a8,
      roughness: 0.82,
      metalness: 0.08,
      emissive: 0x0a1422,
      emissiveIntensity: 0.25,
    });
    this.matAccent = new THREE.MeshStandardMaterial({
      color: 0x3d5f7a,
      roughness: 0.7,
      metalness: 0.15,
      emissive: 0x102030,
      emissiveIntensity: 0.2,
    });
    this.floorMat = new THREE.MeshStandardMaterial({
      color: 0x121821,
      roughness: 0.95,
      metalness: 0.05,
    });
    this.ceilMat = new THREE.MeshStandardMaterial({
      color: 0x0b1018,
      roughness: 1,
      metalness: 0,
    });

    this.floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.floorMat);
    this.floor.rotation.x = -Math.PI / 2;
    this.floor.receiveShadow = true;
    this.group.add(this.floor);

    this.ceiling = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.ceilMat);
    this.ceiling.rotation.x = Math.PI / 2;
    this.ceiling.position.y = WALL_HEIGHT;
    this.group.add(this.ceiling);

    // Soft guide line on floor
    this.pathGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(CELL_SIZE * 0.22, CELL_SIZE * 0.55),
      new THREE.MeshBasicMaterial({
        color: 0x5ce1ff,
        transparent: true,
        opacity: 0.16,
        depthWrite: false,
      })
    );
    this.pathGlow.rotation.x = -Math.PI / 2;
    this.pathGlow.position.y = 0.02;
    this.scene.add(this.pathGlow);
  }

  worldPos(x, z) {
    return new THREE.Vector3(x * CELL_SIZE, 0, z * CELL_SIZE);
  }

  sync(centerX, centerZ) {
    const radius = VIEW_RADIUS;
    this.maze.ensureAround(centerX, centerZ, radius + 2);

    const needed = new Set();
    for (let z = centerZ - radius; z <= centerZ + radius; z++) {
      for (let x = centerX - radius; x <= centerX + radius; x++) {
        if ((x - centerX) * (x - centerX) + (z - centerZ) * (z - centerZ) > radius * radius) continue;
        const cell = this.maze.getCell(x, z);
        if (!cell) continue;
        this._ensureCellMeshes(cell, needed);
      }
    }

    for (const [key, entry] of this.meshes) {
      if (!needed.has(key)) {
        for (const mesh of entry) {
          this.group.remove(mesh);
          mesh.geometry.dispose?.();
        }
        this.meshes.delete(key);
      }
    }

    const span = (radius * 2 + 4) * CELL_SIZE;
    this.floor.scale.set(span, span, 1);
    this.ceiling.scale.set(span, span, 1);
    const wp = this.worldPos(centerX, centerZ);
    this.floor.position.set(wp.x, 0, wp.z);
    this.ceiling.position.set(wp.x, WALL_HEIGHT, wp.z);
  }

  _ensureCellMeshes(cell, needed) {
    const key = cellKey(cell.x, cell.z);
    needed.add(key);
    if (this.meshes.has(key)) return;

    const meshes = [];
    const cx = cell.x * CELL_SIZE;
    const cz = cell.z * CELL_SIZE;
    const accent = ((hash2(cell.x, cell.z) % 7) === 0);

    const addWall = (dir) => {
      if (!cell.walls[dir]) return;
      const mesh = new THREE.Mesh(this.geoWall, accent ? this.matAccent : this.matWall);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const len = CELL_SIZE + WALL_THICKNESS;
      if (dir === 0) { // north
        mesh.scale.set(len, WALL_HEIGHT, WALL_THICKNESS);
        mesh.position.set(cx, WALL_HEIGHT / 2, cz - CELL_SIZE / 2);
      } else if (dir === 1) { // east
        mesh.scale.set(WALL_THICKNESS, WALL_HEIGHT, len);
        mesh.position.set(cx + CELL_SIZE / 2, WALL_HEIGHT / 2, cz);
      } else if (dir === 2) { // south
        mesh.scale.set(len, WALL_HEIGHT, WALL_THICKNESS);
        mesh.position.set(cx, WALL_HEIGHT / 2, cz + CELL_SIZE / 2);
      } else { // west
        mesh.scale.set(WALL_THICKNESS, WALL_HEIGHT, len);
        mesh.position.set(cx - CELL_SIZE / 2, WALL_HEIGHT / 2, cz);
      }
      this.group.add(mesh);
      meshes.push(mesh);
    };

    for (let d = 0; d < 4; d++) addWall(d);

    // Corner posts for depth
    const post = new THREE.Mesh(
      this.geoWall,
      this.matWall
    );
    post.scale.set(WALL_THICKNESS * 1.15, WALL_HEIGHT, WALL_THICKNESS * 1.15);
    post.position.set(cx - CELL_SIZE / 2, WALL_HEIGHT / 2, cz - CELL_SIZE / 2);
    this.group.add(post);
    meshes.push(post);

    this.meshes.set(key, meshes);
  }

  setPathGlow(x, z, dir) {
    const wp = this.worldPos(x, z);
    this.pathGlow.position.x = wp.x;
    this.pathGlow.position.z = wp.z;
    this.pathGlow.rotation.z = -DIRS[dir].yaw;
  }
}

class AutoNavigator {
  constructor(maze) {
    this.maze = maze;
    this.x = 0;
    this.z = 0;
    this.dir = 0;
    this.from = new THREE.Vector3();
    this.to = new THREE.Vector3();
    this.yawFrom = 0;
    this.yawTo = 0;
    this.mode = "move"; // move | turn
    this.t = 0;
    this.duration = MOVE_DURATION;
    this.explored = new Set([cellKey(0, 0)]);
    this.steps = 0;
    this.decision = "enter the labyrinth";
    this._setTargetsForCurrent();
  }

  reset() {
    this.x = 0;
    this.z = 0;
    this.dir = 0;
    this.mode = "move";
    this.t = 0;
    this.duration = MOVE_DURATION;
    this.explored = new Set([cellKey(0, 0)]);
    this.steps = 0;
    this.decision = "restart";
    this._setTargetsForCurrent();
  }

  _cellCenter(x, z) {
    return new THREE.Vector3(x * CELL_SIZE, EYE_HEIGHT, z * CELL_SIZE);
  }

  _setTargetsForCurrent() {
    this.from.copy(this._cellCenter(this.x, this.z));
    const nx = this.x + DIRS[this.dir].dx;
    const nz = this.z + DIRS[this.dir].dz;
    this.to.copy(this._cellCenter(nx, nz));
    this.yawFrom = DIRS[this.dir].yaw;
    this.yawTo = DIRS[this.dir].yaw;
    this.mode = "move";
    this.duration = MOVE_DURATION;
    this.t = 0;
  }

  _chooseNextDir() {
    const options = this.maze.openDirs(this.x, this.z);
    if (!options.length) {
      this.decision = "dead end — turning back";
      return OPPOSITE[this.dir];
    }

    const forward = this.dir;
    const right = (this.dir + 1) % 4;
    const left = (this.dir + 3) % 4;
    const back = OPPOSITE[this.dir];

    // Prefer unexplored corridors, then right-hand rule: right → forward → left → back
    const rank = (d) => {
      const nx = this.x + DIRS[d].dx;
      const nz = this.z + DIRS[d].dz;
      const unseen = !this.explored.has(cellKey(nx, nz));
      let prefer;
      if (d === right) prefer = 0;
      else if (d === forward) prefer = 1;
      else if (d === left) prefer = 2;
      else prefer = 3;
      return (unseen ? 0 : 10) + prefer;
    };

    options.sort((a, b) => rank(a) - rank(b));
    const chosen = options[0];

    if (chosen === right) this.decision = "turn right";
    else if (chosen === left) this.decision = "turn left";
    else if (chosen === back) this.decision = "u-turn";
    else this.decision = "continue straight";

    if (options.filter((d) => d !== back).length > 1) {
      const unexplored = options.filter((d) => {
        const nx = this.x + DIRS[d].dx;
        const nz = this.z + DIRS[d].dz;
        return d !== back && !this.explored.has(cellKey(nx, nz));
      });
      if (unexplored.length) this.decision = `branch → ${DIRS[chosen].name.toLowerCase()}`;
    }

    return chosen;
  }

  _shortestYaw(from, to) {
    let delta = to - from;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta < -Math.PI) delta += Math.PI * 2;
    return from + delta;
  }

  _beginTurn(nextDir) {
    this.mode = "turn";
    this.t = 0;
    this.duration = TURN_DURATION * (Math.abs(((nextDir - this.dir + 4) % 4) === 2 ? 1.35 : 1));
    this.yawFrom = DIRS[this.dir].yaw;
    this.yawTo = this._shortestYaw(this.yawFrom, DIRS[nextDir].yaw);
    this.from.copy(this._cellCenter(this.x, this.z));
    this.to.copy(this.from);
    this.dir = nextDir;
  }

  _beginMove() {
    this.mode = "move";
    this.t = 0;
    this.duration = MOVE_DURATION;
    this.from.copy(this._cellCenter(this.x, this.z));
    const nx = this.x + DIRS[this.dir].dx;
    const nz = this.z + DIRS[this.dir].dz;
    this.to.copy(this._cellCenter(nx, nz));
    this.yawFrom = DIRS[this.dir].yaw;
    this.yawTo = DIRS[this.dir].yaw;
  }

  update(dt) {
    this.t += dt;
    let u = Math.min(1, this.t / this.duration);
    // Smoothstep
    u = u * u * (3 - 2 * u);

    const pos = new THREE.Vector3().lerpVectors(this.from, this.to, u);
    const yaw = THREE.MathUtils.lerp(this.yawFrom, this.yawTo, u);

    if (this.t >= this.duration) {
      if (this.mode === "move") {
        this.x += DIRS[this.dir].dx;
        this.z += DIRS[this.dir].dz;
        this.explored.add(cellKey(this.x, this.z));
        this.steps += 1;
        const next = this._chooseNextDir();
        if (next !== this.dir) this._beginTurn(next);
        else this._beginMove();
      } else {
        this._beginMove();
      }
      return this.update(0);
    }

    return { pos, yaw, x: this.x, z: this.z, dir: this.dir };
  }
}

function createScene() {
  const host = document.getElementById("canvas-host");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x05070c, 1);
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b14, 0.085);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 80);
  camera.position.set(0, EYE_HEIGHT, 0);

  const hemi = new THREE.HemisphereLight(0x8fb7ff, 0x1a1420, 0.55);
  scene.add(hemi);

  const ambient = new THREE.AmbientLight(0x334155, 0.35);
  scene.add(ambient);

  const lamp = new THREE.PointLight(0xb8d7ff, 2.2, 16, 2);
  lamp.position.set(0, EYE_HEIGHT + 0.2, 0);
  lamp.castShadow = true;
  lamp.shadow.mapSize.set(512, 512);
  scene.add(lamp);

  const rim = new THREE.PointLight(0x5ce1ff, 0.55, 10, 2);
  rim.position.set(0, 0.4, 0);
  scene.add(rim);

  return { renderer, scene, camera, lamp, rim };
}

const el = {
  cell: document.getElementById("stat-cell"),
  heading: document.getElementById("stat-heading"),
  explored: document.getElementById("stat-explored"),
  distance: document.getElementById("stat-distance"),
  decision: document.getElementById("stat-decision"),
  status: document.getElementById("run-status"),
  pause: document.getElementById("btn-pause"),
  speed: document.getElementById("btn-speed"),
  reset: document.getElementById("btn-reset"),
};

const { renderer, scene, camera, lamp, rim } = createScene();
const maze = new InfiniteMaze();
maze.ensureAround(0, 0, VIEW_RADIUS);
const world = new MazeWorld(scene, maze);
const navigator = new AutoNavigator(maze);

let paused = false;
let speedIndex = 1;
let last = performance.now();
let bobPhase = 0;

function updateHud(state) {
  el.cell.textContent = `${state.x}, ${state.z}`;
  el.heading.textContent = DIRS[state.dir].name;
  el.explored.textContent = String(navigator.explored.size);
  el.distance.textContent = String(navigator.steps);
  el.decision.textContent = navigator.decision;
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!paused) {
    const state = navigator.update(dt * SPEEDS[speedIndex]);
    camera.position.copy(state.pos);
    camera.rotation.order = "YXZ";
    bobPhase += dt * SPEEDS[speedIndex] * (navigator.mode === "move" ? 7.5 : 2);
    const bob = navigator.mode === "move" ? Math.sin(bobPhase) * 0.03 : 0;
    camera.position.y = EYE_HEIGHT + bob;
    camera.rotation.y = state.yaw;
    camera.rotation.x = bob * 0.15;
    camera.rotation.z = 0;

    lamp.position.set(state.pos.x, EYE_HEIGHT + 0.15, state.pos.z);
    rim.position.set(
      state.pos.x - Math.sin(state.yaw) * 0.8,
      0.55,
      state.pos.z - Math.cos(state.yaw) * 0.8
    );

    world.sync(state.x, state.z);
    world.setPathGlow(state.x, state.z, state.dir);
    updateHud(state);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
}

el.pause.addEventListener("click", () => {
  paused = !paused;
  el.pause.textContent = paused ? "Resume" : "Pause";
  el.pause.setAttribute("aria-pressed", String(paused));
  el.status.textContent = paused ? "Paused" : "Auto-navigating";
  el.status.classList.toggle("paused", paused);
});

el.speed.addEventListener("click", () => {
  speedIndex = (speedIndex + 1) % SPEEDS.length;
  el.speed.textContent = `Speed ×${String(SPEEDS[speedIndex]).replace(/\.0$/, "")}`;
});

el.reset.addEventListener("click", () => {
  navigator.reset();
  world.sync(0, 0);
  paused = false;
  el.pause.textContent = "Pause";
  el.pause.setAttribute("aria-pressed", "false");
  el.status.textContent = "Auto-navigating";
  el.status.classList.remove("paused");
  const state = navigator.update(0);
  camera.position.copy(state.pos);
  camera.rotation.y = state.yaw;
  updateHud(state);
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    el.pause.click();
  } else if (e.code === "KeyR") {
    el.reset.click();
  } else if (e.code === "KeyF") {
    el.speed.click();
  }
});

window.addEventListener("resize", onResize);

world.sync(0, 0);
updateHud({ x: 0, z: 0, dir: 0 });
requestAnimationFrame(frame);
  </script>
</body>
</html>
