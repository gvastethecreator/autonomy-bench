<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Asteroids</title>
<style>
  :root {
    --bg: #05070d;
    --neon: #7ef9ff;
    --neon-dim: #3a8a99;
    --warn: #ff6b4a;
    --gold: #ffd56a;
    --panel: rgba(8, 14, 28, 0.82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--neon);
    font-family: "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 50% 20%, #10182c 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, #0a1520 0%, transparent 40%),
      var(--bg);
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    background: #02040a;
    box-shadow: 0 0 0 1px #1a2a3a, 0 0 40px rgba(126, 249, 255, 0.08);
    border-radius: 4px;
  }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(12px, 2vw, 24px);
    font-variant-numeric: tabular-nums;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    text-shadow: 0 0 12px rgba(126, 249, 255, 0.45);
  }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--neon-dim);
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .lives {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .life-ship {
    width: 14px;
    height: 16px;
    opacity: 0.9;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(2,4,10,0.55), rgba(2,4,10,0.78));
    transition: opacity 0.25s ease;
  }
  #overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    text-align: center;
    padding: clamp(24px, 4vw, 40px) clamp(28px, 5vw, 56px);
    background: var(--panel);
    border: 1px solid rgba(126, 249, 255, 0.25);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(126, 249, 255, 0.12), inset 0 0 40px rgba(126, 249, 255, 0.04);
    max-width: min(92vw, 480px);
  }
  .title {
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #e8fbff;
    text-shadow: 0 0 20px rgba(126, 249, 255, 0.7), 0 0 48px rgba(126, 249, 255, 0.35);
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--neon-dim);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 28px;
  }
  .msg {
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 1.55;
    color: #c9eef3;
    margin-bottom: 22px;
  }
  .msg strong { color: var(--gold); font-weight: 600; }
  .hint {
    font-size: 13px;
    color: var(--neon-dim);
    letter-spacing: 0.08em;
    line-height: 1.7;
  }
  .hint kbd {
    display: inline-block;
    padding: 2px 7px;
    margin: 0 2px;
    border: 1px solid rgba(126, 249, 255, 0.35);
    border-radius: 4px;
    color: var(--neon);
    font-family: inherit;
    font-size: 12px;
  }
  .flash {
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  #touch {
    display: none;
    position: absolute;
    inset: auto 0 0 0;
    height: 38%;
    pointer-events: none;
    padding: 12px 16px 20px;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
  }
  .pad, .fire-btn {
    pointer-events: auto;
    border: 1px solid rgba(126, 249, 255, 0.28);
    background: rgba(8, 16, 28, 0.55);
    color: var(--neon);
    border-radius: 50%;
    backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
  }
  .pad {
    width: 148px;
    height: 148px;
    position: relative;
  }
  .pad button {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(126, 249, 255, 0.35);
    background: rgba(20, 36, 56, 0.75);
    color: var(--neon);
    font-size: 16px;
    pointer-events: auto;
  }
  .pad .left { left: 8px; top: 52px; }
  .pad .right { right: 8px; top: 52px; }
  .pad .up { left: 52px; top: 8px; }
  .fire-cluster {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }
  .fire-btn {
    width: 72px;
    height: 72px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .fire-btn.secondary {
    width: 56px;
    height: 56px;
    font-size: 10px;
    opacity: 0.9;
  }
  .pad button:active, .fire-btn:active {
    background: rgba(126, 249, 255, 0.22);
  }
  @media (hover: none) and (pointer: coarse) {
    #touch { display: flex; }
    .hint.desktop { display: none; }
  }
  @media (max-width: 640px) {
    .hint.desktop { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="720" aria-label="Asteroids game canvas"></canvas>
  <div id="hud">
    <div class="top">
      <div>
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
        <div class="lives" id="lives" aria-label="Lives"></div>
      </div>
      <div style="text-align:right">
        <div class="stat-label">High</div>
        <div class="stat-value" id="high">0</div>
        <div class="stat-label" style="margin-top:10px">Wave</div>
        <div class="stat-value" id="wave" style="font-size:20px">1</div>
      </div>
    </div>
  </div>
  <div id="overlay">
    <div class="panel">
      <div class="title" id="otitle">Asteroids</div>
      <div class="subtitle" id="osub">Deep Space Patrol</div>
      <div class="msg" id="omsg">Clear the field. Survive the swarm.</div>
      <div class="hint desktop">
        <kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> rotate ·
        <kbd>↑</kbd> / <kbd>W</kbd> thrust ·
        <kbd>Space</kbd> fire ·
        <kbd>Shift</kbd> hyperspace
      </div>
      <div class="hint flash" id="oprompt" style="margin-top:18px">Press Enter or Tap to Start</div>
    </div>
  </div>
  <div id="touch">
    <div class="pad" aria-hidden="true">
      <button type="button" class="left" data-key="left">◀</button>
      <button type="button" class="right" data-key="right">▶</button>
      <button type="button" class="up" data-key="thrust">▲</button>
    </div>
    <div class="fire-cluster">
      <button type="button" class="fire-btn secondary" data-key="hyper">Jump</button>
      <button type="button" class="fire-btn" data-key="fire">Fire</button>
    </div>
  </div>
</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const highEl = document.getElementById("high");
  const waveEl = document.getElementById("wave");
  const livesEl = document.getElementById("lives");
  const overlay = document.getElementById("overlay");
  const otitle = document.getElementById("otitle");
  const osub = document.getElementById("osub");
  const omsg = document.getElementById("omsg");
  const oprompt = document.getElementById("oprompt");

  const W = canvas.width;
  const H = canvas.height;
  const TWO_PI = Math.PI * 2;
  const STORAGE_KEY = "asteroids-neon-high";

  const STATE = { TITLE: 0, PLAYING: 1, DYING: 2, WAVE_CLEAR: 3, GAMEOVER: 4 };
  let state = STATE.TITLE;
  let score = 0;
  let high = Number(localStorage.getItem(STORAGE_KEY) || 0);
  let lives = 3;
  let wave = 1;
  let invuln = 0;
  let hyperCooldown = 0;
  let waveTimer = 0;
  let dieTimer = 0;
  let ufoTimer = 0;
  let shake = 0;
  let time = 0;

  const keys = Object.create(null);
  const ship = {
    x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2,
    radius: 12, thrust: false, alive: true
  };
  let bullets = [];
  let rocks = [];
  let particles = [];
  let ufos = [];
  let ufoBullets = [];
  let stars = [];

  highEl.textContent = String(high);

  // --- Audio (tiny synth) ---
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.04, slide = 0) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseBurst(dur = 0.18, vol = 0.05) {
    if (!audioCtx) return;
    const n = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    src.buffer = buf;
    f.type = "bandpass";
    f.frequency.value = 600;
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start();
  }

  // --- Helpers ---
  function rand(a, b) { return a + Math.random() * (b - a); }
  function wrap(v, max) { return v < 0 ? v + max : v >= max ? v - max : v; }
  function dist(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.hypot(dx, dy);
  }
  function angleDiff(a, b) {
    let d = (b - a) % TWO_PI;
    if (d > Math.PI) d -= TWO_PI;
    if (d < -Math.PI) d += TWO_PI;
    return d;
  }

  function makeStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: rand(0.3, 1.4),
        tw: Math.random() * TWO_PI
      });
    }
  }

  function rockVerts(size) {
    const n = 8 + Math.floor(Math.random() * 5);
    const verts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TWO_PI;
      const r = size * rand(0.65, 1.1);
      verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    return verts;
  }

  function spawnRock(x, y, size, speedMul = 1) {
    const a = Math.random() * TWO_PI;
    const speed = rand(0.45, 1.15) * speedMul * (size < 28 ? 1.35 : size < 45 ? 1.1 : 0.9);
    rocks.push({
      x, y,
      vx: Math.cos(a) * speed * (0.7 + wave * 0.08),
      vy: Math.sin(a) * speed * (0.7 + wave * 0.08),
      rot: rand(-0.02, 0.02),
      a: Math.random() * TWO_PI,
      size,
      radius: size,
      verts: rockVerts(size),
      points: size > 45 ? 20 : size > 28 ? 50 : 100
    });
  }

  function spawnWave(n) {
    rocks = [];
    const count = Math.min(4 + n, 12);
    for (let i = 0; i < count; i++) {
      let x, y, tries = 0;
      do {
        x = Math.random() * W;
        y = Math.random() * H;
        tries++;
      } while (dist(x, y, ship.x, ship.y) < 160 && tries < 40);
      spawnRock(x, y, rand(48, 58), 1);
    }
    ufoTimer = 12 + Math.random() * 10;
  }

  function resetShip() {
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.a = -Math.PI / 2;
    ship.alive = true;
    ship.thrust = false;
    invuln = 2.2;
    bullets = [];
    ufoBullets = [];
  }

  function explode(x, y, count, hue, speed = 2.5) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TWO_PI;
      const sp = rand(0.4, speed);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: rand(0.35, 1.1),
        max: 1.1,
        size: rand(1, 2.6),
        color: hue
      });
    }
  }

  function drawLifeIcon() {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 14 16");
    s.setAttribute("class", "life-ship");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M7 1 L13 15 L7 12 L1 15 Z");
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "#7ef9ff");
    p.setAttribute("stroke-width", "1.2");
    s.appendChild(p);
    return s;
  }

  function updateHUD() {
    scoreEl.textContent = String(score);
    highEl.textContent = String(high);
    waveEl.textContent = String(wave);
    livesEl.innerHTML = "";
    for (let i = 0; i < lives; i++) livesEl.appendChild(drawLifeIcon());
  }

  function showOverlay(title, sub, msg, prompt, visible = true) {
    otitle.textContent = title;
    osub.textContent = sub;
    omsg.innerHTML = msg;
    oprompt.textContent = prompt;
    overlay.classList.toggle("hidden", !visible);
  }

  function startGame() {
    ensureAudio();
    score = 0;
    lives = 3;
    wave = 1;
    hyperCooldown = 0;
    ufos = [];
    ufoBullets = [];
    particles = [];
    bullets = [];
    resetShip();
    spawnWave(wave);
    state = STATE.PLAYING;
    overlay.classList.add("hidden");
    updateHUD();
    beep(220, 0.08, "sawtooth", 0.03);
    beep(330, 0.1, "sawtooth", 0.03);
  }

  function addScore(n) {
    score += n;
    if (score > high) {
      high = score;
      localStorage.setItem(STORAGE_KEY, String(high));
    }
    updateHUD();
  }

  function killShip() {
    if (!ship.alive || invuln > 0) return;
    ship.alive = false;
    explode(ship.x, ship.y, 36, "#7ef9ff", 3.5);
    explode(ship.x, ship.y, 16, "#ff6b4a", 2.2);
    noiseBurst(0.25, 0.07);
    beep(90, 0.35, "sawtooth", 0.05, -50);
    shake = 10;
    lives -= 1;
    updateHUD();
    if (lives <= 0) {
      state = STATE.GAMEOVER;
      dieTimer = 1.2;
      showOverlay(
        "Game Over",
        "Transmission Lost",
        `Final score <strong>${score}</strong><br>Best <strong>${high}</strong>`,
        "Press Enter or Tap to Retry"
      );
    } else {
      state = STATE.DYING;
      dieTimer = 1.6;
    }
  }

  function splitRock(rock) {
    const idx = rocks.indexOf(rock);
    if (idx >= 0) rocks.splice(idx, 1);
    addScore(rock.points);
    explode(rock.x, rock.y, rock.size > 40 ? 22 : 14, "#c9eef3", 2.8);
    noiseBurst(0.12, 0.035);
    beep(160 + rock.points, 0.06, "triangle", 0.035, 80);
    shake = Math.min(shake + rock.size / 20, 12);
    if (rock.size > 45) {
      spawnRock(rock.x, rock.y, rand(28, 34), 1.2);
      spawnRock(rock.x, rock.y, rand(28, 34), 1.2);
    } else if (rock.size > 28) {
      spawnRock(rock.x, rock.y, rand(14, 18), 1.45);
      spawnRock(rock.x, rock.y, rand(14, 18), 1.45);
    }
  }

  function fireBullet() {
    if (!ship.alive || bullets.length >= 6) return;
    const speed = 7.2;
    bullets.push({
      x: ship.x + Math.cos(ship.a) * 14,
      y: ship.y + Math.sin(ship.a) * 14,
      vx: Math.cos(ship.a) * speed + ship.vx * 0.35,
      vy: Math.sin(ship.a) * speed + ship.vy * 0.35,
      life: 1.05
    });
    beep(880, 0.045, "square", 0.028, -400);
  }

  function hyperspace() {
    if (!ship.alive || hyperCooldown > 0 || invuln > 0.4) return;
    explode(ship.x, ship.y, 18, "#ffd56a", 2);
    ship.x = rand(60, W - 60);
    ship.y = rand(60, H - 60);
    ship.vx *= 0.2;
    ship.vy *= 0.2;
    hyperCooldown = 3.5;
    invuln = Math.max(invuln, 0.8);
    beep(120, 0.15, "sine", 0.04, 400);
    // 12% chance of bad jump into rock
    for (const r of rocks) {
      if (dist(ship.x, ship.y, r.x, r.y) < r.radius + ship.radius + 8) {
        if (Math.random() < 0.35) { killShip(); return; }
      }
    }
  }

  function spawnUfo() {
    const fromLeft = Math.random() < 0.5;
    const big = Math.random() > 0.45 || wave < 2;
    ufos.push({
      x: fromLeft ? -20 : W + 20,
      y: rand(80, H - 80),
      vx: (fromLeft ? 1 : -1) * rand(1.2, 1.8) * (big ? 1 : 1.35),
      vy: rand(-0.35, 0.35),
      radius: big ? 16 : 10,
      big,
      shoot: rand(0.8, 1.6),
      points: big ? 200 : 500,
      wobble: Math.random() * TWO_PI
    });
    beep(440, 0.08, "square", 0.03);
    beep(330, 0.1, "square", 0.03);
  }

  // --- Input ---
  const keyMap = {
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right",
    ArrowUp: "thrust", w: "thrust", W: "thrust",
    " ": "fire", Space: "fire",
    Shift: "hyper", ShiftLeft: "hyper", ShiftRight: "hyper",
    Enter: "start",
    p: "pause", P: "pause"
  };

  window.addEventListener("keydown", (e) => {
    const k = keyMap[e.key] || keyMap[e.code];
    if (!k) return;
    e.preventDefault();
    if (k === "start") {
      if (state === STATE.TITLE || state === STATE.GAMEOVER) startGame();
      return;
    }
    if (k === "fire" && !keys.fire) {
      if (state === STATE.TITLE || state === STATE.GAMEOVER) { startGame(); return; }
      if (state === STATE.PLAYING) fireBullet();
    }
    if (k === "hyper" && state === STATE.PLAYING) hyperspace();
    keys[k] = true;
  });
  window.addEventListener("keyup", (e) => {
    const k = keyMap[e.key] || keyMap[e.code];
    if (k) keys[k] = false;
  });

  function bindTouch(el, key) {
    const down = (ev) => {
      ev.preventDefault();
      ensureAudio();
      keys[key] = true;
      if (key === "fire") {
        if (state === STATE.TITLE || state === STATE.GAMEOVER) startGame();
        else if (state === STATE.PLAYING) fireBullet();
      }
      if (key === "hyper" && state === STATE.PLAYING) hyperspace();
      if ((key === "thrust" || key === "left") && (state === STATE.TITLE || state === STATE.GAMEOVER)) startGame();
    };
    const up = (ev) => { ev.preventDefault(); keys[key] = false; };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("pointercancel", up);
  }
  document.querySelectorAll("#touch [data-key]").forEach((el) => {
    bindTouch(el, el.getAttribute("data-key"));
  });
  overlay.addEventListener("pointerdown", () => {
    if (state === STATE.TITLE || state === STATE.GAMEOVER) startGame();
  });

  // --- Update ---
  let lastFireHeld = 0;
  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 18);

    if (state === STATE.TITLE) {
      // gentle rock drift on title
      for (const r of rocks) {
        r.x = wrap(r.x + r.vx * dt * 60, W);
        r.y = wrap(r.y + r.vy * dt * 60, H);
        r.a += r.rot * 60 * dt;
      }
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.life -= dt;
      }
      particles = particles.filter((p) => p.life > 0);
      return;
    }

    if (state === STATE.DYING) {
      dieTimer -= dt;
      updateEntities(dt, false);
      if (dieTimer <= 0) {
        resetShip();
        state = STATE.PLAYING;
      }
      return;
    }

    if (state === STATE.GAMEOVER) {
      updateEntities(dt, false);
      return;
    }

    if (state === STATE.WAVE_CLEAR) {
      waveTimer -= dt;
      updateEntities(dt, true);
      if (waveTimer <= 0) {
        wave += 1;
        updateHUD();
        spawnWave(wave);
        invuln = Math.max(invuln, 1.5);
        state = STATE.PLAYING;
        overlay.classList.add("hidden");
      }
      return;
    }

    // PLAYING
    if (invuln > 0) invuln -= dt;
    if (hyperCooldown > 0) hyperCooldown -= dt;

    if (ship.alive) {
      if (keys.left) ship.a -= 4.2 * dt;
      if (keys.right) ship.a += 4.2 * dt;
      ship.thrust = !!keys.thrust;
      if (ship.thrust) {
        ship.vx += Math.cos(ship.a) * 0.18 * 60 * dt;
        ship.vy += Math.sin(ship.a) * 0.18 * 60 * dt;
        if (Math.random() < 0.7) {
          particles.push({
            x: ship.x - Math.cos(ship.a) * 12 + rand(-2, 2),
            y: ship.y - Math.sin(ship.a) * 12 + rand(-2, 2),
            vx: -Math.cos(ship.a) * rand(1, 3) + rand(-0.5, 0.5),
            vy: -Math.sin(ship.a) * rand(1, 3) + rand(-0.5, 0.5),
            life: rand(0.15, 0.35),
            max: 0.35,
            size: rand(1, 2),
            color: Math.random() < 0.5 ? "#ffd56a" : "#ff6b4a"
          });
        }
      }
      // drag
      ship.vx *= Math.pow(0.992, dt * 60);
      ship.vy *= Math.pow(0.992, dt * 60);
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > 7.5) { ship.vx *= 7.5 / sp; ship.vy *= 7.5 / sp; }
      ship.x = wrap(ship.x + ship.vx * 60 * dt, W);
      ship.y = wrap(ship.y + ship.vy * 60 * dt, H);

      // held fire repeat
      if (keys.fire) {
        lastFireHeld += dt;
        if (lastFireHeld > 0.18) { fireBullet(); lastFireHeld = 0; }
      } else lastFireHeld = 0;
    }

    updateEntities(dt, true);

    // UFO spawn
    ufoTimer -= dt;
    if (ufoTimer <= 0 && ufos.length === 0 && wave >= 1) {
      spawnUfo();
      ufoTimer = 16 + Math.random() * 14 - Math.min(wave, 8);
    }

    // collisions: bullets vs rocks
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;
      for (let j = rocks.length - 1; j >= 0; j--) {
        const r = rocks[j];
        if (dist(b.x, b.y, r.x, r.y) < r.radius) {
          bullets.splice(i, 1);
          splitRock(r);
          hit = true;
          break;
        }
      }
      if (hit) continue;
      for (let j = ufos.length - 1; j >= 0; j--) {
        const u = ufos[j];
        if (dist(b.x, b.y, u.x, u.y) < u.radius + 2) {
          bullets.splice(i, 1);
          addScore(u.points);
          explode(u.x, u.y, 24, "#ffd56a", 3);
          noiseBurst(0.15, 0.05);
          beep(520, 0.12, "sawtooth", 0.04, -200);
          ufos.splice(j, 1);
          shake = 8;
          break;
        }
      }
    }

    // ship vs rocks / ufos / ufo bullets
    if (ship.alive && invuln <= 0) {
      for (const r of rocks) {
        if (dist(ship.x, ship.y, r.x, r.y) < r.radius + ship.radius * 0.7) {
          killShip();
          splitRock(r);
          break;
        }
      }
      if (ship.alive) {
        for (const u of ufos) {
          if (dist(ship.x, ship.y, u.x, u.y) < u.radius + ship.radius) {
            killShip();
            break;
          }
        }
      }
      if (ship.alive) {
        for (let i = ufoBullets.length - 1; i >= 0; i--) {
          const b = ufoBullets[i];
          if (dist(ship.x, ship.y, b.x, b.y) < ship.radius + 2) {
            ufoBullets.splice(i, 1);
            killShip();
            break;
          }
        }
      }
    }

    if (state === STATE.PLAYING && rocks.length === 0 && ufos.length === 0) {
      state = STATE.WAVE_CLEAR;
      waveTimer = 2.2;
      showOverlay(
        `Wave ${wave} Cleared`,
        "Sector Secure",
        `Score <strong>${score}</strong> — incoming denser debris`,
        "Get ready…"
      );
      beep(330, 0.08, "triangle", 0.04);
      beep(440, 0.1, "triangle", 0.04);
      beep(660, 0.16, "triangle", 0.045);
    }
  }

  function updateEntities(dt, withUfoAI) {
    for (const r of rocks) {
      r.x = wrap(r.x + r.vx * 60 * dt, W);
      r.y = wrap(r.y + r.vy * 60 * dt, H);
      r.a += r.rot * 60 * dt;
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x = wrap(b.x + b.vx * 60 * dt, W);
      b.y = wrap(b.y + b.vy * 60 * dt, H);
      b.life -= dt;
      if (b.life <= 0) bullets.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 60 * dt;
      p.y += p.vy * 60 * dt;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = ufos.length - 1; i >= 0; i--) {
      const u = ufos[i];
      u.wobble += dt * 2.5;
      u.x += u.vx * 60 * dt;
      u.y += Math.sin(u.wobble) * 0.6 + u.vy * 60 * dt;
      if (u.y < 40) u.vy = Math.abs(u.vy) + 0.2;
      if (u.y > H - 40) u.vy = -Math.abs(u.vy) - 0.2;
      if (u.x < -40 || u.x > W + 40) { ufos.splice(i, 1); continue; }
      if (withUfoAI && ship.alive) {
        u.shoot -= dt;
        if (u.shoot <= 0) {
          u.shoot = u.big ? rand(1.1, 1.8) : rand(0.55, 1.0);
          let ang = Math.atan2(ship.y - u.y, ship.x - u.x);
          if (u.big) ang += rand(-0.35, 0.35);
          else ang += rand(-0.12, 0.12);
          const spd = u.big ? 3.2 : 4.2;
          ufoBullets.push({
            x: u.x, y: u.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 2.2
          });
          beep(200, 0.05, "square", 0.025);
        }
      }
    }
    for (let i = ufoBullets.length - 1; i >= 0; i--) {
      const b = ufoBullets[i];
      b.x += b.vx * 60 * dt;
      b.y += b.vy * 60 * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        ufoBullets.splice(i, 1);
      }
    }
  }

  // --- Draw ---
  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // space bg
    ctx.fillStyle = "#02040a";
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // vignette stars
    for (const s of stars) {
      const tw = 0.45 + 0.55 * Math.sin(time * s.z + s.tw);
      ctx.globalAlpha = tw * s.z * 0.7;
      ctx.fillStyle = "#b8d4e8";
      ctx.fillRect(s.x, s.y, s.z, s.z);
    }
    ctx.globalAlpha = 1;

    // soft nebula
    const g = ctx.createRadialGradient(W * 0.3, H * 0.25, 0, W * 0.3, H * 0.25, 280);
    g.addColorStop(0, "rgba(40, 70, 110, 0.12)");
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // rocks
    for (const r of rocks) drawRock(r);

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / (p.max || 1));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TWO_PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.fillStyle = "#e8fbff";
    ctx.shadowColor = "#7ef9ff";
    ctx.shadowBlur = 8;
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.2, 0, TWO_PI);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ufo bullets
    ctx.fillStyle = "#ff6b4a";
    ctx.shadowColor = "#ff6b4a";
    ctx.shadowBlur = 6;
    for (const b of ufoBullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.4, 0, TWO_PI);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ufos
    for (const u of ufos) drawUfo(u);

    // ship
    if (ship.alive && (state === STATE.PLAYING || state === STATE.WAVE_CLEAR)) {
      if (invuln <= 0 || Math.floor(time * 12) % 2 === 0) drawShip();
    }

    // hyper cooldown pip
    if (state === STATE.PLAYING && hyperCooldown > 0) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#ffd56a";
      ctx.fillRect(W / 2 - 30, H - 18, 60 * (1 - hyperCooldown / 3.5), 3);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.a);
    ctx.strokeStyle = "#7ef9ff";
    ctx.fillStyle = "rgba(126,249,255,0.06)";
    ctx.lineWidth = 1.6;
    ctx.shadowColor = "#7ef9ff";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-10, 9);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, -9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if (ship.thrust) {
      ctx.strokeStyle = "#ffd56a";
      ctx.shadowColor = "#ff6b4a";
      ctx.beginPath();
      ctx.moveTo(-7, -4);
      ctx.lineTo(-14 - Math.random() * 5, 0);
      ctx.lineTo(-7, 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRock(r) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.a);
    ctx.strokeStyle = "#9ec9d4";
    ctx.lineWidth = 1.4;
    ctx.shadowColor = "rgba(126,249,255,0.25)";
    ctx.shadowBlur = 4;
    ctx.beginPath();
    for (let i = 0; i < r.verts.length; i++) {
      const v = r.verts[i];
      if (i === 0) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawUfo(u) {
    ctx.save();
    ctx.translate(u.x, u.y);
    const s = u.radius / 16;
    ctx.scale(s, s);
    ctx.strokeStyle = "#ffd56a";
    ctx.fillStyle = "rgba(255,213,106,0.08)";
    ctx.lineWidth = 1.5 / s;
    ctx.shadowColor = "#ffd56a";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 6, 0, 0, TWO_PI);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -4, 8, 5, 0, Math.PI, TWO_PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(-14, 4);
    ctx.moveTo(10, 0); ctx.lineTo(14, 4);
    ctx.stroke();
    ctx.restore();
  }

  // --- Fit canvas ---
  function fit() {
    const wrap = document.getElementById("wrap");
    const pad = 16;
    const aw = wrap.clientWidth - pad;
    const ah = wrap.clientHeight - pad;
    const scale = Math.min(aw / W, ah / H);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  // --- Title ambience ---
  function setupTitle() {
    makeStars();
    rocks = [];
    for (let i = 0; i < 6; i++) {
      spawnRock(Math.random() * W, Math.random() * H, rand(30, 55), 0.55);
    }
    showOverlay(
      "Asteroids",
      "Deep Space Patrol",
      "Pilot your ship through a hostile debris field.<br>Shatter rocks, dodge saucers, chase a high score.",
      "Press Enter or Tap to Start"
    );
    updateHUD();
  }

  // --- Loop ---
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  setupTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
