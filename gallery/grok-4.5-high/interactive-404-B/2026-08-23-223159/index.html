<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="404 — This page is off the map.">
  <title>404 — Page not found</title>
  <style>
    :root {
      --bg: #07090f;
      --bg-elevated: #0e1320;
      --ink: #e8edf7;
      --muted: #8b95ab;
      --faint: #4a5568;
      --line: rgba(232, 237, 247, 0.08);
      --accent: #7dd3fc;
      --accent-hot: #fb923c;
      --glow: rgba(125, 211, 252, 0.22);
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, rgba(56, 109, 180, 0.28), transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 80%, rgba(251, 146, 60, 0.08), transparent 50%),
        radial-gradient(ellipse 40% 35% at 10% 70%, rgba(125, 211, 252, 0.07), transparent 50%),
        var(--bg);
    }

    .grid {
      position: absolute;
      inset: -20%;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
      transform: perspective(600px) rotateX(58deg) translateY(-8%);
      animation: drift 28s linear infinite;
      opacity: 0.7;
    }

    @keyframes drift {
      from { background-position: 0 0; }
      to { background-position: 0 64px; }
    }

    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.35;
      animation: twinkle var(--dur, 4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.4); }
    }

    .scan {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(520px, 80vw);
      height: min(520px, 80vw);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(125, 211, 252, 0.12);
      box-shadow:
        0 0 0 40px rgba(125, 211, 252, 0.03),
        0 0 0 90px rgba(125, 211, 252, 0.02);
    }

    .scan::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(125, 211, 252, 0.18) 40deg,
        transparent 70deg
      );
      animation: sweep 5.5s linear infinite;
      mask-image: radial-gradient(circle, transparent 42%, black 43%, black 70%, transparent 71%);
    }

    @keyframes sweep {
      to { transform: rotate(360deg); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
    }

    main {
      width: min(640px, 100%);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(14, 19, 32, 0.7);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.7s var(--ease) 0.1s forwards;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-hot);
      box-shadow: 0 0 12px rgba(251, 146, 60, 0.7);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .code {
      margin: 1.4rem 0 0.6rem;
      font-size: clamp(5.5rem, 22vw, 9.5rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.9;
      background: linear-gradient(180deg, #f8fbff 20%, #8b95ab 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 40px var(--glow));
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      animation: rise 0.9s var(--ease) 0.2s forwards;
      user-select: none;
    }

    .code span {
      display: inline-block;
      animation: float 5s ease-in-out infinite;
    }

    .code span:nth-child(2) { animation-delay: -1.2s; }
    .code span:nth-child(3) { animation-delay: -2.4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.7s var(--ease) 0.35s forwards;
    }

    .lead {
      color: var(--muted);
      font-size: clamp(0.98rem, 2.2vw, 1.08rem);
      max-width: 36ch;
      margin: 0 auto 1.75rem;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.7s var(--ease) 0.45s forwards;
    }

    .coords {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.7s var(--ease) 0.55s forwards;
    }

    .chip {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--faint);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      background: rgba(14, 19, 32, 0.55);
    }

    .chip strong {
      color: var(--accent);
      font-weight: 500;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.7s var(--ease) 0.65s forwards;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 999px;
      padding: 0.8rem 1.35rem;
      transition:
        transform 0.2s var(--ease),
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        color 0.2s ease;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .btn-primary {
      color: #041018;
      background: linear-gradient(180deg, #b8ecff, var(--accent));
      box-shadow:
        0 0 0 1px rgba(125, 211, 252, 0.4),
        0 10px 30px rgba(125, 211, 252, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(125, 211, 252, 0.55),
        0 14px 36px rgba(125, 211, 252, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-ghost {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      border-color: rgba(232, 237, 247, 0.22);
      background: rgba(232, 237, 247, 0.04);
      transform: translateY(-2px);
    }

    .hint {
      margin-top: 2.25rem;
      color: var(--faint);
      font-size: 0.82rem;
      opacity: 0;
      animation: rise 0.7s var(--ease) 0.8s forwards;
    }

    .hint kbd {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 0.1rem 0.4rem;
      background: var(--bg-elevated);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grid,
      .scan::before,
      .star,
      .badge-dot,
      .code span {
        animation: none !important;
      }

      .badge,
      .code,
      h1,
      .lead,
      .coords,
      .actions,
      .hint {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="grid"></div>
    <div class="stars" id="stars"></div>
    <div class="scan"></div>
  </div>

  <div class="wrap">
    <main>
      <p class="badge"><span class="badge-dot" aria-hidden="true"></span> Signal lost · HTTP 404</p>

      <p class="code" aria-hidden="true">
        <span>4</span><span>0</span><span>4</span>
      </p>

      <h1>This page isn’t on the map</h1>
      <p class="lead">
        The coordinates you followed don’t resolve to anything here.
        It may have moved, been renamed, or never existed.
      </p>

      <div class="coords" aria-hidden="true">
        <span class="chip">LAT <strong id="lat">—</strong></span>
        <span class="chip">LON <strong id="lon">—</strong></span>
        <span class="chip">PATH <strong id="path">/</strong></span>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="/">Return home</a>
        <button class="btn btn-ghost" type="button" id="back">Go back</button>
      </div>

      <p class="hint">Press <kbd>H</kbd> for home · <kbd>Backspace</kbd> to go back</p>
    </main>
  </div>

  <script>
    (function () {
      var stars = document.getElementById("stars");
      var count = Math.min(48, Math.floor(window.innerWidth / 24));
      var frag = document.createDocumentFragment();

      for (var i = 0; i < count; i++) {
        var s = document.createElement("span");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.setProperty("--dur", 3 + Math.random() * 5 + "s");
        s.style.setProperty("--delay", Math.random() * -6 + "s");
        if (Math.random() > 0.7) {
          s.style.width = "3px";
          s.style.height = "3px";
        }
        frag.appendChild(s);
      }
      stars.appendChild(frag);

      function jitter(base, range) {
        return (base + (Math.random() - 0.5) * range).toFixed(2);
      }

      document.getElementById("lat").textContent = jitter(37.77, 8) + "°";
      document.getElementById("lon").textContent = jitter(-122.4, 12) + "°";
      document.getElementById("path").textContent =
        (location.pathname || "/").slice(0, 28) || "/";

      var back = document.getElementById("back");
      back.addEventListener("click", function () {
        if (history.length > 1) {
          history.back();
        } else {
          location.href = "/";
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        if (e.key === "h" || e.key === "H") {
          location.href = "/";
        } else if (e.key === "Backspace" && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          back.click();
        }
      });
    })();
  </script>
</body>
</html>
