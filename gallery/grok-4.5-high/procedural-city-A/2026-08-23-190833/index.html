<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural City at Night</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      color: rgba(180, 210, 255, 0.75);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      max-width: min(360px, calc(100vw - 32px));
    }
    #hud strong { color: rgba(220, 235, 255, 0.95); font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Living Procedural City</strong><br />
    Drag to orbit · Scroll to zoom · Auto-orbit resumes after idle
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CITY = {
  blocks: 8,
  blockSize: 28,
  streetWidth: 10,
  seed: 42,
};

const rand = (() => {
  let s = CITY.seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
})();

const randRange = (a, b) => a + rand() * (b - a);
const choice = (arr) => arr[(rand() * arr.length) | 0];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050814);
scene.fog = new THREE.FogExp2(0x070b18, 0.0042);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 900);
camera.position.set(95, 55, 110);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 12, 0);
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 40;
controls.maxDistance = 260;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

let idleTimer = 0;
const bumpIdle = () => {
  controls.autoRotate = false;
  idleTimer = 2.5;
};
renderer.domElement.addEventListener('pointerdown', bumpIdle);
renderer.domElement.addEventListener('wheel', bumpIdle, { passive: true });

scene.add(new THREE.AmbientLight(0x1a2240, 0.55));
const moon = new THREE.DirectionalLight(0xa8c4ff, 0.35);
moon.position.set(-40, 80, 20);
scene.add(moon);

const hemi = new THREE.HemisphereLight(0x1c2a55, 0x05070f, 0.45);
scene.add(hemi);

const halfExtent = (CITY.blocks * CITY.blockSize + (CITY.blocks + 1) * CITY.streetWidth) * 0.5;

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(halfExtent * 2.4, halfExtent * 2.4),
  new THREE.MeshStandardMaterial({ color: 0x0a0c14, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({
  color: 0x12151f,
  roughness: 0.88,
  metalness: 0.1,
});
const curbMat = new THREE.MeshStandardMaterial({ color: 0x2a2e3a, roughness: 0.7 });

function makeRoads() {
  const group = new THREE.Group();
  const total = CITY.blocks * CITY.blockSize + (CITY.blocks + 1) * CITY.streetWidth;
  const start = -total / 2;

  for (let i = 0; i <= CITY.blocks; i++) {
    const x = start + i * (CITY.blockSize + CITY.streetWidth) + CITY.streetWidth / 2;
    const strip = new THREE.Mesh(
      new THREE.PlaneGeometry(CITY.streetWidth, total),
      roadMat
    );
    strip.rotation.x = -Math.PI / 2;
    strip.position.set(x, 0.01, 0);
    group.add(strip);

    const stripZ = new THREE.Mesh(
      new THREE.PlaneGeometry(total, CITY.streetWidth),
      roadMat
    );
    stripZ.rotation.x = -Math.PI / 2;
    stripZ.position.set(0, 0.015, x);
    group.add(stripZ);
  }

  const laneMark = new THREE.MeshStandardMaterial({
    color: 0xc8b45a,
    emissive: 0x3a3010,
    emissiveIntensity: 0.35,
    roughness: 0.6,
  });

  for (let i = 0; i <= CITY.blocks; i++) {
    const x = start + i * (CITY.blockSize + CITY.streetWidth) + CITY.streetWidth / 2;
    for (let z = -total / 2 + 4; z < total / 2; z += 8) {
      const dash = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.04, 2.2), laneMark);
      dash.position.set(x, 0.04, z);
      group.add(dash);
    }
    for (let xx = -total / 2 + 4; xx < total / 2; xx += 8) {
      const dash = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.04, 0.35), laneMark);
      dash.position.set(xx, 0.04, x);
      group.add(dash);
    }
  }

  scene.add(group);
}

makeRoads();

function makeWindowTexture(cols, rows, baseHue) {
  const w = cols * 8;
  const h = rows * 10;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0b0e18';
  ctx.fillRect(0, 0, w, h);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const lit = rand() > 0.38;
      if (!lit) {
        ctx.fillStyle = `rgba(20, 24, 40, ${0.5 + rand() * 0.4})`;
      } else {
        const warm = rand() > 0.55;
        const a = 0.55 + rand() * 0.45;
        if (warm) {
          ctx.fillStyle = `rgba(${210 + (rand() * 40) | 0}, ${170 + (rand() * 50) | 0}, ${80 + (rand() * 40) | 0}, ${a})`;
        } else {
          const hue = (baseHue + rand() * 40) | 0;
          ctx.fillStyle = `hsla(${hue}, 70%, ${55 + rand() * 25}%, ${a})`;
        }
      }
      const padX = 1 + (rand() * 1.5) | 0;
      const padY = 1 + (rand() * 2) | 0;
      ctx.fillRect(x * 8 + padX, y * 10 + padY, 8 - padX * 2, 10 - padY * 2);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

const facadePalette = [0x1a1f2e, 0x151a28, 0x1c2233, 0x121722, 0x202636, 0x0e121c];
const accentPalette = [0x2a3348, 0x243040, 0x3a2a28, 0x1e2a38];

const buildings = [];
const windowMeshes = [];

function addBuilding(x, z, w, d, h) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  const bodyGeo = new THREE.BoxGeometry(w, h, d);
  const baseColor = choice(facadePalette);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: baseColor,
    roughness: 0.82,
    metalness: 0.18,
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = h / 2;
  group.add(body);

  const cols = Math.max(3, Math.floor(w * 1.1));
  const rows = Math.max(4, Math.floor(h * 0.9));
  const winTex = makeWindowTexture(cols, rows, 195 + rand() * 40);
  const winMat = new THREE.MeshBasicMaterial({
    map: winTex,
    transparent: true,
    opacity: 0.92,
    side: THREE.FrontSide,
  });

  const faces = [
    { pos: [0, h / 2, d / 2 + 0.02], rot: [0, 0, 0], size: [w * 0.92, h * 0.92] },
    { pos: [0, h / 2, -d / 2 - 0.02], rot: [0, Math.PI, 0], size: [w * 0.92, h * 0.92] },
    { pos: [w / 2 + 0.02, h / 2, 0], rot: [0, Math.PI / 2, 0], size: [d * 0.92, h * 0.92] },
    { pos: [-w / 2 - 0.02, h / 2, 0], rot: [0, -Math.PI / 2, 0], size: [d * 0.92, h * 0.92] },
  ];

  for (const f of faces) {
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(f.size[0], f.size[1]), winMat.clone());
    plane.position.set(...f.pos);
    plane.rotation.set(...f.rot);
    plane.userData.phase = rand() * Math.PI * 2;
    plane.userData.speed = 0.15 + rand() * 0.45;
    group.add(plane);
    windowMeshes.push(plane);
  }

  if (h > 28 && rand() > 0.45) {
    const crownH = randRange(1.2, 3.5);
    const crown = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.7, crownH, d * 0.7),
      new THREE.MeshStandardMaterial({ color: choice(accentPalette), roughness: 0.6, metalness: 0.35 })
    );
    crown.position.y = h + crownH / 2;
    group.add(crown);

    if (rand() > 0.4) {
      const antenna = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, randRange(4, 10), 6),
        new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.7, roughness: 0.35 })
      );
      antenna.position.y = h + crownH + 3;
      group.add(antenna);

      const beacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff3344 })
      );
      beacon.position.y = h + crownH + 5.5;
      beacon.userData.blink = true;
      beacon.userData.phase = rand() * Math.PI * 2;
      group.add(beacon);
      buildings.push(beacon);
    }
  }

  if (rand() > 0.55) {
    const ledge = new THREE.Mesh(
      new THREE.BoxGeometry(w * 1.05, 0.35, d * 1.05),
      new THREE.MeshStandardMaterial({ color: 0x2c3344, roughness: 0.7 })
    );
    ledge.position.y = Math.min(h * 0.35, 8);
    group.add(ledge);
  }

  const glow = new THREE.PointLight(
    choice([0xffcc77, 0xaaccff, 0xffaa66, 0x88bbff]),
    0.35 + rand() * 0.55,
    18 + h * 0.25,
    2
  );
  glow.position.set(0, Math.min(h * 0.45, 14), 0);
  group.add(glow);

  scene.add(group);
  buildings.push(group);
}

function generateCity() {
  const total = CITY.blocks * CITY.blockSize + (CITY.blocks + 1) * CITY.streetWidth;
  const start = -total / 2 + CITY.streetWidth;

  for (let bx = 0; bx < CITY.blocks; bx++) {
    for (let bz = 0; bz < CITY.blocks; bz++) {
      const ox = start + bx * (CITY.blockSize + CITY.streetWidth);
      const oz = start + bz * (CITY.blockSize + CITY.streetWidth);

      const plots = 2 + (rand() > 0.5 ? 1 : 0);
      const cell = CITY.blockSize / plots;
      for (let px = 0; px < plots; px++) {
        for (let pz = 0; pz < plots; pz++) {
          if (rand() < 0.08) continue;
          const margin = 1.2 + rand() * 1.5;
          const w = cell - margin * 2 - rand() * 1.5;
          const d = cell - margin * 2 - rand() * 1.5;
          const dist = Math.hypot(
            ox + (px + 0.5) * cell - CITY.blockSize / 2,
            oz + (pz + 0.5) * cell - CITY.blockSize / 2
          );
          const centerBias = Math.max(0, 1 - dist / (halfExtent * 0.9));
          const h = randRange(8, 18) + centerBias * randRange(20, 55) + (rand() > 0.85 ? randRange(15, 40) : 0);
          const cx = ox + px * cell + cell / 2 + randRange(-0.4, 0.4);
          const cz = oz + pz * cell + cell / 2 + randRange(-0.4, 0.4);
          addBuilding(cx, cz, Math.max(4, w), Math.max(4, d), h);
        }
      }
    }
  }
}

generateCity();

const streetLights = [];
function placeStreetLights() {
  const total = CITY.blocks * CITY.blockSize + (CITY.blocks + 1) * CITY.streetWidth;
  const start = -total / 2;
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x222833, metalness: 0.6, roughness: 0.4 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffe0a0 });

  for (let i = 0; i <= CITY.blocks; i++) {
    const road = start + i * (CITY.blockSize + CITY.streetWidth) + CITY.streetWidth / 2;
    for (let t = -total / 2 + 14; t < total / 2; t += 28) {
      for (const [sx, sz, alongX] of [
        [road + CITY.streetWidth * 0.38, t, false],
        [road - CITY.streetWidth * 0.38, t, false],
        [t, road + CITY.streetWidth * 0.38, true],
        [t, road - CITY.streetWidth * 0.38, true],
      ]) {
        if (Math.abs(sx) > halfExtent + 5 || Math.abs(sz) > halfExtent + 5) continue;
        if (rand() < 0.35) continue;

        const g = new THREE.Group();
        g.position.set(sx, 0, sz);
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 6.5, 6), poleMat);
        pole.position.y = 3.25;
        g.add(pole);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(alongX ? 1.8 : 0.2, 0.12, alongX ? 0.2 : 1.8), poleMat);
        arm.position.set(alongX ? (sx > 0 ? -0.7 : 0.7) * 0.5 : 0, 6.3, alongX ? 0 : (sz > 0 ? -0.7 : 0.7) * 0.5);
        g.add(arm);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), lampMat);
        bulb.position.set(arm.position.x * 1.6, 6.1, arm.position.z * 1.6);
        g.add(bulb);

        const light = new THREE.PointLight(0xffd9a0, 1.1, 22, 2);
        light.position.copy(bulb.position);
        g.add(light);
        light.userData.base = light.intensity;
        light.userData.phase = rand() * Math.PI * 2;
        streetLights.push(light);
        scene.add(g);
      }
    }
  }
}

placeStreetLights();

const cars = [];
const carColors = [0xff4455, 0x44aaff, 0xffaa33, 0x66ff99, 0xcc66ff, 0xffffff, 0x3388ff];

function spawnCar(alongX, laneOffset, speed) {
  const total = CITY.blocks * CITY.blockSize + (CITY.blocks + 1) * CITY.streetWidth;
  const start = -total / 2;
  const roads = [];
  for (let i = 0; i <= CITY.blocks; i++) {
    roads.push(start + i * (CITY.blockSize + CITY.streetWidth) + CITY.streetWidth / 2);
  }
  const road = choice(roads);
  const body = new THREE.Group();
  const col = choice(carColors);
  const chassis = new THREE.Mesh(
    new THREE.BoxGeometry(alongX ? 3.2 : 1.5, 0.7, alongX ? 1.5 : 3.2),
    new THREE.MeshStandardMaterial({ color: col, metalness: 0.55, roughness: 0.35 })
  );
  chassis.position.y = 0.55;
  body.add(chassis);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(alongX ? 1.6 : 1.2, 0.55, alongX ? 1.2 : 1.6),
    new THREE.MeshStandardMaterial({ color: 0x111318, metalness: 0.3, roughness: 0.2 })
  );
  cabin.position.y = 1.05;
  body.add(cabin);

  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff2c8 });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2233 });
  const hx = alongX ? (speed > 0 ? 1.55 : -1.55) : 0;
  const hz = alongX ? 0 : (speed > 0 ? 1.55 : -1.55);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.35), headMat);
  head.position.set(hx, 0.55, hz);
  body.add(head);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.18, 0.3), tailMat);
  tail.position.set(-hx, 0.55, -hz);
  body.add(tail);

  const headLight = new THREE.PointLight(0xfff0c8, 0.9, 14, 2);
  headLight.position.set(hx * 1.2, 0.6, hz * 1.2);
  body.add(headLight);

  if (alongX) {
    body.position.set(randRange(-halfExtent, halfExtent), 0, road + laneOffset);
  } else {
    body.position.set(road + laneOffset, 0, randRange(-halfExtent, halfExtent));
  }

  body.userData = { alongX, speed, road, laneOffset, half: halfExtent + 20 };
  scene.add(body);
  cars.push(body);
}

for (let i = 0; i < 28; i++) {
  const alongX = rand() > 0.5;
  const dir = rand() > 0.5 ? 1 : -1;
  spawnCar(alongX, dir * 2.2, dir * randRange(10, 22));
}

const starsGeo = new THREE.BufferGeometry();
const starCount = 1200;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 350 + rand() * 200;
  const theta = rand() * Math.PI * 2;
  const phi = Math.acos(randRange(0.05, 0.92));
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = r * Math.cos(phi) + 40;
  starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(
  starsGeo,
  new THREE.PointsMaterial({ color: 0xbfd4ff, size: 1.4, sizeAttenuation: true, transparent: true, opacity: 0.85 })
);
scene.add(stars);

const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(6, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xdde6ff })
);
moonMesh.position.set(-120, 95, -80);
scene.add(moonMesh);
const moonGlow = new THREE.PointLight(0xaabbff, 0.8, 400, 1.5);
moonGlow.position.copy(moonMesh.position);
scene.add(moonGlow);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (idleTimer > 0) {
    idleTimer -= dt;
    if (idleTimer <= 0) controls.autoRotate = true;
  }

  for (const w of windowMeshes) {
    const flicker = 0.82 + 0.18 * Math.sin(t * w.userData.speed + w.userData.phase);
    w.material.opacity = flicker;
  }

  for (const b of buildings) {
    if (b.userData && b.userData.blink) {
      b.material.color.setHex(Math.sin(t * 3 + b.userData.phase) > 0 ? 0xff3344 : 0x220808);
    }
  }

  for (const L of streetLights) {
    L.intensity = L.userData.base * (0.92 + 0.08 * Math.sin(t * 2.1 + L.userData.phase));
  }

  for (const car of cars) {
    const u = car.userData;
    if (u.alongX) {
      car.position.x += u.speed * dt;
      if (car.position.x > u.half) car.position.x = -u.half;
      if (car.position.x < -u.half) car.position.x = u.half;
    } else {
      car.position.z += u.speed * dt;
      if (car.position.z > u.half) car.position.z = -u.half;
      if (car.position.z < -u.half) car.position.z = u.half;
    }
  }

  stars.rotation.y = t * 0.003;
  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
  </script>
</body>
</html>
