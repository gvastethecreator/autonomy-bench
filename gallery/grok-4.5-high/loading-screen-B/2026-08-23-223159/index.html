<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit — Loading</title>
  <style>
    :root {
      --bg-0: #07090f;
      --bg-1: #0c1220;
      --ink: #e8eefc;
      --muted: #8b9bb8;
      --accent: #6ee7ff;
      --accent-2: #a78bfa;
      --glow: rgba(110, 231, 255, 0.35);
      --track: rgba(232, 238, 252, 0.08);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg-0);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .stage {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(167, 139, 250, 0.18), transparent 55%),
        radial-gradient(ellipse 60% 45% at 80% 90%, rgba(110, 231, 255, 0.1), transparent 50%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(99, 102, 241, 0.12), transparent 45%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
    }

    .noise {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 26rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      animation: rise-in 700ms var(--ease-out) 80ms forwards;
    }

    .brand-mark {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.7rem;
      background:
        linear-gradient(145deg, rgba(110, 231, 255, 0.25), rgba(167, 139, 250, 0.2)),
        rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(232, 238, 252, 0.12);
      box-shadow: 0 0 28px var(--glow);
      display: grid;
      place-items: center;
    }

    .brand-mark svg {
      width: 1.15rem;
      height: 1.15rem;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .orbiter {
      position: relative;
      width: min(72vw, 13.5rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.96);
      animation: soft-in 800ms var(--ease-out) 160ms forwards;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(232, 238, 252, 0.08);
    }

    .ring-mid {
      inset: 12%;
      border-color: rgba(110, 231, 255, 0.16);
    }

    .ring-inner {
      inset: 28%;
      border-color: rgba(167, 139, 250, 0.2);
    }

    .sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 250deg,
        rgba(110, 231, 255, 0.05) 300deg,
        rgba(110, 231, 255, 0.55) 340deg,
        rgba(167, 139, 250, 0.8) 360deg
      );
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      animation: spin 2.4s linear infinite;
    }

    .sweep-2 {
      inset: 12%;
      background: conic-gradient(
        from 180deg,
        transparent 0deg,
        transparent 280deg,
        rgba(167, 139, 250, 0.45) 340deg,
        rgba(110, 231, 255, 0.7) 360deg
      );
      animation-duration: 3.6s;
      animation-direction: reverse;
    }

    .core {
      position: relative;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.35), transparent 40%),
        radial-gradient(circle at 50% 55%, rgba(110, 231, 255, 0.55), rgba(167, 139, 250, 0.35) 55%, rgba(12, 18, 32, 0.9) 75%);
      box-shadow:
        0 0 0 1px rgba(232, 238, 252, 0.12),
        0 0 40px rgba(110, 231, 255, 0.35),
        inset 0 0 24px rgba(255, 255, 255, 0.08);
      animation: pulse 2.8s var(--ease-in-out) infinite;
    }

    .sat {
      position: absolute;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      top: 50%;
      left: 50%;
      margin: -0.275rem 0 0 -0.275rem;
      transform: rotate(0deg) translateY(-6.75rem);
      animation: orbit 2.4s linear infinite;
    }

    .sat-2 {
      background: var(--accent-2);
      box-shadow: 0 0 12px var(--accent-2);
      transform: rotate(0deg) translateY(-4.85rem);
      animation: orbit-rev 3.6s linear infinite;
    }

    .meter {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      opacity: 0;
      transform: translateY(10px);
      animation: rise-in 700ms var(--ease-out) 280ms forwards;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      min-height: 1.25rem;
    }

    .status {
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .percent {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .track {
      position: relative;
      height: 0.28rem;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 16px rgba(110, 231, 255, 0.45);
      transition: width 180ms linear;
    }

    .fill::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 2.5rem;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55));
      opacity: 0.7;
      animation: shimmer 1.4s linear infinite;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hint {
      margin-top: 0.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      opacity: 0;
      animation: rise-in 700ms var(--ease-out) 420ms forwards;
    }

    .hint kbd {
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.12rem 0.35rem;
      border-radius: 0.3rem;
      border: 1px solid rgba(232, 238, 252, 0.14);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
    }

    /* Ready state */
    .ready {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      background:
        radial-gradient(ellipse 70% 50% at 50% 40%, rgba(110, 231, 255, 0.12), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 500ms var(--ease-out), visibility 0s linear 500ms;
    }

    .ready.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 500ms var(--ease-out);
    }

    .ready-card {
      width: min(100%, 24rem);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      transform: translateY(12px) scale(0.97);
      opacity: 0;
      transition: transform 550ms var(--ease-out), opacity 550ms var(--ease-out);
    }

    .ready.is-visible .ready-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .ready-icon {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(110, 231, 255, 0.12);
      border: 1px solid rgba(110, 231, 255, 0.35);
      box-shadow: 0 0 32px rgba(110, 231, 255, 0.25);
      color: var(--accent);
    }

    .ready-icon svg {
      width: 1.4rem;
      height: 1.4rem;
    }

    .ready h2 {
      font-size: clamp(1.35rem, 3.5vw, 1.7rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .ready p {
      max-width: 22rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
      margin-top: 0.35rem;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.2rem;
      transition: transform 140ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7af0ff, #8b7cf7);
      color: #071018;
      font-weight: 600;
      box-shadow: 0 8px 28px rgba(110, 231, 255, 0.25);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(232, 238, 252, 0.16);
    }

    @media (hover: hover) and (pointer: fine) {
      .btn-primary:hover {
        transform: translateY(-1px);
      }
      .btn-ghost:hover {
        border-color: rgba(232, 238, 252, 0.32);
        background: rgba(255, 255, 255, 0.04);
      }
      button:active {
        transform: translateY(0) scale(0.98);
      }
    }

    .loading.is-done {
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out);
      pointer-events: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes orbit {
      to { transform: rotate(360deg) translateY(-6.75rem); }
    }

    @keyframes orbit-rev {
      to { transform: rotate(-360deg) translateY(-4.85rem); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.04); filter: brightness(1.12); }
    }

    @keyframes shimmer {
      from { transform: translateX(-120%); }
      to { transform: translateX(40%); }
    }

    @keyframes rise-in {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes soft-in {
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand,
      .orbiter,
      .meter,
      .hint {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .sweep,
      .sweep-2,
      .sat,
      .sat-2,
      .core,
      .fill::after {
        animation: none;
      }

      .fill {
        transition: width 80ms linear;
      }

      .ready,
      .ready-card,
      .loading.is-done,
      button {
        transition: none;
      }

      .ready.is-visible .ready-card {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="app">
    <div class="noise" aria-hidden="true"></div>

    <section class="shell loading" id="loading" aria-labelledby="loading-title" aria-busy="true">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <ellipse cx="12" cy="12" rx="9" ry="4.5" transform="rotate(-24 12 12)" />
            <ellipse cx="12" cy="12" rx="9" ry="4.5" transform="rotate(48 12 12)" />
          </svg>
        </div>
        <h1 id="loading-title">Orbit</h1>
      </header>

      <div class="orbiter" aria-hidden="true">
        <div class="ring"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="sweep"></div>
        <div class="sweep sweep-2"></div>
        <div class="sat"></div>
        <div class="sat sat-2"></div>
        <div class="core"></div>
      </div>

      <div class="meter">
        <div class="status-row">
          <p class="status" id="status" aria-live="polite">Warming systems</p>
          <p class="percent" id="percent" aria-hidden="true">0%</p>
        </div>
        <div
          class="track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-labelledby="status"
          id="progress"
        >
          <div class="fill" id="fill"></div>
        </div>
        <div class="meta">
          <span id="phase">Phase 01 / 05</span>
          <span id="eta">~4.2s</span>
        </div>
      </div>

      <p class="hint">Press <kbd>Space</kbd> to skip</p>
      <p class="sr-only" id="announce" aria-live="assertive"></p>
    </section>

    <section class="ready" id="ready" aria-labelledby="ready-title" hidden>
      <div class="ready-card">
        <div class="ready-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h2 id="ready-title">You're ready</h2>
        <p>Orbit finished warming the workspace. Everything is synced and waiting for your next move.</p>
        <div class="actions">
          <button type="button" class="btn-primary" id="enter">Enter workspace</button>
          <button type="button" class="btn-ghost" id="replay">Replay load</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const STEPS = [
        { at: 0, label: "Warming systems", phase: "Phase 01 / 05" },
        { at: 18, label: "Mapping constellations", phase: "Phase 02 / 05" },
        { at: 42, label: "Syncing workspace", phase: "Phase 03 / 05" },
        { at: 68, label: "Calibrating orbit", phase: "Phase 04 / 05" },
        { at: 88, label: "Final checks", phase: "Phase 05 / 05" },
        { at: 100, label: "Ready", phase: "Complete" }
      ];

      const DURATION = 4200;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const loading = document.getElementById("loading");
      const ready = document.getElementById("ready");
      const statusEl = document.getElementById("status");
      const percentEl = document.getElementById("percent");
      const fillEl = document.getElementById("fill");
      const progressEl = document.getElementById("progress");
      const phaseEl = document.getElementById("phase");
      const etaEl = document.getElementById("eta");
      const announce = document.getElementById("announce");
      const enterBtn = document.getElementById("enter");
      const replayBtn = document.getElementById("replay");

      let raf = 0;
      let start = 0;
      let done = false;
      let stepIndex = 0;

      function setProgress(value) {
        const pct = Math.max(0, Math.min(100, Math.round(value)));
        fillEl.style.width = pct + "%";
        percentEl.textContent = pct + "%";
        progressEl.setAttribute("aria-valuenow", String(pct));

        while (stepIndex < STEPS.length - 1 && pct >= STEPS[stepIndex + 1].at) {
          stepIndex += 1;
          statusEl.textContent = STEPS[stepIndex].label;
          phaseEl.textContent = STEPS[stepIndex].phase;
        }

        const remaining = Math.max(0, (DURATION * (100 - pct)) / 100 / 1000);
        etaEl.textContent = pct >= 100 ? "0.0s" : "~" + remaining.toFixed(1) + "s";
      }

      function showReady() {
        if (done) return;
        done = true;
        cancelAnimationFrame(raf);
        setProgress(100);
        statusEl.textContent = "Ready";
        phaseEl.textContent = "Complete";
        etaEl.textContent = "0.0s";
        loading.classList.add("is-done");
        loading.setAttribute("aria-busy", "false");
        announce.textContent = "Loading complete. Workspace ready.";

        window.setTimeout(function () {
          loading.hidden = true;
          ready.hidden = false;
          ready.classList.add("is-visible");
          enterBtn.focus();
        }, reduceMotion ? 0 : 420);
      }

      function tick(now) {
        if (!start) start = now;
        const elapsed = now - start;
        const t = Math.min(1, elapsed / DURATION);
        // Ease-out curve for progress feel (starts faster, settles)
        const eased = 1 - Math.pow(1 - t, 2.2);
        setProgress(eased * 100);
        if (t < 1) {
          raf = requestAnimationFrame(tick);
        } else {
          showReady();
        }
      }

      function startLoad() {
        cancelAnimationFrame(raf);
        done = false;
        start = 0;
        stepIndex = 0;
        loading.hidden = false;
        loading.classList.remove("is-done");
        loading.setAttribute("aria-busy", "true");
        ready.hidden = true;
        ready.classList.remove("is-visible");
        statusEl.textContent = STEPS[0].label;
        phaseEl.textContent = STEPS[0].phase;
        announce.textContent = "";
        setProgress(0);

        if (reduceMotion) {
          // Jump through stages quickly without ornamental motion
          let i = 0;
          const quick = window.setInterval(function () {
            i += 1;
            const pct = Math.min(100, i * 20);
            setProgress(pct);
            if (pct >= 100) {
              window.clearInterval(quick);
              showReady();
            }
          }, 90);
          return;
        }

        raf = requestAnimationFrame(tick);
      }

      function onKey(e) {
        if (done) return;
        if (e.code === "Space" || e.key === " ") {
          e.preventDefault();
          showReady();
        }
      }

      enterBtn.addEventListener("click", function () {
        enterBtn.textContent = "Opening…";
        enterBtn.disabled = true;
        window.setTimeout(function () {
          enterBtn.textContent = "Welcome aboard";
        }, 500);
      });

      replayBtn.addEventListener("click", function () {
        enterBtn.textContent = "Enter workspace";
        enterBtn.disabled = false;
        startLoad();
      });

      window.addEventListener("keydown", onKey);
      startLoad();
    })();
  </script>
</body>
</html>
