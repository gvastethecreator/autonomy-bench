<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Aether Lab — 2D Physics Sandbox</title>
<style>
  :root {
    --bg0: #07090f;
    --bg1: #0d1220;
    --panel: rgba(14, 18, 32, 0.78);
    --panel-border: rgba(120, 160, 255, 0.14);
    --text: #e8eefc;
    --muted: #8b97b8;
    --accent: #6ea8ff;
    --accent2: #a78bfa;
    --warm: #ffb86b;
    --danger: #ff6b8a;
    --ok: #5eead4;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg0);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(88, 120, 255, 0.18), transparent 55%),
      radial-gradient(900px 600px at 90% 10%, rgba(167, 139, 250, 0.12), transparent 50%),
      radial-gradient(800px 500px at 50% 110%, rgba(94, 234, 212, 0.08), transparent 45%),
      linear-gradient(180deg, #090b14 0%, #07090f 100%);
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    background: linear-gradient(180deg, rgba(12, 16, 28, 0.92), rgba(12, 16, 28, 0.55));
    backdrop-filter: blur(18px);
    z-index: 5;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background:
      radial-gradient(circle at 30% 30%, #c4d7ff, #6ea8ff 45%, #3b5bdb 70%, #1e293b 100%);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.12),
      0 8px 24px rgba(110, 168, 255, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
    position: relative;
    flex-shrink: 0;
  }

  .logo::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, rgba(255,255,255,0.2) 40%, transparent 70%);
    opacity: 0.85;
  }

  .brand h1 {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.02em;
    line-height: 1.15;
  }

  .brand p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .pill strong {
    color: var(--text);
    font-weight: 600;
  }

  .stage-wrap {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  canvas#world {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }

  .vignette {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.35) 100%),
      linear-gradient(180deg, rgba(7,9,15,0.15), transparent 18%, transparent 82%, rgba(7,9,15,0.35));
    z-index: 1;
  }

  .hud-float {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    inset: 0;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(10, 14, 26, 0.72);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.01em;
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    transition: opacity 0.5s ease, transform 0.5s ease;
    white-space: nowrap;
    max-width: calc(100% - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hint.hide {
    opacity: 0;
    transform: translateX(-50%) translateY(8px);
    pointer-events: none;
  }

  .toast {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(16, 22, 40, 0.9);
    border: 1px solid rgba(110, 168, 255, 0.25);
    color: var(--text);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  aside.dock {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    gap: 10px;
    padding: 12px 14px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    background: linear-gradient(180deg, rgba(10, 14, 24, 0.55), rgba(8, 11, 20, 0.92));
    backdrop-filter: blur(20px);
    z-index: 5;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    min-width: 0;
  }

  .panel h2 {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .tools, .shapes, .mats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  button.tool, button.shape, button.mat, button.action {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.035);
    color: var(--text);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 560;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    user-select: none;
  }

  button.tool:hover, button.shape:hover, button.mat:hover, button.action:hover {
    background: rgba(110, 168, 255, 0.12);
    border-color: rgba(110, 168, 255, 0.28);
  }

  button.tool:active, button.shape:active, button.mat:active, button.action:active {
    transform: translateY(1px) scale(0.98);
  }

  button.tool.active, button.shape.active, button.mat.active {
    background: linear-gradient(180deg, rgba(110, 168, 255, 0.28), rgba(110, 168, 255, 0.12));
    border-color: rgba(110, 168, 255, 0.55);
    box-shadow: 0 0 0 1px rgba(110, 168, 255, 0.15), 0 8px 22px rgba(80, 120, 255, 0.18);
    color: #fff;
  }

  button.mat[data-mat="rubber"].active {
    border-color: rgba(94, 234, 212, 0.55);
    background: linear-gradient(180deg, rgba(94, 234, 212, 0.22), rgba(94, 234, 212, 0.08));
  }
  button.mat[data-mat="metal"].active {
    border-color: rgba(203, 213, 225, 0.55);
    background: linear-gradient(180deg, rgba(203, 213, 225, 0.2), rgba(148, 163, 184, 0.08));
  }
  button.mat[data-mat="ice"].active {
    border-color: rgba(125, 211, 252, 0.55);
    background: linear-gradient(180deg, rgba(125, 211, 252, 0.22), rgba(56, 189, 248, 0.08));
  }
  button.mat[data-mat="soft"].active {
    border-color: rgba(251, 146, 60, 0.55);
    background: linear-gradient(180deg, rgba(251, 146, 60, 0.22), rgba(249, 115, 22, 0.08));
  }

  button.action.danger:hover {
    background: rgba(255, 107, 138, 0.14);
    border-color: rgba(255, 107, 138, 0.4);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }

  .row label {
    font-size: 11px;
    color: var(--muted);
    width: 58px;
    flex-shrink: 0;
  }

  .row .val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    width: 42px;
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(110,168,255,0.15), rgba(167,139,250,0.35));
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(180deg, #dbe7ff, #6ea8ff);
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 2px 8px rgba(80,120,255,0.45);
    cursor: pointer;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .kbd {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
  }

  .swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px currentColor;
  }

  @media (max-width: 980px) {
    aside.dock {
      grid-template-columns: 1fr;
      max-height: 42vh;
      overflow: auto;
    }
    .brand p { display: none; }
    .hint { font-size: 11px; bottom: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Aether Lab</h1>
          <p>2D Physics Sandbox</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="pill" title="Bodies in world"><strong id="statBodies">0</strong> bodies</div>
        <div class="pill" title="Simulation rate"><strong id="statFps">60</strong> fps</div>
        <div class="pill" title="Time scale"><strong id="statScale">1.00×</strong></div>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="world" aria-label="Physics sandbox canvas"></canvas>
      <div class="vignette"></div>
      <div class="hud-float">
        <div class="toast" id="toast"></div>
        <div class="hint" id="hint">Click to spawn · Drag to throw · Scroll to resize · Space pauses</div>
      </div>
    </div>

    <aside class="dock">
      <section class="panel">
        <h2>Tools</h2>
        <div class="tools" id="tools">
          <button class="tool active" data-tool="spawn" title="Spawn bodies">✦ Spawn</button>
          <button class="tool" data-tool="grab" title="Grab and throw">✋ Grab</button>
          <button class="tool" data-tool="pin" title="Pin / unpin body">📌 Pin</button>
          <button class="tool" data-tool="spring" title="Connect two bodies">⟳ Spring</button>
          <button class="tool" data-tool="explode" title="Impulse blast">💥 Blast</button>
          <button class="tool" data-tool="erase" title="Remove bodies">⌫ Erase</button>
        </div>
        <div class="row" style="margin-top:12px">
          <label>Gravity</label>
          <input type="range" id="gravity" min="-400" max="1600" value="980" step="10" />
          <span class="val" id="gravityVal">980</span>
        </div>
        <div class="row">
          <label>Time</label>
          <input type="range" id="timescale" min="0" max="200" value="100" step="1" />
          <span class="val" id="timescaleVal">1.00×</span>
        </div>
      </section>

      <section class="panel">
        <h2>Shapes &amp; Material</h2>
        <div class="shapes" id="shapes">
          <button class="shape active" data-shape="circle">● Circle</button>
          <button class="shape" data-shape="box">■ Box</button>
          <button class="shape" data-shape="tri">▲ Triangle</button>
          <button class="shape" data-shape="hex">⬡ Hex</button>
          <button class="shape" data-shape="stack">▥ Stack</button>
        </div>
        <div class="mats" id="mats" style="margin-top:8px">
          <button class="mat active" data-mat="rubber"><span class="swatch" style="color:#5eead4;background:#5eead4"></span> Rubber</button>
          <button class="mat" data-mat="metal"><span class="swatch" style="color:#cbd5e1;background:#cbd5e1"></span> Metal</button>
          <button class="mat" data-mat="ice"><span class="swatch" style="color:#7dd3fc;background:#7dd3fc"></span> Ice</button>
          <button class="mat" data-mat="soft"><span class="swatch" style="color:#fb923c;background:#fb923c"></span> Soft</button>
        </div>
        <div class="row" style="margin-top:12px">
          <label>Size</label>
          <input type="range" id="size" min="12" max="72" value="28" step="1" />
          <span class="val" id="sizeVal">28</span>
        </div>
      </section>

      <section class="panel">
        <h2>Scene</h2>
        <div class="actions">
          <button class="action" id="btnPause" title="Space">⏸ Pause <span class="kbd">Space</span></button>
          <button class="action" id="btnSlow" title="Hold Shift while simulating">Slow-mo</button>
          <button class="action" id="btnRain">Rain</button>
          <button class="action" id="btnFloor">Toggle Floor</button>
          <button class="action danger" id="btnClear">Clear</button>
          <button class="action" id="btnDemo">Demo</button>
        </div>
        <p style="margin-top:12px;font-size:11px;color:var(--muted);line-height:1.5">
          <span class="kbd">1–6</span> tools · <span class="kbd">Q–T</span> shapes · <span class="kbd">R</span> clear ·
          <span class="kbd">Wheel</span> size · Right-drag pans camera
        </p>
      </section>
    </aside>
  </div>

<script>
(() => {
  "use strict";

  // ─── Config & materials ───────────────────────────────────────────
  const MATERIALS = {
    rubber: { name: "Rubber", rest: 0.78, fric: 0.55, dens: 1.0, color: [94, 234, 212], glow: 0.55 },
    metal:  { name: "Metal",  rest: 0.28, fric: 0.42, dens: 2.4, color: [203, 213, 225], glow: 0.25 },
    ice:    { name: "Ice",    rest: 0.18, fric: 0.06, dens: 0.85, color: [125, 211, 252], glow: 0.45 },
    soft:   { name: "Soft",   rest: 0.08, fric: 0.85, dens: 0.55, color: [251, 146, 60], glow: 0.4 },
  };

  const state = {
    tool: "spawn",
    shape: "circle",
    mat: "rubber",
    size: 28,
    gravity: 980,
    timescale: 1,
    paused: false,
    slowmo: false,
    floorOn: true,
    spawnHintHidden: false,
  };

  // ─── Canvas ───────────────────────────────────────────────────────
  const canvas = document.getElementById("world");
  const ctx = canvas.getContext("2d", { alpha: false });
  let W = 0, H = 0, dpr = 1;
  const cam = { x: 0, y: 0, zoom: 1 };
  let shake = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ─── Math helpers ─────────────────────────────────────────────────
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const len = (x, y) => Math.hypot(x, y);
  const norm = (x, y) => { const L = Math.hypot(x, y) || 1; return [x / L, y / L]; };

  function screenToWorld(sx, sy) {
    return {
      x: (sx - W / 2) / cam.zoom + cam.x,
      y: (sy - H / 2) / cam.zoom + cam.y,
    };
  }

  function worldToScreen(wx, wy) {
    return {
      x: (wx - cam.x) * cam.zoom + W / 2,
      y: (wy - cam.y) * cam.zoom + H / 2,
    };
  }

  // ─── Audio (subtle UI / impact) ───────────────────────────────────
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function blip(freq = 440, dur = 0.06, type = "sine", gain = 0.03) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.6), t0 + dur);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function thud(intensity = 0.5) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(90 + intensity * 40, t0);
    o.frequency.exponentialRampToValueAtTime(40, t0 + 0.12);
    const vol = clamp(0.01 + intensity * 0.04, 0, 0.06);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.16);
  }

  // ─── Particles & FX ───────────────────────────────────────────────
  const particles = [];
  const sparks = [];
  const ripples = [];
  const stars = Array.from({ length: 80 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.4 + 0.3,
    a: Math.random() * 0.5 + 0.15,
    tw: Math.random() * TAU,
  }));

  function burst(x, y, color, n = 12, speed = 180) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const s = rand(speed * 0.3, speed);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(0.35, 0.8),
        max: 0.8,
        r: rand(1.5, 3.5),
        color,
      });
    }
  }

  function addSpark(x, y, nx, ny, intensity) {
    sparks.push({
      x, y, nx, ny,
      life: 0.18 + intensity * 0.15,
      max: 0.18 + intensity * 0.15,
      intensity,
    });
  }

  function addRipple(x, y, color) {
    ripples.push({ x, y, r: 4, life: 0.45, max: 0.45, color });
  }

  // ─── Physics world ────────────────────────────────────────────────
  const bodies = [];
  const constraints = [];
  let nextId = 1;
  const walls = { left: true, right: true, top: false, bottom: true };

  class Body {
    constructor(opts) {
      this.id = nextId++;
      this.type = opts.type || "circle"; // circle | polygon
      this.x = opts.x; this.y = opts.y;
      this.vx = opts.vx || 0; this.vy = opts.vy || 0;
      this.angle = opts.angle || 0;
      this.omega = opts.omega || 0;
      this.radius = opts.radius || 20;
      this.hw = opts.hw || 20; // half-width for boxes / poly approx
      this.hh = opts.hh || 20;
      this.verts = opts.verts || null; // local-space polygon verts
      this.mat = opts.mat || "rubber";
      this.pinned = !!opts.pinned;
      this.static = !!opts.static;
      this.life = opts.life ?? Infinity;
      this.age = 0;
      this.hueShift = rand(-8, 8);
      this.impactFlash = 0;
      this._mass = 0;
      this._invMass = 0;
      this._inertia = 0;
      this._invInertia = 0;
      this.recomputeMass();
    }

    get material() { return MATERIALS[this.mat] || MATERIALS.rubber; }

    recomputeMass() {
      const dens = this.material.dens;
      let area;
      if (this.type === "circle") {
        area = Math.PI * this.radius * this.radius;
        this._inertia = 0.5 * dens * area * this.radius * this.radius;
      } else {
        // polygon area (shoelace) approx using verts or box
        if (this.verts && this.verts.length >= 3) {
          let a = 0;
          for (let i = 0; i < this.verts.length; i++) {
            const j = (i + 1) % this.verts.length;
            a += this.verts[i][0] * this.verts[j][1] - this.verts[j][0] * this.verts[i][1];
          }
          area = Math.abs(a) * 0.5;
          // approximate inertia via bounding circle
          let maxR2 = 0;
          for (const v of this.verts) maxR2 = Math.max(maxR2, v[0]*v[0] + v[1]*v[1]);
          this._inertia = 0.5 * dens * area * maxR2;
        } else {
          area = this.hw * 2 * this.hh * 2;
          this._inertia = dens * area * (this.hw*this.hw + this.hh*this.hh) / 6;
        }
      }
      this._mass = dens * area * 0.001;
      if (this.static || this.pinned) {
        this._invMass = 0;
        this._invInertia = 0;
      } else {
        this._invMass = this._mass > 0 ? 1 / this._mass : 0;
        this._invInertia = this._inertia > 0 ? 1 / this._inertia : 0;
      }
    }

    worldVerts() {
      if (!this.verts) {
        // box
        const c = Math.cos(this.angle), s = Math.sin(this.angle);
        const pts = [[-this.hw, -this.hh], [this.hw, -this.hh], [this.hw, this.hh], [-this.hw, this.hh]];
        return pts.map(([lx, ly]) => [this.x + lx * c - ly * s, this.y + lx * s + ly * c]);
      }
      const c = Math.cos(this.angle), s = Math.sin(this.angle);
      return this.verts.map(([lx, ly]) => [this.x + lx * c - ly * s, this.y + lx * s + ly * c]);
    }

    bounds() {
      if (this.type === "circle") {
        return {
          minX: this.x - this.radius, maxX: this.x + this.radius,
          minY: this.y - this.radius, maxY: this.y + this.radius,
        };
      }
      const vs = this.worldVerts();
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const [x, y] of vs) {
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
      return { minX, maxX, minY, maxY };
    }

    contains(px, py) {
      if (this.type === "circle") {
        return (px - this.x) ** 2 + (py - this.y) ** 2 <= this.radius ** 2;
      }
      const vs = this.worldVerts();
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        const xi = vs[i][0], yi = vs[i][1];
        const xj = vs[j][0], yj = vs[j][1];
        const intersect = ((yi > py) !== (yj > py)) &&
          (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-9) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }
  }

  function makeRegularPoly(n, r) {
    const verts = [];
    const rot = -Math.PI / 2 + (n === 4 ? Math.PI / 4 : 0);
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * TAU;
      verts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return verts;
  }

  function spawnBody(x, y, overrides = {}) {
    const mat = overrides.mat || state.mat;
    const size = overrides.size ?? state.size;
    const shape = overrides.shape || state.shape;
    let body;
    if (shape === "circle") {
      body = new Body({ type: "circle", x, y, radius: size, mat, ...overrides });
    } else if (shape === "box") {
      body = new Body({
        type: "polygon", x, y, hw: size * 0.9, hh: size * 0.7, mat,
        verts: [[-size*0.9,-size*0.7],[size*0.9,-size*0.7],[size*0.9,size*0.7],[-size*0.9,size*0.7]],
        ...overrides,
      });
    } else if (shape === "tri") {
      body = new Body({ type: "polygon", x, y, mat, verts: makeRegularPoly(3, size), hw: size, hh: size, ...overrides });
    } else if (shape === "hex") {
      body = new Body({ type: "polygon", x, y, mat, verts: makeRegularPoly(6, size), hw: size, hh: size, ...overrides });
    } else {
      body = new Body({ type: "circle", x, y, radius: size, mat, ...overrides });
    }
    if (overrides.vx == null) body.vx = rand(-20, 20);
    if (overrides.vy == null) body.vy = rand(-10, 10);
    bodies.push(body);
    const c = body.material.color;
    burst(x, y, c, 8, 120);
    addRipple(x, y, c);
    return body;
  }

  function spawnStack(x, y) {
    const rows = 5;
    const size = state.size * 0.75;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c <= r; c++) {
        const ox = (c - r / 2) * size * 1.85;
        const oy = -r * size * 1.55;
        spawnBody(x + ox, y + oy, { shape: "box", size, vx: 0, vy: 0 });
      }
    }
    toast("Pyramid stacked");
  }

  function removeBody(b) {
    const idx = bodies.indexOf(b);
    if (idx >= 0) bodies.splice(idx, 1);
    for (let i = constraints.length - 1; i >= 0; i--) {
      if (constraints[i].a === b || constraints[i].b === b) constraints.splice(i, 1);
    }
    const c = b.material.color;
    burst(b.x, b.y, c, 14, 200);
  }

  // ─── Collision: circle-circle, SAT polygon, circle-poly ───────────
  function collideCircleCircle(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 1e-6;
    const minDist = a.radius + b.radius;
    if (dist >= minDist) return null;
    const nx = dx / dist, ny = dy / dist;
    const pen = minDist - dist;
    return { nx, ny, pen, px: a.x + nx * a.radius, py: a.y + ny * a.radius };
  }

  function projectPoly(verts, ax, ay) {
    let min = Infinity, max = -Infinity;
    for (const [x, y] of verts) {
      const p = x * ax + y * ay;
      min = Math.min(min, p); max = Math.max(max, p);
    }
    return [min, max];
  }

  function collidePolyPoly(a, b) {
    const va = a.worldVerts(), vb = b.worldVerts();
    let minPen = Infinity, nx = 0, ny = 0;
    const axes = [];
    const collect = (verts) => {
      for (let i = 0; i < verts.length; i++) {
        const j = (i + 1) % verts.length;
        const ex = verts[j][0] - verts[i][0];
        const ey = verts[j][1] - verts[i][1];
        const L = Math.hypot(ex, ey) || 1;
        axes.push([-ey / L, ex / L]);
      }
    };
    collect(va); collect(vb);
    for (const [ax, ay] of axes) {
      const [minA, maxA] = projectPoly(va, ax, ay);
      const [minB, maxB] = projectPoly(vb, ax, ay);
      if (maxA < minB || maxB < minA) return null;
      const pen = Math.min(maxA - minB, maxB - minA);
      if (pen < minPen) {
        minPen = pen;
        nx = ax; ny = ay;
      }
    }
    // ensure normal points from a -> b
    const dx = b.x - a.x, dy = b.y - a.y;
    if (dx * nx + dy * ny < 0) { nx = -nx; ny = -ny; }
    return { nx, ny, pen: minPen, px: (a.x + b.x) / 2, py: (a.y + b.y) / 2 };
  }

  function collideCirclePoly(circle, poly) {
    const verts = poly.worldVerts();
    let minPen = Infinity, nx = 0, ny = 0;
    // edge axes
    for (let i = 0; i < verts.length; i++) {
      const j = (i + 1) % verts.length;
      const ex = verts[j][0] - verts[i][0];
      const ey = verts[j][1] - verts[i][1];
      const L = Math.hypot(ex, ey) || 1;
      const ax = -ey / L, ay = ex / L;
      const [minP, maxP] = projectPoly(verts, ax, ay);
      const cProj = circle.x * ax + circle.y * ay;
      const minC = cProj - circle.radius, maxC = cProj + circle.radius;
      if (maxP < minC || maxC < minP) return null;
      const pen = Math.min(maxP - minC, maxC - minP);
      if (pen < minPen) { minPen = pen; nx = ax; ny = ay; }
    }
    // closest vertex axis
    let bestD = Infinity, bx = 0, by = 0;
    for (const [vx, vy] of verts) {
      const dx = circle.x - vx, dy = circle.y - vy;
      const d = dx*dx + dy*dy;
      if (d < bestD) { bestD = d; bx = dx; by = dy; }
    }
    {
      const [ax, ay] = norm(bx, by);
      const [minP, maxP] = projectPoly(verts, ax, ay);
      const cProj = circle.x * ax + circle.y * ay;
      const minC = cProj - circle.radius, maxC = cProj + circle.radius;
      if (maxP < minC || maxC < minP) return null;
      const pen = Math.min(maxP - minC, maxC - minP);
      if (pen < minPen) { minPen = pen; nx = ax; ny = ay; }
    }
    const dx = circle.x - poly.x, dy = circle.y - poly.y;
    // normal should push circle out of poly → from poly to circle
    if (dx * nx + dy * ny < 0) { nx = -nx; ny = -ny; }
    return {
      nx, ny, pen: minPen,
      px: circle.x - nx * circle.radius,
      py: circle.y - ny * circle.radius,
    };
  }

  function collide(a, b) {
    if (a.type === "circle" && b.type === "circle") return collideCircleCircle(a, b);
    if (a.type === "circle" && b.type === "polygon") return collideCirclePoly(a, b);
    if (a.type === "polygon" && b.type === "circle") {
      const m = collideCirclePoly(b, a);
      if (!m) return null;
      return { nx: -m.nx, ny: -m.ny, pen: m.pen, px: m.px, py: m.py };
    }
    return collidePolyPoly(a, b);
  }

  function resolveCollision(a, b, man) {
    const { nx, ny, pen, px, py } = man;
    const invSum = a._invMass + b._invMass;
    if (invSum <= 0) return;

    // positional correction
    const percent = 0.72, slop = 0.4;
    const corr = Math.max(pen - slop, 0) / invSum * percent;
    if (!a.static && !a.pinned) { a.x -= nx * corr * a._invMass; a.y -= ny * corr * a._invMass; }
    if (!b.static && !b.pinned) { b.x += nx * corr * b._invMass; b.y += ny * corr * b._invMass; }

    // relative velocity at contact
    const rax = px - a.x, ray = py - a.y;
    const rbx = px - b.x, rby = py - b.y;
    const vax = a.vx - a.omega * ray, vay = a.vy + a.omega * rax;
    const vbx = b.vx - b.omega * rby, vby = b.vy + b.omega * rbx;
    const rvx = vbx - vax, rvy = vby - vay;
    const velAlong = rvx * nx + rvy * ny;
    if (velAlong > 0) return;

    const e = Math.min(a.material.rest, b.material.rest);
    const raCrossN = rax * ny - ray * nx;
    const rbCrossN = rbx * ny - rby * nx;
    const denom = invSum + raCrossN * raCrossN * a._invInertia + rbCrossN * rbCrossN * b._invInertia;
    const j = -(1 + e) * velAlong / (denom || 1);
    const jx = j * nx, jy = j * ny;

    if (!a.static && !a.pinned) {
      a.vx -= jx * a._invMass; a.vy -= jy * a._invMass;
      a.omega -= raCrossN * j * a._invInertia;
    }
    if (!b.static && !b.pinned) {
      b.vx += jx * b._invMass; b.vy += jy * b._invMass;
      b.omega += rbCrossN * j * b._invInertia;
    }

    // friction
    const tx = rvx - velAlong * nx, ty = rvy - velAlong * ny;
    const tLen = Math.hypot(tx, ty);
    if (tLen > 1e-5) {
      const tnx = tx / tLen, tny = ty / tLen;
      const raCrossT = rax * tny - ray * tnx;
      const rbCrossT = rbx * tny - rby * tnx;
      const denomT = invSum + raCrossT * raCrossT * a._invInertia + rbCrossT * rbCrossT * b._invInertia;
      let jt = - (rvx * tnx + rvy * tny) / (denomT || 1);
      const mu = Math.sqrt(a.material.fric * b.material.fric);
      const maxF = Math.abs(j) * mu;
      jt = clamp(jt, -maxF, maxF);
      if (!a.static && !a.pinned) {
        a.vx -= jt * tnx * a._invMass; a.vy -= jt * tny * a._invMass;
        a.omega -= raCrossT * jt * a._invInertia;
      }
      if (!b.static && !b.pinned) {
        b.vx += jt * tnx * b._invMass; b.vy += jt * tny * b._invMass;
        b.omega += rbCrossT * jt * b._invInertia;
      }
    }

    const impact = Math.min(1, Math.abs(velAlong) / 600);
    if (impact > 0.12) {
      a.impactFlash = Math.max(a.impactFlash, impact);
      b.impactFlash = Math.max(b.impactFlash, impact);
      addSpark(px, py, nx, ny, impact);
      if (impact > 0.35) {
        thud(impact);
        shake = Math.max(shake, impact * 4);
      }
    }
  }

  function collideWalls(b) {
    const worldHalfW = 2000, worldHalfH = 1400;
    const floorY = 420;
    const ceilY = -500;
    const leftX = -700, rightX = 700;
    const rest = b.material.rest;
    const fric = b.material.fric;

    const bounceEdge = (axis, pos, normalSign) => {
      // axis: 'x' or 'y'
      if (b.type === "circle") {
        if (axis === "x") {
          const pen = normalSign > 0 ? (leftX + b.radius - b.x) : (b.x + b.radius - rightX);
          // rewritten below per wall
        }
      }
    };

    // Floor
    if (state.floorOn && walls.bottom) {
      if (b.type === "circle") {
        if (b.y + b.radius > floorY) {
          const pen = b.y + b.radius - floorY;
          b.y -= pen;
          if (b.vy > 0) {
            const impact = Math.min(1, b.vy / 700);
            b.vy *= -rest;
            b.vx *= (1 - fric * 0.08);
            b.omega *= (1 - fric * 0.05);
            if (impact > 0.15) {
              b.impactFlash = Math.max(b.impactFlash, impact);
              addSpark(b.x, floorY, 0, -1, impact);
              if (impact > 0.4) { thud(impact); shake = Math.max(shake, impact * 3); }
            }
          }
        }
      } else {
        const vs = b.worldVerts();
        let deepest = 0;
        let cx = 0, n = 0;
        for (const [x, y] of vs) {
          if (y > floorY) {
            const pen = y - floorY;
            if (pen > deepest) deepest = pen;
            cx += x; n++;
          }
        }
        if (deepest > 0) {
          b.y -= deepest;
          if (b.vy > 0) {
            const impact = Math.min(1, b.vy / 700);
            b.vy *= -rest;
            b.vx *= (1 - fric * 0.1);
            b.omega *= (1 - fric * 0.08);
            if (impact > 0.15) {
              b.impactFlash = Math.max(b.impactFlash, impact);
              addSpark(n ? cx / n : b.x, floorY, 0, -1, impact);
            }
          }
        }
      }
    }

    // Left / right walls
    const resolveX = (bound, sign) => {
      // sign: +1 means wall on left (push right), -1 wall on right
      if (b.type === "circle") {
        const edge = b.x - sign * b.radius;
        const pen = sign > 0 ? (bound - edge) : (edge - bound);
        if (pen > 0) {
          b.x += sign * pen;
          if (b.vx * sign < 0) {
            b.vx *= -rest;
            b.vy *= (1 - fric * 0.05);
          }
        }
      } else {
        const vs = b.worldVerts();
        let deepest = 0;
        for (const [x] of vs) {
          const pen = sign > 0 ? (bound - x) : (x - bound);
          if (pen > deepest) deepest = pen;
        }
        if (deepest > 0) {
          b.x += sign * deepest;
          if (b.vx * sign < 0) b.vx *= -rest;
        }
      }
    };
    if (walls.left) resolveX(leftX, +1);
    if (walls.right) resolveX(rightX, -1);

    // Soft ceiling cull / bounce
    if (walls.top) {
      if (b.type === "circle" && b.y - b.radius < ceilY) {
        b.y = ceilY + b.radius;
        if (b.vy < 0) b.vy *= -rest;
      }
    }

    // Despawn far away
    if (Math.abs(b.x) > worldHalfW || b.y > worldHalfH || b.y < -worldHalfH) {
      removeBody(b);
    }
  }

  function solveConstraints(dt) {
    for (const c of constraints) {
      const dx = c.b.x - c.a.x, dy = c.b.y - c.a.y;
      const dist = Math.hypot(dx, dy) || 1e-6;
      const diff = dist - c.rest;
      const [nx, ny] = [dx / dist, dy / dist];
      const inv = c.a._invMass + c.b._invMass;
      if (inv <= 0) continue;
      const stiffness = c.stiffness ?? 0.85;
      const impulse = diff * stiffness / inv;
      if (!c.a.static && !c.a.pinned) {
        c.a.x += nx * impulse * c.a._invMass;
        c.a.y += ny * impulse * c.a._invMass;
      }
      if (!c.b.static && !c.b.pinned) {
        c.b.x -= nx * impulse * c.b._invMass;
        c.b.y -= ny * impulse * c.b._invMass;
      }
      // damp relative velocity along spring
      const rvx = c.b.vx - c.a.vx, rvy = c.b.vy - c.a.vy;
      const vn = rvx * nx + rvy * ny;
      const damp = (c.damping ?? 0.08) * vn / inv;
      if (!c.a.static && !c.a.pinned) {
        c.a.vx += nx * damp * c.a._invMass;
        c.a.vy += ny * damp * c.a._invMass;
      }
      if (!c.b.static && !c.b.pinned) {
        c.b.vx -= nx * damp * c.b._invMass;
        c.b.vy -= ny * damp * c.b._invMass;
      }
    }
  }

  function stepPhysics(dt) {
    const g = state.gravity;
    const sub = 3;
    const h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const b of bodies) {
        if (b.static || b.pinned) {
          b.vx = 0; b.vy = 0; b.omega = 0;
          continue;
        }
        b.vy += g * h;
        b.vx *= (1 - 0.08 * h);
        b.vy *= (1 - 0.02 * h);
        b.omega *= (1 - 0.15 * h);
        b.x += b.vx * h;
        b.y += b.vy * h;
        b.angle += b.omega * h;
        b.age += h;
        b.impactFlash = Math.max(0, b.impactFlash - h * 3);
      }

      // broadphase naive + collisions
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i], b = bodies[j];
          const ba = a.bounds(), bb = b.bounds();
          if (ba.maxX < bb.minX || ba.minX > bb.maxX || ba.maxY < bb.minY || ba.minY > bb.maxY) continue;
          const man = collide(a, b);
          if (man && man.pen > 0) resolveCollision(a, b, man);
        }
      }

      for (let i = bodies.length - 1; i >= 0; i--) collideWalls(bodies[i]);
      solveConstraints(h);
    }

    // grab spring
    if (grab.target && grab.active) {
      const b = grab.target;
      if (!b.pinned && !b.static) {
        const dx = grab.wx - b.x, dy = grab.wy - b.y;
        b.vx += dx * 14 * dt;
        b.vy += dy * 14 * dt;
        b.vx *= 0.88; b.vy *= 0.88;
      }
    }
  }

  // ─── Input ────────────────────────────────────────────────────────
  const pointer = { x: 0, y: 0, down: false, button: 0 };
  const grab = { active: false, target: null, wx: 0, wy: 0 };
  let springPick = null;
  let panning = false;
  let panLast = { x: 0, y: 0 };
  let spawnDrag = null;

  function hideHintSoon() {
    if (state.spawnHintHidden) return;
    state.spawnHintHidden = true;
    setTimeout(() => document.getElementById("hint").classList.add("hide"), 2400);
  }

  canvas.addEventListener("pointerdown", (e) => {
    ensureAudio();
    hideHintSoon();
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.down = true;
    pointer.button = e.button;
    const w = screenToWorld(pointer.x, pointer.y);

    if (e.button === 2 || e.button === 1 || (e.button === 0 && e.altKey)) {
      panning = true;
      panLast = { x: pointer.x, y: pointer.y };
      return;
    }

    if (state.tool === "spawn") {
      if (state.shape === "stack") {
        spawnStack(w.x, w.y);
        blip(520, 0.05, "sine", 0.025);
      } else {
        spawnDrag = { x0: w.x, y0: w.y, x1: w.x, y1: w.y };
      }
    } else if (state.tool === "grab") {
      const hit = pickBody(w.x, w.y);
      if (hit) {
        grab.active = true;
        grab.target = hit;
        grab.wx = w.x; grab.wy = w.y;
        blip(280, 0.04, "sine", 0.02);
      }
    } else if (state.tool === "pin") {
      const hit = pickBody(w.x, w.y);
      if (hit && !hit.static) {
        hit.pinned = !hit.pinned;
        hit.recomputeMass();
        if (hit.pinned) { hit.vx = 0; hit.vy = 0; hit.omega = 0; }
        toast(hit.pinned ? "Pinned" : "Unpinned");
        blip(hit.pinned ? 360 : 220, 0.05);
        addRipple(hit.x, hit.y, hit.material.color);
      }
    } else if (state.tool === "spring") {
      const hit = pickBody(w.x, w.y);
      if (hit) {
        if (!springPick) {
          springPick = hit;
          toast("Select second body");
          blip(400, 0.04);
        } else if (springPick !== hit) {
          const rest = Math.hypot(hit.x - springPick.x, hit.y - springPick.y);
          constraints.push({ a: springPick, b: hit, rest: Math.max(rest, 10), stiffness: 0.9, damping: 0.12 });
          toast("Spring linked");
          blip(560, 0.07, "triangle", 0.03);
          springPick = null;
        }
      }
    } else if (state.tool === "explode") {
      blast(w.x, w.y, 420, 900);
      toast("Impulse blast");
      blip(120, 0.1, "square", 0.035);
      shake = Math.max(shake, 6);
      addRipple(w.x, w.y, [255, 180, 120]);
      burst(w.x, w.y, [255, 180, 120], 24, 320);
    } else if (state.tool === "erase") {
      const hit = pickBody(w.x, w.y);
      if (hit) {
        removeBody(hit);
        blip(180, 0.05, "triangle", 0.025);
      }
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    const w = screenToWorld(pointer.x, pointer.y);
    grab.wx = w.x; grab.wy = w.y;

    if (panning) {
      const dx = pointer.x - panLast.x;
      const dy = pointer.y - panLast.y;
      cam.x -= dx / cam.zoom;
      cam.y -= dy / cam.zoom;
      panLast = { x: pointer.x, y: pointer.y };
      return;
    }

    if (spawnDrag) {
      spawnDrag.x1 = w.x;
      spawnDrag.y1 = w.y;
    }

    if (pointer.down && state.tool === "erase") {
      const hit = pickBody(w.x, w.y);
      if (hit) removeBody(hit);
    }
  });

  canvas.addEventListener("pointerup", (e) => {
    pointer.down = false;
    panning = false;

    if (spawnDrag) {
      const { x0, y0, x1, y1 } = spawnDrag;
      const dx = x0 - x1, dy = y0 - y1; // throw opposite to drag (sling)
      const throwPower = clamp(Math.hypot(dx, dy) * 3.2, 0, 1400);
      const body = spawnBody(x0, y0, {
        vx: dx * 3.2,
        vy: dy * 3.2,
      });
      if (throwPower > 80) blip(480 + throwPower * 0.05, 0.05, "sine", 0.025);
      spawnDrag = null;
    }

    if (grab.active) {
      grab.active = false;
      grab.target = null;
    }
  });

  canvas.addEventListener("pointercancel", () => {
    pointer.down = false;
    panning = false;
    spawnDrag = null;
    grab.active = false;
    grab.target = null;
  });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey) {
      const old = cam.zoom;
      cam.zoom = clamp(cam.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.35, 2.4);
      // zoom toward pointer
      const w = screenToWorld(pointer.x, pointer.y);
      const w2 = screenToWorld(pointer.x, pointer.y);
      cam.x += w.x - w2.x;
      cam.y += w.y - w2.y;
      void old;
    } else {
      state.size = clamp(state.size + (e.deltaY > 0 ? -2 : 2), 12, 72);
      syncSliders();
    }
  }, { passive: false });

  function pickBody(wx, wy) {
    for (let i = bodies.length - 1; i >= 0; i--) {
      if (bodies[i].contains(wx, wy)) return bodies[i];
    }
    return null;
  }

  function blast(x, y, radius, force) {
    for (const b of bodies) {
      if (b.static || b.pinned) continue;
      const dx = b.x - x, dy = b.y - y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > radius) continue;
      const falloff = 1 - d / radius;
      const f = force * falloff * falloff * b._invMass * 40;
      b.vx += (dx / d) * f;
      b.vy += (dy / d) * f;
      b.omega += rand(-3, 3) * falloff;
      b.impactFlash = Math.max(b.impactFlash, falloff);
    }
  }

  // ─── UI wiring ────────────────────────────────────────────────────
  const toastEl = document.getElementById("toast");
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  function setTool(t) {
    state.tool = t;
    document.querySelectorAll(".tool").forEach((b) => b.classList.toggle("active", b.dataset.tool === t));
    springPick = null;
    const hints = {
      spawn: "Click-drag to fling · Scroll resizes · Stack builds a pyramid",
      grab: "Drag bodies to throw them around",
      pin: "Click a body to pin or unpin it in place",
      spring: "Click two bodies to link them with a spring",
      explode: "Click to unleash a radial impulse",
      erase: "Click or drag to remove bodies",
    };
    const hint = document.getElementById("hint");
    hint.textContent = hints[t] || "";
    hint.classList.remove("hide");
    state.spawnHintHidden = false;
    hideHintSoon();
  }

  document.getElementById("tools").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-tool]");
    if (btn) setTool(btn.dataset.tool);
  });

  document.getElementById("shapes").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-shape]");
    if (!btn) return;
    state.shape = btn.dataset.shape;
    document.querySelectorAll(".shape").forEach((b) => b.classList.toggle("active", b === btn));
    if (state.tool !== "spawn") setTool("spawn");
  });

  document.getElementById("mats").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-mat]");
    if (!btn) return;
    state.mat = btn.dataset.mat;
    document.querySelectorAll(".mat").forEach((b) => b.classList.toggle("active", b === btn));
    toast(MATERIALS[state.mat].name + " material");
  });

  function syncSliders() {
    document.getElementById("gravity").value = state.gravity;
    document.getElementById("gravityVal").textContent = String(state.gravity);
    document.getElementById("timescale").value = Math.round(state.timescale * 100);
    document.getElementById("timescaleVal").textContent = state.timescale.toFixed(2) + "×";
    document.getElementById("size").value = state.size;
    document.getElementById("sizeVal").textContent = String(state.size);
    document.getElementById("statScale").textContent = (state.paused ? 0 : (state.slowmo ? state.timescale * 0.28 : state.timescale)).toFixed(2) + "×";
  }

  document.getElementById("gravity").addEventListener("input", (e) => {
    state.gravity = +e.target.value;
    syncSliders();
  });
  document.getElementById("timescale").addEventListener("input", (e) => {
    state.timescale = +e.target.value / 100;
    syncSliders();
  });
  document.getElementById("size").addEventListener("input", (e) => {
    state.size = +e.target.value;
    syncSliders();
  });

  document.getElementById("btnPause").addEventListener("click", togglePause);
  document.getElementById("btnSlow").addEventListener("click", () => {
    state.slowmo = !state.slowmo;
    document.getElementById("btnSlow").classList.toggle("active", state.slowmo);
    toast(state.slowmo ? "Slow motion" : "Normal speed");
    syncSliders();
  });
  document.getElementById("btnRain").addEventListener("click", rainBodies);
  document.getElementById("btnFloor").addEventListener("click", () => {
    state.floorOn = !state.floorOn;
    toast(state.floorOn ? "Floor on" : "Floor off");
  });
  document.getElementById("btnClear").addEventListener("click", clearWorld);
  document.getElementById("btnDemo").addEventListener("click", loadDemo);

  function togglePause() {
    state.paused = !state.paused;
    const btn = document.getElementById("btnPause");
    btn.innerHTML = state.paused ? "▶ Resume <span class=\"kbd\">Space</span>" : "⏸ Pause <span class=\"kbd\">Space</span>";
    toast(state.paused ? "Paused" : "Running");
    syncSliders();
  }

  function clearWorld() {
    bodies.length = 0;
    constraints.length = 0;
    particles.length = 0;
    sparks.length = 0;
    ripples.length = 0;
    springPick = null;
    toast("Scene cleared");
    blip(200, 0.06);
  }

  function rainBodies() {
    const shapes = ["circle", "box", "tri", "hex"];
    const mats = Object.keys(MATERIALS);
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const x = rand(-500, 500);
        const y = rand(-420, -180);
        spawnBody(x, y, {
          shape: shapes[i % shapes.length],
          mat: mats[i % mats.length],
          size: rand(14, 34),
          vx: rand(-40, 40),
          vy: rand(0, 40),
        });
      }, i * 45);
    }
    toast("Material rain");
  }

  function loadDemo() {
    clearWorld();
    cam.x = 0; cam.y = 80; cam.zoom = 1;
    state.floorOn = true;
    state.gravity = 980;
    syncSliders();

    // Newton's cradle-ish row
    const mats = ["metal", "metal", "metal", "metal", "metal"];
    for (let i = 0; i < 5; i++) {
      const x = -120 + i * 48;
      const y = 80;
      const ball = spawnBody(x, y, { shape: "circle", size: 22, mat: "metal", vx: 0, vy: 0 });
      const anchor = spawnBody(x, -40, { shape: "circle", size: 6, mat: "metal", pinned: true, vx: 0, vy: 0 });
      anchor.static = false;
      constraints.push({ a: anchor, b: ball, rest: 120, stiffness: 0.98, damping: 0.02 });
    }
    // cue ball
    setTimeout(() => {
      const cue = bodies.find((b) => b.type === "circle" && !b.pinned && Math.abs(b.x + 120) < 5);
      if (cue) cue.vx = 420;
    }, 400);

    // soft pile
    for (let i = 0; i < 8; i++) {
      spawnBody(-380 + (i % 4) * 40, 360 - Math.floor(i / 4) * 36, {
        shape: "box", size: 18, mat: "soft", vx: 0, vy: 0,
      });
    }

    // ice ramp pieces
    for (let i = 0; i < 6; i++) {
      spawnBody(280 + i * 36, 200 - i * 18, {
        shape: "box", size: 20, mat: "ice", vx: 0, vy: 0, angle: -0.35,
      });
    }

    // rubber bouncers
    spawnBody(420, 360, { shape: "circle", size: 40, mat: "rubber", vx: 0, vy: 0 });
    spawnBody(520, 300, { shape: "hex", size: 28, mat: "rubber", vx: 0, vy: 0 });

    toast("Demo scene loaded");
    blip(660, 0.08, "sine", 0.03);
  }

  window.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); togglePause(); }
    else if (k === "1") setTool("spawn");
    else if (k === "2") setTool("grab");
    else if (k === "3") setTool("pin");
    else if (k === "4") setTool("spring");
    else if (k === "5") setTool("explode");
    else if (k === "6") setTool("erase");
    else if (k === "q") { state.shape = "circle"; document.querySelectorAll(".shape").forEach((b) => b.classList.toggle("active", b.dataset.shape === "circle")); }
    else if (k === "w") { state.shape = "box"; document.querySelectorAll(".shape").forEach((b) => b.classList.toggle("active", b.dataset.shape === "box")); }
    else if (k === "e") { state.shape = "tri"; document.querySelectorAll(".shape").forEach((b) => b.classList.toggle("active", b.dataset.shape === "tri")); }
    else if (k === "t") { state.shape = "hex"; document.querySelectorAll(".shape").forEach((b) => b.classList.toggle("active", b.dataset.shape === "hex")); }
    else if (k === "r" && !e.ctrlKey && !e.metaKey) clearWorld();
    else if (k === "d") loadDemo();
    else if (k === "f") { state.floorOn = !state.floorOn; toast(state.floorOn ? "Floor on" : "Floor off"); }
    else if (k === "shift") { state.slowmo = true; syncSliders(); }
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "Shift") { state.slowmo = false; syncSliders(); }
  });

  // ─── Rendering ────────────────────────────────────────────────────
  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a0e1a");
    g.addColorStop(0.55, "#0b1020");
    g.addColorStop(1, "#080b14");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars / dust in screen space with parallax
    ctx.save();
    for (const s of stars) {
      const px = ((s.x * W * 1.4 + cam.x * 0.02 * cam.zoom) % W + W) % W;
      const py = ((s.y * H * 1.4 + cam.y * 0.02 * cam.zoom) % H + H) % H;
      const tw = 0.55 + 0.45 * Math.sin(t * 0.0015 + s.tw);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = "#c8d6ff";
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // nebula washes
    ctx.save();
    ctx.globalAlpha = 0.35;
    const n1 = ctx.createRadialGradient(W * 0.2, H * 0.15, 0, W * 0.2, H * 0.15, W * 0.45);
    n1.addColorStop(0, "rgba(90,120,255,0.25)");
    n1.addColorStop(1, "transparent");
    ctx.fillStyle = n1;
    ctx.fillRect(0, 0, W, H);
    const n2 = ctx.createRadialGradient(W * 0.85, H * 0.25, 0, W * 0.85, H * 0.25, W * 0.4);
    n2.addColorStop(0, "rgba(167,139,250,0.18)");
    n2.addColorStop(1, "transparent");
    ctx.fillStyle = n2;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function withCamera(fn) {
    ctx.save();
    let sx = 0, sy = 0;
    if (shake > 0.01) {
      sx = rand(-shake, shake);
      sy = rand(-shake, shake);
    }
    ctx.translate(W / 2 + sx, H / 2 + sy);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);
    fn();
    ctx.restore();
  }

  function drawGrid() {
    const step = 48;
    const ba = {
      minX: cam.x - W / 2 / cam.zoom - step,
      maxX: cam.x + W / 2 / cam.zoom + step,
      minY: cam.y - H / 2 / cam.zoom - step,
      maxY: cam.y + H / 2 / cam.zoom + step,
    };
    ctx.beginPath();
    ctx.strokeStyle = "rgba(130,160,255,0.05)";
    ctx.lineWidth = 1 / cam.zoom;
    for (let x = Math.floor(ba.minX / step) * step; x < ba.maxX; x += step) {
      ctx.moveTo(x, ba.minY); ctx.lineTo(x, ba.maxY);
    }
    for (let y = Math.floor(ba.minY / step) * step; y < ba.maxY; y += step) {
      ctx.moveTo(ba.minX, y); ctx.lineTo(ba.maxX, y);
    }
    ctx.stroke();

    // major axes
    ctx.beginPath();
    ctx.strokeStyle = "rgba(130,160,255,0.12)";
    ctx.moveTo(ba.minX, 0); ctx.lineTo(ba.maxX, 0);
    ctx.moveTo(0, ba.minY); ctx.lineTo(0, ba.maxY);
    ctx.stroke();
  }

  function drawFloor() {
    if (!state.floorOn) return;
    const y = 420;
    const x0 = -700, x1 = 700;

    // glow strip
    const grad = ctx.createLinearGradient(0, y - 40, 0, y + 80);
    grad.addColorStop(0, "rgba(110,168,255,0)");
    grad.addColorStop(0.45, "rgba(110,168,255,0.05)");
    grad.addColorStop(0.5, "rgba(167,139,250,0.18)");
    grad.addColorStop(1, "rgba(8,10,18,0.0)");
    ctx.fillStyle = grad;
    ctx.fillRect(x0, y - 40, x1 - x0, 140);

    ctx.strokeStyle = "rgba(170,190,255,0.35)";
    ctx.lineWidth = 2 / cam.zoom;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();

    // ticks
    ctx.strokeStyle = "rgba(170,190,255,0.12)";
    ctx.lineWidth = 1 / cam.zoom;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 40) {
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 10);
    }
    ctx.stroke();

    // side walls
    ctx.strokeStyle = "rgba(170,190,255,0.2)";
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0, -500);
    ctx.moveTo(x1, y);
    ctx.lineTo(x1, -500);
    ctx.stroke();
  }

  function rgba(c, a) {
    return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  }

  function drawBody(b, t) {
    const mat = b.material;
    const c = mat.color;
    const flash = b.impactFlash;
    const alpha = b.life < 1 ? clamp(b.life, 0, 1) : 1;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    ctx.globalAlpha = alpha;

    // soft glow
    if (mat.glow > 0.05) {
      ctx.beginPath();
      const R = b.type === "circle" ? b.radius * 1.8 : Math.max(b.hw, b.hh) * 2.2;
      const g = ctx.createRadialGradient(0, 0, R * 0.15, 0, 0, R);
      g.addColorStop(0, rgba(c, 0.18 * mat.glow));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.arc(0, 0, R, 0, TAU);
      ctx.fill();
    }

    ctx.beginPath();
    if (b.type === "circle") {
      ctx.arc(0, 0, b.radius, 0, TAU);
    } else {
      const vs = b.verts;
      ctx.moveTo(vs[0][0], vs[0][1]);
      for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i][0], vs[i][1]);
      ctx.closePath();
    }

    const bodyGrad = ctx.createLinearGradient(-30, -30, 40, 40);
    const lift = flash * 60;
    bodyGrad.addColorStop(0, rgba([
      clamp(c[0] + 40 + lift, 0, 255),
      clamp(c[1] + 40 + lift, 0, 255),
      clamp(c[2] + 40 + lift, 0, 255),
    ], 0.92));
    bodyGrad.addColorStop(1, rgba([
      clamp(c[0] - 30 + b.hueShift, 0, 255),
      clamp(c[1] - 20 + b.hueShift, 0, 255),
      clamp(c[2] - 10, 0, 255),
    ], 0.95));
    ctx.fillStyle = bodyGrad;
    ctx.fill();

    ctx.strokeStyle = rgba([255, 255, 255], 0.22 + flash * 0.4);
    ctx.lineWidth = (1.5 + flash) / cam.zoom;
    ctx.stroke();

    // specular
    ctx.beginPath();
    if (b.type === "circle") {
      ctx.ellipse(-b.radius * 0.28, -b.radius * 0.32, b.radius * 0.35, b.radius * 0.22, -0.5, 0, TAU);
    } else {
      ctx.ellipse(-Math.max(b.hw, 10) * 0.35, -Math.max(b.hh, 10) * 0.35, 8, 5, -0.4, 0, TAU);
    }
    ctx.fillStyle = rgba([255, 255, 255], 0.18 + flash * 0.2);
    ctx.fill();

    // pin marker
    if (b.pinned) {
      ctx.beginPath();
      ctx.arc(0, 0, 4 / cam.zoom, 0, TAU);
      ctx.fillStyle = "#ffb86b";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1 / cam.zoom;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawConstraints() {
    for (const c of constraints) {
      const dx = c.b.x - c.a.x, dy = c.b.y - c.a.y;
      const dist = Math.hypot(dx, dy) || 1;
      const stretch = dist / c.rest;
      const tension = clamp(Math.abs(stretch - 1) * 2, 0, 1);
      ctx.beginPath();
      ctx.moveTo(c.a.x, c.a.y);
      ctx.lineTo(c.b.x, c.b.y);
      ctx.strokeStyle = rgba(
        [110 + tension * 120, 168 - tension * 80, 255 - tension * 100],
        0.45 + tension * 0.35
      );
      ctx.lineWidth = (1.5 + tension) / cam.zoom;
      ctx.stroke();

      // coil hints
      const coils = 8;
      ctx.beginPath();
      for (let i = 0; i <= coils; i++) {
        const t = i / coils;
        const px = lerp(c.a.x, c.b.x, t);
        const py = lerp(c.a.y, c.b.y, t);
        const ox = -dy / dist * Math.sin(t * Math.PI * coils) * (6 + tension * 4);
        const oy = dx / dist * Math.sin(t * Math.PI * coils) * (6 + tension * 4);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px + ox, py + oy);
      }
      ctx.strokeStyle = rgba([167, 139, 250], 0.35);
      ctx.lineWidth = 1 / cam.zoom;
      ctx.stroke();
    }
  }

  function drawFX(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += state.gravity * 0.15 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.98; p.vy *= 0.98;
      const a = p.life / p.max;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, TAU);
      ctx.fillStyle = rgba(p.color, a * 0.85);
      ctx.fill();
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      const a = s.life / s.max;
      const len = 8 + s.intensity * 18;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.nx * len * a, s.y + s.ny * len * a);
      ctx.strokeStyle = rgba([255, 230, 180], a * 0.9);
      ctx.lineWidth = (1.5 + s.intensity * 2) / cam.zoom;
      ctx.stroke();
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      const a = r.life / r.max;
      r.r += 80 * dt;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.strokeStyle = rgba(r.color, a * 0.45);
      ctx.lineWidth = (2 * a) / cam.zoom;
      ctx.stroke();
    }
  }

  function drawOverlays() {
    // spawn aim
    if (spawnDrag) {
      const { x0, y0, x1, y1 } = spawnDrag;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.setLineDash([6 / cam.zoom, 6 / cam.zoom]);
      ctx.lineWidth = 1.5 / cam.zoom;
      ctx.stroke();
      ctx.setLineDash([]);

      // predicted velocity arrow (sling)
      const dx = x0 - x1, dy = y0 - y1;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + dx, y0 + dy);
      ctx.strokeStyle = "rgba(110,168,255,0.7)";
      ctx.lineWidth = 2 / cam.zoom;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x0, y0, state.size, 0, TAU);
      ctx.strokeStyle = "rgba(110,168,255,0.5)";
      ctx.stroke();
    }

    // grab tether
    if (grab.active && grab.target) {
      ctx.beginPath();
      ctx.moveTo(grab.target.x, grab.target.y);
      ctx.lineTo(grab.wx, grab.wy);
      ctx.strokeStyle = "rgba(94,234,212,0.55)";
      ctx.lineWidth = 2 / cam.zoom;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(grab.wx, grab.wy, 6 / cam.zoom, 0, TAU);
      ctx.fillStyle = "rgba(94,234,212,0.8)";
      ctx.fill();
    }

    // spring pick highlight
    if (springPick) {
      ctx.beginPath();
      ctx.arc(springPick.x, springPick.y, (springPick.radius || 24) + 8, 0, TAU);
      ctx.strokeStyle = "rgba(167,139,250,0.7)";
      ctx.lineWidth = 2 / cam.zoom;
      ctx.stroke();
    }

    // cursor preview for spawn
    if (state.tool === "spawn" && !spawnDrag && !pointer.down) {
      const w = screenToWorld(pointer.x, pointer.y);
      ctx.beginPath();
      ctx.arc(w.x, w.y, state.size, 0, TAU);
      const c = MATERIALS[state.mat].color;
      ctx.strokeStyle = rgba(c, 0.35);
      ctx.setLineDash([4 / cam.zoom, 4 / cam.zoom]);
      ctx.lineWidth = 1.2 / cam.zoom;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (state.tool === "explode") {
      const w = screenToWorld(pointer.x, pointer.y);
      ctx.beginPath();
      ctx.arc(w.x, w.y, 60, 0, TAU);
      ctx.strokeStyle = "rgba(255,107,138,0.35)";
      ctx.setLineDash([5 / cam.zoom, 5 / cam.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ─── Main loop ────────────────────────────────────────────────────
  let last = performance.now();
  let fpsAccum = 0, fpsFrames = 0, fpsDisplay = 60;

  function frame(now) {
    const rawDt = Math.min(0.033, (now - last) / 1000);
    last = now;

    let scale = state.paused ? 0 : state.timescale;
    if (state.slowmo) scale *= 0.28;
    const dt = rawDt * scale;

    if (dt > 0) stepPhysics(dt);
    shake = Math.max(0, shake - rawDt * 12);

    // FX life even when paused (visual only at low rate)
    const fxDt = state.paused ? rawDt * 0.35 : dt || rawDt * 0.5;

    drawBackground(now);
    withCamera(() => {
      drawGrid();
      drawFloor();
      drawConstraints();
      for (const b of bodies) drawBody(b, now);
      drawFX(Math.max(fxDt, rawDt * 0.2));
      drawOverlays();
    });

    // HUD stats
    fpsAccum += rawDt;
    fpsFrames++;
    if (fpsAccum >= 0.4) {
      fpsDisplay = Math.round(fpsFrames / fpsAccum);
      fpsAccum = 0; fpsFrames = 0;
      document.getElementById("statFps").textContent = String(fpsDisplay);
    }
    document.getElementById("statBodies").textContent = String(bodies.length);
    document.getElementById("statScale").textContent =
      (state.paused ? 0 : (state.slowmo ? state.timescale * 0.28 : state.timescale)).toFixed(2) + "×";

    requestAnimationFrame(frame);
  }

  // ─── Boot ─────────────────────────────────────────────────────────
  syncSliders();
  cam.y = 80;

  // Opening composition
  spawnBody(-40, 200, { shape: "circle", size: 32, mat: "rubber", vx: 80, vy: -120 });
  spawnBody(80, 160, { shape: "hex", size: 26, mat: "ice", vx: -30, vy: -40 });
  spawnBody(200, 300, { shape: "box", size: 24, mat: "metal", vx: 0, vy: 0 });
  spawnBody(-180, 320, { shape: "tri", size: 28, mat: "soft", vx: 40, vy: -20 });
  spawnBody(320, 100, { shape: "circle", size: 18, mat: "rubber", vx: -60, vy: 20 });

  // gentle intro pin + spring
  const a = spawnBody(-300, 50, { shape: "circle", size: 16, mat: "metal", pinned: true, vx: 0, vy: 0 });
  const b = spawnBody(-300, 180, { shape: "circle", size: 20, mat: "metal", vx: 120, vy: 0 });
  constraints.push({ a, b, rest: 130, stiffness: 0.95, damping: 0.05 });

  requestAnimationFrame(frame);

  // Fade hint later if untouched
  setTimeout(() => {
    if (!state.spawnHintHidden) hideHintSoon();
  }, 7000);
})();
</script>
</body>
